  "summary": {
    "en": "Pipe / Vessel Transients — dynamic rigid-vessel depressurisation for ideal gas or superheated steam through an orifice, Kv/Cv valve or lumped-loss pipe, with wall heat transfer and target-pressure event detection. Optional steam mode continues the vessel inventory through the saturation dome as a homogeneous-equilibrium water/steam mixture.",
    "uk": "Pipe / Vessel Transients — динамічне зниження тиску в жорсткій посудині для ідеального газу або перегрітої пари через отвір, клапан Kv/Cv чи трубопровід із зосередженими втратами; теплообмін зі стінкою та подія за цільовим тиском. Опційний режим для пари продовжує inventory посудини в куполі насичення як однорідну рівноважну суміш вода–пара.",

    "es": "Pipe / Vessel Transients — despresurización dinámica de un recipiente rígido con gas ideal o vapor sobrecalentado mediante orificio, válvula Kv/Cv o tubería con pérdidas concentradas, con transferencia térmica de pared y evento de presión objetivo. Un modo de vapor opcional continúa el inventario del recipiente dentro de la campana de saturación como mezcla homogénea en equilibrio agua–vapor.",

  "description": {
    "en": "Adaptive transient mass/energy balance for one well-mixed rigid vessel and one discharge path. Vessel thermodynamics are ideal gas or IAPWS-IF97 Region-2 steam. The wall may be adiabatic or have finite thermal capacitance with vessel-side and ambient UA. The outlet may be an orifice, an equivalent Kv/Cv valve, or a pipe represented by Darcy friction plus local K losses. Choked/subcritical transition is detected continuously; integration terminates on target pressure; the default steam-vessel mode stops at saturation, while the optional equilibrium-inventory mode continues inside the saturation dome. For steam discharge, the isentrope continues through the official IF97 metastable-vapour supplement when needed, limited to 5% equilibrium moisture; choking is located from velocity = IF97 sound speed. Optional hybrid mode continues the nozzle path beyond the metastable-vapour 5% equilibrium-moisture limit with an isentropic homogeneous-equilibrium (HEM) steam-water mixture and finds the maximum mass flux along that equilibrium branch; the vessel state may optionally continue after saturation as a homogeneous equilibrium two-phase inventory using IF97 saturated liquid/vapour properties.",
    "uk": "Адаптивний нестаціонарний баланс маси та енергії для однієї добре перемішаної жорсткої посудини й одного тракту скидання. Термодинаміка: ідеальний газ або пара IAPWS-IF97 Region 2. Стінка може бути адіабатичною або мати скінченну теплоємність з UA до середовища й газу. Випуск: отвір, еквівалентний клапан Kv/Cv або трубопровід із тертям Darcy та місцевими K. Перехід choked/subcritical відстежується безперервно; інтегрування припиняється за цільовим тиском або на межі насичення пари. Для скидання пари ізоентропа за потреби продовжується офіційним IF97-доповненням для метастабільної пари до межі 5% рівноважної вологості; choking визначається умовою швидкість = швидкість звуку IF97. Опційний hybrid-режим продовжує соплову ізоентропу за 5%-межею рівноважної вологості метастабільної пари як однорідну рівноважну (HEM) пароводяну суміш і знаходить максимум масового потоку на цій гілці; за вибором inventory посудини після насичення продовжується як однорідна рівноважна двофазна суміш; якість x визначається жорстким об’ємним constraint з насиченими властивостями IF97 Regions 1/2.",
    "de": "Adaptiver instationärer Massen- und Energiehaushalt für einen gut gemischten starren Behälter und einen Entlastungspfad. Thermodynamik: ideales Gas oder IAPWS-IF97-Region-2-Dampf. Die Wand ist adiabatisch oder besitzt endliche Wärmekapazität mit UA zur Umgebung und zum Fluid. Auslass: Blende, äquivalentes Kv/Cv-Ventil oder Rohr mit Darcy-Reibung und lokalen K-Verlusten. Der Übergang gesperrt/unterkritisch wird kontinuierlich erkannt; Abbruch bei Zieldruck oder Dampfsättigungsgrenze. Bei Dampfaustritt wird die Isentrope bei Bedarf mit der offiziellen IF97-Ergänzung für metastabilen Dampf bis zur Grenze von 5 % Gleichgewichtsfeuchte fortgesetzt; der Sperrpunkt folgt aus Geschwindigkeit = IF97-Schallgeschwindigkeit. Ein optionaler Hybridmodus setzt den Düsenpfad jenseits der 5%-Gleichgewichtsfeuchte-Grenze des metastabilen Dampfes als isentrope homogene Gleichgewichts-(HEM)-Dampf/Wasser-Mischung fort und bestimmt dort den maximalen Massenfluss; wahlweise wird das Behälterinventar nach Erreichen der Sättigung als homogene Zweiphasen-Gleichgewichtsmischung fortgesetzt; x folgt aus dem starren Volumen mit IF97-Sättigungswerten aus Region 1/2.",
    "nl": "Adaptieve transiënte massa- en energiebalans voor één goed gemengd star vat en één afblaaspad. Thermodynamica: ideaal gas of IAPWS-IF97 Region-2 stoom. De wand kan adiabatisch zijn of een eindige warmtecapaciteit hebben met UA naar omgeving en fluïdum. Uitlaat: orifice, equivalente Kv/Cv-klep of leiding met Darcy-wrijving en lokale K-verliezen. De overgang choked/subkritisch wordt continu bepaald; de integratie stopt bij de doeldruk of de verzadigingsgrens van stoom. Voor stoomafvoer wordt de isentroop zo nodig voortgezet met de officiële IF97-aanvulling voor metastabiele damp tot de grens van 5% evenwichtsvocht; choking volgt uit snelheid = IF97-geluidssnelheid. Een optionele hybridemodus zet het nozzlepad voorbij de 5%-grens voor evenwichtsvocht van metastabiele damp voort als een isentroop homogeen-evenwichtsmodel (HEM) voor stoom/water en zoekt daar de maximale massaflux; optioneel wordt de vatinhoud na verzadiging voortgezet als homogeen tweefasen-evenwicht; x volgt uit het starre volume met IF97-verzadigingseigenschappen uit Region 1/2.",
    "fr": "Bilan massique et énergétique transitoire adaptatif pour une enceinte rigide parfaitement mélangée et une seule voie de décharge. Thermodynamique : gaz parfait ou vapeur IAPWS-IF97 région 2. La paroi peut être adiabatique ou avoir une capacité thermique finie avec UA côté fluide et ambiance. Sortie : orifice, vanne Kv/Cv équivalente ou conduite avec frottement de Darcy et pertes K. La transition critique/sous-critique est détectée en continu; arrêt à la pression cible ou à la limite de saturation vapeur. Pour la décharge de vapeur, l’isentrope est prolongée si nécessaire par le supplément IF97 officiel pour vapeur métastable, limité à 5 % d’humidité d’équilibre ; le blocage est défini par vitesse = célérité IF97. Un mode hybride optionnel prolonge la trajectoire de tuyère au-delà de la limite de 5 % d’humidité d’équilibre de la vapeur métastable par un mélange eau-vapeur homogène à l’équilibre (HEM) isentropique et recherche le flux massique maximal sur cette branche ; l’enceinte reste monophasique en région 2.",
    "es": "Balance transitorio adaptativo de masa y energía para un recipiente rígido perfectamente mezclado y una sola vía de descarga. Termodinámica: gas ideal o vapor IAPWS-IF97 Región 2. La pared puede ser adiabática o tener capacidad térmica finita con UA al fluido y al ambiente. Salida: orificio, válvula Kv/Cv equivalente o tubería con fricción Darcy y pérdidas K. La transición crítica/subcrítica se detecta continuamente; la integración termina en la presión objetivo o en el límite de saturación del vapor. Para descarga de vapor, la isentrópica continúa cuando es necesario con el suplemento oficial IF97 de vapor metaestable, limitado al 5 % de humedad de equilibrio; el bloqueo se localiza por velocidad = velocidad del sonido IF97. Un modo híbrido opcional continúa la trayectoria de la tobera más allá del límite del 5 % de humedad de equilibrio del vapor metaestable mediante una mezcla agua-vapor homogénea en equilibrio (HEM) e isentrópica, buscando el flujo másico máximo en esa rama; el recipiente sigue siendo monofásico Región 2.",
    "pl": "Adaptacyjny nieustalony bilans masy i energii dla jednego dobrze mieszanego sztywnego zbiornika i jednej drogi upustu. Termodynamika: gaz doskonały albo para IAPWS-IF97 Region 2. Ścianka może być adiabatyczna lub mieć skończoną pojemność cieplną z UA do płynu i otoczenia. Wylot: kryza, zastępczy zawór Kv/Cv lub rurociąg z tarciem Darcy’ego i stratami miejscowymi K. Przejście krytyczne/podkrytyczne jest wykrywane ciągle; całkowanie kończy się przy ciśnieniu docelowym lub granicy nasycenia pary. Dla upustu pary izentropa jest w razie potrzeby kontynuowana oficjalnym uzupełnieniem IF97 dla pary metastabilnej do granicy 5% wilgotności równowagowej; dławienie wyznacza warunek prędkość = prędkość dźwięku IF97. Opcjonalny tryb hybrydowy prowadzi tor dyszy poza granicę 5% wilgotności równowagowej pary metastabilnej jako izentropową jednorodną mieszaninę równowagową (HEM) para–woda i wyznacza maksimum strumienia masy na tej gałęzi; opcjonalnie zawartość zbiornika po osiągnięciu nasycenia jest kontynuowana jako jednorodna równowaga dwufazowa; x wynika ze sztywnej objętości i właściwości nasycenia IF97 Region 1/2."
  },
  "status": "prototype",
  "independent_validation": false,
  "limitations": {
    "en": "One rigid well-mixed vessel, one pure fluid and one discharge path. Ideal gas uses constant R and gamma. Steam starts as superheated IF97 Region 2 at p <= 10 MPa. Vessel phase model is selectable: default single-phase stops at saturation; optional equilibrium inventory uses saturated liquid Region 1 and saturated vapour Region 2, with quality fixed by V/m, and stops at the saturated-liquid limit. That branch assumes instantaneous phase equilibrium, zero slip, no stratification and homogeneous withdrawal. Steam nozzle is selectable between the official metastable Region-2 path to x_eq >= 0.95 and a hybrid that then switches to isentropic equilibrium HEM; this artificial switch is not a non-equilibrium flashing model. Kv/Cv is an equivalent area and pipe loss is lumped Darcy+K, not distributed Fanno. No mixtures, non-equilibrium nucleation, entrainment/separation, connected headers/vessels, relief-valve dynamics, fire heat input or wall phase change. HEM experimental comparisons elsewhere in this project show substantial errors in parts of the small-nozzle envelope; independent_validation remains false. An initial pressure is accepted, typed or arriving through the SI handoff, above the higher of target and back pressure and up to 100 MPa for ideal gas, the Region-2 ceiling above applying in steam mode; a value outside that range is refused by name with the range and nothing is applied for it, and the other handoff quantities are held to the bounds of their own typed fields.",
    "uk": "Одна жорстка добре перемішана посудина, одна чиста речовина й один тракт скидання. Ідеальний газ використовує сталі R і gamma. Пара стартує як перегріта IF97 Region 2 при p <= 10 MPa. Фазова модель посудини вибирається: базова однофазна зупиняється на насиченні; опційний equilibrium-inventory використовує насичену рідину Region 1 і насичену пару Region 2, а якість визначається V/m, зі зупинкою на межі насиченої рідини. Ця гілка передбачає миттєву фазову рівновагу, нульовий slip, відсутність стратифікації та однорідний відбір. Сопло: офіційна metastable Region-2 гілка до x_eq >= 0.95 або hybrid з подальшим ізоентропічним HEM; штучне перемикання не є моделлю нерівноважного flashing. Kv/Cv — еквівалентна площа; трубопровід — lumped Darcy+K, не Fanno. Без сумішей, нерівноважної нуклеації, entrainment/separation, з’єднаних header/посудин, динаміки relief valve, пожежного теплоприпливу та фазового переходу стінки. Зовнішні HEM-порівняння в проєкті показують значні похибки в частині малосоплового діапазону; independent_validation=false. Початковий тиск приймається, введений або отриманий через SI-передавання, вище за більший із цільового тиску та протитиску і до 100 MPa для ідеального газу, а в режимі пари діє наведена вище межа Region 2; значення поза цим діапазоном відхиляється з назвою величини та діапазоном і для нього нічого не застосовується, а інші величини передавання обмежені межами власних полів введення.",
    "de": "Ein starrer gut gemischter Behälter, ein Reinstoff und ein Entlastungspfad. Idealgas mit konstantem R und gamma. Dampf startet überhitzt in IF97 Region 2 bei p <= 10 MPa. Behälterphasenmodell wählbar: Standard einphasig mit Stopp an Sättigung; optionales Gleichgewichtsinventar mit gesättigter Flüssigkeit Region 1 und gesättigtem Dampf Region 2, x aus V/m, bis zur Sattflüssigkeitsgrenze. Diese Zweiphasenbahn setzt sofortiges Phasengleichgewicht, keinen Schlupf, keine Schichtung und homogene Entnahme voraus. Düse: offizielle metastabile Region-2-Bahn bis x_eq >= 0,95 oder Hybrid mit anschließendem isentropem HEM; der künstliche Wechsel ist kein Nichtgleichgewichts-Flashmodell. Kv/Cv als Ersatzfläche, Rohr als konzentriertes Darcy+K, nicht Fanno. Keine Gemische, Nichtgleichgewichts-Nukleation, Mitriss/Phasentrennung, gekoppelten Header/Behälter, Ventildynamik, Brandwärme oder Wandphasenwechsel. Externe HEM-Vergleiche im Projekt zeigen in Teilen des Klein-Düsen-Bereichs große Fehler; independent_validation=false. Ein Anfangsdruck wird angenommen, eingegeben oder über die SI-Übergabe eintreffend, oberhalb des größeren Wertes aus Zieldruck und Gegendruck und bis 100 MPa für Idealgas; im Dampfmodus gilt die oben genannte Region-2-Grenze. Ein Wert außerhalb dieses Bereichs wird mit Namen und Bereich abgewiesen und nichts davon übernommen; die übrigen Übergabegrößen halten die Grenzen ihrer eigenen Eingabefelder.",
    "nl": "Eén star goed gemengd vat, één zuivere stof en één afblaaspad. Ideaal gas met constante R en gamma. Stoom start oververhit in IF97 Region 2 bij p <= 10 MPa. Vatfasemodel is kiesbaar: standaard eenfasig met stop bij verzadiging; optioneel evenwichtsinventaris met verzadigde vloeistof Region 1 en verzadigde damp Region 2, x uit V/m, tot de verzadigde-vloeistofgrens. Deze tweefasentak veronderstelt onmiddellijk fase-evenwicht, nul slip, geen stratificatie en homogene afvoer. Nozzle: officiële metastabiele Region-2-tak tot x_eq >= 0,95 of hybride met daarna isentroop HEM; de kunstmatige overgang is geen niet-evenwichts-flashingmodel. Kv/Cv is equivalente oppervlakte; leidingverlies is lumped Darcy+K, geen Fanno. Geen mengsels, niet-evenwichtsnucleatie, entrainment/separatie, gekoppelde headers/vaten, klepdynamiek, brandwarmte of wandfaseverandering. Externe HEM-vergelijkingen in dit project tonen grote fouten in delen van het kleine-nozzlebereik; independent_validation=false. Een begindruk wordt aanvaard, getypt of via de SI-overdracht binnengekomen, boven de hoogste van doeldruk en tegendruk en tot 100 MPa voor ideaal gas; in stoommodus geldt de hierboven genoemde Region-2-grens. Een waarde buiten dat bereik wordt met naam en bereik geweigerd en er wordt niets van toegepast; de overige overdrachtsgrootheden houden de grenzen van hun eigen invoervelden.",
    "fr": "Une enceinte rigide parfaitement mélangée, un fluide pur et une seule voie de décharge. Gaz parfait à R et gamma constants. La vapeur démarre surchauffée en IF97 région 2 à p <= 10 MPa. Modèle de phase d’enceinte au choix : monophasique par défaut avec arrêt à saturation ; inventaire d’équilibre optionnel avec liquide saturé région 1 et vapeur saturée région 2, x imposé par V/m, jusqu’à la limite liquide saturé. Cette branche suppose équilibre de phase instantané, glissement nul, absence de stratification et soutirage homogène. Tuyère : branche métastable officielle région 2 jusqu’à x_eq >= 0,95, ou hybride poursuivi par HEM isentropique ; la commutation artificielle n’est pas un modèle de flashing hors équilibre. Kv/Cv est converti en section équivalente ; la conduite reste Darcy+K global, pas Fanno distribué. Pas de mélanges, nucléation hors équilibre, entraînement/séparation, headers/enceintes couplés, dynamique de soupape, apport feu ni changement de phase de paroi. Les comparaisons HEM externes du projet montrent de fortes erreurs sur une partie du domaine des petites tuyères ; independent_validation=false. Une pression initiale est acceptée, saisie ou reçue par le transfert SI, au-dessus de la plus grande des pressions cible et de contre-pression et jusqu’à 100 MPa pour le gaz parfait ; en mode vapeur la limite région 2 indiquée plus haut s’applique. Une valeur hors de cette plage est refusée avec son nom et la plage, et rien n’en est appliqué ; les autres grandeurs du transfert respectent les bornes de leurs propres champs de saisie.",
    "es": "Un recipiente rígido perfectamente mezclado, un fluido puro y una vía de descarga. Gas ideal con R y gamma constantes. El vapor parte sobrecalentado en IF97 Región 2 con p <= 10 MPa. Modelo de fase del recipiente seleccionable: por defecto monofásico con parada en saturación; inventario de equilibrio opcional con líquido saturado Región 1 y vapor saturado Región 2, x fijado por V/m, hasta el límite de líquido saturado. Esta rama supone equilibrio de fase instantáneo, slip nulo, sin estratificación y descarga homogénea. Tobera: rama metaestable oficial Región 2 hasta x_eq >= 0,95 o híbrida seguida de HEM isentrópico; el cambio artificial no es un modelo de flashing no equilibrado. Kv/Cv se convierte a área equivalente; la tubería es Darcy+K global, no Fanno distribuido. Sin mezclas, nucleación no equilibrada, arrastre/separación, headers/recipientes conectados, dinámica de válvula, aporte de incendio ni cambio de fase de pared. Las comparaciones HEM externas del proyecto muestran errores grandes en parte del dominio de toberas pequeñas; independent_validation=false. Se acepta una presión inicial, escrita o recibida por la transferencia SI, por encima de la mayor entre la presión objetivo y la contrapresión y hasta 100 MPa para gas ideal; en modo vapor rige el límite de la Región 2 indicado arriba. Un valor fuera de ese rango se rechaza con su nombre y el rango y nada de él se aplica; las demás magnitudes de la transferencia respetan los límites de sus propios campos de entrada.",
    "pl": "Jeden sztywny dobrze mieszany zbiornik, jeden czysty płyn i jedna droga upustu. Gaz doskonały ze stałymi R i gamma. Para startuje jako przegrzana IF97 Region 2 przy p <= 10 MPa. Model fazowy zbiornika jest wybieralny: domyślnie jednofazowy ze stopem przy nasyceniu; opcjonalny zapas równowagowy używa cieczy nasyconej Region 1 i pary nasyconej Region 2, x wynika z V/m, do granicy cieczy nasyconej. Ta gałąź zakłada natychmiastową równowagę faz, zerowy slip, brak stratyfikacji i jednorodny odpływ. Dysza: oficjalna metastabilna gałąź Region 2 do x_eq >= 0,95 albo hybryda z dalszym izentropowym HEM; sztuczne przełączenie nie jest modelem nierównowagowego flashingu. Kv/Cv jest polem zastępczym; rurociąg to skupione Darcy+K, nie Fanno. Bez mieszanin, nierównowagowej nukleacji, porywania/separacji faz, połączonych headerów/zbiorników, dynamiki zaworu, ciepła pożaru i przemiany fazowej ścianki. Zewnętrzne porównania HEM w projekcie wykazują duże błędy w części zakresu małych dysz; independent_validation=false. Ciśnienie początkowe jest przyjmowane, wpisane albo otrzymane przez przekazanie SI, powyżej większego z ciśnienia docelowego i przeciwciśnienia oraz do 100 MPa dla gazu doskonałego; w trybie pary obowiązuje podana wyżej granica Region 2. Wartość poza tym zakresem jest odrzucana z nazwą i zakresem i nic z niej nie jest stosowane, a pozostałe wielkości przekazania trzymają granice własnych pól wpisu."

  "validation": {
    "basis": {
      "en": "The adiabatic ideal-gas rigid-vessel limit is verified against closed mass/temperature/pressure relations and discharged-energy closure in QA-VESSEL-BLOWDOWN-2026-09-04.json. QA-VESSEL-BLOWDOWN-METASTABLE-IF97-2026-09-05.json verifies the official IF97 metastable-vapour supplement against all three Table 18 program points (maximum relative difference 3.22e-9 versus rounded published values), the direct saturation-temperature Eq. (31) against Table 36 (1.05e-9), browser/Python sonic-nozzle parity across stable and metastable states (<=1.2e-15), and transient parity including target, vessel-saturation and 5%-moisture validity-boundary cases (maximum 1.57e-8). IAPWS states that the metastable equation is based on extrapolated stable-region input because no experimental fitting data were available; the coupled steam blowdown/nozzle model is therefore not independently validated. Revision v1.8 adds an optional hybrid nozzle branch that continues after the metastable 5%-moisture guard with the standard isentropic HEM relations x=(s0-sf)/sfg, h=hf+x hfg, v=(1-x)vf+xvg and G=sqrt(2(h0-h))/v; browser/Python parity and independent pressure-grid maximization are recorded in QA-VESSEL-BLOWDOWN-HYBRID-HEM-2026-09-05.json. This verifies implementation/numerics, not experimental accuracy of the hybrid switch. Revision v1.9 adds optional equilibrium two-phase vessel inventory using IF97 Regions 1/2 on the saturation line. QA-VESSEL-BLOWDOWN-TWO-PHASE-INVENTORY-2026-09-05.json verifies Region-1 Table-5 program points (max 2.81e-9 relative to rounded published values), exact regression of four v1.8 single-phase cases, browser/Python parity in three two-phase scenarios (max 2.89e-8), and adiabatic energy-closure residual <=4.99e-4 of initial U with an internal two-phase rtol ceiling of 5e-6. This is numerical/property verification, not experimental validation of HEM vessel blowdown. Parameter-sweep implementation is additionally verified against the exact ideal-gas V/A time-scaling invariance and against the generated Worker program in an isolated VM. DiagramCompute workload metadata declares the transient solves as ode-event inside an ensemble; QA-VESSEL-BLOWDOWN-DIAGRAMCOMPUTE-PRIMITIVES-2026-09-05.json verifies this against canonical runtime v0.33.0. Revision v1.11 corrects two solver relations. discharge() solves the pipe resistance relation mdot = mdot_nozzle/sqrt(1+K(mdot)) on the bracket [0, mdot_nozzle]; over 14823 pipe configurations spanning D 10-200 mm, sum K 0-2000 and L 0.2-5000 m the relation closes to 4.54e-13 kg/s, except at 35 configurations whose root falls on the Re = 2300 step of the friction correlation. In the equilibrium two-phase inventory the saturated-vapour crossing is placed on a step boundary and the energy partials are taken on one side of it; the terminal time of the shipped two-phase case moves from 94.0369 s to 94.1803 s, its adiabatic energy residual from 5.78e-4 to 4.50e-6 of initial internal energy, and successive halvings of dtMax change it by 6.81e-4 s then 2.33e-4 s. The embedded Python export carries the same changes and agrees with the page to 7.75e-10 relative over four scenarios.",
      "uk": "Адіабатичну межу жорсткої посудини з ідеальним газом перевірено за замкненими залежностями маси/температури/тиску та балансом відведеної енергії у QA-VESSEL-BLOWDOWN-2026-09-04.json. QA-VESSEL-BLOWDOWN-METASTABLE-IF97-2026-09-05.json перевіряє офіційне IF97-доповнення для метастабільної пари за всіма трьома контрольними точками Table 18 (максимальна відносна різниця 3.22e-9 відносно опублікованих округлених значень), пряму формулу температури насичення Eq. (31) за Table 36 (1.05e-9), browser/Python parity sonic-nozzle для стабільних і метастабільних станів (<=1.2e-15) та transient parity для target, межі насичення в посудині й 5%-межі вологості (максимум 1.57e-8). IAPWS зазначає, що метастабільне рівняння побудовано на екстрапольованих даних стабільної області через відсутність експериментальних даних для підгонки; тому повна парова blowdown/nozzle модель не має незалежної валідації. Revision v1.8 додає опційний hybrid-сопловий branch: після 5%-межі metastable він використовує стандартні ізоентропічні HEM-залежності x=(s0-sf)/sfg, h=hf+x hfg, v=(1-x)vf+xvg та G=sqrt(2(h0-h))/v; browser/Python parity і незалежна перевірка максимуму на густій сітці тиску записані в QA-VESSEL-BLOWDOWN-HYBRID-HEM-2026-09-05.json. Це перевіряє реалізацію/числа, а не експериментальну точність hybrid-переходу. Revision v1.9 додає опційний рівноважний двофазний inventory посудини з IF97 Regions 1/2 на лінії насичення. QA-VESSEL-BLOWDOWN-TWO-PHASE-INVENTORY-2026-09-05.json перевіряє точки Region-1 Table 5 (макс. 2.81e-9 відносно опублікованих округлених значень), точну регресію чотирьох однофазних сценаріїв v1.8, browser/Python parity у трьох двофазних сценаріях (макс. 2.89e-8) та залишок адіабатичного енергобалансу <=4.99e-4 від початкового U при внутрішньому ceiling rtol=5e-6. Це чисельна/властивісна перевірка, не експериментальна валідація HEM blowdown. Реалізацію параметричного sweep додатково перевірено за точною часовою інваріантністю V/A для ідеального газу та за згенерованою Worker-програмою в ізольованій VM. Метадані workload DiagramCompute оголошують transient-розв’язання як ode-event усередині ensemble; QA-VESSEL-BLOWDOWN-DIAGRAMCOMPUTE-PRIMITIVES-2026-09-05.json перевіряє це за канонічним runtime v0.33.0. Ревізія v1.11 виправляє два співвідношення розв’язувача. discharge() розв’язує співвідношення опору труби mdot = mdot_сопла/sqrt(1+K(mdot)) на відрізку [0, mdot_сопла]; на 14823 конфігураціях труби з D 10-200 мм, сумою K 0-2000 та L 0,2-5000 м співвідношення замикається до 4,54e-13 кг/с, окрім 35 конфігурацій, корінь яких припадає на стрибок кореляції тертя при Re = 2300. У рівноважному двофазному інвентарі перетин лінії насиченої пари поставлено на межу кроку, а енергетичні похідні беруться з одного її боку; кінцевий час штатного двофазного випадку змінюється з 94,0369 с на 94,1803 с, його адіабатична енергетична нев’язка — з 5,78e-4 на 4,50e-6 початкової внутрішньої енергії, а послідовні половинення dtMax змінюють його на 6,81e-4 с, потім на 2,33e-4 с. Вбудований експорт Python несе ті самі зміни й збігається зі сторінкою до 7,75e-10 відносних на чотирьох сценаріях.",
      "de": "Der adiabatische Idealgas-Grenzfall des starren Behälters ist in QA-VESSEL-BLOWDOWN-2026-09-04.json gegen geschlossene Massen-/Temperatur-/Druckbeziehungen und die Energiebilanz verifiziert. QA-VESSEL-BLOWDOWN-METASTABLE-IF97-2026-09-05.json prüft die offizielle IF97-Ergänzung für metastabilen Dampf an allen drei Programmpunkten der Tabelle 18 (maximale relative Abweichung 3,22e-9 gegenüber den gerundeten veröffentlichten Werten), die direkte Sättigungstemperaturgleichung (31) an Tabelle 36 (1,05e-9), Browser/Python-Parität des Schall-Düsenmodells in stabilen und metastabilen Zuständen (<=1,2e-15) sowie die Transientenparität für Zieldruck-, Behältersättigungs- und 5%-Feuchtegrenzfälle (maximal 1,57e-8). IAPWS weist darauf hin, dass die metastabile Gleichung mangels experimenteller Anpassungsdaten auf extrapolierten Eingabewerten aus dem stabilen Bereich basiert; das gekoppelte Dampf-Blowdown/Düsenmodell ist daher nicht unabhängig validiert. Revision v1.8 ergänzt optional eine Hybrid-Düsenbahn, die nach der 5%-Grenze der metastabilen Ergänzung mit den isentropen HEM-Beziehungen x=(s0-sf)/sfg, h=hf+x hfg, v=(1-x)vf+xvg und G=sqrt(2(h0-h))/v fortsetzt; Browser/Python-Parität und eine unabhängige dichte Druckgitter-Maximierung stehen in QA-VESSEL-BLOWDOWN-HYBRID-HEM-2026-09-05.json. Damit sind Implementierung und Numerik, nicht die experimentelle Genauigkeit des Umschaltmodells, geprüft. Revision v1.9 ergänzt ein optionales Zweiphasen-Gleichgewichtsinventar mit IF97 Region 1/2 auf der Sättigungslinie. QA-VESSEL-BLOWDOWN-TWO-PHASE-INVENTORY-2026-09-05.json prüft Region-1-Tabelle-5-Punkte (max. 2,81e-9 relativ zu gerundeten Publikationswerten), exakte Regression von vier einphasigen v1.8-Fällen, Browser/Python-Parität in drei Zweiphasenfällen (max. 2,89e-8) und adiabatische Energiebilanzabweichung <=4,99e-4 von U0 bei internem rtol-Ceiling 5e-6. Dies ist numerische/Stoffwert-Verifikation, keine experimentelle HEM-Blowdown-Validierung. Der Parametersweep ist zusätzlich gegen die exakte V/A-Zeitskalierung des Idealgases und gegen das erzeugte Worker-Programm in einer isolierten VM verifiziert. Die DiagramCompute-Workload-Metadaten deklarieren die Transientenlösungen als ode-event innerhalb eines Ensembles; QA-VESSEL-BLOWDOWN-DIAGRAMCOMPUTE-PRIMITIVES-2026-09-05.json prüft dies gegen die kanonische Runtime v0.33.0. Revision v1.11 korrigiert zwei Löserbeziehungen. discharge() löst die Rohrwiderstandsbeziehung mdot = mdot_Düse/sqrt(1+K(mdot)) auf dem Intervall [0, mdot_Düse]; über 14823 Rohrkonfigurationen mit D 10-200 mm, Summe K 0-2000 und L 0,2-5000 m schließt die Beziehung bis 4,54e-13 kg/s, außer bei 35 Konfigurationen, deren Wurzel auf den Sprung der Reibungskorrelation bei Re = 2300 fällt. Im Gleichgewichts-Zweiphasen-Inventar liegt der Übergang zur gesättigten Dampflinie auf einer Schrittgrenze und die Energieableitungen werden einseitig gebildet; die Endzeit des ausgelieferten Zweiphasenfalls ändert sich von 94,0369 s auf 94,1803 s, ihr adiabatisches Energieresiduum von 5,78e-4 auf 4,50e-6 der anfänglichen inneren Energie, und aufeinanderfolgende Halbierungen von dtMax ändern sie um 6,81e-4 s und dann 2,33e-4 s. Der eingebettete Python-Export trägt dieselben Änderungen und stimmt mit der Seite bis 7,75e-10 relativ über vier Szenarien überein.",
      "nl": "De adiabatische ideaal-gaslimiet van het starre vat is in QA-VESSEL-BLOWDOWN-2026-09-04.json geverifieerd tegen gesloten massa-/temperatuur-/drukrelaties en de afgevoerde-energiebalans. QA-VESSEL-BLOWDOWN-METASTABLE-IF97-2026-09-05.json verifieert de officiële IF97-aanvulling voor metastabiele damp tegen alle drie programmaverificatiepunten van tabel 18 (maximale relatieve afwijking 3,22e-9 ten opzichte van de afgeronde gepubliceerde waarden), de directe verzadigingstemperatuurvergelijking (31) tegen tabel 36 (1,05e-9), browser/Python-pariteit van de sonische nozzle in stabiele en metastabiele toestanden (<=1,2e-15), en transiëntpariteit voor doel-, vatverzadigings- en 5%-vochtgrensgevallen (maximaal 1,57e-8). IAPWS vermeldt dat de metastabiele vergelijking wegens het ontbreken van experimentele fitdata is gebaseerd op geëxtrapoleerde invoer uit het stabiele gebied; het gekoppelde stoom-blowdown/nozzlemodel is daarom niet onafhankelijk gevalideerd. Revision v1.8 voegt een optionele hybride nozzletak toe die na de 5%-metastabiele grens doorgaat met de isentrope HEM-relaties x=(s0-sf)/sfg, h=hf+x hfg, v=(1-x)vf+xvg en G=sqrt(2(h0-h))/v; browser/Python-pariteit en een onafhankelijke dichte drukraster-maximalisatie staan in QA-VESSEL-BLOWDOWN-HYBRID-HEM-2026-09-05.json. Dit verifieert implementatie/numeriek gedrag, niet de experimentele nauwkeurigheid van de modelschakeling. Revisie v1.9 voegt een optionele tweefasen-evenwichtsinventaris toe met IF97 Region 1/2 op de verzadigingslijn. QA-VESSEL-BLOWDOWN-TWO-PHASE-INVENTORY-2026-09-05.json verifieert Region-1-tabel-5-punten (max. 2,81e-9 t.o.v. afgeronde publicatiewaarden), exacte regressie van vier eenfasige v1.8-gevallen, browser/Python-pariteit in drie tweefasengevallen (max. 2,89e-8) en adiabatische energiebalansrest <=4,99e-4 van U0 met intern rtol-plafond 5e-6. Dit is numerieke/eigenschapsverificatie, geen experimentele HEM-blowdownvalidatie. De parametersweep is aanvullend geverifieerd tegen de exacte V/A-tijdschaalinvariantie van het ideale gas en tegen het gegenereerde Worker-programma in een geïsoleerde VM. De DiagramCompute-workloadmetadata declareren de transiënte oplossingen als ode-event binnen een ensemble; QA-VESSEL-BLOWDOWN-DIAGRAMCOMPUTE-PRIMITIVES-2026-09-05.json verifieert dit tegen de canonieke runtime v0.33.0. Revisie v1.11 corrigeert twee oplosserrelaties. discharge() lost de leidingweerstandsrelatie mdot = mdot_nozzle/sqrt(1+K(mdot)) op binnen het interval [0, mdot_nozzle]; over 14823 leidingconfiguraties met D 10-200 mm, som K 0-2000 en L 0,2-5000 m sluit de relatie tot 4,54e-13 kg/s, behalve bij 35 configuraties waarvan de wortel op de sprong van de wrijvingscorrelatie bij Re = 2300 valt. In het evenwichts-tweefaseninventaris ligt de overgang naar verzadigde damp op een stapgrens en worden de energieafgeleiden eenzijdig genomen; de eindtijd van het meegeleverde tweefasengeval verschuift van 94,0369 s naar 94,1803 s, het adiabatische energieresidu van 5,78e-4 naar 4,50e-6 van de initiële inwendige energie, en opeenvolgende halveringen van dtMax veranderen die met 6,81e-4 s en daarna 2,33e-4 s. De ingebedde Python-export draagt dezelfde wijzigingen en komt over vier scenario's tot 7,75e-10 relatief overeen met de pagina.",
      "fr": "La limite adiabatique du réservoir rigide à gaz parfait est vérifiée dans QA-VESSEL-BLOWDOWN-2026-09-04.json par les relations fermées masse/température/pression et la fermeture du bilan d’énergie évacuée. QA-VESSEL-BLOWDOWN-METASTABLE-IF97-2026-09-05.json vérifie le supplément IF97 officiel pour vapeur métastable aux trois points de contrôle du tableau 18 (écart relatif maximal de 3,22e-9 par rapport aux valeurs publiées arrondies), l’équation directe de température de saturation (31) au tableau 36 (1,05e-9), la parité navigateur/Python de la tuyère sonique en états stables et métastables (<=1,2e-15), et la parité transitoire pour les cas de pression cible, saturation de l’enceinte et limite de 5 % d’humidité (maximum 1,57e-8). IAPWS indique que l’équation métastable repose sur des données extrapolées de la région stable faute de données expérimentales d’ajustement ; le modèle couplé de blowdown/tuyère vapeur n’est donc pas validé indépendamment. La révision v1.8 ajoute une branche de tuyère hybride optionnelle qui, après la limite métastable de 5 %, poursuit avec les relations HEM isentropiques x=(s0-sf)/sfg, h=hf+x hfg, v=(1-x)vf+xvg et G=sqrt(2(h0-h))/v ; la parité navigateur/Python et une maximisation indépendante sur grille de pression dense sont consignées dans QA-VESSEL-BLOWDOWN-HYBRID-HEM-2026-09-05.json. Cela vérifie l’implémentation et la numérisation, pas la précision expérimentale du basculement. La révision v1.9 ajoute un inventaire diphasique d’équilibre optionnel avec IF97 régions 1/2 sur la ligne de saturation. QA-VESSEL-BLOWDOWN-TWO-PHASE-INVENTORY-2026-09-05.json vérifie les points région 1 table 5 (max. 2,81e-9 par rapport aux valeurs publiées arrondies), la régression exacte de quatre cas v1.8 monophasés, la parité navigateur/Python sur trois cas diphasiques (max. 2,89e-8) et un résidu de bilan énergétique adiabatique <=4,99e-4 de U0 avec plafond rtol interne 5e-6. Il s’agit de vérification numérique/propriétés, pas d’une validation expérimentale du blowdown HEM. Le balayage paramétrique est en plus vérifié par l’invariance exacte d’échelle temporelle V/A du gaz parfait et par le programme Worker généré dans une VM isolée. Les métadonnées de charge DiagramCompute déclarent les résolutions transitoires comme ode-event au sein d’un ensemble ; QA-VESSEL-BLOWDOWN-DIAGRAMCOMPUTE-PRIMITIVES-2026-09-05.json le vérifie avec le runtime canonique v0.33.0. La révision v1.11 corrige deux relations du solveur. discharge() résout la relation de résistance de conduite mdot = mdot_tuyère/sqrt(1+K(mdot)) sur l’intervalle [0, mdot_tuyère] ; sur 14823 configurations de conduite couvrant D 10-200 mm, somme K 0-2000 et L 0,2-5000 m, la relation se referme à 4,54e-13 kg/s, sauf pour 35 configurations dont la racine tombe sur le saut de la corrélation de frottement à Re = 2300. Dans l’inventaire diphasique à l’équilibre, le franchissement de la vapeur saturée est placé sur une frontière de pas et les dérivées énergétiques sont prises d’un seul côté ; le temps terminal du cas diphasique livré passe de 94,0369 s à 94,1803 s, son résidu énergétique adiabatique de 5,78e-4 à 4,50e-6 de l’énergie interne initiale, et les demi-pas successifs de dtMax le modifient de 6,81e-4 s puis 2,33e-4 s. L’export Python intégré porte les mêmes changements et concorde avec la page à 7,75e-10 relatif sur quatre scénarios.",
      "es": "El límite adiabático del recipiente rígido con gas ideal se verifica en QA-VESSEL-BLOWDOWN-2026-09-04.json frente a relaciones cerradas de masa/temperatura/presión y al cierre de energía descargada. QA-VESSEL-BLOWDOWN-METASTABLE-IF97-2026-09-05.json verifica el suplemento oficial IF97 para vapor metaestable con los tres puntos de comprobación de la Tabla 18 (diferencia relativa máxima 3,22e-9 frente a valores publicados redondeados), la ecuación directa de temperatura de saturación (31) con la Tabla 36 (1,05e-9), la paridad navegador/Python de la tobera sónica en estados estables y metaestables (<=1,2e-15) y la paridad transitoria para casos de presión objetivo, saturación del recipiente y límite de 5 % de humedad (máximo 1,57e-8). IAPWS indica que la ecuación metaestable se basa en entradas extrapoladas de la región estable porque no había datos experimentales para ajustarla; por ello el modelo acoplado de blowdown/tobera de vapor no está validado independientemente. La revisión v1.8 añade una rama híbrida opcional de tobera que, tras el límite metaestable del 5 %, continúa con las relaciones HEM isentrópicas x=(s0-sf)/sfg, h=hf+x hfg, v=(1-x)vf+xvg y G=sqrt(2(h0-h))/v; la paridad navegador/Python y una maximización independiente sobre una malla densa de presión se registran en QA-VESSEL-BLOWDOWN-HYBRID-HEM-2026-09-05.json. Esto verifica implementación y numerics, no la precisión experimental del cambio de modelo. La revisión v1.9 añade un inventario bifásico de equilibrio opcional con IF97 Regiones 1/2 sobre la línea de saturación. QA-VESSEL-BLOWDOWN-TWO-PHASE-INVENTORY-2026-09-05.json verifica puntos de Región 1 Tabla 5 (máx. 2,81e-9 respecto a valores publicados redondeados), regresión exacta de cuatro casos monofásicos v1.8, paridad navegador/Python en tres casos bifásicos (máx. 2,89e-8) y residuo del balance energético adiabático <=4,99e-4 de U0 con techo interno rtol=5e-6. Es verificación numérica/de propiedades, no validación experimental del blowdown HEM. El barrido paramétrico se verifica además frente a la invariancia exacta de escala temporal V/A del gas ideal y frente al programa Worker generado en una VM aislada. Los metadatos de carga de DiagramCompute declaran las soluciones transitorias como ode-event dentro de un ensemble; QA-VESSEL-BLOWDOWN-DIAGRAMCOMPUTE-PRIMITIVES-2026-09-05.json lo verifica contra el runtime canónico v0.33.0. La revisión v1.11 corrige dos relaciones del solver. discharge() resuelve la relación de resistencia de tubería mdot = mdot_tobera/sqrt(1+K(mdot)) en el intervalo [0, mdot_tobera]; sobre 14823 configuraciones de tubería con D 10-200 mm, suma K 0-2000 y L 0,2-5000 m la relación cierra a 4,54e-13 kg/s, salvo en 35 configuraciones cuya raíz cae en el salto de la correlación de fricción en Re = 2300. En el inventario bifásico en equilibrio el cruce de vapor saturado se sitúa en una frontera de paso y las derivadas energéticas se toman de un solo lado; el tiempo terminal del caso bifásico entregado pasa de 94,0369 s a 94,1803 s, su residuo energético adiabático de 5,78e-4 a 4,50e-6 de la energía interna inicial, y las sucesivas mitades de dtMax lo cambian en 6,81e-4 s y luego 2,33e-4 s. La exportación Python incorporada lleva los mismos cambios y coincide con la página hasta 7,75e-10 relativo en cuatro escenarios.",

      var y = Yof(groups[1])(v);
      if (y < padT - 0.5 || y > padT + H + 0.5) return;
      ctx.beginPath(); ctx.moveTo(padL + W, y); ctx.lineTo(padL + W + 4, y); ctx.stroke();
      ctx.fillText(fmt(v), padL + W + 7, y);
    });
  }
  // X axis.
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  tick(xmin, xmax).forEach(function (v) {
    var x = X(v);
    if (x < padL - 0.5 || x > padL + W + 0.5) return;
    ctx.beginPath(); ctx.moveTo(x, padT + H); ctx.lineTo(x, padT + H + 4); ctx.stroke();
    ctx.fillText(fmt(v), x, padT + H + 7);
  });

  // Axis titles carry the unit, so a reader never has to guess the scale.
  ctx.fillStyle = text; ctx.font = '500 ' + f2 + 'px ' + font;
  var xTitle = (spec.x && spec.x.label ? spec.x.label : '') + (spec.x && spec.x.unit ? ', ' + spec.x.unit : '');
  if (xTitle) { ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText(xTitle, padL + W / 2, h - (spec.series.length > 1 ? 20 * fs : 5 * fs)); }
  function axisTitle(g, right) {
    var t = (g.series.length === 1 && g.series[0].label ? g.series[0].label : (g.title || '')) + (g.unit ? ', ' + g.unit : '');
    if (!t) return;
    // Both titles are rotated so their glyphs fall inside the canvas: after the
    // rotation a 'top' baseline places them toward the plot, either way.
    ctx.save(); ctx.translate(right ? w - 3 * fs : 13 * fs, padT + H / 2);
    ctx.rotate(right ? Math.PI / 2 : -Math.PI / 2);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(t, 0, 0); ctx.restore();
  }
  axisTitle(groups[0], false); if (hasRight) axisTitle(groups[1], true);

  // Curves.
  var colors = opt.colors || ['#1f6feb', '#d1651a', '#2f9e44', '#9333ea', '#0891b2'];
  var idx = 0, legend = [];
  groups.forEach(function (g, gi) {
    var Y = Yof(g);
    g.series.forEach(function (s) {
      var col = s.color || colors[idx % colors.length];
      legend.push({ label: s.label || '', unit: g.unit, color: col, dash: gi === 1 });
      ctx.strokeStyle = col; ctx.lineWidth = 2 * fs; ctx.lineJoin = 'round';
      ctx.setLineDash(gi === 1 ? [6 * fs, 4 * fs] : []);
      ctx.beginPath(); var began = false;
      for (var i = 0; i < s.x.length; i++) {
        var xv = s.x[i], yv = s.y[i];
        if (!isFinite(xv) || !isFinite(yv)) { began = false; continue; }
        var px = X(xv), py = Y(yv);
        if (!began) { ctx.moveTo(px, py); began = true; } else ctx.lineTo(px, py);
      }
      ctx.stroke(); ctx.setLineDash([]);
      idx++;
    });
  });

  // Legend, only when more than one curve is on the plot.
  if (legend.length > 1) {
    ctx.font = '400 ' + f1 + 'px ' + font; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    var items = legend.map(function (l) { return { l: l, w: ctx.measureText(l.label + (l.unit ? ', ' + l.unit : '')).width + 26 * fs }; });
    var total = items.reduce(function (a, b) { return a + b.w; }, 0);
    var cx = padL + Math.max(0, (W - total) / 2), cy = h - 6 * fs;
    items.forEach(function (it) {
      ctx.strokeStyle = it.l.color; ctx.lineWidth = 2 * fs;
      ctx.setLineDash(it.l.dash ? [6 * fs, 4 * fs] : []);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + 18 * fs, cy); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = text; ctx.fillText(it.l.label + (it.l.unit ? ', ' + it.l.unit : ''), cx + 22 * fs, cy);
      cx += it.w;
    });
  }
  return { drawn: idx, skipped: skipped };
}

 ckFlow:"Schließung der Entlastungsbeziehung",
 ckFlowB:"Der Massenstrom im Endzustand wird aus der werkzeugeigenen Pfadbeziehung neu berechnet und mit dem vom Löser verwendeten Wert verglichen. Blende und Ventil sind algebraisch. Der Rohrpfad löst mdot = mdot_Düse / sqrt(1 + K(mdot)) auf dem Intervall [0, mdot_Düse], dessen eigenes Abbruchkriterium 1·10⁻¹² · max(1, mdot) lautet; dieses Kriterium gilt hier.",
 ckWindow:"Zieldruck innerhalb des Fensters",
 ckWindowB:"Der Löser hält beim Zieldruckereignis, an einer Modellgrenze oder bei der maximalen Simulationszeit an. Welches davon den Lauf beendete, entscheidet, ob die ausgewiesene Zeit eine Entspannungszeit ist.",
 ckRegime:"Entlastungsregime im Endzustand",
 ckRegimeB:"Gegendruck zu Behälterdruck gegen das kritische Verhältnis, das das Entlastungsmodell zurückgab. Darunter ist der Pfad gesperrt und der Strom allein vom Behälterzustand bestimmt. Der Idealgaszweig nimmt das Verhältnis aus (2/(γ+1))^(γ/(γ−1)); der Dampfzweig aus dem Druck maximaler Massenstromdichte entlang der Isentrope.",
 ckConv:"Konvergenz bei Verfeinerung der Unterteilung",
 ckConvB:"Derselbe Fall erneut mit halbem und mit viertel maximalem Zeitschritt gelöst. Das Endereignis wird durch 24 Halbierungen eines akzeptierten Schrittes eingegrenzt, eine Änderung unter dt_max · 2⁻²⁴ ist daher Lokalisierungsrauschen. Oberhalb dieser Schwelle muss die Änderung zwischen aufeinanderfolgenden Unterteilungen innerhalb der vorherigen bleiben.",
 ckScaleA:"Zeitskalierung mit der Restriktionsgröße",
 ckScaleAB:"Für ein ideales Gas im adiabatischen Behälter ist der Massenstrom bei gegebenem Behälterzustand proportional zur Restriktionsgröße, das Produkt aus Entspannungszeit und Restriktionsgröße ist somit invariant. Der Fall wird bei halber, einfacher und doppelter ausgelieferter Restriktion gelöst. Akzeptiert wird die paarweise Streuung von 2·10⁻⁸, die das Manifest dieses Werkzeugs für dieselbe Invariante festhält.",
 ckScaleV:"Zeitskalierung mit dem Volumen",
 ckScaleVB:"Die Entlastungsbeziehung sieht das Behältervolumen nicht, für ein ideales Gas im adiabatischen Behälter ist die Entspannungszeit daher proportional zum Volumen. Der Fall wird bei halbem, einfachem und doppeltem ausgeliefertem Volumen gelöst, und die Streuung von Zeit durch Volumen wird gegen dieselbe festgehaltene Akzeptanz von 2·10⁻⁸ gemessen.",

 riskModelT:"Modellgrenzen",
 riskModel:"Ein Behälter, ein Reinstoff, ein Entlastungspfad. Verbundene Behälter und Sammelleitungen, Brandwärmeeintrag, Sicherheitsventilmechanik, Phasenschlupf und Flüssigkeitsstand liegen außerhalb des Modells.",
 riskPipeT:"Konzentrierter Rohrwiderstand",
 riskPipe:"Der Rohrpfad ist ein konzentrierter Darcy-Weisbach-Widerstand mit Summe der Einzelverluste, angewandt als Faktor auf eine Düsenströmung. Verteilte kompressible und Fanno-Effekte liegen außerhalb dieser Revision.",

nl:{title:"Vatontlasting — transiënte drukafbouw van een star vat",
 summary:"Een star, goed gemengd vat van {V} m³ met {fluid} bij {p0} bar en {T0} °C blaast af via {path} tegen een tegendruk van {pb} bar, bij {thermal}. De druk daalt tot {pf} bar, het fluïdum koelt af tot {tmin} °C na {t} s, geeft {mr} kg vrij en voert {Ej} MJ af.",
 concReached:"De doeldruk werd binnen het gevraagde venster bereikt, zodat de gerapporteerde tijd de drukafbouwtijd is.",
 concCut:"De run eindigde voor de doeldruk werd bereikt, zodat de drukafbouwtijd langer is dan de gerapporteerde tijd.",
 system:"Massa verlaat het vat via één afblaaspad waarvan de grootte door de gekozen weerstand wordt bepaald. De enthalpie van de uittredende stroom voert inwendige energie af, waardoor de resterende inhoud afkoelt bij de expansie. De druk volgt uit de toestandsrelatie van het fluïdum voor de momentane massa en temperatuur. In het model met eindige wand wisselt de wand warmte uit met het fluïdum en met de omgeving.",
 figCap:"De panelen delen de tijdas. Eerste: vatdruk op de linkeras, fluïdumtemperatuur op de rechter. Tweede: afblaasmassastroom op de linkeras, vatinhoud op de rechter. Een derde paneel draagt de wandtemperatuur in het model met eindige wand.",
 ckState:"Volumesluiting van de vattoestand",
 ckStateB:"De eindmassa en het soortelijk volume worden teruggemenigvuldigd en met het vatvolume vergeleken. De ideaalgastak sluit algebraïsch; de stoomtak vindt de druk via 55 halveringen tegen hetzelfde volume, dus dit meet die inversie.",
 ckEnergy:"Sluiting van de energiebalans",
 ckEnergyB:"Begin- min eindinwendige energie, min de uitlaatenthalpie die de oplosser in zijn vierde toestandsgrootheid opsomt, min wat de wand opsloeg en wat de omgeving leverde. De adiabatische tak sluit als identiteit van de geïntegreerde toestand. De tak met eindige wand evalueert de omgevingsterm met trapeziumkwadratuur over de geaccepteerde toestanden, omdat de oplosser hem niet opsomt; het residu draagt die kwadratuurfout.",
 ckFlow:"Sluiting van de afblaasrelatie",
 ckFlowB:"De massastroom in de eindtoestand is herberekend uit de eigen padrelatie van de tool en vergeleken met de waarde die de oplosser gebruikte. Orifice en klep zijn algebraïsch. Het leidingpad lost mdot = mdot_nozzle / sqrt(1 + K(mdot)) op binnen het interval [0, mdot_nozzle], waarvan de eigen afbreektest 1·10⁻¹² · max(1, mdot) is; die test is hier het criterium.",
 ckWindow:"Doeldruk binnen het venster",
 ckWindowB:"De oplosser stopt bij het doeldrukevent, bij een modelgrens of bij de maximale gesimuleerde tijd. Welke daarvan de run beëindigde bepaalt of de gerapporteerde tijd een drukafbouwtijd is.",
 ckRegime:"Afblaasregime in de eindtoestand",
 ckRegimeB:"Tegendruk gedeeld door vatdruk tegen de kritische verhouding die het afblaasmodel teruggaf. Daaronder is het pad geblokkeerd en wordt de stroom alleen door de vattoestand bepaald. De ideaalgastak neemt de verhouding uit (2/(γ+1))^(γ/(γ−1)); de stoomtak uit de druk van maximale massaflux langs de isentroop.",
 ckConv:"Convergentie bij verfijning van de verdeling",
 ckConvB:"Hetzelfde geval opnieuw opgelost met halve en met kwart maximale tijdstap. Het eindevent wordt door 24 halveringen van één geaccepteerde stap ingesloten, dus een verandering onder dt_max · 2⁻²⁴ is lokalisatieruis. Boven die drempel moet de verandering tussen opeenvolgende verdelingen binnen de vorige blijven.",
 ckScaleA:"Tijdschaling met de restrictiegrootte",
 ckScaleAB:"Voor een ideaal gas in een adiabatisch vat is de massastroom bij gegeven vattoestand evenredig met de restrictiegrootte, zodat het product van drukafbouwtijd en restrictiegrootte invariant is. Het geval wordt opgelost bij halve, enkele en dubbele geleverde restrictie. Aanvaard wordt de paarsgewijze spreiding van 2·10⁻⁸ die het manifest van deze tool voor dezelfde invariant vastlegt.",
 ckScaleV:"Tijdschaling met het volume",
 ckScaleVB:"De afblaasrelatie ziet het vatvolume niet, dus voor een ideaal gas in een adiabatisch vat is de drukafbouwtijd evenredig met het volume. Het geval wordt opgelost bij half, enkel en dubbel geleverd volume, en de spreiding van tijd gedeeld door volume wordt tegen dezelfde vastgelegde aanvaarding van 2·10⁻⁸ gemeten.",
 flowVessel:"Star vat",flowPath:"Afblaaspad",flowSink:"Tegendruk",

fr:{title:"Décharge d’enceinte — dépressurisation transitoire d’une enceinte rigide",
 summary:"Une enceinte rigide et parfaitement mélangée de {V} m³ contenant {fluid} à {p0} bar et {T0} °C se décharge par {path} contre une contre-pression de {pb} bar, avec {thermal}. La pression tombe à {pf} bar, le fluide se refroidit à {tmin} °C après {t} s, libérant {mr} kg et emportant {Ej} MJ.",
 concReached:"La pression cible a été atteinte dans la fenêtre demandée, le temps indiqué est donc le temps de dépressurisation.",
 concCut:"Le calcul s’est terminé avant la pression cible, le temps de dépressurisation est donc plus long que le temps indiqué.",
 system:"La masse quitte l’enceinte par une voie de décharge dimensionnée par la résistance choisie. L’enthalpie du débit sortant emporte de l’énergie interne, de sorte que l’inventaire restant se refroidit en se détendant. La pression découle de la relation d’état du fluide appliquée à la masse et à la température instantanées. Dans le modèle à paroi finie, la paroi échange de la chaleur avec le fluide et avec l’ambiance.",
 figCap:"Les panneaux partagent l’axe du temps. Premier : pression d’enceinte sur l’axe de gauche, température du fluide sur celui de droite. Deuxième : débit massique de décharge sur l’axe de gauche, inventaire de l’enceinte sur celui de droite. Un troisième panneau porte la température de paroi dans le modèle à paroi finie.",
 ckState:"Fermeture du volume sur l’état de l’enceinte",
 ckStateB:"La masse finale et le volume massique sont remultipliés et comparés au volume de l’enceinte. La branche gaz parfait se ferme algébriquement ; la branche vapeur localise la pression par 55 dichotomies contre le même volume, ce qui est mesuré ici.",
 ckEnergy:"Fermeture du bilan d’énergie",
 ckEnergyB:"Énergie interne initiale moins finale, moins l’enthalpie de sortie que le solveur cumule dans sa quatrième variable d’état, moins ce que la paroi a stocké et ce que l’ambiance a fourni. La branche adiabatique se ferme comme une identité de l’état intégré. La branche à paroi finie évalue le terme ambiant par quadrature des trapèzes sur les états acceptés, car le solveur ne le cumule pas ; le résidu porte cette erreur de quadrature.",
 ckFlow:"Fermeture de la relation de décharge",
 ckFlowB:"Le débit massique à l’état final est recalculé à partir de la relation de voie propre à l’outil et comparé à la valeur utilisée par le solveur. Orifice et vanne sont algébriques. La voie conduite résout mdot = mdot_tuyère / sqrt(1 + K(mdot)) sur l’intervalle [0, mdot_tuyère], dont le test d’arrêt propre est 1·10⁻¹² · max(1, mdot) ; ce test est le critère retenu ici.",
 ckWindow:"Pression cible dans la fenêtre",
 ckWindowB:"Le solveur s’arrête sur l’événement de pression cible, sur une limite du modèle, ou au temps simulé maximal. Ce qui a terminé le calcul décide si le temps indiqué est un temps de dépressurisation.",
 ckRegime:"Régime de décharge à l’état final",
 ckRegimeB:"Contre-pression sur pression d’enceinte face au rapport critique renvoyé par le modèle de décharge. En dessous, la voie est bloquée et le débit est fixé par le seul état de l’enceinte. La branche gaz parfait tire le rapport de (2/(γ+1))^(γ/(γ−1)) ; la branche vapeur le tire de la pression de flux massique maximal le long de l’isentrope.",
 ckConv:"Convergence au raffinement de la partition",
 ckConvB:"Le même cas résolu de nouveau avec la moitié puis le quart du pas de temps maximal. L’événement final est encadré par 24 dichotomies d’un pas accepté, une variation sous dt_max · 2⁻²⁴ est donc du bruit de localisation. Au-dessus de ce seuil, la variation entre partitions successives doit rester dans la précédente.",
 ckScaleA:"Mise à l’échelle du temps par la restriction",
 ckScaleAB:"Pour un gaz parfait dans une enceinte adiabatique, le débit massique est proportionnel à la taille de la restriction à état d’enceinte donné, donc le produit du temps de dépressurisation par la taille de la restriction est invariant. Le cas est résolu à la moitié, à l’unité et au double de la restriction livrée. L’acceptation est l’écart deux à deux de 2·10⁻⁸ que le manifeste de cet outil consigne pour le même invariant.",
 ckScaleV:"Mise à l’échelle du temps par le volume",
 ckScaleVB:"La relation de décharge ne voit pas le volume de l’enceinte, donc pour un gaz parfait en enceinte adiabatique le temps de dépressurisation est proportionnel au volume. Le cas est résolu à la moitié, à l’unité et au double du volume livré, et l’écart du temps rapporté au volume est mesuré face à la même acceptation consignée de 2·10⁻⁸.",
 flowVessel:"Enceinte rigide",flowPath:"Voie de décharge",flowSink:"Contre-pression",
 fIdeal:"un gaz parfait",fSteam:"eau / vapeur selon IAPWS-IF97",
 pOrifice:"un orifice",pValve:"une vanne dimensionnée par coefficient de débit",pPipe:"une conduite à résistance concentrée",
 thAdiabatic:"sans échange de chaleur à la paroi",thWall:"une paroi de capacité thermique finie en échange avec l’ambiance",
 riskModelT:"Limites du modèle",

 riskPipeT:"Résistance de conduite concentrée",
 riskPipe:"La voie conduite est une résistance de Darcy-Weisbach concentrée avec somme des pertes singulières, appliquée en facteur sur un débit de tuyère. Les effets compressibles répartis et de Fanno sont hors de cette révision.",

es:{title:"Despresurización de recipiente — transitorio de descarga de un recipiente rígido",
 summary:"Un recipiente rígido y bien mezclado de {V} m³ con {fluid} a {p0} bar y {T0} °C descarga por {path} contra una contrapresión de {pb} bar, con {thermal}. La presión cae a {pf} bar, el fluido se enfría a {tmin} °C tras {t} s, liberando {mr} kg y extrayendo {Ej} MJ.",
 concReached:"La presión objetivo se alcanzó dentro de la ventana solicitada, de modo que el tiempo indicado es el tiempo de despresurización.",
 concCut:"El cálculo terminó antes de alcanzar la presión objetivo, de modo que el tiempo de despresurización es mayor que el indicado.",

function dgcLang(){try{return (window.Diagram&&Diagram.lang&&Diagram.lang())||'en';}catch(e){return 'en';}}
function dgcRt(k){var l=dgcLang();return (DGC_RT[l]&&DGC_RT[l][k])||DGC_RT.en[k]||k;}
var DGC_LOC={en:'en-GB',uk:'uk-UA',de:'de-DE',nl:'nl-BE',fr:'fr-BE',es:'es-ES',pl:'pl-PL'};
function dgcNum(v,d){if(!isFinite(v))return '—';
 try{return Number(v).toLocaleString(DGC_LOC[dgcLang()]||'en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});}
 catch(e){return Number(v).toFixed(d);}}

/* Verification computed live from the current state. Every criterion below is
   read out of this tool's own code or out of the acceptance its manifest
   records; nothing here introduces a new tolerance.
     DGC_EV_BISECT  locateEvent() brackets the terminal event with 24 halvings
                    of one accepted step, so the terminal time carries a floor.
     DGC_PIPE_TOL   discharge() solves the pipe resistance relation on the
                    bracket [0, mdot_nozzle] and breaks on
                    |dmdot| <= 1e-12 * max(1, mdot).
     DGC_STATE_TOL  floating-point closure of the state relation. steamState()
                    inverts density with 55 bisections, whose resolution on the
                    specific volume is below this bound.
     DGC_ENERGY_TOL the adiabatic energy residual the manifest records as
                    accepted, 6e-4 of the initial internal energy.
     DGC_SCALE_TOL  the pairwise spread the manifest records for the sweep
                    time-scaling invariants, 2e-8. */
var DGC_EV_BISECT=24, DGC_PIPE_TOL=1e-12, DGC_STATE_TOL=1e-12,
    DGC_ENERGY_TOL=6e-4, DGC_SCALE_TOL=2e-8;

/* The wall branch exchanges with the ambient through a term the solver never
   accumulates. It is recovered here by trapezoidal quadrature over the
   accepted states, which is disclosed with the check. */
function dgcAmbientHeat(s,arr){
  if(s.heatMode!=='wall')return 0;
  var q=0,i;
  for(i=1;i<arr.length;i++){
    var a=s.UAamb*(s.Tamb-arr[i-1].Tw), b=s.UAamb*(s.Tamb-arr[i].Tw);
    q+=0.5*(a+b)*(arr[i].t-arr[i-1].t);
  }
  return q;
}
/* Mass flow at a state recomputed outside the solver, through the relation the
   active path declares. The pipe branch returns the unreduced nozzle flow so
   the caller can test the resistance relation on its own terms. */
function dgcPathFlow(props,s){
  if(s.path==='pipe'){
    var area=Math.PI*s.pipeD*s.pipeD/4;
    return {nozzle:discharge(props,Object.assign({},s,{path:'orifice',A:area,Cd:1})).mdot,area:area};
  }
  if(s.path==='valve'){
    var kv=s.coeffType==='Cv'?0.865*s.valveCoeff:s.valveCoeff,av=Math.max(0,kv)*1.9635e-5;
    return {nozzle:discharge(props,Object.assign({},s,{path:'orifice',A:av,Cd:1})).mdot,area:av};
  }
  return {nozzle:null,area:Math.max(0,s.Cd)*Math.max(0,s.A)};
}
function dgcSpread(v){
  var mx=0,i,j;
  for(i=0;i<v.length;i++){
    if(!isFinite(v[i]))return NaN;
    for(j=i+1;j<v.length;j++){
      if(!isFinite(v[j]))return NaN;
      var d=Math.abs(v[i]-v[j])/Math.max(Math.abs(v[i]),Math.abs(v[j]));
      if(d>mx)mx=d;
    }
  }
  return mx;
}
/* Solve the same case with one input scaled through the tool's own sweep
   mapping, and return the terminal time only when the run ended on the
   target-pressure event. A run that stopped for any other reason cannot carry
   a scaling statement. */
function dgcScaledTime(s,variable,value){
  var r=solve(sweepCaseApply(s,{variable:variable,value:value}));
  return (r.ok&&r.reason==='target-pressure')?r.time:NaN;
}
/* Returns one row per case: what was measured, what it was measured against,
   the difference and the verdict. The list follows the branch that ran: a
   scaling invariant that the active branch does not hold is left out rather
   than reported without numbers. */
function dgcVerify(s){
  var out=[],r0=solve(s);
  if(!r0.ok){
    out.push({id:'initial-state-admissible',key:'ckWindow',graded:false,status:'attention',
      got:null,ref:null,unit:'-',extra:{reason:r0.reason}});
    return out;
  }
  var arr=r0.series,d=arr[arr.length-1],stF=fluidState(d.m,d.T,s);

  // 1. Vessel state closure: the terminal mass and specific volume must return
  //    the vessel volume the state relation was inverted against.
  var vGot=d.m*stF.v,vRel=Math.abs(vGot-s.V)/s.V;
  /* got and ref are volumes; rel and tol are dimensionless, so no absolute
     difference is recorded against a relative acceptance. */
  out.push({id:'vessel-state-volume-closure',key:'ckState',graded:true,
    got:vGot,ref:s.V,rel:vRel,tol:DGC_STATE_TOL,unit:'m3',
    pass:vRel<=DGC_STATE_TOL,status:vRel<=DGC_STATE_TOL?'pass':'attention'});

  // 2. Energy balance closure on the integrated state.
  var m0=initialMass(s),U0=m0*fluidState(m0,s.T0,s).u,
      Qamb=dgcAmbientHeat(s,arr),
      Cw=s.heatMode==='wall'?s.wallMass*s.wallCp:0,
      dTw=s.heatMode==='wall'?d.Tw-s.Twall0:0,
      eRes=(U0-d.m*stF.u)-r0.E+Qamb-Cw*dTw,
      eRel=Math.abs(eRes)/Math.abs(U0);
  /* The whole row is dimensionless; the joule quantities behind it are kept in
     extra, where their unit is unambiguous. */
  out.push({id:'energy-balance-closure',key:'ckEnergy',graded:true,
    got:eRel,ref:0,rel:eRel,tol:DGC_ENERGY_TOL,unit:'-',
    pass:eRel<=DGC_ENERGY_TOL,status:eRel<=DGC_ENERGY_TOL?'pass':'attention',
    extra:{U0:U0,discharged:r0.E,ambient:Qamb,wallStored:Cw*dTw,residual:eRes,
           branch:s.heatMode==='wall'?'wall':'adiabatic'}});

  // 3. Discharge relation closure at the terminal state.
  var q=discharge(stF,s),pf=dgcPathFlow(stF,s),fGot=q.mdot,fRef=q.mdot,fTol=0,fMode='algebraic';
  if(s.path==='pipe'){
    var Re=Math.abs(q.mdot)*s.pipeD/Math.max(pf.area*s.mu,1e-30),
        fd=swameeJain(Re,Math.max(0,s.roughness/s.pipeD)),
        K=Math.max(0,s.Kminor)+fd*Math.max(0,s.pipeL/s.pipeD);
    fRef=pf.nozzle/Math.sqrt(1+K);
    fTol=DGC_PIPE_TOL*Math.max(1,q.mdot); fMode='bracketed-root';
  }else if(s.path==='valve'){
    fRef=pf.nozzle; fTol=DGC_STATE_TOL*Math.max(1e-30,q.mdot);
  }else if(s.fluid!=='steam'){
    var g=s.gamma,R=s.R,pu=stF.p,Tu=stF.T,rr=Math.max(1e-12,Math.min(1,s.pb/pu)),
        rc=Math.pow(2/(g+1),g/(g-1)),G;
    if(rr<=rc)G=pu*Math.sqrt(g/(R*Tu))*Math.pow(2/(g+1),(g+1)/(2*(g-1)));
    else{var zz=Math.max(0,Math.pow(rr,2/g)-Math.pow(rr,(g+1)/g));G=pu*Math.sqrt(2*g/(R*Tu*(g-1))*zz);}
    fRef=pf.area*G; fTol=DGC_STATE_TOL*Math.max(1e-30,q.mdot); fMode='analytic';
  }else{
    fTol=DGC_STATE_TOL*Math.max(1e-30,q.mdot); fMode='if97-nozzle';
  }
  var fAbs=Math.abs(fGot-fRef),fOk=fAbs<=fTol;
  out.push({id:'discharge-relation-closure',key:'ckFlow',graded:true,
    got:fGot,ref:fRef,abs:fAbs,rel:fAbs/Math.max(1e-30,Math.abs(fGot)),tol:fTol,unit:'kg/s',
    pass:fOk,status:fOk?'pass':'attention',extra:{mode:fMode,path:s.path}});

  // 4. Which event ended the run. This reports the state of the solved case and
  //    carries no acceptance, so it is recorded without a verdict.
  var reached=r0.reason==='target-pressure';
  out.push({id:'terminal-condition-in-window',key:'ckWindow',graded:false,
    got:r0.time,ref:s.maxTime,rel:null,unit:'s',pass:reached,
    status:reached?'pass':'attention',word:reached?'wYes':'wNo',
    extra:{reason:r0.reason,p_final:r0.p,target:s._target||s.targetP}});

  // 5. Regime at the terminal state, likewise recorded rather than graded.
  var ratio=stF.p>0?s.pb/stF.p:1;
  out.push({id:'terminal-discharge-regime',key:'ckRegime',graded:false,
    got:ratio,ref:q.critRatio,rel:null,unit:'-',pass:true,status:'info',
    word:q.choked?'wChoked':'wSub',
    extra:{choked:!!q.choked,mach:(s.path==='orifice'&&isFinite(q.M))?q.M:null,phase:q.phase||'ideal'}});

  // 6. Partition refinement. The terminal event is bracketed by 24 halvings of
  //    one accepted step, so dtMax*2^-24 is the floor below which a difference
  //    between partitions is localisation noise.
  var r1=solve(Object.assign({},s,{dtMax:s.dtMax/2})),
      r2=solve(Object.assign({},s,{dtMax:s.dtMax/4})),
      floor=s.dtMax*Math.pow(2,-DGC_EV_BISECT),
      cOk=!!(r1.ok&&r2.ok),
      g1=cOk?Math.abs(r1.time-r0.time):NaN,
      g2=cOk?Math.abs(r2.time-r1.time):NaN,
      cTol=cOk?Math.max(g1,floor):NaN;

  out.push({id:'partition-refinement-convergence',key:'ckConv',graded:true,
    got:g2,ref:cTol,abs:g2,rel:isFinite(g2)?g2/Math.max(1e-30,r0.time):null,tol:cTol,unit:'s',
    pass:cOk,status:cOk?'pass':'attention',
    extra:{t_dtMax:r0.time,t_half:r1.ok?r1.time:null,t_quarter:r2.ok?r2.time:null,
           first_gap:g1,floor:floor}});

  // 7/8. Time-scaling invariants. Both are exact in the ideal-gas adiabatic
  //      equations and hold in no other branch, so they are emitted only there.
  if(s.fluid==='ideal'&&s.heatMode==='adiabatic'){
    var F=[0.5,1,2],k;
    if(s.path==='orifice'||s.path==='valve'){
      var bA=s.path==='orifice'?s.A:s.valveCoeff,tA=[];
      for(k=0;k<F.length;k++)tA.push(dgcScaledTime(s,'restriction',bA*F[k])*F[k]);
      var sA=dgcSpread(tA),aOk=isFinite(sA)&&sA<=DGC_SCALE_TOL;
      out.push({id:'restriction-time-scaling-invariant',key:'ckScaleA',graded:true,
        got:sA,ref:0,abs:sA,rel:sA,tol:DGC_SCALE_TOL,unit:'-',
        pass:aOk,status:aOk?'pass':'attention',extra:{factors:F,product:tA}});
    }
    var tV=[];
    for(k=0;k<F.length;k++)tV.push(dgcScaledTime(s,'V',s.V*F[k])/F[k]);
    var sV=dgcSpread(tV),vOk=isFinite(sV)&&sV<=DGC_SCALE_TOL;
    out.push({id:'volume-time-scaling-invariant',key:'ckScaleV',graded:true,
      got:sV,ref:0,abs:sV,rel:sV,tol:DGC_SCALE_TOL,unit:'-',
      pass:vOk,status:vOk?'pass':'attention',extra:{factors:F,quotient:tV}});
  }
  return out;
}
/* The steam branches cost seconds per solve and the report is built once per
   language. The result is keyed on the state it was computed from, so a
   repeated build reuses it and a changed input recomputes it. */
var DGC_VCACHE={key:null,rows:null};
function dgcVerifyCached(s){
  var k;
  try{k=JSON.stringify(s);}catch(e){k=null;}
  if(k!==null&&DGC_VCACHE.key===k)return DGC_VCACHE.rows;
  var rows=dgcVerify(s);
  DGC_VCACHE.key=k; DGC_VCACHE.rows=rows;
  return rows;
}

/* The report is a separate document without the tool's stylesheet, so the
   figure is drawn into its own canvas at print resolution rather than scraped
   off the screen. Without this the engine falls back to the on-screen stage,
   which carries no caption, no axis titles and no axis ticks. */
function dgcFigureCanvas(w,h,scale){
  var c=document.createElement('canvas');
  c.width=Math.round(w*scale); c.height=Math.round(h*scale);
  var ctx=c.getContext('2d'); ctx.scale(scale,scale);
  return {canvas:c,ctx:ctx};
}
function dgcLabel(k){return dgcRt(k);}
/* One panel per set of quantities that share an axis pair. A panel never
   carries two series of the same unit, so every curve keeps a named axis and
   none is flattened against an unrelated scale. The wall panel appears only
   where the finite-wall thermal model produced a wall temperature. */
function dgcPlotSpecs(){
  if(!last||!last.ok||!last.series||last.series.length<2)return null;
  var a=last.series,i,x=[],p=[],T=[],Tw=[],q=[],m=[];
  for(i=0;i<a.length;i++){
    x.push(a[i].t); p.push(a[i].p/1e5); T.push(a[i].T-273.15);
    Tw.push(a[i].Tw-273.15); q.push(a[i].mdot); m.push(a[i].m);
  }
  var ax={label:dgcLabel('axTime'),unit:'s'},specs=[
    {x:ax,series:[{x:x,y:p,label:dgcLabel('axPressure'),unit:'bar',color:'#1f6feb'},
                  {x:x,y:T,label:dgcLabel('axFluidT'),unit:'°C',color:'#d1651a'}]},
    {x:ax,series:[{x:x,y:q,label:dgcLabel('axFlow'),unit:'kg/s',color:'#9333ea'},
                  {x:x,y:m,label:dgcLabel('axInv'),unit:'kg',color:'#0891b2'}]}
  ];
  if(state.heatMode==='wall')
    specs.push({x:ax,series:[{x:x,y:Tw,label:dgcLabel('axWallT'),unit:'°C',color:'#2f9e44'}]});
  return specs;
}
function dgcDrawPanels(ctx,w,h,specs,css,density,fontScale){
  var n=specs.length,ph=h/n,i;
  for(i=0;i<n;i++){
    ctx.save(); ctx.translate(0,i*ph);
    dgcPlot(ctx,w,ph,specs[i],{density:density,css:css,fontScale:fontScale});
    ctx.restore();
  }
}
function dgcReportFigure(ctx){
  var specs=dgcPlotSpecs(); if(!specs)return null;
  var h=300*specs.length,f=dgcFigureCanvas(720,h,2);
  f.ctx.fillStyle='#ffffff'; f.ctx.fillRect(0,0,720,h);
  dgcDrawPanels(f.ctx,720,h,specs,{bg:'#ffffff',muted:'#5a6570',line:'#c9d0d8',text:'#17202a',
    font:'-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif'},'fine',1);
  return ctx.figure(f.canvas,{caption:dgcRt('figCap'),alt:dgcRt('figCap')});
}
/* Ten equally spaced samples of the solved history. The figure shows the shape
   of the transient; this carries the numbers behind it, which appear nowhere
   else in the document. */
function dgcTraceRows(){
  if(!last||!last.ok||!last.series||last.series.length<2)return [];
  var a=last.series,tEnd=a[a.length-1].t,rows=[],i,n=dgcNum;
  if(!(tEnd>0))return [];
  for(i=0;i<=9;i++){
    var z=interpSeries(a,tEnd*i/9);
    if(!z)continue;
    rows.push([n(z.t,2),n(z.p/1e5,3),n(z.T-273.15,1),n(z.mdot,4),n(z.m,3)]);
  }
  return rows;
}
function dgcReportProfile(rec,ctx){
  if(!rec||!last||!last.ok)return null;
  var i=rec.inputs||{},o=rec.outputs||{},u=rec.units||{},n=dgcNum,
      row=function(label,value,unit,note){return {label:label,value:value,unit:unit||'',note:note||''};},
      wall=i.heatMode==='wall',steam=i.fluid==='steam',
      END={'target-pressure':'endTarget','time-limit':'endTime','saturation-boundary':'endSat',
           'two-phase-liquid-limit':'endLiq','nozzle-metastable-limit':'endMeta',
           'step-underflow':'endUnder','step-limit':'endSteps','model-boundary':'endBoundary',
           'invalid-initial-state':'endInit'},
      endWord=dgcRt(END[o.termination]||'endBoundary'),
      reached=o.termination==='target-pressure',
      pathWord=dgcRt(i.path==='pipe'?'pPipe':(i.path==='valve'?'pValve':'pOrifice')),
      pathSize=i.path==='pipe'?(n(i.pipeD*1000,1)+' mm · '+n(i.pipeL,1)+' m · ΣK '+n(i.Kminor,2))
              :(i.path==='valve'?(i.coeffType+' '+n(i.valveCoeff,3))
              :(n(i.A*1e6,2)+' mm² · Cd '+n(i.Cd,2)));

    .replace('{V}',n(i.V,3)).replace('{fluid}',dgcRt(steam?'fSteam':'fIdeal'))
    .replace('{p0}',n(i.p0/1e5,3)).replace('{T0}',n(i.T0-273.15,1))
    .replace('{path}',pathWord).replace('{pb}',n(i.pb/1e5,3))
    .replace('{thermal}',dgcRt(wall?'thWall':'thAdiabatic'))
    .replace('{pf}',n(o.p_final/1e5,3)).replace('{tmin}',n(o.T_min-273.15,1))
    .replace('{t}',n(o.time_to_target,2)).replace('{mr}',n(o.m_released,3))
    .replace('{Ej}',n(o.energy_discharged/1e6,3));

  /* Values are shown in the units an engineer reads them in. The record keeps SI. */
  var tiles=[
    row(dgcRt('tTime'),n(o.time_to_target,2),'s'),
    row(dgcRt('tPfinal'),n(o.p_final/1e5,3),'bar'),
    row(dgcRt('tTmin'),n(o.T_min-273.15,1),'°C'),
    row(dgcRt('tMdot'),n(o.mdot_peak,4),'kg/s'),
    row(dgcRt('tReleased'),n(o.m_released,3),'kg'),
    row(dgcRt('tEnergy'),n(o.energy_discharged/1e6,3),'MJ')

  /* How long the path stays choked, read off the computed history: while the

     vessel state alone, so this is the part of the blowdown that does not see
     the back pressure. */
  var a=last.series,tChoke=null,k;

  if(tChoke===null)tChoke=o.time_to_target;
  var m0=a[0].m;

  var results=tiles.concat([
    row(dgcRt('rP0'),n(i.p0/1e5,3),'bar'),
    row(dgcRt('rT0'),n(i.T0-273.15,2),'°C'),
    row(dgcRt('rTfinal'),n(o.T_final-273.15,2),'°C',
        wall?dgcRt('rTwall')+': '+n(o.Twall_final-273.15,2)+' °C':''),
    row(dgcRt('rRho'),n(o.rho_final,4),'kg/m³'),
    row(dgcRt('rMass0'),n(m0,3),'kg',dgcRt('rMassEnd')+': '+n(o.m_final,3)+' kg'),
    row(dgcRt('rMean'),o.time_to_target>0?n(o.m_released/o.time_to_target,4):'—','kg/s'),
    row(dgcRt('rChoke'),n(tChoke,2),'s',
        o.time_to_target>0?n(100*tChoke/o.time_to_target,1)+' % '+dgcRt('rOfRun'):''),
    row(dgcRt('rAccepted'),String(a.length),'',dgcRt('rRejected')+': '+String(last.rejects||0)),
    row(dgcRt('rEnd'),endWord,'')
  ]);
  if(o.vessel_two_phase_used)
    results.push(row(dgcRt('rVesselX'),n(o.minimum_vessel_vapour_quality,4),'-'));
  if(o.metastable_nozzle_used||o.equilibrium_hem_nozzle_used)
    results.push(row(dgcRt('rOutletX'),n(o.min_outlet_equilibrium_quality,4),'-'));

  var v=dgcVerifyCached(state),ex=function(x,d){return (x==null||!isFinite(x))?'—':Number(x).toExponential(d);};
  var checks=v.map(function(c){
    var st=c.status||(c.pass?'pass':'attention'),actual='',criterion='',note='',e=c.extra||{};
    if(c.key==='ckState'){
      actual='m · v = '+n(c.got,9)+' m³ · |Δ| / V = '+ex(c.rel,2);
      criterion='V = '+n(c.ref,3)+' m³, |Δ| / V ≤ '+ex(c.tol,0);
    }else if(c.key==='ckEnergy'){
      actual='|Δ| / U₀ = '+ex(c.rel,3);
      criterion='≤ '+ex(c.tol,0);

           +dgcRt('eAmb')+' '+n(e.ambient/1e6,3)+' MJ';
    }else if(c.key==='ckFlow'){
      actual='ṁ = '+ex(c.got,6)+' kg/s · ṁ_ref = '+ex(c.ref,6)+' kg/s · |Δ| = '+ex(c.abs,3)+' kg/s';
      criterion='|Δ| ≤ '+ex(c.tol,2)+' kg/s ('+e.mode+')';

    }else if(c.key==='ckWindow'){

      criterion='maxTime = '+n(c.ref,3)+' s';

    }else if(c.key==='ckRegime'){
      actual='p_b / p = '+n(c.got,4)+' ('+dgcRt(c.word||'wSub')+')';
      criterion='r_crit = '+n(c.ref,4);

            basis:dgcRt(c.key+'B'),detail:note};
  });

  var decisions=[
    row(dgcRt('flowPath'),pathWord+' · '+pathSize,'',dgcRt('dPathWhy')),
    row(dgcRt('dTarget'),n(i.targetP/1e5,3)+' bar / '+n(i.pb/1e5,3)+' bar','',dgcRt('dTargetWhy')),
    row(dgcRt('dThermal'),wall?(n(i.UAin,1)+' W/K · '+n(i.wallMass*i.wallCp/1e3,1)+' kJ/K · '
        +n(i.UAamb,1)+' W/K'):dgcRt('thAdiabatic'),'',dgcRt('dThermalWhy')),
    row(dgcRt('dFluid'),steam?(i.steamInventoryModel+' / '+i.steamNozzleModel)

    {label:dgcRt('rP0'),value:n(i.p0/1e5,3),unit:'bar',group:gV},
    {label:dgcRt('rT0'),value:n(i.T0-273.15,2),unit:'°C',group:gV},

    {label:dgcRt('dTarget'),value:n(i.targetP/1e5,3)+' / '+n(i.pb/1e5,3),unit:'bar',group:gP},

  if(!steam){

                {label:dgcRt('iUAin'),value:n(i.UAin,2),unit:'W/K',group:gP},
                {label:dgcRt('iUAamb'),value:n(i.UAamb,2),unit:'W/K',group:gP},
                {label:dgcRt('iTamb'),value:n(i.Tamb-273.15,2),unit:'°C',group:gP});
  }

  var risks=[{status:'attention',title:dgcRt('riskModelT'),detail:dgcRt('riskModel')}];
  if(i.path==='pipe')risks.push({status:'attention',title:dgcRt('riskPipeT'),detail:dgcRt('riskPipe')});
  if(steam)risks.push({status:'attention',title:dgcRt('riskSteamT'),detail:dgcRt('riskSteam')});

  return {
    title:dgcRt('title'),
    executive:{text:[summary],results:tiles,
      conclusion:reached?dgcRt('concReached'):dgcRt('concCut')},
    system:{text:dgcRt('system'),
      flow:[{label:dgcRt('flowVessel'),detail:n(i.V,3)+' m³ · '+n(i.p0/1e5,2)+' bar'},
            {label:dgcRt('flowPath'),detail:pathSize},
            {label:dgcRt('flowSink'),detail:n(i.pb/1e5,3)+' bar'}]},
    results:results,
    decisions:decisions,
    checks:checks,
    figures:[dgcReportFigure(ctx)].filter(Boolean),
    risks:risks,
    inputs:inputs
  };
}
