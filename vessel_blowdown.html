/* Rebuilds the published benchmark record from this page. Open the tool and
   call window.__dgcBenchmark() to reproduce benchmarks/vessel_blowdown_v1101.json. */
function dgcBenchmark(scenarios){
  var list=scenarios||DGC_BENCH_CASES,cases=[],total=0,passed=0,failed=0;
  list.forEach(function(sc){
    var v=dgcVerify(sc.s);
    var cmp=v.map(function(c){
      if(c.graded){total++; if(c.pass)passed++; else failed++;}
      return {check:c.id,
        got:(c.got===undefined?null:c.got),
        ref:(c.ref===undefined?null:c.ref),
        abs:(c.abs===undefined?null:c.abs),
        rel:(c.rel===undefined?null:c.rel),
        tol:(c.tol===undefined?null:c.tol),
        unit:c.unit,extra:c.extra||null,
        graded:!!c.graded,
        status:c.status||(c.pass?'pass':'fail'),ok:c.graded?!!c.pass:null};
    });
    cases.push({id:sc.id,note:sc.note,reference_provenance:'recomputed in page',
      inputs:sc.s,cmp:cmp,
      pass:cmp.every(function(x){return !x.graded||x.ok;})});
  });
  DGC_RECORDED.cases.forEach(function(rc){
    cases.push({id:rc.id,note:rc.note,reference_provenance:'recorded',
      recorded_source:DGC_RECORDED.source,recorded_run_at:DGC_RECORDED.run_at,
      inputs:null,cmp:null,pass:rc.pass,flagged:!!rc.flagged});
  });
  var rev='';
  try{rev=JSON.parse(document.getElementById('diagram-tool-manifest').textContent).manifest_revision;}catch(e){}
  var ex=function(x,n){return (x==null||!isFinite(x))?'—':Number(x).toExponential(n);};
  var pick=function(id,check){
    var c=cases.filter(function(z){return z.id===id;})[0];
    if(!c||!c.cmp)return null;
    return c.cmp.filter(function(z){return z.check===check;})[0]||null;
  };
  var pipe=pick('ideal-wall-pipe-darcy','discharge-relation-closure'),
      conv=pick('steam-equilibrium-two-phase-hem','partition-refinement-convergence'),
      adia=pick('ideal-adiabatic-orifice','energy-balance-closure');
  return {
    schema:'tools.petrov.re/benchmark/v1',
    tool:'vessel-blowdown',file:'vessel_blowdown.html',manifest_revision:rev,build:rev,
    reference:'Two blocks. Measured: the vessel state relation, the energy balance on the integrated state, the discharge relation of the active path, the terminal event, and the ideal-gas adiabatic time-scaling invariants, all recomputed in the page over seven scenarios that cover every solver branch. Recorded: official IAPWS-IF97 program-verification points, browser/Python parity, isolated-VM Worker parity, canonical DiagramCompute registration and the external Lin-Gruen-Quapp HEM envelope comparison, carried forward from the 2026-09-05 artifact because this page cannot evaluate them.',
    reference_citations:[
      'Closure, discharge and event relations as implemented in vessel_blowdown.html. Each measured check recomputes one of them outside the solver and compares.',
      'QA-VESSEL-BLOWDOWN-2026-09-04.json',
      'QA-VESSEL-BLOWDOWN-METASTABLE-IF97-2026-09-05.json',
      'QA-VESSEL-BLOWDOWN-HYBRID-HEM-2026-09-05.json',
      'QA-VESSEL-BLOWDOWN-TWO-PHASE-INVENTORY-2026-09-05.json',
      'QA-HEM-CRITICAL-FLOW-LIN-GRUEN-QUAPP-2026-09-04.json',
      'QA-VESSEL-BLOWDOWN-SWEEP-2026-09-05.json',
      'QA-VESSEL-BLOWDOWN-DIAGRAMCOMPUTE-PRIMITIVES-2026-09-05.json'],
    reference_provenance:'mixed',
    provenance_note:'Recomputed in page for the measured block; recorded external for the rest (official IAPWS program verification, external HEM envelope dataset, isolated-VM Worker run). This record is exported by window.__dgcBenchmark() on the page itself; no external driver exists for it.',
    tolerance:'Measured block: vessel state volume closure to 1e-12 relative; energy balance residual to 6e-4 of initial internal energy, the acceptance this tool’s manifest records; discharge relation to the 1e-12*max(1,mdot) break test of discharge(); partition refinement to the previous step-to-step change or to the dtMax*2^-24 floor of the 24-bisection event localisation; time-scaling invariants to the 2e-8 pairwise spread the manifest records. Observed on the adiabatic orifice case: energy residual '+ex(adia&&adia.rel,3)+' of initial U. Observed on the pipe case: the resistance relation closes to '+ex(pipe&&pipe.abs,3)+' kg/s against its 1e-12*max(1,mdot) test. The equilibrium two-phase terminal time moves '+ex(conv&&conv.got,3)+' s under a halving of dtMax against '+ex(conv&&conv.extra&&conv.extra.first_gap,3)+' s for the halving before it. Recorded block: tolerances as published on 2026-09-05.',
    run_at:new Date().toISOString().replace(/\.\d+Z$/,'Z'),
    total:total+DGC_RECORDED.total,
    passed:passed+DGC_RECORDED.passed,
    failed:failed+DGC_RECORDED.failed,
    flagged:DGC_RECORDED.flagged,
    measured:{total:total,passed:passed,failed:failed,scenarios:list.length},
    recorded:{total:DGC_RECORDED.total,passed:DGC_RECORDED.passed,failed:DGC_RECORDED.failed,
              flagged:DGC_RECORDED.flagged,source:DGC_RECORDED.source,run_at:DGC_RECORDED.run_at},
    page_errors:[],
    grading:'total counts checks that carry an acceptance criterion. The terminal event and the discharge regime report the state of the solved case and carry none, so they are recorded with their status and excluded from the count. The time-scaling invariants hold only in the ideal-gas adiabatic branch and are emitted only where they apply. Recorded cases keep the verdicts published on 2026-09-05 and are not re-measured here.',
    cases:cases,
    not_benchmarked:[
      'Non-equilibrium vessel flashing / delayed nucleation.',
      'Phase slip, stratification, entrainment/separation and liquid-level geometry.',
      'Connected vessels/header dynamics.',
      'Fire heat input and relief-valve mechanics.',
      'Browser Worker transport and scheduling: the sweep cases are evaluated on the main thread here, so this artifact covers the case definitions rather than the Worker path.',
      'Experimental accuracy of the metastable and HEM steam branches.'],
    notes:[
      'Each measured case runs the shipped solver and an independent recomputation inside the page. Inputs, measured value, reference value and tolerance are recorded per check, so any measured verdict can be reproduced by calling window.__dgcBenchmark() on the tool.',
      'Recorded cases carry reference_provenance "recorded". They rest on official IAPWS program-verification points, an external HEM experimental dataset, an isolated-VM Worker run and a canonical DiagramCompute runtime, none of which this page can evaluate. Their inputs and comparison rows are null because no measurement was made here.',
      'The Lin-Gruen-Quapp HEM envelope case remains a failing model-envelope warning. No empirical correction has been fitted to it.',
      'Revision 2026-09-11 corrects the two numerical defects this artifact recorded as failures on 2026-09-05. discharge() solves the pipe resistance relation on the bracket [0, mdot_nozzle] rather than by a damped fixed point capped at ten iterations. solve() puts the saturated-vapour crossing of the equilibrium two-phase inventory on a step boundary, with the locateEvent() call the single-phase inventory model already used for the same crossing; the mass flow steps by a measured 4.81 % there, because steamNozzle() hands a two-phase upstream state to the equilibrium HEM nozzle instead of the metastable isentrope. energyPartials() takes its finite differences on one side of that surface, where dU/dT is 3.621e3 J/K on the superheated side and 1.372e5 J/K on the two-phase side. The embedded Python export carries the same three changes; browser/Python agreement over four scenarios is 7.75e-10 relative.',
      'The equilibrium two-phase terminal time settles near 1e-3 s under further partition refinement rather than at zero. Two non-smoothnesses remain in that branch and neither shrinks with the step: the nozzle isentrope crosses from stable IF97 Region 2 into the metastable-vapour supplement with a 1.56e-4 relative step in mass flow, and steamHemCritical() maximises the HEM mass flux on a 96-point log-pressure grid, which moves the located critical state by up to 3.0e-6 relative between neighbouring states.']
  };
}

async function initSweepCompute(){if(sweepInit)return sweepInit;sweepInit=(async function(){await whenSweepRuntime();var api=DCAPI();if(!api||typeof api.ComputeRuntime!=='function'){sweepComputeFailed=true;sweepComputeReason='diagram-compute.classic.js is unavailable';return null;}try{sweepRuntime=await api.ComputeRuntime.create({benchmark:false});var caps=sweepRuntime.capabilities||{};if(!caps.cpu||!caps.cpu.workerAvailable)throw new Error('Worker is unavailable');sweepWorkers=Math.max(1,sweepRuntime.getWorkerCount?sweepRuntime.getWorkerCount():1);sweepEngine=sweepRuntime.createEnsembleEngine({prefix:'vessel-blowdown'});sweepEngine.registerEnsemble('sweep',{handler:sweepEval,preamble:sweepWorkerPreamble(),workers:sweepWorkers,poolKey:'vessel-blowdown:sweep',determinism:'repeatable',primitives:[{kind:'ode-event',factor:1},{kind:'ensemble',factor:1}]});return sweepEngine;}catch(e){sweepComputeFailed=true;sweepComputeReason=String((e&&e.message)||e);sweepEngine=null;return null;}})();return sweepInit;}

function sweepCases(st){var n=Math.max(3,Math.min(41,Math.round(st.sweepN||9))),lo=Number(st.sweepMin),hi=Number(st.sweepMax);if(!(lo>0&&hi>0&&hi>=lo))throw new Error('Sweep factors must be positive and max ≥ min.');if(st.sweepVar==='UAin'&&st.heatMode!=='wall')throw new Error('UA sweep requires the finite-wall thermal model.');var base=Number(sweepBaseValue(st,st.sweepVar));if(!(base>0))throw new Error('The selected sweep base value must be positive.');var out=[];for(var i=0;i<n;i++){var f;if(n===1)f=1;else if(st.sweepScale==='log')f=Math.exp(Math.log(lo)+(Math.log(hi)-Math.log(lo))*i/(n-1));else f=lo+(hi-lo)*i/(n-1);out.push({i:i,variable:st.sweepVar,factor:f,value:base*f});}return out;}

function buildLearn(){return {version:1,autostart:false,intro:{title:T("Learn this model","Як користуватися моделлю","Modell verstehen","Model leren","Comprendre le modèle","Aprender el modelo","Poznaj model"),body:T("Start with an Example, then change one input at a time. Watch which result moves, which regime is active, and whether the model limitation still fits your case.","Почніть із прикладу, потім змінюйте по одному параметру. Стежте, який результат змінюється, який режим активний і чи відповідають обмеження моделі вашому випадку.","Beginnen Sie mit einem Beispiel und ändern Sie dann jeweils nur eine Eingabe. Beobachten Sie Ergebnis, aktives Regime und Modellgrenze.","Begin met een voorbeeld en wijzig daarna één invoer tegelijk. Bekijk welk resultaat verandert, welk regime actief is en of de modelgrens nog past.","Commencez par un exemple puis modifiez une entrée à la fois. Observez le résultat, le régime actif et la limite du modèle.","Empiece con un ejemplo y cambie una entrada cada vez. Observe qué resultado cambia, qué régimen está activo y si el límite del modelo sigue siendo válido.","Zacznij od przykładu, potem zmieniaj po jednym parametrze. Obserwuj wynik, aktywny reżim i to, czy granice modelu nadal pasują do przypadku.")},topics:{'t1':{title:T("Initial state / inputs","Початковий стан / вхідні дані","Anfangszustand / Eingaben","Begintoestand / invoer","État initial / entrées","Estado inicial / entradas","Stan początkowy / dane"),body:T("These values establish the inventory and starting thermodynamic or hydraulic state.","Ці значення задають запас і початковий термодинамічний або гідравлічний стан.","Diese Werte legen Inventar und thermodynamischen bzw. hydraulischen Anfangszustand fest.","Deze waarden bepalen inventaris en thermodynamische of hydraulische begintoestand.","Ces valeurs fixent l’inventaire et l’état thermodynamique ou hydraulique initial.","Estos valores fijan el inventario y el estado termodinámico o hidráulico inicial.","Te wartości określają zapas i początkowy stan termodynamiczny lub hydrauliczny.")},'t2':{title:T("Driving mechanism / resistance","Рушійний механізм / опір","Antrieb / Widerstand","Aandrijving / weerstand","Mécanisme moteur / résistance","Mecanismo impulsor / resistencia","Mechanizm napędowy / opór"),body:T("These controls set the main driving force or flow resistance. Change them to see the characteristic timescale and flow response.","Ці параметри задають головну рушійну силу або опір потоку. Змінюйте їх, щоб побачити характерний час і реакцію витрати.","Diese Regler setzen den Hauptantrieb oder Strömungswiderstand. Änderungen zeigen Zeitskala und Durchflussreaktion.","Deze instellingen bepalen de hoofdaandrijving of stromingsweerstand. Wijzig ze om tijdschaal en stromingsrespons te zien.","Ces réglages définissent la force motrice ou la résistance principale. Leur variation montre l’échelle de temps et la réponse du débit.","Estos ajustes fijan la fuerza motriz o la resistencia principal. Cámbielos para ver la escala temporal y la respuesta del caudal.","Te ustawienia określają główną siłę napędową lub opór przepływu. Zmieniaj je, aby zobaczyć skalę czasu i odpowiedź przepływu.")},'t3':{title:T("Regime transition","Перехід режиму","Regimewechsel","Regimeovergang","Transition de régime","Transición de régimen","Przejście reżimu"),body:T("Watch for branch changes such as choked/subcritical flow, flashing/no flashing, filling/draining or packing/depacking. They change the governing equation.","Стежте за переходами choked/subcritical, flashing/no flashing, filling/draining або packing/depacking. Вони змінюють основну гілку рівнянь.","Achten Sie auf Wechsel wie gesperrt/unterkritisch, Flash/kein Flash, Füllen/Entleeren oder Packen/Entpacken. Sie ändern den maßgebenden Rechenzweig.","Let op overgangen zoals choked/subkritisch, flashing/geen flashing, vullen/ledigen of packing/depacking. Ze veranderen de bepalende rekentak.","Surveillez les transitions bloqué/sous-critique, flash/sans flash, remplissage/vidange ou stockage/déstockage. Elles changent la branche de calcul.","Vigile cambios como choked/subcrítico, flashing/sin flashing, llenado/vaciado o packing/depacking. Cambian la rama gobernante del cálculo.","Obserwuj przejścia krytyczny/podkrytyczny, flashing/brak flashingu, napełnianie/opróżnianie lub packing/depacking. Zmieniają one gałąź równań.")},'t4':{title:T("Model boundary","Межа моделі","Modellgrenze","Modelgrens","Limite du modèle","Límite del modelo","Granica modelu"),body:T("Use the stated limitation as part of the result. A numerically converged answer outside the model assumptions is not a validated design answer.","Сприймайте зазначене обмеження як частину результату. Чисельно збіжна відповідь поза припущеннями моделі не є валідованою проєктною відповіддю.","Die angegebene Einschränkung gehört zum Ergebnis. Eine numerisch konvergierte Lösung außerhalb der Modellannahmen ist keine validierte Auslegungsantwort.","De vermelde beperking hoort bij het resultaat. Een numeriek geconvergeerd antwoord buiten de modelaannames is geen gevalideerd ontwerpantwoord.","La limitation déclarée fait partie du résultat. Une solution convergée hors des hypothèses du modèle n’est pas une réponse de conception validée.","La limitación declarada forma parte del resultado. Una solución convergida fuera de las hipótesis no es una respuesta de diseño validada.","Podane ograniczenie jest częścią wyniku. Numerycznie zbieżna odpowiedź poza założeniami modelu nie jest zwalidowaną odpowiedzią projektową.")}},tour:[{topic:'t1',focus:'[data-dgu-panel=\"dgu-examples\"]'},{topic:'t2',focus:'[data-dgu-panel=\"vessel\"]'},{topic:'t3',focus:'[data-dgu-panel=\"path\"]'},{topic:'t4',focus:'[data-dgu-panel=\"heat\"]'}]};}

function interpSeries(a,t){if(!a||!a.length)return null;if(t<=a[0].t)return a[0];if(t>=a[a.length-1].t)return a[a.length-1];var lo=0,hi=a.length-1;while(hi-lo>1){var m=(lo+hi)>>1;if(a[m].t<t)lo=m;else hi=m;}var A=a[lo],B=a[hi],q=(t-A.t)/(B.t-A.t),o={};['t','m','T','Tw','E','p','rho','mdot','M','velocity','pOut','TOut','rhoOut','fdarcy','Re','K','eqArea'].forEach(function(k){o[k]=A[k]+q*(B[k]-A[k]);});o.choked=q<0.5?A.choked:B.choked;return o;}

  /* The schematic keeps its place; the stacked panels below it are drawn by the
     shared chart, so each quantity carries a named axis with its unit and no

  var specs=dgcPlotSpecs(); if(!specs)return;

}

def region2(p, T):

def psat(T):
    th = T + N4[8]/(T-N4[9])
    A = th*th + N4[0]*th + N4[1]
    B = N4[2]*th*th + N4[3]*th + N4[4]
    C = N4[5]*th*th + N4[6]*th + N4[7]
    return (2*C/(-B+math.sqrt(B*B-4*A*C)))**4


def tsat(p):
    if p <= 0.000611657:
        return 273.16

        return IF97_TC

    E=beta*beta+N4[2]*beta+N4[5]
    F=N4[0]*beta*beta+N4[3]*beta+N4[6]
    G=N4[1]*beta*beta+N4[4]*beta+N4[7]
    D=2*G/(-F-math.sqrt(max(0.0,F*F-4*E*G)))
    q=N4[9]+D
    return 0.5*(q-math.sqrt(max(0.0,q*q-4*(N4[8]+N4[9]*D))))

def steam_iso_state(props,pPa):

def steam_state(m, T, V, allow_two_phase=False):
    if not (m > 0 and V > 0 and IF97_TMIN <= T <= IF97_TMAX):
        raise ModelError('steam-range')
    vt = V/m

def total_u(m,T,s):
    st=fluid_state(m,T,s)
    if st['boundary']:

def energy_partials(m,T,s,base):

        return cv*T,m*cv

    except ModelError: um=float('nan')
    try: up=side(total_u(m+dm,T,s))
    except ModelError: up=float('nan')
    if math.isfinite(um) and math.isfinite(up): Um=(up-um)/(2*dm)
    elif math.isfinite(um): Um=(u0-um)/dm
    elif math.isfinite(up): Um=(up-u0)/dm

    except ModelError: tm=float('nan')
    try: tp=side(total_u(m,tpT,s))
    except ModelError: tp=float('nan')
    if math.isfinite(tm) and math.isfinite(tp): UT=(tp-tm)/(tpT-tmT)
    elif math.isfinite(tm): UT=(u0-tm)/(T-tmT)
    elif math.isfinite(tp): UT=(tp-u0)/(tpT-T)

    if not (abs(UT)>1e-12): raise ModelError('steam-derivative')
