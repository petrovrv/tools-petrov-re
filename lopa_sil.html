    host.appendChild(p);
    last = solve(state);
  }

              "Середня імовірність відмови на запит запропонованої SIF оцінюється спрощеними рівняннями IEC 61508-6, додаток B, без урахування часу ремонту: 1oo1 = λDU·T/2, 2oo2 = λDU·T, 1oo2 = ((1-β)λDU·T)²/3 + β·λDU·T/2, 2oo3 = ((1-β)λDU·T)² + β·λDU·T/2, 1oo3 = ((1-β)λDU·T)³/4 + β·λDU·T/2. λDU — інтенсивність небезпечних невиявлених відмов одного повного каналу (датчик, логіка, виконавчий елемент), T — інтервал контрольних перевірок, β — частка відмов із загальної причини. Ціль досягнута, якщо f_без_SIF × PFDavg не перевищує допустиму частоту.",
              "Die mittlere Ausfallwahrscheinlichkeit bei Anforderung der geplanten SIF wird mit den vereinfachten Gleichungen der IEC 61508-6 Anhang B ohne Reparaturzeit geschätzt: 1oo1 = λDU·T/2, 2oo2 = λDU·T, 1oo2 = ((1-β)λDU·T)²/3 + β·λDU·T/2, 2oo3 = ((1-β)λDU·T)² + β·λDU·T/2, 1oo3 = ((1-β)λDU·T)³/4 + β·λDU·T/2. λDU ist die Rate gefährlicher unerkannter Ausfälle eines vollständigen Kanals (Sensor, Logik, Stellglied), T das Prüfintervall und β der Common-Cause-Anteil. Das Ziel ist erreicht, wenn f_ohne_SIF × PFDavg die tolerierbare Häufigkeit nicht überschreitet.",
              "De gemiddelde faalkans bij aanspraak van de voorgestelde SIF wordt geschat met de vereenvoudigde vergelijkingen van IEC 61508-6 bijlage B, zonder reparatietijd: 1oo1 = λDU·T/2, 2oo2 = λDU·T, 1oo2 = ((1-β)λDU·T)²/3 + β·λDU·T/2, 2oo3 = ((1-β)λDU·T)² + β·λDU·T/2, 1oo3 = ((1-β)λDU·T)³/4 + β·λDU·T/2. λDU is de frequentie van gevaarlijke onontdekte storingen van één volledig kanaal (sensor, logica, eindelement), T het proeftestinterval en β de common-cause-fractie. Het doel is gehaald als f_zonder_SIF × PFDavg niet boven de toelaatbare frequentie ligt.",
              "La probabilité moyenne de défaillance sur sollicitation de la SIF proposée est estimée avec les équations simplifiées de l'IEC 61508-6 annexe B, sans temps de réparation : 1oo1 = λDU·T/2, 2oo2 = λDU·T, 1oo2 = ((1-β)λDU·T)²/3 + β·λDU·T/2, 2oo3 = ((1-β)λDU·T)² + β·λDU·T/2, 1oo3 = ((1-β)λDU·T)³/4 + β·λDU·T/2. λDU est le taux de défaillances dangereuses non détectées d'une voie complète (capteur, logique, actionneur), T l'intervalle entre tests et β la fraction de cause commune. L'objectif est atteint si f_sans_SIF × PFDavg ne dépasse pas la fréquence tolérable.",
              "La probabilidad media de fallo bajo demanda de la SIF propuesta se estima con las ecuaciones simplificadas de IEC 61508-6 anexo B, sin tiempo de reparación: 1oo1 = λDU·T/2, 2oo2 = λDU·T, 1oo2 = ((1-β)λDU·T)²/3 + β·λDU·T/2, 2oo3 = ((1-β)λDU·T)² + β·λDU·T/2, 1oo3 = ((1-β)λDU·T)³/4 + β·λDU·T/2. λDU es la tasa de fallos peligrosos no detectados de un canal completo (sensor, lógica, elemento final), T el intervalo de pruebas y β la fracción de causa común. El objetivo se cumple si f_sin_SIF × PFDavg no supera la frecuencia tolerable.",
              "Średnie prawdopodobieństwo niezadziałania na żądanie proponowanej SIF szacuje się uproszczonymi równaniami IEC 61508-6 załącznik B, bez czasu naprawy: 1oo1 = λDU·T/2, 2oo2 = λDU·T, 1oo2 = ((1-β)λDU·T)²/3 + β·λDU·T/2, 2oo3 = ((1-β)λDU·T)² + β·λDU·T/2, 1oo3 = ((1-β)λDU·T)³/4 + β·λDU·T/2. λDU to intensywność niebezpiecznych niewykrytych uszkodzeń jednego pełnego kanału (czujnik, logika, element wykonawczy), T okres testów, a β udział wspólnej przyczyny. Cel jest spełniony, gdy f_bez_SIF × PFDavg nie przekracza częstości tolerowanej."
            )
          },
          hft: {
            title: T('Hardware fault tolerance', 'Апаратна відмовостійкість', 'Hardwarefehlertoleranz', 'Hardwarefouttolerantie', 'Tolérance aux anomalies matérielles', 'Tolerancia a fallos de hardware', 'Tolerancja uszkodzeń sprzętu'),
            body: T(
              "Besides the PFD, IEC 61511-1:2016 clause 11.4 sets a minimum hardware fault tolerance: HFT 0 (1oo1, 2oo2) is enough up to SIL 2 in low demand, SIL 3 needs HFT 1 (1oo2, 2oo3) and SIL 4 needs HFT 2 (1oo3). The achieved SIL is the lower of the PFD band and this architectural limit, so a very reliable single channel still counts as SIL 2 at most.",
              "Окрім PFD, IEC 61511-1:2016, розділ 11.4, встановлює мінімальну апаратну відмовостійкість: HFT 0 (1oo1, 2oo2) достатньо до SIL 2 у режимі низького запиту, SIL 3 потребує HFT 1 (1oo2, 2oo3), SIL 4 — HFT 2 (1oo3). Досягнутий SIL — менший із діапазону за PFD і цієї архітектурної межі, тож дуже надійний одиночний канал усе одно зараховується щонайбільше як SIL 2.",
              "Neben der PFD fordert IEC 61511-1:2016 Abschnitt 11.4 eine Mindest-Hardwarefehlertoleranz: HFT 0 (1oo1, 2oo2) genügt bei niedriger Anforderungsrate bis SIL 2, SIL 3 braucht HFT 1 (1oo2, 2oo3) und SIL 4 HFT 2 (1oo3). Der erreichte SIL ist das Minimum aus PFD-Band und dieser Architekturgrenze, ein sehr zuverlässiger Einzelkanal zählt also höchstens als SIL 2.",
              "Naast de PFD stelt IEC 61511-1:2016 clausule 11.4 een minimale hardwarefouttolerantie: HFT 0 (1oo1, 2oo2) volstaat tot SIL 2 in lage-vraagmodus, SIL 3 vraagt HFT 1 (1oo2, 2oo3) en SIL 4 HFT 2 (1oo3). Het bereikte SIL is het laagste van de PFD-band en deze architectuurgrens, dus een zeer betrouwbaar enkelvoudig kanaal telt hooguit als SIL 2.",
              "Outre la PFD, l'IEC 61511-1:2016 article 11.4 impose une tolérance minimale aux anomalies matérielles : HFT 0 (1oo1, 2oo2) suffit jusqu'au SIL 2 en faible sollicitation, le SIL 3 exige HFT 1 (1oo2, 2oo3) et le SIL 4 HFT 2 (1oo3). Le SIL atteint est le plus faible entre la bande de PFD et cette limite d'architecture : une voie unique très fiable compte donc au plus pour SIL 2.",
              "Además de la PFD, IEC 61511-1:2016 cláusula 11.4 exige una tolerancia mínima a fallos de hardware: HFT 0 (1oo1, 2oo2) basta hasta SIL 2 en baja demanda, SIL 3 requiere HFT 1 (1oo2, 2oo3) y SIL 4 HFT 2 (1oo3). El SIL alcanzado es el menor entre la banda de PFD y este límite de arquitectura, por lo que un canal único muy fiable cuenta como SIL 2 como máximo.",
              "Oprócz PFD norma IEC 61511-1:2016 rozdz. 11.4 wymaga minimalnej tolerancji uszkodzeń sprzętu: HFT 0 (1oo1, 2oo2) wystarcza do SIL 2 w trybie niskiego zapotrzebowania, SIL 3 wymaga HFT 1 (1oo2, 2oo3), a SIL 4 HFT 2 (1oo3). Osiągnięty SIL to niższa z wartości wynikającej z PFD i tego ograniczenia architektury, więc bardzo niezawodny pojedynczy kanał liczy się najwyżej jako SIL 2."
            )
          },
          limits: {
            title: T('Scope and limits', 'Сфера застосування та обмеження', 'Anwendungsbereich und Grenzen', 'Toepassingsgebied en beperkingen', 'Domaine et limites', 'Alcance y limitaciones', 'Zakres i ograniczenia'),
            body: T(
              "One scenario, one consequence, low-demand mode only (demand rate up to once per year); high-demand SIFs need PFH (IEC 61511-1 Table 5). Generic IE frequencies and IPL PFDs are screening values; the independence of every layer must be verified. The PFDavg equations neglect repair time, diagnostics, partial stroke tests and proof test coverage below 100 %. SIL verification for a real SIS needs certified failure data and a full IEC 61511 lifecycle.",
              "Один сценарій, один наслідок, лише режим низького запиту (частота запитів не більше одного на рік); для SIF з високим запитом потрібен PFH (IEC 61511-1, таблиця 5). Типові частоти ініціюючих подій і PFD рівнів захисту — значення для попередньої оцінки; незалежність кожного рівня треба перевірити. Рівняння PFDavg не враховують час ремонту, діагностику, часткові ходи клапанів і покриття перевірок менше 100 %. Верифікація SIL для реальної ПСБ потребує сертифікованих даних про відмови та повного життєвого циклу IEC 61511.",
              "Ein Szenario, eine Auswirkung, nur niedrige Anforderungsrate (höchstens einmal pro Jahr); SIF mit hoher Anforderungsrate brauchen PFH (IEC 61511-1 Tabelle 5). Generische Ereignishäufigkeiten und IPL-PFD sind Screening-Werte; die Unabhängigkeit jeder Ebene ist nachzuweisen. Die PFDavg-Gleichungen vernachlässigen Reparaturzeit, Diagnose, Teilhubtests und Prüfabdeckung unter 100 %. Die SIL-Verifikation eines realen SIS braucht zertifizierte Ausfalldaten und den vollständigen Lebenszyklus nach IEC 61511.",
              "Eén scenario, één gevolg, alleen lage-vraagmodus (aanspraak hooguit eenmaal per jaar); SIF's met hoge aanspraak vragen PFH (IEC 61511-1 tabel 5). Generieke frequenties en IPL-PFD's zijn screeningwaarden; de onafhankelijkheid van elke laag moet worden aangetoond. De PFDavg-vergelijkingen verwaarlozen reparatietijd, diagnose, partial-stroketests en proeftestdekking onder 100 %. SIL-verificatie van een echt SIS vraagt gecertificeerde faalgegevens en de volledige IEC 61511-levenscyclus.",
              "Un scénario, une conséquence, faible sollicitation uniquement (au plus une sollicitation par an) ; les SIF à forte sollicitation nécessitent la PFH (IEC 61511-1 tableau 5). Les fréquences d'événements et les PFD génériques sont des valeurs de criblage ; l'indépendance de chaque couche doit être vérifiée. Les équations de PFDavg négligent le temps de réparation, les diagnostics, les tests de course partielle et une couverture de test inférieure à 100 %. La vérification SIL d'un SIS réel exige des données de défaillance certifiées et le cycle de vie complet de l'IEC 61511.",
              "Un escenario, una consecuencia, solo modo de baja demanda (como máximo una demanda al año); las SIF de alta demanda requieren PFH (IEC 61511-1 tabla 5). Las frecuencias de eventos y PFD genéricas son valores de cribado; debe verificarse la independencia de cada capa. Las ecuaciones de PFDavg desprecian el tiempo de reparación, los diagnósticos, las pruebas de carrera parcial y una cobertura de prueba inferior al 100 %. La verificación SIL de un SIS real requiere datos de fallo certificados y el ciclo de vida completo de IEC 61511.",
              "Jeden scenariusz, jeden skutek, tylko tryb niskiego zapotrzebowania (żądanie najwyżej raz na rok); SIF o wysokim zapotrzebowaniu wymagają PFH (IEC 61511-1 tabela 5). Typowe częstości zdarzeń i PFD warstw to wartości przesiewowe; niezależność każdej warstwy trzeba wykazać. Równania PFDavg pomijają czas naprawy, diagnostykę, testy częściowego skoku i pokrycie testów poniżej 100 %. Weryfikacja SIL rzeczywistego SIS wymaga certyfikowanych danych o uszkodzeniach i pełnego cyklu życia wg IEC 61511."
            )
          }

        label: T('Loading hose rupture', 'Розрив наливного рукава', 'Abriss des Verladeschlauchs', 'Breuk laadslang', 'Rupture du flexible de chargement', 'Rotura de manguera de carga', 'Zerwanie węża przeładunkowego'),
        note: T('Look at the target: a stricter 1e-6/yr for multiple fatalities; with alarm and blast wall the scenario is 5e-5/yr, risk reduction 50 (SIL 1), and a 2oo3 emergency shutdown (PFDavg 2.9e-4) gives 1.4e-8/yr.', 'Дивіться на ціль: суворіша 1e-6/рік для кількох загиблих; із сигналізацією та захисною стіною сценарій — 5e-5/рік, зниження ризику 50 (SIL 1), а аварійне відключення 2oo3 (PFDavg 2,9e-4) дає 1,4e-8/рік.', 'Achten Sie auf das Ziel: strengere 1e-6/a für mehrere Todesopfer; mit Alarm und Schutzwand liegt das Szenario bei 5e-5/a, Risikominderung 50 (SIL 1), und eine 2oo3-Notabschaltung (PFDavg 2,9e-4) ergibt 1,4e-8/a.', 'Kijk naar het doel: een strengere 1e-6/jr voor meerdere doden; met alarm en explosiemuur is het scenario 5e-5/jr, risicoreductie 50 (SIL 1), en een 2oo3-noodstop (PFDavg 2,9e-4) geeft 1,4e-8/jr.', 'Regardez la cible : 1e-6/an, plus stricte, pour des décès multiples ; avec alarme et mur anti-souffle, le scénario est à 5e-5/an, réduction 50 (SIL 1), et un arrêt d’urgence 2oo3 (PFDavg 2,9e-4) donne 1,4e-8/an.', 'Fíjese en el objetivo: 1e-6/año, más estricto, para víctimas múltiples; con alarma y muro antiexplosión el escenario es 5e-5/año, reducción 50 (SIL 1), y una parada de emergencia 2oo3 (PFDavg 2,9e-4) da 1,4e-8/año.', 'Spójrz na cel: surowszy 1e-6/rok dla wielu ofiar śmiertelnych; z alarmem i ścianą przeciwwybuchową scenariusz to 5e-5/rok, redukcja 50 (SIL 1), a wyłączenie awaryjne 2oo3 (PFDavg 2,9e-4) daje 1,4e-8/rok.'),
        apply: exA('full', 'hose', 0.5, 1, 1, ['alarm', 'blastwall'], '1e-6', ['2oo3', 1, 12, 5]) }
    ];
    ui.examples(EX);

    ui.stage({
      caption: T('Scenario frequency after each protection layer (log scale) against the tolerable frequency',
        'Частота сценарію після кожного рівня захисту (логарифмічна шкала) порівняно з допустимою частотою',
        'Szenariohäufigkeit nach jeder Schutzebene (logarithmisch) im Vergleich zur tolerierbaren Häufigkeit',
        'Scenariofrequentie na elke beschermingslaag (logaritmisch) ten opzichte van de toelaatbare frequentie',
        'Fréquence du scénario après chaque couche de protection (échelle log) face à la fréquence tolérable',
        'Frecuencia del escenario tras cada capa de protección (escala log) frente a la frecuencia tolerable',
        'Częstość scenariusza po każdej warstwie zabezpieczeń (skala log) na tle częstości tolerowanej'),
      minHeight: 240,
      a11y: function () {
        if (!last || !last.ok || !last.r) return LP(T('No result', 'Немає результату', 'Kein Ergebnis', 'Geen resultaat', 'Pas de résultat', 'Sin resultado', 'Brak wyniku'));
        var r = last.r, a = [XS(r.f_mit, 2), XS(r.f_target, 0), DiagramUI.fmt(r.rrf_req, { precision: 1 }), r.sif ? XS(r.sif.f_final, 2) : ''];
        return LP(TF(r.sif ? T('Frequency ladder: mitigated frequency $1 per year against tolerable $2 per year; required risk reduction $3; with the SIF $4 per year.',
          'Драбина частот: частота з урахуванням захисту $1 на рік проти допустимої $2 на рік; потрібне зниження ризику $3; із SIF $4 на рік.',
          'Häufigkeitsleiter: verminderte Häufigkeit $1 pro Jahr gegenüber tolerierbaren $2 pro Jahr; erforderliche Risikominderung $3; mit SIF $4 pro Jahr.',
          'Frequentieladder: gemitigeerde frequentie $1 per jaar tegen toelaatbaar $2 per jaar; vereiste risicoreductie $3; met SIF $4 per jaar.',
          'Échelle des fréquences : fréquence atténuée $1 par an contre tolérable $2 par an ; réduction de risque requise $3 ; avec la SIF $4 par an.',
          'Escala de frecuencias: frecuencia mitigada $1 por año frente a tolerable $2 por año; reducción de riesgo requerida $3; con la SIF $4 por año.',
          'Drabina częstości: częstość po ograniczeniu $1 na rok wobec tolerowanej $2 na rok; wymagana redukcja ryzyka $3; z SIF $4 na rok.')
          : T('Frequency ladder: mitigated frequency $1 per year against tolerable $2 per year; required risk reduction $3.',
          'Драбина частот: частота з урахуванням захисту $1 на рік проти допустимої $2 на рік; потрібне зниження ризику $3.',
          'Häufigkeitsleiter: verminderte Häufigkeit $1 pro Jahr gegenüber tolerierbaren $2 pro Jahr; erforderliche Risikominderung $3.',
          'Frequentieladder: gemitigeerde frequentie $1 per jaar tegen toelaatbaar $2 per jaar; vereiste risicoreductie $3.',
          'Échelle des fréquences : fréquence atténuée $1 par an contre tolérable $2 par an ; réduction de risque requise $3.',
          'Escala de frecuencias: frecuencia mitigada $1 por año frente a tolerable $2 por año; reducción de riesgo requerida $3.',
          'Drabina częstości: częstość po ograniczeniu $1 na rok wobec tolerowanej $2 na rok; wymagana redukcja ryzyka $3.'), a));
      },
      render: function (size, st) {
        var ctx = st.canvas(); ctx.clearRect(0, 0, size.w, size.h);
        if (!last || !last.ok || !last.r) return;
        var r = last.r, bars = [], f = r.f_ie, i;
        bars.push({ l: 'IE', f: f });
        f *= r.cm; bars.push({ l: 'CM', f: f });
        for (i = 0; i < r.layers.length; i++) { f *= r.layers[i].pfd; bars.push({ l: 'IPL' + (i + 1), f: f }); }
        if (r.sif) bars.push({ l: 'SIF', f: r.sif.f_final, sif: true });
        var L = 56, R = 12, Tm = 10, B = 30, pw = size.w - L - R, ph = size.h - Tm - B;
        if (pw < 40 || ph < 20) return;
        var cs = getComputedStyle(document.documentElement), muted = cs.getPropertyValue('--muted').trim() || '#888',
          line = cs.getPropertyValue('--line').trim() || '#ccc', font = cs.getPropertyValue('--font').trim() || 'sans-serif';
        var lg = function (v) { return Math.log(v) / Math.LN10; };
        var hi = -Infinity, lo = Infinity;
        bars.concat([{ f: r.f_target }]).forEach(function (b) { if (b.f > 0) { hi = Math.max(hi, lg(b.f)); lo = Math.min(lo, lg(b.f)); } });
        hi = Math.ceil(hi + 0.01); lo = Math.floor(lo - 0.01); if (hi - lo < 2) lo = hi - 2;
        var Y = function (v) { return Tm + ph * (hi - lg(v)) / (hi - lo); };
        ctx.font = '11px ' + font; ctx.strokeStyle = line; ctx.fillStyle = muted; ctx.lineWidth = 1;
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        for (i = lo; i <= hi; i++) {
          var y = Y(Math.pow(10, i)); ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + pw, y); ctx.stroke();
          ctx.fillText('1e' + i, L - 4, y);
        }
        ctx.save(); ctx.translate(12, Tm + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'center'; ctx.fillText('f, 1/yr', 0, 0); ctx.restore();
        var n = bars.length, bw = Math.min(60, pw / n * 0.6), yb = Tm + ph;
        for (i = 0; i < n; i++) {
          var b = bars[i], x = L + pw * (i + 0.5) / n, yt = Y(b.f);
          ctx.fillStyle = b.sif ? DiagramUI.series(1) : DiagramUI.series(0);
          ctx.fillRect(x - bw / 2, yt, bw, Math.max(1, yb - yt));
          ctx.fillStyle = muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(b.l, x, yb + 4);
          ctx.textBaseline = 'bottom'; ctx.fillText(XS(b.f, 1), x, yt - 2);
        }
        var yT = Y(r.f_target);
        ctx.strokeStyle = DiagramUI.series(2); ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
        ctx.beginPath(); ctx.moveTo(L, yT); ctx.lineTo(L + pw, yT); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = DiagramUI.series(2); ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
        ctx.fillText(LP(T('target', 'ціль', 'Ziel', 'doel', 'cible', 'objetivo', 'cel')) + ' ' + XS(r.f_target, 0), L + pw - 2, yT - 2);
      }
    });
    adoptStage(ui);

    ui.ready();
    window.__lopa_sil = { ui: ui, state: state, solve: solve, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function buildRecord() {
    if (!last) return null;
    var keys = ['ie', 'f_ie', 'p_enable', 'p_ign', 'p_occ', 'p_vuln', 'ipl1', 'ipl1_pfd', 'ipl2', 'ipl2_pfd', 'ipl3', 'ipl3_pfd', 'ipl4', 'ipl4_pfd', 'f_target', 'sif', 'arch', 'lam_e6', 'TI_mo', 'beta_pct'];
    var units = { ie: '-', f_ie: '1/yr', p_enable: '-', p_ign: '-', p_occ: '-', p_vuln: '-', ipl1: '-', ipl1_pfd: '-', ipl2: '-', ipl2_pfd: '-', ipl3: '-', ipl3_pfd: '-', ipl4: '-', ipl4_pfd: '-',
                  f_target: '1/yr', sif: '-', arch: '-', lam_e6: '1e-6/h', TI_mo: 'months (730 h)', beta_pct: '%' };
    var inputs = {}, outputs = {}, notes = [], warnings = [], r = last.ok ? last.r : null, i;
    for (i = 0; i < keys.length; i++) inputs[keys[i]] = state[keys[i]];
    if (r) {
      outputs.f_ie = r.f_ie; outputs.cm = r.cm; outputs.ipl_product = r.ipl_product; outputs.f_mit = r.f_mit; outputs.f_target = r.f_target;
      outputs.pfd_req = r.pfd_req; outputs.rrf_req = r.rrf_req; outputs.sil_req = r.sil_req; outputs.sil_req_label = r.sil_req_label; outputs.gap_orders = r.gap_orders;
      for (i = 0; i < r.layers.length; i++) { outputs['ipl_' + (i + 1) + '_type'] = r.layers[i].type; outputs['ipl_' + (i + 1) + '_pfd'] = r.layers[i].pfd; }
      if (r.sif) {
        outputs.sif_arch = r.sif.arch; outputs.sif_hft = r.sif.hft; outputs.sif_pfd = r.sif.pfd; outputs.sif_rrf = r.sif.rrf;
        outputs.sif_sil_pfd = r.sif.sil_pfd; outputs.sif_sil_cap = r.sif.sil_cap; outputs.sif_sil_achieved = r.sif.sil_achieved;
        outputs.sif_f_final = r.sif.f_final; outputs.sif_meets = r.sif.meets;
      }
      for (i = 0; i < r.norm.refs.length; i++) notes.push(r.norm.refs[i]);
      var w = r.warnings || [];
      for (i = 0; i < w.length; i++) warnings.push(w[i]);
    } else {
      warnings.push(String(last.err));
    }
    return {
      inputs: inputs,
      units: units,
      outputs: outputs,
      model: {
        equations: [
          'f_mit = f_IE x P_enable x P_ign x P_occ x P_vuln x prod(PFD_IPL) (CCPS LOPA 2001)',
          'RRF = f_mit / f_tolerable, PFD_req = 1/RRF; SIL n for 10^n < RRF <= 10^(n+1) (IEC 61511-1:2016+A1:2017 Table 4, low demand)',
          'PFDavg (IEC 61508-6 Annex B, MTTR = 0): 1oo1 = L T/2; 2oo2 = L T; 1oo2 = ((1-b) L T)^2/3 + b L T/2; 2oo3 = ((1-b) L T)^2 + b L T/2; 1oo3 = ((1-b) L T)^3/4 + b L T/2',
          'max SIL by hardware fault tolerance: HFT 0 -> SIL 2, HFT 1 -> SIL 3, HFT 2 -> SIL 4 (IEC 61511-1 11.4)',
          'f_final = f_mit x PFDavg; target met when f_final <= f_tolerable and SIL(arch) >= SIL required'
        ],
        ranges: ['low-demand mode (demand rate <= 1/yr)', 'probabilities in (0, 1]', 'lambdaDU x TI <= 0.2 for the simplified equations'],
        notes: notes
      },
      warnings: warnings
    };
  }

  var HANDOFF = {
    provides: [],
    accepts: [],
    build: function () {
      if (!last || !last.ok) return null;
      var r = last.r, row = {};
      function put(k, v, u) { if (typeof v === 'number' && isFinite(v)) row[k] = { value: v, unit: u }; }
      put('pfd_req', r.pfd_req, '-'); put('rrf_req', r.rrf_req, '-'); put('sil_req', r.sil_req, '-');
      if (r.sif) { put('sif_pfd', r.sif.pfd, '-'); put('sif_rrf', r.sif.rrf, '-'); }
      return { quantities: {}, sets: { lopa: [row] } };
    },
    apply: function () { return false; }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'lopa_sil',
        file: 'lopa_sil.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
