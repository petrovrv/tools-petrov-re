 "description": {
  "en": "Sizes a two-phase gas-liquid separator with the Souders-Brown method of the GPSA Engineering Data Book (14th ed., 2017, Section 7) and API Spec 12J. The allowable gas velocity vmax = K·sqrt((ρl − ρg)/ρg) sets the gas area; for horizontal vessels the liquid retention volume can govern the diameter instead. The diameter is rounded up to 6 in steps, and the tool reports shell height or length, actual gas velocity, liquid volume and, for horizontal vessels, gas residence and droplet settling times.",
  "uk": "Розраховує розміри двофазного газорідинного сепаратора за методом Саудерса-Брауна згідно з GPSA Engineering Data Book (14-те вид., 2017, розділ 7) та API Spec 12J. Допустима швидкість газу vmax = K·sqrt((ρl − ρg)/ρg) визначає площу перерізу для газу; для горизонтальних апаратів діаметр натомість може визначатися об'ємом утримання рідини. Діаметр округлюється в більший бік з кроком 6 дюймів, а інструмент виводить висоту або довжину корпусу, фактичну швидкість газу, об'єм рідини, а для горизонтальних апаратів також час перебування газу та час осадження крапель.",
  "de": "Dimensioniert einen Zweiphasen-Gas-Flüssigkeits-Abscheider nach der Souders-Brown-Methode des GPSA Engineering Data Book (14. Aufl., 2017, Abschnitt 7) und API Spec 12J. Die zulässige Gasgeschwindigkeit vmax = K·sqrt((ρl − ρg)/ρg) bestimmt den Gasquerschnitt; bei liegenden Behältern kann stattdessen das Flüssigkeitsrückhaltevolumen den Durchmesser bestimmen. Der Durchmesser wird in Schritten von 6 Zoll aufgerundet, und das Tool gibt Mantelhöhe bzw. -länge, tatsächliche Gasgeschwindigkeit, Flüssigkeitsvolumen sowie bei liegenden Behältern die Gasverweilzeit und die Absetzzeit der Tropfen aus.",
  "nl": "Dimensioneert een tweefasen gas-vloeistofscheider met de Souders-Brown-methode uit het GPSA Engineering Data Book (14e ed., 2017, sectie 7) en API Spec 12J. De toelaatbare gassnelheid vmax = K·sqrt((ρl − ρg)/ρg) bepaalt het gasoppervlak; bij horizontale vaten kan in plaats daarvan het vloeistofretentievolume de diameter bepalen. De diameter wordt naar boven afgerond in stappen van 6 inch, en de tool rapporteert de mantelhoogte of -lengte, de werkelijke gassnelheid, het vloeistofvolume en, bij horizontale vaten, de verblijftijd van het gas en de bezinktijd van de druppels.",
  "fr": "Dimensionne un séparateur diphasique gaz-liquide selon la méthode de Souders-Brown du GPSA Engineering Data Book (14e éd., 2017, section 7) et l'API Spec 12J. La vitesse de gaz admissible vmax = K·sqrt((ρl − ρg)/ρg) détermine la section de passage du gaz ; pour les capacités horizontales, le volume de rétention de liquide peut en revanche imposer le diamètre. Le diamètre est arrondi par excès par pas de 6 pouces, et l'outil indique la hauteur ou la longueur de la virole, la vitesse réelle du gaz, le volume de liquide et, pour les capacités horizontales, le temps de séjour du gaz et le temps de décantation des gouttelettes.",
  "es": "Dimensiona un separador bifásico gas-líquido con el método de Souders-Brown del GPSA Engineering Data Book (14.ª ed., 2017, sección 7) y la API Spec 12J. La velocidad admisible del gas vmax = K·sqrt((ρl − ρg)/ρg) determina el área para el gas; en recipientes horizontales, el volumen de retención de líquido puede ser el que determine el diámetro. El diámetro se redondea hacia arriba en incrementos de 6 pulgadas, y la herramienta indica la altura o longitud de la envolvente, la velocidad real del gas, el volumen de líquido y, en recipientes horizontales, el tiempo de residencia del gas y el tiempo de sedimentación de las gotas.",

(function () {

  function lib() { return (window.OGH || {}).separator_sizing || null; }

    rhog: 40,
    rhol: 750,
    Ql: 0.01,
    K: 0.107,
    fill: 0.5,
    tr: 180,
    LD: 4
  };

  var FIELDS = [
    ['Qg', 'gas flow rate'],
    ['rhog', 'gas density'],
    ['rhol', 'liquid density'],
    ['Ql', 'liquid flow rate'],
    ['fill', 'liquid area fraction'],
    ['tr', 'retention time'],
    ['LD', 'length/diameter ratio']
  ];

  function solve(s) {
    var L = lib();
    if (!L || typeof L.solve !== 'function') {
      return { ok: false, err: 'ogh-process.js did not load' };
    }
    var i, key, v;
    for (i = 0; i < FIELDS.length; i++) {
      key = FIELDS[i][0];
      v = s[key];
      if (typeof v !== 'number' || !isFinite(v)) {
        return { ok: false, err: 'Enter a finite value for ' + FIELDS[i][1] };
      }
    }
    var full = s.level === 'full';
    if (full && (typeof s.K !== 'number' || !isFinite(s.K))) {
      return { ok: false, err: 'Enter a finite value for Souders-Brown K factor' };
    }
    var inp = {
      orient: s.orient,
      Qg: s.Qg,
      rhog: s.rhog,
      rhol: s.rhol,
      Ql: s.Ql,
      K: full ? s.K : null,
      fill: s.fill,
      tr: s.tr,
      LD: s.LD
    };
    try {
      return L.solve(inp);
    } catch (e) {
      return { ok: false, err: 'Calculation failed: ' + ((e && e.message) ? e.message : String(e)) };
    }
  }

  function sig(v, n) {
    if (n === undefined || n === null) n = 5;
    v = +v;
    if (v === 0 || !isFinite(v)) return 2;
    var d = n - 1 - Math.floor(Math.log(Math.abs(v)) / Math.LN10 + 1e-12);
    if (d < 0) d = 0;
    if (d > 8) d = 8;
    return d;
  }
  function sigv(v, n) {
    if (n === undefined || n === null) n = 5;
    v = +v;
    if (!isFinite(v)) return NaN;
    if (v === 0) return 0;
    n = Math.max(1, Math.min(21, Math.round(n)));

  function renderSeparator(size, st) {
    var ctx = st.canvas(), w = size.w, h = size.h;
    ctx.clearRect(0, 0, w, h);
    if (!last || !last.ok) return;
    var cs = getComputedStyle(document.documentElement);
    var muted = cs.getPropertyValue('--muted').trim();
    var line = cs.getPropertyValue('--line').trim();
    var font = cs.getPropertyValue('--font').trim();
    var m = 30, vert = last.orient === 'vertical', D = last.Dsel, L = last.L;
    var widthM = vert ? D : L, heightM = vert ? L : D;
    if (!(widthM > 0) || !(heightM > 0)) return;
    var s = Math.min((w - 2 * m) / widthM, (h - 2 * m) / heightM);
    if (!(s > 0)) return;
    var pw = widthM * s, ph = heightM * s, x0 = (w - pw) / 2, y0 = (h - ph) / 2;
    var r = Math.min(pw, ph) / 2;
    function shell() {
      ctx.beginPath();
      ctx.moveTo(x0 + r, y0);
      ctx.lineTo(x0 + pw - r, y0);
      ctx.arc(x0 + pw - r, y0 + r, r, -Math.PI / 2, 0);
      ctx.lineTo(x0 + pw, y0 + ph - r);
      ctx.arc(x0 + pw - r, y0 + ph - r, r, 0, Math.PI / 2);
      ctx.lineTo(x0 + r, y0 + ph);
      ctx.arc(x0 + r, y0 + ph - r, r, Math.PI / 2, Math.PI);
      ctx.lineTo(x0, y0 + r);
      ctx.arc(x0 + r, y0 + r, r, Math.PI, 1.5 * Math.PI);
      ctx.closePath();
    }
    var level = vert ? Math.min(last.hL, L) : last.hLiq;
    if (!isFinite(level)) level = 0;
    level = Math.max(0, Math.min(level, heightM));
    var yL = y0 + ph - level * s;
    ctx.save();
    shell();
    ctx.clip();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = DiagramUI.series(0);
    ctx.fillRect(x0, y0, pw, yL - y0);
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = DiagramUI.series(1);
    ctx.fillRect(x0, yL, pw, y0 + ph - yL);
    ctx.globalAlpha = 1;
    if (ctx.setLineDash) ctx.setLineDash([5, 4]);
    ctx.strokeStyle = line;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x0, yL);
    ctx.lineTo(x0 + pw, yL);
    ctx.stroke();
    ctx.restore();
    shell();
    ctx.strokeStyle = muted;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = muted;
    ctx.font = '12px ' + font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('D = ' + DiagramUI.fmt(D, { precision: 3 }) + ' m', x0 + pw / 2, y0 + ph + (size.density === 'coarse' ? 4 : 8));
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('L = ' + DiagramUI.fmt(L, { precision: 2 }) + ' m', x0 + pw + 6, y0 + ph / 2);
  }

            body: T('Allowable gas velocity vmax = K·sqrt((rhol − rhog)/rhog). K depends on the mist eliminator and pressure; the selected diameter is rounded up to the next 6 in (0.1524 m).', 'Допустима швидкість газу vmax = K·sqrt((rhol − rhog)/rhog). K залежить від каплевідбійника та тиску; вибраний діаметр округлюється вгору до найближчого значення, кратного 6 in (0,1524 м).', 'Zulässige Gasgeschwindigkeit vmax = K·sqrt((rhol − rhog)/rhog). K hängt vom Tropfenabscheider und vom Druck ab; der gewählte Durchmesser wird auf das nächste Vielfache von 6 in (0,1524 m) aufgerundet.', 'Toelaatbare gassnelheid vmax = K·sqrt((rhol − rhog)/rhog). K hangt af van de demister en de druk; de gekozen diameter wordt naar boven afgerond op het volgende veelvoud van 6 in (0,1524 m).', 'Vitesse de gaz admissible vmax = K·sqrt((rhol − rhog)/rhog). K dépend du dévésiculeur et de la pression ; le diamètre retenu est arrondi au multiple de 6 in (0,1524 m) supérieur.', 'Velocidad admisible del gas vmax = K·sqrt((rhol − rhog)/rhog). K depende del eliminador de niebla y de la presión; el diámetro seleccionado se redondea hacia arriba al siguiente múltiplo de 6 in (0,1524 m).', 'Dopuszczalna prędkość gazu vmax = K·sqrt((rhol − rhog)/rhog). K zależy od odkraplacza i ciśnienia; wybrana średnica jest zaokrąglana w górę do najbliższej wielokrotności 6 in (0,1524 m).')

          flow: {
            title: T('Flow rates', 'Витрати', 'Durchflussmengen', 'Debieten', 'Débits', 'Caudales', 'Natężenia przepływu'),
            body: T('Enter actual volumetric flows at operating pressure and temperature, not standard flows; the gas flow sets the diameter and the liquid flow sets the liquid volume.', 'Вводьте фактичні об\'ємні витрати за робочого тиску й температури, а не витрати за стандартних умов; витрата газу визначає діаметр, а витрата рідини — об\'єм рідини.', 'Geben Sie die tatsächlichen Volumenströme bei Betriebsdruck und -temperatur ein, nicht Normvolumenströme; der Gasstrom bestimmt den Durchmesser, der Flüssigkeitsstrom das Flüssigkeitsvolumen.', 'Voer de werkelijke volumedebieten in bij bedrijfsdruk en -temperatuur, geen normaaldebieten; het gasdebiet bepaalt de diameter en het vloeistofdebiet het vloeistofvolume.', 'Saisissez les débits volumiques réels aux pression et température de service, et non les débits normalisés ; le débit de gaz fixe le diamètre et le débit de liquide fixe le volume de liquide.', 'Introduzca los caudales volumétricos reales a la presión y temperatura de operación, no los caudales estándar; el caudal de gas fija el diámetro y el caudal de líquido fija el volumen de líquido.', 'Wprowadź rzeczywiste objętościowe natężenia przepływu przy ciśnieniu i temperaturze roboczej, a nie przepływy w warunkach normalnych; przepływ gazu określa średnicę, a przepływ cieczy — objętość cieczy.')
          },
          density: {
            title: T('Gas and liquid density', 'Густина газу та рідини', 'Gas- und Flüssigkeitsdichte', 'Gas- en vloeistofdichtheid', 'Masse volumique du gaz et du liquide', 'Densidad del gas y del líquido', 'Gęstość gazu i cieczy'),
            body: T('Densities at operating conditions; a small density difference lowers the allowable gas velocity and enlarges the vessel.', 'Густини за робочих умов; мала різниця густин знижує допустиму швидкість газу та збільшує апарат.', 'Dichten bei Betriebsbedingungen; ein geringer Dichteunterschied senkt die zulässige Gasgeschwindigkeit und vergrößert den Behälter.', 'Dichtheden bij bedrijfsomstandigheden; een klein dichtheidsverschil verlaagt de toelaatbare gassnelheid en vergroot het vat.', 'Masses volumiques aux conditions de service ; un faible écart de masse volumique réduit la vitesse de gaz admissible et agrandit le ballon.', 'Densidades en condiciones de operación; una pequeña diferencia de densidad reduce la velocidad admisible del gas y agranda el recipiente.', 'Gęstości w warunkach roboczych; mała różnica gęstości obniża dopuszczalną prędkość gazu i powiększa zbiornik.')
          },
          retention: {
            title: T('Liquid retention time', 'Час утримання рідини', 'Flüssigkeitsverweilzeit', 'Verblijftijd van de vloeistof', 'Temps de rétention du liquide', 'Tiempo de retención del líquido', 'Czas retencji cieczy'),
            body: T('Liquid volume = liquid flow × retention time. API 12J suggests about 1 to 3 minutes for two-phase service and 3 to 10 minutes or more for three-phase and foaming crude.', 'Об\'єм рідини = витрата рідини × час утримання. API 12J рекомендує приблизно від 1 до 3 хвилин для двофазного режиму та від 3 до 10 хвилин або більше для трифазного режиму та пінистої нафти.', 'Flüssigkeitsvolumen = Flüssigkeitsstrom × Verweilzeit. API 12J empfiehlt etwa 1 bis 3 Minuten für Zweiphasenbetrieb und 3 bis 10 Minuten oder mehr für Dreiphasenbetrieb und schäumendes Rohöl.', 'Vloeistofvolume = vloeistofdebiet × verblijftijd. API 12J adviseert ongeveer 1 tot 3 minuten voor tweefasenbedrijf en 3 tot 10 minuten of meer voor driefasenbedrijf en schuimende ruwe olie.', 'Volume de liquide = débit de liquide × temps de rétention. L\'API 12J suggère environ 1 à 3 minutes en service diphasique et 3 à 10 minutes ou plus en service triphasique et pour le brut moussant.', 'Volumen de líquido = caudal de líquido × tiempo de retención. API 12J sugiere unos 1 a 3 minutos para servicio bifásico y de 3 a 10 minutos o más para servicio trifásico y crudo espumante.', 'Objętość cieczy = natężenie przepływu cieczy × czas retencji. API 12J zaleca około 1 do 3 minut dla pracy dwufazowej oraz 3 do 10 minut lub więcej dla pracy trójfazowej i spieniającej się ropy naftowej.')
          },
          fill: {
            title: T('Liquid level in a horizontal vessel', 'Рівень рідини в горизонтальній посудині', 'Flüssigkeitsstand in einem liegenden Behälter', 'Vloeistofniveau in een horizontaal vat', 'Niveau de liquide dans un ballon horizontal', 'Nivel de líquido en un recipiente horizontal', 'Poziom cieczy w zbiorniku poziomym'),
            body: T('The liquid occupies the given fraction of the cross-section; the gas space above must give a residence time longer than the droplet settling time.', 'Рідина займає задану частку поперечного перерізу; газовий простір над нею має забезпечувати час перебування, більший за час осадження крапель.', 'Die Flüssigkeit nimmt den angegebenen Anteil des Querschnitts ein; der darüberliegende Gasraum muss eine Verweilzeit bieten, die länger ist als die Absetzzeit der Tropfen.', 'De vloeistof beslaat de opgegeven fractie van de doorsnede; de gasruimte erboven moet een verblijftijd geven die langer is dan de bezinktijd van de druppels.', 'Le liquide occupe la fraction donnée de la section ; l\'espace gazeux au-dessus doit offrir un temps de séjour supérieur au temps de décantation des gouttelettes.', 'El líquido ocupa la fracción indicada de la sección transversal; el espacio de gas superior debe proporcionar un tiempo de residencia mayor que el tiempo de sedimentación de las gotas.', 'Ciecz zajmuje zadany ułamek przekroju poprzecznego; przestrzeń gazowa nad nią musi zapewniać czas przebywania dłuższy niż czas opadania kropel.')
          },
          slender: {
            title: T('Slenderness L/D', 'Стрункість L/D', 'Schlankheitsgrad L/D', 'Slankheid L/D', 'Élancement L/D', 'Esbeltez L/D', 'Smukłość L/D'),
            body: T('Typical length-to-diameter ratios are 3 to 5 for horizontal vessels and 2.5 to 6 for vertical ones; vertical shell height here is liquid height plus one diameter plus 1.2 m, at least 3 diameters.', 'Типові співвідношення довжини до діаметра становлять від 3 до 5 для горизонтальних посудин і від 2,5 до 6 для вертикальних; висота корпусу вертикальної посудини тут дорівнює висоті рідини плюс один діаметр плюс 1,2 м, але не менше 3 діаметрів.', 'Typische Länge-zu-Durchmesser-Verhältnisse liegen bei 3 bis 5 für liegende und 2,5 bis 6 für stehende Behälter; die Mantelhöhe stehender Behälter ist hier Flüssigkeitshöhe plus ein Durchmesser plus 1,2 m, mindestens jedoch 3 Durchmesser.', 'Typische lengte-diameterverhoudingen zijn 3 tot 5 voor horizontale vaten en 2,5 tot 6 voor verticale; de mantelhoogte van verticale vaten is hier de vloeistofhoogte plus één diameter plus 1,2 m, met een minimum van 3 diameters.', 'Les rapports longueur/diamètre typiques sont de 3 à 5 pour les ballons horizontaux et de 2,5 à 6 pour les verticaux ; la hauteur de virole verticale est ici la hauteur de liquide plus un diamètre plus 1,2 m, avec un minimum de 3 diamètres.', 'Las relaciones longitud/diámetro típicas son de 3 a 5 para recipientes horizontales y de 2,5 a 6 para verticales; la altura de la carcasa vertical aquí es la altura del líquido más un diámetro más 1,2 m, con un mínimo de 3 diámetros.', 'Typowe stosunki długości do średnicy wynoszą od 3 do 5 dla zbiorników poziomych i od 2,5 do 6 dla pionowych; wysokość płaszcza zbiornika pionowego to tutaj wysokość cieczy plus jedna średnica plus 1,2 m, co najmniej 3 średnice.')
          },
          govern: {
            title: T('Gas-governed or liquid-governed', 'Визначає газ чи рідина', 'Gas- oder flüssigkeitsbestimmt', 'Bepaald door gas of door vloeistof', 'Gouverné par le gaz ou par le liquide', 'Gobernado por el gas o por el líquido', 'Decyduje gaz czy ciecz'),
            body: T('A horizontal vessel gets two diameters: Dg from the gas area above the liquid and Dl = cbrt(4·Ql·tr/(π·fill·L/D)) from the held liquid; the larger one is used. When liquid governs, vg/vmax drops well below 1 and a better mist eliminator does not make the vessel smaller - only less retention time, a higher fill or a longer L/D does. A vertical vessel takes its diameter from the gas alone, so a large liquid load only makes it taller.', 'Горизонтальна посудина має два діаметри: Dg за площею газу над рідиною та Dl = cbrt(4·Ql·tr/(π·fill·L/D)) за утримуваною рідиною; береться більший. Коли визначає рідина, vg/vmax значно нижче 1, і кращий краплевловлювач посудину не зменшить — допоможе лише менший час утримання, більша частка заповнення або більше L/D. Вертикальна посудина бере діаметр лише за газом, тож велике навантаження рідиною робить її тільки вищою.', 'Ein liegender Behälter erhält zwei Durchmesser: Dg aus der Gasfläche über der Flüssigkeit und Dl = cbrt(4·Ql·tr/(π·fill·L/D)) aus der vorgehaltenen Flüssigkeit; der größere gilt. Bestimmt die Flüssigkeit, liegt vg/vmax deutlich unter 1, und ein besserer Demister verkleinert den Behälter nicht - nur kürzere Verweilzeit, höherer Füllgrad oder größeres L/D. Ein stehender Behälter erhält seinen Durchmesser nur aus dem Gas; eine große Flüssigkeitsmenge macht ihn nur höher.', 'Een horizontaal vat krijgt twee diameters: Dg uit het gasoppervlak boven de vloeistof en Dl = cbrt(4·Ql·tr/(π·fill·L/D)) uit de vastgehouden vloeistof; de grootste geldt. Bepaalt de vloeistof, dan ligt vg/vmax ruim onder 1 en maakt een betere demister het vat niet kleiner - alleen kortere verblijftijd, hogere vulgraad of grotere L/D. Een verticaal vat haalt zijn diameter alleen uit het gas; een grote vloeistoflast maakt het alleen hoger.', 'Un ballon horizontal reçoit deux diamètres : Dg d\'après la section de gaz au-dessus du liquide et Dl = cbrt(4·Ql·tr/(π·fill·L/D)) d\'après le liquide retenu ; le plus grand est retenu. Quand le liquide gouverne, vg/vmax tombe nettement sous 1 et un meilleur dévésiculeur ne réduit pas le ballon : seuls un temps de rétention plus court, un remplissage plus élevé ou un L/D plus grand le font. Un ballon vertical tire son diamètre du gaz seul ; une grosse charge liquide ne fait que l\'allonger.', 'Un recipiente horizontal obtiene dos diámetros: Dg por el área de gas sobre el líquido y Dl = cbrt(4·Ql·tr/(π·fill·L/D)) por el líquido retenido; se usa el mayor. Cuando gobierna el líquido, vg/vmax queda muy por debajo de 1 y un mejor demister no reduce el recipiente: solo menos tiempo de retención, más llenado o mayor L/D. Un recipiente vertical toma el diámetro solo del gas; una gran carga de líquido solo lo hace más alto.', 'Zbiornik poziomy ma dwie średnice: Dg z pola przekroju gazu nad cieczą i Dl = cbrt(4·Ql·tr/(π·fill·L/D)) z zatrzymanej cieczy; przyjmuje się większą. Gdy decyduje ciecz, vg/vmax jest wyraźnie poniżej 1, a lepszy odkraplacz nie zmniejszy zbiornika - pomaga tylko krótszy czas retencji, większe wypełnienie lub większe L/D. Zbiornik pionowy bierze średnicę wyłącznie z gazu, więc duże obciążenie cieczą czyni go tylko wyższym.')

          rounding: {
            title: T('Rounding, minimum height and what is not included', 'Округлення, мінімальна висота і що не враховано', 'Rundung, Mindesthöhe und was nicht enthalten ist', 'Afronding, minimale hoogte en wat niet is meegenomen', 'Arrondi, hauteur minimale et ce qui n\'est pas inclus', 'Redondeo, altura mínima y lo que no se incluye', 'Zaokrąglenie, minimalna wysokość i czego nie uwzględniono'),
            body: T('The required diameter D is rounded up to the next 6 in (0.1524 m) step, so a 1 % change of gas rate can move Dsel by a whole step or not at all. The vertical shell is at least 3·Dsel tall, which governs for most gas scrubbers. Heads, nozzles, inlet devices, surge and level-control allowances, weir sections of three-phase vessels and foaming derating are not included; treat the result as a preliminary size to check against vendor data.', 'Потрібний діаметр D округлюється вгору до наступного кроку 6 дюймів (0,1524 м), тож зміна витрати газу на 1 % може змістити Dsel на цілий крок або зовсім не змінити. Вертикальний корпус має висоту щонайменше 3·Dsel, і для більшості газових скруберів саме це визначає висоту. Днища, патрубки, вхідні пристрої, запаси на пробки та регулювання рівня, переливні секції трифазних апаратів і поправку на піноутворення не враховано; результат — попередній розмір для перевірки за даними постачальника.', 'Der erforderliche Durchmesser D wird auf die nächste 6-in-Stufe (0,1524 m) aufgerundet; 1 % mehr Gas kann Dsel um eine ganze Stufe verschieben oder gar nicht. Der stehende Mantel ist mindestens 3·Dsel hoch, was bei den meisten Gaswäschern maßgebend ist. Böden, Stutzen, Einlaufeinrichtungen, Schwall- und Standregelreserven, Wehrabschnitte von 3-Phasen-Behältern und Schaumabminderung sind nicht enthalten; das Ergebnis ist eine Vorauslegung, die mit Herstellerdaten zu prüfen ist.', 'De vereiste diameter D wordt naar boven afgerond op de volgende stap van 6 in (0,1524 m); 1 % meer gas kan Dsel een hele stap verschuiven of helemaal niet. De verticale mantel is minstens 3·Dsel hoog, wat bij de meeste gasscrubbers bepalend is. Bodems, nozzles, inlaatvoorzieningen, buffer- en niveauregelreserves, overloopsecties van 3-fasevaten en schuimcorrectie zijn niet meegenomen; zie het resultaat als voorlopige maat om met leveranciersgegevens te toetsen.', 'Le diamètre requis D est arrondi au pas de 6 in (0,1524 m) supérieur ; 1 % de gaz en plus peut déplacer Dsel d\'un pas entier ou pas du tout. La virole verticale mesure au moins 3·Dsel, ce qui gouverne pour la plupart des épurateurs de gaz. Fonds, piquages, dispositifs d\'entrée, réserves de bouchon et de régulation de niveau, compartiments à déversoir des ballons triphasiques et déclassement pour moussage ne sont pas inclus ; le résultat est une taille préliminaire à vérifier avec les données du fournisseur.', 'El diámetro requerido D se redondea al siguiente paso de 6 in (0,1524 m); un 1 % más de gas puede mover Dsel un paso entero o nada. La carcasa vertical mide al menos 3·Dsel, lo que gobierna en la mayoría de los depuradores de gas. No se incluyen cabezales, boquillas, dispositivos de entrada, márgenes de bache y control de nivel, compartimentos con vertedero de recipientes trifásicos ni la reducción por espuma; el resultado es un tamaño preliminar a comprobar con datos del fabricante.', 'Wymaganą średnicę D zaokrągla się w górę do następnego kroku 6 in (0,1524 m), więc 1 % więcej gazu może przesunąć Dsel o cały krok albo wcale. Płaszcz pionowy ma co najmniej 3·Dsel wysokości, co decyduje w większości skruberów gazu. Dennice, króćce, urządzenia wlotowe, zapasy na korki i regulację poziomu, sekcje przelewowe zbiorników trójfazowych i redukcja na pienienie nie są uwzględnione; wynik to wstępny rozmiar do sprawdzenia z danymi dostawcy.')

          'Achten Sie auf L: 1,8 m³ Flüssigkeitsvorlage brauchen nur 0,69 m Höhe, die Mantelhöhe 5,49 m folgt aus dem Minimum 3·D; das Gas strömt im 1,83-m-Mantel mit 84 % von vmax = 0,451 m/s.',
          'Kijk naar L: 1,8 m³ vloeistofbuffer vraagt maar 0,69 m hoogte, dus de mantel van 5,49 m volgt uit het minimum 3·D; het gas stroomt met 84 % van vmax = 0,451 m/s in de mantel van 1,83 m.',

          'Подивіться на vmax: щільний газ (70 кг/м³) над легким конденсатом допускає лише 0,294 м/с, тож 2 м³/с потребують корпусу 3,05 м при 93 % від межі, хоча рідини лише 0,24 м³.',
          'Achten Sie auf vmax: dichtes Gas (70 kg/m³) über leichtem Kondensat erlaubt nur 0,294 m/s, daher braucht 2 m³/s einen 3,05-m-Mantel bei 93 % der Grenze, obwohl nur 0,24 m³ Flüssigkeit vorgehalten werden.',
          'Kijk naar vmax: dicht gas (70 kg/m³) boven licht condensaat laat maar 0,294 m/s toe, dus 2 m³/s vraagt een mantel van 3,05 m op 93 % van de limiet, terwijl de vloeistofbuffer maar 0,24 m³ is.',
          'Regardez vmax : un gaz dense (70 kg/m³) sur un condensat léger n\'autorise que 0,294 m/s, donc 2 m³/s exigent une virole de 3,05 m à 93 % de la limite, alors que la rétention liquide n\'est que de 0,24 m³.',
          'Fíjese en vmax: un gas denso (70 kg/m³) sobre condensado ligero solo admite 0,294 m/s, así que 2 m³/s requieren una carcasa de 3,05 m al 93 % del límite, aunque el líquido retenido sea solo 0,24 m³.',

        apply: function (t) { base(t); t.Qg = 2; t.rhog = 70; t.rhol = 600; t.Ql = 0.002; t.tr = 120; } },
      { id: 'vertmist', group: G1,
        label: T('Vertical with mist pad', 'Вертикальний з краплевловлювачем', 'Vertikal mit Demister', 'Verticaal met demistermat', 'Vertical avec dévésiculeur', 'Vertical con eliminador de niebla', 'Pionowy z odkraplaczem'),

          'Kijk naar Vvessel: een draadgaasdemister verhoogt K van 0,107 naar 0,18 m/s, vmax stijgt naar 0,758 m/s en de standaardtaak past in een mantel van 1,37 m met 6,08 m³ in plaats van 14,4 m³.',
          'Regardez Vvessel : un matelas dévésiculeur qui porte K de 0,107 à 0,18 m/s élève vmax à 0,758 m/s et ramène le cas par défaut à une virole de 1,37 m et 6,08 m³ au lieu de 14,4 m³.',
          'Fíjese en Vvessel: una malla demister que sube K de 0,107 a 0,18 m/s eleva vmax a 0,758 m/s y reduce el caso por defecto a una carcasa de 1,37 m y 6,08 m³ en lugar de 14,4 m³.',

        apply: function (t) { base(t); t.level = 'full'; t.K = 0.18; } },
      { id: 'slugvert', group: G1,
        label: T('Vertical with a slug-size liquid load', 'Вертикальний із пробковим навантаженням рідини', 'Vertikal mit Schwall-Flüssigkeitsmenge', 'Verticaal met slugvloeistoflast', 'Vertical avec charge liquide de bouchon', 'Vertical con carga de líquido tipo bache', 'Pionowy z korkowym obciążeniem cieczą'),
        note: T('Look at L and the warning: the default gas still fits a 1.83 m shell, but 60 m³ of liquid stacks up 22.8 m, making a 25.9 m tower with H/D 14 - the same duty in the horizontal slug-catcher preset is 3.05 × 15.2 m.',
          'Подивіться на L і попередження: типовий газ і далі вміщується в корпус 1,83 м, але 60 м³ рідини займають 22,8 м висоти, і виходить колона 25,9 м з H/D 14 — той самий режим у горизонтальному пресеті слагкетчера дає 3,05 × 15,2 м.',

          'Regardez L et l\'avertissement : le gaz par défaut tient toujours dans 1,83 m, mais 60 m³ de liquide montent à 22,8 m, soit une tour de 25,9 m à H/D 14 ; le même service dans l\'exemple horizontal slug catcher donne 3,05 × 15,2 m.',
          'Fíjese en L y la advertencia: el gas por defecto sigue cabiendo en 1,83 m, pero 60 m³ de líquido suben 22,8 m, una torre de 25,9 m con H/D 14; el mismo servicio en el ejemplo horizontal slug catcher da 3,05 × 15,2 m.',
          'Spójrz na L i ostrzeżenie: gaz domyślny nadal mieści się w 1,83 m, ale 60 m³ cieczy zajmuje 22,8 m wysokości, co daje wieżę 25,9 m o H/D 14; to samo zadanie w poziomym przykładzie slug catcher to 3,05 × 15,2 m.'),
        apply: function (t) { base(t); t.Ql = 0.1; t.tr = 600; } },
      { id: 'horiz3ph', group: G2,
        label: T('Horizontal 3-phase oil', 'Горизонтальний трифазний (нафта)', 'Horizontal 3-Phasen Öl', 'Horizontaal 3-fase olie', 'Horizontal triphasique pétrole', 'Horizontal trifásico de crudo', 'Poziomy trójfazowy (ropa)'),
        note: T('Look at vg/vmax: the 5-minute oil retention sets the diameter (1.79 m against 1.28 m for the gas), so the 1.83 m shell runs the gas at only 49 % of vmax = 0.78 m/s - a better mist pad would not shrink it.',
          'Подивіться на vg/vmax: 5-хвилинне утримання нафти задає діаметр (1,79 м проти 1,28 м за газом), тож у корпусі 1,83 м газ іде лише з 49 % від vmax = 0,78 м/с — кращий краплевловлювач його не зменшить.',
          'Achten Sie auf vg/vmax: die 5-minütige Ölverweilzeit bestimmt den Durchmesser (1,79 m gegenüber 1,28 m für das Gas), daher nutzt das Gas im 1,83-m-Mantel nur 49 % von vmax = 0,78 m/s - ein besserer Demister verkleinert ihn nicht.',
          'Kijk naar vg/vmax: de olieverblijftijd van 5 minuten bepaalt de diameter (1,79 m tegen 1,28 m voor het gas), dus het gas gebruikt in de mantel van 1,83 m maar 49 % van vmax = 0,78 m/s - een betere demister maakt hem niet kleiner.',
          'Regardez vg/vmax : la rétention d\'huile de 5 minutes fixe le diamètre (1,79 m contre 1,28 m pour le gaz), la virole de 1,83 m ne fait donc passer le gaz qu\'à 49 % de vmax = 0,78 m/s ; un meilleur dévésiculeur ne la réduirait pas.',
          'Fíjese en vg/vmax: la retención de crudo de 5 minutos fija el diámetro (1,79 m frente a 1,28 m por el gas), así que en la carcasa de 1,83 m el gas va solo al 49 % de vmax = 0,78 m/s; un mejor demister no la reduciría.',
          'Spójrz na vg/vmax: 5-minutowa retencja ropy wyznacza średnicę (1,79 m wobec 1,28 m dla gazu), więc w płaszczu 1,83 m gaz płynie z zaledwie 49 % vmax = 0,78 m/s - lepszy odkraplacz go nie zmniejszy.'),
        apply: function (t) { base(t); t.orient = 'horizontal'; t.Qg = 0.5; t.rhog = 30; t.rhol = 820; t.Ql = 0.03; t.tr = 300; } },
      { id: 'slugcatch', group: G2,
        label: T('Slug-catcher-like, high liquid', 'Типу слагкетчер, багато рідини', 'Slug-Catcher-ähnlich, viel Flüssigkeit', 'Slugcatcher-achtig, veel vloeistof', 'Type slug catcher, fort débit liquide', 'Tipo slug catcher, mucho líquido', 'Typu slug catcher, dużo cieczy'),
        note: T('Look at the warning: the gas rate is the default 1 m³/s, which alone would need 2.23 m, but holding 60 m³ for 10 minutes pushes the shell to 3.05 × 15.2 m and leaves the gas at 54 % of vmax.',
          'Подивіться на попередження: витрата газу типова, 1 м³/с, і сама по собі потребувала б 2,23 м, але утримання 60 м³ протягом 10 хвилин збільшує корпус до 3,05 × 15,2 м, а газ іде лише з 54 % від vmax.',
          'Achten Sie auf die Warnung: der Gasdurchfluss ist der Standardwert 1 m³/s und bräuchte allein 2,23 m, doch 60 m³ für 10 Minuten vorzuhalten treibt den Mantel auf 3,05 × 15,2 m, das Gas nutzt nur 54 % von vmax.',
          'Kijk naar de waarschuwing: het gasdebiet is de standaard 1 m³/s, dat alleen 2,23 m zou vragen, maar 60 m³ gedurende 10 minuten vasthouden drijft de mantel op tot 3,05 × 15,2 m en het gas gebruikt maar 54 % van vmax.',
          'Regardez l\'avertissement : le débit de gaz est celui par défaut, 1 m³/s, qui seul demanderait 2,23 m, mais retenir 60 m³ pendant 10 minutes porte la virole à 3,05 × 15,2 m et le gaz n\'utilise que 54 % de vmax.',
          'Fíjese en la advertencia: el caudal de gas es el de por defecto, 1 m³/s, que por sí solo pediría 2,23 m, pero retener 60 m³ durante 10 minutos lleva la carcasa a 3,05 × 15,2 m y el gas usa solo el 54 % de vmax.',
          'Spójrz na ostrzeżenie: przepływ gazu jest domyślny, 1 m³/s, i sam wymagałby 2,23 m, ale utrzymanie 60 m³ przez 10 minut zwiększa płaszcz do 3,05 × 15,2 m, a gaz wykorzystuje tylko 54 % vmax.'),
        apply: function (t) { base(t); t.orient = 'horizontal'; t.Ql = 0.1; t.tr = 600; t.fill = 0.6; t.LD = 5; } },
      { id: 'horizlp', group: G2,
        label: T('Low-pressure horizontal', 'Горизонтальний низького тиску', 'Horizontal, Niederdruck', 'Horizontaal lagedruk', 'Horizontal basse pression', 'Horizontal de baja presión', 'Poziomy niskociśnieniowy'),
        note: T('Look at vmax and ts: light gas (5 kg/m³) is allowed 1.98 m/s, so 3 m³/s fits a 1.98 × 7.93 m shell at 98.5 % of the limit; droplets settle in 0.50 s against 4.07 s of gas residence.',
          'Подивіться на vmax і ts: для легкого газу (5 кг/м³) допустимо 1,98 м/с, тож 3 м³/с вміщуються в корпус 1,98 × 7,93 м при 98,5 % від межі; краплі осідають за 0,50 с при 4,07 с перебування газу.',
          'Achten Sie auf vmax und ts: leichtes Gas (5 kg/m³) darf 1,98 m/s strömen, daher passt 3 m³/s in einen 1,98 × 7,93-m-Mantel bei 98,5 % der Grenze; Tröpfchen setzen sich in 0,50 s bei 4,07 s Gasverweilzeit ab.',
          'Kijk naar vmax en ts: licht gas (5 kg/m³) mag 1,98 m/s, dus 3 m³/s past in een mantel van 1,98 × 7,93 m op 98,5 % van de limiet; druppels bezinken in 0,50 s tegen 4,07 s verblijftijd van het gas.',
          'Regardez vmax et ts : un gaz léger (5 kg/m³) est admis à 1,98 m/s, 3 m³/s tiennent donc dans une virole de 1,98 × 7,93 m à 98,5 % de la limite ; les gouttelettes décantent en 0,50 s pour 4,07 s de séjour du gaz.',
          'Fíjese en vmax y ts: el gas ligero (5 kg/m³) admite 1,98 m/s, así que 3 m³/s caben en una carcasa de 1,98 × 7,93 m al 98,5 % del límite; las gotas sedimentan en 0,50 s frente a 4,07 s de residencia del gas.',
          'Spójrz na vmax i ts: lekki gaz (5 kg/m³) może płynąć z 1,98 m/s, więc 3 m³/s mieści się w płaszczu 1,98 × 7,93 m przy 98,5 % limitu; krople opadają w 0,50 s wobec 4,07 s przebywania gazu.'),
        apply: function (t) { base(t); t.level = 'full'; t.orient = 'horizontal'; t.rhog = 5; t.Qg = 3; t.rhol = 850; t.Ql = 0.02; t.K = 0.152; } }
    ];
    ui.examples(EX);

    ui.stage({
      caption: T('Separator vessel to scale: selected diameter, shell height or length and liquid level (Souders-Brown)', 'Сепаратор у масштабі: вибраний діаметр, висота або довжина корпусу та рівень рідини (Саудерс-Браун)', 'Abscheiderbehälter maßstabsgetreu: gewählter Durchmesser, Mantelhöhe oder -länge und Flüssigkeitsstand (Souders-Brown)', 'Afscheidervat op schaal: gekozen diameter, mantelhoogte of -lengte en vloeistofniveau (Souders-Brown)', 'Séparateur à l\'échelle : diamètre retenu, hauteur ou longueur de virole et niveau de liquide (Souders-Brown)', 'Recipiente separador a escala: diámetro seleccionado, altura o longitud de la carcasa y nivel de líquido (Souders-Brown)', 'Zbiornik separatora w skali: wybrana średnica, wysokość lub długość płaszcza i poziom cieczy (Souders-Brown)'),
      minHeight: 300,
      a11y: function () {
        if (!last || !last.ok) return TL(NORES);
        var f = DiagramUI.fmt, a = [f(last.Dsel, { precision: 3 }), f(last.L, { precision: 2 }), f(last.vg, { precision: 3 }), f(last.vmax, { precision: 3 })];
        if (last.orient === 'vertical') return TL(TF(T('Vertical separator: diameter $1 m, shell height $2 m, gas velocity $3 m/s against an allowable $4 m/s.', 'Вертикальний сепаратор: діаметр $1 м, висота корпусу $2 м, швидкість газу $3 м/с при допустимій $4 м/с.', 'Vertikaler Abscheider: Durchmesser $1 m, Mantelhöhe $2 m, Gasgeschwindigkeit $3 m/s bei zulässigen $4 m/s.', 'Verticale scheider: diameter $1 m, mantelhoogte $2 m, gassnelheid $3 m/s tegenover toelaatbaar $4 m/s.', 'Séparateur vertical : diamètre $1 m, hauteur de virole $2 m, vitesse du gaz $3 m/s pour $4 m/s admissibles.', 'Separador vertical: diámetro $1 m, altura de carcasa $2 m, velocidad del gas $3 m/s frente a $4 m/s admisibles.', 'Separator pionowy: średnica $1 m, wysokość płaszcza $2 m, prędkość gazu $3 m/s przy dopuszczalnej $4 m/s.'), a));
        return TL(TF(T('Horizontal separator: diameter $1 m, shell length $2 m, gas velocity $3 m/s against an allowable $4 m/s.', 'Горизонтальний сепаратор: діаметр $1 м, довжина корпусу $2 м, швидкість газу $3 м/с при допустимій $4 м/с.', 'Liegender Abscheider: Durchmesser $1 m, Mantellänge $2 m, Gasgeschwindigkeit $3 m/s bei zulässigen $4 m/s.', 'Horizontale scheider: diameter $1 m, mantellengte $2 m, gassnelheid $3 m/s tegenover toelaatbaar $4 m/s.', 'Séparateur horizontal : diamètre $1 m, longueur de virole $2 m, vitesse du gaz $3 m/s pour $4 m/s admissibles.', 'Separador horizontal: diámetro $1 m, longitud de carcasa $2 m, velocidad del gas $3 m/s frente a $4 m/s admisibles.', 'Separator poziomy: średnica $1 m, długość płaszcza $2 m, prędkość gazu $3 m/s przy dopuszczalnej $4 m/s.'), a));
      },
      render: renderSeparator
    });
    adoptStage(ui);

    ui.ready();
    window.__separator_sizing = { ui: ui, state: state, solve: solve, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function buildRecord() {
    if (!last) return null;
    var s = state, i, k;
    var U = {
      Qg: 'm3/s', rhog: 'kg/m3', rhol: 'kg/m3', Ql: 'm3/s', K: 'm/s', fill: '-', tr: 's', LD: '-',
      vmax: 'm/s', D: 'm', Dsel: 'm', L: 'm', A: 'm2', vg: 'm/s', vgRatio: '-', hL: 'm', hLiq: 'm',
      Vliq: 'm3', Vvessel: 'm3', tres: 's', ts: 's', orient: '-'
    };
    var inputs = {
      orient: s.orient, Qg: s.Qg, rhog: s.rhog, rhol: s.rhol, Ql: s.Ql,
      K: (s.level === 'full' ? s.K : null), fill: s.fill, tr: s.tr, LD: s.LD
    };
    var outKeys = ['K', 'vmax', 'D', 'Dsel', 'L', 'LD', 'A', 'vg', 'vgRatio', 'hL', 'hLiq', 'Vliq', 'Vvessel', 'tres', 'ts'];
    var outputs = {}, units = {};
    if (last.ok) {
      for (i = 0; i < outKeys.length; i++) {
        k = outKeys[i];
        if (typeof last[k] === 'number' && isFinite(last[k])) outputs[k] = last[k];
      }
    }
    for (k in inputs) {
      if (Object.prototype.hasOwnProperty.call(inputs, k) && Object.prototype.hasOwnProperty.call(U, k)) units[k] = U[k];
    }
    for (k in outputs) {
      if (Object.prototype.hasOwnProperty.call(outputs, k) && Object.prototype.hasOwnProperty.call(U, k)) units[k] = U[k];
    }
    var warnings = last.ok ? (last.warnings ? last.warnings.slice() : []) : [last.err];
    return {
      inputs: inputs,
      outputs: outputs,
      units: units,
      model: {
        equations: [
          'vmax = K*sqrt((rhol-rhog)/rhog)',
          'vertical: D = sqrt(4*Qg/(pi*vmax))',
          'horizontal: D = max(sqrt(4*Qg/(pi*(1-fill)*vmax)), cbrt(4*Ql*tr/(pi*fill*LD)))',
          'Dsel = D rounded up to 0.1524 m'
        ],
        ranges: ['K typically 0.03-0.25 m/s'],
        notes: ['GPSA Engineering Data Book 14th ed. (2017) Sect. 7; API Spec 12J 8th ed. (2008)']
      },
      warnings: warnings
    };
  }
  var HANDOFF = {
    provides: ['D', 'L', 'rho'],
    accepts: ['rho'],
    build: function () {
      if (!last || !last.ok) return null;
      return {
        quantities: { D: { value: last.Dsel, unit: 'm' }, L: { value: last.L, unit: 'm' }, rho: { value: state.rhog, unit: 'kg/m3' } },
        sets: { separator: [{ D: { value: last.Dsel, unit: 'm' }, L: { value: last.L, unit: 'm' }, A: { value: last.A, unit: 'm2' }, Vdot: { value: state.Qg, unit: 'm3/s' } }] }
      };
    },
    apply: function (payload) {
      var q = (payload && payload.quantities) || {};
      var v = q.rho && q.rho.value;
      if (typeof v === 'number' && isFinite(v) && v > 0) state.rhog = v;
      last = solve(state);
      if (ui) { ui.sync(); ui.run(); }
    }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'separator_sizing',
        file: 'separator_sizing.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
