   inspection interval from a UT thickness trend (one-sided 95 % bound of the thinning rate). No SIL is inferred. */
var MI_VERSION = '2026-10-09.mi-3';
var MI_MODES = ['proof', 'age', 'rbi'];
var MI_ARCH = ['1oo1', '1oo2'];

_data_source":"de gegevensbron en revisie vastleggen","a_confirm_data":"de gegevens bevestigen","a_shorten_interval_or_improve_test":"het interval verkorten of de dekkingsgraad van de periodieke test verhogen","a_revise_replacement_age":"de vervangingsleeftijd herzien","a_shorten_inspection_interval":"het inspectie-interval verkorten","exControl":"Oefenfunctie 1oo1 (controle)","exControlNote":"λDU 1e-6 /h, volledige test elke 1000 h: PFDavg = 4,998 × 10⁻⁴ ≈ λT/2.","exProof":"Periodieke test 1 → 2 jaar, 1oo2 (typisch)","exProofNote":"λDU 2 × 10⁻⁶ /h, dekkingsgraad 0,9, β 0,1: PFDavg 1,92 × 10⁻³ → 3,02 × 10⁻³ (× 1,57), binnen een streefwaarde van 4 × 10⁻³; de piek bereikt 6,75 × 10⁻³.","exAge":"Mechanische asafdichting: vervangingsleeftijd","exAgeNote":"Zes faalgevallen en drie eenheden in bedrijf: k = 3,38, η = 21 340 h; optimum 9 299 h bij 0,231 €/h; de voorgestelde 13 140 h kosten 0,267 €/h, binnen een grenswaarde van 0,3 €/h.","exRbi":"Leiding CML-07: UT-trend","exRbiNote":"Vijf metingen over 12 jaar: trendgrens 0,137 mm/j, de kortetermijnsnelheid 0,143 mm/j is bepalend: restlevensduur 10,6 jaar, aanbevolen interval 5,30 jaar bij een voorgestelde 5 jaar.","exProblem":"Leiding zonder t_min en meetgeschiedenis (probleem)","exProblemNote":"Eén meting en geen t_min: er wordt geen interval aanbevolen; de benodigde gegevens worden opgesomd.","exTry":"Probeer: interval verdubbeld, gedeeltelijke periodieke test","exTryNote":"Periodieke test 1 → 2 jaar met 60 % dekkingsgraad en een volledige test elke 10 jaar: PFDavg 9,06 × 10⁻³ ligt onder de streefwaarde van 10⁻², de piek bereikt 1,81 × 10⁻².","exFix":"Oplossing: volledige test elke 4 jaar","exFixNote":"Volledige test elke 4 jaar: PFDavg 4,89 × 10⁻³ en piek 9,76 × 10⁻³, beide onder 10⁻².","learnIntroTitle":"Welke vraag het hulpmiddel beantwoordt","learnIntro":"Hoe een gewijzigd interval één gekozen grootheid beïnvloedt: de PFDavg van een veiligheidsfunctie, de kosten per tijdseenheid bij vervanging op leeftijd, of het ins ximale atteint 1,81 × 10⁻².","exFix":"Corrigé : test complet tous les 4 ans","exFixNote":"Test complet tous les 4 ans : PFDavg 4,89 × 10⁻³ et valeur maximale 9,76 × 10⁻³, toutes deux inférieures à 10⁻².","learnIntroTitle":"À quoi répond l'outil","learnIntro":"Comment un intervalle modifié agit sur une grandeur choisie : la PFDavg d'une fonction de sécurité, le coût par unité de temps du remplacement selon l'âge, ou l'intervalle d'inspection d'une paroi qui s'amincit. Chaque mode est autonome.","learnDataTitle":"Données par mode","learnData":"Test périodique : λDU, couverture, β, intervalles, temps de réparation. Remplacement selon l'âge : âges à la défaillance et âges des unités en service ou paramètres de Weibull, coûts. Inspection : mesures d'épaisseur datées et t_min. Chaque jeu porte sa source, sa révision et son statut.","learnModelTitle":"Modèle","learnModel":"PFDavg est la moyenne temporelle de la probabilité d'une défaillance dangereuse non détectée ; la part non couverte par le test périodique s'accumule jusqu'au test complet. La valeur maximale est celle atteinte juste avant le test complet.","learnTryTitle":"À tester","learnTry":"Ouvrez l'exemple « intervalle doublé, test périodique partiel » et calculez. Avant de lire la suite : suffit-il que la moyenne soit inférieure à la valeur cible ?","learnExplainTitle":"Explication","learnExplain":"La moyenne masque les 40 % non couverts : ils s'accumulent jusqu'au test complet au bout de 10 ans, et pendant les années qui précèdent ce test la PFD reste au-dessus de la valeur cible.","learnFixTitle":"Correction","learnFix":"Raccourcissez l'intervalle du test complet à 4 ans : PFDavg 4,89 × 10⁻³ et la valeur maximale 9,76 × 10⁻³ restent toutes deux sous la valeur cible.","learnBoundaryTitle":"Où s'arrête le chiffre","learnBoundary":"Aucun SIL n'est déduit de PFDavg ; les contraintes architecturales, la capacité systématique et le mode de sollicitation comptent aussi. L'outil ne fixe aucune valeur cible ni limite propre, et l'approbation reste une décision distincte.","reportTitle":"Modification des intervalles de maintenance et d'essai","modelVersion":"Version du modèle","eqNote_proof":"Symboles : λ — λDU ; a — âge des parts non couverte et couverte ; C — couverture ; T — intervalle de test périodique ; T_f — intervalle du test complet ; k — rang du test périodique dans T_f ; u — temps écoulé depuis le dernier test périodique ; β — facteur de cause commune ; MRT — temps moyen de réparation.","eqNote_age":"Symboles : S — probabilité de survie ; F = 1 − S ; h — taux de défaillance instantané ; k, η — paramètres de forme et d'échelle de Weibull ; γ — fonction gamma incomplète inférieure ; C_p, C_f — coûts du remplacement planifié et du remplacement après défaillance ; c — coût par unité de temps ; T* — âge de remplacement économique.","eqNote_rbi":"Symboles : th — épaisseur ; x — temps ; a, b — ordonnée à l'origine et pente de la droite des moindres carrés ; s_b — erreur type de b ; t₀.₉₅,ₙ₋₂ — quantile unilatéral à 95 % de la loi t de Student ; r₉₅ — vitesse d'amincissement enveloppe ; RL — durée de vie résiduelle ; f — fraction ; I_max — maximum réglementaire. r_LT, r_ST — vitesses long terme et court terme entre mesures (API 510 / API 570) ; r — vitesse retenue, la plus grande des trois.","modelText_proof":"Défaillances exponentielles à λDU constant, réparation parfaite, tests périodiques à intervalles fixes ; seul le test complet restaure la part non couverte ; le 1oo2 utilise le modèle du facteur bêta.","modelText_age":"Renouvellement au remplacement ou à la défaillance, durées de vie de Weibull ; l'ajustement est l'estimation du maximum de vraisemblance avec censure.","modelText_rbi":"Amincissement linéaire ; l'intervalle est une fraction de la durée de vie résiduelle à la vitesse enveloppe, plafonné par le maximum réglementaire.","boundaryText":"L'outil ne fixe aucune valeur cible d'acceptation, ne déduit aucun SIL et ne fournit aucune conclusion réglementaire ; l'approbat or debajo de t_min.","w_estimated_data":"Los datos están marcados como estimados.","w_restored_values":"Al cargar se sustituyeron valores guardados: ","a_select_mode":"seleccionar un modo de cálculo","a_correct_input":"corregir los datos","a_set_full_test_interval":"fijar el intervalo de la prueba completa","a_collect_failure_data":"recopilar más datos de fallos o introducir los parámetros de Weibull","a_collect_thickness_data":"realizar al menos tres mediciones de espesor","a_determine_t_min":"determinar t_min según el código de diseño","a_set_criterion":"fijar el criterio de aceptación","a_assess_fitness_for_service":"evaluar de inmediato la aptitud para el servicio o reparar","a_record_data_source":"registrar la fuente de los datos y su revisión","a_confirm_data":"confirmar los datos","a_shorten_interval_or_improve_test":"acortar el intervalo o mejorar la cobertura de la prueba periódica","a_revise_replacement_age":"revisar la edad de reemplazo","a_shorten_inspection_interval":"acortar el intervalo de inspección","exControl":"Función 1oo1 de formación (control)","exControlNote":"λDU 1e-6 /h, prueba completa cada 1000 h: PFDavg = 4,998 × 10⁻⁴ ≈ λT/2.","exProof":"Prueba periódica 1 → 2 años, 1oo2 (típico)","exProofNote":"λDU 2 × 10⁻⁶ /h, cobertura 0,9, β 0,1: PFDavg 1,92 × 10⁻³ → 3,02 × 10⁻³ (× 1,57), dentro de un objetivo de 4 × 10⁻³; el valor máximo llega a 6,75 × 10⁻³.","exAge":"Sello mecánico: edad de reemplazo","exAgeNote":"Seis fallos y tres unidades en servicio: k = 3,38, η = 21 340 h; óptimo 9 299 h a 0,231 €/h; las 13 140 h propuestas cuestan 0,267 €/h, dentro de un límite de 0,3 €/h.","exRbi":"Tubería CML-07: tendencia UT","exRbiNote":"Cinco lecturas en 12 años: límite de la tendencia 0,137 mm/a, gobierna la velocidad a corto plazo 0,143 mm/a: vida remanente 10,6 años, intervalo recomendado 5,30 años para 5 años propuestos.","exProblem":"Tubería sin t_min ni historial (problema)","exProblemNote":"Una medición y sin t_min: no se recomienda ningún intervalo; se enumeran los datos necesarios.","exTry":"Ejercicio: intervalo duplicado, prueba periódica parcial","exTryNote":"Prueba periódica 1 → 2 años con un 60 % de cobertura y una prueba completa cada 10 años: PFDavg 9,06 × 10⁻³ queda por debajo del objetivo de 10⁻², el valor máximo llega a 1,81 × 10⁻².","exFix":"Solución: prueba completa cada 4 años","exFixNote":"Prueba completa cada 4 años: PFDavg 4,89 × 10⁻³ y valor máximo 9,76 × 10⁻³, ambos por debajo de 10⁻².","learnIntroTitle":"Qué responde la herramienta","learnIntro":"Cómo afecta un intervalo modificado a una magnitud elegida: la PFDavg de una función de seguridad, el coste por unidad de tiempo del reemplazo por edad o el intervalo de inspección de una pared que adelgaza. Cada modo es independiente.","learnDataTitle":"Datos por modo","learnData":"Prueba periódica: λDU, cobertura, β, intervalos, tiempo de reparación. Reemplazo por edad: edades de fallo y edades de unidades en servicio o parámetros de Weibull, costes. Inspección: lecturas de espesor fechadas y t_min. Cada conjunto lleva su fuente, revisión y estado.","learnModelTitle":"Modelo","learnModel":"PFDavg es el promedio temporal de la probabilidad de un fallo peligroso no detectado; la parte no cubierta por la prueba periódica se acumula hasta la prueba completa. El valor máximo es el valor justo antes de la prueba completa.","learnTryTitle":"Ejercicio","learnTry":"Abra el ejemplo «intervalo duplicado, prueba periódica parcial» y calcule. Antes de seguir leyendo: ¿basta con que el promedio esté por debajo del objetivo?","learnExplainTitle":"Explicación","learnExplain":"El promedio oculta el 40 % no cubierto: se acumula hasta la prueba completa a los 10 años, y en los años previos a esa prueba la PFD permanece por encima del objetivo.","learnFixTitle":"Corrección","learnFix":"Acorte el intervalo de la prueba completa a 4 años: PFDavg 4,89 × 10⁻³ y el valor máximo 9,76 × 10⁻³ quedan ambos por debajo del objetivo.","learnBoundaryTitle":"Dónde termina el número","learnBoundary":"No se deduce ningún SIL a partir de PFDavg; también cuentan las restricciones de arquitectura, la capacidad sistemática y el modo de demanda. La herramienta no fija ningún objetivo ni límite propio, y la aprobación sigue siendo una decisión aparte.","reportTitle":"Cambio de intervalos de mantenimiento y prueba","modelVersion":"Versión del modelo","eqNote_proof":"Símbolos: λ — λDU; a — edad de las partes no cubierta y cubierta; C — cobertura; T — intervalo de prueba periódica; T_f — intervalo de la prueba completa; k — índice de la prueba periódica dentro de T_f; u — tiempo desde la última prueba periódica; β — factor de causa común; MRT — tiempo medio de reparación.","eqNote_age":"Símbolos: S — supervivencia; F = 1 − S; h — tasa de riesgo; k, η — forma y escala de Weibull; γ — función gamma incompleta inferior; C_p, C_f — costes del reemplazo planificado y del reemplazo tras fallo; c — coste por unidad de tiempo; T* — edad económica de reemplazo.","eqNote_rbi":"Símbolos: th — espesor; x — tiempo; a, b — ordenada en el origen y pendiente de la recta de mínimos cuadrados; s_b — error típico de b; t₀.₉₅,ₙ₋₂ — cuantil unilateral del 95 % de la t de Student; r₉₅ — velocidad de adelgazamiento envolvente; RL — vida remanente; f — fracción; I_max — máximo reglamentario. r_LT, r_ST — velocidades a largo y corto plazo entre lecturas (API 510 / API 570); r — velocidad usada, la mayor de las tres.","modelText_proof":"Fallos exponenciales con λDU constante, reparación perfecta, pruebas periódicas a intervalos fijos; la parte no cubierta solo se restablece con la prueba completa; 1oo2 usa el modelo del factor beta.","modelText_age":"Renovación en el reemplazo o el fallo, vidas de Weibull; el ajuste es la estimación de máxima verosimilitud con censura.","modelText_rbi":"Adelgazamiento lineal; el intervalo es una fracción de la vida remanente a la velocidad envolvente, limitado por el máximo reglamentario.","boundaryText":"La herramienta no fija ningún objetivo
