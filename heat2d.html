    "help.title": "Cómo se usa",
    "help.intro": "La herramienta resuelve la <b>ecuación bidimensional de la conducción de calor en régimen transitorio</b> en la sección transversal de un prisma infinitamente largo: todo es uniforme a lo largo del tercer eje y por él no circula calor.",
    "help.step": "Paso",
    "help.what": "Qué hacer",
    "help.s1": "1. Dominio",
    "help.s1t": "Defina el tamaño de la sección transversal (pestaña «Dominio»). El fondo es vacío (ambiente) o un material sólido.",
    "help.s2": "2. Geometría",
    "help.s2t": "Dibuje rectángulos, elipses, polígonos y líneas; afine las dimensiones numéricamente en el panel de la derecha. El orden de la lista es el orden de superposición: las figuras posteriores tapan a las anteriores. «Restar» recorta un vacío (un agujero).",
    "help.s3": "3. Materiales",
    "help.s3t": "Cada figura recibe su propio material. En los alimentos y la parafina se tiene en cuenta el calor latente del cambio de fase.",
    "help.s4": "4. Condiciones de contorno",
    "help.s4t": "Los cuatro lados del dominio: adiabático (= simetría), T fija, convección con radiación o flujo impuesto. Dentro del dominio, cualquier figura puede mantenerse a temperatura fija, incluso en el modo «solo contorno», que la convierte en una línea a lo largo del perímetro.",
    "help.s5": "5. Ambiente",
    "help.s5t": "Los límites entre las figuras y el vacío ceden calor por enfriamiento de Newton (h) y por radiación (ε) cuando la radiación está activada.",
    "help.s6": "6. Tiempo",
    "help.s6t": "Fije la duración y el número de fotogramas y pulse «Calcular». El deslizador inferior recorre el tiempo; «Estacionario» resuelve directamente el estado establecido.",
    "help.under": "Detalles internos",
    "help.underT": "Volúmenes finitos sobre una malla uniforme, integración temporal totalmente implícita (estable con cualquier paso) y sistema lineal resuelto por gradientes conjugados precondicionados con una factorización de Cholesky incompleta IC(0). La conductividad en las interfaces entre materiales se promedia armónicamente, lo que da el flujo exacto a través de la unión. El cambio de fase emplea el método entálpico y conserva la energía de forma exacta; la no linealidad se trata con iteraciones de Newton con búsqueda lineal sobre la norma del residuo (sin ella las iteraciones ciclan en un rango de fusión estrecho). La radiación se linealiza como h_rad = εσ(T²+T∞²)(T+T∞), evaluada a la temperatura de la <i>superficie</i> y no en el centro de la celda de contorno. El área de las superficies inclinadas y curvas se corrige a partir de la longitud del escalonado: sin esta corrección, la escalera de celdas sobreestimaría el área de un círculo exactamente en 4/π = 1,27, un error que no disminuye al refinar la malla. Los rectángulos y las facetas a 45° resultan exactos. El paso de tiempo se elige automáticamente a partir de una estimación del error local y se reduce cuando las iteraciones no convergen.",
    "help.tests": "El botón «Autotest» contrasta el solucionador con catorce problemas de solución exacta: el perfil erf, una pared multicapa, el salto en una resistencia de contacto, una serie de Fourier, una fuente volumétrica, el problema de Stefan, la conservación de la energía, la temperatura de equilibrio, la radiación (incluida la de baja conductividad), una serie 2D, el área de superficies curvas, el cierre del balance térmico y el principio del máximo en un rango de fusión estrecho.",
    "help.limits": "Limitaciones",
    "help.l1": "<b>Solo conducción.</b> No se modela la convección dentro de líquidos ni de cavidades. El aire dibujado como material se trata como aire en reposo, lo que subestima la transferencia de calor a través de huecos de más de unos 10 mm.",
    "help.l2": "<b>Los vacíos como huecos.</b> Si queda un vacío entre dos cuerpos, cada superficie intercambia calor con la T∞ del ambiente y no con el cuerpo vecino: una ranura estrecha se comporta como un canal ventilado y no como una resistencia térmica. Para las intercapas delgadas dibuje un material (aire, pasta) en lugar de un vacío.",
    "help.l3": "<b>Las propiedades son constantes</b> (salvo el cambio de fase): no se incluyen las dependencias k(T) ni c(T).",
    "help.l4": "<b>La radiación</b> se produce solo de una superficie al ambiente: no hay intercambio entre superficies ni factores de forma.",
    "help.l5": "<b>La transferencia de masa</b> (secado, migración de humedad, calor arrastrado por el vapor) no se modela, y por eso aquí el horneado y el secado se calientan más despacio que en la realidad.",
    "help.l6": "<b>Precisión geométrica.</b> Los cuerpos se representan mediante celdas de la malla. Los polígonos con facetas alineadas con los ejes y a 45° son exactos tras la corrección de área; en un círculo el error residual en la transferencia de calor es de en torno al 1,5 %. La altura del dominio se redondea a un número entero de celdas.",

    "help.title": "Як користуватися",
    "help.intro": "Програма розв’язує <b>двовимірне рівняння нестаціонарної теплопровідності</b> у поперечному перерізі нескінченно довгої призми: усе однорідне вздовж третьої осі й тепло вздовж неї не перетікає.",
    "help.step": "Крок",
    "help.what": "Що робити",
    "help.s1": "1. Область",
    "help.s1t": "Задайте розмір поперечного перерізу (вкладка «Область»). Тло — або порожнина (середовище), або суцільний матеріал.",
    "help.s2": "2. Геометрія",
    "help.s2t": "Малюйте прямокутники, еліпси, полігони та лінії; уточнюйте розміри числами на правій панелі. Порядок у списку — це порядок накладання: пізніші фігури перекривають попередні. «Віднімання» вирізає порожнину (отвір).",
    "help.s3": "3. Матеріали",
    "help.s3t": "Кожна фігура має власний матеріал. Для харчових продуктів і парафіну враховується прихована теплота фазового переходу.",
    "help.s4": "4. Граничні умови",
    "help.s4t": "Чотири сторони області: адіабата (= симетрія), фіксована T, конвекція з випромінюванням або задана густина теплового потоку. Усередині області будь-яку фігуру можна тримати за фіксованої температури — зокрема в режимі «лише контур», який перетворює її на лінію вздовж контуру.",
    "help.s5": "5. Середовище",
    "help.s5t": "Межі фігур із порожниною віддають тепло за законом охолодження Ньютона (h) і випромінюванням (ε), якщо випромінювання увімкнено.",
    "help.s6": "6. Час",
    "help.s6t": "Задайте тривалість і кількість кадрів, потім натисніть «Розрахувати». Повзунок унизу прокручує час; «Стац. режим» одразу знаходить усталений стан.",
    "help.under": "Як це влаштовано",
    "help.underT": "Метод скінченних об’ємів на рівномірній сітці, повністю неявна схема за часом (стійка за будь-якого кроку), лінійна система розв’язується методом спряжених градієнтів із передобумовлюванням неповним розкладом Холецького IC(0). Теплопровідність на межах матеріалів усереднюється гармонічно, що дає точний потік крізь стик. Фазовий перехід описано ентальпійним методом, енергія зберігається точно; нелінійність обробляється ітераціями Ньютона з лінійним пошуком за нормою нев’язки (без нього ітерації зациклюються у вузькому діапазоні плавлення). Випромінювання лінеаризується як h_rad = εσ(T²+T∞²)(T+T∞) й обчислюється за температурою <i>поверхні</i>, а не центра приграничної комірки. Площа похилих і криволінійних поверхонь коригується за довжиною сходинкової лінії: без цієї поправки сходинки з комірок завищували б площу кола рівно в 4/π = 1,27 раза — похибка, яка не зменшується зі згущенням сітки. Прямокутники та грані під 45° виходять точними. Крок за часом добирається автоматично за оцінкою локальної похибки й зменшується, коли ітерації не збігаються.",
    "help.tests": "Кнопка «Самоперевірка» проганяє розв’язувач на чотирнадцяти задачах із точними розв’язками: профіль erf, багатошарова стінка, стрибок на контактному опорі, ряд Фур’є, об’ємне джерело, задача Стефана, збереження енергії, рівноважна температура, випромінювання (зокрема за низької теплопровідності), двовимірний ряд, площа криволінійної поверхні, замикання теплового балансу та принцип максимуму у вузькому діапазоні плавлення.",
    "help.limits": "Обмеження",
    "help.l1": "<b>Лише теплопровідність.</b> Конвекція всередині рідин і порожнин не моделюється. Повітря, намальоване як матеріал, вважається нерухомим, що занижує теплообмін крізь прошарки, товщі приблизно за 10 мм.",
    "help.l2": "<b>Порожнини як зазори.</b> Якщо між двома тілами залишено порожнину, кожна поверхня обмінюється теплом із середовищем T∞, а не із сусіднім тілом: тонка щілина поводиться як провітрюваний канал, а не як термічний опір. Для тонких прошарків малюйте матеріал (повітря, пасту) замість порожнини.",
    "help.l3": "<b>Властивості сталі</b> (крім фазового переходу): залежності k(T) і c(T) не враховуються.",
    "help.l4": "<b>Випромінювання</b> — лише з поверхні в середовище: обміну між поверхнями та кутових коефіцієнтів немає.",
    "help.l5": "<b>Масоперенесення</b> (сушіння, міграція вологи, тепло, перенесене парою) не моделюється, тому випікання та сушіння тут прогріваються повільніше, ніж насправді.",
    "help.l6": "<b>Геометрична точність.</b> Тіла подаються комірками сітки. Полігони з гранями вздовж осей і під 45° відтворюються точно після поправки площі; для кола залишкова похибка теплообміну — близько 1,5 %. Висота області округлюється до цілої кількості комірок.",

  "help.title": "Jak używać",
  "help.intro": "Narzędzie rozwiązuje <b>dwuwymiarowe równanie nieustalonego przewodzenia ciepła</b> w przekroju poprzecznym nieskończenie długiego pryzmatu: wzdłuż trzeciej osi wszystkie wielkości są stałe i nie występuje przepływ ciepła.",
  "help.step": "Krok",
  "help.what": "Co robić",
  "help.s1": "1. Domena",
  "help.s1t": "Ustaw wymiary przekroju (zakładka „Domena”). Tłem może być pustka (otoczenie) albo materiał stały.",
  "help.s2": "2. Geometria",
  "help.s2t": "Narysuj prostokąty, elipsy, wielokąty i linie; doprecyzuj wymiary numerycznie w prawym panelu. Kolejność na liście odpowiada kolejności ułożenia – późniejsze kształty zakrywają wcześniejsze. „Odejmij” wycina pustkę (dziurę).",
  "help.s3": "3. Materiały",
  "help.s3t": "Każdy kształt ma swój własny materiał. W przypadku żywności i parafiny uwzględniane jest ciepło przemiany fazowej.",
  "help.s4": "4. Warunki brzegowe",
  "help.s4t": "Cztery boki domeny: adiabatyczna (= symetria), stała temperatura T, konwekcja z promieniowaniem lub strumień zadany. Wewnątrz domeny dowolny kształt może być utrzymywany w stałej temperaturze — również w trybie „tylko kontur”, który przekształca go w linię wzdłuż konturu.",
  "help.s5": "5. Otoczenie",
  "help.s5t": "Granice między kształtami a pustką oddają ciepło przez konwekcję Newtona (h) oraz promieniowanie (ε), jeśli promieniowanie jest włączone.",
  "help.s6": "6. Czas",
  "help.s6t": "Ustaw czas trwania i liczbę klatek, a następnie naciśnij „Oblicz”. Suwak na dole pozwala przechodzić po czasie; „Stan ustalony” oblicza bezpośrednio rozwiązanie ustalone.",
  "help.under": "Metoda obliczeniowa",
  "help.underT": "Metoda objętości skończonych na jednorodnej siatce; całkowicie niejawne całkowanie w czasie (stabilne dla dowolnego kroku). Układ liniowy jest rozwiązywany metodą gradientów sprzężonych z preconditionerem w postaci niepełnej faktoryzacji Choleskiego IC(0). Przewodność cieplna na granicach materiałów jest uśredniana harmonicznie, co daje dokładny strumień przez styk. Przemiana fazowa jest modelowana metodą entalpii z dokładnym bilansem energii; nieliniowość rozwiązuje metoda Newtona z przeszukiwaniem liniowym względem normy residuum (bez niego iteracje mogą cyklicznie oscylować przy wąskim zakresie topnienia). Promieniowanie jest linearyzowane jako h_rad = εσ(T²+T∞²)(T+T∞) i obliczane dla temperatury <i>powierzchni</i>, a nie środka komórki brzegowej. Pole powierzchni skośnych i zakrzywionych jest korygowane na podstawie długości schodkowej granicy; bez korekty siatka zawyżałaby obwód koła dokładnie w stosunku 4/π = 1,27, a błąd nie zanikałby przy zagęszczaniu siatki. Prostokąty i odcinki pod kątem 45° są odwzorowane dokładnie. Krok czasowy jest dobierany automatycznie z lokalnego oszacowania błędu i zmniejszany przy braku zbieżności iteracji.",
  "help.tests": "Przycisk „Autotest” porównuje solver z czternastoma problemami o znanych rozwiązaniach analitycznych: profilem erf, ścianą wielowarstwową, skokiem temperatury na oporze styku, szeregiem Fouriera, źródłem objętościowym, problemem Stefana, bilansem energii, temperaturą równowagową, promieniowaniem (także przy małej przewodności cieplnej), szeregiem 2D, polem zakrzywionej powierzchni, domknięciem bilansu cieplnego i zasadą maksimum dla wąskiego zakresu topnienia.",
  "help.limits": "Ograniczenia",
  "help.l1": "<b>Tylko przewodzenie.</b> Konwekcja wewnątrz cieczy i pustek nie jest modelowana. Powietrze narysowane jako materiał jest traktowane jako nieruchome, co zaniża wymianę ciepła przez szczeliny grubsze niż około 10 mm.",
  "help.l2": "<b>Pustki jako szczeliny.</b> Jeśli między dwoma ciałami pozostawiono pustkę, każda powierzchnia wymienia ciepło z otoczeniem o temperaturze T∞, a nie z sąsiednim ciałem: cienka szczelina zachowuje się jak kanał wentylowany, a nie jak opór cieplny. Cienkie warstwy pośrednie należy rysować jako materiał (powietrze, pasta), nie pustkę.",
  "help.l3": "<b>Właściwości są stałe</b> (poza zmianą fazy): zależności k(T) i c(T) nie są uwzględniane.",
  "help.l4": "<b>Promieniowanie</b> zachodzi wyłącznie między powierzchnią a otoczeniem — nie jest modelowana wymiana między powierzchniami ani współczynniki konfiguracji.",
  "help.l5": "<b>Przenoszenie masy</b> (suszenie, migracja wilgoci, przenoszenie ciepła przez parę) nie jest modelowane, dlatego pieczenie i suszenie nagrzewają się tutaj wolniej niż w rzeczywistości.",
  "help.l6": "<b>Dokładność geometryczna.</b> Ciała są reprezentowane przez komórki siatki. Wielokąty z krawędziami równoległymi do osi i pod kątem 45° są dokładne po korekcie pola; dla koła resztkowy błąd wymiany ciepła wynosi około 1,5%. Wysokość domeny jest zaokrąglana do całkowitej liczby komórek.",

    "help.title": "Как пользоваться",
    "help.intro": "Инструмент считает <b>двумерное нестационарное уравнение теплопроводности</b> в поперечном сечении бесконечно длинной призмы: вдоль третьей оси всё однородно, тепло по ней не течёт.",
    "help.step": "Шаг",
    "help.what": "Что делать",
    "help.s1": "1. Область",
    "help.s1t": "Задайте размеры сечения (вкладка «Область»). Фон — пустота (среда) или сплошной материал.",
    "help.s2": "2. Геометрия",
    "help.s2t": "Рисуйте прямоугольники, эллипсы, полигоны и линии; размеры уточняйте числами в панели справа. Порядок в списке = порядок наложения, верхние перекрывают нижние. «Вычитание» делает пустоту (отверстие).",
    "help.s3": "3. Материалы",
    "help.s3t": "Каждой фигуре — свой материал. Для пищевых продуктов и парафина учитывается скрытая теплота фазового перехода.",
    "help.s4": "4. Граничные условия",
    "help.s4t": "Четыре стороны области: адиабата (= симметрия), постоянная T, конвекция с излучением, заданный поток. Внутри области любая фигура может быть «постоянной температуры» — в том числе в режиме «только контур», то есть линия по контуру.",
    "help.s5": "5. Среда",
    "help.s5t": "Границы фигур с пустотой отдают тепло по закону Ньютона (h) и излучением (ε), если излучение включено.",
    "help.s6": "6. Время",
    "help.s6t": "Задайте длительность и число кадров, нажмите «Рассчитать». Ползунок внизу прокручивает время; «Стационар» считает установившееся состояние сразу.",
    "help.under": "Что под капотом",
    "help.underT": "Метод конечных объёмов на равномерной сетке, полностью неявная схема по времени (устойчива при любом шаге), СЛАУ решается методом сопряжённых градиентов с предобуславливателем — неполным разложением Холецкого IC(0). Теплопроводность на границе материалов усредняется гармонически, что даёт точный поток через стык. Фазовый переход — энтальпийный метод, строго сохраняющий энергию; нелинейность снимается методом Ньютона с линейным поиском по норме невязки (без него итерации зацикливаются на узкой зоне плавления). Излучение линеаризуется через h<sub>изл</sub> = εσ(T²+T∞²)(T+T∞), причём по температуре <i>поверхности</i>, а не центра приграничной ячейки. Площадь косых и криволинейных поверхностей корректируется по длине «прогона» ступеньки: без поправки лестница из ячеек завышала бы площадь круга ровно в 4/π = 1,27 раза, причём эта ошибка не убывает при измельчении сетки. Прямоугольники и грани под 45° после поправки считаются точно. Шаг по времени подбирается автоматически по оценке локальной ошибки и уменьшается, если итерации не сошлись.",
    "help.tests": "Кнопка «Самопроверка» прогоняет решатель по четырнадцати задачам с точным решением: профиль erf, многослойная стенка, скачок на контактном сопротивлении, ряд Фурье, объёмный источник, задача Стефана, сохранение энергии, равновесная температура, излучение (в том числе при низкой теплопроводности), двумерный ряд, площадь криволинейной поверхности, замыкание теплового баланса и соблюдение принципа максимума на узкой зоне плавления.",
    "help.limits": "Ограничения",
    "help.l1": "<b>Только теплопроводность.</b> Конвекция внутри жидкостей и полостей не моделируется. Воздух, нарисованный материалом, считается неподвижным — это занижает теплопередачу в зазорах толще ~10 мм.",
    "help.l2": "<b>Зазоры из пустоты.</b> Если между двумя телами оставлена пустота, каждая поверхность обменивается теплом со средой T∞, а не с соседним телом: тонкая щель ведёт себя как канал с прокачкой воздуха, а не как термическое сопротивление. Для тонких прослоек рисуйте материал (воздух, паста), а не пустоту.",
    "help.l3": "<b>Свойства постоянны</b> (кроме фазового перехода): зависимость k(T), c(T) не учитывается.",
    "help.l4": "<b>Излучение</b> — только с поверхности в среду, без взаимного обмена между поверхностями и без учёта видимости.",
    "help.l5": "<b>Массоперенос</b> (сушка, миграция влаги, перенос тепла паром) не моделируется — поэтому выпечка и сушка прогреваются в расчёте медленнее, чем в жизни.",
    "help.l6": "<b>Точность геометрии.</b> Тела представлены ячейками сетки. Многоугольники с гранями по осям и под 45° после поправки площади считаются точно; для круга остаточная погрешность теплоотдачи около 1,5 %. Высота области округляется до целого числа ячеек.",

  /* Пробел проигрывает и останавливает анимацию. Роутер горячих клавиш
     фреймворка сравнивает event.key после trim(), поэтому пробел через него не
     выражается — это единственная клавиша, оставшаяся на своём слушателе. */
  window.addEventListener('keydown', function (e) {
    if (/input|select|textarea/i.test(e.target.tagName) || e.target.isContentEditable) return;
    /* Esc отменяет недорисованный контур — и только его: гасить событие нельзя,
       иначе диалог фреймворка перестанет закрываться по Esc. */
    if (e.key === 'Escape') { if (tempPts) { tempPts = null; draw(); } return; }
    /* Пробел — проигрывание. Роутер горячих клавиш сравнивает event.key после
       trim(), поэтому пробел через него не выражается. */
    if (e.key !== ' ') return;
    e.preventDefault(); togglePlay();
  });

  function showTip(e, p) {
    var tip = ovTip;
    if (!tip) return;
    if (p[0] < 0 || p[1] < 0 || p[0] > M.W || p[1] > M.H) { tip.style.display = 'none'; return; }
    var d = gridDims(), cxi = Math.floor(p[0] / d.dx), cyi = Math.floor(p[1] / d.dx);
    if (cxi < 0 || cyi < 0 || cxi >= d.nx || cyi >= d.ny) { tip.style.display = 'none'; return; }
    var i = cyi * d.nx + cxi, m = spec ? spec.matId[i] : -1;
    var s = nf(p[0], 1) + ' × ' + nf(p[1], 1) + ' ' + T('u.mm');
    if (m >= 0) s += '\n' + matName(spec.materials[m]);
    if (results) {
      var rd = results.dims;
      var rx = Math.floor(p[0] / rd.dx), ry = Math.floor(p[1] / rd.dx);
      if (rx >= 0 && ry >= 0 && rx < rd.nx && ry < rd.ny) {
        var v = results.frames[curFrame][ry * rd.nx + rx];
        if (v === v) s += '\nT = ' + nf(v, 2) + ' ' + T('u.C');
      }
    }
    tip.textContent = s; tip.style.display = 'block';
    var r = cv.getBoundingClientRect();
    tip.style.left = (e.clientX - r.left + 14) + 'px'; tip.style.top = (e.clientY - r.top + 14) + 'px';
  }

  // ---------------- инструменты ----------------
  var TOOLS = [
    ['select', 'M4 3l14 7-6 2-2 6z'],
    ['rect', 'M3 5h16v12H3z'],
    ['ellipse', 'M11 6a8 5.5 0 1 0 .01 0'],
    ['poly', 'M4 8l7-5 8 6-3 9H6z'],
    ['line', 'M3 17L9 7l5 6 6-9'],
    ['probe', 'M11 3v11m-4 0a4 4 0 1 0 8 0']
  ];

  var toolBtns = [];
  function setTool(t) {
    tool = t; tempPts = null;

  /* ---------------- общая синхронизация и история ----------------
     app.sync() перечитывает все объявленные поля; свои нестандартные контролы
     (список фигур, выбор материала с группами) дописывают себя сами. */
  var app = null, customSyncs = [];
  function syncUI() { if (app) app.sync(); }
  /* Старые имена сохранены: их зовут загрузка проекта, приём handoff и
     обработчики холста, и переписывать их было бы диффом ради диффа. */
  function renderPanel() { syncUI(); }
  function renderList() { syncUI(); }

  function snapshot() {
    return { m: clone(M), probes: clone(probes), sel: sel, view: clone(V) };
  }
  /* История: фреймворк снимает состояние ПОСЛЕ правки, поэтому capture() отдаёт
     предыдущий снимок, а свежий запоминает. Отмена и повтор при этом получают
     текущее состояние, как и ожидает History. */
  /* История. capture() отдаёт текущее состояние — так его и ждут undo/redo.
     Осложнение одно: фреймворк снимает состояние ПОСЛЕ правки поля, и такой
     снимок в стопке бесполезен. Поэтому push переопределён: в стопку кладётся
     preSnap — состояние до текущей правки, — а сам preSnap обновляется в
     следующем такте, когда правка уже применена. Обработчики холста зовут
     pushHistory() до изменения, и обе схемы сходятся в одну. */
  var preSnap = null, snapTimer = null;
  function markSnapSoon() {
    clearTimeout(snapTimer);
    snapTimer = setTimeout(function () { preSnap = snapshot(); }, 0);
  }
  function historyCapture() { return snapshot(); }
  function historyRestore(sn) {
    if (!sn) return;
    M = clone(sn.m); probes = clone(sn.probes); M.probes = probes;
    sel = sn.sel; Object.keys(sn.view).forEach(function (k) { V[k] = sn.view[k]; });
    if (app) app.state = M;
    preSnap = snapshot();
    stale = true;
    rebuild(); syncUI(); updChart(); draw(); updWarn();
  }
  function installHistory(a) {
    var h = a.history;
    if (!h) return;
    h.push = function () {
      h.past.push(preSnap || snapshot());
      if (h.past.length > h.limit) h.past.shift();
      h.future.length = 0;
      a.syncHeader();
      markSnapSoon();
    };
  }
  function pushHistory() { if (app && app.history) app.history.push(); }
  function resetHistory() {
    preSnap = snapshot();
    if (app && app.history) app.history.clear();
    if (app) app.syncHeader();
  }

  // ---------------- список фигур ----------------

    var el = DiagramUI.el('div', { class: 'h2-list' });

      var frag = document.createDocumentFragment();
      M.shapes.forEach(function (s, i) {
        var row = DiagramUI.el('div', { class: 'h2-row', dataset: { sel: s.id === sel ? '1' : '0' } });
        row.appendChild(DiagramUI.el('span', { class: 'h2-sw',
          style: { background: s.subtract ? 'var(--muted)' : (MATS[s.mat] ? MATS[s.mat].col : 'var(--muted)') } }));
        var nmText = shapeLabel(s) + (s.fixed ? ' 🌡' : '') + (s.outline ? ' ▢' : '');
        var nm = DiagramUI.el('button', { class: 'h2-nm', type: 'button', text: nmText, title: nmText });
        nm.addEventListener('click', function () { sel = s.id; invalidate(true); draw(); });
        row.appendChild(nm);
        row.appendChild(iconButton('↑', T('ui.moveUp'), function () {
          if (i >= M.shapes.length - 1) return;

          invalidate(true); draw();
        }));
        row.appendChild(iconButton('↓', T('ui.moveDown'), function () {
          if (i <= 0) return;
          pushHistory();
          var t = M.shapes[i]; M.shapes[i] = M.shapes[i - 1]; M.shapes[i - 1] = t;
          invalidate(true); draw();
        }));
        row.appendChild(iconButton(s.visible === false ? '◌' : '●', T('ui.toggleVis'), function () {
          pushHistory();

          invalidate(true); draw();
        }));
        row.appendChild(iconButton('✕', T('ui.delShape'), function () {
          pushHistory();
          M.shapes.splice(i, 1); sel = null; invalidate(true); draw();
        }));
        frag.insertBefore(row, frag.firstChild);   // порядок списка — обратный порядку наложения
      });
      el.textContent = '';
      el.appendChild(frag);
      if (!M.shapes.length) el.appendChild(DiagramUI.el('div', { class: 'dgu-hint', text: T('s.noneHint') }));
    });
  }

  // ---------------- панели свойств ----------------
  /* Поля объявляются данными и собираются заново при каждой сборке приложения,
     то есть при каждой смене языка: подписи, единицы и подсказки берутся из
     того же словаря, что и раньше, и живут ровно в одном месте. */
  var detailTab = 'shape';
  var TABKEY = { shape: 'tab.shape', dom: 'tab.domain', sim: 'tab.calc' };
  function selectTab(id) {
    detailTab = id;
    syncUI();
  }
  /* Вкладка — это не «другая панель», а условие видимости полей: панель, у
     которой не осталось видимых полей, фреймворк не рисует сам. */
  function tabScope(list, id) {
    return list.map(function (f) {
      var v = f.visible;
      f.visible = function (ctx) { return detailTab === id && (v ? v(ctx) : true); };
      return f;
    });
  }

  function esc(t) {
    return String(t).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  /* Часть строк словаря размечена простым HTML (<b>, <br>): в подсказках и
     темах пояснений фреймворк ставит текст, а не разметку, поэтому разметку
     снимаем, а <br> превращаем в перевод строки. Текст остаётся тем же. */
  function plain(t) {
    return String(t).replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
  }

  /* Единственное поле, для которого нет готового типа: список материалов с
     группами. Поле фреймворка групп (optgroup) не знает, а плоский список из
     шестидесяти позиций — потеря. Поэтому custom. */
  function materialField(id, label, getV, setV, visible, allowVoid) {
    return {
      id: id, key: '__' + id, type: 'custom', label: label, visible: visible,
      render: function (box) {
        var selEl = DiagramUI.el('select', { class: 'dgu-fctl', 'aria-label': label });
        var groups = {}, order = [];
        MATS.forEach(function (m, i) { if (!groups[m.g]) { groups[m.g] = []; order.push(m.g); } groups[m.g].push(i); });
        if (allowVoid) selEl.appendChild(DiagramUI.el('option', { value: '', text: T('d.void') }));
        order.forEach(function (g) {
          var og = DiagramUI.el('optgroup', { label: T('g.' + g) });
          groups[g].forEach(function (i) { og.appendChild(DiagramUI.el('option', { value: String(i), text: matName(MATS[i]) })); });
          selEl.appendChild(og);
        });
        selEl.addEventListener('change', function () {
          pushHistory();
          setV(selEl.value === '' ? null : parseFloat(selEl.value));
          invalidate(true); draw();
        });
        box.appendChild(selEl);
        customSyncs.push(function () {
          var v = getV();
          if (document.activeElement !== selEl) selEl.value = (v == null) ? '' : String(v);
        });
      }
    };
  }
  function hintField(id, text) { return { id: id, type: 'note', label: text }; }
  function readoutField(id, label, learn, fn) {
    return { id: id, key: '__' + id, type: 'custom', label: label, learn: learn,
      render: function (box) {
        var d = DiagramUI.el('div', { class: 'dgu-hint' });
        box.appendChild(d);
        customSyncs.push(function () { d.textContent = fn(); });
      } };
  }
  /* Числовое поле. Единица — подпись, а не пересчёт: состояние тула, его запись
     и постоянная ссылка хранят миллиметры и градусы Цельсия, как и объявлено в
     record.units, поэтому display всегда равен unit. */
  function num(id, key, label, unit, extra) {
    var f = { id: id, key: key, type: 'number', label: label };
    if (unit) { f.unit = unit; f.display = unit; }
    if (extra) Object.keys(extra).forEach(function (k) { f[k] = extra[k]; });
    return f;
  }

  function shapeGet(k, dflt) {
    return function () { var s = curShape(); return s ? (s[k] == null ? (dflt === undefined ? null : dflt) : s[k]) : null; };
  }
  function shapeSet(k) {
    return function (v) { var s = curShape(); if (!s) return; if (typeof v === 'number' && !isFinite(v)) return; s[k] = v; };
  }
  function isRectish() { var s = curShape(); return !!s && (s.type === 'rect' || s.type === 'ellipse'); }
  function isPoly() { var s = curShape(); return !!s && (s.type === 'poly' || s.type === 'line'); }
  function hasShape() { return !!curShape(); }

  function shapeFields() {

      num('f-sh-w', '__w', T('s.w'), mm, { visible: isRectish, get: shapeGet('w'), set: shapeSet('w') }),
      num('f-sh-h', '__h', T('s.h'), mm, { visible: isRectish, get: shapeGet('h'), set: shapeSet('h') }),

        get: shapeGet('outline', false), set: shapeSet('outline') },

        get: shapeGet('subtract', false), set: shapeSet('subtract') },

      num('f-sh-T0', '__shT0', T('s.T0'), C,
        { visible: function () { var s = curShape(); return !!s && !s.fixed; },

      num('f-sh-epsOv', '__epsOv', T('s.epsOv'), null,

      { id: 'f-sh-surfHint', type: 'note', label: plain(T('s.surfHint')), visible: hasShape }
    ];
  }

  function simFields() {

      num('f-tol', 'sim.tol', T('c.tol'), T('u.K'),

  function drawChart(g, w, h, k, th) {

    if (th.bg) { g.fillStyle = th.bg; g.fillRect(0, 0, w, h); }
    if (!results || !probes.length || !isFinite(results.times[results.times.length - 1])) {
      g.fillStyle = th.ink; g.font = (12 * k) + 'px sans-serif';

    var pad = { l: 46 * k, r: 12 * k, t: 10 * k, b: 22 * k }, W = w - pad.l - pad.r, H = h - pad.t - pad.b;
    var tmax = results.times[results.times.length - 1];
    var mn = 1e30, mx = -1e30, series = probes.map(function (p, i) {
      var a = [];
      for (var f = 0; f < results.frames.length; f++) { var v = probeVal(i, f); a.push(v); if (v != null) { mn = Math.min(mn, v); mx = Math.max(mx, v); } }
      return a;

    }
    for (i = 0; i <= 4; i++) {
      var xx = pad.l + W * i / 4, lb = fmtTime(tmax * i / 4);
      g.fillText(lb, Math.min(xx - 14 * k, w - g.measureText(lb).width - 4 * k), h - 7 * k);
    }
    series.forEach(function (a, si) {
      g.strokeStyle = PCOL[si % PCOL.length]; g.lineWidth = 1.6 * k; g.beginPath();
      a.forEach(function (v, f) {
        if (v == null) return;
        var xx = pad.l + W * results.times[f] / tmax, yy = pad.t + H * (mx - v) / (mx - mn);
        f ? g.lineTo(xx, yy) : g.moveTo(xx, yy);

    });

  }

           задача, поданная последней, удлинила бы makespan на своё время. */

        var cases = groups.map(function (g) { return { cmd: 'selftest1', indices: g }; });

  // ---------------- v2: свип сходимости по сетке и шагу времени ----------------
  /* Ограничения этого тула прямо требуют от пользователя показать сходимость по сетке и по шагу
     времени, но до появления пула такой свип стоил бы шести замороженных расчётов подряд. Здесь
     это шесть независимых расчётов, разложенных по воркерам.
     Что именно считается:
      · три уровня сетки с точным отношением 2 по размеру ячейки — nx и ny удваиваются вместе,
        поэтому эффективная высота ny·dx на всех уровнях одна и та же и в ряд не подмешивается
        округление высоты области;
      · три уровня допуска шага с шагом 4 — оценка ошибки в маршевом цикле имеет вид e ~ dt²,
        так что деление допуска на 4 примерно вдвое уменьшает шаг; наблюдаемый порядок считается
        по фактически достигнутому среднему шагу, а не по допуску;
      · все случаи свипа интегрируются с одной фиксированной раскадровкой SWEEP_FRAMES: кадры
        обрезают шаги на своих границах и потому сами влияют на их последовательность. Свип
        сопоставим сам с собой, а не с расчётом на экране, и в модалке это сказано прямо.
     Функционалы — средняя температура по расчётным ячейкам последнего кадра и суммарный вход
     тепла (сумма положительных статей баланса): оба гладкие и определены в обоих режимах.

  var SWEEP_FRAMES = 8, sweepResult = null;
  function sweepLadder() {
    var d = gridDims(), nxC = Math.floor(d.nx / 2), nyC = Math.floor(d.ny / 2);
    while (nxC >= 8 && nyC >= 2 && 16 * nxC * nyC > MAXCELLS) { nxC = Math.floor(nxC / 2); nyC = Math.floor(nyC / 2); }
    if (nxC < 8 || nyC < 2) return null;
    return [0, 1, 2].map(function (l) { return { nx: nxC << l, ny: nyC << l, dx: M.W / (nxC << l) }; });
  }
  function sweepSpec(lvl) {

      var k = lvl.nx + 'x' + lvl.ny + '/' + (steady ? 'steady' : tl);
      if (seen[k] !== undefined) return seen[k];
      seen[k] = list.length;
      list.push({ lvl: lvl, tol: tl, steady: steady });
      return list.length - 1;
    };
    lad.forEach(function (lvl) { meshIdx.push(push(lvl, tol, st)); });

  }
  function sweepStat(d, c, tEnd) {

    var f = d.flux || {}, qin = 0;
    ['left', 'right', 'bottom', 'top', 'surface', 'source', 'fixedIn'].forEach(function (k) { if (f[k] > 0) qin += f[k]; });
    return { Tmean: n ? s / n : NaN, Qin: qin, steps: d.steps || 0,
      dtMean: c.steady ? null : (d.steps ? tEnd / d.steps : NaN),

  function sweepOrder(f1, f2, f3, r) {
    var d1 = f1 - f2, d2 = f2 - f3;

    /* Разности обязаны убывать. Растущая разность значит, что уровни ещё не в асимптотике; порядок

    var p = Math.log(Math.abs(d1 / d2)) / Math.log(r);

      '<td class="mono">' + (c.steady ? T('u.none') : nf(s.dtMean, 3)) + '</td>' +
      '<td class="mono">' + (c.steady ? T('u.none') : s.steps) + '</td>' +
      '<td class="mono">' + nf(s.Tmean, 4) + '</td>' +

  function sweepTable(title, idx, plan, stats, ratio) {

      T('sw.dt') + '</th><th>' + T('sw.steps') + '</th><th>' + T('sw.Tmean') + '</th><th>' + T('sw.Qin') + '</th></tr>';

    var ok = idx.every(function (i) { return !!stats[i]; });
    var lines = '';

  function runSweep() {

    if (!solid) { notify(T('msg.nothing'), 'warn'); return; }
    var plan = sweepPlan();
    if (!plan) { notify(T('sw.noRefine', [MAXCELLS]), 'warn'); return; }
    showProg(true, T('ui.sweepRun'), 0);
    setBusy(true);
    var ctrl = newRun(), t0 = performance.now();
    var payloads = plan.list.map(function (c) {
      return { cmd: c.steady ? 'steady' : 'run', spec: sweepSpec(c.lvl),
        tEnd: plan.tEnd, nFrames: SWEEP_FRAMES, tolErr: c.tol };
    });
    runEnsemble(payloads, { signal: ctrl ? ctrl.signal : null, onProgress: function (p) { showProg(true, null, p); } })
      .then(function (out) {
        endRun(ctrl);
        var stats = out.map(function (e, i) {
          if (!e.ok) { plan.list[i].error = e.error; return null; }
          return sweepStat(e.value, plan.list[i], plan.tEnd);
        });
        var wall = performance.now() - t0;
        var dts = plan.timeIdx.map(function (i) { return stats[i] ? stats[i].dtMean : NaN; });
        var rTime = Math.sqrt(dts[0] / dts[2]);
        sweepResult = { plan: plan, stats: stats, wall: wall, rTime: rTime, backend: cmpBackend, frames: SWEEP_FRAMES };
        modal('<p class="small">' + esc(T('sw.intro', [SWEEP_FRAMES])) + '</p>' +
          '<p class="small">' + esc(T('sw.mode', [plan.steady ? T('sw.modeSteady') : T('sw.modeTrans', [fmtTime(plan.tEnd)])])) + '</p>' +
          sweepTable(T('sw.mesh'), plan.meshIdx, plan, stats, 2) +
          sweepTable(T('sw.time'), plan.timeIdx, plan, stats, rTime) +
          '<p class="small" style="margin-top:12px">' + esc(T('sw.hint')) + '</p>' +
          '<p class="small">' + esc(T('sw.wall', [plan.list.length, locNum((wall / 1000).toFixed(2)), backendLabel()])) + '</p>', T('sw.title'));

  }
  /* Свип в расчётной записи — теми же выходами, что и всё остальное, а не вторым каналом

    var ord = function (idx, q, r) {
      var a = st[idx[0]], b = st[idx[1]], c = st[idx[2]];
      if (!a || !b || !c) return null;
      var o = sweepOrder(a[q], b[q], c[q], r);
      return o ? { order: o.p, ratio: o.r, richardson: o.rich } : null;
    };
    var block = function (idx, r) {
      return {
        cells: pick(idx, function (s, c) { return c.lvl.nx * c.lvl.ny; }),
        dx_mm: pick(idx, function (s, c) { return c.lvl.dx; }),
        tolerance_K: pick(idx, function (s, c) { return c.steady ? null : c.tol; }),
        dt_mean_s: pick(idx, function (s) { return s.dtMean; }),
        steps: pick(idx, function (s) { return s.steps; }),
        T_mean_C: pick(idx, function (s) { return s.Tmean; }),
        Q_in_W_per_m: pick(idx, function (s) { return s.Qin; }),
        T_mean: ord(idx, 'Tmean', r), Q_in: ord(idx, 'Qin', r)
      };

  // ---------------- отчёт PDF ----------------
  var DPI = 200, MM = DPI / 25.4;            // A4 210×297 мм при 200 dpi
  var PW = Math.round(210 * MM), PH = Math.round(297 * MM);
  var COL = { bg: '#ffffff', ink: '#12161c', dim: '#5c6673', line: '#c9d1da', band: '#1b2129', acc: '#ff8a3d' };
  var FONT = '"Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif';

  function pdfCtx() {
    var c = document.createElement('canvas');
    c.width = PW; c.height = PH;
    var g = c.getContext('2d');
    g.fillStyle = COL.bg; g.fillRect(0, 0, PW, PH);
    g.textBaseline = 'alphabetic';
    return { c: c, g: g };
  }
  function txt(g, str, x, y, o) {
    o = o || {};
    g.save();
    g.fillStyle = o.color || COL.ink;
    g.font = (o.weight || 400) + ' ' + Math.round((o.size || 3.2) * MM) + 'px ' + FONT;
    g.textAlign = o.align || 'left';
    g.fillText(String(str), x, y);
    g.restore();
    return y;
  }
  function wrapText(g, str, x, y, w, o) {
    o = o || {};
    var size = o.size || 2.9, lh = (o.lh || size * 1.35) * MM;
    g.save();
    g.fillStyle = o.color || COL.dim;
    g.font = (o.weight || 400) + ' ' + Math.round(size * MM) + 'px ' + FONT;
    var words = String(str).split(' '), line = '', yy = y;
    for (var i = 0; i < words.length; i++) {
      var t = line ? line + ' ' + words[i] : words[i];
      if (g.measureText(t).width > w && line) { g.fillText(line, x, yy); yy += lh; line = words[i]; }
      else line = t;
    }
    if (line) { g.fillText(line, x, yy); yy += lh; }
    g.restore();
    return yy;
  }
  function rule(g, x, y, w) {
    g.save(); g.strokeStyle = COL.line; g.lineWidth = Math.max(1, 0.2 * MM);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + w, y); g.stroke(); g.restore();
  }
  function section(g, title, x, y, w) {
    txt(g, title.toUpperCase(), x, y, { size: 2.8, weight: 700, color: COL.acc });
    rule(g, x, y + 1.6 * MM, w);
    return y + 6 * MM;
  }
  // таблица: cols = [{w(мм), align}], rows = [[...]], head = [...]
  function table(g, x, y, cols, head, rows, o) {
    o = o || {};
    var rh = (o.rh || 5.2) * MM, cx, i, j;
    if (head) {
      cx = x;
      for (i = 0; i < cols.length; i++) {
        txt(g, head[i], cols[i].align === 'right' ? cx + cols[i].w * MM : cx, y,
          { size: 2.6, weight: 700, color: COL.dim, align: cols[i].align || 'left' });
        cx += cols[i].w * MM;
      }
      y += 1.8 * MM; rule(g, x, y, cols.reduce(function (a, c) { return a + c.w; }, 0) * MM); y += 3.6 * MM;
    }
    for (j = 0; j < rows.length; j++) {
      cx = x;
      for (i = 0; i < cols.length; i++) {
        var cell = rows[j][i];
        if (cell && cell.swatch) {
          g.save(); g.fillStyle = cell.swatch; g.strokeStyle = '#0003';
          g.fillRect(cx, y - 2.6 * MM, 3.2 * MM, 3.2 * MM); g.strokeRect(cx, y - 2.6 * MM, 3.2 * MM, 3.2 * MM); g.restore();
          txt(g, cell.text, cx + 4.4 * MM, y, { size: 2.8 });
        } else if (cell != null && cell !== '') {
          txt(g, cell, cols[i].align === 'right' ? cx + cols[i].w * MM : cx, y,
            { size: 2.8, weight: cols[i].bold ? 600 : 400, color: cols[i].dim ? COL.dim : COL.ink, align: cols[i].align || 'left' });
        }
        cx += cols[i].w * MM;
      }
      y += rh;
    }

  // рендер холста модели в картинку заданного размера (мм)
  function renderView(wmm, hmm, opts) {
    opts = opts || {};

    c.width = Math.round(wmm * MM); c.height = Math.round(hmm * MM);
    var oldCtx = ctx, oldView = { sc: view.sc, tx: view.tx, ty: view.ty };
    RT = { w: c.width, h: c.height }; ctx = c.getContext('2d');
    FORCE_GEOM = !!opts.geom; HIDE_PROBES = !!opts.geom;
    fit(); draw();
    ctx = oldCtx; RT = null; FORCE_GEOM = false; HIDE_PROBES = false;
    view.sc = oldView.sc; view.tx = oldView.tx; view.ty = oldView.ty;
    return c;
  }
  function colorbar(g, x, y, wmm, hmm, rng) {
    var L = lut(V.pal), w = wmm * MM, h = hmm * MM, i;
    var im = g.createImageData(1, Math.round(h));
    for (i = 0; i < im.height; i++) {
      var q = 255 - Math.round(i / (im.height - 1) * 255);
      im.data[i * 4] = L[q * 3]; im.data[i * 4 + 1] = L[q * 3 + 1]; im.data[i * 4 + 2] = L[q * 3 + 2]; im.data[i * 4 + 3] = 255;
    }
    var tmp = document.createElement('canvas'); tmp.width = 1; tmp.height = im.height;
    tmp.getContext('2d').putImageData(im, 0, 0);
    g.drawImage(tmp, x, y, w, h);
    g.save(); g.strokeStyle = COL.line; g.lineWidth = 1; g.strokeRect(x, y, w, h); g.restore();
    for (i = 0; i <= 4; i++) {
      var v = rng[1] - (rng[1] - rng[0]) * i / 4;
      txt(g, nf(v, 1), x + w + 1.6 * MM, y + h * i / 4 + 1 * MM, { size: 2.5, color: COL.dim });

  // рамка картинки: заполняем ширину, но не выше maxH; иначе сужаем и центрируем

  function attributionLine(page, total, lang) {

  function buildReport() {

    y += (im.h + 8) * MM;

    var used = {}, order = [];
    M.shapes.forEach(function (sh) { if (sh.visible !== false && !sh.subtract && !used[sh.mat]) { used[sh.mat] = 1; order.push(sh.mat); } });
    if (M.bgMat != null && !used[M.bgMat]) { used[M.bgMat] = 1; order.unshift(M.bgMat); }

    var rows = order.map(function (i) {

      vis.forEach(function (sh, i) {
        if (i >= maxRows) { more++; return; }
        var geo;
        if (sh.type === 'rect' || sh.type === 'ellipse') {
          var q = G.box(sh);
          geo = nf(q.x, 1) + ' × ' + nf(q.y, 1) + ' → ' + nf(q.w, 1) + ' × ' + nf(q.h, 1) +
            (sh.rot ? ', ' + nf(sh.rot, 0) + T('u.deg') : '');
        } else geo = T('s.points', [sh.pts.length]);
        var cnd = [];
        if (sh.fixed) cnd.push(T('s.temp') + ' ' + nf(sh.fixedTv, 1) + ' ' + T('u.C'));
        else if (sh.T0 != null) cnd.push(T('s.T0') + ' ' + nf(sh.T0, 1) + ' ' + T('u.C'));
        if (sh.q) cnd.push(nf(sh.q, 0) + ' ' + T('u.Wm3'));
        if (sh.Rc) cnd.push('R = ' + nf(sh.Rc, 4) + ' ' + T('u.m2KW'));
        if (sh.outline) cnd.push(T('s.outline'));
        if (sh.subtract) cnd.push(T('s.subtract'));
        srows2.push([shapeLabel(sh), sh.subtract ? T('d.void') : matName(MATS[sh.mat]), geo, cnd.join(', ')]);
      });
      y = table(g, mL, y, [{ w: 44 }, { w: 42, dim: true }, { w: 48, dim: true }, { w: 46 }],
        [T('pdf.shape'), T('s.material'), T('s.geometry'), T('s.conditions')], srows2, { rh: 5 });
      if (more) txt(g, '+ ' + more, mL, y, { size: 2.7, color: COL.dim });
    }
    footer(g, 1, 2);
    pages.push(p1.c);

    /* ---------- страница 2: поле, график, баланс, численность ---------- */
    var p2 = pdfCtx(); g = p2.g;
    header(g, 2);
    y = 36 * MM;
    y = section(g, T('pdf.secResult'), mL, y, contentW * MM);
    if (results) {
      var fb = imgBox(contentW - 22, probes.length ? 80 : 125);
      var fimg = renderView(fb.w, fb.h, {});
      g.drawImage(fimg, mL + fb.off * MM, y, fb.w * MM, fb.h * MM);
      g.save(); g.strokeStyle = COL.line; g.lineWidth = 1; g.strokeRect(mL + fb.off * MM, y, fb.w * MM, fb.h * MM); g.restore();
      colorbar(g, mL + (contentW - 16) * MM, y + 4 * MM, 5, Math.max(24, fb.h - 10), rng);
      y += (fb.h + 6) * MM;
      var info = fmtTime(results.times[curFrame]) + '   ·   ' + T('pdf.tRange') + ': ' +
        nf(rng[0], 1) + ' … ' + nf(rng[1], 1) + ' ' + T('u.C');
      txt(g, info, mL, y, { size: 2.9, color: COL.dim });
      y += 6 * MM;
      if (probes.length) {
        var prows = probes.map(function (pt, i) {
          var v = probeVal(i, curFrame);
          return [(i + 1) + '', nf(pt[0], 1) + ' × ' + nf(pt[1], 1) + ' ' + T('u.mm'), v == null ? T('u.none') : nf(v, 2) + ' ' + T('u.C')];
        });
        y = table(g, mL, y, [{ w: 12, dim: true }, { w: 60 }, { w: 40, align: 'right', bold: true }],
          [T('pdf.probe'), T('pdf.position'), T('pdf.value')], prows, { rh: 5 });
        y += 2 * MM;
        if (isFinite(results.times[results.times.length - 1])) {
          y = section(g, T('pdf.secChart'), mL, y, contentW * MM);
          var ch = document.createElement('canvas');
          ch.width = Math.round(contentW * MM); ch.height = Math.round(45 * MM);
          var cg = ch.getContext('2d');
          drawChart(cg, ch.width, ch.height, ch.height / 146,
            { bg: '#fbfcfd', grid: '#dde3ea', ink: '#5c6673', cursor: '#ff8a3d99' });
          g.drawImage(ch, mL, y, contentW * MM, 45 * MM);
          g.save(); g.strokeStyle = COL.line; g.lineWidth = 1; g.strokeRect(mL, y, contentW * MM, 45 * MM); g.restore();
          y += 49 * MM;
        }
      }
    } else {
      y = wrapText(g, T('pdf.noResult'), mL, y, contentW * MM, { size: 3 }) + 4 * MM;
    }

    if (results && results.flux) {
      y = section(g, T('pdf.secBalance'), mL, y, contentW * MM);
      var F = results.flux, nm = { left: 'c.bLeft', right: 'c.bRight', bottom: 'c.bTop', top: 'c.bBottom' };
      var brows = [];
      ['left', 'right', 'bottom', 'top'].forEach(function (k) {
        if (Math.abs(F[k]) > 1e-9) brows.push([T(nm[k]), nf(F[k], 2) + ' ' + T('u.W')]);
      });
      if (Math.abs(F.surface) > 1e-9) brows.push([T('c.bSurface'), nf(F.surface, 2) + ' ' + T('u.W')]);
      if (Math.abs(F.source) > 1e-9) brows.push([T('c.bSource'), nf(F.source, 2) + ' ' + T('u.W')]);
      if (Math.abs(F.fixedIn) > 1e-9) brows.push([T('c.bFixed'), nf(F.fixedIn, 2) + ' ' + T('u.W')]);
      brows.push([T(results.steady ? 'c.bResidual' : 'c.bTotal'), nf(F.total, 2) + ' ' + T('u.W')]);
      y = table(g, mL, y, [{ w: 70, dim: true }, { w: 45, align: 'right', bold: true }], null, brows, { rh: 5 });
      y += 3 * MM;
    }

    y = section(g, T('pdf.secSolver'), mL, y, contentW * MM);
    var srows = [[T('pdf.method'), T('pdf.methodT')]];
    if (results) {
      srows.push([T('pdf.mesh'), d.nx + ' × ' + d.ny + ' = ' + (d.nx * d.ny)]);
      srows.push([T('pdf.steps'), String(results.steps)]);
      srows.push([T('pdf.wall'), nf(results.wall / 1000, 2) + ' ' + T('u.s')]);
    }
    var yy = y;
    srows.forEach(function (r) {
      txt(g, r[0], mL, yy, { size: 2.8, color: COL.dim });
      yy = wrapText(g, r[1], mL + 45 * MM, yy, 135 * MM, { size: 2.8, color: COL.ink });
      yy += 1.4 * MM;
    });
    yy += 2 * MM;
    wrapText(g, T('pdf.validated'), mL, yy, contentW * MM, { size: 2.6 });
    footer(g, 2, 2);
    pages.push(p2.c);
    pages.attribution = [pdfTextLine(1, 2), pdfTextLine(2, 2)];
    return pages;
  }

  /* ---------- минимальный писатель PDF: страницы-изображения JPEG ---------- */
  function makePDF(canvases) {
    var parts = [], len = 0;
    function put(x) {
      if (typeof x === 'string') {
        var b = new Uint8Array(x.length);
        for (var i = 0; i < x.length; i++) b[i] = x.charCodeAt(i) & 0xff;
        x = b;
      }
      parts.push(x); len += x.length; return len;
    }
    function b64ToBytes(b64) {
      var bin = atob(b64), n = bin.length, out = new Uint8Array(n);
      for (var i = 0; i < n; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    function pdfStr(x) {
      return '(' + String(x).replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)') + ')';
    }
    var W = 595.276, H = 841.89;                       // A4 в пунктах
    var n = canvases.length, offsets = [], obj = 0;
    var fontObj = 3 + n * 3;                            // объект шрифта — после страниц
    var lines = canvases.attribution || [];
    put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    function begin() { obj++; offsets[obj] = len; put(obj + ' 0 obj\n'); }
    function end() { put('endobj\n'); }
    // 1 — каталог, 2 — дерево страниц
    begin(); put('<< /Type /Catalog /Pages 2 0 R >>\n'); end();
    var kids = [];
    for (var i = 0; i < n; i++) kids.push((3 + i * 3) + ' 0 R');
    begin(); put('<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + n + ' >>\n'); end();
    for (i = 0; i < n; i++) {
      var jpg = b64ToBytes(canvases[i].toDataURL('image/jpeg', 0.93).split(',')[1]);
      var pageObj = 3 + i * 3, contObj = pageObj + 1, imgObj = pageObj + 2;
      begin(); put('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + W + ' ' + H + '] /Resources << /XObject << /Im0 ' +
        imgObj + ' 0 R >> /Font << /F1 ' + fontObj + ' 0 R >> >> /Contents ' + contObj + ' 0 R >>\n'); end();
      // картинка страницы + невидимый (3 Tr) текстовый слой со строкой происхождения:
      // видимая версия уже нарисована в растре, а этот слой делает её извлекаемой
      var stream = 'q ' + W + ' 0 0 ' + H + ' 0 0 cm /Im0 Do Q\n';
      if (lines[i]) stream += 'BT 3 Tr /F1 6 Tf 42.5 23 Td ' + pdfStr(lines[i]) + ' Tj ET\n';
      begin(); put('<< /Length ' + stream.length + ' >>\nstream\n' + stream + 'endstream\n'); end();
      begin();
      put('<< /Type /XObject /Subtype /Image /Width ' + canvases[i].width + ' /Height ' + canvases[i].height +
        ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpg.length + ' >>\nstream\n');
      put(jpg); put('\nendstream\n'); end();
    }
    begin(); put('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\n'); end();
    var xref = len;
    var s = 'xref\n0 ' + (obj + 1) + '\n0000000000 65535 f \n';
    for (i = 1; i <= obj; i++) s += ('0000000000' + offsets[i]).slice(-10) + ' 00000 n \n';
    s += 'trailer\n<< /Size ' + (obj + 1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n';
    put(s);
    var total = new Uint8Array(len), off = 0;
    parts.forEach(function (p) { total.set(p, off); off += p.length; });
    return new Blob([total], { type: 'application/pdf' });
  }

  /* Иллюстрированный отчёт тула: чертёж сечения, поле температур со шкалой,
     таблицы материалов и баланса. Общая панель сайта печатает другой отчёт — по
     расчётной записи и секциям, без картинок, — поэтому это не дубль. */
  function exportPdf(e, a) {
    var btn = e && e.currentTarget;
    if (btn) btn.disabled = true;
    setTimeout(function () {
      try {
        var blob = makePDF(buildReport());
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'heat2d-report.pdf';
        link.click();
        setTimeout(function () { URL.revokeObjectURL(link.href); }, 4000);
      } catch (err) {
        notify(T('msg.error', [err.message]), 'err');
      }
      if (btn) btn.disabled = false;
    }, 30);
  }

  // ---------------- переключение языка ----------------
  /* Язык остаётся за тулом по одной причине: словарь тула знает семь языков, а
     каталожная шестёрка фреймворка русского не содержит, и его переключатель
     русский молча отвергает. Контрол при этом стоит там, где ему велено стоять
     законом размещения — в шапке, между «?» и темой, — и выглядит как
     фреймворковый select. Смена языка пересобирает приложение целиком, поэтому
     каждая подпись, единица и подсказка приходит из словаря заново. */
  function applyStatic() {
    document.documentElement.lang = LANG;
    document.title = T('app.title');
    updBackend();   // v2: бейдж бэкенда тоже локализован
  }
  function setLang(code) {
    if (!I18N.meta[code]) return;
    LANG = code;
    try { localStorage.setItem('diagram_lang', code); } catch (e) { }
    applyStatic();
    if (app) rebuildApp();
    updStats(); updTLabel(); updChart(); draw();
    if (window.Diagram && window.Diagram.setLang) { try { window.Diagram.setLang(code); } catch (e) { } }
  }
  function languageSelect() {
    var selEl = DiagramUI.el('select', { class: 'dgu-sel', 'aria-label': T('ui.language') });
    Object.keys(I18N.meta).forEach(function (c) {
      selEl.appendChild(DiagramUI.el('option', { value: c, text: I18N.meta[c].name }));
    });
    selEl.value = LANG;
    selEl.addEventListener('change', function () { setLang(selEl.value); });
    return selEl;
  }

  /* =============== оболочка (diagram-ui.js) ===============
   * Экран собирается из слотов фреймворка: палитра и списки — inputs, холст —
   * stage, инспектор с тремя вкладками — detail, шкала времени, график и файлы —
   * dock, числа — results, инструкция и ограничения — footer. Собственной
   * шапки, своего переключателя языка, своей строки экспорта, своих модальных
   * окон и своей сетки колонок у тула больше нет.
   */
  var ovTip = null, ovLegend = null, ovLgc = null, ovLgMax = null, ovLgMin = null;
  var ovProg = null, ovProgTx = null, ovProgBar = null, ovProgEl = null;

  function el(tag, attrs, kids) { return DiagramUI.el(tag, attrs, kids); }

  /* ---- результаты ---- */
  function buildResults() {
    if (!results) return null;
    var rng = frameRange(), F = results.flux || null;
    var warn = [];
    if (results.notConverged) warn.push(T('c.warnNC', [results.notConverged]));
    if (results.cgFail) warn.push(T('c.warnCG', [results.cgFail]));
    if (gridChanged()) warn.push(T('ui.staleGrid', [results.dims.nx, results.dims.ny]));
    if (statsLimited) warn.push(T('ui.statsGridLimited'));
    var d = gridDims();
    if (Math.abs(d.ny * d.dx - M.H) > 1e-6) warn.push(plain(T('c.domEffHint')));
    if (M.shapes.some(function (sh) { return sh.visible !== false && sh.type !== 'rect'; }) &&
        (M.glob.hConv > 0 || M.glob.radiation)) warn.push(T('rec.curved'));

    var tiles = [
      { label: T('c.range'), value: nf(rng[0], 1) + ' … ' + nf(rng[1], 1), unit: T('u.C'),
        tone: warn.length ? 'warn' : 'ok' },
      { label: T('c.time'), value: results.steady ? T('u.steady') : fmtTime(results.times[curFrame]) },
      { label: T(results.steady ? 'c.bResidual' : 'c.bTotal'),
        value: F ? F.total : null, unit: T('u.W'), precision: 2, learn: 'balance' },
      { label: T('c.framesN'), value: results.frames.length, precision: 0, headline: false },
      { label: T('c.steps'), value: results.steps, precision: 0, headline: false },
      { label: T('c.wall'), value: results.wall / 1000, unit: T('u.s'), precision: 2, headline: false }
    ];

    var tables = [];
    if (F) {
      var nm = { left: 'c.bLeft', right: 'c.bRight', bottom: 'c.bTop', top: 'c.bBottom' };
      var rows = [];
      ['left', 'right', 'bottom', 'top'].forEach(function (k) {
        if (Math.abs(F[k]) > 1e-9) rows.push([T(nm[k]), F[k]]);
      });
      if (Math.abs(F.surface) > 1e-9) rows.push([T('c.bSurface'), F.surface]);
      if (Math.abs(F.source) > 1e-9) rows.push([T('c.bSource'), F.source]);
      if (Math.abs(F.fixedIn) > 1e-9) rows.push([T('c.bFixed'), F.fixedIn]);
      rows.push([T(results.steady ? 'c.bResidual' : 'c.bTotal'), F.total]);
      tables.push({ title: T(results.steady ? 'c.balance' : 'c.balanceLast'),
        head: ['', T('u.W')], rows: rows });
    }
    if (probes.length) {
      tables.push({ title: T('c.probes'), head: ['#', T('u.mm'), T('u.C')],
        rows: probes.map(function (pt, i) {
          var v = results ? probeVal(i, curFrame) : null;
          return [String(i + 1), nf(pt[0], 1) + ' × ' + nf(pt[1], 1), v == null ? T('u.none') : nf(v, 2)];
        }) });
    }

    var notes = [T(results.steady ? 'c.balHintSteady' : 'c.balHintTrans')];
    if (!probes.length) notes.push(T('c.probeHint'));
    notes.push(backendLabelText);

    lastPayload = {
      verdict: warn.length
        ? { tone: 'warn', text: warn.join(' ') }
        : { tone: 'ok', text: T(results.steady ? 'ui.steady' : 'c.duration') + ': ' +
            (results.steady ? T('u.steady') : fmtTime(M.sim.tEnd)) + ' · ' + statsText },
      tiles: tiles, tables: tables, notes: notes
    };
    return lastPayload;
  }
  function refreshResults() {
    if (!app || !results) return;
    var st = app.state_;
    app.results(buildResults());
    if (st === 'stale' || st === 'error') app.setState(st);
  }

  }
  function dgcDeserialize(st) {
    if (!st || typeof st !== 'object' || !st.m || typeof st.m !== 'object')
      throw new Error('unrecognised heat2d state payload (no model)');
    if (st.lang && I18N.meta[st.lang]) setLang(st.lang);
    load(st.m);
    var v = st.view || {};
    if (v.pal) V.pal = v.pal;
    if (v.scale) V.scale = v.scale;
    if (isFinite(v.vmin)) V.vmin = +v.vmin;
    if (isFinite(v.vmax)) V.vmax = +v.vmax;
    ['grid', 'geom', 'iso', 'flux'].forEach(function (k) {
      if (typeof v[k] === 'boolean') V[k] = v[k];
    });
    if (isFinite(v.isoN)) V.isoN = +v.isoN;
    syncUI(); draw();
    // ссылка должна воспроизводить и результат, а не только постановку задачи
    if (st.ran === 'steady') run(true);
    else if (st.ran === 'trans') run(false);
  }

  function dgcEdge(e) { return edgeText(e); }
  function dgcRecord() {
    var d = gridDims(), t = results ? results.times[curFrame] : null;
    var rng = results ? frameRange() : null;
    var mats = {};
    M.shapes.forEach(function (sh) {
      if (sh.visible === false) return;
      var m = MATS[sh.mat];
      if (m) mats[m.id] = { k: m.k, rho: m.rho, c: m.c, eps: m.eps };
    });
    if (M.bgMat != null && MATS[M.bgMat]) {
      var bm = MATS[M.bgMat];
      mats[bm.id] = { k: bm.k, rho: bm.rho, c: bm.c, eps: bm.eps };
    }
    var w = [];
    if (!results) w.push(T('c.notRun'));
    if (stale) w.push(T('ui.staleModel'));
    if (results && results.notConverged) w.push(T('c.warnNC', [results.notConverged]));
    if (results && results.cgFail) w.push(T('c.warnCG', [results.cgFail]));
    if (d.clamped) w.push(T('ui.statsGridLimited'));
    if (Math.abs(d.ny * d.dx - M.H) > 1e-6) w.push(T('c.domEffHint'));
    var curved = M.shapes.some(function (sh) { return sh.visible !== false && sh.type !== 'rect'; });
    if (curved && (M.glob.hConv > 0 || M.glob.radiation)) w.push(T('rec.curved'));
    var out = {
      T_min: rng ? rng[0] : null, T_max: rng ? rng[1] : null,
      frame_time_s: (t === null || !isFinite(t)) ? null : t,
      steady: results ? !!results.steady : null
    };
    var un = { W: 'mm', H: 'mm', dx: 'mm', T_min: 'degC', T_max: 'degC', frame_time_s: 's' };
    if (results && results.flux) {
      var F = results.flux;
      out.Q_left = F.left; out.Q_right = F.right;
      out.Q_top = F.bottom; out.Q_bottom = F.top;      // экранные стороны
      out.Q_surface = F.surface; out.Q_source = F.source; out.Q_fixed = F.fixedIn;
      out.Q_residual = F.total;
      ['Q_left', 'Q_right', 'Q_top', 'Q_bottom', 'Q_surface', 'Q_source', 'Q_fixed', 'Q_residual']
        .forEach(function (k) { un[k] = 'W/m'; });
    }
    probes.forEach(function (pt, i) {
      var v = results ? probeVal(i, curFrame) : null;
      out['probe_' + (i + 1) + '_T'] = v;
      un['probe_' + (i + 1) + '_T'] = 'degC';
    });
    /* v2: свип сходимости — тот же выход записи. Ключа нет, пока свип не запущен, поэтому
       запись в состоянии по умолчанию побайтово та же, что у v1. */
    var conv = sweepRecord();
    if (conv) out.convergence = conv;
    return {
      inputs: {
        W: M.W, H: M.H, nx: d.nx, ny: d.ny, dx: d.dx,
        background_material: M.bgMat == null ? null : MATS[M.bgMat].id,
        T_initial: M.glob.T0, T_ambient: M.glob.Tinf,
        h_surface: M.glob.hConv, emissivity: M.glob.epsSurf, radiation: !!M.glob.radiation,
        edge_left: dgcEdge(M.edges.left), edge_right: dgcEdge(M.edges.right),
        edge_top: dgcEdge(M.edges.top), edge_bottom: dgcEdge(M.edges.bottom),
        shapes: M.shapes.filter(function (sh) { return sh.visible !== false; }).map(function (sh) {
          return { name: shapeLabel(sh), type: sh.type, material: MATS[sh.mat] ? MATS[sh.mat].id : null,
                   fixed_T: sh.fixed ? sh.fixedTv : null, q_source: sh.q || 0, Rc: sh.Rc || 0 };
        }),
        materials: mats,
        t_end_s: M.sim.tEnd, frames: M.sim.nFrames, step_tolerance_K: M.sim.tol,
        probes_mm: probes.map(function (p) { return [p[0], p[1]]; })
      },
      outputs: out,
      units: Object.assign({ nx: '', ny: '', T_initial: 'degC', T_ambient: 'degC',
        h_surface: 'W/(m2.K)', t_end_s: 's', step_tolerance_K: 'K' }, un),
      model: {
        equations: [
          'rho c dT/dt = div(k grad T) + q   (two-dimensional Cartesian conduction in the cross-section of an infinite prism)',
          'Finite volume on a uniform square grid: sum over faces of G_f (T_nb - T_P) + q V = C_P (T_P - T_P^n)/dt',
          'Interior face conductance: G = dx / (dx/(2 k_P) + dx/(2 k_N) + R_c)   (harmonic mean, with contact resistance R_c)',
          'Prescribed-temperature edge: G = 2 k, applied on the domain face (half a cell from the cell centre)',
          'Convective / radiating surface: U = A_f dx / (dx/(2 k) + 1/h_tot), h_tot from (T_c - T_s)/R_half = h_c (T_s - T_inf) + eps sigma (T_s^4 - T_inf^4)',
          'Radiation film coefficient: h_r = eps sigma (T_s^2 + T_inf^2)(T_s + T_inf),  sigma = 5.670374419e-8 W/(m2.K4)',
          'Staircase surface-area correction per face: A_f = sqrt(r^2+1)/(r+1), r = run length of consecutive open faces of the step period',
          'Phase change by the enthalpy method: H(T) piecewise linear over [T_s, T_l] with latent heat L; Newton with the secant capacity c = (H(T_k)-H(T_n))/(T_k-T_n)',
          'Linear system solved by preconditioned conjugate gradients with an IC(0) factorisation; time integration is implicit (backward) Euler with an adaptive step chosen from |d2T/dt2| dt^2/2 <= tol'
        ],
        ranges: T('rec.ranges'),
        notes: T('rec.notes')
      },
      warnings: w
    };
  }

  function dgcHandoff() {
    if (!results) return null;
    var rng = frameRange();
    return { quantities: { T: { value: rng[1] + 273.15, unit: 'K' } } };
  }
  function dgcApply(payload) {
    var q = (payload && payload.quantities) || {}, accepted = [], ignored = [];
    Object.keys(q).forEach(function (k) {
      if (k === 'T' && typeof q[k].value === 'number' && isFinite(q[k].value)) {
        M.glob.Tinf = Math.round((q[k].value - 273.15) * 1000) / 1000;   // K -> °C, ambient
        accepted.push('T');
      } else ignored.push(k);
    });
    if (accepted.length) { invalidate(true); renderPanel(); draw(); }
    return { accepted: accepted, ignored: ignored };
  }

  /* The temperature field is this tool's whole output, and the colour scale
     that reads it is an HTML overlay beside the canvas, not part of it. A
     snapshot of the canvas alone printed a picture with no key: nothing in it
     said which end was -19.6 °C. Compose the field and the scale into one
     canvas and hand that to the report. */
  function dgcReportFigure() {
    if (!cv || !ovLgc) return null;
    var pad = 10, barW = 18, txtW = 78, W = cv.width, H = cv.height;
    if (!W || !H) return null;
    var out = document.createElement('canvas');
    out.width = W + pad * 2 + barW + txtW; out.height = H;
    var g = out.getContext('2d');
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, out.width, out.height);
    g.drawImage(cv, 0, 0);
    var barH = Math.max(120, Math.min(Math.round(H * 0.6), 360));
    var x0 = W + pad, y0 = Math.round((H - barH) / 2);
    g.drawImage(ovLgc, 0, 0, ovLgc.width, ovLgc.height, x0, y0, barW, barH);
    g.strokeStyle = '#b9c7d3'; g.lineWidth = 1;
    g.strokeRect(x0 + 0.5, y0 + 0.5, barW - 1, barH - 1);
    g.fillStyle = '#17202a';
    g.font = '13px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif';
    g.textBaseline = 'middle';
    g.fillText(String(ovLgMax && ovLgMax.textContent || ''), x0 + barW + 6, y0 + 8);
    g.fillText(String(ovLgMin && ovLgMin.textContent || ''), x0 + barW + 6, y0 + barH - 8);
    g.fillText(T('u.C'), x0, y0 + barH + 14);
    return out;
  }

  /* The report stated no acceptance criterion. The energy balance is the one
     this model checks itself against, and the tool already holds both sides
     of it: the residual, and the largest boundary flow it is measured against. */
  function dgcReportProfile(rec, ctx) {
    if (!results) return null;
    var own = {};
    var fig = dgcReportFigure();
    if (fig) own.figures = [ctx.figure(fig, { caption: String(cv.getAttribute('aria-label') || '') })];
    var F = results.flux;
    if (F) {
      var scale = 0;
      ['left', 'right', 'top', 'bottom', 'surface', 'source', 'fixedIn'].forEach(function (k) {
        if (isFinite(F[k])) scale = Math.max(scale, Math.abs(F[k]));
      });
      if (scale > 0 && isFinite(F.total)) {
        var rel = Math.abs(F.total) / scale;
        own.checks = [{
          status: results.steady ? (rel <= 0.01 ? 'pass' : (rel <= 0.05 ? 'attention' : 'fail')) : 'info',
          title: T(results.steady ? 'c.balance' : 'c.balanceLast'),
          detail: T(results.steady ? 'c.balHintSteady' : 'c.balHintTrans'),
          actual: nf(F.total, 3) + ' ' + T('u.W') + ' (' + nf(rel * 100, 2) + ' %)',
          criterion: results.steady ? ('|\u0394| \u2264 1 % \u00b7 ' + nf(scale, 3) + ' ' + T('u.W')) : ''
        }];
      }
    }
    return own;
  }

  function dgcSections() {
    var out = [];
    out.push({
      title: T('d.edges'), cols: '1fr 2fr', head: [T('c.mesh'), ''],
      rows: [[T('c.bLeft'), edgeText(M.edges.left)], [T('c.bRight'), edgeText(M.edges.right)],
             [T('c.bTop'), edgeText(M.edges.top)], [T('c.bBottom'), edgeText(M.edges.bottom)]]
    });
    /* Every boundary flow is a record output and is printed in the results
       table; the residual is the acceptance check on page one. This table
       stated the same five numbers a third time. */
    if (probes.length) {
      out.push({ title: T('c.probes'), cols: '1fr 1fr 1fr',
        head: ['#', T('u.mm'), T('u.C')],
        rows: probes.map(function (pt, i) {
          var v = results ? probeVal(i, curFrame) : null;
          return [String(i + 1), nf(pt[0], 1) + ' × ' + nf(pt[1], 1), v == null ? T('u.none') : nf(v, 2)];
        }) });
    }
    /* v2: свип сходимости попадает и в PDF-отчёт — тем же путём секций, что и всё остальное. */
    if (sweepResult) {
      var p = sweepResult.plan, stt = sweepResult.stats;
      var rowsOf = function (idx) {
        return idx.map(function (i) {
          var c = p.list[i], s = stt[i];
          return [c.lvl.nx + '×' + c.lvl.ny, nf(c.lvl.dx, 3), c.steady ? T('u.none') : nf(c.tol, 4),
            s ? nf(s.Tmean, 4) : T('u.none'), s ? nf(s.Qin, 3) : T('u.none')];
        });
      };
      var ordOf = function (idx, q, r) {
        if (!stt[idx[0]] || !stt[idx[1]] || !stt[idx[2]]) return T('sw.orderNA');
        var o = sweepOrder(stt[idx[0]][q], stt[idx[1]][q], stt[idx[2]][q], r);
        return T(q === 'Tmean' ? 'sw.Tmean' : 'sw.Qin') + ': ' +
          (o ? T('sw.order', [nf(o.p, 2), nf(o.r, 2), nf(o.rich, 4)]) : T('sw.orderNA'));
      };
      var head5 = [T('c.mesh'), T('sw.dx'), T('sw.tol'), T('sw.Tmean'), T('sw.Qin')];
      out.push({ title: T('sw.title') + ' — ' + T('sw.mesh'), cols: '1fr 1fr 1fr 1fr 1fr', head: head5,
        rows: rowsOf(p.meshIdx),
        notes: [T('sw.intro', [sweepResult.frames]),
                T('sw.mode', [p.steady ? T('sw.modeSteady') : T('sw.modeTrans', [fmtTime(p.tEnd)])]),
                ordOf(p.meshIdx, 'Tmean', 2), ordOf(p.meshIdx, 'Qin', 2)] });
      out.push({ title: T('sw.title') + ' — ' + T('sw.time'), cols: '1fr 1fr 1fr 1fr 1fr', head: head5,
        rows: rowsOf(p.timeIdx),
        notes: [ordOf(p.timeIdx, 'Tmean', sweepResult.rTime), ordOf(p.timeIdx, 'Qin', sweepResult.rTime),
                T('sw.hint')] });
    }
    return out;
  }

  function dgcInit() {
    if (!window.Diagram) return;
    window.Diagram.init({
      id: 'heat2d', file: 'heat2d.html',
      state: { serialize: dgcSerialize, deserialize: dgcDeserialize },
      record: dgcRecord,
      report: { profile: dgcReportProfile, sections: dgcSections },
      handoff: { provides: ['T'], accepts: ['T'], build: dgcHandoff, apply: dgcApply }
    });
    /* Первый результат этого тула зависит от воркера: строим пул сразу и объявляем его воротами
       готовности, чтобы автоматические проверки ждали сигнал, а не угадывали задержку. */
    if (window.Diagram.ready) window.Diagram.ready(ensurePool());
  }

  // ---------------- старт ----------------
  /* Порядок нормативный (спека §3): модель — без DOM; оболочка — сразу и
     целиком; Diagram.init — безусловно, вне любых then/catch; потом ui.ready().
     Ни один шаг не ждёт воркера: пул строится сам и объявляется воротами
     готовности отдельно, как и раньше. */
  window.addEventListener('resize', function () { updChart(); });
  M = EXAMPLES.wall();
  probes = M.probes || [];
  applyStatic();
  rebuild();
  setTool('select');

  function boot() {
    if (!window.DiagramUI || DiagramUI.api !== 'tools.petrov.re/ui/v1') {
      /* Честная деградация: без библиотеки интерфейса рисовать нечем, но слой
         честности и слой данных остаются на месте — панель сайта, дисклеймер,
         постоянная ссылка и запись расчёта продолжают работать. */
      var box = document.getElementById('app');
      if (box) {
        var h = document.createElement('h1');
        h.textContent = T('app.title');
        var p1 = document.createElement('p');
        p1.textContent = 'diagram-ui.js (' + 'tools.petrov.re/ui/v1' + ') is required for this tool\u2019s interface.';
        box.appendChild(h); box.appendChild(p1);
      }
      dgcInit();
      if (window.Diagram && Diagram.toolbar && Diagram.toolbar.refresh) {
        try { Diagram.toolbar.refresh(); } catch (e) { }
      }
      return;
    }
    buildApp();
    dgcInit();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  /* Приёмочному харнессу нужен доступ к состоянию, а не к DOM. */
  window.__heat2d = { get model() { return M; }, view: V, solve: startRun,
    record: dgcRecord, apply: dgcApply, lang: function () { return LANG; } };
})();

</script>
</body>
