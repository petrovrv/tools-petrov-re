<script type="application/json" id="diagram-tool-manifest">{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision":"2026-08-15.1","id":"heat2d","file":"heat2d.html","listed":true,"category":"thermo","order":12,"title":{"en":"2D Heat Transfer","uk":"Двовимірний теплообмін","de":"Zweidimensionaler Wärmetransport","nl":"Tweedimensionale warmteoverdracht","fr":"Transfert thermique bidimensionnel","es":"Transferencia de calor bidimensional","pl":"Dwuwymiarowa wymiana ciepła"},"summary":{"en":"Interactive two-dimensional temperature-field model. Define materials and boundary conditions, then inspect temperatures, gradients, isotherms and heat-flow paths.","uk":"Інтерактивна двовимірна модель температурного поля. Задайте матеріали та граничні умови, а потім досліджуйте температури, градієнти, ізотерми й шляхи теплового потоку.","de":"Interaktives zweidimensionales Temperaturfeldmodell. Werkstoffe und Randbedingungen festlegen und anschließend Temperaturen, Gradienten, Isothermen und Wärmestrompfade untersuchen.","nl":"Interactief tweedimensionaal temperatuurveldmodel. Stel materialen en randvoorwaarden in en onderzoek vervolgens temperaturen, gradiënten, isothermen en warmtestroompaden.","fr":"Modèle interactif de champ de température bidimensionnel. Définissez les matériaux et les conditions aux limites, puis examinez les températures, les gradients, les isothermes et les trajets du flux thermique.","es":"Modelo interactivo bidimensional del campo de temperaturas. Defina los materiales y las condiciones de contorno y examine las temperaturas, los gradientes, las isotermas y las trayectorias del flujo térmico.","pl":"Interaktywny dwuwymiarowy model pola temperaturowego. Zdefiniuj materiały i warunki brzegowe, a następnie sprawdź temperatury, gradienty, izotermy i ścieżki przepływu ciepła."},"description":{"en":"Interactive two-dimensional temperature-field model. Define materials and boundary conditions, then inspect temperatures, gradients, isotherms and heat-flow paths.","uk":"Інтерактивна двовимірна модель температурного поля. Задайте матеріали та граничні умови, а потім досліджуйте температури, градієнти, ізотерми й шляхи теплового потоку.","de":"Interaktives zweidimensionales Temperaturfeldmodell. Werkstoffe und Randbedingungen festlegen und anschließend Temperaturen, Gradienten, Isothermen und Wärmestrompfade untersuchen.","nl":"Interactief tweedimensionaal temperatuurveldmodel. Stel materialen en randvoorwaarden in en onderzoek vervolgens temperaturen, gradiënten, isothermen en warmtestroompaden.","fr":"Modèle interactif de champ de température bidimensionnel. Définissez les matériaux et les conditions aux limites, puis examinez les températures, les gradients, les isothermes et les trajets du flux thermique.","es":"Modelo interactivo bidimensional del campo de temperaturas. Defina los materiales y las condiciones de contorno y examine las temperaturas, los gradientes, las isotermas y las trayectorias del flujo térmico.","pl":"Interaktywny dwuwymiarowy model pola temperaturowego. Zdefiniuj materiały i warunki brzegowe, a następnie sprawdź temperatury, gradienty, izotermy i ścieżki przepływu ciepła."},"status":"benchmarked","independent_validation":false,"limitations":{"en":"Two-dimensional Cartesian conduction in the cross-section of an infinitely long prism, on a uniform square voxel grid (at most 250 000 cells): axisymmetric and three-dimensional problems cannot be posed. Curved boundaries are voxelised, so a prescribed temperature on a curved boundary is only first-order accurate in the cell size and the corrected convective/radiating area of a curved surface keeps a residual of about 1 % that does not vanish under mesh refinement. Time integration is implicit Euler, first order in the step. Heat flows are per metre of prism length. Demonstrate mesh and time-step convergence before relying on results. The convergence sweep added in this build is a numerical study of this model against itself: it integrates each case to the same end time with its own fixed output framing, so its cases reproduce each other but not necessarily the run shown on screen, and the observed order it reports is only meaningful where the three levels differ monotonically.","uk":"Двовимірна декартова теплопровідність у перерізі нескінченно довгої призми на рівномірній квадратній вокселній сітці (щонайбільше 250 000 комірок): осесиметричні та тривимірні задачі поставити неможливо. Криволінійні межі вокселізуються, тому задана температура на криволінійній межі має лише перший порядок точності за розміром комірки, а скоригована конвективна/випромінювальна площа криволінійної поверхні зберігає похибку близько 1 %, яка не зникає при подрібненні сітки. Інтегрування за часом — неявний метод Ейлера, перший порядок за кроком. Теплові потоки наведено на метр довжини призми. Перед використанням результатів покажіть збіжність за сіткою й кроком часу. Свип збіжності, доданий у цій збірці, — це числове дослідження моделі відносно самої себе: кожен випадок інтегрується до того самого кінцевого часу з власною фіксованою кадровою розбивкою, тож випадки відтворюють один одного, але не обов’язково той розрахунок, що показаний на екрані, а наведений спостережуваний порядок має сенс лише там, де три рівні відрізняються монотонно.","de":"Zweidimensionale kartesische Wärmeleitung im Querschnitt eines unendlich langen Prismas auf einem gleichmäßigen quadratischen Voxelnetz (höchstens 250 000 Zellen): achsensymmetrische und dreidimensionale Aufgaben lassen sich nicht formulieren. Gekrümmte Ränder werden voxelisiert, daher ist eine vorgegebene Temperatur auf einem gekrümmten Rand nur erster Ordnung in der Zellgröße genau, und die korrigierte konvektive/strahlende Fläche einer gekrümmten Oberfläche behält einen Restfehler von etwa 1 %, der bei Netzverfeinerung nicht verschwindet. Die Zeitintegration ist implizites Euler-Verfahren, erster Ordnung im Schritt. Wärmeströme gelten je Meter Prismenlänge. Netz- und Zeitschritt-Konvergenz nachweisen, bevor Ergebnisse verwendet werden. Der in diesem Build ergänzte Konvergenzsweep ist eine numerische Untersuchung dieses Modells gegen sich selbst: jeder Fall wird mit eigener fester Bildausgabe bis zur selben Endzeit integriert, die Fälle reproduzieren also einander, nicht notwendig den auf dem Bildschirm gezeigten Lauf, und die genannte beobachtete Ordnung ist nur dort aussagekräftig, wo sich die drei Stufen monoton unterscheiden.","nl":"Tweedimensionale cartesische warmtegeleiding in de doorsnede van een oneindig lang prisma op een uniform vierkant voxelrooster (maximaal 250 000 cellen): asymmetrische en driedimensionale problemen kunnen niet worden gesteld. Gekromde randen worden gevoxeliseerd, dus een voorgeschreven temperatuur op een gekromde rand is slechts eerste-orde nauwkeurig in de celgrootte en het gecorrigeerde convectieve/stralende oppervlak van een gekromd vlak houdt een restfout van circa 1 % die niet verdwijnt bij roosterverfijning. Tijdintegratie is impliciete Euler, eerste orde in de stap. Warmtestromen zijn per meter prismalengte. Toon rooster- en tijdstapconvergentie aan voordat u op resultaten vertrouwt. De in deze build toegevoegde convergentiesweep is een numerieke studie van dit model tegen zichzelf: elk geval wordt met een eigen vaste beeldindeling tot dezelfde eindtijd geïntegreerd, dus de gevallen reproduceren elkaar en niet noodzakelijk de berekening op het scherm, en de gemelde waargenomen orde zegt alleen iets waar de drie niveaus monotoon verschillen.","fr":"Conduction cartésienne bidimensionnelle dans la section d'un prisme infiniment long, sur un maillage de voxels carrés uniformes (250 000 cellules au maximum) : les problèmes axisymétriques et tridimensionnels ne peuvent pas être posés. Les frontières courbes sont voxélisées, de sorte qu'une température imposée sur une frontière courbe n'est précise qu'au premier ordre en taille de maille et que l'aire convective/rayonnante corrigée d'une surface courbe conserve un résidu d'environ 1 % qui ne disparaît pas avec le raffinement du maillage. L'intégration temporelle est un schéma d'Euler implicite, d'ordre un en pas. Les flux thermiques sont par mètre de longueur du prisme. Démontrez la convergence du maillage et du pas de temps avant d'exploiter les résultats. Le balayage de convergence ajouté ici est une étude numérique de ce modèle contre lui-même : chaque cas est intégré jusqu’au même instant final avec son propre découpage de sorties fixe, si bien que les cas se reproduisent entre eux mais pas nécessairement le calcul affiché, et l’ordre observé annoncé n’a de sens que là où les trois niveaux diffèrent de façon monotone.","es":"Conducción cartesiana bidimensional en la sección de un prisma infinitamente largo, sobre una malla de vóxeles cuadrados uniformes (250 000 celdas como máximo): no pueden plantearse problemas axisimétricos ni tridimensionales. Los contornos curvos se voxelizan, de modo que una temperatura impuesta en un contorno curvo solo es de primer orden en el tamaño de celda y el área convectiva/radiante corregida de una superficie curva conserva un residuo de aproximadamente el 1 % que no desaparece al refinar la malla. La integración temporal es Euler implícito, de primer orden en el paso. Los flujos de calor son por metro de longitud del prisma. Demuestre convergencia de malla y paso temporal antes de confiar en los resultados. El barrido de convergencia añadido en esta versión es un estudio numérico del modelo frente a sí mismo: cada caso se integra hasta el mismo instante final con su propio muestreo fijo de fotogramas, de modo que los casos se reproducen entre sí pero no necesariamente el cálculo mostrado en pantalla, y el orden observado que se informa solo es significativo donde los tres niveles difieren de forma monótona.","pl":"Dwuwymiarowe przewodzenie kartezjańskie w przekroju poprzecznym nieskończenie długiego pryzmatu, na jednorodnej kwadratowej siatce wokseli (maksymalnie 250 000 komórek): nie można stawiać problemów osiowosymetrycznych i trójwymiarowych. Zakrzywione granice są wokselowane, więc określona temperatura na zakrzywionej granicy jest dokładna tylko pierwszego rzędu co do rozmiaru komórki, a skorygowany obszar konwekcyjny/promieniujący zakrzywionej powierzchni zachowuje resztkę około 1%, która nie znika po udoskonaleniu siatki. Całkowanie po czasie jest niejawnym równaniem Eulera, pierwszego rzędu w kroku. Przepływy ciepła są podawane na metr długości pryzmatu. Przed poleganiem na wynikach należy zademonstrować zbieżność siatki i kroku czasowego. Przebieg zbieżności dodany w tej kompilacji jest numerycznym studium tego modelu względem samego siebie: integruje on każdy przypadek do tego samego czasu końcowego z własnym ustalonym ramowaniem wyjściowym, więc jego przypadki odtwarzają się wzajemnie, ale niekoniecznie przebieg wyświetlany na ekranie, a obserwowana kolejność, którą raportuje, ma znaczenie tylko tam, gdzie trzy poziomy różnią się monotonicznie."},"intended_use":["education","technical exploration","preliminary assessment"],"catalog_languages":["en","uk","de","nl","fr","es","pl"],"tool_languages":["en","uk","de","nl","fr","es","pl","ru"],"dependencies":["diagram-common.js","diagram-compute.classic.js"],"network_access":{"mode":"same-origin-data","note":"Loads three same-origin scripts beside the page — site-disclaimer.js, diagram-common.js and diagram-compute.classic.js (the classic build of the shared compute runtime). Nothing else is fetched, no third-party host is contacted, and nothing about the cross-section the user draws is transmitted anywhere: every solve, every self-test and every convergence sweep runs in this browser, in Web Workers created from a Blob built inside the page."},"validation":{"basis":{"en":"Twelve cases driven through the tool's own project-open / solve / CSV-export path and compared with closed-form solutions of the 2-D heat equation re-derived independently in python from Incropera, Carslaw & Jaeger and Yovanovich: the Fourier-series rectangular plate, the cylindrical-shell log law, a bipolar limiting-point solution for eccentric cylinders cross-checked against the arccosh form of Table 4.1 case 7, a method-of-fundamental-solutions evaluation of the buried-pipe row shape factor cross-checked against the closed-form line-source row factor and the exact single-pipe factor, the erf semi-infinite solid, and the full 200-term plane-wall and infinite-cylinder eigenfunction series cross-checked against their one-term approximations; mesh convergence (observed order 1.96 on the plate), time-step convergence and the global steady energy balance are graded explicitly; 12/12 pass. RE-EXECUTED 2026-08-22 AGAINST THE SHIPPING BUILD (diagram-ui.js 2026-08-21.v3.5.2, diagram-compute.classic.js 0.33.0), which the 2026-08-11 run predates; the artifact now records that re-execution and not the earlier one. Every reference value was recomputed from its primary source for this run and none was carried over from the previous artifact. Four consecutive runs were byte-identical, and the 29 solves produced 29 distinct records and 26 distinct field exports, so no case was graded against another case's scene. Every physical number the 2026-08-11 run recorded is reproduced by this build to within the rounding the old DOM-scraping harness imposed: every temperature identical, every heat flow agreeing to 2.2e-10 relative or better. The one case not comparable line for line is the plate mesh-convergence sweep, whose 2026-08-11 probe list was never delivered and was rebuilt here. The benchmark was executed by a party that wrote none of the tool's code, but it is still measured evidence, not an independent review of the tool.","uk":"Дванадцять випадків, проведених через власний шлях інструмента «відкрити проєкт / розв'язати / експортувати CSV» і порівняних із замкненими розв'язками двовимірного рівняння теплопровідності, заново виведеними незалежно на Python з Incropera, Carslaw & Jaeger і Yovanovich: прямокутна пластина через ряд Фур'є, логарифмічний закон циліндричної оболонки, розв'язок у біполярних координатах через граничні точки для ексцентричних циліндрів із перехресною перевіркою формою arccosh з таблиці 4.1 випадок 7, обчислення коефіцієнта форми ряду закопаних труб методом фундаментальних розв'язків із перехресною перевіркою замкненою формулою лінійного джерела та точним коефіцієнтом одиночної труби, напівнескінченне тіло через erf, а також повні 200-членні ряди власних функцій для плоскої стінки та нескінченного циліндра з перехресною перевіркою одночленними наближеннями; збіжність за сіткою (спостережуваний порядок 1,96 на пластині), збіжність за кроком часу та глобальний стаціонарний енергетичний баланс оцінюються окремо; 12/12 пройдено. ПЕРЕЗАПУЩЕНО 2026-08-22 ПРОТИ ЗБІРКИ, ЩО ПОСТАЧАЄТЬСЯ (diagram-ui.js 2026-08-21.v3.5.2, diagram-compute.classic.js 0.33.0), якій передував прогін від 2026-08-11; артефакт тепер містить саме цей перезапуск. Кожне еталонне значення переобчислено з першоджерела для цього прогону, жодне не перенесено з попереднього артефакту. Чотири послідовні прогони збіглися побайтово, а 29 розрахунків дали 29 різних записів і 26 різних вивантажень поля, тож жоден випадок не оцінювався за чужою сценою. Кожне фізичне число прогону від 2026-08-11 відтворюється цією збіркою в межах округлення, яке накладав старий харнес, що зчитував DOM: усі температури однакові, усі теплові потоки збігаються з відносною похибкою не гіршою за 2,2e-10. Єдиний випадок, який не можна порівняти рядок у рядок, — свип збіжності за сіткою для пластини, перелік точок якого від 2026-08-11 так і не був переданий і був відтворений заново. Бенчмарк виконала сторона, яка не писала жодного рядка коду інструмента, але це все одно виміряні свідчення, а не незалежний огляд інструмента.","de":"Zwölf Fälle, über den werkzeugeigenen Weg „Projekt öffnen / rechnen / CSV exportieren“ gefahren und mit geschlossenen Lösungen der zweidimensionalen Wärmeleitungsgleichung verglichen, die in Python unabhängig aus Incropera, Carslaw & Jaeger und Yovanovich neu hergeleitet wurden: die Rechteckplatte über Fourier-Reihen, das logarithmische Gesetz der Zylinderschale, eine Lösung über die Grenzpunkte der bipolaren Koordinaten für exzentrische Zylinder, gegengeprüft an der arccosh-Form von Tabelle 4.1 Fall 7, der Formfaktor einer Reihe erdverlegter Rohre mit der Methode der Fundamentallösungen, gegengeprüft an der geschlossenen Linienquellen-Reihenformel und am exakten Einzelrohrfaktor, der halbunendliche Körper über erf sowie die vollständigen 200-gliedrigen Eigenfunktionsreihen für ebene Wand und unendlichen Zylinder, gegengeprüft an ihren Eingliednäherungen; Netzkonvergenz (beobachtete Ordnung 1,96 an der Platte), Zeitschrittkonvergenz und die globale stationäre Energiebilanz werden ausdrücklich bewertet; 12/12 bestanden. AM 2026-08-22 GEGEN DEN AUSGELIEFERTEN BUILD ERNEUT AUSGEFÜHRT (diagram-ui.js 2026-08-21.v3.5.2, diagram-compute.classic.js 0.33.0), dem der Lauf vom 2026-08-11 vorausging; das Artefakt hält nun diese erneute Ausführung fest. Jeder Referenzwert wurde für diesen Lauf aus seiner Primärquelle neu berechnet, keiner aus dem früheren Artefakt übernommen. Vier aufeinanderfolgende Läufe waren byteidentisch, und die 29 Rechnungen ergaben 29 verschiedene Aufzeichnungen und 26 verschiedene Feldexporte, kein Fall wurde also an der Szene eines anderen bewertet. Jede physikalische Zahl des Laufs vom 2026-08-11 wird von diesem Build innerhalb der Rundung reproduziert, die der alte, das DOM auslesende Prüfstand auferlegte: alle Temperaturen identisch, alle Wärmeströme mit einer relativen Abweichung von höchstens 2,2e-10. Der einzige nicht Zeile für Zeile vergleichbare Fall ist der Netzkonvergenz-Sweep der Platte, dessen Punkteliste von 2026-08-11 nie geliefert wurde und hier neu aufgebaut ist. Der Benchmark wurde von einer Partei ausgeführt, die keine Zeile des Werkzeugcodes geschrieben hat, bleibt aber gemessene Evidenz und ist keine unabhängige Prüfung des Werkzeugs.","nl":"Twaalf gevallen, gestuurd via het eigen pad van het gereedschap (project openen / oplossen / CSV exporteren) en vergeleken met gesloten oplossingen van de tweedimensionale warmtevergelijking die in python onafhankelijk zijn herleid uit Incropera, Carslaw & Jaeger en Yovanovich: de rechthoekige plaat via Fourier-reeksen, de logaritmische wet van de cilinderschaal, een oplossing via de limietpunten van de bipolaire coördinaten voor excentrische cilinders, gecontroleerd tegen de arccosh-vorm van tabel 4.1 geval 7, de vormfactor van een rij ingegraven leidingen via de methode der fundamentaaloplossingen, gecontroleerd tegen de gesloten lijnbron-rijformule en de exacte enkele-buisfactor, het halfoneindige lichaam via erf, en de volledige 200-termige eigenfunctiereeksen voor vlakke wand en oneindige cilinder, gecontroleerd tegen hun één-termbenaderingen; roosterconvergentie (waargenomen orde 1,96 op de plaat), tijdstapconvergentie en de globale stationaire energiebalans worden expliciet beoordeeld; 12/12 geslaagd. OP 2026-08-22 OPNIEUW UITGEVOERD TEGEN DE UITGELEVERDE BUILD (diagram-ui.js 2026-08-21.v3.5.2, diagram-compute.classic.js 0.33.0), waaraan de run van 2026-08-11 voorafging; het artefact legt nu die heruitvoering vast. Elke referentiewaarde is voor deze run opnieuw uit de primaire bron berekend en geen enkele is uit het vorige artefact overgenomen. Vier opeenvolgende runs waren byte-identiek, en de 29 berekeningen leverden 29 verschillende records en 26 verschillende veldexports op, dus geen enkel geval is tegen de scène van een ander beoordeeld. Elk fysisch getal van de run van 2026-08-11 wordt door deze build gereproduceerd binnen de afronding die de oude, het DOM uitlezende harnas oplegde: alle temperaturen identiek, alle warmtestromen met een relatieve afwijking van hoogstens 2,2e-10. Het enige geval dat niet regel voor regel vergelijkbaar is, is de roosterconvergentiesweep van de plaat, waarvan de puntenlijst van 2026-08-11 nooit is geleverd en hier opnieuw is opgebouwd. De benchmark is uitgevoerd door een partij die geen regel van de code van het gereedschap heeft geschreven, maar blijft gemeten bewijs en is geen onafhankelijke toetsing.","fr":"Douze cas pilotés par le propre chemin de l'outil (ouvrir un projet / résoudre / exporter en CSV) et comparés à des solutions analytiques de l'équation de la chaleur bidimensionnelle redérivées indépendamment en python à partir d'Incropera, de Carslaw & Jaeger et de Yovanovich : la plaque rectangulaire par séries de Fourier, la loi logarithmique de la coque cylindrique, une solution par les points limites des coordonnées bipolaires pour cylindres excentrés, recoupée avec la forme arccosh du tableau 4.1 cas 7, le facteur de forme d'une rangée de conduites enterrées par la méthode des solutions fondamentales, recoupé avec la formule fermée de la rangée de sources linéiques et avec le facteur exact d'une conduite isolée, le solide semi-infini par erf, et les séries complètes à 200 termes de fonctions propres pour la paroi plane et le cylindre infini, recoupées avec leurs approximations à un terme ; la convergence en maillage (ordre observé 1,96 sur la plaque), la convergence en pas de temps et le bilan énergétique permanent global sont notés explicitement ; 12/12 réussis. RÉ-EXÉCUTÉ LE 2026-08-22 CONTRE LA VERSION LIVRÉE (diagram-ui.js 2026-08-21.v3.5.2, diagram-compute.classic.js 0.33.0), que l'exécution du 2026-08-11 précédait ; l'artefact enregistre désormais cette ré-exécution. Chaque valeur de référence a été recalculée depuis sa source primaire pour cette exécution et aucune n'a été reprise de l'artefact précédent. Quatre exécutions consécutives ont été identiques octet pour octet, et les 29 résolutions ont produit 29 enregistrements distincts et 26 exports de champ distincts : aucun cas n'a donc été noté sur la scène d'un autre. Chaque nombre physique consigné le 2026-08-11 est reproduit par cette version à l'arrondi près qu'imposait l'ancien banc lisant le DOM : toutes les températures identiques, tous les flux thermiques concordant à 2,2e-10 en relatif ou mieux. Le seul cas non comparable ligne à ligne est le balayage de convergence en maillage de la plaque, dont la liste de points du 2026-08-11 n'a jamais été livrée et a été reconstruite ici. Le banc d'essai a été exécuté par une partie n'ayant écrit aucune ligne du code de l'outil, mais cela reste une preuve mesurée et non un examen indépendant de l'outil.","es":"Doce casos ejecutados por la propia ruta de la herramienta (abrir proyecto / resolver / exportar CSV) y comparados con soluciones cerradas de la ecuación del calor bidimensional rededucidas de forma independiente en python a partir de Incropera, Carslaw & Jaeger y Yovanovich: la placa rectangular por series de Fourier, la ley logarítmica de la envolvente cilíndrica, una solución por los puntos límite de las coordenadas bipolares para cilindros excéntricos, contrastada con la forma arccosh de la tabla 4.1 caso 7, el factor de forma de una hilera de tuberías enterradas por el método de las soluciones fundamentales, contrastado con la fórmula cerrada de la hilera de fuentes lineales y con el factor exacto de una sola tubería, el sólido semiinfinito por erf, y las series completas de 200 términos de funciones propias para pared plana y cilindro infinito, contrastadas con sus aproximaciones de un término; la convergencia de malla (orden observado 1,96 en la placa), la convergencia del paso temporal y el balance energético estacionario global se califican explícitamente; 12/12 superados. REEJECUTADO EL 2026-08-22 CONTRA LA COMPILACIÓN QUE SE DISTRIBUYE (diagram-ui.js 2026-08-21.v3.5.2, diagram-compute.classic.js 0.33.0), a la que precedía la ejecución del 2026-08-11; el artefacto registra ahora esa reejecución. Cada valor de referencia se recalculó desde su fuente primaria para esta ejecución y ninguno se arrastró del artefacto anterior. Cuatro ejecuciones consecutivas fueron idénticas byte a byte, y las 29 resoluciones produjeron 29 registros distintos y 26 exportaciones de campo distintas, de modo que ningún caso se calificó contra la escena de otro. Todo número físico que registró la ejecución del 2026-08-11 lo reproduce esta compilación dentro del redondeo que imponía el antiguo banco que leía el DOM: todas las temperaturas idénticas y todos los flujos de calor coincidiendo con un error relativo de 2,2e-10 o mejor. El único caso no comparable línea por línea es el barrido de convergencia de malla de la placa, cuya lista de puntos de 2026-08-11 nunca se entregó y se reconstruyó aquí. El banco lo ejecutó una parte que no escribió ninguna línea del código de la herramienta, pero sigue siendo evidencia medida y no una revisión independiente de la herramienta.","pl":"Dwanaście przypadków przepuszczonych przez własny projekt narzędzia — otwórz/rozwiąż/eksportuj CSV — i porównanych z rozwiązaniami w formie zamkniętej dwuwymiarowego równania ciepła wyprowadzonego niezależnie w Pythonie przez Incropera, Carslaw & Jaeger oraz Yovanovich: prostokątna płyta szeregu Fouriera, prawo logarytmu powłoki cylindrycznej, rozwiązanie bipolarne punktu granicznego dla mimośrodowych cylindrów porównane z formą Arccosha z tabeli 4.1, przypadek 7, ocena metody rozwiązań fundamentalnych współczynnika kształtu rzędu zakopanej rury porównana z współczynnikiem wiersza źródła linii w formie zamkniętej oraz dokładnym współczynnikiem pojedynczej rury, półnieskończona bryła ERF oraz pełna 200-wyrazowa seria funkcji własnych ściany płaskiej i nieskończonego cylindra porównana z ich przybliżeniami jednowyrazowymi; Konwergencja siatki (obserwowany rząd 1,96 na płytce), konwergencja kroku czasowego i globalny, ustalony bilans energetyczny są oceniane jawnie; przebieg 12/12. PONOWNIE WYKONANE 22.08.2026 W OPARCIU O WERSJĘ WYSYŁKOWĄ (diagram-ui.js 21.08.2026.v3.5.2, diagram-compute.classic.js 0.33.0), którą poprzedzał przebieg z 11.08.2026; artefakt rejestruje teraz to ponowne wykonanie, a nie wcześniejsze. Każda wartość odniesienia została przeliczona z pierwotnego źródła dla tego przebiegu i żadna nie została przeniesiona z poprzedniego artefaktu. Cztery kolejne przebiegi były identyczne bajtowo, a 29 rozwiązań wygenerowało 29 odrębnych rekordów i 26 odrębnych eksportów pól, więc żaden przypadek nie został oceniony w porównaniu ze sceną innego przypadku. Każda wartość fizyczna zarejestrowana w przebiegu z dnia 2026-08-11 jest odtworzona przez tę kompilację z zachowaniem zaokrągleń narzuconych przez stare narzędzie do scrapowania DOM: każda temperatura jest identyczna, każdy przepływ ciepła jest zgodny z wartością względną 2,2e-10 lub lepszą. Jedynym przypadkiem, w którym nie można porównać wiersz po wierszu, jest przemiatanie zbieżności siatki płyt, którego lista sond z dnia 2026-08-11 nigdy nie została dostarczona i została tutaj odtworzona. Test porównawczy został wykonany przez osobę, która nie napisała kodu narzędzia, ale nadal stanowi on zmierzony dowód, a nie niezależną recenzję narzędzia."},"independent_validation":false,"benchmarks":[{"id":"heat2d-analytic-2026-08-22","reference":"Own python implementation of closed-form solutions of the 2-D heat equation: the Fourier-series rectangular plate (Incropera eq. 4.19), the cylindrical-shell log law (eq. 3.28), a bipolar limiting-point solution for eccentric cylinders cross-checked against the arccosh form of Table 4.1 case 7, a method-of-fundamental-solutions evaluation of the buried-pipe row shape factor cross-checked against the closed-form line-source row factor and the exact single-pipe factor (Table 4.1 case 1), the erf semi-infinite solid, and the plane-wall and infinite-cylinder eigenfunction series (full 200-term series, not truncated to one term, cross-checked against the one-term approximation). Eigenvalues from scipy.brentq on analytically guaranteed brackets. The tolerance for the mesh-dependent cases is taken from the discretization error of an independently written second-order finite-volume scheme on the same mesh, not from what makes the tool pass.","citations":["F.P. Incropera, D.P. DeWitt, T.L. Bergman, A.S. Lavine, \"Fundamentals of Heat and Mass Transfer\", 6th ed., Wiley 2007: eq. 3.28, eq. 4.19, Table 4.1 cases 1 and 7, eq. 5.39a/5.43/5.47a/5.52, eq. 5.60, Table 5.1.","H.S. Carslaw, J.C. Jaeger, \"Conduction of Heat in Solids\", 2nd ed., Oxford University Press 1959: Sec. 2.5 (semi-infinite solid), Sec. 3.4 (slab with surface convection), Sec. 7.6 (cylinder with surface convection), Sec. 4.4 (buried line sources).","M.M. Yovanovich, \"Conduction and Thermal Contact Resistances (Conductances)\", in W.M. Rohsenow, J.P. Hartnett, Y.I. Cho (eds.), Handbook of Heat Transfer, 3rd ed., McGraw-Hill 1998, Ch. 3 (conduction shape factors)."],"cases":12,"passed":12,"tolerance":"Per case, stated in each case entry. Steady Cartesian cases where the exact solution is linear are held to 0.002 K (the discrete scheme is exact there); mesh-dependent Cartesian cases to 2.5-3x the discretization error of an independent second-order FV scheme on the same mesh; curved (staircase) boundaries to a half-cell displacement of the Dirichlet surface propagated through the exact solution, plus a Richardson extrapolation in dx^1 to 0.5-1 %; transient cases to 0.25-1 % of the temperature step, which is the tool's own declared per-step time tolerance carried over the run. Never chosen from what makes the tool pass.","run_at":"2026-08-22T07:44:07.691Z","reference_provenance":"recomputed","provenance_note":"Every reference value was re-derived at run time from its cited primary source by /root/bench3/ref/gen_heat2d.py (Fourier / bipolar / erf / plane-wall / Bessel series, an MFS solve of the periodic buried-pipe row, and an independently written second-order finite-volume scheme that supplies the discretization tolerances). No value was read back out of benchmarks/heat2d.json.","artifact":"benchmarks/heat2d.json"}]},"report":{"pdf":true,"source_attribution":true},"python_export":{"supported":false,"reason":"The result is the solution of a sparse nonlinear system on a voxel mesh of up to 250 000 cells; a standalone script cannot reproduce it without re-implementing the whole solver."},"handoff":{"provides":["T"],"accepts":["T"]},"state_codec":{"permalink":true,"record":"tools.petrov.re/calculation-record/v1"},"ui":{"framework":"tools.petrov.re/ui/v1","level":3}}</script>

/* ============================================================
   HEAT2D — ядро решателя нестационарной теплопроводности
   Метод конечных объёмов, равномерная квадратная сетка,
   полностью неявная схема + PCG с предобуславливателем IC(0),
   энтальпийный метод фазового перехода, демпфированный Ньютон
   с линейным поиском, контактное термосопротивление,
   конвекция, излучение (по температуре поверхности), источники,
   поправка площади «лестничных» поверхностей.
   Чистый JS без DOM — используется и в Worker'е, и в Node-тестах.
   ============================================================ */
(function (root) {
  'use strict';

  var SIGMA = 5.670374419e-8; // Стефан–Больцман, Вт/(м²·К⁴)

  // ---------- материал ----------
  // {name,k,rho,c,eps, pc:{Ts,Tl,L,cSolid,kSolid}}
  function prepMat(m) {
    var o = {
      name: m.name || '', rho: m.rho, c: m.c, k: m.k,
      eps: (m.eps == null ? 0.9 : m.eps), pc: null
    };
    if (m.pc && m.pc.L > 0) {
      var Ts = m.pc.Ts;
      var Tl = Math.max(m.pc.Tl, Ts + 0.05);
      var L = m.pc.L * 1000; // кДж/кг -> Дж/кг
      var cs = m.pc.cSolid || m.c;
      var cl = m.c;
      var ks = (m.pc.kSolid != null ? m.pc.kSolid : m.k);
      var kl = m.k;
      var cm = 0.5 * (cs + cl);
      var Hs = o.rho * cs * Ts;
      var Hl = Hs + o.rho * L + o.rho * cm * (Tl - Ts);
      o.pc = { Ts: Ts, Tl: Tl, L: L, cs: cs, cl: cl, cm: cm, ks: ks, kl: kl, Hs: Hs, Hl: Hl };
    }
    return o;
  }

  function enth(m, T) { // Дж/м³, отсчёт от 0 °C
    var p = m.pc;
    if (!p) return m.rho * m.c * T;
    if (T <= p.Ts) return m.rho * p.cs * T;
    if (T >= p.Tl) return p.Hl + m.rho * p.cl * (T - p.Tl);
    return p.Hs + (T - p.Ts) * (m.rho * p.L / (p.Tl - p.Ts) + m.rho * p.cm);
  }
  function dEnth(m, T) { // dH/dT, Дж/(м³·К)
    var p = m.pc;
    if (!p) return m.rho * m.c;
    if (T <= p.Ts) return m.rho * p.cs;
    if (T >= p.Tl) return m.rho * p.cl;
    return m.rho * (p.L / (p.Tl - p.Ts) + p.cm);
  }
  // секущая теплоёмкость (H(Tb)-H(Ta))/(Tb-Ta); экспортируется для тестов
  function cSec(m, Ta, Tb) {
    var d = Tb - Ta;
    if (!m.pc || Math.abs(d) < 1e-9) return dEnth(m, Tb);
    return (enth(m, Tb) - enth(m, Ta)) / d;
  }
  function kOf(m, T) {
    var p = m.pc;
    if (!p) return m.k;
    if (T <= p.Ts) return p.ks;
    if (T >= p.Tl) return p.kl;
    return p.ks + (T - p.Ts) / (p.Tl - p.Ts) * (p.kl - p.ks);
  }
  function liqFrac(m, T) {
    var p = m.pc; if (!p) return 1;
    if (T <= p.Ts) return 0; if (T >= p.Tl) return 1;
    return (T - p.Ts) / (p.Tl - p.Ts);
  }

  function hRad(eps, Ts, Tinf) {
    if (!(eps > 0)) return 0;
    var a = Ts + 273.15, b = Tinf + 273.15;
    var h = eps * SIGMA * (a * a + b * b) * (a + b);
    return h > 0 ? h : 0;
  }
  /* Эквивалентный коэффициент теплоотдачи с учётом того, что излучение
     определяется температурой ПОВЕРХНОСТИ, а не центра приграничной ячейки.
     Температура поверхности Ts решается из баланса
        (Tc − Ts)/R½ = hc·(Ts − T∞) + εσ((Ts+273,15)⁴ − (T∞+273,15)⁴)
     защищённым методом Ньютона (функция монотонна, поэтому бисекция —
     надёжный запасной вариант). Простая неподвижная точка здесь расходится
     в двухтактный цикл при R½ ~ 1/h, поэтому не используется. */
  function hSurfTot(dx, k, hc, eps, Tcell, Tinf) {
    if (!(eps > 0)) return hc;
    var Rh = dx / (2 * k);
    if (!(Rh > 0)) return hc + hRad(eps, Tcell, Tinf);
    var a = Tinf + 273.15, a4 = a * a * a * a;
    function fn(Ts) {
      var b = Ts + 273.15;
      return (Tcell - Ts) / Rh - hc * (Ts - Tinf) - eps * SIGMA * (b * b * b * b - a4);
    }
    var lo = Math.min(Tinf, Tcell), hi = Math.max(Tinf, Tcell);
    var flo = fn(lo), Ts = Tcell, it, f, df;
    if (flo === 0) Ts = lo;
    else {
      for (it = 0; it < 40; it++) {
        f = fn(Ts);
        if (Math.abs(f) < 1e-10) break;
        if (f * flo > 0) lo = Ts; else hi = Ts;
        var bb = Ts + 273.15;
        df = -1 / Rh - hc - 4 * eps * SIGMA * bb * bb * bb;
        var Tn2 = Ts - f / df;
        Ts = (Tn2 > lo && Tn2 < hi) ? Tn2 : 0.5 * (lo + hi);
        if (Math.abs(hi - lo) < 1e-9) break;
      }
    }
    var dT = Ts - Tinf;
    if (Math.abs(dT) < 1e-9) return hc + hRad(eps, Tcell, Tinf);
    return ((Tcell - Ts) / Rh) / dT;   // эквивалентная плёнка: даёт точный поток
  }
  // U для «полуячейка + поверхностная плёнка», Вт/К на грань единичной глубины
  function surfU(dx, kcell, hTot, areaF) {
    if (hTot <= 0) return 0;
    return areaF * dx / (dx / (2 * kcell) + 1 / hTot);
  }

  // ---------- задача ----------
  /*
    spec = {
      nx, ny, dx,                 // сетка (dx в метрах, ячейки квадратные)
      matId:   Int32Array(n),     // -1 = пустота (среда)
      shapeId: Int32Array(n),     // для контактного сопротивления, -1 = нет
      T0:      Float32Array(n),
      fixed:   Uint8Array(n),     // 1 = ГУ 1 рода (задана температура)
      fixedT:  Float32Array(n),
      qsrc:    Float32Array(n),   // Вт/м³
      materials: [matSpec...],
      shapeRc:   [м²·К/Вт, ...],  // контактное сопротивление по фигурам
      shapeSurf: [{h,eps}|null],  // переопределение поверхностных ГУ
      Tinf, hConv, epsSurf,       // среда по умолчанию
      radiation: bool,            // учитывать излучение с поверхностей
      areaCorr: bool,             // поправка площади лестничных поверхностей (по умолчанию вкл.)
      edges: {left:{},right:{},top:{},bottom:{}}
         {type:'adiabatic'|'fixed'|'convection'|'flux', T, h, eps, q}
    }
  */
  function Problem(spec) {
    this.s = spec;
    var n = spec.nx * spec.ny;
    this.n = n;
    this.mats = spec.materials.map(prepMat);
    this.T = new Float64Array(n);
    this.Tn = new Float64Array(n);
    var i;
    for (i = 0; i < n; i++) { this.T[i] = spec.T0[i]; this.Tn[i] = spec.T0[i]; }
    this.active = new Uint8Array(n);
    this.solid = new Uint8Array(n);
    for (i = 0; i < n; i++) {
      this.solid[i] = spec.matId[i] >= 0 ? 1 : 0;
      this.active[i] = (this.solid[i] && !spec.fixed[i]) ? 1 : 0;
      if (spec.fixed[i]) { this.T[i] = spec.fixedT[i]; this.Tn[i] = spec.fixedT[i]; }
      if (!this.solid[i]) { this.T[i] = spec.Tinf; this.Tn[i] = spec.Tinf; }
    }
    this.diag = new Float64Array(n);
    this.gE = new Float64Array(n);
    this.gN = new Float64Array(n);
    this.rhs = new Float64Array(n);
    this.kc = new Float64Array(n);
    this.cap = new Float64Array(n);
    this.res = new Float64Array(n);
    this.r = new Float64Array(n); this.z = new Float64Array(n);
    this.p = new Float64Array(n); this.Ap = new Float64Array(n);
    this.x = new Float64Array(n); this.b = new Float64Array(n);
    this.Tk = new Float64Array(n); this.Tt = new Float64Array(n);
    this.xv = new Float64Array(n);
    this.icd = new Float64Array(n);
    this.tmp = new Float64Array(n);

    this.nonlinear = spec.radiation === true;
    for (i = 0; i < this.mats.length; i++) if (this.mats[i].pc) this.nonlinear = true;
    var eds = ['left', 'right', 'top', 'bottom'];
    for (i = 0; i < 4; i++) {
      var e = spec.edges[eds[i]];
      if (e && e.type === 'convection' && e.eps > 0) this.nonlinear = true;
    }
    this.nActive = 0;
    for (i = 0; i < n; i++) if (this.active[i]) this.nActive++;
    this.actIdx = new Int32Array(this.nActive);
    var k = 0;
    for (i = 0; i < n; i++) if (this.active[i]) this.actIdx[k++] = i;
    this.cgFail = 0; this.newtonFail = 0;
    this.buildAreaCorr();
  }

  /* Поправка площади «лестничной» поверхности — отдельно для каждой грани.
     Прямая с нормалью n изображается ступеньками суммарной длины L·(|nx|+|ny|):
     для круга это ровно 4/π ≈ 1,27 независимо от измельчения сетки.
     Наклон восстанавливается по длине «прогона» r — числу подряд идущих ячеек
     с открытой гранью того же направления: r = |nx|/|ny|, откуда истинная длина
     на одну грань равна √(r²+1)/(r+1) от лестничной. Плоская стенка (r → ∞)
     и прямой угол получают ровно 1 — в отличие от оценки нормали по 3×3,
     которая не отличает угол от диагонали.

     ВАЖНО: период лестницы — это r граней направления d ПЛЮС одна «подступёнка»
     перпендикулярного направления, и множитель √(r²+1)/(r+1) должен попасть на
     все r+1 граней периода: только тогда сумма даёт ровно √(r²+1), т.е. истинную
     длину. Подступёнка сама по себе всегда имеет прогон 1 и, если оценивать её
     отдельно, получает √2/2 вместо √(r²+1)/(r+1) — площадь наклонной поверхности
     при этом систематически занижается (для круга на 1,2…1,8 %, независимо от
     измельчения сетки). Поэтому прогон считается по грани, а множитель
     назначается по МАКСИМАЛЬНОМУ прогону среди открытых граней ячейки: для
     подступёнки это и есть прогон её собственного периода. Плоская стенка,
     прямой угол и диагональ 45° при этом остаются точными. */
  Problem.prototype.buildAreaCorr = function () {
    var s = this.s, nx = s.nx, ny = s.ny, n = this.n, sol = this.solid;
    var f = new Float32Array(4 * n);
    for (var q = 0; q < 4 * n; q++) f[q] = 1;
    this.areaF4 = f;
    if (s.areaCorr === false) return;
    var runs = new Int16Array(4 * n);   // 0 = поправка не нужна, иначе длина прогона
    var CAP = 24;
    // d: 0 = -x, 1 = +x, 2 = -y, 3 = +y
    var dxs = [-1, 1, 0, 0], dys = [0, 0, -1, 1];
    function solidAt(x, y) { return (x < 0 || x >= nx || y < 0 || y >= ny) ? 0 : sol[y * nx + x]; }
    function openFace(x, y, d) {          // грань наружу открыта (сосед — пустота)
      if (!solidAt(x, y)) return false;
      var xr = x + dxs[d], yr = y + dys[d];
      if (xr < 0 || xr >= nx || yr < 0 || yr >= ny) return false;  // внешняя граница области
      return !sol[yr * nx + xr];
    }
    for (var y = 0; y < ny; y++) {
      for (var x = 0; x < nx; x++) {
        var i = y * nx + x;
        if (!sol[i]) continue;
        for (var d = 0; d < 4; d++) {
          if (!openFace(x, y, d)) continue;
          var px = (d < 2) ? 0 : 1, py = (d < 2) ? 1 : 0;   // движение вдоль грани
          var ix = -dxs[d], iy = -dys[d];                   // «внутрь тела»
          var r = 1, kp = 0, km = 0, k, cut = false;
          for (k = 1; k <= CAP; k++) { if (openFace(x + px * k, y + py * k, d)) { r++; kp = k; } else break; }
          if (kp === CAP) cut = true;
          for (k = 1; k <= CAP; k++) { if (openFace(x - px * k, y - py * k, d)) { r++; km = k; } else break; }
          if (km === CAP) cut = true;
          if (cut) continue;   // очень длинный прогон — это плоская стенка
          // Конец «прогона»: ступенька лестницы или торец плоской стенки?
          // Торец — если за концом нет тела ни на самой линии, ни глубже внутрь.
          var ends = 0, ex, ey;   // 0 = торец плоской стенки, иначе ступенька
          ex = x + px * (kp + 1); ey = y + py * (kp + 1);
          if (solidAt(ex, ey) || solidAt(ex + ix, ey + iy)) ends++;
          ex = x - px * (km + 1); ey = y - py * (km + 1);
          if (solidAt(ex, ey) || solidAt(ex + ix, ey + iy)) ends++;
          if (ends === 0) continue;                         // плоская стенка — поправка не нужна
          runs[4 * i + d] = r;
        }
      }
    }
    // второй проход: множитель периода — по самому длинному прогону в ячейке
    for (var ii = 0; ii < n; ii++) {
      if (!sol[ii]) continue;
      var rmax = 0, dd;
      for (dd = 0; dd < 4; dd++) if (runs[4 * ii + dd] > rmax) rmax = runs[4 * ii + dd];
      if (!rmax) continue;
      var stc = Math.sqrt(rmax * rmax + 1) / (rmax + 1);
      for (dd = 0; dd < 4; dd++) if (runs[4 * ii + dd]) f[4 * ii + dd] = stc;
    }
  };

  Problem.prototype.surfHE = function (sid) { // -> [h, eps]
    var s = this.s;
    var ov = (sid >= 0 && s.shapeSurf && s.shapeSurf[sid]) ? s.shapeSurf[sid] : null;
    this._h = (ov && ov.h != null) ? ov.h : s.hConv;
    this._e = (ov && ov.eps != null) ? ov.eps : s.epsSurf;
  };

  /* Сборка СЛАУ для приближения Tk. dt<=0 => стационар.
     Матрица Якоби использует секущую теплоёмкость: для кусочно-линейной
     монотонной H(T) это даёт устойчивую (немонотонно не «прыгающую») итерацию. */
  Problem.prototype.assemble = function (Tk, dt) {
    var s = this.s, nx = s.nx, ny = s.ny, dx = s.dx, n = this.n;
    var diag = this.diag, gE = this.gE, gN = this.gN, rhs = this.rhs, kc = this.kc;
    var mats = this.mats, matId = s.matId, shapeId = s.shapeId, areaF = this.areaF4;
    var V = dx * dx;
    var rad = s.radiation === true;
    diag.fill(0); gE.fill(0); gN.fill(0); rhs.fill(0);

    var i, x, y, m;
    for (i = 0; i < n; i++) {
      m = matId[i];
      kc[i] = m >= 0 ? kOf(mats[m], Tk[i]) : 0;
    }
    // внутренние грани
    for (y = 0; y < ny; y++) {
      for (x = 0; x < nx; x++) {
        i = y * nx + x;
        if (!this.solid[i]) continue;
        if (x < nx - 1) {
          var j = i + 1;
          if (this.solid[j]) {
            var Rc = 0;
            if (shapeId[i] !== shapeId[j]) {
              Rc = Math.max(shapeId[i] >= 0 ? (s.shapeRc[shapeId[i]] || 0) : 0,
                shapeId[j] >= 0 ? (s.shapeRc[shapeId[j]] || 0) : 0);
            }
            this.addFace(i, j, dx / (dx / (2 * kc[i]) + dx / (2 * kc[j]) + Rc), gE);
          }
        }
        if (y < ny - 1) {
          var jn = i + nx;
          if (this.solid[jn]) {
            var Rc2 = 0;
            if (shapeId[i] !== shapeId[jn]) {
              Rc2 = Math.max(shapeId[i] >= 0 ? (s.shapeRc[shapeId[i]] || 0) : 0,
                shapeId[jn] >= 0 ? (s.shapeRc[shapeId[jn]] || 0) : 0);
            }
            this.addFace(i, jn, dx / (dx / (2 * kc[i]) + dx / (2 * kc[jn]) + Rc2), gN);
          }
        }
      }
    }
    // поверхностные грани: твёрдое↔пустота и внешние границы области
    var eds = [s.edges.left, s.edges.right, s.edges.bottom, s.edges.top];
    for (y = 0; y < ny; y++) {
      for (x = 0; x < nx; x++) {
        i = y * nx + x;
        if (!this.solid[i]) continue;
        for (var d = 0; d < 4; d++) {
          var xr = x + (d === 0 ? -1 : d === 1 ? 1 : 0);
          var yr = y + (d === 2 ? -1 : d === 3 ? 1 : 0);
          if (xr < 0 || xr >= nx || yr < 0 || yr >= ny) {
            var e = eds[d];
            if (!e || e.type === 'adiabatic') continue;
            if (e.type === 'flux') { rhs[i] += (e.q || 0) * dx; continue; }
            if (e.type === 'fixed') {
              var Uf = 2 * kc[i];
              diag[i] += Uf; rhs[i] += Uf * e.T;
              continue;
            }
            if (e.type === 'convection') {
              // внешняя граница области плоская — поправка площади не нужна
              var hh = rad ? hSurfTot(dx, kc[i], e.h || 0, e.eps || 0, Tk[i], e.T) : (e.h || 0);
              var U = surfU(dx, kc[i], hh, 1);
              if (U > 0) { diag[i] += U; rhs[i] += U * e.T; }
              continue;
            }
          } else if (!this.solid[yr * nx + xr]) {
            this.surfHE(shapeId[i]);
            var ht = rad ? hSurfTot(dx, kc[i], this._h, this._e, Tk[i], s.Tinf) : this._h;
            var U2 = surfU(dx, kc[i], ht, areaF[4 * i + d]);
            if (U2 > 0) { diag[i] += U2; rhs[i] += U2 * s.Tinf; }
          }
        }
      }
    }
    // временной член + объёмный источник
    var Tn = this.Tn;
    for (i = 0; i < n; i++) {
      if (!this.solid[i]) continue;
      rhs[i] += s.qsrc[i] * V;
      if (dt > 0) {
        m = mats[matId[i]];
        var cApp = this.useSecant ? cSec(m, Tn[i], Tk[i]) : dEnth(m, Tk[i]);
        if (!(cApp > 0)) cApp = m.rho * m.c;
        this.cap[i] = cApp;
        var CV = cApp * V / dt;
        diag[i] += CV;
        rhs[i] += CV * Tn[i];
      }
    }
  };

  Problem.prototype.addFace = function (i, j, G, garr) {
    var a = this.active[i], b = this.active[j];
    this.diag[i] += G; this.diag[j] += G;
    if (a && b) garr[i] = G;
    else if (a && !b) this.rhs[i] += G * this.T[j];
    else if (!a && b) this.rhs[j] += G * this.T[i];
  };

  Problem.prototype.matvec = function (v, out) {
    var nx = this.s.nx, diag = this.diag, gE = this.gE, gN = this.gN;
    var idx = this.actIdx, m = idx.length, i, s, g;
    for (var a = 0; a < m; a++) {
      i = idx[a];
      s = diag[i] * v[i];
      g = gE[i]; if (g) s -= g * v[i + 1];
      g = gE[i - 1]; if (g) s -= g * v[i - 1];
      g = gN[i]; if (g) s -= g * v[i + nx];
      if (i >= nx) { g = gN[i - nx]; if (g) s -= g * v[i - nx]; }
      out[i] = s;
    }
  };

  /* Невязка нелинейной системы для приближения Tk (собирает и матрицу).
     R = A(Tk)·Tk − b(Tk) + [H(Tk) − H(Tn) − cap·(Tk − Tn)]·V/dt,
     что тождественно равно энтальпийному балансу ячейки. */
  Problem.prototype.residual = function (Tk, dt) {
    this.assemble(Tk, dt);
    var idx = this.actIdx, m = idx.length, i, a;
    var V = this.s.dx * this.s.dx, mats = this.mats, matId = this.s.matId, Tn = this.Tn;
    var xv = this.xv;
    for (a = 0; a < m; a++) { i = idx[a]; xv[i] = Tk[i]; }
    this.matvec(xv, this.Ap);
    var s2 = 0;
    for (a = 0; a < m; a++) {
      i = idx[a];
      var R = this.Ap[i] - this.rhs[i];
      if (dt > 0) {
        var mm = mats[matId[i]];
        R += (enth(mm, Tk[i]) - enth(mm, Tn[i]) - this.cap[i] * (Tk[i] - Tn[i])) * V / dt;
      }
      this.res[i] = R; s2 += R * R;
    }
    return Math.sqrt(s2);
  };

  // Неполное разложение Холецкого IC(0) для 5-точечного шаблона
  Problem.prototype.factor = function () {
    var nx = this.s.nx, diag = this.diag, gE = this.gE, gN = this.gN, d = this.icd;
    var idx = this.actIdx, m = idx.length, i, v, g;
    for (var a = 0; a < m; a++) {
      i = idx[a];
      v = diag[i];
      if (!(v > 0)) { d[i] = 1; continue; }   // вырожденная строка — не делим на ноль
      g = gE[i - 1]; if (g) v -= g * g / d[i - 1];
      if (i >= nx) { g = gN[i - nx]; if (g) v -= g * g / d[i - nx]; }
      d[i] = (v > 0.05 * diag[i]) ? v : diag[i];
    }
  };
  Problem.prototype.precond = function (r, z) {
    var nx = this.s.nx, gE = this.gE, gN = this.gN, d = this.icd, y = this.tmp;
    var idx = this.actIdx, m = idx.length, i, s, g, a;
    for (a = 0; a < m; a++) {
      i = idx[a]; s = r[i];
      g = gE[i - 1]; if (g) s += g * y[i - 1];
      if (i >= nx) { g = gN[i - nx]; if (g) s += g * y[i - nx]; }
      y[i] = s / d[i];
    }
    for (a = m - 1; a >= 0; a--) {
      i = idx[a]; s = y[i];
      g = gE[i]; if (g) s += g * z[i + 1] / d[i];
      g = gN[i]; if (g) s += g * z[i + nx] / d[i];
      z[i] = s;
    }
  };

  // PCG с IC(0). Возвращает число итераций; this.cgOk — признак сходимости.
  Problem.prototype.cg = function (x, b, tol, maxIt, absLim) {
    var idx = this.actIdx, m = idx.length;
    var r = this.r, z = this.z, p = this.p, Ap = this.Ap, i, a;
    this.factor();
    this.matvec(x, Ap);
    var bn2 = 0, rn2 = 0;
    for (a = 0; a < m; a++) { i = idx[a]; r[i] = b[i] - Ap[i]; bn2 += b[i] * b[i]; rn2 += r[i] * r[i]; }
    if (bn2 === 0) bn2 = 1;
    var lim = tol * tol * bn2;
    if (absLim != null && absLim > lim) lim = absLim;
    this.cgOk = true;
    if (rn2 <= lim) return 0;
    this.precond(r, z);
    var rz = 0;
    for (a = 0; a < m; a++) { i = idx[a]; p[i] = z[i]; rz += r[i] * z[i]; }
    var it = 0;
    for (it = 0; it < maxIt; it++) {
      this.matvec(p, Ap);
      var pAp = 0;
      for (a = 0; a < m; a++) { i = idx[a]; pAp += p[i] * Ap[i]; }
      if (!(pAp > 0)) { this.cgOk = false; break; }
      var alpha = rz / pAp;
      rn2 = 0;
      for (a = 0; a < m; a++) { i = idx[a]; x[i] += alpha * p[i]; r[i] -= alpha * Ap[i]; rn2 += r[i] * r[i]; }
      if (rn2 <= lim) { it++; return it; }
      this.precond(r, z);
      var rz2 = 0;
      for (a = 0; a < m; a++) { i = idx[a]; rz2 += r[i] * z[i]; }
      var beta = rz2 / rz; rz = rz2;
      for (a = 0; a < m; a++) { i = idx[a]; p[i] = z[i] + beta * p[i]; }
    }
    if (rn2 > lim) { this.cgOk = false; this.cgFail++; }
    return it;
  };

  /* Один неявный шаг по времени (dt<=0 => стационар).
     Демпфированный Ньютон с линейным поиском по норме невязки: шаг вдоль
     направления δ уменьшается вдвое, пока ‖R‖ не начнёт убывать. Это снимает
     зацикливание, характерное для узкой зоны фазового перехода. */

  function t7() { var r = run7(); return { err: r.errE, nk: 'nt.7', p: [] }; }
  function t7b() { var r = run7(); return { err: Math.abs(0.5 * (r.mn + r.mx) - r.Teq) / r.Teq, nk: 'nt.8', p: [r.mn.toFixed(3), r.mx.toFixed(3), r.Teq.toFixed(3)] }; }

  function t8() {
    var nx = 60, ny = 3, L = 0.03, dx = L / nx, k = 20, Th = 500, Tinf = 20, eps = 0.85;
    var sp = mkSpec({
      nx: nx, ny: ny, dx: dx, T0: 300, radiation: true, materials: [{ k: k, rho: 8000, c: 500 }],
      edges: { left: { type: 'fixed', T: Th }, right: { type: 'convection', T: Tinf, h: 0, eps: eps } }
    });

    var q_num = k * (F[nx] - F[nx + nx - 1]) / ((nx - 1) * dx);
    var sig = 5.670374419e-8, lo = Tinf, hi = Th, Ts;
    for (var i = 0; i < 200; i++) {
      Ts = 0.5 * (lo + hi);
      var f = eps * sig * (Math.pow(Ts + 273.15, 4) - Math.pow(Tinf + 273.15, 4)) - (Th - Ts) / (L / k);
      if (f > 0) hi = Ts; else lo = Ts;

    var q_exp = eps * sig * (Math.pow(Ts + 273.15, 4) - Math.pow(Tinf + 273.15, 4));

  }

  function t9() {
    var nx = 80, ny = 80, W = 0.1, dx = W / nx;
    var sp = mkSpec({
      nx: nx, ny: ny, dx: dx, T0: 0, materials: [{ k: 1, rho: 1000, c: 1000 }],

        bottom: { type: 'fixed', T: 0 }, top: { type: 'fixed', T: 100 }

      for (var n = 1; n < 200; n += 2) s += (4 / (n * Math.PI)) * Math.sin(n * Math.PI * x / W) * Math.sinh(n * Math.PI * y / W) / Math.sinh(n * Math.PI);

  }

  // Криволинейная поверхность: суммарный конвективный поток с диска.
  function t10() {
    var nx = 120, W = 0.03, dx = W / nx, R = 0.01, h = 20, T0 = 100;
    var sp = mkSpec({
      nx: nx, ny: nx, dx: dx, T0: T0, hConv: h, Tinf: 0,
      materials: [{ k: 400, rho: 8900, c: 385 }],
      init: function (sp, x, y, i) {
        var cx = (x + 0.5) * dx - W / 2, cy = (y + 0.5) * dx - W / 2;
        sp.matId[i] = (cx * cx + cy * cy <= R * R) ? 0 : -1;
      }
    });
    var F = new S.Problem(sp).fluxes();
    var exact = -h * 2 * Math.PI * R * T0;
    var eDisk = Math.abs(F.surface / exact - 1);
    // прямоугольник: «лестница» изображает его точно, поправка не должна ничего портить
    var k = 20, m = k + 6, dxr = 0.001;
    var sq = mkSpec({
      nx: m, ny: m, dx: dxr, T0: T0, hConv: h, Tinf: 0,
      materials: [{ k: 400, rho: 8900, c: 385 }],
      init: function (sp, x, y, i) { sp.matId[i] = (x >= 3 && x < 3 + k && y >= 3 && y < 3 + k) ? 0 : -1; }
    });
    var Fs = new S.Problem(sq).fluxes();
    var eSq = Math.abs(Fs.surface / (-h * 4 * k * dxr * T0) - 1);
    return { err: Math.max(eDisk, eSq), nk: 'nt.11', p: [(eDisk * 100).toFixed(1), (eSq * 100).toFixed(2)] };
  }

  // Баланс: полоса с участком заданной температуры и конвекцией по трём рёбрам.
  function t11() {
    var nx = 40, ny = 10, dx = 0.001;
    var sp = mkSpec({
      nx: nx, ny: ny, dx: dx, T0: 20, hConv: 50, Tinf: 0,
      materials: [{ k: 50, rho: 7800, c: 460 }],
      edges: {
        right: { type: 'convection', T: 0, h: 50 },
        top: { type: 'convection', T: 0, h: 50 },
        bottom: { type: 'convection', T: 0, h: 50 }
      },
      init: function (sp, x, y, i) { if (x < 4) { sp.fixed[i] = 1; sp.fixedT[i] = 100; } }
    });
    var r = S.steady(sp), F = r.problem.fluxes();
    return { err: Math.abs(F.total) / Math.abs(F.fixedIn), nk: 'nt.12', p: [F.fixedIn.toFixed(1)] };
  }

  // Узкая зона плавления: решение не должно выходить за граничные значения.
  function t12() {
    var nx = 100, dx = 0.0005, Tw = -30, T0 = 5;
    var sp = mkSpec({
      nx: nx, ny: 1, dx: dx, T0: T0,
      materials: [{ k: 0.6, rho: 1000, c: 4200, pc: { Ts: -0.05, Tl: 0, L: 334, cSolid: 2100, kSolid: 2.2 } }],
      edges: { left: { type: 'fixed', T: Tw } }

  }

  // по температуре поверхности, а не центра приграничной ячейки.
  function t13() {
    var nx = 30, ny = 3, L = 0.03, dx = L / nx, k = 0.2, Th = 1200, Tinf = 20, eps = 0.98;
    var sp = mkSpec({
      nx: nx, ny: ny, dx: dx, T0: 600, radiation: true, materials: [{ k: k, rho: 8000, c: 500 }],
      edges: { left: { type: 'fixed', T: Th }, right: { type: 'convection', T: Tinf, h: 0, eps: eps } }
    });
    var F = S.steady(sp).frames[0];
    var q_num = k * (F[nx] - F[nx + nx - 1]) / ((nx - 1) * dx);
    var sig = 5.670374419e-8, lo = Tinf, hi = Th, Ts;
    for (var i = 0; i < 200; i++) {
      Ts = 0.5 * (lo + hi);
      var f = eps * sig * (Math.pow(Ts + 273.15, 4) - Math.pow(Tinf + 273.15, 4)) - (Th - Ts) / (L / k);
      if (f > 0) hi = Ts; else lo = Ts;
    }
    Ts = 0.5 * (lo + hi);
    var q_exp = eps * sig * (Math.pow(Ts + 273.15, 4) - Math.pow(Tinf + 273.15, 4));
    return { err: Math.abs(q_num - q_exp) / q_exp, nk: 'nt.14', p: [Ts.toFixed(0)] };
  }

  function runSelfTest(cb) {
    var out = [];
    for (var i = 0; i < TESTS.length; i++) {
      var t = TESTS[i], r;
      try { r = t.fn(); } catch (e) { r = { err: NaN, nk: 'u.none', p: [e.message] }; }

      var r = self.HeatSolver.run(d.spec, {
        tEnd: d.tEnd, nFrames: d.nFrames, tolErr: d.tolErr,
        onProgress: function (p, st) { self.postMessage({ type: 'progress', job: job, p: p, steps: st }); }
      });
      var bufs = r.frames.map(function (f) { return f.buffer; });
      self.postMessage({ type: 'done', job: job, frames: r.frames, times: r.times, steps: r.steps,

      var s = self.HeatSolver.steady(d.spec, {});
      self.postMessage({ type: 'done', job: job, frames: s.frames, times: [Infinity], steps: 1,
        notConverged: s.notConverged, cgFail: s.cgFail, flux: s.problem.fluxes() },
        s.frames.map(function (f) { return f.buffer; }));
    } else if (d.cmd === 'selftest') {
      var out = self.HeatSelfTest.runSelfTest(function (p, r) { self.postMessage({ type: 'progress', job: job, p: p }); });

    }
  } catch (err) {
    self.postMessage({ type: 'error', job: job, msg: err && err.message ? err.message : String(err) });
  }
};

    "help.title": "How to use it",
    "help.intro": "The tool solves the <b>two-dimensional transient heat conduction equation</b> in the cross-section of an infinitely long prism: everything is uniform along the third axis and no heat flows along it.",
    "help.step": "Step",
    "help.what": "What to do",
    "help.s1": "1. Domain",
    "help.s1t": "Set the size of the cross-section (the “Domain” tab). The background is either void (ambient) or a solid material.",
    "help.s2": "2. Geometry",
    "help.s2t": "Draw rectangles, ellipses, polygons and lines; refine the dimensions numerically in the right-hand panel. The order in the list is the stacking order — later shapes cover earlier ones. “Subtract” cuts a void (a hole).",
    "help.s3": "3. Materials",
    "help.s3t": "Each shape gets its own material. For foods and paraffin the latent heat of the phase change is taken into account.",
    "help.s4": "4. Boundary conditions",
    "help.s4t": "Four sides of the domain: adiabatic (= symmetry), fixed T, convection with radiation, or prescribed flux. Inside the domain any shape can be held at a fixed temperature — including in “outline only” mode, which turns it into a line along the contour.",
    "help.s5": "5. Ambient",
    "help.s5t": "Boundaries between shapes and void lose heat by Newton cooling (h) and by radiation (ε) when radiation is enabled.",
    "help.s6": "6. Time",
    "help.s6t": "Set the duration and the number of frames, then press “Compute”. The slider at the bottom scrubs through time; “Steady state” solves the settled state directly.",
    "help.under": "Under the hood",
    "help.underT": "Finite volumes on a uniform mesh, fully implicit time stepping (stable at any step size), the linear system solved by conjugate gradients preconditioned with an incomplete Cholesky factorisation IC(0). Conductivity at material interfaces is averaged harmonically, which gives the exact flux across a joint. The phase change uses the enthalpy method and conserves energy exactly; the nonlinearity is handled by Newton iterations with a line search on the residual norm (without it the iterations cycle in a narrow melting range). Radiation is linearised as h_rad = εσ(T²+T∞²)(T+T∞), evaluated at the <i>surface</i> temperature rather than the centre of the boundary cell. The area of slanted and curved surfaces is corrected from the length of the staircase run: without this correction the staircase of cells would overestimate the area of a circle by exactly 4/π = 1.27, an error that does not decrease with mesh refinement. Rectangles and 45° facets come out exact. The time step is chosen automatically from a local error estimate and is reduced when the iterations fail to converge.",
    "help.tests": "The “Self-test” button runs the solver against fourteen problems with exact solutions: the erf profile, a multilayer wall, the jump at a contact resistance, a Fourier series, a volumetric source, the Stefan problem, energy conservation, the equilibrium temperature, radiation (including at low conductivity), a 2D series, curved-surface area, closure of the heat balance, and the maximum principle in a narrow melting range.",
    "help.limits": "Limitations",
    "help.l1": "<b>Conduction only.</b> Convection inside liquids and cavities is not modelled. Air drawn as a material is treated as still, which underestimates heat transfer across gaps thicker than about 10 mm.",
    "help.l2": "<b>Voids as gaps.</b> If a void is left between two bodies, each surface exchanges heat with the ambient T∞ rather than with the neighbouring body: a thin slot behaves like a ventilated channel, not a thermal resistance. For thin interlayers draw a material (air, paste) instead of a void.",
    "help.l3": "<b>Properties are constant</b> (apart from the phase change): k(T) and c(T) dependencies are not included.",
    "help.l4": "<b>Radiation</b> is from a surface to the ambient only — no exchange between surfaces and no view factors.",
    "help.l5": "<b>Mass transfer</b> (drying, moisture migration, heat carried by vapour) is not modelled, which is why baking and drying heat up more slowly here than in reality.",
    "help.l6": "<b>Geometric accuracy.</b> Bodies are represented by mesh cells. Polygons with axis-aligned and 45° facets are exact after the area correction; for a circle the residual error in heat transfer is about 1.5 %. The domain height is rounded to a whole number of cells.",

    "help.title": "Zo werkt het",
    "help.intro": "Het programma lost de <b>tweedimensionale niet-stationaire warmtegeleidingsvergelijking</b> op in de doorsnede van een oneindig lang prisma: alles is uniform langs de derde as en in die richting stroomt geen warmte.",
    "help.step": "Stap",
    "help.what": "Wat te doen",
    "help.s1": "1. Gebied",
    "help.s1t": "Stel de afmetingen van de doorsnede in (tabblad “Gebied”). De achtergrond is ofwel leegte (omgeving) ofwel een vast materiaal.",
    "help.s2": "2. Geometrie",
    "help.s2t": "Teken rechthoeken, ellipsen, veelhoeken en lijnen; verfijn de maten numeriek in het rechterpaneel. De volgorde in de lijst is de stapelvolgorde — latere vormen bedekken eerdere. “Aftrekken” snijdt een leegte (gat) uit.",
    "help.s3": "3. Materialen",
    "help.s3t": "Elke vorm krijgt zijn eigen materiaal. Bij voedingsmiddelen en paraffine wordt de latente warmte van de faseovergang meegerekend.",
    "help.s4": "4. Randvoorwaarden",
    "help.s4t": "Vier zijden van het gebied: adiabatisch (= symmetrie), vaste T, convectie met straling, of een opgelegde warmtestroom. Binnen het gebied kan elke vorm op een vaste temperatuur worden gehouden — ook in de modus “alleen contour”, waarmee de vorm een lijn langs de contour wordt.",
    "help.s5": "5. Omgeving",
    "help.s5t": "Grenzen tussen vormen en leegte staan warmte af volgens de wet van Newton (h) en, wanneer straling is ingeschakeld, door straling (ε).",
    "help.s6": "6. Tijd",
    "help.s6t": "Stel de duur en het aantal frames in en druk op “Berekenen”. Met de schuifregelaar onderaan loopt u door de tijd; “Stationair” berekent de uiteindelijke toestand rechtstreeks.",
    "help.under": "Onder de motorkap",
    "help.underT": "Eindige volumes op een uniform rooster, volledig impliciete tijdintegratie (stabiel bij elke stapgrootte); het lineaire stelsel wordt opgelost met geconjugeerde gradiënten, gepreconditioneerd met een onvolledige Cholesky-factorisatie IC(0). De warmtegeleidingscoëfficiënt op materiaalovergangen wordt harmonisch gemiddeld, wat de exacte warmtestroom door een raakvlak oplevert. De faseovergang wordt met de enthalpiemethode berekend en behoudt de energie exact; de niet-lineariteit wordt afgehandeld met Newton-iteraties met een lijnzoekmethode op de norm van het residu (zonder deze blijven de iteraties in een smal smelttraject rondcirkelen). Straling wordt gelineariseerd als h_rad = εσ(T²+T∞²)(T+T∞) en wordt bepaald bij de temperatuur van het <i>oppervlak</i> in plaats van in het midden van de randcel. Het oppervlak van schuine en gekromde vlakken wordt gecorrigeerd aan de hand van de lengte van de trapvormige begrenzing: zonder die correctie zou de trapvormige celrand het oppervlak van een cirkel precies met een factor 4/π = 1,27 overschatten, een fout die bij roosterverfijning niet kleiner wordt. Rechthoeken en facetten onder 45° komen exact uit. De tijdstap wordt automatisch gekozen op basis van een lokale foutschatting en wordt verkleind zodra de iteraties niet convergeren.",
    "help.tests": "De knop “Zelftest” toetst de solver aan veertien opgaven met een exacte oplossing: het erf-profiel, een meerlaagse wand, de sprong over een contactweerstand, een Fourier-reeks, een volumetrische bron, het Stefan-probleem, energiebehoud, de evenwichtstemperatuur, straling (ook bij lage warmtegeleiding), een 2D-reeks, het oppervlak van gekromde vlakken, het sluiten van de warmtebalans en het maximumprincipe in een smal smelttraject.",
    "help.limits": "Beperkingen",
    "help.l1": "<b>Alleen geleiding.</b> Convectie binnen vloeistoffen en holtes wordt niet gemodelleerd. Lucht die als materiaal is getekend, geldt als stilstaand, waardoor de warmteoverdracht over spleten dikker dan ongeveer 10 mm wordt onderschat.",
    "help.l2": "<b>Leegtes als spleten.</b> Blijft er een leegte tussen twee lichamen, dan wisselt elk oppervlak warmte uit met de omgevings-T∞ en niet met het naburige lichaam: een dunne spleet gedraagt zich als een geventileerd kanaal, niet als een warmteweerstand. Teken voor dunne tussenlagen liever een materiaal (lucht, pasta) in plaats van een leegte.",
    "help.l3": "<b>De eigenschappen zijn constant</b> (afgezien van de faseovergang): afhankelijkheden k(T) en c(T) zijn niet meegenomen.",
    "help.l4": "<b>Straling</b> gaat uitsluitend van een oppervlak naar de omgeving — geen uitwisseling tussen oppervlakken onderling en geen configuratiefactoren.",
    "help.l5": "<b>Stofoverdracht</b> (drogen, vochttransport, warmte die met damp wordt meegevoerd) wordt niet gemodelleerd; daarom warmen bakken en drogen hier langzamer op dan in werkelijkheid.",
    "help.l6": "<b>Geometrische nauwkeurigheid.</b> Lichamen worden door roostercellen weergegeven. Veelhoeken met facetten evenwijdig aan de assen en onder 45° zijn na de oppervlaktecorrectie exact; voor een cirkel bedraagt de resterende fout in de warmteoverdracht ongeveer 1,5 %. De hoogte van het gebied wordt afgerond op een geheel aantal cellen.",

    "help.title": "Mode d’emploi",
    "help.intro": "L’outil résout l’<b>équation bidimensionnelle de la conduction thermique en régime transitoire</b> dans la section d’un prisme infiniment long : tout est uniforme selon le troisième axe et aucune chaleur ne circule le long de celui-ci.",
    "help.step": "Étape",
    "help.what": "À faire",
    "help.s1": "1. Domaine",
    "help.s1t": "Définissez les dimensions de la section (onglet « Domaine »). Le fond est soit un vide (ambiance), soit un matériau solide.",
    "help.s2": "2. Géométrie",
    "help.s2t": "Dessinez des rectangles, des ellipses, des polygones et des lignes ; ajustez les cotes numériquement dans le panneau de droite. L’ordre de la liste est l’ordre d’empilement — les formes les plus récentes recouvrent les précédentes. « Soustraire » perce un vide (un trou).",
    "help.s3": "3. Matériaux",
    "help.s3t": "Chaque forme reçoit son propre matériau. Pour les aliments et la paraffine, la chaleur latente du changement de phase est prise en compte.",
    "help.s4": "4. Conditions aux limites",
    "help.s4t": "Les quatre côtés du domaine : adiabatique (= symétrie), T imposée, convection avec rayonnement, ou flux imposé. À l’intérieur du domaine, toute forme peut être maintenue à température imposée — y compris en mode « contour seul », qui la réduit à une ligne le long du contour.",
    "help.s5": "5. Ambiance",
    "help.s5t": "Les frontières entre les formes et le vide perdent de la chaleur par refroidissement de Newton (h) et par rayonnement (ε) lorsque celui-ci est activé.",
    "help.s6": "6. Temps",
    "help.s6t": "Réglez la durée et le nombre d’images, puis appuyez sur « Calculer ». Le curseur du bas parcourt le temps ; « Régime permanent » résout directement l’état établi.",
    "help.under": "Sous le capot",
    "help.underT": "Volumes finis sur un maillage régulier, marche en temps totalement implicite (stable quel que soit le pas), système linéaire résolu par gradients conjugués préconditionnés par une factorisation de Cholesky incomplète IC(0). La conductivité aux interfaces entre matériaux est moyennée harmoniquement, ce qui donne le flux exact à travers une jonction. Le changement de phase emploie la méthode enthalpique et conserve exactement l’énergie ; la non-linéarité est traitée par itérations de Newton avec recherche linéaire sur la norme du résidu (sans elle, les itérations bouclent sur une plage de fusion étroite). Le rayonnement est linéarisé sous la forme h_rad = εσ(T²+T∞²)(T+T∞), évaluée à la température de <i>surface</i> et non au centre de la maille de bord. L’aire des surfaces obliques et courbes est corrigée à partir de la longueur du tracé en escalier : sans cette correction, l’escalier de mailles surestimerait l’aire d’un cercle d’un facteur exactement 4/π = 1,27, une erreur qui ne diminue pas avec le raffinement du maillage. Les rectangles et les facettes à 45° sont exacts. Le pas de temps est choisi automatiquement à partir d’une estimation de l’erreur locale et il est réduit lorsque les itérations ne convergent pas.",
    "help.tests": "Le bouton « Autotest » confronte le solveur à quatorze problèmes à solution exacte : le profil en erf, une paroi multicouche, le saut sur une résistance de contact, une série de Fourier, une source volumique, le problème de Stefan, la conservation de l’énergie, la température d’équilibre, le rayonnement (y compris à faible conductivité), une série 2D, l’aire d’une surface courbe, la fermeture du bilan thermique et le principe du maximum sur une plage de fusion étroite.",
    "help.limits": "Limites",
    "help.l1": "<b>Conduction seule.</b> La convection à l’intérieur des liquides et des cavités n’est pas modélisée. L’air dessiné comme matériau est considéré comme immobile, ce qui sous-estime le transfert de chaleur à travers les lames d’air de plus de 10 mm environ.",
    "help.l2": "<b>Les vides comme lames d’air.</b> Si un vide subsiste entre deux corps, chaque surface échange avec la température ambiante T∞ et non avec le corps voisin : une fente mince se comporte comme un canal ventilé, et non comme une résistance thermique. Pour les interlames minces, dessinez un matériau (air, pâte) plutôt qu’un vide.",
    "help.l3": "<b>Les propriétés sont constantes</b> (hormis le changement de phase) : les dépendances k(T) et c(T) ne sont pas prises en compte.",
    "help.l4": "<b>Le rayonnement</b> se fait uniquement d’une surface vers l’ambiance — aucun échange entre surfaces ni facteurs de forme.",
    "help.l5": "<b>Le transfert de masse</b> (séchage, migration d’humidité, chaleur emportée par la vapeur) n’est pas modélisé : c’est pourquoi la cuisson et le séchage s’échauffent ici plus lentement qu’en réalité.",
    "help.l6": "<b>Précision géométrique.</b> Les corps sont représentés par des mailles. Les polygones à facettes alignées sur les axes et à 45° sont exacts après la correction d’aire ; pour un cercle, l’erreur résiduelle sur le transfert de chaleur est d’environ 1,5 %. La hauteur du domaine est arrondie à un nombre entier de mailles.",

    "rec.ranges": ["Nur zweidimensionale kartesische Wärmeleitung: der Querschnitt eines unendlich langen Prismas. Achsensymmetrische und dreidimensionale Aufgaben sowie die Heisler-Kugel lassen sich nicht formulieren.", "Gleichmäßige quadratische Zellen, höchstens 250 000; die Höhe wird auf eine ganze Zellenzahl gerundet.", "Gekrümmte Ränder werden voxelisiert. Eine vorgegebene Temperatur auf einem gekrümmten Rand ist erster Ordnung in dx genau; die korrigierte konvektive Fläche einer gekrümmten Oberfläche behält einen Restfehler von etwa 1 %.", "Stoffwerte sind temperaturunabhängig, ausgenommen das Phasenwechselmodell (stückweise lineare Enthalpie).", "Die Zeitintegration ist implizites (rückwärtiges) Euler-Verfahren: erster Ordnung im Schritt. Die Schritttoleranz verschärfen, bis sich das Ergebnis nicht mehr ändert.", "Keine Konvektion im Fluid, kein Kontakt getrennter Körper durch den Leerraum, kein Feuchte- oder Lufttransport."],

    "help.title": "Bedienung",
    "help.intro": "Das Programm löst die <b>zweidimensionale instationäre Wärmeleitungsgleichung</b> im Querschnitt eines unendlich langen Prismas: Entlang der dritten Achse ist alles gleichförmig, und in dieser Richtung fließt keine Wärme.",
    "help.step": "Schritt",
    "help.what": "Was zu tun ist",
    "help.s1": "1. Gebiet",
    "help.s1t": "Legen Sie die Größe des Querschnitts fest (Reiter „Gebiet“). Der Hintergrund ist entweder Hohlraum (Umgebung) oder ein fester Werkstoff.",
    "help.s2": "2. Geometrie",
    "help.s2t": "Zeichnen Sie Rechtecke, Ellipsen, Polygone und Linien; die Maße lassen sich in der rechten Leiste numerisch nachführen. Die Reihenfolge in der Liste ist die Stapelreihenfolge — spätere Formen überdecken frühere. „Abziehen“ schneidet einen Hohlraum (ein Loch) aus.",
    "help.s3": "3. Materialien",
    "help.s3t": "Jede Form erhält ihr eigenes Material. Bei Lebensmitteln und Paraffin wird die latente Wärme des Phasenwechsels berücksichtigt.",
    "help.s4": "4. Randbedingungen",
    "help.s4t": "Vier Seiten des Gebiets: adiabat (= Symmetrie), feste T, Konvektion mit Strahlung oder vorgegebene Wärmestromdichte. Im Inneren kann jede Form auf fester Temperatur gehalten werden — auch im Modus „nur Umriss“, der sie in eine Linie entlang der Kontur verwandelt.",
    "help.s5": "5. Umgebung",
    "help.s5t": "Grenzflächen zwischen Formen und Hohlraum geben Wärme durch Newtonsche Abkühlung (h) und — bei aktivierter Strahlung — durch Strahlung (ε) ab.",
    "help.s6": "6. Zeit",
    "help.s6t": "Dauer und Bildanzahl einstellen, dann „Rechnen“ drücken. Der Schieberegler unten fährt durch die Zeit; „Stationär“ löst den eingeschwungenen Zustand direkt.",
    "help.under": "Unter der Haube",
    "help.underT": "Finite Volumen auf einem gleichmäßigen Netz, voll implizite Zeitintegration (bei jeder Schrittweite stabil), das lineare Gleichungssystem wird mit konjugierten Gradienten gelöst, vorkonditioniert durch eine unvollständige Cholesky-Zerlegung IC(0). Die Wärmeleitfähigkeit an Materialgrenzen wird harmonisch gemittelt, was den Wärmestrom über die Fügestelle exakt wiedergibt. Der Phasenwechsel wird mit der Enthalpiemethode behandelt und erhält die Energie exakt; die Nichtlinearität wird über Newton-Iterationen mit Liniensuche auf der Residuumsnorm bewältigt (ohne sie geraten die Iterationen bei engem Schmelzbereich in einen Zyklus). Die Strahlung wird als h_rad = εσ(T²+T∞²)(T+T∞) linearisiert und mit der <i>Oberflächentemperatur</i> ausgewertet, nicht mit der Temperatur im Mittelpunkt der Randzelle. Die Fläche schräger und gekrümmter Oberflächen wird aus der Länge des Treppenzuges korrigiert: Ohne diese Korrektur würde die Zellentreppe die Fläche eines Kreises um genau 4/π = 1,27 überschätzen — ein Fehler, der bei Netzverfeinerung nicht kleiner wird. Rechtecke und 45°-Facetten ergeben sich exakt. Der Zeitschritt wird automatisch aus einer lokalen Fehlerschätzung gewählt und verkleinert, sobald die Iterationen nicht konvergieren.",
    "help.tests": "Die Schaltfläche „Selbsttest“ prüft den Löser an vierzehn Aufgaben mit exakter Lösung: erf-Profil, mehrschichtige Wand, Sprung am Kontaktwiderstand, Fourier-Reihe, Volumenquelle, Stefan-Problem, Energieerhaltung, Gleichgewichtstemperatur, Strahlung (auch bei geringer Wärmeleitfähigkeit), 2D-Reihe, Fläche gekrümmter Oberflächen, Schließen der Wärmebilanz und Maximumprinzip bei engem Schmelzbereich.",
    "help.limits": "Einschränkungen",
    "help.l1": "<b>Nur Wärmeleitung.</b> Konvektion in Flüssigkeiten und Hohlräumen wird nicht abgebildet. Als Material gezeichnete Luft gilt als ruhend; dadurch wird der Wärmetransport über Spalte von mehr als etwa 10 mm unterschätzt.",
    "help.l2": "<b>Hohlräume als Spalte.</b> Bleibt zwischen zwei Körpern ein Hohlraum, tauscht jede Oberfläche Wärme mit der Umgebungstemperatur T∞ aus und nicht mit dem Nachbarkörper: Ein schmaler Schlitz verhält sich wie ein belüfteter Kanal, nicht wie ein Wärmewiderstand. Zeichnen Sie für dünne Zwischenschichten statt eines Hohlraums ein Material (Luft, Wärmeleitpaste).",
    "help.l3": "<b>Die Stoffwerte sind konstant</b> (abgesehen vom Phasenwechsel): Abhängigkeiten k(T) und c(T) werden nicht berücksichtigt.",
    "help.l4": "<b>Strahlung</b> wirkt nur von einer Oberfläche an die Umgebung — kein Austausch zwischen Oberflächen und keine Sichtfaktoren.",
    "help.l5": "<b>Stofftransport</b> (Trocknung, Feuchtewanderung, Wärmetransport durch Dampf) wird nicht abgebildet; deshalb erwärmen sich Backgut und Trockengut hier langsamer als in Wirklichkeit.",
    "help.l6": "<b>Geometrische Genauigkeit.</b> Körper werden durch Netzzellen dargestellt. Polygone mit achsparallelen und 45°-Facetten sind nach der Flächenkorrektur exakt; beim Kreis bleibt im Wärmeübergang ein Restfehler von etwa 1,5 %. Die Gebietshöhe wird auf eine ganze Zahl von Zellen gerundet.",
