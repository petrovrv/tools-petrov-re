function solve(s){

  if(!finite(risk))warnings.push({code:'risk_unknown',text:pick(T('The obsolescence screening index is unavailable because one or more qualitative inputs are unknown.','Скринінговий індекс застарівання недоступний, оскільки один або кілька якісних входів невідомі.','Der Obsoleszenz-Screeningindex ist nicht verfügbar, weil qualitative Eingaben unbekannt sind.','De obsolescentie-screeningindex is niet beschikbaar omdat kwalitatieve invoer onbekend is.','L’indice de criblage d’obsolescence est indisponible car une ou plusieurs entrées qualitatives sont inconnues.','El índice de cribado de obsolescencia no está disponible porque faltan entradas cualitativas.','Wskaźnik starzenia jest niedostępny, ponieważ co najmniej jedno wejście jakościowe jest nieznane.'))});
  if(!s.deadlineKnown&&(s.supplierStatus==='eol'||s.supplierStatus==='discontinued'))warnings.push({code:'deadline_unknown',text:pick(T('Supplier last-order deadline is not confirmed. Inventory timing therefore has no supplier-deadline constraint.','Строк останнього замовлення постачальника не підтверджено. Тому часовий розрахунок запасу не має обмеження строком постачальника.','Der Last-Order-Termin des Lieferanten ist nicht bestätigt. Die Bestandszeitplanung hat daher keine Lieferantenfrist.','De laatste besteldatum van de leverancier is niet bevestigd. De voorraadplanning heeft daarom geen leveranciersdeadline.','La date limite de dernière commande n’est pas confirmée. Le calendrier de stock n’a donc pas de contrainte fournisseur.','La fecha límite del último pedido no está confirmada. El calendario de inventario no tiene por tanto restricción de proveedor.','Termin ostatniego zamówienia u dostawcy nie jest potwierdzony. Harmonogram zapasu nie ma więc ograniczenia terminem dostawcy.'))});
  if(restoreNotes.length&&stateSignature(s)===restoreSig)warnings.push({code:'restored_values',text:pick(T("The saved state held values outside the tool’s vocabularies; they were replaced by defaults: ","Збережений стан містив значення поза словниками інструмента; їх замінено типовими: ","Der gespeicherte Zustand enthielt Werte außerhalb der Wertelisten des Werkzeugs; sie wurden durch Vorgaben ersetzt: ","De opgeslagen toestand bevatte waarden buiten de keuzelijsten van de tool; ze zijn vervangen door standaardwaarden: ","L’état enregistré contenait des valeurs hors des listes de l’outil ; elles ont été remplacées par les valeurs par défaut : ","El estado guardado contenía valores fuera de las listas de la herramienta; se sustituyeron por los valores por defecto: ","Zapisany stan zawierał wartości spoza słowników narzędzia; zastąpiono je domyślnymi: "))+restoreNotes.join(', ')});
  if(!coreOk)return{signature:stateSignature(s),risk:risk,available:false,issues:issues,warnings:warnings,actions:deriveActions(s,issues,warnings,null),model:s.demandModel,rate:null,result:null,coverage:null,criterionMet:false,stockCoverageTime:null,inventoryTrigger:null,latestOrderBy:null,replacementStartBy:null,sensitivity:[]};
  if(s.demandModel==='unknown'){issues.push({code:'unknown_demand',text:pick(T('Quantitative last-time-buy is unavailable until a demand basis is supplied.','Кількісна остання закупівля недоступна, доки не задано основу попиту.','Quantitativer Last-Time-Buy ist ohne Bedarfsbasis nicht verfügbar.','Kwantitatieve last-time-buy is niet beschikbaar zonder vraagbasis.','Le dernier achat quantitatif est indisponible sans base de demande.','La última compra cuantitativa no está disponible sin base de demanda.','Ilościowy last-time-buy jest niedostępny bez podstawy popytu.'))});}
  else if(s.demandModel==='poisson'){

      result=minPurchasePoisson(s.stock,rate,s.leadYears,s.horizonYears,s.targetCoverage);

      [0.5,0.75,1,1.25,1.5].forEach(function(f){var x=minPurchasePoisson(s.stock,rate*f,s.leadYears,s.horizonYears,s.targetCoverage);sens.push({factor:f,q:x.feasible?x.q:null,coverage:x.feasible?x.coverage:null,feasible:x.feasible});});
    }
  }else if(s.demandModel==='empirical'){
    var rows=empiricalRows(s,issues);

  }
  var available=!!(result&&result.feasible),coverage=available?result.coverage:null;
  var criterion=available&&coverage+1e-14>=s.targetCoverage;
  var latestOrder=null,replacementStart=null,inventoryTrigger=null;

  if(result&&!result.feasible){
    var msg=result.reason==='lead_risk'?T('Current stock cannot meet the target probability through lead time; no purchase quantity arriving after that lead time can repair this gap.','Поточний запас не забезпечує цільову ймовірність до поставки; жодна кількість, що надійде після цього строку, не усуне цей ризик.','Der aktuelle Bestand erreicht die Zielwahrscheinlichkeit bis zur Lieferung nicht; keine danach eintreffende Menge kann diese Lücke beheben.','De huidige voorraad haalt de doelkans tot levering niet; geen hoeveelheid die daarna aankomt kan dit tekort herstellen.','Le stock actuel n’atteint pas la probabilité cible jusqu’à la livraison; aucune quantité arrivant ensuite ne peut corriger ce risque.','El stock actual no alcanza la probabilidad objetivo hasta la entrega; ninguna cantidad que llegue después puede corregir ese riesgo.','Bieżący zapas nie zapewnia docelowego prawdopodobieństwa do czasu dostawy; żadna późniejsza ilość nie usunie tej luki.')

    issues.push({code:result.reason,text:pick(msg)});
  }
  return{signature:stateSignature(s),risk:risk,available:available,issues:issues,warnings:warnings,actions:deriveActions(s,issues,warnings,result),model:s.demandModel,rate:rate,result:result,coverage:coverage,criterionMet:criterion,stockCoverageTime:stockTime,inventoryTrigger:inventoryTrigger,latestOrderBy:latestOrder,replacementStartBy:replacementStart,sensitivity:sens};

 learnTitle:T('Try the horizon before reading the answer','Спочатку змініть горизонт, потім читайте відповідь','Erst den Horizont ändern, dann die Antwort lesen','Wijzig eerst de horizon, lees daarna het antwoord','Modifiez d’abord l’horizon, puis lisez la réponse','Cambie primero el horizonte y luego lea la respuesta','Najpierw zmień horyzont, potem przeczytaj odpowiedź'),
 learnBody:T('Load “Discontinued PLC”. Predict whether the LTB quantity rises or falls when the horizon changes from 5 to 10 years, then run both cases. Explanation: the horizon adds Poisson demand after the delivery point while the lead-time risk is unchanged. Correction: the minimum quantity can rise, but it cannot repair a lead-time coverage gap; when stock cannot carry the target probability to delivery, replacement or an earlier supply action must start instead.','Завантажте «Знятий з виробництва PLC». Передбачте, як зміниться LTB при горизонті 5 і 10 років, потім виконайте обидва розрахунки. Пояснення: горизонт додає попит Пуассона після поставки, а ризик до поставки не змінюється. Корекція: мінімальна кількість може зростати, але не усуває дефіцит покриття до поставки; якщо запас не тримає цільову ймовірність до поставки, потрібна заміна або раніша дія з постачання.','Laden Sie „Abgekündigte SPS“. Schätzen Sie, wie sich die LTB-Menge bei einem Horizont von 5 auf 10 Jahre ändert, und rechnen Sie beide Fälle. Erklärung: Der längere Horizont fügt Poisson-Bedarf nach der Lieferung hinzu, während das Lieferzeitrisiko gleich bleibt. Korrektur: Die Mindestmenge kann steigen, kann aber eine Lieferzeitlücke nicht heilen; trägt der Bestand die Zielwahrscheinlichkeit nicht bis zur Lieferung, muss Ersatz oder eine frühere Beschaffungsmaßnahme beginnen.','Laad “Uit productie genomen PLC”. Voorspel wat met de LTB-hoeveelheid gebeurt als de horizon van 5 naar 10 jaar gaat en voer beide gevallen uit. Uitleg: de langere horizon voegt Poissonvraag na levering toe, terwijl het risico vóór levering gelijk blijft. Correctie: de minimale hoeveelheid kan stijgen, maar kan een tekort vóór levering niet herstellen; als voorraad de doelkans niet tot levering draagt, moet vervanging of een eerdere leveringsactie starten.','Chargez « API arrêté ». Prévoyez l’évolution de la quantité LTB lorsque l’horizon passe de 5 à 10 ans, puis calculez les deux cas. Explication : l’horizon ajoute une demande de Poisson après la livraison, tandis que le risque pendant le délai reste inchangé. Correction : la quantité minimale peut augmenter mais ne corrige pas une insuffisance de couverture avant livraison; il faut alors lancer le remplacement ou une action d’approvisionnement plus tôt.','Cargue “PLC descatalogado”. Prediga cómo cambia la cantidad LTB al pasar el horizonte de 5 a 10 años y ejecute ambos casos. Explicación: el horizonte añade demanda de Poisson después de la entrega mientras el riesgo durante el plazo no cambia. Corrección: la cantidad mínima puede aumentar, pero no corrige un déficit de cobertura previo a la entrega; en ese caso debe iniciarse la sustitución o una acción de suministro anterior.','Wczytaj „Wycofany PLC”. Przewidź zmianę ilości LTB przy wydłużeniu horyzontu z 5 do 10 lat i uruchom oba przypadki. Wyjaśnienie: dłuższy horyzont dodaje popyt Poissona po dostawie, a ryzyko w czasie dostawy pozostaje bez zmian. Korekta: minimalna ilość może wzrosnąć, ale nie usuwa luki pokrycia przed dostawą; wtedy trzeba rozpocząć wymianę lub wcześniejsze działanie zakupowe.'),
 introTitle:T('What the result means','Що означає результат','Was das Ergebnis bedeutet','Wat het resultaat betekent','Ce que signifie le résultat','Qué significa el resultado','Co oznacza wynik'),
 introBody:T('Enter the item, demand evidence, usable stock, lead time, planning horizon and target probability. Run computes an integer last-time-buy and timing triggers only when the chosen model is applicable and every required numeric input has confirmed provenance. Approval stays a separate field.','Введіть позицію, дані попиту, придатний запас, строк поставки, горизонт і цільову ймовірність. Run обчислює цілу кількість LTB та часові тригери лише за застосовної моделі й підтвердженого походження всіх обов’язкових числових даних. Затвердження залишається окремим полем.','Artikel, Bedarfsnachweis, nutzbaren Bestand, Lieferzeit, Horizont und Zielwahrscheinlichkeit eingeben. Run berechnet eine ganzzahlige LTB-Menge und Termine nur bei anwendbarem Modell und bestätigter Provenienz aller Pflichtzahlen. Die Freigabe bleibt ein separates Feld.','Voer item, vraagevidence, bruikbare voorraad, levertijd, horizon en doelkans in. Run berekent een gehele LTB-hoeveelheid en tijdtriggers alleen bij een toepasbaar model en bevestigde herkomst van alle verplichte cijfers. Goedkeuring blijft een apart veld.','Saisissez l’article, les données de demande, le stock utilisable, le délai, l’horizon et la probabilité cible. Run calcule une quantité LTB entière et des échéances uniquement si le modèle est applicable et si la provenance de toutes les données numériques requises est confirmée. L’approbation reste séparée.','Introduzca el artículo, evidencia de demanda, stock utilizable, plazo, horizonte y probabilidad objetivo. Run calcula una cantidad LTB entera y plazos solo si el modelo aplica y toda entrada numérica obligatoria tiene procedencia confirmada. La aprobación permanece separada.','Wprowadź pozycję, dane popytu, użyteczny zapas, czas dostawy, horyzont i docelowe prawdopodobieństwo. Run wyznacza całkowitą ilość LTB i terminy tylko przy stosowalnym modelu i potwierdzonym pochodzeniu wszystkich wymaganych danych liczbowych. Zatwierdzenie pozostaje osobnym polem.'),
 footer:T('Poisson mode: stationary independent unit demand. Coverage requires no shortage before delivery and no shortage through the planning horizon after the purchase arrives. Empirical mode uses only the weighted scenarios entered by the user. Risk index = 0.30 criticality + 0.40 supplier status + 0.30 replacement compatibility on fixed 0–100 screening scales.','Режим Пуассона: стаціонарний незалежний штучний попит. Покриття вимагає відсутності дефіциту до поставки та до кінця горизонту після надходження закупівлі. Емпіричний режим використовує лише введені користувачем зважені сценарії. Індекс ризику = 0,30 критичність + 0,40 статус постачальника + 0,30 сумісність заміни за фіксованими шкалами 0–100.','Poisson: stationärer unabhängiger Stückbedarf. Abdeckung verlangt keinen Fehlbestand bis zur Lieferung und bis zum Planungshorizont nach Eingang der Bestellung. Empirisch werden nur die eingegebenen gewichteten Szenarien verwendet. Risikoindex = 0,30 Kritikalität + 0,40 Lieferstatus + 0,30 Ersatzkompatibilität auf festen 0–100-Skalen.','Poisson: stationaire onafhankelijke stukvraag. Dekking vereist geen tekort vóór levering en tot de planningshorizon nadat de aankoop aankomt. Empirisch gebruikt alleen de ingevoerde gewogen scenario’s. Risico-index = 0,30 kritikaliteit + 0,40 leveranciersstatus + 0,30 vervangingscompatibiliteit op vaste 0–100-schalen.','Poisson : demande unitaire stationnaire indépendante. La couverture exige l’absence de rupture avant livraison et jusqu’à l’horizon après arrivée de l’achat. Le mode empirique utilise uniquement les scénarios pondérés saisis. Indice de risque = 0,30 criticité + 0,40 statut fournisseur + 0,30 compatibilité de remplacement sur des échelles fixes 0–100.','Poisson: demanda unitaria estacionaria independiente. La cobertura exige ausencia de falta antes de la entrega y hasta el horizonte después de recibir la compra. El modo empírico usa solo los escenarios ponderados introducidos. Índice de riesgo = 0,30 criticidad + 0,40 estado del proveedor + 0,30 compatibilidad de sustitución en escalas fijas 0–100.','Poisson: stacjonarny niezależny popyt jednostkowy. Pokrycie wymaga braku niedoboru przed dostawą i do końca horyzontu po otrzymaniu zakupu. Tryb empiryczny używa wyłącznie wprowadzonych ważonych scenariuszy. Wskaźnik ryzyka = 0,30 krytyczność + 0,40 status dostawcy + 0,30 kompatybilność zamiennika na stałych skalach 0–100.')
};

function adoptStage(app){stage=app&&app.stages&&app.stages[0]||null;}

function resultPayload(s,r){
  var notes=[];
  r.issues.forEach(function(x){notes.push(x.text);});
  r.warnings.forEach(function(x){notes.push(x.text);});
  var rows=[];
  if(r.rate!==null)rows.push({cells:[TX.annualDemand,{value:r.rate,precision:4},'1/a']});
  if(r.result&&finite(r.result.leadCoverage))rows.push({cells:[TX.leadCoverage,{value:100*r.result.leadCoverage,precision:3},'%']});
  if(r.model==='poisson'&&r.rate!==null)rows.push({cells:[TX.stockHorizon,{value:100*poissonCdf(s.stock,r.rate*s.horizonYears),precision:3},'%']});
  if(r.stockCoverageTime!==null&&isFinite(r.stockCoverageTime))rows.push({cells:[TX.stockTime,{value:r.stockCoverageTime,precision:3},'a']});
  if(r.available&&r.inventoryTrigger!==null)rows.push({cells:[T("Start replacement by, without purchase","Почати заміну до, без закупівлі","Ersatz beginnen bis, ohne Kauf","Vervanging starten vóór, zonder aankoop","Lancer le remplacement avant, sans achat","Iniciar la sustitución antes de, sin compra","Rozpocząć wymianę do, bez zakupu"),{value:r.inventoryTrigger,precision:3},'a']});
  var tiles=[];if(finite(r.risk))tiles.push({label:TX.risk,value:r.risk,precision:1,hint:'/100'});
  if(r.available){
    tiles.push({label:TX.purchase,value:r.result.q,precision:0,hint:pick(T('units','шт.','Stk.','st.','unités','unidades','szt.'))});
    tiles.push({label:TX.coverage,value:100*r.coverage,precision:3,hint:'%',tone:r.criterionMet?'ok':'bad'});
    if(r.replacementStartBy!==null)tiles.push({label:TX.replacementStart,value:r.replacementStartBy,precision:2,hint:'a'});
    if(r.latestOrderBy!==null)tiles.push({label:TX.latestOrder,value:r.latestOrderBy,precision:2,hint:'a'});
  }
  var av=approvalView(s);tiles.push({label:TX.decisionState,value:pick(av.text),tone:av.tone,headline:false,learn:'states'});
  var tables=[];
  if(rows.length)tables.push({title:TX.results,head:[pick(T('Quantity','Величина','Größe','Grootheid','Grandeur','Magnitud','Wielkość')),pick(T('Value','Значення','Wert','Waarde','Valeur','Valor','Wartość')),pick(T('Unit','Одиниця','Einheit','Eenheid','Unité','Unidad','Jednostka'))],rows:rows});
  if(r.sensitivity&&r.sensitivity.length){tables.push({title:TX.sensitivity,head:[TX.factor,TX.purchase,TX.coverage],rows:r.sensitivity.map(function(x){return{cells:[{value:x.factor,precision:2},x.q===null?'—':{value:x.q,precision:0},x.coverage===null?'—':{value:100*x.coverage,precision:3}]};})});}
  if(r.actions&&r.actions.length)tables.push({title:TX.openActions,head:[TX.action],rows:r.actions.map(function(x){return{cells:[x.text]};})});
  var verdictText;
  if(!r.available)verdictText=T('Quantitative LTB result unavailable. Resolve the listed data/model gaps.','Кількісний результат LTB недоступний. Усуньте зазначені прогалини даних або моделі.','Quantitatives LTB-Ergebnis nicht verfügbar. Daten-/Modelllücken schließen.','Kwantitatief LTB-resultaat niet beschikbaar. Los de genoemde data-/modelgaten op.','Résultat LTB quantitatif indisponible. Résolvez les lacunes de données/modèle.','Resultado LTB cuantitativo no disponible. Resuelva las lagunas de datos/modelo.','Ilościowy wynik LTB niedostępny. Usuń wskazane luki danych/modelu.');
  else if(r.criterionMet)verdictText=T('The calculated purchase meets the probability criterion. Engineering approval: ','Розрахована закупівля виконує ймовірнісний критерій. Інженерне затвердження: ','Die berechnete Menge erfüllt das Wahrscheinlichkeitskriterium. Engineering-Freigabe: ','De berekende aankoop voldoet aan het kanscriterium. Engineeringgoedkeuring: ','L’achat calculé satisfait le critère probabiliste. Approbation d’ingénierie : ','La compra calculada cumple el criterio probabilístico. Aprobación de ingeniería: ','Obliczony zakup spełnia kryterium prawdopodobieństwa. Zatwierdzenie inżynierskie: ');
  else verdictText=T('A quantity was calculated, but the probability criterion is not met.','Кількість розраховано, але ймовірнісний критерій не виконано.','Eine Menge wurde berechnet, das Wahrscheinlichkeitskriterium ist jedoch nicht erfüllt.','Een hoeveelheid is berekend, maar het kanscriterium is niet gehaald.','Une quantité est calculée mais le critère probabiliste n’est pas satisfait.','Se calculó una cantidad, pero no se cumple el criterio probabilístico.','Ilość obliczono, lecz kryterium prawdopodobieństwa nie jest spełnione.');
  var text=pick(verdictText)+(r.available&&r.criterionMet?pick(approvalView(s).text):'');
  return{verdict:{tone:!r.available?'warn':(r.criterionMet?'ok':'bad'),text:text},tiles:tiles,tables:tables,notes:notes};
}

function buildInterface(){
  ui=DiagramUI.app({
    id:'obsolescenceltb',mount:'#app',layout:'calculator',compute:'run',state:state,defaults:DEFAULTS,subtitle:TX.subtitle,results:{title:TX.results},
    notices:[{id:'scope',tone:'warn',sticky:true,title:TX.modelBasis,text:T('The tool calculates a screening risk index and a preliminary spare-demand coverage. It does not approve a life-cycle strategy or qualify a replacement item.','Інструмент розраховує скринінговий індекс ризику та попереднє покриття попиту на запасні частини. Він не затверджує стратегію життєвого циклу й не кваліфікує замінний компонент.','Das Werkzeug berechnet einen Screening-Risikoindex und eine vorläufige Ersatzteilabdeckung. Es genehmigt keine Lebenszyklusstrategie und qualifiziert keinen Ersatzartikel.','De tool berekent een screening-risico-index en voorlopige reservedelendekking. Hij keurt geen levenscyclusstrategie goed en kwalificeert geen vervangingsitem.','L’outil calcule un indice de risque de criblage et une couverture préliminaire des rechanges. Il n’approuve pas une stratégie de cycle de vie et ne qualifie pas un article de remplacement.','La herramienta calcula un índice de riesgo de cribado y una cobertura preliminar de repuestos. No aprueba una estrategia de ciclo de vida ni cualifica un artículo de sustitución.','Narzędzie oblicza wskaźnik ryzyka i wstępne pokrycie zapotrzebowania na części. Nie zatwierdza strategii cyklu życia ani kwalifikacji zamiennika.')}],
    learn:{version:1,intro:{title:TX.introTitle,body:TX.introBody},topics:{horizon:{title:TX.learnTitle,body:TX.learnBody},'case':{title:T("Try it: can a larger purchase cover a long lead time?","Спробуйте: чи покриє більша закупівля довгий строк поставки?","Ausprobieren: Deckt ein größerer Kauf eine lange Lieferzeit?","Probeer het: dekt een grotere aankoop een lange levertijd?","Essayez : un achat plus grand couvre-t-il un long délai ?","Pruébelo: ¿cubre una compra mayor un plazo largo?","Spróbuj: czy większy zakup pokryje długi czas dostawy?"),body:T("Load “Discontinued PLC” and change the procurement lead time from 0.5 to 2 years. Before running, guess how many units the last-time-buy will need.","Завантажте «Знятий з виробництва PLC» і змініть строк поставки з 0,5 на 2 роки. Перш ніж запускати, вгадайте, скільки одиниць знадобиться для останньої закупівлі.","Laden Sie „Abgekündigte SPS“ und ändern Sie die Beschaffungszeit von 0,5 auf 2 Jahre. Schätzen Sie vor dem Rechnen, wie viele Stück der Last-Time-Buy braucht.","Laad „Uit productie genomen PLC” en verander de inkooplevertijd van 0,5 naar 2 jaar. Schat vóór het rekenen hoeveel stuks de last-time-buy nodig heeft.","Chargez « API arrêté » et passez le délai d’approvisionnement de 0,5 à 2 ans. Avant de calculer, estimez combien d’unités le dernier achat demandera.","Cargue «PLC descatalogado» y cambie el plazo de aprovisionamiento de 0,5 a 2 años. Antes de calcular, estime cuántas unidades necesitará la última compra.","Wczytaj „Wycofany PLC” i zmień czas dostawy z 0,5 na 2 lata. Przed obliczeniem oszacuj, ile sztuk będzie potrzebował ostatni zakup.")},explain:{title:T("Why no quantity appears","Чому кількість не з’являється","Warum keine Menge erscheint","Waarom er geen hoeveelheid verschijnt","Pourquoi aucune quantité n’apparaît","Por qué no aparece ninguna cantidad","Dlaczego nie pojawia się ilość"),body:T("Units bought now arrive only after the lead time. Until then the two units in stock carry the demand alone: at one event per year the probability of at most two events in two years is 67.7 %, below the 95 % target. The tool therefore reports a lead-time gap instead of a quantity; no purchase size changes that probability.","Закуплені зараз одиниці надійдуть лише після строку поставки. До того попит покривають тільки дві одиниці на складі: за однієї події на рік імовірність не більше двох подій за два роки становить 67,7 %, нижче цілі 95 %. Тому інструмент повідомляє про прогалину до поставки замість кількості; жоден обсяг закупівлі цю ймовірність не змінює.","Jetzt gekaufte Teile treffen erst nach der Lieferzeit ein. Bis dahin tragen die zwei Teile im Lager den Bedarf allein: bei einem Ereignis pro Jahr beträgt die Wahrscheinlichkeit für höchstens zwei Ereignisse in zwei Jahren 67,7 %, unter dem Ziel von 95 %. Das Werkzeug meldet daher eine Lieferzeitlücke statt einer Menge; keine Kaufmenge ändert diese Wahrscheinlichkeit.","Nu gekochte stuks komen pas na de levertijd binnen. Tot dan dragen de twee stuks in voorraad de vraag alleen: bij één gebeurtenis per jaar is de kans op hoogstens twee gebeurtenissen in twee jaar 67,7 %, onder het doel van 95 %. De tool meldt daarom een levertijdtekort in plaats van een hoeveelheid; geen aankoopgrootte verandert die kans.","Les unités achetées maintenant n’arrivent qu’après le délai. D’ici là, les deux unités en stock portent seules la demande : à un événement par an, la probabilité d’au plus deux événements en deux ans est de 67,7 %, sous la cible de 95 %. L’outil signale donc un écart pendant le délai au lieu d’une quantité ; aucune taille d’achat ne change cette probabilité.","Las unidades compradas ahora llegan solo tras el plazo. Hasta entonces las dos unidades en stock cubren solas la demanda: con un evento por año, la probabilidad de como máximo dos eventos en dos años es del 67,7 %, por debajo del objetivo del 95 %. Por eso la herramienta informa de una brecha durante el plazo en lugar de una cantidad; ningún tamaño de compra cambia esa probabilidad.","Sztuki kupione teraz dotrą dopiero po czasie dostawy. Do tego czasu popyt pokrywają same dwie sztuki z magazynu: przy jednym zdarzeniu rocznie prawdopodobieństwo co najwyżej dwóch zdarzeń w dwa lata wynosi 67,7 %, poniżej celu 95 %. Narzędzie zgłasza więc lukę w czasie dostawy zamiast ilości; żadna wielkość zakupu nie zmienia tego prawdopodobieństwa.")},fix:{title:T("What changes the answer","Що змінює відповідь","Was die Antwort ändert","Wat het antwoord verandert","Ce qui change la réponse","Qué cambia la respuesta","Co zmienia odpowiedź"),body:T("A shorter lead time, more usable stock now, or a lower target changes it. Set the lead time back to 0.5 years and the purchase returns as 7 units. Interim sources such as a spares pool or cannibalisation lie outside the model and must be entered as stock only once they are confirmed.","Її змінюють коротший строк поставки, більший придатний запас зараз або нижча ціль. Поверніть строк поставки 0,5 року, і закупівля знову становитиме 7 одиниць. Тимчасові джерела, як-от спільний фонд запчастин чи розукомплектування, лежать поза моделлю і вносяться як запас лише після підтвердження.","Eine kürzere Lieferzeit, mehr nutzbarer Bestand jetzt oder ein niedrigeres Ziel ändern sie. Setzen Sie die Lieferzeit auf 0,5 Jahre zurück, und der Kauf erscheint wieder mit 7 Stück. Zwischenquellen wie ein Ersatzteilpool oder Ausschlachten liegen außerhalb des Modells und gehen erst nach Bestätigung als Bestand ein.","Een kortere levertijd, nu meer bruikbare voorraad of een lager doel verandert het. Zet de levertijd terug op 0,5 jaar en de aankoop komt terug als 7 stuks. Tussenbronnen zoals een reservedelenpool of kannibalisatie vallen buiten het model en tellen pas als voorraad mee na bevestiging.","Un délai plus court, davantage de stock utilisable maintenant ou une cible plus basse la changent. Remettez le délai à 0,5 an et l’achat revient à 7 unités. Les sources provisoires comme un pool de rechanges ou la cannibalisation sont hors modèle et n’entrent comme stock qu’une fois confirmées.","La cambian un plazo más corto, más stock utilizable ahora o un objetivo menor. Vuelva a poner el plazo en 0,5 años y la compra reaparece con 7 unidades. Las fuentes provisionales como un pool de repuestos o la canibalización quedan fuera del modelo y solo cuentan como stock una vez confirmadas.","Zmienia ją krótszy czas dostawy, większy użyteczny zapas teraz lub niższy cel. Przywróć czas dostawy 0,5 roku, a zakup znów wyniesie 7 sztuk. Źródła przejściowe, jak pula części czy kanibalizacja, leżą poza modelem i wchodzą jako zapas dopiero po potwierdzeniu.")},timing:{title:T("Timing triggers","Часові тригери","Terminauslöser","Tijdtriggers","Déclencheurs de calendrier","Disparadores de plazo","Wyzwalacze terminów"),body:T("“Time current stock meets target” is the longest period over which the stock alone keeps the no-shortage probability at the target. The order date is that time minus the lead time, capped by the supplier’s last-order deadline when it is known. With a feasible purchase, replacement must start one programme duration before the horizon; without one, one programme duration before the stock time.","«Час, протягом якого поточний запас виконує ціль» — найдовший період, у якому лише запас тримає ймовірність відсутності дефіциту на рівні цілі. Дата замовлення — цей час мінус строк поставки, але не пізніше відомого строку останнього замовлення постачальника. Якщо закупівля можлива, заміну треба почати за тривалість програми до горизонту; якщо ні — за тривалість програми до часу запасу.","„Zeit, in der der Bestand das Ziel erfüllt“ ist der längste Zeitraum, in dem der Bestand allein die Wahrscheinlichkeit ohne Fehlbestand auf dem Ziel hält. Der Bestelltermin ist diese Zeit minus Lieferzeit, begrenzt durch den Last-Order-Termin des Lieferanten, wenn er bekannt ist. Mit machbarem Kauf beginnt der Ersatz eine Programmdauer vor dem Horizont, ohne ihn eine Programmdauer vor der Bestandszeit.","‘Tijd dat de huidige voorraad het doel haalt’ is de langste periode waarin de voorraad alleen de kans zonder tekort op het doel houdt. De besteldatum is die tijd min de levertijd, begrensd door de laatste besteldatum van de leverancier als die bekend is. Met een haalbare aankoop start de vervanging één programmaduur vóór de horizon; zonder aankoop één programmaduur vóór de voorraadtijd.","« Durée pendant laquelle le stock atteint la cible » est la plus longue période où le stock seul maintient la probabilité sans rupture à la cible. La date de commande est cette durée moins le délai, plafonnée par la date limite du fournisseur quand elle est connue. Avec un achat faisable, le remplacement démarre une durée de programme avant l’horizon ; sinon, une durée de programme avant la durée du stock.","«Tiempo en que el stock actual cumple el objetivo» es el periodo más largo en que el stock por sí solo mantiene la probabilidad sin falta en el objetivo. La fecha de pedido es ese tiempo menos el plazo, limitada por la fecha límite del proveedor cuando se conoce. Con una compra factible, la sustitución empieza una duración de programa antes del horizonte; sin ella, una duración de programa antes del tiempo del stock.","„Czas, w którym bieżący zapas spełnia cel” to najdłuższy okres, w którym sam zapas utrzymuje prawdopodobieństwo braku niedoboru na poziomie celu. Termin zamówienia to ten czas minus czas dostawy, nie później niż znany termin ostatniego zamówienia u dostawcy. Przy wykonalnym zakupie wymianę zaczyna się na czas trwania programu przed horyzontem; bez niego — na czas trwania programu przed czasem zapasu.")},states:{title:T("Three separate states","Три окремі стани","Drei getrennte Zustände","Drie afzonderlijke toestanden","Trois états distincts","Tres estados separados","Trzy odrębne stany"),body:T("Calculation says whether a quantity could be computed from confirmed inputs; the probability criterion says whether that quantity reaches the target; approval records the engineering decision. An approval holds only for the inputs it was given with: change any input afterwards and it shows as stale until it is selected again.","«Розрахунок» показує, чи вдалося обчислити кількість з підтверджених входів; «ймовірнісний критерій» — чи досягає ця кількість цілі; «затвердження» фіксує інженерне рішення. Затвердження чинне лише для входів, з якими його надано: після зміни будь-якого входу воно позначається як застаріле, доки його не оберуть знову.","„Berechnung“ sagt, ob aus bestätigten Eingaben eine Menge berechnet werden konnte; das Wahrscheinlichkeitskriterium, ob diese Menge das Ziel erreicht; die Freigabe dokumentiert die Engineering-Entscheidung. Eine Freigabe gilt nur für die Eingaben, mit denen sie erteilt wurde: Wird danach eine Eingabe geändert, erscheint sie als veraltet, bis sie erneut gewählt wird.","‘Berekening’ zegt of uit bevestigde invoer een hoeveelheid kon worden berekend; het kanscriterium of die hoeveelheid het doel haalt; de goedkeuring legt het engineeringbesluit vast. Een goedkeuring geldt alleen voor de invoer waarmee ze is gegeven: wijzig daarna een invoer en ze verschijnt als verouderd tot ze opnieuw wordt gekozen.","« Calcul » indique si une quantité a pu être calculée à partir d’entrées confirmées ; le critère de probabilité, si cette quantité atteint la cible ; l’approbation consigne la décision d’ingénierie. Une approbation ne vaut que pour les entrées avec lesquelles elle a été donnée : modifiez ensuite une entrée et elle apparaît périmée jusqu’à ce qu’elle soit de nouveau choisie.","«Cálculo» indica si se pudo calcular una cantidad con entradas confirmadas; el criterio de probabilidad, si esa cantidad alcanza el objetivo; la aprobación registra la decisión de ingeniería. Una aprobación vale solo para las entradas con las que se dio: si después cambia una entrada, aparece caducada hasta que se vuelva a seleccionar.","„Obliczenie” mówi, czy z potwierdzonych danych udało się wyznaczyć ilość; kryterium prawdopodobieństwa — czy ta ilość osiąga cel; zatwierdzenie rejestruje decyzję inżynierską. Zatwierdzenie obowiązuje tylko dla danych, z którymi je nadano: po zmianie dowolnej danej jest oznaczone jako nieaktualne, dopóki nie zostanie wybrane ponownie.")},provenance:{title:TX.provenance,body:TX.provenanceNote},basis:{title:TX.modelBasis,body:T('Use Poisson only for stationary independent event demand. Use empirical scenarios when rates change with age, campaigns, fleet phase-out, dependencies or common-cause effects. Unknown demand remains unknown.','Використовуйте Пуассон лише для стаціонарного незалежного попиту на події. Для зміни інтенсивності з віком, кампаніями, виведенням парку, залежностями або спільними причинами використовуйте емпіричні сценарії. Невідомий попит залишається невідомим.','Poisson nur für stationären unabhängigen Ereignisbedarf verwenden. Bei alters-, kampagnen-, ausphasungs-, abhängigkeit- oder common-cause-bedingten Änderungen empirische Szenarien nutzen. Unbekannter Bedarf bleibt unbekannt.','Gebruik Poisson alleen voor stationaire onafhankelijke gebeurtenisvraag. Gebruik empirische scenario’s bij veroudering, campagnes, uitfasering, afhankelijkheden of common-cause-effecten. Onbekende vraag blijft onbekend.','Utilisez Poisson uniquement pour une demande événementielle stationnaire et indépendante. Utilisez les scénarios empiriques en cas de vieillissement, campagnes, retrait du parc, dépendances ou causes communes. Une demande inconnue reste inconnue.','Use Poisson solo para demanda de eventos estacionaria e independiente. Use escenarios empíricos con envejecimiento, campañas, retirada de flota, dependencias o causa común. La demanda desconocida sigue siendo desconocida.','Stosuj Poissona tylko dla stacjonarnego, niezależnego popytu zdarzeniowego. Przy starzeniu, kampaniach, wycofywaniu floty, zależnościach lub przyczynach wspólnych użyj scenariuszy empirycznych. Nieznany popyt pozostaje nieznany.')}},tour:[{topic:'basis',focus:'[data-dgu-field="f-demand-model"]'},{topic:'provenance',focus:'[data-dgu-field="f-provenance"]'},{topic:'case',focus:'[data-dgu-field="f-lead"]'},{topic:'explain'},{topic:'fix'},{topic:'timing'},{topic:'states',focus:'[data-dgu-field="f-approval"]'}]},

var PYCORE="SFERR = [0, 0.08106146679532726, 0.0413406959554093, 0.02767792568499834, 0.020790672103765093, 0.016644691189821193, 0.013876128823070748, 0.01189670994589177, 0.010411265261972096, 0.009255462182712733, 0.00833056343336287, 0.007573675487951841, 0.00694284010720953, 0.006408994188004207, 0.0059513701127588475, 0.005554733551962801]\nTOL = 1e-14\nSTOCK_TIME_CAP = 1000.0\nRANGES = {'fleetCount': (1, 1000000), 'stock': (0, 1000000), 'leadYears': (0, 100), 'horizonYears': (0.01, 100),\n          'targetCoverage': (0.5, 0.99999), 'replacementDuration': (0, 100), 'observedEvents': (0, 1000000),\n          'observationYears': (0.01, 1000), 'annualRate': (0, 1000), 'lastOrderWindow': (0, 100)}\nINTEGER_KEYS = ('fleetCount', 'stock', 'observedEvents')\n\ndef stirlerr(n):\n    if n <= 15: return SFERR[n]\n    nn = n*n; S0 = 1/12; S1 = 1/360; S2 = 1/1260; S3 = 1/1680; S4 = 1/1188\n    if n > 500: return (S0 - S1/nn)/n\n    if n > 80: return (S0 - (S1 - S2/nn)/nn)/n\n    if n > 35: return (S0 - (S1 - (S2 - S3/nn)/nn)/nn)/n\n    return (S0 - (S1 - (S2 - (S3 - S4/nn)/nn)/nn)/nn)/n\n\ndef bd0(x, np_):\n    if abs(x - np_) < 0.1*(x + np_):\n        v = (x - np_)/(x + np_); s = (x - np_)*v; ej = 2*x*v; v2 = v*v\n        for j in range(1, 1000):\n            ej *= v2; s1 = s + ej/(2*j + 1)\n            if s1 == s: return s1\n            s = s1\n        return s\n    return x*math.log(x/np_) + np_ - x\n\ndef poisson_pmf(k, mu):\n    if k < 0 or k != math.floor(k): return 0.0\n    if mu == 0: return 1.0 if k == 0 else 0.0\n    if k == 0: return math.exp(-mu)\n    return math.exp(-stirlerr(k) - bd0(k, mu))/math.sqrt(2*math.pi*k)\n\ndef poisson_cdf(k, mu):\n    k = math.floor(k)\n    if k < 0: return 0.0\n    if mu <= 0: return 1.0\n    if k < mu:\n        p = poisson_pmf(k, mu); s = p; j = k\n        while j > 0:\n            p *= j/mu; j -= 1; s += p\n            if p < s*1e-17: break\n        return min(1.0, s)\n    j = k + 1; p = poisson_pmf(j, mu); s = p\n    while p > 0:\n        j += 1; p *= mu/j; s += p\n        if p < s*1e-17: break\n    return max(0.0, 1 - s)\n\ndef joint(stock, q, rate, lead, horizon):\n    if horizon <= lead: return poisson_cdf(stock, rate*horizon)\n    mu1 = rate*lead; mu2 = rate*(horizon - lead)\n    if mu1 == 0: return poisson_cdf(stock + q, mu2)\n    mode = min(stock, math.floor(mu1)); pk = poisson_pmf(mode, mu1); lo = hi = mode\n    p = pk\n    while lo > 0:\n        pn = p*lo/mu1\n        if pn < 1e-20*pk: break\n        p = pn; lo -= 1\n    p = pk\n    while hi < stock:\n        pm = p*mu1/(hi + 1)\n        if pm < 1e-20*pk: break\n        p = pm; hi += 1\n    n = stock + q - hi; F = poisson_cdf(n, mu2); f2 = poisson_pmf(n + 1, mu2); total = 0.0; p1 = poisson_pmf(hi, mu1)\n    for i in range(hi, lo - 1, -1):\n        total += p1*F\n        if i > lo:\n            F += f2; n += 1; f2 *= mu2/(n + 1); p1 *= i/mu1\n    return min(1.0, max(0.0, total))\n\ndef min_q_poisson(stock, rate, lead, horizon, target):\n    lead_cov = poisson_cdf(stock, rate*min(lead, horizon))\n    if lead_cov + TOL < target: return {'feasible': False, 'lead': lead_cov}\n    if horizon <= lead:\n        c = poisson_cdf(stock, rate*horizon)\n        return {'feasible': True, 'q': 0, 'coverage': c, 'lead': c} if c >= target else {'feasible': False, 'lead': c}\n    c0 = joint(stock, 0, rate, lead, horizon)\n    if c0 >= target: return {'feasible': True, 'q': 0, 'coverage': c0, 'lead': lead_cov}\n    lo = 0; hi = 1; c = None\n    while hi < 100000000:\n        c = joint(stock, hi, rate, lead, horizon)\n        if c >= target: break\n        hi *= 2\n    if hi >= 100000000 and (c is None or c < target): return {'feasible': False, 'lead': lead_cov}\n    while hi - lo > 1:\n        mid = (lo + hi)//2\n        if joint(stock, mid, rate, lead, horizon) >= target: hi = mid\n        else: lo = mid\n    return {'feasible': True, 'q': hi, 'coverage': joint(stock, hi, rate, lead, horizon), 'lead': lead_cov}\n\ndef stock_coverage_time(stock, rate, target):\n    if rate == 0: return math.inf\n    if poisson_cdf(stock, rate*STOCK_TIME_CAP) >= target: return math.inf\n    lo = 0.0; hi = STOCK_TIME_CAP\n    for _ in range(100):\n        mid = (lo + hi)/2\n        if poisson_cdf(stock, rate*mid) >= target: lo = mid\n        else: hi = mid\n    return lo\n\ndef finite(x):\n    return isinstance(x, (int, float)) and not isinstance(x, bool) and math.isfinite(x)\n\ndef min_q_empirical(stock, rows, target):\n    valid = [r for r in rows if r.get('status') == 'confirmed' and finite(r.get('leadDemand')) and finite(r.get('horizonDemand')) and finite(r.get('weight'))\n             and r['weight'] > 0 and r['leadDemand'] >= 0 and r['horizonDemand'] >= r['leadDemand']]\n    if not valid: return {'feasible': False}\n    total = 0.0\n    for r in valid: total += r['weight']\n    lead = 0.0\n    for r in valid: lead += r['weight'] if r['leadDemand'] <= stock else 0\n    lead = lead/total\n    if lead + TOL < target: return {'feasible': False, 'lead': lead}\n    cand = sorted(set([0] + [max(0, math.ceil(r['horizonDemand'] - stock)) for r in valid if r['leadDemand'] <= stock]))\n    for q in cand:\n        mass = 0.0\n        for r in valid: mass += r['weight'] if (r['leadDemand'] <= stock and r['horizonDemand'] <= stock + q) else 0\n        mass = mass/total\n        if mass + TOL >= target: return {'feasible': True, 'q': q, 'coverage': mass, 'lead': lead}\n    return {'feasible': False, 'lead': lead}\n\ndef prov_row(s, key):\n    for r in s.get('provenance') or []:\n        if r.get('key') == key: return r\n    return None\n\ndef check_prov(s, key, issues):\n    r = prov_row(s, key)\n    if r is None:\n        issues.append('prov_missing'); return False\n    if r.get('status') != 'confirmed':\n        issues.append('prov_status'); return False\n    if not str(r.get('source') or '').strip() or not str(r.get('version') or '').strip():\n        issues.append('prov_source'); return False\n    return True\n\ndef check_range(s, key, issues):\n    lo, hi = RANGES[key]; v = s.get(key)\n    if not finite(v) or v < lo or v > hi:\n        issues.append('range'); return False\n    if key in INTEGER_KEYS and math.floor(v) != v:\n        issues.append('integer'); return False\n    return True\n\ndef annual_rate(s, issues):\n    if s['demandModel'] != 'poisson': return None\n    if not s['stationary'] or not s['independent']:\n        issues.append('poisson_applicability'); return None\n    if s['rateSource'] == 'observed':\n        if not check_range(s, 'observedEvents', issues) or not check_range(s, 'observationYears', issues) or not check_prov(s, 'observedEvents', issues) or not check_prov(s, 'observationYears', issues): return None\n        if s['observedEvents'] == 0 and not s['acceptZeroRate']:\n            issues.append('zero_not_accepted'); return None\n        return s['observedEvents']/s['observationYears']\n    if not check_range(s, 'annualRate', issues) or not check_prov(s, 'annualRate', issues): return None\n    return s['annualRate']*s['fleetCount'] if s['rateBasis'] == 'asset' else s['annualRate']\n\ndef validate_core(s, issues):\n    ok = True\n    for k in ('fleetCount', 'stock', 'leadYears', 'horizonYears', 'targetCoverage', 'replacementDuration'):\n        if not check_range(s, k, issues): ok = False\n        if not check_prov(s, k, issues): ok = False\n    if s['deadlineKnown']:\n        if not check_range(s, 'lastOrderWindow', issues): ok = False\n        if not check_prov(s, 'lastOrderWindow', issues): ok = False\n    if finite(s.get('horizonYears')) and finite(s.get('leadYears')) and s['horizonYears'] < s['leadYears']: issues.append('lead_beyond_horizon')\n    return ok\n\ndef empirical_ok(r):\n    def isint(x): return finite(x) and math.floor(x) == x\n    return (isint(r.get('leadDemand')) and r['leadDemand'] >= 0 and isint(r.get('horizonDemand')) and r['horizonDemand'] >= r['leadDemand']\n            and finite(r.get('weight')) and 0 < r['weight'] <= 1 and r.get('status') == 'confirmed'\n            and str(r.get('source') or '').strip() != '' and str(r.get('version') or '').strip() != '')\n\ndef solve(s):\n    issues = []; rate = None; result = None; stock_time = None\n    core_ok = validate_core(s, issues)\n    out = {'annual_fleet_demand_rate': None, 'min_ltb_purchase': None, 'achieved_coverage': None, 'lead_time_coverage': None,\n           'stock_coverage_time': None, 'inventory_trigger': None, 'latest_order_by': None, 'replacement_start_by': None, 'criterion_met': None}\n    if not core_ok: return out\n    dm = s['demandModel']\n    if dm == 'unknown':\n        issues.append('unknown_demand')\n    elif dm == 'poisson':\n        rate = annual_rate(s, issues)\n        if rate is not None and not issues:\n            result = min_q_poisson(int(s['stock']), rate, s['leadYears'], s['horizonYears'], s['targetCoverage'])\n            stock_time = stock_coverage_time(int(s['stock']), rate, s['targetCoverage'])\n    elif dm == 'empirical':\n        rows = s.get('empiricalScenarios') or []\n        if not rows: issues.append('no_scenarios')\n        good = []\n        for r in rows:\n            if empirical_ok(r): good.append(r)\n            else: issues.append('bad_scenario')\n        if good and not issues: result = min_q_empirical(int(s['stock']), good, s['targetCoverage'])\n    available = bool(result and result['feasible'])\n    coverage = result['coverage'] if available else None\n    latest = None; repl = None; trig = None\n    if stock_time is not None:\n        trig = max(0, stock_time - s['replacementDuration']) if math.isfinite(stock_time) else None\n        latest = max(0, stock_time - s['leadYears']) if math.isfinite(stock_time) else None\n    if s['deadlineKnown']: latest = s['lastOrderWindow'] if latest is None else min(latest, s['lastOrderWindow'])\n    if available: repl = max(0, s['horizonYears'] - s['replacementDuration'])\n    elif stock_time is not None and math.isfinite(stock_time): repl = max(0, stock_time - s['repl
