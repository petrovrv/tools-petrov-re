        'Bron met hoge zuiverheid: geen amine-unit, alleen droging. Compressie volgt in de volgende stap.',
        'Source haute pureté : pas d\'unité amine, déshydratation seule. Compression à l\'étape suivante.',
        'Fuente de alta pureza: sin unidad de aminas, solo deshidratación. Compresión en la siguiente etapa.',
        'Źródło wysokiej czystości: bez instalacji aminowej, tylko osuszanie. Sprężanie w kolejnym etapie.'));
    }
    return { verdict: verdict, tiles: tiles, meters: meters, tables: tables, notes: notes };
  }

var GROUPS = {
  Industry: T('Industry', 'Промисловість', 'Industrie', 'Industrie', 'Industrie', 'Industria', 'Przemysł'),
  Power: T('Power', 'Енергетика', 'Kraftwerke', 'Elektriciteit', 'Électricité', 'Energía', 'Energetyka'),
  'High purity': T('High purity', 'Висока чистота', 'Hohe Reinheit', 'Hoge zuiverheid', 'Haute pureté', 'Alta pureza', 'Wysoka czystość')
};
var EX_LABELS = {
  cementMEA: T('Cement · MEA', 'Цемент · MEA', 'Zement · MEA', 'Cement · MEA', 'Ciment · MEA', 'Cemento · MEA', 'Cement · MEA'),
  cementCESAR1HP: T('Cement · CESAR1 HP', 'Цемент · CESAR1 HP', 'Zement · CESAR1 HP', 'Cement · CESAR1 HP', 'Ciment · CESAR1 HP', 'Cemento · CESAR1 HP', 'Cement · CESAR1 HP'),
  wteMEA: T('Waste-to-energy · MEA', 'Сміттєспалювання · MEA', 'Müllverbrennung · MEA', 'Afvalverbranding · MEA', 'Valorisation déchets · MEA', 'Valorización energética · MEA', 'Spalarnia odpadów · MEA'),
  steelBF: T('Steel · blast furnace', 'Сталь · доменна піч', 'Stahl · Hochofen', 'Staal · hoogoven', 'Acier · haut fourneau', 'Acero · alto horno', 'Stal · wielki piec'),

  ngccKS21: T('NGCC · KS-21', 'ПГУ · KS-21', 'GuD · KS-21', 'STEG · KS-21', 'CCG · KS-21', 'Ciclo combinado · KS-21', 'Blok gazowo-parowy · KS-21'),

  bioethanol: T('Bioethanol', 'Біоетанол', 'Bioethanol', 'Bio-ethanol', 'Bioéthanol', 'Bioetanol', 'Bioetanol')

function EXAMPLES() {
  var presets = CCUS.capture.presets;
  return Object.keys(presets).map(function (id) {
    var p = presets[id];
    return {
      id: id, group: GROUPS[p.group], label: EX_LABELS[id] || p.label, note: p.label,
      apply: function (t) {
        var k;
        for (k in DEFAULTS) if (DEFAULTS.hasOwnProperty(k)) t[k] = DEFAULTS[k];
        for (k in p.inp) if (p.inp.hasOwnProperty(k)) t[k] = p.inp[k];
        t.ownOps = (p.inp.alphaLean != null || p.inp.pStr != null);
        if (p.inp.pStr != null) t.pStr = p.inp.pStr;
      }
    };
  });
}

function STAGE_RENDER(size, st, last, eta) {
  var ctx = st.canvas(), w = size.w, h = size.h;
  ctx.clearRect(0, 0, w, h);
  if (!last || !last.curve || last.curve.length < 2) return;
  var cs = getComputedStyle(document.documentElement);
  var muted = cs.getPropertyValue('--muted').trim() || '#888';
  var line = cs.getPropertyValue('--line').trim() || '#ccc';
  var font = cs.getPropertyValue('--font').trim() || 'sans-serif';
  var pct = function (v) { return v <= 1.5 ? v * 100 : v; };
  var L = 52, R = 12, Tp = 12, B = 30, pw = w - L - R, ph = h - Tp - B;
  if (pw <= 0 || ph <= 0) return;
  var xMin = 50, xMax = 98, yMin = 0, yMax = -Infinity, i, v, c = last.curve;
  for (i = 0; i < c.length; i++) {
    if (c[i].perTonne != null && isFinite(c[i].perTonne)) yMax = Math.max(yMax, c[i].perTonne);
    if (c[i].perAvoided != null && isFinite(c[i].perAvoided)) yMax = Math.max(yMax, c[i].perAvoided);
  }
  if (!isFinite(yMax) || yMax <= 0) yMax = 100;
  yMax *= 1.08;
  var X = function (x) { return L + (x - xMin) / (xMax - xMin) * pw; };
  var Y = function (y) { return Tp + ph - (y - yMin) / (yMax - yMin) * ph; };
  ctx.font = '11px ' + font; ctx.lineWidth = 1;
  var yt = DiagramUI.ticks(yMin, yMax, ph, size.density), xt = DiagramUI.ticks(xMin, xMax, pw, size.density);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (i = 0; i < yt.length; i++) {
    v = yt[i]; if (v < yMin || v > yMax) continue;
    ctx.strokeStyle = line; ctx.beginPath(); ctx.moveTo(L, Y(v) + 0.5); ctx.lineTo(L + pw, Y(v) + 0.5); ctx.stroke();
    ctx.fillStyle = muted; ctx.fillText(DiagramUI.fmt(v, { precision: 0 }), L - 6, Y(v));
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (i = 0; i < xt.length; i++) {
    v = xt[i]; if (v < xMin || v > xMax) continue;
    ctx.fillStyle = muted; ctx.fillText(DiagramUI.fmt(v, { precision: 0 }) + '%', X(v), Tp + ph + 6);
  }
  ctx.strokeStyle = muted; ctx.beginPath();
  ctx.moveTo(L + 0.5, Tp); ctx.lineTo(L + 0.5, Tp + ph + 0.5); ctx.lineTo(L + pw, Tp + ph + 0.5); ctx.stroke();
  ctx.save(); ctx.translate(12, Tp + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textBaseline = 'middle';
  ctx.fillText('EUR/t', 0, 0); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(L, Tp, pw, ph); ctx.clip();
  var draw = function (key, idx, dash) {
    var started = false;
    ctx.strokeStyle = DiagramUI.series(idx); ctx.lineWidth = 2; ctx.setLineDash(dash ? [6, 4] : []);
    ctx.beginPath();
    for (var j = 0; j < c.length; j++) {
      var yv = c[j][key], xv = c[j].eta;
      if (yv == null || xv == null || !isFinite(yv)) { started = false; continue; }
      if (!started) { ctx.moveTo(X(pct(xv)), Y(yv)); started = true; } else ctx.lineTo(X(pct(xv)), Y(yv));
    }
    ctx.stroke();
  };
  draw('perTonne', 0, false);
  draw('perAvoided', 1, true);
  if (eta != null && isFinite(eta)) {
    var ex = X(pct(eta));
    ctx.strokeStyle = muted; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(ex, Tp); ctx.lineTo(ex, Tp + ph); ctx.stroke();
  }
  ctx.setLineDash([]); ctx.restore();
}

var LEGEND = function () {
  return [
    { label: T('Cost per t captured', 'Вартість за т уловленого', 'Kosten pro t abgeschieden', 'Kosten per t afgevangen', 'Coût par t captée', 'Coste por t capturada', 'Koszt na t wychwyconą'), series: 0 },
    { label: T('Cost per t avoided', 'Вартість за т уникненого', 'Kosten pro t vermieden', 'Kosten per t vermeden', 'Coût par t évitée', 'Coste por t evitada', 'Koszt na t unikniętą'), series: 1, dash: true }
  ];
};


  function adoptStage(app) { stage = app.stages[0] || null; if (stage) stage.legend({ items: LEGEND() }); }

  function degrade() {
    document.title = 'diagram-ui.js v1 is required';
    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1'); h.textContent = 'Amine CO2 capture screening';
    var p = document.createElement('p');
    p.textContent = 'The interactive interface could not load. The export, the calculation record and the limitations are still available from the bar at the bottom of the page.';
    host.appendChild(h); host.appendChild(p);
    if (window.CCUS && CCUS.capture) run(state);
  }

  function boot() {
    if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1' && window.CCUS && CCUS.capture) buildInterface();
    else degrade();
    installData();
  }

  function buildInterface() {
    ui = DiagramUI.app({
      id: 'aminecapture', mount: '#app', layout: 'calculator', compute: 'live',
      state: state, defaults: DEFAULTS,
      subtitle: MAN.summary,
      notices: [{ id: 'genre', tone: 'warn', sticky: true,
        title: T('What this number is', 'Що це за число', 'Was diese Zahl ist', 'Wat dit getal is', 'Ce que représente ce nombre', 'Qué es este número', 'Czym jest ta liczba'),
        text: MAN.limitations }],
      learn: {
        version: 1,
        intro: LEARN.intro,
        topics: (function () { var o = {}, k; for (k in LEARN) if (k !== 'intro') o[k] = LEARN[k]; return o; })(),
        tour: [
          { topic: 'fraction', focus: '[data-dgu-field="f-y"]' },
          { topic: 'rate', focus: '[data-dgu-field="f-eta"]' },
          { topic: 'solvents', focus: '[data-dgu-field="f-solvent"]' },
          { topic: 'heat', focus: '[data-dgu-field="f-heat"]' },
          { topic: 'cost', focus: '.dgu-r-results' },
          { topic: 'avoided', focus: '.dgu-stage' }
        ]
      },
      panels: PANELS(),
      footer: MAN.description,
      on: {
        rebuild: adoptStage,
        compute: function (s) { run(s); if (stage) stage.schedule(); return COMPUTE(s, last); }
      }
    });
    ui.panel({ id: 'io', slot: 'inputs', actionsAlign: 'end', actions: [
      ui.importAction({
        label: T('Open a saved case…','Відкрити збережений випадок…','Gespeicherten Fall öffnen…','Opgeslagen geval openen…','Ouvrir un cas enregistré…','Abrir un caso guardado…','Otwórz zapisany przypadek…'),
        accept: '.json,application/json', as: 'json',
        run: function (data) {
          var src = (data && data.inputs) || data || {};
          Object.keys(DEFAULTS).forEach(function (k) { if (src[k] !== undefined && src[k] !== null && typeof src[k] === typeof DEFAULTS[k]) state[k] = src[k]; });
          ui.sync(); ui.run();
        }
      }),
      ui.resetAction()
    ]});
    ui.examples(EXAMPLES());
    ui.stage({
      caption: T('Capture cost against capture rate','Вартість уловлення залежно від ступеня','Abscheidekosten über Abscheidegrad','Afvangkosten tegen afvanggraad','Coût de captage selon le taux','Coste de captura frente a tasa','Koszt wychwytu w funkcji stopnia'),
      minHeight: 260,
      a11y: function () {
        if (!last || !last.ok) return '';
        return 'Cost per tonne captured against capture rate from 50 to 98 percent; at ' +
          DiagramUI.fmt(state.eta * 100, { precision: 0 }) + ' percent it is ' + DiagramUI.fmt(last.perTonne.total, { precision: 0 }) + ' EUR per tonne.';
      },
      render: function (size, st) { STAGE_RENDER(size, st, last && last.ok ? last : null, state.eta); }
    });
    adoptStage(ui);
    ui.ready();
    window.__aminecapture = { ui: ui, state: state, run: run, toInp: toInp };
  }

  function q(v, u) { return { value: v, unit: u }; }
  function installData() {
    if (!window.Diagram) return;
    Diagram.init({
      id: 'aminecapture', file: 'aminecapture.html',
      state: {
        serialize: function () { return state; },
        deserialize: function (o) { Object.assign(state, o || {}); if (window.CCUS && CCUS.capture) run(state); if (ui) { ui.sync(); ui.run(); } }
      },
      record: function () {
        if (!last || !last.ok) return null;
        var inp = toInp(state);
        return {
          inputs: inp,
          outputs: { m_captured: last.mdot, q_reb: last.E, Q_reb: last.Qreb, P_aux: last.Paux, e_aux: last.eAux,
            Q_cool: last.Qcool, steam: last.steam, capex: last.capex, cost_captured: last.perTonne.total,
            cost_avoided: last.perAvoided, avoided_fraction: last.avoidedFrac, absorber_trains: last.sizing.nTrains || 0,
            absorber_D: last.sizing.Dabs || 0 },
          units: { mdotSrc: 'kg/s', y: '-', eta: '-', fanDp: 'Pa', pStr: 'Pa', hours: 'h/y', steamPrice: 'EUR/GJ', gasPrice: 'EUR/MWh',
            elecPrice: 'EUR/MWh', co2Price: 'EUR/t', cwPrice: 'EUR/GJ', gridEF: 't/MWh',
            m_captured: 'kg/s', q_reb: 'J/kg', Q_reb: 'W', P_aux: 'W', e_aux: 'J/kg', Q_cool: 'W', steam: 'kg/s', capex: 'EUR',
            cost_captured: 'EUR/t', cost_avoided: 'EUR/t', avoided_fraction: '-', absorber_trains: '-', absorber_D: 'm' },
          model: {
            equations: ['q_reb [GJ/t] = (3.45 + 1.2/y%) f_eta f_s f_LL f_P', 'f_eta = 1 + 1.5 max(0, eta - 0.90)',
              'P_fan = V_flue dp / eta_fan', 'CAPEX = 350 MEUR x capexFactor x (0.5 F^0.65 + 0.5 S^0.65)',
              'cost = (CAPEX CRF + O&M + heat + electricity + solvent + cooling) / captured'],
            ranges: ['flue CO2 3-30 mol% (amine), >= 90 mol% high-purity branch; capture 50-98 %'],
            notes: ['indicative literature correlations (IEAGHG 2019-09, NETL Rev4, Moser 2020, Rochelle 2011); not independently validated']
          },
          warnings: last.warnings || []
        };
      },
      handoff: {
        provides: ['mdot', 'E', 'Q', 'x'],
        accepts: ['mdot', 'x'],
        build: function () {
          if (!last || !last.ok) return null;
          return {
            quantities: { mdot: q(last.mdot, 'kg/s'), E: q(last.E, 'J/kg'), Q: q(last.Paux, 'W'), x: q(state.y, '-') },
            sets: { capture: [ { mdot: q(last.mdot, 'kg/s') }, { E: q(last.E, 'J/kg') }, { Q: q(last.Paux, 'W') }, { x: q(state.y, '-') } ] }
          };
        },
        apply: function (p) {
          var qq = (p && p.quantities) || {};
          if (qq.mdot && qq.mdot.value > 0) state.mdotSrc = qq.mdot.value;
          if (qq.x && qq.x.value > 0 && qq.x.value <= 1) state.y = qq.x.value;
          if (window.CCUS && CCUS.capture) run(state);
          if (ui) { ui.sync(); ui.run(); }
        }
      }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
