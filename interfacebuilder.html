function compute(){ensureSelection();var s=summary(),total=state.interfaces.length,open=s.findings.length,defined=s.counts.defined,tone=total===0?'warn':(s.counts.underdefined||s.conflicts?'bad':(s.counts.partial?'warn':'ok'));scheduleStages();return {verdict:{tone:tone,text:total===0?T('Add an interface to start the review.','Додайте інтерфейс, щоб почати перевірку.','Fügen Sie eine Schnittstelle hinzu.','Voeg een interface toe.','Ajoutez une interface.','Añada una interfaz.','Dodaj interfejs.'):T(defined+' of '+total+' boundaries are definition-ready; '+s.conflicts+' compatibility conflicts and '+open+' findings remain.',defined+' з '+total+' меж готові; лишилося '+s.conflicts+' конфліктів сумісності та '+open+' зауважень.',defined+' von '+total+' Grenzen sind definitionsreif; '+s.conflicts+' Kompatibilitätskonflikte und '+open+' Befunde bleiben offen.',defined+' van '+total+' grenzen zijn gereed; '+s.conflicts+' compatibiliteitsconflicten en '+open+' bevindingen blijven open.',defined+' frontières sur '+total+' sont prêtes; '+s.conflicts+' conflits de compatibilité et '+open+' constats restent ouverts.',defined+' de '+total+' límites están listos; quedan '+s.conflicts+' conflictos de compatibilidad y '+open+' hallazgos.',defined+' z '+total+' granic jest gotowych; pozostaje '+s.conflicts+' konfliktów zgodności i '+open+' ustaleń.')},tiles:[{label:T('Ready boundaries','Готові межі','Reife Grenzen','Gereed','Frontières prêtes','Límites listos','Gotowe granice'),value:s.counts.defined,precision:0,tone:s.counts.defined?'ok':''},{label:T('Compatibility conflicts','Конфлікти сумісності','Kompatibilitätskonflikte','Compatibiliteitsconflicten','Conflits de compatibilité','Conflictos de compatibilidad','Konflikty zgodności'),value:s.conflicts,precision:0,learn:'compatibility',tone:s.conflicts?'bad':'ok'},{label:'TBD',value:s.tbd,precision:0,learn:'states',tone:s.tbd?'warn':''},{label:T('Unknown','Невідомо','Unbekannt','Onbekend','Inconnu','Desconocido','Nieznane'),value:s.unknown,precision:0,tone:s.unknown?'warn':''},{label:T('Open findings','Відкриті зауваження','Offene Befunde','Open bevindingen','Constats ouverts','Hallazgos abiertos','Otwarte ustalenia'),value:open,precision:0,learn:'evidence',tone:open?'warn':'ok'}],tables:[{title:T('Priority findings','Пріоритетні зауваження','Prioritäre Befunde','Prioritaire bevindingen','Constats prioritaires','Hallazgos prioritarios','Priorytetowe ustalenia'),head:[T('Interface / item','Інтерфейс / елемент','Schnittstelle / Punkt','Interface / item','Interface / élément','Interfaz / elemento','Interfejs / element'),T('Severity','Важливість','Priorität','Ernst','Sévérité','Severidad','Waga'),T('Finding','Зауваження','Befund','Bevinding','Constat','Hallazgo','Ustalenie')],rows:s.findings.slice().sort(function(a,b){return (a.severity==='required'?0:1)-(b.severity==='required'?0:1);}).slice(0,15).map(function(z){return {cells:[(z.interfaceName||'')+(z.itemName?' / '+z.itemName:''),pick(z.severity==='required'?T('Required','Обов’язково','Erforderlich','Vereist','Requis','Requerido','Wymagane'):T('Recommended','Рекомендовано','Empfohlen','Aanbevolen','Recommandé','Recomendado','Zalecane')),pick(z.message)]};})}],notes:[T('Green/amber/red describe definition state. Compatibility is evaluated separately and can keep an otherwise complete boundary red.','Зелений/жовтий/червоний показують стан визначення. Сумісність оцінюється окремо й може залишити повну межу червоною.','Grün/Gelb/Rot zeigen den Definitionszustand. Kompatibilität wird separat bewertet und kann eine sonst vollständige Grenze rot halten.','Groen/geel/rood tonen definitiestatus. Compatibiliteit wordt apart beoordeeld en kan een verder complete grens rood houden.','Vert/ambre/rouge indiquent l’état de définition. La compatibilité est évaluée séparément.','Verde/ámbar/rojo indican el estado de definición. La compatibilidad se evalúa por separado.','Zielony/bursztynowy/czerwony oznaczają stan definicji. Zgodność jest oceniana osobno.') ]};}
function build(){ui=DiagramUI.app({id:'interfacebuilder',mount:'#app',layout:'studio',compute:'live',state:state,defaults:DEFAULTS,subtitle:T('Define the boundary, compare both sides, close the evidence','Визначте межу, зіставте сторони, закрийте доказ','Grenze definieren, Seiten vergleichen, Nachweis schließen','Definieer de grens, vergelijk beide zijden, sluit bewijs','Définir la frontière, comparer les deux côtés, clore la preuve','Definir el límite, comparar ambos lados, cerrar la evidencia','Zdefiniuj granicę, porównaj strony, zamknij dowód'),notices:[{id:'scope',tone:'info',title:T('Method, not compliance','Метод, не відповідність','Methode, kein Nachweis','Methode, geen conformiteit','Méthode, pas conformité','Método, no conformidad','Metoda, nie zgodność'),text:T('This studio structures interface definition and compatibility review. It does not certify compliance and does not replace controlled project interface documents.','Студія структурує визначення та перевірку сумісності інтерфейсів. Вона не підтверджує відповідність і не замінює контрольовані документи проєкту.','Das Studio strukturiert Definition und Kompatibilitätsprüfung; es bescheinigt keine Konformität und ersetzt keine gelenkten Projektdokumente.','De studio structureert definitie en compatibiliteitsreview; hij certificeert geen conformiteit en vervangt geen beheerde projectdocumenten.','Le studio structure la définition et la revue de compatibilité ; il ne certifie pas la conformité et ne remplace pas les documents maîtrisés.','El estudio estructura la definición y revisión de compatibilidad; no certifica conformidad ni sustituye documentos controlados.','Studio porządkuje definicję i ocenę zgodności; nie potwierdza zgodności formalnej i nie zastępuje kontrolowanych dokumentów.')}],learn:{version:2,topics:{ boundary:{title:T('The boundary is the stable object','Межа — це стабільний обʼєкт','Die Grenze ist das stabile Objekt','De grens is het stabiele object','La frontière est l’objet stable','El límite es el objeto estable','Granica jest obiektem stabilnym'),  body:T('Name the physical or organisational cut once, then decompose what crosses it into interface items. Renaming a package does not move the boundary; adding an item does not create a new one.','Назвіть фізичний або організаційний розріз один раз, а те, що його перетинає, розкладіть на елементи. Перейменування пакета не зсуває межу; додавання елемента не створює нової.','Den physischen oder organisatorischen Schnitt einmal benennen und das Übergehende in Punkte zerlegen. Ein Paket umzubenennen verschiebt die Grenze nicht; ein Punkt erzeugt keine neue.','Benoem de fysieke of organisatorische snede één keer en splits wat er overheen gaat in items. Een pakket hernoemen verplaatst de grens niet; een item maakt geen nieuwe.','Nommez une fois la coupe physique ou organisationnelle, puis décomposez ce qui la traverse en éléments. Renommer un lot ne déplace pas la frontière ; ajouter un élément n’en crée pas une.','Nombre una vez el corte físico u organizativo y descomponga lo que lo cruza en elementos. Renombrar un paquete no mueve el límite; añadir un elemento no crea otro.','Nazwij raz przekrój fizyczny lub organizacyjny, a to, co go przecina, rozłóż na elementy. Zmiana nazwy pakietu nie przesuwa granicy; dodanie elementu nie tworzy nowej.')}, compatibility:{title:T('Definition state and compatibility are separate','Стан визначення й сумісність — різні речі','Definitionsstand und Kompatibilität sind getrennt','Definitiestatus en compatibiliteit staan los','État de définition et compatibilité sont distincts','Estado de definición y compatibilidad son distintos','Stan definicji i zgodność to co innego'),  body:T('A boundary can carry every field and still fail: the provider envelope has to sit inside what the receiver accepts. Colour on the matrix reports definition state; a compatibility conflict is reported on its own tile and keeps a complete boundary red.','Межа може мати всі поля й усе одно не проходити: діапазон постачальника має вміщатися в те, що приймає отримувач. Колір матриці показує стан визначення; конфлікт сумісності має власну плитку й лишає повну межу червоною.','Eine Grenze kann alle Felder tragen und trotzdem scheitern: die Lieferantenhüllkurve muss in die Empfängerannahme passen. Die Matrixfarbe zeigt den Definitionsstand; ein Kompatibilitätskonflikt hat eine eigene Kachel und hält eine vollständige Grenze rot.','Een grens kan alle velden hebben en toch falen: de leveranciersenvelop moet binnen de ontvangeracceptatie liggen. Matrixkleur toont de definitiestatus; een compatibiliteitsconflict krijgt een eigen tegel en houdt een volledige grens rood.','Une frontière peut porter tous les champs et échouer : l’enveloppe fournisseur doit tenir dans ce que le récepteur accepte. La couleur de la matrice indique l’état de définition ; un conflit de compatibilité a sa propre tuile et maintient une frontière complète en rouge.','Un límite puede llevar todos los campos y aun así fallar: la envolvente del proveedor debe caber en lo que acepta el receptor. El color de la matriz indica el estado de definición; un conflicto de compatibilidad tiene su propia casilla y mantiene en rojo un límite completo.','Granica może mieć wszystkie pola i mimo to nie przejść: obwiednia dostawcy musi mieścić się w tym, co przyjmuje odbiorca. Kolor macierzy pokazuje stan definicji; konflikt zgodności ma własny kafelek i utrzymuje kompletną granicę na czerwono.')}, states:{title:T('Unknown, TBD and N/A are three answers','Unknown, TBD і N/A — три різні відповіді','Unbekannt, TBD und N/Z sind drei Antworten','Onbekend, TBD en N.v.t. zijn drie antwoorden','Inconnu, TBD et N/A sont trois réponses','Desconocido, TBD y N/A son tres respuestas','Nieznane, TBD i N/D to trzy odpowiedzi'),  body:T('Unknown means nobody has looked. TBD means somebody owns it and it is not yet fixed. N/A means it does not apply, and it requires a reason. The rules tighten as the lifecycle state advances: what is acceptable at concept blocks at commissioning.','Unknown означає, що ніхто не дивився. TBD означає, що є власник і значення ще не зафіксоване. N/A означає «не застосовується» і потребує обґрунтування. Вимоги зростають зі стадією: прийнятне на концепції блокує на пусконаладці.','Unbekannt heißt: niemand hat nachgesehen. TBD heißt: jemand ist zuständig und der Wert steht noch nicht fest. N/Z heißt: nicht anwendbar, mit Begründung. Die Regeln verschärfen sich mit der Lebenszyklusphase: was im Konzept zulässig ist, blockiert bei der Inbetriebnahme.','Onbekend betekent dat niemand heeft gekeken. TBD betekent dat iemand eigenaar is en de waarde nog niet vaststaat. N.v.t. betekent niet van toepassing en vraagt een reden. De regels worden strenger per fase: wat bij concept mag, blokkeert bij inbedrijfstelling.','Inconnu signifie que personne n’a regardé. TBD signifie qu’un responsable existe et que la valeur n’est pas figée. N/A signifie non applicable et exige une justification. Les règles se durcissent avec la phase : ce qui passe en concept bloque en mise en service.','Desconocido significa que nadie lo ha mirado. TBD significa que hay responsable y el valor no está fijado. N/A significa no aplicable y exige justificación. Las reglas se endurecen con la fase: lo admisible en concepto bloquea en puesta en marcha.','Nieznane znaczy, że nikt nie sprawdził. TBD znaczy, że jest właściciel, a wartość nie jest ustalona. N/D znaczy: nie dotyczy, i wymaga uzasadnienia. Reguły zaostrzają się wraz z fazą: to, co dopuszczalne na koncepcji, blokuje przy rozruchu.')}, evidence:{title:T('An interface closes on evidence','Інтерфейс закривається доказом','Eine Schnittstelle schließt mit Nachweis','Een interface sluit op bewijs','Une interface se clôt sur une preuve','Una interfaz se cierra con evidencia','Interfejs zamyka się dowodem'),  body:T('Each item needs a verification method, an owner for that verification and the record it produces. A boundary where both sides claim ownership, or neither owns verification, stays open however completely the fields are filled.','Кожен елемент потребує методу перевірки, власника цієї перевірки та запису, який вона дає. Межа, де обидві сторони претендують на власність або де перевірку не має ніхто, лишається відкритою, хоч би як повно заповнені поля.','Jeder Punkt braucht ein Nachweisverfahren, einen Verantwortlichen dafür und den entstehenden Beleg. Eine Grenze, bei der beide Seiten die Zuständigkeit beanspruchen oder niemand den Nachweis verantwortet, bleibt offen, wie vollständig die Felder auch sind.','Elk item heeft een verificatiemethode, een eigenaar daarvan en het resulterende bewijs nodig. Een grens waar beide zijden eigenaarschap claimen of waar niemand verificatie bezit, blijft open hoe volledig de velden ook zijn.','Chaque élément exige une méthode de vérification, un responsable de celle-ci et l’enregistrement produit. Une frontière où les deux côtés revendiquent la responsabilité, ou dont personne ne porte la vérification, reste ouverte quelle que soit la complétude des champs.','Cada elemento necesita un método de verificación, un responsable del mismo y el registro que produce. Un límite donde ambos lados reclaman la titularidad, o donde nadie posee la verificación, sigue abierto por completos que estén los campos.','Każdy element wymaga metody weryfikacji, jej właściciela i powstającego zapisu. Granica, w której obie strony roszczą sobie własność albo nikt nie odpowiada za weryfikację, pozostaje otwarta, choćby pola były kompletne.')}},tour:[{topic:'boundary',focus:'[data-dgu-field="f-interfaces"]'},{topic:'compatibility',focus:'[data-dgu-field="f-items"]'},{topic:'evidence',focus:'.dgu-r-results'}],intro:{title:T('From completeness to compatibility','Від повноти до сумісності','Von Vollständigkeit zu Kompatibilität','Van volledigheid naar compatibiliteit','De la complétude à la compatibilité','De completitud a compatibilidad','Od kompletności do zgodności'),body:T('A useful interface register does two jobs: it exposes what is not yet defined, and it checks whether the provider can actually satisfy what the receiver accepts or requires. Keep the boundary stable; decompose what crosses it into interface items.','Корисний реєстр робить дві речі: показує невизначене й перевіряє, чи може постачальник реально задовольнити вимоги/приймання отримувача. Межу тримайте стабільною, а те, що її перетинає, декомпонуйте на елементи.','Ein gutes Register zeigt sowohl Definitionslücken als auch, ob der Lieferant die Empfängeranforderung tatsächlich erfüllt. Grenze stabil halten; Übergaben in Punkte zerlegen.','Een goed register toont zowel definitiegaten als of de leverancier werkelijk aan de ontvangerseis voldoet. Houd de grens stabiel en splits overdrachten in items.','Un bon registre révèle les lacunes et vérifie si le fournisseur satisfait réellement le récepteur. Garder la frontière stable et décomposer les transferts en éléments.','Un buen registro revela vacíos y comprueba si el proveedor satisface realmente al receptor. Mantenga estable el límite y descomponga las transferencias.','Dobry rejestr pokazuje braki i sprawdza, czy dostawca rzeczywiście spełnia wymagania odbiorcy. Utrzymuj stałą granicę i rozkładaj transfery na elementy.')}},panels:[

/* structure.packages[] (§2.2). This tool holds a free-text system name with no
   relation to any system id, so it fills `system_name` and leaves `system_id`
   empty. Never put a name in an id field: a downstream tool cannot tell the
   difference and will match against nothing. */
function pkgPackagesOut(s){

  return { id:String(p.id||''), name:String(p.name||''), system_id:'', system_name:String(p.system||''),

           organisation:String(p.organisation||''), discipline:String(p.discipline||''), lead:String(p.lead||'') };
 });
}

/* A package interface row, rebuilt through this tool's own factories. Never
   hand-built: blankInterface()/blankItem() carry keys a literal would miss, and
   migrate()'s legacy branch blanks interfaceOwner on any object without items. */
function pkgIfaceRow(x){
 var n=Object.assign(blankInterface(),x);
 n.items=(Array.isArray(x.items)?x.items:[]).map(function(it){ return Object.assign(blankItem(),it); });
 if(!n.items.length) n.items=[blankItem()];
 n.selectedItemId=n.items[0].id;
 return n;
}

/* Apply what this tool reads. Called only from the Load button (§3.1). */
function pkgApply(p,target){
 var st=target||state;
 var applied=[],unmapped=[],replaced=[],notes=[];
 function setField(labelKey,key,value){
  var was=st[key];
  if(String(was)===String(value)) return;
  if(String(was||'').trim()) replaced.push(Pt(labelKey)+': “'+String(was)+'” → “'+String(value)+'”');
  st[key]=value; applied.push(Pt(labelKey));
 }
 var pr=p&&p.project;
 if(pr&&typeof pr==='object'){
  if(pr.name!=null) setField('field_project','project',String(pr.name||''));
  if(pr.lifecycle!=null&&String(pr.lifecycle)){
   var ph=Object.prototype.hasOwnProperty.call(PKG_PHASE_FROM,String(pr.lifecycle))?PKG_PHASE_FROM[String(pr.lifecycle)]:null;
   if(ph) setField('field_phase','phase',ph);
   else unmapped.push(Pt('field_phase')+': '+String(pr.lifecycle));
  }
 }
 var stc=p&&p.structure;
 if(stc&&typeof stc==='object'&&Array.isArray(stc.packages)&&stc.packages.length){
  var was=(st.packages||[]).length;
  st.packages=pkgPackagesIn(stc.packages);
  applied.push(Pt('field_packages'));
  if(was) replaced.push(Pt('field_packages')+': '+was+' → '+st.packages.length);
  notes.push(Pt('packages_in',{n:st.packages.length}));
 }
 if(stc&&typeof stc==='object'&&Array.isArray(stc.systems)&&stc.systems.length) notes.push(Pt('systems_seen',{n:stc.systems.length}));
 /* §6 item 5 — read back what you write, and APPLY it. Rows are built through
    this tool's own blankInterface()/blankItem() factories, never by hand, so a
    row from the package carries every key the factory produces. */
 if(Array.isArray(p&&p.interfaces)&&p.interfaces.length){
  var wasIf=(st.interfaces||[]).length;
  st.interfaces=pkgInterfacesIn(p.interfaces).map(pkgIfaceRow);
  applied.push(Pt('field_interfaces'));
  if(wasIf) replaced.push(Pt('field_interfaces')+': '+wasIf+' → '+st.interfaces.length);
  notes.push(Pt('interfaces_in',{n:st.interfaces.length}));
 }
 /* §2.3 — the flags travelling with the package are kept verbatim and displayed;
    nothing is dropped, filtered or rewritten (§6.3). */
 if(st===state){
  pkgFlags=Array.isArray(p&&p.flags)?deep(p.flags):[];
  pkgLoadedInterfaces=Array.isArray(p&&p.interfaces)?deep(p.interfaces):[];
 }
 if(p&&Array.isArray(p.flags)&&p.flags.length) notes.push(Pt('flags_reachable',{n:p.flags.length}));
 return { applied:applied, unmapped:unmapped, replaced:replaced, notes:notes };
}
