    stage = app.stages[0] || null;

  function computeView(s){
    last = solve(s); if (stage) stage.schedule();
    var r = last, e;
    if (!r || !r.ok) { e = (r && r.error) || 'Unknown error'; return { verdict: { tone: 'bad', text: trW(e) }, tiles: [], notes: [] }; }
    function fin(v){ return typeof v === 'number' && isFinite(v); }
    var tiles = [], notes = [], meters = [], tables = [], i, w, tone, text, ratio;
    function add(label, v, unit, learn, head, tone){ if (!fin(v)) return; tiles.push({ label: label, value: sigv(v, 4), hint: unit, precision: sig(v, 4), tone: tone || null, learn: learn, headline: !!head }); }
    function rd(v, n){ var k = Math.pow(10, n); return fin(v) ? Math.round(v * k) / k : null; }
    var full = s.level === 'full', st, row;
    if (r.verdict === 'ok') {
      tone = 'ok';
      text = T('Discharge temperatures within limit', 'Температури нагнітання в межах ліміту', 'Austrittstemperaturen innerhalb des Grenzwerts', 'Perstemperaturen binnen de limiet', 'Températures de refoulement dans la limite', 'Temperaturas de descarga dentro del límite', 'Temperatury tłoczenia w granicach limitu');
    } else {
      tone = 'warn';
      text = T('Discharge temperature above limit: add stages or cool more', 'Температура нагнітання вище ліміту: додайте ступені або посильте охолодження', 'Austrittstemperatur über dem Grenzwert: Stufen hinzufügen oder stärker kühlen', 'Perstemperatuur boven de limiet: voeg trappen toe of koel meer', 'Température de refoulement au-dessus de la limite : ajoutez des étages ou refroidissez davantage', 'Temperatura de descarga por encima del límite: añada etapas o enfríe más', 'Temperatura tłoczenia powyżej limitu: dodaj stopnie lub zwiększ chłodzenie');
    }
    add(T('P_shaft · shaft power', 'P_shaft · потужність на валу', 'P_shaft · Wellenleistung', 'P_shaft · asvermogen', 'P_shaft · puissance à l\'arbre', 'P_shaft · potencia en el eje', 'P_shaft · moc na wale'), fin(r.P_shaft) ? r.P_shaft / 1000 : NaN, 'kW', 'power', true);
    add(T('e_spec · specific energy', 'e_spec · питома енергія', 'e_spec · spezifische Energie', 'e_spec · specifieke energie', 'e_spec · énergie spécifique', 'e_spec · energía específica', 'e_spec · energia właściwa'), r.e_spec_kWh_kg, 'kWh/kg', 'power', true);
    add(T('T_d,max · max discharge temperature', 'T_d,max · макс. температура нагнітання', 'T_d,max · max. Austrittstemperatur', 'T_d,max · max. perstemperatuur', 'T_d,max · température de refoulement max.', 'T_d,max · temperatura de descarga máx.', 'T_d,max · maks. temperatura tłoczenia'), fin(r.T_d_max) ? r.T_d_max - 273.15 : NaN, '°C', 'temperature', false, (fin(r.T_d_max) && fin(s.T_max) && r.T_d_max > s.T_max) ? 'bad' : null);
    add(T('r_s · stage pressure ratio', 'r_s · відношення тисків ступеня', 'r_s · Stufendruckverhältnis', 'r_s · trapdrukverhouding', 'r_s · rapport de pression par étage', 'r_s · relación de presión por etapa', 'r_s · spręż stopnia'), r.rs, '-', 'staging');
    if (full) {
      add(T('Q_ic · total intercooler duty', 'Q_ic · загальне навантаження проміжних охолоджувачів', 'Q_ic · gesamte Zwischenkühlerleistung', 'Q_ic · totaal tussenkoelervermogen', 'Q_ic · puissance totale des refroidisseurs intermédiaires', 'Q_ic · potencia total de interrefrigeración', 'Q_ic · całkowita moc chłodnic międzystopniowych'), fin(r.Q_ic_total) ? r.Q_ic_total / 1000 : NaN, 'kW', 'intercooling');
      add(T('Z_in · inlet compressibility factor', 'Z_in · коефіцієнт стисливості на вході', 'Z_in · Realgasfaktor am Eintritt', 'Z_in · compressibiliteitsfactor inlaat', 'Z_in · facteur de compressibilité à l\'aspiration', 'Z_in · factor de compresibilidad de entrada', 'Z_in · współczynnik ściśliwości na wlocie'), r.Z_in, '-', 'eos');
      add(T('ρ_out · outlet density', 'ρ_out · густина на виході', 'ρ_out · Dichte am Austritt', 'ρ_out · dichtheid uitlaat', 'ρ_out · masse volumique au refoulement', 'ρ_out · densidad de salida', 'ρ_out · gęstość na wylocie'), r.rho_out, 'kg/m³', 'eos');
      add(T('η_iso · isothermal efficiency', 'η_iso · ізотермічний ККД', 'η_iso · isothermer Wirkungsgrad', 'η_iso · isotherm rendement', 'η_iso · rendement isotherme', 'η_iso · eficiencia isotérmica', 'η_iso · sprawność izotermiczna'), fin(r.eta_isothermal) ? r.eta_isothermal * 100 : NaN, '%', 'efficiency');
    }
    if (fin(r.T_d_max) && fin(s.T_max) && s.T_max > 0) {
      ratio = Math.min(r.T_d_max / s.T_max, 1.5);
      meters.push({ label: T('Discharge temperature / limit', 'Температура нагнітання / ліміт', 'Austrittstemperatur / Grenzwert', 'Perstemperatuur / limiet', 'Température de refoulement / limite', 'Temperatura de descarga / límite', 'Temperatura tłoczenia / limit'), ratio: ratio, text: DiagramUI.fmt(ratio, { precision: 3 }), tone: ratio > 1 ? 'bad' : 'ok' });
    }
    if (full && r.stages && r.stages.length) {
      row = [];
      for (i = 0; i < r.stages.length; i++) { st = r.stages[i]; row.push([st.i, rd(st.p_d / 1e5, 1), rd(st.T_d - 273.15, 1), rd(st.P / 1000, 2), rd(st.Q_ic / 1000, 2)]); }
      tables.push({ title: T('Stages', 'Ступені', 'Stufen', 'Trappen', 'Étages', 'Etapas', 'Stopnie'), head: [T('Stage', 'Ступінь', 'Stufe', 'Trap', 'Étage', 'Etapa', 'Stopień'), T('p_d, bar', 'p_d, бар', 'p_d, bar', 'p_d, bar', 'p_d, bar', 'p_d, bar', 'p_d, bar'), T('T_d, °C', 'T_d, °C', 'T_d, °C', 'T_d, °C', 'T_d, °C', 'T_d, °C', 'T_d, °C'), T('Power, kW', 'Потужність, кВт', 'Leistung, kW', 'Vermogen, kW', 'Puissance, kW', 'Potencia, kW', 'Moc, kW'), T('Intercooler, kW', 'Проміжний охолоджувач, кВт', 'Zwischenkühler, kW', 'Tussenkoeler, kW', 'Refroidisseur intermédiaire, kW', 'Interrefrigerador, kW', 'Chłodnica międzystopniowa, kW')], rows: row });
    }
    if (r.warnings && r.warnings.length) { for (i = 0; i < r.warnings.length; i++) { w = r.warnings[i]; notes.push(trW(w)); } }
    return { verdict: { tone: tone, text: text }, tiles: tiles, meters: meters, tables: tables, notes: notes };
  }

    host.appendChild(h);

    last = solve(state);
  }

          'Fíjese en e_spec: comprimir 1000 kg/día de 1 a 30 bar cuesta 2,00 kWh/kg, casi lo mismo que 30 → 900 bar (2,26 kWh/kg). El trabajo sigue la relación de presiones, no el aumento de presión, así que un electrolizador presurizado ahorra la mayor parte.',
          'Spójrz na e_spec: sprężenie 1000 kg/dobę z 1 do 30 bar kosztuje 2,00 kWh/kg, prawie tyle co 30 → 900 bar (2,26 kWh/kg). Praca sprężania zależy od sprężu, a nie od przyrostu ciśnienia, więc elektrolizer ciśnieniowy oszczędza jej większość.'),
        apply: function (t) { setEx(t, 1, 0.01157, 1e5, 3e6, 3); } },
      { id: 'hrs_700', label: T('HRS 700 bar (200 kg/day, 5 stages)', 'АЗС H₂ 700 бар (200 кг/добу, 5 ступенів)', 'H₂-Tankstelle 700 bar (200 kg/Tag, 5 Stufen)', 'Tankstation 700 bar (200 kg/dag, 5 trappen)', 'Station H₂ 700 bar (200 kg/jour, 5 étages)', 'Hidrogenera 700 bar (200 kg/día, 5 etapas)', 'Stacja H₂ 700 bar (200 kg/dobę, 5 stopni)'),
        note: T('Look at the stage table: a refuelling station filling 950 bar storage from 20 bar needs 2.45 kWh/kg, about 7 % of the hydrogen LHV, and even five stages leave stages 2-5 at 139-144 °C.',
          'Подивіться на таблицю ступенів: АЗС, що наповнює сховище 950 бар від 20 бар, потребує 2,45 кВт·год/кг, близько 7 % НТЗ водню, і навіть за п\'яти ступенів ступені 2-5 мають 139-144 °C.',
          'Achten Sie auf die Stufentabelle: eine Tankstelle, die einen 950-bar-Speicher ab 20 bar füllt, braucht 2,45 kWh/kg, etwa 7 % des Wasserstoff-Hu, und selbst mit fünf Stufen liegen die Stufen 2-5 bei 139-144 °C.',
          'Kijk naar de trappentabel: een tankstation dat 950 bar opslag vanaf 20 bar vult, heeft 2,45 kWh/kg nodig, ongeveer 7 % van de LHV van waterstof, en zelfs met vijf trappen zitten trappen 2-5 op 139-144 °C.',
          'Regardez le tableau des étages : une station qui remplit un stockage à 950 bar depuis 20 bar consomme 2,45 kWh/kg, environ 7 % du PCI de l\'hydrogène, et même avec cinq étages les étages 2 à 5 sont à 139-144 °C.',
          'Fíjese en la tabla de etapas: una hidrogenera que llena un almacenamiento a 950 bar desde 20 bar necesita 2,45 kWh/kg, cerca del 7 % del PCI del hidrógeno, e incluso con cinco etapas las etapas 2-5 quedan a 139-144 °C.',
          'Spójrz na tabelę stopni: stacja napełniająca magazyn 950 bar od 20 bar zużywa 2,45 kWh/kg, około 7 % wartości opałowej wodoru, a nawet przy pięciu stopniach stopnie 2-5 mają 139-144 °C.'),
        apply: function (t) { setEx(t, 1, 200 / 86400, 2e6, 9.5e7, 5); } },
      { id: 'pipeline_booster', label: T('Pipeline booster (30 → 100 bar, 1 stage)', 'Дотискувач трубопроводу (30 → 100 бар, 1 ступінь)', 'Pipeline-Booster (30 → 100 bar, 1 Stufe)', 'Pijpleidingbooster (30 → 100 bar, 1 trap)', 'Surpresseur de pipeline (30 → 100 bar, 1 étage)', 'Compresor de refuerzo de gasoducto (30 → 100 bar, 1 etapa)', 'Tłocznia rurociągowa (30 → 100 bar, 1 stopień)'),
        note: T('Look at P_shaft: a ratio of 3.3 costs only 0.72 kWh/kg, but at 1 kg/s that is 2.6 MW of shaft power, and the single stage reaches 197 °C.',
          'Подивіться на P_shaft: відношення 3,3 коштує лише 0,72 кВт·год/кг, але за 1 кг/с це 2,6 МВт на валу, а єдиний ступінь досягає 197 °C.',
          'Achten Sie auf P_shaft: ein Verhältnis von 3,3 kostet nur 0,72 kWh/kg, bei 1 kg/s sind das aber 2,6 MW Wellenleistung, und die einzige Stufe erreicht 197 °C.',
          'Kijk naar P_shaft: een verhouding van 3,3 kost maar 0,72 kWh/kg, maar bij 1 kg/s is dat 2,6 MW asvermogen, en de enige trap bereikt 197 °C.',
          'Regardez P_shaft : un rapport de 3,3 ne coûte que 0,72 kWh/kg, mais à 1 kg/s cela fait 2,6 MW à l\'arbre, et l\'étage unique atteint 197 °C.',
          'Fíjese en P_shaft: una relación de 3,3 cuesta solo 0,72 kWh/kg, pero a 1 kg/s son 2,6 MW en el eje, y la única etapa llega a 197 °C.',
          'Spójrz na P_shaft: spręż 3,3 kosztuje tylko 0,72 kWh/kg, ale przy 1 kg/s to 2,6 MW mocy na wale, a jedyny stopień osiąga 197 °C.'),
        apply: function (t) { setEx(t, 1, 1.0, 3e6, 1e7, 1); } },
      { id: 'blend_98', label: T('98 % H₂ blend (20 → 200 bar, 2 stages)', 'Суміш 98 % H₂ (20 → 200 бар, 2 ступені)', '98 % H₂-Gemisch (20 → 200 bar, 2 Stufen)', '98 % H₂-mengsel (20 → 200 bar, 2 trappen)', 'Mélange 98 % H₂ (20 → 200 bar, 2 étages)', 'Mezcla 98 % H₂ (20 → 200 bar, 2 etapas)', 'Mieszanina 98 % H₂ (20 → 200 bar, 2 stopnie)'),
        note: T('Look at e_spec: 2 mol % N₂ is 22 % of the mass, so the energy per kg of gas falls from 1.40 to 1.12 kWh/kg, while the discharge temperature stays at 198 °C because both gases are diatomic.',
          'Подивіться на e_spec: 2 мол. % N₂ — це 22 % маси, тож енергія на кг газу падає з 1,40 до 1,12 кВт·год/кг, а температура нагнітання лишається 198 °C, бо обидва гази двоатомні.',
          'Achten Sie auf e_spec: 2 mol-% N₂ sind 22 % der Masse, daher sinkt die Energie je kg Gas von 1,40 auf 1,12 kWh/kg, während die Austrittstemperatur bei 198 °C bleibt, da beide Gase zweiatomig sind.',
          'Kijk naar e_spec: 2 mol-% N₂ is 22 % van de massa, dus de energie per kg gas daalt van 1,40 naar 1,12 kWh/kg, terwijl de perstemperatuur 198 °C blijft omdat beide gassen tweeatomig zijn.',
          'Regardez e_spec : 2 % mol de N₂ font 22 % de la masse, donc l\'énergie par kg de gaz baisse de 1,40 à 1,12 kWh/kg, alors que la température de refoulement reste à 198 °C car les deux gaz sont diatomiques.',
          'Fíjese en e_spec: un 2 % molar de N₂ es el 22 % de la masa, así que la energía por kg de gas baja de 1,40 a 1,12 kWh/kg, mientras la temperatura de descarga sigue en 198 °C porque ambos gases son diatómicos.',
          'Spójrz na e_spec: 2 % mol N₂ to 22 % masy, więc energia na kg gazu spada z 1,40 do 1,12 kWh/kg, a temperatura tłoczenia pozostaje 198 °C, bo oba gazy są dwuatomowe.'),
        apply: function (t) { setEx(t, 0.98, 0.1, 2e6, 2e7, 2); } }
    ];
    function setEx(t, x, m, pi, po, n) { var s = t || state; s.x_h2 = x; s.mdot = m; s.p_in = pi; s.p_out = po; s.n = n; s.eta_s = 0.75; s.level = 'simple'; }
    ui.examples(EX);

    ui.stage({
      caption: T('Pressure and temperature through the stages', 'Тиск і температура по ступенях', 'Druck und Temperatur über die Stufen', 'Druk en temperatuur over de trappen', 'Pression et température à travers les étages', 'Presión y temperatura a lo largo de las etapas', 'Ciśnienie i temperatura w kolejnych stopniach'),
      minHeight: 300,
      a11y: function () {
        if (!last || !last.ok || !last.stages || !last.stages.length) return TL(NORES);
        var S = last.stages, m = -Infinity, i;
        for (i = 0; i < S.length; i++) if (S[i].T_d > m) m = S[i].T_d;
        return TL(TF(T('Compression in $1 stage(s); maximum discharge temperature $2 °C.', 'Стиснення у $1 ступен(і/ях); максимальна температура нагнітання $2 °C.', 'Verdichtung in $1 Stufe(n); maximale Austrittstemperatur $2 °C.', 'Compressie in $1 trap(pen); maximale perstemperatuur $2 °C.', 'Compression en $1 étage(s) ; température de refoulement maximale $2 °C.', 'Compresión en $1 etapa(s); temperatura máxima de descarga $2 °C.', 'Sprężanie w $1 stopniu(-ach); maksymalna temperatura tłoczenia $2 °C.'), [S.length, DiagramUI.fmt(m - 273.15, { precision: 3 })]));
      },
      render: function (size, st) {
        var ctx = st.canvas(), w = size.w, h = size.h, coarse = size.density === 'coarse';
        var cs = getComputedStyle(document.documentElement);
        var muted = cs.getPropertyValue('--muted').trim() || '#888', line = cs.getPropertyValue('--line').trim() || '#ccc', font = cs.getPropertyValue('--font').trim() || 'sans-serif';
        ctx.clearRect(0, 0, w, h);
        if (!last || !last.ok || !last.stages || !last.stages.length) return;
        var S = last.stages, pts = [], i, k, n = S.length;
        for (i = 0; i < n; i++) {
          if (i === 0) pts.push({ x: Math.log(S[0].p_s / 1e5) / Math.LN10, y: S[0].T_s - 273.15, d: false });
          pts.push({ x: Math.log(S[i].p_d / 1e5) / Math.LN10, y: S[i].T_d - 273.15, d: true });
          if (i < n - 1) pts.push({ x: Math.log(S[i + 1].p_s / 1e5) / Math.LN10, y: S[i + 1].T_s - 273.15, d: false });
        }
        var tmax = isFinite(state.T_max) ? state.T_max - 273.15 : null;
        var x0 = Infinity, x1 = -Infinity, y0 = tmax === null ? Infinity : tmax, y1 = tmax === null ? -Infinity : tmax;
        for (k = 0; k < pts.length; k++) { x0 = Math.min(x0, pts[k].x); x1 = Math.max(x1, pts[k].x); y0 = Math.min(y0, pts[k].y); y1 = Math.max(y1, pts[k].y); }
        if (x1 - x0 < 1e-6) { x0 -= 0.5; x1 += 0.5; }
        var dx = (x1 - x0) * 0.04; x0 -= dx; x1 += dx;
        var dy = (y1 - y0) || 10; y0 -= dy * 0.08; y1 += dy * 0.08;
        var L = coarse ? 46 : 58, R = 14, TOP = 12, B = coarse ? 36 : 44, pw = w - L - R, ph = h - TOP - B;
        if (pw <= 10 || ph <= 10) return;
        function X(v) { return L + (v - x0) / (x1 - x0) * pw; }
        function Y(v) { return TOP + ph - (v - y0) / (y1 - y0) * ph; }
        ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.beginPath();
        ctx.moveTo(L, TOP); ctx.lineTo(L, TOP + ph); ctx.lineTo(L + pw, TOP + ph); ctx.stroke();
        ctx.fillStyle = muted; ctx.font = (coarse ? 10 : 11) + 'px ' + font;
        var xt = DiagramUI.ticks(x0, x1, pw, size.density), yt = DiagramUI.ticks(y0, y1, ph, size.density);
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        for (k = 0; k < xt.length; k++) { if (xt[k] < x0 || xt[k] > x1) continue; var px = X(xt[k]);
          ctx.beginPath(); ctx.moveTo(px, TOP + ph); ctx.lineTo(px, TOP + ph + 4); ctx.stroke();
          ctx.fillText(DiagramUI.fmt(Math.pow(10, xt[k]), { precision: 0 }), px, TOP + ph + 6); }
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        for (k = 0; k < yt.length; k++) { if (yt[k] < y0 || yt[k] > y1) continue; var py = Y(yt[k]);
          ctx.beginPath(); ctx.moveTo(L - 4, py); ctx.lineTo(L, py); ctx.stroke();
          ctx.fillText(DiagramUI.fmt(yt[k], { precision: 0 }), L - 6, py); }
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText('p, bar (log)', L + pw / 2, h - 2);
        ctx.save(); ctx.translate(12, TOP + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textBaseline = 'middle'; ctx.fillText('T, °C', 0, 0); ctx.restore();
        ctx.save(); ctx.beginPath(); ctx.rect(L, TOP, pw, ph); ctx.clip();
        if (tmax !== null) { ctx.strokeStyle = muted; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(L, Y(tmax)); ctx.lineTo(L + pw, Y(tmax)); ctx.stroke(); ctx.setLineDash([]); }
        var col = DiagramUI.series(0); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.beginPath();
        for (k = 0; k < pts.length; k++) { if (k === 0) ctx.moveTo(X(pts[k].x), Y(pts[k].y)); else ctx.lineTo(X(pts[k].x), Y(pts[k].y)); }
        ctx.stroke(); ctx.fillStyle = col;
        for (k = 0; k < pts.length; k++) if (pts[k].d) { ctx.beginPath(); ctx.arc(X(pts[k].x), Y(pts[k].y), coarse ? 3 : 3.5, 0, 2 * Math.PI); ctx.fill(); }
        ctx.restore();
        if (tmax !== null) { ctx.fillStyle = muted; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText('T max', L + pw - 4, Y(tmax) - 2); }
      }
    });
    adoptStage(ui);

    ui.ready();
    window['__h2_compressor'] = { ui: ui, state: state, solve: solve, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function isPosNum(v) {
    return typeof v === 'number' && isFinite(v) && v > 0;
  }

  function buildRecord() {
    if (!last) return null;
    var inKeys = ['level', 'x_h2', 'mdot', 'p_in', 'T_in', 'p_out', 'n', 'eta_s', 'eta_m', 'T_ic', 'dp_ic', 'T_max'],
        outKeys = ['P_shaft', 'P_gas', 'e_spec_kWh_kg', 'T_d_max', 'Q_ic_total', 'r', 'rs', 'Z_in', 'rho_in', 'rho_out', 'eta_isothermal', 'verdict'],
        inputs = {}, outputs = {}, units = {}, warnings = [], i, k;
    var UNIT = {
      level: '-', x_h2: '-', mdot: 'kg/s', p_in: 'Pa', T_in: 'K', p_out: 'Pa', n: '-', eta_s: '-', eta_m: '-',
      T_ic: 'K', dp_ic: '-', T_max: 'K', P_shaft: 'W', P_gas: 'W', e_spec_kWh_kg: 'kWh/kg', T_d_max: 'K',
      T_d1: 'K', Q_ic_total: 'W', r: '-', rs: '-', Z_in: '-', rho_in: 'kg/m3', rho_out: 'kg/m3',
      eta_isothermal: '-', verdict: '-'
    };
    for (i = 0; i < inKeys.length; i++) { k = inKeys[i]; inputs[k] = state[k]; units[k] = UNIT[k]; }
    if (last.ok) {
      for (i = 0; i < outKeys.length; i++) { k = outKeys[i]; outputs[k] = last[k]; units[k] = UNIT[k]; }
      outputs.T_d1 = (last.stages && last.stages[0]) ? last.stages[0].T_d : null;
      units.T_d1 = UNIT.T_d1;
      warnings = (last.warnings || []).slice();
    } else {
      warnings = [last.error];
    }
    return {
      inputs: inputs, outputs: outputs, units: units,
      model: {
        equations: [
          'Equal stage ratio: rs = (p_out/p_in)^(1/n)',
          'dh_s from isentropic path on GERG-2008 / Leachman (2009) EOS (ISO 20765-2:2015)',
          'dh = dh_s/eta_s; T_d from h(T_d, p_d) = h_s + dh',
          'P_shaft = mdot*sum(dh)/eta_m',
          'Intercooler: Q = mdot*(h(T_d, p_d) - h(T_ic, p_d*(1 - dp_ic)))'
        ],
        ranges: ['T: 90-1000 K', 'p <= 100 MPa', 'H2 with up to 10 % N2'],
        notes: ['No aftercooler', 'No seal/leakage losses', 'Equal pressure ratios per stage']
      },
      warnings: warnings
    };
  }

  function hoRow(o) { var r = {}, k; for (k in o) if (typeof o[k][0] === 'number' && isFinite(o[k][0])) r[k] = { value: o[k][0], unit: o[k][1] }; return r; }

  var HANDOFF = {
    provides: ['mdot', 'p', 'T'],
    accepts: ['mdot', 'p', 'T'],
    build: function () {
      if (!last || !last.ok) return null;
      return {
        quantities: {
          mdot: { value: state.mdot, unit: 'kg/s' },
          p: { value: state.p_out, unit: 'Pa' },
          T: { value: state.T_ic, unit: 'K' }
        },
        sets: {
          compressor_train: [hoRow({ P_shaft: [last.P_shaft, 'W'], e_spec: [last.e_spec_kWh_kg * 3.6e6, 'J/kg'], n: [state.n, '-'], T_d_max: [last.T_d_max, 'K'] })],
          composition: [hoRow({ h2: [last.comp.h2, '-'], n2: [last.comp.n2, '-'] })]
        }
      };
    },
    apply: function (payload) {
      var q = payload && payload.quantities;
      if (q) {
        if (q.mdot && isPosNum(q.mdot.value)) state.mdot = q.mdot.value;
        if (q.p && isPosNum(q.p.value)) state.p_in = q.p.value;
        if (q.T && isPosNum(q.T.value)) state.T_in = q.T.value;
      }
      last = solve(state);
      if (ui) { ui.sync(); ui.run(); }
    }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'h2_compressor',
        file: 'h2_compressor.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
