(function () {

/* Variation & Time Impact Analysis — calculation core (pure functions, no DOM).

   analysis date with actual progress; finish-to-start logic; total float against the target (negative when late);
   critical activities, milestone and project shifts in working days; direct and time-related cost in cents; monthly
   cash flow; duration and cost ranges. The schedule result is kept apart from any contractual entitlement. */
var VT_VERSION = '2026-10-09.vt-3';
var VT_LINK_TYPES = ['FS', 'SS', 'FF'];
var VT_CONSTRAINTS = ['none', 'snet', 'fnlt'];
var VT_SCOPES = ['both', 'baseline', 'after'];
var VT_PROGRESS = ['not_started', 'in_progress', 'complete'];
var VT_PATTERNS = ['mon_fri', 'mon_sat', 'all'];
var VT_STATUS = ['confirmed', 'estimated', 'unknown'];
var VT_BASELINE = ['confirmed', 'rejected', 'unknown'];
var VT_DECISION = ['pending', 'approved', 'rejected'];
var VT_MAX_DUR = 2000;

function vtNum(v) { return typeof v === 'number' && isFinite(v) ? v : null; }
function vtText(v) { return v === null || v === undefined ? '' : String(v).trim(); }
function vtInt(v) { return vtNum(v) !== null && Math.floor(v) === v; }
function vtDay(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(vtText(s)); if (!m) return null; if (+m[1] < 1900 || +m[1] > 2999) return null; var t = Date.UTC(+m[1], +m[2] - 1, +m[3]), d = new Date(t);
  if (d.getUTCFullYear() !== +m[1] || d.getUTCMonth() !== +m[2] - 1 || d.getUTCDate() !== +m[3]) return null; return Math.round(t / 86400000); }
function vtIso(d) { return d === null ? null : new Date(d * 86400000).toISOString().slice(0, 10); }
function vtWork(d, c) { var i = (new Date(d * 86400000).getUTCDay() + 6) % 7; return c.week[i] === 1 && !c.hol[d]; }
function vtNext(d, c) { while (!vtWork(d, c)) d++; return d; }
/* the day after the n-th working day counted from d (d itself included); n = 0 gives d */
function vtAdv(d, n, c) { var k = 0; while (k < n) { if (vtWork(d, c)) k++; d++; } return d; }
/* n working days back from the boundary b; n = 0 gives b */
function vtBack(b, n, c) { var d = b, k = 0; while (k < n) { d--; if (vtWork(d, c)) k++; } return d; }
/* signed number of working days from boundary a to boundary b */
function vtCount(a, b, c) { var n = 0, d; if (b >= a) { for (d = a; d < b; d++) if (vtWork(d, c)) n++; return n; } for (d = b; d < a; d++) if (vtWork(d, c)) n++; return -n; }
function vtCents(v) { return Math.round(v * 100); }

function vtAnalyse(s) {
  var r = { model_version: VT_VERSION, calculation_status: 'blocked', blocking_reasons: [], before: null, after: null, project_shift: null, project_shift_calendar: null,
    shift_low: null, shift_high: null, milestones: [], cost: null, cash: [], path_changed: null, target_margin: null, criterion_state: 'unknown', gaps: [], warnings: [], actions: [] };
  function bad(c, id) { r.blocking_reasons.push({ code: c, id: id === undefined ? null : id }); }
  function gap(c, id) { r.gaps.push({ code: c, id: id === undefined ? null : id }); }
  function warn(c, id) { r.warnings.push({ code: c, id: id === undefined ? null : id }); }
  var an = vtDay(s.analysis_date); if (an === null) bad('analysis_date_invalid');
  var tg = null; if (vtText(s.target_finish)) { tg = vtDay(s.target_finish); if (tg === null) bad('target_invalid'); }
  /* calendars */
  var cals = {}, hw = [];
  (Array.isArray(s.calendars) ? s.calendars : []).forEach(function (c, i) { var id = vtText(c.id);
    if (!id) { bad('calendar_invalid', 'calendar-' + (i + 1)); return; } if (cals[id]) { bad('duplicate_calendar', id); return; }

var PY_CORE = "import math, json, re, datetime\nVT_VERSION = '2026-10-09.vt-3'\nVT_LINK_TYPES = ['FS', 'SS', 'FF']\nVT_CONSTRAINTS = ['none', 'snet', 'fnlt']\nVT_SCOPES = ['both', 'baseline', 'after']\nVT_PATTERNS = ['mon_fri', 'mon_sat', 'all']\nVT_MAX_DUR = 2000\nEPOCH = datetime.date(1970, 1, 1)\n\ndef vt_num(v):\n    return v if isinstance(v, (int, float)) and not isinstance(v, bool) and math.isfinite(v) else None\n\ndef vt_text(v):\n    if v is None: return ''\n    if isinstance(v, bool): return 'true' if v else 'false'\n    if isinstance(v, float) and v.is_integer(): return str(int(v)).strip()\n    return str(v).strip()\n\ndef vt_int(v): return vt_num(v) is not None and math.floor(v) == v\n\ndef vt_day(s):\n    m = re.fullmatch(r'(\\d{4})-(\\d{2})-(\\d{2})', vt_text(s))\n    if not m: return None\n    if not 1900 <= int(m.group(1)) <= 2999: return None\n    try: d = datetime.date(int(m.group(1)), int(m.group(2)), int(m.group(3)))\n    except ValueError: return None\n    return (d - EPOCH).days\n\ndef vt_iso(d): return None if d is None else (EPOCH + datetime.timedelta(days=d)).isoformat()\n\ndef vt_work(d, c): return c['week'][(EPOCH + datetime.timedelta(days=d)).weekday()] == 1 and d not in c['hol']\n\ndef vt_next(d, c):\n    while not vt_work(d, c): d += 1\n    return d\n\ndef vt_adv(d, n, c):\n    k = 0\n    while k < n:\n        if vt_work(d, c): k += 1\n        d += 1\n    return d\n\ndef vt_back(b, n, c):\n    d = b; k = 0\n    while k < n:\n        d -= 1\n        if vt_work(d, c): k += 1\n    return d\n\ndef vt_count(a, b, c):\n    if b >= a: return sum(1 for d in range(a, b) if vt_work(d, c))\n    return -sum(1 for d in range(b, a) if vt_work(d, c))\n\ndef vt_cents(v): return math.floor(v * 100 + 0.5)\n\nVT_ACTION = {'analysis_date_invalid': 'correct_input', 'target_invalid': 'correct_input', 'calendar_invalid': 'correct_input', 'duplicate_calendar': 'correct_input',\n  'project_calendar_missing': 'select_project_calendar', 'duplicate_id': 'correct_input', 'no_activities': 'add_activities', 'scope_invalid': 'correct_input', 'calendar_missing': 'assign_calendar',\n  'duration_invalid': 'correct_input', 'duration_range_invalid': 'correct_input', 'cost_invalid': 'correct_input', 'cost_range_invalid': 'correct_input', 'actual_invalid': 'record_progress',\n  'status_invalid': 'correct_input', 'constraint_invalid': 'correct_input', 'link_invalid': 'correct_input', 'milestone_invalid': 'correct_input', 'cycle': 'break_cycle', 'scenario_empty': 'add_activities',\n  'baseline_missing': 'record_baseline', 'baseline_unconfirmed': 'confirm_baseline', 'baseline_rejected': 'agree_baseline', 'data_unconfirmed': 'confirm_activity_data',\n  'source_missing': 'record_activity_source', 'time_rate_missing': 'record_time_rate', 'time_rate_source_missing': 'record_time_rate', 'time_rate_unconfirmed': 'confirm_time_rate'}\n\ndef vt_actions(r):\n    a = []; seen = set()\n    def add(x, item=None):\n        k = (x, item or '')\n        if k not in seen: seen.add(k); a.append({'action': x, 'item': item or None})\n    for b in r['blocking_reasons']: add(VT_ACTION[b['code']], b['id'])\n    for g in r['gaps']: add(VT_ACTION[g['code']], g['id'])\n    if r['criterion_state'] == 'not_met': add('mitigate_delay')\n    return a\n\ndef vt_analyse(s):\n    r = {'model_version': VT_VERSION, 'calculation_status': 'blocked', 'blocking_reasons': [], 'before': None, 'after': None, 'project_shift': None, 'project_shift_calendar': None,\n         'shift_low': None, 'shift_high': None, 'milestones': [], 'cost': None, 'cash': [], 'path_changed': None, 'target_margin': None, 'criterion_state': 'unknown', 'gaps': [], 'warnings': [], 'actions': []}\n    bad = lambda c, i=None: r['blocking_reasons'].append({'code': c, 'id': i})\n    gap = lambda c, i=None: r['gaps'].append({'code': c, 'id': i})\n    warn = lambda c, i=None: r['warnings'].append({'code': c, 'id': i})\n    an = vt_day(s.get('analysis_date'))\n    if an is None: bad('analysis_date_invalid')\n    t
