  "title": {"en":"Safety Glazing Selector (BE)","uk":"Вибір безпечного скління (BE)","de":"Auswahl von Sicherheitsverglasung (BE)","nl":"Keuze van veiligheidsbeglazing (BE)","fr":"Choix du vitrage de sécurité (BE)","es":"Selección de acristalamiento de seguridad (BE)","pl":"Dobór szyb bezpiecznych (BE)"},
  "summary": {"en":"Which breakage type and EN 12600 class the glass needs where people can hit it or fall through it — windows, doors, sloped glazing, roofs, ceilings, cladding, showers and glass balustrades — by NBN S 23-002/A1 and NBN B 03-004, with a pass / fail check of every pane.","uk":"Який тип руйнування й клас EN 12600 потрібен склу там, де в нього можуть вдаритися або крізь нього випасти, — вікна, двері, похиле скління, дахи, стелі, облицювання, душові та скляні огородження — за NBN S 23-002/A1 і NBN B 03-004, з перевіркою кожного скла.","de":"Welche Bruchart und EN-12600-Klasse das Glas braucht, wo Menschen dagegen stoßen oder hindurchfallen können — Fenster, Türen, Schrägverglasung, Dächer, Decken, Bekleidungen, Duschen und Glasbrüstungen — nach NBN S 23-002/A1 und NBN B 03-004, mit Prüfung jeder Scheibe.","nl":"Welk breukgedrag en welke EN 12600-klasse het glas nodig heeft waar mensen ertegen kunnen stoten of erdoor kunnen vallen — ramen, deuren, hellende beglazing, daken, plafonds, bekleding, douches en glazen borstweringen — volgens NBN S 23-002/A1 en NBN B 03-004, met een controle van elke ruit.","fr":"Quel type de casse et quelle classe EN 12600 le verre doit avoir là où l’on peut le heurter ou passer au travers — fenêtres, portes, parois inclinées, toitures, plafonds, bardages, douches et garde-corps en verre — selon la NBN S 23-002/A1 et la NBN B 03-004, avec la vérification de chaque verre.","es":"Qué tipo de rotura y qué clase EN 12600 necesita el vidrio donde las personas pueden golpearlo o atravesarlo — ventanas, puertas, acristalamiento inclinado, cubiertas, techos, revestimientos, duchas y barandillas de vidrio — según NBN S 23-002/A1 y NBN B 03-004, con la comprobación de cada hoja.","pl":"Jakiego rodzaju pęknięcia i klasy EN 12600 wymaga szkło tam, gdzie można w nie uderzyć lub przez nie wypaść — okna, drzwi, oszklenia pochyłe, dachy, sufity, okładziny, prysznice i balustrady szklane — wg NBN S 23-002/A1 i NBN B 03-004, ze sprawdzeniem każdej tafli."},
  "description": {"en":"Choose the building category (Eurocode A–E), the kind of glazed element and its heights — sill h, fall height hc, protection height H — and the glass of each pane. The tool finds the case of NBN S 23-002/A1:2010 §4.4.2.2.2 (cases 1–9), reads the required classes from Tableau 5 / Tableau 6, applies the small-pane exemption, the permanent-barrier alternatives, the insulating-glass rule and the rules for sloped glazing, and checks each pane against the requirement. Glass balustrades follow NBN B 03-004:2017 §9.2 and the protection height of §5.3.1. Openings can be taken from and saved to the shared glazing project of the package.","uk":"Оберіть категорію будівлі (Єврокод A–E), вид заскленого елемента і висоти — підвіконня h, висоту падіння hc, захисну висоту H — та скло кожного шару. Інструмент визначає випадок NBN S 23-002/A1:2010 §4.4.2.2.2 (1–9), бере потрібні класи з табл. 5 / табл. 6, враховує виняток для малого скла, постійні огородження, правило склопакетів і похилого скління та перевіряє кожне скло. Скляні огородження — за NBN B 03-004:2017 §9.2 і захисною висотою §5.3.1.","de":"Wählen Sie die Gebäudekategorie (Eurocode A–E), die Art des verglasten Bauteils und seine Höhen — Brüstung h, Absturzhöhe hc, Schutzhöhe H — und das Glas jeder Scheibe. Das Werkzeug bestimmt den Fall nach NBN S 23-002/A1:2010 §4.4.2.2.2 (Fälle 1–9), liest die Klassen aus Tabelle 5 / 6, wendet die Kleinflächen-Ausnahme, die Alternativen mit fester Absturzsicherung, die Isolierglasregel und die Regeln für Schrägverglasung an und prüft jede Scheibe. Glasbrüstungen nach NBN B 03-004:2017 §9.2 und Schutzhöhe nach §5.3.1.","nl":"Kies de gebouwcategorie (Eurocode A–E), het soort beglaasd element en de hoogtes — borstwering h, valhoogte hc, beschermingshoogte H — en het glas van elke ruit. De tool bepaalt het geval van NBN S 23-002/A1:2010 §4.4.2.2.2 (gevallen 1–9), leest de klassen uit tabel 5 / tabel 6, past de uitzondering voor kleine ruiten, de alternatieven met vaste borstwering, de regel voor isolerende beglazing en de regels voor hellende beglazing toe en controleert elke ruit. Glazen borstweringen volgens NBN B 03-004:2017 §9.2 en de beschermingshoogte van §5.3.1.","fr":"Choisissez la catégorie du bâtiment (Eurocode A–E), le type d’ouvrage vitré et ses hauteurs — allège h, hauteur de chute hc, hauteur de protection H — et le verre de chaque feuille. L’outil détermine le cas de la NBN S 23-002/A1:2010 §4.4.2.2.2 (cas 1 à 9), lit les classes du tableau 5 / tableau 6, applique l’exemption des petits vitrages, les alternatives avec protection permanente, la règle des vitrages isolants et les prescriptions des parois inclinées, et vérifie chaque verre. Les garde-corps en verre suivent la NBN B 03-004:2017 §9.2 et la hauteur de protection du §5.3.1.","es":"Elija la categoría del edificio (Eurocódigo A–E), el tipo de elemento acristalado y sus alturas — antepecho h, altura de caída hc, altura de protección H — y el vidrio de cada hoja. La herramienta determina el caso de NBN S 23-002/A1:2010 §4.4.2.2.2 (casos 1–9), lee las clases de la tabla 5 / tabla 6, aplica la exención de vidrios pequeños, las alternativas con protección permanente, la regla del doble acristalamiento y la de vidrios inclinados, y comprueba cada hoja. Las barandillas de vidrio siguen NBN B 03-004:2017 §9.2 y la altura de protección del §5.3.1.","pl":"Wybierz kategorię budynku (Eurokod A–E), rodzaj elementu przeszklonego i jego wysokości — parapet h, wysokość upadku hc, wysokość ochronną H — oraz szkło każdej tafli. Narzędzie ustala przypadek NBN S 23-002/A1:2010 §4.4.2.2.2 (1–9), odczytuje klasy z tabeli 5 / 6, stosuje wyjątek dla małych szyb, alternatywy ze stałą balustradą, regułę szyb zespolonych i oszkleń pochyłych oraz sprawdza każdą taflę. Balustrady szklane wg NBN B 03-004:2017 §9.2 i wysokości ochronnej z §5.3.1."},

  "limitations": {"en":"Belgian rules only (NBN S 23-002/A1:2010, NBN B 03-004:2017); regional and fire regulations and the specification of the glazed work prevail (it may set another protection height H than the reference 0,90 m). Breakage type and impact class only: the glass thickness for wind, snow, people loads and barrier loads is a separate structural check (Glass Thickness tool). Without the EN 12600 class declared by the manufacturer the class is inferred from the composition (laminated PVB ≥ 0,76 mm ≈ 1B1, 0,38 mm ≈ 2B2, monolithic toughened = C of unknown class) and marked 'verify'. A publicly accessible outdoor zone is checked as the category C5 row (learning assumption). For the small-pane exemption the pane size is taken as the daylight size. Sloped glazing beyond 30° from vertical that is not a roof is refused: above a human-activity zone it needs a special study, elsewhere it is not covered. Balustrades: the page uses Tab. 1 of NBN B 03-004 with H′ = H + y; the seat / kneeling rule and stairs exist in the engine but have no page field, and the reduced height Hr and the reduction of H when Hf = h + 0,5·l ≥ 1,0 m (NBN B 25-002-1 §6.15.2.1) are not modelled — enter the H that applies. Point-fixed, structurally bonded and curved glass, and glazing in lifts, vehicles and sports halls with ball games beyond note (4) are outside the scope.","uk":"Лише бельгійські правила (NBN S 23-002/A1:2010, NBN B 03-004:2017); регіональні й протипожежні норми та специфікація виробу мають пріоритет (вона може задати іншу захисну висоту H, ніж базові 0,90 м). Лише тип руйнування і клас удару: товщина скла під вітер, сніг, навантаження людей і огороджень — окрема конструктивна перевірка (інструмент товщини скла). Без задекларованого виробником класу EN 12600 клас визначається за складом (триплекс PVB ≥ 0,76 мм ≈ 1B1, 0,38 мм ≈ 2B2, монолітне загартоване = C невідомого класу) і позначається «перевірити». Публічну зовнішню зону перевірено за рядком категорії C5 (навчальне припущення). Для винятку малого скла розмір скла взято як світлий розмір. Похиле скління понад 30° від вертикалі, що не є дахом, не розраховується: над зоною перебування людей потрібне спеціальне дослідження, в інших випадках воно поза межами. Огородження: сторінка застосовує табл. 1 NBN B 03-004 з H′ = H + y; правило сидіння / стояння на колінах і сходи є в рушії, але не мають поля на сторінці, а зменшена висота Hr і зменшення H при Hf = h + 0,5·l ≥ 1,0 м (NBN B 25-002-1 §6.15.2.1) не моделюються — введіть чинну H. Точкове кріплення, структурне склеювання та гнуте скло, а також скління в ліфтах, транспорті й спортзалах з іграми з м’ячем понад примітку (4) — поза межами.","de":"Nur belgische Regeln (NBN S 23-002/A1:2010, NBN B 03-004:2017); regionale und Brandschutzvorschriften und das Leistungsverzeichnis gehen vor (es kann eine andere Schutzhöhe H als die Referenz 0,90 m festlegen). Nur Bruchart und Stoßklasse: die Glasdicke für Wind, Schnee, Personen- und Brüstungslasten ist ein eigener statischer Nachweis (Werkzeug Glasdicke). Ohne vom Hersteller erklärte EN-12600-Klasse wird die Klasse aus dem Aufbau abgeleitet (VSG PVB ≥ 0,76 mm ≈ 1B1, 0,38 mm ≈ 2B2, monolithisches ESG = C unbekannter Klasse) und als „prüfen“ markiert. Ein öffentlich zugänglicher Außenbereich wird wie die Zeile Kategorie C5 geprüft (Lernannahme). Für die Kleinflächen-Ausnahme gilt die Scheibengröße als Lichtmaß. Schrägverglasung über 30° zur Senkrechten, die kein Dach ist, wird abgelehnt: über einem Aufenthaltsbereich ist eine Sonderuntersuchung nötig, sonst ist sie nicht erfasst. Brüstungen: die Seite nutzt Tab. 1 der NBN B 03-004 mit H′ = H + y; die Sitz-/Knieregel und Treppen sind im Rechenkern vorhanden, haben aber kein Feld, die reduzierte Höhe Hr und die Absenkung von H bei Hf = h + 0,5·l ≥ 1,0 m (NBN B 25-002-1 §6.15.2.1) sind nicht modelliert — geltendes H eingeben. Punktgehaltenes, geklebtes und gebogenes Glas sowie Verglasungen in Aufzügen, Fahrzeugen und Sporthallen mit Ballspielen über Anmerkung (4) hinaus sind nicht erfasst.","nl":"Enkel Belgische regels (NBN S 23-002/A1:2010, NBN B 03-004:2017); regionale en brandvoorschriften en het bestek van het beglaasde element hebben voorrang (het kan een andere beschermingshoogte H dan de referentie 0,90 m opleggen). Enkel breukgedrag en stootklasse: de glasdikte voor wind, sneeuw, personen- en borstweringbelasting is een aparte stabiliteitscontrole (tool glasdikte). Zonder door de fabrikant verklaarde EN 12600-klasse wordt de klasse uit de samenstelling afgeleid (gelaagd PVB ≥ 0,76 mm ≈ 1B1, 0,38 mm ≈ 2B2, monolithisch gehard = C van onbekende klasse) en als ‘controleren’ gemarkeerd. Een publiek toegankelijke buitenzone wordt gecontroleerd als de rij categorie C5 (leeraanname). Voor de uitzondering voor kleine ruiten geldt de ruitmaat als daglichtmaat. Hellende beglazing van meer dan 30° t.o.v. verticaal die geen dak is, wordt geweigerd: boven een activiteitszone vraagt ze een speciale studie, elders valt ze buiten het hulpmiddel. Borstweringen: de pagina gebruikt tab. 1 van NBN B 03-004 met H′ = H + y; de zit-/knielregel en trappen zitten in de rekenkern maar hebben geen veld, de verlaagde hoogte Hr en de verlaging van H bij Hf = h + 0,5·l ≥ 1,0 m (NBN B 25-002-1 §6.15.2.1) zijn niet gemodelleerd — vul de geldende H in. Puntbevestigd, structureel verlijmd en gebogen glas, en beglazing in liften, voertuigen en sporthallen met balspelen buiten noot (4) vallen buiten het toepassingsgebied.","fr":"Règles belges uniquement (NBN S 23-002/A1:2010, NBN B 03-004:2017) ; les réglementations régionales et incendie et les spécifications de l’ouvrage vitré prévalent (elles peuvent fixer une autre hauteur de protection H que la référence 0,90 m). Type de casse et classe de choc uniquement : l’épaisseur sous vent, neige, charges de personnes et de garde-corps est une vérification structurale distincte (outil épaisseur de verre). Sans classe EN 12600 déclarée par le fabricant, la classe est déduite de la composition (feuilleté PVB ≥ 0,76 mm ≈ 1B1, 0,38 mm ≈ 2B2, trempé monolithique = C de classe inconnue) et marquée « à vérifier ». Une zone extérieure accessible au public est vérifiée comme la ligne catégorie C5 (hypothèse d’apprentissage). Pour l’exemption des petits vitrages, les dimensions du verre sont prises comme surface de jour. Une paroi inclinée de plus de 30° qui n’est pas une toiture est refusée : au-dessus d’une zone d’activité humaine elle requiert une étude spéciale, ailleurs elle est hors champ. Garde-corps : la page applique le tab. 1 de la NBN B 03-004 avec H′ = H + y ; la règle assise / à genoux et les escaliers existent dans le moteur sans champ sur la page, la hauteur réduite Hr et la réduction de H lorsque Hf = h + 0,5·l ≥ 1,0 m (NBN B 25-002-1 §6.15.2.1) ne sont pas modélisées — saisissez la H applicable. Verre à fixation ponctuelle, collé structurellement ou bombé, et vitrages d’ascenseurs, de véhicules et de salles de sport avec jeux de ballon au-delà de la note (4) : hors champ.","es":"Solo normas belgas (NBN S 23-002/A1:2010, NBN B 03-004:2017); prevalecen las normativas regionales y de incendios y el pliego del elemento (puede fijar otra altura de protección H distinta de la referencia de 0,90 m). Solo tipo de rotura y clase de impacto: el espesor frente a viento, nieve, cargas de personas y de barandillas es una comprobación estructural aparte (herramienta de espesor). Sin la clase EN 12600 declarada por el fabricante, la clase se deduce de la composición (laminado PVB ≥ 0,76 mm ≈ 1B1, 0,38 mm ≈ 2B2, templado monolítico = C de clase desconocida) y se marca «verificar». Una zona exterior accesible al público se comprueba como la fila de la categoría C5 (supuesto de aprendizaje). Para la exención de vidrios pequeños se toma el tamaño de la hoja como luz. Un acristalamiento inclinado de más de 30° que no sea cubierta se rechaza: sobre una zona de actividad requiere estudio especial, en otro caso queda fuera de alcance. Barandillas: la página aplica la tabla 1 de NBN B 03-004 con H′ = H + y; la regla de asiento / rodillas y las escaleras existen en el motor pero no tienen campo, y la altura reducida Hr y la reducción de H cuando Hf = h + 0,5·l ≥ 1,0 m (NBN B 25-002-1 §6.15.2.1) no se modelan: introduzca la H aplicable. Vidrio con fijación puntual, pegado estructural o curvado, y acristalamientos de ascensores, vehículos y pabellones con juegos de pelota más allá de la nota (4): fuera de alcance.","pl":"Tylko przepisy belgijskie (NBN S 23-002/A1:2010, NBN B 03-004:2017); pierwszeństwo mają przepisy regionalne i przeciwpożarowe oraz specyfikacja elementu (może ustalić inną wysokość ochronną H niż referencyjne 0,90 m). Tylko rodzaj pęknięcia i klasa udarowa: grubość szkła na wiatr, śnieg, obciążenia od ludzi i balustrad to osobne sprawdzenie konstrukcyjne (narzędzie grubości szkła). Bez klasy EN 12600 zadeklarowanej przez producenta klasa jest wywnioskowana ze składu (laminat PVB ≥ 0,76 mm ≈ 1B1, 0,38 mm ≈ 2B2, monolityczne hartowane = C nieznanej klasy) i oznaczona „sprawdź”. Publicznie dostępną strefę zewnętrzną sprawdza się jak wiersz kategorii C5 (założenie szkoleniowe). Przy wyjątku dla małych szyb wymiar tafli przyjęto jako wymiar w świetle. Oszklenie pochyłe ponad 30° od pionu, które nie jest dachem, jest odrzucane: nad strefą przebywania ludzi wymaga specjalnego opracowania, w innych przypadkach jest poza zakresem. Balustrady: strona stosuje tab. 1 NBN B 03-004 z H′ = H + y; reguła siedziska / klęczenia i schody są w silniku, ale bez pola na stronie, a obniżona wysokość Hr i obniżenie H przy Hf = h + 0,5·l ≥ 1,0 m (NBN B 25-002-1 §6.15.2.1) nie są modelowane — wpisz obowiązującą H. Szkło mocowane punktowo, klejone strukturalnie i gięte oraz oszklenia w windach, pojazdach i halach sportowych z grami w piłkę poza uwagą (4) — poza zakresem."},

    ['Case 1, impact from the room only. The toughened inner pane meets 1C-, but because it is toughened the outer float pane must be safety glass too (insulating-glass rule). A laminated 33.1 inner pane would let the outer pane stay float.', 'Випадок 1, удар лише з приміщення. Загартоване внутрішнє скло відповідає 1C-, але саме тому зовнішній флоат теж має бути безпечним (правило склопакета). Із багатошаровим 33.1 всередині зовнішнє може лишитися флоатом.', 'Fall 1, Stoß nur von innen. Die innere ESG-Scheibe erfüllt 1C-, doch weil sie ESG ist, muss auch die äußere Floatscheibe Sicherheitsglas sein (Isolierglasregel). Mit VSG 33.1 innen dürfte außen Float bleiben.', 'Geval 1, stoot enkel van binnen. De geharde binnenruit voldoet aan 1C-, maar omdat ze gehard is, moet de buitenste floatruit ook veiligheidsglas zijn (regel isolerende beglazing). Met gelaagd 33.1 binnen mag buiten float blijven.', 'Cas 1, choc depuis le local seulement. Le verre intérieur trempé satisfait à 1C-, mais parce qu’il est trempé, le verre float extérieur doit aussi être de sécurité (règle du vitrage isolant). Avec un feuilleté 33.1 à l’intérieur, l’extérieur peut rester en float.', 'Caso 1, impacto solo desde el local. La hoja interior templada cumple 1C-, pero por ser templada la hoja exterior float también debe ser de seguridad (regla del doble acristalamiento). Con laminado 33.1 dentro, la exterior podría seguir siendo float.', 'Przypadek 1, uderzenie tylko od pomieszczenia. Hartowana tafla wewnętrzna spełnia 1C-, ale właśnie dlatego zewnętrzny float też musi być bezpieczny (reguła szyby zespolonej). Z laminowanym 33.1 wewnątrz zewnętrzna może pozostać floatem.']],
  'landing-door': [['Glass door at the top of a stair', 'Скляні двері біля сходів', 'Glastür am Treppenabgang', 'Glazen deur bovenaan een trap', 'Porte vitrée en haut d’un escalier', 'Puerta de vidrio en lo alto de una escalera', 'Drzwi szklane przy schodach'],
    ['0,8 m² of glass, hb 0, drop 1,2 m within 1 m → landing door → 1B1 laminated; toughened fails. The same door away from a stair may be toughened.', '0,8 м² скла, hb 0, перепад 1,2 м ближче 1 м → двері біля сходів → 1B1 багатошарове; загартоване не проходить. Ті самі двері далеко від сходів можуть бути загартованими.', '0,8 m² Glas, hb 0, Höhenunterschied 1,2 m innerhalb 1 m → Tür am Treppenabgang → 1B1 VSG; ESG fällt durch. Dieselbe Tür ohne Treppe darf ESG sein.', '0,8 m² glas, hb 0, niveauverschil 1,2 m binnen 1 m → deur bij een trap → 1B1 gelaagd; gehard faalt. Dezelfde deur zonder trap mag gehard zijn.', '0,8 m² de verre, hb 0, dénivellation 1,2 m à moins de 1 m → porte palière → 1B1 feuilleté ; le trempé échoue. La même porte loin d’un escalier peut être trempée.', '0,8 m² de vidrio, hb 0, desnivel 1,2 m a menos de 1 m → puerta de rellano → 1B1 laminado; templado no cumple. La misma puerta lejos de la escalera puede ser templada.', '0,8 m² szkła, hb 0, różnica 1,2 m w odległości < 1 m → drzwi przy schodach → 1B1 laminowane; hartowane nie spełnia. Te same drzwi z dala od schodów mogą być hartowane.']],
  'roof-light': [['Roof light, toughened insulating glass', 'Зенітний ліхтар, загартований склопакет', 'Dachfenster, Isolierglas aus ESG', 'Dakraam, geharde isolerende beglazing', 'Lanterneau, vitrage isolant trempé', 'Lucernario, doble acristalamiento templado', 'Świetlik, szyba zespolona hartowana'],
    ['Case 6 → the inner pane must be 1B1 laminated: a toughened inner pane would rain down as cullet on the people below. 33.2 inside passes.', 'Випадок 6 → внутрішнє скло має бути 1B1 багатошаровим: загартоване посипалося б уламками на людей знизу. Із 33.2 всередині — проходить.', 'Fall 6 → die innere Scheibe muss VSG 1B1 sein: innen ESG würde als Krümelregen auf die Menschen darunter fallen. Mit 33.2 innen besteht es.', 'Geval 6 → de binnenruit moet gelaagd 1B1 zijn: een geharde binnenruit zou als scherven op de mensen eronder regenen. Met 33.2 binnen voldoet het.', 'Cas 6 → le verre intérieur doit être un feuilleté 1B1 : un verre intérieur trempé tomberait en grésil sur les occupants. Avec un 33.2 à l’intérieur, c’est conforme.', 'Caso 6 → la hoja interior debe ser laminada 1B1: una hoja interior templada caería como granizo sobre las personas. Con 33.2 dentro, cumple.', 'Przypadek 6 → tafla wewnętrzna musi być laminowana 1B1: hartowana spadłaby gradem okruchów na ludzi poniżej. Z 33.2 wewnątrz spełnia.']],
  'balustrade-1010': [['Glass balustrade 1010.2 all toughened, no top rail', 'Скляне огородження 1010.2 повністю загартоване, без поручня', 'Glasbrüstung 1010.2 nur ESG, ohne Handlauf', 'Glazen borstwering 1010.2 volledig gehard, zonder leuning', 'Garde-corps 1010.2 entièrement trempé, sans lisse', 'Barandilla 1010.2 totalmente templada, sin pasamanos', 'Balustrada 1010.2 z samych tafli hartowanych, bez pochwytu'],
    ['1B1 laminated is met, but with all plies toughened NBN B 03-004 §9.2(3) asks for a top rail or a post-breakage test: broken toughened plies have no stiffness left. Add the rail and it passes.', '1B1 виконано, але коли всі шари загартовані, NBN B 03-004 §9.2(3) вимагає поручень або випробування після руйнування: зруйновані загартовані шари не мають жорсткості. З поручнем — проходить.', '1B1 VSG ist erfüllt, doch bei nur ESG-Scheiben fordert NBN B 03-004 §9.2(3) einen Handlauf oder eine Nachbruchprüfung: gebrochenes ESG hat keine Steifigkeit mehr. Mit Handlauf besteht es.', '1B1 gelaagd is vervuld, maar met enkel geharde bladen vraagt NBN B 03-004 §9.2(3) een leuning of een proef na breuk: gebroken gehard glas heeft geen stijfheid meer. Met leuning voldoet het.', '1B1 feuilleté est satisfait, mais avec toutes les feuilles trempées, la NBN B 03-004 §9.2(3) exige une lisse ou un essai après bris : les feuilles trempées cassées n’ont plus de raideur. Avec la lisse, c’est conforme.', '1B1 laminado se cumple, pero con todas las hojas templadas NBN B 03-004 §9.2(3) exige pasamanos o ensayo tras rotura: el templado roto no conserva rigidez. Con pasamanos, cumple.', '1B1 jest spełnione, ale przy samych taflach hartowanych NBN B 03-004 §9.2(3) wymaga pochwytu lub badania po stłuczeniu: stłuczone szkło hartowane nie ma sztywności. Z pochwytem spełnia.']],
  'sidelight': [['Narrow side light next to a door', 'Вузьке бічне скло біля дверей', 'Schmales Seitenteil neben einer Tür', 'Smal zijlicht naast een deur', 'Imposte latérale étroite près d’une porte', 'Lateral estrecho junto a una puerta', 'Wąski doświetlacz boczny przy drzwiach'],
    ['0,35 × 1,15 m = 0,40 m² < 0,5 m² → case 1 small-pane exemption: safety glass is not mandatory, ordinary float is allowed.', '0,35 × 1,15 м = 0,40 м² < 0,5 м² → виняток для малого скла у випадку 1: безпечне скло не обов’язкове, звичайний флоат дозволено.', '0,35 × 1,15 m = 0,40 m² < 0,5 m² → Kleinflächen-Ausnahme in Fall 1: Sicherheitsglas nicht vorgeschrieben, Float erlaubt.', '0,35 × 1,15 m = 0,40 m² < 0,5 m² → uitzondering kleine ruit in geval 1: veiligheidsglas niet verplicht, float toegestaan.', '0,35 × 1,15 m = 0,40 m² < 0,5 m² → exemption des petits vitrages du cas 1 : verre de sécurité non obligatoire, float admis.', '0,35 × 1,15 m = 0,40 m² < 0,5 m² → exención de vidrio pequeño del caso 1: no es obligatorio el vidrio de seguridad, se admite float.', '0,35 × 1,15 m = 0,40 m² < 0,5 m² → wyjątek dla małej szyby w przypadku 1: szkło bezpieczne nieobowiązkowe, dopuszczalny float.']],
  'sloped-pavement': [['Shop façade leaning 20° over the pavement', 'Фасад магазину з нахилом 20° над тротуаром', 'Ladenfassade 20° über den Gehweg geneigt', 'Winkelgevel 20° hellend boven het voetpad', 'Façade de commerce inclinée de 20° au-dessus du trottoir', 'Fachada de tienda inclinada 20° sobre la acera', 'Fasada sklepu pochylona 20° nad chodnikiem'],
    ['20° from vertical above a public zone → case 4: the outer (lower) pane must break as B or C, float fails and so does an all-toughened laminate; rebate ≥ 25 mm, screwed beads. A 20° lean turns a window into overhead glazing; beyond 30° it needs a special study.', '20° від вертикалі над публічною зоною → випадок 4: зовнішнє (нижнє) скло має руйнуватися як B або C, флоат і повністю загартований триплекс не проходять; фальц ≥ 25 мм, штапики на гвинтах. Нахил 20° робить вікно верхнім склінням; понад 30° — спеціальне дослідження.', '20° zur Senkrechten über öffentlichem Bereich → Fall 4: die äußere (untere) Scheibe muss als B oder C brechen, Float und VSG nur aus ESG fallen durch; Falz ≥ 25 mm, Leisten verschraubt. 20° Neigung macht aus einem Fenster eine Überkopfverglasung; über 30° Sonderuntersuchung.', '20° t.o.v. verticaal boven een publieke zone → geval 4: de buitenste (onderste) ruit moet als B of C breken, float faalt en volledig gehard gelaagd glas ook; sponning ≥ 25 mm, geschroefde glaslatten. 20° helling maakt van een raam overkopbeglazing; boven 30° een speciale studie.', '20° par rapport à la verticale au-dessus d’une zone publique → cas 4 : le verre extérieur (inférieur) doit casser en B ou C, le float échoue ainsi qu’un feuilleté entièrement trempé ; feuillure ≥ 25 mm, parcloses vissées. 20° d’inclinaison font d’une fenêtre une paroi en surplomb ; au-delà de 30°, étude spéciale.', '20° respecto a la vertical sobre una zona pública → caso 4: la hoja exterior (inferior) debe romper como B o C; float no cumple, ni un laminado totalmente templado; galce ≥ 25 mm, junquillos atornillados. 20° de inclinación convierten una ventana en acristalamiento en voladizo; más de 30°, estudio especial.', '20° od pionu nad strefą publiczną → przypadek 4: zewnętrzna (dolna) tafla musi pękać jak B lub C, float nie spełnia, laminat z samych tafli hartowanych też nie; wrąb ≥ 25 mm, listwy przykręcane. 20° pochylenia robi z okna oszklenie nad głową; powyżej 30° — specjalne opracowanie.']]
};

  version: 1,
  intro: { title: T7(['What this tool does', 'Що робить цей інструмент', 'Was dieses Werkzeug tut', 'Wat deze tool doet', 'Ce que fait cet outil', 'Qué hace esta herramienta', 'Co robi to narzędzie']),
    body: T7(['It finds which of the nine situations of the Belgian glazing standard NBN S 23-002/A1 your glass is in — low or high sill, fall height, door, sloped glass, roof, ceiling, cladding or another use — and reads the minimum breakage type and EN 12600 class for your building category. Then it checks each pane you entered. Glass balustrades follow NBN B 03-004.', 'Визначає, у якій із дев’яти ситуацій бельгійського стандарту NBN S 23-002/A1 перебуває скло — низьке чи високе підвіконня, висота падіння, двері, похиле скло, дах, стеля, облицювання — і бере мінімальний тип руйнування та клас EN 12600 для вашої категорії будівлі. Потім перевіряє кожне скло. Скляні огородження — за NBN B 03-004.', 'Es bestimmt, in welcher der neun Situationen der belgischen Verglasungsnorm NBN S 23-002/A1 Ihr Glas liegt — niedrige oder hohe Brüstung, Absturzhöhe, Tür, Schrägverglasung, Dach, Decke, Bekleidung — und liest Mindest-Bruchart und EN-12600-Klasse für die Gebäudekategorie. Dann prüft es jede Scheibe. Glasbrüstungen nach NBN B 03-004.', 'Het bepaalt in welke van de negen situaties van de Belgische beglazingsnorm NBN S 23-002/A1 uw glas zit — lage of hoge borstwering, valhoogte, deur, hellend glas, dak, plafond, bekleding — en leest het minimale breukgedrag en de EN 12600-klasse voor uw gebouwcategorie. Daarna controleert het elke ruit. Glazen borstweringen volgens NBN B 03-004.', 'Il détermine dans laquelle des neuf situations de la norme belge NBN S 23-002/A1 se trouve votre verre — allège basse ou haute, hauteur de chute, porte, paroi inclinée, toiture, plafond, bardage — et lit le type de casse et la classe EN 12600 minimaux pour la catégorie du bâtiment. Puis il vérifie chaque verre. Garde-corps en verre selon la NBN B 03-004.', 'Determina en cuál de las nueve situaciones de la norma belga NBN S 23-002/A1 está su vidrio — antepecho bajo o alto, altura de caída, puerta, vidrio inclinado, cubierta, techo, revestimiento — y lee el tipo de rotura y la clase EN 12600 mínimos para la categoría del edificio. Luego comprueba cada hoja. Barandillas de vidrio según NBN B 03-004.', 'Ustala, w której z dziewięciu sytuacji belgijskiej normy NBN S 23-002/A1 znajduje się szkło — niski lub wysoki parapet, wysokość upadku, drzwi, szkło pochyłe, dach, sufit, okładzina — i odczytuje minimalny rodzaj pęknięcia i klasę EN 12600 dla kategorii budynku. Następnie sprawdza każdą taflę. Balustrady szklane wg NBN B 03-004.']) },
  topics: {
    cls: { title: T7(['EN 12600 class α(β)φ', 'Клас EN 12600 α(β)φ', 'EN-12600-Klasse α(β)φ', 'EN 12600-klasse α(β)φ', 'Classe EN 12600 α(β)φ', 'Clase EN 12600 α(β)φ', 'Klasa EN 12600 α(β)φ']),
      body: T7(['A twin-tyre pendulum hits the glass from 190, 450 and 1200 mm. α is the highest drop the glass survives safely (3, 2, 1), β how it breaks (A sharp pieces, B held together, C small particles), φ the highest drop without an opening a 76 mm ball passes. "1B1" = laminated that holds at 1200 mm; "1C-" = toughened at 1200 mm, φ free.', 'Подвійний шинний маятник б’є по склу з 190, 450 і 1200 мм. α — найбільша висота, яку скло витримує безпечно (3, 2, 1), β — як руйнується (A гострі уламки, B тримається разом, C дрібні частинки), φ — найбільша висота без отвору для кулі 76 мм. «1B1» — багатошарове, що тримає 1200 мм; «1C-» — загартоване на 1200 мм, φ довільне.', 'Ein Zwillingsreifen-Pendel trifft das Glas aus 190, 450 und 1200 mm. α ist die höchste sicher überstandene Fallhöhe (3, 2, 1), β die Bruchart (A scharfe Stücke, B zusammenhaltend, C Krümel), φ die höchste Fallhöhe ohne Öffnung für eine 76-mm-Kugel. „1B1“ = VSG, das bei 1200 mm hält; „1C-“ = ESG bei 1200 mm, φ frei.', 'Een slinger met twee banden raakt het glas vanaf 190, 450 en 1200 mm. α is de hoogste veilig doorstane valhoogte (3, 2, 1), β het breukgedrag (A scherpe stukken, B blijft samen, C kleine deeltjes), φ de hoogste valhoogte zonder opening voor een bal van 76 mm. „1B1” = gelaagd dat 1200 mm houdt; „1C-” = gehard bij 1200 mm, φ vrij.', 'Un pendule à pneus jumelés frappe le verre depuis 190, 450 et 1200 mm. α est la plus grande hauteur supportée sans danger (3, 2, 1), β le mode de casse (A morceaux coupants, B fragments unis, C petits morceaux), φ la plus grande hauteur sans ouverture laissant passer une sphère de 76 mm. « 1B1 » = feuilleté qui tient à 1200 mm ; « 1C- » = trempé à 1200 mm, φ libre.', 'Un péndulo de neumáticos gemelos golpea el vidrio desde 190, 450 y 1200 mm. α es la mayor altura que resiste con seguridad (3, 2, 1), β cómo rompe (A trozos cortantes, B unidos, C partículas pequeñas), φ la mayor altura sin abertura para una esfera de 76 mm. «1B1» = laminado que resiste 1200 mm; «1C-» = templado a 1200 mm, φ libre.', 'Wahadło z podwójną oponą uderza w szkło z 190, 450 i 1200 mm. α to najwyższa bezpiecznie wytrzymana wysokość (3, 2, 1), β sposób pękania (A ostre kawałki, B trzyma się razem, C drobne cząstki), φ najwyższa wysokość bez otworu dla kuli 76 mm. „1B1” = laminowane wytrzymujące 1200 mm; „1C-” = hartowane przy 1200 mm, φ dowolne.']) },
    cases: { title: T7(['Fall height decides', 'Вирішує висота падіння', 'Die Absturzhöhe entscheidet', 'De valhoogte beslist', 'La hauteur de chute décide', 'Decide la altura de caída', 'Decyduje wysokość upadku']),
      body: T7(['Below the protection height H (0,90 m unless the specification sets another), glass that can be hit must not cut (case 1, toughened is fine) — and if the fall behind it is more than 1,5 m it must also hold you (case 2, laminated only). Above H the sill protects (case 3).', 'Нижче захисної висоти H (0,90 м, якщо специфікація не задає іншу) скло не повинне різати (випадок 1, загартоване підходить), а якщо падіння за ним понад 1,5 м — ще й утримати людину (випадок 2, лише багатошарове). Вище H захищає підвіконня (випадок 3).', 'Unterhalb der Schutzhöhe H (0,90 m, sofern nicht anders festgelegt) darf Glas, das getroffen werden kann, nicht schneiden (Fall 1, ESG genügt) — und bei mehr als 1,5 m Absturz muss es auch halten (Fall 2, nur VSG). Oberhalb von H schützt die Brüstung (Fall 3).', 'Onder de beschermingshoogte H (0,90 m tenzij het bestek anders zegt) mag glas dat geraakt kan worden niet snijden (geval 1, gehard volstaat) — en bij een val van meer dan 1,5 m moet het je ook tegenhouden (geval 2, enkel gelaagd). Boven H beschermt de borstwering (geval 3).', 'Sous la hauteur de protection H (0,90 m sauf autre valeur prescrite), le verre exposé ne doit pas couper (cas 1, le trempé suffit) — et si la chute derrière dépasse 1,5 m, il doit aussi retenir (cas 2, feuilleté seulement). Au-dessus de H, l’allège protège (cas 3).', 'Por debajo de la altura de protección H (0,90 m salvo otro valor), el vidrio que puede golpearse no debe cortar (caso 1, basta templado) — y si la caída detrás supera 1,5 m también debe retener (caso 2, solo laminado). Por encima de H protege el antepecho (caso 3).', 'Poniżej wysokości ochronnej H (0,90 m, o ile specyfikacja nie stanowi inaczej) szkło narażone na uderzenie nie może ciąć (przypadek 1, hartowane wystarczy), a przy upadku ponad 1,5 m musi też zatrzymać (przypadek 2, tylko laminowane). Powyżej H chroni parapet (przypadek 3).']) },
    igu: { title: T7(['Insulating glass', 'Склопакети', 'Isolierglas', 'Isolerende beglazing', 'Vitrage isolant', 'Doble acristalamiento', 'Szyby zespolone']),
      body: T7(['Each side where people can hit the glass needs its own safety pane. If that pane is toughened, the other pane must be safety glass too: when the toughened pane shatters, the person meets the other one. Roofs: the inner pane is the safety glass.', 'Кожен бік, з якого можуть ударити, потребує власного безпечного скла. Якщо воно загартоване, інше скло теж має бути безпечним: коли загартоване розсипається, людина вдаряється в інше. Дахи: безпечним є внутрішнє скло.', 'Jede Seite, auf der Menschen anstoßen können, braucht ihre eigene Sicherheitsscheibe. Ist diese ESG, muss auch die andere Scheibe Sicherheitsglas sein: zerfällt das ESG, trifft man die andere. Dächer: die innere Scheibe ist das Sicherheitsglas.', 'Elke zijde waar mensen het glas kunnen raken, heeft een eigen veiligheidsruit nodig. Is die gehard, dan moet de andere ruit ook veiligheidsglas zijn: als het geharde glas verbrijzelt, raakt men de andere. Daken: de binnenruit is het veiligheidsglas.', 'Chaque côté où l’on peut heurter le verre demande son propre verre de sécurité. S’il est trempé, l’autre verre doit aussi être de sécurité : quand le trempé éclate, la personne rencontre l’autre. Toitures : le verre intérieur est le verre de sécurité.', 'Cada lado donde se pueda golpear el vidrio necesita su propia hoja de seguridad. Si es templada, la otra hoja también debe ser de seguridad: al estallar la templada, la persona choca con la otra. Cubiertas: la hoja interior es la de seguridad.', 'Każda strona, od której można uderzyć, wymaga własnej tafli bezpiecznej. Jeśli jest hartowana, druga też musi być bezpieczna: gdy hartowana się rozsypie, człowiek trafia w drugą. Dachy: szkłem bezpiecznym jest tafla wewnętrzna.']) },
