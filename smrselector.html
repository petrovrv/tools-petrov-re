/* ---------- tools.petrov.re v2 runtime ----------
   The state is the site and the requirement. The record is the screening: what was
   asked for, which designs survived every gate, why the others did not, and how the
   survivors rank. No physical quantity is computed anywhere in this page. */
function dgcState() {
  return { v: 1, lang: S.lang, view: VIEW, step: STEP, sheet: S.sheet,
    lat: S.lat, lon: S.lon, iso: S.iso, cname: S.cname,
    access: S.access, water: S.water, arch: S.arch, reuseTurbine: S.reuseTurbine,
    output: S.output, mwe: S.mwe, mwth: S.mwth, temp: S.temp, cont: S.cont,
    flex: S.flex, grid: S.grid, surplus: S.surplus, red: S.red, oper: S.oper,
    year: S.year, life: S.life, alt: S.alt, w: S.w, preset: S.preset, adv: S.adv };
}
/* Before the port this ran at Diagram.init() time, threw on the still-undefined
   register, and was then overwritten by the data-load path — so access, water,
   preset, adv and the design sheet were silently dropped from every shared link
   and the user was told the link was damaged. It now survives an empty register
   and the data-load path leaves a restored state alone (RESTORED). */
function dgcRestore(st) {
  if (!st || typeof st !== 'object') return;
  const keys = ['lat', 'lon', 'iso', 'cname', 'access', 'water', 'arch', 'reuseTurbine',
    'output', 'mwe', 'mwth', 'temp', 'cont', 'flex', 'grid', 'surplus', 'red', 'oper',
    'year', 'life', 'alt', 'preset', 'adv'];
  keys.forEach(k => { if (st[k] !== undefined) S[k] = st[k]; });
  if (st.w && typeof st.w === 'object') Object.keys(S.w).forEach(k => {
    if (typeof st.w[k] === 'number') S.w[k] = st.w[k];
  });
  if (st.lang && I18N[st.lang]) { S.lang = st.lang; document.documentElement.lang = S.lang; }
  VIEW = (st.view === 'cat' || st.view === 'sheet') ? st.view : 'wizard';
  S.sheet = st.sheet || null;
  STEP = Math.max(0, Math.min(2, +st.step || 0));
  RESTORED = true;
  if (!hasData()) return;                       /* finished by loaded() */
  S.result = screen();
  S.resultStale = false;
  if (APP) {
    if (APP.lang !== S.lang) { APP.setLang(S.lang); return; }
    commit(); refresh(false);
  }
}
function dgcRecord() {
  if (!window.DATA || !DATA.reactors) return null;
  const R = (S.result && !S.resultStale) ? S.result : (S.result = screen());
  const C = R.C || countryRec(S.iso, S.cname);
  const pass = R.pass || [];
  const out = {
    designs_in_the_register: DATA.reactors.length,
    designs_that_passed_every_gate: pass.length,
    designs_eliminated: (R.gates || []).length,
    surviving_designs: pass.map(p => p.r.name).join('; '),
    best_ranked_design: pass.length ? pass[0].r.name : '',
    best_ranked_score: pass.length ? Math.round(pass[0].score) : null,
    best_probability_of_ranking_first: pass.length && pass[0].pWin != null
      ? Math.round(pass[0].pWin * 100) : null,
    eliminations: (R.gates || []).map(g =>
      g.r.name + ': ' + g.why.map(w => fmt(w.k, w.p)).join(' / ')).join(' | ')
  };
  ['fit', 'conf', 'fuel', 'speed', 'model'].forEach(k => {
    out['weight_' + k] = S.w[k];
  });
  return {
    inputs: {
      country: C.n || S.iso || '—',
      national_position: C.st ? (T('st.' + C.st) || C.st) : '—',
      latitude: S.lat, longitude: S.lon,
      heaviest_transport_available: T('acc.' + S.access),
      cooling_water: S.water,
      requirement: S.output === 'heat' ? (S.mwth + ' MWth') : (S.mwe + ' MWe'),
      deliverable_heat_temperature: S.temp,
      earliest_acceptable_operation: S.year,
      redundancy: T('r.' + S.red),
      existing_turbine_archetype: S.arch === 'none' ? '—' : T('a.' + S.arch),
      reuse_that_turbine: S.reuseTurbine ? 'yes' : 'no'
    },
    outputs: out,
    units: { latitude: 'deg', longitude: 'deg', deliverable_heat_temperature: 'C',
      earliest_acceptable_operation: 'a' },
    model: {
      equations: [
        'a design passes when it trips none of the documented gates: jurisdiction and ' +
          'supplier bloc, procurability, product (electricity or heat), deliverable ' +
          'temperature, number of modules, cooling water, transport class, schedule, and ' +
          'the retrofit turbine',
        'modules = ceil(demand / output per module), then the redundancy rule adds the spares',
        'score = weighted mean of fit, confidence, fuel, speed and commercial model',
        'rank stability = share of 400 Monte-Carlo draws in which a design ranks first, with ' +
          'the weights and the axis scores perturbed by the uncertainty of its licensing stage'
      ],
      ranges: [T('app.toy')],
      notes: [T('rep.method_t'), fmt('app.asof', { v: (DATA.meta || {}).knowledge_date || '—' })]
    },
    warnings: (function () {
      const w = [];
      if (R.invalid) w.push(T(R.invalid === 'demand' ? 'res.baddemand' : 'res.badcountry'));
      if (C.unknown) w.push(C.n + ' — ' + T('site.unknown'));
      if (R.notReactor) w.push(T('res.notreactor') + ' — ' + T('res.notreactor_t'));
      if (!pass.length && !R.invalid) w.push(T('res.none') + ' — ' + T('res.none_t'));

}
function dgcInit() {
  if (!window.Diagram || window.__dgcStarted) return;
  window.__dgcStarted = true;
  try {
    window.Diagram.init({
      id: 'smrselector', file: 'smrselector.html',
      state: { serialize: dgcState, deserialize: dgcRestore },
      record: dgcRecord,
      /* The result is a selection out of a server-maintained register plus a
         Monte-Carlo rank stability; neither can be reproduced by a standalone
         script that does not carry the register. */
      handoff: { provides: [], accepts: [] }
    });
  } catch (e) { }
}

/* ---------- boot ----------
   The shell renders from the manifest before anything is fetched, and
   Diagram.init() is unconditional. A failed register costs the results, never
   the chrome (UI_FRAMEWORK_SPEC section 3, UI_AUDIT S-2). */
function loaded() {
  initGeo();
  if (RESTORED) {
    S.coast = coastKm(S.lon, S.lat);          /* display only: never clobber a shared link */
  } else {
    locate();
    S.preset = null; S.adv = false; S.siteTouched = false; S.sheet = null;
  }
  readHash();
  if (APP && APP.lang !== S.lang) { APP.setLang(S.lang); return; }
  paintFooter();
  if (APP) { APP.ready(); refresh(false); } else { plainRefresh(); }
}

function start() {
  PANELDEFS = panels();
  try { buildApp(); } catch (e) { APP = null; plainShell(String(e && e.message || e)); }
  dgcInit();
  // Dynamic same-origin snapshot. External sources are contacted only by the
  // server-side cron updater, never by the user's browser.
  fetch('smr-data.json', { cache: 'no-store', credentials: 'same-origin' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => { window.DATA = d; window.DATA_SRC = 'smr-data.json'; loaded(); })
    .catch(e => {
      LOADFAILED = true;
      paintFooter();
      const msg = TX('ui.nodata') + ' (' + String(e && e.message || e) + ')';
      if (APP) APP.fail(msg);
      else {
        const h = bodyHost();
        if (h) { h.hidden = false; h.innerHTML = '<div class="note bad">' + esc(msg) + '</div>'; }
      }
    });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
else start();
</script>
