<script type="application/json" id="diagram-tool-manifest">{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision":"2026-08-14.taxonomy1","id":"smrselector","file":"smrselector.html","listed":true,"category":"nuclear-eng","order":6,"title":{"en":"Small Modular Reactor Screening","uk":"Відбір малих модульних реакторів","de":"Screening kleiner modularer Reaktoren","nl":"Screening van kleine modulaire reactoren","fr":"Présélection de petits réacteurs modulaires","es":"Cribado de reactores modulares pequeños","pl":"Wstępna selekcja małych reaktorów modułowych"},"summary":{"en":"Small modular reactors are a catalogue of about a hundred designs of which perhaps fifteen could actually be ordered, so the matching is the easy part and the honesty is everything.","uk":"Малі модульні реактори - це каталог приблизно зі ста проєктів, з яких замовити реально можна десь п'ятнадцять, тож саме зіставлення тут просте, а вся цінність у чесності.","de":"Kleine modulare Reaktoren sind ein Katalog von rund hundert Entwürfen, von denen sich vielleicht fünfzehn tatsächlich bestellen lassen; die Zuordnung ist damit der leichte Teil, und alles hängt an der Ehrlichkeit.","nl":"Kleine modulaire reactoren vormen een catalogus van ongeveer honderd ontwerpen waarvan er misschien vijftien werkelijk te bestellen zijn; het koppelen is dus het makkelijke deel en alles draait om eerlijkheid.","fr":"Les petits réacteurs modulaires forment un catalogue d'une centaine de concepts dont une quinzaine peuvent réellement être commandés : l'appariement est donc la partie facile et tout tient à l'honnêteté.","es":"Los reactores modulares pequeños son un catálogo de un centenar de diseños de los que quizá quince pueden pedirse de verdad, así que emparejarlos es la parte fácil y todo depende de la honestidad.","pl":"Dopasuj projekty małych reaktorów modułowych do rzeczywistej lokalizacji i wymagań, najpierw stosując twarde filtry, a potem ranking."},"description":{"en":"Small modular reactors are a catalogue of about a hundred designs of which perhaps fifteen could actually be ordered, so the matching is the easy part and the honesty is everything. Give the tool a point on the map and a requirement - process temperature, power, redundancy scheme, the year the energy is needed - and it eliminates first: what the law of that country forbids, what no supplier bloc may ship there, what cannot reach the temperature, what cannot physically be delivered to the site, what cannot exist by that date. Every elimination is printed together with the rule that caused it. What survives is placed on two axes, requirement fit against delivery confidence, and ranked by weights you set yourself, because combining those two is a value judgement and not the tool's to make. It tells you when the ranking is unstable, when a shortlist is one fuel bottleneck wearing three disguises, and when the honest answer is that you do not want a reactor at all. A fourth tab drops the site and the requirement altogether and simply lists all twenty-eight designs, filtered on electrical and thermal output, coolant, fuel, enrichment and vendor country; open any row for a full sheet with a temperature scale showing what that heat actually reaches, and every source behind it.","uk":"Малі модульні реактори - це каталог приблизно зі ста проєктів, з яких замовити реально можна десь п'ятнадцять, тож саме зіставлення тут просте, а вся цінність у чесності. Ви задаєте точку на карті й потребу - технологічну температуру, потужність, схему резервування, рік, до якого потрібна енергія, - а інструмент спершу відсіює: що забороняє закон цієї країни, чого не постачить жоден блок, що не дає потрібної температури, що фізично не доїде до майданчика, чого не існуватиме до вашої дати. Кожен відсів друкується разом із правилом, яке його спричинило. Те, що лишилося, розміщується на двох осях - відповідність потребі проти впевненості в реалізації - і ранжується за вагами, які задаєте ви, бо поєднання цих двох осей є ціннісним судженням і належить не інструменту. Він скаже, коли ранжування нестійке, коли короткий список - це одне паливне вузьке місце в трьох личинах, і коли чесна відповідь полягає в тому, що реактор вам не потрібен. Четверта вкладка взагалі відкидає майданчик і потребу й просто перелічує всі двадцять вісім проєктів із фільтрами за електричною та тепловою потужністю, теплоносієм, паливом, збагаченням і країною вендора; відкрийте будь-який рядок, щоб побачити повний аркуш зі шкалою температур, яка показує, чого це тепло справді сягає, і всі джерела за ним.","de":"Kleine modulare Reaktoren sind ein Katalog von rund hundert Entwürfen, von denen sich vielleicht fünfzehn tatsächlich bestellen lassen; die Zuordnung ist damit der leichte Teil, und alles hängt an der Ehrlichkeit. Sie geben einen Punkt auf der Karte und einen Bedarf vor - Prozesstemperatur, Leistung, Redundanzschema, das Jahr, in dem die Energie gebraucht wird - und das Werkzeug scheidet zuerst aus: was das Recht dieses Landes verbietet, was kein Lieferblock dorthin liefern darf, was die Temperatur nicht erreicht, was den Standort physisch nicht erreichen kann, was bis zu diesem Termin nicht existieren wird. Jeder Ausschluss wird zusammen mit der Regel gedruckt, die ihn ausgelöst hat. Was übrig bleibt, liegt auf zwei Achsen - Eignung gegen Realisierungswahrscheinlichkeit - und wird nach Gewichten sortiert, die Sie selbst setzen, denn deren Verrechnung ist ein Werturteil und steht dem Werkzeug nicht zu. Es sagt Ihnen, wann die Rangfolge instabil ist, wann eine Auswahlliste ein einziger Brennstoff-Engpass in drei Verkleidungen ist, und wann die ehrliche Antwort lautet: kein Reaktor. Ein vierter Reiter lässt Standort und Bedarf ganz weg und listet schlicht alle achtundzwanzig Entwürfe, gefiltert nach elektrischer und thermischer Leistung, Kühlmittel, Brennstoff, Anreicherung und Land des Anbieters; jede Zeile öffnet ein vollständiges Blatt mit einer Temperaturskala, die zeigt, wofür diese Wärme wirklich reicht, samt allen Quellen dahinter.","nl":"Kleine modulaire reactoren vormen een catalogus van ongeveer honderd ontwerpen waarvan er misschien vijftien werkelijk te bestellen zijn; het koppelen is dus het makkelijke deel en alles draait om eerlijkheid. U geeft een punt op de kaart en een behoefte op - procestemperatuur, vermogen, redundantieschema, het jaar waarin de energie nodig is - en het hulpmiddel schrapt eerst: wat de wet van dat land verbiedt, wat geen enkel leveranciersblok daarheen mag leveren, wat de temperatuur niet haalt, wat de locatie fysiek niet kan bereiken, wat er op die datum nog niet is. Elke schrapping wordt afgedrukt samen met de regel die haar veroorzaakte. Wat overblijft komt op twee assen te staan - aansluiting op de eis tegenover vertrouwen in oplevering - en wordt gerangschikt met wegingen die u zelf instelt, want die twee verrekenen is een waardeoordeel en niet aan het hulpmiddel. Het zegt wanneer de rangorde onstabiel is, wanneer een shortlist één brandstofknelpunt in drie vermommingen is, en wanneer het eerlijke antwoord luidt dat u helemaal geen reactor wilt. Een vierde tabblad laat locatie en eis helemaal weg en somt eenvoudig alle achtentwintig ontwerpen op, gefilterd op elektrisch en thermisch vermogen, koelmiddel, splijtstof, verrijking en land van de leverancier; elke regel opent een volledig blad met een temperatuurschaal die laat zien wat die warmte werkelijk haalt, met alle bronnen erachter.","fr":"Les petits réacteurs modulaires forment un catalogue d'une centaine de concepts dont une quinzaine peuvent réellement être commandés : l'appariement est donc la partie facile et tout tient à l'honnêteté. Vous donnez un point sur la carte et un besoin - température de procédé, puissance, schéma de redondance, année où l'énergie est nécessaire - et l'outil élimine d'abord : ce que la loi de ce pays interdit, ce qu'aucun bloc fournisseur ne peut y livrer, ce qui n'atteint pas la température, ce qui ne peut physiquement pas parvenir au site, ce qui n'existera pas à cette date. Chaque élimination est imprimée avec la règle qui l'a provoquée. Ce qui survit est placé sur deux axes - adéquation au besoin face à la confiance dans la livraison - et classé selon des pondérations que vous fixez vous-même, car les combiner est un jugement de valeur qui n'appartient pas à l'outil. Il vous dit quand le classement est instable, quand une présélection n'est qu'un seul goulot d'étranglement combustible sous trois déguisements, et quand la réponse honnête est que vous ne voulez pas de réacteur du tout. Un quatrième onglet laisse de côté le site et le besoin et se contente de lister les vingt-huit concepts, filtrés par puissance électrique et thermique, caloporteur, combustible, enrichissement et pays du fournisseur ; chaque ligne ouvre une fiche complète avec une échelle de température montrant ce que cette chaleur atteint réellement, et toutes ses sources.","es":"Los reactores modulares pequeños son un catálogo de un centenar de diseños de los que quizá quince pueden pedirse de verdad, así que emparejarlos es la parte fácil y todo depende de la honestidad. Usted da un punto en el mapa y una necesidad - temperatura de proceso, potencia, esquema de redundancia, el año en que hace falta la energía - y la herramienta elimina primero: lo que prohíbe la ley de ese país, lo que ningún bloque proveedor puede suministrar allí, lo que no alcanza la temperatura, lo que no puede llegar físicamente al emplazamiento, lo que no existirá para esa fecha. Cada eliminación se imprime junto con la regla que la causó. Lo que sobrevive se coloca en dos ejes - ajuste a la necesidad frente a confianza en la ejecución - y se ordena con pesos que usted mismo fija, porque combinarlos es un juicio de valor que no corresponde a la herramienta. Le dice cuándo la clasificación es inestable, cuándo una lista corta es un solo cuello de botella de combustible con tres disfraces, y cuándo la respuesta honesta es que no quiere un reactor en absoluto. Una cuarta pestaña prescinde del emplazamiento y de la necesidad y simplemente lista los veintiocho diseños, filtrados por potencia eléctrica y térmica, refrigerante, combustible, enriquecimiento y país del proveedor; cada fila abre una ficha completa con una escala de temperatura que muestra hasta dónde llega ese calor de verdad, y todas sus fuentes.","pl":"Porównaj projekty małych reaktorów modułowych z rzeczywistą lokalizacją i wymaganiami. Najpierw stosowane są twarde filtry prawne, eksportowe, termodynamiczne, logistyczne i harmonogramowe; następnie projekty są porządkowane na dwóch osiach według wag ustawionych przez użytkownika."},"status":"prototype","independent_validation":false,"limitations":{"en":"A screening aid, not a feasibility study, and no output of it is an engineering recommendation. The dataset is a frozen snapshot dated 2026-08-08 compiled from vendor publications, regulator dockets and trade press; national policy is the fastest-changing field in it and may already be out of date. Deliverable heat temperature, what counts as a final investment decision and the standing of a vendor are judgements, not measurements. Heavy-transport access is inferred from distance to the coastline - no rail, road or waterway data is used, and that field is meant to be corrected by hand. Eighty-five of the countries on the map lie outside the policy dataset, and for those no legal, export-control or schedule gate is applied at all. Power plant locations date from 2018-2021, so a plant listed near a site may since have closed. The rank-stability percentages come from a 400-draw Monte-Carlo over the weights and the axis scores; the draw is seeded from the screening inputs, so the same site and requirement always produce the same figure, but it is a sampling estimate and not a probability of anything happening in the world.","uk":"Це засіб попереднього відбору, а не техніко-економічне обґрунтування, і жоден його результат не є інженерною рекомендацією. Дані - заморожений знімок від 2026-08-08, зібраний із публікацій вендорів, матеріалів регуляторів і галузевої преси; національна політика змінюється в ньому найшвидше і може бути вже застарілою. Температура корисного тепла, те, що вважати остаточним інвестиційним рішенням, і становище постачальника - це судження, а не вимірювання. Доступ для важких вантажів визначається за відстанню до узбережжя: дані про залізниці, дороги та водні шляхи не використовуються, і це поле призначене для ручного виправлення. Вісімдесят п'ять країн на карті лежать поза базою політики, і для них правові, експортні та строкові фільтри не застосовуються взагалі. Розташування електростанцій узято за 2018-2021 роки, тож станція поблизу майданчика могла вже закритися. Відсотки стійкості рангу отримано методом Монте-Карло з 400 розіграшів за вагами та оцінками осей; розіграш засівається вхідними даними відбору, тож той самий майданчик і та сама вимога завжди дають те саме число, але це вибіркова оцінка, а не ймовірність чогось у реальному світі.","de":"Eine Screening-Hilfe, keine Machbarkeitsstudie, und keine ihrer Ausgaben ist eine ingenieurtechnische Empfehlung. Der Datenbestand ist ein eingefrorener Stand vom 2026-08-08 aus Herstellerveröffentlichungen, Behördenakten und Fachpresse; die Landespolitik ändert sich darin am schnellsten und kann bereits überholt sein. Die lieferbare Wärmetemperatur, was als endgültige Investitionsentscheidung zählt, und die Stellung eines Anbieters sind Einschätzungen, keine Messungen. Der Zugang für Schwertransporte wird aus der Küstenentfernung abgeleitet - es werden keine Schienen-, Straßen- oder Wasserstraßendaten verwendet, und dieses Feld ist zum Korrigieren von Hand gedacht. Fünfundachtzig der Länder auf der Karte liegen außerhalb der Politikdatenbank; dort werden rechtliche, exportkontrollrechtliche und terminliche Filter gar nicht angewandt. Die Kraftwerksstandorte stammen aus 2018-2021, ein in der Nähe gelistetes Kraftwerk kann also stillgelegt sein. Die Prozentwerte der Rangstabilität stammen aus einer Monte-Carlo-Ziehung mit 400 Durchläufen über die Gewichte und die Achsenwerte; die Ziehung wird aus den Eingaben des Screenings gesetzt, sodass derselbe Standort und dieselbe Anforderung stets denselben Wert ergeben — es bleibt aber eine Stichprobenschätzung und keine Eintrittswahrscheinlichkeit.","nl":"Een hulpmiddel voor screening, geen haalbaarheidsstudie, en geen enkele uitkomst ervan is een technisch advies. De gegevens zijn een bevroren momentopname van 2026-08-08, samengesteld uit publicaties van leveranciers, dossiers van toezichthouders en vakpers; landbeleid verandert daarin het snelst en kan al achterhaald zijn. De leverbare warmtetemperatuur, wat als definitief investeringsbesluit telt en de positie van een leverancier zijn beoordelingen, geen metingen. De toegang voor zwaar transport wordt afgeleid uit de afstand tot de kust - er worden geen spoor-, weg- of vaarweggegevens gebruikt en dat veld is bedoeld om met de hand te corrigeren. Vijfentachtig landen op de kaart vallen buiten de beleidsdatabase; daar worden juridische, exportcontrole- en planningsfilters helemaal niet toegepast. De locaties van centrales dateren uit 2018-2021, dus een centrale in de buurt kan intussen gesloten zijn. De percentages voor rangschikkingsstabiliteit komen uit een monte-carlotrekking van 400 herhalingen over de wegingen en de asscores; de trekking wordt gezaaid vanuit de invoer van de screening, zodat dezelfde locatie en eis altijd hetzelfde getal opleveren, maar het blijft een steekproefschatting en geen kans dat iets werkelijk gebeurt.","fr":"Une aide à la présélection, pas une étude de faisabilité, et aucune de ses sorties n'est un avis d'ingénierie. Les données sont un instantané figé au 2026-08-08, compilé à partir de publications de fournisseurs, de dossiers d'autorités de sûreté et de la presse spécialisée ; la politique nationale y est le champ qui évolue le plus vite et peut déjà être dépassée. La température de chaleur livrable, ce qui compte comme décision finale d'investissement et la solidité d'un fournisseur sont des jugements, pas des mesures. L'accès pour les charges lourdes est déduit de la distance à la côte - aucune donnée ferroviaire, routière ou fluviale n'est utilisée, et ce champ est fait pour être corrigé à la main. Quatre-vingt-cinq des pays de la carte sont hors de la base de politique nucléaire, et pour eux aucun filtre juridique, d'export ou de calendrier n'est appliqué. Les emplacements des centrales datent de 2018-2021 : une centrale indiquée près du site peut avoir fermé depuis. Les pourcentages de stabilité du classement proviennent d'un tirage de Monte-Carlo à 400 réalisations sur les pondérations et les notes d'axes ; le tirage est initialisé à partir des entrées du criblage, de sorte que le même site et la même exigence donnent toujours le même chiffre, mais il s'agit d'une estimation par échantillonnage et non d'une probabilité d'occurrence.","es":"Una ayuda al cribado, no un estudio de viabilidad, y ninguna de sus salidas es una recomendación de ingeniería. Los datos son una instantánea congelada del 2026-08-08, compilada de publicaciones de proveedores, expedientes de reguladores y prensa especializada; la política nacional es el campo que cambia más deprisa y puede estar ya desfasado. La temperatura de calor entregable, lo que cuenta como decisión final de inversión y la solidez de un proveedor son juicios, no medidas. El acceso para cargas pesadas se deduce de la distancia a la costa: no se usan datos de ferrocarril, carretera ni vías navegables, y ese campo está pensado para corregirse a mano. Ochenta y cinco de los países del mapa quedan fuera de la base de política nuclear y para ellos no se aplica ningún filtro legal, de control de exportaciones ni de calendario. Las ubicaciones de centrales son de 2018-2021, así que una central cercana puede haber cerrado. Los porcentajes de estabilidad de la clasificación proceden de un muestreo de Monte Carlo de 400 realizaciones sobre los pesos y las puntuaciones de los ejes; el muestreo se siembra a partir de las entradas del cribado, de modo que el mismo emplazamiento y el mismo requisito dan siempre la misma cifra, pero es una estimación muestral y no una probabilidad de que algo ocurra.","pl":"Narzędzie do wstępnej selekcji, nie studium wykonalności ani rekomendacja inżynierska. Dane są migawką i wymagają ponownej weryfikacji przed użyciem."},"intended_use":["education","technical exploration","preliminary assessment"],"catalog_languages":["en","uk","de","nl","fr","es","pl"],"tool_languages":["en","uk","de","nl","fr","es","pl"],"dependencies":["smr-change-log.json","smr-data.json","smr-update-status.json"],"network_access":{"mode":"same-origin-data","note":"Fetches only its own declared local files smr-data.json, smr-change-log.json and smr-update-status.json from this site. Those datasets are refreshed by a server-side updater; the browser contacts no external source."},"validation":{"basis":{"en":"Prototype, deliberately. 10 of 10 benchmark cases pass, but they do not cover the thing that matters most: the register itself. smr-data.json, smr-change-log.json and smr-update-status.json are server-maintained and are not part of this deployment tree, so no design record, output, temperature, licensing stage or national-policy entry could be checked against any source — there was no data here to check. What was benchmarked is the no-dataset path on the tree as it really is, the six-language catalogue, and the screening gates, ranking invariants and catalogue filters driven through the DOM against a synthetic fixture in which every design is built to trip exactly one documented gate. Until the register itself is benchmarked this tool stays a prototype whatever the case tally says.","uk":"Прототип — свідомо. 10 з 10 випадків пройдено, але вони не охоплюють головного: самого реєстру. Файли smr-data.json, smr-change-log.json і smr-update-status.json підтримуються на сервері й не входять до цього дерева, тож жоден запис про проєкт, потужність, температуру, стадію ліцензування чи національну політику не звірявся з джерелом — тут просто немає що звіряти. Перевірено: поведінку без набору даних на реальному дереві, шестимовний каталог, а також відсіювальні правила, інваріанти ранжування та фільтри каталогу через DOM на синтетичному наборі, де кожен проєкт порушує рівно одне задокументоване правило. Доки не перевірено сам реєстр, інструмент лишається прототипом.","de":"Bewusst Prototyp. 10 von 10 Prüffällen bestanden, doch sie decken das Wichtigste nicht ab: das Register selbst. smr-data.json, smr-change-log.json und smr-update-status.json werden auf dem Server gepflegt und gehören nicht zu diesem Deploy-Baum; kein Entwurfsdatensatz, keine Leistung, Temperatur, Genehmigungsstufe und kein Eintrag zur nationalen Politik konnte gegen eine Quelle geprüft werden — es waren hier keine Daten vorhanden. Geprüft wurden der Pfad ohne Datensatz am realen Baum, der sechssprachige Katalog sowie Ausschlussregeln, Rangfolge-Invarianten und Katalogfilter über das DOM gegen einen synthetischen Datensatz, in dem jeder Entwurf genau eine dokumentierte Regel verletzt. Solange das Register selbst ungeprüft ist, bleibt dies ein Prototyp.","nl":"Bewust prototype. 10 van 10 toetsgevallen slagen, maar ze dekken niet wat het zwaarst weegt: het register zelf. smr-data.json, smr-change-log.json en smr-update-status.json worden op de server onderhouden en horen niet bij deze deploy-boom, dus geen enkel ontwerprecord, vermogen, temperatuur, vergunningsfase of nationaal beleidsitem kon aan een bron worden getoetst — er stonden hier geen gegevens. Getoetst zijn het pad zonder dataset op de werkelijke boom, de zestalige catalogus, en de uitsluitregels, rangschikkingsinvarianten en catalogusfilters via de DOM tegen een synthetische set waarin elk ontwerp precies één gedocumenteerde regel schendt. Zolang het register zelf niet is getoetst blijft dit een prototype.","fr":"Prototype, délibérément. 10 cas sur 10 réussissent, mais ils ne couvrent pas l'essentiel : le répertoire lui-même. smr-data.json, smr-change-log.json et smr-update-status.json sont maintenus sur le serveur et ne font pas partie de cet arbre de déploiement ; aucun enregistrement de conception, puissance, température, étape d'autorisation ou position nationale n'a pu être vérifié auprès d'une source — il n'y avait ici aucune donnée à vérifier. Ont été contrôlés : le comportement sans jeu de données sur l'arbre réel, le catalogue en six langues, et les critères d'élimination, les invariants du classement et les filtres du catalogue pilotés dans le DOM face à un jeu synthétique où chaque conception enfreint exactement une règle documentée. Tant que le répertoire n'est pas contrôlé, cela reste un prototype.","es":"Prototipo, deliberadamente. 10 de 10 casos superados, pero no cubren lo más importante: el propio repertorio. smr-data.json, smr-change-log.json y smr-update-status.json se mantienen en el servidor y no forman parte de este árbol de despliegue, así que ningún registro de diseño, potencia, temperatura, etapa de licenciamiento o posición nacional pudo contrastarse con una fuente: aquí no había datos que comprobar. Sí se comprobaron la ruta sin conjunto de datos sobre el árbol real, el catálogo en seis idiomas y los criterios de exclusión, los invariantes de la clasificación y los filtros del catálogo, guiados por el DOM frente a un conjunto sintético en el que cada diseño infringe exactamente una regla documentada. Mientras el repertorio no se compruebe, esto sigue siendo un prototipo.","pl":"Prototype, deliberately. 10 of 10 benchmark cases pass, but they do not cover the thing that matters most: the register itself. smr-data.json, smr-change-log.json and smr-update-status.json are server-maintained and are not part of this deployment tree, so no design record, output, temperature, licensing stage or national-policy entry could be checked against any source — there was no data here to check. What was benchmarked is the no-dataset path on the tree as it really is, the six-language catalogue, and the screening gates, ranking invariants and catalogue filters driven through the DOM against a synthetic fixture in which every design is built to trip exactly one documented gate. Until the register itself is benchmarked this tool stays a prototype whatever the case tally says."},"independent_validation":false,"benchmarks":[{"id":"screening-logic-on-a-synthetic-fixture","reference":"DATA-INTEGRITY benchmark, not a physics one: the tool screens reactor designs against a site and a requirement by evaluating a documented set of gates and a weighted score. THE SHIPPED CORPUS COULD NOT BE BENCHMARKED: smr-data.json, smr-change-log.json and smr-update-status.json are server-maintained and are deliberately not part of this deployment tree, so the tool as deployed renders \"No dataset\" and cannot be exercised. What is benchmarked is the no-dataset path itself on the tree as it really is, the six-language catalogue that is in the tree, and the screening and catalogue logic driven through the DOM against a synthetic fixture served from a benchmark overlay (/root/bench/fixtures/smr-data.FIXTURE.json, never written into the site). Every design in that fixture is constructed to violate exactly one documented gate, or none, so the expected outcome follows from the specification rather than from the tool's own code; the ranking is checked against invariants that must hold whatever the data.","citations":["Specification-based fixture: /root/bench/fixtures/smr-data.FIXTURE.json, built by this benchmark so that each design violates exactly one gate documented in the tool's own gate vocabulary (gate.notproc, gate.heatonly, gate.temp, gate.modules, gate.water, gate.transport, gate.timing, gate.turbine, gate.bloc_ru, gate.bloc_cn, gate.prohibited, gate.phaseout).","Catalogue filter expectations recomputed directly from the fixture records in the driver, independently of the page's catList().","Ranking invariants: a probability distribution over the surviving designs must sum to one, order must follow score, and scores must stay inside the 0-100 range the tool prints."],"cases":10,"passed":10,"tolerance":"Exact. Every gate must fire for exactly the designs the fixture was built to trip and for no others; every catalogue filter must return exactly the recomputed set; the pass and eliminated sets must partition the register exactly; the win probabilities must sum to 1 within 1e-9. Nothing here is a physical quantity, so no physical tolerance applies.","run_at":"2026-08-12T02:49:23.458Z","artifact":"benchmarks/smrselector.json"}]},"report":{"pdf":true,"source_attribution":true},"python_export":{"supported":false,"reason":{"en":"The result is a selection out of a server-maintained register plus a Monte-Carlo rank stability; a standalone script cannot carry the register.","uk":"Результат — вибірка з реєстру, що підтримується на сервері, плюс оцінка стійкості рангу методом Монте-Карло; окремий скрипт не може нести цей реєстр.","de":"Das Ergebnis ist eine Auswahl aus einem serverseitig gepflegten Register samt Monte-Carlo-Rangstabilität; ein eigenständiges Skript kann das Register nicht mitführen.","nl":"Het resultaat is een selectie uit een op de server onderhouden register plus een Monte-Carlo-rangstabiliteit; een losstaand script kan dat register niet meedragen.","fr":"Le résultat est une sélection dans un répertoire maintenu sur le serveur, assortie d'une stabilité de classement Monte-Carlo ; un script autonome ne peut pas embarquer ce répertoire.","es":"El resultado es una selección de un repertorio mantenido en el servidor más una estabilidad de clasificación de Monte Carlo; un script independiente no puede llevar ese repertorio.","pl":"The result is a selection out of a server-maintained register plus a Monte-Carlo rank stability; a standalone script cannot carry the register."}},"handoff":{"provides":[],"accepts":[]},"state_codec":{"permalink":true,"record":"tools.petrov.re/calculation-record/v1"},"ui":{"framework":"tools.petrov.re/ui/v1","level":3}}</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Small Modular Reactor Screening</title>
<meta name="description" content="Screen small modular reactor designs against a real site and a real requirement: hard legal, export-control, thermodynamic, logistical and schedule gates first, then a two-axis ranking whose weights you set yourself.">
<style>
/* smrselector — tool CSS on the v3 token layer.
   No colour, radius, shadow, font-size or spacing literal except the categorical
   maturity palette of the catalogue 2-D map (see .m-*), which encodes six project
   stages and has no equivalent in the three semantic tones of the token set.
   Breakpoints: only the four of UI_FRAMEWORK_SPEC section 2.4. */
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 var(--fs-body)/1.55 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}

/* Framework defect, repaired locally: UI_FRAMEWORK_SPEC 4.5 requires a tap target
   of at least 44 px below md, but diagram-ui.js sizes .dgu-sel at --ctl-h (36 px)
   and pins .dgu-q to 28 px there. Both fixes belong upstream in diagram-ui.js. */
@media(max-width:768px){
  .dgu-app .dgu-sel{min-height:var(--tap)}
  .dgu-app button.dgu-q.dgu-q{width:var(--tap);height:var(--tap);border-color:transparent;background:transparent}
  .dgu-app .dgu-seg button{min-height:var(--tap)}
  .dgu-app .dgu-field.range .dgu-fctl{min-height:var(--tap)}
}
/* Framework defect, repaired locally: UI_FRAMEWORK_SPEC section 7 says tiles never
   render fewer than two per row above sm, but diagram-ui.js's own minmax(150px,1fr)
   cannot fit two into its own 340 px results column. Belongs upstream. */
.dgu-app .dgu-tiles{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}

/* fields whose label is intentionally empty (button rows, preset tiles) */
.dgu-field .dgu-flabel:empty{display:none}
.dgu-field.custom>.dgu-frow>.dgu-fctl{border:0;background:transparent;padding:0;min-height:0}
.dgu-field.custom .dgu-btn{width:100%}

/* The requirement form and the catalogue filters were a two/three column grid
   before the port; a panel's own field arrangement stays the tool's business. */
[data-dgu-panel="smr-need"] .dgu-fields,
[data-dgu-panel="smr-catf"] .dgu-fields{display:grid;align-items:start;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--sp-3) var(--sp-4)}

/* Degraded mode: the token layer is exactly the thing that failed to load, so this
   block is structural only — em-based, no colour, no token. */
#app.smr-plain{max-width:70em;margin:0 auto;padding:1em}
.smr-plain label{display:block;margin:.6em 0;max-width:32em}
.smr-plain label input,.smr-plain label select{display:block;width:100%;min-height:2.75em}
.smr-plain button{min-height:2.75em;margin:.2em .4em .2em 0}
.smr-plain nav{margin:.8em 0}
/* without the token layer every var() is invalid, so the figures fall back to
   the current text colour rather than to solid black */
.smr-plain svg.map{height:auto}
.smr-plain svg.map path.land{fill:none;stroke:currentColor;stroke-width:.3}
.smr-plain svg.map path.sel{fill:currentColor;fill-opacity:.25;stroke:currentColor}
.smr-plain svg.map circle.pin{fill:currentColor;stroke:none}
.smr-plain .sc-grid,.smr-plain .db2d .grid,.smr-plain .db2d .axis,.smr-plain .sc-lead{stroke:currentColor;opacity:.3}
.smr-plain .sc-bg{fill:none}
.smr-plain .sc-pt,.smr-plain .db2d .pt,.smr-plain .tbar{fill:currentColor}
.smr-plain .sc-tick,.smr-plain .sc-ax,.smr-plain .sc-lbl,.smr-plain .db2d .tick,.smr-plain .db2d .axislabel{fill:currentColor}
.smr-plain .tmark{stroke:currentColor}

/* ---------------------------------------------------------- text helpers */
.smr h3{font:650 var(--fs-section)/1.3 var(--font);text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);margin:var(--sp-4) 0 var(--sp-2)}
.smr h3:first-child{margin-top:0}
.smr>section+section{margin-top:var(--sp-4)}
.hint{color:var(--muted);font-size:var(--fs-small);margin:0 0 var(--sp-3)}
.hint:last-child{margin-bottom:0}
.dim{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.src{font-size:var(--fs-small);color:var(--muted);line-height:1.5}
.src a{color:var(--muted)}

/* ---------------------------------------------------------- badges, notes */
.badge{display:inline-block;padding:0 var(--sp-2);border-radius:var(--radius-pill);
  font:650 var(--fs-micro)/1.8 var(--font);border:1px solid transparent}
.b-good{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-neut{background:var(--weak);color:var(--muted);border-color:var(--line)}
.note{border-left:var(--sp-1) solid var(--accent);background:var(--weak);padding:var(--sp-3);
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin:var(--sp-3) 0;font-size:var(--fs-label)}
.note:first-child{margin-top:0}
.note.warn{border-color:var(--warn);background:var(--warn-bg)}
.note.bad{border-color:var(--bad);background:var(--bad-bg)}
.note.good{border-color:var(--ok);background:var(--ok-bg)}
.note ul{margin:var(--sp-1) 0 0;padding-left:var(--sp-4)}

/* ---------------------------------------------------------- key/value list */
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--sp-1) var(--sp-4);
  font-size:var(--fs-label);margin:var(--sp-2) 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* ---------------------------------------------------------- ranking cards */
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:var(--sp-3);margin-bottom:var(--sp-3)}
.card.top{border-color:var(--accent)}
.card h3{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;margin:0 0 var(--sp-1);
  font:650 var(--fs-body)/1.35 var(--font);text-transform:none;letter-spacing:normal;color:var(--ink)}
.rankno{font:650 var(--fs-body)/1.2 var(--font);color:var(--accent);min-width:var(--sp-5)}
.find{display:flex;gap:var(--sp-2);margin:var(--sp-1) 0;font-size:var(--fs-label);line-height:1.45}
.find i{flex:0 0 var(--sp-1);height:var(--sp-1);border-radius:var(--radius-pill);
  margin-top:var(--sp-2);background:var(--muted);font-style:normal}
.find.good i{background:var(--ok)}
.find.warn i{background:var(--warn);border-radius:0}
.find.bad i{background:var(--bad);border-radius:0;transform:rotate(45deg)}

/* ---------------------------------------------------------- module config */
.modcfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--sp-2);
  margin:var(--sp-2) 0}
.modcfg div{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:var(--sp-2)}
.modcfg div b{font:650 var(--fs-body)/1.2 var(--font);display:block;font-variant-numeric:tabular-nums}
.modcfg div span{font:500 var(--fs-micro)/1.3 var(--font);color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em}

/* ---------------------------------------------------------- order strip */
.ord{display:grid;grid-template-columns:var(--sp-5) minmax(0,1fr) minmax(0,7em) 3em 5em;
  gap:var(--sp-2);align-items:center;font-size:var(--fs-label);padding:var(--sp-1) 0}
.ord .onm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord .bar{background:var(--line);border-radius:var(--radius-pill);height:var(--sp-2);overflow:hidden}
.ord .bar i{display:block;height:100%;background:var(--accent);border-radius:var(--radius-pill)}
.ord .mv{font-size:var(--fs-micro);color:var(--muted);text-align:right}
.ord .mv.up{color:var(--ok)}
.ord .mv.dn{color:var(--bad)}
@media(max-width:480px){
  .ord{grid-template-columns:var(--sp-5) minmax(0,1fr) 3em}
  .ord .bar,.ord .mv{display:none}
}

/* ---------------------------------------------------------- preset tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--sp-2);width:100%}
.tile{border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--sp-2) var(--sp-3);
  cursor:pointer;background:var(--panel);text-align:left;font:400 var(--fs-label)/1.4 var(--font);
  color:var(--ink);min-height:var(--tap)}
.tile:hover{border-color:var(--accent);background:var(--weak)}
.tile.on{border-color:var(--accent);background:var(--weak);box-shadow:inset 0 0 0 1px var(--accent)}
.tile b{display:block;font-weight:650;margin-bottom:var(--sp-1)}
.tile span{font-size:var(--fs-small);color:var(--muted);line-height:1.4}

/* ---------------------------------------------------------- tables */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;min-width:0}
.smr table{width:100%;border-collapse:collapse;font-size:var(--fs-label)}
.smr th,.smr td{text-align:left;padding:var(--sp-1) var(--sp-2);border-bottom:1px solid var(--line);
  vertical-align:top}
.smr th{font:650 var(--fs-micro)/1.4 var(--font);text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted)}
tr.gate td{color:var(--muted)}
table.cat tbody tr{cursor:pointer}
table.cat tbody tr:hover{background:var(--weak)}
table.cat tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
table.cat td.r,table.cat th.r{text-align:right}
table.cat td{vertical-align:middle;white-space:nowrap}

/* ---------------------------------------------------------- world map */
svg.map{width:100%;height:100%;background:var(--panel-2);cursor:crosshair;display:block}
svg.map path.land{fill:var(--line);stroke:var(--muted);stroke-width:.25}
svg.map path.sel{fill:var(--accent);fill-opacity:.35;stroke:var(--accent);stroke-width:.5}
svg.map circle.pin{fill:var(--bad);stroke:var(--panel);stroke-width:.5}

/* ---------------------------------------------------------- scatter */
svg.scatter{width:100%;height:auto;display:block;border:1px solid var(--line);
  border-radius:var(--radius-sm);background:var(--panel-2)}
.sc-bg{fill:var(--panel-2)}
.sc-grid{stroke:var(--line)}
.sc-tick{fill:var(--muted);font:400 var(--fs-small) var(--font)}
.sc-ax{fill:var(--muted);font:400 var(--fs-small) var(--font)}
.sc-lbl{fill:var(--ink);font:400 var(--fs-small) var(--font)}
.sc-lead{stroke:var(--line)}
.sc-pt{fill:var(--muted);fill-opacity:.75;stroke:var(--panel)}
.sc-pt.p1{fill:var(--accent);fill-opacity:1}
.sc-pt.p2{fill:var(--accent);fill-opacity:.6}

/* ---------------------------------------------------------- catalogue 2-D map */
.db2d{width:100%;height:auto;display:block;background:var(--panel-2);border:1px solid var(--line);
  border-radius:var(--radius-sm)}
.db2d .grid{stroke:var(--line);stroke-width:1}
.db2d .axis{stroke:var(--muted);stroke-width:1.2}
.db2d .tick{fill:var(--muted);font:400 var(--fs-small) var(--font)}
.db2d .axislabel{fill:var(--ink);font:650 var(--fs-small) var(--font)}
.db2d .pt{stroke:var(--panel);stroke-width:1.6;cursor:pointer}
.db2d .pt:hover,.db2d .pt:focus{stroke:var(--ink);stroke-width:2.6;outline:none}
/* Categorical data encoding: six licensing stages. UI_FRAMEWORK_SPEC section 2 has
   no categorical palette; folding six stages onto ok/warn/bad would destroy the
   legend, so these six stay literal. Reported upstream as a framework gap. */
.m-concept{fill:#7c8796}.m-basic_design{fill:#6f63b6}.m-detailed_design{fill:#3c78b5}
.m-licensing{fill:#188e91}.m-construction{fill:#c77b25}.m-operating{fill:#18875d}
.m-unknown{fill:var(--muted)}
.db2d-legends{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:var(--sp-2) var(--sp-5);margin:var(--sp-2) 0 0}
.db2d-legend{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center;
  font-size:var(--fs-small);color:var(--muted)}
.db2d-key{display:inline-flex;align-items:center;gap:var(--sp-1);white-space:nowrap}
.db2d-key svg{width:var(--sp-4);height:var(--sp-4);overflow:visible}

/* ---------------------------------------------------------- temperature scale */
svg.tscale{width:100%;height:auto;display:block;margin:var(--sp-2) 0}
.tbar{fill:var(--accent)}
.tbar.dim2{fill:var(--accent);opacity:.28}
.tmark{stroke:var(--bad);stroke-width:2}

/* ---------------------------------------------------------- misc content */
.plant{display:flex;gap:var(--sp-2);align-items:center;padding:var(--sp-2) 0;
  border-bottom:1px solid var(--line);font-size:var(--fs-label);flex-wrap:wrap}
.plant b{flex:1 1 8em;min-width:0}
.smr details{border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--sp-2) var(--sp-3);
  margin:var(--sp-2) 0;background:var(--panel)}
/* Chrome hides the contents of a closed <details> with content-visibility, which
   leaves stale geometry and an empty innerText behind: DiagramUI.check() then
   reports links inside a collapsed disclosure as unreachable and unnamed. Taking
   them out of the box tree is what everyone assumes a closed <details> does.
   The false positive belongs upstream in DiagramUI.check(); this is the local fix. */
.smr details:not([open])>*:not(summary){display:none}
.smr summary{cursor:pointer;font-weight:500;font-size:var(--fs-label);min-height:var(--sp-5)}
.reactor-visual{margin:var(--sp-3) 0;max-width:100%}
.reactor-visual img{display:block;width:100%;max-height:60vh;object-fit:contain;
  border:1px solid var(--line);border-radius:var(--radius-sm)}
.reactor-visual figcaption{font-size:var(--fs-small);color:var(--muted);margin-top:var(--sp-1);line-height:1.4}
.reactor-visual figcaption a{color:inherit}
.kbline{margin-top:var(--sp-1);font-size:var(--fs-small);display:flex;gap:var(--sp-2);
  align-items:center;flex-wrap:wrap}
.kbline a{font-weight:650}
.kbok{color:var(--ok)}
.kbwarn{color:var(--warn)}
.smr-foot ul{margin:var(--sp-1) 0 0;padding-left:var(--sp-4)}
.smr-foot li{font-size:var(--fs-small);color:var(--muted);margin:var(--sp-1) 0}
.smr-rowbtns{display:flex;gap:var(--sp-2);flex-wrap:wrap;width:100%}
.smr-rowbtns .dgu-btn{flex:1 1 auto}
.smr-name{font:650 var(--fs-body)/1.3 var(--font);text-transform:none;letter-spacing:normal;
  color:var(--ink);margin:0 0 var(--sp-1)}
</style>

tencjału w Chinach zajęło około dwóch dekad w ramach państwowego programu.","find.leu":"Działa w oparciu o standardową wartość LEU poniżej 5% z istniejących linii komercyjnych — to najsilniejsza cecha redukująca ryzyko, jaką może mieć projekt.","find.online":"Przeładunek paliwa odbywa się online, więc proces nie musi być zatrzymywany z powodu paliwa.","find.outage":"Postój na przeładunek paliwa co {v} miesięcy. Przy jednym module proces zatrzymuje się razem z nim — to argument za N+1.","find.boo":"Dostępny model build-own-operate: klient kupuje energię zamiast zostawać operatorem jądrowym.","find.noboo":"Sprzedawany wyłącznie jako urządzenia. Klient musiałby zostać licencjonowanym operatorem jądrowym.","find.store":"Magazynowanie ciepła pozwala na znaczne wahania mocy wyjściowej, zarówno powyżej, jak i poniżej mocy reaktora, co ma realną wartość w przypadku niestabilnej sieci elektroenergetycznej.","find.air":"Dostępne chłodzenie powietrzem — nie są wymagane prawa do wody.","find.built":"Ten projekt został zbudowany i uruchomiony. Nic innego na liście nie może tego powiedzieć.","find.underconstruction":"Obecnie fizycznie w trakcie budowy elektrowni jądrowej.","find.nofid":"Żaden klient nie podjął jeszcze ostatecznej decyzji inwestycyjnej w tym projekcie.","find.distress":"Dostawca ma problemy finansowe. Jego harmonogramy należy traktować jako aspiracyjne.","find.small":"Przy mocy {v} MWe na moduł redundancja jest tania: koszt modułu zapasowego stanowi ułamek ceny elektrowni.","find.big":"Przy {v} MWe na moduł, N+1 oznacza duplikację bardzo dużej jednostki. Redundancja w tym przypadku jest kosztowna.","c.stance":"Pozycja","c.prohibited":"Zakaz","c.phase_out":"Wycofywanie energetyki jądrowej","c.moratorium":"Moratorium","c.no_program":"Brak programu","c.open_no_program":"Dopuszczona, bez programu","c.newcomer_program":"Program państwa nowego w energetyce jądrowej","c.operating_fleet":"Eksploatowana flota","c.expanding":"Rozbudowa","t.opening":"Otwarcie","t.stable":"St </script>
<script>// ============================================================== state
const S = {
  lang: 'en',
  lat: 51.5, lon: 4.3, iso: null, cname: '',
  access: 'rail', water: 'plenty', coast: null,
  retrofit: null, arch: 'none', reuseTurbine: false,
  output: 'elec', mwe: 300, mwth: 0, temp: 280,
  cont: 'yes', flex: 'none', grid: 'strong', surplus: false,
  red: 'n1', oper: 'any', year: 2035, life: 40, alt: 'mid',
  w: { fit: 60, conf: 70, fuel: 40, speed: 50, model: 40 },
  result: null, preset: null,
};
const YEAR_NOW = 2026;
const T = k => (I18N[S.lang] && I18N[S.lang][k]) || I18N.en[k] || k;
const fmt = (k, o) => { let s = T(k); for (const p in o) s = s.split('{' + p + '}').join(o[p]); return s; };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ============================================================== geo
// DATA arrives asynchronously (external snapshot, or the embedded fallback), so
// everything derived from it is built in initGeo() rather than at parse time.
let ARCS = null, CGEOM = null;
function initGeo() {
  const [sx, sy] = DATA.topo.transform.scale, [tx, ty] = DATA.topo.transform.translate;
  ARCS = DATA.topo.arcs.map(a => { let x = 0, y = 0; return a.map(d => { x += d[0]; y += d[1]; return [x * sx + tx, y * sy + ty]; }); });
  CGEOM = DATA.topo.objects.countries.geometries;
}
function ring(idxs) {
  let p = [];
  idxs.forEach((i, k) => { const a = i < 0 ? ARCS[~i].slice().reverse() : ARCS[i]; p = p.concat(k === 0 ? a : a.slice(1)); });
  return p;
}
function polys(g) { // -> array of arrays of rings
  if (g.type === 'Polygon') return [g.arcs.map(ring)];
  if (g.type === 'MultiPolygon') return g.arcs.map(pp => pp.map(ring));
  return [];
}
function inRing(pt, r) {
  let c = false;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const [xi, yi] = r[i], [xj, yj] = r[j];
    if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function countryAt(lon, lat) {
  const pt = [lon, lat];
  for (const g of CGEOM) {
    for (const poly of polys(g)) {
      if (poly.length && inRing(pt, poly[0]) && !poly.slice(1).some(h => inRing(pt, h)))
        return { a2: g.properties.a2, name: g.properties.name };
    }
  }
  // small islands and coastal points fall through the coarse 110m outline:
  // fall back to the nearest country boundary within ~250 km
  let best = null, bd = 1.0;
  for (const g of CGEOM) {
    for (const poly of polys(g)) for (const r of poly) for (const v of r) {
      const d = Math.hypot(dLon(v[0], lon) * Math.max(0.2, Math.cos(lat * Math.PI / 180)), v[1] - lat);
      if (d < bd) { bd = d; best = { a2: g.properties.a2, name: g.properties.name, near: true }; }
    }
  }
  return best;
}
let COASTPTS = null;
function coastPoints() {
  if (COASTPTS) return COASTPTS;
  const L = DATA.topo.objects.land, out = [];
  const gs = L.type === 'GeometryCollection' ? L.geometries : [L];
  gs.forEach(g => polys(g).forEach(p => p.forEach(r => r.forEach((v, i) => { if (i % 2 === 0) out.push(v); }))));
  COASTPTS = out; return out;
}
function kmTo(a, b) {
  const R = 6371, d2r = Math.PI / 180;
  const dLat = (b[1] - a[1]) * d2r, dLon = (b[0] - a[0]) * d2r;
  const la = a[1] * d2r, lb = b[1] * d2r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(la) * Math.cos(lb) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}
const dLon = (a, b) => Math.abs(((a - b + 540) % 360) - 180);   // antimeridian-safe
function coastKm(lon, lat) {
  let best = 1e9;
  const win = Math.min(180, 22 / Math.max(0.15, Math.cos(lat * Math.PI / 180)));
  for (const p of coastPoints()) {
    const dx = dLon(p[0], lon), dy = Math.abs(p[1] - lat);
    if (dx > win || dy > 22) continue;
    const d = kmTo([lon, lat], p); if (d < best) best = d;
  }
  return best > 1e8 ? null : Math.round(best);
}
const FUELN = { C: 'Coal', G: 'Gas', O: 'Oil', B: 'Biomass', K: 'Cogen', W: 'Waste' };
function nearbyPlants(lon, lat, n) {
  const out = [];
  const win = Math.min(180, 3.6 / Math.max(0.05, Math.cos(lat * Math.PI / 180)));
  for (const p of DATA.plants) {
    if (Math.abs(p[1] - lat) > 2.2 || dLon(p[2], lon) > win) continue;
    const d = kmTo([lon, lat], [p[2], p[1]]);
    if (d <= 150) out.push({ n: p[0], lat: p[1], lon: p[2], mw: p[3], f: p[4], y: p[5], km: Math.round(d) });
  }
  out.sort((a, b) => a.km - b.km);
  return out.slice(0, n || 6);
}
function archOf(p) {
  if (p.f === 'G') return 'ccgt';
  if (p.f !== 'C') return 'sub';
  if (p.y >= 2010 && p.mw >= 600) return 'usc';
  if (p.y >= 1995 && p.mw >= 400) return 'sup';
  return 'sub';
}
const ARCH_T = { none: null, sub: 540, sup: 565, usc: 600, ccgt: 540 };
// Several designs publish no secondary-side steam conditions. Rather than score
// them as zero, derive an indicative live-steam temperature from the coolant
// outlet (~90 %), and flag it as derived wherever it is shown.
function steamT(r) { return r.st || (r.out_c ? Math.round(r.out_c * 0.9) : null); }

// Flexibility, scored the way the European utilities state it rather than by a
// category invented here. EUR KP14 (2.2 s2.9.2) asks 3 %Pr/min for scheduled
// load following; EUR 2.3 s3.1.1 expects a minimum regulating level at or below
// 50 %Pr. A design that publishes no rate is capped, never given full marks.
const FLEX_RAMP = { none: 0, sec: 1, load: 3, grid: 3 };      // %Pr/min demanded
function flexScore(r) {
  const need = FLEX_RAMP[S.flex] || 0;
  const cat = { none: 25, limited: 50, good: 78, excellent: 100 }[r.lf] || 50;
  const store = r.store !== 'none' ? 15 : 0;   // a heat store lets the plant swing without the reactor
  if (!need) return Math.min(100, 80 + store * 0.3);
  let v = r.ramp != null ? (r.ramp >= need ? 100 : Math.max(25, 100 * r.ramp / need))
                         : Math.min(70, cat);
  if (r.minload != null) v *= r.minload <= 50 ? 1 : r.minload <= 70 ? 0.85 : 0.7;
  if (S.flex === 'grid' && !r.mwe) v *= 0.5;   // no generator, no grid-code duty
  return Math.min(100, v + store);
}

function countryRec(iso, fallbackName) {
  const c = DATA.countries.find(x => x.i === iso);
  if (c) return c;
  return { i: iso, n: fallbackName || iso, st: 'open_no_program', sn: '', tr: 'stable', tn: '',
           reg: null, yrs: 16, sr: 'medium', srn: '', npt: '', sanc: false, ru: true, cn: true, src: [], unknown: true };
}

// ============================================================== engine
const ACCESS_RANK = { truck: 1, rail: 2, barge: 3, heavy: 4 };
const TCLASS_RANK = { truck: 1, rail: 2, barge: 3, heavy_lift: 3 };

function demandMW(r) { // required capacity in the relevant unit for this design
  return S.output === 'heat' ? S.mwth : S.mwe;
}
function perModule(r) {
  return S.output === 'heat' ? (r.mwth || 0) : (r.mwe || 0);
}
function moduleCount(r) {
  const per = perModule(r), need = demandMW(r);
  if (!per || !need) return { base: 0, total: 0 };
  let base = Math.max(1, Math.ceil(need / per));
  if (S.output === 'both' && r.mwth && S.mwth) base = Math.max(base, Math.ceil(S.mwth / r.mwth));
  let total = base;
  if (S.red === 'n1') total = base + 1;
  else if (S.red === '2n') total = base * 2;
  else if (S.red === 'n11') total = base + 2;
  return { base, total };
}

function screen() {
  const C = countryRec(S.iso, S.cname);
  const need = demandMW();
  // A zero or negative demand silently disabled the scale gate and handed every
  // design a perfect granularity score. Refuse to screen instead.
  if (!(need > 0)) return { invalid: 'demand', pass: [], gates: [], C, notReactor: false, archT: ARCH_T[S.arch] };
  if (!S.iso) return { invalid: 'country', pass: [], gates: [], C, notReactor: false, archT: ARCH_T[S.arch] };
  const archT = ARCH_T[S.arch];
  const gates = [], pass = [];

  for (const r of DATA.reactors) {
    const g = [];
    const G = (k, p) => g.push({ k, p: p || {} });
    // --- jurisdiction. Skipped entirely for a country outside the policy
    // dataset: inventing a legal position would be worse than declining to.
    if (!C.unknown) {
      if (C.st === 'prohibited') G('gate.prohibited', { c: C.n });
      else if (C.st === 'phase_out') G('gate.phaseout', { c: C.n });
      // Sanctions and non-proliferation status block a SUPPLIER, not a country's
      // own programme — Rosatom is building seven units inside Russia today.
      // So the gate is per supplier bloc, and says who cannot deliver.
      if (r.bloc === 'west' && !C.west) G(C.prac ? 'gate.nosupplier' : 'gate.bloc_west', { c: C.n });
      if (r.bloc === 'ru' && !C.ru) G(C.prac ? 'gate.nosupplier' : C.nsg ? 'gate.bloc_west' : 'gate.bloc_ru', { c: C.n });
      if (r.bloc === 'cn' && !C.cn) G(C.prac ? 'gate.nosupplier' : C.nsg ? 'gate.bloc_west' : 'gate.bloc_cn', { c: C.n });
    }
    if (!r.proc) G('gate.notproc');
    // --- product
    const per = perModule(r);
    if (S.output !== 'heat' && !r.mwe) G('gate.heatonly');
    else if (S.output === 'heat' && !r.mwth) G('gate.nomwe');
    if (S.temp > r.heat_c) G('gate.temp', { v: r.heat_c, n: S.temp });
    // --- scale
    const mc = moduleCount(r);
    if (per && mc.total > 12) G('gate.modules', { v: mc.total, n: need });
    // --- siting
    if (S.water === 'none' && !r.air) G('gate.water');
    // Only a truck-only site is a hard stop: inland heavy haul is routine
    // (Natrium is being built ~600 km from navigable water), so anything above
    // truck-only becomes a scoring penalty rather than an elimination.
    if (S.access === 'truck' && TCLASS_RANK[r.tclass] > 1)
      G('gate.transport', { v: T('acc.' + (r.tclass === 'heavy_lift' ? 'heavy' : r.tclass)), n: T('acc.' + S.access) });
    // --- schedule
    const countryReady = C.unknown ? YEAR_NOW
      : YEAR_NOW + (C.st === 'operating_fleet' || C.st === 'expanding' ? 0 : Math.max(0, C.yrs - 10));
    const eff = Math.max(r.cod_real, countryReady);
    if (r.cod_real > S.year) G('gate.timing', { v: r.cod_real, n: S.year });
    else if (eff > S.year) G('gate.ctiming', { c: C.n, v: eff, n: S.year });
    // --- retrofit turbine
    if (S.reuseTurbine && archT && (steamT(r) || 0) < archT - 25)
      G('gate.turbine', { v: steamT(r) || r.heat_c, n: T('a.' + S.arch) });

    if (g.length) gates.push({ r, why: g });
    else pass.push({ r, eff, mc });
  }

  // ---- scoring
  for (const p of pass) {
    const r = p.r, mc = p.mc;
    // FIT ------------------------------------------------------
    const parts = [];
    const head = r.heat_c - S.temp;
    parts.push(['temp', head <= 0 ? 0 : head < 60 ? 100 : head < 200 ? 88 : head < 350 ? 72 : 58, 1.4]);
    const nb = mc.base;
    parts.push(['gran', nb === 1 ? 55 : nb <= 3 ? 100 : nb <= 6 ? 88 : nb <= 9 ? 70 : 50, 1.0]);
    parts.push(['flex', flexScore(r), S.flex === 'none' ? 0.4 : 1.3]);
    const contS = S.cont === 'yes' ? 85 : r.online ? 100 : (mc.total >= 3 ? 68 : mc.total === 2 ? 48 : 15);
    parts.push(['cont', contS, S.cont === 'no' ? 1.3 : 0.4]);
    const modelS = S.oper === 'any' ? 80 : S.oper === 'boo' ? (r.model === 'equipment' ? 15 : 100) : (r.model === 'boo_ppa' ? 60 : 100);
    parts.push(['model', modelS, 1.0]);
    const dt = ACCESS_RANK[S.access] - TCLASS_RANK[r.tclass];
    const siteS = (r.air ? 100 : S.water === 'plenty' ? 85 : 45) * 0.5 +
      (dt >= 1 ? 100 : dt === 0 ? 82 : 45) * 0.3 +
      (r.ha == null ? 70 : r.ha < 5 ? 100 : r.ha < 15 ? 80 : 60) * 0.2;
    parts.push(['site', siteS, 0.8]);
    let turbS = 70;
    if (archT) { const t = steamT(r) || 0; turbS = t >= archT - 25 ? 100 : t >= archT - 90 ? 55 : 25; }
    parts.push(['turb', turbS, archT ? 1.0 : 0]);
    parts.push(['grid', S.grid === 'none' ? (r.air && ACCESS_RANK[S.access] <= 2 ? 90 : 60) : (S.surplus && r.store !== 'none' ? 100 : 80), 0.5]);
    const wsum = parts.reduce((a, x) => a + x[2], 0);
    p.fit = Math.round(parts.reduce((a, x) => a + x[1] * x[2], 0) / wsum);
    p.fitParts = parts;

    // CONFIDENCE ----------------------------------------------
    const jur = { low: 1.0, medium: 0.9, high: 0.72 }[C.sr] || 0.9;
    const pol = { expanding: 1.0, operating_fleet: 1.0, newcomer_program: 0.9, open_no_program: 0.78, no_program: 0.68, moratorium: 0.55, phase_out: 0.6 }[C.st] || 0.8;
    const base = r.mat * 0.30 + r.cons * 0.15 + (r.fmat * 20) * 0.25 + r.vendor_s * 0.15 + r.ob * 0.15;
    // A country outside the policy dataset carries unquantified jurisdiction
    // risk, so confidence is capped rather than assumed average.
    p.conf = Math.round(Math.max(2, Math.min(C.unknown ? 55 : 100, base * jur * pol)));
    p.fuelScore = Math.round(r.fmat * 20 * (r.ecl === 'LEU' ? 1.0 : 0.92));
    p.speedScore = Math.round(Math.max(0, Math.min(100, 100 - (p.eff - YEAR_NOW) * 8)));
    p.modelScore = modelS;
  }

  rankAll(pass);
  const notReactor = (S.output !== 'heat' ? S.mwe < 5 : S.mwth < 25) ||
    (S.year - YEAR_NOW < 6 && !C.unknown && C.yrs > 12) ||
    (S.alt === 'cheap' && S.life <= 25);
  return { pass, gates, C, notReactor, archT };
}

function rankScore(p, w) {
  const sum = w.fit + w.conf + w.fuel + w.speed + w.model || 1;
  return (p.fit * w.fit + p.conf * w.conf + p.fuelScore * w.fuel + p.speedScore * w.speed + p.modelScore * w.model) / sum;
}
/* The rank stability is a Monte-Carlo estimate. Drawing it from Math.random() made the
   printed percentage move by a few points on every re-render of the same screening, which
   is a number that looks computed but is not reproducible. The draw is therefore seeded
   from the screening inputs themselves: the same site, requirement and weights always give
   the same figure, and any change to them reseeds it. */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rankSeed(pass) {
  const parts = [S.iso, S.output, S.mwe, S.mwth, S.temp, S.year, S.red, S.access, S.water,
    S.arch, S.reuseTurbine, S.cont, S.flex, S.grid, S.oper, S.life, S.alt,
    S.w.fit, S.w.conf, S.w.fuel, S.w.speed, S.w.model,
    pass.map(p => p.r.id + ':' + p.fit + ':' + p.conf).join(',')].join('|');
  let hsh = 0x811c9dc5;
  for (let i = 0; i < parts.length; i++) { hsh ^= parts.charCodeAt(i); hsh = Math.imul(hsh, 0x01000193); }
  return hsh >>> 0;
}
function rankAll(pass) {
  const wsum = S.w.fit + S.w.conf + S.w.fuel + S.w.speed + S.w.model;
  pass.forEach(p => p.score = rankScore(p, S.w));
  if (wsum <= 0) { pass.forEach(p => { p.pWin = null; p.pTop3 = null; }); return; }
  pass.sort((a, b) => b.score - a.score);
  // Monte Carlo rank stability, seeded from the inputs so it is reproducible
  const rnd = mulberry32(rankSeed(pass));
  const N = 400, win = new Map(), top3 = new Map();
  const unc = p => ({ operating: 3, construction: 6, licensing: 11, detailed_design: 15, basic_design: 19, concept: 24 }[p.r.stage] || 14);
  for (let k = 0; k < N; k++) {
    const w = {}; for (const key in S.w) w[key] = S.w[key] * (0.7 + rnd() * 0.6);
    const draw = pass.map(p => {
      const u = unc(p);
      const jf = { fit: p.fit + (rnd() - .5) * u, conf: p.conf + (rnd() - .5) * u * 1.6,
                   fuelScore: p.fuelScore + (rnd() - .5) * u, speedScore: p.speedScore + (rnd() - .5) * u,
                   modelScore: p.modelScore };
      return { p, s: rankScore(jf, w) };
    }).sort((a, b) => b.s - a.s);
    if (draw[0]) win.set(draw[0].p.r.id, (win.get(draw[0].p.r.id) || 0) + 1);
    draw.slice(0, 3).forEach(d => top3.set(d.p.r.id, (top3.get(d.p.r.id) || 0) + 1));
  }
  pass.forEach(p => { p.pWin = (win.get(p.r.id) || 0) / N; p.pTop3 = (top3.get(p.r.id) || 0) / N; });
}

function findings(p, C, archT) {
  const r = p.r, out = [];
  if (archT && S.arch !== 'none') {
    const t = steamT(r), ok = (t || 0) >= archT - 25, dv = (t == null ? '—' : (r.st ? '' : '~') + t);
    out.push({ t: ok ? 'good' : 'warn',
      s: fmt(ok ? 'find.turbine_ok' : 'find.turbine_bad', { v: dv, n: ok ? T('a.' + S.arch) : archT }) });
  }
  if (r.flags.includes('li7')) out.push({ t: 'bad', s: T('find.li7') });
  else if (r.ecl === 'HALEU') out.push({ t: 'warn', s: T('find.haleu') });
  else if (r.ecl === 'LEU') out.push({ t: 'good', s: T('find.leu') });
  else if (r.ecl === 'LEU+') out.push({ t: 'warn', s: T('find.leuplus') });
  if (r.online) out.push({ t: 'good', s: T('find.online') });
  else if (S.cont === 'no') out.push({ t: 'warn', s: fmt('find.outage', { v: r.refuel }) });
  if (r.model !== 'equipment') out.push({ t: 'good', s: T('find.boo') });
  else if (S.oper === 'boo') out.push({ t: 'bad', s: T('find.noboo') });
  if (r.store !== 'none' && (S.flex !== 'none' || S.surplus)) out.push({ t: 'good', s: T('find.store') });
  // --- measured against the European Utility Requirements ------------------
  if (S.flex !== 'none') {
    if (r.ramp != null)
      out.push({ t: r.ramp >= 3 ? 'good' : 'warn',
                 s: fmt(r.ramp >= 3 ? 'find.ramp_ok' : 'find.ramp_bad', { v: r.ramp }) });
    else out.push({ t: 'warn', s: T('find.ramp_unk') });
    if (r.minload != null)
      out.push({ t: r.minload <= 50 ? 'good' : 'warn',
                 s: fmt(r.minload <= 50 ? 'find.minload_ok' : 'find.minload_bad', { v: r.minload }) });
  }
  // Autonomy only earns its place where there is nothing to fall back on.
  if (S.grid === 'none' || S.access === 'truck' || S.oper === 'boo') {
    if (r.grace_h != null && r.coping_d != null) {
      const ok = r.grace_h >= 72 && r.coping_d >= 7;
      out.push({ t: ok ? 'good' : 'warn',
                 s: fmt(ok ? 'find.auto_ok' : 'find.auto_bad', { v: r.grace_h, n: r.coping_d }) });
    } else if (S.grid === 'none') out.push({ t: 'warn', s: T('find.auto_unk') });
  }
  if (r.avail != null)
    out.push({ t: r.avail >= 90 ? 'good' : 'warn',
               s: fmt(r.avail >= 90 ? 'find.avail_ok' : 'find.avail_bad', { v: r.avail }) });
  if (r.air && S.water !== 'plenty') out.push({ t: 'good', s: T('find.air') });
  if (r.stage === 'operating') out.push({ t: 'good', s: T('find.built') });
  else if (r.cstat === 'under_construction') out.push({ t: 'good', s: T('find.underconstruction') });
  if (!r.fid) out.push({ t: 'warn', s: T('find.nofid') });
  if (r.flags.some(f => ['going_concern', 'administration', 'bankruptcy'].includes(f))) out.push({ t: 'bad', s: T('find.distress') });
  // asset life: a short-lived load cannot amortise a 60-year plant
  if (S.life <= 25) out.push({ t: r.tclass === 'truck' ? 'good' : 'warn', s: fmt('find.shortlife', { v: S.life }) });
  // what the client pays today is the only economic benchmark this tool has
  if (S.alt === 'cheap') out.push({ t: 'warn', s: T('find.cheapalt') });
  else if (S.alt === 'exp') out.push({ t: 'good', s: T('find.expalt') });
  const mc = moduleCount(r);
  // EUR 2.3 s2.1.1.B: a single grid fault shall not lose more than one unit.
  // Modules sharing one connection is exactly the case that has to be shown.
  if (mc.total >= 3 && S.output !== 'heat' && S.grid !== 'none')
    out.push({ t: 'warn', s: fmt('find.gridfault', { v: mc.total }) });
  out.push({ t: r.eur_scope ? 'good' : 'warn', s: T(r.eur_scope ? 'find.eur_scope' : 'find.eur_out') });
  const per = perModule(r);
  if (per && per <= 120) out.push({ t: 'good', s: fmt('find.small', { v: per }) });
  else if (per >= 300) out.push({ t: 'warn', s: fmt('find.big', { v: per }) });
  return out;
}

r (smr-data.json) kon niet worden geladen, dus er kan niets worden gescreend. De rest van de pagina werkt gewoon.","fr":"Le répertoire des réacteurs (smr-data.json) n’a pas pu être chargé ; aucune présélection n’est possible. Le reste de la page fonctionne.","es":"No se pudo cargar el repertorio de reactores (smr-data.json), así que no puede cribarse nada. El resto de la página sigue funcionando.","pl":"Nie udało się załadować rejestru reaktorów (smr-data.json), więc nie można przeprowadzić selekcji. Pozostałe funkcje strony nadal działają."},"ui.degraded":{"en":"The shared interface layer (diagram-ui.js) could not be loaded, so this is the tool’s plain fallback. Every number, the shared link and every export are unchanged.","uk":"Не вдалося завантажити спільний шар інтерфейсу (diagram-ui.js), тож це проста запасна версія. Усі числа, посилання та експорт незмінні.","de":"Die gemeinsame Oberflächenschicht (diagram-ui.js) konnte nicht geladen werden; dies ist die einfache Ersatzansicht. Alle Zahlen, der geteilte Link und alle Exporte bleiben unverändert.","nl":"De gedeelde interfacelaag (diagram-ui.js) kon niet worden geladen; dit is de eenvoudige terugvalweergave. Alle getallen, de deellink en alle exports zijn ongewijzigd.","fr":"La couche d’interface partagée (diagram-ui.js) n’a pas pu être chargée ; voici la version de repli. Tous les chiffres, le lien partagé et les exports sont inchangés.","es":"No se pudo cargar la capa de interfaz compartida (diagram-ui.js); esta es la versión simple de reserva. Todas las cifras, el enlace compartido y las exportaciones no cambian.","pl":"Nie udało się załadować wspólnej warstwy interfejsu (diagram-ui.js), dlatego wyświetlany jest prosty tryb awaryjny. Wszystkie liczby, link udostępniania i eksporty pozostają bez zmian."},"ui.picking":{"en":"Click the map or type coordinates, then set the requirement.","uk":"Клацніть карту або введіть координати, потім задайте потребу.","de":"Karte anklicken oder Koordinaten eingeben, dann den Bedarf festlegen.","nl":"Klik op de kaart of typ coördinaten en stel daarna de behoefte in.","fr":"Cliquez la carte ou saisissez des coordonnées, puis définissez le besoin.","es":"Haga clic en el mapa o escriba coordenadas y luego fije la necesidad.","pl":"Kliknij mapę lub wpisz współrzędne, a następnie określ wymagania."}};
const TX = k => { const e = UIX[k]; return e ? (e[S.lang] || e.en) : T(k); };
const TL  = k => () => T(k);
const TLX = k => () => TX(k);
/* the unit belongs in the unit slot, never in the label (spec section 6) */
const noParen = s => String(s).replace(/\s*\((?:[^()]|\([^()]*\))*\)\s*$/, '');
const TLN = k => () => noParen(T(k));

const wiz  = i => VIEW === 'wizard' && STEP === i;
const hasData = () => !!(window.DATA && DATA.reactors);

// ---------------------------------------------------------------- navigation
function setHash(h) { try { history.replaceState(null, '', '#' + h); } catch (e) { location.hash = h; } }
function readHash() {
  const h = (location.hash || '').replace(/^#/, '');

  if (m && hasData() && DATA.reactors.some(r => r.id === m[1])) { VIEW = 'sheet'; S.sheet = m[1]; return true; }

};
window.goCat = () => { VIEW = 'cat'; S.sheet = null; setHash('catalogue'); refresh(true); };
window.openSheet = id => { VIEW = 'sheet'; S.sheet = id; setHash('d=' + id); refresh(true); };

/* One entry point: re-evaluate every field's visibility, repaint the wide column,

function refresh(scroll) {

// ---------------------------------------------------------------- results figures
function scatter(pass, W, H) {
  W = W || 700; H = H || 330;
  const m = { l: 52, r: 18, t: 16, b: 40 };
  const x = v => m.l + (v / 100) * (W - m.l - m.r), y = v => H - m.b - (v / 100) * (H - m.t - m.b);
  let g = '';

const TEMP_MARKS = [[120, 'temp.dh'], [300, 'temp.steam'],

function tempScale(r, W) {
  W = Math.max(340, Math.round(W || 700));
  const H = 96, L = 14, R = 14, maxT = 820;
  const x = t => L + (t / maxT) * (W - L - R);
  const core = r.core_c || r.out_c;
  return `<svg class="tscale" viewBox="0 0 ${W} ${H}">
    <line class="sc-grid" x1="${L}" y1="52" x2="${W - R}" y2="52"/>
    ${TEMP_MARKS.map(([t, k]) => `<line class="sc-grid" x1="${x(t)}" y1="44" x2="${x(t)}" y2="60"/>
      <text class="sc-tick" x="${x(t)}" y="74" text-anchor="middle">${esc(T(k))}</text>
      <text class="sc-tick" x="${x(t)}" y="86" text-anchor="middle">${t} °C</text>`).join('')}
    ${core && core > r.heat_c ? `<rect class="tbar dim2" x="${x(r.heat_c)}" y="38" width="${x(core) - x(r.heat_c)}" height="10" rx="3"/>
      <text class="sc-tick" x="${x(core)}" y="30" text-anchor="end">${core} °C ${esc(T('sheet.core'))}</text>` : ''}
    <rect class="tbar" x="${L}" y="38" width="${x(r.heat_c) - L}" height="10" rx="3"/>
    <text class="sc-lbl" x="${x(r.heat_c) + 6}" y="47">${r.heat_c} °C ${esc(T('sheet.deliverable'))}</text>
  </svg>`;
}
function vsSet(r, key, unit, W) {
  const vals = DATA.reactors.map(x => x[key]).filter(v => v > 0);
  if (!vals.length || !r[key]) return '';
  W = Math.max(340, Math.round(W || 700));
  const max = Math.max(...vals), H = 44, L = 10, R = 10;
  const x = v => L + (v / max) * (W - L - R);
  const px = x(r[key]);
  return `<svg class="tscale" viewBox="0 0 ${W} ${H}">
    <line class="sc-grid" x1="${L}" y1="32" x2="${W - R}" y2="32"/>
    ${vals.map(v => `<line class="sc-grid" x1="${x(v)}" y1="26" x2="${x(v)}" y2="38"/>`).join('')}
    <line class="tmark" x1="${px}" y1="22" x2="${px}" y2="42"/>
    <text class="sc-lbl" x="${Math.min(W - R - 34, Math.max(L + 34, px))}" y="16"
      text-anchor="middle">${r[key]} ${unit}</text>

}

function results(app) {
  if (!hasData()) return LOADFAILED ? { verdict: { tone: 'bad', text: TX('ui.nodata') } } : null;
  S.result = screen(); S.resultStale = false;
  paint();
  const R = S.result, C = R.C, pass = R.pass;
  if (R.invalid) {
    return { verdict: { tone: 'bad', text: TL(R.invalid === 'demand' ? 'res.baddemand' : 'res.badcountry') } };
  }
  const best = pass[0] || null;
  const stab = document.createElement('div');
  stab.className = 'smr';
  stab.innerHTML = stabilityHTML(pass);
  const notes = [];
  if (C.unknown) notes.push(C.n + ' — ' + T('site.unknown'));
  if (R.notReactor) notes.push(T('res.notreactor') + ' — ' + T('res.notreactor_t'));
  if (!pass.length) notes.push(T('res.none') + ' — ' + T('res.none_t'));
  return {
    verdict: {
      tone: pass.length ? (R.notReactor ? 'warn' : 'ok') : 'bad',
      text: pass.length + ' ' + T('res.of') + ' ' + DATA.reactors.length + ' '
        + T('res.designs') + ' ' + T('res.survived')
    },
    tiles: [
      { label: TL('res.survived'), value: pass.length, precision: 0, tone: pass.length ? 'ok' : 'bad', learn: 'gates' },
      { label: TL('rep.elim'), value: R.gates.length, precision: 0, learn: 'gates' },
      { label: TLX('ui.best'), value: best ? best.r.name : null },
      { label: TLX('ui.pwin'), value: best && best.pWin != null ? Math.round(best.pWin * 100) : null,
        unit: '%', precision: 0, learn: 'stability', headline: false },
      { label: TL('res.fit'), value: best ? best.fit : null, precision: 0, learn: 'axes', headline: false },
      { label: TL('res.conf'), value: best ? best.conf : null, precision: 0, learn: 'axes', headline: false },
      { label: TLX('ui.register'), value: DATA.reactors.length, precision: 0, headline: false }
    ],
    nodes: pass.length ? [stab] : [],
    notes: notes
  };
}

function ensureRegions(app) {
  const host = app.region('stage');
  if (!mapStage || !host.contains(mapStage.node)) {
    mapStage = app.stage({
      minHeight: 240,
      caption: TL('site.maphint'),
      a11y: () => hasData()
        ? T('site.country') + ': ' + ((S.cname || S.iso) || '—') + ' · '
          + S.lat.toFixed(2) + ', ' + S.lon.toFixed(2)
          + (S.coast == null ? '' : ' · ' + T('site.coast') + ' ' + S.coast + ' km')
        : '',
      render: (size, st) => {
        if (!hasData()) return;
        const h = Math.max(220, Math.min(520, Math.round(size.w * 168 / 360)));
        if (st.body.style.minHeight !== h + 'px') st.body.style.minHeight = h + 'px';
        st.body.innerHTML = mapSVG();
      }
    });
    mapStage.node.hidden = true;
  }
  if (!document.getElementById('smr-body')) {
    const d = document.createElement('section');
    d.id = 'smr-body'; d.className = 'dgu-panel smr'; d.hidden = true;
    host.appendChild(d);
    if (window.ResizeObserver) {
      if (bodyRO) { try { bodyRO.disconnect(); } catch (e) {} }
      let raf = null, lastW = 0;
      bodyRO = new ResizeObserver(() => {
        const w = Math.round(d.getBoundingClientRect().width);
        if (Math.abs(w - lastW) < 24) return;
        lastW = w;
        if (raf) return;
        raf = requestAnimationFrame(() => { raf = null; paint(); });
      });
      bodyRO.observe(d);
    }
  }
  /* the weight sliders record the order they started from, once per gesture */
  WKEYS.forEach(k => {
    const inp = document.getElementById('f-w-' + k + '-c');
    if (inp && !inp.dataset.marked) {
      inp.dataset.marked = '1';
      inp.addEventListener('pointerdown', markOrder);
      inp.addEventListener('keydown', markOrder);
    }
  });
}

let PANELDEFS = null;

/* ---------- degraded mode ----------
   diagram-ui.js is the screen, not the tool. If it never arrives the page still
   loads its register, still screens, still serialises its state and still feeds
   the shared bar's permalink, record, CSV and PDF; only the shell is gone. The
   controls below are native elements driven by the very same field definitions,
   so no second field layer exists to drift from the first. */
function pget(o, path) { return !path ? undefined : String(path).split('.').reduce((a, k) => (a == null ? a : a[k]), o); }
function pset(o, path, v) {
  const ps = String(path).split('.'); let c = o;
  for (let i = 0; i < ps.length - 1; i++) { if (c[ps[i]] == null) c[ps[i]] = {}; c = c[ps[i]]; }
  c[ps[ps.length - 1]] = v;
}
const lab = x => typeof x === 'function' ? String(x()) : (x == null ? '' : String(x));
function fldGet(f) { return typeof f.get === 'function' ? f.get(S, { state: S }) : pget(S, f.key); }
function fldSet(f, v) { if (typeof f.set === 'function') f.set(v, S, { state: S }); else pset(S, f.key, v); }
function fldOpts(f) {
  const raw = (typeof f.options === 'function' ? f.options({ state: S }) : f.options) || [];
  return raw.map(o => Array.isArray(o) ? [o[0], lab(o[1])] : [o, String(o)]);
}
function plainShell(why) {
  if (window.console) console.warn('smrselector: shell not built — ' + why);
  const app = document.getElementById('app');
  app.className = 'smr smr-plain';
  app.innerHTML =
    '<p><a href="index.html?lang=' + esc(S.lang) + '">← Tools</a></p>'
    + '<h1>' + esc(T('app.title')) + '</h1>'
    + '<p class="hint">' + esc(T('app.sub')) + '</p>'
    + '<div class="note warn" id="smr-degraded"></div>'
    + '<nav id="smr-plainnav"></nav>'
    + '<div id="smr-plainform"></div>'
    + '<section id="smr-body" class="smr" hidden></section>'
    + '<div id="smr-foot" class="smr smr-foot"></div>';
  document.getElementById('smr-degraded').textContent = TX('ui.degraded');
  plainRefresh();
}
function plainNav(host) {
  host.innerHTML = '';
  const mk = (txt, on, fn) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = txt; if (on) b.setAttribute('aria-current', 'step');
    b.addEventListener('click', fn); host.appendChild(b);
  };
  ['nav.site', 'nav.need', 'nav.res'].forEach((k, i) =>
    mk((i + 1) + '. ' + T(k), VIEW === 'wizard' && STEP === i, () => go(i)));
  mk(T('nav.cat'), VIEW !== 'wizard', () => goCat());
  if (VIEW === 'sheet') mk('← ' + T('sheet.back'), false, () => goCat());
}
function plainForm(host) {
  host.innerHTML = '';
  (PANELDEFS || []).forEach(P => {
    const fs = (P.fields || []).filter(f => f.type !== 'custom' && (!f.visible || f.visible({ state: S })));
    if (!fs.length) return;
    const sec = document.createElement('section');
    if (P.title) { const h = document.createElement('h3'); h.textContent = lab(P.title); sec.appendChild(h); }
    fs.forEach(f => {
      const w = document.createElement('label');
      w.textContent = lab(f.label) + (f.unit ? ' (' + f.unit + ')' : '') + ' ';
      let c;
      if (f.type === 'select' || f.type === 'segmented') {
        c = document.createElement('select');
        fldOpts(f).forEach(o => {
          const op = document.createElement('option');
          op.value = o[0] == null ? '' : o[0]; op.textContent = o[1]; c.appendChild(op);
        });
        const v = fldGet(f); c.value = v == null ? '' : String(v);
        c.addEventListener('change', () => { fldSet(f, c.value); commit(); });
      } else if (f.type === 'toggle') {
        c = document.createElement('input'); c.type = 'checkbox'; c.checked = !!fldGet(f);
        c.addEventListener('change', () => { fldSet(f, c.checked); commit(); });
      } else {
        c = document.createElement('input');
        c.type = f.type === 'range' ? 'range' : (f.type === 'text' ? 'text' : 'number');
        if (f.min != null) c.min = f.min;
        if (f.max != null) c.max = f.max;
        if (f.step != null) c.step = f.step;
        const v = fldGet(f); c.value = v == null ? '' : v;
        c.addEventListener('change', () =>
          fldSet(f, f.type === 'text' ? c.value : (c.value === '' ? null : parseFloat(c.value))) || commit());
      }
      w.appendChild(c); sec.appendChild(w);
    });
    host.appendChild(sec);
  });
  if (VIEW === 'wizard' && STEP === 1 && hasData()) {
    const sec = document.createElement('section');
    sec.innerHTML = '<h3>' + esc(T('need.preset')) + '</h3>';
    PRESET_KEYS.forEach(k => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = T('p.' + k + '.n');
      b.addEventListener('click', () => usePreset(k));
      sec.appendChild(b);
    });
    host.appendChild(sec);
  }
}

}
