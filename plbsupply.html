  "description": {
    "en": "Describe the building as zones per floor (identical units × fixtures) or take the fixture inventory from the plumbing project file. The tool builds the tree service pipe → meter, filter, backflow preventer → basement main → riser → floor branch, computes the design flow of every segment, picks the smallest pipe within the DIN 1988-300 velocity limit, then enlarges the segments that eat the most pressure on the critical path until the worst fixture has its minimum flow pressure. If height and apparatus alone exceed the supply pressure it says so and hands the flow and head to the booster tool. The pressure profile of the critical path shows where the pressure goes.",
    "uk": "Опишіть будівлю зонами по поверхах (однакові квартири/блоки × прилади) або візьміть перелік приладів з файлу проєкту водопостачання. Інструмент будує дерево ввід → лічильник, фільтр, зворотний клапан → магістраль у підвалі → стояк → поверхове відгалуження, розраховує розрахункову витрату кожної ділянки, обирає найменшу трубу в межах швидкостей DIN 1988-300, а потім збільшує ділянки, що «з'їдають» найбільше тиску на критичному шляху, доки найгірший прилад не отримає мінімальний тиск витікання. Якщо висота й арматура самі вже перевищують тиск у мережі, інструмент це показує й передає витрату та напір інструменту підвищувальних установок. Профіль тиску критичного шляху показує, куди йде тиск.",
    "de": "Beschreiben Sie das Gebäude als Zonen je Geschoss (gleiche Einheiten × Entnahmestellen) oder übernehmen Sie das Inventar aus der Sanitär-Projektdatei. Das Werkzeug bildet den Strang Anschlussleitung → Wasserzähler, Filter, Rückflussverhinderer → Kellerverteilung → Steigleitung → Stockwerksleitung, berechnet den Spitzendurchfluss jeder Teilstrecke, wählt die kleinste Rohrweite innerhalb der Geschwindigkeitsgrenze nach DIN 1988-300 und vergrößert dann die Teilstrecken mit dem größten Druckverlust auf dem ungünstigsten Fließweg, bis die ungünstigste Entnahmestelle ihren Mindestfließdruck hat. Übersteigen schon Höhe und Apparate den Versorgungsdruck, sagt es das und gibt Durchfluss und Förderhöhe an das Druckerhöhungs-Werkzeug weiter. Das Druckprofil des Fließwegs zeigt, wo der Druck bleibt.",
    "nl": "Beschrijf het gebouw als zones per verdieping (identieke eenheden × tappunten) of neem de inventaris over uit het sanitair-projectbestand. De tool bouwt de boom aansluitleiding → watermeter, filter, terugstroombeveiliging → verdeelleiding in de kelder → stijgleiding → verdiepingsleiding, berekent het ontwerpdebiet van elk segment, kiest de kleinste buis binnen de snelheidsgrens van DIN 1988-300 en vergroot daarna de segmenten met het grootste drukverlies op het kritieke pad tot het ongunstigste tappunt zijn minimale stromingsdruk heeft. Als hoogte en toestellen alleen al de leidingdruk overschrijden, zegt ze dat en geeft ze debiet en opvoerhoogte door aan de drukverhogingstool. Het drukprofiel van het kritieke pad toont waar de druk naartoe gaat.",
    "fr": "Décrivez le bâtiment par zones d’étage (unités identiques × appareils) ou reprenez l’inventaire du fichier projet sanitaire. L’outil construit l’arbre branchement → compteur, filtre, clapet anti-retour → distribution en sous-sol → colonne → dérivation d’étage, calcule le débit de calcul de chaque tronçon, choisit le plus petit tube dans la limite de vitesse de la DIN 1988-300, puis agrandit les tronçons qui consomment le plus de pression sur le chemin critique jusqu’à ce que le point le plus défavorable ait sa pression minimale d’écoulement. Si la hauteur et les appareils dépassent déjà la pression du réseau, il le dit et transmet débit et hauteur à l’outil surpresseur. Le profil de pression du chemin critique montre où part la pression.",
    "es": "Describa el edificio por zonas de planta (unidades idénticas × aparatos) o tome el inventario del archivo de proyecto de fontanería. La herramienta construye el árbol acometida → contador, filtro, antirretorno → distribuidor en sótano → montante → derivación de planta, calcula el caudal de cálculo de cada tramo, elige el tubo más pequeño dentro del límite de velocidad de DIN 1988-300 y después amplía los tramos que más presión consumen en el recorrido crítico hasta que el punto más desfavorable tenga su presión mínima de flujo. Si la altura y los equipos ya superan la presión de la red, lo indica y pasa caudal y altura a la herramienta de grupos de presión. El perfil de presión del recorrido crítico muestra adónde va la presión.",

  'w.en806_extrapolated': T7('EN 806-3 option: ΣLU = %v or the highest single LU lies outside Figure B.1 (up to 5000 LU, single values up to 15 LU; a single 1 LU uses the 2 LU line) — the flow is extrapolated along the last line; check it with a detailed national method.', 'Варіант EN 806-3: ΣОН = %v або найбільше одиничне значення ОН поза рисунком B.1 (до 5000 ОН, одиничні до 15 ОН; одиничне 1 ОН — за лінією 2 ОН) — витрату екстрапольовано вздовж останньої лінії; перевірте детальним національним методом.', 'Option EN 806-3: ΣBW = %v oder der größte Einzelwert liegt außerhalb von Bild B.1 (bis 5000 BW, Einzelwerte bis 15 BW; ein Einzelwert 1 BW nutzt die 2-BW-Linie) — der Durchfluss ist entlang der letzten Linie extrapoliert; mit einem genauen nationalen Verfahren prüfen.', 'Optie EN 806-3: ΣBE = %v of de grootste enkele waarde ligt buiten figuur B.1 (tot 5000 BE, enkele waarden tot 15 BE; een enkele 1 BE volgt de 2 BE-lijn) — het debiet is langs de laatste lijn geëxtrapoleerd; controleer met een gedetailleerde nationale methode.', 'Option EN 806-3 : ΣUC = %v ou la plus grande valeur unitaire hors de la figure B.1 (jusqu’à 5000 UC, valeurs unitaires jusqu’à 15 UC ; une valeur unitaire de 1 UC suit la ligne 2 UC) — débit extrapolé le long de la dernière droite ; vérifier par une méthode nationale détaillée.', 'Opción EN 806-3: ΣUC = %v o el mayor valor individual fuera de la figura B.1 (hasta 5000 UC, valores individuales hasta 15 UC; un valor individual de 1 UC usa la línea de 2 UC); caudal extrapolado a lo largo de la última recta: compruébelo con un método nacional detallado.', 'Wariant EN 806-3: ΣJO = %v lub największa pojedyncza wartość poza rysunkiem B.1 (do 5000 JO, wartości pojedyncze do 15 JO; pojedyncze 1 JO według linii 2 JO) — przepływ ekstrapolowany wzdłuż ostatniej linii; sprawdź szczegółową metodą krajową.'),
  'w.din_range': T7('ΣQa = %v l/s is far beyond ordinary buildings: the DIN 1988-300 peak-flow curve is extrapolated (warning threshold 500 l/s is a learning assumption) — assess simultaneity explicitly.', 'ΣQa = %v л/с значно більше, ніж у звичайних будівлях: криву пікової витрати DIN 1988-300 екстрапольовано (поріг попередження 500 л/с — навчальне припущення) — оцініть одночасність явно.', 'ΣQa = %v l/s liegt weit über üblichen Gebäuden: die Spitzenkurve der DIN 1988-300 ist extrapoliert (Warnschwelle 500 l/s ist eine Lernannahme) — Gleichzeitigkeit ausdrücklich bewerten.', 'ΣQa = %v l/s ligt ver boven gewone gebouwen: de piekcurve van DIN 1988-300 is geëxtrapoleerd (waarschuwingsdrempel 500 l/s is een leeraanname) — beoordeel de gelijktijdigheid uitdrukkelijk.', 'ΣQa = %v l/s dépasse de loin les bâtiments courants : la courbe de pointe DIN 1988-300 est extrapolée (seuil d’alerte 500 l/s = hypothèse pédagogique) — évaluer la simultanéité explicitement.', 'ΣQa = %v l/s supera con mucho los edificios habituales: la curva de punta DIN 1988-300 se extrapola (umbral de aviso 500 l/s, supuesto didáctico); evalúe la simultaneidad explícitamente.', 'ΣQa = %v l/s znacznie przekracza zwykłe budynki: krzywa szczytowa DIN 1988-300 jest ekstrapolowana (próg ostrzeżenia 500 l/s to założenie dydaktyczne) — oceń jednoczesność jawnie.'),
  'w.din_curve_assumed': T7('Assumption: this building type has no DIN 1988-300 peak-flow constants; the curve of “%v” was chosen by the user.', 'Припущення: для цього типу будівлі немає констант пікової витрати DIN 1988-300; криву «%v» обрав користувач.', 'Annahme: für diese Gebäudeart gibt es keine Spitzendurchfluss-Konstanten der DIN 1988-300; die Kurve „%v“ wurde vom Nutzer gewählt.', 'Aanname: dit gebouwtype heeft geen piekdebietconstanten van DIN 1988-300; de curve “%v” is door de gebruiker gekozen.', 'Hypothèse : ce type de bâtiment n’a pas de constantes de pointe DIN 1988-300 ; la courbe « %v » a été choisie par l’utilisateur.', 'Supuesto: este tipo de edificio no tiene constantes de caudal punta DIN 1988-300; la curva «%v» la eligió el usuario.', 'Założenie: ten rodzaj budynku nie ma stałych przepływu szczytowego DIN 1988-300; krzywą „%v” wybrał użytkownik.'),
  'f.v.h': T7('Leave empty to use the DIN 1988-300 velocity limits per segment: 2 m/s service pipe; 5 m/s where the fittings have Σζ < 2.5, else 2.5 m/s; 2 m/s for flows lasting > 15 min (zones “all at once”, continuous flows) and for the EN 806-3 method. A value here caps all segments of that kind.', 'Залиште порожнім, щоб застосувати граничні швидкості DIN 1988-300 для кожної ділянки: 2 м/с ввід; 5 м/с, якщо Σζ арматури < 2,5, інакше 2,5 м/с; 2 м/с для відборів > 15 хв (зони «усі одночасно», постійні витрати) і для методу EN 806-3. Значення тут обмежує всі ділянки цього виду.', 'Leer lassen für die Geschwindigkeitsgrenzen der DIN 1988-300 je Teilstrecke: 2 m/s Anschlussleitung; 5 m/s bei Σζ der Einbauten < 2,5, sonst 2,5 m/s; 2 m/s bei Entnahmen > 15 min (Zonen „alle gleichzeitig“, Dauerdurchflüsse) und beim Verfahren EN 806-3. Ein Wert hier begrenzt alle Teilstrecken dieser Art.', 'Leeg laten voor de snelheidsgrenzen van DIN 1988-300 per segment: 2 m/s aansluitleiding; 5 m/s als Σζ van de appendages < 2,5, anders 2,5 m/s; 2 m/s voor tappingen > 15 min (zones “alle tegelijk”, continue debieten) en voor de methode EN 806-3. Een waarde hier begrenst alle segmenten van die soort.', 'Laisser vide pour les vitesses limites DIN 1988-300 par tronçon : 2 m/s branchement ; 5 m/s si Σζ des organes < 2,5, sinon 2,5 m/s ; 2 m/s pour des puisages > 15 min (zones « toutes en même temps », débits continus) et pour la méthode EN 806-3. Une valeur ici plafonne tous les tronçons de ce type.', 'Deje vacío para usar los límites de velocidad DIN 1988-300 por tramo: 2 m/s acometida; 5 m/s si Σζ de los accesorios < 2,5, si no 2,5 m/s; 2 m/s para consumos > 15 min (zonas «todo a la vez», caudales continuos) y para el método EN 806-3. Un valor aquí limita todos los tramos de ese tipo.', 'Pozostaw puste, aby użyć granic prędkości DIN 1988-300 dla każdego odcinka: 2 m/s przyłącze; 5 m/s gdy Σζ armatury < 2,5, w przeciwnym razie 2,5 m/s; 2 m/s dla poborów > 15 min (strefy „wszystko naraz”, przepływy ciągłe) i dla metody EN 806-3. Wartość tutaj ogranicza wszystkie odcinki tego rodzaju.'),

  'f.pstat.h': T7('Empty = not checked. Above 5 bar at an outlet → pressure-reducing valve (EN 806-2).', 'Порожньо — не перевіряється. Понад 5 бар у приладу → редуктор тиску (EN 806-2).', 'Leer = keine Prüfung. Über 5 bar an einer Entnahmestelle → Druckminderer (EN 806-2).', 'Leeg = geen controle. Boven 5 bar aan een tappunt → drukverminderaar (EN 806-2).', 'Vide = non vérifié. Plus de 5 bar à un point de puisage → réducteur de pression (EN 806-2).', 'Vacío = sin comprobar. Más de 5 bar en un punto de consumo → reductora de presión (EN 806-2).', 'Puste = bez sprawdzenia. Powyżej 5 bar w punkcie czerpalnym → reduktor ciśnienia (EN 806-2).'),

  'v.nosize': T7('Not sized: %s exceeds its velocity limit even with the largest pipe of the series — choose a larger pipe series or split the flow. The other numbers are shown for orientation only.', 'Не підібрано: %s перевищує граничну швидкість навіть із найбільшою трубою серії — оберіть серію з більшими діаметрами або розділіть витрату. Інші числа показано лише для орієнтації.', 'Nicht bemessen: %s überschreitet die Geschwindigkeitsgrenze auch mit dem größten Rohr der Reihe — größere Rohrreihe wählen oder den Durchfluss aufteilen. Die übrigen Zahlen dienen nur zur Orientierung.', 'Niet gedimensioneerd: %s overschrijdt de snelheidsgrens zelfs met de grootste buis van de reeks — kies een reeks met grotere maten of splits het debiet. De andere getallen zijn alleen ter oriëntatie.', 'Non dimensionné : %s dépasse sa vitesse limite même avec le plus gros tube de la série — choisir une série plus grande ou répartir le débit. Les autres valeurs ne sont données qu’à titre indicatif.', 'Sin dimensionar: %s supera su velocidad límite incluso con el mayor tubo de la serie; elija una serie mayor o reparta el caudal. Las demás cifras son solo orientativas.', 'Nie dobrano: %s przekracza prędkość graniczną nawet przy największej rurze szeregu — wybierz szereg o większych średnicach lub podziel przepływ. Pozostałe liczby są tylko orientacyjne.'),
  'w.unit_floor': T7('One utilisation unit (DIN 1988-300): the peak of %s is at least the sum of the two largest draw-offs of the unit (a shower next to a bath, a second basin, a bidet and a urinal not counted) — the curve alone gave less. Source: DIN as quoted by SHK Profi 8/2012 and the KELOX handbook (secondary).', 'Одна одиниця користування (DIN 1988-300): пік %s не менший за суму двох найбільших точок водорозбору одиниці (душ поруч із ванною, другий умивальник, біде й пісуар не враховуються) — сама крива дала менше. Джерело: DIN у цитуванні SHK Profi 8/2012 і довідника KELOX (вторинне).', 'Eine Nutzungseinheit (DIN 1988-300): die Spitze von %s ist mindestens die Summe der beiden größten Entnahmestellen der Einheit (Dusche neben Wanne, zweiter Waschtisch, Bidet und Urinal zählen nicht) — die Kurve allein ergab weniger. Quelle: DIN nach SHK Profi 8/2012 und KELOX-Handbuch (Sekundärquelle).', 'Eén gebruikseenheid (DIN 1988-300): de piek van %s is minstens de som van de twee grootste tappunten van de eenheid (douche naast bad, tweede wastafel, bidet en urinoir tellen niet) — de curve alleen gaf minder. Bron: DIN zoals geciteerd door SHK Profi 8/2012 en het KELOX-handboek (secundair).', 'Une unité d’utilisation (DIN 1988-300) : la pointe de %s vaut au moins la somme des deux plus gros puisages de l’unité (douche à côté d’une baignoire, second lavabo, bidet et urinoir non comptés) — la courbe seule donnait moins. Source : DIN citée par SHK Profi 8/2012 et le manuel KELOX (secondaire).', 'Una unidad de uso (DIN 1988-300): la punta de %s es al menos la suma de los dos mayores puntos de consumo de la unidad (ducha junto a bañera, segundo lavabo, bidé y urinario no cuentan); la curva sola daba menos. Fuente: DIN citada por SHK Profi 8/2012 y el manual KELOX (secundaria).', 'Jedna jednostka użytkowa (DIN 1988-300): szczyt %s wynosi co najmniej sumę dwóch największych punktów poboru jednostki (prysznic obok wanny, druga umywalka, bidet i pisuar nie liczą się) — sama krzywa dawała mniej. Źródło: DIN cytowana przez SHK Profi 8/2012 i podręcznik KELOX (wtórne).'),
  'f.allow': T7('Friction allowance behind a booster', 'Запас на тертя за підвищувальною установкою', 'Reibungsreserve hinter einer Druckerhöhung', 'Wrijvingsmarge achter een drukverhoging', 'Réserve de frottement après surpresseur', 'Margen de fricción tras el grupo de presión', 'Zapas na tarcie za zestawem hydroforowym'),
  'f.allow.h': T7('Used only when height + apparatus already exceed the supply: pipes are sized to lose at most this much.', 'Лише коли висота + арматура вже перевищують тиск у мережі: труби підбираються так, щоб втратити не більше цього.', 'Nur wenn Höhe + Apparate den Versorgungsdruck schon übersteigen: die Rohre werden auf höchstens diesen Verlust bemessen.', 'Alleen als hoogte + toestellen de leidingdruk al overschrijden: de leidingen worden op hoogstens dit verlies gedimensioneerd.', 'Seulement si hauteur + appareils dépassent déjà la pression : les conduites sont dimensionnées pour perdre au plus cette valeur.', 'Solo si altura + equipos ya superan la presión de red: las tuberías se dimensionan para perder como máximo esto.', 'Tylko gdy wysokość + urządzenia już przekraczają ciśnienie w sieci: rury dobiera się na stratę najwyżej tej wartości.'),

  'w.velocity': T7('%s exceeds its velocity limit even at the largest size of the series.', '%s перевищує граничну швидкість навіть при найбільшому діаметрі серії.', '%s überschreitet die Geschwindigkeitsgrenze auch mit der größten Rohrweite der Reihe.', '%s overschrijdt de snelheidsgrens zelfs met de grootste maat van de reeks.', '%s dépasse sa vitesse limite même avec le plus grand diamètre de la série.', '%s supera su velocidad límite incluso con el mayor diámetro de la serie.', '%s przekracza prędkość graniczną nawet przy największej średnicy szeregu.'),
  'w.booster_static': T7('Height, meter, filter and backflow preventer alone already need more than the supply pressure: no pipe size can avoid a booster (plbbooster: %q l/s, %h m).', 'Висота, лічильник, фільтр і зворотний клапан самі по собі вимагають більше, ніж тиск у мережі: жоден діаметр не усуне потреби в установці (plbbooster: %q л/с, %h м).', 'Höhe, Zähler, Filter und Rückflussverhinderer allein brauchen schon mehr als den Versorgungsdruck: keine Rohrweite vermeidet die Druckerhöhung (plbbooster: %q l/s, %h m).', 'Hoogte, meter, filter en terugstroombeveiliging alleen vragen al meer dan de leidingdruk: geen buismaat vermijdt een drukverhoging (plbbooster: %q l/s, %h m).', 'La hauteur, le compteur, le filtre et le clapet demandent déjà plus que la pression du réseau : aucun diamètre n’évite le surpresseur (plbbooster : %q l/s, %h m).', 'La altura, el contador, el filtro y el antirretorno ya piden más que la presión de red: ningún diámetro evita el grupo de presión (plbbooster: %q l/s, %h m).', 'Sama wysokość, wodomierz, filtr i zawór zwrotny wymagają więcej niż ciśnienie w sieci: żadna średnica nie pozwoli uniknąć zestawu (plbbooster: %q l/s, %h m).'),
  'w.booster_pipes': T7('Even the largest pipes on the critical path cannot recover the pressure: booster needed (plbbooster: %q l/s, %h m).', 'Навіть найбільші труби на критичному шляху не повертають тиск: потрібна установка (plbbooster: %q л/с, %h м).', 'Selbst die größten Rohre auf dem Fließweg holen den Druck nicht zurück: Druckerhöhung nötig (plbbooster: %q l/s, %h m).', 'Zelfs de grootste buizen op het kritieke pad halen de druk niet terug: drukverhoging nodig (plbbooster: %q l/s, %h m).', 'Même les plus gros tubes du chemin critique ne rattrapent pas la pression : surpresseur nécessaire (plbbooster : %q l/s, %h m).', 'Ni las tuberías más grandes del recorrido crítico recuperan la presión: grupo de presión necesario (plbbooster: %q l/s, %h m).', 'Nawet największe rury na drodze krytycznej nie odzyskają ciśnienia: potrzebny zestaw (plbbooster: %q l/s, %h m).'),
  'w.prv': T7('Static pressure at the lowest outlet ≈ %p bar > 5 bar: fit a pressure-reducing valve (EN 806-2).', 'Статичний тиск у найнижчого приладу ≈ %p бар > 5 бар: встановіть редуктор тиску (EN 806-2).', 'Ruhedruck an der tiefsten Entnahmestelle ≈ %p bar > 5 bar: Druckminderer einbauen (EN 806-2).', 'Statische druk aan het laagste tappunt ≈ %p bar > 5 bar: plaats een drukverminderaar (EN 806-2).', 'Pression statique au point le plus bas ≈ %p bar > 5 bar : poser un réducteur de pression (EN 806-2).', 'Presión estática en el punto más bajo ≈ %p bar > 5 bar: instale una reductora de presión (EN 806-2).', 'Ciśnienie statyczne w najniższym punkcie ≈ %p bar > 5 bar: zamontuj reduktor ciśnienia (EN 806-2).'),
  'w.en806_curve': T7('EN 806-3 option: the design flow follows Figure B.1 of the standard (line of the highest single LU up to 300 LU, then one line), digitised to about ±2 % — the simplified method for standard installations.', 'Варіант EN 806-3: розрахункова витрата за рисунком B.1 стандарту (лінія найбільшого одиничного ОН до 300 ОН, далі одна лінія), оцифровано з точністю близько ±2 % — спрощений метод для стандартних установок.', 'Option EN 806-3: der Spitzendurchfluss folgt Bild B.1 der Norm (Linie des größten Einzel-BW bis 300 BW, danach eine Linie), digitalisiert auf etwa ±2 % — vereinfachtes Verfahren für Standardinstallationen.', 'Optie EN 806-3: het ontwerpdebiet volgt figuur B.1 van de norm (lijn van de grootste enkele BE tot 300 BE, daarna één lijn), gedigitaliseerd op ongeveer ±2 % — vereenvoudigde methode voor standaardinstallaties.', 'Option EN 806-3 : le débit de calcul suit la figure B.1 de la norme (droite de la plus grande UC unitaire jusqu’à 300 UC, puis une seule droite), numérisée à environ ±2 % — méthode simplifiée pour installations standard.', 'Opción EN 806-3: el caudal de cálculo sigue la figura B.1 de la norma (recta de la mayor UC individual hasta 300 UC, luego una sola recta), digitalizada con aprox. ±2 %; método simplificado para instalaciones estándar.', 'Opcja EN 806-3: przepływ obliczeniowy wg rysunku B.1 normy (linia największej pojedynczej JO do 300 JO, dalej jedna linia), zdigitalizowany z dokładnością ok. ±2 % — metoda uproszczona dla instalacji standardowych.'),
  'w.simultaneous': T7('Zones marked “all at once” are added in full, without simultaneity (team showers, schools after sport, process flows).', 'Зони з позначкою «усі одночасно» додаються повністю, без коефіцієнта одночасності (командні душові, школи після спорту, технологічні витрати).', 'Als „alle gleichzeitig“ markierte Zonen gehen voll ein, ohne Gleichzeitigkeit (Mannschaftsduschen, Schulen nach dem Sport, Prozessdurchflüsse).', 'Zones gemarkeerd als „alles tegelijk” tellen volledig mee, zonder gelijktijdigheid (teamdouches, scholen na de sport, procesdebieten).', 'Les zones « tous ensemble » sont comptées en entier, sans simultanéité (douches d’équipe, écoles après le sport, débits de process).', 'Las zonas «todos a la vez» se suman completas, sin simultaneidad (duchas de equipo, colegios tras el deporte, caudales de proceso).', 'Strefy oznaczone „wszystkie naraz” liczy się w całości, bez jednoczesności (prysznice drużynowe, szkoły po WF, przepływy technologiczne).'),
  'w.upsized': T7('Velocity sizing alone left %z %m bar short; %n enlargements on the critical path fixed it — the pressure, not the velocity, decided these pipes.', 'Підбір лише за швидкістю залишав %z без %m бар; %n збільшень на критичному шляху це виправили — ці труби визначив тиск, а не швидкість.', 'Die Bemessung nur nach Geschwindigkeit ließ %z %m bar zu wenig; %n Vergrößerungen auf dem Fließweg beheben das — hier entscheidet der Druck, nicht die Geschwindigkeit.', 'Dimensionering alleen op snelheid liet %z %m bar tekort; %n vergrotingen op het kritieke pad losten het op — de druk, niet de snelheid, bepaalde deze leidingen.', 'Le dimensionnement à la seule vitesse laissait %z à court de %m bar ; %n agrandissements sur le chemin critique l’ont corrigé — c’est la pression, pas la vitesse, qui fixe ces tubes.', 'Dimensionar solo por velocidad dejaba a %z con %m bar de menos; %n ampliaciones en el recorrido crítico lo resolvieron: aquí manda la presión, no la velocidad.', 'Dobór tylko wg prędkości zostawiał %z bez %m bar; %n powiększeń na drodze krytycznej to naprawiło — o tych rurach zdecydowało ciśnienie, nie prędkość.'),

        'Elk tappunt heeft een ontwerpdebiet Qa (DIN 1988-300 tabel 1). Nooit lopen ze allemaal samen: DIN geeft de piek als Qs = a·(ΣQa)^b − c met constanten per gebouwtype, nooit onder het grootste afzonderlijke tappunt en nooit boven de som. In een appartementsgebouw ligt de piek vaak onder 10 % van ΣQa; in een hotel douchen gasten op hetzelfde uur, dus is de piek hoger.',
        'Chaque appareil a un débit de calcul Qa (DIN 1988-300 tab. 1). Ils ne coulent jamais tous ensemble : la DIN donne la pointe Qs = a·(ΣQa)^b − c avec des constantes par type de bâtiment, jamais sous le plus grand appareil et jamais au-dessus de la somme. En logements la pointe est souvent sous 10 % de ΣQa ; à l’hôtel les clients se douchent à la même heure, la pointe est plus forte.',
        'Cada aparato tiene un caudal de cálculo Qa (DIN 1988-300 tabla 1). Nunca funcionan todos a la vez: DIN da la punta como Qs = a·(ΣQa)^b − c con constantes por tipo de edificio, nunca por debajo del mayor aparato ni por encima de la suma. En viviendas la punta suele ser menos del 10 % de ΣQa; en un hotel los huéspedes se duchan a la misma hora y la punta es mayor.',
        'Każdy przybór ma przepływ obliczeniowy Qa (DIN 1988-300 tabl. 1). Nigdy nie działają wszystkie naraz: DIN podaje szczyt jako Qs = a·(ΣQa)^b − c ze stałymi dla rodzaju budynku, nigdy poniżej największego pojedynczego przyboru i nigdy powyżej sumy. W budynku mieszkalnym szczyt to często mniej niż 10 % ΣQa; w hotelu goście biorą prysznic o tej samej godzinie, więc szczyt jest wyższy.') },
    en806: { title: T7('EN 806-3 loading units', 'Одиниці навантаження EN 806-3', 'Belastungswerte nach EN 806-3', 'Belastingseenheden EN 806-3', 'Unités de charge EN 806-3', 'Unidades de carga EN 806-3', 'Jednostki obciążenia EN 806-3'),
      body: T7('EN 806-3 is the simplified European method: each outlet has loading units (1 LU = 0.1 l/s; basin 1, shower 2, bath 4, flush valve 15) and Figure B.1 converts ΣLU into a design flow. The option follows that figure: QD = 0.1·ΣLU up to the highest single LU, then the straight line (on the log chart) of that LU to 300 LU / 1.7 l/s, above that one line to 5000 LU. A larger single outlet (a bath, a flush valve) lifts the flow of small networks; big networks all meet on one line. DIN 1988-300 is offered next to it because it distinguishes building types and computes pressure losses explicitly.',
        'EN 806-3 — спрощений європейський метод: кожна точка має одиниці навантаження (1 ОН = 0,1 л/с; умивальник 1, душ 2, ванна 4, змивний кран 15), а рисунок B.1 переводить ΣОН у розрахункову витрату. Варіант іде за цим рисунком: QD = 0,1·ΣОН до найбільшого одиничного ОН, далі пряма (на логарифмічній сітці) цього ОН до 300 ОН / 1,7 л/с, вище — одна лінія до 5000 ОН. Більша одинична точка (ванна, змивний кран) підвищує витрату малої мережі; великі мережі сходяться на одній лінії. DIN 1988-300 запропоновано поруч, бо він розрізняє типи будівель і явно рахує втрати тиску.',
        'EN 806-3 ist das vereinfachte europäische Verfahren: jede Entnahmestelle hat Belastungswerte (1 BW = 0,1 l/s; Waschtisch 1, Dusche 2, Wanne 4, Druckspüler 15), Bild B.1 rechnet ΣBW in den Spitzendurchfluss um. Die Option folgt diesem Bild: QD = 0,1·ΣBW bis zum größten Einzel-BW, dann die Gerade (im log-Netz) dieses BW bis 300 BW / 1,7 l/s, darüber eine Linie bis 5000 BW. Eine größere Einzelentnahme (Wanne, Druckspüler) hebt den Durchfluss kleiner Netze; große Netze laufen auf einer Linie zusammen. DIN 1988-300 steht daneben, weil sie Gebäudearten unterscheidet und Druckverluste ausdrücklich berechnet.',
        'EN 806-3 is de vereenvoudigde Europese methode: elk tappunt heeft belastingseenheden (1 BE = 0,1 l/s; wastafel 1, douche 2, bad 4, drukspoeler 15) en figuur B.1 zet ΣBE om in een ontwerpdebiet. De optie volgt die figuur: QD = 0,1·ΣBE tot de grootste enkele BE, dan de rechte (op logpapier) van die BE tot 300 BE / 1,7 l/s, daarboven één lijn tot 5000 BE. Een groter enkel tappunt (bad, drukspoeler) verhoogt het debiet van kleine netten; grote netten komen op één lijn samen. DIN 1988-300 staat ernaast omdat ze gebouwtypes onderscheidt en drukverliezen expliciet berekent.',
        'L’EN 806-3 est la méthode européenne simplifiée : chaque point a des unités de charge (1 UC = 0,1 l/s ; lavabo 1, douche 2, baignoire 4, robinet de chasse 15) et la figure B.1 convertit ΣUC en débit de calcul. L’option suit cette figure : QD = 0,1·ΣUC jusqu’à la plus grande UC unitaire, puis la droite (en échelle log) de cette UC jusqu’à 300 UC / 1,7 l/s, au-delà une seule droite jusqu’à 5000 UC. Un point plus gros (baignoire, robinet de chasse) relève le débit des petits réseaux ; les grands réseaux se rejoignent sur une droite. La DIN 1988-300 est proposée à côté car elle distingue les types de bâtiments et calcule explicitement les pertes de charge.',
        'EN 806-3 es el método europeo simplificado: cada punto tiene unidades de carga (1 UC = 0,1 l/s; lavabo 1, ducha 2, bañera 4, fluxor 15) y la figura B.1 convierte ΣUC en caudal de cálculo. La opción sigue esa figura: QD = 0,1·ΣUC hasta la mayor UC individual, luego la recta (en escala log) de esa UC hasta 300 UC / 1,7 l/s y por encima una sola recta hasta 5000 UC. Un punto mayor (bañera, fluxor) eleva el caudal de las redes pequeñas; las grandes coinciden en una recta. DIN 1988-300 se ofrece al lado porque distingue tipos de edificio y calcula explícitamente las pérdidas de presión.',
        'EN 806-3 to uproszczona metoda europejska: każdy punkt ma jednostki obciążenia (1 JO = 0,1 l/s; umywalka 1, prysznic 2, wanna 4, zawór spłukujący 15), a rysunek B.1 przelicza ΣJO na przepływ obliczeniowy. Opcja idzie za tym rysunkiem: QD = 0,1·ΣJO do największej pojedynczej JO, dalej prosta (na siatce log) tej JO do 300 JO / 1,7 l/s, powyżej jedna linia do 5000 JO. Większy pojedynczy punkt (wanna, zawór spłukujący) podnosi przepływ małych sieci; duże sieci zbiegają się na jednej linii. DIN 1988-300 jest obok, bo rozróżnia rodzaje budynków i jawnie liczy straty ciśnienia.') },
    velocity: { title: T7('Velocity limits', 'Граничні швидкості', 'Geschwindigkeitsgrenzen', 'Snelheidsgrenzen', 'Vitesses limites', 'Velocidades límite', 'Prędkości graniczne'),
      body: T7('The first pass picks the smallest pipe that stays under the velocity limit of its segment (DIN 1988-300 Table 3): 2 m/s in the service connection, 2.5 m/s where valves with a high loss coefficient sit, 5 m/s otherwise. These are ceilings against noise and water hammer, not targets — a pipe at its limit loses a lot of pressure. Where the flow lasts longer than 15 minutes (zones “all at once”, continuous flows) and in the EN 806-3 option the limit is 2 m/s.',
        'Перший прохід обирає найменшу трубу, що лишається нижче граничної швидкості ділянки (DIN 1988-300 табл. 3): 2 м/с на вводі, 2,5 м/с там, де стоїть арматура з великим коефіцієнтом опору, 5 м/с в інших місцях. Це стелі проти шуму й гідроудару, а не цілі — труба на межі втрачає багато тиску. Де відбір триває понад 15 хвилин (зони «усі одночасно», постійні витрати) і у варіанті EN 806-3, межа — 2 м/с.',
        'Der erste Durchgang wählt die kleinste Rohrweite unter der Geschwindigkeitsgrenze der Teilstrecke (DIN 1988-300 Tab. 3): 2 m/s in der Anschlussleitung, 2,5 m/s mit Armaturen hohen Verlustbeiwerts, sonst 5 m/s. Das sind Obergrenzen gegen Geräusch und Druckstoß, keine Ziele — ein Rohr an der Grenze verliert viel Druck. Bei Entnahmen über 15 Minuten (Zonen „alle gleichzeitig“, Dauerdurchflüsse) und bei der Option EN 806-3 gilt 2 m/s.',
        'De eerste stap kiest de kleinste buis die onder de snelheidsgrens van het segment blijft (DIN 1988-300 tabel 3): 2 m/s in de aansluitleiding, 2,5 m/s waar kranen met een hoge verliescoëfficiënt zitten, anders 5 m/s. Het zijn plafonds tegen geluid en waterslag, geen doelen — een buis op de grens verliest veel druk. Waar de tapping langer dan 15 minuten duurt (zones “alle tegelijk”, continue debieten) en bij de optie EN 806-3 is de grens 2 m/s.',
        'Le premier passage choisit le plus petit tube sous la vitesse limite du tronçon (DIN 1988-300 tab. 3) : 2 m/s au branchement, 2,5 m/s avec des robinets à forte perte, 5 m/s sinon. Ce sont des plafonds contre le bruit et les coups de bélier, pas des cibles — un tube à la limite perd beaucoup de pression. Pour un puisage de plus de 15 minutes (zones « toutes en même temps », débits continus) et avec l’option EN 806-3, la limite est de 2 m/s.',
        'La primera pasada elige el tubo más pequeño bajo la velocidad límite del tramo (DIN 1988-300 tabla 3): 2 m/s en la acometida, 2,5 m/s con válvulas de alta pérdida, 5 m/s en el resto. Son techos contra ruido y golpe de ariete, no objetivos: un tubo en el límite pierde mucha presión. Donde el consumo dura más de 15 minutos (zonas «todo a la vez», caudales continuos) y en la opción EN 806-3 el límite es 2 m/s.',
        'Pierwsze przejście wybiera najmniejszą rurę poniżej prędkości granicznej odcinka (DIN 1988-300 tabl. 3): 2 m/s w przyłączu, 2,5 m/s przy armaturze o dużym współczynniku strat, w pozostałych 5 m/s. To sufity przeciw hałasowi i uderzeniom hydraulicznym, nie cele — rura na granicy traci dużo ciśnienia. Gdy pobór trwa ponad 15 minut (strefy „wszystko naraz”, przepływy ciągłe) oraz w wariancie EN 806-3 granica wynosi 2 m/s.') },
    pressure: { title: T7('Where the pressure goes', 'Куди йде тиск', 'Wo der Druck bleibt', 'Waar de druk naartoe gaat', 'Où passe la pression', 'Adónde va la presión', 'Gdzie znika ciśnienie'),
      body: T7('From the street pressure subtract: meter, filter and backflow preventer; height (0.098 bar per metre); friction λ·L/d·ρv²/2 and fittings Σζ·ρv²/2 of every segment on the way. What is left at the end of a branch must cover the minimum flow pressure of its most demanding fixture (1.0 bar for a mixer, 1.2 bar for a flush valve). The second pass enlarges, one size at a time, the segment with the largest loss on the worst path until that holds.',
        'Від тиску в мережі відніміть: лічильник, фільтр і зворотний клапан; висоту (0,098 бар на метр); тертя λ·L/d·ρv²/2 і місцеві опори Σζ·ρv²/2 кожної ділянки на шляху. Те, що лишається в кінці відгалуження, має покрити мінімальний тиск витікання найвибагливішого приладу (1,0 бар для змішувача, 1,2 бар для змивного крана). Другий прохід збільшує по одному розміру ділянку з найбільшою втратою на найгіршому шляху, доки це не виконано.',
        'Vom Straßendruck abziehen: Zähler, Filter und Rückflussverhinderer; Höhe (0,098 bar je Meter); Reibung λ·L/d·ρv²/2 und Einzelwiderstände Σζ·ρv²/2 jeder Teilstrecke unterwegs. Was am Ende einer Leitung bleibt, muss den Mindestfließdruck der anspruchsvollsten Entnahmestelle decken (1,0 bar Mischer, 1,2 bar Druckspüler). Der zweite Durchgang vergrößert Stufe für Stufe die Teilstrecke mit dem größten Verlust auf dem ungünstigsten Weg, bis das gilt.',
        'Trek van de straatdruk af: meter, filter en terugstroombeveiliging; hoogte (0,098 bar per meter); wrijving λ·L/d·ρv²/2 en weerstanden Σζ·ρv²/2 van elk segment onderweg. Wat aan het einde van een leiding overblijft, moet de minimale stromingsdruk van het veeleisendste tappunt dekken (1,0 bar mengkraan, 1,2 bar drukspoeler). De tweede stap vergroot maat per maat het segment met het grootste verlies op het ongunstigste pad tot dat klopt.',
        'De la pression du réseau, retirez : compteur, filtre et clapet ; la hauteur (0,098 bar par mètre) ; le frottement λ·L/d·ρv²/2 et les singularités Σζ·ρv²/2 de chaque tronçon traversé. Ce qui reste en bout de dérivation doit couvrir la pression minimale de l’appareil le plus exigeant (1,0 bar mitigeur, 1,2 bar robinet de chasse). Le second passage agrandit, d’un diamètre à la fois, le tronçon le plus déperditif du chemin le plus défavorable jusqu’à y parvenir.',
        'A la presión de red réstele: contador, filtro y antirretorno; la altura (0,098 bar por metro); la fricción λ·L/d·ρv²/2 y las singularidades Σζ·ρv²/2 de cada tramo del recorrido. Lo que queda al final de una derivación debe cubrir la presión mínima del aparato más exigente (1,0 bar mezclador, 1,2 bar fluxor). La segunda pasada amplía, de un diámetro en uno, el tramo con mayor pérdida del recorrido más desfavorable hasta lograrlo.',
        'Od ciśnienia w sieci odejmij: wodomierz, filtr i zawór zwrotny; wysokość (0,098 bar na metr); tarcie λ·L/d·ρv²/2 i opory miejscowe Σζ·ρv²/2 każdego odcinka po drodze. To, co zostaje na końcu odgałęzienia, musi pokryć minimalne ciśnienie wypływu najbardziej wymagającego przyboru (1,0 bar bateria, 1,2 bar zawór spłukujący). Drugie przejście powiększa po jednej średnicy odcinek o największej stracie na najgorszej drodze, aż warunek jest spełniony.') },
    booster: { title: T7('When a booster is unavoidable', 'Коли без установки не обійтися', 'Wann eine Druckerhöhung unvermeidlich ist', 'Wanneer drukverhoging onvermijdelijk is', 'Quand le surpresseur est inévitable', 'Cuándo el grupo de presión es inevitable', 'Kiedy zestaw hydroforowy jest nieunikniony'),
      body: T7('Bigger pipes only reduce friction. If height plus meter, filter and backflow preventer already take more than the street pressure minus the fixture’s minimum, no pipe size helps: the tool then sizes the pipes for a stated friction allowance behind the booster and passes the flow and the missing head to the booster tool (plbbooster) and the pump-curve tool.',
        'Більші труби зменшують лише тертя. Якщо висота плюс лічильник, фільтр і зворотний клапан уже забирають більше, ніж тиск у мережі мінус мінімум приладу, жоден діаметр не допоможе: тоді інструмент підбирає труби під заданий запас на тертя за установкою і передає витрату та відсутній напір інструменту установок (plbbooster) і інструменту робочої точки насоса.',
        'Größere Rohre senken nur die Reibung. Brauchen Höhe plus Zähler, Filter und Rückflussverhinderer schon mehr als Straßendruck minus Mindestfließdruck, hilft keine Rohrweite: dann bemisst das Werkzeug die Rohre für eine angegebene Reibungsreserve hinter der Druckerhöhung und gibt Durchfluss und fehlende Förderhöhe an das Druckerhöhungs-Werkzeug (plbbooster) und das Pumpenkennlinien-Werkzeug weiter.',
        'Grotere buizen verminderen alleen de wrijving. Als hoogte plus meter, filter en terugstroombeveiliging al meer vragen dan straatdruk min de minimale druk van het tappunt, helpt geen buismaat: de tool dimensioneert dan de leidingen voor een opgegeven wrijvingsmarge achter de drukverhoging en geeft debiet en ontbrekende opvoerhoogte door aan de drukverhogingstool (plbbooster) en de pompcurvetool.',
        'Des tubes plus gros ne réduisent que le frottement. Si la hauteur plus compteur, filtre et clapet prennent déjà plus que la pression du réseau moins le minimum de l’appareil, aucun diamètre n’aide : l’outil dimensionne alors pour une réserve de frottement donnée derrière le surpresseur et transmet débit et hauteur manquante à l’outil surpresseur (plbbooster) et à l’outil point de fonctionnement.',
        'Tuberías mayores solo reducen la fricción. Si la altura más contador, filtro y antirretorno ya consumen más que la presión de red menos el mínimo del aparato, ningún diámetro ayuda: la herramienta dimensiona entonces para un margen de fricción declarado tras el grupo y pasa caudal y altura que falta a la herramienta de grupos (plbbooster) y a la de punto de funcionamiento.',
        'Większe rury zmniejszają tylko tarcie. Jeśli wysokość plus wodomierz, filtr i zawór zwrotny zabierają już więcej niż ciśnienie w sieci minus minimum przyboru, żadna średnica nie pomoże: narzędzie dobiera wtedy rury na podany zapas tarcia za zestawem i przekazuje przepływ oraz brakującą wysokość do narzędzia zestawów (plbbooster) i narzędzia punktu pracy pompy.') },
    simultaneous: { title: T7('All at once: showers and processes', 'Усі одночасно: душові й технологія', 'Alle gleichzeitig: Duschen und Prozesse', 'Alles tegelijk: douches en processen', 'Tous ensemble : douches et process', 'Todos a la vez: duchas y procesos', 'Wszystkie naraz: prysznice i procesy'),
      body: T7('The peak-flow formula assumes random use. Team showers after a match, school changing rooms or a process line run together: mark such a zone “all at once” and its full flow is added on top of the diversified rest. Ignoring this undersizes the pipes several times over.',
        'Формула пікової витрати припускає випадкове користування. Командні душові після матчу, шкільні роздягальні чи технологічна лінія працюють разом: позначте таку зону «усі одночасно», і її повна витрата додається до решти з урахуванням одночасності. Ігнорування цього занижує труби в рази.',
        'Die Spitzenformel setzt zufällige Nutzung voraus. Mannschaftsduschen nach dem Spiel, Schulumkleiden oder eine Prozesslinie laufen gemeinsam: markieren Sie die Zone „alle gleichzeitig“, dann kommt ihr voller Durchfluss zum Rest hinzu. Wer das übersieht, bemisst die Rohre um ein Mehrfaches zu klein.',
        'De piekformule veronderstelt toevallig gebruik. Teamdouches na een wedstrijd, schoolkleedkamers of een proceslijn lopen samen: markeer zo’n zone „alles tegelijk” en haar volle debiet komt bovenop de rest. Wie dat negeert, dimensioneert de leidingen meervoudig te klein.',
        'La formule de pointe suppose un usage aléatoire. Douches d’équipe après un match, vestiaires scolaires ou ligne de process coulent ensemble : marquez la zone « tous ensemble » et son débit complet s’ajoute au reste. L’ignorer sous-dimensionne les tubes de plusieurs fois.',
        'La fórmula de punta supone uso aleatorio. Duchas de equipo tras un partido, vestuarios escolares o una línea de proceso funcionan a la vez: marque esa zona «todos a la vez» y su caudal completo se suma al resto. Ignorarlo infradimensiona las tuberías varias veces.',
        'Wzór na szczyt zakłada losowe korzystanie. Prysznice drużynowe po meczu, szatnie szkolne czy linia technologiczna pracują razem: oznacz taką strefę „wszystkie naraz”, a jej pełny przepływ dodaje się do reszty. Pominięcie tego zaniża rury kilkukrotnie.') },
    circuits: { title: T7('Cold and hot after the heater tee', 'Холодна й гаряча після трійника нагрівача', 'Kalt und warm nach dem Erwärmer-Abzweig', 'Koud en warm na de aftakking naar de verwarmer', 'Froide et chaude après le piquage du préparateur', 'Fría y caliente tras la derivación al calentador', 'Zimna i ciepła za trójnikiem podgrzewacza'),
      body: T7('Up to the tee of the water heater one pipe carries cold + hot together (DIN 1988-300 adds both sum flows there). After it there are two systems: the cold risers and branches, and the hot ones behind the heater, which lose its pressure drop as well. In the cold + hot mode the tool sizes and checks both; the worse residual pressure decides the verdict and the booster. Hot-water circulation is a separate tool (plbcirc).',
        'До трійника водонагрівача одна труба несе холодну й гарячу разом (DIN 1988-300 там додає обидві сумарні витрати). Після нього — дві системи: холодні стояки й відгалуження та гарячі після нагрівача, які ще втрачають його перепад тиску. У режимі «холодна + гаряча» інструмент підбирає й перевіряє обидві; гірший залишковий тиск визначає висновок і потребу в установці. Циркуляція ГВП — окремий інструмент (plbcirc).',
        'Bis zum Abzweig des Trinkwassererwärmers führt eine Leitung kalt + warm zusammen (DIN 1988-300 addiert dort beide Summendurchflüsse). Danach gibt es zwei Systeme: die kalten Steig- und Stockwerksleitungen und die warmen hinter dem Erwärmer, die zusätzlich dessen Druckverlust tragen. Im Modus kalt + warm bemisst und prüft das Werkzeug beide; der schlechtere Restdruck entscheidet über Ergebnis und Druckerhöhung. Die Zirkulation ist ein eigenes Werkzeug (plbcirc).',
        'Tot de aftakking naar de verwarmer voert één leiding koud + warm samen (DIN 1988-300 telt daar beide somdebieten op). Daarna zijn er twee systemen: de koude stijg- en verdiepingsleidingen en de warme na de verwarmer, die ook zijn drukverlies dragen. In de modus koud + warm dimensioneert en controleert de tool beide; de slechtste restdruk bepaalt het oordeel en de drukverhoging. Circulatie is een aparte tool (plbcirc).',
        'Jusqu’au piquage du préparateur, une seule conduite porte froide + chaude (la DIN 1988-300 y additionne les deux débits cumulés). Ensuite il y a deux réseaux : les colonnes et dérivations froides, et les chaudes après le préparateur, qui subissent en plus sa perte de charge. En mode froide + chaude l’outil dimensionne et vérifie les deux ; la pire pression résiduelle décide du verdict et du surpresseur. Le bouclage est un outil séparé (plbcirc).',
        'Hasta la derivación al calentador una sola tubería lleva fría + caliente juntas (la DIN 1988-300 suma ahí ambos caudales acumulados). Después hay dos sistemas: los montantes y derivaciones fríos y los calientes tras el calentador, que pierden además su caída de presión. En el modo fría + caliente la herramienta dimensiona y comprueba ambos; la peor presión residual decide el resultado y el grupo de presión. La recirculación es otra herramienta (plbcirc).',
        'Do trójnika podgrzewacza jedna rura prowadzi zimną i ciepłą razem (DIN 1988-300 dodaje tam oba przepływy sumaryczne). Za nim są dwa systemy: zimne piony i odgałęzienia oraz ciepłe za podgrzewaczem, które tracą jeszcze jego spadek ciśnienia. W trybie zimna + ciepła narzędzie dobiera i sprawdza oba; gorsze ciśnienie resztkowe decyduje o wyniku i o zestawie hydroforowym. Cyrkulacja to osobne narzędzie (plbcirc).') },
    unit: { title: T7('One flat: the two largest draw-offs', 'Одна квартира: дві найбільші точки', 'Eine Wohnung: die beiden größten Entnahmestellen', 'Eén woning: de twee grootste tappunten', 'Un logement : les deux plus gros puisages', 'Una vivienda: los dos mayores consumos', 'Jedno mieszkanie: dwa największe punkty poboru'),
      body: T7('Inside one utilisation unit — a bathroom, kitchen or flat, a hotel or ward room — rarely more than two draw-offs run together, so DIN 1988-300 takes the peak of a pipe serving one unit from its two largest design flows (a shower next to a bath, a second basin, a bidet and a urinal not counted). The tool does not know the rooms, so it applies this as a floor where a segment serves exactly one unit of a residential, care, hotel or hospital building (zone with 1 unit): never less than the two largest, never less than the curve. Several units: the curve.',
        'Усередині однієї одиниці користування — ванної, кухні чи квартири, номера готелю чи палати — рідко відкрито більше двох точок, тому DIN 1988-300 бере пік труби, що обслуговує одну одиницю, з двох найбільших розрахункових витрат (душ поруч із ванною, другий умивальник, біде й пісуар не враховуються). Інструмент не знає приміщень, тож застосовує це як нижню межу там, де ділянка обслуговує рівно одну одиницю житлової будівлі, будинку догляду, готелю чи лікарні (зона з 1 одиницею): не менше двох найбільших і не менше кривої. Кілька одиниць — крива.',
        'In einer Nutzungseinheit — Bad, Küche oder Wohnung, Hotel- oder Krankenzimmer — laufen selten mehr als zwei Entnahmestellen gleichzeitig; DIN 1988-300 nimmt daher die Spitze einer Leitung, die eine Einheit versorgt, aus den beiden größten Berechnungsdurchflüssen (Dusche neben Wanne, zweiter Waschtisch, Bidet und Urinal zählen nicht). Das Werkzeug kennt die Räume nicht und setzt dies als Untergrenze an, wo eine Teilstrecke genau eine Einheit eines Wohn-, Pflege-, Hotel- oder Krankenhausbaus versorgt (Zone mit 1 Einheit): nie weniger als die beiden größten, nie weniger als die Kurve. Mehrere Einheiten: die Kurve.',
        'Binnen één gebruikseenheid — badkamer, keuken of woning, hotel- of ziekenhuiskamer — lopen zelden meer dan twee tappunten samen; DIN 1988-300 neemt daarom de piek van een leiding die één eenheid bedient uit de twee grootste ontwerpdebieten (douche naast bad, tweede wastafel, bidet en urinoir tellen niet). De tool kent de ruimten niet en past dit toe als ondergrens waar een segment precies één eenheid van een woon-, zorg-, hotel- of ziekenhuisgebouw bedient (zone met 1 eenheid): nooit minder dan de twee grootste, nooit minder dan de curve. Meerdere eenheden: de curve.',
        'Dans une unité d’utilisation — salle de bains, cuisine ou logement, chambre d’hôtel ou d’hôpital — il est rare que plus de deux puisages coulent ensemble ; la DIN 1988-300 prend donc la pointe d’une conduite qui dessert une unité à partir de ses deux plus gros débits de calcul (douche à côté d’une baignoire, second lavabo, bidet et urinoir non comptés). L’outil ne connaît pas les pièces : il l’applique comme plancher là où un tronçon dessert exactement une unité d’un bâtiment résidentiel, de soins, d’hôtel ou d’hôpital (zone à 1 unité) : jamais moins que les deux plus gros, jamais moins que la courbe. Plusieurs unités : la courbe.',
        'Dentro de una unidad de uso —baño, cocina o vivienda, habitación de hotel u hospital— rara vez funcionan más de dos puntos a la vez; por eso la DIN 1988-300 toma la punta de una tubería que sirve a una unidad de sus dos mayores caudales de cálculo (ducha junto a bañera, segundo lavabo, bidé y urinario no cuentan). La herramienta no conoce los recintos y lo aplica como mínimo donde un tramo sirve exactamente a una unidad de un edificio residencial, asistencial, hotelero u hospitalario (zona con 1 unidad): nunca menos que los dos mayores ni que la curva. Varias unidades: la curva.',
        'W jednej jednostce użytkowej — łazience, kuchni czy mieszkaniu, pokoju hotelowym lub szpitalnym — rzadko działają więcej niż dwa punkty naraz, więc DIN 1988-300 bierze szczyt rury zasilającej jedną jednostkę z dwóch największych przepływów obliczeniowych (prysznic obok wanny, druga umywalka, bidet i pisuar się nie liczą). Narzędzie nie zna pomieszczeń, więc stosuje to jako dolną granicę tam, gdzie odcinek zasila dokładnie jedną jednostkę budynku mieszkalnego, opiekuńczego, hotelu lub szpitala (strefa z 1 jednostką): nigdy mniej niż dwa największe ani niż krzywa. Kilka jednostek: krzywa.') },
    profile: { title: T7('Reading the pressure profile', 'Як читати профіль тиску', 'Das Druckprofil lesen', 'Het drukprofiel lezen', 'Lire le profil de pression', 'Leer el perfil de presión', 'Jak czytać profil ciśnienia'),
      body: T7('The dashed line drops only with height and apparatus: it is what no pipe size can change. The solid line also drops with friction; the gap between the two is what bigger pipes can win back. The line must end above the minimum flow pressure of the worst fixture.',
        'Штрихова лінія падає лише з висотою та арматурою: це те, чого не змінить жоден діаметр. Суцільна падає ще й через тертя; проміжок між ними — те, що можуть повернути більші труби. Лінія має закінчуватися вище мінімального тиску витікання найгіршого приладу.',
        'Die gestrichelte Linie fällt nur mit Höhe und Apparaten: das ändert keine Rohrweite. Die durchgezogene fällt auch mit der Reibung; der Abstand dazwischen ist, was größere Rohre zurückholen können. Die Linie muss über dem Mindestfließdruck der ungünstigsten Entnahmestelle enden.',
        'De stippellijn daalt alleen met hoogte en toestellen: dat verandert geen buismaat. De volle lijn daalt ook door wrijving; de ruimte ertussen is wat grotere buizen kunnen terugwinnen. De lijn moet eindigen boven de minimale stromingsdruk van het ongunstigste tappunt.',
        'La ligne en tirets ne baisse qu’avec la hauteur et les appareils : aucun diamètre n’y change rien. La ligne pleine baisse aussi avec le frottement ; l’écart entre les deux est ce que des tubes plus gros peuvent regagner. La ligne doit finir au-dessus de la pression minimale du point le plus défavorable.',
        'La línea discontinua solo baja con la altura y los equipos: ningún diámetro la cambia. La continua baja también con la fricción; el hueco entre ambas es lo que tuberías mayores pueden recuperar. La línea debe terminar por encima de la presión mínima del punto más desfavorable.',
        'Linia przerywana spada tylko z wysokością i urządzeniami: tego nie zmieni żadna średnica. Ciągła spada też przez tarcie; odstęp między nimi to to, co mogą odzyskać większe rury. Linia musi kończyć się powyżej minimalnego ciśnienia wypływu najniekorzystniejszego punktu.') }
  },
