    "en": "Choose a building profile (dwellings, office, hotel, care home, school, sports showers) or load an example. The daily draw is spread on a 15-minute grid; the store must cover the worst cumulative deficit between draw and heater (sequent-peak method) and the short peak above the grid. The tool gives the volume for a heater power or the power for a volume, the nominal store size, reheat time, standing and circulation losses, the instantaneous alternative, the heat-pump share with booster and a legionella flag below 60 °C. The curve shows how volume buys power. Results go to the plumbing project file and the heater power to the heat generator selector.",

    "fr": "Choisissez un profil de bâtiment (logements, bureaux, hôtel, maison de repos, école, douches de salle de sport) ou chargez un exemple. Le puisage journalier est réparti sur une grille de 15 minutes ; le ballon doit couvrir le plus grand déficit cumulé entre puisage et générateur (méthode du pic séquentiel) et la courte pointe au-delà de la grille. L'outil donne le volume pour une puissance ou la puissance pour un volume, la taille nominale, le temps de réchauffage, les pertes statiques et de bouclage, l'alternative instantanée, la part de la pompe à chaleur avec appoint et un signal légionelle sous 60 °C. La courbe montre comment le volume remplace la puissance. Les résultats vont dans le fichier du projet sanitaire et la puissance vers le sélecteur de générateur de chaleur.",
    "es": "Elija un perfil de edificio (viviendas, oficina, hotel, residencia, colegio, duchas deportivas) o cargue un ejemplo. El consumo diario se reparte en una malla de 15 minutos; el acumulador debe cubrir el mayor déficit acumulado entre consumo y generador (método del pico secuencial) y el pico corto por encima de la malla. La herramienta da el volumen para una potencia o la potencia para un volumen, el tamaño nominal, el tiempo de recalentamiento, las pérdidas estáticas y de recirculación, la alternativa instantánea, la fracción de la bomba de calor con apoyo y un aviso de legionela por debajo de 60 °C. La curva muestra cómo el volumen sustituye potencia. Los resultados van al archivo del proyecto de fontanería y la potencia al selector de generador de calor.",

    "uk": "Одна розрахункова доба із заданими формами профілю та літрами на користувача (навчальні припущення, замініть даними проєкту), стала потужність нагрівача у вікні доступності, ідеальне регулювання. Стратифікація — лише як частка корисного об'єму; добовий дефіцит і буфер короткого піку не сумуються. Втрати бака — за межею Ecodesign, якщо не задано, приміщення 20 °C. Без прогріву мережі й часу очікування (це інструмент циркуляції ГВП). Метод N-числа DIN 4708 не реалізовано. Допоміжний інструмент проєктування, не замінює стандартів, правил водоканалу та національних/регіональних норм.",

    "fr": "Un seul jour de dimensionnement avec des formes de profil et des litres par usager déclarés (hypothèses pédagogiques, à remplacer par les données du projet), puissance constante dans la plage de disponibilité, régulation idéale. Stratification seulement comme part de volume utile ; le déficit journalier et le tampon de pointe ne s'additionnent pas. Pertes statiques selon la limite Ecodesign sauf valeur donnée, local à 20 °C. Pas de mise en température du réseau ni de temps d'attente (c'est l'outil bouclage ECS). La méthode du coefficient N de la DIN 4708 n'est pas implémentée. Aide à la conception, ne remplace ni les normes, ni les règles du distributeur d'eau, ni la réglementation nationale/régionale.",

        "reference": {
          "en": "82 cases computed on the page: 17 named (the seven examples and their points — 24 flats, office losses, hotel above and below the knee, sports showers, heat pump alone/with booster/with a too small booster, night tariff vs all-day, volume-to-power mode, given losses, infeasible heater, event across midnight, 55 °C school, district heat 65 °C with f 0.75) plus 40 seeded random cases over all profiles, heat sources, availability windows and loss modes. Expected values: for 57 cases a Python implementation of the published method (a consistency check, it shares the method with the page); 7 external anchors computed by hand from the energy balance, the Ecodesign 814/2013 formula and the DVGW W 551 definition (one draw against a constant heater, the same with a burst, a burst outside the heater window, a night tariff, a 200 L standing loss, the 400 L / 3 L limits). Plus 11 input-rule cases from the method text (r3): seven invalid draw events must give an error with the event number, an event typed as text numbers equals the hand anchor, and DVGW W 551 counts a one- or two-family house as a small installation whatever the store and pipe volume. r4 (deep review, rev 2): the design peak keeps its meaning — the excess of the peak flow above the step's mean draw — but is applied once a day at its worst moment, carried in the cyclic depletion, on an exact time grid (draw events integrated at their boundaries), and its excess energy is in the daily energy; anchor A2 re-derived (12.6785 kWh, 218.03 L, 300 L) and 7 hand cases added: a 160 L draw in 10 min against 5 kW (4.7491 kWh, 100 L; also across a step boundary), the same with q_peak 0.2667 L/s × 10 min (excess 1.8608 kWh: 6.6099 kWh, 120 L) and with t_peak 0, a peak without any profile against 0.1 kW (infeasible, minimum 0.13084 kW; an 80 L store needs exactly 0.13084 kW) and the 3-litre rule in a one-family house.",
          "uk": "82 випадків, обчислених на сторінці: 17 іменованих (сім прикладів і їхня суть — 24 квартири, втрати офісу, готель вище й нижче зламу, душові спортзалу, тепловий насос сам/з догрівачем/із замалим догрівачем, нічний тариф проти цілодобового, режим «потужність для об'єму», задані втрати, нездійсненний нагрівач, подія через північ, школа 55 °C, централізоване тепло 65 °C з f 0,75) плюс 40 псевдовипадкових випадків з фіксованим зерном по всіх профілях, джерелах тепла, вікнах доступності й режимах втрат. Очікувані значення: для 57 випадків — реалізація опублікованого методу на Python (перевірка узгодженості, метод той самий, що й на сторінці); 7 зовнішніх опорних випадків, обчислених вручну з енергетичного балансу, формули Ecodesign 814/2013 і визначення DVGW W 551 (один водорозбір проти сталого нагрівача, те саме зі сплеском, сплеск поза вікном нагрівача, нічний тариф, втрати бака 200 л, межі 400 л / 3 л). Плюс 11 випадків правил введення з тексту методу (r3): сім некоректних подій водорозбору мають давати помилку з номером події, подія, введена числами-текстом, дорівнює ручному опорному випадку, а DVGW W 551 вважає одно- чи двосімейний будинок малою установкою незалежно від об'єму бака й труб. r4 (глибоке ревю, ред. 2): розрахунковий пік зберігає зміст — перевищення пікової витрати над середнім водорозбором кроку, — але застосовується раз на добу в найгірший момент, накопичується в циклічному дефіциті на точній часовій сітці (події інтегруються на своїх межах), а енергія перевищення входить у добову енергію; опору A2 перераховано (12,6785 кВт·год, 218,03 л, 300 л) і вручну додано 7 випадків: 160 л за 10 хв проти 5 кВт (4,7491 кВт·год, 100 л; також через межу кроку), те саме з q_піку 0,2667 л/с × 10 хв (перевищення 1,8608 кВт·год: 6,6099 кВт·год, 120 л) і з t_піку 0, пік без профілю проти 0,1 кВт (нездійсненно, мінімум 0,13084 кВт; бак 80 л потребує рівно 0,13084 кВт) і правило 3 літрів в одноквартирному будинку.",
          "de": "82 auf der Seite berechnete Fälle: 17 benannte (die sieben Beispiele und ihre Pointen — 24 Wohnungen, Büroverluste, Hotel ober- und unterhalb des Knies, Sportduschen, Wärmepumpe allein/mit Nachheizung/mit zu kleiner Nachheizung, Nachttarif gegen ganztägig, Modus Leistung zum Volumen, angegebene Verluste, nicht machbarer Erzeuger, Ereignis über Mitternacht, Schule mit 55 °C, Fernwärme 65 °C mit f 0,75) und 40 Zufallsfälle mit festem Startwert über alle Profile, Erzeuger, Freigabefenster und Verlustarten. Sollwerte: für 57 Fälle eine Python-Umsetzung der veröffentlichten Methode (Konsistenzprüfung, gleiche Methode wie die Seite); 7 externe Ankerfälle, von Hand aus der Energiebilanz, der Ecodesign-Formel 814/2013 und der Definition nach DVGW W 551 gerechnet (eine Zapfung gegen konstante Leistung, dieselbe mit Stoß, Stoß außerhalb des Freigabefensters, Nachttarif, Bereitschaftsverlust 200 L, Grenzen 400 L / 3 L). Dazu 11 Fälle zu den Eingaberegeln aus dem Methodentext (r3): sieben ungültige Zapfereignisse müssen einen Fehler mit der Ereignisnummer ergeben, ein als Text-Zahlen eingegebenes Ereignis entspricht dem Handanker, und DVGW W 551 zählt ein Ein- oder Zweifamilienhaus unabhängig von Speicher- und Leitungsvolumen als Kleinanlage. r4 (Tiefenprüfung, Rev. 2): die Auslegungsspitze behält ihre Bedeutung — der Überschuss des Spitzendurchflusses über die mittlere Zapfung des Schritts —, wird aber einmal pro Tag zum ungünstigsten Zeitpunkt angesetzt, im zyklischen Defizit aufsummiert, auf einem exakten Zeitraster (Zapfereignisse an ihren Grenzen integriert), und ihre Überschussenergie zählt zur Tagesenergie; Anker A2 neu hergeleitet (12,6785 kWh, 218,03 L, 300 L) und 7 handgerechnete Fälle ergänzt: 160 L in 10 min gegen 5 kW (4,7491 kWh, 100 L; auch über eine Schrittgrenze), dasselbe mit q_Spitze 0,2667 L/s × 10 min (Überschuss 1,8608 kWh: 6,6099 kWh, 120 L) und mit t_Spitze 0, eine Spitze ohne Profil gegen 0,1 kW (nicht machbar, mindestens 0,13084 kW; ein 80-L-Speicher braucht genau 0,13084 kW) und die 3-Liter-Regel im Einfamilienhaus.",
          "nl": "82 op de pagina berekende gevallen: 17 benoemde (de zeven voorbeelden en hun kern — 24 appartementen, kantoorverliezen, hotel boven en onder de knik, sportdouches, warmtepomp alleen/met naverwarming/met te kleine naverwarming, nachttarief tegenover de hele dag, modus vermogen bij volume, opgegeven verliezen, onhaalbaar toestel, moment over middernacht, school op 55 °C, warmtenet 65 °C met f 0,75) plus 40 willekeurige gevallen met vaste startwaarde over alle profielen, warmtebronnen, beschikbaarheidsvensters en verlieswijzen. Verwachte waarden: voor 57 gevallen een Python-implementatie van de gepubliceerde methode (consistentiecontrole, dezelfde methode als de pagina); 7 externe ankergevallen, met de hand berekend uit de energiebalans, de Ecodesign-formule 814/2013 en de definitie van DVGW W 551 (één tapping tegen een constant toestel, dezelfde met stoot, stoot buiten het toestelvenster, nachttarief, stilstandsverlies 200 L, grenzen 400 L / 3 L). Plus 11 gevallen voor de invoerregels uit de methodetekst (r3): zeven ongeldige tapmomenten moeten een fout met het momentnummer geven, een moment ingevoerd als tekstgetallen is gelijk aan het handanker, en DVGW W 551 rekent een één- of tweegezinswoning tot de kleine installaties, ongeacht boiler- en leidingvolume. r4 (diepe review, rev. 2): de ontwerppiek behoudt haar betekenis — het overschot van het piekdebiet boven het gemiddelde tappen van de stap — maar wordt eenmaal per dag op het ongunstigste moment toegepast, opgeteld in het cyclische tekort, op een exact tijdraster (tapmomenten op hun grenzen geïntegreerd), en haar overschotenergie telt mee in de dagenergie; anker A2 herberekend (12,6785 kWh, 218,03 L, 300 L) en 7 met de hand berekende gevallen toegevoegd: 160 L in 10 min tegen 5 kW (4,7491 kWh, 100 L; ook over een stapgrens), hetzelfde met q_piek 0,2667 L/s × 10 min (overschot 1,8608 kWh: 6,6099 kWh, 120 L) en met t_piek 0, een piek zonder profiel tegen 0,1 kW (niet haalbaar, minimum 0,13084 kW; een vat van 80 L vraagt precies 0,13084 kW) en de 3-literregel in een eengezinswoning.",
          "fr": "82 cas calculés sur la page : 17 nommés (les sept exemples et leur enseignement — 24 logements, pertes des bureaux, hôtel au-dessus et au-dessous du coude, douches sportives, PAC seule/avec appoint/avec appoint trop petit, heures creuses face à toute la journée, mode puissance pour un volume, pertes données, générateur insuffisant, puisage à cheval sur minuit, école à 55 °C, réseau de chaleur 65 °C avec f 0,75) plus 40 cas aléatoires à graine fixe sur tous les profils, sources, plages de disponibilité et modes de pertes. Valeurs attendues : pour 57 cas une implémentation Python de la méthode publiée (contrôle de cohérence, même méthode que la page) ; 7 ancrages externes calculés à la main à partir du bilan énergétique, de la formule Ecodesign 814/2013 et de la définition DVGW W 551 (un puisage contre une puissance constante, le même avec un à-coup, un à-coup hors plage de chauffe, heures creuses, pertes statiques 200 L, limites 400 L / 3 L). Plus 11 cas de règles de saisie tirés du texte de la méthode (r3) : sept puisages invalides doivent donner une erreur avec le numéro du puisage, un puisage saisi en nombres texte égale l'ancrage manuel, et la DVGW W 551 range une maison individuelle ou bifamiliale parmi les petites installations quels que soient les volumes du ballon et des conduites. r4 (revue approfondie, rév. 2) : la pointe de calcul garde son sens — l'excédent du débit de pointe sur le puisage moyen du pas — mais elle est appliquée une fois par jour au pire moment, cumulée dans le déficit cyclique, sur une grille temporelle exacte (puisages intégrés à leurs limites), et son énergie excédentaire entre dans l'énergie journalière ; ancre A2 recalculée (12,6785 kWh, 218,03 L, 300 L) et 7 cas calculés à la main ajoutés : 160 L en 10 min contre 5 kW (4,7491 kWh, 100 L ; aussi à cheval sur une limite de pas), le même avec q_pointe 0,2667 L/s × 10 min (excédent 1,8608 kWh : 6,6099 kWh, 120 L) et avec t_pointe 0, une pointe sans profil contre 0,1 kW (irréalisable, minimum 0,13084 kW ; un ballon de 80 L demande exactement 0,13084 kW) et la règle des 3 litres dans une maison individuelle.",
          "es": "82 casos calculados en la página: 17 con nombre (los siete ejemplos y su clave — 24 viviendas, pérdidas de oficina, hotel por encima y por debajo del codo, duchas deportivas, bomba de calor sola/con apoyo/con apoyo demasiado pequeño, tarifa nocturna frente a todo el día, modo potencia para un volumen, pérdidas dadas, generador insuficiente, consumo que cruza la medianoche, colegio a 55 °C, red de calor a 65 °C con f 0,75) más 40 casos aleatorios con semilla fija en todos los perfiles, fuentes, ventanas de disponibilidad y modos de pérdidas. Valores esperados: para 57 casos una implementación en Python del método publicado (comprobación de coherencia, mismo método que la página); 7 anclas externas calculadas a mano a partir del balance energético, la fórmula Ecodesign 814/2013 y la definición DVGW W 551 (un consumo frente a potencia constante, el mismo con golpe, golpe fuera de la ventana del generador, tarifa nocturna, pérdidas estáticas de 200 L, límites 400 L / 3 L). Más 11 casos de reglas de entrada tomados del texto del método (r3): siete consumos no válidos deben dar un error con el número del consumo, un consumo escrito como números en texto coincide con el ancla manual, y la DVGW W 551 considera instalación pequeña una vivienda unifamiliar o bifamiliar sea cual sea el volumen del acumulador y de las tuberías. r4 (revisión a fondo, rev. 2): el pico de diseño conserva su sentido — el exceso del caudal punta sobre el consumo medio del paso — pero se aplica una vez al día en el peor momento, acumulado en el déficit cíclico, sobre una malla temporal exacta (consumos integrados en sus límites), y su energía en exceso entra en la energía diaria; ancla A2 recalculada (12,6785 kWh, 218,03 L, 300 L) y 7 casos calculados a mano añadidos: 160 L en 10 min frente a 5 kW (4,7491 kWh, 100 L; también a caballo de un límite de paso), lo mismo con q_pico 0,2667 L/s × 10 min (exceso 1,8608 kWh: 6,6099 kWh, 120 L) y con t_pico 0, un pico sin perfil frente a 0,1 kW (no viable, mínimo 0,13084 kW; un acumulador de 80 L necesita exactamente 0,13084 kW) y la regla de los 3 litros en una vivienda unifamiliar.",
          "pl": "82 przypadków policzonych na stronie: 17 nazwanych (siedem przykładów i ich sedno — 24 mieszkania, straty biura, hotel powyżej i poniżej kolana, natryski sportowe, pompa ciepła sama/z dogrzewaczem/ze zbyt małym dogrzewaczem, taryfa nocna wobec całodobowej, tryb moc dla pojemności, podane straty, niewystarczający podgrzewacz, zdarzenie przez północ, szkoła 55 °C, ciepło sieciowe 65 °C z f 0,75) oraz 40 losowych przypadków ze stałym ziarnem we wszystkich profilach, źródłach ciepła, oknach dostępności i rodzajach strat. Wartości oczekiwane: dla 57 przypadków implementacja opublikowanej metody w Pythonie (sprawdzenie spójności, ta sama metoda co strona); 7 zewnętrznych przypadków kotwiczących policzonych ręcznie z bilansu energii, wzoru Ecodesign 814/2013 i definicji DVGW W 551 (jeden pobór przy stałej mocy, to samo z impulsem, impuls poza oknem pracy, taryfa nocna, strata postojowa 200 L, granice 400 L / 3 L). Do tego 11 przypadków reguł wprowadzania z tekstu metody (r3): siedem błędnych poborów musi dać błąd z numerem poboru, pobór wpisany jako liczby tekstowe równa się ręcznej kotwicy, a DVGW W 551 uznaje dom jedno- lub dwurodzinny za małą instalację niezależnie od pojemności zasobnika i przewodów. r4 (dogłębny przegląd, wer. 2): szczyt obliczeniowy zachowuje znaczenie — nadwyżka przepływu szczytowego ponad średni pobór kroku — ale jest stosowany raz na dobę w najgorszym momencie, sumowany w deficycie cyklicznym, na dokładnej siatce czasu (zdarzenia całkowane na swoich granicach), a energia nadwyżki wchodzi do energii dobowej; kotwicę A2 przeliczono (12,6785 kWh, 218,03 L, 300 L) i dodano 7 przypadków policzonych ręcznie: 160 L w 10 min przy 5 kW (4,7491 kWh, 100 L; także przez granicę kroku), to samo z q_szczytu 0,2667 L/s × 10 min (nadwyżka 1,8608 kWh: 6,6099 kWh, 120 L) i z t_szczytu 0, szczyt bez profilu przy 0,1 kW (niewykonalne, minimum 0,13084 kW; zasobnik 80 L wymaga dokładnie 0,13084 kW) oraz zasada 3 litrów w domu jednorodzinnym."

    'Скільки бака на скільки нагрівача? Об\'єм заміщує потужність — доки не вирішить пік або добова енергія.',

    'Ile zasobnika na ile podgrzewacza? Pojemność zastępuje moc — dopóki nie zdecyduje szczyt albo energia dobowa.'),
  footer: T7('E = V·1.163·(T_use − T_cold)/1000 kWh per litre drawn; 15-min grid, net x_i = D_i + P_L·Δt − P·Δt·A_i; store energy = max over windows of (Σx + peak excess in the window), excess e_i = max(0, P_inst − D_i/Δt) once a day for t_peak, exact at step and event boundaries; daily energy includes the excess; V = E·1000/(1.163·(T_store − T_cold)·f). Heat pump: a = (T_hp − T_cold)/(T_store − T_cold), P_eff = min(P/a, P_boost/(1 − a)). Standing loss S = (16.66 + 8.33·V^0.4)·(T_store − 20)/45 W (Reg. (EU) 814/2013). Reheat t = V·1.163·ΔT/(P − P_L). Method _plb/dhw/METHOD.md.',
    'E = V·1,163·(T_вик − T_хол)/1000 кВт·год на літр розбору; сітка 15 хв, x_i = D_i + P_L·Δt − P·Δt·A_i; енергія бака = max за вікнами (Σx + перевищення піку у вікні), перевищення e_i = max(0, P_мит − D_i/Δt) раз на добу протягом t_пік, точно на межах кроків і подій; добова енергія містить перевищення; V = E·1000/(1,163·(T_бак − T_хол)·f). Тепловий насос: a = (T_тн − T_хол)/(T_бак − T_хол), P_еф = min(P/a, P_дог/(1 − a)). Втрати бака S = (16,66 + 8,33·V^0,4)·(T_бак − 20)/45 Вт (Регл. (ЄС) 814/2013). Нагрів t = V·1,163·ΔT/(P − P_L). Метод _plb/dhw/METHOD.md.',
    'E = V·1,163·(T_Nutz − T_kalt)/1000 kWh je gezapftem Liter; 15-min-Raster, x_i = D_i + P_L·Δt − P·Δt·A_i; Speicherenergie = max über Fenster (Σx + Spitzenüberschuss im Fenster), Überschuss e_i = max(0, P_DL − D_i/Δt) einmal täglich für t_Spitze, exakt an Schritt- und Ereignisgrenzen; Tagesenergie enthält den Überschuss; V = E·1000/(1,163·(T_Sp − T_kalt)·f). Wärmepumpe: a = (T_WP − T_kalt)/(T_Sp − T_kalt), P_eff = min(P/a, P_NH/(1 − a)). Bereitschaftsverlust S = (16,66 + 8,33·V^0,4)·(T_Sp − 20)/45 W (VO (EU) 814/2013). Aufheizen t = V·1,163·ΔT/(P − P_L). Methode _plb/dhw/METHOD.md.',
    'E = V·1,163·(T_gebruik − T_koud)/1000 kWh per getapte liter; raster 15 min, x_i = D_i + P_L·Δt − P·Δt·A_i; vatenergie = max over vensters (Σx + piekoverschot in het venster), overschot e_i = max(0, P_doorstr − D_i/Δt) eenmaal per dag gedurende t_piek, exact op stap- en tapgrenzen; dagenergie bevat het overschot; V = E·1000/(1,163·(T_vat − T_koud)·f). Warmtepomp: a = (T_wp − T_koud)/(T_vat − T_koud), P_eff = min(P/a, P_naverw/(1 − a)). Stilstandsverlies S = (16,66 + 8,33·V^0,4)·(T_vat − 20)/45 W (Verord. (EU) 814/2013). Opwarmen t = V·1,163·ΔT/(P − P_L). Methode _plb/dhw/METHOD.md.',
    'E = V·1,163·(T_usage − T_froide)/1000 kWh par litre puisé ; grille 15 min, x_i = D_i + P_L·Δt − P·Δt·A_i ; énergie du ballon = max sur les fenêtres (Σx + excédent de pointe dans la fenêtre), excédent e_i = max(0, P_inst − D_i/Δt) une fois par jour pendant t_pointe, exacte aux limites des pas et des puisages ; l\'énergie journalière inclut l\'excédent ; V = E·1000/(1,163·(T_ballon − T_froide)·f). PAC : a = (T_pac − T_froide)/(T_ballon − T_froide), P_eff = min(P/a, P_appoint/(1 − a)). Pertes statiques S = (16,66 + 8,33·V^0,4)·(T_ballon − 20)/45 W (règl. (UE) 814/2013). Réchauffage t = V·1,163·ΔT/(P − P_L). Méthode _plb/dhw/METHOD.md.',
    'E = V·1,163·(T_uso − T_fría)/1000 kWh por litro consumido; malla 15 min, x_i = D_i + P_L·Δt − P·Δt·A_i; energía del acumulador = máx. sobre ventanas (Σx + exceso del pico en la ventana), exceso e_i = máx(0, P_inst − D_i/Δt) una vez al día durante t_pico, exacta en los límites de pasos y eventos; la energía diaria incluye el exceso; V = E·1000/(1,163·(T_acum − T_fría)·f). Bomba de calor: a = (T_bc − T_fría)/(T_acum − T_fría), P_ef = min(P/a, P_apoyo/(1 − a)). Pérdidas estáticas S = (16,66 + 8,33·V^0,4)·(T_acum − 20)/45 W (Regl. (UE) 814/2013). Recalentamiento t = V·1,163·ΔT/(P − P_L). Método _plb/dhw/METHOD.md.',
    'E = V·1,163·(T_użytk − T_zimna)/1000 kWh na pobrany litr; siatka 15 min, x_i = D_i + P_L·Δt − P·Δt·A_i; energia zasobnika = maks. po oknach (Σx + nadwyżka szczytu w oknie), nadwyżka e_i = maks(0, P_przep − D_i/Δt) raz na dobę przez t_szczyt, dokładnie na granicach kroków i zdarzeń; energia dobowa zawiera nadwyżkę; V = E·1000/(1,163·(T_zas − T_zimna)·f). Pompa ciepła: a = (T_pc − T_zimna)/(T_zas − T_zimna), P_ef = min(P/a, P_dogrz/(1 − a)). Strata postojowa S = (16,66 + 8,33·V^0,4)·(T_zas − 20)/45 W (rozp. (UE) 814/2013). Nagrzewanie t = V·1,163·ΔT/(P − P_L). Metoda _plb/dhw/METHOD.md.'),
  'notice.t': T7('What this sizing is', 'Що це за підбір', 'Was diese Auslegung ist', 'Wat deze dimensionering is', 'Ce qu\'est ce dimensionnement', 'Qué es este dimensionado', 'Czym jest ten dobór'),
  'notice.b': T7('A first sizing for one design day. Profile shapes and litres per user are stated learning assumptions — replace them with project data. Design aid, not a substitute for the standards, the water utility\'s rules and national/regional regulations.',
    'Перший підбір для однієї розрахункової доби. Форми профілю та літри на користувача — явно зазначені навчальні припущення; замініть їх даними проєкту. Допоміжний інструмент проєктування, не замінює стандартів, правил водоканалу та національних/регіональних норм.',
    'Eine erste Auslegung für einen Auslegungstag. Profilformen und Liter je Nutzer sind ausgewiesene Lernannahmen — durch Projektdaten ersetzen. Planungshilfe, kein Ersatz für die Normen, die Vorgaben des Wasserversorgers und nationale/regionale Vorschriften.',
    'Een eerste dimensionering voor één ontwerpdag. Profielvormen en liters per gebruiker zijn vermelde leeraannames — vervang ze door projectgegevens. Ontwerphulpmiddel, geen vervanging van de normen, de voorschriften van de waterleverancier en nationale/regionale regelgeving.',
    'Un premier dimensionnement pour un jour de calcul. Les formes de profil et les litres par usager sont des hypothèses pédagogiques déclarées — remplacez-les par les données du projet. Aide à la conception, ne remplace ni les normes, ni les règles du distributeur d\'eau, ni la réglementation nationale/régionale.',
    'Un primer dimensionado para un día de diseño. Las formas de perfil y los litros por usuario son supuestos didácticos declarados: sustitúyalos por datos del proyecto. Ayuda de diseño, no sustituye las normas, las reglas de la compañía de aguas ni la normativa nacional/regional.',
    'Pierwszy dobór dla jednej doby obliczeniowej. Kształty profilu i litry na użytkownika to jawne założenia dydaktyczne — zastąp je danymi projektu. Pomoc projektowa, nie zastępuje norm, wymagań przedsiębiorstwa wodociągowego ani przepisów krajowych/regionalnych.'),

  'f.qpeak': T7('Design peak flow (mixed water)', 'Розрахункова пікова витрата (змішана вода)', 'Spitzendurchfluss (Mischwasser)', 'Ontwerppiekdebiet (mengwater)', 'Débit de pointe de calcul (eau mitigée)', 'Caudal punta de diseño (agua mezclada)', 'Obliczeniowy przepływ szczytowy (woda zmieszana)'),
  'f.qpeak.h': T7('Simultaneous flow at the taps, e.g. 0.15 L/s per running shower (DIN 1988-300 order of magnitude). Sets the instantaneous power; for the store, the part of this flow above the profile\'s mean draw in that 15-minute step counts once a day, for the peak duration, at the worst moment (only while the profile draws; with no profile at all the whole peak counts). That excess is also in the daily energy.',
    'Одночасна витрата в точках розбору, напр. 0,15 л/с на один увімкнений душ (порядок величин DIN 1988-300). Визначає миттєву потужність; для бака раз на добу протягом тривалості піку в найгірший момент рахується частина цієї витрати понад середній водорозбір профілю в тому 15-хвилинному кроці (лише поки профіль розбирає воду; без профілю — весь пік). Це перевищення входить і в добову енергію.',
    'Gleichzeitiger Durchfluss an den Zapfstellen, z. B. 0,15 L/s je laufender Dusche (Größenordnung DIN 1988-300). Bestimmt die Durchlaufleistung; für den Speicher zählt einmal täglich, für die Spitzendauer und zum ungünstigsten Zeitpunkt, der Teil dieses Durchflusses über der mittleren Zapfung des Profils in diesem 15-Minuten-Schritt (nur solange das Profil zapft; ohne Profil die ganze Spitze). Dieser Überschuss geht auch in die Tagesenergie ein.',
    'Gelijktijdig debiet aan de tappunten, bv. 0,15 L/s per lopende douche (grootteorde DIN 1988-300). Bepaalt het doorstroomvermogen; voor het vat telt eenmaal per dag, gedurende de piekduur en op het ongunstigste moment, het deel van dit debiet boven het gemiddelde tappen van het profiel in die stap van 15 minuten (alleen zolang het profiel tapt; zonder profiel de hele piek). Dat overschot zit ook in de dagenergie.',
    'Débit simultané aux points de puisage, p. ex. 0,15 L/s par douche en marche (ordre de grandeur DIN 1988-300). Fixe la puissance instantanée ; pour le ballon compte une fois par jour, pendant la durée de pointe et au pire moment, la part de ce débit au-dessus du puisage moyen du profil dans ce pas de 15 minutes (seulement pendant que le profil puise ; sans profil, toute la pointe). Cet excédent entre aussi dans l\'énergie journalière.',
    'Caudal simultáneo en los grifos, p. ej. 0,15 L/s por ducha abierta (orden de magnitud DIN 1988-300). Fija la potencia instantánea; para el acumulador cuenta una vez al día, durante la duración del pico y en el peor momento, la parte de este caudal por encima del consumo medio del perfil en ese paso de 15 minutos (solo mientras el perfil consume; sin perfil, todo el pico). Ese exceso también entra en la energía diaria.',
    'Przepływ jednoczesny w punktach poboru, np. 0,15 L/s na każdy pracujący natrysk (rząd wielkości DIN 1988-300). Wyznacza moc przepływową; dla zasobnika liczy się raz na dobę, przez czas trwania szczytu i w najgorszym momencie, część tego przepływu ponad średni pobór profilu w tym kroku 15-minutowym (tylko gdy profil pobiera wodę; bez profilu cały szczyt). Ta nadwyżka wchodzi też do energii dobowej.'),

  'fl.legionella_below_60': T7('Store below 60 °C: HSG274 Part 2 and DVGW W 551 ask for at least 60 °C in the store/at the heater outlet; in Flanders the Legionellabesluit (2007) requires a management plan with temperatures for high-risk establishments. Regional rules may be stricter — check with DHW Circulation and Legionella Risk.',
    'Бак нижче 60 °C: HSG274 Part 2 і DVGW W 551 вимагають щонайменше 60 °C у баку/на виході нагрівача; у Фландрії Legionellabesluit (2007) вимагає плану управління з температурами для закладів високого ризику. Регіональні правила можуть бути суворішими — перевірте в інструментах циркуляції ГВП і ризику легіонели.',

    'Ballon sous 60 °C : HSG274 Part 2 et DVGW W 551 demandent au moins 60 °C dans le ballon/à la sortie du générateur ; en Flandre le Legionellabesluit (2007) impose un plan de gestion avec températures aux établissements à risque. Les règles régionales peuvent être plus strictes — vérifiez avec les outils bouclage et légionelle.',

  }

  if (!r.feasible) verdict = { tone: 'bad', text: S('v.infeasible', { E: F(r.daily_energy_kwh + r.loss_day_kwh, 1), P: fmtP(state.mode === 'volume' ? r.p_min_kw : state.p_kw) }) };
  else if (state.mode === 'volume') verdict = { tone: r.flags.indexOf('legionella_below_60') >= 0 ? 'warn' : 'ok', text: S('v.okv', { V: fmtV(state.v_l), P: fmtP(r.p_main_kw), G: gov, I: fmtP(r.p_inst_kw) }) };

    { label: tx('t.pow'), value: state.p_kw, precision: 1, hint: 'kW', learn: 'curve' }
  ];
  tiles = tiles.concat([
    { label: tx('t.inst'), value: r.p_inst_kw, precision: 1, hint: 'kW', learn: 'instant' },
    { label: tx('t.reheat'), value: feas && isFinite(r.reheat_h) ? r.reheat_h : null, precision: 2, hint: 'h', learn: 'reheat' },
    { label: tx('t.day'), value: r.daily_energy_kwh, precision: 1, hint: 'kWh/d' },

  if (feas) tiles.push({ label: tx('t.mixed'), value: r.mixed_capacity_l, precision: 0, hint: 'L', headline: false, learn: 'mixing' });
  var rows = [
    [tx('r.dvol'), r.daily_volume_l, 0, 'L'],

    [tx('r.peak'), r.peak_hour_kwh, 1, 'kWh/h'],
    [tx('r.hours'), r.hours_available, 2, 'h'],
    [tx('r.pmin'), r.p_min_kw, 1, 'kW'],
    [tx('r.peff'), feas ? r.p_eff_kw : null, 1, 'kW'],
    [tx('r.estore'), feas ? r.e_store_kwh : null, 1, 'kWh'],
    [tx('r.sloss'), r.store_loss_w, 0, 'W'],
    [tx('r.lday'), r.loss_day_kwh, 1, 'kWh/d']
  ];

    rows: rows.map(function (x) { return { cells: [x[0], { value: (typeof x[1] === 'number' && isFinite(x[1])) ? x[1] : null, precision: x[2] }, x[3]] }; }) }];
  if (r.curve && r.curve.length) {
    var step = Math.max(1, Math.round(r.curve.length / 8)), cr = [];
    for (var i = 0; i < r.curve.length; i += step) cr.push({ cells: [{ value: r.curve[i].p_kw, precision: 1 }, { value: r.curve[i].v_l, precision: 0 }] });
    tables.push({ title: tx('tab.curve'), head: [{ label: 'kW', num: true }, { label: 'L', num: true }], rows: cr });
  }
  r.flags.forEach(function (f) { if (f !== 'infeasible' && I18N['fl.' + f]) notes.push(S('fl.' + f, { H: F(r.hours_available, 1) })); });
  notes.push(S('n.assume'));
  if (!CORE) notes.push(S('n.nocore'));
  if (note) notes.push(note);
  return { verdict: verdict, tiles: tiles, tables: tables, notes: notes };
}

}

/* ---- chart ---- */
function draw(ctx, w, h, opt) {
  opt = opt || {};
  ctx.clearRect(0, 0, w, h);
  if (!last || !last.valid) return;
  var cs = getComputedStyle(document.documentElement), ink = opt.ink || cs.getPropertyValue('--ink').trim() || '#222', muted = opt.muted || cs.getPropertyValue('--muted').trim() || '#777',
      line = opt.line || cs.getPropertyValue('--line').trim() || '#ccc', acc = opt.acc || cs.getPropertyValue('--accent').trim() || '#3763e6', font = cs.getPropertyValue('--font').trim() || 'sans-serif';
  var fs = opt.fs || 12, wide = w >= 640;
  var boxes = wide ? [[0, 0, w * 0.55, h], [w * 0.55, 0, w * 0.45, h]] : [[0, 0, w, h * 0.55], [0, h * 0.55, w, h * 0.45]];
  ctx.font = '400 ' + fs + 'px ' + font; ctx.textBaseline = 'middle';
  function ticks(max) { var raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), st = [1, 2, 2.5, 5, 10].map(function (m) { return m * mag; }).filter(function (v) { return v >= raw; })[0] || 10 * mag, out = [];
    for (var v = 0; v <= max + 1e-9; v += st) out.push(v); return out; }
  function axes(b, xmax, ymax, xl, yl, xt) {
    var L = b[0] + 54, R = b[0] + b[2] - 12, T = b[1] + 22, B = b[1] + b[3] - 40;
    ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.fillStyle = muted; ctx.textAlign = 'right';
    ticks(ymax).forEach(function (yv) { var y = B - (B - T) * yv / ymax; ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(R, y); ctx.stroke(); ctx.fillText(F(yv, ymax >= 40 ? 0 : 1), L - 4, y); });
    ctx.textAlign = 'center';
    (xt || ticks(xmax)).forEach(function (xv) { var x = L + (R - L) * xv / xmax; ctx.fillText(F(xv, xmax >= 40 ? 0 : 1), x, B + 12); });
    ctx.fillText(xl, (L + R) / 2, B + 28);
    ctx.save(); ctx.translate(b[0] + 12, (T + B) / 2); ctx.rotate(-Math.PI / 2); ctx.fillText(yl, 0, 0); ctx.restore();
    return { X: function (v) { return L + (R - L) * v / xmax; }, Y: function (v) { return B - (B - T) * v / ymax; }, L: L, R: R, T: T, B: B };
  }
  /* 1: volume vs power */
  var c = last.curve || [], b1 = boxes[0];
  var px = last.feasible ? last.p_eff_kw : null, pv = last.feasible ? last.v_store_l : null;
  var xmax = Math.max(last.p_inst_kw * 1.05, px || 0, c.length ? c[c.length - 1].p_kw : 1) || 1;
  var ymax = Math.max(pv || 0, c.length ? c[0].v_l : 0, 10) * 1.1;
  var A = axes(b1, xmax, ymax, S('chart.x'), S('chart.y'));
  if (!c.length) { ctx.fillStyle = muted; ctx.textAlign = 'center'; ctx.fillText(S('chart.none'), (A.L + A.R) / 2, (A.T + A.B) / 2); }
  ctx.strokeStyle = acc; ctx.lineWidth = 2; ctx.beginPath();
  c.forEach(function (p, i) { var x = A.X(p.p_kw), y = A.Y(Math.min(p.v_l, ymax)); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }); ctx.stroke();
  ctx.setLineDash([5, 4]); ctx.strokeStyle = muted; ctx.beginPath(); ctx.moveTo(A.X(last.p_inst_kw), A.T); ctx.lineTo(A.X(last.p_inst_kw), A.B); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = muted; ctx.textAlign = 'right'; ctx.fillText(S('chart.inst'), A.X(last.p_inst_kw) - 4, A.T + 8);
  if (px != null && isFinite(pv)) { ctx.fillStyle = ink; ctx.beginPath(); ctx.arc(A.X(px), A.Y(Math.min(pv, ymax)), 6, 0, 2 * Math.PI); ctx.fill();
    ctx.textAlign = 'left'; ctx.fillText(fmtP(px) + ' kW · ' + fmtV(pv) + ' L', Math.min(A.X(px) + 9, A.R - 120), A.Y(Math.min(pv, ymax)) - 12); }
  /* 2: hourly profile */
  var d = last.profile.draw_kwh, av = last.profile.available, hr = [], sup = [];
  for (var hh = 0; hh < 24; hh++) { hr.push(d[4 * hh] + d[4 * hh + 1] + d[4 * hh + 2] + d[4 * hh + 3]); var a = (av[4 * hh] + av[4 * hh + 1] + av[4 * hh + 2] + av[4 * hh + 3]) / 4; sup.push(last.feasible ? last.p_eff_kw * a - last.loss_kw : 0); }
  var y2 = Math.max(Math.max.apply(null, hr), Math.max.apply(null, sup), 0.1) * 1.15;
  var B2 = axes(boxes[1], 24, y2, S('chart.hx'), S('chart.hy'), [0, 6, 12, 18, 24]);
  var bw = (B2.R - B2.L) / 24;
  ctx.fillStyle = acc; ctx.globalAlpha = 0.45;
  hr.forEach(function (v, i) { var y = B2.Y(v); ctx.fillRect(B2.L + i * bw + 1, y, Math.max(1, bw - 2), B2.B - y); });
  ctx.globalAlpha = 1;
  if (last.feasible) { ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.beginPath(); sup.forEach(function (v, i) { var y = B2.Y(Math.max(0, v)); if (i) ctx.lineTo(B2.L + i * bw, y); else ctx.moveTo(B2.L, y); ctx.lineTo(B2.L + (i + 1) * bw, y); }); ctx.stroke(); }
}

        'Sumuj krok po kroku pobór minus moc podgrzewacza: największy narastający deficyt na dowolnym odcinku doby (sekwencyjny szczyt) to energia, którą musi mieć zasobnik. Mniejsza moc, większy deficyt, większy zasobnik. Poniżej średniej dobowej żaden zasobnik nie wystarczy; przy mocy przepływowej żaden nie jest potrzebny.') },
    instant: { title: T7('Instantaneous power and the short peak', 'Миттєва потужність і короткий пік', 'Durchlaufleistung und kurze Spitze', 'Doorstroomvermogen en korte piek', 'Puissance instantanée et pointe courte', 'Potencia instantánea y pico corto', 'Moc przepływowa i krótki szczyt'),
      body: T7('Without a store the heater must follow the peak flow: P = q·3600·1.163·(T_use − T_cold)/1000, about 19 kW per shower. A 15-minute profile spreads the draw over the step, so the store must also hold the peak above the step\'s mean draw, (P_inst − D/Δt)·t_peak. It is applied once a day at the worst moment and added to the deficit already built up (a peak early in a long deficit still counts at its end); the heater output during the peak is part of that deficit. Its energy is in the daily balance, so a heater too small to recover it within the day is reported as not feasible. Draws are integrated exactly between step and event boundaries.',
    'Без бака нагрівач має встигати за піковою витратою: P = q·3600·1,163·(T_вик − T_хол)/1000, близько 19 кВт на один душ. 15-хвилинний профіль розподіляє водорозбір по кроку, тож бак має ще й покрити пік понад середній водорозбір кроку, (P_мит − D/Δt)·t_піку. Він застосовується раз на добу в найгірший момент і додається до вже накопиченого дефіциту (пік на початку довгого дефіциту враховується і в його кінці); потужність нагрівача під час піку входить у цей дефіцит. Його енергія — у добовому балансі, тож нагрівач, замалий, щоб відновити її за добу, позначається як нездійсненний. Водорозбір інтегрується точно між межами кроків і подій.',
    'Ohne Speicher muss der Erzeuger dem Spitzendurchfluss folgen: P = q·3600·1,163·(T_Nutz − T_kalt)/1000, etwa 19 kW je Dusche. Ein 15-Minuten-Profil verteilt die Zapfung über den Schritt, deshalb muss der Speicher zusätzlich die Spitze über der mittleren Zapfung des Schritts tragen, (P_DL − D/Δt)·t_Spitze. Sie wird einmal täglich zum ungünstigsten Zeitpunkt angesetzt und auf das schon aufgelaufene Defizit addiert (eine Spitze früh in einem langen Defizit zählt noch an dessen Ende); die Erzeugerleistung während der Spitze steckt in diesem Defizit. Ihre Energie steht in der Tagesbilanz; ein Erzeuger, der sie nicht innerhalb des Tages nachheizen kann, gilt als nicht machbar. Die Zapfung wird exakt zwischen Schritt- und Ereignisgrenzen integriert.',
    'Zonder vat moet het toestel het piekdebiet volgen: P = q·3600·1,163·(T_gebruik − T_koud)/1000, ongeveer 19 kW per douche. Een profiel van 15 minuten spreidt het tappen over de stap, dus moet het vat ook de piek boven het gemiddelde tappen van de stap dekken, (P_doorstr − D/Δt)·t_piek. Ze wordt eenmaal per dag op het ongunstigste moment toegepast en bij het al opgebouwde tekort opgeteld (een piek vroeg in een lang tekort telt nog aan het einde ervan); het toestelvermogen tijdens de piek zit in dat tekort. Haar energie staat in de dagbalans, zodat een toestel dat ze niet binnen de dag kan bijwarmen als niet haalbaar wordt gemeld. Het tappen wordt exact tussen stap- en gebeurtenisgrenzen geïntegreerd.',
    'Sans ballon le générateur doit suivre le débit de pointe : P = q·3600·1,163·(T_usage − T_froide)/1000, environ 19 kW par douche. Un profil au pas de 15 minutes répartit le puisage sur le pas, le ballon doit donc aussi couvrir la pointe au-dessus du puisage moyen du pas, (P_inst − D/Δt)·t_pointe. Elle est appliquée une fois par jour au pire moment et ajoutée au déficit déjà accumulé (une pointe au début d\'un long déficit compte encore à sa fin) ; la puissance du générateur pendant la pointe fait partie de ce déficit. Son énergie entre dans le bilan journalier : un générateur trop petit pour la récupérer dans la journée est signalé irréalisable. Le puisage est intégré exactement entre les limites des pas et des puisages.',
    'Sin acumulador el generador debe seguir el caudal punta: P = q·3600·1,163·(T_uso − T_fría)/1000, unos 19 kW por ducha. Un perfil de 15 minutos reparte el consumo en el paso, así que el acumulador también debe cubrir el pico por encima del consumo medio del paso, (P_inst − D/Δt)·t_pico. Se aplica una vez al día en el peor momento y se suma al déficit ya acumulado (un pico al principio de un déficit largo cuenta todavía al final); la potencia del generador durante el pico forma parte de ese déficit. Su energía está en el balance diario, de modo que un generador demasiado pequeño para recuperarla en el día se marca como no viable. El consumo se integra exactamente entre los límites de pasos y eventos.',
    'Bez zasobnika podgrzewacz musi nadążać za przepływem szczytowym: P = q·3600·1,163·(T_użytk − T_zimna)/1000, ok. 19 kW na natrysk. Profil 15-minutowy rozkłada pobór na cały krok, więc zasobnik musi też pokryć szczyt ponad średni pobór kroku, (P_przep − D/Δt)·t_szczytu. Stosuje się go raz na dobę w najgorszym momencie i dodaje do już narosłego deficytu (szczyt na początku długiego deficytu liczy się jeszcze na jego końcu); moc podgrzewacza w czasie szczytu jest częścią tego deficytu. Jego energia jest w bilansie dobowym, więc podgrzewacz zbyt mały, by odrobić ją w ciągu doby, jest oznaczany jako niewykonalny. Pobór jest całkowany dokładnie między granicami kroków i zdarzeń.') },
    window: { title: T7('Heater hours: night tariff, heat-pump windows', 'Години нагрівача: нічний тариф, вікна теплового насоса', 'Erzeugerstunden: Nachttarif, Wärmepumpenfenster', 'Toesteluren: nachttarief, warmtepompvensters', 'Heures de chauffe : heures creuses, plages de PAC', 'Horas del generador: tarifa nocturna, ventanas de bomba de calor', 'Godziny podgrzewacza: taryfa nocna, okna pompy ciepła'),
      body: T7('If the heater may run only part of the day, the store must carry the rest. The daily average power rises to (daily energy + losses)/hours, and the deficit grows with every hour without heating.',
        'Якщо нагрівач може працювати лише частину доби, решту має покрити бак. Середня потужність зростає до (добова енергія + втрати)/години, а дефіцит росте з кожною годиною без нагріву.',
        'Darf der Erzeuger nur einen Teil des Tages laufen, muss der Speicher den Rest tragen. Die mittlere Leistung steigt auf (Tagesenergie + Verluste)/Stunden, das Defizit wächst mit jeder Stunde ohne Heizung.',
        'Mag het toestel maar een deel van de dag werken, dan moet het vat de rest dragen. Het gemiddelde vermogen stijgt tot (dagenergie + verliezen)/uren en het tekort groeit met elk uur zonder verwarming.',
        'Si le générateur ne peut fonctionner qu\'une partie de la journée, le ballon doit porter le reste. La puissance moyenne monte à (énergie journalière + pertes)/heures et le déficit croît avec chaque heure sans chauffe.',
        'Si el generador solo puede funcionar parte del día, el acumulador debe cubrir el resto. La potencia media sube a (energía diaria + pérdidas)/horas y el déficit crece con cada hora sin calentamiento.',
        'Jeśli podgrzewacz może pracować tylko przez część doby, resztę musi pokryć zasobnik. Średnia moc rośnie do (energia dobowa + straty)/godziny, a deficyt rośnie z każdą godziną bez grzania.') },
    heatpump: { title: T7('Heat pump and booster', 'Тепловий насос і догрівач', 'Wärmepumpe und Nachheizung', 'Warmtepomp en naverwarming', 'Pompe à chaleur et appoint', 'Bomba de calor y apoyo', 'Pompa ciepła i dogrzewacz'),
      body: T7('A heat pump heats efficiently only up to its maximum outlet temperature. The booster supplies the share (T_store − T_hp)/(T_store − T_cold) of every stored kWh; the effective power is limited by whichever of the two runs out first. Without a booster the store stays at the heat-pump limit.',
        'Тепловий насос ефективно гріє лише до своєї максимальної температури подачі. Догрівач дає частку (T_бак − T_тн)/(T_бак − T_хол) кожної накопиченої кВт·год; ефективну потужність обмежує той із двох, що вичерпається першим. Без догрівача бак лишається на межі теплового насоса.',
        'Eine Wärmepumpe heizt effizient nur bis zu ihrer maximalen Vorlauftemperatur. Die Nachheizung liefert den Anteil (T_Sp − T_WP)/(T_Sp − T_kalt) jeder gespeicherten kWh; die wirksame Leistung begrenzt, wer von beiden zuerst nicht mehr reicht. Ohne Nachheizung bleibt der Speicher auf der Wärmepumpengrenze.',
        'Een warmtepomp verwarmt efficiënt tot haar maximale aanvoertemperatuur. De naverwarming levert het aandeel (T_vat − T_wp)/(T_vat − T_koud) van elke opgeslagen kWh; het effectieve vermogen wordt begrensd door wie van beide het eerst tekortschiet. Zonder naverwarming blijft het vat op de warmtepompgrens.',
        'Une PAC chauffe efficacement seulement jusqu\'à sa température maximale de sortie. L\'appoint fournit la part (T_ballon − T_pac)/(T_ballon − T_froide) de chaque kWh stocké ; la puissance effective est limitée par celui des deux qui s\'épuise d\'abord. Sans appoint, le ballon reste à la limite de la PAC.',
        'Una bomba de calor calienta con eficiencia solo hasta su temperatura máxima de salida. El apoyo aporta la fracción (T_acum − T_bc)/(T_acum − T_fría) de cada kWh acumulado; la potencia efectiva la limita el que antes se quede corto. Sin apoyo, el acumulador se queda en el límite de la bomba.',
        'Pompa ciepła grzeje wydajnie tylko do swojej maksymalnej temperatury zasilania. Dogrzewacz daje udział (T_zas − T_pc)/(T_zas − T_zimna) każdej zmagazynowanej kWh; efektywną moc ogranicza ten z dwóch, który pierwszy nie nadąża. Bez dogrzewacza zasobnik pozostaje na granicy pompy ciepła.') },
    losses: { title: T7('Standing and circulation losses', 'Втрати очікування і циркуляції', 'Bereitschafts- und Zirkulationsverluste', 'Stilstands- en circulatieverliezen', 'Pertes statiques et de bouclage', 'Pérdidas estáticas y de recirculación', 'Straty postojowe i cyrkulacji'),
      body: T7('The store loses heat all day: by default the EU Ecodesign limit S = 16.66 + 8.33·V^0.4 W (Regulation 814/2013, at 45 K), scaled to your set point; a real product may be better. A circulation loop adds its own loss. Where little water is drawn, the losses can exceed the draw.',
        'Бак втрачає тепло цілу добу: за замовчуванням — межа ЄС Ecodesign S = 16,66 + 8,33·V^0,4 Вт (Регламент 814/2013, при 45 К), перерахована на вашу уставку; реальний виріб може бути кращим. Циркуляційний контур додає свої втрати. Де води розбирають мало, втрати можуть перевищити водорозбір.',
        'Der Speicher verliert den ganzen Tag Wärme: standardmäßig der EU-Ecodesign-Grenzwert S = 16,66 + 8,33·V^0,4 W (Verordnung 814/2013, bei 45 K), auf Ihren Sollwert umgerechnet; ein reales Produkt kann besser sein. Eine Zirkulation fügt ihren eigenen Verlust hinzu. Wo wenig gezapft wird, können die Verluste die Zapfung übersteigen.',
        'Het vat verliest de hele dag warmte: standaard de EU-Ecodesign-grens S = 16,66 + 8,33·V^0,4 W (Verordening 814/2013, bij 45 K), omgerekend naar uw insteltemperatuur; een echt product kan beter zijn. Een circulatieleiding voegt haar eigen verlies toe. Waar weinig getapt wordt, kunnen de verliezen het tappen overtreffen.',
        'Le ballon perd de la chaleur toute la journée : par défaut la limite Ecodesign de l\'UE S = 16,66 + 8,33·V^0,4 W (règlement 814/2013, à 45 K), ramenée à votre consigne ; un produit réel peut faire mieux. Une boucle ajoute ses propres pertes. Là où l\'on puise peu, les pertes peuvent dépasser le puisage.',
        'El acumulador pierde calor todo el día: por defecto el límite Ecodesign de la UE S = 16,66 + 8,33·V^0,4 W (Reglamento 814/2013, a 45 K), escalado a su consigna; un producto real puede ser mejor. Un bucle de recirculación añade sus propias pérdidas. Donde se consume poco, las pérdidas pueden superar el consumo.',
        'Zasobnik traci ciepło przez całą dobę: domyślnie limit UE Ecodesign S = 16,66 + 8,33·V^0,4 W (rozporządzenie 814/2013, przy 45 K), przeliczony na Twoją nastawę; rzeczywisty wyrób może być lepszy. Pętla cyrkulacji dodaje własne straty. Tam, gdzie pobór jest mały, straty mogą przewyższyć pobór.') },
    reheat: { title: T7('Reheat time', 'Час нагріву', 'Aufheizzeit', 'Opwarmtijd', 'Temps de réchauffage', 'Tiempo de recalentamiento', 'Czas nagrzewania'),
      body: T7('From cold water to the set point with the heater minus the losses: t = V·1.163·(T_store − T_cold)/1000/(P − P_L). It tells how long the building waits after the store has been emptied, e.g. after a thermal disinfection or a fault.',
        'Від холодної води до уставки потужністю нагрівача мінус втрати: t = V·1,163·(T_бак − T_хол)/1000/(P − P_L). Показує, скільки чекатиме будівля після спорожнення бака, напр. після термодезінфекції чи аварії.',
        'Von Kaltwasser auf den Sollwert mit der Erzeugerleistung abzüglich Verluste: t = V·1,163·(T_Sp − T_kalt)/1000/(P − P_L). Zeigt, wie lange das Gebäude nach dem Leeren des Speichers wartet, z. B. nach einer thermischen Desinfektion oder Störung.',
        'Van koud water naar de insteltemperatuur met het toestelvermogen min de verliezen: t = V·1,163·(T_vat − T_koud)/1000/(P − P_L). Het zegt hoe lang het gebouw wacht nadat het vat leeg is, bv. na een thermische desinfectie of een storing.',
        'De l\'eau froide à la consigne avec la puissance moins les pertes : t = V·1,163·(T_ballon − T_froide)/1000/(P − P_L). Il dit combien de temps le bâtiment attend après la vidange du ballon, p. ex. après une désinfection thermique ou une panne.',
        'Del agua fría a la consigna con la potencia menos las pérdidas: t = V·1,163·(T_acum − T_fría)/1000/(P − P_L). Indica cuánto espera el edificio tras vaciarse el acumulador, p. ej. después de una desinfección térmica o una avería.',
        'Od wody zimnej do nastawy mocą podgrzewacza minus straty: t = V·1,163·(T_zas − T_zimna)/1000/(P − P_L). Mówi, jak długo budynek czeka po opróżnieniu zasobnika, np. po dezynfekcji termicznej lub awarii.') },
    mixing: { title: T7('Mixing: why 60 °C stores more', 'Змішування: чому 60 °C вміщує більше', 'Mischen: warum 60 °C mehr speichert', 'Mengen: waarom 60 °C meer opslaat', 'Mitigeage : pourquoi 60 °C stocke plus', 'Mezcla: por qué 60 °C almacena más', 'Mieszanie: dlaczego 60 °C mieści więcej'),
      body: T7('One litre at 60 °C mixed with cold water at 10 °C gives 50/30 ≈ 1.7 L at 40 °C. A hotter store holds more usable water per litre of volume, and the usable share f accounts for the cold layer at the bottom.',
        'Один літр при 60 °C, змішаний з холодною водою 10 °C, дає 50/30 ≈ 1,7 л при 40 °C. Гарячіший бак містить більше корисної води на літр об\'єму, а корисна частка f враховує холодний шар унизу.',
        'Ein Liter mit 60 °C ergibt mit Kaltwasser von 10 °C gemischt 50/30 ≈ 1,7 L mit 40 °C. Ein heißerer Speicher hält mehr nutzbares Wasser je Liter Volumen; der nutzbare Anteil f berücksichtigt die kalte Schicht unten.',
        'Eén liter van 60 °C gemengd met koud water van 10 °C geeft 50/30 ≈ 1,7 L van 40 °C. Een warmer vat bevat meer bruikbaar water per liter volume; het bruikbare aandeel f houdt rekening met de koude laag onderaan.',
        'Un litre à 60 °C mélangé à de l\'eau froide à 10 °C donne 50/30 ≈ 1,7 L à 40 °C. Un ballon plus chaud contient plus d\'eau utile par litre de volume, et la part utile f tient compte de la couche froide du bas.',
        'Un litro a 60 °C mezclado con agua fría a 10 °C da 50/30 ≈ 1,7 L a 40 °C. Un acumulador más caliente guarda más agua útil por litro de volumen, y la fracción útil f tiene en cuenta la capa fría del fondo.',
        'Litr wody o 60 °C zmieszany z wodą zimną 10 °C daje 50/30 ≈ 1,7 L o 40 °C. Cieplejszy zasobnik mieści więcej wody użytkowej na litr pojemności, a udział użyteczny f uwzględnia zimną warstwę na dole.') },
    legionella: { title: T7('Why 60 °C', 'Чому 60 °C', 'Warum 60 °C', 'Waarom 60 °C', 'Pourquoi 60 °C', 'Por qué 60 °C', 'Dlaczego 60 °C'),
      body: T7('Legionella multiplies between about 25 and 50 °C. HSG274 Part 2 and DVGW W 551 ask for at least 60 °C in the store or at the heater outlet; in Flanders the Legionellabesluit (2007) requires high-risk establishments (care, hospitals, hotels and others) to manage temperatures in a written plan. DVGW W 551 counts a store above 400 L or more than 3 L in one pipe run as a large installation — except in one- and two-family houses, which are always small installations (tick the box). Regional rules may be stricter — check them; the Legionella Risk tool goes further.',
        'Легіонела розмножується приблизно між 25 і 50 °C. HSG274 Part 2 і DVGW W 551 вимагають щонайменше 60 °C у баку або на виході нагрівача; у Фландрії Legionellabesluit (2007) зобов\'язує заклади високого ризику (догляд, лікарні, готелі та інші) керувати температурами за письмовим планом. DVGW W 551 вважає великою установкою бак понад 400 л або понад 3 л в одній ділянці труби — крім одно- й двосімейних будинків, які завжди є малими установками (позначте прапорець). Регіональні правила можуть бути суворішими — перевірте їх; інструмент ризику легіонели йде далі.',
        'Legionellen vermehren sich etwa zwischen 25 und 50 °C. HSG274 Part 2 und DVGW W 551 verlangen mindestens 60 °C im Speicher oder am Erzeugeraustritt; in Flandern verlangt der Legionellabesluit (2007) von Hochrisikoeinrichtungen (Pflege, Krankenhäuser, Hotels u. a.) ein schriftliches Beherrschungskonzept mit Temperaturen. DVGW W 551 zählt einen Speicher über 400 L oder mehr als 3 L in einem Leitungsstrang als Großanlage — außer in Ein- und Zweifamilienhäusern, die immer Kleinanlagen sind (Kästchen ankreuzen). Regionale Regeln können strenger sein — prüfen; das Legionellenwerkzeug geht weiter.',
        'Legionella vermenigvuldigt zich ongeveer tussen 25 en 50 °C. HSG274 Part 2 en DVGW W 551 vragen minstens 60 °C in het vat of aan de uitgang van het toestel; in Vlaanderen verplicht het Legionellabesluit (2007) risico-inrichtingen (zorg, ziekenhuizen, hotels en andere) de temperaturen te beheersen in een schriftelijk beheersplan. DVGW W 551 rekent een vat boven 400 L of meer dan 3 L in één leiding tot de grote installaties — behalve in één- en tweegezinswoningen, die altijd kleine installaties zijn (vink het vakje aan). Regionale regels kunnen strenger zijn — controleer ze; de legionellatool gaat verder.',
        'Les légionelles se multiplient entre environ 25 et 50 °C. HSG274 Part 2 et DVGW W 551 demandent au moins 60 °C dans le ballon ou à la sortie du générateur ; en Flandre le Legionellabesluit (2007) impose aux établissements à risque (soins, hôpitaux, hôtels et autres) de gérer les températures dans un plan écrit. La DVGW W 551 classe en grande installation un ballon de plus de 400 L ou plus de 3 L dans une conduite — sauf dans les maisons individuelles et bifamiliales, qui sont toujours de petites installations (cochez la case). Les règles régionales peuvent être plus strictes — vérifiez-les ; l\'outil légionelle va plus loin.',
        'La legionela se multiplica aproximadamente entre 25 y 50 °C. HSG274 Part 2 y DVGW W 551 piden al menos 60 °C en el acumulador o a la salida del generador; en Flandes el Legionellabesluit (2007) obliga a los establecimientos de riesgo (cuidados, hospitales, hoteles y otros) a gestionar las temperaturas en un plan escrito. La DVGW W 551 considera instalación grande un acumulador de más de 400 L o más de 3 L en un tramo de tubería, salvo en viviendas unifamiliares y bifamiliares, que siempre son instalaciones pequeñas (marque la casilla). Las normas regionales pueden ser más estrictas: compruébelas; la herramienta de legionela va más allá.',
        'Legionella namnaża się mniej więcej między 25 a 50 °C. HSG274 Part 2 i DVGW W 551 wymagają co najmniej 60 °C w zasobniku lub na wyjściu podgrzewacza; we Flandrii Legionellabesluit (2007) nakłada na obiekty wysokiego ryzyka (opieka, szpitale, hotele i inne) obowiązek pisemnego planu zarządzania temperaturami. DVGW W 551 uznaje za dużą instalację zasobnik ponad 400 L lub ponad 3 L w jednym odcinku przewodu — z wyjątkiem domów jedno- i dwurodzinnych, które zawsze są małymi instalacjami (zaznacz pole). Przepisy regionalne mogą być surowsze — sprawdź je; narzędzie ryzyka legionelli idzie dalej.') }
  },
  tour: [{ topic: 'profile', focus: '[data-dgu-field="f-type"]' }, { topic: 'curve', focus: '.dgu-stage' }, { topic: 'instant', focus: '[data-dgu-field="f-q-peak-lps"]' },
         { topic: 'window', focus: '[data-dgu-field="f-win-start"]' }, { topic: 'heatpump', focus: '[data-dgu-field="f-heater"]' }, { topic: 'losses', focus: '.dgu-r-results' }, { topic: 'legionella' }] };

function examples() {
  return PRESET_IDS.map(function (k) { return { id: k, label: PL[k][0], note: PL[k][1], apply: function (t) { var s = presetState(k); Object.keys(t).forEach(function (x) { delete t[x]; }); Object.assign(t, s); note = '';
