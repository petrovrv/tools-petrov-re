  "description": {
    "en": "For the commercial evaluation of a tender (client side): each line of the price schedule is checked (quantity × unit price against the stated amount) and every correction is logged next to the original; Belgian KB 18.04.2017 art. 34 has no general 'unit price prevails' rule, so the evaluator decides per line which figure reflects the bidder's intention, with a tender-wide fallback. Missing prices are filled with P = L·Y/X (art. 86 §2) or the offer is set aside; required and permitted options always count, free options only when included (art. 87 §1). Rebates and exchange rates bring every bid to the evaluation currency, delivery stages missing from the bid's Incoterms 2020 rule are added at the bidder's logistics cost (with import duty on the customs value), and advances and retentions are priced at the client's cost of money. The ranked table, the correction log and a project file go to the award-criteria and life-cycle-cost tools.",
    "uk": "Для комерційної оцінки тендеру (сторона замовника): кожен рядок цінової таблиці перевіряється (кількість × ціна за одиницю проти зазначеної суми), кожне виправлення записується поруч з оригіналом; бельгійський KB 18.04.2017, ст. 34, не містить загального правила «ціна за одиницю переважає», тож оцінювач вирішує для кожного рядка, яка цифра відображає намір учасника, із загальним правилом за замовчуванням. Відсутні ціни заповнюються за P = L·Y/X (ст. 86 §2) або пропозиція відхиляється; обов’язкові та дозволені опції враховуються завжди, вільні — лише якщо їх включено (ст. 87 §1). Знижки та курси приводять кожну пропозицію до валюти оцінки, етапи поставки, яких немає в правилі Incoterms 2020 пропозиції, додаються за логістичною вартістю учасника (з митом на митну вартість), аванси та утримання оцінюються за вартістю грошей замовника. Ранжована таблиця, журнал виправлень і файл проєкту передаються в інструменти критеріїв присудження та вартості життєвого циклу.",

    "nl": "Voor de commerciële beoordeling van een aanbesteding (kant van de aanbestedende overheid): elke post van de inventaris wordt nagerekend (hoeveelheid × eenheidsprijs tegenover het opgegeven bedrag) en elke verbetering wordt naast het origineel geregistreerd; het Belgische KB 18.04.2017 art. 34 kent geen algemene regel ‘de eenheidsprijs primeert’, dus beslist de beoordelaar per post welk cijfer de werkelijke bedoeling van de inschrijver weergeeft, met een terugvalregel voor de hele opdracht. Ontbrekende prijzen worden aangevuld met P = L·Y/X (art. 86 §2) of de offerte wordt geweerd; vereiste en toegestane opties tellen altijd mee, vrije opties alleen als ze worden opgenomen (art. 87 §1). Kortingen en wisselkoersen brengen elke offerte naar de beoordelingsmunt, leveringsstappen die de Incoterms 2020-regel van de offerte niet dekt worden toegevoegd tegen de logistieke kost van de inschrijver (met invoerrechten op de douanewaarde), en voorschotten en inhoudingen worden gewaardeerd tegen de kapitaalkost van de aanbestedende overheid. De gerangschikte tabel, het verbeteringslogboek en een projectbestand gaan naar de tools voor gunningscriteria en levenscycluskosten.",
    "fr": "Pour l’évaluation commerciale d’un marché (côté pouvoir adjudicateur) : chaque poste de l’inventaire est vérifié (quantité × prix unitaire face au montant indiqué) et chaque correction est consignée à côté de l’original ; l’AR belge du 18.04.2017, art. 34, ne contient pas de règle générale « le prix unitaire prévaut », l’évaluateur décide donc poste par poste quel chiffre reflète l’intention du soumissionnaire, avec une règle par défaut pour tout le marché. Les prix manquants sont complétés par P = L·Y/X (art. 86 §2) ou l’offre est écartée ; les options exigées et autorisées comptent toujours, les options libres seulement si elles sont retenues (art. 87 §1). Rabais et taux de change ramènent chaque offre à la devise d’évaluation, les étapes de livraison non couvertes par la règle Incoterms 2020 de l’offre sont ajoutées au coût logistique du soumissionnaire (avec droits d’importation sur la valeur en douane), et avances et retenues sont valorisées au coût de l’argent du pouvoir adjudicateur. Le classement, le journal des corrections et un fichier projet alimentent les outils de critères d’attribution et de coût du cycle de vie.",
    "es": "Para la evaluación económica de una licitación (lado del poder adjudicador): cada partida del presupuesto se comprueba (cantidad × precio unitario frente al importe indicado) y cada corrección queda registrada junto al original; el KB belga de 18.04.2017, art. 34, no contiene una regla general de «prevalece el precio unitario», así que el evaluador decide por partida qué cifra refleja la intención del licitador, con una regla por defecto para toda la licitación. Los precios omitidos se completan con P = L·Y/X (art. 86 §2) o la oferta se descarta; las opciones exigidas y permitidas cuentan siempre, las libres solo si se incluyen (art. 87 §1). Descuentos y tipos de cambio llevan cada oferta a la divisa de evaluación, las etapas de entrega que no cubre la regla Incoterms 2020 de la oferta se añaden al coste logístico del licitador (con aranceles sobre el valor en aduana), y anticipos y retenciones se valoran al coste del dinero del poder adjudicador. La tabla ordenada, el registro de correcciones y un archivo de proyecto pasan a las herramientas de criterios de adjudicación y de coste del ciclo de vida.",

<script>
(function () {
  'use strict';

  /* ============================================================ 1. the model */
  var TOOL = 'bidnormalize';
  function lib() { return window.TndBidNorm || null; }
  function core() { return window.TndCore || null; }

  /* state: amounts in each bid's own currency, percentages in % (engine uses fractions) */
  var DEFAULTS = {
    cur: 'EUR', rate: 3, T: 10, ref: 'DAP', refDays: 30, arith: 'unit', missing: 'fill', priceOnly: false,
    items: [
      { id: '01', desc: 'Lump-sum works', unit: 'FF', qty: 1, kind: 'base', up: null, include: true },
      { id: '02', desc: 'Measured item', unit: 'm', qty: 100, kind: 'base', up: null, include: true }
    ],
    bids: [
      { id: 'B1', name: 'Bidder 1', currency: 'EUR', fx: 1, readout: null, rebate: 0, incoterm: 'DAP', duty: 0, tech: 'pass', adv: 0, ret: 0, retM: 0, days: 30 },
      { id: 'B2', name: 'Bidder 2', currency: 'EUR', fx: 1, readout: null, rebate: 0, incoterm: 'DAP', duty: 0, tech: 'pass', adv: 0, ret: 0, retM: 0, days: 30 }
    ],
    lines: [
      { bid: 'B1', item: '01', up: 50000, amount: 50000, decision: 'auto' }, { bid: 'B1', item: '02', up: 120, amount: 12000, decision: 'auto' },
      { bid: 'B2', item: '01', up: 47000, amount: 47000, decision: 'auto' }, { bid: 'B2', item: '02', up: 150, amount: 15000, decision: 'auto' }
    ],
    logistics: [],
    tenderRef: '', evaluator: ''
  };
  var state = JSON.parse(JSON.stringify(DEFAULTS));
  var last = null;

  function n(v) { return typeof v === 'number' && isFinite(v) ? v : null; }
  function engineInput(s) {
    var pc = function (v) { return n(v) == null ? 0 : v / 100; };
    return {
      cur: s.cur, rate: pc(s.rate), T: n(s.T) || 0, ref: s.ref, refDays: n(s.refDays) == null ? 30 : s.refDays, arith: s.arith, missing: s.missing, priceOnly: !!s.priceOnly,
      items: (s.items || []).map(function (it) { return { id: String(it.id || '').trim(), desc: it.desc, unit: it.unit, qty: n(it.qty), kind: it.kind, up: n(it.up), include: !!it.include }; }),
      bids: (s.bids || []).map(function (b) {
        return { id: String(b.id || '').trim(), name: b.name, currency: b.currency, fx: n(b.fx) == null ? 1 : b.fx, readout: n(b.readout), rebate: pc(b.rebate),
                 incoterm: b.incoterm, duty: pc(b.duty), tech: b.tech, payment: { adv: pc(b.adv), ret: pc(b.ret), retM: n(b.retM) || 0, days: n(b.days) == null ? 30 : b.days } };
      }),
      lines: (s.lines || []).map(function (l) { return { bid: String(l.bid || ''), item: String(l.item || ''), up: n(l.up), amount: n(l.amount), decision: l.decision || 'auto' }; }),
      logistics: (s.logistics || []).map(function (x) { return { bid: String(x.bid || ''), el: x.el, amount: n(x.amount) }; })
    };
  }
  function solve(s) {
    var L = lib();
    if (!L) return { ok: false, errors: ['engine'] };
    try { return L.normalize(engineInput(s)); } catch (e) { return { ok: false, errors: ['exception'], msg: String(e && e.message || e) }; }
  }

  /* ======================================================== 2. the interface */
  function T(en, uk, de, nl, fr, es, pl) { return { en: en, uk: uk, de: de, nl: nl, fr: fr, es: es, pl: pl }; }
  var LANGS = ['en', 'uk', 'de', 'nl', 'fr', 'es', 'pl'];
  function TF(fn) { var o = {}; LANGS.forEach(function (l) { o[l] = fn(l); }); return o; }
  function lang() { try { var l = window.DiagramUI && DiagramUI.domainLang ? DiagramUI.domainLang() : 'en'; return LANGS.indexOf(l) >= 0 ? l : 'en'; } catch (e) { return 'en'; } }
  function money(v, l, cur) {
    if (v == null || !isFinite(v)) return '—';
    var C = core(); cur = cur || state.cur || 'EUR';
    if (C && C.money) return C.money(v, cur, l, 0);
    return Math.round(v).toLocaleString() + ' ' + cur;
  }
  function signed(v, l, cur) { if (v == null || !isFinite(v)) return '—'; if (Math.abs(v) < 0.5) return '0'; return (v > 0 ? '+' : '') + money(v, l, cur); }
  function pct(v, l, d) { if (v == null || !isFinite(v)) return '—'; var C = core(); return C && C.pct ? C.pct(v, l, d == null ? 1 : d) : (Math.round(v * 1000) / 10) + ' %'; }
  function num(v, l, d) { if (v == null || !isFinite(v)) return '—'; var C = core(); return C && C.fmt ? C.fmt(v, l, d == null ? 2 : d) : String(v); }

  var S = {
    subtitle: T('What does each bid really cost, apples to apples?', 'Скільки насправді коштує кожна пропозиція, якщо порівнювати однакове?', 'Was kostet jedes Angebot wirklich, bei gleichem Umfang?', 'Wat kost elke offerte werkelijk, appels met appels?', 'Que coûte réellement chaque offre, à périmètre égal ?', '¿Cuánto cuesta realmente cada oferta, comparando lo mismo?', 'Ile naprawdę kosztuje każda oferta przy tym samym zakresie?'),

    priceOnlyHint: T('KB 18.04.2017 art. 48 §3: no extra price for free or permitted options; a priced one is disregarded (art. 87 §1 al. 4)', 'KB 18.04.2017, ст. 48 §3: вільні та дозволені опції без доплати; опцію з доплатою не враховують (ст. 87 §1, абз. 4)', 'KB 18.04.2017 Art. 48 §3: kein Mehrpreis für freie oder zugelassene Optionen; eine bepreiste bleibt außer Betracht (Art. 87 §1 Abs. 4)', 'KB 18.04.2017 art. 48 §3: geen meerprijs voor vrije of toegestane opties; een geprijsde wordt buiten beschouwing gelaten (art. 87 §1, 4e lid)', 'AR 18.04.2017, art. 48 §3 : aucun supplément pour les options libres ou autorisées ; une option chiffrée est écartée (art. 87 §1, al. 4)', 'KB 18.04.2017, art. 48 §3: sin sobreprecio en opciones libres o permitidas; la que lo lleve se descarta (art. 87 §1, párr. 4)', 'KB 18.04.2017 art. 48 §3: bez dopłaty za opcje dowolne lub dopuszczone; opcję z ceną się pomija (art. 87 §1 ust. 4)'),
    w48: T('free or permitted options with an extra price were disregarded (KB 18.04.2017 art. 48 §3, art. 87 §1 al. 4). If the option cannot be separated from the offer, the offer is irregular under art. 76 — the tool cannot judge that.', 'вільні або дозволені опції з доплатою не враховано (KB 18.04.2017, ст. 48 §3, ст. 87 §1, абз. 4). Якщо опцію не можна відокремити від пропозиції, пропозиція неправильна за ст. 76 — цього інструмент не оцінює.', 'freie oder zugelassene Optionen mit Mehrpreis bleiben außer Betracht (KB 18.04.2017 Art. 48 §3, Art. 87 §1 Abs. 4). Lässt sich die Option nicht vom Angebot trennen, ist das Angebot nach Art. 76 zu beurteilen — das kann das Werkzeug nicht.', 'vrije of toegestane opties met meerprijs werden buiten beschouwing gelaten (KB 18.04.2017 art. 48 §3, art. 87 §1, 4e lid). Kan de optie niet van de offerte worden gescheiden, dan is de offerte onregelmatig volgens art. 76 — dat beoordeelt de tool niet.', 'des options libres ou autorisées avec supplément ont été écartées (AR 18.04.2017, art. 48 §3, art. 87 §1, al. 4). Si l’option ne peut être séparée de l’offre, l’offre est irrégulière au sens de l’art. 76 — l’outil ne peut en juger.', 'se descartaron opciones libres o permitidas con sobreprecio (KB 18.04.2017, art. 48 §3, art. 87 §1, párr. 4). Si la opción no puede separarse de la oferta, esta es irregular según el art. 76 — la herramienta no lo juzga.', 'pominięto opcje dowolne lub dopuszczone z dopłatą (KB 18.04.2017 art. 48 §3, art. 87 §1 ust. 4). Jeśli opcji nie da się oddzielić od oferty, oferta jest nieprawidłowa wg art. 76 — tego narzędzie nie ocenia.'),
    wNoDonor: T('no ranked bid priced this item, so art. 86 §2 cannot fill it; it is left out of the comparison for every bid (tool rule).', 'жодна ранжована пропозиція не оцінила цю позицію, тож ст. 86 §2 не може її заповнити; позицію вилучено з порівняння для всіх (правило інструмента).', 'kein gewertetes Angebot hat diese Position bepreist, Art. 86 §2 kann sie nicht ergänzen; sie bleibt für alle Angebote außerhalb des Vergleichs (Regel des Werkzeugs).', 'geen gerangschikte offerte prijsde deze post, dus art. 86 §2 kan hem niet aanvullen; hij blijft voor alle offertes buiten de vergelijking (regel van de tool).', 'aucune offre classée n’a chiffré ce poste, l’art. 86 §2 ne peut le compléter ; il est retiré de la comparaison pour toutes les offres (règle de l’outil).', 'ninguna oferta clasificada valoró esta partida, el art. 86 §2 no puede completarla; queda fuera de la comparación para todas (regla de la herramienta).', 'żadna oceniana oferta nie wyceniła tej pozycji, więc art. 86 §2 nie pozwala jej uzupełnić; pozycję pominięto w porównaniu dla wszystkich ofert (reguła narzędzia).'),
    wDonorBlank: T('some bids used for L and X left items blank themselves; their totals are lower, so X is lower and the filled price higher. Art. 86 §2 is silent on this — check the fill, or treat the omission as irregular.', 'деякі пропозиції, взяті для L і X, самі мають пропуски; їхні підсумки менші, тож X менше, а заповнена ціна більша. Ст. 86 §2 про це мовчить — перевірте заповнення або визнайте пропуск неправильністю.', 'einige für L und X verwendete Angebote haben selbst Lücken; ihre Summen sind kleiner, X kleiner und der ergänzte Preis höher. Art. 86 §2 schweigt dazu — Ergänzung prüfen oder die Lücke als nicht ordnungsgemäß behandeln.', 'sommige offertes die voor L en X dienen, hebben zelf lege posten; hun totaal is lager, dus X lager en de aangevulde prijs hoger. Art. 86 §2 zwijgt hierover — controleer de aanvulling of beschouw de leemte als onregelmatig.', 'certaines offres servant à L et X ont elles-mêmes des postes vides ; leurs totaux sont plus bas, donc X plus bas et le prix complété plus haut. L’art. 86 §2 est muet sur ce point — vérifiez le complément ou traitez l’omission comme irrégulière.', 'algunas ofertas usadas para L y X dejaron partidas en blanco; sus totales son menores, X menor y el precio completado mayor. El art. 86 §2 no dice nada — revise el completado o trate la omisión como irregular.', 'niektóre oferty użyte do L i X same mają puste pozycje; ich sumy są niższe, więc X niższe, a uzupełniona cena wyższa. Art. 86 §2 tego nie rozstrzyga — sprawdź uzupełnienie albo uznaj lukę za nieprawidłowość.'),
    wNeg: T('negative price or cost entered (allowed only for an explicit credit item):', 'введено від’ємну ціну чи витрату (допустимо лише для явної позиції-кредиту):', 'negativer Preis oder Kosten eingegeben (nur für eine ausdrückliche Gutschriftposition zulässig):', 'negatieve prijs of kost ingevoerd (alleen toegelaten voor een uitdrukkelijke creditpost):', 'prix ou coût négatif saisi (admis seulement pour un poste de crédit explicite) :', 'precio o coste negativo (solo admisible en una partida de abono explícita):', 'wprowadzono ujemną cenę lub koszt (dopuszczalne tylko dla wyraźnej pozycji uznania):'),

    noteArith: T('KB 18.04.2017 art. 34 §2 has no general rule that the unit price prevails: the contracting authority looks for the bidder’s real intention (overall analysis, comparison with the other offers and market prices) and may ask for clarification; only if the intention cannot be established may it apply the stated unit prices or set the offer aside as irregular.', 'KB 18.04.2017, ст. 34 §2, не містить загального правила про перевагу ціни за одиницю: замовник з’ясовує справжній намір учасника (загальний аналіз, порівняння з іншими пропозиціями та ринковими цінами) і може попросити роз’яснення; лише якщо намір встановити неможливо, він може застосувати зазначені ціни за одиницю або відхилити пропозицію як неправильну.', 'KB 18.04.2017 Art. 34 §2 kennt keine allgemeine Regel, dass der Einheitspreis vorgeht: der Auftraggeber ermittelt den wirklichen Willen des Bieters (Gesamtanalyse, Vergleich mit den anderen Angeboten und Marktpreisen) und kann Aufklärung verlangen; nur wenn der Wille nicht feststellbar ist, darf er die angegebenen Einheitspreise anwenden oder das Angebot als nicht ordnungsgemäß ausschließen.', 'KB 18.04.2017 art. 34 §2 kent geen algemene regel dat de eenheidsprijs primeert: de aanbestedende overheid zoekt de werkelijke bedoeling van de inschrijver (globale analyse, vergelijking met de andere offertes en de marktprijzen) en kan verduidelijking vragen; alleen als die bedoeling niet kan worden vastgesteld, mag ze de opgegeven eenheidsprijzen toepassen of de offerte als onregelmatig weren.', 'L’AR du 18.04.2017, art. 34 §2, ne prévoit pas de règle générale selon laquelle le prix unitaire prévaut : le pouvoir adjudicateur recherche l’intention réelle du soumissionnaire (analyse globale, comparaison avec les autres offres et les prix du marché) et peut demander des précisions ; ce n’est que si l’intention ne peut être établie qu’il peut appliquer les prix unitaires indiqués ou écarter l’offre comme irrégulière.', 'El KB de 18.04.2017, art. 34 §2, no establece que prevalezca en general el precio unitario: el poder adjudicador busca la intención real del licitador (análisis global, comparación con las demás ofertas y los precios de mercado) y puede pedir aclaraciones; solo si la intención no puede establecerse puede aplicar los precios unitarios indicados o descartar la oferta por irregular.', 'KB 18.04.2017 art. 34 §2 nie zawiera ogólnej reguły pierwszeństwa ceny jednostkowej: zamawiający ustala rzeczywisty zamiar wykonawcy (analiza całościowa, porównanie z innymi ofertami i cenami rynkowymi) i może zażądać wyjaśnień; dopiero gdy zamiaru nie da się ustalić, może zastosować podane ceny jednostkowe albo odrzucić ofertę jako nieprawidłową.'),

  function renderStage(size, st) {
    var ctx = st.canvas(), w = size.w, h = size.h, coarse = size.density === 'coarse';
    var cs = getComputedStyle(document.documentElement);
    var muted = cs.getPropertyValue('--muted').trim() || '#888', ink = cs.getPropertyValue('--ink').trim() || '#222';
    var font = cs.getPropertyValue('--font').trim() || 'sans-serif';
    ctx.clearRect(0, 0, w, h);
    if (!last || !last.ok) return;
    var R = last, l = lang();
    var list = R.bids.slice().sort(function (a, b) { if (a.ranked !== b.ranked) return a.ranked ? -1 : 1; return a.N - b.N; });
    if (!list.length) return;
    var vmax = 0;
    list.forEach(function (b) { vmax = Math.max(vmax, b.N, b.readoutEval); });
    if (!(vmax > 0)) return;
    var Lm = coarse ? 70 : 150, Rm = coarse ? 70 : 110, TOP = 8, B = 22, pw = w - Lm - Rm;
    var rowH = Math.max(18, Math.min(44, (h - TOP - B) / list.length)), bh = Math.max(6, rowH * 0.32);
    if (pw < 40) return;
    var col = DiagramUI.series(0), col1 = DiagramUI.series(1);
    ctx.font = (coarse ? 10 : 12) + 'px ' + font;
    function X(v) { return Lm + Math.max(0, v) / vmax * pw; }
    var xt = DiagramUI.ticks(0, vmax, pw, size.density) || [];
    ctx.strokeStyle = muted; ctx.globalAlpha = 0.25;
    xt.forEach(function (t) { var px = X(t); ctx.beginPath(); ctx.moveTo(px, TOP); ctx.lineTo(px, TOP + rowH * list.length); ctx.stroke(); });
    ctx.globalAlpha = 1; ctx.fillStyle = muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    xt.forEach(function (t, i) { if (coarse && i % 2) return; ctx.fillText(num(t / 1000, l, 0) + 'k', X(t), TOP + rowH * list.length + 4); });
    list.forEach(function (b, i) {
      var y = TOP + i * rowH + rowH / 2;
      ctx.fillStyle = b.ranked ? ink : muted; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      var lab = (b.ranked ? b.rank + '. ' : '× ') + (coarse ? b.id : (b.id + ' ' + b.name).slice(0, 22));
      ctx.fillText(lab, Lm - 6, y);
      ctx.globalAlpha = 0.35; ctx.fillStyle = col1; ctx.fillRect(Lm, y - bh - 1, X(b.readoutEval) - Lm, bh); ctx.globalAlpha = 1;
      ctx.fillStyle = b.ranked ? col : muted; ctx.fillRect(Lm, y + 1, X(b.N) - Lm, bh);
      ctx.fillStyle = muted; ctx.textAlign = 'left';
      ctx.fillText(money(b.N, l), Math.min(X(Math.max(b.N, b.readoutEval)) + 4, w - Rm + 4), y);
    });
  }

      aha: T('The Chinese FOB offer is 225 k€ cheaper at opening, but freight, insurance, on-carriage, duty and its 30 % advance make it third at DDP site; the German ex-works bid wins. (Import duty 1.7 % is a learning assumption — check TARIC for CN 8504 23 00.)', 'Китайська пропозиція FOB при розкритті дешевша на 225 тис. €, але фрахт, страхування, доставка, мито і 30 % авансу роблять її третьою на умовах DDP об’єкт; перемагає німецька пропозиція EXW. (Мито 1,7 % — навчальне припущення; перевірте TARIC для CN 8504 23 00.)', 'Das chinesische FOB-Angebot ist bei der Öffnung 225 T€ günstiger, doch Fracht, Versicherung, Nachlauf, Zoll und 30 % Anzahlung machen es bei DDP Baustelle zum Dritten; das deutsche Ab-Werk-Angebot gewinnt. (Einfuhrzoll 1,7 % ist eine Lernannahme — TARIC für KN 8504 23 00 prüfen.)', 'De Chinese FOB-offerte is bij de opening 225 k€ goedkoper, maar vracht, verzekering, natransport, invoerrechten en het voorschot van 30 % maken haar derde bij DDP werf; de Duitse af-fabriek-offerte wint. (Invoerrecht 1,7 % is een leeraanname — controleer TARIC voor GN 8504 23 00.)', 'L’offre chinoise FOB est 225 k€ moins chère à l’ouverture, mais fret, assurance, post-acheminement, droits et 30 % d’avance la placent troisième en DDP chantier ; l’offre allemande à l’usine l’emporte. (Droit d’importation de 1,7 % : hypothèse d’apprentissage — vérifier TARIC pour la NC 8504 23 00.)', 'La oferta china FOB es 225 k€ más barata en la apertura, pero flete, seguro, transporte final, arancel y su anticipo del 30 % la dejan tercera en DDP obra; gana la oferta alemana en fábrica. (Arancel del 1,7 %: supuesto didáctico — compruebe TARIC para la NC 8504 23 00.)', 'Chińska oferta FOB jest przy otwarciu tańsza o 225 tys. €, ale fracht, ubezpieczenie, dowóz, cło i 30 % zaliczki stawiają ją na trzecim miejscu przy DDP budowa; wygrywa niemiecka oferta EXW. (Cło 1,7 % to założenie szkoleniowe — sprawdź TARIC dla CN 8504 23 00.)') },
    'options-free': { label: T('Air-handling units, price only: required maintenance option and a priced free option', 'Припливно-витяжні установки, лише ціна: обов’язкова опція обслуговування та вільна опція з доплатою', 'Lüftungsgeräte, nur Preis: geforderte Wartungsoption und freie Option mit Mehrpreis', 'Luchtbehandelingskasten, enkel prijs: vereiste onderhoudsoptie en vrije optie met meerprijs', 'Centrales de traitement d’air, prix seul : option exigée de maintenance et option libre avec supplément', 'Climatizadoras, solo precio: opción exigida de mantenimiento y opción libre con sobreprecio', 'Centrale wentylacyjne, tylko cena: wymagana opcja serwisu i opcja dowolna z dopłatą'),

r adjudicador tiene en cuenta la opción libre de ventiladores EC, pero dos licitadores le pusieron sobreprecio — en una adjudicación solo por precio el art. 48 §3 lo prohíbe, así que se descarta (art. 87 §1, párr. 4) y ClimaSud sigue primera.', 'Wymagana opcja 5-letniego serwisu liczy się zawsze (art. 87): najniższa cena podstawowa (Ventilatie Noord) spada na trzecie miejsce. Zamawiający uwzględnia opcję dowolną wentylatorów EC, ale dwóch wykonawców doliczyło do niej dopłatę — przy wyborze wyłącznie według ceny art. 48 §3 tego zabrania, więc opcję się pomija (art. 87 §1 ust. 4) i ClimaSud pozostaje pierwsza.') },

  function presetState(id) {

    var pcx = function (v) { return Math.round((v || 0) * 1e8) / 1e6; };
    return {

      items: p.items.map(function (it) { var tr = PDESC[id + '/' + it.id]; return { id: it.id, desc: tr ? tr[lang()] : it.desc, unit: it.unit, qty: it.qty, kind: it.kind, up: it.up == null ? null : it.up, include: it.kind === 'free_option' ? !!it.include : true }; }),
      bids: p.bids.map(function (b) { var y = b.payment || {}; var tn = PNAME[id + '/' + b.id]; return { id: b.id, name: tn ? tn[lang()] : b.name, currency: b.currency, fx: b.fx, readout: b.readout, rebate: pcx(b.rebate), incoterm: b.incoterm, duty: pcx(b.duty), tech: b.tech, adv: pcx(y.adv), ret: pcx(y.ret), retM: y.retM || 0, days: y.days == null ? 30 : y.days }; }),
      lines: p.lines.filter(function (x) { return x.up != null || x.amount != null; }).map(function (x) { return { bid: x.bid, item: x.item, up: x.up, amount: x.amount, decision: x.decision || 'auto' }; }),
      logistics: p.logistics.map(function (x) { return { bid: x.bid, el: x.el, amount: x.amount }; })
    };

  function buildLearn() {

        title: T('Normalise first, then score', 'Спершу нормалізуйте, потім оцінюйте', 'Erst normieren, dann werten', 'Eerst normaliseren, dan scoren', 'Normaliser d’abord, noter ensuite', 'Primero normalizar, después puntuar', 'Najpierw normalizuj, potem oceniaj'),
        body: T('Stage 8 of the tender (commercial evaluation, client side). The amounts read out at the opening are not yet comparable: errors in the price schedule, missing prices, options, rebates, currencies, delivery terms and payment terms all move the real cost. Load an example, enter the items and each bid’s prices, decide the doubtful lines, and send the ranked normalised prices to price scoring (awardcriteria) or life-cycle costing (lccaward).',
                'Етап 8 тендеру (комерційна оцінка, сторона замовника). Суми, оголошені при розкритті, ще не можна порівнювати: помилки в ціновій таблиці, відсутні ціни, опції, знижки, валюти, умови поставки й оплати змінюють реальну вартість. Завантажте приклад, введіть позиції та ціни кожної пропозиції, вирішіть сумнівні рядки й передайте ранжовані нормалізовані ціни в оцінку ціни (awardcriteria) або вартість життєвого циклу (lccaward).',
                'Stufe 8 der Ausschreibung (kaufmännische Wertung, Auftraggeberseite). Die bei der Öffnung verlesenen Beträge sind noch nicht vergleichbar: Fehler im Leistungsverzeichnis, fehlende Preise, Optionen, Nachlässe, Währungen, Liefer- und Zahlungsbedingungen verschieben die wirklichen Kosten. Beispiel laden, Positionen und Preise jedes Angebots eingeben, zweifelhafte Positionen entscheiden und die gereihten normierten Preise an die Preiswertung (awardcriteria) oder die Lebenszykluskosten (lccaward) geben.',
                'Fase 8 van de aanbesteding (commerciële beoordeling, kant van de aanbestedende overheid). De bij de opening afgelezen bedragen zijn nog niet vergelijkbaar: fouten in de inventaris, ontbrekende prijzen, opties, kortingen, munten, leverings- en betalingsvoorwaarden verschuiven de werkelijke kost. Laad een voorbeeld, voer de posten en de prijzen van elke offerte in, beslis over de twijfelachtige posten en stuur de gerangschikte genormaliseerde prijzen naar de prijsscore (awardcriteria) of de levenscycluskost (lccaward).',
                'Étape 8 du marché (évaluation commerciale, côté pouvoir adjudicateur). Les montants lus à l’ouverture ne sont pas encore comparables : erreurs de l’inventaire, prix manquants, options, rabais, devises, conditions de livraison et de paiement modifient le coût réel. Chargez un exemple, saisissez les postes et les prix de chaque offre, tranchez les postes douteux et envoyez les prix normalisés classés vers la cotation du prix (awardcriteria) ou le coût du cycle de vie (lccaward).',

                'Etap 8 przetargu (ocena handlowa, strona zamawiającego). Kwoty odczytane przy otwarciu nie są jeszcze porównywalne: błędy w kosztorysie, brakujące ceny, opcje, rabaty, waluty, warunki dostawy i płatności zmieniają rzeczywisty koszt. Wczytaj przykład, wprowadź pozycje i ceny każdej oferty, rozstrzygnij wątpliwe pozycje i przekaż ranking cen znormalizowanych do punktacji ceny (awardcriteria) lub kosztu cyklu życia (lccaward).')
      },
      topics: {
        method: { title: T('The chain of adjustments', 'Ланцюжок коригувань', 'Die Kette der Korrekturen', 'De keten van correcties', 'La chaîne des ajustements', 'La cadena de ajustes', 'Łańcuch korekt'),
          body: T('Read-out amount → arithmetic correction → missing prices → options → rebate → exchange rate → delivery-term gap → payment terms = normalised price N. Each step is shown per bid in the ranking table, so the reader sees where a bid gained or lost.', 'Оголошена сума → арифметичне виправлення → відсутні ціни → опції → знижка → курс → різниця умов поставки → умови оплати = нормалізована ціна N. Кожен крок показано для кожної пропозиції в таблиці рейтингу, тож видно, де пропозиція виграла чи втратила.', 'Verlesener Betrag → rechnerische Korrektur → fehlende Preise → Optionen → Nachlass → Wechselkurs → Lieferlücke → Zahlungsbedingungen = normierter Preis N. Jeder Schritt steht je Angebot in der Rangliste, so sieht man, wo ein Angebot gewonnen oder verloren hat.', 'Afgelezen bedrag → rekenkundige verbetering → ontbrekende prijzen → opties → korting → wisselkoers → leveringsverschil → betalingsvoorwaarden = genormaliseerde prijs N. Elke stap staat per offerte in de rangschikking, zodat men ziet waar een offerte won of verloor.', 'Montant lu → correction arithmétique → prix manquants → options → rabais → change → écart de livraison → paiement = prix normalisé N. Chaque étape figure par offre dans le classement : on voit où une offre a gagné ou perdu.', 'Importe leído → corrección aritmética → precios omitidos → opciones → descuento → cambio → diferencia de entrega → pago = precio normalizado N. Cada paso figura por oferta en la clasificación, así se ve dónde ganó o perdió.', 'Kwota odczytana → poprawka rachunkowa → brakujące ceny → opcje → rabat → kurs → różnica dostawy → płatność = cena znormalizowana N. Każdy krok widać dla każdej oferty w rankingu, więc widać, gdzie oferta zyskała lub straciła.') },
        arith: { title: T('Arithmetic and material errors (art. 34)', 'Арифметичні та матеріальні помилки (ст. 34)', 'Rechen- und sachliche Fehler (Art. 34)', 'Reken- en materiële fouten (art. 34)', 'Erreurs arithmétiques et matérielles (art. 34)', 'Errores aritméticos y materiales (art. 34)', 'Błędy rachunkowe i materialne (art. 34)'),
          body: T('When quantity × unit price differs from the stated line amount, Belgian law (KB 18.04.2017 art. 34 §2) does not say which one wins. The authority must look for the real intention of the bidder — by an overall analysis of the offer and comparison with the other offers and market prices — and may ask for clarification. Only if the intention cannot be established may it apply the unit prices or treat the offer as irregular. Corrections must stay identifiable next to the original (§3). Set the decision per line; “auto” uses the fallback of the evaluation rules.', 'Якщо кількість × ціна за одиницю відрізняється від зазначеної суми рядка, бельгійське право (KB 18.04.2017, ст. 34 §2) не каже, що переважає. Замовник має з’ясувати справжній намір учасника — загальним аналізом пропозиції та порівнянням з іншими пропозиціями й ринковими цінами — і може попросити роз’яснення. Лише якщо намір встановити неможливо, він може застосувати ціни за одиницю або визнати пропозицію неправильною. Виправлення мають бути видні поруч з оригіналом (§3). Задайте рішення для кожного рядка; «авто» використовує правило за замовчуванням.', 'Weicht Menge × Einheitspreis vom angegebenen Positionsbetrag ab, sagt das belgische Recht (KB 18.04.2017 Art. 34 §2) nicht, was gilt. Der Auftraggeber muss den wirklichen Willen des Bieters ermitteln — durch Gesamtanalyse des Angebots und Vergleich mit den anderen Angeboten und Marktpreisen — und kann Aufklärung verlangen. Nur wenn der Wille nicht feststellbar ist, darf er die Einheitspreise anwenden oder das Angebot als nicht ordnungsgemäß behandeln. Korrekturen bleiben neben dem Original erkennbar (§3). Entscheidung je Position setzen; „auto“ nimmt die Ersatzregel.', 'Als hoeveelheid × eenheidsprijs verschilt van het opgegeven postbedrag, zegt het Belgische recht (KB 18.04.2017 art. 34 §2) niet welke voorgaat. De aanbestedende overheid moet de werkelijke bedoeling van de inschrijver zoeken — via een globale analyse van de offerte en vergelijking met de andere offertes en de marktprijzen — en kan verduidelijking vragen. Alleen als de bedoeling niet kan worden vastgesteld, mag ze de eenheidsprijzen toepassen of de offerte als onregelmatig beschouwen. Verbeteringen blijven herkenbaar naast het origineel (§3). Stel de beslissing per post in; “auto” gebruikt de terugvalregel.', 'Quand quantité × prix unitaire diffère du montant du poste, le droit belge (AR 18.04.2017, art. 34 §2) ne dit pas lequel prévaut. Le pouvoir adjudicateur recherche l’intention réelle du soumissionnaire — par une analyse globale de l’offre et la comparaison avec les autres offres et les prix du marché — et peut demander des précisions. Ce n’est que si l’intention ne peut être établie qu’il peut appliquer les prix unitaires ou tenir l’offre pour irrégulière. Les corrections restent identifiables à côté de l’original (§3). Fixez la décision par poste ; « auto » applique la règle par défaut.', 'Si cantidad × precio unitario difiere del importe indicado, el derecho belga (KB 18.04.2017, art. 34 §2) no dice cuál prevalece. El poder adjudicador debe buscar la intención real del licitador — con un análisis global de la oferta y la comparación con las demás ofertas y los precios de mercado — y puede pedir aclaraciones. Solo si no puede establecerla puede aplicar los precios unitarios o tratar la oferta como irregular. Las correcciones quedan identificables junto al original (§3). Fije la decisión por partida; «auto» usa la regla por defecto.', 'Gdy ilość × cena jednostkowa różni się od podanej wartości pozycji, prawo belgijskie (KB 18.04.2017 art. 34 §2) nie mówi, co ma pierwszeństwo. Zamawiający ustala rzeczywisty zamiar wykonawcy — analizą całej oferty i porównaniem z innymi ofertami i cenami rynkowymi — i może żądać wyjaśnień. Dopiero gdy zamiaru nie da się ustalić, może zastosować ceny jednostkowe albo uznać ofertę za nieprawidłową. Poprawki pozostają widoczne obok oryginału (§3). Ustal decyzję dla każdej pozycji; „auto” stosuje regułę domyślną.') },
        missing: { title: T('Missing prices (art. 86 §2)', 'Відсутні ціни (ст. 86 §2)', 'Fehlende Preise (Art. 86 §2)', 'Ontbrekende prijzen (art. 86 §2)', 'Prix manquants (art. 86 §2)', 'Precios omitidos (art. 86 §2)', 'Brakujące ceny (art. 86 §2)'),
          body: T('For comparing offers, an omitted price can be filled with P = L·Y/X: L is the mean price of that item in the other offers, Y the total of the omitting offer, X the mean total of the other offers without the items the omitting bidder left blank. This keeps the bidder’s own price level. Whether an omission makes the offer irregular instead is a question of the tender documents and the weight of the item — choose “irregular” to see the ranking without that bid. Y and X are totals of the whole comparison scope — base items, provisional sums and the options taken into account (our reading of “the total amount of the measurement or inventory”). An item that no ranked bid priced cannot be filled and leaves the comparison for all bids; if a bid used for L and X has blanks of its own, the page warns, because the article is silent.', 'Для порівняння пропозицій пропущену ціну можна заповнити як P = L·Y/X: L — середня ціна цієї позиції в інших пропозиціях, Y — підсумок пропозиції з пропуском, X — середній підсумок інших пропозицій без позицій, які учасник лишив порожніми. Так зберігається власний рівень цін учасника. Чи робить пропуск пропозицію неправильною — питання тендерної документації та ваги позиції; оберіть «неправильна», щоб побачити рейтинг без цієї пропозиції. Y і X — підсумки всього обсягу порівняння: основні позиції, резервні суми й опції, що враховуються (наше прочитання «загальної суми опису робіт чи інвентаря»). Позицію, яку не оцінила жодна ранжована пропозиція, заповнити неможливо, тож її вилучають з порівняння для всіх; якщо пропозиція, взята для L і X, сама має пропуски, сторінка попереджає, бо стаття про це мовчить.', 'Für den Angebotsvergleich kann ein fehlender Preis mit P = L·Y/X ergänzt werden: L ist der mittlere Preis dieser Position in den anderen Angeboten, Y die Summe des lückenhaften Angebots, X die mittlere Summe der anderen Angebote ohne die Positionen, die der Bieter leer ließ. So bleibt das Preisniveau des Bieters erhalten. Ob die Lücke das Angebot stattdessen nicht ordnungsgemäß macht, hängt von den Vergabeunterlagen und dem Gewicht der Position ab — „nicht ordnungsgemäß“ zeigt die Rangfolge ohne dieses Angebot. Y und X sind Summen des ganzen Vergleichsumfangs — Grundpositionen, vorgegebene Beträge und berücksichtigte Optionen (unsere Lesart von „Gesamtbetrag des Aufmaßes oder Inventars“). Eine Position, die kein gewertetes Angebot bepreist hat, ist nicht ergänzbar und fällt für alle Angebote aus dem Vergleich; hat ein für L und X verwendetes Angebot selbst Lücken, warnt die Seite, denn der Artikel schweigt dazu.', 'Voor de vergelijking van de offertes kan een ontbrekende prijs worden aangevuld met P = L·Y/X: L is de gemiddelde prijs van die post in de andere offertes, Y het totaal van de onvolledige offerte, X het gemiddelde totaal van de andere offertes zonder de posten die de inschrijver openliet. Zo blijft het eigen prijsniveau van de inschrijver behouden. Of de leemte de offerte onregelmatig maakt, hangt af van de opdrachtdocumenten en het gewicht van de post — kies “onregelmatig” om de rangschikking zonder die offerte te zien. Y en X zijn totalen van de hele vergelijkingsomvang — basisposten, te verantwoorden sommen en de opties die in aanmerking komen (onze lezing van “het totale bedrag van de opmeting of de inventaris”). Een post die geen enkele gerangschikte offerte prijsde, kan niet worden aangevuld en valt voor alle offertes uit de vergelijking; heeft een offerte die voor L en X dient zelf lege posten, dan waarschuwt de pagina, want het artikel zwijgt daarover.', 'Pour comparer les offres, un prix omis peut être complété par P = L·Y/X : L est le prix moyen du poste dans les autres offres, Y le total de l’offre lacunaire, X le total moyen des autres offres hors postes laissés en blanc par ce soumissionnaire. Le niveau de prix propre du soumissionnaire est ainsi conservé. Savoir si l’omission rend plutôt l’offre irrégulière dépend des documents du marché et du poids du poste — choisissez « irrégulière » pour voir le classement sans cette offre. Y et X sont des totaux de tout le périmètre comparé — postes de base, sommes à justifier et options prises en compte (notre lecture du « montant total du métré ou de l’inventaire »). Un poste qu’aucune offre classée n’a chiffré ne peut être complété et sort de la comparaison pour toutes les offres ; si une offre servant à L et X a elle-même des postes vides, la page avertit, car l’article est muet.', 'Para comparar ofertas, un precio omitido puede completarse con P = L·Y/X: L es el precio medio de la partida en las demás ofertas, Y el total de la oferta incompleta, X el total medio de las demás sin las partidas que ese licitador dejó en blanco. Así se mantiene el nivel de precios propio del licitador. Si la omisión hace la oferta irregular depende de los pliegos y del peso de la partida — elija «irregular» para ver la clasificación sin esa oferta. Y y X son totales de todo el alcance comparado — partidas base, partidas a justificar y opciones tenidas en cuenta (nuestra lectura de «importe total de la medición o inventario»). Una partida que ninguna oferta clasificada valoró no puede completarse y sale de la comparación para todas; si una oferta usada para L y X tiene sus propios huecos, la página avisa, porque el artículo no dice nada.', 'Do porównania ofert brakującą cenę można uzupełnić wzorem P = L·Y/X: L to średnia cena tej pozycji w pozostałych ofertach, Y suma oferty z luką, X średnia suma pozostałych ofert bez pozycji pominiętych przez wykonawcę. Zachowuje to własny poziom cen wykonawcy. Czy luka czyni ofertę nieprawidłową, zależy od dokumentów zamówienia i wagi pozycji — wybierz „nieprawidłowa”, aby zobaczyć ranking bez tej oferty. Y i X to sumy całego porównywanego zakresu — pozycje podstawowe, kwoty tymczasowe i uwzględniane opcje (nasze odczytanie „łącznej kwoty przedmiaru lub inwentarza”). Pozycji, której nie wyceniła żadna oceniana oferta, nie da się uzupełnić i wypada ona z porównania dla wszystkich; gdy oferta użyta do L i X sama ma luki, strona ostrzega, bo artykuł tego nie rozstrzyga.') },
        options: { title: T('Items, provisional sums and options (art. 87)', 'Позиції, резервні суми й опції (ст. 87)', 'Positionen, vorgegebene Beträge und Optionen (Art. 87)', 'Posten, te verantwoorden sommen en opties (art. 87)', 'Postes, sommes à justifier et options (art. 87)', 'Partidas, partidas a justificar y opciones (art. 87)', 'Pozycje, kwoty tymczasowe i opcje (art. 87)'),
          body: T('A provisional sum is the client’s own figure: every bid carries the same amount, a different figure is corrected. Required options (vereiste opties / options exigées) and permitted options are always taken into account in the comparison (KB 18.04.2017 art. 87 §1); free options only if the authority decides to include them — tick “Included”. Leaving a required option unpriced is a missing price. When the award is on price or cost only, bidders may not attach an extra price to free or permitted options (art. 48 §3): tick “Award on price only” and such an option is disregarded for that bidder (art. 87 §1 al. 4). In a multi-criteria award an option also brings economic advantages; this tool prices only its cost.', 'Резервна сума — цифра самого замовника: кожна пропозиція містить ту саму суму, інша цифра виправляється. Обов’язкові та дозволені опції завжди враховуються при порівнянні (KB 18.04.2017, ст. 87 §1); вільні — лише якщо замовник вирішить їх включити (позначте «Включено»). Неоцінена обов’язкова опція — це відсутня ціна. Якщо присудження лише за ціною чи вартістю, учасники не можуть додавати доплату до вільних чи дозволених опцій (ст. 48 §3): позначте «Присудження лише за ціною», і така опція не враховується для цього учасника (ст. 87 §1, абз. 4). При кількох критеріях опція дає ще й економічні переваги; інструмент оцінює лише її вартість.', 'Ein vorgegebener Betrag ist die Zahl des Auftraggebers: jedes Angebot enthält denselben Betrag, eine andere Zahl wird korrigiert. Geforderte und zugelassene Optionen werden beim Vergleich immer berücksichtigt (KB 18.04.2017 Art. 87 §1); freie Optionen nur, wenn der Auftraggeber sie einbezieht — „Einbezogen“ ankreuzen. Eine unbepreiste geforderte Option ist ein fehlender Preis. Wird nur nach Preis oder Kosten gewertet, dürfen Bieter an freie oder zugelassene Optionen keinen Mehrpreis knüpfen (Art. 48 §3): „Zuschlag nur nach Preis“ ankreuzen, dann bleibt eine solche Option bei diesem Bieter außer Betracht (Art. 87 §1 Abs. 4). Bei mehreren Kriterien bringt eine Option auch wirtschaftliche Vorteile; das Werkzeug bewertet nur ihre Kosten.', 'Een te verantwoorden som is het eigen bedrag van de aanbestedende overheid: elke offerte bevat hetzelfde bedrag, een ander cijfer wordt verbeterd. Vereiste en toegestane opties worden bij de vergelijking altijd in aanmerking genomen (KB 18.04.2017 art. 87 §1); vrije opties alleen als de overheid beslist ze op te nemen — vink “Opgenomen” aan. Een niet-geprijsde vereiste optie is een ontbrekende prijs. Gebeurt de gunning enkel op basis van prijs of kosten, dan mogen inschrijvers aan vrije of toegestane opties geen meerprijs verbinden (art. 48 §3): vink “Gunning enkel op basis van prijs” aan en zo’n optie wordt voor die inschrijver buiten beschouwing gelaten (art. 87 §1, 4e lid). Bij meerdere gunningscriteria brengt een optie ook economische voordelen mee; deze tool waardeert alleen de kost.', 'Une somme à justifier est le montant du pouvoir adjudicateur : chaque offre porte le même montant, un autre chiffre est corrigé. Les options exigées et autorisées sont toujours prises en compte dans la comparaison (AR 18.04.2017, art. 87 §1) ; les options libres seulement si le pouvoir adjudicateur décide de les retenir — cochez « Retenue ». Une option exigée non chiffrée est un prix manquant. Lorsque l’attribution se fait sur le seul prix ou coût, les soumissionnaires ne peuvent lier aucun supplément aux options libres ou autorisées (art. 48 §3) : cochez « Attribution sur le seul prix » et une telle option est écartée pour ce soumissionnaire (art. 87 §1, al. 4). Avec plusieurs critères, une option apporte aussi des avantages économiques ; l’outil n’en chiffre que le coût.', 'Una partida a justificar es la cifra del propio poder adjudicador: todas las ofertas llevan el mismo importe y una cifra distinta se corrige. Las opciones exigidas y permitidas se tienen en cuenta siempre en la comparación (KB 18.04.2017, art. 87 §1); las libres solo si el poder adjudicador decide incluirlas — marque «Incluida». Una opción exigida sin precio es un precio omitido. Si la adjudicación es solo por precio o coste, los licitadores no pueden ligar un sobreprecio a las opciones libres o permitidas (art. 48 §3): marque «Adjudicación solo por precio» y esa opción se descarta para ese licitador (art. 87 §1, párr. 4). Con varios criterios una opción aporta también ventajas económicas; la herramienta solo valora su coste.', 'Kwota tymczasowa to kwota samego zamawiającego: każda oferta zawiera tę samą kwotę, inna liczba jest poprawiana. Opcje wymagane i dopuszczone zawsze uwzględnia się przy porównaniu (KB 18.04.2017 art. 87 §1); opcje dowolne tylko, gdy zamawiający postanowi je włączyć — zaznacz „Włączona”. Niewyceniona opcja wymagana to brakująca cena. Gdy wybór następuje wyłącznie według ceny lub kosztu, wykonawcy nie mogą wiązać dopłaty z opcjami dowolnymi lub dopuszczonymi (art. 48 §3): zaznacz „Wybór wyłącznie według ceny”, a taka opcja zostanie pominięta dla tego wykonawcy (art. 87 §1 ust. 4). Przy kilku kryteriach opcja daje też korzyści ekonomiczne; narzędzie wycenia tylko jej koszt.') },
        fx: { title: T('Currency and rebates', 'Валюта та знижки', 'Währung und Nachlässe', 'Munt en kortingen', 'Devise et rabais', 'Divisa y descuentos', 'Waluta i rabaty'),
          body: T('An unconditional rebate is applied to the corrected subtotal, then the bid is converted with its exchange rate (evaluation currency per unit of the bid currency). Use the rate the tender documents fix (often the ECB reference rate of a stated date); conditional rebates (for early payment, for award of several lots) do not belong here. The rebate applies to the whole subtotal, provisional sums and art. 86 fills included; if the offer form excludes provisional sums from the discount, lower the percentage to the equivalent share.', 'Безумовна знижка застосовується до виправленого підсумку, потім пропозиція перераховується за її курсом (валюта оцінки за одиницю валюти пропозиції). Беріть курс, який визначає тендерна документація (часто довідковий курс ЄЦБ на вказану дату); умовні знижки (за дострокову оплату, за кілька лотів) сюди не належать. Знижка застосовується до всього підсумку, разом з резервними сумами й доповненнями за ст. 86; якщо форма пропозиції не поширює знижку на резервні суми, зменште відсоток до рівноцінної частки.', 'Ein unbedingter Nachlass wird auf die korrigierte Zwischensumme angewandt, dann wird das Angebot mit seinem Kurs umgerechnet (Wertungswährung je Einheit der Angebotswährung). Den Kurs der Vergabeunterlagen verwenden (oft EZB-Referenzkurs eines Stichtags); bedingte Nachlässe (Skonto, Mehr-Lose-Nachlass) gehören nicht hierher. Der Nachlass gilt für die ganze Zwischensumme einschließlich vorgegebener Beträge und Ergänzungen nach Art. 86; nimmt das Angebotsformular vorgegebene Beträge vom Nachlass aus, den Prozentsatz auf den gleichwertigen Anteil senken.', 'Een onvoorwaardelijke korting wordt op het verbeterde subtotaal toegepast, daarna wordt de offerte omgerekend met haar koers (beoordelingsmunt per eenheid offertemunt). Gebruik de koers die de opdrachtdocumenten vastleggen (vaak de ECB-referentiekoers van een bepaalde datum); voorwaardelijke kortingen (voor snelle betaling, voor gunning van meerdere percelen) horen hier niet. De korting geldt voor het hele subtotaal, te verantwoorden sommen en aanvullingen volgens art. 86 inbegrepen; sluit het offerteformulier die sommen uit van de korting, verlaag dan het percentage tot het gelijkwaardige aandeel.', 'Un rabais inconditionnel s’applique au sous-total corrigé, puis l’offre est convertie à son taux (devise d’évaluation par unité de devise de l’offre). Utilisez le taux fixé par les documents du marché (souvent le cours de référence BCE d’une date donnée) ; les rabais conditionnels (paiement anticipé, attribution de plusieurs lots) n’ont pas leur place ici. Le rabais s’applique à tout le sous-total, sommes à justifier et compléments de l’art. 86 compris ; si le formulaire d’offre exclut ces sommes du rabais, réduisez le pourcentage à la part équivalente.', 'Un descuento incondicional se aplica al subtotal corregido y luego la oferta se convierte con su tipo de cambio (divisa de evaluación por unidad de la divisa de la oferta). Use el tipo que fijen los pliegos (a menudo el de referencia del BCE de una fecha); los descuentos condicionados (pronto pago, varios lotes) no van aquí. El descuento se aplica a todo el subtotal, partidas a justificar y completados del art. 86 incluidos; si el formulario de oferta excluye esas partidas del descuento, reduzca el porcentaje a la parte equivalente.', 'Rabat bezwarunkowy stosuje się do poprawionej sumy, potem ofertę przelicza się po jej kursie (waluta oceny za jednostkę waluty oferty). Stosuj kurs wskazany w dokumentach zamówienia (często kurs referencyjny EBC z określonego dnia); rabaty warunkowe (za szybką płatność, za kilka części) tu nie należą. Rabat dotyczy całej sumy, łącznie z kwotami tymczasowymi i uzupełnieniami wg art. 86; jeśli formularz oferty wyłącza kwoty tymczasowe z rabatu, obniż procent do równoważnego udziału.') },
        incoterms: { title: T('Delivery terms (Incoterms 2020)', 'Умови поставки (Incoterms 2020)', 'Lieferbedingungen (Incoterms 2020)', 'Leveringsvoorwaarden (Incoterms 2020)', 'Conditions de livraison (Incoterms 2020)', 'Condiciones de entrega (Incoterms 2020)', 'Warunki dostawy (Incoterms 2020)'),
          body: T('An EXW price and a DDP price are different products. The tool splits delivery into eight stages (packing/loading, export clearance, onto the main carrier, main carriage, insurance, on-carriage, unloading, import clearance) and marks which ones each rule puts in the seller’s price — our own model of the ICC 2020 cost split. Stages the reference includes but the bid does not are added at the logistics cost you enter for that bidder; the reverse are deducted. Import duty is the rate × customs value (price up to the EU border). Only DPU includes unloading at destination.', 'Ціна EXW і ціна DDP — різні продукти. Інструмент ділить поставку на вісім етапів (пакування/навантаження, експортне оформлення, передача на основний транспорт, основне перевезення, страхування, доставка, розвантаження, імпортне оформлення) і позначає, які з них кожне правило включає в ціну продавця — наша власна модель розподілу витрат ICC 2020. Етапи, які еталон включає, а пропозиція ні, додаються за введеною логістичною вартістю учасника; зворотні віднімаються. Мито = ставка × митна вартість (ціна до кордону ЄС). Лише DPU включає розвантаження в пункті призначення.', 'Ein EXW-Preis und ein DDP-Preis sind verschiedene Produkte. Das Werkzeug teilt die Lieferung in acht Abschnitte (Verpackung/Verladung, Ausfuhrabfertigung, Übergabe an den Haupttransport, Haupttransport, Versicherung, Nachlauf, Entladen, Einfuhrabfertigung) und markiert, welche jede Klausel in den Verkäuferpreis legt — unser eigenes Modell der Kostenaufteilung ICC 2020. Abschnitte, die die Referenz enthält, das Angebot aber nicht, werden zu den eingegebenen Logistikkosten des Bieters ergänzt; umgekehrte abgezogen. Einfuhrzoll = Satz × Zollwert (Preis bis zur EU-Grenze). Nur DPU umfasst das Entladen am Bestimmungsort.', 'Een EXW-prijs en een DDP-prijs zijn verschillende producten. De tool deelt de levering op in acht stappen (verpakking/laden, uitvoerformaliteiten, aan het hoofdvervoer, hoofdvervoer, verzekering, natransport, lossen, invoerformaliteiten) en duidt aan welke elke regel in de prijs van de verkoper legt — ons eigen model van de kostenverdeling ICC 2020. Stappen die de referentie bevat maar de offerte niet, worden toegevoegd tegen de logistieke kost die u voor die inschrijver invoert; omgekeerd worden ze afgetrokken. Invoerrecht = tarief × douanewaarde (prijs tot aan de EU-grens). Alleen DPU omvat het lossen op de bestemming.', 'Un prix EXW et un prix DDP sont des produits différents. L’outil découpe la livraison en huit étapes (emballage/chargement, dédouanement export, remise au transport principal, transport principal, assurance, post-acheminement, déchargement, dédouanement import) et indique celles que chaque règle met dans le prix du vendeur — notre propre modèle de la répartition des coûts ICC 2020. Les étapes que la référence inclut mais pas l’offre sont ajoutées au coût logistique saisi pour ce soumissionnaire ; l’inverse est déduit. Droits = taux × valeur en douane (prix jusqu’à la frontière de l’UE). Seul DPU inclut le déchargement à destination.', 'Un precio EXW y uno DDP son productos distintos. La herramienta divide la entrega en ocho etapas (embalaje/carga, despacho de exportación, entrega al transporte principal, transporte principal, seguro, transporte final, descarga, despacho de importación) y marca cuáles incluye cada regla en el precio del vendedor — nuestro propio modelo del reparto de costes ICC 2020. Las etapas que la referencia incluye y la oferta no se añaden al coste logístico que introduzca para ese licitador; las inversas se restan. Arancel = tipo × valor en aduana (precio hasta la frontera de la UE). Solo DPU incluye la descarga en destino.', 'Cena EXW i cena DDP to różne produkty. Narzędzie dzieli dostawę na osiem etapów (pakowanie/załadunek, odprawa wywozowa, przekazanie do przewozu głównego, przewóz główny, ubezpieczenie, dowóz, rozładunek, odprawa przywozowa) i zaznacza, które z nich każda reguła wlicza w cenę sprzedawcy — nasz własny model podziału kosztów ICC 2020. Etapy, które obejmuje odniesienie, a oferta nie, dolicza się po kosztach logistyki wprowadzonych dla wykonawcy; odwrotne się odejmuje. Cło = stawka × wartość celna (cena do granicy UE). Tylko DPU obejmuje rozładunek w miejscu przeznaczenia.') },
        payment: { title: T('Payment terms as present value', 'Умови оплати як приведена вартість', 'Zahlungsbedingungen als Barwert', 'Betalingsvoorwaarden als contante waarde', 'Conditions de paiement en valeur actuelle', 'Condiciones de pago como valor actual', 'Warunki płatności jako wartość bieżąca'),
          body: T('Money paid earlier costs the client its cost of money. Each bid’s payments — advance at award, balance at delivery + payment days, retention released months later — are discounted with v(t) = (1 + i)^(−t/12) and compared with the reference “100 % at delivery + reference days”. The ratio minus one, times the price, is the payment adjustment. Use the rate the tender documents announce; an unannounced criterion cannot be applied in a public tender. Payment days are converted to months of 30 days.', 'Гроші, сплачені раніше, коштують замовнику його вартості грошей. Платежі кожної пропозиції — аванс при присудженні, залишок при поставці + дні оплати, утримання через кілька місяців — дисконтуються v(t) = (1 + i)^(−t/12) і порівнюються з еталоном «100 % при поставці + еталонні дні». Відношення мінус один, помножене на ціну, — це коригування оплати. Беріть ставку, оголошену в тендерній документації; неоголошений критерій у публічній закупівлі застосовувати не можна. Дні оплати переводяться в місяці по 30 днів.', 'Früher gezahltes Geld kostet den Auftraggeber seine Kapitalkosten. Die Zahlungen jedes Angebots — Anzahlung bei Zuschlag, Rest bei Lieferung + Zahlungsziel, Einbehalt Monate später — werden mit v(t) = (1 + i)^(−t/12) abgezinst und mit der Referenz „100 % bei Lieferung + Referenztage“ verglichen. Verhältnis minus eins mal Preis ist die Zahlungskorrektur. Den in den Vergabeunterlagen angekündigten Zins verwenden; ein nicht angekündigtes Kriterium darf in einer öffentlichen Vergabe nicht angewandt werden. Zahlungstage werden in Monate zu 30 Tagen umgerechnet.', 'Vroeger betaald geld kost de overheid haar kapitaalkost. De betalingen van elke offerte — voorschot bij gunning, saldo bij levering + betalingstermijn, inhouding maanden later vrijgegeven — worden geactualiseerd met v(t) = (1 + i)^(−t/12) en vergeleken met de referentie “100 % bij levering + referentiedagen”. De verhouding min één, maal de prijs, is de correctie voor betaling. Gebruik de voet die de opdrachtdocumenten aankondigen; een niet-aangekondigd criterium mag bij een overheidsopdracht niet worden toegepast. Betalingsdagen worden omgerekend naar maanden van 30 dagen.', 'L’argent payé plus tôt coûte au pouvoir adjudicateur son coût de l’argent. Les paiements de chaque offre — avance à l’attribution, solde à la livraison + délai, retenue libérée des mois plus tard — sont actualisés par v(t) = (1 + i)^(−t/12) et comparés à la référence « 100 % à la livraison + jours de référence ». Le rapport moins un, fois le prix, est l’ajustement de paiement. Utilisez le taux annoncé dans les documents du marché ; un critère non annoncé ne peut être appliqué dans un marché public. Les jours de paiement sont convertis en mois de 30 jours.', 'El dinero pagado antes le cuesta al poder adjudicador su coste del dinero. Los pagos de cada oferta — anticipo en la adjudicación, saldo a la entrega + plazo, retención liberada meses después — se descuentan con v(t) = (1 + i)^(−t/12) y se comparan con la referencia «100 % a la entrega + días de referencia». La razón menos uno, por el precio, es el ajuste de pago. Use la tasa anunciada en los pliegos; un criterio no anunciado no puede aplicarse en una licitación pública. Los días de pago se convierten en meses de 30 días.', 'Pieniądze zapłacone wcześniej kosztują zamawiającego jego koszt pieniądza. Płatności każdej oferty — zaliczka przy wyborze, reszta przy dostawie + termin płatności, zatrzymanie zwolnione po miesiącach — dyskontuje się v(t) = (1 + i)^(−t/12) i porównuje z odniesieniem „100 % przy dostawie + dni referencyjne”. Iloraz minus jeden razy cena to korekta płatności. Stosuj stopę ogłoszoną w dokumentach zamówienia; nieogłoszonego kryterium nie wolno stosować w zamówieniu publicznym. Dni płatności przelicza się na miesiące po 30 dni.') },
        rank: { title: T('Ranking and what goes next', 'Рейтинг і що далі', 'Rangfolge und nächster Schritt', 'Rangschikking en volgende stap', 'Classement et étape suivante', 'Clasificación y siguiente paso', 'Ranking i następny krok'),
          body: T('Bids are ranked by normalised price; technically non-compliant, set-aside and unfillable bids are shown but not ranked. The rank at opening (read-out × exchange rate) stands next to it, so a change of first place is visible. Save to the project: the normalised price goes into bids[].price for price scoring (awardcriteria), abnormally low checks (lowbidcheck) and life-cycle costing (lccaward).', 'Пропозиції ранжуються за нормалізованою ціною; технічно невідповідні, відхилені й незаповнювані показано без рангу. Поруч стоїть ранг при розкритті (оголошена сума × курс), тож зміну першого місця видно. Збережіть у проєкт: нормалізована ціна йде в bids[].price для оцінки ціни (awardcriteria), перевірки аномально низьких цін (lowbidcheck) і вартості життєвого циклу (lccaward).', 'Angebote werden nach normiertem Preis gereiht; technisch nicht konforme, ausgeschiedene und nicht ergänzbare werden gezeigt, aber nicht gereiht. Daneben steht der Rang bei der Öffnung (verlesener Betrag × Kurs), so wird ein Wechsel auf Platz 1 sichtbar. Im Projekt speichern: der normierte Preis geht in bids[].price für Preiswertung (awardcriteria), Prüfung ungewöhnlich niedriger Angebote (lowbidcheck) und Lebenszykluskosten (lccaward).', 'Offertes worden gerangschikt op genormaliseerde prijs; technisch niet-conforme, geweerde en niet-aanvulbare offertes worden getoond maar niet gerangschikt. De rang bij de opening (afgelezen bedrag × koers) staat ernaast, zodat een wissel op de eerste plaats zichtbaar is. Opslaan in het project: de genormaliseerde prijs gaat naar bids[].price voor de prijsscore (awardcriteria), het onderzoek naar abnormale prijzen (lowbidcheck) en de levenscycluskost (lccaward).', 'Les offres sont classées par prix normalisé ; les offres non conformes, écartées ou impossibles à compléter sont affichées mais non classées. Le rang à l’ouverture (montant lu × change) figure à côté : un changement de première place se voit. Enregistrez dans le projet : le prix normalisé va dans bids[].price pour la cotation du prix (awardcriteria), la vérification des prix anormaux (lowbidcheck) et le coût du cycle de vie (lccaward).', 'Las ofertas se ordenan por precio normalizado; las no conformes, descartadas o imposibles de completar se muestran sin clasificar. Al lado está el puesto en la apertura (importe leído × cambio), así se ve un cambio del primer puesto. Guarde en el proyecto: el precio normalizado va a bids[].price para la puntuación del precio (awardcriteria), la comprobación de ofertas anormalmente bajas (lowbidcheck) y el coste del ciclo de vida (lccaward).', 'Oferty szereguje się według ceny znormalizowanej; niezgodne technicznie, odrzucone i niemożliwe do uzupełnienia są pokazane bez rangi. Obok stoi miejsce przy otwarciu (kwota odczytana × kurs), więc zmiana lidera jest widoczna. Zapisz w projekcie: cena znormalizowana trafia do bids[].price dla punktacji ceny (awardcriteria), badania rażąco niskiej ceny (lowbidcheck) i kosztu cyklu życia (lccaward).') }
      },
      tour: [
        { topic: 'method', focus: '[data-dgu-field="f-arith"]' },
        { topic: 'options', focus: '[data-dgu-field="f-items"]' },
        { topic: 'arith', focus: '[data-dgu-field="f-lines"]' },
        { topic: 'missing', focus: '[data-dgu-field="f-missing"]' },
        { topic: 'incoterms', focus: '[data-dgu-field="f-ref"]' },
        { topic: 'payment', focus: '[data-dgu-field="f-rate"]' },
        { topic: 'rank', focus: '.dgu-verdict' }
      ]
    };
  }

  /* ======================================================= 3. the data layer */
  function buildRecord() {
    if (!last) return null;
    var inputs = {}, outputs = {}, units = {}, warnings = [];
    ['tenderRef', 'evaluator', 'cur', 'rate', 'T', 'ref', 'refDays', 'arith', 'missing', 'priceOnly'].forEach(function (k) { inputs[k] = state[k]; });
    units.rate = '%/year'; units.T = 'months'; units.refDays = 'days';
    inputs.items = JSON.stringify(state.items); inputs.bids = JSON.stringify(state.bids);
    inputs.lines = JSON.stringify(state.lines); inputs.logistics = JSON.stringify(state.logistics);
    if (last.ok) {
      var R = last;
      outputs.best = R.best; outputs.lowest_at_opening = R.readoutBest; outputs.first_place_changed = R.winnerChanged;
      outputs.corrections = R.nCorrections; outputs.fills_art86 = R.nFills; outputs.spread = R.spread;
      R.bids.forEach(function (b) {
        outputs['N_' + b.id] = b.N; units['N_' + b.id] = state.cur;
        outputs['rank_' + b.id] = b.rank == null ? 'not ranked' : b.rank;
      });
      if (R.nCorrections) warnings.push('KB 18.04.2017 art. 34 par. 2: no general unit-price rule; line decisions are the evaluator\'s (fallback: ' + R.arith + ').');
      if (R.nFills) warnings.push('Missing prices filled per KB 18.04.2017 art. 86 par. 2 (P = L*Y/X) for comparison only.');
    } else warnings.push('invalid input: ' + (last.errors || []).join(', '));
    return {
      inputs: inputs, outputs: outputs, units: units,
      model: {
        equations: ['line: computed = qty x unit price; discrepancy if |computed - stated| > 0.005; used = decision (unit | stated), auto = tender fallback',
                    'missing price: P = L*Y/X (KB 18.04.2017 art. 86 par. 2); L mean of the item over the other ranked bids, Y omitting bid total, X mean total of the others without the omitted items',
                    'options: required and permitted always, free if included (art. 87 par. 1); price-only award: free/permitted options with an extra price disregarded (art. 48 par. 3, art. 87 par. 1 al. 4)',
                    'tool rules: item priced by no eligible bid leaves the comparison; impossible inputs (fx <= 0, rebate outside [0,1), negative duty/advance/retention/days) and non-finite results are not ranked; ties within 1e-9 relative share the rank (art. 87 par. 2)',
                    'S = (readout + arithmetic delta + fills + options) x (1 - rebate) x fx',
                    'delivery gap: sum of stage costs in reference but not in bid minus stages in bid not in reference; duty x customs value',
                    'payment: adj = S x (PV_bid / PV_ref - 1), v(t) = (1 + i)^(-t/12)', 'N = S + gap + adj'],
        ranges: ['up to 200 items, 40 bids, 8 000 price lines, 400 logistics lines'],
        notes: ['amounts in bid currency, logistics in evaluation currency, percentages in %']
      },
      warnings: warnings
    };
  }
  /* permalink / project import: known keys only, arrays bounded, numbers finite, enums checked */
  var ENUM = { arith: ['unit', 'stated'], missing: ['fill', 'reject'], ref: INCOTERMS };
  function fin(v, lo, hi) { v = typeof v === 'string' && v.trim() !== '' ? +v : v; return typeof v === 'number' && isFinite(v) && v >= lo && v <= hi ? v : undefined; }
  function txt(v, max) { return v == null ? '' : String(v).slice(0, max || 200); }
  function sanitize(o) {
    var out = {};
    if (!o || typeof o !== 'object' || Array.isArray(o)) return out;
    Object.keys(ENUM).forEach(function (k) { if (o[k] != null && ENUM[k].indexOf(String(o[k])) >= 0) out[k] = String(o[k]); });
    if (typeof o.cur === 'string') out.cur = txt(o.cur, 8);
    [['rate', 0, 50], ['T', 0, 120], ['refDays', 0, 365]].forEach(function (x) { var v = fin(o[x[0]], x[1], x[2]); if (v !== undefined) out[x[0]] = v; });
    ['tenderRef', 'evaluator'].forEach(function (k) { if (typeof o[k] === 'string') out[k] = txt(o[k]); });
    var BIG = 1e13, over = [];
    if (typeof o.priceOnly === 'boolean') out.priceOnly = o.priceOnly;
    [['items', 200], ['bids', 40], ['lines', 8000], ['logistics', 400]].forEach(function (x) { if (Array.isArray(o[x[0]]) && o[x[0]].length > x[1]) over.push(x[0] + ' ' + o[x[0]].length + ' > ' + x[1]); });
    if (over.length) { out.__over = over; return out; }
    if (Array.isArray(o.items)) out.items = o.items.filter(function (r) { return r && typeof r === 'object'; }).map(function (r) {
      var kind = ['base', 'provisional', 'req_option', 'perm_option', 'free_option'].indexOf(r.kind) >= 0 ? r.kind : 'base';
      var q = fin(r.qty, 0, BIG), u = fin(r.up, 0, BIG);
      return { id: txt(r.id, 24), desc: txt(r.desc), unit: txt(r.unit, 12), qty: q === undefined ? 0 : q, kind: kind, up: u === undefined ? null : u, include: r.include !== false };
    });
    if (Array.isArray(o.bids)) out.bids = o.bids.filter(function (r) { return r && typeof r === 'object'; }).map(function (r) {
      var g = function (k, lo, hi, d) { var v = fin(r[k], lo, hi); return v === undefined ? d : v; };
      return { id: txt(r.id, 24), name: txt(r.name), currency: txt(r.currency || 'EUR', 8), fx: g('fx', 0, 1e6, 1), readout: g('readout', 0, BIG, null), rebate: g('rebate', 0, 100, 0),
               incoterm: INCOTERMS.indexOf(r.incoterm) >= 0 ? r.incoterm : 'DAP', duty: g('duty', 0, 100, 0), tech: r.tech === 'fail' ? 'fail' : (r.tech === '' ? '' : 'pass'),
               adv: g('adv', 0, 100, 0), ret: g('ret', 0, 100, 0), retM: g('retM', 0, 240, 0), days: g('days', 0, 365, 30) };
    });
    if (Array.isArray(o.lines)) out.lines = o.lines.filter(function (r) { return r && typeof r === 'object'; }).map(function (r) {
      var u = fin(r.up, -BIG, BIG), a = fin(r.amount, -BIG, BIG);
      return { bid: txt(r.bid, 24), item: txt(r.item, 24), up: u === undefined ? null : u, amount: a === undefined ? null : a, decision: ['unit', 'stated'].indexOf(r.decision) >= 0 ? r.decision : 'auto' };
    });
    if (Array.isArray(o.logistics)) out.logistics = o.logistics.filter(function (r) { return r && typeof r === 'object' && EL.indexOf(r.el) >= 0; }).map(function (r) {
      var a = fin(r.amount, 0, BIG); return { bid: txt(r.bid, 24), el: r.el, amount: a === undefined ? 0 : a };
    });
    return out;
  }
  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: TOOL, file: 'bidnormalize.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { var c = sanitize(o); if (c.__over) return; applyClean(c); last = solve(state); if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
