    ['dT', 'hydrate temperature depression'],

  function isFiniteNumber(v) {
    return typeof v === 'number' && isFinite(v);

  function solve(s) {
    var L = lib();
    if (!L || typeof L.solve !== 'function') {
      return { ok: false, err: 'ogh-process.js did not load' };
    }
    var i, key, name;
    for (i = 0; i < FIELDS.length; i++) {
      key = FIELDS[i][0];
      name = FIELDS[i][1];
      if (!isFiniteNumber(s[key])) {
        return { ok: false, err: 'Enter a finite value for ' + name };
      }
    }
    var full = s.level === 'full';
    if (full && !isFiniteNumber(s.Xlean)) {
      return { ok: false, err: 'Enter a finite value for ' + 'lean inhibitor concentration' };

    var inp = {
      dT: s.dT,
      inhib: s.inhib,
      method: s.method,
      W: s.W,
      Xlean: full ? s.Xlean : null
    };
    try {
      return L.solve(inp);
    } catch (e) {
      return { ok: false, err: 'Calculation failed: ' + (e && e.message ? e.message : String(e)) };
    }
  }

    if (n === undefined || n === null) n = 5;
    v = +v;
    if (v === 0 || !isFinite(v)) return 2;

  function trW(w) { var i, m; w = String(w); for (i = 0; i < WARN.length; i++) { m = w.match(WARN[i][0]); if (m) return TF(WARN[i][1], m.slice(1)); } return w; }

  var state = JSON.parse(JSON.stringify(DEFAULTS));
  var last = null;

  /* ======================================================== 2. the interface */
  function T(en, uk, de, nl, fr, es, pl) { return { en: en, uk: uk, de: de, nl: nl, fr: fr, es: es, pl: pl }; }

  var stage = null;
  function LEGEND_ITEMS() {
    return [
      { label: T('Water', 'Вода', 'Wasser', 'Water', 'Eau', 'Agua', 'Woda'), series: 0 },
      { label: T('Pure inhibitor', 'Чистий інгібітор', 'Reiner Inhibitor', 'Zuivere inhibitor', 'Inhibiteur pur', 'Inhibidor puro', 'Czysty inhibitor'), series: 1 },
      { label: T('Lean diluent water', 'Вода-розчинник пісного розчину', 'Verdünnungswasser der mageren Lösung', 'Verdunningswater van de arme oplossing', 'Eau de dilution de la solution pauvre', 'Agua diluyente de la solución pobre', 'Woda rozcieńczająca roztworu ubogiego'), series: 2 }
    ];
  }
  function adoptStage(app) {
    stage = app.stages[0] || null;
    if (stage) stage.legend({ items: LEGEND_ITEMS() });
  }

  var ui = null;

  function computeView(s) {
    last = solve(s);
    if (stage) stage.schedule();
    var R = last;
    if (!R || !R.ok) { var e = trW((R && R.err) || 'Error'); return { verdict: { tone: 'bad', text: e }, tiles: [], notes: [] }; }
    var full = s.level === 'full', tiles = [], meters = [], tables = [], notes = [];
    function fin(v) { return typeof v === 'number' && isFinite(v); }
    function tile(label, v, unit, learn, head) { if (!fin(v)) return; tiles.push({ label: label, value: sigv(v, 5), hint: unit, precision: sig(v, 5), tone: null, learn: learn, headline: !!head }); }
    var warns = R.warnings || [], i, w;
    var verdict = warns.length === 0
      ? { tone: 'ok', text: T('Inhibitor rate found for the required depression', 'Витрату інгібітора знайдено для потрібного зниження', 'Inhibitorrate für die geforderte Absenkung ermittelt', 'Inhibitordebiet gevonden voor de vereiste verlaging', 'Débit d\'inhibiteur trouvé pour l\'abaissement requis', 'Caudal de inhibidor hallado para la depresión requerida', 'Wyznaczono dawkę inhibitora dla wymaganego obniżenia') }
      : { tone: 'warn', text: T('Inhibitor rate found, check the warnings', 'Витрату інгібітора знайдено, перевірте попередження', 'Inhibitorrate ermittelt, Warnungen prüfen', 'Inhibitordebiet gevonden, controleer de waarschuwingen', 'Débit d\'inhibiteur trouvé, vérifiez les avertissements', 'Caudal de inhibidor hallado, revise las advertencias', 'Wyznaczono dawkę inhibitora, sprawdź ostrzeżenia') };
    tile(T('msol · Lean inhibitor solution rate', 'msol · Витрата регенерованого розчину інгібітора', 'msol · Rate der regenerierten Inhibitorlösung', 'msol · Debiet arme inhibitoroplossing', 'msol · Débit de solution d\'inhibiteur régénérée', 'msol · Caudal de solución pobre de inhibidor', 'msol · Strumień regenerowanego roztworu inhibitora'), R.msol * 3600, 'kg/h', 'lean', true);
    tile(T('mpure · Pure inhibitor rate', 'mpure · Витрата чистого інгібітора', 'mpure · Rate des reinen Inhibitors', 'mpure · Debiet zuivere inhibitor', 'mpure · Débit d\'inhibiteur pur', 'mpure · Caudal de inhibidor puro', 'mpure · Strumień czystego inhibitora'), R.mpure * 3600, 'kg/h', 'results');
    tile(T('X · Inhibitor in the water phase', 'X · Інгібітор у водній фазі', 'X · Inhibitor in der Wasserphase', 'X · Inhibitor in de waterfase', 'X · Inhibiteur dans la phase aqueuse', 'X · Inhibidor en la fase acuosa', 'X · Inhibitor w fazie wodnej'), R.X * 100, 'wt%', 'correlation');
    if (full) {
      tile(T('M · Molar mass', 'M · Молярна маса', 'M · Molare Masse', 'M · Molaire massa', 'M · Masse molaire', 'M · Masa molar', 'M · Masa molowa'), R.M, 'g/mol', 'inhibitor');
      if (fin(R.xw)) tile(T('xw · Water mole fraction', 'xw · Мольна частка води', 'xw · Stoffmengenanteil Wasser', 'xw · Molfractie water', 'xw · Fraction molaire de l\'eau', 'xw · Fracción molar de agua', 'xw · Ułamek molowy wody'), R.xw, '–', 'correlation');
      tile(T('mrich · Rich solution rate', 'mrich · Витрата насиченого розчину', 'mrich · Rate der beladenen Lösung', 'mrich · Debiet rijke oplossing', 'mrich · Débit de solution riche', 'mrich · Caudal de solución rica', 'mrich · Strumień roztworu nasyconego'), (s.W + R.msol) * 3600, 'kg/h', 'water');
    }
    var lean = full ? s.Xlean : (s.inhib === 'MeOH' ? 1 : 0.8);
    meters.push({
      label: T('Inhibitor in water phase / lean', 'Інгібітор у водній фазі / регенерований', 'Inhibitor in Wasserphase / regeneriert', 'Inhibitor in waterfase / arm', 'Inhibiteur en phase aqueuse / régénéré', 'Inhibidor en fase acuosa / pobre', 'Inhibitor w fazie wodnej / regenerowany'),
      ratio: Math.min(1.2, R.X / lean),
      text: DiagramUI.fmt(R.X * 100, { precision: 1 }) + ' / ' + DiagramUI.fmt(lean * 100, { precision: 1 }) + ' wt%'
    });
    for (i = 0; i < warns.length; i++) { notes.push(trW(warns[i])); }
    notes.push(T('Hammerschmidt and Nielsen-Bucklin after GPSA Engineering Data Book, 14th ed. (2017), Sect. 20; losses to the gas and hydrocarbon liquid are not included',
      'Гаммершмідт і Нільсен-Баклін за GPSA Engineering Data Book, 14-те вид. (2017), розд. 20; втрати в газ і вуглеводневу рідину не враховано',
      'Hammerschmidt und Nielsen-Bucklin nach GPSA Engineering Data Book, 14. Aufl. (2017), Abschn. 20; Verluste an Gas und Kohlenwasserstoffflüssigkeit sind nicht berücksichtigt',
      'Hammerschmidt en Nielsen-Bucklin volgens GPSA Engineering Data Book, 14e ed. (2017), sect. 20; verliezen naar het gas en de koolwaterstofvloeistof zijn niet meegenomen',
      'Hammerschmidt et Nielsen-Bucklin d\'après GPSA Engineering Data Book, 14e éd. (2017), sect. 20 ; les pertes vers le gaz et le liquide hydrocarboné ne sont pas incluses',
      'Hammerschmidt y Nielsen-Bucklin según GPSA Engineering Data Book, 14.ª ed. (2017), secc. 20; no se incluyen las pérdidas al gas ni al líquido hidrocarburo',
      'Hammerschmidt i Nielsen-Bucklin wg GPSA Engineering Data Book, wyd. 14 (2017), rozdz. 20; straty do gazu i ciekłych węglowodorów nie są uwzględnione'));
    return { verdict: verdict, tiles: tiles, meters: meters, tables: tables, notes: notes };
  }

  function renderHydrate(size, st) {
    var ctx = st.canvas(), w = size.w, h = size.h;
    ctx.clearRect(0, 0, w, h);
    if (!last || !last.ok) return;
    var cs = getComputedStyle(document.documentElement);
    var muted = cs.getPropertyValue('--muted').trim() || '#888';
    var line = cs.getPropertyValue('--line').trim() || '#ccc';
    var font = cs.getPropertyValue('--font').trim() || 'sans-serif';
    var vals = [state.W * 3600, last.mpure * 3600, Math.max(0, (last.msol - last.mpure) * 3600)];
    var tot = vals[0] + vals[1] + vals[2];
    if (!(tot > 0)) return;
    var m = 30, bw = w - 2 * m, bh = Math.min(60, h / 3), y = (h - bh) / 2, x = m, i, sw;
    ctx.font = '12px ' + font;
    ctx.fillStyle = muted;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText(TL(TF(T('X = $1 wt% inhibitor in the rich phase', 'X = $1 мас.% інгібітора в насиченій фазі', 'X = $1 Gew.-% Inhibitor in der beladenen Phase', 'X = $1 gew.% inhibitor in de rijke fase', 'X = $1 % m d\'inhibiteur dans la phase riche', 'X = $1 % p/p de inhibidor en la fase rica', 'X = $1% mas. inhibitora w fazie nasyconej'), [DiagramUI.fmt(last.X * 100, { precision: 1 })])), m, y - 8);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (i = 0; i < 3; i++) {
      sw = bw * vals[i] / tot;
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = DiagramUI.series(i);
      ctx.fillRect(x, y, sw, bh);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = muted;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x, y, sw, bh);
      if (sw > 40) {
        ctx.fillStyle = muted;
        ctx.fillText(DiagramUI.fmt(vals[i], { precision: 3 }) + ' kg/h', x + sw / 2, y + bh + 6);
      }
      x += sw;
    }
    var tx = m + bw * Math.max(0, Math.min(1, last.X));
    ctx.setLineDash([4, 3]);
    ctx.strokeStyle = line;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(tx, y + bh + 24);
    ctx.lineTo(tx, y + bh + 40);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function degrade() {
    document.title = 'diagram-ui.js v1 is required';
    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1');
    h.textContent = 'Hydrate inhibition';
    var p = document.createElement('p');
    p.textContent = 'The interactive interface could not load. The export, the calculation record '
                  + 'and the limitations are still available from the bar at the bottom of the page.';
    host.appendChild(h);
    host.appendChild(p);
    last = solve(state);
  }

  function boot() {
    if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1') buildInterface();
    else degrade();
    installData();
  }

            body: T('Simple uses the default lean concentration (100 wt% methanol, 80 wt% glycol); full lets you set the lean mass fraction and shows more results.', 'Простий рівень використовує типову концентрацію свіжого (бідного) інгібітора (100 мас.% метанолу, 80 мас.% гліколю); повний дозволяє задати масову частку свіжого інгібітора та показує більше результатів.', 'Einfach verwendet die Standardkonzentration des mageren Inhibitors (100 Gew.-% Methanol, 80 Gew.-% Glykol); Vollständig ermöglicht die Eingabe des Massenanteils des mageren Inhibitors und zeigt mehr Ergebnisse.', 'Eenvoudig gebruikt de standaardconcentratie van de arme inhibitor (100 gew.% methanol, 80 gew.% glycol); volledig laat u de massafractie van de arme inhibitor instellen en toont meer resultaten.', 'Le niveau simple utilise la concentration pauvre par défaut (100 % massique de méthanol, 80 % massique de glycol) ; le niveau complet permet de définir la fraction massique pauvre et affiche davantage de résultats.', 'El nivel simple usa la concentración pobre predeterminada (100 % en peso de metanol, 80 % en peso de glicol); el completo permite definir la fracción másica pobre y muestra más resultados.', 'Tryb prosty wykorzystuje domyślne stężenie inhibitora ubogiego (100% mas. metanolu, 80% mas. glikolu); tryb pełny pozwala ustawić udział masowy inhibitora ubogiego i pokazuje więcej wyników.')

            body: T('Hammerschmidt gives inhibitor mass fraction X = dT*M/(KH + dT*M) with KH = 1297 K and is reliable up to about 20-25 wt% inhibitor; Nielsen-Bucklin derives water mole fraction xw = exp(-dT/72) and suits concentrated methanol and large depressions (GPSA 2017, Sect. 20).', 'Хаммершмідт дає масову частку інгібітора X = dT*M/(KH + dT*M) при KH = 1297 K і є надійним приблизно до 20-25 мас.% інгібітора; Нільсен-Баклін визначає мольну частку води xw = exp(-dT/72) і краще підходить для концентрованого метанолу та великих знижень (GPSA 2017, розд. 20).', 'Hammerschmidt liefert den Inhibitor-Massenanteil X = dT*M/(KH + dT*M) mit KH = 1297 K und ist bis etwa 20-25 Gew.-% Inhibitor zuverlässig; Nielsen-Bucklin bestimmt den Wasser-Molenbruch xw = exp(-dT/72) und eignet sich besser für konzentriertes Methanol und große Absenkungen (GPSA 2017, Abschn. 20).', 'Hammerschmidt geeft de massafractie inhibitor X = dT*M/(KH + dT*M) met KH = 1297 K en is betrouwbaar tot circa 20-25 gew.% inhibitor; Nielsen-Bucklin bepaalt de molfractie water xw = exp(-dT/72) en is geschikter voor geconcentreerde methanol en grote verlagingen (GPSA 2017, sectie 20).', 'Hammerschmidt donne la fraction massique d\'inhibiteur X = dT*M/(KH + dT*M) avec KH = 1297 K et reste fiable jusqu\'à environ 20-25 % massiques d\'inhibiteur ; Nielsen-Bucklin détermine la fraction molaire d\'eau xw = exp(-dT/72) et convient mieux au méthanol concentré et aux grands abaissements (GPSA 2017, sect. 20).', 'Hammerschmidt da la fracción másica de inhibidor X = dT*M/(KH + dT*M) con KH = 1297 K y es fiable hasta aproximadamente 20-25 % en peso de inhibidor; Nielsen-Bucklin obtiene la fracción molar de agua xw = exp(-dT/72) y es más adecuado para metanol concentrado y grandes depresiones (GPSA 2017, secc. 20).', 'Hammerschmidt podaje udział masowy inhibitora X = dT*M/(KH + dT*M) przy KH = 1297 K i jest wiarygodny do około 20-25% mas. inhibitora; Nielsen-Bucklin wyznacza ułamek molowy wody xw = exp(-dT/72) i lepi           'Kijk naar msol: een verlaging van 25 K bij 0,3 kg/s (1080 kg/h) water vraagt 54,5 gew.% MEG in de rijke fase, dus 1656 kg/h arme MEG van 90 gew.% - meer oplossing dan water; daarom hebben subsea MEG-kringlopen een regeneratie-installatie nodig.',

          'Kijk naar X: zelfs een bescheiden verlaging van 10 K vraagt 45,0 gew.% DEG in de waterfase, omdat de molaire massa (106 g/mol) groter is dan die van MEG; 0,05 kg/s water vraagt 185 kg/h zuivere DEG.',
          'Regardez X : même un abaissement modeste de 10 K exige 45,0 % m de DEG dans la phase aqueuse, car sa masse molaire (106 g/mol) est supérieure à celle du MEG ; 0,05 kg/s d\'eau demandent 185 kg/h de DEG pur.',
          'Fíjese en X: incluso un descenso moderado de 10 K exige 45,0 % p/p de DEG en la fase acuosa, porque su masa molar (106 g/mol) es mayor que la del MEG; 0,05 kg/s de agua requieren 185 kg/h de DEG puro.',
          'Spójrz na X: nawet umiarkowane obniżenie o 10 K wymaga 45,0% mas. DEG w fazie wodnej, bo jego masa molowa (106 g/mol) jest większa niż MEG; 0,05 kg/s wody potrzebuje 185 kg/h czystego DEG.'),

          'Achten Sie auf X: Für 20 K liefert Nielsen-Bucklin 36,3 Gew.-% Methanol in der Wasserphase, also brauchen 180 kg/h Wasser 102,5 kg/h reines Methanol; die Warnung erinnert daran, dass der Methanolverlust ins Gas hinzukommt.',
          'Kijk naar X: voor 20 K geeft Nielsen-Bucklin 36,3 gew.% methanol in de waterfase, dus 180 kg/h water vraagt 102,5 kg/h zuivere methanol; de waarschuwing herinnert eraan dat het methanolverlies naar het gas daar nog bij komt.',
          'Regardez X : pour 20 K, Nielsen-Bucklin donne 36,3 % m de méthanol dans la phase aqueuse, donc 180 kg/h d\'eau demandent 102,5 kg/h de méthanol pur ; l\'avertissement rappelle que le méthanol perdu vers le gaz s\'y ajoute.',
          'Fíjese en X: para 20 K Nielsen-Bucklin da 36,3 % p/p de metanol en la fase acuosa, así que 180 kg/h de agua requieren 102,5 kg/h de metanol puro; la advertencia recuerda que el metanol perdido al gas se suma a esto.',
          'Spójrz na X: dla 20 K korelacja Nielsena-Bucklina daje 36,3% mas. metanolu w fazie wodnej, więc 180 kg/h wody potrzebuje 102,5 kg/h czystego metanolu; ostrzeżenie przypomina, że straty metanolu do gazu dochodzą do tego.'),

    ui.stage({

        'Reiche Wasserphase am kältesten Punkt: Massenaufteilung in Wasser, reinen Inhibitor und Verdünnungswasser der mageren Lösung, kg/h',

        'Phase aqueuse riche au point le plus froid : répartition massique entre eau, inhibiteur pur et eau de dilution de la solution pauvre, kg/h',
        'Fase acuosa rica en el punto más frío: reparto másico entre agua, inhibidor puro y agua diluyente de la solución pobre, kg/h',
        'Bogata faza wodna w najzimniejszym punkcie: podział masy na wodę, czysty inhibitor i wodę rozcieńczającą roztworu ubogiego, kg/h'),
      minHeight: 260,
      a11y: function () {
        if (!last || !last.ok) return TL(T('Inhibitor diagram not available.', 'Діаграма інгібітора недоступна.', 'Inhibitordiagramm nicht verfügbar.', 'Inhibitordiagram niet beschikbaar.', 'Diagramme de l\'inhibiteur indisponible.', 'Diagrama del inhibidor no disponible.', 'Wykres inhibitora niedostępny.'));
        var f = function (v) { return DiagramUI.fmt(v, { precision: 3 }); };
        return TL(TF(T('Rich water phase: water $1 kg/h, pure inhibitor $2 kg/h, lean diluent water $3 kg/h; inhibitor mass fraction $4 wt%.',
          'Насичена водна фаза: вода $1 кг/год, чистий інгібітор $2 кг/год, вода-розчинник регенерованого розчину $3 кг/год; масова частка інгібітора $4 мас.%.',
          'Beladene Wasserphase: Wasser $1 kg/h, reiner Inhibitor $2 kg/h, Verdünnungswasser der mageren Lösung $3 kg/h; Inhibitor-Massenanteil $4 Gew.-%.',
          'Rijke waterfase: water $1 kg/h, zuivere inhibitor $2 kg/h, verdunningswater van de arme oplossing $3 kg/h; massafractie inhibitor $4 gew.%.',
          'Phase aqueuse riche : eau $1 kg/h, inhibiteur pur $2 kg/h, eau de dilution de la solution pauvre $3 kg/h ; fraction massique d\'inhibiteur $4 % m.',
          'Fase acuosa rica: agua $1 kg/h, inhibidor puro $2 kg/h, agua diluyente de la solución pobre $3 kg/h; fracción másica de inhibidor $4 % p/p.',
          'Bogata faza wodna: woda $1 kg/h, czysty inhibitor $2 kg/h, woda rozcieńczająca roztworu ubogiego $3 kg/h; udział masowy inhibitora $4% mas.'),
          [f(state.W * 3600), f(last.mpure * 3600), f(Math.max(0, (last.msol - last.mpure) * 3600)), DiagramUI.fmt(last.X * 100, { precision: 1 })]));
      },
      render: renderHydrate
    });
    adoptStage(ui);

    ui.ready();
    window.__hydrate_inhibition = { ui: ui, state: state, solve: solve, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function buildRecord() {
    if (!last) return null;
    var U = { dT: 'K', W: 'kg/s', Xlean: 'kg/kg', inhib: '-', method: '-', X: 'kg/kg', xw: 'mol/mol', msol: 'kg/s', mpure: 'kg/s', M: 'g/mol', KH: 'K' };
    var inputs = { dT: state.dT, inhib: state.inhib, method: state.method, W: state.W, Xlean: state.level === 'full' ? state.Xlean : null };
    var outputs = {}, units = {}, keys = ['X', 'xw', 'msol', 'mpure', 'M', 'KH'], i, k, v;
    if (last.ok) {
      for (i = 0; i < keys.length; i++) {
        v = last[keys[i]];
        if (typeof v === 'number' && isFinite(v)) outputs[keys[i]] = v;
      }
    }
    for (k in inputs) {
      if (inputs.hasOwnProperty(k) && inputs[k] !== null && inputs[k] !== undefined) units[k] = U[k];
    }
    for (k in outputs) {
      if (outputs.hasOwnProperty(k)) units[k] = U[k];
    }
    var warnings = last.ok ? (last.warnings || []).slice() : [last.err];
    return {
      inputs: inputs,
      outputs: outputs,
      units: units,
      model: {
        equations: ['Hammerschmidt: X = dT*M/(1297 + dT*M)', 'Nielsen-Bucklin: xw = exp(-dT/72), X = (1-xw)*M/((1-xw)*M + 18.015*xw)', 'msol = W*X/(Xlean - X)', 'mpure = msol*Xlean'],
        ranges: ['dT up to about 40 K', 'Hammerschmidt below about 25 wt%'],
        notes: ['GPSA Engineering Data Book 14th ed. (2017) Sect. 20; vapour and hydrocarbon-liquid losses excluded']
      },
      warnings: warnings
    };
  }
  var HANDOFF = {
    provides: ['mdot'],
    accepts: [],
    build: function () {
      if (!last || !last.ok) return null;
      return { quantities: { mdot: { value: last.msol, unit: 'kg/s' } }, sets: {} };
    },
    apply: function () {
      last = solve(state);
      if (ui) { ui.sync(); ui.run(); }
    }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'hydrate_inhibition',
        file: 'hydrate_inhibition.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
