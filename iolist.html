/* The grid enters a range in the display unit and the state keeps SI. `_du`
   records the unit the boxes were last written in, so changing the unit
   reinterprets the SI value instead of rescaling it. */
function isNum(x) { return typeof x === 'number' && isFinite(x); }
function syncRange(p) {
  var u = unitTuple(p.quantity, p.display_unit) || [null, 1, 0];
  var tag = (u[0] == null ? 'SI' : u[0]) + '|' + (p.quantity || '');
  if (p._du === tag) {
    p.range_lo = isNum(p.lo_d) ? u[1] * p.lo_d + u[2] : null;
    p.range_hi = isNum(p.hi_d) ? u[1] * p.hi_d + u[2] : null;
  }
  p.lo_d = isNum(p.range_lo) ? (p.range_lo - u[2]) / u[1] : null;
  p.hi_d = isNum(p.range_hi) ? (p.range_hi - u[2]) / u[1] : null;
  p._du = tag;
}
function syncAll(s) { (s.points || []).forEach(syncRange); return s; }
function clone(x) { return JSON.parse(JSON.stringify(x)); }
function presetState(id) { return syncAll(clone(PRESETS[id])); }

/* Overwrite a state object in place with a preset, key by key, so every holder of
   that object sees the new list. */
function adoptPreset(st, id) {
  var src = presetState(id);
  Object.keys(st).forEach(function (k) { if (!Object.prototype.hasOwnProperty.call(src, k)) delete st[k]; });
  Object.keys(src).forEach(function (k) { st[k] = src[k]; });

}

   helpers are regenerated on arrival, so the link never disagrees with SI. */
function compactState() {
  var s = clone(state);
  (s.points || []).forEach(function (p) { delete p.lo_d; delete p.hi_d; delete p._du; if (p.extra == null) delete p.extra; });
  return s;
}
function expandState(o) {
  var s = (o && typeof o === 'object') ? o : {};
  ['settings', 'controllers', 'card_types', 'installed', 'points', 'refs', 'baseline', 'project', 'schema'].forEach(function (k) {
    if (Object.prototype.hasOwnProperty.call(s, k)) state[k] = s[k];

  last = evaluate(state);

}

var UNIT_OPTS = [['', T('opt_none')]].concat(DISPLAY_UNITS.map(function (u) { return [u, u]; }));

function pct(x, d) { return x == null ? '—' : nfmt(100 * x, d == null ? 1 : d) + ' %'; }
function rangeText(p, lg) {
  if (!isNum(p.range_lo) || !isNum(p.range_hi)) return '—';
  var u = unitTuple(p.quantity, p.display_unit);
  if (!u) return sig4(p.range_lo, lg) + ' … ' + sig4(p.range_hi, lg) + ' ' + (p.quantity && QUANTITY[p.quantity] ? QUANTITY[p.quantity].si : '');
  return sig4((p.range_lo - u[2]) / u[1], lg) + ' … ' + sig4((p.range_hi - u[2]) / u[1], lg) + ' ' + u[0];

/* ------------------------------------------------------------- results */
function payload(r, s) {
  if (!s.points || !s.points.length) return null;
  var lg = lang;
  var vk = r.verdict === 'blocked' ? 'vBlocked' : r.verdict === 'review' ? 'vReview' : r.verdict === 'clear' ? 'vClear' : 'vEmpty';
  var tone = r.verdict === 'blocked' ? 'bad' : r.verdict === 'review' ? 'warn' : 'ok';
  var n = r.verdict === 'blocked' ? r.severity.blocker : r.severity.major;

  var ctrlIds = s.controllers.map(function (k) { return k.id; });
  var seenC = Object.keys(r.counts.by_controller);
  var cols = ctrlIds.filter(function (c) { return seenC.indexOf(c) >= 0; });
  if (seenC.indexOf('unassigned') >= 0) cols.push('unassigned');
  var countRows = SIGNAL_TYPES.filter(function (t) { return r.counts.total[t] > 0; }).map(function (t) {
    var cells = [t];
    cols.forEach(function (c) { cells.push({ value: (r.counts.by_controller[c] || {})[t] || 0, precision: 0 }); });
    cells.push({ value: r.counts.total[t], precision: 0 });
    return { cells: cells };
  });

  var cardRows = r.groupOrder.map(function (key) {
    var g = r.groupsOut[key];
    return { cells: [{ text: key, wrap: true }, { value: g.n, precision: 0 }, { value: g.C, precision: 0 },
                     { text: g.spare_frac == null ? '—' : pct(g.spare_frac) }],
             tone: r.groups[key].below_target ? 'warn' : '' };
  });
  var ctrlRows = Object.keys(r.controllers).map(function (c) {
    var k = r.controllers[c];
    return { cells: [c, { value: k.cards, precision: 0 }, { value: k.channels, precision: 0 },
                     { text: k.spare_frac == null ? '—' : pct(k.spare_frac) }],
             tone: k.below_target ? 'warn' : '' };
  });

  var mapAll = mapRows(r, lg);
  var mapShown = mapAll.slice(0, 200);
  var ne = ne43Rows(r, lg);
  var findRows = r.findings.map(function (f) {
    return { cells: [f.rule, { text: sevLabel(f.severity, lg) }, { text: f.target || '—' }, { text: ruleDetail(f, lg), wrap: true }],
             tone: f.severity === 'blocker' ? 'bad' : f.severity === 'major' ? 'warn' : '' };
  });

  var notes = [];
  if (!s.controllers.length || !s.card_types.length) notes.push(L('noteNone'));
  if (r.totals.unallocated) notes.push(fill(L('noteUnalloc'), { n: r.totals.unallocated }));
  var link = linkLength();
  if (link > 4096) notes.push(fill(L('noteLink'), { n: nfmt(link, 0) }));

  var tables = [
    { title: T('tblCounts'), head: [T('cSigType')].concat(cols.map(function (c) { return { label: c === 'unassigned' ? L('hUnassigned') : c, num: true }; })).concat([{ label: L('hTotal'), num: true }]), rows: countRows },
    { title: T('tblCards'), head: [{ label: L('fCardType'), wrap: true }, { label: L('hN'), num: true }, { label: L('hCused'), num: true }, { label: L('hSparePc'), num: true }], rows: cardRows },
    { title: T('tblControllers'), head: [T('fController'), { label: L('tCards'), num: true }, { label: L('tChannels'), num: true }, { label: L('hSparePc'), num: true }], rows: ctrlRows },
    { title: T('tblFindings'), head: [T('hRule'), T('hSeverity'), T('hTarget2'), { label: L('hDetail'), wrap: true }], rows: findRows },
    { title: T('tblMap'), head: [T('cAddress'), T('cTag'), T('cSigType'), T('cRange')], rows: mapShown, sticky: true, maxHeight: 420 }
  ];
  if (ne.length) tables.push({ title: T('tblNE43'), head: [T('cTag'), { label: L('hFailLo'), num: true }, { label: L('hSatLo'), num: true }, { label: L('hSatHi'), num: true }, { label: L('hFailHi'), num: true }], rows: ne });
  var fl = flagRows(lg);
  if (fl.length) tables.push({ title: T('panelFlags'), head: [T('cTag'), T('cFlags'), { label: L('hDetail'), wrap: true }], rows: fl });

  return {
    verdict: { tone: tone, text: fill(tx(T(vk)), { n: n }) },
    filter: mapAll.length > mapShown.length ? { shown: mapShown.length, total: mapAll.length } : null,
    tiles: [
      { label: T('tSignals'), value: r.totals.points, precision: 0, hint: fill(tx(T('tFieldbus')), {}) + ': ' + r.totals.fieldbus },
      { label: T('tCards'), value: r.totals.cards, precision: 0 },
      { label: T('tSpare'), value: r.totals.spare_frac == null ? null : 100 * r.totals.spare_frac, precision: 1, unit: '%',
        tone: r.totals.spare_frac != null && r.totals.spare_frac < s.settings.default_spare ? 'warn' : 'ok' },
      { label: T('tChannels'), value: r.totals.channels, precision: 0, headline: false },
      { label: T('tBlockers'), value: r.severity.blocker, precision: 0, tone: r.severity.blocker ? 'bad' : 'ok', headline: false },
      { label: T('tMajors'), value: r.severity.major, precision: 0, tone: r.severity.major ? 'warn' : 'ok', headline: false }
    ],
    meters: r.totals.channels ? [{ label: T('tSpare'), ratio: r.totals.spare_frac / Math.max(1e-9, s.settings.default_spare),
        text: pct(r.totals.spare_frac) + ' / ' + pct(s.settings.default_spare, 0) }] : [],
    tables: tables,
    notes: notes
  };
}

function mapRows(r, lg) {
  var rows = r.state.points.map(function (p, i) {
    return { p: p, a: r.alloc[i], key: r.keys[i] };
  });
  rows.sort(function (a, b) {
    var aa = a.a.address, bb = b.a.address;
    if (!aa && !bb) return a.key < b.key ? -1 : a.key > b.key ? 1 : 0;
    if (!aa) return 1; if (!bb) return -1;
    if (a.a.ctrl !== b.a.ctrl) return a.a.ctrl < b.a.ctrl ? -1 : 1;
    if (a.a.rack !== b.a.rack) return a.a.rack - b.a.rack;
    if (a.a.card !== b.a.card) return a.a.card - b.a.card;
    return a.a.channel - b.a.channel;
  });
  return rows.map(function (x) {
    return { cells: [x.a.address || '—', x.p.tag || '—', x.p.signal_type, { text: rangeText(x.p, lg) }],
             tone: x.a.address ? '' : 'warn' };

}
function ne43Rows(r, lg) {
  var out = [];
  Object.keys(r.ne43).forEach(function (k) {
    var idx = -1;
    for (var i = 0; i < r.keys.length; i++) if (r.keys[i] === k) { idx = i; break; }
    if (idx < 0) return;
    var p = r.state.points[idx], n = r.ne43[k], u = unitTuple(p.quantity, p.display_unit);
    function d(v) { return u ? sig4((v - u[2]) / u[1], lg) : sig4(v, lg); }
    out.push({ cells: [k, { text: d(n.x_fail_lo) }, { text: d(n.x_sat_lo) }, { text: d(n.x_sat_hi) }, { text: d(n.x_fail_hi) }] });
  });
  out.sort(function (a, b) { return a.cells[0] < b.cells[0] ? -1 : 1; });
  return out;
}

/* ------------------------------------------------- the card occupancy map */
function themeColours() {

  function g(n, d) { return (cs.getPropertyValue(n) || '').trim() || d; }
  return { muted: g('--muted', '#6b7280'), line: g('--line', '#d8dbe0'), card: g('--card', '#ffffff'),
           text: g('--text', '#1c2024'), bad: g('--bad', '#c0392b'), warn: g('--warn', '#c07a10'),
           font: g('--font', 'system-ui, sans-serif'),
           series: [0, 1, 2, 3, 4].map(function (i) { try { return DiagramUI.series(i); } catch (e) { return ['#2f6f9f', '#7a9f2f', '#9f5a2f', '#6a4f9f', '#2f9f8f'][i]; } }) };
}
var TYPE_COLOUR_INDEX = omap({ DI: 0, DO: 1, AI: 2, AO: 3, PI: 4 });

/* One band per controller, one column per card, one cell per channel.
   The same code draws the screen stage and the report figure. */
function figureLayout(r, width) {
  var CW = 24, CH = 10, GAP = 8, PAD = 10, HEAD = 18, BAND = 20;
  var bands = [], y = PAD + 6;
  Object.keys(r.controllers).forEach(function (cid) {
    var cards = [];
    r.groupOrder.forEach(function (key) {
      var g = r.groups[key];
      if (g.ctrl !== cid || !g.slots) return;
      g.cards.forEach(function (list, ci) {
        cards.push({ group: key, ct: g.ct, c: g.c, slot: g.slots[ci], points: list.slice() });
      });
    });
    cards.sort(function (a, b) { return a.slot.rack !== b.slot.rack ? a.slot.rack - b.slot.rack : a.slot.slot - b.slot.slot; });
    var perRow = Math.max(1, Math.floor((width - 2 * PAD) / (CW + GAP)));
    var rowsOfCards = [];
    for (var i = 0; i < cards.length; i += perRow) rowsOfCards.push(cards.slice(i, i + perRow));
    var band = { ctrl: cid, y: y, rows: [] };
    y += BAND;
    rowsOfCards.forEach(function (rowCards) {
      var maxC = rowCards.reduce(function (a, c) { return Math.max(a, c.c); }, 1);
      band.rows.push({ y: y, cards: rowCards, height: HEAD + maxC * CH });
      y += HEAD + maxC * CH + 14;
    });
    if (!rowsOfCards.length) y += 8;
    bands.push(band);
    y += 6;
  });
  var used = CHANNEL_TYPES.length * 40 + PAD;        /* the legend is the minimum width */
  bands.forEach(function (band) {
    band.rows.forEach(function (row) { used = Math.max(used, PAD + row.cards.length * (CW + GAP)); });
  });
  return { bands: bands, height: Math.max(120, y + PAD), width: Math.min(width, used + PAD),
           CW: CW, CH: CH, GAP: GAP, PAD: PAD, HEAD: HEAD };
}
function drawFigure(c2, r, w, h, col) {
  var Lo = figureLayout(r, w);
  var vgIndex = omap(), vgN = 0;
  r.state.points.forEach(function (p) { var v = String(p.voting_group || '').trim(); if (v && !vgIndex[v]) vgIndex[v] = ++vgN; });
  var badCards = omap();
  r.findings.forEach(function (f) { if (f.rule === 'IOL-R-023' && f.card) badCards[f.card] = 1; });
  c2.font = '400 10px ' + col.font;
  c2.textBaseline = 'middle';
  Lo.bands.forEach(function (band) {
    c2.fillStyle = col.text; c2.textAlign = 'left'; c2.font = '600 12px ' + col.font;
    c2.fillText(band.ctrl, Lo.PAD, band.y + 8);
    c2.font = '400 9px ' + col.font;
    band.rows.forEach(function (row) {
      row.cards.forEach(function (card, ci) {
        var x = Lo.PAD + ci * (Lo.CW + Lo.GAP), y0 = row.y + Lo.HEAD;
        c2.fillStyle = col.muted; c2.textAlign = 'center';
        c2.fillText('R' + card.slot.rack + 'S' + card.slot.slot, x + Lo.CW / 2, row.y + 6);
        c2.fillText(card.ct.length > 6 ? card.ct.slice(0, 6) : card.ct, x + Lo.CW / 2, row.y + 15);
        var filled = {};
        card.points.slice().sort(function (a, b) { var ka = r.keys[a], kb = r.keys[b]; if (ka !== kb) return ka < kb ? -1 : 1; return a - b; })
          .forEach(function (pi, n) { filled[n] = pi; });
        for (var ch = 0; ch < card.c; ch++) {
          var yy = y0 + ch * Lo.CH, pi = filled[ch];
          if (pi === undefined) {
            c2.strokeStyle = col.line; c2.lineWidth = 1;
            c2.strokeRect(x + 0.5, yy + 0.5, Lo.CW - 1, Lo.CH - 1);
          } else {
            var p = r.state.points[pi];
            c2.fillStyle = col.series[TYPE_COLOUR_INDEX[p.signal_type] || 0];
            c2.fillRect(x, yy, Lo.CW, Lo.CH);
            c2.fillStyle = '#ffffff'; c2.textAlign = 'left';
            c2.fillText(GLYPH[p.signal_type] || '?', x + 3, yy + Lo.CH / 2 + 0.5);
            var v = String(p.voting_group || '').trim();
            if (v) { c2.textAlign = 'right'; c2.fillText(String(vgIndex[v]), x + Lo.CW - 3, yy + Lo.CH / 2 + 0.5); }
            c2.textAlign = 'center';
          }
        }
        var cardKey = band.ctrl + '/R' + card.slot.rack + '/S' + card.slot.slot;
        if (badCards[cardKey]) {
          c2.strokeStyle = col.bad; c2.lineWidth = 2;
          c2.strokeRect(x - 1, y0 - 1, Lo.CW + 2, card.c * Lo.CH + 2);
        }
      });
    });
  });
  /* legend: the glyph is what carries the type in greyscale, so it is named */
  var lx = Lo.PAD, ly = Lo.height - 12;
  c2.textAlign = 'left'; c2.font = '400 10px ' + col.font;
  CHANNEL_TYPES.forEach(function (t) {
    c2.fillStyle = col.series[TYPE_COLOUR_INDEX[t]];
    c2.fillRect(lx, ly - 5, 10, 10);
    c2.fillStyle = '#ffffff'; c2.fillText(GLYPH[t], lx + 2.5, ly + 0.5);
    c2.fillStyle = col.muted; c2.fillText(t, lx + 14, ly + 0.5);
    lx += 40;
  });
}
function figureBox(r, w) { var L = figureLayout(r, w); return { w: L.width, h: L.height }; }

  });

}

/* ------------------------------------------------------- tab-separated paste */
var COL_ORDER = ['tag', 'description', 'system_id', 'signal_type', 'electrical_type', 'bus_protocol', 'quantity',
                 'range_lo', 'range_hi', 'display_unit', 'eng_unit', 'fail_state', 'sil', 'is', 'controller_id',
                 'voting_group', 'notes'];
function importRows(text) {
  var lines = String(text || '').split(/\r?\n/).filter(function (l) { return l.trim() !== ''; });
  if (!lines.length) return;
  var delim = (lines[0].indexOf('\t') >= 0) ? '\t' : ',';
  var head = lines[0].split(delim).map(function (x) { return x.trim().toLowerCase(); });
  var hasHeader = head.indexOf('tag') >= 0;
  var body = hasHeader ? lines.slice(1) : lines;
  var order = hasHeader ? head.map(function (h) { return COL_ORDER.indexOf(h) >= 0 ? h : (h === 'is' ? 'is' : null); }) : COL_ORDER;
  var rows = [], bad = {};
  body.forEach(function (line) {
    var cells = line.split(delim), row = {};
    COL_ORDER.forEach(function (k) { row[k] = ''; });
    cells.forEach(function (v, i) { var k = order[i]; if (k) row[k] = String(v).trim(); });
    var p = {
      tag: row.tag, description: row.description, system_id: row.system_id,
      signal_type: SIGNAL_TYPES.indexOf(row.signal_type.toUpperCase()) >= 0 ? row.signal_type.toUpperCase() : (bad[row.signal_type] = 1, ''),
      electrical_type: ELEC_IDS.indexOf(row.electrical_type) >= 0 ? row.electrical_type : (row.electrical_type ? (bad[row.electrical_type] = 1, '') : ''),
      bus_protocol: row.bus_protocol,
      quantity: QUANTITY_IDS.indexOf(row.quantity) >= 0 ? row.quantity : (row.quantity ? (bad[row.quantity] = 1, null) : null),
      range_lo: row.range_lo === '' ? null : parseFloat(String(row.range_lo).replace(',', '.')),
      range_hi: row.range_hi === '' ? null : parseFloat(String(row.range_hi).replace(',', '.')),
      display_unit: DISPLAY_UNITS.indexOf(row.display_unit) >= 0 ? row.display_unit : (row.display_unit ? (bad[row.display_unit] = 1, '') : ''),
      eng_unit: row.eng_unit,
      fail_state: FAIL_STATES.indexOf(row.fail_state) >= 0 ? row.fail_state : (row.fail_state ? (bad[row.fail_state] = 1, 'none') : 'none'),
      sil: /^(1|true|y|yes|sil)$/i.test(row.sil), is: /^(1|true|y|yes|is|ex ?i)$/i.test(row.is),
      controller_id: row.controller_id, voting_group: row.voting_group, notes: row.notes
    };
    if (!isFinite(p.range_lo)) p.range_lo = null;
    if (!isFinite(p.range_hi)) p.range_hi = null;
    rows.push(p);
  });
  if (!rows.length) return;
  state.points = rows;
  syncAll(state);
  last = evaluate(state);
  resync();
  try { Diagram.notify(fill(L('pasteDone'), { n: rows.length, bad: Object.keys(bad).join(', ') || '—' }), 'ok'); } catch (e) {}
}
function linkLength() {
  try { return String(Diagram.state.encode(compactState()) || '').length; } catch (e) { return 0; }
}

      signals: pts, counts: r.counts, groups: r.groupsOut, controllers: r.controllers, ne43: r.ne43,

      refs: r.state.refs, flags: pkgFlagsForReport(lg), state: compactState()

      method: 'ISA-5.1 letter parse, IEC 61131-2 electrical-type families, NAMUR NE 43 loop levels, deterministic card allocation with spare targets and segregation',
      /* Each equation is kept at or under 45 characters: a longer line is the

      equations: ['tag_key(t) = upper(trim(t)), [ws|_]+ -> "-"',
                  'C_req = max(ceil(n / (c (1 - s)) - 1e-9), V)',
                  'x(I) = lo + (I - 4 mA) / 16 mA * (hi - lo)',
                  'rack = floor(g / S) + 1, slot = g mod S + 1',

}

function reportProfile(rec, ctx) {
  var lg = (ctx && ctx.domainLang) || lang;
  var o = rec.outputs || {}, inp = rec.inputs || {}, rc = rec.report_context || {};
  /* the sheet's table headings wrap in a 60 to 120 px cell as well: same
     soft hyphens, in the language the sheet is printed in */
  function R(k) { var h = HYPH[k], v = h ? h[lg] : null; if (typeof v === 'string' && v) return v;
                  var x = I18N[k] || {}; return x[lg] || x.en || k; }
  function row(label, value, unit, note) { return { label: label, value: value, unit: unit || '', note: note || '' }; }
  function txt(label, text, note) { return { label: label, text: text, note: note || '' }; }

  var find = rc.findings || [];
  var blockers = find.filter(function (f) { return f.severity === 'blocker'; });
  var checks = blockers.map(function (f) {
    return { status: 'fail', title: f.rule + ' · ' + (f.target || '—'), detail: f.detail,
             actual: f.target || '—', criterion: R('sevBlocker'), basis: 'SPEC-iolist ' + f.rule };
  });
  if (!checks.length) checks.push({ status: 'pass', title: R('vClear'),
    detail: R('tblFindings') + ': ' + (o.majors || 0) + ' ' + R('sevMajor') + ', ' + (o.minors || 0) + ' ' + R('sevMinor'),
    actual: '0', criterion: '0 ' + R('sevBlocker') + ', 0 ' + R('sevMajor') });

  var risks = find.filter(function (f) { return f.severity !== 'blocker'; }).slice(0, 80).map(function (f) {
    return { status: f.severity === 'major' ? 'attention' : 'info', title: f.rule + ' · ' + (f.target || '—'),
             detail: f.detail, basis: 'SPEC-iolist ' + f.rule };
  });

  var inputs = [];
  /* The channel address leads each line because it is unique: two identical
     digital inputs would otherwise print the same sentence twice. */
  (rc.signals || []).forEach(function (p) {
    inputs.push(txt(p.tag || '—',
      (p.address || p.tag || '—') + ' · ' + p.signal_type + ' · ' + elecLabel(p.electrical_type, lg) + ' · ' + failLabel(p.fail_state, lg) +
      (isNum(p.range_lo) && isNum(p.range_hi) ? ' · ' + rangeText(p, lg) : ''),
      (p.description || '—') + ' · ' + (p.system_id || '—') + (p.voting_group ? ' · ' + p.voting_group : '')));
    inputs[inputs.length - 1].group = (p.controller || R('hUnassigned'));
  });

  return {
    title: R('title'),
    project: [ txt(R('fName'), inp.project || '—'),
               txt(R('panelControllers'), String(inp.controllers_defined)),
               txt(R('panelCardTypes'), String(inp.card_types_defined)),
               txt(R('mSpareLabel'), nfmt(100 * inp.default_spare, 0, lg) + ' %') ],
    executive: {
      text: [R('genreText')],
      results: [ row(R('tSignals'), o.signals), row(R('tCards'), o.cards),
                 row(R('tChannels'), o.channels_installed),
                 /* The engine's own number format carries four significant digits, so this
                    fraction read 69.6 on the screen tile and 69.64 on paper. The sheet's own
                    formatter is used instead: one decimal, as everywhere else in this report,
                    and the decimal mark of the language the sheet is printed in. */
                 txt(R('tSpare'), o.spare_fraction == null ? '—' : nfmt(100 * o.spare_fraction, 1, lg) + ' %'),
                 row(R('tBlockers'), o.blockers), row(R('tMajors'), o.majors) ],
      conclusion: fill(R(o.verdict === 'blocked' ? 'vBlocked' : o.verdict === 'review' ? 'vReview' : o.verdict === 'clear' ? 'vClear' : 'vEmpty'),
                       { n: o.verdict === 'blocked' ? o.blockers : o.majors })
    },
    results: SIGNAL_TYPES.filter(function (t) { return (rc.counts.total || {})[t]; })
      .map(function (t) { return row(sigLabel(t, lg), rc.counts.total[t]); })
      .concat([ row(R('cSil'), o.sil_signals), row(R('cIs'), o.is_signals),
                row(R('hAllocated'), o.allocated), row(R('hUnalloc'), o.unallocated) ]),
    checks: checks,
    risks: risks,
    figures: reportFigures(ctx, lg),
    /* The record keeps its English machine prose; the sheet prints the same
       statements in the document language. */
    method: {
      equations: rec.model.equations,
      /* Nothing here restates the manifest limitations, which the engine prints
         at the end of the same sheet. */
      ranges: ['mRange1'].map(R),
      notes: ['mNote5', 'mNote8', 'mNote6', 'mNote7'].map(R),
      references: rec.model.references
    },
    inputs: inputs
  };
}

function reportFigures(ctx, lg) {
  if (!ctx || typeof ctx.figure !== 'function' || !last) return [];
  try {
    /* The canvas is cut to the drawing, not to the text column: a 5-card band
       on an 820 px canvas prints as a stamp in a field of white. */
    var box = figureBox(last, 820), w = box.w, h = Math.min(980, box.h), scale = 2;
    var cv = document.createElement('canvas');
    cv.width = w * scale; cv.height = h * scale;
    var c2 = cv.getContext('2d');
    c2.setTransform(scale, 0, 0, scale, 0, 0);
    var col = themeColours();
    c2.fillStyle = '#ffffff'; c2.fillRect(0, 0, w, h);
    drawFigure(c2, last, w, h, col);
    var f = ctx.figure(cv, { caption: tx(T('figCaption'), lg), alt: (I18N.figAlt[lg] || I18N.figAlt.en) });
    return f ? [f] : [];
  } catch (e) { return []; }
}

    }) });
  out.push({ title: R('tblMap'),
    head: [R('cAddress'), R('cTag'), R('cDesc'), R('cSigType'), R('cElecType'), R('cRange'), R('cFail'), R('cSil'), R('cIs'), R('cVg'), R('cSystem')],

             [fill(R('refLimits'), { n: '' }).replace(/:\s*$/, ''), String((refs.limits || []).length)],

function PKG_OK() { return !!(window.DiagramProject && window.DiagramProject.api === 'tools.petrov.re/project-package/v1'); }

var pkgBox = null, pkgLines = [], pkgConflictBox = null;

/* ---- read mapping (SPEC-iolist 7.2) ---- */
function refsFromPackage(p) {
  var refs = { source: null, systems: [], tags: [], limits: [], voted: [] };
  var unparsed = [], unused = [];
  var st = p && p.structure;
  if (st && Array.isArray(st.systems)) refs.systems = st.systems.map(function (s) { return String(s.id || ''); }).filter(Boolean);
  if (st && Array.isArray(st.packages) && st.packages.length) unused.push('structure.packages');
  (Array.isArray(p && p.control_functions) ? p.control_functions : []).forEach(function (fn) {
    var from = String(fn.id || '');
    (Array.isArray(fn.io_tags) ? fn.io_tags : []).forEach(function (t) {
      if (String(t || '').trim()) refs.tags.push({ tag: String(t), from: from });
    });
    (Array.isArray(fn.setpoints) ? fn.setpoints : []).forEach(function (sp) {
      var tag = String(sp.tag || '').trim();
      if (!tag) return;
      refs.tags.push({ tag: tag, from: from });
      if (typeof sp.value === 'number' && isFinite(sp.value))
        refs.limits.push({ tag: tag, value: sp.value, unit: String(sp.unit || ''), op: 'sp', from: from,
                           label: String(sp.label || sp.id || '') });
    });
  });
  (Array.isArray(p && p.cause_effect) ? p.cause_effect : []).forEach(function (m) {
    var mid = String(m.id || '');
    (Array.isArray(m.causes) ? m.causes : []).forEach(function (c, ci) {
      var tags = Array.isArray(c.tags) ? c.tags : (c.tag ? [c.tag] : []);
      var from = mid + '/' + (c.id || (ci + 1));
      tags.forEach(function (t) { if (String(t || '').trim()) refs.tags.push({ tag: String(t), from: mid }); });
      var cond = c.condition;
      var numeric = cond && typeof cond === 'object' && ['>', '>=', '<', '<='].indexOf(String(cond.op)) >= 0 &&
                    typeof cond.value === 'number' && isFinite(cond.value);
      if (numeric) tags.forEach(function (t) {
        refs.limits.push({ tag: String(t), value: cond.value, unit: String(cond.unit || ''), op: String(cond.op),
                           from: from, label: String(c.label || c.id || '') });
      });
      else if (cond != null) unparsed.push(from);
      if (tags.length >= 2) refs.voted.push({ from: from, tags: tags.map(String), voting: String(c.voting || '') });
    });
    (Array.isArray(m.effects) ? m.effects : []).forEach(function (e) {
      if (String(e.tag || '').trim()) refs.tags.push({ tag: String(e.tag), from: mid });
    });

  return { refs: refs, unparsed: unparsed, unused: unused };
}

var POINT_FIELDS = ['tag', 'description', 'system_id', 'signal_type', 'electrical_type', 'bus_protocol', 'quantity',

var ITEM_KNOWN = ['id', 'tag', 'label', 'system_id', 'signal_type', 'electrical_type', 'bus_protocol', 'quantity',

function pkgPaint() {

  var lines = [];
  if (!PKG_OK() || !DiagramProject.storageOk()) lines.push(Pt('pkgStorageOff'));
  else {
    var m = null;

    if (m) lines.push(Pt('pkgAvail', { project: m.project || '—', rev: m.revision,

    el.textContent = t;

function pkgSay(list) { pkgLines = (list || []).filter(Boolean); pkgPaint(); }

function applyPackage(p, ignored) {

    state.project = { name: String(p.project.name || ''), reference: String(p.project.reference || '') };
    applied.push('project');
    unusedFields.push('project.acceptance_authority, project.evidence_owner, project.project_type, project.lifecycle, project.gate');
  }
  var R = refsFromPackage(p);
  state.refs = R.refs;
  state.refs.source = { package_id: String(p.package_id || ''), package_revision: p.package_revision,
                        loaded_at: new Date().toISOString().replace(/\.\d{3}Z$/, 'Z') };
  if (R.refs.systems.length) applied.push('structure.systems');
  if (R.refs.tags.length) applied.push('control_functions / cause_effect');
  unusedFields = unusedFields.concat(R.unused);

  pkgFlags = []; pkgOtherFlagCount = 0;
  (Array.isArray(p.flags) ? p.flags : []).forEach(function (f) {

      var missing = missingIds(proposed);

    } else if (differs(state.points, proposed)) {
      pkgPending = proposed;
      msgs.push(Pt('pkgConflict', { n: conflictCount(state.points, proposed) }));
    } else { state.points = proposed; syncAll(state); applied.push('io_points'); }
  }

  if (applied.length) msgs.unshift(Pt('pkgApplied', { list: applied.join(', ') }));
  msgs.push(ignored && ignored.length ? Pt('pkgIgnored', { list: secLabels(ignored) }) : Pt('pkgIgnoredNone'));
  if (unusedFields.length) msgs.push(Pt('pkgUnused', { list: unusedFields.join('; ') }));
  if (R.unparsed.length) msgs.push(Pt('pkgUnparsed', { n: R.unparsed.length, list: R.unparsed.join(', ') }));

function missingIds(pts) {
  var ids = omap(), ct = omap();
  state.controllers.forEach(function (k) { ids[k.id] = 1; });
  var out = omap();
  pts.forEach(function (p) { if (p.controller_id && !ids[p.controller_id]) out[p.controller_id] = 1; });
  return Object.keys(out).sort();
}
function differs(a, b) { return conflictCount(a, b) > 0; }

  var byA = omap(), byB = omap(), n = 0;
  a.forEach(function (p) { byA[tagKey(p.tag)] = p; });
  b.forEach(function (p) { byB[tagKey(p.tag)] = p; });
  var all = omap();
  Object.keys(byA).forEach(function (k) { all[k] = 1; });
  Object.keys(byB).forEach(function (k) { all[k] = 1; });
  Object.keys(all).forEach(function (k) {
    var x = byA[k], y = byB[k];
    if (!x || !y) { n++; return; }
    for (var i = 0; i < POINT_FIELDS.length; i++)
      if (String(x[POINT_FIELDS[i]] == null ? '' : x[POINT_FIELDS[i]]) !== String(y[POINT_FIELDS[i]] == null ? '' : y[POINT_FIELDS[i]])) { n++; return; }
  });
  return n;
}

function pkgLoadNow() {
  if (!PKG_OK()) { pkgSay([Pt('pkgStorageOff')]); return null; }
  var r = null;
  try { r = DiagramProject.load(); } catch (e) { r = null; }
  if (!r) { pkgSay([Pt('pkgNone')]); return null; }
  pkgLoaded = r.package;
  var msgs = applyPackage(r.package, r.ignored);
  last = evaluate(state);
  pushOrphanFlags(msgs);
  resync();
  pkgSay(msgs);
  return r;
}
function pkgUsePackagePoints() {

  state.points = pkgPending; pkgPending = null; syncAll(state);
  last = evaluate(state);
  var msgs = [Pt('pkgApplied', { list: 'io_points' })];
  if (missing.length) msgs.push(Pt('pkgMissingIds', { list: missing.join(', ') }));
  pushOrphanFlags(msgs);

}
function pkgKeepMine() { pkgPending = null; pkgSay([Pt('pkgKeepMine')]); }

function pkgSaveNow() {
  if (!PKG_OK()) { pkgSay([Pt('pkgStorageOff')]); return null; }
  var r = (last = evaluate(state));          /* write what the list says now */
  if (!r.package_savable) {
    /* The tool refuses before calling save(): a colliding id would hand two
       different signals one identity in the register (package contract 2.3). */
    var empty = [], keys = {};
    r.findings.forEach(function (f) {
      if (f.rule === 'IOL-R-001') empty.push(f.vars.row);
      if (f.rule === 'IOL-R-002') keys[f.target] = 1;
    });
    pkgSay([Pt('pkgRefusedOwn', { empty: empty.join(', ') || '—', keys: Object.keys(keys).join(', ') || '—' })]);
    return { ok: false, reason: 'own-refusal' };
  }
  var patch = { io_points: r.state.points.map(function (p, i) { return itemFromPoint(p, i, r); }) };
  var w = null;
  try { w = DiagramProject.save(patch); } catch (e) { w = null; }
  if (!w || !w.ok) {
    if (w && w.reason === 'rejected') pkgSay([Pt('pkgRefused', { list: secLabels(w.rejected) })]);
    else pkgSay([Pt(w && w.reason === 'quota' ? 'pkgQuota' : 'pkgStorageOff')]);
    return w;
  }
  var msgs = [Pt('pkgSaved', { list: secLabels(w.written), rev: w.package_revision })];
  if (!w.stored) msgs.push(Pt(w.reason === 'quota' ? 'pkgQuota' : 'pkgStorageOff'));

}
function pkgExportNow() {

  var r = DiagramProject.exportFile();

  if (!r) pkgSay([Pt('pkgStorageOff')]);
  return r;
}
function pkgImportNow(text) {

  DiagramProject.importFile(String(text || '')).then(function (r) {
    if (!r || r.error || !r.package) { pkgSay([Pt('pkgBadFile')]); return; }
    pkgLoaded = r.package;
    var msgs = applyPackage(r.package, r.ignored);
    last = evaluate(state);
    pushOrphanFlags(msgs);
    resync();
    pkgSay(msgs);

function normPath(p) {

function resolvePath(obj, path) {
  if (obj == null) return undefined;
  if (typeof obj === 'object' && Object.prototype.hasOwnProperty.call(obj, path)) return obj[path];
  var i = path.indexOf('.');
  while (i >= 0) {
    var head = path.slice(0, i), tail = path.slice(i + 1);
    if (obj && typeof obj === 'object' && Object.prototype.hasOwnProperty.call(obj, head)) {
      var sub = resolvePath(obj[head], tail);

    }
    i = path.indexOf('.', i + 1);
  }
  return undefined;
}
function deepEq(a, b) {
  if (a === b) return true;
  if (typeof a === 'number' && typeof b === 'number') return a === b || (isNaN(a) && isNaN(b));
  if (Array.isArray(a) && Array.isArray(b)) return a.length === b.length && a.every(function (x, i) { return deepEq(x, b[i]); });

  var fmap = {}, byRule = {}, sev = { blocker: 0, major: 0, minor: 0, info: 0 }, dup = [];
  out.findings.forEach(function (f) {

    if (Object.prototype.hasOwnProperty.call(fmap, k)) dup.push(k);

    view: {
      verdict: out.verdict,
      package_savable: out.package_savable,

      findings_by_rule: byRule,
      severity_counts: sev,
      letter: out.letter,
      counts: out.counts,

var TOL_GROUP = /^ints exact; spare_frac abs 1e-12/;
var TOL_NE43 = /^relative 1e-9 with absolute floor 1e-9\*span/;

function tolPlan(path, tolText, ref) {
  if (TOL_GROUP.test(tolText || '')) return { kind: 'group', abs: { spare_frac: 1e-12 } };
  if (TOL_NE43.test(tolText || '')) {
    /* span from the reference itself: x_sat_hi - x_sat_lo = 1.04375*span,
       because x(I) = lo + (I - 0.004)/0.016*span at 20.5 mA and 3.8 mA. */
    var span = null;
    if (ref && typeof ref === 'object' && typeof ref.x_sat_hi === 'number' && typeof ref.x_sat_lo === 'number')
      span = (ref.x_sat_hi - ref.x_sat_lo) / 1.04375;
    return { kind: 'ne43', rel: 1e-9, floor: span == null ? 0 : 1e-9 * Math.abs(span) };
  }
  return { kind: 'exact' };
}

  function track(r) { if (!r.ok) ok = false; if (r.rel != null && (worst == null || r.rel > worst)) worst = r.rel; }
  function walk(g, r, field) {
    if (typeof r === 'number' && typeof g === 'number') { track(numCmp(g, r, plan, field)); return; }
    if (Array.isArray(r)) {
      if (!Array.isArray(g) || g.length !== r.length) { ok = false; return; }
      r.forEach(function (x, i) { walk(g[i], x, field); });
      return;
    }
    if (r && typeof r === 'object') {
      if (!g || typeof g !== 'object' || Array.isArray(g)) { ok = false; return; }
      var kr = Object.keys(r).sort(), kg = Object.keys(g).sort();
      if (kr.length !== kg.length || kr.some(function (k, i) { return k !== kg[i]; })) { ok = false; return; }
      kr.forEach(function (k) { walk(g[k], r[k], k); });
      return;
    }
    if (g !== r) ok = false;
  }
  walk(got, ref, path);
  return { ok: ok, rel: worst };
}

function compareCheck(name, chk, view) {
  var ref = (chk && typeof chk === 'object' && 'ref' in chk) ? chk.ref : chk;
  var tolText = (chk && typeof chk === 'object' && typeof chk.tol === 'string') ? chk.tol : 'exact';
  var key = normPath(name);
  var got = resolvePath(view, key), note = '';
  if (got === undefined) { got = null; note = 'no output at path ' + key; }
  if (key === 'letter' || key.indexOf('letter.') === 0) {
    if (key === 'letter') {
      var gn = {}, rn = {};
      Object.keys(got || {}).forEach(function (k) { gn[k] = normLetter(got[k]); });
      Object.keys(ref || {}).forEach(function (k) { rn[k] = normLetter(ref[k]); });
      got = gn; ref = rn;
    } else { got = normLetter(got); ref = normLetter(ref); }
  }
  var plan = tolPlan(key, tolText, ref);
  var r = deepCmp(got, ref, plan, key);
  return {
    got: got, ref: ref, tol: tolText, rel: r.rel, ok: r.ok,
    graded: true, basis: (chk && chk.basis) || null,
    derivation: (chk && chk.derivation) || null,
    disputable: (chk && chk.disputable) === true,
    ref_source: 'recomputed', note: note
  };
}

async function sha256Hex(text) {
  try {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.prototype.map.call(new Uint8Array(buf), function (b) { return (b < 16 ? '0' : '') + b.toString(16); }).join('');
  } catch (e) { return null; }
}
async function benchmarkArtifact() {
  var resp;
  try { resp = await fetch(BENCH_REF_URL, { credentials: 'same-origin', cache: 'no-store' }); }
  catch (e) { throw new Error('Benchmark reference ' + BENCH_REF_URL + ' could not be loaded: ' + (e && e.message || e)); }
  if (!resp.ok) throw new Error('Benchmark reference ' + BENCH_REF_URL + ' could not be loaded: HTTP ' + resp.status);
  var text = await resp.text();
  var digest = await sha256Hex(text);
  var ref = JSON.parse(text);
  var totalChecks = 0, passedChecks = 0, flaggedChecks = 0;
  var cases = (ref.cases || []).map(function (c) {
    var inp = c.inputs || {};
    var st = (inp && typeof inp === 'object' && inp.state !== undefined) ? inp.state : inp;
    var out, err = null, bv = null;
    try { out = evaluatePublic(st); bv = benchView(out); }
    catch (e) { err = String(e && e.message || e); }
    var checks = c.checks || {}, cmp = {}, pass = true, flagged = false, notes = [];
    if (bv && bv.collapsed.length) notes.push('two findings share rule@target: ' + bv.collapsed.join(', '));
    Object.keys(checks).forEach(function (k) {
      totalChecks += 1;
      if (err) { cmp[k] = { got: null, ref: checks[k] && checks[k].ref, tol: checks[k] && checks[k].tol, rel: null, ok: false, graded: true, note: 'evaluation threw: ' + err }; pass = false; return; }
      var res = compareCheck(k, checks[k], bv.view);
      if (res.note) notes.push(res.note);
      if (res.ok) passedChecks += 1;
      else if (res.disputable) { flagged = true; flaggedChecks += 1; res.graded = false; res.status = 'flagged'; res.flag_note = 'the corpus marks this check disputable; it is recorded and left out of the pass count'; }
      else pass = false;
      cmp[k] = res;
    });
    if (!Object.keys(checks).length) { pass = false; notes.push('the case carries no checks'); }
    return {
      id: c.id, intent: c.intent || '',
      note: (c.intent ? c.intent : '') + (notes.length ? ' | ' + notes.join(' | ') : ''),
      inputs: inp, cmp: cmp,
      pass: pass && !flagged, flagged: flagged && pass,
      ref_source: 'recomputed'
    };
  });
  var passed = cases.filter(function (c) { return c.pass; }).length;
  var flaggedCases = cases.filter(function (c) { return c.flagged; }).length;
  var st = 0, stTotal = 0;
  try { var t = selfTests(); stTotal = t.length; st = t.filter(function (x) { return x.pass; }).length; } catch (e) {}
  return {
    schema: 'tools.petrov.re/benchmark-artifact/v1',
    tool: 'iolist', file: 'iolist.html',
    manifest_revision: MANIFEST.manifest_revision, build: MANIFEST.manifest_revision,
    run_at: new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'),
    reference_provenance: 'recomputed',
    provenance_note: 'Every reference value is re-derived in the corpus from SPEC-iolist and the cited standards by an author without access to this page; this run recomputes every check from the shipping build through window.__iolistEvaluate, and no stored result of this tool is reused.',
    reference: ref.reference || '',
    reference_citations: ref.reference_citations || [],
    reference_sha256: digest,
    tolerance: (ref.tolerance || '') + ' The adapter reads those sentences as: exact deep equality; spare_frac to absolute 1e-12 and every other group or controller field exact; NE 43 levels to relative 1e-9 with an absolute floor of 1e-9*span, span taken from the reference as (x_sat_hi - x_sat_lo)/1.04375. A letter `expected` list is compared as the set SPEC 4.2 defines, so both sides are sorted.',
    total: cases.length, passed: passed, failed: cases.length - passed - flaggedCases, flagged: flaggedCases,
    checks_total: totalChecks, checks_passed: passedChecks, checks_flagged: flaggedChecks,
    checks_failed: totalChecks - passedChecks - flaggedChecks,
    cases: cases,
    not_benchmarked: ref.not_benchmarked || [],
    coverage: ref.coverage || '',
    qa: {
      domain_tests: { status: stTotal && st === stTotal ? 'pass' : (stTotal ? 'fail' : 'not run'),
                      note: st + ' of ' + stTotal + ' page self-tests (window.__iolistTests) passed in this run.' },
      adapter: { status: 'pass', note: 'Each case state is evaluated with window.__iolistEvaluate, the same pure function the interface computes from; checks are resolved against the SPEC-iolist section 13 output paths through benchView().' }
    }
  };
}

/* ======================================== page self-tests (SPEC §9, §15) */
function selfTests() {
  var out = [];
  function eq(name, got, want) { out.push({ name: name, pass: JSON.stringify(got) === JSON.stringify(want), got: got, want: want }); }
  var e1 = evaluatePublic(clone(PRESETS['pump-skid-bpcs']));
  eq('preset pump-skid-bpcs verdict', e1.verdict, 'clear');
  eq('preset pump-skid-bpcs findings', e1.findings.length, 0);
  eq('preset pump-skid-bpcs controller', e1.controllers['BPCS-1'].cards, 5);
  eq('preset pump-skid-bpcs address', e1.address['HS-101'], 'BPCS-1/R1/S1/CH1');
  var e2 = evaluatePublic(clone(PRESETS['sis-2oo3-trip']));
  eq('preset sis-2oo3-trip verdict', e2.verdict, 'review');
  eq('preset sis-2oo3-trip rules', e2.findings.map(function (f) { return f.rule; }).sort(), ['IOL-R-035', 'IOL-R-037', 'IOL-R-037']);
  eq('preset sis-2oo3-trip voting cards', e2.groups['SIS-1/SAI8'].C, 3);
  eq('preset sis-2oo3-trip segregation', [e2.address['PT-201A'], e2.address['PT-201B'], e2.address['PT-201C']],
     ['SIS-1/R1/S1/CH1', 'SIS-1/R1/S2/CH1', 'SIS-1/R1/S3/CH1']);
  var e3 = evaluatePublic(clone(PRESETS['is-field-split']));
  eq('preset is-field-split verdict', e3.verdict, 'blocked');
  eq('preset is-field-split unallocated', e3.unallocated, ['XA-307', 'XY-304']);
  var e4 = evaluatePublic(clone(PRESETS['brownfield-fixed-cards']));
  eq('preset brownfield verdict', e4.verdict, 'blocked');
  eq('preset brownfield severities',
     ['blocker', 'major', 'minor', 'info'].map(function (s) { return e4.findings.filter(function (f) { return f.severity === s; }).length; }),
     [1, 6, 2, 16]);
  eq('preset brownfield spare', e4.controllers['PLC-EX'].spare, 7);
  /* SPEC 4.2 worked parses */
  [['10-TT-101A', 'TT'], ['TT101', 'TT'], ['U10-FT-3', 'FT'], ['PT-101.PV', 'PT'], ['PT-10A-3', 'PT'],
   ['XV-101-ZSO', 'XV'], ['P-101', 'P']].forEach(function (x) {
    eq('parse ' + x[0], (parseLetters(x[0]) || {}).code, x[1]);
  });
  eq('E(S,E) carries PI', parseLetters('SE-1').expected.slice().sort(), ['AI', 'FB', 'PI']);
  eq('E(X,V) is discrete', parseLetters('XV-1').expected.slice().sort(), ['DO', 'FB']);
  /* SPEC 4.4 the 1e-9 guard */
  eq('card count guard', Math.max(Math.ceil(64 / (16 * 0.8) - 1e-9), 0), 5);
  /* SPEC 4.1 tag key */
  eq('tag key collision', [tagKey('AHU 01'), tagKey('ahu_01')], ['AHU-01', 'AHU-01']);
  eq('tag key keeps hyphen runs', tagKey('PT--101'), 'PT--101');
  /* SPEC 15.11 unit round trip */
  var t1 = toDisplay(toSI(150, 'temperature', '°C'), 'temperature', '°C');
  out.push({ name: 'degC round trip', pass: Math.abs(t1 - 150) <= 1e-12 * 150, got: t1, want: 150 });
  var t2 = toDisplay(toSI(25, 'pressure', 'bar'), 'pressure', 'bar');
  out.push({ name: 'bar round trip', pass: Math.abs(t2 - 25) <= 1e-12 * 25, got: t2, want: 25 });
  /* SPEC 4.3 worked NE 43 values */
  var n = ne43For(0, 2.5e6);
  [['x_fail_lo', -62500], ['x_sat_lo', -31250], ['x_sat_hi', 2578125], ['x_fail_hi', 2656250]].forEach(function (x) {
    out.push({ name: 'ne43 ' + x[0], pass: Math.abs(n[x[0]] - x[1]) <= 1e-9 * Math.abs(x[1]), got: n[x[0]], want: x[1] });
  });
  return out;
}

/* ============================================================ data layer */
function installData() {
  if (!window.Diagram) return;
  Diagram.init({
    id: 'iolist', file: 'iolist.html', title: T('title'),
    state: { serialize: compactState, deserialize: expandState },
    record: record,
    handoff: { provides: [], accepts: [], build: function () { return null; }, apply: function () {} },
    report: { profile: reportProfile, sections: reportSections },
    python: function () {
      if (!last) last = evaluate(state);
      if (!last.state.points.length)
        return { unsupported: T('emptySignals') };
      return {
        code: pythonSource(), requires: [],
        basis: { kind: 'reproduce',
                 note: 'the tag key, the card counts, the placement, the rack and slot arithmetic, the counts and the NAMUR NE 43 endpoints are ported expression for expression; the categorical rule findings and the verdict are not',
                 deviation: 'none observed; the script evaluates the same expressions in the same order' },
        scope: 'SPEC-iolist sections 4.1 and 4.3 to 4.7',
        covers: ['signals', 'channel_signals', 'fieldbus_signals', 'sil_signals', 'is_signals',
                 'allocated', 'unallocated', 'cards', 'channels_installed', 'spare_channels', 'spare_fraction'],
        selftest: { tolerance: 1e-12,
                    note: 'integers and address strings are compared exactly; spare fractions and NE 43 values are ratios of integers and one affine map, so 1e-12 relative is the floating-point floor rather than a model allowance' }
      };
    }
  });
}

function degrade() {

                + 'are still available from the bar at the bottom of the page.';

  last = evaluate(state);
}

}

window.__iolistEvaluate = function (s) { return evaluatePublic(s); };
window.__iolistTests = selfTests;
window.__dgcBenchmark = benchmarkArtifact;
window.__iolist = { evaluate: evaluate, state: state, presets: PRESETS, compactState: compactState,
                    expandState: expandState, record: record, python: pythonSource, parseLetters: parseLetters,
                    tagKey: tagKey, drawFigure: drawFigure };

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
