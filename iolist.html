 "summary": {
  "en": "Builds a control system's I/O list: tag, signal and electrical type, range, fail state and SIL per signal, then allocates channels to cards and reports counts, spare and findings.",
  "uk": "Формує перелік сигналів системи керування: позначення, тип сигналу й електричний тип, діапазон, стан при відмові та SIL, розподіл каналів по картах, підсумки, резерв і зауваження.",
  "de": "Erstellt die E/A-Liste einer Leittechnik: Kennzeichen, Signal- und elektrischer Typ, Bereich, Fehlerzustand und SIL je Signal, Kanalzuordnung auf Karten, Stückzahlen, Reserve, Befunde.",
  "nl": "Bouwt de I/O-lijst van een besturingssysteem: tag, signaal- en elektrisch type, bereik, faalstand en SIL per signaal, kanaaltoewijzing aan kaarten, aantallen, reserve en bevindingen.",
  "fr": "Construit la liste d’E/S d’un système de conduite : repère, type de signal et type électrique, étendue, repli et SIL par signal, affectation des voies, effectifs, réserve et constats.",
  "es": "Construye la lista de E/S de un sistema de control: TAG, tipo de señal y eléctrico, rango, estado ante fallo y SIL por señal, asignación de canales, recuentos, reserva y hallazgos.",
  "pl": "Buduje listę we/wy układu sterowania: oznaczenie, typ sygnału i elektryczny, zakres, stan awaryjny i SIL, przydział kanałów do kart, liczby, zapas i ustalenia."

 "description": {
  "en": "A control or instrument engineer enters one row per field signal. The page reads the ISA-5.1 letter code out of the tag and checks it against the signal type, checks the electrical type, the range, the display unit and the fail state, and allocates every channel-bearing signal to cards of user-defined card types with a spare target per card type and per controller. Segregation is held while the cards fill: SIL-related signals reach only a safety controller and a safety card, intrinsically safe circuits reach only an IS card, and the members of one voting group are placed on separate cards. It cross-checks the list against the tags, setpoints and trip limits the functional description and the cause and effect matrix reference, and writes the result to the project package as the I/O points register.",
  "uk": "Інженер з КВП вводить рядок на кожен польовий сигнал. Сторінка зчитує з позначення літерний код ISA-5.1 і звіряє його з типом сигналу, перевіряє електричний тип, діапазон, одиницю відображення та стан при відмові, а також розподіляє кожен канальний сигнал по картах визначених користувачем типів із ціллю резерву для типу карти й для контролера. Під час заповнення карт тримається розділення: сигнали, пов'язані з SIL, потрапляють лише на контролер ПАЗ і безпечну карту, іскробезпечні кола — лише на іскробезпечну карту, а члени однієї групи голосування розміщуються на різних картах. Перелік звіряється з позначеннями, уставками й межами відсічки з функційного опису та матриці причин і наслідків, а результат записується до пакета проєкту як реєстр точок вводу/виводу.",
  "de": "Eine EMSR-Fachkraft erfasst eine Zeile je Feldsignal. Die Seite liest den ISA-5.1-Buchstabencode aus dem Kennzeichen und prüft ihn gegen die Signalart, prüft elektrischen Typ, Bereich, Anzeigeeinheit und Fehlerzustand und ordnet jedes kanalbehaftete Signal Karten selbst definierter Kartentypen zu, mit einem Reserveziel je Kartentyp und je Steuerung. Beim Belegen gilt die Trennung: SIL-relevante Signale erreichen nur eine Sicherheitssteuerung und eine Sicherheitskarte, eigensichere Stromkreise nur eine eigensichere Karte, und die Mitglieder einer Votinggruppe liegen auf getrennten Karten. Die Liste wird gegen Kennzeichen, Sollwerte und Abschaltgrenzen aus Funktionsbeschreibung und Ursache-Wirkungs-Matrix geprüft und als Register der E/A-Punkte in das Projektpaket geschrieben.",
  "nl": "Een meet- en regeltechnicus voert één rij per veldsignaal in. De pagina leest de ISA-5.1-lettercode uit de tag en toetst die aan het signaaltype, controleert het elektrische type, het bereik, de weergave-eenheid en de faalstand, en wijst elk kanaalsignaal toe aan kaarten van zelf gedefinieerde kaarttypen, met een reservedoel per kaarttype en per controller. Tijdens het vullen geldt de scheiding: SIL-gerelateerde signalen komen alleen op een veiligheidscontroller en een veiligheidskaart, intrinsiek veilige circuits alleen op een Ex i-kaart, en de leden van één stemgroep op aparte kaarten. De lijst wordt getoetst aan de tags, instelwaarden en afschakelgrenzen uit de functiebeschrijving en de oorzaak-gevolgmatrix, en als register van I/O-punten in het projectpakket geschreven.",
  "fr": "Un ingénieur contrôle-commande saisit une ligne par signal de terrain. La page lit le code de lettres ISA-5.1 dans le repère et le confronte au type de signal, contrôle le type électrique, l’étendue, l’unité affichée et l’état de repli, puis affecte chaque signal à voie aux cartes de types définis par l’utilisateur, avec un objectif de réserve par type de carte et par automate. La ségrégation est tenue pendant le remplissage : les signaux liés à la SIL ne vont que sur un automate et une carte de sécurité, les circuits de sécurité intrinsèque que sur une carte SI, et les membres d’un même groupe de vote sur des cartes distinctes. La liste est confrontée aux repères, consignes et seuils de déclenchement de la description fonctionnelle et de la matrice cause-effet, et écrite dans le dossier de projet comme registre des points d’E/S.",
  "es": "Un ingeniero de control e instrumentación introduce una fila por señal de campo. La página lee el código de letras ISA-5.1 del TAG y lo contrasta con el tipo de señal, comprueba el tipo eléctrico, el rango, la unidad mostrada y el estado ante fallo, y asigna cada señal con canal a tarjetas de tipos definidos por el usuario, con un objetivo de reserva por tipo de tarjeta y por controlador. La segregación se mantiene al llenar: las señales relacionadas con SIL solo llegan a un controlador y una tarjeta de seguridad, los circuitos de seguridad intrínseca solo a una tarjeta SI, y los miembros de un grupo de votación a tarjetas distintas. La lista se contrasta con los TAG, consignas y límites de disparo de la descripción funcional y la matriz causa-efecto, y se escribe en el paquete de proyecto como registro de puntos de E/S.",
  "pl": "Inżynier AKPiA wpisuje jeden wiersz na każdy sygnał obiektowy. Strona odczytuje z oznaczenia kod literowy ISA-5.1 i zestawia go z typem sygnału, sprawdza typ elektryczny, zakres, jednostkę wyświetlania i stan awaryjny oraz przydziela każdy sygnał kanałowy do kart zdefiniowanych przez użytkownika typów, z docelowym zapasem dla typu karty i dla sterownika. Przy zapełnianiu utrzymywane jest rozdzielenie: sygnały związane z SIL trafiają tylko na sterownik i kartę bezpieczeństwa, obwody iskrobezpieczne tylko na kartę iskrobezpieczną, a elementy jednej grupy głosowania na osobne karty. Lista jest zestawiana z oznaczeniami, nastawami i progami wyłączenia z opisu funkcjonalnego i macierzy przyczynowo-skutkowej, a wynik zapisywany do pakietu projektu jako rejestr punktów we/wy."
 },

 "limitations": {
  "en": "Allocation is automatic and deterministic: a signal cannot be pinned to a fixed channel and adding one signal can move others. One card type per signal, the first eligible type in the controller's list, with no optimisation of card mix, cost or cabinet space. Tag letters are read by a fixed parse of the letter code, so loop-numbering schemes, plant-area prefixes and suffix conventions beyond that grammar are not interpreted and a relief valve tagged PSV parses as a valve. Electrical types are a fixed vocabulary and carry no electrical verification: loop power, burden, cable length, barrier entity parameters and IEC 60079-11 intrinsic-safety calculations are outside scope, and intrinsic safety is a segregation attribute only. NE 43 is applied as the 3.6 / 3.8 / 20.5 / 21 mA device levels; the 2021 edition's control-system detection margin is not applied. Pressure is compared as entered, so gauge and absolute are not distinguished. Setpoints and referenced tags are read from the functional description and the cause and effect matrix in fixed field shapes only; a condition written as free text is counted as unparsed and not checked. Racks are filled in slot order with no power supplies, communication modules or slot reservations modelled, and a fieldbus signal occupies no channel. The findings are an engineering review aid and not a SIL verification: no PFD, architecture or hardware-fault-tolerance figure is computed. The permalink carries the state only while it encodes to 4 kB, about 40 to 60 signals; a longer list travels through the project package or the record file.",
  "uk": "Розподіл автоматичний і детермінований: сигнал не можна закріпити за фіксованим каналом, а додавання одного сигналу може зсунути інші. Один тип карти на сигнал — перший придатний тип зі списку контролера — без оптимізації складу карт, вартості чи місця в шафі. Літери позначення читаються фіксованим розбором літерного коду, тож схеми нумерації контурів, префікси зон установки та суфіксні домовленості поза цією граматикою не тлумачаться, а запобіжний клапан із позначенням PSV розбирається як клапан. Електричні типи — фіксований словник без жодної електричної перевірки: живлення контуру, навантаження, довжина кабелю, параметри бар'єрів та розрахунки іскробезпеки за IEC 60079-11 поза обсягом, а іскробезпека є лише ознакою розділення. NE 43 застосовано як рівні приладу 3,6 / 3,8 / 20,5 / 21 мА; запас на виявлення в системі керування з редакції 2021 не застосовується. Тиск порівнюється як введено, тож надлишковий і абсолютний не розрізняються. Уставки та згадані позначення читаються з функційного опису й матриці причин і наслідків лише у фіксованих формах полів; умову, написану вільним текстом, зараховано як нерозібрану й не перевірено. Кошики заповнюються за порядком слотів, без моделювання блоків живлення, комунікаційних модулів і резервування слотів, а сигнал польової шини не займає каналу. Зауваження є допоміжним засобом інженерного перегляду, а не верифікацією SIL: PFD, архітектура та відмовостійкість не обчислюються. Постійне посилання несе стан, лише поки він кодується в 4 кБ — приблизно 40–60 сигналів; довший перелік передається пакетом проєкту або файлом запису.",
  "de": "Die Zuordnung ist automatisch und deterministisch: ein Signal lässt sich nicht auf einen festen Kanal festlegen, und ein zusätzliches Signal kann andere verschieben. Ein Kartentyp je Signal, der erste geeignete Typ aus der Liste der Steuerung, ohne Optimierung von Kartenmix, Kosten oder Schrankplatz. Kennbuchstaben werden durch eine feste Analyse des Buchstabencodes gelesen; Kreisnummernsysteme, Anlagenpräfixe und Suffixkonventionen jenseits dieser Grammatik werden nicht ausgelegt, und ein als PSV gekennzeichnetes Sicherheitsventil wird als Ventil gelesen. Elektrische Typen sind ein festes Vokabular ohne elektrischen Nachweis: Schleifenspeisung, Bürde, Leitungslänge, Barriere-Kenngrößen und Eigensicherheitsnachweise nach IEC 60079-11 liegen außerhalb des Umfangs, Eigensicherheit ist nur ein Trennungsmerkmal. NE 43 wird als Gerätepegel 3,6 / 3,8 / 20,5 / 21 mA angewendet; der Erkennungsabstand der Ausgabe 2021 für Leitsysteme wird nicht angewendet. Druck wird wie eingegeben verglichen, Über- und Absolutdruck werden nicht unterschieden. Sollwerte und referenzierte Kennzeichen werden aus Funktionsbeschreibung und Ursache-Wirkungs-Matrix nur in festen Feldformen gelesen; eine als Freitext geschriebene Bedingung gilt als nicht auswertbar und wird nicht geprüft. Träger werden in Steckplatzreihenfolge belegt, ohne Netzteile, Kommunikationsbaugruppen oder Steckplatzreservierungen, und ein Feldbussignal belegt keinen Kanal. Die Befunde sind eine Prüfhilfe und keine SIL-Verifikation: PFD, Architektur und Fehlertoleranz werden nicht gerechnet. Der Permalink trägt den Zustand nur, solange er in 4 kB kodiert, etwa 40 bis 60 Signale; eine längere Liste reist im Projektpaket oder in der Aufzeichnungsdatei.",
  "nl": "De toewijzing is automatisch en deterministisch: een signaal kan niet op een vast kanaal worden vastgezet en één signaal erbij kan andere verplaatsen. Eén kaarttype per signaal, het eerste geschikte type uit de lijst van de controller, zonder optimalisatie van kaartmix, kosten of kastruimte. Kenletters worden gelezen met een vaste ontleding van de lettercode, dus kringnummerschema's, installatieprefixen en achtervoegselafspraken buiten die grammatica worden niet uitgelegd en een als PSV getagde veiligheidsklep wordt als klep gelezen. Elektrische typen vormen een vast vocabulaire zonder elektrische verificatie: lusvoeding, belasting, kabellengte, barrièreparameters en intrinsiekeveiligheidsberekeningen volgens IEC 60079-11 vallen buiten de scope, en intrinsieke veiligheid is uitsluitend een scheidingskenmerk. NE 43 wordt toegepast als de apparaatniveaus 3,6 / 3,8 / 20,5 / 21 mA; de detectiemarge voor besturingssystemen uit de uitgave 2021 wordt niet toegepast. Druk wordt vergeleken zoals ingevoerd, dus overdruk en absolute druk worden niet onderscheiden. Instelwaarden en genoemde tags worden alleen in vaste veldvormen uit de functiebeschrijving en de oorzaak-gevolgmatrix gelezen; een als vrije tekst geschreven voorwaarde telt als niet-ontleed en wordt niet gecontroleerd. Racks worden in slotvolgorde gevuld, zonder voedingen, communicatiemodules of slotreserveringen, en een veldbussignaal bezet geen kanaal. De bevindingen zijn een controlehulpmiddel en geen SIL-verificatie: PFD, architectuur en fouttolerantie worden niet berekend. De permalink draagt de toestand alleen zolang die in 4 kB codeert, ongeveer 40 tot 60 signalen; een langere lijst reist via het projectpakket of het recordbestand.",
  "fr": "L’affectation est automatique et déterministe : un signal ne peut pas être figé sur une voie et l’ajout d’un signal peut en déplacer d’autres. Un type de carte par signal, le premier type éligible de la liste de l’automate, sans optimisation du mélange de cartes, du coût ni de la place en armoire. Les lettres du repère sont lues par une analyse fixe du code ; les schémas de numérotation de boucle, les préfixes de zone et les conventions de suffixe hors de cette grammaire ne sont pas interprétés, et une soupape repérée PSV est lue comme une vanne. Les types électriques forment un vocabulaire fixe sans aucune vérification électrique : alimentation de boucle, charge, longueur de câble, paramètres d’entité de barrière et calculs de sécurité intrinsèque selon CEI 60079-11 sont hors périmètre, et la sécurité intrinsèque n’est qu’un attribut de ségrégation. NE 43 est appliqué comme les niveaux appareil 3,6 / 3,8 / 20,5 / 21 mA ; la marge de détection de l’édition 2021 pour les systèmes de conduite n’est pas appliquée. La pression est comparée telle que saisie : relative et absolue ne sont pas distinguées. Consignes et repères référencés sont lus dans la description fonctionnelle et la matrice cause-effet sous des formes de champs fixes seulement ; une condition en texte libre est comptée comme non analysée et n’est pas vérifiée. Les châssis sont remplis dans l’ordre des emplacements, sans alimentations, modules de communication ni réservations, et un signal de bus de terrain n’occupe aucune voie. Les constats sont une aide à la revue et non une vérification SIL : ni PFD, ni architecture, ni tolérance aux défauts ne sont calculés. Le lien permanent porte l’état tant qu’il tient en 4 ko, soit 40 à 60 signaux ; une liste plus longue voyage par le dossier de projet ou le fichier d’enregistrement.",
  "es": "La asignación es automática y determinista: una señal no puede fijarse a un canal y añadir una señal puede desplazar otras. Un tipo de tarjeta por señal, el primero admisible de la lista del controlador, sin optimizar la mezcla de tarjetas, el coste ni el espacio en armario. Las letras del TAG se leen con un análisis fijo del código, de modo que los esquemas de numeración de lazo, los prefijos de zona y los convenios de sufijo fuera de esa gramática no se interpretan, y una válvula de seguridad con TAG PSV se lee como válvula. Los tipos eléctricos son un vocabulario fijo sin verificación eléctrica alguna: alimentación de lazo, carga, longitud de cable, parámetros de entidad de barrera y cálculos de seguridad intrínseca según IEC 60079-11 quedan fuera del alcance, y la seguridad intrínseca es solo un atributo de segregación. NE 43 se aplica como los niveles de equipo 3,6 / 3,8 / 20,5 / 21 mA; el margen de detección para sistemas de control de la edición de 2021 no se aplica. La presión se compara tal como se introduce, por lo que no se distinguen manométrica y absoluta. Las consignas y los TAG referenciados se leen de la descripción funcional y la matriz causa-efecto solo en formas de campo fijas; una condición escrita en texto libre se cuenta como no analizada y no se comprueba. Los bastidores se llenan por orden de ranura, sin modelar fuentes de alimentación, módulos de comunicación ni reservas de ranura, y una señal de bus de campo no ocupa canal. Los hallazgos son una ayuda de revisión y no una verificación SIL: no se calculan PFD, arquitectura ni tolerancia a fallos. El enlace permanente lleva el estado mientras se codifique en 4 kB, unas 40 a 60 señales; una lista más larga viaja por el paquete de proyecto o el archivo de registro.",
  "pl": "Przydział jest automatyczny i deterministyczny: sygnału nie da się przypiąć do stałego kanału, a dodanie jednego sygnału może przesunąć inne. Jeden typ karty na sygnał — pierwszy dopuszczalny typ z listy sterownika — bez optymalizacji doboru kart, kosztu ani miejsca w szafie. Litery oznaczenia czytane są stałym rozbiorem kodu literowego, więc schematy numeracji pętli, przedrostki obszarów instalacji i konwencje przyrostków poza tą gramatyką nie są interpretowane, a zawór bezpieczeństwa oznaczony PSV jest czytany jako zawór. Typy elektryczne to stały słownik bez jakiejkolwiek weryfikacji elektrycznej: zasilanie pętli, obciążalność, długość kabla, parametry barier i obliczenia iskrobezpieczeństwa wg IEC 60079-11 są poza zakresem, a iskrobezpieczeństwo jest wyłącznie cechą rozdzielenia. NE 43 stosowane jest jako poziomy urządzenia 3,6 / 3,8 / 20,5 / 21 mA; margines wykrywania dla systemów sterowania z wydania 2021 nie jest stosowany. Ciśnienie porównywane jest tak, jak je wpisano, więc nie rozróżnia się względnego i bezwzględnego. Nastawy i przywołane oznaczenia czytane są z opisu funkcjonalnego i macierzy przyczynowo-skutkowej wyłącznie w ustalonych postaciach pól; warunek zapisany tekstem swobodnym liczony jest jako nierozebrany i nie jest sprawdzany. Kasety zapełniane są w kolejności gniazd, bez modelowania zasilaczy, modułów komunikacyjnych i rezerwacji gniazd, a sygnał magistrali obiektowej nie zajmuje kanału. Ustalenia są pomocą przy przeglądzie inżynierskim, a nie weryfikacją SIL: nie liczy się PFD, architektury ani tolerancji uszkodzeń sprzętu. Link trwały niesie stan tylko dopóki koduje się w 4 kB, czyli około 40–60 sygnałów; dłuższa lista przenoszona jest pakietem projektu albo plikiem zapisu."
 },

 "validation": {
  "basis": {
   "en": "Benchmarked against an independent reference corpus (benchmarks/iolist.reference.json, 159 cases and 420 checks, written by a separate agent from the public specification SPEC-iolist and the cited standards, with no access to this page): 159 cases and 420 checks pass. The corpus covers the ISA-5.1 letter parse of section 4.2, the NAMUR NE 43 levels of section 4.3, the card-count, placement, rack and slot arithmetic of sections 4.4 to 4.6, the counts and spare fractions of section 4.7, all 37 review rules with one triggering case and one near miss each, the verdict logic of section 6 and the four worked examples of section 9. Five disagreements between the corpus and this page were settled by an independent adjudication on 2026-09-23: four against the page, one against the corpus. Package transport, the interface and the seven-language strings stay outside the corpus and are listed in the artifact benchmarks/iolist.json.",
   "uk": "Зараховано за незалежним еталонним корпусом (benchmarks/iolist.reference.json, 159 випадків і 420 перевірок; його написав інший агент за публічною специфікацією SPEC-iolist і наведеними стандартами, без доступу до цієї сторінки): 159 випадків і 420 перевірок проходять. Корпус охоплює розбір літер ISA-5.1 з розділу 4.2, рівні NAMUR NE 43 з розділу 4.3, арифметику кількості карт, розміщення, кошика і слота з розділів 4.4–4.6, підсумки та частки резерву з розділу 4.7, усі 37 правил перевірки з одним випадком спрацювання та одним близьким неспрацюванням для кожного, логіку вердикту з розділу 6 і чотири опрацьовані приклади з розділу 9. П'ять розбіжностей між корпусом і сторінкою розв'язано незалежним арбітражем 2026-09-23: чотири проти сторінки, одну проти корпусу. Перенесення проєктного пакета, інтерфейс і рядки сімома мовами залишаються поза корпусом і перелічені в артефакті benchmarks/iolist.json.",
   "de": "Gegen einen unabhängigen Referenzkorpus gewertet (benchmarks/iolist.reference.json, 159 Fälle und 420 Prüfungen, von einem anderen Agenten aus der öffentlichen Spezifikation SPEC-iolist und den zitierten Normen ohne Zugriff auf diese Seite verfasst): 159 Fälle und 420 Prüfungen bestehen. Der Korpus deckt die ISA-5.1-Buchstabenauswertung aus Abschnitt 4.2 ab, die NAMUR-NE-43-Pegel aus Abschnitt 4.3, die Arithmetik für Kartenzahl, Platzierung, Träger und Steckplatz aus den Abschnitten 4.4 bis 4.6, die Stückzahlen und Reserveanteile aus Abschnitt 4.7, alle 37 Prüfregeln mit je einem auslösenden Fall und einem Grenzfall knapp darunter, die Urteilslogik aus Abschnitt 6 und die vier ausgearbeiteten Beispiele aus Abschnitt 9. Fünf Abweichungen zwischen Korpus und Seite hat eine unabhängige Schlichtung am 2026-09-23 entschieden: vier gegen die Seite, eine gegen den Korpus. Projektpaket-Transport, Oberfläche und die Texte in sieben Sprachen bleiben außerhalb des Korpus und stehen im Artefakt benchmarks/iolist.json.",
   "nl": "Getoetst aan een onafhankelijk referentiecorpus (benchmarks/iolist.reference.json, 159 gevallen en 420 controles, geschreven door een andere agent op basis van de publieke specificatie SPEC-iolist en de geciteerde normen, zonder toegang tot deze pagina): 159 gevallen en 420 controles slagen. Het corpus dekt de ISA-5.1-letterontleding van paragraaf 4.2, de NAMUR NE 43-niveaus van paragraaf 4.3, de rekenkunde voor kaartaantal, plaatsing, rack en slot van paragraaf 4.4 tot en met 4.6, de aantallen en reservefracties van paragraaf 4.7, alle 37 toetsregels met per regel één geval dat aanslaat en één dat er net onder blijft, de oordeelslogica van paragraaf 6 en de vier uitgewerkte voorbeelden van paragraaf 9. Vijf verschillen tussen corpus en pagina zijn op 2026-09-23 door een onafhankelijke arbitrage beslecht: vier tegen de pagina, één tegen het corpus. Projectpakkettransport, de interface en de teksten in zeven talen vallen buiten het corpus en staan in het artefact benchmarks/iolist.json.",
   "fr": "Évalué face à un corpus de référence indépendant (benchmarks/iolist.reference.json, 159 cas et 420 contrôles, rédigé par un autre agent à partir de la spécification publique SPEC-iolist et des normes citées, sans accès à cette page) : 159 cas et 420 contrôles passent. Le corpus couvre l'analyse des lettres ISA-5.1 de la section 4.2, les niveaux NAMUR NE 43 de la section 4.3, l'arithmétique du nombre de cartes, du placement, du châssis et de l'emplacement des sections 4.4 à 4.6, les effectifs et les fractions de réserve de la section 4.7, les 37 règles de revue avec pour chacune un cas déclencheur et un cas juste en deçà, la logique du verdict de la section 6 et les quatre exemples traités de la section 9. Cinq désaccords entre le corpus et cette page ont été tranchés par un arbitrage indépendant le 2026-09-23 : quatre contre la page, un contre le corpus. Le transport du dossier de projet, l'interface et les textes en sept langues restent hors du corpus et figurent dans l'artefact benchmarks/iolist.json.",
   "es": "Contrastado con un corpus de referencia independiente (benchmarks/iolist.reference.json, 159 casos y 420 comprobaciones, redactado por otro agente a partir de la especificación pública SPEC-iolist y de las normas citadas, sin acceso a esta página): pasan 159 casos y 420 comprobaciones. El corpus cubre el análisis de letras ISA-5.1 de la sección 4.2, los niveles NAMUR NE 43 de la sección 4.3, la aritmética de número de tarjetas, colocación, bastidor y ranura de las secciones 4.4 a 4.6, los recuentos y las fracciones de reserva de la sección 4.7, las 37 reglas de revisión con un caso que dispara y otro que se queda justo por debajo en cada una, la lógica del veredicto de la sección 6 y los cuatro ejemplos resueltos de la sección 9. Cinco discrepancias entre el corpus y esta página las resolvió un arbitraje independiente el 2026-09-23: cuatro contra la página y una contra el corpus. El transporte del paquete de proyecto, la interfaz y los textos en siete idiomas quedan fuera del corpus y constan en el artefacto benchmarks/iolist.json.",
   "pl": "Oceniono wobec niezależnego korpusu odniesienia (benchmarks/iolist.reference.json, 159 przypadków i 420 sprawdzeń, napisanego przez innego agenta na podstawie publicznej specyfikacji SPEC-iolist i przywołanych norm, bez dostępu do tej strony): przechodzi 159 przypadków i 420 sprawdzeń. Korpus obejmuje rozbiór liter ISA-5.1 z rozdz. 4.2, poziomy NAMUR NE 43 z rozdz. 4.3, arytmetykę liczby kart, rozmieszczenia, kasety i gniazda z rozdz. 4.4–4.6, zliczenia i udziały rezerwy z rozdz. 4.7, wszystkie 37 reguł przeglądu z jednym przypadkiem wyzwalającym i jednym tuż poniżej progu dla każdej, logikę werdyktu z rozdz. 6 oraz cztery opracowane przykłady z rozdz. 9. Pięć rozbieżności między korpusem a stroną rozstrzygnął niezależny arbitraż 2026-09-23: cztery przeciw stronie, jedną przeciw korpusowi. Przenoszenie pakietu projektowego, interfejs i teksty w siedmiu językach pozostają poza korpusem i są wymienione w artefakcie benchmarks/iolist.json."
  },

  "uk": "Формує перелік сигналів системи керування: позначення, тип сигналу й електричний тип, діапазон, стан при відмові та SIL, розподіл каналів по картах, підсумки, резерв і зауваження.",
  "de": "Erstellt die E/A-Liste einer Leittechnik: Kennzeichen, Signal- und elektrischer Typ, Bereich, Fehlerzustand und SIL je Signal, Kanalzuordnung auf Karten, Stückzahlen, Reserve, Befunde.",
  "nl": "Bouwt de I/O-lijst van een besturingssysteem: tag, signaal- en elektrisch type, bereik, faalstand en SIL per signaal, kanaaltoewijzing aan kaarten, aantallen, reserve en bevindingen.",
  "fr": "Construit la liste d’E/S d’un système de conduite : repère, type de signal et type électrique, étendue, repli et SIL par signal, affectation des voies, effectifs, réserve et constats.",

 "description": {
  "en": "A control or instrument engineer enters one row per field signal. The page reads the ISA-5.1 letter code out of the tag and checks it against the signal type, checks the electrical type, the range, the display unit and the fail state, and allocates every channel-bearing signal to cards of user-defined card types with a spare target per card type and per controller. Segregation is held while the cards fill: SIL-related signals reach only a safety controller and a safety card, intrinsically safe circuits reach only an IS card, and the members of one voting group are placed on separate cards. It cross-checks the list against the tags, setpoints and trip limits the functional description and the cause and effect matrix reference, and writes the result to the project package as the I/O points register.",
  "uk": "Інженер з КВП вводить рядок на кожен польовий сигнал. Сторінка зчитує з позначення літерний код ISA-5.1 і звіряє його з типом сигналу, перевіряє електричний тип, діапазон, одиницю відображення та стан при відмові, а також розподіляє кожен канальний сигнал по картах визначених користувачем типів із ціллю резерву для типу карти й для контролера. Під час заповнення карт тримається розділення: сигнали, пов'язані з SIL, потрапляють лише на контролер ПАЗ і безпечну карту, іскробезпечні кола — лише на іскробезпечну карту, а члени однієї групи голосування розміщуються на різних картах. Перелік звіряється з позначеннями, уставками й межами відсічки з функційного опису та матриці причин і наслідків, а результат записується до пакета проєкту як реєстр точок вводу/виводу.",
  "de": "Eine EMSR-Fachkraft erfasst eine Zeile je Feldsignal. Die Seite liest den ISA-5.1-Buchstabencode aus dem Kennzeichen und prüft ihn gegen die Signalart, prüft elektrischen Typ, Bereich, Anzeigeeinheit und Fehlerzustand und ordnet jedes kanalbehaftete Signal Karten selbst definierter Kartentypen zu, mit einem Reserveziel je Kartentyp und je Steuerung. Beim Belegen gilt die Trennung: SIL-relevante Signale erreichen nur eine Sicherheitssteuerung und eine Sicherheitskarte, eigensichere Stromkreise nur eine eigensichere Karte, und die Mitglieder einer Votinggruppe liegen auf getrennten Karten. Die Liste wird gegen Kennzeichen, Sollwerte und Abschaltgrenzen aus Funktionsbeschreibung und Ursache-Wirkungs-Matrix geprüft und als Register der E/A-Punkte in das Projektpaket geschrieben.",
  "nl": "Een meet- en regeltechnicus voert één rij per veldsignaal in. De pagina leest de ISA-5.1-lettercode uit de tag en toetst die aan het signaaltype, controleert het elektrische type, het bereik, de weergave-eenheid en de faalstand, en wijst elk kanaalsignaal toe aan kaarten van zelf gedefinieerde kaarttypen, met een reservedoel per kaarttype en per controller. Tijdens het vullen geldt de scheiding: SIL-gerelateerde signalen komen alleen op een veiligheidscontroller en een veiligheidskaart, intrinsiek veilige circuits alleen op een Ex i-kaart, en de leden van één stemgroep op aparte kaarten. De lijst wordt getoetst aan de tags, instelwaarden en afschakelgrenzen uit de functiebeschrijving en de oorzaak-gevolgmatrix, en als register van I/O-punten in het projectpakket geschreven.",
  "fr": "Un ingénieur contrôle-commande saisit une ligne par signal de terrain. La page lit le code de lettres ISA-5.1 dans le repère et le confronte au type de signal, contrôle le type électrique, l’étendue, l’unité affichée et l’état de repli, puis affecte chaque signal à voie aux cartes de types définis par l’utilisateur, avec un objectif de réserve par type de carte et par automate. La ségrégation est tenue pendant le remplissage : les signaux liés à la SIL ne vont que sur un automate et une carte de sécurité, les circuits de sécurité intrinsèque que sur une carte SI, et les membres d’un même groupe de vote sur des cartes distinctes. La liste est confrontée aux repères, consignes et seuils de déclenchement de la description fonctionnelle et de la matrice cause-effet, et écrite dans le dossier de projet comme registre des points d’E/S.",
  "es": "Un ingeniero de control e instrumentación introduce una fila por señal de campo. La página lee el código de letras ISA-5.1 del TAG y lo contrasta con el tipo de señal, comprueba el tipo eléctrico, el rango, la unidad mostrada y el estado ante fallo, y asigna cada señal con canal a tarjetas de tipos definidos por el usuario, con un objetivo de reserva por tipo de tarjeta y por controlador. La segregación se mantiene al llenar: las señales relacionadas con SIL solo llegan a un controlador y una tarjeta de seguridad, los circuitos de seguridad intrínseca solo a una tarjeta SI, y los miembros de un grupo de votación a tarjetas distintas. La lista se contrasta con los TAG, consignas y límites de disparo de la descripción funcional y la matriz causa-efecto, y se escribe en el paquete de proyecto como registro de puntos de E/S.",
  "pl": "Inżynier AKPiA wpisuje jeden wiersz na każdy sygnał obiektowy. Strona odczytuje z oznaczenia kod literowy ISA-5.1 i zestawia go z typem sygnału, sprawdza typ elektryczny, zakres, jednostkę wyświetlania i stan awaryjny oraz przydziela każdy sygnał kanałowy do kart zdefiniowanych przez użytkownika typów, z docelowym zapasem dla typu karty i dla sterownika. Przy zapełnianiu utrzymywane jest rozdzielenie: sygnały związane z SIL trafiają tylko na sterownik i kartę bezpieczeństwa, obwody iskrobezpieczne tylko na kartę iskrobezpieczną, a elementy jednej grupy głosowania na osobne karty. Lista jest zestawiana z oznaczeniami, nastawami i progami wyłączenia z opisu funkcjonalnego i macierzy przyczynowo-skutkowej, a wynik zapisywany do pakietu projektu jako rejestr punktów we/wy."
 },

 "limitations": {
  "en": "Allocation is automatic and deterministic: a signal cannot be pinned to a fixed channel and adding one signal can move others. One card type per signal, the first eligible type in the controller's list, with no optimisation of card mix, cost or cabinet space. Tag letters are read by a fixed parse of the letter code, so loop-numbering schemes, plant-area prefixes and suffix conventions beyond that grammar are not interpreted and a relief valve tagged PSV parses as a valve. Electrical types are a fixed vocabulary and carry no electrical verification: loop power, burden, cable length, barrier entity parameters and IEC 60079-11 intrinsic-safety calculations are outside scope, and intrinsic safety is a segregation attribute only. NE 43 is applied as the 3.6 / 3.8 / 20.5 / 21 mA device levels; the 2021 edition's control-system detection margin is not applied. Pressure is compared as entered, so gauge and absolute are not distinguished. Setpoints and referenced tags are read from the functional description and the cause and effect matrix in fixed field shapes only; a condition written as free text is counted as unparsed and not checked. Racks are filled in slot order with no power supplies, communication modules or slot reservations modelled, and a fieldbus signal occupies no channel. The findings are an engineering review aid and not a SIL verification: no PFD, architecture or hardware-fault-tolerance figure is computed. The permalink carries the state only while it encodes to 4 kB, about 40 to 60 signals; a longer list travels through the project package or the record file.",
  "uk": "Розподіл автоматичний і детермінований: сигнал не можна закріпити за фіксованим каналом, а додавання одного сигналу може зсунути інші. Один тип карти на сигнал — перший придатний тип зі списку контролера — без оптимізації складу карт, вартості чи місця в шафі. Літери позначення читаються фіксованим розбором літерного коду, тож схеми нумерації контурів, префікси зон установки та суфіксні домовленості поза цією граматикою не тлумачаться, а запобіжний клапан із позначенням PSV розбирається як клапан. Електричні типи — фіксований словник без жодної електричної перевірки: живлення контуру, навантаження, довжина кабелю, параметри бар'єрів та розрахунки іскробезпеки за IEC 60079-11 поза обсягом, а іскробезпека є лише ознакою розділення. NE 43 застосовано як рівні приладу 3,6 / 3,8 / 20,5 / 21 мА; запас на виявлення в системі керування з редакції 2021 не застосовується. Тиск порівнюється як введено, тож надлишковий і абсолютний не розрізняються. Уставки та згадані позначення читаються з функційного опису й матриці причин і наслідків лише у фіксованих формах полів; умову, написану вільним текстом, зараховано як нерозібрану й не перевірено. Кошики заповнюються за порядком слотів, без моделювання блоків живлення, комунікаційних модулів і резервування слотів, а сигнал польової шини не займає каналу. Зауваження є допоміжним засобом інженерного перегляду, а не верифікацією SIL: PFD, архітектура та відмовостійкість не обчислюються. Постійне посилання несе стан, лише поки він кодується в 4 кБ — приблизно 40–60 сигналів; довший перелік передається пакетом проєкту або файлом запису.",
  "de": "Die Zuordnung ist automatisch und deterministisch: ein Signal lässt sich nicht auf einen festen Kanal festlegen, und ein zusätzliches Signal kann andere verschieben. Ein Kartentyp je Signal, der erste geeignete Typ aus der Liste der Steuerung, ohne Optimierung von Kartenmix, Kosten oder Schrankplatz. Kennbuchstaben werden durch eine feste Analyse des Buchstabencodes gelesen; Kreisnummernsysteme, Anlagenpräfixe und Suffixkonventionen jenseits dieser Grammatik werden nicht ausgelegt, und ein als PSV gekennzeichnetes Sicherheitsventil wird als Ventil gelesen. Elektrische Typen sind ein festes Vokabular ohne elektrischen Nachweis: Schleifenspeisung, Bürde, Leitungslänge, Barriere-Kenngrößen und Eigensicherheitsnachweise nach IEC 60079-11 liegen außerhalb des Umfangs, Eigensicherheit ist nur ein Trennungsmerkmal. NE 43 wird als Gerätepegel 3,6 / 3,8 / 20,5 / 21 mA angewendet; der Erkennungsabstand der Ausgabe 2021 für Leitsysteme wird nicht angewendet. Druck wird wie eingegeben verglichen, Über- und Absolutdruck werden nicht unterschieden. Sollwerte und referenzierte Kennzeichen werden aus Funktionsbeschreibung und Ursache-Wirkungs-Matrix nur in festen Feldformen gelesen; eine als Freitext geschriebene Bedingung gilt als nicht auswertbar und wird nicht geprüft. Träger werden in Steckplatzreihenfolge belegt, ohne Netzteile, Kommunikationsbaugruppen oder Steckplatzreservierungen, und ein Feldbussignal belegt keinen Kanal. Die Befunde sind eine Prüfhilfe und keine SIL-Verifikation: PFD, Architektur und Fehlertoleranz werden nicht gerechnet. Der Permalink trägt den Zustand nur, solange er in 4 kB kodiert, etwa 40 bis 60 Signale; eine längere Liste reist im Projektpaket oder in der Aufzeichnungsdatei.",
  "nl": "De toewijzing is automatisch en deterministisch: een signaal kan niet op een vast kanaal worden vastgezet en één signaal erbij kan andere verplaatsen. Eén kaarttype per signaal, het eerste geschikte type uit de lijst van de controller, zonder optimalisatie van kaartmix, kosten of kastruimte. Kenletters worden gelezen met een vaste ontleding van de lettercode, dus kringnummerschema's, installatieprefixen en achtervoegselafspraken buiten die grammatica worden niet uitgelegd en een als PSV getagde veiligheidsklep wordt als klep gelezen. Elektrische typen vormen een vast vocabulaire zonder elektrische verificatie: lusvoeding, belasting, kabellengte, barrièreparameters en intrinsiekeveiligheidsberekeningen volgens IEC 60079-11 vallen buiten de scope, en intrinsieke veiligheid is uitsluitend een scheidingskenmerk. NE 43 wordt toegepast als de apparaatniveaus 3,6 / 3,8 / 20,5 / 21 mA; de detectiemarge voor besturingssystemen uit de uitgave 2021 wordt niet toegepast. Druk wordt vergeleken zoals ingevoerd, dus overdruk en absolute druk worden niet onderscheiden. Instelwaarden en genoemde tags worden alleen in vaste veldvormen uit de functiebeschrijving en de oorzaak-gevolgmatrix gelezen; een als vrije tekst geschreven voorwaarde telt als niet-ontleed en wordt niet gecontroleerd. Racks worden in slotvolgorde gevuld, zonder voedingen, communicatiemodules of slotreserveringen, en een veldbussignaal bezet geen kanaal. De bevindingen zijn een controlehulpmiddel en geen SIL-verificatie: PFD, architectuur en fouttolerantie worden niet berekend. De permalink draagt de toestand alleen zolang die in 4 kB codeert, ongeveer 40 tot 60 signalen; een langere lijst reist via het projectpakket of het recordbestand.",
  "fr": "L’affectation est automatique et déterministe : un signal ne peut pas être figé sur une voie et l’ajout d’un signal peut en déplacer d’autres. Un type de carte par signal, le premier type éligible de la liste de l’automate, sans optimisation du mélange de cartes, du coût ni de la place en armoire. Les lettres du repère sont lues par une analyse fixe du code ; les schémas de numérotation de boucle, les préfixes de zone et les conventions de suffixe hors de cette grammaire ne sont pas interprétés, et une soupape repérée PSV est lue comme une vanne. Les types électriques forment un vocabulaire fixe sans aucune vérification électrique : alimentation de boucle, charge, longueur de câble, paramètres d’entité de barrière et calculs de sécurité intrinsèque selon CEI 60079-11 sont hors périmètre, et la sécurité intrinsèque n’est qu’un attribut de ségrégation. NE 43 est appliqué comme les niveaux appareil 3,6 / 3,8 / 20,5 / 21 mA ; la marge de détection de l’édition 2021 pour les systèmes de conduite n’est pas appliquée. La pression est comparée telle que saisie : relative et absolue ne sont pas distinguées. Consignes et repères référencés sont lus dans la description fonctionnelle et la matrice cause-effet sous des formes de champs fixes seulement ; une condition en texte libre est comptée comme non analysée et n’est pas vérifiée. Les châssis sont remplis dans l’ordre des emplacements, sans alimentations, modules de communication ni réservations, et un signal de bus de terrain n’occupe aucune voie. Les constats sont une aide à la revue et non une vérification SIL : ni PFD, ni architecture, ni tolérance aux défauts ne sont calculés. Le lien permanent porte l’état tant qu’il tient en 4 ko, soit 40 à 60 signaux ; une liste plus longue voyage par le dossier de projet ou le fichier d’enregistrement.",
  "es": "La asignación es automática y determinista: una señal no puede fijarse a un canal y añadir una señal puede desplazar otras. Un tipo de tarjeta por señal, el primero admisible de la lista del controlador, sin optimizar la mezcla de tarjetas, el coste ni el espacio en armario. Las letras del TAG se leen con un análisis fijo del código, de modo que los esquemas de numeración de lazo, los prefijos de zona y los convenios de sufijo fuera de esa gramática no se interpretan, y una válvula de seguridad con TAG PSV se lee como válvula. Los tipos eléctricos son un vocabulario fijo sin verificación eléctrica alguna: alimentación de lazo, carga, longitud de cable, parámetros de entidad de barrera y cálculos de seguridad intrínseca según IEC 60079-11 quedan fuera del alcance, y la seguridad intrínseca es solo un atributo de segregación. NE 43 se aplica como los niveles de equipo 3,6 / 3,8 / 20,5 / 21 mA; el margen de detección para sistemas de control de la edición de 2021 no se aplica. La presión se compara tal como se introduce, por lo que no se distinguen manométrica y absoluta. Las consignas y los TAG referenciados se leen de la descripción funcional y la matriz causa-efecto solo en formas de campo fijas; una condición escrita en texto libre se cuenta como no analizada y no se comprueba. Los bastidores se llenan por orden de ranura, sin modelar fuentes de alimentación, módulos de comunicación ni reservas de ranura, y una señal de bus de campo no ocupa canal. Los hallazgos son una ayuda de revisión y no una verificación SIL: no se calculan PFD, arquitectura ni tolerancia a fallos. El enlace permanente lleva el estado mientras se codifique en 4 kB, unas 40 a 60 señales; una lista más larga viaja por el paquete de proyecto o el archivo de registro.",
  "pl": "Przydział jest automatyczny i deterministyczny: sygnału nie da się przypiąć do stałego kanału, a dodanie jednego sygnału może przesunąć inne. Jeden typ karty na sygnał — pierwszy dopuszczalny typ z listy sterownika — bez optymalizacji doboru kart, kosztu ani miejsca w szafie. Litery oznaczenia czytane są stałym rozbiorem kodu literowego, więc schematy numeracji pętli, przedrostki obszarów instalacji i konwencje przyrostków poza tą gramatyką nie są interpretowane, a zawór bezpieczeństwa oznaczony PSV jest czytany jako zawór. Typy elektryczne to stały słownik bez jakiejkolwiek weryfikacji elektrycznej: zasilanie pętli, obciążalność, długość kabla, parametry barier i obliczenia iskrobezpieczeństwa wg IEC 60079-11 są poza zakresem, a iskrobezpieczeństwo jest wyłącznie cechą rozdzielenia. NE 43 stosowane jest jako poziomy urządzenia 3,6 / 3,8 / 20,5 / 21 mA; margines wykrywania dla systemów sterowania z wydania 2021 nie jest stosowany. Ciśnienie porównywane jest tak, jak je wpisano, więc nie rozróżnia się względnego i bezwzględnego. Nastawy i przywołane oznaczenia czytane są z opisu funkcjonalnego i macierzy przyczynowo-skutkowej wyłącznie w ustalonych postaciach pól; warunek zapisany tekstem swobodnym liczony jest jako nierozebrany i nie jest sprawdzany. Kasety zapełniane są w kolejności gniazd, bez modelowania zasilaczy, modułów komunikacyjnych i rezerwacji gniazd, a sygnał magistrali obiektowej nie zajmuje kanału. Ustalenia są pomocą przy przeglądzie inżynierskim, a nie weryfikacją SIL: nie liczy się PFD, architektury ani tolerancji uszkodzeń sprzętu. Link trwały niesie stan tylko dopóki koduje się w 4 kB, czyli około 40–60 sygnałów; dłuższa lista przenoszona jest pakietem projektu albo plikiem zapisu."
 },

   "en": "Benchmarked against an independent reference corpus (benchmarks/iolist.reference.json, 159 cases and 420 checks, written by a separate agent from the public specification SPEC-iolist and the cited standards, with no access to this page): 159 cases and 420 checks pass. The corpus covers the ISA-5.1 letter parse of section 4.2, the NAMUR NE 43 levels of section 4.3, the card-count, placement, rack and slot arithmetic of sections 4.4 to 4.6, the counts and spare fractions of section 4.7, all 37 review rules with one triggering case and one near miss each, the verdict logic of section 6 and the four worked examples of section 9. Five disagreements between the corpus and this page were settled by an independent adjudication on 2026-09-23: four against the page, one against the corpus. Package transport, the interface and the seven-language strings stay outside the corpus and are listed in the artifact benchmarks/iolist.json.",

   "de": "Gegen einen unabhängigen Referenzkorpus gewertet (benchmarks/iolist.reference.json, 159 Fälle und 420 Prüfungen, von einem anderen Agenten aus der öffentlichen Spezifikation SPEC-iolist und den zitierten Normen ohne Zugriff auf diese Seite verfasst): 159 Fälle und 420 Prüfungen bestehen. Der Korpus deckt die ISA-5.1-Buchstabenauswertung aus Abschnitt 4.2 ab, die NAMUR-NE-43-Pegel aus Abschnitt 4.3, die Arithmetik für Kartenzahl, Platzierung, Träger und Steckplatz aus den Abschnitten 4.4 bis 4.6, die Stückzahlen und Reserveanteile aus Abschnitt 4.7, alle 37 Prüfregeln mit je einem auslösenden Fall und einem Grenzfall knapp darunter, die Urteilslogik aus Abschnitt 6 und die vier ausgearbeiteten Beispiele aus Abschnitt 9. Fünf Abweichungen zwischen Korpus und Seite hat eine unabhängige Schlichtung am 2026-09-23 entschieden: vier gegen die Seite, eine gegen den Korpus. Projektpaket-Transport, Oberfläche und die Texte in sieben Sprachen bleiben außerhalb des Korpus und stehen im Artefakt benchmarks/iolist.json.",
   "nl": "Getoetst aan een onafhankelijk referentiecorpus (benchmarks/iolist.reference.json, 159 gevallen en 420 controles, geschreven door een andere agent op basis van de publieke specificatie SPEC-iolist en de geciteerde normen, zonder toegang tot deze pagina): 159 gevallen en 420 controles slagen. Het corpus dekt de ISA-5.1-letterontleding van paragraaf 4.2, de NAMUR NE 43-niveaus van paragraaf 4.3, de rekenkunde voor kaartaantal, plaatsing, rack en slot van paragraaf 4.4 tot en met 4.6, de aantallen en reservefracties van paragraaf 4.7, alle 37 toetsregels met per regel één geval dat aanslaat en één dat er net onder blijft, de oordeelslogica van paragraaf 6 en de vier uitgewerkte voorbeelden van paragraaf 9. Vijf verschillen tussen corpus en pagina zijn op 2026-09-23 door een onafhankelijke arbitrage beslecht: vier tegen de pagina, één tegen het corpus. Projectpakkettransport, de interface en de teksten in zeven talen vallen buiten het corpus en staan in het artefact benchmarks/iolist.json.",
   "fr": "Évalué face à un corpus de référence indépendant (benchmarks/iolist.reference.json, 159 cas et 420 contrôles, rédigé par un autre agent à partir de la spécification publique SPEC-iolist et des normes citées, sans accès à cette page) : 159 cas et 420 contrôles passent. Le corpus couvre l'analyse des lettres ISA-5.1 de la section 4.2, les niveaux NAMUR NE 43 de la section 4.3, l'arithmétique du nombre de cartes, du placement, du châssis et de l'emplacement des sections 4.4 à 4.6, les effectifs et les fractions de réserve de la section 4.7, les 37 règles de revue avec pour chacune un cas déclencheur et un cas juste en deçà, la logique du verdict de la section 6 et les quatre exemples traités de la section 9. Cinq désaccords entre le corpus et cette page ont été tranchés par un arbitrage indépendant le 2026-09-23 : quatre contre la page, un contre le corpus. Le transport du dossier de projet, l'interface et les textes en sept langues restent hors du corpus et figurent dans l'artefact benchmarks/iolist.json.",
   "es": "Contrastado con un corpus de referencia independiente (benchmarks/iolist.reference.json, 159 casos y 420 comprobaciones, redactado por otro agente a partir de la especificación pública SPEC-iolist y de las normas citadas, sin acceso a esta página): pasan 159 casos y 420 comprobaciones. El corpus cubre el análisis de letras ISA-5.1 de la sección 4.2, los niveles NAMUR NE 43 de la sección 4.3, la aritmética de número de tarjetas, colocación, bastidor y ranura de las secciones 4.4 a 4.6, los recuentos y las fracciones de reserva de la sección 4.7, las 37 reglas de revisión con un caso que dispara y otro que se queda justo por debajo en cada una, la lógica del veredicto de la sección 6 y los cuatro ejemplos resueltos de la sección 9. Cinco discrepancias entre el corpus y esta página las resolvió un arbitraje independiente el 2026-09-23: cuatro contra la página y una contra el corpus. El transporte del paquete de proyecto, la interfaz y los textos en siete idiomas quedan fuera del corpus y constan en el artefacto benchmarks/iolist.json.",
   "pl": "Oceniono wobec niezależnego korpusu odniesienia (benchmarks/iolist.reference.json, 159 przypadków i 420 sprawdzeń, napisanego przez innego agenta na podstawie publicznej specyfikacji SPEC-iolist i przywołanych norm, bez dostępu do tej strony): przechodzi 159 przypadków i 420 sprawdzeń. Korpus obejmuje rozbiór liter ISA-5.1 z rozdz. 4.2, poziomy NAMUR NE 43 z rozdz. 4.3, arytmetykę liczby kart, rozmieszczenia, kasety i gniazda z rozdz. 4.4–4.6, zliczenia i udziały rezerwy z rozdz. 4.7, wszystkie 37 reguł przeglądu z jednym przypadkiem wyzwalającym i jednym tuż poniżej progu dla każdej, logikę werdyktu z rozdz. 6 oraz cztery opracowane przykłady z rozdz. 9. Pięć rozbieżności między korpusem a stroną rozstrzygnął niezależny arbitraż 2026-09-23: cztery przeciw stronie, jedną przeciw korpusowi. Przenoszenie pakietu projektowego, interfejs i teksty w siedmiu językach pozostają poza korpusem i są wymienione w artefakcie benchmarks/iolist.json."

genreText:{en:"An engineering review aid for an I/O list. The allocation is deterministic and ignores cost, cabinet space, power supplies and communication modules; the findings are not a SIL verification and no PFD, architecture or hardware-fault-tolerance figure is computed.",uk:"Допоміжний інструмент інженерного перегляду переліку сигналів. Розподіл детермінований і не враховує вартість, місце в шафі, блоки живлення та комунікаційні модулі; зауваження не є верифікацією SIL — PFD, архітектура та відмовостійкість не обчислюються.",de:"Eine Prüfhilfe für die E/A-Liste. Die Zuordnung ist deterministisch und berücksichtigt weder Kosten noch Schrankplatz, Netzteile oder Kommunikationsbaugruppen; die Befunde sind keine SIL-Verifikation, PFD, Architektur und Fehlertoleranz werden nicht gerechnet.",nl:"Een controlehulpmiddel voor de I/O-lijst. De toewijzing is deterministisch en houdt geen rekening met kosten, kastruimte, voedingen of communicatiemodules; de bevindingen zijn geen SIL-verificatie en PFD, architectuur en fouttolerantie worden niet berekend.",fr:"Une aide à la revue d’une liste d’E/S. L’affectation est déterministe et ignore le coût, la place en armoire, les alimentations et les modules de communication ; les constats ne constituent pas une vérification SIL : ni PFD, ni architecture, ni tolérance aux défauts matériels ne sont calculés.",es:"Una ayuda de revisión para la lista de E/S. La asignación es determinista e ignora coste, espacio en armario, fuentes de alimentación y módulos de comunicación; los hallazgos no son una verificación SIL y no se calculan PFD, arquitectura ni tolerancia a fallos.",pl:"Pomoc przy przeglądzie listy we/wy. Przydział jest deterministyczny i pomija koszt, miejsce w szafie, zasilacze i moduły komunikacyjne; ustalenia nie są weryfikacją SIL — nie liczy się PFD, architektury ani tolerancji uszkodzeń sprzętu."},

noteLink:{en:"The encoded state is {n} characters, past the ~4 kB permalink budget. Carry this list in the project package or the JSON record file instead.",uk:"Закодований стан має {n} символів — понад бюджет постійного посилання ~4 кБ. Передавайте перелік через пакет проєкту або файл запису JSON.",de:"Der kodierte Zustand hat {n} Zeichen, mehr als das ~4-kB-Budget des Permalinks. Übertragen Sie die Liste über das Projektpaket oder die JSON-Aufzeichnung.",nl:"De gecodeerde toestand telt {n} tekens, meer dan het permalinkbudget van ~4 kB. Draag deze lijst over via het projectpakket of het JSON-record.",fr:"L’état encodé fait {n} caractères, au-delà du budget de ~4 ko du lien permanent. Transportez cette liste par le dossier de projet ou le fichier d’enregistrement JSON.",es:"El estado codificado ocupa {n} caracteres, por encima del presupuesto de ~4 kB del enlace permanente. Transporte esta lista mediante el paquete de proyecto o el registro JSON.",pl:"Zakodowany stan ma {n} znaków, ponad budżet ~4 kB linku trwałego. Przenoś tę listę pakietem projektu albo plikiem zapisu JSON."},
noteUnalloc:{en:"{n} signal(s) carry no channel address.",uk:"{n} сигнал(ів) не мають адреси каналу.",de:"{n} Signal(e) haben keine Kanaladresse.",nl:"{n} signaal(en) hebben geen kanaaladres.",fr:"{n} signal(aux) sans adresse de voie.",es:"{n} señal(es) sin dirección de canal.",pl:"{n} sygnał(ów) bez adresu kanału."},
footer:{en:"Tag letters per ANSI/ISA-5.1-2022 Table 4.1; electrical type families per IEC 61131-2:2017 clauses 6.4 and 6.5; 4–20 mA failure levels per NAMUR NE 43 (3.8 … 20.5 mA measurement, ≤ 3.6 mA or ≥ 21 mA failure). Cards C = max(⌈n / (c (1 − s))⌉, V); channels are filled in tag order.",uk:"Літери позначень за ANSI/ISA-5.1-2022, табл. 4.1; сімейства електричних типів за IEC 61131-2:2017, розд. 6.4 і 6.5; рівні відмови 4–20 мА за NAMUR NE 43 (вимірювання 3,8 … 20,5 мА, відмова ≤ 3,6 або ≥ 21 мА). Карти C = max(⌈n / (c (1 − s))⌉, V); канали заповнюються за порядком позначень.",de:"Kennbuchstaben nach ANSI/ISA-5.1-2022 Tabelle 4.1; elektrische Typfamilien nach IEC 61131-2:2017 Abschnitt 6.4 und 6.5; 4–20-mA-Ausfallpegel nach NAMUR NE 43 (Messbereich 3,8 … 20,5 mA, Ausfall ≤ 3,6 oder ≥ 21 mA). Karten C = max(⌈n / (c (1 − s))⌉, V); Kanäle werden in Kennzeichenreihenfolge belegt.",nl:"Kenletters volgens ANSI/ISA-5.1-2022 tabel 4.1; elektrische typefamilies volgens IEC 61131-2:2017 artikel 6.4 en 6.5; 4–20 mA-faalniveaus volgens NAMUR NE 43 (meting 3,8 … 20,5 mA, storing ≤ 3,6 of ≥ 21 mA). Kaarten C = max(⌈n / (c (1 − s))⌉, V); kanalen worden op tagvolgorde gevuld.",fr:"Lettres de repérage selon ANSI/ISA-5.1-2022 tableau 4.1 ; familles de types électriques selon CEI 61131-2:2017 articles 6.4 et 6.5 ; niveaux de défaut 4–20 mA selon NAMUR NE 43 (mesure 3,8 … 20,5 mA, défaut ≤ 3,6 ou ≥ 21 mA). Cartes C = max(⌈n / (c (1 − s))⌉, V) ; les voies sont remplies dans l’ordre des repères.",es:"Letras de identificación según ANSI/ISA-5.1-2022 tabla 4.1; familias de tipos eléctricos según IEC 61131-2:2017 apartados 6.4 y 6.5; niveles de fallo 4–20 mA según NAMUR NE 43 (medida 3,8 … 20,5 mA, fallo ≤ 3,6 o ≥ 21 mA). Tarjetas C = max(⌈n / (c (1 − s))⌉, V); los canales se llenan por orden de TAG.",pl:"Litery oznaczeń wg ANSI/ISA-5.1-2022 tabl. 4.1; rodziny typów elektrycznych wg IEC 61131-2:2017 pkt 6.4 i 6.5; poziomy uszkodzenia 4–20 mA wg NAMUR NE 43 (pomiar 3,8 … 20,5 mA, uszkodzenie ≤ 3,6 lub ≥ 21 mA). Karty C = max(⌈n / (c (1 − s))⌉, V); kanały zapełniane w kolejności oznaczeń."},

/* ---- method notes for the printed sheet, in the document language ---- */
mRange1:{en:"Up to 5000 signals, 32 controllers and 64 card types.",uk:"До 5000 сигналів, 32 контролерів і 64 типів карт.",de:"Bis zu 5000 Signale, 32 Steuerungen und 64 Kartentypen.",nl:"Tot 5000 signalen, 32 controllers en 64 kaarttypen.",fr:"Jusqu’à 5000 signaux, 32 automates et 64 types de cartes.",es:"Hasta 5000 señales, 32 controladores y 64 tipos de tarjeta.",pl:"Do 5000 sygnałów, 32 sterowników i 64 typów kart."},
mRange2:{en:"The permalink carries the state while it encodes to 4 kB, about 40 to 60 signals.",uk:"Постійне посилання несе стан, поки він кодується в 4 кБ — приблизно 40–60 сигналів.",de:"Der Permalink trägt den Zustand, solange er in 4 kB kodiert, etwa 40 bis 60 Signale.",nl:"De permalink draagt de toestand zolang die in 4 kB codeert, ongeveer 40 tot 60 signalen.",fr:"Le lien permanent porte l’état tant qu’il tient en 4 ko, soit 40 à 60 signaux.",es:"El enlace permanente lleva el estado mientras se codifique en 4 kB, unas 40 a 60 señales.",pl:"Link trwały niesie stan, dopóki koduje się w 4 kB, czyli około 40–60 sygnałów."},
mRange3:{en:"Pressure is compared as entered: gauge and absolute are not distinguished.",uk:"Тиск порівнюється як введено: надлишковий і абсолютний не розрізняються.",de:"Druck wird wie eingegeben verglichen: Über- und Absolutdruck werden nicht unterschieden.",nl:"Druk wordt vergeleken zoals ingevoerd: overdruk en absolute druk worden niet onderscheiden.",fr:"La pression est comparée telle que saisie : relative et absolue ne sont pas distinguées.",es:"La presión se compara tal como se introduce: no se distinguen manométrica y absoluta.",pl:"Ciśnienie porównywane jest tak, jak je wpisano: nie rozróżnia się względnego i bezwzględnego."},
mNote1:{en:"The allocation is deterministic and cannot be pinned: adding one signal can move others.",uk:"Розподіл детермінований і не піддається закріпленню: додавання одного сигналу може зсунути інші.",de:"Die Zuordnung ist deterministisch und nicht festlegbar: ein zusätzliches Signal kann andere verschieben.",nl:"De toewijzing is deterministisch en niet vast te zetten: één signaal erbij kan andere verplaatsen.",fr:"L’affectation est déterministe et non figeable : l’ajout d’un signal peut en déplacer d’autres.",es:"La asignación es determinista y no se puede fijar: añadir una señal puede desplazar otras.",pl:"Przydział jest deterministyczny i nie da się go przypiąć: dodanie jednego sygnału może przesunąć inne."},
mNote2:{en:"The first eligible card type in the controller list is used; no card mix is optimised.",uk:"Використовується перший придатний тип карти зі списку контролера; склад карт не оптимізується.",de:"Der erste geeignete Kartentyp aus der Steuerungsliste wird verwendet; kein Kartenmix wird optimiert.",nl:"Het eerste geschikte kaarttype uit de controllerlijst wordt gebruikt; geen kaartmix wordt geoptimaliseerd.",fr:"Le premier type de carte éligible de la liste de l’automate est retenu ; aucun mélange de cartes n’est optimisé.",es:"Se usa el primer tipo de tarjeta admisible de la lista del controlador; no se optimiza la mezcla.",pl:"Używany jest pierwszy dopuszczalny typ karty z listy sterownika; dobór kart nie jest optymalizowany."},
mNote3:{en:"No loop-power, burden, cable-length or IEC 60079-11 entity calculation is made.",uk:"Розрахунків живлення контуру, навантаження, довжини кабелю чи параметрів за IEC 60079-11 не виконується.",de:"Es wird keine Schleifenspeisung, Bürde, Leitungslänge oder Kenngrößenrechnung nach IEC 60079-11 durchgeführt.",nl:"Er wordt geen lusvoeding, belasting, kabellengte of IEC 60079-11-entiteitsberekening gemaakt.",fr:"Aucun calcul d’alimentation de boucle, de charge, de longueur de câble ni d’entité CEI 60079-11 n’est fait.",es:"No se realiza cálculo de alimentación de lazo, carga, longitud de cable ni de entidad IEC 60079-11.",pl:"Nie wykonuje się obliczeń zasilania pętli, obciążalności, długości kabla ani parametrów wg IEC 60079-11."},
mNote4:{en:"The findings are a review aid, not a SIL verification.",uk:"Зауваження — допоміжний засіб перегляду, а не верифікація SIL.",de:"Die Befunde sind eine Prüfhilfe, keine SIL-Verifikation.",nl:"De bevindingen zijn een controlehulpmiddel, geen SIL-verificatie.",fr:"Les constats sont une aide à la revue, pas une vérification SIL.",es:"Los hallazgos son una ayuda de revisión, no una verificación SIL.",pl:"Ustalenia są pomocą przy przeglądzie, nie weryfikacją SIL."},
mNote5:{en:"In the rack equation g counts the cards of one controller from zero and S is its slots per rack.",uk:"У рівнянні кошика g нумерує карти одного контролера з нуля, а S — кількість слотів на кошик.",de:"In der Trägergleichung zählt g die Karten einer Steuerung ab null und S ist deren Steckplätze je Träger.",nl:"In de rackvergelijking telt g de kaarten van één controller vanaf nul en is S het aantal slots per rack.",fr:"Dans l’équation du châssis, g numérote les cartes d’un automate à partir de zéro et S est ses emplacements par châssis.",es:"En la ecuación del bastidor, g cuenta las tarjetas de un controlador desde cero y S son sus ranuras por bastidor.",pl:"W równaniu kasety g numeruje karty jednego sterownika od zera, a S to liczba jego gniazd na kasetę."},
mNote6:{en:"The NAMUR NE 43 levels are taken from a third-party reproduction of the standard rather than from a licensed copy.",uk:"Рівні NAMUR NE 43 взято з відтворення стандарту третьою стороною, а не з ліцензійного примірника.",de:"Die NAMUR-NE-43-Pegel stammen aus einer Wiedergabe der Norm durch Dritte und nicht aus einem lizenzierten Exemplar.",nl:"De NAMUR NE 43-niveaus komen uit een weergave van de norm door derden en niet uit een gelicentieerd exemplaar.",fr:"Les niveaux NAMUR NE 43 proviennent d’une reproduction de la norme par un tiers et non d’un exemplaire sous licence.",es:"Los niveles NAMUR NE 43 proceden de una reproducción de la norma por un tercero y no de un ejemplar con licencia.",pl:"Poziomy NAMUR NE 43 pochodzą z odtworzenia normy przez stronę trzecią, a nie z licencjonowanego egzemplarza."},
mNote7:{en:"Table 4.1 of ANSI/ISA-5.1-2022 was read through a third-party transcription; the succeeding letters E, A and L and the close modifier C are this tool's own reading.",uk:"Таблицю 4.1 ANSI/ISA-5.1-2022 прочитано через транскрипцію третьої сторони; наступні літери E, A та L і модифікатор закриття C — власне тлумачення цього інструмента.",de:"Tabelle 4.1 der ANSI/ISA-5.1-2022 wurde über eine Transkription Dritter gelesen; die nachfolgenden Buchstaben E, A und L sowie der Schließmodifikator C sind die eigene Lesart dieses Werkzeugs.",nl:"Tabel 4.1 van ANSI/ISA-5.1-2022 is via een transcriptie van derden gelezen; de volgletters E, A en L en de sluitmodificator C zijn de eigen lezing van deze tool.",fr:"Le tableau 4.1 de l’ANSI/ISA-5.1-2022 a été lu via une transcription tierce ; les lettres suivantes E, A et L et le modificateur de fermeture C relèvent de la lecture propre à cet outil.",es:"La tabla 4.1 de ANSI/ISA-5.1-2022 se leyó mediante una transcripción de terceros; las letras siguientes E, A y L y el modificador de cierre C son la lectura propia de esta herramienta.",pl:"Tablicę 4.1 ANSI/ISA-5.1-2022 odczytano przez transkrypcję strony trzeciej; litery następcze E, A i L oraz modyfikator zamknięcia C są własnym odczytem tego narzędzia."},
mNote8:{en:"Channels are filled in tag order, the largest voting group first, so the same list always yields the same addresses.",uk:"Канали заповнюються за порядком позначень, спершу найбільша група голосування, тож однаковий перелік завжди дає однакові адреси.",de:"Kanäle werden in Kennzeichenreihenfolge belegt, die größte Votinggruppe zuerst, sodass dieselbe Liste stets dieselben Adressen ergibt.",nl:"Kanalen worden op tagvolgorde gevuld, de grootste stemgroep eerst, zodat dezelfde lijst altijd dezelfde adressen oplevert.",fr:"Les voies sont remplies dans l’ordre des repères, le plus grand groupe de vote d’abord, de sorte qu’une même liste donne toujours les mêmes adresses.",es:"Los canales se llenan por orden de TAG, primero el mayor grupo de votación, de modo que la misma lista da siempre las mismas direcciones.",pl:"Kanały zapełniane są w kolejności oznaczeń, najpierw największa grupa głosowania, więc ta sama lista zawsze daje te same adresy."},

/* ---- learn ---- */
learnIntroT:{en:"What this tool does",uk:"Що робить цей інструмент",de:"Was dieses Werkzeug tut",nl:"Wat deze tool doet",fr:"Ce que fait cet outil",es:"Qué hace esta herramienta",pl:"Co robi to narzędzie"},
learnIntroB:{en:"You type one row per field signal. The tool reads the tag letters, checks them against the signal type and the range, allocates every channel-bearing signal to cards of the card types you define, and reports counts, cards, spare and a channel map.",uk:"Ви вводите один рядок на кожен польовий сигнал. Інструмент читає літери позначення, звіряє їх із типом сигналу та діапазоном, розподіляє кожен канальний сигнал по картах визначених вами типів і подає підсумки, карти, резерв і карту каналів.",de:"Sie erfassen eine Zeile je Feldsignal. Das Werkzeug liest die Kennbuchstaben, prüft sie gegen Signalart und Bereich, ordnet jedes kanalbehaftete Signal den von Ihnen definierten Kartentypen zu und meldet Stückzahlen, Karten, Reserve und eine Kanalbelegung.",nl:"U voert één rij per veldsignaal in. De tool leest de kenletters, toetst ze aan het signaaltype en het bereik, wijst elk kanaalsignaal toe aan kaarten van de door u gedefinieerde kaarttypen en rapporteert aantallen, kaarten, reserve en een kanaalindeling.",fr:"Vous saisissez une ligne par signal de terrain. L’outil lit les lettres du repère, les confronte au type de signal et à l’étendue, affecte chaque signal à voie aux cartes des types que vous définissez, et rend les effectifs, les cartes, la réserve et l’affectation des voies.",es:"Introduce una fila por señal de campo. La herramienta lee las letras del TAG, las contrasta con el tipo de señal y el rango, asigna cada señal con canal a tarjetas de los tipos que define y reporta recuentos, tarjetas, reserva y un mapa de canales.",pl:"Wpisujesz jeden wiersz na każdy sygnał obiektowy. Narzędzie odczytuje litery oznaczenia, zestawia je z typem sygnału i zakresem, przydziela każdy sygnał kanałowy do kart zdefiniowanych przez Ciebie typów i podaje liczby, karty, zapas oraz mapę kanałów."},
learnTagT:{en:"Tag letters",uk:"Літери позначення",de:"Kennbuchstaben",nl:"Kenletters",fr:"Lettres de repérage",es:"Letras del TAG",pl:"Litery oznaczenia"},
learnTagB:{en:"The last letter run that is followed by a digit is read as the ISA-5.1 letter code. Its first letter is the measured variable and its last letter, after variable and function modifiers are stripped, is the function: T and E transmit an analog value, S and A are switches and alarms, V, Y, Z and C drive a final element. A tag whose letters and signal type disagree is flagged, not corrected.",uk:"Останній ряд літер, за яким іде цифра, читається як літерний код ISA-5.1. Перша літера — вимірювана величина, остання (після відкидання модифікаторів) — функція: T і E передають аналогове значення, S і A — вимикачі й сигналізація, V, Y, Z і C керують виконавчим органом. Розбіжність літер і типу сигналу позначається, а не виправляється.",de:"Die letzte Buchstabenfolge vor einer Ziffer wird als ISA-5.1-Code gelesen. Ihr erster Buchstabe ist die Messgröße, ihr letzter — nach Abzug der Modifikatoren — die Funktion: T und E übertragen einen Analogwert, S und A sind Schalter und Meldungen, V, Y, Z und C treiben ein Stellglied. Ein Widerspruch zwischen Buchstaben und Signalart wird gemeldet, nicht korrigiert.",nl:"De laatste letterreeks gevolgd door een cijfer wordt gelezen als de ISA-5.1-lettercode. De eerste letter is de gemeten grootheid, de laatste — na aftrek van de modificatoren — de functie: T en E zenden een analoge waarde, S en A zijn schakelaars en meldingen, V, Y, Z en C sturen een eindregelorgaan. Een tegenspraak tussen letters en signaaltype wordt gemeld, niet gecorrigeerd.",fr:"La dernière suite de lettres suivie d’un chiffre est lue comme le code ISA-5.1. Sa première lettre est la grandeur mesurée, sa dernière — une fois les modificateurs retirés — la fonction : T et E transmettent une valeur analogique, S et A sont interrupteurs et alarmes, V, Y, Z et C actionnent un organe final. Une contradiction entre lettres et type de signal est signalée, non corrigée.",es:"La última secuencia de letras seguida de un dígito se lee como el código ISA-5.1. Su primera letra es la variable medida y la última — tras retirar los modificadores — la función: T y E transmiten un valor analógico, S y A son interruptores y alarmas, V, Y, Z y C accionan un elemento final. Una contradicción entre letras y tipo de señal se señala, no se corrige.",pl:"Ostatni ciąg liter poprzedzający cyfrę czytany jest jako kod ISA-5.1. Pierwsza litera to wielkość mierzona, ostatnia — po odrzuceniu modyfikatorów — funkcja: T i E przesyłają wartość analogową, S i A to łączniki i sygnalizacja, V, Y, Z i C sterują elementem wykonawczym. Sprzeczność liter z typem sygnału jest zgłaszana, nie poprawiana."},
learnSpareT:{en:"Spare and card count",uk:"Резерв і кількість карт",de:"Reserve und Kartenzahl",nl:"Reserve en kaartaantal",fr:"Réserve et nombre de cartes",es:"Reserva y número de tarjetas",pl:"Zapas i liczba kart"},
learnSpareB:{en:"A group of n signals on a card type of c channels with a spare target s needs C = ⌈n / (c (1 − s))⌉ cards, raised to the size of the largest voting group so its members can sit on separate cards. Twenty-four signals on 8-channel cards at 20 % spare need four cards and leave 25 % spare.",uk:"Група з n сигналів на типі карти з c каналами та ціллю резерву s потребує C = ⌈n / (c (1 − s))⌉ карт, піднятих до розміру найбільшої групи голосування, щоб її члени були на різних картах. Двадцять чотири сигнали на 8-канальних картах при резерві 20 % потребують чотирьох карт і лишають 25 % резерву.",de:"Eine Gruppe von n Signalen auf einem Kartentyp mit c Kanälen und Reserveziel s braucht C = ⌈n / (c (1 − s))⌉ Karten, angehoben auf die Größe der größten Votinggruppe, damit deren Mitglieder auf getrennten Karten liegen. Vierundzwanzig Signale auf 8-Kanal-Karten bei 20 % Reserve brauchen vier Karten und lassen 25 % Reserve.",nl:"Een groep van n signalen op een kaarttype met c kanalen en reservedoel s vergt C = ⌈n / (c (1 − s))⌉ kaarten, verhoogd tot de omvang van de grootste stemgroep zodat de leden op aparte kaarten liggen. Vierentwintig signalen op 8-kanaalskaarten bij 20 % reserve vergen vier kaarten en laten 25 % reserve.",fr:"Un groupe de n signaux sur un type de carte à c voies avec un objectif de réserve s demande C = ⌈n / (c (1 − s))⌉ cartes, porté à la taille du plus grand groupe de vote pour que ses membres occupent des cartes distinctes. Vingt-quatre signaux sur des cartes 8 voies à 20 % de réserve demandent quatre cartes et laissent 25 % de réserve.",es:"Un grupo de n señales sobre un tipo de tarjeta de c canales con objetivo de reserva s exige C = ⌈n / (c (1 − s))⌉ tarjetas, elevado al tamaño del mayor grupo de votación para que sus miembros ocupen tarjetas distintas. Veinticuatro señales en tarjetas de 8 canales al 20 % de reserva exigen cuatro tarjetas y dejan un 25 % de reserva.",pl:"Grupa n sygnałów na typie karty o c kanałach i celu zapasu s wymaga C = ⌈n / (c (1 − s))⌉ kart, podniesionych do rozmiaru największej grupy głosowania, aby jej elementy trafiły na osobne karty. Dwadzieścia cztery sygnały na kartach 8-kanałowych przy zapasie 20 % wymagają czterech kart i zostawiają 25 % zapasu."},
learnNe43T:{en:"NAMUR NE 43 levels",uk:"Рівні NAMUR NE 43",de:"NAMUR-NE-43-Pegel",nl:"NAMUR NE 43-niveaus",fr:"Niveaux NAMUR NE 43",es:"Niveles NAMUR NE 43",pl:"Poziomy NAMUR NE 43"},
learnNe43B:{en:"A compliant 4–20 mA transmitter carries measurement information between 3.8 and 20.5 mA and failure information at or below 3.6 mA or at or above 21 mA. A trip that must act on a rising value therefore cannot be read from a transmitter that fails low: the loop failure looks like a safe reading.",uk:"Сумісний перетворювач 4–20 мА подає вимірювальну інформацію між 3,8 і 20,5 мА, а інформацію про відмову — на рівні ≤ 3,6 мА або ≥ 21 мА. Тому відсічка за зростанням не може читатися з перетворювача, що відмовляє вниз: обрив контуру виглядає як безпечне значення.",de:"Ein konformer 4–20-mA-Messumformer führt Messinformation zwischen 3,8 und 20,5 mA und Ausfallinformation bei höchstens 3,6 mA oder mindestens 21 mA. Eine Abschaltung auf steigenden Wert darf deshalb nicht von einem nach unten ausfallenden Umformer gelesen werden: der Schleifenausfall sieht aus wie ein sicherer Messwert.",nl:"Een conforme 4–20 mA-meetomvormer voert meetinformatie tussen 3,8 en 20,5 mA en storingsinformatie bij ten hoogste 3,6 mA of ten minste 21 mA. Een afschakeling op een stijgende waarde mag daarom niet van een laag falende meetomvormer komen: de lusstoring lijkt op een veilige meetwaarde.",fr:"Un transmetteur 4–20 mA conforme porte l’information de mesure entre 3,8 et 20,5 mA et l’information de défaut à 3,6 mA ou moins, ou 21 mA ou plus. Un déclenchement sur valeur croissante ne peut donc pas être lu sur un transmetteur dont le repli est bas : le défaut de boucle ressemble à une mesure sûre.",es:"Un transmisor 4–20 mA conforme lleva información de medida entre 3,8 y 20,5 mA e información de fallo en 3,6 mA o menos, o 21 mA o más. Un disparo sobre valor creciente no puede por tanto leerse de un transmisor que falla a bajo: el fallo de lazo parece una lectura segura.",pl:"Zgodny przetwornik 4–20 mA przekazuje informację pomiarową między 3,8 a 20,5 mA, a informację o uszkodzeniu przy najwyżej 3,6 mA lub co najmniej 21 mA. Wyłączenie przy wzroście nie może więc być odczytywane z przetwornika uszkadzającego się w dół: uszkodzenie pętli wygląda jak bezpieczny odczyt."},
learnSegT:{en:"Segregation",uk:"Розділення",de:"Trennung",nl:"Scheiding",fr:"Ségrégation",es:"Segregación",pl:"Rozdzielenie"},
learnSegB:{en:"Three separations are enforced while cards are filled: a SIL-related signal only reaches a safety controller and a safety card type, an intrinsically safe circuit only reaches an IS card type, and the members of one voting group are placed on distinct cards whenever the card count allows it.",uk:"Під час заповнення карт дотримуються три розділення: сигнал, пов'язаний із SIL, потрапляє лише на контролер ПАЗ і безпечний тип карти; іскробезпечне коло — лише на іскробезпечний тип карти; члени однієї групи голосування розміщуються на різних картах, якщо кількість карт це дозволяє.",de:"Beim Belegen der Karten werden drei Trennungen eingehalten: ein SIL-relevantes Signal erreicht nur eine Sicherheitssteuerung und einen Sicherheitskartentyp, ein eigensicherer Stromkreis nur einen eigensicheren Kartentyp, und die Mitglieder einer Votinggruppe liegen auf getrennten Karten, soweit die Kartenzahl es zulässt.",nl:"Bij het vullen van de kaarten gelden drie scheidingen: een SIL-gerelateerd signaal komt alleen op een veiligheidscontroller en een veiligheidskaarttype, een intrinsiek veilig circuit alleen op een Ex i-kaarttype, en de leden van één stemgroep komen op aparte kaarten zolang het kaartaantal dat toelaat.",fr:"Trois séparations sont tenues lors du remplissage des cartes : un signal lié à la SIL ne va que sur un automate de sécurité et un type de carte de sécurité, un circuit de sécurité intrinsèque ne va que sur un type de carte SI, et les membres d’un même groupe de vote occupent des cartes distinctes tant que le nombre de cartes le permet.",es:"Al llenar las tarjetas se mantienen tres separaciones: una señal relacionada con SIL solo llega a un controlador de seguridad y a un tipo de tarjeta de seguridad, un circuito de seguridad intrínseca solo a un tipo de tarjeta SI, y los miembros de un mismo grupo de votación ocupan tarjetas distintas mientras el número de tarjetas lo permita.",pl:"Przy zapełnianiu kart utrzymywane są trzy rozdzielenia: sygnał związany z SIL trafia tylko na sterownik bezpieczeństwa i typ karty bezpieczeństwa, obwód iskrobezpieczny tylko na typ karty iskrobezpiecznej, a elementy jednej grupy głosowania trafiają na osobne karty, o ile pozwala na to liczba kart."},

/* Locale per site language: a `lang==='pl'?'pl-PL':'en-GB'` shortcut would put an
   English decimal point next to a table typeset with commas. */
var LOCALE = { en: 'en-GB', uk: 'uk-UA', de: 'de-DE', nl: 'nl-NL', fr: 'fr-FR', es: 'es-ES', pl: 'pl-PL' };
function nfmt(x, digits, lg) {
  if (x == null || !isFinite(x)) return '—';
  var d = digits == null ? 4 : digits;
  var opt = { maximumFractionDigits: d, minimumFractionDigits: 0, useGrouping: Math.abs(x) >= 1e4 };
  try { return Number(x).toLocaleString(LOCALE[lg || lang] || 'en-GB', opt); } catch (e) { return String(x); }
}
/* 4 significant digits, the figure an engineer reads off the sheet */
function sig4(x, lg) {
  if (x == null || !isFinite(x)) return '—';
  if (x === 0) return nfmt(0, 0, lg);
  var m = Math.floor(Math.log10(Math.abs(x)));
  var d = Math.max(0, Math.min(9, 3 - m));
  return nfmt(x, d, lg);
}
function elecLabel(id, lg) { var o = I18N['el_' + id]; return o ? (o[lg || lang] || o.en) : (id || '—'); }
function quantLabel(id, lg) { var o = I18N['q_' + id]; return o ? (o[lg || lang] || o.en) : (id || '—'); }
function failLabel(id, lg) { var o = I18N['fs_' + id]; return o ? (o[lg || lang] || o.en) : (id || '—'); }
function sigLabel(id, lg) { var o = I18N['st_' + id]; return o ? (o[lg || lang] || o.en) : (id || '—'); }
function sevLabel(s, lg) { var o = I18N['sev' + s.charAt(0).toUpperCase() + s.slice(1)]; return o ? (o[lg || lang] || o.en) : s; }

/* One finding, rendered in the document language. The model keeps ids, codes and
   numbers in `vars`, so one template per rule serves all seven languages. */
function ruleDetail(f, lg) {
  lg = lg || lang;
  var tpl = I18N['r.' + f.rule];
  if (!tpl) return f.rule;
  var v = {}, src = f.vars || {};
  Object.keys(src).forEach(function (k) { v[k] = src[k]; });
  if (v.why) { var w = I18N[v.why]; v.why = w ? fill(w[lg] || w.en, { id: v.id == null ? '' : v.id }) : v.why; }
  if (v.elec != null) v.elec = elecLabel(v.elec, lg);
  if (v.quantity != null) v.quantity = quantLabel(v.quantity, lg);
  if (v.fail != null) v.fail = failLabel(v.fail, lg);
  if (v.dir != null) { var d = I18N[v.dir === 'rising' ? 'dirRising' : 'dirFalling']; v.dir = d[lg] || d.en; }
  if (v.exp === '') { var e = I18N.expNone; v.exp = e[lg] || e.en; }
  ['value', 'lo', 'hi'].forEach(function (k) { if (typeof v[k] === 'number') v[k] = sig4(v[k], lg); });
  return fill(tpl[lg] || tpl.en, v);
}
