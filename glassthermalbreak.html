  "title": {"en":"Thermal Breakage Risk of Glass","uk":"Ризик термічного розтріскування скла","de":"Thermobruchrisiko von Glas","nl":"Risico op thermische breuk van glas","fr":"Risque de casse thermique du verre","es":"Riesgo de rotura térmica del vidrio","pl":"Ryzyko pęknięć termicznych szkła"},
  "summary": {"en":"Will a pane crack because its sunlit centre is hotter than its cold edge — frame, partial shade, a blind close behind the glass? Glass temperatures by the energy balance of NBN S 23-002-2 Annex A, edge stress against the EN 16612 edge strength, and which change fixes it.","uk":"Чи трісне скло, бо його освітлений центр гарячіший за холодний край — рама, часткова тінь, штора впритул до скла? Температури скла за енергобалансом NBN S 23-002-2 Annex A, напруження на краю проти міцності краю за EN 16612 і що саме це виправляє.","de":"Springt eine Scheibe, weil ihre besonnte Mitte wärmer ist als der kalte Rand — Rahmen, Teilverschattung, Rollo dicht hinter dem Glas? Glastemperaturen nach der Energiebilanz von NBN S 23-002-2 Anhang A, Randspannung gegen die Kantenfestigkeit nach EN 16612 und welche Änderung hilft.","nl":"Barst een ruit omdat het bezonde midden warmer is dan de koude rand — kader, gedeeltelijke schaduw, een scherm vlak achter het glas? Glastemperaturen volgens de energiebalans van NBN S 23-002-2 bijlage A, randspanning tegen de randsterkte volgens EN 16612, en welke ingreep het oplost.","fr":"Un vitrage va-t-il casser parce que son centre ensoleillé est plus chaud que son bord froid — châssis, ombre partielle, store tout près du verre ? Températures du verre par le bilan énergétique de la NBN S 23-002-2 annexe A, contrainte de bord comparée à la résistance de bord EN 16612, et la mesure qui corrige.","es":"¿Se romperá un vidrio porque su centro soleado está más caliente que su borde frío — marco, sombra parcial, una persiana pegada al vidrio? Temperaturas del vidrio por el balance energético de NBN S 23-002-2 anexo A, tensión de borde frente a la resistencia de borde de EN 16612 y qué cambio lo soluciona.","pl":"Czy szyba pęknie, bo jej nasłoneczniony środek jest cieplejszy niż zimna krawędź — rama, częściowy cień, roleta tuż za szkłem? Temperatury szkła z bilansu energii NBN S 23-002-2 załącznik A, naprężenie krawędzi wobec wytrzymałości krawędzi wg EN 16612 i która zmiana to naprawia."},
  "description": {"en":"Describe the glazing (single, double or triple; generic optical type, thickness, glass type and edge finish of each pane, gas and cavity width), the sun and climate (irradiance on the glass, outdoor and indoor temperature, wind), the frame (light or thermally broken or heavy surround, colour, edge cover), partial shadow and an internal blind. The tool solves the steady-state glass temperatures of NBN S 23-002-2:2020 Annex A (absorption with multiple reflections, he = 4 + 4·v, gas-gap conductance by NBN EN 673), estimates the temperature of the glass edge and of a shaded zone, and turns the difference into the edge stress σ = E·αT·ΔT. It compares that stress with the design edge strength of EN 16612:2019 (ke, kmod for the daily peak, γM) for annealed, heat-strengthened and toughened glass, shows the allowable ΔT, a risk level and a ranked list of fixes. The method NBN S 23-002:2007 §4.4.1.3 points to (FIV 01) is not available: the edge, shadow and blind factors are labelled learning assumptions you can override.","uk":"Опишіть скління (одинарне, дво- або трикамерне; узагальнений оптичний тип, товщина, тип скла й обробка кромки кожного скла, газ і ширина камери), сонце й клімат (опромінення скла, зовнішня і внутрішня температура, вітер), раму (легка, з терморозривом або масивний укіс, колір, заглиблення кромки), часткову тінь і внутрішню штору. Інструмент розв’язує стаціонарні температури скла за NBN S 23-002-2:2020 Annex A (поглинання з багаторазовими відбиттями, he = 4 + 4·v, провідність газового прошарку за NBN EN 673), оцінює температуру кромки й затіненої зони і переводить різницю в напруження на краю σ = E·αT·ΔT. Його порівнюють із розрахунковою міцністю краю за EN 16612:2019 (ke, kmod для денного піку, γM) для відпаленого, термозміцненого і загартованого скла; показано допустиму ΔT, рівень ризику і впорядкований перелік рішень. Метод, на який посилається NBN S 23-002:2007 §4.4.1.3 (FIV 01), недоступний: коефіцієнти кромки, тіні й штори — позначені навчальні припущення, їх можна змінити.","de":"Beschreiben Sie die Verglasung (Einfach-, Zweifach- oder Dreifachglas; generischer optischer Typ, Dicke, Glasart und Kantenbearbeitung jeder Scheibe, Gas und SZR-Breite), Sonne und Klima (Einstrahlung auf das Glas, Außen- und Innentemperatur, Wind), den Rahmen (leicht, thermisch getrennt oder massive Laibung, Farbe, Glaseinstand), Teilverschattung und ein inneres Rollo. Das Werkzeug löst die stationären Glastemperaturen nach NBN S 23-002-2:2020 Anhang A (Absorption mit Mehrfachreflexion, he = 4 + 4·v, Gasraumleitwert nach NBN EN 673), schätzt die Temperatur der Glaskante und einer verschatteten Zone und rechnet die Differenz in die Randspannung σ = E·αT·ΔT um. Diese wird mit der Bemessungs-Kantenfestigkeit nach EN 16612:2019 (ke, kmod für die Tagesspitze, γM) für Float, TVG und ESG verglichen; dazu zulässiges ΔT, Risikostufe und eine gereihte Liste von Abhilfen. Das in NBN S 23-002:2007 §4.4.1.3 genannte Verfahren (FIV 01) ist nicht verfügbar: Kanten-, Schatten- und Rollofaktoren sind gekennzeichnete Lernannahmen, die Sie überschreiben können.","nl":"Beschrijf de beglazing (enkel, dubbel of drievoudig; generiek optisch type, dikte, glassoort en randafwerking per ruit, gas en spouwbreedte), zon en klimaat (instraling op het glas, buiten- en binnentemperatuur, wind), het kader (licht, thermisch onderbroken of zware dagkant, kleur, glasinklemming), gedeeltelijke schaduw en een binnenscherm. De tool lost de stationaire glastemperaturen op volgens NBN S 23-002-2:2020 bijlage A (absorptie met meervoudige reflecties, he = 4 + 4·v, spouwgeleiding volgens NBN EN 673), schat de temperatuur van de glasrand en van een beschaduwde zone en zet het verschil om in de randspanning σ = E·αT·ΔT. Die wordt vergeleken met de rekenwaarde van de randsterkte volgens EN 16612:2019 (ke, kmod voor de dagpiek, γM) voor gegloeid, thermisch versterkt en gehard glas; met toelaatbare ΔT, risiconiveau en een gerangschikte lijst van oplossingen. De methode waarnaar NBN S 23-002:2007 §4.4.1.3 verwijst (FIV 01) is niet beschikbaar: de rand-, schaduw- en schermfactoren zijn gemarkeerde leeraannames die u kunt aanpassen.","fr":"Décrivez le vitrage (simple, double ou triple ; type optique générique, épaisseur, type de verre et façonnage des bords de chaque feuille, gaz et largeur de lame), le soleil et le climat (éclairement sur le verre, températures extérieure et intérieure, vent), le châssis (léger, à rupture de pont thermique ou ébrasement massif, teinte, prise en feuillure), l’ombre partielle et un store intérieur. L’outil résout les températures du verre en régime permanent selon la NBN S 23-002-2:2020 annexe A (absorption avec réflexions multiples, he = 4 + 4·v, conductance de la lame de gaz selon la NBN EN 673), estime la température du bord et d’une zone ombragée et convertit l’écart en contrainte de bord σ = E·αT·ΔT. Celle-ci est comparée à la résistance de calcul du bord selon l’EN 16612:2019 (ke, kmod pour le pic journalier, γM) pour verre recuit, durci et trempé ; avec ΔT admissible, niveau de risque et liste classée des remèdes. La méthode visée par la NBN S 23-002:2007 §4.4.1.3 (FIV 01) n’est pas disponible : les facteurs de bord, d’ombre et de store sont des hypothèses pédagogiques signalées et modifiables.","es":"Describa el acristalamiento (simple, doble o triple; tipo óptico genérico, espesor, tipo de vidrio y acabado de canto de cada hoja, gas y ancho de cámara), el sol y el clima (irradiancia sobre el vidrio, temperaturas exterior e interior, viento), el marco (ligero, con rotura de puente térmico o jamba maciza, color, galce) , la sombra parcial y una persiana interior. La herramienta resuelve las temperaturas estacionarias del vidrio según NBN S 23-002-2:2020 anexo A (absorción con reflexiones múltiples, he = 4 + 4·v, conductancia de la cámara según NBN EN 673), estima la temperatura del canto y de una zona en sombra y convierte la diferencia en la tensión de borde σ = E·αT·ΔT. La compara con la resistencia de cálculo del canto de EN 16612:2019 (ke, kmod para el pico diario, γM) para vidrio recocido, termoendurecido y templado; con ΔT admisible, nivel de riesgo y una lista ordenada de soluciones. El método al que remite NBN S 23-002:2007 §4.4.1.3 (FIV 01) no está disponible: los factores de canto, sombra y persiana son supuestos didácticos señalados que puede modificar.","pl":"Opisz oszklenie (pojedyncze, dwu- lub trzyszybowe; ogólny typ optyczny, grubość, rodzaj szkła i obróbka krawędzi każdej tafli, gaz i szerokość komory), słońce i klimat (natężenie promieniowania na szkło, temperatura zewnętrzna i wewnętrzna, wiatr), ramę (lekka, z przekładką termiczną lub masywny ościeże, kolor, głębokość wpustu), częściowy cień i wewnętrzną roletę. Narzędzie rozwiązuje ustalone temperatury szkła wg NBN S 23-002-2:2020 załącznik A (absorpcja z wielokrotnymi odbiciami, he = 4 + 4·v, przewodność komory wg NBN EN 673), szacuje temperaturę krawędzi i strefy zacienionej i przelicza różnicę na naprężenie krawędzi σ = E·αT·ΔT. Porównuje je z obliczeniową wytrzymałością krawędzi wg EN 16612:2019 (ke, kmod dla dziennego szczytu, γM) dla szkła odprężonego, wzmocnionego termicznie i hartowanego; z dopuszczalnym ΔT, poziomem ryzyka i uszeregowaną listą rozwiązań. Metoda wskazana w NBN S 23-002:2007 §4.4.1.3 (FIV 01) jest niedostępna: współczynniki krawędzi, cienia i rolety to oznaczone założenia dydaktyczne, które można zmienić."},

  "limitations": {"en":"Steady state at one moment (no thermal inertia of the glass, no hourly sun path); vertical glazing; generic optical data — use the supplier’s EN 410 values for a real product. Edge, shadow and blind factors are learning assumptions (FIV 01 not available), not a manufacturer’s thermal-safety assessment. No wind, snow or climatic-load check (Glass Thickness tool), no safety-glass rules (Safety Glazing Selector); point-fixed, structural-silicone, curved and fire-resistant glass are out of scope.","uk":"Стаціонарний стан в один момент (без теплової інерції скла, без погодинного руху сонця); вертикальне скління; узагальнені оптичні дані — для реального виробу беріть значення EN 410 постачальника. Коефіцієнти кромки, тіні й штори — навчальні припущення (FIV 01 недоступний), а не оцінка термобезпеки виробника. Без перевірки вітру, снігу й кліматичних навантажень (інструмент товщини скла), без правил безпечного скла (вибір безпечного скління); точкове кріплення, структурний силікон, гнуте й вогнестійке скло — поза межами.","de":"Stationärer Zustand zu einem Zeitpunkt (keine Wärmeträgheit des Glases, kein stündlicher Sonnenstand); senkrechte Verglasung; generische optische Daten — für ein reales Produkt die EN-410-Werte des Herstellers verwenden. Kanten-, Schatten- und Rollofaktoren sind Lernannahmen (FIV 01 nicht verfügbar), keine Thermosicherheitsbewertung des Herstellers. Keine Wind-, Schnee- oder Klimalastprüfung (Werkzeug Glasdicke), keine Sicherheitsglasregeln (Auswahl von Sicherheitsverglasung); punktgehaltenes, geklebtes, gebogenes und Brandschutzglas sind nicht erfasst.","nl":"Stationaire toestand op één moment (geen thermische traagheid van het glas, geen zonnebaan per uur); verticale beglazing; generieke optische gegevens — gebruik voor een echt product de EN 410-waarden van de leverancier. Rand-, schaduw- en schermfactoren zijn leeraannames (FIV 01 niet beschikbaar), geen thermische veiligheidsbeoordeling van de fabrikant. Geen controle op wind, sneeuw of klimaatbelasting (tool Glasdikte), geen regels voor veiligheidsglas (Keuze van veiligheidsbeglazing); puntbevestigd, structureel verlijmd, gebogen en brandwerend glas vallen erbuiten.","fr":"Régime permanent à un instant (pas d’inertie thermique du verre, pas de course horaire du soleil) ; vitrage vertical ; données optiques génériques — pour un produit réel, utiliser les valeurs EN 410 du fournisseur. Les facteurs de bord, d’ombre et de store sont des hypothèses pédagogiques (FIV 01 indisponible), pas une évaluation de sécurité thermique du fabricant. Pas de vérification au vent, à la neige ni aux charges climatiques (outil Épaisseur de verre), pas de règles de verre de sécurité (Choix du vitrage de sécurité) ; verre attaché, VEC, bombé et résistant au feu hors domaine.","es":"Régimen estacionario en un instante (sin inercia térmica del vidrio, sin trayectoria horaria del sol); acristalamiento vertical; datos ópticos genéricos — para un producto real use los valores EN 410 del fabricante. Los factores de canto, sombra y persiana son supuestos didácticos (FIV 01 no disponible), no una evaluación de seguridad térmica del fabricante. Sin comprobación de viento, nieve ni cargas climáticas (herramienta de espesor de vidrio), sin reglas de vidrio de seguridad (selección de acristalamiento de seguridad); vidrio abotonado, sellado estructural, curvado y resistente al fuego quedan fuera.","pl":"Stan ustalony w jednej chwili (bez bezwładności cieplnej szkła, bez godzinowego ruchu słońca); oszklenie pionowe; ogólne dane optyczne — dla rzeczywistego wyrobu użyj wartości EN 410 producenta. Współczynniki krawędzi, cienia i rolety to założenia dydaktyczne (FIV 01 niedostępny), a nie ocena bezpieczeństwa termicznego producenta. Bez sprawdzenia wiatru, śniegu i obciążeń klimatycznych (narzędzie grubości szkła), bez zasad szkła bezpiecznego (wybór oszklenia bezpiecznego); szkło mocowane punktowo, klejone strukturalnie, gięte i ogniochronne poza zakresem."},

        "reference": {
          "en": "42 cases (699 points) computed on the page against an independent Python steady-state solver (NBN S 23-002-2:2020 Annex A closed forms A.3 / A.4 with the A.2 gap iteration, NBN EN 673 gap conductance, absorbed fractions by a direct flux solve checked against the EN 410 closed form) and the EN 16612:2019 edge strength: 7 page presets, 30 grid cases, 4 parameter sweeps and a hand case (1/1; built from the same model, not an external published value). The closed forms are independent of the page only in the cases without a blind; the cases with a blind (22 of 42) solve the blind with the same learning-assumption network as the page.",

  'v.negligible': ['Negligible thermal-stress risk: the edge stress stays below half of the design edge strength.', 'Незначний ризик термонапружень: напруження на краю менше половини розрахункової міцності краю.', 'Vernachlässigbares Thermospannungsrisiko: die Randspannung bleibt unter der halben Bemessungs-Kantenfestigkeit.', 'Verwaarloosbaar risico op thermische spanning: de randspanning blijft onder de helft van de rekenwaarde van de randsterkte.', 'Risque de contrainte thermique négligeable : la contrainte de bord reste sous la moitié de la résistance de calcul du bord.', 'Riesgo de tensión térmica despreciable: la tensión de borde queda por debajo de la mitad de la resistencia de cálculo del canto.', 'Pomijalne ryzyko naprężeń termicznych: naprężenie krawędzi poniżej połowy obliczeniowej wytrzymałości krawędzi.'],

  'v.elevated': ['Elevated risk: the design check fails (edge stress above the design edge strength, still below the characteristic value). Change the glass or the situation.', 'Підвищений ризик: розрахункова перевірка не виконується (напруження на краю вище розрахункової міцності, але нижче характеристичної). Змініть скло або умови.', 'Erhöhtes Risiko: der Bemessungsnachweis ist nicht erfüllt (Randspannung über der Bemessungs-, noch unter der charakteristischen Kantenfestigkeit). Glas oder Situation ändern.', 'Verhoogd risico: de rekencontrole faalt (randspanning boven de rekenwaarde, nog onder de karakteristieke randsterkte). Wijzig het glas of de situatie.', 'Risque élevé : la vérification de calcul échoue (contrainte de bord au-dessus de la résistance de calcul, encore sous la valeur caractéristique). Changer le verre ou la situation.', 'Riesgo elevado: la comprobación de cálculo no se cumple (tensión de borde por encima de la resistencia de cálculo, aún por debajo del valor característico). Cambie el vidrio o la situación.', 'Podwyższone ryzyko: sprawdzenie obliczeniowe nie jest spełnione (naprężenie krawędzi powyżej wartości obliczeniowej, jeszcze poniżej charakterystycznej). Zmień szkło lub warunki.'],
  'v.high': ['High risk: the edge stress exceeds even the characteristic edge strength — thermal breakage is likely. Heat-treat the glass or remove the cause.', 'Високий ризик: напруження на краю перевищує навіть характеристичну міцність — термічне розтріскування ймовірне. Термообробіть скло або усуньте причину.', 'Hohes Risiko: die Randspannung übersteigt sogar die charakteristische Kantenfestigkeit — Thermobruch ist wahrscheinlich. Glas vorspannen oder die Ursache beseitigen.', 'Hoog risico: de randspanning overschrijdt zelfs de karakteristieke randsterkte — thermische breuk is waarschijnlijk. Laat het glas thermisch behandelen of neem de oorzaak weg.', 'Risque fort : la contrainte de bord dépasse même la résistance caractéristique — la casse thermique est probable. Traiter thermiquement le verre ou supprimer la cause.', 'Riesgo alto: la tensión de borde supera incluso la resistencia característica — la rotura térmica es probable. Trate térmicamente el vidrio o elimine la causa.', 'Wysokie ryzyko: naprężenie krawędzi przekracza nawet wytrzymałość charakterystyczną — pęknięcie termiczne jest prawdopodobne. Zastosuj szkło obrabiane termicznie lub usuń przyczynę.'],

  'nt.fiv01': ['NBN S 23-002 §4.4.1.3 refers the thermal-stress method to FIV 01, which is not available here: the edge, shadow and blind factors of this tool are learning assumptions — the list of data the specification must give (blinds, shadows, frames, heating, glass type) is the useful part.', 'NBN S 23-002 §4.4.1.3 відсилає метод термонапружень до FIV 01, який тут недоступний: коефіцієнти кромки, тіні й штори в цьому інструменті — навчальні припущення; корисна частина — перелік даних, які має містити специфікація (штори, тіні, рами, опалення, тип скла).', 'NBN S 23-002 §4.4.1.3 verweist für das Thermospannungsverfahren auf FIV 01, das hier nicht verfügbar ist: Kanten-, Schatten- und Rollofaktoren dieses Werkzeugs sind Lernannahmen — nützlich ist die Liste der Angaben, die das Leistungsverzeichnis machen muss (Rollos, Schatten, Rahmen, Heizung, Glasart).', 'NBN S 23-002 §4.4.1.3 verwijst voor de thermische-spanningsmethode naar FIV 01, dat hier niet beschikbaar is: de rand-, schaduw- en schermfactoren van deze tool zijn leeraannames — nuttig is de lijst van gegevens die het bestek moet geven (schermen, schaduwen, kaders, verwarming, glastype).', 'La NBN S 23-002 §4.4.1.3 renvoie la méthode de contrainte thermique au FIV 01, non disponible ici : les facteurs de bord, d’ombre et de store de cet outil sont des hypothèses pédagogiques — la liste des données que le cahier des charges doit fournir (stores, ombres, châssis, chauffage, type de verre) est la partie utile.', 'NBN S 23-002 §4.4.1.3 remite el método de tensión térmica a FIV 01, no disponible aquí: los factores de canto, sombra y persiana de esta herramienta son supuestos didácticos; lo útil es la lista de datos que debe dar el pliego (persianas, sombras, marcos, calefacción, tipo de vidrio).', 'NBN S 23-002 §4.4.1.3 odsyła metodę naprężeń termicznych do FIV 01, niedostępnego tutaj: współczynniki krawędzi, cienia i rolety w tym narzędziu to założenia dydaktyczne — przydatna jest lista danych, które musi podać specyfikacja (rolety, cienie, ramy, ogrzewanie, typ szkła).'],
  'nt.absorbing': ['Pane {pane}: αe {a} % ≥ 45 % and not heat-treated — strongly absorbing glass is outside the NBN S 23-002-3 tables and NBN S 23-002-2 Annex B warns of breakage; heat treatment is recommended.', 'Скло {pane}: αe {a} % ≥ 45 % без термообробки — сильно поглинальне скло поза таблицями NBN S 23-002-3, а NBN S 23-002-2 Annex B попереджає про руйнування; рекомендовано термообробку.', 'Scheibe {pane}: αe {a} % ≥ 45 % ohne Vorspannung — stark absorbierendes Glas liegt außerhalb der Tabellen von NBN S 23-002-3, NBN S 23-002-2 Anhang B warnt vor Bruch; Vorspannung empfohlen.', 'Ruit {pane}: αe {a} % ≥ 45 % en niet thermisch behandeld — sterk absorberend glas valt buiten de tabellen van NBN S 23-002-3 en NBN S 23-002-2 bijlage B waarschuwt voor breuk; thermische behandeling aanbevolen.', 'Verre {pane} : αe {a} % ≥ 45 % non traité thermiquement — un verre fortement absorbant sort des tableaux de la NBN S 23-002-3 et la NBN S 23-002-2 annexe B met en garde contre la casse ; un traitement thermique est recommandé.', 'Hoja {pane}: αe {a} % ≥ 45 % sin tratamiento térmico — el vidrio muy absorbente queda fuera de las tablas de NBN S 23-002-3 y NBN S 23-002-2 anexo B advierte de rotura; se recomienda tratamiento térmico.', 'Tafla {pane}: αe {a} % ≥ 45 % bez obróbki termicznej — szkło silnie pochłaniające jest poza tablicami NBN S 23-002-3, a NBN S 23-002-2 załącznik B ostrzega przed pękaniem; zalecana obróbka termiczna.'],
  'nt.heatsoak': ['Pane {pane} is toughened: thermally robust, but nickel-sulphide inclusions can break it spontaneously — heat soak (EN 14179) where replacement is difficult (NBN S 23-002 §4.4.1.4).', 'Скло {pane} загартоване: термічно стійке, але включення сульфіду нікелю можуть зруйнувати його спонтанно — heat soak (EN 14179), де заміна складна (NBN S 23-002 §4.4.1.4).', 'Scheibe {pane} ist ESG: thermisch robust, aber Nickelsulfid-Einschlüsse können Spontanbruch auslösen — Heißlagerung (EN 14179), wo der Austausch schwierig ist (NBN S 23-002 §4.4.1.4).', 'Ruit {pane} is gehard: thermisch robuust, maar nikkelsulfide-insluitingen kunnen spontane breuk geven — heat soak (EN 14179) waar vervanging moeilijk is (NBN S 23-002 §4.4.1.4).', 'Le verre {pane} est trempé : robuste thermiquement, mais les inclusions de sulfure de nickel peuvent le casser spontanément — heat soak (EN 14179) si le remplacement est difficile (NBN S 23-002 §4.4.1.4).', 'La hoja {pane} es templada: térmicamente robusta, pero las inclusiones de sulfuro de níquel pueden romperla espontáneamente — heat soak (EN 14179) donde la sustitución sea difícil (NBN S 23-002 §4.4.1.4).', 'Tafla {pane} jest hartowana: odporna termicznie, ale wtrącenia siarczku niklu mogą ją spontanicznie rozbić — heat soak (EN 14179), gdy wymiana jest trudna (NBN S 23-002 §4.4.1.4).'],
  'nt.annexB': ['Insulating unit with a short side of {s} mm and aspect {l}: NBN S 23-002-2 Annex B flags strongly absorbing non-heat-treated units of this size for summer breakage under climatic loads — check them with the Glass Thickness tool.', 'Склопакет із коротшою стороною {s} мм і співвідношенням {l}: NBN S 23-002-2 Annex B позначає сильно поглинальні склопакети без термообробки такого розміру як схильні до літнього руйнування від кліматичних навантажень — перевірте їх інструментом товщини скла.', 'Isolierglas mit kurzer Seite {s} mm und Seitenverhältnis {l}: NBN S 23-002-2 Anhang B nennt stark absorbierende, nicht vorgespannte Einheiten dieser Größe bruchgefährdet durch Klimalasten im Sommer — mit dem Werkzeug Glasdicke prüfen.', 'Isolerende eenheid met korte zijde {s} mm en slankheid {l}: NBN S 23-002-2 bijlage B markeert sterk absorberende, niet thermisch behandelde eenheden van deze maat voor zomerbreuk door klimaatbelasting — controleer met de tool Glasdikte.', 'Vitrage isolant de petit côté {s} mm et d’élancement {l} : la NBN S 23-002-2 annexe B signale le risque de casse estivale sous charges climatiques des vitrages fortement absorbants non traités de cette taille — vérifier avec l’outil Épaisseur de verre.', 'Unidad aislante con lado corto de {s} mm y esbeltez {l}: NBN S 23-002-2 anexo B señala riesgo de rotura estival por cargas climáticas en unidades muy absorbentes sin tratar de este tamaño — compruébelo con la herramienta de espesor de vidrio.', 'Szyba zespolona o krótszym boku {s} mm i smukłości {l}: NBN S 23-002-2 załącznik B wskazuje ryzyko letniego pękania od obciążeń klimatycznych dla silnie pochłaniających, nieobrobionych zestawów tej wielkości — sprawdź narzędziem grubości szkła.'],
  'nt.blindgap': ['The blind is only {gap} mm behind the glass: a narrow, poorly ventilated gap traps heat on the inner pane — keep ≥ 50 mm and ventilate top and bottom.', 'Штора лише за {gap} мм від скла: вузький погано вентильований зазор затримує тепло на внутрішньому склі — тримайте ≥ 50 мм і провітрюйте зверху та знизу.', 'Das Rollo ist nur {gap} mm hinter dem Glas: ein enger, schlecht belüfteter Spalt staut Wärme an der inneren Scheibe — ≥ 50 mm Abstand und oben und unten belüften.', 'Het scherm hangt maar {gap} mm achter het glas: een smalle, slecht geventileerde spouw houdt warmte vast op de binnenruit — houd ≥ 50 mm en ventileer boven en onder.', 'Le store n’est qu’à {gap} mm du verre : une lame étroite mal ventilée piège la chaleur sur le verre intérieur — garder ≥ 50 mm et ventiler en haut et en bas.', 'La persiana está a solo {gap} mm del vidrio: una cámara estrecha y mal ventilada atrapa calor en la hoja interior — mantenga ≥ 50 mm y ventile arriba y abajo.', 'Roleta jest tylko {gap} mm za szkłem: wąska, słabo wentylowana szczelina zatrzymuje ciepło na tafli wewnętrznej — zachowaj ≥ 50 mm i wentyluj u góry i u dołu.'],

  footer: ['Glass temperatures by NBN S 23-002-2:2020 Annex A (he = 4 + 4·v, gap conductance per NBN EN 673, absorption with multiple reflections per the NBN EN 410 principle); edge strength per EN 16612:2019 §8 with ke (Table A.5) and kmod = 0,663·t^(−1/16); σ = E·αT·ΔT·k with E 70 000 MPa, αT 9·10⁻⁶ K⁻¹. Edge, shadow and blind factors and the generic optical data are learning assumptions (FIV 01 not available). Norm values cited by clause, no norm text reproduced.', 'Температури скла за NBN S 23-002-2:2020 Annex A (he = 4 + 4·v, провідність камери за NBN EN 673, поглинання з багаторазовими відбиттями за принципом NBN EN 410); міцність краю за EN 16612:2019 §8 з ke (Table A.5) і kmod = 0,663·t^(−1/16); σ = E·αT·ΔT·k, E 70 000 МПа, αT 9·10⁻⁶ K⁻¹. Коефіцієнти кромки, тіні й штори та узагальнені оптичні дані — навчальні припущення (FIV 01 недоступний). Значення норм наведено з посиланням на пункт, текст норм не відтворено.', 'Glastemperaturen nach NBN S 23-002-2:2020 Anhang A (he = 4 + 4·v, SZR-Leitwert nach NBN EN 673, Absorption mit Mehrfachreflexion nach dem Prinzip der NBN EN 410); Kantenfestigkeit nach EN 16612:2019 §8 mit ke (Tabelle A.5) und kmod = 0,663·t^(−1/16); σ = E·αT·ΔT·k mit E 70 000 MPa, αT 9·10⁻⁶ K⁻¹. Kanten-, Schatten- und Rollofaktoren sowie die generischen optischen Daten sind Lernannahmen (FIV 01 nicht verfügbar). Normwerte mit Abschnittsangabe, kein Normtext wiedergegeben.', 'Glastemperaturen volgens NBN S 23-002-2:2020 bijlage A (he = 4 + 4·v, spouwgeleiding volgens NBN EN 673, absorptie met meervoudige reflecties volgens het principe van NBN EN 410); randsterkte volgens EN 16612:2019 §8 met ke (tabel A.5) en kmod = 0,663·t^(−1/16); σ = E·αT·ΔT·k met E 70 000 MPa, αT 9·10⁻⁶ K⁻¹. Rand-, schaduw- en schermfactoren en de generieke optische gegevens zijn leeraannames (FIV 01 niet beschikbaar). Normwaarden met artikelverwijzing, geen normtekst overgenomen.', 'Températures du verre selon la NBN S 23-002-2:2020 annexe A (he = 4 + 4·v, conductance de lame selon la NBN EN 673, absorption avec réflexions multiples selon le principe de la NBN EN 410) ; résistance de bord selon l’EN 16612:2019 §8 avec ke (tableau A.5) et kmod = 0,663·t^(−1/16) ; σ = E·αT·ΔT·k avec E 70 000 MPa, αT 9·10⁻⁶ K⁻¹. Les facteurs de bord, d’ombre et de store et les données optiques génériques sont des hypothèses pédagogiques (FIV 01 indisponible). Valeurs normatives citées par article, aucun texte de norme reproduit.', 'Temperaturas del vidrio según NBN S 23-002-2:2020 anexo A (he = 4 + 4·v, conductancia de cámara según NBN EN 673, absorción con reflexiones múltiples según el principio de NBN EN 410); resistencia de canto según EN 16612:2019 §8 con ke (tabla A.5) y kmod = 0,663·t^(−1/16); σ = E·αT·ΔT·k con E 70 000 MPa, αT 9·10⁻⁶ K⁻¹. Los factores de canto, sombra y persiana y los datos ópticos genéricos son supuestos didácticos (FIV 01 no disponible). Valores normativos citados por apartado, sin reproducir el texto de la norma.', 'Temperatury szkła wg NBN S 23-002-2:2020 załącznik A (he = 4 + 4·v, przewodność komory wg NBN EN 673, absorpcja z wielokrotnymi odbiciami wg zasady NBN EN 410); wytrzymałość krawędzi wg EN 16612:2019 §8 z ke (tablica A.5) i kmod = 0,663·t^(−1/16); σ = E·αT·ΔT·k, E 70 000 MPa, αT 9·10⁻⁶ K⁻¹. Współczynniki krawędzi, cienia i rolety oraz ogólne dane optyczne to założenia dydaktyczne (FIV 01 niedostępny). Wartości norm cytowane z punktem, bez tekstu norm.']

    ['Annealed 6 solar / 15 Ar / 4 low-e, shadow across the pane, dark blind 30 mm behind: both panes fail the design check (utilisation ≈ 1,5) and the inner pane, trapped behind the blind, governs. Heat-strengthened panes bring it to ≈ 0,5. A clearer outer pane makes it worse — more sun reaches the dark blind.', 'Відпалене 6 сонцезахисне / 15 Ar / 4 low-e, тінь через скло, темна штора за 30 мм: обидва скла не проходять розрахункову перевірку (використання ≈ 1,5), визначальне — внутрішнє, затиснуте за шторою. Термозміцнене скло дає ≈ 0,5. Прозоріше зовнішнє скло погіршує — більше сонця потрапляє на темну штору.', 'Float 6 Sonnenschutz / 15 Ar / 4 Low-E, Schatten quer über die Scheibe, dunkles Rollo 30 mm dahinter: beide Scheiben verfehlen den Bemessungsnachweis (Ausnutzung ≈ 1,5), maßgebend ist die innere hinter dem Rollo. TVG bringt ≈ 0,5. Eine klarere Außenscheibe verschlechtert es — mehr Sonne trifft das dunkle Rollo.', 'Gegloeid 6 zonwerend / 15 Ar / 4 low-e, schaduw over de ruit, donker scherm 30 mm erachter: beide ruiten falen in de rekencontrole (benutting ≈ 1,5) en de binnenruit achter het scherm is maatgevend. Thermisch versterkt glas brengt het naar ≈ 0,5. Een helderder buitenblad maakt het erger — er valt meer zon op het donkere scherm.', 'Recuit 6 contrôle solaire / 15 Ar / 4 basse émissivité, ombre en travers, store foncé à 30 mm : les deux verres échouent à la vérification (taux ≈ 1,5) et le verre intérieur, piégé derrière le store, est déterminant. Du verre durci ramène à ≈ 0,5. Un verre extérieur plus clair aggrave — plus de soleil atteint le store foncé.', 'Recocido 6 control solar / 15 Ar / 4 bajo emisivo, sombra atravesando la hoja, persiana oscura a 30 mm: ambas hojas fallan la comprobación (aprovechamiento ≈ 1,5) y manda la interior, atrapada tras la persiana. El termoendurecido lo deja en ≈ 0,5. Una hoja exterior más clara lo empeora — llega más sol a la persiana oscura.', 'Odprężone 6 przeciwsłoneczne / 15 Ar / 4 low-e, cień w poprzek, ciemna   'balcony-shade-hs': [['Same, heat-strengthened panes', 'Те саме, термозміцнене скло', 'Dasselbe, TVG-Scheiben', 'Hetzelfde, thermisch versterkte ruiten', 'Idem, verres durcis', 'Igual, hojas termoendurecidas', 'To samo, tafle wzmocnione termicznie'],
    ['Same sun, shadow and blind; both panes heat-strengthened (EN 1863): the allowable ΔT rises from ≈ 19 K to ≈ 57 K and the utilisation drops to ≈ 0,5. The glass changes, the shadow stays.', 'Те саме сонце, тінь і штора; обидва скла термозміцнені (EN 1863): допустима ΔT зростає з ≈ 19 K до ≈ 57 K, використання падає до ≈ 0,5. Змінюється скло, тінь лишається.', 'Gleiche Sonne, gleicher Schatten und Rollo; beide Scheiben TVG (EN 1863): das zulässige ΔT steigt von ≈ 19 K auf ≈ 57 K, die Ausnutzung sinkt auf ≈ 0,5. Das Glas ändert sich, der Schatten bleibt.', 'Zelfde zon, schaduw en scherm; beide ruiten thermisch versterkt (EN 1863): de toelaatbare ΔT stijgt van ≈ 19 K naar ≈ 57 K en de benutting daalt naar ≈ 0,5. Het glas verandert, de schaduw blijft.', 'Même soleil, ombre et store ; les deux verres durcis (EN 1863) : le ΔT admissible passe de ≈ 19 K à ≈ 57 K et le taux tombe à ≈ 0,5. Le verre change, l’ombre reste.', 'Mismo sol, sombra y persiana; ambas hojas termoendurecidas (EN 1863): el ΔT admisible sube de ≈ 19 K a ≈ 57 K y el aprovechamiento baja a ≈ 0,5. Cambia el vidrio, la sombra se queda.', 'To samo słońce, cień i roleta; obie tafle wzmocnione termicznie (EN 1863): dopuszczalne ΔT rośnie z ≈ 19 K do ≈ 57 K, wykorzystanie spada do ≈ 0,5. Zmienia się szkło, cień zostaje.']],
  'open-sun': [['Same glass, no shadow, light blind 10 cm', 'Те саме скло, без тіні, світла штора 10 см', 'Gleiches Glas, kein Schatten, helles Rollo 10 cm', 'Zelfde glas, geen schaduw, licht scherm 10 cm', 'Même verre, sans ombre, store clair à 10 cm', 'Mismo vidrio, sin sombra, persiana clara a 10 cm', 'To samo szkło, bez cienia, jasna roleta 10 cm'],
    ['Annealed solar-control unit in full sun with a light blind 100 mm away: utilisation ≈ 1,0 — right at the design limit, governed by the frame edge of the absorbing outer pane. The shadow and the dark blind of the first example add half again: they break the glass, not the sun alone.', 'Відпалений сонцезахисний склопакет на повному сонці зі світлою шторою за 100 мм: використання ≈ 1,0 — якраз на межі, визначає кромка в рамі поглинального зовнішнього скла. Тінь і темна штора з першого прикладу додають ще половину: скло ламають вони, а не саме сонце.', 'Float-Sonnenschutzglas in voller Sonne, helles Rollo 100 mm entfernt: Ausnutzung ≈ 1,0 — genau an der Bemessungsgrenze, maßgebend ist die Rahmenkante der absorbierenden Außenscheibe. Schatten und dunkles Rollo des ersten Beispiels legen noch die Hälfte drauf: sie brechen das Glas, nicht die Sonne allein.', 'Gegloeid zonwerend glas in volle zon met een licht scherm op 100 mm: benutting ≈ 1,0 — precies op de rekengrens, bepaald door de kaderrand van het absorberende buitenblad. De schaduw en het donkere scherm van het eerste voorbeeld voegen nog de helft toe: zij breken het glas, niet de zon alleen.', 'Vitrage recuit de contrôle solaire en plein soleil, store clair à 100 mm : taux ≈ 1,0 — juste à la limite de calcul, gouverné par le bord en feuillure du verre extérieur absorbant. L’ombre et le store foncé du premier exemple ajoutent encore moitié : ce sont eux qui cassent le verre, pas le soleil seul.', 'Unidad recocida de control solar a pleno sol con persiana clara a 100 mm: aprovechamiento ≈ 1,0 — justo en el límite de cálculo, lo gobierna el canto en el marco de la hoja exterior absorbente. La sombra y la persiana oscura del primer ejemplo añaden la mitad más: rompen el vidrio ellas, no el sol solo.', 'Odprężona szyba przeciwsłoneczna w pełnym słońcu z jasną roletą 100 mm dalej: wykorzystanie ≈ 1,0 — dokładnie na granicy, decyduje krawędź w ramie pochłaniającej tafli zewnętrznej. Cień i ciemna roleta z pierwszego przykładu dokładają jeszcze połowę: to one łamią szkło, nie samo słońce.']],

    ['4 clear / 15 Ar / 4 low-e in a light PVC frame, full sun: ΔT ≤ 7 K, utilisation ≈ 0,36 — negligible. Ordinary clear insulating glass absorbs little, so its centre hardly heats.', '4 прозоре / 15 Ar / 4 low-e у світлій ПВХ-рамі, повне сонце: ΔT ≤ 7 K, використання ≈ 0,36 — незначно. Звичайний прозорий склопакет мало поглинає, тож центр майже не гріється.', '4 klar / 15 Ar / 4 Low-E im hellen PVC-Rahmen, volle Sonne: ΔT ≤ 7 K, Ausnutzung ≈ 0,36 — vernachlässigbar. Normales Klarglas absorbiert wenig, die Mitte erwärmt sich kaum.', '4 helder / 15 Ar / 4 low-e in een licht PVC-kader, volle zon: ΔT ≤ 7 K, benutting ≈ 0,36 — verwaarloosbaar. Gewoon helder isolerend glas absorbeert weinig, het midden warmt nauwelijks op.', '4 clair / 15 Ar / 4 basse émissivité en châssis PVC clair, plein soleil : ΔT ≤ 7 K, taux ≈ 0,36 — négligeable. Un vitrage isolant clair ordinaire absorbe peu, son centre chauffe à peine.', '4 incoloro / 15 Ar / 4 bajo emisivo en marco de PVC claro, pleno sol: ΔT ≤ 7 K, aprovechamiento ≈ 0,36 — despreciable. El doble vidrio claro normal absorbe poco y su centro apenas se calienta.', '4 bezbarwne / 15 Ar / 4 low-e w jasnej ramie PVC, pełne słońce: ΔT ≤ 7 K, wykorzystanie ≈ 0,36 — pomijalne. Zwykła przezroczysta szyba mało pochłania, środek prawie się nie nagrzewa.']],

    ['Glazed into a cold concrete reveal with a 30 mm edge cover: the edge gets no warmth from a sunlit frame and lags behind the morning — ΔT rises by ≈ 11 K on both panes and the utilisation from 0,36 to ≈ 0,95, just within the design value.', 'Засклене в холодний бетонний укіс із заглибленням 30 мм: кромка не отримує тепла від освітленої рами й відстає від ранкового прогріву — ΔT зростає на ≈ 11 K на обох склах, використання з 0,36 до ≈ 0,95, ледь у межах розрахункового значення.', 'In eine kalte Betonlaibung mit 30 mm Glaseinstand verglast: die Kante bekommt keine Wärme von einem besonnten Rahmen und hinkt dem Morgen hinterher — ΔT steigt an beiden Scheiben um ≈ 11 K, die Ausnutzung von 0,36 auf ≈ 0,95, knapp innerhalb des Bemessungswerts.', 'Ingebouwd in een koude betonnen dagkant met 30 mm inklemming: de rand krijgt geen warmte van een bezond kader en loopt achter op de ochtend — ΔT stijgt met ≈ 11 K op beide ruiten en de benutting van 0,36 naar ≈ 0,95, net binnen de rekenwaarde.', 'Posé dans un ébrasement béton froid avec 30 mm de prise en feuillure : le bord ne reçoit aucune chaleur d’un châssis ensoleillé et reste en retard sur le matin — ΔT augmente de ≈ 11 K sur les deux verres et le taux passe de 0,36 à ≈ 0,95, tout juste dans la valeur de calcul.', 'Acristalado en una jamba fría de hormigón con galce de 30 mm: el canto no recibe calor de un marco soleado y se retrasa respecto a la mañana — ΔT sube ≈ 11 K en ambas hojas y el aprovechamiento de 0,36 a ≈ 0,95, justo dentro del valor de cálculo.', 'Osadzone w zimnym betonowym ościeżu z wpustem 30 mm: krawędź nie dostaje ciepła od nasłonecznionej ramy i spóźnia się za porankiem — ΔT rośnie o ≈ 11 K na obu taflach, wykorzystanie z 0,36 do ≈ 0,95, ledwie w granicy wartości obliczeniowej.']],
  'toughened': [['First example with toughened panes', 'Перший приклад із загартованим склом', 'Erstes Beispiel mit ESG-Scheiben', 'Eerste voorbeeld met geharde ruiten', 'Premier exemple avec verres trempés', 'Primer ejemplo con hojas templadas', 'Pierwszy przykład z taflami hartowanymi'],
    ['Toughened instead of heat-strengthened: utilisation ≈ 0,23 — thermally more than enough, but toughened glass can break spontaneously from nickel-sulphide inclusions. Where replacement is hard, NBN S 23-002 §4.4.1.4 asks for heat soak; heat-strengthened glass already solved the thermal problem without that risk.', 'Загартоване замість термозміцненого: використання ≈ 0,23 — термічно з великим запасом, але загартоване скло може зруйнуватися спонтанно через включення сульфіду нікелю. Де заміна складна, NBN S 23-002 §4.4.1.4 вимагає heat soak; термозміцнене вже розв’язало термічну проблему без цього ризику.', 'ESG statt TVG: Ausnutzung ≈ 0,23 — thermisch mehr als genug, aber ESG kann durch Nickelsulfid-Einschlüsse spontan brechen. Wo der Austausch schwierig ist, verlangt NBN S 23-002 §4.4.1.4 die Heißlagerung; TVG hatte das thermische Problem schon ohne dieses Risiko gelöst.', 'Gehard in plaats van thermisch versterkt: benutting ≈ 0,23 — thermisch ruim voldoende, maar gehard glas kan spontaan breken door nikkelsulfide-insluitingen. Waar vervanging moeilijk is, vraagt NBN S 23-002 §4.4.1.4 een heat-soakbehandeling; thermisch versterkt glas loste het thermische probleem al op zonder dat risico.', 'Trempé au lieu de durci : taux ≈ 0,23 — largement suffisant thermiquement, mais le verre trempé peut casser spontanément à cause d’inclusions de sulfure de nickel. Si le remplacement est difficile, la NBN S 23-002 §4.4.1.4 demande le heat soak ; le verre durci réglait déjà le problème thermique sans ce risque.', 'Templado en lugar de termoendurecido: aprovechamiento ≈ 0,23 — térmicamente de sobra, pero el templado puede romperse espontáneamente por inclusiones de sulfuro de níquel. Donde la sustitución sea difícil, NBN S 23-002 §4.4.1.4 pide heat soak; el termoendurecido ya resolvía el problema térmico sin ese riesgo.', 'Hartowane zamiast wzmocnionego: wykorzystanie ≈ 0,23 — termicznie z dużym zapasem, ale szkło hartowane może pęknąć samoistnie przez wtrącenia siarczku niklu. Gdy wymiana jest trudna, NBN S 23-002 §4.4.1.4 wymaga heat soak; szkło wzmocnione termicznie rozwiązało już problem bez tego ryzyka.']],
  'tinted-8': [['Body-tinted 8 mm single glazing', 'Тоноване в масі одинарне скло 8 мм', 'In der Masse gefärbtes Einfachglas 8 mm', 'In de massa gekleurd enkel glas 8 mm', 'Simple vitrage teinté dans la masse 8 mm', 'Vidrio simple coloreado en masa 8 mm', 'Szkło pojedyncze barwione w masie 8 mm'],
    ['Grey body-tinted 8 mm annealed, dark metal frame, shadow along one edge: αe ≈ 50 % ≥ 45 % — strongly absorbing, outside the NBN S 23-002-3 tables, so heat treatment is recommended even though this moment gives utilisation ≈ 0,84. Heat-strengthened glass drops it to ≈ 0,28.', 'Сіре тоноване в масі 8 мм відпалене, темна металева рама, тінь уздовж кромки: αe ≈ 50 % ≥ 45 % — сильно поглинальне, поза таблицями NBN S 23-002-3, тож рекомендовано термообробку, хоча цей момент дає використання ≈ 0,84. Термозміцнене скло знижує до ≈ 0,28.', 'Graues, in der Masse gefärbtes 8-mm-Float, dunkler Metallrahmen, Schatten entlang einer Kante: αe ≈ 50 % ≥ 45 % — stark absorbierend, außerhalb der Tabellen von NBN S 23-002-3, daher Vorspannung empfohlen, auch wenn dieser Zeitpunkt nur ≈ 0,84 Ausnutzung ergibt. TVG senkt sie auf ≈ 0,28.', 'Grijs in de massa gekleurd 8 mm gegloeid, donker metalen kader, schaduw langs één rand: αe ≈ 50 % ≥ 45 % — sterk absorberend, buiten de tabellen van NBN S 23-002-3, dus thermische behandeling aanbevolen, ook al geeft dit moment benutting ≈ 0,84. Thermisch versterkt glas brengt het naar ≈ 0,28.', 'Recuit 8 mm teinté gris dans la masse, châssis métallique foncé, ombre le long d’un bord : αe ≈ 50 % ≥ 45 % — fortement absorbant, hors des tableaux de la NBN S 23-002-3, donc traitement thermique recommandé même si cet instant donne un taux ≈ 0,84. Le verre durci le ramène à ≈ 0,28.', 'Recocido 8 mm gris coloreado en masa, marco metálico oscuro, sombra a lo largo de un canto: αe ≈ 50 % ≥ 45 % — muy absorbente, fuera de las tablas de NBN S 23-002-3, así que se recomienda tratamiento térmico aunque este instante dé aprovechamiento ≈ 0,84. El termoendurecido lo baja a ≈ 0,28.', 'Szare barwione w masie 8 mm odprężone, ciemna rama metalowa, cień wzdłuż krawędzi: αe ≈ 50 % ≥ 45 % — silnie pochłaniające, poza tablicami NBN S 23-002-3, więc zalecana obróbka termiczna, choć ta chwila daje wykorzystanie ≈ 0,84. Szkło wzmocnione termicznie obniża je do ≈ 0,28.']]

var LEARN = {
  version: 1,
  intro: { title: T7(['What this tool does', 'Що робить цей інструмент', 'Was dieses Werkzeug tut', 'Wat deze tool doet', 'Ce que fait cet outil', 'Qué hace esta herramienta', 'Co robi to narzędzie']),
    body: T7(['Sun heats the middle of a pane; the edge, held in the frame or lying in a shadow, stays cooler. The warm centre wants to expand, the cold edge band holds it back and is put in tension. Annealed glass has weak edges, so a temperature difference of about 20 K by the design check can be enough. The tool computes the temperatures, the edge stress and what changes it.', 'Сонце гріє середину скла; кромка в рамі чи в тіні лишається холоднішою. Теплий центр хоче розширитися, холодна смуга кромки його стримує і розтягується. Відпалене скло має слабкі кромки, тож різниці близько 20 K за розрахунковою перевіркою може вистачити. Інструмент рахує температури, напруження на краю і що їх змінює.', 'Die Sonne erwärmt die Scheibenmitte; die Kante im Rahmen oder im Schatten bleibt kühler. Die warme Mitte will sich ausdehnen, der kalte Randstreifen hält sie zurück und gerät unter Zug. Float hat schwache Kanten, nach dem Bemessungsnachweis können etwa 20 K genügen. Das Werkzeug berechnet Temperaturen, Randspannung und was sie ändert.', 'De zon warmt het midden van een ruit op; de rand in het kader of in de schaduw blijft koeler. Het warme midden wil uitzetten, de koude randstrook houdt het tegen en komt onder trek. Gegloeid glas heeft zwakke randen, volgens de rekencontrole kan ongeveer 20 K al genoeg zijn. De tool berekent de temperaturen, de randspanning en wat ze verandert.', 'Le soleil chauffe le milieu du vitrage ; le bord, pris dans le châssis ou à l’ombre, reste plus froid. Le centre chaud veut se dilater, la bande de bord froide le retient et se met en traction. Le verre recuit a des bords faibles : selon la vérification de calcul, environ 20 K peuvent suffire. L’outil calcule les températures, la contrainte de bord et ce qui la change.', 'El sol calienta el centro del vidrio; el canto, dentro del marco o en sombra, queda más frío. El centro caliente quiere dilatarse, la franja fría del borde lo frena y queda a tracción. El vidrio recocido tiene cantos débiles: según la comprobación de cálculo, unos 20 K pueden bastar. La herramienta calcula temperaturas, tensión de borde y qué la cambia.', 'Słońce nagrzewa środek tafli; krawędź w ramie lub w cieniu pozostaje chłodniejsza. Ciepły środek chce się rozszerzyć, zimny pas krawędzi go powstrzymuje i jest rozciągany. Szkło odprężone ma słabe krawędzie, więc wg sprawdzenia obliczeniowego około 20 K może wystarczyć. Narzędzie liczy temperatury, naprężenie krawędzi i co je zmienia.']) },
  topics: {

      body: T7(['Each pane absorbs part of the sun (αe, with the reflections between panes) and exchanges heat with outside (he = 4 + 4·v), the cavity (radiation + gas, NBN EN 673) and the room. NBN S 23-002-2 Annex A solves this balance; a coated or tinted outer pane can reach 30 °C above the air on a cold sunny morning.', 'Кожне скло поглинає частину сонця (αe з відбиттями між склами) і обмінюється теплом із зовнішнім середовищем (he = 4 + 4·v), камерою (випромінювання + газ, NBN EN 673) і приміщенням. NBN S 23-002-2 Annex A розв’язує цей баланс; покрите чи тоноване зовнішнє скло холодного сонячного ранку може бути на 30 °C тепліше за повітря.', 'Jede Scheibe absorbiert einen Teil der Sonne (αe, mit den Reflexionen zwischen den Scheiben) und tauscht Wärme mit außen (he = 4 + 4·v), dem SZR (Strahlung + Gas, NBN EN 673) und dem Raum. NBN S 23-002-2 Anhang A löst diese Bilanz; eine beschichtete oder gefärbte Außenscheibe kann an einem kalten Sonnenmorgen 30 °C über der Luft liegen.', 'Elke ruit absorbeert een deel van de zon (αe, met de reflecties tussen de ruiten) en wisselt warmte uit met buiten (he = 4 + 4·v), de spouw (straling + gas, NBN EN 673) en de ruimte. NBN S 23-002-2 bijlage A lost die balans op; een gecoat of gekleurd buitenblad kan op een koude zonnige ochtend 30 °C boven de lucht komen.', 'Chaque verre absorbe une part du soleil (αe, avec les réflexions entre verres) et échange de la chaleur avec l’extérieur (he = 4 + 4·v), la lame (rayonnement + gaz, NBN EN 673) et le local. La NBN S 23-002-2 annexe A résout ce bilan ; un verre extérieur à couche ou teinté peut dépasser l’air de 30 °C par un matin froid et ensoleillé.', 'Cada hoja absorbe parte del sol (αe, con las reflexiones entre hojas) e intercambia calor con el exterior (he = 4 + 4·v), la cámara (radiación + gas, NBN EN 673) y el local. NBN S 23-002-2 anexo A resuelve este balance; una hoja exterior con capa o coloreada puede superar el aire en 30 °C una mañana fría y soleada.', 'Każda tafla pochłania część słońca (αe, z odbiciami między taflami) i wymienia ciepło z otoczeniem (he = 4 + 4·v), komorą (promieniowanie + gaz, NBN EN 673) i pomieszczeniem. NBN S 23-002-2 załącznik A rozwiązuje ten bilans; tafla zewnętrzna z powłoką lub barwiona może być w zimny słoneczny poranek o 30 °C cieplejsza od powietrza.']) },

nnées.', 'El canto en el galce no ve el sol: queda cerca de la temperatura de una hoja sin sol, algo calentado por un marco claro soleado (fracción r) y más frío tras una jamba maciza (retraso). Una sombra que atraviesa la hoja crea una zona fría hasta el canto; una persiana pegada al vidrio atrapa calor en la hoja interior. Estos factores son supuestos didácticos: sustitúyalos por mejores datos.', 'Krawędź we wpuście nie widzi słońca: ma temperaturę bliską nienasłonecznionej tafli, lekko ogrzaną przez nasłonecznioną jasną ramę (udział r) i zimniejszą za masywnym ościeżem (opóźnienie). Cień w poprzek tafli tworzy zimną strefę aż do krawędzi; roleta tuż za szkłem zatrzymuje ciepło na tafli wewnętrznej. Te współczynniki to założenia dydaktyczne — zastąp je lepszymi danymi.']) },
