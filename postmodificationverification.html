<script>
(function () {
'use strict';
/* Post-Modification Verification & Closeout — calculation core (pure functions, no DOM).
   Requirement → test → result → evidence chains, currency of tests, evidence and documents against the change baseline,
   closeout documents and PSSR items required by the change type, readiness for engineering review.
   The tool never authorises start-up. */
var PM_VERSION = '2026-10-09.pm-3';
var PM_STATUS = ['confirmed', 'rejected', 'unknown', 'not_applicable'];
var PM_APPLICABILITY = ['required', 'not_applicable', 'unknown'];
var PM_RESULT = ['passed', 'failed', 'not_run', 'unknown'];
var PM_TYPES = ['equipment_replacement', 'protective_logic', 'temporary_return', 'other'];
var PM_PSSR_APPL = ['applicable', 'not_applicable', 'unknown'];
var PM_DOC_KINDS = ['as_built', 'procedure', 'maintenance', 'training', 'configuration', 'temporary_closeout', 'sar', 'olc', 'other'];
var PM_DOC_STATUS = ['confirmed', 'rejected', 'unknown', 'not_applicable', 'not_affected'];
var PM_LICENSING = ['affected', 'not_affected', 'unknown'];
var PM_PSSR_IDS = ['scope_confirmed', 'final_configuration', 'test_evidence', 'procedures_current', 'open_items_controlled', 'maintenance_ready', 'training_complete', 'control_baseline', 'temporary_measures_removed'];
var PM_DECISION = ['pending', 'approved', 'rejected'];

function pmText(v) { return v === null || v === undefined ? '' : String(v).trim(); }
function pmList(v) { var out = []; pmText(v).split(/[,;\s]+/).forEach(function (x) { if (x && out.indexOf(x) < 0) out.push(x); }); return out; }
/* training and removal of temporary measures for every change type (OSHA 1910.119(l)(3), IAEA SSG-71 7.17, 7.21) */
function pmRequiredDocs(t, lic) { var c = ['as_built', 'procedure', 'training'];
  c = t === 'equipment_replacement' ? c.concat(['maintenance']) : t === 'protective_logic' ? c.concat(['configuration']) : t === 'temporary_return' ? c.concat(['temporary_closeout']) : c;
  return lic === 'affected' ? c.concat(['sar', 'olc']) : c; }
function pmRequiredPssr(t) { var c = ['scope_confirmed', 'final_configuration', 'test_evidence', 'procedures_current', 'open_items_controlled', 'training_complete', 'temporary_measures_removed'];
  return t === 'equipment_replacement' ? c.concat(['maintenance_ready']) : t === 'protective_logic' ? c.concat(['control_baseline']) : c; }
var PM_NEGATIVE = ['test_failed', 'test_stale', 'evidence_rejected', 'evidence_stale', 'document_rejected', 'document_stale', 'pssr_item_rejected'];

function pmAnalyse(s) {
  var r = { model_version: PM_VERSION, calculation_status: 'performed', readiness: 'blocked', criterion_state: 'unknown', startup_authorized: false, pssr_status: 'unknown',
    trace: [], documents: [], pssr: [], counts: {}, gaps: [], warnings: [], actions: [] };
  var G = r.gaps, base = pmText(s.baseline_revision), type = PM_TYPES.indexOf(s.change_type) >= 0 ? s.change_type : 'other';
  function gap(c, id) { G.push({ code: c, id: id === undefined ? null : id }); }
  if (!base) gap('baseline_missing');
  function rows(list, kind, key) { var map = {}, order = [];
    (Array.isArray(list) ? list : []).forEach(function (x, i) { var id = pmText(x[key || 'id']) || kind + '-' + (i + 1);
      if (map[id]) { gap('duplicate_id', kind + ':' + id); return; } map[id] = x; order.push(id); });
    return { map: map, order: order }; }
  var RQ = rows(s.requirements, 'requirement'), TS = rows(s.tests, 'test'), EV = rows(s.evidence, 'evidence'), DC = rows(s.documents, 'document', 'kind'), PS = rows(s.pssr_items, 'pssr');
  /* basis currency: 'current' | 'unknown' | 'stale' */
  function currency(x) { var b = pmText(x.basis_revision); return !b || !base ? 'unknown' : b === base ? 'current' : 'stale'; }
  /* requirements */
  var usedT = [], tGap = {}, eGap = {};
  RQ.order.forEach(function (id) {
    var q = RQ.map[id], app = PM_APPLICABILITY.indexOf(q.applicability) >= 0 ? q.applicability : 'unknown', tid = pmText(q.test_id), row = { requirement: id, applicability: app, test: tid || null, evidence: null, chain: 'open' };
    r.trace.push(row);
    if (app === 'unknown') { gap('applicability_unknown', id); return; }
    if (app === 'not_applicable') { if (!pmText(q.na_reason)) gap('na_reason_missing', id); else row.chain = 'not_applicable'; return; }
    if (!tid) { gap('test_missing', id); return; }
