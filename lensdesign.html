  "summary": {
    "en": "How good is the image of this lens system: real ray tracing of a prescription with catalogue glasses, paraxial data and pupils, spot diagrams against the Airy disc, ray fans, wavefront error, Strehl ratio and MTF, Seidel aberrations by surface, field curvature, distortion and chromatic focal shift; optimiser, Monte Carlo tolerances and nearest Thorlabs stock lenses.",
    "uk": "Наскільки добре зображення цієї системи лінз: реальне трасування рецепта з каталожним склом, параксіальні дані й зіниці, діаграми плям проти диска Ейрі, віяла променів, похибка хвильового фронту, число Штреля й MTF, аберації Зейделя за поверхнями, кривизна поля, дисторсія й хроматичний зсув фокуса; оптимізатор, допуски Монте-Карло й найближчі каталожні лінзи Thorlabs.",
    "de": "Wie gut ist das Bild dieses Linsensystems: reale Strahldurchrechnung einer Vorschrift mit Katalogglas, paraxiale Daten und Pupillen, Spotdiagramme gegen das Airy-Scheibchen, Strahlfächer, Wellenfrontfehler, Strehl-Verhältnis und MTF, Seidel-Aberrationen je Fläche, Bildfeldwölbung, Verzeichnung und Farbfokusverschiebung; Optimierer, Monte-Carlo-Toleranzen und die nächsten Thorlabs-Lagerlinsen.",
    "nl": "Hoe goed is het beeld van dit lenzenstelsel: echte straalberekening van een recept met catalogusglas, paraxiale gegevens en pupillen, vlekdiagrammen tegen de Airy-schijf, stralenwaaiers, golffrontfout, Strehl-verhouding en MTF, Seidel-aberraties per vlak, veldkromming, vertekening en chromatische focusverschuiving; optimalisatie, Monte-Carlo-toleranties en de dichtstbijzijnde Thorlabs-voorraadlenzen.",
    "fr": "Quelle est la qualité d’image de cette combinaison : tracé de rayons réels d’une formule avec des verres de catalogue, données paraxiales et pupilles, diagrammes de taches face au disque d’Airy, éventails de rayons, erreur de front d’onde, rapport de Strehl et FTM, aberrations de Seidel par surface, courbure de champ, distorsion et chromatisme du foyer ; optimiseur, tolérances Monte-Carlo et lentilles Thorlabs les plus proches.",
    "es": "Cuán buena es la imagen de este sistema de lentes: trazado de rayos reales de una prescripción con vidrios de catálogo, datos paraxiales y pupilas, diagramas de manchas frente al disco de Airy, abanicos de rayos, error de frente de onda, razón de Strehl y MTF, aberraciones de Seidel por superficie, curvatura de campo, distorsión y desplazamiento focal cromático; optimizador, tolerancias Monte Carlo y las lentes Thorlabs más cercanas.",
    "pl": "Jak dobry jest obraz tego układu soczewek: śledzenie promieni rzeczywistych przez receptę ze szkłami katalogowymi, dane przyosiowe i źrenice, wykresy plamek wobec krążka Airy’ego, wachlarze promieni, błąd czoła fali, współczynnik Strehla i MTF, aberracje Seidla według powierzchni, krzywizna pola, dystorsja i chromatyczne przesunięcie ogniska; optymalizator, tolerancje Monte Carlo i najbliższe soczewki katalogowe Thorlabs."
  },
  "description": {
    "en": "Enter a centred lens prescription surface by surface (radius, thickness, glass from the Schott/Ohara/CDGM catalogue data, semi-diameter, conic, stop) or start from a preset: a Thorlabs plano-convex lens both ways round, a best-form singlet, stopping down, a singlet and the AC254-100-A achromat in white light, the classic Cooke triplet, a landscape lens with the coma-free stop position, and an optimiser run that rediscovers the catalogue achromat. The page traces real rays (vector Snell law, chief ray aimed at the stop) and shows paraxial data, spot diagrams, ray fans, the wavefront map with Strehl ratio, MTF, Seidel sums by surface, field curvature, distortion and chromatic focal shift. Damped least squares bends surfaces to a target focal length, Monte Carlo shows what radius, thickness and index tolerances do, and every glass element gets its nearest stock lens. CSV, PNG and SVG export; the lens is shared with the other optics tools through the project file.",
    "uk": "Введіть рецепт центрованої системи поверхня за поверхнею (радіус, товщина, скло з каталожних даних Schott/Ohara/CDGM, напівдіаметр, коніка, діафрагма) або почніть із прикладу: плоско-опукла лінза Thorlabs в обох орієнтаціях, синглет найкращої форми, прикривання діафрагми, синглет і ахромат AC254-100-A у білому світлі, класичний триплет Кука, пейзажна лінза з положенням діафрагми без коми та прогін оптимізатора, що знову знаходить каталожний ахромат. Сторінка простежує реальні промені (векторний закон Снелліуса, головний промінь націлено в діафрагму) і показує параксіальні дані, діаграми плям, віяла променів, карту хвильового фронту з числом Штреля, MTF, суми Зейделя за поверхнями, кривизну поля, дисторсію й хроматичний зсув фокуса. Метод найменших квадратів із загасанням вигинає поверхні під цільову фокусну відстань, Монте-Карло показує вплив допусків радіусів, товщин і показника, а кожен скляний елемент отримує найближчу каталожну лінзу. Експорт CSV, PNG і SVG; лінзу передають іншим оптичним інструментам через файл проєкту.",
    "de": "Geben Sie eine zentrierte Linsenvorschrift Fläche für Fläche ein (Radius, Dicke, Glas aus den Katalogdaten von Schott/Ohara/CDGM, halber Durchmesser, Konik, Blende) oder beginnen Sie mit einem Beispiel: eine Thorlabs-Plankonvexlinse in beiden Richtungen, eine Bestform-Einzellinse, Abblenden, Einzellinse und Achromat AC254-100-A im Weißlicht, das klassische Cooke-Triplet, eine Landschaftslinse mit komafreier Blendenlage und ein Optimiererlauf, der den Katalog-Achromaten wiederfindet. Die Seite rechnet reale Strahlen (vektorielles Brechungsgesetz, Hauptstrahl auf die Blende gezielt) und zeigt paraxiale Daten, Spotdiagramme, Strahlfächer, die Wellenfrontkarte mit Strehl-Verhältnis, MTF, Seidel-Summen je Fläche, Bildfeldwölbung, Verzeichnung und Farbfokusverschiebung. Gedämpfte kleinste Quadrate biegen Flächen auf eine Zielbrennweite, Monte Carlo zeigt die Wirkung von Radius-, Dicken- und Indextoleranzen, und jedes Glaselement erhält seine nächste Lagerlinse. Export als CSV, PNG und SVG; die Linse wird über die Projektdatei mit den anderen Optikwerkzeugen geteilt.",
    "nl": "Voer een gecentreerd lensrecept vlak voor vlak in (straal, dikte, glas uit de catalogusgegevens van Schott/Ohara/CDGM, halve diameter, conische constante, diafragma) of begin met een voorbeeld: een Thorlabs plan-bolle lens in beide richtingen, een best-form singlet, diafragmeren, een singlet en de achromaat AC254-100-A in wit licht, de klassieke Cooke-triplet, een landschapslens met de comavrije diafragmapositie en een optimalisatierun die de catalogusachromaat hervindt. De pagina rekent echte stralen door (vectoriële brekingswet, hoofdstraal gericht op het diafragma) en toont paraxiale gegevens, vlekdiagrammen, stralenwaaiers, de golffrontkaart met Strehl-verhouding, MTF, Seidel-sommen per vlak, veldkromming, vertekening en chromatische focusverschuiving. Gedempte kleinste kwadraten buigen vlakken naar een doel-brandpuntsafstand, Monte Carlo toont het effect van stralen-, dikte- en indextoleranties, en elk glaselement krijgt de dichtstbijzijnde voorraadlens. Export als CSV, PNG en SVG; de lens wordt via het projectbestand gedeeld met de andere optische tools.",
    "fr": "Saisissez une formule centrée surface par surface (rayon, épaisseur, verre des données catalogue Schott/Ohara/CDGM, demi-diamètre, conique, diaphragme) ou partez d’un exemple : une plan-convexe Thorlabs dans les deux sens, un singulet de forme optimale, la fermeture du diaphragme, un singulet et l’achromat AC254-100-A en lumière blanche, le triplet de Cooke classique, un objectif paysage avec le diaphragme sans coma et un passage de l’optimiseur qui retrouve l’achromat du catalogue. La page trace des rayons réels (loi de Snell vectorielle, rayon principal visé sur le diaphragme) et affiche les données paraxiales, les diagrammes de taches, les éventails de rayons, la carte du front d’onde avec le rapport de Strehl, la FTM, les sommes de Seidel par surface, la courbure de champ, la distorsion et le chromatisme du foyer. Les moindres carrés amortis cambrent les surfaces vers une focale cible, le Monte-Carlo montre l’effet des tolérances de rayon, d’épaisseur et d’indice, et chaque élément en verre reçoit la lentille standard la plus proche. Export CSV, PNG et SVG ; la lentille est partagée avec les autres outils d’optique par le fichier projet.",
    "es": "Introduzca una prescripción centrada superficie a superficie (radio, espesor, vidrio de los datos de catálogo de Schott/Ohara/CDGM, semidiámetro, cónica, diafragma) o parta de un ejemplo: una plano-convexa de Thorlabs en ambos sentidos, un singlete de forma óptima, cerrar el diafragma, un singlete y el acromático AC254-100-A con luz blanca, el triplete de Cooke clásico, una lente de paisaje con el diafragma sin coma y una pasada del optimizador que redescubre el acromático de catálogo. La página traza rayos reales (ley de Snell vectorial, rayo principal apuntado al diafragma) y muestra datos paraxiales, diagramas de manchas, abanicos de rayos, el mapa del frente de onda con la razón de Strehl, MTF, sumas de Seidel por superficie, curvatura de campo, distorsión y desplazamiento focal cromático. Los mínimos cuadrados amortiguados curvan superficies hacia una focal objetivo, Monte Carlo muestra el efecto de las tolerancias de radio, espesor e índice, y cada elemento de vidrio recibe su lente estándar más cercana. Exportación CSV, PNG y SVG; la lente se comparte con las demás herramientas de óptica mediante el archivo de proyecto.",
    "pl": "Wpisz receptę układu centrowanego powierzchnia po powierzchni (promień, grubość, szkło z danych katalogowych Schott/Ohara/CDGM, półśrednica, stała stożkowa, przysłona) lub zacznij od przykładu: soczewka płasko-wypukła Thorlabs w obu kierunkach, soczewka o najlepszym kształcie, przymykanie przysłony, soczewka pojedyncza i achromat AC254-100-A w świetle białym, klasyczny tryplet Cooke’a, soczewka krajobrazowa z przysłoną w położeniu bez komy oraz przebieg optymalizatora, który odnajduje achromat katalogowy. Strona śledzi promienie rzeczywiste (wektorowe prawo Snelliusa, promień główny wycelowany w przysłonę) i pokazuje dane przyosiowe, wykresy plamek, wachlarze promieni, mapę czoła fali ze współczynnikiem Strehla, MTF, sumy Seidla według powierzchni, krzywiznę pola, dystorsję i chromatyczne przesunięcie ogniska. Tłumione najmniejsze kwadraty wyginają powierzchnie do docelowej ogniskowej, Monte Carlo pokazuje skutki tolerancji promieni, grubości i współczynnika, a każdy element szklany dostaje najbliższą soczewkę katalogową. Eksport CSV, PNG i SVG; soczewka jest dzielona z innymi narzędziami optycznymi przez plik projektu."
  },

  "limitations": {
    "en": "Centred, rotationally symmetric systems of refracting spherical, conic and even-aspheric surfaces in air; no mirrors, decentred or tilted elements, gradient index, diffractive surfaces, coatings or polarisation. Ray grids sit on the paraxial entrance pupil (chief ray aimed at the stop centre); the MTF maps the pupil by the paraxial image-space NA, so off-axis pupil distortion is ignored. Optimisation is local; tolerancing perturbs radii, thicknesses and indices only. Glass and stock data with their provenance in opt-core.js.",
    "uk": "Центровані осесиметричні системи заломлювальних сферичних, конічних і парних асферичних поверхонь у повітрі; без дзеркал, децентрованих чи нахилених елементів, градієнтного показника, дифракційних поверхонь, покриттів і поляризації. Сітки променів лежать на параксіальній вхідній зіниці (головний промінь націлено в центр діафрагми); MTF масштабує зіницю параксіальною NA в просторі зображень, тому позаосьове спотворення зіниці не враховано. Оптимізація локальна; допуски збурюють лише радіуси, товщини й показники. Дані скла й каталогу з походженням — в opt-core.js.",
    "de": "Zentrierte, rotationssymmetrische Systeme brechender sphärischer, konischer und gerader asphärischer Flächen in Luft; keine Spiegel, dezentrierten oder gekippten Elemente, Gradientenindex, diffraktiven Flächen, Beschichtungen oder Polarisation. Die Strahlraster liegen auf der paraxialen Eintrittspupille (Hauptstrahl auf die Blendenmitte gezielt); die MTF skaliert die Pupille über die paraxiale bildseitige NA, Pupillenverzerrung außer der Achse bleibt unberücksichtigt. Die Optimierung ist lokal; die Tolerierung stört nur Radien, Dicken und Indizes. Glas- und Katalogdaten mit Herkunft in opt-core.js.",
    "nl": "Gecentreerde, rotatiesymmetrische systemen van brekende sferische, conische en even asferische vlakken in lucht; geen spiegels, gedecentreerde of gekantelde elementen, gradiëntindex, diffractieve vlakken, coatings of polarisatie. De stralenrasters liggen op de paraxiale intreepupil (hoofdstraal gericht op het midden van het diafragma); de MTF schaalt de pupil met de paraxiale NA aan beeldzijde, dus pupilvervorming buiten de as wordt genegeerd. De optimalisatie is lokaal; de tolerantieberekening verstoort alleen stralen, diktes en indices. Glas- en catalogusgegevens met herkomst in opt-core.js.",
    "fr": "Systèmes centrés de révolution, à surfaces réfringentes sphériques, coniques et asphériques paires dans l’air ; ni miroirs, ni éléments décentrés ou basculés, ni gradient d’indice, ni surfaces diffractives, ni traitements, ni polarisation. Les grilles de rayons sont sur la pupille d’entrée paraxiale (rayon principal visé au centre du diaphragme) ; la FTM met la pupille à l’échelle par l’ON image paraxiale, la déformation de pupille hors axe est ignorée. L’optimisation est locale ; le tolérancement ne perturbe que rayons, épaisseurs et indices. Données de verres et de catalogue avec leur provenance dans opt-core.js.",
    "es": "Sistemas centrados con simetría de revolución de superficies refractoras esféricas, cónicas y asféricas pares en aire; sin espejos, elementos descentrados o inclinados, índice gradiente, superficies difractivas, recubrimientos ni polarización. Las rejillas de rayos están en la pupila de entrada paraxial (rayo principal apuntado al centro del diafragma); la MTF escala la pupila con la AN paraxial del espacio imagen, así que se ignora la deformación de la pupila fuera del eje. La optimización es local; las tolerancias solo perturban radios, espesores e índices. Datos de vidrios y catálogo con su procedencia en opt-core.js.",
    "pl": "Układy centrowane, obrotowo symetryczne, z załamujących powierzchni sferycznych, stożkowych i parzystych asferycznych w powietrzu; bez zwierciadeł, elementów zdecentrowanych lub pochylonych, gradientu współczynnika, powierzchni dyfrakcyjnych, powłok i polaryzacji. Siatki promieni leżą na przyosiowej źrenicy wejściowej (promień główny wycelowany w środek przysłony); MTF skaluje źrenicę przyosiową NA w przestrzeni obrazowej, więc deformacja źrenicy poza osią jest pominięta. Optymalizacja jest lokalna; tolerancje zaburzają tylko promienie, grubości i współczynniki. Dane szkieł i katalogu z pochodzeniem w opt-core.js."
  },

    "basis": {
      "en": "Paraxial y–u trace and Seidel sums after W. T. Welford, Aberrations of Optical Systems (1986) ch. 7–8; exact real rays by vector refraction on conic and even-aspheric surfaces; optical path difference on the reference sphere and PSF/MTF from the pupil function (J. W. Goodman, Introduction to Fourier Optics, 4th ed. 2017, ch. 6); damped least squares (R. Kingslake, R. B. Johnson, Lens Design Fundamentals, 2nd ed. 2010); glass dispersion from SCHOTT/OHARA/CDGM data (refractiveindex.info, CC0); Thorlabs public catalogue prescriptions.",
      "uk": "Параксіальне трасування y–u і суми Зейделя за В. Т. Велфордом, Aberrations of Optical Systems (1986), розд. 7–8; точні реальні промені векторним заломленням на конічних і парних асферичних поверхнях; різниця оптичних шляхів на сфері порівняння й ФРТ/MTF з функції зіниці (Дж. В. Гудмен, Introduction to Fourier Optics, 4-те вид. 2017, розд. 6); метод найменших квадратів із загасанням (Р. Кінгслейк, Р. Б. Джонсон, Lens Design Fundamentals, 2-ге вид. 2010); дисперсія скла з даних SCHOTT/OHARA/CDGM (refractiveindex.info, CC0); рецепти з публічного каталогу Thorlabs.",
      "de": "Paraxiale y–u-Durchrechnung und Seidel-Summen nach W. T. Welford, Aberrations of Optical Systems (1986) Kap. 7–8; exakte reale Strahlen durch vektorielle Brechung an konischen und geraden asphärischen Flächen; optische Wegdifferenz auf der Referenzkugel und PSF/MTF aus der Pupillenfunktion (J. W. Goodman, Introduction to Fourier Optics, 4. Aufl. 2017, Kap. 6); gedämpfte kleinste Quadrate (R. Kingslake, R. B. Johnson, Lens Design Fundamentals, 2. Aufl. 2010); Glasdispersion aus SCHOTT/OHARA/CDGM-Daten (refractiveindex.info, CC0); Vorschriften aus dem öffentlichen Thorlabs-Katalog.",
      "nl": "Paraxiale y–u-doorrekening en Seidel-sommen naar W. T. Welford, Aberrations of Optical Systems (1986) hfst. 7–8; exacte echte stralen door vectoriële breking op conische en even asferische vlakken; optisch wegverschil op de referentiebol en PSF/MTF uit de pupilfunctie (J. W. Goodman, Introduction to Fourier Optics, 4e dr. 2017, hfst. 6); gedempte kleinste kwadraten (R. Kingslake, R. B. Johnson, Lens Design Fundamentals, 2e dr. 2010); glasdispersie uit SCHOTT/OHARA/CDGM-gegevens (refractiveindex.info, CC0); recepten uit de openbare Thorlabs-catalogus.",

  /* meridional layout: surfaces (sag over the used height), glass, rays of each field (primary λ), image plane */

  function applyPreset(p) {
    return function (t) {
      var base = clone(DEFAULTS); importMsg = null; optInfo = null; tolInfo = null; undoSurf = null;
      var st = stateOfSys(E.PRESETS[p.sys](), p.extra);
      Object.keys(base).forEach(function (k) { t[k] = base[k]; });
      Object.keys(st).forEach(function (k) { if (k !== 'vary') t[k] = clone(st[k]); });
      if (p.extra && p.extra.vary) p.extra.vary.forEach(function (i) { if (t.surfaces[i]) t.surfaces[i].vR = true; });
    };
  }

  /* ============================================================ 7. results */
  function verdictOf(r) {
    var P = r.P, sp = r.A.spots, w0 = r.A.wave && r.A.wave[0], airy = r.A.airy, rms = sp[0].stat.rms;
    if (!sp[0].stat.valid) return { tone: 'bad', text: fill(T('Only {p} % of the rays on axis pass the system — the aperture or field is too large for this prescription, so no spot size is given. Reduce the aperture or check the radii.', 'Лише {p} % променів на осі проходять систему — апертура чи поле завеликі для цього рецепта, тож розмір плями не наведено. Зменште апертуру або перевірте радіуси.', 'Nur {p} % der Strahlen auf der Achse gehen durch das System — Öffnung oder Feld sind für diese Vorschrift zu groß, daher wird keine Fleckgröße angegeben. Öffnung verkleinern oder Radien prüfen.', 'Slechts {p} % van de stralen op de as gaat door het stelsel — opening of veld is te groot voor dit recept, dus er wordt geen vlekgrootte gegeven. Verklein de opening of controleer de stralen.', 'Seuls {p} % des rayons sur l’axe traversent le système — ouverture ou champ trop grands pour cette formule, aucune taille de tache n’est donc donnée. Réduisez l’ouverture ou vérifiez les rayons.', 'Solo el {p} % de los rayos en el eje atraviesa el sistema: la apertura o el campo son demasiado grandes para esta prescripción, así que no se da tamaño de mancha. Reduzca la apertura o revise los radios.', 'Tylko {p} % promieni na osi przechodzi przez układ — apertura lub pole są za duże dla tej recepty, więc nie podano rozmiaru plamki. Zmniejsz aperturę lub sprawdź promienie.'), { p: F(100 * sp[0].stat.frac, 0) }) };
    var head = fill(T('f = {f} mm at f/{n}: RMS spot on axis {s} µm, Airy radius {a} µm.', 'f = {f} мм при f/{n}: RMS плями на осі {s} мкм, радіус Ейрі {a} мкм.', 'f = {f} mm bei f/{n}: RMS-Fleck auf der Achse {s} µm, Airy-Radius {a} µm.', 'f = {f} mm bij f/{n}: RMS-vlek op de as {s} µm, Airy-straal {a} µm.', 'f = {f} mm à f/{n} : tache RMS sur l’axe {s} µm, rayon d’Airy {a} µm.', 'f = {f} mm a f/{n}: mancha RMS en el eje {s} µm, radio de Airy {a} µm.', 'f = {f} mm przy f/{n}: plamka RMS na osi {s} µm, promień Airy’ego {a} µm.'),
      { f: F3(P.efl), n: F(P.fnoW, 2), s: F3(um(rms)), a: F(um(airy), 2) });
    var dl = w0 && w0.strehl >= 0.8;
    var tail = dl ? T(' Diffraction-limited on axis (Strehl ≥ 0.8).', ' На осі обмежено дифракцією (Штрель ≥ 0,8).', ' Auf der Achse beugungsbegrenzt (Strehl ≥ 0,8).', ' Op de as buigingsbegrensd (Strehl ≥ 0,8).', ' Limité par la diffraction sur l’axe (Strehl ≥ 0,8).', ' Limitado por difracción en el eje (Strehl ≥ 0,8).', ' Na osi ograniczenie dyfrakcyjne (Strehl ≥ 0,8).')
                  : T(' Aberrations dominate (Strehl < 0.8).', ' Переважають аберації (Штрель < 0,8).', ' Aberrationen dominieren (Strehl < 0,8).', ' Aberraties overheersen (Strehl < 0,8).', ' Les aberrations dominent (Strehl < 0,8).', ' Dominan las aberraciones (Strehl < 0,8).', ' Dominują aberracje (Strehl < 0,8).');
    var t = {}; LANGS.forEach(function (L) { t[L] = head[L] + tail[L]; });
    return { tone: dl ? 'ok' : (rms < 3 * airy ? 'warn' : 'bad'), text: t };
  }

  function spotTable(r) {
    var rows = [];
    r.A.spots.forEach(function (sp, fi) {
      var w = r.A.wave && r.A.wave[fi];
      var ok = sp.stat.valid, rmsU = ok ? um(sp.stat.rms) : NaN;

van het diafragma, de overige stralen op een vierkant raster van 21 × 21 op de paraxiale intreepupil (ongeveer 2 % boven het continue pupilgemiddelde als sferische aberratie overheerst). Golffront op de referentiebol rond het beeldpunt van de hoofdstraal, zonder zuiger en kanteling; PSF en MTF uit de pupilfunctie (64 × 64, verfijnd tot 256 × 256 totdat het golffront tussen punten ≤ ¼ golf verandert), pupil geschaald met de paraxiale NA aan beeldzijde. Seidel-sommen uit de paraxiale rand- en hoofdstraal (Welford).', 'Rayons réels : réfraction exacte sur chaque surface (conique et asphère paire), rayon principal visé au centre du diaphragme, les autres sur une grille carrée 21 × 21 de la pupille d’entrée paraxiale (environ 2 % au-dessus de la moyenne continue sur la pupille quand l’aberration sphérique domine). Front d’onde sur la sphère de référence centrée sur le point image du rayon principal, piston et basculement retirés ; FEP et FTM à partir de la fonction pupille (64 × 64, affinée jusqu’à 256 × 256 tant que le front d’onde varie de plus de ¼ d’onde entre échantillons), pupille mise à l’échelle par l’ON image paraxiale. Sommes de Seidel à partir des rayons paraxiaux marginal et principal (Welford).', 'Rayos reales: refracción exacta en cada superficie (cónica y asférica par), rayo principal apuntado al centro del diafragma y los demás en una rejilla cuadrada de 21 × 21 de la pupila de entrada paraxial (cerca de un 2 % por encima de la media continua sobre la pupila cuando domina la aberración esférica). Frente de onda sobre la esfera de referencia centrada en el punto imagen del rayo principal, sin pistón ni inclinación; PSF y MTF a partir de la función pupila (64 × 64, refinada hasta 256 × 256 mientras el frente de onda cambie más de ¼ de onda entre muestras), pupila escalada con la AN paraxial del espacio imagen. Sumas de Seidel con los rayos paraxiales marginal y principal (Welford).', 'Promienie rzeczywiste: dokładne załamanie na każdej powierzchni (stożkowa i parzysta asfera), promień główny wycelowany w środek przysłony, pozostałe na kwadratowej siatce 21 × 21 przyosiowej źrenicy wejściowej (około 2 % powyżej ciągłej średniej po źrenicy, gdy dominuje aberracja sferyczna). Czoło fali na sferze odniesienia o środku w punkcie obrazu promienia głównego, bez tłoka i pochylenia; PSF i MTF z funkcji źrenicy (64 × 64, zagęszczanej do 256 × 256, aż zmiana czoła fali między próbkami ≤ ¼ fali), źrenica skalowana przyosiową NA w przestrzeni obrazowej. Sumy Seidla z przyosiowych promieni brzegowego i głównego (Welford).'));
    return { verdict: verdictOf(r), tiles: tiles, tables: tables, notes: notes };
  }

  /* ------------------------------------------------- optimiser and tolerance actions */
  function runOptimise() {
    var vars = [];
    state.surfaces.forEach(function (r, i) { if (r.vR) vars.push({ i: i, what: 'c' }); if (r.vT && i < state.surfaces.length - 1) vars.push({ i: i, what: 't', min: /^air$/i.test(r.mat) ? 0 : 0.5 }); });
    if (!vars.length) { optInfo = { msg: T('Tick "vary R" or "vary t" on at least one surface first.', 'Спершу позначте «змінювати R» або «змінювати t» хоча б на одній поверхні.', 'Zuerst bei mindestens einer Fläche „R variieren“ oder „t variieren“ ankreuzen.', 'Vink eerst bij minstens één vlak „R variëren” of „t variëren” aan.', 'Cochez d’abord « varier R » ou « varier t » sur au moins une surface.', 'Marque primero «variar R» o «variar t» en al menos una superficie.', 'Najpierw zaznacz „zmieniaj R” lub „zmieniaj t” przy co najmniej jednej powierzchni.') }; ui.run(); return; }
    var target = num(state.optEfl, 0) > 0 ? { efl: num(state.optEfl, 0) } : {};
    try {
      var o = E.optimize(sysOf(state), vars, target, { iters: 40 });
      undoSurf = clone(state.surfaces);
      var flags = state.surfaces.map(function (r) { return [r.vR, r.vT]; });
      var nr = rowsOf({ surfaces: o.surfaces });
      nr.forEach(function (r, i) { r.vR = flags[i][0]; r.vT = flags[i][1]; r.sd = state.surfaces[i].sd; });
      state.surfaces = nr;
      optInfo = { msg: fill(T('Optimised: merit (RMS ray error) {a} → {b} µm in {n} iterations. "Undo" restores the start.', 'Оптимізовано: функція якості (RMS похибки променів) {a} → {b} мкм за {n} ітерацій. «Скасувати» повертає початок.', 'Optimiert: Gütefunktion (RMS-Strahlfehler) {a} → {b} µm in {n} Iterationen. „Rückgängig“ stellt den Start wieder her.', 'Geoptimaliseerd: merit (RMS-stralenfout) {a} → {b} µm in {n} iteraties. „Ongedaan maken” zet de start terug.', 'Optimisé : fonction de mérite (erreur RMS des rayons) {a} → {b} µm en {n} itérations. « Annuler » rétablit le départ.', 'Optimizado: función de mérito (error RMS de rayos) {a} → {b} µm en {n} iteraciones. «Deshacer» restaura el inicio.', 'Zoptymalizowano: funkcja zasługi (RMS błędu promieni) {a} → {b} µm w {n} iteracjach. „Cofnij” przywraca start.'), { a: F3(um(o.merit0)), b: F3(um(o.merit)), n: o.iters }) };
    } catch (e) { optInfo = { msg: T('The optimiser could not trace the start system.', 'Оптимізатор не зміг простежити початкову систему.', 'Der Optimierer konnte das Startsystem nicht durchrechnen.', 'De optimalisatie kon het startsysteem niet doorrekenen.', 'L’optimiseur n’a pas pu tracer le système de départ.', 'El optimizador no pudo trazar el sistema inicial.', 'Optymalizator nie mógł prześledzić układu startowego.') }; }
    tolInfo = null; ui.sync(); ui.run();
  }
  function undoLast() {
    if (!undoSurf) return;
    state.surfaces = undoSurf; undoSurf = null; optInfo = null; tolInfo = null; ui.sync(); ui.run();
  }
  function runTolerance() {
    try {
      var sys = sysOf(state);
      var t = E.tolerance(sys, { dR: num(state.tolR, 0) / 100, dt: num(state.tolT, 0), dn: num(state.tolN, 0) }, { trials: Math.max(5, Math.min(500, num(state.tolTrials, 50) | 0)) });
      t.fields = sys.fields; tolInfo = t;
    } catch (e) { tolInfo = null; }
    ui.run();
  }

  /* ============================================================ 8. learn */
  var LEARN = {
    version: 1,
    intro: { title: T('What this tool does', 'Що робить цей інструмент', 'Was dieses Werkzeug tut', 'Wat deze tool doet', 'Ce que fait cet outil', 'Qué hace esta herramienta', 'Co robi to narzędzie'),
      body: T('Type a lens prescription surface by surface — radius, thickness, glass, semi-diameter — or start from a catalogue lens or a classic design. The tool traces real rays through it and tells you how good the image is: focal lengths and pupils, spot diagrams against the Airy disc, ray fans, wavefront error, Strehl ratio and MTF, Seidel aberrations by surface, field curvature, distortion and colour. A damped least-squares optimiser bends surfaces for you, a Monte Carlo run shows what manufacturing tolerances do, and the stock finder proposes catalogue lenses.', 'Введіть рецепт лінзи поверхня за поверхнею — радіус, товщину, скло, напівдіаметр — або почніть із каталожної лінзи чи класичної схеми. Інструмент простежує через неї реальні промені й показує, наскільки добре зображення: фокусні відстані й зіниці, діаграми плям проти диска Ейрі, віяла променів, похибку хвильового фронту, число Штреля й MTF, аберації Зейделя за поверхнями, кривизну поля, дисторсію й колір. Оптимізатор методом найменших квадратів із загасанням сам вигинає поверхні, Монте-Карло показує вплив виробничих допусків, а пошук у каталозі пропонує готові лінзи.', 'Geben Sie eine Linsenvorschrift Fläche für Fläche ein — Radius, Dicke, Glas, halber Durchmesser — oder beginnen Sie mit einer Kataloglinse oder einem klassischen Design. Das Werkzeug rechnet reale Strahlen durch und zeigt, wie gut das Bild ist: Brennweiten und Pupillen, Spotdiagramme gegen das Airy-Scheibchen, Strahlfächer, Wellenfrontfehler, Strehl-Verhältnis und MTF, Seidel-Aberrationen je Fläche, Bildfeldwölbung, Verzeichnung und Farbe. Ein Optimierer (gedämpfte kleinste Quadrate) biegt Flächen für Sie, ein Monte-Carlo-Lauf zeigt die Wirkung von Fertigungstoleranzen, und die Katalogsuche schlägt Lagerlinsen vor.', 'Voer een lensrecept vlak voor vlak in — straal, dikte, glas, halve diameter — of begin met een cataloguslens of een klassiek ontwerp. De tool rekent echte stralen door en laat zien hoe goed het beeld is: brandpuntsafstanden en pupillen, vlekdiagrammen tegen de Airy-schijf, stralenwaaiers, golffrontfout, Strehl-verhouding en MTF, Seidel-aberraties per vlak, veldkromming, vertekening en kleur. Een optimalisatie met gedempte kleinste kwadraten buigt vlakken voor u, een Monte-Carlo-run toont wat fabricagetoleranties doen en de catalogus­zoeker stelt voorraadlenzen voor.', 'Saisissez une formule optique surface par surface — rayon, épaisseur, verre, demi-diamètre — ou partez d’une lentille de catalogue ou d’une combinaison classique. L’outil trace des rayons réels et dit si l’image est bonne : focales et pupilles, diagrammes de taches face au disque d’Airy, éventails de rayons, erreur de front d’onde, rapport de Strehl et FTM, aberrations de Seidel par surface, courbure de champ, distorsion et couleur. Un optimiseur par moindres carrés amortis cambre les surfaces pour vous, un tirage Monte-Carlo montre l’effet des tolérances de fabrication et la recherche en catalogue propose des lentilles standard.', 'Escriba una prescripción superficie a superficie (radio, espesor, vidrio, semidiámetro) o parta de una lente de catálogo o de un diseño clásico. La herramienta traza rayos reales y le dice cuán buena es la imagen: focales y pupilas, diagramas de manchas frente al disco de Airy, abanicos de rayos, error de frente de onda, razón de Strehl y MTF, aberraciones de Seidel por superficie, curvatura de campo, distorsión y color. Un optimizador por mínimos cuadrados amortiguados curva las superficies por usted, una tanda Monte Carlo muestra el efecto de las tolerancias de fabricación y el buscador de catálogo propone lentes estándar.', 'Wpisz receptę soczewki powierzchnia po powierzchni — promień, grubość, szkło, półśrednicę — albo zacznij od soczewki katalogowej lub klasycznego układu. Narzędzie śledzi przez nią rzeczywiste promienie i mówi, jak dobry jest obraz: ogniskowe i źrenice, wykresy plamek wobec krążka Airy’ego, wachlarze promieni, błąd czoła fali, współczynnik Strehla i MTF, aberracje Seidla według powierzchni, krzywiznę pola, dystorsję i barwę. Optymalizator metodą tłumionych najmniejszych kwadratów sam wygina powierzchnie, przebieg Monte Carlo pokazuje skutki tolerancji wykonania, a wyszukiwarka katalogowa proponuje gotowe soczewki.') },
    topics: {
      prescription: { title: T('Entering a prescription', 'Як вводити рецепт', 'Eine Vorschrift eingeben', 'Een recept invoeren', 'Saisir une formule', 'Introducir una prescripción', 'Wprowadzanie recepty'),
        body: T('Each row is one surface. R is its radius (positive when the centre of curvature lies to the right, 0 = flat), t the distance to the next surface, the material the medium after it (air or a glass from the catalogue). The last t is the distance to the image plane; with "Image plane" on paraxial or best focus the tool sets it for you. Mark one surface as the aperture stop.', 'Кожен рядок — одна поверхня. R — її радіус (додатний, коли центр кривизни праворуч, 0 — пласка), t — відстань до наступної поверхні, матеріал — середовище за нею (повітря або скло з каталогу). Остання t — відстань до площини зображення; якщо «Площина зображення» стоїть на параксіальному чи найкращому фокусі, інструмент задає її сам. Позначте одну поверхню як апертурну діафрагму.', 'Jede Zeile ist eine Fläche. R ist ihr Radius (positiv, wenn der Krümmungsmittelpunkt rechts liegt, 0 = plan), t der Abstand zur nächsten Fläche, das Material das Medium dahinter (Luft oder ein Katalogglas). Das letzte t ist der Abstand zur Bildebene; steht „Bildebene“ auf paraxialem oder bestem Fokus, setzt das Werkzeug ihn selbst. Markieren Sie eine Fläche als Aperturblende.', 'Elke rij is één vlak. R is de straal (positief als het krommingsmiddelpunt rechts ligt, 0 = vlak), t de afstand tot het volgende vlak, het materiaal het medium erna (lucht of een glas uit de catalogus). De laatste t is de afstand tot het beeldvlak; staat „Beeldvlak” op paraxiaal of beste focus, dan zet de tool die zelf. Markeer één vlak als aperturdiafragma.', 'Chaque ligne est une surface. R est son rayon (positif si le centre de courbure est à droite, 0 = plan), t la distance à la surface suivante, le matériau le milieu qui la suit (air ou verre du catalogue). La dernière épaisseur est la distance au plan image ; avec « Plan image » sur foyer paraxial ou meilleur foyer, l’outil la fixe lui-même. Marquez une surface comme diaphragme d’ouverture.', 'Cada fila es una superficie. R es su radio (positivo si el centro de curvatura está a la derecha, 0 = plana), t la distancia a la siguiente superficie y el material, el medio que la sigue (aire o un vidrio del catálogo). El último t es la distancia al plano imagen; con «Plano imagen» en foco paraxial o mejor foco la herramienta lo fija por usted. Marque una superficie como diafragma de apertura.', 'Każdy wiersz to jedna powierzchnia. R to jej promień (dodatni, gdy środek krzywizny leży po prawej, 0 = płaska), t to odległość do następnej powierzchni, materiał — ośrodek za nią (powietrze lub szkło z katalogu). Ostatnie t to odległość do płaszczyzny obrazu; gdy „Płaszczyzna obrazu” jest na ognisku przyosiowym lub najlepszym, narzędzie ustawia ją samo. Oznacz jedną powierzchnię jako przysłonę aperturową.') },
      paraxial: { title: T('Focal lengths and cardinal points', 'Фокусні відстані й кардинальні точки', 'Brennweiten und Kardinalpunkte', 'Brandpuntsafstanden en kardinale punten', 'Focales et points cardinaux', 'Focales y puntos cardinales', 'Ogniskowe i punkty kardynalne'),
        body: T('A paraxial ray (small heights and angles) traced with n′u′ = nu − yφ, φ = c (n′ − n), gives the first-order data: EFL = −y₁/u′ (collimated ray of height y₁), BFL from the last vertex to the rear focus, FFL in front of the first vertex. Thick lenses have two principal planes; EFL is measured from the rear one, BFL from the glass.', 'Параксіальний промінь (малі висоти й кути), простежений за n′u′ = nu − yφ, φ = c (n′ − n), дає дані першого порядку: EFL = −y₁/u′ (паралельний промінь висоти y₁), BFL — від останньої вершини до заднього фокуса, FFL — перед першою вершиною. Товсті лінзи мають дві головні площини; EFL відраховують від задньої, BFL — від скла.', 'Ein paraxialer Strahl (kleine Höhen und Winkel), gerechnet mit n′u′ = nu − yφ, φ = c (n′ − n), liefert die Daten erster Ordnung: EFL = −y₁/u′ (achsparalleler Strahl der Höhe y₁), BFL vom letzten Scheitel zum hinteren Brennpunkt, FFL vor dem ersten Scheitel. Dicke Linsen haben zwei Hauptebenen; die EFL zählt ab der hinteren, die BFL ab dem Glas.', 'Een paraxiale straal (kleine hoogten en hoeken), doorgerekend met n′u′ = nu − yφ, φ = c (n′ − n), levert de eerste-ordegegevens: EFL = −y₁/u′ (evenwijdige straal op hoogte y₁), BFL van de laatste top tot het achterste brandpunt, FFL vóór de eerste top. Dikke lenzen hebben twee hoofdvlakken; de EFL telt vanaf het achterste, de BFL vanaf het glas.', 'Un rayon paraxial (petites hauteurs et petits angles) tracé par n′u′ = nu − yφ, φ = c (n′ − n), donne les données du premier ordre : EFL = −y₁/u′ (rayon parallèle de hauteur y₁), tirage arrière depuis le dernier sommet jusqu’au foyer image, tirage avant devant le premier sommet. Une lentille épaisse a deux plans principaux ; l’EFL se compte depuis le plan arrière, le tirage depuis le verre.', 'Un rayo paraxial (alturas y ángulos pequeños) trazado con n′u′ = nu − yφ, φ = c (n′ − n), da los datos de primer orden: EFL = −y₁/u′ (rayo paralelo de altura y₁), BFL desde el último vértice hasta el foco posterior, FFL delante del primer vértice. Una lente gruesa tiene dos planos principales; la EFL se mide desde el posterior y la BFL desde el vidrio.', 'Promień przyosiowy (małe wysokości i kąty) śledzony wzorem n′u′ = nu − yφ, φ = c (n′ − n), daje dane pierwszego rzędu: EFL = −y₁/u′ (promień równoległy na wysokości y₁), BFL od ostatniego wierzchołka do tylnego ogniska, FFL przed pierwszym wierzchołkiem. Gruba soczewka ma dwie płaszczyzny główne; EFL mierzy się od tylnej, BFL od szkła.') },
      stop: { title: T('Aperture stop and pupils', 'Апертурна діафрагма й зіниці', 'Aperturblende und Pupillen', 'Aperturdiafragma en pupillen', 'Diaphragme d’ouverture et pupilles', 'Diafragma de apertura y pupilas', 'Przysłona aperturowa i źrenice'),
        body: T('The stop limits the bundle of every field point. Its image seen from the object is the entrance pupil, from the image the exit pupil. f-number = EFL / entrance-pupil diameter; the working f-number 1/(2 NA′) counts for diffraction. The chief ray passes through the centre of the stop — where the stop sits decides coma, astigmatism and distortion.', 'Діафрагма обмежує пучок кожної точки поля. Її зображення з боку предмета — вхідна зіниця, з боку зображення — вихідна. Діафрагмове число = EFL / діаметр вхідної зіниці; для дифракції важить робоче число 1/(2 NA′). Головний промінь іде через центр діафрагми — її положення визначає кому, астигматизм і дисторсію.', 'Die Blende begrenzt das Bündel jedes Feldpunkts. Ihr Bild vom Objekt aus ist die Eintrittspupille, vom Bild aus die Austrittspupille. Blendenzahl = EFL / Durchmesser der Eintrittspupille; für die Beugung zählt die effektive Blendenzahl 1/(2 NA′). Der Hauptstrahl geht durch die Blendenmitte — wo die Blende sitzt, entscheidet über Koma, Astigmatismus und Verzeichnung.', 'Het diafragma begrenst de bundel van elk veldpunt. Het beeld ervan gezien vanaf het object is de intreepupil, vanaf het beeld de uittreepupil. Diafragmagetal = EFL / diameter van de intreepupil; voor buiging telt het werkelijke getal 1/(2 NA′). De hoofdstraal gaat door het midden van het diafragma — waar het zit, bepaalt coma, astigmatisme en vertekening.', 'Le diaphragme limite le faisceau de chaque point du champ. Son image vue de l’objet est la pupille d’entrée, vue de l’image la pupille de sortie. Nombre d’ouverture = EFL / diamètre de la pupille d’entrée ; pour la diffraction compte l’ouverture effective 1/(2 ON′). Le rayon principal passe par le centre du diaphragme — sa position décide de la coma, de l’astigmatisme et de la distorsion.', 'El diafragma limita el haz de cada punto del campo. Su imagen vista desde el objeto es la pupila de entrada; desde la imagen, la de salida. Número f = EFL / diámetro de la pupila de entrada; para la difracción cuenta el número f de trabajo 1/(2 AN′). El rayo principal pasa por el centro del diafragma: su posición decide la coma, el astigmatismo y la distorsión.', 'Przysłona ogranicza wiązkę każdego punktu pola. Jej obraz widziany od strony przedmiotu to źrenica wejściowa, od strony obrazu — wyjściowa. Liczba przysłony = EFL / średnica źrenicy wejściowej; dla dyfrakcji liczy się robocza liczba 1/(2 NA′). Promień główny przechodzi przez środek przysłony — jej położenie decyduje o komie, astygmatyzmie i dystorsji.') },
      spot: { title: T('Spot diagram and the Airy disc', 'Діаграма плями й диск Ейрі', 'Spotdiagramm und Airy-Scheibchen', 'Vlekdiagram en Airy-schijf', 'Diagramme de taches et disque d’Airy', 'Diagrama de manchas y disco de Airy', 'Wykres plamki i krążek Airy’ego'),
        body: T('Where a grid of rays from one field point lands on the image plane. RMS radius = root-mean-square distance from the centroid. Compare it with the Airy radius 1.22 λ/(2 NA′) = 1.22 λ N: a spot well inside the dashed circle means geometry no longer matters — diffraction does.', 'Куди на площині зображення падає сітка променів однієї точки поля. RMS-радіус — середньоквадратична відстань від центроїда. Порівняйте його з радіусом Ейрі 1,22 λ/(2 NA′) = 1,22 λ N: пляма всередині пунктирного кола означає, що геометрія вже не важить — важить дифракція.', 'Wo ein Strahlenraster eines Feldpunkts die Bildebene trifft. RMS-Radius = quadratisch gemittelter Abstand vom Schwerpunkt. Vergleichen Sie ihn mit dem Airy-Radius 1,22 λ/(2 NA′) = 1,22 λ N: liegt der Fleck deutlich im gestrichelten Kreis, zählt nicht mehr die Geometrie, sondern die Beugung.', 'Waar een raster stralen van één veldpunt op het beeldvlak landt. RMS-straal = kwadratisch gemiddelde afstand tot het zwaartepunt. Vergelijk die met de Airy-straal 1,22 λ/(2 NA′) = 1,22 λ N: een vlek ruim binnen de gestippelde cirkel betekent dat niet de geometrie maar de buiging telt.', 'L’endroit où une grille de rayons d’un point du champ arrive sur le plan image. Rayon RMS = distance quadratique moyenne au barycentre. Comparez-le au rayon d’Airy 1,22 λ/(2 ON′) = 1,22 λ N : une tache bien à l’intérieur du cercle pointillé signifie que la géométrie ne compte plus — c’est la diffraction qui limite.', 'Dónde cae sobre el plano imagen una rejilla de rayos de un punto del campo. Radio RMS = distancia cuadrática media al centroide. Compárelo con el radio de Airy 1,22 λ/(2 AN′) = 1,22 λ N: una mancha muy dentro del círculo discontinuo significa que ya no manda la geometría, sino la difracción.', 'Gdzie siatka promieni z jednego punktu pola trafia na płaszczyznę obrazu. Promień RMS = średniokwadratowa odległość od środka ciężkości. Porównaj go z promieniem Airy’ego 1,22 λ/(2 NA′) = 1,22 λ N: plamka wyraźnie wewnątrz przerywanego okręgu oznacza, że geometria już nie gra roli — decyduje dyfrakcja.') },
      seidel: { title: T('Seidel aberrations', 'Аберації Зейделя', 'Seidel-Aberrationen', 'Seidel-aberraties', 'Aberrations de Seidel', 'Aberraciones de Seidel', 'Aberracje Seidla'),
        body: T('Third-order theory splits the blur into five monochromatic sums — S_I spherical, S_II coma, S_III astigmatism, S_IV Petzval field curvature, S_V distortion — and two chromatic ones, C_L axial and C_T lateral colour, each a sum of contributions of the surfaces (Welford). The bar chart shows which surface causes what; a good design lets large contributions of opposite sign cancel.', 'Теорія третього порядку розкладає розмиття на п’ять монохроматичних сум — S_I сферична, S_II кома, S_III астигматизм, S_IV кривизна поля Пецваля, S_V дисторсія — і дві хроматичні: C_L поздовжній і C_T поперечний хроматизм; кожна — сума внесків поверхонь (Велфорд). Діаграма показує, яка поверхня що спричиняє; у добрій схемі великі внески протилежного знака гасять одне одного.', 'Die Theorie dritter Ordnung zerlegt die Unschärfe in fünf monochromatische Summen — S_I sphärisch, S_II Koma, S_III Astigmatismus, S_IV Petzval-Bildfeldwölbung, S_V Verzeichnung — und zwei chromatische, C_L Farblängs- und C_T Farbquerfehler, jeweils als Summe der Flächenbeiträge (Welford). Das Balkendiagramm zeigt, welche Fläche was verursacht; ein gutes Design lässt große Beiträge mit entgegengesetztem Vorzeichen sich aufheben.', 'De derde-ordetheorie splitst de onscherpte in vijf monochromatische sommen — S_I sferisch, S_II coma, S_III astigmatisme, S_IV Petzval-veldkromming, S_V vertekening — en twee chromatische, C_L axiale en C_T laterale kleurfout, elk een som van de bijdragen van de vlakken (Welford). Het staafdiagram toont welk vlak wat veroorzaakt; in een goed ontwerp heffen grote bijdragen van tegengesteld teken elkaar op.', 'La théorie du troisième ordre décompose le flou en cinq sommes monochromatiques — S_I sphérique, S_II coma, S_III astigmatisme, S_IV courbure de Petzval, S_V distorsion — et deux chromatiques, C_L chromatisme axial et C_T latéral, chacune somme des contributions des surfaces (Welford). Le diagramme montre quelle surface cause quoi ; une bonne combinaison fait se compenser de grandes contributions de signes opposés.', 'La teoría de tercer orden reparte el desenfoque en cinco sumas monocromáticas (S_I esférica, S_II coma, S_III astigmatismo, S_IV curvatura de Petzval, S_V distorsión) y dos cromáticas, C_L cromatismo axial y C_T lateral, cada una suma de las contribuciones de las superficies (Welford). El diagrama de barras muestra qué superficie causa qué; un buen diseño hace que grandes contribuciones de signo opuesto se compensen.', 'Teoria trzeciego rzędu dzieli rozmycie na pięć sum monochromatycznych — S_I sferyczna, S_II koma, S_III astygmatyzm, S_IV krzywizna Petzvala, S_V dystorsja — i dwie chromatyczne: C_L chromatyzm podłużny i C_T poprzeczny; każda to suma wkładów powierzchni (Welford). Wykres słupkowy pokazuje, która powierzchnia co powoduje; dobry układ pozwala dużym wkładom o przeciwnych znakach się znosić.') },
      sphere: { title: T('Spherical aberration and lens orientation', 'Сферична аберація й орієнтація лінзи', 'Sphärische Aberration und Linsenorientierung', 'Sferische aberratie en lensoriëntatie', 'Aberration sphérique et orientation de la lentille', 'Aberración esférica y orientación de la lente', 'Aberracja sferyczna i orientacja soczewki'),
        body: T('Marginal rays of a spherical surface focus shorter than paraxial ones; the transverse blur grows with the cube of the aperture. A plano-convex lens works best with its curved side towards the parallel light, so that both faces bend the rays about equally — about four times less spherical aberration than the other way round. Turn it round for a point source at its focus.', 'Крайові промені сферичної поверхні фокусуються ближче, ніж параксіальні; поперечне розмиття росте як куб апертури. Плоско-опукла лінза працює найкраще опуклою стороною до паралельного світла, щоб обидві грані заломлювали приблизно порівну — сферична аберація вчетверо менша, ніж навпаки. Для точкового джерела у фокусі її повертають.', 'Randstrahlen einer Kugelfläche fokussieren kürzer als paraxiale; die Querunschärfe wächst mit der dritten Potenz der Öffnung. Eine Plankonvexlinse arbeitet am besten mit der gewölbten Seite zum parallelen Licht, damit beide Flächen die Strahlen etwa gleich ablenken — rund viermal weniger sphärische Aberration als umgekehrt. Für eine Punktquelle im Brennpunkt dreht man sie um.', 'Randstralen van een bolvlak focussen korter dan paraxiale; de dwarse onscherpte groeit met de derde macht van de opening. Een plan-bolle lens werkt het best met de bolle kant naar het evenwijdige licht, zodat beide vlakken de stralen ongeveer even sterk afbuigen — ongeveer vier keer minder sferische aberratie dan andersom. Voor een puntbron in het brandpunt draait u haar om.', 'Les rayons marginaux d’une surface sphérique focalisent plus court que les rayons paraxiaux ; le flou transverse croît comme le cube de l’ouverture. Une plan-convexe donne le meilleur résultat face bombée vers la lumière parallèle : les deux faces dévient alors à peu près autant — environ quatre fois moins d’aberration sphérique que dans l’autre sens. Retournez-la pour une source ponctuelle à son foyer.', 'Los rayos marginales de una superficie esférica enfocan más cerca que los paraxiales; el desenfoque transversal crece con el cubo de la apertura. Una plano-convexa rinde mejor con la cara curva hacia la luz paralela, así ambas caras desvían más o menos lo mismo: unas cuatro veces menos aberración esférica que al revés. Para una fuente puntual en su foco, se le da la vuelta.', 'Promienie brzegowe powierzchni sferycznej ogniskują się bliżej niż przyosiowe; rozmycie poprzeczne rośnie z sześcianem apertury. Soczewka płasko-wypukła działa najlepiej wypukłą stroną do światła równoległego, tak by obie powierzchnie załamywały mniej więcej po równo — około czterech razy mniej aberracji sferycznej niż odwrotnie. Dla źródła punktowego w ognisku obraca się ją.') },
      coma: { title: T('Coma and the stop position', 'Кома й положення діафрагми', 'Koma und Blendenlage', 'Coma en de positie van het diafragma', 'Coma et position du diaphragme', 'Coma y posición del diafragma', 'Koma i położenie przysłony'),
        body: T('Off axis, rays through the edge of the pupil focus at a different height than the chief ray: a comet-shaped spot. Moving the stop changes which part of each surface the oblique bundle uses, so S_II, S_III and S_V change while S_I and S_IV do not (stop-shift equations). The landscape lens puts the stop where coma vanishes.', 'Поза віссю промені через край зіниці фокусуються на іншій висоті, ніж головний: пляма у формі комети. Зсув діафрагми змінює, яку частину кожної поверхні використовує похилий пучок, тож S_II, S_III і S_V змінюються, а S_I та S_IV — ні (рівняння зсуву діафрагми). Пейзажна лінза ставить діафрагму там, де кома зникає.', 'Außerhalb der Achse fokussieren Strahlen durch den Pupillenrand in anderer Höhe als der Hauptstrahl: ein kometenförmiger Fleck. Eine Blendenverschiebung ändert, welchen Teil jeder Fläche das schräge Bündel nutzt; S_II, S_III und S_V ändern sich, S_I und S_IV nicht (Blendenverschiebungsgleichungen). Die Landschaftslinse setzt die Blende dorthin, wo die Koma verschwindet.', 'Buiten de as focussen stralen door de rand van de pupil op een andere hoogte dan de hoofdstraal: een komeetvormige vlek. Het diafragma verschuiven verandert welk deel van elk vlak de schuine bundel gebruikt, dus S_II, S_III en S_V veranderen, S_I en S_IV niet (diafragmaverschuivingsvergelijkingen). De landschapslens zet het diafragma waar coma verdwijnt.', 'Hors de l’axe, les rayons passant par le bord de la pupille focalisent à une autre hauteur que le rayon principal : une tache en forme de comète. Déplacer le diaphragme change la partie de chaque surface utilisée par le faisceau oblique ; S_II, S_III et S_V changent, S_I et S_IV non (équations de déplacement du diaphragme). L’objectif paysage place le diaphragme là où la coma s’annule.', 'Fuera del eje, los rayos que pasan por el borde de la pupila enfocan a otra altura que el principal: una mancha con forma de cometa. Mover el diafragma cambia la parte de cada superficie que usa el haz oblicuo, así que S_II, S_III y S_V cambian y S_I y S_IV no (ecuaciones de desplazamiento del diafragma). La lente de paisaje pone el diafragma donde la coma se anula.', 'Poza osią promienie przez brzeg źrenicy ogniskują się na innej wysokości niż promień główny: plamka w kształcie komety. Przesunięcie przysłony zmienia, którą część każdej powierzchni wykorzystuje skośna wiązka, więc S_II, S_III i S_V się zmieniają, a S_I i S_IV nie (równania przesunięcia przysłony). Soczewka krajobrazowa ma przysłonę tam, gdzie koma znika.') },
      field: { title: T('Astigmatism, field curvature, Petzval', 'Астигматизм, кривизна поля, Пецваль', 'Astigmatismus, Bildfeldwölbung, Petzval', 'Astigmatisme, veldkromming, Petzval', 'Astigmatisme, courbure de champ, Petzval', 'Astigmatismo, curvatura de campo, Petzval', 'Astygmatyzm, krzywizna pola, Petzval'),
        body: T('Off-axis bundles focus on two curved surfaces, tangential (T) and sagittal (S); their mean departs from a flat sensor. Even without astigmatism the image lies on the Petzval surface of radius −1/(n′ Σ φ/(n n′)), fixed by powers and indices only — positive lenses curve it, only negative elements with low index flatten it. That is the job of the flint in a Cooke triplet.', 'Позаосьові пучки фокусуються на двох викривлених поверхнях — меридіональній (T) і сагітальній (S); їхня середня відходить від плаского сенсора. Навіть без астигматизму зображення лежить на поверхні Пецваля радіуса −1/(n′ Σ φ/(n n′)), яку задають лише оптичні сили й показники — додатні лінзи її викривляють, вирівнюють лише від’ємні елементи. Це завдання флінта в триплеті Кука.', 'Schräge Bündel fokussieren auf zwei gewölbten Flächen, tangential (T) und sagittal (S); ihr Mittel weicht vom ebenen Sensor ab. Selbst ohne Astigmatismus liegt das Bild auf der Petzval-Fläche mit Radius −1/(n′ Σ φ/(n n′)), festgelegt nur durch Brechkräfte und Indizes — positive Linsen wölben sie, nur negative Glieder ebnen sie. Das ist die Aufgabe des Flints im Cooke-Triplet.', 'Schuine bundels focussen op twee gekromde vlakken, tangentiaal (T) en sagittaal (S); hun gemiddelde wijkt af van een vlakke sensor. Zelfs zonder astigmatisme ligt het beeld op het Petzval-vlak met straal −1/(n′ Σ φ/(n n′)), alleen bepaald door sterkten en indices — positieve lenzen krommen het, alleen negatieve elementen maken het vlakker. Dat doet de flint in een Cooke-triplet.', 'Les faisceaux obliques focalisent sur deux surfaces courbes, tangentielle (T) et sagittale (S) ; leur moyenne s’écarte d’un capteur plan. Même sans astigmatisme, l’image se trouve sur la surface de Petzval de rayon −1/(n′ Σ φ/(n n′)), fixée par les puissances et les indices — les lentilles positives la courbent, seules les négatives l’aplanissent. C’est le rôle du flint dans le triplet de Cooke.', 'Los haces oblicuos enfocan en dos superficies curvas, tangencial (T) y sagital (S); su media se aparta de un sensor plano. Incluso sin astigmatismo, la imagen está en la superficie de Petzval de radio −1/(n′ Σ φ/(n n′)), fijada solo por potencias e índices: las lentes positivas la curvan y solo las negativas la aplanan. Esa es la tarea del flint en el triplete de Cooke.', 'Wiązki pozaosiowe ogniskują się na dwóch zakrzywionych powierzchniach, południkowej (T) i strzałkowej (S); ich średnia odbiega od płaskiego sensora. Nawet bez astygmatyzmu obraz leży na powierzchni Petzvala o promieniu −1/(n′ Σ φ/(n n′)), określonej tylko przez moce i współczynniki — soczewki dodatnie ją wyginają, spłaszczają tylko elementy ujemne. To zadanie flintu w trypletcie Cooke’a.') },
      distortion: { title: T('Distortion', 'Дисторсія', 'Verzeichnung', 'Vertekening', 'Distorsion', 'Distorsión', 'Dystorsja'),
        body: T('The real chief ray lands at a different height than the paraxial image: (y − y_par)/y_par in per cent. Negative is barrel, positive pincushion. It does not blur the image, it bends straight lines — critical for measurement, harmless for a focusing lens.', 'Реальний головний промінь падає на іншій висоті, ніж параксіальне зображення: (y − y_par)/y_par у відсотках. Від’ємна — бочкоподібна, додатна — подушкоподібна. Вона не розмиває зображення, а гне прямі лінії — критично для вимірювань, байдуже для фокусувальної лінзи.', 'Der reale Hauptstrahl trifft in anderer Höhe auf als das paraxiale Bild: (y − y_par)/y_par in Prozent. Negativ ist tonnenförmig, positiv kissenförmig. Sie macht das Bild nicht unscharf, sondern biegt Geraden — kritisch beim Messen, harmlos bei einer Fokussierlinse.', 'De echte hoofdstraal landt op een andere hoogte dan het paraxiale beeld: (y − y_par)/y_par in procent. Negatief is tonvormig, positief kussenvormig. Ze maakt het beeld niet onscherp, maar buigt rechte lijnen — kritisch bij meten, onschuldig bij een focuslens.', 'Le rayon principal réel arrive à une autre hauteur que l’image paraxiale : (y − y_par)/y_par en pour cent. Négative = en barillet, positive = en coussinet. Elle ne rend pas l’image floue, elle courbe les droites — critique en métrologie, sans importance pour une lentille de focalisation.', 'El rayo principal real llega a otra altura que la imagen paraxial: (y − y_par)/y_par en tanto por ciento. Negativa es de barril; positiva, de cojín. No desenfoca la imagen, curva las rectas: es crítica para medir e inocua en una lente de enfoque.', 'Rzeczywisty promień główny trafia na innej wysokości niż obraz przyosiowy: (y − y_par)/y_par w procentach. Ujemna to beczkowata, dodatnia — poduszkowa. Nie rozmywa obrazu, tylko wygina proste — krytyczne w pomiarach, bez znaczenia dla soczewki ogniskującej.') },
      colour: { title: T('Chromatic aberration and the achromat', 'Хроматична аберація й ахромат', 'Farbfehler und Achromat', 'Kleurfout en achromaat', 'Chromatisme et achromat', 'Aberración cromática y acromático', 'Aberracja chromatyczna i achromat'),
        body: T('Glass bends blue more than red, so a singlet focuses blue closer: the F–C focal shift is about f/V (V = Abbe number, 64 for N-BK7). A cemented doublet of a low-dispersion crown and a high-dispersion flint with powers in the ratio of their Abbe numbers brings F and C to one focus; what remains is the secondary spectrum of the d line.', 'Скло заломлює синій сильніше за червоний, тож синглет фокусує синій ближче: зсув фокуса F–C приблизно f/V (V — число Аббе, 64 для N-BK7). Склеєний дублет із крона з малою дисперсією та флінта з великою, оптичні сили яких відносяться як їхні числа Аббе, зводить F і C в один фокус; залишається вторинний спектр лінії d.', 'Glas bricht Blau stärker als Rot, daher fokussiert eine Einzellinse Blau näher: die Fokusverschiebung F–C beträgt etwa f/V (V = Abbe-Zahl, 64 bei N-BK7). Ein verkittetes Duplet aus dispersionsarmem Kron und stark dispergierendem Flint mit Brechkräften im Verhältnis ihrer Abbe-Zahlen bringt F und C in einen Fokus; übrig bleibt das sekundäre Spektrum der d-Linie.', 'Glas breekt blauw sterker dan rood, dus een singlet focust blauw dichterbij: de focusverschuiving F–C is ongeveer f/V (V = abbegetal, 64 voor N-BK7). Een gekit doublet van een kroonglas met lage dispersie en een flintglas met hoge dispersie, met sterkten in de verhouding van hun abbegetallen, brengt F en C in één brandpunt; wat overblijft is het secundaire spectrum van de d-lijn.', 'Le verre dévie davantage le bleu que le rouge : un singulet focalise le bleu plus près, le décalage F–C vaut environ f/V (V = constringence, 64 pour N-BK7). Un doublet collé d’un crown peu dispersif et d’un flint dispersif, de puissances dans le rapport de leurs constringences, ramène F et C au même foyer ; il reste le spectre secondaire de la raie d.', 'El vidrio desvía más el azul que el rojo, así que un singlete enfoca el azul más cerca: el desplazamiento F–C es de unos f/V (V = número de Abbe, 64 en N-BK7). Un doblete cementado de un crown poco dispersivo y un flint muy dispersivo, con potencias en la razón de sus números de Abbe, lleva F y C a un mismo foco; queda el espectro secundario de la línea d.', 'Szkło załamuje niebieskie silniej niż czerwone, więc soczewka pojedyncza ogniskuje niebieskie bliżej: przesunięcie F–C wynosi około f/V (V — liczba Abbego, 64 dla N-BK7). Klejony dublet z kronu o małej dyspersji i flintu o dużej, o mocach w stosunku ich liczb Abbego, sprowadza F i C do jednego ogniska; zostaje widmo wtórne linii d.') },
      wavefront: { title: T('Wavefront error and Strehl ratio', 'Похибка хвильового фронту й число Штреля', 'Wellenfrontfehler und Strehl-Verhältnis', 'Golffrontfout en Strehl-verhouding', 'Erreur de front d’onde et rapport de Strehl', 'Error de frente de onda y razón de Strehl', 'Błąd czoła fali i współczynnik Strehla'),
        body: T('A perfect lens turns the wave into a sphere centred on the image point. The optical path difference (OPD) from that sphere, in waves, is the wavefront error. The Strehl ratio is the peak of the real point image relative to a perfect one; by Maréchal, Strehl ≈ exp(−(2π σ)²), and 0.8 (σ ≈ λ/14) is the usual "diffraction-limited" threshold.', 'Ідеальна лінза перетворює хвилю на сферу з центром у точці зображення. Різниця оптичних шляхів (OPD) від цієї сфери у хвилях і є похибкою фронту. Число Штреля — пік реального зображення точки відносно ідеального; за Марешалем Штрель ≈ exp(−(2π σ)²), і 0,8 (σ ≈ λ/14) — звичайна межа «обмежено дифракцією».', 'Eine perfekte Linse formt die Welle zu einer Kugel um den Bildpunkt. Die optische Wegdifferenz (OPD) zu dieser Kugel, in Wellen, ist der Wellenfrontfehler. Das Strehl-Verhältnis ist das Maximum des realen Punktbilds relativ zum perfekten; nach Maréchal gilt Strehl ≈ exp(−(2π σ)²), und 0,8 (σ ≈ λ/14) ist die übliche Schwelle „beugungsbegrenzt“.', 'Een perfecte lens maakt van de golf een bol rond het beeldpunt. Het optische wegverschil (OPD) ten opzichte van die bol, in golven, is de golffrontfout. De Strehl-verhouding is de piek van het echte puntbeeld ten opzichte van een perfect beeld; volgens Maréchal Strehl ≈ exp(−(2π σ)²), en 0,8 (σ ≈ λ/14) is de gebruikelijke grens „buigingsbegrensd”.', 'Une lentille parfaite transforme l’onde en sphère centrée sur le point image. La différence de marche (OPD) par rapport à cette sphère, en ondes, est l’erreur de front d’onde. Le rapport de Strehl est le pic de l’image réelle d’un point rapporté à l’image parfaite ; selon Maréchal, Strehl ≈ exp(−(2π σ)²), et 0,8 (σ ≈ λ/14) est le seuil usuel « limité par la diffraction ».', 'Una lente perfecta convierte la onda en una esfera centrada en el punto imagen. La diferencia de camino óptico (OPD) respecto a esa esfera, en ondas, es el error de frente de onda. La razón de Strehl es el pico de la imagen real de un punto respecto a la perfecta; según Maréchal, Strehl ≈ exp(−(2π σ)²), y 0,8 (σ ≈ λ/14) es el umbral habitual de «limitado por difracción».', 'Idealna soczewka zamienia falę w sferę o środku w punkcie obrazu. Różnica dróg optycznych (OPD) względem tej sfery, w falach, to błąd czoła fali. Współczynnik Strehla to szczyt rzeczywistego obrazu punktu względem idealnego; według Maréchala Strehl ≈ exp(−(2π σ)²), a 0,8 (σ ≈ λ/14) to zwykły próg „ograniczenia dyfrakcyjnego”.') },
      mtf: { title: T('MTF', 'MTF', 'MTF', 'MTF', 'FTM', 'MTF', 'MTF'),
        body: T('The modulation transfer function is the contrast with which a sine pattern of a given frequency (line pairs per mm) reaches the image. It is the magnitude of the Fourier transform of the point image, computed here from the pupil function by FFT. A perfect circular pupil gives the dotted curve, falling to zero at the cut-off 2 NA′/λ; T and S curves show the tangential and sagittal direction.', 'Функція передачі модуляції — контраст, з яким синусоїдний візерунок заданої частоти (пар ліній на мм) доходить до зображення. Це модуль перетворення Фур’є зображення точки, тут обчислений із функції зіниці методом ШПФ. Ідеальна кругла зіниця дає точкову криву, що спадає до нуля на граничній частоті 2 NA′/λ; криві T і S — меридіональний і сагітальний напрямки.', 'Die Modulationsübertragungsfunktion ist der Kontrast, mit dem ein Sinusmuster einer Frequenz (Linienpaare je mm) im Bild ankommt. Sie ist der Betrag der Fourier-Transformierten des Punktbilds, hier per FFT aus der Pupillenfunktion berechnet. Eine perfekte Kreispupille ergibt die gepunktete Kurve, die bei der Grenzfrequenz 2 NA′/λ null wird; T und S sind die tangentiale und sagittale Richtung.', 'De modulatieoverdrachtsfunctie is het contrast waarmee een sinuspatroon van een gegeven frequentie (lijnparen per mm) het beeld bereikt. Ze is de grootte van de fouriertransformatie van het puntbeeld, hier met FFT uit de pupilfunctie berekend. Een perfecte ronde pupil geeft de gestippelde kromme, die bij de grensfrequentie 2 NA′/λ nul wordt; T en S zijn de tangentiale en sagittale richting.', 'La fonction de transfert de modulation est le contraste avec lequel une mire sinusoïdale d’une fréquence donnée (paires de lignes par mm) atteint l’image. C’est le module de la transformée de Fourier de l’image d’un point, calculée ici par FFT à partir de la fonction pupille. Une pupille circulaire parfaite donne la courbe pointillée, nulle à la fréquence de coupure 2 ON′/λ ; T et S sont les directions tangentielle et sagittale.', 'La función de transferencia de modulación es el contraste con que un patrón sinusoidal de cierta frecuencia (pares de líneas por mm) llega a la imagen. Es el módulo de la transformada de Fourier de la imagen de un punto, calculada aquí por FFT a partir de la función pupila. Una pupila circular perfecta da la curva punteada, que se anula en la frecuencia de corte 2 AN′/λ; T y S son las direcciones tangencial y sagital.', 'Funkcja przenoszenia modulacji to kontrast, z jakim wzór sinusoidalny danej częstości (par linii na mm) dociera do obrazu. To moduł transformaty Fouriera obrazu punktu, liczony tu metodą FFT z funkcji źrenicy. Idealna okrągła źrenica daje krzywą kropkowaną, spadającą do zera przy częstości granicznej 2 NA′/λ; krzywe T i S to kierunek południkowy i strzałkowy.') },
      optimise: { title: T('The optimiser', 'Оптимізатор', 'Der Optimierer', 'De optimalisatie', 'L’optimiseur', 'El optimizador', 'Optymalizator'),
        body: T('Tick "vary R" or "vary t" on the surfaces you allow to change and give a target focal length (0 = free). Damped least squares (Levenberg–Marquardt) minimises the ray errors on the image plane for every field and wavelength plus the focal-length error, with the image plane following your choice. It finds the nearest good minimum, not the global best — the start matters.', 'Позначте «змінювати R» чи «змінювати t» на поверхнях, які можна змінювати, і задайте цільову фокусну відстань (0 — вільна). Метод найменших квадратів із загасанням (Левенберга–Марквардта) мінімізує похибки променів на площині зображення для всіх полів і довжин хвиль плюс похибку фокусної відстані, площина зображення — за вашим вибором. Він знаходить найближчий добрий мінімум, а не глобально найкращий — старт має значення.', 'Kreuzen Sie „R variieren“ oder „t variieren“ an den Flächen an, die sich ändern dürfen, und geben Sie eine Zielbrennweite (0 = frei). Gedämpfte kleinste Quadrate (Levenberg–Marquardt) minimieren die Strahlfehler in der Bildebene für alle Felder und Wellenlängen plus den Brennweitenfehler; die Bildebene folgt Ihrer Wahl. Gefunden wird das nächste gute Minimum, nicht das globale — der Start zählt.', 'Vink „R variëren” of „t variëren” aan bij de vlakken die mogen veranderen en geef een doel-brandpuntsafstand (0 = vrij). Gedempte kleinste kwadraten (Levenberg–Marquardt) minimaliseren de stralenfouten op het beeldvlak voor alle velden en golflengten plus de fout in brandpuntsafstand; het beeldvlak volgt uw keuze. Het vindt het dichtstbijzijnde goede minimum, niet het globale — de start telt.', 'Cochez « varier R » ou « varier t » sur les surfaces autorisées à changer et donnez une focale cible (0 = libre). Les moindres carrés amortis (Levenberg–Marquardt) minimisent les écarts des rayons sur le plan image pour chaque champ et chaque longueur d’onde, plus l’écart de focale ; le plan image suit votre choix. On trouve le bon minimum le plus proche, pas le meilleur absolu — le départ compte.', 'Marque «variar R» o «variar t» en las superficies que pueden cambiar y dé una focal objetivo (0 = libre). Los mínimos cuadrados amortiguados (Levenberg–Marquardt) minimizan los errores de rayo en el plano imagen para cada campo y longitud de onda más el error de focal; el plano imagen sigue su elección. Encuentra el buen mínimo más cercano, no el global: el punto de partida importa.', 'Zaznacz „zmieniaj R” lub „zmieniaj t” przy powierzchniach, które mogą się zmieniać, i podaj docelową ogniskową (0 = dowolna). Tłumione najmniejsze kwadraty (Levenberga–Marquardta) minimalizują błędy promieni na płaszczyźnie obrazu dla wszystkich pól i długości fal oraz błąd ogniskowej; płaszczyzna obrazu jest zgodna z Twoim wyborem. Znajdują najbliższe dobre minimum, nie globalne — start ma znaczenie.') },
      tolerance: { title: T('Tolerances (Monte Carlo)', 'Допуски (Монте-Карло)', 'Toleranzen (Monte Carlo)', 'Toleranties (Monte Carlo)', 'Tolérances (Monte-Carlo)', 'Tolerancias (Monte Carlo)', 'Tolerancje (Monte Carlo)'),
        body: T('Each trial builds a lens with random radius errors (± %), thickness errors (± mm) and index errors, normal distribution with the given value as 2σ, refocuses and records the RMS spot. Median and 90 % show what a batch from the shop will do. Decentre and tilt are not modelled in this version; the glass of a perturbed lens keeps its index but loses its dispersion.', 'Кожна спроба будує лінзу з випадковими похибками радіусів (± %), товщин (± мм) і показника заломлення — нормальний розподіл, задане значення = 2σ, — перефокусовує й записує RMS плями. Медіана й 90 % показують, що дасть партія з виробництва. Децентрування й нахил у цій версії не моделюються; скло збуреної лінзи зберігає показник, але втрачає дисперсію.', 'Jeder Versuch baut eine Linse mit zufälligen Radiusfehlern (± %), Dickenfehlern (± mm) und Indexfehlern — Normalverteilung, der Wert gilt als 2σ —, fokussiert nach und notiert den RMS-Fleck. Median und 90 % zeigen, was ein Fertigungslos leistet. Dezentrierung und Kippung sind in dieser Version nicht modelliert; das Glas einer gestörten Linse behält seinen Index, verliert aber die Dispersion.', 'Elke proef bouwt een lens met willekeurige stralenfouten (± %), diktefouten (± mm) en indexfouten — normaalverdeling, de waarde is 2σ —, stelt opnieuw scherp en noteert de RMS-vlek. Mediaan en 90 % tonen wat een productiepartij doet. Decentrering en kanteling zijn in deze versie niet gemodelleerd; het glas van een verstoorde lens houdt zijn index maar verliest zijn dispersie.', 'Chaque tirage construit une lentille avec des erreurs aléatoires de rayon (± %), d’épaisseur (± mm) et d’indice — loi normale, la valeur donnée valant 2σ —, refocalise et note la tache RMS. Médiane et 90 % montrent ce que donnera un lot de fabrication. Décentrement et basculement ne sont pas modélisés dans cette version ; le verre d’une lentille perturbée garde son indice mais perd sa dispersion.', 'Cada prueba construye una lente con errores aleatorios de radio (± %), espesor (± mm) e índice —distribución normal, el valor dado es 2σ—, reenfoca y anota la mancha RMS. La mediana y el 90 % muestran lo que dará un lote del taller. El descentrado y la inclinación no se modelan en esta versión; el vidrio de una lente perturbada conserva su índice pero pierde la dispersión.', 'Każda próba buduje soczewkę z losowymi błędami promieni (± %), grubości (± mm) i współczynnika załamania — rozkład normalny, podana wartość to 2σ — doostrza i zapisuje plamkę RMS. Mediana i 90 % pokazują, co da partia z produkcji. Decentracja i pochylenie nie są w tej wersji modelowane; szkło zaburzonej soczewki zachowuje współczynnik, ale traci dyspersję.') },
      stock: { title: T('Stock lenses', 'Каталожні лінзи', 'Lagerlinsen', 'Voorraadlenzen', 'Lentilles standard', 'Lentes estándar', 'Soczewki katalogowe'),
        body: T('For every glass element the tool finds the catalogue lenses of nearest focal length among 207 Thorlabs parts read from the public catalogue pages (plano-convex, plano-concave, best-form, meniscus, achromats). "Use" replaces the element by the real prescription, "turned round" flips it; the results show at once what the change costs. Undo restores your design.', 'Для кожного скляного елемента інструмент шукає каталожні лінзи з найближчою фокусною відстанню серед 207 деталей Thorlabs з публічних сторінок каталогу (плоско-опуклі, плоско-увігнуті, найкращої форми, меніски, ахромати). «Взяти» замінює елемент справжнім рецептом, «перевернувши» — обертає його; результати одразу показують ціну заміни. «Скасувати» повертає вашу схему.', 'Für jedes Glaselement sucht das Werkzeug die Kataloglinsen mit der nächsten Brennweite unter 207 Thorlabs-Teilen von den öffentlichen Katalogseiten (plankonvex, plankonkav, Bestform, Meniskus, Achromate). „Übernehmen“ ersetzt das Element durch die echte Vorschrift, „umgedreht“ wendet es; die Ergebnisse zeigen sofort, was der Tausch kostet. „Rückgängig“ stellt Ihr Design wieder her.', 'Voor elk glaselement zoekt de tool de cataloguslenzen met de dichtstbijzijnde brandpuntsafstand onder 207 Thorlabs-onderdelen van de openbare catalogus­pagina’s (plan-bol, plan-hol, best-form, meniscus, achromaten). „Gebruiken” vervangt het element door het echte recept, „omgedraaid” keert het om; de resultaten tonen meteen wat de wissel kost. „Ongedaan maken” zet uw ontwerp terug.', 'Pour chaque élément en verre, l’outil cherche les lentilles de focale la plus proche parmi 207 références Thorlabs lues sur les pages publiques du catalogue (plan-convexes, plan-concaves, forme optimale, ménisques, achromats). « Utiliser » remplace l’élément par la vraie formule, « retournée » l’inverse ; les résultats montrent aussitôt ce que coûte le changement. « Annuler » rétablit votre combinaison.', 'Para cada elemento de vidrio, la herramienta busca las lentes de catálogo de focal más cercana entre 207 piezas de Thorlabs leídas en las páginas públicas del catálogo (plano-convexas, plano-cóncavas, de forma óptima, meniscos, acromáticos). «Usar» sustituye el elemento por la prescripción real e «invertida» le da la vuelta; los resultados muestran al instante lo que cuesta el cambio. «Deshacer» restaura su diseño.', 'Dla każdego elementu szklanego narzędzie szuka soczewek katalogowych o najbliższej ogniskowej wśród 207 części Thorlabs z publicznych stron katalogu (płasko-wypukłe, płasko-wklęsłe, o najlepszym kształcie, meniski, achromaty). „Użyj” zastępuje element prawdziwą receptą, „odwróconą” obraca go; wyniki od razu pokazują koszt zamiany. „Cofnij” przywraca Twój projekt.') }
    },
