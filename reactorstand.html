  const tx = (k, lang) => {
    const b = T[k];
    if (!b) return k;
    return b[lang] || b.en;
  };
  const pickL = (block, lang) => {
    if (!block) return '';
    if (typeof block === 'string') return block;
    return block[lang] || block.en || '';
  };
  const fill = (s, args) => s.replace(/\{(\d)\}/g, (m, i) => (args[+i] === undefined ? m : args[+i]));
  const txf = (k, lang, args) => fill(tx(k, lang), args);

  /* =====================================================================
     2. Small numeric helpers
     ===================================================================== */

  const fin = (v) => typeof v === 'number' && Number.isFinite(v);
  const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
  const clamp01 = (v) => clamp(v, 0, 1);

  /** Fixed-point formatting that never depends on the locale. */
  function fmt(v, d) {
    if (!fin(v)) return '—';
    const s = v.toFixed(d === undefined ? 1 : d);
    return s === '-0' || /^-0\.0*$/.test(s) ? s.slice(1) : s;
  }
  /** Engineering-ish: three significant figures, exponent when it is far out. */
  function sig(v, n) {
    if (!fin(v)) return '—';
    if (v === 0) return '0';
    const a = Math.abs(v);
    if (a >= 1e5 || a < 1e-3) {
      const e = Math.floor(Math.log10(a));
      const m = v / Math.pow(10, e);
      return m.toFixed((n || 3) - 1) + '×10' + supNum(e);
    }
    const d = Math.max(0, (n || 3) - 1 - Math.floor(Math.log10(a)));
    return v.toFixed(Math.min(d, 6));
  }
  const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴',
                5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
  const supNum = (e) => String(e).split('').map((c) => SUP[c] || c).join('');

  /** Seconds as a human duration with the unit spelt out in symbols. */
  function dur(s) {
    if (!fin(s) || s <= 0) return '—';
    if (s < 90) return fmt(s, 1) + ' s';
    if (s < 5400) return fmt(s / 60, 1) + ' min';
    if (s < 172800) return fmt(s / 3600, 2) + ' h';
    return fmt(s / 86400, 2) + ' d';
  }

  /* =====================================================================
     3. Complex arithmetic and polynomial roots
     -----------------------------------------------------------------
     Coefficients are DESCENDING, matching plant.linearize().den.
     ===================================================================== */

  const cAdd = (a, b) => [a[0] + b[0], a[1] + b[1]];
  const cSub = (a, b) => [a[0] - b[0], a[1] - b[1]];
  const cMul = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
  function cDiv(a, b) {
    const d = b[0] * b[0] + b[1] * b[1];
    if (d === 0) return [0, 0];
    return [(a[0] * b[0] + a[1] * b[1]) / d, (a[1] * b[0] - a[0] * b[1]) / d];
  }
  const cAbs = (a) => Math.hypot(a[0], a[1]);

  function horner(c, z) {
    let r = [c[0], 0];
    for (let i = 1; i < c.length; i++) r = cAdd(cMul(r, z), [c[i], 0]);
    return r;
  }
  function derivPoly(c) {
    const n = c.length - 1, d = [];
    for (let i = 0; i < n; i++) d.push(c[i] * (n - i));
    return d.length ? d : [0];
  }

  /**
   * Bini's starting points: the upper convex hull of (i, log|a_i|) taken on
   * the ASCENDING coefficients. Each hull edge of horizontal length m carries
   * m roots of modulus exp((y_k - y_{k+1})/m). This is what makes a degree-11
   * polynomial whose roots span nine decades — which is exactly this plant —
   * converge at all.
   */
  function biniStart(c) {
    const n = c.length - 1, a = [];
    for (let i = 0; i <= n; i++) a.push(Math.abs(c[n - i]));
    const pts = [];
    for (let i = 0; i <= n; i++) if (a[i] > 0) pts.push([i, Math.log(a[i])]);
    const h = [];
    for (const pt of pts) {
      while (h.length >= 2) {
        const p1 = h[h.length - 2], p2 = h[h.length - 1];
        const cr = (p2[0] - p1[0]) * (pt[1] - p1[1]) - (p2[1] - p1[1]) * (pt[0] - p1[0]);
        if (cr >= 0) h.pop(); else break;
      }
      h.push(pt);
    }
    const z = [];
    let off = 0.7;
    for (let k = 0; k + 1 < h.length; k++) {
      const m = h[k + 1][0] - h[k][0];
      const r = Math.exp((h[k][1] - h[k + 1][1]) / m);
      for (let j = 0; j < m; j++) {
        const th = 2 * Math.PI * j / m + off;
        z.push([r * Math.cos(th), r * Math.sin(th)]);
      }
      off += 0.31;
    }
    return z;
  }

  /** Aberth-Ehrlich simultaneous iteration. Returns [[re,im], …]. */
  function polyRoots(cIn, maxIt) {
    let c = cIn.slice();
    while (c.length > 1 && c[0] === 0) c.shift();
    let zeroRoots = 0;
    while (c.length > 1 && c[c.length - 1] === 0) { c.pop(); zeroRoots++; }
    if (c.length <= 1) {
      const out = [];
      for (let k = 0; k < zeroRoots; k++) out.push([0, 0]);
      return out;
    }
    const lead = c[0];
    c = c.map((v) => v / lead);
    const d = derivPoly(c);
    const z = biniStart(c);
    const n = z.length;
    const lim = maxIt || 120;
    const done = new Array(n).fill(false);
    for (let it = 0; it < lim; it++) {
      let moved = false;
      for (let i = 0; i < n; i++) {
        if (done[i]) continue;
        const pz = horner(c, z[i]), dz = horner(d, z[i]);
        if (cAbs(dz) === 0) { done[i] = true; continue; }
        const r = cDiv(pz, dz);
        let s = [0, 0];
        for (let j = 0; j < n; j++) {
          if (j === i) continue;
          const dd = cSub(z[i], z[j]);
          if (cAbs(dd) > 0) s = cAdd(s, cDiv([1, 0], dd));
        }
        const den = cSub([1, 0], cMul(r, s));
        const w = cAbs(den) === 0 ? r : cDiv(r, den);
        z[i] = cSub(z[i], w);
        if (cAbs(w) <= 1e-15 * (cAbs(z[i]) + 1e-300)) done[i] = true; else moved = true;
      }
      if (!moved) break;
    }
    /* Conjugate cleanup: pairs that are conjugate to within rounding are
     * snapped so the display does not show 1e-51 as an imaginary part. */
    for (let i = 0; i < n; i++) {
      if (Math.abs(z[i][1]) < 1e-12 * (Math.abs(z[i][0]) + 1e-300)) z[i][1] = 0;
    }
    for (let k = 0; k < zeroRoots; k++) z.push([0, 0]);
    return z;
  }

  /** Relative backward error of a claimed root, for the honesty check. */
  function rootResidual(c, z) {
    const n = c.length - 1;
    let scale = 0;
    const az = cAbs(z);
    for (let i = 0; i <= n; i++) scale += Math.abs(c[i]) * Math.pow(az, n - i);
    const v = cAbs(horner(c, z));
    return scale > 0 ? v / scale : v;
  }

  /**
   * Number of right-half-plane roots by a Routh table.
   *
   * Independent of the factorisation above and about a hundred times cheaper,
   * which is why the map uses it. The variable is rescaled first (s = k z with
   * k the geometric mean of |a_i/a_0|^(1/i)) because the raw coefficients of
   * this plant span fifteen decades and an unscaled table underflows.
   * Returns null when a pivot vanishes — the singular cases the simple table
   * cannot decide are refused rather than guessed.
   */
  function rhpRouth(cIn) {
    let c = cIn.slice();
    while (c.length > 1 && c[0] === 0) c.shift();
    const n = c.length - 1;
    if (n < 1) return 0;
    let lg = 0, m = 0;
    for (let i = 1; i <= n; i++) {
      if (c[i] !== 0) { lg += Math.log(Math.abs(c[i] / c[0])) / i; m++; }
    }
    const k = m ? Math.exp(lg / m) : 1;
    const a = [];
    for (let i = 0; i <= n; i++) a.push(c[i] * Math.pow(k, n - i));
    const sgn = a[0] < 0 ? -1 : 1;
    for (let i = 0; i <= n; i++) a[i] *= sgn;
    const rows = [[], []];
    for (let i = 0; i <= n; i += 2) rows[0].push(a[i]);
    for (let i = 1; i <= n; i += 2) rows[1].push(a[i]);
    while (rows[1].length < rows[0].length) rows[1].push(0);
    for (let r = 2; r <= n; r++) {
      const p1 = rows[r - 2], p2 = rows[r - 1];
      const piv = p2[0];
      if (piv === 0) return null;                 // singular: refuse, do not guess
      const nr = [];
      for (let i = 0; i + 1 < p1.length; i++) {
        const b = p2[i + 1] === undefined ? 0 : p2[i + 1];
        nr.push((piv * p1[i + 1] - p1[0] * b) / piv);
      }
      nr.push(0);
      let mx = 0;
      for (const v of nr) mx = Math.max(mx, Math.abs(v));
      if (mx > 0) for (let i = 0; i < nr.length; i++) nr[i] /= mx;
      rows.push(nr);
    }
    let cnt = 0, prev = rows[0][0];
    for (let r = 1; r <= n; r++) {
      const v = rows[r][0];
      if (v === 0) return null;
      if ((v > 0) !== (prev > 0)) cnt++;
      prev = v;
    }
    return cnt;
  }

  /**
   * Number of right-half-plane roots by the argument principle on the
   * imaginary axis (Mikhailov). Slow — six milliseconds for degree eleven —
   * so it is not on the ten-hertz path; it exists as the third opinion the
   * test harness uses to hold the other two to account.
   */
  function rhpArgument(cIn) {
    let c = cIn.slice();
    while (c.length > 1 && c[0] === 0) c.shift();
    const n = c.length - 1;
    if (n < 1) return { m: 0, count: 0, residual: 0 };
    const ev = (w) => {
      let re = 0, im = 0;
      for (let i = 0; i <= n; i++) {
        const k = n - i, a = c[i], wk = Math.pow(w, k), q = k % 4;
        if (q === 0) re += a * wk; else if (q === 1) im += a * wk;
        else if (q === 2) re -= a * wk; else im -= a * wk;
      }
      return [re, im];
    };
    let cauchy = 0;
    for (let i = 1; i <= n; i++) cauchy = Math.max(cauchy, Math.abs(c[i] / c[0]));
    const wMax = 1e5 * (1 + cauchy);
    const wMin = 1e-12 * (1 + cauchy);
    const grid = [0];
    const N = 900;
    for (let i = 0; i <= N; i++) grid.push(wMin * Math.pow(wMax / wMin, i / N));
    let tot = 0;
    for (let i = 1; i < grid.length; i++) {
      const stack = [[grid[i - 1], grid[i], ev(grid[i - 1]), ev(grid[i])]];
      let guard = 0;
      while (stack.length && guard++ < 4000) {
        const seg = stack.pop();
        let da = Math.atan2(seg[3][1], seg[3][0]) - Math.atan2(seg[2][1], seg[2][0]);
        while (da > Math.PI) da -= 2 * Math.PI;
        while (da < -Math.PI) da += 2 * Math.PI;
        if (Math.abs(da) > Math.PI / 3 && (seg[1] - seg[0]) > 1e-13 * Math.max(1, seg[1])) {
          const xm = seg[0] > 0 ? Math.sqrt(seg[0] * seg[1]) : 0.5 * (seg[0] + seg[1]);
          const vm = ev(xm);
          stack.push([xm, seg[1], vm, seg[3]]);
          stack.push([seg[0], xm, seg[2], vm]);
        } else tot += da;
      }
    }
    /* Analytic tail: arg p(jw) -> n*pi/2 + (sum of roots)/w, and the sum of
     * roots is -a1/a0, so the truncation is corrected exactly to first order. */
    tot += (c[1] / c[0]) / wMax;
    const m = (n - tot / (Math.PI / 2)) / 2;
    return { m, count: Math.round(m), residual: Math.abs(m - Math.round(m)) };
  }

  /* =====================================================================
     4. The physics: rho(n) from the plant's own steady state
     ===================================================================== */

  const TERMS = [
    { key: 'rod',     t: 'tRod',   c: 1 },
    { key: 'xenon',   t: 'tXe',    c: 2 },
    { key: 'doppler', t: 'tDop',   c: 3 },
    { key: 'coolant', t: 'tCool',  c: 4 },
    { key: 'void',    t: 'tVoid',  c: 5 }
  ];

  /**
   * Rod parameters zeroed.
   *
   * plant.equilibrium() computes the four FEEDBACK reactivities from the power
   * alone — xenon from the flux, Doppler and the coolant term from the two-node
   * steady temperatures, void from the boiling closure. Not one of them reads
   * rhoSpan, tipWorth, worthTip or followerWorth. Those parameters only reach
   * rodPosFor(), which, when a tip or a second bank is present, runs a
   * two-thousand-point scan and a bisection to invert a non-monotonic
   * characteristic. Zeroing them removes that scan and changes no number this
   * module uses; the test suite asserts the four terms are bit-identical either
   * way. It buys a factor of three on the whole curve.
   */
  function feedbackParams(p) {
    const q = Object.assign({}, p);
    q.tipWorth = 0; q.worthTip = 0; q.followerWorth = 0;
    return q;
  }

  /* Parameters that reach ONLY rodPosFor / rodWorth and therefore cannot move
   * a single feedback reactivity or a single coefficient of the linearised
   * denominator. Everything NOT on this list is part of the cache key, so a
   * new feedback parameter appearing in the plant invalidates the cache by
   * default instead of silently going stale. The test suite asserts the list
   * by perturbing each key and demanding bit-identical feedback terms. */
  const ROD_ONLY_KEYS = ['rhoSpan', 'tipWorth', 'tipLen', 'worthTip',
                         'followerWorth', 'followerLen', 'loopBank', 'uPark',
                         'marginPcm'];

  const FB_CACHE = [];
  const FB_CACHE_MAX = 4;

  function fbCacheKey(p, io, nMax, N) {
    let s = 'T' + io.Tin + ';W' + io.flow + ';M' + nMax + ';N' + N;
    const keys = Object.keys(p).sort();
    for (const k of keys) {
      if (ROD_ONLY_KEYS.indexOf(k) >= 0) continue;
      const v = p[k];
      s += ';' + k + '=' + (v && typeof v === 'object' ? JSON.stringify(v) : v);
    }
    return s;
  }

  /**
   * The four feedback reactivities and the steady core state, sampled on the
   * power grid. Cached: while the operator drags a rod, not one number in here
   * changes — only the constant the rods add — so the whole curve is a shift.
   */
  function feedbackCurve(plant, p, io, nMax, N) {
    const key = fbCacheKey(p, io, nMax, N);
    for (let i = 0; i < FB_CACHE.length; i++) {
      if (FB_CACHE[i].key === key) {
        const hit = FB_CACHE.splice(i, 1)[0];
        FB_CACHE.unshift(hit);
        hit.hits++;
        return hit;
      }
    }
    const pf = feedbackParams(p);
    const c = {
      key, hits: 0, pf,
      n: new Float64Array(N + 1),
      xenon: new Float64Array(N + 1), doppler: new Float64Array(N + 1),
      coolant: new Float64Array(N + 1), void: new Float64Array(N + 1),
      sum: new Float64Array(N + 1),
      Tf: new Float64Array(N + 1), Tc: new Float64Array(N + 1),
      Tout: new Float64Array(N + 1), voidFrac: new Float64Array(N + 1),
      quality: new Float64Array(N + 1), boiling: new Uint8Array(N + 1),
      betaEff: 0, Lambda: 0, boilOnset: null
    };
    for (let i = 0; i <= N; i++) {
      const ni = nMax * i / N;
      c.n[i] = ni;
      const f = feedbackAt(plant, pf, io, ni);
      c.xenon[i] = f.xenon; c.doppler[i] = f.doppler;
      c.coolant[i] = f.coolant; c.void[i] = f.void; c.sum[i] = f.sum;
      c.Tf[i] = f.Tf; c.Tc[i] = f.Tc; c.Tout[i] = f.Tout;
      c.voidFrac[i] = f.voidFrac; c.quality[i] = f.quality;
      c.boiling[i] = f.boiling ? 1 : 0;
      if (f.boiling && c.boilOnset === null && i > 0) c.boilOnset = ni;
      if (i === 0) { c.betaEff = f.betaEff; c.Lambda = f.Lambda; }
    }
    FB_CACHE.unshift(c);
    while (FB_CACHE.length > FB_CACHE_MAX) FB_CACHE.pop();
    return c;
  }

  function ioOf(plant, p, opts) {
    const d = (opts && opts.d) || {};
    const pv = plant.params || [];
    const def = (k, f) => {
      const q = pv.find((x) => x.key === k);
      return q ? q.def : f;
    };
    const Tin = fin(d.Tin) ? d.Tin : (fin(p.Tin0) ? p.Tin0 : def('Tin0', 290));
    const flow = fin(d.flow) ? d.flow : (fin(p.flow) ? p.flow : def('flow', 1));
    return { Tin, flow };
  }

  /** Total rod reactivity for the position given, in pcm. */
  function rodPcmOf(plant, p, u) {
    if (u === undefined || u === null) {
      const park = plant.parkPos ? plant.parkPos(p) : 1;
      u = { reg: park, tipd: park };
    }
    return plant.rodWorthTotal(u, p);
  }

  /**
   * The four feedback reactivities and the steady core state at power n.
   * Everything comes from plant.equilibrium; nothing is recomputed here.
   */
  function feedbackAt(plant, pf, io, n) {
    const e = plant.equilibrium(pf, n * 100, io);
    return {
      xenon: e.rhoXe, doppler: e.rhoDoppler, coolant: e.rhoCoolant, void: e.rhoVoid,
      sum: e.rhoXe + e.rhoDoppler + e.rhoCoolant + e.rhoVoid,
      Tf: e.Tf, Tc: e.Tc, Tout: e.Tout, Tout1: e.ToutSinglePhase,
      boiling: e.boiling, voidFrac: e.voidFrac, quality: e.quality,
      X: e.Xeq, betaEff: e.betaEff, Lambda: e.Lambda
    };
  }

  /**
   * Poles of the linearisation at power n.
   *
   * plant.linearize takes the inlet temperature from p.Tin0 and the flow from
   * op.flow, so the parameter set is copied with the CURRENT inlet temperature
   * written into Tin0 — otherwise the linearisation would sit at a different
   * operating point from the curve, which is the one mistake that would make
   * the two stability verdicts incomparable.
   */
  function polesAt(plant, p, io, n) {
    const pl = Object.assign({}, p, { Tin0: io.Tin, flow: io.flow });
    let den;
    try {
      den = plant.linearize(pl, { n, flow: io.flow }, 'power').den;
    } catch (e) {
      return { ok: false, error: e && (e.code || e.message) };
    }
    const roots = polyRoots(den, 150);
    roots.sort((a, b) => b[0] - a[0]);
    let worstRes = 0;
    for (const r of roots) worstRes = Math.max(worstRes, rootResidual(den, r));
    const rhp = roots.filter((r) => r[0] > 0).length;
    const routh = rhpRouth(den);
    const dominant = roots.length ? roots[0] : null;
    return {
      ok: true, den, roots, rhp, routh,
      agree: routh === null ? null : routh === rhp,
      residual: worstRes, dominant
    };
  }

  /**
   * EQ.locus — the curve, its zeros, and what each zero is.
   *
   * opts: { u, d:{Tin,flow}, nMax, samples, poles, refine }
   */
  function locus(plant, p, opts) {
    const t0 = now();
    const o = opts || {};
    const io = ioOf(plant, p, o);
    const nMax = fin(o.nMax) && o.nMax > 0 ? o.nMax : 1.6;
    const N = Math.max(24, Math.min(1200, o.samples || 240));
    const wantPoles = o.poles !== false;
    const fb = feedbackCurve(plant, p, io, nMax, N);
    const pf = fb.pf;
    const rod = rodPcmOf(plant, p, o.u);
    const cached = fb.hits > 0;

    const n = fb.n;
    const terms = { rod: new Float64Array(N + 1), xenon: fb.xenon,
                    doppler: fb.doppler, coolant: fb.coolant, void: fb.void };
    const total = new Float64Array(N + 1);
    const betaEff = fb.betaEff, Lambda = fb.Lambda, boilOnset = fb.boilOnset;
    let rhoMin = Infinity, rhoMax = -Infinity, iMin = 0, iMax = 0;

    for (let i = 0; i <= N; i++) {
      terms.rod[i] = rod;
      total[i] = rod + fb.sum[i];
      if (total[i] < rhoMin) { rhoMin = total[i]; iMin = i; }
      if (total[i] > rhoMax) { rhoMax = total[i]; iMax = i; }
    }
    const Tf = fb.Tf, Tc = fb.Tc, Tout = fb.Tout, vf = fb.voidFrac;
    const qual = fb.quality, boiling = fb.boiling;

    const rhoAt = (x) => rod + feedbackAt(plant, pf, io, x).sum;

    /* ---- zero crossings ---- */
    const cand = [];
    for (let i = 0; i < N; i++) {
      const a = total[i], b = total[i + 1];
      /* A sample that lands exactly on zero is a root in its own right and is
       * NOT also a sign change: counting it twice would report two equilibria
       * a rounding apart, which is exactly the sort of lie this panel exists
       * to avoid. Zero at n = 0 is left out — see the caveat about the floor. */
      if (a === 0) { if (i > 0) cand.push(n[i]); continue; }
      if (b === 0) continue;                       // picked up on the next step
      if ((a > 0) === (b > 0)) continue;
      let lo = n[i], hi = n[i + 1], flo = a;
      for (let k = 0; k < 60; k++) {
        const m = 0.5 * (lo + hi), fm = rhoAt(m);
        if (fm === 0) { lo = hi = m; break; }
        if ((fm > 0) === (flo > 0)) { lo = m; flo = fm; } else hi = m;
      }
      cand.push(0.5 * (lo + hi));
    }
    if (total[N] === 0) cand.push(n[N]);
    /* Belt and braces: merge anything closer together than a millionth of the
     * domain. Two genuine equilibria that close are not resolvable on this
     * grid and claiming them would be an invention. */
    cand.sort((a, b) => a - b);
    const roots = [];
    const tolDup = 1e-6 * nMax;
    for (const c of cand) {
      if (!roots.length || c - roots[roots.length - 1] > tolDup) roots.push(c);
    }

    /* ---- what each root is ---- */
    const out = [];
    for (const nr of roots) {
      out.push(classify(plant, p, pf, io, rod, nr, wantPoles, betaEff));
    }

    /* ---- the band the loop bank can hold ---- */
    const reach = reachBand(plant, p, pf, io, o.u, nMax, N);

    /* ---- no equilibrium: say which way ---- */
    let none = null;
    if (out.length === 0) {
      none = {
        reason: rhoMax < 0 ? 'low' : (rhoMin > 0 ? 'high' : 'grid'),
        rhoMin, rhoMax, nAtMin: n[iMin], nAtMax: n[iMax]
      };
    }

    /* ---- which contribution moves fastest, per sample ---- */
    const rule = new Int8Array(N + 1);
    for (let i = 0; i <= N; i++) {
      const j = Math.min(N - 1, Math.max(0, i - (i === N ? 1 : 0)));
      let best = -1, bv = -1;
      for (let k = 1; k < TERMS.length; k++) {
        const key = TERMS[k].key;
        const d = Math.abs(terms[key][j + 1] - terms[key][j]);
        if (d > bv) { bv = d; best = k; }
      }
      rule[i] = bv > 1e-12 ? best : -1;
    }

    return {
      version: VERSION, ok: true,
      io, nMax, samples: N, rodPcm: rod, betaEff, Lambda,
      n, terms, total, rule,
      core: { Tf, Tc, Tout, voidFrac: vf, quality: qual, boiling },
      rhoMin, rhoMax, nAtMin: n[iMin], nAtMax: n[iMax],
      boilOnset, boilModelled: fin(p.Tsat) && p.Tsat > 0,
      roots: out, none, reach, cachedFeedback: cached,
      cost: now() - t0
    };
  }

  /** Everything this module can say about one crossing. */
  function classify(plant, p, pf, io, rod, nr, wantPoles, betaEff) {
    const h = Math.max(1e-5, 1e-4 * Math.max(nr, 0.01));
    const fAt = (x) => feedbackAt(plant, pf, io, Math.max(x, 0));
    const fm = fAt(nr - h), fp = fAt(nr + h), f0 = fAt(nr);
    const slopes = {};
    for (const t of TERMS) {
      if (t.key === 'rod') { slopes.rod = 0; continue; }
      slopes[t.key] = (fp[t.key] - fm[t.key]) / (2 * h);
    }
    const alphaP = (fp.sum - fm.sum) / (2 * h);
    const dLo = (f0.sum - fm.sum) / h, dHi = (fp.sum - f0.sum) / h;
    const kink = Math.abs(dHi - dLo) > 0.2 * Math.max(Math.abs(dLo), Math.abs(dHi), 1e-9);

    const marg = 1e-3 * Math.max(1, Math.abs(alphaP));
    const byPower = Math.abs(alphaP) <= marg ? 'marginal' : (alphaP < 0 ? 'stable' : 'unstable');

    const r = {
      n: nr, pct: nr * 100,
      Tf: f0.Tf, Tc: f0.Tc, Tout: f0.Tout, voidFrac: f0.voidFrac,
      quality: f0.quality, boiling: f0.boiling,
      rodPcm: rod, terms: { rod, xenon: f0.xenon, doppler: f0.doppler,
                            coolant: f0.coolant, void: f0.void },
      alphaP, alphaPct: alphaP / 100, slopes,
      alphaDollarPerPct: betaEff > 0 ? (alphaP / 100) * 1e-5 / betaEff : NaN,
      slopeLo: dLo, slopeHi: dHi, kink,
      byPower, poles: null, byPoles: 'unknown', agree: null,
      eFold: null, period: null, rhp: null
    };
    if (!wantPoles) return r;

    const pr = polesAt(plant, p, io, nr);
    if (!pr.ok) { r.poleError = pr.error; return r; }
    r.poles = pr.roots; r.rhp = pr.rhp; r.routh = pr.routh;
    r.polesAgree = pr.agree; r.poleResidual = pr.residual;
    const dom = pr.dominant;
    r.dominant = dom;
    const tolRe = 1e-9;
    r.byPoles = !dom ? 'unknown'
              : (dom[0] > tolRe ? 'unstable' : (dom[0] < -tolRe ? 'stable' : 'marginal'));
    if (dom) {
      r.eFold = dom[0] !== 0 ? 1 / Math.abs(dom[0]) : Infinity;
      r.period = Math.abs(dom[1]) > 0 ? 2 * Math.PI / Math.abs(dom[1]) : null;
    }
    r.agree = (r.byPoles === 'unknown') ? null : (r.byPoles === r.byPower);
    return r;
  }

  /**
   * Powers the loop bank can hold with its stroke, at this flow.
   * The other bank stands where it stands — the same convention
   * plant.equilibrium() uses.
   */
  function reachBand(plant, p, pf, io, u, nMax, N) {
    const loop = plant.loopBankId ? plant.loopBankId(p) : 'reg';
    const park = plant.parkPos ? plant.parkPos(p) : 1;
    const base = (u && typeof u === 'object') ? { reg: u.reg, tipd: u.tipd }
               : { reg: fin(u) ? u : park, tipd: park };
    let lo = Infinity, hi = -Infinity;
    const M = 200;
    for (let k = 0; k <= M; k++) {
      const q = { reg: base.reg, tipd: base.tipd };
      q[loop] = k / M;
      const w = plant.rodWorthTotal(q, p);
      if (w < lo) lo = w;
      if (w > hi) hi = w;
    }
    /* demand(n) = -(sum of feedback); reachable when demand is inside [lo,hi] */
    let nLo = null, nHi = null, any = false;
    const K = Math.max(60, Math.min(N, 160));
    for (let i = 0; i <= K; i++) {
      const ni = nMax * i / K;
      const dem = -feedbackAt(plant, pf, io, ni).sum;
      const ok = dem >= lo - 1e-9 && dem <= hi + 1e-9;
      if (ok) { any = true; if (nLo === null) nLo = ni; nHi = ni; }
    }
    return { bank: loop, worthMin: lo, worthMax: hi, any, nLo, nHi, other: base };
  }

  /* =====================================================================
     5. EQ.map — equilibria over two axes
     ===================================================================== */

  /** Axis definitions built from the plant's OWN parameter register. */
  function axisList(plant) {
    const P = plant.params || [];
    const find = (k) => P.find((q) => q.key === k);
    const out = [];
    const push = (key, kind, lo, hi, unit, label) => {
      if (!fin(lo) || !fin(hi) || lo === hi) return;
      out.push({ key, kind, lo, hi, unit: unit || '-', label });
    };
    const dv = (plant.disturbance && plant.disturbance.variants) || [];
    const vFlow = dv.find((v) => v.key === 'flow');
    const vTin = dv.find((v) => v.key === 'Tin');
    if (vFlow) push('flow', 'io', vFlow.min, vFlow.max, vFlow.unit, vFlow.label);
    const banks = plant.rodBanks || [];
    for (const b of banks) push('u:' + b.id, 'u', 0, 1, '-', b.label);
    if (vTin) push('Tin', 'io', vTin.min, vTin.max, vTin.unit, vTin.label);
    for (const key of ['alphaD', 'alphaC', 'alphaVoid', 'phiNom', 'enrichment',
                       'rhoSpan', 'dTcool', 'Tsat', 'marginPcm']) {
      const q = find(key);
      if (q) push(key, 'p', q.min, q.max, q.unit, q.label);
    }
    return out;
  }

  const CLS = ['stable', 'osc', 'unstable', 'low', 'high', 'err'];

  /**
   * EQ.map(plant, p, opts)
   * opts: { x, y, nx, ny, u, d, nMax, samples, nearPower, budgetMs, job }
   *
   * Returns a job object when opts.chunked is set — the live panel drives it a
   * few milliseconds at a time so the ten-hertz frame never carries the whole
   * grid. Otherwise it runs to completion and returns the finished map.
   */
  function map(plant, p, opts) {
    const job = mapJob(plant, p, opts);
    while (!job.done) job.work(Infinity);
    return job.result;
  }

  function mapJob(plant, p, opts) {
    const o = opts || {};
    const axes = axisList(plant);
    const pick = (k, dflt) => axes.find((a) => a.key === k) || axes.find((a) => a.key === dflt) || axes[0];
    const ax = pick(o.x, 'flow');
    const ay = pick(o.y, 'u:reg');
    const nx = Math.max(4, Math.min(48, o.nx || 20));
    const ny = Math.max(4, Math.min(48, o.ny || 14));
    const nMax = fin(o.nMax) && o.nMax > 0 ? o.nMax : 1.6;
    const samples = Math.max(16, Math.min(200, o.samples || 56));
    const near = fin(o.nearPower) ? o.nearPower : 1;
    const io0 = ioOf(plant, p, o);
    const park = plant.parkPos ? plant.parkPos(p) : 1;
    const u0 = (o.u && typeof o.u === 'object') ? { reg: o.u.reg, tipd: o.u.tipd }
             : { reg: fin(o.u) ? o.u : park, tipd: park };

    const xs = [], ys = [];
    for (let i = 0; i < nx; i++) xs.push(ax.lo + (ax.hi - ax.lo) * (nx === 1 ? 0 : i / (nx - 1)));
    for (let j = 0; j < ny; j++) ys.push(ay.lo + (ay.hi - ay.lo) * (ny === 1 ? 0 : j / (ny - 1)));

    const cells = new Array(nx * ny).fill(null);
    let cursor = 0;
    const t0 = now();
    let spent = 0;

    function apply(v, axis, ctx) {
      if (axis.kind === 'io') ctx.io[axis.key] = v;
      else if (axis.kind === 'u') ctx.u[axis.key.slice(2)] = v;
      else ctx.p[axis.key] = v;
    }

    function cellAt(i, j) {
      const ctx = { p: Object.assign({}, p), io: { Tin: io0.Tin, flow: io0.flow },
                    u: { reg: u0.reg, tipd: u0.tipd } };
      apply(xs[i], ax, ctx);
      apply(ys[j], ay, ctx);
      try {
        const pf = feedbackParams(ctx.p);
        const rod = plant.rodWorthTotal(ctx.u, ctx.p);
        let prev = rod + feedbackAt(plant, pf, ctx.io, 0).sum;
        let lo = prev, hi = prev;
        const crossings = [];
        for (let k = 1; k <= samples; k++) {
          const nk = nMax * k / samples;
          const v = rod + feedbackAt(plant, pf, ctx.io, nk).sum;
          if (v < lo) lo = v;
          if (v > hi) hi = v;
          if ((v > 0) !== (prev > 0)) {
            let a = nMax * (k - 1) / samples, b = nk, fa = prev;
            for (let q = 0; q < 40; q++) {
              const m = 0.5 * (a + b);
              const fm = rod + feedbackAt(plant, pf, ctx.io, m).sum;
              if ((fm > 0) === (fa > 0)) { a = m; fa = fm; } else b = m;
            }
            crossings.push(0.5 * (a + b));
          }
          prev = v;
        }
        if (!crossings.length) {
          return { cls: hi < 0 ? 'low' : (lo > 0 ? 'high' : 'err'),
                   count: 0, x: xs[i], y: ys[j] };
        }
        let best = crossings[0];
        for (const c of crossings) if (Math.abs(c - near) < Math.abs(best - near)) best = c;
        const hh = Math.max(1e-5, 1e-4 * Math.max(best, 0.01));
        const a1 = feedbackAt(plant, pf, ctx.io, Math.max(best - hh, 0)).sum;
        const a2 = feedbackAt(plant, pf, ctx.io, best + hh).sum;
        const alphaP = (a2 - a1) / (2 * hh);
        const byPower = alphaP < 0 ? 'stable' : 'unstable';
        let rhp = null;
        try {
          const pl = Object.assign({}, ctx.p, { Tin0: ctx.io.Tin, flow: ctx.io.flow });
          rhp = rhpRouth(plant.linearize(pl, { n: best, flow: ctx.io.flow }, 'power').den);
        } catch (e) { rhp = null; }
        const byPoles = rhp === null ? 'unknown' : (rhp > 0 ? 'unstable' : 'stable');
        let cls;
        if (byPoles === 'unknown') cls = byPower === 'stable' ? 'stable' : 'unstable';
        else if (byPoles === 'stable' && byPower === 'stable') cls = 'stable';
        else if (byPoles === 'unstable' && byPower === 'stable') cls = 'osc';
        else cls = 'unstable';
        return { cls, count: crossings.length, n: best, alphaP, rhp,
                 byPower, byPoles, x: xs[i], y: ys[j] };
      } catch (e) {
        return { cls: 'err', count: 0, error: e && (e.code || e.message),
                 x: xs[i], y: ys[j] };
      }
    }

    const jobObj = {
      done: false, progress: 0, result: null,
      axes: { x: ax, y: ay }, nx, ny, xs, ys, cells,
      work(budgetMs) {
        if (jobObj.done) return jobObj;
        const start = now();
        while (cursor < nx * ny) {
          const i = cursor % nx, j = (cursor / nx) | 0;
          cells[cursor] = cellAt(i, j);
          cursor++;
          if (now() - start >= budgetMs) break;
        }
        spent += now() - start;
        jobObj.progress = cursor / (nx * ny);
        if (cursor >= nx * ny) {
          jobObj.done = true;
          const tally = {};
          for (const c of CLS) tally[c] = 0;
          for (const c of cells) if (c) tally[c.cls]++;
          jobObj.result = {
            version: VERSION, axes: { x: ax, y: ay }, nx, ny, xs, ys, cells,
            tally, nMax, samples, near, cost: spent, wall: now() - t0
          };
        }
        return jobObj;
      }
    };
    return jobObj;
  }

  const now = () => (typeof performance !== 'undefined' && performance.now
                     ? performance.now() : Date.now());

  /* Milliseconds of map work per update(), and how long the knobs must sit
     still before a rebuild is started at all. Both are budget, not physics. */
  const MAP_BUDGET_MS = 6;
  const MAP_SETTLE_MS = 250;

  /* =====================================================================
     6. Drawing — plain SVG strings, no library, no DOM outside the host
     ===================================================================== */

  const esc = (s) => String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  const COLORS = ['var(--eq-c0)', 'var(--eq-c1)', 'var(--eq-c2)',
                  'var(--eq-c3)', 'var(--eq-c4)', 'var(--eq-c5)'];
  const DASH = ['', '6 3', '2 3', '9 3 2 3', '4 2 1 2', '1 3'];

  function pathOf(xs, ys, sx, sy) {
    let d = '', pen = false;
    for (let i = 0; i < xs.length; i++) {
      const X = sx(xs[i]), Y = sy(ys[i]);
      if (!fin(X) || !fin(Y)) { pen = false; continue; }
      d += (pen ? 'L' : 'M') + X.toFixed(2) + ' ' + Y.toFixed(2) + ' ';
      pen = true;
    }
    return d.trim();
  }

  /* A signed logarithmic map, so poles nine decades apart share one axis. */
  function symlog(v, lin) {
    const s = v < 0 ? -1 : 1, a = Math.abs(v);
    return s * Math.log10(1 + a / lin);
  }

  /* =====================================================================
     7. mount()
     ===================================================================== */

  let SEQ = 0;

  const STYLE_ID = 'eq-style-v1';

    '.eq summary:focus-visible{outline:2px solid var(--acc,#0f7b8a);outline-offset:2px}',
    '.eq details p{margin:6px 0 0;line-height:1.55;color:var(--ink2,#5b6b7c)}',
    '.eq-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;',
    'clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}',

    'font-size:12px;color:var(--eq-bad)}'
  ].join('');

  /* The stylesheet goes INSIDE the container, not into <head>: "no DOM
   * outside the container" is then literally true, there is no exception to
   * declare, and destroy() — which simply empties the container — leaves
   * nothing behind. The live stand does the same with its own. */

  function mount(el, opts) {
    if (!el || !el.ownerDocument) throw new Error('EQ.mount: no container');
    const o = opts || {};
    const plant = o.plant;
    if (!plant || typeof plant.equilibrium !== 'function'
        || typeof plant.linearize !== 'function') {
      throw new Error('EQ.mount: plant does not look like PLANT_REACTOR');
    }
    const inst = new Panel(el, plant, o);
    return {
      update(state) { return inst.update(state); },
      setLang(l) { return inst.setLang(l); },
      locus() { return inst.lastLocus; },
      map() { return inst.mapResult; },
      mapFresh() { return !!(inst.mapResult && !inst.mapResult.stale); },
      cost() { return { frame: inst.costFrame, locus: inst.costLocus,
                        render: inst.costRender, map: inst.costMap,
                        frames: inst.frames, worst: inst.costWorst }; },
      destroy() { return inst.destroy(); }
    };
  }

  const H = (lvl, cls, id, txt) =>
    '<h' + lvl + (cls ? ' class="' + cls + '"' : '') + (id ? ' id="' + id + '"' : '') +
    '>' + txt + '</h' + lvl + '>';

  class Panel {
    constructor(el, plant, o) {
      this.el = el;
      this.plant = plant;
      this.lang = LANGS.indexOf(o.lang) >= 0 ? o.lang : 'en';
      this.hl = Math.min(6, Math.max(2, o.headingLevel || 4));
      this.id = 'eq' + (++SEQ);
      this.nMax = fin(o.nMax) ? o.nMax : 1.6;
      this.samples = o.samples || 240;
      this.axes = axisList(plant);
      this.mapX = (this.axes.find((a) => a.key === 'flow') || this.axes[0]).key;
      this.mapY = (this.axes.find((a) => a.key === 'u:reg')
                   || this.axes[1] || this.axes[0]).key;
      this.sigKey = null;
      this.mapKey = null;
      this.mapJobObj = null;
      this.mapResult = null;
      this.mapPending = null;
      this.lastLocus = null;
      this.featured = 0;
      this.state = null;
      this.err = null;
      this.frames = 0;
      this.costFrame = 0; this.costLocus = 0; this.costRender = 0;
      this.costMap = 0; this.costWorst = 0;
      this.destroyed = false;
      this.build();
    }

    /* ---------------- markup ---------------- */
    build() {
      const id = this.id, hl = this.hl;
      this.el.classList.add('eq');
      this.el.innerHTML =
        '<style data-eq-style="' + STYLE_ID + '">' + CSS + '</style>' +
        '<div data-k="err" class="eq-err" hidden></div>' +
        '<p class="eq-sub" data-k="subtitle"></p>' +
        '<div data-k="verdict"></div>' +
        '<div class="eq-grid">' +
          '<div>' +
            H(hl, 'eq-h', id + '-hl', '') +
            '<svg data-k="locus" role="img" aria-labelledby="' + id + '-lt ' + id + '-ld" ' +
              'viewBox="0 0 760 368" preserveAspectRatio="xMidYMid meet">' +
              '<title id="' + id + '-lt"></title><desc id="' + id + '-ld"></desc>' +
              '<g data-k="locusg"></g></svg>' +
            '<ul class="eq-legend" data-k="legend"></ul>' +
            '<p class="eq-foot" data-k="nownote"></p>' +
          '</div>' +
          '<div>' +
            H(hl, 'eq-h', id + '-hs', '') +
            '<svg data-k="slopes" role="img" aria-labelledby="' + id + '-st ' + id + '-sd" ' +
              'viewBox="0 0 500 210" preserveAspectRatio="xMidYMid meet">' +
              '<title id="' + id + '-st"></title><desc id="' + id + '-sd"></desc>' +
              '<g data-k="slopesg"></g></svg>' +
            H(hl, 'eq-h', id + '-hp', '') +
            '<svg data-k="poles" role="img" aria-labelledby="' + id + '-pt ' + id + '-pd" ' +
              'viewBox="0 0 420 234" preserveAspectRatio="xMidYMid meet">' +
              '<title id="' + id + '-pt"></title><desc id="' + id + '-pd"></desc>' +
              '<g data-k="polesg"></g></svg>' +
            '<p class="eq-foot" data-k="polefoot"></p>' +
          '</div>' +
        '</div>' +
        H(hl, 'eq-h', id + '-hm', '') +
        '<div class="eq-ctl">' +
          '<label for="' + id + '-mx"><span data-k="lx"></span>' +
            '<select id="' + id + '-mx" data-k="mx"></select></label>' +
          '<label for="' + id + '-my"><span data-k="ly"></span>' +
            '<select id="' + id + '-my" data-k="my"></select></label>' +
          '<span class="eq-foot" data-k="mprog"></span>' +
        '</div>' +
        '<svg data-k="map" role="img" aria-labelledby="' + id + '-mt ' + id + '-md" ' +
          'viewBox="0 0 760 430" preserveAspectRatio="xMidYMid meet">' +
          '<title id="' + id + '-mt"></title><desc id="' + id + '-md"></desc>' +
          '<g data-k="mapg"></g></svg>' +
        '<ul class="eq-legend" data-k="mlegend"></ul>' +
        '<p class="eq-foot" data-k="mnote"></p>' +
        '<details data-k="numbers"><summary data-k="numsum"></summary>' +
          '<div data-k="numbody"></div></details>' +
        '<details data-k="caveats"><summary data-k="cavsum"></summary>' +
          '<div data-k="cavbody"></div></details>' +
        '<p class="eq-foot" data-k="cost"></p>';

      const q = (k) => this.el.querySelector('[data-k="' + k + '"]');
      this.n = {};
      for (const k of ['err', 'subtitle', 'verdict', 'locus', 'locusg', 'legend', 'nownote',
                       'slopes', 'slopesg', 'poles', 'polesg', 'polefoot',
                       'mx', 'my', 'lx', 'ly', 'mprog', 'map', 'mapg', 'mlegend', 'mnote',
                       'numbers', 'numsum', 'numbody', 'caveats', 'cavsum', 'cavbody', 'cost']) {
        this.n[k] = q(k);
      }
      this.n.hl = this.el.querySelector('#' + id + '-hl');
      this.n.hs = this.el.querySelector('#' + id + '-hs');
      this.n.hp = this.el.querySelector('#' + id + '-hp');
      this.n.hm = this.el.querySelector('#' + id + '-hm');

      this.onAxis = () => {
        this.mapX = this.n.mx.value;
        this.mapY = this.n.my.value;
        this.mapKey = null;
        this.mapResult = null;
        this.mapJobObj = null;
        if (this.state) this.update(this.state);
      };
      this.n.mx.addEventListener('change', this.onAxis);
      this.n.my.addEventListener('change', this.onAxis);
      this.relabel();
    }

    relabel() {
      const lg = this.lang, n = this.n;
      n.subtitle.textContent = tx('subtitle', lg);
      n.hl.textContent = tx('locusHdr', lg);
      n.hs.textContent = tx('slopeHdr', lg);
      n.hp.textContent = tx('polesHdr', lg);
      n.hm.textContent = tx('mapHdr', lg);
      n.lx.textContent = tx('mapXaxis', lg);
      n.ly.textContent = tx('mapYaxis', lg);
      n.numsum.textContent = tx('numbers', lg);
      n.cavsum.textContent = tx('caveats', lg);
      n.mnote.textContent = tx('mapNote', lg);
      n.nownote.textContent = tx('nowNote', lg);
      const opts = this.axes.map((a) =>
        '<option value="' + esc(a.key) + '">' + esc(pickL(a.label, lg)) +
        (a.unit && a.unit !== '-' ? ' [' + esc(a.unit) + ']' : '') + '</option>').join('');
      n.mx.innerHTML = opts; n.my.innerHTML = opts;
      n.mx.value = this.mapX; n.my.value = this.mapY;
      n.legend.innerHTML = TERMS.map((t, i) =>
        '<li><span class="eq-sw" style="border-top-color:' + COLORS[i + 1] +
        (DASH[i + 1] ? ';border-top-style:dashed' : '') + '"></span>' +
        esc(tx(t.t, lg)) + '</li>').join('') +
        '<li><span class="eq-sw" style="border-top-color:' + COLORS[0] +
        ';border-top-width:4px"></span><strong>' + esc(tx('tTot', lg)) + '</strong></li>';
      const MC = { stable: 'var(--eq-ok)', osc: 'var(--eq-warn)', unstable: 'var(--eq-bad)',
                   low: 'var(--eq-c1)', high: 'var(--eq-c2)', err: 'var(--line,#dde3ea)' };
      const ML = { stable: 'clsStable', osc: 'clsOsc', unstable: 'clsUnstable',
                   low: 'clsLow', high: 'clsHigh', err: 'clsErr' };
      const MK = { stable: 'S', osc: 'O', unstable: 'U', low: '−', high: '+', err: '?' };
      n.mlegend.innerHTML = CLS.map((c) =>
        '<li><span class="eq-sw box" style="background:' + MC[c] + '"></span>' +
        '<strong>' + MK[c] + '</strong> ' + esc(tx(ML[c], lg)) + '</li>').join('');
      this.MC = MC; this.MK = MK; this.ML = ML;
      this.renderCaveats();
      /* The map carries axis titles taken from the plant's own registers, so
         it has to be redrawn on a language change like everything else. */
      if (this.lastLocus) this.renderAll(!!this.mapResult);
    }

    renderCaveats() {
      const lg = this.lang, P = this.plant;
      let h = '<p>' + esc(tx('caveatPoint', lg)) + '</p>'
            + '<p>' + esc(tx('caveatZero', lg)) + '</p>'
            + '<p>' + esc(tx('caveatMethod', lg)) + '</p>';
      const lim = P.integrator && P.integrator.limits;
      if (lim) h += '<p><strong>' + esc(tx('plantLimits', lg)) + '.</strong> '
                  + esc(pickL(lim, lg)) + '</p>';
      const cav = P.presets && P.presets.reactorCaveat;
      if (cav) h += '<p><strong>' + esc(tx('presetCaveat', lg)) + '.</strong> '
                  + esc(pickL(cav, lg)) + '</p>';
      this.n.cavbody.innerHTML = h;
    }

    setLang(l) {
      if (LANGS.indexOf(l) < 0 || l === this.lang) return this;
      this.lang = l;
      this.relabel();
      return this;
    }

    destroy() {
      if (this.destroyed) return null;
      this.destroyed = true;
      if (this.n && this.n.mx) this.n.mx.removeEventListener('change', this.onAxis);
      if (this.n && this.n.my) this.n.my.removeEventListener('change', this.onAxis);
      this.el.innerHTML = '';
      this.el.classList.remove('eq');
      this.n = null; this.mapJobObj = null; this.lastLocus = null;
      return null;
    }

    /* ---------------- the ten-hertz entry point ---------------- */
    update(state) {
      if (this.destroyed) return this;
      const t0 = now();
      try {
        this.state = state || null;
        const s = this.state;
        const p = (s && s.params) || this.plant.defaults();
        const u = (s && s.u) || undefined;
        const d = (s && s.d) || undefined;
        const key = this.signature(p, u, d);
        let recomputed = false;
        if (key !== this.sigKey) {
          const t1 = now();
          this.lastLocus = locus(this.plant, p, {
            u, d, nMax: this.nMax, samples: this.samples, poles: true });
          this.costLocus = now() - t1;
          this.sigKey = key;
          recomputed = true;
          this.featured = this.pickFeatured();
        }
        this.driveMap(p, u, d);
        const t2 = now();
        if (recomputed || this.mapDirty) {
          this.renderAll(this.mapDirty || !this.mapDrawn);
          this.mapDrawn = true;
          this.mapDirty = false;
        } else this.renderLive();
        this.costRender = now() - t2;
        if (this.err) { this.err = null; this.n.err.hidden = true; }
      } catch (e) {
        this.err = e;
        if (this.n && this.n.err) {
          this.n.err.hidden = false;
          this.n.err.textContent = txf('errLine', this.lang,
            [(e && (e.code || e.message)) || String(e)]);
        }
      }
      const c = now() - t0;
      this.costFrame = c;
      this.frames++;
      if (c > this.costWorst) this.costWorst = c;
      if (this.n && this.n.cost) {
        this.n.cost.textContent = txf('frameCost', this.lang, [fmt(c, 2)]);
      }
      return this;
    }

    /** Everything the curve depends on, and nothing else. */
    signature(p, u, d) {
      const parts = [];
      for (const k of Object.keys(p).sort()) parts.push(k + '=' + p[k]);
      if (u) parts.push('ur=' + u.reg, 'ut=' + u.tipd);
      if (d) parts.push('dT=' + d.Tin, 'dw=' + d.flow);
      parts.push('nm=' + this.nMax, 'ns=' + this.samples);
      return parts.join('|');
    }

    pickFeatured() {
      const lo = this.lastLocus;
      if (!lo || !lo.roots.length) return 0;
      const cur = this.state && this.state.probe ? this.state.probe.n : 1;
      let best = 0;
      for (let i = 1; i < lo.roots.length; i++) {
        if (Math.abs(lo.roots[i].n - cur) < Math.abs(lo.roots[best].n - cur)) best = i;
      }
      return best;
    }

    /**
     * The map is two hundred and eighty complete rho(n) curves, so it is
     * rebuilt only when its inputs actually settle, and then only a few
     * milliseconds of it per frame. While a knob is being dragged the old map
     * stays on screen marked stale — blanking it every frame would be worse
     * than showing it a moment out of date, and the progress line says which.
     */
    driveMap(p, u, d) {
      const key = this.signature(p, u, d) + '|' + this.mapX + '|' + this.mapY;
      const t = now();
      if (key !== this.mapKey) {
        this.mapKey = key;
        this.mapPending = key;
        this.mapChangedAt = t;
        if (this.mapResult) { this.mapResult.stale = true; this.mapDirty = true; }
        this.mapJobObj = null;
      }
      if (this.mapPending && t - this.mapChangedAt >= MAP_SETTLE_MS && !this.mapJobObj) {
        const near = this.state && this.state.probe ? this.state.probe.n : 1;
        this.mapJobObj = mapJob(this.plant, p, {
          x: this.mapX, y: this.mapY, u, d, nMax: this.nMax,
          nx: 20, ny: 14, samples: 56, nearPower: near });
        this.mapPending = null;
      }
      if (this.mapJobObj && !this.mapJobObj.done) {
        const t2 = now();
        this.mapJobObj.work(MAP_BUDGET_MS);
        this.costMap = now() - t2;
        if (this.mapJobObj.done) {
          this.mapResult = this.mapJobObj.result;
          this.mapResult.stale = false;
          this.mapDirty = true;
        }
      }
    }

    renderAll(withMap) {
      this.renderVerdict();
      this.renderLocus();
      this.renderSlopes();
      this.renderPoles();
      if (withMap) this.renderMap();
      this.renderNumbers();
    }

    /* Cheap per-frame path: only the moving marker and the progress text. */
    renderLive() {
      this.renderNowMarker();
      this.mapWaitText();
    }

    /** One text node, two places, no re-layout: the map progress. */
    mapWaitText() {
      const j = this.mapJobObj;
      const txtv = (j && !j.done)
        ? txf('computing', this.lang, [fmt(j.progress * 100, 0)])
        : (this.mapPending || (this.mapResult && this.mapResult.stale)
           ? txf('computing', this.lang, ['0']) : '');
      if (this.n.mprog.textContent !== txtv) this.n.mprog.textContent = txtv;
      const w = this.el.querySelector('[data-k="mwait"]');
      if (w && w.textContent !== txtv) w.textContent = txtv;
    }

    /* ---------------- verdict ---------------- */
    renderVerdict() {
      const lg = this.lang, lo = this.lastLocus, s = this.state;
      if (!lo) { this.n.verdict.innerHTML = ''; return; }
      const pctMax = fmt(lo.nMax * 100, 0);
      let cls = 'ok', head = '', lines = [];

      if (!lo.roots.length) {
        cls = 'bad';
        head = tx('noEqTitle', lg);
        lines.push(txf(lo.none && lo.none.reason === 'high' ? 'noEqHigh' : 'noEqLow',
                       lg, [pctMax]));
        lines.push(tx('axRho', lg) + ' ' + fmt(lo.rhoMin, 0) + ' … ' +
                   fmt(lo.rhoMax, 0) + ' pcm');
      } else {
        const r = lo.roots[this.featured];
        head = txf('eqAt', lg, [fmt(r.pct, 1)]);
        const nm = lo.roots.length === 1
          ? txf('eqOne', lg, [pctMax]) : txf('eqCount', lg, [lo.roots.length, pctMax]);
        lines.push(nm + '.');
        const sp = tx(r.byPower, lg), spl = tx(r.byPoles, lg);
        lines.push('<strong>' + esc(txf('byMethod', lg, [tx('mPower', lg)])) + ':</strong> ' +
                   esc(sp) + ' (dρ/dn = ' + fmt(r.alphaPct, 2) + ' ' +
                   esc(tx('perPct', lg)) + ')');
        lines.push('<strong>' + esc(txf('byMethod', lg, [tx('mPoles', lg)])) + ':</strong> ' +
                   esc(spl) + ' — ' + esc(tx('rightmost', lg)) + ' ' +
                   poleTxt(r.dominant) + ' 1/s' +
                   (r.rhp !== null ? ', ' + esc(tx('rhpCountTxt', lg)) + ': ' + r.rhp : ''));
        if (r.dominant) {
          const growing = r.dominant[0] > 0;
          lines.push(esc(tx(growing ? 'eFold' : 'settle', lg)) + ' ' + dur(r.eFold) +
                     ', ' + esc(tx('periodTxt', lg)) + ' ' +
                     (r.period ? dur(r.period) : esc(tx('aperiodic', lg))));
        }
        if (r.agree === false) {
          cls = 'warn';
          lines.push('<strong>' + esc(tx('disagree', lg)) + '</strong>');
        } else if (r.byPoles === 'unstable') cls = 'bad';
        else if (r.byPoles === 'stable') cls = 'ok';
        if (r.kink) {
          lines.push(esc(txf('kinkNote', lg, [fmt(r.slopeLo / 100, 2), fmt(r.slopeHi / 100, 2)])));
        }
      }

      /* the three ways the search can be blocked, named separately */
      const notes = [];
      const rc = lo.reach;
      if (rc && rc.any) {
        notes.push(txf('reachBand', lg, [fmt(rc.nLo * 100, 1), fmt(rc.nHi * 100, 1)]));
      } else if (rc) {
        notes.push(txf('reachNone', lg, [pctMax]));
      }
      if (s && s.equilibriumFeasible === false) notes.push(tx('outOfStroke', lg));
      const fw = lo.io.flow;
      const lim = (this.plant.disturbance.variants || []).find((v) => v.key === 'flow');
      const flo = lim ? lim.min : 0.05, fhi = lim ? lim.max : 1.5;
      const atLim = (s && s.autoLimit && s.autoLimit.flow)
                 || fw <= flo + 1e-9 || fw >= fhi - 1e-9;
      notes.push(txf(atLim ? 'flowAtLimit' : 'flowFree', lg,
                     [fmt(fw, 3), fmt(flo, 2), fmt(fhi, 2)]));
      if (!lo.boilModelled) notes.push(tx('boilOff', lg));
      else if (lo.boilOnset !== null) notes.push(txf('boilFrom', lg, [fmt(lo.boilOnset * 100, 1)]));
      else notes.push(tx('noBoilRange', lg));
      const av = this.state && this.state.params ? this.state.params.alphaVoid : null;
      if (fin(av)) {
        notes.push(txf('voidSign', lg, [fmt(av, 0),
          tx(av === 0 ? 'voidZero' : (av < 0 ? 'voidNeg' : 'voidPos'), lg)]));
      }
      notes.push(txf('kinLine', lg, [fmt(lo.betaEff * 1e5, 0), sig(lo.Lambda, 3),
        this.spectrumName(), fmt((this.state && this.state.probe
             ? this.state.probe.alphaDollarPerK : 0) * 100, 3)]));

      let disagreeNote = '';
      if (lo.roots.length) {
        const r = lo.roots[this.featured];
        if (r.agree === false) {
          disagreeNote = '<p class="eq-vnote">' + esc(txf(
            r.byPower === 'stable' ? 'disagreeText' : 'disagreeText2',
            lg, [fmt(r.alphaP, 0), r.rhp])) + '</p>';
        }
      }
      if (s && s.failed && s.fail) {
        cls = 'bad';
        notes.unshift(txf('failLine', lg, [s.fail.code]));
      }

      this.n.verdict.className = 'eq-verdict ' + cls;
      this.n.verdict.innerHTML =
        '<p class="eq-vhead">' + flagFor(cls) + esc(head) + '</p>' +
        lines.map((x) => '<p class="eq-vline">' + x + '</p>').join('') +
        disagreeNote +
        '<p class="eq-vnote">' +
          notes.map((x) => esc(/[.!?]$/.test(x) ? x : x + '.')).join(' ') + '</p>';
    }

    /** The spectrum, named the way the plant names it, in the user's language. */
    spectrumName() {
      const pr = this.state && this.state.probe;
      const q = (this.plant.params || []).find((x) => x.key === 'spectrum');
      const idx = this.state && this.state.params
        ? Number(this.state.params.spectrum) : 0;
      if (q && q.options) {
        const o = q.options.find((x) => x.value === idx);
        if (o) return pickL(o.label, this.lang);
      }
      return pr ? String(pr.spectrum) : '';
    }

    /* ---------------- rho(n) ---------------- */
    renderLocus() {
      const lo = this.lastLocus, lg = this.lang;
      if (!lo) return;
      const W = 760, Hh = 368, l = 62, r = 14, t = 12, b = 90;
      const pw = W - l - r, ph = Hh - t - b;
      let yLo = Math.min(0, lo.rhoMin), yHi = Math.max(0, lo.rhoMax);
      for (const k of ['xenon', 'doppler', 'coolant', 'void', 'rod']) {
        for (let i = 0; i <= lo.samples; i += 4) {
          const v = lo.terms[k][i];
          if (v < yLo) yLo = v;
          if (v > yHi) yHi = v;
        }
      }
      const pad = 0.06 * Math.max(1, yHi - yLo);
      yLo -= pad; yHi += pad;
      const sx = (n) => l + pw * (n / lo.nMax);
      const sy = (v) => t + ph * (1 - (v - yLo) / (yHi - yLo));
      const xs = Array.from(lo.n);

      let g = '';
      /* frame + zero line */
      g += '<rect x="' + l + '" y="' + t + '" width="' + pw + '" height="' + ph +
           '" fill="none" stroke="var(--line,#dde3ea)"/>';
      const y0 = sy(0);
      g += '<line x1="' + l + '" y1="' + y0.toFixed(1) + '" x2="' + (l + pw) +
           '" y2="' + y0.toFixed(1) + '" stroke="var(--ink2,#5b6b7c)" stroke-width="1.2"/>';
      g += '<text class="eq-num" x="' + (l - 6) + '" y="' + (y0 + 3.5).toFixed(1) +
           '" text-anchor="end">0 pcm</text>';
      /* boiling onset */
      if (lo.boilOnset !== null) {
        const bx = sx(lo.boilOnset);
        g += '<line x1="' + bx.toFixed(1) + '" y1="' + t + '" x2="' + bx.toFixed(1) +
             '" y2="' + (t + ph) + '" stroke="var(--eq-c5)" stroke-width="1" ' +
             'stroke-dasharray="3 3"/>';
        g += '<text class="eq-num" x="' + (bx + 4).toFixed(1) + '" y="' + (t + 12) +
             '" fill="var(--eq-c5)" paint-order="stroke" stroke="var(--panel,#fff)" ' +
             'stroke-width="3.5" stroke-linejoin="round">' +
             esc(fmt(lo.boilOnset * 100, 0)) + ' %</text>';
      }
      /* contributions then the total on top */
      for (let k = 0; k < TERMS.length; k++) {
        const key = TERMS[k].key;
        const d = pathOf(xs, Array.from(lo.terms[key]), sx, sy);
        g += '<path d="' + d + '" fill="none" stroke="' + COLORS[k + 1] +
             '" stroke-width="1.6"' + (DASH[k + 1] ? ' stroke-dasharray="' + DASH[k + 1] + '"' : '') +
             ' stroke-linejoin="round"/>';
      }
      g += '<path d="' + pathOf(xs, Array.from(lo.total), sx, sy) +
           '" fill="none" stroke="' + COLORS[0] + '" stroke-width="2.8" ' +
           'stroke-linejoin="round"/>';

      /* which contribution moves fastest — a ribbon under the plot */
      const ry = t + ph + 6, rh = 7;
      let seg0 = 0;
      for (let i = 1; i <= lo.samples; i++) {
        if (lo.rule[i] !== lo.rule[seg0] || i === lo.samples) {
          const c = lo.rule[seg0];
          if (c >= 1) {
            const x1 = sx(lo.n[seg0]), x2 = sx(lo.n[i]);
            g += '<rect x="' + x1.toFixed(1) + '" y="' + ry + '" width="' +
                 Math.max(0.5, x2 - x1).toFixed(1) + '" height="' + rh +
                 '" fill="' + COLORS[c + 1] + '" opacity="0.55"/>';
          }
          seg0 = i;
        }
      }
      g += '<text x="' + l + '" y="' + (ry + rh + 13) + '">' +
           esc(tx('ruleBand', lg)) + '</text>';

      /* roots */
      for (let i = 0; i < lo.roots.length; i++) {
        const rr = lo.roots[i];
        const X = sx(rr.n);
        const stableBoth = rr.byPoles === 'stable';
        g += '<line x1="' + X.toFixed(1) + '" y1="' + t + '" x2="' + X.toFixed(1) +
             '" y2="' + (t + ph) + '" stroke="var(--ink2,#5b6b7c)" stroke-width="0.8" ' +
             'stroke-dasharray="2 3"/>';
        g += '<circle cx="' + X.toFixed(1) + '" cy="' + y0.toFixed(1) + '" r="6" ' +
             'fill="' + (stableBoth ? 'var(--eq-ok)' : 'none') + '" stroke="' +
             (stableBoth ? 'var(--eq-ok)' : 'var(--eq-bad)') + '" stroke-width="2.2"/>';
        if (!stableBoth) {
          g += '<line x1="' + (X - 4).toFixed(1) + '" y1="' + (y0 - 4).toFixed(1) +
               '" x2="' + (X + 4).toFixed(1) + '" y2="' + (y0 + 4).toFixed(1) +
               '" stroke="var(--eq-bad)" stroke-width="2"/>';
        }
        /* The crossing already has a dashed vertical through it; without a
         * halo the line cuts the decimal point and "100.0" reads "100,0". */
        g += '<text class="eq-num eq-strong" x="' + X.toFixed(1) + '" y="' + (t + ph - 6) +
             '" text-anchor="middle" paint-order="stroke" stroke="var(--panel,#fff)" ' +
             'stroke-width="3.5" stroke-linejoin="round">' +
             esc(fmt(rr.pct, 1)) + ' %</text>';
      }

      /* axis ends, absolute, both of them */
      g += '<text class="eq-num" x="' + l + '" y="' + (Hh - 30) + '">0 %</text>';
      g += '<text class="eq-num" x="' + (l + pw) + '" y="' + (Hh - 30) +
           '" text-anchor="end">' + esc(fmt(lo.nMax * 100, 0)) + ' %</text>';
      g += '<text x="' + (l + pw / 2) + '" y="' + (Hh - 30) + '" text-anchor="middle">' +
           esc(tx('axPower', lg)) + '</text>';
      g += '<text class="eq-num" x="' + (l - 6) + '" y="' + (t + 9) +
           '" text-anchor="end">' + esc(fmt(yHi, 0)) + '</text>';
      g += '<text class="eq-num" x="' + (l - 6) + '" y="' + (t + ph) +
           '" text-anchor="end">' + esc(fmt(yLo, 0)) + '</text>';
      g += '<text x="14" y="' + (t + ph / 2) + '" text-anchor="middle" ' +
           'transform="rotate(-90 14 ' + (t + ph / 2) + ')">' +
           esc(tx('axRho', lg)) + ', pcm</text>';
      /* the reactor as it is now */
      g += '<g data-k="nowg"></g>';

      this.n.locusg.innerHTML = g;
      this.nowScale = { sx, sy, l, t, pw, ph, yLo, yHi };
      this.renderNowMarker();

      const svg = this.n.locus;
      svg.querySelector('title').textContent = tx('locusHdr', lg);
      svg.querySelector('desc').textContent = this.locusAlt();
      svg.setAttribute('aria-label', tx('locusHdr', lg));
    }

    locusAlt() {
      const lo = this.lastLocus, lg = this.lang;
      if (!lo) return '';
      const parts = [];
      parts.push(tx('axPower', lg) + ' 0…' + fmt(lo.nMax * 100, 0) + ' %, ' +
                 tx('axRho', lg) + ' ' + fmt(lo.rhoMin, 0) + '…' + fmt(lo.rhoMax, 0) + ' pcm.');
      if (!lo.roots.length) {
        parts.push(tx('noEqTitle', lg) + ': ' +
          txf(lo.none && lo.none.reason === 'high' ? 'noEqHigh' : 'noEqLow',
              lg, [fmt(lo.nMax * 100, 0)]));
      } else {
        for (const r of lo.roots) {
          parts.push(txf('eqAt', lg, [fmt(r.pct, 1)]) + ': ' +
            txf('byMethod', lg, [tx('mPower', lg)]) + ' ' + tx(r.byPower, lg) +
            ' (' + fmt(r.alphaPct, 2) + ' ' + tx('perPct', lg) + '), ' +
            txf('byMethod', lg, [tx('mPoles', lg)]) + ' ' + tx(r.byPoles, lg) +
            ' (' + tx('rightmost', lg) + ' ' + poleTxtPlain(r.dominant) + ' 1/s).');
        }
      }
      for (const t of TERMS) {
        const arr = lo.terms[t.key];
        parts.push(tx(t.t, lg) + ': ' + fmt(arr[0], 0) + ' pcm ' +
                   tx('axPower', lg).toLowerCase() + ' 0 %, ' +
                   fmt(arr[lo.samples], 0) + ' pcm ' + fmt(lo.nMax * 100, 0) + ' %.');
      }
      return parts.join(' ');
    }

    renderNowMarker() {
      if (!this.nowScale || !this.n) return;
      const g = this.el.querySelector('[data-k="nowg"]');
      if (!g) return;
      const s = this.state, lo = this.lastLocus;
      if (!s || !s.probe || !lo) { g.innerHTML = ''; return; }
      const nnow = s.probe.n, rnow = s.probe.rhoTotal;
      if (!fin(nnow) || !fin(rnow)) { g.innerHTML = ''; return; }
      const sc = this.nowScale;
      const X = clamp(sc.sx(clamp(nnow, 0, lo.nMax)), sc.l, sc.l + sc.pw);
      const Y = clamp(sc.sy(clamp(rnow, sc.yLo, sc.yHi)), sc.t, sc.t + sc.ph);
      g.innerHTML =
        '<path d="M' + X.toFixed(1) + ' ' + (Y - 7).toFixed(1) + 'l7 7-7 7-7-7z" ' +
        'fill="var(--eq-c0)" stroke="var(--panel,#fff)" stroke-width="1.5"/>' +
        '<text class="eq-num eq-strong" x="' + (X + 10).toFixed(1) + '" y="' +
        (Y - 8).toFixed(1) + '" paint-order="stroke" stroke="var(--panel,#fff)" ' +
        'stroke-width="3.5" stroke-linejoin="round">' +
        esc(tx('nowMark', this.lang)) + ' ' +
        esc(fmt(nnow * 100, 1)) + ' %, ' + esc(fmt(rnow, 0)) + ' pcm</text>';
    }

    /* ---------------- slope bars ---------------- */
    renderSlopes() {
      const lo = this.lastLocus, lg = this.lang;
      const g = this.n.slopesg, svg = this.n.slopes;
      if (!lo || !lo.roots.length) {
        g.innerHTML = '<text x="10" y="24">' + esc(tx('noEqTitle', lg)) + '</text>';
        svg.querySelector('title').textContent = tx('slopeHdr', lg);
        svg.querySelector('desc').textContent = tx('noEqTitle', lg);
        svg.setAttribute('aria-label', tx('slopeHdr', lg));
        return;
      }
      const r = lo.roots[this.featured];
      const rows = TERMS.filter((t) => t.key !== 'rod')
        .map((t, i) => ({ t, i, v: (r.slopes[t.key] || 0) / 100 }));
      rows.push({ t: { key: 'total', t: 'tTot', c: 0 }, i: -1, v: r.alphaPct });
      let mx = 0;
      for (const q of rows) mx = Math.max(mx, Math.abs(q.v));
      mx = mx > 0 ? mx * 1.15 : 1;
      const W = 500, Hh = 210, l = 172, r2 = 62, t = 16, b = 30;
      const pw = W - l - r2, ph = Hh - t - b;
      const cx = l + pw / 2;
      const rowH = ph / rows.length;
      let s = '';
      s += '<line x1="' + cx + '" y1="' + t + '" x2="' + cx + '" y2="' + (t + ph) +
           '" stroke="var(--ink2,#5b6b7c)" stroke-width="1"/>';
      rows.forEach((q, k) => {
        const yc = t + rowH * (k + 0.5);
        const w = (Math.abs(q.v) / mx) * (pw / 2);
        const x = q.v < 0 ? cx - w : cx;
        const col = q.i < 0 ? COLORS[0] : COLORS[q.t.c];
        s += '<rect x="' + x.toFixed(1) + '" y="' + (yc - rowH * 0.3).toFixed(1) +
             '" width="' + Math.max(w, 0.7).toFixed(1) + '" height="' +
             (rowH * 0.6).toFixed(1) + '" fill="' + col + '" opacity="' +
             (q.i < 0 ? '1' : '0.8') + '"/>';
        s += '<text x="' + (l - 6) + '" y="' + (yc + 4).toFixed(1) +
             '" text-anchor="end"' + (q.i < 0 ? ' class="eq-strong"' : '') + '>' +
             esc(tx(q.t.t, lg)) + '</text>';
        s += '<text class="eq-num' + (q.i < 0 ? ' eq-strong' : '') + '" x="' + (W - 6) +
             '" y="' + (yc + 4).toFixed(1) + '" text-anchor="end">' +
             esc(fmt(q.v, 2)) + '</text>';
      });
      s += '<text class="eq-num" x="' + l + '" y="' + (Hh - 12) + '">' +
           esc(fmt(-mx, 1)) + '</text>';
      s += '<text class="eq-num" x="' + (l + pw) + '" y="' + (Hh - 12) +
           '" text-anchor="end">' + esc(fmt(mx, 1)) + '</text>';
      s += '<text x="' + cx + '" y="' + (Hh - 12) + '" text-anchor="middle">' +
           esc(tx('perPct', lg)) + '</text>';
      g.innerHTML = s;
      svg.querySelector('title').textContent = tx('slopeHdr', lg);
      svg.querySelector('desc').textContent = rows.map((q) =>
        tx(q.t.t, lg) + ' ' + fmt(q.v, 2) + ' ' + tx('perPct', lg)).join('; ') + '.';
      svg.setAttribute('aria-label', tx('slopeHdr', lg));
    }

    /* ---------------- s-plane ---------------- */
    renderPoles() {
      const lo = this.lastLocus, lg = this.lang;
      const g = this.n.polesg, svg = this.n.poles;
      const set = (d) => {
        svg.querySelector('title').textContent = tx('polesHdr', lg);
        svg.querySelector('desc').textContent = d;
        svg.setAttribute('aria-label', tx('polesHdr', lg));
      };
      if (!lo || !lo.roots.length || !lo.roots[this.featured].poles) {
        g.innerHTML = '<text x="10" y="24">' + esc(tx('unknownSt', lg)) + '</text>';
        this.n.polefoot.textContent = '';
        set(tx('unknownSt', lg));
        return;
      }
      const r = lo.roots[this.featured];
      const ps = r.poles;
      const LIN = 1e-6;
      let mxR = 1e-5, imTrue = 0;
      for (const q of ps) {
        mxR = Math.max(mxR, Math.abs(q[0]));
        imTrue = Math.max(imTrue, Math.abs(q[1]));
      }
      /* Every pole real is a real statement about the plant, not a scale of
       * zero height: say so on the axis instead of printing a fake decade. */
      const allReal = imTrue === 0;
      const mxI = allReal ? 1e-5 : imTrue;
      const W = 420, Hh = 234, l = 66, rr = 14, t = 14, b = 42;
      const pw = W - l - rr, ph = Hh - t - b;
      const sxMax = symlog(mxR, LIN) * 1.08;
      const syMax = symlog(mxI, LIN) * 1.15;
      const SX = (v) => l + pw * (0.5 + 0.5 * symlog(v, LIN) / sxMax);
      const SY = (v) => t + ph * (0.5 - 0.5 * symlog(v, LIN) / (syMax || 1));
      const x0 = SX(0);
      let s = '';
      s += '<rect x="' + x0.toFixed(1) + '" y="' + t + '" width="' +
           (l + pw - x0).toFixed(1) + '" height="' + ph +
           '" fill="var(--eq-bad)" opacity="0.07"/>';
      s += '<rect x="' + l + '" y="' + t + '" width="' + pw + '" height="' + ph +
           '" fill="none" stroke="var(--line,#dde3ea)"/>';
      s += '<line x1="' + x0.toFixed(1) + '" y1="' + t + '" x2="' + x0.toFixed(1) +
           '" y2="' + (t + ph) + '" stroke="var(--eq-bad)" stroke-width="1.3"/>';
      s += '<line x1="' + l + '" y1="' + (t + ph / 2) + '" x2="' + (l + pw) +
           '" y2="' + (t + ph / 2) + '" stroke="var(--line,#dde3ea)"/>';
      for (const q of ps) {
        const X = SX(q[0]), Y = SY(q[1]);
        const bad = q[0] > 0;
        s += '<path d="M' + (X - 4).toFixed(1) + ' ' + (Y - 4).toFixed(1) + 'l8 8M' +
             (X + 4).toFixed(1) + ' ' + (Y - 4).toFixed(1) + 'l-8 8" stroke="' +
             (bad ? 'var(--eq-bad)' : 'var(--eq-c4)') + '" stroke-width="' +
             (bad ? '2.4' : '1.6') + '"/>';
      }
      if (r.dominant) {
        const X = SX(r.dominant[0]), Y = SY(r.dominant[1]);
        s += '<circle cx="' + X.toFixed(1) + '" cy="' + Y.toFixed(1) + '" r="8" fill="none" ' +
             'stroke="' + (r.dominant[0] > 0 ? 'var(--eq-bad)' : 'var(--eq-ok)') +
             '" stroke-width="1.4"/>';
      }
      s += '<text class="eq-num" x="' + l + '" y="' + (Hh - 20) + '">' +
           esc('-' + sig(mxR, 2)) + '</text>';
      s += '<text class="eq-num" x="' + (l + pw) + '" y="' + (Hh - 20) +
           '" text-anchor="end">+' + esc(sig(mxR, 2)) + '</text>';
      s += '<text x="' + (l + pw / 2) + '" y="' + (Hh - 6) + '" text-anchor="middle">' +
           esc(tx('axRe', lg)) + ', 1/s</text>';
      if (allReal) {
        s += '<text x="' + (l - 5) + '" y="' + (t + ph / 2 + 4) +
             '" text-anchor="end">' + esc(tx('aperiodic', lg)) + '</text>';
      } else {
        s += '<text class="eq-num" x="' + (l - 5) + '" y="' + (t + 9) +
             '" text-anchor="end">+' + esc(sig(mxI, 2)) + '</text>';
        s += '<text class="eq-num" x="' + (l - 5) + '" y="' + (t + ph) +
             '" text-anchor="end">' + esc('-' + sig(mxI, 2)) + '</text>';
      }
      g.innerHTML = s;

      let foot = tx('rightmost', lg) + ' ' + poleTxtPlain(r.dominant) + ' 1/s. ' +
                 tx('rhpCountTxt', lg) + ': ' + r.rhp + '. ';
      foot += (r.polesAgree === true ? tx('routhAgrees', lg)
              : txf('routhDiffers', lg, [r.routh === null ? '—' : r.routh]));
      this.n.polefoot.textContent = foot;
      set(foot + ' ' + ps.map((q) => fmt(q[0], 8) + (q[1] ? ' ± ' + fmt(Math.abs(q[1]), 8) + 'i' : ''))
          .join('; ') + '.');
    }

    /* ---------------- map ---------------- */
    renderMap() {
      const lg = this.lang, m = this.mapResult;
      const svg = this.n.map, g = this.n.mapg;
      const set = (d) => {
        svg.querySelector('title').textContent = tx('mapHdr', lg);
        svg.querySelector('desc').textContent = d;
        svg.setAttribute('aria-label', tx('mapHdr', lg));
      };
      if (!m) {
        g.innerHTML = '<rect x="1" y="1" width="758" height="120" fill="none" ' +
          'stroke="var(--line,#dde3ea)"/><text data-k="mwait" x="16" y="34"></text>';
        this.mapWaitText();
        set(txf('computing', lg, ['0']));
        return;
      }
      const W = 760, Hh = 430, l = 92, r = 14, t = 12, b = 56;
      const pw = W - l - r, ph = Hh - t - b;
      const cw = pw / m.nx, ch = ph / m.ny;
      let s = '';
      for (let j = 0; j < m.ny; j++) {
        for (let i = 0; i < m.nx; i++) {
          const c = m.cells[j * m.nx + i];
          if (!c) continue;
          const X = l + i * cw, Y = t + ph - (j + 1) * ch;
          s += '<rect x="' + X.toFixed(1) + '" y="' + Y.toFixed(1) + '" width="' +
               (cw + 0.6).toFixed(1) + '" height="' + (ch + 0.6).toFixed(1) +
               '" fill="' + this.MC[c.cls] + '" opacity="0.9"/>';
          if (cw > 15 && ch > 14) {
            s += '<text class="eq-num" x="' + (X + cw / 2).toFixed(1) + '" y="' +
                 (Y + ch / 2 + 4).toFixed(1) + '" text-anchor="middle" ' +
                 'fill="var(--panel,#fff)" font-weight="700">' + this.MK[c.cls] + '</text>';
          }
        }
      }
      s += '<rect x="' + l + '" y="' + t + '" width="' + pw + '" height="' + ph +
           '" fill="none" stroke="var(--line,#dde3ea)"/>';
      /* where the reactor is right now */
      const here = this.mapHere(m);
      if (here) {
        const X = l + pw * here.fx, Y = t + ph * (1 - here.fy);
        s += '<circle cx="' + X.toFixed(1) + '" cy="' + Y.toFixed(1) +
             '" r="7" fill="none" stroke="var(--ink,#1b2733)" stroke-width="2.4"/>' +
             '<circle cx="' + X.toFixed(1) + '" cy="' + Y.toFixed(1) +
             '" r="7" fill="none" stroke="var(--panel,#fff)" stroke-width="1"/>';
      }
      const axl = (a) => esc(pickL(a.label, lg)) + (a.unit && a.unit !== '-' ? ', ' + esc(a.unit) : '');
      s += '<text class="eq-num" x="' + l + '" y="' + (Hh - 30) + '">' +
           esc(sig(m.axes.x.lo, 3)) + '</text>';
      s += '<text class="eq-num" x="' + (l + pw) + '" y="' + (Hh - 30) +
           '" text-anchor="end">' + esc(sig(m.axes.x.hi, 3)) + '</text>';
      s += '<text x="' + (l + pw / 2) + '" y="' + (Hh - 30) + '" text-anchor="middle">' +
           axl(m.axes.x) + '</text>';
      s += '<text class="eq-num" x="' + (l - 6) + '" y="' + (t + 9) +
           '" text-anchor="end">' + esc(sig(m.axes.y.hi, 3)) + '</text>';
      s += '<text class="eq-num" x="' + (l - 6) + '" y="' + (t + ph) +
           '" text-anchor="end">' + esc(sig(m.axes.y.lo, 3)) + '</text>';
      s += '<text x="14" y="' + (t + ph / 2) + '" text-anchor="middle" ' +
           'transform="rotate(-90 14 ' + (t + ph / 2) + ')">' + axl(m.axes.y) + '</text>';
      g.innerHTML = s;
      g.setAttribute('opacity', m.stale ? '0.45' : '1');
      this.mapWaitText();

      const counts = CLS.filter((c) => m.tally[c])
        .map((c) => m.tally[c] + ' × ' + tx(this.ML[c], lg)).join('; ');
      set(axl(m.axes.x) + ' ' + sig(m.axes.x.lo, 3) + '…' + sig(m.axes.x.hi, 3) + ', ' +
          axl(m.axes.y) + ' ' + sig(m.axes.y.lo, 3) + '…' + sig(m.axes.y.hi, 3) + '. ' +
          m.nx + '×' + m.ny + ': ' + counts + '. ' +
          (here ? tx('youAreHere', lg) + '.' : ''));
    }

    mapHere(m) {
      const s = this.state;
      if (!s) return null;
      const val = (a) => {
        if (a.kind === 'io') return a.key === 'flow' ? (s.d ? s.d.flow : null)
                                                     : (s.d ? s.d.Tin : null);
        if (a.kind === 'u') return s.u ? s.u[a.key.slice(2)] : null;
        return s.params ? s.params[a.key] : null;
      };
      const vx = val(m.axes.x), vy = val(m.axes.y);
      if (!fin(vx) || !fin(vy)) return null;
      const fx = (vx - m.axes.x.lo) / (m.axes.x.hi - m.axes.x.lo);
      const fy = (vy - m.axes.y.lo) / (m.axes.y.hi - m.axes.y.lo);
      if (fx < -0.02 || fx > 1.02 || fy < -0.02 || fy > 1.02) return null;
      return { fx: clamp01(fx), fy: clamp01(fy) };
    }

    /* ---------------- the numbers, as a table ---------------- */
    renderNumbers() {
      const lo = this.lastLocus, lg = this.lang;
      if (!lo) { this.n.numbody.innerHTML = ''; return; }
      let h = '';
      h += '<table><caption>' + esc(tx('tblRoots', lg)) + '</caption><thead><tr>' +
           '<th scope="col">' + esc(tx('thPowerCol', lg)) + ', %</th>' +
           '<th scope="col">dρ/dn, ' + esc(tx('perPct', lg)) + '</th>' +
           '<th scope="col">' + esc(tx('mPower', lg)) + '</th>' +
           '<th scope="col">' + esc(tx('mPoles', lg)) + '</th>' +
           '<th scope="col">' + esc(tx('thPoleRe', lg)) + '</th>' +
           '<th scope="col">' + esc(tx('thTime', lg)) + '</th>' +
           '<th scope="col">T_f, °C</th><th scope="col">' + esc(tx('tVoid', lg)) + '</th>' +
           '</tr></thead><tbody>';
      if (!lo.roots.length) {
        h += '<tr><td colspan="8">' + esc(tx('noEqTitle', lg)) + '</td></tr>';
      }
      for (const r of lo.roots) {
        h += '<tr><td>' + esc(fmt(r.pct, 2)) + '</td><td>' + esc(fmt(r.alphaPct, 3)) +
             '</td><td>' + esc(tx(r.byPower, lg)) + '</td><td>' + esc(tx(r.byPoles, lg)) +
             '</td><td>' + esc(r.dominant ? sig(r.dominant[0], 4) : '—') +
             '</td><td>' + esc(dur(r.eFold)) + '</td><td>' + esc(fmt(r.Tf, 1)) +
             '</td><td>' + esc(fmt(r.voidFrac, 3)) + '</td></tr>';
      }
      h += '</tbody></table>';

      if (lo.roots.length) {
        const r = lo.roots[this.featured];
        h += '<table><caption>' + esc(tx('tblSlopes', lg)) + '</caption><thead><tr>' +
             '<th scope="col">' + esc(tx('thTerm', lg)) + '</th>' +
             '<th scope="col">' + esc(tx('thAt', lg)) + ', pcm</th>' +
             '<th scope="col">' + esc(tx('thSlope', lg)) + ', ' + esc(tx('perPct', lg)) +
             '</th></tr></thead><tbody>';
        for (const t of TERMS) {
          h += '<tr><td>' + esc(tx(t.t, lg)) + '</td><td>' +
               esc(fmt(r.terms[t.key], 1)) + '</td><td>' +
               esc(fmt((r.slopes[t.key] || 0) / 100, 3)) + '</td></tr>';
        }
        h += '<tr><td><strong>' + esc(tx('tTot', lg)) + '</strong></td><td>' +
             esc(fmt(0, 1)) + '</td><td><strong>' + esc(fmt(r.alphaPct, 3)) +
             '</strong></td></tr></tbody></table>';

        if (r.poles) {
          h += '<table><caption>' + esc(tx('tblPoles', lg)) + '</caption><thead><tr>' +
               '<th scope="col">#</th><th scope="col">' + esc(tx('thPoleRe', lg)) +
               '</th><th scope="col">' + esc(tx('thPoleIm', lg)) + '</th>' +
               '<th scope="col">' + esc(tx('thTime', lg)) + '</th>' +
               '<th scope="col">' + esc(tx('periodTxt', lg)) + '</th></tr></thead><tbody>';
          r.poles.forEach((q, i) => {
            h += '<tr><td>' + (i + 1) + '</td><td>' + esc(sig(q[0], 5)) + '</td><td>' +
                 esc(q[1] ? sig(q[1], 5) : '0') + '</td><td>' +
                 esc(q[0] !== 0 ? dur(1 / Math.abs(q[0])) : '—') + '</td><td>' +
                 esc(q[1] ? dur(2 * Math.PI / Math.abs(q[1])) : tx('aperiodic', lg)) +
                 '</td></tr>';
          });
          h += '</tbody></table>';
        }
      }
      this.n.numbody.innerHTML = h;
    }
  }

  function flagFor(cls) {
    const m = { ok: 'ok', bad: 'bad', warn: 'warn' };
    const sym = { ok: '✓', bad: '✗', warn: '!' };
    return '<span class="eq-flag ' + m[cls] + '" aria-hidden="true">' + sym[cls] + '</span>';
  }
  function poleTxt(d) {
    if (!d) return '—';
    return esc(sig(d[0], 4)) + (d[1] ? ' ± ' + esc(sig(Math.abs(d[1]), 4)) + 'i' : '');
  }
  function poleTxtPlain(d) {
    if (!d) return '—';
    return sig(d[0], 4) + (d[1] ? ' ± ' + sig(Math.abs(d[1]), 4) + 'i' : '');
  }

  /* =====================================================================
     8. Public surface
     ===================================================================== */

  return {
    version: VERSION,
    langs: LANGS.slice(),
    locus,
    map,
    mapJob,
    mount,
    terms: TERMS.map((t) => t.key),
    axes: axisList,
    poly: { roots: polyRoots, residual: rootResidual,
            rhpRouth, rhpArgument },
    text: T
  };
})();

/* ===================== console.js ===================== */
/* ---------------------------------------------------------------------------
   console.js — живой стенд реактора (RCON).

   Контракт: lab/CONSOLE-CONTRACT.md §2 (API), §3 (режимы), §4a (физика),
   §4 (границы честности). Объект — lab/plant-reactor.js.

   Что это такое. Не «прогон по кнопке», а прибор: интегрирование идёт
   непрерывно, пока стенд открыт и виден, ведущее — requestAnimationFrame,
   модельное время привязано к настенному множителем ×1…×1000. Оператор крутит
   ручки во время счёта; ленты бегут, как на осциллографе.

   Принципы (lab/SPEC.md §0):
     • один глобал RCON, объявленный в IIFE; ни export, ни ES-модулей;
     • чистый ES6+, ни одного var, node --check проходит;
     • DOM — только внутри переданного контейнера, включая свой <style>;
     • шесть языков (en, uk, de, nl, fr, es); русского нет, украинский — uk;
     • ни одного обращения к app.js, glue.js, SCEN, ANIM, PLOT, SIM.

   Настенное время. Date.now/performance.now здесь неизбежны — стенд по
   определению привязан к часам, в отличие от anim.js, который обязан быть
   воспроизводимым по модельному времени. Кадр считает по ФАКТИЧЕСКИ
   прошедшему настенному времени с двумя потолками:
     • WALL_CAP_S — сколько настенных секунд кадр вообще имеет право учесть
       (свёрнутая вкладка не проматывает часы за кадр);
     • FRAME_BUDGET_MS — сколько миллисекунд процессора кадр имеет право

       считается и показывается как разница «заказано ×N / вышло ×M».

   API:
     RCON.mount(el, { plant, lang, mode, preset, speed, windowSec }) -> handle
     handle.setLang(lang) / setMode(m) / setPreset(id) / setSpeed(k)
     handle.setWindow(sec) / setControl(id, v) / setParam(key, v) / nudge(kind)

     handle.state() / strips() / destroy()

const RCON = (function () {
  'use strict';

  const VERSION = '1.0.0';
