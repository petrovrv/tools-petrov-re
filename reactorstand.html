     0. Мелочи
     ===================================================================== */

  let UID = 0;
  const uid = (pfx) => { UID += 1; return 'rcon-' + pfx + '-' + UID; };

  const LANGS = ['en', 'uk', 'de', 'nl', 'fr', 'es'];
  const L = (en, uk, de, nl, fr, es) => ({ en, uk, de, nl, fr, es });

  const fin = (v) => (typeof v === 'number' && Number.isFinite(v));
  const clamp = (v, a, b) => (v > a ? (v > b ? b : v) : a);
  const clamp01 = (v) => clamp(v, 0, 1);
  const num = (v, dflt) => (fin(v) ? v : dflt);

  const esc = (s) => String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  /* Английский — точка, остальные пять — запятая. Минус — U+2212. */
  const DECIMAL = { en: '.', uk: ',', de: ',', nl: ',', fr: ',', es: ',' };

  function nf(v, digits, lang) {
    if (!fin(v)) return '—';
    let s = v.toFixed(digits === undefined ? 1 : digits);
    if (/^-0(?:[.,]0+)?$/.test(s)) s = s.slice(1);
    if (DECIMAL[lang] === ',') s = s.replace('.', ',');
    return s.replace('-', '−');
  }

  /* Экспоненциальная запись для потока: 3,00·10^13 читается, 3e+13 — нет. */
  function ne(v, digits, lang) {
    if (!fin(v)) return '—';
    if (v === 0) return '0';
    const e = Math.floor(Math.log10(Math.abs(v)));
    const m = v / Math.pow(10, e);
    return nf(m, digits === undefined ? 2 : digits, lang) + '·10' + sup(e);
  }
  const SUPS = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³',
                 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
  const sup = (n) => String(n).split('').map((c) => SUPS[c] || c).join('');

     времени) и сам стал бы источником колебаний. */

     CALM_MIN — на сколько максимум разрешено замедлить. */

     периода.

     неразличимо, выше читается как обратное. Но кадр может быть ПОТЕРЯН
     (композитор выбросил, вкладка моргнула, сборка мусора), и тогда глаз
     сравнивает не соседние отрисовки, а через одну — то есть удвоенный
     сдвиг. При 0,34 удвоение даёт 0,68 периода, и «муравьи» ИНОГДА бегут
     назад: ровно на пропущенных кадрах. Поэтому потолок берётся такой,
     чтобы и удвоенный сдвиг оставался заметно меньше половины:
     0,15 · 2 = 0,30. При 60 кадрах это всё ещё 9 периодов в секунду —
     быстрее, чем глаз способен проследить. */
  const PHASE_CAP = 0.15;
  /* Окна лент. Прежний максимум — 2 часа, а ксеноновый переходный процесс
     идёт 72 часа: яма набирается за 8,4 ч и рассасывается к 26 ч. То есть
     самое длинное окно показывало 2,8 % процесса, а на пресете по умолчанию
     (×1, окно 5 минут) за минуту наблюдения лента ксенона проходила 9,6 pcm
     из 1946 — отсюда и впечатление, что «ксенон идёт вяло». Он не вяло идёт,
     его просто не было видно. Добавлены 6 ч, 12 ч, 24 ч и 72 ч; на 72 ч шаг
     выборки 259 с даёт ровно 1000 точек в окне, а кольцо на 16384 отсчёта
     держит 1180 ч. */
  const WINDOWS = [60, 300, 900, 3600, 7200, 21600, 43200, 86400, 259200];

  /* =====================================================================
     2. Кольцевой буфер
     ===================================================================== */

  /**
   * Фиксированной длины, без единого выделения после конструктора.
   * Время — Float64 (при ×1000 за час набегает 3,6e6 с, и Float32 потерял бы
   * на нём разрешение), значения — Float32: на ленте это доли пикселя.
   */
  class Ring {
    constructor(channels, cap) {
      this.cap = cap | 0;
      this.channels = channels.slice();
      this.n = 0;
      this.head = 0;
      this.t = new Float64Array(this.cap);
      this.v = {};
      for (const c of channels) this.v[c] = new Float32Array(this.cap);
    }

    clear() { this.n = 0; this.head = 0; }

    /** Пишет один отсчёт. Ничего не выделяет и ничего не возвращает. */
    push(t, obj) {
      const i = this.head;
      this.t[i] = t;
      const ch = this.channels;
      for (let k = 0; k < ch.length; k++) {
        const val = obj[ch[k]];
        this.v[ch[k]][i] = fin(val) ? val : NaN;
      }
      this.head = (i + 1) % this.cap;
      if (this.n < this.cap) this.n += 1;
    }

    /** Индекс в кольце для порядкового номера j (0 — самый старый). */
    idx(j) { return (this.head - this.n + j + this.cap * 2) % this.cap; }

    tAt(j) { return this.t[this.idx(j)]; }

    /** Наименьший j, у которого t >= tMin. Двоичный поиск: t не убывает. */
    firstAtOrAfter(tMin) {
      let lo = 0, hi = this.n;
      while (lo < hi) {
        const m = (lo + hi) >> 1;
        if (this.tAt(m) < tMin) lo = m + 1; else hi = m;
      }
      return lo;
    }

    /** Байт, занятых буфером. Проверяемое число, а не обещание. */
    bytes() {
      return this.cap * 8 + this.channels.length * this.cap * 4;
    }
  }

  /* =====================================================================
     3. Шкала ленты
     ===================================================================== */

  /** Округление вверх до 1/2/5·10^k — чтобы подпись конца шкалы читалась. */
  function niceStep(x) {
    if (!(x > 0)) return 1;
    const e = Math.floor(Math.log10(x));
    const f = x / Math.pow(10, e);
    const m = f <= 1 ? 1 : (f <= 2 ? 2 : (f <= 5 ? 5 : 10));
    return m * Math.pow(10, e);
  }

  /**
   * Границы шкалы по данным окна. Обе подписываются абсолютными значениями,
   * поэтому они обязаны быть круглыми и устойчивыми: иначе подпись мигает и
   * «полная лента» читается как «много», чего правило сайта не допускает.
   *
   * opt.zero  — тянуть шкалу к нулю (мощность, поток, паросодержание);
   * opt.sym   — симметрично около нуля (составляющие реактивности);
   * opt.min/max — жёсткие границы (положения банков: всегда 0…1).
   */
  function niceBounds(lo, hi, opt) {
    const o = opt || {};
    const hasMin = fin(o.min), hasMax = fin(o.max);
    const r = (v) => (Math.abs(v) < 1e-12 ? 0 : Number(v.toPrecision(12)));
    if (hasMin && hasMax) return { lo: r(o.min), hi: r(o.max) };
    if (!fin(lo) || !fin(hi)) return { lo: hasMin ? r(o.min) : 0, hi: hasMax ? r(o.max) : 1 };
    if (hasMin) lo = o.min;
    if (hasMax) hi = o.max;
    if (o.sym) { const a = Math.max(Math.abs(lo), Math.abs(hi)); lo = -a; hi = a; }
    /* Плоский сигнал не должен получать шкалу «от нуля до вдвое больше»:
       так дрожание в четвёртом знаке не увидеть, а концы шкалы всё равно
       подписаны абсолютными числами, поэтому узкое окно ничего не врёт. */
    const floorSpan = fin(o.floorSpan) ? o.floorSpan
      : Math.max(Math.abs(hi) * 0.02, Math.abs(lo) * 0.02, 1e-9);
    let span = hi - lo;
    if (!(span > floorSpan)) {
      const c = 0.5 * (lo + hi);
      span = floorSpan;
      lo = c - span / 2; hi = c + span / 2;
      if (hasMin) { lo = o.min; hi = lo + span; }
      if (hasMax) { hi = o.max; lo = hi - span; }
    }
    const pad = span * 0.10;
    let plo = hasMin ? o.min : lo - pad;
    let phi = hasMax ? o.max : hi + pad;
    if (o.sym) { const a = Math.max(Math.abs(plo), Math.abs(phi)); plo = -a; phi = a; }
    const step = niceStep(Math.max(phi - plo, 1e-300) / 4);
    let nlo = hasMin ? o.min : Math.floor(plo / step) * step;
    let nhi = hasMax ? o.max : Math.ceil(phi / step) * step;
    /* Физический предел величины (ход стержня 0…1, паросодержание 0…1):
       шкала за него не выходит, но и не растягивается на него насильно —
       иначе движение на 0,02 хода стало бы неразличимым, а концы шкалы
       подписаны абсолютно и без того не дают прочитать окно как «весь ход». */
    if (Array.isArray(o.clamp)) {
      if (nlo < o.clamp[0]) nlo = o.clamp[0];
      if (nhi > o.clamp[1]) nhi = o.clamp[1];
      if (!(nhi - nlo > 0) && fin(o.clamp[0]) && fin(o.clamp[1])) {
        nlo = o.clamp[0]; nhi = o.clamp[1];
      }
    }
    if (!(nhi - nlo > 0)) nhi = nlo + step;
    return { lo: r(nlo), hi: r(nhi) };
  }

    nudgeNote: L(
      'Press the same button on three presets and watch three different answers. +50 pcm is the same reactivity everywhere, but not the same number of dollars: on the fast plutonium core β_eff is far smaller, so the same insertion is a far larger fraction of prompt criticality. Inlet +5 K falls the power where the void coefficient is negative and RAISES it where it is positive.',
      'Натисніть ту саму кнопку на трьох пресетах і побачите три різні відповіді. +50 pcm — усюди та сама реактивність, але не та сама кількість доларів: у швидкій плутонієвій зоні β_eff значно менший, тож те саме введення — значно більша частка миттєвої критичності. Вхід +5 K опускає потужність там, де паровий коефіцієнт від’ємний, і ПІДІЙМАЄ там, де він додатний.',
      'Dieselbe Taste auf drei Presets, drei verschiedene Antworten. +50 pcm ist überall dieselbe Reaktivität, aber nicht dieselbe Zahl Dollar: im schnellen Plutoniumkern ist β_eff weit kleiner, dieselbe Zugabe ist also ein weit größerer Bruchteil der prompten Kritikalität. Eintritt +5 K senkt die Leistung, wo der Void-Koeffizient negativ ist, und HEBT sie, wo er positiv ist.',
      'Dezelfde knop op drie presets geeft drie verschillende antwoorden. +50 pcm is overal dezelfde reactiviteit, maar niet hetzelfde aantal dollar: in de snelle plutoniumkern is β_eff veel kleiner, dus dezelfde inbreng is een veel groter deel van de prompte kritikaliteit. Inlaat +5 K laat het vermogen dalen waar de voidcoëfficiënt negatief is en STIJGEN waar hij positief is.',
      'Le même bouton sur trois préréglages donne trois réponses différentes. +50 pcm, c’est partout la même réactivité, mais pas le même nombre de dollars : dans le cœur rapide au plutonium β_eff est bien plus petit, la même insertion représente donc une fraction bien plus grande de la criticité prompte. Entrée +5 K fait chuter la puissance là où le coefficient de vide est négatif et la fait MONTER là où il est positif.',
      'El mismo botón en tres preajustes da tres respuestas distintas. +50 pcm es la misma reactividad en todas partes, pero no el mismo número de dólares: en el núcleo rápido de plutonio β_eff es mucho menor, así que la misma inserción es una fracción mucho mayor de la criticidad inmediata. Entrada +5 K baja la potencia donde el coeficiente de vacío es negativo y la SUBE donde es positivo.'),

    physNote: L(
      'Change any of these and the console re-establishes the equilibrium: it re-trims the regulating bank to critical at the current setpoint and starts the strips again. β_eff and Λ in the panel below move at once — set the charge to pure Pu-239 and watch β_eff fall to about a third, or flip the void coefficient positive and drive the inlet up.',
      'Змініть будь-що з цього — і стенд відновлює рівновагу: підганяє регулювальний банк до критичного положення за поточної уставки й починає стрічки наново. β_eff і Λ у панелі нижче зміняться відразу — поставте чистий Pu-239 і подивіться, як β_eff падає втричі, або зробіть паровий коефіцієнт додатним і підніміть вхід.',
      'Ändern Sie eines davon, stellt der Stand das Gleichgewicht neu her: er trimmt die Regelgruppe beim aktuellen Sollwert wieder auf kritisch und beginnt die Streifen neu. β_eff und Λ in der Tafel darunter ändern sich sofort — stellen Sie reines Pu-239 ein und sehen Sie β_eff auf etwa ein Drittel fallen, oder drehen Sie den Void-Koeffizienten ins Positive und fahren den Eintritt hoch.',
      'Wijzig hiervan iets en de opstelling herstelt het evenwicht: zij trimt de regelgroep bij het huidige instelpunt weer kritisch en begint de stroken opnieuw. β_eff en Λ in het paneel hieronder veranderen meteen — zet de lading op zuiver Pu-239 en zie β_eff naar ongeveer een derde zakken, of maak de voidcoëfficiënt positief en jaag de inlaat omhoog.',
      'Modifiez l’un d’eux et le banc rétablit l’équilibre : il ramène le groupe de régulation au point critique pour la consigne courante et recommence les bandes. β_eff et Λ dans le panneau ci-dessous bougent aussitôt — mettez une charge de Pu-239 pur et voyez β_eff tomber au tiers, ou passez le coefficient de vide au positif et montez la température d’entrée.',
      'Cambie cualquiera de ellos y el banco restablece el equilibrio: vuelve a ajustar el banco regulador al punto crítico para la consigna actual y reinicia las bandas. β_eff y Λ en el panel de abajo cambian al instante — ponga carga de Pu-239 puro y vea caer β_eff a un tercio, o invierta el coeficiente de vacío a positivo y suba la entrada.'),
    notFeasible: L(

      'Жодне положення стрижнів не робить цю зону критичною за поточної уставки: рівновага, якої вимагають параметри, лежить поза ходом банку. Стенд стартує там, де може, і каже про це, а не вдає критичність.',
      'Keine Stabstellung macht diesen Kern beim aktuellen Sollwert kritisch: das von den Parametern verlangte Gleichgewicht liegt außerhalb des Stabwegs. Der Stand startet, wo er kann, und sagt es, statt Kritikalität vorzutäuschen.',
      'Geen enkele staafstand maakt deze kern kritisch bij het huidige instelpunt: het door de parameters gevraagde evenwicht ligt buiten de staafslag. De opstelling start waar zij kan en meldt dat, in plaats van kritikaliteit voor te wenden.',

    secNote: L(
      'Steam generator and turbine, in relative units of nominal core power. The steam flow is what the governor valve passes at the current SG pressure, so it follows the core rather than being commanded independently: move the rods and the turbine follows within a loop transit. Feedwater is assumed balanced against steam flow — there is no SG level, no steam line dynamics, no bypass and no Rankine cycle here.',
      'Парогенератор і турбіна у відносних одиницях номінальної потужності зони. Витрата пари — це те, що клапан пропускає за нинішнього тиску в ПГ, тому вона йде за зоною, а не задається окремо: посуньте стрижні, і турбіна відгукнеться за час обходу петлі. Живлення вважається збалансованим за витратою пари — рівня в ПГ, динаміки паропроводу, байпаса й циклу Ренкіна тут немає.',
      'Dampferzeuger und Turbine, in relativen Einheiten der nominalen Kernleistung. Der Dampfstrom ist das, was das Regelventil beim aktuellen DE-Druck durchlässt; er folgt also dem Kern und wird nicht unabhängig vorgegeben: bewegen Sie die Stäbe, und die Turbine folgt binnen eines Schleifenumlaufs. Das Speisewasser gilt als dem Dampfstrom nachgeführt — DE-Füllstand, Frischdampfdynamik, Umleitstation und Rankine-Kreis fehlen hier.',
      'Stoomgenerator en turbine, in relatieve eenheden van het nominale kernvermogen. De stoomstroom is wat de regelklep bij de huidige SG-druk doorlaat en volgt dus de kern in plaats van los te worden gestuurd: verzet de staven en de turbine volgt binnen één kringomloop. Voedingwater wordt verondersteld de stoomstroom te volgen — SG-niveau, stoomleidingdynamica, bypass en Rankine-cyclus ontbreken hier.',
      'Générateur de vapeur et turbine, en unités relatives de la puissance nominale du cœur. Le débit de vapeur est ce que la vanne de réglage laisse passer à la pression GV du moment : il suit donc le cœur au lieu d’être commandé séparément — bougez les barres et la turbine suit en un temps de tour de boucle. L’eau alimentaire est supposée équilibrée sur le débit de vapeur ; ni niveau GV, ni dynamique de la ligne vapeur, ni contournement, ni cycle de Rankine ici.',
      'Generador de vapor y turbina, en unidades relativas de la potencia nominal del núcleo. El caudal de vapor es lo que la válvula de regulación deja pasar a la presión actual del GV, de modo que sigue al núcleo en vez de mandarse aparte: mueva las barras y la turbina responde en un tiempo de recorrido del lazo. El agua de alimentación se supone equilibrada con el vapor; aquí no hay nivel de GV, ni dinámica de la línea de vapor, ni bypass, ni ciclo de Rankine.'),

    lblDrum: L('Steam drum', 'Барабан-сепаратор', 'Dampftrommel',

    drumNote: L(
      'Direct cycle: the core boils and its steam goes straight to the turbine through the drum. The drum pressure IS the core pressure, so the saturation temperature is a state, not a parameter — power raises the pressure, the pressure raises T_sat, and T_sat suppresses void. That is the loop a boiling core actually runs on; without it a positive void coefficient only ever pushes one way. No drum level, no feedwater flow, no downcomer or natural-circulation dynamics here.',
      'Прямий цикл: зона кипить, і її пара йде просто на турбіну через барабан. Тиск барабана — це тиск зони, тому температура насичення є станом, а не параметром: потужність піднімає тиск, тиск піднімає T_sat, а T_sat давить паровміщення. Саме на цій петлі й тримається киплячий апарат; без неї додатний пустотний коефіцієнт штовхає лише в один бік. Рівня в барабані, витрати живлення й динаміки опускних тут немає.',
      'Direktkreislauf: der Kern siedet, sein Dampf geht über die Trommel direkt zur Turbine. Der Trommeldruck IST der Kerndruck, also ist die Sättigungstemperatur ein Zustand und kein Parameter — Leistung hebt den Druck, der Druck hebt T_sat, und T_sat drückt den Dampfgehalt. Auf dieser Schleife läuft ein siedender Kern wirklich; ohne sie schiebt ein positiver Dampfblasenkoeffizient nur in eine Richtung. Trommelfüllstand, Speisewasserstrom und Fallrohrdynamik fehlen hier.',
      'Direct circuit: de kern kookt en zijn stoom gaat via de drum recht naar de turbine. De drumdruk IS de kerndruk, dus de verzadigingstemperatuur is een toestand en geen parameter — vermogen verhoogt de druk, de druk verhoogt T_sat, en T_sat onderdrukt de dampfractie. Op die lus draait een kokende kern echt; zonder haar duwt een positieve dampcoëfficiënt maar één kant op. Drumniveau, voedingwaterdebiet en valpijpdynamica ontbreken hier.',
      'Cycle direct : le cœur bout et sa vapeur va droit à la turbine par le ballon. La pression du ballon EST la pression du cœur, donc la température de saturation est un état et non un paramètre — la puissance monte la pression, la pression monte T_sat, et T_sat écrase le taux de vide. C’est la boucle sur laquelle tourne réellement un cœur bouillant ; sans elle un coefficient de vide positif ne pousse que dans un sens. Ni niveau ballon, ni débit alimentaire, ni dynamique des descentes ici.',
      'Ciclo directo: el núcleo hierve y su vapor va directo a la turbina por el calderín. La presión del calderín ES la presión del núcleo, así que la temperatura de saturación es un estado y no un parámetro: la potencia sube la presión, la presión sube T_sat, y T_sat aplasta la fracción de huecos. Sobre ese lazo funciona de verdad un núcleo en ebullición; sin él un coeficiente de vacío positivo solo empuja en un sentido. Aquí no hay nivel de calderín, ni caudal de alimentación, ni dinámica de bajantes.'),

    composerNote: L(
      'Order-of-magnitude physics, not a lattice calculation: the table maps the four choices onto beta_eff, Lambda, the Doppler coefficient and the void coefficient so that known reactors land on their known values. The sign of the void coefficient is not a property of the coolant — it is a property of whether the coolant is ALSO the moderator. Water that both moderates and cools takes the moderation with it when it boils; water in a graphite stack was only an absorber, so losing it adds reactivity.',
      'Фізика порядку величини, а не розрахунок ґратки: таблиця переводить чотири вибори у beta_eff, Lambda, доплерівський і пустотний коефіцієнти так, щоб відомі апарати потрапляли у свої відомі значення. Знак пустотного ефекту — властивість не теплоносія, а того, чи є він ТАКОЖ сповільнювачем.',
      'Physik der Größenordnung, keine Gitterrechnung: die Tabelle bildet die vier Entscheidungen auf beta_eff, Lambda, Doppler- und Dampfblasenkoeffizient ab, so dass bekannte Reaktoren ihre bekannten Werte treffen. Das Vorzeichen des Dampfblasenkoeffizienten ist keine Eigenschaft des Kühlmittels, sondern der Frage, ob es AUCH der Moderator ist.',
      'Fysica op ordegrootte, geen roosterberekening: de tabel beeldt de vier keuzes af op beta_eff, Lambda, de Doppler- en de dampcoëfficiënt zo dat bekende reactoren op hun bekende waarden uitkomen. Het teken van de dampcoëfficiënt is geen eigenschap van het koelmiddel maar van de vraag of het OOK de moderator is.',
      'Physique en ordre de grandeur, pas un calcul de réseau : la table transforme les quatre choix en beta_eff, Lambda, coefficient Doppler et coefficient de vide de sorte que les réacteurs connus retombent sur leurs valeurs connues. Le signe du coefficient de vide n’est pas une propriété du caloporteur mais du fait qu’il soit AUSSI le modérateur.',
      'Física de orden de magnitud, no un cálculo de red: la tabla lleva las cuatro elecciones a beta_eff, Lambda, el coeficiente Doppler y el de vacío de modo que los reactores conocidos caigan en sus valores conocidos. El signo del coeficiente de vacío no es una propiedad del refrigerante sino de si este es TAMBIÉN el moderador.'),

    hintPrompt: L(
      'ρ reached β_eff. Lower the regulating bank — the console can put every control back where it stood at the last good state — and insert reactivity in smaller bites. On a low-β preset the same rod motion is worth many more dollars, which is why this happens sooner there.',
      'ρ досягла β_eff. Опустіть регулювальний банк — стенд може повернути всі органи туди, де вони стояли в останньому справному стані, — і вводьте реактивність меншими порціями. На пресеті з малим β той самий хід стрижня коштує значно більше доларів, тому тут це стається раніше.',
      'ρ hat β_eff erreicht. Regelgruppe einfahren — der Stand kann alle Steller auf den letzten guten Zustand zurücksetzen — und Reaktivität in kleineren Portionen zugeben. Bei kleinem β ist dieselbe Stabbewegung viel mehr Dollar wert, deshalb passiert es dort früher.',
      'ρ heeft β_eff bereikt. Breng de regelgroep omlaag — de opstelling kan alle stellers terugzetten naar de laatste goede toestand — en voeg reactiviteit in kleinere porties toe. Bij kleine β is dezelfde staafbeweging veel meer dollar waard, vandaar dat het daar eerder gebeurt.',
      'ρ a atteint β_eff. Abaissez le groupe de régulation — le banc peut remettre tous les organes dans le dernier état sain — et insérez la réactivité par plus petites doses. À faible β le même déplacement vaut bien plus de dollars, d’où la survenue plus rapide.',
      'ρ alcanzó β_eff. Baje el banco regulador — el banco puede devolver todos los mandos al último estado sano — e inserte reactividad en dosis menores. Con β pequeño el mismo movimiento vale muchos más dólares, por eso ocurre antes.'),
    hintSub: L(
      'The power collapsed to the floor of the model. Raise the banks and use Reset: point kinetics has no external neutron source, so nothing that happens below the floor can be computed, only invented — and this console will not invent it.',
      'Потужність обвалилася на нижню межу моделі. Підійміть банки й натисніть «скинути в рівновагу»: у точковій кінетиці немає зовнішнього джерела нейтронів, тож нижче межі нічого не рахується, а лише вигадується — а цей стенд не вигадує.',
      'Die Leistung ist auf die Modellgrenze gefallen. Gruppen ziehen und zurücksetzen: die Punktkinetik hat keine externe Neutronenquelle, unterhalb der Grenze lässt sich nichts rechnen, nur erfinden — und dieser Stand erfindet nicht.',
      'Het vermogen is naar de modelondergrens gezakt. Trek de groepen omhoog en reset: puntkinetica kent geen externe neutronenbron, onder de grens valt niets te rekenen, alleen te verzinnen — en deze opstelling verzint niet.',
      'La puissance s’est effondrée au plancher du modèle. Remontez les groupes et réinitialisez : la cinétique ponctuelle n’a pas de source externe, sous le plancher rien ne se calcule, cela ne peut que s’inventer — et ce banc n’invente pas.',
      'La potencia se desplomó al suelo del modelo. Suba los bancos y reinicie: la cinética puntual no tiene fuente externa de neutrones, por debajo del suelo no se calcula nada, solo se inventa — y este banco no inventa.'),
    hintBand: L(
      'Nothing is wrong with the plant \u2014 this is a statement about the MODEL. The coolant temperature has moved far enough that the single linear coefficient alpha_C would now be worth more than 3000 pcm on its own, and a straight line extrapolated that far is arithmetic, not measured physics. It usually means an uncontrolled cooldown: the turbine kept drawing steam while the core stopped making heat. Bring the load and the core back into balance \u2014 close the turbine valve, or raise power \u2014 and the temperatures come back inside the band.',
      '\u0426\u0435 \u0440\u043e\u0437\u0445\u043e\u043b\u043e\u0434\u0436\u0435\u043d\u043d\u044f, \u0430 \u0440\u043e\u0437\u0445\u043e\u043b\u043e\u0434\u0436\u0435\u043d\u043d\u044f \u043f\u043e\u0432\u0435\u0440\u0442\u0430\u0454 \u0440\u0435\u0430\u043a\u0442\u0438\u0432\u043d\u0456\u0441\u0442\u044c. \u0422\u0443\u0440\u0431\u0456\u043d\u0430 \u0442\u044f\u0433\u043d\u0443\u043b\u0430 \u043f\u0430\u0440\u0443, \u043a\u043e\u043b\u0438 \u0437\u043e\u043d\u0430 \u0432\u0436\u0435 \u043d\u0435 \u0434\u0430\u0432\u0430\u043b\u0430 \u0442\u0435\u043f\u043b\u0430, \u0443\u0441\u0442\u0430\u043d\u043e\u0432\u043a\u0430 \u043e\u0445\u043e\u043b\u043e\u043b\u0430, \u0456 \u0432\u0456\u0434\u2019\u0454\u043c\u043d\u0438\u0439 \u043a\u043e\u0435\u0444\u0456\u0446\u0456\u0454\u043d\u0442 \u0434\u043e\u0440\u043e\u0433\u043e\u044e \u0441\u0442\u0430\u0432 \u0434\u043e\u0434\u0430\u0442\u043d\u0438\u043c \u0432\u043d\u0435\u0441\u043a\u043e\u043c. \u041a\u0441\u0435\u043d\u043e\u043d \u0442\u0443\u0442 \u043d\u0435 \u0432\u0440\u044f\u0442\u0443\u0454: \u0439\u043e\u043c\u0443 \u043f\u043e\u0442\u0440\u0456\u0431\u043d\u0456 \u0433\u043e\u0434\u0438\u043d\u0438, \u0430 \u0442\u0443\u0442 \u0445\u0432\u0438\u043b\u0438\u043d\u0438. \u0421\u043f\u043e\u0447\u0430\u0442\u043a\u0443 \u0437\u0430\u043a\u0440\u0438\u0439\u0442\u0435 \u043a\u043b\u0430\u043f\u0430\u043d \u0442\u0443\u0440\u0431\u0456\u043d\u0438, \u043f\u043e\u0442\u0456\u043c \u0440\u0443\u0445\u0430\u0439\u0442\u0435 \u0441\u0442\u0440\u0438\u0436\u043d\u0456.',
      'Das ist eine Abk\u00fchlung, und eine Abk\u00fchlung gibt Reaktivit\u00e4t zur\u00fcck. Die Turbine zog weiter Dampf, w\u00e4hrend der Kern keine W\u00e4rme mehr lieferte; die Anlage k\u00fchlte aus, und der negative Moderatorkoeffizient wurde unterwegs zum positiven Beitrag. Xenon hilft hier nicht: es braucht Stunden, das hier dauerte Minuten. Erst das Turbinenventil schlie\u00dfen, dann St\u00e4be fahren.',
      'Dit is een afkoeling, en afkoeling geeft reactiviteit terug. De turbine bleef stoom trekken terwijl de kern geen warmte meer leverde; de installatie koelde af en de negatieve moderatorco\u00ebffici\u00ebnt werd onderweg een positieve bijdrage. Xenon redt u hier niet: dat vergt uren, dit duurde minuten. Sluit eerst de turbineklep, beweeg daarna de staven.',
      'C\u2019est un refroidissement, et un refroidissement restitue de la r\u00e9activit\u00e9. La turbine a continu\u00e9 \u00e0 tirer de la vapeur alors que le c\u0153ur ne fournissait plus de chaleur ; l\u2019installation s\u2019est refroidie et le coefficient mod\u00e9rateur n\u00e9gatif est devenu un apport positif en chemin. Le x\u00e9non ne vous sauve pas ici : il lui faut des heures, ceci a pris des minutes. Fermez d\u2019abord la vanne turbine, ensuite bougez les barres.',
      'Esto es un enfriamiento, y un enfriamiento devuelve reactividad. La turbina sigui\u00f3 tirando vapor mientras el n\u00facleo dejaba de dar calor; la instalaci\u00f3n se enfri\u00f3 y el coeficiente moderador negativo se convirti\u00f3 en aporte positivo por el camino. El xen\u00f3n no le salva aqu\u00ed: necesita horas y esto llev\u00f3 minutos. Cierre primero la v\u00e1lvula de turbina y luego mueva las barras.'),
    hintBoil: L(
      'Raise the flow or lower the power until the void fraction comes back inside the declared range. There is no thermal-hydraulic code behind this strip, so beyond that range there is nothing to draw.',
      'Підійміть витрату або опустіть потужність, доки паровміщення не повернеться в оголошений діапазон. За цією стрічкою немає теплогідравлічного коду, тож поза діапазоном малювати нічого.',
      'Durchsatz erhöhen oder Leistung senken, bis der Dampfgehalt wieder im erklärten Bereich liegt. Hinter diesem Streifen steckt kein thermohydraulischer Code, außerhalb gibt es nichts zu zeichnen.',
      'Verhoog het debiet of verlaag het vermogen tot de dampfractie weer in het verklaarde bereik ligt. Achter deze strook zit geen thermohydraulische code, daarbuiten valt niets te tekenen.',
      'Augmentez le débit ou baissez la puissance jusqu’à ramener le taux de vide dans le domaine déclaré. Il n’y a pas de code thermohydraulique derrière cette bande : au-delà, il n’y a rien à tracer.',
      'Suba el caudal o baje la potencia hasta que la fracción de huecos vuelva al rango declarado. Detrás de esta banda no hay código termohidráulico: fuera de ese rango no hay nada que dibujar.'),
    hintBudget: L(
      'Lower the time multiplier, or make the insertion smaller. The integrator ran out of sub-steps inside one macro step: the transient is faster than the step size allows, which is a statement about the arithmetic, not about the reactor.',

    limitsBody: L(
      'Point kinetics: no space, no flux tilt, no local xenon, no burn-up. The two rod banks are a MECHANISM shown in a point model, not a reproduction of any event. The strip is sampled at a finite interval in model time — excursions faster than that interval are integrated but not drawn. The multiplier moves model time only; the arithmetic is the same at ×1 and at ×1000, and where it cannot keep up the console says so instead of quietly slowing the clock.',
      'Точкова кінетика: без простору, без перекосів потоку, без локального ксенону, без вигоряння. Два банки стрижнів — це МЕХАНІЗМ, показаний у точковій моделі, а не відтворення якоїсь події. Стрічка пишеться зі скінченним кроком за модельним часом — швидші за цей крок сплески інтегруються, але не малюються. Множник рухає лише модельний час; арифметика однакова на ×1 і на ×1000, а де вона не встигає, стенд це каже, а не сповільнює годинник мовчки.',
      'Punktkinetik: kein Raum, keine Flussverformung, kein lokales Xenon, kein Abbrand. Die zwei Stabgruppen sind ein MECHANISMUS im Punktmodell, nicht die Nachbildung eines Ereignisses. Der Streifen wird mit endlichem Abstand in Modellzeit abgetastet — schnellere Ausschläge werden integriert, aber nicht gezeichnet. Der Zeitraffer bewegt nur die Modellzeit; die Arithmetik ist bei ×1 und ×1000 dieselbe, und wo sie nicht mitkommt, sagt es der Stand, statt die Uhr still zu verlangsamen.',
      'Puntkinetica: geen ruimte, geen fluxscheefstand, geen lokaal xenon, geen opbrand. De twee staafgroepen zijn een MECHANISME in een puntmodel, geen weergave van enige gebeurtenis. De strook wordt met een eindige stap in modeltijd bemonsterd — snellere uitslagen worden geïntegreerd maar niet getekend. De vermenigvuldiger beweegt alleen de modeltijd; de rekenkunde is bij ×1 en ×1000 dezelfde, en waar zij het niet bijhoudt zegt de opstelling dat, in plaats van de klok stil te vertragen.',
      'Cinétique ponctuelle : pas d’espace, pas de déformation du flux, pas de xénon local, pas d’usure. Les deux groupes de barres sont un MÉCANISME montré dans un modèle ponctuel, non la reproduction d’un événement. La bande est échantillonnée à pas fini en temps modèle — les excursions plus rapides sont intégrées mais non tracées. Le multiplicateur ne déplace que le temps modèle ; l’arithmétique est la même à ×1 et à ×1000, et là où elle ne suit pas, le banc le dit au lieu de ralentir l’horloge en silence.',
      'Cinética puntual: sin espacio, sin desviación del flujo, sin xenón local, sin quemado. Los dos bancos de barras son un MECANISMO mostrado en un modelo puntual, no la reproducción de suceso alguno. La banda se muestrea con paso finito en tiempo del modelo — las excursiones más rápidas se integran pero no se dibujan. El multiplicador mueve solo el tiempo del modelo; la aritmética es la misma a ×1 y a ×1000, y donde no da abasto el banco lo dice en vez de frenar el reloj en silencio.'),

  const tx = (key, lang) => (T[key] ? (T[key][lang] || T[key].en) : key);
  const pick = (block, lang) => (block ? (block[lang] || block.en || '') : '');
  /* Подстановка {0}, {1}, ... — как в equilib.js; строка с числом внутри
     переводится целиком, а не склеивается из кусков по порядку слов. */
  const fillTx = (str, args) => String(str).replace(/\{(\d)\}/g,
    (m, i) => (args && args[+i] !== undefined ? args[+i] : m));
  const txf = (key, lang, args) => fillTx(tx(key, lang), args);

  const CHANNELS = ['power', 'phi', 'rhoXe', 'Tf', 'Tout', 'voidFrac',

  /* Коэффициент размножения из реактивности. Определение, а не приближение:
     rho = (k - 1)/k, значит k = 1/(1 - rho). Пишется ЯВНО, потому что
     k = 1 + rho — это разложение, которое врёт как раз там, где интересно:
     при rho = -0,25 (глубоко подкритична) оно даёт 0,750 вместо 0,800. */
  const keffOf = (rhoPcm) => {
    const r = num(rhoPcm, 0) * 1e-5;
    return r < 1 ? 1 / (1 - r) : Infinity;
  };

     5a. Живая мнемосхема (§5.1) — геометрия и разметка

     ===================================================================== */

  const SVGNS = 'http://www.w3.org/2000/svg';

  function attrs(a) {
    let s = '';
    for (const k of Object.keys(a)) {

      if (v === null || v === undefined || v === false) continue;
      s += ' ' + k + '="' + esc(v) + '"';

      'letter-spacing': p.ls || null,

  const RAMP = [[42, 76, 138], [70, 130, 180], [150, 180, 200], [222, 205, 170],

    const i = Math.min(RAMP.length - 2, Math.floor(x));
    const g = x - i, a = RAMP[i], b = RAMP[i + 1];
    const m = (j) => Math.round(a[j] + (b[j] - a[j]) * g);
    return 'rgb(' + m(0) + ',' + m(1) + ',' + m(2) + ')';

     и «зона разгоняется» не должны меняться местами при переключении
     светлой и тёмной темы. */
  const CRIT_RAMP = [

    [-0.25, [ 96, 160, 154]],
    [ 0.0, [ 45, 158,  94]],
    [ 0.3, [217, 165,  33]],
    [ 0.7, [224,  86,  31]],
    [ 1.0, [110,  11,  18]]
  ];
  function critRGB(dollars) {
    const d = fin(dollars) ? dollars : -4;
    if (d <= CRIT_RAMP[0][0]) return CRIT_RAMP[0][1];
    const last = CRIT_RAMP[CRIT_RAMP.length - 1];
    if (d >= last[0]) return last[1];
    for (let i = 1; i < CRIT_RAMP.length; i++) {
      if (d <= CRIT_RAMP[i][0]) {
        const a = CRIT_RAMP[i - 1], b = CRIT_RAMP[i];
        const g = (d - a[0]) / (b[0] - a[0]);
        return [0, 1, 2].map((j) => Math.round(a[1][j] + (b[1][j] - a[1][j]) * g));

    /* --- горячая нитка: из зоны в парогенератор --- */
    const DOUT = 'M' + (CORE.x + CORE.w) + ' ' + HOT_Y + ' H' + HOT_RISE + ' V' + HOT_UP

    /* --- второй контур: ПГ, паропровод, турбина, конденсатор, возврат --- */
    s.push(gtag('g', { 'data-k': 'sec' }, (function () {
      const q = [];
      /* корпус ПГ */
      q.push(gtag('rect', { x: SG.x, y: SG.y, width: SG.w, height: SG.h, rx: 26,
                            fill: S.PANEL, stroke: S.INK, 'stroke-width': 1.5 }));
      q.push(gtag('rect', { 'data-k': 'sg.fill', x: SG.x + 3, y: SG.y + SG.h * 0.42,
                            width: SG.w - 6, height: SG.h * 0.56 - 3, rx: 20,
                            fill: S.COLD, 'fill-opacity': 0.35 }));
      /* трубный пучок: U-образные нитки первого контура */
      let tub = '';
      for (let i = 0; i < 3; i++) {
        const r = 9 + i * 9;
        tub += (gtag('path', { d: 'M' + (SG_CX - r) + ' ' + (SG.y + 24)
                                 + ' V' + (SG.y + SG.h - 30 - i * 8)
                                 + ' a' + r + ' ' + r + ' 0 0 0 ' + (2 * r) + ' 0'
                                 + ' V' + (SG.y + 24),
                              fill: 'none', stroke: S.WARM, 'stroke-width': 1.6,
                              opacity: 0.75 }));
      }
      q.push(gtag('g', { 'data-k': 'sg.tubes' }, tub));
      /* Сепаратор прямого цикла: жалюзи в паровом объёме барабана. Рисуются
         вместо пучка, потому что теплообменника там нет — есть разделение
         пара и воды. */
      let sep = '';
      for (let i = 0; i < 4; i++) {
        const xx = SG.x + 14 + i * 18;
        sep += gtag('path', { d: 'M' + xx + ' ' + (SG.y + 34) + 'l9 10l-9 10',
                              fill: 'none', stroke: S.B3, 'stroke-width': 1.6,
                              opacity: 0.8 });
      }
      q.push(gtag('g', { 'data-k': 'sg.sep', opacity: 0 }, sep));
      /* пузырьки пара в ПГ */
      for (let i = 0; i < 6; i++) {
        q.push(gtag('circle', { 'data-k': 'sg.b' + i, cx: SG.x + 14 + (i * 13) % (SG.w - 28),
                                cy: SG.y + SG.h - 20, r: 2.4, fill: 'none',
                                stroke: S.COLD, 'stroke-width': 0.9, opacity: 0 }));
      }
      q.push(stx('sg.cap', SG_CX, SG.y + SG.h + 18, '', { size: 10, anchor: 'middle' }));
      q.push(stx('sg.val', SG_CX, SG.y + SG.h + 34, '—',

      q.push(stx('sg.p', SG_CX, SG.y + SG.h + 48, '',
                 { size: 9.5, anchor: 'middle', tab: true }));

      q.push(gtag('path', { d: DST, fill: 'none', stroke: S.LINE, 'stroke-width': 11,
                            'stroke-linejoin': 'round' }));
      q.push(gtag('path', { 'data-k': 'sec.steam', d: DST, fill: 'none', stroke: S.B3,

      q.push(gtag('path', { d: 'M' + (TURB.x - 34) + ' ' + (STEAM_Y - 9)

                               + 'L' + (TURB.x + TURB.w) + ' ' + TURB.y
                               + 'L' + (TURB.x + TURB.w) + ' ' + (TURB.y + TURB.h)

    /* --- холодная нитка: из ПГ обратно на вход зоны --- */
    const DCOLD = 'M' + (SG.x + SG.w) + ' ' + SG_NOZ + ' H' + COLD_DROP + ' V' + COLD_Y

    s.push(stx('sec.off', SG_CX, SG.y + SG.h + 34, '',
               { size: 10, anchor: 'middle', fill: S.MUT }));

    /* --- столбцы: мощность (ручка), температура топлива, паросодержание --- */
    for (const c of COLS) {
      s.push(gtag('rect', { x: c.x, y: c.top, width: c.w, height: c.h, rx: 3,

      s.push(stx(c.key + '.val', c.cx, c.bot + 18, '—',
                 { size: 10.5, anchor: 'middle', bold: true, fill: S.INK, tab: true }));
    }
    /* уставка мощности / ручка на шкале мощности */
    s.push(gtag('g', { 'data-k': 'pow.set' },

    /* --- блок равновесия и упоров --- */
    s.push(gtag('rect', { x: EQB.x, y: EQB.y, width: EQB.w, height: EQB.h, rx: 8,

       Одна строка называет самую крупную обратную связь и её знак — и

    s.push(stx('eq.why', EQB.x + 10, EQB.y + 62, '', { size: 9, bold: true }));

    s.push(stx('eq.stop0', EQB.x + 10, EQB.y + 92, '', { size: 8, fill: S.BAD }));
    s.push(stx('eq.stop1', EQB.x + 10, EQB.y + 103, '', { size: 8, fill: S.BAD }));
    s.push(stx('eq.stop2', EQB.x + 10, EQB.y + 114, '', { size: 8, fill: S.BAD }));

    /* --- чипы «что чем управляет» --- */
    for (let i = 0; i < CHIP.length; i++) {
      s.push(gtag('rect', { 'data-k': 'chip' + i + '.b', x: CHIP[i].x, y: CHIP_Y,

                            fill: S.BG, stroke: S.LINE }));
      s.push(stx('chip' + i + '.t', CHIP[i].x + CHIP[i].w / 2, CHIP_Y + 15, '',
                 { size: 9, anchor: 'middle', bold: true }));
    }

    /* --- баланс реактивности --- */
    s.push(stx('rho.cap', 130, RHO.capY, '', { size: 10, bold: true, fill: S.INK }));
    s.push(gtag('line', { x1: RHO.cx, y1: RHO.y0, x2: RHO.cx, y2: RHO.totY + RHO.totH + 4,
                          stroke: S.MUT, 'stroke-width': 1.2 }));
    for (let i = 0; i < RHO_KEYS.length; i++) {
      s.push(gtag('rect', { x: 112, y: RHO.rows[i], width: 8, height: RHO.rowH, rx: 1.5,
                            fill: RHO_KEYS[i][2] }));
      s.push(stx('rho.l' + i, 108, RHO.rows[i] + RHO.rowH - 0.5, '',
                 { size: 8.5, anchor: 'end' }));
      /* Поводок от подписи к нулевой оси: без него между именем вклада и его
         полоской полтораста пикселей пустоты, и строку легко перепутать. */
      s.push(gtag('line', { x1: 124, y1: RHO.rows[i] + RHO.rowH / 2,
                            x2: RHO.cx - 2, y2: RHO.rows[i] + RHO.rowH / 2,
                            stroke: S.LINE, 'stroke-width': 1,
                            'stroke-dasharray': '1 4' }));
      s.push(gtag('rect', { 'data-k': 'rho.b' + i, x: RHO.cx, y: RHO.rows[i], width: 0,
                            height: RHO.rowH, fill: RHO_KEYS[i][2] }));
    }
    s.push(stx('rho.lt', 108, RHO.totY + RHO.totH - 2, '', { size: 8.5, anchor: 'end' }));
    s.push(gtag('line', { x1: 124, y1: RHO.totY + RHO.totH / 2, x2: RHO.cx - 2,
                          y2: RHO.totY + RHO.totH / 2, stroke: S.LINE,
                          'stroke-width': 1, 'stroke-dasharray': '1 4' }));
    s.push(gtag('rect', { 'data-k': 'rho.bt', x: RHO.cx, y: RHO.totY, width: 0,
                          height: RHO.totH, fill: S.INK, 'fill-opacity': 0.78 }));
    for (const sgn of ['p', 'm']) {
      s.push(gtag('line', { 'data-k': 'rho.beta' + sgn, x1: RHO.cx, y1: RHO.y0 - 2,
                            x2: RHO.cx, y2: RHO.totY + RHO.totH + 4, stroke: S.BAD,
                            'stroke-width': 1.3, 'stroke-dasharray': '3 3', opacity: 0 }));
      s.push(stx('rho.betat' + sgn, RHO.cx, RHO.y0 - 5, '',

    }
    s.push(stx('rho.el', RHO.cx - RHO.half, RHO.endY, '', { size: 8.5 }));
    s.push(stx('rho.er', RHO.cx + RHO.half, RHO.endY, '', { size: 8.5, anchor: 'end' }));
    s.push(stx(null, RHO.cx, RHO.endY, '0', { size: 8.5, anchor: 'middle' }));

    /* --- ручки: прозрачные зоны захвата поверх всего --- */
    const hit = (id, r) => gtag('rect', {
      'data-h': id, class: 'rcon-h', x: r.x, y: r.y, width: r.w, height: r.h,
      fill: 'transparent', rx: 6, role: 'slider', tabindex: 0,

    s.push(hit('reg', BANKS[0].hit));
    s.push(hit('tipd', BANKS[1].hit));
    s.push(hit('flow', VLV.hit));
    s.push(hit('tin', TH.hit));
    s.push(hit('pow', { x: COL.pow.x - 5, y: COL.pow.top - 6,
                        w: COL.pow.w + 24, h: COL.pow.h + 12 }));

    /* --- плашка отказа поверх картинки --- */
    /* Плашка аварии. Затемняет схему НЕ полностью — расплав должен быть
       виден сквозь неё, иначе смотреть не на что. */
    s.push(gtag('g', { 'data-k': 'sfail', opacity: 0, 'pointer-events': 'none' },
      gtag('rect', { 'data-k': 'sfail.veil', x: 0, y: 0, width: SW, height: SH,
                     fill: '#150c06', 'fill-opacity': 0.44 })
      + gtag('rect', { x: 150, y: 402, width: 820, height: 132, rx: 14, fill: S.PANEL,
                       stroke: S.BAD, 'stroke-width': 3 })
      + gtag('rect', { 'data-k': 'sfail.bar', x: 150, y: 402, width: 820, height: 6,
                       rx: 3, fill: S.BAD })
      + stx('sfail.h', 176, 434, '', { size: 16, bold: true, fill: S.BAD, ls: '0.06em' })
      + gtag('text', { 'data-k': 'sfail.t', x: 176, y: 458, 'font-size': 11.5,
                       fill: S.INK }, '')));

    return '<svg class="rcon-svg" viewBox="0 0 ' + SW + ' ' + SH + '" '
      + 'preserveAspectRatio="xMidYMid meet" role="group" '
      + 'aria-labelledby="' + ids.schemeCap + '" '
      + 'aria-describedby="' + ids.schemeAlt + '" data-k="svg">' + s.join('') + '</svg>';
  }

  /* =====================================================================
     5b. Второй контур: парогенератор и турбина

     ЗАЧЕМ. Без второго контура расход и температура на входе — две
     независимые ручки, которые оператор крутит руками, и получается стенд,
     где «двигаю стержни — меняется температура на выходе», а больше не
     меняется НИЧЕГО. На станции так не бывает: тепло из первого контура
     уходит в парогенератор, оттуда пар идёт на турбину, и именно баланс
     «сколько зона дала — сколько турбина забрала» задаёт давление в ПГ, а
     через него — температуру, с которой теплоноситель возвращается в зону.
     Стержни двигают мощность, второй контур двигает всё остальное.

     ЧТО СЧИТАЕТСЯ.

     Теплосъём в ПГ — метод эффективности (ε-NTU) для однопоточного
     теплообменника с КИПЯЩЕЙ второй стороной, то есть со стороной
     постоянной температуры:

         NTU(w) = NTU0 w^(-0.2),      eps(w) = 1 - exp(-NTU(w)),
         Q_sg   = w (T_вых - T_s) eps / dTcool          [доли номинала],
         T_хол  = T_s + (T_вых - T_s) exp(-NTU).

     Показатель -0,2 — это не подгонка: UA трубного пучка идёт как w^0.8
     (Диттус — Бёльтер), делится на W c_p ~ w, остаётся w^-0.2. Формула
     точная для своей задачи, не линеаризация, и она безусловно устойчива:
     eps в (0,1) при любом расходе, поэтому холодная нитка НИКОГДА не
     выходит за пределы [T_s, T_вых].

     Холодная нитка возвращается в зону с транспортным запаздыванием
     tau_leg (обход петли), потому что вода едет по трубам, а не телепортируется:

         tau_leg dT_вх/dt = T_хол - T_вх.

     Вторая сторона ПГ — один узел с теплоёмкостью металла и воды:

         C_s dT_s/dt = Q_sg - Q_пар.

     Расход пара через регулирующий клапан турбины в критическом режиме
     пропорционален давлению перед клапаном:

         Q_пар = Y p_s / p_s0,

     а давление насыщения берётся из Клапейрона — Клаузиуса относительно
     номинальной точки (T в кельвинах):

         p_s/p_s0 = exp(B (1/T_s0 - 1/T_s)),   B = h_fg M / R.

     Y — уставка клапана, 1 = номинал. Электрическая мощность — Q_пар,
     умноженная на КПД цикла; это ОЦЕНКА, а не расчёт цикла Ренкина.

     ЧЕГО ЗДЕСЬ НЕТ, и что поэтому нельзя вычитывать из результата:
     уровня в ПГ и питательного насоса (питательная вода принимается
     сбалансированной по расходу пара), паросодержания и сепараторов,
     динамики самого паропровода, отсечных клапанов, байпаса на конденсатор,
     подогревателей, влажности и КПД в функции нагрузки, любых уравнений
     самой турбины. Второй контур здесь — граничное условие для зоны, а не
     тепловая схема станции.

     СОГЛАСОВАНИЕ С НОМИНАЛОМ. Свободный параметр ровно один — недогрев
     approach = T_вх0 - T_s0. Из него eps0 = dTcool/(dTcool + approach), и
     тогда при n = 1, w = 1, Y = 1 весь контур стоит В ТОЧНОСТИ в той точке,
     в которой стоял бы стенд без второго контура: T_вх = T_вх0 ровно.
     Поэтому включение второго контура НЕ сдвигает исходное равновесие.
     ===================================================================== */

  const SEC_DEF = {
    approach: 15,      // K, недогрев ПГ: T_вх0 - T_s0
    tauLeg: 8,         // s, обход петли (горячая + холодная нитка)
    cSG: 0.11,         // s/K на долю номинальной мощности (металл + вода ПГ)
    clapB: 3400,       // K, h_fg M / R для воды около 6 МПа
    eta: 0.33,         // КПД цикла, оценка
    pMW: 3000,         // МВт тепловых, для показаний в мегаваттах
    pNomMPa: 6.0,      // МПа, номинальное давление в ПГ
    /* --- прямой цикл (барабан-сепаратор) --- */
    subcool: 0,        // K, недогрев на входе в зону; 0 = взять T_sat - T_вх0
    cDrum: 0.25,       // s/K, инвентарь барабана и опускных: воды много
    /* Противодавление конденсатора в долях номинального давления. 5 кПа при
       6 МПа — это 0,08 %; берётся 0,5 % с запасом на паропровод. Нужно не
       для красоты: без него расход пара шёл как Y·p/p_0 и НИКОГДА не
       обращался в ноль, поэтому турбина продолжала тянуть пар из
       остывающего контура сколь угодно долго. */
    pCondRel: 0.005
  };
  const SEC_Y_MIN = 0, SEC_Y_MAX = 1.2;

  const secParam = (p, k) => num(p && p['sec' + k.charAt(0).toUpperCase() + k.slice(1)],
                                 SEC_DEF[k]);

  /* Прямой цикл: пар из зоны идёт на турбину сам, промежуточного контура нет,
     а между зоной и турбиной стоит БАРАБАН-СЕПАРАТОР. */
  const secIsDrum = (p) => {
    const v = p && p.secKind;
    return v === 'drum' || v === 1 || v === '1';
  };

  /**
   * Постоянные проектной точки второго контура для данного пресета.
   *
   * ref — состояние контура, если оно есть. Для БАРАБАНА это обязательно:
   * проектная T_s0 у прямого цикла берётся из p.Tsat, а p.Tsat при работе
   * ПЕРЕПИСЫВАЕТСЯ текущей температурой барабана (в том и смысл: давление
   * барабана и есть давление зоны). Читая её же обратно, мы получили бы
   * p/p_0 = 1 тождественно — клапан всегда пропускал бы ровно уставку, и
   * связь «давление → расход пара» исчезла бы, оставшись только в
   * комментарии. Поэтому проектное значение замораживается в ref.Tsat0 при
   * инициализации и берётся оттуда.
   */
  function secDesign(p, ref) {
    const Tin0 = num(p.Tin0, 290);
    const dTc = Math.max(num(p.dTcool, 30), 1e-6);
    const drum = secIsDrum(p);
    /* У прямого цикла проектная точка задана не недогревом ПГ, а давлением
       в барабане: T_s0 — это T_sat самой зоны, они физически одно и то же
       давление. Недогрев на входе — то, что даёт смешение насыщенной воды
       из барабана с питательной. */
    const Tsat0 = (ref && fin(ref.Tsat0)) ? ref.Tsat0 : num(p.Tsat, 0);
    const appr = Math.max(secParam(p, 'approach'), 1e-6);
    const Ts0 = drum ? Tsat0 : Tin0 - appr;        // °C
    const sub = drum
      ? (secParam(p, 'subcool') > 0 ? secParam(p, 'subcool') : Math.max(Ts0 - Tin0, 0))
      : 0;
    const eps0 = dTc / (dTc + appr);               // ≤ 1 по построению
    const ntu0 = -Math.log(1 - Math.min(eps0, 1 - 1e-12));
    return { Tin0, dTc, Ts0, eps0, ntu0, drum, subcool: sub,
             tauLeg: Math.max(secParam(p, 'tauLeg'), 1e-3),
             cSG: Math.max(drum ? secParam(p, 'cDrum') : secParam(p, 'cSG'), 1e-6),
             clapB: secParam(p, 'clapB'),
             eta: secParam(p, 'eta'), pMW: secParam(p, 'pMW'),
             pNom: secParam(p, 'pNomMPa'),
             pC: Math.min(Math.max(secParam(p, 'pCondRel'), 0), 0.5) };
  }

  /** Относительное давление по температуре насыщения (Клапейрон — Клаузиус). */
  function secPressRel(Ts, dz) {
    const a = Ts + 273.15, b = dz.Ts0 + 273.15;
    if (!(a > 1) || !(b > 1)) return 1;
    return Math.exp(dz.clapB * (1 / b - 1 / a));
  }

  /**
   * Мгновенные потоки второго контура.
   *
   * ДВА КОНТУРА, ДВЕ СХЕМЫ.
   *
   * (1) Двухконтурная (ПГ). Теплосъём — ε-NTU с кипящей второй стороной;
   *     из ПГ вода возвращается в зону холоднее, чем пришла.
   *
   * (2) Прямой цикл (барабан). Между зоной и турбиной нет теплообменника —
   *     есть ЁМКОСТЬ. Пар, который сделала зона, копится в барабане; турбина
   *     через регулирующий клапан забирает столько, сколько пропускает
   *     клапан при нынешнем давлении. Разность идёт в давление:
   *
   *         C_d dT_s/dt = n − Q_пар,     Q_пар = Y·p(T_s)/p_0.
   *
   *     И вот главное, ради чего это вообще нужно: T_s барабана — ЭТО
   *     температура насыщения самой зоны, потому что давление у них общее.
   *     Значит появляется обратная связь, которой прежде не было вовсе:
   *
   *         расход вниз → паросодержание вверх → (при alpha_void > 0)
   *         реактивность вверх → мощность вверх → пара больше → давление
   *         вверх → T_sat вверх → паросодержание ВНИЗ.
   *
   *     Это не «ещё одна инерция» ради инерции: это та самая связь
   *     «мощность — давление — паросодержание», которая у настоящего
   *     кипящего аппарата и определяет, разойдётся он или нет. Без неё
   *     положительный пустотный коэффициент работал в одну сторону.
   *
   *     Вход в зону: насыщенная вода из барабана, разбавленная питательной,
   *     то есть T_вх = T_s − недогрев, с тем же запаздыванием по петле.
   *     Недогрева как функции расхода питательной воды здесь нет — уровня в
   *     барабане модель не считает (см. оговорки).
   */
  function secFlows(sec, p, Tout, w, Y, n) {
    const dz = secDesign(p, sec);
    const pRel = secPressRel(sec.Ts, dz);
    /* Закон клапана в критическом режиме, но С ПРОТИВОДАВЛЕНИЕМ: пар идёт,
       пока перед клапаном давление выше конденсаторного, и обращается в
       ноль ровно там, где перепада больше нет. Прежняя форма Y·p/p_0 в ноль
       не обращалась никогда, и турбина выкачивала тепло из установки до
       любых температур. В номинале ((1 - pC)/(1 - pC) = 1) точка проектная,
       бит в бит. */
    const Qst = Math.max(Y, 0) * Math.max(0, (pRel - dz.pC) / (1 - dz.pC));
    if (dz.drum) {
      const Qsg = num(n, 1);                       // всё тепло зоны идёт в пар
      return { dz, ntu: 0, eps: 1, Qsg, Tcold: sec.Ts - dz.subcool, pRel, Qst,
               pMPa: dz.pNom * pRel,
               mwTherm: Qsg * dz.pMW, mwElec: Qst * dz.pMW * dz.eta };
    }
    const ww = Math.max(w, 1e-6);
    const ntu = dz.ntu0 * Math.pow(ww, -0.2);
    const eps = 1 - Math.exp(-ntu);
    const Qsg = ww * (Tout - sec.Ts) * eps / dz.dTc;
    const Tcold = sec.Ts + (Tout - sec.Ts) * Math.exp(-ntu);
    return { dz, ntu, eps, Qsg, Tcold, pRel, Qst,
             pMPa: dz.pNom * pRel,
             mwTherm: Qsg * dz.pMW, mwElec: Qst * dz.pMW * dz.eta };
  }

  /** Один шаг второго контура. Экспоненциальный для нитки, явный для ёмкости. */
  function secStep(sec, dt, p, Tout, w, Y, n) {
    const f = secFlows(sec, p, Tout, w, Y, n);
    /* Ёмкость: шаг мал по сравнению с C/(dQ/dT), явная схема здесь устойчива
       с большим запасом, а точность держит тот же подшаг, что и ядро.
       Ограничение сверху на T_s у ПГ физическое: пар не может стать горячее
       горячей нитки. У барабана такого ограничения нет — там T_s и есть
       температура кипения зоны. */
    let Ts = sec.Ts + dt * (f.Qsg - f.Qst) / f.dz.cSG;
    /* Нижний упор — температура насыщения при давлении конденсатора: ниже
       неё пар просто не образуется, и уносить тепло нечем. Считается
       обращением того же Клапейрона, а не выдуманной константой. */
    const Tmin = 1 / (1 / (f.dz.Ts0 + 273.15) - Math.log(Math.max(f.dz.pC, 1e-9))
                      / f.dz.clapB) - 273.15;
    if (!(Ts > Tmin)) Ts = Tmin;
    if (!f.dz.drum && Ts > Tout) Ts = Tout;
    /* Нитка: точная экспонента к цели, замороженной на подшаге. */
    const e = Math.exp(-dt / f.dz.tauLeg);
    const Tin = f.Tcold + (sec.Tin - f.Tcold) * e;
    sec.Ts = Ts;
    sec.Tin = Tin;
    return f;
  }

  /** Проектное (номинальное) состояние второго контура. */
  function secInit(p) {
    const dz = secDesign(p);
    return { Ts: dz.Ts0, Tin: dz.Tin0, drum: dz.drum, Tsat0: dz.Ts0 };
  }

  /* =====================================================================
     6. Регуляторы стенда
     ===================================================================== */

  /**
   * Привод регулировочного банка, скоростная форма: du/dt = K·e, ограничение
   * по скорости — 0,05 доллара в секунду В ЛЮБОМ ПРЕСЕТЕ. Это и делает
   * разницу между пресетами осязаемой: доллар на зоне с малым β_eff — это
   * меньше pcm, значит меньше pcm/с, значит медленнее отработка и меньше
   * запас. Скоростная форма сама по себе интегральна, поэтому статической
   * ошибки по мощности нет и без отдельного интегратора.
   */
  const ROD_DOLLARS_PER_S = 0.05;
  const ROD_GAIN = 10;               // полная скорость при ошибке 10 %

  function rodDrive(state, dt, plant) {
    const p = state.p;
    const beta = plant.betaEff(p);
    const banks = plant.rodWorthBanks(state.u, p);
    /* Двигать надо ТОТ банк, который объект считает регулировочным, и
       двигать его в ту сторону, в которую он на самом деле добавляет
       реактивность. Прежде привод всегда трогал reg, а знак наклона не
       смотрел вовсе: при loopBank = 1 контур мощности был мёртв (мощность
       стояла на 1,0000 при уставке 1,10, банк упирался в верхний концевик),
       а на падающем участке характеристики стержня с концевиком обратная
       связь становилась ПОЛОЖИТЕЛЬНОЙ. */
    const lb = plant.loopBankId(p);
    const slope = Math.abs(banks.dTotalDu);        // pcm на единицу хода
    const dir = banks.dTotalDu < 0 ? -1 : 1;
    const vMax = slope > 1e-9
      ? Math.min(0.05, ROD_DOLLARS_PER_S * beta * 1e5 / slope)
      : 0.001;
    const nSet = state.setPower / 100;
    const n = state.x[0];
    const e = (nSet - n) / Math.max(nSet, 1e-9);
    const v = clamp(ROD_GAIN * e, -1, 1) * vMax * dir;
    const before = state.u[lb];
    state.u[lb] = clamp01(before + v * dt);
    /* Автомат ведёт и уставку тоже: иначе выход из holdPower мгновенно
       дёрнул бы банк обратно туда, где оператор оставил ползунок. */
    if (state.uSet) state.uSet[lb] = state.u[lb];
    state.autoLimit[lb] = (state.u[lb] === 0 && v < 0) || (state.u[lb] === 1 && v > 0);
    if (lb !== 'reg') state.autoLimit.reg = false;
    return { vMax, slope, beta, bank: lb };
  }

  /**
   * Регулятор расхода: ПИ по температуре на выходе, с честными упорами.
   * Знак: выше уставки — больше расход. Коэффициенты нормированы на dTcool,
   * потому что именно он задаёт статический коэффициент dT_out/dw.
   */
  const FLOW_MIN_CTL = 0.05, FLOW_MAX_CTL = 1.5, FLOW_RATE = 0.25;

  function flowControl(state, dt, plant) {
    const p = state.p;
    const Tin = state.d.Tin;
    const bs = plant.boilState(p, 2 * state.x[10] - Tin, Tin);
    const Tout = bs.Tout;
    const e = Tout - state.setTemp;
    const gain = 0.5 / Math.max(num(p.dTcool, 30), 1);
    const kp = gain, ki = gain / 25;
    let cmd = state.flowI + kp * e;
    const sat = (cmd > FLOW_MAX_CTL) || (cmd < FLOW_MIN_CTL);
    /* Anti-windup: интегратор стоит, пока выход в упоре и ошибка гонит туда же. */
    if (!(sat && ((cmd > FLOW_MAX_CTL && e > 0) || (cmd < FLOW_MIN_CTL && e < 0)))) {
      state.flowI = clamp(state.flowI + ki * e * dt, FLOW_MIN_CTL, FLOW_MAX_CTL);
    }
    cmd = clamp(state.flowI + kp * e, FLOW_MIN_CTL, FLOW_MAX_CTL);
    const step = FLOW_RATE * dt;
    const w = clamp(cmd, state.d.flow - step, state.d.flow + step);
    state.d.flow = clamp(w, FLOW_MIN_CTL, FLOW_MAX_CTL);
    state.autoLimit.flow = (state.d.flow <= FLOW_MIN_CTL + 1e-9)
                        || (state.d.flow >= FLOW_MAX_CTL - 1e-9);
    return Tout;
  }

  /* =====================================================================
     7. Стенд
     ===================================================================== */

  const MODES = ['manual', 'holdTemp', 'holdPower'];

  /** Что в этом режиме ведёт автоматика. */
  const AUTO_OF = {
    manual: {},
    holdTemp: { flow: true },
    holdPower: { reg: true }
  };

  const INSTANCES = [];

  class Stand {
    constructor(el, opts) {
      const o = opts || {};
      this.el = el;
      this.plant = o.plant || (typeof PLANT_REACTOR !== 'undefined' ? PLANT_REACTOR : null);
      if (!this.plant) throw new Error('RCON.mount: no plant given and PLANT_REACTOR is absent');
      this.lang = LANGS.indexOf(o.lang) >= 0 ? o.lang : 'en';
      this.mode = MODES.indexOf(o.mode) >= 0 ? o.mode : 'manual';
      this.speed = SPEEDS.indexOf(o.speed) >= 0 ? o.speed : 1;
      this.windowSec = WINDOWS.indexOf(o.windowSec) >= 0 ? o.windowSec : 300;
      this.presets = (this.plant.presets && this.plant.presets.reactors) || [];
      this.presetId = o.preset || (this.presets[0] ? this.presets[0].id : null);

      this.ring = new Ring(CHANNELS, RING_CAP);
      this.scratch = new Float64Array(this.plant.nStates);
      this.good = { x: new Float64Array(this.plant.nStates), u: { reg: 1, tipd: 1 },
                    d: { Tin: 290, flow: 1 }, t: 0, valid: false };

      this.running = false;
      this.suspended = false;
      this.raf = 0;
      this.lastWall = 0;
      this.tModel = 0;
      this.tWall = 0;
      this.deficit = 0;
      this.achieved = 0;
      this.achAcc = { model: 0, wall: 0 };
      this.tLastSample = -Infinity;
      this.fail = null;
      this.autoLimit = { reg: false, flow: false };
      this.flowI = 1;
      /* второй контур */
      this.uSet = { reg: 1, tipd: 1 };
      this.sec = { Ts: 275, Tin: 290 };
      this.secOn = false;
      this.secLast = null;
      this.turbine = 1;
      /* автозамедление */
      this.calmOn = o.calm !== false;
      this.calmSpeed = 1;
      this.calm = 1;
      this.rhoRate = 0;
      this.nRate = 0;
      /* авария: 0 — цела, 1 — расплавилась */
      this.melt = 0;
      this.meltAt = 0;
      this.destroyed = false;
      this.colors = {};
      this.colorsAt = -1e9;
      this.nodes = {};
      this.strips = [];
      this.lastProbe = null;
      this.uiAt = -1e9;
      this.sn = null;
      this.eq = null;
      this.drag = null;
      this.dragCount = 0;
      /* Шкалы столбцов схемы набираются по фактически пройденному диапазону
         и только растут: иначе подпись конца мигала бы на каждом кадре, а
         «полный столбец» читался бы то как одно, то как другое. */
      this.scRaw = { powMax: 0, tfLo: Infinity, tfHi: -Infinity, vdMax: 0, rhoMax: 0 };
      this.sc = { pow: { lo: 0, hi: 1 }, tf: { lo: 0, hi: 1 },
                  vd: { lo: 0, hi: 1 }, rho: 100 };

      this.applyPreset(this.presetId, true);
      this.resetState();
      this.build();
      this.reset();
      INSTANCES.push(this);
    }

    /* ---------------- параметры и равновесие ---------------- */

    applyPreset(id, silent) {
      const P = this.plant;
      const p = P.defaults();
      const pr = this.presets.find((r) => r.id === id) || null;
      if (pr) Object.assign(p, pr.params);
      this.p = p;
      this.TsatDesign = num(p.Tsat, 0);
      this.presetId = pr ? pr.id : null;
      this.preset = pr;
      if (!silent) this.reset();
    }

    /* Числовая часть сброса: равновесие объекта. DOM не трогает — её зовёт
       и конструктор, до того как разметка вообще существует. */
    resetState() {
      const P = this.plant, p = this.p;
      /* T_sat — состояние барабана, значит прошлый прогон её сдвинул.
         Сброс обязан вернуть проектное значение ДО расчёта равновесия. */
      if (fin(this.TsatDesign)) p.Tsat = this.TsatDesign;
      else this.TsatDesign = num(p.Tsat, 0);
      this.setPower = 100;
      const d0 = { Tin: num(p.Tin0, 290), flow: clamp(num(p.flow, 1), FLOW_MIN_CTL, FLOW_MAX_CTL) };
      const eq = P.equilibrium(p, this.setPower, d0);
      this.eqFeasible = eq.feasible;
      this.x = Float64Array.from(eq.x);
      this.u = { reg: clamp01(eq.uBanks.reg), tipd: clamp01(eq.uBanks.tipd) };
      this.uSet = { reg: this.u.reg, tipd: this.u.tipd };
      this.d = { Tin: d0.Tin, flow: d0.flow };
      this.setTemp = eq.Tout;
      this.flowI = this.d.flow;
      /* Второй контур стартует в своей проектной точке, которая по
         построению совпадает с T_вх0 — равновесие зоны не сдвигается. */
      this.secOn = this.secAllowed();
      /* Есть ли у этого реактора второй банк, знать надо ДО того, как
         syncControls решит, показывать ли его ползунок: paintScheme
         выставит тот же флаг позже, а первый sync пройдёт раньше. */
      this.twoBank = num(p.worthTip, 0) !== 0 || num(p.followerWorth, 0) !== 0;
      this.sec = secInit(p);
      this.turbine = 1;
      if (this.secOn) this.d.Tin = this.sec.Tin;
      this.tModel = 0;
      this.tWall = 0;
      this.deficit = 0;
      this.achAcc = { model: 0, wall: 0 };
      this.achieved = 0;
      this.tLastSample = -Infinity;
      this.fail = null;
      this.frameRawWall = 0;
      this.autoLimit = { reg: false, flow: false };
      this.scRaw = { powMax: 0, tfLo: Infinity, tfHi: -Infinity, vdMax: 0, rhoMax: 0 };
      this.snapGood();
      return this;
    }

    reset() {
      this.melt = 0;
      this.meltTarget = 0;
      this.rhoBase = null;
      this.phases = {};
      this.phaseAt = undefined;
      this.failShown = undefined;
      this.schemeFailShown = undefined;
      this.resetState();
      this.ring.clear();
      this.tLastSample = -Infinity;
      this.sample();
      this.syncControls();
      this.paint(true);
      return this;
    }

    /* Второй контур включается там, где он физически есть: у пресета с
       парогенератором. У прямого цикла (кипящий канал) его нет по смыслу —
       пар из зоны идёт на турбину сам, и промежуточного контура не бывает. */
    secAllowed() { return num(this.p && this.p.secOn, 1) !== 0; }

    snapGood() {
      this.good.sec = { Ts: this.sec.Ts, Tin: this.sec.Tin };
      this.good.turbine = this.turbine;
      this.good.x.set(this.x);
      this.good.u.reg = this.u.reg; this.good.u.tipd = this.u.tipd;
      this.good.uSet = { reg: this.uSet.reg, tipd: this.uSet.tipd };
      this.good.d.Tin = this.d.Tin; this.good.d.flow = this.d.flow;
      this.good.t = this.tModel;
      this.good.valid = true;
    }

    recover() {
      if (!this.good.valid) return this.reset();
      this.x.set(this.good.x);
      this.u.reg = this.good.u.reg; this.u.tipd = this.good.u.tipd;
      this.uSet = this.good.uSet
        ? { reg: this.good.uSet.reg, tipd: this.good.uSet.tipd }
        : { reg: this.u.reg, tipd: this.u.tipd };
      this.d.Tin = this.good.d.Tin; this.d.flow = this.good.d.flow;
      this.flowI = this.d.flow;
      if (this.good.sec) {
        this.sec.Ts = this.good.sec.Ts; this.sec.Tin = this.good.sec.Tin;
        if (this.sec.drum) this.p.Tsat = this.sec.Ts;
      }
      if (fin(this.good.turbine)) this.turbine = this.good.turbine;
      this.fail = null;
      this.melt = 0;
      this.meltTarget = 0;
      this.failShown = undefined;
      this.schemeFailShown = undefined;
      this.syncControls();
      this.paint(true);
      return this;
    }

    /* ---------------- цикл реального времени ---------------- */

    start() {
      if (this.destroyed || this.running) return this;
      this.running = true;
      this.calmSpeed = this.speed;      // разгон начинается с заказанного
      this.lastWall = nowMs();
      this.schedule();
      this.paint(true);
      return this;
    }

    stop() {
      this.running = false;
      if (this.raf) {
        if (typeof cancelAnimationFrame === 'function') cancelAnimationFrame(this.raf);
        this.raf = 0;
      }
      this.paint(true);
      return this;
    }

    schedule() {
      if (!this.running || this.suspended || this.destroyed) return;
      if (typeof requestAnimationFrame !== 'function') return;
      this.raf = requestAnimationFrame((ts) => this.frame(ts));
    }

    /** Скрытая вкладка или невидимый контейнер: цикл стоит, часы не идут. */
    suspend() {
      if (this.suspended) return;
      this.suspended = true;
      if (this.raf) {
        if (typeof cancelAnimationFrame === 'function') cancelAnimationFrame(this.raf);
        this.raf = 0;
      }
      this.paint(true);
    }

    resume() {
      if (!this.suspended) return;
      this.suspended = false;
      this.lastWall = nowMs();      // время, проведённое невидимым, не догоняем
      this.schedule();
      this.paint(true);
    }

    frame(ts) {
      this.raf = 0;
      if (!this.running || this.suspended || this.destroyed) return;
      const t = fin(ts) ? ts : nowMs();
      let raw = (t - this.lastWall) / 1000;
      this.lastWall = t;
      if (!(raw > 0)) raw = 0;
      /* Настенные часы считают ФАКТИЧЕСКИ прошедшее время, без потолка.
         Потолок стоит только на модельном времени, поэтому после затыка
         (свёрнутая вкладка, занятый поток) две стрелки расходятся — и это
         видно на экране, а не заметается под ковёр одинаковым обрезанием
         обеих. Разница считается в deficit. */
      this.tWall += raw;
      const dtWall = raw > WALL_CAP_S ? WALL_CAP_S : raw;
      this.deficit += (raw - dtWall) * this.speed;
      this.frameRawWall = raw;
      if (!this.fail) this.advance(dtWall);
      this.sample();
      this.paint(false);
      this.schedule();
    }

    /* --------------------------------------------------------------
       Множитель времени, фактически применяемый в этом кадре.

       Ускорение ×1000 — это не «то же самое, только быстрее»: любой
       переходный процесс длительностью десять модельных секунд проходит
       за десять миллисекунд настенного времени, то есть за половину
       кадра. На экране это выглядит как мгновенный скачок в новое
       состояние — и создаёт ровно то ложное впечатление, будто модель
       считает алгебру, а не динамику. Динамика при этом честная, её
       просто не показывают.

       Поэтому стенд сам сбрасывает множитель, пока идёт переходный
       процесс. Признак — скорость реактивности и скорость мощности:

           r = max( |drho/dt| / (RHO_ALERT beta), |d ln n/dt| / N_ALERT )

       При r <= 1 множитель заказанный. Дальше он делится на r, но не
       ниже CALM_MIN. Возврат к заказанному — с постоянной времени
       CALM_TAU, чтобы лента не дёргалась на границе. Модельного времени
       это не искажает: часы стенда всегда показывают, сколько его
       фактически прошло, и рядом честно пишется «заказано ×N, вышло ×M».
       -------------------------------------------------------------- */
    liveSpeed() {
      const s0 = this.speed;
      if (s0 <= 1 || !this.calmOn) { this.calm = 1; return s0; }
      const pr = this.lastProbe;
      let r = 0;
      if (pr) {
        const beta = Math.max(num(pr.betaEff, 0.0065) * 1e5, 1);
        const dr = Math.abs(num(this.rhoRate, 0)) / (RHO_ALERT * beta);
        const dn = Math.abs(num(this.nRate, 0)) / N_ALERT;
        r = Math.max(dr, dn);
      }
      const want = r > 1 ? Math.max(s0 / r, CALM_MIN) : s0;
      /* Вниз — сразу (иначе процесс успеет проскочить), вверх — плавно. */
      const cur = num(this.calmSpeed, s0);
      this.calmSpeed = want < cur ? want
        : cur + (want - cur) * Math.min(1, (this.frameRawWall || 0) / CALM_TAU);
      this.calm = this.calmSpeed / s0;
      return this.calmSpeed;
    }

    /** Интегрирование одного кадра. Возвращает фактически пройденное время. */
    advance(dtWall) {
      const P = this.plant, p = this.p;
      const want = dtWall * this.liveSpeed();
      if (!(want > 0)) return 0;
      const hm = P.hMax(p);
      /* Макрошаг ограничен и в ручном режиме. Прежде там брался полный
         hMax (3 с на pwr), и пик реактивности ступенчатого ввода стержня
         занижался на 28 % по существу счёта плюс ещё 14 % на прореживании
         выборки — а именно по этому пику работает автозамедление. */
      const hStep = Math.min(hm, CTRL_MAX_H);
      const t0 = nowMs();
      let done = 0;
      const rho0 = this.lastProbe ? num(this.lastProbe.rhoTotal, 0) : 0;
      const n0 = this.x[0];
      while (done < want - 1e-12) {
        const h = Math.min(hStep, want - done);
        if (this.mode === 'holdPower') rodDrive(this, h, P);
        else this.driveBanks(h);          // ручные банки едут, а не прыгают
        if (this.mode === 'holdTemp') flowControl(this, h, P);
        /* Второй контур ведётся ПЕРЕД шагом зоны: T_вх на этом шаге — та,
           которую холодная нитка донесла к его началу. */
        if (this.secOn) {
          this.secLast = secStep(this.sec, h, p, this.x[11], this.d.flow,
                                 this.turbine, this.x[0]);
          this.d.Tin = this.sec.Tin;
          /* Прямой цикл: давление барабана И ЕСТЬ давление зоны, поэтому
             температура насыщения перестаёт быть константой параметров и
             становится состоянием. Кипение, паросодержание и пустотная
             реактивность считаются по ней же — иначе связь была бы
             односторонней. */
          if (this.sec.drum) p.Tsat = this.sec.Ts;
        }
        try {
          P.step(this.tModel, this.x, this.u, this.d, p, h, this.scratch);
        } catch (e) {
          /* Отказ объекта приходит с кодом. Всё остальное — ошибка В КОДЕ, и
             она обязана быть слышной: без этой строки любая опечатка внутри
             модели превращалась в вежливую плашку «UNKNOWN» и выглядела как
             физика. */
          if (!(e && e.code) && typeof console !== 'undefined' && console.error) {
            console.error('RCON internal error', e && e.stack ? e.stack : e);
          }
          this.raise(e);
          return done;
        }
        this.x.set(this.scratch);
        this.tModel += h;
        done += h;
        if (nowMs() - t0 > FRAME_BUDGET_MS) break;
      }
      /* Скорости для автозамедления — по фактически пройденному отрезку. */
      if (done > 0) {
        const pr = this.plant.probe(this.tModel, this.x, this.u, this.d, p);
        this.rhoRate = (num(pr.rhoTotal, 0) - rho0) / done;
        this.nRate = (Math.log(Math.max(this.x[0], 1e-300))
                    - Math.log(Math.max(n0, 1e-300))) / done;
      }
      this.deficit += (want - done);
      this.achAcc.model += done;
      this.achAcc.wall += this.frameRawWall;
      if (this.achAcc.wall >= 0.5) {
        this.achieved = this.achAcc.model / this.achAcc.wall;
        this.achAcc.model = 0; this.achAcc.wall = 0;
      }
      /* Опорная точка отката — раз в две модельные секунды, копия 11 чисел. */
      if (this.tModel - this.good.t >= 2) this.snapGood();
      return done;
    }

    /** Отказ модели. Стенд замирает на последнем ХОРОШЕМ состоянии. */
    raise(e) {
      const code = e && e.code ? e.code : 'UNKNOWN';
      const hintKey = { PROMPT_CRITICAL: 'hintPrompt', SUBCRITICAL_NO_SOURCE: 'hintSub',
                        COOLANT_BOILING_BEYOND_MODEL: 'hintBoil', STEP_BUDGET: 'hintBudget',
                        FEEDBACK_OUT_OF_BAND: 'hintBand',
                        XENON_DEAD_TIME: 'hintXenon' }[code] || 'hintBudget';
      this.fail = { code, i18n: (e && e.i18n) || null, hintKey, tModel: this.tModel,
                    rhoPcm: num(e && e.rhoPcm, NaN), betaEff: num(e && e.betaEff, NaN) };
      this.running = false;
      if (this.raf) {
        if (typeof cancelAnimationFrame === 'function') cancelAnimationFrame(this.raf);
        this.raf = 0;
      }
      /* Разрушение зоны — НЕ часть модели и не претендует ею быть: это
         иллюстрация того, что дальше считать нечего. Отказ по подкритичности
         зону не плавит — там мощности нет; плавят разгон, кипение за
         пределами замыкания и упёршийся интегратор. */
      /* Плавится зона только там, где её действительно нечем спасти:
         мгновенная критичность. Остальные коды — это заявления о ГРАНИЦАХ
         ЗАМЫКАНИЯ, а не о состоянии установки: при FEEDBACK_OUT_OF_BAND
         объект стоит на заданной мощности с отрицательной реактивностью и
         неподвижными стержнями, а стенд рисовал «ЗОНА РАЗРУШЕНА» с
         радиационным знаком. Это две разные новости, и путать их нельзя. */
      this.meltTarget = (code === 'PROMPT_CRITICAL') ? 1 : 0;
      this.meltAt = nowMs();
      this.meltRAF();
      this.paint(true);
    }

    /** Отдельный кадровый цикл на время расплава: основной цикл уже стоит. */
    meltRAF() {
      if (this.destroyed || !this.fail) return;
      if (typeof requestAnimationFrame !== 'function') { this.melt = this.meltTarget; return; }
      const t = nowMs();
      const f = clamp01((t - this.meltAt) / MELT_MS);
      this.melt = this.meltTarget * f * f * (3 - 2 * f);      // smoothstep
      this.paint(true);
      if (f < 1) requestAnimationFrame(() => this.meltRAF());
    }

    /* ---------------- запись в кольцо ---------------- */

    sampleStep() {
      return Math.max(this.windowSec / TARGET_PTS, MIN_SAMPLE_S);
    }

    sample() {
      if (this.tModel - this.tLastSample < this.sampleStep()) return;
      this.tLastSample = this.tModel;
      const pr = this.probe();
      this.ring.push(this.tModel, {
        power: pr.power, phi: pr.phi, rhoXe: pr.rhoXe, Tf: pr.Tf, Tout: pr.Tout,
        voidFrac: pr.voidFraction, uReg: pr.rodBankPos.reg, uTipd: pr.rodBankPos.tipd,
        rhoRod: pr.rhoCtrl, rhoDop: pr.rhoDoppler, rhoCool: pr.rhoCoolant,
        rhoVoid: pr.rhoVoid, rhoTot: pr.rhoTotal, flow: pr.flow, Tin: pr.Tin,
        dollars: pr.rhoDollar,
        keff: keffOf(pr.rhoTotal),
        Tsg: this.secOn ? this.sec.Ts : NaN,
        pSG: this.secOn && this.secLast ? this.secLast.pMPa : NaN,
        mwE: this.secOn && this.secLast ? this.secLast.Qst : NaN,
        Qsg: this.secOn && this.secLast ? this.secLast.Qsg : NaN
      });
    }

    probe() {
      this.lastProbe = this.plant.probe(this.tModel, this.x, this.u, this.d, this.p);
      return this.lastProbe;
    }

    /* ---------------- разметка ---------------- */

    build() {
      if (!hasDOM()) return;
      const el = this.el;
      el.innerHTML = '';
      el.classList.add('rcon-host');
      const style = document.createElement('style');
      style.textContent = CSS;
      el.appendChild(style);

      const root = document.createElement('section');
      root.className = 'rcon';
      root.setAttribute('data-mode', this.mode);
      el.appendChild(root);
      this.root = root;

      const ids = {};
      for (const k of ['preset', 'mode', 'speed', 'window', 'reg', 'tipd', 'flow',
                       'tin', 'setp', 'sett', 'regh', 'tiph', 'flowh', 'tinh',
                       'setph', 'setth', 'stripsHdr', 'schemeCap', 'schemeAlt',
                       'eqHdr', 'turb', 'turbh']) ids[k] = uid(k);
      this.ids = ids;

      root.innerHTML = HEAD_HTML(ids) + SCHEME_HTML(ids) + BODY_HTML(ids)
                     + EQ_HTML(ids) + NOTES_HTML();
      const q = (sel) => root.querySelector(sel);
      this.nodes = {
        run: q('[data-k="run"]'), reset: q('[data-k="reset"]'),
        status: q('[data-k="status"]'), clocks: q('[data-k="clocks"]'),
        preset: q('#' + ids.preset), mode: q('#' + ids.mode),
        speed: q('#' + ids.speed), window: q('#' + ids.window),
        modeline: q('[data-k="modeline"]'), fail: q('[data-k="fail"]'),
        comp: q('[data-k="comp"]'), verdict: q('[data-k="verdict"]'),
        facts: q('[data-k="facts"]'), knobs: q('[data-k="knobs"]'),
        nudge: q('[data-k="nudge"]'), stripbox: q('[data-k="stripbox"]'),
        phys: q('[data-k="phys"]'), feas: q('[data-k="feas"]'),
        notes: q('[data-k="notes"]'), presetInfo: q('[data-k="presetinfo"]'),
        schemealt: q('[data-k="schemealt"]'), svgwrap: q('[data-k="svgwrap"]'),
        eqcard: q('[data-k="eqcard"]'), eqmount: q('[data-k="eqmount"]')
      };

      this.buildScheme();
      this.buildSelects();
      this.buildKnobs();
      this.buildComposer();
      this.buildPhysics();
      this.buildNudges();
      this.buildStrips();
      this.wire();
      this.wireHandles();
      this.mountEq();
      this.relabel();
    }

    /* ---------------- мнемосхема: карта узлов и ручки ---------------- */

    /**
     * Разметка схемы собрана строкой один раз; дальше — только точечные
     * setAttribute по карте data-k. Никакой перегенерации в кадре: стенд
     * идёт часами, и перестройка DOM шестьдесят раз в секунду была бы
     * ровно тем мусором, которого требование про кольцевой буфер избегает.
     */
    buildScheme() {
      const w = this.nodes.svgwrap;
      if (!w) return;
      this.sn = {};
      const svg = w.querySelector('svg');
      this.sn.svg = svg;
      if (!svg) return;
      const list = svg.querySelectorAll('[data-k]');
      for (let i = 0; i < list.length; i++) {
        this.sn[list[i].getAttribute('data-k')] = list[i];
      }
      /* статические детали, которые удобнее посчитать здесь */
      for (const b of BANKS) {
        const g = this.sn[b.id + '.gripl'];
        if (g) {
          const cx = b.grip.x + b.grip.w / 2;
          g.setAttribute('d', 'M' + (cx - 7) + ' 3V9 M' + cx + ' 3V9 M'
            + (cx + 7) + ' 3V9');
        }
      }
      const ph = this.sn['pow.griph'];
      if (ph) {
        const x = COL.pow.x + COL.pow.w + 5;
        ph.setAttribute('d', 'M' + x + ' 0 l11 -6 v12 z');
      }
      this.schemeFailShown = null;
    }

    /** Пиксель окна → пользовательская система координат SVG. */
    svgPt(ev) {
      const svg = this.sn && this.sn.svg;
      if (!svg || !svg.getBoundingClientRect) return { x: 0, y: 0 };
      const r = svg.getBoundingClientRect();
      const k = Math.min(r.width / SW, r.height / SH) || 1;
      return { x: (ev.clientX - r.left - (r.width - SW * k) / 2) / k,
               y: (ev.clientY - r.top - (r.height - SH * k) / 2) / k };
    }

    /**
     * Что именно тянет каждая ручка. Ручка НЕ хранит своего значения: она
     * всегда работает через тот же knobDef, что и ползунок сбоку, поэтому
     * два органа не могут разойтись — источник истины один.
     *
     * Мощность в режимах manual и holdTemp не задаётся: ручка на её шкале
     * двигает регулировочный банк, то есть то, что мощностью управляет.
