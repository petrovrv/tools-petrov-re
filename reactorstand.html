<script type="application/json" id="diagram-tool-manifest">{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision":"2026-10-16.permalink-setpoint-knob-id","id":"reactorstand","file":"reactorstand.html","listed":true,"category":"nuclear-eng","order":7,"title":{"en":"Reactor Live Stand","uk":"Живий стенд реактора","de":"Reaktor-Live-Prüfstand","nl":"Live-opstelling reactor","fr":"Banc de réacteur en temps réel","es":"Banco de reactor en tiempo real","pl":"Stanowisko badawcze reaktora"},"summary":{"en":"A point-kinetics reactor that runs continuously in wall time instead of producing a finished record.","uk":"Реактор із точковою кінетикою, який іде безперервно за настінним часом, а не видає готовий запис.","de":"Ein punktkinetischer Reaktor, der laufend in Echtzeit rechnet, statt eine fertige Aufzeichnung zu liefern.","nl":"Een puntkinetische reactor die doorlopend in werkelijke tijd rekent in plaats van een afgeronde opname af te leveren.","fr":"Un réacteur à cinétique ponctuelle qui tourne en continu en temps réel au lieu de livrer un enregistrement terminé.","es":"Un reactor de cinética puntual que funciona de forma continua en tiempo real en lugar de entregar un registro terminado.","pl":"Reaktor kinetyki punktowej, który pracuje nieprzerwanie w czasie rzeczywistym zamiast produkować cały rekord."},"description":{"en":"A point-kinetics reactor that runs continuously in wall time instead of producing a finished record. Drag the two rod banks, the coolant valve, the inlet temperature and the power demand straight on the mimic diagram and watch power, neutron flux, xenon, fuel and coolant temperature, void fraction and the whole reactivity balance answer on the strip charts. Three modes decide who drives what: everything by hand, coolant flow on automatic to hold the outlet temperature, or the rods on automatic to hold power — and whatever the automatics have taken over is marked on the knob itself. Presets load a whole reactor at once, from a pressurised light-water core to a boiling channel and a fast plutonium core, and a live equilibrium map shows where the reactivity balance crosses zero, whether the equilibrium there is stable by the power coefficient and by the poles, and what it means when the two methods disagree. Speed runs from ×1 to ×1000, and the clock line says what the frame actually managed.","uk":"Реактор із точковою кінетикою, який іде безперервно за настінним часом, а не видає готовий запис. Тягніть мишею просто на мнемосхемі два банки стержнів, кран теплоносія, температуру на вході й задану потужність — і дивіться, як на стрічках відповідають потужність, потік нейтронів, ксенон, температури палива й теплоносія, паровміст і весь баланс реактивності. Три режими вирішують, хто чим керує: усе руками; витрата на автоматі, щоб тримати температуру на виході; або стержні на автоматі, щоб тримати потужність — і те, що перебрала автоматика, позначено просто на ручці. Пресети завантажують цілий реактор одразу — від водо-водяного під тиском до киплячого каналу і швидкого плутонієвого, — а жива карта рівноваг показує, де баланс реактивності перетинає нуль, чи стійка там рівновага за потужнісним коефіцієнтом і за полюсами, і що означає розбіжність двох методів. Швидкість — від ×1 до ×1000, а рядок годинника каже, що кадр справді встиг.","de":"Ein punktkinetischer Reaktor, der laufend in Echtzeit rechnet, statt eine fertige Aufzeichnung zu liefern. Ziehen Sie die beiden Stabbänke, das Kühlmittelventil, die Eintrittstemperatur und die Leistungsvorgabe direkt im Fließbild und sehen Sie auf den Bandschreibern, wie Leistung, Neutronenfluss, Xenon, Brennstoff- und Kühlmitteltemperatur, Dampfblasenanteil und die gesamte Reaktivitätsbilanz antworten. Drei Betriebsarten entscheiden, wer was führt: alles von Hand, der Kühlmitteldurchsatz automatisch zum Halten der Austrittstemperatur, oder die Stäbe automatisch zum Halten der Leistung — und was die Automatik übernommen hat, steht am Knopf selbst. Voreinstellungen laden einen ganzen Reaktor auf einmal, vom Druckwasserkern über einen Siedekanal bis zum schnellen Plutoniumkern, und eine mitlaufende Gleichgewichtskarte zeigt, wo die Reaktivitätsbilanz durch null geht, ob das Gleichgewicht dort nach dem Leistungskoeffizienten und nach den Polen stabil ist und was es heißt, wenn beide Methoden sich widersprechen. Die Geschwindigkeit reicht von ×1 bis ×1000, und die Uhrzeile sagt, was das Bild tatsächlich geschafft hat.","nl":"Een puntkinetische reactor die doorlopend in werkelijke tijd rekent in plaats van een afgeronde opname af te leveren. Sleep de twee staafbanken, de koelmiddelklep, de intredetemperatuur en de vermogensvraag rechtstreeks in het processchema en zie op de schrijvers hoe vermogen, neutronenflux, xenon, brandstof- en koelmiddeltemperatuur, dampfractie en de hele reactiviteitsbalans antwoorden. Drie bedrijfsstanden bepalen wie wat stuurt: alles met de hand, het koelmiddeldebiet op automaat om de uittredetemperatuur te houden, of de staven op automaat om het vermogen te houden — en wat de automaat heeft overgenomen staat bij de knop zelf. Voorinstellingen laden een hele reactor in één keer, van een drukwaterkern via een kookkanaal tot een snelle plutoniumkern, en een meelopende evenwichtskaart laat zien waar de reactiviteitsbalans door nul gaat, of het evenwicht daar stabiel is volgens de vermogenscoëfficiënt en volgens de polen, en wat het betekent als beide methoden elkaar tegenspreken. De snelheid loopt van ×1 tot ×1000 en de klokregel zegt wat het beeld werkelijk haalde.","fr":"Un réacteur à cinétique ponctuelle qui tourne en continu en temps réel au lieu de livrer un enregistrement terminé. Tirez les deux groupes de barres, la vanne de réfrigérant, la température d’entrée et la consigne de puissance directement sur le synoptique et regardez répondre, sur les enregistreurs, la puissance, le flux neutronique, le xénon, les températures de combustible et de réfrigérant, le taux de vide et tout le bilan de réactivité. Trois modes décident qui conduit quoi : tout à la main, le débit de réfrigérant en automatique pour tenir la température de sortie, ou les barres en automatique pour tenir la puissance — et ce que l’automatisme a pris est marqué sur le bouton lui-même. Les préréglages chargent un réacteur entier d’un coup, du cœur à eau pressurisée au canal bouillant et au cœur rapide au plutonium, et une carte des équilibres mise à jour en direct montre où le bilan de réactivité passe par zéro, si l’équilibre y est stable au sens du coefficient de puissance et au sens des pôles, et ce que signifie un désaccord entre les deux méthodes. La vitesse va de ×1 à ×1000, et la ligne d’horloge dit ce que l’image a réellement tenu.","es":"Un reactor de cinética puntual que funciona de forma continua en tiempo real en lugar de entregar un registro terminado. Arrastre los dos bancos de barras, la válvula de refrigerante, la temperatura de entrada y la consigna de potencia directamente sobre el sinóptico y vea responder en los registradores la potencia, el flujo neutrónico, el xenón, las temperaturas de combustible y refrigerante, la fracción de huecos y todo el balance de reactividad. Tres modos deciden quién conduce qué: todo a mano, el caudal de refrigerante en automático para mantener la temperatura de salida, o las barras en automático para mantener la potencia — y lo que el automatismo ha tomado está marcado en el propio mando. Los preajustes cargan un reactor entero de una vez, desde un núcleo de agua a presión hasta un canal en ebullición y un núcleo rápido de plutonio, y un mapa de equilibrios actualizado en vivo muestra dónde el balance de reactividad cruza cero, si el equilibrio allí es estable según el coeficiente de potencia y según los polos, y qué significa que ambos métodos se contradigan. La velocidad va de ×1 a ×1000 y la línea del reloj dice qué alcanzó realmente el cuadro.","pl":"Reaktor kinetyki punktowej, który pracuje nieprzerwanie w czasie rzeczywistym, zamiast generować gotowy rekord. Przeciągnij dwa zespoły prętów, zawór chłodziwa, temperaturę wlotową i zapotrzebowanie na moc bezpośrednio na diagram symulacyjny i obserwuj moc, strumień neutronów, ksenon, temperaturę paliwa i chłodziwa, frakcję pustą i wynik bilansu reaktywności na wykresach paskowych. Trzy tryby decydują, kto czym steruje: wszystko ręcznie, przepływ chłodziwa w trybie automatycznym w celu utrzymania temperatury wylotowej lub pręty w trybie automatycznym w celu utrzymania mocy — a to, co przejęła automatyka, jest zaznaczone na samym pokrętle. Ustawienia wstępne obciążają cały reaktor naraz, od rdzenia lekkowodnego pod ciśnieniem, przez wrzący kanał, po szybki rdzeń plutonowy, a bieżąca mapa równowagi pokazuje, gdzie bilans reaktywności przecina zero, czy równowaga w tym miejscu jest stabilna pod względem współczynnika mocy i biegunów, oraz co oznacza rozbieżność obu metod. Prędkość waha się od ×1 do ×1000, a linia zegara pokazuje, co faktycznie udało się osiągnąć w ramce."},"status":"benchmarked","independent_validation":false,"limitations":{"en":"Point kinetics with no space in it: one power, one fuel temperature and one lumped coolant channel, so there is no axial or radial distribution, no flux tilt and no local boiling crisis, and nothing here reproduces any particular plant or any particular accident. The preset reactor families are teaching parameterisations, chosen so that the mechanisms differ visibly from one another; their constants are this tool's own calibration and have not been checked against measurements. This is not a thermal-hydraulic code: the coolant is a single lumped channel with a simple boiling model, without pressure dynamics, a critical-heat-flux correlation or a two-phase flow map. The spectrum switch selects a parameterisation — generation time, delayed-neutron fraction and feedback coefficients — it does not compute a spectrum, and no transport or slowing-down calculation is performed anywhere on the page. Real-time integration is bounded per frame, and what a frame cannot manage is shown as the difference between the ordered and the achieved speed rather than accumulated as debt. Educational and exploratory use only; not a basis for design, safety analysis, licensing or operation. The fast block (power and the six precursor groups) is integrated with TR-BDF2, second order and L-stable, with the sub-step limited to |d ln n| <= 0.002 per step; the xenon chain by RK4 and the two thermal nodes by their exact matrix exponential, coupled by Strang splitting. The benchmark covers that physics core, which advances model time only — it does not cover the real-time loop, its frame budget or the difference between the ordered and the achieved speed.","uk":"Точкова кінетика без простору: одна потужність, одна температура палива й один зосереджений канал теплоносія, тож немає ані осьового, ані радіального розподілу, немає перекосу потоку й немає локальної кризи кипіння, і ніщо тут не відтворює якусь конкретну установку чи якусь конкретну аварію. Родини пресетів — навчальні параметризації, підібрані так, щоб механізми помітно відрізнялися один від одного; їхні сталі є власним калібруванням цієї програми і з вимірюваннями не звірялися. Це не теплогідравлічний код: теплоносій є одним зосередженим каналом із простою моделлю кипіння, без динаміки тиску, без кореляції критичного теплового потоку і без карти двофазної течії. Перемикач спектра обирає параметризацію — час генерації, частку запізнілих нейтронів і коефіцієнти зворотного зв’язку, — а не рахує спектр; жодного розрахунку перенесення чи сповільнення на сторінці не виконується. Інтегрування в реальному часі обмежене на кадр, і те, чого кадр не встиг, показано як різницю між замовленою і фактичною швидкістю, а не накопичується як борг. Лише для навчання та дослідження; не є основою для проєктування, аналізу безпеки, ліцензування чи експлуатації. Швидкий блок (потужність і шість груп попередників) інтегрується схемою TR-BDF2 — другого порядку, L-стійкою, з підшагом, обмеженим |d ln n| ≤ 0,002; ксеноновий ланцюг — RK4, два теплові вузли — точною матричною експонентою, зв'язок — розщепленням Странга. Перевірка охоплює це фізичне ядро, яке просуває лише модельний час, і не охоплює цикл реального часу, його бюджет кадру та різницю між заданою й досягнутою швидкістю.","de":"Punktkinetik ohne Raum: eine Leistung, eine Brennstofftemperatur und ein konzentrierter Kühlmittelkanal, also weder axiale noch radiale Verteilung, keine Flussschieflage und keine örtliche Siedekrise; nichts hier bildet eine bestimmte Anlage oder einen bestimmten Unfall ab. Die Voreinstellungsfamilien sind didaktische Parametrierungen, so gewählt, dass sich die Mechanismen sichtbar voneinander unterscheiden; ihre Konstanten sind die eigene Kalibrierung dieses Werkzeugs und wurden nicht gegen Messungen geprüft. Es ist kein thermohydraulischer Code: das Kühlmittel ist ein einziger konzentrierter Kanal mit einfachem Siedemodell, ohne Druckdynamik, ohne Korrelation der kritischen Wärmestromdichte und ohne Zweiphasen-Strömungskarte. Der Spektrumschalter wählt eine Parametrierung — Generationszeit, Anteil verzögerter Neutronen und Rückführkoeffizienten —, er berechnet kein Spektrum; eine Transport- oder Abbremsrechnung findet auf der Seite nirgends statt. Die Echtzeit-Integration ist je Bild begrenzt, und was ein Bild nicht schafft, erscheint als Unterschied zwischen bestellter und erreichter Geschwindigkeit, statt sich als Schuld anzusammeln. Nur für Lehre und Erkundung; keine Grundlage für Auslegung, Sicherheitsanalyse, Genehmigung oder Betrieb. Der schnelle Block (Leistung und die sechs Vorläufergruppen) wird mit TR-BDF2 integriert — zweiter Ordnung, L-stabil, mit einem auf |d ln n| ≤ 0,002 begrenzten Teilschritt; die Xenonkette mit RK4, die beiden Wärmeknoten mit ihrer exakten Matrixexponentialfunktion, gekoppelt durch Strang-Splitting. Die Prüfung deckt diesen Physikkern ab, der nur Modellzeit vorrückt — nicht die Echtzeitschleife, ihr Frame-Budget oder den Unterschied zwischen bestellter und erreichter Geschwindigkeit.","nl":"Puntkinetica zonder ruimte: één vermogen, één brandstoftemperatuur en één geconcentreerd koelmiddelkanaal, dus geen axiale of radiale verdeling, geen fluxscheefstand en geen plaatselijke kookcrisis; niets hier geeft een bepaalde installatie of een bepaald ongeval weer. De voorinstellingsfamilies zijn didactische parametriseringen, zo gekozen dat de mechanismen zichtbaar van elkaar verschillen; hun constanten zijn de eigen kalibratie van dit gereedschap en zijn niet aan metingen getoetst. Het is geen thermisch-hydraulische code: het koelmiddel is één geconcentreerd kanaal met een eenvoudig kookmodel, zonder drukdynamica, zonder correlatie voor de kritieke warmtestroomdichtheid en zonder tweefasenstromingskaart. De spectrumschakelaar kiest een parametrisering — generatietijd, aandeel vertraagde neutronen en terugkoppelcoëfficiënten — en berekent geen spectrum; een transport- of afremberekening vindt op de pagina nergens plaats. De realtime-integratie is per beeld begrensd, en wat een beeld niet haalt verschijnt als verschil tussen de bestelde en de bereikte snelheid in plaats van zich als schuld op te hopen. Alleen voor onderwijs en verkenning; geen basis voor ontwerp, veiligheidsanalyse, vergunningverlening of bedrijfsvoering. Het snelle blok (vermogen en de zes voorlopergroepen) wordt geïntegreerd met TR-BDF2 — tweede orde, L-stabiel, met een substap begrensd op |d ln n| ≤ 0,002; de xenonketen met RK4 en de twee warmteknopen met hun exacte matrixexponentiaal, gekoppeld via Strang-splitsing. De toetsing dekt die fysicakern, die alleen modeltijd vooruitzet — niet de realtimelus, het framebudget of het verschil tussen bestelde en gehaalde snelheid.","fr":"Cinétique ponctuelle sans espace : une puissance, une température de combustible et un canal de réfrigérant à paramètres localisés, donc aucune distribution axiale ou radiale, aucun basculement de flux et aucune crise d’ébullition locale ; rien ici ne reproduit une installation particulière ni un accident particulier. Les familles de préréglages sont des paramétrages pédagogiques, choisis pour que les mécanismes diffèrent visiblement les uns des autres ; leurs constantes sont le calibrage propre de cet outil et n’ont pas été confrontées à des mesures. Ce n’est pas un code thermohydraulique : le réfrigérant est un canal unique à paramètres localisés avec un modèle d’ébullition simple, sans dynamique de pression, sans corrélation de flux thermique critique et sans carte d’écoulement diphasique. Le sélecteur de spectre choisit un paramétrage — temps de génération, fraction de neutrons retardés et coefficients de contre-réaction — et ne calcule pas de spectre ; aucun calcul de transport ou de ralentissement n’est effectué sur la page. L’intégration en temps réel est bornée par image, et ce qu’une image ne tient pas apparaît comme l’écart entre la vitesse demandée et la vitesse obtenue au lieu de s’accumuler en dette. Usage pédagogique et exploratoire uniquement ; ce n’est pas une base de conception, d’analyse de sûreté, d’autorisation ou d’exploitation. Le bloc rapide (puissance et les six groupes de précurseurs) est intégré par TR-BDF2 — d'ordre deux, L-stable, avec un sous-pas limité à |d ln n| ≤ 0,002 ; la chaîne xénon par RK4 et les deux nœuds thermiques par leur exponentielle de matrice exacte, couplés par un découpage de Strang. La validation couvre ce noyau physique, qui n'avance que le temps modèle — pas la boucle temps réel, son budget d'image ni l'écart entre vitesse demandée et vitesse atteinte.","es":"Cinética puntual sin espacio: una potencia, una temperatura de combustible y un canal de refrigerante de parámetros concentrados, de modo que no hay distribución axial ni radial, ni basculamiento del flujo, ni crisis de ebullición local; nada de esto reproduce una instalación concreta ni un accidente concreto. Las familias de preajustes son parametrizaciones docentes, elegidas para que los mecanismos difieran de forma visible entre sí; sus constantes son la calibración propia de esta herramienta y no se han contrastado con medidas. No es un código termohidráulico: el refrigerante es un único canal de parámetros concentrados con un modelo de ebullición simple, sin dinámica de presión, sin correlación de flujo térmico crítico y sin mapa de flujo bifásico. El conmutador de espectro elige una parametrización — tiempo de generación, fracción de neutrones retardados y coeficientes de realimentación — y no calcula un espectro; en la página no se realiza ningún cálculo de transporte ni de moderación. La integración en tiempo real está acotada por cuadro, y lo que un cuadro no alcanza se muestra como la diferencia entre la velocidad pedida y la obtenida en lugar de acumularse como deuda. Uso docente y exploratorio solamente; no es base para diseño, análisis de seguridad, licenciamiento u operación. El bloque rápido (potencia y los seis grupos de precursores) se integra con TR-BDF2 — de segundo orden y L-estable, con el subpaso limitado a |d ln n| ≤ 0,002; la cadena de xenón con RK4 y los dos nodos térmicos con su exponencial matricial exacta, acoplados mediante división de Strang. La validación cubre ese núcleo físico, que solo avanza tiempo de modelo — no el bucle de tiempo real, su presupuesto de fotograma ni la diferencia entre la velocidad pedida y la alcanzada.","pl":"Kinetyka punktowa bez żadnej przestrzeni: jedna moc, jedna temperatura paliwa i jeden skupiony kanał chłodziwa, więc nie ma rozkładu osiowego ani promieniowego, przechylenia strumienia ani lokalnego kryzysu wrzenia, a nic tutaj nie odtwarza żadnej konkretnej elektrowni ani konkretnego wypadku. Wstępnie ustawione rodziny reaktorów to parametryzacje, dobrane tak, aby mechanizmy wyraźnie się od siebie różniły; ich stałe są własną kalibracją tego narzędzia i nie zostały sprawdzone pod kątem pomiarów. To nie jest kod termohydrauliczny: chłodziwo to pojedynczy skupiony kanał z prostym modelem wrzenia, bez dynamiki ciśnienia, korelacji krytycznego strumienia ciepła ani dwufazowej mapy przepływu. Przełącznik widma wybiera parametryzację — czas generacji, ułamek neutronów opóźnionych i współczynniki sprzężenia zwrotnego — nie oblicza widma i nigdzie na stronie nie są wykonywane żadne obliczenia transportu ani spowolnienia. Całkowanie w czasie rzeczywistym jest ograniczone dla każdej klatki, a to, czego klatka nie może obsłużyć, jest pokazywane jako różnica między prędkością zamówioną a osiągniętą, a nie akumulowane jako dług. Wyłącznie do użytku edukacyjnego i eksploracyjnego; nie stanowi podstawy do projektowania, analizy bezpieczeństwa, licencjonowania ani eksploatacji. Szybki blok (zasilanie i sześć grup prekursorowych) jest zintegrowany z TR-BDF2, drugiego rzędu i L-stabilny, z podkrokiem ograniczonym do |d ln n| <= 0,002 na krok; łańcuch ksenonowy przez RK4, a dwa węzły termiczne przez ich dokładną macierz wykładniczą, sprzężone przez rozszczepienie Stranga. Test obejmuje rdzeń fizyczny, który przyspiesza jedynie czas modelu — nie obejmuje pętli czasu rzeczywistego, jej budżetu klatek ani różnicy między prędkością zamówioną a osiągniętą."},"intended_use":["education","technical exploration","preliminary assessment"],"catalog_languages":["en","uk","de","nl","fr","es","pl"],"tool_languages":["en","uk","de","nl","fr","es","pl"],"dependencies":[],"network_access":{"mode":"none"},"validation":{"basis":{"en":"33 benchmark cases driven through the page's deterministic physics core: PLANT_REACTOR.step() advances the twelve-state vector by an exact amount of MODEL time and reads no clock, so the plant is benchmarked without the real-time loop. The six-group point kinetics is compared with the exact seven-mode modal solution over -1 $ .. +0.9 $ and Lambda = 1e-5 .. 1e-3 s (cross-checked against an eigen-decomposition of the system matrix, the two agreeing to 7e-14); the delayed-neutron precursor balance d/dt(n + SUM C_i) = (rho/Lambda) n is verified against its analytic integral; the full plant with xenon, Doppler and the two-node thermal model is compared with scipy solve_ivp (Radau, cross-checked against LSODA); the equilibrium, the inhour equation and the reactivity balance are compared with their closed forms; and the refusal thresholds are checked one pcm either side. What the benchmark does NOT cover is the real-time loop itself - frame budgeting, the ordered-versus-achieved speed and the rendering. The harness is the author's own; no external party has reviewed it.","uk":"33 контрольні випадки, проведені через детерміноване фізичне ядро сторінки: PLANT_REACTOR.step() просуває дванадцятивимірний стан на точну величину МОДЕЛЬНОГО часу і не читає годинник, тож об'єкт перевіряється без циклу реального часу. Шестигрупову точкову кінетику порівняно з точним семимодовим розв'язком у діапазоні -1 $ .. +0,9 $ і Λ = 1e-5 .. 1e-3 с (перехресно перевірено власним розкладом матриці системи, збіг 7e-14); баланс попередників d/dt(n + Σ C_i) = (ρ/Λ) n перевірено проти його аналітичного інтеграла; повну модель з ксеноном, доплером і двонодовою теплофізикою — проти scipy solve_ivp (Radau, звірено з LSODA); рівновагу, рівняння оберненого годинника та баланс реактивності — проти замкнених формул; пороги відмов перевірено з обох боків із кроком 1 pcm. Поза перевіркою залишається сам цикл реального часу — бюджет кадру, співвідношення заданої та досягнутої швидкості й малювання. Стенд авторський; сторонньої перевірки не було.","de":"33 Prüffälle über den deterministischen Physikkern der Seite: PLANT_REACTOR.step() rückt den zwölfdimensionalen Zustand um eine exakte MODELLZEIT vor und liest keine Uhr, die Strecke wird also ohne die Echtzeitschleife geprüft. Die Sechsgruppen-Punktkinetik wird mit der exakten Sieben-Moden-Lösung über -1 $ .. +0,9 $ und Lambda = 1e-5 .. 1e-3 s verglichen (gegengeprüft mit einer Eigenzerlegung der Systemmatrix, Übereinstimmung 7e-14); die Vorläuferbilanz d/dt(n + SUM C_i) = (rho/Lambda) n gegen ihr analytisches Integral; die volle Strecke mit Xenon, Doppler und Zwei-Knoten-Thermik gegen scipy solve_ivp (Radau, gegen LSODA geprüft); Gleichgewicht, Inhour-Gleichung und Reaktivitätsbilanz gegen ihre geschlossenen Formen; die Verweigerungsschwellen je ein pcm beiderseits. Nicht abgedeckt ist die Echtzeitschleife selbst — Frame-Budget, bestellte gegen erreichte Geschwindigkeit und die Darstellung. Der Prüfstand stammt vom Autor; keine externe Prüfung.","nl":"33 benchmarkgevallen via de deterministische fysicakern van de pagina: PLANT_REACTOR.step() zet de twaalfdimensionale toestand een exacte hoeveelheid MODELTIJD vooruit en leest geen klok, dus het proces wordt zonder de realtimelus getoetst. De zesgroeps-puntkinetica wordt vergeleken met de exacte zevenmodusoplossing over -1 $ .. +0,9 $ en Lambda = 1e-5 .. 1e-3 s (kruisgecontroleerd met een eigenwaardeontbinding van de systeemmatrix, overeenkomst 7e-14); de voorloperbalans d/dt(n + SUM C_i) = (rho/Lambda) n tegen haar analytische integraal; het volledige proces met xenon, Doppler en het tweeknoops warmtemodel tegen scipy solve_ivp (Radau, getoetst aan LSODA); het evenwicht, de inhour-vergelijking en de reactiviteitsbalans tegen hun gesloten vormen; de weigeringsdrempels één pcm aan weerszijden. Niet gedekt is de realtimelus zelf — framebudget, bestelde tegenover gehaalde snelheid en het tekenen. De testbank is van de auteur zelf; geen externe review.","fr":"33 cas de référence pilotés à travers le noyau physique déterministe de la page : PLANT_REACTOR.step() avance le vecteur à douze états d'une quantité exacte de temps MODÈLE et ne lit aucune horloge, le procédé est donc évalué sans la boucle temps réel. La cinétique ponctuelle à six groupes est comparée à la solution exacte à sept modes de -1 $ à +0,9 $ et Lambda = 1e-5 .. 1e-3 s (recoupée par une décomposition propre de la matrice du système, accord 7e-14) ; le bilan des précurseurs d/dt(n + SOMME C_i) = (rho/Lambda) n à son intégrale analytique ; le procédé complet avec xénon, Doppler et le modèle thermique à deux nœuds à scipy solve_ivp (Radau, recoupé par LSODA) ; l'équilibre, l'équation inhour et le bilan de réactivité à leurs formes fermées ; les seuils de refus à un pcm de part et d'autre. N'est pas couverte la boucle temps réel elle-même — budget d'image, vitesse demandée contre vitesse atteinte et rendu. Le banc est celui de l'auteur ; aucune revue externe.","es":"33 casos de referencia ejecutados a través del núcleo físico determinista de la página: PLANT_REACTOR.step() avanza el vector de doce estados una cantidad exacta de tiempo de MODELO y no lee ningún reloj, de modo que la planta se evalúa sin el bucle de tiempo real. La cinética puntual de seis grupos se compara con la solución exacta de siete modos entre -1 $ y +0,9 $ y Lambda = 1e-5 .. 1e-3 s (contrastada con una descomposición propia de la matriz del sistema, coincidencia 7e-14); el balance de precursores d/dt(n + SUMA C_i) = (rho/Lambda) n con su integral analítica; la planta completa con xenón, Doppler y el modelo térmico de dos nodos con scipy solve_ivp (Radau, contrastado con LSODA); el equilibrio, la ecuación inhour y el balance de reactividad con sus formas cerradas; los umbrales de rechazo a un pcm a cada lado. No cubre el propio bucle de tiempo real — presupuesto de fotograma, velocidad pedida frente a alcanzada y el dibujo. El banco es del propio autor; sin revisión externa.","pl":"33 przypadki porównawcze przepuszczone przez deterministyczny rdzeń fizyczny strony: PLANT_REACTOR.step() przesuwa wektor dwunastostanowy o dokładną wartość czasu MODELU i nie odczytuje zegara, więc elektrownia jest testowana bez pętli czasu rzeczywistego. Kinetyka punktów sześciogrupowych jest porównywana z dokładnym rozwiązaniem siedmiomodowym w czasie -1 $ .. +0,9 $ i Lambda = 1e-5 .. 1e-3 s (sprawdzana krzyżowo z rozkładem własnym macierzy układu, oba wyniki są zgodne z 7e-14); równowaga prekursorów neutronów opóźnionych d/dt(n + SUMA C_i) = (rho/Lambda) n jest weryfikowana z jej całką analityczną; pełna elektrownia z ksenonem, efektem Dopplera i dwuwęzłowym modelem termicznym jest porównywana z solve_ivp scipy (Radau, sprawdzana krzyżowo z LSODA); Równowaga, równanie inhour i bilans reaktywności są porównywane z ich zamkniętymi formami; a progi odmowy są sprawdzane co jeden pcm z każdej strony. Test NIE obejmuje samej pętli czasu rzeczywistego – budżetowania klatek, prędkości uporządkowanej względem osiągniętej oraz renderowania. Zestaw testowy jest własnością autora; nie był weryfikowany przez żadną zewnętrzną instytucję."},"independent_validation":false,"benchmarks":[{"id":"reactor-plant-deterministic","reference":"Independent python solution of the same plant, driven through PLANT_REACTOR.step() which advances model time only and reads no clock. Route 1: the exact seven-mode modal solution of the six-group point-kinetics equations (inhour roots by Brent bisection, amplitudes by Laplace residues). Route 2: eigen-decomposition of the 7x7 system matrix (numpy.linalg.eig); routes 1 and 2 agree to 7e-14 on n(t) and 1e-14 on the growth rates. Route 3: the full twelve-state plant integrated with scipy solve_ivp (Radau, rtol 1e-10) and cross-checked against LSODA (rtol 1e-11), agreeing to 2e-11. Initial states are constructed in closed form in the reference and handed to the page unchanged.","citations":["G.R. Keepin, \"Physics of Nuclear Kinetics\", Addison-Wesley (1965), Table 4-6 — six-group delayed-neutron parameters for thermal fission of U-235.","J.J. Duderstadt and L.J. Hamilton, \"Nuclear Reactor Analysis\", Wiley (1976), Sec. 6.1-6.2 — point kinetics, the inhour equation and the precursor balance.","J.R. Lamarsh and A.J. Baratta, \"Introduction to Nuclear Engineering\", 3rd ed., Sec. 7.3 and 8.4 — reactor period and the I-135/Xe-135 chain.","M.E. Hosea and L.F. Shampine, \"Analysis and implementation of TR-BDF2\", Applied Numerical Mathematics 20 (1996) 21-37 — the second-order L-stable scheme now used for the fast (n, C_i) block."],"cases":33,"passed":33,"tolerance":"n(t) and the precursor sums: 1e-3 relative — the fast block is second order and L-stable with a sub-step limited to |d ln n| <= 0.002, so its accumulated error over the <= 25 e-folds spanned here is about 3e-5 (measured worst case 4e-5). Full twelve-state plant against solve_ivp: 3e-3, which must also absorb the O(h^2) Strang splitting against the xenon chain (measured worst case 2.3e-4). Algebraic identities — equilibrium, inhour round trip, reactivity balance, precursor equilibrium: 1e-9. Refusal thresholds: exact match of the violation code, tested one pcm either side of the threshold.","run_at":"2026-10-16T00:00:53.989Z","artifact":"benchmarks/reactorstand.json"}]},"report":{"pdf":true,"source_attribution":true},"python_export":{"supported":false,"reason":"The page shows a point on a continuously running real-time trajectory whose history depends on wall-clock timing and on what the operator did while it ran, so no standalone script can reproduce the displayed state."},"handoff":{"provides":["rho_reac","T"],"accepts":[]},"state_codec":{"permalink":true,"record":"tools.petrov.re/calculation-record/v1"},"ui":{"framework":"tools.petrov.re/ui/v1","level":3}}</script>

<style>
/* ---------------------------------------------------------------------------
   reactorstand.html — what is left of the page's own stylesheet after the port
   to tools.petrov.re/ui/v1.

   The banner, the language strip, the theme button, the prose cards, the page
   grid and the whole palette are gone: diagram-ui.js owns the tokens, the
   shell and the placement. Four things stay, and each is here because the
   framework has no equivalent for it yet.
   ------------------------------------------------------------------------ */

/* 1. Token bridge. console.js and equilib.js read the site's older custom
      property names, with a hard-coded fallback each. Mapping them onto the
      framework's tokens is what makes the instrument follow the site theme
      instead of its own fallbacks; without this line the mimic stays light in
      dark mode. The six series colours are literals because the token layer
      has no chart-series palette — that belongs upstream, not here. */
:root{
  --ink2:var(--muted); --grid:var(--line); --inputbg:var(--panel);
  --btnbg:var(--accent); --btnbg2:var(--accent); --btnink:var(--accent-ink);
  --warm:#d9531e; --cold:#2a6fb5;
  --br1:#3b4cca; --br2:#7c3aed; --br3:#0e7490; --br4:#a21caf;
}
html[data-theme="dark"]{
  --warm:#ff9152; --cold:#58a6ff;
  --br1:#8aa2ff; --br2:#c4a2ff; --br3:#5ad2e6; --br4:#f08ce0;
}

/* 2. equilib.js ships its own palette and switches it on `html.dark` or on
      `.eq[data-dark="1"]`. The framework resolves the theme onto
      html[data-theme], and the module is not ours to edit, so the same
      variables are restated here for the dark case. Same values as the
      module's own dark set. */
html[data-theme="dark"] .eq{
  --eq-c0:#e6edf3; --eq-c1:#79c0ff; --eq-c2:#d2a8ff; --eq-c3:#ffa657;
  --eq-c4:#56d4dc; --eq-c5:#ff8ac6; --eq-ok:#3fb950; --eq-bad:#f85149; --eq-warn:#e3b341;
}

/* 3. The mimic diagram, which cannot be reflowed.
      It is one 1200 x 560 drawing: below roughly 680 px the whole picture —
      bars, numbers and the units beside them — shrinks with its column instead
      of re-laying out, and the labels stop being readable. So it is given a
      floor and its own horizontal scroller: everything else fits the screen,
      and the one element that cannot is pannable at a legible size. The floor
      now answers to the width of the stage rather than to the width of the
      window, because the stage is a column of the shell and is narrower than
      the page. This is the one thing on the site that ui.stage() should learn
      to do by itself. */
.dgu-app .rcon-svgwrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin}
.dgu-app .rcon-svgwrap>.rcon-svg{min-width:680px}
.dgu-app .rcon-svgwrap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dgu-app .rs-stagewrap{min-width:0;width:100%}
.dgu-app .dgu-stage-cap p{margin:0}
.dgu-app .dgu-stage-cap p+p{margin-top:var(--sp-1)}

/* 4. equilib.js prints its numbers as eight-column tables with headed rows.
      Their min-content width is around 520 px, so below that they push the
      whole document sideways. A table cannot be reflowed without destroying
      the correspondence between a cell and its two headers, and the module is
      not ours to edit, so the block that holds them is a scroller of its own. */
.dgu-app .eq [data-k="numbody"]{overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin}
.dgu-app .eq [data-k="numbody"] table{min-width:max-content}

/* Framework defect, repaired locally, belongs upstream: below md the shell's own
   controls stay at --ctl-h (36 px) or smaller — the learn '?', the header selects
   and the return link — while the spec's floor is --tap (44 px). The instrument's
   own selects and sliders are in the same rule for the same reason. */
@media (max-width:768px){
  .dgu-app .dgu-sel{min-height:var(--tap)}
  html .dgu-app .dgu-q,html .dgu-tour .dgu-q{width:var(--tap);height:var(--tap)}
  .dgu-app .dgu-home{min-height:var(--tap);display:inline-flex;align-items:center}
  .dgu-app .dgu-region a,.dgu-app .dgu-head a{min-height:var(--tap);display:inline-flex;
    align-items:center}
  .dgu-tour .dgu-btn,.dgu-dialog .dgu-btn,.dgu-pop .dgu-btn{min-height:var(--tap)}
  .dgu-app .rcon select,
  .dgu-app .rcon input[type=range]{min-height:var(--tap)}
  .dgu-app .rcon .rcon-notes summary{min-height:var(--tap);display:flex;align-items:center}
  .dgu-app .dgu-footer summary{min-height:var(--tap);display:flex;align-items:center}
}

/* The instrument's controls came from a 300 px column and now live in a 250 px
   one. Its knob row is [slider][value], and where the value is a long one
   ("-12000 pcm per unit void") the slider was squeezed to 14 px. The row is
   allowed to wrap instead, so the slider keeps a usable length and the readout
   drops to its own line. */
.dgu-app .rcon .rcon-krow{flex-wrap:wrap}
.dgu-app .rcon .rcon-krow>input[type=range]{flex:1 1 140px;min-width:140px}
.dgu-app .rcon .rcon-krow>.rcon-kv{margin-left:auto}

/* Framework defect, repaired locally, belongs upstream: below md the header row
   keeps the title and the subtitle side by side, so a two-word title is squeezed
   into a column narrow enough to be broken mid-word ("React|or Live Stand" at
   390 px). The title takes the row, the subtitle takes the next one. */
@media (max-width:768px){
  .dgu-app .dgu-head-l{flex-wrap:wrap;row-gap:var(--sp-1)}
  .dgu-app .dgu-title{flex:1 1 100%;overflow-wrap:break-word;word-break:normal}
  .dgu-app .dgu-sub{flex:1 1 100%}
}

/* The skip link the shell has no slot for. */
.rs-skip{position:absolute;left:-9999px;top:0;z-index:var(--z-sticky,100);
  display:inline-flex;align-items:center;min-height:var(--tap,44px);
  padding:0 var(--sp-3,12px);background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:0 0 var(--radius-sm,8px) 0}
.rs-skip:focus{left:0}
.dgu-app .rs-honest{color:var(--muted);border-left:3px solid var(--warm);padding-left:var(--sp-2)}
.dgu-app .rs-see{margin:var(--sp-2) 0 0}

.noscript{margin:var(--sp-4,16px);padding:var(--sp-4,16px);border:1px solid var(--line,#e2e7ee);
  border-radius:var(--radius-md,14px);background:var(--panel,#fff)}
.noscript h2{font-size:15px;margin:0 0 8px}
.noscript p{margin:0 0 8px;line-height:1.5;font-size:13px}

</style>

<script>
/* ===================== plant-reactor.js ===================== */
/* ============================================================================
 * plant-reactor.js — Point-kinetics reactor with xenon-135 poisoning,
 * Doppler feedback and a two-node core thermal model.  Plant object for the
 * control laboratory (regelkring.html), interface contract: lab/SPEC.md v1.
 *
 * Sources of the physics (see SOURCES below for the full register):
 *   - six-group delayed-neutron data, U-235 thermal:  site/kinetics.html
 *   - I-135 / Xe-135 chain:                           site/xenon.html
 *   - Doppler / fuel-thermal model:                   ADDED HERE, tagged
 *                                                     'modern-reference'
 *   - fuel/coolant two-node core, outlet temperature: ADDED HERE, tagged
 *                                                     'modern-reference'
 *   - graphite-tipped control rod (displacer):        ADDED HERE, tagged
 *                                                     'modern-reference'
 *
 * NOTHING in this file touches the DOM, the core, or any other plant.
 * Pure mathematics + metadata, as required by SPEC.md §2.
 * ==========================================================================*/

const PLANT_REACTOR = (() => {

  /* ------------------------------------------------------------------ *
   * 1. Physical constants
   * ------------------------------------------------------------------ */

  /* Delayed-neutron parameters, U-235, thermal spectrum, six groups.
   * Keepin's set — the values are copied verbatim from site/kinetics.html
   * lines 329-331, where the sum is annotated "exact sum = 0.006502".      */
  const BETA = [0.000215, 0.001424, 0.001274, 0.002568, 0.000748, 0.000273];
  const LAM  = [0.0124,   0.0305,   0.1110,   0.3010,   1.1400,   3.0100  ];
  const BETA_TOT = BETA.reduce((a, b) => a + b, 0);           // 0.006502
  const LAM_MIN  = Math.min.apply(null, LAM);                 // 0.0124

  /* I-135 / Xe-135 chain — copied verbatim from site/xenon.html lines 127-133. */
  const LAM_I  = 2.926e-5;      // s^-1   (t1/2 = 6.580 h)
  const LAM_X  = 2.106e-5;      // s^-1   (t1/2 = 9.142 h)
  const GAM_I  = 0.0639;        // fission yield, I-135  (-)
  const GAM_X  = 0.00237;       // direct fission yield, Xe-135 (-)
  const SIG_AX = 2.65e-18;      // cm^2   microscopic absorption XS of Xe-135
  const SIG_F  = 0.0616;        // cm^-1  macroscopic fission XS
  const NU     = 2.43;          // neutrons per fission (-)

  const PCM = 1e-5;             // 1 pcm = 1e-5 dk/k
  const LN2 = Math.LN2;

  /* ------------------------------------------------------------------ *
   * 1b. Delayed-neutron data per fissioning nuclide — Keepin's six-group
   *     sets.  Every entry carries the published half-lives T_i [s], the
   *     relative group abundances a_i [-], the absolute delayed-neutron
   *     yield nu_d [n/fission] and nu-bar, from which
   *
   *        beta   = nu_d / nu_bar          (delayed fraction)
   *        beta_i = a_i * beta
   *        lam_i  = ln2 / T_i
   *
   * The U-235 THERMAL entry additionally carries the beta_i and lam_i
   * ALREADY SHIPPED in this file (BETA/LAM above), because those are the
   * published rounded numbers the whole file and all seven reference cases
   * are built on.  Recomputing them from a_i and T_i would move the last
   * digits; the test `Keepin: a_i*beta and ln2/T_i reproduce the shipped set`
   * checks that the two routes agree to the published rounding, and the
   * ONE place where they do not (group 3, lam = 0.111 vs ln2/6.22 = 0.11144)
   * is reported as a source discrepancy rather than silently averaged.
   *
   * `spec` says which measured set it is: Keepin measured thermal-fission
   * sets for U-233, U-235 and Pu-239 and fast-fission sets for those three
   * plus U-238.  There is NO Keepin set for Pu-241 — see SOURCES.pu241.
   * ------------------------------------------------------------------ */
  const NUCLIDES = {
    U235: {
      symbol: 'U-235',
      thermal: { T: [55.72, 22.72, 6.22, 2.30, 0.610, 0.230],
                 a: [0.033, 0.219, 0.196, 0.395, 0.115, 0.042],
                 nuD: 0.0158, nu: 2.43, beta: BETA, lam: LAM },
      fast:    { T: [54.51, 21.84, 6.00, 2.23, 0.496, 0.179],
                 a: [0.038, 0.213, 0.188, 0.407, 0.128, 0.026],
                 nuD: 0.0165, nu: 2.57 }
    },
    U238: {
      symbol: 'U-238',
      /* U-238 fissions only above ~1 MeV, so there is no thermal set and
       * none is invented: in a thermal core its fissions are the fast-fission
       * ones and the fast set is the right one to use. */
      fast:    { T: [52.38, 21.58, 5.00, 1.93, 0.490, 0.172],
                 a: [0.013, 0.137, 0.162, 0.388, 0.225, 0.075],
                 nuD: 0.0412, nu: 2.79 }
    },
    Pu239: {
      symbol: 'Pu-239',
      thermal: { T: [54.28, 23.04, 5.60, 2.13, 0.618, 0.257],
                 a: [0.035, 0.298, 0.211, 0.326, 0.086, 0.044],
                 nuD: 0.0061, nu: 2.90 },
      fast:    { T: [53.75, 22.29, 5.19, 2.09, 0.549, 0.216],
                 a: [0.028, 0.273, 0.192, 0.350, 0.128, 0.029],
                 nuD: 0.0063, nu: 3.00 }
    },
    Pu241: {
      symbol: 'Pu-241',
      /* GROUP STRUCTURE BORROWED, AND SAID SO. Keepin has no Pu-241 set.
       * The TOTAL yield is Tuttle's recommended value; the half-lives and
       * relative abundances are Pu-239's, reused by the author of this file
       * because the two nuclides' precursor inventories are similar. That is
       * an assumption, not a measurement — see SOURCES.pu241. */
      thermal: { T: [54.28, 23.04, 5.60, 2.13, 0.618, 0.257],
                 a: [0.035, 0.298, 0.211, 0.326, 0.086, 0.044],
                 nuD: 0.0154, nu: 2.94, borrowedGroupsFrom: 'Pu239.thermal' },
      fast:    { T: [53.75, 22.29, 5.19, 2.09, 0.549, 0.216],
                 a: [0.028, 0.273, 0.192, 0.350, 0.128, 0.029],
                 nuD: 0.0154, nu: 2.94, borrowedGroupsFrom: 'Pu239.fast' }
    },
    U233: {
      symbol: 'U-233',
      thermal: { T: [55.11, 20.74, 5.30, 2.29, 0.546, 0.221],
                 a: [0.086, 0.274, 0.227, 0.317, 0.073, 0.023],
                 nuD: 0.0066, nu: 2.50 },
      fast:    { T: [55.00, 20.57, 5.00, 2.13, 0.615, 0.277],
                 a: [0.086, 0.299, 0.252, 0.278, 0.051, 0.034],
                 nuD: 0.0070, nu: 2.62 }
    }
  };

  /* Fill in beta, beta_i, lam_i wherever they are not the shipped literals. */
  for (const key of Object.keys(NUCLIDES)) {
    const nuc = NUCLIDES[key];
    for (const set of ['thermal', 'fast']) {
      const s = nuc[set];
      if (!s) continue;
      /* beta from the absolute yield, beta_i from the abundances, and then
       * beta_tot RE-SUMMED from the groups. The re-sum matters: for U-235
       * thermal the shipped (published, rounded) beta_i sum to 0.006502
       * while nu_d/nu-bar = 0.0158/2.43 = 0.00650206, and every equation in
       * this file uses the sum of the groups. Using the sum keeps the model
       * self-consistent and keeps the default parameter set byte-identical
       * to the file as it was. */
      s.betaFromYield = s.nuD / s.nu;
      if (!s.beta) s.beta = s.a.map((ai) => ai * s.betaFromYield);
      if (!s.lam)  s.lam  = s.T.map((Ti) => LN2 / Ti);
      s.beta_tot = s.beta.reduce((acc, b) => acc + b, 0);
      s.aSum = s.a.reduce((acc, b) => acc + b, 0);
      s.nuclide = key;
      s.set = set;
    }
  }

  /* ------------------------------------------------------------------ *
   * 1c. Neutron spectrum.
   *
   * What the switch REALLY does, and nothing more (see SOURCES.spectrum):
   *   1. multiplies the prompt generation time:  Lambda_eff = Lambda * lamScale
   *      thermal x1 (1e-4 s), intermediate x1e-2 (1e-6 s), fast x1e-3 (1e-7 s);
   *   2. selects the measured delayed-neutron set (thermal or fast fission);
   *   3. sets how large a share of the fissions happens in the FERTILE
   *      nuclide (U-238), which is what actually moves beta_eff.
   *
   * It deliberately does NOT rescale alpha_D, alpha_C or alpha_void: silently
   * multiplying a number the user typed would be dishonest. Those belong to
   * the reactor presets, which set spectrum-appropriate values together.
   * The Doppler RESPONSIVENESS still changes with the switch, because what
   * matters dynamically is alpha_D/beta_eff (dollars per kelvin), and
   * beta_eff moves — probe().alphaDollarPerK reports it.
   * ------------------------------------------------------------------ */
  const SPECTRA = [
    { id: 'thermal',      lamScale: 1,    set: 'thermal', fertileFission: 0.055 },
    { id: 'intermediate', lamScale: 1e-2, set: 'fast',    fertileFission: 0.12  },
    { id: 'fast',         lamScale: 1e-3, set: 'fast',    fertileFission: 0.22  }
  ];

  /* Fuel types: which nuclides carry the fissions.  `fissile` is the mix
   * INSIDE the fissile part; `fertile` is the nuclide that takes the
   * fast-fission share.  Enrichment = fissile fraction of the heavy metal. */
  const FUEL_TYPES = [
    { id: 'uranium',   fissile: { U235: 1 },                fertile: 'U238' },
    { id: 'plutonium', fissile: { Pu239: 0.83, Pu241: 0.17 }, fertile: 'U238' },
    { id: 'pu239',     fissile: { Pu239: 1 },                fertile: 'U238' },
    { id: 'u233',      fissile: { U233: 1 },                fertile: null }
  ];

  /* ------------------------------------------------------------------ *
   * 1c2. КОМПОНОВЩИК ЗОНЫ: топливо + замедлитель + теплоноситель.
   *
   * Зачем. Пресеты отвечают на вопрос «как ведёт себя вот этот аппарат».
   * Они не отвечают на вопрос «почему именно так и почему иначе нельзя».
   * А ответ на второй вопрос почти целиком лежит в трёх выборах:
   *
   *   что делится        -> beta_eff и Lambda  -> ЧЕМ управлять
   *   что не делится     -> Доплер             -> что держит в первый миг
   *   чем замедляют      -> Lambda и alpha_C   -> как быстро всё происходит
   *   чем охлаждают      -> alpha_void         -> куда пойдёт при потере
   *
   * Ниже — таблица, которая переводит эти выборы в параметры модели. Это
   * ПАРАМЕТРИЗАЦИЯ ПОРЯДКА ВЕЛИЧИНЫ, а не расчёт зоны: никакого переноса
   * нейтронов здесь нет, спектр не считается, решётка не гомогенизируется.
   * Числа выбраны так, чтобы известные аппараты попадали в свои известные
   * значения, а промежуточные комбинации давали правдоподобную интерполяцию.
   * Каждое число ниже подписано тем, откуда оно взято.
   *
   * ГЛАВНОЕ, ЧТО ЭТА ТАБЛИЦА ПОКАЗЫВАЕТ. Знак пустотного эффекта — это НЕ
   * свойство теплоносителя. Это свойство того, СОВПАДАЕТ ли теплоноситель с
   * замедлителем:
   *
   *   вода и замедляет и охлаждает  -> вскипела -> замедлять стало нечем
   *                                 -> реактивность ВНИЗ (PWR, BWR)
   *   замедляет графит, охлаждает вода -> вода была лишним ПОГЛОТИТЕЛЕМ,
   *                                 замедление не пострадало
   *                                 -> реактивность ВВЕРХ (РБМК)
   *   тяжёлая вода и то и другое, но решётка перезамедлена
   *                                 -> потеря охлаждающей D2O почти не
   *                                    трогает замедление, зато снимает
   *                                    поглощение -> ВВЕРХ (CANDU)
   *   замедлителя нет, охлаждает натрий -> ушёл натрий -> спектр жёстче,
   *                                    утечка выше; в центре зоны первое
   *                                    перевешивает -> ВВЕРХ
   *   охлаждает газ                 -> у газа почти нет ядерных свойств
   *                                 -> пустотный эффект около нуля
   * ------------------------------------------------------------------ */

  /* Замедлитель. Lambda — время генерации мгновенных нейтронов: в лёгкой
   * воде замедление занимает микросекунды, в графите и тяжёлой воде — на
   * два порядка дольше, потому что рассеяний нужно в разы больше, а
   * поглощения почти нет. Это ровно тот параметр, который решает, успевает
   * ли человек вообще что-то сделать. alphaC — температурный коэффициент
   * замедлителя при его СОБСТВЕННОЙ роли (без учёта пустот). */
  const MODERATORS = [
    { id: 'h2o',      Lambda: 2.0e-5, spectrum: 'thermal', alphaC: -25,
      /* H2O: сильное замедление на малой длине, сильный отрицательный
       * температурный эффект — нагрев воды снижает её плотность и
       * замедление сразу. Lambda 2e-5 с — стандарт для PWR. */
      thermalising: 1.00 },
    { id: 'd2o',      Lambda: 8.0e-4, spectrum: 'thermal', alphaC: -8,
      /* D2O: поглощение почти нулевое, поэтому нейтрон живёт долго —
       * Lambda на полтора порядка больше. Температурный эффект слабее и на
       * природном уране может менять знак. */
      thermalising: 0.92 },
    { id: 'graphite', Lambda: 6.0e-4, spectrum: 'thermal', alphaC: 2,
      /* Графит: большая решётка, длинная миграция, Lambda того же порядка,
       * что у D2O. Температурный эффект самого графита ПОЛОЖИТЕЛЕН —
       * нагрев смещает спектр к резонансам плутония. */
      thermalising: 0.88 },
    { id: 'none',     Lambda: 4.0e-7, spectrum: 'fast', alphaC: -0.5,
      /* Замедлителя нет: спектр быстрый, Lambda на два порядка МЕНЬШЕ, чем
       * в воде. Всё происходит в микросекундах, и запас по запаздывающим
       * нейтронам — единственное, что отделяет от разгона. */
      thermalising: 0 }
  ];

  /* Теплоноситель. alphaVoid здесь — БАЗОВОЕ значение «сам по себе»;
   * итоговое собирается ниже с учётом того, кто замедляет. */
  const COOLANTS = [
    { id: 'h2o',  Tsat: 345, hfg: 966e3,  cp: 8.9e3, rr: 0.172,
      Tin: 290, dTcool: 30,  moderates: 1.00, absorbs: 1.00, gas: false },
    { id: 'd2o',  Tsat: 310, hfg: 1180e3, cp: 5.4e3, rr: 0.110,
      Tin: 265, dTcool: 45,  moderates: 0.92, absorbs: 0.06, gas: false },
    { id: 'co2',  Tsat: 0,   hfg: 0,      cp: 1.2e3, rr: 1,
      Tin: 250, dTcool: 150, moderates: 0.02, absorbs: 0.02, gas: true },
    { id: 'he',   Tsat: 0,   hfg: 0,      cp: 5.2e3, rr: 1,
      Tin: 300, dTcool: 200, moderates: 0.00, absorbs: 0.00, gas: true },
    { id: 'na',   Tsat: 880, hfg: 3870e3, cp: 1.27e3, rr: 0.0015,
      Tin: 380, dTcool: 150, moderates: 0.03, absorbs: 0.09, gas: false },
    { id: 'pb',   Tsat: 1745, hfg: 858e3, cp: 0.147e3, rr: 0.0004,
      Tin: 400, dTcool: 130, moderates: 0.01, absorbs: 0.02, gas: false }
  ];

  const modSpec = (id) => MODERATORS.find((m) => m.id === id) || MODERATORS[0];
  const coolSpec = (id) => COOLANTS.find((c) => c.id === id) || COOLANTS[0];

  /**
   * Собрать параметры зоны из четырёх выборов.
   *
   *   fissile   — 'U235' | 'Pu239' | 'U233' | 'MOX'
   *   fertile   — 'U238' | 'Th232' | null
   *   enrichment— доля делящегося, %
   *   moderator — id из MODERATORS
   *   coolant   — id из COOLANTS
   *
   * Возвращает ПАТЧ параметров: то, что нужно наложить на defaults().
   */
  function composeCore(o) {
    const md = modSpec(o && o.moderator);
    const cl = coolSpec(o && o.coolant);
    const e = Math.min(Math.max(num(o && o.enrichment, 4), 0.1), 100) / 100;
    const fis = (o && o.fissile) || 'U235';
    const fer = (o && o.fertile) || null;

    /* --- спектр и время генерации --- */
    const spectrum = md.spectrum;
    /* MODERATORS.Lambda — ЭФФЕКТИВНОЕ время генерации, то, что видит
     * оператор. Плант умножает p.Lambda на масштаб спектра (1 для
     * теплового, 1e-3 для быстрого), поэтому в параметр кладётся частное:
     * иначе быстрая зона получила бы 4e-10 вместо 4e-7. */
    const lamScale = spectrum === 'fast' ? 1e-3
                   : (spectrum === 'intermediate' ? 1e-2 : 1);
    const Lambda = md.Lambda / lamScale;
    const LambdaEff = md.Lambda;

    /* --- состав делений --- */
    const FIS = { U235: { U235: 1 }, Pu239: { Pu239: 1 }, U233: { U233: 1 },
                  MOX: { Pu239: 0.83, Pu241: 0.17 } };
    const fissionFractions = (() => {
      const f = {};
      const base = FIS[fis] || FIS.U235;
      /* Доля делений на сырьевом нуклиде: в тепловом спектре она мала
       * (U-238 делится только быстрыми), в быстром — заметна. Та же
       * замкнутая форма, что и в fissionFractions(), но с явным выбором
       * сырья. */
      const kFast = spectrum === 'fast' ? 0.30 : (spectrum === 'thermal' ? 0.055 : 0.15);
      const ff = fer ? Math.min(kFast * (1 - e), 0.6) : 0;
      for (const k of Object.keys(base)) f[k] = base[k] * (1 - ff);
      if (fer) f[fer === 'Th232' ? 'U233' : 'U238'] = ff;
      /* Th-232 в модели не значится делящимся нуклидом: его деления
       * пренебрежимы, а вклад в кинетику идёт через U-233, в который он
       * превращается. Это объявленное упрощение, а не описка. */
      return f;
    })();

    /* --- ДОПЛЕР. Он живёт на резонансах СЫРЬЕВОГО нуклида: U-238 и Th-232.
     * Чем меньше сырья, тем меньше резонансного поглощения, которому есть
     * куда уширяться. Поэтому коэффициент масштабируется долей сырья.
     * Опорная точка: -2,5 pcm/K при 4 % обогащения (то есть 96 % U-238) —
     * стандартное значение PWR. Th-232 резонансов даёт больше, чем U-238,
     * примерно в 1,3 раза. Пол в 0,15 pcm/K — не физика, а признание того,
     * что совсем без резонансов остаётся рассеяние на решётке. --- */
    const fertileFrac = fer ? (1 - e) : 0;
    const fertK = fer === 'Th232' ? 1.3 : 1;
    const alphaD = -Math.max(0.15, 2.5 * fertK * fertileFrac / 0.96)
                 * (spectrum === 'fast' ? 0.42 : 1);

    /* --- ПУСТОТНЫЙ ЭФФЕКТ.
     *
     * Решающая величина — НЕ «какой теплоноситель», а какую долю замедления
     * выполняет жидкость ИМЕННО В КАНАЛЕ. Если она же и есть замедлитель
     * (PWR: вода одна на обе роли), уход её уносит замедление целиком. Если
     * замедляет отдельный объём — графитовая кладка или холодный бак
     * тяжёлой воды, — то в канале жидкость почти не замедляет, зато
     * поглощает, и её уход даёт ПЛЮС. Поэтому доля задаётся парой
     * «замедлитель + теплоноситель», а не одним из них.
     *
     * Три слагаемых:
     *   -K_mod · доля_канала · замедляющая_способность   потеря замедления
     *   +K_abs · поглощение                              потеря поглощения
     *   +K_hard · (1 - доля_канала) · (1 - обогащение)   ужесточение спектра
     *             + быстрая надбавка
     *
     * Калибровка по четырём известным точкам, и она сходится:
     *   PWR (H2O/H2O, 4 %)      -15500 + 3500              = -12000
     *   CANDU (D2O/D2O, 0,71 %) -1141 + 210 + 1827         =   +896
     *   РБМК (графит/H2O, 2 %)  -620 + 3500 + 1882         =  +4762
     *   быстрый (нет/Na, 20 %)  0 + 315 + 0 + 1200         =  +1515
     * Это порядок величины, а не расчёт зоны. --- */
    const CH_SHARE = {
      'h2o|h2o': 1.00,      // вода одна на обе роли — классический PWR/BWR
      'h2o|d2o': 0.90,
      'd2o|d2o': 0.08,      // CANDU: замедляет холодный бак, канал почти нет

      'graphite|h2o': 0.04, // РБМК: кладка делает всё, вода — лишний поглотитель
      'graphite|d2o': 0.03,
      'none|na': 0, 'none|pb': 0
    };
    const key = md.id + '|' + cl.id;
    const chShare = Number.isFinite(CH_SHARE[key]) ? CH_SHARE[key]
                  : (md.id === 'none' ? 0 : (md.id === cl.id ? 1 : 0.05));
    const lossOfModeration = -15500 * chShare * cl.moderates;
    const lossOfAbsorption = +3500 * cl.absorbs;

      ? 1200 : 2000 * (1 - chShare) * (1 - e);

    if (cl.gas) alphaVoid = 0;                  // у газа нечему вскипать

    const dTfull = spectrum === 'fast' ? 400 : (cl.gas ? 700 : 320);

      spectrum, fuelType: 'uranium', enrichment: o && o.enrichment,
      fissionFractions, Lambda, LambdaEff,
      alphaD: +alphaD.toFixed(3), alphaC, alphaVoid,

  /* Inhour equation, verbatim structure from kinetics.html.
   * Third argument (optional) is a kinetics set {beta, lam, ...}; without it
   * the shipped U-235 thermal set is used, so every existing call is
   * unchanged bit for bit. */
  function inhour(omega, Lambda, kin) {
    const be = kin ? kin.beta : BETA, la = kin ? kin.lam : LAM;
    let s = omega * Lambda;
    for (let i = 0; i < 6; i++) s += be[i] * omega / (omega + la[i]);
    return s;
  }

  /* Dominant root of the inhour equation. Port of findOmega() from
   * kinetics.html lines 340-361 (bisection, unique root in (-lam_min, inf)). */
  function findOmega(rho, Lambda, kin) {
    if (Math.abs(rho) < 1e-14) return 0;
    const f = (w) => inhour(w, Lambda, kin) - rho;
    let lo = -(kin ? kin.lamMin : LAM_MIN) + 1e-9;
    let hi;
    if (rho > 0) {
      lo = 1e-12; hi = 1.0;
      while (f(hi) < 0 && hi < 1e12) hi *= 10;
    } else {
      hi = -1e-12;
    }
    let flo = f(lo), a = lo, b = hi;
    for (let k = 0; k < 200; k++) {
      const m = 0.5 * (a + b);
      const fm = f(m);
      if (fm === 0) { a = b = m; break; }
      if ((fm < 0) === (flo < 0)) { a = m; flo = fm; } else { b = m; }
      if (Math.abs(b - a) < 1e-15 * Math.max(1, Math.abs(a))) break;
    }
    return 0.5 * (a + b);
  }

  function polyMul(a, b) {
    const r = new Array(a.length + b.length - 1).fill(0);
    for (let i = 0; i < a.length; i++)
      for (let j = 0; j < b.length; j++) r[i + j] += a[i] * b[j];
    return r;
  }
  function polyAdd(a, b) {
    const n = Math.max(a.length, b.length);
    const r = new Array(n).fill(0);
    for (let i = 0; i < a.length; i++) r[n - a.length + i] += a[i];
    for (let i = 0; i < b.length; i++) r[n - b.length + i] += b[i];
    return r;
  }
