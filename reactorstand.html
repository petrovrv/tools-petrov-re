                            pMPa: this.secLast ? this.secLast.pMPa : NaN,
                            Qsg: this.secLast ? this.secLast.Qsg : NaN,
                            Qsteam: this.secLast ? this.secLast.Qst : NaN,
                            mwElec: this.secLast ? this.secLast.mwElec : NaN } : null,
        calm: this.calm, melt: this.melt,
        running: this.running, suspended: this.suspended, failed: !!this.fail,
        fail: this.fail ? { code: this.fail.code, tModel: this.fail.tModel } : null,
        speed: this.speed, speedAchieved: this.achieved, deficit: this.deficit,
        tModel: this.tModel, tWall: this.tWall, windowSec: this.windowSec,
        sampleStep: this.sampleStep(),
        u: { reg: this.u.reg, tipd: this.u.tipd },
        d: { Tin: this.d.Tin, flow: this.d.flow },
        setpoint: { power: this.setPower, tempOut: this.setTemp },
        equilibriumFeasible: this.eqFeasible,
        auto: Object.assign({}, AUTO_OF[this.mode]),
        autoLimit: Object.assign({}, this.autoLimit),
        buffer: { cap: this.ring.cap, n: this.ring.n, bytes: this.ring.bytes(),
                  channels: this.ring.channels.length },
        probe: pr,
        params: Object.assign({}, this.p)
      };
    }

    /** Границы шкал лент — для численной проверки, что ленты двигаются. */
    stripInfo() {
      return this.strips.map((s) => ({
        id: s.def.id, lo: s.bounds.lo, hi: s.bounds.hi,
        w: s.w, h: s.h, alt: s.cv.getAttribute('aria-label')
      }));
    }

    destroy() {
      this.stop();
      this.destroyed = true;
      this.drag = null;
      if (this.eq && this.eq.destroy) {
        try { this.eq.destroy(); } catch (e) { /* чужой модуль */ }
      }
      this.eq = null;
      this.sn = null;
      if (this.io) this.io.disconnect();
      if (this.ro) this.ro.disconnect();
      if (this.mo) this.mo.disconnect();
      if (this.onVis && typeof document !== 'undefined' && document.removeEventListener) {
        document.removeEventListener('visibilitychange', this.onVis);
      }
      if (this.el) { this.el.innerHTML = ''; this.el.classList.remove('rcon-host'); }
      const i = INSTANCES.indexOf(this);
      if (i >= 0) INSTANCES.splice(i, 1);
      return null;
    }
  }

  function fmtClock(s, lang) {
    if (!fin(s)) return '—';
    const neg = s < 0; const a = Math.abs(s);
    const two = (v) => (v < 10 ? '0' : '') + Math.floor(v);
    let body;
    if (a < 60) {
      /* Десятая доля секунды пишется целиком, а не приклеивается к отдельно
         усечённой секунде: 8,99 с — это 0:09,0, а не 0:08,0. */
      body = '0:' + (a < 9.95 ? '0' : '') + nf(a, 1, lang);
    } else {
      const h = Math.floor(a / 3600), m = Math.floor((a % 3600) / 60);
      const sec = Math.floor(a % 60);
      body = h > 0 ? h + ':' + two(m) + ':' + two(sec) : m + ':' + two(sec);
    }
    return (neg ? '−' : '') + body;
  }

  /* Период реактора при ρ -> 0 уходит в бесконечность. Печатать «−56 808 289 с»
     — это делать вид, что число что-то значит; порог объявлен явно. */
  const PERIOD_INF = 1e5;
  function fmtPeriod(v, lang) {
    if (!fin(v) || Math.abs(v) > PERIOD_INF) {
      return (fin(v) && v < 0 ? '−' : '') + '∞ (|T| > '
        + ne(PERIOD_INF, 0, lang) + ' ' + tx('secs', lang) + ')';
    }
    if (Math.abs(v) < 1) return ne(v, 2, lang) + ' ' + tx('secs', lang);
    return nf(v, Math.abs(v) < 100 ? 1 : 0, lang) + ' ' + tx('secs', lang);
  }

  function mount(el, opts) {
    const inst = new Stand(el, opts || {});
    const h = {
      setLang: (l) => { inst.setLang(l); return h; },
      setMode: (m) => { inst.setMode(m); return h; },
      setPreset: (p) => { inst.setPreset(p); return h; },
      setSpeed: (k) => { inst.setSpeed(k); return h; },
      setWindow: (s) => { inst.setWindow(s); return h; },
      setControl: (id, v) => { inst.setControl(id, v); return h; },
      setParam: (k, v) => { inst.setParam(k, v); return h; },
      nudge: (k) => { inst.nudge(k); return h; },
      start: () => { inst.start(); return h; },
      stop: () => { inst.stop(); return h; },
      reset: () => { inst.reset(); return h; },
      recover: () => { inst.recover(); return h; },
      state: () => inst.state(),
      strips: () => inst.stripInfo(),
      scheme: () => inst.schemeInfo(),
      handles: () => HANDLE_IDS.slice(),
      /* Программный эквивалент перетаскивания — для тестов и для клавиатуры. */
      drag: (id, v) => { inst.applyHandle(id, v); return h; },
      destroy: () => inst.destroy(),
      el: () => inst.el,
      /* Для сборочной ветки: прямой доступ к объекту стенда не нужен, но
         иногда нужен сам plant, с которым он смонтирован. */
      plant: () => inst.plant
    };
    inst.handle = h;
    return h;
  }

  return {
    version: VERSION,
    mount,
    modes: MODES.slice(),
    speeds: SPEEDS.slice(),
    windows: WINDOWS.slice(),
    langs: LANGS.slice(),
    channels: CHANNELS.slice(),
    stripIds: STRIP_DEFS.map((s) => s.id),
    handleIds: HANDLE_IDS.slice(),
    /* Геометрия схемы объявлена: тесты меряют пиксели в этих координатах. */
    schemeBox: { w: SW, h: SH },
    labels: T,
    /* Открыто для тестов: чистые функции без DOM. */
    util: { Ring, niceBounds, niceStep, nf, ne, fmtClock, fmtPeriod, clamp, clamp01,

            FLOW_MIN_CTL, FLOW_MAX_CTL, ROD_DOLLARS_PER_S },
    instances: () => INSTANCES.slice()

/* ---------------------------------------------------------------------------
   build/stand.js — the page around the instrument, on the shared UI framework.

   This file is owned by the build, not by a branch. It is the whole of
   reactorstand.html that is not console.js, equilib.js or plant-reactor.js.

   What changed with the port to tools.petrov.re/ui/v1: the page no longer
   draws a banner, a language strip, a theme button, prose cards or a footer of
   its own — the framework owns all of that. What this file does now is

     1. mount the one RCON instance, as before, into a detached host;
     2. hand its parts to the framework's slots — the mimic to the stage, the
        knobs, the physics switches, the core composer and the nudges to
        `inputs`, the readouts to `results`, the strip charts and the
        equilibrium map to the `dock`, the caveats to the `footer`;
     3. declare the four page-level controls (preset, mode, time multiplier,
        strip window) as framework fields that drive the same RCON handle;
     4. keep the page's six-language texts, which are now learn topics and
        footer prose instead of two cards of prose above the instrument;
     5. keep Diagram.init() exactly as it was — the permalink, the record, the
        report sections and the handoff are unchanged by the port.

   It still knows nothing about app.js, glue.js, SCEN, ANIM or PLOT: none of
   them is on this page. The instrument is mounted with PLANT_REACTOR and left
   alone: every number on the screen is still computed by console.js.
   ------------------------------------------------------------------------ */
(function () {
  'use strict';

  const UI_API = 'tools.petrov.re/ui/v1';
  const LANGS = ['en', 'uk', 'de', 'nl', 'fr', 'es'];
  const LANG_NAME = {
    en: 'English', uk: 'Українська', de: 'Deutsch',
    nl: 'Nederlands', fr: 'Français', es: 'Español'
  };
  const L6 = (en, uk, de, nl, fr, es) => ({ en, uk, de, nl, fr, es });
  const T = {

    'title': L6(
      'Reactor Live Stand',
      'Живий стенд реактора',
      'Reaktor-Live-Prüfstand',
      'Live-opstelling reactor',
      'Banc de réacteur en temps réel',
      'Banco de reactor en tiempo real'),

    'subtitle': L6(
      'Point kinetics with xenon and thermal feedback, integrated continuously in wall time. Turn the knobs while it runs.',
      'Точкова кінетика з ксеноном і тепловими зворотними зв’язками, інтегрується безперервно за настінним часом. Ручки крутяться під час рахунку.',
      'Punktkinetik mit Xenon und thermischen Rückführungen, laufend in Echtzeit integriert. Die Knöpfe werden im laufenden Betrieb gedreht.',
      'Puntkinetica met xenon en thermische terugkoppelingen, doorlopend in werkelijke tijd geïntegreerd. U draait aan de knoppen terwijl het rekent.',
      'Cinétique ponctuelle avec xénon et contre-réactions thermiques, intégrée en continu en temps réel. On tourne les boutons pendant que ça tourne.',
      'Cinética puntual con xenón y realimentaciones térmicas, integrada de forma continua en tiempo real. Los mandos se giran mientras funciona.'),

    'intro.h': L6('What this is', 'Що це таке', 'Was das ist', 'Wat dit is',
      'Ce que c’est', 'Qué es esto'),

    'intro.p1': L6(
      'Not a run and not a chart of a finished record: an instrument. The reactor integrates continuously for as long as this page is open and visible, model time is tied to the clock by a multiplier from ×1 to ×1000, and the strip charts scroll like an oscilloscope. Every control acts on the machine that is already running.',
      'Це не прогін і не графік готового запису, а прилад. Реактор інтегрується безперервно, доки ця сторінка відкрита й видима; модельний час прив’язаний до годинника множником від ×1 до ×1000, а стрічки біжать, як на осцилографі. Кожен орган керування діє на машину, яка вже працює.',
      'Kein Lauf und kein Diagramm einer fertigen Aufzeichnung, sondern ein Gerät. Der Reaktor integriert fortlaufend, solange diese Seite offen und sichtbar ist; die Modellzeit hängt über einen Faktor von ×1 bis ×1000 an der Uhr, und die Bandschreiber laufen wie auf einem Oszilloskop. Jedes Bedienelement wirkt auf die bereits laufende Maschine.',
      'Geen run en geen grafiek van een afgeronde opname, maar een instrument. De reactor integreert doorlopend zolang deze pagina open en zichtbaar is; de modeltijd hangt via een factor ×1 tot ×1000 aan de klok, en de schrijvers lopen als op een oscilloscoop. Elke bediening werkt op de machine die al draait.',
      'Ni un essai ni le graphique d’un enregistrement terminé : un instrument. Le réacteur intègre en continu tant que cette page est ouverte et visible ; le temps modèle est accroché à l’horloge par un facteur de ×1 à ×1000, et les enregistreurs défilent comme sur un oscilloscope. Chaque commande agit sur la machine déjà en marche.',
      'Ni un ensayo ni el gráfico de un registro terminado: un instrumento. El reactor integra de forma continua mientras esta página esté abierta y visible; el tiempo del modelo va unido al reloj por un factor de ×1 a ×1000, y los registradores corren como en un osciloscopio. Cada mando actúa sobre la máquina que ya está funcionando.'),

    'intro.p2': L6(
      'The mimic diagram is not a picture. Everything drawn with a dashed outline is a handle: drag the two rod banks, the coolant valve, the inlet temperature and the power demand with the mouse, or reach a handle with Tab and move it with the arrow keys. The sliders in the left-hand column are the same quantities, to the same limits — the diagram and the sliders always agree because they are one set of values shown twice.',
      'Мнемосхема — не картинка. Усе, що обведено пунктиром, є ручкою: два банки стержнів, кран теплоносія, температуру на вході й задану потужність можна тягнути мишею, а можна дійти до ручки клавішею Tab і рухати стрілками. Повзунки в лівій колонці — ті самі величини й ті самі межі: схема й повзунки завжди узгоджені, бо це один набір значень, показаний двічі.',
      'Das Fließbild ist kein Bild. Alles gestrichelt Umrandete ist ein Griff: die beiden Stabbänke, das Kühlmittelventil, die Eintrittstemperatur und die Leistungsvorgabe lassen sich mit der Maus ziehen oder mit Tab ansteuern und mit den Pfeiltasten verstellen. Die Schieber in der linken Spalte sind dieselben Größen mit denselben Grenzen — Bild und Schieber stimmen immer überein, weil es ein Satz Werte ist, der zweimal gezeigt wird.',
      'Het processchema is geen plaatje. Alles met een streepjesrand is een greep: de twee staafbanken, de koelmiddelklep, de intredetemperatuur en de vermogensvraag zijn met de muis te slepen, of met Tab te bereiken en met de pijltoetsen te verstellen. De schuiven in de linkerkolom zijn dezelfde grootheden met dezelfde grenzen — schema en schuiven kloppen altijd met elkaar, want het is één stel waarden dat twee keer wordt getoond.',
      'Le synoptique n’est pas une image. Tout ce qui est entouré de pointillés est une poignée : les deux groupes de barres, la vanne de réfrigérant, la température d’entrée et la consigne de puissance se tirent à la souris, ou s’atteignent au clavier avec Tab et se déplacent avec les flèches. Les curseurs de la colonne de gauche sont les mêmes grandeurs, avec les mêmes limites — le schéma et les curseurs sont toujours d’accord, car c’est un seul jeu de valeurs montré deux fois.',
      'El sinóptico no es un dibujo. Todo lo que lleva un contorno de trazos es un tirador: los dos bancos de barras, la válvula de refrigerante, la temperatura de entrada y la consigna de potencia se arrastran con el ratón, o se alcanzan con Tab y se mueven con las flechas. Los deslizadores de la columna izquierda son las mismas magnitudes con los mismos límites — el esquema y los deslizadores siempre coinciden, porque es un solo juego de valores mostrado dos veces.'),

    'intro.p3': L6(
      'Three modes decide who drives what. In manual, everything is yours. Holding the outlet temperature puts the coolant flow on automatic and leaves the rods to you; holding power puts the rods on automatic and leaves the flow and the inlet temperature to you. What is on automatic is marked as such on the knob it has taken over, and the limits it is allowed to work within are written out rather than implied.',
      'Три режими вирішують, хто чим керує. У ручному все ваше. Утримання температури на виході віддає автоматиці витрату теплоносія й лишає вам стержні; утримання потужності віддає автоматиці стержні й лишає вам витрату та температуру на вході. Те, що на автоматі, позначено просто на тій ручці, яку автомат перебрав, а межі, у яких йому дозволено працювати, написані, а не маються на увазі.',
      'Drei Betriebsarten entscheiden, wer was führt. Von Hand gehört alles Ihnen. Das Halten der Austrittstemperatur legt den Kühlmitteldurchsatz auf Automatik und lässt Ihnen die Stäbe; das Halten der Leistung legt die Stäbe auf Automatik und lässt Ihnen Durchsatz und Eintrittstemperatur. Was automatisch läuft, ist an genau dem Knopf gekennzeichnet, den die Automatik übernommen hat, und ihre zulässigen Grenzen stehen da, statt gemeint zu sein.',
      'Drie bedrijfsstanden bepalen wie wat stuurt. Handmatig is alles van u. Het houden van de uittredetemperatuur zet het koelmiddeldebiet op automaat en laat u de staven; het houden van het vermogen zet de staven op automaat en laat u het debiet en de intredetemperatuur. Wat op automaat staat is gemerkt bij precies die knop die de automaat heeft overgenomen, en de grenzen waarbinnen die mag werken staan er, in plaats van bedoeld te zijn.',
      'Trois modes décident qui conduit quoi. En manuel, tout est à vous. Tenir la température de sortie met le débit de réfrigérant en automatique et vous laisse les barres ; tenir la puissance met les barres en automatique et vous laisse le débit et la température d’entrée. Ce qui est en automatique est marqué sur le bouton même que l’automatisme a pris, et les limites dans lesquelles il a le droit de travailler sont écrites, non sous-entendues.',
      'Tres modos deciden quién conduce qué. En manual, todo es suyo. Mantener la temperatura de salida pone el caudal de refrigerante en automático y le deja las barras; mantener la potencia pone las barras en automático y le deja el caudal y la temperatura de entrada. Lo que está en automático está marcado en el propio mando que el automatismo ha tomado, y los límites en los que puede trabajar están escritos, no sobreentendidos.'),

    'intro.p4': L6(
      'The preset picker loads a whole reactor family at once — generation time, delayed-neutron fraction, feedback coefficients, boiling and rod worths together — so that the difference between families is a difference in behaviour and not in one number. The speed multiplier and the width of the time window are separate controls, and the clock line says what was ordered and what the frame actually managed. When an operating point leaves the range the model is valid in, the stand refuses in writing and offers to recover instead of drawing rubbish.',
      'Вибір пресета завантажує цілу родину реакторів одразу — час генерації, частку запізнілих нейтронів, коефіцієнти зворотного зв’язку, кипіння та ваги стержнів разом, — щоб різниця між родинами була різницею в поведінці, а не в одному числі. Множник швидкості й ширина вікна часу — окремі органи керування, а рядок годинника каже, що замовлено і що кадр справді встиг. Коли робоча точка виходить за межі застосовності моделі, стенд відмовляє письмово й пропонує відновлення замість того, щоб малювати дурницю.',
      'Die Voreinstellung lädt eine ganze Reaktorfamilie auf einmal — Generationszeit, Anteil verzögerter Neutronen, Rückführkoeffizienten, Sieden und Stabwerte zusammen —, damit der Unterschied zwischen den Familien ein Unterschied im Verhalten ist und nicht in einer Zahl. Geschwindigkeitsfaktor und Fensterbreite sind eigene Bedienelemente, und die Uhrzeile sagt, was bestellt war und was der Bildaufbau tatsächlich geschafft hat. Verlässt der Arbeitspunkt den Gültigkeitsbereich des Modells, verweigert der Prüfstand schriftlich und bietet die Rückkehr an, statt Unsinn zu zeichnen.',
      'De voorinstelling laadt een hele reactorfamilie in één keer — generatietijd, aandeel vertraagde neutronen, terugkoppelcoëfficiënten, koken en staafwaarden samen — zodat het verschil tussen families een verschil in gedrag is en niet in één getal. De snelheidsfactor en de vensterbreedte zijn aparte bedieningen, en de klokregel zegt wat er besteld was en wat het beeld werkelijk haalde. Verlaat het werkpunt het geldigheidsgebied van het model, dan weigert de opstelling schriftelijk en biedt herstel aan in plaats van onzin te tekenen.',
      'Le sélecteur de préréglage charge toute une famille de réacteurs d’un coup — temps de génération, fraction de neutrons retardés, coefficients de contre-réaction, ébullition et efficacités des barres ensemble — pour que l’écart entre familles soit un écart de comportement et non d’un seul nombre. Le facteur de vitesse et la largeur de fenêtre sont des commandes distinctes, et la ligne d’horloge dit ce qui a été demandé et ce que l’image a réellement tenu. Lorsque le point de fonctionnement sort du domaine de validité du modèle, le banc refuse par écrit et propose la récupération plutôt que de dessiner n’importe quoi.',
      'El selector de preajustes carga una familia entera de reactores de una vez — tiempo de generación, fracción de neutrones retardados, coeficientes de realimentación, ebullición y valores de las barras a la vez — para que la diferencia entre familias sea una diferencia de comportamiento y no de un solo número. El factor de velocidad y el ancho de la ventana son mandos aparte, y la línea del reloj dice qué se pidió y qué alcanzó realmente el cuadro. Cuando el punto de trabajo sale del rango de validez del modelo, el banco se niega por escrito y ofrece la recuperación en vez de dibujar un disparate.'),

    'honest.h': L6('What this model does not do', 'Чого ця модель не робить',
      'Was dieses Modell nicht leistet', 'Wat dit model niet doet',
      'Ce que ce modèle ne fait pas', 'Lo que este modelo no hace'),

    'honest.p1': L6(
      'Point kinetics with no space in it. There is one power, one fuel temperature and one coolant channel; there is no axial or radial distribution, no flux tilt, no local boiling crisis and no way for one part of the core to behave differently from another. Nothing here reproduces any particular plant or any particular accident.',
      'Точкова кінетика без простору. Є одна потужність, одна температура палива й один канал теплоносія; немає ані осьового, ані радіального розподілу, немає перекосу потоку, немає локальної кризи кипіння і немає можливості, щоб одна частина активної зони поводилася інакше за іншу. Ніщо тут не відтворює якусь конкретну установку чи якусь конкретну аварію.',
      'Punktkinetik ohne Raum. Es gibt eine Leistung, eine Brennstofftemperatur und einen Kühlmittelkanal; es gibt keine axiale oder radiale Verteilung, keine Flussschieflage, keine örtliche Siedekrise und keine Möglichkeit, dass sich ein Teil des Kerns anders verhält als ein anderer. Nichts hier bildet eine bestimmte Anlage oder einen bestimmten Unfall ab.',
      'Puntkinetica zonder ruimte. Er is één vermogen, één brandstoftemperatuur en één koelmiddelkanaal; er is geen axiale of radiale verdeling, geen fluxscheefstand, geen plaatselijke kookcrisis en geen manier waarop het ene deel van de kern zich anders gedraagt dan het andere. Niets hier geeft een bepaalde installatie of een bepaald ongeval weer.',
      'Cinétique ponctuelle sans espace. Il y a une puissance, une température de combustible et un canal de réfrigérant ; il n’y a ni distribution axiale ou radiale, ni basculement de flux, ni crise d’ébullition locale, ni moyen qu’une partie du cœur se comporte autrement qu’une autre. Rien ici ne reproduit une installation particulière ni un accident particulier.',
      'Cinética puntual sin espacio. Hay una potencia, una temperatura de combustible y un canal de refrigerante; no hay distribución axial ni radial, ni basculamiento del flujo, ni crisis de ebullición local, ni forma de que una parte del núcleo se comporte de otro modo que otra. Nada de esto reproduce una instalación concreta ni un accidente concreto.'),

    'honest.p2': L6(
      'The preset families are teaching parameterisations, not the data sheet of any reactor: they are chosen so that the mechanisms differ visibly from one another, and their numbers have not been checked against a plant. This is not a thermal-hydraulic code either — the coolant is one lumped channel with a simple boiling model, there is no pressure dynamics, no critical-heat-flux correlation and no two-phase flow map.',
      'Родини пресетів — навчальні параметризації, а не паспорт якогось реактора: їх підібрано так, щоб механізми помітно відрізнялися один від одного, і їхні числа з установкою не звірялися. Це також не теплогідравлічний код — теплоносій є одним зосередженим каналом із простою моделлю кипіння, немає динаміки тиску, немає кореляції критичного теплового потоку і немає карти двофазної течії.',
      'Die Voreinstellungsfamilien sind didaktische Parametrierungen und kein Datenblatt irgendeines Reaktors: sie sind so gewählt, dass sich die Mechanismen sichtbar voneinander unterscheiden, und ihre Zahlen wurden nicht gegen eine Anlage geprüft. Es ist auch kein thermohydraulischer Code — das Kühlmittel ist ein konzentrierter Kanal mit einfachem Siedemodell, es gibt keine Druckdynamik, keine Korrelation der kritischen Wärmestromdichte und keine Zweiphasen-Strömungskarte.',
      'De voorinstellingsfamilies zijn didactische parametriseringen en geen datablad van enige reactor: ze zijn zo gekozen dat de mechanismen zichtbaar van elkaar verschillen, en hun getallen zijn niet aan een installatie getoetst. Het is ook geen thermisch-hydraulische code — het koelmiddel is één geconcentreerd kanaal met een eenvoudig kookmodel, er is geen drukdynamica, geen correlatie voor de kritieke warmtestroomdichtheid en geen tweefasenstromingskaart.',
      'Les familles de préréglages sont des paramétrages pédagogiques et non la fiche technique d’un réacteur : elles sont choisies pour que les mécanismes diffèrent visiblement les uns des autres, et leurs valeurs n’ont pas été confrontées à une installation. Ce n’est pas non plus un code thermohydraulique — le réfrigérant est un canal unique à paramètres localisés avec un modèle d’ébullition simple, sans dynamique de pression, sans corrélation de flux thermique critique et sans carte d’écoulement diphasique.',
      'Las familias de preajustes son parametrizaciones docentes y no la hoja de datos de ningún reactor: están elegidas para que los mecanismos difieran de forma visible entre sí, y sus cifras no se han contrastado con una instalación. Tampoco es un código termohidráulico — el refrigerante es un único canal de parámetros concentrados con un modelo de ebullición simple, sin dinámica de presión, sin correlación de flujo térmico crítico y sin mapa de flujo bifásico.'),

    'honest.p3': L6(
      'The spectrum switch selects a parameterisation, it does not compute a spectrum: choosing fast, intermediate or thermal loads a different generation time, delayed-neutron fraction and set of feedback coefficients, and no transport or slowing-down calculation is performed anywhere on this page. The equilibrium map is a study of the model that is loaded, not of a reactor.',
      'Перемикач спектра обирає параметризацію, а не рахує спектр: вибір швидкого, проміжного чи теплового завантажує інший час генерації, іншу частку запізнілих нейтронів та інший набір коефіцієнтів зворотного зв’язку, і жодного розрахунку перенесення чи сповільнення на цій сторінці не виконується. Карта рівноваг є дослідженням завантаженої моделі, а не реактора.',
      'Der Spektrumschalter wählt eine Parametrierung, er berechnet kein Spektrum: schnell, intermediär oder thermisch laden eine andere Generationszeit, einen anderen Anteil verzögerter Neutronen und einen anderen Satz Rückführkoeffizienten; eine Transport- oder Abbremsrechnung findet auf dieser Seite nirgends statt. Die Gleichgewichtskarte untersucht das geladene Modell, nicht einen Reaktor.',
      'De spectrumschakelaar kiest een parametrisering en berekent geen spectrum: snel, intermediair of thermisch laden een andere generatietijd, een ander aandeel vertraagde neutronen en een andere set terugkoppelcoëfficiënten; een transport- of afremberekening vindt op deze pagina nergens plaats. De evenwichtskaart onderzoekt het geladen model, niet een reactor.',
      'Le sélecteur de spectre choisit un paramétrage, il ne calcule pas de spectre : rapide, intermédiaire ou thermique chargent un autre temps de génération, une autre fraction de neutrons retardés et un autre jeu de coefficients de contre-réaction ; aucun calcul de transport ou de ralentissement n’est effectué sur cette page. La carte des équilibres étudie le modèle chargé, pas un réacteur.',
      'El conmutador de espectro elige una parametrización, no calcula un espectro: rápido, intermedio o térmico cargan otro tiempo de generación, otra fracción de neutrones retardados y otro juego de coeficientes de realimentación; en esta página no se hace ningún cálculo de transporte ni de moderación. El mapa de equilibrios estudia el modelo cargado, no un reactor.'),

    'honest.p4': L6(
      'The stand is bound to the clock, so the arithmetic is bounded too. One frame integrates at most a tenth of a second of wall time and spends at most a few milliseconds of processor on it; a tab that was hidden for ten minutes does not wind the model forward by ten minutes when it comes back. Whatever a frame cannot manage is shown as the difference between the speed you ordered and the speed that came out, never quietly accumulated as debt.',
      'Стенд прив’язаний до годинника, тож і арифметика обмежена. Один кадр враховує щонайбільше десяту частку настінної секунди й витрачає на неї щонайбільше кілька мілісекунд процесора; вкладка, схована на десять хвилин, після повернення не промотує модель на десять хвилин. Те, чого кадр не встиг, показано як різницю між замовленою і фактичною швидкістю, а не тихо накопичується як борг.',
      'Der Prüfstand hängt an der Uhr, also ist auch die Rechnerei begrenzt. Ein Bild verrechnet höchstens eine Zehntelsekunde Echtzeit und wendet dafür höchstens wenige Millisekunden Rechenzeit auf; ein zehn Minuten verborgener Reiter spult das Modell bei der Rückkehr nicht um zehn Minuten vor. Was ein Bild nicht schafft, erscheint als Unterschied zwischen bestellter und erreichter Geschwindigkeit und wird nie still als Schuld angehäuft.',
      'De opstelling hangt aan de klok, dus is ook het rekenwerk begrensd. Eén beeld verwerkt hoogstens een tiende seconde werkelijke tijd en besteedt daar hoogstens enkele milliseconden rekentijd aan; een tabblad dat tien minuten verborgen was, spoelt het model bij terugkeer niet tien minuten door. Wat een beeld niet haalt, verschijnt als verschil tussen de bestelde en de bereikte snelheid en wordt nooit stil als schuld opgehoopt.',
      'Le banc est accroché à l’horloge, donc le calcul est borné lui aussi. Une image intègre au plus un dixième de seconde de temps réel et y consacre au plus quelques millisecondes de processeur ; un onglet caché dix minutes ne fait pas avancer le modèle de dix minutes à son retour. Ce qu’une image ne tient pas apparaît comme l’écart entre la vitesse demandée et la vitesse obtenue, jamais accumulé en dette silencieuse.',
      'El banco está unido al reloj, así que el cálculo también está acotado. Un cuadro integra como mucho una décima de segundo de tiempo real y le dedica como mucho unos pocos milisegundos de procesador; una pestaña oculta durante diez minutos no adelanta el modelo diez minutos al volver. Lo que un cuadro no alcanza se muestra como la diferencia entre la velocidad pedida y la obtenida, nunca acumulado en silencio como deuda.'),

  /* ======================================================================
     2. Small helpers
     ================================================================== */
  let LANG = 'en';
  let ui = null;          /* the DiagramUI app, or null when the framework is absent */
  let STAND = null;       /* the one RCON instance */
  let HOST = null;        /* the detached element RCON is mounted into */
  let P = null;           /* the instrument's parts, by slot */
  let MOVED = [];         /* every node this file relocated, for the teardown */
  let TICK = 0;
  let FLOWT = 0;

  const pick = (d) => (d && (d[LANG] || d.en)) || '';
  const tr = (k) => pick(T[k]);
  const esc = (s) => String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  /* The instrument ships its own six-language dictionary. Every label the shell
     needs for a control that belongs to the instrument is taken from there, so
     the two never drift apart and nothing is translated twice. */
  const RLAB = (k) => ((typeof RCON !== 'undefined' && RCON.labels && RCON.labels[k]) || { en: k });
  const rts = (k) => pick(RLAB(k));
  const RU = () => ((typeof RCON !== 'undefined' && RCON.util) || null);

  /** Several six-language blocks into one, as paragraphs. */
  const join6 = function () {
    const parts = Array.prototype.slice.call(arguments);
    const out = {};
    for (const l of LANGS) {
      out[l] = parts.map((d) => (d && (d[l] || d.en)) || '').filter(Boolean).join('\n\n');
    }
    return out;
  };

  const MODE_KEY = { manual: 'modeManual', holdTemp: 'modeHoldTemp', holdPower: 'modeHoldPower' };

  /** A six-language label built out of the instrument's own words, not new ones. */
  const pfx6 = (p, d) => {
    const o = {};
    for (const l of LANGS) o[l] = p + ((d && (d[l] || d.en)) || '');
    return o;
  };

  /** The strip window, worded exactly as the instrument words it. */
  function fmtDur(s) {
    const u = RU();
    if (!u) return String(s);
    if (s < 120) return u.nf(s, 0, LANG) + ' ' + rts('secs');
    if (s < 3600) return u.nf(s / 60, 0, LANG) + ' ' + rts('mins');
    return u.nf(s / 3600, s % 3600 ? 1 : 0, LANG) + ' ' + rts('hours');
  }

  /* The same thresholds console.js uses for the word under the core on the
     mimic. Restated, not re-decided: the verdict must not disagree with the
     drawing. */
  function critKey(d) {
    if (!(typeof d === 'number' && isFinite(d))) return 'critDeep';
    if (d >= 1) return 'critPrompt';
    if (d > 0.02) return 'critSuper';
    if (d > -0.02) return 'critCrit';
    if (d > -1.2) return 'critSub';
    return 'critDeep';
  }

  /* ======================================================================
     3. The instrument
     ================================================================== */
  function buildStand() {
    if (STAND) return true;
    if (typeof RCON === 'undefined' || typeof PLANT_REACTOR === 'undefined') return false;
    HOST = document.createElement('div');
    try {
      STAND = RCON.mount(HOST, {
        plant: PLANT_REACTOR,
        lang: LANG,
        mode: 'manual',
        preset: 'pwr',
        speed: 10,
        windowSec: 300
      });
    } catch (err) {
      STAND = null;
      return false;
    }
    /* An instrument that opens standing still reads as a broken one. The one
       exception is prefers-reduced-motion: there nothing may start moving by
       itself, and the Run button is the only way in. */
    let calm = false;
    try { calm = matchMedia('(prefers-reduced-motion: reduce)').matches; }
    catch (e) { calm = false; }
    if (!calm) STAND.start();
    /* The acceptance run drives the page through this handle. */
    window.RSTAND = STAND;
    return true;
  }

  function destroyStand() {
    if (!STAND) return;
    try { STAND.destroy(); } catch (e) { /* a stand that is going away cannot fail */ }
    for (const n of MOVED) { if (n && n.parentNode) n.parentNode.removeChild(n); }
    MOVED = [];
    STAND = null; HOST = null; P = null;
    window.RSTAND = null;
  }

  /**
   * The instrument builds one block: a head, the mimic, a two-column body, the
   * equilibrium card and the caveats. The framework wants those pieces in named
   * slots, so they are taken apart here — by the instrument's own data-k marks,
   * never by position — and handed to the regions in section 5.
   *
   * Two couplings survive the move and are repaired here rather than in
   * console.js, which is not this file's to edit:
   *
   *   - relabel() looks its nodes up with root.querySelector, and half of them
   *     are no longer under root. The lookup is widened to the whole app.
   *   - the visibility observer watches root, which after the split covers only
   *     the mimic; a phone scrolled down to the strip charts would suspend the
   *     model. It is re-pointed at the whole shell.
   *
   * Both belong upstream as an RCON mount option (`slots:`), not as a patch.
   */
  function splitParts() {
    if (!STAND || !HOST) { P = null; return; }
    const root = HOST.querySelector('.rcon');
    if (!root) { P = null; return; }
    const q = (s) => root.querySelector(s);
    const attic = document.createElement('div');
    attic.hidden = true;

    P = {
      root: root,
      style: HOST.querySelector('style'),
      attic: attic,
      transport: q('[data-k="transport"]'),
      run: q('[data-k="run"]'),
      reset: q('[data-k="reset"]'),
      clocks: q('[data-k="clocks"]'),
      modeline: q('[data-k="modeline"]'),
      presetinfo: q('[data-k="presetinfo"]'),
      fail: q('[data-k="fail"]'),
      svgwrap: q('[data-k="svgwrap"]'),
      schemealt: q('[data-k="schemealt"]'),
      schemehint: q('[data-k="schemehint"]'),
      kbdhint: q('[data-k="kbdhint"]'),
      knobs: q('[data-k="knobs"]'),
      phys: q('[data-k="phys"]'),
      physnote: q('[data-k="physnote"]'),
      feas: q('[data-k="feas"]'),
      comp: q('[data-k="comp"]'),
      verdict: q('[data-k="verdict"]'),
      compnote: q('[data-k="compnote"]'),
      facts: q('[data-k="facts"]'),
      nudge: q('[data-k="nudge"]'),
      stripbox: q('[data-k="stripbox"]'),
      eqmount: q('[data-k="eqmount"]'),
      eqOn: !(q('[data-k="eqcard"]') || {}).hidden,
      notes: root.querySelector('.rcon-notes'),
      factsCard: null, capply: null
    };
    P.factsCard = P.facts ? P.facts.parentNode : null;

    /* The four page-level selects become framework fields (section 5), so the
       instrument's own select row leaves the page. The nodes stay alive in the
       attic: console.js keeps filling and relabelling them, and reading their
       value costs nothing. */
    const selrow = root.querySelector('.rcon-selects');
    if (selrow) attic.appendChild(selrow);
    /* The composer's own sub-heading is replaced by the panel title. */
    const compHdr = q('[data-k="lbl-comp"]');
    if (compHdr && compHdr.parentNode) attic.appendChild(compHdr.parentNode);
    /* The mimic's heading is replaced by the stage caption. */
    const schemeHdr = q('[data-k="lbl-scheme"]');
    if (schemeHdr) attic.appendChild(schemeHdr);
    /* Headings that the framework panel now writes. */
    for (const k of ['lbl-knobs', 'lbl-phys', 'lbl-nudge', 'lbl-strips', 'lbl-eq']) {
      const n = q('[data-k="' + k + '"]');
      if (n) attic.appendChild(n);
    }
    P.capply = attic.querySelector('[data-k="capply"]') || q('[data-k="capply"]');

    /* Buttons that the shared bar's idiom now owns the look of. The handlers,
       the text and the data-k marks are the instrument's and are untouched. */
    if (P.run) P.run.className = 'dgu-btn primary';
    if (P.reset) P.reset.className = 'dgu-btn ghost';
    if (P.capply) P.capply.className = 'dgu-btn';
    if (P.nudge) {
      for (const b of P.nudge.querySelectorAll('button[data-nudge]')) b.className = 'dgu-btn ghost';
    }

    /* The instrument injects its stylesheet into the element it was mounted
       into; that element is detached here, so the sheet has to be put where it
       can reach the parts once they are spread over the shell. */
    if (P.style) document.head.appendChild(P.style);

    /* Everything the instrument built is now referenced above, so the shells it
       built them in — the head row, the two body columns, the empty cards —
       come out of the page: a framework panel is drawing those boxes now, and
       leaving them behind would draw them twice. The root element itself stays,
       empty, in the stage region: the instrument reads its computed style for
       the palette and hangs its attic on it. */
    while (root.firstChild) root.removeChild(root.firstChild);
    root.appendChild(attic);

    /* relabel() must keep finding what moved. */
    root.querySelector = function (sel) {
      return Element.prototype.querySelector.call(this, sel)
        || (ui && ui.node ? ui.node.querySelector(sel) : null)
        || attic.querySelector(sel);
    };
  }

  /** Re-point the instrument's own observers at the whole shell. */
  function retargetObservers() {
    if (!ui || !ui.node) return;
    let inst = null;
    try { inst = (typeof RCON !== 'undefined' && RCON.instances) ? RCON.instances()[0] : null; }
    catch (e) { inst = null; }
    if (!inst) return;
    try { if (inst.io) { inst.io.disconnect(); inst.io.observe(ui.node); } } catch (e) { /* keep the page */ }
    try { if (inst.ro) { inst.ro.disconnect(); inst.ro.observe(ui.node); } } catch (e) { /* keep the page */ }
  }

  /** Move a node into a framework box, and remember it for the teardown. */
  function put(box, node, cls) {
    if (!box || !node) return null;
    if (cls) {
      const w = document.createElement('div');
      /* The instrument's own descendant rules (`.rcon select`, `.rcon
         input[type=range]`) are what make its controls look like its controls;
         the class travels with the content so nothing changes shape. */
      w.className = cls;
      w.appendChild(node);
      box.appendChild(w);
      if (MOVED.indexOf(w) < 0) MOVED.push(w);
      return w;
    }
    box.appendChild(node);
    if (MOVED.indexOf(node) < 0) MOVED.push(node);
    return node;
  }

  /* ======================================================================
     4. Learn content — the prose this page used to print above the instrument
     ================================================================== */
  function learnDef() {
    return {
      version: 1,
      intro: { title: T['intro.h'], body: T['intro.p1'] },
      topics: {
        stand: { title: T['intro.h'], body: join6(T['intro.p1'], T['honest.p5']) },
        mimic: { title: RLAB('scheme'),
                 body: join6(T['intro.p2'], RLAB('schemeHint'), RLAB('kbdHint')) },
        knobs: { title: RLAB('knobs'),
                 body: join6(RLAB('rodPosHint'), RLAB('powerIndirect'), RLAB('kbdHint')) },
        modes: { title: RLAB('mode'),
                 body: join6(T['intro.p3'], RLAB('modeManualNote')) },
        presets: { title: RLAB('preset'), body: join6(T['intro.p4'], T['honest.p2']) },
        physics: { title: RLAB('physSwitch'), body: join6(RLAB('physNote'), T['honest.p3']) },
        composer: { title: RLAB('composer'), body: RLAB('composerNote') },
        nudges: { title: RLAB('nudges'), body: RLAB('nudgeNote') },
        strips: { title: RLAB('strips'), body: join6(RLAB('fluxNote'), RLAB('behind')) },
        clock: { title: RLAB('modelTime'), body: join6(T['honest.p4'], RLAB('reducedMotion')) },
        equilibrium: { title: RLAB('eqPanel'), body: join6(T['honest.p3']) }
      },
      tour: [
        { topic: 'stand', focus: '[data-dgu-panel="p-run"]' },
        { topic: 'mimic', focus: '.dgu-stage' },
        { topic: 'knobs', focus: '[data-dgu-panel="p-knobs"]' },
        { topic: 'modes', focus: '[data-dgu-field="f-mode"]' },
        { topic: 'presets', focus: '[data-dgu-field="f-preset"]' },
        { topic: 'strips', focus: '[data-dgu-panel="p-strips"]' },
        { topic: 'clock', focus: '.dgu-results' }
      ]
    };
  }

  /* ======================================================================
     5. The shell: fields, panels, regions
     ================================================================== */
  const sState = () => (STAND ? STAND.state() : null);

  function presetOptions() {
    const list = ((typeof PLANT_REACTOR !== 'undefined' && PLANT_REACTOR.presets
      && PLANT_REACTOR.presets.reactors) || []).map((r) => [r.id, pick(r.family)]);
    const st = sState();
    /* A core built in the composer belongs to no family; the picker says so
       instead of showing the last preset that was loaded. */
    if (st && !st.preset) list.unshift(['', rts('composer')]);
    return list;
  }

  function fieldDefs() {
    return [
      { id: 'f-preset', key: 'preset', type: 'select', learn: 'presets',
        label: RLAB('preset'), options: presetOptions,
        get: () => { const s = sState(); return s ? (s.preset || '') : 'pwr'; },
        set: (v) => { if (v && STAND) STAND.setPreset(v); } },
      { id: 'f-mode', key: 'mode', type: 'select', learn: 'modes',
        label: RLAB('mode'),
        options: () => ((typeof RCON !== 'undefined' ? RCON.modes : ['manual'])
          .map((m) => [m, rts(MODE_KEY[m])])),
        get: () => { const s = sState(); return s ? s.mode : 'manual'; },
        set: (v) => { if (STAND) STAND.setMode(v); } },
      { id: 'f-speed', key: 'speed', type: 'select', learn: 'clock',
        label: RLAB('speed'),
        options: () => ((typeof RCON !== 'undefined' ? RCON.speeds : [1]).map((s) => [s, '×' + s])),
        get: () => { const s = sState(); return s ? s.speed : 10; },
        set: (v) => { if (STAND) STAND.setSpeed(parseFloat(v)); } },
      { id: 'f-window', key: 'win', type: 'select', learn: 'strips',
        label: RLAB('windowLbl'),
        options: () => ((typeof RCON !== 'undefined' ? RCON.windows : [300])
          .map((s) => [s, fmtDur(s)])),
        get: () => { const s = sState(); return s ? s.windowSec : 300; },
        set: (v) => { if (STAND) STAND.setWindow(parseFloat(v)); } }
    ];
  }

  function panelDefs() {
    const defs = [];
    defs.push({
      id: 'p-run', slot: 'inputs', title: RLAB('title'), learn: 'stand',
      render: (box) => { put(box, P && P.transport, 'rcon'); },
      fields: fieldDefs()
    });
    defs.push({
      id: 'p-knobs', slot: 'inputs', title: RLAB('knobs'), learn: 'knobs',
      render: (box) => { put(box, P && P.knobs, 'rcon'); }
    });
    defs.push({
      id: 'p-phys', slot: 'inputs', title: RLAB('physSwitch'), learn: 'physics',
      render: (box) => {
        const w = put(box, P && P.phys, 'rcon');
        if (w && P.physnote) w.appendChild(P.physnote);
        if (w && P.feas) w.appendChild(P.feas);
      }
    });
    defs.push({
      id: 'p-comp', slot: 'inputs', title: RLAB('composer'), learn: 'composer',
      render: (box) => {
        const w = put(box, P && P.comp, 'rcon');
        if (w && P.verdict) w.appendChild(P.verdict);
        if (w && P.compnote) w.appendChild(P.compnote);
      }
    });
    defs.push({
      id: 'p-nudge', slot: 'inputs', title: RLAB('nudges'), learn: 'nudges',
      render: (box) => { put(box, P && P.nudge, 'rcon'); }
    });
    /* Reset: the inputs footer, secondary weight, under the instrument's own
       name for it — this Reset puts the model back to equilibrium, which is
       not the same thing as putting the four selects back to their defaults,
       and inventing a second one would be a new control. */
    defs.push({
      id: 'p-reset', slot: 'inputs',
      render: (box) => {
        const row = document.createElement('div');
        row.className = 'dgu-panel-actions';
        put(row, P && P.reset);
        box.appendChild(row);
      }
    });
    defs.push({
      id: 'p-strips', slot: 'dock', title: RLAB('strips'), learn: 'strips',
      render: (box) => { put(box, P && P.stripbox, 'rcon'); }
    });
    if (P && P.eqOn) {
      defs.push({
        id: 'p-eq', slot: 'dock', title: RLAB('eqPanel'), learn: 'equilibrium',
        render: (box) => { put(box, P && P.eqmount, 'rcon'); }
      });
    }
    return defs;
  }

  /**
   * The mimic. It is a single 1200 x 560 drawing that cannot be reflowed, so it
   * keeps the floor and the horizontal scroller the page gave it before the
   * port (now in the stylesheet, against the stage rather than the viewport):
   * everything else on the page fits the screen, and the one element that
   * cannot is pannable at a legible size.
   */
  function buildStage(host, app) {
    if (P && P.fail) { host.appendChild(P.fail); if (MOVED.indexOf(P.fail) < 0) MOVED.push(P.fail); }
    const stage = app.stage({ caption: RLAB('scheme'), minHeight: 300 });
    const wrap = document.createElement('div');
    wrap.className = 'rcon rs-stagewrap';
    if (P && P.svgwrap) wrap.appendChild(P.svgwrap);
    if (P && P.schemealt) wrap.appendChild(P.schemealt);
    stage.body.appendChild(wrap);
    MOVED.push(wrap);
    const cap = document.createElement('div');
    cap.className = 'dgu-stage-cap rcon';
    if (P && P.schemehint) cap.appendChild(P.schemehint);
    if (P && P.kbdhint) cap.appendChild(P.kbdhint);
    stage.node.appendChild(cap);
    MOVED.push(cap);
    /* The stand's own root keeps every listener and observer it built; it stays
       in the page, with the drawing inside it, so nothing is orphaned. */
    if (P && P.root) {
      P.root.appendChild(P.attic);
      host.appendChild(P.root);
      if (MOVED.indexOf(P.root) < 0) MOVED.push(P.root);
    }

  }

  function footer(host) {
    const d = document.createElement('details');
    const s = document.createElement('summary');
    s.textContent = tr('honest.h');
    d.appendChild(s);
    for (const k of ['honest.p1', 'honest.p2', 'honest.p3', 'honest.p4']) {
      const p = document.createElement('p');
      p.textContent = tr(k);
      d.appendChild(p);
    }
    const p5 = document.createElement('p');
    p5.className = 'rs-honest';
    p5.textContent = tr('honest.p5');
    d.appendChild(p5);
    host.appendChild(d);
    /* The instrument's own caveats, in the instrument's own words. */
    if (P && P.notes) { host.appendChild(P.notes); if (MOVED.indexOf(P.notes) < 0) MOVED.push(P.notes); }

    const rel = document.createElement('p');
    rel.className = 'rs-see';
    rel.appendChild(document.createTextNode(tr('see.h') + ': '));
    const links = [['regelkring.html', 'see.lab'], ['kinetics.html', 'see.kin'], ['xenon.html', 'see.xe']];
    links.forEach(([href, k], i) => {
      if (i) rel.appendChild(document.createTextNode(' · '));
      const a = document.createElement('a');
      a.href = href + '?lang=' + LANG;
      a.textContent = tr(k);
      rel.appendChild(a);
    });
    host.appendChild(rel);

    const foot = document.createElement('p');
    foot.className = 'rs-see';
    foot.appendChild(document.createTextNode(tr('foot.note') + ' '));
    for (const [href, k] of [['disclaimer.html', 'foot.disc'], ['validation.html', 'foot.reg']]) {
      const a = document.createElement('a');
      a.href = href + '?lang=' + LANG;
      a.textContent = tr(k);
      foot.appendChild(a);
      foot.appendChild(document.createTextNode(' '));
    }
    host.appendChild(foot);
  }

  /* ======================================================================
     6. Results — the readouts, live
     ================================================================== */
  let RES_SIG = null;

  function resultData() {
    const u = RU(), st = sState();
    if (!u || !st || !st.probe) return null;
    const pr = st.probe, lg = LANG;
    const nf = u.nf, ne = u.ne;
    const dollars = pr.rhoDollar;
    const hot = st.failed || dollars >= 1;
    const tone = hot ? 'bad' : (Math.abs(dollars) > 0.02 || pr.boiling ? 'warn' : 'ok');
    /* Every one of these is a number the instrument already shows — on the
       mimic, on a strip chart's now-reading or in the record. Nothing here is
       computed by this file. */
    const tiles = [
      { label: RLAB('sPower'), hint: '%', value: nf(pr.power, 2, lg), tone: tone },
      { label: pfx6('ρ ', RLAB('trTotal')), hint: 'pcm', value: nf(pr.rhoTotal, 0, lg), tone: tone },
      { label: RLAB('periodLbl'), value: u.fmtPeriod(pr.period, lg), tone: tone },
      { label: RLAB('rhoDollars'), hint: '$', value: nf(dollars, 4, lg), tone: tone, headline: false },
      { label: RLAB('sKeff'), value: nf(st.keff, 5, lg), headline: false },
      { label: RLAB('sTf'), hint: '°C', value: nf(pr.Tf, 1, lg), headline: false },
      { label: RLAB('sTout'), hint: '°C', value: nf(pr.Tout, 2, lg), headline: false },
      { label: RLAB('sFlux'), hint: 'n/cm²·s', value: ne(pr.phi, 3, lg), headline: false },
      { label: RLAB('sXenon'), hint: 'pcm', value: nf(pr.rhoXe, 0, lg), headline: false },
      { label: RLAB('sVoid'), value: nf(pr.voidFraction, 4, lg),
        tone: pr.boiling ? 'warn' : null, headline: false }
    ];
    const verdict = { tone: tone, text: rts('critCap') + ': ' + rts(critKey(dollars)) };
    const notes = [tr('rec.noteLive')];
    const nodes = [];
    if (P && P.factsCard) nodes.push(P.factsCard);
    if (P && P.clocks) nodes.push(P.clocks);
    const sig = LANG + '|' + tiles.map((t) => pick(t.label) + (t.hint || '')).join('|')
      + '|' + notes.join('|') + '|' + nodes.length;
    return { sig: sig, data: { verdict: verdict, tiles: tiles, notes: notes, nodes: nodes } };
  }

  /**
   * The readouts move ten times a second for as long as the page is open. A
   * framework results render rebuilds its DOM, which is right when the answer
   * changes shape and wrong sixty times a minute: it would drop focus and the
   * text selection inside the region. So the shape is rendered by the
   * framework, and only the values are written in place — the same thing the
   * instrument does to its own facts card.
   */
  function paintResults() {
    if (!ui || !STAND) return;
    const r = resultData();
    if (!r) return;
    if (r.sig !== RES_SIG) { RES_SIG = r.sig; ui.results(r.data); return; }
    const box = ui.resultsView && ui.resultsView.node;
    if (!box) return;
    const vs = box.querySelectorAll('.dgu-tile-v');
    if (vs.length !== r.data.tiles.length) { ui.results(r.data); return; }
    for (let i = 0; i < vs.length; i++) {
      const t = r.data.tiles[i];
      const s = (t.value === null || t.value === undefined || t.value === '') ? '—' : String(t.value);
      if (vs[i].textContent !== s) vs[i].textContent = s;
      const tile = vs[i].parentNode;
      const cls = 'dgu-tile ' + (t.tone || '');
      if (tile && tile.className !== cls) tile.className = cls;
    }
    const v = box.querySelector('.dgu-verdict');
    if (v) {
      if (v.textContent !== r.data.verdict.text) v.textContent = r.data.verdict.text;
      const c = 'dgu-verdict ' + (r.data.verdict.tone || '');
      if (v.className !== c) v.className = c;
    }
  }

  function startTicker() {
    if (TICK) return;
    let n = 0;
    TICK = setInterval(() => {
      if (typeof document !== 'undefined' && document.hidden) return;
      paintResults();
      /* The instrument can change the four page-level values by itself: loading
         a composed core clears the preset, and a permalink or the composer can
         move the mode. Twice a second is enough for a control the user is not
         holding, and Field.sync() leaves a focused control alone. */
      if ((n = (n + 1) % 5) === 0 && ui) { ui.sync(); titleSelects(); }
    }, 100);
  }

  /* ======================================================================
     7. Language
     ================================================================== */
  function applyLang(lang) {
    const l = LANGS.indexOf(lang) >= 0 ? lang : 'en';
    if (ui) { ui.setLang(l); return; }
    LANG = l;
    document.documentElement.lang = l;
    try { localStorage.setItem('diagram_lang', l); } catch (e) { /* private mode */ }
    if (STAND) { try { STAND.setLang(l); } catch (e) { /* keep the page */ } }
    paintFallbackTexts();
  }

  function applyTheme(th) {
    if (window.DiagramUI && DiagramUI.theme) {
      if (th === 'auto') DiagramUI.theme.set(null);
      else DiagramUI.theme.set(th);
      return;
    }
    document.documentElement.setAttribute('data-theme', th === 'dark' || th === 'light' ? th : 'auto');
  }

  /* ======================================================================
     8. Start
     ================================================================== */
  function mountApp() {
    ui = DiagramUI.app({
      id: 'reactorstand',
      mount: '#app',
      /* Studio: the user's work is direct manipulation of a drawing — the two
         rod banks, the coolant valve, the inlet and the power demand are pulled
         on the mimic itself. That also decides the two things a calculator
         layout got wrong here: the drawing gets the wide middle column instead
         of a 340 px slot it cannot be read in, and below md it comes first
         instead of after a screen and a half of controls. */
      layout: 'studio',
      compute: 'live',
      state: {},
      history: false,
      subtitle: T['subtitle'],
      learn: learnDef(),
      regions: { stage: buildStage },
      panels: panelDefs(),
      footer: footer,
      shortcuts: [
        { keys: 'r', label: RLAB('start'),
          run: () => { if (!STAND) return; const s = STAND.state(); if (s.running) STAND.stop(); else STAND.start(); } },
        { keys: 'e', label: RLAB('reset'), run: () => { if (STAND) STAND.reset(); } }
      ],
      on: {
        compute: () => {
          const r = resultData();
          RES_SIG = r ? r.sig : null;
          return r ? r.data : null;
        },
        lang: (l) => {
          LANG = l;
          if (STAND) { try { STAND.setLang(l); } catch (e) { /* keep the page */ } }
        },
        ready: (app) => {
          /* rebuild() copies the new instance over the object whose method was
             called, so the reference this module holds goes stale; on.ready is
             handed the live one. */
          if (app) ui = app;
          RES_SIG = null;
          dockResults();
          placeStrips();
          placeNotes();
          titleSelects();
          retargetObservers();
          paintResults();
          chromeFlow();
          setTimeout(chromeFlow, 400);
          setTimeout(chromeFlow, 1600);
        }
      }
    });
  }

  /**
   * Framework defect, repaired locally, belongs upstream: below md the shell
   * takes the shared bar and the disclaimer badge out of fixed positioning and
   * puts them in its own dock, but it only does the move once, when it decides
   * the viewport is narrow. diagram-common.js builds #dgc-bar after that
   * decision, so the bar that actually exists is never moved and goes on
   * covering the bottom of the page. Idempotent, and it puts the badge back
   * inside its own wrapper whichever way the transition went.
   */
  function chromeFlow() {
    const dock = ui && ui.node ? ui.node.querySelector('.dgu-chromedock') : null;
    if (!dock) return;
    const flow = document.documentElement.getAttribute('data-dgu-chrome') === 'flow';
    const bar = document.getElementById('dgc-bar');
    const badgebar = document.getElementById('eng-disc-badgebar');
    const badge = document.getElementById('eng-disc-badge');
    if (flow) {
      for (const n of [bar, badgebar]) if (n && n.parentNode !== dock) dock.appendChild(n);
      dock.hidden = false;
    } else {
      if (badgebar && badgebar.parentNode !== document.body) document.body.appendChild(badgebar);
      if (bar && bar.parentNode !== document.body) document.body.appendChild(bar);
    }
    if (badge && badgebar && badge.parentNode !== badgebar) badgebar.appendChild(badge);
    if (window.DiagramUI && DiagramUI.measure) DiagramUI.measure();
  }

  /**
   * The studio archetype puts `detail` beside the stage and `results` in a
   * full-width row under the dock. For an instrument the readouts belong beside
   * the drawing they describe, not below eleven strip charts, so the framework's
   * own results view is docked in the detail region — the inspector slot the
   * spec gives this archetype — instead of being re-implemented there.
   */
  function dockResults() {
    if (!ui || !ui.resultsView) return;
    const det = ui.region('detail');
    if (!det) return;
    if (ui.resultsView.node.parentNode !== det) det.appendChild(ui.resultsView.node);
    if (ui.regions.results) ui.regions.results.hidden = true;
  }

  /**
   * Where the strip charts live.
   *
   * They are the instrument's oscilloscope: the reason to turn a knob is to
   * watch the strip answer, and on the old page the charts sat beside the
   * controls so that both were in view at once. The framework's `dock` is
   * always a full-width row *under* the stage, so docking them there costs
   * exactly that: at 1440 px the charts start below the whole inputs column.
   *
   * Above lg — the only width where the readouts have a column of their own —
   * the charts therefore go into the stage region, under the drawing they
   * belong to: controls left, drawing and charts centre, readouts right, all
   * visible together, as before the port. Below lg the dock is the better home
   * again, because there the readouts would otherwise be pushed under 1 400 px
   * of charts. One node, moved; the charts size themselves from their canvas
   * every frame, so the move costs nothing.
   */
  function placeStrips() {
    if (!ui || !ui.node) return;
    const n = ui.node.querySelector('[data-dgu-panel="p-strips"]');
    if (!n) return;
    const wide = (window.innerWidth || 0) >= 1120;
    const host = wide ? ui.region('stage') : ui.region('dock');
    if (host && n.parentNode !== host) host.appendChild(n);
  }

  /**
   * Framework defect, repaired locally, belongs upstream: §6 says a label may
   * not truncate silently and a <select> whose value would clip must carry the
   * full text. A native select cannot wrap, so the full option text goes into
   * `title`. The preset names are long sentences and the column is 250 px.
   */
  function titleSelects() {
    if (!ui || !ui.node) return;
    for (const sel of ui.node.querySelectorAll('.dgu-field select')) {
      const o = sel.selectedOptions && sel.selectedOptions[0];
      const t = o ? o.textContent : '';
      if (sel.title !== t) sel.title = t;
    }
  }

  /** The two live notes belong to the field they explain, where their hint would be. */
  function placeNotes() {
    if (!ui || !ui.node || !P) return;
    const at = (id, node) => {
      if (!node) return;
      const f = ui.node.querySelector('[data-dgu-field="' + id + '"]');
      if (f && node.parentNode !== f) { f.appendChild(node); if (MOVED.indexOf(node) < 0) MOVED.push(node); }
    };
    at('f-preset', P.presetinfo);
    at('f-mode', P.modeline);
  }

  /* ---- the page without diagram-ui.js -------------------------------------
     Rule: the tool still works when the framework file does not arrive. The
     instrument is self-contained, so the fallback is the instrument, a title,
     a language picker and the prose — no framework chrome, and the shared bar
     from diagram-common.js still carries the exports and the permalink. */
  const FALLBACK_TOKENS = ':root{--bg:#f6f8fb;--panel:#fff;--panel-2:#f9fafc;--ink:#12161d;'
    + '--muted:#5b6675;--line:#e2e7ee;--accent:#3763e6;--accent-ink:#fff;--acc:#3763e6;'
    + '--ok:#1f6f34;--warn:#9a5a00;--bad:#a5261f;--radius-md:14px;--sp-3:12px;--sp-4:16px}'
    + 'body{margin:0;font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;'
    + 'background:var(--bg);color:var(--ink)}'
    + '.rs-fb{max-width:1400px;margin:0 auto;padding:16px}'
    + '.rs-fb h1{font-size:22px;margin:0 0 4px}.rs-fb p{max-width:100ch}';

  let FB = null;

  function bootFallback() {
    const app = document.getElementById('app');
    if (!app) return;
    const st = document.createElement('style');
    st.textContent = FALLBACK_TOKENS;
    document.head.appendChild(st);
    app.className = 'rs-fb';
    app.innerHTML = '';
    const h1 = document.createElement('h1');
    const sub = document.createElement('p');
    const sel = document.createElement('select');
    sel.setAttribute('aria-label', 'Language');
    for (const l of LANGS) {
      const o = document.createElement('option');
      o.value = l; o.textContent = LANG_NAME[l];
      sel.appendChild(o);
    }
    sel.value = LANG;
    sel.addEventListener('change', () => applyLang(sel.value));
    const box = document.createElement('div');
    const prose = document.createElement('div');
    app.appendChild(sel); app.appendChild(h1); app.appendChild(sub);
    app.appendChild(box); app.appendChild(prose);
    FB = { h1: h1, sub: sub, prose: prose, sel: sel };
    if (buildStand()) box.appendChild(HOST);
    else { const p = document.createElement('p'); p.textContent = tr('ui.failed'); box.appendChild(p); }
    paintFallbackTexts();
  }

  function paintFallbackTexts() {
    if (!FB) return;
    document.title = tr('title');
    FB.h1.textContent = tr('title');
    FB.sub.textContent = tr('subtitle');
    FB.sel.value = LANG;
    FB.prose.innerHTML = '<h2>' + esc(tr('honest.h')) + '</h2>'
      + ['honest.p1', 'honest.p2', 'honest.p3', 'honest.p4', 'honest.p5']
        .map((k) => '<p>' + esc(tr(k)) + '</p>').join('')
      + '<p>' + esc(tr('see.h')) + ': '
      + [['regelkring.html', 'see.lab'], ['kinetics.html', 'see.kin'], ['xenon.html', 'see.xe']]
        .map(([h, k]) => '<a href="' + h + '?lang=' + LANG + '">' + esc(tr(k)) + '</a>').join(' · ')
      + '</p><p>' + esc(tr('foot.note'))
      + ' <a href="disclaimer.html?lang=' + LANG + '">' + esc(tr('foot.disc')) + '</a>'
      + ' <a href="validation.html?lang=' + LANG + '">' + esc(tr('foot.reg')) + '</a></p>';
  }

  function init() {
    if (!window.DiagramUI || DiagramUI.api !== UI_API) { bootFallback(); return; }
    LANG = DiagramUI.lang();
    const ok = buildStand();
    if (ok) splitParts();
    mountApp();
    if (!ok) ui.fail(tr('ui.failed'));
    ui.ready();
    startTicker();
    window.addEventListener('resize', () => {
      clearTimeout(FLOWT);
      FLOWT = setTimeout(() => { chromeFlow(); placeStrips(); }, 120);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  /* Leaving the page takes the real-time loop down with it. pagehide fires for
     a navigation and for the back/forward cache alike; a page restored from
     that cache gets its instrument back on pageshow. */
  window.addEventListener('pagehide', destroyStand);
  window.addEventListener('pageshow', (ev) => {
    if (!ev || !ev.persisted || STAND) return;
    if (!buildStand()) return;
    if (ui) { splitParts(); ui.rebuild(); }
    else { const b = document.querySelector('.rs-fb div'); if (b) b.appendChild(HOST); }
  });
  /* =================== framework v2 (diagram-common.js) =================== */
  /* The stand runs in wall time, so a "calculation record" here is a SNAPSHOT of a
     continuously running simulation, and the permalink restores the CONFIGURATION of
     the stand rather than the point on the trajectory. Both are stated in the record. */
  const DGC_PROBE = ['power', 'n', 'phi', 'I', 'X', 'Tf', 'Tc', 'Tout', 'Tin', 'flow',
    'coolantRise', 'rhoCtrl', 'rhoXe', 'rhoDoppler', 'rhoCoolant', 'rhoVoid', 'rhoTotal',
    'rhoDollar', 'betaEff', 'Lambda', 'omega', 'period', 'promptMargin',
    'rhoRodAbsorber', 'rhoRodTip', 'rodSlopePcmPerU', 'quality', 'voidFraction'];
  const DGC_UNITS = {
    power: '%', n: '-', phi: 'n/cm2/s', I: 'at/cm3', X: 'at/cm3', Tf: 'degC', Tc: 'degC',
    Tout: 'degC', Tin: 'degC', flow: '-', coolantRise: 'K', rhoCtrl: 'pcm', rhoXe: 'pcm',
    rhoDoppler: 'pcm', rhoCoolant: 'pcm', rhoVoid: 'pcm', rhoTotal: 'pcm', rhoDollar: '$',
    betaEff: '-', Lambda: 's', omega: '1/s', period: 's', promptMargin: '-',
    rhoRodAbsorber: 'pcm', rhoRodTip: 'pcm', rodSlopePcmPerU: 'pcm', quality: '-',
    voidFraction: '-', t_model: 's', speed_ordered: 'x', speed_achieved: 'x',
    preset: '', mode: '', power_setpoint: '%', outlet_setpoint: 'degC',
    inlet_temperature: 'degC', coolant_flow: '-', rod_reg: '-', rod_tipd: '-',
    window: 's', k_eff: '-'
  };
  function dgcStand() { return window.RSTAND || null; }
  /* model-time clock for the record; RCON's own fmtClock lives in the other IIFE */
  function dgcClock(t) {
    const s = Math.max(0, Math.floor(t % 60)), m = Math.floor(t / 60) % 60, h = Math.floor(t / 3600);
    const pad = (v) => (v < 10 ? '0' + v : String(v));
    return h + ':' + pad(m) + ':' + pad(s) + ' (' + t.toFixed(1) + ' s)';
  }
  function dgcParamDiff(p) {
    const d = PLANT_REACTOR.defaults(), out = {};
    Object.keys(p || {}).forEach((k) => { if (p[k] !== d[k]) out[k] = p[k]; });
    return out;
  }
  function dgcSerialize() {
    const h = dgcStand();
    if (!h) return { v: 1, lang: LANG };
    const s = h.state();
    return { v: 1, lang: LANG, preset: s.preset, mode: s.mode, speed: s.speed,
             win: s.windowSec, sp: s.setpoint, u: s.u, d: s.d,
             par: dgcParamDiff(s.params) };
  }
  function dgcDeserialize(st) {
    if (!st || typeof st !== 'object') throw new Error('unrecognised state payload');
    if (st.lang && LANGS.indexOf(st.lang) >= 0) applyLang(st.lang);
    const h = dgcStand();
    if (!h) throw new Error('the stand is not mounted, so its configuration cannot be restored');
    if (st.preset) h.setPreset(st.preset);
    if (st.par) Object.keys(st.par).forEach((k) => h.setParam(k, st.par[k]));
    if (st.mode) h.setMode(st.mode);
    if (Number.isFinite(st.speed)) h.setSpeed(st.speed);
    if (Number.isFinite(st.win)) h.setWindow(st.win);
    /* knobDefs declares the power-setpoint knob as 'setp'; 'pow' is the mimic
       drag-handle id and the power strip-chart column key, and is not a knob, so
       setControl('pow', ...) matched nothing and the setpoint was never restored. */
    if (st.sp && Number.isFinite(st.sp.power)) h.setControl('setp', st.sp.power);
    if (st.d && Number.isFinite(st.d.Tin)) h.setControl('tin', st.d.Tin);
    if (st.d && Number.isFinite(st.d.flow)) h.setControl('flow', st.d.flow);
    if (st.u && Number.isFinite(st.u.reg)) h.setControl('reg', st.u.reg);
    if (st.u && Number.isFinite(st.u.tipd)) h.setControl('tipd', st.u.tipd);
    /* the four page-level fields read the stand, so the shell is told to look */
    if (ui) { ui.sync(); ui.run(); }
  }
  function dgcRecord() {
    const h = dgcStand();
    if (!h) return null;
    const s = h.state(), pr = s.probe;
    const inputs = {
      preset: s.preset, mode: s.mode, power_setpoint: s.setpoint.power,
      outlet_setpoint: s.setpoint.tempOut, inlet_temperature: s.d.Tin,
      coolant_flow: s.d.flow, rod_reg: s.u.reg, rod_tipd: s.u.tipd,
      speed_ordered: s.speed, window: s.windowSec
    };
    const outputs = { t_model: s.tModel, speed_achieved: s.speedAchieved, k_eff: s.keff };
    DGC_PROBE.forEach((k) => {
      const v = pr[k];
      outputs[k] = (typeof v === 'number' && Number.isFinite(v)) ? v : (v === Infinity ? null : v);
    });
    const w = [tr('rec.snapshot').replace('%t', dgcClock(s.tModel))];
    if (s.failed && s.fail) w.push(tr('rec.failed').replace('%c', s.fail.code));
    if (pr.atModelFloor) w.push(tr('rec.floor'));
    if (pr.floorRestartFiction) w.push(tr('rec.fiction'));
    if (pr.boiling) w.push(tr('rec.boiling'));
    if (pr.xenonBlocked) w.push(tr('rec.xenon'));
    if (s.deficit > 0.02) w.push(tr('rec.slow').replace('%o', s.speed).replace('%a', (s.speedAchieved || 0).toFixed(1)));
    return {
      inputs: inputs, outputs: outputs, units: DGC_UNITS,
      model: {
        equations: [
          'dn/dt = ((rho - beta_eff)/Lambda) n + SUM lambda_i C_i',
          'dC_i/dt = (beta_i/Lambda) n - lambda_i C_i    (six delayed-neutron groups)',
          'dI/dt = gamma_I Sigma_f phi - lambda_I I',
          'dX/dt = gamma_X Sigma_f phi + lambda_I I - lambda_X X - sigma_aX phi X,   phi = phi_nom n',
          'dT_f/dt = (-(T_f - T_c) + a n)/tau_f,   dT_c/dt = (g (T_f - T_c) - w (T_c - T_in))/tau_c',
          'dT_out/dt = ((2 T_c - T_in) - T_out)/tau_out',
          'rho = rho_rod(u) + rho_Xe + rho_Doppler + rho_coolant + rho_void',
          'rho_Xe = -sigma_aX X/(nu Sigma_f),  rho_Doppler = alpha_D (T_f - T_ref)',
          'Asymptotic period from the inhour equation rho = omega Lambda + SUM beta_i omega/(omega + lambda_i)'
        ],
        ranges: [
          'Refuses to run at rho >= beta_eff (prompt criticality), on an empty core, outside the alpha_C band and beyond the two-phase closure',
          'Power is floored at n = 1e-12 of nominal; below n = 1e-10 any rise is an artefact of that floor, not a calculation (there is no external neutron source in point kinetics)',
          'Fast block: TR-BDF2, second order and L-stable, sub-step limited to |d ln n| <= 0.002 and |d rho| <= 0.02 beta_eff; xenon by RK4; Strang splitting between them'
        ],
        notes: [
          tr('rec.noteLive'),
          tr('rec.noteLink'),
          tr('rec.notePoint')
        ]
      },
      warnings: w
    };
  }
  function dgcSections() {
    const h = dgcStand();
    if (!h) return [];
    const pr = h.state().probe;
    const row = (k, v, u) => [k, (typeof v === 'number' && Number.isFinite(v)) ? v.toPrecision(8) : '—', u];
    return [{
      title: tr('rec.secRho'),
      cols: '2fr 1fr 1fr',
      head: [tr('rec.colChannel'), tr('rec.colValue'), tr('rec.colUnit')],
      rows: [row('rho_rod', pr.rhoCtrl, 'pcm'), row('rho_Xe', pr.rhoXe, 'pcm'),
             row('rho_Doppler', pr.rhoDoppler, 'pcm'), row('rho_coolant', pr.rhoCoolant, 'pcm'),
             row('rho_void', pr.rhoVoid, 'pcm'), row('rho_total', pr.rhoTotal, 'pcm'),
             row('rho_total / beta_eff', pr.rhoDollar, '$'),
             row('beta_eff', pr.betaEff, '-'), row('Lambda', pr.Lambda, 's'),
             row('period', pr.period, 's')]
    }];
  }
  function dgcHandoff() {
    const h = dgcStand();
    if (!h) return null;
    const pr = h.state().probe;
    return { quantities: { rho_reac: { value: pr.rhoTotal * 1e-5, unit: '-' },
                           T: { value: pr.Tf + 273.15, unit: 'K' } } };
  }
  function dgcInit() {
    if (!window.Diagram) return;
    window.Diagram.init({
      id: 'reactorstand', file: 'reactorstand.html',
      state: { serialize: dgcSerialize, deserialize: dgcDeserialize },
      record: dgcRecord,
      handoff: { provides: ['rho_reac', 'T'], accepts: [], build: dgcHandoff },
      report: { sections: dgcSections }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', dgcInit);
  else dgcInit();

  /* For the acceptance run only: the page's own handles, by name. */
  window.RSTANDPAGE = {
    lang: () => LANG,
    theme: () => ((window.DiagramUI && DiagramUI.theme) ? DiagramUI.theme.pref()
      : (document.documentElement.getAttribute('data-theme-pref') || 'auto')),
    setLang: applyLang,
    setTheme: applyTheme,
    stand: () => STAND,
    ui: () => ui,
    parts: () => P,
    texts: T,
    langs: LANGS.slice()
  };
}());

</script>

<script id="polish-domain-overlay">
