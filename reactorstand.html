                'Надлишкова реактивність, доступна оператору. Якщо |ρ_Xe| її перевищує, реактор не запустити — йодна яма. Той самий повзунок, що й у xenon.html.',
                'Überschussreaktivität, über die der Betreiber verfügt. Übersteigt |ρ_Xe| sie, ist kein Wiederanfahren möglich — Xenon-Totzeit.',
                'Overtollige reactiviteit waarover de operator beschikt. Overschrijdt |ρ_Xe| deze, dan is herstarten onmogelijk — xenon-dodetijd.',
                'Réactivité excédentaire dont dispose l’opérateur. Si |ρ_Xe| la dépasse, pas de redémarrage — temps mort xénon.',
                'Reactividad en exceso de la que dispone el operador. Si |ρ_Xe| la supera, no hay rearranque — tiempo muerto por xenón.') },

      /* ---- spectrum, fuel, enrichment (CONSOLE-CONTRACT §4a.1-3) ------ */

      { key: 'spectrum', unit: '-', def: 0, min: 0, max: 2, step: 1,
        tag: 'modern-reference',
        label: L('Neutron spectrum', 'Спектр нейтронів', 'Neutronenspektrum',
                 'Neutronenspectrum', 'Spectre neutronique', 'Espectro neutrónico'),
        options: [
          { value: 0, label: L('Thermal (Λ ≈ 1e-4 s)', 'Тепловий (Λ ≈ 1e-4 с)',
                               'Thermisch (Λ ≈ 1e-4 s)', 'Thermisch (Λ ≈ 1e-4 s)',
                               'Thermique (Λ ≈ 1e-4 s)', 'Térmico (Λ ≈ 1e-4 s)') },
          { value: 1, label: L('Intermediate (Λ ≈ 1e-6 s)', 'Проміжний (Λ ≈ 1e-6 с)',
                               'Intermediär (Λ ≈ 1e-6 s)', 'Intermediair (Λ ≈ 1e-6 s)',
                               'Intermédiaire (Λ ≈ 1e-6 s)', 'Intermedio (Λ ≈ 1e-6 s)') },
          { value: 2, label: L('Fast (Λ ≈ 1e-7 s)', 'Швидкий (Λ ≈ 1e-7 с)',
                               'Schnell (Λ ≈ 1e-7 s)', 'Snel (Λ ≈ 1e-7 s)',
                               'Rapide (Λ ≈ 1e-7 s)', 'Rápido (Λ ≈ 1e-7 s)') }
        ],
        help: L('Does exactly three things: multiplies Λ (×1, ×1e-2, ×1e-3), selects the measured delayed-neutron set (thermal- or fast-fission), and sets how much of the fission goes into the fertile nuclide, which moves β_eff. It deliberately does NOT rescale α_D, α_C or α_void — silently multiplying a number you typed would be dishonest; the reactor presets set those together. Doppler responsiveness still changes, because what matters is α_D/β_eff — see probe().alphaDollarPerK.',
                'Робить рівно три речі: множить Λ (×1, ×1e-2, ×1e-3), обирає виміряний набір запізнілих нейтронів (теплове чи швидке ділення) і задає частку ділень у фертильному нукліді, а через неї — β_eff. Він НЕ перераховує α_D, α_C та α_void: мовчки множити введене вами число нечесно; ці коефіцієнти задають пресети. Доплерівська відгукливість усе одно змінюється, бо важить α_D/β_eff — див. probe().alphaDollarPerK.',
                'Tut genau drei Dinge: multipliziert Λ (×1, ×1e-2, ×1e-3), wählt den gemessenen Datensatz der verzögerten Neutronen (thermische oder schnelle Spaltung) und legt den Spaltanteil des Brutnuklids fest, der β_eff verschiebt. Er skaliert α_D, α_C und α_void bewusst NICHT — eine eingegebene Zahl stillschweigend zu multiplizieren wäre unredlich; das machen die Reaktor-Presets gemeinsam. Die Doppler-Ansprechempfindlichkeit ändert sich trotzdem, denn maßgeblich ist α_D/β_eff — siehe probe().alphaDollarPerK.',
                'Doet precies drie dingen: vermenigvuldigt Λ (×1, ×1e-2, ×1e-3), kiest de gemeten vertraagde-neutronenset (thermische of snelle splijting) en bepaalt welk deel van de splijtingen in het fertiele nuclide valt, wat β_eff verschuift. Het herschaalt α_D, α_C en α_void bewust NIET — een door u ingetypt getal stilzwijgend vermenigvuldigen zou oneerlijk zijn; de reactorpresets zetten die samen. De Dopplergevoeligheid verandert toch, want wat telt is α_D/β_eff — zie probe().alphaDollarPerK.',
                'Fait exactement trois choses : multiplie Λ (×1, ×1e-2, ×1e-3), choisit le jeu mesuré de neutrons retardés (fission thermique ou rapide) et fixe la part des fissions dans le nucléide fertile, ce qui déplace β_eff. Il ne remet PAS à l’échelle α_D, α_C ni α_void : multiplier en silence un nombre que vous avez saisi serait malhonnête ; ce sont les préréglages de réacteur qui les fixent ensemble. La réponse Doppler change tout de même, car ce qui compte est α_D/β_eff — voir probe().alphaDollarPerK.',
                'Hace exactamente tres cosas: multiplica Λ (×1, ×1e-2, ×1e-3), elige el conjunto medido de neutrones retardados (fisión térmica o rápida) y fija qué parte de las fisiones ocurre en el nucleido fértil, lo que mueve β_eff. Deliberadamente NO reescala α_D, α_C ni α_void: multiplicar en silencio un número que usted escribió sería deshonesto; eso lo fijan los preajustes de reactor. La respuesta Doppler cambia igualmente, porque lo que cuenta es α_D/β_eff — véase probe().alphaDollarPerK.') },

      { key: 'fuelType', unit: '-', def: 0, min: 0, max: 3, step: 1,
        label: L('Fissile charge', 'Ділиться (склад)', 'Spaltstoff',
                 'Splijtstoflading', 'Charge fissile', 'Carga fisible'),
        options: [
          { value: 0, label: L('Uranium (U-235 in U-238)', 'Уран (U-235 в U-238)',
                               'Uran (U-235 in U-238)', 'Uranium (U-235 in U-238)',
                               'Uranium (U-235 dans U-238)', 'Uranio (U-235 en U-238)') },
          { value: 1, label: L('Plutonium mix (Pu-239 + Pu-241 in U-238)',
                               'Суміш плутонію (Pu-239 + Pu-241 в U-238)',
                               'Plutoniummischung (Pu-239 + Pu-241 in U-238)',
                               'Plutoniummengsel (Pu-239 + Pu-241 in U-238)',
                               'Mélange de plutonium (Pu-239 + Pu-241 dans U-238)',
                               'Mezcla de plutonio (Pu-239 + Pu-241 en U-238)') },
          { value: 2, label: L('Pure Pu-239 in U-238', 'Чистий Pu-239 в U-238',
                               'Reines Pu-239 in U-238', 'Zuiver Pu-239 in U-238',
                               'Pu-239 pur dans U-238', 'Pu-239 puro en U-238') },
          { value: 3, label: L('U-233 (thorium cycle)', 'U-233 (торієвий цикл)',
                               'U-233 (Thorium-Zyklus)', 'U-233 (thoriumcyclus)',
                               'U-233 (cycle thorium)', 'U-233 (ciclo del torio)') }
        ],
        help: L('Which nuclides carry the fissions, and therefore which measured six-group set applies. β_eff of Pu-239 is about a THIRD of that of U-235: the same rod motion is worth three times as many dollars and the reactor is correspondingly harder to control. Note for U-233: this file carries no Th-232 delayed-neutron set, so no fertile fast-fission share is added for that fuel — a declared gap, not an oversight.',
                'Які нукліди несуть ділення, а отже який виміряний шестигруповий набір діє. β_eff у Pu-239 приблизно ВТРИЧІ менший, ніж у U-235: той самий хід стрижня коштує втричі більше доларів, і керувати відповідно важче. Про U-233: набору запізнілих нейтронів для Th-232 у файлі немає, тож для цього палива частка швидких ділень у фертильному нукліді не додається — це оголошений пропуск, а не недогляд.',
                'Welche Nuklide die Spaltungen tragen und damit welcher gemessene Sechsgruppensatz gilt. β_eff von Pu-239 ist etwa ein DRITTEL des Wertes von U-235: dieselbe Stabbewegung ist dreimal so viele Dollar wert, entsprechend schwerer ist die Regelung. Hinweis zu U-233: für Th-232 enthält diese Datei keinen Datensatz, daher wird für diesen Brennstoff kein Brutspaltanteil addiert — eine erklärte Lücke, kein Versehen.',
                'Welke nucliden de splijtingen dragen, en dus welke gemeten zesgroepsset geldt. β_eff van Pu-239 is ongeveer een DERDE van die van U-235: dezelfde staafbeweging is drie keer zoveel dollar waard en regelen is navenant lastiger. Let op bij U-233: dit bestand bevat geen Th-232-set, dus voor die splijtstof wordt geen fertiel snel-splijtingsaandeel toegevoegd — een verklaarde leemte, geen vergissing.',
                'Quels nucléides portent les fissions, donc quel jeu mesuré à six groupes s’applique. Le β_eff du Pu-239 vaut environ un TIERS de celui de l’U-235 : le même déplacement de barre vaut trois fois plus de dollars et la conduite est d’autant plus difficile. Note pour l’U-233 : ce fichier ne contient pas de jeu pour le Th-232, aucune part de fission rapide fertile n’est donc ajoutée pour ce combustible — lacune déclarée, non un oubli.',
                'Qué nucleidos llevan las fisiones y, por tanto, qué conjunto medido de seis grupos rige. El β_eff del Pu-239 es aproximadamente un TERCIO del del U-235: el mismo movimiento de barra vale tres veces más dólares y el control es proporcionalmente más difícil. Nota sobre el U-233: este archivo no incluye conjunto para el Th-232, así que para ese combustible no se añade fracción fértil de fisión rápida — carencia declarada, no un descuido.') },

      { key: 'enrichment',
        label: L('Enrichment (fissile fraction of the heavy metal)',
                 'Збагачення (частка подільного у важкому металі)',
                 'Anreicherung (Spaltstoffanteil am Schwermetall)',
                 'Verrijking (splijtbaar aandeel van het zware metaal)',
                 'Enrichissement (fraction fissile du métal lourd)',
                 'Enriquecimiento (fracción fisible del metal pesado)'),
        unit: '%', def: 100, min: 0.7, max: 100, step: 0.1,
        tag: 'modern-reference',
        help: L('Feeds the fission fractions: f_fertile = k_spectrum·(1 − e), the rest to the fissile nuclides. 100 % is a pure fissile charge — that is the default, and it is exactly the pure-U-235 model this file always was. The closure is the author’s teaching parameterisation, not a lattice calculation, and there is no burn-up in this model: the real drift of a light-water core towards plutonium is NOT represented.',
                'Задає частки ділень: f_фертильн = k_спектр·(1 − e), решта — подільним нуклідам. 100 % — чиста подільна завантаж; це і є типове значення, тобто рівно та модель чистого U-235, якою файл був завжди. Замикання — навчальна параметризація автора, а не розрахунок ґратки; вигоряння в моделі немає: справжній дрейф легководної зони до плутонію НЕ відтворюється.',
                'Speist die Spaltanteile: f_Brut = k_Spektrum·(1 − e), der Rest auf die Spaltnuklide. 100 % ist eine reine Spaltstoffladung — die Voreinstellung, also genau das reine U-235-Modell, das diese Datei immer war. Der Ansatz ist die Lehrparameterisierung des Autors, keine Gitterrechnung; einen Abbrand gibt es hier nicht: die reale Drift eines Leichtwasserkerns zum Plutonium wird NICHT abgebildet.',
                'Voedt de splijtingsfracties: f_fertiel = k_spectrum·(1 − e), de rest naar de splijtbare nucliden. 100 % is een zuiver splijtbare lading — de standaard, dus precies het zuivere U-235-model dat dit bestand altijd was. De sluiting is de lesparameterisering van de auteur, geen roosterberekening; opbrand zit er niet in: de werkelijke drift van een lichtwaterkern naar plutonium wordt NIET weergegeven.',
                'Alimente les fractions de fission : f_fertile = k_spectre·(1 − e), le reste aux nucléides fissiles. 100 % est une charge purement fissile — c’est le défaut, donc exactement le modèle U-235 pur qu’a toujours été ce fichier. La fermeture est la paramétrisation pédagogique de l’auteur, pas un calcul de réseau ; il n’y a pas d’usure ici : la dérive réelle d’un cœur à eau légère vers le plutonium n’est PAS représentée.',
                'Alimenta las fracciones de fisión: f_fértil = k_espectro·(1 − e), el resto a los nucleidos fisibles. 100 % es una carga puramente fisible — es el valor por defecto, es decir exactamente el modelo de U-235 puro que este archivo siempre fue. El cierre es la parametrización didáctica del autor, no un cálculo de celda; aquí no hay quemado: la deriva real de un núcleo de agua ligera hacia el plutonio NO está representada.') },

      /* ---- temperature and void reactivity (CONSOLE-CONTRACT §4a.4) --- */

      { key: 'alphaC',
        label: L('Coolant / moderator temperature coefficient α_C',
                 'Температурний коефіцієнт теплоносія / сповільнювача α_C',
                 'Kühlmittel-/Moderator-Temperaturkoeffizient α_C',
                 'Temperatuurcoëfficiënt koelmiddel / moderator α_C',
                 'Coefficient de température caloporteur / modérateur α_C',
                 'Coeficiente de temperatura del refrigerante / moderador α_C'),
        unit: 'pcm/K', def: 0, min: -80, max: 20, step: 0.5,
        tag: 'modern-reference',
        help: L('ρ_C = α_C·(T_c − T_refC), on the core-average coolant temperature. 0 by default, so the model stays the Doppler-only one it was. Typical light-water values run −10…−50 pcm/K; a graphite-moderated lattice where the water is a net absorber can be slightly positive. Preset values, not reference data.',
                'ρ_C = α_C·(T_c − T_refC), за середньою по зоні температурою теплоносія. Типово 0, тож модель лишається доплерівською, якою й була. Для легкої води звично −10…−50 pcm/K; у графітовій ґратці, де вода — нетто-поглинач, може бути трохи додатним. Значення пресетів, не довідкові дані.',
                'ρ_C = α_C·(T_c − T_refC), auf der kernmittleren Kühlmitteltemperatur. Voreinstellung 0, das Modell bleibt das reine Doppler-Modell. Für Leichtwasser typisch −10…−50 pcm/K; in einem Graphitgitter, in dem Wasser netto absorbiert, kann er leicht positiv sein. Preset-Werte, keine Referenzdaten.',
                'ρ_C = α_C·(T_c − T_refC), op de kerngemiddelde koelmiddeltemperatuur. Standaard 0, het model blijft het Doppler-only model dat het was. Voor lichtwater typisch −10…−50 pcm/K; in een grafietrooster waar water netto absorbeert kan hij licht positief zijn. Presetwaarden, geen referentiegegevens.',
                'ρ_C = α_C·(T_c − T_refC), sur la température moyenne cœur du caloporteur. 0 par défaut : le modèle reste celui à Doppler seul. Pour l’eau légère, typiquement −10…−50 pcm/K ; dans un réseau au graphite où l’eau absorbe en net, il peut être légèrement positif. Valeurs de préréglage, non de référence.',
                'ρ_C = α_C·(T_c − T_refC), sobre la temperatura media del refrigerante en el núcleo. 0 por defecto: el modelo sigue siendo el de solo Doppler. Para agua ligera, típicamente −10…−50 pcm/K; en una red de grafito donde el agua absorbe en neto puede ser ligeramente positivo. Valores de preajuste, no datos de referencia.') },

      { key: 'TrefC',
        label: L('Reference temperature for α_C', 'Опорна температура для α_C',
                 'Bezugstemperatur für α_C', 'Referentietemperatuur voor α_C',
                 'Température de référence pour α_C', 'Temperatura de referencia para α_C'),
        unit: '°C', def: 290, min: 200, max: 600, step: 1,
        help: L('Only shifts where ρ_C is zero; the equilibrium rod position absorbs the offset. Irrelevant while α_C = 0.',
                'Лише зсуває точку, де ρ_C = 0; рівноважне положення стрижнів поглинає зсув. Поки α_C = 0, значення не має.',
                'Verschiebt nur den Nullpunkt von ρ_C; die Gleichgewichts-Stabstellung nimmt den Versatz auf. Solange α_C = 0, ohne Bedeutung.',
                'Verschuift alleen waar ρ_C nul is; de evenwichtsstaafstand vangt de verschuiving op. Zolang α_C = 0 zonder betekenis.',
                'Ne déplace que le zéro de ρ_C ; la position d’équilibre des barres absorbe le décalage. Sans effet tant que α_C = 0.',
                'Solo desplaza dónde ρ_C es cero; la posición de equilibrio de las barras absorbe el desfase. Irrelevante mientras α_C = 0.') },

      { key: 'alphaVoid',
        label: L('Void (steam) coefficient α_void', 'Паровий (пустотний) коефіцієнт α_void',
                 'Dampfblasen-(Void-)Koeffizient α_void', 'Stoom-(void-)coëfficiënt α_void',
                 'Coefficient de vide (vapeur) α_void', 'Coeficiente de vacío (vapor) α_void'),
        unit: 'pcm per unit void', def: 0, min: -20000, max: 5000, step: 50,
        tag: 'modern-reference',
        help: L('ρ_void = α_void·(core-average void fraction), so −10000 here is −100 pcm per per-cent void. THE SIGN IS THE POINT: negative (light water) means steam shuts the reactor down and the power coefficient stays negative; positive (a boiling channel in a graphite lattice, or sodium voiding in a fast core) means steam ADDS reactivity and the power coefficient can change sign — a qualitatively different stability. 0 by default, and identically zero whenever the coolant is not boiling.',
                'ρ_void = α_void·(середнє по зоні паровміщення), тож −10000 тут — це −100 pcm на відсоток пари. ВАЖИТЬ ЗНАК: від’ємний (легка вода) — пара глушить реактор, потужнісний коефіцієнт лишається від’ємним; додатний (кипляча труба в графітовій ґратці або знатрієння швидкої зони) — пара ДОДАЄ реактивність, і потужнісний коефіцієнт може змінити знак: якісно інша стійкість. Типово 0 і тотожно нуль, поки теплоносій не кипить.',
                'ρ_void = α_void·(kernmittlerer Dampfgehalt), −10000 hier sind also −100 pcm je Prozent Dampf. ENTSCHEIDEND IST DAS VORZEICHEN: negativ (Leichtwasser) heißt, Dampf fährt den Reaktor herunter und der Leistungskoeffizient bleibt negativ; positiv (siedender Kanal im Graphitgitter oder Natriumausdampfen im schnellen Kern) heißt, Dampf BRINGT Reaktivität ein und der Leistungskoeffizient kann das Vorzeichen wechseln — qualitativ andere Stabilität. Voreinstellung 0, und identisch null, solange nicht gesiedet wird.',
                'ρ_void = α_void·(kerngemiddelde dampfractie), dus −10000 is hier −100 pcm per procent damp. HET TEKEN IS DE KERN: negatief (lichtwater) betekent dat damp de reactor uitschakelt en de vermogenscoëfficiënt negatief blijft; positief (een kokend kanaal in een grafietrooster, of natriumvoiding in een snelle kern) betekent dat damp reactiviteit TOEVOEGT en de vermogenscoëfficiënt van teken kan wisselen — kwalitatief andere stabiliteit. Standaard 0, en identiek nul zolang het koelmiddel niet kookt.',
                'ρ_void = α_void·(taux de vide moyen cœur) ; −10000 ici vaut donc −100 pcm par pour-cent de vide. LE SIGNE EST L’ESSENTIEL : négatif (eau légère), la vapeur éteint le réacteur et le coefficient de puissance reste négatif ; positif (canal bouillant en réseau graphite, ou vidange sodium d’un cœur rapide), la vapeur AJOUTE de la réactivité et le coefficient de puissance peut changer de signe — stabilité qualitativement différente. 0 par défaut, et identiquement nul tant que le caloporteur ne bout pas.',
                'ρ_void = α_void·(fracción de huecos media del núcleo); −10000 aquí son −100 pcm por cada por ciento de vapor. EL SIGNO ES LO ESENCIAL: negativo (agua ligera), el vapor apaga el reactor y el coeficiente de potencia sigue siendo negativo; positivo (canal en ebullición en red de grafito, o vaciado de sodio en un núcleo rápido), el vapor AÑADE reactividad y el coeficiente de potencia puede cambiar de signo — estabilidad cualitativamente distinta. 0 por defecto, e idénticamente nulo mientras el refrigerante no hierva.') },

        help: L('0 is a sentinel, not a temperature: with it the coolant never boils and the plant is the single-phase model it has always been — which is why every earlier trajectory is unchanged. Give it the saturation temperature of your pressure (345 °C at 15.5 MPa, 286 °C at 7.0 MPa, ≈880 °C for sodium at 1 atm) and the two-phase closure switches on above it.',
                '0 — це ознака, а не температура: з нею теплоносій ніколи не кипить і об’єкт лишається однофазним, яким і був, — тому всі попередні траєкторії незмінні. Задайте температуру насичення вашого тиску (345 °C при 15,5 МПа, 286 °C при 7,0 МПа, ≈880 °C для натрію при 1 атм), і вище неї вмикається двофазне замикання.',

                '0 is een markering, geen temperatuur: daarmee kookt het koelmiddel nooit en blijft het proces het eenfasige model dat het was — daarom verandert geen enkele eerdere trajectorie. Geef de verzadigingstemperatuur van uw druk (345 °C bij 15,5 MPa, 286 °C bij 7,0 MPa, ≈880 °C voor natrium bij 1 atm); daarboven schakelt de tweefasensluiting in.',
                '0 est un marqueur, pas une température : avec lui le caloporteur ne bout jamais et le procédé reste le modèle monophasique qu’il a toujours été — d’où l’invariance de toutes les trajectoires antérieures. Donnez la température de saturation de votre pression (345 °C à 15,5 MPa, 286 °C à 7,0 MPa, ≈880 °C pour le sodium à 1 atm) : au-dessus, la fermeture diphasique s’active.',
                '0 es un centinela, no una temperatura: con él el refrigerante nunca hierve y el proceso sigue siendo el modelo monofásico que siempre fue — por eso ninguna trayectoria anterior cambia. Déle la temperatura de saturación de su presión (345 °C a 15,5 MPa, 286 °C a 7,0 MPa, ≈880 °C para el sodio a 1 atm) y por encima se activa el cierre bifásico.') },

    /* -------------------------------------------------------------- */
    nStates: NSTATE,
    stateNames: ['n', 'C1', 'C2', 'C3', 'C4', 'C5', 'C6', 'I', 'X', 'Tf', 'Tc', 'Tout'],
    stateUnits: ['-', '-', '-', '-', '-', '-', '-', 'at/cm3', 'at/cm3', 'degC', 'degC', 'degC'],

    /* w is the setpoint IN THE UNITS OF THE SELECTED CONTROLLED VARIABLE:
     * % of nominal power by default, degC of coolant outlet temperature when
     * p.ctrlVar selects the temperature channel. */
    state0(p, w) {
      const io = { Tin: num(p.Tin0, 290), flow: clampFlow(num(p.flow, 1)) };
      const pct = ctrlIsTemp(p) ? 100 * powerForOutlet(p, w, io) : w;
      return equilibrium(p, pct, io).x;
    },

    /* Equilibrium helper (rod position that makes the core critical at w). */
    equilibrium,
    /* Rod characteristic and its inverse — exported for the interface. */
    rodWorth, rodPosFor,
    /* Steady coolant/fuel temperatures and the outlet closure. */
    thermalSteady, powerForOutlet,

    /* Full right-hand side. Contract-compliant, and correct — but see
     * `integrator`: an explicit fixed-step RK4 on this needs dt <~ 1e-5 s. */
    deriv(t, x, u, d, p, dx) {
      const io = inputs(d, p);
      const kin = kinOf(p);
      const rhoPcm = rhoTotalPcm(x, u, p, io);
      if (rhoPcm * PCM >= kin.betaTot)
        throw violation(VIOLATIONS.promptCritical, { rhoPcm, betaEff: kin.betaTot });
      if (boilCheck(x, p, io)) {
        const bs = coreState(x, p, io);
        throw violation(VIOLATIONS.boilingBeyondModel,
                        { voidFrac: bs.voidFrac, quality: bs.quality, Tout1ph: bs.Tout1ph });
      }
      const th = thermal(p, io.flow);
      const rho = rhoPcm * PCM;
      const n = x[iN], phi = p.phiNom * n;
      let sumLC = 0;
      for (let i = 0; i < 6; i++) sumLC += kin.lam[i] * x[iC + i];
      dx[iN] = ((rho - kin.betaTot) / kin.Lambda) * n + sumLC;
      for (let i = 0; i < 6; i++)
        dx[iC + i] = (kin.beta[i] / kin.Lambda) * n - kin.lam[i] * x[iC + i];
      /* xenon chain WITH the flux terms (the restored ones) */
      dx[iI] = GAM_I * SIG_F * phi - LAM_I * x[iI];
      dx[iX] = GAM_X * SIG_F * phi + LAM_I * x[iI]
             - LAM_X * x[iX] - SIG_AX * phi * x[iX];
      /* two-node core thermal model, §4b */
      dx[iTf] = (-(x[iTf] - x[iTc]) + th.a * n) / th.tf;
      dx[iTc] = (th.g * (x[iTf] - x[iTc]) - io.flow * (x[iTc] - io.Tin)) / th.tc;
      /* transport lag of the core outlet, §4b */
      const tauO = tauOutOf(p);
      dx[iTo] = tauO > 0 ? ((2 * x[iTc] - io.Tin) - x[iTo]) / tauO
                         : 2 * dx[iTc];
    },

    /* Own stepper — the core MUST use this instead of its RK4 (stiff: true). */
    stiff: true,
    requiresOwnStepper: true,
    step,
    hMax,

    /* Controlled variable: relative power (%) by default, coolant outlet
     * temperature (degC) when p.ctrlVar selects it. SPEC §1: y is in the
     * physical units of the plant, so the unit changes with the switch —
     * measureInfo(p) reports which; measureUnit/measureLabel keep describing
     * the DEFAULT channel because the contract makes them static. */
    measure(t, x, u, d, p) {
      if (ctrlIsTemp(p)) {
        const io = inputs(d, p);
        /* Below saturation this is 2 T_c - T_in, exactly as before. Once the
         * coolant boils the outlet stops rising: a saturated mixture does not
         * get hotter, and the controller loses authority over this output —
         * which is the physics, not a modelling accident. */
        return coreState(x, p, io).Tout;
      }
      return 100 * x[iN];
    },
    measureUnit: '%',
    measureLabel: L('Relative thermal power', 'Відносна теплова потужність',
                    'Relative thermische Leistung', 'Relatief thermisch vermogen',

    /* The two selectable controlled variables. Index matches ctrlVar. */
    outputs: [
      { key: 'power', channel: 'power', unit: '%',

        note: L('y = 100·n. The historical output of this plant; unchanged.',

      { key: 'tempOut', channel: 'tempOut', unit: '°C',
        label: L('Coolant outlet temperature', 'Температура теплоносія на виході',
                 'Kühlmittelaustrittstemperatur', 'Koelmiddeluittredetemperatuur',
                 'Température de sortie du caloporteur', 'Temperatura de salida del refrigerante'),
        note: L('y = 2·T_c − T_in, i.e. T_in + ΔT_c·n/w in steady state. Two extra lags (fuel and coolant node) sit between the rods and this output, so its channel has relative degree 3 against 1 for power — the loop is slower and needs more phase margin. Once T_sat is declared and reached this output SATURATES at T_sat — a boiling mixture does not get hotter — and the loop loses authority over it; probe().ToutSinglePhase keeps the enthalpy stand-in the closure works from.',
                'y = 2·T_c − T_вх, тобто T_вх + ΔT_c·n/w у стаціонарі. Між стрижнями й цим виходом стоять дві додаткові інерційні ланки (паливо і теплоносій), тож відносний степінь каналу 3 проти 1 для потужності — контур повільніший і потребує більшого запасу за фазою. Щойно задано й досягнуто T_нас, цей вихід НАСИЧУЄТЬСЯ на T_нас — кипляча суміш не грітиметься, — і контур втрачає над ним владу; probe().ToutSinglePhase зберігає ентальпійний аналог, з якого рахує замикання.',
                'y = 2·T_c − T_ein, im Beharrungszustand also T_ein + ΔT_c·n/w. Zwischen Stäben und Ausgang liegen zwei zusätzliche Verzögerungen (Brennstoff- und Kühlmittelknoten): relativer Grad 3 statt 1 wie bei der Leistung — der Kreis ist langsamer und braucht mehr Phasenreserve. Sobald T_sat vorgegeben und erreicht ist, SÄTTIGT dieser Ausgang bei T_sat — ein siedendes Gemisch wird nicht heißer — und der Kreis verliert die Wirkung auf ihn; probe().ToutSinglePhase behält den Enthalpie-Stellvertreter, mit dem der Ansatz rechnet.',
                'y = 2·T_c − T_in, stationair dus T_in + ΔT_c·n/w. Tussen de staven en deze uitgang liggen twee extra vertragingen (splijtstof- en koelmiddelknoop): relatieve graad 3 tegen 1 voor vermogen — de kring is trager en vraagt meer fasemarge. Zodra T_sat is opgegeven en bereikt, VERZADIGT deze uitgang op T_sat — een kokend mengsel wordt niet heter — en verliest de kring er greep op; probe().ToutSinglePhase houdt de enthalpie-vervanger waarmee de sluiting rekent.',
                'y = 2·T_c − T_entrée, soit T_entrée + ΔT_c·n/w en régime. Deux retards supplémentaires (nœuds combustible et caloporteur) séparent les barres de cette sortie : degré relatif 3 contre 1 pour la puissance — la boucle est plus lente et exige plus de marge de phase. Dès que T_sat est déclarée et atteinte, cette sortie SATURE à T_sat — un mélange bouillant ne chauffe plus — et la boucle perd prise sur elle ; probe().ToutSinglePhase conserve le substitut enthalpique utilisé par la fermeture.',
                'y = 2·T_c − T_entrada, es decir T_entrada + ΔT_c·n/w en régimen. Entre las barras y esta salida hay dos retardos más (nodos de combustible y refrigerante): grado relativo 3 frente a 1 para la potencia — el lazo es más lento y exige más margen de fase. En cuanto T_sat se declara y se alcanza, esta salida SATURA en T_sat — una mezcla en ebullición no se calienta más — y el lazo pierde autoridad sobre ella; probe().ToutSinglePhase conserva el sustituto entálpico con el que trabaja el cierre.') }
    ],

    /* Which channel measure() is returning for this parameter set. */
    measureInfo(p) {
      const o = PLANT.outputs[ctrlIsTemp(p) ? 1 : 0];
      return { key: o.key, unit: o.unit, label: o.label, channel: o.channel };
    },

    /* Auxiliary signals for the plots / readout. */
    probe(t, x, u, d, p) {
      const io = inputs(d, p);
      const kin = kinOf(p);
      const rw = rodWorthBanks(u, p);
      const bs = coreState(x, p, io);
      const rc = rw.total, rx = rhoXePcm(x[iX]), rd = rhoDopPcm(x[iTf], p);
      const rCool = rhoCoolPcm(x[iTc], p), rVoid = rhoVoidPcmFromBoil(bs, p);
      const tot = rc + rx + rd + rCool + rVoid;
      const om = findOmega(tot * PCM, kin.Lambda, kin);
      const Tout = bs.Tout;
      return {
        power: 100 * x[iN], n: x[iN], phi: p.phiNom * x[iN],
        I: x[iI], X: x[iX], Tf: x[iTf],
        /* coolant circuit */
        Tc: x[iTc], Tout, Tin: io.Tin, flow: io.flow,
        coolantRise: Tout - io.Tin,
        y: ctrlIsTemp(p) ? Tout : 100 * x[iN],
        /* two-phase diagnosis — zero and false unless T_sat is declared and
         * reached; ToutSinglePhase is the enthalpy stand-in the closure works
         * from, Tout is what a thermometer in the outlet would read. */
        boilingModelled: bs.modelled, boiling: bs.boiling,
        ToutSinglePhase: bs.Tout1ph, Tsat: bs.Tsat,
        quality: bs.quality, voidFraction: bs.voidFrac, voidExit: bs.voidExit,
        boilLengthFraction: bs.boilLenFrac, boilingBeyondModel: bs.beyondModel,
        /* rod characteristic, split so the interface can draw both parts */
        rhoRodAbsorber: rw.absorber, rhoRodTip: rw.tip, rodSlopePcmPerU: rw.dTotalDu,
        /* CONSOLE-CONTRACT §1: the two banks, separately. */
        rhoRodBank: { reg: rw.perBank.reg, tipd: rw.perBank.tipd },
        rodBankPos: rw.u, rodBanksLegacyU: rw.legacy, loopBank: loopBankId(p),
        rhoCtrl: rc, rhoXe: rx, rhoDoppler: rd,
        rhoCoolant: rCool, rhoVoid: rVoid, rhoTotal: tot,
        rhoDollar: tot * PCM / kin.betaTot,
        /* kinetics actually in force */
        betaEff: kin.betaTot, betaGroups: kin.beta, lambdaGroups: kin.lam,
        Lambda: kin.Lambda, spectrum: spectrumOf(p).id,
        fissionFractions: kin.fractions, betaMixed: kin.mixed,
        alphaDollarPerK: num(p.alphaD, 0) * PCM / kin.betaTot,
        omega: om, period: (om === 0 ? Infinity : 1 / om),
        promptMargin: kin.betaTot - tot * PCM,
        xenonBlocked: Math.abs(rx) > p.marginPcm,
        /* Мощность лежит на нижней отсечке модели. Пока реактивность
         * отрицательна, это просто «нуль мощности»; как только она станет
         * неотрицательной, всякий последующий подъём мощности — артефакт
         * отсечки, а не расчёт: внешнего источника нейтронов в точечной
         * кинетике нет (ограничение (4)). Интерфейс обязан сказать это
         * вслух, а не рисовать пуск из ничего. */
        atModelFloor: x[iN] <= N_FLOOR * (1 + 1e-9),
        nFloor: N_FLOOR,
        nSourceRange: N_SOURCE_RANGE,
        floorRestartFiction: x[iN] <= N_SOURCE_RANGE && tot * PCM >= 0
      };
    },

              'Wirkt nur über den Doppler-Term: heißeres Kühlmittel erhöht die Brennstofftemperatur und fügt negative Reaktivität zu. Welche Größe dieser eine Kanal verstellt, legt der Parameter distVar fest — siehe variants.',

                  'Найцікавіше. За незмінного положення стрижнів зниження витрати піднімає T_вих ≈ T_вх + ΔT_c·n/w, паливо нагрівається, доплер вносить від’ємну реактивність, і потужність падає, доки температура палива не повернеться на місце — повністю самозамкнений зв’язаний контур. Нижче 0,02 обмежено: втрати примусової та природної циркуляції в моделі немає. Кипіння — є, щойно задано T_нас: зниження витрати може вивести вихід на насичення, і далі працює паровий коефіцієнт.',

    /* -------------------------------------------------------------- *
     * Linearisation.
     *
     * channel (3rd argument, optional):
     *   undefined  -> follows p.ctrlVar: 'power' by default, 'tempOut' when
     *                 the outlet temperature is the controlled variable
     *   'power'    -> u [-]      to y [%]
     *   'tempOut'  -> u [-]      to T_out [degC]
     *   'tempFuel' -> u [-]      to T_f [degC]
     *   'xenon'    -> u [-]      to rho_Xe [pcm]
     *   'flowPower'   -> w [-]   to y [%]           (flow disturbance channel)
     *   'flowTempOut' -> w [-]   to T_out [degC]
     * op: { n | w (percent), flow }
     * -------------------------------------------------------------- */
    linearize(p, op, channel) {
      const q = linParts(p, op);
      const ch = channel || (ctrlIsTemp(p) ? 'tempOut' : 'power');
      const PA = polyMul(polyMul(q.P, q.A1), q.A2);          // P A1 A2
      /* Транспортное запаздывание на выходе — дополнительный полюс
       * 1/(tau_out s + 1) ТОЛЬКО на каналах, где выход и есть T_out.
       * При tau_out = 0 множитель равен единице и все прежние передаточные
       * функции воспроизводятся ровно. */
      const tauO = tauOutOf(p);
      const OUT  = tauO > 0 ? [tauO, 1] : [1];   // tau_out s + 1, descending
      switch (ch) {
        case 'xenon':
          /* num = 1e5 a_X * NX * n0 k_u * P * D */
          return { num: polyScale(polyMul(polyMul(q.NX, q.P), q.D),
                                  1e5 * q.a_X * q.n0 * q.k_u),
                   den: q.den, delay: 0 };
        case 'tempFuel':
          /* dT_f = E dn/D and dn = n0 k_u PA D du/den  =>  num = n0 k_u PA E */
          return { num: polyScale(polyMul(PA, q.E), q.n0 * q.k_u),
                   den: q.den, delay: 0 };
        case 'tempOut':
          /* dT_out = 2 dT_c/(tau_out s + 1) => num = 2 a g n0 k_u PA */
          return { num: polyScale(PA, 2 * q.th.a * q.th.g * q.n0 * q.k_u),
                   den: polyMul(q.den, OUT), delay: 0 };
        case 'flowPower':
          /* dn = n0 (a_D + a_C F) c_w PA dw/den, y = 100 dn.
           * With a_C = 0 this is the old constant numerator. */
          return { num: q.a_C === 0
                     ? polyScale(PA, 100 * q.n0 * q.a_D * q.c_w)
                     : polyScale(polyMul(PA, polyAdd([q.a_D], polyScale(q.F, q.a_C))),
                                 100 * q.n0 * q.c_w),
                   den: q.den, delay: 0 };
        case 'flowTempOut':
          /* dT_out = 2 c_w (F K - n0 a_D a PA)/den — the factor D cancels
           * exactly, so the result really is a polynomial ratio. */
          return { num: polyScale(polyAdd(polyMul(q.F, q.K),
                                          polyScale(PA, -q.n0 * q.a_D * q.th.a)),
                                  2 * q.c_w),
                   den: polyMul(q.den, OUT), delay: 0 };
        default:
          /* num = 100 n0 k_u * P * A1 * A2 * D */
          return { num: polyScale(polyMul(PA, q.D), 100 * q.n0 * q.k_u),
                   den: q.den, delay: 0 };
      }
    },
    linChannels: ['power', 'tempOut', 'tempFuel', 'xenon', 'flowPower', 'flowTempOut'],

    /* SPEC §2 deadTime(p): transport delay of the plant, in seconds.
     * NOTE the name clash with xenon.html's deadTime(sim, margin), which is a
     * completely different thing (the xenon restart-blocking window). That one
     * lives in constraints.xenonDeadTime below. */
    /* Транспортное запаздывание теплоносителя через зону. Ноль здесь был
      * прямой неправдой: собственная модель объекта даёт время прохода
      * 2 tau_C, и именно на нём выход отзывается на вход. Регулятор,
      * настроенный по deadTime = 0, настроен не на этот объект. */
    deadTime(p) { return tauOutOf(p); },

    /* Right-half-plane zero of the u -> rho_Xe channel, closed form.
     * z = -lambda_I (A_X + B_I)/A_X ; A_X < 0 whenever burn-out dominates the
     * direct Xe yield, hence z > 0 and the channel is non-minimum phase. */
    xenonRHPZero(p, op) {
      const q = linParts(p, op);
      if (q.A_X === 0) return null;
      return -LAM_I * (q.A_X + q.B_I) / q.A_X;      // s^-1, positive = RHP
    },

    /* -------------------------------------------------------------- *
     * Constraints — part of the subject matter, not an afterthought.
     * -------------------------------------------------------------- */
    constraints: {
      /* Port of xenon.html deadTime(sim, margin), lines 408-417.
       * series: { t: [s], rhoXe: [pcm] } ; margin in pcm.
       * Returns null, or {t0, t1, dur} in seconds. */
      xenonDeadTime(series, marginPcm) {
        let t0 = -1, t1 = -1;
        for (let k = 0; k < series.t.length; k++) {
          if (Math.abs(series.rhoXe[k]) > marginPcm) {
            if (t0 < 0) t0 = series.t[k];
            t1 = series.t[k];
          }
        }
        if (t0 < 0) return null;
        return { t0, t1, dur: t1 - t0 };
      },
      /* Historical constant: beta of U-235 thermal, the default fuel. */
      promptCriticalAt: BETA_TOT,
      /* The threshold that is ACTUALLY used, for the current fuel and
       * spectrum. On pure Pu-239 it is 0.0021, not 0.0065. */
      promptCriticalAtFor(p) { return kinOf(p).betaTot; },
      violations: VIOLATIONS
    },

     * Delayed-neutron table for display: one row per nuclide and set, with
     * the honesty flags attached to the data rather than to a footnote.
     */
    nuclideTable() {
      const rows = [];
      for (const key of Object.keys(NUCLIDES)) {
        const nuc = NUCLIDES[key];
        for (const set of ['thermal', 'fast']) {
          const s = nuc[set];
          if (!s) continue;
          rows.push({
            nuclide: key, symbol: nuc.symbol, set,
            halfLives: s.T, abundances: s.a, aSum: s.aSum,
            nuD: s.nuD, nu: s.nu,
            beta: s.beta_tot, betaFromYield: s.betaFromYield,
            betaGroups: s.beta, lambdaGroups: s.lam,
            source: s.borrowedGroupsFrom ? SOURCES.pu241.ref : SOURCES.keepinFuels.ref,
            borrowedGroupsFrom: s.borrowedGroupsFrom || null,
            /* Alternative evaluations, so the spread is visible instead of
             * being flattened into one confident number. */
            alternative: key === 'U238'  ? { beta: 0.0157, from: 'Tuttle (1975/1979) based tables' }
                       : key === 'Pu239' ? { beta: 0.00224, from: 'Tuttle (1975/1979) based tables' }
                       : key === 'Pu241' ? { beta: 0.0054, from: 'commonly quoted; the band runs 0.0049…0.0054' }
                       : null
          });
        }
      }
      return rows;
    },

      {
        id: 'coolant-energy-balance',
        source: SOURCES.coolantNode.ref,
        title: L('Core energy balance and the response to a flow step',
                 'Тепловий баланс зони та відповідь на ступінь витрати',
                 'Energiebilanz des Kerns und Antwort auf einen Durchsatzsprung',
                 'Energiebalans van de kern en respons op een debietstap',
                 'Bilan énergétique du cœur et réponse à un échelon de débit',
                 'Balance energético del núcleo y respuesta a un escalón de caudal'),
        given: { n: '100 %, 50 %, 30 %', w: '1.0, 0.7, 0.4',
                 step: 'w: 1.0 -> 0.7 at a frozen rod position, xenon off' },
        expect: { balanceErrK: 0, TfErrAtNominalFlowK: 0,
                  nAfterFlowStep: null, ToutAfterFlowStepC: null,
                  TfDriftAfterFlowStepK: 0 },
        tol:    { balanceErrK: 1e-9, TfErrAtNominalFlowK: 1e-12,
                  nAfterFlowStep: 2e-4, ToutAfterFlowStepC: 5e-3,
                  TfDriftAfterFlowStepK: 2e-3 },
        note: 'Three things at once. (a) In steady state the two-node model must '
            + 'reproduce the exact energy balance T_out - T_in = dTcool * n / w for '
            + 'every power and every flow — checked over a grid, worst error reported. '
            + '(b) At NOMINAL flow the fuel temperature must still be exactly '
            + 'T_in + dTfull * n, i.e. the coolant node changes nothing that the '
            + 'previous single-node model already got right; this is what keeps every '
            + 'earlier reference case unchanged. (c) A flow cutback 1.0 -> 0.7 at a '
            + 'frozen rod position: the outlet gets HOTTER, the Doppler term answers '
            + 'and the power settles where the fuel temperature is back at its '
            + 'starting value. The settling point is analytic — the criticality '
            + 'condition needs T_f unchanged, hence n = (a0 + dTcool/2)/(a(w) + dTcool/2w) '
            + 'with a0 = dTfull - dTcool/2 and a(w) = a0[(1-phi) + phi w^-0.8], the '
            + 'flow-dependent fuel-to-coolant gap — so the reference is the closed '
            + 'form, not a previous run of the same code. With phi = 0 it reduces to '
            + 'the flow-independent expression this case used before.',
        run(p0) {
          const p = Object.assign({}, p0);
          let worst = 0, worstTf = 0;
          for (const n of [1, 0.5, 0.3]) {
            for (const w of [1, 0.7, 0.4]) {
              const eq = equilibrium(p, n * 100, { Tin: p.Tin0, flow: w });
              worst = Math.max(worst, Math.abs((eq.Tout - eq.Tin) - p.dTcool * n / w));
              if (w === 1) worstTf = Math.max(worstTf,
                Math.abs(eq.Tf - (p.Tin0 + p.dTfull * n)));
            }
          }
          /* flow step at a frozen rod position, xenon off */
          const p2 = Object.assign({}, p, { phiNom: 0 });
          const eq = equilibrium(p2, 100, { Tin: p2.Tin0, flow: 1 });
          let x = eq.x.slice();
          const io2 = { Tin: p2.Tin0, flow: 0.7 };
          for (let k = 0; k < 1200; k++) x = step(k, x, eq.u0, io2, p2, 1, x);
          /* Замкнутая форма, ТЕПЕРЬ с плёночным сопротивлением. Условие
           * критичности по-прежнему требует T_f без изменения, а
           *   T_f = T_in + a(w) n + (dTcool/2) n/w,
           * потому что произведение g a сохраняется по построению. Отсюда
           *   n = (a0 + dTcool/2) / (a(w) + dTcool/(2w)),
           * и при phi = 0 это ровно прежняя формула. Опорное значение
           * по-прежнему аналитическое, а не прогон того же кода. */
          const th2 = thermal(p2, 0.7);
          const nRef = (th2.a0 + 0.5 * p2.dTcool) / (th2.a + 0.5 * p2.dTcool / 0.7);
          const ToutEnd = outlet1ph(x, p2, io2);
          return {
            balanceErrK: worst, TfErrAtNominalFlowK: worstTf,
            nAfterFlowStep: x[iN], nAfterFlowStepRef: nRef,
            ToutAfterFlowStepC: ToutEnd,
            ToutAfterFlowStepCRef: p2.Tin0 + p2.dTcool * nRef / 0.7,
            TfDriftAfterFlowStepK: x[iTf] - eq.Tf,
            ToutRiseK: ToutEnd - eq.Tout
          };
        }
      },

    /* -------------------------------------------------------------- *
     * Scenario runners used by the refs (and available to the UI).
     * -------------------------------------------------------------- */
    scenarios: {
      /* Scram from equilibrium at full power: rods fully in (u = 0), then free
       * decay. Horizon 200 h by default — 72 h is what xenon.html plots, but the
       * asymptotic 9.14 h half-life is only reached much later, see below.
       * Series sampled every 60 s (peak search runs at the full 5 s step). */
      xenonPit(p0, phiNom, hours) {
        const p = Object.assign({}, p0, { phiNom });
        const d = 290;
        const eq = equilibrium(p, 100, d);
        let x = eq.x.slice();
        const H = 3600, DT = 5, SAMPLE = 12;             // 12 * 5 s = 60 s
        const T_END = (hours || 200) * H;
        const t = [], rhoXe = [], conc = [];
        let peak = 0, tPeak = 0, peakX = eq.Xeq;
        t.push(0); rhoXe.push(rhoXePcm(x[iX])); conc.push(1);
        const nSteps = Math.floor(T_END / DT);
        const Xat = {};                                   // X at the fit times
        for (let k = 1; k <= nSteps; k++) {
          x = step((k - 1) * DT, x, 0, d, p, DT, x);
          const r = rhoXePcm(x[iX]);
          if (Math.abs(r) > peak) { peak = Math.abs(r); tPeak = k * DT; peakX = x[iX]; }
          if (k % SAMPLE === 0) { t.push(k * DT); rhoXe.push(r); conc.push(x[iX] / eq.Xeq); }
          const th = k * DT / H;
          if (th === 40 || th === 60 || th === 150 || th === 200) Xat[th] = x[iX];
        }
        /* Apparent decay half-life over two windows.
         * X(t) = A e^(-lambda_X t) - B e^(-lambda_I t) with lambda_I > lambda_X,
         * so the iodine term only dies out on the scale 1/(lambda_I-lambda_X)
         * = 33.9 h. At 40-60 h it still carries ~30 % of X and the fitted
         * half-life is ~10.2 h; by 150-200 h it is gone and the fit returns
         * ln2/lambda_X = 9.14 h. Both are reported: the second is the physics,
         * the first is what a short record actually shows. */
        const fit = (ta, tb) => (Xat[ta] && Xat[tb])
          ? Math.LN2 / (Math.log(Xat[ta] / Xat[tb]) / ((tb - ta) * H)) / H : null;
        const dead = PLANT.constraints.xenonDeadTime({ t, rhoXe }, p.marginPcm);
        return {
          tPeak_h: tPeak / H, peakRatio: peakX / eq.Xeq, peakRhoPcm: -peak,
          rhoEqPcm: rhoXePcm(eq.Xeq),
          halfLife_h: fit(150, 200),          // asymptotic, = ln2/lambda_X
          halfLifeShortRecord_h: fit(40, 60), // what a 72 h record shows
          deadTime_h: dead ? { t0: dead.t0 / H, t1: dead.t1 / H, dur: dead.dur / H } : null,
          series: { t, rhoXe, conc }
        };
      },

      /* Power cutback 100 % -> target %, the new level then HELD by the rods.
       *
       * The rod position must be closed round the power: at a frozen rod
       * position the xenon that burns out over the following day releases
       * +2156 pcm, which drives the core prompt critical and the model
       * (correctly) refuses to continue. So the scenario uses a reactivity-
       * demand rod controller — u chosen each macro step so that
       *      rho_total = clamp(KP * ln(n_target/n), +-RHO_LIM),
       * i.e. the rods cancel the measured xenon and Doppler terms and command
       * a bounded period. KP and RHO_LIM below are controller settings of this
       * scenario, not plant data.
       *
       * KP must stay well below beta. The prompt jump makes n respond
       * ALGEBRAICALLY to rho, d(ln n) = d(rho)/(beta-rho), so a proportional law
       * rho = KP*ln(n_tgt/n) closes an instantaneous loop of gain KP*1e-5/beta.
       * At KP = 800 pcm that gain is 1.23 and the loop rings itself into a
       * standing offset; at KP = 100 pcm it is 0.154 and the loop settles in
       * about 7 min. Both measured. Steady state needs rho = 0, hence
       * n = n_target exactly — the proportional law has no offset here. */
      /* ---------------------------------------------------------- *
       * Graphite-tipped rod: the positive excursion on insertion,
       * and why it matters at LOW power.
       *
       * Постановка. Зона критична при ВЫСОКО поднятом стержне (u = 1 по
       * умолчанию) — то есть ровно в том состоянии, в которое её загоняет
       * ксеноновое отравление после снижения мощности, см. сценарий
       * rodOutAfterCutback. Оттуда стержень идёт ВНИЗ с постоянной
       * скоростью и останавливается на вершине горба концевика: это
       * «оператор начал вводить стержень» — самая простая постановка, в
       * которой выбег держится, а не пробегает мимо.
       *
       * Начальное состояние — СНИМОК, а не равновесие: концентрация
       * ксенона подобрана так, чтобы rho_total(uStart) = 0 точно.
       * Возвращается и сама концентрация, и её отношение к равновесной на
       * 100 %, чтобы было видно: требуемое отравление лежит внутри
       * ксеноновой ямы, а не выдумано. Иод оставлен равновесным для n0;
       * за 600 с горизонта ни иод, ни ксенон заметно не меняются
       * (постоянные времени — часы).
       * ---------------------------------------------------------- */
      graphiteTipExcursion(p0, opt) {
        const o = opt || {};
        const p = Object.assign({}, p0, o.params || {});
        const n0 = o.n0 != null ? o.n0 : 1;
        const uStart = clamp01(o.uStart != null ? o.uStart : 1);
        const vRod = o.vRod != null ? o.vRod : 0.05;      // доля хода в секунду
        const io = { Tin: num(p.Tin0, 290), flow: clampFlow(num(p.flow, 1)) };
        const an = rodTipAnalysis(p, uStart);
        const uEnd = clamp01(o.uEnd != null ? o.uEnd : an.uPeak);

        const T = thermalSteady(p, n0, io);
        let x = new Float64Array(NSTATE);
        x[iN] = n0;
        for (let i = 0; i < 6; i++) x[iC + i] = BETA[i] * n0 / (p.Lambda * LAM[i]);
        x[iI] = GAM_I * SIG_F * p.phiNom * n0 / LAM_I;
        x[iTf] = T.Tf; x[iTc] = T.Tc; x[iTo] = T.Tout;

        const rhoRod0 = rodWorth(uStart, p).total;
        const rhoDop0 = rhoDopPcm(T.Tf, p);
        const rhoXeNeeded = -(rhoRod0 + rhoDop0);
        const Xneeded = -rhoXeNeeded * (NU * SIG_F) / (SIG_AX * 1e5);
        const feasible = Xneeded >= 0;
        x[iX] = feasible ? Xneeded : 0;
        const XeqFull = (GAM_X + GAM_I) * SIG_F * p.phiNom
                      / (LAM_X + SIG_AX * p.phiNom);

        const DT = o.dt || 0.5, T_END = o.seconds || 180;
        const t = [], us = [], ns = [], rhos = [], tips = [], Tf = [], Tout = [];
        const push = (tt, u) => {
          const rw = rodWorth(u, p);
          t.push(tt); us.push(u); ns.push(x[iN]);
          rhos.push(rw.total + rhoXePcm(x[iX]) + rhoDopPcm(x[iTf], p));
          tips.push(rw.tip); Tf.push(x[iTf]); Tout.push(outlet1ph(x, p, io));
        };
        push(0, uStart);
        let nMax = x[iN], tMax = 0, rhoMax = rhos[0], tRhoMax = 0, err = null;
        const steps = Math.floor(T_END / DT);
        for (let k = 1; k <= steps; k++) {
          const u = Math.max(uEnd, uStart - vRod * (k - 1) * DT);
          try { x = step((k - 1) * DT, x, u, io, p, DT, x); }
          catch (e) { err = e; break; }
          push(k * DT, Math.max(uEnd, uStart - vRod * k * DT));
          if (x[iN] > nMax) { nMax = x[iN]; tMax = k * DT; }
          const r = rhos[rhos.length - 1];
          if (r > rhoMax) { rhoMax = r; tRhoMax = k * DT; }
        }
        /* Квазистатический прогноз: dRho + alpha_D * dT_f = 0, а
         * dT_f = (a + dTcool/(2w)) * dn, то есть при w = 1 просто dTfull*dn.
         * Обратная связь пропорциональна АБСОЛЮТНОЙ мощности, поэтому
         * относительный заброс растёт как 1/n0 — это и есть ответ на вопрос
         * «почему на малой мощности хуже». */
        const th = thermal(p);
        const dTdn = th.a + 0.5 * num(p.dTcool, 0) / io.flow;
        const dnPred = an.excursionPcm / (-num(p.alphaD, -2.5) * dTdn);

        /* КОНТРОЛЬНЫЙ ОПЫТ. Начальное состояние отравлено выше равновесного,
         * поэтому ксенон в нём выгорает и сам по себе поднимает мощность —
         * без всякого концевика. Чтобы приписать концевику ровно его вклад,
         * тот же снимок прогоняется с НЕПОДВИЖНЫМ стержнем, и заброс
         * считается как разность относительных приростов. Иначе на длинном
         * горизонте в «выбег концевика» попадёт чужая физика. */
        let baseline = null;
        if (!o._noBaseline) {
          baseline = PLANT.scenarios.graphiteTipExcursion(p0, Object.assign(
            {}, o, { uEnd: uStart, _noBaseline: true }));
        }
        const endRatio = x[iN] / n0;
        const baseEnd = baseline ? baseline.endRatio : 1;
        return {
          enabled: num(p.tipWorth, 0) !== 0,
          n0, uStart, uEnd, vRod, feasible, seconds: T_END,
          tipWorth: num(p.tipWorth, 0), tipLen: num(p.tipLen, 0.1),
          analysis: an,
          rhoXeNeededPcm: rhoXeNeeded, Xneeded, XoverXeqFull: Xneeded / XeqFull,
          nPeak: nMax, tPeak: tMax, peakRatio: nMax / n0,
          rhoPeakPcm: rhoMax, tRhoPeak: tRhoMax,
          rhoPeakDollar: rhoMax * PCM / betaEffOf(p),
          nEnd: x[iN], endRatio,
          /* заброс, очищенный от выгорания ксенона (контрольный прогон) */
          baselineRatio: baseEnd,
          netOvershoot: (endRatio - 1) - (baseEnd - 1),
          predictedPeakRatio: 1 + dnPred / n0, predictedDn: dnPred,
          predictedOvershoot: dnPred / n0,
          error: err ? err.code : null,
          baseline: baseline ? { endRatio: baseline.endRatio,
                                 series: baseline.series } : null,
          series: { t, u: us, n: ns, rho: rhos, rhoTip: tips, Tf, Tout }
        };
      },

      /* Тот же ввод стержня на полной и на малой мощности — числовой ответ
       * на вопрос владельца. Возвращаются ОБА числа и их отношение. */
      graphiteTipLowPower(p0, opt) {
        const o = opt || {};
        const nLow = o.nLow != null ? o.nLow : 0.05;
        const base = { params: o.params, uStart: o.uStart, vRod: o.vRod,
                       dt: o.dt, seconds: o.seconds };
        const full = PLANT.scenarios.graphiteTipExcursion(
          p0, Object.assign({}, base, { n0: 1 }));
        const low = PLANT.scenarios.graphiteTipExcursion(
          p0, Object.assign({}, base, { n0: nLow }));
        return {
          nLow, full, low, seconds: full.seconds,
          excursionPcm: full.analysis.excursionPcm,
          peakRatioFull: full.peakRatio, peakRatioLow: low.peakRatio,
          /* очищенные от выгорания ксенона относительные забросы, % */
          overshootFullPct: 100 * full.netOvershoot,
          overshootLowPct: 100 * low.netOvershoot,
          /* во столько раз относительный заброс на малой мощности больше */
          amplification: low.netOvershoot / full.netOvershoot,
          /* квазистатическое предсказание того же отношения: ровно 1/n0,
           * потому что обратная связь идёт по АБСОЛЮТНОЙ мощности */
          amplificationPredicted: 1 / nLow,
          dnFull: full.n0 * full.netOvershoot, dnLow: low.n0 * low.netOvershoot
        };
      },

      /* Почему стержни вообще оказываются наверху: после снижения мощности
       * ксенон растёт, и критичность требует всё большего вывода стержней.
       * Считается по уже существующему сценарию inverseResponse — сюда
       * добавлен только разбор траектории u(t).
       *
       * Считаются ДВА случая, и разница между ними — предмет оговорки.
       *  ordinary — штатный стержень (tipWorth = 0): чистое утверждение про
       *             ксенон и вес банка, к концевику отношения не имеющее.
       *             Рядом сообщается, какой выбег БЫЛ БЫ доступен в этих
       *             положениях, если бы у стержня был графитовый концевик.
       *  withTip  — тот же прогон с включённым концевиком, самосогласованно.
       *             Здесь положительный вес концевика сам уменьшает нужный
       *             вывод, поэтому единственный стержень точечной модели
       *             останавливается НИЖЕ и горб оказывается уже позади него.
       * Это ограничение точечной модели, а не физики: в реальной зоне
       * стержней много, часть выведена полностью, и вводят именно их. Модель
       * знает один стержень, поэтому обе картины показываются рядом, а не
       * выбирается удобная. */
      rodOutAfterCutback(p0, targetPct, hours) {
        const tipPars = { tipWorth: num(p0.tipWorth, 0), tipLen: num(p0.tipLen, 0.1) };
        const one = (p) => {
          const r = PLANT.scenarios.inverseResponse(p, targetPct, hours);
          const u = r.series.u, t = r.series.t;
          let uMax = u[0], tUMax = 0;
          for (let k = 0; k < u.length; k++)
            if (u[k] > uMax) { uMax = u[k]; tUMax = t[k]; }
          const withTip = Object.assign({}, p, tipPars);
          return {
            u0: u[0], uMax, tUMax_h: tUMax / 3600, strokeWithdrawn: uMax - u[0],
            /* выбег, доступный из начального и из верхнего положения,
             * посчитанный с параметрами концевика */
            excursionAtStartPcm: rodTipAnalysis(withTip, u[0]).excursionPcm,
            excursionAtMaxPcm: rodTipAnalysis(withTip, uMax).excursionPcm,
            series: { t, u }
          };
        };
        return {
          targetPct: targetPct || 60,
          tipWorth: tipPars.tipWorth, tipLen: tipPars.tipLen,
          ordinary: one(Object.assign({}, p0, { tipWorth: 0 })),
          withTip: tipPars.tipWorth === 0 ? null : one(Object.assign({}, p0, tipPars)),
          /* насколько высоко надо стоять, чтобы выбег вообще существовал */
          uMinForExcursion: rodTipAnalysis(
            Object.assign({}, p0, tipPars), 1).uMinForExcursion,
          caveat: L(
            'Read this before drawing the obvious conclusion. The xenon that follows a '
            + 'power cutback DOES demand more rod worth, and the equivalent rod of this '
            + 'point model does come out — but only by a few per cent of the stroke, '
            + 'while the tip excursion exists solely above uMinForExcursion, i.e. '
            + 'within a hand’s breadth of fully withdrawn. In this model the xenon '
            + 'argument therefore does NOT by itself put the rod where the bump is; '
            + 'compare uMax with uMinForExcursion in the numbers above. Worse, if the '
            + 'SAME single rod carries the tip, the tip’s own positive worth reduces '
            + 'the withdrawal it needs, so it stops even lower — both runs are '
            + 'reported. This is a limitation of the point model, not a statement about '
            + 'reactors: the real configuration is a bank of many rods of which '
            + 'individual ones sit fully withdrawn and are inserted together, and one '
            + 'equivalent rod cannot represent that. What the model does show honestly '
            + 'is the mechanism itself and its power dependence.',
            'Прочитайте, перш ніж робити очевидний висновок. Ксенон після зниження '
            + 'потужності справді вимагає більшої ваги стрижнів, і еквівалентний '
            + 'стрижень цієї точкової моделі виходить — але лише на кілька відсотків '
            + 'ходу, тоді як виграш концевика існує тільки вище uMinForExcursion, '
            + 'тобто майже біля крайнього верхнього положення. Отже, в цій моделі '
            + 'ксеноновий аргумент сам собою НЕ ставить стрижень туди, де є горб: '
            + 'порівняйте uMax з uMinForExcursion у числах вище. Гірше того, якщо '
            + 'концевик має ТОЙ САМИЙ єдиний стрижень, його власна додатна вага '
            + 'зменшує потрібне виведення, і він спиняється ще нижче — показано обидва '
            + 'прогони. Це обмеження точкової моделі, а не твердження про реактори: '
            + 'насправді стрижнів багато, окремі виведені повністю і вводяться разом, '
            + 'а один еквівалентний стрижень цього не передає. Чесно модель показує '
            + 'сам механізм і його залежність від потужності.',
            'Vor dem naheliegenden Schluss bitte lesen. Das Xenon nach einer '
            + 'Leistungsrücknahme verlangt tatsächlich mehr Stabwert, und der '
            + 'Ersatzstab dieses Punktmodells fährt heraus — aber nur um wenige Prozent '
            + 'des Hubes, während der Buckel ausschließlich oberhalb von '
            + 'uMinForExcursion existiert, also dicht an der ganz gezogenen Stellung. '
            + 'Das Xenon-Argument bringt den Stab in diesem Modell also NICHT von '
            + 'selbst dorthin, wo der Buckel ist; man vergleiche uMax mit '
            + 'uMinForExcursion in den Zahlen oben. Schlimmer noch: trägt DERSELBE eine '
            + 'Stab das Endstück, verringert dessen positiver Wert den nötigen Auszug, '
            + 'er bleibt noch tiefer stehen — beide Läufe werden berichtet. Das ist '
            + 'eine Grenze des Punktmodells, keine Aussage über Reaktoren: real ist es '
            + 'eine Gruppe vieler Stäbe, von denen einzelne ganz gezogen stehen und '
            + 'gemeinsam eingefahren werden, und ein Ersatzstab bildet das nicht ab. '
            + 'Ehrlich zeigt das Modell den Mechanismus selbst und seine '
            + 'Leistungsabhängigkeit.',
            'Lees dit voordat u de voor de hand liggende conclusie trekt. Het xenon na '
            + 'een vermogensreductie vraagt inderdaad meer staafwaarde, en de '
            + 'equivalente staaf van dit puntmodel komt eruit — maar slechts enkele '
            + 'procenten van de slag, terwijl de bult uitsluitend boven '
            + 'uMinForExcursion bestaat, dus vlak bij volledig uitgetrokken. Het '
            + 'xenonargument zet de staaf in dit model dus NIET vanzelf waar de bult '
            + 'is; vergelijk uMax met uMinForExcursion in de getallen hierboven. Erger: '
            + 'draagt DEZELFDE ene staaf het uiteinde, dan verkleint diens positieve '
            + 'waarde de benodigde uittrekking en stopt hij nog lager — beide runs '
            + 'worden gemeld. Dit is een beperking van het puntmodel, geen uitspraak '
            + 'over reactoren: in werkelijkheid is het een groep van vele staven '
            + 'waarvan er enkele volledig uitgetrokken staan en samen worden '
            + 'ingebracht, en één equivalente staaf geeft dat niet weer. Wat het model '
            + 'wel eerlijk toont is het mechanisme zelf en zijn vermogensafhankelijkheid.',
            'À lire avant de tirer la conclusion évidente. Le xénon qui suit une baisse '
            + 'de puissance exige bien davantage d’efficacité de barre, et la barre '
            + 'équivalente de ce modèle ponctuel sort effectivement — mais de quelques '
            + 'pour cent de la course seulement, alors que la bosse n’existe qu’au-'
            + 'dessus de uMinForExcursion, c’est-à-dire tout près de la position '
            + 'complètement retirée. Dans ce modèle, l’argument xénon ne place donc PAS '
            + 'à lui seul la barre là où est la bosse : comparez uMax et '
            + 'uMinForExcursion ci-dessus. Pire, si la MÊME barre unique porte '
            + 'l’embout, l’efficacité positive de celui-ci réduit le retrait '
            + 'nécessaire et elle s’arrête encore plus bas — les deux essais sont '
            + 'rapportés. C’est une limite du modèle ponctuel, non un énoncé sur les '
            + 'réacteurs : en réalité il s’agit d’un groupe de nombreuses barres dont '
            + 'certaines sont totalement retirées et insérées ensemble, ce qu’une barre '
            + 'équivalente ne peut représenter. Ce que le modèle montre honnêtement, '
            + 'c’est le mécanisme lui-même et sa dépendance à la puissance.',
            'Léase antes de sacar la conclusión evidente. El xenón posterior a una '
            + 'reducción de potencia sí exige más valor de barra, y la barra '
            + 'equivalente de este modelo puntual sale — pero solo un pequeño '
            + 'porcentaje de la carrera, mientras que la joroba existe únicamente por '
            + 'encima de uMinForExcursion, es decir, a un palmo de la posición '
            + 'totalmente extraída. En este modelo, por tanto, el argumento del xenón '
            + 'NO coloca por sí solo la barra donde está la joroba: compárese uMax con '
            + 'uMinForExcursion en los números anteriores. Peor aún, si la MISMA barra '
            + 'única lleva el extremo, su valor positivo reduce la extracción necesaria '
            + 'y se detiene aún más abajo — se informan ambas ejecuciones. Es una '
            + 'limitación del modelo puntual, no una afirmación sobre reactores: en '
            + 'realidad se trata de un banco de muchas barras, algunas totalmente '
            + 'extraídas e insertadas juntas, y una sola barra equivalente no puede '
            + 'representarlo. Lo que el modelo muestra con honestidad es el mecanismo '
            + 'mismo y su dependencia de la potencia.')
        };
      },

      inverseResponse(p0, targetPct, hours) {
        const p = Object.assign({}, p0, { phiNom: p0.phiNom || 3.0e13 });
        const tgt = (targetPct || 60) / 100;
        const d = 290;
        const KP = 100, RHO_LIM = 150;            // pcm, pcm — see note above
        const eqA = equilibrium(p, 100, d);
        const eqB = equilibrium(p, tgt * 100, d);
        let x = eqA.x.slice();
        const X0 = x[iX];
        const t = [], X = [], n = [], us = [];
        const DT = 5, T_END = (hours || 40) * 3600;
        t.push(0); X.push(x[iX]); n.push(x[iN]); us.push(eqA.u0);
        let maxX = x[iX], tMaxX = 0, crossBack = null;
        for (let k = 1; k * DT <= T_END; k++) {
          const rhoDem = Math.max(-RHO_LIM, Math.min(RHO_LIM,
                           KP * Math.log(tgt / Math.max(x[iN], 1e-30))));
          /* Обратная функция характеристики стержня, а не линейная формула:
           * с концевиком характеристика немонотонна, и «0.5 + rho/span»
           * выдало бы не то положение. При tipWorth = 0 rodPosFor
           * возвращает ровно 0.5 + rho/span, поэтому эталонный случай
           * inverse-response не меняется ни на бит. */
          let u = rodPosFor(rhoDem - rhoXePcm(x[iX]) - rhoDopPcm(x[iTf], p), p);
          u = Math.max(0, Math.min(1, u));
          x = step((k - 1) * DT, x, u, d, p, DT, x);
          t.push(k * DT); X.push(x[iX]); n.push(x[iN]); us.push(u);
          if (x[iX] > maxX) { maxX = x[iX]; tMaxX = k * DT; }
          if (crossBack === null && k * DT > 600 && x[iX] < X0) crossBack = k * DT;
        }
        const i5 = Math.round(300 / DT);          // 5 minutes
        return {
          X0, XfinalEq: eqB.Xeq, Xend: X[X.length - 1], nEnd: n[n.length - 1],
          slope5min: (X[i5] - X[0]) / 300,
          signFirstMinutes: Math.sign(X[i5] - X[0]),
          undershootSign: Math.sign(eqB.Xeq - X0),
          overshootRatio: maxX / X0,
          maxX, tMaxX_h: tMaxX / 3600,
          crossBack_h: crossBack === null ? null : crossBack / 3600,
          rhpZero: PLANT.xenonRHPZero(p, { n: 1 }),
          series: { t, X, n, u: us }
        };
      }
    },

    /* Runs every ref and reports pass/fail — the "Validate" button entry point. */
    validate(p0) {
      const p = p0 || PLANT.defaults();
      const out = [];
      for (const r of PLANT.refs) {
        let got, err = null;
        try { got = r.run(p); } catch (e) { err = e; }
        const checks = [];
        if (!err) {
          for (const key of Object.keys(r.expect)) {
            let want = r.expect[key];
            if (want === null && got[key + 'Ref'] !== undefined) want = got[key + 'Ref'];
            if (want === null) continue;
            const have = got[key];
            const tol = r.tol[key];
            let ok;
            if (tol === undefined) ok = (have === want);
            else if (key === 'period' || key === 'rhpZero')
              ok = Math.abs(have - want) <= Math.abs(want) * tol;
            else if (key === 'ratio' || key === 'peakRatio')
              ok = Math.abs(have - want) <= Math.abs(want) * tol;

            checks.push({ key, want, have, tol, ok });
          }
        }
        out.push({ id: r.id, ok: !err && checks.every((c) => c.ok),
                   error: err ? err.code : null, checks, got });
      }
      return { ok: out.every((r) => r.ok), refs: out };
    },

    defaults() {
      const p = {};
      for (const q of PLANT.params) p[q.key] = q.def;
      return p;
    }
  };

  return PLANT;
})();

/* ===========================================================================
 * lab/equilib.js — EQ: where the reactor is going, and when it is going nowhere.
 *
 * CONSOLE-CONTRACT.md §5.3. One global `EQ` in an IIFE. Pure arithmetic plus
 * its own SVG. No DOM outside the container it is handed — the stylesheet goes
 * inside it too, so there is no exception to declare and destroy() leaves
 * nothing behind. No reference to console.js, app.js or SCEN. The live stand
 * mounts it once and then only calls handle.update(state) ten times a second.
 *
 *   EQ.locus(plant, p, opts)      curve rho(n) split by contribution,
 *                                 zero crossings, stability of each
 *   EQ.map(plant, p, opts)        map of equilibria over two chosen axes
 *   EQ.mount(el, {plant, lang})   -> handle { update(state), setLang, destroy }
 *
 * WHAT IT COMPUTES
 * ----------------
 * With the rods held where they are, every slow state of the plant has a
 * steady value that depends only on the power n. Put those values back into
 * the reactivity balance and you get one scalar function of one variable:
 *
 *   rho(n) = rho_rod(u)                                (independent of n)
 *          + rho_Xe(X_eq(n)) + rho_D(T_f(n))
 *          + rho_C(T_c(n))   + rho_void(alpha(n))      (all from the plant)
 *
 * A zero of rho(n) is an equilibrium of the full eleven-state system: at
 * rho = 0 the point kinetics is stationary at any power, and every other
 * state is already at the steady value that power implies. No zero, no
 * equilibrium — and that case is the one the owner asked for by name.
 *
 * The feedback terms are NOT re-derived here. They are read out of
 * plant.equilibrium(p, n*100, io), which is the same code the stand and the
 * scenarios use, so this panel cannot drift away from the plant.
 *
 * STABILITY, TWO WAYS, ALWAYS BOTH NAMED
 * --------------------------------------
 * (a) POWER COEFFICIENT: the sign of drho/dn at the crossing. Quasi-static,
 *     one number, and it compares reactivities only — it knows nothing about
 *     how long each feedback takes to act.
 * (b) POLES: the roots of the denominator of plant.linearize(p, {n, flow})
 *     at that same operating point — the eigenvalues of the linearised
 *     eleven-state system. Factored by an Aberth-Ehrlich iteration; the
 *     number of right-half-plane roots is counted a second time by a Routh
 *     table on the same polynomial, and a mismatch between those two is
 *     reported rather than hidden.
 *
 * The two methods DISAGREE over a large part of this plant's parameter space —
 * at the DEFAULT parameter set, among others — and the panel says so in words
 * when they do. It does not pick one. The static criterion is not wrong; it
 * compares reactivities and knows nothing about how long each feedback takes,
 * and at high flux the slow xenon term carries enough phase to turn a negative
 * static gain into a growing thirty-hour oscillation. The non-linear
 * integrator settles the argument in equilib.test.js: measured growth rate and
 * period agree with the dominant pole to better than a per cent.
 *
 * WHAT IS OUTSIDE
 * ---------------
 * Everything plant.integrator.limits says is outside, plus: this is a point
 * model, so there is no axial anything here. Caveat text is quoted from
 * plant.integrator.limits and plant.presets.reactorCaveat; none is invented.
 *
 * Six languages: en, uk, de, nl, fr, es.
 * ======================================================================== */

    caveatMethod: L('Method. The contributions and the power coefficient are read out of the plant’s own steady state at each power, not re-derived here. The poles are the roots of the denominator of plant.linearize at the same operating point, factored by an Aberth–Ehrlich iteration; the number of right-half-plane roots is counted a second time by a Routh table on the same polynomial, and any mismatch between the two is printed above rather than hidden. Slopes are central differences with a step of 0.01 % power; where the curve has a kink — boiling starting — the one-sided slopes are given separately.',
                    'Метод. Внески й мовностний коефіцієнт беруться зі стаціонару самого об’єкта на кожній потужності, а не виводяться тут наново. Полюси — корені знаменника plant.linearize у тій самій робочій точці, розкладені ітерацією Аберта–Ерліха; кількість коренів у правій півплощині рахується вдруге таблицею Раута на тому самому многочлені, і будь-яка розбіжність друкується вище, а не ховається. Похідні — центральні різниці з кроком 0,01 % потужності; де крива має злам — початок кипіння — односторонні нахили наводяться окремо.',

                    'Methode. De bijdragen en de vermogenscoëfficiënt komen uit de eigen stationaire toestand van de installatie bij elk vermogen; ze worden hier niet opnieuw afgeleid. De polen zijn de wortels van de noemer van plant.linearize in hetzelfde werkpunt, ontbonden met een Aberth-Ehrlich-iteratie; het aantal wortels in het rechter halfvlak wordt een tweede keer geteld met een Routh-tabel op hetzelfde polynoom, en elk verschil staat hierboven in plaats van verborgen te blijven. Hellingen zijn centrale differenties met een stap van 0,01 % vermogen; waar de kromme een knik heeft — begin van koken — staan de eenzijdige hellingen apart.',
                    'Méthode. Les contributions et le coefficient de puissance sont lus dans le régime permanent du procédé lui-même à chaque puissance, et non redérivés ici. Les pôles sont les racines du dénominateur de plant.linearize au même point de fonctionnement, factorisées par une itération d’Aberth-Ehrlich ; le nombre de racines à droite est compté une seconde fois par un tableau de Routh sur le même polynôme, et tout écart est imprimé ci-dessus au lieu d’être caché. Les pentes sont des différences centrées au pas de 0,01 % de puissance ; là où la courbe présente un coude — début d’ébullition — les pentes unilatérales sont données séparément.',
