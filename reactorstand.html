const PL={"The coolant temperature has left the band in which this model’s linear ":"Temperatura płynu chłodzącego przekroczyła zakres, w którym model ten jest liniowy","moderator coefficient means anything. alpha_C is a single number fitted ":"współczynnik moderatora oznacza cokolwiek. alpha_C to pojedyncza liczba dopasowana","around the operating point; extrapolating a straight line far outside ":"wokół punktu operacyjnego; ekstrapolacja linii prostej daleko poza punkt operacyjny","that range invents reactivity no reactor has. What you are watching is a ":"Ten zakres wynalazł reaktywność, której nie ma żaden reaktor. To, co oglądasz, to","real accident — an uncontrolled cooldown returns reactivity and can ":"prawdziwy wypadek — niekontrolowany czas odnowienia przywraca reaktywność i może","take a shut-down core back to critical — but past this point the ":"przywrócić wyłączony rdzeń do stanu krytycznego — ale po przekroczeniu tego punktu","number would be arithmetic, not physics. Close the turbine valve, or ":"Liczba byłaby arytmetyczna, a nie fizyczna. Zamknij zawór turbiny lub","widen the band deliberately if you know what you are doing.":"Jeśli wiesz, co robisz, rozszerzaj pasmo świadomie.","Prompt critical: rho >= beta. The chain reaction is sustained by prompt ":"Krytyczny sygnał: rho ≥ beta. Reakcja łańcuchowa jest podtrzymywana przez sygnał","neutrons alone, the period collapses to the prompt generation time and ":"tylko neutrony, okres zapada się do czasu natychmiastowej generacji i","the point-kinetics/Doppler model shown here is no longer a valid ":"przedstawiony tutaj model kinetyki punktowej/Dopplera nie jest już ważny","description of the excursion. The simulation is refused rather than ":"opis wycieczki. Symulacja jest odrzucana zamiast","drawing meaningless numbers.":"rysowanie bezsensownych liczb.","Xenon dead time: |rho_Xe| exceeds the available reactivity margin. No rod ":"Czas martwy ksenonu: |rho_Xe| przekracza dostępny margines reaktywności. Brak pręta","position can make the core critical — this is a hard input constraint, ":"pozycja może sprawić, że rdzeń stanie się krytyczny — jest to twarde ograniczenie wejściowe,","not a tuning problem.":"nie jest to problem ze strojeniem.","Neutron population has fallen below the floor of the model (n < 1e-12 of ":"Populacja neutronów spadła poniżej dolnej granicy modelu (n < 1e-12 z","nominal). Point kinetics carries NO external neutron source, so from here ":"nominalna). Kinetyka punktowa NIE niesie ze sobą zewnętrznego źródła neutronów, więc stąd","the equations only decay towards zero and a subcritical start-up cannot be ":"równania zanikają tylko w kierunku zera i nie można przeprowadzić rozruchu podkrytycznego","described: the missing physics is source multiplication and the inverse-":"opisane: brakującą fizyką jest mnożenie źródła i odwrotność","count-rate approach, not the chain reaction. This is the declared limit (4) ":"podejście oparte na szybkości zliczania, a nie reakcji łańcuchowej. To jest deklarowany limit (4)","of the model, not prompt criticality — the power collapsed, it did not run away.":"modelu, a nie natychmiastowego przekroczenia stanu krytycznego — moc załamała się, nie uciekła.","The coolant is boiling harder than the closure in this file can ":"Płyn chłodzący wrze mocniej niż zamknięcie w tym pliku","describe: the core-average void fraction or the exit quality has left ":"opisz: średnia frakcja pustych przestrzeni rdzenia lub jakość wyjścia pozostała","the declared range. What is missing here is a thermal-hydraulic code — ":"deklarowany zakres. Brakuje tu kodu termohydraulicznego —","two-phase heat transfer, slip, pressure drop, flow redistribution, ":"dwufazowy transfer ciepła, poślizg, spadek ciśnienia, redystrybucja przepływu,","critical heat flux and dryout — none of which this plant contains. Void ":"krytyczny strumień ciepła i susza — a tego ta roślina nie zawiera. Pustka","here is a diagnostic quantity feeding reactivity only. The calculation ":"Oto diagnostyczna ilość pokarmu, która jest reaktywna. Obliczenia","is refused rather than extrapolated.":"jest odrzucane, a nie ekstrapolowane.","Fast-subsystem sub-step budget exhausted inside one macro step: the ":"Budżet podkroku szybkiego podsystemu wyczerpany w jednym kroku makro:","transient is faster than the integrator was configured for. Reduce the ":"Transient jest szybszy niż skonfigurowano dla integratora. Zmniejsz","macro step or the reactivity insertion.":"makrokrok lub wstawianie reaktywności.","Point-kinetics reactor with xenon poisoning":"Reaktor kinetyki punktowej z zatruciem ksenonem","Six-group point kinetics for U-235 coupled to the I-135/Xe-135 chain, ":"Kinetyka punktowa sześciogrupowa dla U-235 sprzężonego z łańcuchem I-135/Xe-135,","a two-node core thermal model (fuel and coolant) and Doppler feedback. ":"dwuwęzłowy model termiczny rdzenia (paliwo i chłodziwo) oraz sprzężenie zwrotne Dopplera.","Nine decades of time-scale spread, a genuinely non-minimum-phase output ":"Dziewięć dekad rozciągniętej skali czasowej, wynik w fazie nieminimalnej","and a hard input constraint (xenon dead time) in one plant. Control the ":"i sztywne ograniczenie wejściowe (czas martwy ksenonu) w jednej instalacji. Kontroluj","or the flow. ":"lub przepływ.","Switchable, and off by default: the neutron spectrum (thermal / intermediate / fast, which moves Λ by three decades), the fissioning nuclides and the enrichment (β_eff, and with it prompt criticality), a coolant/moderator and a void reactivity coefficient whose sign is yours to choose, and coolant boiling.":"ynnik reaktywności pustki, którego znak można wybrać, a także wrzenie chłodziwa.","Prompt neutron generation time Λ":"Czas generowania neutronów natychmiast Λ","Sets the prompt time scale. Together with β it fixes the prompt-jump relaxation time Λ/(β−ρ) ≈ 15 ms.":"Ustawia skalę czasu podpowiedzi. Wraz z β ustala czas relaksacji skoku podpowiedzi Λ/(β−ρ) ≈ 15 ms.","Control rod bank worth (full stroke)":"Wartość zespołu drążków sterujących (pełny skok)","ρ_control = worth · (u − 0.5), so u = 0.5 is the mechanical mid-stroke and gives zero rod reactivity. Typical value, user-adjustable, not reference data.":"ρ_control = wartość · (u − 0,5), więc u = 0,5 to mechaniczny środek skoku i zerowa reaktywność pręta. Wartość typowa, regulowana przez użytkownika, nie jest to wartość referencyjna.","Thermal flux at 100 % power φ₀":"Strumień cieplny przy 100% mocy φ₀","The xenon source and burn-out both scale with φ = φ₀·n. Set to 0 to switch the xenon chain off and study pure kinetics.":"Zarówno źródło ksenonu, jak i wypalenie są skalowane ze współczynnikiem φ = φ₀·n. Ustaw na 0, aby wyłączyć łańcuch ksenonowy i zbadać czystą kinetykę.","Doppler coefficient α_D":"Współczynnik Dopplera α_D","Fuel-temperature reactivity coefficient. TYPICAL LWR VALUE (−2…−3 pcm/K), not taken from the source tools — see the source register entry \"doppler\".":"Współczynnik reaktywności paliwowo-temperaturowej. TYPOWA WARTOŚĆ LWR (−2…−3 pcm/K), nie pochodzi z narzędzi źródłowych — patrz wpis w rejestrze źródłowym „Doppler”.","Fuel thermal time constant τ_f":"Stała czasowa cieplna paliwa τ_f","Fuel over-temperature at 100 % power ΔT_full":"Przekroczenie temperatury paliwa przy 100% mocy ΔT_full","Steady-state fuel temperature above coolant at nominal power. With α_D = −2.5 pcm/K this gives a power defect of −800 pcm. Typical value.":"Temperatura paliwa w stanie ustalonym powyżej temperatury płynu chłodzącego przy mocy nominalnej. Przy α_D = −2,5 pcm/K daje to defekt mocy −800 pcm. Wartość typowa.","Doppler reference temperature T_ref":"Temperatura odniesienia Dopplera T_ref","Fuel temperature at which the Doppler contribution is defined as zero. Only the difference T_f − T_ref matters.":"Temperatura paliwa, przy której wkład Dopplera jest zdefiniowany jako zero. Liczy się tylko różnica T_f − T_ref.","Coolant temperature rise across the core at 100 % / nominal flow ΔT_c":"Wzrost temperatury chłodziwa w rdzeniu przy 100% / przepływie nominalnym ΔT_c","T_out − T_in = ΔT_c·n/w, the exact core energy balance. TYPICAL LWR VALUE (25…40 K); 0 removes the coolant node and restores the earlier single-node behaviour exactly. Not reference data — see the source register entry \"coolantNode\".":"olantNode”.","Coolant node time constant τ_c":"Stała czasowa węzła chłodziwa τ_c","τ_c = M_c/(2·W₀): coolant mass in the core divided by twice the nominal mass flow. Typical value, not reference data. The thermal pair is solved by an exact matrix exponential, so τ_c never shortens the integration sub-step.":" całkowania.","Coolant mass flow (fraction of nominal) w":"Przepływ masowy chłodziwa (ułamek nominalnego) w","Relative thermal power [%]":"Względna moc cieplna [%]","Switches what measure() returns and which channel linearize() defaults to. The setpoint w is then read in the same units. Power is the default and nothing about it changes.":"Zmienia, co zwraca funkcja measure() i który kanał domyślnie ustawia linearize(). Wartość zadana w jest następnie odczytywana w tych samych jednostkach. Moc jest wartością domyślną i nic się w niej nie zmienia.","Relative coolant flow [−]":"Względny przepływ chłodziwa [−]","Selects which physical quantity the single disturbance channel d drives. Whichever is not selected keeps its parameter value (T_in or w).":"Wybiera wielkość fizyczną, którą steruje pojedynczy kanał zakłócający d. W przypadku braku wyboru zachowana zostanie wartość parametru (T_in lub w).","Rod tip (displacer) peak worth":"Wartość szczytowa szczytówki wędki (wypornika)","0 = an ordinary rod, and nothing changes. Positive = a graphite follower at the lower end that displaces water from the bottom of the core and inserts POSITIVE reactivity at the start of the travel — the rod characteristic becomes non-monotonic. Negative = an extra absorbing tip. Magnitude and sign are the user’s, not reference data — see the source register entry \"rodTip\".":"a końcówka absorbująca. Wielkość i znak są danymi użytkownika, a nie danymi referencyjnymi – patrz wpis w rejestrze źródłowym „rodTip”.","Tip travel (fraction of the rod stroke)":"Skok szczytówki (ułamek skoku pręta)","Width of the tip bump ρ_tip = worth·z·e^(1−z), z = (1−u)/tipLen. The characteristic is non-monotonic exactly when worth·e/tipLen > rod bank worth — computed by rodTipAnalysis(), not estimated. Shape chosen by the author, illustrative.":"Szerokość wypukłości na czubku ρ_tip = worth·z·e^(1−z), z = (1−u)/tipLen. Charakterystyka jest niemonotoniczna dokładnie wtedy, gdy worth·e/tipLen > wartość banku prętów — obliczona przez rodTipAnalysis(), nieoszacowana. Kształt wybrany przez autora, poglądowy.","Available reactivity margin":"Dostępny margines reaktywności","Excess reactivity the operator can call on. If |ρ_Xe| exceeds it the reactor cannot be restarted — the xenon dead time. Same slider as in xenon.html.":"Nadmierna reaktywność, na którą może powołać się operator. Jeśli |ρ_Xe| ją przekroczy, reaktor nie może zostać ponownie uruchomiony — jest to czas martwy ksenonu. Ten sam suwak, co w pliku xenon.html.","Neutron spectrum":"Widmo neutronów","Thermal (Λ ≈ 1e-4 s)":"Termiczne (Λ ≈ 1e-4 s)","Intermediate (Λ ≈ 1e-6 s)":"Średnio zaawansowany (Λ ≈ 1e-6 s)","Fast (Λ ≈ 1e-7 s)":"Szybko (Λ ≈ 1e-7 s)","Does exactly three things: multiplies Λ (×1, ×1e-2, ×1e-3), selects the measured delayed-neutron set (thermal- or fast-fission), and sets how much of the fission goes into the fertile nuclide, which moves β_eff. It deliberately does NOT rescale α_D, α_C or α_void — silently multiplying a number you typed would be dishonest; the reactor presets set those together. Doppler responsiveness still changes, because what matters is α_D/β_eff — see probe().alphaDollarPerK.":"Wykonuje dokładnie trzy czynności: mnoży Λ (×1, ×1e-2, ×1e-3), wybiera zmierzony zestaw neutronów opóźnionych (rozszczepienie termiczne lub szybkie) i ustala, ile rozszczepienia przechodzi do nuklidu paliworodnego, który przesuwa β_eff. Celowo NIE przeskalowuje α_D, α_C ani α_void — ciche mnożenie wpisanej liczby byłoby nieuczciwe; ustawienia wstępne reaktora ustawiają je razem. Reakcja na efekt Dopplera nadal się zmienia, ponieważ liczy się stosunek α_D do β_eff — patrz probe().alphaDollarPerK.","Fissile charge":"Ładunek rozszczepialny","Uranium (U-235 in U-238)":"Uran (U-235 w U-238)","Plutonium mix (Pu-239 + Pu-241 in U-238)":"Mieszanka plutonu (Pu-239 + Pu-241 w U-238)","Pure Pu-239 in U-238":"Czysty Pu-239 w U-238","U-233 (thorium cycle)":"U-233 (cykl torowy)","Which nuclides carry the fissions, and therefore which measured six-group set applies. β_eff of Pu-239 is about a THIRD of that of U-235: the same rod motion is worth three times as many dollars and the reactor is correspondingly harder to control. Note for U-233: this file carries no Th-232 delayed-neutron set, so no fertile fast-fission share is added for that fuel — a declared gap, not an oversight.":"szy do kontrolowania. Uwaga dotycząca U-233: ten plik nie zawiera zestawu opóźnionych neutronów Th-232, więc nie dodaje się udziału rozszczepienia szybkiego dla tego paliwa — deklarowana przerwa, a nie przeoczenie.","Enrichment (fissile fraction of the heavy metal)":"Wzbogacanie (frakcja rozszczepialna metali ciężkich)","Feeds the fission fractions: f_fertile = k_spectrum·(1 − e), the rest to the fissile nuclides. 100 % is a pure fissile charge — that is the default, and it is exactly the pure-U-235 model this file always was. The closure is the author’s teaching parameterisation, not a lattice calculation, and there is no burn-up in this model: the real drift of a light-water core towards plutonium is NOT represented.":"ką parametryzacją nauczania, a nie obliczeniami sieciowymi, a w tym modelu nie ma wypalenia: rzeczywisty dryf jądra lekkowodnego w kierunku plutonu NIE jest uwzględniony.","Coolant / moderator temperature coefficient α_C":"Współczynnik temperaturowy chłodziwa/moderatora α_C","ρ_C = α_C·(T_c − T_refC), on the core-average coolant temperature. 0 by default, so the model stays the Doppler-only one it was. Typical light-water values run −10…−50 pcm/K; a graphite-moderated lattice where the water is a net absorber can be slightly positive. Preset values, not reference data.":"rbentem netto, może być nieznacznie dodatnia. Wartości predefiniowane, a nie dane referencyjne.","Reference temperature for α_C":"Temperatura odniesienia dla α_C","Only shifts where ρ_C is zero; the equilibrium rod position absorbs the offset. Irrelevant while α_C = 0.":"Przesunięcia występują tylko tam, gdzie ρ_C wynosi zero; położenie pręta równowagi absorbuje przesunięcie. Nieistotne, gdy α_C = 0.","Void (steam) coefficient α_void":"Współczynnik pustki (pary) α_void","ρ_void = α_void·(core-average void fraction), so −10000 here is −100 pcm per per-cent void. THE SIGN IS THE POINT: negative (light water) means steam shuts the reactor down and the power coefficient stays negative; positive (a boiling channel in a graphite lattice, or sodium voiding in a fast core) means steam ADDS reactivity and the power coefficient can change sign — a qualitatively different stability. 0 by default, and identically zero whenever the coolant is not boiling.":"i (wrzący kanał w sieci grafitowej lub puste przestrzenie sodowe w szybkim rdzeniu) oznacza, że ​​para DODAJE reaktywności, a współczynnik mocy może zmienić znak — jakościowo różna stabilność. Domyślnie 0 i identycznie zero, gdy chłodziwo nie wrze.","Coolant saturation temperature (0 = boiling not modelled)":"Temperatura nasycenia chłodziwa (0 = wrzenie nie jest modelowane)","0 is a sentinel, not a temperature: with it the coolant never boils and the plant is the single-phase model it has always been — which is why every earlier trajectory is unchanged. Give it the saturation temperature of your pressure (345 °C at 15.5 MPa, 286 °C at 7.0 MPa, ≈880 °C for sodium at 1 atm) and the two-phase closure switches on above it.":"enia (345°C przy 15,5 MPa, 286°C przy 7,0 MPa, ≈880°C dla sodu przy 1 atm), a zamknięcie dwufazowe włącza się powyżej tej wartości.","Latent heat of vaporisation h_fg":"Ciepło utajone parowania h_fg","Steam-table value at the working pressure: 966 kJ/kg at 15.5 MPa, 1505 kJ/kg at 7.0 MPa. Sets the exit quality x = c_p(T_out,1ph − T_sat)/h_fg.":"Wartość pary przy ciśnieniu roboczym: 966 kJ/kg przy 15,5 MPa, 1505 kJ/kg przy 7,0 MPa. Ustawia jakość wyjściową x = c_p(T_out,1ph − T_sat)/h_fg.","Coolant specific heat c_p":"Ciepło właściwe chłodziwa c_p","Saturated-liquid c_p at the working pressure. Caveat stated rather than hidden: c_p rises steeply towards the critical point, so 8.9 kJ/(kg·K) at 15.5 MPa is a local value, not a constant, and the quality it produces is correspondingly approximate. At 7.0 MPa (5.4 kJ/(kg·K)) it is far better behaved.":"zybliżona. Przy 7,0 MPa (5,4 kJ/(kg·K)) zachowuje się znacznie lepiej.","Density ratio ρ_g/ρ_f":"Stosunek gęstości ρ_g/ρ_f","Enters the homogeneous void relation α = x/(x + (1−x)·ρ_g/ρ_f). 102/594 = 0.172 at 15.5 MPa, 36.5/740 = 0.049 at 7.0 MPa. Homogeneous flow means slip S = 1; a slip model would give more void at the same quality.":"Wchodzi w relację jednorodnej pustki α = x/(x + (1−x)·ρ_g/ρ_f). 102/594 = 0,172 przy 15,5 MPa, 36,5/740 = 0,049 przy 7,0 MPa. Przepływ jednorodny oznacza poślizg S = 1; model poślizgu dawałby więcej pustki przy tej samej jakości.","Void ceiling of the model":"Pusty sufit modelu","Above this core-average void the closure is refused with COOLANT_BOILING_BEYOND_MODEL rather than extrapolated. This is not a plant limit, it is the edge of the arithmetic in this file.":"Powyżej tej średniej wartości rdzenia zamknięcie jest odrzucane za pomocą COOLANT_BOILING_BEYOND_MODEL, a nie ekstrapolowane. Nie jest to ograniczenie zakładu, lecz krawędź arytmetyki w tym pliku.","Exit-quality ceiling of the model":"Sufit jakości wyjściowej modelu","Second ceiling, on the equilibrium exit quality. Same refusal, same reason: no critical heat flux and no dryout are modelled, so there is nothing here that could tell you what happens beyond it.":"Drugi pułap, dotyczący jakości wyjścia w stanie równowagi. Ta sama odmowa, ten sam powód: nie modeluje się krytycznego strumienia ciepła ani osuszenia, więc nie ma tu nic, co mogłoby powiedzieć, co dzieje się poza nim.","Second bank worth (bank with moderator followers)":"Wartość drugiego banku (bank z moderatorami)","Follower (displacer) peak worth of the second bank":"Wartość szczytowa drugiego banku dla podążającego (wypierającego)","Same bump ρ = worth·z·e^(1−z) as the single-bank tipWorth, but belonging to bank \"tipd\" only — bank \"reg\" has no follower and never will, that is what makes them two TYPES of rod. 0 by default: with worthTip = 0 and followerWorth = 0 there are no followers in the model at all. Illustrative magnitude chosen by the author, see the source register entry \"rodTip\".":"Ten sam współczynnik ρ = worth·z·e^(1−z) co tipWorth z pojedynczym bankiem, ale należący tylko do banku „tipd” — bank „reg” nie ma żadnego naśladowcy i nigdy nie będzie miał, co czyni je dwoma TYPAMI pręta. Domyślnie 0: przy worthTip = 0 i followerWorth = 0 w modelu nie ma żadnych naśladowców. Przykładowa wielkość wybrana przez autora, patrz wpis w rejestrze źródłowym „rodTip”.","Follower travel of the second bank (fraction of stroke)":"Podróż następcza drugiego banku (część udaru)","Width of the bump for bank \"tipd\". Bank \"tipd\" is non-monotonic exactly when followerWorth·e/followerLen > worthTip — computed by rodBankAnalysis(), not estimated.":"Szerokość wypukłości dla banku „tipd”. Bank „tipd” jest niemonotoniczny dokładnie wtedy, gdy followerWorth·e/followerLen > worthTip — obliczone przez rodBankAnalysis(), nieoszacowane.","Bank the control loop moves":"Przesuń pętlę sterowania","reg — regulating bank (plain absorber)":"reg — bank regulacyjny (zwykły absorber)","tipd — bank with moderator followers":"tipd — bank z moderatorami obserwującymi","The loop moves ONE bank. The other stands where it was put — that standing position is the whole condition for the low-power demonstration: the bank with followers sits deep in the core while the regulating bank works the power.":"Pętla porusza JEDEN bank. Drugi stoi tam, gdzie został umieszczony – ta pozycja stojąca to cały warunek demonstracji niskiej mocy: bank z towarzyszami znajduje się głęboko w rdzeniu, podczas gdy bank regulujący przetwarza moc.","Standing position of the bank the loop does not move":"Pozycja stojąca banku pętla nie porusza się","Relative thermal power":"Względna moc cieplna","y = 100·n. The historical output of this plant; unchanged.":"y = 100·n. Historyczna wydajność tej elektrowni; niezmieniona.","y = 2·T_c − T_in, i.e. T_in + ΔT_c·n/w in steady state. Two extra lags (fuel and coolant node) sit between the rods and this output, so its channel has relative degree 3 against 1 for power — the loop is slower and needs more phase margin. Once T_sat is declared and reached this output SATURATES at T_sat — a boiling mixture does not get hotter — and the loop loses authority over it; probe().ToutSinglePhase keeps the enthalpy stand-in the closure works from.":"cie.","Acts on the core through the Doppler term only: a hotter coolant raises the fuel temperature and inserts negative reactivity. Which physical quantity this single channel drives is set by the parameter distVar — see variants.":"Działa na rdzeń wyłącznie poprzez efekt Dopplera: cieplejszy płyn chłodzący podnosi temperaturę paliwa i wprowadza ujemną reaktywność. Wielkość fizyczną, którą napędza ten pojedynczy kanał, ustala parametr distVar — patrz warianty.","Enters the coolant node directly and the fuel through it; the Doppler term turns it into reactivity.":"Wchodzi bezpośrednio do węzła chłodzącego, a paliwo przepływa przez niego; zjawisko Dopplera przekształca je w reaktywność.","Relative coolant flow":"Względny przepływ chłodziwa","Validity. (1) rho < beta_eff strictly — at prompt criticality the model ":"Ważność. (1) rho < beta_eff ściśle — przy krytycznej wartości natychmiastowej modelu","refuses to run, see constraints.violations.promptCritical. The threshold ":"odmawia uruchomienia, patrz constraints.violations.promptCritical. Próg","is the beta_eff OF THE CURRENT FUEL AND SPECTRUM, not a constant: on pure ":"jest beta_eff AKTUALNEGO PALIWA I WIDMA, a nie stałą: na czysto","Pu-239 it stands at 210 pcm instead of 650. (2) Point kinetics: no spatial ":"Pu-239 wynosi 210 pcm zamiast 650. (2) Kinetyka punktowa: brak przestrzennej","effects, so axial xenon oscillations, flux tilts and the axial position of ":"efekty, takie jak osiowe oscylacje ksenonu, przechyły strumienia i położenie osiowe","any local reactivity effect are outside the model — in particular the ":"jakikolwiek lokalny efekt reaktywności jest poza modelem — w szczególności","moderator-follower demonstration is a point-model caricature of what is ":"demonstracja moderator-obserwujący jest karykaturą punktowego modelu tego, co jest","really a spatial effect. (3) Reactivity feedback is FOUR linear terms: ":"tak naprawdę efekt przestrzenny. (3) Sprzężenie zwrotne reaktywności składa się z CZTERECH liniowych wyrazów:","Doppler on the fuel temperature, a coolant/moderator coefficient on the ":"Doppler na temperaturę paliwa, współczynnik chłodziwa/moderatora na","core-average coolant temperature, a void coefficient on the core-average ":"średnia temperatura chłodziwa w rdzeniu, współczynnik pustki na średniej temperaturze w rdzeniu","void fraction, and xenon. There is no boron, no burn-up and no ":"frakcja pustki i ksenon. Nie ma boru, wypalenia i nie ma","samarium; the Doppler term is linear in T_f rather than in sqrt(T_f); ":"samar; człon Dopplera jest liniowy w T_f, a nie w sqrt(T_f);","the last three default to zero, so the default parameter set is the ":"ostatnie trzy są domyślnie ustawione na zero, więc domyślnym zestawem parametrów jest","Doppler-only model this file has always been. (4) No external neutron ":"Ten plik zawsze zawierał tylko model Dopplera. (4) Brak zewnętrznych neutronów","source, so subcritical multiplication and inverse-count start-up are not ":"źródło, więc mnożenie podkrytyczne i odwrotne uruchamianie nie są","modelled (n simply decays towards the model floor). (5) The macro step must ":"modelowany (n po prostu zanika w kierunku podstawy modelu). (5) Krok makro musi","satisfy h <= min(5 s, tau_f/2); larger h is subdivided automatically. ":"spełnia h <= min(5 s, tau_f/2); większe h jest automatycznie dzielone.","(6) Coolant circuit: single core-average node closed by T_out = 2 T_c - ":"(6) Obwód chłodziwa: węzeł jednordzeniowy o średniej wartości zamknięty przez T_out = 2 T_c -","T_in, so the STEADY energy balance is exact but there is no transport ":"T_in, więc stały bilans energetyczny jest dokładny, ale nie ma transportu","is clamped at 2 % of nominal; loss of forced flow, natural circulation and ":"jest zaciskany na poziomie 2% wartości nominalnej; utrata wymuszonego przepływu, cyrkulacji naturalnej i","pressure or secondary-side dynamics are outside the model. (7) BOILING: ":"ciśnienie lub dynamika strony wtórnej są poza modelem. (7) WRZENIE:","THIS IS NOT A THERMAL-HYDRAULIC CODE. Below the declared saturation ":"TO NIE JEST KOD TERMO-HYDRAULICZNY. Poniżej deklarowanego nasycenia","temperature nothing happens at all and the model is the single-phase one it ":"temperatura nic się nie dzieje, a model jest jednofazowy","was; above it, an equilibrium quality and a homogeneous void fraction are ":"było; nad nim, równowagowa jakość i jednorodny ułamek pustych przestrzeni są","computed FROM the single-phase energy balance and fed back into REACTIVITY ":"obliczone Z jednofazowego bilansu energetycznego i przekazane z powrotem do REAKTYWNOŚCI","ONLY. Void does not change the heat transfer coefficient, the coolant ":"TYLKO. Pustka nie zmienia współczynnika przenikania ciepła, czynnika chłodzącego","density in any momentum balance, the pressure drop, the flow or the ":"gęstość w dowolnym bilansie pędu, spadku ciśnienia, przepływu lub","pressure. There is no slip (S = 1), no subcooled boiling, no critical heat ":"ciśnienie. Nie ma poślizgu (S = 1), nie ma przechłodzonego wrzenia, nie ma ciepła krytycznego","flux, no dryout and no flow-quality-power instability. Beyond the declared ":"strumień, brak przesuszenia i brak niestabilności przepływu, jakości i mocy. Poza deklarowanymi","void and quality ceilings the model refuses with ":"sufity puste i jakościowe, model odmawia","COOLANT_BOILING_BEYOND_MODEL rather than extrapolating. (8) SPECTRUM: the ":"COOLANT_BOILING_BEYOND_MODEL zamiast ekstrapolacji. (8) SPECTRUM:","switch selects a parameterisation, it does not compute a spectrum — there ":"przełącznik wybiera parametryzację, nie oblicza widma — jest","is no lattice, no energy groups and no depletion in this file. Enrichment ":"W tym pliku nie ma żadnej sieci, żadnych grup energetycznych ani zubożenia. Wzbogacanie","moves the fission fractions through an explicit closure chosen by the ":"przesuwa frakcje rozszczepienia przez jawne zamknięcie wybrane przez","author, and burn-up (the real reason a light-water core drifts towards ":"autor i wypalenie (prawdziwy powód, dla którego jądro lekkowodne dryfuje w kierunku","plutonium) is absent. The xenon block uses THERMAL cross-sections; in a ":"(pluton) jest nieobecny. Blok ksenonowy wykorzystuje przekroje termiczne; w","fast spectrum sigma_a(Xe-135) is orders of magnitude smaller and xenon ":"szybkie widmo sigma_a(Xe-135) jest o rzędy wielkości mniejsze i ksenonowe","poisoning is negligible, but there is no fast cross-section here, so the ":"zatrucie jest nieznaczne, ale nie ma tu szybkiego przekroju, więc","fast preset reproduces the outcome by running a low flux, not the ":"szybkie ustawienie wstępne odtwarza wynik poprzez uruchomienie niskiego strumienia, a nie","mechanism. (9) Mixed fuels are collapsed back to six groups with ":"mechanizm. (9) Paliwa mieszane są ponownie rozdzielane na sześć grup","beta-weighted decay constants, which preserves each group yield and its ":"stałe rozpadu ważone beta, które zachowują wydajność każdej grupy i jej","initial emission rate exactly and its long-time decay only approximately.":"początkową szybkość emisji dokładnie, a jej długotrwały rozpad tylko w przybliżeniu.","Regulating bank (plain absorber)":"Bank regulacyjny (zwykły absorber)","Absorber only. Its characteristic ρ = worth·(u − 0.5) is monotonic, so inserting it always removes reactivity — no bump, ever.":"Tylko absorber. Jego charakterystyka ρ = worth·(u − 0,5) jest monotoniczna, więc jego wstawienie zawsze eliminuje reaktywność — nigdy nie powoduje wstrząsu.","Bank with moderator followers":"Bank z moderatorami obserwującymi","Rods whose lower end carries a moderator displacer. Worth 0 by default, so the model has no such rods until you give it some. With a follower the characteristic is non-monotonic and inserting from near the top ADDS reactivity first — see rodTipDemo, and read its disclaimer before drawing any conclusion.":"Pręty, których dolny koniec zawiera moderator. Wartość domyślna 0, więc model nie posiada takich prętów, dopóki nie zostanie im dodany. W przypadku elementu podążającego charakterystyka jest niemonotoniczna, a wstawianie od góry DODAJE najpierw reaktywności — zobacz rodTipDemo i przeczytaj jego wyłączenie odpowiedzialności przed wyciągnięciem jakichkolwiek wniosków.","Pressurised light-water core, loop type":"Rdzeń lekkowodny pod ciśnieniem, typ pętlowy","The reference case: thermal spectrum, strongly negative Doppler, negative moderator and void coefficients. Everything pushes back. Compare every other preset against this one.":"Przypadek odniesienia: widmo termiczne, silnie ujemny efekt Dopplera, ujemny moderator i współczynniki pustki. Wszystko się odpycha. Porównaj wszystkie inne ustawienia z tym.","Boiling channel in a graphite-moderated lattice, POSITIVE void coefficient":"Kanał wrzący w sieci moderowanej grafitem, dodatni współczynnik pustki","Boiling at nominal conditions (core-average void 0.165) and a POSITIVE ":"Wrzenie w warunkach nominalnych (średnia pustka w rdzeniu 0,165) i DODATNIE","void coefficient on top of it. Numbers this file computes: the power ":"współczynnik pustki na wierzchu. Liczby obliczane przez ten plik: potęga","coefficient of reactivity is −560 pcm per unit power with alphaVoid = ":"współczynnik reaktywności wynosi −560 pcm na jednostkę mocy przy alfaVoid =","+1000 against −1300 with the sign reversed, and — this is the part that ":"+1000 przeciwko −1300 ze znakiem odwróconym i — to jest ta część, która","matters — with the POSITIVE sign the operating point carries a pair of ":"sprawy — ze znakiem DODATNIM punkt operacyjny niesie parę","right-half-plane poles (about 4.5e-5 and 1.2e-4 1/s) while with the ":"bieguny prawej połowy płaszczyzny (około 4,5e-5 i 1,2e-4 1/s), podczas gdy","power UP (n = 1.073 after an hour, and accelerating) instead of down ":"zwiększyć moc (n = 1,073 po godzinie i przyśpieszeniu) zamiast ją zmniejszyć","(n = 0.980). The preset therefore needs an active loop at the operating ":"(n = 0,980). Dlatego ustawienie wstępne wymaga aktywnej pętli w punkcie operacyjnym","point; that is what a positive void coefficient costs, and it is the ":"punkt; to jest koszt dodatniego współczynnika pustki i to jest","reason the preset exists. It also carries the second rod bank with ":"z tego powodu istnieje to ustawienie wstępne. Zawiera również drugi bank prętów z","moderator followers, so the two-bank machinery has somewhere to live.":"zwolenników moderatorów, aby machina dwóch banków miała gdzie mieszkać.","Heavy-water channel core on natural uranium":"Rdzeń kanału ciężkowodnego na naturalnym uranie","Natural uranium, 0.71 % U-235: no enrichment at all, which is only possible because heavy water absorbs almost nothing. The price is a POSITIVE void coefficient — the calandria does the moderating, so the coolant in the c e. ":"podczas gdy odchylenie napiwku istnieje wyłącznie powyżej uMinForExcursion, tj.","within a hand’s breadth of fully withdrawn. In this model the xenon ":"w odległości na szerokość dłoni od całkowitego wycofania. W tym modelu ksenon","argument therefore does NOT by itself put the rod where the bump is; ":"argument ten sam w sobie NIE umieszcza pręta tam, gdzie jest wypukłość;","compare uMax with uMinForExcursion in the numbers above. Worse, if the ":"Porównaj uMax z uMinForExcursion w powyższych liczbach. Co gorsza, jeśli","SAME single rod carries the tip, the tip’s own positive worth reduces ":"TEN SAM pojedynczy pręt przenosi szczytówkę, jej własna dodatnia wartość zmniejsza","the withdrawal it needs, so it stops even lower — both runs are ":"wycofanie, którego potrzebuje, więc zatrzymuje się jeszcze niżej — oba biegi są","reported. This is a limitation of the point model, not a statement about ":"Zgłoszono. Jest to ograniczenie modelu punktowego, a nie stwierdzenie dotyczące","reactors: the real configuration is a bank of many rods of which ":"reaktory: rzeczywista konfiguracja to bank wielu prętów, z których","individual ones sit fully withdrawn and are inserted together, and one ":"poszczególne są całkowicie wycofane i wkładane razem, a jeden","equivalent rod cannot represent that. What the model does show honestly ":"Odpowiedni pręt nie może tego reprezentować. Co model pokazuje szczerze?","is the mechanism itself and its power dependence.":"jest sam mechanizm i jego zależność energetyczna.","Equilibrium: where this is going":"Równowaga: dokąd to zmierza","ρ(n): reactivity against power, split by contribution":"ρ(n): reaktywność względem mocy, podzielona według wkładu","What pulls which way at this equilibrium":"Co w którą stronę ciągnie w tej równowadze","Poles of the linearisation at this equilibrium":"Bieguny linearyzacji w tym stanie równowagi","Map of equilibria over two axes":"Mapa równowag na dwóch osiach","Control rods":"Pręty sterujące","Xenon-135":"Ksenon-135","Doppler (fuel)":"Doppler (paliwo)","Coolant / moderator":"Środek chłodzący / moderator","Steam (void)":"Para (pusta)","Relative power":"Moc względna","Real part":"Część rzeczywista","Imaginary part":"Część urojona","No equilibrium":"Brak równowagi","unstable":"nietrwały","marginal":"marginalny","not determined":"nie ustalono","power coefficient":"współczynnik mocy","poles":"słupy","THE TWO METHODS DISAGREE.":"DWIE METODY SIĘ NIE ZGADZAJĄ.","Power coefficient dρ/dn":"Współczynnik mocy dρ/dn","pcm per % power":"pcm na % mocy","e-folding time":"czas składania elektronicznego","slowest decay time":"najwolniejszy czas rozpadu","period":"okres","aperiodic":"aperiodyczny","Rightmost pole":"Prawy skrajny biegun","Poles in the right half-plane":"Bieguny w prawej półpłaszczyźnie","Routh table agrees":"Stół Routha się zgadza","What the bank can still hold":"Co bank może jeszcze utrzymać","The bank is out of stroke for the power you are at.":"Bank nie jest w stanie sprostać mocy, jaką posiadasz.","No boiling anywhere in this power range.":"W tym zakresie mocy nie ma mowy o wrzeniu.","Boiling is not modelled: T_sat is set to 0.":"Wrzenie nie jest modelowane: T_sat jest ustawione na 0.","steam removes reactivity, so boiling pushes the power back down":"para usuwa reaktywność, więc gotowanie zmniejsza moc","steam ADDS reactivity, so boiling pushes the power further up — the loop closes the wrong way round":"para DODAJE reaktywności, więc gotowanie zwiększa moc — pętla zamyka się w niewłaściwy sposób","switched off":"wyłączony","now":"Teraz","The diamond is the reactor at this instant. It sits off the curve whenever the slow states have not caught up with the power yet — the curve assumes they have.":"Diament jest w tej chwili reaktorem. Znajduje się poza krzywą, gdy stany wolne nie nadążają jeszcze za mocą – krzywa zakłada, że ​​tak się stało.","Horizontal axis":"Oś pozioma","Vertical axis":"Oś pionowa","equilibrium, stable by both methods":"równowaga, stabilna obiema metodami","equilibrium, stable by the power coefficient but unstable by the poles":"równowaga, stabilna ze względu na współczynnik mocy, ale niestabilna ze względu na bieguny","equilibrium, unstable by both methods":"równowaga, niestabilna obiema metodami","no equilibrium — the reactor shuts down":"brak równowagi — reaktor wyłącza się","no equilibrium — the power runs away":"brak równowagi — władza ucieka","not computed":"nie obliczono","Every cell is one whole ρ(n) curve solved for its zeros. The cell takes the stability of the equilibrium nearest the power you are at; the count of right-half-plane poles is a Routh table on the same polynomial the pole panel factors.":"Każda komórka to jedna cała krzywa ρ(n) rozwiązana dla swoich zer. Komórka przyjmuje stabilność równowagi najbliższej mocy, w której się znajdujesz; liczba biegunów prawej półpłaszczyzny to tablica Routha na tym samym wielomianie, co czynniki panelu biegunów.","the reactor is in this cell":"reaktor znajduje się w tej celi","Numbers":"Takty muzyczne","Where this stops being physics":"Gdzie to przestaje być fizyką","This is a point model. Nothing on this panel says anything about space: axial xenon oscillations and flux tilts are outside it, and the curve above is the whole core held at one power.":"To model punktowy. Nic na tym panelu nie mówi o przestrzeni: osiowe oscylacje ksenonu i przechyły strumienia znajdują się poza nim, a krzywa powyżej przedstawia całe jądro powiększone do jednej potęgi.","Zero power with no precursors is always an equilibrium of point kinetics. It is not counted as one here: the model has a power floor and no neutron source, so it is not an operating point and this panel does not pretend it is.":"Zerowa moc bez prekursorów zawsze stanowi punkt równowagi kinetyki punktowej. Nie jest ona tutaj liczona jako punkt równowagi: model ma dolną granicę mocy i nie ma źródła neutronów, więc nie jest to punkt operacyjny i ten panel nie udaje, że nim jest.","Method. The contributions and the power coefficient are read out of the plant’s own steady state at each power, not re-derived here. The poles are the roots of the denominator of plant.linearize at the same operating point, factored by an Aberth–Ehrlich iteration; the number of right-half-plane roots is counted a second time by a Routh table on the same polynomial, and any mismatch between the two is printed above rather than hidden. Slopes are central differences with a step of 0.01 % power; where the curve has a kink — boiling starting — the one-sided slopes are given separately.":"óżnice centralne z krokiem 0,01% mocy; tam, gdzie krzywa ma załamanie – początek wrzenia – nachylenia jednostronne są podawane osobno.","Limits declared by the plant":"Limity deklarowane przez zakład","About the reactor presets":"O ustawieniach wstępnych reaktora","Contribution":"Składka","At the equilibrium":"W stanie równowagi","Slope with power":"Pochyłość z mocą","Im s, 1/s":"Jestem s, 1/s","Time constant":"Stała czasowa","Equilibria found":"Znaleziono równowagę","Poles at the featured equilibrium":"Bieguny w wyróżnionym punkcie równowagi","Contributions at the featured equilibrium":"Wkłady w wyróżnionej równowadze","Which contribution changes fastest with power":"Który wkład zmienia się najszybciej wraz z mocą","Featured equilibrium":"Wyróżniona równowaga","Live reactor console":"Konsola reaktora na żywo","Reset to equilibrium":"Przywróć równowagę","Back off and resume":"Odpuść sobie i kontynuuj","Reactor preset":"Ustawienie wstępne reaktora","Console mode":"Tryb konsoli","Time multiplier":"Mnożnik czasu","Strip window":"Okno paska","Manual — the operator drives everything":"Manualny — operator steruje wszystkim","Hold power — the regulating bank is automatic":"Moc trzymania — bank regulacyjny jest automatyczny","HAND":"RĘKA","AUTO":"AUTOMATYCZNY","AT LIMIT":"NA GRANICY","Regulating bank, position":"Bank regulujący, pozycja","Bank with moderator followers, position":"Bank z moderatorami, pozycja","Coolant flow":"Przepływ płynu chłodzącego","Power setpoint":"Punkt nastawy mocy","1 = fully withdrawn, 0 = fully inserted.":"1 = całkowicie wysunięte, 0 = całkowicie wsunięte.","Hand controls":"Sterowanie ręczne","Physics in force right now":"Fizyka w mocy teraz","Same disturbance on every preset":"Te same zakłócenia na każdym ustawieniu wstępnym","+50 pcm on the regulating bank":"+50 pcm na banku regulacyjnym","Flow −10 %":"Przepływ −10%","Strip charts":"Wykresy paskowe","Physics you can switch":"Fizyka, którą możesz przełączać","No rod position makes this core critical at the current setpoint: the equilibrium the parameters ask for lies outside the bank travel. The console starts where it can and says so rather than pretending it is critical.":"Żadne położenie pręta nie sprawia, że ​​ten rdzeń jest krytyczny przy obecnym punkcie nastawy: równowaga, której wymagają parametry, leży poza zakresem ruchu bankowego. Konsola zaczyna od tego, co może, i mówi o tym, zamiast udawać, że jest krytyczna.","Thermal power":"Moc cieplna","Neutron flux density":"Gęstość strumienia neutronów","Xenon-135 reactivity":"Reaktywność ksenonu-135","Fuel temperature":"Temperatura paliwa","Core-average void fraction":"Średnia frakcja pustki rdzeniowej","Rod bank positions":"Pozycje banku prętów","Reactivity, by contribution":"Reaktywność według wkładu","Multiplication factor k_eff":"Współczynnik mnożenia k_eff","Second circuit temperatures":"Temperatury drugiego obwodu","Heat to the steam generator and to the turbine":"Ciepło do generatora pary i do turbiny","SG saturation":"Nasycenie SG","core inlet":"wlot rdzenia","to the SG":"do SG","to the turbine":"do turbiny","Steam generator and turbine, in relative units of nominal core power. The steam flow is what the governor valve passes at the current SG pressure, so it follows the core rather than being commanded independently: move the rods and the turbine follows within a loop transit. Feedwater is assumed balanced against steam flow — there is no SG level, no steam line dynamics, no bypass and no Rankine cycle here.":"Generator pary i turbina, w jednostkach względnych mocy nominalnej rdzenia. Przepływ pary to przepływ, jaki zawór regulacyjny przepuszcza przy aktualnym ciśnieniu SG, więc podąża on za rdzeniem, a nie jest sterowany niezależnie: po przesunięciu prętów turbina podąża za nimi w pętli. Zakłada się, że woda zasilająca jest zrównoważona z przepływem pary — nie ma tu poziomu SG, dynamiki rurociągów parowych, obejścia ani obiegu Rankine'a.","k_eff = 1/(1 − ρ), the definition rather than the 1 + ρ expansion, which is already 5 % wrong at −0.25.":"k_eff = 1/(1 − ρ), definicja, a nie rozwinięcie 1 + ρ, które jest już błędne o 5% przy −0,25.","Turbine valve":"Zawór turbinowy","Steam generator":"Generator pary","Steam drum":"Bęben parowy","Direct cycle: the core boils and its steam goes straight to the turbine through the drum. The drum pressure IS the core pressure, so the saturation temperature is a state, not a parameter — power raises the pressure, the pressure raises T_sat, and T_sat suppresses void. That is the loop a boiling core actually runs on; without it a positive void coefficient only ever pushes one way. No drum level, no feedwater flow, no downcomer or natural-circulation dynamics here.":"óżnię. To jest pętla, w której faktycznie działa wrzący rdzeń; bez niej dodatni współczynnik próżni działa tylko w jedną stronę. Nie ma tu poziomu w bębnie, przepływu wody zasilającej, przepływu opadowego ani dynamiki cyrkulacji naturalnej.","Turbine":"Turbina","second circuit off — direct cycle":"drugi obwód wyłączony — cykl bezpośredni","deeply subcritical":"głęboko podkrytyczny","subcritical":"podkrytyczny","critical":"krytyczny","supercritical":"nadkrytyczny","prompt supercritical":"natychmiastowy stan nadkrytyczny","Core state":"Państwo centralne","slowed for the transient":"spowolniony dla przejściowego","CORE DESTROYED":"ZNISZCZONE RDZEŃ","The model stopped at the last state it could still defend. What follows would not be a calculation.":"Model zatrzymał się na ostatnim stanie, którego mógł jeszcze bronić. To, co następuje, nie będzie obliczeniami.","Restart the model":"Uruchom ponownie model","Back two seconds":"Dwie sekundy do tyłu","failed at":"nie powiodło się","driven by":"napędzany przez","Build a core":"Zbuduj rdzeń","Build and load":"Zbuduj i załaduj","Fissile":"Rozszczepialny","Fertile":"Płodny","Coolant":"Płyn chłodzący","Fissile fraction":"Frakcja rozszczepialna","Uranium-235":"Uran-235","Plutonium-239":"Pluton-239","Uranium-233":"Uran-233","Uranium-238":"Uran-238","Thorium-232":"Tor-232","Light water":"Lekka woda","Heavy water":"Ciężka woda","Losing coolant ADDS reactivity.":"Utrata płynu chłodzącego ZWIĘKSZA reaktywność.","Losing coolant REMOVES reactivity.":"Utrata płynu chłodzącego USUWA reaktywność.","Losing coolant barely moves reactivity.":"Utrata płynu chłodzącego nie wpływa znacząco na reaktywność.","Very little delayed-neutron margin — the same rod motion is worth several times more dollars than in a uranium core.":"Bardzo mały margines opóźnionych neutronów — ten sam ruch pręta jest wart kilkakrotnie więcej dolarów niż w rdzeniu uranowym.","Order-of-magnitude physics, not a lattice calculation: the table maps the four choices onto beta_eff, Lambda, the Doppler coefficient and the void coefficient so that known reactors land on their known values. The sign of the void coefficient is not a property of the coolant — it is a property of whether the coolant is ALSO the moderator. Water that both moderates and cools takes the moderation with it when it boils; water in a graphite stack was only an absorber, so losing it adds reactivity.":"t właściwością tego, czy chłodziwo jest RÓWNIEŻ moderatorem. Woda, która zarówno moderuje, jak i chłodzi, zabiera ze sobą moderację podczas wrzenia; woda w stosie grafitowym była jedynie absorbentem, więc jego utrata zwiększa reaktywność.","reg bank":"bank rejestrowy","tipd bank":"bank tipd","rods":"pręty","xenon":"ksenon","coolant":"płyn chłodzący","void":"próżnia","φ = φ_nom·n exactly: in this point-kinetics model the flux is the power in absolute units, not a second, independent measurement. It is drawn because absolute flux is what an instrument reads — not because it carries new information.":"ormacje.","bottom of scale":"dół skali","top of scale":"na szczycie skali","in window":"w oknie","sampled every":"pobrano próbki co","paused — the console is not visible":"wstrzymano — konsola nie jest widoczna","refused by the model":"odrzucony przez modelkę","Wall-clock time":"Czas na zegarze ściennym","achieved":"osiągnięty","requested":"wymagany","The multiplier is not being met: this parameter set costs more processor time per model second than one frame can spend. Model time is not being banked as a debt — it is simply not advanced, and the shortfall is counted here.":"Mnożnik nie jest spełniony: ten zestaw parametrów zużywa więcej czasu procesora na sekundę modelu niż może wykorzystać jedna klatka. Czas modelu nie jest zadłużony – po prostu nie jest generowany, a niedobór jest tutaj uwzględniany.","β_eff (fuel in the core now)":"β_eff (paliwo w rdzeniu teraz)","Λ, prompt generation time":"Λ, czas generowania monitu","Enrichment":"Wzbogacenie","ρ total, in dollars":"ρ łącznie w dolarach","prompt critical at":"natychmiastowa krytyczna odpowiedź","Reactor period":"Okres reaktora","Coolant α_C":"Płyn chłodzący α_C","Void α_void":"Pustka α_void","POSITIVE — voids ADD reactivity":"POZYTYWNE — pustka ADD reaktywność","negative — voids remove reactivity":"negatywne — pustki usuwają reaktywność","boiling":"wrzenie","single phase":"jednofazowy","Bank worth now":"Wartość banku teraz","The model refused to go on":"Modelka odmówiła pójścia dalej","What to turn back":"Co odwrócić","ρ reached β_eff. Lower the regulating bank — the console can put every control back where it stood at the last good state — and insert reactivity in smaller bites. On a low-β preset the same rod motion is worth many more dollars, which is why this happens sooner there.":"tego dzieje się to szybciej.","The power collapsed to the floor of the model. Raise the banks and use Reset: point kinetics has no external neutron source, so nothing that happens below the floor can be computed, only invented — and this console will not invent it.":"Moc spadła na podłogę modelu. Podnieś brzegi i użyj Resetu: kinetyka punktowa nie ma zewnętrznego źródła neutronów, więc niczego, co dzieje się pod podłogą, nie da się obliczyć, można jedynie wymyślić — a ta konsola tego nie wymyśli.","Nothing is wrong with the plant — this is a statement about the MODEL. The coolant temperature has moved far enough that the single linear coefficient alpha_C would now be worth more than 3000 pcm on its own, and a straight line extrapolated that far is arithmetic, not measured physics. It usually means an uncontrolled cooldown: the turbine kept drawing steam while the core stopped making heat. Bring the load and the core back into balance — close the turbine valve, or raise power — and the temperatures come back inside the band.":"Z elektrownią wszystko w porządku – to stwierdzenie dotyczące MODELU. Temperatura chłodziwa wzrosła na tyle, że sam pojedynczy współczynnik liniowy alfa_C byłby teraz wart ponad 3000 pcm, a linia prosta ekstrapolowana do tego poziomu to arytmetyka, a nie fizyka mierzona. Zwykle oznacza to niekontrolowane schładzanie: turbina nadal pobierała parę, podczas gdy rdzeń przestał wytwarzać ciepło. Przywróć równowagę obciążenia i rdzenia – zamknij zawór turbiny lub zwiększ moc – a temperatury powrócą do zakresu.","Raise the flow or lower the power until the void fraction comes back inside the declared range. There is no thermal-hydraulic code behind this strip, so beyond that range there is nothing to draw.":"Zwiększ przepływ lub zmniejsz moc, aż frakcja pustki powróci do zadeklarowanego zakresu. Za tym paskiem nie ma przepisów termohydraulicznych, więc poza tym zakresem nie ma czego rysować.","Lower the time multiplier, or make the insertion smaller. The integrator ran out of sub-steps inside one macro step: the transient is faster than the step size allows, which is a statement about the arithmetic, not about the reactor.":"Obniż mnożnik czasu lub zmniejsz wstawianie. Integratorowi zabrakło podkroków w jednym kroku makro: stan przejściowy jest szybszy niż pozwala na to rozmiar kroku, co jest stwierdzeniem dotyczącym arytmetyki, a nie reaktora.","The xenon load exceeds the reactivity margin the parameter set allows. No rod position helps; wait it out or change the margin.":"Obciążenie ksenonem przekracza margines reaktywności dozwolony przez zestaw parametrów. Żadne położenie pręta nie pomaga; przeczekaj lub zmień margines.","Where this stand stops being true":"Gdzie to stanowisko przestaje być prawdą","Point kinetics: no space, no flux tilt, no local xenon, no burn-up. The two rod banks are a MECHANISM shown in a point model, not a reproduction of any event. The strip is sampled at a finite interval in model time — excursions faster than that interval are integrated but not drawn. The multiplier moves model time only; the arithmetic is the same at ×1 and at ×1000, and where it cannot keep up the console says so instead of quietly slowing the clock.":"Kinetyka punktowa: brak przestrzeni, brak nachylenia strumienia, brak lokalnego ksenonu, brak wypalenia. Dwa banki prętów to MECHANIZM przedstawiony w modelu punktowym, a nie reprodukcja jakiegokolwiek zdarzenia. Pasek jest próbkowany w skończonym odstępie czasu modelu — odchylenia szybsze niż ten odstęp są całkowane, ale nie rysowane. Mnożnik przesuwa tylko czas modelu; arytmetyka jest taka sama dla ×1 i ×1000, a tam, gdzie nie nadąża, konsola to informuje, zamiast po cichu zwalniać zegar.","Reduced motion is requested by this browser, so nothing moves until you press Start.":"Ta przeglądarka wymaga ograniczonego ruchu, więc nic się nie porusza, dopóki nie naciśniesz Start.","About every preset":"O każdym ustawieniu wstępnym","About the bank with moderator followers":"O banku z moderatorami obserwującymi","The reactor itself":"Sam reaktor","Keyboard: arrow keys move the focused handle by one step, Page Up and Page Down by ten, Home and End go to the ends of its travel.":"Klawiatura: klawisze strzałek przesuwają uchwyt o jeden krok, Page Up i Page Down o dziesięć, a Home i End przesuwają go do krańców zakresu ruchu.","Core":"Rdzeń","Rod drives":"Napędy prętowe","Inlet":"Wlot","Outlet":"Wylot","Flow valve":"Zawór przepływowy","nominal":"nominalny","Regulating bank — drag vertically in the core":"Bank regulacyjny – przeciąganie pionowe w rdzeniu","Bank with moderator followers — drag vertically in the core":"Bank z moderatorami — przeciągnij pionowo w rdzeniu","Flow valve — drag the handwheel up to open":"Zawór przepływowy — przeciągnij pokrętło do góry, aby otworzyć","Power setpoint — drag it along the power scale":"Punkt nastawy mocy — przeciągnij go wzdłuż skali mocy","Power scale — dragging moves the regulating bank":"Skala mocy — przeciąganie powoduje ruch banku regulacyjnego","In this mode power is not something you set: it is what comes out. The handle on the scale therefore moves the regulating bank — the thing that actually commands the power — and the core answers on its own time.":"W tym trybie moc nie jest czymś, co się ustawia: to to, co wychodzi. Uchwyt wagi porusza zatem zespół regulacyjny – element, który faktycznie steruje mocą – a rdzeń odpowiada w swoim własnym tempie.","What drives what":"Co napędza co","inlet":"wlot","Seeking equilibrium":"Poszukiwanie równowagi","at equilibrium — ρ ≈ 0":"w stanie równowagi — ρ ≈ 0","power rising":"rosnąca moc","power falling":"moc spada","no equilibrium here":"nie ma tu równowagi","Hard stops reached":"Osiągnięto twarde przystanki","flow at its lower stop":"przepływ przy dolnym ograniczniku","flow at its upper stop":"przepływ przy górnym zatrzymaniu","reg bank fully withdrawn":"bank rejestracyjny w pełni wypłacił","reg bank fully inserted":"bank rejestracyjny całkowicie włożony","tipd bank fully withdrawn":"bank tipd w pełni wypłacił","tipd bank fully inserted":"bank tipd całkowicie włożony","moderator follower":"obserwujący moderatora","Live mnemonic of the core":"Żywy mnemonik rdzenia","Equilibrium map":"Mapa równowagi","Reactor Live Stand":"Stanowisko do badań reaktora","Point kinetics with xenon and thermal feedback, integrated continuously in wall time. Turn the knobs while it runs.":"Kinetyka punktowa z ksenonem i sprzężeniem zwrotnym termicznym, zintegrowana w sposób ciągły w czasie rzeczywistym. Obracaj pokrętła podczas pracy.","What this is":"Co to jest?","Not a run and not a chart of a finished record: an instrument. The reactor integrates continuously for as long as this page is open and visible, model time is tied to the clock by a multiplier from ×1 to ×1000, and the strip charts scroll like an oscilloscope. Every control acts on the machine that is already running.":"Nie przebieg ani wykres ukończonego rekordu: instrument. Reaktor integruje się w sposób ciągły tak długo, jak długo ta strona jest otwarta i widoczna, czas modelu jest powiązany z zegarem za pomocą mnożnika od ×1 do ×1000, a wykresy paskowe przewijają się jak oscyloskop. Każdy element sterujący działa na maszynę, która już działa.","The preset picker loads a whole reactor family at once — generation time, delayed-neutron fraction, feedback coefficients, boiling and rod worths together — so that the difference between families is a difference in behaviour and not in one number. The speed multiplier and the width of the time window are separate controls, and the clock line says what was ordered and what the frame actually managed. When an operating point leaves the range the model is valid in, the stand refuses in writing and offers to recover instead of drawing rubbish.":"Program do wstępnego wyboru parametrów ładuje całą rodzinę reaktorów naraz – czas generacji, frakcję neutronów opóźnionych, współczynniki sprzężenia zwrotnego, wrzenie i wartości prętów – dzięki czemu różnica między rodzinami jest różnicą w zachowaniu, a nie w jednej wartości. Mnożnik prędkości i szerokość okna czasowego to oddzielne elementy sterujące, a linia zegara informuje, co zostało zamówione i co faktycznie zostało zrealizowane przez ramę. Gdy punkt operacyjny wykracza poza zakres, w którym model jest prawidłowy, stanowisko odmawia pisemnie i oferuje odzyskanie zamiast pobierania śmieci.","What this model does not do":"Czego ten model nie robi","Point kinetics with no space in it. There is one power, one fuel temperature and one coolant channel; there is no axial or radial distribution, no flux tilt, no local boiling crisis and no way for one part of the core to behave differently from another. Nothing here reproduces any particular plant or any particular accident.":"enia zachowywała się inaczej niż druga. Nic tutaj nie odtwarza żadnej konkretnej elektrowni ani żadnego konkretnego wypadku.","The preset families are teaching parameterisations, not the data sheet of any reactor: they are chosen so that the mechanisms differ visibly from one another, and their numbers have not been checked against a plant. This is not a thermal-hydraulic code either — the coolant is one lumped channel with a simple boiling model, there is no pressure dynamics, no critical-heat-flux correlation and no two-phase flow map.":"Rodziny predefiniowane uczą parametryzacji, a nie karty katalogowej dowolnego reaktora: są dobrane tak, aby mechanizmy wyraźnie się od siebie różniły, a ich liczba nie została sprawdzona w odniesieniu do instalacji. Nie jest to również kod termohydrauliczny — chłodziwo stanowi jeden kanał skupiony z prostym modelem wrzenia, nie ma dynamiki ciśnienia, korelacji krytycznego strumienia ciepła ani dwufazowej mapy przepływu.","The spectrum switch selects a parameterisation, it does not compute a spectrum: choosing fast, intermediate or thermal loads a different generation time, delayed-neutron fraction and set of feedback coefficients, and no transport or slowing-down calculation is performed anywhere on this page. The equilibrium map is a study of the model that is loaded, not of a reactor.":"Przełącznik widma wybiera parametryzację, ale nie oblicza widma: wybierając obciążenia szybkie, pośrednie lub termiczne, inny czas generacji, frakcję neutronów opóźnionych i zestaw współczynników sprzężenia zwrotnego, a na tej stronie nie są wykonywane żadne obliczenia transportu ani spowolnienia. Mapa równowagi to badanie modelu, który jest obciążony, a nie reaktora.","The stand is bound to the clock, so the arithmetic is bounded too. One frame integrates at most a tenth of a second of wall time and spends at most a few milliseconds of processor on it; a tab that was hidden for ten minutes does not wind the model forward by ten minutes when it comes back. Whatever a frame cannot manage is shown as the difference between the speed you ordered and the speed that came out, never quietly accumulated as debt.":"Stojak jest powiązany z zegarem, więc arytmetyka również jest ograniczona. Jedna klatka integruje co najwyżej jedną dziesiątą sekundy czasu ściennego i poświęca na to co najwyżej kilka milisekund procesora; zakładka, która była ukryta przez dziesięć minut, nie przesunie modelu do przodu o dziesięć minut po powrocie. To, czego klatka nie jest w stanie obsłużyć, jest pokazywane jako różnica między zamówioną prędkością a prędkością, która wyszła, nigdy nie jest po cichu akumulowane jako dług.","Prototype, not independently validated. Use it for teaching, for exploration and for preliminary reasoning; do not use it as the sole basis for design, safety analysis, licensing or operation.":"Prototyp, nie został niezależnie zweryfikowany. Używaj go do celów dydaktycznych, eksploracyjnych i wstępnego rozumowania; nie używaj go jako jedynej podstawy projektowania, analizy bezpieczeństwa, licencjonowania lub eksploatacji.","Related tools on this site":"Powiązane narzędzia na tej stronie","Control Loop Laboratory — the same reactor with a controller around it":"Laboratorium pętli sterowania — ten sam reaktor z kontrolerem wokół niego","Point Reactor Kinetics — the prompt jump and the inhour curve on their own":"Kinetics reaktora punktowego — skok natychmiastowy i krzywa godzinowa osobno","Xenon-135 Transient — the xenon pit after a shutdown, in detail":"Xenon-135 Transient — zbiornik ksenonowy po wyłączeniu, w szczegółach","Everything on this page is computed in your browser. Nothing is uploaded, nothing is stored beyond your language and theme choice.":"Wszystko na tej stronie jest obliczane w Twojej przeglądarce. Nic nie jest przesyłane ani przechowywane poza wybranym przez Ciebie językiem i motywem.","Full disclaimer":"Pełne wyłączenie odpowiedzialności","Validation register":"Rejestr walidacyjny","Skip to content":"Przejdź do treści","The stand could not start on this browser.":"Nie udało się uruchomić stoiska w tej przeglądarce.","Snapshot of a continuously running simulation, taken at model time %t. It is not a converged result and re-exporting a moment later gives different numbers.":"Migawka z ciągle działającej symulacji, wykonana w czasie modelowania %t. Nie jest to wynik zbieżny, a ponowny eksport chwilę później daje inne wyniki.","The run is stopped: the model refused to continue with %c.":"Uruchomienie zostało zatrzymane: model odmówił kontynuowania działania %c.","The power is sitting on the model floor (n = 1e-12 of nominal): the reactor is off, not at that power.":"Moc znajduje się na poziomie podłogi modelu (n = 1e-12 wartości nominalnej): reaktor jest wyłączony, nie ma tej mocy.","The power is rising out of the model floor with no external neutron source in the model: this restart is an artefact of the floor, not a calculation.":"Moc wydobywa się z podłogi modelu bez żadnego zewnętrznego źródła neutronów w modelu: ten restart jest artefaktem podłogi, a nie obliczeniem.","Xenon reactivity exceeds the declared control margin: the reactor is in the iodine pit.":"Reaktywność ksenonu przekracza zadeklarowany margines kontrolny: reaktor znajduje się w zbiorniku jodowym.","The ordered speed x%o was not achieved: the frame budget allowed x%a.":"Zamówiona prędkość x%o nie została osiągnięta: budżet ramki pozwalał na x%a.","This page integrates continuously in wall time. Every output above is the state of the model at the instant the record was built, not a converged answer to a posed question.":"Ta strona integruje się w sposób ciągły w czasie ściany. Każde powyższe wyjście to stan modelu w momencie utworzenia rekordu, a nie zbieżna odpowiedź na postawione pytanie.","The permalink restores the CONFIGURATION of the stand — preset, mode, parameters, setpoint, knob positions, speed and window — and not the point on the trajectory: the reopened stand starts again from the equilibrium of that configuration.":"Stały link przywraca KONFIGURACJĘ stanowiska — ustawienia wstępne, tryb, parametry, punkt nastawy, pozycje pokręteł, prędkość i okno — a nie punkt na trajektorii: ponownie otwarte stanowisko zaczyna od nowa od stanu równowagi tej konfiguracji.","Point kinetics: one power, one fuel temperature and one lumped coolant channel. The preset families are teaching parameterisations, not any particular plant.":"Kinetyka punktowa: jedna moc, jedna temperatura paliwa i jeden kanał płynu chłodzącego. Rodziny predefiniowane uczą parametryzacji, a nie konkretnej instalacji.","Reactivity balance at the snapshot":"Równowaga reaktywności w migawce"};
const siteLang=()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q&&String(q).slice(0,2).toLowerCase()==='pl')return'pl'}catch(e){}try{if(localStorage.getItem('diagram_site_lang')==='pl'||localStorage.getItem('diagram_lang')==='pl')return'pl'}catch(e){}return String(window.__diagramLang||'').slice(0,2).toLowerCase()};
if(siteLang()!=='pl')return;
document.documentElement.lang='pl';
const attrs=['placeholder','title','aria-label','alt'];
function tr(s){if(s==null)return s;const x=String(s);if(Object.prototype.hasOwnProperty.call(PL,x))return PL[x];const a=x.match(/^\s*/)[0],b=x.match(/\s*$/)[0],t=x.trim();if(Object.prototype.hasOwnProperty.call(PL,t))return a+PL[t]+b;return x}
function node(n){if(!n)return;if(n.nodeType===3){const p=n.parentElement;if(p&&!/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(p.tagName)){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}return}if(n.nodeType!==1)return;if(/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(n.tagName))return;for(const a of attrs)if(n.hasAttribute(a)){const v=n.getAttribute(a),w=tr(v);if(w!==v)n.setAttribute(a,w)}if(n.tagName==='INPUT'&&/^(button|submit|reset)$/i.test(n.type||'')){const v=n.value,w=tr(v);if(w!==v)n.value=w}const tw=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let q;while(q=tw.nextNode())node(q);for(const e of n.querySelectorAll('*'))for(const a of attrs)if(e.hasAttribute(a)){const v=e.getAttribute(a),w=tr(v);if(w!==v)e.setAttribute(a,w)}}
const run=()=>node(document.body);
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')node(m.target);else for(const n of m.addedNodes)node(n)}}).observe(document.documentElement,{subtree:true,childList:true,characterData:true});
})();
