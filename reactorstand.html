  const clamp01 = (v) => (v < 0 ? 0 : (v > 1 ? 1 : v));
  const clampFlow = (w) => (w > FLOW_MIN ? w : FLOW_MIN);

  /* Переключатели params. Приняты И числовая кодировка (как в plant-coil.js:
   * options[].value), И строковая — чтобы сборочная ветка могла писать
   * читаемое значение, не зная кодировки. */
  const ctrlIsTemp = (p) => p.ctrlVar === 1 || p.ctrlVar === '1'
                         || p.ctrlVar === 'Tout' || p.ctrlVar === 'tempOut';
  const distIsFlow = (p) => p.distVar === 1 || p.distVar === '1'
                         || p.distVar === 'flow' || p.distVar === 'mdot';

  /* ------------------------------------------------------------------ *
   * 4a1. Spectrum, fuel composition and the resulting kinetics set.
   * ------------------------------------------------------------------ */

  /* Index into SPECTRA. Numbers and ids both accepted, like the other
   * switches in this file. Anything unrecognised is thermal, i.e. the
   * behaviour this file had before the switch existed. */
  function spectrumIndex(p) {
    const v = p ? p.spectrum : undefined;
    if (typeof v === 'number' && v >= 0 && v < SPECTRA.length) return v | 0;
    if (typeof v === 'string') {
      const k = SPECTRA.findIndex((s) => s.id === v);
      if (k >= 0) return k;
      const n = Number(v);
      if (Number.isFinite(n) && n >= 0 && n < SPECTRA.length) return n | 0;
    }
    return 0;
  }
  const spectrumOf = (p) => SPECTRA[spectrumIndex(p)];

  /* Prompt generation time actually used by the equations.
   * thermal: exactly p.Lambda (bit for bit, the historical behaviour). */
  function LambdaOf(p) {
    const s = spectrumOf(p);
    const base = Math.max(num(p.Lambda, 1e-4), 1e-12);
    return s.lamScale === 1 ? base : base * s.lamScale;
  }

  function fuelTypeIndex(p) {
    const v = p ? p.fuelType : undefined;
    if (typeof v === 'number' && v >= 0 && v < FUEL_TYPES.length) return v | 0;
    if (typeof v === 'string') {
      const k = FUEL_TYPES.findIndex((f) => f.id === v);
      if (k >= 0) return k;
      const n = Number(v);
      if (Number.isFinite(n) && n >= 0 && n < FUEL_TYPES.length) return n | 0;
    }
    return 0;
  }

  /**
   * Fission fractions per nuclide.
   *
   *   f_fertile = k_spectrum * (1 - e),   e = enrichment/100 = fissile
   *                                        fraction of the heavy metal
   *   the rest is split over the fissile nuclides of the fuel type.
   *
   * The closure is the author's (SOURCES.spectrum): it is monotone, it goes
   * to zero for a pure fissile charge and it lands on the textbook orders of
   * magnitude. It is NOT a depletion or lattice calculation, and burn-up —
   * the real reason a light-water core drifts towards plutonium — is not in
   * this model at all.
   *
   * p.fissionFractions, if given, overrides everything: an explicit
   * {U235:…, Pu239:…} map, normalised here.
   */
  function fissionFractions(p) {
    const ov = p && p.fissionFractions;
    if (ov && typeof ov === 'object') {
      const out = {}; let sum = 0;
      for (const k of Object.keys(ov))
        if (NUCLIDES[k] && Number.isFinite(ov[k]) && ov[k] > 0) { out[k] = ov[k]; sum += ov[k]; }
      if (sum > 0) { for (const k of Object.keys(out)) out[k] /= sum; return out; }
    }
    const ft = FUEL_TYPES[fuelTypeIndex(p)];
    const sp = spectrumOf(p);
    const e  = clamp01(num(p && p.enrichment, 100) / 100);
    const fFert = ft.fertile ? sp.fertileFission * (1 - e) : 0;
    const out = {};
    if (fFert > 0) out[ft.fertile] = fFert;
    for (const k of Object.keys(ft.fissile)) {
      const w = (1 - fFert) * ft.fissile[k];
      if (w > 0) out[k] = (out[k] || 0) + w;
    }
    return out;
  }

  /**
   * Six-group kinetics set for the current fuel and spectrum.
   *
   * Mixing rule, and why: the nuclides have DIFFERENT half-lives, so the
   * mixture is not a six-group system at all — it is a 6*N-group one. The
   * standard engineering collapse back to six groups is used:
   *
   *   beta_i = sum_f w_f beta_{f,i}
   *   lam_i  = sum_f w_f beta_{f,i} lam_{f,i} / beta_i
   *
   * which preserves BOTH the total delayed yield of each group AND the
   * initial delayed-neutron emission rate of each group exactly, and gets the
   * long-time decay of each group slightly wrong (the true group decay is a
   * sum of exponentials, not one). The error is small because the group
   * half-lives of the actinides differ by a few per cent, not by orders.
   * `mixed: true` in the returned object marks that this approximation is
   * in play.
   *
   * SINGLE-NUCLIDE SHORT CIRCUIT: when one nuclide carries weight exactly 1
   * the published arrays are returned as they are, with no arithmetic at all.
   * That is what makes the default parameter set (pure U-235, thermal)
   * bit-for-bit identical to the file as it was.
   */
  function kineticsFor(p) {
    const sp = spectrumOf(p);
    const fr = fissionFractions(p);
    const keys = Object.keys(fr);
    const pick = (k) => {
      const nuc = NUCLIDES[k];
      return nuc[sp.set] || nuc.thermal || nuc.fast;
    };
    if (keys.length === 1 && fr[keys[0]] === 1) {
      const s = pick(keys[0]);
      return { beta: s.beta, lam: s.lam, betaTot: s.beta_tot,
               lamMin: Math.min.apply(null, s.lam),
               Lambda: LambdaOf(p), mixed: false,
               fractions: fr, nuclides: [keys[0]], set: s.set };
    }
    const beta = [0, 0, 0, 0, 0, 0], lam = [0, 0, 0, 0, 0, 0];
    const bl = [0, 0, 0, 0, 0, 0];
    /* Weights. beta_eff of a MIXTURE is the ratio of delayed to total neutron
     * production, sum(F_f nu_d,f) / sum(F_f nu_f), NOT the fission-fraction
     * average of the individual beta_f. The two differ because nu runs from
     * 2.43 (U-235 thermal) to 3.00 (Pu-239 fast): weighting by F alone
     * over-states beta_eff by 3.1 % on fast Pu-239 and under-states it by
     * 0.9 % on 4 % enriched U. The correct weight is therefore F_f nu_f,
     * renormalised — which is what nuTot below does. On a single nuclide the
     * renormalisation is the identity, so the pure-fuel path is unchanged. */
    let nuTot = 0;
    for (const k of keys) nuTot += fr[k] * num(pick(k).nu, 2.43);
    if (!(nuTot > 0)) nuTot = 1;
    for (const k of keys) {
      const s = pick(k), w = fr[k] * num(s.nu, 2.43) / nuTot;
      for (let i = 0; i < 6; i++) { beta[i] += w * s.beta[i]; bl[i] += w * s.beta[i] * s.lam[i]; }
    }
    let betaTot = 0;
    for (let i = 0; i < 6; i++) {
      lam[i] = beta[i] > 0 ? bl[i] / beta[i] : LAM[i];
      betaTot += beta[i];
    }
    return { beta, lam, betaTot, lamMin: Math.min.apply(null, lam),
             Lambda: LambdaOf(p), mixed: true,
             fractions: fr, nuclides: keys, set: sp.set };
  }

  /* One-entry memo. kineticsFor() is called from inside the sub-step loop,
   * where allocating six-element arrays a few thousand times per macro step
   * would be the dominant cost. The key covers every parameter the result
   * depends on. */
  let KIN_KEY = null, KIN_VAL = null;
  function kinOf(p) {
    const key = spectrumIndex(p) + '|' + fuelTypeIndex(p) + '|'
              + num(p && p.enrichment, 100) + '|' + num(p && p.Lambda, 1e-4) + '|'
              + (p && p.fissionFractions ? JSON.stringify(p.fissionFractions) : '');
    if (key === KIN_KEY) return KIN_VAL;
    KIN_KEY = key; KIN_VAL = kineticsFor(p);
    return KIN_VAL;
  }
  const betaEffOf = (p) => kinOf(p).betaTot;

  /**
   * Вход объекта по теплоносителю.
   *
   * `d` — скалярное возмущение ядра. Что именно оно означает, решает
   * переключатель p.distVar: температуру на входе (по умолчанию, ровно как
   * было) или относительный расход. Дополнительно принимается объект
   * {Tin, flow} — так сценарии задают оба входа сразу, не трогая p.
   *
   * Значения по умолчанию берутся из params (Tin0, flow), поэтому «расход как
   * параметр» и «расход как возмущение» — это одно и то же число, просто в
   * одном случае его двигает ядро.
   */
  function inputs(d, p) {
    let Tin = num(p.Tin0, 290), flow = num(p.flow, 1);
    if (d !== null && d !== undefined && typeof d === 'object') {
      if (Number.isFinite(d.Tin))  Tin  = d.Tin;
      if (Number.isFinite(d.flow)) flow = d.flow;
      if (Number.isFinite(d.mdot)) flow = d.mdot;
    } else if (Number.isFinite(d)) {
      if (distIsFlow(p)) flow = d; else Tin = d;
    }
    return { Tin, flow: clampFlow(flow) };
  }

  /* ------------------------------------------------------------------ *
   * 4b. Two-node core thermal model
   *
   *   fuel:     M_f c_f dT_f/dt = P - UA (T_f - T_c)
   *   coolant:  M_c c_c dT_c/dt = UA (T_f - T_c) - 2 W c_p (T_c - T_in)
   *   outlet:   T_out = 2 T_c - T_in            (linear axial profile)
   *
   * Один узел теплоносителя, а не два (вход/выход). Обоснование:
   *  - узел один, а замыкание T_out = 2 T_c - T_in даёт ТОЧНЫЙ стационарный
   *    баланс W c_p (T_out - T_in) = P при любой мощности и любом расходе;
   *    хорошо перемешанный узел без этого замыкания дал бы вдвое меньший
   *    статический коэффициент, то есть неверную физику там, где она и нужна;
   *  - два последовательных узла меняют фазовое запаздывание, но не статику,
   *    поэтому цена — одно лишнее состояние и никакой новой физики;
   *  - состояний и так десять, а разброс масштабов времени и без того девять
   *    порядков.
   * Ограничение этого замыкания было в том, что T_out отзывался на скачок
   * T_in МГНОВЕННО и с обратным знаком. Теперь T_out — отдельное состояние
   * x[11] с запаздыванием tau_out (по умолчанию 2 tau_C, время прохода
   * теплоносителя через зону); стационар при этом не меняется ни на бит, а
   * при p.tauOut = 0 состояние подчинено прежней алгебре и вся историческая
   * арифметика воспроизводится точно.
   *
   * Параметризация выбрана так, чтобы при НОМИНАЛЬНОМ расходе стационар
   * совпадал с прежней однонодовой моделью бит в бит:
   *   dTfull  = T_f - T_in при 100 % и w = 1   (как и раньше)
   *   dTcool  = T_out - T_in при 100 % и w = 1 (новое)
   *   a       = dTfull - dTcool/2 = T_f - T_c при 100 %   (перепад на топливе)
   *   g       = dTcool/(2a) = UA/(2 W0 c_p)               (безразмерное)
   * Стационар: T_f = T_in + a n + (dTcool/2) n/w,  T_out = T_in + dTcool n/w.
   * При w = 1 это ровно T_in + dTfull n — прежняя формула.
   * ------------------------------------------------------------------ *
   * ДОБАВЛЕНО (ревизия «динамика»): плёночное сопротивление по расходу.
   *
   * Прежде UA не зависел от расхода, а это значит, что перепад «топливо —
   * теплоноситель» a = T_f - T_c при данной мощности не менялся ВООБЩЕ при
   * изменении расхода. Следствие было ровно то, на которое жаловались: при
   * сбросе расхода температура топлива не поднималась ни на кельвин, она
   * сразу шла вниз вслед за мощностью.
   *
   * Полное сопротивление тепловому потоку от топлива к теплоносителю — это
   * последовательная цепочка: таблетка + зазор + оболочка (от расхода не
   * зависят) и ПЛЁНКА теплоотдачи к теплоносителю, которая по Диттусу —
   * Бёльтеру идёт как Re^0.8, то есть как w^0.8. Поэтому
   *
   *     1/UA(w) = R_solid + R_film / w^0.8,
   *     a(w) = a0 [ (1 - phi) + phi w^-0.8 ],   phi = R_film / R_total,
   *
   * а g и tau_f пересчитываются так, чтобы при w = 1 стационар и КАЖДЫЙ
   * коэффициент совпали с прежними бит в бит: g(w) = g0 a0/a(w) сохраняет
   * произведение g*a (то есть UA/2W0cp * (T_f-T_c) — сам теплосъём), а
   * tau_f(w) = tau_f0 a(w)/a0 сохраняет M_f c_f = UA tau_f.
   *
   * phi по умолчанию 0,05: у твэла ВВЭР плёнка — это единицы процентов
   * полного сопротивления, потому что зазор и таблетка перевешивают. Это
   * ЧЕСТНАЯ величина, и она даёт честный ответ: подъём температуры топлива
   * при сбросе расхода на 10 % — сотые доли кельвина, а не десятки. Кто
   * ожидает большего, ожидает физики кипящего канала, а не PWR.
   * ------------------------------------------------------------------ */
  const FILM_DEF = 0.05;

  function thermal(p, w) {
    const dTc = num(p.dTcool, 0);
    const a0 = Math.max(num(p.dTfull, 0) - 0.5 * dTc, DT_GAP_MIN);
    const g0 = 0.5 * dTc / a0;
    const tf0 = Math.max(num(p.tauF, 6), 1e-6);
    const phi = Math.min(Math.max(num(p.filmFrac, FILM_DEF), 0), 1);
    const ww = (typeof w === 'number' && w > FLOW_MIN) ? w : 1;
    const k = (phi === 0 || ww === 1) ? 1 : ((1 - phi) + phi * Math.pow(ww, -0.8));
    const a = a0 * k;
    return {
      a, g: g0 / k, a0, g0, filmFactor: k,
      tf: tf0 * k,
      tc: Math.max(num(p.tauC, 2), 1e-6)
    };
  }

  /* Стационарные температуры при мощности n, входе Tin и расходе w. */
  function thermalSteady(p, n, io) {
    const th = thermal(p, io.flow);
    const Tc = io.Tin + th.g * th.a * n / io.flow;
    return { Tc, Tf: Tc + th.a * n, Tout: io.Tin + 2 * th.g * th.a * n / io.flow };
  }

  /* ------------------------------------------------------------------ *
   * Транспортное запаздывание на выходе из зоны.
   *
   * Замыкание T_out = 2 T_c - T_in даёт ТОЧНЫЙ стационарный баланс, и это
   * его единственное достоинство. Динамически оно лжёт, причём в самую
   * плохую сторону: ступень на входе доходит до выхода МГНОВЕННО и С
   * ОБРАТНЫМ ЗНАКОМ. Проверено: при замороженном векторе состояния и
   * T_in -5 K показанный T_out прыгает 320,0 -> 325,0, а подогрев
   * 30 -> 40 K. На кипящем пресете это мгновенный скачок реактивности
   * +30,6 pcm не в ту сторону — то есть охлаждение входа читается моделью
   * как разгон.
   *
   * Поэтому T_out делается СОСТОЯНИЕМ с запаздыванием первого порядка
   *
   *     tau_out dT_out/dt = (2 T_c - T_in) - T_out,
   *
   * где tau_out по умолчанию — время прохода теплоносителя через зону,
   * 2 tau_C. Стационар не меняется НИ НА БИТ (в стационаре T_out равен
   * своему же алгебраическому значению), а при tau_out = 0 состояние
   * подчинено алгебре и вся прежняя арифметика воспроизводится точно —
   * поэтому старые страницы, линеаризация и таблицы остаются в силе.
   * ------------------------------------------------------------------ */
  const tauOutOf = (p) => {
    const v = p && p.tauOut;
    if (typeof v === 'number' && Number.isFinite(v)) return v > 0 ? v : 0;
    return 2 * Math.max(num(p && p.tauC, 2), 1e-6);
  };

  const outletTemp = (Tc, io) => 2 * Tc - io.Tin;

  /* ------------------------------------------------------------------ *
   * 4b2. Boiling — and the exact place where this stops being physics.
   *
   * THIS IS NOT A THERMAL-HYDRAULIC CODE. The statement is worth making
   * before the equations rather than after them.
   *
   * The two-node core model above solves a SINGLE-PHASE energy balance and
   * produces a single-phase ("virtual") outlet temperature
   *
   *     T_out,1ph = 2 T_c - T_in
   *
   * which is a stand-in for the coolant ENTHALPY at the core exit. As long
   * as T_out,1ph <= T_sat nothing happens at all: void = 0, quality = 0, the
   * outlet temperature is what it always was and every number this file
   * produced before is reproduced bit for bit.
   *
   * Above T_sat the enthalpy excess is read as vaporisation instead of
   * superheat:
   *
   *     x_exit = c_p (T_out,1ph - T_sat) / h_fg           equilibrium quality
   *     alpha(x) = x / (x + (1-x) rho_g/rho_f)            homogeneous void
   *     L_boil/L = (T_out,1ph - T_sat)/(T_out,1ph - T_in) boiling length
   *     void_core = (L_boil/L) * mean_{0..x_exit} alpha(x)
   *
   * with x linear along the boiling length, so the mean has the closed form
   * used below rather than a quadrature. The reported outlet temperature
   * becomes min(T_out,1ph, T_sat): a saturated mixture does not get hotter.
   *
   * WHAT IS DELIBERATELY ABSENT, and therefore must not be read into any
   * result: two-phase heat transfer (the fuel-to-coolant UA is unchanged),
   * the density change in the momentum balance, pressure drop, natural
   * circulation, pressure dynamics, slip (S = 1), subcooled boiling, critical
   * heat flux, dryout and flow-quality-power instabilities. Void here is a
   * DIAGNOSTIC quantity that feeds back into REACTIVITY and nothing else.
   * Above the declared ceilings the model refuses — see
   * VIOLATIONS.boilingBeyondModel.
   * ------------------------------------------------------------------ */

  /* mean of alpha(x) over x in [0, xe], x linear in the axial coordinate:
   *   int x/(r + (1-r)x) dx = x/(1-r) - r/(1-r)^2 * ln((r + (1-r)x)/r)     */
  function voidMean(xe, r) {
    if (!(xe > 0)) return 0;
    if (!(r > 0)) return 1;                       // rho_g -> 0: alpha -> 1
    /* xe = 1: тот же замкнутый вид при верхнем пределе 1, а не «всё пар».
     * Прежняя ветка давала 1 там, где точное среднее при r = 0,172 равно
     * 0,766 — скачок 0,234 по паросодержанию, то есть -2807 pcm при
     * alphaVoid = -12000. */
    if (xe >= 1) {
      if (!(r < 1)) return 0.5;
      const A1 = 1 - r;
      return 1 / A1 - (r / (A1 * A1)) * Math.log(1 / r);
    }
    const A = 1 - r;
    if (Math.abs(A) < 1e-12) return 0.5 * (xe + 0);        // r -> 1: alpha = x
    return (xe / A - (r / (A * A)) * Math.log((r + A * xe) / r)) / xe;
  }

  /**
   * Two-phase state of the core from the single-phase outlet temperature.
   * Returns the same shape whether or not it boils, so callers never branch.
   */
  function boilState(p, Tout1ph, Tin) {
    const Tsat = num(p.Tsat, TSAT_DEF);
    const modelled = Tsat > TSAT_OFF;
    const base = { Tsat, modelled, Tout1ph, Tout: Tout1ph, boiling: false,
                   quality: 0, voidFrac: 0, voidExit: 0, boilLenFrac: 0,
                   beyondModel: false };
    if (!modelled || !(Tout1ph > Tsat)) return base;
    const cp  = Math.max(num(p.cpCool, CP_DEF), 1);
    const hfg = Math.max(num(p.hfg, HFG_DEF), 1);
    const r   = Math.min(Math.max(num(p.rhoGasRatio, RHO_R_DEF), 1e-6), 1);
    const xe  = cp * (Tout1ph - Tsat) / hfg;
    const span = Tout1ph - Tin;
    const lb = span > 0 ? Math.min(1, (Tout1ph - Tsat) / span) : 1;
    const aExit = xe >= 1 ? 1 : xe / (xe + (1 - xe) * r);
    const aBar = lb * voidMean(Math.min(xe, 1), r);
    return { Tsat, modelled, Tout1ph, Tout: Tsat, boiling: true,
             quality: xe, voidFrac: aBar, voidExit: aExit, boilLenFrac: lb,
             beyondModel: (aBar > num(p.voidMax, VOID_MAX_DEF))
                       || (xe   > num(p.qualityMax, QUALITY_MAX_DEF)) };
  }

  /* Однофазный выход из зоны — СОСТОЯНИЕ, если задано запаздывание, и
   * алгебраическое замыкание, если нет. Одна точка входа, чтобы кипение,
   * реактивность, probe() и measure() никогда не разошлись между собой. */
  function outlet1ph(x, p, io) {
    return tauOutOf(p) > 0 ? x[iTo] : outletTemp(x[iTc], io);
  }

  /* Core state (temperatures + two-phase diagnosis) from the state vector. */
  function coreState(x, p, io) {
    return boilState(p, outlet1ph(x, p, io), io.Tin);
  }

  /* Cheap guard for the integration loop: two comparisons in the ordinary
   * (non-boiling) case, the full closure only when it actually boils. */
  function boilCheck(x, p, io) {
    const Tsat = num(p.Tsat, TSAT_DEF);
    if (!(Tsat > TSAT_OFF)) return false;
    const T1 = outlet1ph(x, p, io);
    if (!(T1 > Tsat)) return false;
    return boilState(p, T1, io.Tin).beyondModel;
  }

  /* Relative power that produces a requested outlet temperature in steady
   * state: T_out - T_in = dTcool * n / w.
   * Уставка ниже температуры на входе физически недостижима — зона греет, а
   * не охлаждает. Такой запрос сводится к нулю мощности, и модель отвечает на
   * него уже существующим честным отказом SUBCRITICAL_NO_SOURCE, а не
   * отрицательной мощностью и мусором в остальных состояниях. */
  function powerForOutlet(p, Tout, io) {
    const dTc = num(p.dTcool, 0);
    if (!(dTc > 0)) return 1;
    /* Уставка выше температуры насыщения недостижима в принципе: насыщенная
     * смесь не греется дальше. Прежде запрос T_set = 350 при T_sat = 345
     * молча превращался в 200 % номинала и вечную ошибку -5 K, которую
     * регулятор не мог убрать никогда. Ограничиваем запрос там, где физика
     * его и ограничивает. */
    const Tsat = num(p.Tsat, TSAT_DEF);
    const Tset = (Tsat > TSAT_OFF && Tout > Tsat) ? Tsat : Tout;
    const n = (Tset - io.Tin) * io.flow / dTc;
    return n > 0 ? n : 0;
  }

  /**
   * Точное решение линейной системы (T_f, T_c) на шаге dt при замороженных
   * n, T_in, w. Матрица 2x2 с положительными внедиагональными элементами,
   * поэтому собственные значения всегда вещественны:
   *   disc = (a11 - a22)^2 + 4 a12 a21 >= 0.
   * Ни устойчивость, ни точность шага dt не ограничивают, поэтому появление
   * второго теплового узла НЕ уменьшает подшаг быстрой подсистемы.
   */
  function thermalStep(x, dt, n, p, io) {
    const th = thermal(p, io.flow);
    const w = io.flow;
    const TcS = io.Tin + th.g * th.a * n / w;
    const TfS = TcS + th.a * n;
    const ef = x[iTf] - TfS, ec = x[iTc] - TcS;
    const Tc0 = x[iTc];
    const a11 = -1 / th.tf, a12 = 1 / th.tf;
    const a21 = th.g / th.tc, a22 = -(th.g + w) / th.tc;
    const tr = a11 + a22;
    const disc = Math.sqrt((a11 - a22) * (a11 - a22) + 4 * a12 * a21);
    /* Больший по модулю корень берётся прямой формулой, меньший — через
     * определитель. Иначе при почти вырожденной параметризации (dTfull,
     * близком к dTcool/2) 0,5(tr + disc) — это разность двух почти равных
     * чисел, и медленное собственное значение теряет половину значащих
     * цифр: измерено -5,59e-9 вместо точного -3,75e-9, ошибка 49 %. */
    const lBig = 0.5 * (tr - disc);                       // tr < 0, disc >= 0
    const det = a11 * a22 - a12 * a21;
    const lSml = Math.abs(lBig) > 1e-300 ? det / lBig : 0.5 * (tr + disc);
    const l1 = lSml, l2 = lBig;
    let m11, m12, m21, m22;
    if (disc > 1e-12 * Math.max(1, Math.abs(tr))) {
      const e1 = Math.exp(l1 * dt), e2 = Math.exp(l2 * dt), inv = 1 / (l1 - l2);
      m11 = (e1 * (a11 - l2) - e2 * (a11 - l1)) * inv;
      m12 = (e1 * a12       - e2 * a12)         * inv;
      m21 = (e1 * a21       - e2 * a21)         * inv;
      m22 = (e1 * (a22 - l2) - e2 * (a22 - l1)) * inv;
    } else {
      /* Вырожденный случай (кратный корень): exp(At) = e^{lt}(I + (A-lI)t)
       * — не приближение, а точная формула для дефектной матрицы 2x2. */
      const e = Math.exp(l1 * dt);
      m11 = e * (1 + (a11 - l1) * dt); m12 = e * a12 * dt;
      m21 = e * a21 * dt;              m22 = e * (1 + (a22 - l1) * dt);
    }
    x[iTf] = TfS + m11 * ef + m12 * ec;
    x[iTc] = TcS + m21 * ef + m22 * ec;

    /* Транспортное запаздывание на выходе. Цель 2 T_c - T_in за подшаг
     * меняется, поэтому берётся ТОЧНОЕ решение при линейно меняющейся цели:
     * для dy/dt = (r(t) - y)/tau с r = r0 + s t
     *     y(dt) = r(dt) - s tau + (y0 - r0 + s tau) e^{-dt/tau}.
     * При постоянной цели (s = 0) это обычная экспонента, а стационар
     * воспроизводится точно при любом dt. */
    const tau = tauOutOf(p);
    if (tau > 0) {
      const r0 = 2 * Tc0 - io.Tin, r1 = 2 * x[iTc] - io.Tin;
      const s = (r1 - r0) / dt;
      const e = Math.exp(-dt / tau);
      x[iTo] = r1 - s * tau + (x[iTo] - r0 + s * tau) * e;
    } else {
      x[iTo] = 2 * x[iTc] - io.Tin;
    }
  }

  /* ------------------------------------------------------------------ *
   * 4c. Rod worth as a function of position — absorber plus optional
   *     graphite displacer ("tip") at the lower end of the rod.
   *
   * u = 1 — стержень полностью извлечён, u = 0 — полностью введён.
   * Глубина ввода i = 1 - u.
   *
   *   rho_absorber(u) = rhoSpan (u - 0.5)          — как и было, линейно
   *   rho_tip(u)      = tipWorth * B(i / tipLen),  B(z) = z e^{1-z}
   *
   * B(z) — гладкий горб: B(0) = 0, максимум B(1) = 1, B -> 0 при z -> inf.
   * Физический смысл: пока графитовый вытеснитель входит в нижнюю (водяную)
   * часть канала, он вытесняет воду и добавляет положительную реактивность;
   * когда он проходит зону насквозь, а следом входит поглотитель, вклад
   * концевика спадает. Форма горба ВЫБРАНА АВТОРОМ (см. SOURCES.rodTip), это
   * не подгонка под чьи-либо данные.
   *
   * Немонотонность: d(rho)/du = rhoSpan - tipWorth*(1-z)e^{1-z}/tipLen, при
   * u = 1 (z = 0) это rhoSpan - tipWorth*e/tipLen. Значит выбег появляется
   * ровно при  tipWorth * e / tipLen > rhoSpan  — условие считается кодом
   * (rodTipAnalysis), а не оценивается на глаз.
   * ------------------------------------------------------------------ */
  const rodBump  = (z) => (z > 0 ? z * Math.exp(1 - z) : 0);
  /* dB/dz. В нуле B'(0) = e, а не 1 — именно этот наклон и решает, есть ли
   * выбег при вводе из крайнего верхнего положения, так что точка z = 0
   * обязана попадать в основную ветвь. */
  const rodBumpD = (z) => (z >= 0 ? (1 - z) * Math.exp(1 - z) : 0);

  function rodWorth(u, p) {
    const uu = clamp01(u);
    const span = num(p.rhoSpan, 0);
    const tw = num(p.tipWorth, 0);
    const tl = Math.max(num(p.tipLen, 0.1), 1e-6);
    const z = (1 - uu) / tl;
    const absorber = span * (uu - 0.5);
    const tip = tw * rodBump(z);
    return {
      absorber, tip, total: absorber + tip,
      dTotalDu: span - tw * rodBumpD(z) / tl,
      insertion: 1 - uu, z
    };
  }

  /* ------------------------------------------------------------------ *
   * 4c2. TWO ROD BANKS (CONSOLE-CONTRACT.md §1).
   *
   * `reg`  — an ordinary bank: absorber only, no follower. tip = false.
   * `tipd` — the bank whose rods carry moderator followers. tip = true.
   *
   * Parameters, and how they fall back so that nothing already written
   * changes meaning:
   *
   *   bank reg :  worth  = p.worthReg   ?? p.rhoSpan   (8000 pcm by default)
   *               follower worth = 0 always — this bank has no follower
   *   bank tipd:  worth  = p.worthTip   (0 by default -> THE BANK IS INERT)
   *               follower worth = p.followerWorth (0), length p.followerLen
   *
   * DEFAULT worthTip = 0 AND followerWorth = 0, i.e. the model has no
   * followers at all, exactly as before.
   *
   * How the position is passed (contract §1):
   *   - u is a NUMBER  -> the historical single equivalent bank. It carries
   *     p.rhoSpan and p.tipWorth/p.tipLen and is evaluated by the untouched
   *     rodWorth() above, so every existing trajectory is reproduced bit for
   *     bit. This is the only path the core (SIM) ever uses today.
   *   - u is an OBJECT {reg, tipd} -> the two banks above, summed.
   *
   * The two paths are NOT two spellings of the same thing and the file does
   * not pretend they are: the scalar path is one rod with both features on
   * it, the object path is two rods with one feature each. With the default
   * parameters they agree exactly, because the second bank and both
   * followers are zero.
   * ------------------------------------------------------------------ */

  const ROD_BANK_IDS = ['reg', 'tipd'];

  const bankSpec = (p, id) => (id === 'tipd'
    ? { id: 'tipd', tip: true,
        span: num(p.worthTip, 0),
        tipWorth: num(p.followerWorth, 0),
        tipLen: Math.max(num(p.followerLen, num(p.tipLen, 0.1)), 1e-6) }
    : { id: 'reg', tip: num(p.worthTip, 0) === 0 && num(p.tipWorth, 0) !== 0,
        span: num(p.worthReg, num(p.rhoSpan, 0)),
        /* Пока второго банка нет, «стержень с концевиком» — это ЭТОТ
         * стержень: p.tipWorth должен доехать и до объектного пути, иначе
         * equilibrium() (скалярный путь) и step() (объектный) считают по
         * разным характеристикам. Измеренное расхождение при tipWorth = 600:
         * rho = -466 pcm в момент «равновесия», мощность 0,588 через 300 с. */
        tipWorth: num(p.worthTip, 0) === 0 ? num(p.tipWorth, 0) : 0,
        tipLen: Math.max(num(p.tipLen, 0.1), 1e-6) });

  /* Worth of one named bank at position uu (0 = fully inserted, 1 = out). */
  function rodWorthBank(uu, p, id) {
    const b = bankSpec(p, id);
    const u = clamp01(num(uu, 1));
    const z = (1 - u) / b.tipLen;
    const absorber = b.span * (u - 0.5);
    const tip = b.tipWorth * rodBump(z);
    return { id: b.id, tip: b.tip, u, absorber, tipPcm: tip,
             total: absorber + tip,
             dTotalDu: b.span - b.tipWorth * rodBumpD(z) / b.tipLen,
             span: b.span, tipWorth: b.tipWorth, tipLen: b.tipLen,
             insertion: 1 - u, z };
  }

  /* Which bank the control loop moves. 'reg' unless told otherwise.
   *
   * ВАЖНО: если второй банк инертен (worthTip = 0 и followerWorth = 0), то
   * выбирать его нечего — у него нулевой вес. Прежде p.loopBank = 1 в такой
   * конфигурации отдавал решение equilibrium() банку с нулевым весом, а
   * весь вес rhoSpan оставался на запаркованном reg: измеренная
   * «равновесная» точка выходила +1044 pcm (1,50 beta) на pwr и +1541 pcm
   * (3,56 beta) на fastPu, причём feasible возвращалось true. Один шаг —
   * и PROMPT_CRITICAL на ровном месте. */
  function loopBankId(p) {
    if (!twoBankActive(p)) return 'reg';
    const v = p ? p.loopBank : undefined;
    if (typeof v === 'string' && ROD_BANK_IDS.indexOf(v) >= 0) return v;
    if (typeof v === 'number' && v >= 0 && v < ROD_BANK_IDS.length) return ROD_BANK_IDS[v | 0];
    return 'reg';
  }
  const otherBankId = (p) => (loopBankId(p) === 'reg' ? 'tipd' : 'reg');

  /* Position at which the bank the loop does NOT move is standing. It stands
   * where it was put — the console owns that number; p.uPark is what the
   * headless paths (equilibrium, state0, linearisation) assume. */
  const parkPos = (p) => clamp01(num(p && p.uPark, 1));

  /* Position vector {reg, tipd} out of whatever the caller passed. */
  function bankPositions(u, p) {
    if (u !== null && typeof u === 'object') {
      return { reg: clamp01(num(u.reg, parkPos(p))),
               tipd: clamp01(num(u.tipd, parkPos(p))) };
    }
    const lb = loopBankId(p);
    const out = { reg: parkPos(p), tipd: parkPos(p) };
    out[lb] = clamp01(num(u, 1));
    return out;
  }

  /**
   * Reactivity of the rods, split per bank.
   *
   * u number  -> {legacy:true, ...}: the single equivalent bank, byte-for-byte
   *              the old rodWorth(). rhoRodBank reports it under the bank the
   *              loop drives, and zero under the other one, because that is
   *              what actually happened: there was one bank.
   * u object  -> {legacy:false, ...}: the two banks above.
   */
  const twoBankActive = (p) => num(p.worthTip, 0) !== 0 || num(p.followerWorth, 0) !== 0;

  function rodWorthBanks(u, p) {
    if ((u === null || u === undefined || typeof u !== 'object') && !twoBankActive(p)) {
      /* Single equivalent bank — the historical path, byte for byte. */
      const r = rodWorth(u, p);
      const per = { reg: 0, tipd: 0 };
      per[loopBankId(p)] = r.total;
      return { legacy: true, total: r.total, perBank: per,
               absorber: r.absorber, tip: r.tip, dTotalDu: r.dTotalDu,
               banks: { reg: null, tipd: null }, u: bankPositions(u, p) };
    }
    /* A scalar u WITH a second bank configured is not ambiguous and must not
     * be treated as one merged rod: the loop moves ONE bank, so the scalar is
     * that bank's position and the other stands at p.uPark. Without this a
     * caller that only knows how to pass a number (the core loop does) would
     * silently drop the second bank's worth and leave the core far from the
     * critical position equilibrium() just computed. This branch is
     * unreachable with the default parameters, where the second bank is
     * inert, so nothing that existed before can enter it. */
    const pos = bankPositions(u, p);
    const bReg = rodWorthBank(pos.reg, p, 'reg');
    const bTip = rodWorthBank(pos.tipd, p, 'tipd');
    return { legacy: false,
             scalarAsLoopBank: (u === null || u === undefined || typeof u !== 'object'),
             total: bReg.total + bTip.total,
             perBank: { reg: bReg.total, tipd: bTip.total },
             absorber: bReg.absorber + bTip.absorber,
             tip: bReg.tipPcm + bTip.tipPcm,
             dTotalDu: rodWorthBank(pos[loopBankId(p)], p, loopBankId(p)).dTotalDu,
             banks: { reg: bReg, tipd: bTip }, u: pos };
  }

  /* Contract §1: total rod reactivity in pcm, u number or {reg, tipd}. */
  const rodWorthTotal = (u, p) => rodWorthBanks(u, p).total;

  /**
   * Характеристика стержня целиком: массивы для рисования и разбор горба.
   *
   * uStart — положение, ОТ которого считается выбег (по умолчанию верхнее,
   * u = 1). Выбег меряется относительно этого положения, потому что физически
   * интересен именно прирост реактивности при ВВОДЕ стержня из данной точки.
   */
  function rodTipAnalysis(p, uStart) {
    const u0 = clamp01(uStart == null ? 1 : uStart);
    const span = num(p.rhoSpan, 0);
    const tw = num(p.tipWorth, 0);
    const tl = Math.max(num(p.tipLen, 0.1), 1e-6);
    const base = rodWorth(u0, p).total;
    const exc = (u) => rodWorth(u, p).total - base;
    /* грубый скан + золотое сечение: форма горба может быть любой */
    const N = 4000;
    let uBest = u0, eBest = 0;
    for (let k = 0; k <= N; k++) {
      const u = u0 * k / N, e = exc(u);
      if (e > eBest) { eBest = e; uBest = u; }
    }
    if (eBest > 0) {
      const dU = u0 / N;
      let a = Math.max(0, uBest - dU), b = Math.min(u0, uBest + dU);
      const gr = (Math.sqrt(5) - 1) / 2;
      let c = b - gr * (b - a), dd = a + gr * (b - a);
      for (let k = 0; k < 200; k++) {
        if (exc(c) > exc(dd)) { b = dd; dd = c; c = b - gr * (b - a); }
        else { a = c; c = dd; dd = a + gr * (b - a); }
      }
      uBest = 0.5 * (a + b); eBest = exc(uBest);
    }
    /* Самое НИЖНЕЕ положение, из которого ввод стержня ещё даёт выбег:
     * граница области dρ/du < 0. Ниже неё горб уже позади, и ввод чисто
     * отрицателен. Число нужно, чтобы не выдавать желаемое за действительное:
     * «стержни выведены выше» само по себе ничего не значит, пока не сказано,
     * НАСКОЛЬКО выше. */
    let uMinForExc = null;
    if (tw !== 0) {
      const neg = (u) => rodWorth(u, p).dTotalDu < 0;
      if (neg(1)) {
        let lo = 0, hi = 1;                      // neg(0) ложно, neg(1) истинно
        if (!neg(0)) {
          for (let k = 0; k < 200; k++) {
            const m = 0.5 * (lo + hi);
            if (neg(m)) hi = m; else lo = m;
          }
          uMinForExc = 0.5 * (lo + hi);
        } else uMinForExc = 0;
      }
    }

    return {
      /* немонотонность: dρ/du < 0 где-то на ходу (иначе стержень штатный) */
      nonMonotonic: eBest > 0,
      uMinForExcursion: uMinForExc,
      strokeWindowForExcursion: uMinForExc === null ? 0 : 1 - uMinForExc,
      /* аналитическое условие немонотонности при u = 1 */
      slopeAtTop: span - tw * Math.E / tl,
      tipWorthForNonMonotonic: span * tl / Math.E,
      uStart: u0,
      uPeak: uBest,
      insertionAtPeak: u0 - uBest,
      excursionPcm: eBest,
      /* beta_eff of the CURRENT fuel, not the hardwired U-235 constant: on
       * Pu-239 the two differ by a third, and a dollar is the only unit in
       * which a rod excursion can be judged. */
      excursionDollar: eBest * PCM / betaEffOf(p),
      rhoAtStartPcm: base,
      rhoAtPeakPcm: rodWorth(uBest, p).total,
      absorberAtPeakPcm: rodWorth(uBest, p).absorber - rodWorth(u0, p).absorber,
      tipAtPeakPcm: rodWorth(uBest, p).tip - rodWorth(u0, p).tip
    };
  }

  /* Кривая для интерфейса: реактивность стержней от положения, вклад
   * поглотителя и вклад концевика — раздельно. */
  function rodWorthCurve(p, N) {
    const n = Math.max(2, N || 201);
    const u = [], absorber = [], tip = [], total = [], slope = [];
    for (let k = 0; k < n; k++) {
      const uu = k / (n - 1), r = rodWorth(uu, p);
      u.push(uu); absorber.push(r.absorber); tip.push(r.tip);
      total.push(r.total); slope.push(r.dTotalDu);
    }
    return { u, absorber, tip, total, slope, analysis: rodTipAnalysis(p, 1) };
  }

  /* The same bump analysis for one NAMED bank. Identical algebra to
   * rodTipAnalysis(), applied to bankSpec(p, id) instead of the legacy
   * single equivalent bank. */
  function rodBankAnalysis(p, id, uStart) {
    const b = bankSpec(p, id);
    const u0 = clamp01(uStart == null ? 1 : uStart);
    const base = rodWorthBank(u0, p, id).total;
    const exc = (u) => rodWorthBank(u, p, id).total - base;
    const N = 4000;
    let uBest = u0, eBest = 0;
    for (let k = 0; k <= N; k++) {
      const u = u0 * k / N, e = exc(u);
      if (e > eBest) { eBest = e; uBest = u; }
    }
    if (eBest > 0) {
      const dU = u0 / N;
      let a = Math.max(0, uBest - dU), bb = Math.min(u0, uBest + dU);
      const gr = (Math.sqrt(5) - 1) / 2;
      let c = bb - gr * (bb - a), dd = a + gr * (bb - a);
      for (let k = 0; k < 200; k++) {
        if (exc(c) > exc(dd)) { bb = dd; dd = c; c = bb - gr * (bb - a); }
        else { a = c; c = dd; dd = a + gr * (bb - a); }
      }
      uBest = 0.5 * (a + bb); eBest = exc(uBest);
    }
    let uMinForExc = null;
    if (b.tipWorth !== 0) {
      const neg = (u) => rodWorthBank(u, p, id).dTotalDu < 0;
      if (neg(1)) {
        let lo = 0, hi = 1;
        if (!neg(0)) {
          for (let k = 0; k < 200; k++) {
            const m = 0.5 * (lo + hi);
            if (neg(m)) hi = m; else lo = m;
          }
          uMinForExc = 0.5 * (lo + hi);
        } else uMinForExc = 0;
      }
    }
    return {
      bank: b.id, tip: b.tip, span: b.span,
      tipWorth: b.tipWorth, tipLen: b.tipLen,
      nonMonotonic: eBest > 0,
      uMinForExcursion: uMinForExc,
      strokeWindowForExcursion: uMinForExc === null ? 0 : 1 - uMinForExc,
      slopeAtTop: b.span - b.tipWorth * Math.E / b.tipLen,
      tipWorthForNonMonotonic: b.span * b.tipLen / Math.E,
      uStart: u0, uPeak: uBest, insertionAtPeak: u0 - uBest,
      excursionPcm: eBest,
      excursionDollar: eBest * PCM / betaEffOf(p),
      rhoAtStartPcm: base,
      rhoAtPeakPcm: rodWorthBank(uBest, p, id).total
    };
  }

  /* Curve of one bank, for the interface. */
  function rodWorthCurveBank(p, id, N) {
    const n = Math.max(2, N || 201);
    const u = [], absorber = [], tip = [], total = [], slope = [];
    for (let k = 0; k < n; k++) {
      const uu = k / (n - 1), r = rodWorthBank(uu, p, id);
      u.push(uu); absorber.push(r.absorber); tip.push(r.tipPcm);
      total.push(r.total); slope.push(r.dTotalDu);
    }
    return { bank: id, u, absorber, tip, total, slope,
             analysis: rodBankAnalysis(p, id, 1) };
  }

  /* ------------------------------------------------------------------ *
   * 5. Constraint violations — the model refuses rather than lying
   * ------------------------------------------------------------------ */

  /* Полоса, в которой линейный температурный коэффициент теплоносителя вообще

  function violation(v, extra) {
    const e = new Error('PLANT_REACTOR:' + v.code);

   * x[11] carries the TRANSPORT LAG of the coolant through the core, see §4b.
   * With p.tauOut = 0 it is slaved to the algebraic closure 2 T_c - T_in and
   * every number this file produced before is reproduced exactly; with the
   * default (2 tau_C) an inlet step reaches the outlet in about a residence
   * time instead of instantaneously and with the wrong sign.
   * Indices 0..10 are unchanged, the new state is appended, so anything that
   * addressed n, C_i, I, X, T_f or T_c by index keeps working.
   * ------------------------------------------------------------------ */
  const iN = 0, iC = 1, iI = 7, iX = 8, iTf = 9, iTc = 10, iTo = 11, NSTATE = 12;

  /* Reactivity split, all in pcm. */
  function rhoCtrlPcm(u, p) { return rodWorthTotal(u, p); }
  function rhoXePcm(X)      { return -SIG_AX * X / (NU * SIG_F) * 1e5; }
  function rhoDopPcm(Tf, p) { return p.alphaD * (Tf - p.Tref); }

  /* Coolant / moderator temperature coefficient. Acts on the CORE-AVERAGE
   * coolant temperature T_c, referred to p.TrefC (falling back to the inlet
   * temperature). alpha_C = 0 by default, so this term is identically zero
   * unless a preset or the user switches it on. */
  function rhoCoolPcm(Tc, p) {
    const a = num(p.alphaC, 0);
    if (a === 0) return 0;
    return a * (Tc - num(p.TrefC, num(p.Tin0, 290)));
  }

  /* Void (steam) coefficient. alpha_void is in pcm PER UNIT VOID FRACTION,
   * i.e. per 100 % void; its SIGN is a free parameter. Zero by default and
   * zero whenever the coolant is not boiling. */
  function rhoVoidPcmFromBoil(bs, p) {
    const a = num(p.alphaVoid, 0);
    if (a === 0 || !bs.boiling) return 0;
    return a * bs.voidFrac;
  }

  function rhoFeedbackPcm(x, p, io) {
    const rd = rhoDopPcm(x[iTf], p);
    const ac = num(p.alphaC, 0), av = num(p.alphaVoid, 0);
    if (ac === 0 && av === 0) return rd;             // historical fast path
    const bs = coreState(x, p, io);
    return rd + rhoCoolPcm(x[iTc], p) + rhoVoidPcmFromBoil(bs, p);
  }

  /* io is optional: without it the coolant/void terms fall back to the
   * parameter inlet temperature and flow, which is what every historical
   * caller meant. */
  function rhoTotalPcm(x, u, p, io) {
    const ac = num(p.alphaC, 0), av = num(p.alphaVoid, 0);
    if (ac === 0 && av === 0)
      return rhoCtrlPcm(u, p) + rhoXePcm(x[iX]) + rhoDopPcm(x[iTf], p);
    return rhoCtrlPcm(u, p) + rhoXePcm(x[iX])
         + rhoFeedbackPcm(x, p, io || inputs(null, p));
  }

  /**
   * d(rho)/dt в pcm/с по тем каналам, которые ЖИВУТ внутри быстрого подшага.
   *
   * Стержни за подшаг не двигаются, а ксенон в схеме Странга заморожен на всё
   * время быстрого блока — их вклад в производную внутри подшага равен нулю
   * ТОЧНО, а не приближённо. Остаются три температурных канала.
   *
   * Нужна не точность, а масштаб: величина идёт только в ограничитель шага.
   * Поэтому производная паровой доли берётся односторонней разностью по
   * T_out — дешевле аналитики и достаточно для оценки.
   */
  const VOID_EPS = 1e-3;                       // K, для разностной производной
  function rhoRatePcm(x, p, io, ndot, th, u) {
    const aD = num(p.alphaD, 0), aC = num(p.alphaC, 0), aV = num(p.alphaVoid, 0);
    const dTfd = (-(x[iTf] - x[iTc]) + th.a * x[iN]) / th.tf;
    let r = aD * dTfd;
    if (aC === 0 && aV === 0) return r;
    const dTcd = (th.g * (x[iTf] - x[iTc]) - io.flow * (x[iTc] - io.Tin)) / th.tc;
    r += aC * dTcd;
    if (aV !== 0) {
      const tau = tauOutOf(p);
      const To = outlet1ph(x, p, io);
      const dTod = tau > 0 ? ((2 * x[iTc] - io.Tin) - x[iTo]) / tau : 2 * dTcd;
      const v0 = boilState(p, To, io.Tin).voidFrac;
      const v1 = boilState(p, To + VOID_EPS, io.Tin).voidFrac;
      r += aV * ((v1 - v0) / VOID_EPS) * dTod;
    }
    return r;
  }

  /**
   * Steady state for a requested relative power w (%).
   *   d    — возмущение: число (его смысл задаёт p.distVar) или {Tin, flow}.
   *   flow — необязательное явное переопределение расхода.
   * Третий аргумент по-прежнему можно передавать как температуру на входе
   * (при distVar по умолчанию), поэтому все прежние вызовы работают как были.
   */
  function equilibrium(p, w, d, flow) {
    const io = inputs(d, p);
    if (Number.isFinite(flow)) io.flow = clampFlow(flow);
    const kin  = kinOf(p);
    const n0   = w / 100;
    const phi0 = p.phiNom * n0;
    const Ieq  = GAM_I * SIG_F * phi0 / LAM_I;
    const Xeq  = (GAM_X + GAM_I) * SIG_F * phi0 / (LAM_X + SIG_AX * phi0);
    const T    = thermalSteady(p, n0, io);
    const bs   = boilState(p, T.Tout, io.Tin);
    const rXe  = rhoXePcm(Xeq);
    const rD   = rhoDopPcm(T.Tf, p);
    const rC   = rhoCoolPcm(T.Tc, p);
    const rV   = rhoVoidPcmFromBoil(bs, p);
    /* Rod reactivity the equilibrium demands. With two banks the bank the
     * loop does NOT move stands at p.uPark and takes its share first; the
     * loop bank supplies the remainder. With the default parameters the
     * second bank is inert (worth 0, follower 0) and this reduces to the
     * historical single-bank expression, bit for bit. */
    const demand = -(rXe + rD + rC + rV);
    const twoBank = num(p.worthTip, 0) !== 0 || num(p.followerWorth, 0) !== 0;
    let u0, uBanks;
    if (!twoBank) {
      u0 = rodPosFor(demand, p);
      uBanks = bankPositions(u0, p);
    } else {
      const lb = loopBankId(p), ob = otherBankId(p);
      const uPark = parkPos(p);
      const rhoOther = rodWorthBank(uPark, p, ob).total;
      u0 = rodPosFor(demand - rhoOther, p, lb);
      uBanks = { reg: uPark, tipd: uPark };
      uBanks[lb] = u0;
    }
    const x    = new Float64Array(NSTATE);
    x[iN] = n0;
    for (let i = 0; i < 6; i++) x[iC + i] = kin.beta[i] * n0 / (kin.Lambda * kin.lam[i]);
    x[iI] = Ieq; x[iX] = Xeq; x[iTf] = T.Tf; x[iTc] = T.Tc;
    x[iTo] = T.Tout;
    return {
      x, u0, uBanks, n0, phi0, Ieq, Xeq, Tf: T.Tf, Tc: T.Tc, Tout: bs.Tout,
      ToutSinglePhase: T.Tout,
      Tin: io.Tin, flow: io.flow,
      rhoXe: rXe, rhoDoppler: rD, rhoCoolant: rC, rhoVoid: rV,
      rhoCtrl: demand,
      boiling: bs.boiling, voidFrac: bs.voidFrac, quality: bs.quality,
      betaEff: kin.betaTot, Lambda: kin.Lambda,
      feasible: (u0 >= 0 && u0 <= 1),
      /* how much rod worth the equilibrium consumes, pcm */
      rodDemandPcm: demand
    };
  }

  /**
   * Положение стержня, дающее заданную реактивность.
   * Без концевика это линейная обратная функция (ровно как было:
   * u = 0.5 + rho/rhoSpan). С концевиком характеристика немонотонна, поэтому
   * корней может быть несколько — берётся САМЫЙ ГЛУБОКИЙ (наименьший u), то
   * есть та ветвь, где поглотитель уже вошёл в зону и характеристика снова
   * монотонна. Это и есть рабочая ветвь регулятора; ветвь «на горбе»
   * неустойчива по положению и выбирать её молча нельзя.
   */
  /* Deepest (smallest u) root of a non-monotonic rod characteristic —
   * the same scan-then-bisect used by the legacy path below, factored out so
   * the per-bank inverse behaves identically. */
  function bisectDeepest(f, rhoPcm, span) {
    const N = 2000;
    let uPrev = 0, fPrev = f(0);
    for (let k = 1; k <= N; k++) {
      const u = k / N, fu = f(u);
      if (fu === 0) return u;
      if ((fu > 0) !== (fPrev > 0)) {
        let a = uPrev, b = u;
        const sa = fPrev > 0;
        for (let j = 0; j < 80; j++) {
          const m = 0.5 * (a + b);
          if ((f(m) > 0) === sa) a = m; else b = m;
        }
        return 0.5 * (a + b);
      }
      uPrev = u; fPrev = fu;
    }
    return 0.5 + rhoPcm / span;
  }

  function rodPosFor(rhoPcm, p, bank) {
    /* bank (optional) selects one of the two banks. Without it: the historical
     * single equivalent bank while the second bank is inert (unchanged, bit for
     * bit), and otherwise the LOOP bank, with the other bank standing at
     * p.uPark and its worth already subtracted — the same convention as
     * equilibrium(), so the two never disagree. */
    if (!bank && twoBankActive(p)) {
      const lb = loopBankId(p);
      return rodPosFor(rhoPcm - rodWorthBank(parkPos(p), p, otherBankId(p)).total, p, lb);
    }
    if (bank) {
      const b = bankSpec(p, bank);
      /* Банк без веса не может дать НИКАКОЙ реактивности: деление на span
       * здесь возвращало Infinity/NaN, которое равновесие потом молча
       * зажимало в u = 1 и выдавало ядро на +2500 pcm. */
      if (!(b.span > 0)) return NaN;
      if (b.tipWorth === 0) return clamp01(0.5 + rhoPcm / b.span);
      const g = (u) => rodWorthBank(u, p, bank).total - rhoPcm;
      return bisectDeepest(g, rhoPcm, b.span);
    }
    const span = num(p.rhoSpan, 0);
    if (!(span > 0)) return NaN;
    if (num(p.tipWorth, 0) === 0) return 0.5 + rhoPcm / span;
    const f = (u) => rodWorth(u, p).total - rhoPcm;
    const N = 2000;
    let uPrev = 0, fPrev = f(0);
    for (let k = 1; k <= N; k++) {
      const u = k / N, fu = f(u);
      if (fu === 0) return u;
      if ((fu > 0) !== (fPrev > 0)) {
        let a = uPrev, b = u;
        const sa = fPrev > 0;
        for (let j = 0; j < 80; j++) {
          const m = 0.5 * (a + b);
          if ((f(m) > 0) === sa) a = m; else b = m;
        }
        return 0.5 * (a + b);
      }
      uPrev = u; fPrev = fu;
    }
    return 0.5 + rhoPcm / span;          // корня нет — линейная оценка
  }

  /* ------------------------------------------------------------------ *
   * 7. Integration
   *
   * Λ ≈ 1e-4 s, xenon ≈ 1e5 s → nine decades of time-scale spread. A single
   * explicit RK4 on the full 10-state system needs dt ≲ Λ/10 ≈ 1e-5 s for
   * stability, i.e. ≈ 2.6e10 steps to cover the 72 h xenon transient. That is
   * not an option, so the system is split:
   *
   *   FAST  {n, C_1..C_6, T_f}  — TR-BDF2 (second order, L-stable) for n and
   *         C_i, two implicit solves sharing one matrix; T_f advanced by
   *         its analytic exponential relaxation. Both are unconditionally
   *         stable and both reproduce a steady state EXACTLY (see the algebra
   *         note in `integrator.notes`), so a stationary reactor does not drift.
   *         Sub-step is rate-controlled: dt = clamp(RATE_TOL/|d ln n/dt|).
   *
   *   SLOW  {I, X}  — classical RK4 with the macro step, exactly as
   *         xenon.html lines 391-400, but now WITH the flux terms restored.
   *
   *   Coupling: Strang splitting, slow(h/2) → fast(h) → slow(h/2), so the
   *   splitting error is O(h^2) rather than O(h).
   * ------------------------------------------------------------------ */

  /* RATE_TOL fixes the accuracy of the growth rate. Backward Euler reproduced an
   * exponential mode with omega_eff = -ln(1-omega*dt)/dt = omega(1 + omega*dt/2 + ...),
   * i.e. a relative period error of RATE_TOL/2 — 0.1 % at 0.002, which after 17
   * e-folds is a 1.6 % amplitude error. The block now runs TR-BDF2, whose period
   * error is O(RATE_TOL^2): measured 1.6e-7 relative at 0.1 $, 0.3 $ and 0.5 $.
   * The tolerance is kept at 0.002 because the same number also bounds how far the
   * frozen feedback inside a sub-step may drift. */
  const RATE_TOL   = 0.002;   // max |d ln n| per fast sub-step
  /* Второй допуск шага: сколько долей beta_eff реактивности разрешено пройти
   * за один подшаг. 0,02 beta ≈ 13 pcm на U-235 — достаточно мелко, чтобы
   * замороженная обратная связь внутри подшага не искажала траекторию
   * (измерено: ошибка ступени -40 K падает с -64,6 %/+31,4 % до -0,06 %),
   * и достаточно крупно, чтобы в стационаре ограничитель вообще не включался
   * и ксеноновые задачи считались с прежней скоростью. */
  const RHO_TOL    = 0.02;    // max |d rho| per fast sub-step, in beta_eff
  const MAX_SUBST  = 20000;   // sub-step budget inside one macro step
  const GROW_CAP   = 3.0;     // max growth of dt between two sub-steps

  /* Floor of the neutron population, relative to nominal.
   *
   * n is clamped here and never allowed below. Without the clamp a scram
   * walks n down through the denormals into 0 (and, with the xenon burning
   * back off afterwards, into meaningless arithmetic).
   *
   * Sitting ON the floor is a legitimate model state — "the power is zero" is
   * what a scrammed or xenon-blocked reactor does, and both the xenon-pit and
   * the xenon-dead-time scenarios live there for hours. What is NOT physics is
   * what comes after: with reactivity back above zero the model multiplies the
   * floor value back up, and that restart is an artefact of the floor, not a
   * calculation. probe().atModelFloor flags it so the interface can say so.
   *
   * n <= 0, on the other hand, is not a small number but a degenerate one:
   * nothing multiplies out of an exactly empty core, and point kinetics has NO
   * external neutron source (declared limit (4)) to seed it. That case — the
   * "setpoint 0 %, then step up" start-up — is refused outright with
   * VIOLATIONS.subcritical. It used to be refused with the prompt-criticality
   * text, which says the exact opposite of what is happening. */
  const N_FLOOR = 1e-12;

  /* Верхняя граница «мощность считается фикцией».
   *
   * probe().floorRestartFiction помечает участок, где модель РАЗМНОЖАЕТ
   * отсечку вместо того, чтобы считать. Условие «n ровно на отсечке И rho >= 0»
   * ловит только один момент пересечения: при rho чуть выше нуля n растёт с
   * периодом сотен секунд, и уже через один макрошаг n отходит от отсечки на
   * 1e-4 относительных — то есть попадёт ли проба в это окно, решает сетка
   * выборки, а не физика. Признак от этого становится случайным.
   *
   * Поэтому фикцией считается весь подъём, пока n не поднялось на два порядка
   * над отсечкой. Обоснование не численное, а физическое: при n < 1e-10 от
   * номинала цепная реакция в реальной зоне определяется внешним источником и
   * подкритическим размножением (пусковой диапазон), а этого в модели нет —
   * ограничение (4). Условие строго ШИРЕ прежнего: всё, что помечалось
   * раньше, помечается и теперь. */
  const N_SOURCE_RANGE = 1e-10;

  /* Максимум делений шага в fastStep, если знаменатель дискретизации не
   * положителен. Каждое деление вдвое; 60 делений — заведомо больше, чем
   * когда-либо нужно (denom -> 1 при dt -> 0). */
  const MAX_HALVINGS = 60;

  /**
   * TR-BDF2 update of {n, C_i} plus analytic update of T_f and T_c.
   *
   * ВОЗВРАЩАЕТ true/false, а НЕ бросает исключение.
   *
   * denom = 1 − dt(ρ−β)/Λ − dt·B меняет знак не при ρ ≥ β, а при слишком
   * большом dt: при ρ = 400 pcm достаточно dt = 3,12 с, при 600 pcm — 0,41 с,
   * тогда как dtCap = min(h, τ_f/4) = 1,5 с. Раньше отсюда летел
   * PROMPT_CRITICAL — отказ по чисто дискретизационной причине, да ещё и с
   * текстом, описывающим разгон, в ситуации, когда мощность ОБРУШИВАЛАСЬ.
   * Физическая проверка ρ ≥ β живёт в macroStep, а здесь остаётся только
   * сигнал «шаг велик, дроби».
   *
   * Состояние не трогается, пока знаменатель не проверен, поэтому неудачную
   * попытку можно просто повторить с меньшим dt.
   */
  /* One implicit solve of (I - c*A)y = b for the {n, C_i} block, A being the point-
   * kinetics matrix with rho frozen over the sub-step. The precursors are eliminated
   * analytically, exactly as the single backward-Euler solve did: with c = dt and
   * b = the current state this IS that solve, term for term. Returns false when the
   * implicit denominator is not positive, i.e. the step is too long — the caller
   * halves it. Nothing is written into x here. */
  function keSolve(bn, bC, c, rho, Lam, BE, LA, BT, out) {
    let A = 0, B = 0;
    for (let i = 0; i < 6; i++) {
      const den = 1 + c * LA[i];
      A += LA[i] * bC[i] / den;
      B += LA[i] * c * (BE[i] / Lam) / den;
    }
    const denom = 1 - c * ((rho - BT) / Lam) - c * B;
    if (!(denom > 0)) return false;
    const n = (bn + c * A) / denom;
    if (!Number.isFinite(n) || !(n > 0)) return false;
    out[0] = n;
    for (let i = 0; i < 6; i++) {
      const v = (bC[i] + c * (BE[i] / Lam) * n) / (1 + c * LA[i]);
      out[1 + i] = v > 0 ? v : 0;
    }
    return true;
  }

  /* TR-BDF2 (Hosea & Shampine 1996): trapezoid to t+gamma*dt, then BDF2 to t+dt.
   * Second order, L-stable, and — because gamma = 2-sqrt(2) makes the two stage
   * coefficients equal — both stages share the SAME matrix, so the cost is two
   * solves instead of one. Backward Euler is only first order: it reproduces an
   * exponential mode with omega_eff = -ln(1-omega*dt)/dt = omega(1 + omega*dt/2 + ...),
   * so the growth-rate error is RATE_TOL/2 per sub-step and the AMPLITUDE error
   * accumulates as (d ln n)*RATE_TOL/2 — measured +1.6 % after 17 e-folds
   * (rho = 0.3 $, 300 s) and +2.5 % after 25, always high. The same measurement with
   * TR-BDF2 is +2e-5. Both stages preserve an exact equilibrium term for term
   * (A*y = 0 makes every stage right-hand side equal to y), so a stationary reactor
   * still does not drift. */
  const TRBDF2_C  = 1 - Math.SQRT1_2;                 // gamma/2 = (1-gamma)/(2-gamma)
  const TRBDF2_W1 = 1 / ((2 - Math.SQRT2) * Math.SQRT2);
  const TRBDF2_W0 = TRBDF2_W1 - 1;                    // w1 - w0 = 1: consistency
  const _keY1 = new Float64Array(7), _keY2 = new Float64Array(7);
  const _keB  = new Float64Array(6), _keBn = [0];

  function fastStep(x, dt, rhoPcm, p, io, kin) {
    const BE = kin ? kin.beta : BETA, LA = kin ? kin.lam : LAM;
    const BT = kin ? kin.betaTot : BETA_TOT;
    const rho = rhoPcm * PCM;
    const Lam = kin ? kin.Lambda : p.Lambda;
    const n0 = x[iN];
    const c = TRBDF2_C * dt;

    /* stage 1 — trapezoid: (I - c*A) y1 = y0 + c*A*y0 */
    let sumLC = 0;
    for (let i = 0; i < 6; i++) sumLC += LA[i] * x[iC + i];
    let bn = n0 + c * (((rho - BT) / Lam) * n0 + sumLC);
    for (let i = 0; i < 6; i++) _keB[i] = x[iC + i] + c * ((BE[i] / Lam) * n0 - LA[i] * x[iC + i]);
    let ok = bn > 0 && keSolve(bn, _keB, c, rho, Lam, BE, LA, BT, _keY1);

    /* stage 2 — BDF2 on (y0, y1): (I - c*A) y2 = w1*y1 - w0*y0, same matrix */
    if (ok) {
      bn = TRBDF2_W1 * _keY1[0] - TRBDF2_W0 * n0;
      for (let i = 0; i < 6; i++) _keB[i] = TRBDF2_W1 * _keY1[1 + i] - TRBDF2_W0 * x[iC + i];
      ok = bn > 0 && keSolve(bn, _keB, c, rho, Lam, BE, LA, BT, _keY2);
    }
    if (!ok) {
      /* A stage right-hand side went non-positive. That needs a sub-step far longer
       * than the local time scale, which the rate control only permits while n sits on
       * the model floor (there ln n does not move, so the control is switched off).
       * Fall back to the plain backward-Euler step: unconditionally positive, and on a
       * floored core the extra order buys nothing. */
      for (let i = 0; i < 6; i++) _keB[i] = x[iC + i];
      if (!keSolve(n0, _keB, dt, rho, Lam, BE, LA, BT, _keY2)) return false;
    }

    let nNew = _keY2[0];
    if (!Number.isFinite(nNew)) return false;
    if (nNew > N_FLOOR) {
      for (let i = 0; i < 6; i++) x[iC + i] = _keY2[1 + i];
    } else {
      nNew = N_FLOOR;                               // нижняя отсечка, без денормалей
      for (let i = 0; i < 6; i++) {
        const v = (x[iC + i] + dt * (BE[i] / Lam) * nNew) / (1 + dt * LA[i]);
        x[iC + i] = v > 0 ? v : 0;
      }
    }
    x[iN] = nNew;
    /* two-node thermal block (fuel + coolant), exact matrix exponential over
     * the sub-step — see §4b. Unconditionally stable, so the coolant node does NOT
     * shrink the fast sub-step. The heat source is the MEAN power over the sub-step,
     * (n0+n1)/2: second order in the coupling like the rest of the step, and still
     * exactly stationary when n0 = n1. */
    thermalStep(x, dt, 0.5 * (n0 + nNew), p, io);
    return true;
  }

  /* RK4 on {I, X} with a constant flux over the interval — the xenon.html
   * integrator with the phi-dependent terms put back in. */
  function slowStep(x, dt, phi, p) {
    const dI = (I)    => GAM_I * SIG_F * phi - LAM_I * I;
    const dX = (I, X) => GAM_X * SIG_F * phi + LAM_I * I
                       - LAM_X * X - SIG_AX * phi * X;
    const I0 = x[iI], X0 = x[iX];
    const a1 = dI(I0),                 b1 = dX(I0, X0);
    const a2 = dI(I0 + 0.5 * dt * a1), b2 = dX(I0 + 0.5 * dt * a1, X0 + 0.5 * dt * b1);
    const a3 = dI(I0 + 0.5 * dt * a2), b3 = dX(I0 + 0.5 * dt * a2, X0 + 0.5 * dt * b2);
    const a4 = dI(I0 + dt * a3),       b4 = dX(I0 + dt * a3,       X0 + dt * b3);
    x[iI] = I0 + dt / 6 * (a1 + 2 * a2 + 2 * a3 + a4);
    x[iX] = X0 + dt / 6 * (b1 + 2 * b2 + 2 * b3 + b4);
    if (x[iI] < 0) x[iI] = 0;
    if (x[iX] < 0) x[iX] = 0;
  }

  /* Largest macro step this parameter set tolerates. */
  function hMax(p) { return Math.min(5, 0.5 * p.tauF); }

  /* Advance the whole state by h. Subdivides h internally if it is too big.
   * `d` may be the scalar disturbance (its meaning set by p.distVar) or an
   * explicit {Tin, flow} pair — see inputs(). */
  function step(t, x, u, d, p, h, out) {
    const y = (out && out !== x) ? out : new Float64Array(NSTATE);
    if (y !== x) y.set(x);
    const io = inputs(d, p);
    const kin = kinOf(p);
    const hm = hMax(p);
    let left = h;
    while (left > 1e-15) {
      const hs = Math.min(hm, left);
      macroStep(y, u, io, p, hs, kin);
      left -= hs;
    }
    return y;
  }

  /* Мощность лежит на нижней отсечке модели: всё, что модель покажет
     дальше при неотрицательной реактивности, — артефакт отсечки. */
  const atModelFloor = (x) => x[iN] <= N_FLOOR * (1 + 1e-9);

  function macroStep(x, u, io, p, h, kin0) {
    const kin = kin0 || kinOf(p);
    const LA = kin.lam, BT = kin.betaTot, LamE = kin.Lambda;
    /* Пустая активная зона. Умножать нечего, внешнего источника в точечной
     * кинетике нет — считать нечего. Проверяем ДО работы, чтобы «уставка
     * 0 % → ступень на 1 %» отвечала честным текстом сразу, а не через
     * сотни шагов и не текстом про разгон на одних мгновенных нейтронах. */
    if (!(x[iN] > 0)) {
      throw violation(VIOLATIONS.subcritical, { n: x[iN], rhoPcm: rhoTotalPcm(x, u, p, io) });
    }

    /* --- Strang: slow half step at the entry flux ------------------- */
    slowStep(x, 0.5 * h, p.phiNom * x[iN], p);

    /* --- fast subsystem over the full macro step, X frozen ---------- */
    const th0 = thermal(p, io.flow);
    const aC = num(p.alphaC, 0);
    /* ПОЛОСА ЗАДАЁТСЯ В РЕАКТИВНОСТИ, А НЕ В КЕЛЬВИНАХ.
     *
     * Обоснование выше — про pcm: «120 K при alpha_C = -25 дают 3000 pcm,
     * верх правдоподобного». Но записана она была как 120 кельвин и в этом
     * виде попадала на пресеты, у которых alpha_C другой. На быстром Pu
     * alpha_C = -0,5 pcm/K, то есть у края полосы теплоноситель успевал
     * внести 60 pcm — в пятьдесят раз меньше того, что ловилось. А перепад
     * dTcool у этого пресета 150 K вместо 30, поэтому штатное снижение
     * нагрузки до 50 % выводило T_c на 125 K от опорной точки, и модель
     * отказывалась работать на СТАЦИОНАРНОМ режиме с отрицательной
     * реактивностью, неподвижными стержнями и запасом до мгновенной
     * критичности БОЛЬШИМ, чем в номинале. Ниже 55 % мощности пресет был
     * просто недостижим.
     *
     * Теперь ловится ровно то, ради чего предохранитель ставился: вклад
     * теплоносителя больше RHO_C_BAND_PCM. Для pwr это те же 120 K бит в
     * бит (3000/25), для остальных — сколько нужно им. */
    const band = Number.isFinite(p.alphaCSpan) && p.alphaCSpan > 0
               ? p.alphaCSpan
               : Math.max(RHO_C_BAND_PCM / Math.max(Math.abs(aC), 1e-9), 1);
    let done = 0, dt = 0, k = 0;
    while (done < h * (1 - 1e-12)) {
      if (++k > MAX_SUBST) throw violation(VIOLATIONS.stepBudget, { h });
      const rhoPcm = rhoTotalPcm(x, u, p, io);
      /* ЕДИНСТВЕННОЕ физическое условие мгновенной критичности. Порог —
       * beta_eff ТЕКУЩЕГО топлива: на чистом Pu-239 он втрое ниже, и это
       * ровно то, что владелец просил показать. */
      if (rhoPcm * PCM >= BT) throw violation(VIOLATIONS.promptCritical, { rhoPcm, betaEff: BT });
      /* Линейный коэффициент по теплоносителю за пределами своей полосы. */
      if (aC !== 0) {
        const dTc = x[iTc] - num(p.TrefC, num(p.Tin0, 290));
        if (Math.abs(dTc) > band) {
          throw violation(VIOLATIONS.coolantOutOfBand,
                          { Tc: x[iTc], TrefC: num(p.TrefC, num(p.Tin0, 290)),
                            band, rhoCoolPcm: rhoCoolPcm(x[iTc], p) });
        }
      }
      /* Кипение за границами двухфазного замыкания — свой отказ, не общий. */
      if (boilCheck(x, p, io)) {
        const bs = coreState(x, p, io);
        throw violation(VIOLATIONS.boilingBeyondModel,
                        { voidFrac: bs.voidFrac, quality: bs.quality, Tout1ph: bs.Tout1ph });
      }

      /* rate-controlled sub-step: |d ln n / dt| * dt <= RATE_TOL
       *
       * Пока n лежит на нижней отсечке, ln n не меняется по определению, и
       * управлять шагом по его скорости бессмысленно: relRate улетает в
       * бесконечность, шаг падает до Λ/10 и бюджет подшагов сгорает на
       * заведомо мёртвой (глубоко подкритической) зоне. Там шаг ограничивает
       * только dtCap. */
      const atFloor = x[iN] <= N_FLOOR * (1 + 1e-9);
      let sumLC = 0;
      for (let i = 0; i < 6; i++) sumLC += LA[i] * x[iC + i];
      const ndot = ((rhoPcm * PCM - BT) / LamE) * x[iN] + sumLC;
      const relRate = Math.abs(ndot) / Math.max(x[iN], 1e-300);
      const dtWant = (!atFloor && relRate > 0) ? RATE_TOL / relRate : Infinity;
      /* ВТОРОЙ ограничитель подшага: скорость РЕАКТИВНОСТИ.
       *
       * Управление шагом по одной лишь |d ln n/dt| слепо ровно там, где это
       * дороже всего: в равновесии ndot = 0 ТОЧНО, поэтому dtWant = Infinity,
       * шаг берётся максимальный (0,25 tau_f = 1,5 с), а обратные связи внутри
       * подшага ЗАМОРОЖЕНЫ. Первые 1,5 с любого возмущения считались при
       * реактивности, какой она была ДО возмущения. Измерено на пресете pwr,
       * ступень входной температуры -40 K: истинное n(1,5 с) = 2,824, модель
       * показывала 1,000000, а к t = 2 с ошибка меняла знак и доходила до
       * +31 %. При -60 K дискретная траектория забиралась на rho = 790 pcm
       * (1,14 beta) там, где непрерывная не проходит и 0,66 beta, и модель
       * бросала PROMPT_CRITICAL — отказ, целиком порождённый сеткой.
       *
       * Лечится не уменьшением шага везде (это стоило бы времени на xenon-
       * задачах), а вторым условием: за подшаг реактивность не должна
       * измениться больше чем на RHO_TOL долей beta_eff. Производная берётся
       * аналитически по тем же каналам, из которых собрана rho. */
      const drho = Math.abs(rhoRatePcm(x, p, io, ndot, th0, u));
      const dtRho = drho > 0 ? (RHO_TOL * BT * 1e5) / drho : Infinity;
      const dtCap  = Math.min(h, 0.25 * p.tauF);
      let dtNew = Math.min(dtCap, dtWant, dtRho);
      if (dt > 0) dtNew = Math.min(dtNew, GROW_CAP * dt);
      dtNew = Math.max(dtNew, LamE / 10);
      dt = Math.min(dtNew, h - done);

      /* Знаменатель неявной схемы не положителен ⇒ шаг велик. Дробим его,
       * а не бросаем исключение: denom → 1 при dt → 0, так что несколько
       * делений всегда достаточно. */
      let halvings = 0;
      while (!fastStep(x, dt, rhoPcm, p, io, kin)) {
        if (++halvings > MAX_HALVINGS) throw violation(VIOLATIONS.stepBudget, { h, dt, rhoPcm });
        dt *= 0.5;
      }
      done += dt;
    }

    /* --- Strang: slow half step at the exit flux -------------------- */
    slowStep(x, 0.5 * h, p.phiNom * x[iN], p);
  }

  /* ------------------------------------------------------------------ *
   * 8. Linearisation
   *
   * Around a critical operating point (rho = 0, n = n0) the transfer
   * functions are assembled analytically — no numerical Faddeev on a matrix
   * whose eigenvalues span 1e-5 … 1e4 s^-1.
   *
   *   Z(s) = s * Q(s)/P(s),   P = prod(s+lam_i),  Q = Lambda*P + sum beta_i*P/(s+lam_i)
   *   dn = n0 * drho / Z(s)                                 (zero-power kinetics)
   *   dX = H_X(s) dn,  H_X = (A_X (s+lam_I) + lam_I B_I) / ((s+lam_I)(s+lam_e))
   *   drho = k_u du + a_X dX + a_D dT_f
   *
   * Thermal block (§4b), F = tau_f s + 1, G = tau_c s + g + w0:
   *   F dT_f = dT_c + a dn
   *   G dT_c = g dT_f + w0 dT_in + c_w dw,   c_w = -(dTcool/2) n0/w0
   *   =>  D(s) = F G - g,   dT_f = (a G dn + c_w dw)/D,  dT_c = (a g dn + F c_w dw)/D
   * At s = 0 and w0 = 1: dT_f/dn = a(g+1)/1 = dT_full EXACTLY, so every DC
   * gain of the previous single-node model is preserved bit for bit; D(0) = w0
   * likewise reduces to the old A3(0) = 1. The single change is that the old
   * factor A3 = tau_f s + 1 is replaced by the second-order D(s) and the
   * Doppler path picks up the zero of G(s).
   *
   * Channels: 'power'    u  -> y [%]            relative degree 1
   *           'xenon'    u  -> rho_Xe [pcm]                      2
   *           'tempFuel' u  -> T_f [degC]                        2
   *           'tempOut'  u  -> T_out [degC]                      3
   *           'flowPower'/'flowTempOut'  w -> y   (the flow disturbance)
   * ------------------------------------------------------------------ */

  function linParts(p, op) {
    const n0   = (op && op.n != null) ? op.n : ((op && op.w != null) ? op.w / 100 : 1);
    const w0   = clampFlow((op && Number.isFinite(op.flow)) ? op.flow : num(p.flow, 1));
    const th   = thermal(p, w0);
    const phin = p.phiNom;
    const phi0 = phin * n0;
    const X0   = (GAM_X + GAM_I) * SIG_F * phi0 / (LAM_X + SIG_AX * phi0);
    const A_X  = (GAM_X * SIG_F - SIG_AX * X0) * phin;   // d(dX/dt)/dn, prompt part
    const B_I  = GAM_I * SIG_F * phin;                   // d(dI/dt)/dn
    const lamE = LAM_X + SIG_AX * phi0;                  // effective Xe removal
    const a_X  = -SIG_AX / (NU * SIG_F);                 // drho/dX, absolute
    const a_D  = p.alphaD * PCM;                         // drho/dT_f, absolute
    const kin  = kinOf(p);
    /* drho/du of the bank the loop moves. With one bank and no follower this
     * is p.rhoSpan*PCM, exactly as before. */
    const k_u  = (num(p.worthTip, 0) !== 0 || num(p.followerWorth, 0) !== 0)
               ? bankSpec(p, loopBankId(p)).span * PCM
               : p.rhoSpan * PCM;

    /* Coolant path: drho/dT_c. Two contributions, both zero by default:
     *   - the coolant/moderator temperature coefficient alpha_C;
     *   - the void coefficient, through T_out = 2 T_c - T_in and the
     *     two-phase closure. d(void)/dT_out is taken numerically at the
     *     operating point because the closure is piecewise (it is identically
     *     zero below saturation, so below saturation this whole term is zero
     *     and the linearisation is the one this file always had). */
    const ioL  = { Tin: num(p.Tin0, 290), flow: w0 };
    const TcOp = ioL.Tin + th.g * th.a * n0 / w0;
    const ToutOp = 2 * TcOp - ioL.Tin;
    let dVoid_dTout = 0;
    if (num(p.alphaVoid, 0) !== 0) {
      const eps = 1e-4;
      const b1 = boilState(p, ToutOp + eps, ioL.Tin);
      const b0 = boilState(p, ToutOp - eps, ioL.Tin);
      dVoid_dTout = (b1.voidFrac - b0.voidFrac) / (2 * eps);
    }
    const a_C  = (num(p.alphaC, 0) + 2 * num(p.alphaVoid, 0) * dVoid_dTout) * PCM;

    let P = [1];
    for (let i = 0; i < 6; i++) P = polyMul(P, [1, kin.lam[i]]);
    let Q = polyScale(P, kin.Lambda);
    for (let i = 0; i < 6; i++) {
      let Pi = [1];
      for (let j = 0; j < 6; j++) if (j !== i) Pi = polyMul(Pi, [1, kin.lam[j]]);
      Q = polyAdd(Q, polyScale(Pi, kin.beta[i]));
    }
    const A1 = [1, LAM_I];          // s + lambda_I
    const A2 = [1, lamE];           // s + lambda_e
    const F  = [th.tf, 1];          // tau_f s + 1
    const G  = [th.tc, th.g + w0];  // tau_c s + g + w0
    /* D = F G - g  =  [tf*tc, tf*(g+w0) + tc, w0] */
    const D  = polyAdd(polyMul(F, G), [-th.g]);
    const E  = polyScale(G, th.a);  // dT_f = E dn / D
    const Ec = [th.a * th.g];       // dT_c = Ec dn / D  (constant polynomial)
    const c_w = -0.5 * num(p.dTcool, 0) * n0 / w0;           // dT_c/dw at fixed T_f
    const NX = polyAdd(polyScale(A1, A_X), [LAM_I * B_I]);   // A_X(s+lam_I) + lam_I B_I

    /* K = s Q A1 A2 - n0 a_X NX P   — the loop without the Doppler path */
    const K = polyAdd(polyMul(polyMul(polyMul([1, 0], Q), A1), A2),
                      polyScale(polyMul(NX, P), -n0 * a_X));
    /* den = D K - n0 P A1 A2 (a_D E + a_C Ec)
     *
     * The a_C term is written as a SEPARATE addend rather than folded into E
     * so that with a_C = 0 (the default) the expression evaluates to exactly
     * the floating-point number the previous version produced: adding an
     * all-zero polynomial changes nothing, whereas re-associating the
     * multiplications would move the last bits. */
    const PAA = polyMul(polyMul(P, A1), A2);
    let den = polyAdd(polyMul(D, K), polyScale(polyMul(PAA, E), -n0 * a_D));
    if (a_C !== 0) den = polyAdd(den, polyScale(polyMul(PAA, Ec), -n0 * a_C));

    /* Прежний множитель A3 = tau_f s + 1 больше не существует: его место
     * занял D(s) второго порядка. Имя намеренно НЕ сохранено под старым
     * псевдонимом — степень другая, и молчаливая подмена была бы ловушкой. */
    return { n0, w0, th, X0, A_X, B_I, lamE, a_X, a_D, a_C, k_u, c_w,
             dVoid_dTout, TcOp, ToutOp, kin,
             P, Q, A1, A2, F, G, D, E, Ec, K, NX, den, phi0 };
  }

  /* ------------------------------------------------------------------ *
   * 9. The plant object
   * ------------------------------------------------------------------ */

        tag: 'modern-reference',
        help: L('0 = an ordinary rod, and nothing changes. Positive = a graphite follower at the lower end that displaces water from the bottom of the core and inserts POSITIVE reactivity at the start of the travel — the rod characteristic becomes non-monotonic. Negative = an extra absorbing tip. Magnitude and sign are the user’s, not reference data — see the source register entry "rodTip".',
                '0 — звичайний стрижень, нічого не змінюється. Додатне — графітовий витискувач унизу, що виштовхує воду з нижньої частини зони й на початку ходу вносить ДОДАТНУ реактивність: характеристика стрижня стає немонотонною. Від’ємне — додатковий поглинач на кінці. Величина і знак — вибір користувача, не довідкові дані; див. запис "rodTip".',
                '0 = gewöhnlicher Stab, nichts ändert sich. Positiv = ein Graphitverdränger am unteren Ende, der Wasser aus dem Kernfuß verdrängt und zu Hubbeginn POSITIVE Reaktivität einbringt — die Stabkennlinie wird nichtmonoton. Negativ = zusätzlich absorbierendes Endstück. Betrag und Vorzeichen wählt der Benutzer, keine Referenzdaten — siehe "rodTip".',
                '0 = een gewone staaf, er verandert niets. Positief = een grafietverdringer aan het ondereinde die water uit de onderkant van de kern duwt en bij het begin van de slag POSITIEVE reactiviteit inbrengt — de staafkarakteristiek wordt niet-monotoon. Negatief = een extra absorberend einde. Grootte en teken kiest de gebruiker, geen referentiegegevens — zie "rodTip".',
                '0 = barre ordinaire, rien ne change. Positif = un déplaceur en graphite au bas de la barre qui chasse l’eau du bas du cœur et insère une réactivité POSITIVE en début de course — la caractéristique devient non monotone. Négatif = un embout absorbant supplémentaire. Amplitude et signe relèvent de l’utilisateur, non de données de référence — voir « rodTip ».',
                '0 = barra ordinaria, no cambia nada. Positivo = un desplazador de grafito en el extremo inferior que expulsa agua del fondo del núcleo e inserta reactividad POSITIVA al inicio de la carrera — la característica se vuelve no monótona. Negativo = un extremo absorbente adicional. Magnitud y signo los elige el usuario, no son datos de referencia — véase «rodTip».') },

      { key: 'tipLen',
        label: L('Tip travel (fraction of the rod stroke)', 'Хід концевика (частка ходу стрижня)',
                 'Weg des Endstücks (Anteil des Stabhubs)', 'Weg van het staafeinde (fractie van de slag)',
                 'Course de l’embout (fraction de la course de barre)',
                 'Recorrido del extremo (fracción de la carrera)'),
        unit: '-', def: 0.1, min: 0.02, max: 0.5, step: 0.01,
        tag: 'modern-reference',
        help: L('Width of the tip bump ρ_tip = worth·z·e^(1−z), z = (1−u)/tipLen. The characteristic is non-monotonic exactly when worth·e/tipLen > rod bank worth — computed by rodTipAnalysis(), not estimated. Shape chosen by the author, illustrative.',
                'Ширина горба концевика ρ_tip = вага·z·e^(1−z), z = (1−u)/tipLen. Характеристика немонотонна рівно тоді, коли вага·e/tipLen > вага банку стрижнів — це рахує rodTipAnalysis(), а не око. Форму обрав автор, вона ілюстративна.',
                'Breite des Endstück-Buckels ρ_tip = Wert·z·e^(1−z), z = (1−u)/tipLen. Nichtmonoton genau dann, wenn Wert·e/tipLen > Wert der Stabgruppe — von rodTipAnalysis() berechnet, nicht geschätzt. Form vom Autor gewählt, illustrativ.',
                'Breedte van de tipbult ρ_tip = waarde·z·e^(1−z), z = (1−u)/tipLen. Niet-monotoon precies wanneer waarde·e/tipLen > waarde van de staafgroep — berekend door rodTipAnalysis(), niet geschat. Vorm door de auteur gekozen, illustratief.',
                'Largeur de la bosse ρ_tip = efficacité·z·e^(1−z), z = (1−u)/tipLen. Non monotone exactement si efficacité·e/tipLen > efficacité du groupe de barres — calculé par rodTipAnalysis(). Forme choisie par l’auteur, illustrative.',
                'Anchura de la joroba ρ_tip = valor·z·e^(1−z), z = (1−u)/tipLen. No monótona exactamente si valor·e/tipLen > valor del banco de barras — lo calcula rodTipAnalysis(). Forma elegida por el autor, ilustrativa.') },

      { key: 'marginPcm',
        label: L('Available reactivity margin', 'Наявний запас реактивності',
                 'Verfügbare Reaktivitätsreserve', 'Beschikbare reactiviteitsmarge',
                 'Marge de réactivité disponible', 'Margen de reactividad disponible'),
