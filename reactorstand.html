     */
    hSpec(id) {
      const kb = (nm) => this.knobDefs.find((q) => q.id === nm);
      if (id === 'reg' || id === 'tipd') {
        return { k: kb(id), kind: 'abs', step: 0.005, big: 0.05,
                 nameKey: id === 'reg' ? 'dragReg' : 'dragTipd', digits: 3, unit: '',
                 fromPt: (pt) => 1 - (pt.y - CORE.y) / CORE.h };
      }
      if (id === 'flow') {
        return { k: kb('flow'), kind: 'abs', step: 0.01, big: 0.1,
                 nameKey: 'dragFlow', digits: 3, unit: '',
                 fromPt: (pt) => FLOW_MIN_CTL + (VLV.bot - pt.y) / (VLV.bot - VLV.top)
                   * (FLOW_MAX_CTL - FLOW_MIN_CTL) };
      }
      if (id === 'tin') {
        const k = kb('tin');
        return { k, kind: 'abs', step: 0.5, big: 5, nameKey: 'dragTin',
                 digits: 1, unit: '°C',
                 fromPt: (pt) => k.min + (TH.bot - pt.y) / (TH.bot - TH.top)
                   * (k.max - k.min) };
      }
      if (id === 'pow') {
        if (this.mode === 'holdPower') {
          const b = this.sc.pow, c = COL.pow;
          return { k: kb('setp'), kind: 'abs', step: 0.5, big: 5,
                   nameKey: 'dragSetP', digits: 1, unit: '%',
                   fromPt: (pt) => b.lo + (c.bot - pt.y) / c.h * (b.hi - b.lo) };
        }
        return { k: kb('reg'), kind: 'rel', step: 0.005, big: 0.05,
                 nameKey: 'dragPowerVia', digits: 3, unit: '',
                 perPx: -1 / COL.pow.h };
      }
      return null;
    }

    /** Ручка ведёт в тот же setter, что и ползунок, и сразу его подтягивает. */
    applyHandle(id, v) {
      const sp = this.hSpec(id);
      if (!sp || !sp.k || !fin(v)) return;
      if (AUTO_OF[this.mode][sp.k.id]) return;      /* этим сейчас правит автомат */
      sp.k.set(clamp(v, sp.k.min, sp.k.max));
      this.syncOne(sp.k, false);
      if (!this.running) this.sampleForce();
      this.paint(true);
    }

    /**
     * Перетаскивание. Захват указателя ставится на саму зону, поэтому все
     * дальнейшие pointermove приходят на неё же: ни одного слушателя на
     * document, ни одного нового замыкания на каждый жест — за пять минут
     * активного дёрганья не остаётся ничего.
     */
    wireHandles() {
      if (!this.root) return;
      this.dragCount = 0;
      this.drag = null;
      for (const id of HANDLE_IDS) {
        const h = this.root.querySelector('[data-h="' + id + '"]');
        if (!h) continue;
        h.addEventListener('pointerdown', (ev) => {
          const sp = this.hSpec(id);
          if (!sp || !sp.k || AUTO_OF[this.mode][sp.k.id]) return;
          if (ev.preventDefault) ev.preventDefault();
          this.drag = { id, v0: sp.k.get(), y0: this.svgPt(ev).y };
          this.dragCount += 1;
          try { h.setPointerCapture(ev.pointerId); } catch (e) { /* нет захвата */ }
          h.classList.add('on');
          if (h.focus) h.focus();
        });
        h.addEventListener('pointermove', (ev) => {
          if (!this.drag || this.drag.id !== id) return;
          if (ev.preventDefault) ev.preventDefault();
          const sp = this.hSpec(id);
          if (!sp || !sp.k) return;
          const pt = this.svgPt(ev);
          const v = sp.kind === 'rel'
            ? this.drag.v0 + (pt.y - this.drag.y0) * sp.perPx
            : sp.fromPt(pt);
          this.applyHandle(id, v);
        });
        const end = (ev) => {
          if (!this.drag || this.drag.id !== id) return;
          this.drag = null;
          h.classList.remove('on');
          try { h.releasePointerCapture(ev.pointerId); } catch (e) { /* уже отпущен */ }
        };
        h.addEventListener('pointerup', end);
        h.addEventListener('pointercancel', end);
        h.addEventListener('lostpointercapture', end);
        h.addEventListener('keydown', (ev) => this.handleKey(id, ev));
      }
    }

    handleKey(id, ev) {
      const sp = this.hSpec(id);
      if (!sp || !sp.k || AUTO_OF[this.mode][sp.k.id]) return;
      const cur = sp.k.get();
      let v = null;
      switch (ev.key) {
        case 'ArrowUp': case 'ArrowRight': v = cur + sp.step; break;
        case 'ArrowDown': case 'ArrowLeft': v = cur - sp.step; break;
        case 'PageUp': v = cur + sp.big; break;
        case 'PageDown': v = cur - sp.big; break;
        case 'Home': v = sp.k.min; break;
        case 'End': v = sp.k.max; break;
        default: return;
      }
      if (ev.preventDefault) ev.preventDefault();
      this.applyHandle(id, v);
    }

    /* ---------------- место для карты равновесий (equilib.js) ---------------- */

    /**
     * Контракт контейнера: стенд даёт пустой <div data-k="eqmount"> внутри
     * своей карточки и зовёт EQ.mount(el, {plant, lang}). Дальше — только
     * handle.update(state) на медленном такте отрисовки (10 Гц), setLang при
     * смене языка и destroy() при снятии стенда. Модуля может не быть —
     * тогда карточка просто скрыта, и стенд работает как работал.
     */
    mountEq() {
      const host = this.nodes.eqmount, card = this.nodes.eqcard;
      if (!host || !card) return;
      this.eq = null;
      card.hidden = true;
      if (typeof EQ === 'undefined' || !EQ || typeof EQ.mount !== 'function') return;
      try {
        const h = EQ.mount(host, { plant: this.plant, lang: this.lang });
        if (h && typeof h.update === 'function') { this.eq = h; card.hidden = false; }
      } catch (e) {
        this.eq = null;
        host.innerHTML = '';
        card.hidden = true;
      }
    }

    updateEq() {
      if (!this.eq) return;
      try { this.eq.update(this.state()); }
      catch (e) {
        /* Чужой модуль отказал — стенд от этого не останавливается. */
        try { if (this.eq.destroy) this.eq.destroy(); } catch (e2) { /* и это тоже */ }
        this.eq = null;
        if (this.nodes.eqmount) this.nodes.eqmount.innerHTML = '';
        if (this.nodes.eqcard) this.nodes.eqcard.hidden = true;
      }
    }

    buildSelects() {
      const n = this.nodes;
      const fill = (sel, items) => {
        sel.innerHTML = items.map((it) =>
          '<option value="' + esc(it.v) + '">' + esc(it.t) + '</option>').join('');
      };
      fill(n.preset, this.presets.map((r) => ({ v: r.id, t: pick(r.family, this.lang) })));
      n.preset.value = this.presetId || '';
      fill(n.mode, MODES.map((m) => ({
        v: m, t: tx({ manual: 'modeManual', holdTemp: 'modeHoldTemp',
                      holdPower: 'modeHoldPower' }[m], this.lang) })));
      n.mode.value = this.mode;
      fill(n.speed, SPEEDS.map((s) => ({ v: s, t: '×' + s })));
      n.speed.value = String(this.speed);
      fill(n.window, WINDOWS.map((s) => ({ v: s, t: this.fmtDur(s) })));
      n.window.value = String(this.windowSec);
    }

    fmtDur(s) {
      const lg = this.lang;
      if (s < 120) return nf(s, 0, lg) + ' ' + tx('secs', lg);
      if (s < 3600) return nf(s / 60, 0, lg) + ' ' + tx('mins', lg);
      return nf(s / 3600, s % 3600 ? 1 : 0, lg) + ' ' + tx('hours', lg);
    }

    buildKnobs() {
      const P = this.plant, ids = this.ids;
      const tinV = P.disturbance.variants[0];
      const flowV = P.disturbance.variants[1];
      this.knobDefs = [
        { id: 'reg', inp: ids.reg, hint: ids.regh, labelKey: 'ctlReg',
          min: 0, max: 1, step: 0.001, digits: 3, unit: '-',
          /* Ползунок — УСТАВКА привода, а не положение банка. Банк едет к
             ней с конечной скоростью; на схеме видно и то и другое. */
          get: () => this.uSet.reg, set: (v) => { this.uSet.reg = clamp01(v); },
          hintText: () => tx('rodPosHint', this.lang) + ' ' + pick(P.rodBanks[0].label, this.lang) },
        { id: 'tipd', inp: ids.tipd, hint: ids.tiph, labelKey: 'ctlTipd',
          min: 0, max: 1, step: 0.001, digits: 3, unit: '-',
          get: () => this.uSet.tipd, set: (v) => { this.uSet.tipd = clamp01(v); },
          hintText: () => tx('rodPosHint', this.lang) + ' ' + pick(P.rodBanks[1].label, this.lang) },
        { id: 'flow', inp: ids.flow, hint: ids.flowh, labelKey: 'ctlFlow',
          min: FLOW_MIN_CTL, max: FLOW_MAX_CTL, step: 0.01, digits: 3, unit: '-',
          get: () => this.d.flow,
          set: (v) => { this.d.flow = clamp(v, FLOW_MIN_CTL, FLOW_MAX_CTL); this.flowI = this.d.flow; },
          hintText: () => pick(flowV.note, this.lang) },
        { id: 'tin', inp: ids.tin, hint: ids.tinh, labelKey: 'ctlTin',
          min: tinV.min, max: tinV.max, step: 0.5, digits: 1, unit: '°C', ranged: true,
          get: () => this.d.Tin, set: (v) => { this.d.Tin = v; },
          hintText: () => pick(tinV.note, this.lang) },
        { id: 'turb', inp: ids.turb, hint: ids.turbh, labelKey: 'lblTurb',
          min: SEC_Y_MIN, max: SEC_Y_MAX, step: 0.01, digits: 3, unit: '-',
          get: () => this.turbine, set: (v) => { this.turbine = clamp(v, SEC_Y_MIN, SEC_Y_MAX); },
          hintText: () => tx(this.sec && this.sec.drum ? 'drumNote' : 'secNote', this.lang) },
        { id: 'setp', inp: ids.setp, hint: ids.setph, labelKey: 'ctlSetP',
          min: 1, max: 120, step: 0.5, digits: 1, unit: '%',
          modes: ['holdPower'],
          get: () => this.setPower, set: (v) => { this.setPower = v; },
          hintText: () => tx('modeHoldPowerNote', this.lang) },
        { id: 'sett', inp: ids.sett, hint: ids.setth, labelKey: 'ctlSetT',
          min: 200, max: 600, step: 0.5, digits: 2, unit: '°C',
          modes: ['holdTemp'],
          get: () => this.setTemp, set: (v) => { this.setTemp = v; },
          hintText: () => tx('modeHoldTempNote', this.lang) }
      ];
      this.nodes.knobs.innerHTML = this.knobDefs.map((k) => (
        '<div class="rcon-knob" data-knob="' + k.id + '">' +
          '<label class="rcon-kl" for="' + k.inp + '">' +
            '<span data-k="kt"></span> <span class="rcon-badge" data-k="kb"></span>' +
          '</label>' +
          '<div class="rcon-krow">' +
            '<input type="range" id="' + k.inp + '" min="' + k.min + '" max="' + k.max +
              '" step="' + k.step + '" aria-describedby="' + k.hint + '">' +
            '<span class="rcon-kv" data-k="kv"></span>' +
          '</div>' +
          '<p class="rcon-kh" id="' + k.hint + '" data-k="kh"></p>' +
        '</div>')).join('');
      for (const k of this.knobDefs) {
        const wrap = this.nodes.knobs.querySelector('[data-knob="' + k.id + '"]');
        k.node = wrap;
        k.input = wrap.querySelector('input');
        k.vNode = wrap.querySelector('[data-k="kv"]');
        k.bNode = wrap.querySelector('[data-k="kb"]');
        k.tNode = wrap.querySelector('[data-k="kt"]');
        k.hNode = wrap.querySelector('[data-k="kh"]');
        k.input.addEventListener('input', () => {
          k.set(parseFloat(k.input.value));
          this.syncOne(k, true);
          if (!this.running) { this.sampleForce(); this.paint(true); }
        });
      }
    }

    /**
     * Компоновщик зоны: что делится, что не делится, чем замедляют, чем
     * охлаждают. Это НЕ пресет — это способ собрать зону, которой нет в
     * списке, и увидеть, что из этого выйдет. Смысл упражнения ровно один:
     * три из четырёх выборов почти не видны в стационаре и решают всё в
     * динамике.
     */
    buildComposer() {
      const P = this.plant;
      const opt = (v, t) => '<option value="' + esc(v) + '">' + esc(t) + '</option>';
      this.compSel = [
        { key: 'fissile', vals: ['U235', 'Pu239', 'U233', 'MOX'] },
        { key: 'fertile', vals: ['U238', 'Th232', 'none'] },
        { key: 'moderator', vals: P.moderators.map((m) => m.id) },
        { key: 'coolant', vals: P.coolants.map((c) => c.id) }
      ];
      this.comp = { fissile: 'U235', fertile: 'U238', moderator: 'h2o',
                    coolant: 'h2o', enrichment: 4 };
      this.nodes.comp.innerHTML = this.compSel.map((d) => (
        '<div class="rcon-knob" data-comp="' + d.key + '">' +
          '<label class="rcon-kl" for="' + uid('c') + '"><span data-k="ct"></span></label>' +
          '<div class="rcon-krow"><select class="rcon-wide" data-k="cs">' +
            d.vals.map((v) => opt(v, v)).join('') + '</select></div>' +
        '</div>')).join('')
        + '<div class="rcon-knob" data-comp="enr">'
        + '<label class="rcon-kl"><span data-k="ct"></span></label>'
        + '<div class="rcon-krow"><input type="range" data-k="cs" min="0.4" max="100" '
        + 'step="0.1"><span class="rcon-kv" data-k="cv"></span></div></div>'
        + '<p><button type="button" class="rcon-btn" data-k="capply"></button></p>';
      for (const d of this.compSel) {
        d.node = this.nodes.comp.querySelector('[data-comp="' + d.key + '"]');
        d.input = d.node.querySelector('[data-k="cs"]');
        d.tNode = d.node.querySelector('[data-k="ct"]');
        d.input.value = this.comp[d.key];
        d.input.addEventListener('change', () => {
          this.comp[d.key] = d.input.value;
          this.paintVerdict();
        });
      }
      const en = this.nodes.comp.querySelector('[data-comp="enr"]');
      this.compEnr = { node: en, input: en.querySelector('[data-k="cs"]'),
                       tNode: en.querySelector('[data-k="ct"]'),
                       vNode: en.querySelector('[data-k="cv"]') };
      this.compEnr.input.value = String(this.comp.enrichment);
      this.compEnr.input.addEventListener('input', () => {
        this.comp.enrichment = parseFloat(this.compEnr.input.value);
        this.compEnr.vNode.textContent = nf(this.comp.enrichment, 1, this.lang) + ' %';
        this.paintVerdict();
      });
      this.nodes.comp.querySelector('[data-k="capply"]')
        .addEventListener('click', () => this.applyComposed());
    }

    /** Собрать зону и перезапустить стенд на ней. */
    applyComposed() {
      const P = this.plant;
      const c = this.comp;
      const patch = P.composeCore({
        fissile: c.fissile,
        fertile: c.fertile === 'none' ? null : c.fertile,
        enrichment: c.enrichment, moderator: c.moderator, coolant: c.coolant
      });
      const p = P.defaults();
      Object.assign(p, patch);
      /* Всё, чего компоновщик не задаёт, берётся у ближайшего по спектру
         пресета: ход стержней, поток, второй контур. Это не физика зоны, а
         обвязка, и придумывать её заново незачем. */
      const donor = this.presets.find((r) => r.id
        === (patch.spectrum === 'fast' ? 'fastPu'
           : (c.moderator === 'd2o' ? 'candu' : 'pwr')));
      if (donor) {
        for (const k of ['rhoSpan', 'phiNom', 'marginPcm', 'flow', 'secOn',
                         'secApproach', 'secTauLeg', 'secPMW', 'secPNomMPa',
                         'secClapB', 'secEta', 'voidMax', 'qualityMax',
                         'worthTip', 'followerWorth', 'followerLen', 'uPark']) {
          if (donor.params[k] !== undefined && patch[k] === undefined) p[k] = donor.params[k];
        }
      }
      this.p = p;
      this.TsatDesign = num(p.Tsat, 0);
      this.presetId = null;
      this.preset = null;
      if (this.nodes.preset) this.nodes.preset.value = '';
      this.reset();
      this.paintVerdict();
      return this;
    }

    /**
     * Приговор: три числа, которые решают, управляем ли этот аппарат.
     * beta_eff — сколько реактивности отделяет от мгновенной критичности;
     * Lambda — за какое время это произойдёт, если отделять перестанет;
     * alpha_void — куда пойдёт зона, если теплоноситель уйдёт.
     */
    paintVerdict() {
      const nd = this.nodes.verdict;
      if (!nd) return;
      const P = this.plant, lg = this.lang, c = this.comp;
      let patch;
      try {
        patch = P.composeCore({
          fissile: c.fissile, fertile: c.fertile === 'none' ? null : c.fertile,
          enrichment: c.enrichment, moderator: c.moderator, coolant: c.coolant });
      } catch (e) { nd.textContent = ''; return; }
      const p = Object.assign(P.defaults(), patch);
      const beta = P.betaEff(p) * 1e5;
      const span = num(this.p && this.p.rhoSpan, 8000);
      const dollarsPerStroke = span / beta;
      /* Красным помечается то, что ТРУДНО УПРАВЛЯТЬ, а не то, что большое:
         сильно отрицательный пустотный коэффициент — это достоинство, а не
         повод для тревоги. Тревожат три вещи: мало запаздывающих нейтронов,
         положительный пустотный эффект и положительный пустотный эффект в
         быстрой зоне, где на реакцию остаются микросекунды. */
      const bad = beta < 400 || patch.alphaVoid > 1000
               || (patch.alphaVoid > 0 && P.LambdaOf(p) < 1e-5);
      nd.className = 'rcon-verdict' + (bad ? ' warn' : '');
      const vb = patch.voidBreakdown;
      nd.innerHTML =
        '<b>β_eff ' + esc(nf(beta, 0, lg)) + ' pcm</b> · '
        + '<b>Λ ' + esc(ne(P.LambdaOf(p), 1, lg)) + ' ' + esc(tx('secs', lg)) + '</b> · '
        + '<b>α_void ' + esc(nf(patch.alphaVoid, 0, lg)) + ' pcm</b><br>'
        + esc(txf('verdictSpan', lg, [nf(dollarsPerStroke, 1, lg)])) + ' '
        + esc(tx(patch.alphaVoid > 200 ? 'verdictVoidPos'
              : (patch.alphaVoid < -200 ? 'verdictVoidNeg' : 'verdictVoidNil'), lg))
        + (vb && !vb.gas
            ? ' (' + esc(nf(vb.moderation, 0, lg)) + ' / +' + esc(nf(vb.absorption, 0, lg))
              + ' / +' + esc(nf(vb.hardening, 0, lg)) + ')' : '')
        + (beta < 400 ? ' <b>' + esc(tx('verdictLowBeta', lg)) + '</b>' : '');
    }

    /**
     * Переключатели физики §4a: спектр, состав делящегося, обогащение и знак
     * пустотного коэффициента. Всё берётся из PLANT.params — и подписи, и
     * пределы, и варианты, — чтобы стенд не заводил собственной копии данных.
     */
    buildPhysics() {
      const P = this.plant;
      const spec = (key) => P.params.find((q) => q.key === key);
      this.physDefs = [];
      /* phiNom стоит здесь потому, что именно он задаёт величину ксенона:
         отношение выгорания sigma_a*phi/lambda_X = 3,8 при 3e13 и 6,4 при
         5e13, а с ним и глубина ямы (-4102 против -6203 pcm). Без ручки
         проверить это было нечем. */
      for (const key of ['spectrum', 'fuelType', 'enrichment', 'alphaVoid', 'phiNom']) {
        const q = spec(key);
        if (!q) continue;
        this.physDefs.push({ key, q, id: uid('ph'),
                             kind: q.options ? 'select' : 'range' });
      }
      this.nodes.phys.innerHTML = this.physDefs.map((d) => (
        '<div class="rcon-knob" data-phys="' + d.key + '">' +
          '<label class="rcon-kl" for="' + d.id + '"><span data-k="pt"></span></label>' +
          '<div class="rcon-krow">' +
            (d.kind === 'select'
              ? '<select id="' + d.id + '" class="rcon-wide"></select>'
              : '<input type="range" id="' + d.id + '" min="' + d.q.min + '" max="'
                + d.q.max + '" step="' + d.q.step + '">') +
            '<span class="rcon-kv" data-k="pv"></span>' +
          '</div>' +
        '</div>')).join('');
      for (const d of this.physDefs) {
        const wrap = this.nodes.phys.querySelector('[data-phys="' + d.key + '"]');
        d.node = wrap;
        d.input = wrap.querySelector('select, input');
        d.tNode = wrap.querySelector('[data-k="pt"]');
        d.vNode = wrap.querySelector('[data-k="pv"]');
        if (d.kind === 'select') {
          d.input.innerHTML = d.q.options.map((o) =>
            '<option value="' + esc(o.value) + '"></option>').join('');
        }
        const ev = d.kind === 'select' ? 'change' : 'input';
        d.input.addEventListener(ev, () => this.setPhysics(d.key, parseFloat(d.input.value)));
      }
    }

    /** Смена физики: параметр меняется и равновесие пересчитывается заново. */
    setPhysics(key, v) {
      if (!fin(v)) return this;
      this.p[key] = v;
      this.reset();
      return this;
    }

    syncPhysics() {
      if (!this.physDefs) return;
      const lg = this.lang;
      for (const d of this.physDefs) {
        d.tNode.textContent = pick(d.q.label, lg);
        const v = num(this.p[d.key], d.q.def);
        d.input.value = String(v);
        if (d.kind === 'select') {
          const opts = d.input.querySelectorAll('option');
          d.q.options.forEach((o, i) => { opts[i].textContent = pick(o.label, lg); });
          const cur = d.q.options.find((o) => o.value === v);
          d.vNode.textContent = '';
          d.node.classList.add('rcon-selrow');
          if (!cur) d.vNode.textContent = nf(v, 0, lg);
        } else {
          const txt = nf(v, d.q.step < 1 ? 1 : 0, lg)
            + (d.q.unit && d.q.unit !== '-' ? ' ' + d.q.unit : '');
          d.vNode.textContent = txt;
          d.input.setAttribute('aria-valuetext', txt);
        }
      }
      const fe = this.nodes.feas;
      if (fe) {
        fe.hidden = this.eqFeasible !== false;
        fe.textContent = this.eqFeasible === false ? tx('notFeasible', lg) : '';
      }
    }

    buildNudges() {
      const defs = [['rod', 'nudgeRod'], ['tin', 'nudgeTin'], ['flow', 'nudgeFlow']];
      this.nodes.nudge.innerHTML = defs.map(([k]) =>
        '<button type="button" class="rcon-btn ghost" data-nudge="' + k + '"></button>').join('')
        + '<p class="rcon-kh" data-k="nudgenote"></p>';
      this.nudgeDefs = defs;
      for (const [k] of defs) {
        this.nodes.nudge.querySelector('[data-nudge="' + k + '"]')
          .addEventListener('click', () => this.nudge(k));
      }
    }

    buildStrips() {
      const box = this.nodes.stripbox;
      box.innerHTML = STRIP_DEFS.map((s) => {
        const legend = s.traces.length > 1
          ? '<p class="rcon-legend" data-k="legend"></p>' : '';
        const note = s.note ? '<p class="rcon-kh" data-k="snote"></p>' : '';
        return '<figure class="rcon-strip" data-strip="' + s.id + '">' +
          '<figcaption class="rcon-shead">' +
            '<span class="rcon-sname" data-k="sname"></span>' +
            '<span class="rcon-snow" data-k="snow"></span>' +
          '</figcaption>' +
          '<div class="rcon-scanvas">' +
            '<canvas data-k="cv" role="img"></canvas>' +
            '<span class="rcon-shi" data-k="shi"></span>' +
            '<span class="rcon-slo" data-k="slo"></span>' +
          '</div>' + legend + note +
        '</figure>';
      }).join('');
      this.strips = STRIP_DEFS.map((s) => {
        const node = box.querySelector('[data-strip="' + s.id + '"]');
        if (s.hPx) node.querySelector('canvas').style.height = s.hPx + 'px';
        return { def: s, node,
                 cv: node.querySelector('canvas'),
                 ctx: node.querySelector('canvas').getContext('2d'),
                 name: node.querySelector('[data-k="sname"]'),
                 nowN: node.querySelector('[data-k="snow"]'),
                 hi: node.querySelector('[data-k="shi"]'),
                 lo: node.querySelector('[data-k="slo"]'),
                 legend: node.querySelector('[data-k="legend"]'),
                 note: node.querySelector('[data-k="snote"]'),
                 bounds: { lo: 0, hi: 1 }, w: 0, h: 0 };
      });
    }

    wire() {
      const n = this.nodes;
      n.run.addEventListener('click', () => (this.running ? this.stop() : this.start()));
      n.reset.addEventListener('click', () => { this.reset(); });
      n.preset.addEventListener('change', () => this.setPreset(n.preset.value));
      n.mode.addEventListener('change', () => this.setMode(n.mode.value));
      n.speed.addEventListener('change', () => this.setSpeed(parseFloat(n.speed.value)));
      n.window.addEventListener('change', () => this.setWindow(parseFloat(n.window.value)));
      n.fail.addEventListener('click', (ev) => {
        if (ev.target.closest('[data-k="restart"]')) { this.reset(); this.start(); return; }
        if (ev.target.closest('[data-k="recover"]')) { this.recover(); this.start(); }
      });

      this.onVis = () => {
        if (typeof document === 'undefined') return;
        if (document.hidden) this.suspend(); else this.resume();
      };
      if (typeof document !== 'undefined' && document.addEventListener) {
        document.addEventListener('visibilitychange', this.onVis);
      }
      if (typeof IntersectionObserver === 'function') {
        this.io = new IntersectionObserver((entries) => {
          for (const e of entries) {
            if (e.intersectionRatio <= 0) this.suspend();
            else if (typeof document === 'undefined' || !document.hidden) this.resume();
          }
        });
        this.io.observe(this.root);
      }
      if (typeof ResizeObserver === 'function') {
        this.ro = new ResizeObserver(() => this.paint(true));
        this.ro.observe(this.root);
      }
      if (typeof MutationObserver === 'function' && typeof document !== 'undefined') {
        this.mo = new MutationObserver(() => { this.colorsAt = -1e9; this.paint(true); });
        this.mo.observe(document.documentElement, {
          attributes: true, attributeFilter: ['class', 'data-theme', 'style'] });
      }
    }

    /* ---------------- перевод и синхронизация ---------------- */

    relabel() {
      if (!this.root) return;
      const lg = this.lang, P = this.plant, root = this.root;
      const set = (sel, text) => { const e = root.querySelector(sel); if (e) e.textContent = text; };
      const setHTML = (sel, html) => { const e = root.querySelector(sel); if (e) e.innerHTML = html; };

      root.setAttribute('lang', lg);
      root.setAttribute('aria-label', tx('title', lg));
      set('[data-k="lbl-preset"]', tx('preset', lg));
      set('[data-k="lbl-mode"]', tx('mode', lg));
      set('[data-k="lbl-speed"]', tx('speed', lg));
      set('[data-k="lbl-window"]', tx('windowLbl', lg));
      set('[data-k="lbl-knobs"]', tx('knobs', lg));
      set('[data-k="lbl-facts"]', tx('physics', lg));
      set('[data-k="lbl-phys"]', tx('physSwitch', lg));
      set('[data-k="physnote"]', tx('physNote', lg));
      set('[data-k="lbl-comp"]', tx('composer', lg));
      set('[data-k="compnote"]', tx('composerNote', lg));
      set('[data-k="capply"]', tx('compApply', lg));
      if (this.compSel) {
        for (const d of this.compSel) {
          d.tNode.textContent = tx('comp_' + d.key, lg);
          for (const o of d.input.options) o.textContent = tx('opt_' + o.value, lg);
        }
        this.compEnr.tNode.textContent = tx('comp_enrichment', lg);
        this.compEnr.vNode.textContent = nf(this.comp.enrichment, 1, lg) + ' %';
        this.paintVerdict();
      }
      set('[data-k="lbl-nudge"]', tx('nudges', lg));
      set('[data-k="lbl-strips"]', tx('strips', lg));
      set('[data-k="lbl-scheme"]', tx('scheme', lg));
      set('[data-k="schemehint"]', tx('schemeHint', lg));
      set('[data-k="kbdhint"]', tx('kbdHint', lg) + ' ' + tx('powerIndirect', lg));
      set('[data-k="lbl-eq"]', tx('eqPanel', lg));
      this.relabelScheme();
      set('[data-k="reset"]', tx('reset', lg));
      root.querySelector('[data-k="transport"]')
          .setAttribute('aria-label', tx('title', lg));
      root.querySelector('[data-k="stripbox"]')
          .setAttribute('aria-label', tx('strips', lg));
      const nn = root.querySelector('[data-k="nudgenote"]');
      if (nn) nn.textContent = tx('nudgeNote', lg);
      for (const [k, key] of this.nudgeDefs) {
        root.querySelector('[data-nudge="' + k + '"]').textContent = tx(key, lg);
      }
      this.buildSelects();
      for (const k of this.knobDefs) {
        k.tNode.textContent = tx(k.labelKey, lg);
        k.hNode.textContent = k.hintText();
      }
      for (const s of this.strips) {
        s.name.textContent = tx(s.def.key, lg) + ', ' + s.def.unit;
        if (s.legend) {
          s.legend.textContent = s.def.traces.map((t) => tx(t.name, lg)).join(' · ');
        }
        if (s.note) {
          s.note.textContent = tx((s.def.note === 'secNote' && this.sec && this.sec.drum)
            ? 'drumNote' : s.def.note, lg);
        }
      }
      /* Оговорки — только тексты модели, свои не сочиняем. */
      const caveat = P.presets && P.presets.reactorCaveat;
      setHTML('[data-k="notes"]',
        '<h4>' + esc(tx('limits', lg)) + '</h4><p>' + esc(tx('limitsBody', lg)) + '</p>' +
        (caveat ? '<h4>' + esc(tx('presetCaveatHdr', lg)) + '</h4><p>' +
                  esc(pick(caveat, lg)) + '</p>' : '') +
        (P.rodTipDemo && P.rodTipDemo.disclaimer
          ? '<h4>' + esc(tx('tipHdr', lg)) + '</h4><p>' +
            esc(pick(P.rodTipDemo.disclaimer, lg)) + '</p>' : ''));
      set('[data-k="notes-sum"]', tx('limits', lg));
      this.syncControls();
      this.paint(true);
    }

    /** Неподвижные подписи схемы: меняются только с языком и пресетом. */
    relabelScheme() {
      const n = this.sn;
      if (!n || !n.svg) return;
      const lg = this.lang, P = this.plant;
      const X = (k, v) => { const e = n[k]; if (e) e.textContent = v; };
      X('lbl-drive', tx('driveLbl', lg));
      X('lbl-core', tx('coreLbl', lg));
      X('lbl-inlet', tx('inletLbl', lg));
      X('lbl-valve', tx('valveLbl', lg));
      X('lbl-outlet', tx('outletLbl', lg));
      X('rho.cap', tx('sRho', lg) + ', pcm');
      for (const c of COLS) X(c.key + '.cap', tx(c.labKey, lg));
      X('rho.lt', tx('trTotal', lg));
      for (let i = 0; i < RHO_KEYS.length; i++) X('rho.l' + i, tx(RHO_KEYS[i][1], lg));
      /* На картинке — короткое имя банка: полное стоит у его ползунка и в
         текстовой альтернативе, а над половиной зоны на него нет места. */
      X('reg.name', tx('trReg', lg));
      X('tipd.name', tx('trTipd', lg));
      const bank = (i) => (P.rodBanks && P.rodBanks[i]
        ? pick(P.rodBanks[i].label, lg) : '');
      if (n['reg.name']) n['reg.name'].setAttribute('aria-hidden', 'true');
      if (n['tipd.name']) n['tipd.name'].setAttribute('aria-hidden', 'true');
      this.bankNames = [bank(0), bank(1)];
      X('tipd.tipname', Math.abs(num(this.p.followerWorth, 0)) > 1e-9
        ? tx('followerLbl', lg) : '');
      n.svg.setAttribute('aria-label', tx('schemeAlt', lg));
      this.syncHandleAria();
    }

    /**
     * Ход ручки температуры входа зависит от пресета: у быстрого
     * плутониевого T_вх = 380 °C, а объявленный диапазон возмущения —
     * 260…330. Держать ползунок в 260…330 значило бы, что рабочая точка
     * лежит ЗА его концом, а любое касание ручки швыряло бы вход на 50 K
     * вниз. Поэтому концы шкалы раздвигаются вокруг рабочей точки — и на
     * схеме подписаны те, которые в самом деле действуют.
     */
    refreshKnobRanges() {
      if (!this.knobDefs) return;
      const v = this.plant.disturbance.variants[0];
      const t0 = num(this.p.Tin0, 290);
      const lo = Math.min(v.min, Math.floor((t0 - 40) / 10) * 10);
      const hi = Math.max(v.max, Math.ceil((t0 + 40) / 10) * 10);
      for (const k of this.knobDefs) {
        if (!k.ranged) continue;
        k.min = lo; k.max = hi;
        if (k.input) { k.input.min = String(lo); k.input.max = String(hi); }
      }
    }

    syncControls() {
      if (!this.root) return;
      this.refreshKnobRanges();
      this.root.setAttribute('data-mode', this.mode);
      for (const k of this.knobDefs) this.syncOne(k, false);
      this.syncPhysics();
      const lg = this.lang;
      this.nodes.modeline.textContent = tx({ manual: 'modeManualNote',
        holdTemp: 'modeHoldTempNote', holdPower: 'modeHoldPowerNote' }[this.mode], lg);
      const pr = this.preset;
      this.nodes.presetInfo.textContent = pr ? pick(pr.shows, lg) : '';
    }

    syncOne(k, fromUser) {
      const shown = (!k.modes || k.modes.indexOf(this.mode) >= 0)
                 && (k.id !== 'turb' || this.secOn)
                 && (k.id !== 'tipd' || this.twoBank !== false);
      k.node.hidden = !shown;
      if (!shown) return;
      /* При включённом втором контуре температура на входе — уже не ручка:
         её приносит холодная нитка. Ползунок остаётся, но помечен как
         автоматический и заблокирован, чтобы никто не крутил величину,
         которую модель считает сама. */
      const auto = !!AUTO_OF[this.mode][k.id] || (k.id === 'tin' && this.secOn);
      const v = k.get();
      if (!fromUser) k.input.value = String(v);
      k.input.disabled = auto;
      const lim = auto && this.autoLimit[k.id];
      k.bNode.textContent = auto ? (lim ? tx('atLimit', this.lang) : tx('auto', this.lang))
                                 : tx('hand', this.lang);
      k.bNode.className = 'rcon-badge' + (auto ? (lim ? ' lim' : ' auto') : ' hand');
      const txt = nf(v, k.digits, this.lang) + (k.unit === '-' ? '' : ' ' + k.unit);
      k.vNode.textContent = txt;
      k.input.setAttribute('aria-valuetext', txt);
    }

    sampleForce() { this.tLastSample = -Infinity; this.sample(); }

    /* ---------------- отрисовка ---------------- */

    resolveColors() {
      const t = nowMs();
      if (t - this.colorsAt < 500) return this.colors;
      this.colorsAt = t;
      const cs = (typeof getComputedStyle === 'function' && this.root)
        ? getComputedStyle(this.root) : null;
      const out = {};
      for (const k of Object.keys(FALLBACK_COLOR)) {
        const v = cs ? cs.getPropertyValue(k).trim() : '';
        out[k] = v || FALLBACK_COLOR[k];
      }
      this.colors = out;
      return out;
    }

    paint(force) {
      if (!this.root) return;
      const t = nowMs();
      /* Текстовые поля обновляются не чаще 10 Гц: 60 Гц по DOM — это
         дёрганые цифры и лишняя работа, а не информация. Геометрия схемы
         идёт КАЖДЫЙ кадр — иначе движение стало бы дёрганым. */
      const slow = force || (t - this.uiAt > 100);
      if (slow) this.uiAt = t;
      const pr = this.probe();
      this.paintScheme(pr, slow);
      this.drawStrips(pr, slow);
      if (slow) { this.paintText(pr); this.updateEq(); }
    }

    /* ---------------- мнемосхема: кадр ---------------- */

    /** Диапазоны столбцов: только расширяются, округляются до круглых. */
    schemeScales(pr) {
      const r = this.scRaw;
      if (fin(pr.power)) r.powMax = Math.max(r.powMax, pr.power);
      r.powMax = Math.max(r.powMax, this.setPower, 1);
      if (fin(pr.Tf)) { r.tfLo = Math.min(r.tfLo, pr.Tf); r.tfHi = Math.max(r.tfHi, pr.Tf); }
      if (fin(pr.voidFraction)) r.vdMax = Math.max(r.vdMax, pr.voidFraction);
      const beta = fin(pr.betaEff) ? pr.betaEff * 1e5 : 650;
      let m = Math.max(r.rhoMax, beta * 1.25, 100);
      for (const [ch] of RHO_KEYS) m = Math.max(m, Math.abs(this.currentOf(ch, pr)) || 0);
      m = Math.max(m, Math.abs(pr.rhoTotal) || 0);
      r.rhoMax = m;
      this.sc.pow = niceBounds(0, r.powMax, { min: 0 });
      this.sc.tf = fin(r.tfLo) && fin(r.tfHi)
        ? niceBounds(r.tfLo, r.tfHi, { floorSpan: 20 }) : { lo: 0, hi: 1000 };
      this.sc.vd = niceBounds(0, Math.max(r.vdMax, 0.02), { min: 0, clamp: [0, 1] });
      /* Округление до 1/2/5·10^k здесь слишком грубое: при 2956 pcm шкала
         прыгнула бы на 5000 и итоговая полоска стала бы неразличимой.
         Шаг берём вчетверо мельче и округляем вверх по нему. */
      const st = niceStep(m / 4);
      this.sc.rho = Math.ceil(m / st) * st;
      return this.sc;
    }

    /**
     * Накопитель фазы анимации. Возвращает положение в [0, period).
     *
     * cap — потолок приращения за КАДР, доля периода. 0,34 выбрано из
     * условия Найквиста с запасом: при сдвиге ровно в половину периода
     * направление движения принципиально неразличимо, при большем — читается
     * как обратное. Треть периода за кадр — это уже очень быстрый бег,
     * дальше ускорять нечего: глаз всё равно не проследит.
     */
    advPhase(key, vPerSec, period, dtModel) {
      if (!this.phases) this.phases = {};
      const cur = num(this.phases[key], 0);
      let d = vPerSec * dtModel;
      if (!(d > 0)) d = 0;
      const cap = PHASE_CAP * period;
      if (d > cap) d = cap;
      const v = (cur + d) % period;
      this.phases[key] = v;
      return v;
    }

    paintScheme(pr, slow) {
      const n = this.sn;
      if (!n || !n.svg) return;
      const lg = this.lang, p = this.p;
      const A = (k, a, v) => { const e = n[k]; if (e) e.setAttribute(a, v); };
      const X = (k, v) => { const e = n[k]; if (e && e.textContent !== v) e.textContent = v; };
      const sc = this.schemeScales(pr);

      /* --- стержни обоих банков --- */
      const tipW = num(p.followerWorth, 0), tipLen = clamp01(num(p.followerLen, 0.1));
      /* Второй банк — это стержень с ВЫТЕСНИТЕЛЕМ: графитовый (или иной)
         наконечник, который при вводе сначала выгоняет из канала поглотитель
         послабее — воду — и потому добавляет реактивности прежде, чем
         отнимет. В реакторе без вытеснителя такого банка не бывает: у него
         нет ни собственного веса (worthTip), ни наконечника
         (followerWorth), он никуда не двигается и ни на что не влияет.
         Показывать неподвижную бутафорию, за которую можно тянуть и ничего
         не произойдёт, — врать интерфейсом. Поэтому банк без веса просто
         не рисуется. */
      const twoBank = num(p.worthTip, 0) !== 0 || tipW !== 0;
      this.twoBank = twoBank;
      A('bank.tipd', 'opacity', twoBank ? 1 : 0);
      A('bank.tipd', 'pointer-events', twoBank ? null : 'none');
      for (const b of BANKS) {
        if (b.id === 'tipd' && !twoBank) continue;
        const u = clamp01(b.id === 'reg' ? this.u.reg : this.u.tipd);
        const yb = rodBottom(u);
        const len = Math.max(0, yb - ROD_TOP);
        const hasTip = b.id === 'tipd' && Math.abs(tipW) > 1e-9;
        const hTip = hasTip ? Math.min(len, tipLen * CORE.h) : 0;
        for (let i = 0; i < b.rods.length; i++) {
          A(b.id + '.rod' + i, 'height', Math.max(0, len - hTip).toFixed(2));
          A(b.id + '.tip' + i, 'opacity', hasTip ? 1 : 0);
          A(b.id + '.tip' + i, 'y', (yb - hTip).toFixed(2));
          A(b.id + '.tip' + i, 'height', hTip.toFixed(2));
        }
        A(b.id + '.grip', 'transform', 'translate(0,' + (yb - 6).toFixed(2) + ')');
        /* упор — видимый упор */
        const auto = !!AUTO_OF[this.mode][b.id];
        A(b.id + '.stopHi', 'stroke', u >= 1 - 1e-9 ? S.BAD : S.MUT);
        A(b.id + '.stopHi', 'stroke-width', u >= 1 - 1e-9 ? 3.5 : 2);
        A(b.id + '.stopLo', 'stroke', u <= 1e-9 ? S.BAD : S.MUT);
        A(b.id + '.stopLo', 'stroke-width', u <= 1e-9 ? 3.5 : 2);

      }

      /* --- вход: температура --- */
      const kTin = this.knobDefs ? this.knobDefs.find((q) => q.id === 'tin') : null;
      const tLo = kTin ? kTin.min : 260, tHi = kTin ? kTin.max : 330;
      const Tin = this.d.Tin;
      const fTin = clamp01((Tin - tLo) / Math.max(tHi - tLo, 1e-9));
      const yTin = TH.bot - fTin * (TH.bot - TH.top);
      const cTin = tempColor(Tin, tLo, tHi);
      A('tin.fill', 'y', yTin.toFixed(2));
      A('tin.fill', 'height', Math.max(0, TH.bot - yTin).toFixed(2));
      A('tin.fill', 'fill', cTin);
      A('tin.bulb', 'fill', cTin);
      A('tin.grip', 'transform', 'translate(0,' + (yTin - 5).toFixed(2) + ')');

      /* --- кран расхода --- */
      const flow = this.d.flow;
      const fF = clamp01((flow - FLOW_MIN_CTL) / (FLOW_MAX_CTL - FLOW_MIN_CTL));
      const yF = VLV.bot - fF * (VLV.bot - VLV.top);
      A('flow.stem', 'y1', yF.toFixed(2));
      A('flow.grip', 'transform', 'translate(0,' + (yF - 5.5).toFixed(2) + ')');
      const fLim = flow <= FLOW_MIN_CTL + 1e-9, fMax = flow >= FLOW_MAX_CTL - 1e-9;
      A('flow.stopLo', 'stroke', fLim ? S.BAD : S.MUT);
      A('flow.stopLo', 'stroke-width', fLim ? 3.5 : 2);
      A('flow.stopHi', 'stroke', fMax ? S.BAD : S.MUT);
      A('flow.stopHi', 'stroke-width', fMax ? 3.5 : 2);
      const yNom = VLV.bot - (1 - FLOW_MIN_CTL) / (FLOW_MAX_CTL - FLOW_MIN_CTL)
        * (VLV.bot - VLV.top);
      A('flow.nom', 'y1', yNom.toFixed(2)); A('flow.nom', 'y2', yNom.toFixed(2));
      A('flow.nomt', 'y', (yNom + 3).toFixed(2));

      /* --- трубы: ширина по расходу, цвет по температуре, бег по модельному
             времени.

         ФАЗА НЕ ЕСТЬ ФУНКЦИЯ tModel — и это исправление, а не небрежность.
         Прежде смещение штриха бралось как -(k·tModel mod период). Формула
         красивая, при остановке картинка замирала, но она разваливается на
         ускорении: за кадр фаза сдвигается на k·Δt_модели, а Δt_модели =
         Δt_настенное · множитель. При ×100 и 60 к/с горячая нитка уезжала на
         ≈11,7 px за кадр при периоде штриха 20 px — то есть больше половины
         периода. Глаз читает такой сдвиг как движение НАЗАД на 8,3 px
         (эффект тележного колеса), а при ×1000 — как случайное дрожание.
         Пар и ротор турбины уходили в алиасинг ещё раньше: 43 px за кадр
         при периоде 17 и 367° за кадр соответственно. Отсюда и «огоньки
         бегут в обратную сторону, а от реактора к турбине — почти всегда»:
         быстрее всех была именно горячая нитка.

         Теперь фаза — НАКОПИТЕЛЬ. За кадр она растёт на k·Δt_модели, но не
         больше PHASE_CAP долей периода. Свойство «стоит модель — стоит
         картинка» сохранено полностью (Δt_модели = 0 ⇒ приращение 0), а
         вместо разворота на ускорении анимация просто упирается в потолок
         скорости: быстро, но в правильную сторону. --- */
      const Tout = pr.Tout, dTc = num(p.dTcool, 30);
      const cirLo = tLo - 20, cirHi = Math.max(tHi + dTc, cirLo + 40);
      const wPipe = 3.5 + 6.5 * clamp01(flow / FLOW_MAX_CTL);
      const dtM = Math.max(0, this.tModel - num(this.phaseAt, this.tModel));
      this.phaseAt = this.tModel;
      const off = -this.advPhase('prim', 7 * flow, 20, dtM);
      A('flow.in', 'stroke', tempColor(Tin, cirLo, cirHi));
      A('flow.in', 'stroke-width', wPipe.toFixed(2));
      A('flow.in', 'stroke-dashoffset', off.toFixed(2));
      A('flow.out', 'stroke', tempColor(Tout, cirLo, cirHi));
      A('flow.out', 'stroke-width', wPipe.toFixed(2));
      A('flow.out', 'stroke-dashoffset', off.toFixed(2));

      /* Второй контур: всё, что ДВИЖЕТСЯ, идёт каждый кадр — иначе бег пара
         и вращение ротора считались бы с шагом 10 Гц и дёргались бы, а
         накопитель фазы получал бы только последний из шести кадров и всё
         ехало бы вшестеро медленнее заказанного. Цифры и цвета остаются
         в медленной части ниже. */
      const sfA = this.secOn ? this.secLast : null;
      if (sfA) {
        A('sec.cold', 'stroke-dashoffset', off.toFixed(2));
        A('sec.steam', 'stroke-dashoffset',
          (-this.advPhase('steam', 26 * sfA.Qst, 17, dtM)).toFixed(2));
        /* Ротор — крест, период симметрии 90°, а не 360°: потолок берётся
           от 90, иначе колесо «поедет назад» вчетверо раньше. */
        A('sec.rotor', 'transform', 'translate(' + (TURB.x + TURB.w / 2) + ','
          + (TURB.y + TURB.h / 2) + ') rotate('
          + this.advPhase('rotor', 220 * sfA.Qst, 90, dtM).toFixed(1) + ')');
        const ps = this.advPhase('sgb', 0.5, 1, dtM);
        for (let i = 0; i < 6; i++) {
          const ph = (ps * (1 + i * 0.22) + i * 0.17) % 1;
          A('sg.b' + i, 'cy', (SG.y + SG.h - 20 - ph * (SG.h * 0.5)).toFixed(1));
          A('sg.b' + i, 'opacity', (0.85 * (1 - ph)).toFixed(2));
        }
      }

      /* --- зона: ЦВЕТ = критичность, ЯРКОСТЬ = мощность --- */
      const nRel = clamp01(pr.power / Math.max(sc.pow.hi, 1e-9));
      const dollars = fin(pr.rhoDollar) ? pr.rhoDollar
        : num(pr.rhoTotal, 0) * 1e-5 / Math.max(num(pr.betaEff, 0.0065), 1e-9);
      const melt = clamp01(this.melt);
      /* Выше нуля добавляется дыхание: чем ближе к мгновенной критичности,
         тем заметнее. Это не украшение — надкритичное состояние ДОЛЖНО
         выглядеть иначе, чем стоящее на месте. */
      const beat = dollars > 0.02
        ? 0.5 + 0.5 * Math.sin(this.tModel * (2 + 8 * clamp01(dollars)))
        : 0;
      const cRGB = critRGB(dollars);
      const mix = (c, t, f) => Math.round(c + (t - c) * f);
      A('core.crit', 'fill', melt > 0
        ? 'rgb(' + mix(cRGB[0], 255, melt) + ',' + mix(cRGB[1], 138, melt) + ','
                 + mix(cRGB[2], 20, melt) + ')'
        : critColor(dollars));
      A('core.crit', 'fill-opacity', (0.9 + 0.1 * beat).toFixed(3));
      A('core.glow', 'fill-opacity',
        (0.05 + 0.4 * nRel + 0.12 * beat * clamp01(dollars * 2) + 0.35 * melt).toFixed(3));
      {
        const xx = CRIT.x + CRIT.w * critFrac(dollars);
        A('crit.mark', 'd', 'M' + xx.toFixed(1) + ' ' + (CRIT.y + CRIT.h + 2)
          + 'l4.5 6h-9z');
      }

      /* --- расплав --- */
      if (melt > 0) {
        const hPool = (CORE.h - 8) * (0.15 + 0.55 * melt);
        A('melt.pool', 'opacity', (0.55 + 0.45 * melt).toFixed(3));
        A('melt.pool', 'y', (CORE_B - 3 - hPool).toFixed(2));
        A('melt.pool', 'height', hPool.toFixed(2));
        A('melt.pool', 'fill', melt > 0.6 ? '#ffd24a' : '#ff8a1e');
        A('melt.crack', 'opacity', melt > 0.35 ? 1 : 0);
        A('melt.crack', 'd', 'M' + (CORE.x + 40) + ' ' + (CORE.y + 6)
          + 'l18 34l-12 26l26 40l-8 30'
          + 'M' + (CORE.x + 168) + ' ' + (CORE.y + 4)
          + 'l-14 40l20 30l-10 34');
        for (let i = 0; i < 10; i++) {
          A('cass' + i, 'opacity', (0.32 * (1 - melt)).toFixed(3));
          A('cass' + i, 'y2', (CORE_B - 5 - (CORE.h - 20) * melt
            * (0.4 + 0.6 * ((i * 37) % 11) / 10)).toFixed(1));
        }
        this.meltDrawn = true;
      } else if (this.meltDrawn) {
        /* Зона восстановлена — снять расплав. Без этой ветки лужа кориума
           оставалась бы на схеме и после перезапуска: атрибуты, выставленные
           один раз, сами обратно не возвращаются. */
        this.meltDrawn = false;
        A('melt.pool', 'opacity', 0);
        A('melt.pool', 'height', 0);
        A('melt.crack', 'opacity', 0);
        for (let i = 0; i < 10; i++) {
          A('cass' + i, 'opacity', 0.32);
          A('cass' + i, 'y2', CORE_B - 5);
        }
      }

      /* --- кипение --- */
      const vf = num(pr.voidFraction, 0);
      if (vf > 1e-6) {
        A('bubs', 'opacity', 1);
        const pb = this.advPhase('bub', 0.22, 1, dtM);
        const span = Math.max(0.15, num(pr.boilLengthFraction, 1)) * CORE.h;
        const rr = 1.4 + 3.2 * clamp01(vf * 4);
        const op = clamp01(vf * 8).toFixed(3);
        for (let i = 0; i < NBUB; i++) {
          const ph = (pb * BUB[i].sp + BUB[i].ph) % 1;
          A('bub' + i, 'cy', (CORE_B - 6 - ph * span).toFixed(2));
          A('bub' + i, 'r', rr.toFixed(2));
          A('bub' + i, 'opacity', op);
        }
      } else {
        A('bubs', 'opacity', 0);
      }

      /* --- столбцы --- */
      const colFill = (c, v, b, color) => {
        const f = clamp01((v - b.lo) / Math.max(b.hi - b.lo, 1e-12));
        const h = f * (c.h - 4);
        A(c.key + '.fill', 'y', (c.bot - 2 - h).toFixed(2));
        A(c.key + '.fill', 'height', h.toFixed(2));
        A(c.key + '.fill', 'fill', color);
      };
      colFill(COL.pow, pr.power, sc.pow, S.ACC);
      colFill(COL.tf, pr.Tf, sc.tf, tempColor(pr.Tf, sc.tf.lo, sc.tf.hi));
      colFill(COL.vd, vf, sc.vd, S.B4);

      /* ручка на шкале мощности: уставка в holdPower, иначе — банк reg */
      const hold = this.mode === 'holdPower';
      const yPow = (val, b) => COL.pow.bot - 2
        - clamp01((val - b.lo) / Math.max(b.hi - b.lo, 1e-12)) * (COL.pow.h - 4);
      const ySet = yPow(hold ? this.setPower : pr.power, sc.pow);
      A('pow.set', 'transform', 'translate(0,' + ySet.toFixed(2) + ')');
      A('pow.set', 'opacity', hold ? 1 : 0);
      A('pow.grip', 'transform', 'translate(0,' + ySet.toFixed(2) + ')');
      A('pow.griph', 'fill', hold ? S.PANEL : S.BG);
      A('pow.griph', 'stroke', hold ? S.INK : S.B1);

      /* --- баланс реактивности --- */
      const m = sc.rho, k = RHO.half / Math.max(m, 1e-9);
      for (let i = 0; i < RHO_KEYS.length; i++) {
        const v = this.currentOf(RHO_KEYS[i][0], pr);
        const w = Math.min(RHO.half, Math.abs(fin(v) ? v : 0) * k);
        A('rho.b' + i, 'x', ((fin(v) && v >= 0) ? RHO.cx : RHO.cx - w).toFixed(2));
        A('rho.b' + i, 'width', w.toFixed(2));
      }
      const vt = num(pr.rhoTotal, 0);
      const wt = Math.min(RHO.half, Math.abs(vt) * k);
      A('rho.bt', 'x', (vt >= 0 ? RHO.cx : RHO.cx - wt).toFixed(2));
      A('rho.bt', 'width', wt.toFixed(2));
      const beta = num(pr.betaEff, 0.0065) * 1e5;
      const bx = beta * k;
      for (const [sg, sgn] of [['p', 1], ['m', -1]]) {
        const xx = RHO.cx + sgn * bx;
        const vis = bx <= RHO.half + 0.5;
        A('rho.beta' + sg, 'x1', xx.toFixed(2)); A('rho.beta' + sg, 'x2', xx.toFixed(2));
        A('rho.beta' + sg, 'opacity', vis ? 1 : 0);
        A('rho.betat' + sg, 'x', xx.toFixed(2));
        if (slow) X('rho.betat' + sg, vis ? (sgn > 0 ? '+β' : '−β') : '');
      }

      /* ------------------------------------------------------------------
         ЧИСЛО И СТОЛБЕЦ ОБЯЗАНЫ БЫТЬ ИЗ ОДНОГО КАДРА.

         Прежде геометрия рисовалась каждый кадр, а подписи — не чаще 10 Гц,
         «чтобы цифры не дёргались». Цена этой экономии: подпись отставала от
         своего же столбца на целый интервал обновления, а интервал в
         МОДЕЛЬНОМ времени равен 0,1 с × множитель. Измерено на pwr, сброс
         расхода до 0,6: расхождение столбца и подписи доходило до 5,3 % по
         мощности и 5,5 K по температуре топлива. Прибор, у которого стрелка
         и цифра показывают разное, — сломанный прибор, и дрожание последней
         цифры этого не стоит.

         Поэтому ВСЁ, что стоит рядом со своей геометрией — значения столбцов,
         концы их шкал, k_eff, температуры на схеме, — пишется каждый кадр,
         вместе с геометрией. Дрожания при этом почти нет: X() сравнивает
         строку и не трогает DOM, если отформатированное значение не
         изменилось. В медленной части остаётся только то, у чего нет
         геометрической пары: подписи, чипы режимов, список упоров и
         текстовая альтернатива. ------------------------------------------ */
      X('tin.val', nf(Tin, 1, lg) + ' °C');
      const fAuto = !!AUTO_OF[this.mode].flow;
      X('flow.val', nf(flow, 3, lg) + (fAuto ? ' ' + tx('auto', lg) : ''));
      A('flow.val', 'fill', fAuto ? S.OK : S.INK);
      X('tout.val', nf(Tout, 1, lg) + ' °C');
      X('rise.t', '+' + nf(num(pr.coolantRise, NaN), 1, lg) + ' K');
      X('crit.word', tx(critWord(dollars), lg));
      A('crit.word', 'fill', critColor(dollars));
      const kk = keffOf(pr.rhoTotal);
      X('keff.val', Number.isFinite(kk) ? nf(kk, 5, lg) : '∞');
      X('keff.d', nf(dollars, 3, lg) + ' $');
      A('keff.d', 'fill', dollars >= 1 ? S.BAD : (dollars > 0 ? S.WARM : S.MUT));
      X('pow.hi', nf(sc.pow.hi, 0, lg)); X('pow.lo', nf(sc.pow.lo, 0, lg));
      X('pow.val', nf(pr.power, 2, lg) + ' %');
      X('tf.hi', nf(sc.tf.hi, 0, lg)); X('tf.lo', nf(sc.tf.lo, 0, lg));
      X('tf.val', nf(pr.Tf, 1, lg) + ' °C');
      X('vd.hi', nf(sc.vd.hi, 3, lg)); X('vd.lo', nf(sc.vd.lo, 3, lg));
      X('vd.val', nf(vf, 4, lg));
      X('rho.el', '−' + nf(m, 0, lg) + ' pcm');
      X('rho.er', '+' + nf(m, 0, lg) + ' pcm');
      X('eq.rho', 'ρ = ' + nf(num(pr.rhoTotal, NaN), 1, lg) + ' pcm');
      const sfF = this.secLast;
      if (this.secOn && sfF) {
        X('sg.val', nf(this.sec.Ts, 1, lg) + ' °C');
        X('sg.p', nf(sfF.pMPa, 2, lg) + ' MPa');
        X('turb.val', nf(sfF.mwElec, 0, lg) + ' MW · ' + nf(100 * sfF.Qst, 1, lg) + ' %');
        A('sg.fill', 'fill', tempColor(this.sec.Ts, cirLo, cirHi));
        A('sec.vstem', 'y2', (STEAM_Y - 22 + 13 * clamp01(this.turbine / SEC_Y_MAX)).toFixed(1));
        A('sec.steam', 'stroke-width', (3 + 5 * clamp01(sfF.Qst)).toFixed(2));
        A('sec.steam', 'opacity', clamp01(0.15 + sfF.Qst).toFixed(2));
        A('sec.cold', 'stroke', tempColor(this.d.Tin, cirLo, cirHi));
        A('sec.cold', 'stroke-width', wPipe.toFixed(2));
      } else {
        X('sg.val', ''); X('sg.p', ''); X('turb.val', '');
      }
      for (const b of BANKS) {
        const uu = clamp01(b.id === 'reg' ? this.u.reg : this.u.tipd);
        const us = clamp01(this.uSet[b.id]);
        const au = !!AUTO_OF[this.mode][b.id];
        const moving = Math.abs(us - uu) > 5e-4;
        X(b.id + '.val', nf(uu, 3, lg)
          + (au ? ' ' + tx('auto', lg) : (moving ? ' \u2192 ' + nf(us, 3, lg) : '')));
        A(b.id + '.val', 'fill', au ? S.OK : (moving ? S.ACC : S.INK));
        /* Куда едет банк — отдельной риской на его шкале. */
        A(b.id + '.dem', 'opacity', moving ? 1 : 0);
        A(b.id + '.dem', 'transform', 'translate(0,' + rodBottom(us).toFixed(2) + ')');
      }

      if (!slow) return;

      /* --- дальше только то, у чего нет геометрической пары: не чаще 10 Гц --- */
      X('tin.hi', nf(tHi, 0, lg) + ' °C');
      X('tin.lo', nf(tLo, 0, lg) + ' °C');
      X('flow.hi', nf(FLOW_MAX_CTL, 2, lg));
      X('flow.lo', nf(FLOW_MIN_CTL, 2, lg));
      X('flow.nomt', nf(1, 2, lg));
      X('crit.cap', tx('critCap', lg));
      A('sec', 'opacity', this.secOn ? 1 : 0.22);
      X('sec.off', this.secOn ? '' : tx('lblSecOff', lg));
      const isDrum = !!(this.sec && this.sec.drum);
      X('sg.cap', tx(isDrum ? 'lblDrum' : 'lblSG', lg));
      X('turb.cap', tx('lblTurbine', lg));
      A('sg.tubes', 'opacity', isDrum ? 0 : 1);
      A('sg.sep', 'opacity', isDrum ? 1 : 0);
      X('boil.t', pr.boiling ? tx('boilingOn', lg) + ' · T_sat '
        + nf(num(pr.Tsat, NaN), 0, lg) + ' °C' : '');

      /* чипы «что чем управляет» */
      const chips = [['rodsShort', !!AUTO_OF[this.mode].reg],
                     ['flowShort', !!AUTO_OF[this.mode].flow],
                     ['inletShort', false]];
      for (let i = 0; i < chips.length; i++) {
        const auto = chips[i][1];
        const lim = auto && this.autoLimit[i === 0 ? 'reg' : 'flow'];
        X('chip' + i + '.t', tx(chips[i][0], lg) + ' · '
          + (auto ? (lim ? tx('atLimit', lg) : tx('auto', lg)) : tx('hand', lg)));
        A('chip' + i + '.t', 'fill', lim ? S.BAD : (auto ? S.OK : S.ACC));
        A('chip' + i + '.b', 'stroke', lim ? S.BAD : (auto ? S.OK : S.ACC));
      }

      /* равновесие и упоры */
      const rho = num(pr.rhoTotal, NaN);
      const steady = fin(rho) && Math.abs(rho) < 1;
      X('eq.hdr', this.fail ? tx('failTitle', lg)
        : (steady ? tx('atEq', lg) : tx('seeking', lg)));
      X('eq.dir', this.eqFeasible === false ? tx('noEq', lg)
        : (steady ? '' : (rho > 0 ? tx('rising', lg) : tx('falling', lg))));
      const ax = EQB.x + EQB.w - 22, ay = EQB.y + 34;
      const asz = 4 + 8 * clamp01(Math.abs(rho) / Math.max(beta, 1));
      A('eq.arrow', 'opacity', steady || !fin(rho) ? 0 : 1);
      A('eq.arrow', 'fill', rho > 0 ? S.BAD : S.COLD);
      A('eq.arrow', 'd', rho > 0
        ? 'M' + ax + ' ' + (ay - asz) + 'l' + asz + ' ' + (asz * 1.6) + 'h' + (-2 * asz) + 'z'
        : 'M' + ax + ' ' + (ay + asz) + 'l' + asz + ' ' + (-asz * 1.6) + 'h' + (-2 * asz) + 'z');
      /* Ведущая обратная связь: самая крупная по модулю из четырёх, считая
         от её значения В ПОСЛЕДНЕМ РАВНОВЕСИИ, а не от нуля. Иначе
         «ведущим» всегда оказывался бы ксенон — он просто самый большой по
         абсолютной величине и при этом почти не меняется. */
      const FB = [['rhoXe', 'trXe'], ['rhoDop', 'trDop'],
                  ['rhoCool', 'trCool'], ['rhoVoid', 'trVoid']];
      /* Отсчёт ведётся от ПОСЛЕДНЕГО равновесия: пока |rho| < 1 pcm, база
         переписывается, дальше замирает. Поэтому строка отвечает на вопрос
         «что изменилось с тех пор, как всё стояло», а не «что больше всех по
         абсолютной величине» — иначе ведущим всегда был бы ксенон. */
      if (!this.rhoBase || steady) {
        this.rhoBase = {};
        for (const [ch] of FB) this.rhoBase[ch] = num(this.currentOf(ch, pr), 0);
      }
      let wCh = null, wVal = 0;
      for (const [ch, nameKey] of FB) {
        const dv = num(this.currentOf(ch, pr), 0) - num(this.rhoBase[ch], 0);
        if (Math.abs(dv) > Math.abs(wVal)) { wVal = dv; wCh = nameKey; }
      }
      if (wCh && Math.abs(wVal) >= 1) {
        X('eq.why', tx('leads', lg) + ' ' + tx(wCh, lg) + ' '
          + (wVal > 0 ? '+' : '\u2212') + nf(Math.abs(wVal), 0, lg) + ' pcm');
        A('eq.why', 'fill', wVal > 0 ? S.BAD : S.COLD);
      } else {
        X('eq.why', '');
      }

      const stops = this.stopList();
      X('eq.stophdr', tx('stops', lg));
      for (let i = 0; i < 3; i++) {
        const has = i < stops.length;
        const line = has ? stops[i] : tx('stopNone', lg);
        X('eq.stop' + i, (has || i === 0)
          ? '· ' + (line.length > 24 ? line.slice(0, 23) + '…' : line) : '');
        A('eq.stop' + i, 'fill', has ? S.BAD : S.MUT);
      }

      /* отказ модели — и на картинке тоже, не только в текстовой плашке */
      const code = this.fail ? this.fail.code : null;
      A('sfail', 'opacity', code ? 1 : 0);
      if (code !== this.schemeFailShown) {
        this.schemeFailShown = code;
        X('sfail.h', code
          ? (this.meltTarget ? tx('meltTitle', lg) : tx('failTitle', lg)) + ' \u2014 ' + code
          : '');
        this.svgLines('sfail.t', code
          ? (this.fail.i18n ? pick(this.fail.i18n, lg) : '') : '', 118, 4);
      }

      this.writeSchemeAlt(pr, sc, stops);
      this.syncHandles();
      this.syncHandleAria();
    }

    /** Упоры, которые сейчас достигнуты, — словами и одинаково для картинки
        и для текстовой альтернативы. */
    stopList() {
      const lg = this.lang, out = [];
      if (this.d.flow <= FLOW_MIN_CTL + 1e-9) out.push(tx('stopFlowMin', lg));
      if (this.d.flow >= FLOW_MAX_CTL - 1e-9) out.push(tx('stopFlowMax', lg));
      if (this.u.reg >= 1 - 1e-9) out.push(tx('stopRegOut', lg));
      if (this.u.reg <= 1e-9) out.push(tx('stopRegIn', lg));
      /* Упоры несуществующего банка — не упоры. */
      if (this.twoBank !== false) {
        if (this.u.tipd >= 1 - 1e-9) out.push(tx('stopTipdOut', lg));
        if (this.u.tipd <= 1e-9) out.push(tx('stopTipdIn', lg));
      }
      return out;
    }

    /** Многострочный текст в SVG: tspan'ы, потому что <text> не переносит. */
    svgLines(key, str, perLine, maxLines) {
      const e = this.sn[key];
      if (!e) return;
      while (e.firstChild) e.removeChild(e.firstChild);
      if (!str) return;
      const words = String(str).split(/\s+/);
      const lines = [];
      let cur = '';
      for (const w of words) {
        if (!cur.length) { cur = w; continue; }
        if (cur.length + 1 + w.length > perLine) { lines.push(cur); cur = w; }
        else cur += ' ' + w;
        if (lines.length >= maxLines) break;
      }
      if (lines.length < maxLines && cur.length) lines.push(cur);
      const doc = e.ownerDocument;
      for (let i = 0; i < lines.length && i < maxLines; i++) {
        const ts = doc.createElementNS(SVGNS, 'tspan');
        ts.setAttribute('x', e.getAttribute('x'));
        ts.setAttribute('dy', i === 0 ? 0 : 15);
        /* textContent склеивает tspan'ы подряд, поэтому пробел на конце строки
           обязателен: иначе «the» и «period» слипаются в одно слово. */
        ts.textContent = lines[i] + (i < lines.length - 1 ? ' ' : '');
        e.appendChild(ts);
      }
    }

    /** Текстовая альтернатива схемы: то же самое словами. */
    writeSchemeAlt(pr, sc, stops) {
      const node = this.nodes.schemealt;
      if (!node) return;
      const lg = this.lang;
      const parts = [tx('schemeAlt', lg) + '.'];
      parts.push(tx('sPower', lg) + ' ' + nf(pr.power, 2, lg) + ' % ('
        + tx('axisFrom', lg) + ' ' + nf(sc.pow.lo, 0, lg) + ', '
        + tx('axisTo', lg) + ' ' + nf(sc.pow.hi, 0, lg) + ').');
      parts.push(tx('ctlReg', lg) + ' ' + nf(this.u.reg, 3, lg) + '; '
        + tx('ctlTipd', lg) + ' ' + nf(this.u.tipd, 3, lg) + '. ' + tx('rodPosHint', lg));
      parts.push(tx('ctlFlow', lg) + ' ' + nf(this.d.flow, 3, lg) + ' ('
        + nf(FLOW_MIN_CTL, 2, lg) + '…' + nf(FLOW_MAX_CTL, 2, lg) + '; '
        + nf(1, 2, lg) + ' = ' + tx('nominalLbl', lg) + ').');
      parts.push(tx('ctlTin', lg) + ' ' + nf(this.d.Tin, 1, lg) + ' °C; '
        + tx('sTout', lg) + ' ' + nf(pr.Tout, 1, lg) + ' °C; '
        + tx('sTf', lg) + ' ' + nf(pr.Tf, 1, lg) + ' °C.');
      parts.push(tx('sVoid', lg) + ' ' + nf(pr.voidFraction, 4, lg) + ' — '
        + (pr.boiling ? tx('boilingOn', lg) : tx('boilingOff', lg)) + '.');
      parts.push(tx('sRho', lg) + ': ' + RHO_KEYS.map(([ch, nm]) =>
        tx(nm, lg) + ' ' + nf(this.currentOf(ch, pr), 0, lg)).join(', ')
        + ', ' + tx('trTotal', lg) + ' ' + nf(pr.rhoTotal, 0, lg) + ' pcm.');
      const rho = num(pr.rhoTotal, NaN);
      parts.push((Math.abs(rho) < 1 ? tx('atEq', lg)
        : tx('seeking', lg) + ' — ' + (rho > 0 ? tx('rising', lg) : tx('falling', lg))) + '.');
      parts.push(tx('stops', lg) + ': '
        + (stops.length ? stops.join(', ') : tx('stopNone', lg)) + '.');
      const au = AUTO_OF[this.mode];
      parts.push(tx('drives', lg) + ': '
        + tx('rodsShort', lg) + ' ' + (au.reg ? tx('auto', lg) : tx('hand', lg)) + ', '
        + tx('flowShort', lg) + ' ' + (au.flow ? tx('auto', lg) : tx('hand', lg)) + ', '
        + tx('inletShort', lg) + ' ' + tx('hand', lg) + '.');
      parts.push(tx('kbdHint', lg));
      if (this.fail) parts.push(tx('failTitle', lg) + ' — ' + this.fail.code + '.');
      const str = parts.join(' ');
      if (node.textContent !== str) node.textContent = str;
    }

    /** Имя, роль и значение каждой ручки — на текущем языке и в текущем режиме. */
    /* Зона захвата несуществующего банка не должна ловить ни мышь, ни Tab. */
    syncHandles() {
      if (!this.root) return;
      const h = this.root.querySelector('.rcon-svg [data-h="tipd"]');
      if (!h) return;
      const on = this.twoBank !== false;
      h.setAttribute('pointer-events', on ? 'all' : 'none');
      /* Зона захвата рисуется пунктиром на фокусе и наведении — у
         несуществующего банка она бы висела пустой рамкой. */
      h.style.display = on ? '' : 'none';
      if (on) h.setAttribute('tabindex', '0'); else h.removeAttribute('tabindex');
      h.setAttribute('aria-hidden', on ? 'false' : 'true');
    }

    syncHandleAria() {
      if (!this.root) return;
      const lg = this.lang;
      for (const id of HANDLE_IDS) {
        const h = this.root.querySelector('[data-h="' + id + '"]');
        if (!h) continue;
        const sp = this.hSpec(id);
        if (!sp || !sp.k) continue;
        const auto = !!AUTO_OF[this.mode][sp.k.id];
        const v = sp.k.get();
        const txt = nf(v, sp.digits, lg) + (sp.unit ? ' ' + sp.unit : '');
        h.setAttribute('aria-label', tx(sp.nameKey, lg));
        h.setAttribute('aria-valuemin', sp.k.min);
        h.setAttribute('aria-valuemax', sp.k.max);
        h.setAttribute('aria-valuenow', Number(v.toFixed(4)));
        h.setAttribute('aria-valuetext', txt
          + (auto ? ' — ' + tx('auto', lg) : ' — ' + tx('hand', lg)));
        h.setAttribute('aria-disabled', auto ? 'true' : 'false');
        h.setAttribute('aria-orientation', 'vertical');
      }
    }

    /** Численный снимок схемы: чем проверять, что она в самом деле двигается. */
    schemeInfo() {
      const n = this.sn || {};
      const g = (k, a) => { const e = n[k]; return e ? parseFloat(e.getAttribute(a)) : NaN; };
      const ty = (k) => {
        const e = n[k];
        if (!e) return NaN;
        const m = /translate\(0,\s*(-?[\d.]+)\)/.exec(e.getAttribute('transform') || '');
        return m ? parseFloat(m[1]) : NaN;
      };
      return {
        rodReg: g('reg.rod0', 'height'), rodTipd: g('tipd.rod0', 'height'),
        tipTipd: g('tipd.tip0', 'height'),
        gripReg: ty('reg.grip'), gripTipd: ty('tipd.grip'),
        gripFlow: ty('flow.grip'), gripTin: ty('tin.grip'), gripPow: ty('pow.grip'),
        setLine: g('pow.set', 'opacity'),
        tinFill: g('tin.fill', 'height'), flowStem: g('flow.stem', 'y1'),
        pipeW: g('flow.in', 'stroke-width'), dash: g('flow.in', 'stroke-dashoffset'),
        glow: g('core.glow', 'fill-opacity'),
        powFill: g('pow.fill', 'height'), tfFill: g('tf.fill', 'height'),
        vdFill: g('vd.fill', 'height'),
        bubY: g('bub0', 'cy'), bubOp: g('bub0', 'opacity'),
        rhoTot: g('rho.bt', 'width'), rhoRod: g('rho.b0', 'width'),
        rhoTotX: g('rho.bt', 'x'),
        failOp: g('sfail', 'opacity'),
        stopFlowLo: g('flow.stopLo', 'stroke-width'),
        stopRegHi: g('reg.stopHi', 'stroke-width'),
        scales: { pow: this.sc.pow, tf: this.sc.tf, vd: this.sc.vd, rho: this.sc.rho },
        dragCount: this.dragCount,
        alt: this.nodes.schemealt ? this.nodes.schemealt.textContent : '',
        eq: !!this.eq
      };
    }

    paintText(pr) {
      const lg = this.lang, n = this.nodes;
      n.run.textContent = this.running ? tx('stop', lg) : tx('start', lg);
      n.run.setAttribute('aria-pressed', this.running ? 'true' : 'false');
      const st = this.fail ? tx('stFailed', lg)
        : (this.suspended ? tx('stSuspended', lg)
        : (this.running ? tx('stRunning', lg) : tx('stStopped', lg)));
      const extra = (!this.running && !this.fail && reducedMotion())
        ? ' — ' + tx('reducedMotion', lg) : '';
      n.status.textContent = st + extra;
      const behind = this.achieved > 0 && this.achieved < this.speed * 0.9;
      n.clocks.innerHTML =
        '<span>' + esc(tx('modelTime', lg)) + ': <b>' + esc(fmtClock(this.tModel, lg)) + '</b></span>' +
        '<span>' + esc(tx('wallTime', lg)) + ': <b>' + esc(fmtClock(this.tWall, lg)) + '</b></span>' +
        '<span>' + esc(tx('requested', lg)) + ' ×' + esc(nf(this.speed, 0, lg)) +
          ' / ' + esc(tx('achieved', lg)) + ' <b class="' + (behind ? 'rcon-warn' : '') + '">×' +
          esc(nf(this.achieved, this.achieved < 10 ? 2 : 0, lg)) + '</b></span>' +
        '<span>' + esc(tx('sampledEvery', lg)) + ' ' +
          esc(nf(this.sampleStep(), 2, lg)) + ' ' + esc(tx('secs', lg)) + '</span>' +
        (behind ? '<span class="rcon-warn">' + esc(tx('behind', lg)) + '</span>' : '');
      this.paintFacts(pr);
      this.paintFail();
      for (const k of this.knobDefs) this.syncOne(k, false);
    }

    paintFacts(pr) {
      const lg = this.lang, p = this.p, P = this.plant;
      const spec = P.params.find((q) => q.key === 'spectrum');
      const specOpt = spec && spec.options
        ? spec.options.find((o) => o.value === Number(num(p.spectrum, 0))) : null;
      const av = num(p.alphaVoid, 0);
      const rows = [
        [tx('betaEff', lg), nf(pr.betaEff * 1e5, 0, lg) + ' pcm ('
          + nf(pr.betaEff * 100, 3, lg) + ' %)'],
        [tx('lambdaGen', lg), ne(pr.Lambda, 2, lg) + ' ' + tx('secs', lg)],
        [tx('spectrumLbl', lg), specOpt ? pick(specOpt.label, lg) : String(pr.spectrum)],
        [tx('enrichLbl', lg), nf(num(p.enrichment, 100), 1, lg) + ' %'],
        [tx('rhoDollars', lg), nf(pr.rhoDollar, 4, lg) + ' $ — '
          + tx('promptAt', lg) + ' 1,00 $ = ' + nf(pr.betaEff * 1e5, 0, lg) + ' pcm'],
        [tx('periodLbl', lg), fmtPeriod(pr.period, lg)],
        [tx('bankWorth', lg), 'reg ' + nf(pr.rhoRodBank.reg, 0, lg)
          + ' pcm · tipd ' + nf(pr.rhoRodBank.tipd, 0, lg) + ' pcm'],
        [tx('alphaDLbl', lg), nf(num(p.alphaD, 0), 2, lg) + ' pcm/K · '
          + nf(pr.alphaDollarPerK * 1000, 3, lg) + ' m$/K'],
        [tx('alphaCLbl', lg), nf(num(p.alphaC, 0), 1, lg) + ' pcm/K'],
        [tx('alphaVLbl', lg), nf(av, 0, lg) + ' pcm — '
          + (av > 0 ? tx('voidPos', lg) : tx('voidNeg', lg))],
        [tx('sVoid', lg), nf(pr.voidFraction, 4, lg) + ' — '
          + (pr.boiling ? tx('boilingOn', lg) : tx('boilingOff', lg))]
      ];
      this.nodes.facts.innerHTML = rows.map(([k, v]) =>
        '<div class="rcon-kv2"><span class="k">' + esc(k) + '</span><span class="v">'
        + esc(v) + '</span></div>').join('');
    }

    paintFail() {
      const f = this.fail, node = this.nodes.fail, lg = this.lang;
      if (!f) {
        node.hidden = true; node.innerHTML = '';
        node.classList.remove('melt');
        return;
      }
      if (this.failShown === f.code && this.failLang === lg) return;
      this.failShown = f.code; this.failLang = lg;
      const msg = f.i18n ? pick(f.i18n, lg) : f.code;
      const melting = this.meltTarget !== 0;
      node.hidden = false;
      node.className = 'rcon-fail' + (melting ? ' melt' : '');
      node.innerHTML =
        '<div class="rcon-failtop">'
        + '<span class="rcon-failsign" aria-hidden="true">' + (melting ? '\u2622' : '\u23FB') + '</span>'
        + '<div><p class="rcon-failhdr">'
          + esc(melting ? tx('meltTitle', lg) : tx('failTitle', lg))
          + '</p><p class="rcon-failsub"><code>' + esc(f.code) + '</code> \u00B7 '
          + esc(tx('meltAt', lg)) + ' t = ' + esc(this.fmtDur(f.tModel)) + '</p></div></div>'
        + '<p class="rcon-faillead">' + esc(tx('meltLead', lg)) + '</p>'
        + '<p>' + esc(msg) + '</p>'
        + '<p><b>' + esc(tx('failWhat', lg)) + ':</b> ' + esc(tx(f.hintKey, lg)) + '</p>'
        + '<p class="rcon-failbtns">'
          + '<button type="button" class="rcon-btn danger" data-k="restart">'
            + esc(tx('btnRestart', lg)) + '</button>'
          + '<button type="button" class="rcon-btn" data-k="recover">'
            + esc(tx('btnRewind', lg)) + '</button></p>';
    }

    drawStrips(pr, slow) {
      const C = this.resolveColors();
      const ring = this.ring;
      const tHi = this.tModel;
      const tLo = tHi - this.windowSec;
      const j0 = ring.firstAtOrAfter(tLo);
      const lg = this.lang;
      const dpr = (typeof devicePixelRatio === 'number' && devicePixelRatio > 0)
        ? Math.min(devicePixelRatio, 2) : 1;

      for (const s of this.strips) {
        const cv = s.cv, ctx = s.ctx;
        const cssW = Math.max(80, cv.clientWidth || cv.parentNode.clientWidth || 320);
        const cssH = Math.max(40, cv.clientHeight || 78);
        if (s.w !== cssW || s.h !== cssH) {
          cv.width = Math.round(cssW * dpr);
          cv.height = Math.round(cssH * dpr);
          s.w = cssW; s.h = cssH;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, cssW, cssH);

        /* границы шкалы по видимому окну */
        let lo = Infinity, hi = -Infinity;
        for (const tr of s.def.traces) {
          const arr = ring.v[tr.ch];
          for (let j = j0; j < ring.n; j++) {
            const v = arr[ring.idx(j)];
            if (!fin(v)) continue;
            if (v < lo) lo = v;
            if (v > hi) hi = v;
          }
        }
        const b = niceBounds(lo, hi, s.def);
        s.bounds = b;
        const span = (b.hi - b.lo) || 1;
        const PAD = 2;
        const yOf = (v) => (cssH - PAD) - (v - b.lo) / span * (cssH - 2 * PAD);
        const xOf = (t) => (t - tLo) / this.windowSec * cssW;

        /* сетка и нулевая линия */
        ctx.strokeStyle = C['--grid']; ctx.lineWidth = 1;
        ctx.beginPath();
        for (let g = 1; g < 4; g++) {
          const y = Math.round(cssH * g / 4) + 0.5;
          ctx.moveTo(0, y); ctx.lineTo(cssW, y);
        }
        ctx.stroke();
        if (b.lo < 0 && b.hi > 0) {
          ctx.strokeStyle = C['--ink2']; ctx.globalAlpha = 0.5;
          ctx.beginPath();
          const y0 = Math.round(yOf(0)) + 0.5;
          ctx.moveTo(0, y0); ctx.lineTo(cssW, y0);
          ctx.stroke(); ctx.globalAlpha = 1;
        }

        /* трассы */
        ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        for (const tr of s.def.traces) {
          const arr = ring.v[tr.ch];
          ctx.strokeStyle = C[tr.color] || FALLBACK_COLOR[tr.color] || '#000';
          ctx.setLineDash(tr.dash || []);
          ctx.beginPath();
          let started = false;
          for (let j = j0; j < ring.n; j++) {
            const i = ring.idx(j);
            const v = arr[i];
            if (!fin(v)) { started = false; continue; }
            const x = xOf(ring.t[i]), y = yOf(v);
            if (started) ctx.lineTo(x, y); else { ctx.moveTo(x, y); started = true; }
          }
          ctx.stroke();
        }
        ctx.setLineDash([]);

        if (!slow) continue;
        /* Подписи концов шкалы — абсолютные значения, правило сайта. */
        const f = s.def.expo ? ((v) => ne(v, 2, lg)) : ((v) => nf(v, s.def.digits, lg));
        s.hi.textContent = f(b.hi);
        s.lo.textContent = f(b.lo);
        const cur = s.def.traces.map((tr) => {
          const nm = tr.name ? tx(tr.name, lg) + ' ' : '';
          return nm + f(this.currentOf(tr.ch, pr));
        }).join(' · ');
        s.nowN.textContent = cur;
        cv.setAttribute('aria-label', this.stripAlt(s, b, f, j0, pr));
      }
    }

    currentOf(ch, pr) {
      switch (ch) {
        case 'power': return pr.power;
        case 'phi': return pr.phi;
        case 'rhoXe': return pr.rhoXe;
        case 'Tf': return pr.Tf;
        case 'Tout': return pr.Tout;
        case 'voidFrac': return pr.voidFraction;
        case 'uReg': return pr.rodBankPos.reg;
        case 'uTipd': return pr.rodBankPos.tipd;
        case 'rhoRod': return pr.rhoCtrl;
        case 'rhoDop': return pr.rhoDoppler;
        case 'rhoCool': return pr.rhoCoolant;
        case 'rhoVoid': return pr.rhoVoid;
        case 'rhoTot': return pr.rhoTotal;
        case 'flow': return pr.flow;
        case 'Tin': return pr.Tin;
        case 'keff': return keffOf(pr.rhoTotal);
        case 'Tsg': return this.secOn ? this.sec.Ts : NaN;
        case 'pSG': return this.secOn && this.secLast ? this.secLast.pMPa : NaN;
        case 'mwE': return this.secOn && this.secLast ? this.secLast.Qst : NaN;
        case 'Qsg': return this.secOn && this.secLast ? this.secLast.Qsg : NaN;
        default: return NaN;
      }
    }

    /** Текстовая альтернатива ленты: что за величина, где концы шкалы,
        что сейчас, какой размах в окне и за какое время окно. */
    stripAlt(s, b, f, j0, pr) {
      const lg = this.lang;
      let lo = Infinity, hi = -Infinity;
      for (const tr of s.def.traces) {
        const arr = this.ring.v[tr.ch];
        for (let j = j0; j < this.ring.n; j++) {
          const v = arr[this.ring.idx(j)];
          if (!fin(v)) continue;
          if (v < lo) lo = v;
          if (v > hi) hi = v;
        }
      }
      const parts = [tx(s.def.key, lg) + ', ' + s.def.unit + '.'];
      parts.push(tx('axisFrom', lg) + ' ' + f(b.lo) + ', ' + tx('axisTo', lg) + ' ' + f(b.hi) + '.');
      parts.push(tx('now', lg) + ' ' + s.def.traces.map((tr) =>
        (tr.name ? tx(tr.name, lg) + ' ' : '') + f(this.currentOf(tr.ch, pr))).join(', ') + '.');
      if (fin(lo) && fin(hi)) {
        parts.push(tx('inWindow', lg) + ' ' + f(lo) + ' … ' + f(hi)
          + ' (' + this.fmtDur(this.windowSec) + ').');
      }
      return parts.join(' ');
    }

    /* ---------------- публичные операции ---------------- */

    setLang(lang) {
      if (LANGS.indexOf(lang) < 0) return this;
      this.lang = lang;
      this.relabel();
      if (this.eq && this.eq.setLang) {
        try { this.eq.setLang(lang); } catch (e) { /* чужой модуль — не наша беда */ }
      }
      return this;
    }

    setMode(m) {
      if (MODES.indexOf(m) < 0) return this;
      this.mode = m;
      /* Безударный переход: уставка берётся с текущего значения. */
      const pr = this.probe();
      if (m === 'holdPower') this.setPower = pr.power;
      if (m === 'holdTemp') { this.setTemp = pr.Tout; this.flowI = this.d.flow; }
      this.autoLimit = { reg: false, flow: false };
      if (this.nodes.mode) this.nodes.mode.value = m;
      this.syncControls();
      this.syncHandleAria();
      this.paint(true);
      return this;
    }

    setPreset(id) {
      const was = this.running;
      this.stop();
      this.applyPreset(id, true);
      this.reset();
      if (this.nodes.preset) this.nodes.preset.value = this.presetId || '';
      this.relabel();
      if (was) this.start();
      return this;
    }

    setSpeed(k) {
      if (!fin(k) || k <= 0) return this;
      this.speed = k;
      this.calmSpeed = k;
      if (this.nodes.speed) this.nodes.speed.value = String(k);
      this.achAcc = { model: 0, wall: 0 };
      this.paint(true);
      return this;
    }

    setWindow(sec) {
      if (!fin(sec) || sec <= 0) return this;
      this.windowSec = sec;
      if (this.nodes.window) this.nodes.window.value = String(sec);
      this.paint(true);
      return this;
    }

    /* Скорость привода в единицах хода за секунду — ОДНА И ТА ЖЕ для
       автоматики и для руки. Прежде автомат был ограничен 0,05 доллара в
       секунду, а ползунок был командой ПОЛОЖЕНИЯ без всякого ограничения:
       один протяг на 0,10 хода = 800 pcm = 1,14 доллара за один кадр на
       pwr, то есть мгновенная критичность движением мыши. Именно это, а не
       обратные связи, и взрывало зону в сценарии «дёрнул вниз и обратно»:
       оператор думал, что вернул стержни, а на самом деле выполнил
       извлечение на 2,3 доллара, которого не может ни один привод.
       Теперь ползунок задаёт УСТАВКУ, а банк едет к ней с той же скоростью,
       что и в автомате. Куда он едет, видно по самому ползунку. */
    rodRate(bankId) {
      const P = this.plant, p = this.p;
      const banks = P.rodWorthBanks(this.u, p);
      const slope = Math.abs(banks.dTotalDu);
      const beta = P.betaEff(p) * 1e5;
      return slope > 1e-9 ? Math.min(0.05, ROD_DOLLARS_PER_S * beta / slope) : 0.05;
    }

    /** Довести банки к своим уставкам за dt модельных секунд. */
    driveBanks(dt) {
      for (const id of ['reg', 'tipd']) {
        const tgt = this.uSet && fin(this.uSet[id]) ? this.uSet[id] : this.u[id];
        const d = tgt - this.u[id];
        if (d === 0) continue;
        const step = this.rodRate(id) * dt;
        this.u[id] = Math.abs(d) <= step ? tgt
                   : clamp01(this.u[id] + (d > 0 ? step : -step));
      }
    }

    setControl(id, v) {
      const k = this.knobDefs.find((q) => q.id === id);
      if (!k || !fin(v)) return this;
      k.set(clamp(v, k.min, k.max));
      this.syncOne(k, false);
      if (!this.running) { this.sampleForce(); this.paint(true); }
      return this;
    }

    setParam(key, v) {
      if (!(key in this.p)) return this;
      this.p[key] = v;
      this.paint(true);
      return this;
    }

    /** Одинаковое воздействие на любом пресете — для сравнения руками. */
    nudge(kind) {
      const P = this.plant, p = this.p;
      if (kind === 'rod') {
        /* +50 pcm НА ТОТ БАНК, который контур считает регулировочным, и с
           проверкой, что ход ещё есть. Прежде толчок всегда шёл в reg по
           наклону чужого банка: при loopBank = 1 он давал ровно 0 pcm, а на
           горбе характеристики — 2500 pcm вместо 50, то есть 3,6 доллара и
           мгновенную критичность следующим же шагом. */
        const lb = P.loopBankId(p);
        const bw = P.rodWorthBank(this.u[lb], p, lb);
        const slope = bw.dTotalDu;
        const du = Math.abs(slope) > 1 ? 50 / slope : 0;
        this.uSet[lb] = clamp01(this.u[lb] + du);
      } else if (kind === 'tin') {
        /* При включённом втором контуре вход не наша величина — толчок идёт
           туда, где он физически возможен: в уставку клапана турбины. */
        if (this.secOn) {
          this.turbine = clamp(this.turbine - 0.1, SEC_Y_MIN, SEC_Y_MAX);
        } else {
          const v = P.disturbance.variants[0];
          this.d.Tin = clamp(this.d.Tin + 5, v.min, v.max);
        }
      } else if (kind === 'flow') {
        this.d.flow = clamp(this.d.flow * 0.9, FLOW_MIN_CTL, FLOW_MAX_CTL);
        this.flowI = this.d.flow;
      }
      this.syncControls();
      if (!this.running) { this.sampleForce(); this.paint(true); }
      return this;
    }

    /** Снимок для тестов и для сборочной ветки. Ничего не мутирует. */
    state() {
      const pr = this.lastProbe || this.probe();
      return {
        version: VERSION, lang: this.lang, mode: this.mode, preset: this.presetId,
        keff: keffOf(pr.rhoTotal),
        secOn: this.secOn, turbine: this.turbine,
        sec: this.secOn ? { Ts: this.sec.Ts, Tin: this.sec.Tin,
