/* ---- psychrometrics (EN ISO 13788 Annex) ---- */
function psat(th) {                       // saturation vapour pressure, Pa
  return th >= 0 ? 610.5 * Math.exp(17.269 * th / (237.3 + th))
                 : 610.5 * Math.exp(21.875 * th / (265.5 + th));
}
/* ---- accepted ranges of a handed-over or typed boundary condition ---------
   A pressure is a reading at a place, not a property of a substance. This page
   uses p for one purpose only: to turn an incoming humidity ratio into the
   indoor relative humidity of a room open to the atmosphere. It therefore
   accepts the barometric band alone - the ISO 2533 troposphere from 11 000 m
   (22 632 Pa) to -2000 m (127 774 Pa). A contained vessel, pump-suction or
   steam-line pressure lies outside it and is refused with its figure.
   Air temperature is accepted from -30 C to 100 C. Below -30 C the EN ISO 13788
   E.2 ice branch implemented above departs from the Hyland-Wexler saturation
   pressure by more than 1 % (1.03 % at -30 C, 1.88 % at -40 C); at 100 C the
   saturation pressure reaches 101.3 kPa, the barometric total pressure, so a
   relative humidity measured against it carries no meaning above that point.
   Relative humidity is accepted from 1 % to 100 %, the band NATIVE already
   declares for the f-rhi and f-rhe controls.
   The same three numbers guard the typed field and the incoming value.      */
const P_ACC = [22632, 127774];   // Pa, barometric
const TH_ACC = [-30, 100];       // degC, air temperature
const RH_ACC = [1, 100];         // %, relative humidity
const P_STD = 101325;            // Pa, assumed when no pressure is handed over
const rangeP = () => fmt(P_ACC[0] / 1000, 1) + ' … ' + fmt(P_ACC[1] / 1000, 1) + ' kPa';
const rangeTh = () => fmt(TH_ACC[0], 0) + ' … ' + fmt(TH_ACC[1], 0) + ' °C';
const rangeRh = () => fmt(RH_ACC[0], 0) + ' … ' + fmt(RH_ACC[1], 0) + ' %';
function thFromPsat(p) {                  // inverse of psat, °C
  if (p <= 0) return -80;
  const k = Math.log(p / 610.5);
  const a = k >= 0 ? 237.3 * k / (17.269 - k) : 265.5 * k / (21.875 - k);
  return a;
}
function dewPoint(th, rh) { return thFromPsat(Math.max(1e-6, rh / 100 * psat(th))); }
function rhFrom(pv, th) { return 100 * pv / psat(th); }

/* ---- complex helpers (ISO 13786) ---- */
const C = {
  mk: (re, im) => ({ re, im }),
  add: (a, b) => ({ re: a.re + b.re, im: a.im + b.im }),
  sub: (a, b) => ({ re: a.re - b.re, im: a.im - b.im }),
  mul: (a, b) => ({ re: a.re * b.re - a.im * b.im, im: a.re * b.im + a.im * b.re }),
  div: (a, b) => { const d = b.re * b.re + b.im * b.im;
    return { re: (a.re * b.re + a.im * b.im) / d, im: (a.im * b.re - a.re * b.im) / d }; },
  abs: a => Math.hypot(a.re, a.im),
  arg: a => Math.atan2(a.im, a.re),
  scale: (a, k) => ({ re: a.re * k, im: a.im * k })
};
const M = {
  mul: (A, B) => [
    [C.add(C.mul(A[0][0], B[0][0]), C.mul(A[0][1], B[1][0])), C.add(C.mul(A[0][0], B[0][1]), C.mul(A[0][1], B[1][1]))],
    [C.add(C.mul(A[1][0], B[0][0]), C.mul(A[1][1], B[1][0])), C.add(C.mul(A[1][0], B[0][1]), C.mul(A[1][1], B[1][1]))]
  ],
  ident: () => [[C.mk(1, 0), C.mk(0, 0)], [C.mk(0, 0), C.mk(1, 0)]]
};
function layerMatrixMassive(d, lam, rho, c, T) {
  const delta = Math.sqrt(lam * T / (Math.PI * rho * c));   // penetration depth, m
  const x = d / delta;
  const ch = Math.cosh(x), sh = Math.sinh(x), co = Math.cos(x), si = Math.sin(x);
  const Z11 = C.mk(ch * co, sh * si);
  const Z12 = C.scale(C.mk(-(sh * co + ch * si), -(ch * si - sh * co)), delta / (2 * lam));
  const Z21 = C.scale(C.mk(-(sh * co - ch * si), -(sh * co + ch * si)), lam / delta);
  return [[Z11, Z12], [Z21, Z11]];
}
function layerMatrixResistive(R) {
  return [[C.mk(1, 0), C.mk(-R, 0)], [C.mk(0, 0), C.mk(1, 0)]];
}

/* Dynamic characteristics for a 24 h harmonic (EN ISO 13786) */
function dynamic(layers, Rsi, Rse, U) {
  const T = 86400;
  let Z = layerMatrixResistive(Rsi);                        // side 1 = inside
  for (const L of layers) {
    if (L.massive) Z = M.mul(layerMatrixMassive(L.d, L.lam, L.rho, L.c, T), Z);
    else Z = M.mul(layerMatrixResistive(L.R), Z);
  }
  Z = M.mul(layerMatrixResistive(Rse), Z);
  const Z12 = Z[0][1], Z11 = Z[0][0], Z22 = Z[1][1];
  const Y12mag = 1 / C.abs(Z12);
  const shift = -(T / (2 * Math.PI)) * C.arg(C.div(C.mk(-1, 0), Z12)) / 3600;  // hours
  const k1 = (T / (2 * Math.PI)) * C.abs(C.div(C.sub(Z11, C.mk(1, 0)), Z12)) / 1000; // kJ/(m²·K)
  const k2 = (T / (2 * Math.PI)) * C.abs(C.div(C.sub(Z22, C.mk(1, 0)), Z12)) / 1000;
  return { Y12: Y12mag, decrement: U > 0 ? Y12mag / U : 0,
           shift: ((shift % 24) + 24) % 24, kappaIn: k1, kappaOut: k2 };
}

/* ---- surface resistances, EN ISO 6946 table 7 ---- */
function surfaceR(type) {
  if (type === 'roof')  return { rsi: 0.10, rse: 0.04, flow: 'flow.u', dir: 'u' };
  if (type === 'floor') return { rsi: 0.17, rse: 0.04, flow: 'flow.d', dir: 'd' };
  return { rsi: 0.13, rse: 0.04, flow: 'flow.h', dir: 'h' };
}

/* ---- solar geometry (NOAA), all angles in radians unless noted ---- */
function solarPos(doy, hourUTC, latDeg, lonDeg) {
  const g = 2 * Math.PI / 365 * (doy - 1 + (hourUTC - 12) / 24);
  const eqt = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g)
            - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g)
            - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g)
            - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const tst = hourUTC * 60 + eqt + 4 * lonDeg;
  /* hour angle wrapped to [-180°, +180°) — without this the morning/afternoon
     branch of the azimuth below is wrong for any longitude beyond about ±90° */
  let haDeg = (tst / 4 - 180) % 360;
  if (haDeg >= 180) haDeg -= 360; else if (haDeg < -180) haDeg += 360;
  const ha = haDeg * Math.PI / 180;
  const lat = latDeg * Math.PI / 180;
  let cosZ = Math.sin(lat) * Math.sin(decl) + Math.cos(lat) * Math.cos(decl) * Math.cos(ha);
  cosZ = Math.max(-1, Math.min(1, cosZ));
  const zen = Math.acos(cosZ);
  let az;
  const den = Math.cos(lat) * Math.sin(zen);
  if (Math.abs(den) < 1e-9) az = 0;
  else {
    let ca = (Math.sin(lat) * cosZ - Math.sin(decl)) / den;
    ca = Math.max(-1, Math.min(1, ca));
    const a0 = Math.acos(ca);
    // NOAA: cos(180° − azimuth) = (sinφ·cosθz − sinδ)/(cosφ·sinθz), azimuth clockwise from north
    az = ha <= 0 ? Math.PI - a0 : Math.PI + a0;
  }
  return { zen, alt: Math.PI / 2 - zen, az, cosZ, doy };
}
/* Perez et al. (1990) all-sites-composite coefficients, binned on the sky clearness ε */
const PEREZ = [
  [-0.008,  0.588, -0.062, -0.060,  0.072, -0.022],
  [ 0.130,  0.683, -0.151, -0.019,  0.066, -0.029],
  [ 0.330,  0.487, -0.221,  0.055, -0.064, -0.026],
  [ 0.568,  0.187, -0.295,  0.109, -0.152, -0.014],
  [ 0.873, -0.392, -0.362,  0.226, -0.462,  0.001],
  [ 1.132, -1.237, -0.412,  0.288, -0.823,  0.056],
  [ 1.060, -1.600, -0.359,  0.264, -1.127,  0.131],
  [ 0.678, -0.327, -0.250,  0.156, -1.377,  0.251]
];
const PEREZ_EPS = [1.065, 1.230, 1.500, 1.950, 2.800, 4.500, 6.200];

/* Irradiance on a surface with tilt beta (deg from horizontal) and azimuth (deg from N).
   Sky diffuse follows the Perez 1990 anisotropic model (circumsolar + horizon brightening),
   which is the reference transposition model for vertical facades; an isotropic sky
   under-predicts a sunlit facade by roughly 10 % over a year. */
function irradianceOnSurface(dni, dhi, sp, tiltDeg, azDeg, albedo = 0.2) {
  const cosZ = Math.max(0, sp.cosZ);
  if (sp.cosZ <= 0) dni = 0;
  dni = Math.max(0, dni || 0); dhi = Math.max(0, dhi || 0);
  const b = tiltDeg * Math.PI / 180, sa = azDeg * Math.PI / 180;
  const cosInc = Math.max(0, Math.cos(sp.zen) * Math.cos(b) + Math.sin(sp.zen) * Math.sin(b) * Math.cos(sp.az - sa));
  const ghi = dni * cosZ + dhi;
  const beam = cosInc * dni;
  const refl = ghi * albedo * (1 - Math.cos(b)) / 2;
  const isoTerm = dhi * (1 + Math.cos(b)) / 2;
  if (dhi <= 0) return beam + refl;

  const zdeg = sp.zen * 180 / Math.PI;
  if (zdeg >= 90) return isoTerm + refl;                       // sun down: isotropic sky only
  const kappa = 1.041, z3 = Math.pow(sp.zen, 3);
  const eps = ((dhi + dni) / dhi + kappa * z3) / (1 + kappa * z3);
  const am = 1 / (cosZ + 0.15 * Math.pow(93.885 - zdeg, -1.253));   // Kasten air mass
  const e0 = 1367 * (1 + 0.033 * Math.cos(2 * Math.PI * (sp.doy || 100) / 365));
  const delta = dhi * am / e0;                                  // sky brightness
  let k = 0; while (k < PEREZ_EPS.length && eps >= PEREZ_EPS[k]) k++;
  const F = PEREZ[k];
  const F1 = Math.max(0, F[0] + F[1] * delta + F[2] * sp.zen);
  const F2 = F[3] + F[4] * delta + F[5] * sp.zen;
  const a = cosInc, bb = Math.max(0.087, cosZ);
  const diff = dhi * ((1 - F1) * (1 + Math.cos(b)) / 2 + F1 * a / bb + F2 * Math.sin(b));
  return beam + Math.max(0, diff) + refl;
}
/* clear-sky fallback (Hottel/ASHRAE clear day) when no climate service is reachable */
function clearSky(doy, hourUTC, lat, lon) {
  const sp = solarPos(doy, hourUTC, lat, lon);
  if (sp.cosZ <= 0.01) return { dni: 0, dhi: 0, sp };
  const m = 1 / (sp.cosZ + 0.50572 * Math.pow(96.07995 - sp.zen * 180 / Math.PI, -1.6364));
  const A = 1160 + 75 * Math.sin(2 * Math.PI * (doy - 275) / 365);
  const k = 0.174 + 0.035 * Math.sin(2 * Math.PI * (doy - 100) / 365);
  const dni = A * Math.exp(-k * m);
  const Cc = 0.095 + 0.04 * Math.sin(2 * Math.PI * (doy - 100) / 365);
  return { dni, dhi: Cc * dni, sp };
}

function solAir(te, I, absorptance, he, isHorizontal) {
  const dR = isHorizontal ? 4.0 : 0.0;      // long-wave sky radiation correction, K

const DELTA0 = 2.0e-10;   // vapour permeability of still air, kg/(m·s·Pa)

const UNKNOWN_MAT = { id: '?', cat: 'other', lam: 1.0, mu: 1, rho: 1000, c: 1000,
  color: '#d8b0b0', tex: 'board', unknown: true,
  name: ['Unknown material', 'Onbekend materiaal', 'Matériau inconnu', 'Unbekanntes Material',

/* EN ISO 6946:2017 Table D.1 — unventilated air layers bounded by high-emissivity

   "intermediate values are obtained by linear interpolation", which is what the

   and keeps its own tabulated resistance.                                      */
const AIRTAB_D = [0, 5, 7, 10, 15, 25, 50, 100, 300];
const AIRTAB_R = {
  u: [0, 0.11, 0.13, 0.15, 0.16, 0.16, 0.16, 0.16, 0.16],
  h: [0, 0.11, 0.13, 0.15, 0.17, 0.18, 0.18, 0.18, 0.18],
  d: [0, 0.11, 0.13, 0.15, 0.17, 0.19, 0.21, 0.22, 0.23]

function airTableR(dmm, flow) {
  const ys = AIRTAB_R[flow] || AIRTAB_R.h, xs = AIRTAB_D;
  const d = Math.max(0, dmm) || 0;
  if (d >= xs[xs.length - 1]) return ys[ys.length - 1];
  for (let i = 1; i < xs.length; i++)
    if (d <= xs[i]) return ys[i - 1] + (ys[i] - ys[i - 1]) * (d - xs[i - 1]) / (xs[i] - xs[i - 1]);
  return ys[ys.length - 1];

  if (dmm != null && isFinite(dmm)) return airTableR(dmm, flow);
  if (m.Rdir) return m.Rdir[flow] != null ? m.Rdir[flow] : m.Rdir.h;
  return m.R;

    const R = cavityR(m, flow || 'h', l.d);

  const m = matOf(l);

/* --- main --- */
function calcAssembly(S) {

     Av, so the midpoint of the range (Av = 1000 mm²/m) is used, which makes the
     total the mean of the two bounds. The temperature and vapour profiles are
     not defined by the standard for this case and are shown for the
     unventilated construction — said so in a warning.                        */
  {
    const all = S.layers || [];
    const isCav = l => { const m = matOf(l); return m.R != null || m.Rdir != null; };
    const si = all.findIndex(l => l.vent === 'slight' && isCav(l));
    const strongBefore = all.findIndex(l => l.vent === 'strong' && isCav(l));
    /* each branch has one slightly ventilated layer fewer, so this terminates */
    if (si >= 0 && (strongBefore < 0 || strongBefore > si)) {

        layers: all.map((l, i) => i === si ? Object.assign({}, l, { vent: v }) : l)
      });
      const nve = calcAssembly(swap('none'));
      const ve = calcAssembly(swap('strong'));
      const R_T = (nve.R_T + ve.R_T) / 2;
      const U = 1 / R_T, Uc = Math.max(1e-6, U + nve.dU);
      const fRsi = 1 - Rsi * Uc;
      return Object.assign({}, nve, {
        R_T, U, Uc, fRsi, thSiDesign: S.te + fRsi * (S.ti - S.te),
        slight: { Rnve: nve.R_T, Rve: ve.R_T },
        warn: Array.from(new Set(nve.warn.concat(['warn.slightvent'])))
      });
    }
  }

  /* well-ventilated cavity: ignore everything outside it, Rse := Rsi (§6.9.4) */
  let layers = (S.layers || []).slice();
  const vi = layers.findIndex(l => l.vent === 'strong' && (matOf(l).R != null || matOf(l).Rdir));
  let ignored = [];
  if (vi >= 0) { ignored = layers.slice(vi); layers = layers.slice(0, vi); Rse = Rsi; }

  const rows = layers.map(l => {
    const m = matOf(l);
    const isCav = m.R != null || m.Rdir != null;
    const lam = lamOf(l);
    if (m.unknown) warn.push('warn.unknownmat');
    if (!isCav && lam === null) warn.push('warn.badlambda');
    return {
      l, m, isCav,
      R: layerR(l, flow),
      sd: layerSd(l),
      d: Math.max(0, l.d) / 1000,
      lam,
      rho: m.rho || 1.2, c: m.c || 1000,
      mass: isCav ? 0 : (m.rho || 0) * Math.max(0, l.d) / 1000
    };
  });

  const R_T_1d = Rsi + rows.reduce((s, r) => s + r.R, 0) + Rse;

  /* --- combined method for inhomogeneous (framed) layers, EN ISO 6946 §6.7 --- */
  const framedIdx = rows.map((r, i) => i)
    .filter(i => rows[i].l.frameFrac > 0 && rows[i].l.frameMat && !rows[i].isCav);
  const hasFrame = framedIdx.length > 0;
  const frameR = i => {                              // resistance of the framing path in layer i
    const fm = MATBYID[rows[i].l.frameMat];
    return (fm && fm.lam > 0) ? rows[i].d / fm.lam : rows[i].R;
  };
  let Rupper = R_T_1d, Rlower = R_T_1d, R_T = R_T_1d, Reff = rows.map(r => r.R);

  if (hasFrame) {
    /* upper limit: every combination of framed / unframed paths.
       Fractions are treated as statistically independent, which is exact for a single
       framed layer and a reasonable approximation for non-aligned framing. */
    const n = framedIdx.length;
    if (n > 6) warn.push('warn.manyframes');
    const nn = Math.min(n, 6);
    let sum = 0;
    for (let mask = 0; mask < (1 << nn); mask++) {
      let a = 1, R = Rsi + Rse;
      for (let k = 0; k < rows.length; k++) R += rows[k].R;
      for (let j = 0; j < nn; j++) {
        const i = framedIdx[j], f = rows[i].l.frameFrac / 100;
        if (mask & (1 << j)) { a *= f;     R += frameR(i) - rows[i].R; }
        else                 { a *= 1 - f; }
      }
      sum += a / R;
    }
    Rupper = 1 / sum;

    /* lower limit: layer-by-layer equivalent (parallel) resistances */
    Reff = rows.map((r, i) => {
      if (framedIdx.indexOf(i) < 0) return r.R;
      const f = r.l.frameFrac / 100, Rb = frameR(i);
      return 1 / ((1 - f) / Math.max(r.R, 1e-9) + f / Math.max(Rb, 1e-9));
    });
    Rlower = Rsi + Reff.reduce((s, v) => s + v, 0) + Rse;
    R_T = (Rupper + Rlower) / 2;
    /* §6.7.2: the method is only reliable while the two limits are close */
    if (Rupper / Rlower > 1.5) warn.push('warn.combined');
  }

  const U = 1 / R_T;

  /* --- point / linear thermal bridges (EN ISO 6946 §6.6 / ISO 14683) --- */
  let dU = 0;
  const brRows = (S.bridges || []).map(b => {
    const v = b.kind === 'linear' ? (b.psi || 0) * (b.qty || 0) : (b.chi || 0) * (b.qty || 0);
    dU += v; return { b, v };
  });
  const Uc = Math.max(1e-6, U + dU);

  /* --- temperature profile ---------------------------------------------
     The profile must be built from the same resistances that add up to the
     total it is divided by. Framed layers therefore use their equivalent
     (parallel) resistance; the profile total is R_prof = Rlower, which makes
     both boundary temperatures come out exactly. Point/linear bridges are a
     3-D effect and are deliberately NOT smeared into the 1-D profile — they
     are accounted for separately in fRsi below.                            */
  const R_prof = Rsi + Reff.reduce((s, v) => s + v, 0) + Rse;
  const ti = S.ti, te = S.te;
  const dth = ti - te;
  const nodes = [];
  let acc = Rsi, sdAcc = 0;
  nodes.push({ x: 0, R: Rsi, sd: 0, th: ti - dth * Rsi / R_prof, label: 'si' });
  rows.forEach((r, i) => {
    acc += Reff[i]; sdAcc += r.sd;
    nodes.push({ x: i + 1, R: acc, sd: sdAcc, th: ti - dth * acc / R_prof, layer: i });
  });
  const thSi = nodes[0].th;
  const thSe = te + dth * Rse / R_prof;
  /* fRsi for the mould check uses the design U including all bridges (worst case) */
  const fRsi = 1 - Rsi * Uc;
  const thSiDesign = te + fRsi * dth;

  /* --- Glaser, EN ISO 13788 --- */
  if (S.rhi > 100 || S.rhe > 100) warn.push('warn.rh');
  const pi = S.rhi / 100 * psat(ti), pe = S.rhe / 100 * psat(te);
  const Sdtot = sdAcc;
  const pts = nodes.map(n => ({ sd: n.sd, ps: psat(n.th), th: n.th }));
  const glaser = glaserProfile(pts, pi, pe, Sdtot);

  /* dew point location: where θ(x) drops to the indoor dew point */
  const tdew = dewPoint(ti, S.rhi);
  const dewPos = findTempPosition(rows, nodes, tdew);

  /* --- dynamic characteristics, EN ISO 13786 ---------------------------
     framed layers enter with their equivalent conductivity and an
     area-weighted volumetric heat capacity                                */
  const dynLayers = rows.map((r, i) => {
    if (r.isCav || r.lam === null) return { massive: false, R: Reff[i] };
    const j = framedIdx.indexOf(i);
    if (j < 0) return { massive: true, d: r.d, lam: r.lam, rho: r.rho, c: r.c };
    const f = r.l.frameFrac / 100, fm = MATBYID[r.l.frameMat] || r.m;
    return { massive: true, d: r.d, lam: r.d / Math.max(1e-9, Reff[i]),
             rho: 1, c: (1 - f) * r.rho * r.c + f * (fm.rho || r.rho) * (fm.c || r.c) };
  });
  const dyn = dynamic(dynLayers, Rsi, Rse, 1 / R_prof);

  const totalD = rows.reduce((s, r) => s + Math.max(0, r.l.d), 0);
  const totalDall = (S.layers || []).reduce((s, l) => s + Math.max(0, l.d), 0);
  const mass = rows.reduce((s, r) => s + r.mass, 0);

  /* multiple different framing fractions is only an approximation — say so */
  if (hasFrame && new Set(framedIdx.map(i => rows[i].l.frameFrac)).size > 1) warn.push('warn.mixedframe');

  return {
    Rsi, Rse, flow, rows, Reff, ignored, R_T, R_T_1d, R_prof, Rupper, Rlower, hasFrame,
    U, Uc, dU, brRows, nodes, thSi, thSe, thSiDesign, fRsi, tdew, dewPos,
    pi, pe, Sdtot, glaser, dyn, totalD, totalDall, mass, flowKey: sr.flow,
    warn: Array.from(new Set(warn))
  };
}

/* lower convex hull of (Sd, psat) with fixed end pressures -> real vapour pressure line */
function glaserProfile(pts, pi, pe, Sdtot) {
  const P = [{ sd: 0, p: Math.min(pi, pts[0].ps), node: 0 }];
  for (let i = 1; i < pts.length - 1; i++) P.push({ sd: pts[i].sd, p: pts[i].ps, node: i });
  P.push({ sd: Sdtot, p: Math.min(pe, pts[pts.length - 1].ps), node: pts.length - 1 });
  const hull = [];
  const cross = (o, a, b) => (a.sd - o.sd) * (b.p - o.p) - (a.p - o.p) * (b.sd - o.sd);
  for (const q of P) {
    while (hull.length >= 2 && cross(hull[hull.length - 2], hull[hull.length - 1], q) <= 0) hull.pop();
    hull.push(q);
  }
  const interfaces = [];
  for (let i = 1; i < hull.length - 1; i++) {
    const a = hull[i - 1], b = hull[i], c = hull[i + 1];
    const gin = DELTA0 * (a.p - b.p) / Math.max(1e-9, b.sd - a.sd);
    const gout = DELTA0 * (b.p - c.p) / Math.max(1e-9, c.sd - b.sd);
    interfaces.push({ sd: b.sd, p: b.p, node: b.node, g: (gin - gout) });   // kg/(m²·s)
  }
  const gTotal = interfaces.reduce((s, i) => s + Math.max(0, i.g), 0);
  return { hull, interfaces, condensing: interfaces.length > 0, gTotal };
}

/* position (layer index + fraction) where the temperature equals `target` */
function findTempPosition(rows, nodes, target) {
  if (!rows.length) return { where: 'surface', layer: -1, frac: 0, mm: 0 };
  if (target >= nodes[0].th) return { where: 'surface', layer: -1, frac: 0, mm: 0 };
  for (let i = 0; i < rows.length; i++) {
    const a = nodes[i].th, b = nodes[i + 1].th;
    if (target <= a && target >= b) {
      const f = (a - b) > 1e-9 ? (a - target) / (a - b) : 0;
      let mm = 0; for (let k = 0; k < i; k++) mm += rows[k].l.d;
      return { where: 'inside', layer: i, frac: f, mm: mm + f * rows[i].l.d };
    }
  }
  return { where: 'outside', layer: rows.length, frac: 1, mm: rows.reduce((s, r) => s + r.l.d, 0) };
}

/* --- annual moisture balance, EN ISO 13788 §6 -------------------------
   Two passes: the first locates the month where accumulation starts, the
   second runs the twelve months from there so that condensate carried over
   the turn of the year is not thrown away.                                */
function annualMoisture(S, monthly) {
  if (!monthly || !monthly.te) return null;
  const secs = 86400 * 30.4;                       // s per average month
  const month = m => {
    const rhe = (monthly.rhe && isFinite(monthly.rhe[m])) ? monthly.rhe[m] : 80;
    const st = Object.assign({}, S, {
      te: monthly.te[m], rhe: rhe,
      rhi: indoorRH(monthly.te[m], S.ti, S.humidityClass, rhe)
    });
    return calcAssembly(st);
  };
  const m12 = [];
  for (let m = 0; m < 12; m++) m12.push(month(m));

  /* start in the first month that begins to accumulate after a month without
     condensation (ISO 13788 §6.2); if it condenses all year, start at 0 */
  let start = 0;
  for (let m = 0; m < 12; m++) {
    const prev = (m + 11) % 12;
    if (m12[m].glaser.condensing && !m12[prev].glaser.condensing) { start = m; break; }
  }

  /* Condensate is tracked per interface. In a month in which an already wet
     interface is not condensing, the vapour pressure there is taken as the
     saturation pressure and the same expression gives the evaporation rate
     (ISO 13788 §6.3) — never more than the water actually present.          */
  const acc = new Map();                            // node index -> kg/m²
  let peak = 0, series = new Array(12);
  for (let k = 0; k < 12; k++) {
    const m = (start + k) % 12;
    const r = m12[m];
    let gain = 0, dry = 0;
    const wetNow = new Set();
    r.glaser.interfaces.forEach(itf => {
      const g = Math.max(0, itf.g) * secs;
      wetNow.add(itf.node);
      acc.set(itf.node, (acc.get(itf.node) || 0) + g);
      gain += g;
    });
    acc.forEach((w, node) => {
      if (wetNow.has(node) || w <= 0) return;
      const nd = r.nodes[node];
      if (!nd) return;
      const pc = psat(nd.th);
      const sdIn = Math.max(1e-6, nd.sd), sdOut = Math.max(1e-6, r.Sdtot - nd.sd);
      const gev = DELTA0 * ((pc - r.pi) / sdIn + (pc - r.pe) / sdOut);
      const ev = Math.min(Math.max(0, gev) * secs, w);
      acc.set(node, w - ev);
      dry += ev;
    });
    let tot = 0; acc.forEach(w => { tot += w; });
    peak = Math.max(peak, tot);
    series[m] = { m, g: gain * 1000, dry: dry * 1000, acc: tot * 1000 };
  }
  let end = 0; acc.forEach(w => { end += w; });
  const anyCond = m12.some(x => x.glaser.condensing);
  return { peak: peak * 1000, endsDry: end <= 1e-6, anyCond, start, series };
}
/* Internal vapour pressure from the external one, EN ISO 13788 §4.2:
   p_i = p_e + Δp, with Δp from the humidity class, constant below 0 °C and
   falling linearly to zero at +20 °C.                                        */
function indoorRH(te, ti, cls, rhe) {
  const dp = [270, 540, 810, 1080, 1350][cls != null ? cls : 2];   // Δp at te ≤ 0 °C, Pa
  let d = dp;
  if (te >= 20) d = 0; else if (te > 0) d = dp * (1 - te / 20);
  const Ti = (ti != null && isFinite(ti)) ? ti : 20;
  const RHe = (rhe != null && isFinite(rhe)) ? Math.max(0, Math.min(100, rhe)) : 80;
  const pe = RHe / 100 * psat(te);
  return Math.max(0, Math.min(100, 100 * (pe + d) / psat(Ti)));
}

/* --- inverse solve: thickness of one layer to hit a goal -----------------
   No monotonicity is assumed: the range is scanned first and every sign
   change is collected, so non-monotone cases (internal insulation, where
   *thin* insulation is the dry solution) are found too.                    */
function solveThickness(S, idx, goal, targetU) {
  if (!S.layers[idx]) return null;
  const backup = S.layers[idx].d;
  const test = d => {
    S.layers[idx].d = d;
    const r = calcAssembly(S);
    return goal === 'U' ? r.Uc - targetU : (r.glaser.condensing ? 1 : -1);
  };
  const LO = 1, HI = 500, N = 120;
  const xs = [], ys = [];
  for (let k = 0; k <= N; k++) { const d = LO + k * (HI - LO) / N; xs.push(d); ys.push(test(d)); }
  const roots = [];
  if (ys[0] <= 0) roots.push(LO);                       // already satisfied at the thin end
  for (let k = 1; k <= N; k++) {
    if (ys[k - 1] > 0 && ys[k] <= 0) {
      let lo = xs[k - 1], hi = xs[k];
      for (let it = 0; it < 50; it++) { const m = (lo + hi) / 2; if (test(m) > 0) lo = m; else hi = m; }
      roots.push(hi);
    }
  }
  S.layers[idx].d = backup;
  if (!roots.length) return null;
  return Math.round(Math.min.apply(null, roots) * 10) / 10;  // thinnest solution
}

/* ============================================================
   Climate: IP location, globe picker, Open-Meteo reanalysis
   ============================================================ */
const CLIM = {
  lat: 50.85, lon: 4.35, place: '', year: 2024, loaded: false, synthetic: false,
  monthlyTe: null, monthlyRhe: null, designHeat: -8, designCool: 30, rheHeat: 85, rheCool: 45,
  hdd: 0, cdd: 0, orient: {}, designDay: null, status: ''
};

function tfetch(url, ms) {
  const c = new AbortController();
  const timer = setTimeout(() => c.abort(), ms || 9000);
  return fetch(url, { signal: c.signal, cache: 'no-store' }).finally(() => clearTimeout(timer));
}

async function locateByIP() {
  const tries = [
    ['https://ipwho.is/', j => j && j.success !== false ? { lat: j.latitude, lon: j.longitude, place: [j.city, j.country].filter(Boolean).join(', ') } : null],
    ['https://ipapi.co/json/', j => j && j.latitude ? { lat: j.latitude, lon: j.longitude, place: [j.city, j.country_name].filter(Boolean).join(', ') } : null]
  ];
  for (const [url, pick] of tries) {
    try {
      const r = await tfetch(url, 7000);
      if (!r.ok) continue;
      const v = pick(await r.json());
      if (v && isFinite(v.lat)) return v;
    } catch (e) { /* next */ }
  }
  return null;
}

async function searchPlace(q) {
  try {
    const r = await tfetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=' +
      (LANG === 'uk' ? 'ru' : LANG) + '&name=' + encodeURIComponent(q), 8000);
    const j = await r.json();
    return (j.results || []).map(x => ({ lat: x.latitude, lon: x.longitude,
      place: [x.name, x.admin1, x.country].filter(Boolean).join(', ') }));
  } catch (e) { return []; }
}

async function fetchClimate(lat, lon, year) {
  const url = 'https://archive-api.open-meteo.com/v1/archive'
    + '?latitude=' + lat.toFixed(3) + '&longitude=' + lon.toFixed(3)
    + '&start_date=' + year + '-01-01&end_date=' + year + '-12-31'
    + '&hourly=temperature_2m,relative_humidity_2m,direct_normal_irradiance,diffuse_radiation'
    + '&timezone=UTC';
  const r = await tfetch(url, 25000);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  const h = j.hourly;
  if (!h || !h.temperature_2m) throw new Error('no data');
  return {
    t: h.temperature_2m, rh: h.relative_humidity_2m,
    dni: h.direct_normal_irradiance, dhi: h.diffuse_radiation, time: h.time
  };
}

/* --- long-record daily statistics -------------------------------------
   A single year is far too warm for a heating design temperature: measured
   against the published EN 12831 values for ten European cities, the 0.4 %
   percentile of one year is biased about +3.5 K, while the coldest two-day
   mean of a twenty-year record is within 0.4 K (RMSE 2.1 K). The daily
   endpoint carries twenty years in ~180 KiB instead of ~3.7 MiB.          */
async function fetchDaily(lat, lon, y0, y1) {
  const url = 'https://archive-api.open-meteo.com/v1/archive'
    + '?latitude=' + lat.toFixed(3) + '&longitude=' + lon.toFixed(3)
    + '&start_date=' + y0 + '-01-01&end_date=' + y1 + '-12-31'
    + '&daily=temperature_2m_mean,temperature_2m_max,temperature_2m_min,relative_humidity_2m_mean'
    + '&timezone=UTC&format=csv';
  const r = await tfetch(url, 30000);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const lines = (await r.text()).split('\n');
  let h = -1;
  for (let i = 0; i < lines.length; i++) if (lines[i].slice(0, 5) === 'time,') { h = i; break; }
  if (h < 0) throw new Error('no header');
  const date = [], tm = [], tmax = [], tmin = [], rh = [];
  for (let i = h + 1; i < lines.length; i++) {
    const c = lines[i].split(',');
    if (c.length < 5 || !c[1]) continue;
    date.push(c[0]); tm.push(+c[1]); tmax.push(+c[2]); tmin.push(+c[3]); rh.push(+c[4]);
  }
  if (tm.length < 3000) throw new Error('short record');
  return { date, tm, tmax, tmin, rh };
}
function analyseDaily(d) {
  const n = d.tm.length;
  /* EN 12831 design external temperature ≈ coldest two-day mean of the record */
  let designHeat = Infinity;
  for (let i = 0; i + 1 < n; i++) {
    const m = (d.tm[i] + d.tm[i + 1]) / 2;
    if (m < designHeat) designHeat = m;
  }
  /* design cooling ≈ 99th percentile of the daily maxima (~4 warmest days a year) */
  const sortedMax = d.tmax.slice().sort((a, b) => a - b);
  const designCool = sortedMax[Math.min(n - 1, Math.round(0.99 * (n - 1)))];
  /* degree days, averaged over the record */
  let hdd = 0, cdd = 0;
  for (let i = 0; i < n; i++) {
    if (d.tm[i] < 18) hdd += 18 - d.tm[i];
    if (d.tm[i] > 26) cdd += d.tm[i] - 26;
  }
  const years = n / 365.25;
  /* monthly means over the whole record */
  const st = new Array(12).fill(0), sr = new Array(12).fill(0), k = new Array(12).fill(0);
  for (let i = 0; i < n; i++) {
    const m = +d.date[i].slice(5, 7) - 1;
    if (m >= 0 && m < 12) { st[m] += d.tm[i]; sr[m] += d.rh[i]; k[m]++; }
  }
  return {
    designHeat: Math.round(designHeat * 10) / 10,
    designCool: Math.round(designCool * 10) / 10,
    hdd: Math.round(hdd / years), cdd: Math.round(cdd / years),
    monthlyTe: st.map((v, i) => k[i] ? v / k[i] : 0),
    monthlyRhe: sr.map((v, i) => k[i] ? v / k[i] : 80),
    years: Math.round(years)
  };
}

function syntheticSeries(lat, lon, year) {
  // crude but plausible: annual sinusoid + diurnal swing, clear-sky solar
  const n = 8760, t = [], rh = [], dni = [], dhi = [], time = [];
  const alat = Math.abs(lat);
  const tMean = 27 - 0.45 * alat;                       // annual mean, °C
  const ampY = 2 + 0.32 * alat;                          // annual amplitude
  const ampD = 4 + 0.05 * alat;                          // daily amplitude
  const south = lat < 0;
  for (let i = 0; i < n; i++) {
    const doy = Math.floor(i / 24) + 1, hr = i % 24;
    let phase = Math.cos(2 * Math.PI * (doy - 200) / 365);
    if (south) phase = -phase;
    const solarHr = hr + lon / 15;                        // local solar time
    const daily = -Math.cos(2 * Math.PI * (solarHr - 3) / 24);
    const te = tMean + ampY * phase + ampD * daily / 2;
    t.push(+te.toFixed(1));
    rh.push(Math.max(35, Math.min(95, 80 - 1.2 * (te - tMean))));
    const cs = clearSky(doy, hr - 0.5, lat, lon);
    const cloud = 0.72;                                   // average clearness
    dni.push(cs.dni * cloud); dhi.push(cs.dhi * cloud + cs.dni * (1 - cloud) * 0.35 * Math.max(0, cs.sp.cosZ));
    time.push(year + '-' + String(doy) + 'T' + hr);
  }
  return { t, rh, dni, dhi, time, synthetic: true };
}

function analyseClimate(h, lat, lon, albedo) {
  const alb = (albedo != null && isFinite(albedo)) ? albedo : 0.2;
  const n = h.t.length;
  const sorted = h.t.slice().sort((a, b) => a - b);
  const q = p => sorted[Math.max(0, Math.min(n - 1, Math.round(p * (n - 1))))];
  const designHeat = Math.round(q(0.004) * 10) / 10;      // ~35 coldest hours
  const designCool = Math.round(q(0.996) * 10) / 10;
  // humidity at the design conditions
  let sh = 0, ch = 0, sc = 0, cc = 0;
  for (let i = 0; i < n; i++) {
    if (h.t[i] <= q(0.02)) { sh += h.rh[i]; ch++; }
    if (h.t[i] >= q(0.98)) { sc += h.rh[i]; cc++; }
  }
  // monthly means
  const dim = [31, 28 + (isLeap(CLIM.year) ? 1 : 0), 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  const monthlyTe = [], monthlyRhe = [];
  let idx = 0;
  for (let m = 0; m < 12; m++) {
    let st = 0, sr = 0, k = 0;
    for (let d = 0; d < dim[m]; d++) for (let hh = 0; hh < 24; hh++) {
      if (idx < n) { st += h.t[idx]; sr += h.rh[idx]; k++; idx++; }
    }
    monthlyTe.push(k ? st / k : 0); monthlyRhe.push(k ? sr / k : 80);
  }
  // degree days
  let hdd = 0, cdd = 0;
  for (let d = 0; d * 24 < n; d++) {
    let s = 0, k = 0;
    for (let hh = 0; hh < 24 && d * 24 + hh < n; hh++) { s += h.t[d * 24 + hh]; k++; }
    const dm = s / k;
    if (dm < 18) hdd += 18 - dm;
    if (dm > 26) cdd += dm - 26;
  }
  // solar on the 8 orientations
  const orient = {};
  ORIENTS.forEach(o => orient[o.key] = { peak: 0, annual: 0, summerDay: 0, hourly: new Array(24).fill(0) });
  const horiz = { peak: 0, annual: 0, summerDay: 0, hourly: new Array(24).fill(0) };   // roofs / flat elements
  let horizDaySum = 0;
  const hottest = h.t.indexOf(Math.max(...h.t));
  const dayStart = Math.floor(hottest / 24) * 24;
  const daySums = {}; ORIENTS.forEach(o => daySums[o.key] = 0);
  let summerDays = 0, curDay = -1;
  for (let i = 0; i < n; i++) {
    const doy = Math.floor(i / 24) + 1, hr = i % 24;
    const sp = solarPos(doy, hr - 0.5, lat, lon);   // Open-Meteo radiation = mean of the preceding hour
    const isSummer = lat >= 0 ? (doy >= 152 && doy <= 243) : (doy >= 335 || doy <= 59);
    if (hr === 0) { if (isSummer) summerDays++; curDay = doy; }
    for (const o of ORIENTS) {
      const I = irradianceOnSurface(h.dni[i] || 0, h.dhi[i] || 0, sp, 90, o.az, alb);
      const rec = orient[o.key];
      if (I > rec.peak) rec.peak = I;
      rec.annual += I / 1000;                         // kWh/m²
      if (isSummer) daySums[o.key] += I / 1000;
      if (i >= dayStart && i < dayStart + 24) rec.hourly[i - dayStart] = I;
    }
    const Ih = irradianceOnSurface(h.dni[i] || 0, h.dhi[i] || 0, sp, 0, 180, alb);
    if (Ih > horiz.peak) horiz.peak = Ih;
    horiz.annual += Ih / 1000;
    if (isSummer) horizDaySum += Ih / 1000;
    if (i >= dayStart && i < dayStart + 24) horiz.hourly[i - dayStart] = Ih;
  }
  ORIENTS.forEach(o => orient[o.key].summerDay = daySums[o.key] / Math.max(1, summerDays));
  horiz.summerDay = horizDaySum / Math.max(1, summerDays);
  const designDay = { te: h.t.slice(dayStart, dayStart + 24), rh: h.rh.slice(dayStart, dayStart + 24),
                      doy: Math.floor(dayStart / 24) + 1 };
  return { designHeat, designCool, rheHeat: ch ? sh / ch : 85, rheCool: cc ? sc / cc : 45,

}

/* peak cooling response of an assembly on the design day (harmonic, ISO 13786) */
function coolingResponse(res, S) {
  if (!CLIM.designDay) return null;
  /* a roof or a ceiling faces the sky, not a compass point */
  const roof = S.type === 'roof';
  const o = roof ? CLIM.horiz : (CLIM.orient[S.orient] || CLIM.orient.S);
  if (!o) return null;
  const a = S.absorptance;
  const he = 1 / (res.Rse || 0.04);
  const sa = o.hourly.map((I, i) => solAir(CLIM.designDay.te[i], I, a, he, roof));
  const mean = sa.reduce((s, v) => s + v, 0) / sa.length;
  const max = Math.max(...sa), min = Math.min(...sa);
  const amp = (max - min) / 2;
  const peakHour = sa.indexOf(max);
  const q = res.Uc * (mean - S.tiCool) + res.dyn.Y12 * amp;
  return { sa, mean, max, min, amp, peakHour, q, plane: roof ? 'horiz' : S.orient,

}

/* ---------- globe ---------- */
const Globe = {
  land: null, lon0: 0, lat0: 25, R: 0, cv: null, ctx: null, drag: null, onpick: null,
  resize() {
    if (!this.cv) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const css = this.cv.getBoundingClientRect().width || 320;
    const w = Math.round(css * dpr);
    if (w > 0 && (this.cv.width !== w || this.dpr !== dpr)) {
      this.cv.width = w; this.cv.height = w; this.dpr = dpr;
    }
    this.draw();
  },
  async init(canvas, onpick) {
    this.cv = canvas; this.ctx = canvas.getContext('2d'); this.onpick = onpick;
    this.resize();
    canvas.addEventListener('pointerdown', e => {
      this.drag = { x: e.offsetX, y: e.offsetY, lon0: this.lon0, lat0: this.lat0, moved: 0 };
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', e => {
      if (!this.drag) return;
      const dx = e.offsetX - this.drag.x, dy = e.offsetY - this.drag.y;
      this.drag.moved = Math.max(this.drag.moved, Math.hypot(dx, dy));
      this.lon0 = this.drag.lon0 - dx * 0.5;
      this.lat0 = Math.max(-89, Math.min(89, this.drag.lat0 + dy * 0.5));
      this.draw();
    });
    canvas.addEventListener('pointerup', e => {
      const moved = this.drag ? this.drag.moved : 99; this.drag = null;
      if (moved < 4) {
        const c = this.toCanvas(e.offsetX, e.offsetY);
        const p = this.invert(c[0], c[1]);
        if (p && this.onpick) this.onpick(p.lat, p.lon);
      }
    });
    this.land = LAND;
    this.draw();
  },
  geom() {
    const w = this.cv.width, h = this.cv.height;
    return { cx: w / 2, cy: h / 2, R: Math.min(w, h) / 2 - 6 * (this.dpr || 1) };
  },
  toCanvas(px, py) { const k = this.dpr || 1; return [px * k, py * k]; },
  project(lat, lon) {
    const { cx, cy, R } = this.geom();
    const l = (lon - this.lon0) * Math.PI / 180, p = lat * Math.PI / 180, p0 = this.lat0 * Math.PI / 180;
    const cosc = Math.sin(p0) * Math.sin(p) + Math.cos(p0) * Math.cos(p) * Math.cos(l);
    if (cosc < 0) return null;
    return { x: cx + R * Math.cos(p) * Math.sin(l),
             y: cy - R * (Math.cos(p0) * Math.sin(p) - Math.sin(p0) * Math.cos(p) * Math.cos(l)) };
  },
  invert(px, py) {
    const { cx, cy, R } = this.geom();
    const x = px - cx, y = cy - py, rho = Math.hypot(x, y);
    if (rho > R) return null;
    const c = Math.asin(Math.min(1, rho / R)), p0 = this.lat0 * Math.PI / 180;
    if (rho < 1e-6) return { lat: this.lat0, lon: this.lon0 };
    const lat = Math.asin(Math.cos(c) * Math.sin(p0) + y * Math.sin(c) * Math.cos(p0) / rho);
    const lon = this.lon0 * Math.PI / 180 + Math.atan2(x * Math.sin(c),
      rho * Math.cos(c) * Math.cos(p0) - y * Math.sin(c) * Math.sin(p0));
    let lo = lon * 180 / Math.PI; while (lo > 180) lo -= 360; while (lo < -180) lo += 360;
    return { lat: lat * 180 / Math.PI, lon: lo };
  },
  draw() {
    if (!this.ctx) return;
    const ctx = this.ctx, { cx, cy, R } = this.geom();
    ctx.clearRect(0, 0, this.cv.width, this.cv.height);
    const g = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.1, cx, cy, R);
    g.addColorStop(0, '#2b5f8a'); g.addColorStop(1, '#12324c');
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fillStyle = g; ctx.fill();
    // graticule
    ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 1 * (this.dpr || 1);
    for (let lat = -60; lat <= 60; lat += 30) this.path(ctx, lonRange(lat));
    for (let lon = -180; lon < 180; lon += 30) this.path(ctx, latRange(lon));
    // land
    if (this.land) {
      ctx.fillStyle = '#5d8f5a'; ctx.strokeStyle = 'rgba(0,0,0,.25)';
      ctx.lineWidth = 0.8 * (this.dpr || 1);
      for (const ring of this.land) {
        let started = false;
        ctx.beginPath();
        for (const [lo, la] of ring) {
          const p = this.project(la, lo);
          if (!p) {                       // point behind the limb: end the sub-path
            if (started) { ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.beginPath(); started = false; }
            continue;
          }
          if (!started) { ctx.moveTo(p.x, p.y); started = true; } else ctx.lineTo(p.x, p.y);
        }
        if (started) { ctx.closePath(); ctx.fill(); ctx.stroke(); }
      }
    }
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7);
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
    // marker
    const p = this.project(CLIM.lat, CLIM.lon);
    if (p) {
      const k = this.dpr || 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, 5 * k, 0, 7); ctx.fillStyle = '#ff5a3c'; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 * k; ctx.stroke();
    }
  },
  path(ctx, pts) {
    ctx.beginPath(); let started = false;
    for (const [la, lo] of pts) {
      const p = this.project(la, lo);
      if (!p) { started = false; continue; }
      if (!started) { ctx.moveTo(p.x, p.y); started = true; } else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }
};
function lonRange(lat) { const a = []; for (let lo = -180; lo <= 180; lo += 4) a.push([lat, lo]); return a; }
function latRange(lon) { const a = []; for (let la = -88; la <= 88; la += 4) a.push([la, lon]); return a; }

   Glazing (EN 673 / EN ISO 10077-1) and doors
   ============================================================ */
/* Gas properties at 283 K. Declared fills are 90 % gas / 10 % air (EN 673 practice),
   so the mixture properties are what a product datasheet is based on. */
const GAS_PURE = {
  air:     { lam: 0.02530, rho: 1.232, mu: 1.761e-5, cp: 1008 },
  argon:   { lam: 0.01640, rho: 1.699, mu: 2.164e-5, cp: 519 },
  krypton: { lam: 0.00940, rho: 3.560, mu: 2.340e-5, cp: 245 }
};
function mixGas(key, frac) {
  const g = GAS_PURE[key] || GAS_PURE.air, a = GAS_PURE.air;
  const f = key === 'air' ? 1 : (frac != null ? frac : 0.9);
  const m = k => f * g[k] + (1 - f) * a[k];
  const lam = m('lam'), rho = m('rho'), mu = m('mu'), cp = m('cp');
  return { lam, rho, mu, cp, pr: mu * cp / lam };
}
const GASES = {
  air:  Object.assign(mixGas('air'), {
          name:['Air','Lucht','Air','Luft','Aire','Повітря','Воздух',"Powietrze"] }),
  argon: Object.assign(mixGas('argon', 0.9), {
          name:['Argon 90 %','Argon 90 %','Argon 90 %','Argon 90 %','Argón 90 %','Аргон 90 %','Аргон 90 %',"Argon 90%"] }),
  krypton: Object.assign(mixGas('krypton', 0.9), {
          name:['Krypton 90 %','Krypton 90 %','Krypton 90 %','Krypton 90 %','Kriptón 90 %','Криптон 90 %','Криптон 90 %',"Krypton 90%"] })
};
const SIGMA = 5.67e-8, TM = 283;

/* EN 12898: measured normal emissivity -> hemispherical ("corrected") emissivity,
   which is what the radiative exchange in EN 673 needs. Uncoated float glass:
   epsilon_n = 0.89 -> epsilon = 0.837, the value used for the uncoated surfaces. */
const EMIS_N = [0.03, 0.05, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.89];
const EMIS_H = [0.0365, 0.0605, 0.116, 0.227, 0.332, 0.430, 0.524, 0.612, 0.700, 0.783, 0.837];
function emisCorrected(en) {
  const e = Math.max(0.001, Math.min(0.95, en));
  if (e <= EMIS_N[0]) return e * EMIS_H[0] / EMIS_N[0];
  for (let i = 1; i < EMIS_N.length; i++) {
    if (e <= EMIS_N[i]) {
      const f = (e - EMIS_N[i - 1]) / (EMIS_N[i] - EMIS_N[i - 1]);
      return EMIS_H[i - 1] + f * (EMIS_H[i] - EMIS_H[i - 1]);
    }
  }
  return e * 0.94;
}

function cavityH(s, gasKey, e1, e2) {
  const g = GASES[gasKey] || GASES.air;
  const hr = 4 * SIGMA * Math.pow(TM, 3) / (1 / e1 + 1 / e2 - 1);
  const Gr = 9.81 * Math.pow(s, 3) * 15 * g.rho * g.rho / (TM * g.mu * g.mu);
  const Nu = Math.max(1, 0.035 * Math.pow(Gr * g.pr, 0.38));
  const hg = Nu * g.lam / s;
  return { hr, hg, hs: hr + hg };
}

/* G = {panes, glass:[mm], gaps:[{w,gas}], coatings:[{pos, e}], uf, ff, psig, perim, gOverride, area, shading} */
function calcGlazing(G) {
  const panes = G.panes;
  /* hemispherical emissivities; uncoated float glass = 0.837 (epsilon_n 0.89) */
  const eps = new Array(panes * 2).fill(0.837);        // surface emissivities, #1 = outdoor face
  (G.coatings || []).forEach(c => {
    if (c.pos >= 1 && c.pos <= panes * 2) eps[c.pos - 1] = emisCorrected(c.e);
  });
  let R = 0;
  const detail = [];
  for (let i = 0; i < panes; i++) R += (G.glass[i] || 4) / 1000 / 1.0;   // λ glass = 1.0
  for (let i = 0; i < panes - 1; i++) {
    const gap = G.gaps[i] || { w: 16, gas: 'argon' };
    const c = cavityH(gap.w / 1000, gap.gas, eps[i * 2 + 1], eps[i * 2 + 2]);
    R += 1 / c.hs;
    detail.push({ i, hr: c.hr, hg: c.hg, hs: c.hs });
  }
  const hi = 3.6 + 4.4 * eps[panes * 2 - 1] / 0.837;
  const he = 23;
  const Ug = 1 / (R + 1 / hi + 1 / he);
  // solar factor
  let g = G.gOverride;
  if (g == null) {
    const base = [0.86, 0.76, 0.68, 0.60][Math.min(3, panes - 1)];
    const nlowe = (G.coatings || []).length;
    g = base * Math.pow(0.82, nlowe);
    if (G.solarControl) g *= 0.62;
  }
  const ff = (G.ff || 25) / 100;
  const Uw = (1 - ff) * Ug + ff * (G.uf || 1.4) + (G.psig || 0.06) * (G.perim || 2.4);
  const thickness = G.glass.slice(0, panes).reduce((s, v) => s + v, 0)
    + (G.gaps || []).slice(0, panes - 1).reduce((s, v) => s + v.w, 0);
  return { Ug, Uw, g, gTotal: g * (G.shading != null ? G.shading : 1), detail, thickness, hi, he, ff };
}

function glazingLoads(res, S, orient) {
  const o = CLIM.orient[orient] || CLIM.orient.S;
  const peakI = o ? o.peak : 500;
  const summer = o ? o.summerDay : 3;
  const annual = o ? o.annual : 700;
  const qHeat = res.Uw * (S.ti - S.teHeat);
  const qCoolTrans = res.Uw * (S.teCool - S.tiCool);

  return { qHeat, qCoolTrans, qCoolSol, qCool: qCoolTrans + qCoolSol,

/* surface condensation on the inner pane */
/* EN ISO 13788 §5.3: Rsi = 0.25 m²·K/W for surface condensation on glazing and doors

const RSI_SURF = 0.25;
function glazingCondensation(Uw, ti, rhi, te) {
  const Rsi = RSI_SURF;

  return { thSi, td, risk: thSi < td };

/* Door: layered panel + frame + optional glazing */
function calcDoor(D) {
  const panel = calcAssembly({
    type: 'wall', layers: D.layers, ti: D.ti, te: D.te, rhi: D.rhi, rhe: D.rhe,
    bridges: [], humidityClass: 2
  });
  const fg = (D.glassFrac || 0) / 100, ff = (D.frameFrac || 20) / 100;
  const fp = Math.max(0, 1 - fg - ff);
  const Ug = D.ug || 1.1;
  const UD = fp * panel.U + fg * Ug + ff * (D.uf || 1.6) + (D.psiThr || 0) * (D.thrLen || 1.0);
  return { panel, UD, fp, fg, ff };
}

function renderGlaser(res) {

  if (!svg) return;
  const coarse = drawK('glz', 460) > 1.3;
  svg.setAttribute('viewBox', (coarse ? '-22 0 482' : '0 0 460') + ' 300');
  const W = 460, H = 300, L = 46, R = 12, T = 14, B = 34;
  const Sd = Math.max(0.01, res.Sdtot);
  /* axis compression: a single vapour-tight layer (μ ≈ 10⁶) would otherwise
     squeeze every other layer into one pixel. Physics is untouched. */

  const real = res.nodes.map(n => n.sd);
  const plot = [0];
  let compressed = false;
  for (let i = 1; i < real.length; i++) {
    const d = real[i] - real[i - 1];
    if (d > CAP) compressed = true;
    plot.push(plot[i - 1] + Math.min(d, CAP));
  }
  const Sdp = Math.max(0.01, plot[plot.length - 1]);
  const map = sd => {
    for (let i = 1; i < real.length; i++) {
      if (sd <= real[i] + 1e-9) {
        const den = real[i] - real[i - 1];
        const f = den < 1e-12 ? 0 : (sd - real[i - 1]) / den;
        return plot[i - 1] + f * (plot[i] - plot[i - 1]);

    }

  };

  const pmax = Math.max(...pts.map(p => p.ps), res.pi, res.pe) * 1.08;
  const x = sd => L + map(sd) / Sdp * (W - L - R);
  const y = p => H - B - p / pmax * (H - T - B);
  let sat = '', act = '';
  pts.forEach((p, i) => sat += (i ? 'L' : 'M') + x(p.sd).toFixed(1) + ' ' + y(p.ps).toFixed(1) + ' ');
  res.glaser.hull.forEach((p, i) => act += (i ? 'L' : 'M') + x(p.sd).toFixed(1) + ' ' + y(p.p).toFixed(1) + ' ');
  let grid = '';
  const st = niceStep(pmax / (coarse ? 3 : 5));
  for (let v = 0; v <= pmax; v += st)
    grid += `<line x1="${L}" y1="${y(v).toFixed(1)}" x2="${W - R}" y2="${y(v).toFixed(1)}" stroke="#e3e9ee"/>
      <text class="axis" x="${L - 5}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end">${nsep(Math.round(v))}</text>`;
  let seps = '';
  pts.forEach((p, i) => { if (i && i < pts.length) seps += `<line x1="${x(p.sd).toFixed(1)}" y1="${T}" x2="${x(p.sd).toFixed(1)}" y2="${H - B}" stroke="#eceff2"/>`; });

  res.glaser.interfaces.forEach(i => {
    marks += `<circle cx="${x(i.sd).toFixed(1)}" cy="${y(i.p).toFixed(1)}" r="5" fill="#c62f2f" stroke="#fff" stroke-width="2"/>`;
  });
  svg.innerHTML = `${grid}${seps}
    <path d="${sat}" fill="none" stroke="#2a6fb5" stroke-width="2.2"/>
    <path d="${act}" fill="none" stroke="#1f8a4c" stroke-width="2.2" stroke-dasharray="0"/>
    ${marks}
    <line class="axis" x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}"/>
    <text class="axis" x="${L}" y="${H - B + 14}" text-anchor="start">${esc(t('ch.inside'))}</text>
    <text class="axis" x="${W - R}" y="${H - B + 14}" text-anchor="end">${esc(t('ch.outside'))}</text>
    <text class="axis" x="${(W / 2).toFixed(0)}" y="${H - 6}" text-anchor="middle">${esc(t('ch.sdaxis'))} = ${fmt(Sd, 2)}${compressed ? ' ⤬' : ''}</text>

  else if (a === 'adj') ST.adjIndex = i;
  else return;
  render({ skipLayers: live });
}

/* ---------- section drag ---------- */
let rafPending = false;
function installSectionDrag(svg, res, S) {
  const g = svg.__geom;
  const px2u = () => SECW / Math.max(1, svg.getBoundingClientRect().width);

  /* Listeners live on window: the SVG is rebuilt on every frame, so anything
     attached to the handle itself would be destroyed mid-drag. */
  svg.querySelectorAll('.handle').forEach(h => {
    h.addEventListener('pointerdown', ev => {
      ev.preventDefault();
      const i = +h.dataset.i;
      if (!ST.layers[i]) return;
      pushHistory();
      const start = { x: ev.clientX, d: ST.layers[i].d, dn: ST.layers[i + 1] ? ST.layers[i + 1].d : null };
      DRAG = { kind: 'edge', i, start, scale: g.scale, px2u: px2u() };
      document.body.style.cursor = 'ew-resize';
    });
  });
  const dh = svg.querySelector('#dewHandle');
  if (dh) dh.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    const idx = adjustableIndex();
    if (idx < 0) return;
    pushHistory();
    DRAG = { kind: 'dew', idx, scale: g.scale, px2u: px2u(), left: svg.getBoundingClientRect().left };
    document.body.style.cursor = 'ew-resize';
  });
}
let DRAG = null;
window.addEventListener('pointermove', e => {
  if (!DRAG) return;
  e.preventDefault();
  if (DRAG.kind === 'edge') {
    const i = DRAG.i, st = DRAG.start;
    const dxu = (e.clientX - st.x) * DRAG.px2u;
    let nd = st.d + dxu / DRAG.scale;
    if (ST.snap && nd > 12) nd = Math.round(nd / 10) * 10;
    nd = Math.max(0.5, Math.min(2000, Math.round(nd * 10) / 10));
    const delta = nd - st.d;
    ST.layers[i].d = nd;
    if (ST.keepTotal && st.dn != null && ST.layers[i + 1]) ST.layers[i + 1].d = Math.max(0.5, st.dn - delta);
    schedule();
  } else {
    const targetMm = ((e.clientX - DRAG.left) * DRAG.px2u - ML) / DRAG.scale;
    const nd = solveDewTarget(DRAG.idx, targetMm);
    if (nd != null && Math.abs(nd - ST.layers[DRAG.idx].d) > 0.05) { ST.layers[DRAG.idx].d = nd; schedule(); }
  }
}, { passive: false });
window.addEventListener('pointerup', () => {
  if (!DRAG) return;
  DRAG = null; document.body.style.cursor = '';
  render();
});
window.addEventListener('pointercancel', () => { DRAG = null; document.body.style.cursor = ''; });

function schedule() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; render(); });
}
function adjustableIndex() {
  if (ST.adjIndex != null && ST.layers[ST.adjIndex]) return ST.adjIndex;
  let best = -1, bR = -1;
  ST.layers.forEach((l, i) => {
    const m = matOf(l);
    if (m && m.cat === 'insulation') { const R = layerR(l); if (R > bR) { bR = R; best = i; } }
  });
  if (best < 0) { let bd = -1; ST.layers.forEach((l, i) => { if (l.d > bd) { bd = l.d; best = i; } }); }
  return best;
}
function solveDewTarget(idx, targetMm) {
  const backup = ST.layers[idx].d;
  const posFor = d => {
    ST.layers[idx].d = d;
    const r = calcAssembly(ST);
    return r.dewPos.where === 'inside' ? r.dewPos.mm : (r.dewPos.where === 'outside' ? 1e6 : -1e6);
  };
  let bestD = backup, bestE = Infinity;
  for (let k = 0; k <= 48; k++) {
    const d = 1 + k * (400 / 48);
    const e = Math.abs(posFor(d) - targetMm);
    if (e < bestE) { bestE = e; bestD = d; }
  }
  let lo = Math.max(1, bestD - 10), hi = Math.min(500, bestD + 10);
  for (let k = 0; k < 22; k++) {
    const m1 = lo + (hi - lo) / 3, m2 = hi - (hi - lo) / 3;
    if (Math.abs(posFor(m1) - targetMm) < Math.abs(posFor(m2) - targetMm)) hi = m2; else lo = m1;
  }
  ST.layers[idx].d = backup;
  let out = Math.round(((lo + hi) / 2) * 10) / 10;
  if (ST.snap && out > 12) out = Math.round(out / 10) * 10;
  return Math.max(1, out);
}

const NORMS = {
  eu:  { name:['EU new build (typical)','EU nieuwbouw','Neuf UE','EU-Neubau','Obra nueva UE','ЄС новобудова','ЕС, новое строительство',"Nowy budynek w UE (typowy)"], wall:0.24, roof:0.18, floor:0.30 },
  pass:{ name:['Passive house','Passiefhuis','Maison passive','Passivhaus','Casa pasiva','Пасивний дім','Пассивный дом',"Dom pasywny"], wall:0.15, roof:0.12, floor:0.15 },
  be:  { name:['Belgium EPB','België EPB','Belgique PEB','Belgien EPB','Bélgica EPB','Бельгія EPB','Бельгия EPB',"Belgia EPB"], wall:0.24, roof:0.24, floor:0.24 },
  de:  { name:['Germany GEG','Duitsland GEG','Allemagne GEG','Deutschland GEG','Alemania GEG','Німеччина GEG','Германия GEG',"Niemcy GEG"], wall:0.28, roof:0.20, floor:0.35 },
  ru:  { name:['Russia SP 50 (from HDD)','Rusland SP 50','Russie SP 50','Russland SP 50','Rusia SP 50','Росія СП 50','Россия СП 50 (по ГСОП)',"Rosja SP 50 (z HDD)"], calc:true },
  cust:{ name:['Custom','Eigen','Personnalisé','Eigen','Personalizado','Власне','Своё',"Zwyczaj"], custom:true }
};
function normTarget() {
  const n = NORMS[ST.normSet];
  if (!n) return ST.targetU;
  if (n.custom) return ST.targetU;
  if (n.calc) {
    const gsop = Math.max(1000, (CLIM.hdd || 3500) * 1.15);       // HDD18 -> GSOP20, rough
    const ab = { wall: [0.00035, 1.4], roof: [0.00045, 1.9], floor: [0.00045, 1.9] }[ST.type];
    return 1 / (ab[0] * gsop + ab[1]);
  }

/* ---------- small DOM helper (the fallback shell must not depend on the framework) ---------- */
const SVGNS = 'http://www.w3.org/2000/svg';
function mk(tag, attrs, kids) {
  const n = tag === 'svg' ? document.createElementNS(SVGNS, 'svg') : document.createElement(tag);
  Object.keys(attrs || {}).forEach(k => {
    const v = attrs[k];
    if (v == null || v === false) return;
    if (k === 'class') { if (tag === 'svg') n.setAttribute('class', v); else n.className = v; }
    else if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  });
  (kids || []).forEach(c => { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return n;
}

/* ---------- results ---------- */
function tile(label, value, unit, cls) {
  return `<div class="t ${cls || ''}"><div class="l">${esc(label)}</div>
    <div class="n">${value}</div><div class="u">${esc(unit || '')}</div></div>`;
}
function kv(k, v) { return `<div class="kv"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`; }
function kvRows(rows) {
  const box = mk('div', { class: 'wt-host' });
  box.innerHTML = rows.map(r => kv(r[0], r[1])).join('');
  return box;
}

/* The assembly answer. Every number is formatted by the tool's own fmt() and
   handed to the framework as a string, so the digits on screen are the digits
   this page printed before the port. */
function resultsAssembly(res) {
  const cooling = ST.mode === 'cooling';
  const cr = cooling ? coolingResponse(res, ST) : null;
  const target = normTarget();
  const pass = res.Uc <= target + 1e-9;
  const frsiOk = res.fRsi >= 0.75;
  const dew = res.dewPos.where === 'inside'
    ? fmt(res.dewPos.mm, 0) + ' ' + u('mm') + ' · ' + t('res.inside') + ' ' + nameOf(matOf(res.rows[res.dewPos.layer].l))
    : (res.dewPos.where === 'surface' ? t('res.atsurface') : t('res.notreached'));

  const tiles = [
    { label: 'R', value: fmt(res.R_T, 3), unit: u('R'), learn: 'u' },
    { label: 'U', value: fmt(res.Uc, 3), unit: u('U'), tone: pass ? 'ok' : 'bad', learn: 'u' },
    { label: 'fRsi', value: fmt(res.fRsi, 3), tone: frsiOk ? 'ok' : 'bad', learn: 'frsi' },
    { label: t('res.cond'), value: res.glaser.condensing ? t('res.yes') : t('res.no'),
      unit: res.glaser.condensing ? fmt(res.glaser.gTotal * 86400 * 1000, 1) + ' ' + u('gd') : '',
      tone: res.glaser.condensing ? 'bad' : 'ok', learn: 'cond-ok', headline: false },
    { label: t('res.shift'), value: fmt(res.dyn.shift, 1), unit: u('h'), learn: 'dyn', headline: false },
    { label: t('res.decr'), value: fmt(res.dyn.decrement, 3), learn: 'dyn', headline: false }
  ];

  const rows = [];
  rows.push([t('res.Rt'), fmt(res.R_T, 3) + ' ' + u('R')]);
  rows.push([t('res.U'), fmt(res.U, 3) + ' ' + u('U')]);
  if (res.dU) rows.push([t('res.Uc') + ' (ΔU ' + fmt(res.dU, 3) + ')', fmt(res.Uc, 3) + ' ' + u('U')]);
  if (res.hasFrame) rows.push(['R′ / R″', fmt(res.Rupper, 3) + ' / ' + fmt(res.Rlower, 3)]);
  rows.push([t('res.thick'), fmt(res.totalD, 0) + ' ' + u('mm')]);
  rows.push([t('res.mass'), fmt(res.mass, 0) + ' ' + u('mass')]);
  rows.push([t('res.tsi'), fmt(res.thSi, 2) + ' °C']);
  if (Math.abs(res.thSiDesign - res.thSi) > 0.05) rows.push([t('res.thsid'), fmt(res.thSiDesign, 2) + ' °C']);
  rows.push([t('res.dew'), fmt(res.tdew, 2) + ' °C']);
  rows.push([t('res.dewpos'), dew]);
  if (res.glaser.condensing) rows.push([t('res.gc'), fmt(res.glaser.gTotal * 86400 * 30 * 1000, 1) + ' ' + u('g30')]);
  rows.push([t('res.kappa'), fmt(res.dyn.kappaIn, 1) + ' ' + u('kap')]);
  rows.push([t('res.decr'), fmt(res.dyn.decrement, 3)]);
  rows.push([t('res.shift'), fmt(res.dyn.shift, 1) + ' ' + u('h')]);
  if (!cooling) {
    rows.push([t('res.qh'), fmt(res.Uc * (ST.ti - ST.te), 1) + ' ' + u('q')]);
    if (CLIM.hdd) rows.push([t('res.qy'), fmt(res.Uc * CLIM.hdd * 24 / 1000, 1) + ' ' + u('yr')]);
  }
  if (cr) {
    rows.push([t('cl.solair'), fmt(cr.max, 1) + ' °C (' + cr.peakHour + ':00 UTC)']);
    rows.push([t('res.qc'), fmt(cr.q, 1) + ' ' + u('q')]);
  }

  const notes = [];
  if (res.ignored.length) notes.push(t('hint.strongvent'));
  if (res.hasFrame) notes.push(t('res.profnote'));
  res.warn.forEach(w => notes.push('⚠ ' + t(w)));
  notes.push(t('nm.frsimin') + ': ' + fmt(res.fRsi, 2) + ' — ' + (frsiOk ? t('nm.pass') : t('nm.fail')));

  /* the per-layer table keeps its own markup so the column alignment and the
     surface-resistance rows survive unchanged */
  const tbl = mk('div', { class: 'wt-scroll' });
  tbl.innerHTML = `<table class="tb">${layerTableHTML(res)}</table>`;
  const cap = mk('div', { class: 'wt-host' }, [
    mk('div', { class: 'dgu-panel-t', text: t('res.perlayer') }), tbl
  ]);

  return {
    verdict: { tone: pass ? 'ok' : 'bad',
      text: 'U = ' + fmt(res.Uc, 3) + ' ≤ ' + fmt(target, 3) + ' ' + u('U') + ' — ' + (pass ? t('nm.pass') : t('nm.fail')) },
    tiles: tiles,
    nodes: [kvRows(rows), cap],
    notes: notes
  };
}
function layerTableHTML(res) {
  const rowsHtml = res.rows.map((r, i) => `<tr>
    <td>${esc(nameOf(r.m))}</td><td>${fmt(r.l.d, 1)}</td>
    <td>${r.lam != null ? fmt(r.lam, 3) : '—'}</td><td>${fmt(r.R, 3)}</td><td>${fmt(r.sd, 2)}</td>
    <td>${fmt(res.nodes[i + 1].th, 1)}</td><td>${fmt(psat(res.nodes[i + 1].th), 0)}</td></tr>`).join('');
  return `<thead><tr>
      <th>${esc(t('lbl.material'))}</th><th>${esc(t('lbl.d'))}</th><th>λ</th><th>R</th><th>Sd</th>
      <th>θ, °C</th><th>p sat, ${esc(u('Pa'))}</th></tr></thead>
    <tr><td>${esc(t('cond.rsi'))}</td><td>—</td><td>—</td><td>${fmt(res.Rsi, 3)}</td><td>0</td>
      <td>${fmt(res.thSi, 1)}</td><td>${fmt(psat(res.thSi), 0)}</td></tr>
    ${rowsHtml}
    <tr><td>${esc(t('cond.rse'))}</td><td>—</td><td>—</td><td>${fmt(res.Rse, 3)}</td><td>—</td>
      <td>${fmt(ST.te, 1)}</td><td>${fmt(psat(ST.te), 0)}</td></tr>`;
}

/* ---------- glazing ---------- */
/* The three cavity gaps and the four panes are driven by one thickness, one gap
   width and one gas, exactly as the form did; the low-e count and emissivity
   keep their own mirrors because a coating whose surface does not exist in the
   current pane count is dropped from the array but not from the form. */
function readGlazing() {
  const G = ST.glazing;
  G.panes = Math.max(1, Math.min(4, +G.panes || 2));
  const gt = +(G.glass && G.glass[0]) || 4;
  const gw = +(G.gaps && G.gaps[0] ? G.gaps[0].w : 16) || 16;
  const gas = (G.gaps && G.gaps[0] && G.gaps[0].gas) || 'argon';
  G.glass = [gt, gt, gt, gt];
  G.gaps = [0, 1, 2].map(() => ({ w: gw, gas }));
  const n = Math.max(0, Math.min(3, +GLOWE || 0)), e = +GEPS || 0.03;
  const positions = [3, 5, 2];                      // typical coating surfaces
  G.coatings = [];
  for (let i = 0; i < n; i++) if (positions[i] <= G.panes * 2) G.coatings.push({ pos: positions[i], e });
  return G;
}
function resultsGlazing() {

function drawGlazing(G, r) {
  const svg = $('#gSvg'); if (!svg) return;
  const W = 640, H = 260, x0 = 60, x1 = W - 60;
  const tot = r.thickness || 24;
  const sc = (x1 - x0) / tot;
  let x = x0, body = '', lbl = '';
  const y0 = 40, y1 = 190;
  for (let i = 0; i < G.panes; i++) {
    const gw = (G.glass[i] || 4) * sc;
    body += `<rect x="${x.toFixed(1)}" y="${y0}" width="${Math.max(3, gw).toFixed(1)}" height="${y1 - y0}"
      fill="#bfdfe8" stroke="#3d6b78" stroke-width="1"/>`;
    const co = (G.coatings || []).filter(c => c.pos === i * 2 + 1 || c.pos === i * 2 + 2);
    co.forEach(c => {
      const side = c.pos === i * 2 + 1 ? x : x + Math.max(3, gw) - 2.5;
      body += `<rect x="${side.toFixed(1)}" y="${y0}" width="2.5" height="${y1 - y0}" fill="#d99a3c"/>`;
    });
    lbl += `<text class="lblbox" x="${(x + gw / 2).toFixed(1)}" y="${y1 + 15}" text-anchor="middle">${nsep(G.glass[i])}</text>`;
    x += gw;
    if (i < G.panes - 1) {
      const w2 = (G.gaps[i].w) * sc;
      body += `<rect x="${x.toFixed(1)}" y="${y0}" width="${w2.toFixed(1)}" height="${y1 - y0}"
        fill="#eef6f8" stroke="#9fbcc4" stroke-dasharray="4 3"/>`;
      lbl += `<text class="lblbox" x="${(x + w2 / 2).toFixed(1)}" y="${y1 + 15}" text-anchor="middle">${nsep(G.gaps[i].w)}</text>
        <text class="lblbox" x="${(x + w2 / 2).toFixed(1)}" y="${(y0 + y1) / 2}" text-anchor="middle"
          style="fill:#5b7c86">${esc(((GASES[G.gaps[i].gas] || GASES.air).name[LI()] || '').split(' ')[0])}</text>`;
      x += w2;
    }
  }
  svg.innerHTML = `<rect x="0" y="${y0}" width="${x0}" height="${y1 - y0}" fill="#fbf3ef"/>
    <rect x="${x1}" y="${y0}" width="${W - x1}" height="${y1 - y0}" fill="#eef4fa"/>
    ${body}${lbl}
    <text class="lblbox" x="6" y="30" style="font-weight:600">${esc(t('ch.inside'))}</text>
    <text class="lblbox" x="${W - 6}" y="30" text-anchor="end" style="font-weight:600">${esc(t('ch.outside'))}</text>
    <text class="lblbox" x="${(W / 2).toFixed(0)}" y="${H - 20}" text-anchor="middle">
      Ug ${fmt(r.Ug, 2)} · Uw ${fmt(r.Uw, 2)} W/(m²·K) · g ${fmt(r.g, 2)}</text>`;
  scaleLabels(svg, W);
}

/* ---------- doors ---------- */
function drawStrip(svg, res) {
  if (!svg) return;
  const W = 900, H = 300, x0 = 40, x1 = W - 40, y0 = 40, y1 = 220;
  const tot = res.rows.reduce((s, r) => s + r.l.d, 0) || 1;
  const sc = (x1 - x0) / tot;
  let defs = '', body = '', lbl = '', x = x0;
  res.rows.forEach((r, i) => {
    const col = r.l.color || r.m.color;
    defs += texturePattern('dp' + i, r.m.tex || 'board', col);
    const w = Math.max(6, r.l.d * sc);
    body += `<rect x="${x.toFixed(1)}" y="${y0}" width="${w.toFixed(1)}" height="${y1 - y0}"
      fill="url(#dp${i})" stroke="#39434d" stroke-width="0.8"/>`;
    lbl += `<text class="lblbox" x="${(x + w / 2).toFixed(1)}" y="${y1 + 16}" text-anchor="middle">${fmtMm(r.l.d)}</text>`;
    x += w;
  });
  const lo = Math.min(ST.ti, ST.te) - 2, hi = Math.max(ST.ti, ST.te) + 2;
  const ty = th => y1 - (th - lo) / Math.max(1e-6, hi - lo) * (y1 - y0);
  let tp = ''; let xx = x0;
  res.nodes.forEach((n, i) => {
    tp += (i ? 'L' : 'M') + xx.toFixed(1) + ' ' + ty(n.th).toFixed(1) + ' ';
    if (i < res.rows.length) xx += Math.max(6, res.rows[i].l.d * sc);
  });
  svg.innerHTML = `<defs>${defs}</defs>${body}
    <path d="${tp}" fill="none" stroke="#fff" stroke-width="5"/>
    <path d="${tp}" fill="none" stroke="#d9531e" stroke-width="2.4"/>${lbl}`;
  scaleLabels(svg, W);
}

/* ---------- fields ---------- */
/* Native min/max/step are re-applied to the generated controls so the spinners
   and the browser's own validation behave exactly as they did before the port;
   the framework's clamping is deliberately not used, because clamping would
   change a number the page used to compute with. */
const NATIVE = {
  'f-rhi': { min: 1, max: 100 }, 'f-rhe': { min: 1, max: 100 },
  'f-lowe': { min: 0, max: 3 }, 'f-abs': { min: 0.05, max: 1 }, 'f-albedo': { min: 0, max: 0.9 }
};
function applyNativeLimits() {
  Object.keys(NATIVE).forEach(id => {
    const c = document.getElementById(id + '-c') || document.getElementById(id);
    if (!c) return;
    if (NATIVE[id].min != null) c.min = NATIVE[id].min;
    if (NATIVE[id].max != null) c.max = NATIVE[id].max;
  });
}
const numF = (id, key, labelKey, step, unitTxt, extra) => Object.assign({
  id: id, key: key, type: 'number', step: step, label: Lu(labelKey), unit: unitTxt
}, extra || {});
/* The typed field and a handed-over value obey the same bound: NATIVE marks the
   control, these refuse the commit and name the range. */
const vTh = v => (v == null || !isFinite(v) || (v >= TH_ACC[0] && v <= TH_ACC[1]))
  ? true : t('val.range').replace('%r', rangeTh());
const vRh = v => (v == null || !isFinite(v) || (v >= RH_ACC[0] && v <= RH_ACC[1]))
  ? true : t('val.range').replace('%r', rangeRh());

let STAGES = {};

/* ---------- tab visibility ---------- */
function syncTabs() {
  if (!ui) return;
  (ui.panels || []).forEach(p => {
    if (p.def && p.def.tab) p.checkEmpty();      /* patched below: emptiness, then the tab filter */
  });
  const show = { sec: 'assembly', glz: 'assembly', glazing: 'glazing', doors: 'doors', globe: 'climate' };
  Object.keys(show).forEach(k => { if (STAGES[k]) STAGES[k].node.hidden = (show[k] !== TAB); });
  if (STAGES.sec && TAB === 'assembly') STAGES.sec.schedule();
}
/* the framework re-shows a panel with a custom body whenever it syncs, so the
   tab filter is applied inside each panel's own emptiness check */
function patchPanels() {
  (ui.panels || []).forEach(p => {
    if (p.__wt) return;
    p.__wt = true;
    const orig = p.checkEmpty.bind(p);
    p.checkEmpty = function () {
      orig();
      const tabs = p.def && p.def.tab;
      if (tabs && tabs.indexOf(TAB) < 0) p.node.hidden = true;
    };
  });
}

/* ---------- master render ---------- */
function render(opts) {
  opts = opts || {};
  const sr = surfaceR(ST.type);
  /* the door panel has always carried the assembly's boundary conditions, and
     they are part of the serialised state, so they are refreshed on every pass
     and not only while the door tab is open */
  ST.door.ti = ST.ti; ST.door.te = ST.te; ST.door.rhi = ST.rhi; ST.door.rhe = ST.rhe;
  setNote('f-flow', flowNoteText());

  if (!opts.skipLayers) { renderLayers(); renderBridges(); }
  buildCompass();

  let data = null;
  if (!ST.layers.length) {
    LAST = null;
    ['sec', 'glz', 'secLegend', 'glzLegend'].forEach(id => { const e = document.getElementById(id); if (e) e.innerHTML = ''; });
    const rep = $('#report'); if (rep) rep.innerHTML = `<div class="hint">${esc(t('ms.empty'))}</div>`;
  } else {
    const res = calcAssembly(ST); LAST = res;
    renderSection(res, ST);
    renderGlaser(res);
    if (TAB === 'report') renderReport(res);
  }
  if (TAB === 'glazing') data = resultsGlazing();
  else if (TAB === 'doors') data = resultsDoor();
  else if (TAB === 'climate') data = resultsClimate();
  else if (LAST) data = resultsAssembly(LAST);

  if (ui) {
    if (data) ui.results(data);
    else { ui.resultsView && ui.resultsView.set(null); ui.renderStrip(null); }
    syncTabs();
  } else fbResults(data);
  if (Globe.ctx) Globe.draw();
  LASTSNAP = snapshot();
  return undefined;
}
function setNote(fieldId, text) {
  const n = document.querySelector('[data-dgu-field="' + fieldId + '"] .dgu-hint');
  if (n) n.textContent = text;
  const f = document.getElementById(fieldId + '-note');
  if (f) f.textContent = text;
}

/* ---------- undo / redo ---------- */
function snapshot() { try { return JSON.stringify({ ST: ST, lowe: GLOWE, eps: GEPS }); } catch (e) { return null; } }
function pushHistory() { if (ui && ui.history) ui.history.push(); }
function restoreSnapshot(snap) {
  if (!snap) return;
  let o = null;
  try { o = JSON.parse(snap); } catch (e) { return; }
  const g = ST.glazing, d = ST.door;
  Object.assign(ST, o.ST);
  ST.glazing = Object.assign({}, g, o.ST.glazing || {});
  ST.door = Object.assign({}, d, o.ST.door || {});
  GLOWE = o.lowe; GEPS = o.eps;
  syncInputs();
  render();
}

/* ---------- presets, reset, optimiser ---------- */
function applyPreset(p) {
  pushHistory();
  ST.layers = p.layers.map(([id, d]) => mkLayer(id, d));
  if (p.frame) { const l = ST.layers[p.frame.index]; if (l) { l.frameFrac = p.frame.frac; l.frameMat = p.frame.mat; } }
  ST.type = p.type; ST.adjIndex = null;
  syncInputs();
  render();
}
function resetAll() {
  pushHistory();
  Object.assign(ST, JSON.parse(JSON.stringify(DEFAULT_ST)));
  ST.absorptance = absorptanceFromColor(ST.color);
  ST.door.layers = [mkLayer('plywood', 6), mkLayer('pur_spray', 40), mkLayer('plywood', 6)];
  GLOWE = 1; GEPS = 0.03;
  applyPreset(PRESETS[0]);
  if (ui) ui.notify(uiT('reset'), { kind: 'ok' });
}
function solveThicknessAction() {
  const idx = adjustableIndex();
  if (idx < 0) return;
  const d = solveThickness(ST, idx, OPTGOAL === 'U' ? 'U' : 'dew', normTarget());
  if (d == null) setNote('f-optres', t('opt.nosol'));
  else {
    pushHistory();
    ST.layers[idx].d = d; render();
    setNote('f-optres', t('opt.result') + ': ' + fmt(d, 1) + ' ' + u('mm') + ' — ' + nameOf(matOf(ST.layers[idx])));
  }
}

/* ---------- conditions helpers ---------- */
/* withIndoor = true only when the user switches heating/cooling or asks explicitly;
   loading climate data must never silently rewrite the indoor conditions */
function applyDesignConditions(withIndoor) {
  if (ST.mode === 'cooling') {
    ST.te = CLIM.loaded ? CLIM.designCool : ST.teCool;

function fbField(f) {
  if (f.type === 'note') return mk('div', { class: 'hint', id: f.id + '-note' });
  const wrap = mk('label', { class: 'f' });
  wrap.appendChild(mk('span', { text: pickLabel(f.label) + (f.unit ? ', ' + f.unit : '') }));
  const val = f.get ? f.get(ST) : DiagramPath(ST, f.key);
  let ctl;
  if (f.type === 'segmented' || f.type === 'select') {
    ctl = mk('select', {});
    const opts = typeof f.options === 'function' ? f.options() : f.options;
    (opts || []).forEach(o => {
      const pair = Array.isArray(o) ? o : [o, String(o)];
      ctl.appendChild(mk('option', { value: pair[0], text: pair[1] }));
    });
    ctl.value = String(val);
    ctl.addEventListener('change', () => fbCommit(f, ctl.value));
  } else if (f.type === 'toggle') {
    ctl = mk('input', { type: 'checkbox' });
    ctl.checked = !!val;
    ctl.addEventListener('change', () => fbCommit(f, ctl.checked));
  } else {
    ctl = mk('input', { type: f.type === 'number' ? 'number' : (f.inputType || 'text'), step: f.step });
    ctl.value = val == null ? '' : String(val);

    ctl.addEventListener('change', () => fbCommit(f, f.type === 'number'

}
function DiagramPath(o, path) {

function dgcLayerSpec(l, flow) {
  const m = matOf(l);
  const isCav = m.R != null || m.Rdir != null;
  const o = { name: nameOf(m), d: Math.max(0, l.d) };
  if (isCav) {
    o.cavity = true;
    if (m.lowe) o.R = cavityR(m, flow, l.d);
    o.mu = 1; o.rho = m.rho || 1.2; o.c = m.c || 1005;
    if (l.vent && l.vent !== 'none') o.vent = l.vent;
  } else {
    o.lam = lamOf(l);
    if (m.sd != null) o.sd = m.sd;
    else o.mu = (l.muOverride != null ? l.muOverride : (m.mu != null ? m.mu : 1));
    o.rho = m.rho || 0; o.c = m.c || 1000;
    if (l.frameFrac > 0 && l.frameMat && MATBYID[l.frameMat]) {
      const fm = MATBYID[l.frameMat];
      o.frac = l.frameFrac;
      o.frame = { name: nameOf(fm), lam: fm.lam, rho: fm.rho, c: fm.c };
    }
  }
  return o;
}
function dgcSerialize() {
  return { v: 2, lang: LANG, ST: JSON.parse(JSON.stringify(ST)),
    CLIM: { lat: CLIM.lat, lon: CLIM.lon, place: CLIM.place,
            monthlyTe: CLIM.monthlyTe, monthlyRhe: CLIM.monthlyRhe } };
}
function dgcDeserialize(st) {
  if (!st || typeof st !== 'object' || !st.ST || !Array.isArray(st.ST.layers))
    throw new Error('unrecognised state payload for the wall calculator');
  const snapshot = JSON.parse(JSON.stringify(ST));
  try {
    const g = snapshot.glazing, d = snapshot.door;
    Object.assign(ST, st.ST);
    ST.glazing = Object.assign({}, g, st.ST.glazing || {});
    ST.door = Object.assign({}, d, st.ST.door || {});
    if (['wall', 'roof', 'floor'].indexOf(ST.type) < 0) ST.type = 'wall';
    if (st.CLIM) Object.assign(CLIM, st.CLIM);
    const langChanged = st.lang && LANGS.some(l => l.code === st.lang) && st.lang !== LANG;
    if (langChanged) LANG = st.lang;
    syncInputs();
    if (langChanged) applyLang(true); else render();
  } catch (e) {
    Object.assign(ST, snapshot); syncInputs(); render();
    throw e;
  }
}
const DGC_UNITS = {
  element_type: '', theta_i: '°C', rh_i: '%', theta_e: '°C', rh_e: '%',
  R_si: 'm²·K/W', R_se: 'm²·K/W', humidity_class: '', layers_json: 'JSON',
  bridges_json: 'JSON',
  R_T: 'm²·K/W', U: 'W/(m²·K)', U_incl_bridges: 'W/(m²·K)', f_Rsi: '-',
  theta_si: '°C', theta_se: '°C', theta_si_design: '°C', theta_dew: '°C',
  dew_depth: 'mm', condensation_rate: 'g/(m²·d)', total_thickness: 'mm',
  mass: 'kg/m²', kappa_internal: 'kJ/(m²·K)', decrement_factor: '-',
  time_shift: 'h', heat_flux: 'W/m²'
};
function dgcInputs() {
  const sr = surfaceR(ST.type), res = LAST;
  return {
    element_type: ST.type, theta_i: ST.ti, rh_i: ST.rhi, theta_e: ST.te, rh_e: ST.rhe,
    R_si: res ? res.Rsi : sr.rsi, R_se: res ? res.Rse : sr.rse,
    humidity_class: (ST.humidityClass != null ? ST.humidityClass : 2) + 1,
    layers_json: JSON.stringify(ST.layers.map(l => dgcLayerSpec(l, sr.dir))),
    bridges_json: JSON.stringify((ST.bridges || []).map(b => ({

function dgcOutputs(res) {
