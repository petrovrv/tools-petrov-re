function dgcHandoffApply(payload) {
  const q = (payload && payload.quantities) || {};
  const accepted = [], ignored = [];
  const mark = (a, k) => { if (a.indexOf(k) < 0) a.push(k); };
  /* A quantity outside the accepted range is named to the reader with its own
     value and the range, in the language the page is running in, and nothing of
     it reaches the state (AGENTS 2.4). */
  const say = msg => {
    try { if (window.Diagram && typeof Diagram.notify === 'function') Diagram.notify(msg, 'warn'); }
    catch (e) {}
  };
  const refuse = (k, shown, range) => {
    mark(ignored, k);
    say(t('ho.range').replace('%q', k).replace('%v', shown).replace('%r', range));
  };
  let T = null, w = null, p = null;
  Object.keys(q).forEach(k => {
    const v = q[k] && q[k].value;
    if (!isFinite(v)) { mark(ignored, k); return; }
    if (k === 'T') T = v; else if (k === 'w') w = v; else if (k === 'p') p = v;
    else mark(ignored, k);
  });
  /* The humidity conversion needs the indoor temperature, so a payload without
     a usable T applies nothing; every quantity in it is reported. */
  let th = null;
  if (T != null) {
    const c = T - 273.15;
    if (c < TH_ACC[0] || c > TH_ACC[1]) refuse('T', fmt(c, 1) + ' °C', rangeTh());
    else { th = c; ST.ti = c; mark(accepted, 'T'); }
  }
  if (th == null) {
    Object.keys(q).forEach(k => mark(ignored, k));
    return { accepted: [], ignored: ignored };
  }
  let pUse = P_STD, pOk = false;
  if (p != null) {
    if (p < P_ACC[0] || p > P_ACC[1]) refuse('p', fmt(p / 1000, 2) + ' kPa', rangeP());
    else { pUse = p; pOk = true; }
  }
  if (w != null) {
    const pv = pUse * w / (0.621945 + w);              // vapour partial pressure, Pa
    const rh = 100 * pv / psat(th);
    if (w < 0 || rh < RH_ACC[0] || rh > RH_ACC[1]) {
      mark(ignored, 'w');
      if (pOk) mark(ignored, 'p');
      say(t('ho.wrh').replace('%v', fmt(w * 1000, 3) + ' g/kg').replace('%h', fmt(rh, 1) + ' %')
        .replace('%t', fmt(th, 1) + ' °C').replace('%r', rangeRh()));
    } else {
      ST.rhi = rh;
      mark(accepted, 'w');
      if (pOk) mark(accepted, 'p');
    }
  } else if (pOk) {
    /* p alone has nothing to convert; it used to vanish from both lists. */
    mark(ignored, 'p');
    say(t('ho.nop').replace('%v', fmt(pUse / 1000, 2) + ' kPa'));
  }
  syncInputs();
  render();
  return { accepted, ignored };
}

/* --- python export: the complete steady-state assembly model of this page --- */
const PY_SRC = `import json, cmath

DELTA0 = 2.0e-10          # vapour permeability of still air, kg/(m*s*Pa)
FLOW = {"wall": "h", "roof": "u", "floor": "d"}
AIR_D = [0, 5, 7, 10, 15, 25, 50, 100, 300]
AIR_R = {"u": [0, .11, .13, .15, .16, .16, .16, .16, .16],
         "h": [0, .11, .13, .15, .17, .18, .18, .18, .18],
         "d": [0, .11, .13, .15, .17, .19, .21, .22, .23]}


def psat(th):
    """EN ISO 13788:2012 E.1 / E.2 - saturation vapour pressure, Pa"""
    if th >= 0:
        return 610.5 * math.exp(17.269 * th / (237.3 + th))
    return 610.5 * math.exp(21.875 * th / (265.5 + th))


def th_from_psat(p):
    """EN ISO 13788:2012 E.3 (and its below-zero counterpart), degC"""
    if p <= 0:
        return -80.0
    k = math.log(p / 610.5)
    return 237.3 * k / (17.269 - k) if k >= 0 else 265.5 * k / (21.875 - k)


def dew_point(th, rh):
    return th_from_psat(max(1e-6, rh / 100.0 * psat(th)))


def air_R(d, flow):
    """EN ISO 6946:2017 Table D.1, linearly interpolated on thickness"""
    ys = AIR_R.get(flow, AIR_R["h"])
    d = max(0.0, d)
    if d >= AIR_D[-1]:
        return ys[-1]
    for i in range(1, len(AIR_D)):
        if d <= AIR_D[i]:
            f = (d - AIR_D[i - 1]) / (AIR_D[i] - AIR_D[i - 1])
            return ys[i - 1] + f * (ys[i] - ys[i - 1])
    return ys[-1]


def layer_R(L, flow):
    if L.get("cavity"):
        if L.get("vent") == "strong":
            return 0.0
        if L.get("R") is not None:
            return L["R"]                      # low-emissivity cavity, own value
        return air_R(L["d"], flow)
    lam = L.get("lam")
    return max(0.0, L["d"]) / 1000.0 / lam if lam else 0.0


def layer_sd(L):
    if L.get("sd") is not None:
        return L["sd"]
    return max(1e-6, L.get("mu", 1)) * max(0.0, L["d"]) / 1000.0


def _mat(d, lam, rho, c, T=86400.0):
    """EN ISO 13786:2017 A.2 - heat transfer matrix of a homogeneous layer"""
    delta = math.sqrt(lam * T / (math.pi * rho * c))
    x = d / delta
    ch, sh, co, si = math.cosh(x), math.sinh(x), math.cos(x), math.sin(x)
    Z11 = complex(ch * co, sh * si)
    Z12 = -(delta / (2 * lam)) * complex(sh * co + ch * si, ch * si - sh * co)
    Z21 = -(lam / delta) * complex(sh * co - ch * si, sh * co + ch * si)
    return [[Z11, Z12], [Z21, Z11]]


def _res(R):
    return [[1 + 0j, complex(-R, 0)], [0j, 1 + 0j]]


def _mul(A, B):
    return [[A[0][0] * B[0][0] + A[0][1] * B[1][0], A[0][0] * B[0][1] + A[0][1] * B[1][1]],
            [A[1][0] * B[0][0] + A[1][1] * B[1][0], A[1][0] * B[0][1] + A[1][1] * B[1][1]]]


def dynamic(mats, Rsi, Rse, U, T=86400.0):
    Z = _res(Rsi)
    for M in mats:
        Z = _mul(M, Z)
    Z = _mul(_res(Rse), Z)
    Z11, Z12, Z22 = Z[0][0], Z[0][1], Z[1][1]
    Y12 = 1.0 / abs(Z12)
    shift = -(T / (2 * math.pi)) * cmath.phase(-1.0 / Z12) / 3600.0
    return {"Y12": Y12, "decrement": Y12 / U if U > 0 else 0.0,
            "shift": (shift % 24 + 24) % 24,
            "kappaIn": (T / (2 * math.pi)) * abs((Z11 - 1) / Z12) / 1000.0,
            "kappaOut": (T / (2 * math.pi)) * abs((Z22 - 1) / Z12) / 1000.0}


def glaser(nodes_sd, nodes_th, pi, pe):
    """Greatest convex minorant of p_sat(s_d) between the end pressures."""
    ps = [psat(t) for t in nodes_th]
    P = [{"sd": nodes_sd[0], "p": min(pi, ps[0]), "node": 0}]
    for i in range(1, len(nodes_sd) - 1):
        P.append({"sd": nodes_sd[i], "p": ps[i], "node": i})
    P.append({"sd": nodes_sd[-1], "p": min(pe, ps[-1]), "node": len(nodes_sd) - 1})
    hull = []
    def cross(o, a, b):
        return ((a["sd"] - o["sd"]) * (b["p"] - o["p"])
                - (a["p"] - o["p"]) * (b["sd"] - o["sd"]))
    for q in P:
        while len(hull) >= 2 and cross(hull[-2], hull[-1], q) <= 0:
            hull.pop()
        hull.append(q)
    itf = []
    for i in range(1, len(hull) - 1):
        a, b, c = hull[i - 1], hull[i], hull[i + 1]
        gin = DELTA0 * (a["p"] - b["p"]) / max(1e-9, b["sd"] - a["sd"])
        gout = DELTA0 * (b["p"] - c["p"]) / max(1e-9, c["sd"] - b["sd"])
        itf.append({"sd": b["sd"], "p": b["p"], "node": b["node"], "g": gin - gout})
    return {"interfaces": itf, "condensing": len(itf) > 0,
            "gTotal": sum(max(0.0, x["g"]) for x in itf)}


def assemble(layers, Rsi, Rse, flow, ti, te, rhi, rhe, bridges):
    # 6.9.3 slightly ventilated air layer -> mean of the two bounds (Av = 1000 mm2/m)
    si = next((i for i, L in enumerate(layers)
               if L.get("vent") == "slight" and L.get("cavity")), -1)
    st = next((i for i, L in enumerate(layers)
               if L.get("vent") == "strong" and L.get("cavity")), -1)
    if si >= 0 and (st < 0 or st > si):
        def swap(v):
            out = [dict(L) for L in layers]
            out[si]["vent"] = v
            return out
        nve = assemble(swap("none"), Rsi, Rse, flow, ti, te, rhi, rhe, bridges)
        ve = assemble(swap("strong"), Rsi, Rse, flow, ti, te, rhi, rhe, bridges)
        R_T = 0.5 * (nve["R_T"] + ve["R_T"])
        U = 1.0 / R_T
        Uc = max(1e-6, U + nve["dU"])
        out = dict(nve)
        out.update(R_T=R_T, U=U, Uc=Uc, fRsi=1 - Rsi * Uc,
                   thSiDesign=te + (1 - Rsi * Uc) * (ti - te))
        return out

    # 6.9.4 well ventilated air layer -> drop it and everything outside it
    if st >= 0:
        layers = layers[:st]
        Rse = Rsi

    R = [layer_R(L, flow) for L in layers]
    sd = [layer_sd(L) for L in layers]
    framed = [i for i, L in enumerate(layers) if L.get("frac")]
    R_T_1d = Rsi + sum(R) + Rse
    Reff = list(R)
    Rup = Rlo = R_T_1d
    if framed:
        nn = min(len(framed), 6)
        tot = 0.0
        for mask in range(1 << nn):
            a, Rp = 1.0, Rsi + Rse + sum(R)
            for j in range(nn):
                i = framed[j]
                f = layers[i]["frac"] / 100.0
                fl = layers[i]["frame"]["lam"]
                Rb = layers[i]["d"] / 1000.0 / fl if fl else R[i]
                if mask >> j & 1:
                    a *= f
                    Rp += Rb - R[i]
                else:
                    a *= 1 - f
            tot += a / Rp
        Rup = 1.0 / tot
        for i in framed:
            f = layers[i]["frac"] / 100.0
            fl = layers[i]["frame"]["lam"]
            Rb = layers[i]["d"] / 1000.0 / fl if fl else R[i]
            Reff[i] = 1.0 / ((1 - f) / max(R[i], 1e-9) + f / max(Rb, 1e-9))
        Rlo = Rsi + sum(Reff) + Rse
    R_T = 0.5 * (Rup + Rlo) if framed else R_T_1d
    U = 1.0 / R_T

    dU = 0.0
    for b in bridges:
        dU += (b.get("value") or 0.0) * (b.get("qty") or 0.0)
    Uc = max(1e-6, U + dU)

    R_prof = Rsi + sum(Reff) + Rse
    dth = ti - te
    nodes_th = [ti - dth * Rsi / R_prof]
    nodes_sd = [0.0]
    acc, s = Rsi, 0.0
    for i in range(len(layers)):
        acc += Reff[i]
        s += sd[i]
        nodes_th.append(ti - dth * acc / R_prof)
        nodes_sd.append(s)
    thSe = te + dth * Rse / R_prof
    fRsi = 1 - Rsi * Uc

    pi = rhi / 100.0 * psat(ti)
    pe = rhe / 100.0 * psat(te)
    gl = glaser(nodes_sd, nodes_th, pi, pe)

    tdew = dew_point(ti, rhi)
    dew = {"where": "outside", "mm": sum(L["d"] for L in layers)}
    if tdew >= nodes_th[0]:
        dew = {"where": "surface", "mm": 0.0}
    else:
        for i in range(len(layers)):
            a, b = nodes_th[i], nodes_th[i + 1]
            if a >= tdew >= b:
                f = (a - tdew) / (a - b) if (a - b) > 1e-9 else 0.0
                dew = {"where": "inside",
                       "mm": sum(layers[k]["d"] for k in range(i)) + f * layers[i]["d"]}
                break

    mats = []
    for i, L in enumerate(layers):
        if L.get("cavity") or not L.get("lam"):
            mats.append(_res(Reff[i]))
        elif i in framed:
            f = L["frac"] / 100.0
            fr = L["frame"]
            mats.append(_mat(L["d"] / 1000.0, L["d"] / 1000.0 / max(1e-9, Reff[i]), 1.0,
                             (1 - f) * L["rho"] * L["c"] + f * fr["rho"] * fr["c"]))
        else:
            mats.append(_mat(L["d"] / 1000.0, L["lam"], L["rho"] or 1.2, L["c"] or 1000))
    dyn = dynamic(mats, Rsi, Rse, 1.0 / R_prof)

    return {"R_T": R_T, "U": U, "Uc": Uc, "dU": dU, "fRsi": fRsi,
            "Rupper": Rup, "Rlower": Rlo,
            "thSi": nodes_th[0], "thSe": thSe,
            "thSiDesign": te + fRsi * dth, "tdew": tdew, "dew": dew,
            "nodes_th": nodes_th, "nodes_sd": nodes_sd, "glaser": gl, "dyn": dyn,
            "mass": sum((L.get("rho") or 0) * max(0.0, L["d"]) / 1000.0
                        for L in layers if not L.get("cavity")),
            "totalD": sum(max(0.0, L["d"]) for L in layers)}


def compute():
    # the input constants above are emitted in upper case by the exporter
    layers = json.loads(LAYERS_JSON)
    bridges = json.loads(BRIDGES_JSON)
    r = assemble(layers, R_SI, R_SE, FLOW.get(ELEMENT_TYPE, "h"),
                 THETA_I, THETA_E, RH_I, RH_E, bridges)
    return {
        "R_T": r["R_T"], "U": r["U"], "U_incl_bridges": r["Uc"], "f_Rsi": r["fRsi"],
        "theta_si": r["thSi"], "theta_se": r["thSe"],
        "theta_si_design": r["thSiDesign"], "theta_dew": r["tdew"],
        "dew_depth": r["dew"]["mm"] if r["dew"]["where"] == "inside" else None,
        "condensation_rate": r["glaser"]["gTotal"] * 86400 * 1000,
        "total_thickness": r["totalD"], "mass": r["mass"],
        "kappa_internal": r["dyn"]["kappaIn"],
        "decrement_factor": r["dyn"]["decrement"],
        "time_shift": r["dyn"]["shift"],
        "heat_flux": r["Uc"] * (THETA_I - THETA_E),
    }
`;
function dgcPython() {
  if (!LAST) return null;
  return {
    code: PY_SRC, requires: [],
    scope: 'the complete assembly calculation of the Assembly tab — EN ISO 6946 layer and '
      + 'surface resistances (including the Table D.1 air layers, the 6.7 combined method for '
      + 'framed layers and the 6.9.3/6.9.4 ventilated-cavity rules), the temperature profile, '
      + 'the EN ISO 13788 Glaser construction and the EN ISO 13786 24 h dynamic response for '
      + 'the layer stack shown at export time. It does NOT reproduce the climate download, the '
      + 'annual moisture balance, the glazing (EN 673) or the door tab.',
    selftest: { tolerance: 1e-9,
      note: 'the script re-evaluates the same standard equations from the same inputs, so it '
        + 'must agree with the page to 1e-9 relative' }
  };
}
function dgcInit() {
  if (!window.Diagram) return;
  window.Diagram.init({
    id: 'wallthermalcalculator', file: 'wallthermalcalculator.html',
    state: { serialize: dgcSerialize, deserialize: dgcDeserialize },
    record: dgcRecord,
    python: dgcPython,
    report: { sections: dgcSections },
    handoff: { provides: [], accepts: ['T', 'p', 'w'], apply: dgcHandoffApply }
  });
}

/* ---------- boot ---------- */
async function boot() {
  LANG = detectLang();
  ST.absorptance = absorptanceFromColor(ST.color);
  ST.door.layers = [mkLayer('plywood', 6), mkLayer('pur_spray', 40), mkLayer('plywood', 6)];
  ST.layers = PRESETS[0].layers.map(([id, d]) => mkLayer(id, d));
  if (PRESETS[0].frame) {
    const l = ST.layers[PRESETS[0].frame.index];
    if (l) { l.frameFrac = PRESETS[0].frame.frac; l.frameMat = PRESETS[0].frame.mat; }
  }
  ST.type = PRESETS[0].type;
  document.documentElement.lang = LANG;
  document.title = t('app.title');

  /* The shell comes up from the manifest alone, before any fetch. If the shared
     interface layer never arrived, the tool builds its own — it still has every
     control, the drawing and the full calculation. */
  if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1') {
    try { buildApp(); }
    catch (e) { console.error('shell', e); ui = null; fbBuild(); }
  } else fbBuild();
  render();

  let rz = null;
  window.addEventListener('resize', () => {          // keep the globe sharp after a rotation
    clearTimeout(rz);
    rz = setTimeout(() => { if (Globe.ctx) Globe.resize(); }, 200);
  });

  /* Diagram.init is called unconditionally, outside any then/catch. */
  dgcInit();

  // best-effort automatic location + climate
  try {
    const v = await locateByIP();
    if (v) { CLIM.lat = v.lat; CLIM.lon = v.lon; CLIM.place = v.place; syncInputs(); }
  } catch (e) {}
  try { await loadClimate(); } catch (e) { console.error('climate', e); }
}
