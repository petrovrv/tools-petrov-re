<meta charset="utf-8">
<script type="application/json" id="diagram-tool-manifest">{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision": "2026-10-15.bench-evidence-1-number-locale","id":"wallthermalcalculator","file":"wallthermalcalculator.html","listed":true,"category":"envelope","order":24,"title":{"en":"Wall & Envelope Thermal Calculator","uk":"Тепловий розрахунок стін і огороджень","de":"Wand- und Bauteilrechner (Wärme & Feuchte)","nl":"Wand- en schilconstructiecalculator","fr":"Calcul thermique des parois","es":"Cálculo térmico de muros y cerramientos","pl":"Kalkulator cieplny przegród"},"summary":{"en":"Build a wall, roof or floor layer by layer from a 72-material library and see where it fails.","uk":"Складіть стіну, покрівлю чи підлогу шар за шаром із бібліотеки на 72 матеріали і побачте, де конструкція не тримає.","de":"Bauen Sie Wand, Dach oder Boden Schicht für Schicht aus einer Bibliothek mit 72 Materialien auf und sehen Sie, wo das Bauteil versagt.","nl":"Bouw een wand, dak of vloer laag voor laag op uit een bibliotheek van 72 materialen en zie waar de constructie tekortschiet.","fr":"Composez un mur, une toiture ou un plancher couche par couche à partir d’une bibliothèque de 72 matériaux et voyez où la paroi cède.","es":"Componga un muro, una cubierta o un forjado capa a capa a partir de una biblioteca de 72 materiales y vea dónde falla.","pl":"Zbuduj ścianę, dach lub podłogę warstwa po warstwie, korzystając z biblioteki 72 materiałów i zobacz, gdzie się nie sprawdzi."},"description":{"en":"Build a wall, roof or floor layer by layer from a 72-material library and see where it fails. Steady-state U-value with framing and thermal bridges, inner surface temperature and the fRsi mould check, the dew point located inside the stack, Glaser interstitial condensation with an annual moisture balance, and the 24-hour dynamic response — internal heat capacity, decrement factor and time shift. Separate tabs for glazing to EN 673 and for doors, plus a climate tab that pulls a year of reanalysis data for design temperatures, degree days and per-orientation solar irradiance.","uk":"Складіть стіну, покрівлю чи підлогу шар за шаром із бібліотеки на 72 матеріали і побачте, де конструкція не тримає. Стаціонарний U-коефіцієнт із каркасом і тепловими містками, температура внутрішньої поверхні та перевірка fRsi на пліснявіння, положення точки роси в товщі, конденсація за Глазером із річним балансом вологи та добова динамічна відповідь — теплоємність, коефіцієнт затухання і зсув фаз. Окремі вкладки для склопакетів за EN 673 і для дверей, а також кліматична вкладка, що підтягує рік даних реаналізу для розрахункових температур, градусо-діб та сонячної радіації за орієнтаціями.","de":"Bauen Sie Wand, Dach oder Boden Schicht für Schicht aus einer Bibliothek mit 72 Materialien auf und sehen Sie, wo das Bauteil versagt. Stationärer U-Wert mit Gefach und Wärmebrücken, innere Oberflächentemperatur und fRsi-Schimmelnachweis, Lage des Taupunkts im Aufbau, Tauwasser nach Glaser mit Jahresfeuchtebilanz sowie das dynamische Verhalten über 24 Stunden — Wärmekapazität, Amplitudendämpfung und Phasenverschiebung. Eigene Register für Verglasung nach EN 673 und für Türen, dazu ein Klimaregister, das ein Jahr Reanalysedaten für Auslegungstemperaturen, Gradtage und orientierungsabhängige Solarstrahlung lädt.","nl":"Bouw een wand, dak of vloer laag voor laag op uit een bibliotheek van 72 materialen en zie waar de constructie tekortschiet. Stationaire U-waarde met regelwerk en koudebruggen, binnenoppervlaktetemperatuur en de fRsi-schimmeltoets, de ligging van het dauwpunt in het pakket, inwendige condensatie volgens Glaser met een jaarvochtbalans, en het dynamisch gedrag over 24 uur — warmtecapaciteit, dempingsfactor en faseverschuiving. Aparte tabbladen voor beglazing volgens EN 673 en voor deuren, plus een klimaattabblad dat een jaar reanalysedata ophaalt voor ontwerptemperaturen, graaddagen en zonnestraling per oriëntatie.","fr":"Composez un mur, une toiture ou un plancher couche par couche à partir d’une bibliothèque de 72 matériaux et voyez où la paroi cède. Coefficient U en régime permanent avec ossature et ponts thermiques, température de surface intérieure et vérification fRsi du risque de moisissure, position du point de rosée dans la paroi, condensation interne selon Glaser avec bilan annuel d’humidité, et réponse dynamique sur 24 heures — capacité thermique, facteur d’amortissement et déphasage. Onglets dédiés au vitrage selon EN 673 et aux portes, plus un onglet climat qui charge une année de réanalyse pour les températures de base, les degrés-jours et l’irradiation solaire par orientation.","es":"Componga un muro, una cubierta o un forjado capa a capa a partir de una biblioteca de 72 materiales y vea dónde falla. Transmitancia U en régimen estacionario con entramado y puentes térmicos, temperatura superficial interior y comprobación fRsi de riesgo de moho, posición del punto de rocío dentro del cerramiento, condensación intersticial por el método de Glaser con balance anual de humedad, y respuesta dinámica a 24 horas — capacidad térmica, factor de amortiguación y desfase. Pestañas propias para acristalamiento según EN 673 y para puertas, además de una pestaña de clima que descarga un año de reanálisis para temperaturas de proyecto, grados-día e irradiación solar por orientación.","pl":"Zbuduj ścianę, dach lub podłogę warstwa po warstwie z biblioteki 72 materiałów i sprawdź, gdzie zawodzi. Ustalona wartość współczynnika U z uwzględnieniem szkieletu i mostków termicznych, temperatury powierzchni wewnętrznej i kontroli pleśni fRSI, punktu rosy wewnątrz komina, kondensacji międzywęzłowej Glasera z rocznym bilansem wilgoci oraz 24-godzinnej odpowiedzi dynamicznej – wewnętrznej pojemności cieplnej, współczynnika dekrementacji i przesunięcia czasowego. Osobne zakładki dla przeszkleń zgodnie z normą EN 673 i dla drzwi, a także zakładka klimatyczna, która pobiera dane z rocznej analizy dla temperatur projektowych, stopniodni i natężenia promieniowania słonecznego dla każdej orientacji."},"status":"benchmarked","independent_validation":false,"limitations":{"en":"One-dimensional steady-state assembly model: thermal bridges are entered as ψ and χ values added to U rather than solved as a two-dimensional field, and the combined method for framed layers is flagged as unreliable once the bound ratio exceeds 1.5. Moisture uses the Glaser diffusion scheme — no liquid or capillary transport, no hygroscopic storage, no air leakage, humidity-independent μ; the annual balance steps through monthly means and tracks condensate separately at each interface. Unventilated air layers are read from the ISO 6946 Table D.1 at their actual thickness; a slightly ventilated cavity is interpolated at Av = 1000 mm²/m and its temperature and vapour profiles are those of the unventilated build-up. Surface resistances are tabulated values unless overridden, the dynamic response is a single 24-hour harmonic, climate is gridded reanalysis with heuristic design temperatures rather than national values, and annual energy is a degree-day estimate for one element without gains, ventilation or system efficiency. The boundary conditions, typed or handed over from another tool, are accepted inside the ranges of the model above: air temperature from -30 °C to 100 °C, relative humidity from 1 % to 100 %, and, for the humidity ratio conversion alone, a barometric pressure from 22.6 kPa to 127.8 kPa; outside them the quantity is named with its value and the range and nothing of it is applied.","uk":"Одновимірна стаціонарна модель конструкції: теплові містки задаються значеннями ψ і χ, що додаються до U, а не розв’язуються як двовимірне поле, а комбінований метод для каркасних шарів позначається як ненадійний, щойно відношення меж перевищує 1,5. Волога рахується за дифузійною схемою Глазера — без рідинного та капілярного перенесення, без гігроскопічного накопичення, без інфільтрації, з μ незалежним від вологості; річний баланс іде помісячно й веде облік конденсату окремо на кожній межі. Невентильовані прошарки беруться з таблиці D.1 ISO 6946 за фактичною товщиною; слабо вентильований прошарок інтерполюється за Av = 1000 мм²/м, а профілі температури й тиску пари показано для невентильованої конструкції. Опори тепловіддачі — табличні значення, якщо їх не змінено, динамічна відповідь — одна добова гармоніка, клімат — сітковий реаналіз з евристичними розрахунковими температурами замість національних, а річна енергія — оцінка за градусо-добами для одного елемента без надходжень, вентиляції та ККД системи. Крайові умови — введені вручну або отримані від іншого інструмента — приймаються в межах наведеної моделі: температура повітря від -30 °C до 100 °C, відносна вологість від 1 % до 100 %, а для перерахунку вологовмісту — барометричний тиск від 22,6 кПа до 127,8 кПа; поза цими межами величину називають разом із її значенням і діапазоном, і нічого з неї не застосовується.","de":"Eindimensionales, stationäres Bauteilmodell: Wärmebrücken werden als ψ- und χ-Werte auf U aufgeschlagen und nicht als zweidimensionales Feld gelöst; das kombinierte Verfahren für Gefachschichten wird ab einem Grenzwertverhältnis über 1,5 selbst als unzuverlässig gekennzeichnet. Feuchte folgt dem Glaser-Diffusionsschema — ohne Flüssig- und Kapillartransport, ohne hygroskopische Speicherung, ohne Luftströmung, mit feuchteunabhängigem μ; die Jahresbilanz rechnet mit Monatsmitteln und führt das Tauwasser je Grenzfläche getrennt. Unbelüftete Luftschichten werden mit ihrer tatsächlichen Dicke aus Tabelle D.1 der ISO 6946 gelesen; eine schwach belüftete Luftschicht wird bei Av = 1000 mm²/m interpoliert, ihre Temperatur- und Dampfdruckprofile gelten für den unbelüfteten Aufbau. Wärmeübergangswiderstände sind Tabellenwerte, sofern nicht überschrieben, das dynamische Verhalten ist eine einzelne 24-Stunden-Harmonische, das Klima stammt aus gerasterten Reanalysedaten mit heuristischen statt nationalen Auslegungstemperaturen, und der Jahresbedarf ist eine Gradtagschätzung für ein einzelnes Bauteil ohne Gewinne, Lüftung und Anlagentechnik. Die Randbedingungen — eingegeben oder von einem anderen Werkzeug übergeben — werden innerhalb der Bereiche des obigen Modells übernommen: Lufttemperatur von -30 °C bis 100 °C, relative Feuchte von 1 % bis 100 % und, allein für die Umrechnung des Feuchtegehalts, ein Barometerdruck von 22,6 kPa bis 127,8 kPa; außerhalb davon wird die Größe mit ihrem Wert und dem Bereich benannt und nichts davon übernommen.","nl":"Eendimensionaal stationair constructiemodel: koudebruggen worden als ψ- en χ-waarden bij U opgeteld in plaats van als tweedimensionaal veld opgelost, en de gecombineerde methode voor regelwerklagen wordt zelf als onbetrouwbaar gemarkeerd zodra de verhouding tussen de grenswaarden groter is dan 1,5. Vocht volgt het diffusieschema van Glaser — geen vloeistof- of capillair transport, geen hygroscopische buffering, geen luchtlekkage, μ onafhankelijk van de vochtigheid; de jaarbalans rekent met maandgemiddelden en houdt het condensaat per grensvlak apart bij. Niet-geventileerde luchtlagen komen bij hun werkelijke dikte uit tabel D.1 van ISO 6946; een licht geventileerde spouw wordt geïnterpoleerd bij Av = 1000 mm²/m en de getoonde temperatuur- en dampprofielen zijn die van de niet-geventileerde opbouw. Overgangsweerstanden zijn tabelwaarden tenzij overschreven, het dynamisch gedrag is één harmonische over 24 uur, het klimaat komt uit reanalyse op een grid met heuristische in plaats van nationale ontwerptemperaturen, en de jaarenergie is een graaddagenschatting voor één bouwdeel zonder warmtewinsten, ventilatie of installatierendement. De randvoorwaarden — ingetypt of doorgegeven door een andere tool — worden toegepast binnen de bereiken van het model hierboven: luchttemperatuur van -30 °C tot 100 °C, relatieve vochtigheid van 1 % tot 100 % en, alleen voor de omrekening van het vochtgehalte, een barometerdruk van 22,6 kPa tot 127,8 kPa; daarbuiten wordt de grootheid met haar waarde en het bereik benoemd en er wordt niets van toegepast.","fr":"Modèle de paroi unidimensionnel en régime permanent : les ponts thermiques sont saisis en valeurs ψ et χ ajoutées à U et non résolus comme un champ bidimensionnel, et la méthode combinée pour les couches à ossature est signalée comme non fiable dès que le rapport des bornes dépasse 1,5. L’humidité suit le schéma de diffusion de Glaser — sans transport liquide ni capillaire, sans stockage hygroscopique, sans infiltration d’air, avec un μ indépendant de l’humidité ; le bilan annuel procède par moyennes mensuelles et suit le condensat interface par interface. Les lames d’air non ventilées sont lues dans le tableau D.1 de l’ISO 6946 à leur épaisseur réelle ; une lame faiblement ventilée est interpolée à Av = 1000 mm²/m et ses profils de température et de pression de vapeur sont ceux de la paroi non ventilée. Les résistances superficielles sont des valeurs tabulées sauf saisie contraire, la réponse dynamique est une seule harmonique de 24 heures, le climat provient d’une réanalyse maillée avec des températures de base heuristiques plutôt que nationales, et l’énergie annuelle est une estimation en degrés-jours pour une seule paroi, sans apports, ventilation ni rendement d’installation. Les conditions aux limites — saisies ou transmises par un autre outil — sont appliquées dans les plages du modèle ci-dessus : température de l’air de -30 °C à 100 °C, humidité relative de 1 % à 100 % et, pour la seule conversion de la teneur en eau, une pression barométrique de 22,6 kPa à 127,8 kPa ; au-delà, la grandeur est nommée avec sa valeur et la plage, et rien n’en est appliqué.","es":"Modelo de cerramiento unidimensional en régimen estacionario: los puentes térmicos se introducen como valores ψ y χ sumados a U en lugar de resolverse como campo bidimensional, y el método combinado para capas con entramado se señala como poco fiable en cuanto la relación entre cotas supera 1,5. La humedad sigue el esquema de difusión de Glaser — sin transporte líquido ni capilar, sin almacenamiento higroscópico, sin infiltración de aire y con μ independiente de la humedad; el balance anual avanza con medias mensuales y contabiliza el condensado por separado en cada interfaz. Las cámaras de aire sin ventilar se leen de la tabla D.1 de ISO 6946 con su espesor real; una cámara poco ventilada se interpola con Av = 1000 mm²/m y sus perfiles de temperatura y de presión de vapor son los del cerramiento sin ventilar. Las resistencias superficiales son valores tabulados salvo que se sustituyan, la respuesta dinámica es un único armónico de 24 horas, el clima procede de reanálisis en malla con temperaturas de proyecto heurísticas en vez de nacionales, y la energía anual es una estimación por grados-día de un solo elemento, sin ganancias, ventilación ni rendimiento de la instalación. Las condiciones de contorno — introducidas o transmitidas por otra herramienta — se aplican dentro de los rangos del modelo anterior: temperatura del aire de -30 °C a 100 °C, humedad relativa del 1 % al 100 % y, solo para la conversión del contenido de humedad, una presión barométrica de 22,6 kPa a 127,8 kPa; fuera de ellos la magnitud se nombra con su valor y el rango, y no se aplica nada de ella.","pl":"Jednowymiarowy model montażu w stanie ustalonym: mostki termiczne są wprowadzane jako wartości ψ i χ dodane do U, a nie rozwiązywane jako pole dwuwymiarowe, a metoda łączona dla warstw ramowych jest oznaczana jako zawodna, gdy współczynnik wiązania przekroczy 1,5. Wilgotność wykorzystuje schemat dyfuzji Glasera — brak transportu cieczy lub kapilar, brak magazynowania higroskopijnego, brak wycieków powietrza, μ niezależny od wilgotności; roczny bilans przechodzi przez średnie miesięczne i śledzi kondensat oddzielnie na każdym interfejsie. Niewentylowane warstwy powietrza są odczytywane z tabeli D.1 normy ISO 6946 przy ich rzeczywistej grubości; lekko wentylowana wnęka jest interpolowana przy Av = 1000 mm²/m, a jej profile temperatury i pary są takie same jak dla niewentylowanej konstrukcji. Rezystancje powierzchniowe są wartościami tabelarycznymi, chyba że zostaną zastąpione; odpowiedź dynamiczna jest pojedynczą harmoniczną 24-godzinną; klimat jest analizą siatkową z heurystycznymi temperaturami projektowymi, a nie wartościami krajowymi; a roczna energia jest szacunkiem stopniodni dla jednego elementu bez zysków, wentylacji lub wydajności systemu. Warunki brzegowe — wpisane lub przekazane z innego narzędzia — są stosowane w zakresach powyższego modelu: temperatura powietrza od -30 °C do 100 °C, wilgotność względna od 1 % do 100 % oraz, wyłącznie dla przeliczenia zawartości wilgoci, ciśnienie barometryczne od 22,6 kPa do 127,8 kPa; poza nimi wielkość jest nazywana wraz z jej wartością i zakresem, a nic z niej nie jest stosowane."},"intended_use":["education","technical exploration","preliminary assessment"],"catalog_languages":["en","uk","de","nl","fr","es","pl"],"tool_languages":["en","uk","de","nl","fr","es",
    "pl"
  ],"dependencies":[],"network_access":{"mode":"external","note":"On load the page asks ipwho.is (fallback ipapi.co) for an approximate location from the IP address and downloads hourly and daily reanalysis from archive-api.open-meteo.com; place search uses geocoding-api.open-meteo.com. Nothing else leaves the browser, and with no network the climate tab falls back to a clearly labelled synthetic estimate. The layer stack and all calculation inputs stay in the browser."},"validation":{"basis":"Benchmarked against an independent python implementation of EN ISO 6946:2017, EN ISO 13788:2012 and EN ISO 13786:2017 written from the standards' text, plus two published worked U-value examples; 13 of 13 cases pass at display precision.","independent_validation":false,"benchmarks":[{"id":"wallthermalcalculator-iso6946-13788-13786","reference":"Independent python implementation of EN ISO 6946:2017 (R, U, Table 7 surface resistances, Table D.1 air layers, 6.7 combined method, 6.9.4 ventilated cavities), EN ISO 13788:2012 (Annex E saturation vapour pressure, clause 6 Glaser construction and annual balance, clause 4.2 humidity classes) and EN ISO 13786:2017 Annex A (dynamic response), plus two published worked U-value examples.","citations":["EN ISO 6946:2017, Table 7 (surface resistances), Table D.1 (unventilated air layers), 6.6, 6.7, 6.9.4","EN ISO 13788:2012, clause 4.2, clause 6, Annex E (E.1, E.2, E.3)","EN ISO 13786:2017, Annex A (heat transfer matrix, periodic thermal transmittance, areal heat capacity, time shift)","u-value.com, \"How to calculate U-values: the ISO 6946 method with worked examples\", Examples 1 and 2 (accessed 2026-08-11)","CoolProp 8.0.0 IAPWS-95 saturation pressure, used only as a cross-check of the ISO 13788 Annex E correlation (see crosscheck)"],"cases": 13,"passed": 13,"tolerance":"display-limited: every quantity is compared to half of the last digit the tool prints (U, R, fRsi, layer R: 5e-4; interface temperatures: 0.05 K; psat: 1 Pa; condensation rate: 0.05 g/(m2 d); annual accumulation: 0.5 g/m2)","run_at": "2026-10-15T22:21:43Z","artifact":"benchmarks/wallthermalcalculator.json"}]},"report":{"pdf":true,"source_attribution":true},"python_export":{"supported":true,"requires":[],"reason":"Reproduces the steady-state assembly calculation (ISO 6946 resistances and U, the temperature profile, the ISO 13788 Glaser construction and the ISO 13786 24 h dynamic response). The climate download, the annual moisture balance, the glazing and the door tab are outside the exported script and the header says so."},"handoff":{"provides":[],"accepts":["T","p","w"]},"state_codec":{"permalink":true,"record":"tools.petrov.re/calculation-record/v1"},"ui":{"framework":"tools.petrov.re/ui/v1","level":3}}</script>

<style>
/* Tool-local styles. Every colour, size, radius and space is a §2 token; the
   only literals left are inside the SVG drawings, which are pictures, not chrome. */

/* ---- repairs for known framework defects (removed when diagram-ui.js fixes them) ---- */
/* The calculator grid declares no `nav` area, so a tab strip is auto-placed into
   an implicit column and takes the width away from the stage. Same four
   breakpoints, higher specificity because the framework sheet loads later. */
html body .dgu-app[data-layout="calculator"] .dgu-main{
  grid-template-areas:"strip" "nav" "inputs" "stage" "results" "dock" "footer"}
@media (min-width:768px){html body .dgu-app[data-layout="calculator"] .dgu-main{
  grid-template-areas:"nav nav" "inputs stage" "inputs results" "dock dock" "footer footer"}}
@media (min-width:1120px){html body .dgu-app[data-layout="calculator"] .dgu-main{
  grid-template-areas:"nav nav nav" "inputs stage results" "dock dock dock" "footer footer footer"}}
.dgu-app .dgu-panel[hidden],.dgu-app .dgu-field[hidden],.dgu-app .dgu-stage[hidden]{display:none!important}
.dgu-pop,.dgu-tour,.dgu-dialog,.dgu-dialog-p{box-sizing:border-box}
.dgu-pop *,.dgu-tour *,.dgu-dialog *{box-sizing:border-box}

/* The header action group cannot shrink or wrap, so a tool with its own actions
   pushes the language and theme controls off a 390px viewport. Local repair. */
html body .dgu-app .dgu-head-r{flex:0 1 auto;flex-wrap:wrap;justify-content:flex-end;min-width:0}
html body .dgu-app .dgu-head{row-gap:var(--sp-2)}

/* Below md every tap target must be at least 44px; several framework controls
   are still 18–38px there. Local repair, same token, until diagram-ui.js fixes it. */
@media (max-width:768px){
  html body .dgu-app .dgu-tab,html body .dgu-app .dgu-sel,
  html body .dgu-app .dgu-seg button{min-height:var(--tap)}
  html body .dgu-app .dgu-q{width:var(--tap);height:var(--tap)}
  html body .dgu-app .dgu-home{min-height:var(--tap)}
  html body .dgu-app .dgu-fctl,html body .dgu-app input[type=checkbox]{min-height:var(--tap)}
  html body .dgu-app .dgu-toggle input{width:24px;height:24px}
}

/* ---- shared bits used by the tool's own lists ---- */
.wt-host{display:flex;flex-direction:column;gap:var(--sp-2);min-width:0}
.hint{font-size:var(--fs-small);color:var(--muted);line-height:1.4}
.warn{color:var(--bad)}
.good{color:var(--ok)}
.empty{padding:var(--sp-4);text-align:center;color:var(--muted);border:1px dashed var(--line);
  border-radius:var(--radius-sm);font-size:var(--fs-small)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
label.f{display:flex;flex-direction:column;gap:var(--sp-1);font:500 var(--fs-micro)/1.3 var(--font);
  color:var(--muted);min-width:0}
label.f input,label.f select{min-height:var(--ctl-h);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:0 var(--sp-2);background:var(--panel);
  font:400 var(--fs-label)/1 var(--font);color:var(--ink);width:100%}
@media (max-width:768px){label.f input,label.f select{min-height:var(--tap)}}

/* ---- layer / bridge rows ---- */
.layers{display:flex;flex-direction:column;gap:var(--sp-2)}
.layer{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel-2);
  padding:var(--sp-2)}
.layer.dragover{border-color:var(--accent);background:var(--weak)}
.layer .top{display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-1);min-width:0}
.layer .sw{width:var(--ctl-h);height:var(--ctl-h);border-radius:var(--radius-sm);
  border:1px solid var(--line);flex:0 0 auto;cursor:pointer;padding:0}
.layer .nm{flex:1 1 60%;min-width:6ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  cursor:pointer;font:500 var(--fs-label)/1 var(--font);background:none;border:0;padding:var(--sp-2) 0;
  text-align:left;color:var(--ink);min-height:var(--ctl-h)}
.layer .nm:hover{color:var(--accent);text-decoration:underline}
.layer .d{width:72px;flex:0 0 auto;margin-left:auto}
.layer .d input{width:100%;min-height:var(--ctl-h);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:0 var(--sp-1);text-align:right;
  font:400 var(--fs-label)/1 var(--font);color:var(--ink);background:var(--panel)}
.layer .ic{border:1px solid transparent;background:none;cursor:pointer;color:var(--muted);
  border-radius:var(--radius-sm);line-height:1;min-width:var(--ctl-h);min-height:var(--ctl-h);
  font-size:var(--fs-label);flex:0 0 auto}
.layer .ic:hover{background:var(--weak);color:var(--ink)}
.layer .ic.on{color:var(--accent);background:var(--weak)}
.layer .ic[disabled]{opacity:.4;cursor:not-allowed}
.layer .grab{cursor:grab;color:var(--muted);padding:0 var(--sp-1);flex:0 0 auto}
.layer .meta{font-size:var(--fs-micro);color:var(--muted);margin-top:var(--sp-1);
  display:flex;gap:var(--sp-3);flex-wrap:wrap}
.layer .meta .fr{color:var(--warn)}
.layer .meta .ad{color:var(--accent)}
.layer .extra{margin-top:var(--sp-2);padding-top:var(--sp-2);border-top:1px dashed var(--line);display:none}
.layer.open .extra{display:block}
.layer input[type=text]{flex:1 1 auto;min-width:0;min-height:var(--ctl-h);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:0 var(--sp-2);font:400 var(--fs-label)/1 var(--font);
  color:var(--ink);background:var(--panel)}
.layer select{min-height:var(--ctl-h);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:0 var(--sp-1);font:400 var(--fs-label)/1 var(--font);color:var(--ink);background:var(--panel)}
@media (max-width:768px){.layer .ic,.layer .sw,.layer .nm,.layer .d input,.layer select,
  .layer input[type=text]{min-height:var(--tap)}.layer .ic{min-width:var(--tap)}
  .layer .sw{width:var(--tap);height:var(--tap)}}
.wt-adj{display:flex;gap:var(--sp-2);align-items:center;margin-top:var(--sp-2);
  font-size:var(--fs-small);color:var(--muted)}

/* ---- drawings ---- */
svg.section{width:100%;display:block;touch-action:none;user-select:none;height:auto}
.dgu-stage-body>svg.section{height:auto}
.dgu-stage-body{padding:var(--sp-2)}
.handle{cursor:ew-resize}
.handle rect.hit{fill:transparent}
.handle line{stroke:var(--muted);stroke-width:1.2}
.handle:hover line,.handle.act line{stroke:var(--accent);stroke-width:2}
.dewh{cursor:ew-resize}
.lblbox{font-size:calc(var(--fs-small) * var(--wt-k,1));fill:var(--ink)}
line.axis{stroke:var(--line);stroke-width:1}
text.axis{stroke:none;fill:var(--muted);font-size:calc(var(--fs-small) * var(--wt-k,1));font-family:var(--font)}
.legend{display:flex;gap:var(--sp-4);flex-wrap:wrap;font-size:var(--fs-small);color:var(--muted);
  padding:0 var(--sp-3) var(--sp-2)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:var(--radius-pill);margin-right:var(--sp-1);
  vertical-align:middle}

/* the examples list is prose, not a button label: let it wrap */
.dgu-panel[data-dgu-panel="examples"] .dgu-btn{white-space:normal;text-align:left}
.dgu-panel[data-dgu-panel="examples"] .dgu-btn>span{min-width:0;display:block;width:100%}
.dgu-panel[data-dgu-panel="examples"] .dgu-hint{overflow:hidden;text-overflow:ellipsis}

/* ---- material library dialog ---- */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:var(--sp-2)}
.mitem{display:flex;gap:var(--sp-2);align-items:center;border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:var(--sp-2);cursor:pointer;background:var(--panel);
  text-align:left;min-height:var(--tap);width:100%;color:var(--ink);font:inherit}
.mitem:hover{border-color:var(--accent);background:var(--weak)}
.mitem .sw{width:30px;height:30px;border-radius:var(--radius-sm);border:1px solid var(--line);flex:0 0 auto}
.mitem .t1{font:500 var(--fs-label)/1.25 var(--font)}
.mitem .t2{font-size:var(--fs-small);color:var(--muted)}
.wt-libbar{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center}
.wt-libbar input,.wt-libbar select{min-height:var(--ctl-h);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:0 var(--sp-2);font:400 var(--fs-label)/1 var(--font);
  color:var(--ink);background:var(--panel)}
.wt-libgrid{max-height:52vh;overflow:auto;min-width:0}

/* ---- climate ---- */
.globewrap{display:flex;gap:var(--sp-4);flex-wrap:wrap;align-items:flex-start}
canvas#globe{width:320px;height:320px;max-width:100%;border-radius:var(--radius-pill);cursor:grab;
  touch-action:none;background:var(--panel-2)}
.compass{display:grid;grid-template-columns:repeat(3,var(--tap));grid-template-rows:repeat(3,var(--tap));
  gap:var(--sp-1)}
.compass button{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius-sm);
  cursor:pointer;font:650 var(--fs-label)/1 var(--font);color:var(--muted)}
.compass button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.compass .mid{display:grid;place-items:center;font-size:var(--fs-micro);color:var(--muted);
  border:0;background:none}
.bars{display:flex;gap:var(--sp-1);align-items:flex-end;height:90px}
.bars .b{flex:1 1 auto;background:var(--accent);opacity:.75;border-radius:var(--radius-sm) var(--radius-sm) 0 0;
  position:relative}
.bars .b span{position:absolute;bottom:-16px;left:0;right:0;text-align:center;
  font-size:var(--fs-micro);color:var(--muted)}
.status{font-size:var(--fs-small);padding:var(--sp-1) var(--sp-2);border-radius:var(--radius-sm);
  background:var(--panel-2);color:var(--muted);display:inline-block}
.status.err{background:var(--bad-bg);color:var(--bad)}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.wt-places{display:flex;gap:var(--sp-1);flex-wrap:wrap}

/* ---- report view and the fallback shell ---- */
.kv{display:flex;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-1) 0;
  border-bottom:1px dotted var(--line);font-size:var(--fs-label)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--sp-3);
  margin-bottom:var(--sp-2)}
.big .t{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:var(--sp-3)}
.big .t .l{font:500 var(--fs-micro)/1.3 var(--font);color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em}
.big .t .n{font:650 20px/1.2 var(--font);font-variant-numeric:tabular-nums}
.big .t .u{font-size:var(--fs-small);color:var(--muted)}
.big .t.bad .n{color:var(--bad)}
.big .t.ok .n{color:var(--ok)}
table.tb{width:100%;border-collapse:collapse;font-size:var(--fs-label)}
table.tb th{text-align:right;font:650 var(--fs-micro)/1.4 var(--font);color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;padding:var(--sp-1) var(--sp-2);
  border-bottom:1px solid var(--line);white-space:nowrap}
table.tb th:first-child,table.tb td:first-child{text-align:left}
table.tb.rep th:nth-child(2),table.tb.rep td:nth-child(2){text-align:left}
table.tb td{padding:var(--sp-1) var(--sp-2);border-bottom:1px solid var(--line);text-align:right;
  font-variant-numeric:tabular-nums}
table.tb tr:last-child td{border-bottom:0}
.wt-report{display:flex;flex-direction:column;gap:var(--sp-3);min-width:0}
.wt-report h2{font:650 var(--fs-body)/1.3 var(--font)}
.wt-report .frame{border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--sp-2)}
.wt-scroll{overflow-x:auto;min-width:0}

/* ---- fallback shell: used only when diagram-ui.js could not be loaded ---- */
.wt-fallback{font:400 var(--fs-body)/1.5 var(--font);color:var(--ink);background:var(--bg);
  padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-4);max-width:var(--bp-xl);margin:0 auto}
.wt-fallback h1{font:650 var(--fs-title)/1.2 var(--font);margin:0}
.wt-fallback .fbcard{background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-md);padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3)}
.wt-fallback .fbgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--sp-3)}
.wt-fallback .fbtabs{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.wt-fallback button{min-height:var(--tap);border:1px solid var(--line);border-radius:var(--radius-sm);
  background:var(--panel);color:var(--ink);font:500 var(--fs-label)/1 var(--font);cursor:pointer;
  padding:0 var(--sp-3)}
.wt-fallback button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* ---- print — §21: the framework owns the sheet ----
   Deleted from here because diagram-ui.js's PRINT_CSS now owns them: the nav,
   strip, action bar and chrome dock (framework furniture); the single-column
   block layout of .dgu-app/.dgu-main; the box-shadow reset; break-inside on
   .dgu-panel and .dgu-stage. The old rules also hid .dgu-head, which took the
   tool's own title off page 1 — the framework keeps the masthead and hides only
   its controls, so that is a repair, not a loss.
   What is genuinely this tool's and stays:
     .dgu-r-inputs — 60+ layer/geometry controls; the composed U-value and the
       layer table in .wt-report restate every number a reader needs.
     .noprint      — the tool's own opt-out class on nodes it built itself
       (the globe's control strip). The framework cannot know that name.
     .wt-report>*  — the report body is the tool's DOM, not a framework
       component, so no framework break-inside rule reaches its children. */
@media print{
  .dgu-r-inputs,.noprint{display:none!important}
  .wt-report>div,.wt-report>table,.wt-report>p{page-break-inside:avoid}
}
</style>
</head>

  'warn.badlambda': ['A layer has a non-positive λ and contributes no resistance.','Een laag heeft een λ ≤ 0 en levert geen weerstand.','Une couche a λ ≤ 0 et n’apporte aucune résistance.','Eine Schicht hat λ ≤ 0 und liefert keinen Widerstand.','Una capa tiene λ ≤ 0 y no aporta resistencia.','У шару λ ≤ 0, він не дає опору.','У слоя λ ≤ 0 — он не даёт сопротивления.',"Warstwa ma nie-dodatnią wartość λ i nie wnosi żadnego oporu."],
  'warn.combined':  ['R′/R″ > 1.5 — the combined method of ISO 6946 is no longer reliable here; a 2-D calculation is needed.','R′/R″ > 1,5 — de gecombineerde methode is hier onbetrouwbaar; een 2D-berekening is nodig.','R′/R″ > 1,5 — la méthode combinée n’est plus fiable ; un calcul 2D est nécessaire.','R′/R″ > 1,5 — das kombinierte Verfahren ist hier unzuverlässig; 2-D-Rechnung nötig.','R′/R″ > 1,5 — el método combinado no es fiable; se requiere cálculo 2D.','R′/R″ > 1,5 — комбінований метод ненадійний, потрібен 2D-розрахунок.','R′/R″ > 1,5 — комбинированный метод здесь ненадёжен, нужен 2D-расчёт.',"R′/R″ > 1,5 — łączona metoda ISO 6946 nie jest już w tym przypadku wiarygodna; konieczne jest przeprowadzenie obliczeń 2-D."],
  'warn.rh':        ['A relative humidity above 100 % was entered; the vapour pressure is capped at saturation, so the surface is treated as condensing.','Er is een relatieve vochtigheid boven 100 % ingevoerd; de dampdruk wordt op verzadiging begrensd en het oppervlak wordt als condenserend behandeld.','Une humidité relative supérieure à 100 % a été saisie ; la pression de vapeur est plafonnée à la saturation et la surface est traitée comme condensante.','Es wurde eine relative Feuchte über 100 % eingegeben; der Dampfdruck wird auf Sättigung begrenzt und die Oberfläche als tauend behandelt.','Se ha introducido una humedad relativa superior al 100 %; la presión de vapor se limita a la saturación y la superficie se trata como condensante.','Введено відносну вологість понад 100 %; тиск пари обмежено насиченням, поверхня вважається такою, що конденсує.','Введена относительная влажность выше 100 %; давление пара ограничено насыщением, поверхность считается конденсирующей.',"Wprowadzono wilgotność względną powyżej 100%; prężność pary wodnej została ograniczona do poziomu nasycenia, więc powierzchnię uznaje się za kondensującą."],
  'warn.slightvent':['Slightly ventilated cavity: R is interpolated between the unventilated and the well-ventilated case at Av = 1000 mm²/m (ISO 6946 §6.9.3). The temperature and vapour profiles below are those of the unventilated build-up.','Licht geventileerde spouw: R is geïnterpoleerd tussen de niet- en de sterk geventileerde situatie bij Av = 1000 mm²/m (ISO 6946 §6.9.3). De getoonde temperatuur- en dampprofielen zijn die van de niet-geventileerde opbouw.','Lame d’air faiblement ventilée : R est interpolé entre le cas non ventilé et le cas fortement ventilé pour Av = 1000 mm²/m (ISO 6946 §6.9.3). Les profils de température et de pression de vapeur sont ceux de la paroi non ventilée.','Schwach belüftete Luftschicht: R wird zwischen dem unbelüfteten und dem stark belüfteten Fall bei Av = 1000 mm²/m interpoliert (ISO 6946 §6.9.3). Temperatur- und Dampfdruckprofil gelten für den unbelüfteten Aufbau.','Cámara poco ventilada: R se interpola entre el caso sin ventilar y el muy ventilado con Av = 1000 mm²/m (ISO 6946 §6.9.3). Los perfiles de temperatura y de presión de vapor son los del cerramiento sin ventilar.','Слабо вентильований прошарок: R інтерпольовано між невентильованим і сильно вентильованим випадками за Av = 1000 мм²/м (ISO 6946 §6.9.3). Профілі температури й тиску пари показано для невентильованої конструкції.','Слабо вентилируемая прослойка: R интерполировано между невентилируемым и сильно вентилируемым случаями при Av = 1000 мм²/м (ISO 6946 §6.9.3). Профили температуры и давления пара показаны для невентилируемой конструкции.',"Komora słabo wentylowana: R jest interpolowane między przypadkiem niewentylowanym a dobrze wentylowanym przy Av = 1000 mm²/m (ISO 6946 §6.9.3). Poniższe profile temperatury i pary odnoszą się do komory niewentylowanej."],
  'warn.mixedframe':['Framing fractions differ between layers; sections are combined assuming the framing is not aligned.','Verschillende regelwerkaandelen per laag; secties zijn gecombineerd alsof het regelwerk niet uitlijnt.','Les parts d’ossature diffèrent selon les couches ; sections combinées en supposant une ossature non alignée.','Unterschiedliche Ständeranteile je Schicht; Abschnitte werden als nicht fluchtend kombiniert.','Las fracciones de entramado difieren; se combinan suponiendo entramado no alineado.','Частки каркаса різні; перерізи комбінуються як незбіжні.','Доли каркаса в слоях разные; сечения комбинируются как несовпадающие.',"Ułamki ramek różnią się między warstwami; sekcje są łączone przy założeniu, że ramka nie jest wyrównana."],
  'warn.manyframes':['More than six framed layers — only the first six are combined.','Meer dan zes lagen met regelwerk — alleen de eerste zes worden gecombineerd.','Plus de six couches avec ossature — seules les six premières sont combinées.','Mehr als sechs Schichten mit Ständern — nur die ersten sechs werden kombiniert.','Más de seis capas con entramado — solo se combinan las seis primeras.','Понад шість каркасних шарів — комбінуються лише перші шість.','Более шести каркасных слоёв — комбинируются только первые шесть.',"Więcej niż sześć warstw ramek — tylko pierwsze sześć jest połączonych."],
  'res.profnote':   ['Profile shown for the section between the framing; U and fRsi include it.','Profiel getoond tussen het regelwerk; U en fRsi houden er rekening mee.','Profil tracé entre les montants ; U et fRsi en tiennent compte.','Profil zwischen den Ständern; U und fRsi berücksichtigen sie.','Perfil entre montantes; U y fRsi sí lo incluyen.','Профіль показано між елементами каркаса; U і fRsi їх враховують.','Профиль показан между элементами каркаса; U и fRsi их учитывают.',"Profil pokazany dla przekroju pomiędzy elementami konstrukcyjnymi; U i fRsi go uwzględniają."],
  'res.thsid':      ['Design surface temperature (with bridges)','Ontwerp-oppervlaktetemperatuur (incl. koudebruggen)','Température de surface de calcul (avec ponts)','Bemessungs-Oberflächentemperatur (mit Wärmebrücken)','Temperatura superficial de cálculo (con puentes)','Розрахункова температура поверхні (з містками)','Расчётная температура поверхности (с мостиками)',"Temperatura powierzchni projektowej (z mostkami)"],

  'cl.synth':       ['Offline estimate from latitude, not measured data','Offline schatting op basis van breedtegraad','Estimation hors ligne d’après la latitude','Offline-Schätzung aus der Breite','Estimación sin conexión a partir de la latitud','Офлайн-оцінка за широтою','Офлайн-оценка по широте, не измеренные данные',"Szacunek offline na podstawie szerokości geograficznej, a nie danych pomiarowych"],

  'ms.unsaved':     ['Everything is calculated in your browser; nothing is uploaded.','Alles wordt in uw browser berekend; er wordt niets verzonden.','Tout est calculé dans votre navigateur ; rien n’est envoyé.','Alles wird im Browser berechnet; nichts wird übertragen.','Todo se calcula en su navegador; no se envía nada.','Усе обчислюється у вашому браузері; нічого не надсилається.','Всё считается в вашем браузере; ничего не отправляется.',"Wszystko jest obliczane w Twojej przeglądarce, nic nie jest przesyłane."],

  /* --- learn layer (v3 UI framework): titles reuse the labels above, bodies are
         the explanatory prose this page already shipped, moved out of the form --- */
  'lrn.intro.t':    ['What this tool does','Wat deze tool doet','Ce que fait cet outil','Was dieses Werkzeug tut','Qué hace esta herramienta','Що робить цей інструмент','Что делает этот инструмент',"Co to narzędzie robi"],
  'lrn.intro.b':    ['Build a wall, roof or floor layer by layer from a 72-material library and see where it fails: the U-value with framing and thermal bridges, the inner surface temperature and the fRsi mould check, the dew point located inside the stack, Glaser interstitial condensation, and the 24-hour dynamic response. Start from an example, then drag the layer edges in the cross-section or type a thickness.','Bouw een wand, dak of vloer laag voor laag op uit een bibliotheek van 72 materialen en zie waar de constructie tekortschiet: de U-waarde met regelwerk en koudebruggen, de binnenoppervlaktetemperatuur en de fRsi-toets, het dauwpunt in het pakket, inwendige condensatie volgens Glaser en het dynamisch gedrag over 24 uur. Begin met een voorbeeld en sleep daarna de laaggrenzen in de doorsnede.','Composez un mur, une toiture ou un plancher couche par couche à partir de 72 matériaux et voyez où la paroi cède : le coefficient U avec ossature et ponts thermiques, la température de surface intérieure et le critère fRsi, le point de rosée dans la paroi, la condensation interne selon Glaser et la réponse dynamique sur 24 heures. Partez d’un exemple, puis déplacez les limites de couches dans la coupe.','Bauen Sie Wand, Dach oder Boden Schicht für Schicht aus 72 Materialien auf und sehen Sie, wo das Bauteil versagt: U-Wert mit Gefach und Wärmebrücken, innere Oberflächentemperatur und fRsi-Nachweis, Lage des Taupunkts, Tauwasser nach Glaser und das dynamische Verhalten über 24 Stunden. Beginnen Sie mit einem Beispiel und ziehen Sie dann die Schichtgrenzen im Querschnitt.','Componga un muro, una cubierta o un forjado capa a capa a partir de 72 materiales y vea dónde falla: la transmitancia U con entramado y puentes térmicos, la temperatura superficial interior y la comprobación fRsi, el punto de rocío dentro del cerramiento, la condensación intersticial de Glaser y la respuesta dinámica de 24 horas. Empiece por un ejemplo y arrastre después los bordes de las capas.','Складіть стіну, покрівлю чи підлогу шар за шаром із бібліотеки на 72 матеріали і побачте, де конструкція не тримає: U-коефіцієнт із каркасом і містками холоду, температура внутрішньої поверхні та перевірка fRsi, точка роси в товщі, конденсація за Глазером і добова динамічна відповідь. Почніть із прикладу, потім перетягуйте межі шарів на розрізі.','Соберите стену, покрытие или пол слой за слоем из библиотеки на 72 материала и посмотрите, где конструкция не держит: U-коэффициент с каркасом и мостиками холода, температура внутренней поверхности и проверка fRsi, точка росы в толще, конденсация по Глазеру и суточная динамическая реакция. Начните с примера, затем перетаскивайте границы слоёв на разрезе.',"Zbuduj ścianę, dach lub podłogę warstwa po warstwie z biblioteki 72 materiałów i sprawdź, gdzie zawodzi: współczynnik U z ramą i mostkami termicznymi, temperatura powierzchni wewnętrznej i test pleśni fRSI, punkt rosy wewnątrz komina, kondensacja międzywęzłowa Glasera oraz 24-godzinna reakcja dynamiczna. Zacznij od przykładu, a następnie przeciągnij krawędzie warstw w przekroju poprzecznym lub wpisz grubość."],
  'lrn.layers.b':   ['Layers are listed from the inside out. The thickness box, the drag handles in the cross-section and the material picker all edit the same stack. Open ⚙ on a layer for framing fraction, framing material, a λ or μ override, and — for a cavity — its ventilation.','Lagen staan van binnen naar buiten. Het diktevak, de sleepgrepen in de doorsnede en de materiaalkiezer bewerken dezelfde opbouw. Open ⚙ voor regelwerkaandeel, materiaal van het regelwerk, een eigen λ of μ, en voor een spouw de ventilatie.','Les couches vont de l’intérieur vers l’extérieur. La case d’épaisseur, les poignées de la coupe et le sélecteur de matériau modifient la même paroi. Ouvrez ⚙ pour la part d’ossature, son matériau, un λ ou μ imposé et, pour une lame d’air, sa ventilation.','Die Schichten stehen von innen nach außen. Dickenfeld, Ziehpunkte im Querschnitt und Materialauswahl bearbeiten denselben Aufbau. ⚙ öffnet Gefachanteil, Ständermaterial, λ- oder μ-Überschreibung und bei einer Luftschicht die Belüftung.','Las capas van del interior al exterior. La casilla de espesor, los tiradores de la sección y el selector de material editan el mismo paquete. Abra ⚙ para la fracción de entramado, su material, un λ o μ propios y, en una cámara, su ventilación.','Шари перелічені зсередини назовні. Поле товщини, ручки на розрізі та вибір матеріалу правлять один і той самий пакет. ⚙ відкриває частку каркаса, його матеріал, власні λ чи μ і — для прошарку — вентиляцію.','Слои перечислены изнутри наружу. Поле толщины, ручки на разрезе и выбор материала правят один и тот же пакет. ⚙ открывает долю каркаса, его материал, свои λ или μ и — для прослойки — вентиляцию.',"Warstwy są wyświetlane od wewnątrz na zewnątrz. Pole grubości, uchwyty przeciągania w przekroju poprzecznym i selektor materiałów edytują ten sam stos. Otwórz ⚙ na warstwie, aby określić frakcję kadrowania, materiał kadrowania, nadpisanie λ lub μ oraz — w przypadku wnęki — jej wentylację."],
  'lrn.cond.b':     ['The boundary conditions fix both the temperature profile and the vapour pressures. Rsi and Rse are left empty to use the tabulated values of EN ISO 6946 Table 7 for the heat-flow direction of the element; type a value to override them. Interstitial condensation is judged at these conditions, not over a year, unless climate data has been loaded.','De randvoorwaarden bepalen zowel het temperatuurverloop als de dampdrukken. Laat Rsi en Rse leeg voor de tabelwaarden van EN ISO 6946 tabel 7 bij de stroomrichting van het bouwdeel; vul een waarde in om ze te overschrijven. Inwendige condensatie wordt bij deze condities beoordeeld, niet over een jaar, tenzij klimaatdata is geladen.','Les conditions aux limites fixent le profil de température et les pressions de vapeur. Laissez Rsi et Rse vides pour les valeurs du tableau 7 de l’EN ISO 6946 selon le sens du flux ; saisissez une valeur pour les imposer. La condensation interne est jugée à ces conditions, non sur l’année, sauf si des données climatiques sont chargées.','Die Randbedingungen legen Temperaturverlauf und Dampfdrücke fest. Rsi und Rse leer lassen, um die Tabellenwerte nach EN ISO 6946 Tabelle 7 für die Wärmestromrichtung zu verwenden; ein Eintrag überschreibt sie. Tauwasser wird für diese Bedingungen beurteilt, nicht über ein Jahr, solange keine Klimadaten geladen sind.','Las condiciones de contorno fijan el perfil de temperatura y las presiones de vapor. Deje Rsi y Rse vacíos para los valores de la tabla 7 de la EN ISO 6946 según el sentido del flujo; escriba un valor para sustituirlos. La condensación intersticial se juzga en estas condiciones, no a lo largo del año, salvo que se carguen datos de clima.','Граничні умови задають і профіль температури, і тиски пари. Залиште Rsi та Rse порожніми, щоб узяти табличні значення EN ISO 6946, таблиця 7, для напрямку потоку; введене значення їх замінює. Конденсацію оцінюють саме за цих умов, а не за рік, доки не завантажено кліматичні дані.','Граничные условия задают и профиль температуры, и давления пара. Оставьте Rsi и Rse пустыми, чтобы взять табличные значения EN ISO 6946, таблица 7, для направления потока; введённое значение их заменяет. Конденсацию оценивают именно при этих условиях, а не за год, пока не загружены климатические данные.',"Warunki brzegowe ustalają zarówno profil temperatury, jak i prężność pary. Pola Rsi i Rse należy pozostawić puste, aby użyć wartości tabelarycznych z tabeli 7 normy EN ISO 6946 dla kierunku przepływu ciepła elementu; należy wpisać wartość, aby je zastąpić. Kondensację międzywęzłową ocenia się w tych warunkach, nie dłużej niż rok, chyba że wczytano dane klimatyczne."],
  'lrn.u.b':        ['R is the sum of the layer resistances plus the two surface resistances; U is 1/R. Framed layers are combined by the upper/lower-limit method of EN ISO 6946 6.7, and the ψ and χ values of the thermal-bridge list are added to U afterwards. The U shown as the headline is the one including the bridges, because that is the one a requirement is written against.','R is de som van de laagweerstanden plus de twee overgangsweerstanden; U is 1/R. Lagen met regelwerk worden gecombineerd volgens EN ISO 6946 6.7 en de ψ- en χ-waarden van de koudebruggen worden daarna bij U opgeteld. De getoonde U is die inclusief koudebruggen, want daarop is de eis geschreven.','R est la somme des résistances de couche et des deux résistances superficielles ; U vaut 1/R. Les couches à ossature sont combinées selon l’EN ISO 6946 6.7, puis les ψ et χ des ponts thermiques s’ajoutent à U. La valeur mise en avant est le U ponts thermiques inclus, car c’est celle que vise l’exigence.','R ist die Summe der Schichtwiderstände und der beiden Übergangswiderstände; U ist 1/R. Gefachschichten werden nach EN ISO 6946 6.7 kombiniert, anschließend werden die ψ- und χ-Werte der Wärmebrücken auf U addiert. Hervorgehoben wird U einschließlich Wärmebrücken, denn darauf zielt die Anforderung.','R es la suma de las resistencias de capa más las dos superficiales; U es 1/R. Las capas con entramado se combinan según EN ISO 6946 6.7 y después se suman a U los ψ y χ de los puentes térmicos. El valor destacado es U con puentes, porque es el que compara la exigencia.','R — сума опорів шарів і двох опорів тепловіддачі; U = 1/R. Каркасні шари поєднують за EN ISO 6946 6.7, після чого до U додають ψ і χ містків холоду. Головним показано U з містками, бо саме на нього написано вимогу.','R — сумма сопротивлений слоёв и двух сопротивлений теплоотдаче; U = 1/R. Каркасные слои объединяют по EN ISO 6946 6.7, затем к U прибавляют ψ и χ мостиков холода. Главным показан U с мостиками, потому что именно на него написано требование.',"R to suma rezystancji warstw i dwóch rezystancji powierzchniowych; U wynosi 1/R. Warstwy ramowe są łączone metodą górnej/dolnej granicy zgodnie z normą EN ISO 6946 6.7, a wartości ψ i χ z listy mostków termicznych są następnie dodawane do U. Wartość U podana jako nagłówek to wartość uwzględniająca mostki, ponieważ to właśnie do niej odnosi się wymaganie."],
  'lrn.frsi.b':     ['fRsi = 1 − Rsi·U is the share of the indoor-to-outdoor temperature difference that survives to the inner surface. Below about 0.75 the surface is cold enough for mould at ordinary indoor humidity, so the check is a mould criterion, not a condensation one.','fRsi = 1 − Rsi·U is het deel van het temperatuurverschil dat aan het binnenoppervlak overblijft. Onder circa 0,75 is het oppervlak koud genoeg voor schimmel bij normale binnenvochtigheid; het is dus een schimmeltoets, geen condensatietoets.','fRsi = 1 − Rsi·U est la part de l’écart de température qui subsiste en surface intérieure. Sous 0,75 environ, la surface est assez froide pour que des moisissures apparaissent à humidité intérieure ordinaire : c’est un critère de moisissure, pas de condensation.','fRsi = 1 − Rsi·U ist der Anteil der Temperaturdifferenz, der an der Innenoberfläche verbleibt. Unter etwa 0,75 ist die Oberfläche bei üblicher Raumluftfeuchte kalt genug für Schimmel; der Nachweis ist ein Schimmel-, kein Tauwasserkriterium.','fRsi = 1 − Rsi·U es la parte del salto térmico que queda en la superficie interior. Por debajo de 0,75 la superficie está lo bastante fría para que aparezca moho con humedad interior normal: es un criterio de moho, no de condensación.','fRsi = 1 − Rsi·U — частка перепаду температур, що лишається на внутрішній поверхні. Нижче приблизно 0,75 поверхня достатньо холодна для плісняви за звичайної вологості; це критерій плісняви, а не конденсату.','fRsi = 1 − Rsi·U — доля перепада температур, остающаяся на внутренней поверхности. Ниже примерно 0,75 поверхность достаточно холодная для плесени при обычной влажности; это критерий плесени, а не конденсата.',"fRsi = 1 − Rsi·U to część różnicy temperatur między wnętrzem a zewnętrzem, która utrzymuje się na powierzchni wewnętrznej. Poniżej około 0,75 powierzchnia jest wystarczająco zimna, aby mogła rozwijać się pleśń przy normalnej wilgotności powietrza w pomieszczeniu, więc kontrola jest kryterium pleśni, a nie kondensacji."],
  'lrn.glaser.b':   ['The Glaser construction draws the saturation pressure against the vapour diffusion thickness Sd and stretches the real vapour pressure line between the indoor and outdoor values. Where the line would cross saturation it is pulled onto it, and the kink is a condensation interface. It is a diffusion model only: no liquid transport, no capillary redistribution, no hygroscopic storage, and μ independent of humidity.','De Glaser-constructie zet de verzadigingsdruk uit tegen de diffusiedikte Sd en spant de werkelijke dampdruklijn tussen binnen en buiten. Waar de lijn de verzadiging zou snijden wordt zij erop getrokken; de knik is een condensatievlak. Het is uitsluitend een diffusiemodel: geen vloeistoftransport, geen capillaire herverdeling, geen buffering, μ onafhankelijk van de vochtigheid.','La construction de Glaser trace la pression de saturation en fonction de l’épaisseur de diffusion Sd et tend la droite de pression réelle entre l’intérieur et l’extérieur. Là où elle couperait la saturation, elle est ramenée dessus : le point anguleux est une interface de condensation. C’est un modèle de diffusion seul : pas de transport liquide, pas de redistribution capillaire, pas de stockage, μ indépendant de l’humidité.','Die Glaser-Konstruktion trägt den Sättigungsdruck über der Diffusionsdicke Sd auf und spannt die reale Dampfdrucklinie zwischen innen und außen. Wo sie die Sättigung schneiden würde, wird sie darauf gezogen; der Knick ist eine Tauwasserebene. Es ist ein reines Diffusionsmodell: kein Flüssigtransport, keine kapillare Umverteilung, keine Speicherung, μ feuchteunabhängig.','La construcción de Glaser dibuja la presión de saturación frente al espesor de difusión Sd y tensa la línea de presión real entre interior y exterior. Donde cortaría la saturación se lleva sobre ella; el quiebro es una interfaz de condensación. Es sólo un modelo de difusión: sin transporte líquido, sin redistribución capilar, sin almacenamiento y con μ independiente de la humedad.','Побудова Глазера відкладає тиск насичення проти дифузійної товщини Sd і натягує лінію реального тиску пари між внутрішнім і зовнішнім значеннями. Де лінія перетнула б насичення, її притискають до нього; злам — межа конденсації. Це суто дифузійна модель: без рідинного перенесення, без капілярного перерозподілу, без накопичення, μ не залежить від вологості.','Построение Глазера откладывает давление насыщения против диффузионной толщины Sd и натягивает линию реального давления пара между внутренним и наружным значениями. Где линия пересекла бы насыщение, её прижимают к нему; излом — плоскость конденсации. Это чисто диффузионная модель: без жидкостного переноса, без капиллярного перераспределения, без накопления, μ не зависит от влажности.',"Konstrukcja Glasera oblicza ciśnienie nasycenia w odniesieniu do grubości dyfuzji pary wodnej Sd i rozciąga linię rzeczywistego ciśnienia pary wodnej między wartościami wewnętrznymi i zewnętrznymi. W miejscu przecięcia linii nasycenia linia jest na nią naciągana, a załamanie stanowi granicę kondensacji. Jest to model wyłącznie dyfuzyjny: brak transportu cieczy, redystrybucji kapilarnej, magazynowania higroskopijnego i μ niezależny od wilgotności."],
  'lrn.dyn.b':      ['The dynamic figures are one 24-hour harmonic solved with the transfer-matrix method of EN ISO 13786. κ is the heat capacity the room actually sees, the decrement factor is the share of an outdoor swing that arrives inside, and the time shift is how many hours later it arrives. They are not a transient simulation and say nothing about a multi-day heat wave.','De dynamische getallen zijn één etmaalharmonische volgens de matrixmethode van EN ISO 13786. κ is de warmtecapaciteit die de ruimte werkelijk voelt, de dempingsfactor is het deel van een buitenschommeling dat binnen aankomt en de faseverschuiving is hoeveel uur later. Het is geen transiënte simulatie en zegt niets over een hittegolf van meerdere dagen.','Les grandeurs dynamiques sont une seule harmonique de 24 h résolue par la méthode matricielle de l’EN ISO 13786. κ est la capacité thermique réellement vue par le local, le facteur d’amortissement la part d’une oscillation extérieure qui parvient à l’intérieur, et le déphasage son retard en heures. Ce n’est pas une simulation transitoire et cela ne dit rien d’une canicule de plusieurs jours.','Die dynamischen Kennwerte sind eine einzige 24-h-Harmonische nach dem Matrizenverfahren der EN ISO 13786. κ ist die Wärmekapazität, die der Raum tatsächlich sieht, die Amplitudendämpfung der Anteil einer Außenschwankung, der innen ankommt, und die Phasenverschiebung deren Verzögerung in Stunden. Es ist keine transiente Simulation und sagt nichts über eine mehrtägige Hitzewelle.','Las magnitudes dinámicas son un único armónico de 24 h resuelto con el método matricial de la EN ISO 13786. κ es la capacidad térmica que realmente ve el local, el factor de amortiguación la parte de una oscilación exterior que llega al interior y el desfase su retraso en horas. No es una simulación transitoria ni dice nada de una ola de calor de varios días.','Динамічні величини — одна добова гармоніка за матричним методом EN ISO 13786. κ — теплоємність, яку насправді бачить приміщення, коефіцієнт затухання — частка зовнішнього коливання, що доходить усередину, а зсув фази — на скільки годин пізніше. Це не нестаціонарне моделювання і нічого не каже про багатоденну спеку.','Динамические величины — одна суточная гармоника по матричному методу EN ISO 13786. κ — теплоёмкость, которую реально видит помещение, коэффициент затухания — доля наружного колебания, доходящая внутрь, а сдвиг фазы — на сколько часов позже. Это не нестационарный расчёт и ничего не говорит о многодневной жаре.',"Dane dynamiczne to jedna harmoniczna 24-godzinna rozwiązana metodą macierzy przejścia z normy EN ISO 13786. κ to rzeczywista pojemność cieplna pomieszczenia, współczynnik dekrementacji to część ciepła zewnętrznego docierającego do wnętrza, a przesunięcie czasowe to liczba godzin po jego pojawieniu się. Nie są to symulacje przejściowe i nie mówią nic o wielodniowej fali upałów."],
  'lrn.bridges.b':  ['Thermal bridges are entered as ψ (per metre of joint) and χ (per fixing) values and added to U, exactly as EN ISO 6946 6.6 does it. They are deliberately not smeared into the one-dimensional temperature profile: the profile stays the profile of the plane section, while U and fRsi carry the penalty.','Koudebruggen worden ingevoerd als ψ (per meter aansluiting) en χ (per bevestiger) en bij U opgeteld, precies zoals EN ISO 6946 6.6 het doet. Ze worden bewust niet uitgesmeerd over het temperatuurverloop: het profiel blijft dat van het vlakke deel, terwijl U en fRsi de straf dragen.','Les ponts thermiques sont saisis en ψ (par mètre de liaison) et χ (par fixation) et ajoutés à U, comme le fait l’EN ISO 6946 6.6. Ils ne sont volontairement pas répartis dans le profil de température : le profil reste celui de la partie courante, tandis que U et fRsi en portent la pénalité.','Wärmebrücken werden als ψ (je Meter Anschluss) und χ (je Befestiger) eingegeben und nach EN ISO 6946 6.6 auf U addiert. Sie werden bewusst nicht in das eindimensionale Temperaturprofil eingerechnet: das Profil bleibt das des ungestörten Bauteils, U und fRsi tragen den Zuschlag.','Los puentes térmicos se introducen como ψ (por metro de encuentro) y χ (por fijación) y se suman a U, tal como hace la EN ISO 6946 6.6. Deliberadamente no se reparten en el perfil de temperatura: el perfil sigue siendo el de la parte corriente y son U y fRsi los que cargan la penalización.','Містки холоду задають як ψ (на метр стику) і χ (на кріплення) й додають до U, як це робить EN ISO 6946 6.6. Їх свідомо не розмазують по одновимірному профілю: профіль лишається профілем гладкої ділянки, а штраф несуть U та fRsi.','Мостики холода задают как ψ (на метр стыка) и χ (на крепёж) и прибавляют к U, как это делает EN ISO 6946 6.6. Их сознательно не размазывают по одномерному профилю: профиль остаётся профилем гладкого участка, а штраф несут U и fRsi.',"Mostki termiczne są wprowadzane jako wartości ψ (na metr złącza) i χ (na mocowanie) i dodawane do współczynnika U, dokładnie tak, jak robi to norma EN ISO 6946 6.6. Celowo nie są one wtapiane w jednowymiarowy profil temperaturowy: profil pozostaje profilem przekroju płaskiego, a współczynniki U i fRsi ponoszą straty."],
  'lrn.climate.b':  ['The climate tab downloads a year of hourly reanalysis and, when it can, twenty years of daily means, then derives design temperatures, degree days and the solar irradiance on each of the eight orientations. With no network it falls back to a clearly labelled synthetic estimate from latitude alone — plausible, but not measured. Loading climate data never rewrites the indoor conditions.','Het klimaattabblad haalt een jaar uurdata op en, indien mogelijk, twintig jaar dagwaarden, en leidt daaruit ontwerptemperaturen, graaddagen en de zoninstraling per oriëntatie af. Zonder netwerk volgt een duidelijk gemarkeerde synthetische schatting uit alleen de breedtegraad — aannemelijk, maar niet gemeten. Klimaatdata laden verandert nooit de binnencondities.','L’onglet climat télécharge une année de réanalyse horaire et, si possible, vingt ans de moyennes journalières, puis en tire les températures de base, les degrés-jours et l’ensoleillement des huit orientations. Sans réseau, il bascule sur une estimation synthétique clairement signalée, tirée de la seule latitude : plausible, non mesurée. Charger le climat ne réécrit jamais les conditions intérieures.','Das Klimaregister lädt ein Jahr Stundenwerte und nach Möglichkeit zwanzig Jahre Tagesmittel und leitet daraus Auslegungstemperaturen, Gradtage und die Einstrahlung auf acht Orientierungen ab. Ohne Netz wird auf eine deutlich gekennzeichnete synthetische Schätzung allein aus der Breite umgeschaltet — plausibel, aber nicht gemessen. Das Laden von Klimadaten überschreibt nie die Innenbedingungen.','La pestaña de clima descarga un año de reanálisis horario y, si puede, veinte años de medias diarias, y de ahí obtiene temperaturas de proyecto, grados-día y la irradiancia en las ocho orientaciones. Sin red recurre a una estimación sintética claramente señalada a partir sólo de la latitud: verosímil, no medida. Cargar el clima nunca reescribe las condiciones interiores.','Кліматична вкладка завантажує рік погодинного реаналізу і, якщо вдається, двадцять років добових середніх, а з них виводить розрахункові температури, градусо-доби та сонячну радіацію на вісім орієнтацій. Без мережі вмикається чітко позначена синтетична оцінка лише за широтою — правдоподібна, але не виміряна. Завантаження клімату ніколи не переписує внутрішні умови.','Климатическая вкладка загружает год почасового реанализа и, если получается, двадцать лет суточных средних, а из них выводит расчётные температуры, градусо-сутки и солнечную радиацию на восемь ориентаций. Без сети включается явно помеченная синтетическая оценка только по широте — правдоподобная, но не измеренная. Загрузка климата никогда не переписывает внутренние условия.',"Karta klimatyczna pobiera dane z roku cogodzinnej analizy, a jeśli to możliwe, także dane z dwudziestu lat średnich dziennych, a następnie wyznacza temperatury projektowe, stopodni i natężenie promieniowania słonecznego dla każdej z ośmiu orientacji. Bez sieci opiera się na jasno oznaczonych szacunkach syntetycznych, opartych wyłącznie na szerokości geograficznej – wiarygodnych, ale niemierzalnych. Wczytanie danych klimatycznych nigdy nie zmienia warunków panujących w pomieszczeniu."],
  'lrn.glazing.b':  ['The glazing model follows EN 673: a radiative and a convective conductance per cavity, corrected emissivities per EN 12898, and the frame added by area fraction with a spacer ψ. The solar factor is a tabulated starting value modified by the coatings, not a spectral calculation, and the surface-condensation check uses Rsi = 0.25 m²·K/W as EN ISO 13788 requires for glazing.','Het beglazingsmodel volgt EN 673: per spouw een stralings- en een convectiegeleiding, gecorrigeerde emissiviteiten volgens EN 12898, en het kozijn naar oppervlakteaandeel met een afstandhouder-ψ. De g-waarde is een tabelwaarde gecorrigeerd voor de coatings, geen spectrale berekening; de oppervlaktecondensatietoets gebruikt Rsi = 0,25 m²·K/W zoals EN ISO 13788 voorschrijft.','Le modèle de vitrage suit l’EN 673 : une conductance radiative et une conductance convective par lame, des émissivités corrigées selon l’EN 12898, et le cadre ajouté au prorata de surface avec un ψ d’intercalaire. Le facteur solaire est une valeur tabulée corrigée des couches, non un calcul spectral ; la vérification de condensation superficielle utilise Rsi = 0,25 m²·K/W comme l’exige l’EN ISO 13788.','Das Verglasungsmodell folgt EN 673: je Scheibenzwischenraum ein Strahlungs- und ein Konvektionsleitwert, korrigierte Emissivitäten nach EN 12898 und der Rahmen über den Flächenanteil mit Abstandhalter-ψ. Der g-Wert ist ein Tabellenwert, durch die Beschichtungen verändert, keine spektrale Rechnung; der Nachweis der Oberflächenkondensation nutzt Rsi = 0,25 m²·K/W nach EN ISO 13788.','El modelo de acristalamiento sigue la EN 673: una conductancia radiante y otra convectiva por cámara, emisividades corregidas según EN 12898 y el marco añadido por fracción de área con un ψ de separador. El factor solar es un valor tabulado modificado por las capas, no un cálculo espectral; la comprobación de condensación superficial usa Rsi = 0,25 m²·K/W como exige la EN ISO 13788.','Модель склопакета йде за EN 673: на кожен прошарок променевий і конвективний коефіцієнти, скориговані випромінювальні здатності за EN 12898, рама — за часткою площі з ψ дистанційної рамки. Сонячний фактор — таблична величина, змінена покриттями, а не спектральний розрахунок; перевірка поверхневого конденсату бере Rsi = 0,25 м²·К/Вт, як вимагає EN ISO 13788.','Модель стеклопакета следует EN 673: на каждую прослойку лучистая и конвективная проводимости, скорректированные излучательные способности по EN 12898, рама — по доле площади с ψ дистанционной рамки. Солнечный фактор — табличная величина, изменённая покрытиями, а не спектральный расчёт; проверка поверхностного конденсата берёт Rsi = 0,25 м²·К/Вт, как требует EN ISO 13788.',"Model przeszklenia jest zgodny z normą EN 673: przewodność radiacyjna i konwekcyjna na komorę, skorygowane współczynniki emisyjności zgodnie z normą EN 12898 oraz rama dodana o ułamek powierzchni z przekładką ψ. Współczynnik solarny to tabelaryczna wartość początkowa modyfikowana przez powłoki, a nie obliczenie spektralne, a do sprawdzenia kondensacji powierzchniowej stosuje się Rsi = 0,25 m²·K/W, zgodnie z wymaganiami normy EN ISO 13788 dla przeszkleń."],
  'lrn.norm.b':     ['The requirement set only chooses the target U the result is compared against; it changes nothing in the calculation. Choose Custom, or type a target, to compare against your own figure. The Russian SP 50 entry derives its target from the heating degree days of the loaded climate.','Het eisenpakket kiest alleen de streefwaarde waarmee het resultaat wordt vergeleken; aan de berekening verandert niets. Kies Eigen of typ een streefwaarde om met uw eigen getal te vergelijken. De Russische SP 50 leidt de eis af uit de graaddagen van het geladen klimaat.','Le référentiel ne choisit que le U cible auquel le résultat est comparé ; il ne change rien au calcul. Choisissez Personnalisé, ou saisissez une cible, pour comparer à votre propre valeur. L’entrée russe SP 50 déduit sa cible des degrés-jours du climat chargé.','Der Anforderungssatz wählt nur den Ziel-U-Wert, mit dem verglichen wird; an der Rechnung ändert er nichts. Für einen eigenen Wert „Eigen“ wählen oder den Zielwert eintragen. Der russische Eintrag SP 50 leitet sein Ziel aus den Gradtagen des geladenen Klimas ab.','La normativa sólo elige la U objetivo con la que se compara el resultado; no cambia nada del cálculo. Elija Personalizado, o escriba un objetivo, para comparar con su propia cifra. La entrada rusa SP 50 deduce su objetivo de los grados-día del clima cargado.','Набір вимог лише обирає цільове U, з яким порівнюють результат; на розрахунок він не впливає. Оберіть «Власне» або введіть ціль, щоб порівняти зі своїм числом. Російський СП 50 виводить ціль із градусо-діб завантаженого клімату.','Набор требований лишь выбирает целевое U, с которым сравнивают результат; на расчёт он не влияет. Выберите «Своё» или введите цель, чтобы сравнить со своим числом. Российский СП 50 выводит цель из градусо-суток загруженного климата.',"Zestaw wymagań wybiera jedynie docelową wartość U, z którą porównywany jest wynik; nie zmienia to nic w obliczeniach. Wybierz opcję „Niestandardowa” lub wpisz wartość docelową, aby porównać ją z własną wartością. Rosyjski wpis SP 50 wyprowadza swoją wartość docelową na podstawie stopniodni ogrzewania w załadowanym klimacie."],
  'lrn.stage.b':    ['Drag a layer edge in the cross-section to change that layer’s thickness; hold the total constant with the checkbox and the next layer gives way. Drag the blue dew-point marker and the tool solves the marked layer’s thickness backwards so the dew point lands where you put it. Thickness labels sit under the layer they belong to, not on a cumulative axis.','Sleep een laaggrens in de doorsnede om die laag dikker of dunner te maken; met het vinkje blijft de totale dikte gelijk en wijkt de volgende laag. Sleep de blauwe dauwpuntmarkering en de tool rekent de dikte van de gemerkte laag terug zodat het dauwpunt daar komt. De diktelabels staan onder hun eigen laag, niet op een cumulatieve as.','Faites glisser une limite de couche dans la coupe pour en changer l’épaisseur ; avec la case cochée, l’épaisseur totale est conservée et la couche suivante cède. Faites glisser le repère bleu du point de rosée et l’outil résout à rebours l’épaisseur de la couche marquée. Les étiquettes d’épaisseur sont sous leur propre couche, pas sur un axe cumulé.','Ziehen Sie eine Schichtgrenze im Querschnitt, um die Dicke zu ändern; mit dem Häkchen bleibt die Gesamtdicke erhalten und die nächste Schicht weicht. Ziehen Sie die blaue Taupunktmarke, und das Werkzeug löst die Dicke der markierten Schicht rückwärts. Die Dickenbeschriftungen stehen unter ihrer eigenen Schicht, nicht auf einer kumulierten Achse.','Arrastre un borde de capa en la sección para cambiar su espesor; con la casilla marcada el espesor total se mantiene y cede la capa siguiente. Arrastre el marcador azul del punto de rocío y la herramienta resuelve hacia atrás el espesor de la capa señalada. Las etiquetas de espesor están bajo su propia capa, no en un eje acumulado.','Перетягніть межу шару на розрізі, щоб змінити його товщину; з увімкненою галочкою загальна товщина зберігається, а наступний шар поступається. Перетягніть синю позначку точки роси — і товщину позначеного шару буде підібрано зворотно. Підписи товщин стоять під своїм шаром, а не на накопичувальній осі.','Перетащите границу слоя на разрезе, чтобы изменить его толщину; с включённой галочкой общая толщина сохраняется, а следующий слой уступает. Перетащите синюю метку точки росы — и толщина отмеченного слоя будет подобрана обратно. Подписи толщин стоят под своим слоем, а не на накопительной оси.',"Przeciągnij krawędź warstwy w przekroju, aby zmienić jej grubość; przytrzymaj stałą wartość całkowitą za pomocą pola wyboru, a następna warstwa zostanie zastąpiona. Przeciągnij niebieski znacznik punktu rosy, a narzędzie obliczy grubość zaznaczonej warstwy do tyłu, tak aby punkt rosy znalazł się tam, gdzie go umieściłeś. Etykiety grubości znajdują się pod warstwą, do której należą, a nie na osi kumulacyjnej."],
  'lrn.cond.tt':    ['Is “yes” acceptable?','Is “ja” aanvaardbaar?','« Oui » est-il acceptable ?','Ist „ja“ zulässig?','¿Es aceptable un “sí”?','Чи прийнятне «так»?','Приемлемо ли «да»?',"Czy odpowiedź „tak” jest akceptowalna?"],
  'lrn.cond.tb':    ['Condensation inside the assembly is not automatically a failure. EN ISO 13788 accepts it when the whole amount evaporates again within the same year and no material is damaged meanwhile; that is what the annual balance in the report checks once climate data is loaded. It is a failure when the condensate accumulates from year to year, when it wets a moisture-sensitive material such as timber or mineral wool, or when it runs. The daily rate and the position of the interface matter more than the yes/no.','Condensatie in de constructie is niet vanzelf een afkeuring. EN ISO 13788 staat haar toe als alles binnen hetzelfde jaar weer verdampt en er intussen geen materiaal wordt aangetast; dat toetst de jaarbalans in het rapport zodra klimaatdata geladen is. Het is wél fout als het condensaat van jaar tot jaar ophoopt, als het een vochtgevoelig materiaal zoals hout of minerale wol natmaakt, of als het gaat lopen. De dagelijkse hoeveelheid en de plaats van het vlak zeggen meer dan het ja/nee.','La condensation dans la paroi n’est pas automatiquement un échec. L’EN ISO 13788 l’admet si la totalité s’évapore dans l’année et qu’aucun matériau n’est endommagé entre-temps ; c’est ce que vérifie le bilan annuel du rapport une fois le climat chargé. Elle est rédhibitoire si le condensat s’accumule d’une année sur l’autre, s’il mouille un matériau sensible comme le bois ou la laine minérale, ou s’il ruisselle. Le débit journalier et la position de l’interface comptent plus que le oui/non.','Tauwasser im Bauteil ist nicht automatisch ein Mangel. EN ISO 13788 lässt es zu, wenn die gesamte Menge im selben Jahr wieder verdunstet und zwischenzeitlich kein Material geschädigt wird; genau das prüft die Jahresbilanz im Bericht, sobald Klimadaten geladen sind. Ein Mangel ist es, wenn sich das Tauwasser von Jahr zu Jahr summiert, wenn es feuchteempfindliches Material wie Holz oder Mineralwolle durchnässt oder wenn es abläuft. Tagesmenge und Lage der Ebene sagen mehr als das Ja/Nein.','La condensación dentro del cerramiento no es automáticamente un fallo. La EN ISO 13788 la admite si todo se evapora dentro del mismo año y entretanto no se daña ningún material; eso comprueba el balance anual del informe una vez cargado el clima. Sí es un fallo si el condensado se acumula de año en año, si moja un material sensible como la madera o la lana mineral, o si escurre. La cantidad diaria y la posición de la interfaz dicen más que el sí/no.','Конденсат усередині конструкції — не автоматично провал. EN ISO 13788 припускає його, якщо вся волога випаровується того ж року і жоден матеріал тим часом не пошкоджено; саме це перевіряє річний баланс у звіті, щойно завантажено клімат. Провал — коли конденсат накопичується рік у рік, коли він змочує вологочутливий матеріал на кшталт деревини чи мінеральної вати або коли він стікає. Добова кількість і положення межі важать більше, ніж «так/ні».','Конденсат внутри конструкции — не автоматически провал. EN ISO 13788 допускает его, если вся влага испаряется в том же году и ни один материал тем временем не повреждён; именно это проверяет годовой баланс в отчёте, как только загружен климат. Провал — когда конденсат накапливается из года в год, когда он смачивает влагочувствительный материал вроде древесины или минеральной ваты или когда он стекает. Суточное количество и положение границы важнее, чем «да/нет».',"Kondensacja wewnątrz zespołu nie oznacza automatycznie awarii. Norma EN ISO 13788 dopuszcza taką sytuację, gdy cała ilość kondensatu wyparuje ponownie w ciągu tego samego roku, a żaden materiał nie ulegnie uszkodzeniu; jest to sprawdzane w rocznym bilansie w raporcie po załadowaniu danych klimatycznych. Awaria występuje, gdy kondensat gromadzi się z roku na rok, gdy zwilża materiał wrażliwy na wilgoć, taki jak drewno lub wełna mineralna, lub gdy spływy. Dzienna szybkość i położenie granicy faz mają większe znaczenie niż tak/nie."],

/* precedence: ?lang= -> localStorage.diagram_lang -> browser -> en.
   The first two are resolved by the shared bootstrap at the top of the file,
   which publishes the result as window.__diagramLang.                        */
function detectLang() {
  const codes = LANGS.map(l => l.code);
  let q = null;
  try { q = new URLSearchParams(location.search).get('lang'); } catch (e) {}
  if (q && codes.includes(String(q).slice(0, 2).toLowerCase())) return String(q).slice(0, 2).toLowerCase();
  try { const x = localStorage.getItem('diagram_site_lang'); if (codes.includes(x)) return x; } catch (e) {}
  try { const x = localStorage.getItem('diagram_lang'); if (codes.includes(x)) return x; } catch (e) {}
  const boot = String(window.__diagramLang || '').toLowerCase();
  if (codes.includes(boot)) return boot;
  for (const l of (navigator.languages || [navigator.language || 'en'])) {
    const s = String(l).toLowerCase();
    const base = s.split('-')[0];
    if (base === 'uk') return 'uk';
    if (codes.includes(base)) return base;
    if (base === 'be' || base === 'kk') return 'ru';
  }
  return 'en';
}
