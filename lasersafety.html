  "limitations": {
    "en": "Learning and pre-design aid; verify final designs with a qualified laser safety officer and the manufacturer's data. Exposure limits are the 2006/25/EC values (ICNIRP 1996/2000); ICNIRP 2013 and the current EN 60825-1 differ for some pulse regimes and extended sources. The laser class is indicative only: accessible emission limits are rebuilt from the exposure limits and public summary values, not from the norm text, and only measurement conditions 1 and 3 are approximated. Gaussian beam with linear far-field growth from the exit; no atmospheric attenuation, no specular or diffuse reflections, no scanning beams, no ultrashort pulses below 1 ns beyond the irradiance limits. The EN 207 scale number uses public summary tables and the beam cross-section of at least 1 mm; check the eyewear marking and the damage test of the manufacturer.",
    "uk": "Навчальний і передпроєктний засіб; остаточні рішення перевіряйте з кваліфікованим фахівцем з лазерної безпеки та за даними виробника. Граничні рівні — значення Директиви 2006/25/ЄС (ICNIRP 1996/2000); ICNIRP 2013 і чинна EN 60825-1 відрізняються для деяких імпульсних режимів і протяжних джерел. Клас лазера лише орієнтовний: граничні рівні доступного випромінювання відтворено з гранично допустимих рівнів і публічних зведених значень, а не з тексту стандарту, умови вимірювань 1 і 3 наближені. Гаусів пучок із лінійним розширенням у далекій зоні від виходу; без атмосферного ослаблення, без дзеркальних і дифузних відбиттів, без скануючих пучків, без ультракоротких імпульсів коротших за 1 нс поза межами рівнів опромінення. Шкальний номер EN 207 — за публічними зведеними таблицями й перерізом пучка не менше 1 мм; перевіряйте маркування окулярів і випробування виробника на стійкість.",
    "de": "Lern- und Vorplanungshilfe; endgültige Auslegungen mit einem fachkundigen Laserschutzbeauftragten und den Herstellerdaten prüfen. Grenzwerte sind die Werte der Richtlinie 2006/25/EG (ICNIRP 1996/2000); ICNIRP 2013 und die aktuelle EN 60825-1 weichen für einige Pulsbereiche und ausgedehnte Quellen ab. Die Laserklasse ist nur orientierend: Grenzwerte zugänglicher Strahlung sind aus den Expositionsgrenzwerten und öffentlichen Übersichtswerten abgeleitet, nicht aus dem Normtext, und nur die Messbedingungen 1 und 3 werden angenähert. Gaußstrahl mit linearer Fernfeldaufweitung ab Austritt; keine atmosphärische Dämpfung, keine gerichteten oder diffusen Reflexionen, keine Scanner, keine ultrakurzen Pulse unter 1 ns außer den Bestrahlungsstärkegrenzen. Die Schutzstufe nach EN 207 nutzt öffentliche Übersichtstabellen und einen Strahlquerschnitt von mindestens 1 mm; Kennzeichnung und Beständigkeitsprüfung des Herstellers prüfen.",

    "fr": "Aide à l’apprentissage et à l’avant-projet ; faites vérifier les conceptions définitives par un responsable de la sécurité laser qualifié et d’après les données du fabricant. Les valeurs limites sont celles de la directive 2006/25/CE (ICNIRP 1996/2000) ; l’ICNIRP 2013 et l’EN 60825-1 en vigueur diffèrent pour certains régimes d’impulsions et les sources étendues. La classe laser n’est qu’indicative : les limites d’émission accessible sont reconstruites à partir des valeurs limites d’exposition et de valeurs de synthèse publiques, pas du texte de la norme, et seules les conditions de mesure 1 et 3 sont approchées. Faisceau gaussien à croissance linéaire en champ lointain depuis la sortie ; pas d’atténuation atmosphérique, pas de réflexions spéculaires ou diffuses, pas de faisceaux balayés, pas d’impulsions ultracourtes sous 1 ns au-delà des limites d’éclairement. L’échelon EN 207 utilise des tableaux de synthèse publics et une section de faisceau d’au moins 1 mm ; vérifiez le marquage et l’essai de tenue du fabricant.",
    "es": "Ayuda didáctica y de anteproyecto; verifique los diseños definitivos con un responsable de seguridad láser cualificado y con los datos del fabricante. Los límites son los de la Directiva 2006/25/CE (ICNIRP 1996/2000); ICNIRP 2013 y la EN 60825-1 vigente difieren para algunos regímenes de pulsos y fuentes extensas. La clase láser es solo orientativa: los límites de emisión accesible se reconstruyen a partir de los límites de exposición y de valores de resumen públicos, no del texto de la norma, y solo se aproximan las condiciones de medida 1 y 3. Haz gaussiano con crecimiento lineal en campo lejano desde la salida; sin atenuación atmosférica, sin reflexiones especulares ni difusas, sin haces de barrido, sin pulsos ultracortos por debajo de 1 ns más allá de los límites de irradiancia. El número de escala EN 207 usa tablas de resumen públicas y una sección del haz de al menos 1 mm; compruebe el marcado y el ensayo de resistencia del fabricante.",
    "pl": "Narzędzie do nauki i projektowania wstępnego; ostateczne rozwiązania sprawdź z wykwalifikowanym inspektorem bezpieczeństwa laserowego i z danymi producenta. Wartości graniczne pochodzą z dyrektywy 2006/25/WE (ICNIRP 1996/2000); ICNIRP 2013 i obecna EN 60825-1 różnią się dla niektórych reżimów impulsowych i źródeł rozciągłych. Klasa lasera jest tylko orientacyjna: granice emisji dostępnej odtworzono z wartości granicznych ekspozycji i publicznych wartości zbiorczych, nie z tekstu normy, a przybliżono tylko warunki pomiaru 1 i 3. Wiązka gaussowska z liniowym rozszerzaniem w dalekim polu od wyjścia; bez tłumienia atmosferycznego, bez odbić zwierciadlanych i rozproszonych, bez wiązek skanujących, bez impulsów ultrakrótkich poniżej 1 ns poza granicami natężenia napromienienia. Liczba skali EN 207 korzysta z publicznych tabel zbiorczych i przekroju wiązki co najmniej 1 mm; sprawdź oznakowanie okularów i badanie odporności producenta."

<script>
(function () {
  'use strict';

  /* ============================================================ 1. the model */
  var TOOL = 'lasersafety';
  function lib() { return window.OptLaser || null; }
  function core() { return window.OptCore || null; }

  /* state: practical optics units (nm, W, mJ, ns, Hz, mm, mrad, s) — converted to SI for the engine */
  var DEFAULTS = {
    lambda: 532, mode: 'cw', P: 0.005, Q: 1, tau: 10, prf: 10,
    a: 1, phi: 1.2, def: '1/e',
    tsel: 'auto', T: 10, Tskin: 10, alpha: 0, intended: false,
    optics: 'none', M: 7, Dobj: 50, tauO: 1,
    laserId: '', site: '', assessor: ''
  };
  var state = JSON.parse(JSON.stringify(DEFAULTS));
  var last = null;

  function engineInput(s) {
    var o = { lambda: +s.lambda, mode: s.mode, a: s.a / 1000, phi: s.phi / 1000, def: s.def === '1/e2' ? '1/e2' : '1/e',
              alpha: (s.alpha || 0) / 1000, intended: !!s.intended, Tskin: s.Tskin > 0 ? +s.Tskin : 0 };
    if (s.mode === 'cw') o.P = +s.P;
    else { o.Q = s.Q / 1000; o.tau = s.tau * 1e-9; if (s.mode === 'rep') o.prf = +s.prf; }
    var t = s.tsel;
    o.T = t === 'auto' ? 0 : (t === 'custom' ? +s.T : +t);
    if (s.optics !== 'none') {
      var M = s.optics === 'b750' ? 7 : (s.optics === 'b1050' ? 10 : +s.M), D = s.optics === 'custom' ? s.Dobj / 1000 : 0.05;
      o.optics = { M: M, Dobj: D, tau: s.optics === 'custom' ? +s.tauO : 1 };
    }
    return o;
  }
  function solve(s) {
    var L = lib();
    if (!L) return { ok: false, errors: ['engine'] };
    try { return L.assess(engineInput(s)); } catch (e) { return { ok: false, errors: ['exception'], msg: String(e && e.message || e) }; }
  }

  /* ======================================================== 2. the interface */
  function T(en, uk, de, nl, fr, es, pl) { return { en: en, uk: uk, de: de, nl: nl, fr: fr, es: es, pl: pl }; }
  var LANGS = ['en', 'uk', 'de', 'nl', 'fr', 'es', 'pl'];
  /* a label whose text depends on the language (numbers with the local decimal comma) */
  function TF(fn) { var o = {}; LANGS.forEach(function (l) { o[l] = fn(l); }); return o; }
  function lang() { try { var l = window.DiagramUI && DiagramUI.domainLang ? DiagramUI.domainLang() : 'en'; return LANGS.indexOf(l) >= 0 ? l : 'en'; } catch (e) { return 'en'; } }
  var COMMA = { en: false, uk: true, de: true, nl: true, fr: true, es: true, pl: true };
  function nf(v, l, sig) {
    if (v == null || !isFinite(v)) return v === Infinity ? '∞' : '—';
    var s;
    if (v !== 0 && (Math.abs(v) >= 1e6 || Math.abs(v) < 1e-3)) {
      var e = Math.floor(Math.log(Math.abs(v)) / Math.LN10), m = v / Math.pow(10, e);
      s = (+m.toPrecision(sig || 3)) + '·10' + String(e).replace(/-/g, '⁻').replace(/\d/g, function (d) { return '⁰¹²³⁴⁵⁶⁷⁸⁹'[+d]; });
    } else s = String(+v.toPrecision(sig || 3));
    return COMMA[l] ? s.replace('.', ',') : s;
  }
  function len(m, l) {

                  'Клас орієнтовний: межі побудовано як ГДР Директиви/ICNIRP × обмежувальна апертура (принцип EN 60825-1:2001, з публічними зведеними значеннями), а не за таблицями AEL EN 60825-1:2014. Для серій імпульсів (C5) і 1250–1400 нм (C7) редакція 2014 року м’якша, тож тут клас може бути на один вищим (консервативно). Обов’язковим є клас на етикетці виробника.',

  var CLASS_WORD = T('Class', 'Клас', 'Klasse', 'Klasse', 'Classe', 'Clase', 'Klasa');

  var stage = null;
  function adoptStage(app) {
    stage = app.stages[0] || null;
    if (stage) stage.legend({ items: [{ label: S.lgEye, series: 0 }, { label: S.lgOpt, series: 1 }] });
  }
  var ui = null;

  function powerText(W, l) {
    if (W >= 1) return nf(W, l, 3) + ' W';
    if (W >= 1e-3) return nf(W * 1e3, l, 3) + ' mW';
    return nf(W * 1e6, l, 3) + ' µW';
  }
  function energyText(J, l) {
    if (J >= 1) return nf(J, l, 3) + ' J';
    if (J >= 1e-3) return nf(J * 1e3, l, 3) + ' mJ';
    return nf(J * 1e6, l, 3) + ' µJ';
  }
  function timeText(s, l) {
    if (s >= 1) return nf(s, l, 3) + ' s';
    if (s >= 1e-3) return nf(s * 1e3, l, 3) + ' ms';
    if (s >= 1e-6) return nf(s * 1e6, l, 3) + ' µs';
    return nf(s * 1e9, l, 3) + ' ns';
  }
  function limText(v, unit, l) { return nf(v, l, 3) + ' ' + (unit === 'J/m2' ? 'J/m²' : 'W/m²'); }

  /* the learning-assumption note belongs to an untouched example only (review R-8) */
  function laSig(s) { return JSON.stringify([+s.lambda, s.mode, +s.P, +s.Q, +s.tau, +s.prf, +s.a, +s.phi, s.def, s.optics]); }
  /* formula strings of the engine use the decimal point; comma languages get a comma (review R-5) */
  function fx(str, l) { return l === 'en' ? String(str) : String(str).replace(/(\d)\.(\d)/g, '$1,$2'); }
  /* only the correction factors that apply at this wavelength (review R-7) */
  function factorText(f, lam, l) {
    var parts = [];
    if (lam >= 700 && lam < 1400) parts.push('C_A ' + nf(f.CA, l, 3));
    if (lam >= 400 && lam < 600) parts.push('C_B ' + nf(f.CB, l, 3));
    if (lam >= 1050 && lam < 1400) parts.push('C_C ' + nf(f.CC, l, 3));
    if (lam >= 400 && lam < 1400) { parts.push('C_E ' + nf(f.CE, l, 3)); parts.push('T2 ' + nf(f.T2, l, 3) + ' s'); }
    if (f.T1 != null) parts.push('T1 ' + timeText(f.T1, l));
    return parts.length ? parts.join(' · ') : '—';
  }
  function computeView(s) {
    if (s.__la && s.__laSig && s.__laSig !== laSig(s)) { s.__la = false; s.__laSig = ''; }
    last = solve(s);
    if (stage) stage.schedule();
    var R = last;
    if (!R || !R.ok) {
      var msg = R && R.errors && R.errors[0] === 'engine' ? S.errEngine
        : TF(function (l) { return S.errInput[l] + (R && R.errors ? R.errors.map(function (k) { return k === 'duty' ? S.errDuty[l] : k; }).join(', ') : ''); });
      return { verdict: { tone: 'bad', text: msg }, tiles: [], notes: [] };
    }
    var inp = R.input, c = R.cls.cls, tiles = [], tables = [], notes = [], meters = [];
    var vis = inp.lambda >= 400 && inp.lambda <= 700;
    var od = R.OD > 0 ? Math.ceil(R.OD * 10 - 1e-9) / 10 : 0;
    var verdict = { tone: CLASS_TONE[c] || 'warn', text: TF(function (l) {
      var odw = (l === 'fr' || l === 'es') ? 'DO' : 'OD', nw = l === 'fr' ? 'DNRO' : 'NOHD';
      return CLASS_WORD[l] + ' ' + c + ' · ' + CLASS_TEXT[c][l] + ' · ' + nw + ' ' + len(R.NOHD, l) + (od > 0 ? ' · ' + odw + ' ≥ ' + nf(Math.ceil(R.OD), l, 2) : '');
    }) };
    var LG = lang();
    function str(v) { return v && typeof v === 'object' ? (v[LG] != null ? v[LG] : v.en) : v; }
    function tile(label, value, hint, learn, tone, headline) { tiles.push({ label: label, value: str(value), hint: str(hint || ''), learn: learn, tone: tone || null, headline: !!headline }); }
    tile(S.tClass, c, '', 'class', CLASS_TONE[c], true);
    tile(S.tNOHD, TF(function (l) { return len(R.NOHD, l); }), '', 'nohd', R.NOHD > 0 ? 'warn' : 'ok', true);
    if (R.ENOHD != null) tile(S.tENOHD, TF(function (l) { return len(R.ENOHD, l); }), TF(function (l) { return '×' + nf(R.opticsGain, l, 3); }), 'optics', R.ENOHD > 0 ? 'warn' : 'ok');
    tile(S.tOD, TF(function (l) { return R.OD > 0 ? nf(Math.ceil(R.OD * 10 - 1e-9) / 10, l, 3) : '0'; }), '', 'od', R.OD > 0 ? 'warn' : 'ok');
    tile(S.tMPE, TF(function (l) { return limText(R.mpeLimit, R.mpeUnit, l); }), TF(function (l) { return 't = ' + timeText(inp.mode === 'single' ? inp.tau : R.T, l); }), 'mpe');
    tile(S.tRatio, TF(function (l) { return '×' + nf(R.ratio, l, 3); }), '', 'mpe', R.ratio > 1 ? 'bad' : 'ok');
    tile(S.tNSHD, TF(function (l) { return len(R.NSHD, l); }), TF(function (l) { return S.tMPEskin[l] + ' ' + limText(R.mpeSkinLimit, R.mpeUnit, l); }), 'skin', R.NSHD > 0 ? 'warn' : 'ok');
    tile(S.tLB, R.lb.LB ? ((inp.mode === 'rep' && R.lbD && R.lbD.LB ? 'D LB' + R.lbD.LB + ' + ' : '') + R.lb.mode + ' LB' + R.lb.LB) : '—', '', 'lb');
    meters.push({ label: S.tRatio, ratio: Math.min(1.2, R.ratio > 0 ? Math.log(1 + R.ratio) / Math.log(1 + Math.max(1e-9, R.ratio)) * (R.ratio > 1 ? 1.2 : R.ratio) : 0),
                  text: '×' + nf(R.ratio, LG, 3) });

    /* MPE derivation */
    var f = R.factors, m = R.mpe, rows = [];
    function row(a, b, cc) { rows.push({ cells: [a, b, cc] }); }
    row(S.duration, TF(function (l) { return timeText(inp.mode === 'single' ? inp.tau : R.T, l); }), s.tsel === 'auto' ? S.tAuto : '');
    row(S.tMPE, TF(function (l) { return limText(m.value, m.unit, l); }), TF(function (l) { return S.rowTable[l] + ' ' + m.row + ': ' + fx(m.formula, l); }));
    row(S.factors, TF(function (l) { return factorText(f, inp.lambda, l); }), TF(function (l) { return S.tbl1[l] + ' 2.5'; }));

  /* "Use": take wavelength, power and beam from the shared source block (w0 = 1/e² waist radius, divergence = full 1/e² angle).

  function useSource(doc) {
    var L = lang(), src = doc && doc.source;
    if (!src || typeof src !== 'object') { showUse(S.useNone[L], 'warn'); return { ok: false, bad: ['source'] }; }
    var next = {}, bad = [], warn = [];
    var lam = +src.lambda_nm;
    if (src.lambda_nm != null) { if (inLim('lambda', lam)) next.lambda = lam; else bad.push('λ = ' + src.lambda_nm + ' nm'); }

  function renderStage(size, st) {
    var ctx = st.canvas(), w = size.w, h = size.h, coarse = size.density === 'coarse';
    var cs = getComputedStyle(document.documentElement);
    var muted = cs.getPropertyValue('--muted').trim() || '#888', lineC = cs.getPropertyValue('--line').trim() || '#ccc';
    var font = cs.getPropertyValue('--font').trim() || 'sans-serif';
    ctx.clearRect(0, 0, w, h);
    if (!last || !last.ok) return;
    var R = last, l = lang(), pts = R.curve, rmax = R.rmax;
    var Lm = coarse ? 46 : 58, Rm = 14, TOP = 40, B = coarse ? 36 : 44, pw = w - Lm - Rm, ph = h - TOP - B;
    if (pw < 40 || ph < 40) return;
    var ymax = 1, ymin = 0.01, i;
    for (i = 0; i < pts.length; i++) { ymax = Math.max(ymax, pts[i][1], pts[i][2] || 0); }
    ymax = Math.pow(10, Math.ceil(Math.log(ymax) / Math.LN10 + 1e-9));
    ymin = Math.min(0.1, Math.pow(10, Math.floor(Math.log(Math.max(1e-6, pts[pts.length - 1][1])) / Math.LN10)));
    var ly0 = Math.log(ymin) / Math.LN10, ly1 = Math.log(ymax) / Math.LN10;
    function X(z) { return Lm + z / rmax * pw; }
    function Y(v) { var lv = Math.log(Math.max(ymin, Math.min(ymax, v))) / Math.LN10; return TOP + ph - (lv - ly0) / (ly1 - ly0) * ph; }
    /* zone band above the plot */
    var col = DiagramUI.series(0), col1 = DiagramUI.series(1);
    ctx.font = (coarse ? 10 : 11) + 'px ' + font;
    function band(zEnd, y, c, label) {
      if (!(zEnd > 0)) return;
      ctx.globalAlpha = 0.18; ctx.fillStyle = c; ctx.fillRect(Lm, y, X(Math.min(zEnd, rmax)) - Lm, 12); ctx.globalAlpha = 1;
      ctx.strokeStyle = c; ctx.lineWidth = 1.5; ctx.strokeRect(Lm, y, X(Math.min(zEnd, rmax)) - Lm, 12);
      ctx.fillStyle = muted; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      var tx = label + ' ' + len(zEnd, l), xx = Math.min(X(Math.min(zEnd, rmax)) + 4, Lm + pw - ctx.measureText(tx).width);
      ctx.fillText(tx, Math.max(Lm + 2, xx), y + 6);
    }
    band(R.NOHD, 6, col, 'NOHD');
    if (R.ENOHD != null) band(R.ENOHD, 22, col1, 'ENOHD');
    /* axes */
    ctx.strokeStyle = muted; ctx.fillStyle = muted; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(Lm, TOP); ctx.lineTo(Lm, TOP + ph); ctx.lineTo(Lm + pw, TOP + ph); ctx.stroke();
    var xt = DiagramUI.ticks(0, rmax, pw, size.density) || [];
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (i = 0; i < xt.length; i++) { var px = X(xt[i]); if (xt[i] < 0 || xt[i] > rmax) continue; ctx.beginPath(); ctx.moveTo(px, TOP + ph); ctx.lineTo(px, TOP + ph + 4); ctx.stroke(); ctx.fillText(nf(xt[i], l, 3), px, TOP + ph + 6); }
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (var e = Math.ceil(ly0); e <= ly1; e++) { var py = Y(Math.pow(10, e)); ctx.beginPath(); ctx.moveTo(Lm - 4, py); ctx.lineTo(Lm, py); ctx.stroke(); ctx.fillText(nf(Math.pow(10, e), l, 2), Lm - 6, py); }
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(S.distance[l] + ', m', Lm + pw / 2, h - 2);
    ctx.save(); ctx.translate(coarse ? 11 : 13, TOP + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textBaseline = 'middle'; ctx.fillText('H/MPE', 0, 0); ctx.restore();
    /* MPE line */
    ctx.save(); ctx.beginPath(); ctx.rect(Lm, TOP, pw, ph); ctx.clip();
    ctx.strokeStyle = lineC; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(Lm, Y(1)); ctx.lineTo(Lm + pw, Y(1)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = muted; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText('MPE · ' + S.safe[l] + ' ↓', Lm + pw - 4, Y(1) - 2);
    function curve(k, c) {
      ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.beginPath(); var on = false;
      for (var j = 0; j < pts.length; j++) { var v = pts[j][k]; if (v == null) continue; var xx = X(pts[j][0]), yy = Y(v); if (!on) { ctx.moveTo(xx, yy); on = true; } else ctx.lineTo(xx, yy); }
      ctx.stroke();
    }
    curve(1, col);
    if (R.ENOHD != null && pts[0][2] != null) curve(2, col1);
    ctx.restore();
  }

                  'За межами NOHD пучок розширюється настільки, що опромінення, усереднене по зіниці, стає нижчим за МДР. Тут її знайдено для гаусового пучка, діаметр якого за рівнем 1/e зростає як a + φ·r; показано й класичну формулу за піком (√(4P/πМДР) − a)/φ, трохи консервативнішу для тонких пучків. Найбільше важить розбіжність: удвічі менша розбіжність — удвічі більша NOHD.',
                  'Jenseits des NOHD ist der Strahl so weit aufgeweitet, dass die über die Pupille gemittelte Bestrahlung unter der MZB liegt. Hier wird er für einen Gaußstrahl gelöst, dessen 1/e-Durchmesser als a + φ·r wächst; die klassische Spitzenformel (√(4P/πMZB) − a)/φ steht daneben und ist für dünne Strahlen etwas konservativer. Am meisten zählt die Divergenz: halbe Divergenz, doppelter NOHD.',
                  'Voorbij de NOHD is de bundel zo ver uitgedijd dat de over de pupil gemiddelde blootstelling onder de MPE ligt. Hier wordt die opgelost voor een gaussische bundel waarvan de 1/e-diameter groeit als a + φ·r; de klassieke piekformule (√(4P/πMPE) − a)/φ staat ernaast en is voor dunne bundels iets conservatiever. Divergentie telt het zwaarst: halve divergentie geeft een dubbele NOHD.',
                  'Au-delà de la DNRO le faisceau s’est assez élargi pour que l’exposition moyennée sur la pupille passe sous l’EMP. Elle est résolue ici pour un faisceau gaussien dont le diamètre à 1/e croît comme a + φ·r ; la formule classique au pic (√(4P/πEMP) − a)/φ est donnée aussi, un peu plus prudente pour les faisceaux fins. La divergence compte le plus : moitié moins de divergence, DNRO doublée.',
                  'Más allá de la NOHD el haz se ha abierto tanto que la exposición promediada sobre la pupila queda bajo la EMP. Aquí se resuelve para un haz gaussiano cuyo diámetro a 1/e crece como a + φ·r; también se muestra la fórmula clásica de pico (√(4P/πEMP) − a)/φ, algo más conservadora para haces finos. Lo que más pesa es la divergencia: la mitad de divergencia duplica la NOHD.',
                  'Poza NOHD wiązka rozszerza się tak, że ekspozycja uśredniona na źrenicy spada poniżej MDE. Tu wyznaczono ją dla wiązki gaussowskiej, której średnica 1/e rośnie jak a + φ·r; podano też klasyczny wzór szczytowy (√(4P/πMDE) − a)/φ, nieco ostrożniejszy dla cienkich wiązek. Najwięcej znaczy rozbieżność: połowa rozbieżności to podwójna NOHD.') },
        optics: { title: T('Binoculars and telescopes', 'Біноклі й телескопи', 'Ferngläser und Teleskope', 'Verrekijkers en telescopen', 'Jumelles et lunettes', 'Prismáticos y telescopios', 'Lornetki i teleskopy'),
          body: T('An optical aid collects the beam over its objective (50 mm instead of the 7 mm pupil) and delivers it into the eye. The gain is up to (D_obj/7 mm)², about M² for 7×50, so the extended NOHD grows roughly by the magnification. Glass optics block the far UV and the far infrared.',
                  'Оптичний прилад збирає пучок об’єктивом (50 мм замість зіниці 7 мм) і спрямовує в око. Підсилення — до (D_об/7 мм)², для 7×50 приблизно M², тож збільшена NOHD зростає приблизно в кратність збільшення. Скляна оптика не пропускає далекий УФ і далекий ІЧ.',
                  'Ein optisches Hilfsmittel sammelt den Strahl über sein Objektiv (50 mm statt 7 mm Pupille) und bringt ihn ins Auge. Der Gewinn beträgt bis zu (D_obj/7 mm)², beim 7×50 etwa M², sodass der erweiterte NOHD etwa um die Vergrößerung wächst. Glasoptik sperrt fernes UV und fernes IR.',
                  'Een optisch hulpmiddel vangt de bundel op met het objectief (50 mm in plaats van de pupil van 7 mm) en brengt hem in het oog. De winst is tot (D_obj/7 mm)², bij 7×50 ongeveer M², dus de uitgebreide NOHD groeit ruwweg met de vergroting. Glasoptiek houdt ver UV en ver IR tegen.',
                  'Une aide optique collecte le faisceau sur son objectif (50 mm au lieu de la pupille de 7 mm) et l’envoie dans l’œil. Le gain va jusqu’à (D_obj/7 mm)², environ M² pour des 7×50 : la DNRO étendue croît à peu près du grossissement. L’optique en verre arrête l’UV lointain et l’IR lointain.',
                  'Una ayuda óptica recoge el haz con su objetivo (50 mm en lugar de la pupila de 7 mm) y lo lleva al ojo. La ganancia llega a (D_obj/7 mm)², unas M² para 7×50, así que la NOHD ampliada crece aproximadamente según el aumento. La óptica de vidrio bloquea el UV lejano y el IR lejano.',
                  'Pomoc optyczna zbiera wiązkę obiektywem (50 mm zamiast 7 mm źrenicy) i kieruje ją do oka. Wzmocnienie sięga (D_ob/7 mm)², dla 7×50 ok. M², więc rozszerzona NOHD rośnie mniej więcej o powiększenie. Optyka szklana blokuje daleki UV i daleką podczerwień.') },
        od: { title: T('Optical density of goggles', 'Оптична густина окулярів', 'Optische Dichte der Schutzbrille', 'Optische dichtheid van de bril', 'Densité optique des lunettes', 'Densidad óptica de las gafas', 'Gęstość optyczna okularów'),
          body: T('OD = log₁₀(exposure at the exit / MPE), with the exposure averaged over the limiting aperture: OD 4 attenuates 10 000×. It is the worst case at the laser exit; the goggles must also withstand the beam (EN 207 damage test), which the scale number LB expresses.',
                  'OD = log₁₀(опромінення на виході / МДР), опромінення усереднене по обмежувальній апертурі: OD 4 послаблює в 10 000 разів. Це найгірший випадок на виході лазера; окуляри мають ще й витримувати пучок (випробування EN 207 на стійкість), що виражає шкальний номер LB.',
                  'OD = log₁₀(Bestrahlung am Austritt / MZB), gemittelt über die Grenzblende: OD 4 schwächt 10 000-fach. Das ist der ungünstigste Fall am Laseraustritt; die Brille muss dem Strahl außerdem standhalten (Beständigkeitsprüfung nach EN 207), was die Schutzstufe LB ausdrückt.',
                  'OD = log₁₀(blootstelling bij de uitgang / MPE), gemiddeld over de begrenzende opening: OD 4 verzwakt 10 000×. Dat is het slechtste geval bij de laseruitgang; de bril moet de bundel ook weerstaan (EN 207-bestendigheidstest), wat het schaalnummer LB uitdrukt.',
                  'DO = log₁₀(exposition en sortie / EMP), l’exposition étant moyennée sur le diaphragme limite : DO 4 atténue 10 000×. C’est le cas le plus défavorable en sortie du laser ; les lunettes doivent aussi résister au faisceau (essai de tenue EN 207), ce qu’exprime l’échelon LB.',
                  'DO = log₁₀(exposición a la salida / EMP), con la exposición promediada sobre la apertura limitadora: DO 4 atenúa 10 000×. Es el caso más desfavorable a la salida del láser; las gafas también deben resistir el haz (ensayo de resistencia EN 207), lo que expresa el número de escala LB.',
                  'OD = log₁₀(ekspozycja na wyjściu / MDE), uśredniona na aperturze ograniczającej: OD 4 osłabia 10 000×. To najgorszy przypadek na wyjściu lasera; okulary muszą też wytrzymać wiązkę (badanie odporności EN 207), co wyraża liczba skali LB.') },
        lb: { title: T('EN 207 scale number LB', 'Шкальний номер LB за EN 207', 'Schutzstufe LB nach EN 207', 'EN 207-schaalnummer LB', 'Échelon LB selon l’EN 207', 'Número de escala LB según EN 207', 'Liczba skali LB wg EN 207'),
          body: T('Eyewear is marked per wavelength and mode: D continuous, I pulsed 1 µs–0.25 s, R 1 ns–1 µs, M below 1 ns. Each LB step is a factor 10 in power or energy density, taken over the beam cross-section (not below 1 mm). For pulse trains the density is multiplied by N^0.25 (N pulses in 5 s). Values here use public summary tables.',
                  'Окуляри маркують для кожної довжини хвилі та режиму: D — безперервний, I — імпульси 1 мкс–0,25 с, R — 1 нс–1 мкс, M — коротші за 1 нс. Кожен крок LB — множник 10 у густині потужності чи енергії, узятій по перерізу пучка (не менше 1 мм). Для серій імпульсів густину множать на N^0,25 (N імпульсів за 5 с). Значення тут — за публічними зведеними таблицями.',
                  'Schutzbrillen werden je Wellenlänge und Betriebsart gekennzeichnet: D Dauerstrich, I Impuls 1 µs–0,25 s, R 1 ns–1 µs, M unter 1 ns. Jede LB-Stufe ist ein Faktor 10 in Leistungs- oder Energiedichte über den Strahlquerschnitt (mindestens 1 mm). Bei Pulsfolgen wird die Dichte mit N^0,25 multipliziert (N Pulse in 5 s). Werte hier aus öffentlichen Übersichtstabellen.',
                  'Brillen worden per golflengte en werking gemarkeerd: D continu, I gepulst 1 µs–0,25 s, R 1 ns–1 µs, M onder 1 ns. Elke LB-stap is een factor 10 in vermogens- of energiedichtheid over de bundeldoorsnede (minstens 1 mm). Bij pulstreinen wordt de dichtheid vermenigvuldigd met N^0,25 (N pulsen in 5 s). Waarden hier uit openbare samenvattingstabellen.',
                  'Les lunettes sont marquées par longueur d’onde et mode : D continu, I impulsions 1 µs–0,25 s, R 1 ns–1 µs, M sous 1 ns. Chaque échelon LB est un facteur 10 en densité de puissance ou d’énergie sur la section du faisceau (au moins 1 mm). Pour un train, la densité est multipliée par N^0,25 (N impulsions en 5 s). Valeurs tirées ici de tableaux de synthèse publics.',
                  'Las gafas se marcan por longitud de onda y modo: D continuo, I pulsado 1 µs–0,25 s, R 1 ns–1 µs, M por debajo de 1 ns. Cada escalón LB es un factor 10 en densidad de potencia o de energía sobre la sección del haz (no menos de 1 mm). En trenes de pulsos la densidad se multiplica por N^0,25 (N pulsos en 5 s). Valores tomados de tablas de resumen públicas.',
                  'Okulary znakuje się dla długości fali i trybu: D ciągły, I impulsy 1 µs–0,25 s, R 1 ns–1 µs, M poniżej 1 ns. Każdy stopień LB to czynnik 10 w gęstości mocy lub energii na przekroju wiązki (nie mniej niż 1 mm). Dla ciągów impulsów gęstość mnoży się przez N^0,25 (N impulsów w 5 s). Wartości z publicznych tabel zbiorczych.') },
        pulses: { title: T('Pulses: the three rules', 'Імпульси: три правила', 'Pulse: die drei Regeln', 'Pulsen: de drie regels', 'Impulsions : les trois règles', 'Pulsos: las tres reglas', 'Impulsy: trzy reguły'),
          body: T('For a pulse train (Directive Table 2.6): 1) each pulse below the single-pulse limit; 2) the whole train below the limit for its duration; 3) for thermal limits each pulse below the single-pulse limit × C_P = N^−0.25. Pulses within T_min (18 µs at 400–1050 nm) count as one pulse, and N in C_P is then the number of such groups. The most restrictive rule governs.',
                  'Для серії імпульсів (Директива, табл. 2.6): 1) кожен імпульс — нижче межі для одиночного; 2) уся серія — нижче межі для її тривалості; 3) для теплових меж кожен імпульс — нижче межі одиночного × C_P = N^−0,25. Імпульси в межах T_min (18 мкс на 400–1050 нм) рахують як один, і тоді N у C_P — кількість таких груп. Визначає найжорсткіше правило.',
                  'Für eine Pulsfolge (Richtlinie Tabelle 2.6): 1) jeder Puls unter dem Einzelpulsgrenzwert; 2) die ganze Folge unter dem Grenzwert für ihre Dauer; 3) bei thermischen Grenzwerten jeder Puls unter Einzelpulsgrenzwert × C_P = N^−0,25. Pulse innerhalb von T_min (18 µs bei 400–1050 nm) zählen als ein Puls; N in C_P ist dann die Anzahl solcher Gruppen. Die strengste Regel ist maßgebend.',
                  'Voor een pulstrein (richtlijn tabel 2.6): 1) elke puls onder de grens voor één puls; 2) de hele trein onder de grens voor zijn duur; 3) bij thermische grenzen elke puls onder de enkelpulsgrens × C_P = N^−0,25. Pulsen binnen T_min (18 µs bij 400–1050 nm) tellen als één puls; N in C_P is dan het aantal zulke groepen. De strengste regel is bepalend.',
                  'Pour un train (directive, tableau 2.6) : 1) chaque impulsion sous la limite d’une impulsion unique ; 2) le train entier sous la limite pour sa durée ; 3) pour les limites thermiques, chaque impulsion sous la limite unique × C_P = N^−0,25. Les impulsions comprises dans T_min (18 µs à 400–1050 nm) comptent pour une, et N dans C_P est alors le nombre de ces groupes. La règle la plus sévère s’applique.',
                  'Para un tren de pulsos (Directiva, tabla 2.6): 1) cada pulso bajo el límite de pulso único; 2) todo el tren bajo el límite para su duración; 3) en límites térmicos, cada pulso bajo el límite único × C_P = N^−0,25. Los pulsos dentro de T_min (18 µs a 400–1050 nm) cuentan como uno, y N en C_P es entonces el número de esos grupos. Manda la regla más restrictiva.',
                  'Dla ciągu impulsów (dyrektywa, tabela 2.6): 1) każdy impuls poniżej granicy dla impulsu pojedynczego; 2) cały ciąg poniżej granicy dla jego czasu; 3) dla granic termicznych każdy impuls poniżej granicy pojedynczej × C_P = N^−0,25. Impulsy w obrębie T_min (18 µs dla 400–1050 nm) liczą się jako jeden, a N w C_P to wtedy liczba takich grup. Decyduje najostrzejsza reguła.') },
        aversion: { title: T('Exposure duration', 'Тривалість опромінення', 'Expositionsdauer', 'Blootstellingsduur', 'Durée d’exposition', 'Duración de la exposición', 'Czas ekspozycji'),
          body: T('For accidental viewing of a visible beam, 0.25 s (the aversion response, including the blink) is the usual assumption; for invisible infrared there is no aversion, so 10 s (eye movements spread the image) is used; ultraviolet adds up over the working day (30 000 s). Choose a longer time for intentional viewing.',
                  'Для випадкового погляду у видимий пучок зазвичай беруть 0,25 с (захисна реакція з кліпанням); для невидимого ІЧ захисної реакції немає, тому беруть 10 с (рухи ока розмивають зображення); УФ накопичується за робочий день (30 000 с). Для навмисного спостереження оберіть довший час.',
                  'Für unbeabsichtigtes Hineinsehen in einen sichtbaren Strahl werden üblicherweise 0,25 s angenommen (Abwendungsreaktion mit Lidschluss); bei unsichtbarem IR gibt es keine Abwendung, daher 10 s (Augenbewegungen verwischen das Bild); UV summiert sich über den Arbeitstag (30 000 s). Für absichtliches Betrachten eine längere Zeit wählen.',
                  'Voor onbedoeld kijken in een zichtbare bundel wordt meestal 0,25 s aangenomen (afweerreactie met knipperen); bij onzichtbaar IR is er geen afweer, dus 10 s (oogbewegingen spreiden het beeld); UV telt op over de werkdag (30 000 s). Kies een langere tijd voor opzettelijk kijken.',
                  'Pour une vision accidentelle d’un faisceau visible, on retient 0,25 s (réflexe de défense avec clignement) ; pour l’IR invisible il n’y a pas de réflexe, d’où 10 s (les mouvements de l’œil étalent l’image) ; l’UV se cumule sur la journée (30 000 s). Choisissez plus long pour une vision volontaire.',
                  'Para la visión accidental de un haz visible se suele suponer 0,25 s (respuesta de aversión con parpadeo); en el IR invisible no hay aversión, así que se usan 10 s (los movimientos del ojo extienden la imagen); el UV se acumula durante la jornada (30 000 s). Elija un tiempo mayor para la observación intencionada.',
                  'Przy przypadkowym spojrzeniu w widzialną wiązkę przyjmuje się zwykle 0,25 s (reakcja obronna z mrugnięciem); dla niewidzialnej podczerwieni nie ma reakcji obronnej, więc 10 s (ruchy oka rozmywają obraz); UV sumuje się przez dzień pracy (30 000 s). Dla zamierzonej obserwacji wybierz dłuższy czas.') },
        skin: { title: T('Skin', 'Шкіра', 'Haut', 'Huid', 'Peau', 'Piel', 'Skóra'),
          body: T('Skin limits (Directive Table 2.4) are much higher than eye limits in the retinal range, but equal to them in the UV and beyond 1400 nm. They are averaged over 3.5 mm. Above about 0.5 W a beam also burns clothing and can ignite materials.',
                  'Межі для шкіри (Директива, табл. 2.4) значно вищі за межі для очей у сітківковому діапазоні, але дорівнюють їм в УФ і понад 1400 нм. Їх усереднюють по 3,5 мм. Понад приблизно 0,5 Вт пучок також пропалює одяг і може підпалити матеріали.',
                  'Die Hautgrenzwerte (Richtlinie Tabelle 2.4) liegen im Netzhautbereich weit über denen des Auges, im UV und über 1400 nm sind sie gleich. Gemittelt wird über 3,5 mm. Ab etwa 0,5 W verbrennt ein Strahl auch Kleidung und kann Materialien entzünden.',
                  'De huidgrenzen (richtlijn tabel 2.4) liggen in het netvliesbereik veel hoger dan die van het oog, maar zijn gelijk in het UV en boven 1400 nm. Ze worden gemiddeld over 3,5 mm. Boven ongeveer 0,5 W verbrandt een bundel ook kleding en kan hij materialen ontsteken.',
                  'Les limites cutanées (directive, tableau 2.4) sont bien plus élevées que celles de l’œil dans le domaine rétinien, mais égales dans l’UV et au-delà de 1400 nm. Elles sont moyennées sur 3,5 mm. Au-delà d’environ 0,5 W un faisceau brûle aussi les vêtements et peut enflammer des matériaux.',
                  'Los límites de la piel (Directiva, tabla 2.4) son muy superiores a los del ojo en el rango retiniano, pero iguales en el UV y por encima de 1400 nm. Se promedian sobre 3,5 mm. Por encima de unos 0,5 W un haz también quema la ropa y puede encender materiales.',
                  'Granice dla skóry (dyrektywa, tabela 2.4) są w zakresie siatkówkowym znacznie wyższe niż dla oka, ale w UV i powyżej 1400 nm są równe. Uśrednia się je na 3,5 mm. Powyżej ok. 0,5 W wiązka pali też odzież i może zapalić materiały.') },
        factors: { title: T('Correction factors and extended sources', 'Поправкові коефіцієнти і протяжні джерела', 'Korrekturfaktoren und ausgedehnte Quellen', 'Correctiefactoren en uitgebreide bronnen', 'Facteurs de correction et sources étendues', 'Factores de corrección y fuentes extensas', 'Współczynniki poprawkowe i źródła rozciągłe'),
          body: T('C_A raises the limit in the near infrared (less absorbed in the retina), C_C beyond 1150 nm, C_B in the blue–green photochemical limit. C_E > 1 only for extended sources (α > 1.5 mrad), e.g. a diffuse reflection seen close up; a collimated laser beam is a point source. Between 400 and 600 nm and beyond 10 s a small source switches from the thermal to the photochemical limit after T1 (note b of Table 2.3).',
                  'C_A підвищує межу в ближньому ІЧ (сітківка поглинає менше), C_C — понад 1150 нм, C_B — у синьо-зеленій фотохімічній межі. C_E > 1 лише для протяжних джерел (α > 1,5 мрад), напр. дифузного відбиття зблизька; колімований лазерний пучок — точкове джерело. Від 400 до 600 нм і довше 10 с мале джерело після T1 переходить від теплової до фотохімічної межі (примітка b табл. 2.3).',
                  'C_A erhöht den Grenzwert im nahen IR (geringere Absorption in der Netzhaut), C_C oberhalb 1150 nm, C_B den photochemischen Grenzwert im Blau-Grün. C_E > 1 nur bei ausgedehnten Quellen (α > 1,5 mrad), z. B. einer nah betrachteten diffusen Reflexion; ein kollimierter Laserstrahl ist eine Punktquelle. Zwischen 400 und 600 nm und über 10 s wechselt eine kleine Quelle nach T1 vom thermischen zum photochemischen Grenzwert (Anm. b zu Tabelle 2.3).',
                  'C_A verhoogt de grens in het nabij-infrarood (minder absorptie in het netvlies), C_C boven 1150 nm, C_B de fotochemische grens in het blauwgroen. C_E > 1 alleen voor uitgebreide bronnen (α > 1,5 mrad), bv. een diffuse reflectie van dichtbij; een gecollimeerde laserbundel is een puntbron. Tussen 400 en 600 nm en boven 10 s gaat een kleine bron na T1 over van de thermische naar de fotochemische grens (noot b bij tabel 2.3).',
                  'C_A relève la limite dans le proche IR (moins absorbé par la rétine), C_C au-delà de 1150 nm, C_B la limite photochimique dans le bleu-vert. C_E > 1 seulement pour les sources étendues (α > 1,5 mrad), p. ex. une réflexion diffuse vue de près ; un faisceau laser collimaté est une source ponctuelle. Entre 400 et 600 nm et au-delà de 10 s, une petite source passe après T1 de la limite thermique à la limite photochimique (note b du tableau 2.3).',
                  'C_A eleva el límite en el infrarrojo cercano (menor absorción en la retina), C_C por encima de 1150 nm, C_B el límite fotoquímico en el azul-verde. C_E > 1 solo para fuentes extensas (α > 1,5 mrad), p. ej. una reflexión difusa vista de cerca; un haz láser colimado es una fuente puntual. Entre 400 y 600 nm y más allá de 10 s una fuente pequeña pasa tras T1 del límite térmico al fotoquímico (nota b de la tabla 2.3).',
                  'C_A podnosi granicę w bliskiej podczerwieni (słabsza absorpcja w siatkówce), C_C powyżej 1150 nm, C_B granicę fotochemiczną w zakresie niebiesko-zielonym. C_E > 1 tylko dla źródeł rozciągłych (α > 1,5 mrad), np. odbicia rozproszonego oglądanego z bliska; skolimowana wiązka laserowa to źródło punktowe. Między 400 a 600 nm i powyżej 10 s małe źródło po T1 przechodzi z granicy termicznej na fotochemiczną (uwaga b do tabeli 2.3).') },
        'class': { title: T('Laser class (indicative)', 'Клас лазера (орієнтовно)', 'Laserklasse (orientierend)', 'Laserklasse (indicatief)', 'Classe laser (indicative)', 'Clase láser (orientativa)', 'Klasa lasera (orientacyjnie)'),
          body: T('The class compares the accessible emission with limits: class 1 ≈ MPE × pupil area over 100 s (0.39 mW at 500–700 nm, down to 39 µW in the blue at 400–450 nm, about 10 mW at 1550 nm); class 2 = 1 mW visible (0.25 s); 3R = 5× class 1 or 2; 3B = 0.5 W CW; above that class 4. “M” classes pass with the naked eye (7 mm at 100 mm) but fail through a 50 mm telescope at 2 m. This is a reconstruction for learning (the EN 60825-1:2001 construction; the 2014 edition is less strict for pulse trains and 1250–1400 nm); the binding class is set by the manufacturer under EN 60825-1.',
                  'Клас порівнює доступне випромінювання з межами: клас 1 ≈ МДР × площа зіниці за 100 с (0,39 мВт на 500–700 нм, до 39 мкВт у синьому на 400–450 нм, близько 10 мВт на 1550 нм); клас 2 = 1 мВт для видимого (0,25 с); 3R = 5× клас 1 чи 2; 3B = 0,5 Вт безперервно; вище — клас 4. Класи «M» проходять для неозброєного ока (7 мм на 100 мм), але не проходять через телескоп 50 мм на 2 м. Це навчальна реконструкція (принцип EN 60825-1:2001; редакція 2014 року м’якша для серій імпульсів і 1250–1400 нм); обов’язковий клас встановлює виробник за EN 60825-1.',
                  'Die Klasse vergleicht die zugängliche Strahlung mit Grenzwerten: Klasse 1 ≈ MZB × Pupillenfläche über 100 s (0,39 mW bei 500–700 nm, im Blauen bei 400–450 nm nur 39 µW, etwa 10 mW bei 1550 nm); Klasse 2 = 1 mW sichtbar (0,25 s); 3R = 5× Klasse 1 oder 2; 3B = 0,5 W Dauerstrich; darüber Klasse 4. „M“-Klassen bestehen mit bloßem Auge (7 mm in 100 mm), nicht aber durch ein 50-mm-Teleskop in 2 m. Dies ist eine Rekonstruktion zum Lernen (Konstruktion der EN 60825-1:2001; die Ausgabe 2014 ist für Pulsfolgen und 1250–1400 nm weniger streng); verbindlich klassifiziert der Hersteller nach EN 60825-1.',
                  'De klasse vergelijkt de toegankelijke straling met grenzen: klasse 1 ≈ MPE × pupiloppervlak over 100 s (0,39 mW bij 500–700 nm, in het blauw bij 400–450 nm maar 39 µW, ongeveer 10 mW bij 1550 nm); klasse 2 = 1 mW zichtbaar (0,25 s); 3R = 5× klasse 1 of 2; 3B = 0,5 W continu; daarboven klasse 4. „M”-klassen slagen met het blote oog (7 mm op 100 mm) maar niet door een telescoop van 50 mm op 2 m. Dit is een reconstructie om te leren (de constructie van EN 60825-1:2001; de uitgave 2014 is minder streng voor pulstreinen en 1250–1400 nm); de bindende klasse bepaalt de fabrikant volgens EN 60825-1.',
                  'La classe compare l’émission accessible aux limites : classe 1 ≈ EMP × surface de la pupille sur 100 s (0,39 mW à 500–700 nm, seulement 39 µW dans le bleu à 400–450 nm, environ 10 mW à 1550 nm) ; classe 2 = 1 mW visible (0,25 s) ; 3R = 5× classe 1 ou 2 ; 3B = 0,5 W en continu ; au-delà classe 4. Les classes « M » passent à l’œil nu (7 mm à 100 mm) mais pas à travers une lunette de 50 mm à 2 m. C’est une reconstruction pédagogique (construction de l’EN 60825-1:2001 ; l’édition 2014 est moins sévère pour les trains d’impulsions et 1250–1400 nm) ; la classe qui fait foi est fixée par le fabricant selon l’EN 60825-1.',
                  'La clase compara la emisión accesible con límites: clase 1 ≈ EMP × área de la pupila durante 100 s (0,39 mW a 500–700 nm, solo 39 µW en el azul a 400–450 nm, unos 10 mW a 1550 nm); clase 2 = 1 mW visible (0,25 s); 3R = 5× clase 1 o 2; 3B = 0,5 W continuo; por encima, clase 4. Las clases «M» pasan a simple vista (7 mm a 100 mm) pero no con un telescopio de 50 mm a 2 m. Es una reconstrucción didáctica (construcción de la EN 60825-1:2001; la edición 2014 es menos estricta para trenes de pulsos y 1250–1400 nm); la clase vinculante la fija el fabricante según la EN 60825-1.',
                  'Klasa porównuje emisję dostępną z granicami: klasa 1 ≈ MDE × pole źrenicy przez 100 s (0,39 mW dla 500–700 nm, w niebieskim przy 400–450 nm tylko 39 µW, ok. 10 mW przy 1550 nm); klasa 2 = 1 mW widzialne (0,25 s); 3R = 5× klasa 1 lub 2; 3B = 0,5 W ciągłe; powyżej klasa 4. Klasy „M” przechodzą dla gołego oka (7 mm w 100 mm), ale nie przez teleskop 50 mm w 2 m. To rekonstrukcja dydaktyczna (konstrukcja EN 60825-1:2001; wydanie 2014 jest łagodniejsze dla ciągów impulsów i 1250–1400 nm); wiążącą klasę nadaje producent wg EN 60825-1.') }
      },
      tour: [
        { topic: 'mpe', focus: '[data-dgu-field="f-lambda"]' },
        { topic: 'pulses', focus: '[data-dgu-field="f-mode"]' },
        { topic: 'nohd', focus: '[data-dgu-field="f-phi"]' },
        { topic: 'aversion', focus: '[data-dgu-field="f-tsel"]' },
        { topic: 'optics', focus: '[data-dgu-field="f-optics"]' },
        { topic: 'class', focus: '.dgu-verdict' }
      ]
    };
  }

  /* ======================================================= 3. the data layer */
  function buildRecord() {
    if (!last) return null;
    var inputs = {}, outputs = {}, units = {}, warnings = [];
    var U = { lambda: 'nm', P: 'W', Q: 'mJ', tau: 'ns', prf: 'Hz', a: 'mm', phi: 'mrad', T: 's', Tskin: 's', alpha: 'mrad', M: '-', Dobj: 'mm', tauO: '-' };
    ['laserId', 'site', 'assessor', 'lambda', 'mode'].forEach(function (k) { inputs[k] = state[k]; });
    if (state.mode === 'cw') inputs.P = state.P; else { inputs.Q = state.Q; inputs.tau = state.tau; if (state.mode === 'rep') inputs.prf = state.prf; }
    inputs.a = state.a; inputs.phi = state.phi; inputs.def = state.def; inputs.tsel = state.tsel;
    if (state.tsel === 'custom') inputs.T = state.T;
    inputs.Tskin = state.Tskin; inputs.alpha = state.alpha; inputs.optics = state.optics; inputs.intended = state.intended;
    Object.keys(inputs).forEach(function (k) { if (U[k]) units[k] = U[k]; });
    if (last.ok) {
      var R = last;
      outputs.class_indicative = R.cls.cls;
      outputs.T_eye = R.T; units.T_eye = 's';
      outputs.MPE_eye = R.mpeLimit; units.MPE_eye = R.mpeUnit;
      outputs.MPE_eye_row = 'Directive 2006/25/EC Annex II ' + R.mpe.row + ': ' + R.mpe.formula;
      outputs.MPE_skin = R.mpeSkinLimit; units.MPE_skin = R.mpeUnit;
      outputs.limiting_aperture = R.apEye * 1000; units.limiting_aperture = 'mm';
      outputs.exposure_exit_over_MPE = R.ratio; units.exposure_exit_over_MPE = '-';
      /* infinite distances (zero divergence) are written as "inf" — JSON has no Infinity (review R-13) */
      var dist = function (v) { return isFinite(v) ? v : 'inf'; };
      outputs.NOHD = dist(R.NOHD); units.NOHD = 'm';
      outputs.NOHD_classic = dist(R.NOHDclassic); units.NOHD_classic = 'm';
      if (R.ENOHD != null) { outputs.ENOHD = dist(R.ENOHD); units.ENOHD = 'm'; }
      outputs.skin_hazard_distance = dist(R.NSHD); units.skin_hazard_distance = 'm';
      if (!isFinite(R.NOHD) || !isFinite(R.NSHD)) warnings.push('Divergence 0: the beam does not spread, hazard distances are infinite ("inf").');
      if (R.NOHD === 0 && R.NOHDclassic > 0) warnings.push('NOHD_classic is the beam-centre peak formula (conservative upper bound); the aperture-averaged exposure is below the MPE at the exit, so NOHD = 0.');
      outputs.OD_required = R.OD; units.OD_required = '-';
      outputs.EN207 = R.lb.LB ? R.lb.mode + ' LB' + R.lb.LB : null;
      if (R.lbD && R.lbD.LB) outputs.EN207_average = 'D LB' + R.lbD.LB;
      if (R.train) { outputs.pulse_rule_governing = R.train.governing; outputs.pulse_count = R.train.N; }
      warnings.push('Laser class is indicative: Directive/ICNIRP MPE x limiting aperture (EN 60825-1:2001 construction, public summary values), not the AEL tables of EN 60825-1:2014; conservative for pulse trains (C5) and 1250-1400 nm (C7). Not a formal classification.');
      if (state.__la) warnings.push('Beam data of the example are typical values (learning assumption).');
    } else warnings.push('invalid input: ' + (last.errors || []).join(', '));
    return {
      inputs: inputs, outputs: outputs, units: units,
      model: {
        equations: ['MPE: Directive 2006/25/EC Annex II Tables 2.2-2.6 (ICNIRP 1996/2000)', 'NOHD: exposure averaged over the limiting aperture of a Gaussian beam d(r) = a + phi r equals the MPE; classic (sqrt(4P/(pi MPE)) - a)/phi',
                    'OD = log10(H_exit / MPE)', 'EN 207 LB from public summary tables (beam cross-section >= 1 mm, trains x N^0.25)', 'Indicative class: AEL rebuilt from MPE x limiting aperture (EN 60825-1:2001 construction, not the 2014 AEL tables), conditions 1 (50 mm at 2 m; UV/IR geometry a learning assumption) and 3 (7 mm at 100 mm)',
                    'Pulse trains: rule 1 with the aperture of the pulse duration, rules 2 and 3 with that of the exposure duration; pulses within T_min form one group, C_P = Ngroups^-0.25',
                    'UV-B 302.5-315 nm: between the 1-nm rows of Tables 2.2/2.3 the lower (more protective) row floor(lambda) is used'],
        ranges: ['180 nm - 1 mm', 'pulse duration >= 1e-13 s, exposure <= 30 000 s'],
        notes: ['state in nm, W, mJ, ns, Hz, mm, mrad, s; engine in SI', 'diameters and divergence at 1/e unless 1/e2 is chosen (divided by sqrt 2)']
      },
      warnings: warnings
    };
  }
  /* permalink / record import: known keys only, numbers within the field limits, enums checked (review R-14) */
  var ENUM = { mode: ['cw', 'single', 'rep'], def: ['1/e', '1/e2'], tsel: ['auto', '0.25', '10', '100', '30000', 'custom'], optics: ['none', 'b750', 'b1050', 'custom'] };
  function sanitize(o) {
    var out = {};
    if (!o || typeof o !== 'object' || Array.isArray(o)) return out;
    Object.keys(DEFAULTS).forEach(function (k) {
      if (!Object.prototype.hasOwnProperty.call(o, k)) return;
      var v = o[k];
      if (ENUM[k]) { if (ENUM[k].indexOf(String(v)) >= 0) out[k] = String(v); return; }
      if (LIM[k]) { v = typeof v === 'string' && v.trim() !== '' ? +v : v; if (inLim(k, v)) out[k] = v; return; }
      if (k === 'intended') { out[k] = v === true; return; }
      if (typeof v === 'string') out[k] = v.slice(0, 200);
    });
    if (o.__la === true && typeof o.__laSig === 'string' && o.__laSig.length < 400) { out.__la = true; out.__laSig = o.__laSig; }
    return out;
  }
  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: TOOL, file: 'lasersafety.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, sanitize(o)); last = solve(state); if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
