, "Calculadora de cribado para CCUS industrial en Europa: captura, transporte por tubería o barco y almacenamiento, con LCOC (EUR/t), plazo de recuperación, VAN y flujo de caja anual según escenarios de precio del EU ETS, CBAM y CCfD. Elija industria, país, escala y transporte, lea el veredicto y cambie al nivel Full para ver detalles financieros y gráficos.", "Kalkulator wstępnej oceny przemysłowego CCUS w Europie: wychwytywanie, transport rurociągiem lub statkiem i składowanie, z LCOC (EUR/t), okresem zwrotu, NPV i rocznymi przepływami pieniężnymi w scenariuszach cen EU ETS, CBAM i CCfD. Wybierz branżę, kraj, skalę i transport, odczytaj werdykt, a szczegóły finansowe i wykresy znajdziesz na poziomie Full.") },
industries: { title: T("Why industry matters", "Чому важлива галузь", "Warum die Branche zählt", "Waarom de sector ertoe doet", "Pourquoi le secteur compte", "Por qué importa la industria", "Dlaczego branża ma znaczenie"), body: T("Flue-gas CO2 concentration drives capture cost: cement ~20-25 %, NGCC ~4 %, while ammonia and ethanol streams are ~100 % CO2 and need only compression, no amine unit. Plant size, available waste heat and biogenic share (WtE, pulp, eligible for removal credits) also shift costs and revenues. CBAM exposure sets how fast free allocation phases out.", "Концентрація CO2 у димових газах визначає вартість уловлювання: цемент ~20-25 %, NGCC ~4 %, а потоки аміаку й етанолу майже чисті (~100 %) і потребують лише компресії без амінової установки. Також важать масштаб, відпрацьоване тепло, біогенна частка (WtE, целюлоза) для кредитів на видалення та охоплення CBAM, що прискорює скасування безкоштовних квот.", "Die CO2-Konzentration im Abgas bestimmt die Abscheidekosten: Zement ~20-25 %, GuD (NGCC) ~4 %, während Ammoniak- und Ethanolströme mit ~100 % nur verdichtet werden müssen und keine Aminanlage brauchen. Zudem zählen Anlagengröße, Abwärme, biogener Anteil (WtE, Zellstoff) für Entnahmezertifikate und die CBAM-Abdeckung, die den Wegfall der kostenlosen Zuteilung bestimmt.", "De CO2-concentratie in rookgas bepaalt de afvangkosten: cement ~20-25 %, NGCC ~4 %, terwijl ammoniak- en ethanolstromen van ~100 % alleen compressie nodig hebben, zonder amine-installatie. Ook schaal, restwarmte, biogeen aandeel (WtE, pulp) voor verwijderingscredits en CBAM-blootstelling, die de afbouw van gratis toewijzing bepaalt, spelen mee.", "La concentration de CO2 dans les fumées détermine le coût du captage : ciment ~20-25 %, CCGT ~4 %, tandis que les flux d'ammoniac et d'éthanol à ~100 % ne demandent qu'une compression, sans unité aux amines. La taille, la chaleur fatale, la part biogénique (UVE, pâte à papier) ouvrant droit aux crédits d'absorption et l'exposition au CBAM, qui fixe la suppression des quotas gratuits, comptent aussi.", "La concentración de CO2 en los gases de combustión determina el coste de captura: cemento ~20-25 %, NGCC ~4 %, mientras que las corrientes de amoníaco y etanol (~100 %) solo requieren compresión, sin unidad de aminas. También influyen la escala, el calor residual, la fracción biogénica (valorización energética de residuos, celulosa) para créditos de remoción y la exposición al CBAM, que marca la eliminación de la asignación gratuita.", "Stężenie CO2 w spalinach decyduje o koszcie wychwytu: cement ~20-25 %, NGCC ~4 %, a strumienie z produkcji amoniaku i etanolu (~100 %) wymagają tylko sprężania, bez instalacji aminowej. Liczą się też skala, ciepło odpadowe, udział biogeniczny (WtE, celuloza) dający kredyty za usuwanie oraz objęcie CBAM, od którego zależy wygaszanie bezpłatnych uprawnień.") },

scale: { title: T("Capture scale", "Масштаб уловлювання", "Abscheidungsmaßstab", "Afvangschaal", "Échelle de captage", "Escala de captura", "Skala wychwytu"), body: T("Captured CO2 in Mt/y is a major driver of unit cost. Capture CAPEX scales roughly with size^0.6-0.7, and pipeline cost per tonne falls sharply at high flow, so large sources are cheaper per tonne. Below about 0.1-0.2 Mt/y costs rise steeply, but clusters with shared transport and storage help small emitters.", "Вартість за тонну суттєво знижується зі зростанням обсягу: CAPEX уловлювання ~ розмір^0,6-0,7, трубопроводи дешевші при великих потоках. Нижче ~0,1-0,2 Мт/рік витрати різко зростають, а кластери допомагають малим джерелам.", "Die Kosten pro Tonne sinken stark mit der Größe: Abscheidungs-CAPEX ~ Größe^0,6-0,7, Pipelines sind bei hohem Durchfluss günstiger. Unter ~0,1-0,2 Mt/a steigen die Kosten steil, und Cluster helfen kleinen Emittenten.", "Kosten per ton dalen sterk met de schaal: afvang-CAPEX ~ omvang^0,6-0,7, pijpleidingen zijn goedkoper bij grote stromen. Onder ~0,1-0,2 Mt/j stijgen de kosten sterk, en clusters helpen kleine uitstoters.", "Le coût par tonne baisse fortement avec la taille : CAPEX de captage ~ taille^0,6-0,7, pipelines moins chers à fort débit. Sous ~0,1-0,2 Mt/an, les coûts grimpent, et les clusters aident les petits émetteurs.", "El coste por tonelada cae mucho con la escala: CAPEX de captura ~ tamaño^0,6-0,7 y las tuberías son más baratas con grandes caudales. Por debajo de ~0,1-0,2 Mt/año los costes suben bruscamente, y los clústeres ayudan a pequeños emisores.", "Koszt na tonę wyraźnie spada wraz ze skalą: CAPEX wychwytu ~ wielkość^0,6-0,7, rurociągi są tańsze przy dużych przepływach. Poniżej ~0,1-0,2 Mt/rok koszty gwałtownie rosną, a klastry pomagają małym emitentom.") },
transport: { title: T("Transport mode", "Вид транспорту", "Transportart", "Transportwijze", "Mode de transport", "Modo de transporte", "Rodzaj transportu"), body: T("Pipelines are CAPEX-heavy, with cost rising with distance and favouring large, steady flows. Ships need liquefaction (low pressure ~7-15 bar or medium pressure 15-18 bar) and terminals, but their cost is less distance-sensitive and suits small, remote emitters or long offshore routes. Break-even is typically several hundred km, depending on volume.", "Трубопровід — переважно CAPEX, його вартість зростає з відстанню, він вигідний для великих стабільних потоків. Судна потребують зрідження (~7-15 або 15-18 бар) і терміналів, але менш чутливі до відстані; точка беззбитковості — кілька сотень км.", "Pipelines sind CAPEX-lastig, ihre Kosten steigen mit der Distanz, und sie eignen sich für große, stetige Mengen. Schiffe brauchen Verflüssigung (~7-15 oder 15-18 bar) und Terminals, sind aber weniger distanzabhängig; der Break-even liegt bei einigen hundert km.", "Pijpleidingen zijn vooral CAPEX, hun kosten stijgen met de afstand en ze passen bij grote, constante stromen. Schepen vereisen vloeibaarmaking (~7-15 of 15-18 bar) en terminals, maar zijn minder afstandsgevoelig; het break-evenpunt ligt rond enkele honderden km.", "Le pipeline est surtout du CAPEX, son coût croît avec la distance et il favorise les gros débits stables. Le navire exige liquéfaction (~7-15 ou 15-18 bar) et terminaux, mais dépend moins de la distance ; le seuil de rentabilité se situe vers quelques centaines de km.", "La tubería es sobre todo CAPEX, su coste crece con la distancia y favorece flujos grandes y estables. El barco requiere licuefacción (~7-15 o 15-18 bar) y terminales, pero depende menos de la distancia; el punto de equilibrio ronda varios cientos de km.", "Rurociąg to głównie CAPEX, jego koszt rośnie z odległością i opłaca się przy dużych, stałych przepływach. Statek wymaga skraplania (~7-15 lub 15-18 bar) i terminali, ale mniej zależy od odległości; próg opłacalności to kilkaset km.") },

ets: { title: T("EU ETS price scenarios", "Сценарії цін EU ETS", "EU-ETS-Preisszenarien", "EU ETS-prijsscenario's", "Scénarios de prix EU ETS", "Escenarios de precio del EU ETS", "Scenariusze cen EU ETS"), body: T("Low, central and high EU ETS price paths are applied; the central path reaches about 145 EUR/t in 2030, 220 in 2040 and 300 in 2050 (a tool assumption, not a forecast). Stored fossil CO2 requires no allowance surrender, so avoided allowance cost is the main revenue. The Full level adds a price multiplier.", "Застосовуються низький, центральний і високий цінові сценарії; центральний сягає ~145 EUR/т у 2030, 220 у 2040 і 300 у 2050 (припущення інструмента, не прогноз). За збережений викопний CO2 квоти не здаються, тож уникнута вартість квот є основним доходом; рівень Full додає ціновий множник.", "Es gelten niedrige, zentrale und hohe Preispfade; zentral ca. 145 EUR/t 2030, 220 2040 und 300 2050 (Annahme des Tools, keine Prognose). Für gespeichertes fossiles CO2 werden keine Zertifikate abgegeben, daher sind vermiedene Zertifikatskosten der Haupterlös; die Stufe Full ergänzt einen Preismultiplikator.", "Er worden lage, centrale en hoge prijspaden gebruikt; centraal ca. 145 EUR/t in 2030, 220 in 2040 en 300 in 2050 (aanname van de tool, geen prognose). Voor opgeslagen fossiele CO2 hoeven geen rechten te worden ingeleverd, dus vermeden rechtenkosten zijn de belangrijkste opbrengst; het niveau Full voegt een prijsvermenigvuldiger toe.", "Trois trajectoires de prix sont utilisées (basse, centrale, haute) ; la centrale atteint ~145 EUR/t en 2030, 220 en 2040 et 300 en 2050 (hypothèse de l'outil, pas une prévision). Le CO2 fossile stocké ne donne pas lieu à restitution de quotas, le coût évité des quotas est donc le principal revenu ; le niveau Full ajoute un multiplicateur de prix.", "Se usan trayectorias de precio baja, central y alta; la central alcanza ~145 EUR/t en 2030, 220 en 2040 y 300 en 2050 (supuesto de la herramienta, no una previsión). El CO2 fósil almacenado no requiere entregar derechos, por lo que el coste evitado de derechos es el ingreso principal; el nivel Full añade un multiplicador de precio.", "Stosowane są niska, centralna i wysoka ścieżka cen; centralna osiąga ok. 145 EUR/t w 2030, 220 w 2040 i 300 w 2050 (założenie narzędzia, nie prognoza). Za składowany kopalny CO2 nie umarza się uprawnień, więc uniknięty koszt uprawnień jest głównym przychodem; poziom Full dodaje mnożnik ceny.") },
cbam: { title: T("CBAM and free allocation", "CBAM і безкоштовні квоти", "CBAM und kostenlose Zuteilung", "CBAM en gratis toewijzing", "CBAM et allocation gratuite", "CBAM y asignación gratuita", "CBAM i bezpłatne przydziały"), body: T("In CBAM sectors (cement, steel, aluminium, fertiliser/ammonia, hydrogen), free allocation phases out gradually from 2026 to 2034, so avoiding emissions becomes more valuable over time. Other sectors keep benchmark-based free allocation, assumed to decline. Free allocation does not change the marginal value of an avoided tonne, but it changes the site's cash position.", "У секторах CBAM (цемент, сталь, алюміній, добрива/аміак, водень) безкоштовні квоти поступово скасовуються у 2026-2034 рр., тож цінність уникнення викидів зростає. Інші сектори зберігають бенчмаркові квоти (з припущенням зниження); вони не змінюють граничну цінність уникнутої тонни, але впливають на грошову позицію об'єкта.", "In CBAM-Sektoren (Zement, Stahl, Aluminium, Dünger/Ammoniak, Wasserstoff) entfällt die kostenlose Zuteilung schrittweise 2026-2034, wodurch vermiedene Emissionen wertvoller werden. Andere Sektoren behalten eine benchmarkbasierte, als sinkend angenommene Zuteilung; sie ändert nicht den Grenzwert einer vermiedenen Tonne, wohl aber die Liquiditätslage des Standorts.", "In CBAM-sectoren (cement, staal, aluminium, kunstmest/ammoniak, waterstof) verdwijnt de gratis toewijzing geleidelijk in 2026-2034, waardoor vermeden emissies meer waard worden. Andere sectoren behouden benchmarkgebaseerde toewijzing (verondersteld dalend); die verandert de marginale waarde van een vermeden ton niet, maar wel de kaspositie van de locatie.", "Dans les secteurs CBAM (ciment, acier, aluminium, engrais/ammoniac, hydrogène), l'allocation gratuite disparaît progressivement entre 2026 et 2034, ce qui accroît la valeur des émissions évitées. Les autres secteurs conservent une allocation fondée sur des référentiels, supposée décroissante ; elle ne modifie pas la valeur marginale d'une tonne évitée, mais affecte la trésorerie du site.", "En los sectores CBAM (cemento, acero, aluminio, fertilizantes/amoníaco, hidrógeno), la asignación gratuita se elimina gradualmente entre 2026 y 2034, por lo que evitar emisiones vale cada vez más. Los demás sectores mantienen una asignación basada en referencias, supuestamente decreciente; no cambia el valor marginal de una tonelada evitada, pero sí la posición de caja de la planta.", "W sektorach CBAM (cement, stal, aluminium, nawozy/amoniak, wodór) bezpłatne przydziały są stopniowo wycofywane w latach 2026-2034, więc wartość unikniętych emisji rośnie. Pozostałe sektory zachowują przydziały oparte na wskaźnikach (zakładany spadek); nie zmieniają one krańcowej wartości unikniętej tony, ale wpływają na pozycję gotówkową zakładu.") },

ccfd: { title: T("Carbon Contract for Difference (CCfD)","Вуглецевий контракт на різницю (CCfD)","Carbon Contract for Difference (CCfD)","Carbon Contract for Difference (CCfD)","Contrat carbone pour différence (CCfD)","Contrato de carbono por diferencia (CCfD)","Kontrakt różnicowy na emisje (CCfD)"), body: T("The state pays strike price minus ETS price per tonne avoided, for a set term (default 15 years) and covered volume share. Here it is two-sided: the operator pays back if ETS exceeds the strike. This removes ETS price risk (e.g. Dutch SDE++, German Klimaschutzverträge, Danish CCUS tenders).","Держава сплачує різницю між страйк-ціною та ціною ETS за тонну уникнених викидів протягом заданого строку (типово 15 років) для покритої частки обсягу. Контракт двосторонній: якщо ціна ETS перевищує страйк-ціну, оператор повертає різницю.","Der Staat zahlt Strike-Preis minus ETS-Preis je vermiedener Tonne für eine feste Laufzeit (Standard 15 Jahre) und einen gedeckten Mengenanteil. Zweiseitig: Liegt der ETS-Preis über dem Strike, zahlt der Betreiber zurück.","De overheid betaalt de strikeprijs min de ETS-prijs per vermeden ton, voor een vaste looptijd (standaard 15 jaar) en een gedekt volumeaandeel. Tweezijdig: ligt de ETS-prijs boven de strikeprijs, dan betaalt de exploitant terug.","L'État verse le prix d'exercice moins le prix ETS par tonne évitée, sur une durée fixée (15 ans par défaut) et une part de volume couverte. Contrat bilatéral : si l'ETS dépasse le prix d'exercice, l'exploitant rembourse la différence.","El Estado paga el precio de ejercicio menos el precio ETS por tonelada evitada, durante un plazo fijo (15 años por defecto) y una cuota de volumen cubierta. Es bidireccional: si el ETS supera el precio de ejercicio, el operador devuelve la diferencia.","Państwo wypłaca różnicę między ceną wykonania a ceną ETS za tonę unikniętej emisji przez określony okres (domyślnie 15 lat) dla objętej części wolumenu. Kontrakt dwustronny: gdy cena ETS przekracza cenę wykonania, operator zwraca różnicę.") },
grants: { title: T("CAPEX grants","Гранти на CAPEX","CAPEX-Zuschüsse","CAPEX-subsidies","Subventions CAPEX","Subvenciones al CAPEX","Dotacje CAPEX"), body: T("Grants such as the EU Innovation Fund, CEF or national schemes are entered as a share of CAPEX paid during construction. They cut the upfront outlay and shorten payback but do not cover running costs. Grants and CCfD may be combined, subject to state-aid rules.","Гранти (Інноваційний фонд ЄС, CEF, національні програми) задаються як частка CAPEX, що виплачується під час будівництва. Вони зменшують початкові витрати й скорочують строк окупності, але не покривають операційні витрати.","Zuschüsse (EU-Innovationsfonds, CEF, nationale Programme) werden als Anteil des CAPEX erfasst, ausgezahlt während der Bauphase. Sie senken die Anfangsinvestition und verkürzen die Amortisation, decken aber keine Betriebskosten.","Subsidies (EU-Innovatiefonds, CEF, nationale regelingen) worden ingevoerd als aandeel van de CAPEX, uitbetaald tijdens de bouw. Ze verlagen de initiële investering en verkorten de terugverdientijd, maar dekken geen operationele kosten.","Les subventions (Fonds pour l'innovation de l'UE, MIE/CEF, dispositifs nationaux) sont saisies en part du CAPEX versée pendant la construction. Elles réduisent l'investissement initial et le délai de retour, sans couvrir les coûts d'exploitation.","Las subvenciones (Fondo de Innovación de la UE, CEF, programas nacionales) se introducen como porcentaje del CAPEX pagado durante la construcción. Reducen la inversión inicial y acortan el plazo de recuperación, pero no cubren los costes operativos.","Dotacje (Fundusz Innowacyjny UE, CEF, programy krajowe) wprowadza się jako udział CAPEX wypłacany w trakcie budowy. Zmniejszają nakłady początkowe i skracają okres zwrotu, ale nie pokrywają kosztów operacyjnych.") },

removal: { title: T("Carbon removal credits","Кредити за вилучення вуглецю","Zertifikate für CO2-Entnahme","Koolstofverwijderingscredits","Crédits de retrait de carbone","Créditos de remoción de carbono","Jednostki usuwania CO2"), body: T("Biogenic CO2 from waste-to-energy, pulp or bioethanol is outside ETS surrender, so storing it avoids no allowances. It can instead earn carbon removal credits via EU CRCF certification, voluntary markets or Nordic state purchase schemes. Enter a removal credit price per tonne of biogenic CO2 stored; prices remain uncertain.","Біогенний CO2 не підпадає під здачу квот ETS, тому його зберігання не дає цінності уникнених квот. Натомість він може генерувати кредити за вилучення (EU CRCF, добровільний ринок, північні державні програми); введіть ціну за тонну, ціни невизначені.","Biogenes CO2 unterliegt nicht der ETS-Abgabepflicht, daher bringt seine Speicherung keinen Zertifikatswert. Stattdessen sind Entnahmezertifikate möglich (EU CRCF, freiwilliger Markt, nordische Ankaufprogramme); Preis pro Tonne eingeben, Preise sind unsicher.","Biogene CO2 valt niet onder de ETS-inleverplicht, dus opslag levert geen vermeden emissierechten op. Wel kan het verwijderingscredits opleveren (EU CRCF, vrijwillige markt, Noordse staatsaankoop); voer een prijs per ton in, prijzen zijn onzeker.","Le CO2 biogénique n'est pas soumis à la restitution de quotas ETS : son stockage n'évite aucun quota. Il peut générer des crédits de retrait (certification EU CRCF, marché volontaire, achats publics nordiques) ; saisissez un prix par tonne, encore incertain.","El CO2 biogénico no está sujeto a la entrega de derechos del ETS, por lo que almacenarlo no evita derechos. Puede generar créditos de remoción (EU CRCF, mercado voluntario, compras estatales nórdicas); introduzca un precio por tonelada, aún incierto.","Biogeniczny CO2 nie podlega umarzaniu uprawnień EU ETS, więc jego składowanie nie daje wartości unikniętych uprawnień. Może natomiast generować jednostki usunięć (EU CRCF, rynek dobrowolny, nordyckie programy zakupu); podaj cenę za tonę, ceny są niepewne.") },
lcoc: { title: T("Levelised cost of CO2 (LCOC)","Нормована вартість CO2 (LCOC)","Gestehungskosten pro Tonne CO2 (LCOC)","Genivelleerde CO2-kosten (LCOC)","Coût actualisé du CO2 (LCOC)","Coste nivelado del CO2 (LCOC)","Uśredniony koszt CO2 (LCOC)"), body: T("Annualised CAPEX (via capital recovery factor) plus fixed O&M, energy and transport and storage fees, divided by annual tonnes. Cost per tonne avoided exceeds cost per tonne stored, because capture energy itself emits CO2 and fewer tonnes are avoided. Compare with the ETS price to judge viability.","Річний CAPEX (через коефіцієнт повернення капіталу) плюс фіксовані O&M, енергія та плата за транспорт і зберігання, поділені на тонни. Вартість за уникнену тонну вища, ніж за збережену; порівняйте з ціною ETS.","Annualisierter CAPEX (Kapitalwiedergewinnungsfaktor) plus fixe O&M-, Energie- sowie Transport- und Speicherkosten, geteilt durch Tonnen. Kosten pro vermiedener Tonne liegen über denen pro gespeicherter Tonne; mit dem ETS-Preis vergleichen.","Geannualiseerde CAPEX (kapitaalterugwinningsfactor) plus vaste O&M, energie en transport- en opslagkosten, gedeeld door tonnen. Kosten per vermeden ton liggen hoger dan per opgeslagen ton; vergelijk met de ETS-prijs.","CAPEX annualisé (facteur de recouvrement du capital) plus O&M fixes, énergie et frais de transport et stockage, divisés par les tonnes. Le coût par tonne évitée dépasse celui par tonne stockée ; comparez au prix ETS.","CAPEX anualizado (factor de recuperación de capital) más O&M fijo, energía y tarifas de transporte y almacenamiento, dividido por las toneladas. El coste por tonelada evitada supera al de tonelada almacenada; compárelo con el precio ETS.","Zannualizowany CAPEX (współczynnik odzysku kapitału) plus stałe O&M, energia oraz opłaty za transport i składowanie, podzielone przez tony. Koszt na tonę unikniętą jest wyższy niż na tonę składowaną; porównaj z ceną ETS.") },

payback: { title: T("Payback period", "Термін окупності", "Amortisationszeit", "Terugverdientijd", "Temps de retour", "Periodo de retorno", "Okres zwrotu"), body: T("Simple payback is the first year cumulative undiscounted cash flow from construction start turns positive; discounted payback applies the discount rate. No payback: avoided ETS costs, CCfD and removal credits never recover CAPEX and running costs within the lifetime.", "Проста окупність — перший рік, коли накопичений недисконтований грошовий потік від початку будівництва стає додатним; дисконтована окупність враховує ставку дисконтування. Відсутність окупності означає, що доходи (уникнуті витрати ETS, CCfD, кредити за видалення) не покривають CAPEX і операційні витрати за строк служби.", "Einfache Amortisation: erstes Jahr, in dem der kumulierte undiskontierte Cashflow ab Baubeginn positiv wird; die diskontierte Variante nutzt den Diskontsatz. Keine Amortisation heißt, dass Erlöse (vermiedene ETS-Kosten, CCfD, Entnahmezertifikate) CAPEX und Betriebskosten innerhalb der Laufzeit nie decken.", "Eenvoudige terugverdientijd: eerste jaar waarin de cumulatieve ongedisconteerde kasstroom vanaf de start van de bouw positief wordt; de verdisconteerde variant gebruikt de disconteringsvoet. Geen terugverdientijd betekent dat opbrengsten (vermeden ETS-kosten, CCfD, verwijderingscredits) CAPEX en bedrijfskosten binnen de levensduur nooit terugverdienen.", "Retour simple : première année où le flux de trésorerie cumulé non actualisé, depuis le début de la construction, devient positif ; le retour actualisé applique le taux d'actualisation. Pas de retour signifie que les revenus (coûts ETS évités, CCfD, crédits de retrait) ne couvrent jamais le CAPEX et les coûts d'exploitation sur la durée de vie.", "Retorno simple: primer año en que el flujo de caja acumulado sin descontar, desde el inicio de la construcción, se vuelve positivo; el retorno descontado aplica la tasa de descuento. Sin retorno significa que los ingresos (costes ETS evitados, CCfD, créditos de remoción) nunca recuperan el CAPEX y los costes operativos durante la vida útil.", "Prosty okres zwrotu to pierwszy rok, w którym skumulowany niezdyskontowany przepływ pieniężny od początku budowy staje się dodatni; zdyskontowany okres zwrotu uwzględnia stopę dyskontową. Brak zwrotu oznacza, że przychody (uniknięte koszty ETS, CCfD, kredyty za usuwanie) nie pokrywają CAPEX i kosztów operacyjnych w okresie eksploatacji.") },
npv: { title: T("Net present value (NPV) and IRR", "Чиста приведена вартість (NPV) та IRR", "Kapitalwert (NPV) und IRR", "Netto contante waarde (NPV) en IRR", "Valeur actuelle nette (VAN) et TRI", "Valor actual neto (VAN) y TIR", "Wartość bieżąca netto (NPV) i IRR"), body: T("NPV discounts yearly cash flows over construction plus economic life at the discount rate (default 8 %); a positive value means the project beats the required return. IRR is the discount rate at which NPV equals zero.", "NPV — сума щорічних грошових потоків за період будівництва та економічного життя, дисконтованих за ставкою (типово 8 %); додатна NPV означає, що проєкт перевищує необхідну дохідність. IRR — ставка, за якої NPV = 0.", "Der NPV diskontiert jährliche Cashflows über Bau- und Nutzungsdauer mit dem Diskontsatz (Standard 8 %); ein positiver Wert bedeutet, dass das Projekt die geforderte Rendite übertrifft. Der IRR ist der Zinssatz, bei dem NPV = 0.", "De NPV verdisconteert jaarlijkse kasstromen over bouw- en economische levensduur tegen de disconteringsvoet (standaard 8 %); positief betekent dat het project het vereiste rendement overtreft. De IRR is de voet waarbij NPV = 0.", "La VAN actualise les flux annuels sur la construction et la durée de vie économique au taux d'actualisation (8 % par défaut) ; une VAN positive signifie que le projet dépasse le rendement exigé. Le TRI est le taux pour lequel VAN = 0.", "El VAN descuenta los flujos anuales durante la construcción y la vida económica a la tasa de descuento (8 % por defecto); un VAN positivo indica que el proyecto supera la rentabilidad exigida. La TIR es la tasa a la que VAN = 0.", "NPV dyskontuje roczne przepływy pieniężne w okresie budowy i życia ekonomicznego według stopy dyskontowej (domyślnie 8 %); dodatnia NPV oznacza, że projekt przekracza wymaganą stopę zwrotu. IRR to stopa, przy której NPV = 0.") },
avoided: { title: T("Captured vs stored vs avoided CO2","Уловлений, захоронений та уникнутий CO2","Abgeschiedenes vs. gespeichertes vs. vermiedenes CO2","Afgevangen vs opgeslagen vs vermeden CO2","CO2 capté, stocké et évité","CO2 capturado, almacenado y evitado","CO2 wychwycony, składowany i uniknięty"), body: T("Stored = captured minus transport losses (ship boil-off/venting). Climate tonnes are smaller: capture, compression and transport use energy, and on-site gas combustion and purchased grid electricity emit CO2 (country grid factor). Three bases are reported (see topic EUR/t metric basis): IEAGHG avoided (stored minus all energy CO2), EU ETS reduction (fossil stored minus on-site gas CO2), CRCF net removal (biogenic stored minus associated emissions). For mixed fossil/biogenic sources such as waste-to-energy they differ strongly: compare EUR/t only on the same basis. LCOC per t stored is always lowest and not a climate metric.","Захоронений = уловлений мінус втрати при транспортуванні (випаровування/скидання на суднах). Кліматичні тонни менші: уловлення, компримування та транспортування споживають енергію, а спалювання газу на майданчику й закуплена електроенергія з мережі викидають CO2 (коефіцієнт мережі країни). Інструмент показує три бази (див. тему База метрики EUR/т): IEAGHG уникнутий (захоронений мінус увесь енергетичний CO2), скорочення за EU ETS (викопний захоронений мінус CO2 від газу на майданчику), чисте видалення за CRCF (біогенний захоронений мінус пов’язані викиди). Для змішаних викопно-біогенних джерел, як-от сміттєспалювальні ТЕС, вони суттєво різняться: порівнюйте EUR/т лише на одній базі. LCOC на т захороненого завжди найнижчий і не є кліматичним показником.","Gespeichert = abgeschieden minus Transportverluste (Boil-off/Venting beim Schiff). Die klimawirksamen Tonnen sind kleiner: Abscheidung, Verdichtung und Transport verbrauchen Energie, und Gasverbrennung vor Ort sowie zugekaufter Netzstrom emittieren CO2 (länderspezifischer Netzfaktor). Das Tool weist drei Bezugsbasen aus (siehe Thema EUR/t-Bezugsbasis): IEAGHG vermieden (gespeichert minus gesamtes Energie-CO2), EU-ETS-Minderung (fossil gespeichert minus CO2 aus Gas vor Ort), CRCF-Nettoentnahme (biogen gespeichert minus zugehörige Emissionen). Bei gemischt fossil/biogenen Quellen wie Müllverbrennung weichen sie stark ab: EUR/t nur auf gleicher Basis vergleichen. LCOC je t gespeichert ist immer der niedrigste Wert und keine Klimakennzahl.","Opgeslagen = afgevangen min transportverliezen (boil-off/venting bij scheepstransport). De klimaattonnen zijn kleiner: afvang, compressie en transport verbruiken energie, en gasverbranding ter plaatse en ingekochte netstroom stoten CO2 uit (netfactor per land). De tool rapporteert drie grondslagen (zie onderwerp EUR/t-grondslag): IEAGHG vermeden (opgeslagen min alle energie-CO2), EU ETS-reductie (fossiel opgeslagen min CO2 van gas ter plaatse), CRCF netto verwijdering (biogeen opgeslagen min bijbehorende emissies). Bij gemengde fossiel/biogene bronnen zoals afvalverbranding verschillen ze sterk: vergelijk EUR/t alleen op dezelfde grondslag. LCOC per t opgeslagen is altijd het laagste cijfer en geen klimaatmaatstaf.","Stocké = capté moins les pertes de transport (boil-off/dégazage des navires). Les tonnes climatiques sont plus faibles : captage, compression et transport consomment de l’énergie, et la combustion de gaz sur site et l’électricité achetée au réseau émettent du CO2 (facteur réseau du pays). L’outil présente trois bases (voir le sujet Base de la métrique EUR/t) : IEAGHG évité (stocké moins tout le CO2 énergétique), réduction EU ETS (fossile stocké moins le CO2 du gaz sur site), absorption nette CRCF (biogénique stocké moins les émissions associées). Pour les sources mixtes fossiles/biogéniques comme l’incinération des déchets, elles diffèrent fortement : comparez les EUR/t uniquement sur la même base. Le LCOC par t stockée est toujours le chiffre le plus bas et n’est pas un indicateur climatique.","Almacenado = capturado menos las pérdidas de transporte (boil-off/venteo en buques). Las toneladas climáticas son menores: la captura, la compresión y el transporte consumen energía, y la combustión de gas in situ y la electricidad comprada a la red emiten CO2 (factor de red del país). La herramienta ofrece tres bases (ver tema Base de la métrica EUR/t): IEAGHG evitado (almacenado menos todo el CO2 energético), reducción EU ETS (fósil almacenado menos el CO2 del gas in situ), absorción neta CRCF (biogénico almacenado menos las emisiones asociadas). En fuentes mixtas fósil/biogénicas como la valorización energética de residuos difieren mucho: compare EUR/t solo sobre la misma base. El LCOC por t almacenada es siempre la cifra más baja y no es una métrica climática.","Składowany = wychwycony minus straty w transporcie (odparowanie/odpowietrzanie na statkach). Tony klimatyczne są mniejsze: wychwyt, sprężanie i transport zużywają energię, a spalanie gazu na miejscu i zakupiona energia z sieci emitują CO2 (krajowy wskaźnik sieci). Narzędzie podaje trzy podstawy (zob. temat Podstawa metryki EUR/t): IEAGHG uniknięty (składowany minus całe CO2 z energii), redukcja EU ETS (kopalny składowany minus CO2 z gazu na miejscu), usunięcie netto CRCF (biogeniczny składowany minus emisje powiązane). Dla mieszanych źródeł kopalno-biogenicznych, takich jak spalarnie odpadów, różnią się one znacznie: porównuj EUR/t tylko na tej samej podstawie. LCOC na t składowanego jest zawsze najniższy i nie jest wskaźnikiem klimatycznym.") },

method: { title: T("EUR/t metric basis","Основа метрики EUR/t","Bezugsbasis der EUR/t-Kennzahl","Basis van de EUR/t-maatstaf","Base de la métrique EUR/t","Base de la métrica EUR/t","Podstawa wskaźnika EUR/t"), body: T("Indirect = on-site gas CO2 + purchased grid electricity CO2 for capture, compression, transport. IEAGHG (Rubin et al. 2015): avoided = stored - indirect, fossil and biogenic; compares technologies and literature. EU ETS (MRR 2018/2066, Art. 38(5) biomass EF zero, Art. 49): reduction = fossil stored - on-site gas CO2, electricity outside ETS; EUR/t = break-even allowance price for ETS and CCfD cash. CRCF (Reg. 2024/3012, BioCCS): net removal = biogenic stored - associated emissions, by default all indirect, pro rata only where allowed; for removal credits. Auto: CRCF if biogenic CO2, else IEAGHG; CRCF without biogenic CO2 falls back to IEAGHG with warning. Full: all three side by side.","Непрямі = CO2 від спалювання газу на майданчику + CO2 закупленої мережевої електроенергії для уловлювання, стиснення, транспортування. IEAGHG (Rubin et al. 2015): уникнуто = збережено - непрямі, викопний і біогенний; для порівняння технологій і літератури. EU ETS (MRR 2018/2066, ст. 38(5) нульовий EF біомаси, ст. 49): скорочення = збережений викопний - CO2 газу на майданчику, електроенергія поза ETS; EUR/t = беззбиткова ціна квоти для ETS і CCfD. CRCF (Reg. 2024/3012, BioCCS): чисте вилучення = збережений біогенний - пов’язані викиди, типово всі непрямі, пропорційно лише де дозволено; для кредитів вилучення. Auto: CRCF за наявності біогенного CO2, інакше IEAGHG; CRCF без біогенного CO2 переходить на IEAGHG з попередженням. Full: усі три поруч.","Indirekt = CO2 aus Gasverbrennung vor Ort + CO2 aus zugekauftem Netzstrom für Abscheidung, Verdichtung, Transport. IEAGHG (Rubin et al. 2015): vermieden = gespeichert - indirekt, fossil und biogen; zum Vergleich von Technologien und Literatur. EU ETS (MRR 2018/2066, Art. 38(5) Biomasse-EF null, Art. 49): Minderung = fossil gespeichert - Gas-CO2 vor Ort, Strom außerhalb des ETS; EUR/t = Break-even-Zertifikatspreis für ETS- und CCfD-Zahlungen. CRCF (VO 2024/3012, BioCCS): Nettoentnahme = biogen gespeichert - zugehörige Emissionen, standardmäßig alle indirekten, anteilig nur wo zulässig; für Entnahmezertifikate. Auto: CRCF bei biogenem CO2, sonst IEAGHG; CRCF ohne biogenes CO2 fällt mit Warnung auf IEAGHG zurück. Full: alle drei nebeneinander.","Indirect = CO2 uit gasverbranding ter plaatse + CO2 van ingekochte netstroom voor afvang, compressie, transport. IEAGHG (Rubin et al. 2015): vermeden = opgeslagen - indirect, fossiel en biogeen; voor vergelijking van technologieën en literatuur. EU ETS (MRR 2018/2066, art. 38(5) biomassa-EF nul, art. 49): reductie = fossiel opgeslagen - gas-CO2 ter plaatse, stroom buiten ETS; EUR/t = break-even emissierechtenprijs voor ETS- en CCfD-geld. CRCF (Vo. 2024/3012, BioCCS): netto verwijdering = biogeen opgeslagen - bijbehorende emissies, standaard alle indirecte, pro rata alleen waar toegestaan; voor verwijderingscertificaten. Auto: CRCF bij biogeen CO2, anders IEAGHG; CRCF zonder biogeen CO2 valt met waarschuwing terug op IEAGHG. Full: alle drie naast elkaar.","Indirectes = CO2 de combustion de gaz sur site + CO2 de l’électricité réseau achetée pour captage, compression, transport. IEAGHG (Rubin et al. 2015) : évité = stocké - indirectes, fossile et biogénique ; pour comparer technologies et littérature. EU ETS (MRR 2018/2066, art. 38(5) FE biomasse nul, art. 49) : réduction = fossile stocké - CO2 du gaz sur site, électricité hors ETS ; EUR/t = prix de quota d’équilibre pour flux ETS et CCfD. CRCF (Règl. 2024/3012, BioCCS) : absorption nette = biogénique stocké - émissions associées, par défaut toutes les indirectes, au prorata seulement si autorisé ; pour les crédits d’absorption. Auto : CRCF si CO2 biogénique, sinon IEAGHG ; CRCF sans CO2 biogénique bascule vers IEAGHG avec avertissement. Full : les trois côte à côte.","Indirectas = CO2 de combustión de gas in situ + CO2 de electricidad de red comprada para captura, compresión, transporte. IEAGHG (Rubin et al. 2015): evitado = almacenado - indirectas, fósil y biogénico; para comparar tecnologías y literatura. EU ETS (MRR 2018/2066, art. 38(5) FE de biomasa cero, art. 49): reducción = fósil almacenado - CO2 del gas in situ, electricidad fuera del ETS; EUR/t = precio de equilibrio del derecho para flujos ETS y CCfD. CRCF (Regl. 2024/3012, BioCCS): absorción neta = biogénico almacenado - emisiones asociadas, por defecto todas las indirectas, a prorrata solo donde se permita; para créditos de absorción. Auto: CRCF si hay CO2 biogénico, si no IEAGHG; CRCF sin CO2 biogénico recurre a IEAGHG con aviso. Full: los tres en paralelo.","Pośrednie = CO2 ze spalania gazu na miejscu + CO2 z zakupionej energii sieciowej dla wychwytu, sprężania, transportu. IEAGHG (Rubin et al. 2015): uniknięte = składowane - pośrednie, kopalne i biogeniczne; do porównań technologii i literatury. EU ETS (MRR 2018/2066, art. 38(5) zerowy EF biomasy, art. 49): redukcja = składowane kopalne - CO2 z gazu na miejscu, energia elektryczna poza ETS; EUR/t = progowa cena uprawnienia dla przepływów ETS i CCfD. CRCF (Rozp. 2024/3012, BioCCS): usunięcie netto = składowane biogeniczne - emisje powiązane, domyślnie wszystkie pośrednie, proporcjonalnie tylko gdzie dozwolone; dla jednostek usunięć. Auto: CRCF przy biogenicznym CO2, inaczej IEAGHG; CRCF bez biogenicznego CO2 wraca do IEAGHG z ostrzeżeniem. Full: wszystkie trzy obok siebie.") }
};

/* MLAB (Claude): headline label/unit per EUR/t methodology */
function MLAB(m) {

    return {
      tile: T('Cost per EUA saved', 'Вартість на заощ. EUA', 'Kosten je eingesp. EUA', 'Kosten per bespaarde EUA', 'Coût par EUA économisé', 'Coste por EUA ahorrado', 'Koszt na zaoszcz. EUA'),
      unit: T('EUR/t EUA', 'EUR/t EUA', 'EUR/t EUA', 'EUR/t EUA', 'EUR/t EUA', 'EUR/t EUA', 'EUR/t EUA')
    };
  }
  if (m === 'crcf') {
    return {
      tile: T('LCOC net removal (CRCF)', 'LCOC чисте видал. (CRCF)', 'LCOC Nettoentnahme (CRCF)', 'LCOC netto-verwijd. (CRCF)', 'LCOC retrait net (CRCF)', 'LCOC absorción neta (CRCF)', 'LCOC pochł. netto (CRCF)'),
      unit: T('EUR/t net removed', 'EUR/t чисто видалено', 'EUR/t netto entnommen', 'EUR/t netto verwijderd', 'EUR/t nette retirée', 'EUR/t neta absorbida', 'EUR/t netto pochłonięta')
    };
  }
  return {
    tile: T('LCOC avoided (IEAGHG)', 'LCOC уникнутий (IEAGHG)', 'LCOC vermieden (IEAGHG)', 'LCOC vermeden (IEAGHG)', 'LCOC évité (IEAGHG)', 'LCOC evitado (IEAGHG)', 'LCOC uniknięty (IEAGHG)'),
    unit: T('EUR/t avoided', 'EUR/t уникнуто', 'EUR/t vermieden', 'EUR/t vermeden', 'EUR/t évitée', 'EUR/t evitada', 'EUR/t uniknięta')
  };
}

  var c=r.cash||{},t=r.t||{},en=r.energy||{},full=!!(s&&s.level==='full'),M=1e6,i;

  var npvM=nn(c.npv)!=null?c.npv/M:null,pb=nn(c.payback),okN=npvM!=null&&npvM>0;

  var BAD=['Does not pay back: ','Не окупається: ','Keine Amortisation: ','Verdient zich niet terug: ','Pas de retour : ','No se recupera: ','Brak zwrotu: '];
  var a=[];
  for(i=0;i<7;i++){a.push(pb!=null?PB[i]+y+YR[i]+(okN?', ':CON[i])+NPV[i]+' '+n+' '+MU[i]+'; LCOC '+l+' '+AV[i]:BAD[i]+'LCOC '+l+' '+AV[i]+', '+NPV[i]+' '+n+' '+MU[i]);}
  var verdict={tone:pb==null?'bad':(okN?'ok':'warn'),text:T.apply(null,a)};
  var tiles=[
    {label:MLAB(c.method).tile,value:nn(c.lcoc_avoided),hint:'EUR/t',precision:0,learn:'lcoc'},
    {label:T('Payback','Окупність','Amortisation','Terugverdientijd','Retour','Recuperación','Zwrot'),value:pb,hint:'y',precision:1,learn:'payback'},
    {label:T('NPV','NPV','Kapitalwert','NCW','VAN','VAN','NPV'),value:npvM,hint:'M EUR',precision:1,learn:'npv'},
    {label:T('IRR','IRR','IZF','IRR','TRI','TIR','IRR'),value:nn(c.irr)!=null?c.irr*100:null,hint:'%',precision:1},
    {label:T('CAPEX','CAPEX','CAPEX','CAPEX','CAPEX','CAPEX','CAPEX'),value:nn(r.capex)!=null?r.capex/M:null,hint:'M EUR',precision:1},
    {label:T('Captured','Уловлено','Abgeschieden','Afgevangen','Capté','Capturado','Wychwycone'),value:nn(t.captured)!=null?t.captured/M:null,hint:'Mt/y',precision:2},
    {label:T('Avoided','Уникнуто','Vermieden','Vermeden','Évité','Evitado','Uniknięte'),value:nn(t.avoided)!=null?t.avoided/M:null,hint:'Mt/y',precision:2,learn:'avoided'}
  ];
  if(full){
    tiles.push({label:T('LCOC stored','LCOC зберіг.','LCOC gespeichert','LCOC opgeslagen','LCOC stockée','LCOC almacenada','LCOC zmagaz.'),value:nn(c.lcoc_stored),hint:'EUR/t',precision:0,headline:false});
    tiles.push({ label: T('IEAGHG avoided cost', 'Вартість уникнення IEAGHG', 'IEAGHG Vermeidungskosten', 'IEAGHG vermijdingskosten', 'Coût d\'évitement IEAGHG', 'Coste evitado IEAGHG', 'Koszt unikniętej emisji IEAGHG'), value: nn(c.lcoc_ieaghg), hint: 'EUR/t', precision: 0, headline: false, learn: 'method' });
    tiles.push({ label: T('ETS allowance cost', 'Вартість квоти ETS', 'ETS-Zertifikatskosten', 'ETS-emissierechtkosten', 'Coût par quota ETS', 'Coste por derecho ETS', 'Koszt uprawnienia ETS'), value: nn(c.lcoc_ets), hint: 'EUR/t', precision: 0, headline: false, learn: 'method' });
    if (c.lcoc_removed != null) {
      tiles.push({ label: T('CRCF net removal cost', 'Вартість чистого видалення CRCF', 'CRCF-Nettoentnahmekosten', 'CRCF netto-verwijderingskosten', 'Coût du retrait net CRCF', 'Coste absorción neta CRCF', 'Koszt pochłaniania netto CRCF'), value: nn(c.lcoc_removed), hint: 'EUR/t', precision: 0, headline: false, learn: 'method' });
    }
    tiles.push({ label: T('ETS reduction', 'Скорочення ETS', 'ETS-Minderung', 'ETS-reductie', 'Réduction ETS', 'Reducción ETS', 'Redukcja ETS'), value: nn(t.ets != null ? t.ets / M : null), hint: 'Mt/y', precision: 2, headline: false, learn: 'method' });
    if (t.removed_net > 0) {
      tiles.push({ label: T('CRCF net removal', 'Чисте видалення CRCF', 'CRCF-Nettoentnahme', 'CRCF netto-verwijdering', 'Retrait net CRCF', 'Absorción neta CRCF', 'Pochłanianie netto CRCF'), value: nn(t.removed_net / M), hint: 'Mt/y', precision: 2, headline: false, learn: 'method' });
    }
    tiles.push({label:T('Disc. payback','Диск. окупність','Disk. Amortisation','Verdisc. terugverd.','Retour actualisé','Recup. descontada','Zdysk. zwrot'),value:nn(c.disc_payback),hint:'y',precision:1,headline:false});
    tiles.push({label:T('Electricity','Електроенергія','Strom','Elektriciteit','Électricité','Electricidad','Energia el.'),value:nn(en.elec_MWh_y)!=null?en.elec_MWh_y/1e3:null,hint:'GWh/y',precision:1,headline:false});
    tiles.push({label:T('Gas','Газ','Gas','Gas','Gaz','Gas','Gaz'),value:nn(en.gas_MWh_y)!=null?en.gas_MWh_y/1e3:null,hint:'GWh/y',precision:1,headline:false});
    tiles.push({label:T('Biogenic','Біогенний','Biogen','Biogeen','Biogénique','Biogénico','Biogeniczne'),value:nn(t.bio)!=null?t.bio/M:null,hint:'Mt/y',precision:2,headline:false});
  }
  var SN={capture:T('Capture','Уловлювання','Abscheidung','Afvang','Captage','Captura','Wychwyt'),compression:T('Compression','Компресія','Verdichtung','Compressie','Compression','Compresión','Sprężanie'),transport:T('Transport','Транспорт','Transport','Transport','Transport','Transporte','Transport'),storage:T('Storage','Зберігання','Speicherung','Opslag','Stockage','Almacenamiento','Składowanie')};

        model:{ equations:['LCOC = sum(CAPEX x CRF + fixed O&M + energy + T&S) / t stored','CRF = r(1+r)^n / ((1+r)^n - 1)','net cash(y) = ETS cost avoided + CCfD + removal credits + grant - CAPEX - O&M - energy - T&S','NPV = sum net(y)/(1+r)^(y-y0); payback = first year cumulative >= 0'],
          ranges:['0.05-10 Mt/y captured; pipeline 5-1500 km; ship 50-3000 km'],
          notes:['screening cost basis (IEAGHG, ZEP, NETL, CATF); stage physics from linked tools when handed off; several cost constants are assumptions'] },
        warnings:last.warnings||[] };
    },
    handoff:{ provides:['mdot','Q','E'], accepts:['mdot','p','D','L','dp','Q','E','x','T'],
      build:function(){
        if(!last||!last.ok||!last.t) return null;
        var mdot=last.t.captured*1000/31.536e6;
        return { quantities:{ mdot:q(mdot,'kg/s') } };
      },
      apply:function(p){
        p=p||{}; var qq=p.quantities||{}, S=p.sets||{}, keep={}, any=false, names=['capture','compression','pipeline','ship','storage'], i, L;
        for(i=0;i<names.length;i++){ if(Array.isArray(S[names[i]])&&S[names[i]].length){ keep[names[i]]=S[names[i]]; any=true; } }
        handoffSets=any?keep:null;
        if(qq.mdot&&qq.mdot.value>0){
          var mt=Math.round(qq.mdot.value*31.536e6/1e9*100)/100;
          state.mt=Math.max(0.05,Math.min(10,mt));
        }
        if(S.pipeline&&!S.ship) state.transport='pipe';
        if(S.ship&&!S.pipeline) state.transport='ship';
        L=setQ(S.pipeline,'L'); if(L!==null&&L>0) state.L_km=Math.round(L/1000);
        L=setQ(S.ship,'L'); if(L!==null&&L>0) state.ship_dist_km=Math.round(L/1000);
        if(window.CCUS&&CCUS.cost) run(state);
        if(ui){ ui.sync(); ui.run(); }
      }
    }
  });
}
