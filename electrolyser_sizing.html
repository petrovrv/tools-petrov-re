  function onChange(key, value, app) {
    // switching technology loads its typical cell and stack parameters (ogh-h2prod.js ELEC_TECH)
    var e = engine(), t, k;
    if (key !== 'tech' || !e || !e.tech || !e.tech[value]) return;
    t = e.tech[value];
    for (k in t) if (Object.prototype.hasOwnProperty.call(t, k) && k !== 'steam' && Object.prototype.hasOwnProperty.call(state, k)) state[k] = t[k];
    if (value === 'SOEC') { state.A_cell = 0.01; state.cells_stack = 100; }
    else if (value === 'AEL') { state.A_cell = 2.5; state.cells_stack = 300; }
    else { state.A_cell = 0.1; state.cells_stack = 100; }
    app.sync();
  }

  function degrade() {
    document.title = 'diagram-ui.js v1 is required';
    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1');
    h.textContent = 'Electrolyser Sizing';
    var p = document.createElement('p');
    p.textContent = 'The interactive interface could not load. The export, the calculation record '
                  + 'and the limitations are still available from the bar at the bottom of the page.';
    host.appendChild(h);
    host.appendChild(p);
    last = solve(state);
  }

    if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1') buildInterface();

    installData();
  }

          'Achten Sie auf N_stacks: die halbe Stromdichte spart 8 % Strom (53,2 statt 57,7 kWh/kg), aber die Anlage braucht 101 statt 47 Stacks - Wirkungsgrad wird mit Elektrodenfläche erkauft.',
          'Kijk naar N_stacks: de stroomdichtheid halveren bespaart 8 % elektriciteit (53,2 in plaats van 57,7 kWh/kg), maar de installatie heeft 101 stacks nodig in plaats van 47 - rendement koop je met elektrodeoppervlak.',
          'Regardez N_stacks : diviser la densité de courant par deux économise 8 % d\'électricité (53,2 au lieu de 57,7 kWh/kg), mais il faut 101 stacks au lieu de 47 - le rendement s\'achète en surface d\'électrode.',
          'Fíjese en N_stacks: reducir a la mitad la densidad de corriente ahorra un 8 % de electricidad (53,2 en lugar de 57,7 kWh/kg), pero la planta necesita 101 stacks en vez de 47: la eficiencia se paga con área de electrodo.',
          'Spójrz na N_stacks: zmniejszenie gęstości prądu o połowę oszczędza 8 % energii (53,2 zamiast 57,7 kWh/kg), ale instalacja potrzebuje 101 stosów zamiast 47 - sprawność kupuje się powierzchnią elektrod.'),
        apply: function (t) { setEx(t, 'PEM', { P_AC: 20e6, FLH: 5000, j: 1e4 }); } },
      { id: 'ael_100', label: T('Alkaline 100 MW, atmospheric', 'Лужний 100 МВт, атмосферний', 'Alkalisch 100 MW, atmosphärisch', 'Alkalisch 100 MW, atmosferisch', 'Alcalin 100 MW, atmosphérique', 'Alcalino 100 MW, atmosférico', 'Alkaliczny 100 MW, atmosferyczny'),
        note: T('Look at V_cell: at 0.4 A/cm² the alkaline cell runs at 1.78 V and the plant needs 53.9 kWh/kg; 17 large stacks give 10 790 t/year, but the hydrogen leaves at 1 bar and still has to be compressed.',
          'Подивіться на V_cell: при 0,4 А/см² лужна комірка працює на 1,78 В, установка потребує 53,9 кВт·год/кг; 17 великих стеків дають 10 790 т/рік, але водень виходить при 1 бар і його ще треба стиснути.',
          'Achten Sie auf V_cell: bei 0,4 A/cm² arbeitet die alkalische Zelle mit 1,78 V und die Anlage braucht 53,9 kWh/kg; 17 große Stacks liefern 10 790 t/Jahr, der Wasserstoff kommt aber mit 1 bar und muss noch verdichtet werden.',
          'Kijk naar V_cell: bij 0,4 A/cm² werkt de alkalische cel op 1,78 V en vraagt de installatie 53,9 kWh/kg; 17 grote stacks leveren 10 790 t/jaar, maar de waterstof komt vrij op 1 bar en moet nog gecomprimeerd worden.',
          'Regardez V_cell : à 0,4 A/cm² la cellule alcaline fonctionne à 1,78 V et l\'installation consomme 53,9 kWh/kg ; 17 grands stacks donnent 10 790 t/an, mais l\'hydrogène sort à 1 bar et doit encore être comprimé.',
          'Fíjese en V_cell: a 0,4 A/cm² la celda alcalina trabaja a 1,78 V y la planta necesita 53,9 kWh/kg; 17 stacks grandes dan 10 790 t/año, pero el hidrógeno sale a 1 bar y aún hay que comprimirlo.',
          'Spójrz na V_cell: przy 0,4 A/cm² ogniwo alkaliczne pracuje przy 1,78 V, a instalacja zużywa 53,9 kWh/kg; 17 dużych stosów daje 10 790 t/rok, ale wodór wychodzi pod 1 bar i trzeba go jeszcze sprężyć.'),
        apply: function (t) { setEx(t, 'AEL', { P_AC: 100e6, FLH: 6000 }); } },
      { id: 'soec_10', label: T('SOEC 10 MW, steam at 750 °C', 'SOEC 10 МВт, пара 750 °C', 'SOEC 10 MW, Dampf bei 750 °C', 'SOEC 10 MW, stoom bij 750 °C', 'SOEC 10 MW, vapeur à 750 °C', 'SOEC 10 MW, vapor a 750 °C', 'SOEC 10 MW, para 750 °C'),
        note: T('Look at e_sys and the warning: steam electrolysis needs only 40.8 kWh/kg of electricity (plus 6.5 kWh/kg of heat to raise steam) because heat supplies part of the splitting energy, but with a 20 000 h stack life and 7500 h/year the stacks must be replaced every 2.7 years.',
          'Подивіться на e_sys і попередження: паровий електроліз потребує лише 40,8 кВт·год/кг електроенергії (плюс 6,5 кВт·год/кг тепла на пару), бо частину енергії розщеплення дає тепло, але з ресурсом стека 20 000 год і 7500 год/рік стеки треба міняти кожні 2,7 року.',
          'Achten Sie auf e_sys und die Warnung: Dampfelektrolyse braucht nur 40,8 kWh/kg Strom (plus 6,5 kWh/kg Wärme für den Dampf), weil Wärme einen Teil der Spaltenergie liefert, doch bei 20 000 h Stack-Lebensdauer und 7500 h/Jahr müssen die Stacks alle 2,7 Jahre getauscht werden.',
          'Kijk naar e_sys en de waarschuwing: stoomelektrolyse vraagt maar 40,8 kWh/kg elektriciteit (plus 6,5 kWh/kg warmte voor stoom) omdat warmte een deel van de splitsingsenergie levert, maar met 20 000 h stacklevensduur en 7500 h/jaar moeten de stacks elke 2,7 jaar vervangen worden.',
          'Regardez e_sys et l\'avertissement : l\'électrolyse vapeur ne demande que 40,8 kWh/kg d\'électricité (plus 6,5 kWh/kg de chaleur pour la vapeur) car la chaleur fournit une partie de l\'énergie de dissociation, mais avec 20 000 h de durée de vie et 7500 h/an il faut remplacer les stacks tous les 2,7 ans.',
          'Fíjese en e_sys y el aviso: la electrólisis de vapor necesita solo 40,8 kWh/kg de electricidad (más 6,5 kWh/kg de calor para el vapor) porque el calor aporta parte de la energía de disociación, pero con 20 000 h de vida del stack y 7500 h/año hay que sustituir los stacks cada 2,7 años.',
          'Spójrz na e_sys i ostrzeżenie: elektroliza pary potrzebuje tylko 40,8 kWh/kg energii elektrycznej (plus 6,5 kWh/kg ciepła na parę), bo ciepło dostarcza część energii rozkładu, ale przy żywotności stosu 20 000 h i 7500 h/rok stosy trzeba wymieniać co 2,7 roku.'),
        apply: function (t) { setEx(t, 'SOEC', { P_AC: 10e6, FLH: 7500 }); } },
      { id: 'pem_offgrid', label: T('PEM 5 MW on solar PV', 'PEM 5 МВт від сонячної СЕС', 'PEM 5 MW an Photovoltaik', 'PEM 5 MW op zon-PV', 'PEM 5 MW sur photovoltaïque', 'PEM 5 MW con fotovoltaica', 'PEM 5 MW z fotowoltaiki'),
        note: T('Look at the annual output: the same PEM design on solar PV uses the same 57.7 kWh/kg, but 2000 h give only 168 t/year - 34 t per MW instead of 84 t per MW on the grid, so the capital cost per kg is 2.5 times higher.',
          'Подивіться на річний вихід: та сама PEM-установка від СЕС має ті самі 57,7 кВт·год/кг, але 2000 год дають лише 168 т/рік — 34 т на МВт замість 84 т на МВт від мережі, тож капітальні витрати на кг у 2,5 раза вищі.',
          'Achten Sie auf die Jahresmenge: dieselbe PEM-Auslegung an PV braucht dieselben 57,7 kWh/kg, aber 2000 h ergeben nur 168 t/Jahr - 34 t je MW statt 84 t je MW am Netz, die Kapitalkosten je kg sind also 2,5-mal höher.',
          'Kijk naar de jaarproductie: hetzelfde PEM-ontwerp op zon-PV gebruikt dezelfde 57,7 kWh/kg, maar 2000 h geven maar 168 t/jaar - 34 t per MW in plaats van 84 t per MW op het net, dus de kapitaalkosten per kg zijn 2,5 keer hoger.',
          'Regardez la production annuelle : la même conception PEM sur photovoltaïque consomme les mêmes 57,7 kWh/kg, mais 2000 h ne donnent que 168 t/an - 34 t par MW au lieu de 84 t par MW sur le réseau, le coût d\'investissement par kg est donc 2,5 fois plus élevé.',
          'Fíjese en la producción anual: el mismo diseño PEM con fotovoltaica usa los mismos 57,7 kWh/kg, pero 2000 h dan solo 168 t/año: 34 t por MW en lugar de 84 t por MW en red, así que el coste de capital por kg es 2,5 veces mayor.',
          'Spójrz na roczną produkcję: ta sama instalacja PEM z fotowoltaiki zużywa te same 57,7 kWh/kg, ale 2000 h daje tylko 168 t/rok - 34 t na MW zamiast 84 t na MW z sieci, więc koszt kapitałowy na kg jest 2,5 razy wyższy.'),
        apply: function (t) { setEx(t, 'PEM', { P_AC: 5e6, FLH: 2000 }); } }
    ];
    function setEx(t, tech, over) {
      var s = t || state, e = engine(), b = e && e.tech ? e.tech[tech] : null, k;
      s.tech = tech; s.level = 'simple'; s.eta_rect = 0.97; s.U_steam = 0.7; s.x_H2O_in = 0.9;
      if (b) for (k in b) if (Object.prototype.hasOwnProperty.call(b, k) && k !== 'steam') s[k] = b[k];
      s.A_cell = tech === 'SOEC' ? 0.01 : (tech === 'AEL' ? 2.5 : 0.1); s.cells_stack = tech === 'AEL' ? 300 : 100;
      for (k in over) if (Object.prototype.hasOwnProperty.call(over, k)) s[k] = over[k];
    }
    ui.examples(EX);

    ui.stage({
      caption: T('Polarisation curve: cell voltage against current density', 'Поляризаційна крива: напруга комірки від густини струму', 'Polarisationskurve: Zellspannung über Stromdichte', 'Polarisatiecurve: celspanning tegen stroomdichtheid', 'Courbe de polarisation : tension de cellule selon la densité de courant', 'Curva de polarización: tensión de celda frente a densidad de corriente', 'Krzywa polaryzacji: napięcie ogniwa w funkcji gęstości prądu'),
      minHeight: 300,
      a11y: function () {
        if (!last || !last.ok) return TL(NORES);
        return TL(TF(T('Cell voltage $1 V at $2 A/cm²; reversible $3 V, thermoneutral $4 V.', 'Напруга комірки $1 В при $2 А/см²; оборотна $3 В, термонейтральна $4 В.', 'Zellspannung $1 V bei $2 A/cm²; reversibel $3 V, thermoneutral $4 V.', 'Celspanning $1 V bij $2 A/cm²; reversibel $3 V, thermoneutraal $4 V.', 'Tension de cellule $1 V à $2 A/cm² ; réversible $3 V, thermoneutre $4 V.', 'Tensión de celda $1 V a $2 A/cm²; reversible $3 V, termoneutra $4 V.', 'Napięcie ogniwa $1 V przy $2 A/cm²; odwracalne $3 V, termoneutralne $4 V.'), [DiagramUI.fmt(last.V_cell, { precision: 3 }), DiagramUI.fmt(state.j / 1e4, { precision: 2 }), DiagramUI.fmt(last.E_rev, { precision: 3 }), DiagramUI.fmt(last.U_tn, { precision: 3 })]));
      },
      render: function (size, st) {
        var ctx = st.canvas(), w = size.w, h = size.h, coarse = size.density === 'coarse';
        var cs = getComputedStyle(document.documentElement);
        var muted = cs.getPropertyValue('--muted').trim() || '#888', line = cs.getPropertyValue('--line').trim() || '#ccc', font = cs.getPropertyValue('--font').trim() || 'sans-serif';
        ctx.clearRect(0, 0, w, h);
        if (!last || !last.ok || !last.curve || !last.curve.length) return;
        var C = last.curve, k, x1 = C[C.length - 1].j / 1e4, y0 = Math.min(last.E_rev, last.U_tn) - 0.1, y1 = Math.max(C[C.length - 1].V, last.V_eol, last.U_tn) + 0.05;
        var L = coarse ? 44 : 54, RR = 14, TOP = 12, B = coarse ? 36 : 44, pw = w - L - RR, ph = h - TOP - B;
        if (pw <= 10 || ph <= 10) return;
        function X(v) { return L + v / x1 * pw; }
        function Y(v) { return TOP + ph - (v - y0) / (y1 - y0) * ph; }
        ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.beginPath();
        ctx.moveTo(L, TOP); ctx.lineTo(L, TOP + ph); ctx.lineTo(L + pw, TOP + ph); ctx.stroke();
        ctx.fillStyle = muted; ctx.font = (coarse ? 10 : 11) + 'px ' + font;
        var xt = DiagramUI.ticks(0, x1, pw, size.density), yt = DiagramUI.ticks(y0, y1, ph, size.density);
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        for (k = 0; k < xt.length; k++) { if (xt[k] < 0 || xt[k] > x1) continue; var px = X(xt[k]);
          ctx.beginPath(); ctx.moveTo(px, TOP + ph); ctx.lineTo(px, TOP + ph + 4); ctx.stroke();
          ctx.fillText(DiagramUI.fmt(xt[k], { precision: 2 }), px, TOP + ph + 6); }
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        for (k = 0; k < yt.length; k++) { if (yt[k] < y0 || yt[k] > y1) continue; var py = Y(yt[k]);
          ctx.beginPath(); ctx.moveTo(L - 4, py); ctx.lineTo(L, py); ctx.stroke();
          ctx.fillText(DiagramUI.fmt(yt[k], { precision: 2 }), L - 6, py); }
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText('j, A/cm²', L + pw / 2, h - 2);
        ctx.save(); ctx.translate(12, TOP + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textBaseline = 'middle'; ctx.fillText('V_cell, V', 0, 0); ctx.restore();
        ctx.save(); ctx.beginPath(); ctx.rect(L, TOP, pw, ph); ctx.clip();
        function hline(v, col, dash) { ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(L + pw, Y(v)); ctx.stroke(); ctx.setLineDash([]); }
        hline(last.E_rev, DiagramUI.series(2), [2, 3]);
        hline(last.U_tn, muted, [6, 4]);
        function curve(f, col, width, dash) { ctx.strokeStyle = col; ctx.lineWidth = width; ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(X(0), Y(f(null))); for (k = 0; k < C.length; k++) ctx.lineTo(X(C[k].j / 1e4), Y(f(C[k]))); ctx.stroke(); ctx.setLineDash([]); }
        curve(function (c) { return c ? c.E_rev + c.act : last.E_rev; }, DiagramUI.series(1), 1.5, [5, 3]);
        curve(function (c) { return c ? c.V : last.E_rev; }, DiagramUI.series(0), 2, []);
        var dv = last.V_eol - last.V_cell;
        if (dv > 0) curve(function (c) { return c ? c.V + dv * c.j / state.j : last.E_rev; }, DiagramUI.series(3), 1.5, [6, 4]);
        ctx.fillStyle = DiagramUI.series(0); ctx.beginPath(); ctx.arc(X(state.j / 1e4), Y(last.V_cell), coarse ? 3.5 : 4.5, 0, 2 * Math.PI); ctx.fill();
        ctx.restore();
        ctx.fillStyle = muted; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
        ctx.fillText('U_tn ' + DiagramUI.fmt(last.U_tn, { precision: 3 }) + ' V', L + 6, Y(last.U_tn) - 2);
      }
    });
    adoptStage(ui);

    ui.ready();
    window['__electrolyser_sizing'] = { ui: ui, state: state, solve: solve, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function isPosNum(v) {
    return typeof v === 'number' && isFinite(v) && v > 0;
  }

  function buildRecord() {
    if (!last) return null;
    var inKeys = ['level', 'tech', 'P_AC', 'j', 'T', 'p_c', 'p_a', 'ASR', 'j0', 'alpha', 'eta_F', 'eta_rect', 'e_bop', 'A_cell', 'cells_stack', 'FLH', 'deg_uV_h', 'life_h', 'U_steam', 'x_H2O_in'],
        outKeys = ['E_rev', 'eta_act', 'eta_ohm', 'V_cell', 'V_eol', 'V_avg', 'U_tn', 'eta_V_tn', 'e_dc_kWh_kg', 'e_sys_kWh_kg', 'e_sys_avg_kWh_kg', 'e_sys_eol_kWh_kg',
                   'eta_sys_LHV', 'eta_sys_HHV', 'mdot_kg_h', 'm_year_t', 'P_DC', 'P_bop', 'I_total', 'N_cells', 'N_stacks', 'Q_stack', 'water_kg_h', 'o2_kg_h',
                   'e_steam_th_kWh_kg', 'stack_years', 'basis', 'verdict'],
        inputs = {}, outputs = {}, units = {}, warnings = [], i, k;
    var UNIT = {
      level: '-', tech: '-', P_AC: 'W', j: 'A/m2', T: 'K', p_c: 'Pa', p_a: 'Pa', ASR: 'ohm m2', j0: 'A/m2', alpha: '-', eta_F: '-', eta_rect: '-',
      e_bop: 'kWh/kg', A_cell: 'm2', cells_stack: '-', FLH: 'h/y', deg_uV_h: 'uV/h', life_h: 'h', U_steam: '-', x_H2O_in: '-',
      E_rev: 'V', eta_act: 'V', eta_ohm: 'V', V_cell: 'V', V_eol: 'V', V_avg: 'V', U_tn: 'V', eta_V_tn: '-', e_dc_kWh_kg: 'kWh/kg', e_sys_kWh_kg: 'kWh/kg',
      e_sys_avg_kWh_kg: 'kWh/kg', e_sys_eol_kWh_kg: 'kWh/kg', eta_sys_LHV: '- (LHV)', eta_sys_HHV: '- (HHV)', mdot_kg_h: 'kg/h', m_year_t: 't/y', P_DC: 'W',
      P_bop: 'W', I_total: 'A', N_cells: '-', N_stacks: '-', Q_stack: 'W', water_kg_h: 'kg/h', o2_kg_h: 'kg/h', e_steam_th_kWh_kg: 'kWh/kg (thermal)',
      stack_years: 'y', basis: '-', verdict: '-'
    };
    for (i = 0; i < inKeys.length; i++) { k = inKeys[i]; inputs[k] = state[k]; units[k] = UNIT[k]; }
    if (last.ok) {
      for (i = 0; i < outKeys.length; i++) { k = outKeys[i]; outputs[k] = last[k]; units[k] = UNIT[k]; }
      warnings = (last.warnings || []).slice();
    } else {
      warnings = [last.error];
    }
    return {
      inputs: inputs, outputs: outputs, units: units,
      model: {
        equations: [
          'E_rev = E0(T) + (R T/2F) ln(p_H2 p_O2^0.5 / a_H2O); E0 = 1.229 - 0.9e-3 (T - 298.15) liquid, 1.253 - 2.4516e-4 T steam',
          'V = E_rev + (R T/(alpha F)) asinh(j/(2 j0)) + ASR j',
          'SEC_dc = 2 F V / (eta_F M_H2); SEC_sys = SEC_dc/eta_rect + e_bop',
          'm_H2 = P_AC / SEC_sys; I = P_DC / V; N_cells = ceil(I/(j A_cell))',
          'V_EOL = V + r_deg life_h; annual output uses V at mid-life',
          'Q_stack = (V - U_tn) I, U_tn = 1.481 V (liquid) or 1.285 V (steam)'
        ],
        ranges: ['PEM/AEL: T <= 100 C', 'SOEC: 600-900 C', 'single lumped activation term, no mass-transport loss'],
        notes: ['Energy basis LHV 119.96 MJ/kg and HHV 141.79 MJ/kg at 25 C', 'Water stoichiometric only (no purification reject)', 'SOEC steam heat reported separately as thermal energy']
      },
      warnings: warnings
    };
  }

  function hoRow(o) { var r = {}, k; for (k in o) if (typeof o[k][0] === 'number' && isFinite(o[k][0])) r[k] = { value: o[k][0], unit: o[k][1] }; return r; }

  var HANDOFF = {
    provides: ['mdot', 'p', 'T'],
    accepts: [],
    build: function () {
      if (!last || !last.ok) return null;
      return {
        quantities: {
          mdot: { value: last.mdot, unit: 'kg/s' },
          p: { value: state.p_c, unit: 'Pa' },
          T: { value: Math.min(state.T, 313.15), unit: 'K' }
        },
        sets: {
          h2_product: [hoRow({ purity: [0.999, '-'], e_sys: [last.e_sys_kWh_kg * 3.6e6, 'J/kg'], mdot_year_avg: [last.m_year_t * 1000 / 31536000, 'kg/s'] })],
          composition: [hoRow({ h2: [1, '-'] })]
        }
      };
    },
    apply: function () {}
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'electrolyser_sizing',
        file: 'electrolyser_sizing.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
