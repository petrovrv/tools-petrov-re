  function computeView(s){
    last = solve(s); if (stage) stage.schedule();
    var r = last, e;
    if (!r || !r.ok) { e = (r && r.error) || 'Unknown error'; return { verdict: { tone: 'bad', text: trW(e) }, tiles: [], notes: [] }; }
    function fin(v){ return typeof v === 'number' && isFinite(v); }
    var tiles = [], notes = [], meters = [], tables = [], i, w, tone, text, full = s.level === 'full';
    function add(label, v, unit, learn, head, tone){ if (!fin(v)) return; var isInt = unit === '-' && v === Math.round(v) && Math.abs(v) >= 1; tiles.push({ label: label, value: isInt ? v : sigv(v, 4), hint: unit, precision: isInt ? 0 : sig(v, 4), tone: tone || null, learn: learn, headline: !!head }); }

    var nS = String(r.N);

      tone = 'ok';
      text = T(nS + ' vessel(s) hold the required usable hydrogen',

    add(T('m_use · usable H₂ per vessel', 'm_use · корисна маса H₂ на посудину', 'm_use · nutzbares H₂ je Behälter', 'm_use · bruikbare H₂ per vat', 'm_use · H₂ utile par réservoir', 'm_use · H₂ útil por recipiente', 'm_use · użyteczny H₂ na zbiornik'), r.m_use, 'kg', 'usable', true);
    add(T('m_full · H₂ at maximum pressure', 'm_full · H₂ за максимального тиску', 'm_full · H₂ bei Maximaldruck', 'm_full · H₂ bij maximale druk', 'm_full · H₂ à pression maximale', 'm_full · H₂ a presión máxima', 'm_full · H₂ przy ciśnieniu maks.'), r.m_full, 'kg', 'mass');
    add(T('Z_max · compressibility at p_max', 'Z_max · стисливість при p_max', 'Z_max · Realgasfaktor bei p_max', 'Z_max · compressibiliteit bij p_max', 'Z_max · compressibilité à p_max', 'Z_max · compresibilidad a p_max', 'Z_max · ściśliwość przy p_max'), r.Z_max, '-', 'eos', false, r.Z_max > 1.2 ? 'warn' : null);

        head: [T('Quantity', 'Величина', 'Größe', 'Grootheid', 'Grandeur', 'Magnitud', 'Wielkość'), T('Per vessel, kg', 'На посудину, кг', 'Je Behälter, kg', 'Per vat, kg', 'Par réservoir, kg', 'Por recipiente, kg', 'Na zbiornik, kg'), T('Total, kg', 'Усього, кг', 'Gesamt, kg', 'Totaal, kg', 'Total, kg', 'Total, kg', 'Razem, kg')],

  }

  function degrade() {
    document.title = 'diagram-ui.js v1 is required';

    last = solve(state);

        ctx.stroke();
        ctx.fillStyle = DiagramUI.series(0);
        ctx.beginPath(); ctx.arc(xb, Y(last.rho_max), coarse ? 3 : 3.5, 0, 2 * Math.PI); ctx.fill();
        ctx.beginPath(); ctx.arc(xa, Y(last.rho_min), coarse ? 3 : 3.5, 0, 2 * Math.PI); ctx.fill();
        ctx.restore();
        ctx.fillStyle = muted; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText('p_min → p_max: ' + TL(TF(T('$1 kg / vessel', '$1 кг / посудину', '$1 kg / Behälter', '$1 kg / vat', '$1 kg / réservoir', '$1 kg / recipiente', '$1 kg / zbiornik'), [DiagramUI.fmt(last.m_use, { precision: 2 })])), L + 8, TOP + 4);
      }
    });
    adoptStage(ui);

    ui.ready();
    window['__h2_storage_vessel'] = { ui: ui, state: state, solve: solve, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function isPosNum(v) {
    return typeof v === 'number' && isFinite(v) && v > 0;
  }

  function buildRecord() {
    if (!last) return null;
    var inKeys = ['level', 'type', 'V', 'p_max', 'p_min', 'T', 'm_target', 'D_i', 'UTS', 'BR', 'm_empty'],
        outKeys = ['N', 'm_use', 'm_full', 'm_res', 'util', 'rho_max', 'rho_min', 'Z_max', 'Z_min', 'rho_ig_max', 'ideal_err',
                   'V_total', 'm_stored_total', 'gravimetric', 'volumetric', 'p_burst_min', 't_wall', 'E_use_MWh', 'basis', 'verdict'],
        inputs = {}, outputs = {}, units = {}, warnings = [], i, k;
    var UNIT = {
      level: '-', type: '-', V: 'm3', p_max: 'Pa', p_min: 'Pa', T: 'K', m_target: 'kg', D_i: 'm', UTS: 'Pa', BR: '-', m_empty: 'kg',
      N: '-', m_use: 'kg', m_full: 'kg', m_res: 'kg', util: '-', rho_max: 'kg/m3', rho_min: 'kg/m3', Z_max: '-', Z_min: '-',
      rho_ig_max: 'kg/m3', ideal_err: '-', V_total: 'm3', m_stored_total: 'kg', gravimetric: 'kg/kg', volumetric: 'kg/m3',
      p_burst_min: 'Pa', t_wall: 'm', E_use_MWh: 'MWh (LHV)', basis: '-', verdict: '-'
    };
    for (i = 0; i < inKeys.length; i++) { k = inKeys[i]; inputs[k] = state[k]; units[k] = UNIT[k]; }
    if (last.ok) {
      for (i = 0; i < outKeys.length; i++) { k = outKeys[i]; outputs[k] = last[k]; units[k] = UNIT[k]; }
      warnings = (last.warnings || []).slice();
    } else {
      warnings = [last.error];
    }
    return {
      inputs: inputs, outputs: outputs, units: units,
      model: {
        equations: [
          'rho(T, p) from Leachman et al. (2009) normal-hydrogen EOS (C.eos.tp)',
          'm_full = rho(T, p_max)*V; m_res = rho(T, p_min)*V; m_use = m_full - m_res',
          'N = ceil(m_target/m_use); E_use = N*m_use*119.96 MJ/kg (LHV, 25 C)',
          'p_burst,min = BR*p_max; Type I wall t = p_burst*D_i/(2*UTS) (Barlow thin wall)',
          'gravimetric = m_full/(m_full + m_empty)'
        ],
        ranges: ['T: 200-400 K', 'p <= 100 MPa', 'pure normal hydrogen'],
        notes: ['Isothermal fill and draw-down at T', 'No heat of compression on fast fill', 'Type II-IV wall not sized (composite design per EN 17533:2020 / ISO 19884:2019)']
      },
      warnings: warnings
    };
  }

  function hoRow(o) { var r = {}, k; for (k in o) if (typeof o[k][0] === 'number' && isFinite(o[k][0])) r[k] = { value: o[k][0], unit: o[k][1] }; return r; }

  var HANDOFF = {
    provides: ['p', 'T'],
    accepts: ['p', 'T'],
    build: function () {
      if (!last || !last.ok) return null;
      return {
        quantities: {
          p: { value: state.p_max, unit: 'Pa' },
          T: { value: state.T, unit: 'K' }
        },
        sets: {
          storage: [hoRow({ N: [last.N, '-'], p_max: [state.p_max, 'Pa'], p_min: [state.p_min, 'Pa'], T: [state.T, 'K'] })],
          composition: [hoRow({ h2: [1, '-'] })]
        }
      };
    },
    apply: function (payload) {
      var q = payload && payload.quantities;
      if (q) {
        if (q.p && isPosNum(q.p.value) && q.p.value <= 1e8) state.p_max = q.p.value;
        if (q.T && isPosNum(q.T.value)) state.T = Math.max(200, Math.min(400, q.T.value));
      }
      last = solve(state);
      if (ui) { ui.sync(); ui.run(); }
    }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'h2_storage_vessel',
        file: 'h2_storage_vessel.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
