  "description": {
    "en": "Enter the floors (level, use, population, entrance) and the lift group (number of cars, rated load, speed, acceleration, jerk, door and transfer times), or load one of the shared example buildings. The tool computes the up-peak round trip with the probable number of stops S and the highest reversal floor H for unequal floor populations, splits it into travel, stopping, door and passenger transfer time, and gives the interval, the 5-minute handling capacity in persons and in % of the population, the average waiting and transit time estimates and traffic lights against criteria for offices, flats, hotels and hospitals. A sizing grid lists the groups of 1–8 cars, 630–2000 kg and 1–6 m/s that meet the criteria, fewest shafts first; a zoning helper splits a tall building into two or three stacked zones with an express run and allocates the cars; a kinematics chart shows the jerk-limited speed profile. The scenario JSON is shared with the waiting-time simulator and the energy tool; CSV exports of the sizing grid and the summary.",
    "uk": "Задайте поверхи (відмітку, призначення, кількість людей, вхід) і групу ліфтів (кількість кабін, вантажопідйомність, швидкість, прискорення, ривок, час дверей і входу-виходу) або завантажте один зі спільних прикладів будівель. Інструмент обчислює круговий рейс на ранковий пік з імовірною кількістю зупинок S і найвищим поверхом розвороту H для різної заселеності поверхів, розкладає його на час руху, зупинок, дверей і входу-виходу пасажирів і дає інтервал, 5-хвилинну пропускну здатність у людях і у % населення, оцінки середнього очікування й часу в дорозі та світлофори проти критеріїв для офісів, житла, готелів і лікарень. Сітка підбору показує групи з 1–8 кабін, 630–2000 кг і 1–6 м/с, що відповідають критеріям, починаючи з найменшої кількості шахт; помічник зонування ділить висотну будівлю на дві чи три зони з експресним перегоном і розподіляє кабіни; графік кінематики показує профіль швидкості з обмеженим ривком. JSON сценарію спільний із симулятором очікування та інструментом енергії; експорт CSV сітки підбору й зведення.",
    "de": "Geben Sie die Geschosse (Höhe, Nutzung, Personen, Zugang) und die Aufzugsgruppe (Anzahl Kabinen, Nennlast, Geschwindigkeit, Beschleunigung, Ruck, Tür- und Ein-/Ausstiegszeiten) ein oder laden Sie eines der gemeinsamen Beispielgebäude. Das Werkzeug berechnet die Umlaufzeit der Morgenspitze mit der wahrscheinlichen Haltezahl S und dem höchsten Umkehrgeschoss H bei ungleich belegten Geschossen, zerlegt sie in Fahr-, Halte-, Tür- und Fahrgastwechselzeit und liefert das Intervall, die 5-Minuten-Förderleistung in Personen und in % der Belegung, Schätzungen der mittleren Warte- und Fahrzeit sowie Ampeln gegen Kriterien für Büro, Wohnen, Hotel und Krankenhaus. Ein Auswahlraster zeigt die Gruppen aus 1–8 Kabinen, 630–2000 kg und 1–6 m/s, die die Kriterien erfüllen, mit den wenigsten Schächten zuerst; eine Zonierungshilfe teilt ein Hochhaus in zwei oder drei übereinanderliegende Zonen mit Expressfahrt und verteilt die Kabinen; ein Kinematikdiagramm zeigt das ruckbegrenzte Geschwindigkeitsprofil. Das Szenario-JSON teilt das Werkzeug mit dem Wartezeitsimulator und dem Energiewerkzeug; CSV-Export des Auswahlrasters und der Übersicht.",
    "nl": "Voer de verdiepingen (niveau, gebruik, bezetting, entree) en de liftgroep (aantal kooien, nominale last, snelheid, versnelling, schok, deur- en overstaptijden) in, of laad een van de gedeelde voorbeeldgebouwen. De tool berekent de rondgangstijd in de ochtendspits met het waarschijnlijke aantal stops S en de hoogste keerverdieping H bij ongelijk bezette verdiepingen, splitst die in rij-, stop-, deur- en overstaptijd en geeft het interval, de 5-minuten-transportcapaciteit in personen en in % van de bezetting, schattingen van de gemiddelde wacht- en reistijd en stoplichten tegen criteria voor kantoren, woningen, hotels en ziekenhuizen. Een keuzeraster toont de groepen van 1–8 kooien, 630–2000 kg en 1–6 m/s die aan de criteria voldoen, met de minste schachten eerst; een zoneringshulp verdeelt een hoog gebouw in twee of drie gestapelde zones met expresrit en verdeelt de kooien; een kinematicagrafiek toont het schokbegrensde snelheidsprofiel. De scenario-JSON wordt gedeeld met de wachttijdsimulator en de energietool; CSV-export van het keuzeraster en de samenvatting.",
    "fr": "Saisissez les niveaux (cote, usage, effectif, accès) et le groupe d’ascenseurs (nombre de cabines, charge nominale, vitesse, accélération, à-coup, temps de porte et de transfert) ou chargez l’un des bâtiments d’exemple partagés. L’outil calcule l’aller-retour en pointe montante avec le nombre probable d’arrêts S et le niveau d’inversion le plus haut H pour des effectifs inégaux par étage, le décompose en temps de course, d’arrêt, de porte et de transfert des passagers, et donne l’intervalle, la capacité de transport sur 5 minutes en personnes et en % de l’effectif, des estimations de l’attente moyenne et du temps de trajet, et des feux tricolores face aux critères pour bureaux, logements, hôtels et hôpitaux. Une grille de choix liste les groupes de 1 à 8 cabines, 630 à 2000 kg et 1 à 6 m/s qui respectent les critères, le moins de gaines d’abord ; une aide au zonage découpe un immeuble de grande hauteur en deux ou trois zones superposées avec trajet express et répartit les cabines ; un graphique cinématique montre le profil de vitesse à à-coup limité. Le JSON de scénario est partagé avec le simulateur d’attente et l’outil énergie ; exports CSV de la grille et du résumé.",
    "es": "Introduzca las plantas (cota, uso, ocupación, acceso) y el grupo de ascensores (número de cabinas, carga nominal, velocidad, aceleración, sobreaceleración, tiempos de puerta y de transferencia) o cargue uno de los edificios de ejemplo compartidos. La herramienta calcula el viaje de ida y vuelta en la punta de subida con el número probable de paradas S y la planta de inversión más alta H para ocupaciones desiguales, lo descompone en tiempo de recorrido, de parada, de puertas y de transferencia de pasajeros, y da el intervalo, la capacidad de transporte en 5 minutos en personas y en % de la población, estimaciones de la espera media y del tiempo de viaje, y semáforos frente a criterios para oficinas, viviendas, hoteles y hospitales. Una cuadrícula de selección lista los grupos de 1–8 cabinas, 630–2000 kg y 1–6 m/s que cumplen los criterios, con menos huecos primero; un asistente de zonificación divide un edificio alto en dos o tres zonas superpuestas con recorrido exprés y reparte las cabinas; un gráfico cinemático muestra el perfil de velocidad con sobreaceleración limitada. El JSON del escenario se comparte con el simulador de espera y la herramienta de energía; exportación CSV de la cuadrícula y del resumen.",
    "pl": "Wprowadź kondygnacje (rzędną, funkcję, liczbę osób, wejście) i grupę dźwigów (liczbę kabin, udźwig, prędkość, przyspieszenie, zryw, czasy drzwi i wymiany pasażerów) albo wczytaj jeden ze wspólnych budynków przykładowych. Narzędzie liczy czas cyklu w szczycie porannym z prawdopodobną liczbą postojów S i najwyższym piętrem nawrotu H przy nierównym zaludnieniu pięter, rozkłada go na czas jazdy, zatrzymań, drzwi i wymiany pasażerów oraz podaje interwał, zdolność przewozową w 5 minut w osobach i w % populacji, szacunki średniego czasu oczekiwania i przejazdu oraz światła wobec kryteriów dla biur, mieszkań, hoteli i szpitali. Siatka doboru wymienia grupy 1–8 kabin, 630–2000 kg i 1–6 m/s spełniające kryteria, od najmniejszej liczby szybów; pomocnik stref dzieli wysoki budynek na dwie lub trzy strefy jedna nad drugą z przejazdem ekspresowym i rozdziela kabiny; wykres kinematyki pokazuje profil prędkości z ograniczonym zrywem. JSON scenariusza jest wspólny z symulatorem oczekiwania i narzędziem energii; eksport CSV siatki doboru i podsumowania."

  "limitations": {
    "en": "Classical up-peak calculation: all passengers board at the main terminal, the car fills to the design load (80 % of the rated persons by default) and the floors above are reached at random in proportion to their population. It does not model down-peak, lunch or inter-floor traffic, double-deck or destination control, basement floors below the main terminal or cars of different sizes in one group (the first car in service stands for all). The waiting time is an empirical estimate valid for car loads of 50–80 %; the design criteria per building use are learning assumptions in the range commonly quoted in planning guides — use the project's or the client's criteria. Check the result with the simulator. Final design per EN 81-20 / ISO 8100-32 by a qualified lift consultant.",
    "uk": "Класичний розрахунок ранкового піку: усі пасажири сідають на основному поверсі, кабіна заповнюється до розрахункового завантаження (за замовчуванням 80 % номінальної місткості), а верхні поверхи досягаються випадково пропорційно їхньому населенню. Не моделюються вечірній пік, обідній і міжповерховий рух, двоповерхові кабіни та керування за поверхом призначення, поверхи нижче основного й кабіни різного розміру в одній групі (усіх представляє перша робоча кабіна). Час очікування — емпірична оцінка, чинна для завантаження 50–80 %; критерії за призначенням будівлі — навчальні припущення в межах, які зазвичай наводять посібники з проєктування, — використовуйте критерії проєкту чи замовника. Перевірте результат симулятором. Остаточний проєкт — за EN 81-20 / ISO 8100-32 кваліфікованим ліфтовим консультантом.",
    "de": "Klassische Berechnung der Morgenspitze: alle Fahrgäste steigen im Hauptzugangsgeschoss ein, die Kabine füllt sich bis zur Auslegungslast (standardmäßig 80 % der Nennpersonenzahl) und die oberen Geschosse werden zufällig im Verhältnis ihrer Belegung angefahren. Nicht modelliert sind Abend- und Mittagsspitze, Zwischengeschossverkehr, Doppeldecker und Zielwahlsteuerung, Geschosse unter dem Hauptzugang und Kabinen verschiedener Größe in einer Gruppe (die erste Kabine in Betrieb steht für alle). Die Wartezeit ist eine empirische Schätzung für Kabinenfüllungen von 50–80 %; die Kriterien je Nutzung sind Lernannahmen im Bereich der üblichen Planungsleitfäden — verwenden Sie die Kriterien des Projekts oder Bauherrn. Prüfen Sie das Ergebnis mit dem Simulator. Endgültige Auslegung nach EN 81-20 / ISO 8100-32 durch einen qualifizierten Aufzugsplaner.",
    "nl": "Klassieke ochtendspitsberekening: alle passagiers stappen in op de hoofdentree, de kooi vult tot de ontwerpbelasting (standaard 80 % van het nominale aantal personen) en de verdiepingen erboven worden willekeurig bereikt naar verhouding van hun bezetting. Niet gemodelleerd: avond- en lunchspits, verkeer tussen verdiepingen, dubbeldekkers en bestemmingskeuze, verdiepingen onder de hoofdentree en kooien van verschillende grootte in één groep (de eerste kooi in dienst staat voor alle). De wachttijd is een empirische schatting voor kooibelastingen van 50–80 %; de criteria per gebouwgebruik zijn leeraannames binnen de bandbreedte die ontwerprichtlijnen gewoonlijk noemen — gebruik de criteria van het project of de opdrachtgever. Controleer het resultaat met de simulator. Definitief ontwerp volgens EN 81-20 / ISO 8100-32 door een gekwalificeerd liftadviseur.",
    "fr": "Calcul classique en pointe montante : tous les passagers montent au niveau d’accès principal, la cabine se remplit jusqu’à la charge de calcul (80 % du nombre nominal de personnes par défaut) et les étages supérieurs sont desservis au hasard en proportion de leur effectif. Ne sont pas modélisés : pointes descendante et de midi, trafic interétages, cabines à double pont et manœuvre à destination, niveaux sous l’accès principal et cabines de tailles différentes dans un même groupe (la première cabine en service représente toutes les autres). L’attente est une estimation empirique valable pour un remplissage de 50 à 80 % ; les critères par usage sont des hypothèses pédagogiques dans la plage couramment citée par les guides de conception — utilisez les critères du projet ou du maître d’ouvrage. Vérifiez le résultat avec le simulateur. Conception finale selon EN 81-20 / ISO 8100-32 par un bureau d’études ascenseurs qualifié.",
    "es": "Cálculo clásico de la punta de subida: todos los pasajeros suben en la planta de acceso principal, la cabina se llena hasta la carga de cálculo (80 % del número nominal de personas por defecto) y las plantas superiores se alcanzan al azar en proporción a su ocupación. No se modelan la punta de bajada ni la del mediodía, el tráfico entre plantas, las cabinas de dos pisos ni el control por destino, las plantas por debajo del acceso principal ni cabinas de distinto tamaño en un grupo (la primera cabina en servicio representa a todas). La espera es una estimación empírica válida para cargas del 50–80 %; los criterios por uso son supuestos didácticos dentro del rango que suelen citar las guías de diseño: use los criterios del proyecto o de la propiedad. Compruebe el resultado con el simulador. Diseño final según EN 81-20 / ISO 8100-32 por un consultor de ascensores cualificado.",
    "pl": "Klasyczne obliczenie szczytu porannego: wszyscy pasażerowie wsiadają na kondygnacji głównego wejścia, kabina napełnia się do obciążenia obliczeniowego (domyślnie 80 % znamionowej liczby osób), a wyższe piętra są osiągane losowo proporcjonalnie do liczby osób. Nie są modelowane: szczyt wieczorny i obiadowy, ruch międzypiętrowy, kabiny dwupokładowe i sterowanie z wyborem celu, kondygnacje poniżej głównego wejścia ani kabiny różnej wielkości w jednej grupie (pierwsza czynna kabina reprezentuje wszystkie). Czas oczekiwania to szacunek empiryczny ważny dla wypełnienia 50–80 %; kryteria dla funkcji budynku to założenia dydaktyczne w zakresie zwykle podawanym w poradnikach projektowych — stosuj kryteria projektu lub inwestora. Sprawdź wynik w symulatorze. Ostateczny projekt według EN 81-20 / ISO 8100-32 wykonuje wykwalifikowany projektant dźwigów."
  },

  'n.awt.below': T7('The design car load is below 50 %: the waiting time is taken as 0.4 × interval (light traffic).', 'Розрахункове завантаження нижче 50 %: очікування взято як 0,4 × інтервал (слабкий рух).', 'Die Auslegungsfüllung liegt unter 50 %: die Wartezeit wird als 0,4 × Intervall angesetzt (schwacher Verkehr).', 'De ontwerpbelasting ligt onder 50 %: de wachttijd is 0,4 × interval (licht verkeer).', 'Le remplissage de calcul est inférieur à 50 % : l’attente est prise égale à 0,4 × intervalle (trafic faible).', 'La carga de cálculo es inferior al 50 %: la espera se toma como 0,4 × intervalo (tráfico ligero).', 'Wypełnienie obliczeniowe poniżej 50 %: oczekiwanie przyjęto jako 0,4 × interwał (mały ruch).'),
  'n.mixed': T7('The cars of this group differ in load or speed; the first car in service stands for all of them.', 'Кабіни цієї групи відрізняються вантажопідйомністю чи швидкістю; усіх представляє перша робоча кабіна.', 'Die Kabinen dieser Gruppe unterscheiden sich in Last oder Geschwindigkeit; die erste Kabine in Betrieb steht für alle.', 'De kooien van deze groep verschillen in last of snelheid; de eerste kooi in dienst staat voor alle.', 'Les cabines de ce groupe diffèrent en charge ou en vitesse ; la première cabine en service les représente toutes.', 'Las cabinas de este grupo difieren en carga o velocidad; la primera cabina en servicio representa a todas.', 'Kabiny tej grupy różnią się udźwigiem lub prędkością; pierwsza czynna kabina reprezentuje wszystkie.'),
  'n.below': T7('Floors below the main entrance (%f) are not part of the classical up-peak formula; their traffic is in the simulator.', 'Поверхи нижче головного входу (%f) не входять у класичну формулу ранкового піку; їхній рух враховує симулятор.', 'Geschosse unter dem Hauptzugang (%f) gehören nicht zur klassischen Formel der Morgenspitze; ihr Verkehr steckt im Simulator.', 'Verdiepingen onder de hoofdentree (%f) vallen buiten de klassieke ochtendspitsformule; hun verkeer zit in de simulator.', 'Les niveaux sous l’accès principal (%f) ne font pas partie de la formule classique ; leur trafic est dans le simulateur.', 'Las plantas bajo el acceso principal (%f) no forman parte de la fórmula clásica; su tráfico está en el simulador.', 'Kondygnacje poniżej głównego wejścia (%f) nie wchodzą do klasycznego wzoru; ich ruch uwzględnia symulator.'),
  'n.speed': T7('The car cannot reach %v m/s within the %d m travel of this group: a slower drive would give the same round trip.', 'Кабіна не досягає %v м/с на висоті підйому %d м цієї групи: повільніший привод дав би той самий рейс.', 'Die Kabine erreicht %v m/s auf der Förderhöhe von %d m dieser Gruppe nicht: ein langsamerer Antrieb ergäbe dieselbe Umlaufzeit.', 'De kooi haalt %v m/s niet binnen de hefhoogte van %d m van deze groep: een tragere aandrijving gaf dezelfde rondgang.', 'La cabine n’atteint pas %v m/s sur la course de %d m de ce groupe : un entraînement plus lent donnerait le même aller-retour.', 'La cabina no alcanza %v m/s en el recorrido de %d m de este grupo: un accionamiento más lento daría la misma vuelta.', 'Kabina nie osiąga %v m/s na wysokości podnoszenia %d m tej grupy: wolniejszy napęd dałby ten sam cykl.'),
  'n.out': T7('%o of %t cars are out of service — the result is for the cars still running.', '%o з %t кабін поза роботою — результат для кабін, що працюють.', '%o von %t Kabinen sind außer Betrieb — das Ergebnis gilt für die laufenden Kabinen.', '%o van %t kooien zijn buiten dienst — het resultaat geldt voor de kooien die rijden.', '%o cabines sur %t sont hors service — le résultat porte sur celles qui fonctionnent.', '%o de %t cabinas están fuera de servicio: el resultado es para las que funcionan.', '%o z %t kabin jest wyłączonych — wynik dotyczy kabin czynnych.'),
  'n.crit': T7('Criteria for %u: at least %a % of the people in 5 min (good %b %), interval at most %c s (good %d s). These are learning assumptions in the range quoted by planning guides — replace them with the project’s criteria.', 'Критерії для «%u»: щонайменше %a % людей за 5 хв (добре — %b %), інтервал не більше %c с (добре — %d с). Це навчальні припущення в межах, які наводять посібники з проєктування, — замініть їх критеріями проєкту.', 'Kriterien für %u: mindestens %a % der Personen in 5 min (gut %b %), Intervall höchstens %c s (gut %d s). Das sind Lernannahmen im Bereich der Planungsleitfäden — ersetzen Sie sie durch die Projektkriterien.', 'Criteria voor %u: minstens %a % van de mensen per 5 min (goed %b %), interval hoogstens %c s (goed %d s). Dit zijn leeraannames binnen de bandbreedte van ontwerprichtlijnen — vervang ze door de projectcriteria.', 'Critères pour %u : au moins %a % des personnes en 5 min (bon : %b %), intervalle au plus %c s (bon : %d s). Ce sont des hypothèses pédagogiques dans la plage des guides de conception — remplacez-les par les critères du projet.', 'Criterios para %u: al menos %a % de las personas en 5 min (bueno: %b %), intervalo como máximo %c s (bueno: %d s). Son supuestos didácticos dentro del rango de las guías de diseño: sustitúyalos por los criterios del proyecto.', 'Kryteria dla „%u”: co najmniej %a % osób w 5 min (dobrze — %b %), interwał najwyżej %c s (dobrze — %d s). To założenia dydaktyczne w zakresie podawanym przez poradniki — zastąp je kryteriami projektu.'),
  'n.sizing.best': T7('Smallest group that meets the criteria: %n × %q kg at %v m/s (interval %i s, %h %). Fully green from %n2 × %q2 kg at %v2 m/s.', 'Найменша група, що відповідає критеріям: %n × %q кг, %v м/с (інтервал %i с, %h %). Повністю зелена — від %n2 × %q2 кг, %v2 м/с.', 'Kleinste Gruppe, die die Kriterien erfüllt: %n × %q kg mit %v m/s (Intervall %i s, %h %). Ganz grün ab %n2 × %q2 kg mit %v2 m/s.', 'Kleinste groep die aan de criteria voldoet: %n × %q kg op %v m/s (interval %i s, %h %). Volledig groen vanaf %n2 × %q2 kg op %v2 m/s.', 'Plus petit groupe conforme : %n × %q kg à %v m/s (intervalle %i s, %h %). Entièrement vert à partir de %n2 × %q2 kg à %v2 m/s.', 'Grupo más pequeño que cumple: %n × %q kg a %v m/s (intervalo %i s, %h %). Totalmente verde desde %n2 × %q2 kg a %v2 m/s.', 'Najmniejsza grupa spełniająca kryteria: %n × %q kg, %v m/s (interwał %i s, %h %). W pełni zielona od %n2 × %q2 kg, %v2 m/s.'),
  'n.sizing.none': T7('No group of up to 8 cars of %q kg at 1–6 m/s meets the criteria for this zone: split the building into zones.', 'Жодна група до 8 кабін %q кг і 1–6 м/с не відповідає критеріям для цієї зони: поділіть будівлю на зони.', 'Keine Gruppe bis 8 Kabinen mit %q kg und 1–6 m/s erfüllt die Kriterien dieser Zone: teilen Sie das Gebäude in Zonen.', 'Geen groep tot 8 kooien van %q kg op 1–6 m/s voldoet aan de criteria voor deze zone: deel het gebouw op in zones.', 'Aucun groupe jusqu’à 8 cabines de %q kg à 1–6 m/s n’est conforme pour cette zone : découpez le bâtiment en zones.', 'Ningún grupo de hasta 8 cabinas de %q kg a 1–6 m/s cumple los criterios en esta zona: divida el edificio en zonas.', 'Żadna grupa do 8 kabin %q kg i 1–6 m/s nie spełnia kryteriów dla tej strefy: podziel budynek na strefy.'),
  'vd.no_cars': T7('no car in service', 'жодної кабіни в роботі', 'keine Kabine in Betrieb', 'geen kooi in bedrijf', 'aucune cabine en service', 'ninguna cabina en servicio', 'żadna kabina nie pracuje'),
  'v.nocars': T7('%g: no car in service (%t cars, all out) — the group carries nobody; interval, handling capacity and waiting time are not defined.',
    '%g: жодної кабіни в роботі (%t кабін, усі вимкнені) — група нікого не перевозить; інтервал, провізна здатність і очікування не визначені.',

    '%g: geen kooi in bedrijf (%t kooien, alle buiten dienst) — de groep vervoert niemand; interval, transportcapaciteit en wachttijd zijn niet gedefinieerd.',
    '%g : aucune cabine en service (%t cabines, toutes à l’arrêt) — le groupe ne transporte personne ; intervalle, capacité de transport et attente ne sont pas définis.',

  'n.awt.adv': T7('The waiting-time light is advisory: the verdict uses only the handling capacity and the interval.',
    'Світлофор часу очікування — довідковий: висновок враховує лише провізну здатність та інтервал.',
    'Die Ampel der Wartezeit ist nur ein Hinweis: das Urteil stützt sich allein auf Förderleistung und Intervall.',
    'Het wachttijdlampje is indicatief: het oordeel gebruikt alleen de transportcapaciteit en het interval.',
    'Le voyant du temps d’attente est indicatif : le verdict ne tient compte que de la capacité de transport et de l’intervalle.',
    'El semáforo del tiempo de espera es orientativo: el veredicto solo usa la capacidad de transporte y el intervalo.',
    'Światło czasu oczekiwania jest pomocnicze: ocena opiera się wyłącznie na zdolności przewozowej i interwale.'),
  'n.formula': T7('Formula vs simulation: this waiting time assumes pure up-peak at the design arrival rate (CIBSE Guide D). The simulator (liftwait) uses the traffic profile with its peaks, mixed traffic and real dispatch, so its waiting times are usually longer — verify the design there.',
    'Формула і симуляція: це очікування передбачає чистий ранковий підйом із розрахунковою інтенсивністю (CIBSE Guide D). Симулятор (liftwait) враховує профіль трафіку з піками, змішаний трафік і реальну диспетчеризацію, тож його очікування зазвичай довші — перевірте проєкт там.',
    'Formel und Simulation: diese Wartezeit setzt reinen Aufwärtsverkehr mit der Bemessungsankunftsrate voraus (CIBSE Guide D). Der Simulator (liftwait) nutzt das Verkehrsprofil mit Spitzen, gemischten Verkehr und echte Steuerung; seine Wartezeiten sind meist länger — prüfen Sie die Auslegung dort.',
    'Formule en simulatie: deze wachttijd gaat uit van zuiver opwaarts spitsverkeer bij de ontwerpaankomst (CIBSE Guide D). De simulator (liftwait) gebruikt het verkeersprofiel met pieken, gemengd verkeer en echte besturing, dus zijn wachttijden zijn meestal langer — controleer het ontwerp daar.',
    'Formule et simulation : ce temps d’attente suppose une pointe montante pure au débit de calcul (CIBSE Guide D). Le simulateur (liftwait) utilise le profil de trafic avec ses pointes, un trafic mixte et une vraie répartition ; ses attentes sont en général plus longues — vérifiez la conception là-bas.',
    'Fórmula y simulación: esta espera supone una punta de subida pura con la llegada de diseño (CIBSE Guide D). El simulador (liftwait) usa el perfil de tráfico con sus picos, tráfico mixto y un despacho real, por lo que sus esperas suelen ser más largas — verifique allí el diseño.',
    'Wzór a symulacja: ten czas oczekiwania zakłada czysty szczyt wejściowy przy projektowym natężeniu (CIBSE Guide D). Symulator (liftwait) używa profilu ruchu ze szczytami, ruchu mieszanego i rzeczywistego sterowania, więc jego czasy oczekiwania są zwykle dłuższe — sprawdź projekt tam.'),
  'n.minload': T7('Hospital: the sizing grid uses only bed lifts of at least %q kg (ISO 8100-30 class III; HTM 08-02 recommends 2500 kg bed passenger lifts).',
    'Лікарня: сітка підбору містить лише ліжкові ліфти від %q кг (ISO 8100-30, клас III; HTM 08-02 рекомендує ліжково-пасажирські ліфти 2500 кг).',
    'Krankenhaus: das Auswahlraster enthält nur Bettenaufzüge ab %q kg (ISO 8100-30 Klasse III; HTM 08-02 empfiehlt Betten-Personenaufzüge mit 2500 kg).',
    'Ziekenhuis: het keuzeraster bevat alleen beddenliften vanaf %q kg (ISO 8100-30 klasse III; HTM 08-02 beveelt beddenliften van 2500 kg aan).',
    'Hôpital : la grille de dimensionnement ne contient que des ascenseurs pour lits d’au moins %q kg (ISO 8100-30 classe III ; le HTM 08-02 recommande des ascenseurs lits-personnes de 2500 kg).',
    'Hospital: la tabla de dimensionado solo usa ascensores para camas de al menos %q kg (ISO 8100-30 clase III; HTM 08-02 recomienda ascensores de camas de 2500 kg).',
    'Szpital: siatka doboru zawiera tylko dźwigi łóżkowe od %q kg (ISO 8100-30 klasa III; HTM 08-02 zaleca dźwigi łóżkowo-osobowe 2500 kg).'),
  'n.zoning.best': T7('Best zoning with %c cars: %k zone(s) — %h % of the people in 5 min, longest interval %i s (%d).', 'Найкраще зонування з %c кабінами: зон — %k; %h % людей за 5 хв, найдовший інтервал %i с (%d).', 'Beste Zonierung mit %c Kabinen: %k Zone(n) — %h % der Personen in 5 min, längstes Intervall %i s (%d).', 'Beste zonering met %c kooien: %k zone(s) — %h % van de mensen per 5 min, langste interval %i s (%d).', 'Meilleur zonage avec %c cabines : %k zone(s) — %h % des personnes en 5 min, intervalle le plus long %i s (%d).', 'Mejor zonificación con %c cabinas: %k zona(s) — %h % de las personas en 5 min, intervalo más largo %i s (%d).', 'Najlepszy podział przy %c kabinach: stref — %k; %h % osób w 5 min, najdłuższy interwał %i s (%d).'),
  'n.kin': T7('A one-floor trip (%d m) takes %t s and peaks at %p m/s; the car reaches its rated %v m/s only on trips of %f floors or more.', 'Поїздка на один поверх (%d м) триває %t с, пікова швидкість %p м/с; номінальні %v м/с кабіна досягає лише на поїздках від %f поверхів.', 'Eine Fahrt über ein Geschoss (%d m) dauert %t s mit Spitze %p m/s; ihre Nenngeschwindigkeit von %v m/s erreicht die Kabine erst ab %f Geschossen.', 'Een rit van één verdieping (%d m) duurt %t s met een top van %p m/s; de nominale %v m/s haalt de kooi pas vanaf %f verdiepingen.', 'Un trajet d’un étage (%d m) dure %t s avec une pointe à %p m/s ; la cabine n’atteint ses %v m/s nominaux qu’à partir de %f étages.', 'Un viaje de una planta (%d m) dura %t s con punta de %p m/s; la cabina solo alcanza sus %v m/s nominales en viajes de %f plantas o más.', 'Jazda o jedno piętro (%d m) trwa %t s, szczyt %p m/s; znamionowe %v m/s kabina osiąga dopiero przy jeździe o %f pięter lub więcej.'),
  'n.kin.never': T7('Within this building the car never reaches its rated %v m/s.', 'У цій будівлі кабіна ніколи не досягає номінальних %v м/с.', 'In diesem Gebäude erreicht die Kabine ihre Nenngeschwindigkeit von %v m/s nie.', 'In dit gebouw haalt de kooi haar nominale %v m/s nooit.', 'Dans ce bâtiment, la cabine n’atteint jamais ses %v m/s nominaux.', 'En este edificio la cabina nunca alcanza sus %v m/s nominales.', 'W tym budynku kabina nigdy nie osiąga znamionowych %v m/s.'),
  'n.origin.stored': T7('Building taken from the scenario stored in this browser (shared with the simulator and the energy tool).', 'Будівлю взято зі сценарію, збереженого в цьому браузері (спільного із симулятором та інструментом енергії).', 'Gebäude aus dem in diesem Browser gespeicherten Szenario (gemeinsam mit Simulator und Energiewerkzeug).', 'Gebouw uit het in deze browser opgeslagen scenario (gedeeld met de simulator en de energietool).', 'Bâtiment repris du scénario enregistré dans ce navigateur (partagé avec le simulateur et l’outil énergie).', 'Edificio tomado del escenario guardado en este navegador (compartido con el simulador y la herramienta de energía).', 'Budynek ze scenariusza zapisanego w tej przeglądarce (wspólnego z symulatorem i narzędziem energii).'),
  'n.saved': T7('Scenario saved in this browser — the simulator and the energy tool open it.', 'Сценарій збережено в браузері — симулятор та інструмент енергії відкриють його.', 'Szenario im Browser gespeichert — Simulator und Energiewerkzeug öffnen es.', 'Scenario in de browser opgeslagen — simulator en energietool openen het.', 'Scénario enregistré dans le navigateur — le simulateur et l’outil énergie l’ouvriront.', 'Escenario guardado en el navegador: el simulador y la herramienta de energía lo abrirán.', 'Scenariusz zapisany w przeglądarce — symulator i narzędzie energii go otworzą.'),

  'n.applied': T7('Applied: %s.', 'Застосовано: %s.', 'Übernommen: %s.', 'Toegepast: %s.', 'Appliqué : %s.', 'Aplicado: %s.', 'Zastosowano: %s.'),
  'n.nocore': T7('vt-core.js or vt-traffic.js did not load — the calculation is unavailable.', 'vt-core.js або vt-traffic.js не завантажився — розрахунок недоступний.', 'vt-core.js oder vt-traffic.js wurde nicht geladen — keine Berechnung möglich.', 'vt-core.js of vt-traffic.js is niet geladen — de berekening is niet beschikbaar.', 'vt-core.js ou vt-traffic.js ne s’est pas chargé — le calcul est indisponible.', 'vt-core.js o vt-traffic.js no se cargó: el cálculo no está disponible.', 'Nie wczytano vt-core.js lub vt-traffic.js — obliczenie jest niedostępne.'),
  'n.groups': T7('The building has %n lift groups; the tiles show group %g — all groups together move %h % of the building in 5 min.', 'Будівля має %n груп ліфтів; плитки показують групу %g — усі групи разом перевозять %h % людей будівлі за 5 хв.', 'Das Gebäude hat %n Aufzugsgruppen; die Kacheln zeigen Gruppe %g — alle Gruppen zusammen befördern %h % des Gebäudes in 5 min.', 'Het gebouw heeft %n liftgroepen; de tegels tonen groep %g — alle groepen samen vervoeren %h % van het gebouw per 5 min.', 'Le bâtiment compte %n groupes ; les tuiles montrent le groupe %g — ensemble, les groupes transportent %h % du bâtiment en 5 min.', 'El edificio tiene %n grupos; los recuadros muestran el grupo %g — todos juntos trasladan el %h % del edificio en 5 min.', 'Budynek ma %n grupy dźwigów; kafelki pokazują grupę %g — wszystkie grupy razem przewożą %h % osób w 5 min.'),

  topics: {
    rtt: { title: T7('Round-trip time', 'Час кругового рейсу', 'Umlaufzeit', 'Rondgangstijd', 'Temps d’aller-retour', 'Tiempo de ida y vuelta', 'Czas cyklu'),
      body: T7('One car leaves the lobby with P people, stops S times on the way up to let them out, reverses at floor H and comes back express. RTT adds travel at rated speed over 2H floors (plus the express run of a high zone), (S + 1) stops — each costs braking, accelerating, start delay and the door opening and closing — and 2P passenger transfers (in at the lobby, out upstairs). The chart shows which part dominates: on short floors it is rarely the speed.',
        'Кабіна рушає з вестибюля з P людьми, робить S зупинок угору, щоб їх висадити, розвертається на поверсі H і повертається без зупинок. RTT складається з руху з номінальною швидкістю на 2H поверхів (плюс експресний перегін високої зони), (S + 1) зупинок — кожна коштує гальмування, розгону, затримки старту й відчинення та зачинення дверей — і 2P входів-виходів пасажирів. Графік показує, яка складова переважає: на невисоких поверхах це рідко швидкість.',
        'Eine Kabine fährt mit P Personen aus der Halle ab, hält S-mal auf dem Weg nach oben, kehrt im Geschoss H um und fährt express zurück. RTT addiert die Fahrt mit Nenngeschwindigkeit über 2H Geschosse (plus die Expressfahrt einer hohen Zone), (S + 1) Halte — jeder kostet Bremsen, Anfahren, Anfahrverzögerung, Öffnen und Schließen der Türen — und 2P Fahrgastwechsel. Das Diagramm zeigt, was dominiert: bei niedrigen Geschossen selten die Geschwindigkeit.',
        'Een kooi vertrekt uit de lobby met P mensen, stopt S keer op weg naar boven, keert op verdieping H en komt express terug. RTT telt het rijden op nominale snelheid over 2H verdiepingen (plus de expresrit van een hoge zone), (S + 1) stops — elk kost remmen, optrekken, startvertraging en deuren openen en sluiten — en 2P keer in- of uitstappen. De grafiek toont wat overheerst: bij lage verdiepingen zelden de snelheid.',
        'Une cabine quitte le hall avec P personnes, s’arrête S fois en montant, s’inverse au niveau H et redescend en express. Le RTT additionne la course à vitesse nominale sur 2H étages (plus le trajet express d’une zone haute), (S + 1) arrêts — chacun coûte freinage, accélération, retard au démarrage, ouverture et fermeture des portes — et 2P transferts de passagers. Le graphique montre ce qui domine : avec des étages courants, rarement la vitesse.',
        'Una cabina sale del vestíbulo con P personas, para S veces al subir, invierte en la planta H y vuelve exprés. El RTT suma el recorrido a velocidad nominal sobre 2H plantas (más el tramo exprés de una zona alta), (S + 1) paradas — cada una cuesta frenado, aceleración, retardo de arranque y apertura y cierre de puertas — y 2P transferencias de pasajeros. El gráfico muestra qué domina: con plantas normales, rara vez la velocidad.',
        'Kabina rusza z holu z P osobami, zatrzymuje się S razy w drodze w górę, zawraca na piętrze H i wraca ekspresowo. RTT sumuje jazdę z prędkością znamionową przez 2H pięter (plus przejazd ekspresowy wysokiej strefy), (S + 1) postojów — każdy to hamowanie, rozruch, opóźnienie startu oraz otwarcie i zamknięcie drzwi — i 2P wymian pasażerów. Wykres pokazuje, co dominuje: przy zwykłych piętrach rzadko prędkość.') },
    sh: { title: T7('Probable stops S and reversal floor H', 'Імовірні зупинки S і поверх розвороту H', 'Wahrscheinliche Halte S und Umkehrgeschoss H', 'Waarschijnlijke stops S en keerverdieping H', 'Arrêts probables S et niveau d’inversion H', 'Paradas probables S y planta de inversión H', 'Prawdopodobne postoje S i piętro nawrotu H'),
      body: T7('With P people choosing floors at random in proportion to the floor population, floor i gets no stop with probability (1 − Uᵢ)ᴾ, so S = N − Σ(1 − Uᵢ)ᴾ. The car goes no higher than floor j if everybody chose j or below — probability (U₁ + … + Uⱼ)ᴾ — which gives H. A full car with 13 people in a 15-floor office stops about 9 times and almost always reaches the top.',
        'Якщо P людей обирають поверхи випадково пропорційно їхньому населенню, поверх i лишається без зупинки з імовірністю (1 − Uᵢ)ᴾ, тож S = N − Σ(1 − Uᵢ)ᴾ. Кабіна не підніметься вище поверху j, якщо всі обрали j або нижче, — імовірність (U₁ + … + Uⱼ)ᴾ, — звідси H. Кабіна з 13 людьми в 15-поверховому офісі зупиняється близько 9 разів і майже завжди доходить до верху.',
        'Wählen P Personen die Geschosse zufällig im Verhältnis ihrer Belegung, bleibt Geschoss i mit der Wahrscheinlichkeit (1 − Uᵢ)ᴾ ohne Halt, also S = N − Σ(1 − Uᵢ)ᴾ. Die Kabine fährt nicht höher als j, wenn alle j oder tiefer gewählt haben — Wahrscheinlichkeit (U₁ + … + Uⱼ)ᴾ —, daraus folgt H. Eine Kabine mit 13 Personen hält in einem 15-geschossigen Büro etwa 9-mal und erreicht fast immer das oberste Geschoss.',
        'Als P mensen willekeurig verdiepingen kiezen naar verhouding van de bezetting, krijgt verdieping i geen stop met kans (1 − Uᵢ)ᴾ, dus S = N − Σ(1 − Uᵢ)ᴾ. De kooi gaat niet hoger dan j als iedereen j of lager koos — kans (U₁ + … + Uⱼ)ᴾ — en dat geeft H. Een kooi met 13 mensen in een kantoor van 15 verdiepingen stopt ongeveer 9 keer en haalt bijna altijd de top.',
        'Si P personnes choisissent les étages au hasard en proportion de leur effectif, l’étage i n’a pas d’arrêt avec la probabilité (1 − Uᵢ)ᴾ, d’où S = N − Σ(1 − Uᵢ)ᴾ. La cabine ne monte pas plus haut que j si tous ont choisi j ou en dessous — probabilité (U₁ + … + Uⱼ)ᴾ — ce qui donne H. Une cabine de 13 personnes dans des bureaux de 15 étages s’arrête environ 9 fois et atteint presque toujours le sommet.',
        'Si P personas eligen plantas al azar en proporción a su ocupación, la planta i queda sin parada con probabilidad (1 − Uᵢ)ᴾ, así que S = N − Σ(1 − Uᵢ)ᴾ. La cabina no sube más allá de j si todos eligieron j o inferior — probabilidad (U₁ + … + Uⱼ)ᴾ —, de ahí H. Una cabina con 13 personas en una oficina de 15 plantas para unas 9 veces y casi siempre llega arriba.',
        'Gdy P osób wybiera piętra losowo proporcjonalnie do ich zaludnienia, piętro i nie ma postoju z prawdopodobieństwem (1 − Uᵢ)ᴾ, więc S = N − Σ(1 − Uᵢ)ᴾ. Kabina nie wjedzie wyżej niż j, jeśli wszyscy wybrali j lub niżej — prawdopodobieństwo (U₁ + … + Uⱼ)ᴾ — stąd H. Kabina z 13 osobami w 15-kondygnacyjnym biurowcu zatrzymuje się ok. 9 razy i prawie zawsze dojeżdża na górę.') },
    interval: { title: T7('Interval', 'Інтервал', 'Intervall', 'Interval', 'Intervalle', 'Intervalo', 'Interwał'),
      body: T7('INT = RTT / L: with L cars evenly spread, a car leaves the lobby every INT seconds. It is the planner’s first quality measure: the waiting time follows from it. More cars shorten it in direct proportion; faster cars only shorten the travel part of RTT.',
        'INT = RTT / L: якщо L кабін рівномірно розподілені, кабіна рушає з вестибюля кожні INT секунд. Це перша міра якості для проєктувальника: з нього випливає очікування. Більше кабін скорочує інтервал прямо пропорційно; швидші кабіни скорочують лише складову руху в RTT.',
        'INT = RTT / L: bei L gleichmäßig verteilten Kabinen fährt alle INT Sekunden eine aus der Halle ab. Das ist das erste Gütemaß des Planers: die Wartezeit folgt daraus. Mehr Kabinen verkürzen es proportional; schnellere Kabinen verkürzen nur den Fahranteil der RTT.',
        'INT = RTT / L: met L gelijkmatig verdeelde kooien vertrekt er elke INT seconden een uit de lobby. Het is de eerste kwaliteitsmaat van de ontwerper: de wachttijd volgt eruit. Meer kooien verkorten het evenredig; snellere kooien verkorten alleen het rijdeel van de RTT.',
        'INT = RTT / L : avec L cabines bien réparties, une cabine quitte le hall toutes les INT secondes. C’est la première mesure de qualité du concepteur : l’attente en découle. Plus de cabines la réduisent proportionnellement ; des cabines plus rapides ne réduisent que la part de course du RTT.',
        'INT = RTT / L: con L cabinas bien repartidas, una cabina sale del vestíbulo cada INT segundos. Es la primera medida de calidad del proyectista: de ella se deriva la espera. Más cabinas lo acortan proporcionalmente; cabinas más rápidas solo acortan la parte de recorrido del RTT.',
        'INT = RTT / L: przy L równomiernie rozłożonych kabinach co INT sekund jedna odjeżdża z holu. To pierwsza miara jakości projektanta: z niej wynika oczekiwanie. Więcej kabin skraca go proporcjonalnie; szybsze kabiny skracają tylko składnik jazdy w RTT.') },
    hc5: { title: T7('Handling capacity in 5 minutes', 'Пропускна здатність за 5 хвилин', 'Förderleistung in 5 Minuten', 'Transportcapaciteit in 5 minuten', 'Capacité de transport sur 5 minutes', 'Capacidad de transporte en 5 minutos', 'Zdolność przewozowa w 5 minut'),
      body: T7('HC5 = 300·P·L / RTT persons: how many people the group lifts out of the lobby in the busiest 5 minutes. Divided by the people present above the lobby it becomes %POP — the share of the building that can arrive in 5 minutes. If the arrival rate is higher than this, queues in the lobby grow without limit; the simulator shows that.',
        'HC5 = 300·P·L / RTT осіб: скільки людей група забирає з вестибюля за найнапруженіші 5 хвилин. Поділене на кількість присутніх над вестибюлем, це %POP — частка будівлі, що може прибути за 5 хвилин. Якщо люди приходять швидше, черга у вестибюлі росте без меж; симулятор це показує.',
        'HC5 = 300·P·L / RTT Personen: so viele Menschen holt die Gruppe in den stärksten 5 Minuten aus der Halle. Geteilt durch die Anwesenden über der Halle ergibt das %POP — der Anteil des Gebäudes, der in 5 Minuten ankommen kann. Kommen mehr, wächst die Schlange in der Halle ohne Grenze; der Simulator zeigt das.',
        'HC5 = 300·P·L / RTT personen: zoveel mensen haalt de groep in de drukste 5 minuten uit de lobby. Gedeeld door de aanwezigen boven de lobby wordt dat %POP — het aandeel van het gebouw dat in 5 minuten kan aankomen. Komen er meer, dan groeit de rij in de lobby onbeperkt; de simulator laat het zien.',
        'HC5 = 300·P·L / RTT personnes : le nombre de personnes que le groupe enlève du hall pendant les 5 minutes les plus chargées. Divisé par les présents au-dessus du hall, cela donne %POP — la part du bâtiment qui peut arriver en 5 minutes. Au-delà, la file au hall grandit sans limite ; le simulateur le montre.',
        'HC5 = 300·P·L / RTT personas: cuántas personas saca el grupo del vestíbulo en los 5 minutos de más tráfico. Dividido por los presentes sobre el vestíbulo da %POP: la parte del edificio que puede llegar en 5 minutos. Si llegan más, la cola del vestíbulo crece sin límite; el simulador lo muestra.',
        'HC5 = 300·P·L / RTT osób: tyle osób grupa zabiera z holu w najbardziej obciążonych 5 minutach. Podzielone przez osoby obecne nad holem daje %POP — udział budynku, który może przybyć w 5 minut. Jeśli przychodzi więcej, kolejka w holu rośnie bez końca; symulator to pokazuje.') },
    awt: { title: T7('Waiting time estimate', 'Оцінка часу очікування', 'Schätzung der Wartezeit', 'Schatting van de wachttijd', 'Estimation de l’attente', 'Estimación de la espera', 'Szacunek czasu oczekiwania'),
      body: T7('An empirical relation for the up-peak, fitted to simulations: AWT ≈ INT·(0.4 + (1.8·P/CC − 0.77)²), valid for car loads between 50 % and 80 % of the rated persons. At 80 % load it gives about 0.85 × interval. It is an estimate for comparing options; the simulator measures the wait person by person.',
        'Емпіричне співвідношення для ранкового піку, підібране за симуляціями: AWT ≈ INT·(0,4 + (1,8·P/CC − 0,77)²), чинне для завантаження від 50 % до 80 % номінальної кількості осіб. При завантаженні 80 % дає близько 0,85 × інтервалу. Це оцінка для порівняння варіантів; симулятор вимірює очікування кожної людини.',
        'Eine empirische, an Simulationen angepasste Beziehung für die Morgenspitze: AWT ≈ INT·(0,4 + (1,8·P/CC − 0,77)²), gültig für Kabinenfüllungen zwischen 50 % und 80 % der Nennpersonenzahl. Bei 80 % ergibt sie etwa 0,85 × Intervall. Sie dient dem Vergleich von Varianten; der Simulator misst die Wartezeit Person für Person.',
        'Een empirische, op simulaties gefitte relatie voor de ochtendspits: AWT ≈ INT·(0,4 + (1,8·P/CC − 0,77)²), geldig voor kooibelastingen tussen 50 % en 80 % van het nominale aantal personen. Bij 80 % geeft ze ongeveer 0,85 × interval. Ze dient om opties te vergelijken; de simulator meet de wachttijd per persoon.',
        'Une relation empirique ajustée sur des simulations de pointe montante : AWT ≈ INT·(0,4 + (1,8·P/CC − 0,77)²), valable pour un remplissage entre 50 % et 80 % du nombre nominal de personnes. À 80 %, elle donne environ 0,85 × intervalle. C’est une estimation pour comparer des options ; le simulateur mesure l’attente personne par personne.',
        'Una relación empírica ajustada a simulaciones de punta de subida: AWT ≈ INT·(0,4 + (1,8·P/CC − 0,77)²), válida para cargas entre el 50 % y el 80 % de las personas nominales. Al 80 % da cerca de 0,85 × intervalo. Es una estimación para comparar opciones; el simulador mide la espera persona a persona.',
        'Empiryczna zależność dla szczytu porannego dopasowana do symulacji: AWT ≈ INT·(0,4 + (1,8·P/CC − 0,77)²), ważna dla wypełnienia od 50 % do 80 % znamionowej liczby osób. Przy 80 % daje ok. 0,85 × interwał. To szacunek do porównywania wariantów; symulator mierzy oczekiwanie każdej osoby.') },
    kinematics: { title: T7('Why short trips never reach rated speed', 'Чому короткі поїздки не досягають номінальної швидкості', 'Warum kurze Fahrten nie die Nenngeschwindigkeit erreichen', 'Waarom korte ritten nooit de nominale snelheid halen', 'Pourquoi les trajets courts n’atteignent jamais la vitesse nominale', 'Por qué los viajes cortos nunca alcanzan la velocidad nominal', 'Dlaczego krótkie jazdy nie osiągają prędkości znamionowej'),
      body: T7('Comfort limits the acceleration (about 1 m/s²) and its rate of change, the jerk (about 1.5 m/s³). To reach v and stop again the car needs v²/a + v·a/j metres — 7.9 m at 2.5 m/s, 40 m at 6 m/s. A one-floor trip is shorter, so the car accelerates, brakes and never cruises. That is why the stop time t_s in RTT is so large, and why a faster drive helps tall zones and express runs, not short hops.',
        'Комфорт обмежує прискорення (близько 1 м/с²) і швидкість його зміни — ривок (близько 1,5 м/с³). Щоб досягти v і знову зупинитися, кабіні треба v²/a + v·a/j метрів — 7,9 м при 2,5 м/с, 40 м при 6 м/с. Поїздка на один поверх коротша, тож кабіна розганяється, гальмує й ніколи не їде рівномірно. Тому час зупинки t_s у RTT такий великий, і тому швидший привод допомагає високим зонам та експресним перегонам, а не коротким переїздам.',
        'Der Komfort begrenzt die Beschleunigung (etwa 1 m/s²) und ihre Änderungsrate, den Ruck (etwa 1,5 m/s³). Um v zu erreichen und wieder anzuhalten, braucht die Kabine v²/a + v·a/j Meter — 7,9 m bei 2,5 m/s, 40 m bei 6 m/s. Eine Fahrt über ein Geschoss ist kürzer: die Kabine beschleunigt, bremst und fährt nie konstant. Darum ist die Haltezeit t_s in der RTT so groß, und darum hilft ein schnellerer Antrieb hohen Zonen und Expressfahrten, nicht kurzen Sprüngen.',
        'Comfort beperkt de versnelling (ongeveer 1 m/s²) en de verandering ervan, de schok (ongeveer 1,5 m/s³). Om v te halen en weer te stoppen heeft de kooi v²/a + v·a/j meter nodig — 7,9 m bij 2,5 m/s, 40 m bij 6 m/s. Een rit van één verdieping is korter: de kooi trekt op, remt en rijdt nooit constant. Daarom is de stoptijd t_s in de RTT zo groot, en daarom helpt een snellere aandrijving hoge zones en expresritten, geen korte sprongen.',
        'Le confort limite l’accélération (environ 1 m/s²) et sa variation, l’à-coup (environ 1,5 m/s³). Pour atteindre v et s’arrêter, la cabine a besoin de v²/a + v·a/j mètres — 7,9 m à 2,5 m/s, 40 m à 6 m/s. Un trajet d’un étage est plus court : la cabine accélère, freine et ne roule jamais à vitesse constante. D’où le temps d’arrêt t_s si important dans le RTT, et un entraînement plus rapide utile aux zones hautes et aux trajets express, pas aux sauts courts.',
        'El confort limita la aceleración (cerca de 1 m/s²) y su variación, la sobreaceleración (cerca de 1,5 m/s³). Para alcanzar v y volver a parar la cabina necesita v²/a + v·a/j metros: 7,9 m a 2,5 m/s, 40 m a 6 m/s. Un viaje de una planta es más corto: la cabina acelera, frena y nunca va a velocidad constante. Por eso el tiempo de parada t_s del RTT es tan grande, y por eso un accionamiento más rápido ayuda a las zonas altas y los tramos exprés, no a los saltos cortos.',
        'Komfort ogranicza przyspieszenie (ok. 1 m/s²) i tempo jego zmiany — zryw (ok. 1,5 m/s³). Aby osiągnąć v i znów stanąć, kabina potrzebuje v²/a + v·a/j metrów — 7,9 m przy 2,5 m/s, 40 m przy 6 m/s. Jazda o jedno piętro jest krótsza: kabina przyspiesza, hamuje i nigdy nie jedzie ze stałą prędkością. Dlatego czas postoju t_s w RTT jest tak duży i dlatego szybszy napęd pomaga wysokim strefom i przejazdom ekspresowym, a nie krótkim skokom.') },
    sizing: { title: T7('Sizing grid', 'Сітка підбору', 'Auswahlraster', 'Keuzeraster', 'Grille de choix', 'Cuadrícula de selección', 'Siatka doboru'),
      body: T7('The tool recomputes the round trip for 1–8 cars, the preferred rated loads 630–2000 kg (ISO 8100-30) and speeds 1–6 m/s, keeping your floors, door times and acceleration. An option counts only if the car can actually reach its speed within the travel. The list starts with the fewest shafts (shafts cost floor area on every storey), then the smaller car, then the slower drive.',
        'Інструмент перераховує круговий рейс для 1–8 кабін, рекомендованих вантажопідйомностей 630–2000 кг (ISO 8100-30) і швидкостей 1–6 м/с, зберігаючи ваші поверхи, час дверей і прискорення. Варіант зараховується, лише якщо кабіна справді досягає своєї швидкості на висоті підйому. Перелік починається з найменшої кількості шахт (шахти забирають площу на кожному поверсі), далі менша кабіна, далі повільніший привод.',
        'Das Werkzeug rechnet den Umlauf für 1–8 Kabinen, die Vorzugsnennlasten 630–2000 kg (ISO 8100-30) und 1–6 m/s neu, mit Ihren Geschossen, Türzeiten und Beschleunigungen. Eine Variante zählt nur, wenn die Kabine ihre Geschwindigkeit innerhalb der Förderhöhe tatsächlich erreicht. Die Liste beginnt mit den wenigsten Schächten (Schächte kosten Fläche in jedem Geschoss), dann kleinere Kabine, dann langsamerer Antrieb.',
        'De tool herberekent de rondgang voor 1–8 kooien, de voorkeurslasten 630–2000 kg (ISO 8100-30) en 1–6 m/s, met uw verdiepingen, deurtijden en versnelling. Een optie telt alleen als de kooi haar snelheid binnen de hefhoogte echt haalt. De lijst begint met de minste schachten (schachten kosten vloeroppervlak op elke verdieping), dan de kleinere kooi, dan de tragere aandrijving.',
        'L’outil recalcule l’aller-retour pour 1 à 8 cabines, les charges préférentielles de 630 à 2000 kg (ISO 8100-30) et des vitesses de 1 à 6 m/s, en gardant vos niveaux, temps de porte et accélération. Une option ne compte que si la cabine atteint réellement sa vitesse sur la course. La liste commence par le moins de gaines (elles coûtent de la surface à chaque étage), puis la plus petite cabine, puis l’entraînement le plus lent.',
        'La herramienta recalcula la vuelta para 1–8 cabinas, las cargas preferentes de 630–2000 kg (ISO 8100-30) y velocidades de 1–6 m/s, manteniendo sus plantas, tiempos de puerta y aceleración. Una opción solo cuenta si la cabina alcanza de verdad su velocidad en el recorrido. La lista empieza por menos huecos (cada hueco cuesta superficie en todas las plantas), luego la cabina menor y luego el accionamiento más lento.',
        'Narzędzie przelicza cykl dla 1–8 kabin, zalecanych udźwigów 630–2000 kg (ISO 8100-30) i prędkości 1–6 m/s, zachowując Twoje kondygnacje, czasy drzwi i przyspieszenie. Wariant liczy się tylko wtedy, gdy kabina rzeczywiście osiąga swoją prędkość na wysokości podnoszenia. Lista zaczyna się od najmniejszej liczby szybów (szyb zabiera powierzchnię na każdym piętrze), potem mniejsza kabina, potem wolniejszy napęd.') },
    zoning: { title: T7('Zoning tall buildings', 'Зонування висотних будівель', 'Zonierung hoher Gebäude', 'Zonering van hoge gebouwen', 'Zonage des immeubles de grande hauteur', 'Zonificación de edificios altos', 'Strefy w wysokich budynkach'),
      body: T7('Above about 15–20 floors one group serving everything stops too often: S grows and every round trip gets long. Splitting the floors into stacked zones, each with its own cars running express through the lower floors, cuts the stops per trip. The helper tries every split into 1, 2 or 3 zones (at least two floors each), gives each zone at least two cars (so that a zone keeps a lift when one is out of service) and then the next car always to the zone with the lowest handling capacity, and keeps the split with the best rating and the strongest weakest zone.',
        'Вище приблизно 15–20 поверхів одна група на всі поверхи зупиняється надто часто: S зростає, і кожен рейс стає довгим. Поділ поверхів на зони одна над одною, кожна з власними кабінами, що проходять нижні поверхи експресом, зменшує кількість зупинок за рейс. Помічник перебирає всі поділи на 1, 2 чи 3 зони (щонайменше по два поверхи), дає кожній зоні щонайменше дві кабіни (щоб зона не лишилася без ліфта, коли один на обслуговуванні), а кожну наступну — зоні з найменшою пропускною здатністю, і залишає поділ із найкращою оцінкою та найсильнішою слабкою зоною.',
        'Ab etwa 15–20 Geschossen hält eine Gruppe für alles zu oft: S wächst und jede Rundfahrt wird lang. Die Aufteilung in übereinanderliegende Zonen mit eigenen Kabinen, die die unteren Geschosse express durchfahren, senkt die Halte je Fahrt. Die Hilfe probiert jede Aufteilung in 1, 2 oder 3 Zonen (je mindestens zwei Geschosse), gibt jeder Zone mindestens zwei Kabinen (damit eine Zone bei Wartung nicht ohne Aufzug ist), jede weitere der Zone mit der geringsten Förderleistung, und behält die Aufteilung mit der besten Bewertung und der stärksten schwächsten Zone.',
        'Boven ongeveer 15–20 verdiepingen stopt één groep voor alles te vaak: S groeit en elke rondgang wordt lang. De verdiepingen opdelen in gestapelde zones, elk met eigen kooien die express langs de lagere verdiepingen rijden, verlaagt het aantal stops per rit. De hulp probeert elke verdeling in 1, 2 of 3 zones (minstens twee verdiepingen elk), geeft elke zone minstens twee kooien (zodat een zone een lift houdt als er één in onderhoud is) en elke volgende aan de zone met de laagste capaciteit, en houdt de verdeling met de beste beoordeling en de sterkste zwakste zone.',
        'Au-delà d’environ 15 à 20 étages, un groupe unique s’arrête trop souvent : S augmente et chaque aller-retour s’allonge. Découper les étages en zones superposées, chacune avec ses cabines qui traversent les étages bas en express, réduit les arrêts par voyage. L’aide essaie tous les découpages en 1, 2 ou 3 zones (au moins deux étages chacune), donne au moins deux cabines à chaque zone (pour qu’une zone garde un ascenseur quand l’autre est en maintenance) puis chaque cabine suivante à la zone la moins bien servie, et garde le découpage le mieux noté dont la zone la plus faible est la plus forte.',
        'Por encima de unas 15–20 plantas un solo grupo para todo para demasiado: S crece y cada vuelta se alarga. Dividir las plantas en zonas superpuestas, cada una con sus cabinas que cruzan las plantas bajas en exprés, reduce las paradas por viaje. El asistente prueba todos los repartos en 1, 2 o 3 zonas (al menos dos plantas cada una), da al menos dos cabinas a cada zona (para que una zona no se quede sin ascensor durante el mantenimiento) y cada cabina siguiente a la zona con menos capacidad, y se queda con el reparto mejor valorado cuya zona más débil es la más fuerte.',
        'Powyżej ok. 15–20 kondygnacji jedna grupa na wszystkie piętra zatrzymuje się za często: S rośnie i każdy cykl się wydłuża. Podział pięter na strefy jedna nad drugą, każda z własnymi kabinami przejeżdżającymi ekspresowo przez niższe piętra, zmniejsza liczbę postojów na kurs. Pomocnik sprawdza każdy podział na 1, 2 lub 3 strefy (co najmniej po dwa piętra), daje każdej strefie co najmniej dwie kabiny (by strefa nie została bez dźwigu podczas konserwacji), a każdą następną strefie o najmniejszej zdolności przewozowej, i zostawia podział z najlepszą oceną i najsilniejszą najsłabszą strefą.') },
    criteria: { title: T7('Design criteria', 'Критерії проєктування', 'Auslegungskriterien', 'Ontwerpcriteria', 'Critères de conception', 'Criterios de diseño', 'Kryteria projektowe'),
      body: T7('Planning guides quote handling capacities and intervals by building use: offices roughly 12–15 % in 5 min and 25–30 s, flats far less but with intervals up to about a minute, hotels and hospitals in between. The exact table values could not be checked here against the current paid editions, so the tool labels them learning assumptions. Green = good value, amber = minimum met, red = not met. Use your project’s or client’s criteria.',
        'Посібники з проєктування наводять пропускну здатність та інтервали за призначенням будівлі: офіси — приблизно 12–15 % за 5 хв і 25–30 с, житло — значно менше, але з інтервалом до хвилини, готелі й лікарні — посередині. Точні табличні значення тут не вдалося звірити з чинними платними виданнями, тому інструмент позначає їх як навчальні припущення. Зелений — добре значення, жовтий — мінімум виконано, червоний — не виконано. Використовуйте критерії вашого проєкту чи замовника.',
        'Planungsleitfäden nennen Förderleistungen und Intervalle je Nutzung: Büros etwa 12–15 % in 5 min und 25–30 s, Wohnbauten deutlich weniger, aber mit Intervallen bis etwa einer Minute, Hotels und Krankenhäuser dazwischen. Die genauen Tabellenwerte ließen sich hier nicht mit den aktuellen kostenpflichtigen Ausgaben abgleichen, daher kennzeichnet das Werkzeug sie als Lernannahmen. Grün = guter Wert, Gelb = Minimum erfüllt, Rot = nicht erfüllt. Verwenden Sie die Kriterien Ihres Projekts oder Bauherrn.',
        'Ontwerprichtlijnen noemen transportcapaciteiten en intervallen per gebouwgebruik: kantoren ongeveer 12–15 % per 5 min en 25–30 s, woningen veel minder maar met intervallen tot ongeveer een minuut, hotels en ziekenhuizen ertussenin. De exacte tabelwaarden konden hier niet worden gecontroleerd tegen de huidige betaalde edities, dus de tool noemt ze leeraannames. Groen = goede waarde, oranje = minimum gehaald, rood = niet gehaald. Gebruik de criteria van uw project of opdrachtgever.',
        'Les guides de conception citent capacités et intervalles par usage : bureaux environ 12–15 % en 5 min et 25–30 s, logements bien moins mais avec des intervalles jusqu’à environ une minute, hôtels et hôpitaux entre les deux. Les valeurs exactes des tableaux n’ont pas pu être vérifiées ici dans les éditions payantes actuelles ; l’outil les présente donc comme hypothèses pédagogiques. Vert = bonne valeur, orange = minimum atteint, rouge = non atteint. Utilisez les critères de votre projet ou du maître d’ouvrage.',
        'Las guías de diseño citan capacidades e intervalos por uso: oficinas en torno al 12–15 % en 5 min y 25–30 s, viviendas mucho menos pero con intervalos de hasta un minuto, hoteles y hospitales en medio. Los valores exactos de las tablas no se han podido comprobar aquí con las ediciones de pago vigentes, así que la herramienta los marca como supuestos didácticos. Verde = valor bueno, ámbar = mínimo cumplido, rojo = no cumplido. Use los criterios de su proyecto o de la propiedad.',
        'Poradniki projektowe podają zdolność przewozową i interwały według funkcji budynku: biura ok. 12–15 % w 5 min i 25–30 s, mieszkania znacznie mniej, ale z interwałem do ok. minuty, hotele i szpitale pośrodku. Dokładnych wartości tabel nie dało się tu sprawdzić w aktualnych płatnych wydaniach, więc narzędzie oznacza je jako założenia dydaktyczne. Zielony = dobra wartość, żółty = minimum spełnione, czerwony = niespełnione. Stosuj kryteria swojego projektu lub inwestora.') },
    scenario: { title: T7('One building, three tools', 'Одна будівля — три інструменти', 'Ein Gebäude, drei Werkzeuge', 'Eén gebouw, drie tools', 'Un bâtiment, trois outils', 'Un edificio, tres herramientas', 'Jeden budynek, trzy narzędzia'),
      body: T7('The building, the lift groups and the traffic live in one scenario file shared with the waiting-time simulator and the energy tool. “Verify in the simulator” saves it with this tool’s results and opens the simulator: the formula assumes a perfectly regular service, the simulator shows bunching, queues and the real spread of waiting times.',
        'Будівля, групи ліфтів і рух зберігаються в одному файлі сценарію, спільному із симулятором очікування та інструментом енергії. «Перевірити в симуляторі» зберігає його з результатами цього інструмента й відкриває симулятор: формула припускає ідеально рівномірну роботу, а симулятор показує скупчення кабін, черги й реальний розкид очікування.',
        'Gebäude, Aufzugsgruppen und Verkehr stehen in einer Szenariodatei, die der Wartezeitsimulator und das Energiewerkzeug mitnutzen. „Im Simulator prüfen“ speichert sie mit den Ergebnissen dieses Werkzeugs und öffnet den Simulator: die Formel nimmt einen völlig gleichmäßigen Betrieb an, der Simulator zeigt Pulkbildung, Schlangen und die echte Streuung der Wartezeiten.',
        'Het gebouw, de liftgroepen en het verkeer staan in één scenariobestand, gedeeld met de wachttijdsimulator en de energietool. “Controleren in de simulator” slaat het op met de resultaten van deze tool en opent de simulator: de formule veronderstelt een volkomen regelmatige dienst, de simulator toont klontering, rijen en de echte spreiding van wachttijden.',
        'Le bâtiment, les groupes et le trafic sont dans un fichier de scénario partagé avec le simulateur d’attente et l’outil énergie. « Vérifier dans le simulateur » l’enregistre avec les résultats de cet outil et ouvre le simulateur : la formule suppose un service parfaitement régulier, le simulateur montre les cabines qui se suivent, les files et la vraie dispersion des attentes.',
        'El edificio, los grupos y el tráfico viven en un archivo de escenario compartido con el simulador de espera y la herramienta de energía. «Comprobar en el simulador» lo guarda con los resultados de esta herramienta y abre el simulador: la fórmula supone un servicio perfectamente regular; el simulador muestra cabinas en pelotón, colas y la dispersión real de las esperas.',
        'Budynek, grupy dźwigów i ruch są w jednym pliku scenariusza, wspólnym z symulatorem oczekiwania i narzędziem energii. „Sprawdź w symulatorze” zapisuje go z wynikami tego narzędzia i otwiera symulator: wzór zakłada idealnie regularną obsługę, symulator pokazuje zbijanie się kabin w pary, kolejki i rzeczywisty rozrzut oczekiwania.') }
  },

var seen = { doc: null, ids: {} };
function syncDoc() {

  floors.forEach(function (f) { f.entrance = (+f.entrance_share || 0) > 0; if (f.attractor_share == null) f.attractor_share = 0; });

/* ---- compute (results) ---- */
