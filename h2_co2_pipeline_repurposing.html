    "uk": "Скринінг наявного трубопроводу для експлуатації з водневою сумішшю, воднем, газоподібним CO₂ або CO₂ у щільній фазі; один режим на дослідження з власними перевірками. Спільне: нормативна основа, кільцеве напруження за Lamé порівняно з проєктною межею використання, історія випробувань тиском. Водень: кваліфікація матеріалу та зварних швів, скринінг рушійної сили тріщини K = Y·(σ + p)·√(πa) з тиском на берегах тріщини порівняно з в'язкістю руйнування в робочому газі, втома, витоки, арматура та обертове обладнання, твердість швів, декомпресія, поширення руйнування й дисперсія. CO₂: фазовий скринінг у визначальному куті робочого діапазону — еталонне рівняння Span–Wagner для чистого CO₂, багатофлюїдна модель суміші в енергії Гельмгольца з фазовою огинаючою для CO₂ з N₂, O₂, Ar, H₂, CH₄ і CO, — запас тиску до насичення або до огинаючої, твердий CO₂ за найнижчої температури, вода й корозія, декомпресія, поширення руйнування, викид і дисперсія. Стани доказів поєднуються з числами; зведеного бала придатності немає.",
    "de": "Screening einer bestehenden Pipeline für den Betrieb mit Wasserstoffgemisch, Wasserstoff, gasförmigem CO₂ oder CO₂ in der Dichtphase, ein Betriebsmedium je Studie mit eigenen Prüfungen. Gemeinsam: Regelwerksgrundlage, Umfangsspannung nach Lamé gegenüber einer Auslastungsgrenze des Projekts, Druckprüfhistorie. Wasserstoff: Qualifizierung von Werkstoff und Schweißnähten, ein Screening der Rissantriebskraft K = Y·(σ + p)·√(πa) mit Druck auf die Rissflanken gegenüber der Zähigkeit im Betriebsgas, Ermüdung, Leckage, Armaturen und rotierende Maschinen, Härte der Schweißnähte, Dekompression, laufender Bruch und Ausbreitung. CO₂: ein Phasen-Screening an der maßgebenden Ecke des Betriebsfensters — Referenzgleichung von Span–Wagner für reines CO₂, Mehrfluid-Helmholtz-Gemischmodell mit Phasenhüllkurve für CO₂ mit N₂, O₂, Ar, H₂, CH₄ und CO —, der Druckabstand zur Sättigung oder zur Hüllkurve, festes CO₂ bei der tiefsten Temperatur, Wasser und Korrosion, Dekompression, laufender Bruch, Freisetzung und Ausbreitung. Nachweiszustände werden mit den Zahlen kombiniert; es gibt keinen Gesamt-Eignungswert.",
    "nl": "Screening van een bestaande pijpleiding voor bedrijf met waterstofmengsel, waterstof, gasvormig CO₂ of CO₂ in dichte fase, één bedrijfsmedium per studie met eigen controles. Gemeenschappelijk: regelgevende basis, omtrekspanning volgens Lamé ten opzichte van een benuttingsgrens van het project, druktesthistorie. Waterstof: kwalificatie van materiaal en lassen, een screening van de scheurdrijvende kracht K = Y·(σ + p)·√(πa) met druk op de scheurvlakken ten opzichte van de taaiheid in het bedrijfsgas, vermoeiing, lekkage, afsluiters en roterende apparatuur, hardheid van lassen, decompressie, voortplantende breuk en dispersie. CO₂: een fasescreening in de maatgevende hoek van het bedrijfsgebied — de referentievergelijking van Span–Wagner voor zuiver CO₂, een multifluïdum-Helmholtz-mengselmodel met fase-omhullende voor CO₂ met N₂, O₂, Ar, H₂, CH₄ en CO —, de drukmarge tot verzadiging of tot de omhullende, vaste CO₂ bij de laagste temperatuur, water en corrosie, decompressie, voortplantende breuk, vrijzetting en dispersie. Bewijstoestanden worden met de getallen gecombineerd; er is geen totale geschiktheidsscore.",

  "limitations": {
    "en": "Screening aid; no fitness-for-service, fatigue crack growth, fracture-arrest, transient or dispersion calculation. The pure-CO₂ saturation pressure comes from the Span–Wagner ancillary equation (within about 0.03 %), so a corner within 0.5 % of it is treated as ambiguous; the mixture screen covers CO₂ of at least 90 % with N₂, O₂, Ar, H₂, CH₄ and CO up to 70 MPa and 700 K, treats a corner within 3 % of a dew or bubble pressure or near the critical point of the mixture as ambiguous, and leaves water and other impurities to the external phase-envelope assessment. Criteria are project values from the stated profile, none is built in. Built-in examples are synthetic. With H₂ in the stream the bubble-side band of the mixture screen is 3 % + 20·x_H₂, at most 20 % (the model is up to 15 % below measured CO₂ + H₂ bubble pressures), and a dense-phase margin inside it follows the external assessment.",
    "uk": "Допоміжний засіб скринінгу; без розрахунків придатності до експлуатації, росту втомних тріщин, зупинки руйнування, перехідних процесів або дисперсії. Тиск насичення чистого CO₂ береться з допоміжного рівняння Span–Wagner (з похибкою близько 0,03 %), тому точка в межах 0,5 % від нього вважається неоднозначною; скринінг суміші охоплює CO₂ щонайменше 90 % з N₂, O₂, Ar, H₂, CH₄ і CO до 70 МПа і 700 K, вважає неоднозначною точку в межах 3 % від тиску роси чи кипіння або поблизу критичної точки суміші, а воду та інші домішки залишає зовнішній оцінці фазової огинаючої. Критерії — проєктні значення із зазначеного профілю, жоден не вбудовано. Вбудовані приклади синтетичні. Якщо в потоці є H₂, смуга скринінгу суміші з боку кипіння становить 3 % + 20·x_H₂, не більше 20 % (модель до 15 % нижча за виміряні тиски кипіння CO₂ + H₂), а запас у щільній фазі в її межах визначає зовнішня оцінка.",
    "de": "Screening-Hilfe; keine Berechnung von Betriebstauglichkeit, Ermüdungsrisswachstum, Bruchstopp, instationären Vorgängen oder Ausbreitung. Der Sättigungsdruck von reinem CO₂ stammt aus der Hilfsgleichung von Span–Wagner (auf etwa 0,03 % genau), daher gilt eine Ecke innerhalb von 0,5 % davon als mehrdeutig; das Gemisch-Screening deckt mindestens 90 % CO₂ mit N₂, O₂, Ar, H₂, CH₄ und CO bis 70 MPa und 700 K ab, wertet eine Ecke innerhalb von 3 % eines Tau- oder Siededrucks oder nahe dem kritischen Punkt des Gemischs als mehrdeutig und überlässt Wasser und andere Verunreinigungen der externen Bewertung der Phasenhüllkurve. Die Kriterien sind Projektwerte aus dem angegebenen Profil, keines ist eingebaut. Die eingebauten Beispiele sind synthetisch. Mit H₂ im Strom beträgt das Band des Gemisch-Screenings auf der Siedeseite 3 % + 20·x_H₂, höchstens 20 % (das Modell liegt bis zu 15 % unter gemessenen Siededrücken von CO₂ + H₂), und ein Abstand in der Dichtphase innerhalb davon richtet sich nach der externen Bewertung.",
    "nl": "Hulpmiddel voor screening; geen berekening van geschiktheid voor gebruik, vermoeiingsscheurgroei, breukstop, transiënten of dispersie. De verzadigingsdruk van zuiver CO₂ komt uit de hulpvergelijking van Span–Wagner (op ongeveer 0,03 % nauwkeurig), dus een hoek binnen 0,5 % daarvan geldt als dubbelzinnig; de mengselscreening dekt minstens 90 % CO₂ met N₂, O₂, Ar, H₂, CH₄ en CO tot 70 MPa en 700 K, beschouwt een hoek binnen 3 % van een dauw- of kookdruk of nabij het kritisch punt van het mengsel als dubbelzinnig en laat water en andere onzuiverheden aan de externe beoordeling van de fase-omhullende. De criteria zijn projectwaarden uit het opgegeven profiel, geen enkel is ingebouwd. De ingebouwde voorbeelden zijn synthetisch. Met H₂ in de stroom is de band van de mengselscreening aan de kookzijde 3 % + 20·x_H₂, hoogstens 20 % (het model ligt tot 15 % onder gemeten kookdrukken van CO₂ + H₂), en een marge in de dichte fase daarbinnen volgt de externe beoordeling.",
    "fr": "Aide au criblage ; aucun calcul d'aptitude au service, de propagation de fissures de fatigue, d'arrêt de rupture, de transitoires ou de dispersion. La pression de saturation du CO₂ pur vient de l’équation auxiliaire de Span–Wagner (à environ 0,03 % près), donc un coin à moins de 0,5 % est traité comme ambigu ; le criblage de mélange couvre au moins 90 % de CO₂ avec N₂, O₂, Ar, H₂, CH₄ et CO jusqu’à 70 MPa et 700 K, traite comme ambigu un coin à moins de 3 % d’une pression de rosée ou de bulle ou près du point critique du mélange, et laisse l’eau et les autres impuretés à l’évaluation externe de l’enveloppe de phase. Les critères sont des valeurs du projet issues du profil déclaré, aucun n'est intégré. Les exemples intégrés sont synthétiques. Avec H₂ dans le flux, la bande côté bulle du criblage de mélange vaut 3 % + 20·x_H₂, au plus 20 % (le modèle est jusqu’à 15 % sous les pressions de bulle mesurées de CO₂ + H₂), et une marge en phase dense à l’intérieur suit l’évaluation externe.",
    "es": "Ayuda al cribado; sin cálculo de aptitud para el servicio, crecimiento de grietas por fatiga, detención de fractura, transitorios ni dispersión. La presión de saturación del CO₂ puro procede de la ecuación auxiliar de Span–Wagner (con un error de alrededor del 0,03 %), así que una esquina a menos del 0,5 % se trata como ambigua; el cribado de mezclas cubre al menos 90 % de CO₂ con N₂, O₂, Ar, H₂, CH₄ y CO hasta 70 MPa y 700 K, trata como ambigua una esquina a menos del 3 % de una presión de rocío o de burbuja o cerca del punto crítico de la mezcla, y deja el agua y otras impurezas a la evaluación externa de la envolvente de fase. Los criterios son valores del proyecto tomados del perfil indicado; ninguno está incorporado. Los ejemplos integrados son sintéticos. Con H₂ en la corriente, la banda del lado de burbuja del cribado de mezclas es 3 % + 20·x_H₂, como máximo 20 % (el modelo queda hasta un 15 % por debajo de las presiones de burbuja medidas de CO₂ + H₂), y un margen en fase densa dentro de ella sigue la evaluación externa.",
    "pl": "Pomoc w screeningu; bez obliczeń przydatności do eksploatacji, wzrostu pęknięć zmęczeniowych, zatrzymania pęknięcia, stanów nieustalonych ani dyspersji. Ciśnienie nasycenia czystego CO₂ pochodzi z równania pomocniczego Span–Wagner (z dokładnością ok. 0,03 %), więc narożnik w granicach 0,5 % od niego uznaje się za niejednoznaczny; screening mieszaniny obejmuje co najmniej 90 % CO₂ z N₂, O₂, Ar, H₂, CH₄ i CO do 70 MPa i 700 K, uznaje za niejednoznaczny narożnik w granicach 3 % od ciśnienia punktu rosy lub pęcherzyków albo blisko punktu krytycznego mieszaniny, a wodę i inne zanieczyszczenia pozostawia zewnętrznej ocenie obwiedni fazowej. Kryteria są wartościami projektowymi z podanego profilu, żadne nie jest wbudowane. Wbudowane przykłady są syntetyczne. Przy H₂ w strumieniu pasmo screeningu mieszaniny po stronie pęcherzyków wynosi 3 % + 20·x_H₂, najwyżej 20 % (model leży do 15 % poniżej zmierzonych ciśnień punktu pęcherzyków CO₂ + H₂), a zapas w fazie gęstej w tym paśmie ustala ocena zewnętrzna."

le fractions do not fit the mode (hydrogen 1, blend between 0 and 1, CO₂ above 0 up to 1, CO₂ and the six impurities together 1).","b_value_invalid":"The value is negative or zero where it must be positive.","g_profile_missing":"Jurisdiction, edition or source of the criteria is missing: no numeric check is evaluated.","g_input_missing":"A value the check needs is missing.","g_check_unknown":"The check stays open.","g_data_source_missing":"The pipeline data source or revision is missing.","g_data_unconfirmed":"The pipeline data status is unknown.","w_blend_partial_pressure":"In a blend, the toughness and fatigue data must correspond to the hydrogen partial pressure.","w_phase_ambiguous":"The governing corner lies close to the saturation line or the phase envelope, or the screen did not resolve the phase: the phase follows the external assessment.","w_impure_stream_eos":"The stream is not pure confirmed CO₂ and no complete confirmed impurity composition is given: the phase follows the external phase-envelope assessment.","w_estimated_data":"Pipeline data are marked as estimated.","w_no_aggregate_score":"There is no aggregate fitness score: each check stands on its own evidence.","w_restored_values":"Saved values were replaced on loading: ","a_select_mode":"select the service mode","a_correct_input":"correct the inputs","a_select_profile":"state jurisdiction, edition and source of the criteria","a_enter_value":"enter the missing value","a_record_data_source":"record the data source and revision","a_confirm_data":"confirm the pipeline data","a_stress_assessment":"complete the stress assessment","a_pressure_test_records":"retrieve or repeat the pressure test records","a_h2_material_qualification":"identify and qualify pipe and welds for hydrogen","a_fracture_assessment":"perform the fracture assessment in hydrogen","a_h2_fatigue_assessment":"perform the hydrogen fatigue assessment","a_leak_tightness":"qualify seals and assess the route","a_equipment_qualification":"qual es.","learnDataTitle":"Pipe, operation and stream","learnData":"Geometry, SMYS, pressures (absolute) and temperatures define the hoop stress and the CO₂ corner; the stream composition and the evidence for each check come from records, inspection and qualification.","learnModelTitle":"Screens and their limits","learnModel":"Hoop stress follows Lamé at the inner wall; the crack screen K = Y·(σ + p)·√(πa), with the pressure on the crack faces, uses the toughness measured in the service gas; the CO₂ phase screen uses the Span–Wagner reference equation for pure CO₂ and a multi-fluid mixture model for an impure stream of stated composition, at the corner where the phase is most at risk, with the pressure margin to saturation or to the phase envelope.","learnTryTitle":"Try","learnTry":"Open \"Try: weld of unknown origin\" and decide which data the repurposing decision cannot do without.","learnExplainTitle":"Why the number is not enough","learnExplain":"K is 0.32 of the toughness, but the toughness belongs to a qualified material: with the weld unidentified and no defect data, the crack screen has nothing to stand on.","learnFixTitle":"Fix","learnFix":"Open \"Fix\": the weld is identified, qualified for hydrogen and inspected; the same numbers now support a confirmed crack screen.","learnBoundaryTitle":"Screening and approval","learnBoundary":"The tool prepares evidence; fitness for service, fracture arrest and approval stay with the responsible engineer and authority, and the approval is bound to the inputs.","eqNote":"Symbols: σ_θ — hoop stress at the inner wall; p_i, p_o — inner and outer pressure; r_i, r_o — inner and outer radius; u — utilisation; Y — geometry factor; a — flaw depth; K_env — toughness in the service environment; k_max — allowed K/K_env; α^r — residual Helmholtz energy (Span–Wagner); δ, τ — reduced density and inverse reduced temperature; ρ_c, T_c, p_c — critical density, temperature, pressure; p_s — saturation pressure; a_i, t_i — ancillary coefficients; Δp, Δp_min — pressure margin and its minimum; ρ — density; M — molar mass; R — gas constant; T — temperature; d, g — dense-phase and gaseous service; p_r — reference pressure. Mixture: x_i — mole fractions; α^r_oi — residual Helmholtz energy of pure fluid i; T_r, ρ_r — reducing temperature and density; β, γ — binary reducing parameters; F_ij, α^r_ij — departure weight and function; φ′, φ″ — fugacity coefficients of the feed and the incipient phase; y_i — incipient composition; p_env, p_dew — envelope and dew pressure; T_cdt — cricondentherm; T_tr — triple-point temperature of CO₂.","modelText":"Pressures absolute in MPa, temperatures in °C, lengths in mm; the CO₂ screen is evaluated at the maximum pressure and minimum temperature for gaseous service and at the minimum pressure and maximum temperature for dense phase.","boundaryText":"Screening only: no fitness-for-service, fracture-arrest, transient or dispersion calculation; criteria are project values from the stated profile.","scopeText":"Repurposing screening for H₂ and CO₂ pipelines; not a fitness-for-service assessment. Built-in examples are synthetic.","refLame":"Lamé thick-cylinder solution, hoop stress at the inner wall","refPR":"Peng–Robinson equation of state (1976) with CO₂ critical constants","refSW":"Span & Wagner (1996) reference equation of state for CO₂ with its saturation-pressure ancillary","c_hardness":"Weld and HAZ hardness","c_phase_margin":"Pressure margin to saturation","a_hardness_survey":"survey weld and HAZ hardness","a_operating_pressure_margin":"set the operating pressure window against saturation","f_hardness_hv":"Highest measured weld or HAZ hardness","f_hardness_max":"Maximum hardness for hydrogen service","f_phase_margin_min":"Minimum pressure margin to saturation","w_solid_at_t_min":"At the lowest temperature of the window CO₂ is below its triple point: solid CO₂ can form.","exDense":"Dense-phase CO₂ in a 508 × 15.9 mm line","exDenseNote":"11–15 MPa, 5–45 °C: at 11 MPa and 45 °C the Span–Wagner density is 603.2 kg/m³ against the 600 kg/m³ floor and the margin to the critical pressure is 3.62 MPa; Peng–Robinson would give 546 kg/m³ and reject it.","refHard":"Hardness limit for hydrogen service from the project criteria (for example ASME B31.12)","impPanel":"Impurities in the CO₂ stream (mole fractions)","f_x_n2":"Nitrogen N₂","f_x_o2":"Oxygen O₂","f_x_ar":"Argon Ar","f_x_h2":"Hydrogen H₂","f_x_ch4":"Methane CH₄","f_x_co":"Carbon monoxide CO","f_composition_sum":"Sum of the CO₂ and impurity fractions","w_mixture_out_of_range":"Outside the range of the built-in mixture screen (impurities above 10 % in total, pressure above 70 MPa or temperature above 700 K): the phase follows the external phase-envelope assessment.","ph_two_phase":"two-phase","mixModel":"mixture model","lgPhaseEnv":"phase envelope of the mixture","lgCdt":"cricondentherm","learnMixTitle":"Impure CO₂: the mixture model","learnMix":"With the composition confirmed and all six impurity fractions entered (0 where absent; with CO₂ they add up to 1), the stream is screened with the multi-fluid Helmholtz mixture model of Kunz & Wagner (GERG-2008 form): the reference equation of each pure fluid, reducing functions and departure functions with the binary parameters distributed with CoolProp and teqp. The page traces the phase envelope of the stream and reads at the governing corner the dew and bubble pressures, the phase (gas-like, two-phase, liquid-like, supercritical) and the density. Range: CO₂ at least 90 % with N₂, O₂, Ar, H₂, CH₄ and CO only (water and other impurities are not in the model), up to 70 MPa and 700 K; below the CO₂ triple point the solid rule of the pure case applies. Kunz & Wagner state 0.1 % for gas densities and 0.1–0.5 % for liquid densities of the mixtures fitted; for vapour–liquid equilibrium the deviations are larger, so within 3 % of a dew or bubble pressure, and near the critical point of the mixture, the phase follows the external assessment. In dense phase the margin is taken to the highest envelope pressure over the operating temperature window. With H₂ in the stream the bubble-side band widens to 3 % + 20·x_H₂, at most 20 %: against measured CO₂ + H₂ bubble pressures (Fandiño et al. 2015, 218–303 K) the model is up to 15 % low. A dense-phase margin inside that band also follows the external assessment.","mixText":"Impure stream (section 13 of the specification): multi-fluid Helmholtz mixture model of Kunz & Wagner (2012) with the pure-fluid reference equations of CO₂, N₂, O₂, Ar, H₂, CH₄ and CO and the binary parameters and departure functions of the CoolProp/teqp library (GERG-2008 values for the pairs with H₂ and CH₄ and for CO₂–N₂, N₂–O₂, O₂–CO, Ar–CO; EOS-CG values for CO₂–O₂, CO₂–Ar, CO₂–CO, N₂–Ar, N₂–CO, O₂–Ar). The phase envelope is traced from the dew point at 210 K over the critical point; dew and bubble pressures at the corner temperature are solved to 1e-10 in ln p. Gaseous service: margin below the dew pressure at the corner (above the cricondentherm: below the pressure at the reducing density). Dense phase: margin above the highest envelope pressure between the minimum temperature and the corner temperature (or the cricondentherm). Densities and dew and bubble pressures agree with CoolProp 8.0.0 to better than 1e-8 relative.","mixRange":"Mixture screen: CO₂ at least 90 % with N₂, O₂, Ar, H₂, CH₄ and CO, up to 70 MPa and 700 K; within 3 % of a dew or bubble pressure or near the critical point of the mixture the phase follows the external assessment. With H₂ the bubble-side band is 3 % + 20·x_H₂, at most 20 %.","refKW":"Kunz & Wagner (2012), J. Chem. Eng. Data 57, 3032–3091: GERG-2008 multi-fluid mixture model; Kunz et al. (2007), GERG Technical Monograph 15","refPure":"Pure-fluid reference equations: Span & Wagner 1996 (CO₂), Span et al. 2000 (N₂), Schmidt & Wagner 1985 (O₂), Tegeler et al. 1999 (Ar), Leachman et al. 2009 (H₂), Setzmann & Wagner 1991 (CH₄), Lemmon & Span 2006 (CO)","refBIP":"Binary parameters and departure functions as distributed with CoolProp/teqp: Kunz & Wagner 2012 (pairs with H₂ and CH₄; CO₂–N₂, N₂–O₂, O₂–CO, Ar–CO), Gernert 2013 and Gernert & Span 2016, J. Chem. Thermodyn. 93, 274–293 (EOS-CG: CO₂–O₂, CO₂–Ar, CO₂–CO, N₂–Ar, N₂–CO, O₂–Ar)","exImpure":"Dense-phase CO₂ with 4 % impurities","exImpureNote":"Same 508 × 15.9 mm line, 96 % CO₂ with 2 % N₂, 1 % O₂, 0.5 % Ar, 0.5 % H₂: at 11 MPa and 45 °C the mixture model gives 467.9 kg/m³ against the 600 kg/m³ floor (pure CO₂: 603.2 kg/m³), so the phase check is rejected; the margin to the highest envelope pressure of the 5–45 °C window (8.20 MPa) is 2.80 MPa.","w_h2_margin_band":"Hydrogen in the stream: the dense-phase pressure margin lies within the bubble-side band (3 % + 20·x_H₂, at most 20 % of the reference pressure). The model is up to 15 % low against measured CO₂ + H₂ bubble pressures, so the margin follows the external assessment."},"uk":{"title":"Перепрофілювання трубопроводу для H₂ / CO₂","subtitle":"Що треба показати, перш ніж наявний трубопровід транспортуватиме водень або CO₂: перевірки за режимом середовища, кільцеве напруження, скринінг тріщин, скринінг фази CO₂ і докази","reportTitle":"Скринінг перепрофілювання трубопроводу","modePanel":"Режим середовища і потік","item":"Трубопровід або ділянка","f_mode":"Режим середовища","mode_h2blend":"воднева суміш","mode_h2":"водень","mode_co2gas":"CO₂, газоподібний","mode_co2dense":"CO₂, щільна фаза","f_h2_fraction":"Мольна частка водню","f_co2_fraction":"Мольна частка CO₂","f_water_ppm":"Вміст води","syntheticCase":"Синтетичний приклад","pipePanel":"Труба та експлуатація","f_od":"Зовнішній діаметр","f_wall":"Товщина стінки","f_smys":"SMYS","f_p_max":"Максимальний тиск (абсолютний)","f_p_min":"Мінімальний тиск (абсолютний)","f_p_ext":"Зовнішній тиск (абсолютний)","f_t_min":"Мінімальна температура","f_t_max":"Максимальна температура","f_cycles_per_year":"Цикли тиску на рік","f_remaining_years":"Залишковий строк експлуатації, роки","f_flaw_dept йризикованішій точці разом із запасом тиску до насичення або до фазової огинаючої.","learnTryTitle":"Спроба","learnTry":"Відкрийте «Спроба: зварний шов невідомого походження» і визначте, без яких даних рішення про перепрофілювання неможливе.","learnExplainTitle":"Чому числа недостатньо","learnExplain":"K становить 0,32 від в'язкості руйнування, проте ця в'язкість належить кваліфікованому матеріалу: коли зварний шов не ідентифіковано і даних про дефекти немає, скринінгу тріщин нема на що спертися.","learnFixTitle":"Виправлення","learnFix":"Відкрийте «Виправлено»: зварний шов ідентифіковано, кваліфіковано для водню й перевірено; ті самі числа тепер підтримують підтверджений скринінг тріщин.","learnBoundaryTitle":"Скринінг і затвердження","learnBoundary":"Інструмент готує докази; придатність до експлуатації, зупинка руйнування та затвердження залишаються за відповідальним інженером і органом, а затвердження прив'язане до вхідних даних.","eqNote":"Позначення: σ_θ — кільцеве напруження на внутрішній стінці; p_i, p_o — внутрішній і зовнішній тиск; r_i, r_o — внутрішній і зовнішній радіус; u — коефіцієнт використання; Y — геометричний коефіцієнт; a — глибина дефекту; K_env — в'язкість руйнування в робочому середовищі; k_max — допустиме K/K_env; α^r — залишкова енергія Гельмгольца (Span–Wagner); δ, τ — зведена густина та обернена зведена температура; ρ_c, T_c, p_c — критичні густина, температура, тиск; p_s — тиск насичення; a_i, t_i — коефіцієнти допоміжного рівняння; Δp, Δp_min — запас тиску та його мінімум; ρ — густина; M — молярна маса; R — газова стала; T — температура; d, g — щільна фаза та газова служба; p_r — опорний тиск. Суміш: x_i — мольні частки; α^r_oi — залишкова енергія Гельмгольца чистої речовини i; T_r, ρ_r — приведені температура й густина; β, γ — бінарні приведені параметри; F_ij, α^r_ij — вага і функція відхилення; φ′, φ″ — коефіцієнти летючості вихідної та зародкової фази; y_i — склад зародкової фази; p_env, p_dew — тиск огинаючої і тиск роси; T_cdt — крикондентерма; T_tr — температура потрійної точки CO₂.","modelText":"Тиски абсолютні в MPa, температури в °C, довжини в mm; скринінг CO₂ оцінюється за максимального тиску й мінімальної температури для газоподібного режиму та за мінімального тиску й максимальної температури для щільної фази.","boundaryText":"Лише скринінг: без розрахунків придатності до експлуатації, зупинки руйнування, перехідних процесів або дисперсії; критерії — проєктні значення із зазначеного профілю.","scopeText":"Скринінг перепрофілювання трубопроводів для H₂ і CO₂; це не оцінка придатності до експлуатації. Вбудовані приклади синтетичні.","refLame":"Розв'язок Lamé для товстостінного циліндра, кільцеве напруження на внутрішній стінці","refPR":"Рівняння стану Peng–Robinson (1976) з критичними константами CO₂","refSW":"Еталонне рівняння стану CO₂ Span & Wagner (1996) з допоміжним рівнянням тиску насичення","c_hardness":"Твердість шва та ЗТВ","c_phase_margin":"Запас тиску до насичення","a_hardness_survey":"виміряти твердість швів і ЗТВ","a_operating_pressure_margin":"встановити робоче вікно тиску відносно насичення","f_hardness_hv":"Найбільша виміряна твердість шва або ЗТВ","f_hardness_max":"Найбільша твердість для водневої служби","f_phase_margin_min":"Найменший запас тиску до насичення","w_solid_at_t_min":"За найнижчої температури вікна CO₂ нижче потрійної точки: може утворитися твердий CO₂.","exDense":"CO₂ у щільній фазі в трубопроводі 508 × 15,9 мм","exDenseNote":"11–15 МПа, 5–45 °C: за 11 МПа і 45 °C густина за Span–Wagner 603,2 кг/м³ проти межі 600 кг/м³, запас до критичного тиску 3,62 МПа; Peng–Robinson дав би 546 кг/м³ і відхилив би.","refHard":"Межа твердості для водневої служби з проєктних критеріїв (наприклад, ASME B31.12)","impPanel":"Домішки в потоці CO₂ (мольні частки)","f_x_n2":"Азот N₂","f_x_o2":"Кисень O₂","f_x_ar":"Аргон Ar","f_x_h2":"Водень H₂","f_x_ch4":"Метан CH₄","f_x_co":"Монооксид вуглецю CO","f_composition_sum":"Сума часток CO₂ і домішок","w_mixture_out_of_range":"Поза діапазоном вбудованого скринінгу суміші (домішок понад 10 % загалом, тиск понад 70 МПа або температура понад 700 K): фазу визначає зовнішня оцінка фазової огинаючої.","ph_two_phase":"двофазний","mixModel":"модель суміші","lgPhaseEnv":"фазова огинаюча суміші","lgCdt":"крикондентерма","learnMixTitle":"CO₂ з домішками: модель суміші","learnMix":"Якщо склад підтверджено і введено всі шість часток домішок (0 для відсутніх; разом із CO₂ вони дають 1), потік оцінюється багатофлюїдною моделлю суміші в енергії Гельмгольца за Kunz & Wagner (форма GERG-2008): еталонне рівняння кожного чистого компонента, приведені функції та функції відхилення з бінарними параметрами, що постачаються з CoolProp і teqp. Сторінка будує фазову огинаючу потоку й зчитує у визначальному куті тиски роси й кипіння, фазу (газоподібна, двофазна, рідиноподібна, надкритична) і густину. Діапазон: CO₂ щонайменше 90 % лише з N₂, O₂, Ar, H₂, CH₄ і CO (вода та інші домішки в моделі відсутні), до 70 МПа і 700 K; нижче потрійної точки CO₂ діє правило твердої фази чистого випадку. Kunz & Wagner наводять 0,1 % для густини газу і 0,1–0,5 % для густини рідини підігнаних сумішей; для рівноваги рідина–пара відхилення більші, тож у межах 3 % від тиску роси чи кипіння, а також поблизу критичної точки суміші фазу визначає зовнішня оцінка. Для щільної фази запас береться до найвищого тиску огинаючої в робочому діапазоні температур. Якщо в потоці є H₂, смуга з боку кипіння розширюється до 3 % + 20·x_H₂, не більше 20 %: порівняно з виміряними тисками кипіння CO₂ + H₂ (Fandiño et al. 2015, 218–303 K) модель занижує їх до 15 %. Запас у щільній фазі в межах цієї смуги також визначає зовнішня оцінка.","mixText":"Потік із домішками (розділ 13 специфікації): багатофлюїдна модель суміші в енергії Гельмгольца за Kunz & Wagner (2012) з еталонними рівняннями чистих CO₂, N₂, O₂, Ar, H₂, CH₄ і CO та бінарними параметрами й функціями відхилення бібліотеки CoolProp/teqp (значення GERG-2008 для пар з H₂ і CH₄ та для CO₂–N₂, N₂–O₂, O₂–CO, Ar–CO; значення EOS-CG для CO₂–O₂, CO₂–Ar, CO₂–CO, N₂–Ar, N₂–CO, O₂–Ar). Фазову огинаючу будують від точки роси при 210 K через критичну точку; тиски роси й кипіння при температурі кута розв’язують до 1e-10 за ln p. Газоподібний режим: запас нижче тиску роси в куті (вище крикондентерми — нижче тиску при приведеній густині). Щільна фаза: запас вище найвищого тиску огинаючої між мінімальною температурою і температурою кута (або крикондентермою). Густини та тиски роси й кипіння збігаються з CoolProp 8.0.0 краще ніж 1e-8 відносно.","mixRange":"Скринінг суміші: CO₂ щонайменше 90 % з N₂, O₂, Ar, H₂, CH₄ і CO, до 70 МПа і 700 K; у межах 3 % від тиску роси чи кипіння або поблизу критичної точки суміші фазу визначає зовнішня оцінка. З H₂ смуга з боку кипіння — 3 % + 20·x_H₂, не більше 20 %.","refKW":"Kunz & Wagner (2012), J. Chem. Eng. Data 57, 3032–3091: багатофлюїдна модель сумішей GERG-2008; Kunz et al. (2007), GERG Technical Monograph 15","refPure":"Еталонні рівняння чистих речовин: Span & Wagner 1996 (CO₂), Span et al. 2000 (N₂), Schmidt & Wagner 1985 (O₂), Tegeler et al. 1999 (Ar), Leachman et al. 2009 (H₂), Setzmann & Wagner 1991 (CH₄), Lemmon & Span 2006 (CO)","refBIP":"Бінарні параметри та функції відхилення в постачанні CoolProp/teqp: Kunz & Wagner 2012 (пари з H₂ і CH₄; CO₂–N₂, N₂–O₂, O₂–CO, Ar–CO), Gernert 2013 та Gernert & Span 2016, J. Chem. Thermodyn. 93, 274–293 (EOS-CG: CO₂–O₂, CO₂–Ar, CO₂–CO, N₂–Ar, N₂–CO, O₂–Ar)","exImpure":"CO₂ у щільній фазі з 4 % домішок","exImpureNote":"Той самий трубопровід 508 × 15,9 мм, 96 % CO₂ з 2 % N₂, 1 % O₂, 0,5 % Ar, 0,5 % H₂: за 11 МПа і 45 °C модель суміші дає 467,9 кг/м³ проти межі 600 кг/м³ (чистий CO₂: 603,2 кг/м³), тож фазову перевірку відхилено; запас до найвищого тиску огинаючої в діапазоні 5–45 °C (8,20 МПа) становить 2,80 МПа.","w_h2_margin_band":"У потоці є водень: запас тиску в щільній фазі лежить у смузі з боку кипіння (3 % + 20·x_H₂, не більше 20 % від опорного тиску). Модель занижує виміряні тиски кипіння CO₂ + H₂ до 15 %, тому запас визначає зовнішня оцінка."},"de":{"title":"Umwidmung von H₂-/CO₂-Pipelines","subtitle":"Was nachzuweisen ist, bevor eine bestehende Pipeline Wasserstoff oder CO₂ führt: medienspezifische Prüfungen, Umfangsspannung, Riss-Screening, CO₂-Phasen-Screening und Nachweise","reportTitle":"Screening der Umwidmung einer Pipeline","modePanel":"Betriebsmedium und Stoffstrom","item":"Pipeline oder Abschnitt","f_mode":"Betriebsmedium","mode_h2blend":"Wasserstoffgemisch","mode_h2":"Wasserstoff","mode_co2gas":"CO₂, gasförmig","mode_co2dense":"CO₂, Dichtphase","f_h2_fraction":"Wasserstoff-Molenbruch","f_co2_fraction":"CO₂-Molenbruch","f_water_ppm":"Wassergehalt","syntheticCase":"Synthetisches Beispiel","pipePanel":"Rohr und Betrieb","f_od":"Außendurchmesser","f_wall":"Wanddicke","f_smys":"SMYS","f_p_max":"Maximaler Druck (absolut)","f_p_min":"Minimaler Druck (absolut)","f_p_ext":"Außendruck (absolut)","f_t_min":"Minimale Temperatur","f_t_max":"Maximale Temperatur","f_cycles_per_year":"Druckzyklen pro Jahr","f_remaining_years":"Restnutzungsdauer, Jahre","f_flaw_depth":"Bewertete Fehlertiefe","f_flaw_y":"Geometriefaktor Y","f_k_env":"Bruchzähigkeit im Betriebsmedium","profilePanel":"Regelwerksprofil und Projektkriterien","f_jurisdiction":"Rechtsraum oder Behörde","f_edition":"Regelwerk und Ausgabe","f_criterion_source":"Quelle der Projektkriterien","f_stress_fraction":"Zulässige Umfangsspannung / SMYS","f_k_ratio_max":"Zulässiges K / K_env","f_water_limit_ppm":"Wassergrenzwert","f_dense_min_density":"Mindestdichte in der Dichtphase","evidencePanel":"Nachweise und Daten","f_pipe_material":"Rohrwerkstoff identifiziert","f_weld_material":"Schweißgut identifiziert","f_defect_data":"Fehler- und Prüfdaten","f_pressure_test":"Druckprüfhistorie","f_route_data":"Trassen- und Rezeptordaten","f_h2_material":"Rohr für Wasserstoff qualifiziert","f_h2_weld":"Schweißnähte für Wasserstoff qualifiziert","f_h2_fatigue":"Wasserstoff-Ermüdungsbewertung","f_seals":"Dichtungen in Wassers iv sein, und die Wanddicke muss unter dem halben Durchmesser liegen.","b_pressure_invalid":"Die Drücke müssen bekannt und nicht negativ sein, und das Minimum darf höchstens das Maximum betragen.","b_temperature_invalid":"Die Temperaturen müssen bekannt sein und über dem absoluten Nullpunkt liegen, und das Minimum darf höchstens das Maximum betragen.","b_smys_invalid":"SMYS muss positiv sein.","b_cycles_invalid":"Zyklen pro Jahr und Restjahre müssen bekannt und nicht negativ sein.","b_fraction_invalid":"Die Molenbrüche passen nicht zum Betriebsmedium (Wasserstoff 1, Gemisch zwischen 0 und 1, CO₂ über 0 bis 1, CO₂ und die sechs Verunreinigungen zusammen 1).","b_value_invalid":"Der Wert ist negativ oder null, wo er positiv sein muss.","g_profile_missing":"Rechtsraum, Ausgabe oder Quelle der Kriterien fehlt: Es wird keine numerische Prüfung ausgewertet.","g_input_missing":"Ein Wert, den die Prüfung benötigt, fehlt.","g_check_unknown":"Die Prüfung bleibt offen.","g_data_source_missing":"Quelle oder Revision der Pipelinedaten fehlt.","g_data_unconfirmed":"Der Status der Pipelinedaten ist unbekannt.","w_blend_partial_pressure":"In einem Gemisch müssen die Zähigkeits- und Ermüdungsdaten dem Wasserstoffpartialdruck entsprechen.","w_phase_ambiguous":"Die maßgebende Ecke liegt nahe der Sättigungslinie oder der Phasenhüllkurve, oder das Screening hat die Phase nicht bestimmt: Die Phase richtet sich nach der externen Bewertung.","w_impure_stream_eos":"Der Stoffstrom ist kein bestätigtes reines CO₂, und eine vollständige bestätigte Zusammensetzung der Verunreinigungen fehlt: Die Phase richtet sich nach der externen Bewertung der Phasenhüllkurve.","w_estimated_data":"Die Pipelinedaten sind als geschätzt markiert.","w_no_aggregate_score":"Es gibt keinen Gesamt-Eignungswert: Jede Prüfung stützt sich auf ihren eigenen Nachweis.","w_restored_values":"Gespeicherte Werte wurden beim Laden ersetzt: ","a_select_mode":"Betriebsmedium auswählen","a_correct_input":"die Eingaben korrigieren",  MPa√m: K/K_env 0,50 innerhalb von 0,8; Werkstoff, Leckage und Ausrüstung bestätigt, Ermüdung noch offen.","exProblem":"CO₂ mit unbekannten Verunreinigungen nahe der Phasengrenze (Problem)","exProblemNote":"97 % CO₂, Zusammensetzung nicht bestätigt, Wasser 300 ppm: kein Phasen-Screening, Wasser und Phase offen; die Zahlen verdecken die fehlenden Daten nicht.","exTry":"Versuch: Schweißnaht unbekannter Herkunft","exTryNote":"Derselbe Wasserstofffall mit nicht identifizierter Schweißnaht und ohne Fehlerdaten: K beträgt weiterhin 0,32 von K_env, doch Werkstoff und Riss-Screening bleiben offen.","exFix":"Lösung: Schweißnaht identifiziert und geprüft","exFixNote":"Schweißgut, Wasserstoffqualifizierung und Prüfdaten liegen vor: jede Wasserstoffprüfung bestätigt.","learnIntroTitle":"Umwidmung für Wasserstoff oder CO₂","learnIntro":"Jedes Betriebsmedium hat eigene Prüfungen. Wasserstoff: Werkstoff und Schweißnähte, Risse, Ermüdung, Leckage, Ausrüstung. CO₂: Phase, Wasser und Korrosion, Dekompression, laufender Bruch, Ausbreitung. Zahlen dienen dem Screening; Nachweise entscheiden.","learnDataTitle":"Rohr, Betrieb und Stoffstrom","learnData":"Geometrie, SMYS, Drücke (absolut) und Temperaturen bestimmen die Umfangsspannung und die CO₂-Ecke; die Zusammensetzung des Stoffstroms und die Nachweise für jede Prüfung stammen aus Unterlagen, Inspektion und Qualifizierung.","learnModelTitle":"Screenings und ihre Grenzen","learnModel":"Die Umfangsspannung folgt Lamé an der Innenwand; das Rissscreening K = Y·(σ + p)·√(πa) mit dem Druck auf den Rissufern nutzt die im Betriebsgas gemessene Zähigkeit; das CO₂-Phasenscreening nutzt die Referenzgleichung von Span–Wagner für reines CO₂ und ein Mehrfluid-Gemischmodell für einen verunreinigten Strom bekannter Zusammensetzung, in der Ecke mit dem größten Phasenrisiko, mit dem Druckabstand zur Sättigung oder zur Phasenhüllkurve.","learnTryTitle":"Versuch","learnTry":"Öffnen Sie „Versuch: Schweißnaht unbekannter Herkunft“ und entscheiden Sie, auf welche Daten die Umwidmungsentscheidung nicht verzichten kann.","learnExplainTitle":"Warum die Zahl nicht genügt","learnExplain":"K beträgt 0,32 der Zähigkeit, doch die Zähigkeit gehört zu einem qualifizierten Werkstoff: Bei nicht identifizierter Schweißnaht und ohne Fehlerdaten fehlt dem Riss-Screening die Grundlage.","learnFixTitle":"Korrektur","learnFix":"Öffnen Sie „Lösung“: Die Schweißnaht ist identifiziert, für Wasserstoff qualifiziert und geprüft; dieselben Zahlen tragen nun ein bestätigtes Riss-Screening.","learnBoundaryTitle":"Screening und Freigabe","learnBoundary":"Das Werkzeug bereitet Nachweise vor; Betriebstauglichkeit, Bruchstopp und Freigabe bleiben beim verantwortlichen Ingenieur und bei der Behörde, und die Freigabe ist an die Eingaben gebunden.","eqNote":"Formelzeichen: σ_θ — Umfangsspannung an der Innenwand; p_i, p_o — Innen- und Außendruck; r_i, r_o — Innen- und Außenradius; u — Auslastung; Y — Geometriefaktor; a — Fehlertiefe; K_env — Zähigkeit im Betriebsmedium; k_max — zulässiges K/K_env; α^r — residuale Helmholtz-Energie (Span–Wagner); δ, τ — reduzierte Dichte und inverse reduzierte Temperatur; ρ_c, T_c, p_c — kritische Dichte, Temperatur, Druck; p_s — Sättigungsdruck; a_i, t_i — Koeffizienten der Hilfsgleichung; Δp, Δp_min — Druckabstand und sein Mindestwert; ρ — Dichte; M — molare Masse; R — Gaskonstante; T — Temperatur; d, g — dichte Phase und Gasbetrieb; p_r — Bezugsdruck. Gemisch: x_i — Molenbrüche; α^r_oi — residuelle Helmholtz-Energie des Reinstoffs i; T_r, ρ_r — reduzierende Temperatur und Dichte; β, γ — binäre Reduktionsparameter; F_ij, α^r_ij — Gewicht und Abweichungsfunktion; φ′, φ″ — Fugazitätskoeffizienten der Ausgangs- und der entstehenden Phase; y_i — Zusammensetzung der entstehenden Phase; p_env, p_dew — Hüllkurven- und Taudruck; T_cdt — Krikondentherme; T_tr — Tripelpunkttemperatur von CO₂.","modelText":"Drücke absolut in MPa, Temperaturen in °C, Längen in mm; das CO₂-Screening wird für gasförmigen Betrieb bei maximalem Druck und minimaler Temperatur und für die Dichtphase bei minimalem Druck und maximaler Temperatur ausgewertet.","boundaryText":"Nur Screening: keine Berechnung von Betriebstauglichkeit, Bruchstopp, instationären Vorgängen oder Ausbreitung; die Kriterien sind Projektwerte aus dem angegebenen Profil.","scopeText":"Umwidmungs-Screening für H₂- und CO₂-Pipelines; keine Bewertung der Betriebstauglichkeit. Die eingebauten Beispiele sind synthetisch.","refLame":"Lamé-Lösung für den dickwandigen Zylinder, Umfangsspannung an der Innenwand","refPR":"Zustandsgleichung nach Peng–Robinson (1976) mit den kritischen Konstanten von CO₂","refSW":"Referenz-Zustandsgleichung für CO₂ nach Span & Wagner (1996) mit Hilfsgleichung für den Sättigungsdruck","c_hardness":"Härte von Schweißnaht und WEZ","c_phase_margin":"Druckabstand zur Sättigung","a_hardness_survey":"Härte von Schweißnähten und WEZ messen","a_operating_pressure_margin":"Betriebsdruckfenster gegenüber der Sättigung festlegen","f_hardness_hv":"Höchste gemessene Härte von Naht oder WEZ","f_hardness_max":"Höchstzulässige Härte im Wasserstoffbetrieb","f_phase_margin_min":"Mindestdruckabstand zur Sättigung","w_solid_at_t_min":"Bei der tiefsten Temperatur des Fensters liegt CO₂ unter dem Tripelpunkt: festes CO₂ kann entstehen.","exDense":"CO₂ in dichter Phase in einer Leitung 508 × 15,9 mm","exDenseNote":"11–15 MPa, 5–45 °C: bei 11 MPa und 45 °C liefert Span–Wagner 603,2 kg/m³ gegenüber der Untergrenze 600 kg/m³, der Abstand zum kritischen Druck beträgt 3,62 MPa; Peng–Robinson ergäbe 546 kg/m³ und würde ablehnen.","refHard":"Härtegrenze für den Wasserstoffbetrieb aus den Projektkriterien (zum Beispiel ASME B31.12)","impPanel":"Verunreinigungen im CO₂-Strom (Molenbrüche)","f_x_n2":"Stickstoff N₂","f_x_o2":"Sauerstoff O₂","f_x_ar":"Argon Ar","f_x_h2":"Wasserstoff H₂","f_x_ch4":"Methan CH₄","f_x_co":"Kohlenmonoxid CO","f_composition_sum":"Summe der Molenbrüche von CO₂ und Verunreinigungen","w_mixture_out_of_range":"Außerhalb des Bereichs des eingebauten Gemisch-Screenings (Verunreinigungen über 10 % insgesamt, Druck über 70 MPa oder Temperatur über 700 K): Die Phase richtet sich nach der externen Bewertung der Phasenhüllkurve.","ph_two_phase":"zweiphasig","mixModel":"Gemischmodell","lgPhaseEnv":"Phasenhüllkurve des Gemischs","lgCdt":"Krikondentherme","learnMixTitle":"Verunreinigtes CO₂: das Gemischmodell","learnMix":"Ist die Zusammensetzung bestätigt und sind alle sechs Molenbrüche der Verunreinigungen eingetragen (0 für fehlende; mit CO₂ ergeben sie 1), wird der Strom mit dem Mehrfluid-Helmholtz-Gemischmodell von Kunz & Wagner (Form von GERG-2008) bewertet: Referenzgleichung jedes Reinstoffs, Reduktionsfunktionen und Abweichungsfunktionen mit den binären Parametern, die mit CoolProp und teqp verteilt werden. Die Seite verfolgt die Phasenhüllkurve des Stroms und liest an der maßgebenden Ecke Tau- und Siededruck, die Phase (gasartig, zweiphasig, flüssigkeitsartig, überkritisch) und die Dichte ab. Bereich: mindestens 90 % CO₂ nur mit N₂, O₂, Ar, H₂, CH₄ und CO (Wasser und andere Verunreinigungen sind nicht im Modell), bis 70 MPa und 700 K; unterhalb des CO₂-Tripelpunkts gilt die Feststoffregel des reinen Falls. Kunz & Wagner geben 0,1 % für Gasdichten und 0,1–0,5 % für Flüssigkeitsdichten der angepassten Gemische an; im Dampf-Flüssigkeits-Gleichgewicht sind die Abweichungen größer, daher richtet sich die Phase innerhalb von 3 % eines Tau- oder Siededrucks und nahe dem kritischen Punkt des Gemischs nach der externen Bewertung. In der Dichtphase wird der Abstand zum höchsten Druck der Hüllkurve über das Temperaturfenster des Betriebs genommen. Enthält der Strom H₂, wird das Band auf der Siedeseite auf 3 % + 20·x_H₂ erweitert, höchstens 20 %: gegenüber gemessenen Siededrücken von CO₂ + H₂ (Fandiño et al. 2015, 218–303 K) liegt das Modell bis zu 15 % zu niedrig. Ein Abstand in der Dichtphase innerhalb dieses Bandes richtet sich ebenfalls nach der externen Bewertung.","mixText":"Verunreinigter Strom (Abschnitt 13 der Spezifikation): Mehrfluid-Helmholtz-Gemischmodell nach Kunz & Wagner (2012) mit den Referenzgleichungen der Reinstoffe CO₂, N₂, O₂, Ar, H₂, CH₄ und CO sowie den binären Parametern und Abweichungsfunktionen der Bibliothek CoolProp/teqp (Werte von GERG-2008 für die Paare mit H₂ und CH₄ sowie für CO₂–N₂, N₂–O₂, O₂–CO, Ar–CO; Werte von EOS-CG für CO₂–O₂, CO₂–Ar, CO₂–CO, N₂–Ar, N₂–CO, O₂–Ar). Die Phasenhüllkurve wird vom Taupunkt bei 210 K über den kritischen Punkt verfolgt; Tau- und Siededruck bei der Ecktemperatur werden auf 1e-10 in ln p gelöst. Gasförmiger Betrieb: Abstand unter dem Taudruck an der Ecke (oberhalb der Krikondentherme: unter dem Druck bei der reduzierenden Dichte). Dichtphase: Abstand über dem höchsten Hüllkurvendruck zwischen der minimalen Temperatur und der Ecktemperatur (bzw. der Krikondentherme). Dichten sowie Tau- und Siededrücke stimmen mit CoolProp 8.0.0 relativ besser als 1e-8 überein.","mixRange":"Gemisch-Screening: mindestens 90 % CO₂ mit N₂, O₂, Ar, H₂, CH₄ und CO, bis 70 MPa und 700 K; innerhalb von 3 % eines Tau- oder Siededrucks oder nahe dem kritischen Punkt des Gemischs richtet sich die Phase nach der externen Bewertung. Mit H₂ beträgt das Band auf der Siedeseite 3 % + 20·x_H₂, höchstens 20 %.","refKW":"Kunz & Wagner (2012), J. Chem. Eng. Data 57, 3032–3091: Mehrfluid-Gemischmodell GERG-2008; Kunz et al. (2007), GERG Technical Monograph 15","refPure":"Referenzgleichungen der Reinstoffe: Span & Wagner 1996 (CO₂), Span et al. 2000 (N₂), Schmidt & Wagner 1985 (O₂), Tegeler et al. 1999 (Ar), Leachman et al. 2009 (H₂), Setzmann & Wagner 1991 (CH₄), Lemmon & Span 2006 (CO)","refBIP":"Binäre Parameter und Abweichungsfunktionen, wie mit CoolProp/teqp verteilt: Kunz & Wagner 2012 (Paare mit H₂ und CH₄; CO₂–N₂, N₂–O₂, O₂–CO, Ar–CO), Gernert 2013 sowie Gernert & Span 2016, J. Chem. Thermodyn. 93, 274–293 (EOS-CG: CO₂–O₂, CO₂–Ar, CO₂–CO, N₂–Ar, N₂–CO, O₂–Ar)","exImpure":"CO₂ in dichter Phase mit 4 % Verunreinigungen","exImpureNote":"Dieselbe Leitung 508 × 15,9 mm, 96 % CO₂ mit 2 % N₂, 1 % O₂, 0,5 % Ar, 0,5 % H₂: bei 11 MPa und 45 °C liefert das Gemischmodell 467,9 kg/m³ gegenüber der Untergrenze 600 kg/m³ (reines CO₂: 603,2 kg/m³), die Phasenprüfung wird abgelehnt; der Abstand zum höchsten Hüllkurvendruck im Fenster 5–45 °C (8,20 MPa) beträgt 2,80 MPa.","w_h2_margin_band":"Wasserstoff im Strom: Der Druckabstand in der Dichtphase liegt im Band auf der Siedeseite (3 % + 20·x_H₂, höchstens 20 % des Bezugsdrucks). Das Modell liegt gegenüber gemessenen Siededrücken von CO₂ + H₂ bis zu 15 % zu niedrig, daher richtet sich der Abstand nach der externen Bewertung."},"nl":{"title":"Herbestemming van H₂-/CO₂-pijpleidingen","subtitle":"Wat aangetoond moet zijn voordat een bestaande pijpleiding waterstof of CO₂ vervoert: controles per bedrijfsmedium, omtrekspanning, scheurscreening, CO₂-fasescreening en bewijs","reportTitle":"Screening van de herbestemming van een pijpleiding","modePanel":"Bedrijfsmedium en stroom","item":"Pijpleiding of sectie","f_mode":"Bedrijfsmedium","mode_h2blend":"waterstofmengsel","mode_h2":"waterstof","mode_co2gas":"CO₂, gasvormig","mode_co2dense":"CO₂, dichte fase","f_h2_fraction":"Molfractie waterstof","f_co2_fraction":"Molfractie CO₂","f_water_ppm":"Watergehalte","syntheticCase":"Synthetisch voorbeeld","pipePanel":"Leiding en bedrijf","f_od":"Buitendiameter","f_wall":"Wanddikte","f_smys":"SMYS","f_p_max":"Maximale druk (absoluut)","f_p_min":"Minimale druk (absoluut)","f_p_ext":"Buitendruk (absoluut)","f_t_min":"Minimale temperatuur","f_t_max":"Maximale temperatuur","f_cycles_per_year":"Drukcycli per jaar","f_remaining_years":"Resterende bedrijfsduur, jaren","f_flaw_depth":"Beoordeelde defectdiepte","f_flaw_y":"Geometriefactor Y","f_k_env":"Breuktaaiheid in het bedrijfsmedium","profilePanel":"Regelgevingsprofiel en projectcriteria","f_jurisdiction":"Jurisdictie of autoriteit","f_edition":"Norm en editie","f_criterion_source":"Bron van de projectcriteria","f_stress_fraction":"Toelaat of de screening heeft de fase niet bepaald: de fase volgt de externe beoordeling.","w_impure_stream_eos":"De stroom is geen bevestigd zuiver CO₂ en een volledige bevestigde samenstelling van de onzuiverheden ontbreekt: de fase volgt de externe beoordeling van de fase-omhullende.","w_estimated_data":"De pijpleidinggegevens zijn als geschat gemarkeerd.","w_no_aggregate_score":"Er is geen totale geschiktheidsscore: elke controle steunt op haar eigen bewijs.","w_restored_values":"Opgeslagen waarden zijn bij het laden vervangen: ","a_select_mode":"het bedrijfsmedium selecteren","a_correct_input":"de invoer corrigeren","a_select_profile":"jurisdictie, editie en bron van de criteria opgeven","a_enter_value":"de ontbrekende waarde invoeren","a_record_data_source":"de bron en revisie van de gegevens vastleggen","a_confirm_data":"de pijpleidinggegevens bevestigen","a_stress_assessment":"de spanningsbeoordeling voltooien","a_pressure_test_records":"de druktestverslagen opvragen of herhalen","a_h2_material_qualification":"leiding en lassen identificeren en kwalificeren voor waterstof","a_fracture_assessment":"de breukbeoordeling in waterstof uitvoeren","a_h2_fatigue_assessment":"de waterstofvermoeiingsbeoordeling uitvoeren","a_leak_tightness":"afdichtingen kwalificeren en het tracé beoordelen","a_equipment_qualification":"afsluiters en roterende apparatuur kwalificeren","a_phase_envelope":"een multicomponent-fase-omhullende verkrijgen","a_water_and_corrosion":"de grenswaarde voor water vastleggen en de corrosie beoordelen","a_decompression_study":"de decompressiebeoordeling uitvoeren","a_running_fracture_study":"de beoordeling van de voortplantende breuk uitvoeren","a_dispersion_study":"vrijzetting en dispersie langs het tracé beoordelen","a_mitigate_or_derate":"mitigeren, afwaarderen of de dienst uitsluiten","profile":"Regelgevingsprofiel","modelVersion":"Modelversie","exControl":"Bekend staal in waterstofbedrijf (controle)","exControlNote":"914,4 × 12,7 mm, SMYS 358 MPa, 7 MPa: omtrekspanning 244,9 MPa (0,684 van SMYS); een defect van 2 mm geeft K = 22,4 MPa√m, 0,32 van K_env; elke waterstofcontrole bevestigd.","exCo2":"Dezelfde leiding met gasvormig CO₂","exCo2Note":"Dezelfde leiding en drukken met CO₂: bij 7 MPa en 5 °C geeft de screening een vloeistofachtige fase van 926 kg/m³, dus gasvormig bedrijf wordt afgewezen; de lijst met controles verschilt van die voor waterstof.","exTypical":"Waterstofmengsel met bekende lassen en defecten (typisch)","exTypicalNote":"20 % waterstof, defect 3 mm, K_env 55 MPa√m: K/K_env 0,50 binnen 0,8; materiaal, lekkage en apparatuur bevestigd, vermoeiing nog open.","exProblem":"CO₂ met onbekende onzuiverheden nabij de fasegrens (probleem)","exProblemNote":"97 % CO₂, samenstelling niet bevestigd, water 300 ppm: geen fasescreening, water en fase open; de getallen verbergen de ontbrekende gegevens niet.","exTry":"Probeer: las van onbekende herkomst","exTryNote":"Hetzelfde waterstofgeval met een niet-geïdentificeerde las en zonder defectgegevens: K is nog steeds 0,32 van K_env, maar materiaal en scheurscreening blijven open.","exFix":"Oplossing: las geïdentificeerd en geïnspecteerd","exFixNote":"Lasmateriaal, waterstofkwalificatie en inspectiegegevens beschikbaar: elke waterstofcontrole bevestigd.","learnIntroTitle":"Herbestemming voor waterstof of CO₂","learnIntro":"Elk bedrijfsmedium heeft eigen controles. Waterstof: materiaal en lassen, scheuren, vermoeiing, lekkage, apparatuur. CO₂: fase, water en corrosie, decompressie, voortplantende breuk, dispersie. Getallen screenen; bewijs beslist.","learnDataTitle":"Leiding, bedrijf en stroom","learnData":"Geometrie, SMYS, drukken (absoluut) en temperaturen bepalen de omtrekspanning en de CO₂-hoek; de samenstelling van de stroom en het bewijs voor elke controle komen uit documentatie, inspectie en kwalificatie.","learnModelTitle":"Screenings en hun grenzen","learnModel":"De ringspanning volgt Lamé aan de binnenwand; de scheurscreening K = Y·(σ + p)·√(πa), met de druk op de scheurflanken, gebruikt de taaiheid gemeten in het bedrijfsgas; de CO₂-fasescreening gebruikt de referentievergelijking van Span–Wagner voor zuivere CO₂ en een multifluïdummengselmodel voor een onzuivere stroom met opgegeven samenstelling, in de hoek met het grootste faserisico, met de drukmarge tot verzadiging of tot de fase-omhullende.","learnTryTitle":"Probeer","learnTry":"Open “Probeer: las van onbekende herkomst” en bepaal welke gegevens de herbestemmingsbeslissing niet kan missen.","learnExplainTitle":"Waarom het getal niet volstaat","learnExplain":"K is 0,32 van de taaiheid, maar de taaiheid hoort bij een gekwalificeerd materiaal: met een niet-geïdentificeerde las en zonder defectgegevens heeft de scheurscreening geen grondslag.","learnFixTitle":"Correctie","learnFix":"Open “Oplossing”: de las is geïdentificeerd, gekwalificeerd voor waterstof en geïnspecteerd; dezelfde getallen ondersteunen nu een bevestigde scheurscreening.","learnBoundaryTitle":"Screening en goedkeuring","learnBoundary":"Het hulpmiddel bereidt bewijs voor; geschiktheid voor gebruik, breukstop en goedkeuring blijven bij de verantwoordelijke ingenieur en autoriteit, en de goedkeuring is gekoppeld aan de invoer.","eqNote":"Symbolen: σ_θ — omtrekspanning aan de binnenwand; p_i, p_o — inwendige en uitwendige druk; r_i, r_o — binnen- en buitenstraal; u — benuttingsgraad; Y — geometriefactor; a — defectdiepte; K_env — taaiheid in het bedrijfsmedium; k_max — toelaatbare K/K_env; α^r — residuele Helmholtz-energie (Span–Wagner); δ, τ — gereduceerde dichtheid en inverse gereduceerde temperatuur; ρ_c, T_c, p_c — kritische dichtheid, temperatuur, druk; p_s — verzadigingsdruk; a_i, t_i — coëfficiënten van de hulpvergelijking; Δp, Δp_min — drukmarge en het minimum ervan; ρ — dichtheid; M — molaire massa; R — gasconstante; T — temperatuur; d, g — dichte fase en gasvormig bedrijf; p_r — referentiedruk. Mengsel: x_i — molfracties; α^r_oi — residuele Helmholtz-energie van zuivere stof i; T_r, ρ_r — reducerende temperatuur en dichtheid; β, γ — binaire reductieparameters; F_ij, α^r_ij — gewicht en afwijkingsfunctie; φ′, φ″ — fugaciteitscoëfficiënten van de voeding en de ontstaande fase; y_i — samenstelling van de ontstaande fase; p_env, p_dew — druk van de omhullende en dauwdruk; T_cdt — cricondentherm; T_tr — tripelpunttemperatuur van CO₂.","modelText":"Drukken absoluut in MPa, temperaturen in °C, lengten in mm; de CO₂-screening wordt voor gasvormig bedrijf bij maximale druk en minimale temperatuur en voor de dichte fase bij minimale druk en maximale temperatuur geëvalueerd.","boundaryText":"Alleen screening: geen berekening van geschiktheid voor gebruik, breukstop, transiënten of dispersie; de criteria zijn projectwaarden uit het opgegeven profiel.","scopeText":"Screening voor herbestemming van H₂- en CO₂-pijpleidingen; geen beoordeling van geschiktheid voor gebruik. De ingebouwde voorbeelden zijn synthetisch.","refLame":"Lamé-oplossing voor de dikwandige cilinder, omtrekspanning aan de binnenwand","refPR":"Toestandsvergelijking van Peng–Robinson (1976) met de kritische constanten van CO₂","refSW":"Referentietoestandsvergelijking voor CO₂ van Span & Wagner (1996) met de hulpvergelijking voor de verzadigingsdruk","c_hardness":"Hardheid van las en WBZ","c_phase_margin":"Drukmarge tot verzadiging","a_hardness_survey":"hardheid van lassen en WBZ meten","a_operating_pressure_margin":"bedrijfsdrukvenster ten opzichte van verzadiging vastleggen","f_hardness_hv":"Hoogste gemeten hardheid van las of WBZ","f_hardness_max":"Maximale hardheid voor waterstofbedrijf","f_phase_margin_min":"Minimale drukmarge tot verzadiging","w_solid_at_t_min":"Bij de laagste temperatuur van het venster ligt CO₂ onder het tripelpunt: vaste CO₂ kan ontstaan.","exDense":"CO₂ in dichte fase in een leiding 508 × 15,9 mm","exDenseNote":"11–15 MPa, 5–45 °C: bij 11 MPa en 45 °C geeft Span–Wagner 603,2 kg/m³ tegen de ondergrens van 600 kg/m³ en een marge van 3,62 MPa tot de kritische druk; Peng–Robinson zou 546 kg/m³ geven en afwijzen.","refHard":"Hardheidsgrens voor waterstofbedrijf uit de projectcriteria (bijvoorbeeld ASME B31.12)","impPanel":"Onzuiverheden in de CO₂-stroom (molfracties)","f_x_n2":"Stikstof N₂","f_x_o2":"Zuurstof O₂","f_x_ar":"Argon Ar","f_x_h2":"Waterstof H₂","f_x_ch4":"Methaan CH₄","f_x_co":"Koolmonoxide CO","f_composition_sum":"Som van de molfracties van CO₂ en onzuiverheden","w_mixture_out_of_range":"Buiten het bereik van de ingebouwde mengselscreening (onzuiverheden samen boven 10 %, druk boven 70 MPa of temperatuur boven 700 K): de fase volgt de externe beoordeling van de fase-omhullende.","ph_two_phase":"tweefasig","mixModel":"mengselmodel","lgPhaseEnv":"fase-omhullende van het mengsel","lgCdt":"cricondentherm","learnMixTitle":"Onzuivere CO₂: het mengselmodel","learnMix":"Is de samenstelling bevestigd en zijn alle zes molfracties van de onzuiverheden ingevuld (0 waar afwezig; met CO₂ samen 1), dan wordt de stroom gescreend met het multifluïdum-Helmholtz-mengselmodel van Kunz & Wagner (vorm van GERG-2008): de referentievergelijking van elke zuivere stof, reductiefuncties en afwijkingsfuncties met de binaire parameters die met CoolProp en teqp worden verspreid. De pagina volgt de fase-omhullende van de stroom en leest in de maatgevende hoek de dauw- en kookdruk, de fase (gasachtig, tweefasig, vloeistofachtig, superkritisch) en de dichtheid af. Bereik: minstens 90 % CO₂ met alleen N₂, O₂, Ar, H₂, CH₄ en CO (water en andere onzuiverheden zitten niet in het model), tot 70 MPa en 700 K; onder het tripelpunt van CO₂ geldt de regel voor vaste stof van het zuivere geval. Kunz & Wagner geven 0,1 % voor gasdichtheden en 0,1–0,5 % voor vloeistofdichtheden van de gefitte mengsels; voor damp-vloeistofevenwicht zijn de afwijkingen groter, dus binnen 3 % van een dauw- of kookdruk en nabij het kritisch punt van het mengsel volgt de fase de externe beoordeling. In de dichte fase wordt de marge genomen tot de hoogste druk van de omhullende over het temperatuurgebied van bedrijf. Met H₂ in de stroom wordt de band aan de kookzijde verbreed tot 3 % + 20·x_H₂, hoogstens 20 %: ten opzichte van gemeten kookdrukken van CO₂ + H₂ (Fandiño et al. 2015, 218–303 K) ligt het model tot 15 % te laag. Een marge in de dichte fase binnen die band volgt eveneens de externe beoordeling.","mixText":"Onzuivere stroom (paragraaf 13 van de specificatie): multifluïdum-Helmholtz-mengselmodel van Kunz & Wagner (2012) met de referentievergelijkingen van de zuivere stoffen CO₂, N₂, O₂, Ar, H₂, CH₄ en CO en de binaire parameters en afwijkingsfuncties van de bibliotheek CoolProp/teqp (waarden van GERG-2008 voor de paren met H₂ en CH₄ en voor CO₂–N₂, N₂–O₂, O₂–CO, Ar–CO; waarden van EOS-CG voor CO₂–O₂, CO₂–Ar, CO₂–CO, N₂–Ar, N₂–CO, O₂–Ar). De fase-omhullende wordt gevolgd vanaf het dauwpunt bij 210 K over het kritisch punt; dauw- en kookdruk bij de hoektemperatuur worden opgelost tot 1e-10 in ln p. Gasvormig bedrijf: marge onder de dauwdruk in de hoek (boven de cricondentherm: onder de druk bij de reducerende dichtheid). Dichte fase: marge boven de hoogste druk van de omhullende tussen de minimale temperatuur en de hoektemperatuur (of de cricondentherm). Dichtheden en dauw- en kookdrukken komen relatief beter dan 1e-8 overeen met CoolProp 8.0.0.","mixRange":"Mengselscreening: minstens 90 % CO₂ met N₂, O₂, Ar, H₂, CH₄ en CO, tot 70 MPa en 700 K; binnen 3 % van een dauw- of kookdruk of nabij het kritisch punt van het mengsel volgt de fase de externe beoordeling. Met H₂ is de band aan de kookzijde 3 % + 20·x_H₂, hoogstens 20 %.","refKW":"Kunz & Wagner (2012), J. Chem. Eng. Data 57, 3032–3091: multifluïdummengselmodel GERG-2008; Kunz et al. (2007), GERG Technical Monograph 15","refPure":"Referentievergelijkingen van de zuivere stoffen: Span & Wagner 1996 (CO₂), Span et al. 2000 (N₂), Schmidt & Wagner 1985 (O₂), Tegeler et al. 1999 (Ar), Leachman et al. 2009 (H₂), Setzmann & Wagner 1991 (CH₄), Lemmon & Span 2006 (CO)","refBIP":"Binaire parameters en afwijkingsfuncties zoals verspreid met CoolProp/teqp: Kunz & Wagner 2012 (paren met H₂ en CH₄; CO₂–N₂, N₂–O₂, O₂–CO, Ar–CO), Gernert 2013 en Gernert & Span 2016, J. Chem. Thermodyn. 93, 274–293 (EOS-CG: CO₂–O₂, CO₂–Ar, CO₂–CO, N₂–Ar, N₂–CO, O₂–Ar)","exImpure":"CO₂ in dichte fase met 4 % onzuiverheden","exImpureNote":"Dezelfde leiding 508 × 15,9 mm, 96 % CO₂ met 2 % N₂, 1 % O₂, 0,5 % Ar, 0,5 % H₂: bij 11 MPa en 45 °C geeft het mengselmodel 467,9 kg/m³ tegen de ondergrens van 600 kg/m³ (zuiver CO₂: 603,2 kg/m³), dus de fasecontrole wordt afgewezen; de marge tot de hoogste druk van de omhullende in het gebied 5–45 °C (8,20 MPa) is 2,80 MPa.","w_h2_margin_band":"Waterstof in de stroom: de drukmarge in de dichte fase ligt binnen de band aan de kookzijde (3 % + 20·x_H₂, hoogstens 20 % van de referentiedruk). Het model ligt tot 15 % onder gemeten kookdrukken van CO₂ + H₂, dus de marge volgt de externe beoordeling."},"fr":{"title":"Reconversion de pipelines H₂ / CO₂","subtitle":"Ce qu'il faut démontrer avant qu'un pipeline existant transporte de l'hydrogène ou du CO₂ : vérifications propres au mode, contrainte circonférentielle, criblage des fissures, criblage de phase du CO₂ et preuves","reportTitle":"Criblage de la reconversion d'un pipeline","modePanel":"Mode de service et flux","item":"Pipeline ou tronçon","f_mode":"Mode de service","mode_h2blend":"mélange d'hydrogène","mode_h2":"hydrogène","mode_co2gas":"CO₂, gazeux","mode_co2dense":"CO₂, phase dense","f_h2_fraction":"Fraction molaire d'hydrogène","f_co2_fraction":"Fraction molaire CO₂","f_water_ppm":"Teneur en eau","syntheticCase":"Cas synthétique","pipePanel":"Tube et exploitation","f_od":"Diamètre extérieur","f_wall":"Épaisseur de paroi","f_smys":"SMYS","f_p_max":"Pression maximale (absolue)","f_p_min":"Pression minimale (absolue)","f_p_ext":"Pression extérieure (absolue)","f_t_min":"Température minimale","f_t_max":"Température maximale","f_cycles_per_year":"Cycles de pression par an","f_remaining_years":"Durée de se cune vérification numérique n'est évaluée.","g_input_missing":"Une valeur nécessaire à la vérification manque.","g_check_unknown":"La vérification reste ouverte.","g_data_source_missing":"La source ou la révision des données du pipeline manque.","g_data_unconfirmed":"Le statut des données du pipeline est inconnu.","w_blend_partial_pressure":"Dans un mélange, les données de ténacité et de fatigue doivent correspondre à la pression partielle d'hydrogène.","w_phase_ambiguous":"Le coin déterminant est proche de la courbe de saturation ou de l’enveloppe de phase, ou le criblage n’a pas déterminé la phase : la phase suit l’évaluation externe.","w_impure_stream_eos":"Le flux n’est pas du CO₂ pur confirmé et aucune composition complète et confirmée des impuretés n’est donnée : la phase suit l’évaluation externe de l’enveloppe de phase.","w_estimated_data":"Les données du pipeline sont marquées comme estimées.","w_no_aggregate_score":"Il n'y a pas de score global d'aptitude : chaque vérification repose sur ses propres preuves.","w_restored_values":"Des valeurs enregistrées ont été remplacées au chargement : ","a_select_mode":"sélectionner le mode de service","a_correct_input":"corriger les données","a_select_profile":"indiquer la juridiction, l'édition et la source des critères","a_enter_value":"saisir la valeur manquante","a_record_data_source":"enregistrer la source et la révision des données","a_confirm_data":"confirmer les données du pipeline","a_stress_assessment":"compléter l'évaluation des contraintes","a_pressure_test_records":"récupérer ou refaire les procès-verbaux d'épreuve de pression","a_h2_material_qualification":"identifier le tube et les soudures et les qualifier pour l'hydrogène","a_fracture_assessment":"réaliser l'évaluation de rupture sous hydrogène","a_h2_fatigue_assessment":"réaliser l'évaluation de fatigue sous hydrogène","a_leak_tightness":"qualifier les joints d'étanchéité et évaluer le tracé","a_equipment_qualification":"qualifier les vannes et les équipements tournants","a_phase_envelope":"obtenir une enveloppe de phase multicomposant","a_water_and_corrosion":"fixer la limite d'eau et évaluer la corrosion","a_decompression_study":"réaliser l'évaluation de décompression","a_running_fracture_study":"réaliser l'évaluation de propagation de rupture","a_dispersion_study":"évaluer le rejet et la dispersion le long du tracé","a_mitigate_or_derate":"atténuer, déclasser ou exclure le service","profile":"Profil réglementaire","modelVersion":"Version du modèle","exControl":"Acier connu en service hydrogène (contrôle)","exControlNote":"914,4 × 12,7 mm, SMYS 358 MPa, 7 MPa : contrainte circonférentielle 244,9 MPa (0,684 de la SMYS) ; un défaut de 2 mm donne K = 22,4 MPa√m, 0,32 de K_env ; chaque vérification hydrogène confirmée.","exCo2":"Même tube en CO₂ gazeux","exCo2Note":"Même tube et mêmes pressions avec du CO₂ : à 7 MPa et 5 °C, le criblage donne une phase de type liquide de 926 kg/m³, le service gazeux est donc refusé ; la liste des vérifications diffère de celle de l'hydrogène.","exTypical":"Mélange d'hydrogène avec soudures et défauts connus (type)","exTypicalNote":"20 % d'hydrogène, défaut de 3 mm, K_env 55 MPa√m : K/K_env 0,50, dans la limite de 0,8 ; matériau, fuites et équipements confirmés, fatigue encore ouverte.","exProblem":"CO₂ aux impuretés inconnues près de la limite de phase (problème)","exProblemNote":"97 % de CO₂, composition non confirmée, eau 300 ppm : pas de criblage de phase, eau et phase ouvertes ; les chiffres ne masquent pas les données manquantes.","exTry":"À tester : soudure d'origine inconnue","exTryNote":"Même cas hydrogène avec la soudure non identifiée et sans données de défauts : K reste à 0,32 de K_env, mais le matériau et le criblage des fissures restent ouverts.","exFix":"Corrigé : soudure identifiée et inspectée","exFixNote":"Matériau de soudure, qualification hydrogène et données d'inspection disponibles : chaque vérification hydrogène confirmée.","learnIntroTitle":"Reconversion pour l'hydrogène ou le CO₂","learnIntro":"Chaque mode de service a ses propres vérifications. Hydrogène : matériau et soudures, fissures, fatigue, fuites, équipements. CO₂ : phase, eau et corrosion, décompression, propagation de rupture, dispersion. Les chiffres servent au criblage ; les preuves décident.","learnDataTitle":"Tube, exploitation et flux","learnData":"La géométrie, la SMYS, les pressions (absolues) et les températures définissent la contrainte circonférentielle et le coin CO₂ ; la composition du flux et les preuves de chaque vérification proviennent des archives, de l'inspection et de la qualification.","learnModelTitle":"Les criblages et leurs limites","learnModel":"La contrainte circonférentielle suit Lamé à la paroi intérieure ; le criblage de fissure K = Y·(σ + p)·√(πa), avec la pression sur les lèvres, utilise la ténacité mesurée dans le gaz de service ; le criblage de phase du CO₂ utilise l’équation de référence de Span–Wagner pour le CO₂ pur et un modèle de mélange multifluide pour un flux impur de composition déclarée, au coin le plus exposé, avec la marge de pression à la saturation ou à l’enveloppe de phase.","learnTryTitle":"À tester","learnTry":"Ouvrez « À tester : soudure d'origine inconnue » et déterminez de quelles données la décision de reconversion ne peut se passer.","learnExplainTitle":"Pourquoi le chiffre ne suffit pas","learnExplain":"K vaut 0,32 de la ténacité, mais la ténacité appartient à un matériau qualifié : avec une soudure non identifiée et sans données de défauts, le criblage des fissures n'a aucune base.","learnFixTitle":"Correction","learnFix":"Ouvrez « Corrigé » : la soudure est identifiée, qualifiée pour l'hydrogène et inspectée ; les mêmes chiffres étayent désormais un criblage des fissures confirmé.","learnBoundaryTitle":"Criblage et approbation","learnBoundary":"L'outil prépare les preuves ; l'aptitude au service, l'arrêt de rupture et l'approbation restent du ressort de l'ingénieur responsable et de l'autorité, et l'approbation est liée aux données.","eqNote":"Symboles : σ_θ — contrainte circonférentielle à la paroi interne ; p_i, p_o — pression intérieure et extérieure ; r_i, r_o — rayon intérieur et extérieur ; u — taux d'utilisation ; Y — facteur géométrique ; a — profondeur de défaut ; K_env — ténacité dans le milieu de service ; k_max — K/K_env admissible ; α^r — énergie de Helmholtz résiduelle (Span–Wagner) ; δ, τ — masse volumique réduite et inverse de la température réduite ; ρ_c, T_c, p_c — masse volumique, température et pression critiques ; p_s — pression de saturation ; a_i, t_i — coefficients de l’équation auxiliaire ; Δp, Δp_min — marge de pression et son minimum ; ρ — masse volumique ; M — masse molaire ; R — constante des gaz ; T — température ; d, g — service en phase dense et gazeux ; p_r — pression de référence. Mélange : x_i — fractions molaires ; α^r_oi — énergie de Helmholtz résiduelle du corps pur i ; T_r, ρ_r — température et masse volumique de réduction ; β, γ — paramètres binaires de réduction ; F_ij, α^r_ij — poids et fonction d’écart ; φ′, φ″ — coefficients de fugacité de la charge et de la phase naissante ; y_i — composition de la phase naissante ; p_env, p_dew — pression de l’enveloppe et pression de rosée ; T_cdt — cricondentherme ; T_tr — température du point triple du CO₂.","modelText":"Pressions absolues en MPa, températures en °C, longueurs en mm ; le criblage du CO₂ est évalué à la pression maximale et à la température minimale pour le service gazeux, et à la pression minimale et à la température maximale pour la phase dense.","boundaryText":"Criblage uniquement : aucun calcul d'aptitude au service, d'arrêt de rupture, de transitoires ou de dispersion ; les critères sont des valeurs du projet issues du profil déclaré.","scopeText":"Criblage de reconversion des pipelines H₂ et CO₂ ; ce n'est pas une évaluation d'aptitude au service. Les exemples intégrés sont synthétiques.","refLame":"Solution de Lamé pour le cylindre épais, contrainte circonférentielle à la paroi interne","refPR":"Équation d'état de Peng–Robinson (1976) avec les constantes critiques du CO₂","refSW":"Équation d’état de référence du CO₂ de Span & Wagner (1996) avec son équation auxiliaire de pression de saturation","c_hardness":"Dureté de la soudure et de la ZAT","c_phase_margin":"Marge de pression à la saturation","a_hardness_survey":"mesurer la dureté des soudures et des ZAT","a_operating_pressure_margin":"fixer la plage de pression d’exploitation par rapport à la saturation","f_hardness_hv":"Dureté maximale mesurée (soudure ou ZAT)","f_hardness_max":"Dureté maximale en service hydrogène","f_phase_margin_min":"Marge de pression minimale à la saturation","w_solid_at_t_min":"À la température la plus basse de la plage, le CO₂ est sous son point triple : du CO₂ solide peut se former.","exDense":"CO₂ en phase dense dans une conduite 508 × 15,9 mm","exDenseNote":"11–15 MPa, 5–45 °C : à 11 MPa et 45 °C, Span–Wagner donne 603,2 kg/m³ pour un plancher de 600 kg/m³ et une marge de 3,62 MPa à la pression critique ; Peng–Robinson donnerait 546 kg/m³ et rejetterait.","refHard":"Limite de dureté en service hydrogène issue des critères du projet (par exemple ASME B31.12)","impPanel":"Impuretés du flux de CO₂ (fractions molaires)","f_x_n2":"Azote N₂","f_x_o2":"Oxygène O₂","f_x_ar":"Argon Ar","f_x_h2":"Hydrogène H₂","f_x_ch4":"Méthane CH₄","f_x_co":"Monoxyde de carbone CO","f_composition_sum":"Somme des fractions de CO₂ et des impuretés","w_mixture_out_of_range":"Hors du domaine du criblage de mélange intégré (impuretés au-delà de 10 % au total, pression au-delà de 70 MPa ou température au-delà de 700 K) : la phase suit l’évaluation externe de l’enveloppe de phase.","ph_two_phase":"diphasique","mixModel":"modèle de mélange","lgPhaseEnv":"enveloppe de phase du mélange","lgCdt":"cricondentherme","learnMixTitle":"CO₂ impur : le modèle de mélange","learnMix":"Lorsque la composition est confirmée et que les six fractions d’impuretés sont saisies (0 si absentes ; avec le CO₂ elles font 1), le flux est criblé avec le modèle de mélange multifluide en énergie de Helmholtz de Kunz & Wagner (forme GERG-2008) : l’équation de référence de chaque corps pur, des fonctions de réduction et des fonctions d’écart avec les paramètres binaires distribués avec CoolProp et teqp. La page trace l’enveloppe de phase du flux et lit au coin déterminant les pressions de rosée et de bulle, la phase (de type gaz, diphasique, de type liquide, supercritique) et la masse volumique. Domaine : au moins 90 % de CO₂ avec seulement N₂, O₂, Ar, H₂, CH₄ et CO (l’eau et les autres impuretés ne sont pas dans le modèle), jusqu’à 70 MPa et 700 K ; sous le point triple du CO₂, la règle du solide du cas pur s’applique. Kunz & Wagner indiquent 0,1 % pour les masses volumiques de gaz et 0,1–0,5 % pour celles de liquide des mélanges ajustés ; pour l’équilibre liquide–vapeur les écarts sont plus grands : à moins de 3 % d’une pression de rosée ou de bulle, et près du point critique du mélange, la phase suit l’évaluation externe. En phase dense, la marge est prise par rapport à la plus haute pression de l’enveloppe sur la plage de températures d’exploitation. Avec H₂ dans le flux, la bande côté bulle s’élargit à 3 % + 20·x_H₂, au plus 20 % : par rapport aux pressions de bulle mesurées de CO₂ + H₂ (Fandiño et al. 2015, 218–303 K), le modèle est jusqu’à 15 % trop bas. Une marge en phase dense à l’intérieur de cette bande suit aussi l’évaluation externe.","mixText":"Flux impur (section 13 de la spécification) : modèle de mélange multifluide en énergie de Helmholtz de Kunz & Wagner (2012) avec les équations de référence des corps purs CO₂, N₂, O₂, Ar, H₂, CH₄ et CO et les paramètres binaires et fonctions d’écart de la bibliothèque CoolProp/teqp (valeurs de GERG-2008 pour les paires avec H₂ et CH₄ et pour CO₂–N₂, N₂–O₂, O₂–CO, Ar–CO ; valeurs d’EOS-CG pour CO₂–O₂, CO₂–Ar, CO₂–CO, N₂–Ar, N₂–CO, O₂–Ar). L’enveloppe de phase est tracée depuis le point de rosée à 210 K au-delà du point critique ; les pressions de rosée et de bulle à la température du coin sont résolues à 1e-10 en ln p. Service gazeux : marge sous la pression de rosée au coin (au-delà de la cricondentherme : sous la pression à la masse volumique de réduction). Phase dense : marge au-dessus de la plus haute pression de l’enveloppe entre la température minimale et la température du coin (ou la cricondentherme). Les masses volumiques et les pressions de rosée et de bulle concordent avec CoolProp 8.0.0 à mieux que 1e-8 en relatif.","mixRange":"Criblage de mélange : au moins 90 % de CO₂ avec N₂, O₂, Ar, H₂, CH₄ et CO, jusqu’à 70 MPa et 700 K ; à moins de 3 % d’une pression de rosée ou de bulle ou près du point critique du mélange, la phase suit l’évaluation externe. Avec H₂, la bande côté bulle vaut 3 % + 20·x_H₂, au plus 20 %.","refKW":"Kunz & Wagner (2012), J. Chem. Eng. Data 57, 3032–3091 : modèle de mélange multifluide GERG-2008 ; Kunz et al. (2007), GERG Technical Monograph 15","refPure":"Équations de référence des corps purs : Span & Wagner 1996 (CO₂), Span et al. 2000 (N₂), Schmidt & Wagner 1985 (O₂), Tegeler et al. 1999 (Ar), Leachman et al. 2009 (H₂), Setzmann & Wagner 1991 (CH₄), Lemmon & Span 2006 (CO)","refBIP":"Paramètres binaires et fonctions d’écart tels que distribués avec CoolProp/teqp : Kunz & Wagner 2012 (paires avec H₂ et CH₄ ; CO₂–N₂, N₂–O₂, O₂–CO, Ar–CO), Gernert 2013 et Gernert & Span 2016, J. Chem. Thermodyn. 93, 274–293 (EOS-CG : CO₂–O₂, CO₂–Ar, CO₂–CO, N₂–Ar, N₂–CO, O₂–Ar)","exImpure":"CO₂ en phase dense avec 4 % d’impuretés","exImpureNote":"Même conduite 508 × 15,9 mm, 96 % de CO₂ avec 2 % N₂, 1 % O₂, 0,5 % Ar, 0,5 % H₂ : à 11 MPa et 45 °C, le modèle de mélange donne 467,9 kg/m³ pour un plancher de 600 kg/m³ (CO₂ pur : 603,2 kg/m³), la vérification de phase est donc rejetée ; la marge à la plus haute pression de l’enveloppe sur la plage 5–45 °C (8,20 MPa) est de 2,80 MPa.","w_h2_margin_band":"Hydrogène dans le flux : la marge de pression en phase dense se trouve dans la bande côté bulle (3 % + 20·x_H₂, au plus 20 % de la pression de référence). Le modèle est jusqu’à 15 % en dessous des pressions de bulle mesurées de CO₂ + H₂ ; la marge suit donc l’évaluation externe."},"es":{"title":"Reconversión de tuberías para H₂ / CO₂","subtitle":"Qué debe demostrarse antes de que una tubería existente transporte hidrógeno o CO₂: comprobaciones propias de cada modo, tensión circunferencial, cribado de grietas, cribado de fase del CO₂ y evidencia","reportTitle":"Cribado de la reconversión de una tubería","modePanel":"Modo de servicio y corriente","item":"Tubería o tramo","f_mode":"Modo de servicio","mode_h2blend":"mezcla con hidrógeno","mode_h2":"hidrógeno","mode_co2gas":"CO₂, gaseoso","mode_co2dense":"CO₂, fase densa","f_h2_fraction":"Fracción molar de hidrógeno","f_co2_fraction":"Fracción molar CO₂","f_water_ppm":"Contenido de agua","syntheticCase":"Caso sintético","pipePanel":"Tubería y operación","f_od":"Diámetro exterior","f_wall":"Espesor de pared","f_smys":"SMYS","f_p_max":"Presión máxima (absoluta)","f_p_min":"Presión mínima (absoluta)","f_p_ext":"Presión exterior (absoluta)","f_t_min":"Temperatura mínima","f_t_max":"Temperatura máxima","f_cycles_per_year":"Ciclos de presión por año","f_remaining_years":"Servicio restante, años","f_flaw_depth":"Profundidad del defecto evaluado","f_flaw_y":"Factor geométrico Y","f_k_env":"Tenacidad a la fractura en el medio de servicio","profilePanel":"Perfil normativo y criterios del proyecto","f_jurisdiction":"Jurisdicción o autoridad","f_edition":"Código y edición","f_criterion_source":"Fuente de los criterios del proyecto","f_stress_fraction":"Tensión circunferencial admisible / SMYS","f_k_ratio_max":"K / K_env admisible","f_water_limit_ppm":"Límite de agua","f_dense_min_density":"Densidad mínima en fase densa","evidencePanel":"Evidencia y datos","f_pipe_material":"Material de la tubería identificado","f_weld_material":"Material de soldadura identificado","f_defect_data":"Datos d
