          "en": "47 networks solved on the page. Consistency with the published method (_plb/circ/METHOD.md) against a separate Python implementation: the six presets, six single loops, nine combs (copper, stainless, multilayer × W 553, thermostatic, no valves), thirteen variations of the apartment block, a branched tree under all three methods, a thermostatic loop limited by the velocity cap and a pipe size outside the series, an omitted insulation class (= GEG 100 %) and two refused insulation classes outside the list; plus 3 external anchors worked by hand from the standard formulas (EN ISO 12241 heat loss, GEG Anlage 8 thickness, DVGW W 553 flow and proportional split, thermostatic loop balance). Since plbcirc-1.3 the default sizes the flow to 5 K over the whole loop (return into the heater, DVGW W 553 preface / W 551): anchor A1L checks it (0.01224 kg/s, 55.0 °C); A1 shows the flow-pipe rule failing with a 51.4 °C return.",
          "uk": "47 мереж, розв’язаних на сторінці. Узгодженість з опублікованим методом (_plb/circ/METHOD.md) порівняно з окремою реалізацією на Python: шість прикладів, шість одиночних контурів, дев’ять «гребінок» (мідь, нержавіюча сталь, багатошарова × W 553, термостатичні клапани, без клапанів), тринадцять варіантів житлового будинку, розгалужене дерево за всіма трьома методами, термостатичний контур, обмежений граничною швидкістю, діаметр поза рядом, пропущений клас ізоляції (= GEG 100 %) і два відхилені класи ізоляції поза переліком; плюс 3 зовнішні опорні випадки, пораховані вручну за формулами норм (тепловтрати за EN ISO 12241, товщина ізоляції за GEG Anlage 8, витрата й пропорційний розподіл DVGW W 553, баланс термостатичного контуру). Від plbcirc-1.3 за замовчуванням витрата розраховується на 5 K для всього контуру (зворот у нагрівач, передмова DVGW W 553 / W 551): це перевіряє анкер A1L (0,01224 кг/с, 55,0 °C); A1 показує, що правило лише подавальних труб дає зворот 51,4 °C — невідповідність.",
          "de": "47 auf der Seite gelöste Netze. Konsistenz mit der veröffentlichten Methode (_plb/circ/METHOD.md) gegen eine getrennte Python-Umsetzung: die sechs Beispiele, sechs Einzelschleifen, neun Kämme (Kupfer, Edelstahl, Verbund × W 553, Thermostatventile, ohne Ventile), dreizehn Varianten des Wohnhauses, ein verzweigter Baum mit allen drei Methoden, eine durch die Geschwindigkeitsgrenze begrenzte Thermostatschleife, eine Rohrdimension außerhalb der Reihe, eine fehlende Dämmklasse (= GEG 100 %) und zwei abgewiesene Dämmklassen außerhalb der Liste; dazu 3 externe Ankerfälle, von Hand aus den Normformeln gerechnet (Wärmeverlust nach EN ISO 12241, Dämmdicke nach GEG Anlage 8, Volumenstrom und proportionale Aufteilung nach DVGW W 553, Bilanz der Thermostatschleife). Seit plbcirc-1.3 bemisst die Voreinstellung den Volumenstrom auf 5 K über die ganze Schleife (Eintritt in den Speicher, Vorwort DVGW W 553 / W 551): Anker A1L prüft das (0,01224 kg/s, 55,0 °C); A1 zeigt die Regel nur für Warmwasserleitungen, die mit 51,4 °C Rücklauf scheitert.",

  'e.ins': T7('Insulation must be none, GEG 50 %, GEG 100 % or custom (ins:<section>).', 'Ізоляція має бути: немає, GEG 50 %, GEG 100 % або власна (ins:<ділянка>).', 'Die Dämmung muss keine, GEG 50 %, GEG 100 % oder eigene sein (ins:<Abschnitt>).', 'De isolatie moet geen, GEG 50 %, GEG 100 % of eigen zijn (ins:<sectie>).', 'L’isolation doit être aucune, GEG 50 %, GEG 100 % ou personnalisée (ins:<tronçon>).', 'El aislamiento debe ser ninguno, GEG 50 %, GEG 100 % o personalizado (ins:<tramo>).', 'Izolacja musi być: brak, GEG 50 %, GEG 100 % lub własna (ins:<odcinek>).'),
  'e.dTloop': T7('With the whole-loop basis the return T_out − ΔT must stay above every ambient temperature (dT_loop).', 'Для всього контуру зворот T_out − ΔT має бути вищим за кожну температуру довкілля (dT_loop).', 'Bei der ganzen Schleife muss der Rücklauf T_out − ΔT über jeder Umgebungstemperatur liegen (dT_loop).', 'Voor de hele lus moet de retour T_out − ΔT boven elke omgevingstemperatuur blijven (dT_loop).', 'Pour la boucle entière, le retour T_out − ΔT doit rester au-dessus de chaque température ambiante (dT_loop).', 'Para el bucle completo, el retorno T_out − ΔT debe quedar por encima de cada temperatura ambiente (dT_loop).', 'Dla całej pętli powrót T_out − ΔT musi być wyższy od każdej temperatury otoczenia (dT_loop).'),
  'v.ret': T7('Not compliant: the water returns to the heater at %r °C, below %t °C (DVGW W 551: at most 5 K cooling, ≥ 55 °C at the return into the heater). Needed: about %q L/h instead of %n L/h.', 'Невідповідність: вода повертається до нагрівача з %r °C, нижче %t °C (DVGW W 551: охолодження не більш як на 5 K, ≥ 55 °C на вході звороту в нагрівач). Потрібно близько %q л/год замість %n л/год.', 'Nicht erfüllt: das Wasser kommt mit %r °C zum Speicher zurück, unter %t °C (DVGW W 551: höchstens 5 K Abkühlung, ≥ 55 °C am Zirkulationseintritt). Nötig: etwa %q L/h statt %n L/h.', 'Niet conform: het water keert met %r °C terug naar de boiler, onder %t °C (DVGW W 551: hoogstens 5 K afkoeling, ≥ 55 °C bij de terugkeer in de boiler). Nodig: ongeveer %q L/h in plaats van %n L/h.', 'Non conforme : l’eau revient au préparateur à %r °C, sous %t °C (DVGW W 551 : au plus 5 K de refroidissement, ≥ 55 °C au retour dans le préparateur). Il faut environ %q L/h au lieu de %n L/h.', 'No conforme: el agua vuelve al acumulador a %r °C, por debajo de %t °C (DVGW W 551: como máximo 5 K de enfriamiento, ≥ 55 °C en el retorno al acumulador). Hacen falta unos %q L/h en lugar de %n L/h.', 'Niezgodność: woda wraca do podgrzewacza z %r °C, poniżej %t °C (DVGW W 551: schłodzenie najwyżej 5 K, ≥ 55 °C na powrocie do podgrzewacza). Potrzeba ok. %q L/h zamiast %n L/h.'),
  'n.split_loop': T7('Whole-loop design: %d K from the heater outlet to the return into the heater (return pipes included) gives %q L/h, divided in proportion to the downstream flow-pipe losses (W 553); static valves equalise every loop to the index loop %i. The flow-pipe rule alone would give %w L/h.', 'Розрахунок на весь контур: %d K від виходу з нагрівача до повернення в нього (разом зі зворотними трубами) дає %q л/год, розподілених пропорційно втратам подачі нижче за течією (W 553); статичні клапани вирівнюють петлі до розрахункової %i. Лише правило подавальних труб дало б %w л/год.', 'Auslegung auf die ganze Schleife: %d K vom Speicheraustritt bis zum Zirkulationseintritt (Zirkulationsleitungen eingeschlossen) ergeben %q L/h, aufgeteilt im Verhältnis der nachfolgenden Verluste der Warmwasserleitungen (W 553); statische Ventile gleichen jede Schleife an die ungünstigste %i an. Die Regel nur für Warmwasserleitungen ergäbe %w L/h.', 'Ontwerp op de hele lus: %d K van boileruitlaat tot terugkeer in de boiler (retourleidingen inbegrepen) geeft %q L/h, verdeeld naar verhouding van de aanvoerverliezen verderop (W 553); statische ventielen regelen elke lus in op de indexlus %i. De regel voor alleen de aanvoer zou %w L/h geven.', 'Calcul sur la boucle entière : %d K de la sortie du préparateur au retour dans celui-ci (retours compris) donnent %q L/h, répartis au prorata des pertes de l’aller en aval (W 553) ; les vannes statiques alignent chaque boucle sur la plus défavorisée %i. La règle de l’aller seul donnerait %w L/h.', 'Diseño sobre el bucle completo: %d K desde la salida del acumulador hasta el retorno a él (retornos incluidos) dan %q L/h, repartidos en proporción a las pérdidas de la ida aguas abajo (W 553); las válvulas estáticas igualan cada bucle con el más desfavorable %i. La regla solo de la ida daría %w L/h.', 'Obliczenie na całą pętlę: %d K od wylotu podgrzewacza do powrotu do niego (z przewodami cyrkulacyjnymi) daje %q L/h, rozdzielone proporcjonalnie do strat zasilania dalej w sieci (W 553); zawory statyczne wyrównują pętle do pętli krytycznej %i. Sama reguła zasilania dałaby %w L/h.'),

  'fl.outlet_below_60': T7('Heater outlet below 60 °C: DVGW W 551 (and CEN/TR 16355) expect 60 °C at the heater outlet. The Flemish Legionellabesluit fixes 60 °C only for exempt sites (Art. 18); elsewhere temperature control is a measure of the control plan.', 'Вихід нагрівача нижче 60 °C: DVGW W 551 (і CEN/TR 16355) вимагають 60 °C на виході нагрівача. Фламандський Legionellabesluit прямо встановлює 60 °C лише для звільнених закладів (ст. 18); в інших випадках контроль температури — захід плану управління.', 'Speicheraustritt unter 60 °C: DVGW W 551 (und CEN/TR 16355) verlangen 60 °C am Austritt des Trinkwassererwärmers. Der flämische Legionellabesluit schreibt 60 °C nur für ausgenommene Einrichtungen fest vor (Art. 18); sonst ist die Temperaturhaltung eine Maßnahme des Beherrschungsplans.', 'Uitlaat onder 60 °C: DVGW W 551 (en CEN/TR 16355) vragen 60 °C aan de uitlaat van de boiler. Het Vlaamse Legionellabesluit legt 60 °C alleen vast voor vrijgestelde inrichtingen (art. 18); elders is temperatuurbeheersing een maatregel van het beheersplan.', 'Sortie sous 60 °C : DVGW W 551 (et CEN/TR 16355) demandent 60 °C en sortie de préparateur. Le Legionellabesluit flamand n’impose 60 °C que pour les établissements dispensés (art. 18) ; ailleurs, la maîtrise de la température est une mesure du plan de gestion.', 'Salida por debajo de 60 °C: DVGW W 551 (y CEN/TR 16355) piden 60 °C a la salida del acumulador. El Legionellabesluit flamenco fija 60 °C solo para los establecimientos exentos (art. 18); en los demás, el control de temperatura es una medida del plan de gestión.', 'Wyjście poniżej 60 °C: DVGW W 551 (i CEN/TR 16355) wymagają 60 °C na wyjściu podgrzewacza. Flamandzki Legionellabesluit narzuca 60 °C wprost tylko obiektom zwolnionym (art. 18); w pozostałych kontrola temperatury jest środkiem planu zarządzania.'),
  'fl.return_below_min': T7('The water returns to the heater below the minimum — the whole loop is not kept at temperature.', 'Вода повертається до нагрівача нижче мінімуму — контур не утримує температуру.', 'Das Wasser kehrt unter der Mindesttemperatur zum Speicher zurück — die Schleife hält die Temperatur nicht.', 'Het water keert onder het minimum terug — de lus houdt de temperatuur niet.', 'L’eau revient sous le minimum — la boucle ne tient pas la température.', 'El agua vuelve por debajo del mínimo: el circuito no mantiene la temperatura.', 'Woda wraca poniżej minimum — pętla nie utrzymuje temperatury.'),
  'fl.flow_basis_approx': T7('Flow-pipe rule: the pump flow comes from the flow-pipe losses only (W 553 split). This is an approximation — it does not show that the water stays within 5 K up to the return into the heater (W 553 preface, W 551). A %t °C return needs %q L/h (now %n L/h).', 'Правило подавальних труб: витрата насоса визначена лише за втратами подачі (розподіл W 553). Це наближення — воно не доводить, що вода охолоджується не більш як на 5 K до повернення в нагрівач (передмова W 553, W 551). Для звороту %t °C потрібно %q л/год (зараз %n л/год).', 'Regel nur für Warmwasserleitungen: der Förderstrom folgt nur aus deren Verlusten (Aufteilung nach W 553). Das ist eine Näherung — sie weist nicht nach, dass die Abkühlung bis zum Zirkulationseintritt in den Speicher höchstens 5 K beträgt (Vorwort W 553, W 551). Für %t °C Rücklauf sind %q L/h nötig (jetzt %n L/h).', 'Regel voor alleen de aanvoer: het pompdebiet volgt enkel uit de verliezen van de aanvoer (verdeling W 553). Dat is een benadering — ze toont niet aan dat het water tot de terugkeer in de boiler binnen 5 K blijft (voorwoord W 553, W 551). Een retour van %t °C vraagt %q L/h (nu %n L/h).', 'Règle de l’aller seul : le débit vient des seules pertes de l’aller (répartition W 553). C’est une approximation — elle ne démontre pas que l’eau reste dans 5 K jusqu’au retour dans le préparateur (avant-propos W 553, W 551). Un retour à %t °C demande %q L/h (actuellement %n L/h).', 'Regla solo de la ida: el caudal sale solo de las pérdidas de la ida (reparto W 553). Es una aproximación: no demuestra que el agua se mantenga dentro de 5 K hasta el retorno al acumulador (prólogo de W 553, W 551). Un retorno de %t °C necesita %q L/h (ahora %n L/h).', 'Reguła samego zasilania: przepływ pompy wynika tylko ze strat przewodów zasilających (podział W 553). To przybliżenie — nie dowodzi, że woda schładza się najwyżej o 5 K aż do powrotu do podgrzewacza (przedmowa W 553, W 551). Powrót %t °C wymaga %q L/h (teraz %n L/h).'),
  'fl.interruption_over_8h': T7('The circulation stops more than 8 h a day; DVGW W 551 allows at most 8 h, and only in systems that are hygienically sound.', 'Циркуляція зупиняється більш ніж на 8 год на добу; DVGW W 551 допускає щонайбільше 8 год і лише в гігієнічно справних системах.', 'Die Zirkulation steht mehr als 8 h am Tag; DVGW W 551 erlaubt höchstens 8 h und nur in hygienisch einwandfreien Anlagen.', 'De circulatie staat meer dan 8 u per dag stil; DVGW W 551 staat hoogstens 8 u toe, en alleen in hygiënisch goede installaties.', 'Le bouclage s’arrête plus de 8 h par jour ; DVGW W 551 admet au plus 8 h, et seulement dans une installation saine.', 'La recirculación se detiene más de 8 h al día; DVGW W 551 admite como máximo 8 h y solo en instalaciones higiénicamente correctas.', 'Cyrkulacja stoi dłużej niż 8 h na dobę; DVGW W 551 dopuszcza najwyżej 8 h i tylko w instalacjach higienicznie sprawnych.'),
  'fl.velocity_high': T7('Velocity above the limit in %s — noise and erosion risk; enlarge that pipe.', 'Швидкість понад межу в %s — шум і ерозія; збільште цю трубу.', 'Geschwindigkeit über der Grenze in %s — Geräusch- und Erosionsgefahr; Leitung vergrößern.', 'Snelheid boven de grens in %s — geluid en erosie; vergroot die leiding.', 'Vitesse au-delà de la limite dans %s — bruit et érosion ; agrandir ce tube.', 'Velocidad por encima del límite en %s: ruido y erosión; aumente esa tubería.', 'Prędkość powyżej granicy w %s — hałas i erozja; zwiększ tę rurę.'),

        'Stojąca ciepła woda stygnie do temperatury pomieszczenia, a między 25 a 45 °C namnażają się bakterie Legionella. Pompa cyrkulacyjna utrzymuje mały przepływ w każdym pionie, aby woda wszędzie miała co najmniej 55 °C i ciepła woda docierała do kranu w kilka sekund.') },
    w553: { title: T7('The W 553 flow rule', 'Правило витрати W 553', 'Die Volumenstromregel nach W 553', 'De debietregel van W 553', 'La règle de débit W 553', 'La regla de caudal W 553', 'Reguła przepływu W 553'),
      body: T7('The DVGW W 553 preface limits the cooling to 5 K between the heater outlet and the circulation inlet into the heater, everywhere in the loop (W 551: 60 °C out, ≥ 55 °C back). The old hand rule takes the pump flow from the FLOW-pipe losses only, m = ΣQ / (c_p·ΔT) — the return pipes lose heat too, so with 5 K on the flow pipes the water comes back near 51 °C, which fails. This tool therefore raises the flow until the mixed return into the heater is exactly T_out − ΔT (exact exponential cooling, return pipes included) and divides it at every junction in proportion to the flow-pipe losses downstream, as W 553 does. Switch “The drop applies to” to flow pipes only to see the old rule and the flow it misses.', 'Передмова DVGW W 553 обмежує охолодження 5 K між виходом з нагрівача та входом циркуляції в нагрівач — у будь-якій точці контуру (W 551: 60 °C на виході, ≥ 55 °C на звороті). Старе ручне правило бере витрату насоса лише з втрат ПОДАВАЛЬНИХ труб, m = ΣQ / (c_p·ΔT), — але зворотні труби теж втрачають тепло, тож при 5 K на подачі вода повертається з близько 51 °C, що не відповідає вимозі. Тому інструмент збільшує витрату, доки змішаний зворот у нагрівач не дорівнює T_out − ΔT (точне експоненційне охолодження, зі зворотними трубами), і в кожному вузлі ділить її пропорційно втратам подачі нижче за течією, як у W 553. Перемкніть «Падіння стосується» на «лише подавальні труби», щоб побачити старе правило і витрату, якої йому бракує.', 'Das Vorwort der DVGW W 553 begrenzt die Abkühlung zwischen Speicheraustritt und Zirkulationseintritt in den Speicher auf 5 K, an jeder Stelle der Schleife (W 551: 60 °C aus, ≥ 55 °C zurück). Die alte Handregel nimmt den Förderstrom nur aus den Verlusten der WARMWASSERleitungen, m = ΣQ / (c_p·ΔT) — auch die Zirkulationsleitungen verlieren Wärme, mit 5 K auf den Warmwasserleitungen kommt das Wasser daher mit etwa 51 °C zurück, und das ist nicht erfüllt. Dieses Werkzeug erhöht deshalb den Volumenstrom, bis der gemischte Rücklauf in den Speicher genau T_out − ΔT ist (exakte exponentielle Abkühlung, Zirkulationsleitungen eingeschlossen), und teilt ihn an jeder Abzweigung im Verhältnis der nachfolgenden Verluste der Warmwasserleitungen auf, wie W 553. Mit „Die Abkühlung gilt für“ = nur Warmwasserleitungen sehen Sie die alte Regel und den fehlenden Volumenstrom.', 'Het voorwoord van DVGW W 553 beperkt de afkoeling tot 5 K tussen boileruitlaat en de terugkeer van de circulatie in de boiler, overal in de lus (W 551: 60 °C uit, ≥ 55 °C terug). De oude vuistregel haalt het pompdebiet alleen uit het verlies van de AANVOERleidingen, m = ΣQ / (c_p·ΔT) — ook de retourleidingen verliezen warmte, dus met 5 K op de aanvoer komt het water rond 51 °C terug, en dat voldoet niet. Deze tool verhoogt daarom het debiet tot de gemengde retour in de boiler precies T_out − ΔT is (exacte exponentiële afkoeling, retourleidingen inbegrepen) en verdeelt het bij elke aftakking naar verhouding van de aanvoerverliezen verderop, zoals W 553. Zet „De daling geldt voor” op alleen aanvoerleidingen om de oude regel en het ontbrekende debiet te zien.', 'L’avant-propos de DVGW W 553 limite le refroidissement à 5 K entre la sortie du préparateur et l’entrée de la circulation dans celui-ci, en tout point de la boucle (W 551 : 60 °C au départ, ≥ 55 °C au retour). L’ancienne règle manuelle tire le débit des seules pertes de l’ALLER, m = ΣQ / (c_p·ΔT) — le retour perd aussi de la chaleur, donc avec 5 K sur l’aller l’eau revient vers 51 °C, ce qui n’est pas conforme. L’outil augmente donc le débit jusqu’à ce que le retour mélangé dans le préparateur soit exactement T_out − ΔT (refroidissement exponentiel exact, retours compris) et le répartit à chaque piquage au prorata des pertes de l’aller en aval, comme W 553. Mettez « La chute porte sur » sur aller seulement pour voir l’ancienne règle et le débit qui lui manque.', 'El prólogo de DVGW W 553 limita el enfriamiento a 5 K entre la salida del acumulador y la entrada de la recirculación en él, en cualquier punto del bucle (W 551: 60 °C de salida, ≥ 55 °C de vuelta). La antigua regla manual toma el caudal solo de las pérdidas de la IDA, m = ΣQ / (c_p·ΔT); el retorno también pierde calor, así que con 5 K en la ida el agua vuelve a unos 51 °C, lo que no cumple. Por eso la herramienta aumenta el caudal hasta que el retorno mezclado al acumulador es exactamente T_out − ΔT (enfriamiento exponencial exacto, retornos incluidos) y lo reparte en cada derivación en proporción a las pérdidas de la ida aguas abajo, como W 553. Cambie «La caída se aplica a» a solo la ida para ver la regla antigua y el caudal que le falta.', 'Przedmowa DVGW W 553 ogranicza schłodzenie do 5 K między wylotem podgrzewacza a wejściem cyrkulacji do podgrzewacza, w każdym miejscu pętli (W 551: 60 °C na wylocie, ≥ 55 °C na powrocie). Dawna reguła ręczna liczy przepływ pompy tylko ze strat przewodów ZASILAJĄCYCH, m = ΣQ / (c_p·ΔT) — przewody cyrkulacyjne też tracą ciepło, więc przy 5 K na zasilaniu woda wraca z ok. 51 °C, co jest niezgodne. Dlatego narzędzie zwiększa przepływ, aż zmieszany powrót do podgrzewacza wynosi dokładnie T_out − ΔT (dokładne wykładnicze schładzanie, z przewodami cyrkulacyjnymi), i w każdym węźle dzieli go proporcjonalnie do strat zasilania dalej w sieci, jak W 553. Przełącz „Spadek dotyczy” na tylko przewody zasilające, aby zobaczyć dawną regułę i brakujący przepływ.') },
    exact: { title: T7('Exact energy balance', 'Точний енергобаланс', 'Exakte Energiebilanz', 'Exacte energiebalans', 'Bilan énergétique exact', 'Balance energético exacto', 'Dokładny bilans energii'),
      body: T7('Whatever sets the flows, the tool then follows the water: in each pipe the temperature decays exponentially towards the ambient, T_out = Ta + (T_in − Ta)·exp(−U′L/(m·c_p)); returns from several risers mix by mass. The total loss equals m·c_p·(T_heater − T_return) — the page checks that.',
        'Хоч би як задано витрати, інструмент далі стежить за водою: у кожній трубі температура експоненційно наближається до температури довкілля, T_вих = Ta + (T_вх − Ta)·exp(−U′L/(m·c_p)); звороти кількох стояків змішуються за масою. Сумарні втрати дорівнюють m·c_p·(T_нагр − T_звор) — сторінка це перевіряє.',
        'Egal, wie die Volumenströme entstehen: das Werkzeug verfolgt danach das Wasser. In jeder Leitung nähert sich die Temperatur exponentiell der Umgebung, T_aus = Ta + (T_ein − Ta)·exp(−U′L/(m·c_p)); Rückläufe mehrerer Stränge mischen sich nach Masse. Der Gesamtverlust ist m·c_p·(T_Speicher − T_Rücklauf) — die Seite prüft das.',
        'Hoe de debieten ook tot stand komen, de tool volgt daarna het water: in elke leiding daalt de temperatuur exponentieel naar de omgeving, T_uit = Ta + (T_in − Ta)·exp(−U′L/(m·c_p)); retouren van meerdere stijgleidingen mengen naar massa. Het totale verlies is m·c_p·(T_boiler − T_retour) — de pagina controleert dat.',
        'Quelle que soit l’origine des débits, l’outil suit ensuite l’eau : dans chaque tube la température tend exponentiellement vers l’ambiance, T_sortie = Ta + (T_entrée − Ta)·exp(−U′L/(m·c_p)) ; les retours de plusieurs colonnes se mélangent au prorata des masses. La perte totale vaut m·c_p·(T_prép − T_retour) — la page le vérifie.',
        'Sea cual sea el origen de los caudales, la herramienta sigue después al agua: en cada tubería la temperatura decae exponencialmente hacia el ambiente, T_sal = Ta + (T_ent − Ta)·exp(−U′L/(m·c_p)); los retornos de varios montantes se mezclan según su masa. La pérdida total es m·c_p·(T_acum − T_retorno) y la página lo comprueba.',
        'Niezależnie od tego, jak ustalono przepływy, narzędzie śledzi dalej wodę: w każdej rurze temperatura wykładniczo zbliża się do temperatury otoczenia, T_wyl = Ta + (T_wl − Ta)·exp(−U′L/(m·c_p)); powroty kilku pionów mieszają się wagowo. Całkowita strata równa się m·c_p·(T_podgrz − T_powrotu) — strona to sprawdza.') },
    thermo: { title: T7('Thermostatic circulation valves', 'Термостатичні циркуляційні клапани', 'Thermostatische Zirkulationsventile', 'Thermostatische circulatieventielen', 'Vannes de bouclage thermostatiques', 'Válvulas de recirculación termostáticas', 'Termostatyczne zawory cyrkulacyjne'),
      body: T7('A thermostatic valve at the foot of each return riser throttles until the water reaching it has the setpoint (e.g. 57 °C). Each riser then takes exactly the flow its own losses need: m = (U′_f L_f + U′_r L_r) / (c_p ln((T_in − Ta)/(T_set − Ta))). The far riser is no longer starved — but the flow can be much larger than the W 553 design and the pump and return mains must carry it.',
        'Термостатичний клапан унизу кожного зворотного стояка прикривається, доки вода не матиме уставку (напр. 57 °C). Кожен стояк бере рівно ту витрату, якої потребують його втрати: m = (U′_п L_п + U′_з L_з) / (c_p ln((T_вх − Ta)/(T_уст − Ta))). Дальній стояк більше не голодує — але витрата може значно перевищити розрахунок W 553, і насос та зворотні магістралі мають її пропустити.',
        'Ein Thermostatventil am Fuß jedes Zirkulationsstrangs drosselt, bis das ankommende Wasser den Sollwert hat (z. B. 57 °C). Jeder Strang erhält genau den Volumenstrom, den seine Verluste brauchen: m = (U′_V L_V + U′_Z L_Z) / (c_p ln((T_ein − Ta)/(T_soll − Ta))). Der ferne Strang verhungert nicht mehr — aber der Volumenstrom kann weit über der W-553-Auslegung liegen, und Pumpe und Zirkulationssammelleitung müssen ihn tragen.',
        'Een thermostatisch ventiel onderaan elke retourstijgleiding knijpt tot het water het setpoint heeft (bv. 57 °C). Elke stijgleiding krijgt dan precies het debiet dat haar verliezen vragen: m = (U′_a L_a + U′_r L_r) / (c_p ln((T_in − Ta)/(T_set − Ta))). De verste stijgleiding komt niet meer tekort — maar het debiet kan veel groter zijn dan het W 553-ontwerp, en pomp en retourverzamelleiding moeten het dragen.',
        'Une vanne thermostatique au pied de chaque colonne retour se ferme jusqu’à ce que l’eau atteigne la consigne (p. ex. 57 °C). Chaque colonne prend exactement le débit que ses pertes demandent : m = (U′_a L_a + U′_r L_r) / (c_p ln((T_entrée − Ta)/(T_cons − Ta))). La colonne éloignée n’est plus affamée — mais le débit peut dépasser largement le calcul W 553, et la pompe et le collecteur retour doivent le passer.',
        'Una válvula termostática al pie de cada montante de retorno estrangula hasta que el agua llega a la consigna (p. ej. 57 °C). Cada montante toma justo el caudal que piden sus pérdidas: m = (U′_i L_i + U′_r L_r) / (c_p ln((T_ent − Ta)/(T_cons − Ta))). El montante lejano deja de quedarse sin caudal, pero el caudal puede superar con mucho el diseño W 553 y la bomba y el colector de retorno deben transportarlo.',
        'Zawór termostatyczny u podstawy każdego pionu cyrkulacyjnego przymyka się, aż dopływająca woda osiągnie nastawę (np. 57 °C). Każdy pion dostaje dokładnie przepływ, jakiego wymagają jego straty: m = (U′_z L_z + U′_c L_c) / (c_p ln((T_wl − Ta)/(T_nast − Ta))). Najdalszy pion przestaje być niedopływowy — ale przepływ może znacznie przekroczyć obliczenie W 553, a pompa i przewód zbiorczy cyrkulacji muszą go przenieść.') },
    balancing: { title: T7('Balancing and kv', 'Балансування і kv', 'Abgleich und kv', 'Inregeling en kv', 'Équilibrage et kv', 'Equilibrado y kv', 'Równoważenie i kv'),
      body: T7('Without valves the water takes the shortest way: the nearest riser gets most of the flow and the farthest one goes cold, even with a big pump. A static balancing valve in each loop adds the missing resistance: Δp_valve = Δp_index + Δp_min − Δp_path and kv = Q[m³/h]/√Δp[bar]. Very small kv values are hard to set — then use a smaller valve or a thermostatic one.',
        'Без клапанів вода йде найкоротшим шляхом: найближчий стояк отримує більшість витрати, а найдальший холоне навіть з великим насосом. Статичний балансувальний клапан у кожній петлі додає бракуючий опір: Δp_кл = Δp_розр + Δp_мін − Δp_шляху, kv = Q[м³/год]/√Δp[бар]. Дуже малі kv важко налаштувати — тоді менший або термостатичний клапан.',
        'Ohne Ventile nimmt das Wasser den kürzesten Weg: der nächste Strang bekommt den Großteil, der fernste wird kalt — auch mit großer Pumpe. Ein statisches Strangregulierventil in jeder Schleife ergänzt den fehlenden Widerstand: Δp_Ventil = Δp_ungünstigst + Δp_min − Δp_Weg und kv = Q[m³/h]/√Δp[bar]. Sehr kleine kv-Werte sind schwer einzustellen — dann kleineres oder thermostatisches Ventil.',
        'Zonder ventielen neemt het water de kortste weg: de dichtste stijgleiding krijgt het meeste debiet en de verste wordt koud, zelfs met een grote pomp. Een statisch inregelventiel in elke lus voegt de ontbrekende weerstand toe: Δp_ventiel = Δp_index + Δp_min − Δp_traject en kv = Q[m³/h]/√Δp[bar]. Heel kleine kv-waarden zijn moeilijk in te stellen — dan een kleiner of thermostatisch ventiel.',
        'Sans vannes, l’eau prend le chemin le plus court : la colonne la plus proche prend l’essentiel du débit et la plus éloignée refroidit, même avec une grosse pompe. Une vanne d’équilibrage statique dans chaque boucle ajoute la résistance manquante : Δp_vanne = Δp_index + Δp_min − Δp_chemin et kv = Q[m³/h]/√Δp[bar]. Les très petits kv sont difficiles à régler — vanne plus petite ou thermostatique.',
        'Sin válvulas el agua va por el camino más corto: el montante más cercano se lleva casi todo el caudal y el más lejano se enfría, incluso con una bomba grande. Una válvula de equilibrado estática en cada bucle añade la resistencia que falta: Δp_válvula = Δp_índice + Δp_mín − Δp_recorrido y kv = Q[m³/h]/√Δp[bar]. Los kv muy pequeños son difíciles de ajustar: use una válvula menor o termostática.',
        'Bez zaworów woda płynie najkrótszą drogą: najbliższy pion dostaje większość przepływu, a najdalszy stygnie nawet przy dużej pompie. Statyczny zawór równoważący w każdej pętli dodaje brakujący opór: Δp_zaw = Δp_kryt + Δp_min − Δp_drogi i kv = Q[m³/h]/√Δp[bar]. Bardzo małe kv trudno nastawić — wtedy mniejszy zawór lub termostatyczny.') },
    insulation: { title: T7('Insulation and heat loss', 'Ізоляція і тепловтрати', 'Dämmung und Wärmeverlust', 'Isolatie en warmteverlies', 'Isolation et pertes', 'Aislamiento y pérdidas', 'Izolacja i straty ciepła'),
      body: T7('Heat loss per metre and kelvin of a pipe with insulation thickness s: U′ = π / (ln(D/D_o)/(2λ) + 1/(h_o·D)), D = D_o + 2s. “GEG 100 %” uses the German GEG Anlage 8 thicknesses (20 mm up to 22 mm inner diameter, 30 mm up to 35, then equal to the inner diameter, max 100 mm, at λ 0.035); a bare pipe loses roughly five to ten times more. h_o = 9 W/(m²·K) is a learning assumption.',
        'Втрати на метр і кельвін труби з ізоляцією товщиною s: U′ = π / (ln(D/D_o)/(2λ) + 1/(h_o·D)), D = D_o + 2s. «GEG 100 %» — товщини німецького GEG Anlage 8 (20 мм до 22 мм внутрішнього діаметра, 30 мм до 35, далі рівна внутрішньому діаметру, макс. 100 мм, при λ 0,035); гола труба втрачає приблизно в п’ять–десять разів більше. h_o = 9 Вт/(м²·К) — навчальне припущення.',
        'Wärmeverlust je Meter und Kelvin einer Leitung mit Dämmdicke s: U′ = π / (ln(D/D_o)/(2λ) + 1/(h_o·D)), D = D_o + 2s. „GEG 100 %“ nutzt die Dicken der GEG Anlage 8 (20 mm bis 22 mm Innendurchmesser, 30 mm bis 35, dann gleich Innendurchmesser, max. 100 mm, bei λ 0,035); eine ungedämmte Leitung verliert etwa fünf- bis zehnmal mehr. h_o = 9 W/(m²·K) ist eine Lernannahme.',
        'Warmteverlies per meter en kelvin van een leiding met isolatiedikte s: U′ = π / (ln(D/D_o)/(2λ) + 1/(h_o·D)), D = D_o + 2s. “GEG 100 %” gebruikt de diktes van de Duitse GEG Anlage 8 (20 mm tot 22 mm binnendiameter, 30 mm tot 35, daarna gelijk aan de binnendiameter, max. 100 mm, bij λ 0,035); een naakte leiding verliest ruwweg vijf tot tien keer meer. h_o = 9 W/(m²·K) is een leeraanname.',
        'Perte par mètre et par kelvin d’un tube isolé d’épaisseur s : U′ = π / (ln(D/D_o)/(2λ) + 1/(h_o·D)), D = D_o + 2s. « GEG 100 % » reprend les épaisseurs de la GEG Anlage 8 allemande (20 mm jusqu’à 22 mm de diamètre intérieur, 30 mm jusqu’à 35, puis égale au diamètre intérieur, max. 100 mm, à λ 0,035) ; un tube nu perd environ cinq à dix fois plus. h_o = 9 W/(m²·K) est une hypothèse pédagogique.',
        'Pérdida por metro y kelvin de una tubería con aislamiento de espesor s: U′ = π / (ln(D/D_o)/(2λ) + 1/(h_o·D)), D = D_o + 2s. «GEG 100 %» usa los espesores de la GEG Anlage 8 alemana (20 mm hasta 22 mm de diámetro interior, 30 mm hasta 35, luego igual al diámetro interior, máx. 100 mm, con λ 0,035); un tubo desnudo pierde de cinco a diez veces más. h_o = 9 W/(m²·K) es un supuesto didáctico.',
        'Strata na metr i kelwin rury z izolacją o grubości s: U′ = π / (ln(D/D_o)/(2λ) + 1/(h_o·D)), D = D_o + 2s. „GEG 100 %” to grubości z niemieckiego GEG Anlage 8 (20 mm do 22 mm średnicy wewnętrznej, 30 mm do 35, dalej równa średnicy wewnętrznej, maks. 100 mm, przy λ 0,035); rura nieizolowana traci mniej więcej pięć do dziesięciu razy więcej. h_o = 9 W/(m²·K) to założenie dydaktyczne.') },
    legionella: { title: T7('The 60/55 °C rule', 'Правило 60/55 °C', 'Die 60/55-°C-Regel', 'De 60/55 °C-regel', 'La règle 60/55 °C', 'La regla de 60/55 °C', 'Reguła 60/55 °C'),
      body: T7('DVGW W 551 and CEN/TR 16355 expect 60 °C at the heater outlet and at least 55 °C everywhere in the circulation, with stops of at most 8 hours a day (W 551). The Flemish Legionellabesluit (publicly accessible establishments) fixes 60 °C directly only for exempt sites (Art. 18); elsewhere temperature control is one of the measures of the control plan. Every section below the minimum is listed and goes to the legionella assessment (plblegionella). Regional rules may be stricter — check them.',
        'DVGW W 551 і CEN/TR 16355 вимагають 60 °C на виході нагрівача і щонайменше 55 °C скрізь у циркуляції, із зупинками не довше 8 годин на добу (W 551). Фламандський Legionellabesluit (публічно доступні заклади) прямо встановлює 60 °C лише для звільнених закладів (ст. 18); в інших випадках контроль температури — один із заходів плану управління. Кожну ділянку нижче мінімуму перелічено, і вона йде до оцінки ризику легіонели (plblegionella). Регіональні правила можуть бути суворішими — перевірте їх.',
        'DVGW W 551 und CEN/TR 16355 verlangen 60 °C am Speicheraustritt und mindestens 55 °C überall in der Zirkulation, mit Unterbrechungen von höchstens 8 Stunden am Tag (W 551). Der flämische Legionellabesluit (öffentlich zugängliche Einrichtungen) schreibt 60 °C nur für ausgenommene Einrichtungen direkt vor (Art. 18); sonst ist die Temperaturhaltung eine der Maßnahmen des Beherrschungsplans. Jeder Abschnitt unter dem Mindestwert wird gelistet und geht in die Legionellenbewertung (plblegionella). Regionale Regeln können strenger sein — prüfen Sie sie.',
        'DVGW W 551 en CEN/TR 16355 vragen 60 °C aan de uitlaat van de boiler en minstens 55 °C overal in de circulatie, met onderbrekingen van hoogstens 8 uur per dag (W 551). Het Vlaamse Legionellabesluit (publiek toegankelijke inrichtingen) legt 60 °C rechtstreeks alleen op aan vrijgestelde inrichtingen (art. 18); elders is temperatuurbeheersing een van de maatregelen van het beheersplan. Elke sectie onder het minimum wordt opgesomd en gaat naar de legionellabeoordeling (plblegionella). Regionale regels kunnen strenger zijn — controleer ze.',
        'DVGW W 551 et CEN/TR 16355 demandent 60 °C en sortie de préparateur et au moins 55 °C partout dans le bouclage, avec des arrêts d’au plus 8 heures par jour (W 551). Le Legionellabesluit flamand (établissements accessibles au public) n’impose directement 60 °C qu’aux établissements dispensés (art. 18) ; ailleurs, la maîtrise de la température est l’une des mesures du plan de gestion. Chaque tronçon sous le minimum est listé et passe à l’évaluation légionelle (plblegionella). Les règles régionales peuvent être plus strictes — vérifiez-les.',
