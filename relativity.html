  "limitations": {
    "en": "Special relativity in flat 1+1-dimensional spacetime only. The finite-acceleration twin option is an idealized symmetric four-segment trajectory with constant proper acceleration and instantaneous changes of the acceleration sign; it is not a propulsion model. Doppler is longitudinal for a point source/observer and ignores aberration and optical appearance. Gravity, curved spacetime, transverse/3D effects, relativistic forces/dynamics and Terrell–Penrose appearance are outside scope. The light-clock triangle is Euclidean path geometry and is deliberately distinguished from the Minkowski metric. Sandbox observers, rods and light sources are inertial; arbitrary accelerated worldlines are not yet editable.",
    "uk": "Лише спеціальна теорія відносності у плоскому просторі-часі 1+1. Режим близнюків зі скінченним прискоренням — ідеалізована симетрична траєкторія з чотирьох ділянок сталого власного прискорення та миттєвою зміною його знака; це не модель рушія. Доплер лише поздовжній для точкових джерела/спостерігача, без аберації та оптичного вигляду. Гравітація, викривлений простір-час, поперечні/3D-ефекти, релятивістські сили/динаміка й ефект Террелла–Пенроуза поза обсягом. Трикутник світлового годинника — евклідова геометрія шляху, відокремлена від метрики Мінковського. Спостерігачі, стрижні та джерела sandbox є інерціальними; довільні прискорені світові лінії поки що не редагуються.",

    "nl": "Alleen speciale relativiteit in vlakke 1+1-dimensionale ruimtetijd. De eindige tweelingversnelling is een geïdealiseerde symmetrische baan met vier segmenten constante eigenversnelling en ogenblikkelijke tekenwissels van de versnelling; geen voortstuwingsmodel. Doppler is alleen longitudinaal voor puntbron/-waarnemer, zonder aberratie of optische verschijning. Zwaartekracht, gekromde ruimtetijd, transversale/3D-effecten, relativistische krachten/dynamica en Terrell–Penrose-weergave vallen buiten het bereik. De lichtklokdriehoek is Euclidische padmeetkunde en wordt onderscheiden van de Minkowski-metriek. Waarnemers, staven en lichtbronnen in de sandbox zijn inertieel; willekeurige versnelde wereldlijnen zijn nog niet bewerkbaar.",
    "fr": "Relativité restreinte uniquement dans un espace-temps plat 1+1. L’option d’accélération finie des jumeaux est une trajectoire idéalisée symétrique en quatre segments à accélération propre constante, avec changements instantanés du signe de l’accélération; ce n’est pas un modèle de propulsion. Le Doppler est longitudinal pour source/observateur ponctuels, sans aberration ni apparence optique. Gravitation, espace-temps courbe, effets transverses/3D, forces/dynamique relativistes et apparence de Terrell–Penrose sont hors champ. Le triangle de l’horloge lumineuse est une géométrie euclidienne de trajet distincte de la métrique de Minkowski. Les observateurs, tiges et sources de la sandbox sont inertiels ; les lignes d’univers accélérées arbitraires ne sont pas encore éditables.",
    "es": "Solo relatividad especial en espacio-tiempo plano 1+1. La opción de aceleración finita de gemelos es una trayectoria idealizada simétrica de cuatro tramos con aceleración propia constante y cambios instantáneos de su signo; no es un modelo de propulsión. El Doppler es solo longitudinal para fuente/observador puntuales, sin aberración ni apariencia óptica. Gravedad, espacio-tiempo curvo, efectos transversales/3D, fuerzas/dinámica relativistas y apariencia de Terrell–Penrose quedan fuera. El triángulo del reloj de luz es geometría euclídea de trayectoria y se distingue de la métrica de Minkowski. Los observadores, barras y fuentes del sandbox son inerciales; todavía no se pueden editar líneas de mundo aceleradas arbitrarias.",
    "pl": "Szczególna teoria względności dotyczy tylko płaskiej czasoprzestrzeni 1+1-wymiarowej. Opcja bliźniaka o skończonym przyspieszeniu to wyidealizowana symetryczna trajektoria czterosegmentowa ze stałym przyspieszeniem właściwym i natychmiastowymi zmianami znaku przyspieszenia; nie jest to model napędowy. Zjawisko Dopplera jest podłużne dla punktowego źródła/obserwatora i ignoruje aberrację oraz zjawisko optyczne. Grawitacja, zakrzywiona czasoprzestrzeń, efekty poprzeczne/trójwymiarowe, siły/dynamika relatywistyczne oraz zjawisko Terrella-Penrose'a wykraczają poza zakres. Trójkąt zegara świetlnego jest oparty na geometrii ścieżki euklidesowej i jest celowo odróżniany od metryki Minkowskiego. Obserwatorzy, pręty i źródła światła w piaskownicy są inercjalne; dowolne przyspieszone linie świata nie są jeszcze edytowalne."

/* Tool CSS. Tokens only: no colour, radius, shadow, font-size or spacing literal,

/* ---- SVG surfaces. Each one keeps its aspect ratio so the pointer mapping
        stays exact, and reports its scale in --rel-k so labels stay physical. */
.rel-svg{display:block;width:100%;height:auto;touch-action:none}
.rel-main{aspect-ratio:760/620}
.rel-exp{aspect-ratio:420/220;max-width:var(--bp-md)}
.rel-tri{aspect-ratio:420/310;max-width:var(--bp-sm)}
.rel-clock{aspect-ratio:420/150;max-width:var(--bp-sm);margin-top:var(--sp-2)}
.rel-svg text{font-family:var(--font)}
.axis-label{font-size:calc(var(--fs-label)*var(--rel-k,1));font-weight:650}
.tick-label{font-size:calc(var(--fs-small)*var(--rel-k,1));fill:var(--muted)}
.event-label{font-size:calc(var(--fs-label)*var(--rel-k,1));font-weight:650;paint-order:stroke;
  stroke:var(--panel);stroke-width:calc(4px*var(--rel-k,1));stroke-linejoin:round}
.small-label,.overlay-label,.sandbox-label{font-size:calc(var(--fs-small)*var(--rel-k,1));
  paint-order:stroke;stroke:var(--panel);stroke-width:calc(3px*var(--rel-k,1));stroke-linejoin:round}
.overlay-label,.sandbox-label{font-weight:650}
.event-dot,.drag-handle{cursor:grab}
.event-dot:active,.drag-handle:active{cursor:grabbing}
.drag-handle{stroke:var(--panel);stroke-width:2}
.handle-beacon{fill:none;stroke-width:1.5;opacity:.8;pointer-events:none;transform-box:fill-box;
  transform-origin:center;animation:relBeacon 1.35s ease-in-out infinite}
@keyframes relBeacon{0%,100%{opacity:.22;transform:scale(.92)}50%{opacity:.95;transform:scale(1.25)}}
.sandbox-worldline{fill:none;stroke-width:2}
.sandbox-worldline.hit{stroke:transparent;stroke-width:14;pointer-events:stroke}
.sandbox-rod-fill{opacity:.08}
.sandbox-ghost{opacity:.55;pointer-events:none}
.sandbox-object{cursor:pointer}
.sandbox-object.selected{filter:drop-shadow(0 0 4px var(--accent))}
.sandbox-cursor-cross{cursor:crosshair}
.sandbox-cursor-select{cursor:default}

/* ---- stage furniture ---- */
.rel-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-3);
  padding:var(--sp-2) var(--sp-3);border-top:1px solid var(--line);
  font-size:var(--fs-small);color:var(--muted)}
.rel-key{display:inline-flex;align-items:center;gap:var(--sp-1)}
.rel-key i{display:inline-block;width:var(--sp-4);height:2px;border-radius:var(--radius-pill)}
.rel-key b{font-weight:650}
.rel-tip{flex:1 1 100%;min-width:0}

/* ---- formulas and read-outs ---- */
.rel-formula{font:400 var(--fs-body)/1.6 var(--font-mono);background:var(--panel-2);
  border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:var(--sp-2) var(--sp-3);overflow-x:auto}
.rel-formula strong{font-weight:650;color:var(--ink)}
.rel-formula .eq-muted{color:var(--muted)}
.dgu-r-results .dgu-table td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}

/* ---- guided route ---- */
.rel-dots{display:flex;gap:var(--sp-1)}
.rel-dots i{display:block;width:var(--sp-2);height:var(--sp-2);border-radius:var(--radius-pill);background:var(--line)}
.rel-dots i.on{background:var(--accent)}

/* ---- footer honesty line ---- */
.rel-selftest{display:inline-flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-small);color:var(--muted)}
.rel-selftest .dot{width:var(--sp-2);height:var(--sp-2);border-radius:var(--radius-pill);background:var(--warn)}
.rel-selftest.pass .dot{background:var(--ok)}
.rel-selftest.fail .dot{background:var(--bad)}

/* ---- Simple view: the tool's own disclosure, kept because the framework has
        no equivalent. It hides secondary palette panels, never a region. ---- */
.dgu-app[data-rel-simple="1"] [data-dgu-panel="route"],
.dgu-app[data-rel-simple="1"] [data-dgu-panel="layers"],
.dgu-app[data-rel-simple="1"] [data-dgu-panel="events"],
.dgu-app[data-rel-simple="1"] [data-dgu-panel="sandbox"],
.dgu-app[data-rel-simple="1"] [data-dgu-panel="inspector"],
.dgu-app[data-rel-simple="1"] [data-dgu-panel="geometry"]{display:none}
.dgu-app[data-rel-simple="1"][data-rel-preset="lightclock"] [data-dgu-panel="geometry"]{display:flex}
.dgu-app[data-rel-simple="1"][data-rel-preset="sandbox"] [data-dgu-panel="sandbox"],
.dgu-app[data-rel-simple="1"][data-rel-preset="sandbox"] [data-dgu-panel="inspector"]{display:flex}

/* Local repair, and the largest one: the framework hides panels, fields and
   chips with the hidden attribute, but its own .dgu-panel{display:flex},
   .dgu-field{display:grid} and .dgu-chip{display:inline-flex} rules outrank the
   user-agent [hidden] rule, so every `visible:` predicate and every empty-panel
   check is a no-op on screen. Belongs upstream in diagram-ui.js. */
[hidden]{display:none!important}

/* Local repair: .dgu-head-r is flex:0 0 auto with no wrap, so a tool action in
   the header pushes the language, units, learn and theme controls past the
   viewport below md. Belongs upstream in diagram-ui.js. */
.dgu-head-r{flex-wrap:wrap;justify-content:flex-end;max-width:100%}

/* Local repair: below md the framework raises .dgu-btn and .dgu-fctl to the 44px
   tap target but not the segmented buttons, the selects, the range track or the
   return link. Belongs upstream in diagram-ui.js. */
@media(max-width:768px){
  .dgu-app .dgu-seg button{min-height:var(--tap)}
  .dgu-app .dgu-sel{min-height:var(--tap)}
  .dgu-app .dgu-home{min-height:var(--tap);display:inline-flex;align-items:center}
  .dgu-app .dgu-field.range .dgu-fctl{min-height:var(--tap)}
  .dgu-app .dgu-btn{min-width:var(--tap)}
  .dgu-app .dgu-toggle{min-height:var(--tap)}
  .dgu-app .dgu-tab{min-height:var(--tap)}
  .dgu-tour .dgu-btn{min-height:var(--tap)}
}

/* Local repair: the tour card, the learn popover and the dialog panel are
   appended to document.body, outside .dgu-app, so the framework's box-sizing
   rule never reaches them and their padding pushes them past a 390px viewport.
   Belongs upstream in diagram-ui.js. */
.dgu-tour,.dgu-tour *,.dgu-pop,.dgu-pop *,.dgu-dialog,.dgu-dialog *{box-sizing:border-box}

 de:{phiLabel:'Rapidität φ',dragObjects:'Punkte / Griffe ziehen',playJourney:'Reise abspielen',sendPulse:'Impuls senden',dragRod:'Die orangefarbenen Endgriffe oder den cyanfarbenen Zeitgriff im Hauptdiagramm ziehen.',dragTurn:'Den Umkehrgriff im Hauptdiagramm ziehen, um Geschwindigkeit und Teilzeit gemeinsam zu ändern.',dragRadar:'Startpunkt des Reflektors und Emissionsereignis im Hauptdiagramm ziehen.',dragVelocity:'Die Griffe der S′- oder Objekt-Weltlinie im Hauptdiagramm ziehen.',worldTubeCuts:'Weltband + Gleichzeitigkeits-Schnitte',nowLabel:'jetzt',earthShort:'Erde',travellerShort:'Reisender',noReturnPulse:'kein gültiger Rücklaufimpuls',objectLabel:'Objekt',turnLabel:'Umkehr',lengthBadge:'LÄNGE',twinBadge:'ZWILLINGE',radarBadge:'RADAR',boostsBadge:'BOOSTS',lengthExplain:'Die beiden Stabenden werden bei gleichem t in S, aber bei gleichem t′ im Ruhesystem des Stabs gemessen. Das sind verschiedene Ereignispaare auf denselben Weltlinien.',twinExplain:'Die Erd-Weltlinie ist ein Inertialabschnitt; der Reisende wechselt bei der Umkehr das Inertialsystem. Die Eigenzeit wird entlang jeder Weltlinie aufsummiert.',radarExplain:'Hin- und Rückweg sind lichtartig. Der Beobachter bestimmt Radarzeit und Radarentfernung aus Emissions- und Empfangszeit.',velocityExplain:'Geschwindigkeiten addieren sich nicht linear, Rapiditäten dagegen schon. Die resultierende Weltlinie bleibt innerhalb des Lichtkegels, solange beide Eingangsgeschwindigkeiten unterlichtschnell sind.'},
 nl:{phiLabel:'Rapiditeit φ',dragObjects:'sleep punten / grepen',playJourney:'Reis afspelen',sendPulse:'Puls verzenden',dragRod:'Sleep de oranje eindgrepen of de cyaan tijdgreep in het hoofddiagram.',dragTurn:'Sleep de omkeergreep in het hoofddiagram om snelheid en trajecttijd samen te wijzigen.',dragRadar:'Sleep het begin van de reflector en de emissiegebeurtenis in het hoofddiagram.',dragVelocity:'Sleep de grepen van de S′- of objectwereldlijn in het hoofddiagram.',worldTubeCuts:'wereldbuis + gelijktijdigheidssneden',nowLabel:'nu',earthShort:'Aarde',travellerShort:'reiziger',noReturnPulse:'geen geldige retourpuls',objectLabel:'object',turnLabel:'omkeer',lengthBadge:'LENGTE',twinBadge:'TWEELING',radarBadge:'RADAR',boostsBadge:'BOOSTS',lengthExplain:'De twee staafeinden worden gemeten bij gelijke t in S, maar bij gelijke t′ in het ruststelsel van de staaf. Dat zijn verschillende gebeurtenisparen op dezelfde twee wereldlijnen.',twinExplain:'De wereldlijn van de Aarde is één inertieel segment; de reiziger wisselt van inertiaalstelsel bij de omkeer. De eigentijd wordt langs elke wereldlijn opgebouwd.',radarExplain:'De heen- en terugweg zijn lichtachtig. De waarnemer bepaalt radartijd en radarafstand uit de emissie- en ontvangsttijdstippen.',velocityExplain:'Snelheden tellen niet lineair op, rapiditeiten wel. De resulterende wereldlijn blijft binnen de lichtkegel zolang beide invoersnelheden subluminaal zijn.'},
 fr:{phiLabel:'Rapidité φ',dragObjects:'glisser points / poignées',playJourney:'Lire le voyage',sendPulse:'Envoyer l’impulsion',dragRod:'Faites glisser les poignées orange des extrémités ou la poignée temporelle cyan sur le diagramme principal.',dragTurn:'Faites glisser le point de demi-tour pour modifier ensemble la vitesse et la durée de branche.',dragRadar:'Faites glisser le départ du réflecteur et l’événement d’émission sur le diagramme principal.',dragVelocity:'Faites glisser les poignées des lignes d’univers de S′ ou de l’objet.',worldTubeCuts:'tube d’univers + coupes de simultanéité',nowLabel:'maintenant',earthShort:'Terre',travellerShort:'voyageur',noReturnPulse:'aucune impulsion de retour valide',objectLabel:'objet',turnLabel:'demi-tour',lengthBadge:'LONGUEUR',twinBadge:'JUMEAUX',radarBadge:'RADAR',boostsBadge:'BOOSTS',lengthExplain:'Les deux extrémités de la barre sont mesurées au même t dans S, mais au même t′ dans le référentiel propre de la barre. Ce sont des paires d’événements différentes sur les mêmes lignes d’univers.',twinExplain:'La ligne d’univers terrestre est un seul segment inertiel; le voyageur change de référentiel inertiel au demi-tour. Le temps propre s’accumule le long de chaque ligne d’univers.',radarExplain:'Les trajets aller et retour sont de type lumière. L’observateur déduit le temps radar et la distance radar des instants d’émission et de réception.',velocityExplain:'Les vitesses ne s’additionnent pas linéairement, contrairement aux rapidités. La ligne d’univers résultante reste dans le cône de lumière si les deux vitesses d’entrée sont subluminiques.'},
 es:{phiLabel:'Rapidez φ',dragObjects:'arrastre puntos / asas',playJourney:'Reproducir viaje',sendPulse:'Enviar pulso',dragRod:'Arrastre las asas naranjas de los extremos o el asa temporal cian en el diagrama principal.',dragTurn:'Arrastre el asa de giro para cambiar a la vez la velocidad y el tiempo de tramo.',dragRadar:'Arrastre el inicio del reflector y el evento de emisión en el diagrama principal.',dragVelocity:'Arrastre las asas de las líneas de mundo de S′ o del objeto.',worldTubeCuts:'tubo de mundo + cortes de simultaneidad',nowLabel:'ahora',earthShort:'Tierra',travellerShort:'viajero',noReturnPulse:'no hay pulso de retorno válido',objectLabel:'objeto',turnLabel:'giro',lengthBadge:'LONGITUD',twinBadge:'GEMELOS',radarBadge:'RADAR',boostsBadge:'BOOSTS',lengthExplain:'Los dos extremos de la barra se miden con igual t en S, pero con igual t′ en el marco propio de la barra. Son pares de eventos diferentes sobre las mismas dos líneas de mundo.',twinExplain:'La línea de mundo terrestre es un único tramo inercial; el viajero cambia de marco inercial en el giro. El tiempo propio se acumula a lo largo de cada línea de mundo.',radarExplain:'Los tramos de ida y vuelta son nulos. El observador asigna tiempo radar y distancia radar a partir de las marcas de emisión y recepción.',velocityExplain:'Las velocidades no se suman linealmente, pero las rapideces sí. La línea de mundo resultante permanece dentro del cono de luz mientras ambas velocidades de entrada sean sublumínicas.'}
,pl:{phiLabel:"Rapidity φ",dragObjects:"przeciąganie punktów/uchwytów",playJourney:"Odtwórz podróż",sendPulse:"Wyślij impuls",dragRod:"Przeciągnij pomarańczowe uchwyty końcowe lub cyjanowy uchwyt czasu na głównym diagramie.",dragTurn:"Przeciągnij uchwyt zwrotu na głównym diagramie, aby zmienić prędkość i czas trwania etapu.",dragRadar:"Przeciągnij uchwyty startu i emisji reflektora na głównym diagramie.",dragVelocity:"Przeciągnij uchwyty linii świata S′ lub obiektu na głównym diagramie.",worldTubeCuts:"rura świata + przekroje jednoczesności",nowLabel:"teraz",earthShort:"Ziemia",travellerShort:"podróżnik",noReturnPulse:"brak prawidłowego impulsu powrotnego",objectLabel:"obiekt",turnLabel:"zakręt",lengthBadge:"DŁUGOŚĆ",twinBadge:"BLIŹNIAK",radarBadge:"RADAR",boostsBadge:"TRANSFORMACJE",lengthExplain:"Dwa punkty końcowe pręta są mierzone w równych t w S, ale równych t′ w układzie pręta. Są to różne pary zdarzeń na tych samych dwóch liniach świata.",twinExplain:"Linia świata Ziemi jest jednym odcinkiem inercyjnym; podróżnik zmienia układ inercjalny podczas zwrotu. Czas własny jest całkowany wzdłuż każdej linii świata.",radarExplain:"Odcinki sygnału wychodzącego i powrotnego są światłopodobne. Obserwator wyznacza czas radarowy i odległość radarową z chwil emisji i odbioru.",velocityExplain:"Prędkości nie składają się liniowo, lecz rapidity tak. Wynikowa linia świata pozostaje wewnątrz stożka świetlnego, jeśli obie prędkości wejściowe są mniejsze od c."}};

const STAGE6_I18N={
 en:{pDoppler:'Relativistic Doppler',pDopplerS:'Read frequency from light-pulse spacing',guidedTitle:'Guided “aha” route',guideStart:'Start route',guidePrev:'Previous',guideNext:'Next',guideExit:'Exit',guideIdleTitle:'Eight linked experiments',guideIdleText:'Start with the light-clock triangle, then follow the same Lorentz geometry through simultaneity, length, causality, velocity, Doppler and accelerated twins.',instantTurn:'Instant turn',finiteAccel:'Finite acceleration',properAccel:'Proper acceleration a',turnDistance:'Turn distance',dopplerTitle:'Relativistic Doppler',dopplerSub:'Equal proper-time emissions become unequal arrival spacing for a moving source.',runPulses:'Run pulses',emitPeriod:'Source proper period Δτₑ',sourceX0:'Source x at t = 0',arrivalPeriod:'Arrival period',dopplerHint:'Positive β means the source recedes; negative β means it approaches.',dopplerBadge:'DOPPLER',dopplerExplain:'The source emits pulses at equal intervals on its own clock. Their null worldlines reach the observer with a different spacing; that spacing is the relativistic Doppler shift.',finiteTwinExplain:'Finite proper acceleration changes rapidity linearly with traveller proper time. Four symmetric acceleration segments return the traveller to Earth at rest.',g1:'1 · Light clock',g1t:'At β = 0.6 the normalized photon-path triangle is exactly 0.6–0.8–1. The Lorentz factor is already visible as ordinary Pythagoras.',g2:'2 · What a boost does',g2t:'Increase β and watch x′ and ct′ approach the light cone while the light rays themselves remain fixed at ±45°.',g3:'3 · Simultaneity tilts',g3t:'A and B have equal t in S, but not equal t′. The green t′ = const slices are the geometric source of relativity of simultaneity.',g4:'4 · Length is a slice',g4t:'The rod does not need to physically squash. S and S′ measure different pairs of endpoint events because their simultaneity slices differ.',g5:'5 · Causality survives',g5t:'For spacelike-separated events the time order can reverse. The light cone does not: no subluminal frame turns a spacelike interval into a causal one.',g6:'6 · Rapidity adds',g6t:'Compose 0.8c with 0.8c. Velocities do not add linearly, but rapidities do, and the result stays below c.',g7:'7 · Doppler is pulse geometry',g7t:'Equal emission ticks on the moving source arrive with stretched or compressed spacing. The shift factor is simply exp(−φ) for a receding source.',g8:'8 · Accelerated twin',g8t:'Switch from an instantaneous turn to finite proper acceleration. The curved worldline changes the accumulated proper time; acceleration resolves which twin changes inertial frames.'},
 uk:{pDoppler:'Релятивістський Доплер',pDopplerS:'Частота з інтервалів світлових імпульсів',guidedTitle:'Маршрут «ага»',guideStart:'Почати',guidePrev:'Назад',guideNext:'Далі',guideExit:'Вийти',guideIdleTitle:'Вісім пов’язаних експериментів',guideIdleText:'Почніть з трикутника світлового годинника, а потім простежте ту саму геометрію Лоренца через одночасність, довжину, причинність, швидкості, Доплер і прискорених близнюків.',instantTurn:'Миттєвий розворот',finiteAccel:'Скінченне прискорення',properAccel:'Власне прискорення a',turnDistance:'Відстань розвороту',dopplerTitle:'Релятивістський Доплер',dopplerSub:'Рівні інтервали випромінювання за власним часом стають іншими інтервалами приходу.',runPulses:'Запустити імпульси',emitPeriod:'Власний період джерела Δτₑ',sourceX0:'x джерела при t = 0',arrivalPeriod:'Період приходу',dopplerHint:'Додатне β — джерело віддаляється; від’ємне — наближається.',dopplerBadge:'ДОПЛЕР',dopplerExplain:'Джерело випромінює імпульси через рівні інтервали свого годинника. Їхні світлоподібні світові лінії приходять до спостерігача з іншим кроком — це релятивістський Доплер.',finiteTwinExplain:'За сталого власного прискорення rapidity лінійно змінюється з власним часом мандрівника. Чотири симетричні ділянки повертають його на Землю в стані спокою.',g1:'1 · Світловий годинник',g1t:'При β = 0.6 нормований трикутник шляху фотона точно 0.6–0.8–1. Фактор Лоренца вже видно зі звичайної теореми Піфагора.',g2:'2 · Що робить boost',g2t:'Збільшуйте β: осі x′ і ct′ наближаються до світлового конуса, а промені світла залишаються під ±45°.',g3:'3 · Одночасність нахиляється',g3t:'A і B мають однаковий t у S, але різний t′. Зелені зрізи t′ = const геометрично породжують відносність одночасності.',g4:'4 · Довжина — це зріз',g4t:'Стрижню не обов’язково «стискатися». S і S′ вимірюють різні пари подій на кінцях через різні зрізи одночасності.',g5:'5 · Причинність зберігається',g5t:'Для spacelike-подій порядок часу може змінитися. Світловий конус — ні: жодна субсвітлова система не зробить spacelike-інтервал причинним.',g6:'6 · Rapidity додається',g6t:'Складіть 0.8c і 0.8c. Швидкості не додаються лінійно, зате rapidity додаються, а результат лишається нижче c.',g7:'7 · Доплер як геометрія імпульсів',g7t:'Рівні такти випромінювання рухомого джерела приходять розтягнутими або стиснутими. Для віддалення коефіцієнт зсуву дорівнює exp(−φ).',g8:'8 · Близнюк з прискоренням',g8t:'Перемкніться з миттєвого розвороту на скінченне власне прискорення. Крива світова лінія змінює накопичений власний час; саме мандрівник змінює інерціальні системи.'},
 de:{pDoppler:'Relativistischer Doppler',pDopplerS:'Frequenz aus Lichtpuls-Abständen ablesen',guidedTitle:'Geführte „Aha“-Route',guideStart:'Route starten',guidePrev:'Zurück',guideNext:'Weiter',guideExit:'Beenden',guideIdleTitle:'Acht verknüpfte Experimente',guideIdleText:'Vom Lichtuhr-Dreieck durch dieselbe Lorentz-Geometrie zu Gleichzeitigkeit, Länge, Kausalität, Geschwindigkeit, Doppler und beschleunigten Zwillingen.',instantTurn:'Instantane Umkehr',finiteAccel:'Endliche Beschleunigung',properAccel:'Eigenbeschleunigung a',turnDistance:'Umkehrentfernung',dopplerTitle:'Relativistischer Doppler',dopplerSub:'Gleiche Emissionsabstände in Eigenzeit werden zu anderen Empfangsabständen.',runPulses:'Pulse starten',emitPeriod:'Eigenperiode der Quelle Δτₑ',sourceX0:'Quellen-x bei t = 0',arrivalPeriod:'Empfangsperiode',dopplerHint:'Positives β: Quelle entfernt sich; negatives β: sie nähert sich.',dopplerBadge:'DOPPLER',dopplerExplain:'Die Quelle sendet Pulse in gleichen Abständen ihrer eigenen Uhr. Die lichtartigen Weltlinien erreichen den Beobachter in anderem Abstand — der relativistische Dopplereffekt.',finiteTwinExplain:'Bei konstanter Eigenbeschleunigung ändert sich die Rapidität linear mit der Eigenzeit des Reisenden. Vier symmetrische Beschleunigungsabschnitte bringen ihn ruhend zur Erde zurück.',g1:'1 · Lichtuhr',g1t:'Bei β = 0,6 ist das normierte Photonendreieck exakt 0,6–0,8–1. Der Lorentzfaktor steckt bereits im Satz des Pythagoras.',g2:'2 · Wirkung eines Boosts',g2t:'β erhöhen: x′ und ct′ nähern sich dem Lichtkegel, während die Lichtstrahlen selbst bei ±45° bleiben.',g3:'3 · Gleichzeitigkeit kippt',g3t:'A und B haben in S gleiches t, aber nicht gleiches t′. Die grünen t′=const-Schnitte zeigen die Geometrie der Relativität der Gleichzeitigkeit.',g4:'4 · Länge ist ein Schnitt',g4t:'Der Stab muss nicht „physisch zusammengedrückt“ werden. S und S′ wählen wegen anderer Gleichzeitigkeits-Schnitte andere Endereignisse.',g5:'5 · Kausalität bleibt',g5t:'Bei raumartigen Ereignissen kann sich die Zeitordnung umkehren. Der Lichtkegel bleibt unverändert; kein unterlichtschnelles System macht den Abstand kausal.',g6:'6 · Rapiditäten addieren',g6t:'0,8c mit 0,8c zusammensetzen: Geschwindigkeiten addieren sich nicht linear, Rapiditäten schon, und das Ergebnis bleibt unter c.',g7:'7 · Doppler als Pulsgeometrie',g7t:'Gleichmäßig emittierte Pulse treffen gedehnt oder gestaucht ein. Für eine sich entfernende Quelle ist der Frequenzfaktor exp(−φ).',g8:'8 · Beschleunigter Zwilling',g8t:'Von instantaner Umkehr auf endliche Eigenbeschleunigung wechseln. Die gekrümmte Weltlinie ändert die Eigenzeit; der Reisende ist derjenige, der Inertialsysteme wechselt.'},
 nl:{pDoppler:'Relativistische Doppler',pDopplerS:'Lees frequentie uit de afstand tussen lichtpulsen',guidedTitle:'Begeleide “aha”-route',guideStart:'Start route',guidePrev:'Vorige',guideNext:'Volgende',guideExit:'Stop',guideIdleTitle:'Acht gekoppelde experimenten',guideIdleText:'Begin met de lichtklokdriehoek en volg dezelfde Lorentzgeometrie via gelijktijdigheid, lengte, causaliteit, snelheid, Doppler en versnelde tweelingen.',instantTurn:'Ogenblikkelijke omkeer',finiteAccel:'Eindige versnelling',properAccel:'Eigenversnelling a',turnDistance:'Keerafstand',dopplerTitle:'Relativistische Doppler',dopplerSub:'Gelijke emissie-intervallen in eigentijd worden andere aankomstintervallen.',runPulses:'Start pulsen',emitPeriod:'Eigenperiode bron Δτₑ',sourceX0:'Bron-x bij t = 0',arrivalPeriod:'Aankomstperiode',dopplerHint:'Positieve β: bron verwijdert zich; negatieve β: bron nadert.',dopplerBadge:'DOPPLER',dopplerExplain:'De bron zendt pulsen uit met gelijke intervallen op zijn eigen klok. Hun lichtachtige wereldlijnen bereiken de waarnemer met een andere afstand: de relativistische Dopplerverschuiving.',finiteTwinExplain:'Bij constante eigenversnelling verandert rapiditeit lineair met de eigentijd van de reiziger. Vier symmetrische versnellingsdelen brengen hem in rust terug naar de Aarde.',g1:'1 · Lichtklok',g1t:'Bij β = 0,6 is de genormaliseerde fotondriehoek exact 0,6–0,8–1. De Lorentzfactor is al zichtbaar via Pythagoras.',g2:'2 · Wat een boost doet',g2t:'Vergroot β: x′ en ct′ naderen de lichtkegel, terwijl de lichtstralen zelf op ±45° blijven.',g3:'3 · Gelijktijdigheid helt',g3t:'A en B hebben gelijke t in S maar niet gelijke t′. De groene t′=const-sneden zijn de geometrische oorsprong van relativiteit van gelijktijdigheid.',g4:'4 · Lengte is een snede',g4t:'De staaf hoeft niet letterlijk te krimpen. S en S′ meten verschillende paren eindgebeurtenissen door verschillende gelijktijdigheidssneden.',g5:'5 · Causaliteit blijft',g5t:'Bij spacelike gebeurtenissen kan de tijdsvolgorde omkeren. De lichtkegel niet: geen subluminaal stelsel maakt de scheiding causaal.',g6:'6 · Rapiditeit telt op',g6t:'Combineer 0,8c met 0,8c. Snelheden tellen niet lineair op, rapiditeiten wel, en het resultaat blijft onder c.',g7:'7 · Doppler als pulsgeometrie',g7t:'Gelijke emissietikken van de bewegende bron arriveren uitgerekt of samengedrukt. Voor een zich verwijderende bron is de factor exp(−φ).',g8:'8 · Versnelde tweeling',g8t:'Schakel van een ogenblikkelijke omkeer naar eindige eigenversnelling. De gekromde wereldlijn verandert de opgebouwde eigentijd; de reiziger wisselt van inertiaalstelsel.'},
 fr:{pDoppler:'Doppler relativiste',pDopplerS:'Lire la fréquence dans l’espacement des impulsions',guidedTitle:'Parcours guidé « aha »',guideStart:'Démarrer',guidePrev:'Précédent',guideNext:'Suivant',guideExit:'Quitter',guideIdleTitle:'Huit expériences reliées',guideIdleText:'Partez du triangle de l’horloge lumineuse et suivez la même géométrie de Lorentz jusqu’à la simultanéité, la longueur, la causalité, les vitesses, Doppler et les jumeaux accélérés.',instantTurn:'Demi-tour instantané',finiteAccel:'Accélération finie',properAccel:'Accélération propre a',turnDistance:'Distance au demi-tour',dopplerTitle:'Doppler relativiste',dopplerSub:'Des émissions également espacées en temps propre arrivent avec un autre espacement.',runPulses:'Lancer les impulsions',emitPeriod:'Période propre de la source Δτₑ',sourceX0:'x de la source à t = 0',arrivalPeriod:'Période reçue',dopplerHint:'β positif : la source s’éloigne ; β négatif : elle s’approche.',dopplerBadge:'DOPPLER',dopplerExplain:'La source émet à intervalles égaux sur sa propre horloge. Les lignes d’univers lumineuses arrivent chez l’observateur avec un autre espacement : le Doppler relativiste.',finiteTwinExplain:'À accélération propre constante, la rapidité varie linéairement avec le temps propre du voyageur. Quatre segments symétriques le ramènent au repos sur Terre.',g1:'1 · Horloge lumineuse',g1t:'À β = 0,6, le triangle normalisé du photon vaut exactement 0,6–0,8–1. Le facteur de Lorentz est déjà visible par Pythagore.',g2:'2 · Effet d’un boost',g2t:'Augmentez β : x′ et ct′ s’approchent du cône de lumière, tandis que les rayons lumineux restent à ±45°.',g3:'3 · La simultanéité s’incline',g3t:'A et B ont le même t dans S mais pas le même t′. Les coupes vertes t′=const sont la source géométrique de la relativité de la simultanéité.',g4:'4 · La longueur est une coupe',g4t:'La barre n’a pas besoin de se « comprimer physiquement ». S et S′ choisissent des paires d’événements d’extrémité différentes.',g5:'5 · La causalité demeure',g5t:'Pour des événements séparés spatialement, l’ordre temporel peut s’inverser. Le cône de lumière non : aucun référentiel subluminal ne rend la séparation causale.',g6:'6 · Les rapidités s’additionnent',g6t:'Composez 0,8c avec 0,8c. Les vitesses ne s’ajoutent pas linéairement, les rapidités oui, et le résultat reste inférieur à c.',g7:'7 · Doppler comme géométrie d’impulsions',g7t:'Des tops d’émission égaux arrivent étirés ou comprimés. Pour une source qui s’éloigne, le facteur de fréquence vaut exp(−φ).',g8:'8 · Jumeau accéléré',g8t:'Passez du demi-tour instantané à une accélération propre finie. La ligne d’univers courbe change le temps propre accumulé ; le voyageur est celui qui change de référentiel inertiel.'},
 es:{pDoppler:'Doppler relativista',pDopplerS:'Lea la frecuencia en el espaciado de pulsos',guidedTitle:'Ruta guiada «ajá»',guideStart:'Iniciar ruta',guidePrev:'Anterior',guideNext:'Siguiente',guideExit:'Salir',guideIdleTitle:'Ocho experimentos conectados',guideIdleText:'Empiece con el triángulo del reloj de luz y siga la misma geometría de Lorentz por simultaneidad, longitud, causalidad, velocidad, Doppler y gemelos acelerados.',instantTurn:'Giro instantáneo',finiteAccel:'Aceleración finita',properAccel:'Aceleración propia a',turnDistance:'Distancia de giro',dopplerTitle:'Doppler relativista',dopplerSub:'Emisiones igualmente espaciadas en tiempo propio llegan con otro espaciado.',runPulses:'Lanzar pulsos',emitPeriod:'Periodo propio de la fuente Δτₑ',sourceX0:'x de la fuente en t = 0',arrivalPeriod:'Periodo de llegada',dopplerHint:'β positivo: la fuente se aleja; β negativo: se acerca.',dopplerBadge:'DOPPLER',dopplerExplain:'La fuente emite pulsos a intervalos iguales en su propio reloj. Sus líneas de mundo nulas llegan al observador con otro espaciado: el Doppler relativista.',finiteTwinExplain:'Con aceleración propia constante, la rapidez hiperbólica cambia linealmente con el tiempo propio del viajero. Cuatro tramos simétricos lo devuelven a la Tierra en reposo.',g1:'1 · Reloj de luz',g1t:'Con β = 0,6 el triángulo normalizado del fotón es exactamente 0,6–0,8–1. El factor de Lorentz ya aparece mediante Pitágoras.',g2:'2 · Qué hace un boost',g2t:'Aumente β: x′ y ct′ se acercan al cono de luz, mientras los rayos de luz permanecen a ±45°.',g3:'3 · La simultaneidad se inclina',g3t:'A y B tienen el mismo t en S, pero no el mismo t′. Los cortes verdes t′=const son el origen geométrico de la relatividad de simultaneidad.',g4:'4 · La longitud es un corte',g4t:'La barra no necesita «aplastarse». S y S′ miden pares distintos de eventos en los extremos por usar cortes de simultaneidad diferentes.',g5:'5 · La causalidad permanece',g5t:'Para eventos spacelike el orden temporal puede invertirse. El cono de luz no: ningún marco sublumínico vuelve causal esa separación.',g6:'6 · Las rapideces se suman',g6t:'Componga 0,8c con 0,8c. Las velocidades no se suman linealmente, las rapideces sí, y el resultado sigue por debajo de c.',g7:'7 · Doppler como geometría de pulsos',g7t:'Pulsos emitidos con separación igual llegan estirados o comprimidos. Para una fuente que se aleja, el factor es exp(−φ).',g8:'8 · Gemelo acelerado',g8t:'Cambie del giro instantáneo a aceleración propia finita. La línea de mundo curva cambia el tiempo propio acumulado; el viajero es quien cambia de marco inercial.'}
,pl:{pDoppler:"Relatywistyczny Doppler",pDopplerS:"Odczytaj częstotliwość z odstępu między impulsami światła",guidedTitle:"Trasa „aha” z przewodnikiem",guideStart:"Rozpocznij trasę",guidePrev:"Poprzedni",guideNext:"Dalej",guideExit:"Wyjście",guideIdleTitle:"Osiem powiązanych eksperymentów",guideIdleText:"Zacznij od trójkąta zegara świetlnego, a następnie prześledź tę samą geometrię Lorentza przez jednoczesność, długość, przyczynowość, prędkość, efekt Dopplera i przyspieszone bliźniaki.",instantTurn:"Natychmiastowy zwrot",finiteAccel:"Skończone przyspieszenie",properAccel:"Przyspieszenie własne a",turnDistance:"Odległość skrętu",dopplerTitle:"Relatywistyczny Doppler",dopplerSub:"Równe emisje w czasie właściwym stają się nierównymi odstępami między przybyciem źródła ruchomego.",runPulses:"Uruchom pulsy",emitPeriod:"Okres własny źródła Δτₑ",sourceX0:"Położenie x źródła przy t = 0",arrivalPeriod:"Okres między odebranymi impulsami",dopplerHint:"Dodatnia β oznacza, że ​​źródło się oddala; ujemna β oznacza, że ​​się zbliża.",dopplerBadge:"DOPPLER",dopplerExplain:"Źródło emituje impulsy w równych odstępach własnego czasu. Ich zerowe linie świata docierają do obserwatora w innych odstępach; ta zmiana odstępu jest relatywistycznym efektem Dopplera.",finiteTwinExplain:"Skończone przyspieszenie własne zmienia szybkość liniowo wraz z czasem własnym podróżnika. Cztery symetryczne segmenty przyspieszenia przywracają podróżnika na Ziemię w stanie spoczynku.",g1:"1 · Zegar świetlny",g1t:"Przy β = 0,6 znormalizowany trójkąt foton-droga wynosi dokładnie 0,6–0,8–1. Czynnik Lorentza jest już widoczny jako zwykły Pitagoras.",g2:"2 · Co robi transformacja Lorentza",g2t:"Zwiększ β i obserwuj, jak osie x′ i ct′ zbliżają się do stożka świetlnego, podczas gdy promienie światła pozostają na ±45°.",g3:"3 · Jednoczesne pochylenie",g3t:"A i B mają równe t w S, ale nie równe t′. Zielone wycinki t′ = const są geometrycznym źródłem relatywności jednoczesności.",g4:"4 · Długość jest przekrojem jednoczesności",g4t:"Pręt nie musi być fizycznie ściskany. S i S′ mierzą różne pary zdarzeń końcowych, ponieważ ich wycinki jednoczesności różnią się.",g5:"5 · Przyczynowość zostaje zachowana",g5t:"Dla zdarzeń rozdzielonych przestrzennopodobnie kolejność czasowa może się odwrócić. Stożek świetlny pozostaje niezmienny: żaden podświetlny układ odniesienia nie zamieni interwału przestrzennopodobnego w przyczynowy.",g6:"6 · Rapidity się dodaje",g6t:"Złóż 0,8c z 0,8c. Prędkości nie dodają się liniowo, lecz rapidity tak, a wynik pozostaje mniejszy od c.",g7:"7 · Doppler wynika z geometrii impulsów",g7t:"Równoodległe impulsy emitowane przez poruszające się źródło docierają z rozciągniętym lub ściśniętym odstępem. Dla oddalającego się źródła współczynnik przesunięcia wynosi po prostu exp(−φ).",g8:"8 · Przyspieszony bliźniak",g8t:"Zastąp natychmiastowy zwrot skończonym przyspieszeniem własnym. Zakrzywiona linia świata zmienia zgromadzony czas własny; przyspieszenie wskazuje, który bliźniak zmienia układy inercjalne."}};

function gamma(beta){return 1/Math.sqrt(1-beta*beta)}

function interval(a,b){const dx=b.x-a.x,dt=b.t-a.t;return {dx,dt,s2:dt*dt-dx*dx}}
function classify(s2,scale=1){const tol=1e-9*Math.max(1,scale);return Math.abs(s2)<=tol?'lightlike':s2>0?'timelike':'spacelike'}

function finiteTwin(beta,a){const ab=Math.abs(beta),acc=Math.max(1e-9,Math.abs(a)),phi=rapidity(ab),g=gamma(ab),quarterProper=phi/acc,traveller=4*quarterProper,earth=4*Math.sinh(phi)/acc,turnDistance=2*(Math.cosh(phi)-1)/acc;return {earth,traveller,difference:earth-traveller,turnDistance,quarterProper,maxRapidity:phi,maxBeta:ab}}
function accelAdvance(state,sign,a,dtau){const eta1=state.eta+sign*a*dtau,den=sign*a;return {x:state.x+(Math.cosh(eta1)-Math.cosh(state.eta))/den,t:state.t+(Math.sinh(eta1)-Math.sinh(state.eta))/den,eta:eta1,tau:state.tau+dtau}}
function finiteTwinState(beta,a,p){const dir=beta<0?-1:1,ft=finiteTwin(beta,a),acc=Math.max(1e-9,Math.abs(a)),q=ft.quarterProper,total=4*q,target=clamp(p,0,1)*total;let st={x:0,t:0,eta:0,tau:0},left=target;for(const sign0 of [1,-1,-1,1]){if(left<=0)break;const dt=Math.min(q,left),sign=dir*sign0;st=accelAdvance(st,sign,acc,dt);left-=dt}return {x:st.x,t:st.t,earth:st.t,traveller:st.tau,beta:Math.tanh(st.eta)}}

function initialLang(){const q=new URLSearchParams(location.search).get('lang');let stored='';try{stored=localStorage.getItem('diagram_lang')||''}catch(e){}const browser=(navigator.language||'en').slice(0,2);return I18N[q]?q:I18N[stored]?stored:I18N[browser]?browser:'en'}

/* The diagram's colour key is part of its meaning (S, S', light, A, B) and is
   kept; everything structural reads the framework tokens so the drawing
   follows the theme. */
const PAL={s:'#55c2ff',prime:'#9ee493',light:'#ffd36a',a:'#ff9a76',b:'#c59cff'};
const TOK={line:'#223949',muted:'#8fa8b9',panel:'#071018',bad:'#ff7272',ink:'#eaf2f7'};
function refreshTokens(){
  const cs=getComputedStyle(document.documentElement);
  const g=(n,f)=>{const v=cs.getPropertyValue(n).trim();return v||f};
  TOK.line=g('--line',TOK.line);TOK.muted=g('--muted',TOK.muted);
  TOK.panel=g('--panel',TOK.panel);TOK.bad=g('--bad',TOK.bad);TOK.ink=g('--ink',TOK.ink);
}

/* ------------------------------------------------------- drawing helpers */
function svgEl(tag,attrs={},text){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!=null)e.textContent=text;return e}
function add(svg,tag,attrs,text){const e=svgEl(tag,attrs,text);svg.appendChild(e);return e}
function clear(svg){while(svg.firstChild)svg.removeChild(svg.firstChild)}

function bounds(){const z=S.zoom;return {xmin:-6/z,xmax:6/z,tmin:-1.5/z,tmax:7/z,W:760,H:620}}
function mapper(){const b=bounds();return {b,xp:x=>(x-b.xmin)/(b.xmax-b.xmin)*b.W,yp:t=>b.H-(t-b.tmin)/(b.tmax-b.tmin)*b.H,xw:px=>b.xmin+px/b.W*(b.xmax-b.xmin),tw:py=>b.tmin+(b.H-py)/b.H*(b.tmax-b.tmin)}}
function clipLineForXofT(k){const b=bounds(),pts=[];for(const tt of [b.tmin,b.tmax]){const x=k*tt;if(x>=b.xmin&&x<=b.xmax)pts.push({x,t:tt})}if(Math.abs(k)>1e-12){for(const x of [b.xmin,b.xmax]){const tt=x/k;if(tt>=b.tmin&&tt<=b.tmax)pts.push({x,t:tt})}}return farthestPair(pts)}
function clipOffsetXofT(k,c){const b=bounds(),pts=[];for(const tt of [b.tmin,b.tmax]){const x=k*tt+c;if(x>=b.xmin&&x<=b.xmax)pts.push({x,t:tt})}if(Math.abs(k)>1e-12){for(const x of [b.xmin,b.xmax]){const tt=(x-c)/k;if(tt>=b.tmin&&tt<=b.tmax)pts.push({x,t:tt})}}else if(c>=b.xmin&&c<=b.xmax){pts.push({x:c,t:b.tmin},{x:c,t:b.tmax})}return farthestPair(pts)}
function clipLineTfromX(m,c){const b=bounds(),pts=[];for(const x of [b.xmin,b.xmax]){const tt=m*x+c;if(tt>=b.tmin&&tt<=b.tmax)pts.push({x,t:tt})}if(Math.abs(m)>1e-12){for(const tt of [b.tmin,b.tmax]){const x=(tt-c)/m;if(x>=b.xmin&&x<=b.xmax)pts.push({x,t:tt})}}else if(c>=b.tmin&&c<=b.tmax){pts.push({x:b.xmin,t:c},{x:b.xmax,t:c})}return farthestPair(pts)}
function farthestPair(pts){if(pts.length<2)return null;let best=[pts[0],pts[1]],d=-1;for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const q=(pts[i].x-pts[j].x)**2+(pts[i].t-pts[j].t)**2;if(q>d){d=q;best=[pts[i],pts[j]]}}return best}
function drawLineWorld(svg,pair,attrs){if(!pair)return;const m=mapper();add(svg,'line',{x1:m.xp(pair[0].x),y1:m.yp(pair[0].t),x2:m.xp(pair[1].x),y2:m.yp(pair[1].t),...attrs})}
function pathWorld(points){const m=mapper();return points.map((p,i)=>`${i?'L':'M'}${m.xp(p.x).toFixed(2)},${m.yp(p.t).toFixed(2)}`).join(' ')}

/* ------------------------------------------------------- sandbox objects */
function ensureSandbox(){if(!S.sandbox||typeof S.sandbox!=='object')S.sandbox={objects:[],selected:null,tool:'select',nextId:1,snap:true};if(!Array.isArray(S.sandbox.objects))S.sandbox.objects=[];if(!['select','observer','event','rod','source'].includes(S.sandbox.tool))S.sandbox.tool='select';S.sandbox.nextId=Math.max(1,Number(S.sandbox.nextId)||1);if(typeof S.sandbox.snap!=='boolean')S.sandbox.snap=true}
function sandboxObj(id){ensureSandbox();return S.sandbox.objects.find(o=>o.id===id)||null}
function sandboxTypeName(type){return t({observer:'sbObserver',event:'sbEvent',rod:'sbRod',source:'sbSource'}[type]||'sbType')}
function sandboxDesc(type){return t({observer:'sbObserverDesc',event:'sbEventDesc',rod:'sbRodDesc',source:'sbSourceDesc'}[type]||'sbEmpty')}
function sandboxColor(type){return {observer:'#55c2ff',event:'#ff9a76',rod:'#9ee493',source:'#ffd36a'}[type]||'#c59cff'}
function sandboxNextName(type){ensureSandbox();const prefix={observer:'O',event:'E',rod:'R',source:'L'}[type]||'X';let n=1;const used=new Set(S.sandbox.objects.filter(o=>o.type===type).map(o=>o.name));while(used.has(prefix+n))n++;return prefix+n}
function sandboxCreate(type,p){ensureSandbox();if(!['observer','event','rod','source'].includes(type))return null;const id='sb'+(S.sandbox.nextId++),name=sandboxNextName(type);let o;if(type==='event')o={id,type,name,x:p.x,t:p.t};else if(type==='observer')o={id,type,name,x0:p.x-S.beta*p.t,beta:S.beta};else if(type==='rod')o={id,type,name,x0:p.x-S.beta*p.t,beta:S.beta,L0:2};else o={id,type,name,x0:p.x-S.beta*p.t,beta:S.beta,period:.7,startT:Math.max(0,p.t)};S.sandbox.objects.push(o);S.sandbox.selected=id;S.preset='sandbox';return o}
function sandboxDuplicateSelected(){const o=sandboxObj(S.sandbox.selected);if(!o)return;const q=JSON.parse(JSON.stringify(o));q.id='sb'+(S.sandbox.nextId++);q.name=sandboxNextName(o.type);if(q.type==='event'){q.x+=.35;q.t+=.25}else q.x0+=.35;S.sandbox.objects.push(q);S.sandbox.selected=q.id;S.preset='sandbox';render()}
function sandboxDeleteSelected(){ensureSandbox();const id=S.sandbox.selected;if(!id)return;S.sandbox.objects=S.sandbox.objects.filter(o=>o.id!==id);S.sandbox.selected=null;render()}
function sandboxClear(){ensureSandbox();S.sandbox.objects=[];S.sandbox.selected=null;render()}
function sandboxOutputs(){ensureSandbox();return S.sandbox.objects.map(o=>{if(o.type==='event')return {id:o.id,type:o.type,name:o.name,x:o.x,ct:o.t};if(o.type==='rod'){const g=gamma(o.beta);return {id:o.id,type:o.type,name:o.name,x0:o.x0,beta:o.beta,gamma:g,proper_length:o.L0,lab_length:o.L0/g}}if(o.type==='source'){const g=gamma(o.beta);return {id:o.id,type:o.type,name:o.name,x0:o.x0,beta:o.beta,gamma:g,proper_period:o.period,coordinate_period:g*o.period,first_emission:o.startT}}return {id:o.id,type:o.type,name:o.name,x0:o.x0,beta:o.beta,gamma:gamma(o.beta)}})}
function sandboxPointerWorld(e){const svg=$('minkowskiSvg'),r=svg.getBoundingClientRect(),m=mapper(),px=(e.clientX-r.left)/r.width*760,py=(e.clientY-r.top)/r.height*620;return sandboxSnapPoint({x:clamp(m.xw(px),m.b.xmin,m.b.xmax),t:clamp(m.tw(py),m.b.tmin,m.b.tmax)})}
function sandboxSnapPoint(p){ensureSandbox();if(!S.sandbox.snap)return p;const h=.25;return {x:Math.round(p.x/h)*h,t:Math.round(p.t/h)*h}}
function sandboxSelect(id){ensureSandbox();S.sandbox.selected=id;S.sandbox.tool='select';S.preset='sandbox';render()}
function sandboxWorldlineHandles(o){const b=bounds(),t0=clamp(0,b.tmin+.1,b.tmax-.1),t1=clamp(Math.max(2.5,b.tmin+1),b.tmin+.2,b.tmax-.2);return {base:{x:o.x0+o.beta*t0,t:t0},slope:{x:o.x0+o.beta*t1,t:t1},t0,t1}}
function futureLightRay(ev,dir){const b=bounds(),space=dir>0?b.xmax-ev.x:ev.x-b.xmin,dt=Math.min(b.tmax-ev.t,space);return dt>0?[ev,{x:ev.x+dir*dt,t:ev.t+dt}]:null}
function sandboxPulseLines(svg,o,selected=false){const b=bounds(),g=gamma(o.beta),dt=g*Math.max(.05,o.period),nmax=Math.min(12,Math.ceil((b.tmax-o.startT)/dt)+1);for(let n=0;n<nmax;n++){const te=o.startT+n*dt;if(te<b.tmin-.1||te>b.tmax+.1)continue;const xe=o.x0+o.beta*te,ev={x:xe,t:te};add(svg,'circle',{cx:mapper().xp(xe),cy:mapper().yp(te),r:selected?3.2:2.4,fill:PAL.light,stroke:TOK.panel,'stroke-width':1.5});drawLineWorld(svg,futureLightRay(ev,1),{stroke:PAL.light,'stroke-width':1.25,'stroke-dasharray':'4 4',opacity:.45});drawLineWorld(svg,futureLightRay(ev,-1),{stroke:PAL.light,'stroke-width':1.25,'stroke-dasharray':'4 4',opacity:.45})}}
function sandboxBind(el,id,dragKind=null){el.classList.add('sandbox-object');el.addEventListener('pointerdown',e=>{e.stopPropagation();hpush();S.sandbox.selected=id;S.sandbox.tool='select';S.preset='sandbox';if(dragKind)dragging=`sb:${id}:${dragKind}`;render();e.preventDefault()})}
function drawObserverFrame(svg,o,c,selected){const m=mapper(),b=m.b,g=gamma(o.beta);for(let tau=0;tau<=8;tau++){const tt=g*tau,xx=o.x0+o.beta*tt;if(tt<b.tmin||tt>b.tmax||xx<b.xmin||xx>b.xmax)continue;add(svg,'circle',{cx:m.xp(xx),cy:m.yp(tt),r:tau===0?3:2.1,fill:c,opacity:selected?.95:.55});if(selected&&tau>0&&tau<=4)add(svg,'text',{x:m.xp(xx)+5,y:m.yp(tt)-4,class:'tick-label',fill:c},`τ=${tau}`)}if(selected)drawLineWorld(svg,clipLineTfromX(o.beta,-o.beta*o.x0),{stroke:c,'stroke-width':1.2,'stroke-dasharray':'6 5',opacity:.55})}
function drawSandbox(svg){ensureSandbox();const m=mapper(),b=m.b;for(const o of S.sandbox.objects){const selected=o.id===S.sandbox.selected,c=sandboxColor(o.type);if(o.type==='event'){const ring=selected?add(svg,'circle',{cx:m.xp(o.x),cy:m.yp(o.t),r:11,fill:'none',stroke:PAL.s,'stroke-width':1.4,'stroke-dasharray':'4 3','pointer-events':'none'}):null;const dot=add(svg,'circle',{cx:m.xp(o.x),cy:m.yp(o.t),r:selected?6.5:5.3,fill:c,stroke:TOK.panel,'stroke-width':2});sandboxBind(dot,o.id,'event');add(svg,'text',{x:m.xp(o.x)+9,y:m.yp(o.t)-9,class:'sandbox-label',fill:c},o.name)}else if(o.type==='observer'){const line=clipOffsetXofT(o.beta,o.x0);drawLineWorld(svg,line,{stroke:c,class:'sandbox-worldline',opacity:selected?1:.75});drawObserverFrame(svg,o,c,selected);if(line){const hit=add(svg,'line',{x1:m.xp(line[0].x),y1:m.yp(line[0].t),x2:m.xp(line[1].x),y2:m.yp(line[1].t),class:'sandbox-worldline hit'});sandboxBind(hit,o.id,null)}const h=sandboxWorldlineHandles(o);add(svg,'text',{x:m.xp(o.x0+o.beta*Math.min(4,b.tmax-.3))+7,y:m.yp(Math.min(4,b.tmax-.3))-7,class:'sandbox-label',fill:c},o.name);if(selected){for(const [kind,q] of [['base',h.base],['slope',h.slope]]){const hh=add(svg,'circle',{cx:m.xp(q.x),cy:m.yp(q.t),r:6.2,fill:c,class:'drag-handle'});sandboxBind(hh,o.id,kind)}}}else if(o.type==='rod'){const g=gamma(o.beta),half=o.L0/(2*g),l=clipOffsetXofT(o.beta,o.x0-half),r=clipOffsetXofT(o.beta,o.x0+half);if(l&&r){const pts=[l[0],l[1],r[1],r[0]];add(svg,'path',{d:pathWorld(pts)+' Z',fill:c,class:'sandbox-rod-fill'});drawLineWorld(svg,l,{stroke:c,class:'sandbox-worldline',opacity:selected?1:.7});drawLineWorld(svg,r,{stroke:c,class:'sandbox-worldline',opacity:selected?1:.7});for(const pair of [l,r]){const hit=add(svg,'line',{x1:m.xp(pair[0].x),y1:m.yp(pair[0].t),x2:m.xp(pair[1].x),y2:m.yp(pair[1].t),class:'sandbox-worldline hit'});sandboxBind(hit,o.id,null)}}const tt=clamp(2.8,b.tmin+.3,b.tmax-.3),cx=o.x0+o.beta*tt;add(svg,'text',{x:m.xp(cx)+7,y:m.yp(tt)-7,class:'sandbox-label',fill:c},`${o.name} · L₀=${fmt(o.L0,2)}`);if(selected){const hb=add(svg,'circle',{cx:m.xp(o.x0),cy:m.yp(0),r:6.2,fill:c,class:'drag-handle'});sandboxBind(hb,o.id,'base');const hs=sandboxWorldlineHandles(o).slope,hh=add(svg,'circle',{cx:m.xp(hs.x),cy:m.yp(hs.t),r:6.2,fill:c,class:'drag-handle'});sandboxBind(hh,o.id,'slope');const hr=add(svg,'circle',{cx:m.xp(o.x0+half),cy:m.yp(0),r:5.5,fill:'#ff9a76',class:'drag-handle'});sandboxBind(hr,o.id,'length')}}else if(o.type==='source'){const line=clipOffsetXofT(o.beta,o.x0);drawLineWorld(svg,line,{stroke:c,class:'sandbox-worldline',opacity:selected?1:.75});if(line){const hit=add(svg,'line',{x1:m.xp(line[0].x),y1:m.yp(line[0].t),x2:m.xp(line[1].x),y2:m.yp(line[1].t),class:'sandbox-worldline hit'});sandboxBind(hit,o.id,null)}sandboxPulseLines(svg,o,selected);const sx=o.x0+o.beta*o.startT,sd=add(svg,'circle',{cx:m.xp(sx),cy:m.yp(o.startT),r:5.6,fill:c,stroke:TOK.panel,'stroke-width':2});sandboxBind(sd,o.id,'source-start');add(svg,'text',{x:m.xp(sx)+9,y:m.yp(o.startT)-9,class:'sandbox-label',fill:c},o.name);if(selected){const hs=sandboxWorldlineHandles(o).slope,hh=add(svg,'circle',{cx:m.xp(hs.x),cy:m.yp(hs.t),r:6.2,fill:c,class:'drag-handle'});sandboxBind(hh,o.id,'slope')}}}
  if(sandboxPointerInside&&sandboxGhost&&S.sandbox.tool!=='select')drawSandboxGhost(svg,S.sandbox.tool,sandboxGhost)
}
function drawSandboxGhost(svg,type,p){const m=mapper(),c=sandboxColor(type);if(type==='event'){add(svg,'circle',{cx:m.xp(p.x),cy:m.yp(p.t),r:7,fill:c,class:'sandbox-ghost'})}else if(type==='observer'||type==='source'){drawLineWorld(svg,clipOffsetXofT(S.beta,p.x-S.beta*p.t),{stroke:c,'stroke-width':2,'stroke-dasharray':'5 5',class:'sandbox-ghost'});add(svg,'circle',{cx:m.xp(p.x),cy:m.yp(p.t),r:5,fill:c,class:'sandbox-ghost'})}else if(type==='rod'){const g=gamma(S.beta),half=1/g;drawLineWorld(svg,clipOffsetXofT(S.beta,p.x-S.beta*p.t-half),{stroke:c,'stroke-width':1.7,'stroke-dasharray':'5 5',class:'sandbox-ghost'});drawLineWorld(svg,clipOffsetXofT(S.beta,p.x-S.beta*p.t+half),{stroke:c,'stroke-width':1.7,'stroke-dasharray':'5 5',class:'sandbox-ghost'})}}

/* ------------------------------------------------------------- the stage */
function renderMinkowski(){
  const svg=$('minkowskiSvg');clear(svg);const m=mapper(),b=m.b;
  const defs=add(svg,'defs');
  const marker=add(defs,'marker',{id:'arrowAxis',markerWidth:8,markerHeight:8,refX:5,refY:3,orient:'auto',markerUnits:'strokeWidth'});add(marker,'path',{d:'M0,0 L0,6 L6,3 z',fill:TOK.muted});
  const clip=add(defs,'clipPath',{id:'plotClip'});add(clip,'rect',{x:0,y:0,width:b.W,height:b.H,rx:12});
  const root=add(svg,'g',{'clip-path':'url(#plotClip)'});

  if(S.layers.causal){
    const O={x:0,t:0};
    const future=[O,{x:b.tmax,t:b.tmax},{x:-b.tmax,t:b.tmax}].filter(p=>p.x>=b.xmin&&p.x<=b.xmax||p===O);
    const maxT=Math.min(b.tmax,b.xmax,-b.xmin);
    add(root,'path',{d:pathWorld([O,{x:maxT,t:maxT},{x:-maxT,t:maxT},O]),fill:'rgba(121,223,161,.055)'});
    const minT=Math.max(b.tmin,-b.xmax,b.xmin);
    add(root,'path',{d:pathWorld([O,{x:-minT,t:minT},{x:minT,t:minT},O]),fill:'rgba(121,223,161,.035)'});
  }

  if(S.layers.grid){
    const step=S.zoom>1.45?.5:1;
    for(let x=Math.ceil(b.xmin/step)*step;x<=b.xmax+1e-9;x+=step){const major=Math.abs(x-Math.round(x))<1e-8;add(root,'line',{x1:m.xp(x),y1:0,x2:m.xp(x),y2:b.H,stroke:major?TOK.line:TOK.line,'stroke-width':major?1:.7,opacity:major?.65:.48})}
    for(let tt=Math.ceil(b.tmin/step)*step;tt<=b.tmax+1e-9;tt+=step){const major=Math.abs(tt-Math.round(tt))<1e-8;add(root,'line',{x1:0,y1:m.yp(tt),x2:b.W,y2:m.yp(tt),stroke:major?TOK.line:TOK.line,'stroke-width':major?1:.7,opacity:major?.65:.48})}
  }

  if(S.layers.hyper)drawHyperbolae(root);

  drawLineWorld(root,clipLineTfromX(0,0),{stroke:'#55c2ff','stroke-width':2.1,'marker-end':'url(#arrowAxis)'});
  drawLineWorld(root,clipLineForXofT(0),{stroke:'#55c2ff','stroke-width':2.1,'marker-end':'url(#arrowAxis)'});

  drawLineWorld(root,clipLineForXofT(1),{stroke:'#ffd36a','stroke-width':1.65,opacity:.95});
  drawLineWorld(root,clipLineForXofT(-1),{stroke:'#ffd36a','stroke-width':1.65,opacity:.95});

  const gx=m.xp(0),gy=m.yp(0);
  for(let x=Math.ceil(b.xmin);x<=Math.floor(b.xmax);x++){if(x===0)continue;add(root,'line',{x1:m.xp(x),y1:gy-4,x2:m.xp(x),y2:gy+4,stroke:TOK.muted,'stroke-width':1});if(!COARSE||Math.abs(x)%2===0)add(root,'text',{x:m.xp(x),y:gy+18,'text-anchor':'middle',class:'tick-label'},String(x))}
  for(let tt=Math.ceil(b.tmin);tt<=Math.floor(b.tmax);tt++){if(tt===0)continue;add(root,'line',{x1:gx-4,y1:m.yp(tt),x2:gx+4,y2:m.yp(tt),stroke:TOK.muted,'stroke-width':1});if(!COARSE||Math.abs(tt)%2===0)add(root,'text',{x:gx-9,y:m.yp(tt)+4,'text-anchor':'end',class:'tick-label'},String(tt))}
  add(root,'text',{x:b.W-18,y:gy-10,'text-anchor':'end',class:'axis-label',fill:'#55c2ff'},'x');
  add(root,'text',{x:gx+10,y:18,class:'axis-label',fill:'#55c2ff'},'ct');
  add(root,'text',{x:m.xp(Math.min(b.xmax,4.7)),y:m.yp(Math.min(b.tmax,4.7))-8,class:'small-label',fill:'#ffd36a'},'x = ct');

  if(S.layers.prime)drawPrimeAxes(root);
  if(S.layers.sim)drawSimultaneity(root);
  drawPresetOverlay(root);
  if(!['length','twin','radar','velocity','doppler','sandbox'].includes(S.preset))drawEvents(root);
  if(S.preset==='sandbox')drawSandbox(root);
}

function drawPrimeAxes(svg){
  const beta=S.beta,g=gamma(beta),m=mapper(),b=m.b;
  drawLineWorld(svg,clipLineForXofT(beta),{stroke:'#9ee493','stroke-width':2.15,opacity:.96});
  drawLineWorld(svg,clipLineTfromX(beta,0),{stroke:'#9ee493','stroke-width':2.15,opacity:.96});
  for(let u=-5;u<=7;u++){
    if(u===0)continue;
    const pT={x:g*beta*u,t:g*u},pX={x:g*u,t:g*beta*u};
    if(pT.x>=b.xmin&&pT.x<=b.xmax&&pT.t>=b.tmin&&pT.t<=b.tmax){add(svg,'circle',{cx:m.xp(pT.x),cy:m.yp(pT.t),r:2.6,fill:'#9ee493'});if(Math.abs(u)<=3)add(svg,'text',{x:m.xp(pT.x)+6,y:m.yp(pT.t)-5,class:'tick-label',fill:'#9ee493'},String(u))}
    if(pX.x>=b.xmin&&pX.x<=b.xmax&&pX.t>=b.tmin&&pX.t<=b.tmax){add(svg,'circle',{cx:m.xp(pX.x),cy:m.yp(pX.t),r:2.6,fill:'#9ee493'});if(Math.abs(u)<=3)add(svg,'text',{x:m.xp(pX.x)+4,y:m.yp(pX.t)+14,class:'tick-label',fill:'#9ee493'},String(u))}
  }

function runSelfTests(){
  const tests=[];const near=(a,b,tol=1e-10)=>Math.abs(a-b)<=tol*Math.max(1,Math.abs(a),Math.abs(b));
  tests.push(near(gamma(0),1));tests.push(near(gamma(.6),1.25));tests.push(near(gamma(.8),5/3));tests.push(near(1/gamma(.6),.8));tests.push(near(velocityCompose(.8,.8),.9756097560975609));tests.push(near(velocityToPrime(velocityFromPrime(.8,.6),.6),.8));tests.push(near(betaFromRapidity(rapidity(.73)),.73));tests.push(near(lengthObserved(5,.6),4));tests.push(near(twinTimes(.8,3).traveller,3.6));const ts=twinState(.8,3,.5);tests.push(near(ts.x,2.4)&&near(ts.earth,3)&&near(ts.traveller,1.8));const rr=radarSolution(.4,1.2,.7);tests.push(rr&&near(rr.reflect,3.1666666666666665)&&near(rr.receive,5.633333333333333));const rp=radarPulsePoint(rr,.5);tests.push(rp&&rp.t>=rr.emit&&rp.t<=rr.receive);tests.push(near(dopplerFactor(.6),.5));const dd=dopplerSolution(.6,3,.5,5);tests.push(dd&&near(dd.factor,.5)&&near(dd.observedPeriod,1));const ft=finiteTwin(.8,.5);tests.push(near(ft.traveller,8*rapidity(.8))&&near(ft.earth,4*Math.sinh(rapidity(.8))/.5));const fs=finiteTwinState(.8,.5,1);tests.push(near(fs.x,0,1e-9)&&near(fs.beta,0,1e-9)&&near(fs.t,ft.earth,1e-9));const oldSb=S.sandbox;S.sandbox={objects:[{id:'t1',type:'rod',name:'R',x0:0,beta:.6,L0:5},{id:'t2',type:'source',name:'L',x0:1,beta:.6,period:.4,startT:0}],selected:null,tool:'select',nextId:3};const so=sandboxOutputs();tests.push(near(so[0].lab_length,4));tests.push(near(so[1].coordinate_period,.5));S.sandbox=oldSb;
  for(const beta of [-.9,-.6,-.2,.2,.6,.9])for(const ev of [{x:2.1,t:3.7},{x:-1.2,t:5.3},{x:4,t:1.1}]){const p=lorentz(ev,beta),back=invLorentz(p,beta);tests.push(near(ev.t*ev.t-ev.x*ev.x,p.t*p.t-p.x*p.x,3e-10));tests.push(near(ev.x,back.x,3e-10)&&near(ev.t,back.t,3e-10))}
  const ok=tests.every(Boolean),el=$('selftest');el.classList.toggle('pass',ok);el.classList.toggle('fail',!ok);$('selftestText').textContent=`${ok?t('selfPass'):t('selfFail')} · ${tests.filter(Boolean).length}/${tests.length}`;return {ok,passed:tests.filter(Boolean).length,total:tests.length}
}

function el(tag,attrs,children){
  const n=document.createElement(tag);attrs=attrs||{};
  for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')n.className=v;
    else if(k==='text')n.textContent=v;
    else if(k==='style'&&typeof v==='object'){for(const s in v)n.style.setProperty(s,v[s])}
    else if(v===true)n.setAttribute(k,'');
    else n.setAttribute(k,v)}
  (children||[]).forEach(c=>{if(c==null||c===false)return;
    n.appendChild(typeof c==='string'?document.createTextNode(c):c)});
  return n;
}

/* The numbers, their precision and their wording are the ones renderNumbers()
   printed before the port; only their home changed. */
function resultsPayload(){
  const beta=S.beta,g=gamma(beta),ig=1/g,phi=rapidity(beta),
        A1=lorentz(S.A,beta),B1=lorentz(S.B,beta),q=interval(S.A,S.B),q1=interval(A1,B1),
        kind=classify(q.s2,Math.max(q.dt*q.dt,q.dx*q.dx)),tau=properTime(S.A,S.B);
  const eps=1e-8;let parts=[];
  if(Math.abs(q.dt)<eps)parts.push(t('simInS'));
  if(Math.abs(q1.dt)<eps)parts.push(t('simInSp'));
  if(kind==='timelike')parts.push(q.dt>=0?t('causalYes'):t('causalPast'));
  else if(kind==='spacelike')parts.push(t('causalNo'));
  else parts.push(q.dt>=0?t('causalYes'):t('causalPast'));
  if(Math.sign(q.dt||0)!==Math.sign(q1.dt||0)&&Math.abs(q.dt)>eps&&Math.abs(q1.dt)>eps)parts.push(t('orderFlip'));
  else if(Math.abs(q.dt)>eps&&Math.abs(q1.dt)>eps)parts.push(t('orderSame'));
  let badge=t(kind),tone=kind==='timelike'?'ok':(kind==='lightlike'?'warn':''),
      explain=parts.join(' '),
      formula=`Δs² = (cΔt)² − (Δx)² = <strong>${fmt(q.s2,4)}</strong><br><span class="eq-muted">Lorentz check: Δs′² = ${fmt(q1.s2,4)}</span>`;
  if(S.preset==='length'){badge=t('lengthBadge');tone='ok';explain=t('lengthExplain');formula=`L = L₀/γ = <strong>${fmt(S.rodL0/g,4)}</strong>`}
  else if(S.preset==='twin'){
    badge=t('twinBadge');tone='';
    if(S.twinMode==='finite'){const tw=finiteTwin(beta,S.twinAccel);explain=t('finiteTwinExplain');
      formula=`τ<sub>trav</sub> = 4φ/a = <strong>${fmt(tw.traveller,4)}</strong> · t<sub>Earth</sub> = ${fmt(tw.earth,4)}`}
    else{const tw=twinTimes(beta,S.twinLeg);explain=t('twinExplain');
      formula=`τ<sub>trav</sub> = 2T/γ = <strong>${fmt(tw.traveller,4)}</strong> · τ<sub>Earth</sub> = ${fmt(tw.earth,4)}`}
  }
  else if(S.preset==='radar'){const r=radarSolution(beta,S.radarX0,S.radarEmit);
    badge=t('radarBadge');tone='warn';explain=t('radarExplain');
    formula=r?`D<sub>radar</sub> = (t<sub>A</sub>−t<sub>E</sub>)/2 = <strong>${fmt(r.radarDistance,4)}</strong>`:'No returning light path in the selected geometry.'}
  else if(S.preset==='velocity'){const w=velocityFromPrime(S.uRel,beta);
    badge=t('boostsBadge');tone='ok';explain=t('velocityExplain');
    formula=`w/c = (u′/c + β)/(1 + βu′/c) = <strong>${fmt(w,5)}</strong>`}
  else if(S.preset==='doppler'){const d=dopplerSolution(beta,S.dopplerX0,S.dopplerPeriod,5);
    badge=t('dopplerBadge');tone='warn';explain=t('dopplerExplain');
    formula=d?`f<sub>r</sub>/f<sub>e</sub> = e<sup>−φ</sup> = <strong>${fmt(d.factor,5)}</strong>`:'—'}
  return {
    verdict:{tone,text:badge},
    tiles:[
      {label:'β',value:beta,precision:3,hint:'v/c',learn:'frame'},
      {label:'γ',value:g,precision:3,hint:'Lorentz factor',learn:'lightclock'},
      {label:'1/γ',value:ig,precision:3,hint:'dτ/dt',learn:'lightclock'},
      {label:'φ',value:phi,precision:3,hint:t('rapidity'),learn:'rapidity'}
    ],
    tables:[
      {title:t('eventCoords'),head:['','x','ct','x′','ct′'],rows:[
        ['A',signfmt(S.A.x,3),signfmt(S.A.t,3),signfmt(A1.x,3),signfmt(A1.t,3)],
        ['B',signfmt(S.B.x,3),signfmt(S.B.t,3),signfmt(B1.x,3),signfmt(B1.t,3)]
      ]},
      {title:t('separation'),head:['','S','','S′'],rows:[
        ['Δx',signfmt(q.dx,3),'Δx′',signfmt(q1.dx,3)],
        ['cΔt',signfmt(q.dt,3),'cΔt′',signfmt(q1.dt,3)],
        ['Δs²',signfmt(q.s2,3),'cΔτ',Number.isFinite(tau)?fmt(tau,3):'—']
      ]}
    ],
    notes:[explain],
    nodes:[fnode(formula)]
  };
}

  const active=guideStep>=0&&guideStep<GUIDE.length;
  box.textContent='';
  const head=el('div',{class:'dgu-flabel'},[active?t(GUIDE[guideStep].title):t('guideIdleTitle')]);
  if(active)head.appendChild(el('span',{class:'dgu-hint',text:` ${guideStep+1}/${GUIDE.length}`}));
  box.appendChild(head);
  box.appendChild(el('p',{class:'dgu-hint',style:{margin:'0'},text:active?t(GUIDE[guideStep].text):t('guideIdleText')}));
  const dots=el('div',{class:'rel-dots','aria-hidden':'true'});
  GUIDE.forEach((_,i)=>dots.appendChild(el('i',{class:i===guideStep?'on':''})));
  box.appendChild(dots);
  const row=el('div',{class:'dgu-panel-actions'});
  const mk=(label,run,cls,dis)=>{const b=el('button',{class:'dgu-btn'+(cls?' '+cls:''),type:'button',text:label});if(dis)b.disabled=true;b.addEventListener('click',run);return b};
  if(!active)row.appendChild(mk(t('guideStart'),()=>applyGuideStep(0),'primary'));
  else{
    row.appendChild(mk(t('guidePrev'),()=>applyGuideStep(Math.max(0,guideStep-1)),'',guideStep===0));
    row.appendChild(mk(guideStep===GUIDE.length-1?t('guideExit'):t('guideNext'),
      ()=>{if(guideStep>=GUIDE.length-1){guideStep=-1;render()}else applyGuideStep(guideStep+1)},'primary'));
    row.appendChild(mk(t('guideExit'),()=>{guideStep=-1;render()},'ghost'));
  }
  box.appendChild(row);
}
function renderGuide(){if(ui)paintGuide(ui.node.querySelector('[data-dgu-panel="route"] .dgu-fields'))}
function applyGuideStep(i){
  hpush();
  guideStep=clamp(i,0,GUIDE.length-1);const q=GUIDE[guideStep];
  applyPreset(q.p);S.beta=q.beta;
  if(q.uRel!=null)S.uRel=q.uRel;if(q.dopplerX0!=null)S.dopplerX0=q.dopplerX0;
  if(q.dopplerPeriod!=null)S.dopplerPeriod=q.dopplerPeriod;
  if(q.twinMode)S.twinMode=q.twinMode;if(q.twinAccel!=null)S.twinAccel=q.twinAccel;
  renderGuide();render();if(ui)ui.run();
}

function buildMainSvg(host){
  const svg=svgEl('svg',{id:'minkowskiSvg',class:'rel-svg rel-main',viewBox:'0 0 760 620',
    role:'img','aria-label':'Interactive Minkowski spacetime diagram'});
  host.appendChild(svg);
  svg.addEventListener('pointermove',e=>{ensureSandbox();sandboxPointerInside=true;
    if(S.preset==='sandbox'&&S.sandbox.tool!=='select'&&!dragging){sandboxGhost=sandboxPointerWorld(e);renderMinkowski()}});
  svg.addEventListener('pointerleave',()=>{sandboxPointerInside=false;sandboxGhost=null;if(S.preset==='sandbox')renderMinkowski()});
  svg.addEventListener('pointerdown',e=>{ensureSandbox();
    if(S.preset!=='sandbox')return;
    if(e.target!==svg&&e.target.closest&&e.target.closest('.sandbox-object'))return;
    if(S.sandbox.tool!=='select'){hpush();const p=sandboxPointerWorld(e);sandboxCreate(S.sandbox.tool,p);sandboxGhost=p;render();e.preventDefault()}
    else{S.sandbox.selected=null;render()}});
  return svg;
}

/* ------------------------------------------------------------------ degrade
 * If diagram-ui.js never arrives there is no shell, but the tool is not dead:
 * the diagram, the geometry, the experiment read-outs and the whole data layer
 * (permalink, record, PDF, CSV, Python export) still work, with plain controls.
 */
function bootFallback(){
  const host=$('app');
  const add=(tag,text)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;host.appendChild(n);return n};
  const m=(window.Diagram&&Diagram.manifest&&Diagram.manifest())||null;
  add('h1',(m&&m.title&&(m.title[lang]||m.title.en))||'Relativistic Spacetime Laboratory');
  add('p',t('subtitle'));
  const row=document.createElement('div');host.appendChild(row);
  const sel=document.createElement('select');sel.setAttribute('aria-label',t('presets'));
  PRESET_LIST.forEach(([id,l])=>{const o=document.createElement('option');o.value=id;o.textContent=t(l);sel.appendChild(o)});
  sel.value=S.preset;sel.addEventListener('change',()=>applyPreset(sel.value));
  row.appendChild(sel);
  const lab=document.createElement('label');lab.htmlFor='fbBeta';lab.textContent=' '+t('betaLabel')+' ';
  row.appendChild(lab);
  const rng=document.createElement('input');rng.type='range';rng.id='fbBeta';
  rng.min='-0.99';rng.max='0.99';rng.step='0.001';rng.value=String(S.beta);
  rng.addEventListener('input',()=>setBeta(+rng.value));
  row.appendChild(rng);
  buildMainSvg(host);
  buildGeometry(host);
  for(const k of EXPERIMENTS){
    const box=document.createElement('section');host.appendChild(box);
    const h=document.createElement('h2');h.textContent=t(k+'Title');box.appendChild(h);
    expRender.apply(null,EXP_SPECS[k])(box);
  }
  const st=document.createElement('div');st.id='selftest';st.className='rel-selftest';
  const dot=document.createElement('span');dot.className='dot';st.appendChild(dot);
  const txt=document.createElement('span');txt.id='selftestText';st.appendChild(txt);
  host.appendChild(st);
  add('p',t('prototypeNote'));
  draw();runSelfTests();
}
