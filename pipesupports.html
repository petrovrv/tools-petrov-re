<script>
(function () {
  'use strict';

  /* ==================================================================== 1. MODEL
     Pure. No document, no strings for the screen. Everything SI:
     m, kg, s, N, Pa, kg/m3, kg/m. */

  var G = 9.80665, RHO_STEEL = 7850;

  function geom(r) {
    var Do = r.D, Di = r.D - 2 * r.t;
    if (!(Di > 0)) Di = 0;
    var As = Math.PI / 4 * (Do * Do - Di * Di);
    var Ai = Math.PI / 4 * (Di * Di);
    var I  = Math.PI / 64 * (Do * Do * Do * Do - Di * Di * Di * Di);
    var Z  = Do > 0 ? 2 * I / Do : 0;
    var m  = As * RHO_STEEL + Ai * r.rhof + r.ins;
    return { I: I, Z: Z, m: m, w: m * G };
  }

  /* kind: 'cont' interior span of a run with 3+ supports,
           'simple' end span, 'cant' overhang beyond the outermost support */
  function spanOf(kind, w, Ls, E, I, Z, dlim) {
    var L4 = Ls * Ls * Ls * Ls, d, M;
    if (kind === 'cont')        { d = w * L4 / (185 * E * I);      M = w * Ls * Ls / 10; }
    else if (kind === 'simple') { d = 5 * w * L4 / (384 * E * I);  M = w * Ls * Ls / 8; }
    else                        { d = w * L4 / (8 * E * I);        M = w * Ls * Ls / 2; }
    var allow = Ls / dlim;
    return { L: Ls, kind: kind, d: d, allow: allow,
             ratio: allow > 0 ? d / allow : null,
             M: M, sigma: Z > 0 ? M / Z : null };
  }

  function solve(s) {
    var runs = s.runs || [], sups = s.sups || [];
    var spans = [], supports = [], warnings = [];
    var lengthTotal = 0, massTotal = 0, i, j;

    for (i = 0; i < runs.length; i++) {
      var r = runs[i], g = geom(r);
      var Lrun = r.x1 - r.x0;
      if (!(Lrun > 0)) { warnings.push('run ' + r.id + ': the run has zero or negative length'); Lrun = 0; }
      lengthTotal += Lrun;
      massTotal += g.m * Lrun;

      var on = [];
      for (j = 0; j < sups.length; j++) if (sups[j].run === r.id) on.push(sups[j]);
      on.sort(function (a, b) { return a.x - b.x; });

      var R = {};
      for (j = 0; j < on.length; j++) R[on[j].id] = 0;

      if (on.length === 0) {
        warnings.push('run ' + r.id + ': no support at all, so no span and no reaction is computed for it');
      } else {
        var oL = on[0].x - r.x0, oR = r.x1 - on[on.length - 1].x;
        if (oL > 0) { spans.push(withId(r, 'A', spanOf('cant', g.w, oL, s.E, g.I, g.Z, s.defl_limit))); R[on[0].id] += g.w * oL; }
        if (oR > 0) { spans.push(withId(r, 'B', spanOf('cant', g.w, oR, s.E, g.I, g.Z, s.defl_limit))); R[on[on.length - 1].id] += g.w * oR; }
        var n = on.length - 1;
        for (j = 0; j < n; j++) {
          var Ls = on[j + 1].x - on[j].x;
          var interior = (n >= 3) && (j > 0) && (j < n - 1);
          spans.push(withId(r, String(j + 1), spanOf(interior ? 'cont' : 'simple', g.w, Ls, s.E, g.I, g.Z, s.defl_limit)));
          R[on[j].id] += g.w * Ls / 2;
          R[on[j + 1].id] += g.w * Ls / 2;
        }
        if (on.length === 1) warnings.push('run ' + r.id + ': a single support carries the whole run as two cantilevers');
        var anchored = false;
        for (j = 0; j < on.length; j++) if (on[j].type === 'anchor') anchored = true;
        if (!anchored) warnings.push('run ' + r.id + ': no anchor on the run; axial restraint is outside this model anyway');
      }
      for (j = 0; j < on.length; j++) {
        supports.push({ id: on[j].id, run: r.id, type: on[j].type, R: R[on[j].id], cap: on[j].cap,
                        u: on[j].cap > 0 ? R[on[j].id] / on[j].cap : null });
      }
    }

    var known = {};
    for (i = 0; i < runs.length; i++) known[runs[i].id] = 1;
    for (j = 0; j < sups.length; j++) if (!known[sups[j].run]) warnings.push('support ' + sups[j].id + ': it names run ' + sups[j].run + ', which does not exist');

    var out = {
      spans: spans, supports: supports,
      n_runs: runs.length, n_supports: sups.length, n_spans: spans.length,
      length_total: lengthTotal, mass_total: massTotal,
      span_max: null, delta_max: null, delta_ratio_max: null,
      sigma_max: null, R_max: null, util_max: null,
      worst_span: null, worst_support: null
    };
    for (i = 0; i < spans.length; i++) {
      var sp = spans[i];
      if (out.span_max === null || sp.L > out.span_max) out.span_max = sp.L;
      if (out.delta_max === null || sp.d > out.delta_max) out.delta_max = sp.d;
      if (sp.sigma !== null && (out.sigma_max === null || sp.sigma > out.sigma_max)) out.sigma_max = sp.sigma;

                 pos: [r.x0, r.y - r.D / 2, r.z - r.D / 2],
                 size: [Math.max(0.01, r.x1 - r.x0), r.D, r.D],
                 color: DiagramUI.series(i) });

      for (i = 0; i < state.sups.length; i++) if (state.sups[i].run === o.id) state.sups[i].x = round6(state.sups[i].x + dx);
      o.x0 = round6(o.x0 + dx); o.x1 = round6(o.x1 + dx);
      o.y = round6(clampN(snapTo(p[1]), 0, state.rack_W));
    } else {
      var rr = runOf(o);
      o.x = round6(rr ? clampN(snapTo(p[0]), rr.x0, rr.x1) : snapTo(p[0]));
    }
  }

  function cloneSelection() {
    var o = objById(view.sel);
    if (!o || !ui) return;
    ui.pushHistory();
    if (isRun(o)) {
      var id = nextId('r', state.runs), c = JSON.parse(JSON.stringify(o));
      c.id = id; c.name = o.name + ' (2)'; c.y = round6(clampN(o.y + 1, 0, state.rack_W));
      state.runs.push(c);
      view.sel = id;
    } else {
      var sid = nextId('s', state.sups), d = JSON.parse(JSON.stringify(o));
      var rr = runOf(o);
      d.id = sid; d.x = round6(rr ? clampN(o.x + 2, rr.x0, rr.x1) : o.x + 2);
      state.sups.push(d);
      view.sel = sid;
    }
    refreshAll(); repaint();
  }

  function deleteSelection() {
    var o = objById(view.sel);
    if (!o || !ui) return;
    ui.pushHistory();
    var i;
    if (isRun(o)) {
      for (i = state.sups.length - 1; i >= 0; i--) if (state.sups[i].run === o.id) state.sups.splice(i, 1);
      for (i = 0; i < state.runs.length; i++) if (state.runs[i].id === o.id) { state.runs.splice(i, 1); break; }
    } else {
      for (i = 0; i < state.sups.length; i++) if (state.sups[i].id === o.id) { state.sups.splice(i, 1); break; }
    }
    var rest = allObjects();
    view.sel = rest.length ? rest[Math.min(i, rest.length - 1)].id : null;
    refreshAll(); repaint();
  }

  function addRun() {
    if (!ui) return;
    ui.pushHistory();
    var id = nextId('r', state.runs);
    var y = clampN(1.5 + state.runs.length * 1.5, 0, state.rack_W);
    state.runs.push({ id: id, name: 'Line ' + (state.runs.length + 1),
                      x0: 1, x1: Math.max(4, state.rack_L - 1), y: round6(y), z: state.z_new,
                      D: 0.1143, t: 0.006, rhof: 1000, ins: 6 });
    view.sel = id;
    refreshAll(); repaint();
  }

  function addSupport() {
    if (!ui) return;
    var o = objById(view.sel), r = o ? (isRun(o) ? o : runOf(o)) : state.runs[0];
    if (!r) return;
    ui.pushHistory();
    var on = [], i;
    for (i = 0; i < state.sups.length; i++) if (state.sups[i].run === r.id) on.push(state.sups[i]);
    on.sort(function (a, b) { return a.x - b.x; });
    var x = on.length ? (on.length > 1 ? (on[on.length - 1].x + on[on.length - 2].x) / 2 : (on[0].x + r.x1) / 2)
                      : (r.x0 + r.x1) / 2;
    var sid = nextId('s', state.sups);
    state.sups.push({ id: sid, run: r.id, x: round6(clampN(snapTo(x), r.x0, r.x1)), type: 'rest', cap: TYPE_CAP.rest });
    view.sel = sid;
    refreshAll(); repaint();
  }

  function round6(v) { return Math.round(v * 1e6) / 1e6; }
  function fmtN(v, p) { return (v === null || v === undefined || !isFinite(v)) ? '—' : DiagramUI.fmt(v, { precision: p }); }

        value: r.delta_max === null ? null : r.delta_max * 1000, hint: 'mm', precision: 1, learn: 'deflection',

          deflection: { title: T('Deflection and its limit', 'Прогин і його межа', 'Durchbiegung und ihre Grenze', 'Doorbuiging en de grens', 'Flèche et sa limite', 'Flecha y su límite','Ugięcie i jego granica'),
                        body: T('The sag at mid-span under the weight of pipe, contents and insulation. The allowable value here is the span divided by the limit you choose; it is a drainage and appearance criterion, not a strength one.',
                                'Прогин посередині прольоту від ваги труби, вмісту й ізоляції. Допустиме значення — проліт, поділений на обрану межу; це критерій стоку та вигляду, а не міцності.',

                                'De doorhang op halve overspanning onder het gewicht van leiding, inhoud en isolatie. De toelaatbare waarde is de overspanning gedeeld door de gekozen grens; een afschot- en uiterlijkcriterium, geen sterktecriterium.',

                                'La flecha en el centro del vano bajo el peso del tubo, el contenido y el aislamiento. El valor admisible es el vano dividido por el límite elegido; es un criterio de drenaje y aspecto, no de resistencia.','Zwis w środku przęsła pod ciężarem rury, jej zawartości i izolacji. Wartość dopuszczalna to przęsło podzielone przez wybraną granicę; jest to kryterium odwodnienia i wyglądu, a nie wytrzymałościowe.') },
          reaction: { title: T('Support reaction', 'Реакція опори', 'Auflagerkraft', 'Reactiekracht', 'Réaction d’appui', 'Reacción del soporte','Reakcja podpory'),
                      body: T('Half of each neighbouring span, plus any overhang, times the weight per metre. A continuous beam would put about 10 % more on an interior support than this tributary rule does.',
                              'Половина кожного сусіднього прольоту плюс звис, помножені на вагу на метр. Нерозрізна балка дала б на проміжну опору приблизно на 10 % більше.',
                              'Die Hälfte jeder Nachbarstützweite plus Überstand, mal Gewicht je Meter. Ein Durchlaufträger legt auf ein Innenauflager rund 10 % mehr als diese Regel.',

                              'La mitad de cada vano vecino más el voladizo, por el peso por metro. Una viga continua cargaría un apoyo intermedio en torno a un 10 % más.','Połowa każdego sąsiedniego przęsła, powiększona o ewentualny wspornik, pomnożona przez ciężar na metr. Belka ciągła obciążałaby podporę wewnętrzną o około 10 % bardziej niż ta reguła długości obciążeniowej.') },
          utilisation: { title: T('Utilisation', 'Використання', 'Ausnutzung', 'Benutting', 'Taux d’utilisation', 'Aprovechamiento','Wykorzystanie'),
                         body: T('The reaction divided by the capacity you typed for that support. It is only as trustworthy as that capacity: this tool has no catalogue of shoes, clamps or spring hangers.',
                                 'Реакція, поділена на введену вами несучу здатність опори. Вона настільки надійна, наскільки надійне це число: у цьому інструменті немає каталогу опор чи підвісок.',
                                 'Die Auflagerkraft geteilt durch die von Ihnen eingegebene Tragfähigkeit. Sie ist nur so gut wie diese Zahl: hier gibt es keinen Katalog für Schuhe, Schellen oder Federhänger.',
                                 'De reactiekracht gedeeld door het door u ingevoerde draagvermogen. Zo betrouwbaar als dat getal: dit gereedschap heeft geen catalogus van schoenen, beugels of veerhangers.',
                                 'La réaction divisée par la capacité que vous avez saisie. Elle ne vaut que ce que vaut ce chiffre : cet outil n’a aucun catalogue de sabots, colliers ou supports à ressort.',
                                 'La reacción dividida por la capacidad que usted introdujo. Vale lo que valga ese número: esta herramienta no tiene catálogo de zapatas, abrazaderas ni soportes de muelle.','Reakcja podzielona przez nośność wpisaną dla tej podpory. Jest tak wiarygodna, jak ta wartość: to narzędzie nie ma katalogu obejm, uchwytów ani wieszaków sprężynowych.') },
          types: { title: T('Support types', 'Типи опор', 'Auflagertypen', 'Typen ondersteuning', 'Types de support', 'Tipos de soporte','Typy podpór'),
                   body: T('A resting shoe, a guide, an anchor and a spring hanger all carry the same vertical load here, and only the capacity differs. Their real difference is lateral and axial restraint, which this tool does not model.',
                           'Ковзна опора, напрямна, нерухома опора та пружинна підвіска тут несуть однакове вертикальне навантаження, різниться лише несуча здатність. Справжня різниця — бічне й осьове закріплення, якого ця модель не враховує.',
                           'Gleitauflager, Führung, Festpunkt und Federhänger tragen hier dieselbe Vertikallast, nur die Tragfähigkeit unterscheidet sich. Ihr wirklicher Unterschied ist die seitliche und axiale Halterung, die hier nicht modelliert wird.',
                           'Glijsteun, geleiding, vastpunt en veerhanger dragen hier dezelfde verticale last; alleen het draagvermogen verschilt. Hun echte verschil is laterale en axiale bevestiging, die hier niet gemodelleerd wordt.',

      footer: T(
        'Continuous span: d = wL⁴/(185EI), M = wL²/10. End span: d = 5wL⁴/(384EI), M = wL²/8. Overhang: d = wL⁴/(8EI), M = wL²/2. w = (A_steel·7850 + A_bore·ρ_fluid + m_insulation)·9.80665. R = w·(L_left + L_right)/2 + w·overhang. σ = M/Z, Z = 2I/D. Allowable deflection = span / the limit you choose. Every stored value is SI; capacities are entered in kN and stored in newtons. Weight only: no thermal, friction, wind, seismic or dynamic load, no bends, branches, valves or flange weights, and no code check.',
        'Нерозрізний проліт: d = wL⁴/(185EI), M = wL²/10. Крайній проліт: d = 5wL⁴/(384EI), M = wL²/8. Звис: d = wL⁴/(8EI), M = wL²/2. w = (A_сталі·7850 + A_отвору·ρ_рідини + m_ізоляції)·9,80665. R = w·(L_ліворуч + L_праворуч)/2 + w·звис. σ = M/Z, Z = 2I/D. Допустимий прогин = проліт / обрана межа. Усі збережені величини — в SI; несучу здатність вводять у кН і зберігають у ньютонах. Лише власна вага: без теплових, фрикційних, вітрових, сейсмічних і динамічних навантажень, без відводів, врізок, арматури й фланців, без перевірки за нормами.',
        'Durchlaufende Stützweite: d = wL⁴/(185EI), M = wL²/10. Endfeld: d = 5wL⁴/(384EI), M = wL²/8. Kragarm: d = wL⁴/(8EI), M = wL²/2. w = (A_Stahl·7850 + A_Bohrung·ρ_Fluid + m_Dämmung)·9,80665. R = w·(L_links + L_rechts)/2 + w·Überstand. σ = M/Z, Z = 2I/D. Zulässige Durchbiegung = Stützweite / gewählter Grenzwert. Alle gespeicherten Werte sind SI; Tragfähigkeiten werden in kN eingegeben und in Newton gespeichert. Nur Eigengewicht: keine Temperatur-, Reibungs-, Wind-, Erdbeben- oder dynamischen Lasten, keine Bögen, Abzweige, Armaturen oder Flanschgewichte, kein Normnachweis.',
        'Doorgaande overspanning: d = wL⁴/(185EI), M = wL²/10. Eindveld: d = 5wL⁴/(384EI), M = wL²/8. Overstek: d = wL⁴/(8EI), M = wL²/2. w = (A_staal·7850 + A_boring·ρ_medium + m_isolatie)·9,80665. R = w·(L_links + L_rechts)/2 + w·overstek. σ = M/Z, Z = 2I/D. Toelaatbare doorbuiging = overspanning / de gekozen grens. Alle opgeslagen waarden zijn SI; draagvermogens worden in kN ingevoerd en in newton opgeslagen. Alleen eigen gewicht: geen thermische, wrijvings-, wind-, seismische of dynamische belasting, geen bochten, aftakkingen, appendages of flensgewichten, geen normtoets.',
        'Portée continue : d = wL⁴/(185EI), M = wL²/10. Portée d’extrémité : d = 5wL⁴/(384EI), M = wL²/8. Porte-à-faux : d = wL⁴/(8EI), M = wL²/2. w = (A_acier·7850 + A_intérieure·ρ_fluide + m_isolation)·9,80665. R = w·(L_gauche + L_droite)/2 + w·porte-à-faux. σ = M/Z, Z = 2I/D. Flèche admissible = portée / la limite choisie. Toutes les valeurs stockées sont en SI ; les capacités se saisissent en kN et se stockent en newtons. Poids propre seul : aucune charge thermique, de frottement, de vent, sismique ou dynamique, ni coudes, piquages, robinets ou brides, et aucune vérification réglementaire.',
        'Vano continuo: d = wL⁴/(185EI), M = wL²/10. Vano extremo: d = 5wL⁴/(384EI), M = wL²/8. Voladizo: d = wL⁴/(8EI), M = wL²/2. w = (A_acero·7850 + A_interior·ρ_fluido + m_aislamiento)·9,80665. R = w·(L_izq + L_der)/2 + w·voladizo. σ = M/Z, Z = 2I/D. Flecha admisible = vano / el límite elegido. Todos los valores almacenados son SI; las capacidades se introducen en kN y se guardan en newtons. Solo peso propio: sin cargas térmicas, de rozamiento, de viento, sísmicas ni dinámicas, sin codos, derivaciones, válvulas ni bridas, y sin comprobación normativa.','Przęsło ciągłe: d = wL⁴/(185EI), M = wL²/10. Przęsło skrajne: d = 5wL⁴/(384EI), M = wL²/8. Wspornik: d = wL⁴/(8EI), M = wL²/2. w = (A_stal·7850 + A_otwór·ρ_płyn + m_izolacja)·9,80665. R = w·(L_lewe + L_prawe)/2 + w·wspornik. σ = M/Z, Z = 2I/D. Ugięcie dopuszczalne = przęsło / wybrana granica. Wszystkie zapisane wartości są w układzie SI; nośności wprowadza się w kN, a zapisuje w niutonach. Tylko ciężar własny: bez obciążeń termicznych, tarcia, wiatru, sejsmicznych ani dynamicznych, bez kolan, odgałęzień, armatury ani mas kołnierzy, i bez sprawdzenia zgodności z przepisami.'),

                 'Естакада вздовж траси. Тягніть — обертання, Shift+тягнення — панорама, колесо — масштаб, тягніть об’єкт, щоб перемістити.',
                 'Die Rohrbrücke in Trassenrichtung. Ziehen dreht, Shift-Ziehen verschiebt, Rad zoomt, ein Objekt ziehen bewegt es.',
                 'De pijpenbrug in de lengterichting. Slepen draait, Shift-slepen verschuift, wiel zoomt, een object slepen verplaatst het.',
                 'Le rack dans l’axe. Glisser fait tourner, Maj+glisser translate, la molette zoome, glisser un objet le déplace.',
                 'El rack en la dirección de la línea. Arrastre para orbitar, Mayús+arrastre para desplazar, rueda para acercar, arrastre un objeto para moverlo.','Estakada widziana wzdłuż trasy. Przeciąganie obraca widok, Shift+przeciąganie przesuwa, kółko powiększa, przeciągnięcie obiektu go przesuwa.'),
      fit: function (size, st) { if (st.sceneStage && st.sceneStage.viewport) st.sceneStage.viewport.frame(); },
      /* The one place this tool owns pixels. diagram-scene3d.js paints every
         object label in a fixed near-white with no option, so on a light page
         the names are white on white. Declaring a render means the Stage stops
         calling sceneStage.draw() for us — so we call it, then re-project the
         same centres with the library's own project() and write the text in
         --ink. Fifteen lines; there is no declarative way to reach it. */
      render: function (size, st) {
        var sc = st.sceneStage, cv = st.cv;
        if (!sc || !sc.viewport || !cv) return;
        sc.draw();
        var v = sc.viewport, ctx = cv.getContext('2d');
        if (!ctx) return;
        var rect = cv.getBoundingClientRect(), es = entities(), i, q;
        ctx.save();
        ctx.font = '12px ' + (token('--font') || 'sans-serif');
        ctx.fillStyle = token('--ink') || DiagramUI.series(7);
        for (i = 0; i < es.length; i++) {
          if (size.density === 'coarse' && es[i].kind !== 'run') continue;
          q = v.project(v.entityCenter(es[i]), rect);
          if (q) ctx.fillText(es[i].text, q.x + 10, q.y - 9);
        }
        ctx.restore();
      },
      a11y: function () {
        var r = last;
        return L(T('Rack scene. ', 'Сцена естакади. ', 'Szene der Rohrbrücke. ', 'Scene van de pijpenbrug. ', 'Scène du rack. ', 'Escena del rack. ','Scena estakady. '))

          + L(T('largest span', 'найбільший проліт', 'größte Stützweite', 'grootste overspanning', 'plus grande portée', 'vano mayor','największe przęsło')) + ' '
          + fmtN(r.span_max, 2) + ' m. '
          + (view.sel ? L(T('Selected', 'Вибрано', 'Ausgewählt', 'Geselecteerd', 'Sélectionné', 'Seleccionado','Wybrano')) + ': ' + view.sel + '.' : '');

          accept: '.json,application/json', as: 'json',
          run: function (data) {

            if (!src || typeof src !== 'object') return;
            var k;
            for (k in DEFAULTS) if (Object.prototype.hasOwnProperty.call(src, k)) state[k] = src[k];
            if (src.supports && !src.sups) state.sups = src.supports;
            view.sel = null;
            last = solve(state);
            refreshAll(); repaint();
          }
        }),
        ui.resetAction()
      ]
    });

    ui.examples([
      { label: T('Two lines on one rack', 'Дві лінії на одній естакаді', 'Zwei Leitungen auf einer Brücke', 'Twee leidingen op één brug', 'Deux lignes sur un rack', 'Dos líneas en un rack','Dwie linie na jednej estakadzie'),
        note: '6" + 8", 24 m', apply: function (t) { var d = DEF(); t.runs = d.runs; t.sups = d.sups; t.rack_L = d.rack_L; t.rack_W = d.rack_W; view.sel = null; } },
      { label: T('One water line, 6 m spans', 'Одна водяна лінія, прольоти 6 м', 'Eine Wasserleitung, 6 m Felder', 'Eén waterleiding, velden van 6 m', 'Une ligne d’eau, portées de 6 m', 'Una línea de agua, vanos de 6 m','Jedna linia wodna, przęsła 6 m'),
        note: '4", L/240', apply: function (t) {
          t.rack_L = 26; t.rack_W = 4; t.defl_limit = 240;
          t.runs = [{ id: 'r1', name: 'Water', x0: 1, x1: 25, y: 2, z: 4.2, D: 0.1143, t: 0.006, rhof: 1000, ins: 0 }];
          t.sups = [];
          for (var i = 0; i < 5; i++) t.sups.push({ id: 's' + (i + 1), run: 'r1', x: 2 + i * 5.5, type: i === 2 ? 'anchor' : 'rest', cap: 12000 });
          view.sel = null;
        } },
      { label: T('One span far too long', 'Один надто довгий проліт', 'Ein viel zu langes Feld', 'Eén veel te lange overspanning', 'Une portée bien trop longue', 'Un vano demasiado largo','Jedno zdecydowanie za długie przęsło'),
        note: '18 m, L/240', apply: function (t) {
          t.rack_L = 24; t.rack_W = 4; t.defl_limit = 240;
          t.runs = [{ id: 'r1', name: 'Steam', x0: 1, x1: 23, y: 2, z: 4.2, D: 0.2191, t: 0.00818, rhof: 20, ins: 14 }];
          t.sups = [{ id: 's1', run: 'r1', x: 3, type: 'anchor', cap: 20000 }, { id: 's2', run: 'r1', x: 21, type: 'rest', cap: 8000 }];
          view.sel = null;
        } }
    ]);

    ui.sync();
    ui.ready();
  }

  function legendItems() {
    return [
      { label: T('Pipe run', 'Ділянка', 'Strang', 'Traject', 'Tronçon', 'Tramo','Odcinek rurociągu'), series: 0, shape: 'line' },
      { label: T('Support within capacity', 'Опора в межах', 'Auflager im Rahmen', 'Ondersteuning binnen grens', 'Support dans sa capacité', 'Soporte dentro de capacidad','Podpora w granicach nośności'), color: 'var(--ok)', shape: 'dot' },
      { label: T('Above 85 %', 'Понад 85 %', 'Über 85 %', 'Boven 85 %', 'Au-delà de 85 %', 'Por encima del 85 %','Powyżej 85 %'), color: 'var(--warn)', shape: 'dot' },
      { label: T('Over capacity', 'Перевантажена', 'Überlastet', 'Overbelast', 'En surcharge', 'Sobrecargado','Przeciążona'), color: 'var(--bad)', shape: 'dot' }
    ];
  }

  /* UPSTREAM. diagram-scene3d.js paints its viewport background from two hard
     hex literals (#111922 / #090c10) and diagram-ui.js copies `viewport.*` by
     value into the CanvasViewport options at build time, so a declared colour
     cannot follow the theme. Two accessors on the options object the library
     already reads once per frame make the 3D view obey `data-theme` like every
     other stage. Remove when the library takes a colour callback. */
  function patchViewport(st) {
    var sc = st && st.sceneStage, v = sc && sc.viewport;
    if (!v || v.__themed) return;
    if (!token('--bg') || !(token('--panel-2') || token('--panel'))) return;   /* no tokens: leave the library's own palette alone */
    try {
      Object.defineProperty(v.options, 'bgNear', { get: function () { return token('--panel-2') || token('--panel'); } });
      Object.defineProperty(v.options, 'bgFar', { get: function () { return token('--bg'); } });
      v.__themed = true;
    } catch (e) { /* an older engine: the scene keeps the library's own palette */ }
  }

  /* the framework-absent path: the only place this file touches `document` */
  function degrade() {
    document.title = 'diagram-ui.js v1 is required';
    var host = document.getElementById('app');
    var h = document.createElement('h1');
    h.textContent = 'Pipe support layout';
    var p = document.createElement('p');
    p.textContent = 'The interactive interface could not load. The record, the export, the '
      + 'limitations and the return link are still available from the bar at the bottom of the page.';
    host.appendChild(h);
    host.appendChild(p);
    last = solve(state);
  }

  function boot() {
    if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1') buildInterface();
    else degrade();
    installData();
  }

  /* ================================================================= 4. RECORD */
  function record() {
    var r = last;
    return {
      inputs: {
        rack_L: state.rack_L, rack_W: state.rack_W, rack_H: state.rack_H,
        E: state.E, defl_limit: state.defl_limit,
        runs: state.runs, supports: state.sups
      },
      outputs: {
        n_runs: r.n_runs, n_supports: r.n_supports, n_spans: r.n_spans,
        length_total: r.length_total, mass_total: r.mass_total,
        span_max: r.span_max, delta_max: r.delta_max, delta_ratio_max: r.delta_ratio_max,
        sigma_max: r.sigma_max, R_max: r.R_max, util_max: r.util_max,
        worst_span: r.worst_span, worst_support: r.worst_support,
        spans: r.spans, supports: r.supports
      },
      units: {
        rack_L: 'm', rack_W: 'm', rack_H: 'm', E: 'Pa', defl_limit: '1 (span divided by this)',
        runs: 'x0,x1,y,z,D,t in m; rhof in kg/m3; ins in kg/m; name and id are text',
        supports: 'x in m; cap in N; type and id are text',
        n_runs: 'count', n_supports: 'count', n_spans: 'count',
        length_total: 'm', mass_total: 'kg',
        span_max: 'm', delta_max: 'm', delta_ratio_max: '1 (deflection over allowable)',
        sigma_max: 'Pa', R_max: 'N', util_max: '1 (reaction over capacity)',
        worst_span: 'text (span id)', worst_support: 'text (support id)',
        spans: 'L, d, allow in m; ratio in 1; M in N m; sigma in Pa; kind, id, run, name are text',
        supports: 'R, cap in N; u in 1; id, run, type are text'
      },
      model: {
        equations: [
          'w = (A_steel*7850 + A_bore*rho_fluid + m_insulation) * 9.80665',
          'continuous span: d = w L^4 / (185 E I), M = w L^2 / 10',
          'end span: d = 5 w L^4 / (384 E I), M = w L^2 / 8',
          'overhang: d = w L^4 / (8 E I), M = w L^2 / 2',
          'R = w (L_left + L_right) / 2 + w * overhang',
          'sigma = M / Z, Z = 2 I / D'
        ],
        ranges: [
          'straight horizontal runs, uniform weight per metre, small deflection',
          'reactions are tributary lengths, not a continuous-beam solution',
          'a guide and an anchor are treated as vertical supports of the capacity given'
        ],
        notes: [
          'no independent validation; no benchmark has been run against this tool',
          'every stored value is SI: capacities are entered in kN and stored in N, diameters typed in mm and stored in m',
          'state also carries snap and z_new, which are authoring aids the model never reads and which are therefore absent from inputs',
          'the current selection is deliberately not part of the state, so a permalink carries the rack and not the cursor',
          'object names are data, not interface: a new run is named in English in every language, so the record and the Python export do not depend on the display language'
        ]
      },
      warnings: r.warnings.slice()
    };
  }

  /* the Python port of the model above, verbatim in the same order */
  var PY = [
    'G = 9.80665',
    'RHO_STEEL = 7850.0',
    '',
    '',
    'def geom(r):',
    '    Do = r["D"]',
    '    Di = r["D"] - 2 * r["t"]',
    '    if not Di > 0:',
    '        Di = 0.0',
    '    As = math.pi / 4 * (Do * Do - Di * Di)',
    '    Ai = math.pi / 4 * (Di * Di)',
    '    I = math.pi / 64 * (Do * Do * Do * Do - Di * Di * Di * Di)',
    '    Z = 2 * I / Do if Do > 0 else 0.0',
    '    m = As * RHO_STEEL + Ai * r["rhof"] + r["ins"]',
    '    return {"I": I, "Z": Z, "m": m, "w": m * G}',
    '',
    '',
    'def span_of(kind, w, Ls, E, I, Z, dlim):',
    '    L4 = Ls * Ls * Ls * Ls',
    '    if kind == "cont":',
    '        d = w * L4 / (185 * E * I)',
    '        M = w * Ls * Ls / 10',
    '    elif kind == "simple":',
    '        d = 5 * w * L4 / (384 * E * I)',
    '        M = w * Ls * Ls / 8',
    '    else:',
    '        d = w * L4 / (8 * E * I)',
    '        M = w * Ls * Ls / 2',
    '    allow = Ls / dlim',
    '    return {"L": Ls, "kind": kind, "d": d, "allow": allow,',
    '            "ratio": (d / allow) if allow > 0 else None,',
    '            "M": M, "sigma": (M / Z) if Z > 0 else None}',
    '',
    '',
    'def compute(runs=None, sups=None, E=None, dlim=None):',
    '    runs = RUNS if runs is None else runs',
    '    sups = SUPPORTS if sups is None else sups',
    '    E = E_MODULUS if E is None else E',
    '    dlim = DEFL_LIMIT if dlim is None else dlim',
    '    spans = []',
    '    supports = []',
    '    warnings = []',
    '    length_total = 0.0',
    '    mass_total = 0.0',
    '    for r in runs:',
    '        g = geom(r)',
    '        Lrun = r["x1"] - r["x0"]',
    '        if not Lrun > 0:',
    '            warnings.append("run %s: the run has zero or negative length" % r["id"])',
    '            Lrun = 0.0',
    '        length_total += Lrun',
    '        mass_total += g["m"] * Lrun',
    '        on = sorted([p for p in sups if p["run"] == r["id"]], key=lambda p: p["x"])',
    '        R = dict((p["id"], 0.0) for p in on)',
    '        if not on:',
    '            warnings.append("run %s: no support at all, so no span and no reaction is computed for it" % r["id"])',
    '        else:',
    '            oL = on[0]["x"] - r["x0"]',
    '            oR = r["x1"] - on[-1]["x"]',
    '            if oL > 0:',
    '                sp = span_of("cant", g["w"], oL, E, g["I"], g["Z"], dlim)',
    '                sp.update({"id": r["id"] + ".A", "run": r["id"], "name": r["name"]})',
    '                spans.append(sp)',
    '                R[on[0]["id"]] += g["w"] * oL',
    '            if oR > 0:',
    '                sp = span_of("cant", g["w"], oR, E, g["I"], g["Z"], dlim)',
    '                sp.update({"id": r["id"] + ".B", "run": r["id"], "name": r["name"]})',
    '                spans.append(sp)',
    '                R[on[-1]["id"]] += g["w"] * oR',
    '            n = len(on) - 1',
    '            for j in range(n):',
    '                Ls = on[j + 1]["x"] - on[j]["x"]',
    '                interior = (n >= 3) and (j > 0) and (j < n - 1)',
    '                sp = span_of("cont" if interior else "simple", g["w"], Ls, E, g["I"], g["Z"], dlim)',
    '                sp.update({"id": r["id"] + "." + str(j + 1), "run": r["id"], "name": r["name"]})',
    '                spans.append(sp)',
    '                R[on[j]["id"]] += g["w"] * Ls / 2',
    '                R[on[j + 1]["id"]] += g["w"] * Ls / 2',
    '            if len(on) == 1:',
    '                warnings.append("run %s: a single support carries the whole run as two cantilevers" % r["id"])',
    '            if not any(p["type"] == "anchor" for p in on):',
    '                warnings.append("run %s: no anchor on the run; axial restraint is outside this model anyway" % r["id"])',
    '        for p in on:',
    '            supports.append({"id": p["id"], "run": r["id"], "type": p["type"], "R": R[p["id"]],',
    '                             "cap": p["cap"], "u": (R[p["id"]] / p["cap"]) if p["cap"] > 0 else None})',
    '    known = set(r["id"] for r in runs)',
    '    for p in sups:',
    '        if p["run"] not in known:',
    '            warnings.append("support %s: it names run %s, which does not exist" % (p["id"], p["run"]))',
    '    out = {"spans": spans, "supports": supports, "n_runs": len(runs), "n_supports": len(sups),',
    '           "n_spans": len(spans), "length_total": length_total, "mass_total": mass_total,',
    '           "span_max": None, "delta_max": None, "delta_ratio_max": None, "sigma_max": None,',
    '           "R_max": None, "util_max": None, "worst_span": None, "worst_support": None}',
    '    for sp in spans:',
    '        if out["span_max"] is None or sp["L"] > out["span_max"]:',
    '            out["span_max"] = sp["L"]',
    '        if out["delta_max"] is None or sp["d"] > out["delta_max"]:',
    '            out["delta_max"] = sp["d"]',
    '        if sp["sigma"] is not None and (out["sigma_max"] is None or sp["sigma"] > out["sigma_max"]):',
    '            out["sigma_max"] = sp["sigma"]',
    '        if sp["ratio"] is not None and (out["delta_ratio_max"] is None or sp["ratio"] > out["delta_ratio_max"]):',
    '            out["delta_ratio_max"] = sp["ratio"]',
    '            out["worst_span"] = sp["id"]',
    '    for su in supports:',
    '        if out["R_max"] is None or su["R"] > out["R_max"]:',
    '            out["R_max"] = su["R"]',
    '        if su["u"] is not None and (out["util_max"] is None or su["u"] > out["util_max"]):',
    '            out["util_max"] = su["u"]',
    '            out["worst_support"] = su["id"]',
    '    out["warnings"] = warnings',
    '    return out',
    '',
    '',
    'E_MODULUS = E',
    ''
  ].join('\n');

  function pythonSpec() {
    return {
      code: PY,
      requires: [],
      basis: { kind: 'reproduce',
               note: 'the same expressions, in the same order, as the page: geom(), span_of() and the same loop over runs and supports',
               deviation: 'none observed; both sides are IEEE-754 doubles evaluating the same expression order' },
      selftest: { tolerance: 1e-12 }
    };
  }

  /* ================================================================= 5. install */
  function installData() {
    if (!window.Diagram) return;
    Diagram.init({
      id: 'pipesupports', file: 'pipesupports.html',
      state: {
        serialize: function () { return state; },
        deserialize: function (o) {
          var k;
          for (k in (o || {})) if (Object.prototype.hasOwnProperty.call(o, k)) state[k] = o[k];
          view.sel = null;
          last = solve(state);
          if (ui) { ui.sync(); ui.run(); repaint(); var sc = sceneOf(); if (sc) sc.refresh('link'); }
        }
      },
      record: record,
      python: pythonSpec,
      handoff: {
        provides: ['D', 'L', 'M', 'I'],
        accepts: ['D', 'rho'],
        build: function () {
          var r = state.runs[0];
          if (!r || !last.n_spans) return null;
          var g = geom(r);
          return { quantities: {
            D: { value: r.D, unit: 'm' },
            L: { value: last.span_max, unit: 'm' },
            M: { value: last.sigma_max === null ? 0 : last.sigma_max * g.Z, unit: 'N m' },
            I: { value: g.I, unit: 'm4' }
          } };
        },
        apply: function (p) {
          var q = (p && p.quantities) || {}, r = state.runs[0];
          if (!r) return;
          if (q.D) r.D = q.D.value;
          if (q.rho) r.rhof = q.rho.value;
          last = solve(state);
          if (ui) { ui.sync(); ui.run(); repaint(); }
        }
      },
      report: {
        sections: function (rec) {
          var l = (window.DiagramUI && DiagramUI.current) ? DiagramUI.current.lang : 'en';
          function P(o) { return DiagramUI.pick(o, l); }
          var out = [];
          var st = stage(), sc = sceneOf(), png = null;
          if (sc && st && st.cv) {
            try { sc.draw(); png = st.cv.toDataURL('image/png'); } catch (e) { png = null; }
          }
          if (png) out.push({
            title: P(T('The rack', 'Естакада', 'Die Rohrbrücke', 'De pijpenbrug', 'Le rack', 'El rack','Estakada')),
            image: { src: png, width: 520,
                     caption: P(T('The scene as it stood when the report was made.', 'Сцена на момент створення звіту.', 'Die Szene zum Zeitpunkt des Berichts.', 'De scene op het moment van het rapport.', 'La scène au moment du rapport.', 'La escena en el momento del informe.','Scena w stanie, w jakim była w chwili sporządzenia raportu.')),
                     alt: P(T('Three-dimensional view of the pipe rack.', 'Тривимірний вигляд естакади.', 'Dreidimensionale Ansicht der Rohrbrücke.', 'Driedimensionaal aanzicht van de pijpenbrug.', 'Vue tridimensionnelle du rack.', 'Vista tridimensional del rack.','Widok trójwymiarowy estakady rurociągów.')) }
          });
          if (last.spans.length) out.push({
            title: P(T('Every span', 'Усі прольоти', 'Alle Stützweiten', 'Alle overspanningen', 'Toutes les portées', 'Todos los vanos','Wszystkie przęsła')),
            head: [P(T('Span', 'Проліт', 'Stützweite', 'Overspanning', 'Portée', 'Vano','Przęsło')), 'm', 'mm (d)', 'mm (max)', 'MPa'],
            rows: last.spans.map(function (sp) {
              return [sp.id, fmtN(sp.L, 2), fmtN(sp.d * 1000, 1), fmtN(sp.allow * 1000, 1), sp.sigma === null ? '—' : fmtN(sp.sigma / 1e6, 1)];
            })
          });
          if (last.supports.length) out.push({
            title: P(T('Every support', 'Усі опори', 'Alle Auflager', 'Alle ondersteuningen', 'Tous les supports', 'Todos los soportes','Wszystkie podpory')),
            head: [P(T('Support', 'Опора', 'Auflager', 'Ondersteuning', 'Support', 'Soporte','Podpora')), P(T('Type', 'Тип', 'Typ', 'Type', 'Type', 'Tipo','Typ')), 'kN', 'kN', '%'],
            rows: last.supports.map(function (su) {
              return [su.id, P(TYPE_LABEL[su.type] || TYPE_LABEL.rest), fmtN(su.R / 1000, 2), fmtN(su.cap / 1000, 1), su.u === null ? '—' : fmtN(su.u * 100, 0)];
            }),
            notes: [P(T('Reactions are tributary lengths; an interior support of a continuous run is roughly 10 % light.',
                        'Реакції за вантажною довжиною; проміжна опора нерозрізної ділянки занижена приблизно на 10 %.',
                        'Auflagerkräfte sind Lasteinzugslängen; ein Innenauflager liegt rund 10 % zu niedrig.',
                        'Reactiekrachten zijn belastingslengten; een tussensteunpunt valt ongeveer 10 % te laag uit.',
                        'Les réactions sont des longueurs d’influence ; un appui intermédiaire est environ 10 % trop faible.',
                        'Las reacciones son longitudes tributarias; un apoyo intermedio queda un 10 % corto.','Reakcje to długości obciążeniowe; podpora wewnętrzna odcinka ciągłego jest zaniżona o około 10 %.'))]
          });
          return out;
        }
      }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
