 for(k in x.vars) if(Object.prototype.hasOwnProperty.call(x.vars,k)) v[k]=x.vars[k];
 if(v.d!=null&&typeof v.d==='number') v.d=fmt(v.d,4,l);
 if(v.gap!=null&&typeof v.gap==='number') v.gap=fmt(v.gap,4,l);
 if(v.c!=null&&typeof v.c==='number') v.c=fmt(v.c,4,l);
 if(v.x!=null&&typeof v.x==='number') v.x=fmt(v.x,4,l);
 if(v.t!=null&&typeof v.t==='number') v.t=fmt(v.t,4,l);
 if(v.w!=null&&typeof v.w==='number') v.w=fmt(v.w,4,l);
 if(v.flag!=null){
  /* the flag word is changeimpact's vocabulary, held once in FLAGWORD */
  var fw=(typeof FLAGWORD!=='undefined'&&FLAGWORD[String(v.flag)])||null;
  v.flag=fw?(fw[l]||fw.en):String(v.flag);
 }
 return v;
}
function targetLabel(x,l){
 var t=x.target; if(!t) return '—';
 if(t.kind==='cell') return t.requirement_id+' × '+t.bidder_id;
 if(t.kind==='bidder') return tx(I18N.colBidder,l)+' '+t.id;
 if(t.kind==='requirement') return t.id||tx(I18N.reqText,l);
 if(t.kind==='selection') return tx(I18N.panelSelection,l);
 if(t.kind==='requisition') return t.id||tx(I18N.requisitionId,l);
 if(t.kind==='bid_evaluation') return t.id||tx(I18N.evalId,l);
 return tx(I18N.panelEvaluation,l);
}
var STATUS_CODE={open:'O',compliant:'C',exceeds:'E',deviation:'D',missing:'M',not_applicable:'N'};
var STATUS_KEY={open:'stOpen',compliant:'stCompliant',exceeds:'stExceeds',deviation:'stDeviation',missing:'stMissing',not_applicable:'stNotApplicable'};
var STATUS_TONE={open:'warn',compliant:'ok',exceeds:'ok',deviation:'warn',missing:'bad',not_applicable:'muted'};

/* ---- working state ---- */
var state=P1();
var selCell={r:0,b:0};
var pkgFlagList=[];

/* pkgLoaded is the runtime's load() result, {package, ignored}; the rules want
   the document itself, and handing them the wrapper made every package rule
   inert while looking as though it had been wired. */
function pkgCtx(){
 var doc=(typeof pkgLoaded!=='undefined'&&pkgLoaded)?pkgLoaded['package']:null;
 return { loaded:!!doc, 'package':doc||null };
}
function effectiveId(){ return trim(state.evaluation.id)||derivedEvaluationId(state.evaluation); }
function cellFor(ri,bi){
 var r=state.requirements[ri], b=state.bidders[bi];
 if(!r||!b) return null;
 var hit=null;
 state.cells.forEach(function(c){ if(!hit&&c.requirement_id===trim(r.id)&&c.bidder_id===trim(b.id)) hit=c; });
 if(!hit){ hit=defaultCell(trim(r.id),trim(b.id)); state.cells.push(hit); }
 return hit;
}
function resyncCellIds(){
 /* Row and bidder identifiers are user-editable; a cell whose pair no longer
    exists is kept in the state and reported by BID-R-009 rather than dropped. */
 return state.cells;
}

/* ---- 4.8 default clarification text ---- */
function draftQuestion(d,l){
 if(d.question) return d.question;
 if(d.kind==='missing_information') return L('tplMissing',{id:d.requirement_id,text:d.requirement_text},l);
 return L('tplDeviation',{id:d.requirement_id,text:d.deviation_text},l);
}

/* ---- permalink state codec ---- */
var ST_ORDER=['open','compliant','exceeds','deviation','missing','not_applicable'];
var ACC_ORDER=['pending','accepted','rejected'];
function compactState(){
 var e=state.evaluation;
 var ri=nmap(), bi=nmap();
 state.requirements.forEach(function(r,i){ ri[trim(r.id)]=i; });
 state.bidders.forEach(function(b,i){ bi[trim(b.id)]=i; });
 var cells=[];
 state.cells.forEach(function(c){
  var i=ri[c.requirement_id], j=bi[c.bidder_id];
  if(i==null||j==null) return;
  var a=[i,j,ST_ORDER.indexOf(c.status),c.deviation_text,c.consequence,ACC_ORDER.indexOf(c.acceptance),
         c.acceptance_basis,c.na_reason,c.note,c.clarification.question,c.clarification.status==='closed'?1:0,c.clarification.answer];
  while(a.length>3&&(a[a.length-1]===''||a[a.length-1]===0)) a.pop();
  if(a.length===3&&a[2]<=0) return;                 /* an untouched open cell carries nothing */
  cells.push(a);
 });
 return { v:1,
  e:[e.id,e.title,e.requisition_id,e.requisition_revision,e.package_id,e.package_name,e.system_id,e.project_name,e.project_reference,e.evaluator,e.evaluation_date],
  s:[state.settings.x_pct,state.settings.threshold_pp],
  t:SCORE_KEYS.map(function(k){ return state.scoring_table[k]; }),
  r:state.requirements.map(function(r){ return [r.id,r.text,r['class']==='desirable'?1:0,r.weight,r.source==='package'?1:0,r.ref]; }),
  b:state.bidders.map(function(b){ return [b.id,b.name,b.offer_ref]; }),
  c:cells,
  x:[state.selection.bidder_id,state.selection.rationale,state.selection.selected_at] };
}
function expandState(o){
 if(!o) return;
 var d=defaultState();
 if(o.v===1){
  var e=o.e||[];
  ['id','title','requisition_id','requisition_revision','package_id','package_name','system_id','project_name','project_reference','evaluator','evaluation_date'].forEach(function(k,i){ d.evaluation[k]=String(e[i]==null?'':e[i]); });
  d.settings.x_pct=Number((o.s||[])[0]); d.settings.threshold_pp=Number((o.s||[])[1]);
  SCORE_KEYS.forEach(function(k,i){ d.scoring_table[k]=Number((o.t||[])[i]); });
  d.requirements=(o.r||[]).map(function(a){ return {id:String(a[0]||''),text:String(a[1]||''),'class':a[2]?'desirable':'mandatory',weight:Number(a[3]),source:a[4]?'package':'local',ref:String(a[5]||'')}; });
  d.bidders=(o.b||[]).map(function(a){ return {id:String(a[0]||''),name:String(a[1]||''),offer_ref:String(a[2]||'')}; });
  d.cells=[];
  (o.c||[]).forEach(function(a){
   var r=d.requirements[a[0]], b=d.bidders[a[1]];
   if(!r||!b) return;
   var c=defaultCell(trim(r.id),trim(b.id));
   c.status=ST_ORDER[a[2]]||'open';
   c.deviation_text=String(a[3]||''); c.consequence=String(a[4]||'');
   c.acceptance=ACC_ORDER[a[5]||0]||'pending';
   c.acceptance_basis=String(a[6]||''); c.na_reason=String(a[7]||''); c.note=String(a[8]||'');
   c.clarification.question=String(a[9]||''); c.clarification.status=a[10]?'closed':'open'; c.clarification.answer=String(a[11]||'');
   d.cells.push(c);
  });
  var x=o.x||[];
  d.selection={bidder_id:String(x[0]||''),rationale:String(x[1]||''),selected_at:String(x[2]||'')};
 } else {
  d=normState(o);
 }
 applyState(d);
}
function applyState(d){
 state.evaluation=d.evaluation; state.settings=d.settings; state.scoring_table=d.scoring_table;
 state.requirements=d.requirements; state.bidders=d.bidders; state.cells=d.cells; state.selection=d.selection;
 selCell={r:0,b:0};
 last=evaluate(state,pkgCtx());
 if(ui){ try{ ui.sync(); ui.run(); }catch(e){} }
 scheduleFigures();
}
function scheduleFigures(){ if(figA) figA.schedule(); if(figB) figB.schedule(); }

/* ---- record ---- */
function record(){
 if(!last) last=evaluate(state,pkgCtx());
 var r=last, s=state;
 var drafts=r.drafts.map(function(d){
  return { draft_id:d.draft_id, bidder_id:d.bidder_id, requirement_id:d.requirement_id, kind:d.kind,
           mandatory:d.mandatory, knock_out_relevant:d.knock_out_relevant,
           question:draftQuestion(d,'en'), status:d.status, answer:d.answer };
 });
 var findings=r.rules.map(function(x){
  return { id:x.id, severity:x.sev, target:targetLabel(x,'en'), message:ruleText(x.id,ruleVars(x,'en'),'en'), basis:ruleBasis(x.id,'en') };
 });
 return {
  inputs:{
   evaluation_id:r.evaluation_id, title:s.evaluation.title,
   requisition_id:s.evaluation.requisition_id, requisition_revision:s.evaluation.requisition_revision,
   package_id:s.evaluation.package_id, system_id:s.evaluation.system_id,
   project:s.evaluation.project_name, project_reference:s.evaluation.project_reference,
   evaluator:s.evaluation.evaluator, evaluation_date:s.evaluation.evaluation_date,
   requirement_rows:s.requirements.length, bidders:s.bidders.length,
   weight_box_pct:s.settings.x_pct, sensitivity_threshold_pp:s.settings.threshold_pp,
   scoring_table:JSON.parse(JSON.stringify(s.scoring_table)),
   commercial_scope:'excluded'
  },
  outputs:{
   verdict:r.verdict, sensitive:r.sensitive, computed:r.computed,
   qualified_bidders:r.Q.length,
   leader:r.leader?r.leader.id:null, margin_pp:r.margin,
   critical_change_pp:r.sens.deltaStar===null?null:100*r.sens.deltaStar,
   critical_requirement_id:r.sens.criticalRow, critical_challenger:r.sens.challenger,
   x_crit_pct:r.stability.xCrit, x_crit_challenger:r.stability.challenger, rank1_stable:r.stability.stable,
   knock_out_final:r.bidders.filter(function(b){return b.knock_out==='final';}).length,
   knock_out_open:r.bidders.filter(function(b){return b.knock_out==='open';}).length,
   open_clarifications:r.drafts.filter(function(d){return d.status==='open';}).length,
   blockers:r.counts.blocker, major:r.counts.major, minor:r.counts.minor, information:r.counts.info,
   bidders:r.bidders.map(function(b){
    return { id:b.id, name:b.name, technical_score_pct:b.score, rank:b.rank, knock_out:b.knock_out,
             knock_out_requirement_ids:b.knock_out_requirement_ids.slice(), provisional:b.provisional,
             open_drafts:b.open_drafts, accepted_deviations:b.accepted_deviations };
   })
  },
  report_context:{ baseline:JSON.parse(JSON.stringify(state)),
                   rows:r.rows.map(function(x){ return {id:x.id,text:x.text,'class':x.cls,weight:x.w,share_pct:100*x.omega}; }),
                   sensitivity_rows:r.sens.rows.map(function(x){
                     return {requirement_id:x.requirement_id,share_pct:100*x.omega,delta_pp:x.delta===null?null:100*x.delta,
                             new_share_pct:x.xstar===null?null:100*x.xstar,challenger:x.challenger,robust:x.robust,na:x.na,raw_weight_change_pct:x.r};
                   }),
                   pairs:r.stability.pairs.slice(), drafts:drafts, findings:findings,
                   matrix:r.rows.map(function(row){
                     return { requirement_id:row.id, cells:r.bidders.map(function(b){
                       var c=r.cellAt(row.id,b.id);
                       return { bidder_id:b.id, status:c?c.status:'open', acceptance:c?c.acceptance:'pending' };
                     })};
                   }) },
  units:{ technical_score_pct:'%', margin_pp:'pp', critical_change_pp:'pp', x_crit_pct:'%' },
  model:{ method:'weighted-sum technical bid evaluation with a knock-out rule on mandatory requirements, exact single-weight criticality and closed-form +/-x weight-box stability',
          equations:['S_b = sum_i (w_i / W) * (100 * s_ib / s_max)',
                     'x*_jk from S_L(x) = S_j(x) with S_b(x) = R_bk + x (a_kb - R_bk), R_bk = (S_b - w_k a_kb)/(1 - w_k)',
                     't_j = sum_i w_i d_i / sum_i w_i |d_i|, d_i = a_iL - a_ij; x_crit = 100 min_j t_j'],
          ranges:[tx(I18N.repRangeBidders,'en'),tx(I18N.repRangeRows,'en'),tx(I18N.repRangePrice,'en')],
          notes:[tx(I18N.repMethodKo,'en'),tx(I18N.repMethodProv,'en'),tx(I18N.repMethodBox,'en')],
          references:['ISO 10845-1:2020 Construction procurement - Part 1: Processes, methods and procedures (process context only)',
                      'Directive 2014/24/EU art. 56(1)(a), 56(3), 67(2), 67(4), 67(5) (context only; this is not a most-economically-advantageous-tender calculation)',
                      'E. Triantaphyllou, A. Sanchez, A sensitivity analysis approach for some deterministic multi-criteria decision-making methods, Decision Sciences 28(1), 1997, 151-194'] },
  warnings:(function(){
   var w=[];
   if(!r.computed) w.push('Input incomplete: '+r.counts.blocker+(r.counts.blocker===1?' blocking finding':' blocking findings')+'; no score computed');
   if(r.sensitive) w.push('Rank 1 is sensitive to the weights');
   r.bidders.forEach(function(b){ if(b.provisional&&b.knock_out==='none') w.push('Provisional score for bidder '+b.id); });
   return w;
  })()
 };
}

/* ---- figures ----
   Both are drawn by the same functions for the screen stage and for the report,
   so the printed sheet cannot disagree with the page. */
function themeTokens(){
 var cs=getComputedStyle(document.documentElement);
 function g(n,f){ var v=cs.getPropertyValue(n); v=v&&v.trim(); return v||f; }
 return { ink:g('--ink','#111'), muted:g('--muted','#6b7280'), line:g('--line','#d1d5db'),
          card:g('--card','#fff'), bad:g('--bad','#b91c1c'), font:g('--font','sans-serif') };
}
function seriesColour(i){
 try{ if(window.DiagramUI&&typeof DiagramUI.series==='function') return DiagramUI.series(i); }catch(e){}
 return ['#2563eb','#b45309','#047857','#7c3aed','#be123c','#0e7490','#4d7c0f','#a21caf'][i%8];
}
function hatch(ctx,x,y,w,h,colour){
 ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
 ctx.strokeStyle=colour; ctx.lineWidth=1; ctx.globalAlpha=0.55;
 for(var t=-h;t<w+h;t+=6){ ctx.beginPath(); ctx.moveTo(x+t,y+h); ctx.lineTo(x+t+h,y); ctx.stroke(); }
 ctx.restore();
}
/* F1 - where each bidder's score comes from */
function drawContrib(size,ctx){
 var th=themeTokens(), w=size.w, h=size.h, coarse=size.w<520;
 ctx.clearRect(0,0,w,h);
 var r=last; if(!r||!r.computed||!r.bidders.length) return;
 var padL=coarse?30:44, padR=coarse?14:70, padT=14, padB=44;
 var plotW=Math.max(20,w-padL-padR), n=r.bidders.length;
 var avail=Math.max(30,h-padT-padB), slot=avail/n;
 var band=Math.max(8,Math.min(38,slot*0.7));
 ctx.font='12px '+th.font; ctx.textBaseline='middle';
 var ticks=coarse?[0,50,100]:[0,20,40,60,80,100];
 ctx.strokeStyle=th.line; ctx.lineWidth=1;
 ticks.forEach(function(t){
  var x=padL+plotW*t/100;
  ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,padT+avail); ctx.stroke();
  ctx.fillStyle=th.muted; ctx.textAlign='center'; ctx.fillText(String(t),x,padT+avail+14);
 });
 ctx.fillStyle=th.muted; ctx.textAlign='center';
 ctx.fillText(tx(I18N.axisScore),padL+plotW/2,padT+avail+32);
 r.bidders.forEach(function(b,bi){
  var y=padT+bi*slot+(slot-band)/2, x=padL, ko=b.knock_out!=='none';
  ctx.fillStyle=th.ink; ctx.textAlign='right'; ctx.font='12px '+th.font;
  ctx.fillText(b.id,padL-6,y+band/2);
  b.contributions.forEach(function(c,i){
   var seg=plotW*c.value/100; if(seg<=0) return;
   var cls=r.rows[i].cls;
   ctx.globalAlpha=(i%2)?0.62:1;
   ctx.fillStyle=seriesColour(cls==='mandatory'?0:2);
   ctx.fillRect(x,y,seg,band);
   ctx.globalAlpha=1;
   ctx.strokeStyle=th.card; ctx.lineWidth=1;
   ctx.beginPath(); ctx.moveTo(x+seg,y); ctx.lineTo(x+seg,y+band); ctx.stroke();
   x+=seg;
  });
  if(ko) hatch(ctx,padL,y,x-padL,band,th.bad);
  ctx.strokeStyle=th.line; ctx.lineWidth=1; ctx.strokeRect(padL,y,Math.max(0,x-padL),band);
  var label=fmt(b.score,1)+' %'+(ko?' \u00b7 '+tx(I18N.notRanked):'');
  ctx.font='12px '+th.font;
  if(coarse){ ctx.textAlign='left'; ctx.fillStyle=th.muted; ctx.fillText(label,padL+4,y+band/2); }
  else { ctx.textAlign='left'; ctx.fillStyle=ko?th.bad:th.ink; ctx.fillText(label,Math.min(x+6,w-4),y+band/2); }
 });
}
/* F2 — score against the weight of the critical requirement */
function drawWeight(size,ctx){
 var th=themeTokens(), w=size.w, h=size.h, coarse=size.w<520;
 ctx.clearRect(0,0,w,h);
 var r=last;
 ctx.font='12px '+th.font; ctx.textBaseline='middle'; ctx.textAlign='center';
 if(!r||!r.computed||!r.leader||r.Q.length<2||!r.sens.criticalRow){
  ctx.fillStyle=th.muted; ctx.fillText(tx(I18N.figNoSens),w/2,h/2); return;
 }
 var k=-1; r.rows.forEach(function(row,i){ if(row.id===r.sens.criticalRow) k=i; });
 if(k<0){ ctx.fillStyle=th.muted; ctx.fillText(tx(I18N.figNoSens),w/2,h/2); return; }
 var padL=coarse?40:56, padR=coarse?14:70, padT=16, padB=44;
 var plotW=Math.max(20,w-padL-padR), plotH=Math.max(20,h-padT-padB);
 var wk=r.rows[k].omega;
 var lines=r.Q.map(function(b,i){
  var Rbk=(b.score-wk*b.contributions[k].a)/(1-wk), ak=b.contributions[k].a;
  return { id:b.id, R:Rbk, a:ak, colour:seriesColour(i), leader:b.id===r.leader.id };
 });
 var lo=0, hi=100;
 function X(x){ return padL+plotW*x; }
 function Y(s){ return padT+plotH*(1-(s-lo)/(hi-lo)); }
 ctx.strokeStyle=th.line; ctx.lineWidth=1;
 var yt=coarse?[0,50,100]:[0,20,40,60,80,100];
 yt.forEach(function(t){ ctx.beginPath(); ctx.moveTo(padL,Y(t)); ctx.lineTo(padL+plotW,Y(t)); ctx.stroke();
   ctx.fillStyle=th.muted; ctx.textAlign='right'; ctx.fillText(String(t),padL-6,Y(t)); });
 var xt=coarse?[0,50,100]:[0,25,50,75,100];
 xt.forEach(function(t){ ctx.fillStyle=th.muted; ctx.textAlign='center'; ctx.fillText(String(t),X(t/100),padT+plotH+16); });
 ctx.fillStyle=th.muted; ctx.textAlign='center';
 ctx.fillText(L('axisWeight',{row:r.sens.criticalRow}),padL+plotW/2,padT+plotH+34);
 ctx.save(); ctx.translate(12,padT+plotH/2); ctx.rotate(-Math.PI/2);
 ctx.fillStyle=th.muted; ctx.textAlign='center'; ctx.fillText(tx(I18N.axisScore),0,0); ctx.restore();
 /* the present weight */
 ctx.strokeStyle=th.muted; ctx.setLineDash([4,3]);
 ctx.beginPath(); ctx.moveTo(X(wk),padT); ctx.lineTo(X(wk),padT+plotH); ctx.stroke(); ctx.setLineDash([]);
 lines.forEach(function(ln){
  ctx.strokeStyle=ln.colour; ctx.lineWidth=ln.leader?2.4:1.5;
  ctx.beginPath(); ctx.moveTo(X(0),Y(ln.R)); ctx.lineTo(X(1),Y(ln.a)); ctx.stroke();
 });
 /* two bidders that end on the same score would print one identifier over the
    other, so the end labels are pushed apart before they are drawn */
 var ends=lines.map(function(ln,i){ return {i:i,y:Math.max(padT+6,Math.min(padT+plotH-6,Y(ln.a)))}; })
   .sort(function(a,b){ return a.y-b.y; });
 for(var q=1;q<ends.length;q++) if(ends[q].y-ends[q-1].y<13) ends[q].y=ends[q-1].y+13;
 ends.forEach(function(e){
  var ln=lines[e.i];
  ctx.fillStyle=ln.colour; ctx.textAlign=coarse?'right':'left';
  ctx.fillText(ln.id,coarse?padL+plotW-2:padL+plotW+6,Math.min(e.y,padT+plotH));
 });
 var row=null; r.sens.rows.forEach(function(x){ if(x.requirement_id===r.sens.criticalRow) row=x; });
 if(row&&row.xstar!=null){
  var LL=null; lines.forEach(function(x){ if(x.leader) LL=x; });
  var sy=LL.R+row.xstar*(LL.a-LL.R);
  ctx.fillStyle=th.bad; ctx.beginPath(); ctx.arc(X(row.xstar),Y(sy),4.5,0,2*Math.PI); ctx.fill();
  ctx.textAlign=row.xstar>0.7?'right':'left';
  ctx.fillText((row.delta>=0?'+':'−')+fmt(Math.abs(100*row.delta),2)+' pp',X(row.xstar)+(row.xstar>0.7?-8:8),Y(sy)-10);
 }
 ctx.strokeStyle=th.line; ctx.strokeRect(padL,padT,plotW,plotH);
}
function figureFor(draw,w,h,capKey,altKey,ctx2){
 if(!ctx2||typeof ctx2.figure!=='function') return null;
 try{
  var scale=2, cv=document.createElement('canvas');
  cv.width=w*scale; cv.height=h*scale;
  var c=cv.getContext('2d'); c.setTransform(scale,0,0,scale,0,0);
  var th=themeTokens(); c.fillStyle=th.card; c.fillRect(0,0,w,h);
  draw({w:w,h:h},c);
  return ctx2.figure(cv,{caption:tx(I18N[capKey],ctx2.domainLang||lang),alt:tx(I18N[altKey],ctx2.domainLang||lang)});
 }catch(e){ return null; }
}

/* ---- report profile (AGENTS 2.2.1) ---- */
function reportProfile(rec,ctx){
 var dl=(ctx&&ctx.domainLang)||lang;
 function R(k,v){ return L(k,v||{},dl); }
 function row(label,value,unit,note){ return {label:label,value:value,unit:unit||'',note:note||''}; }
 function txt(label,text,note){ return {label:label,text:text,note:note||''}; }
 var o=rec.outputs||{}, inp=rec.inputs||{}, rc=rec.report_context||{};
 var r=last||evaluate(state,pkgCtx());
 var ko=(o.knock_out_final||0)+' / '+(o.knock_out_open||0);
 var verdictText=verdictWord(r,dl);

 var tiles=[
  txt(R('tileVerdict'),verdictText),
  txt(R('tileLeader'),r.leader?(r.leader.id+' · '+fmt(r.leader.score,2,dl)+' %'):R('naWord')),
  /* AGENTS §2.2.1: the sheet prints what the interface prints. The report grid
     formats through reportValue(), which reads no precision, so the four
     decimals of the on-screen tile are rendered here as text. */
  r.margin===null?row(R('tileMargin'),null,'pp'):txt(R('tileMargin'),fmt(r.margin,4,dl)+' pp'),
  txt(R('tileCritical'),r.sens.criticalRow
      ?((r.sens.deltaStar>=0?'+':'−')+fmt(Math.abs(100*r.sens.deltaStar),4,dl)+' pp · '+r.sens.criticalRow)
      :((r.leader&&r.Q.length>=2&&r.sens.deltaStar===null)?R('robustWord')
        :(r.sens.deltaStar===null?R('naWord')
          :(r.sens.deltaStar>=0?'+':'−')+fmt(Math.abs(100*r.sens.deltaStar),4,dl)+' pp'))),

 ];

 var results=r.bidders.map(function(b){

 });

 var decisions=[];

 }

 var checks=[];
 r.rules.filter(function(x){ return x.sev==='blocker'||x.sev==='major'; }).slice(0,60).forEach(function(x){

 });

 var questions=r.drafts.filter(function(d){ return d.status==='open'; }).map(function(d){

 });

 var inputs=[];
 inputs.push({label:R('xPct'),value:r.state.settings.x_pct,unit:'%',group:R('repInpSettings')});
 inputs.push({label:R('thresholdPp'),value:r.state.settings.threshold_pp,unit:'pp',group:R('repInpSettings')});
 SCORE_KEYS.forEach(function(k,i){

 r.state.requirements.forEach(function(q,i){

 });
 r.state.bidders.forEach(function(b){

 });

 var figs=[];
 var f1=figureFor(drawContrib,760,Math.max(150,70+40*Math.max(1,r.bidders.length)),'figContrib','figContribAlt',ctx);
 if(f1) figs.push(f1);
 var f2=figureFor(drawWeight,760,380,'figWeight','figWeightAlt',ctx);

 return {

function pythonSource(d){
 var manifest=(function(){ try{ return JSON.parse(document.getElementById('diagram-tool-manifest').textContent); }catch(e){ return {}; } })();
 var permalink='';
 try{ permalink=(window.Diagram&&Diagram.state&&Diagram.state.link)?Diagram.state.link():location.href; }catch(e){ permalink=''; }
 var lim=''; try{ lim=(manifest.limitations&&(manifest.limitations.en||''))||''; }catch(e){}
 /* Python literals, not JSON: the file is executed by python3, where true,
    false and null are names and True, False and None are the values. */
 var J=function(x){ return pyLit(x,1); };
 var head=[
  '#!/usr/bin/env python3',
  '# -*- coding: utf-8 -*-',
  '"""Technical bid evaluation - score, knock-out, rank and weight sensitivity.',
  '',
  'Source      : https://tools.petrov.re/bidevaluation.html',
  'Manifest    : '+(manifest.manifest_revision||''),
  'Exported    : '+new Date().toISOString().replace(/\.\d{3}Z$/,'Z'),
  'Permalink   : '+permalink,
  '',
  'Reproduced  : cell scores (4.2), technical score (4.3), knock-out, qualified set',
  '              and rank (4.4), the exact single-weight critical change (4.5) and the',
  '              closed-form rank-1 stability inside the +/-x weight box (4.6).',
  'Not         : the rule findings and their texts, the headline verdict, the project',
  'reproduced    package mapping and the localised clarification templates. Those stay',
  '              in the page.',
  'Commercial  : out of scope. No price, life-cycle cost or payment term enters this',
  '              script, and the score it prints must not be combined with one.',
  '',
  'Equations',
  '  a_ib = 100 * s_ib / s_max                                        (4.2)',
  '  S_b  = sum_i (w_i / W) * a_ib                                    (4.3)',
  '  R_bk = (S_b - omega_k * a_kb) / (1 - omega_k)                    (4.5)',
  '  S_b(x) = R_bk + x * (a_kb - R_bk); crossing at x* = -D0 / D1     (4.5)',
  '  t_j  = sum_i w_i d_i / sum_i w_i |d_i|, d_i = a_iL - a_ij        (4.6)',
  '  x_crit = 100 * min_j t_j',
  '',
  'Validity: 2 to 10 bidders, 1 to 150 requirement rows, weights >= 0 with a positive',
  'sum, scoring-table values in 0..10 not all zero.',
  '',
  'Limitations of the model this script reproduces:',
  wrap(lim,78,'  '),
  '',
  'Dependencies: none. Standard library only.',
  '"""',
  '',
  'import itertools',
  'import json',
  '',
  'EPS = 1e-9          # score-equality tolerance, percentage points',
  'LIN = 1e-12         # slope and interior-crossing tolerance of section 4.5',
  '',
  '# ---------------------------------------------------------------- inputs',
  'TABLE = '+J(d.scoring_table),
  'ROWS = '+J(d.requirements)+'   # id, class, raw weight (dimensionless)',
  'BIDDER_IDS = '+J(d.bidders),
  '# cells[bidder][requirement] = [status, acceptance, clarification status]',
  'CELLS = '+J(d.cells),
  'X_PCT = '+d.x_pct+'              # weight box half-width, percent',
  'THRESHOLD_PP = '+d.threshold_pp+'       # reporting threshold, percentage points',
  '',
  'NAMES = '+J(d.names)+'        # bidder display names, carried for the record shape',
  'X_CRIT_CHALLENGER = '+J(d.x_crit_challenger)+'   # the challenger the +/-x bound belongs to',
  '',
  '# what the page showed at export time, under this script\'s own names',
  'PAGE_VALUES = '+J(d.displayed),
  ''
 ].join('\n');

 var body=[
  '# ------------------------------------------------------------- 4.2 cell score',
  'SCORE_KEYS = ["exceeds", "compliant", "deviation_accepted", "deviation_rejected",',
  '              "missing", "not_applicable"]',
  '',
  '',
  'def score_key(status, acceptance):',
  '    """The scoring-table key one cell uses. An unclassified answer scores as',
  '    missing information and a pending deviation as a rejected one; both are',
  '    provisional and the page marks the bidder so."""',
  '    if status == "exceeds":',
  '        return "exceeds"',
  '    if status == "compliant":',
  '        return "compliant"',
  '    if status == "not_applicable":',
  '        return "not_applicable"',
  '    if status == "deviation":',
  '        return "deviation_accepted" if acceptance == "accepted" else "deviation_rejected"',
  '    return "missing"',
  '',
  '',
  'def normalised_cell_scores():',
  '    """a[bidder][row index], each 100 * s / s_max."""',
  '    s_max = max(TABLE[k] for k in SCORE_KEYS)',
  '    a = {}',
  '    for b in BIDDER_IDS:',
  '        a[b] = []',
  '        for req in ROWS:',
  '            st, acc, _cl = CELLS[b][req["id"]]',
  '            s = TABLE[score_key(st, acc)]',
  '            a[b].append(100.0 * s / s_max)',
  '    return a',
  '',
  '',
  '# ---------------------------------------------------------- 4.3 technical score',
  'def technical_scores(a):',
  '    W = sum(r["weight"] for r in ROWS)',
  '    out = {}',
  '    for b in BIDDER_IDS:',
  '        total = 0.0',
  '        for i, r in enumerate(ROWS):',
  '            total += (r["weight"] / W) * a[b][i]',
  '        out[b] = total',
  '    return out',
  '',
  '',
  '# --------------------------------------------- 4.4 knock-out, qualified set, rank',
  'def knock_outs():',
  '    """A rejected deviation on a mandatory row is final; missing information, an',
  '    unclassified answer or a pending deviation on a mandatory row is open."""',
  '    out = {}',
  '    for b in BIDDER_IDS:',
  '        final, opened = [], []',
  '        for r in ROWS:',
  '            if r["cls"] != "mandatory":',
  '                continue',
  '            st, acc, _cl = CELLS[b][r["id"]]',
  '            if st == "deviation" and acc == "rejected":',
  '                final.append(r["id"])',
  '            elif st in ("missing", "open") or (st == "deviation" and acc == "pending"):',
  '                opened.append(r["id"])',
  '        if final:',
  '            out[b] = ("final", final)',
  '        elif opened:',
  '            out[b] = ("open", opened)',
  '        else:',
  '            out[b] = ("none", [])',
  '    return out',
  '',
  '',
  'def provisional_flags():',
  '    out = {}',
  '    for b in BIDDER_IDS:',
  '        flag = False',
  '        for r in ROWS:',
  '            st, acc, _cl = CELLS[b][r["id"]]',
  '            if st == "open" or (st == "deviation" and acc == "pending"):',
  '                flag = True',
  '        out[b] = flag',
  '    return out',
  '',
  '',
  'def open_draft_counts():',
  '    """4.8: one draft per missing answer and per pending deviation, counted while',
  '    its clarification is open."""',
  '    out = {}',
  '    for b in BIDDER_IDS:',
  '        n = 0',
  '        for r in ROWS:',
  '            st, acc, cl = CELLS[b][r["id"]]',
  '            kind = None',
  '            if st == "missing":',
  '                kind = "missing_information"',
  '            elif st == "deviation" and acc == "pending":',
  '                kind = "deviation_acceptance"',
  '            if kind and cl == "open":',
  '                n += 1',
  '        out[b] = n',
  '    return out',
  '',
  '',
  'def ranks(scores, ko):',
  '    q = [b for b in BIDDER_IDS if ko[b][0] == "none"]',
  '    out = {b: None for b in BIDDER_IDS}',
  '    for b in q:',
  '        out[b] = 1 + sum(1 for x in q if scores[x] > scores[b] + EPS)',
  '    return q, out',
  '',
  '',
  '# ------------------------------------- 4.5 single-weight change that alters rank 1',
  'def single_weight_table(a, scores, q, rank):',
  '    """One weight moves to x, the others keep their ratios. Every score is then',
  '    linear in x, so the nearest interior crossing of the leader line with a',
  '    challenger line is where rank 1 changes owner."""',
  '    leaders = [b for b in q if rank[b] == 1]',
  '    W = sum(r["weight"] for r in ROWS)',
  '    rows = []',
  '    if len(q) < 2 or len(leaders) != 1:',
  '        # 4.5: a tie at the top is already at the crossing, so the change is zero',
  '        tied = len(q) >= 2 and len(leaders) >= 2',
  '        return rows, None, (0.0 if tied else None), None',
  '    leader = leaders[0]',
  '    challengers = [b for b in q if b != leader]',
  '    best = None',
  '    for k, r in enumerate(ROWS):',
  '        wk = r["weight"] / W',
  '        entry = {"requirement_id": r["id"], "omega": wk, "delta": None, "xstar": None,',
  '                 "challenger": None, "robust": True, "raw_change_pct": None, "na": False}',
  '        if wk >= 1 - LIN:',
  '            entry["na"] = True',
  '            entry["robust"] = False',
  '            rows.append(entry)',
  '            continue',
  '        RL = (scores[leader] - wk * a[leader][k]) / (1 - wk)',
  '        pick = None',
  '        for j in challengers:',
  '            RJ = (scores[j] - wk * a[j][k]) / (1 - wk)',
  '            D0 = RL - RJ',
  '            D1 = (a[leader][k] - RL) - (a[j][k] - RJ)',
  '            if abs(D1) <= LIN:',
  '                continue',
  '            x = -D0 / D1',
  '            if not (LIN < x < 1 - LIN):',
  '                continue',
  '            dist = abs(x - wk)',
  '            if pick is None or dist < pick[0] - 1e-15:',
  '                pick = (dist, x, j)',
  '        if pick is not None:',
  '            _dist, x, j = pick',
  '            entry["robust"] = False',
  '            entry["xstar"] = x',
  '            entry["delta"] = x - wk',
  '            entry["challenger"] = j',
  '            if wk != 0:',
  '                entry["raw_change_pct"] = 100.0 * (x * (1 - wk) / ((1 - x) * wk) - 1)',
  '            if best is None or abs(entry["delta"]) < abs(best["delta"]) - 1e-15:',
  '                best = entry',
  '        rows.append(entry)',
  '    if best is None:',
  '        return rows, leader, None, None',
  '    return rows, leader, best["delta"], best',
  '',
  '',
  '# -------------------------------------------- 4.6 rank-1 stability inside +/-x %',
  'def pair_t(a, p, z):',
  '    """Closed form of min over the weight box of sum_i w_i (a_ip - a_iz)."""',
  '    num = 0.0',
  '    den = 0.0',
  '    for i, r in enumerate(ROWS):',
  '        d = a[p][i] - a[z][i]',
  '        num += r["weight"] * d',
  '        den += r["weight"] * abs(d)',
  '    t = 1.0 if den <= 0 else num / den',
  '    return min(1.0, max(0.0, t))',
  '',
  '',
  'def vertex_min(a, p, z, x):',
  '    """The same minimum by explicit enumeration of all 2**n box vertices. Used by',
  '    the self-test; the closed form above is what compute() reports."""',
  '    n = len(ROWS)',
  '    best = None',
  '    for signs in itertools.product((1 - x, 1 + x), repeat=n):',
  '        total = 0.0',
  '        for i, r in enumerate(ROWS):',
  '            total += r["weight"] * signs[i] * (a[p][i] - a[z][i])',
  '        if best is None or total < best:',
  '            best = total',
  '    return best',
  '',
  '',
  'def stability(a, scores, q, rank):',
  '    leaders = [b for b in q if rank[b] == 1]',
  '    pairs = []',
  '    for p in q:',
  '        for z in q:',
  '            if p == z or not scores[p] > scores[z] + EPS:',
  '                continue',
  '            t = pair_t(a, p, z)',
  '            pairs.append({"p": p, "q": z, "t_pct": 100.0 * t,',
  '                          "reversible": X_PCT > 100.0 * t})',
  '    if len(q) < 2 or len(leaders) != 1:',
  '        x_crit = 0.0 if (len(q) >= 2 and len(leaders) >= 2) else None',
  '        stable = None if x_crit is None else (X_PCT <= x_crit)',
  '        return x_crit, None, stable, pairs',
  '    leader = leaders[0]',
  '    best_t, best_j = None, None',
  '    for j in q:',
  '        if j == leader:',
  '            continue',
  '        t = pair_t(a, leader, j)',
  '        if best_t is None or t < best_t:',
  '            best_t, best_j = t, j',
  '    x_crit = 100.0 * best_t',
  '    return x_crit, best_j, X_PCT <= x_crit, pairs',
  '',
  '',
  '# ---------------------------------------------------------------- the result',
  'def evaluate_all():',
  '    a = normalised_cell_scores()',
  '    scores = technical_scores(a)',
  '    ko = knock_outs()',
  '    prov = provisional_flags()',
  '    drafts = open_draft_counts()',
  '    q, rank = ranks(scores, ko)',
  '    rows, leader, delta_star, best = single_weight_table(a, scores, q, rank)',
  '    x_crit, x_chal, stable, pairs = stability(a, scores, q, rank)',
  '    ordered = sorted((scores[b] for b in q), reverse=True)',
  '    # 4.4: the margin is written against the leader L, which exists only',
  '    # when the rank-1 set is a single bidder, so a tie leaves it undefined.',
  '    margin = (ordered[0] - ordered[1]) if (len(ordered) >= 2 and leader is not None) else None',
  '    out = {}',
  '    for b in BIDDER_IDS:',
  '        out["score_pct_" + b] = scores[b]',
  '        out["rank_" + b] = rank[b]',
  '        out["knock_out_" + b] = ko[b][0]',
  '        out["provisional_" + b] = prov[b]',
  '        out["open_drafts_" + b] = drafts[b]',
  '    out["leader"] = leader',
  '    out["margin_pp"] = margin',
  '    out["critical_change_pp"] = None if delta_star is None else 100.0 * delta_star',
  '    out["critical_requirement_id"] = None if best is None else best["requirement_id"]',
  '    out["critical_challenger"] = None if best is None else best["challenger"]',
  '    out["x_crit_pct"] = x_crit',
  '    out["rank1_stable"] = stable',
  '    for entry in rows:',
  '        rid = entry["requirement_id"]',
  '        out["delta_pp_" + rid] = None if entry["delta"] is None else 100.0 * entry["delta"]',
  '        out["challenger_" + rid] = entry["challenger"]',
  '    for pr in pairs:',
  '        out["t_pct_" + pr["p"] + "_" + pr["q"]] = pr["t_pct"]',
  '    return out, a, scores, q, rank, rows, pairs',
  '',
  '',
  'def compute():',
  '    """The outputs under the names the tool\'s record uses, for the generated',
  '    comparison below. evaluate_all() above is the same run with the working',
  '    structures kept."""',
  '    out, a, scores, q, rank, rows, pairs = evaluate_all()',
  '    ko = knock_outs()',
  '    prov = provisional_flags()',
  '    drafts = open_draft_counts()',
  '    accepted = {}',
  '    for b in BIDDER_IDS:',
  '        n = 0',
  '        for r in ROWS:',
  '            st, acc, _cl = CELLS[b][r["id"]]',
  '            if st == "deviation" and acc == "accepted":',
  '                n += 1',
  '        accepted[b] = n',
  '    return {',
  '        "qualified_bidders": len(q),',
  '        "leader": out["leader"],',
  '        "margin_pp": out["margin_pp"],',
  '        "critical_change_pp": out["critical_change_pp"],',
  '        "critical_requirement_id": out["critical_requirement_id"],',
  '        "critical_challenger": out["critical_challenger"],',
  '        "x_crit_pct": out["x_crit_pct"],',
  '        "x_crit_challenger": X_CRIT_CHALLENGER,',
  '        "rank1_stable": out["rank1_stable"],',
  '        "knock_out_final": sum(1 for b in BIDDER_IDS if ko[b][0] == "final"),',
  '        "knock_out_open": sum(1 for b in BIDDER_IDS if ko[b][0] == "open"),',
  '        "open_clarifications": sum(drafts[b] for b in BIDDER_IDS),',
  '        "bidders": [{"id": b, "name": NAMES.get(b, ""),',
  '                     "technical_score_pct": scores[b], "rank": rank[b],',
  '                     "knock_out": ko[b][0],',
  '                     "knock_out_requirement_ids": ko[b][1],',
  '                     "provisional": prov[b], "open_drafts": drafts[b],',
  '                     "accepted_deviations": accepted[b]} for b in BIDDER_IDS],',
  '    }',
  '',
  '',
  '# ------------------------------------------------------------------ self-test',
  'TOL = 1e-9',
  '',
  '',
  'def check_against_page(out):',
  '    problems = []',
  '    for key, ref in PAGE_VALUES.items():',
  '        if key not in out:',
  '            problems.append("%s: not produced by this script" % key)',
  '            continue',
  '        got = out[key]',
  '        if isinstance(ref, bool) or isinstance(got, bool) or ref is None or got is None:',
  '            if got != ref:',
  '                problems.append("%s: %r against %r" % (key, got, ref))',
  '        elif isinstance(ref, (int, float)) and isinstance(got, (int, float)):',
  '            if abs(got - ref) > TOL:',
  '                problems.append("%s: %.12g against %.12g" % (key, got, ref))',
  '        elif got != ref:',
  '            problems.append("%s: %r against %r" % (key, got, ref))',
  '    return problems',
  '',
  '',
  'def check_vertices(a, q, rank):',
  '    """(a) of section 12: the closed-form box minimum equals explicit enumeration',
  '    of all 2**n vertices. Skipped above 12 rows, where 2**n stops being cheap."""',
  '    n = len(ROWS)',
  '    if n > 12:',
  '        return ["vertex enumeration skipped: %d rows, 2**%d vertices" % (n, n)], 0',
  '    x = X_PCT / 100.0',
  '    problems, done = [], 0',
  '    for p in q:',
  '        for z in q:',
  '            if p == z:',
  '                continue',
  '            closed = 0.0',
  '            for i, r in enumerate(ROWS):',
  '                d = a[p][i] - a[z][i]',
  '                closed += r["weight"] * d',
  '            for i, r in enumerate(ROWS):',
  '                closed -= x * r["weight"] * abs(a[p][i] - a[z][i])',
  '            brute = vertex_min(a, p, z, x)',
  '            done += 1',
  '            if abs(closed - brute) > 1e-9 * max(1.0, abs(brute)):',
  '                problems.append("box minimum %s>%s: %.12g against %.12g"',
  '                                % (p, z, closed, brute))',
  '    return problems, done',
  '',
  '',
  '# Values printed by Triantaphyllou and Sanchez (1997), Decision Sciences 28(1),',
  '# 151-194: the preference values of their Table 3, two decision-matrix entries of',
  '# Table 2 in criterion C3, the criterion weights W1 and W3 implied by their',
  '# Tables 4 and 5, and three Table 4 entries. Table 2 itself is not available to',
  '# this script, so what is checked is relation (8a) against the paper\'s own',
  '# printed numbers, not a re-derivation of the whole table.',
  'TS_P = [0.3162, 0.2768, 0.2621, 0.1449]        # Table 3 preference values',
  'TS_A23_C3 = 0.1755                             # Table 2, alternative A2, criterion C3',
  'TS_A33_C3 = 0.1194                             # Table 2, alternative A3, criterion C3',
  'TS_W1 = 0.3277                                 # criterion weight W1',
  'TS_W3 = 0.0262 / 0.091099                      # W3 from Table 4 / Table 5 of the paper',
  'TS_D_A1A2_C3 = 0.1866                          # Table 4, pair A1-A2, criterion C3',
  'TS_D_A1A3_C3 = 0.2024                          # Table 4, pair A1-A3, criterion C3',
  'TS_D_A1A3_C1 = -0.3807                         # Table 4, pair A1-A3, criterion C1',
  '',
  '',
  'def check_literature(rows):',
  '    """(b) of section 12. Three independent points:',
  '',
  '    1. Two Table 4 entries in column C3, combined with the two printed Table 2',
  '       entries and the printed preference values, imply the same missing matrix',
  '       entry a(A1,C3) through relation (8a). Agreement to 1e-4 is the check.',
  '    2. The A2-A3 entry of column C3 recomputes to 0.2620 and 91.11 percent from',
  '       the paper\'s own numbers, against the 0.0262 and 9.1099 percent it prints:',
  '       a dropped digit, recorded here and not re-graded.',
  '    3. The conversion this tool uses, x* = (W_k - delta) / (1 - delta), turns the',
  '       printed A1-A3/C1 entry into a new normalised weight of 0.5131.',
  '',
  '    Finally the relative form of relation (6) is checked against this page\'s own',
  '    raw-weight parametrisation: r_k = -delta\'_k for every row with a crossing."""',
  '    problems, notes = [], []',
  '    # 1 - two routes to a(A1, C3)',
  '    a13_from_a2 = TS_A23_C3 - (TS_P[1] - TS_P[0]) / TS_D_A1A2_C3',
  '    a13_from_a3 = TS_A33_C3 - (TS_P[2] - TS_P[0]) / TS_D_A1A3_C3',
  '    if abs(a13_from_a2 - a13_from_a3) > 1e-4:',
  '        problems.append("T&S column C3 inconsistent: %.6f against %.6f"',
  '                        % (a13_from_a2, a13_from_a3))',
  '    a13 = 0.5 * (a13_from_a2 + a13_from_a3)',
  '    notes.append("T&S a(A1,C3) implied twice: %.6f and %.6f" % (a13_from_a2, a13_from_a3))',
  '    for label, pj, a_jk, ref in (("A1-A2", TS_P[1], TS_A23_C3, TS_D_A1A2_C3),',
  '                                 ("A1-A3", TS_P[2], TS_A33_C3, TS_D_A1A3_C3)):',
  '        got = (pj - TS_P[0]) / (a_jk - a13)',
  '        if abs(got - ref) > 1e-4:',
  '            problems.append("T&S Table 4 %s/C3: %.6f against printed %.4f" % (label, got, ref))',
  '    # 2 - the dropped digit in A2-A3 / C3',
  '    d_a2a3 = (TS_P[2] - TS_P[1]) / (TS_A33_C3 - TS_A23_C3)',
  '    if abs(d_a2a3 - 0.2620) > 1e-4:',
  '        problems.append("T&S A2-A3/C3 recomputes to %.6f, not 0.2620" % d_a2a3)',
  '    rel = 100.0 * d_a2a3 / TS_W3',
  '    if abs(rel - 91.11) > 1e-2:',
  '        problems.append("T&S A2-A3/C3 relative form %.4f, not 91.11" % rel)',
  '    notes.append("T&S A2-A3/C3 recomputes to %.4f (%.2f percent); the paper prints "',
  '                 "0.0262 and 9.1099 percent, one digit short." % (d_a2a3, rel))',
  '    # 3 - the conversion to this tool\'s parametrisation',
  '    x_star = (TS_W1 - TS_D_A1A3_C1) / (1 - TS_D_A1A3_C1)',
  '    if abs(x_star - 0.5131) > 1e-4:',
  '        problems.append("T&S A1-A3/C1 converts to %.6f, not 0.5131" % x_star)',
  '    # relative form (6) against this page\'s raw-weight change, on this evaluation',
  '    for entry in rows:',
  '        if entry["xstar"] is None or entry["omega"] == 0:',
  '            continue',
  '        wk, xs = entry["omega"], entry["xstar"]',
  '        delta_rel = 100.0 * (wk - xs) / ((1 - xs) * wk)',
  '        if abs(entry["raw_change_pct"] + delta_rel) > 1e-9:',
  '            problems.append("relation (6) on %s: %.12g against %.12g"',
  '                            % (entry["requirement_id"], entry["raw_change_pct"], -delta_rel))',
  '    return problems, notes',
  '',
  '',
  'def main():',
  '    out, a, scores, q, rank, rows, pairs = evaluate_all()',
  '    print("Technical bid evaluation - commercial terms are not part of this result")',
  '    print("")',
  '    for b in BIDDER_IDS:',
  '        print("bidder %-8s score %10.6f %%   rank %-6s knock-out %-6s provisional %-5s open drafts %d"',
  '              % (b, out["score_pct_" + b], out["rank_" + b], out["knock_out_" + b],',
  '                 out["provisional_" + b], out["open_drafts_" + b]))',
  '    print("")',
  '    print("leader                    : %s" % out["leader"])',
  '    print("margin to rank 2, pp      : %s" % _n(out["margin_pp"]))',
  '    print("critical weight change, pp: %s on %s (overtaken by %s)"',
  '          % (_n(out["critical_change_pp"]), out["critical_requirement_id"],',
  '             out["critical_challenger"]))',
  '    print("rank 1 holds to +/- %%     : %s" % _n(out["x_crit_pct"]))',
  '    print("rank 1 stable at +/-%g %%  : %s" % (X_PCT, out["rank1_stable"]))',
  '    print("")',
  '    print("per row: requirement, share %, change pp, new share %, overtaking bidder")',
  '    for entry in rows:',
  '        print("  %-16s %8.4f  %10s  %10s  %s"',
  '              % (entry["requirement_id"], 100.0 * entry["omega"],',
  '                 "n/a" if entry["na"] else ("robust" if entry["robust"] else "%+.4f" % (100.0 * entry["delta"])),',
  '                 "-" if entry["xstar"] is None else "%.4f" % (100.0 * entry["xstar"]),',
  '                 entry["challenger"] or "-"))',
  '    print("")',
  '    print("pair reversibility inside the weight box")',
  '    for pr in pairs:',
  '        print("  %s over %s reverses at +/- %.4f %%   reversible now: %s"',
  '              % (pr["p"], pr["q"], pr["t_pct"], pr["reversible"]))',
  '    print("")',
  '    print("NOT_REPRODUCED: rule findings, headline verdict, project-package mapping,")',
  '    print("                localised clarification templates.")',
  '    print("")',
  '    problems = check_against_page(out)',
  '    vp, vdone = check_vertices(a, q, rank)',
  '    lp, lnotes = check_literature(rows)',
  '    for note in lnotes:',
  '        print("note: " + note)',
  '    if vdone:',
  '        print("note: closed-form weight-box minimum equals 2**%d-vertex enumeration on %d %s."',
  '              % (len(ROWS), vdone, "pair" if vdone == 1 else "pairs"))',
  '    problems = problems + vp + lp',
  '    if problems:',
  '        for p in problems:',
  '            print("FAIL " + p)',
  '        raise SystemExit("self-test failed")',
  '    print("checked %d displayed %s of sections 4.2 to 4.6 against the page, tolerance %g"',
  '          % (len(PAGE_VALUES), "value" if len(PAGE_VALUES) == 1 else "values", TOL))',
  '',
  '',
  'def _n(v):',
  '    return "-" if v is None else ("%.6f" % v)',
  '',
  '',
  'if __name__ == "__main__":',
  '    main()',
  ''
 ].join('\n');
 return head+'\n'+body;
}

function pyLit(x,indent){
 var pad=new Array((indent||1)+1).join(' ');
 if(x===null||x===undefined) return 'None';
 if(typeof x==='boolean') return x?'True':'False';
 if(typeof x==='number') return isFinite(x)?String(x):'float("nan")';
 if(typeof x==='string') return JSON.stringify(x);
 if(Array.isArray(x)){
  if(!x.length) return '[]';
  return '[\n'+x.map(function(v){ return pad+pyLit(v,(indent||1)+1); }).join(',\n')+'\n'+pad.slice(1)+']';
 }
 var ks=Object.keys(x);
 if(!ks.length) return '{}';
 return '{\n'+ks.map(function(k){ return pad+JSON.stringify(k)+': '+pyLit(x[k],(indent||1)+1); }).join(',\n')+'\n'+pad.slice(1)+'}';
}
function wrap(s,width,indent){
 var words=String(s||'').split(/\s+/), out=[], line=indent;
 words.forEach(function(w){
  if(line.length+w.length+1>width){ out.push(line); line=indent+w; }
  else line+=(line===indent?'':' ')+w;
 });
 if(line.trim()) out.push(line);
 return out.join('\n');
}

function resultPayload(r){
 var tone=r.verdict==='INVALID'||r.verdict==='NO_ACCEPTABLE_BID'||r.verdict==='SELECTION_BLOCKED'?'bad'
   :(r.verdict==='EVALUATION_OPEN'||r.sensitive?'warn':'ok');
 var tiles=[
  {label:tx(I18N.tileLeader),value:r.leader?r.leader.score:null,unit:'%',precision:2,
   hint:r.leader?r.leader.id:tx(I18N.naWord),tone:r.leader?'ok':'muted'},
  /* no margin with two or more qualified bids means a tie at rank 1, which is
     not a quiet result: the tile keeps the warning tone it had when the tie
     was reported as a margin of 0. */
  /* The unit belongs to the number, not to the hint: the sticky strip below
     768 px prints label, value and unit and drops the hint, so `pp` and `%`
     carried as hints left two of the three headline figures unitless. */
  {label:tx(I18N.tileMargin),value:r.margin,precision:4,unit:'pp',
   tone:(r.margin===null?(r.Q.length>=2?'warn':'ok'):(r.margin<1?'warn':'ok'))},
  {label:tx(I18N.tileCritical),value:r.sens.deltaStar===null?null:100*r.sens.deltaStar,precision:4,
   unit:r.sens.deltaStar===null?'':'pp',
/* "robust" is the §4.5 categorical outcome - no single-weight change reverses
   rank 1 - and it holds only where §4.5 ran: two or more qualified bids and one
   leader. Elsewhere the tile carries no hint and the framework prints its own
   "Not computed yet" beside the empty value, as it does for the tile below. */
   hint:r.sens.criticalRow?(r.sens.criticalRow+' ← '+r.sens.challenger)
        :((r.leader&&r.Q.length>=2&&r.sens.deltaStar===null)?tx(I18N.robustWord):''),
   tone:r.ruleIds&&r.ruleIds['BID-R-031']?'warn':'ok'},
  {label:tx(I18N.tileXcrit),value:r.stability.xCrit,precision:4,
   unit:r.stability.xCrit===null?'':'%',
   tone:r.stability.stable===false?'warn':'ok',headline:false},
  {label:tx(I18N.tileKnockouts),
   value:r.bidders.filter(function(b){return b.knock_out==='final';}).length,precision:0,
   hint:String(r.bidders.filter(function(b){return b.knock_out==='open';}).length)+' '+tx(I18N.koOpen),
   tone:r.bidders.some(function(b){return b.knock_out!=='none';})?'warn':'ok',headline:false},
  {label:tx(I18N.sevBlocker),value:r.counts.blocker,precision:0,
   hint:tx(I18N.sevMajor)+' '+r.counts.major+' · '+tx(I18N.sevMinor)+' '+r.counts.minor+' · '+tx(I18N.sevInfo)+' '+r.counts.info,
   tone:r.counts.blocker?'bad':(r.counts.major?'warn':'ok'),headline:false}
 ];
 var tables=[];
 if(r.computed){
  tables.push({ title:tx(I18N.tblBidders),
   head:[tx(I18N.colBidder),{label:tx(I18N.colScore)+', %',num:true},{label:tx(I18N.colRank),num:true},
         tx(I18N.colKnockOut),tx(I18N.colProvisional),{label:tx(I18N.colDrafts),num:true}],
   rows:r.bidders.map(function(b){
    return { cells:[{text:b.id,title:b.name||b.id},
                    {value:b.score,precision:2,num:true},
                    {text:b.rank===null?tx(I18N.notRanked):String(b.rank),num:true},
                    {text:tx(I18N['ko'+b.knock_out.charAt(0).toUpperCase()+b.knock_out.slice(1)]),
                     tone:b.knock_out==='final'?'bad':(b.knock_out==='open'?'warn':'ok')},
                    {text:b.provisional?tx(I18N.yesWord):tx(I18N.noWord)},
                    {value:b.open_drafts,precision:0,num:true}],
             chosen:b.id===r.state.selection.bidder_id,
             tone:b.knock_out==='final'?'bad':(b.knock_out==='open'?'warn':'') };
   })});
  if(r.sens.rows.length) tables.push({ title:tx(I18N.tblSensitivity),
   head:[tx(I18N.colRow),{label:tx(I18N.reqOmega)+', %',num:true},{label:tx(I18N.colDelta)+', pp',num:true},
         {label:tx(I18N.colNewOmega)+', %',num:true},tx(I18N.colChallenger),{label:tx(I18N.colRelChange)+', %',num:true}],
   rows:r.sens.rows.map(function(x){
    return { cells:[{text:x.requirement_id},
                    {value:100*x.omega,precision:2,num:true},
                    {text:x.na?tx(I18N.naWord):(x.robust?tx(I18N.robustWord):((x.delta>=0?'+':'−')+fmt(Math.abs(100*x.delta),4))),num:true},
                    {text:x.xstar===null?'—':fmt(100*x.xstar,4),num:true},
                    {text:x.challenger||'—'},
                    {text:x.r===null?'—':((x.r>=0?'+':'−')+fmt(Math.abs(x.r),4)),num:true}],
             chosen:x.requirement_id===r.sens.criticalRow };
   })});
  if(r.stability.pairs.length) tables.push({ title:tx(I18N.tblPairs),
   head:[tx(I18N.colPair),{label:tx(I18N.colT)+', %',num:true},tx(I18N.colReversible)],
   rows:r.stability.pairs.map(function(p){
    return { cells:[{text:p.p+' › '+p.q},{value:p.t_pct,precision:4,num:true},
                    {text:p.reversible?tx(I18N.yesWord):tx(I18N.noWord),tone:p.reversible?'warn':'ok'}] };
   })});
 }
 var order={blocker:0,major:1,minor:2,info:3};
 var findings=r.rules.slice().sort(function(a,b){ return order[a.sev]-order[b.sev]; });
 tables.push({ title:tx(I18N.tblFindings),
  head:[tx(I18N.colSeverity),tx(I18N.colRule),tx(I18N.colTarget),tx(I18N.colMessage)],
  rows:findings.length?findings.slice(0,120).map(function(x){
   return { cells:[{text:tx(I18N['sev'+x.sev.charAt(0).toUpperCase()+x.sev.slice(1)]),
                    tone:x.sev==='blocker'?'bad':(x.sev==='major'?'warn':'muted')},
                   {text:x.id},{text:targetLabel(x),wrap:true},
                   {text:ruleText(x.id,ruleVars(x)),wrap:true}] };
  }):[{cells:[{text:tx(I18N.noFindings),span:4}]}] });
 /* SPEC 15 criterion 11 wants the price scope stated once in the interface,
    once in the limitations and once in the report. The interface copy is the
    sticky notice at the top; this panel and the evaluation panel carried the
    same 147-character sentence a second and a third time in one view. */
 var notes=[];
 /* SPEC 10 / TZ-project-package 1: the permalink budget is about 4 kB, and a
    150-row matrix passes it. The record export is the transport that does not. */
 try{
  if(window.Diagram&&Diagram.state&&typeof Diagram.state.encode==='function'){
   var enc=Diagram.state.encode(compactState());
   if(enc&&enc.length>4096) notes.push(L('permalinkLarge',{n:enc.length}));
  }
 }catch(e){}
 return { verdict:{tone:tone,text:verdictWord(r,lang)}, tiles:tiles, tables:tables, notes:notes };
}

function pkgJoin(parts){

        .filter(function(t){ return t!==''; }).join(' \u00b7 ');
}

/* ---- read mapping (SPEC 7.3) ---- */
function rowsFromRequisition(pkg,rq){
 var reqById=nmap();
 (Array.isArray(pkg.requirements)?pkg.requirements:[]).forEach(function(q){ if(q&&trim(q.id)) reqById[trim(q.id)]=q; });
 var terms=nmap();
 (Array.isArray(rq.requirement_terms)?rq.requirement_terms:[]).forEach(function(t){ if(t&&trim(t.requirement_id)) terms[trim(t.requirement_id)]=t; });
 var defaulted=0, defaultedIds=[];
 var rows=(Array.isArray(rq.requirement_ids)?rq.requirement_ids:[]).map(function(id){
  var rid=trim(id), q=reqById[rid]||null, t=terms[rid]||null;
  if(!t||(t['class']==null&&t.weight==null)){ defaulted++; defaultedIds.push(rid); }
  return { id:rid,
           text:q?String(q.text!=null?q.text:(q.label||'')):'',
           'class':(t&&t['class']==='desirable')?'desirable':'mandatory',
           weight:(t&&isFinite(Number(t.weight)))?Number(t.weight):1,
           source:'package',
           ref:q?String(q.source||''):'' };
 });
 return { rows:rows, defaulted:defaulted, defaulted_ids:defaultedIds };
}
function stateFromStoredItem(it){
 var d=defaultState();
 d.evaluation.id=trim(it.id);
 d.evaluation.title=String(it.label||'');
 d.evaluation.requisition_id=trim(it.requisition_id);
 d.evaluation.requisition_revision=String(it.requisition_revision||'');
 d.evaluation.package_id=trim(it.package_id);
 d.evaluation.system_id=trim(it.system_id);
 d.evaluation.evaluator=String(it.evaluator||'');
 d.evaluation.evaluation_date=String(it.evaluated_at||'').slice(0,10);
 SCORE_KEYS.forEach(function(k){ if(it.scoring_table&&isFinite(Number(it.scoring_table[k]))) d.scoring_table[k]=Number(it.scoring_table[k]); });
 d.requirements=(Array.isArray(it.requirements)?it.requirements:[]).map(function(r){
  return { id:trim(r.requirement_id), text:'', 'class':r['class']==='desirable'?'desirable':'mandatory',
           weight:isFinite(Number(r.weight))?Number(r.weight):1, source:'package', ref:'' };
 });
 d.bidders=(Array.isArray(it.bidders)?it.bidders:[]).map(function(b){
  return { id:trim(b.id), name:String(b.name||''), offer_ref:String(b.offer_ref||'') };
 });
 var byPair=nmap();
 d.cells=(Array.isArray(it.compliance)?it.compliance:[]).map(function(c){
  var cell=defaultCell(trim(c.requirement_id),trim(c.bidder_id));
  cell.status=STATUSES.indexOf(c.status)>=0?c.status:'open';
  cell.acceptance=['pending','accepted','rejected'].indexOf(c.acceptance)>=0?c.acceptance:'pending';
  cell.deviation_text=String(c.deviation_text||''); cell.consequence=String(c.consequence||'');
  cell.acceptance_basis=String(c.acceptance_basis||''); cell.na_reason=String(c.na_reason||'');
  cell.note=String(c.note||'');
  byPair[cell.requirement_id+'\u0000'+cell.bidder_id]=cell;
  return cell;
 });
 (Array.isArray(it.clarifications)?it.clarifications:[]).forEach(function(q){
  var cell=byPair[trim(q.requirement_id)+'\u0000'+trim(q.bidder_id)];
  if(!cell) return;
  cell.clarification.question=String(q.question||'');
  cell.clarification.status=q.status==='closed'?'closed':'open';
  cell.clarification.answer=String(q.answer||'');
 });
 d.selection={ bidder_id:trim(it.selected_bidder_id), rationale:String(it.selection_rationale||''),
               selected_at:String(it.selected_at||'') };
 return d;
}
function applyProjectIdentity(pkg,st){
 var notes=[];
 var pr=pkg&&pkg.project;
 if(pr&&typeof pr==='object'){
  st.evaluation.project_name=String(pr.name||'');
  st.evaluation.project_reference=String(pr.reference||'');
 }
 var stc=pkg&&pkg.structure;
 if(stc&&Array.isArray(stc.packages)&&trim(st.evaluation.package_id)){
  var hit=null;
  stc.packages.forEach(function(p){ if(p&&trim(p.id)===trim(st.evaluation.package_id)) hit=p; });
  if(hit){
   /* 7.3: the package name and the system follow the package id. Leaving a
      system identifier from an earlier evaluation here would file this bid
      under a system the package does not put it in. */
   st.evaluation.package_name=String(hit.name||'');
   st.evaluation.system_id=trim(hit.system_id);
  } else st.evaluation.package_name='';
 }
 return notes;
}

/* ---- write mapping (SPEC 7.4) ---- */
function round4(v){ return v==null?null:Math.round(v*1e4)/1e4; }
function packageItem(){
 var r=last||evaluate(state,pkgCtx());
 var id=effectiveId();
 var sel=r.state.selection.bidder_id;
 var item={
  id:id, label:r.state.evaluation.title,
  requisition_id:r.state.evaluation.requisition_id,
  requisition_revision:r.state.evaluation.requisition_revision,
  package_id:r.state.evaluation.package_id,
  system_id:r.state.evaluation.system_id,
  scope:'technical', commercial:'excluded',
  verdict:r.verdict, sensitive:r.sensitive,
  evaluated_at:new Date().toISOString().replace(/\.\d{3}Z$/,'Z'),
  evaluator:r.state.evaluation.evaluator,
  scoring_table:JSON.parse(JSON.stringify(r.state.scoring_table)),
  requirements:r.rows.map(function(row){
   return { requirement_id:row.id, 'class':row.cls, weight:row.w, weight_pct:round4(100*row.omega) };
  }),
  bidders:r.bidders.map(function(b){
   return { id:b.id, name:b.name, offer_ref:b.offer_ref, technical_score_pct:round4(b.score),
            rank:b.rank, knock_out:b.knock_out, knock_out_requirement_ids:b.knock_out_requirement_ids.slice(),
            provisional:b.provisional };
  }),
  compliance:[], clarifications:[],
  sensitivity:{ leader:r.leader?r.leader.id:null, margin_pp:round4(r.margin),
                critical_change_pp:r.sens.deltaStar===null?null:round4(100*r.sens.deltaStar),
                critical_requirement_id:r.sens.criticalRow, challenger_id:r.sens.challenger,
                x_pct:r.state.settings.x_pct, x_crit_pct:round4(r.stability.xCrit),
                rank1_stable:r.stability.stable },
  selected_bidder_id:sel, selection_rationale:r.state.selection.rationale,
  selected_at:r.state.selection.selected_at, accepted_deviations:[]

/* ---- benchmark adapter (AGENTS 5.2) ----
   benchmarks/bidevaluation.reference.json is an independent corpus: its cases
   carry the tool-neutral state of SPEC 13.1, optionally a project-package
   document and an action, and their expectations were derived from the
   specification without access to this file. This adapter maps each case onto
   the page model, evaluates every check with the functions the interface calls,
   and returns the artifact AGENTS 5.2 prescribes: the full input vector per
   case and got / ref / tol / rel per check. */
var BENCH_REF_URL='benchmarks/bidevaluation.reference.json';
var PKG_KEY_DOC='diagram_project_package', PKG_KEY_META='diagram_project_package_meta';

/* ---- the corpus tolerance vocabulary (its `tolerance` field) ---- */
function benchTol(t){
 var s=String(t==null?'exact':t);
 var m=/^abs\s+([0-9eE.+-]+)$/.exec(s);
 if(m) return {kind:'abs',abs:Number(m[1]),text:s};
 if(s==='exact membership'||s==='exact set') return {kind:'set',text:s};
 return {kind:'exact',text:s};                    /* 'exact', 'byte-identical' */
}
function benchPlain(o){ return !!o&&typeof o==='object'&&!Array.isArray(o); }
function benchEq(got,ref,tol,acc){
 if(tol.kind==='abs'&&typeof ref==='number'){
  if(typeof got!=='number'||!isFinite(got)) return false;
  var diff=Math.abs(got-ref), rel=(ref===0?diff:diff/Math.abs(ref));
  if(acc.rel===null||rel>acc.rel) acc.rel=rel;
  return diff<=tol.abs;
 }
 if(Array.isArray(ref)){
  if(!Array.isArray(got)) return false;
  var a=got, b=ref;
  if(tol.kind==='set'){ a=got.slice().sort(); b=ref.slice().sort(); }
  if(a.length!==b.length) return false;
  for(var i=0;i<b.length;i++){ if(!benchEq(a[i],b[i],tol,acc)) return false; }
  return true;
 }
 if(benchPlain(ref)){
  if(!benchPlain(got)) return false;
  var keys={}, ok=true;
  Object.keys(ref).forEach(function(k){ keys[k]=1; });
  Object.keys(got).forEach(function(k){ keys[k]=1; });
  Object.keys(keys).forEach(function(k){ if(!benchEq(got[k],ref[k],tol,acc)) ok=false; });
  return ok;
 }
 if(ref===null||ref===undefined) return got===null||got===undefined;
 return got===ref;
}

/* ---- rule targets in the corpus vocabulary ----
   The corpus names one target per fired instance: a cell as
   <requirement>/<bidder>, a row or a bidder by its own id, and an
   evaluation-wide finding by the field the SPEC 5 trigger reads. */
var BENCH_EVAL_TARGET={'BID-R-001':'bidders','BID-R-002':'bidders','BID-R-004':'requirements',
 'BID-R-005':'requirements','BID-R-007':'requirements','BID-R-008':'scoring_table',
 'BID-R-030':'*','BID-R-032':'settings.x_pct'};
function benchTarget(x){
 var t=x.target||{};
 if(t.kind==='cell') return x.id==='BID-R-009'?('cells['+t.index+']'):(t.requirement_id+'/'+t.bidder_id);
 if(t.kind==='requirement'||t.kind==='bidder'||t.kind==='requisition'||t.kind==='bid_evaluation')
  return String(t.id==null?'':t.id);
 if(t.kind==='selection') return x.id==='BID-R-058'?'selection.bidder_id':'selection';
 return BENCH_EVAL_TARGET[x.id]||'evaluation';
}

/* ---- every value the corpus can ask for, under the corpus key ---- */
function flatOutputs(r,extra){

 });

 r.drafts.forEach(function(d){

/* ---- grading ----
   rules_present and rules_absent partition the 50 rules of SPEC 5 whenever the
   corpus states both, so rules_present is graded as containment and
   rules_absent as exclusion; their conjunction is set equality. The corpus
   omits rules_absent exactly on the cases whose verdict is INVALID, where it
   states (not_benchmarked item 5) that only the verdict and the blocker are
   benchmarked. */
function benchGrade(caseObj,f){
 var cmp={}, pass=true, checks=caseObj.checks||{};
 function put(key,got,ref,tol,ok,rel,basis,detail){
  cmp[key]={got:(got===undefined?null:got),ref:(ref===undefined?null:ref),
            tol:tol,rel:(rel==null?null:rel),ok:!!ok,ref_source:'recomputed',
            basis:basis||null,graded:true,status:ok?'pass':'fail'};
  if(detail) cmp[key].detail=detail;
  if(!ok) pass=false;
 }
 Object.keys(checks).forEach(function(key){
  var spec=checks[key]||{}, ref=spec.ref, tol=benchTol(spec.tol), acc={rel:null};
  if(key==='rules_present'){
   var firedList=f['rules_fired']||[];
   var missing=(ref||[]).filter(function(id){ return firedList.indexOf(id)<0; });
   put(key,firedList,ref,tol.text+' (containment; rules_absent carries the complement)',
       missing.length===0,null,spec.basis,
       missing.length?('listed but not fired: '+missing.join(', ')):'every listed rule fired');
   return;
  }
  if(key==='rules_absent'){
   var fired2=f['rules_fired']||[];
   var shown=(ref||[]).filter(function(id){ return fired2.indexOf(id)>=0; });
   put(key,fired2,ref,tol.text+' (exclusion: none of the listed rules may fire)',
       shown.length===0,null,spec.basis,
       shown.length?('listed as absent but fired: '+shown.join(', ')):'none of the listed rules fired');
   return;
  }
  if(key.indexOf('rule_instances.')===0){
   var got0=f[key]||[];
   put(key,got0,ref,tol.text,benchEq(got0,ref,benchTol('exact set'),acc),null,spec.basis);
   return;
  }
  if(!(key in f)){ put(key,null,ref,tol.text,false,null,spec.basis); return; }
  var got=f[key], ok=benchEq(got,ref,tol,acc);
  put(key,got,ref,tol.text,ok,acc.rel,spec.basis);
 });
 return {cmp:cmp,pass:pass};
}

 ns.requirements.forEach(function(rr){
  var q=reqById[rr.id];
  if(q){ rr.text=String(q.text!=null?q.text:(q.label||'')); rr.ref=String(q.source||''); }
 });
 var rr2=evaluate(ns,{loaded:true,'package':cur['package']});
 var sc=nmap(); rr2.bidders.forEach(function(b){ sc[b.id]=b.score; });
 extra['resume_round_trip_score_pct']=sc;
 extra['resume_round_trip_verdict']=rr2.verdict;
}

/* ---- one case ---- */
function benchCase(c){
 var input=c.inputs||{};
 var st=normState(JSON.parse(JSON.stringify(input.state||{})));
 var doc=(input&&Object.prototype.hasOwnProperty.call(input,'package'))?input['package']:undefined;
 var action=input.action||null;
 var notes=[], extra={}, r=null;
 var keep={ev:state.evaluation,se:state.settings,sc:state.scoring_table,rq:state.requirements,
           bd:state.bidders,ce:state.cells,sl:state.selection,loaded:pkgLoaded,flags:pkgFlagList,last:last};
 try{
  state.evaluation=st.evaluation; state.settings=st.settings; state.scoring_table=st.scoring_table;
  state.requirements=st.requirements; state.bidders=st.bidders; state.cells=st.cells;
  state.selection=st.selection;
  pkgLoaded=null; pkgFlagList=[];
  if(doc===undefined||doc===null){
   /* no fixture: the store is emptied for the duration of the case, so what the
      runtime reports is measured and not asserted (SPEC 7.2 step 6) */
   var hd=null,hm=null;
   try{ hd=localStorage.getItem(PKG_KEY_DOC); hm=localStorage.getItem(PKG_KEY_META);
        localStorage.removeItem(PKG_KEY_DOC); localStorage.removeItem(PKG_KEY_META); }catch(e){}
   var lo=null; try{ lo=PKG_OK()?DiagramProject.load():null; }catch(e){ lo=null; }
   extra['storage']=lo?'package available':'no package available';
   extra['package_applied']=false;
   extra['ignored_sections']=[];
   try{ if(hd!==null) localStorage.setItem(PKG_KEY_DOC,hd);
        if(hm!==null) localStorage.setItem(PKG_KEY_META,hm); }catch(e){}
   r=evaluate(state,{loaded:false});
  } else r=benchWithPackage(doc,action,notes,extra);
 } catch(e){ notes.push('The case threw: '+(e&&e.message||e)); }
 finally {
  state.evaluation=keep.ev; state.settings=keep.se; state.scoring_table=keep.sc;
  state.requirements=keep.rq; state.bidders=keep.bd; state.cells=keep.ce; state.selection=keep.sl;
  pkgLoaded=keep.loaded; pkgFlagList=keep.flags;
  last=evaluate(state,pkgCtx());
  try{ if(ui){ ui.sync(); ui.run(); } }catch(e){}
 }
 if(!r) return {id:c.id,intent:c.intent||'',note:notes.join(' ')||'The case did not evaluate.',
                inputs:input,checks:{},pass:false};
 var f=flatOutputs(r,extra);
 var g=benchGrade(c,f);
 Object.keys(g.cmp).forEach(function(k){
  if(!g.cmp[k].ok&&!(k in f)&&k.indexOf('rules_')!==0) notes.push('Check '+k+' has no adapter mapping.');
 });
 var out={id:c.id,intent:c.intent||'',inputs:input,checks:g.cmp,pass:g.pass,
          note:notes.join(' ')};
 if(c.disputable) out.disputable=true;
 if(c.note) out.corpus_note=c.note;
 return out;
}
async function sha256Hex(text){
 try{
  var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
  return Array.prototype.map.call(new Uint8Array(buf),function(b){ return (b<16?'0':'')+b.toString(16); }).join('');
 }catch(e){ return null; }
}
async function benchmarkArtifact(){
 var resp;
 try{ resp=await fetch(BENCH_REF_URL,{credentials:'same-origin',cache:'no-store'}); }
 catch(e){ throw new Error('Benchmark reference '+BENCH_REF_URL+' could not be loaded: '+(e&&e.message||e)); }
 if(!resp.ok) throw new Error('Benchmark reference '+BENCH_REF_URL+' could not be loaded: HTTP '+resp.status);
 var text=await resp.text();
 var digest=await sha256Hex(text);
 var ref=JSON.parse(text);
 var cases=(ref.cases||[]).map(benchCase);
 var passed=cases.filter(function(c){ return c.pass; }).length;
 var checks=0, checksOk=0;
 cases.forEach(function(c){ Object.keys(c.checks).forEach(function(k){ checks++; if(c.checks[k].ok) checksOk++; }); });
 var st=0, stFail=[];
 try{ selfTests().forEach(function(x){ if(x.pass) st++; else stFail.push(x.name); }); }catch(e){}
 var manifest={}; try{ manifest=JSON.parse(document.getElementById('diagram-tool-manifest').textContent); }catch(e){}
 return {
  schema:'tools.petrov.re/benchmark-artifact/v1',
  tool:'bidevaluation', file:'bidevaluation.html',
  manifest_revision:manifest.manifest_revision||'', build:manifest.manifest_revision||'',
  run_at:new Date().toISOString().replace(/\.\d{3}Z$/,'Z'),
  reference_provenance:'recomputed',
  provenance_note:'Every ref in this artifact was derived from SPEC-bidevaluation and the cited sources by a separate agent with no access to this page, and every got was recomputed in the browser by the same functions the interface calls; no stored result is reused.',
  reference:ref.reference||'', reference_citations:ref.reference_citations||[], tolerance:ref.tolerance||'',
  reference_file:BENCH_REF_URL, reference_sha256:digest,
  reference_author_note:ref.author_note||'', coverage:ref.coverage||'',
  total:cases.length, passed:passed, failed:cases.length-passed, flagged:0,
  checks_total:checks, checks_passed:checksOk, checks_failed:checks-checksOk,
  cases:cases,
  /* every check this build does not reproduce, listed where a reader meets the
     counts rather than only inside the case it belongs to */
  failures:(function(){
   var list=[];
   cases.forEach(function(c){
    Object.keys(c.checks).forEach(function(k){
     var v=c.checks[k];
     if(!v.ok) list.push({'case':c.id,check:k,got:v.got,ref:v.ref,tol:v.tol,
                          rel:v.rel,basis:v.basis,detail:v.detail||null});
    });
   });
   return list;
  })(),
  not_benchmarked:(function(){
   var o={};
   (ref.not_benchmarked||[]).forEach(function(t,i){ o['Corpus limitation '+(i+1)]=t; });
   return o;
  })(),
  qa:{ domain_tests:{ status:stFail.length?'fail':(st?'pass':'not run'),
                      note:st+' page self-tests passed'+(stFail.length?('; failed: '+stFail.join(', ')):'')+'.' },
       adapter:{ status:'pass', note:'Each case state is normalised with normState() and evaluated with evaluate(), the function the interface calls; package cases write the fixture into localStorage, read it through DiagramProject, and restore the store afterwards. rules_present is graded as containment and rules_absent as exclusion, which together are set equality over the 50 rules of SPEC 5; rule_instances targets are compared as sets.' } }
 };
}

/* ---- registration and boot ---- */
function installData(){
 if(!window.Diagram) return;
 Diagram.init({
  id:'bidevaluation', file:'bidevaluation.html', title:T('title'),
  state:{serialize:compactState,deserialize:expandState},
  record:record,
  python:pythonPayload,
  handoff:{provides:[],accepts:[],build:function(){ return null; },apply:function(){}},
  report:{profile:reportProfile,sections:reportSections}
 });
}
function degrade(){ last=evaluate(state,pkgCtx()); }
function boot(){
 try{ if(window.DiagramUI&&typeof DiagramUI.domainLang==='function'){ var l0=DiagramUI.domainLang(); if(LANGS.indexOf(l0)>=0) lang=l0; } }catch(e){}
 last=evaluate(state,pkgCtx());
 if(window.DiagramUI&&DiagramUI.api==='tools.petrov.re/ui/v1'){
  buildInterface();
  try{ pkgPanel(); }catch(e){}
 } else degrade();
 installData();
}
window.__dgcBenchmark=benchmarkArtifact;
window.__bidTests=selfTests;
window.__bidevaluation={evaluate:evaluate,state:state,normState:normState,compactState:compactState,
 expandState:expandState,record:record,pythonPayload:pythonPayload,packageItem:packageItem,
 derivedEvaluationId:derivedEvaluationId,presets:{P1:P1,P2:P2,P3:P3,P4:P4},flatOutputs:flatOutputs};
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
})();
</script>
