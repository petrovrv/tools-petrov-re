 "summary": {
  "en": "Evaluate 2–10 technical bids against one requisition: compliance per requirement, knock-out on mandatory items, weighted score, rank, and the weight change that would alter rank 1.",
  "uk": "Оцініть 2–10 технічних пропозицій за однією заявкою: відповідність за кожною вимогою, відсіювання за обов’язковими пунктами, зважений бал, ранг і зміну ваги, яка змінює перше місце.",
  "de": "Bewerten Sie 2–10 technische Angebote gegen eine Anfragespezifikation: Erfüllung je Anforderung, Ausschluss bei Muss-Anforderungen, gewichtete Punktzahl, Rang und die Gewichtsänderung, die Rang 1 kippt.",
  "nl": "Beoordeel 2–10 technische offertes tegen één aanvraagspecificatie: voldoen per eis, uitsluiting op verplichte eisen, gewogen score, rangorde en de gewichtswijziging die rang 1 omkeert.",

  "pl": "Oceń 2–10 ofert technicznych wobec jednego zapotrzebowania: zgodność dla każdego wymagania, eliminacja przy wymaganiach obowiązkowych, ocena ważona, ranking i zmianę wagi, która zmienia miejsce 1."

 "description": {
  "en": "Rows are the requirements of one technical requisition with their class (mandatory or desirable) and weight; columns are the bidders. Each cell records compliant, exceeds, a deviation with its stated technical consequence and acceptance decision, missing information, or not applicable with a reason. A rejected deviation or an unanswered mandatory requirement disqualifies a bidder until the cell is re-classified. The technical score is the weighted sum of cell scores taken from an editable six-value scoring table; the page reports score, rank, the margin to rank 2, the smallest single-weight change in percentage points that lets another qualified bidder overtake the leader (exact, piecewise linear), and the stability of rank 1 over every weight vector within ±x % (closed form, equal to exhaustive vertex enumeration). Clarification questions are drafted per bidder for handover to the deviation register, and the selected bid with its accepted deviations is written into the project package.",
  "uk": "Рядки — вимоги однієї технічної заявки з класом (обов’язкова чи бажана) та вагою; стовпці — учасники. Кожна комірка фіксує: відповідає, перевищує, відхилення з описаним технічним наслідком і рішенням про прийнятність, бракує інформації або незастосовно з обґрунтуванням. Відхилення, яке не прийняте, або необґрунтована обов’язкова вимога знімають учасника з розгляду, доки комірку не перекласифікують. Технічний бал — зважена сума балів комірок за редагованою таблицею з шести значень; сторінка показує бал, ранг, відрив від другого місця, найменшу зміну однієї ваги у відсоткових пунктах, після якої інший придатний учасник обходить лідера (точно, кусково-лінійно), і стійкість першого місця для всіх векторів ваг у межах ±x % (замкнена форма, що дорівнює повному перебору вершин). Запити на роз’яснення формуються за кожним учасником для передачі до реєстру відхилень, а обрана пропозиція з прийнятими відхиленнями записується в пакет проєкту.",
  "de": "Zeilen sind die Anforderungen einer technischen Anfragespezifikation mit Klasse (Muss oder Wunsch) und Gewicht; Spalten sind die Bieter. Jede Zelle hält fest: erfüllt, übertrifft, Abweichung mit genannter technischer Folge und Annahmeentscheidung, fehlende Angabe oder nicht zutreffend mit Begründung. Eine abgelehnte Abweichung oder eine unbeantwortete Muss-Anforderung schließt einen Bieter aus, bis die Zelle neu eingestuft wird. Die technische Punktzahl ist die gewichtete Summe der Zellwerte aus einer editierbaren Sechs-Werte-Tabelle; die Seite zeigt Punktzahl, Rang, Abstand zu Rang 2, die kleinste Änderung eines einzelnen Gewichts in Prozentpunkten, nach der ein anderer zugelassener Bieter den Führenden überholt (exakt, stückweise linear), und die Stabilität von Rang 1 über alle Gewichtsvektoren innerhalb ±x % (geschlossene Form, gleich der vollständigen Eckenaufzählung). Rückfragen werden je Bieter entworfen und an das Abweichungsregister übergeben; das gewählte Angebot mit seinen angenommenen Abweichungen geht in das Projektpaket.",
  "nl": "Rijen zijn de eisen van één technische aanvraagspecificatie met klasse (verplicht of gewenst) en gewicht; kolommen zijn de inschrijvers. Elke cel legt vast: voldoet, overtreft, een afwijking met de genoemde technische consequentie en het acceptatiebesluit, ontbrekende informatie, of niet van toepassing met reden. Een afgewezen afwijking of een onbeantwoorde verplichte eis sluit een inschrijver uit totdat de cel opnieuw wordt ingedeeld. De technische score is de gewogen som van celscores uit een bewerkbare tabel met zes waarden; de pagina toont score, rangorde, de marge tot rang 2, de kleinste wijziging van één gewicht in procentpunten waarna een andere toegelaten inschrijver de koploper passeert (exact, stuksgewijs lineair), en de stabiliteit van rang 1 over alle gewichtsvectoren binnen ±x % (gesloten vorm, gelijk aan volledige hoekpuntopsomming). Verduidelijkingsvragen worden per inschrijver opgesteld voor overdracht aan het afwijkingenregister, en de gekozen offerte met haar geaccepteerde afwijkingen gaat naar het projectpakket.",
  "fr": "Les lignes sont les exigences d’une réquisition technique avec leur classe (obligatoire ou souhaitable) et leur poids ; les colonnes sont les soumissionnaires. Chaque cellule enregistre : conforme, dépasse, une dérogation avec sa conséquence technique énoncée et la décision d’acceptation, information manquante, ou sans objet avec motif. Une dérogation refusée ou une exigence obligatoire sans réponse élimine un soumissionnaire jusqu’à reclassement de la cellule. La note technique est la somme pondérée des notes de cellule issues d’un barème modifiable à six valeurs ; la page donne la note, le rang, l’écart au rang 2, la plus petite variation d’un seul poids en points de pourcentage permettant à un autre soumissionnaire admis de dépasser le premier (exacte, linéaire par morceaux), et la stabilité du rang 1 sur tous les vecteurs de poids à ±x % (forme fermée, égale à l’énumération exhaustive des sommets). Les demandes de clarification sont rédigées par soumissionnaire pour le registre des dérogations, et l’offre retenue avec ses dérogations acceptées est écrite dans le dossier de projet.",
  "es": "Las filas son los requisitos de una requisición técnica con su clase (obligatorio o deseable) y su peso; las columnas son los licitadores. Cada celda registra: cumple, supera, una desviación con su consecuencia técnica declarada y la decisión de aceptación, información faltante, o no aplicable con motivo. Una desviación rechazada o un requisito obligatorio sin respuesta descalifica a un licitador hasta que la celda se reclasifique. La puntuación técnica es la suma ponderada de las puntuaciones de celda tomadas de una tabla editable de seis valores; la página muestra puntuación, puesto, margen al puesto 2, el menor cambio de un solo peso en puntos porcentuales que permite a otro licitador admitido superar al líder (exacto, lineal por tramos), y la estabilidad del puesto 1 sobre todos los vectores de peso dentro de ±x % (forma cerrada, igual a la enumeración exhaustiva de vértices). Las preguntas de aclaración se redactan por licitador para el registro de desviaciones, y la oferta seleccionada con sus desviaciones aceptadas se escribe en el paquete del proyecto.",
  "pl": "Wiersze to wymagania jednego zapotrzebowania technicznego wraz z klasą (obowiązkowe lub pożądane) i wagą; kolumny to oferenci. Każda komórka zapisuje: spełnia, przewyższa, odstępstwo z podanym skutkiem technicznym i decyzją o akceptacji, brak informacji albo nie dotyczy wraz z uzasadnieniem. Odrzucone odstępstwo lub wymaganie obowiązkowe bez odpowiedzi eliminuje oferenta do czasu przeklasyfikowania komórki. Ocena techniczna to ważona suma ocen komórek z edytowalnej tabeli sześciu wartości; strona podaje ocenę, miejsce, przewagę nad miejscem 2, najmniejszą zmianę pojedynczej wagi w punktach procentowych, po której inny dopuszczony oferent wyprzedza lidera (dokładnie, odcinkami liniowo), oraz stabilność miejsca 1 dla wszystkich wektorów wag w zakresie ±x % (postać zamknięta, równa pełnemu przeglądowi wierzchołków). Pytania wyjaśniające są redagowane dla każdego oferenta do przekazania do rejestru odstępstw, a wybrana oferta wraz z przyjętymi odstępstwami trafia do pakietu projektu."
 },

 "limitations": {
  "en": "Technical evaluation only: price, life-cycle cost and every other commercial term are outside the tool and must not be combined with this score. The classification of each answer and the acceptance of a deviation are the evaluator's engineering judgement; the tool records them and computes their consequences and reads no bid document. Scoring is a weighted sum over one six-value table, so grading inside a class (\"compliant, 7 of 10\") is not modelled. Not applicable is scored with its own table value and the row keeps its weight for every bidder. Knock-out acts on mandatory requirements only. Sensitivity varies one weight at a time and a box of independent relative weight changes; it varies neither cell scores nor the scoring table, and a row of weight 0 stays at 0. Bidders with an open or final knock-out are scored but not ranked and do not enter the sensitivity analysis. Clarification drafts become register items only in the deviation register. Limits: 2–10 bidders, 1–150 requirement rows. ISO 10845-1:2020 and Directive 2014/24/EU are cited as process context; no conformity with either is claimed.",
  "uk": "Лише технічна оцінка: ціна, вартість життєвого циклу та будь-які інші комерційні умови поза межами інструмента й не можуть поєднуватися з цим балом. Класифікація кожної відповіді та прийняття відхилення — інженерне судження оцінювача; інструмент фіксує їх і обчислює наслідки, а жодного документа пропозиції не читає. Оцінювання — зважена сума за однією таблицею з шести значень, тож градація всередині класу («відповідає, 7 з 10») не моделюється. «Незастосовно» отримує власне значення таблиці, а вага рядка зберігається для кожного учасника. Відсіювання діє лише за обов’язковими вимогами. Аналіз чутливості змінює одну вагу за раз і паралелепіпед незалежних відносних змін ваг; він не змінює ані балів комірок, ані таблиці оцінювання, а рядок з вагою 0 лишається 0. Учасники з відкритим або остаточним відсіюванням отримують бал, але не ранжуються й не входять до аналізу чутливості. Проєкти запитів стають записами реєстру лише в реєстрі відхилень. Межі: 2–10 учасників, 1–150 рядків вимог. ISO 10845-1:2020 і Директива 2014/24/ЄС наведені як контекст процесу; відповідність жодному з них не заявляється.",
  "de": "Nur technische Bewertung: Preis, Lebenszykluskosten und alle weiteren kaufmännischen Bedingungen liegen außerhalb des Werkzeugs und dürfen mit dieser Punktzahl nicht verrechnet werden. Die Einstufung jeder Antwort und die Annahme einer Abweichung sind das Ingenieururteil des Bewerters; das Werkzeug hält sie fest, rechnet ihre Folgen aus und liest kein Angebotsdokument. Die Bewertung ist eine gewichtete Summe über eine Sechs-Werte-Tabelle, eine Abstufung innerhalb einer Klasse („erfüllt, 7 von 10“) wird nicht abgebildet. „Nicht zutreffend“ erhält einen eigenen Tabellenwert, und das Gewicht der Zeile bleibt für jeden Bieter erhalten. Der Ausschluss wirkt nur auf Muss-Anforderungen. Die Sensitivität variiert ein Gewicht zugleich sowie einen Quader unabhängiger relativer Gewichtsänderungen; sie variiert weder Zellwerte noch die Bewertungstabelle, und eine Zeile mit Gewicht 0 bleibt bei 0. Bieter mit offenem oder endgültigem Ausschluss werden bewertet, aber nicht gereiht und gehen nicht in die Sensitivität ein. Rückfrage-Entwürfe werden erst im Abweichungsregister zu Registereinträgen. Grenzen: 2–10 Bieter, 1–150 Anforderungszeilen. ISO 10845-1:2020 und Richtlinie 2014/24/EU sind Prozesskontext; Konformität mit beiden wird nicht behauptet.",
  "nl": "Alleen technische beoordeling: prijs, levensduurkosten en elke andere commerciële voorwaarde vallen buiten de tool en mogen niet met deze score worden gecombineerd. De indeling van elk antwoord en de acceptatie van een afwijking zijn het ingenieursoordeel van de beoordelaar; de tool legt ze vast, rekent hun gevolgen uit en leest geen offertedocument. De scoring is een gewogen som over één tabel met zes waarden, dus gradaties binnen een klasse (\"voldoet, 7 van 10\") worden niet gemodelleerd. \"Niet van toepassing\" krijgt een eigen tabelwaarde en de rij behoudt haar gewicht voor elke inschrijver. Uitsluiting werkt alleen op verplichte eisen. De gevoeligheid varieert één gewicht tegelijk plus een blok onafhankelijke relatieve gewichtswijzigingen; zij varieert noch celscores noch de scoretabel, en een rij met gewicht 0 blijft 0. Inschrijvers met een open of definitieve uitsluiting krijgen een score maar geen rangorde en tellen niet mee in de gevoeligheid. Verduidelijkingsconcepten worden pas registeritems in het afwijkingenregister. Grenzen: 2–10 inschrijvers, 1–150 eisenrijen. ISO 10845-1:2020 en Richtlijn 2014/24/EU worden als proceskader genoemd; conformiteit met geen van beide wordt geclaimd.",
  "fr": "Évaluation technique seulement : le prix, le coût du cycle de vie et toute autre condition commerciale sont hors de l’outil et ne doivent pas être combinés à cette note. Le classement de chaque réponse et l’acceptation d’une dérogation relèvent du jugement d’ingénierie de l’évaluateur ; l’outil les enregistre, en calcule les conséquences et ne lit aucun document d’offre. La notation est une somme pondérée sur un barème de six valeurs : une graduation à l’intérieur d’une classe (« conforme, 7 sur 10 ») n’est pas modélisée. « Sans objet » reçoit sa propre valeur du barème et la ligne garde son poids pour chaque soumissionnaire. L’élimination ne porte que sur les exigences obligatoires. La sensibilité fait varier un poids à la fois ainsi qu’un pavé de variations relatives indépendantes ; elle ne fait varier ni les notes de cellule ni le barème, et une ligne de poids 0 reste à 0. Les soumissionnaires éliminés, de façon ouverte ou définitive, sont notés mais non classés et n’entrent pas dans la sensibilité. Les projets de clarification ne deviennent des entrées de registre que dans le registre des dérogations. Limites : 2 à 10 soumissionnaires, 1 à 150 lignes d’exigences. L’ISO 10845-1:2020 et la directive 2014/24/UE sont citées comme cadre de processus ; aucune conformité n’est revendiquée.",
  "es": "Solo evaluación técnica: el precio, el coste de ciclo de vida y cualquier otra condición comercial quedan fuera de la herramienta y no deben combinarse con esta puntuación. La clasificación de cada respuesta y la aceptación de una desviación son el juicio de ingeniería del evaluador; la herramienta las registra, calcula sus consecuencias y no lee ningún documento de oferta. La puntuación es una suma ponderada sobre una tabla de seis valores, por lo que no se modela una graduación dentro de una clase (\"cumple, 7 de 10\"). \"No aplicable\" recibe su propio valor de tabla y la fila conserva su peso para cada licitador. La exclusión actúa solo sobre requisitos obligatorios. La sensibilidad varía un peso cada vez y una caja de cambios relativos independientes de peso; no varía ni las puntuaciones de celda ni la tabla, y una fila de peso 0 permanece en 0. Los licitadores con exclusión abierta o definitiva se puntúan pero no se clasifican y no entran en la sensibilidad. Los borradores de aclaración se convierten en entradas de registro solo en el registro de desviaciones. Límites: 2–10 licitadores, 1–150 filas de requisitos. ISO 10845-1:2020 y la Directiva 2014/24/UE se citan como contexto de proceso; no se reclama conformidad con ninguna.",
  "pl": "Wyłącznie ocena techniczna: cena, koszt cyklu życia i wszelkie inne warunki handlowe są poza narzędziem i nie mogą być łączone z tą oceną. Klasyfikacja każdej odpowiedzi i przyjęcie odstępstwa to osąd inżynierski oceniającego; narzędzie je zapisuje, oblicza skutki i nie czyta żadnego dokumentu oferty. Ocena to ważona suma według jednej tabeli sześciu wartości, więc stopniowanie wewnątrz klasy („spełnia, 7 na 10”) nie jest modelowane. „Nie dotyczy” otrzymuje własną wartość z tabeli, a wiersz zachowuje wagę dla każdego oferenta. Eliminacja działa tylko na wymaganiach obowiązkowych. Analiza wrażliwości zmienia jedną wagę naraz oraz prostopadłościan niezależnych względnych zmian wag; nie zmienia ani ocen komórek, ani tabeli ocen, a wiersz o wadze 0 pozostaje przy 0. Oferenci z otwartą lub ostateczną eliminacją są oceniani, lecz nie są klasyfikowani i nie wchodzą do analizy wrażliwości. Projekty pytań stają się wpisami rejestru dopiero w rejestrze odstępstw. Granice: 2–10 oferentów, 1–150 wierszy wymagań. ISO 10845-1:2020 i dyrektywa 2014/24/UE są przywołane jako kontekst procesu; zgodność z żadną z nich nie jest deklarowana."
 },

 "validation": {
  "basis": {
   "en": "Four worked evaluations computed by hand from the tool specification (scores, ranks, knock-outs, the per-row critical weight change and the ±x stability bound) are reproduced by the page and asserted in an in-page self-test. The Python export re-runs the same arithmetic, compares the closed-form ±x minimum against explicit enumeration of all 2^n weight-box vertices, and re-derives the sensitivity relation of Triantaphyllou & Sánchez (1997) from the values printed in that paper. An independently authored corpus of 95 cases and 1 253 checks, written from the specification without access to this code, reproduces 95 of 95 against this build; grading it found three places where this page departed from the specification, all three corrected here, and an adjudicator independent of the corpus author and of this page ratified those three, corrected five corpus fixtures and amended four ambiguous specification clauses.",
   "uk": "Чотири опрацьовані оцінки, пораховані вручну за специфікацією інструмента (бали, ранги, відсіювання, критична зміна ваги за рядками та межа стійкості ±x), відтворюються сторінкою та перевіряються вбудованим самотестом. Експорт до Python повторює ту саму арифметику, порівнює замкнену форму мінімуму ±x із повним перебором усіх 2^n вершин паралелепіпеда ваг і повторно виводить співвідношення чутливості Triantaphyllou та Sánchez (1997) з надрукованих у статті значень. Незалежно написаний корпус із 95 випадків і 1 253 перевірок, складений за специфікацією без доступу до цього коду, відтворює 95 із 95 на цій збірці; звіряння виявило три місця, де ця сторінка відхилялася від специфікації, і всі три виправлено тут, а арбітр, незалежний від автора корпусу і від цієї сторінки, підтвердив ці три виправлення, виправив п’ять фікстур корпусу та уточнив чотири двозначні положення специфікації.",
   "de": "Vier von Hand aus der Werkzeugspezifikation gerechnete Bewertungen (Punktzahlen, Ränge, Ausschlüsse, die kritische Gewichtsänderung je Zeile und die ±x-Stabilitätsgrenze) werden von der Seite reproduziert und in einem seiteneigenen Selbsttest geprüft. Der Python-Export rechnet dieselbe Arithmetik nach, vergleicht das geschlossene ±x-Minimum mit der expliziten Aufzählung aller 2^n Ecken des Gewichtsquaders und leitet die Sensitivitätsbeziehung von Triantaphyllou und Sánchez (1997) aus den im Aufsatz gedruckten Werten neu her. Ein unabhängig verfasstes Korpus aus 95 Fällen und 1 253 Prüfungen, aus der Spezifikation ohne Zugriff auf diesen Code geschrieben, reproduziert gegen diesen Build 95 von 95; beim Abgleich traten drei Stellen zutage, an denen diese Seite von der Spezifikation abwich, alle drei hier korrigiert, und ein vom Korpusautor und von dieser Seite unabhängiger Schiedsrichter bestätigte diese drei, korrigierte fünf Korpus-Fixtures und präzisierte vier mehrdeutige Klauseln der Spezifikation.",
   "nl": "Vier met de hand uit de toolspecificatie berekende beoordelingen (scores, rangorden, uitsluitingen, de kritieke gewichtswijziging per rij en de ±x-stabiliteitsgrens) worden door de pagina gereproduceerd en in een zelftest op de pagina vastgelegd. De Python-export herhaalt dezelfde rekenkunde, vergelijkt het gesloten ±x-minimum met expliciete opsomming van alle 2^n hoekpunten van het gewichtsblok en leidt de gevoeligheidsrelatie van Triantaphyllou en Sánchez (1997) opnieuw af uit de in dat artikel afgedrukte waarden. Een onafhankelijk geschreven corpus van 95 gevallen en 1 253 controles, opgesteld uit de specificatie zonder toegang tot deze code, reproduceert 95 van de 95 tegen deze build; bij het afvinken kwamen drie plaatsen aan het licht waar deze pagina van de specificatie afweek, alle drie hier gecorrigeerd, en een arbiter die onafhankelijk is van de corpusauteur en van deze pagina bevestigde die drie, corrigeerde vijf corpusfixtures en verduidelijkte vier dubbelzinnige clausules van de specificatie.",
   "fr": "Quatre évaluations calculées à la main d’après la spécification de l’outil (notes, rangs, éliminations, variation critique de poids par ligne et borne de stabilité ±x) sont reproduites par la page et vérifiées par un auto-test intégré. L’export Python refait la même arithmétique, compare le minimum ±x en forme fermée à l’énumération explicite des 2^n sommets du pavé des poids, et redérive la relation de sensibilité de Triantaphyllou et Sánchez (1997) à partir des valeurs imprimées dans cet article. Un corpus rédigé indépendamment, 95 cas et 1 253 vérifications, écrit d’après la spécification sans accès à ce code, reproduit 95 cas sur 95 contre cette version ; la confrontation a révélé trois endroits où cette page s’écartait de la spécification, tous trois corrigés ici, et un arbitre indépendant de l’auteur du corpus et de cette page a ratifié ces trois corrections, corrigé cinq jeux d’essai du corpus et précisé quatre clauses ambiguës de la spécification.",
   "es": "Cuatro evaluaciones calculadas a mano a partir de la especificación de la herramienta (puntuaciones, puestos, exclusiones, el cambio crítico de peso por fila y el límite de estabilidad ±x) se reproducen en la página y se comprueban en una autoprueba integrada. La exportación a Python repite la misma aritmética, compara el mínimo ±x en forma cerrada con la enumeración explícita de los 2^n vértices de la caja de pesos y vuelve a derivar la relación de sensibilidad de Triantaphyllou y Sánchez (1997) a partir de los valores impresos en ese artículo. Un corpus redactado de forma independiente, 95 casos y 1 253 comprobaciones, escrito a partir de la especificación sin acceso a este código, reproduce 95 de 95 contra esta versión; el cotejo sacó a la luz tres puntos en los que esta página se apartaba de la especificación, los tres corregidos aquí, y un árbitro independiente del autor del corpus y de esta página ratificó esas tres correcciones, corrigió cinco casos de prueba del corpus y precisó cuatro cláusulas ambiguas de la especificación.",
   "pl": "Cztery oceny policzone ręcznie na podstawie specyfikacji narzędzia (oceny, miejsca, eliminacje, krytyczna zmiana wagi dla każdego wiersza i granica stabilności ±x) są odtwarzane przez stronę i sprawdzane wbudowanym autotestem. Eksport do Pythona powtarza tę samą arytmetykę, porównuje zamkniętą postać minimum ±x z jawnym przeglądem wszystkich 2^n wierzchołków prostopadłościanu wag i ponownie wyprowadza zależność wrażliwości Triantaphyllou i Sáncheza (1997) z wartości wydrukowanych w tym artykule. Niezależnie napisany korpus 95 przypadków i 1 253 sprawdzeń, opracowany na podstawie specyfikacji bez dostępu do tego kodu, odtwarza 95 z 95 na tej wersji; zestawienie ujawniło trzy miejsca, w których ta strona odbiegała od specyfikacji, wszystkie trzy poprawiono tutaj, a arbiter niezależny od autora korpusu i od tej strony zatwierdził te trzy poprawki, poprawił pięć zestawów testowych korpusu i doprecyzował cztery niejednoznaczne klauzule specyfikacji."

figContrib:{en:"Score contribution per requirement",uk:"Внесок кожної вимоги в бал",de:"Punktbeitrag je Anforderung",nl:"Scorebijdrage per eis",fr:"Contribution à la note par exigence",es:"Contribución a la puntuación por requisito",pl:"Wkład każdego wymagania w ocenę"},
figContribAlt:{en:"Horizontal stacked bar per bidder; each segment is one requirement's contribution in percentage points of technical score. Bars of bidders carrying a knock-out are hatched and labelled not ranked.",uk:"Горизонтальна складена смуга на кожного учасника; кожен сегмент — внесок однієї вимоги у відсоткових пунктах технічного балу. Смуги учасників із відсіюванням заштриховані й позначені «не ранжовано».",de:"Waagerechter Stapelbalken je Bieter; jedes Segment ist der Beitrag einer Anforderung in Prozentpunkten der technischen Punktzahl. Balken ausgeschlossener Bieter sind schraffiert und mit „nicht gereiht“ beschriftet.",nl:"Horizontale gestapelde balk per inschrijver; elk segment is de bijdrage van één eis in procentpunten van de technische score. Balken van uitgesloten inschrijvers zijn gearceerd en aangeduid als niet gerangschikt.",fr:"Barre empilée horizontale par soumissionnaire ; chaque segment est la contribution d’une exigence en points de pourcentage de la note technique. Les barres des soumissionnaires éliminés sont hachurées et annotées non classé.",es:"Barra apilada horizontal por licitador; cada segmento es la contribución de un requisito en puntos porcentuales de la puntuación técnica. Las barras de licitadores excluidos van rayadas y marcadas como sin clasificar.",pl:"Poziomy słupek skumulowany dla każdego oferenta; każdy segment to wkład jednego wymagania w punktach procentowych oceny technicznej. Słupki oferentów wyeliminowanych są kreskowane i opisane jako bez miejsca."},
figWeight:{en:"Score against the weight of the critical requirement",uk:"Бал залежно від ваги критичної вимоги",de:"Punktzahl über dem Gewicht der kritischen Anforderung",nl:"Score tegen het gewicht van de kritieke eis",fr:"Note en fonction du poids de l’exigence critique",es:"Puntuación frente al peso del requisito crítico",pl:"Ocena w funkcji wagi krytycznego wymagania"},
figWeightAlt:{en:"One line per qualified bidder: technical score as the normalised weight of the critical requirement runs from 0 to 100 %. A vertical marker shows the present weight and a dot marks the crossing where rank 1 changes owner.",uk:"По одній лінії на кожного придатного учасника: технічний бал, коли нормована вага критичної вимоги змінюється від 0 до 100 %. Вертикальна позначка показує поточну вагу, а точка — перетин, де змінюється власник першого місця.",de:"Eine Linie je zugelassenem Bieter: technische Punktzahl, während das normierte Gewicht der kritischen Anforderung von 0 bis 100 % läuft. Eine senkrechte Marke zeigt das aktuelle Gewicht, ein Punkt den Schnitt, an dem Rang 1 den Besitzer wechselt.",nl:"Eén lijn per toegelaten inschrijver: technische score terwijl het genormaliseerde gewicht van de kritieke eis van 0 tot 100 % loopt. Een verticale markering toont het huidige gewicht en een punt markeert de kruising waar rang 1 van eigenaar wisselt.",fr:"Une ligne par soumissionnaire admis : note technique lorsque le poids normalisé de l’exigence critique varie de 0 à 100 %. Un repère vertical indique le poids actuel et un point marque le croisement où le rang 1 change de titulaire.",es:"Una línea por licitador admitido: puntuación técnica mientras el peso normalizado del requisito crítico va de 0 a 100 %. Una marca vertical señala el peso actual y un punto marca el cruce donde el puesto 1 cambia de dueño.",pl:"Jedna linia na dopuszczonego oferenta: ocena techniczna, gdy znormalizowana waga krytycznego wymagania zmienia się od 0 do 100 %. Pionowy znacznik pokazuje bieżącą wagę, a kropka — przecięcie, w którym miejsce 1 zmienia właściciela."},
axisWeight:{en:"Weight of {row}, %",uk:"Вага {row}, %",de:"Gewicht von {row}, %",nl:"Gewicht van {row}, %",fr:"Poids de {row}, %",es:"Peso de {row}, %",pl:"Waga {row}, %"},
axisScore:{en:"Technical score, %",uk:"Технічний бал, %",de:"Technische Punktzahl, %",nl:"Technische score, %",fr:"Note technique, %",es:"Puntuación técnica, %",pl:"Ocena techniczna, %"},
figNoSens:{en:"No single weight change alters rank 1, so there is no crossing to draw.",uk:"Жодна зміна однієї ваги не змінює перше місце, тож перетину немає.",de:"Keine Änderung eines einzelnen Gewichts kippt Rang 1, es gibt keinen Schnitt zu zeichnen.",nl:"Geen enkele gewichtswijziging keert rang 1 om, dus er is geen kruising te tekenen.",fr:"Aucune variation d’un seul poids ne renverse le rang 1 : il n’y a pas de croisement à tracer.",es:"Ningún cambio de un solo peso altera el puesto 1, por lo que no hay cruce que dibujar.",pl:"Żadna zmiana pojedynczej wagi nie zmienia miejsca 1, więc nie ma przecięcia do narysowania."},

learnIntroTitle:{en:"What this page decides and what it does not",uk:"Що ця сторінка вирішує, а що — ні",de:"Was diese Seite entscheidet und was nicht",nl:"Wat deze pagina beslist en wat niet",fr:"Ce que cette page décide et ce qu’elle ne décide pas",es:"Qué decide esta página y qué no",pl:"Co ta strona rozstrzyga, a czego nie"},
learnIntroBody:{en:"You classify each bidder's answer to each requirement. The page turns those classifications into a weighted technical score, applies the knock-out rule to mandatory requirements, ranks the bidders that remain, and states how far a weight would have to move before rank 1 changes hands. Price stays outside.",uk:"Ви класифікуєте відповідь кожного учасника на кожну вимогу. Сторінка перетворює ці класифікації на зважений технічний бал, застосовує правило відсіювання до обов’язкових вимог, ранжує тих, хто залишився, і показує, наскільки має змінитися вага, щоб перше місце перейшло іншому. Ціна лишається поза межами.",de:"Sie stufen die Antwort jedes Bieters auf jede Anforderung ein. Die Seite macht daraus eine gewichtete technische Punktzahl, wendet die Ausschlussregel auf Muss-Anforderungen an, reiht die verbleibenden Bieter und gibt an, wie weit ein Gewicht wandern müsste, bis Rang 1 den Besitzer wechselt. Der Preis bleibt außen vor.",nl:"U deelt het antwoord van elke inschrijver op elke eis in. De pagina maakt daar een gewogen technische score van, past de uitsluitingsregel toe op verplichte eisen, rangschikt wie overblijft en zegt hoever een gewicht zou moeten verschuiven voordat rang 1 van eigenaar wisselt. Prijs blijft erbuiten.",fr:"Vous classez la réponse de chaque soumissionnaire à chaque exigence. La page en tire une note technique pondérée, applique la règle d’élimination aux exigences obligatoires, classe ceux qui restent et indique de combien un poids devrait bouger pour que le rang 1 change de titulaire. Le prix reste en dehors.",es:"Usted clasifica la respuesta de cada licitador a cada requisito. La página convierte esas clasificaciones en una puntuación técnica ponderada, aplica la regla de exclusión a los requisitos obligatorios, clasifica a los que quedan e indica cuánto tendría que moverse un peso antes de que el puesto 1 cambie de dueño. El precio queda fuera.",pl:"Klasyfikujesz odpowiedź każdego oferenta na każde wymaganie. Strona zamienia te klasyfikacje w ważoną ocenę techniczną, stosuje regułę eliminacji do wymagań obowiązkowych, porządkuje pozostałych i podaje, o ile musiałaby się zmienić waga, zanim miejsce 1 zmieni właściciela. Cena pozostaje poza zakresem."},
learnKoTitle:{en:"The knock-out rule",uk:"Правило відсіювання",de:"Die Ausschlussregel",nl:"De uitsluitingsregel",fr:"La règle d’élimination",es:"La regla de exclusión",pl:"Reguła eliminacji"},
learnKoBody:{en:"A rejected deviation on a mandatory requirement is a final knock-out. Missing information, an unclassified answer or a deviation still pending on a mandatory requirement is an open knock-out: it closes when the cell is re-classified, and marking the clarification closed while the answer is still missing does not close it. A desirable requirement never disqualifies.",uk:"Не прийняте відхилення за обов’язковою вимогою — остаточне відсіювання. Брак інформації, некласифікована відповідь або відхилення, що досі на розгляді, за обов’язковою вимогою — відкрите відсіювання: воно закривається, коли комірку перекласифікують, і позначення роз’яснення закритим, поки відповіді бракує, його не закриває. Бажана вимога ніколи не знімає з розгляду.",de:"Eine abgelehnte Abweichung bei einer Muss-Anforderung ist ein endgültiger Ausschluss. Eine fehlende Angabe, eine nicht eingestufte Antwort oder eine noch offene Abweichung bei einer Muss-Anforderung ist ein offener Ausschluss: er schließt sich, wenn die Zelle neu eingestuft wird; die Rückfrage als geschlossen zu markieren, während die Antwort fehlt, schließt ihn nicht. Eine Wunsch-Anforderung schließt nie aus.",nl:"Een afgewezen afwijking op een verplichte eis is een definitieve uitsluiting. Ontbrekende informatie, een niet-ingedeeld antwoord of een nog openstaande afwijking op een verplichte eis is een open uitsluiting: die sluit wanneer de cel opnieuw wordt ingedeeld, en de verduidelijking op gesloten zetten terwijl het antwoord ontbreekt sluit haar niet. Een gewenste eis sluit nooit uit.",fr:"Une dérogation refusée sur une exigence obligatoire est une élimination définitive. Une information manquante, une réponse non classée ou une dérogation encore en attente sur une exigence obligatoire est une élimination ouverte : elle se referme quand la cellule est reclassée, et marquer la clarification comme fermée alors que la réponse manque ne la referme pas. Une exigence souhaitable n’élimine jamais.",es:"Una desviación rechazada en un requisito obligatorio es una exclusión definitiva. Información faltante, una respuesta sin clasificar o una desviación aún pendiente en un requisito obligatorio es una exclusión abierta: se cierra cuando la celda se reclasifica, y marcar la aclaración como cerrada mientras falta la respuesta no la cierra. Un requisito deseable nunca descalifica.",pl:"Odrzucone odstępstwo przy wymaganiu obowiązkowym to eliminacja ostateczna. Brak informacji, odpowiedź niesklasyfikowana lub odstępstwo wciąż w toku przy wymaganiu obowiązkowym to eliminacja otwarta: zamyka się, gdy komórka zostanie przeklasyfikowana, a oznaczenie wyjaśnienia jako zamknięte przy wciąż brakującej odpowiedzi jej nie zamyka. Wymaganie pożądane nigdy nie eliminuje."},
learnSensTitle:{en:"The two sensitivity figures",uk:"Дві величини чутливості",de:"Die zwei Sensitivitätsgrößen",nl:"De twee gevoeligheidsgetallen",fr:"Les deux mesures de sensibilité",es:"Las dos medidas de sensibilidad",pl:"Dwie miary wrażliwości"},
learnSensBody:{en:"The critical weight change moves one row's share of the weight and keeps the ratios among the other rows; the score of every bidder is then linear in that share, and the reported value is the nearest crossing of the leader's line with a challenger's. The ±x figure lets every raw weight move independently inside a band; the worst case of a linear function over a box sits at a corner, and the closed form printed here equals enumerating all corners.",uk:"Критична зміна ваги рухає частку одного рядка, зберігаючи співвідношення між іншими рядками; бал кожного учасника тоді лінійний за цією часткою, а показане значення — найближчий перетин лінії лідера з лінією суперника. Величина ±x дозволяє кожній сирій вазі рухатися незалежно в межах смуги; найгірший випадок лінійної функції на паралелепіпеді лежить у вершині, і надрукована тут замкнена форма дорівнює перебору всіх вершин.",de:"Die kritische Gewichtsänderung verschiebt den Anteil einer Zeile und hält die Verhältnisse der übrigen Zeilen; die Punktzahl jedes Bieters ist dann linear in diesem Anteil, und der ausgewiesene Wert ist der nächste Schnitt der Linie des Führenden mit der eines Verfolgers. Die ±x-Größe lässt jedes Rohgewicht unabhängig in einem Band wandern; der schlechteste Fall einer linearen Funktion über einem Quader liegt in einer Ecke, und die hier gedruckte geschlossene Form entspricht der Aufzählung aller Ecken.",nl:"De kritieke gewichtswijziging verschuift het aandeel van één rij en houdt de verhoudingen tussen de andere rijen vast; de score van elke inschrijver is dan lineair in dat aandeel, en de gerapporteerde waarde is de dichtstbijzijnde kruising van de lijn van de koploper met die van een uitdager. Het ±x-getal laat elk ruw gewicht onafhankelijk binnen een band bewegen; het slechtste geval van een lineaire functie over een blok ligt in een hoekpunt, en de hier gedrukte gesloten vorm is gelijk aan het opsommen van alle hoekpunten.",fr:"La variation critique de poids déplace la part d’une ligne en conservant les rapports entre les autres lignes ; la note de chaque soumissionnaire est alors linéaire en cette part, et la valeur indiquée est le croisement le plus proche entre la ligne du premier et celle d’un concurrent. La mesure ±x laisse chaque poids brut bouger indépendamment dans une bande ; le pire cas d’une fonction linéaire sur un pavé est à un sommet, et la forme fermée imprimée ici égale l’énumération de tous les sommets.",es:"El cambio crítico de peso mueve la cuota de una fila y conserva las proporciones entre las demás filas; la puntuación de cada licitador es entonces lineal en esa cuota, y el valor mostrado es el cruce más cercano entre la línea del líder y la de un rival. La medida ±x deja que cada peso bruto se mueva de forma independiente dentro de una banda; el peor caso de una función lineal sobre una caja está en un vértice, y la forma cerrada impresa aquí equivale a enumerar todos los vértices.",pl:"Krytyczna zmiana wagi przesuwa udział jednego wiersza, zachowując proporcje między pozostałymi wierszami; ocena każdego oferenta jest wtedy liniowa względem tego udziału, a podana wartość to najbliższe przecięcie linii lidera z linią rywala. Miara ±x pozwala każdej wadze surowej poruszać się niezależnie w paśmie; najgorszy przypadek funkcji liniowej na prostopadłościanie leży w wierzchołku, a wydrukowana tu postać zamknięta równa się przeglądowi wszystkich wierzchołków."},

p1Note:{en:"One percentage point separates rank 1 from rank 2, and 2.9 pp of one weight reverses it.",uk:"Перше й друге місця розділяє один відсотковий пункт, а 2,9 п.п. однієї ваги змінюють їх місцями.",de:"Ein Prozentpunkt trennt Rang 1 von Rang 2, und 2,9 Prozentpunkte eines Gewichts drehen die Reihenfolge um.",nl:"Eén procentpunt scheidt rang 1 van rang 2, en 2,9 procentpunt van één gewicht draait het om.",fr:"Un point de pourcentage sépare le rang 1 du rang 2, et 2,9 points d’un seul poids l’inverse.",es:"Un punto porcentual separa el puesto 1 del puesto 2, y 2,9 puntos de un solo peso lo invierten.",pl:"Jeden punkt procentowy dzieli miejsce 1 od miejsca 2, a 2,9 p.p. jednej wagi odwraca kolejność."},

repExec:{en:"{n} {n|bid was|bids were} evaluated against requisition {rq} revision {rev}, requirement by requirement. {q} of them {q|qualifies|qualify} after the knock-out rule. Price, life-cycle cost and every other commercial term are outside this evaluation and are not part of the score below.",uk:"Оцінено пропозицій: {n} — за заявкою {rq} ревізії {rev}, вимога за вимогою. Після правила відсіювання придатних: {q}. Ціна, вартість життєвого циклу та будь-які інші комерційні умови поза цією оцінкою й не входять до наведеного бала.",de:"{n} {n|Angebot wurde|Angebote wurden} gegen die Anfragespezifikation {rq} Revision {rev} Anforderung für Anforderung bewertet. Nach der Ausschlussregel {q|ist|sind} {q} zugelassen. Preis, Lebenszykluskosten und alle weiteren kaufmännischen Bedingungen liegen außerhalb dieser Bewertung und gehen nicht in die Punktzahl ein.",nl:"{n} {n|offerte is|offertes zijn} eis voor eis beoordeeld tegen aanvraagspecificatie {rq} revisie {rev}. Na de uitsluitingsregel {q|komt|komen} er {q} in aanmerking. Prijs, levensduurkosten en elke andere commerciële voorwaarde vallen buiten deze beoordeling en zitten niet in de score hieronder.",fr:"{n} {n|offre a été évaluée|offres ont été évaluées} face à la réquisition {rq} révision {rev}, exigence par exigence. {q} {q|reste admise|restent admises} après la règle d’élimination. Le prix, le coût du cycle de vie et toute autre condition commerciale sont hors de cette évaluation et n’entrent pas dans la note ci-dessous.",es:"Se {n|evaluó|evaluaron} {n} {n|oferta|ofertas} frente a la requisición {rq} revisión {rev}, requisito por requisito. Tras la regla de exclusión {q|queda admitida|quedan admitidas} {q}. El precio, el coste de ciclo de vida y cualquier otra condición comercial quedan fuera de esta evaluación y no forman parte de la puntuación.",pl:"Oceniono {n} {n|ofertę|oferty|ofert} wobec zapotrzebowania {rq} rewizja {rev}, wymaganie po wymaganiu. Po regule eliminacji dopuszczonych jest {q}. Cena, koszt cykl repMethodKo:{en:"A rejected deviation on a mandatory requirement is a final knock-out; missing information, an unclassified answer or a pending deviation on a mandatory requirement is an open knock-out. Knocked-out bidders keep a score and take no rank.",uk:"Не прийняте відхилення за обов’язковою вимогою — остаточне відсіювання; брак інформації, некласифікована відповідь або відхилення на розгляді за обов’язковою вимогою — відкрите відсіювання. Відсіяні учасники зберігають бал і не отримують рангу.",de:"Eine abgelehnte Abweichung bei einer Muss-Anforderung ist ein endgültiger Ausschluss; eine fehlende Angabe, eine nicht eingestufte Antwort oder eine offene Abweichung bei einer Muss-Anforderung ist ein offener Ausschluss. Ausgeschlossene Bieter behalten eine Punktzahl und erhalten keinen Rang.",nl:"Een afgewezen afwijking op een verplichte eis is een definitieve uitsluiting; ontbrekende informatie, een niet-ingedeeld antwoord of een openstaande afwijking op een verplichte eis is een open uitsluiting. Uitgesloten inschrijvers houden een score en krijgen geen rang.",fr:"Une dérogation refusée sur une exigence obligatoire est une élimination définitive ; une information manquante, une réponse non classée ou une dérogation en attente sur une exigence obligatoire est une élimination ouverte. Les soumissionnaires éliminés gardent une note et ne prennent pas de rang.",es:"Una desviación rechazada en un requisito obligatorio es una exclusión definitiva; información faltante, una respuesta sin clasificar o una desviación pendiente en un requisito obligatorio es una exclusión abierta. Los licitadores excluidos conservan puntuación y no ocupan puesto.",pl:"Odrzucone odstępstwo przy wymaganiu obowiązkowym to eliminacja ostateczna; brak informacji, odpowiedź niesklasyfikowana lub odstępstwo w toku przy wymaganiu obowiązkowym to eliminacja otwarta. Wyeliminowani oferenci zachowują ocenę i nie otrzymują miejsca."},
repMethodProv:{en:"A score is provisional while the bidder has an unclassified answer or a deviation still pending; an unclassified answer scores as missing information and a pending deviation as a rejected one until it is decided.",uk:"Бал є попереднім, поки в учасника є некласифікована відповідь або відхилення на розгляді; некласифікована відповідь оцінюється як брак інформації, а відхилення на розгляді — як не прийняте, доки не вирішено.",de:"Eine Punktzahl ist vorläufig, solange der Bieter eine nicht eingestufte Antwort oder eine offene Abweichung hat; eine nicht eingestufte Antwort zählt wie eine fehlende Angabe und eine offene Abweichung wie eine abgelehnte, bis entschieden ist.",nl:"Een score is voorlopig zolang de inschrijver een niet-ingedeeld antwoord of een openstaande afwijking heeft; een niet-ingedeeld antwoord telt als ontbrekende informatie en een openstaande afwijking als een afgewezen afwijking tot er is beslist.",fr:"Une note est provisoire tant que le soumissionnaire a une réponse non classée ou une dérogation en attente ; une réponse non classée compte comme information manquante et une dérogation en attente comme une dérogation refusée jusqu’à décision.",es:"Una puntuación es provisional mientras el licitador tenga una respuesta sin clasificar o una desviación pendiente; una respuesta sin clasificar puntúa como información faltante y una desviación pendiente como rechazada hasta que se decida.",pl:"Ocena jest wstępna, dopóki oferent ma odpowiedź niesklasyfikowaną lub odstępstwo w toku; odpowiedź niesklasyfikowana liczy się jak brak informacji, a odstępstwo w toku jak odrzucone, dopóki nie zapadnie decyzja."},
repMethodBox:{en:"The weight box lets each raw weight move independently between w(1−x) and w(1+x) with the scores renormalised; the minimum of a linear function over that box sits at a vertex, so the closed form reported here equals enumerating all 2^n vertices.",uk:"Діапазон ваг дозволяє кожній сирій вазі рухатися незалежно між w(1−x) і w(1+x) з повторною нормалізацією балів; мінімум лінійної функції на цьому паралелепіпеді лежить у вершині, тож наведена тут замкнена форма дорівнює перебору всіх 2^n вершин.",de:"Der Gewichtsquader lässt jedes Rohgewicht unabhängig zwischen w(1−x) und w(1+x) wandern, die Punktzahlen werden neu normiert; das Minimum einer linearen Funktion über diesem Quader liegt in einer Ecke, daher entspricht die hier ausgewiesene geschlossene Form der Aufzählung aller 2^n Ecken.",nl:"Het gewichtsblok laat elk ruw gewicht onafhankelijk bewegen tussen w(1−x) en w(1+x) met hernormalisatie van de scores; het minimum van een lineaire functie over dat blok ligt in een hoekpunt, dus de hier gerapporteerde gesloten vorm is gelijk aan het opsommen van alle 2^n hoekpunten.",fr:"Le pavé des poids laisse chaque poids brut bouger indépendamment entre w(1−x) et w(1+x), les notes étant renormalisées ; le minimum d’une fonction linéaire sur ce pavé est à un sommet, donc la forme fermée donnée ici égale l’énumération des 2^n sommets.",es:"La caja de pesos deja que cada peso bruto se mueva independientemente entre w(1−x) y w(1+x) con las puntuaciones renormalizadas; el mínimo de una función lineal sobre esa caja está en un vértice, por lo que la forma cerrada aquí indicada equivale a enumerar los 2^n vértices.",pl:"Prostopadłościan wag pozwala każdej wadze surowej poruszać się niezależnie między w(1−x) a w(1+x) przy ponownej normalizacji ocen; minimum funkcji liniowej na tym prostopadłościanie leży w wierzchołku, więc podana tu postać zamknięta równa się przeglądowi wszystkich 2^n wierzchołków."},

/* Where a rule comes from, in seven languages. Standard and contract names are
   proper names and stay as printed; only the words around them are localised. */
var BASIS={
 author:{en:"author method",uk:"метод автора",de:"Methode des Autors",nl:"methode van de auteur",fr:"méthode de l’auteur",es:"método del autor",pl:"metoda autora"},

 context:{en:"context",uk:"контекст",de:"Kontext",nl:"context",fr:"contexte",es:"contexto",pl:"kontekst"}
};
function ruleBasis(id,l){
 var r=RULES[id]; if(!r) return '';
 var parts=[];
 if(r.bk) parts.push(tx(BASIS[r.bk],l));
 if(r.br) parts.push(r.br+(r.bc?' ('+tx(BASIS.context,l)+')':''));
 return parts.join('; ');
}

};

/* ---- computation core: SPEC sections 3 to 6 ---- */
var EPS = 1e-9;            /* score-equality tolerance, percentage points */
var LIN = 1e-12;           /* slope / interior-crossing tolerance of 4.5 */
var STATE_SCHEMA = 'tools.petrov.re/bidevaluation-state/v1';
var SCORE_KEYS = ['exceeds', 'compliant', 'deviation_accepted', 'deviation_rejected', 'missing', 'not_applicable'];
var DEFAULT_TABLE = { exceeds: 10, compliant: 8, deviation_accepted: 5, deviation_rejected: 0, missing: 0, not_applicable: 8 };
var STATUSES = ['open', 'compliant', 'exceeds', 'deviation', 'missing', 'not_applicable'];
var RE_BIDDER = /^[A-Z0-9][A-Z0-9_-]{0,15}$/;
var RE_LOCAL_REQ = /^[A-Za-z0-9][A-Za-z0-9._-]{0,39}$/;
var RE_EVAL_ID = /^BE-[A-Z0-9][A-Z0-9-]{0,47}$/;
var MAX_ROWS = 150, MIN_BIDDERS = 2, MAX_BIDDERS = 10;

function trim(s) { return String(s == null ? '' : s).trim(); }
function empty(s) { return trim(s) === ''; }
function finite(v) { return typeof v === 'number' && isFinite(v); }
function clone(x) { return JSON.parse(JSON.stringify(x)); }
function has(o, k) { return !!o && Object.prototype.hasOwnProperty.call(o, k); }
/* Every map below is keyed by a string the user typed. A plain {} inherits
   Object.prototype, so a requirement id of "toString" or "constructor" read
   back truthy and satisfied the duplicate-id test of BID-R-005 on its first
   occurrence. nmap() has no prototype, so only keys that were written are
   readable. Bidder ids cannot reach this (RE_BIDDER excludes every
   Object.prototype name), requirement ids can. */
function nmap() { return Object.create(null); }

/* 3.3 slug: uppercase, every run outside [A-Z0-9] becomes one '-', trimmed,
   truncated to 40 and trimmed again. */
function slug(s) {
  var u = String(s == null ? '' : s).toUpperCase().replace(/[^A-Z0-9]+/g, '-');
  u = u.replace(/^-+/, '').replace(/-+$/, '').slice(0, 40).replace(/-+$/, '');
  return u;
}
function derivedEvaluationId(ev) {
  var rq = trim(ev && ev.requisition_id);
  if (rq.indexOf('RQN-') === 0) return 'BE-' + slug(rq.slice(4));
  if (rq) return 'BE-' + slug(rq);
  var s = slug(trim(ev && ev.title));
  return 'BE-' + (s || '1');
}

function defaultState() {
  return {
    schema: STATE_SCHEMA,
    evaluation: { id: '', title: '', requisition_id: '', requisition_revision: '', package_id: '',
                  package_name: '', system_id: '', project_name: '', project_reference: '',
                  evaluator: '', evaluation_date: '' },
    settings: { x_pct: 20, threshold_pp: 5 },
    scoring_table: { exceeds: 10, compliant: 8, deviation_accepted: 5, deviation_rejected: 0, missing: 0, not_applicable: 8 },
    requirements: [],
    bidders: [ { id: 'A', name: '', offer_ref: '' }, { id: 'B', name: '', offer_ref: '' } ],
    cells: [],
    selection: { bidder_id: '', rationale: '', selected_at: '' }
  };
}

function defaultCell(rid, bid) {
  return { requirement_id: rid, bidder_id: bid, status: 'open', deviation_text: '', consequence: '',
           acceptance: 'pending', acceptance_basis: '', na_reason: '', note: '',
           clarification: { question: '', status: 'open', answer: '' } };
}

/* Fields outside the current status are kept, so switching a status back does
   not lose typing (3.2). */
function normCell(c) {
  var d = defaultCell(trim(c && c.requirement_id), trim(c && c.bidder_id));
  if (!c) return d;
  d.status = STATUSES.indexOf(c.status) >= 0 ? c.status : 'open';
  d.deviation_text = String(c.deviation_text == null ? '' : c.deviation_text);
  d.consequence = String(c.consequence == null ? '' : c.consequence);
  d.acceptance = ['pending', 'accepted', 'rejected'].indexOf(c.acceptance) >= 0 ? c.acceptance : 'pending';
  d.acceptance_basis = String(c.acceptance_basis == null ? '' : c.acceptance_basis);
  d.na_reason = String(c.na_reason == null ? '' : c.na_reason);
  d.note = String(c.note == null ? '' : c.note);
  var cl = c.clarification || {};
  d.clarification = { question: String(cl.question == null ? '' : cl.question),
                      status: cl.status === 'closed' ? 'closed' : 'open',
                      answer: String(cl.answer == null ? '' : cl.answer) };
  return d;
}

function normState(input) {
  var d = defaultState(), s = input || {};
  d.schema = STATE_SCHEMA;
  var e = s.evaluation || {};
  Object.keys(d.evaluation).forEach(function (k) { d.evaluation[k] = String(e[k] == null ? '' : e[k]); });
  var st = s.settings || {};
  d.settings.x_pct = has(st, 'x_pct') && st.x_pct !== '' && st.x_pct != null ? Number(st.x_pct) : 20;
  d.settings.threshold_pp = has(st, 'threshold_pp') && st.threshold_pp !== '' && st.threshold_pp != null ? Number(st.threshold_pp) : 5;
  var tb = s.scoring_table || {};
  SCORE_KEYS.forEach(function (k) { d.scoring_table[k] = has(tb, k) ? Number(tb[k]) : DEFAULT_TABLE[k]; });
  d.requirements = (Array.isArray(s.requirements) ? s.requirements : []).map(function (r) {
    return { id: trim(r && r.id), text: String(r && r.text != null ? r.text : ''),
             'class': (r && r['class']) === 'desirable' ? 'desirable' : 'mandatory',
             weight: r && has(r, 'weight') && r.weight !== '' && r.weight != null ? Number(r.weight) : 1,
             source: (r && r.source) === 'package' ? 'package' : 'local',
             ref: String(r && r.ref != null ? r.ref : '') };
  });
  d.bidders = (Array.isArray(s.bidders) ? s.bidders : []).map(function (b) {
    return { id: trim(b && b.id), name: String(b && b.name != null ? b.name : ''),
             offer_ref: String(b && b.offer_ref != null ? b.offer_ref : '') };
  });
  if (!Array.isArray(s.bidders)) d.bidders = defaultState().bidders;
  d.cells = (Array.isArray(s.cells) ? s.cells : []).map(normCell);
  var sel = s.selection || {};
  d.selection = { bidder_id: trim(sel.bidder_id), rationale: String(sel.rationale == null ? '' : sel.rationale),
                  selected_at: String(sel.selected_at == null ? '' : sel.selected_at) };
  return d;
}

/* ---------------- 4.2 cell score ---------------- */
function scoreKeyOf(cell) {
  var s = cell ? cell.status : 'open';
  if (s === 'exceeds') return 'exceeds';
  if (s === 'compliant') return 'compliant';
  if (s === 'not_applicable') return 'not_applicable';
  if (s === 'deviation') return (cell && cell.acceptance) === 'accepted' ? 'deviation_accepted' : 'deviation_rejected';
  return 'missing';                       /* missing, and open as provisional */
}

/* ---------------- 4.8 clarification drafts ---------------- */
function draftKind(cell) {
  var s = cell ? cell.status : 'open';
  if (s === 'missing') return 'missing_information';
  if (s === 'deviation' && (!cell.acceptance || cell.acceptance === 'pending')) return 'deviation_acceptance';
  return null;
}

/* ---------------- the evaluation ---------------- */
function evaluate(input, pkgCtx) {
  var S = normState(input);
  var ctx = pkgCtx || {};
  var pkg = ctx.loaded ? (ctx.package || null) : null;
  var R = {
    state: S, rules: [], computed: false,
    evaluation_id: trim(S.evaluation.id) || derivedEvaluationId(S.evaluation),
    evaluation_id_derived: derivedEvaluationId(S.evaluation),
    rows: [], bidders: [], cellIndex: {}, W: 0, sMax: 0,
    Q: [], leaderSet: [], leader: null, margin: null,
    sens: { rows: [], deltaStar: null, criticalRow: null, challenger: null },
    stability: { xCrit: null, challenger: null, stable: null, pairs: [] },
    drafts: [], verdict: 'INVALID', sensitive: false,
    counts: { blocker: 0, major: 0, minor: 0, info: 0 },
    writeAllowed: false
  };
  function fire(id, sev, target, vars) { R.rules.push({ id: id, sev: sev, target: target || null, vars: vars || {} }); }

  var reqs = S.requirements, bids = S.bidders;

  /* --- structural blockers 001-008 --- */
  if (bids.length < MIN_BIDDERS) fire('BID-R-001', 'blocker', { kind: 'evaluation' }, { n: bids.length });
  if (bids.length > MAX_BIDDERS) fire('BID-R-002', 'blocker', { kind: 'evaluation' }, { n: bids.length });
  var seenB = nmap();
  bids.forEach(function (b, i) {
    var bad = empty(b.id) || !RE_BIDDER.test(b.id) || seenB[b.id];
    if (!seenB[b.id]) seenB[b.id] = 1;
    if (bad) fire('BID-R-003', 'blocker', { kind: 'bidder', index: i, id: b.id }, { id: b.id });
  });
  if (reqs.length === 0) fire('BID-R-004', 'blocker', { kind: 'evaluation' }, {});
  var seenR = nmap();
  reqs.forEach(function (r, i) {
    var bad = empty(r.id) || seenR[r.id];
    if (!seenR[r.id]) seenR[r.id] = 1;
    if (bad) fire('BID-R-005', 'blocker', { kind: 'requirement', index: i, id: r.id }, { id: r.id });
  });
  if (reqs.length > MAX_ROWS) fire('BID-R-005', 'blocker', { kind: 'evaluation' }, { n: reqs.length });
  var badWeight = false;
  reqs.forEach(function (r, i) {
    if (!finite(r.weight) || r.weight < 0) { badWeight = true; fire('BID-R-006', 'blocker', { kind: 'requirement', index: i, id: r.id }, { w: r.weight }); }
  });
  var W = 0; reqs.forEach(function (r) { if (finite(r.weight) && r.weight >= 0) W += r.weight; });
  /* Each weight can be finite while the sum is not: two rows at 1e308 overflow
     to Infinity, every omega_i = w_i / W becomes 0, and 4.3 then returned
     0.0000 % for every bidder, a three-way tie at rank 1 and a permitted
     package write. 4.1 assumes 0 < W < Infinity; the sum is tested for both
     ends here. This widens the SPEC 5 trigger of BID-R-007 from
     "Sum weight = 0" to "the weight sum is not a positive finite number";
     it is the divergence declared in DELIVERY.md 4, item 5. */
  if (!badWeight && reqs.length && (W === 0 || !isFinite(W))) fire('BID-R-007', 'blocker', { kind: 'evaluation' }, {});
  var tableBad = false, allZero = true;
  SCORE_KEYS.forEach(function (k) {
    var v = S.scoring_table[k];
    if (!finite(v) || v < 0 || v > 10) tableBad = true;
    if (finite(v) && v !== 0) allZero = false;
  });
  if (tableBad || allZero) fire('BID-R-008', 'blocker', { kind: 'evaluation' }, {});

  /* --- cells index, 009 --- */
  var rowIds = nmap(), bidIds = nmap();
  reqs.forEach(function (r) { rowIds[r.id] = true; });
  bids.forEach(function (b) { bidIds[b.id] = true; });
  var index = nmap();
  S.cells.forEach(function (c, i) {
    var key = c.requirement_id + '\u0000' + c.bidder_id;
    if (!rowIds[c.requirement_id] || !bidIds[c.bidder_id] || index[key]) {
      fire('BID-R-009', 'minor', { kind: 'cell', index: i, requirement_id: c.requirement_id, bidder_id: c.bidder_id }, {});
      return;
    }
    index[key] = c;
  });
  R.cellIndex = index;
  function cellAt(rid, bid) { return index[rid + '\u0000' + bid] || null; }
  R.cellAt = cellAt;

  var blockers = R.rules.filter(function (x) { return x.sev === 'blocker'; });
  var structural = blockers.some(function (x) { return /^BID-R-00[1-8]$/.test(x.id); });
  R.computed = !structural;

  /* --- selection and identity rules that need no computation --- */
  var sel = S.selection, selBidder = null;
  bids.forEach(function (b) { if (b.id === sel.bidder_id) selBidder = b; });
  if (empty(sel.bidder_id)) fire('BID-R-050', 'info', { kind: 'selection' }, {});
  else if (!selBidder) fire('BID-R-051', 'blocker', { kind: 'selection' }, { id: sel.bidder_id });
  if (!empty(sel.bidder_id) && empty(sel.rationale)) fire('BID-R-054', 'blocker', { kind: 'selection' }, {});
  if (empty(S.evaluation.requisition_id)) fire('BID-R-060', 'major', { kind: 'evaluation' }, {});
  if (!RE_EVAL_ID.test(R.evaluation_id)) fire('BID-R-070', 'blocker', { kind: 'evaluation' }, { id: R.evaluation_id });

  /* --- package-dependent rules --- */
  var requisition = null, pkgReqById = nmap(), pkgEvalClash = false;
  if (pkg) {
    var rql = Array.isArray(pkg.requisitions) ? pkg.requisitions : [];
    if (!empty(S.evaluation.requisition_id)) {
      rql.forEach(function (q) { if (q && trim(q.id) === S.evaluation.requisition_id) requisition = q; });
      if (!requisition) fire('BID-R-061', 'major', { kind: 'evaluation' }, { id: S.evaluation.requisition_id });
    }
    (Array.isArray(pkg.requirements) ? pkg.requirements : []).forEach(function (q) { if (q && trim(q.id)) pkgReqById[trim(q.id)] = q; });
    (Array.isArray(pkg.bid_evaluations) ? pkg.bid_evaluations : []).forEach(function (it) {
      if (it && trim(it.id) === R.evaluation_id && trim(it.requisition_id) !== S.evaluation.requisition_id) pkgEvalClash = true;
    });
    if (pkgEvalClash) fire('BID-R-069', 'blocker', { kind: 'evaluation' }, { id: R.evaluation_id });
  }
  if (requisition) {
    var rIds = Array.isArray(requisition.requirement_ids) ? requisition.requirement_ids.map(trim) : [];
    reqs.forEach(function (r, i) { if (rIds.indexOf(r.id) < 0) fire('BID-R-062', 'minor', { kind: 'requirement', index: i, id: r.id }, {}); });
    var missing = rIds.filter(function (x) { return x && !rowIds[x]; });
    if (missing.length) fire('BID-R-063', 'major', { kind: 'evaluation' }, { list: missing.join(', ') });
    if (trim(requisition.revision) !== S.evaluation.requisition_revision) fire('BID-R-067', 'major', { kind: 'evaluation' }, { pkg: trim(requisition.revision), mine: S.evaluation.requisition_revision });
    if (!empty(requisition.package_id) && !empty(S.evaluation.package_id) && trim(requisition.package_id) !== S.evaluation.package_id)
      fire('BID-R-068', 'major', { kind: 'evaluation' }, { pkg: trim(requisition.package_id), mine: S.evaluation.package_id });
  }
  if (pkg) {
    reqs.forEach(function (r, i) {
      if (!pkgReqById[r.id]) { fire('BID-R-064', 'minor', { kind: 'requirement', index: i, id: r.id }, {}); return; }
      if (trim(pkgReqById[r.id].applicability) === 'na') fire('BID-R-065', 'minor', { kind: 'requirement', index: i, id: r.id }, {});
    });
    (Array.isArray(pkg.flags) ? pkg.flags : []).forEach(function (f) {
      if (!f || typeof f !== 'object') return;
      if (['stale', 'affected', 'superseded'].indexOf(f.flag) < 0) return;
      var k = trim(f.target_kind), id = trim(f.target_id);
      var hit = (k === 'requirement' && rowIds[id]) ||
                (k === 'requisition' && id === S.evaluation.requisition_id && !empty(id)) ||
                (k === 'bid_evaluation' && id === R.evaluation_id);
      if (hit) fire('BID-R-066', 'major', { kind: k, id: id }, { flag: f.flag, reason: String(f.reason == null ? '' : f.reason) });
    });
  }

  if (!R.computed) { finish(); return R; }

  /* ---------------- 4.1 weights ---------------- */
  var sMax = Math.max.apply(null, SCORE_KEYS.map(function (k) { return S.scoring_table[k]; }));
  R.W = W; R.sMax = sMax;
  var rowInfo = reqs.map(function (r) { return { id: r.id, text: r.text, cls: r['class'], w: r.weight, omega: r.weight / W, source: r.source, ref: r.ref }; });
  R.rows = rowInfo;

  /* ---------------- per-cell rules, scores, knock-outs, drafts ---------------- */
  var A = nmap();                              /* A[bidderId][rowIndex] = normalised cell score */
  var perBidder = bids.map(function (b) {
    return { id: b.id, name: b.name, offer_ref: b.offer_ref, score: 0, rank: null,
             knock_out: 'none', knock_out_requirement_ids: [], provisional: false,
             contributions: [], open_drafts: 0, accepted_deviations: 0 };
  });
  perBidder.forEach(function (B) { A[B.id] = []; });

  rowInfo.forEach(function (row, i) {
    var req = reqs[i];
    if (req['class'] === 'mandatory' && req.weight === 0) fire('BID-R-017', 'info', { kind: 'requirement', index: i, id: row.id }, {});
    perBidder.forEach(function (B) {
      var c = cellAt(row.id, B.id), st = c ? c.status : 'open';
      var key = scoreKeyOf(c), s = S.scoring_table[key], a = 100 * s / sMax;
      A[B.id][i] = a;
      var contrib = (row.w / W) * a;
      B.score += contrib;
      B.contributions.push({ requirement_id: row.id, value: contrib, cell_score: s, a: a });
      var tgt = { kind: 'cell', requirement_id: row.id, bidder_id: B.id, index: i };
      if (st === 'open') { fire('BID-R-010', 'major', tgt, {}); B.provisional = true; }
      if (st === 'deviation') {
        if (empty(c.consequence)) fire('BID-R-011', 'major', tgt, {});
