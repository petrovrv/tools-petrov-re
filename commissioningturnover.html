 "summary": {
  "en": "Follows each system from scope through requirement, test, evidence, punch/NCR, closure and turnover dossier to acceptance, and names the first link that does not hold and why.",
  "uk": "Веде кожну систему від обсягу через вимогу, випробування, доказ, зауваження/NCR, закриття та досьє передачі до приймання й називає першу ланку, яка не тримається, і чому.",
  "de": "Führt jedes System von Umfang, Anforderung, Prüfung, Nachweis, Restpunkt/NCR, Abschluss und Übergabedokumentation bis zur Abnahme und benennt das erste Glied, das nicht hält, samt Grund.",
  "nl": "Volgt elk systeem van scope via eis, test, bewijs, restpunt/NCR, afsluiting en overdrachtsdossier tot acceptatie en noemt de eerste schakel die niet houdt en waarom.",
  "fr": "Suit chaque système du périmètre à l’acceptation — exigence, essai, preuve, réserve/NCR, clôture, dossier de transfert — et nomme le premier maillon qui cède, avec sa raison.",

 "description": {
  "en": "Rule-based commissioning and turnover readiness model for systems and packages. It distinguishes physical completion from checked, functionally proven, accepted and handed-over states; validates evidence integrity and configuration revision; supports per-system applicability, system-to-system prerequisites, test packages and open-condition records; and derives the activity frontier that can actually be executed next. The organising view is the eight-link evidence chain system/package → requirement → test/inspection → evidence → punch/NCR → closure → turnover dossier → accepted: a link is closed only when its own conditions hold and every link before it is closed, and the tool names the first broken link with its rule ids and evidence gaps. It owns a punch/NCR register (categories A, B, C; NCR dispositions use-as-is, repair, rework, reject with a concession link) and a turnover dossier per system whose index is assembled from ids, with the acceptance record. Requirement ids, verification evidence, vendor documents, review decisions, deviations, functional tests and change flags are read from the project package.",
  "uk": "Побудована на правилах модель готовності систем і пакетів до пусконалагодження та передачі. Вона відрізняє фізичне завершення від перевіреного, функціонально підтвердженого, прийнятого та переданого стану; перевіряє цілісність доказів і редакцію конфігурації; враховує застосовність по системах, міжсистемні передумови, пакети випробувань і відкриті умови; визначає наступну реально виконувану дію. Організуючим поданням є ланцюг доказів із восьми ланок: система/пакет → вимога → випробування/огляд → доказ → зауваження/NCR → закриття → досьє передачі → прийнято. Ланка закрита лише тоді, коли виконано її власні умови й закрито всі попередні; інструмент називає першу розірвану ланку з ідентифікаторами правил і прогалинами доказів. Він веде реєстр зауважень/NCR (категорії A, B, C; рішення щодо NCR: використати як є, ремонт, доопрацювання, відхилити — з посиланням на поступку) і досьє передачі на кожну систему, індекс якого складається з ідентифікаторів, разом із записом приймання. Ідентифікатори вимог, докази верифікації, документи постачальників, рішення оглядів, відхилення, функціональні випробування та позначки змін читаються з пакета проєкту.",
  "de": "Regelbasiertes Bereitschaftsmodell für Inbetriebnahme und Übergabe von Systemen und Paketen. Es trennt physische Fertigstellung von geprüftem, funktional nachgewiesenem, abgenommenem und übergebenem Zustand, prüft Nachweisintegrität und Konfigurationsrevision, kennt systembezogene Anwendbarkeit, Abhängigkeiten zwischen Systemen, Prüfpakete und offene Bedingungen und bestimmt die nächste tatsächlich ausführbare Aktivität. Leitende Ansicht ist die achtgliedrige Nachweiskette System/Paket → Anforderung → Prüfung/Inspektion → Nachweis → Restpunkt/NCR → Abschluss → Übergabedokumentation → abgenommen: Ein Glied ist nur geschlossen, wenn seine eigenen Bedingungen gelten und jedes vorherige Glied geschlossen ist; das Werkzeug benennt das erste unterbrochene Glied mit Regel-Ids und Nachweislücken. Es führt ein Restpunkt-/NCR-Register (Kategorien A, B, C; NCR-Entscheidungen verwenden wie vorhanden, Reparatur, Nacharbeit, Zurückweisung mit Verweis auf eine Sonderfreigabe) und je System eine Übergabedokumentation, deren Index aus Ids zusammengestellt wird, samt Abnahmeeintrag. Anforderungs-Ids, Verifikationsnachweise, Lieferantendokumente, Prüfentscheidungen, Abweichungen, Funktionsprüfungen und Änderungsmarkierungen kommen aus dem Projektpaket.",
  "nl": "Regelgebaseerd gereedheidsmodel voor inbedrijfstelling en overdracht van systemen en pakketten. Het onderscheidt fysieke voltooiing van gecontroleerd, functioneel bewezen, geaccepteerd en overgedragen, toetst bewijsintegriteit en configuratierevisie, kent toepasselijkheid per systeem, afhankelijkheden tussen systemen, testpakketten en open voorwaarden, en bepaalt de volgende werkelijk uitvoerbare activiteit. De leidende weergave is de bewijsketen van acht schakels systeem/pakket → eis → test/inspectie → bewijs → restpunt/NCR → afsluiting → overdrachtsdossier → geaccepteerd: een schakel is alleen gesloten als haar eigen voorwaarden gelden en elke eerdere schakel gesloten is, en de tool noemt de eerste gebroken schakel met regel-id’s en bewijsgaten. Het beheert een restpunten-/NCR-register (categorieën A, B, C; NCR-besluiten gebruiken zoals het is, reparatie, herbewerking, afkeuren met verwijzing naar een concessie) en per systeem een overdrachtsdossier waarvan de index uit id’s wordt samengesteld, met de acceptatiegegevens. Eis-id’s, verificatiebewijs, leveranciersdocumenten, reviewbesluiten, afwijkingen, functionele testen en wijzigingsmarkeringen komen uit het projectpakket.",
  "fr": "Modèle de préparation fondé sur des règles pour la mise en service et le transfert de systèmes et de lots. Il distingue l’achèvement physique des états vérifié, fonctionnellement démontré, accepté et transféré, contrôle l’intégrité des preuves et la révision de configuration, gère l’applicabilité par système, les prérequis entre systèmes, les dossiers d’essais et les conditions ouvertes, et identifie l’activité réellement exécutable suivante. La vue directrice est la chaîne de preuves à huit maillons système/lot → exigence → essai/inspection → preuve → réserve/NCR → clôture → dossier de transfert → accepté : un maillon n’est fermé que si ses propres conditions sont remplies et que tous les maillons précédents le sont, et l’outil nomme le premier maillon rompu avec ses règles et ses manques de preuve. Il tient un registre des réserves et NCR (catégories A, B, C ; décisions NCR utiliser en l’état, réparation, reprise, rejet avec lien vers une dérogation) et, par système, un dossier de transfert dont l’index est assemblé à partir d’identifiants, avec l’enregistrement d’acceptation. Identifiants d’exigence, preuves de vérification, documents fournisseur, décisions de revue, écarts, essais fonctionnels et signalements de modification proviennent du dossier de projet.",
  "es": "Modelo de preparación basado en reglas para puesta en marcha y entrega de sistemas y paquetes. Distingue la terminación física de los estados verificado, probado funcionalmente, aceptado y entregado, comprueba la integridad de la evidencia y la revisión de configuración, admite aplicabilidad por sistema, prerrequisitos entre sistemas, paquetes de prueba y condiciones abiertas, e identifica la siguiente actividad realmente ejecutable. La vista principal es la cadena de evidencias de ocho eslabones sistema/paquete → requisito → prueba/inspección → evidencia → pendiente/NCR → cierre → dossier de entrega → aceptado: un eslabón solo está cerrado si se cumplen sus propias condiciones y todos los anteriores están cerrados, y la herramienta nombra el primer eslabón roto con sus reglas y huecos de evidencia. Mantiene un registro de pendientes y NCR (categorías A, B, C; disposiciones de NCR usar tal cual, reparación, reproceso, rechazo con enlace a una concesión) y un dossier de entrega por sistema cuyo índice se monta a partir de identificadores, junto con el registro de aceptación. Los id de requisitos, evidencias de verificación, documentos de proveedor, decisiones de revisión, desviaciones, pruebas funcionales y marcas de cambio se leen del paquete del proyecto.",
  "pl": "Regułowy model gotowości systemów i pakietów do rozruchu i przekazania. Rozdziela ukończenie fizyczne od stanu sprawdzonego, funkcjonalnie potwierdzonego, odebranego i przekazanego, sprawdza integralność dowodów i rewizję konfiguracji, obsługuje stosowalność dla systemu, zależności między systemami, pakiety prób i warunki otwarte oraz wskazuje następną rzeczywiście wykonalną czynność. Widokiem porządkującym jest ośmioogniwowy łańcuch dowodów system/pakiet → wymaganie → próba/inspekcja → dowód → usterka/NCR → zamknięcie → dokumentacja przekazania → odebrano: ogniwo jest zamknięte tylko wtedy, gdy spełnione są jego własne warunki i zamknięte są wszystkie wcześniejsze, a narzędzie wskazuje pierwsze przerwane ogniwo z identyfikatorami reguł i lukami w dowodach. Prowadzi rejestr usterek i NCR (kategorie A, B, C; decyzje NCR: użyć bez zmian, naprawa, przeróbka, odrzucenie z odsyłaczem do odstępstwa) oraz dokumentację przekazania dla każdego systemu, której indeks jest zestawiany z identyfikatorów, wraz z zapisem odbioru. Identyfikatory wymagań, dowody weryfikacji, dokumenty dostawców, decyzje z przeglądów, odstępstwa, próby funkcjonalne i oznaczenia zmian są czytane z pakietu projektu."
 },

 "limitations": {
  "en": "1. Planning and traceability aid: not a commissioning procedure, a permit to energise, a certificate of acceptance, a quality-management system or a contractual handover instrument. 2. The readiness rules, the punch categories A/B/C, the NCR closure conditions, the eight-link chain and the dossier completeness rules are author engineering method informed by the cited documents; no standard prescribes them in this form, and project specifications, contracts and site safety rules govern. 3. The tool records that evidence exists and is referenced; it never opens, reads or judges the referenced document, test sheet or certificate. 4. The status of an imported item is taken as the owning tool wrote it; an id that does not resolve in a loaded register counts as not evidenced, and a use-as-is or repair NCR closes only against an approved concession present in the loaded deviation register. 5. Package context — imported registers and flags — is not carried in the permalink; a permalink restores the local state and names the package context it was made with. 6. Dates are calendar dates compared by UTC day and ages are whole days; there is no working-day calendar. 7. SIS validation (IEC 61511-1:2016 clause 15) and energisation permits are pointed at, never performed or approved here.",
  "uk": "1. Засіб планування та простежуваності: не процедура пусконалагодження, не дозвіл на подачу напруги, не акт приймання, не система управління якістю і не договірний інструмент передачі. 2. Правила готовності, категорії зауважень A/B/C, умови закриття NCR, ланцюг із восьми ланок і правила повноти досьє — авторська інженерна методика з урахуванням наведених документів; жоден стандарт не приписує їх у такому вигляді, а визначальними залишаються специфікації проєкту, контракти та правила безпеки на майданчику. 3. Інструмент фіксує, що доказ існує й на нього є посилання; він ніколи не відкриває, не читає і не оцінює документ, протокол чи сертифікат. 4. Стан імпортованої позиції береться таким, яким його записав інструмент-власник; ідентифікатор, який не знаходиться в завантаженому реєстрі, вважається непідтвердженим, а NCR із рішенням «використати як є» чи «ремонт» закривається лише за затвердженою поступкою в завантаженому реєстрі відхилень. 5. Контекст пакета — імпортовані реєстри та позначки — не передається в посиланні; посилання відновлює локальний стан і називає контекст пакета, з яким його створено. 6. Дати — календарні, порівнюються за добою UTC, вік — у цілих добах; робочого календаря немає. 7. Валідацію ПАЗ (IEC 61511-1:2016, розділ 15) і дозволи на подачу напруги лише згадано, тут їх не виконують і не затверджують.",
  "de": "1. Hilfsmittel für Planung und Rückverfolgbarkeit: keine Inbetriebnahmeanweisung, keine Einschaltfreigabe, kein Abnahmezertifikat, kein Qualitätsmanagementsystem und kein vertragliches Übergabeinstrument. 2. Bereitschaftsregeln, Restpunktkategorien A/B/C, NCR-Abschlussbedingungen, die achtgliedrige Kette und die Vollständigkeitsregeln der Dokumentation sind Autorenmethodik auf Basis der zitierten Dokumente; keine Norm schreibt sie in dieser Form vor, maßgebend bleiben Projektspezifikationen, Verträge und Sicherheitsregeln der Baustelle. 3. Das Werkzeug hält fest, dass ein Nachweis existiert und referenziert ist; es öffnet, liest und bewertet das Dokument, das Prüfblatt oder das Zertifikat nie. 4. Der Status eines importierten Eintrags gilt so, wie ihn das besitzende Werkzeug geschrieben hat; eine Id, die in einem geladenen Register nicht auflöst, gilt als nicht belegt, und ein NCR mit „verwenden wie vorhanden“ oder „Reparatur“ schließt nur gegen eine genehmigte Sonderfreigabe im geladenen Abweichungsregister. 5. Der Paketkontext — importierte Register und Markierungen — reist nicht im Permalink mit; ein Permalink stellt den lokalen Zustand wieder her und nennt den Paketkontext, mit dem er entstand. 6. Daten sind Kalendertage, verglichen nach UTC-Tag, Alter in ganzen Tagen; es gibt keinen Arbeitstagkalender. 7. SIS-Validierung (IEC 61511-1:2016 Abschnitt 15) und Einschaltfreigaben werden benannt, hier weder durchgeführt noch genehmigt.",
  "nl": "1. Hulpmiddel voor planning en traceerbaarheid: geen inbedrijfstellingsprocedure, geen inschakelvergunning, geen acceptatiecertificaat, geen kwaliteitsmanagementsysteem en geen contractueel overdrachtsinstrument. 2. De gereedheidsregels, de restpuntcategorieën A/B/C, de NCR-afsluitvoorwaarden, de keten van acht schakels en de volledigheidsregels van het dossier zijn auteursmethodiek op basis van de geciteerde documenten; geen norm schrijft ze in deze vorm voor, en projectspecificaties, contracten en veiligheidsregels op locatie zijn leidend. 3. De tool legt vast dat bewijs bestaat en waarnaar het verwijst; het opent, leest of beoordeelt het document, testblad of certificaat nooit. 4. De status van een geïmporteerd item geldt zoals de eigenaarstool die schreef; een id dat in een geladen register niet oplost, telt als niet onderbouwd, en een NCR met ‘gebruiken zoals het is’ of ‘reparatie’ sluit alleen tegen een goedgekeurde concessie in het geladen afwijkingsregister. 5. Pakketcontext — geïmporteerde registers en markeringen — reist niet mee in de permalink; een permalink herstelt de lokale staat en noemt de pakketcontext waarmee hij is gemaakt. 6. Datums zijn kalenderdatums, vergeleken per UTC-dag, en ouderdom is in hele dagen; er is geen werkdagkalender. 7. SIS-validatie (IEC 61511-1:2016 clausule 15) en inschakelvergunningen worden genoemd, hier nooit uitgevoerd of goedgekeurd.",
  "fr": "1. Aide à la planification et à la traçabilité : ni procédure de mise en service, ni autorisation de mise sous tension, ni certificat d’acceptation, ni système de management de la qualité, ni instrument contractuel de transfert. 2. Les règles de préparation, les catégories de réserves A/B/C, les conditions de clôture des NCR, la chaîne à huit maillons et les règles de complétude du dossier sont une méthode d’auteur informée par les documents cités ; aucune norme ne les prescrit sous cette forme, et les spécifications du projet, les contrats et les règles de sécurité du site prévalent. 3. L’outil enregistre qu’une preuve existe et qu’elle est référencée ; il n’ouvre, ne lit ni ne juge jamais le document, la feuille d’essai ou le certificat. 4. Le statut d’un élément importé est celui écrit par l’outil propriétaire ; un identifiant qui ne se résout pas dans un registre chargé compte comme non prouvé, et une NCR « en l’état » ou « réparation » ne se clôt que contre une dérogation approuvée présente dans le registre des écarts chargé. 5. Le contexte du dossier de projet — registres importés et signalements — ne voyage pas dans le lien ; un lien restaure l’état local et nomme le contexte avec lequel il a été créé. 6. Les dates sont des jours calendaires comparés en jour UTC et les âges sont en jours entiers ; il n’y a pas de calendrier ouvré. 7. La validation SIS (IEC 61511-1:2016 article 15) et les autorisations de mise sous tension sont citées, jamais réalisées ni approuvées ici.",
  "es": "1. Ayuda de planificación y trazabilidad: no es un procedimiento de puesta en marcha, un permiso de energización, un certificado de aceptación, un sistema de gestión de la calidad ni un instrumento contractual de entrega. 2. Las reglas de preparación, las categorías de pendientes A/B/C, las condiciones de cierre de NCR, la cadena de ocho eslabones y las reglas de completitud del dossier son metodología del autor informada por los documentos citados; ninguna norma las prescribe en esta forma, y las especificaciones del proyecto, los contratos y las reglas de seguridad de la obra mandan. 3. La herramienta registra que una evidencia existe y está referenciada; nunca abre, lee ni juzga el documento, la hoja de prueba o el certificado. 4. El estado de un elemento importado se toma tal como lo escribió la herramienta propietaria; un id que no resuelve en un registro cargado cuenta como no evidenciado, y una NCR «usar tal cual» o «reparación» solo cierra contra una concesión aprobada presente en el registro de desviaciones cargado. 5. El contexto del paquete —registros importados y marcas— no viaja en el enlace; un enlace restaura el estado local y nombra el contexto con el que se creó. 6. Las fechas son días naturales comparados por día UTC y las antigüedades son días enteros; no hay calendario laboral. 7. La validación SIS (IEC 61511-1:2016 cláusula 15) y los permisos de energización se citan, nunca se realizan ni aprueban aquí.",
  "pl": "1. Narzędzie planowania i identyfikowalności: nie jest procedurą rozruchową, zezwoleniem na załączenie, certyfikatem odbioru, systemem zarządzania jakością ani umownym instrumentem przekazania. 2. Reguły gotowości, kategorie usterek A/B/C, warunki zamknięcia NCR, ośmioogniwowy łańcuch i reguły kompletności dokumentacji są autorską metodą opartą na przywołanych dokumentach; żadna norma nie narzuca ich w tej postaci, a rozstrzygają specyfikacje projektu, umowy i zasady bezpieczeństwa na budowie. 3. Narzędzie zapisuje, że dowód istnieje i jest przywołany; nigdy nie otwiera, nie czyta ani nie ocenia dokumentu, protokołu czy certyfikatu. 4. Status zaimportowanej pozycji przyjmuje się tak, jak zapisało go narzędzie-właściciel; identyfikator, który nie znajduje się w załadowanym rejestrze, liczy się jako niepotwierdzony, a NCR „użyć bez zmian” lub „naprawa” zamyka się tylko wobec zatwierdzonego odstępstwa obecnego w załadowanym rejestrze odstępstw. 5. Kontekst pakietu — zaimportowane rejestry i oznaczenia — nie podróżuje w odnośniku; odnośnik odtwarza stan lokalny i nazywa kontekst pakietu, z którym powstał. 6. Daty są datami kalendarzowymi porównywanymi według doby UTC, a wiek podawany jest w pełnych dobach; nie ma kalendarza dni roboczych. 7. Walidacja SIS (IEC 61511-1:2016 rozdział 15) i zezwolenia na załączenie są przywołane, nigdy tu nie wykonywane ani zatwierdzane."
 },

 "validation": {
  "basis": {
   "en": "Method structure informed by ISO/IEC/IEEE 15288:2023 (6.4.9 Verification, 6.4.10 Transition, 6.4.11 Validation), IEC 62381:2024 (FAT/SAT/SIT definitions and cl. 5–8), IEC 62382:2024 (1.1, cl. 4 loop check), ASHRAE Guideline 0-2019 (cl. 7, cl. 8, App. H, M, O, P), ISO 9000:2015 (3.12.8 rework, 3.12.9 repair) and ISO 10006:2017. The readiness dependencies, the eight-link chain, the punch categories, the NCR closure conditions and the dossier rules are author engineering methodology, not reproduced standard checklists. IEC 61511-1:2016 clause 15 is a pointer only.",
   "uk": "Структура методу сформована з урахуванням ISO/IEC/IEEE 15288:2023 (6.4.9 верифікація, 6.4.10 перехід, 6.4.11 валідація), IEC 62381:2024 (визначення FAT/SAT/SIT і розділи 5–8), IEC 62382:2024 (1.1, розділ 4 перевірка контурів (loop check)), ASHRAE Guideline 0-2019 (розділи 7 і 8, додатки H, M, O, P), ISO 9000:2015 (3.12.8 доопрацювання, 3.12.9 ремонт) та ISO 10006:2017. Залежності готовності, ланцюг із восьми ланок, категорії зауважень, умови закриття NCR і правила досьє є авторською інженерною методикою, а не відтвореними чек-листами. IEC 61511-1:2016, розділ 15 — лише вказівник.",
   "de": "Methodenstruktur unter Berücksichtigung von ISO/IEC/IEEE 15288:2023 (6.4.9 Verifikation, 6.4.10 Überführung, 6.4.11 Validierung), IEC 62381:2024 (FAT/SAT/SIT-Definitionen und Abschnitte 5–8), IEC 62382:2024 (1.1, Abschnitt 4 Loop-Check), ASHRAE Guideline 0-2019 (Abschnitte 7 und 8, Anhänge H, M, O, P), ISO 9000:2015 (3.12.8 Nacharbeit, 3.12.9 Reparatur) und ISO 10006:2017. Bereitschaftsabhängigkeiten, die achtgliedrige Kette, Restpunktkategorien, NCR-Abschlussbedingungen und Dokumentationsregeln sind Autorenmethodik, keine reproduzierten Norm-Checklisten. IEC 61511-1:2016 Abschnitt 15 dient nur als Verweis.",
   "nl": "Methodestructuur geïnformeerd door ISO/IEC/IEEE 15288:2023 (6.4.9 verificatie, 6.4.10 transitie, 6.4.11 validatie), IEC 62381:2024 (FAT/SAT/SIT-definities en cl. 5–8), IEC 62382:2024 (1.1, cl. 4 loopcontrole), ASHRAE Guideline 0-2019 (cl. 7, cl. 8, bijlagen H, M, O, P), ISO 9000:2015 (3.12.8 herbewerking, 3.12.9 reparatie) en ISO 10006:2017. De gereedheidsafhankelijkheden, de keten van acht schakels, de restpuntcategorieën, de NCR-afsluitvoorwaarden en de dossierregels zijn auteursmethodiek, geen overgenomen normchecklists. IEC 61511-1:2016 clausule 15 is alleen een verwijzing.",
   "fr": "Structure méthodologique informée par ISO/IEC/IEEE 15288:2023 (6.4.9 vérification, 6.4.10 transition, 6.4.11 validation), IEC 62381:2024 (définitions FAT/SAT/SIT et art. 5–8), IEC 62382:2024 (1.1, art. 4 contrôle de boucle), ASHRAE Guideline 0-2019 (art. 7, art. 8, annexes H, M, O, P), ISO 9000:2015 (3.12.8 reprise, 3.12.9 réparation) et ISO 10006:2017. Les dépendances de préparation, la chaîne à huit maillons, les catégories de réserves, les conditions de clôture des NCR et les règles du dossier sont une méthode d’auteur, non des listes de contrôle reproduites. IEC 61511-1:2016 article 15 n’est qu’un renvoi.",
   "es": "Estructura metodológica informada por ISO/IEC/IEEE 15288:2023 (6.4.9 verificación, 6.4.10 transición, 6.4.11 validación), IEC 62381:2024 (definiciones FAT/SAT/SIT y cl. 5–8), IEC 62382:2024 (1.1, cl. 4 comprobación de lazo), ASHRAE Guideline 0-2019 (cl. 7, cl. 8, anexos H, M, O, P), ISO 9000:2015 (3.12.8 reproceso, 3.12.9 reparación) e ISO 10006:2017. Las dependencias de preparación, la cadena de ocho eslabones, las categorías de pendientes, las condiciones de cierre de NCR y las reglas del dossier son metodología del autor, no listas de control reproducidas. IEC 61511-1:2016 cláusula 15 es solo una referencia.",
   "pl": "Struktura metody oparta na ISO/IEC/IEEE 15288:2023 (6.4.9 weryfikacja, 6.4.10 przejście, 6.4.11 walidacja), IEC 62381:2024 (definicje FAT/SAT/SIT i rozdz. 5–8), IEC 62382:2024 (1.1, rozdz. 4 sprawdzenie pętli), ASHRAE Guideline 0-2019 (rozdz. 7, rozdz. 8, zał. H, M, O, P), ISO 9000:2015 (3.12.8 przeróbka, 3.12.9 naprawa) oraz ISO 10006:2017. Zależności gotowości, ośmioogniwowy łańcuch, kategorie usterek, warunki zamknięcia NCR i reguły dokumentacji są autorską metodą, nie odtworzonymi checklistami norm. IEC 61511-1:2016 rozdział 15 jest wyłącznie odsyłaczem."
  },

}

aft","nl":"Gereedheid","fr":"Préparation","es":"Preparación","pl":"Gotowość"},"ready":{"en":"Ready for selected target","uk":"Готово до вибраної цілі","de":"Bereit für das gewählte Ziel","nl":"Gereed voor gekozen doel","fr":"Prêt pour la cible choisie","es":"Listo para el objetivo elegido","pl":"Gotowe do wybranego celu"},"ready_open":{"en":"Ready with accepted exceptions","uk":"Готово з прийнятими винятками","de":"Bereit mit akzeptierten Ausnahmen","nl":"Gereed met geaccepteerde uitzonderingen","fr":"Prêt avec exceptions acceptées","es":"Listo con excepciones aceptadas","pl":"Gotowe z zaakceptowanymi wyjątkami"},"not_ready":{"en":"Not ready for selected target","uk":"Не готово до вибраної цілі","de":"Nicht bereit für das gewählte Ziel","nl":"Niet gereed voor gekozen doel","fr":"Non prêt pour la cible choisie","es":"No listo para el objetivo elegido","pl":"Niegotowe do wybranego celu"},"report_title":{"en":"Commissioning / Turnover Readiness Report","uk":"Звіт про готовність до пусконалагодження / передачі","de":"Bericht zur Inbetriebnahme-/Übergabebereitschaft","nl":"Rapport gereedheid inbedrijfstelling / overdracht","fr":"Rapport de préparation mise en service / transfert","es":"Informe de preparación para puesta en marcha / entrega","pl":"Raport gotowości do rozruchu / przekazania"},"intro":{"en":"Define the systems and the target gate. Record only the evidence you actually have; the planner derives which claims are supported, what is missing, and what can be executed next.","uk":"Визначте системи та цільовий етап. Записуйте лише ті докази, які реально маєте; планувальник визначить, які твердження підтверджені, чого бракує і що можна виконувати далі.","de":"Definieren Sie Systeme und Ziel-Gate. Erfassen Sie nur tatsächlich vorhandene Nachweise; der Planer leitet ab, welche Aussagen belegt sind, was fehlt und was als Nächstes ausgeführt werden kann.","nl":"Definieer systemen en doelgate. Leg alleen bewijs vast dat werkelijk bestaat; de planner leidt af welke claims zijn onderbouwd, wat ontbreekt en wat als volgende kan worden uitgevoerd.","fr":"Définissez les systèmes et le jalon cible. Enregistrez uniquement les preuves réellement disponibles; le planificateur déduit les états étayés, les manques et l’activité suivante exécutable.","es":"Defina los sistemas y la etapa objetivo. Registre solo la evidencia que realmente existe; el planificador deriva qué estados están sustentados, qué falta y qué actividad puede ejecutarse después.","pl":"Zdefiniuj systemy i etap docelowy. Rejestruj tylko dowody, które rzeczywiście istnieją; planer wyprowadza, które stwierdzenia są potwierdzone, czego brakuje i co można wykonać dalej."},"method":{"en":"A physical-completion claim is never promoted automatically. Each later gate requires its own evidence and the prerequisite chain behind it. Accepted exceptions remain visible and require an authority.","uk":"Заява про фізичне завершення ніколи не підвищується автоматично. Кожен наступний етап потребує власних доказів і ланцюга передумов. Прийняті винятки залишаються видимими та потребують уповноваженої особи.","de":"Eine Behauptung zur physischen Fertigstellung wird nie automatisch hochgestuft. Jedes spätere Gate benötigt eigene Nachweise und seine Voraussetzungskette. Akzeptierte Ausnahmen bleiben sichtbar und benötigen eine Freigabeinstanz.","nl":"Een claim van fysieke voltooiing wordt nooit automatisch doorgeschoven. Elke latere gate vereist eigen bewijs en de voorafgaande keten. Geaccepteerde uitzonderingen blijven zichtbaar en vereisen bevoegdheid.","fr":"Une déclaration d’achèvement physique n’est jamais promue automatiquement. Chaque jalon ultérieur exige ses propres preuves et sa chaîne de prérequis. Les exceptions acceptées restent visibles et exigent une autorité.","es":"Una declaración de terminación física nunca se promociona automáticamente. Cada etapa posterior requiere su propia evidencia y la cadena de prerrequisitos. Las excepciones aceptadas siguen visibles y requieren autoridad.","pl":"Deklaracja ukończenia fizycznego nigdy nie jest automatycznie promowana. Każdy dalszy etap wymaga własnych dowodów i łańcucha warunków wstępnych. Zaakceptowane wyjątki pozostają widoczne i wymagają upoważnienia."},"learn_chain":{"en":"The chain prevents “installed” from silently becoming “ready”. A later test can be valid only if its configuration, prerequisites, acceptance criterion and evidence are controlled.","uk":"Ланцюг не допускає, щоб «змонтовано» непомітно стало «готово». Пізніше випробування чинне лише за контрольованих конфігурації, передумов, критеріїв приймання та доказів.","de":"Die Kette verhindert, dass „installiert“ stillschweigend zu „bereit“ wird. Ein späterer Test ist nur bei beherrschter Konfiguration, Voraussetzungen, Abnahmekriterien und Nachweisen belastbar.","nl":"De keten voorkomt dat “geïnstalleerd” stilzwijgend “gereed” wordt. Een latere test is alleen geldig met beheerste configuratie, voorwaarden, acceptatiecriteria en bewijs.","fr":"La chaîne empêche « installé » de devenir implicitement « prêt ». Un essai ultérieur n’est valable que si configuration, prérequis, critère d’acceptation et preuve sont maîtrisés.","es":"La cadena evita que “instalado” se convierta silenciosamente en “listo”. Una prueba posterior solo es válida si se controlan configuración, prerrequisitos, criterio de aceptación y evidencia.","pl":"Łańcuch zapobiega cichemu przejściu od „zainstalowano” do „gotowe”. Późniejsza próba jest wiarygodna tylko przy kontrolowanej konfiguracji, warunkach wstępnych, kryterium odbioru i dowodzie."},"learn_exceptions":{"en":"An accepted exception is not the same as a completed item. It remains an open condition carried into the readiness decision and must identify who accepted it and on what basis.","uk":"Прийнятий виняток — не те саме, що завершений пункт. Він залишається відкритою умовою в рішенні про готовність і має вказувати, хто та на якій підставі його прийняв.","de":"Eine akzeptierte Ausnahme ist kein erledigter Punkt. Sie bleibt eine offene Bedingung in der Bereitschaftsentscheidung und muss Freigabeinstanz und Grundlage erkennen lassen.","nl":"Een geaccepteerde uitzondering is niet hetzelfde als een afgerond punt. Ze blijft een open voorwaarde in de gereedheidsbeslissing en moet aangeven wie haar accepteerde en op welke basis.","fr":"Une exception acceptée n’est pas un élément achevé. Elle reste une condition ouverte dans la décision de préparation et doit identifier l’autorité et la base d’acceptation.","es":"Una excepción aceptada no equivale a un elemento completado. Sigue siendo una condición abierta en la decisión de preparación y debe identificar quién la aceptó y con qué base.","pl":"Zaakceptowany wyjątek nie jest tym samym co pozycja zakończona. Pozostaje warunkiem otwartym w decyzji o gotowości i musi wskazywać, kto go zaakceptował i na jakiej podstawie."}},"gates":{"installed":{"en":"Installed","uk":"Змонтовано","de":"Installiert","nl":"Geïnstalleerd","fr":"Installé","es":"Instalado","pl":"Zainstalowano"},"checked":{"en":"Checked","uk":"Перевірено","de":"Geprüft","nl":"Gecontroleerd","fr":"Vérifié","es":"Verificado","pl":"Sprawdzono"},"functional":{"en":"Functionally proven","uk":"Функціонально підтверджено","de":"Funktional nachgewiesen","nl":"Functioneel bewezen","fr":"Fonctionnellement démontré","es":"Probado funcionalmente","pl":"Potwierdzono funkcjonalnie"},"accepted":{"en":"Accepted","uk":"Прийнято","de":"Abgenommen","nl":"Geaccepteerd","fr":"Accepté","es":"Aceptado","pl":"Odebrano"},"handover":{"en":"Handed over","uk":"Передано","de":"Übergeben","nl":"Overgedragen","fr":"Transféré","es":"Entregado","pl":"Przekazano"}},"term_profiles":{"generic":{"en":"Generic lifecycle","uk":"Загальний життєвий цикл","de":"Generischer Lebenszyklus","nl":"Generieke levenscyclus","fr":"Cycle de vie générique","es":"Ciclo de vida genérico","pl":"Ogólny cykl życia"},"construction":{"en":"Mechanical completion / commissioning","uk":"Механічне завершення / пусконалагодження","de" ystem}: {item} oznaczono N/D bez uzasadnienia."},"physical_only":{"en":"{system}: physical readiness is claimed, but evidence required for {gate} is still open.","uk":"{system}: заявлено фізичну готовність, але докази для етапу {gate} залишаються відкритими.","de":"{system}: Physische Bereitschaft wird behauptet, aber für {gate} erforderliche Nachweise sind noch offen.","nl":"{system}: fysieke gereedheid wordt geclaimd, maar bewijs voor {gate} staat nog open.","fr":"{system} : la préparation physique est déclarée, mais les preuves requises pour {gate} restent ouvertes.","es":"{system}: se declara preparación física, pero sigue abierta evidencia necesaria para {gate}.","pl":"{system}: zadeklarowano gotowość fizyczną, ale dowody wymagane dla {gate} pozostają otwarte."},"bypass":{"en":"{system}: an active bypass or inhibit remains at a readiness target that depends on normal functional configuration.","uk":"{system}: активний байпас або блокування залишається на етапі готовності, що залежить від нормальної функціональної конфігурації.","de":"{system}: Ein aktiver Bypass/Inhibit verbleibt bei einem Bereitschaftsziel, das die normale Funktionskonfiguration voraussetzt.","nl":"{system}: een actieve bypass/inhibit blijft aanwezig bij een gereedheidsdoel dat normale functionele configuratie vereist.","fr":"{system} : un bypass/inhibit actif subsiste à un jalon qui dépend de la configuration fonctionnelle normale.","es":"{system}: permanece un bypass/inhibit activo en un objetivo que depende de la configuración funcional normal.","pl":"{system}: aktywny bypass/inhibit pozostaje na etapie wymagającym normalnej konfiguracji funkcjonalnej."},"temp_mod":{"en":"{system}: a temporary modification remains open at acceptance / handover.","uk":"{system}: тимчасова модифікація залишається відкритою на прийманні / передачі.","de":"{system}: Eine temporäre Änderung ist bei Abnahme / Übergabe noch offen.","nl":"{system}: een tijdelijke wijziging staat nog open bij acceptatie / overdracht function P(k){ return (window.DiagramProject&&DiagramProject.strings[k])||PKGS[k]||CI_FLAG_DISPLAY[k]||{en:k}; }
function Pt(k,vars){ var o=P(k),l=siteLang(); var s=(o&&(o[l]||o.en))||k; Object.keys(vars||{}).forEach(function(v){ s=s.split('{'+v+'}').join(String(vars[v])); }); return s; }
function Ct(k,vars){ var o=CI_FLAG_DISPLAY[k]||{en:String(k)},l=siteLang(); var s=(o[l]||o.en||String(k)); Object.keys(vars||{}).forEach(function(v){ s=s.split('{'+v+'}').join(String(vars[v])); }); return s; }

/* §2.1 vs this tool's vocabulary. `target` is a commissioning GATE, and §2.1's
   `gate` is defined as exactly that — "the tool-declared gate id the user is
   working toward" — so target <-> project.gate is verbatim and lossless.
   `lifecycle` is a different vocabulary: eleven project stages. Only `handover`
   names the same milestone as a gate here; the tool's other four gates all sit
   INSIDE the single canonical stage `commissioning`, so mapping that stage to
   any one of them would be rounding to a neighbour (§3.4) and is refused. */
var PKG_LIFECYCLE_FROM={handover:'handover'};
var PKG_LIFECYCLE_TO={handover:'handover'};
function pkgGateOk(g){ return GATES.indexOf(String(g))>=0; }

/* §2.3 id derivation. This tool has no id column on either register it owns, so
   both are derived through the runtime's single scheme — one scheme across all
   eight tools — and collisions are REFUSED rather than silently suffixed.
   A derived id is second best precisely because a rename changes it: the panel
   says so, in the runtime's own words plus one sentence naming what it costs. */
function pkgSystemNames(s){ return (Array.isArray(s.systems)?s.systems:[]).map(function(x){ return String((x&&x.name)||''); }); }
function pkgSystemIds(s){ return DiagramProject.deriveIds('SYS',pkgSystemNames(s)); }
function pkgEvidenceNames(s){
 return (Array.isArray(s.evidence)?s.evidence:[]).map(function(e){
  return String((e&&e.system)||'')+' '+String((e&&e.item)||'');
 });
}
function pkgEvidenceIds(s){ return DiagramProject.deriveIds('EV',pkgEvidenceNames(s)); }
/* -> [] when both registers derive cleanly, else the human names that clash or
   cannot be slugged, so the user is told which rows to fix. */
function pkgIdProblems(s){
 var out=[], sn=pkgSystemNames(s), en=pkgEvidenceNames(s);
 var a=pkgSystemIds(s), b=pkgEvidenceIds(s);
 a.duplicates.forEach(function(d){ out.push(String(sn[d.first])+' / '+String(sn[d.index])); });
 a.unnamed.forEach(function(i){ out.push('#'+(i+1)); });
 b.duplicates.forEach(function(d){ out.push(String(en[d.first])+' / '+String(en[d.index])); });
 b.unnamed.forEach(function(i){ out.push('#'+(i+1)); });
 return out;
}

/* structure.systems[] (§2.2). The four state fields §2.2 does not name are carried
   beside the canonical ones so local -> canonical -> local is exact. */
function pkgSystemsOut(s){
 var list=(Array.isArray(s.systems)?s.systems:[]), ids=pkgSystemIds(s).ids;
 return list.map(function(x,i){
  return { id:String(ids[i]||''), name:String(x.name||''), type:String(x.type||''), discipline:'',
           construction:String(x.construction||''), physical_ready:String(x.physical_ready||''),
           current_revision:String(x.current_revision==null?'':x.current_revision),
           tested_revision:String(x.tested_revision==null?'':x.tested_revision) };
 });
}
function pkgSystemsIn(rows){
 return (Array.isArray(rows)?rows:[]).map(function(x){
  return { name:String(x.name||''), type:String(x.type||'mixed'), construction:String(x.construction||'unknown'),
           physical_ready:String(x.physical_ready||'unknown'),
           current_revision:String(x.current_revision==null?'':x.current_revision),
           tested_revision:String(x.tested_revision==null?'':x.tested_revision) };
 });
}

/* commissioning_evidence[] (§2.3) — this tool's half of the split register.
   requirementsmatrix owns verification_evidence; save() refuses a patch naming it,
   so there is nothing here to merge, carry through or defend by hand.
   The system name CAN be resolved here — this tool owns the system list — so both
   system_id and system_name are filled (§2.2). The label is the English item title,
   chosen so the document does not change with the reader's language. */
function pkgItemLabel(id){ var t=DATA.item_titles[id]; return String((t&&t.en)||id); }
function pkgEvidenceOut(s){
 var list=(Array.isArray(s.systems)?s.systems:[]), sids=pkgSystemIds(s).ids, byName={};
 list.forEach(function(x,i){ byName[String(x.name||'')]=String(sids[i]||''); });
 var ids=pkgEvidenceIds(s).ids;
 return (Array.isArray(s.evidence)?s.evidence:[]).map(function(e,i){
  var sysName=String(e.system||''), item=String(e.item||'');
  return { id:String(ids[i]||''), label:pkgItemLabel(item),
           system_id:String(byName[sysName]||''), system_name:sysName, item:item,
           status:String(e.status||''), reference:String(e.reference||''), criterion:String(e.criterion||''),
           owner:String(e.owner||''), na_reason:String(e.na_reason||'') };
 });
}
function pkgEvidenceIn(rows,systems){
 var list=(Array.isArray(systems)?systems:[]);
 var ids=DiagramProject.deriveIds('SYS',list.map(function(x){return String((x&&x.name)||'');})).ids, byId={};
 list.forEach(function(x,i){ byId[String(ids[i]||'')]=String(x.name||''); });
 return (Array.isArray(rows)?rows:[]).filter(function(e){ return !!e&&typeof e==='object'&&!Array.isArray(e); }).map(function(e){
  var name=String(e.system_name||'');
  if(!name&&e.system_id&&byId[String(e.system_id)]) name=byId[String(e.system_id)];
  return ev(name,String(e.item||''),String(e.status||'unknown'),String(e.reference||''),String(e.criterion||''),String(e.owner||''),String(e.na_reason||''));
 });
}

/* ---- §6 of the display contract: flags ----
   This tool owns exactly ONE kind, `commissioning_evidence`. It also DISPLAYS
   three registers it does not own — requirements, interfaces and
   verification_evidence — and §2.3 permits a flag against those rows to be shown
   in place, attributed to whoever raised it, provided nothing offers to edit,
   resolve or dismiss them. Everything else, including every non-object entry,
   goes to the package-level not-mine list with its raw content. Nothing is ever
   dropped, and an unknown kind is shown raw, never rounded to the nearest one. */
var PKG_MY_KINDS=['commissioning_evidence'];
var PKG_SHOWN_KINDS={requirement:'requirements',interface:'interfaces',verification_evidence:'verification_evidence'};
var pkgFlags=[], pkgCtx={requirements:[],interfaces:[],verification_evidence:[]}, pkgPkgEvidenceIds=[];
function isFlagObject(f){ return !!f && typeof f === 'object' && !Array.isArray(f); }
function rawText(f){ try { var t = JSON.stringify(f); return t === undefined ? String(f) : t; }
                     catch (e) { return String(f); } }
/* §6.1 — the agreed placeholder for an absent raised_against_revision is an
   em-dash, stated once in the contract so six tools do not invent six of them. */
function flagRev(f){ var r=isFlagObject(f)?f.raised_against_revision:undefined;
 return (r===undefined||r===null)?'—':r; }
/* §6.2 — orphan matching runs over the MERGED local ∪ package id view, because
   ids are derived from names: the same flag is an orphan before a load and
   matched after it, or the reverse, if either half is used alone. */
function pkgMergedEvidenceIds(){
 var o={}, ids=pkgEvidenceIds(state).ids;
 ids.forEach(function(i){ if(i) o[i]=1; });
 pkgPkgEvidenceIds.forEach(function(i){ if(i) o[i]=1; });
 return o;
}
function pkgCtxIds(section){
 var o={};
 (pkgCtx[section]||[]).forEach(function(r){ if(r&&r.id) o[String(r.id)]=1; });
 return o;
}
/* every entry lands in exactly one bucket and all four are rendered */
function pkgBucketFlags(){
 var mine={}, orphan=[], shown={requirements:{},interfaces:{},verification_evidence:{}}, foreign=[];
 var mineIds=pkgMergedEvidenceIds();
 var shownIds={requirements:pkgCtxIds('requirements'),interfaces:pkgCtxIds('interfaces'),verification_evidence:pkgCtxIds('verification_evidence')};
 pkgFlags.forEach(function(f){
  if(!isFlagObject(f)){ foreign.push(f); return; }
  var k=String(f.target_kind||''), id=String(f.target_id||'');
  /* kind first, id second — two registers may legitimately hold the same id */
  if(PKG_MY_KINDS.indexOf(k)>=0){
   if(mineIds[id]){ (mine[id]=mine[id]||[]).push(f); } else { orphan.push(f); }
   return;
  }
  var sec=Object.prototype.hasOwnProperty.call(PKG_SHOWN_KINDS,k)?PKG_SHOWN_KINDS[k]:null;
  if(sec&&shownIds[sec][id]){ (shown[sec][id]=shown[sec][id]||[]).push(f); return; }
  foreign.push(f);
 });
 return { mine:mine, orphan:orphan, shown:shown, foreign:foreign };
}
function pkgFlagLines(f){
 var word=Ct(String(isFlagObject(f)?f.flag:''))||String(isFlagObject(f)?f.flag:'');
 return [ word+' — '+String(isFlagObject(f)?(f.reason==null?'':f.reason):''),
          Ct('origin',{tool:String(isFlagObject(f)?f.raised_by:''),when:String(isFlagObject(f)?f.raised_at:''),rev:flagRev(f)}) ];
}
function pkgDom(tag,cls,text){ var n=document.createElement(tag); if(cls)n.className=cls; if(text!=null)n.textContent=String(text); return n; }
function pkgFlagBlock(host,list,label){
 var box=pkgDom('div','ctm-flagbox');
 box.style.cssText='margin:.4em 0;padding:.5em .6em;border-left:3px solid var(--warn,#b45309);font-size:.85em;line-height:1.45;overflow-wrap:anywhere;';
 if(label) box.appendChild(pkgDom('div','ctm-flag-title',label));
 if(list.length>1) box.appendChild(pkgDom('div','ctm-flag-head',Ct('heading')+' — '+Ct('count',{n:list.length})));
 list.forEach(function(f){ pkgFlagLines(f).forEach(function(t){ box.appendChild(pkgDom('div','ctm-flag-line',t)); }); });
 box.appendChild(pkgDom('div','ctm-flag-note',Ct('notEdited')));
 host.appendChild(box);
 return box;
}
/* the human label behind one of this tool's derived commissioning-evidence ids,
   looked up over the same merged local u package view the buckets use */
function pkgEvidenceLabelForId(id){
 var ids=pkgEvidenceIds(state).ids, rows=(Array.isArray(state.evidence)?state.evidence:[]);
 for(var i=0;i<ids.length;i++) if(ids[i]===id&&rows[i]) return String(rows[i].system||'')+' — '+pkgItemLabel(String(rows[i].item||''));
 return '';
}
/* Attached to the selected evidence item inside the matrix detail pane, using the
   tool's own rendered aria-labels so no filter logic is duplicated here. */
function pkgDecorateMatrix(){
 if(typeof document==='undefined') return;
 var sec=document.getElementById('ct-readiness-matrix'); if(!sec) return;
 var b=pkgBucketFlags(); if(!pkgFlags.length) return;
 var titleToItem={}; (DATA.items||[]).forEach(function(it){ titleToItem[itemTitle(it.id)]=it.id; });
 var sels=sec.querySelectorAll('.ctm-cell select[aria-label]');
 Array.prototype.forEach.call(sels,function(sel){
  var lab=sel.getAttribute('aria-label')||'', at=lab.lastIndexOf(' — ');
  if(at<0) return;
  var sysName=lab.slice(0,at), itemId=titleToItem[lab.slice(at+3)];
  if(!itemId) return;
  var id=DiagramProject.deriveId('EV',sysName+' '+itemId);
  var list=id?b.mine[id]:null; if(!list||!list.length) return;
  var td=sel.parentNode; if(!td) return;
  var tag=pkgDom('div','ctm-flag-badge',Ct(String(list[0].flag))+' · '+Ct('count',{n:list.length}));
  tag.style.cssText='margin-top:.2em;font-size:.78em;font-weight:600;overflow-wrap:anywhere;';
  td.appendChild(tag);
 });
 var detail=sec.querySelector('.ctm-detail');
 if(detail&&matrixSelection){
  var did=DiagramProject.deriveId('EV',String(matrixSelection.system)+' '+String(matrixSelection.item));
  var dl=did?b.mine[did]:null;
  if(dl&&dl.length) pkgFlagBlock(detail,dl,Ct('heading'));
 }
}
/* The package-level section: my orphans, the three read-only registers with their
   flags in place, and the not-mine list. Rendered only after an explicit Load. */
function pkgRenderFlagSection(){
 if(typeof document==='undefined'||!document.getElementById) return;
 var host=document.getElementById('app'); if(!host) return;
 var old=document.getElementById('ct-package-flags'); if(old&&old.parentNode) old.parentNode.removeChild(old);
 var anyCtx=(pkgCtx.requirements.length+pkgCtx.interfaces.length+pkgCtx.verification_evidence.length)>0;
 if(!pkgFlags.length&&!anyCtx) return;
 var b=pkgBucketFlags();
 var sec=pkgDom('section','ctm-panel'); sec.id='ct-package-flags';
 sec.appendChild(pkgDom('h2','ctm-title',Pt('flags_section')));
 if(!pkgFlags.length) sec.appendChild(pkgDom('p','ctm-help',Pt('flags_none')));
 sec.appendChild(pkgDom('p','ctm-help',Pt('ids_orphan_flags')));
 var mineIds=Object.keys(b.mine).sort();
 if(mineIds.length){
  sec.appendChild(pkgDom('h3','ctm-detail-title',Pt('flags_mine')));
  mineIds.forEach(function(id){
   var lab=pkgEvidenceLabelForId(id);
   pkgFlagBlock(sec,b.mine[id],id+(lab?' — '+lab:''));
  });
 }
 if(b.orphan.length){
  sec.appendChild(pkgDom('h3','ctm-detail-title',Pt('flags_orphans')));
  b.orphan.forEach(function(f){
   var box=pkgFlagBlock(sec,[f],null);
   box.appendChild(pkgDom('div','ctm-flag-orphan',Ct('orphanHere',{id:String(f.target_id||'')})));
  });
 }

  chain_help:L('A link is closed only when its own conditions hold and every link before it is closed. The chain runs to Accepted whatever the target; the verdict is for the selected target.','Ланка закрита лише тоді, коли виконано її власні умови й закрито всі попередні ланки. Ланцюг веде до «Прийнято» незалежно від цілі; висновок стосується вибраної цілі.','Ein Glied ist nur geschlossen, wenn seine eigenen Bedingungen erfüllt und alle vorherigen Glieder geschlossen sind. Die Kette reicht unabhängig vom Ziel bis „Abgenommen“; das Urteil gilt für das gewählte Ziel.','Een schakel is alleen gesloten als haar eigen voorwaarden gelden en elke schakel ervoor gesloten is. De keten loopt ongeacht het doel tot ‘Geaccepteerd’; het oordeel geldt voor het gekozen doel.','Un maillon n’est fermé que si ses propres conditions sont remplies et que tous les maillons précédents sont fermés. La chaîne va jusqu’à « Accepté » quelle que soit la cible ; le verdict porte sur la cible choisie.','Un eslabón solo está cerrado si se cumplen sus propias condiciones y todos los anteriores están cerrados. La cadena llega hasta «Aceptado» sea cual sea el objetivo; el veredicto es para el objetivo elegido.','Ogniwo jest zamknięte tylko wtedy, gdy spełnione są jego własne warunki i zamknięte są wszystkie wcześniejsze ogniwa. Łańcuch biegnie do „Odebrano” niezależnie od celu; werdykt dotyczy wybranego celu.'),

  legend:L('Symbols: ● closed, ◐ closed with exception, ✕ broken, ○ waiting.','Позначки: ● закрито, ◐ закрито з винятком, ✕ розірвано, ○ очікує.','Zeichen: ● geschlossen, ◐ geschlossen mit Ausnahme, ✕ unterbrochen, ○ wartet.','Tekens: ● gesloten, ◐ gesloten met uitzondering, ✕ gebroken, ○ wacht.','Symboles : ● fermé, ◐ fermé avec exception, ✕ rompu, ○ en attente.','Símbolos: ● cerrado, ◐ cerrado con excepción, ✕ roto, ○ en espera.','Symbole: ● zamknięte, ◐ zamknięte z wyjątkiem, ✕ przerwane, ○ oczekuje.'),
  m_chain:L('The chain runs System/package, Requirement, Test/inspection, Evidence, Punch/NCR, Closure, Turnover dossier, Accepted. A link is closed when its own conditions hold and every earlier link is closed; the first link that fails is reported with its rule ids and evidence gaps.','Ланцюг: система/пакет, вимога, випробування/огляд, доказ, зауваження/NCR, закриття, досьє передачі, прийнято. Ланка закрита, коли виконано її власні умови й закрито всі попередні; першу ланку, що не виконується, показано з ідентифікаторами правил і прогалинами в доказах.','Die Kette lautet System/Paket, Anforderung, Prüfung/Inspektion, Nachweis, Restpunkt/NCR, Abschluss, Übergabedokumentation, Abgenommen. Ein Glied ist geschlossen, wenn seine eigenen Bedingungen gelten und alle früheren Glieder geschlossen sind; das erste versagende Glied wird mit Regel-Ids und Nachweislücken gemeldet.','De keten is systeem/pakket, eis, test/inspectie, bewijs, restpunt/NCR, afsluiting, overdrachtsdossier, geaccepteerd. Een schakel is gesloten als haar eigen voorwaarden gelden en elke eerdere schakel gesloten is; de eerste schakel die faalt wordt gemeld met regel-id’s en bewijsgaten.','La chaîne va du système/lot à l’exigence, l’essai/inspection, la preuve, la réserve/NCR, la clôture, le dossier de transfert et l’acceptation. Un maillon est fermé quand ses propres conditions sont remplies et que tous les maillons antérieurs sont fermés ; le premier maillon en défaut est signalé avec ses règles et ses manques de preuve.','La cadena es sistema/paquete, requisito, prueba/inspección, evidencia, pendiente/NCR, cierre, dossier de entrega, aceptado. Un eslabón está cerrado cuando se cumplen sus condiciones y todos los anteriores están cerrados; el primer eslabón que falla se informa con sus reglas y huecos de evidencia.','Łańcuch to system/pakiet, wymaganie, próba/inspekcja, dowód, usterka/NCR, zamknięcie, dokumentacja przekazania, odbiór. Ogniwo jest zamknięte, gdy spełnione są jego warunki i zamknięte są wszystkie wcześniejsze; pierwsze niespełnione ogniwo jest podawane z identyfikatorami reguł i lukami w dowodach.'),
  m_punch:L('Punch category A blocks the checked gate and everything after it, B blocks acceptance, C blocks handover unless a transfer agreement with a reference is recorded; an uncategorised punch item counts as A.','Зауваження категорії A блокує етап «перевірено» і все подальше, B блокує приймання, C блокує передачу, якщо не зафіксовано угоду про передачу з посиланням; зауваження без категорії вважається A.','Restpunkt-Kategorie A blockiert das Gate „geprüft“ und alles danach, B blockiert die Abnahme, C blockiert die Übergabe, sofern keine Übertragsvereinbarung mit Referenz erfasst ist; ein Restpunkt ohne Kategorie zählt als A.','Restpuntcategorie A blokkeert de gate ‘gecontroleerd’ en alles daarna, B blokkeert acceptatie, C blokkeert overdracht tenzij een overdrachtsafspraak met referentie is vastgelegd; een restpunt zonder categorie telt als A.','Une réserve de catégorie A bloque le jalon « vérifié » et tout ce qui suit, B bloque l’acceptation, C bloque le transfert sauf accord de transfert consigné avec sa référence ; une réserve sans catégorie compte comme A.','Un pendiente de categoría A bloquea la etapa «verificado» y todo lo posterior, B bloquea la aceptación, C bloquea la entrega salvo acuerdo de transferencia registrado con referencia; un pendiente sin categoría cuenta como A.','Usterka kategorii A blokuje etap „sprawdzone” i wszystko dalej, B blokuje odbiór, C blokuje przekazanie, chyba że zapisano uzgodnienie przeniesienia z numerem; usterka bez kategorii liczy się jako A.'),
  m_ncr:L('An NCR closes with a disposition; use-as-is and repair close only against an approved concession present in the loaded deviation register (ISO 9000:2015 3.12.8 rework, 3.12.9 repair).','NCR закривається рішенням; «використати як є» та «ремонт» закриваються лише за затвердженою поступкою, наявною в завантаженому реєстрі відхилень (ISO 9000:2015 3.12.8 доопрацювання, 3.12.9 ремонт).','Ein NCR schließt mit einer Entscheidung; „verwenden wie vorhanden“ und „Reparatur“ schließen nur gegen eine genehmigte Sonderfreigabe im geladenen Abweichungsregister (ISO 9000:2015 3.12.8 Nacharbeit, 3.12.9 Reparatur).','Een NCR sluit met een besluit; ‘gebruiken zoals het is’ en ‘reparatie’ sluiten alleen met een goedgekeurde concessie in het geladen afwijkingsregister (ISO 9000:2015 3.12.8 herbewerking, 3.12.9 reparatie).','Une NCR se clôt par une décision ; « utiliser en l’état » et « réparation » ne se closent que contre une dérogation approuvée présente dans le registre des écarts chargé (ISO 9000:2015 3.12.8 reprise, 3.12.9 réparation).','Una NCR se cierra con una disposición; «usar tal cual» y «reparación» solo se cierran contra una concesión aprobada presente en el registro de desviaciones cargado (ISO 9000:2015 3.12.8 reproceso, 3.12.9 reparación).','NCR zamyka się decyzją; „użyć bez zmian” i „naprawa” zamykają się tylko wobec zatwierdzonego odstępstwa obecnego w załadowanym rejestrze odstępstw (ISO 9000:2015 3.12.8 przeróbka, 3.12.9 naprawa).'),
  m_flags:L('A stale, affected or superseded flag on an item in a system’s chain reopens the earliest link that holds the item; the flag’s reason, raiser, time and revision are shown verbatim and the item itself is not edited.','Позначка «застаріле», «зачеплено» або «замінено» на елементі ланцюга системи знову відкриває найранішу ланку з цим елементом; причину, автора, час і ревізію позначки показано дослівно, а сам елемент не змінюється.','Eine Markierung „veraltet“, „betroffen“ oder „überholt“ auf einem Element der Kette öffnet das früheste Glied wieder, das es enthält; Grund, Urheber, Zeit und Revision werden wörtlich gezeigt und das Element selbst bleibt unverändert.','Een markering ‘verouderd’, ‘geraakt’ of ‘vervangen’ op een item in de keten heropent de vroegste schakel die het bevat; reden, plaatser, tijd en revisie worden letterlijk getoond en het item zelf wordt niet gewijzigd.','Un signalement « périmé », « impacté » ou « remplacé » sur un élément de la chaîne rouvre le premier maillon qui le contient ; le motif, l’auteur, l’heure et la révision sont affichés tels quels et l’élément n’est pas modifié.','Una marca «obsoleto», «afectado» o «sustituido» sobre un elemento de la cadena reabre el primer eslabón que lo contiene; el motivo, el autor, la hora y la revisión se muestran literalmente y el elemento no se modifica.','Oznaczenie „nieaktualne”, „dotknięte” lub „zastąpione” na elemencie łańcucha ponownie otwiera najwcześniejsze ogniwo, które go zawiera; powód, autor, czas i rewizja są pokazane dosłownie, a sam element nie jest zmieniany.'),
  m_sis:L('SIS validation (IEC 61511-1:2016 clause 15) and permits to energise are referenced, never performed or approved here.','Валідацію ПАЗ (IEC 61511-1:2016, розділ 15) і дозволи на подачу напруги лише згадано; тут їх не виконують і не затверджують.','SIS-Validierung (IEC 61511-1:2016 Abschnitt 15) und Einschaltfreigaben werden benannt, hier aber weder durchgeführt noch genehmigt.','SIS-validatie (IEC 61511-1:2016 clausule 15) en inschakelvergunningen worden genoemd, hier nooit uitgevoerd of goedgekeurd.','La validation SIS (IEC 61511-1:2016 article 15) et les autorisations de mise sous tension sont citées, jamais réalisées ni approuvées ici.','La validación SIS (IEC 61511-1:2016 cláusula 15) y los permisos de energización se citan, nunca se realizan ni aprueban aquí.','Walidacja SIS (IEC 61511-1:2016 rozdział 15) i zezwolenia na załączenie są przywołane, nigdy tu nie wykonywane ani zatwierdzane.'),

function t3(o,vars){var s=loc(o);Object.keys(vars||{}).forEach(function(k){s=s.split('{'+k+'}').join(String(vars[k]));});return s;}
function linkName(l){return l+' '+loc(V3.links[l]||{en:l});}
function secLabel(k){return loc(V3.sections[k]||{en:k});}
function flagWord(w){return loc(V3.flagword[w]||{en:String(w)});}
function kindWord(k){try{if(window.DiagramProject&&DiagramProject.kindLabel)return DiagramProject.kindLabel(k,siteLang());}catch(e){}return String(k).replace(/_/g,' ');}
function statusWord(kind,v){var m=kind==='dossier'?V3.dstatus:(kind==='disp'?V3.disp:V3.pstatus);return loc(m[v]||{en:String(v)});}
