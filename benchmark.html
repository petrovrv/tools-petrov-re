<style>
:root{--bg:#f6f8fb;--panel:#fff;--ink:#12161d;--muted:#5b6675;--line:#e2e7ee;--accent:#3763e6;--weak:rgba(55,99,230,.10);--ok:#1f6f34;--okbg:rgba(31,111,52,.10);--warn:#9a5a00;--warnbg:rgba(154,90,0,.10);--bad:#a5261f;--badbg:rgba(165,38,31,.10);--shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow-wrap:break-word}
.wrap{max-width:1120px;margin:auto;padding:26px 20px 70px}
header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap}
h1{font-size:clamp(21px,2.7vw,29px);margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:15px;margin:0 0 8px;letter-spacing:-.01em}
h3{font-size:13px;margin:16px 0 5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dot{color:var(--accent)}
.crumb{margin:0 0 4px;font-size:12px;color:var(--muted)}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--accent)}
.tag{color:var(--muted);margin:0;font-size:13px}
.langs{display:flex;gap:5px;flex-wrap:wrap}
button{font:inherit}
.langs button{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:6px 9px;border-radius:8px;cursor:pointer}
.langs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rule{border:0;border-top:1px solid var(--line);margin:18px 0 16px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.nav a{font-size:12px;text-decoration:none;color:var(--muted);border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 11px}
.nav a:hover{border-color:var(--accent);color:var(--ink)}
.pill{display:inline-block;font-size:11px;font-weight:650;padding:4px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill.st-benchmarked{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.pill.st-prototype{background:var(--warnbg);color:var(--warn);border-color:var(--warn)} .pill.st-partial{background:var(--weak);color:var(--accent);border-color:var(--accent)}
.card{border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow);padding:15px 16px;margin:0 0 14px}
.card p{margin:8px 0;color:var(--muted)}
.card p.ink{color:var(--ink)}
.honest{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--panel) 92%,var(--warn))}
.honest h2{color:var(--ink)}
.honest p{color:var(--ink)}
.quote{border-left:3px solid var(--accent);padding:2px 0 2px 11px;margin:8px 0;color:var(--ink)}
ol.cites{margin:8px 0 0;padding-left:20px}
ol.cites li{margin:0 0 7px;color:var(--ink);font-size:13.5px}
.tiles{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 4px}
.tile{border:1px solid var(--line);border-radius:11px;padding:8px 13px;min-width:96px;background:var(--bg)}
.tile b{display:block;font-size:20px;line-height:1.25;font-variant-numeric:tabular-nums}
.tile span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile.ok b{color:var(--ok)}.tile.bad b{color:var(--bad)}.tile.flag b{color:var(--warn)}
.meta{display:grid;grid-template-columns:max-content 1fr;gap:5px 14px;font-size:13px;margin:6px 0 0}
.meta b{color:var(--muted);font-weight:600}
.meta span{overflow-wrap:anywhere}
.table{overflow-x:auto;border:1px solid var(--line);border-radius:11px;margin:9px 0 0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;background:var(--panel);font-size:12.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td.id{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;overflow-wrap:anywhere;min-width:110px}
.res{font-weight:650;white-space:nowrap}
.res.p{color:var(--ok)}.res.f{color:var(--bad)}.res.g{color:var(--warn)}
.sub{background:color-mix(in srgb,var(--panel) 94%,var(--accent))}
.small{font-size:11.5px;color:var(--muted)}
details{margin:10px 0 0}
details>summary{cursor:pointer;font-size:12.5px;color:var(--accent);padding:3px 0}
pre{margin:8px 0 0;padding:10px 11px;background:var(--bg);border:1px solid var(--line);border-radius:9px;overflow-x:auto;font:11.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
a{color:var(--accent)}
.load{padding:26px;color:var(--muted);text-align:center}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
footer a{color:var(--accent);text-decoration:none}
@media(max-width:560px){.wrap{padding:18px 14px 60px}.meta{grid-template-columns:1fr;gap:1px 0}.meta b{margin-top:6px}.tile{min-width:78px;padding:7px 10px}.tile b{font-size:17px}}

/* ---------- small helpers ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const p=(x,l)=>x&&typeof x==="object"&&!Array.isArray(x)?(x[l]||x.en||""):String(x==null?"":x);
const q=(u,l)=>u+(u.includes("?")?"&":"?")+"lang="+encodeURIComponent(l);
function detect(){
 let l=null;
 try{l=(new URLSearchParams(location.search).get("lang")||"").slice(0,2).toLowerCase()}catch(e){}
 if(!L.includes(l)){try{l=localStorage.getItem("diagram_site_lang")}catch(e){}}
 if(!L.includes(l)){try{l=localStorage.getItem("diagram_lang")}catch(e){}}
 if(!L.includes(l))l=((navigator.language||"en").slice(0,2)).toLowerCase();
 return L.includes(l)?l:"en";
}
function param(k){try{return new URLSearchParams(location.search).get(k)||""}catch(e){return ""}}
function num(v){
 if(v===null||v===undefined)return "—";
 if(typeof v==="boolean")return String(v);
 if(typeof v!=="number")return String(v);
 if(!isFinite(v))return String(v);
 if(v===0)return "0";
 const a=Math.abs(v);
 if(a<1e-4||a>=1e7)return v.toExponential(3);
 return String(Number(v.toPrecision(7)));
}
function dev(v){
 if(typeof v!=="number"||!isFinite(v))return v==null?"—":String(v);
 if(v===0)return "0";
 return v.toExponential(2);
}
function day(s){const m=String(s||"").match(/^(\d{4}-\d{2}-\d{2})/);return m?m[1]:(s||"")}
function txt(v){return typeof v==="string"?v:JSON.stringify(v,null,1)}

/* Display status. The schema keeps prototype|benchmarked|verified, but
   "verified" is only ever rendered when validation.review documents a review by
   someone other than the author; without that record the tool is shown at the
   highest tier its evidence really supports. */
function shownStatus(t){
 const v=t.validation||{};
 const st=t.status||"prototype";
 const rev=v.review;
 const hasReview=(rev&&typeof rev==="object"&&Object.keys(rev).length>0)||(typeof rev==="string"&&rev.trim()!=="");
 if(st==="verified")return hasReview?"verified":"benchmarked";
 if(v.benchmark_status==="partial")return "partial";
 return st==="benchmarked"?"benchmarked":"prototype";
}

/* Every way an artifact flags a case as "not a clean pass". */
function flagsOf(c,topIds,l){
 const out=[];
 const push=(why)=>{if(why&&out.indexOf(why)<0)out.push(why)};
 if(typeof c.reference_disagreement==="number")push(p(U.whyDis,l).replace("%s",dev(c.reference_disagreement)));
 if(topIds&&c.id&&topIds[c.id]!==undefined){
  const v=topIds[c.id];
  push(typeof v==="string"?v:p(U.whyDis,l).replace("%s",dev(v)));
 }
 /* `flagged` comes in three shapes and this used to handle only one.
    An ARRAY of {id|quantity, spread|deviation} — which is what
    benchmarks/neutron_transport.json has always carried — fell into the plain
    object branch, where Object.keys() yields the array INDEX and the value is
    the whole entry: the evidence page printed "0: the independent references
    disagree by <the stringified entry>" on both the flagged card and the all-cases
    table (the literal "[object " + "Object]", spelled apart here so a text
    scan of this file does not report the comment as the defect). Found
    2026-08-22 by benchgate.mjs, which is the first gate ever to
    open this page. dev() is left alone: it is right to stringify what it is
    given, and the caller is what was handing it an object. */
 const devOf=o=>{
  for(const k of ["spread","deviation","rel","disagreement","value"])
   if(typeof o[k]==="number")return dev(o[k]);
  return null;
 };
 if(Array.isArray(c.flagged)){
  c.flagged.forEach(x=>{
   if(x==null)return;
   if(typeof x!=="object"){push(String(x));return}
   const name=x.id||x.quantity||x.key||"";
   const d=devOf(x);
   const why=x.reason?txt(x.reason)
    :(d!==null?p(U.whyDis,l).replace("%s",d):p(U.whyDis,l).replace("%s","—"));
   push(name?name+": "+why:why);
  });
 }else if(c.flagged&&typeof c.flagged==="object"){
  Object.keys(c.flagged).forEach(k=>{
   const v=c.flagged[k];
   const d=(v&&typeof v==="object")?devOf(v):(typeof v==="number"?dev(v):null);
   push(k+": "+(d!==null?p(U.whyDis,l).replace("%s",d)
    :(v&&typeof v==="object"&&v.reason?txt(v.reason):p(U.whyDis,l).replace("%s",dev(v)))));
  });
 }else if(c.flagged===true)push(p(U.whyDis,l).replace("%s","—"));
 const cmp=c.cmp&&typeof c.cmp==="object"?c.cmp:{};
 Object.keys(cmp).forEach(k=>{
  const e=cmp[k];
  if(!e||typeof e!=="object")return;
  if(typeof e.flagged_reference_disagreement==="number")
   push(k+": "+p(U.whyDis,l).replace("%s",dev(e.flagged_reference_disagreement)));
  else if(e.graded===false)push(k+": "+p(U.whyUng,l));
 });
 if(c.labelled_uncertain)push(p(U.whyUnc,l));
 return out;
}
function worstOf(c){
 if(typeof c.worst_rel==="number")return c.worst_rel;
 let w=null;
 const cmp=c.cmp&&typeof c.cmp==="object"?c.cmp:{};
 Object.keys(cmp).forEach(k=>{
  const e=cmp[k];
  if(e&&typeof e.rel==="number"&&(w===null||e.rel>w))w=e.rel;
 });
 return w;
}

/* ---------- state ---------- */
let CAT=null,TOOL=null,PACKS=[],FAIL_CAT=false;
const WANT=param("tool").trim();

/* ---------- rendering ---------- */
function cmpTable(c,l){
 const cmp=c.cmp&&typeof c.cmp==="object"?c.cmp:{};
 const ks=Object.keys(cmp);
 if(!ks.length)return "";
 let h='<div class="table"><table><thead><tr><th>'+esc(p(U.colQty,l))+"</th><th>"+esc(p(U.colGot,l))
  +"</th><th>"+esc(p(U.colRef,l))+"</th><th>"+esc(p(U.colDev,l))+"</th><th>"+esc(p(U.colLim,l))
  +"</th><th>"+esc(p(U.colOut,l))+"</th></tr></thead><tbody>";
 ks.forEach(k=>{
  const e=cmp[k]&&typeof cmp[k]==="object"?cmp[k]:{got:cmp[k]};
  const d=typeof e.rel==="number"?e.rel:(typeof e.abs==="number"?e.abs:null);
  const lim=e.lim!==undefined?e.lim:(e.tol!==undefined?e.tol:null);
  const ok=e.ok===false?"f":(e.graded===false?"g":"p");
  h+="<tr><td class=\"id\">"+esc(k)+'</td><td class="num">'+esc(num(e.got))+'</td><td class="num">'+esc(num(e.ref))
   +'</td><td class="num">'+esc(dev(d))+'</td><td class="num">'+esc(typeof lim==="number"?num(lim):(lim?String(lim):"—"))
   +'</td><td class="res '+ok+'">'+esc(p(ok==="f"?U.rFail:(ok==="g"?U.rFlag:U.rPass),l))+"</td></tr>";
 });
 return h+"</tbody></table></div>";
}
function caseBlock(c,l,kind){
 let h='<div class="table"><table><tbody>';
 h+='<tr><td class="id">'+esc(txt(c.id||"—"))+"</td><td>"+esc(txt(c.note||""))+"</td></tr>";
 /* a per-case `tolerance` is a string in most artifacts and an OBJECT in some
    (debrisrunout ships {"exact":true}); txt() renders both. Same class of
    defect as `reference` above — 2026-08-22. */
 if(c.tolerance)h+="<tr><td>"+esc(p(U.colLim,l))+'</td><td class="small">'+esc(txt(c.tolerance))+"</td></tr>";
 if(kind&&kind.length)h+="<tr><td>"+esc(p(U.colWhy,l))+'</td><td class="small">'+esc(kind.join(" · "))+"</td></tr>";
 if(c.inputs&&typeof c.inputs==="object")
  h+="<tr><td>"+esc(p(U.colInputs,l))+"</td><td class=\"small\"><code>"+esc(JSON.stringify(c.inputs))+"</code></td></tr>";
 h+="</tbody></table></div>"+cmpTable(c,l);
 return h;
}
function allCasesTable(cases,l,topIds){
 let h='<div class="table"><table><thead><tr><th>'+esc(p(U.colCase,l))+"</th><th>"+esc(p(U.colWhat,l))
  +"</th><th>"+esc(p(U.colWorst,l))+"</th><th>"+esc(p(U.colOut,l))+"</th></tr></thead><tbody>";
 cases.forEach(c=>{
  const fl=flagsOf(c,topIds,l);
  const st=c.pass===false?"f":(fl.length?"g":"p");
  h+='<tr><td class="id">'+esc(txt(c.id||"—"))+"</td><td>"+esc(txt(c.note||""))
   +'</td><td class="num">'+esc(dev(worstOf(c)))+'</td><td class="res '+st+'">'
   +esc(p(st==="f"?U.rFail:(st==="g"?U.rFlag:U.rPass),l))
   +(fl.length?'<div class="small">'+esc(fl.join(" · "))+"</div>":"")+"</td></tr>";
 });
 return h+"</tbody></table></div>";
}
const KNOWN=["tool","file","reference","reference_citations","tolerance","total","passed","failed",
 "cases","artifact","run_at","generated_at","page_errors","console_errors","not_benchmarked",
 "crosscheck","environment","known_issue_during_run","flagged_reference_disagreement"];

function packHTML(pack,l){
 const b=pack.bench||{},a=pack.art;
 let h='<section class="card">';
 h+="<h2>"+esc(p(U.whatTested,l))+"</h2>";
 /* An artifact's `reference` is not always a sentence: operatingpoint and
    roomacoustics both ship an OBJECT ({language, method, solver, ...}), and
    esc() on an object printed the stringified placeholder in the one card the
    whole page exists for — "What was tested, and against what". txt() is
    already the house helper for exactly this and was simply not applied here.
    Found 2026-08-22 by benchgate.mjs. */
 const ref=(a&&a.reference)||b.reference||"";
 h+='<p class="ink">'+esc(ref?txt(ref):"—")+"</p>";
 const cites=(a&&Array.isArray(a.reference_citations)&&a.reference_citations.length)
  ?a.reference_citations:(Array.isArray(b.citations)?b.citations:[]);
 if(cites.length){
  h+="<h3>"+esc(p(U.cites,l))+"</h3><ol class=\"cites\">"+cites.map(c=>"<li>"+esc(txt(c))+"</li>").join("")+"</ol>";
 }
 h+="</section>";

 h+='<section class="card"><h2>'+esc(p(U.tolTitle,l))+"</h2>";
 /* the artifact-level `tolerance` is an object in roomacoustics (one entry per
    quantity group) and a sentence everywhere else. 2026-08-22. */
 const tolv=(a&&a.tolerance)||b.tolerance||"";
 h+='<div class="quote">'+esc(tolv?txt(tolv):"—")+"</div>";
 h+='<p class="small">'+esc(p(U.tolNote,l))+"</p></section>";

 if(pack.error){
  h+='<section class="card honest"><p class="ink">'+esc(p(U.artErr,l).replace("%s",pack.path))+"</p></section>";
 }

 const cases=a&&Array.isArray(a.cases)?a.cases:[];
 const topIds={};
 if(a&&Array.isArray(a.flagged_reference_disagreement))
  /* two shapes here too: {id,spread} keyed by CASE id, and the
     {case,quantity,reason} shape neutron_transport ships. The second used to be
     dropped silently, so a disagreement the artifact took the trouble to record
     never reached the page at all. */
  a.flagged_reference_disagreement.forEach(x=>{
   if(!x)return;
   if(x.id!==undefined)topIds[x.id]=x.spread;
   else if(x.case!==undefined)topIds[x.case]=(x.reason!==undefined?x.reason
    :(x.spread!==undefined?x.spread:x.deviation));
  });
 const flagged=cases.filter(c=>flagsOf(c,topIds,l).length);
 const failed=cases.filter(c=>c.pass===false);
 const total=a&&typeof a.total==="number"?a.total:b.cases;
 const passed=a&&typeof a.passed==="number"?a.passed:b.passed;
 const nfail=a&&typeof a.failed==="number"?a.failed:Math.max(0,(b.cases||0)-(b.passed||0));

 h+='<section class="card"><h2>'+esc(p(U.result,l))+"</h2><div class=\"tiles\">"
  +'<div class="tile"><b>'+esc(String(total==null?"—":total))+"</b><span>"+esc(p(U.tCases,l))+"</span></div>"
  +'<div class="tile ok"><b>'+esc(String(passed==null?"—":passed))+"</b><span>"+esc(p(U.tPassed,l))+"</span></div>"
  +'<div class="tile'+(nfail?" bad":"")+'"><b>'+esc(String(nfail==null?"—":nfail))+"</b><span>"+esc(p(U.tFailed,l))+"</span></div>"
  +'<div class="tile'+(flagged.length?" flag":"")+'"><b>'+esc(String(flagged.length))+"</b><span>"+esc(p(U.tFlagged,l))+"</span></div>"
  +"</div>";
 const meta=[];
 const runAt=(a&&(a.run_at||a.generated_at))||b.run_at||"";
 if(runAt)meta.push([p(U.run,l),esc(day(runAt))]);
 if(pack.rev)meta.push([p(U.rev,l),esc(pack.rev)]);
 if(pack.path)meta.push([p(U.artifact,l),'<a href="'+esc(pack.path)+'">'+esc(pack.path)+"</a>"]);
 if(meta.length)h+='<div class="meta">'+meta.map(r=>"<b>"+esc(r[0])+"</b><span>"+r[1]+"</span>").join("")+"</div>";
 h+="</section>";

 if(failed.length){
  h+='<section class="card"><h2>'+esc(p(U.failTitle,l))+"</h2>";
  failed.forEach(c=>{h+=caseBlock(c,l,null)});
  h+="</section>";
 }
 if(flagged.length){
  h+='<section class="card honest"><h2>'+esc(p(U.flagTitle,l))+"</h2>";
  h+='<p class="ink">'+esc(p(U.flagIntro,l))+"</p>";
  h+='<div class="table"><table><thead><tr><th>'+esc(p(U.colCase,l))+"</th><th>"+esc(p(U.colWhat,l))
   +"</th><th>"+esc(p(U.colWhy,l))+"</th><th>"+esc(p(U.colOut,l))+"</th></tr></thead><tbody>";
  flagged.forEach(c=>{
   h+='<tr><td class="id">'+esc(txt(c.id||"—"))+"</td><td>"+esc(txt(c.note||""))+"</td><td>"
    +esc(flagsOf(c,topIds,l).join(" · "))+'</td><td class="res g">'+esc(p(U.rFlag,l))+"</td></tr>";
  });
  h+="</tbody></table></div></section>";
 }

 const nb=a&&a.not_benchmarked;
 if(nb&&(typeof nb==="string"||Object.keys(nb).length)){
  h+='<section class="card"><h2>'+esc(p(U.notBench,l))+"</h2>";
  if(typeof nb==="string")h+='<p class="ink">'+esc(nb)+"</p>";
  else Object.keys(nb).forEach(k=>{
   h+="<h3>"+esc(k)+'</h3><p class="ink">'+esc(txt(nb[k]))+"</p>";
  });
  h+="</section>";
 }

 const notes=[];
 if(a&&a.environment)notes.push([p(U.environment,l),txt(a.environment)]);
 if(a&&a.known_issue_during_run)notes.push([p(U.knownIssue,l),txt(a.known_issue_during_run)]);
 if(a&&a.crosscheck)notes.push([p(U.crosscheck,l),txt(a.crosscheck)]);
 const pe=(a&&Array.isArray(a.page_errors)?a.page_errors:[]).concat(a&&Array.isArray(a.console_errors)?a.console_errors:[]);
 if(notes.length||pe.length){
  h+='<section class="card"><h2>'+esc(p(U.runNotes,l))+"</h2>";
  notes.forEach(n=>{h+="<h3>"+esc(n[0])+'</h3><p class="ink">'+esc(n[1])+"</p>"});
  if(pe.length){
   h+="<h3>"+esc(p(U.pageErr,l))+" ("+pe.length+")</h3><pre>"+esc(pe.slice(0,12).map(txt).join("\n"))
    +(pe.length>12?"\n…":"")+"</pre>";
  }
  h+="</section>";
 }

 if(cases.length){
  h+='<section class="card"><h2>'+esc(p(U.allCases,l))+" ("+cases.length+")</h2>"
   +"<details><summary>"+esc(p(U.allCases,l))+"</summary>"+allCasesTable(cases,l,topIds)+"</details></section>";
 }

 if(a){
  const extra={};
  Object.keys(a).forEach(k=>{if(KNOWN.indexOf(k)<0)extra[k]=a[k]});
  if(Object.keys(extra).length){
   h+='<section class="card"><h2>'+esc(p(U.rawTitle,l))+"</h2><details><summary>"+esc(p(U.rawTitle,l))
    +"</summary><pre>"+esc(JSON.stringify(extra,null,1))+"</pre></details></section>";
  }
 }
 return h;
}

function render(l){
 document.documentElement.lang=l;
 try{localStorage.setItem("diagram_site_lang",l);localStorage.setItem("diagram_lang",l)}catch(e){}
 try{const u=new URL(location.href);u.searchParams.set("lang",l);history.replaceState(null,"",u)}catch(e){}
 const langs=document.getElementById("langs");
 langs.innerHTML="";
 L.forEach(x=>{
  const b=document.createElement("button");b.type="button";b.textContent=x==="uk"?"UA":x.toUpperCase();
  if(x===l)b.className="on";b.onclick=()=>render(x);langs.appendChild(b);
 });
 const nav=document.getElementById("nav");
 nav.innerHTML="";
 const link=(href,label)=>{const a=document.createElement("a");a.href=href;a.textContent=label;nav.appendChild(a)};
 if(TOOL)link(q(TOOL.file,l),p(U.openTool,l));
 link(q("index.html",l),p(U.tools,l));
 link(q("validation.html",l),p(U.register,l));
 link(q("disclaimer.html",l),p(U.disclaimer,l));
 document.getElementById("crumb").href=q("index.html",l);
 document.getElementById("foot").textContent=p(U.foot,l);

 const main=document.getElementById("main");
 const ttl=document.getElementById("ttl"),sub=document.getElementById("sub");

 if(FAIL_CAT){
  ttl.textContent=p(U.page,l);sub.textContent="";
  main.innerHTML='<div class="card"><p class="ink">'+esc(p(U.catErr,l))+"</p></div>";
  return;
 }
 if(!CAT){
  ttl.textContent=p(U.page,l);sub.textContent="";
  main.innerHTML='<div class="load">'+esc(p(U.loading,l))+"</div>";
  return;
 }
 if(!TOOL){
  ttl.textContent=p(U.page,l);sub.textContent="";
  main.innerHTML='<div class="card"><p class="ink">'
   +esc(WANT?p(U.unknown,l).replace("%s",WANT):p(U.noParam,l))
   +'</p><p><a href="'+esc(q("index.html",l))+'">'+esc(p(U.tools,l))+"</a></p></div>";
  return;
 }

 const st=shownStatus(TOOL);
 ttl.textContent=p(TOOL.title,l);
 sub.textContent=p(U.page,l);
 const v=TOOL.validation||{};
 let head='<section class="card"><p style="margin:0 0 8px"><span class="pill st-'+st+'">'
  +esc(p(U[st],l))+(st!=="prototype"&&v.cases?" · "+v.passed+"/"+v.cases:"")+"</span></p>";
 head+='<div class="meta"><b>'+esc(p(U.status,l))+"</b><span>"+esc(p(U[st],l))+"</span>"
  +"<b>"+esc(p(U.indep,l))+"</b><span>"+esc(v.independent_validation?p(U.yes,l):p(U.no,l))+"</span>"
  +"<b>"+esc(p(U.rev,l))+"</b><span>"+esc(TOOL.manifest_revision||"—")+"</span>"
  +"<b>"+esc(p(U.openTool,l))+'</b><span><a href="'+esc(q(TOOL.file,l))+'">'+esc(TOOL.file)+"</a></span></div></section>";

 /* The "author's own harness" statement belongs above the evidence — but only
    when there is evidence. A tool with no benchmark says that instead. */
 if(!PACKS.length){
  main.innerHTML=head+'<section class="card"><p class="ink">'+esc(p(U.noBench,l))+"</p></section>";
  return;
 }
 const honest='<section class="card honest"><h2>'+esc(p(U.notIndep,l))+"</h2><p>"
  +esc(p(U.notIndepText,l))+"</p></section>";
 main.innerHTML=head+honest+PACKS.map(pk=>packHTML(pk,l)).join("");
}

/* ---------- boot ---------- */
const l0=detect();
render(l0);
/* THE CATALOG IS SERVED BY PHP, AND THE PORT THIS PROJECT GATES ON IS NOT.
   Under `python3 -m http.server` catalog.php comes back 200 with the PHP
   SOURCE as the body, so r.ok is true and only r.json() rejects — which is why
   the failure used to be one line of prose on an otherwise empty page, on the
   very server every gate in this project runs against. Every attributed footer
   in the tree links here, so an evidence page that renders nothing under the
   development server is a hole in the chain of custody, not a cosmetic defect.
   Two ways out, in order: the real thing (catalog.php under any PHP server),
   then a pre-built catalog.json sitting beside it — the same build product
   `check.js --all` already needs (STATUS §2 trap 3). Neither is a fallback to
   stale data: catalog.json is regenerated from catalog.php by the one command
   the error message now names. If both fail the reader is told exactly which
   command to run, in all seven languages, instead of "check that PHP is
   enabled".

   ONE KNOWN COST, so nobody "fixes" it the wrong way. On a static server with
   no catalog.json present, the fallback fetch logs a 404 in the console that
   was not there before. That is the price of the page being able to work at all
   under that server, and it is cheaper than the alternative: DO NOT commit a
   catalog.json to the tree to silence it. catalog.json is a build product
   (STATUS section 2 trap 3, AGENTS section 8) and a committed one is a second
   source of truth that nobody regenerates - precisely the failure this page
   exists to expose. Under any PHP server the first fetch succeeds and the
   fallback never runs, so the 404 does not exist in the deployment that
   matters. Note also that `check.js benchmark.html` fails both before and after
   this change, for an unrelated and correct reason: this is a site page, not a
   tool, so it has no `__diagramReady` and no `#dgc-bar`. It is in catalog.php's
   SKIP list and out of `check.js --all`; `benchgate.mjs` is the gate that
   covers it. */
function loadCatalog(){
 const asJSON=r=>r.ok?r.json():Promise.reject(new Error(String(r.status)));
 return fetch("catalog.php",{cache:"no-cache"}).then(asJSON)
  .catch(()=>fetch("catalog.json",{cache:"no-cache"}).then(asJSON));
}
loadCatalog()
 .then(d=>{
  CAT=d;
  const want=WANT.toLowerCase();
  const tools=Array.isArray(d.tools)?d.tools:[];
  TOOL=tools.find(t=>String(t.id||"").toLowerCase()===want)
     ||tools.find(t=>String(t.file||"").toLowerCase()===want)
     ||tools.find(t=>String(t.file||"").toLowerCase().replace(/\.html?$/,"")===want)
     ||null;
  if(!TOOL){render(l0);return}
  const bs=(TOOL.validation&&Array.isArray(TOOL.validation.benchmarks))?TOOL.validation.benchmarks:[];
  const rev=TOOL.manifest_revision||"";
  return Promise.all(bs.map(b=>{
   const path=b.artifact||"";
   if(!path)return Promise.resolve({bench:b,art:null,path:"",rev:rev,error:false});
   return fetch(path,{cache:"no-cache"})
    .then(r=>r.ok?r.json():Promise.reject(new Error(String(r.status))))
    .then(a=>({bench:b,art:a,path:path,rev:rev,error:false}))
    .catch(()=>({bench:b,art:null,path:path,rev:rev,error:true}));
  })).then(packs=>{PACKS=packs;render(l0)});
 })
 .catch(()=>{FAIL_CAT=true;render(l0)});
})();
