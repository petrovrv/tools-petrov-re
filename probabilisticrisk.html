{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision":"2026-08-15.compute-runtime-port","id":"probabilisticrisk","file":"probabilisticrisk.html","listed":true,"category":"nuclear-eng","order":31,"title":{"en":"Probabilistic Risk Explorer","uk":"Дослідник імовірнісного ризику","de":"Probabilistischer Risiko-Explorer","nl":"Probabilistische risicoverkenner","fr":"Explorateur de risque probabiliste","es":"Explorador de riesgo probabilista","pl":"Eksplorator probabilistycznej analizy ryzyka (PSA)"},"summary":{"en":"Build linked fault trees and routed event trees, calculate exact Top Event probability, truncated or full minimal cut sets, importance, sensitivity and uncertainty.","uk":"Будуйте дерева відмов і подій, обчислюйте точну ймовірність верхньої події, мінімальні перерізи та важливість, зв’язуйте гілки ETA з FTA й досліджуйте чутливість і невизначеність.","de":"Fehler- und Ereignisbäume erstellen, exakte Top-Event-Wahrscheinlichkeit, minimale Schnittmengen und Wichtigkeiten berechnen, ETA-Zweige mit FTA-Modellen koppeln und Sensitivität sowie Unsicherheit untersuchen.","nl":"Bouw fout- en gebeurtenisbomen, bereken exacte top-eventkans, minimale cut sets en belangrijkheidsmaten, koppel ETA-takken aan FTA-modellen en onderzoek gevoeligheid en onzekerheid.","fr":"Construisez des arbres de défaillances et d’événements, calculez la probabilité exacte de l’événement sommet, les coupes minimales et les importances, liez ETA et FTA et explorez sensibilité et incertitude.","es":"Construya árboles de fallos y eventos, calcule la probabilidad exacta del evento superior, conjuntos mínimos de corte e importancias, vincule ramas ETA con FTA y explore sensibilidad e incertidumbre.","pl":"Buduj powiązane drzewa błędów i drzewa zdarzeń kierowanych, obliczaj dokładne prawdopodobieństwo zdarzenia najwyższego, obcięte lub pełne minimalne zbiory wycięć, ważność, wrażliwość i niepewność."},"description":{"en":"Interactive PSA/reliability workbench for exact Boolean fault trees, routed event trees, transfer trees, CCF, finite-state CTMC models, uncertainty and design studies. It includes exact ROBDD quantification, coherent minimal cut sets, FV/RAW/RRW/Birnbaum importance, sensitivity and Pareto screening, beta/MGL/alpha common-cause models, nested epistemic/aleatory Monte Carlo or LHS, Web Worker acceleration, conservative OpenPSA MEF import/runtime support, JSON exchange, QA diagnostics, browser validation benchmarks and a seven-language UI, printable PDF engineering reports, and a categorized library of 40 starter scenarios spanning generic reliability, electrical, mechanical/protection and nuclear event-tree patterns.","uk":"Інтерактивний PSA/надійнісний стенд для точних булевих дерев відмов, дерев подій, transfer trees, CCF, скінченних CTMC, невизначеності та design studies. Є ROBDD, мінімальні перерізи, FV/RAW/RRW/Birnbaum, Monte Carlo/LHS, OpenPSA MEF, QA, browser benchmarks і 40 категоризованих сценаріїв-пресетів. Є семимовний інтерфейс, PDF-звіти для друку та 40 категоризованих сценаріїв-пресетів.","de":"Interaktive PSA-/Zuverlässigkeits-Workbench für exakte Boolesche Fehlerbäume, Ereignisbäume, Transferbäume, CCF, endliche CTMC, Unsicherheit und Designstudien. Enthalten sind ROBDD, minimale Schnittmengen, FV/RAW/RRW/Birnbaum, Monte Carlo/LHS, OpenPSA-MEF, QA, Browser-Benchmarks und 40 kategorisierte Startmodelle. Enthalten sind eine siebensprachige Oberfläche, druckbare PDF-Engineeringberichte und 40 kategorisierte Startmodelle.","nl":"Interactieve PSA-/betrouwbaarheidswerkbank voor exacte Booleaanse foutbomen, gebeurtenisbomen, transferbomen, CCF, eindige CTMC-modellen, onzekerheid en ontwerpstudies. Bevat ROBDD, minimale cut sets, FV/RAW/RRW/Birnbaum, Monte Carlo/LHS, OpenPSA MEF, QA, browserbenchmarks en 40 gecategoriseerde startscenario’s. Bevat een zeventalige interface, afdrukbare PDF-engineeringrapporten en 40 gecategoriseerde startscenario’s.","fr":"Atelier interactif de PSA/fiabilité pour arbres de défaillances booléens exacts, arbres d’événements, transferts, CCF, CTMC finis, incertitude et études de conception. Inclut ROBDD, coupes minimales, FV/RAW/RRW/Birnbaum, Monte Carlo/LHS, OpenPSA MEF, QA, benchmarks navigateur et 40 scénarios de départ classés. Inclut une interface en sept langues, des rapports techniques PDF imprimables et 40 scénarios de départ classés.","es":"Banco interactivo de PSA/fiabilidad para árboles de fallos booleanos exactos, árboles de eventos, transferencias, CCF, CTMC finitas, incertidumbre y estudios de diseño. Incluye ROBDD, conjuntos mínimos de corte, FV/RAW/RRW/Birnbaum, Monte Carlo/LHS, OpenPSA MEF, QA, benchmarks en navegador y 40 escenarios iniciales categorizados. Incluye una interfaz en siete idiomas, informes técnicos PDF imprimibles y 40 escenarios iniciales categorizados.","pl":"Interaktywne środowisko PSA/niezawodności dla dokładnych drzew błędów boolowskich, drzew zdarzeń trasowanych, drzew transferowych, CCF, modeli CTMC o skończonych stanach, badań niepewności i projektowania. Obejmuje ono dokładną kwantyfikację ROBDD, spójne minimalne zbiory odcięć, istotność FV/RAW/RRW/Birnbaum, czułość i analizę Pareto, modele wspólnej przyczyny beta/MGL/alfa, zagnieżdżone epistemiczne/aleatoryczne metody Monte Carlo lub LHS, akcelerację Web Worker, konserwatywne wsparcie dla importu/środowiska uruchomieniowego OpenPSA MEF, wymianę JSON, diagnostykę QA, testy porównawcze walidacji przeglądarki oraz siedmiojęzyczny interfejs użytkownika, raporty inżynierskie w formacie PDF do wydruku oraz skategoryzowaną bibliotekę 40 scenariuszy startowych obejmujących ogólne wzorce drzew zdarzeń niezawodnościowych, elektrycznych, mechanicznych/zabezpieczających i jądrowych."},"status":"benchmarked","independent_validation":false,"limitations":{"en":"For education, technical exploration and preliminary assessment; design/PSA results require independent verification. The exact Top Event probability applies to the implemented independent primitive/shock representation and to browser resource limits. Coherent minimal cut sets may be truncated; NOT/non-coherent logic has no cut sets. CCF beta/MGL/alpha is an independent-shock, marginal-preserving representation; standard CCF practice generally assumes a common member distribution, and MGL is limited to four members. The importance of a CCF group member conditions on every shock containing it, so it is a component measure, not a single-variable one. CTMC rates are constant within each realization; no semi-Markov holding times or automatic state-space generation. OpenPSA MEF support is substantial but not complete; unsupported constructs are rejected. Event-tree routing must be acyclic. Pareto cost is a normalized user-weighted screening metric, not an economic estimate. The calculation record and the Python export cover the fault-tree quantification of the displayed tree; event-tree routing, the CTMC solver and Monte-Carlo propagation are not exported. This build additionally: the Monte-Carlo sampling is seeded and stream-separated, so re-running the same seed with the same model, sample count and worker count reproduces the same distribution; changing the seed, the sample count, the sampling method or the number of aleatory inner samples changes the draw and therefore moves the Monte-Carlo tiles within their statistical error. The exact Top Event probability, the cut sets and the importance measures do not depend on the seed. Reported P5/P50/P95 come from a merged DDSketch quantile tally with exact tail keepers over an explicit [1e-12, 1] value range; the tally states its own error bound and whether that bound holds.","uk":"Для навчання, технічного дослідження та попередньої оцінки; результати для design/PSA потребують незалежної перевірки. Точна ймовірність верхньої події стосується реалізованого подання незалежних примітивів/шоків і ресурсних обмежень браузера. Мінімальні перерізи (когерентна логіка) можуть обрізатися; NOT не має перерізів. CCF beta/MGL/alpha — це marginal-preserving independent-shock модель; стандартна практика зазвичай передбачає спільний розподіл членів, а MGL обмежено чотирма членами. Важливість члена групи CCF обумовлюється всіма шоками, що його містять, тобто це міра для компонента, а не для однієї змінної. Інтенсивності CTMC сталі в межах реалізації. OpenPSA MEF підтримується не повністю; непідтримувані конструкції відхиляються. Маршрутизація дерева подій має бути ациклічною. Вартість Парето — нормована зважена метрика відбору, а не економічна оцінка. Протокол розрахунку та експорт у Python охоплюють квантифікацію показаного дерева відмов; маршрутизація дерева подій, розв'язувач CTMC і Монте-Карло не експортуються. Додатково для цієї збірки: вибірка Монте-Карло засіяна й має розділені потоки, тож повторний запуск із тим самим зерном, моделлю, обсягом вибірки та кількістю воркерів відтворює той самий розподіл; зміна зерна, обсягу вибірки, методу відбору чи кількості внутрішніх алеаторних вибірок змінює розіграш і зсуває плитки Монте-Карло в межах їхньої статистичної похибки. Точна ймовірність верхньої події, перерізи та міри важливості від зерна не залежать. P5/P50/P95 беруться зі злитого квантильного талі DDSketch із точними зберігачами хвостів на явному діапазоні [1e-12, 1]; талі сам повідомляє свою межу похибки й чи вона дійсна.","de":"Für Ausbildung, technische Exploration und Vorbewertung; Design-/PSA-Ergebnisse müssen unabhängig verifiziert werden. Die exakte Top-Event-Wahrscheinlichkeit gilt für die implementierte Darstellung unabhängiger Primitive/Schocks und für die Ressourcengrenzen des Browsers. Minimale Schnittmengen gelten für kohärente Logik und können abgeschnitten werden; NOT hat keine Schnittmengen. CCF beta/MGL/alpha ist eine marginalerhaltende Independent-Shock-Darstellung; die übliche CCF-Praxis unterstellt eine gemeinsame Mitgliederverteilung, MGL ist auf vier Mitglieder begrenzt. Die Wichtigkeit eines CCF-Mitglieds bedingt auf alle Schocks, die es enthalten, ist also ein Komponentenmaß und kein Einzelvariablenmaß. CTMC-Raten sind je Realisierung konstant. OpenPSA MEF wird nicht vollständig unterstützt; nicht unterstützte Konstrukte werden abgewiesen. Die Ereignisbaum-Verzweigung muss azyklisch sein. Die Pareto-Kosten sind eine normierte, nutzergewichtete Screening-Größe, keine wirtschaftliche Schätzung. Berechnungsprotokoll und Python-Export decken die Quantifizierung des angezeigten Fehlerbaums ab; Ereignisbaum, CTMC-Löser und Monte-Carlo werden nicht exportiert. Zusätzlich in diesem Build: Die Monte-Carlo-Stichprobe ist gesät und stromgetrennt, sodass ein erneuter Lauf mit demselben Startwert, Modell, Stichprobenumfang und derselben Worker-Zahl dieselbe Verteilung reproduziert; ein anderer Startwert, Stichprobenumfang, ein anderes Stichprobenverfahren oder eine andere Zahl aleatorischer Innenproben ändert die Ziehung und verschiebt die Monte-Carlo-Kacheln daher innerhalb ihres statistischen Fehlers. Die exakte Top-Event-Wahrscheinlichkeit, die Schnittmengen und die Wichtigkeitsmaße hängen nicht vom Startwert ab. P5/P50/P95 stammen aus einer zusammengeführten DDSketch-Quantil-Tally mit exakten Randhaltern über einen explizit gesetzten Wertebereich [1e-12, 1]; die Tally nennt ihre eigene Fehlerschranke und ob diese gilt.","nl":"Voor opleiding, technische verkenning en voorlopige beoordeling; ontwerp-/PSA-resultaten vereisen onafhankelijke verificatie. De exacte top-eventkans geldt voor de geïmplementeerde weergave van onafhankelijke primitieven/schokken en voor de resourcegrenzen van de browser. Minimale cut sets gelden voor coherente logica en kunnen worden afgekapt; NOT heeft geen cut sets. CCF beta/MGL/alpha is een marginaal-behoudende independent-shock weergave; standaardpraktijk gaat doorgaans uit van een gemeenschappelijke ledenverdeling en MGL is beperkt tot vier leden. De belangrijkheid van een CCF-lid conditioneert op elke schok die het bevat; het is dus een componentmaat, geen maat voor één variabele. CTMC-snelheden zijn per realisatie constant. OpenPSA MEF is niet volledig; niet-ondersteunde constructies worden geweigerd. Routering in de gebeurtenissenboom moet acyclisch zijn. Paretokosten zijn een genormaliseerde, gewogen screeningmaat, geen economische schatting. Het berekeningsrapport en de Python-export dekken de kwantificering van de getoonde foutenboom; gebeurtenissenboom, CTMC-oplosser en Monte-Carlo worden niet geëxporteerd. Aanvullend in deze build: de Monte-Carlo-bemonstering is gezaaid en stroomgescheiden, zodat opnieuw draaien met hetzelfde zaad, model, steekproefaantal en aantal workers dezelfde verdeling reproduceert; een ander zaad, steekproefaantal, bemonsteringsmethode of aantal aleatorische binnenmonsters verandert de trekking en verschuift de Monte-Carlo-tegels dus binnen hun statistische fout. De exacte top-eventkans, de cut sets en de belangrijkheidsmaten hangen niet van het zaad af. P5/P50/P95 komen uit een samengevoegde DDSketch-kwantieltally met exacte staarthouders over een expliciet bereik [1e-12, 1]; de tally meldt zelf zijn foutgrens en of die geldt.","fr":"Pour la formation, l'exploration technique et l'évaluation préliminaire ; les résultats de conception/PSA exigent une vérification indépendante. La probabilité exacte de l'événement sommet vaut pour la représentation implémentée en primitives/chocs indépendants et pour les limites de ressources du navigateur. Les coupes minimales concernent la logique cohérente et peuvent être tronquées ; NOT n'a pas de coupes. Le CCF beta/MGL/alpha est une représentation à chocs indépendants préservant les marginales ; la pratique courante suppose une distribution commune des membres et MGL est limité à quatre membres. L'importance d'un membre d'un groupe CCF conditionne sur tous les chocs qui le contiennent : c'est une mesure de composant, pas d'une variable isolée. Les taux CTMC sont constants par réalisation. OpenPSA MEF n'est pas complet ; les constructions non prises en charge sont rejetées. Le routage de l'arbre d'événements doit être acyclique. Le coût de Pareto est une métrique de tri normalisée et pondérée, pas une estimation économique. Le relevé de calcul et l'export Python couvrent la quantification de l'arbre de défaillances affiché ; le routage d'arbre d'événements, le solveur CTMC et le Monte-Carlo ne sont pas exportés. En plus, dans cette version : l'échantillonnage Monte-Carlo est ensemencé et à flux séparés, de sorte qu'une nouvelle exécution avec la même graine, le même modèle, le même nombre d'échantillons et le même nombre de workers reproduit la même distribution ; changer la graine, le nombre d'échantillons, la méthode d'échantillonnage ou le nombre d'échantillons aléatoires internes change le tirage et déplace donc les tuiles Monte-Carlo à l'intérieur de leur erreur statistique. La probabilité exacte de l'événement sommet, les coupes et les mesures d'importance ne dépendent pas de la graine. Les P5/P50/P95 proviennent d'un comptage quantile DDSketch fusionné, avec gardiens de queue exacts, sur une plage de valeurs explicite [1e-12, 1] ; le comptage énonce lui-même sa borne d'erreur et si elle tient.","es":"Para formación, exploración técnica y evaluación preliminar; los resultados de diseño/PSA requieren verificación independiente. La probabilidad exacta del suceso superior se refiere a la representación implementada de primitivos/choques independientes y a los límites de recursos del navegador. Los conjuntos mínimos de corte son para lógica coherente y pueden truncarse; NOT no tiene cortes. El CCF beta/MGL/alpha es una representación de choques independientes que conserva las marginales; la práctica habitual supone una distribución común de los miembros y MGL se limita a cuatro miembros. La importancia de un miembro de un grupo CCF condiciona sobre todos los choques que lo contienen: es una medida de componente, no de una sola variable. Las tasas CTMC son constantes por realización. OpenPSA MEF no es completo; las construcciones no compatibles se rechazan. El encaminamiento del árbol de sucesos debe ser acíclico. El coste de Pareto es una métrica de cribado normalizada y ponderada, no una estimación económica. El registro de cálculo y la exportación a Python cubren la cuantificación del árbol de fallos mostrado; el encaminamiento del árbol de sucesos, el solucionador CTMC y el Monte-Carlo no se exportan. Además, en esta compilación: el muestreo Monte-Carlo está sembrado y con flujos separados, de modo que repetir la ejecución con la misma semilla, modelo, número de muestras y número de workers reproduce la misma distribución; cambiar la semilla, el número de muestras, el método de muestreo o el número de muestras aleatorias internas cambia el sorteo y por tanto desplaza las casillas Monte-Carlo dentro de su error estadístico. La probabilidad exacta del evento superior, los conjuntos de corte y las medidas de importancia no dependen de la semilla. Los P5/P50/P95 provienen de un conteo de cuantiles DDSketch fusionado, con guardianes de cola exactos, sobre un rango de valores explícito [1e-12, 1]; el conteo declara su propia cota de error y si esa cota se cumple.","pl":"Do celów edukacyjnych, eksploracji technicznej i wstępnej oceny; wyniki projektu/PSA wymagają niezależnej weryfikacji. Dokładne prawdopodobieństwo zdarzenia najwyższego odnosi się do zaimplementowanej niezależnej reprezentacji zdarzeń pierwotnych i wspólnej przyczyny oraz do limitów zasobów przeglądarki. Spójne minimalne zbiory cięć mogą być obcinane; logika NOT/niespójna nie ma zbiorów cięć. CCF beta/MGL/alpha to reprezentacja niezależnego szoku, zachowująca brzegi; standardowa praktyka CCF generalnie zakłada rozkład wspólnych elementów, a MGL jest ograniczony do czterech elementów. Znaczenie elementu grupy CCF zależy od każdego zdarzenia wspólnej przyczyny, które go obejmuje, więc jest to miara składowa, a nie jednowymiarowa. Stawki CTMC są stałe w każdej realizacji; brak czasów utrzymania semi-Markowa ani automatycznego generowania przestrzeni stanów. Wsparcie OpenPSA MEF jest znaczące, ale niepełne; nieobsługiwane konstrukcje są odrzucane. Trasowanie drzewa zdarzeń musi być acykliczne. Koszt Pareto to znormalizowana ważona przez użytkownika metryka przesiewowa, a nie szacunek ekonomiczny. Rekord obliczeń i eksport Pythona obejmują kwantyfikację drzewa błędów wyświetlanego drzewa; Trasowanie drzewa zdarzeń, solver CTMC i propagacja Monte Carlo nie są eksportowane. Ta kompilacja dodatkowo: próbkowanie Monte Carlo jest zasiewane i rozdzielane strumieniowo, więc ponowne uruchomienie tego samego zasiewu z tym samym modelem, liczbą próbek i liczbą pracowników odtwarza ten sam rozkład; zmiana zasiewu, liczby próbek, metody próbkowania lub liczby aleatorycznych próbek wewnętrznych zmienia losowanie, a tym samym przesuwa kafelki Monte Carlo w granicach ich błędu statystycznego. Dokładne prawdopodobieństwo zdarzenia najwyższego, zestawy odcięć i miary istotności nie zależą od zasiewu. Zgłoszone wartości P5/P50/P95 pochodzą z połączonego zestawienia kwantyli DDSketch z dokładnymi wartościami kesonowymi dla jawnego zakresu wartości [1e-12, 1]; zestawienie określa własną granicę błędu i to, czy ta granica jest zachowana."},"intended_use":["education","technical exploration","preliminary assessment"],"catalog_languages":["en","uk","de","nl","fr","es","pl"],"tool_languages":["en","uk","de","nl","fr","es","pl"],"dependencies":["diagram-common.js","diagram-compute.classic.js"],"network_access":{"mode":"same-origin-data","note":"Loads only files served from this site next to the HTML: site-disclaimer.js, diagram-common.js and diagram-compute.classic.js (the shared compute runtime). The Web Workers used for exact BDD quantification are built from an in-page Blob, not fetched. No external host is contacted and nothing is transmitted: the model, the imported files, the seed and every result stay in the browser."},"validation":{"basis":{"en":"Re-benchmarked on 2026-08-22 against this build (2026-08-15.compute-runtime-port), driven over HTTP from the deployed page: 18 of 18 cases pass. The reference is recomputed, not reused: /root/bench3/refsrc/pr_ref.py re-derives every number in python and quantifies each case three mutually independent ways — exhaustive truth-table enumeration, brute-force minimal cut sets with inclusion-exclusion (sum of disjoint products where the cut-set count requires it), and a from-scratch Shannon-expansion ROBDD — which agree to 1.4e-17 absolute; the common-cause expansions come from the NUREG/CR-5485 closed forms and the six basic-event probability models are re-derived symbolically with sympy from their defining ODE and time-average integral. Exact top-event probability, minimal cut sets and their products, the rare-event sum, all importance measures, the common-cause primitive probabilities and the event-tree frequencies agree to 8.1e-16 relative against a 1e-12 criterion; each printed cell agrees within its five-significant-digit rounding; the Monte-Carlo mean over 2500 Latin-hypercube cases is 4.7e-7 from the analytic mean. The reservation that kept the previous status — that the re-implemented uncertainty propagation made one of the eighteen cases irreproducible — no longer holds: the draw is seeded and two independent runs of all eighteen cases produced byte-identical results, Monte-Carlo mean, median, P5, P95 and variance split included. All eighteen cases produced distinct results, so every case landed on the page. The harness is the author's own and no external party has reviewed it, so independent_validation stays false; the Markov/CTMC event models, the OpenPSA import, the design-space screening, the correlated uncertainty groups and the epistemic quantiles are outside this benchmark and are listed as not benchmarked in the artifact. Two of the eighteen cases are not a re-execution of the 2026-08-12 contract: the artifact recorded reference values for `deep_mixed` and `event_models` but never the models themselves, and the recorded numbers do not determine them (a topology and six parameter sets respectively), so both were REDEFINED to test the same behaviour, are marked reference_reconstruction \"redefined\" in the artifact, and are excluded from the regression comparison. The other sixteen were reconstructed exactly and reproduce their recorded value.","uk":"Повторно перевірено бенчмарком 2026-08-22 на цій збірці (2026-08-15.compute-runtime-port), керуючи розгорнутою сторінкою через HTTP: 18 з 18 випадків пройдено. Еталон перераховано, а не перевикористано: /root/bench3/refsrc/pr_ref.py заново виводить кожне число на Python і квантифікує кожен випадок трьома взаємно незалежними способами — повний перебір таблиці істинності, мінімальні перерізи «в лоб» із включеннями-виключеннями (сума неперетинних добутків там, де кількість перерізів цього вимагає) і написана з нуля BDD на розкладі Шеннона, — які збігаються до 1,4e-17 абсолютно; розклади відмов із загальної причини взято із замкнених формул NUREG/CR-5485, а шість моделей імовірності базових подій заново виведено символьно за допомогою sympy з їхніх визначальних ОДР і середнього за часом інтеграла. Точна ймовірність верхньої події, мінімальні перерізи та їхні добутки, сума рідкісних подій, усі міри важливості, первинні ймовірності відмов із загальної причини й частоти дерева подій збігаються до 8,1e-16 відносно за критерієм 1e-12; кожна надрукована комірка збігається в межах свого округлення до п'яти значущих цифр; середнє Монте-Карло за 2500 випадками латинського гіперкуба відхиляється від аналітичного середнього на 4,7e-7. Застереження, яке тримало попередній статус, — що перереалізоване поширення невизначеності зробило один із вісімнадцяти випадків невідтворюваним — більше не діє: вибірка засіяна, і два незалежні прогони всіх вісімнадцяти випадків дали побайтово однакові результати, включно із середнім, медіаною, P5, P95 і розкладом дисперсії Монте-Карло. Усі вісімнадцять випадків дали різні результати, отже кожен випадок справді потрапив на сторінку. Харнес — власний авторський, жодна стороння особа його не переглядала, тому independent_validation лишається false; моделі Маркова/CTMC, імпорт OpenPSA, скринінг простору проєктування, корельовані групи невизначеності та епістемічні квантилі лежать поза цим бенчмарком і перелічені в артефакті як неперевірені. Два з вісімнадцяти випадків не є повторним виконанням контракту від 2026-08-12: артефакт записав еталонні значення для `deep_mixed` і `event_models`, але не самі моделі, а записані числа їх не визначають (топологія та шість наборів параметрів відповідно), тож обидва ПЕРЕВИЗНАЧЕНО для перевірки тієї самої поведінки, позначено в артефакті як reference_reconstruction \"redefined\" і виключено з регресійного порівняння. Решту шістнадцять відновлено точно, і вони відтворюють свої записані значення.","de":"Am 2026-08-22 gegen diesen Build (2026-08-15.compute-runtime-port) neu vermessen, die ausgelieferte Seite über HTTP angesteuert: 18 von 18 Fällen bestehen. Die Referenz ist neu berechnet, nicht wiederverwendet: /root/bench3/refsrc/pr_ref.py leitet jede Zahl in Python neu her und quantifiziert jeden Fall auf drei wechselseitig unabhängige Weisen — vollständige Wahrheitstafel-Aufzählung, minimale Schnittmengen per Brute Force mit Inklusion-Exklusion (Summe disjunkter Produkte, wo die Zahl der Schnittmengen es verlangt) und ein von Grund auf geschriebenes ROBDD über Shannon-Entwicklung —, die auf 1,4e-17 absolut übereinstimmen; die CCF-Entwicklungen stammen aus den geschlossenen Formeln von NUREG/CR-5485, und die sechs Wahrscheinlichkeitsmodelle für Basisereignisse werden mit sympy symbolisch aus ihrer definierenden Differentialgleichung bzw. ihrem Zeitmittel-Integral neu hergeleitet. Exakte Top-Event-Wahrscheinlichkeit, minimale Schnittmengen und ihre Produkte, die Rare-Event-Summe, alle Wichtigkeitsmaße, die CCF-Primitivwahrscheinlichkeiten und die Ereignisbaum-Häufigkeiten stimmen auf 8,1e-16 relativ gegen ein Kriterium von 1e-12 überein; jede gedruckte Zelle stimmt im Rahmen ihrer Rundung auf fünf signifikante Stellen; der Monte-Carlo-Mittelwert über 2500 Latin-Hypercube-Fälle liegt 4,7e-7 vom analytischen Mittelwert entfernt. Der Vorbehalt, der den bisherigen Status hielt — die neu implementierte Unsicherheitspropagation mache einen der achtzehn Fälle nicht reproduzierbar —, gilt nicht mehr: die Stichprobe ist geseedet, und zwei unabhängige Läufe aller achtzehn Fälle lieferten bitgleiche Ergebnisse, einschließlich Monte-Carlo-Mittelwert, Median, P5, P95 und Varianzaufteilung. Alle achtzehn Fälle lieferten unterschiedliche Ergebnisse, jeder Fall ist also tatsächlich auf der Seite angekommen. Der Prüfstand stammt vom Autor selbst und wurde von niemandem von außen geprüft, daher bleibt independent_validation false; die Markov-/CTMC-Ereignismodelle, der OpenPSA-Import, das Entwurfsraum-Screening, die korrelierten Unsicherheitsgruppen und die epistemischen Quantile liegen außerhalb dieses Benchmarks und sind im Artefakt als nicht vermessen aufgeführt. Zwei der achtzehn Fälle sind keine Wiederholung des Vertrags vom 2026-08-12: Das Artefakt hielt für `deep_mixed` und `event_models` Referenzwerte fest, aber nie die Modelle selbst, und die aufgezeichneten Zahlen legen sie nicht fest (eine Topologie bzw. sechs Parametersätze). Beide wurden daher NEU DEFINIERT, um dasselbe Verhalten zu prüfen, sind im Artefakt als reference_reconstruction \"redefined\" gekennzeichnet und aus dem Regressionsvergleich ausgenommen. Die übrigen sechzehn wurden exakt rekonstruiert und reproduzieren ihren aufgezeichneten Wert.","nl":"Op 2026-08-22 opnieuw gebenchmarkt tegen deze build (2026-08-15.compute-runtime-port), waarbij de uitgeleverde pagina via HTTP is aangestuurd: 18 van de 18 gevallen slagen. De referentie is herberekend, niet hergebruikt: /root/bench3/refsrc/pr_ref.py leidt elk getal opnieuw af in python en kwantificeert elk geval op drie onderling onafhankelijke manieren — uitputtende waarheidstabel-opsomming, minimale snedes met brute kracht via inclusie-exclusie (som van disjuncte producten waar het aantal snedes dat vereist) en een van de grond af geschreven ROBDD via Shannon-expansie — die tot 1,4e-17 absoluut overeenkomen; de CCF-uitwerkingen komen uit de gesloten formules van NUREG/CR-5485 en de zes kansmodellen voor basisgebeurtenissen zijn met sympy symbolisch herleid uit hun definiërende differentiaalvergelijking en tijdgemiddelde integraal. De exacte top-eventkans, de minimale snedes en hun producten, de zeldzame-gebeurtenissom, alle belangrijkheidsmaten, de CCF-primitieve kansen en de gebeurtenisboomfrequenties komen overeen tot 8,1e-16 relatief tegen een criterium van 1e-12; elke afgedrukte cel klopt binnen haar afronding op vijf significante cijfers; het Monte-Carlo-gemiddelde over 2500 Latin-hypercube-gevallen ligt 4,7e-7 van het analytische gemiddelde. Het voorbehoud dat de vorige status vasthield — dat de opnieuw geïmplementeerde onzekerheidspropagatie één van de achttien gevallen onreproduceerbaar maakte — geldt niet meer: de trekking is geseed en twee onafhankelijke runs van alle achttien gevallen leverden bit-identieke resultaten op, inclusief Monte-Carlo-gemiddelde, mediaan, P5, P95 en variantieverdeling. Alle achttien gevallen leverden verschillende resultaten op, dus elk geval is werkelijk op de pagina geland. De testbank is die van de auteur zelf en is door geen externe partij beoordeeld, dus independent_validation blijft false; de Markov/CTMC-gebeurtenismodellen, de OpenPSA-import, de ontwerpruimte-screening, de gecorreleerde onzekerheidsgroepen en de epistemische kwantielen vallen buiten deze benchmark en staan in het artefact vermeld als niet gebenchmarkt. Twee van de achttien gevallen zijn geen heruitvoering van het contract van 2026-08-12: het artefact legde referentiewaarden vast voor `deep_mixed` en `event_models` maar nooit de modellen zelf, en de vastgelegde getallen bepalen ze niet (een topologie respectievelijk zes parametersets). Beide zijn daarom HERGEDEFINIEERD om hetzelfde gedrag te toetsen, zijn in het artefact gemarkeerd als reference_reconstruction \"redefined\" en zijn uitgesloten van de regressievergelijking. De overige zestien zijn exact gereconstrueerd en reproduceren hun vastgelegde waarde.","fr":"Ré-étalonné le 2026-08-22 sur cette version (2026-08-15.compute-runtime-port), la page déployée étant pilotée via HTTP : 18 cas sur 18 réussissent. La référence est recalculée et non réutilisée : /root/bench3/refsrc/pr_ref.py redérive chaque nombre en python et quantifie chaque cas de trois manières mutuellement indépendantes — énumération exhaustive de la table de vérité, coupes minimales par force brute avec inclusion-exclusion (somme de produits disjoints là où le nombre de coupes l'impose) et un ROBDD écrit de zéro par expansion de Shannon —, qui concordent à 1,4e-17 en absolu ; les développements de défaillances de cause commune proviennent des formes fermées de NUREG/CR-5485 et les six modèles de probabilité d'événement de base sont redérivés symboliquement avec sympy à partir de leur équation différentielle définissante et de leur intégrale de moyenne temporelle. La probabilité exacte de l'événement sommet, les coupes minimales et leurs produits, la somme d'événements rares, toutes les mesures d'importance, les probabilités primitives de cause commune et les fréquences de l'arbre d'événements concordent à 8,1e-16 en relatif face à un critère de 1e-12 ; chaque cellule imprimée concorde dans les limites de son arrondi à cinq chiffres significatifs ; la moyenne Monte-Carlo sur 2500 cas hypercube latin est à 4,7e-7 de la moyenne analytique. La réserve qui maintenait le statut précédent — la propagation d'incertitude réécrite rendait l'un des dix-huit cas irreproductible — ne tient plus : le tirage est à germe fixé et deux exécutions indépendantes des dix-huit cas ont donné des résultats identiques au bit près, moyenne, médiane, P5, P95 et décomposition de variance Monte-Carlo comprises. Les dix-huit cas ont produit des résultats distincts : chaque cas a donc bien atteint la page. Le banc est celui de l'auteur et aucun tiers ne l'a revu, donc independent_validation reste false ; les modèles d'événement Markov/CTMC, l'import OpenPSA, le criblage de l'espace de conception, les groupes d'incertitude corrélés et les quantiles épistémiques sont hors de ce banc d'essai et figurent dans l'artefact comme non étalonnés. Deux des dix-huit cas ne sont pas une re-execution du contrat du 2026-08-12 : l'artefact a consigne des valeurs de reference pour `deep_mixed` et `event_models` mais jamais les modeles eux-memes, et les nombres consignes ne les determinent pas (une topologie et six jeux de parametres respectivement). Les deux ont donc ete REDEFINIS pour tester le meme comportement, sont marques reference_reconstruction \"redefined\" dans l'artefact, et sont exclus de la comparaison de regression. Les seize autres ont ete reconstruits exactement et reproduisent leur valeur consignee.","es":"Vuelto a evaluar con banco de pruebas el 2026-08-22 sobre esta compilación (2026-08-15.compute-runtime-port), gobernando la página desplegada por HTTP: 18 de 18 casos se superan. La referencia se recalcula, no se reutiliza: /root/bench3/refsrc/pr_ref.py vuelve a derivar cada número en python y cuantifica cada caso de tres maneras mutuamente independientes — enumeración exhaustiva de la tabla de verdad, conjuntos de corte mínimos por fuerza bruta con inclusión-exclusión (suma de productos disjuntos donde el número de cortes lo exige) y un ROBDD escrito desde cero por expansión de Shannon —, que concuerdan hasta 1,4e-17 en absoluto; los desarrollos de fallos de causa común proceden de las formas cerradas de NUREG/CR-5485 y los seis modelos de probabilidad de sucesos básicos se vuelven a derivar simbólicamente con sympy a partir de su ecuación diferencial definitoria y de su integral de promedio temporal. La probabilidad exacta del suceso superior, los conjuntos de corte mínimos y sus productos, la suma de sucesos raros, todas las medidas de importancia, las probabilidades primitivas de causa común y las frecuencias del árbol de sucesos concuerdan hasta 8,1e-16 en relativo frente a un criterio de 1e-12; cada celda impresa concuerda dentro de su redondeo a cinco cifras significativas; la media de Monte-Carlo sobre 2500 casos de hipercubo latino dista 4,7e-7 de la media analítica. La reserva que mantenía el estado anterior — que la propagación de incertidumbre reimplementada hacía irreproducible uno de los dieciocho casos — ya no se sostiene: el muestreo lleva semilla y dos ejecuciones independientes de los dieciocho casos dieron resultados idénticos bit a bit, incluidas la media, la mediana, P5, P95 y el reparto de varianza de Monte-Carlo. Los dieciocho casos produjeron resultados distintos, de modo que cada caso llegó realmente a la página. El banco es del propio autor y ningún tercero lo ha revisado, por lo que independent_validation permanece en false; los modelos de sucesos Markov/CTMC, la importación OpenPSA, el cribado del espacio de diseño, los grupos de incertidumbre correlacionados y los cuantiles epistémicos quedan fuera de este banco de pruebas y figuran en el artefacto como no evaluados. Dos de los dieciocho casos no son una reejecucion del contrato del 2026-08-12: el artefacto registro valores de referencia para `deep_mixed` y `event_models` pero nunca los modelos en si, y los numeros registrados no los determinan (una topologia y seis conjuntos de parametros, respectivamente). Ambos se REDEFINIERON para comprobar el mismo comportamiento, estan marcados como reference_reconstruction \"redefined\" en el artefacto y quedan excluidos de la comparacion de regresion. Los otros dieciseis se reconstruyeron exactamente y reproducen su valor registrado.","pl":"Ponownie porównano 22.08.2026 z tą kompilacją (15.08.2026.compute-runtime-port), sterowaną przez HTTP ze strony wdrożenia: 18 z 18 przypadków zakończyło się sukcesem. Odwołanie jest ponownie obliczane, a nie ponownie wykorzystywane: /root/bench3/refsrc/pr_ref.py ponownie wyprowadza każdą liczbę w Pythonie i kwantyfikuje każdy przypadek na trzy wzajemnie niezależne sposoby — wyczerpujące wyliczenie tablicy prawdy, siłowe minimalne zbiory wycięć z włączeniem-wykluczeniem (suma iloczynów rozłącznych tam, gdzie wymaga tego liczba zbiorów wycięć) oraz od podstaw rozwinięcie Shannona ROBDD — które są zgodne z absolutnym 1.4e-17; rozwinięcia o wspólnej przyczynie pochodzą z zamkniętych form NUREG/CR-5485, a sześć modeli prawdopodobieństwa zdarzeń podstawowych jest ponownie wyprowadzanych symbolicznie z sympy z ich definiującego równania różniczkowego zwyczajnego i całki uśrednionej w czasie. Dokładne prawdopodobieństwo zdarzenia najwyższego, minimalne zestawy cięć i ich produkty, suma zdarzeń rzadkich, wszystkie miary ważności, prawdopodobieństwa pierwotne i wspólnej przyczyny i częstości drzewa zdarzeń zgadzają się na 8,1e-16 względnie względem kryterium 1e-12; każda wydrukowana komórka zgadza się w ramach swojego pięciocyfrowego zaokrąglenia; średnia Monte Carlo dla 2500 przypadków hipersześcianu łacińskiego jest 4,7e-7 od średniej analitycznej. Zastrzeżenie, które utrzymywało poprzedni status — że ponownie zaimplementowana propagacja niepewności sprawiła, że ​​jeden z osiemnastu przypadków był nieodtwarzalny — już nie obowiązuje: losowanie jest zasiane, a dwa niezależne przebiegi wszystkich osiemnastu przypadków wygenerowały bajtowo identyczne wyniki, wliczając średnią Monte Carlo, medianę, P5, P95 i podział wariancji. Wszystkie osiemnaście przypadków wygenerowało odrębne wyniki, więc każdy przypadek wylądował na stronie. Zestaw testowy został przygotowany przez autora i nie został poddany przeglądowi przez żadną stronę zewnętrzną, więc independent_validation pozostaje fałszem; Modele zdarzeń Markowa/CTMC, import OpenPSA, przesiewanie przestrzeni projektowej, skorelowane grupy niepewności i kwantyle epistemiczne znajdują się poza tym testem porównawczym i są wymienione w artefakcie jako nieobjęte testem porównawczym. Dwa z osiemnastu przypadków nie stanowią ponownego wykonania kontraktu z 12.08.2026: artefakt zarejestrował wartości referencyjne dla `deep_mixed` i `event_models`, ale nigdy samych modeli, a zarejestrowane wartości ich nie determinują (odpowiednio topologia i sześć zestawów parametrów), więc oba zostały PRZEDDEFINIOWANE w celu przetestowania tego samego zachowania, oznaczone jako „redefined” w artefakcie jako reference_reconstruction i wyłączone z porównania regresji. Pozostałe szesnaście przypadków zostało dokładnie zrekonstruowanych i odtwarza zarejestrowane wartości."},"independent_validation":false,"benchmarks":[{"id":"fault-tree-event-tree-ccf-2026-08-22","reference":"Independent python implementation of the Boolean algebra the tool claims: exhaustive truth-table enumeration over the independent primitive events, brute-force minimal cut sets quantified by inclusion-exclusion (sum-of-disjoint-products where the cut-set count makes inclusion-exclusion intractable), and a from-scratch Shannon-expansion ROBDD; CCF expansions from the beta-factor, MGL and alpha-factor definitions in NUREG/CR-5485; the six basic-event probability models re-derived symbolically with sympy from their defining ODE / time-average integral; importance measures from their textbook definitions.","citations":["A. Mosleh et al., NUREG/CR-5485 (INEEL/EXT-97-01327), \"Guidelines on Modeling Common-Cause Failures in Probabilistic Risk Assessment\", USNRC 1998 — sec. 4/5: beta-factor Q_k = beta*Q_t; MGL Q_k = (1/C(n-1,k-1)) (prod_{i=2..k} rho_i)(1-rho_{k+1}) Q_t; alpha-factor (non-staggered) Q_k = (k/C(n-1,k-1)) (alpha_k/alpha_t) Q_t with alpha_t = sum_k k*alpha_k.","NUREG-0492, \"Fault Tree Handbook\", USNRC 1981 — ch. VII/XI: minimal cut sets, rare-event and min-cut upper-bound approximations.","NASA/SP-2011-3421, \"Probabilistic Risk Assessment Procedures Guide for NASA Managers and Practitioners\", 2nd ed., ch. 6-8 — Birnbaum, Fussell-Vesely, RAW and RRW definitions.","R. E. Bryant, \"G dkowany według ważności Fussella-Vesely'ego oraz mapa zależności zdarzeń współdzielonych między drzewami. Edytowalny przez przeciąganie jest tylko widok drzewa błędów.","The exposure time t used by every time-dependent basic-event model: 1 − exp(−λt) for a non-repairable component, the transient of a repairable one, the Weibull and the CTMC states. An event entered as a direct probability q does not depend on it. The slider is logarithmic from 0.5 h to 720 h; an imported model may carry any positive value.":"Czas ekspozycji t używany przez każdy zależny od czasu model zdarzenia bazowego: 1 − exp(-λt) dla składnika nienaprawialnego, stan przejściowy składnika naprawialnego, stany Weibulla i CTMC. Zdarzenie wprowadzone jako prawdopodobieństwo bezpośrednie q nie zależy od niego. Suwak jest logarytmiczny od 0,5 h do 720 h; importowany model może przyjmować dowolną wartość dodatnią.","Export writes this model as JSON, exactly as the tool holds it; Import reads that file back. OpenPSA XML reads a Model Exchange Format file, including basic-event expressions, which are re-executed at the current mission time. The calculation record, the CSV, the Python script, the PDF report and the permalink are in the shared bar at the bottom of the window.":"Funkcja eksportu zapisuje ten model w formacie JSON, dokładnie tak, jak jest on przechowywany przez narzędzie; funkcja importu odczytuje ten plik. Funkcja OpenPSA XML odczytuje plik w formacie Model Exchange Format, zawierający podstawowe wyrażenia zdarzeń, które są ponownie wykonywane w czasie trwania misji. Rekord obliczeń, plik CSV, skrypt Pythona, raport PDF i stały link znajdują się na pasku współdzielonym u dołu okna.","Fault trees and gates":"Drzewa błędów i bramki","Drag a gate or an event from the palette onto the drawing, then drag the blue port of a parent onto a child to connect them. The top node of the tree is the Top Event. Quantification is exact on a reduced ordered binary decision diagram, so an event that appears in two branches is counted once, unlike a gate-by-gate product.":"Przeciągnij bramkę lub zdarzenie z palety na rysunek, a następnie przeciągnij niebieski port elementu nadrzędnego na element podrzędny, aby je połączyć. Najwyższym węzłem drzewa jest zdarzenie najwyższe. Kwantyfikacja jest dokładna na zredukowanym, uporządkowanym binarnym diagramie decyzyjnym, więc zdarzenie pojawiające się w dwóch gałęziach jest liczone raz, w przeciwieństwie do iloczynu bramka po bramce.","An initiating event with a frequency, then one stage per safety function. Each stage carries a failure probability, either entered directly or taken from the Top Event of a linked fault tree. Sequence frequency is the initiator frequency times the branch probabilities; the Sequences tab lists them with their outcomes.":"Zdarzenie inicjujące z określoną częstotliwością, następnie jeden etap na funkcję bezpieczeństwa. Każdy etap niesie ze sobą prawdopodobieństwo awarii, wprowadzone bezpośrednio lub pobrane ze zdarzenia głównego powiązanego drzewa błędów. Częstotliwość sekwencji to częstotliwość inicjatora pomnożona przez prawdopodobieństwa gałęzi; karta „Sekwencje” zawiera listę sekwencji wraz z ich wynikami.","State-transition models":"Modele przejść stanów","A finite continuous-time Markov chain: states, transition rates, one initial state and any number of failure states. A basic event may take its probability from the summed occupancy of the failure states at mission time, which is how standby trains with test and repair are represented.":"Skończony łańcuch Markowa w czasie ciągłym: stany, intensywności przejść, jeden stan początkowy i dowolna liczba stanów awaryjnych. Zdarzenie podstawowe może przyjmować prawdopodobieństwo równe sumarycznemu prawdopodobieństwu przebywania w stanach awaryjnych w chwili końca misji; w ten sposób modelowane są układy rezerwowe z testowaniem i naprawą.","One entry per component failure mode, reusable in as many trees as needed. The inspector chooses its probability model — direct q, non-repairable, repairable, periodically tested, standby, Weibull, GLM, an OpenPSA expression or a Markov model — and its uncertainty distribution and common-cause group. A member of a common-cause group is expanded into an independent part and the shocks it shares, so its marginal probability is exactly the q you entered.":"Jeden wpis na tryb awarii komponentu, wielokrotnego użytku w dowolnej liczbie drzew. Inspektor wybiera swój model prawdopodobieństwa — bezpośredni q, nienaprawialny, naprawialny, okresowo testowany, rezerwowy, Weibulla, GLM, wyrażenie OpenPSA lub model Markowa — oraz jego rozkład niepewności i grupę przyczyn wspólnych. Członek grupy przyczyn wspólnych jest rozwijany do niezależnej części i wspólnych szoków, więc jego prawdopodobieństwo brzegowe wynosi dokładnie tyle, ile wpisałeś q.","Everything about the current selection: the node, the basic event behind it, the event-tree stage or the Markov state. Editing a field here changes the model and recomputes immediately; every change is undoable.":"Wszystko o bieżącym zaznaczeniu: węzeł, zdarzenie bazowe za nim, etap drzewa zdarzeń czy stan Markowa. Edycja pola w tym miejscu zmienia model i natychmiast go przelicza; każdą zmianę można cofnąć.","Exact Top Event probability":"Dokładne prawdopodobieństwo zdarzenia szczytowego","P(φ = 1) evaluated on a reduced ordered binary decision diagram: P(node) = (1−q)·P(low) + q·P(high). It is exact for the model as entered — no rare-event approximation, no truncation — and it is the number the record, the report and the Python export carry.":"P(φ = 1) obliczone na zredukowanym, uporządkowanym diagramie decyzyjnym binarnym: P(węzeł) = (1−q)·P(niski) + q·P(wysoki). Jest to wartość dokładna dla wprowadzonego modelu — bez przybliżenia zdarzeń rzadkich, bez obcinania — i jest to liczba przenoszona przez rekord, raport i eksport Pythona.","The smallest combinations of basic events that on their own cause the Top Event. Their summed products are the rare-event approximation, which always overstates the exact value because overlaps are counted twice; the gap between the two tiles is that error. The list is coherent-logic only and may be truncated by order, product probability or cap — the exact probability never is.":"Najmniejsze kombinacje zdarzeń podstawowych, które same w sobie powodują zdarzenie główne. Ich sumaryczne iloczyny stanowią przybliżenie zdarzeń rzadkich, które zawsze zawyża dokładną wartość, ponieważ nakładki liczone są dwukrotnie; odstęp między dwoma kafelkami stanowi ten błąd. Lista jest logicznie spójna i może zostać skrócona ze względu na kolejność, prawdopodobieństwo iloczynu lub limit – dokładne prawdopodobieństwo nigdy nie jest skrócone.","FV is the share of the Top Event probability that passes through this event; RAW is what happens if it is certain to fail; RRW is what is gained if it never fails; Birnbaum is the derivative of the Top Event probability with respect to its own probability. Each is computed by conditioning the diagram on the event’s own primitive variables, so a common-cause member is treated correctly.":"FV jest udziałem prawdopodobieństwa zdarzenia szczytowego przypisywanym danemu zdarzeniu; RAW pokazuje skutek przy wymuszeniu jego pewnej awarii; RRW — korzyść przy wymuszeniu pełnej niezawodności; miara Birnbauma jest pochodną prawdopodobieństwa zdarzenia szczytowego względem prawdopodobieństwa tego zdarzenia. Każdą miarę oblicza się przez warunkowanie diagramu względem własnych zmiennych pierwotnych zdarzenia, dzięki czemu element grupy CCF jest traktowany poprawnie.","Analysis tabs":"Karty analizy","Cut sets and their coverage, the importance ranking, a sensitivity sweep of one event and of mission time, Monte-Carlo or Latin-hypercube uncertainty propagation, event-tree sequences, the model QA findings and a comparison of saved designs. Truncation settings and the Boolean ordering live in the Cut Sets tab and are recorded with the result.":"Zestawy cięć i ich pokrycie, ranking ważności, analiza wrażliwości jednego zdarzenia i czasu misji, propagacja niepewności metodą Monte Carlo lub hipersześcianu łacińskiego, sekwencje drzewa zdarzeń, wyniki kontroli jakości modelu oraz porównanie zapisanych projektów. Ustawienia obcinania i kolejność boolowska są dostępne na karcie „Zestawy cięć” i zapisywane wraz z wynikiem.","FTA · ETA · cut sets · importance · uncertainty":"FTA · ETA · minimalne zbiory odcięć · ważność · niepewność","0.5 h to 720 h, logarithmic":"0,5 h do 720 h, skala logarytmiczna","Probabilistic Risk Explorer":"Eksplorator probabilistycznej analizy ryzyka (PSA)","Fault Tree":"Drzewo błędów","Event Tree":"Drzewo zdarzeń","Markov":"Markow","Risk Flow":"Przepływ ryzyka","Dependencies":"Zależności","Language":"Język","Mission":"Misja","prob.":"prawd.","Import JSON":"Importuj JSON","OpenPSA XML":"OpenPSA XML","Export":"Eksportuj","PDF Report":"Raport PDF","Model":"Model","Load preset":"Załaduj model startowy","New":"Nowy","Fault Trees":"Drzewa błędów","Duplicate":"Duplikuj","Event Trees":"Drzewa zdarzeń","Markov Models":"Modele Markowa","Fault-tree palette":"Paleta drzewa błędów","Basic Events":"Zdarzenia podstawowe","Fit":"Dopasuj","Auto layout":"Automatyczny układ","CCF group":"Grupa CCF","Cut Sets":"Minimalne zbiory odcięć","Importance":"Ważność","Sensitivity":"Wrażliwość","Uncertainty":"Niepewność","Sequences":"Sekwencje","Compare":"Porównaj","Name":"Nazwa","Tree name":"Nazwa drzewa","Color by":"Kolor według","Exact Top Event":"Dokładne prawdopodobieństwo zdarzenia szczytowego","ROBDD nodes":"Węzły ROBDD","Exact / rare":"Dokładne / przybliżone","Select top":"Wybierz zdarzenie szczytowe","Delete tree":"Usuń drzewo","No fault tree":"Brak drzewa błędów","Markov model":"Model Markowa","Markov state":"Stan Markowa","No model selected.":"Nie wybrano modelu.","Failure state":"Stan awaryjny","Initial state":"Stan początkowy","Available state":"Stan dostępny","Delete state":"Usuń stan","Transition":"Przejście","Outgoing:":"Wyjścio const UI_I18N_CI=Object.fromEntries(Object.entries(UI_I18N).map(([l,d])=>[l,Object.fromEntries(Object.entries(d).map(([k,v])=>[k.toLowerCase(),v]))]));
const _i18nTextSource=new WeakMap(),_i18nAttrSource=new WeakMap();
function tr(s,lang=currentLang){s=String(s??'');return lang==='en'?s:(UI_I18N[lang]?.[s]||UI_I18N_CI[lang]?.[s.toLowerCase()]||translatePattern(s,lang)||s)}
function translatePattern(s,lang=currentLang){let m;if((m=s.match(/^(\d+) presets$/)))return m[1]+' '+({'uk':'пресетів','de':'Vorlagen','nl':'presets','fr':'scénarios','es':'escenarios','pl':'modeli startowych'}[lang]||'presets');if((m=s.match(/^(\d+) nodes · (\d+) basic events$/)))return {uk:`${m[1]} вузлів · ${m[2]} базових подій`,de:`${m[1]} Knoten · ${m[2]} Basisereignisse`,nl:`${m[1]} knopen · ${m[2]} basisgebeurtenissen`,fr:`${m[1]} nœuds · ${m[2]} événements de base`,es:`${m[1]} nodos · ${m[2]} sucesos básicos`,pl:`${m[1]} węzłów · ${m[2]} zdarzeń podstawowych`}[lang]||s;if((m=s.match(/^(\d+) finding\(s\)$/)))return {uk:`${m[1]} зауважень`,de:`${m[1]} Befunde`,nl:`${m[1]} bevindingen`,fr:`${m[1]} constats`,es:`${m[1]} hallazgos`,pl:`${m[1]} ustaleń`}[lang]||s;return null}
function translateTextNode(n){if(!n||n.nodeType!==3)return;let src=_i18nTextSource.get(n);if(src==null){src=n.nodeValue;_i18nTextSource.set(n,src)}const lead=src.match(/^\s*/)?.[0]||'',trail=src.match(/\s*$/)?.[0]||'',core=src.trim();if(!core)return;const out=tr(core);const val=lead+out+trail;if(n.nodeValue!==val)n.nodeValue=val}
function translateAttrs(el){if(!el||el.nodeType!==1)return;let rec=_i18nAttrSource.get(el);if(!rec){rec={};_i18nAttrSource.set(el,rec)}for(const a of ['title','placeholder','aria-label']){if(el.hasAttribute(a)){if(rec[a]==null)rec[a]=el.getAttribute(a);const out=tr(rec[a]);if(el.getAttribute(a)!==out)el.setAttribute(a,out)}}if(el.tagName==='OPTGROUP'&&el.hasAttribute('label')){if(rec.label==null)rec.label=el.getAttribute('label');el.setAttribute('label',tr(rec.label))}}
function applyLanguage(root=document){const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=tw.nextNode()){const p=n.parentElement;if(p&&!['SCRIPT','STYLE','TEXTAREA','PRE','CODE'].includes(p.tagName))translateTextNode(n)}const els=root.querySelectorAll?root.querySelectorAll('*'):[];for(const el of els)translateAttrs(el);
 // Write document-level attributes only when they really change: an unconditional write
 // fires an attribute mutation that other page-level scripts (site-disclaimer.js observes
 // <html lang>) answer by re-rendering into <body>, which would re-enter the observer below.
 if(document.documentElement.lang!==currentLang)document.documentElement.lang=currentLang;
 const sn=selfName(),ttl=tr('Probabilistic Risk Explorer')+(sn?' — '+sn:'');if(document.title!==ttl)document.title=ttl;
 const sel=$('#langSelect');if(sel&&sel.value!==currentLang)sel.value=currentLang}
let _langObserver=null;function setLanguage(lang){if(!SUPPORTED_LANGS.includes(lang))lang='en';currentLang=lang;window.__diagramLang=lang;try{localStorage.setItem('diagram_site_lang',lang);localStorage.setItem('diagram_lang',lang)}catch(e){}try{const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u)}catch(e){}applyLanguage(document);if(typeof updatePresetHint==='function')updatePresetHint();if(window.Diagram)try{window.Diagram.setLang(lang)}catch(e){}}
const _LANG_OBS={subtree:true,childList:true,characterData:true};
function initI18n(){const sel=$('#langSelect');if(sel){sel.value=currentLang;sel.onchange=e=>setLanguage(e.target.value)}applyLanguage(document);
 // The observer translates dynamically rendered UI. It must never react to the DOM changes it
 // makes itself, otherwise every render feeds it a new batch and the main thread never yields.
 _langObserver=new MutationObserver(ms=>{
  _langObserver.disconnect();
  try{for(const m of ms){if(m.type==='characterData')translateTextNode(m.target);for(const x of m.addedNodes||[]){if(x.nodeType===3)translateTextNode(x);else if(x.nodeType===1)applyLanguage(x)}}}
  finally{_langObserver.takeRecords();_langObserver.observe(document.body,_LANG_OBS)}
 });
 _langObserver.observe(document.body,_LANG_OBS)}

function missionFromSlider(v){return 10**(-0.30103 + Number(v)/100*(Math.log10(720)+0.30103))}

function eventDef(name,q=.001,extra={}){return Object.assign({id:uid('E'),name,tag:'',model:'probability',q,lambda:1e-5,mu:.01,repairMode:'steady',mission:24,testInterval:168,qDemand:0,lambdaStandby:1e-6,lambdaRun:1e-5,muStandby:.01,weibullAlpha:1000,weibullBeta:1,weibullT0:0,markovModel:'',source:'',comment:'',dist:'none',uncertaintyKind:'epistemic',distParam:'q',median:q,ef:3,distP1:q,distP2:Math.max(Math.abs(q)*.2,1e-9),distP3:Math.max(Math.abs(q)*2,1),designWeight:1,ccfGroup:'',corrGroup:''},extra)}
function node(type,name,x,y,extra={}){return Object.assign({id:uid('n'),type,name:name||NODE_TYPES[type][0],x,y,children:[],k:2,eventId:null,houseValue:false,transferTree:''},extra)}
function ft(name='Fault Tree'){return {id:uid('ft'),name,root:null,nodes:{}}}

/* This page's own address, without the shared runtime. The degraded report

 try{if(window.Diagram&&Diagram.site)return Diagram.site.name(currentLang)}catch(e){}
 try{if(location.host)return location.host}catch(e){}
 return '';
}

 try{if(window.Diagram&&Diagram.site)return Diagram.site.sourceRef(currentLang,f)}catch(e){}
 try{if(/^https?:$/.test(location.protocol))
  return location.origin+location.pathname.replace(/[^/]*$/,'')+f}catch(e){}

def clamp(x, lo=0.0, hi=1.0):

def hidden_unavailability(lam, interval):
    """Average unavailability of a periodically tested, undetected failure."""

def event_probability(e, t=MISSION_TIME_H):
    """Basic-event probability at mission time t."""
    m = e.get("model", "probability")
    if m == "probability" or m == "fixed":
        return clamp(e.get("q", 0.0))
    lam = max(0.0, e.get("lambda", 0.0))
    mu = max(0.0, e.get("mu", 0.0))
    if m == "nonrepairable":
        return clamp(1.0 - math.exp(-lam * t))
    if m == "repairable":
        ss = lam / (lam + mu) if (lam + mu) else 0.0
        if e.get("repairMode") == "mission":
            return clamp(ss * (1.0 - math.exp(-(lam + mu) * t)))
        return clamp(ss)
    if m == "periodic":
        u = hidden_unavailability(lam, e.get("testInterval", 0.0))
        return clamp(1.0 - (1.0 - clamp(e.get("qDemand", 0.0))) * (1.0 - u))
    if m == "standby":

        surv = math.exp(-max(0.0, e.get("lambdaRun", 0.0)) * t)

    """Probability of each specific CCF shock, NUREG/CR-5485.
    beta : all members together, Q_k = beta*Qt

    alpha: Q_k = (k/C(n-1,k-1)) (alpha_k/alpha_t) Qt   (non-staggered)"""

    if mode == "beta":
        beta = clamp(group.get("beta", 0.0))
        if beta > 0:
            out.append((tuple(members), clamp(beta * qref), n))
        return out
    if mode == "mgl":
        rho = {2: clamp(group.get("beta", 0.0)), 3: clamp(group.get("gamma", 0.0)),
               4: clamp(group.get("delta", 0.0))}

        for k in range(2, n + 1):
            prod *= rho.get(k, 0.0)

            w = prod * (1.0 - nxt) if k < n else prod
            if w <= 0:

            for s in itertools.combinations(members, k):

            a.append(0.0)
        a = a[:n]
        at = sum((i + 1) * x for i, x in enumerate(a))
        if at <= 0:
            return out
        for k in range(2, n + 1):
            w = k * a[k - 1] / at
            if w <= 0:
                continue
            each = qref * w / max(1, math.comb(n - 1, k - 1))
            for s in itertools.combinations(members, k):
                out.append((s, clamp(each), k))

    """Independent primitive variables of the model and their probabilities."""

            name = "CCF:" + gid + ":" + "+".join(members)

class BDD:
    """Reduced ordered binary decision diagram (Bryant 1986)."""

    def __init__(self, order):
        self.order = {v: i for i, v in enumerate(order)}
        self.nodes = {}
        self.unique = {}
        self.memo = {}
        self.notmemo = {}
        self.next_id = 2

    def idx(self, v):
        if v not in self.order:
            self.order[v] = len(self.order)
        return self.order[v]

    def mk(self, v, lo, hi):
        if lo == hi:
            return lo
        key = (v, lo, hi)
        if key in self.unique:
            return self.unique[key]
        i = self.next_id
        self.next_id += 1
        self.nodes[i] = key
        self.unique[key] = i
        return i

    def var(self, v):
        return self.mk(v, 0, 1)

    def apply(self, op, a, b):
        if op == "and":
            if a == 0 or b == 0: return 0
            if a == 1: return b
            if b == 1: return a
            if a == b: return a
        else:
            if a == 1 or b == 1: return 1
            if a == 0: return b
            if b == 0: return a
            if a == b: return a
        key = (op, a, b)
        if key in self.memo:
            return self.memo[key]
        ia = math.inf if a < 2 else self.idx(self.nodes[a][0])
        ib = math.inf if b < 2 else self.idx(self.nodes[b][0])
        iv = min(ia, ib)
        v = self.nodes[a][0] if ia <= ib else self.nodes[b][0]
        alo, ahi = (self.nodes[a][1], self.nodes[a][2]) if ia == iv else (a, a)
        blo, bhi = (self.nodes[b][1], self.nodes[b][2]) if ib == iv else (b, b)
        r = self.mk(v, self.apply(op, alo, blo), self.apply(op, ahi, bhi))
        self.memo[key] = r
        return r

    def neg(self, a):
        if a == 0: return 1
        if a == 1: return 0
        if a in self.notmemo:
            return self.notmemo[a]
        v, lo, hi = self.nodes[a]
        r = self.mk(v, self.neg(lo), self.neg(hi))
        self.notmemo[a] = r
        return r

    def probability(self, root, probs):
        memo = {}

        def rec(i):
            if i == 0: return 0.0
            if i == 1: return 1.0
            if i in memo: return memo[i]
            v, lo, hi = self.nodes[i]
            p = clamp(probs.get(v, 0.0))
            memo[i] = (1.0 - p) * rec(lo) + p * rec(hi)

def fold(mgr, op, items, identity):
    if not items:

    cur = list(items)
    while len(cur) > 1:

        for i in range(0, len(cur), 2):
            nxt.append(mgr.apply(op, cur[i], cur[i + 1]) if i + 1 < len(cur) else cur[i])

        nd = list(dp)
        for j in range(1, k + 1):
            nd[j] = mgr.apply("or", dp[j], mgr.apply("and", dp[j - 1], c))

    kids = [build(mgr, c, event_vars) for c in node.get("c", [])]
    if t == "not":

    if t == "and":

    if t == "or":
        return fold(mgr, "or", kids, 0)

            if len(out) >= cap:

        return minimize([tuple(set(x) | set(y)) for x in a for y in b])

    q, probs, event_vars = primitive_context()

    order = sorted(cuts, key=lambda c: -math.prod([probs[v] for v in c]))

  topevent:{title:T6('Exact Top Event probability','Точна ймовірність верхньої події','Exakte Top-Event-Wahrscheinlichkeit','Exacte top-eventkans','Probabilité exacte de l’événement sommet','Probabilidad exacta del suceso superior'),
   body:T6('P(φ = 1) evaluated on a reduced ordered binary decision diagram: P(node) = (1−q)·P(low) + q·P(high). It is exact for the model as entered — no rare-event approximation, no truncation — and it is the number the record, the report and the Python export carry.',
    'P(φ = 1), обчислена на ROBDD: P(вузол) = (1−q)·P(low) + q·P(high). Це точне значення для введеної моделі — без наближення рідкісних подій і без усічення — і саме воно потрапляє в запис, звіт та експорт Python.',
    'P(φ = 1), auf einem ROBDD ausgewertet: P(Knoten) = (1−q)·P(low) + q·P(high). Exakt für das eingegebene Modell — ohne Seltene-Ereignis-Näherung, ohne Abschneiden — und genau die Zahl, die Datensatz, Bericht und Python-Export tragen.',
    'P(φ = 1), geëvalueerd op een ROBDD: P(knoop) = (1−q)·P(laag) + q·P(hoog). Exact voor het ingevoerde model — geen zeldzame-gebeurtenisbenadering, geen afkapping — en het getal dat record, rapport en Python-export dragen.',
    'P(φ = 1) évaluée sur un ROBDD : P(nœud) = (1−q)·P(bas) + q·P(haut). Exacte pour le modèle saisi — sans approximation d’événements rares ni troncature — et c’est le nombre que portent l’enregistrement, le rapport et l’export Python.',
    'P(φ = 1) evaluada sobre un ROBDD: P(nodo) = (1−q)·P(bajo) + q·P(alto). Es exacta para el modelo introducido —sin aproximación de sucesos raros ni truncamiento— y es el número que llevan el registro, el informe y la exportación de Python.')},
  cutsets:{title:T6('Minimal cut sets','Мінімальні перерізи','Minimale Schnittmengen','Minimale cut sets','Coupes minimales','Conjuntos mínimos de corte'),
   body:T6('The smallest combinations of basic events that on their own cause the Top Event. Their summed products are the rare-event approximation, which always overstates the exact value because overlaps are counted twice; the gap between the two tiles is that error. The list is coherent-logic only and may be truncated by order, product probability or cap — the exact probability never is.',
    'Найменші комбінації базових подій, які самі спричиняють верхню подію. Сума їхніх добутків — наближення рідкісних подій, яке завжди завищує точне значення, бо перетини враховуються двічі; різниця між двома плитками і є цією похибкою. Список лише для когерентної логіки і може бути усічений за порядком, ймовірністю добутку чи лімітом — точна ймовірність ніколи.',
    'Die kleinsten Kombinationen von Basisereignissen, die das Top-Event allein auslösen. Die Summe ihrer Produkte ist die Seltene-Ereignis-Näherung, die den exakten Wert stets überschätzt, weil Überschneidungen doppelt zählen; der Abstand beider Kacheln ist dieser Fehler. Die Liste gilt nur für kohärente Logik und kann nach Ordnung, Produktwahrscheinlichkeit oder Obergrenze abgeschnitten werden — die exakte Wahrscheinlichkeit nie.',
    'De kleinste combinaties van basisgebeurtenissen die het top-event zelfstandig veroorzaken. De som van hun producten is de zeldzame-gebeurtenisbenadering, die de exacte waarde altijd overschat omdat overlap dubbel telt; het verschil tussen beide tegels is die fout. De lijst geldt alleen voor coherente logica en kan worden afgekapt op orde, productkans of maximum — de exacte kans nooit.',
    'Les plus petites combinaisons d’événements de base qui provoquent à elles seules l’événement sommet. La somme de leurs produits est l’approximation des événements rares, toujours supérieure à la valeur exacte car les recouvrements comptent deux fois ; l’écart entre les deux tuiles est cette erreur. La liste ne vaut que pour la logique cohérente et peut être tronquée ; la probabilité exacte, jamais.',
    'Las combinaciones más pequeñas de sucesos básicos que por sí solas causan el suceso superior. La suma de sus productos es la aproximación de sucesos raros, que siempre sobreestima el valor exacto porque los solapamientos se cuentan dos veces; la diferencia entre ambas casillas es ese error. La lista solo vale para lógica coherente y puede truncarse; la probabilidad exacta, nunca.')},
  importance:{title:T6('Importance measures','Міри важливості','Wichtigkeitsmaße','Belangrijkheidsmaten','Mesures d’importance','Medidas de importancia'),
   body:T6('FV is the share of the Top Event probability that passes through this event; RAW is what happens if it is certain to fail; RRW is what is gained if it never fails; Birnbaum is the derivative of the Top Event probability with respect to its own probability. Each is computed by conditioning the diagram on the event’s own primitive variables, so a common-cause member is treated correctly.',
    'FV — частка ймовірності верхньої події, що проходить через цю подію; RAW — що буде, якщо вона напевно відмовить; RRW — що виграємо, якщо не відмовить ніколи; Бірнбаум — похідна ймовірності верхньої події за її власною ймовірністю. Усе обчислюється умовним звуженням діаграми за примітивними змінними події, тож член групи спільної причини враховано правильно.',
    'FV ist der Anteil der Top-Event-Wahrscheinlichkeit, der durch dieses Ereignis läuft; RAW zeigt den Fall des sicheren Ausfalls; RRW den Gewinn bei nie eintretendem Ausfall; Birnbaum ist die Ableitung der Top-Event-Wahrscheinlichkeit nach der eigenen Wahrscheinlichkeit. Berechnet wird über die primitiven Variablen des Ereignisses, sodass Common-Cause-Mitglieder korrekt behandelt werden.',
    'FV is het deel van de top-eventkans dat door deze gebeurtenis loopt; RAW toont het geval van zeker falen; RRW de winst bij nooit falen; Birnbaum is de afgeleide van de top-eventkans naar de eigen kans. Alles wordt berekend door de diagram te conditioneren op de primitieve variabelen van de gebeurtenis, zodat een common-cause-lid correct wordt behandeld.',
    'FV est la part de la probabilité sommet qui passe par cet événement ; RAW le cas où il défaille à coup sûr ; RRW le gain s’il ne défaille jamais ; Birnbaum la dérivée de la probabilité sommet par rapport à la sienne. Le calcul conditionne le diagramme sur les variables primitives de l’événement, ce qui traite correctement un membre de cause commune.',
    'FV es la parte de la probabilidad superior que pasa por este suceso; RAW el caso de fallo seguro; RRW la ganancia si nunca falla; Birnbaum la derivada de la probabilidad superior respecto de la suya. Se calcula condicionando el diagrama sobre las variables primitivas del suceso, de modo que un miembro de causa común se trata correctamente.')},
  analysis:{title:T6('Analysis tabs','Вкладки аналізу','Analyse-Reiter','Analysetabbladen','Onglets d’analyse','Pestañas de análisis'),
   body:T6('Cut sets and their coverage, the importance ranking, a sensitivity sweep of one event and of mission time, Monte-Carlo or Latin-hypercube uncertainty propagation, event-tree sequences, the model QA findings and a comparison of saved designs. Truncation settings and the Boolean ordering live in the Cut Sets tab and are recorded with the result.',
    'Перерізи та їхнє покриття, рейтинг важливості, чутливість однієї події та часу місії, поширення невизначеності методом Монте-Карло або латинського гіперкуба, послідовності дерева подій, зауваження QA і порівняння збережених варіантів. Налаштування усічення та булевого впорядкування — у вкладці «Перерізи», і вони потрапляють у запис.',
    'Schnittmengen und ihre Abdeckung, die Wichtigkeitsrangfolge, ein Sensitivitätslauf über ein Ereignis und über die Missionszeit, Monte-Carlo- oder Latin-Hypercube-Unsicherheit, Ereignisbaumsequenzen, die QA-Befunde und ein Vergleich gespeicherter Entwürfe. Abschneidegrenzen und die boolesche Ordnung stehen im Reiter Schnittmengen und werden mit dem Ergebnis aufgezeichnet.',
    'Cut sets en hun dekking, de belangrijkheidsrangschikking, een gevoeligheidsloop over één gebeurtenis en over de missietijd, Monte-Carlo- of latin-hypercube-onzekerheid, sequenties, de QA-bevindingen en een vergelijking van bewaarde ontwerpen. Afkapinstellingen en de Booleaanse ordening staan in het tabblad Cut Sets en worden met het resultaat vastgelegd.',
    'Les coupes et leur couverture, le classement d’importance, un balayage de sensibilité sur un événement et sur la durée de mission, la propagation d’incertitude Monte-Carlo ou hypercube latin, les séquences, les constats QA et la comparaison des variantes enregistrées. Les seuils de troncature et l’ordre booléen sont dans l’onglet Coupes et sont consignés avec le résultat.',
    'Los cortes y su cobertura, el ranking de importancia, un barrido de sensibilidad sobre un suceso y sobre el tiempo de misión, la propagación de incertidumbre Monte-Carlo o hipercubo latino, las secuencias, los hallazgos de QA y la comparación de diseños guardados. Los ajustes de truncamiento y el orden booleano están en la pestaña de cortes y se registran con el resultado.')}
 },

/* ---- header actions: the tool's own history, in the framework's header ---- */
const ACT_UNDO={id:'undoBtn',icon:'↶',title:()=>DiagramUI.t('undo',currentLang),
 run:()=>restoreHistory(histIndex-1)};
const ACT_REDO={id:'redoBtn',icon:'↷',title:()=>DiagramUI.t('redo',currentLang),
 run:()=>restoreHistory(histIndex+1)};

function manifestText(key,lang){
 try{
  const m=JSON.parse(document.getElementById('diagram-tool-manifest').textContent);
  const v=m[key];return (v&&(v[lang]||v.en))||'';
 }catch(e){return ''}
}
function loadPresetAction(){
 const name=$('#presetSelect').value;
 transact(()=>{model=PRESETS[name]();currentFtId=model.faultTrees[0].id;currentEtId=model.eventTrees[0].id;
  currentMarkovId=Object.keys(model.markovModels||{})[0]||'';
  ui.selectedNode=ui.selectedEvent=ui.selectedStage=ui.selectedMarkovState=null;
  ui.highlightCut=null;ui.ftTrail=[]},'load preset');
 updatePresetHint();fitView();toast('Preset loaded: '+name);
}

/* ---- the shell ------------------------------------------------------------ */
function mountUI(){
 if(!window.DiagramUI||DiagramUI.api!==PR_UI_API){mountFallback();return false}
 dgu=DiagramUI.app({
  id:'probabilisticrisk',mount:'#app',layout:'studio',compute:'live',
  state:fstate,defaults:FSTATE_DEFAULT,history:false,
  subtitle:T6('FTA · ETA · cut sets · importance · uncertainty',
   'FTA · ETA · перерізи · важливість · невизначеність',
   'FTA · ETA · Schnittmengen · Wichtigkeit · Unsicherheit',
   'FTA · ETA · cut sets · belangrijkheid · onzekerheid',
   'FTA · ETA · coupes · importance · incertitude',
   'FTA · ETA · cortes · importancia · incertidumbre'),
  header:{actions:[ACT_UNDO,ACT_REDO]},
  learn:PR_LEARN,
  shortcuts:[
   {keys:'mod+z',label:()=>DiagramUI.t('undo',currentLang),run:()=>restoreHistory(histIndex-1)},
   {keys:'mod+y,mod+shift+z',label:()=>DiagramUI.t('redo',currentLang),run:()=>restoreHistory(histIndex+1)},
   {keys:'f',label:LB('Fit'),run:()=>fitView()},
   {keys:'a',label:LB('Auto layout'),run:()=>autoLayout()}
  ],
  regions:{
   stage:function(host,app){
    dguStage=app.stage({
     caption:LB('Drag nodes · wheel zoom · drag background to pan · blue port connects parent → child'),
     minHeight:440,
     a11y:function(){
      const f=currentFt();
      if(ui.mode!=='fta'||!f)return tr(({fta:'Fault Tree',eta:'Event Tree',markov:'Markov',
       risk:'Risk Flow',deps:'Dependencies'})[ui.mode]||'');
      return tr('Fault Tree')+': '+(f.name||'')+' · '+Object.keys(f.nodes).length+' '+tr('nodes')+
       ' · '+tr('Exact Top Event')+' '+fmt(derived?derived.Q:null,3);
     },
     render:function(){
      if(PR_CANVAS.parentNode!==dguStage.body)dguStage.body.appendChild(PR_CANVAS);
      renderCanvas();
     },
     fit:function(){fitView()}
    });
    dguStage.body.appendChild(PR_CANVAS);      /* attached at once: fitView measures it */
    buildCanvasToolbar();
   },
   dock:function(host,app){
    dguTabs=app.tabs({slot:'dock',items:TABS.map(t=>({id:t,label:LB(t)})),value:ui.activeTab,
     onSelect:function(id){if(_tabSync)return;ui.activeTab=id;renderTabs()}});
   }
  },
  panels:[
   {id:'examples',slot:'inputs',title:()=>DiagramUI.t('examples',currentLang),learn:'presets',
    render:function(box){box.appendChild(presetBox())},
    actions:[{id:'loadPreset',label:LB('Load preset'),variant:'primary',run:loadPresetAction}]},

   {id:'view',slot:'inputs',title:LB('View'),learn:'modes',
    fields:[{id:'f-mode',key:'mode',type:'segmented',label:LB('Model view'),learn:'modes',
     options:[['fta',LB('Fault Tree')],['eta',LB('Event Tree')],['markov',LB('Markov')],
      ['risk',LB('Risk Flow')],['deps',LB('Dependencies')]]}]},

   {id:'model',slot:'inputs',title:LB('Model'),learn:'mission',
    fields:[
     {id:'f-mission',key:'missionSlider',type:'range',min:0,max:100,step:1,
      label:LB('Mission'),learn:'mission',
      hint:T6('0.5 h to 720 h, logarithmic','від 0,5 год до 720 год, логарифмічно',
       '0,5 h bis 720 h, logarithmisch','0,5 h tot 720 h, logaritmisch',
       'de 0,5 h à 720 h, logarithmique','de 0,5 h a 720 h, logarítmico')},
     {id:'f-missionv',key:'missionShown',type:'readonly',label:LB('Mission time'),
      get:()=>(model.missionTime<10?model.missionTime.toFixed(1):String(Math.round(model.missionTime)))+' h'}],
    render:function(box){box.appendChild(computeBox())}},

   {id:'modelio',slot:'inputs',title:LB('Model file'),learn:'modelio',
    render:function(box){box.appendChild(fileBox())},
    actions:[
     {id:'importBtn',label:LB('Import JSON'),run:()=>$('#fileInput').click()},
     {id:'openPsaBtn',label:LB('OpenPSA XML'),run:()=>$('#openPsaInput').click()},
     {id:'exportBtn',label:LB('Export'),run:exportModel}]},

   {id:'fts',slot:'inputs',title:LB('Fault Trees'),learn:'faulttree',
    render:function(box){box.appendChild(hostEl('ftNav'))},
    actions:[
     {id:'addFt',label:LB('+ tree'),run:()=>{const f=ft('Fault Tree '+(model.faultTrees.length+1));
      transact(()=>{model.faultTrees.push(f);currentFtId=f.id;ui.selectedNode=null},'add tree')}},
     {id:'dupFt',label:LB('Duplicate'),run:duplicateTree}]},

   {id:'ets',slot:'inputs',title:LB('Event Trees'),learn:'eventtree',
    render:function(box){box.appendChild(hostEl('etNav'))},
    actions:[{id:'addEt',label:LB('+ event tree'),run:()=>{const e=et('Event Tree '+(model.eventTrees.length+1));
     transact(()=>{model.eventTrees.push(e);currentEtId=e.id;ui.mode='eta'},'add event tree')}}]},

   {id:'markovs',slot:'inputs',title:LB('Markov Models'),learn:'markov',
    render:function(box){box.appendChild(hostEl('markovNav'))},
    actions:[{id:'addMarkov',label:LB('+ state model'),run:addMarkovModel}]},

   {id:'palette',slot:'inputs',title:LB('Fault-tree palette'),learn:'faulttree',
    fields:[{id:'f-palette',key:'mode',type:'custom',label:LB('Gates and events'),learn:'faulttree',
     visible:()=>ui.mode==='fta',
     render:function(box){box.appendChild(hostEl('palette','palette'))}}]},

   {id:'events',slot:'inputs',title:LB('Basic Events'),learn:'events',
    render:function(box){box.appendChild(hostEl('eventNav'))}},

   /* Reset lives in the inputs footer, under that name (placement law 4.3).
      For this tool "reset" is the old New model action: the declared default. */
   {id:'resetrow',slot:'inputs',
    render:function(box,ctx){
     const app=ctx&&ctx.app;if(!app)return;
     const row=document.createElement('div');row.className='dgu-panel-actions';
     row.appendChild(app.actionButton(app.resetAction()));
     box.appendChild(row);
    }},

   {id:'inspector',slot:'detail',title:LB('Inspector'),learn:'inspector',
    render:function(box){box.appendChild(hostEl('inspector'))}},

   {id:'analysis',slot:'dock',title:LB('Analysis'),learn:'analysis',
    render:function(box){box.appendChild(hostEl('tabbody'))}}
  ],
  footer:function(host,app){
   const d=document.createElement('details');
   const s=document.createElement('summary');s.textContent=tr('Model and limitations');
   const p=document.createElement('p');p.textContent=manifestText('limitations',app.lang);
   d.appendChild(s);d.appendChild(p);host.appendChild(d);
  },
  on:{
   compute:function(){
    if(pushFieldState()){
     const r=calculate();
     if(r&&typeof r.then==='function')return r.then(()=>riskResults());
    }
    return riskResults();
   },
   change:function(key,value){
    if(key==='mode'&&value!==ui.mode){
     ui.mode=value;ui.selectedNode=null;ui.selectedStage=null;renderAll();
    }
   },
   reset:function(fresh,app){
    app.state=fstate;
    fstate.mode='fta';ui.mode='fta';
    transact(()=>{model=defaultModel();model.name='Untitled risk model';
     currentFtId=model.faultTrees[0].id;currentEtId=model.eventTrees[0].id;
     currentMarkovId=Object.keys(model.markovModels||{})[0]||'';ui.ftTrail=[];
     ui.selectedNode=ui.selectedEvent=ui.selectedStage=ui.selectedMarkovState=null},'new model');
    lastSlider=fstate.missionSlider=sliderFromMission(model.missionTime);
    fitView();
   },
   lang:function(l){setLanguage(l)},
   ready:function(app){
    dgu=app;
    buildCanvasToolbar();
    renderAll(false);
    paintResults();
    a11yNames();
    setTimeout(()=>{fitView();a11yNames()},0);
   }
  }
 });
 return true;
}

 wrap.querySelector('#fbTrees').append(hostEl('ftNav'),hostEl('etNav'),hostEl('markovNav'));
 wrap.querySelector('#paletteSec').appendChild(hostEl('palette','palette'));
 wrap.querySelector('#fbEvents').appendChild(hostEl('eventNav'));
 wrap.querySelector('#fbStage').appendChild(PR_CANVAS);
 buildCanvasToolbar();
 const fit=document.createElement('button');fit.id='fitBtn';fit.className='dgu-btn';
 fit.textContent=tr('Fit');fit.onclick=fitView;
 PR_CANVAS.querySelector('#canvasToolbar').appendChild(fit);
 wrap.querySelector('#fbInspector').appendChild(hostEl('inspector'));
 wrap.querySelector('#fbTabs').appendChild(hostEl('tabbody'));
 const mr=wrap.querySelector('#missionRange');
 mr.value=sliderFromMission(model.missionTime);
 mr.oninput=e=>{model.missionTime=missionFromSlider(e.target.value);
  wrap.querySelector('#missionLabel').textContent=model.missionTime<10
   ?model.missionTime.toFixed(1)+' h':Math.round(model.missionTime)+' h';calculate()};
 return false;
}

function duplicateTree(){
 const f=deep(currentFt());f.id=uid('ft');f.name+=' copy';
 const map={};for(const n of Object.values(f.nodes)){const ni=uid('n');map[n.id]=ni;n.id=ni}
 const nn={};for(const n of Object.values(f.nodes)){n.children=n.children.map(x=>map[x]||x);nn[n.id]=n}
 f.nodes=nn;f.root=map[f.root]||f.root;
 transact(()=>{model.faultTrees.push(f);currentFtId=f.id},'duplicate tree');
}

/* ---- boot ------------------------------------------------------------------
   The shell renders first, from the manifest alone, before the tool touches its
   model; Diagram.init() is called unconditionally at the end, as it always was.
   The whole sequence waits for DOMContentLoaded because diagram-ui.js, like the
   other two shared files, is deferred. */
function bootTool(){
 mountUI();
 initI18n();initPalette();initPresets();tryLoadSaved();normalizeModel(model);
 currentFtId=currentFtId||model.faultTrees[0]?.id;currentEtId=currentEtId||model.eventTrees[0]?.id;
 selfTests=runSelfTests();bindGlobal();pushHistory('initial');calculate();fitView();
 if(dgu&&dgu.ready)dgu.ready();
 dgcInit();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootTool);else bootTool();
</script>
