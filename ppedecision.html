 "summary": {
  "en": "Assigns generic PPE classes to hazards left after elimination, substitution, engineering and administrative controls, and builds a task × PPE matrix with rule IDs and sources.",
  "uk": "Призначає загальні класи ЗІЗ небезпекам, що лишилися після усунення, заміни, інженерних та адміністративних заходів, і будує матрицю завдання × ЗІЗ з ID правил і джерелами.",
  "de": "Ordnet Gefährdungen, die nach Beseitigung, Substitution, technischen und organisatorischen Maßnahmen verbleiben, generische PSA-Klassen zu und erstellt eine Matrix Tätigkeit × PSA mit Regel-IDs und Quellen.",
  "nl": "Kent generieke PBM-klassen toe aan gevaren die na eliminatie, substitutie, technische en organisatorische maatregelen overblijven, en bouwt een matrix taak × PBM met regel-ID's en bronnen.",

  "pl": "Przypisuje ogólne klasy ŚOI zagrożeniom pozostałym po eliminacji, zamianie, środkach technicznych i organizacyjnych oraz buduje macierz zadanie × ŚOI z ID reguł i źródłami."

 "description": {
  "en": "A step workflow: tasks with their environment, hazards with type, route, severity and exposure, then the hierarchy-of-controls status of each hazard. A versioned rule set maps each residual hazard to a generic PPE class (eye/face, hearing, respiratory, head, hand, foot, body, fall) and a standard family, never to a product. Missing context yields insufficient data instead of a class; filtering respirators are rejected where oxygen deficiency is declared or unknown. Each matrix cell opens its trace hazard → residual risk → rule → source. Compatibility flags cover combinations such as eyewear with a respirator seal. Exports: CSV matrix with rule IDs, JSON case file, PDF record. Imports residual hazards from the JSA/TRA builder exchange file.",
  "uk": "Покроковий процес: завдання з середовищем, небезпеки з типом, шляхом впливу, тяжкістю та експозицією, далі статус ієрархії заходів для кожної небезпеки. Версійований набір правил зіставляє кожну залишкову небезпеку із загальним класом ЗІЗ (очі/обличчя, слух, органи дихання, голова, руки, ноги, тіло, падіння) і родиною стандартів, ніколи з конкретним виробом. Брак контексту дає «недостатньо даних», а не клас; фільтрувальні респіратори відхиляються, якщо дефіцит кисню заявлено або не з’ясовано. Кожна клітинка матриці відкриває ланцюжок небезпека → залишковий ризик → правило → джерело. Прапорці сумісності охоплюють поєднання на кшталт окулярів і прилягання маски. Експорт: CSV-матриця з ID правил, JSON-файл випадку, PDF-запис. Імпорт залишкових небезпек з файлу обміну JSA/TRA.",
  "de": "Ein Schrittablauf: Tätigkeiten mit Umgebung, Gefährdungen mit Art, Einwirkungsweg, Schwere und Exposition, danach der Stand der Maßnahmenhierarchie je Gefährdung. Ein versioniertes Regelwerk ordnet jeder Restgefährdung eine generische PSA-Klasse (Augen/Gesicht, Gehör, Atemschutz, Kopf, Hand, Fuß, Körper, Absturz) und eine Normenfamilie zu, nie ein Produkt. Fehlender Kontext ergibt „Daten unzureichend“ statt einer Klasse; Filtergeräte werden abgelehnt, wenn Sauerstoffmangel angegeben oder unbekannt ist. Jede Matrixzelle öffnet ihre Spur Gefährdung → Restrisiko → Regel → Quelle. Verträglichkeitshinweise decken Kombinationen wie Brille und Maskendichtsitz ab. Export: CSV-Matrix mit Regel-IDs, JSON-Falldatei, PDF-Protokoll. Import von Restgefährdungen aus der Austauschdatei des JSA/TRA-Builders.",
  "nl": "Een stappenplan: taken met hun omgeving, gevaren met type, blootstellingsroute, ernst en blootstelling, daarna de status van de arbeidshygiënische strategie per gevaar. Een geversioneerde regelset koppelt elk restgevaar aan een generieke PBM-klasse (ogen/gezicht, gehoor, adembescherming, hoofd, hand, voet, lichaam, valbeveiliging) en een normfamilie, nooit aan een product. Ontbrekende context geeft ‘onvoldoende gegevens’ in plaats van een klasse; filterende adembescherming wordt afgewezen waar zuurstoftekort is opgegeven of onbekend is. Elke matrixcel opent het spoor gevaar → restrisico → regel → bron. Compatibiliteitsmeldingen dekken combinaties zoals een bril met de afdichting van een masker. Export: CSV-matrix met regel-ID's, JSON-casusbestand, PDF-verslag. Import van restgevaren uit het uitwisselingsbestand van de JSA/TRA-builder.",
  "fr": "Un parcours par étapes : tâches et leur environnement, dangers avec type, voie d’exposition, gravité et exposition, puis l’état de la hiérarchie des mesures pour chaque danger. Un jeu de règles versionné associe chaque danger résiduel à une classe générique d’EPI (yeux/visage, ouïe, voies respiratoires, tête, main, pied, corps, chute) et à une famille de normes, jamais à un produit. Un contexte manquant donne « données insuffisantes » au lieu d’une classe ; les appareils filtrants sont rejetés si un manque d’oxygène est déclaré ou inconnu. Chaque cellule de la matrice ouvre sa trace danger → risque résiduel → règle → source. Des signalements de compatibilité couvrent des combinaisons comme lunettes et étanchéité d’un masque. Exports : matrice CSV avec identifiants de règles, fichier de cas JSON, rapport PDF. Import des dangers résiduels depuis le fichier d’échange du générateur JSA/TRA.",
  "es": "Un flujo por pasos: tareas con su entorno, peligros con tipo, vía de exposición, gravedad y exposición, y después el estado de la jerarquía de controles de cada peligro. Un conjunto de reglas versionado asigna a cada peligro residual una clase genérica de EPI (ojos/cara, oído, respiratoria, cabeza, mano, pie, cuerpo, caídas) y una familia de normas, nunca un producto. Si falta contexto el resultado es «datos insuficientes» en lugar de una clase; los equipos filtrantes se rechazan cuando la falta de oxígeno está declarada o es desconocida. Cada celda de la matriz abre su traza peligro → riesgo residual → regla → fuente. Los avisos de compatibilidad cubren combinaciones como gafas y el ajuste de una máscara. Exportación: matriz CSV con ID de reglas, archivo JSON del caso, informe PDF. Importa peligros residuales desde el archivo de intercambio del generador JSA/TRA.",
  "pl": "Proces krokowy: zadania z otoczeniem, zagrożenia z rodzajem, drogą narażenia, ciężkością i ekspozycją, a następnie stan hierarchii środków dla każdego zagrożenia. Wersjonowany zestaw reguł przypisuje każdemu zagrożeniu resztkowemu ogólną klasę ŚOI (oczy/twarz, słuch, drogi oddechowe, głowa, ręce, stopy, ciało, upadek) i rodzinę norm, nigdy konkretny wyrób. Brak kontekstu daje „dane niewystarczające” zamiast klasy; sprzęt filtrujący jest odrzucany, gdy niedobór tlenu jest zgłoszony lub nieznany. Każda komórka macierzy otwiera ślad zagrożenie → ryzyko resztkowe → reguła → źródło. Flagi zgodności obejmują połączenia takie jak okulary i szczelność maski. Eksport: macierz CSV z ID reguł, plik JSON przypadku, raport PDF. Import zagrożeń resztkowych z pliku wymiany kreatora JSA/TRA."
 },

 "limitations": {
  "en": "Generic PPE classes and standard families only; no product, size or certificate is checked. Standard editions are not pinned and must be confirmed. No fit testing, no glove breakthrough data, no arc-flash or fall-clearance calculation. The particle filter class comes only from a user-entered concentration and exposure limit against an editable assigned-protection-factor table (HSE HSG53 defaults, Great Britain); gas filter types come from a short built-in substance list or a user-set substance group. Noise action values are an editable EU rule pack. A PPE class never makes a risk acceptable, and the tool issues no permission to work.",
  "uk": "Лише загальні класи ЗІЗ і родини стандартів; вироби, розміри та сертифікати не перевіряються. Редакції стандартів не зафіксовані й потребують підтвердження. Без перевірки прилягання, даних про проникнення крізь рукавички, розрахунку дугового спалаху чи вільного простору під час падіння. Клас протиаерозольного фільтра визначається лише за введеними концентрацією та граничним значенням за редагованою таблицею призначених коефіцієнтів (типово HSE HSG53, Велика Британія); тип протигазового фільтра — за коротким вбудованим переліком речовин або заданою групою. Рівні дії для шуму — редагований пакет правил ЄС. Клас ЗІЗ ніколи не робить ризик прийнятним, а інструмент не видає дозволу на роботу.",
  "de": "Nur generische PSA-Klassen und Normenfamilien; Produkt, Größe und Zertifikat werden nicht geprüft. Normausgaben sind nicht festgelegt und müssen bestätigt werden. Kein Dichtsitztest, keine Durchbruchdaten für Handschuhe, keine Störlichtbogen- oder Freiraumberechnung. Die Partikelfilterklasse ergibt sich nur aus eingegebener Konzentration und Grenzwert gegen eine editierbare Tabelle zugewiesener Schutzfaktoren (Vorgabe HSE HSG53, Großbritannien); Gasfiltertypen aus einer kurzen eingebauten Stoffliste oder einer gesetzten Stoffgruppe. Die Lärm-Auslösewerte sind ein editierbares EU-Regelpaket. Eine PSA-Klasse macht kein Risiko akzeptabel, und das Werkzeug erteilt keine Arbeitsfreigabe.",
  "nl": "Alleen generieke PBM-klassen en normfamilies; product, maat en certificaat worden niet gecontroleerd. Normedities zijn niet vastgelegd en moeten worden bevestigd. Geen fittest, geen doorbraakgegevens voor handschoenen, geen berekening van vlamboog of valruimte. De deeltjesfilterklasse volgt alleen uit een ingevoerde concentratie en grenswaarde tegen een bewerkbare tabel van toegekende beschermingsfactoren (standaard HSE HSG53, Groot-Brittannië); gasfiltertypen uit een korte ingebouwde stoffenlijst of een ingestelde stofgroep. De actiewaarden voor geluid zijn een bewerkbaar EU-regelpakket. Een PBM-klasse maakt een risico nooit aanvaardbaar, en de tool geeft geen werkvergunning.",
  "fr": "Uniquement des classes génériques d’EPI et des familles de normes ; aucun produit, taille ou certificat n’est vérifié. Les éditions des normes ne sont pas figées et doivent être confirmées. Pas d’essai d’ajustement, pas de données de perméation des gants, pas de calcul d’arc électrique ni de tirant d’air. La classe de filtre anti-particules ne découle que d’une concentration et d’une valeur limite saisies, comparées à une table modifiable de facteurs de protection attribués (HSE HSG53 par défaut, Grande-Bretagne) ; les types de filtre anti-gaz viennent d’une courte liste intégrée ou d’un groupe saisi. Les valeurs d’action bruit forment un jeu de règles UE modifiable. Une classe d’EPI ne rend jamais un risque acceptable et l’outil ne délivre aucune autorisation de travail.",
  "es": "Solo clases genéricas de EPI y familias de normas; no se comprueba producto, talla ni certificado. Las ediciones de las normas no están fijadas y deben confirmarse. Sin prueba de ajuste, sin datos de permeación de guantes, sin cálculo de arco eléctrico ni de altura libre de caída. La clase de filtro de partículas solo sale de una concentración y un límite introducidos frente a una tabla editable de factores de protección asignados (por defecto HSE HSG53, Gran Bretaña); los tipos de filtro de gas, de una breve lista integrada o de un grupo indicado. Los valores de acción de ruido son un paquete de reglas UE editable. Una clase de EPI nunca hace aceptable un riesgo y la herramienta no concede permiso de trabajo.",
  "pl": "Tylko ogólne klasy ŚOI i rodziny norm; wyrób, rozmiar i certyfikat nie są sprawdzane. Wydania norm nie są ustalone i wymagają potwierdzenia. Brak testu dopasowania, danych o przebiciu rękawic, obliczeń łuku elektrycznego i przestrzeni swobodnego spadania. Klasa filtra przeciwpyłowego wynika tylko z wprowadzonego stężenia i wartości granicznej wobec edytowalnej tabeli przypisanych współczynników ochrony (domyślnie HSE HSG53, Wielka Brytania); typy pochłaniaczy z krótkiej wbudowanej listy substancji lub wskazanej grupy. Wartości progów działania dla hałasu to edytowalny pakiet reguł UE. Klasa ŚOI nigdy nie czyni ryzyka akceptowalnym, a narzędzie nie wydaje zezwolenia na pracę."
 },

<style>
.pp-list{display:flex;flex-direction:column;gap:var(--sp-3,12px);min-width:0}

.pp-mx{border-collapse:collapse;width:100%;min-width:560px;font-size:var(--fs-label,13px)}
.pp-mx th,.pp-mx td{border:1px solid var(--line,#e2e7ee);padding:4px;text-align:center;vertical-align:middle}
.pp-mx th[scope=row]{text-align:left;font-weight:500;min-width:120px;max-width:170px;overflow-wrap:break-word;hyphens:auto}
.pp-mx thead th{font:600 11px/1.2 var(--font,sans-serif);color:var(--muted,#5b6675)}
.pp-mx thead svg{display:block;margin:0 auto 2px;width:26px;height:26px}
.pp-cell{width:100%;min-height:40px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink);font:600 13px/1.2 var(--font,sans-serif);cursor:pointer;padding:4px 2px}
.pp-cell small{display:block;font-weight:400;font-size:10.5px;color:var(--muted,#5b6675)}
.pp-cell.req{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pp-cell.rev{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.pp-cell.none{color:var(--muted,#5b6675)}
.pp-tr{display:flex;flex-direction:column;gap:10px}
.pp-tr ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.pp-tr li{line-height:1.45}
.pp-tr .pp-arrow{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:var(--fs-label,13px)}
.pp-tr .pp-arrow b{color:var(--muted,#5b6675);font-weight:600}
.pp-flag{margin:0;padding-left:18px;font-size:var(--fs-label,13px);line-height:1.45}
.pp-flag li{margin:2px 0}
.pp-sec{margin:6px 0 2px;font:650 var(--fs-micro,11px)/1.3 var(--font,sans-serif);text-transform:uppercase;letter-spacing:.06em;color:var(--muted,#5b6675)}
.pp-art{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0}
.pp-art img{display:block;height:auto}
.pp-art .pp-sign{width:44px}
.pp-art .pp-cardimg{width:96px;border-radius:8px}
.pp-art .pp-alt{font-size:11px;color:var(--muted,#5b6675);border:1px dashed var(--line,#e2e7ee);border-radius:6px;padding:4px 6px;max-width:140px}
.pp-cell .pp-csign{display:block;margin:0 auto 2px;width:22px;height:22px}
.pp-cell .pp-alt{display:block;max-width:60px;font-size:9px;padding:1px}
.pp-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--fs-small,12px);color:var(--muted,#5b6675);margin-top:6px}
input.dgu-fctl,select.dgu-fctl,textarea.dgu-fctl{font:inherit;min-height:var(--ctl-h,36px);border:1px solid var(--line,#e2e7ee);border-radius:var(--radius-sm,8px);background:var(--panel,#fff);color:var(--ink,#12161d);padding:0 8px;box-sizing:border-box;width:100%}
</style>

      if (ty && HAZ[ty].routes.indexOf(ro) < 0) ro = HAZ[ty].routes.length === 1 ? HAZ[ty].routes[0] : '';
      h.route = ro;
      h.severity = severityFrom(it, doc);
      h.exposure = pickEnum(EXPO, synKey(it.exposure), 'unknown');
      var c = it.controls && typeof it.controls === 'object' && !Array.isArray(it.controls) ? it.controls : {};
      h.controls.elim = ctrlSyn(c.elimination != null ? c.elimination : c.elim);
      h.controls.subst = ctrlSyn(c.substitution != null ? c.substitution : c.subst);
      h.controls.eng = ctrlSyn(c.engineering != null ? c.engineering : c.eng);
      h.controls.admin = ctrlSyn(c.administrative != null ? c.administrative : c.admin);
      h.residual = residualFrom(it.residual);
      h.substance = cleanText(it.substance, 80);
      var why = it.control_reasons && typeof it.control_reasons === 'object' ? it.control_reasons : {};
      [['elim', 'elimination'], ['subst', 'substitution'], ['eng', 'engineering'], ['admin', 'administrative']].forEach(function (pr) {
        var v = why[pr[1]] != null ? why[pr[1]] : why[pr[0]];
        v = textOf(v);
        if (v && v.trim()) { h.reasons[pr[0]] = cleanText(v, 240); if (res.reasons.indexOf(hid) < 0) res.reasons.push(hid); }
      });
      h.source = cleanText(src + ':' + iid, 80);
      st.hazards.push(h);
      if (!h.type || !h.route) res.untyped.push(hid);
      res.applied.push({ id: iid, hazard: hid, task: task.id, typed: !!h.type, routed: !!h.route });
    });
    res.ok = true;
    return res;
  }

  function resultsData() {
    var l = L(), c = last.counts;
    var tone, text;
    if (!c.tasks || !c.hazards) { tone = 'warn'; text = t('vEmpty'); }
    else if (c.unresolved) { tone = 'warn'; text = fill(t('vOpen'), { n: c.unresolved }); }
    else if (c.flags || c.gaps) { tone = 'warn'; text = fill(t('vFlags'), { k: c.flags + c.gaps }); }
    else { tone = 'ok'; text = fill(t('vOk'), { h: c.hazards, t: c.tasks }); }
    var node = hosts.findings;
    if (node) while (node.firstChild) node.removeChild(node.firstChild);
    else node = h('div', {});
    function listSec(title, items) {
      node.appendChild(h('p', { class: 'pp-sec', text: title }));
      var ul = h('ul', { class: 'pp-flag' });
      if (!items.length) ul.appendChild(h('li', { text: t('none') }));
      items.forEach(function (s) { ul.appendChild(h('li', { text: s })); });
      node.appendChild(ul);
    }
    listSec(t('tUnres'), last.unresolved.map(function (id) { var r = last.byH[id]; return id + ' (' + (r.task || '—') + '): ' + outcomeText(r, l) + ' [' + r.rules[r.rules.length - 1] + ']'; }));
    listSec(t('tGaps'), last.gaps.map(function (g) { return g.hazard + ' (' + g.task + '): ' + g.rule + ' — ' + tx(RULES[g.rule].text, l); }));
    listSec(t('tFlags'), last.flags.map(function (f) { return f.task + ': ' + f.rule + ' — ' + tx(RULES[f.rule].text, l); }));
    return {
      verdict: { tone: tone, text: text },
      tiles: [
        { label: S.tReq, value: c.requirements, precision: 0, tone: c.requirements ? null : null },
        { label: S.tUnres, value: c.unresolved, precision: 0, tone: c.unresolved ? 'warn' : 'ok', hint: c.unresolved ? S.out_insufficient : S.none },
        { label: S.tFlags, value: c.flags, precision: 0, tone: c.flags ? 'warn' : null },

  function applyExchange(doc) {
    var l = L();
    var res = importExchange(doc, state);
    if (!res.ok) { importMsg = { tone: 'bad', text: t('err_' + res.error) }; drawStep(); return res; }
    var parts = [];
    if (!res.applied.length) parts.push(t('impNone'));
    parts.push(t('impApplied') + ': ' + res.applied.length + (res.applied.length ? ' (' + res.applied.map(function (a) { return a.hazard; }).join(', ') + ')' : ''));
    if (res.tasksAdded.length) parts.push(t('impTasks') + ': ' + res.tasksAdded.join(', '));
    if (res.inferred.length) parts.push(res.inferred.join(', ') + ' ' + t('impInferred'));
    if (res.untyped.length) parts.push(res.untyped.join(', ') + ' ' + t('impUntyped'));
    if (res.reasons.length) parts.push(res.reasons.length + ' ' + t('impReasons'));
    var incomplete = res.applied.filter(function (a) { var r = evaluate(state).byH[a.hazard]; return r && (r.outcome === 'insufficient' || r.outcome === 'gap'); });
    if (incomplete.length) parts.push(incomplete.length + ' ' + t('out_insufficient').toLowerCase() + ' / ' + t('stRev') + ': ' + t('impComplete'));
    parts.push(t('impIgnored') + ': ' + res.ignored.length + (res.ignored.length ? ' (' + res.ignored.map(function (x) { return x.id + ' — ' + tx(S['reason_' + x.reason], l); }).join('; ') + ')' : ''));

        }),

        unresolved_hazards: ev.hazards.filter(function (r) { return r.outcome === 'insufficient' || r.outcome === 'gap'; }).map(outcomeOf),

        compatibility_flags: ev.flags.map(function (f) { return { task: f.task, rule: f.rule, hazards: f.hazards.slice() }; }),

        rules_applied: ev.fired.slice()
      },

  function matrixSvg(tasks, cells) {
    var cw = 64, rh = 30, x0 = 56, y0 = 40, W = x0 + cw * CAT_IDS.length + 6, Hh = y0 + rh * tasks.length + 6;
    var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + Hh + '" width="' + W + '" height="' + Hh + '" font-family="Arial, sans-serif">';
    s += '<rect x="0" y="0" width="' + W + '" height="' + Hh + '" fill="#ffffff"/>';
    CAT_IDS.forEach(function (c, i) {
      s += '<g transform="translate(' + (x0 + i * cw + cw / 2 - 13) + ',6) scale(1.08)" fill="none" stroke="#344054" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + ICON[c] + '</g>';
    });
    tasks.forEach(function (tk, r) {
      var y = y0 + r * rh;
      s += '<text x="6" y="' + (y + 19) + '" font-size="12" fill="#12161d">' + String(tk.id).replace(/[<&>]/g, '') + '</text>';
      CAT_IDS.forEach(function (c, i) {
        var cell = cells(tk.id, c), x = x0 + i * cw;
        var fill = cell.status === 'required' ? '#e3f1e7' : (cell.status === 'review' ? '#f6ecdc' : '#ffffff');
        var ink = cell.status === 'required' ? '#1f6f34' : (cell.status === 'review' ? '#9a5a00' : '#8a94a3');
        var sym = cell.status === 'required' ? '● ' + cell.n : (cell.status === 'review' ? '? ' + cell.n : '–');
        s += '<rect x="' + (x + 2) + '" y="' + (y + 2) + '" width="' + (cw - 4) + '" height="' + (rh - 4) + '" rx="4" fill="' + fill + '" stroke="' + ink + '" stroke-width="1"/>';
        s += '<text x="' + (x + cw / 2) + '" y="' + (y + 19) + '" font-size="13" text-anchor="middle" fill="' + ink + '">' + sym + '</text>';
      });
    });
    return s + '</svg>';
  }

  /* A table whose header row is not repeated on a page break: the report
     engine repeats a declared head, and a repeated header line reads as a
     duplicated sentence on the printed sheet. */
  function escH(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function plainTable(title, head, rows, cols, notes) {
    var tid = 'pp' + Math.random().toString(36).slice(2, 8), st = ' style="grid-template-columns:' + escH(cols) + '"';
    var row = function (cells, cls) { return '<div class="r cN' + (cls ? ' ' + cls : '') + '" data-tbl="' + tid + '"' + st + '>' + cells.map(function (c) { return '<span>' + escH(c) + '</span>'; }).join('') + '</div>'; };
    var out = [{ title: title, html: row(head, 'rh') }];
    rows.forEach(function (r) { out.push({ html: row(r) }); });
    if (notes && notes.length) out.push({ notes: notes });
    return out;
  }
