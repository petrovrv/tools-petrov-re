  "summary": {
    "en": "Animated, deterministic simulation of a lift group: how long people really wait (mean, 95th percentile, share over 60 s) and what changes it — call buttons vs destination keypads, dispatch rules, zoning, parking, habits, one more car or faster doors — with an A/B comparison on the same passengers.",
    "uk": "Анімована детермінована симуляція групи ліфтів: скільки люди насправді чекають (середнє, 95-й процентиль, частка понад 60 с) і що це змінює — кнопки виклику чи панелі вибору поверху, правила диспетчеризації, зонування, паркування, звички, ще одна кабіна чи швидші двері — з порівнянням A/B на тих самих пасажирах.",
    "de": "Animierte, deterministische Simulation einer Aufzugsgruppe: wie lange Menschen wirklich warten (Mittelwert, 95. Perzentil, Anteil über 60 s) und was das ändert — Ruftaster oder Zielwahl, Steuerungslogik, Zonierung, Parken, Gewohnheiten, eine Kabine mehr oder schnellere Türen — mit A/B-Vergleich bei denselben Fahrgästen.",
    "nl": "Geanimeerde, deterministische simulatie van een liftgroep: hoe lang mensen echt wachten (gemiddelde, 95e percentiel, aandeel boven 60 s) en wat dat verandert — oproepknoppen of bestemmingskeuze, besturingsregels, zonering, parkeren, gewoonten, een kooi meer of snellere deuren — met een A/B-vergelijking op dezelfde passagiers.",
    "fr": "Simulation animée et déterministe d’un groupe d’ascenseurs : combien de temps les gens attendent vraiment (moyenne, 95e centile, part au-delà de 60 s) et ce qui le change — boutons d’appel ou claviers de destination, règles de manœuvre, zonage, stationnement, habitudes, une cabine de plus ou des portes plus rapides — avec une comparaison A/B sur les mêmes passagers.",
    "es": "Simulación animada y determinista de un grupo de ascensores: cuánto espera realmente la gente (media, percentil 95, cuota por encima de 60 s) y qué lo cambia — botones de llamada o teclados de destino, reglas de maniobra, zonificación, aparcamiento, hábitos, una cabina más o puertas más rápidas — con comparación A/B sobre los mismos pasajeros.",

  "description": {
    "en": "Choose a building and a traffic pattern, set two variants A and B of the lift group (call system, dispatch rule, number of cars, speed, door times, parking, a car out of service, people pressing both buttons) and watch both run side by side with the same passengers. Cars move with their real acceleration and door times, people queue at the floors coloured by how long they have waited. The results give the mean and 95th-percentile wait, the share waiting over 30 and 60 s, time to destination and car work for both variants and the difference; quick what-if buttons rank single changes. Exports: passenger CSV, metrics CSV and the shared building scenario JSON used by the round-trip and energy tools.",
    "uk": "Оберіть будівлю й характер руху, задайте два варіанти групи ліфтів A і B (система виклику, правило диспетчеризації, кількість кабін, швидкість, час дверей, паркування, кабіна поза роботою, люди, що тиснуть обидві кнопки) і дивіться, як обидва працюють поруч з тими самими пасажирами. Кабіни рухаються з реальним прискоренням і часом дверей, люди стоять у черзі на поверхах, забарвлені за тривалістю очікування. Результати дають середнє й 95-й процентиль очікування, частку тих, хто чекає понад 30 і 60 с, час до місця призначення та роботу кабін для обох варіантів і різницю; кнопки «а що, як» ранжують окремі зміни. Експорт: CSV пасажирів, CSV показників і спільний JSON сценарію будівлі для інструментів часу обороту та енергії.",
    "de": "Wählen Sie ein Gebäude und ein Verkehrsmuster, legen Sie zwei Varianten A und B der Aufzugsgruppe fest (Rufsystem, Steuerungslogik, Anzahl Kabinen, Geschwindigkeit, Türzeiten, Parken, eine Kabine außer Betrieb, Leute, die beide Taster drücken) und sehen Sie beide nebeneinander mit denselben Fahrgästen laufen. Kabinen fahren mit ihrer realen Beschleunigung und Türzeit, Menschen warten auf den Etagen, eingefärbt nach Wartedauer. Die Ergebnisse zeigen mittlere und 95-Perzentil-Wartezeit, den Anteil über 30 und 60 s, Zeit bis zum Ziel und Kabinenarbeit beider Varianten und die Differenz; Was-wäre-wenn-Knöpfe ordnen einzelne Änderungen. Export: Fahrgast-CSV, Kennzahlen-CSV und das gemeinsame Gebäudeszenario-JSON der Umlaufzeit- und Energiewerkzeuge.",
    "nl": "Kies een gebouw en een verkeerspatroon, stel twee varianten A en B van de liftgroep in (oproepsysteem, besturingsregel, aantal kooien, snelheid, deurtijden, parkeren, een kooi buiten dienst, mensen die beide knoppen indrukken) en zie beide naast elkaar draaien met dezelfde passagiers. Kooien bewegen met hun echte versnelling en deurtijden, mensen wachten op de verdiepingen, gekleurd naar wachtduur. De resultaten geven de gemiddelde en 95e-percentiel-wachttijd, het aandeel boven 30 en 60 s, de tijd tot de bestemming en het kooiwerk voor beide varianten en het verschil; wat-als-knoppen rangschikken losse wijzigingen. Export: passagiers-CSV, kengetallen-CSV en de gedeelde gebouwscenario-JSON van de omlooptijd- en energietools.",
    "fr": "Choisissez un bâtiment et un profil de trafic, réglez deux variantes A et B du groupe (système d’appel, règle de manœuvre, nombre de cabines, vitesse, temps de porte, stationnement, une cabine hors service, des gens qui appuient sur les deux boutons) et regardez-les tourner côte à côte avec les mêmes passagers. Les cabines se déplacent avec leur accélération et leurs temps de porte réels, les gens attendent aux paliers, colorés selon leur attente. Les résultats donnent l’attente moyenne et au 95e centile, la part au-delà de 30 et 60 s, le temps jusqu’à destination et le travail des cabines pour les deux variantes et l’écart ; des boutons « et si » classent des changements isolés. Exports : CSV des passagers, CSV des indicateurs et le JSON de scénario de bâtiment partagé avec les outils de temps d’aller-retour et d’énergie.",
    "es": "Elija un edificio y un patrón de tráfico, defina dos variantes A y B del grupo (sistema de llamada, regla de maniobra, número de cabinas, velocidad, tiempos de puerta, aparcamiento, una cabina fuera de servicio, gente que pulsa los dos botones) y véalas funcionar lado a lado con los mismos pasajeros. Las cabinas se mueven con su aceleración y tiempos de puerta reales, la gente espera en las plantas coloreada según su espera. Los resultados dan la espera media y el percentil 95, la cuota por encima de 30 y 60 s, el tiempo hasta destino y el trabajo de las cabinas de ambas variantes y la diferencia; botones «¿y si…?» ordenan cambios aislados. Exportación: CSV de pasajeros, CSV de indicadores y el JSON de escenario del edificio compartido con las herramientas de tiempo de ida y vuelta y de energía.",
    "pl": "Wybierz budynek i rodzaj ruchu, ustaw dwa warianty A i B grupy dźwigów (system wezwań, reguła sterowania, liczba kabin, prędkość, czasy drzwi, parkowanie, kabina wyłączona z ruchu, ludzie wciskający oba przyciski) i zobacz, jak oba pracują obok siebie z tymi samymi pasażerami. Kabiny jadą z rzeczywistym przyspieszeniem i czasami drzwi, ludzie czekają na piętrach, pokolorowani według czasu oczekiwania. Wyniki podają średni czas oczekiwania i 95. percentyl, udział czekających ponad 30 i 60 s, czas dojazdu do celu i pracę kabin dla obu wariantów oraz różnicę; przyciski „co jeśli” szeregują pojedyncze zmiany. Eksport: CSV pasażerów, CSV wskaźników i wspólny JSON scenariusza budynku dla narzędzi czasu obiegu i energii."

  "limitations": {
    "en": "A teaching and planning simulation, not a lift design. Dispatch rules are the textbook strategies (directional collective, nearest car, estimated time of arrival, destination assignment); manufacturers' group controls are proprietary and usually better tuned. Passengers arrive as a seeded Poisson stream from the traffic template; behaviour is simplified (no balking, no stairs, groups board together only by chance). Car kinematics follow rated speed, acceleration and jerk; door and transfer times are inputs. Results of one seed are one realisation: compare variants on the same passengers, and repeat with other seeds before drawing a conclusion. Final design per EN 81-20 / ISO 8100-32 by a qualified lift consultant.",
    "uk": "Навчальна та планувальна симуляція, а не проєкт ліфтів. Правила диспетчеризації — підручникові стратегії (спрямоване збирання, найближча кабіна, оцінений час прибуття, призначення за місцем призначення); групові системи керування виробників закриті й зазвичай краще налаштовані. Пасажири надходять пуассонівським потоком з фіксованим зерном за шаблоном руху; поведінку спрощено (ніхто не відмовляється чекати, сходів немає, групи заходять разом лише випадково). Кінематика кабін враховує номінальну швидкість, прискорення й ривок; час дверей і входу-виходу — вхідні дані. Результат одного зерна — одна реалізація: порівнюйте варіанти на тих самих пасажирах і повторюйте з іншими зернами, перш ніж робити висновок. Остаточний проєкт — за EN 81-20 / ISO 8100-32 кваліфікованим консультантом з ліфтів.",
    "de": "Eine Lehr- und Planungssimulation, keine Aufzugsauslegung. Die Steuerungen sind Lehrbuchstrategien (Richtungs-Sammelsteuerung, nächste Kabine, geschätzte Ankunftszeit, Zielzuweisung); die Gruppensteuerungen der Hersteller sind proprietär und meist besser abgestimmt. Fahrgäste kommen als Poisson-Strom mit festem Startwert aus der Verkehrsvorlage; das Verhalten ist vereinfacht (niemand gibt auf, keine Treppe, Gruppen steigen nur zufällig gemeinsam ein). Die Kabinenkinematik folgt Nenngeschwindigkeit, Beschleunigung und Ruck; Tür- und Ein-/Ausstiegszeiten sind Eingaben. Ein Startwert ist eine Realisierung: Varianten mit denselben Fahrgästen vergleichen und mit anderen Startwerten wiederholen, bevor man schließt. Endgültige Auslegung nach EN 81-20 / ISO 8100-32 durch einen qualifizierten Aufzugsplaner.",
    "nl": "Een leer- en planningssimulatie, geen liftontwerp. De besturingen zijn leerboekstrategieën (richtingsgebonden verzamelbesturing, dichtstbijzijnde kooi, geschatte aankomsttijd, bestemmingstoewijzing); de groepsbesturingen van fabrikanten zijn eigendom van de fabrikant en meestal beter afgesteld. Passagiers komen als Poisson-stroom met vaste startwaarde uit het verkeerssjabloon; gedrag is vereenvoudigd (niemand haakt af, geen trap, groepen stappen alleen toevallig samen in). De kooikinematica volgt nominale snelheid, versnelling en schok; deur- en overstaptijden zijn invoer. Eén startwaarde is één realisatie: vergelijk varianten op dezelfde passagiers en herhaal met andere startwaarden voor u concludeert. Definitief ontwerp volgens EN 81-20 / ISO 8100-32 door een gekwalificeerd liftadviseur.",
    "fr": "Une simulation pédagogique et de pré-étude, pas une conception d’ascenseurs. Les manœuvres sont les stratégies des manuels (collective sélective, cabine la plus proche, temps d’arrivée estimé, affectation par destination) ; les manœuvres de groupe des constructeurs sont propriétaires et généralement mieux réglées. Les passagers arrivent selon un flux de Poisson à graine fixe issu du modèle de trafic ; le comportement est simplifié (personne ne renonce, pas d’escalier, les groupes ne montent ensemble que par hasard). La cinématique suit vitesse nominale, accélération et à-coup ; temps de porte et de transfert sont des entrées. Une graine est une réalisation : comparez les variantes sur les mêmes passagers et répétez avec d’autres graines avant de conclure. Conception finale selon EN 81-20 / ISO 8100-32 par un ascensoriste qualifié.",
    "es": "Una simulación didáctica y de planificación, no un diseño de ascensores. Las maniobras son estrategias de manual (colectiva selectiva, cabina más cercana, tiempo estimado de llegada, asignación por destino); los controles de grupo de los fabricantes son propietarios y suelen estar mejor ajustados. Los pasajeros llegan como un flujo de Poisson con semilla fija según la plantilla de tráfico; el comportamiento está simplificado (nadie desiste, sin escaleras, los grupos suben juntos solo por azar). La cinemática sigue velocidad nominal, aceleración y sobreaceleración; los tiempos de puerta y de transferencia son datos de entrada. Una semilla es una realización: compare variantes sobre los mismos pasajeros y repita con otras semillas antes de concluir. Diseño final según EN 81-20 / ISO 8100-32 por un consultor de ascensores cualificado.",
    "pl": "Symulacja dydaktyczna i planistyczna, nie projekt dźwigów. Reguły sterowania to podręcznikowe strategie (zbiorcze kierunkowe, najbliższa kabina, szacowany czas przyjazdu, przydział według celu); sterowania grupowe producentów są zastrzeżone i zwykle lepiej dostrojone. Pasażerowie przychodzą jako strumień Poissona ze stałym ziarnem według szablonu ruchu; zachowanie jest uproszczone (nikt nie rezygnuje, brak schodów, grupy wsiadają razem tylko przypadkiem). Kinematyka kabin uwzględnia prędkość znamionową, przyspieszenie i zryw; czasy drzwi i wymiany pasażerów są danymi wejściowymi. Jedno ziarno to jedna realizacja: porównuj warianty na tych samych pasażerach i powtarzaj z innymi ziarnami, zanim wyciągniesz wniosek. Ostateczny projekt według EN 81-20 / ISO 8100-32 wykonuje wykwalifikowany konsultant dźwigowy."
  },

      "en": "Discrete-time simulation of a lift group (fixed step 0.1 s, seeded passenger stream shared by A and B) with the traffic patterns and up-peak relations of CIBSE Guide D (2020) and Barney, Elevator Traffic Handbook (2nd ed., 2016); dispatch rules after the published group-control concepts (Barney; Siikonen; Strakosch, The Vertical Transportation Handbook).",
      "uk": "Дискретна в часі симуляція групи ліфтів (фіксований крок 0,1 с, потік пасажирів з фіксованим зерном, спільний для A і B) з характерами руху й співвідношеннями ранкового піку за CIBSE Guide D (2020) і Barney, Elevator Traffic Handbook (2-ге вид., 2016); правила диспетчеризації — за опублікованими концепціями групового керування (Barney; Siikonen; Strakosch, The Vertical Transportation Handbook).",

    "benchmarks": [
      {
        "id": "liftwait-method-2026-11-06",
        "reference": {
          "en": "30 cases: 12 single-passenger cases (four lift types from a 1 m/s residential lift to a 6 m/s tower car: wait = start delay + jerk-limited run time, ride = door cycle + run) and 6 batch cases of one car carrying a crowd from the main floor in several trips (84 passengers in total, every wait and ride in closed form), run on the page's own engine; plus 3 saturated morning up-peaks imported through the page, whose achieved 5-minute handling capacity is compared with the classical round-trip-time formula. Expected values from an independent Python implementation of the published method. Run 2 adds 2 unsaturated morning up-peaks (median mean wait of seeds 1–3 against the CIBSE/Barney estimate) and 7 multi-car cases (2–3 cars: nearest car, collective, destination control, all cars full) compared passenger by passenger with an independent Python event simulation.",
          "uk": "30 випадок: 12 випадків з одним пасажиром (чотири типи ліфтів, від житлового 1 м/с до баштової кабіни 6 м/с: очікування = затримка пуску + час руху з обмеженим ривком, поїздка = цикл дверей + рух) і 6 пакетних випадків, де одна кабіна кількома рейсами вивозить натовп з основного поверху (разом 84 пасажирів, кожне очікування й поїздка в замкненому вигляді), на власному рушії сторінки; плюс 3 насичені ранкові піки, імпортовані через сторінку, чия досягнута 5-хвилинна провізна здатність порівнюється з класичною формулою часу обороту. Очікувані значення — з незалежної реалізації опублікованого методу на Python. Другий прогін додає 2 ненасичені ранкові піки (медіана середнього очікування для зерен 1–3 проти оцінки CIBSE/Barney) і 7 випадків з кількома кабінами (2–3 кабіни: найближча кабіна, збірне керування, вибір поверху, усі кабіни повні), порівняних пасажир за пасажиром з незалежною подієвою симуляцією на Python.",
          "de": "30 Fälle: 12 Einzelfahrgast-Fälle (vier Aufzugstypen vom 1-m/s-Wohnhausaufzug bis zur 6-m/s-Turmkabine: Warten = Anlaufverzögerung + ruckbegrenzte Fahrzeit, Fahrt = Türzyklus + Fahrt) und 6 Stapelfälle, in denen eine Kabine eine Menge in mehreren Fahrten von der Hauptetage befördert (zusammen 84 Fahrgäste, jede Warte- und Fahrzeit in geschlossener Form), mit der Engine der Seite gerechnet; dazu 3 gesättigte Morgenspitzen, über die Seite importiert, deren erreichte 5-Minuten-Förderleistung mit der klassischen Umlaufzeitformel verglichen wird. Sollwerte aus einer unabhängigen Python-Umsetzung der veröffentlichten Methode. Lauf 2 ergänzt 2 ungesättigte Morgenspitzen (Median der mittleren Wartezeit über Startwerte 1–3 gegen die CIBSE/Barney-Schätzung) und 7 Mehrkabinenfälle (2–3 Kabinen: nächste Kabine, Sammelsteuerung, Zielwahl, alle Kabinen voll), Fahrgast für Fahrgast mit einer unabhängigen Python-Ereignissimulation verglichen.",
          "nl": "30 gevallen: 12 gevallen met één passagier (vier liftsoorten, van een woonlift van 1 m/s tot een torenkooi van 6 m/s: wachten = startvertraging + schokbegrensde rijtijd, rit = deurcyclus + rit) en 6 batchgevallen waarin één kooi een menigte in meerdere ritten vanaf de hoofdverdieping vervoert (samen 84 passagiers, elke wacht- en rittijd in gesloten vorm), gerekend met de engine van de pagina; plus 3 verzadigde ochtendpieken, via de pagina geïmporteerd, waarvan de bereikte 5-minutencapaciteit wordt vergeleken met de klassieke omlooptijdformule. Verwachte waarden uit een onafhankelijke Python-implementatie van de gepubliceerde methode. Run 2 voegt 2 onverzadigde ochtendpieken toe (mediaan van de gemiddelde wachttijd over startwaarden 1–3 tegen de CIBSE/Barney-schatting) en 7 gevallen met meerdere kooien (2–3 kooien: dichtstbijzijnde kooi, collectieve besturing, bestemmingskeuze, alle kooien vol), per passagier vergeleken met een onafhankelijke Python-gebeurtenissimulatie.",
          "fr": "30 cas : 12 cas à un passager (quatre types d’ascenseurs, d’un ascenseur résidentiel à 1 m/s à une cabine de tour à 6 m/s : attente = retard au démarrage + temps de course à à-coup limité, trajet = cycle de portes + course) et 6 cas groupés où une cabine évacue une foule du niveau principal en plusieurs voyages (84 passagers au total, chaque attente et trajet en forme fermée), calculés par le moteur de la page ; plus 3 pointes montantes saturées importées par la page, dont la capacité de transport atteinte sur 5 minutes est comparée à la formule classique du temps d’aller-retour. Valeurs attendues issues d’une implémentation Python indépendante de la méthode publiée. La deuxième série ajoute 2 pointes montantes non saturées (médiane de l’attente moyenne sur les graines 1 à 3 contre l’estimation CIBSE/Barney) et 7 cas à plusieurs cabines (2 à 3 cabines : cabine la plus proche, collective, sélection de destination, toutes les cabines pleines), comparés passager par passager avec une simulation à événements indépendante en Python.",
          "es": "30 casos: 12 casos de un solo pasajero (cuatro tipos de ascensor, de uno residencial de 1 m/s a una cabina de torre de 6 m/s: espera = retardo de arranque + tiempo de recorrido con sobreaceleración limitada, viaje = ciclo de puertas + recorrido) y 6 casos por lotes en los que una cabina saca una multitud de la planta principal en varios viajes (84 pasajeros en total, cada espera y viaje en forma cerrada), calculados con el motor de la página; más 3 puntas de subida saturadas importadas por la página, cuya capacidad de transporte alcanzada en 5 minutos se compara con la fórmula clásica del tiempo de ida y vuelta. Valores esperados de una implementación independiente en Python del método publicado. La segunda serie añade 2 puntas de subida no saturadas (mediana de la espera media en las semillas 1–3 frente a la estimación de CIBSE/Barney) y 7 casos de varias cabinas (2–3 cabinas: cabina más cercana, colectiva, control de destino, todas las cabinas llenas), comparados pasajero a pasajero con una simulación de eventos independiente en Python.",
          "pl": "30 przypadków: 12 przypadków z jednym pasażerem (cztery typy dźwigów, od mieszkalnego 1 m/s po kabinę wieżowca 6 m/s: oczekiwanie = opóźnienie rozruchu + czas jazdy z ograniczonym zrywem, jazda = cykl drzwi + przejazd) i 6 przypadków wsadowych, w których jedna kabina w kilku kursach wywozi tłum z piętra głównego (razem 84 pasażerów, każde oczekiwanie i jazda w postaci zamkniętej), liczonych silnikiem strony; plus 3 nasycone szczyty poranne zaimportowane przez stronę, których osiągnięta 5-minutowa zdolność przewozowa jest porównywana z klasycznym wzorem czasu obiegu. Wartości oczekiwane z niezależnej implementacji opublikowanej metody w Pythonie. Druga seria dodaje 2 nienasycone szczyty poranne (mediana średniego oczekiwania dla ziaren 1–3 wobec oszacowania CIBSE/Barney) i 7 przypadków z kilkoma kabinami (2–3 kabiny: najbliższa kabina, zbiorcze, wybór celu, wszystkie kabiny pełne), porównanych pasażer po pasażerze z niezależną symulacją zdarzeniową w Pythonie."

  footer: T7('Waiting time = from arrival at the landing (the call is registered on arrival) until the doors of the car the passenger boards begin to open. Time to destination = waiting + ride. Mean, 50th/90th/95th percentile and the share over 30 s and 60 s are taken over all passengers served in the run. Passengers: Poisson arrivals per second from the traffic template, the same list for A and B (seeded). Cars: rated speed, acceleration and jerk, door opening/closing, dwell and 1.2 s per person in or out; a car counts as full at 80 % of its rated persons (EN 81-20: persons = rated load / 75 kg). Dispatch rules are textbook strategies; manufacturers’ group controls are proprietary. Planning aid; final lift design per EN 81-20 / ISO 8100-32 by a qualified lift consultant.',

  'n.single': T7('A single hall button lets people board a car going the wrong way: they wait less but reach their floor later. Judge variants by time to destination.', 'Одна кнопка виклику дає людям сідати в кабіну, що їде не туди: вони чекають менше, але дістаються поверху пізніше. Оцінюйте варіанти за часом до мети.', 'Mit nur einer Ruftaste steigen Menschen auch in Kabinen in die falsche Richtung: sie warten kürzer, sind aber später am Ziel. Varianten nach der Zeit bis zum Ziel beurteilen.', 'Met één oproepknop stappen mensen ook in een kooi die de verkeerde kant op gaat: ze wachten korter maar zijn later op hun verdieping. Beoordeel varianten op tijd tot bestemming.', 'Avec un seul bouton d’appel, on monte aussi dans une cabine qui part dans le mauvais sens : on attend moins mais on arrive plus tard. Jugez les variantes au temps jusqu’à destination.', 'Con un solo pulsador de llamada la gente sube también a cabinas que van en sentido contrario: espera menos pero llega más tarde. Juzgue las variantes por el tiempo hasta destino.', 'Przy jednym przycisku wezwania ludzie wsiadają też do kabiny jadącej w złą stronę: czekają krócej, ale docierają później. Oceniaj warianty po czasie do celu.'),
  'n.own': T7('B has its own passenger list (same seed %s) because the building differs (canteen moved or zones merged).', 'B має власний список пасажирів (те саме зерно %s), бо будівля інша (їдальню перенесено або зони об’єднано).', 'B hat eine eigene Fahrgastliste (gleicher Startwert %s), weil sich das Gebäude unterscheidet (Kantine verlegt oder Zonen zusammengelegt).', 'B heeft een eigen passagierslijst (zelfde startwaarde %s) omdat het gebouw verschilt (kantine verplaatst of zones samengevoegd).', 'B a sa propre liste de passagers (même graine %s) car le bâtiment diffère (cantine déplacée ou zones fusionnées).', 'B tiene su propia lista de pasajeros (misma semilla %s) porque el edificio difiere (comedor trasladado o zonas unidas).', 'B ma własną listę pasażerów (to samo ziarno %s), bo budynek się różni (stołówka przeniesiona lub strefy połączone).'),
  'n.lower': T7('%v: the figures cover served passengers only, so they are lower bounds. Counting the %n still waiting up to the end of the run: mean wait ≥ %a s, 95 % ≥ %p s, > 60 s ≥ %g %.', '%v: показники лише для перевезених пасажирів, тож це нижні межі. Якщо врахувати %n тих, хто ще чекав, до кінця прогону: середнє ≥ %a с, 95 % ≥ %p с, > 60 с ≥ %g %.', '%v: die Werte gelten nur für beförderte Fahrgäste und sind daher Untergrenzen. Mit den %n noch Wartenden bis zum Ende des Laufs: Mittel ≥ %a s, 95 % ≥ %p s, > 60 s ≥ %g %.', '%v: de cijfers gelden alleen voor vervoerde passagiers en zijn dus ondergrenzen. Met de %n die nog wachtten tot het einde van de run: gemiddeld ≥ %a s, 95 % ≥ %p s, > 60 s ≥ %g %.', '%v : les valeurs ne portent que sur les passagers servis, ce sont donc des bornes basses. En comptant les %n encore en attente jusqu’à la fin du calcul : moyenne ≥ %a s, 95 % ≥ %p s, > 60 s ≥ %g %.', '%v: las cifras solo cubren a los pasajeros servidos, así que son cotas inferiores. Contando a los %n que aún esperaban hasta el final: media ≥ %a s, 95 % ≥ %p s, > 60 s ≥ %g %.', '%v: wartości dotyczą tylko obsłużonych pasażerów, więc są dolnymi granicami. Licząc %n wciąż czekających do końca przebiegu: średnio ≥ %a s, 95 % ≥ %p s, > 60 s ≥ %g %.'),
  'n.seedb': T7('Scoreboard: seed %s only (one random day). Results vary by seed — try 2 and 3; the what-if table uses the median of seeds 1–3.', 'Табло: лише зерно %s (один випадковий день). Результати залежать від зерна — спробуйте 2 і 3; таблиця «А що, як» бере медіану зерен 1–3.', 'Anzeige: nur Startwert %s (ein zufälliger Tag). Ergebnisse schwanken mit dem Startwert — 2 und 3 testen; die Was-wäre-wenn-Tabelle nutzt den Median der Startwerte 1–3.', 'Scorebord: alleen startwaarde %s (één willekeurige dag). Uitkomsten variëren per startwaarde — probeer 2 en 3; de wat-als-tabel gebruikt de mediaan van startwaarden 1–3.', 'Tableau : graine %s seulement (une journée aléatoire). Les résultats varient selon la graine — essayez 2 et 3 ; le tableau « et si » prend la médiane des graines 1–3.', 'Marcador: solo la semilla %s (un día aleatorio). Los resultados varían con la semilla — pruebe 2 y 3; la tabla «¿y si?» usa la mediana de las semillas 1–3.', 'Tablica: tylko ziarno %s (jeden losowy dzień). Wyniki zależą od ziarna — sprawdź 2 i 3; tabela „co jeśli” bierze medianę ziaren 1–3.'),
  'tab.wi': T7('What if… ranked by time to destination (variant A, same passengers, median of seeds 1–3)', 'А що, як… за часом до мети (варіант A, ті самі пасажири, медіана зерен 1–3)', 'Was wäre, wenn … nach Zeit bis zum Ziel (Variante A, dieselben Fahrgäste, Median der Startwerte 1–3)', 'Wat als… gerangschikt op tijd tot bestemming (variant A, dezelfde passagiers, mediaan van startwaarden 1–3)', 'Et si… classés par temps jusqu’à destination (variante A, mêmes passagers, médiane des graines 1–3)', '¿Y si…? ordenados por tiempo hasta destino (variante A, mismos pasajeros, mediana de semillas 1–3)', 'Co jeśli… według czasu do celu (wariant A, ci sami pasażerowie, mediana ziaren 1–3)'),
  'h.att': T7('To destination, s', 'До мети, с', 'Bis Ziel, s', 'Tot bestemming, s', 'Jusqu’à destination, s', 'Hasta destino, s', 'Do celu, s'),
  'h.datt': T7('Δ to destination, s (range)', 'Δ до мети, с (розкид)', 'Δ bis Ziel, s (Spanne)', 'Δ tot bestemming, s (bereik)', 'Δ jusqu’à destination, s (écart)', 'Δ hasta destino, s (rango)', 'Δ do celu, s (rozrzut)'),
  'st.capped': T7('effective ×%x — the clock slows so that cars never skip a floor', 'фактично ×%x — годинник сповільнено, щоб кабіни не перескакували поверхи', 'effektiv ×%x — die Uhr läuft langsamer, damit Kabinen keine Etage überspringen', 'effectief ×%x — de klok vertraagt zodat kooien geen verdieping overslaan', 'effectif ×%x — l’horloge ralentit pour que les cabines ne sautent aucun étage', 'efectivo ×%x — el reloj se ralentiza para que las cabinas no salten plantas', 'faktycznie ×%x — zegar zwalnia, aby kabiny nie przeskakiwały pięter')
});

/* ---- presets: [label, aha note]; every claim is checked by _vt/wait/test.mjs with the stated seed ---- */
var PL = {
  updown_dcs: [T7("Morning peak: buttons vs destination keypads", "Ранковий пік: кнопки чи панелі вибору поверху", "Morgenspitze: Taster oder Zielwahl", "Ochtendpiek: knoppen of bestemmingskeuze", "Pointe du matin : boutons ou claviers de destination", "Punta matinal: botones o teclados de destino", "Szczyt poranny: przyciski czy panele wyboru celu"),
    T7("Same office, same 6 cars, same busy morning. With destination keypads, people going to the same floors share a car, so each round trip makes fewer stops: people reach their desks sooner (time to destination 12–27 % shorter over seeds 1–5) and the car stops fewer times.", "Той самий офіс, ті самі 6 кабін, той самий жвавий ранок. З панелями вибору поверху люди, що їдуть на ті самі поверхи, їдуть однією кабіною, тож за оборот менше зупинок: люди швидше дістаються робочих місць (час до мети на 12–27 % менший для зерен 1–5), а кабіни зупиняються рідше.", "Gleiches Büro, gleiche 6 Kabinen, derselbe volle Morgen. Mit Zielwahl fahren Leute mit gleichen Zielen in derselben Kabine, jede Rundfahrt hat weniger Halte: man ist früher am Platz (Zeit bis zum Ziel 12–27 % kürzer bei Startwerten 1–5), und die Kabinen halten seltener.", "Hetzelfde kantoor, dezelfde 6 kooien, dezelfde drukke ochtend. Met bestemmingskeuze delen mensen met dezelfde verdiepingen een kooi, dus elke rondrit heeft minder stops: mensen zijn eerder op hun plek (tijd tot bestemming 12–27 % korter bij startwaarden 1–5) en de kooien stoppen minder vaak.", "Même immeuble, mêmes 6 cabines, même matinée chargée. Avec les claviers de destination, ceux qui vont aux mêmes étages partagent une cabine : chaque aller-retour fait moins d’arrêts, on arrive plus tôt à son poste (temps jusqu’à destination plus court de 12 à 27 % pour les graines 1 à 5) et les cabines s’arrêtent moins souvent.", "Misma oficina, mismas 6 cabinas, misma mañana concurrida. Con teclados de destino, quienes van a las mismas plantas comparten cabina, cada viaje redondo hace menos paradas: la gente llega antes a su puesto (tiempo hasta destino un 12–27 % menor con las semillas 1–5) y las cabinas paran menos veces.", "To samo biuro, te same 6 kabin, ten sam ruchliwy poranek. Z panelami wyboru celu jadący na te same piętra dzielą kabinę, więc obieg ma mniej zatrzymań: ludzie szybciej docierają do biurek (czas do celu krótszy o 12–27 % dla ziaren 1–5), a kabiny stają rzadziej.")],
  canteen: [T7("Lunch: canteen on floor 1 vs top floor", "Обід: їдальня на 1-му поверсі чи нагорі", "Mittag: Kantine im 1. OG oder ganz oben", "Lunch: kantine op 1 of bovenin", "Midi : restaurant au 1er ou au dernier étage", "Comida: comedor en la planta 1 o arriba", "Obiad: stołówka na 1. piętrze czy na górze"),
    T7("Surprise: moving the canteen to the top floor hardly changes the mean wait here — over seeds 1–5 the difference even changes sign. Lunch rides get longer, but the effect on waiting stays inside the day-to-day scatter. A case for simulating several days instead of trusting intuition.", "Несподіванка: перенесення їдальні на верхній поверх тут майже не змінює середнього очікування — для зерен 1–5 різниця навіть змінює знак. Поїздки на обід довшають, але вплив на очікування лишається в межах розкиду між днями. Аргумент моделювати кілька днів, а не покладатися на інтуїцію.", "Überraschung: die Kantine ganz oben ändert die mittlere Wartezeit hier kaum — bei Startwerten 1–5 wechselt die Differenz sogar das Vorzeichen. Die Mittagsfahrten werden länger, aber die Wirkung auf das Warten bleibt in der Streuung von Tag zu Tag. Ein Grund, mehrere Tage zu simulieren statt der Intuition zu trauen.", "Verrassing: de kantine bovenin verandert de gemiddelde wachttijd hier nauwelijks — bij startwaarden 1–5 wisselt het verschil zelfs van teken. De lunchritten worden langer, maar het effect op het wachten blijft binnen de spreiding van dag tot dag. Een reden om meerdere dagen te simuleren in plaats van op intuïtie te vertrouwen.", "Surprise : monter le restaurant au dernier étage change à peine l’attente moyenne ici — sur les graines 1 à 5, l’écart change même de signe. Les trajets du midi s’allongent, mais l’effet sur l’attente reste dans la dispersion d’un jour à l’autre. Un argument pour simuler plusieurs jours plutôt que se fier à l’intuition.", "Sorpresa: subir el comedor a la última planta apenas cambia aquí la espera media; con las semillas 1–5 la diferencia incluso cambia de signo. Los viajes de la comida se alargan, pero el efecto sobre la espera queda dentro de la dispersión entre días. Un motivo para simular varios días en lugar de fiarse de la intuición.", "Niespodzianka: przeniesienie stołówki na najwyższe piętro prawie nie zmienia tu średniego oczekiwania — dla ziaren 1–5 różnica nawet zmienia znak. Przejazdy na obiad się wydłużają, ale wpływ na oczekiwanie mieści się w rozrzucie między dniami. Argument, by symulować kilka dni zamiast ufać intuicji.")],
  both_buttons: [T7('“To be sure”: 30 % press both buttons', '«Про всяк випадок»: 30 % тиснуть обидві кнопки', '„Zur Sicherheit“: 30 % drücken beide Taster', '“Voor de zekerheid”: 30 % drukt beide knoppen', '« Pour être sûr » : 30 % appuient sur les deux boutons', '«Por si acaso»: el 30 % pulsa los dos botones', '„Na wszelki wypadek”: 30 % wciska oba przyciski'),
    T7('Pressing ▲ and ▼ does not bring a car sooner: the second call makes a car in the other direction stop for nobody. Count the stops in the table: B makes more of them for the same passengers, and everybody else waits for those stops.',
      'Натиск ▲ і ▼ не прискорює кабіну: другий виклик змушує кабіну в інший бік зупинятися ні для кого. Порівняйте зупинки в таблиці: B робить їх більше для тих самих пасажирів, і всі інші чекають через ці зупинки.',
      '▲ und ▼ zu drücken holt keine Kabine schneller: der zweite Ruf lässt eine Kabine der Gegenrichtung für niemanden halten. Zählen Sie die Halte in der Tabelle: B macht mehr davon für dieselben Fahrgäste, und alle anderen warten auf diese Halte.',
      '▲ en ▼ indrukken haalt geen kooi sneller: de tweede oproep laat een kooi in de andere richting voor niemand stoppen. Tel de stops in de tabel: B maakt er meer voor dezelfde passagiers, en alle anderen wachten op die stops.',
      'Appuyer sur ▲ et ▼ n’amène pas la cabine plus tôt : le second appel fait s’arrêter pour personne une cabine de l’autre sens. Comptez les arrêts dans le tableau : B en fait davantage pour les mêmes passagers, et tous les autres attendent ces arrêts.',
      'Pulsar ▲ y ▼ no trae la cabina antes: la segunda llamada hace que una cabina del otro sentido pare para nadie. Cuente las paradas en la tabla: B hace más para los mismos pasajeros, y todos los demás esperan esas paradas.',
      'Wciśnięcie ▲ i ▼ nie sprowadzi kabiny szybciej: drugie wezwanie każe kabinie jadącej w drugą stronę stanąć dla nikogo. Policz zatrzymania w tabeli: B robi ich więcej dla tych samych pasażerów, a wszyscy inni czekają na te postoje.')],
  car_vs_doors: [T7("Busy morning: faster doors vs one more car", "Жвавий ранок: швидші двері чи ще одна кабіна", "Voller Morgen: schnellere Türen oder eine Kabine mehr", "Drukke ochtend: snellere deuren of een kooi meer", "Matin chargé : portes plus rapides ou une cabine de plus", "Mañana concurrida: puertas más rápidas o una cabina más", "Ruchliwy poranek: szybsze drzwi czy kabina więcej"),
    T7("A: the 6 cars close their doors 1 s faster; B: a seventh car with normal doors. Here the extra car wins clearly — the mean wait is 33–61 % lower than in A over seeds 1–5. At this load the group is short of capacity, and a second per stop does not make up for a sixth more cars.", "A: 6 кабін зачиняють двері на 1 с швидше; B: сьома кабіна зі звичайними дверима. Тут додаткова кабіна явно виграє — середнє очікування на 33–61 % менше, ніж в A, для зерен 1–5. За такого навантаження групі бракує провізної здатності, і секунда на зупинці не заміняє на шосту частину більше кабін.", "A: die 6 Kabinen schließen die Türen 1 s schneller; B: eine siebte Kabine mit normalen Türen. Hier gewinnt die zusätzliche Kabine klar — die mittlere Wartezeit ist bei Startwerten 1–5 um 33–61 % niedriger als in A. Bei dieser Last fehlt Förderleistung, und eine Sekunde je Halt ersetzt nicht ein Sechstel mehr Kabinen.", "A: de 6 kooien sluiten hun deuren 1 s sneller; B: een zevende kooi met normale deuren. Hier wint de extra kooi duidelijk — de gemiddelde wachttijd is bij startwaarden 1–5 33–61 % lager dan in A. Bij deze belasting is er te weinig capaciteit, en een seconde per stop weegt niet op tegen een zesde meer kooien.", "A : les 6 cabines ferment leurs portes 1 s plus vite ; B : une septième cabine aux portes normales. Ici la cabine supplémentaire l’emporte nettement — l’attente moyenne est de 33 à 61 % plus basse qu’en A pour les graines 1 à 5. À cette charge la capacité manque, et une seconde par arrêt ne remplace pas un sixième de cabines en plus.", "A: las 6 cabinas cierran las puertas 1 s más rápido; B: una séptima cabina con puertas normales. Aquí la cabina extra gana con claridad: la espera media es un 33–61 % menor que en A con las semillas 1–5. Con esta carga falta capacidad, y un segundo por parada no compensa una sexta parte más de cabinas.", "A: 6 kabin zamyka drzwi o 1 s szybciej; B: siódma kabina ze zwykłymi drzwiami. Tu dodatkowa kabina wyraźnie wygrywa — średnie oczekiwanie jest o 33–61 % krótsze niż w A dla ziaren 1–5. Przy takim obciążeniu brakuje zdolności przewozowej, a sekunda na postoju nie zastąpi szóstej części kabin więcej.")],
  parking: [T7("Quiet morning: idle cars stay vs return to the lobby", "Тихий ранок: вільні кабіни стоять чи повертаються у вестибюль", "Ruhiger Morgen: freie Kabinen bleiben oder fahren zur Lobby", "Rustige ochtend: vrije kooien blijven of keren terug naar de lobby", "Matin calme : cabines libres sur place ou retour au hall", "Mañana tranquila: cabinas libres quietas o de vuelta al vestíbulo", "Spokojny poranek: wolne kabiny stoją czy wracają do holu"),
    T7("Early in the morning (3 % in 5 min) almost everyone starts in the lobby. A car waiting empty on floor 12 must come down first; sent home to the lobby, it is already there: the mean wait falls by roughly 35–60 % (seeds 1–5). Now switch the traffic to interfloor — returning to the lobby becomes the worse choice. Parking must follow the traffic.", "Рано-вранці (3 % за 5 хв) майже всі починають у вестибюлі. Кабіна, що порожня стоїть на 12-му поверсі, мусить спершу спуститися; відправлена у вестибюль, вона вже там: середнє очікування зменшується приблизно на 35–60 % (зерна 1–5). Тепер перемкніть рух на міжповерховий — повернення у вестибюль стає гіршим вибором. Паркування має відповідати руху.", "Früh am Morgen (3 % in 5 min) starten fast alle in der Lobby. Eine Kabine, die leer in der 12. Etage wartet, muss erst herunter; zur Lobby geschickt, ist sie schon da: die mittlere Wartezeit sinkt um etwa 35–60 % (Startwerte 1–5). Stellen Sie nun den Verkehr auf zwischen Etagen — dann ist die Rückkehr zur Lobby die schlechtere Wahl. Parken muss dem Verkehr folgen.", "Vroeg in de ochtend (3 % in 5 min) begint bijna iedereen in de lobby. Een kooi die leeg op de 12e wacht, moet eerst naar beneden; teruggestuurd naar de lobby staat hij er al: de gemiddelde wachttijd daalt met ongeveer 35–60 % (startwaarden 1–5). Zet het verkeer nu op tussen verdiepingen — dan is terugkeren naar de lobby de slechtere keuze. Parkeren moet het verkeer volgen.", "Tôt le matin (3 % en 5 min), presque tout le monde part du hall. Une cabine qui attend vide au 12e doit d’abord descendre ; renvoyée au hall, elle y est déjà : l’attente moyenne baisse d’environ 35 à 60 % (graines 1 à 5). Passez maintenant le trafic en interétages — le retour au hall devient le mauvais choix. Le stationnement doit suivre le trafic.", "A primera hora (3 % en 5 min) casi todos salen del vestíbulo. Una cabina que espera vacía en la planta 12 debe bajar primero; enviada al vestíbulo, ya está allí: la espera media baja aproximadamente un 35–60 % (semillas 1–5). Cambie ahora el tráfico a entre plantas: volver al vestíbulo pasa a ser la peor opción. El aparcamiento debe seguir al tráfico.", "Wcześnie rano (3 % w 5 min) prawie wszyscy zaczynają w holu. Kabina czekająca pusto na 12. piętrze musi najpierw zjechać; odesłana do holu, już tam jest: średnie oczekiwanie spada o mniej więcej 35–60 % (ziarna 1–5). Przełącz teraz ruch na międzypiętrowy — powrót do holu staje się gorszym wyborem. Parkowanie musi podążać za ruchem.")],
  out_of_service: [T7("One of six cars out of service", "Одна з шести кабін поза роботою", "Eine von sechs Kabinen außer Betrieb", "Eén van zes kooien buiten dienst", "Une cabine sur six hors service", "Una de seis cabinas fuera de servicio", "Jedna z sześciu kabin wyłączona"),
    T7("Losing one car in six (17 % of the cars) does not add 17 % to the wait: at a normal morning load the mean wait becomes two to five times longer (seeds 1–5). Close to capacity every full car leaves people for the next one, and the queue grows for as long as the peak lasts.", "Втрата однієї кабіни з шести (17 % кабін) не додає 17 % до очікування: за звичайного ранкового навантаження середнє очікування зростає в два–п’ять разів (зерна 1–5). Біля межі провізної здатності кожна повна кабіна залишає людей наступній, і черга росте, доки триває пік.", "Eine von sechs Kabinen weniger (17 % der Kabinen) bedeutet nicht 17 % mehr Wartezeit: bei normaler Morgenlast wird die mittlere Wartezeit zwei- bis fünfmal so lang (Startwerte 1–5). Nahe der Kapazität lässt jede volle Kabine Leute für die nächste zurück, und die Schlange wächst, solange die Spitze dauert.", "Eén kooi op zes minder (17 % van de kooien) geeft geen 17 % meer wachttijd: bij een normale ochtendbelasting wordt de gemiddelde wachttijd twee tot vijf keer zo lang (startwaarden 1–5). Dicht bij de capaciteit laat elke volle kooi mensen achter voor de volgende, en de rij groeit zolang de piek duurt.", "Perdre une cabine sur six (17 % des cabines) n’ajoute pas 17 % à l’attente : à une charge matinale normale, l’attente moyenne devient deux à cinq fois plus longue (graines 1 à 5). Près de la capacité, chaque cabine pleine laisse du monde à la suivante et la file grandit tant que dure la pointe.", "Perder una cabina de seis (el 17 % de las cabinas) no añade un 17 % a la espera: con una carga matinal normal la espera media se hace de dos a cinco veces más larga (semillas 1–5). Cerca de la capacidad, cada cabina llena deja gente para la siguiente y la cola crece mientras dura la punta.", "Utrata jednej kabiny z sześciu (17 % kabin) nie dodaje 17 % do oczekiwania: przy zwykłym porannym obciążeniu średnie oczekiwanie wydłuża się dwu- do pięciokrotnie (ziarna 1–5). Blisko granicy zdolności przewozowej każda pełna kabina zostawia ludzi następnej, a kolejka rośnie, dopóki trwa szczyt.")],
  residential: [T7("Apartment block: one lift or two", "Житловий будинок: один ліфт чи два", "Wohnhaus: ein Aufzug oder zwei", "Woongebouw: één lift of twee", "Résidence : un ascenseur ou deux", "Bloque de viviendas: uno o dos ascensores", "Blok mieszkalny: jeden dźwig czy dwa"),
    T7("A second lift is not only a spare for breakdowns: in the evening return the share of residents waiting over a minute falls from 35–55 % to under 10 %, and the mean wait drops by about two thirds (seeds 1–5).", "Другий ліфт — не лише резерв на випадок поломки: у вечірнє повернення частка мешканців, що чекають понад хвилину, падає з 35–55 % до менш ніж 10 %, а середнє очікування зменшується приблизно на дві третини (зерна 1–5).", "Ein zweiter Aufzug ist nicht nur Reserve bei Ausfall: bei der abendlichen Heimkehr sinkt der Anteil der Bewohner, die über eine Minute warten, von 35–55 % auf unter 10 %, und die mittlere Wartezeit fällt um etwa zwei Drittel (Startwerte 1–5).", "Een tweede lift is niet alleen reserve bij storing: bij de thuiskomst ’s avonds daalt het aandeel bewoners dat langer dan een minuut wacht van 35–55 % naar minder dan 10 %, en de gemiddelde wachttijd daalt met ongeveer twee derde (startwaarden 1–5).", "Un second ascenseur n’est pas qu’un secours en cas de panne : au retour du soir, la part des habitants qui attendent plus d’une minute passe de 35–55 % à moins de 10 %, et l’attente moyenne baisse d’environ deux tiers (graines 1 à 5).", "Un segundo ascensor no es solo reserva ante averías: en la vuelta a casa por la tarde la cuota de vecinos que esperan más de un minuto baja del 35–55 % a menos del 10 %, y la espera media cae unos dos tercios (semillas 1–5).", "Drugi dźwig to nie tylko rezerwa na awarię: przy wieczornych powrotach udział mieszkańców czekających ponad minutę spada z 35–55 % poniżej 10 %, a średnie oczekiwanie maleje o mniej więcej dwie trzecie (ziarna 1–5).")],
  zoned: [T7("30-floor tower: two zones vs one big group", "30-поверхова вежа: дві зони чи одна велика група", "30-geschossiger Turm: zwei Zonen oder eine große Gruppe", "Toren van 30 verdiepingen: twee zones of één grote groep", "Tour de 30 niveaux : deux zones ou un seul grand groupe", "Torre de 30 plantas: dos zonas o un gran grupo", "Wieża 30-piętrowa: dwie strefy czy jedna duża grupa"),
    T7("The same 12 cars. Zoned, each car stops at no more than 15 floors and the high-zone cars run express past the low zone; as one group every car may stop anywhere on the way up, round trips get longer and the mean wait is two and a half to four times higher (seeds 1–5).", "Ті самі 12 кабін. Із зонуванням кожна кабіна зупиняється не більш ніж на 15 поверхах, а кабіни верхньої зони проходять нижню експресом; однією групою кожна кабіна може зупинитися будь-де дорогою вгору, обороти довшають, а середнє очікування у 2,5–4 рази більше (зерна 1–5).", "Dieselben 12 Kabinen. Zoniert hält jede Kabine an höchstens 15 Etagen, und die Kabinen der oberen Zone fahren express an der unteren vorbei; als eine Gruppe kann jede Kabine überall auf dem Weg nach oben halten, die Rundfahrten werden länger und die mittlere Wartezeit ist zweieinhalb- bis viermal so hoch (Startwerte 1–5).", "Dezelfde 12 kooien. Gezoneerd stopt elke kooi op hoogstens 15 verdiepingen en rijden de kooien van de hoge zone express langs de lage; als één groep kan elke kooi overal onderweg omhoog stoppen, worden rondritten langer en is de gemiddelde wachttijd tweeënhalf tot vier keer zo hoog (startwaarden 1–5).", "Les mêmes 12 cabines. Zonées, chacune dessert au plus 15 étages et celles de la zone haute passent la zone basse en express ; en un seul groupe, chaque cabine peut s’arrêter partout en montant, les allers-retours s’allongent et l’attente moyenne est deux fois et demie à quatre fois plus élevée (graines 1 à 5).", "Las mismas 12 cabinas. Con zonas, cada una para como mucho en 15 plantas y las de la zona alta pasan la baja en exprés; en un solo grupo cualquier cabina puede parar en cualquier planta al subir, los viajes redondos se alargan y la espera media es de dos veces y media a cuatro veces mayor (semillas 1–5).", "Te same 12 kabin. Przy strefach każda kabina staje najwyżej na 15 piętrach, a kabiny strefy wysokiej mijają niską ekspresowo; jako jedna grupa każda kabina może stanąć wszędzie po drodze w górę, obiegi się wydłużają, a średnie oczekiwanie jest od dwóch i pół do czterech razy dłuższe (ziarna 1–5).")],
  bunching: [T7('Nearest car vs estimated time of arrival', 'Найближча кабіна чи оцінений час прибуття', 'Nächste Kabine oder geschätzte Ankunftszeit', 'Dichtstbijzijnde kooi of geschatte aankomsttijd', 'Cabine la plus proche ou temps d’arrivée estimé', 'Cabina más cercana o tiempo estimado de llegada', 'Najbliższa kabina czy szacowany czas przyjazdu'),
    T7('Giving every call to the nearest car sounds right, but it ignores where that car is going and how many stops it has promised: cars bunch together and some landings wait a long time. Estimating the time of arrival spreads the cars; look at the 95 % wait.',
      'Віддавати кожен виклик найближчій кабіні здається правильним, але це ігнорує, куди кабіна їде і скільки зупинок вона вже пообіцяла: кабіни збиваються докупи, а деякі поверхи чекають довго. Оцінка часу прибуття розподіляє кабіни; подивіться на 95 % очікування.',
      'Jeden Ruf der nächsten Kabine zu geben klingt richtig, übersieht aber, wohin sie fährt und wie viele Halte sie schon zugesagt hat: Kabinen klumpen, manche Etagen warten lange. Die geschätzte Ankunftszeit verteilt die Kabinen; achten Sie auf die 95-%-Wartezeit.',
      'Elke oproep aan de dichtstbijzijnde kooi geven klinkt logisch, maar negeert waar die kooi heen gaat en hoeveel stops hij al beloofd heeft: kooien klonteren samen en sommige verdiepingen wachten lang. Geschatte aankomsttijd spreidt de kooien; kijk naar de 95 %-wachttijd.',
      'Confier chaque appel à la cabine la plus proche semble logique, mais ignore où elle va et combien d’arrêts elle a déjà promis : les cabines se regroupent et certains paliers attendent longtemps. Le temps d’arrivée estimé répartit les cabines ; regardez l’attente à 95 %.',
      'Dar cada llamada a la cabina más cercana parece lógico, pero ignora adónde va y cuántas paradas ya ha prometido: las cabinas se agrupan y algunas plantas esperan mucho. El tiempo estimado de llegada reparte las cabinas; mire la espera del 95 %.',
      'Przydzielanie każdego wezwania najbliższej kabinie brzmi rozsądnie, ale pomija, dokąd kabina jedzie i ile postojów już obiecała: kabiny zbijają się w grupki, a niektóre piętra czekają długo. Szacowany czas przyjazdu rozprasza kabiny; spójrz na oczekiwanie 95 %.')]
};

var LEARN = { version: 1,
  intro: { title: T7('What this tool does', 'Що робить цей інструмент', 'Was dieses Werkzeug tut', 'Wat deze tool doet', 'Ce que fait cet outil', 'Qué hace esta herramienta', 'Co robi to narzędzie'),
    body: T7('It simulates a lift group second by second and measures how long each person waits. Pick an example, watch the cars, then change one setting in B and compare: A and B always carry exactly the same people.',
      'Він секунда за секундою моделює групу ліфтів і вимірює, скільки чекає кожна людина. Оберіть приклад, подивіться на кабіни, потім змініть одне налаштування в B і порівняйте: A і B завжди перевозять тих самих людей.',
      'Es simuliert eine Aufzugsgruppe Sekunde für Sekunde und misst, wie lange jede Person wartet. Wählen Sie ein Beispiel, beobachten Sie die Kabinen, ändern Sie dann eine Einstellung in B und vergleichen Sie: A und B befördern immer genau dieselben Menschen.',
      'Het simuleert een liftgroep seconde per seconde en meet hoe lang elke persoon wacht. Kies een voorbeeld, kijk naar de kooien, wijzig dan één instelling in B en vergelijk: A en B vervoeren altijd precies dezelfde mensen.',
      'Il simule un groupe d’ascenseurs seconde par seconde et mesure l’attente de chacun. Choisissez un exemple, regardez les cabines, puis changez un réglage dans B et comparez : A et B transportent toujours exactement les mêmes personnes.',
      'Simula un grupo de ascensores segundo a segundo y mide cuánto espera cada persona. Elija un ejemplo, mire las cabinas, cambie un ajuste en B y compare: A y B llevan siempre exactamente las mismas personas.',
      'Symuluje grupę dźwigów sekunda po sekundzie i mierzy, ile czeka każda osoba. Wybierz przykład, popatrz na kabiny, potem zmień jedno ustawienie w B i porównaj: A i B zawsze wożą dokładnie tych samych ludzi.') },
  topics: {
    awt: { title: T7('Mean wait and the 95 % wait', 'Середнє очікування і 95 %', 'Mittlere und 95-%-Wartezeit', 'Gemiddelde en 95 %-wachttijd', 'Attente moyenne et à 95 %', 'Espera media y del 95 %', 'Średnie oczekiwanie i 95 %'),
      body: T7('The wait runs from the moment a person reaches the landing (and calls) to the moment they step into a car. The mean hides the unlucky ones: the 95th percentile says “95 % of people waited no longer than this”, and the share over 60 s counts the people who start to complain. Planners quote a target mean around 20–30 s for offices; a long tail is what people remember.',
        'Очікування триває від моменту, коли людина підходить до майданчика (і викликає), до моменту, коли вона заходить у кабіну. Середнє приховує невдах: 95-й процентиль означає «95 % людей чекали не довше», а частка понад 60 с рахує тих, хто починає скаржитися. Для офісів проєктувальники зазвичай орієнтуються на середнє близько 20–30 с; запам’ятовується саме довгий хвіст.',
        'Die Wartezeit läuft vom Erreichen der Haltestelle (mit Ruf) bis zum Einsteigen. Der Mittelwert verdeckt die Pechvögel: das 95. Perzentil sagt „95 % warteten nicht länger“, der Anteil über 60 s zählt die, die sich beschweren. Planer nennen für Büros ein Ziel von etwa 20–30 s im Mittel; im Gedächtnis bleibt der lange Rand.',
        'De wachttijd loopt van het moment dat iemand de overloop bereikt (en oproept) tot het instappen. Het gemiddelde verbergt de pechvogels: het 95e percentiel zegt “95 % wachtte niet langer”, het aandeel boven 60 s telt wie gaat klagen. Planners noemen voor kantoren een doel van zo’n 20–30 s gemiddeld; de lange staart blijft hangen.',
        'L’attente court de l’arrivée au palier (et de l’appel) jusqu’à l’entrée en cabine. La moyenne cache les malchanceux : le 95e centile dit « 95 % n’ont pas attendu plus », la part au-delà de 60 s compte ceux qui se plaignent. Pour des bureaux, on vise souvent une moyenne de 20 à 30 s ; c’est la longue traîne dont on se souvient.',
        'La espera va desde que la persona llega al rellano (y llama) hasta que entra en la cabina. La media oculta a los desafortunados: el percentil 95 dice «el 95 % no esperó más», la cuota por encima de 60 s cuenta a quienes empiezan a quejarse. Para oficinas se suele buscar una media de 20–30 s; lo que se recuerda es la cola larga.',
        'Oczekiwanie trwa od chwili, gdy osoba dochodzi do przystanku (i wzywa), do wejścia do kabiny. Średnia ukrywa pechowców: 95. percentyl mówi „95 % czekało nie dłużej”, a udział powyżej 60 s liczy tych, którzy zaczynają narzekać. Dla biur projektanci przyjmują zwykle średnią około 20–30 s; zapamiętuje się długi ogon.') },
    calls: { title: T7('Call systems', 'Системи виклику', 'Rufsysteme', 'Oproepsystemen', 'Systèmes d’appel', 'Sistemas de llamada', 'Systemy wezwań'),
      body: T7('One button per landing tells the group only “someone is here”: people board any car that stops and may ride the wrong way first. Up/down buttons tell the direction; the destination is pressed inside the car. Destination keypads take the floor at the landing, so the group knows every trip before the car arrives and can put people with the same destination together; there are no car buttons.',
        'Одна кнопка на поверсі повідомляє групі лише «тут хтось є»: люди сідають у будь-яку кабіну, що зупинилась, і можуть спершу проїхати не в той бік. Кнопки вгору/вниз повідомляють напрямок; поверх натискають у кабіні. Панелі вибору поверху приймають поверх уже на майданчику, тож група знає кожну поїздку до прибуття кабіни й може об’єднати людей з однаковим поверхом; кнопок у кабіні немає.',
        'Ein Taster je Etage sagt der Gruppe nur „hier ist jemand“: man steigt in jede haltende Kabine und fährt womöglich erst in die falsche Richtung. Auf/Ab-Taster nennen die Richtung; das Ziel wird in der Kabine gewählt. Zielwahl nimmt die Etage schon an der Haltestelle auf, die Gruppe kennt jede Fahrt vor Ankunft der Kabine und kann gleiche Ziele bündeln; Kabinentaster gibt es nicht.',
        'Eén knop per verdieping vertelt de groep alleen “hier staat iemand”: mensen stappen in elke kooi die stopt en rijden misschien eerst de verkeerde kant op. Op/neer-knoppen geven de richting; de bestemming wordt in de kooi gekozen. Bestemmingskeuze neemt de verdieping al op de overloop op, zodat de groep elke rit kent voor de kooi komt en gelijke bestemmingen kan bundelen; er zijn geen kooiknoppen.',
        'Un bouton par palier ne dit au groupe que « quelqu’un attend » : on monte dans n’importe quelle cabine qui s’arrête, quitte à partir d’abord dans le mauvais sens. Les boutons montée/descente donnent le sens ; la destination se choisit en cabine. Les claviers de destination prennent l’étage dès le palier : le groupe connaît chaque trajet avant l’arrivée et regroupe les mêmes destinations ; il n’y a pas de boutons en cabine.',
        'Un botón por rellano solo dice al grupo «aquí hay alguien»: se sube a cualquier cabina que pare y quizá se viaja primero en sentido contrario. Los botones subir/bajar indican el sentido; el destino se pulsa en la cabina. Los teclados de destino toman la planta ya en el rellano, así el grupo conoce cada viaje antes de que llegue la cabina y puede agrupar destinos iguales; no hay botones en cabina.',
        'Jeden przycisk na piętrze mówi grupie tylko „ktoś tu jest”: ludzie wsiadają do każdej kabiny, która stanie, i mogą najpierw jechać w złą stronę. Przyciski w górę/w dół podają kierunek; cel wybiera się w kabinie. Panele wyboru celu przyjmują piętro już na przystanku, więc grupa zna każdy przejazd przed przyjazdem kabiny i może łączyć ludzi o tym samym celu; w kabinie nie ma przycisków.') },
    dispatch: { title: T7('Dispatch rules', 'Правила диспетчеризації', 'Steuerungslogik', 'Besturingsregels', 'Règles de manœuvre', 'Reglas de maniobra', 'Reguły sterowania'),
      body: T7('Directional collective: each car answers the calls ahead of it in its direction, like a bus line. Nearest car: each new call goes to the closest car, whatever it is doing. Estimated time of arrival: each call goes to the car that would get there first, counting the stops it has already promised. Destination assignment: each person gets the car that minimises their wait plus ride without delaying the others too much. These are the textbook strategies; real group controls are proprietary refinements.',
        'Спрямоване збирання: кожна кабіна відповідає на виклики попереду себе у своєму напрямку, як автобусний маршрут. Найближча кабіна: кожен новий виклик дістається найближчій кабіні, хоч би що вона робила. Оцінений час прибуття: виклик отримує кабіна, яка прибуде першою з урахуванням уже обіцяних зупинок. Призначення за місцем призначення: кожна людина отримує кабіну, що мінімізує її очікування плюс поїздку, не затримуючи надто інших. Це підручникові стратегії; реальні групові системи — закриті вдосконалення.',
        'Richtungs-Sammelsteuerung: jede Kabine bedient die Rufe vor ihr in ihrer Richtung, wie eine Buslinie. Nächste Kabine: jeder neue Ruf geht an die nächstgelegene Kabine, egal was sie gerade tut. Geschätzte Ankunftszeit: der Ruf geht an die Kabine, die zuerst da wäre, samt ihrer schon zugesagten Halte. Zielzuweisung: jede Person bekommt die Kabine, die ihr Warten plus Fahren minimiert, ohne andere zu sehr zu verzögern. Das sind Lehrbuchstrategien; reale Gruppensteuerungen sind proprietäre Verfeinerungen.',
        'Richtingsgebonden verzamelbesturing: elke kooi beantwoordt de oproepen vóór zich in zijn richting, als een buslijn. Dichtstbijzijnde kooi: elke nieuwe oproep gaat naar de dichtstbijzijnde kooi, wat die ook doet. Geschatte aankomsttijd: de oproep gaat naar de kooi die er het eerst zou zijn, inclusief de al beloofde stops. Bestemmingstoewijzing: iedereen krijgt de kooi die zijn wachten plus rijden minimaliseert zonder anderen te veel op te houden. Dit zijn leerboekstrategieën; echte groepsbesturingen zijn eigen verfijningen van fabrikanten.',
        'Collective sélective : chaque cabine répond aux appels devant elle dans son sens, comme une ligne de bus. Cabine la plus proche : chaque nouvel appel va à la cabine la plus proche, quoi qu’elle fasse. Temps d’arrivée estimé : l’appel va à la cabine qui arriverait la première, en comptant les arrêts déjà promis. Affectation par destination : chacun reçoit la cabine qui minimise son attente plus son trajet sans trop retarder les autres. Ce sont les stratégies des manuels ; les manœuvres réelles sont des raffinements propriétaires.',
        'Colectiva selectiva: cada cabina atiende las llamadas por delante en su sentido, como una línea de autobús. Cabina más cercana: cada llamada nueva va a la cabina más próxima, haga lo que haga. Tiempo estimado de llegada: la llamada va a la cabina que llegaría primero, contando las paradas ya prometidas. Asignación por destino: cada persona recibe la cabina que minimiza su espera más su viaje sin retrasar demasiado a los demás. Son estrategias de manual; los controles reales son refinamientos propietarios.',
        'Zbiorcze kierunkowe: każda kabina obsługuje wezwania przed sobą w swoim kierunku, jak linia autobusowa. Najbliższa kabina: każde nowe wezwanie trafia do najbliższej kabiny, cokolwiek robi. Szacowany czas przyjazdu: wezwanie dostaje kabina, która dotarłaby pierwsza, licząc już obiecane postoje. Przydział według celu: każda osoba dostaje kabinę minimalizującą jej oczekiwanie plus jazdę bez nadmiernego opóźniania innych. To strategie podręcznikowe; rzeczywiste sterowania grupowe są zastrzeżonymi udoskonaleniami.') },
    ab: { title: T7('Why A and B use the same passengers', 'Чому A і B мають тих самих пасажирів', 'Warum A und B dieselben Fahrgäste haben', 'Waarom A en B dezelfde passagiers hebben', 'Pourquoi A et B ont les mêmes passagers', 'Por qué A y B tienen los mismos pasajeros', 'Dlaczego A i B mają tych samych pasażerów'),
      body: T7('Waiting times scatter a lot from one random day to the next. If A and B drew their own passengers, half the difference would be luck. Here both variants get the identical list — same people, same second, same floors — so the difference is caused by the settings. The seed picks which day; try several.',
        'Час очікування дуже коливається від одного випадкового дня до іншого. Якби A і B мали власних пасажирів, половина різниці була б везінням. Тут обидва варіанти отримують однаковий список — ті самі люди, та сама секунда, ті самі поверхи, — тож різницю спричиняють налаштування. Зерно обирає день; спробуйте кілька.',
        'Wartezeiten streuen stark von einem zufälligen Tag zum nächsten. Zögen A und B eigene Fahrgäste, wäre die Hälfte der Differenz Glück. Hier bekommen beide die identische Liste — dieselben Menschen, dieselbe Sekunde, dieselben Etagen —, die Differenz kommt also von den Einstellungen. Der Startwert wählt den Tag; probieren Sie mehrere.',
        'Wachttijden spreiden sterk van de ene toevallige dag op de andere. Als A en B eigen passagiers trokken, was de helft van het verschil geluk. Hier krijgen beide dezelfde lijst — dezelfde mensen, dezelfde seconde, dezelfde verdiepingen — dus het verschil komt van de instellingen. De startwaarde kiest de dag; probeer er meerdere.',
        'L’attente varie beaucoup d’une journée aléatoire à l’autre. Si A et B tiraient leurs propres passagers, la moitié de l’écart serait de la chance. Ici, les deux variantes reçoivent la même liste — mêmes personnes, même seconde, mêmes étages — l’écart vient donc des réglages. La graine choisit le jour ; essayez-en plusieurs.',
        'La espera varía mucho de un día aleatorio a otro. Si A y B sacaran sus propios pasajeros, la mitad de la diferencia sería suerte. Aquí ambas variantes reciben la misma lista —mismas personas, mismo segundo, mismas plantas—, así que la diferencia la causan los ajustes. La semilla elige el día; pruebe varias.',
        'Czasy oczekiwania mocno się wahają między losowymi dniami. Gdyby A i B losowały własnych pasażerów, połowa różnicy byłaby szczęściem. Tu oba warianty dostają identyczną listę — ci sami ludzie, ta sama sekunda, te same piętra — więc różnicę powodują ustawienia. Ziarno wybiera dzień; wypróbuj kilka.') },
    capacity: { title: T7('Why a little more traffic can double the wait', 'Чому трохи більший рух може подвоїти очікування', 'Warum etwas mehr Verkehr die Wartezeit verdoppeln kann', 'Waarom iets meer verkeer de wachttijd kan verdubbelen', 'Pourquoi un peu plus de trafic peut doubler l’attente', 'Por qué un poco más de tráfico puede duplicar la espera', 'Dlaczego trochę większy ruch może podwoić oczekiwanie'),
      body: T7('A group can move only so many people in five minutes (its handling capacity, set by the round-trip time and the car size). Below it, queues form and clear; close to it, each full car leaves people behind for the next one and the queue grows for as long as the peak lasts. That is why a car out of service, slower doors or a busier morning hurt far more than proportionally. The round-trip tool computes the capacity directly.',
        'Група може перевезти лише певну кількість людей за п’ять хвилин (провізна здатність, що визначається часом обороту й розміром кабіни). Нижче за неї черги утворюються й зникають; поблизу кожна повна кабіна залишає людей наступній, і черга росте, доки триває пік. Тому кабіна поза роботою, повільніші двері чи жвавіший ранок шкодять значно більше, ніж пропорційно. Інструмент часу обороту обчислює провізну здатність безпосередньо.',
        'Eine Gruppe kann in fünf Minuten nur eine bestimmte Zahl Menschen befördern (Förderleistung aus Umlaufzeit und Kabinengröße). Darunter bilden sich Schlangen und lösen sich auf; nahe daran lässt jede volle Kabine Leute für die nächste zurück, und die Schlange wächst, solange die Spitze dauert. Darum schaden eine Kabine außer Betrieb, langsamere Türen oder ein vollerer Morgen weit überproportional. Das Umlaufzeit-Werkzeug berechnet die Förderleistung direkt.',
        'Een groep kan in vijf minuten maar zoveel mensen vervoeren (de capaciteit, bepaald door omlooptijd en kooigrootte). Daaronder ontstaan rijen en lossen ze op; dichtbij laat elke volle kooi mensen achter voor de volgende en groeit de rij zolang de piek duurt. Daarom kosten een kooi buiten dienst, tragere deuren of een drukkere ochtend veel meer dan evenredig. De omlooptijdtool rekent de capaciteit direct uit.',
        'Un groupe ne peut transporter qu’un certain nombre de personnes en cinq minutes (sa capacité de transport, fixée par le temps d’aller-retour et la taille des cabines). En dessous, les files se forment et se résorbent ; près de la limite, chaque cabine pleine laisse du monde à la suivante et la file croît tant que dure la pointe. D’où l’effet plus que proportionnel d’une cabine hors service, de portes plus lentes ou d’un matin plus chargé. L’outil d’aller-retour calcule cette capacité directement.',
        'Un grupo solo puede mover cierto número de personas en cinco minutos (su capacidad de transporte, fijada por el tiempo de ida y vuelta y el tamaño de cabina). Por debajo, las colas se forman y se deshacen; cerca del límite, cada cabina llena deja gente para la siguiente y la cola crece mientras dura la punta. Por eso una cabina fuera de servicio, puertas más lentas o una mañana más concurrida perjudican mucho más que proporcionalmente. La herramienta de ida y vuelta calcula la capacidad directamente.',
        'Grupa może przewieźć w ciągu pięciu minut tylko określoną liczbę osób (zdolność przewozowa wynikająca z czasu obiegu i wielkości kabiny). Poniżej niej kolejki tworzą się i znikają; blisko niej każda pełna kabina zostawia ludzi następnej, a kolejka rośnie, dopóki trwa szczyt. Dlatego kabina wyłączona z ruchu, wolniejsze drzwi czy bardziej ruchliwy poranek szkodzą znacznie bardziej niż proporcjonalnie. Narzędzie czasu obiegu liczy tę zdolność bezpośrednio.') },
    zoning: { title: T7('Zoning and parking', 'Зонування і паркування', 'Zonierung und Parken', 'Zonering en parkeren', 'Zonage et stationnement', 'Zonificación y aparcamiento', 'Strefowanie i parkowanie'),
      body: T7('In tall buildings each group serves a band of floors and runs express through the others, so a round trip has fewer possible stops. Parking decides where empty cars wait: at the main entrance (best for the morning), spread over the building (best for interfloor and evening traffic) or wherever they stopped.',
        'У висотних будівлях кожна група обслуговує смугу поверхів і проходить інші експресом, тож за оборот менше можливих зупинок. Паркування визначає, де чекають порожні кабіни: біля головного входу (найкраще вранці), розподілено по будівлі (для руху між поверхами та ввечері) або там, де зупинилися.',
        'In hohen Gebäuden bedient jede Gruppe ein Band von Etagen und fährt durch die übrigen express, eine Rundfahrt hat also weniger mögliche Halte. Das Parken bestimmt, wo leere Kabinen warten: am Haupteingang (morgens am besten), über das Gebäude verteilt (für Etagen- und Abendverkehr) oder wo sie gehalten haben.',
        'In hoge gebouwen bedient elke groep een band verdiepingen en rijdt express door de rest, zodat een rondrit minder mogelijke stops heeft. Parkeren bepaalt waar lege kooien wachten: bij de hoofdingang (’s ochtends het best), verspreid over het gebouw (voor verkeer tussen verdiepingen en ’s avonds) of waar ze stopten.',
        'Dans les immeubles hauts, chaque groupe dessert une tranche d’étages et traverse les autres en express : un aller-retour a moins d’arrêts possibles. Le stationnement décide où attendent les cabines vides : à l’entrée principale (le mieux le matin), réparties (trafic interétages et du soir) ou là où elles se sont arrêtées.',
        'En edificios altos cada grupo sirve una franja de plantas y atraviesa las demás en exprés, de modo que un viaje redondo tiene menos paradas posibles. El aparcamiento decide dónde esperan las cabinas vacías: en la entrada principal (lo mejor por la mañana), repartidas (tráfico entre plantas y de tarde) o donde se detuvieron.',
        'W wysokich budynkach każda grupa obsługuje pas pięter, a przez pozostałe jedzie ekspresowo, więc obieg ma mniej możliwych postojów. Parkowanie decyduje, gdzie czekają puste kabiny: przy wejściu głównym (najlepiej rano), rozłożone w budynku (ruch międzypiętrowy i wieczorny) albo tam, gdzie stanęły.') },
    colors: { title: T7('Reading the animation', 'Як читати анімацію', 'Die Animation lesen', 'De animatie lezen', 'Lire l’animation', 'Leer la animación', 'Jak czytać animację'),
      body: T7('Each dot at a landing is a waiting person: green under 30 s, amber 30–60 s, red over 60 s. ▲▼ light when a call is registered; with destination keypads the landing shows how many people are assigned to each car instead. Inside a car, dots are passengers; the small marks in the shaft are the floors the car will stop at. Below each building the running numbers count only the people already in a car.',
        'Кожна точка на майданчику — людина, що чекає: зелена до 30 с, жовта 30–60 с, червона понад 60 с. ▲▼ світяться, коли виклик зареєстровано; з панелями вибору поверху майданчик показує, скільки людей призначено кожній кабіні. У кабіні точки — пасажири; маленькі мітки в шахті — поверхи, де кабіна зупиниться. Під кожною будівлею поточні числа рахують лише тих, хто вже в кабіні.',
        'Jeder Punkt an einer Haltestelle ist eine wartende Person: grün unter 30 s, gelb 30–60 s, rot über 60 s. ▲▼ leuchten, wenn ein Ruf registriert ist; bei Zielwahl zeigt die Haltestelle stattdessen, wie viele Personen welcher Kabine zugewiesen sind. In einer Kabine sind Punkte Fahrgäste; kleine Marken im Schacht sind die kommenden Halte. Unter jedem Gebäude zählen die laufenden Werte nur Menschen, die schon in einer Kabine sind.',
        'Elke stip op een overloop is een wachtende: groen onder 30 s, oranje 30–60 s, rood boven 60 s. ▲▼ lichten op als een oproep geregistreerd is; bij bestemmingskeuze toont de overloop hoeveel mensen aan elke kooi zijn toegewezen. In een kooi zijn stippen passagiers; kleine streepjes in de schacht zijn de verdiepingen waar de kooi zal stoppen. Onder elk gebouw tellen de lopende getallen alleen mensen die al in een kooi zitten.',
        'Chaque point au palier est une personne en attente : vert sous 30 s, orange 30–60 s, rouge au-delà de 60 s. ▲▼ s’allument quand un appel est enregistré ; avec les claviers de destination, le palier montre combien de personnes sont affectées à chaque cabine. Dans une cabine, les points sont des passagers ; les petits repères dans la gaine sont les étages où elle s’arrêtera. Sous chaque bâtiment, les chiffres courants ne comptent que les personnes déjà en cabine.',
        'Cada punto en un rellano es una persona esperando: verde por debajo de 30 s, ámbar 30–60 s, rojo por encima de 60 s. ▲▼ se encienden cuando se registra una llamada; con teclados de destino el rellano muestra cuántas personas tiene asignadas cada cabina. Dentro de una cabina los puntos son pasajeros; las marcas pequeñas en el hueco son las plantas donde parará. Bajo cada edificio, las cifras en curso cuentan solo a quienes ya están en una cabina.',
        'Każda kropka na przystanku to czekająca osoba: zielona poniżej 30 s, żółta 30–60 s, czerwona powyżej 60 s. ▲▼ świecą, gdy wezwanie jest zarejestrowane; przy panelach wyboru celu przystanek pokazuje, ile osób przydzielono każdej kabinie. W kabinie kropki to pasażerowie; małe znaczniki w szybie to piętra, na których kabina stanie. Pod każdym budynkiem bieżące liczby obejmują tylko osoby, które są już w kabinie.') },
    whatif: { title: T7('What-if ranking', 'Ранжування «а що, як»', 'Was-wäre-wenn-Rangfolge', 'Wat-als-rangschikking', 'Classement « et si »', 'Clasificación «¿y si…?»', 'Ranking „co jeśli”'),
      body: T7('Each button changes one thing on variant A and reruns it on the same passengers: one more car, doors 1 s faster, 1 m/s more speed, destination keypads, one car out of service, the canteen on the top floor, 30 % pressing both buttons. The table sorts them by the change in mean wait, so you see what is worth paying for in this building and traffic — the answer differs between buildings.',
        'Кожна кнопка змінює одну річ у варіанті A і повторює прогін на тих самих пасажирах: ще одна кабіна, двері на 1 с швидші, швидкість на 1 м/с більша, панелі вибору поверху, кабіна поза роботою, їдальня нагорі, 30 % тиснуть обидві кнопки. Таблиця сортує їх за зміною середнього очікування, тож видно, за що варто платити саме в цій будівлі й за цього руху, — відповідь у різних будівлях різна.',
        'Jeder Knopf ändert eine Sache an Variante A und rechnet sie mit denselben Fahrgästen neu: eine Kabine mehr, Türen 1 s schneller, 1 m/s schneller, Zielwahl, eine Kabine außer Betrieb, die Kantine ganz oben, 30 % drücken beide Taster. Die Tabelle sortiert nach der Änderung der mittleren Wartezeit — so sehen Sie, was sich in diesem Gebäude und Verkehr lohnt; die Antwort ist von Gebäude zu Gebäude anders.',
        'Elke knop wijzigt één ding aan variant A en rekent die opnieuw met dezelfde passagiers: een kooi meer, deuren 1 s sneller, 1 m/s sneller, bestemmingskeuze, een kooi buiten dienst, de kantine bovenin, 30 % drukt beide knoppen. De tabel sorteert op de verandering van de gemiddelde wachttijd, zodat u ziet wat in dit gebouw en dit verkeer de moeite loont; het antwoord verschilt per gebouw.',
        'Chaque bouton change une seule chose sur la variante A et la relance avec les mêmes passagers : une cabine de plus, portes plus rapides d’1 s, vitesse +1 m/s, claviers de destination, une cabine hors service, le restaurant en haut, 30 % appuyant sur les deux boutons. Le tableau les trie par variation de l’attente moyenne : on voit ce qui vaut la dépense dans ce bâtiment et ce trafic — la réponse change d’un bâtiment à l’autre.',
        'Cada botón cambia una sola cosa en la variante A y la vuelve a simular con los mismos pasajeros: una cabina más, puertas 1 s más rápidas, 1 m/s más de velocidad, teclados de destino, una cabina fuera de servicio, el comedor arriba, el 30 % pulsando los dos botones. La tabla los ordena por el cambio de espera media, para ver qué merece la pena en este edificio y este tráfico; la respuesta cambia de un edificio a otro.',
        'Każdy przycisk zmienia jedną rzecz w wariancie A i liczy go ponownie na tych samych pasażerach: kabina więcej, drzwi o 1 s szybsze, prędkość +1 m/s, panele wyboru celu, kabina wyłączona, stołówka na górze, 30 % wciska oba przyciski. Tabela sortuje według zmiany średniego oczekiwania, więc widać, za co warto płacić w tym budynku i przy tym ruchu — w innych budynkach odpowiedź jest inna.') },
    traffic: { title: T7('Traffic patterns', 'Характери руху', 'Verkehrsmuster', 'Verkeerspatronen', 'Profils de trafic', 'Patrones de tráfico', 'Rodzaje ruchu'),
      body: T7('Up-peak: nearly everyone enters at the entrance floors and rides up. Down-peak: the reverse, more spread in time. Lunch: people go out and to the canteen and come back, in both directions at once. Interfloor: meetings, people move between occupied floors. The arrival rate is the share of the present population arriving in five minutes at the peak; a busy office morning is often around 10–15 % (CIBSE Guide D design values, a learning range here).',
        'Ранковий пік: майже всі входять на поверхах входу й їдуть угору. Вечірній пік: навпаки, більш розтягнутий у часі. Обід: люди виходять і йдуть до їдальні та повертаються, в обох напрямках одночасно. Між поверхами: наради, люди переміщуються між зайнятими поверхами. Інтенсивність — частка присутніх, що приходять за п’ять хвилин на піку; жвавий офісний ранок часто має близько 10–15 % (проєктні значення CIBSE Guide D, тут навчальний діапазон).',
        'Morgenspitze: fast alle betreten das Haus an den Eingangsetagen und fahren nach oben. Abendspitze: umgekehrt, zeitlich gestreckter. Mittag: hinaus, zur Kantine und zurück, in beide Richtungen zugleich. Zwischen Etagen: Besprechungen, Wege zwischen belegten Etagen. Die Ankunftsrate ist der Anteil der Anwesenden, der in fünf Minuten auf der Spitze ankommt; ein voller Büromorgen liegt oft bei 10–15 % (Auslegungswerte nach CIBSE Guide D, hier eine Lernspanne).',
        'Ochtendpiek: bijna iedereen komt binnen op de entreeverdiepingen en gaat omhoog. Avondpiek: omgekeerd, meer gespreid in de tijd. Lunch: naar buiten, naar de kantine en terug, in beide richtingen tegelijk. Tussen verdiepingen: vergaderingen, verplaatsingen tussen bezette verdiepingen. De aankomstintensiteit is het aandeel van de aanwezigen dat in vijf minuten op de piek aankomt; een drukke kantoorochtend zit vaak rond 10–15 % (ontwerpwaarden uit CIBSE Guide D, hier een leerbandbreedte).',
        'Pointe montante : presque tout le monde entre aux étages d’accès et monte. Pointe descendante : l’inverse, plus étalé. Midi : on sort, on va au restaurant et on revient, dans les deux sens à la fois. Interétages : réunions, déplacements entre étages occupés. Le taux d’arrivée est la part des présents arrivant en cinq minutes au pic ; un matin chargé de bureaux tourne souvent autour de 10–15 % (valeurs de conception du CIBSE Guide D, ici une plage pédagogique).',
        'Punta de subida: casi todos entran por las plantas de acceso y suben. Punta de bajada: al revés, más repartida en el tiempo. Comida: se sale, se va al comedor y se vuelve, en ambos sentidos a la vez. Entre plantas: reuniones, desplazamientos entre plantas ocupadas. La tasa de llegada es la cuota de los presentes que llega en cinco minutos en la punta; una mañana de oficina concurrida ronda a menudo el 10–15 % (valores de diseño de CIBSE Guide D, aquí un rango didáctico).',
        'Szczyt poranny: prawie wszyscy wchodzą na piętrach wejściowych i jadą w górę. Szczyt wieczorny: odwrotnie, bardziej rozłożony w czasie. Obiad: wyjście, stołówka i powrót, w obu kierunkach naraz. Między piętrami: spotkania, przejścia między zajętymi piętrami. Intensywność przybyć to udział obecnych przychodzących w ciągu pięciu minut w szczycie; ruchliwy poranek w biurze to często około 10–15 % (wartości projektowe CIBSE Guide D, tu zakres dydaktyczny).') }
  },

/* ---- helpers ---- */
function tx(k) { return I18N[k] || { en: k }; }
function curLang() { return (window.DiagramUI && DiagramUI.current && DiagramUI.current.lang) || document.documentElement.lang || 'en'; }
function pick(o) { var l = curLang(); return (o && o[l]) || (o && o.en) || String(o == null ? '' : o); }
function S(k, subs) { var s = pick(tx(k)); if (subs) Object.keys(subs).sort(function (a, b) { return b.length - a.length; }).forEach(function (p) { s = s.split('%' + p).join(subs[p]); }); return s; }
function U(k) { return function () { return pick(tx(k)); }; }
var LOCALE = { en: 'en-GB', uk: 'uk-UA', de: 'de-DE', nl: 'nl-NL', fr: 'fr-FR', es: 'es-ES', pl: 'pl-PL' };
function fmt(v, d) { if (v == null || !isFinite(v)) return '—'; if (CORE && typeof CORE.fmt === 'function') { try { return CORE.fmt(v, curLang(), d || 0); } catch (e) { /* local */ } } return Number(v).toLocaleString(LOCALE[curLang()] || 'en-GB', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
function clone(x) { return x == null ? x : JSON.parse(JSON.stringify(x)); }
function opts(prefix, keys) { return keys.map(function (k) { return { value: k, label: tx(prefix + k) }; }); }
function clockOf(sec) { var m = Math.floor(sec / 60), s = Math.floor(sec % 60); return m + ':' + (s < 10 ? '0' : '') + s; }

/* ---- buildings: the shared demo buildings of vt-core.js ---- */
var BUILDINGS = ['office15', 'office30_zoned', 'residential10', 'hotel20', 'hospital8'];
function coreBuilding(id) {
  if (!CORE || !CORE.PRESETS || !CORE.PRESETS[id]) return null;
  var p = CORE.PRESETS[id]; var d = clone(p.doc || p);
  return d && d.building && Array.isArray(d.groups) ? d : null;
}
function normalizeDoc(d) { if (CORE && CORE.scenario && typeof CORE.scenario.normalize === 'function') { try { return CORE.scenario.normalize(d); } catch (e) { /* as is */ } } return d; }
function baseDoc() {
  var d = state.building === 'custom' && state.custom ? clone(state.custom) : coreBuilding(state.building);
  return d ? normalizeDoc(d) : null;
}
function hasCanteen(d) { return !!(d && d.building.floors.some(function (f) { return f.role === 'canteen'; })); }
function groupsOf(d) { return d ? d.groups.length : 0; }
function baseCars(d) { return d && d.groups[0] ? d.groups[0].cars.length : 0; }
function baseSpeed(d) { return d && d.groups[0] && d.groups[0].cars[0] ? d.groups[0].cars[0].speed : null; }
function baseClose(d) { return d && d.groups[0] && d.groups[0].cars[0] ? d.groups[0].cars[0].door_close_s : null; }
function sideDefaults(d) {
  var g = d && d.groups[0];
  return { cars: baseCars(d) || 1, call: (g && g.call_system) || 'updown', dispatch: (g && g.dispatch) || 'collective', parking: (g && g.parking) || 'lobby',
           speed: null, door_close: null, out: g ? g.cars.filter(function (c) { return c.in_service === false; }).length : 0, both: Math.round(((d && d.traffic.both_buttons_share) || 0) * 100), canteen: 'low', zoning: 'asbuilt' };
}

/* the variant's document: base building + the side's settings + the shared traffic settings */
function sideDoc(sd) {
  var d = baseDoc(); if (!d) return null;
  var fl = d.building.floors;
  if (sd.canteen === 'top' && hasCanteen(d)) {
