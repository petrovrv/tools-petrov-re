 "summary": {
  "en": "Generates one functional test per cause-and-effect cell, voting combination, sequence transition, mode edge and IO loop, records execution with evidence, and measures coverage of the control model.",
  "uk": "Створює функціональні випробування з комірок матриці причин-наслідків, комбінацій голосування, переходів послідовності, меж режимів і контурів вводу-виводу, фіксує виконання з доказом і вимірює покриття моделі керування.",
  "de": "Erzeugt je eine Funktionsprüfung pro Ursache-Wirkungs-Zelle, Voting-Kombination, Sequenzübergang, Modusgrenze und E/A-Kreis, protokolliert die Durchführung mit Nachweis und misst die Abdeckung des Steuerungsmodells.",
  "nl": "Genereert één functionele test per oorzaak-gevolgcel, stemcombinatie, sequentieovergang, modusgrens en I/O-lus, legt de uitvoering met bewijs vast en meet de dekking van het besturingsmodel.",
  "fr": "Génère un essai fonctionnel par cellule cause-effet, combinaison de vote, transition de séquence, limite de mode et boucle E/S, enregistre l’exécution avec sa preuve et mesure la couverture du modèle de commande.",
  "es": "Genera una prueba funcional por celda causa-efecto, combinación de votación, transición de secuencia, límite de modo y lazo de E/S, registra la ejecución con evidencia y mide la cobertura del modelo de control.",
  "pl": "Tworzy po jednej próbie funkcjonalnej na komórkę matrycy przyczyn i skutków, kombinację głosowania, przejście sekwencji, granicę trybu i pętlę we/wy, rejestruje wykonanie z dowodem i mierzy pokrycie modelu sterowania."
 },
 "description": {
  "en": "Takes the control model already in the project package — cause-and-effect matrices, functional-description sequences and the IO list — and derives a test set from it: one test per non-empty matrix cell, one per voting combination at the chosen coverage level, one per sequence transition and per mode entry and exit, a five-point loop check per analogue IO point and a two-state check per digital point, and one end-to-end proof-test sequence per SIL-rated cause. Every expected result is computed from the model and stored beside a 32-bit hash of the model slice it came from, so a test written against a superseded setpoint is reported as stale rather than counted as coverage. Execution is recorded per test with preconditions, steps, actual observation, result, witness, evidence reference, punch reference and retest link; 34 rules check the record against the model and against the execution discipline. The result is a coverage figure per model category and a register of functional tests for the turnover tool.",
  "uk": "Бере модель керування, вже наявну в проєктному пакеті — матриці причин-наслідків, послідовності функціонального опису та перелік вводу-виводу — і виводить з неї набір випробувань: по одному на кожну непорожню комірку матриці, по одному на кожну комбінацію голосування обраного рівня покриття, по одному на кожен перехід послідовності та на вхід і вихід з режиму, п’ятиточкову перевірку контуру для кожної аналогової точки та двостанову для дискретної, а також наскрізну послідовність перевірки для кожної причини з рівнем SIL. Кожен очікуваний результат обчислюється з моделі та зберігається разом із 32-бітним хешем зрізу моделі, тож випробування, написане за застарілою уставкою, позначається як застаріле, а не зараховується до покриття. Виконання фіксується для кожного випробування: передумови, кроки, фактичне спостереження, результат, свідок, посилання на доказ, посилання на punch-перелік і зв’язок із повторним випробуванням; 34 правила перевіряють протокол щодо моделі та дисципліни виконання. Результат — показник покриття за кожною категорією моделі та реєстр функціональних випробувань для інструмента передачі.",
  "de": "Nimmt das Steuerungsmodell, das im Projektpaket bereits vorliegt — Ursache-Wirkungs-Matrizen, Sequenzen der Funktionsbeschreibung und die E/A-Liste — und leitet daraus einen Prüfsatz ab: je eine Prüfung pro belegter Matrixzelle, je eine pro Voting-Kombination der gewählten Abdeckungsstufe, je eine pro Sequenzübergang sowie pro Moduseintritt und -austritt, eine Fünfpunkt-Kreisprüfung je Analogpunkt und eine Zweizustandsprüfung je Digitalpunkt, dazu je eine durchgehende Wiederholungsprüfung pro SIL-bewerteter Ursache. Jedes Sollergebnis wird aus dem Modell berechnet und mit einem 32-Bit-Hash des zugrunde liegenden Modellausschnitts gespeichert, sodass eine Prüfung gegen einen überholten Sollwert als veraltet gemeldet und nicht als Abdeckung gezählt wird. Die Durchführung wird je Prüfung protokolliert: Voraussetzungen, Schritte, tatsächliche Beobachtung, Ergebnis, Zeuge, Nachweisverweis, Punch-Verweis und Verknüpfung zur Wiederholungsprüfung; 34 Regeln prüfen das Protokoll gegen das Modell und gegen die Durchführungsdisziplin. Ergebnis sind Abdeckungszahlen je Modellkategorie und ein Register der Funktionsprüfungen für das Übergabewerkzeug.",
  "nl": "Neemt het besturingsmodel dat al in het projectpakket zit — oorzaak-gevolgmatrices, sequenties uit de functionele beschrijving en de I/O-lijst — en leidt daaruit een testset af: één test per gevulde matrixcel, één per stemcombinatie op het gekozen dekkingsniveau, één per sequentieovergang en per modusingang en -uitgang, een vijfpuntslustest per analoog punt en een tweetoestandstest per digitaal punt, plus één doorlopende beproevingsreeks per SIL-gewaardeerde oorzaak. Elk verwacht resultaat wordt uit het model berekend en opgeslagen naast een 32-bits hash van het modelfragment waaruit het komt, zodat een test tegen een achterhaald setpoint als verouderd wordt gemeld in plaats van als dekking te tellen. De uitvoering wordt per test vastgelegd: voorwaarden, stappen, werkelijke waarneming, resultaat, getuige, bewijsverwijzing, punchverwijzing en hertestkoppeling; 34 regels toetsen de registratie aan het model en aan de uitvoeringsdiscipline. Het resultaat is een dekkingscijfer per modelcategorie en een register van functionele tests voor de overdrachtstool.",
  "fr": "Reprend le modèle de commande déjà présent dans le dossier de projet — matrices cause-effet, séquences de la description fonctionnelle et liste d’E/S — et en déduit un jeu d’essais : un essai par cellule remplie de la matrice, un par combinaison de vote au niveau de couverture choisi, un par transition de séquence et par entrée et sortie de mode, une vérification de boucle en cinq points par point analogique et en deux états par point tout-ou-rien, plus une séquence de preuve complète par cause classée SIL. Chaque résultat attendu est calculé à partir du modèle et conservé avec une empreinte 32 bits de la portion de modèle dont il provient : un essai écrit contre un seuil périmé est signalé comme obsolète au lieu d’être compté comme couverture. L’exécution est consignée par essai : préalables, étapes, observation réelle, résultat, témoin, référence de preuve, référence de réserve et lien de contre-essai ; 34 règles confrontent le registre au modèle et à la discipline d’exécution. Le résultat est un taux de couverture par catégorie de modèle et un registre des essais fonctionnels pour l’outil de transfert.",
  "es": "Toma el modelo de control ya presente en el paquete de proyecto — matrices causa-efecto, secuencias de la descripción funcional y lista de E/S — y deriva de él un conjunto de pruebas: una prueba por celda ocupada de la matriz, una por combinación de votación en el nivel de cobertura elegido, una por transición de secuencia y por entrada y salida de modo, una verificación de lazo de cinco puntos por punto analógico y de dos estados por punto digital, y una secuencia de prueba de extremo a extremo por cada causa clasificada SIL. Cada resultado esperado se calcula del modelo y se guarda junto a un hash de 32 bits del fragmento de modelo del que procede, de modo que una prueba escrita contra un punto de disparo superado se señala como obsoleta en lugar de contarse como cobertura. La ejecución se registra por prueba: condiciones previas, pasos, observación real, resultado, testigo, referencia de evidencia, referencia de pendiente y enlace de repetición; 34 reglas contrastan el registro con el modelo y con la disciplina de ejecución. El resultado es una cifra de cobertura por categoría del modelo y un registro de pruebas funcionales para la herramienta de entrega.",
  "pl": "Bierze model sterowania już obecny w pakiecie projektu — matryce przyczyn i skutków, sekwencje opisu funkcjonalnego oraz listę we/wy — i wyprowadza z niego zestaw prób: po jednej na wypełnioną komórkę matrycy, po jednej na kombinację głosowania na wybranym poziomie pokrycia, po jednej na przejście sekwencji oraz na wejście i wyjście z trybu, pięciopunktowe sprawdzenie pętli dla każdego punktu analogowego i dwustanowe dla dwustanowego, a także pełną sekwencję próby dla każdej przyczyny z poziomem SIL. Każdy wynik oczekiwany jest obliczany z modelu i zapisywany obok 32-bitowego skrótu fragmentu modelu, z którego pochodzi, więc próba napisana dla nieaktualnej nastawy jest zgłaszana jako nieaktualna, a nie liczona do pokrycia. Wykonanie jest rejestrowane dla każdej próby: warunki wstępne, kroki, obserwacja rzeczywista, wynik, świadek, odniesienie do dowodu, odniesienie do usterki i powiązanie z próbą powtórzoną; 34 reguły konfrontują protokół z modelem i z dyscypliną wykonania. Wynikiem jest miara pokrycia dla każdej kategorii modelu oraz rejestr prób funkcjonalnych dla narzędzia przekazania."
 },

 "limitations": {
  "en": "The tool writes and records test procedures; it does not execute tests, connect to a controller or read live values. Every expected result is derived from the model as loaded, so a wrong matrix, sequence or IO range produces a wrong expectation and the tool cannot detect that. Voting tests assume identical channels combined by plain MooN logic: degraded-mode reconfiguration, discrepancy alarms, diagnostics and time delays are not modelled. Response time, stroke time and trip-point accuracy of the logic are not tested; the trip setpoint appears in the expected result as text only. Loop checks are single-direction five-point checks; hysteresis, repeatability, HART or fieldbus diagnostics and bus points are out of scope. The SIL proof-test check is structural and assesses neither proof-test coverage, test interval nor PFD. Staleness is detected by a 32-bit FNV-1a hash of the model slice a test was generated from; two different slices share a hash with probability about 2.3e-10 per comparison. The record is not a validation certificate or an acceptance decision: IEC 61511-1:2016 clause 15 validation is carried out against the safety requirement specification by competent persons, and the specification, contract and site rules remain authoritative.",
  "uk": "Інструмент складає та фіксує процедури випробувань; він не виконує випробувань, не з’єднується з контролером і не читає живих значень. Кожен очікуваний результат виводиться з моделі в завантаженому вигляді, тож хибна матриця, послідовність чи діапазон вводу-виводу дають хибне очікування, і інструмент цього не виявить. Випробування голосування припускають однакові канали, поєднані простою логікою MooN: реконфігурація в деградованому режимі, сигналізація розбіжності, діагностика та витримки часу не моделюються. Час відгуку, час ходу та точність точки спрацювання логіки не перевіряються; уставка спрацювання з’являється в очікуваному результаті лише як текст. Перевірки контуру — односпрямовані п’ятиточкові; гістерезис, повторюваність, діагностика HART чи польової шини та шинні точки поза межами. Перевірка повноти випробування SIL є структурною й не оцінює ні покриття випробування, ні інтервал, ні PFD. Застарілість виявляється 32-бітним хешем FNV-1a зрізу моделі, з якого створено випробування; два різні зрізи збігаються за хешем із імовірністю близько 2,3e-10 на порівняння. Протокол не є свідоцтвом валідації чи рішенням про приймання: валідація за IEC 61511-1:2016 розділ 15 виконується щодо специфікації вимог безпеки компетентними особами, а визначальними лишаються специфікація, контракт і правила майданчика.",
  "de": "Das Werkzeug schreibt und protokolliert Prüfprozeduren; es führt keine Prüfung aus, verbindet sich mit keiner Steuerung und liest keine Live-Werte. Jedes Sollergebnis stammt aus dem geladenen Modell, sodass eine falsche Matrix, Sequenz oder E/A-Messspanne eine falsche Erwartung ergibt, die das Werkzeug nicht erkennen kann. Voting-Prüfungen setzen identische Kanäle mit einfacher MooN-Logik voraus: Rekonfiguration im degradierten Betrieb, Diskrepanzalarme, Diagnose und Zeitverzögerungen sind nicht modelliert. Reaktionszeit, Stellzeit und Genauigkeit des Auslösepunkts der Logik werden nicht geprüft; der Auslösesollwert erscheint im Sollergebnis nur als Text. Kreisprüfungen sind Fünfpunktprüfungen in einer Richtung; Hysterese, Wiederholbarkeit, HART- oder Feldbusdiagnose und Buspunkte liegen außerhalb. Die Prüfung der SIL-Wiederholungsprüfung ist strukturell und bewertet weder Prüfabdeckung noch Prüfintervall noch PFD. Veraltung wird über einen 32-Bit-FNV-1a-Hash des Modellausschnitts erkannt; zwei verschiedene Ausschnitte teilen einen Hash mit etwa 2,3e-10 je Vergleich. Das Protokoll ist weder Validierungszeugnis noch Abnahmeentscheidung: Die Validierung nach IEC 61511-1:2016 Abschnitt 15 erfolgt gegen die Sicherheitsanforderungsspezifikation durch fachkundige Personen; Spezifikation, Vertrag und Anlagenregeln bleiben maßgebend.",
  "nl": "De tool stelt testprocedures op en legt ze vast; hij voert geen tests uit, maakt geen verbinding met een besturing en leest geen live waarden. Elk verwacht resultaat komt uit het model zoals geladen, dus een verkeerde matrix, sequentie of I/O-meetbereik geeft een verkeerde verwachting en de tool merkt dat niet op. Stemtests gaan uit van identieke kanalen met gewone MooN-logica: herconfiguratie in gedegradeerde toestand, discrepantiealarmen, diagnose en tijdvertragingen zijn niet gemodelleerd. Responstijd, slagtijd en nauwkeurigheid van het afschakelpunt van de logica worden niet getest; het afschakelsetpoint staat alleen als tekst in het verwachte resultaat. Lustests zijn vijfpuntstests in één richting; hysterese, herhaalbaarheid, HART- of veldbusdiagnose en buspunten vallen erbuiten. De SIL-beproevingscontrole is structureel en beoordeelt beproevingsdekking, beproevingsinterval noch PFD. Veroudering wordt bepaald met een 32-bits FNV-1a-hash van het modelfragment waaruit een test is gemaakt; twee verschillende fragmenten delen een hash met ongeveer 2,3e-10 per vergelijking. De registratie is geen validatiecertificaat of acceptatiebesluit: validatie volgens IEC 61511-1:2016 clausule 15 gebeurt tegen de veiligheidseisenspecificatie door vakbekwame personen, en specificatie, contract en locatieregels blijven leidend.",
  "fr": "L’outil rédige et consigne des procédures d’essai ; il n’exécute aucun essai, ne se connecte à aucun automate et ne lit aucune valeur en ligne. Chaque résultat attendu provient du modèle tel que chargé : une matrice, une séquence ou une étendue d’E/S erronée produit une attente erronée que l’outil ne peut pas détecter. Les essais de vote supposent des voies identiques combinées par une logique MooN simple : reconfiguration en mode dégradé, alarmes de discordance, diagnostics et temporisations ne sont pas modélisés. Le temps de réponse, le temps de course et la précision du point de déclenchement de la logique ne sont pas éprouvés ; le seuil de déclenchement n’apparaît dans le résultat attendu que sous forme de texte. Les vérifications de boucle sont des contrôles en cinq points dans un seul sens ; hystérésis, répétabilité, diagnostics HART ou bus de terrain et points de bus sont hors périmètre. Le contrôle de la séquence de preuve SIL est structurel et n’évalue ni la couverture d’essai, ni l’intervalle, ni la PFD. L’obsolescence est détectée par une empreinte FNV-1a 32 bits de la portion de modèle ayant servi à l’essai ; deux portions différentes partagent une empreinte avec une probabilité d’environ 2,3e-10 par comparaison. Le registre n’est ni un certificat de validation ni une décision d’acceptation : la validation de l’IEC 61511-1:2016 article 15 est conduite face à la spécification des exigences de sécurité par des personnes compétentes, et la spécification, le contrat et les règles du site restent prépondérants.",
  "es": "La herramienta redacta y registra procedimientos de prueba; no ejecuta pruebas, no se conecta a un controlador ni lee valores en vivo. Cada resultado esperado se deriva del modelo tal como se cargó, de modo que una matriz, secuencia o rango de E/S equivocado produce una expectativa equivocada que la herramienta no puede detectar. Las pruebas de votación suponen canales idénticos combinados por lógica MooN simple: la reconfiguración en modo degradado, las alarmas de discrepancia, los diagnósticos y las temporizaciones no están modelados. No se prueban el tiempo de respuesta, el tiempo de carrera ni la exactitud del punto de disparo de la lógica; el punto de disparo aparece en el resultado esperado solo como texto. Las verificaciones de lazo son de cinco puntos en un solo sentido; histéresis, repetibilidad, diagnósticos HART o de bus de campo y puntos de bus quedan fuera. La comprobación de la secuencia de prueba SIL es estructural y no evalúa cobertura de prueba, intervalo ni PFD. La obsolescencia se detecta con un hash FNV-1a de 32 bits del fragmento de modelo del que se generó la prueba; dos fragmentos distintos comparten hash con probabilidad de unos 2,3e-10 por comparación. El registro no es un certificado de validación ni una decisión de aceptación: la validación de IEC 61511-1:2016 cláusula 15 la realizan personas competentes frente a la especificación de requisitos de seguridad, y la especificación, el contrato y las reglas de la instalación siguen siendo autoritativos.",
  "pl": "Narzędzie tworzy i rejestruje procedury prób; nie wykonuje prób, nie łączy się ze sterownikiem i nie odczytuje wartości na żywo. Każdy wynik oczekiwany pochodzi z modelu w postaci wczytanej, więc błędna matryca, sekwencja lub zakres we/wy dają błędne oczekiwanie, którego narzędzie nie wykryje. Próby głosowania zakładają identyczne kanały łączone prostą logiką MooN: rekonfiguracja w stanie zdegradowanym, alarmy rozbieżności, diagnostyka i opóźnienia czasowe nie są modelowane. Czas odpowiedzi, czas przestawienia i dokładność punktu zadziałania logiki nie są sprawdzane; nastawa zadziałania pojawia się w wyniku oczekiwanym wyłącznie jako tekst. Sprawdzenia pętli są jednokierunkowe i pięciopunktowe; histereza, powtarzalność, diagnostyka HART lub magistrali obiektowej oraz punkty magistralowe są poza zakresem. Sprawdzenie sekwencji próby SIL ma charakter strukturalny i nie ocenia ani pokrycia próby, ani odstępu między próbami, ani PFD. Przeterminowanie wykrywa 32-bitowy skrót FNV-1a fragmentu modelu, z którego utworzono próbę; dwa różne fragmenty dzielą skrót z prawdopodobieństwem około 2,3e-10 na porównanie. Protokół nie jest świadectwem walidacji ani decyzją o odbiorze: walidację według IEC 61511-1:2016 punkt 15 prowadzą osoby kompetentne wobec specyfikacji wymagań bezpieczeństwa, a specyfikacja, umowa i zasady obiektu pozostają nadrzędne."
 },

 "validation": {
  "basis": {
   "en": "Phase vocabulary FAT/FIT/SAT/SIT from IEC 62381:2024 clauses 5-8, loop check from IEC 62382:2024, validation from IEC 61511-1:2016 clause 15. The five-point 0/25/50/75/100 % injection, the tolerance-from-accuracy rule, the voting combination scheme, the bypass-restoration rule and the proof-test completeness predicate are author engineering methodology informed by those clauses; no rule cites a clause item that was not read.",
   "uk": "Словник фаз FAT/FIT/SAT/SIT — з IEC 62381:2024 розділи 5-8, перевірка контуру — з IEC 62382:2024, валідація — з IEC 61511-1:2016 розділ 15. П’ятиточкове подання 0/25/50/75/100 %, правило допуску від точності приладу, схема комбінацій голосування, правило відновлення після байпасу та критерій повноти випробування є авторською інженерною методикою з урахуванням цих розділів; жодне правило не посилається на пункт, який не було прочитано.",

(function () {

var PHASES = ['FAT', 'FIT', 'SAT', 'SIT', 'loop_check', 'validation'];

var CATEGORIES = ['cells', 'voting', 'sif', 'transitions', 'mode_edges', 'io'];

/* §3.1 domain of settings.default_tolerance_pct, the generated value's source.
 * tests[].tolerance_pct carries no upper bound (§5.5). */
var TOL_MAX_PCT = 10;

var DEFAULTS = {
  schema: 'tools.petrov.re/functionaltest-state/v1',
  meta: { project_name: '', project_reference: '', package_id: null, package_revision: null, model_loaded_at: null },
  settings: {
    voting_coverage: 'single_double',
    scope: { ce: true, sequences: true, loop: true },
    default_tolerance_pct: 0.5,
    phase_ce: 'SAT', phase_sequence: 'SIT', phase_loop: 'loop_check', phase_sif: 'validation',
    system_filter: null
  },
  model: { matrices: [], functions: [], io: [] },
  io_accuracy: {},
  tests: []
};

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function isNum(v) { return typeof v === 'number' && isFinite(v); }
function isInt(v) { return isNum(v) && Math.floor(v) === v; }
function str(v) { return v == null ? '' : String(v); }
function empty(v) { return str(v).trim() === ''; }
function uniq(a) { var o = {}, r = []; a.forEach(function (x) { if (!o[x]) { o[x] = 1; r.push(x); } }); return r; }
function byCode(a, b) { return a < b ? -1 : a > b ? 1 : 0; }

/* §3.6 slug: uppercase, every run outside [A-Z0-9] becomes one '-', trimmed. */
function slug(s) { return str(s).toUpperCase().replace(/[^A-Z0-9]+/g, '-').replace(/^-+/, '').replace(/-+$/, ''); }

/* §4.4 canonical JSON: no whitespace, object keys sorted by UTF-16 code units,
 * arrays in order, absent written as null, numbers via Number#toString. */
function canonical(v) {
  if (v === undefined || v === null) return 'null';
  var t = typeof v;
  if (t === 'number') return isFinite(v) ? String(v) : 'null';
  if (t === 'boolean') return v ? 'true' : 'false';
  if (t === 'string') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(canonical).join(',') + ']';
  if (t === 'object') {
    var ks = Object.keys(v).sort(byCode);
    return '{' + ks.map(function (k) { return JSON.stringify(k) + ':' + canonical(v[k]); }).join(',') + '}';
  }

}

function utf8Bytes(s) {
  var out = [], i, c, c2, cp;
  for (i = 0; i < s.length; i++) {
    c = s.charCodeAt(i);
    if (c < 0x80) out.push(c);
    else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 63));
    else if (c >= 0xd800 && c <= 0xdbff && i + 1 < s.length && (c2 = s.charCodeAt(i + 1)) >= 0xdc00 && c2 <= 0xdfff) {
      cp = 0x10000 + ((c - 0xd800) << 10) + (c2 - 0xdc00);
      out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));

/* FNV-1a 32: h = 2166136261; h = (h XOR b) * 16777619 mod 2^32. §4.4 */
function fnv1a32(s) {

}
function hashOf(sliceObj) { return 'fnv1a32:' + fnv1a32(canonical(sliceObj)); }

/* ---------------------------------------------------------- model accessors */

function matrixById(st, id) { return (st.model.matrices || []).filter(function (m) { return m.id === id; })[0] || null; }
function causeById(m, id) { return ((m && m.causes) || []).filter(function (c) { return c.id === id; })[0] || null; }
function effectById(m, id) { return ((m && m.effects) || []).filter(function (e) { return e.id === id; })[0] || null; }
function funcById(st, id) { return (st.model.functions || []).filter(function (f) { return f.id === id; })[0] || null; }
function stepById(f, id) { return ((f && f.steps) || []).filter(function (s) { return s.id === id; })[0] || null; }
function modeById(f, id) { return ((f && f.modes) || []).filter(function (m) { return m.id === id; })[0] || null; }
function ioByTag(st, tag) { return (st.model.io || []).filter(function (p) { return p.tag === tag; })[0] || null; }

function votingValid(c) { return isInt(c.m) && isInt(c.n) && c.n >= 1 && c.m >= 1 && c.m <= c.n; }
function channelsValid(c) { return votingValid(c) && Array.isArray(c.channels) && c.channels.length === c.n; }
function silRelated(v) { return v === 1 || v === 2 || v === 3 || v === 4; }
function ioRangeValid(p) { return isNum(p.range_min_si) && isNum(p.range_max_si) && p.range_max_si > p.range_min_si; }

/* trip effects of cause C in matrix M, ordered by effect tag (code-unit order) */
function tripEffects(m, causeId) {
  var out = [];
  (m.cells || []).forEach(function (cell) {
    if (cell.cause_id !== causeId || cell.type !== 'trip') return;
    var e = effectById(m, cell.effect_id);
    if (e) out.push(e);
  });
  out.sort(function (a, b) { return byCode(str(a.tag), str(b.tag)); });
  return out;
}
function trigger(c) { return { tag: str(c.tag), condition: str(c.condition), setpoint_si: isNum(c.setpoint_si) ? c.setpoint_si : null }; }
function causeSlice(c) {
  return {
    id: str(c.id), tag: str(c.tag), condition: str(c.condition),
    setpoint_si: isNum(c.setpoint_si) ? c.setpoint_si : null,
    unit: c.unit == null ? null : str(c.unit),
    m: c.m, n: c.n, channels: (c.channels || []).map(str),
    sil: c.sil == null ? null : c.sil, reset: c.reset == null ? null : str(c.reset)
  };
}
function effSlice(e) { return { tag: str(e.tag), action: str(e.action), safe_state: e.safe_state == null ? null : str(e.safe_state) }; }

/* §4.2 combinations: non-empty subsets of channel positions with |S| in K,
 * enumerated by size then lexicographically; letters A = 1 … H = 8. */
function sizesFor(coverage, n) {
  if (coverage === 'none') return [];
  if (coverage === 'single') return [1];
  if (coverage === 'single_double') return n >= 2 ? [1, 2] : [1];
  var a = [], i; for (i = 1; i <= n; i++) a.push(i); return a;
}
function subsetsOfSize(n, k) {
  var out = [], idx = [], i;
  for (i = 0; i < k; i++) idx.push(i);
  if (k === 0 || k > n) return out;
  for (;;) {
    out.push(idx.slice());
    var j = k - 1;
    while (j >= 0 && idx[j] === n - k + j) j--;
    if (j < 0) break;
    idx[j]++;
    for (i = j + 1; i < k; i++) idx[i] = idx[i - 1] + 1;
  }
  return out;
}
function combinationsFor(c, coverage) {
  var n = c.n, out = [];
  sizesFor(coverage, n).forEach(function (k) {
    subsetsOfSize(n, k).forEach(function (positions) {
      out.push({ positions: positions, code: positions.map(function (p) { return LETTERS.charAt(p); }).join('') });
    });
  });
  return out;
}

/* =============================================== §4.1 the source enumeration */

function sourceSets(st) {
  var S = { cells: [], voting: [], sif: [], transitions: [], mode_edges: [], io: [] };
  var sc = st.settings.scope || {}, cov = st.settings.voting_coverage;
  (st.model.matrices || []).forEach(function (m) {
    (m.cells || []).forEach(function (cell) {

      var c = causeById(m, cell.cause_id), e = effectById(m, cell.effect_id);

      if (!sc.ce) return;
      S.cells.push({
        category: 'cells', kind: 'ce_cell', key: m.id + '|' + cell.cause_id + '|' + cell.effect_id,
        source: { matrix_id: m.id, cause_id: cell.cause_id, effect_id: cell.effect_id },
        system_id: m.system_id == null ? null : m.system_id, matrix: m, cause: c, effect: e, cell_type: cell.type
      });
    });
    (m.causes || []).forEach(function (c) {
      if (sc.ce && cov !== 'none' && votingValid(c) && channelsValid(c) && c.n >= 2 && c.n <= LIMITS.channels) {
        combinationsFor(c, cov).forEach(function (cb) {
          S.voting.push({
            category: 'voting', kind: 'voting', key: m.id + '|' + c.id + '|' + cb.code,
            source: { matrix_id: m.id, cause_id: c.id, combination: cb.code },
            system_id: m.system_id == null ? null : m.system_id, matrix: m, cause: c, combo: cb
          });
        });
      }
      if (silRelated(c.sil)) {
        S.sif.push({
          category: 'sif', kind: 'sif_proof', key: m.id + '|' + c.id,
          source: { matrix_id: m.id, cause_id: c.id },
          system_id: m.system_id == null ? null : m.system_id, matrix: m, cause: c
        });
      }
    });
  });
  (st.model.functions || []).forEach(function (f) {
    if (!sc.sequences) return;
    (f.steps || []).forEach(function (s) {
      (s.transitions || []).forEach(function (tr) {
        if (!stepById(f, tr.to)) return;
        var tid = empty(tr.id) ? null : str(tr.id);

  (t.checkpoints || []).forEach(function (cp) { if ('actual_si' in cp) cp.actual_si = null; if ('actual_state' in cp) cp.actual_state = null; });
  if (!(t.checkpoints || []).length) t.checkpoints = checkpointsFor(src);
  return true;
}

function finding(id, target, field, vars) {
  return { id: id, severity: RULE_SEV[id], target: str(target), field: str(field), basis: ruleBasis(id), vars: vars || {}, message: locv(MSG[id], vars || {}) };
}

/* §5.2 sif_proof completeness */
var MISS_TXT = {
  inject: T('injection missing on {list}', 'бракує подання на {list}', 'Aufschaltung fehlt an {list}', 'injectie ontbreekt op {list}', 'injection manquante sur {list}', 'falta inyección en {list}', 'brak podania na {list}'),
  observe: T('observation missing on {list}', 'бракує спостереження за {list}', 'Beobachtung fehlt an {list}', 'observatie ontbreekt op {list}', 'observation manquante sur {list}', 'falta observación en {list}', 'brak obserwacji {list}'),
  reset: T('no reset step', 'немає кроку скидання', 'kein Rücksetzschritt', 'geen resetstap', 'aucune étape de réarmement', 'sin paso de rearme', 'brak kroku kasowania'),
  force: T('a forcing step is present', 'присутній крок форсування', 'ein Forcierschritt ist vorhanden', 'een forceerstap is aanwezig', 'une étape de forçage est présente', 'hay un paso de forzado', 'obecny jest krok wymuszenia'),
  notest: T('no proof test exists', 'випробування повноти немає', 'es gibt keine Wiederholungsprüfung', 'er bestaat geen beproeving', 'aucun essai de preuve n’existe', 'no existe prueba', 'nie istnieje próba pełna'),
  nostimulus: T('no injection step at all', 'немає жодного кроку подання', 'überhaupt kein Aufschaltschritt', 'geen enkele injectiestap', 'aucune étape d’injection', 'ningún paso de inyección', 'brak jakiegokolwiek kroku podania')
};
function proofMissing(st, src, t) {
  if (!t) return [loc(MISS_TXT.notest)];
  var miss = [], steps = t.steps || [];
  function has(action, tag) { return steps.some(function (s) { return s.action === action && str(s.target_tag) === str(tag); }); }
  var noInject = (src.cause.channels || []).map(str).filter(function (ch) { return !has('inject', ch); });
  if (noInject.length) miss.push(locv(MISS_TXT.inject, { list: noInject.join(', ') }));
  /* A cause whose channel list is empty satisfies the per-channel clause with
   * nothing injected. A proof test with no stimulus proves nothing, so one
   * injection step is required of every sequence. */
  else if (!steps.some(function (s2) { return s2.action === 'inject'; })) miss.push(loc(MISS_TXT.nostimulus));
  var noObs = tripEffects(src.matrix, src.cause.id).map(function (e) { return str(e.tag); }).filter(function (tg) { return !has('observe', tg); });
  if (noObs.length) miss.push(locv(MISS_TXT.observe, { list: noObs.join(', ') }));
  if (!steps.some(function (s) { return s.action === 'reset'; })) miss.push(loc(MISS_TXT.reset));
  if (steps.some(function (s) { return s.action === 'force'; })) miss.push(loc(MISS_TXT.force));
  return miss;
}

/* §5.6 FUN-R-050: per bypassed or forced tag, is there a later restore? */
function unrestored(t) {
  var open = {}, order = [];
  (t.steps || []).slice().sort(function (a, b) { return (a.n || 0) - (b.n || 0); }).forEach(function (s) {
    var tag = str(s.target_tag);
    if ((s.action === 'bypass' || s.action === 'force') && tag) { if (!(tag in open)) order.push(tag); open[tag] = true; }
    else if (s.action === 'restore' && tag && (tag in open)) open[tag] = false;
  });
  return order.filter(function (tg) { return open[tg]; });
}

var CATEGORY_TXT = {
  cells: T('cause-and-effect cells', 'комірки матриці', 'Ursache-Wirkungs-Zellen', 'oorzaak-gevolgcellen', 'cellules cause-effet', 'celdas causa-efecto', 'komórki matrycy'),
  voting: T('voting combinations', 'комбінації голосування', 'Voting-Kombinationen', 'stemcombinaties', 'combinaisons de vote', 'combinaciones de votación', 'kombinacje głosowania'),
  sif: T('SIL proof tests', 'випробування повноти SIL', 'SIL-Wiederholungsprüfungen', 'SIL-beproevingen', 'essais de preuve SIL', 'pruebas SIL', 'próby pełne SIL'),
  transitions: T('sequence transitions', 'переходи послідовності', 'Sequenzübergänge', 'sequentieovergangen', 'transitions de séquence', 'transiciones de secuencia', 'przejścia sekwencji'),
  mode_edges: T('mode entries and exits', 'входи та виходи режимів', 'Moduseintritte und -austritte', 'modusingangen en -uitgangen', 'entrées et sorties de mode', 'entradas y salidas de modo', 'wejścia i wyjścia trybów'),
  io: T('IO loop checks', 'перевірки контурів вводу-виводу', 'E/A-Kreisprüfungen', 'I/O-lustests', 'vérifications de boucle E/S', 'verificaciones de lazo de E/S', 'sprawdzenia pętli we/wy')
};

function solve(st) {
  var S = sourceSets(st), srcs = allSources(S), findings = [], i;
  /* §5 opening sentence: one finding per (rule, target). Several rules walk
   * model rows rather than sources, and two rows can share one target key, so
   * the guard sits at the push and not at one call site. */
  var findingSeen = {};
  findings.push = function (f) {
    var k = f.id + '\u0000' + f.target;
    if (Object.prototype.hasOwnProperty.call(findingSeen, k)) return findings.length;
    findingSeen[k] = 1;
    return Array.prototype.push.call(findings, f);
  };
  var sc = st.settings.scope || {};
  var testById = {}, byKey = {};
  (st.tests || []).forEach(function (t) { testById[t.id] = t; });

  /* --- 5.1 model integrity ------------------------------------------------ */
  (st.model.io || []).forEach(function (p) {
    if ((p.signal_type === 'AI' || p.signal_type === 'AO') && !ioRangeValid(p))
      findings.push(finding('FUN-R-001', p.tag, 'model.io[].range_max_si', { t: str(p.tag), k: str(p.signal_type) }));
    if (p.signal_type === 'bus' && sc.loop) findings.push(finding('FUN-R-045', p.tag, 'model.io[].signal_type', { t: str(p.tag) }));
  });
  var ioTags = {}; (st.model.io || []).forEach(function (p) { ioTags[str(p.tag)] = 1; });
  var missingTags = {};
  (st.model.matrices || []).forEach(function (m) {
    (m.causes || []).forEach(function (c) {
      var key = m.id + '|' + c.id;
      if (!votingValid(c)) findings.push(finding('FUN-R-002', key, 'causes[].m', { t: str(c.tag) || key, m: str(c.m), n: str(c.n) }));
      else {
        if (!channelsValid(c)) findings.push(finding('FUN-R-003', key, 'causes[].channels', { t: str(c.tag) || key, n: c.n, c: (c.channels || []).length }));
        else if (c.n > LIMITS.channels && sc.ce && st.settings.voting_coverage !== 'none')
          findings.push(finding('FUN-R-008', key, 'causes[].n', { t: str(c.tag) || key, n: c.n }));
      }
      if ((st.model.io || []).length) (c.channels || []).forEach(function (ch) { if (!ioTags[str(ch)]) missingTags[str(ch)] = 'causes[].channels'; });
    });
    if ((st.model.io || []).length) (m.effects || []).forEach(function (e) { if (!ioTags[str(e.tag)]) missingTags[str(e.tag)] = 'effects[].tag'; });
  });
  Object.keys(missingTags).sort(byCode).forEach(function (tg) { findings.push(finding('FUN-R-004', tg, missingTags[tg], { t: tg })); });
  (st.model.functions || []).forEach(function (f) {
    (f.steps || []).forEach(function (s) {
      (s.transitions || []).forEach(function (tr) {
        if (!stepById(f, tr.to)) findings.push(finding('FUN-R-005', f.id + '|' + (empty(tr.id) ? str(s.id) + '>' + str(tr.to) : str(tr.id)), 'steps[].transitions[].to', { t: empty(tr.id) ? str(s.id) + '>' + str(tr.to) : str(tr.id), to: str(tr.to), f: str(f.id) }));
      });
    });
  });

  /* --- ids: FUN-R-006 underivable, FUN-R-007 collision -------------------- */
  var claims = {};
  srcs.forEach(function (src) {
    var ids = idParts(src);
    if (!ids.ok) { findings.push(finding('FUN-R-006', src.key, 'tests[].id', { t: src.key })); src.__noId = true; return; }
    src.__id = ids.id;
    (claims[ids.id] = claims[ids.id] || []).push('source:' + src.category + ':' + src.key);
    for (var d = 0; d < (src.__dup || 0); d++) (claims[ids.id] = claims[ids.id] || []).push('source:' + src.category + ':' + src.key + '#' + (d + 2));
  });
  (st.tests || []).forEach(function (t) { if (t.kind === 'manual') (claims[t.id] = claims[t.id] || []).push('manual:' + t.id); });
  var collisions = Object.keys(claims).filter(function (k) { return claims[k].length > 1; }).sort(byCode);
  collisions.forEach(function (k) { findings.push(finding('FUN-R-007', k, 'tests[].id', { t: k })); });

  /* --- per-test analysis --------------------------------------------------- */
  var liveKeys = {}; srcs.forEach(function (s) { liveKeys[s.category + '::' + s.key] = 1; byKey[s.category + '::' + s.key] = s; });
  var retestsOf = {};
  (st.tests || []).forEach(function (t) { if (!empty(t.retest_of)) (retestsOf[str(t.retest_of)] = retestsOf[str(t.retest_of)] || []).push(t); });

  var info = {};
  (st.tests || []).forEach(function (t) {
    var cat = KIND_CATEGORY[t.kind] || null;
    var key = cat ? cat + '::' + testSourceKey(t) : null;
    var resolved = t.kind === 'manual' ? null : resolveTestSource(st, t);
    var inSet = !!(key && liveKeys[key]);
    var executed = t.result === 'pass' || t.result === 'fail';
    var hidden = t.kind !== 'manual' && !inSet && cat && categoryExcluded(st, cat) && !executed;
    var curHash = resolved ? hashOf(hashSliceFor(resolved)) : null;
    var stale = t.kind !== 'manual' && !!resolved && (t.model_hash == null || t.model_hash !== curHash);
    var contradicts = t.kind !== 'manual' && !!resolved && canonical(t.expected) !== canonical(expectedFor(resolved));
    info[t.id] = { test: t, category: cat, key: key, resolved: resolved, inSet: inSet, executed: executed, hidden: hidden, stale: stale, contradicts: contradicts, current_hash: curHash, rules: {} };
  });
  function fire(t, id, field, vars) {
    var inf = info[t.id];
    if (inf) inf.rules[id] = true;
    findings.push(finding(id, t.id, field, vars));
  }
  (st.tests || []).forEach(function (t) {
    var inf = info[t.id];
    if (inf.hidden) return;
    if (inf.stale) fire(t, 'FUN-R-020', 'tests[].model_hash', { t: t.id, a: str(t.model_hash) || '—', b: str(inf.current_hash) });
    if (inf.contradicts && t.result !== 'pass') fire(t, 'FUN-R-021', 'tests[].expected', { t: t.id });
    if (inf.contradicts && t.result === 'pass') fire(t, 'FUN-R-022', 'tests[].expected', { t: t.id });
    if (t.kind !== 'manual' && !inf.inSet) fire(t, 'FUN-R-023', 'tests[].source', { t: t.id });
    if (t.result === 'pass' && empty(t.evidence_ref)) fire(t, 'FUN-R-030', 'evidence_ref', { t: t.id });
    if (t.result === 'fail' && empty(t.punch_ref) && !(retestsOf[t.id] || []).length) fire(t, 'FUN-R-031', 'punch_ref', { t: t.id });
    if (!empty(t.retest_of)) {
      var orig = testById[str(t.retest_of)];
      if (!orig || orig.result !== 'fail') fire(t, 'FUN-R-032', 'retest_of', { t: t.id, o: str(t.retest_of) });
    }
    if (silRelated(t.sil) && inf.executed && empty(t.witness)) fire(t, 'FUN-R-033', 'witness', { t: t.id });
    if (inf.executed && (empty(t.executed_at) || empty(t.executed_by))) fire(t, 'FUN-R-034', 'executed_at', { t: t.id });
    if (t.result === 'deferred' && empty(t.deferral_reason)) fire(t, 'FUN-R-035', 'deferral_reason', { t: t.id });
    if (t.kind === 'loop') {
      var pt = inf.resolved ? inf.resolved.point : ioByTag(st, (t.source || {}).tag);
      var lm = loopMath(t, pt);
      inf.loop = lm;
      var analogue = lm.kind === 'analogue';
      var badTol = analogue && !(isNum(t.tolerance_pct) && t.tolerance_pct > 0);
      if (badTol) fire(t, 'FUN-R-043', 'tolerance_pct', { t: t.id });
      var outside = lm.rows.filter(function (r) { return r.recorded && r.within === false; }).length;
      var unrec = lm.rows.filter(function (r) { return !r.recorded; }).length;
      if (t.result === 'pass' && !badTol && lm.has_expected && outside > 0) fire(t, 'FUN-R-040', 'checkpoints[].actual_si', { t: t.id, n: outside });
      if (t.result === 'pass' && unrec > 0) fire(t, 'FUN-R-041', 'checkpoints[]', { t: t.id, n: unrec });
      if (t.result === 'fail' && !badTol && lm.has_expected && lm.rows.length && unrec === 0 && outside === 0) fire(t, 'FUN-R-042', 'result', { t: t.id });
      if (analogue && isNum(t.tolerance_pct) && t.tolerance_pct > 0) {
        var acc = st.io_accuracy ? st.io_accuracy[str((t.source || {}).tag)] : null;
        if (isNum(acc) && acc > 0 && t.tolerance_pct < acc) fire(t, 'FUN-R-044', 'tolerance_pct', { t: t.id, tol: nfmt(t.tolerance_pct, 2), acc: nfmt(acc, 2) });
      }
    }
    var un = unrestored(t);
    if (un.length) fire(t, 'FUN-R-050', 'steps[]', { t: t.id, tags: un.join(', ') });
  });

  /* --- 5.2 coverage gaps --------------------------------------------------- */
  var testsBySourceKey = {};
  (st.tests || []).forEach(function (t) {
    var cat = KIND_CATEGORY[t.kind];
    if (!cat) return;
    var k = cat + '::' + testSourceKey(t);
    (testsBySourceKey[k] = testsBySourceKey[k] || []).push(t);
  });
  var GAP_RULE = { cells: 'FUN-R-010', voting: 'FUN-R-011', transitions: 'FUN-R-012', mode_edges: 'FUN-R-013', io: 'FUN-R-014' };
  var GAP_FIELD = { cells: 'cells[]', voting: 'causes[]', transitions: 'steps[].transitions[]', mode_edges: 'modes[]', io: 'model.io[]' };
  srcs.forEach(function (src) {
    var list = testsBySourceKey[src.category + '::' + src.key] || [];
    if (src.category === 'sif') {
      var pts = list.filter(function (t) { return t.kind === 'sif_proof'; });
      var complete = pts.some(function (t) { return proofMissing(st, src, t).length === 0; });
      if (!complete) {
        var miss = pts.length ? proofMissing(st, src, pts[0]) : [loc(MISS_TXT.notest)];
        findings.push(finding('FUN-R-015', src.key, pts.length ? 'tests[].steps' : 'causes[].sil', { t: str(src.cause.tag) || src.key, s: str(src.cause.sil), miss: miss.join('; ') }));
      }
      return;
    }
    if (!list.length) findings.push(finding(GAP_RULE[src.category], src.key, GAP_FIELD[src.category], { t: src.key }));
  });
  (st.model.functions || []).forEach(function (f) {
    if (!silRelated(f.sil)) return;
    var locks = (f.interlocks || []).map(str);
    var ok = (st.model.matrices || []).some(function (m) {
      return (m.causes || []).some(function (c) { return silRelated(c.sil) && (locks.indexOf(str(c.id)) >= 0 || locks.indexOf(str(m.id)) >= 0); });
    });
    if (!ok) findings.push(finding('FUN-R-016', f.id, 'functions[].interlocks', { t: str(f.id), s: str(f.sil) }));
  });

  /* --- 5.6 flags and excluded categories ---------------------------------- */
  (st.__flags || []).forEach(function (fl) {
    if (!fl || typeof fl !== 'object') return;
    var kind = str(fl.target_kind), id = str(fl.target_id);
    (st.tests || []).forEach(function (t) {
      if (info[t.id].hidden) return;
      var s = t.source || {}, hit = false;
      if (kind === 'functional_test' && id === t.id) hit = true;
      else if (kind === 'cause_effect' && id && id === str(s.matrix_id)) hit = true;
      else if (kind === 'control_function' && id && id === str(s.function_id)) hit = true;
      else if (kind === 'io_point' && id && id === str(s.tag)) hit = true;
      if (hit) findings.push(finding('FUN-R-052', t.id, 'tests[].source', { t: t.id, reason: str(fl.reason) }));
    });
  });
  CATEGORIES.forEach(function (cat) { if (categoryExcluded(st, cat)) findings.push(finding('FUN-R-060', cat, 'settings', { t: loc(CATEGORY_TXT[cat]) })); });

  /* --- §4.7 valid pass and coverage --------------------------------------- */
  var VP_RULES = ['FUN-R-022', 'FUN-R-030', 'FUN-R-040', 'FUN-R-041', 'FUN-R-050'];
  (st.tests || []).forEach(function (t) {
    var inf = info[t.id];
    inf.valid_pass = t.result === 'pass' && !inf.stale && !VP_RULES.some(function (r) { return inf.rules[r]; });
  });
  var coverage = {}, sumTotal = 0, sumCovered = 0, sumExecuted = 0, segments = {};

      var ex = tests.some(function (t) { return info[t.id].executed; });
      total += w;
      if (vp) covered += w;
      if (ex) executed += w;
      if (vp) seg.valid_pass += w;
      else if (tests.some(function (t) { return t.result === 'fail'; })) seg.fail += w;
      else if (tests.some(function (t) { return t.result === 'pass'; })) seg.invalid_pass += w;
      else if (tests.some(function (t) { return t.result === 'deferred'; })) seg.deferred += w;

  var B = findings.filter(function (f) { return f.severity === 'blocker'; }).length;
  var Ma = findings.filter(function (f) { return f.severity === 'major'; }).length;
  var Mi = findings.filter(function (f) { return f.severity === 'minor'; }).length;
  var I = findings.filter(function (f) { return f.severity === 'info'; }).length;
  var verdict;
  if (sumTotal === 0 && !(st.tests || []).length) verdict = 'empty';
  else if (B >= 1) verdict = 'blocked';
  else if (Ma >= 1 || sumCovered < sumTotal) verdict = 'open';
  else if (Mi >= 1) verdict = 'complete_with_remarks';
  else verdict = 'complete';

  var SEV_ORDER = { blocker: 0, major: 1, minor: 2, info: 3 };
  findings.sort(function (a, b) { return (SEV_ORDER[a.severity] - SEV_ORDER[b.severity]) || byCode(a.id, b.id) || byCode(a.target, b.target); });

   * is copied from a failed one, so neither is counted there. */
  var counts = { generated: {}, by_kind: {}, result: {} };
  KINDS.forEach(function (k) { counts.generated[k] = 0; counts.by_kind[k] = 0; });
  RESULTS.forEach(function (r) { counts.result[r] = 0; });

  });

  return {
    sources: S, source_list: srcs, info: info, findings: findings, coverage: coverage, overall: overall,

  intro: T('Every test below was generated from the control model in the project package. Its expected result is computed from that model and carries a hash of the model slice it came from, so a test written against a superseded matrix, sequence or range is reported rather than counted.', 'Кожне випробування нижче створено з моделі керування в проєктному пакеті. Очікуваний результат обчислено з тієї моделі і супроводжено хешем зрізу, тож випробування за застарілою матрицею, послідовністю чи діапазоном позначається, а не зараховується.', 'Jede Prüfung unten wurde aus dem Steuerungsmodell im Projektpaket erzeugt. Ihr Sollergebnis stammt aus diesem Modell und trägt einen Hash des Modellausschnitts, sodass eine Prüfung gegen eine überholte Matrix, Sequenz oder Messspanne gemeldet statt gezählt wird.', 'Elke test hieronder is gegenereerd uit het besturingsmodel in het projectpakket. Het verwachte resultaat komt uit dat model en draagt een hash van het modelfragment, zodat een test tegen een achterhaalde matrix, sequentie of bereik wordt gemeld in plaats van geteld.', 'Chaque essai ci-dessous a été généré à partir du modèle de commande du dossier de projet. Son résultat attendu vient de ce modèle et porte une empreinte de la portion utilisée : un essai écrit contre une matrice, une séquence ou une étendue périmée est signalé au lieu d’être compté.', 'Cada prueba siguiente se generó del modelo de control del paquete de proyecto. Su resultado esperado se calcula de ese modelo y lleva un hash del fragmento usado, de modo que una prueba escrita contra una matriz, secuencia o rango superado se señala en vez de contarse.', 'Każda próba poniżej została utworzona z modelu sterowania w pakiecie projektu. Jej wynik oczekiwany pochodzi z tego modelu i niesie skrót użytego fragmentu, więc próba napisana dla nieaktualnej matrycy, sekwencji lub zakresu jest zgłaszana, a nie liczona.'),
  method: T('A test counts as coverage only when it is a valid pass: result pass, hash matching the current model, an evidence reference present, every loop checkpoint recorded and inside tolerance, and every bypass restored.', 'Випробування зараховується до покриття лише як дійсно пройдене: результат «пройдено», хеш відповідає поточній моделі, є посилання на доказ, усі контрольні точки контуру записані та в межах допуску, усі байпаси відновлені.', 'Eine Prüfung zählt nur als Abdeckung, wenn sie gültig bestanden ist: Ergebnis bestanden, Hash passend zum aktuellen Modell, Nachweisverweis vorhanden, alle Kreis-Prüfpunkte erfasst und in der Toleranz, jeder Bypass zurückgenommen.', 'Een test telt alleen als dekking wanneer hij geldig is geslaagd: resultaat geslaagd, hash passend bij het huidige model, bewijsverwijzing aanwezig, elk luscontrolepunt vastgelegd en binnen de tolerantie, en elke bypass hersteld.', 'Un essai ne compte comme couverture que s’il est une réussite valide : résultat réussi, empreinte conforme au modèle actuel, référence de preuve présente, chaque point de boucle relevé et dans la tolérance, et chaque bypass rétabli.', 'Una prueba cuenta como cobertura solo si es un aprobado válido: resultado superado, hash acorde al modelo actual, referencia de evidencia presente, cada punto de lazo registrado y dentro de tolerancia, y cada bypass restituido.', 'Próba liczy się do pokrycia tylko jako ważne zaliczenie: wynik zaliczony, skrót zgodny z bieżącym modelem, obecne odniesienie do dowodu, każdy punkt kontrolny pętli zapisany i w tolerancji oraz każdy bypass przywrócony.')

  var st = state, rows = [];
  function add(group, label, value) { rows.push({ group: loc(group), label: loc(label), text: value }); }
  function tally(list) {
    var order = [], seen = {};
    list.forEach(function (k) { if (!seen[k]) { seen[k] = 0; order.push(k); } seen[k]++; });
    return order.length ? order.map(function (k) { return k + ' ' + seen[k]; }).join(', ') : loc(ANN.none_txt);
  }
  add(ANN.g_project, UI.project, st.meta.project_name || '—');
  add(ANN.g_project, UI.reference, st.meta.project_reference || '—');

  var sc = st.settings.scope || {}, inScope = [];
  if (sc.ce) inScope.push(loc(CATEGORY_TXT.cells));
  if (sc.sequences) inScope.push(loc(CATEGORY_TXT.transitions));

    loc(CATEGORY_TXT.transitions) + ' ' + phaseLabel(st.settings.phase_sequence),
    loc(CATEGORY_TXT.io) + ' ' + phaseLabel(st.settings.phase_loop),

  var ms = st.model.matrices || [], fns = st.model.functions || [], io = st.model.io || [];
  var nc = 0, ne = 0, ncell = 0, nsil = 0;
  ms.forEach(function (m) {

    ncell += (m.cells || []).filter(function (c) { return CELL_TYPES.indexOf(c.type) >= 0; }).length;
    nsil += (m.causes || []).filter(function (c) { return silRelated(c.sil); }).length;
  });
  add(ANN.g_model, ANN.matrices, String(ms.length));
  add(ANN.g_model, ANN.causes, String(nc));
  add(ANN.g_model, ANN.effects, String(ne));
  add(ANN.g_model, ANN.cells, String(ncell));
  add(ANN.g_model, ANN.sil_causes, String(nsil));
  var nst = 0, ntr = 0, nmd = 0;
  fns.forEach(function (f) {
    nst += (f.steps || []).length; nmd += (f.modes || []).length;
    (f.steps || []).forEach(function (s) { ntr += (s.transitions || []).length; });
  });
  add(ANN.g_model, ANN.functions, String(fns.length));
  add(ANN.g_model, ANN.steps, String(nst));
  add(ANN.g_model, ANN.transitions, String(ntr));
  add(ANN.g_model, ANN.modes, String(nmd));
  add(ANN.g_model, ANN.io_points, tally(io.map(function (p) { return str(p.signal_type); })));
  add(ANN.g_model, ANN.io_acc, Object.keys(st.io_accuracy || {}).length + ' / ' + io.length);
  var ts = st.tests || [];
  add(ANN.g_register, ANN.tests_total, String(ts.length));
  add(ANN.g_register, ANN.tests_kind, tally(ts.map(function (t) { return loc(KIND_TXT[t.kind] || { en: str(t.kind) }); })));
  add(ANN.g_register, ANN.tests_result, tally(ts.map(function (t) { return loc(RESULT_TXT[t.result] || { en: str(t.result) }); })));
  return rows;
}

function dgcRecord() {
  var st = state;
  if (!(st.model.matrices || []).length && !(st.model.functions || []).length && !(st.model.io || []).length && !(st.tests || []).length) return null;
  var R = solve(st);
  var hashes = {}, loop = {};
  (st.tests || []).forEach(function (t) {
    var inf = R.info[t.id];
    if (inf && inf.current_hash) hashes[t.id] = inf.current_hash;
    if (t.kind === 'loop' && inf && inf.loop && inf.loop.kind === 'analogue') {
      loop[t.id] = {
        expected_si: inf.loop.rows.map(function (r) { return r.expected_si; }),
        deviation_si: inf.loop.rows.map(function (r) { return r.deviation_si; }),
        deviation_pct: inf.loop.rows.map(function (r) { return r.deviation_pct; }),
        within: inf.loop.rows.map(function (r) { return r.within; }),
        tolerance_abs: inf.loop.tol_abs, span: inf.loop.span
      };
    }
  });
  var cov = {};
  CATEGORIES.forEach(function (c) { cov[c] = { total: R.coverage[c].total, covered: R.coverage[c].covered, executed: R.coverage[c].executed, pct: R.coverage[c].pct }; });
  cov.overall = { total: R.overall.total, covered: R.overall.covered, executed: R.overall.executed, pct: R.overall.pct };
  return {
    schema: 'tools.petrov.re/calculation-record/v1', tool: 'functionaltest',
    inputs: stateForExport(),
    outputs: {
      verdict: R.verdict, coverage: cov,
      counts: { sources: (function () { var o = {}; CATEGORIES.forEach(function (c) { o[c] = R.sources[c].length; }); o.total = R.overall.total; return o; })(), generated: R.counts.generated, by_kind: R.counts.by_kind, result: R.counts.result },
      hashes: hashes, loop: loop,
      findings: R.findings.map(function (f) { return { id: f.id, severity: f.severity, target: f.target, field: f.field, message: f.message, basis: f.basis }; }),
      findings_count: R.findings_count,
      sil_functions: R.sil_functions
    },
    units: {
      coverage: '%', counts: 'count',
      loop: 'expected and deviation in the SI unit of the point range; deviation also in % of span',
      hashes: 'FNV-1a 32 hexadecimal'
    },
    model: {
      equations: [
        'expected value x_p = LRV + (p/100) (URV - LRV), p in {0,25,50,75,100}',
        'tolerance t = (tolerance_pct/100) (URV - LRV); deviation d_p = actual - x_p; e_p = 100 d_p / span',
        'within tolerance when |d_p| <= t + 1e-9 span',
        'signal 4-20 mA: I_p = 0.004 + 0.016 (p/100) A; 0-10 V: U_p = 10 (p/100) V',
        'voting combination S trips when |S| >= m',
        'model_hash = fnv1a32(canonical JSON of the model slice the test was generated from)',
        'coverage_pct = 100 covered / total per category and over all six categories'
      ],
      ranges: [
        'at most 20 matrices, 200 causes, 200 effects, 2000 cells, 50 functions, 500 steps, 2000 IO points, 8 voting channels, 5000 tests',
        'tolerance 0 < tolerance_pct <= 10 % of span'
      ],
      notes: [
        'functionaltest author method rev 2026-09-22.1',
        'Phase vocabulary FAT/FIT/SAT/SIT from IEC 62381:2024 cl. 5-8; loop check from IEC 62382:2024; validation from IEC 61511-1:2016 cl. 15.',
        'The five-point injection, the tolerance-from-accuracy rule, the voting combination scheme, the bypass-restoration rule and the proof-test completeness predicate are author method.',
        'A test counts as coverage only when it is a valid pass (result pass, not stale, no blocking record finding).'
      ]
    },
    warnings: R.findings.filter(function (f) { return f.severity === 'blocker' || f.severity === 'major'; }).map(function (f) { return f.id + ': ' + f.message; })
  };
}

/* ------------------------------------------------------------- the figures */
/* One drawing function per figure, used on screen and, at 2x, in the report. */

function themeColours() {
  var cs = null;
  try { cs = getComputedStyle(document.documentElement); } catch (e) { cs = null; }
  function g(n, d) { try { return (cs && cs.getPropertyValue(n).trim()) || d; } catch (e) { return d; } }
  return {
    muted: g('--muted', '#667085'), line: g('--line', '#dfe4ec'), text: g('--fg', '#111827'),
    font: g('--font', 'system-ui, sans-serif'),
    ok: g('--ok', '#15803d'), bad: g('--bad', '#b91c1c'), warn: g('--warn', '#b45309'), accent: g('--accent', '#2563eb')
  };
}
function seriesColour(i) { try { return DiagramUI.series(i); } catch (e) { return ['#2563eb', '#b45309', '#15803d', '#b91c1c', '#7c3aed', '#0891b2'][i % 6]; } }

var SEG_ORDER = ['valid_pass', 'fail', 'invalid_pass', 'deferred', 'not_tested', 'no_test'];
function segColours(C) { return { valid_pass: C.ok, fail: C.bad, invalid_pass: C.warn, deferred: '#9aa4b2', not_tested: '#c3cad6', no_test: '#e3e8ef' }; }
function segLabel(k) { return loc({ valid_pass: UI.legend_vp, fail: UI.legend_fail, invalid_pass: UI.legend_ip, deferred: UI.legend_def, not_tested: UI.legend_nt, no_test: UI.legend_no }[k]); }

function drawCoverage(ctx, w, h, R, k) {
  k = k || 1;
  var C = themeColours(), SC = segColours(C);
  ctx.clearRect(0, 0, w, h);
  var cats = CATEGORIES.filter(function (c) { return R.coverage[c].total > 0; });
  ctx.font = (12 * k) + 'px ' + C.font;
  if (!cats.length) { ctx.fillStyle = C.muted; ctx.fillText('—', 8 * k, 20 * k); return; }
  var padR = 96 * k, padT = 10 * k, padB = 34 * k;
  var padL = Math.min(w * 0.42, 10 * k + Math.max.apply(null, cats.map(function (c) { return ctx.measureText(loc(CATEGORY_TXT[c])).width; })));
  var rowH = Math.max(16 * k, Math.min(30 * k, (h - padT - padB) / cats.length));
  var barH = rowH * 0.62;
  var maxTotal = Math.max.apply(null, cats.map(function (c) { return R.coverage[c].total; }));
  var plotW = Math.max(20 * k, w - padL - padR);
  cats.forEach(function (cat, i) {
    var y = padT + i * rowH, seg = R.segments[cat], total = R.coverage[cat].total, x = padL;
    ctx.fillStyle = C.text; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(loc(CATEGORY_TXT[cat]), padL - 8 * k, y + barH / 2);
    SEG_ORDER.forEach(function (sk) {
      var n = seg[sk]; if (!n) return;
      var wpx = plotW * (n / maxTotal);
      ctx.fillStyle = SC[sk];
      ctx.fillRect(x, y, wpx, barH);
      x += wpx;
    });
    ctx.strokeStyle = C.line; ctx.lineWidth = 1 * k;
    ctx.strokeRect(padL, y, plotW * (total / maxTotal), barH);
    ctx.fillStyle = C.muted; ctx.textAlign = 'left';
    var pct = R.coverage[cat].pct;
    ctx.fillText(R.coverage[cat].covered + '/' + total + ' · ' + (pct == null ? '—' : nfmt(pct, 1) + ' %'), padL + plotW * (total / maxTotal) + 6 * k, y + barH / 2);
  });
  /* legend along the bottom, one entry per segment class actually drawn */
  var ly = padT + cats.length * rowH + 12 * k, lx = padL;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  SEG_ORDER.forEach(function (sk) {
    var used = cats.some(function (c) { return R.segments[c][sk] > 0; });
    if (!used) return;
    var lab = segLabel(sk), tw = ctx.measureText(lab).width + 22 * k;
    if (lx + tw > w - 4 * k) { lx = padL; ly += 15 * k; }
    ctx.fillStyle = SC[sk]; ctx.fillRect(lx, ly - 5 * k, 10 * k, 10 * k);
    ctx.fillStyle = C.muted; ctx.fillText(lab, lx + 14 * k, ly);
    lx += tw;
  });
}

function loopSeries(st, R) {
  var out = [];
  (st.tests || []).forEach(function (t) {
    if (t.kind !== 'loop') return;
    var inf = R.info[t.id];
    if (!inf || !inf.loop || inf.loop.kind !== 'analogue') return;
    if (!inf.loop.rows.some(function (r) { return r.recorded; })) return;
    out.push({ id: t.id, tag: str((t.source || {}).tag), tol: isNum(t.tolerance_pct) ? t.tolerance_pct : null, rows: inf.loop.rows });
  });
  return out;
}

function drawLoopDeviation(ctx, w, h, series, k) {
  k = k || 1;
  var C = themeColours();
  ctx.clearRect(0, 0, w, h);
  ctx.font = (12 * k) + 'px ' + C.font;
  if (!series.length) { ctx.fillStyle = C.muted; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('—', 8 * k, 8 * k); return; }
  var padL = 54 * k, padR = 14 * k, padT = 12 * k, padB = 44 * k;
  var lim = 0.001;
  series.forEach(function (s) {
    s.rows.forEach(function (r) { if (r.recorded && isNum(r.deviation_pct)) lim = Math.max(lim, Math.abs(r.deviation_pct)); });
    if (s.tol != null) lim = Math.max(lim, s.tol);
  });
  lim = lim * 1.25;
  var X = function (p) { return padL + (w - padL - padR) * (p / 100); };
  var Y = function (v) { return padT + (h - padT - padB) * (1 - (v + lim) / (2 * lim)); };
  ctx.strokeStyle = C.line; ctx.lineWidth = 1 * k;
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, h - padB); ctx.lineTo(w - padR, h - padB); ctx.stroke();
  ctx.strokeStyle = C.line; ctx.setLineDash([2 * k, 3 * k]);
  ctx.beginPath(); ctx.moveTo(padL, Y(0)); ctx.lineTo(w - padR, Y(0)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = C.muted; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  [-lim, -lim / 2, 0, lim / 2, lim].forEach(function (v) { ctx.fillText(nfmt(v, 2), padL - 6 * k, Y(v)); });
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  PCTS.forEach(function (p) { ctx.fillText(String(p), X(p), h - padB + 6 * k); });
  ctx.fillText('%', X(50), h - padB + 22 * k);
  series.forEach(function (s, i) {
    var col = seriesColour(i);
    if (s.tol != null) {
      ctx.strokeStyle = col; ctx.globalAlpha = 0.45; ctx.setLineDash([5 * k, 4 * k]); ctx.lineWidth = 1 * k;
      [s.tol, -s.tol].forEach(function (v) { ctx.beginPath(); ctx.moveTo(padL, Y(v)); ctx.lineTo(w - padR, Y(v)); ctx.stroke(); });
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = col; ctx.lineWidth = 2 * k;
    ctx.beginPath();
    var started = false;
    s.rows.forEach(function (r) {
      if (!r.recorded || !isNum(r.deviation_pct)) return;
      var x = X(r.p_pct), y = Y(r.deviation_pct);
      if (started) ctx.lineTo(x, y); else { ctx.moveTo(x, y); started = true; }
    });
    if (started) ctx.stroke();
    s.rows.forEach(function (r) {
      if (!r.recorded || !isNum(r.deviation_pct)) return;
      var x = X(r.p_pct), y = Y(r.deviation_pct);
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, 3.2 * k, 0, 6.2832); ctx.fill();
      if (r.within === false) { ctx.strokeStyle = C.bad; ctx.lineWidth = 2 * k; ctx.beginPath(); ctx.arc(x, y, 6 * k, 0, 6.2832); ctx.stroke(); }
    });
  });
  var lx = padL, ly = h - 10 * k;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  series.forEach(function (s, i) {
    var lab = s.tag || s.id, tw = ctx.measureText(lab).width + 22 * k;
    if (lx + tw > w - 4 * k) return;
    ctx.fillStyle = seriesColour(i); ctx.fillRect(lx, ly - 5 * k, 10 * k, 10 * k);
    ctx.fillStyle = C.muted; ctx.fillText(lab, lx + 14 * k, ly);
    lx += tw;
  });
}

function offscreen(w, h) {
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.style.width = (w / 2) + 'px'; c.style.height = (h / 2) + 'px';
  return c;
}

/* --------------------------------------------------------- report profile */

function reportProfile(rec, ctx) {
  var st = state, R = solve(st), figs = [];
  if (ctx && typeof ctx.figure === 'function') {
    try {
      var c1 = offscreen(1000, Math.max(260, 120 + 60 * CATEGORIES.filter(function (c) { return R.coverage[c].total > 0; }).length));
      drawCoverage(c1.getContext('2d'), c1.width, c1.height, R, 2);
      var f1 = ctx.figure(c1, { caption: loc(UI.fig1), alt: loc(UI.fig1) });
      if (f1) figs.push(f1);
      var ser = loopSeries(st, R);
      if (ser.length) {
        var c2 = offscreen(1000, 520);
        drawLoopDeviation(c2.getContext('2d'), c2.width, c2.height, ser, 2);
        var f2 = ctx.figure(c2, { caption: loc(UI.fig2), alt: loc(UI.fig2) });
        if (f2) figs.push(f2);
      }
    } catch (e) { figs = []; }
  }
  var checks = R.findings.map(function (f) {
    return {
      status: f.severity === 'blocker' ? 'fail' : f.severity === 'major' ? 'attention' : 'info',
      title: f.id + ' — ' + f.target,
      detail: f.message,
      actual: loc(SEV_TXT[f.severity]),

  });

    title: loc(UI.report_title),
    project: [

      { label: loc(UI.reference), value: st.meta.project_reference || '—' },

        { label: loc(UI.io_checked), text: R.coverage.io.covered + ' / ' + R.coverage.io.total },
        { label: loc(UI.sil_proven), text: R.sil_functions.proven + ' / ' + R.sil_functions.total }
      ],
      conclusion: loc(UI.findings_count) + ': ' + R.findings_count.blocker + ' / ' + R.findings_count.major + ' / ' + R.findings_count.minor
    },

    notes: [loc(ANN.std_note)]

}

/* Which leaves of the expected object moved, named rather than dumped. */
function diffExpected(a, b) {
  if (b == null) return '—';
  var out = [];
  function walk(p, x, y) {
    if (canonical(x) === canonical(y)) return;
    if (x && y && typeof x === 'object' && typeof y === 'object' && !Array.isArray(x) && !Array.isArray(y)) {
      uniq(Object.keys(x).concat(Object.keys(y))).sort(byCode).forEach(function (k) { walk(p ? p + '.' + k : k, x[k], y[k]); });
      return;
    }
    out.push((p || '—') + ': ' + canonical(x) + ' → ' + canonical(y));
  }
  walk('', a, b);
  return out.length ? out.join('; ') : '—';
}

def js_num(x):
    """ECMAScript Number.prototype.toString, so the canonical JSON this script
    hashes is byte-identical to the one the page hashes."""
    if isinstance(x, bool):
        return "true" if x else "false"
    f = float(x)
    if f != f or f in (float("inf"), float("-inf")):
        return "null"
    if f == 0:
        return "0"
    neg = f < 0
    a = abs(f)
    r = repr(a)
    if "e" in r or "E" in r:
        mant, ex = r.lower().split("e")
        ex = int(ex)
    else:
        mant, ex = r, 0
    if "." in mant:
        ip, fp = mant.split(".")
    else:
        ip, fp = mant, ""
    raw = ip + fp
    stripped = raw.lstrip("0")
    lead = len(raw) - len(stripped)
    n = len(ip) + ex - lead
    digits = stripped.rstrip("0") or "0"
    k = len(digits)
    if k <= n <= 21:
        out = digits + "0" * (n - k)
    elif 0 < n <= 21:
        out = digits[:n] + "." + digits[n:]
    elif -6 < n <= 0:
        out = "0." + "0" * (-n) + digits
    else:
        head = digits[0] + ("." + digits[1:] if k > 1 else "")
        e = n - 1
        out = head + "e" + ("+" if e >= 0 else "-") + str(abs(e))
    return ("-" + out) if neg else out

    """JSON with no whitespace, keys sorted by UTF-16 code units, absent as null."""
    if v is None:
        return "null"
    if isinstance(v, bool):
        return "true" if v else "false"
    if isinstance(v, (int, float)):
        return js_num(v)
    if isinstance(v, str):
        return _json.dumps(v, ensure_ascii=False)
    if isinstance(v, (list, tuple)):
        return "[" + ",".join(canonical(x) for x in v) + "]"
    if isinstance(v, dict):
        ks = sorted(v.keys(), key=_u16key)
        return "{" + ",".join(_json.dumps(k, ensure_ascii=False) + ":" + canonical(v[k]) for k in ks) + "}"
    return "null"


def fnv1a32(text):
    h = 0x811C9DC5

    return "%08x" % h

def subsets_of_size(n, k):
    if k <= 0 or k > n:
        return []
    out = []
    idx = list(range(k))
    while True:
        out.append(list(idx))
        j = k - 1
        while j >= 0 and idx[j] == n - k + j:

        if j < 0:

        idx[j] += 1
        for i in range(j + 1, k):

                continue

def resolve_test_source(model, t):
    s = t.get("source") or {}
    k = t.get("kind")
    if k == "ce_cell":
        m = by_id(model.get("matrices"), "id", s.get("matrix_id"))
        if not m:
            return None
        c = by_id(m.get("causes"), "id", s.get("cause_id"))
        e = by_id(m.get("effects"), "id", s.get("effect_id"))
        if not c or not e:
            return None
        cell = None
        for x in (m.get("cells") or []):
            if x.get("cause_id") == s.get("cause_id") and x.get("effect_id") == s.get("effect_id") and x.get("type") in CELL_TYPES:
                cell = x
                break
        if not cell:
            return None
        return {"category": "cells", "kind": k, "key": test_source_key(t), "source": s,
                "matrix": m, "cause": c, "effect": e, "cell_type": cell["type"]}
    if k == "voting":
        m = by_id(model.get("matrices"), "id", s.get("matrix_id"))
        if not m:
            return None
        c = by_id(m.get("causes"), "id", s.get("cause_id"))
        if not c or not voting_valid(c) or not channels_valid(c) or not (2 <= c["n"] <= MAX_CHANNELS):
            return None
        pos = [LETTERS.find(ch) for ch in S(s.get("combination"))]
        if not pos or any(p < 0 or p >= c["n"] for p in pos):
            return None
        return {"category": "voting", "kind": k, "key": test_source_key(t), "source": s,
                "matrix": m, "cause": c, "combo": {"positions": pos, "code": S(s.get("combination"))}}
    if k == "sif_proof":
        m = by_id(model.get("matrices"), "id", s.get("matrix_id"))
        if not m:
            return None
        c = by_id(m.get("causes"), "id", s.get("cause_id"))
        if not c:
            return None
        return {"category": "sif", "kind": k, "key": test_source_key(t), "source": s, "matrix": m, "cause": c}
    if k == "transition":
        f = by_id(model.get("functions"), "id", s.get("function_id"))
        if not f:
            return None
        frm = by_id(f.get("steps"), "id", s.get("from"))
        to = by_id(f.get("steps"), "id", s.get("to"))
        if not frm or not to:
            return None
        tr = None
        for x in (frm.get("transitions") or []):
            same = empty(x.get("id")) if s.get("transition_id") is None else S(x.get("id")) == S(s.get("transition_id"))
            if S(x.get("to")) == S(s.get("to")) and same:
                tr = x

            return None
        return {"category": "transitions", "kind": k, "key": test_source_key(t), "source": s,
                "fn": f, "condition": S(tr.get("condition"))}

        if not f:
            return None
        md = by_id(f.get("modes"), "id", s.get("mode_id"))
        if not md:
            return None
        return {"category": "mode_edges", "kind": k, "key": test_source_key(t), "source": s,
                "fn": f, "mode": md, "edge": "entry" if k == "mode_entry" else "exit"}
    if k == "loop":
        p = by_id(model.get("io"), "tag", s.get("tag"))
        if not p or p.get("signal_type") not in ("AI", "AO", "DI", "DO"):
            return None
        if p["signal_type"] in ("AI", "AO") and not io_range_valid(p):
            return None
        return {"category": "io", "kind": k, "key": test_source_key(t), "source": s, "point": p}
    return None


def cp_by_pct(cps, p, i):
    """Match a stored checkpoint onto a required p value; fall back to position
    only while no stored row carries p_pct at all."""
    for cp in cps:
        if cp and is_num(cp.get("p_pct")) and cp["p_pct"] == p:
            return cp
    for cp in cps:
        if cp and is_num(cp.get("p_pct")):
            return None
    return cps[i] if i < len(cps) else None


def cp_by_state(cps, st, i):
    for cp in cps:
        if cp and cp.get("state") in (0, 1) and cp["state"] == st:
            return cp
    for cp in cps:
        if cp and cp.get("state") in (0, 1):
            return None
    return cps[i] if i < len(cps) else None


def loop_math(t, point):
    """Section 4.5. The required checkpoint set comes from the point's
    signal_type; span and expected values come from the test, so a model change
    is reported as staleness and does not silently move the tolerance band."""
    out = {"kind": None, "span": None, "tol_abs": None, "rows": [], "has_expected": False}
    sig_type = S((point or {}).get("signal_type")) if point else ""
    if sig_type in ("AI", "AO"):
        out["kind"] = "analogue"
    elif sig_type in ("DI", "DO"):
        out["kind"] = "digital"
    else:
        return out
    exp = t.get("expected") or {}
    cps = t.get("checkpoints") or []
    if out["kind"] == "analogue":
        pts = exp.get("points")
        if not (isinstance(pts, list) and len(pts) == len(PCTS)):
            pts = None
        out["has_expected"] = pts is not None
        span = None
        if pts is not None and is_num(pts[4].get("expected_si")) and is_num(pts[0].get("expected_si")):
            span = pts[4]["expected_si"] - pts[0]["expected_si"]
            out["span"] = span
        tol = t.get("tolerance_pct") if (is_num(t.get("tolerance_pct")) and t["tolerance_pct"] > 0) else None
        out["tol_abs"] = None if (tol is None or span is None) else (tol / 100.0) * span
        sig = S((point or {}).get("signal")) if point else ""
        for i, p in enumerate(PCTS):
            pt = pts[i] if pts is not None else None
            cp = cp_by_pct(cps, p, i) or {}
            a = cp.get("actual_si") if is_num(cp.get("actual_si")) else None
            d = None if (a is None or pt is None or not is_num(pt.get("expected_si"))) else a - pt["expected_si"]
            e = None if (d is None or span is None or span == 0) else 100 * d / span
            if sig == "4-20mA":
                signal = 0.004 + 0.016 * (p / 100)
            elif sig == "0-10V":
                signal = 10 * (p / 100)
            else:
                signal = None
            within = None if (d is None or out["tol_abs"] is None) else abs(d) <= out["tol_abs"] + 1e-9 * abs(span)
            out["rows"].append({"p_pct": p,
                                "expected_si": pt["expected_si"] if (pt is not None and is_num(pt.get("expected_si"))) else None,
                                "actual_si": a, "deviation_si": d, "deviation_pct": e, "signal": signal,
                                "recorded": a is not None, "within": within})
        return out
    sts = exp.get("states")
    out["has_expected"] = isinstance(sts, list)
    for i, st in enumerate((0, 1)):
        cp = cp_by_state(cps, st, i) or {}
        a = cp.get("actual_state") if cp.get("actual_state") in (0, 1) else None
        out["rows"].append({"state": st, "actual_state": a, "recorded": a is not None,
                            "within": None if a is None else a == st})
    return out


def unrestored(t):
    """Section 5.6 FUN-R-050: a bypassed or forced tag with no later restore."""
    open_ = {}
    order = []
    for stp in sorted(t.get("steps") or [], key=lambda x: x.get("n") or 0):
        tag = S(stp.get("target_tag"))
        if stp.get("action") in ("bypass", "force") and tag:
            if tag not in open_:
                order.append(tag)
            open_[tag] = True
        elif stp.get("action") == "restore" and tag and tag in open_:
            open_[tag] = False
    return [t_ for t_ in order if open_[t_]]


def category_excluded(settings, cat):
    sc = settings.get("scope") or {}
    if cat == "cells":
        return not sc.get("ce")
    if cat == "voting":
        return (not sc.get("ce")) or settings.get("voting_coverage") == "none"
    if cat in ("transitions", "mode_edges"):
        return not sc.get("sequences")
    if cat == "io":
        return not sc.get("loop")
    return False


def compute():
    model, settings, tests = MODEL, SETTINGS, TESTS
    Sset = source_sets(model, settings)
    live = {}
    for cat in CATEGORIES:
        for src in Sset[cat]:
            live[cat + "::" + src["key"]] = src

    retests_of = {}
    for t in tests:
        if not empty(t.get("retest_of")):
            retests_of.setdefault(S(t["retest_of"]), []).append(t)

    hashes = {}
    loop_out = {}
    valid_pass = {}
    for t in tests:
        tid = t["id"]
        kind = t.get("kind")
        cat = KIND_CATEGORY.get(kind)
        resolved = None if kind == "manual" else resolve_test_source(model, t)
        cur = hash_of(hash_slice_for(resolved)) if resolved else None
        if cur:
            hashes[tid] = cur
        stale = kind != "manual" and resolved is not None and (t.get("model_hash") is None or t["model_hash"] != cur)
        contradicts = kind != "manual" and resolved is not None and canonical(t.get("expected")) != canonical(expected_for(resolved))
        blocked = False
        if t.get("result") == "pass":
            if contradicts:                                  # FUN-R-022
                blocked = True
            if empty(t.get("evidence_ref")):                 # FUN-R-030
                blocked = True
        if kind == "loop":
            point = resolved["point"] if resolved else by_id(model.get("io"), "tag", (t.get("source") or {}).get("tag"))
            lm = loop_math(t, point)
            if lm["kind"] == "analogue":
                loop_out[tid] = {"expected_si": [r["expected_si"] for r in lm["rows"]],
                                 "deviation_si": [r["deviation_si"] for r in lm["rows"]],
                                 "deviation_pct": [r["deviation_pct"] for r in lm["rows"]],
                                 "within": [r["within"] for r in lm["rows"]],
                                 "tolerance_abs": lm["tol_abs"], "span": lm["span"]}
            bad_tol = lm["kind"] == "analogue" and not (
                is_num(t.get("tolerance_pct")) and t["tolerance_pct"] > 0)
            outside = len([r for r in lm["rows"] if r["recorded"] and r["within"] is False])
            unrec = len([r for r in lm["rows"] if not r["recorded"]])
            if t.get("result") == "pass":
                if not bad_tol and lm["has_expected"] and outside > 0:   # FUN-R-040
                    blocked = True
                if unrec > 0:                                # FUN-R-041
                    blocked = True
        if unrestored(t):                                    # FUN-R-050
            blocked = True
        valid_pass[tid] = (t.get("result") == "pass") and not stale and not blocked

    tests_by_key = {}
    for t in tests:
        cat = KIND_CATEGORY.get(t.get("kind"))
        if not cat:
            continue
        tests_by_key.setdefault(cat + "::" + test_source_key(t), []).append(t)

    coverage = {}
    sum_total = sum_cov = sum_exec = 0
    for cat in CATEGORIES:
        covered = executed = total = 0
        for src in Sset[cat]:
            w = 1 + src.get("dup", 0)
            total += w
            group = tests_by_key.get(cat + "::" + src["key"], [])
            if any(valid_pass[t["id"]] for t in group):
                covered += w
            if any(t.get("result") in ("pass", "fail") for t in group):
                executed += w
        coverage[cat] = {"total": total, "covered": covered, "executed": executed,
                         "pct": (100 * covered / total) if total else None}
        sum_total += total
        sum_cov += covered
        sum_exec += executed
    coverage["overall"] = {"total": sum_total, "covered": sum_cov, "executed": sum_exec,
                           "pct": (100 * sum_cov / sum_total) if sum_total else None}

    generated = {}
    by_kind = {}
    result_counts = {}
    for k in ("ce_cell", "voting", "transition", "mode_entry", "mode_exit", "loop", "sif_proof", "manual"):
        generated[k] = 0
        by_kind[k] = 0
    for r in ("not_tested", "pass", "fail", "deferred"):
        result_counts[r] = 0
    for t in tests:
        by_kind[t["kind"]] = by_kind.get(t["kind"], 0) + 1
        if t["kind"] != "manual" and empty(t.get("retest_of")):
            generated[t["kind"]] = generated.get(t["kind"], 0) + 1
        result_counts[t["result"]] = result_counts.get(t["result"], 0) + 1
    sources = dict((c, len(Sset[c])) for c in CATEGORIES)
    sources["total"] = sum_total

    return {"counts": {"sources": sources, "generated": generated, "by_kind": by_kind, "result": result_counts},
            "coverage": coverage, "hashes": hashes, "loop": loop_out}

 * `{lo, hi, unit}`, names the signal class in `electrical_type`, and spells a

 * name wins, then the flat alias, then the nested pair; `min`/`max` stay in
 * the chain for a hand-written document. */
function ioBound(own, flat, nestedIol, nestedAlt) {
  if (isNum(own)) return own;
  if (isNum(flat)) return flat;
  if (isNum(nestedIol)) return nestedIol;
