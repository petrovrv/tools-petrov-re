 * one object {operator, setpoint_si, unit, display_unit}. The operator gives
 * the direction of the condition and not its level, so > and >= read as H and
 * < and <= as L; HH and LL are never inferred. */
var CE_CELL_TYPE = { X: 'trip', P: 'permissive', A: 'alarm' };
var CE_OPERATOR_CONDITION = { '>': 'H', '>=': 'H', '<': 'L', '<=': 'L' };

}

  if (v && typeof v === 'object') return CE_OPERATOR_CONDITION[str(v.operator)] || 'other';
  return CONDITIONS.indexOf(str(v)) >= 0 ? str(v) : 'other';
}

function mapPackageTests(proj) {
  var items = (proj.package || {}).functional_tests || [], out = [], ignored = {}, skipped = [];

    if (empty(raw.id)) { skipped.push({ sec: 'functional_tests', why: 'id' }); return; }
    var t = {};

    if (raw.cause_effect_id !== undefined || raw.cell !== undefined || raw.combination !== undefined ||
        raw.transition !== undefined || raw.mode !== undefined || raw.function_id !== undefined) {
      /* §7.3 writes a flattened view beside `source`; `source` is authoritative. */
      ['cause_effect_id', 'cell', 'combination', 'transition', 'mode', 'function_id', 'io_tags'].forEach(function (k) {
        if (raw[k] !== undefined) (ignored.functional_tests = ignored.functional_tests || {})[k] = ((ignored.functional_tests || {})[k] || 0) + 1;
      });
    }
    ['stale', 'valid_pass'].forEach(function (k) { if (raw[k] !== undefined) (ignored.functional_tests = ignored.functional_tests || {})[k + ' (recomputed here)'] = ((ignored.functional_tests || {})[k + ' (recomputed here)'] || 0) + 1; });
    Object.keys(raw).forEach(function (k) {
      if (TEST_FIELDS.indexOf(k) >= 0) return;
      if (['cause_effect_id', 'cell', 'combination', 'transition', 'mode', 'function_id', 'io_tags', 'stale', 'valid_pass'].indexOf(k) >= 0) return;
      (ignored.functional_tests = ignored.functional_tests || {})[k] = ((ignored.functional_tests || {})[k] || 0) + 1;
    });
    if (KINDS.indexOf(t.kind) < 0) t.kind = 'manual';
    if (RESULTS.indexOf(t.result) < 0) t.result = 'not_tested';
    t.source = t.source || {};
    t.steps = Array.isArray(t.steps) ? t.steps : [];
    t.checkpoints = Array.isArray(t.checkpoints) ? t.checkpoints : [];
    t.preconditions = Array.isArray(t.preconditions) ? t.preconditions : [];
    t.prior_results = Array.isArray(t.prior_results) ? t.prior_results : [];
    out.push(t);
  });
  return { tests: out, ignored: ignored, skipped: skipped };
}

function packageTests() {

    if (t.kind === 'loop' && s.tag) tags = uniq(tags.concat([str(s.tag)]));

function findingsFor(id) { return (last ? last.findings : []).filter(function (f) { return f.target === id; }); }
function visibleTests() {
  var st = state;
  return (st.tests || []).filter(function (t) {
    var inf = last.info[t.id];
    if (inf && inf.hidden) return false;
    if (filters.category && (KIND_CATEGORY[t.kind] || 'manual') !== filters.category) return false;
    if (filters.phase && t.phase !== filters.phase) return false;
    if (filters.result && t.result !== filters.result) return false;
    if (filters.system && str(t.system_id) !== filters.system) return false;
    if (filters.findings && !findingsFor(t.id).length) return false;
    if (st.settings.system_filter && str(t.system_id) !== str(st.settings.system_filter)) return false;
    return true;
  });
}

function setField(t, k, v) { t[k] = v; refresh(); sync(); }

function renderDom() {
  if (typeof document === 'undefined' || !document.getElementById) return;
  var host = document.getElementById('app');
  if (!host) return;
  refresh();
  ['ft-package', 'ft-model', 'ft-generate', 'ft-register'].forEach(function (id) {
    var old = document.getElementById(id);
    if (old && old.parentNode) old.parentNode.removeChild(old);
  });
  host.appendChild(renderPackage());
  host.appendChild(renderGenerate());
  host.appendChild(renderRegister());
  host.appendChild(renderModel());
}

/* ------------------------------------------------------------ model panel */
/* §10 item 2: the three model tables are editable for typed use. A model that
 * came from a project package is shown read-and-annotate, because the upstream
 * tool owns those rows; unloading the package makes them editable again. */
function modelEditable() { return state.meta.package_id == null; }
function modelChanged() { normaliseState(state); refresh(); sync(); }
function ein(obj, key, type, width) {
  var i = input(obj[key] == null ? '' : obj[key], function (v) {
    if (type === 'number' || type === 'int') {
      var n = parseFloat(v);
      obj[key] = v.trim() === '' ? null : (type === 'int' ? Math.round(n) : n);
      if (!isFinite(obj[key])) obj[key] = null;
    } else obj[key] = v;
    modelChanged();
  }, type === 'number' || type === 'int' ? 'number' : 'text');
  if (width) i.style.width = width;
  return i;
}
function esel(obj, key, values, allowEmpty) {
  var opts = (allowEmpty ? [opt('', '—')] : []).concat(values.map(function (v) { return opt(v, v); }));
  return select(opts, obj[key] == null ? '' : String(obj[key]), function (v) {
    obj[key] = v === '' ? null : v;
    modelChanged();
  });
}
function elist(obj, key) {
  return input((obj[key] || []).join(', '), function (v) {
    obj[key] = v.split(',').map(function (x) { return x.trim(); }).filter(function (x) { return x !== ''; });
    modelChanged();
  }, 'text');
}
function delBtn(arr, item) {
  return btn(loc(DOM.remove), 'ft-btn-small', function () {
    var i = arr.indexOf(item); if (i >= 0) arr.splice(i, 1);
    modelChanged();
  });
}
function addBtn(label, fn) { return btn(label, 'ft-btn-small', function () { fn(); modelChanged(); }); }
function nextId(list, prefix) {
  var n = 1, used = {};
  list.forEach(function (x) { used[str(x.id)] = 1; });
  while (used[prefix + n]) n++;
  return prefix + n;
}
function cellOf(m, causeId, effectId) {
  var found = null;
  (m.cells || []).forEach(function (c) { if (c.cause_id === causeId && c.effect_id === effectId) found = c; });
  return found;
}
function setCell(m, causeId, effectId, type) {
  m.cells = m.cells || [];
  var i = -1;
  m.cells.forEach(function (c, k) { if (c.cause_id === causeId && c.effect_id === effectId) i = k; });
  if (type === '') { if (i >= 0) m.cells.splice(i, 1); }
  else if (i >= 0) m.cells[i].type = type;
  else m.cells.push({ cause_id: causeId, effect_id: effectId, type: type });
  modelChanged();
}

function renderModel() {
  var st = state, edit = modelEditable(), sec = el('section', 'ftp'); sec.id = 'ft-model';
  sec.appendChild(el('h2', null, loc(DOM.model)));

  sec.appendChild(el('p', 'ft-help', edit ? loc(DOM.model_typed) : locv(DOM.model_locked, { id: str(st.meta.package_id) })));
  if (!edit) sec.appendChild(btn(loc(DOM.detach), 'ft-btn-small', function () {
    /* Detaching keeps the model and the tests already loaded and hands the rows
     * back to the user; loading the package again restores the link. */
    st.meta.package_id = null; st.meta.package_revision = null;
    modelChanged();
  }));
  if (!st.model.matrices.length && !st.model.functions.length && !st.model.io.length) {
    sec.appendChild(el('p', 'ft-help', loc(DOM.model_empty)));
  }
  function modelFindings(target) { return (last.findings || []).filter(function (f) { return f.target === target; }); }
  function flagInto(cell, fs) {

function fromDisplay(v, unit, display) {

  if (!display || display === unit) return v;

}

  (t.checkpoints || []).forEach(function (cp) { if ('actual_si' in cp) cp.actual_si = null; if ('actual_state' in cp) cp.actual_state = null; });
  state.tests.push(t);
  sel = t.id;

function loadProjection() {
  return pkgSafe(function () { return DiagramProject.load({ reads: PKG_SECTIONS }); }, null);
}
function reportLines(proj, mapped, extra) {
  var lines = [];
  Object.keys(mapped.counts || {}).forEach(function (sec) {
    lines.push(locv(PK.loaded_items, { n: mapped.counts[sec], sec: sectionName(sec) }));
  });
  var bySec = {};
  (mapped.skipped || []).forEach(function (s) { (bySec[s.sec] = bySec[s.sec] || []).push(s.why); });
  Object.keys(bySec).forEach(function (s) { lines.push(locv(PK.skipped_items, { n: bySec[s].length, sec: sectionName(s), why: uniq(bySec[s]).join(', ') })); });
  Object.keys(mapped.ignored || {}).forEach(function (s) {
    var names = Object.keys(mapped.ignored[s]).map(function (k) { return k + ' (' + mapped.ignored[s][k] + ')'; });
    if (names.length) lines.push(locv(PK.ignored_fields, { sec: sectionName(s), list: names.join(', ') }));
  });
  if (proj && (proj.ignored || []).length) lines.push(locv(PK.ignored_sections, { list: proj.ignored.map(sectionName).join(', ') }));
  return lines.concat(extra || []);
}
function sectionName(s) { return pkgSafe(function () { return DiagramProject.sectionLabel(s, siteLang()) || s; }, s); }

function doLoadModel() {
  var proj = loadProjection();
  if (!proj) { pkgNote = loc(PK.none); scheduleDom(); return; }
  var hasModel = (state.model.matrices || []).length || (state.model.functions || []).length || (state.model.io || []).length;
  if (hasModel && typeof confirm === 'function' && !confirm(loc(PK.replace_model))) return;
  var mapped = mapPackage(proj);
  state.model = { matrices: mapped.model.matrices, functions: mapped.model.functions, io: mapped.model.io };
  state.__flags = mapped.model.flags;
  pkgSystems = mapped.model.systems;
  if (mapped.model.project) {
    state.meta.project_name = mapped.model.project.name;
    state.meta.project_reference = mapped.model.project.reference;
  }
  state.meta.package_id = proj.meta ? proj.meta.package_id : null;
  state.meta.package_revision = proj.meta ? proj.meta.revision : null;
  state.meta.model_loaded_at = nowIso();
  pkgReport = reportLines(proj, mapped, []);
  pkgBanner = false; pkgLoaded = proj;
  normaliseState(state); refresh(); sync();
}

function doLoadTests() {
  var proj = loadProjection();
  if (!proj) { pkgNote = loc(PK.none); scheduleDom(); return; }
  var mapped = mapPackageTests(proj);
  var mine = {}; (state.tests || []).forEach(function (t) { mine[t.id] = t; });
  var added = 0, same = 0, conflicts = [];
  mapped.tests.forEach(function (pt) {
    var m = mine[pt.id];
    if (!m) { state.tests.push(pt); added++; return; }
    if (canonical(m) === canonical(pt)) { same++; return; }
    conflicts.push({ id: pt.id, mine: m, theirs: pt, choice: 'mine' });
  });
  pkgConflicts = conflicts;
  pkgReport = reportLines(proj, { counts: { functional_tests: mapped.tests.length }, skipped: mapped.skipped, ignored: mapped.ignored }, [
    locv(PK.loaded_items, { n: added, sec: sectionName('functional_tests') }),
    conflicts.length ? locv(PK.conflicts, { n: conflicts.length }) : ''
  ].filter(function (x) { return x; }));
  pkgBanner = false;
  normaliseState(state); refresh(); sync();
}

function renderConflicts() {
  var box = el('div', 'ft-detail');
  box.appendChild(el('h3', null, locv(PK.conflicts, { n: pkgConflicts.length })));
  var row = el('div', 'ft-row');
  row.appendChild(btn(loc(PK.all_mine), '', function () { pkgConflicts.forEach(function (c) { c.choice = 'mine'; }); applyConflicts(); }));
  row.appendChild(btn(loc(PK.all_pkg), '', function () { pkgConflicts.forEach(function (c) { c.choice = 'package'; }); applyConflicts(); }));
  box.appendChild(row);
  var wrap = el('div', 'ft-scroll'), tb = el('table', 'ft-table'), hr = el('tr');
  [loc(UI.test_id), loc(PK.keep_mine), loc(PK.take_pkg), ''].forEach(function (h) { hr.appendChild(el('th', null, h)); });
  var th = el('thead'); th.appendChild(hr); tb.appendChild(th);
  var body = el('tbody');
  pkgConflicts.forEach(function (c) {
    var tr = el('tr');
    td(tr, c.id, loc(UI.test_id));
    td(tr, loc(RESULT_TXT[c.mine.result]) + ' · ' + (c.mine.evidence_ref || '—') + ' · ' + (c.mine.model_hash || '—'), loc(PK.keep_mine));
    td(tr, loc(RESULT_TXT[c.theirs.result]) + ' · ' + (c.theirs.evidence_ref || '—') + ' · ' + (c.theirs.model_hash || '—'), loc(PK.take_pkg));
    var bc = td(tr, '', '');
    bc.appendChild(select([opt('mine', loc(PK.keep_mine)), opt('package', loc(PK.take_pkg))], c.choice, function (v) { c.choice = v; }));
    body.appendChild(tr);
  });
  tb.appendChild(body); wrap.appendChild(tb); box.appendChild(wrap);
  box.appendChild(btn(loc(DOM.details), 'ft-btn-primary', applyConflicts));
  return box;
}
function applyConflicts() {
  (pkgConflicts || []).forEach(function (c) {
    if (c.choice !== 'package') return;
    for (var i = 0; i < state.tests.length; i++) if (state.tests[i].id === c.id) { state.tests[i] = c.theirs; break; }
  });
  pkgConflicts = null;
  normaliseState(state); refresh(); sync();
}

function orphanFlags() {
  var flags = state.__flags || [], ids = {};
  (state.tests || []).forEach(function (t) { ids['functional_test|' + t.id] = 1; });
  (state.model.matrices || []).forEach(function (m) { ids['cause_effect|' + m.id] = 1; });
  (state.model.functions || []).forEach(function (f) { ids['control_function|' + f.id] = 1; });
  (state.model.io || []).forEach(function (p) { ids['io_point|' + str(p.tag)] = 1; });
  return flags.filter(function (f) { return f && typeof f === 'object' && !ids[str(f.target_kind) + '|' + str(f.target_id)]; });
}

function doSaveTests() {
  refresh();
  if (last.collisions.length) { pkgNote = locv(PK.refused, { why: loc(PK.refused_collision) }); scheduleDom(); return; }
  var res = pkgSafe(function () { return DiagramProject.save({ functional_tests: packageTests() }); }, null);
  if (!res || !res.ok) pkgNote = locv(PK.refused, { why: str(res && (res.reason + (res.problems && res.problems.length ? ': ' + res.problems.join('; ') : ''))) || 'unavailable' });
  else pkgNote = locv(PK.saved, { n: (state.tests || []).length, rev: res.package_revision });
  pkgMeta = pkgPeek();
  scheduleDom();
}
