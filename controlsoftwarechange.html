<script>
(function () {
'use strict';
/* Control & Software Change — calculation core (pure functions, no DOM).
   Semantic diff of two structured exports (records keyed by kind, id and field), impact on control functions through
   record references and function dependencies, candidate retests and uncovered requirements. Binary or unknown
   formats are refused; row order, comments and provenance never count as a semantic change. */
var CS_VERSION = '2026-10-11.cs-4';
var CS_STATUS = ['confirmed', 'rejected', 'unknown', 'not_applicable'];
var CS_KINDS = ['function', 'cause', 'effect', 'cause_effect', 'io', 'setpoint', 'firmware'];
var CS_FORMATS = ['structured', 'binary', 'unknown'];
var CS_DECISION = ['pending', 'approved', 'rejected'];
var CS_CATEGORY = ['', 'A', 'B', 'C', 'NC'];   /* IEC 61226 categories; '' = not given */
var CS_LIMIT_DIR = ['', 'high', 'low'];

function csNum(v) { return typeof v === 'number' && isFinite(v) ? v : null; }
function csText(v) { return v === null || v === undefined ? '' : String(v).trim(); }
function csNorm(v) { return csText(v).replace(/\s+/g, ' '); }
function csId(v) { return csNorm(v).toUpperCase(); }
function csIds(v) { var out = []; csText(v).split(/[,;\s]+/).forEach(function (x) { x = x.toUpperCase(); if (x && out.indexOf(x) < 0) out.push(x); }); return out.sort(); }
function csNumText(v) { var t = csText(v); if (!/^[-+]?(\d+(\.\d+)?|\.\d+)([eE][-+]?\d+)?$/.test(t)) return null; var n = Number(t); return isFinite(n) ? n : null; }
/* semantic value: a number when the text is a number, else the white-space-normalised text (case kept) */
function csValue(v) { var n = csNumText(v); return n !== null ? { n: n } : { t: csNorm(v) }; }
function csSameValue(a, b) { return a.n !== undefined && b.n !== undefined ? a.n === b.n : a.n === undefined && b.n === undefined && a.t === b.t; }

/* one version → ordered map of normalised records */
function csRecords(list, side, gaps) {
  var map = {}, order = [];
  (Array.isArray(list) ? list : []).forEach(function (r, i) {
    var kind = r.kind, id = csId(r.id), field = csNorm(r.field).toLowerCase() || 'value', pos = side + '#' + (i + 1);
    if (CS_KINDS.indexOf(kind) < 0) { gaps.push({ code: 'kind_unsupported', id: pos }); return; }
    if (!id) { gaps.push({ code: 'id_missing', id: pos }); return; }
    var key = kind + '|' + id + '|' + field;

ти визначення функції","a_run_test":"повторити це випробування","a_safety_review":"провести незалежну експертизу безпеки","exControl":"Лише коментарі й порядок рядків (контрольний)","exControlNote":"Три записи переставлено, ревізії та коментарі змінено: семантичних змін немає, повторювати нічого не треба.","exTypical":"Зміна уставки й матриці причин і наслідків (типовий)","exTypicalNote":"Рівень відключення 85 → 80 %, тепер на 9 % нижче аналітичної межі з урахуванням похибки контуру, до комірки C&E додано сигналізацію: зачеплено три функції, серед них відключення категорії A, два повторні випробування, одна вимога без випробування.","exFirmware":"Оновлення мікропрограми комунікаційної плати","exFirmwareNote":"4.2.1 → 4.3.0 на платі, що обслуговує лише канал передачі даних: одна функція, одне повторне випробування.","exBinary":"Два двійкові образи ПЛК (проблема)","exBinaryNote":"Структурованого експорту немає: семантичне порівняння не виконується.","exTry":"Спроба: голосування змінено під час «упорядкування»","exTryNote":"Голосування причини 2oo3 → 1oo2 не зіставлено з функцією: обсяг впливу не встановлено.","exFix":"Виправлено: голосування зіставлено з відключенням","exFixNote":"Зіставлено з функцією відключення: зачеплено функцію безпеки категорії A, два повторні випробування, експертиза безпеки й незалежна верифікація.","learnIntroTitle":"На що відповідає інструмент","learnIntro":"Що змінилося між двома версіями логіки керування або конфігурації, яких функцій керування стосується зміна і які випробування слід повторити.","learnDataTitle":"Записи","learnData":"Кожна версія — це перелік записів зі структурованого експорту: комірки C&E, причини, наслідки, точки вводу/виводу, уставки, мікропрограми. Запис ідентифікується типом, ID і полем; порядок рядків і коментарі не мають значення. Записи версії можна також прочитати з пакета проєкту: точки введення-виведення, матриці причин і наслідків (причини, наслідки, клітинки), а за наявності — функції керування та функціональні випробування замінюють записи версії, її функції та випробування. Реєстри не містять логіки, що є лише в прикладній програмі, класифікації безпеки функцій, їхніх залежностей і меж уставок: доповніть їх після читання.","learnModelTitle":"Від зміни до повторного випробування","learnModel":"Змінене значення, одиниця, перелік функцій або допустимий діапазон є семантичною зміною. Вона зачіпає функції, названі в записі, а потім кожну функцію, що від них залежить; випробування цих функцій і вимог стають кандидатами на повторне випробування.","learnTryTitle":"Спроба","learnTry":"Відкрийте приклад «голосування змінено під час упорядкування» і порівняйте. Перш ніж читати далі: це косметична правка?","learnExplainTitle":"Пояснення","learnExplain":"Коментар називає це упорядкуванням, проте голосування змінилося з 2oo3 на 1oo2, а це семантична зміна. Оскільки запис не називає жодної функції, інструмент не може сказати, чого вона стосується, і позначає обсяг впливу як не встановлений.","learnFixTitle":"Виправлення","learnFix":"Зіставте причину з функцією відключення FN-TRIP: тепер зміна зачіпає функцію безпеки категорії A і залежну від неї функцію, два випробування стають кандидатами, потрібні експертиза безпеки й незалежна верифікація.","learnBoundaryTitle":"Де закінчується результат","learnBoundary":"Інструмент порівнює лише структуровані записи; код ПЛК і двійкові образи він не аналізує. Набір повторних випробувань є набором кандидатів без доведеної мінімальності чи повноти, а затвердження лишається окремим рішенням.","reportTitle":"Зміна керування та ПЗ: семантичне порівняння й кандидати на повторне випробування","modelVersion":"Версія моделі","eqNote":"Символи: k — ключ запису; v, u, F, [lo, hi] — значення, одиниця, перелік функцій і допустимий діапазон запису у версії B (базовій) або C (кандидатній); Δ — множина змінених ключів; F(Δ) — функції, названі в змінених записах; D(f) — функції, від яких залежить f; A — зачеплені функції; R_A — вимоги A; T* — кандидати на повторне випробування; U — вимоги без випробування. τ, i, φ — тип запису, ID і поле.","modelText":"Значення, що читаються як числа, порівнюються як числа, решта — як текст із нормалізованими пробілами; ID, функції й поля порівнюються без урахування регістру; одиниці порівнюються як текст і ніколи не перераховуються.","boundaryText":"Інструмент не встановлює повноти безпеки ПЗ, не доводить, що набір випробувань повний, і не дає регуляторних висновків; затвердження є окремим рішенням, прив'язаним до вхідних даних.","scopeText":"Попередній інженерний засіб лише для структурованих експортів. Вбудовані приклади синтетичні.","analyticalLimit":"Аналітична межа","loopUncertainty":"Сумарна похибка контуру","limitDirection":"Напрям межі","dirNone":"не задано","dirHigh":"верхня (спрацювання при зростанні)","dirLow":"нижня (спрацювання при зниженні)","category":"Категорія","catNone":"—","catA":"категорія A","catB":"категорія B","catC":"категорія C","catNC":"без категорії","marginTable":"Запаси уставок до аналітичної межі","marginAl":"Запас з урахуванням похибки контуру","g_category_inconsistent":"Позначено як важливу для безпеки, але без категорії.","g_limit_direction_missing":"Аналітична межа без напряму.","g_loop_uncertainty_missing":"Аналітична межа без похибки контуру.","g_setpoint_margin_negative":"Уставка за аналітичною межею з урахуванням похибки контуру.","w_category_a_affected":"Зачеплено функцію категорії A: IEC 60880 вимагає незалежної верифікації її програмного забезпечення.","a_independent_verification":"Організуйте незалежну верифікацію зміненого програмного забезпечення (категорія A).","a_correct_function":"Виправте класифікацію безпеки функції.","pkgToBaseline":"Прочитати базову версію з пакета проєкту","pkgToCandidate":"Прочитати нову версію з пакета проєкту","pkgNone":"У цьому браузері немає збереженого пакета проєкту.","pkgRead":"Прочитано {n} записів у «{v}»; функцій {f}, випробувань {t}; пропущено записів пакета {s}."},"de":{"title":"Änderung von Steuerung & Sof antische Änderung","cls_non_safety":"Änderung außerhalb der Sicherheitsfunktionen","cls_safety":"Sicherheitsfunktion betroffen","cls_unknown":"Wirkungsbereich nicht festgestellt","semanticChanges":"Semantische Änderungen","traceOnly":"nur Herkunft oder Kommentar","unchanged":"unverändert","affectedFunctions":"Betroffene Funktionen","candidateTests":"Kandidaten für Wiederholungsprüfungen","uncovered":"Anforderungen ohne Prüfung","retestPlan":"Plan der Wiederholungsprüfungen","critMet":"vollständig für die gegebenen Daten","critNotMet":"Sollwert außerhalb seines zulässigen Bereichs","changeTable":"Änderungen","record":"Datensatz","change":"Änderung","ch_added":"hinzugefügt","ch_removed":"entfernt","ch_modified":"geändert","ch_trace_only":"nur Herkunft oder Kommentar","f_value":"Wert","f_unit":"Einheit","f_functions":"Funktionen","f_range":"zulässiger Bereich","functionTable":"Betroffene Funktionen","impact":"Betroffen","imp_direct":"direkt","imp_indirect":"über eine Abhängigkeit","testTable":"Wiederholungsprüfungen","role":"Rolle","roleTest":"Kandidat für Wiederholungsprüfung","roleUncovered":"Anforderung ohne Prüfung","gapTable":"Offene Punkte","gap":"Punkt","actions":"Maßnahmen","action":"Maßnahme","warning":"Hinweis","plot":"Wirkungskarte: geänderte Datensätze (links), von ihnen betroffene Funktionen (Mitte), Kandidaten für Wiederholungsprüfungen und Anforderungen ohne Prüfung (rechts)","colChanges":"Geänderte Datensätze","colFunctions":"Funktionen","colTests":"Wiederholungsprüfungen","noSemantic":"Keine semantische Änderung","noResult":"Noch kein Ergebnis","verdictBlocked":"Die Versionen können nicht verglichen werden: siehe Gründe.","verdict_none":"Keine semantische Änderung: Es unterscheiden sich nur Zeilenreihenfolge, Kommentare oder Herkunft.","verdict_non_safety":"Semantische Änderungen betreffen Funktionen außerhalb der Sicherheitsfunktionen; die Kandidaten für Wiederholungsprüfungen sind aufgeführt.","verdict_safety":"Eine sicherheitsbezogene Funktion ist betroffen; die Kandidaten für Wiederholungsprüfungen und eine Sicherheitsbewertung sind erforderlich.","verdict_unknown":"Eine Änderung lässt sich keiner definierten Funktion zuordnen, daher ist ihr Wirkungsbereich nicht festgestellt.","b_unsupported_format":"Diese Version ist kein strukturierter Export; ein semantischer Vergleich wird nicht versucht.","b_no_records":"Keine der Versionen enthält einen Datensatz.","g_kind_unsupported":"Der Datensatztyp wird nicht unterstützt; die Zeile wird ignoriert.","g_id_missing":"Die Zeile hat keine ID; sie wird ignoriert.","g_duplicate_key":"Derselbe Datensatz kommt zweimal vor; die spätere Zeile wird ignoriert.","g_record_unconfirmed":"Ein geänderter Datensatz ist in einer der Versionen nicht bestätigt.","g_unmapped_change":"Der geänderte Datensatz verweist auf keine Funktion.","g_firmware_scope_undefined":"Die Firmware-Änderung nennt keine Funktion; alle definierten Funktionen gelten als betroffen.","g_unknown_function":"Der Datensatz verweist auf eine nicht definierte Funktion.","g_setpoint_value_invalid":"Der Sollwert ist keine Zahl.","g_setpoint_unit_missing":"Der Sollwert hat keine Einheit.","g_range_invalid":"Das zulässige Minimum liegt über dem zulässigen Maximum.","g_setpoint_out_of_range":"Der Sollwert der Kandidatenversion liegt außerhalb seines zulässigen Bereichs.","g_requirement_uncovered":"Die Anforderung ist von der Änderung betroffen, wird aber von keiner Prüfung abgedeckt.","g_function_untested":"Die Funktion ist von der Änderung betroffen, wird aber von keiner Prüfung abgedeckt.","g_test_unconfirmed":"Die Prüfungsdefinition ist nicht bestätigt.","g_function_unconfirmed":"Die Funktionsdefinition ist nicht bestätigt.","w_trace_only_changes":"Einige Datensätze unterscheiden sich nur in Herkunft oder Kommentar; das sind keine semantischen Änderungen.","w_candidate_set_not_minimal":"Die Wiederholungsprüfungen sind Kandidaten: Die Menge ist weder als minimal noch als vollständig nachgewiesen.","w_safety_function_affected":"Eine sicherheitsbezogene Funktion ist betroffen: Eine unabhängige Sicherheitsbewertung ist erforderlich.","w_restored_values":"Gespeicherte Werte wurden beim Laden ersetzt: ","a_provide_structured_export":"einen strukturierten Export dieser Version bereitstellen","a_import_records":"die Datensätze beider Versionen importieren","a_correct_record":"den Datensatz korrigieren","a_resolve_duplicate":"den doppelten Datensatz bereinigen","a_confirm_record":"den Datensatz bestätigen","a_map_to_function":"den Datensatz den Funktionen zuordnen, denen er dient","a_define_firmware_scope":"festlegen, welchen Funktionen die Firmware dient","a_define_function":"die Funktion definieren","a_correct_setpoint":"die Sollwertdaten korrigieren","a_revise_setpoint":"den Sollwert oder seinen zulässigen Bereich überarbeiten","a_add_test":"eine Prüfung ergänzen oder verknüpfen","a_confirm_test":"die Prüfungsdefinition bestätigen","a_confirm_function":"die Funktionsdefinition bestätigen","a_run_test":"diese Prüfung wiederholen","a_safety_review":"eine unabhängige Sicherheitsbewertung durchführen","exControl":"Nur Kommentare und Zeilenreihenfolge (Kontrolle)","exControlNote":"Drei Datensätze umsortiert, Revisionen und Kommentare geändert: keine semantische Änderung, nichts zu wiederholen.","exTypical":"Änderung von Sollwert und Ursache-Wirkungs-Matrix (typisch)","exTypicalNote":"Abschaltgrenzwert 85 → 80 %, jetzt 9 % unter dem analytischen Grenzwert nach Abzug der Kreisunsicherheit, und ein Alarm in der C&E-Zelle ergänzt: drei Funktionen betroffen, darunter eine Abschaltung der Kategorie A, zwei Wiederholungsprüfungen, eine Anforderung ohne Prüfung.","exFirmware":"Firmware-Aktualisierung einer Kommunikationsbaugruppe","exFirmwareNote":"4.2.1 → 4.3.0 auf einer Baugruppe, die nur der Datenverbindung dient: eine Funktion, eine Wiederholungsprüfung.","exBinary":"Zwei SPS-Binärabbilder (Problem)","exBinaryNote":"Kein strukturierter Export: Ein semantischer Vergleich wird nicht versucht.","exTry":"Versuch: Votierung bei einer „Bereinigung“ geändert","exTryNote":"Die Votierung der Ursache 2oo3 → 1oo2 ist keiner Funktion zugeordnet: Der Wirkungsbereich ist nicht festgestellt.","exFix":"Lösung: Votierung der Schutzabschaltung zugeordnet","exFixNote":"Der Schutzabschaltfunktion zugeordnet: eine Sicherheitsfunktion der Kategorie A betroffen, zwei Wiederholungsprüfungen, eine Sicherheitsbewertung und eine unabhängige Verifizierung.","learnIntroTitle":"Welche Frage das Werkzeug beantwortet","learnIntro":"Was sich zwischen zwei Versionen von Steuerungslogik oder Konfiguration geändert hat, welche Steuerungsfunktionen die Änderung betrifft und welche Prüfungen wiederholt werden sollten.","learnDataTitle":"Datensätze","learnData":"Jede Version ist eine Liste von Datensätzen aus einem strukturierten Export: C&E-Zellen, Ursachen, Wirkungen, E/A-Punkte, Sollwerte, Firmware. Ein Datensatz wird durch Typ, ID und Feld bestimmt; Zeilenreihenfolge und Kommentare spielen keine Rolle. Die Datensätze eines Stands lassen sich auch aus dem Projektpaket lesen: E/A-Signale, Ursache-Wirkungs-Matrizen (Ursachen, Wirkungen, Zellen) und, falls gespeichert, Steuerfunktionen und Funktionsprüfungen ersetzen diesen Stand, seine Funktionen und seine Prüfungen. Die Register enthalten keine Logik, die nur im Anwendungsprogramm liegt, keine Sicherheitseinstufung der Funktionen, keine Abhängigkeiten und keine Sollwertgrenzen: ergänzen Sie diese nach dem Lesen.","learnModelTitle":"Von der Änderung zur Wiederholungsprüfung","learnModel":"Ein geänderter Wert, eine geänderte Einheit, Funktionsliste oder ein geänderter zulässiger Bereich ist eine semantische Änderung. Sie betrifft die im Datensatz genannten Funktionen und danach jede Funktion, die von ihnen abhängt; Prüfungen dieser Funktionen und Anforderungen werden zu Kandidaten für Wiederholungsprüfungen.","learnTryTitle":"Versuch","learnTry":"Öffnen Sie das Beispiel „Votierung bei einer Bereinigung geändert“ und vergleichen Sie. Vor dem Weiterlesen: Ist das eine kosmetische Änderung?","learnExplainTitle":"Erklärung","learnExplain":"Der Kommentar nennt es eine Bereinigung, doch die Votierung wechselte von 2oo3 auf 1oo2: eine semantische Änderung. Da der Datensatz keine Funktion nennt, kann das Werkzeug nicht angeben, was sie betrifft, und kennzeichnet den Wirkungsbereich als nicht festgestellt.","learnFixTitle":"Korrektur","learnFix":"Ordnen Sie die Ursache der Schutzabschaltfunktion FN-TRIP zu: Die Änderung betrifft nun eine Sicherheitsfunktion der Kategorie A und die von ihr abhängige Funktion, zwei Prüfungen sind Kandidaten, und eine Sicherheitsbewertung sowie eine unabhängige Verifizierung sind erforderlich.","learnBoundaryTitle":"Wo das Ergebnis endet","learnBoundary":"Das Werkzeug vergleicht nur strukturierte Datensätze; SPS-Code und Binärabbilder analysiert es nicht. Die Menge der Wiederholungsprüfungen ist eine Kandidatenmenge ohne Nachweis von Minimalität oder Vollständigkeit, und die Freigabe bleibt eine eigene Entscheidung.","reportTitle":"Änderung von Steuerung und Software: semantischer Vergleich und Kandidaten für Wiederholungsprüfungen","modelVersion":"Modellversion","eqNote":"Symbole: k — Datensatzschlüssel; v, u, F, [lo, hi] — Wert, Einheit, Funktionsliste und zulässiger Bereich eines Datensatzes in Version B (Basis) oder C (Kandidat); Δ — Menge der geänderten Schlüssel; F(Δ) — in geänderten Datensätzen genannte Funktionen; D(f) — Funktionen, von denen f abhängt; A — betroffene Funktionen; R_A — Anforderungen von A; T* — Kandidaten für Wiederholungsprüfungen; U — Anforderungen ohne Prüfung. τ, i, φ — Datensatztyp, ID und Feld.","modelText":"Werte, die sich als Zahlen lesen lassen, werden als Zahlen verglichen, andere als Text mit normalisierten Leerzeichen; IDs, Funktionen und Felder werden ohne Beachtung der Groß- und Kleinschreibung verglichen; Einheiten werden nur textlich verglichen, ohne Umrechnung.","boundaryText":"Das Werkzeug stellt keine Software-Sicherheitsintegrität fest, weist keine Vollständigkeit einer Prüfmenge nach und liefert keine regulatorische Schlussfolgerung; die Freigabe ist eine eigene, an die Eingaben gebundene Entscheidung.","scopeText":"Vorläufiges Ingenieurhilfsmittel, nur für strukturierte Exporte. Die eingebauten Beispiele sind synthetisch.","analyticalLimit":"Analytischer Grenzwert","loopUncertainty":"Gesamtunsicherheit des Kreises","limitDirection":"Richtung des Grenzwerts","dirNone":"nicht angegeben","dirHigh":"oben (Auslösung bei steigendem Wert)","dirLow":"unten (Auslösung bei fallendem Wert)","category":"Kategorie","catNone":"—","catA":"Kategorie A","catB":"Kategorie B","catC":"Kategorie C","catNC":"nicht kategorisiert","marginTable":"Abstände der Sollwerte zum analytischen Grenzwert","marginAl":"Abstand nach Kreisunsicherheit","g_category_inconsistent":"Als sicherheitsbezogen markiert, aber nicht kategorisiert.","g_limit_direction_missing":"Analytischer Grenzwert ohne Richtung.","g_loop_uncertainty_missing":"Analytischer Grenzwert ohne Kreisunsicherheit.","g_setpoint_margin_negative":"Sollwert jenseits des analytischen Grenzwerts abzüglich der Kreisunsicherheit.","w_category_a_affected":"Eine Funktion der Kategorie A ist betroffen: IEC 60880 verlangt eine unabhängige Verifizierung ihrer Software.","a_independent_verification":"Veranlassen Sie eine unabhängige Verifizierung der geänderten Software (Kategorie A).","a_correct_function":"Korrigieren Sie die Sicherheitsklassifizierung der Funktion.","pkgToBaseline":"Ausgangsstand aus dem Projektpaket lesen","pkgToCandidate":"Neuen Stand aus dem Projektpaket lesen","pkgNone":"In diesem Browser ist kein Projektpaket gespeichert.","pkgRead":"{n} Datensätze in „{v}“ gelesen; Funktionen {f}, Prüfungen {t}; übersprungene Paketeinträge {s}."},"nl":{"title":"Wijziging van besturing & software","subtitle":"Semantische vergelijking van twee gestructureerde besturingsexports: wat er is gewijzigd, welke functies het raakt en welke tests herhaald moeten worden","changePanel":" rdt niet ondersteund; de rij wordt genegeerd.","g_id_missing":"De rij heeft geen ID; ze wordt genegeerd.","g_duplicate_key":"Hetzelfde record komt twee keer voor; de latere rij wordt genegeerd.","g_record_unconfirmed":"Een gewijzigd record is in een van de versies niet bevestigd.","g_unmapped_change":"Het gewijzigde record verwijst naar geen enkele functie.","g_firmware_scope_undefined":"De firmwarewijziging noemt geen functie; elke gedefinieerde functie wordt als geraakt beschouwd.","g_unknown_function":"Het record verwijst naar een functie die niet is gedefinieerd.","g_setpoint_value_invalid":"De instelwaarde is geen getal.","g_setpoint_unit_missing":"De instelwaarde heeft geen eenheid.","g_range_invalid":"Het toegestane minimum ligt boven het toegestane maximum.","g_setpoint_out_of_range":"De instelwaarde van de kandidaatversie ligt buiten het toegestane bereik.","g_requirement_uncovered":"De eis wordt door de wijziging geraakt, maar geen test dekt haar.","g_function_untested":"De functie wordt door de wijziging geraakt, maar geen test dekt haar.","g_test_unconfirmed":"De testdefinitie is niet bevestigd.","g_function_unconfirmed":"De functiedefinitie is niet bevestigd.","w_trace_only_changes":"Sommige records verschillen alleen in herkomst of commentaar; dat zijn geen semantische wijzigingen.","w_candidate_set_not_minimal":"De hertests zijn kandidaten: de set is niet bewezen minimaal en evenmin bewezen volledig.","w_safety_function_affected":"Een veiligheidsgerelateerde functie wordt geraakt: een onafhankelijke veiligheidsbeoordeling is nodig.","w_restored_values":"Opgeslagen waarden zijn bij het laden vervangen: ","a_provide_structured_export":"een gestructureerde export van deze versie aanleveren","a_import_records":"de records van beide versies importeren","a_correct_record":"het record corrigeren","a_resolve_duplicate":"het dubbele record oplossen","a_confirm_record":"het record bevestigen","a_map_to_function":"het record koppelen aan de functies die het bedient","a_define_firmware_scope":"vastleggen welke functies de firmware bedient","a_define_function":"de functie definiëren","a_correct_setpoint":"de instelwaardegegevens corrigeren","a_revise_setpoint":"de instelwaarde of het toegestane bereik herzien","a_add_test":"een test toevoegen of koppelen","a_confirm_test":"de testdefinitie bevestigen","a_confirm_function":"de functiedefinitie bevestigen","a_run_test":"deze test herhalen","a_safety_review":"een onafhankelijke veiligheidsbeoordeling uitvoeren","exControl":"Alleen commentaar en rijvolgorde (controle)","exControlNote":"Drie records van volgorde veranderd, revisies en commentaar gewijzigd: geen semantische wijziging, niets te hertesten.","exTypical":"Wijziging van instelwaarde en oorzaak-gevolgmatrix (typisch)","exTypicalNote":"Uitschakelniveau 85 → 80 %, nu 9 % onder de analytische grens na aftrek van de lusonzekerheid, en een alarm toegevoegd aan de C&E-cel: drie functies geraakt, waaronder een uitschakeling van categorie A, twee hertests, één eis zonder test.","exFirmware":"Bijwerken van de firmware van een communicatiekaart","exFirmwareNote":"4.2.1 → 4.3.0 op een kaart die alleen de dataverbinding bedient: één functie, één hertest.","exBinary":"Twee binaire PLC-images (probleem)","exBinaryNote":"Geen gestructureerde export: er wordt geen semantische vergelijking geprobeerd.","exTry":"Probeer: stemlogica gewijzigd bij een „opschoning”","exTryNote":"De stemlogica van de oorzaak 2oo3 → 1oo2 is niet aan een functie gekoppeld: de reikwijdte is niet vastgesteld.","exFix":"Oplossing: stemlogica gekoppeld aan de uitschakeling","exFixNote":"Gekoppeld aan de uitschakelfunctie: een veiligheidsfunctie van categorie A geraakt, twee hertests, een veiligheidsbeoordeling en een onafhankelijke verificatie.","learnIntroTitle":"Welke vraag het hulpmiddel beantwoordt","learnIntro":"Wat er tussen twee versies van besturingslogica of configuratie is gewijzigd, welke besturingsfuncties de wijziging raakt en welke tests herhaald moeten worden.","learnDataTitle":"Records","learnData":"Elke versie is een lijst records uit een gestructureerde export: C&E-cellen, oorzaken, gevolgen, I/O-punten, instelwaarden, firmware. Een record wordt geïdentificeerd door type, ID en veld; rijvolgorde en commentaar doen er niet toe. De records van een versie kunnen ook uit het projectpakket worden gelezen: I/O-punten, oorzaak-gevolgmatrices (oorzaken, gevolgen, cellen) en, indien opgeslagen, de besturingsfuncties en functionele tests vervangen die versie, haar functies en haar tests. De registers bevatten geen logica die alleen in het applicatieprogramma zit, geen veiligheidsclassificatie van functies, geen afhankelijkheden en geen setpointgrenzen: vul die na het inlezen aan.","learnModelTitle":"Van wijziging naar hertest","learnModel":"Een gewijzigde waarde, eenheid, functielijst of toegestaan bereik is een semantische wijziging. Ze raakt de functies die op het record staan en vervolgens elke functie die daarvan afhangt; tests van die functies en eisen worden kandidaat-hertests.","learnTryTitle":"Probeer","learnTry":"Open het voorbeeld „stemlogica gewijzigd bij een opschoning” en vergelijk. Vóór je verder leest: is dit een cosmetische wijziging?","learnExplainTitle":"Uitleg","learnExplain":"Het commentaar noemt het een opschoning, maar de stemlogica ging van 2oo3 naar 1oo2: een semantische wijziging. Omdat het record geen functie noemt, kan het hulpmiddel niet zeggen wat ze raakt en markeert het de reikwijdte als niet vastgesteld.","learnFixTitle":"Correctie","learnFix":"Koppel de oorzaak aan de uitschakelfunctie FN-TRIP: de wijziging raakt nu een veiligheidsfunctie van categorie A en de functie die ervan afhangt, twee tests zijn kandidaat en een veiligheidsbeoordeling en een onafhankelijke verificatie zijn vereist.","learnBoundaryTitle":"Waar het resultaat ophoudt","learnBoundary":"Het hulpmiddel vergelijkt alleen gestructureerde records; PLC-code en binaire images analyseert het niet. De hertestset is een kandidaatset zonder bewijs van minimaliteit of volledigheid, en goedkeuring blijft een afzonderlijke beslissing.","reportTitle":"Wijziging van besturing en software: semantische vergelijking en kandidaat-hertests","modelVersion":"Modelversie","eqNote":"Symbolen: k — recordsleutel; v, u, F, [lo, hi] — waarde, eenheid, functielijst en toegestaan bereik van een record in versie B (basis) of C (kandidaat); Δ — verzameling gewijzigde sleutels; F(Δ) — functies genoemd op gewijzigde records; D(f) — functies waarvan f afhangt; A — geraakte functies; R_A — eisen van A; T* — kandidaat-hertests; U — eisen zonder test. τ, i, φ — recordtype, ID en veld.","modelText":"Waarden die als getal te lezen zijn, worden als getal vergeleken, andere als tekst met genormaliseerde witruimte; ID's, functies en velden worden hoofdletterongevoelig vergeleken; eenheden worden als tekst vergeleken en nooit omgerekend.","boundaryText":"Het hulpmiddel stelt geen veiligheidsintegriteit van software vast, bewijst niet dat een testset volledig is en trekt geen regelgevende conclusie; goedkeuring is een afzonderlijke beslissing, gekoppeld aan de invoer.","scopeText":"Voorlopig technisch hulpmiddel, alleen voor gestructureerde exports. De ingebouwde voorbeelden zijn synthetisch.","analyticalLimit":"Analytische grens","loopUncertainty":"Totale lusonzekerheid","limitDirection":"Richting van de grens","dirNone":"niet opgegeven","dirHigh":"hoog (uitschakeling bij stijgende waarde)","dirLow":"laag (uitschakeling bij dalende waarde)","category":"Categorie","catNone":"—","catA":"categorie A","catB":"categorie B","catC":"categorie C","catNC":"niet gecategoriseerd","marginTable":"Marges van de instelwaarden tot de analytische grens","marginAl":"Marge na lusonzekerheid","g_category_inconsistent":"Als veiligheidsgerelateerd gemarkeerd maar niet gecategoriseerd.","g_limit_direction_missing":"Analytische grens zonder richting.","g_loop_uncertainty_missing":"Analytische grens zonder lusonzekerheid.","g_setpoint_margin_ne de matrice causes-effets (type)","exTypicalNote":"Seuil de déclenchement 85 → 80 %, désormais 9 % sous la limite analytique après l’incertitude de boucle, et une alarme ajoutée à la cellule C&E : trois fonctions atteintes, dont un déclenchement de catégorie A, deux essais de non-régression, une exigence sans essai.","exFirmware":"Mise à jour du micrologiciel d'une carte de communication","exFirmwareNote":"4.2.1 → 4.3.0 sur une carte qui ne dessert que la liaison de données : une fonction, un essai de non-régression.","exBinary":"Deux images binaires d'automate (problème)","exBinaryNote":"Pas d'export structuré : aucune comparaison sémantique n'est tentée.","exTry":"À tester : logique de vote modifiée lors d'un « nettoyage »","exTryNote":"La logique de vote de la cause 2oo3 → 1oo2 n'est rattachée à aucune fonction : le périmètre n'est pas établi.","exFix":"Corrigé : logique de vote rattachée au déclenchement","exFixNote":"Rattachée à la fonction de déclenchement : une fonction de sûreté de catégorie A atteinte, deux essais de non-régression, une revue de sûreté et une vérification indépendante.","learnIntroTitle":"À quoi répond l'outil","learnIntro":"Ce qui a changé entre deux versions de logique de contrôle-commande ou de configuration, quelles fonctions de contrôle-commande la modification atteint et quels essais il faut refaire.","learnDataTitle":"Enregistrements","learnData":"Chaque version est une liste d'enregistrements issus d'un export structuré : cellules C&E, causes, effets, points d'E/S, consignes, micrologiciels. Un enregistrement est identifié par son type, son ID et son champ ; l'ordre des lignes et les commentaires n'interviennent pas. Les enregistrements d’une version peuvent aussi être lus depuis le paquet projet : points d’E/S, matrices causes-effets (causes, effets, cellules) et, s’ils sont enregistrés, les fonctions de commande et les essais fonctionnels remplacent cette version, ses fonctions et ses essais. Les registres ne contiennent ni la logique présente uniquement dans le programme d’application, ni la classification de sûreté des fonctions, ni leurs dépendances, ni les limites des consignes : complétez-les après la lecture.","learnModelTitle":"De la modification à l'essai de non-régression","learnModel":"Une valeur, une unité, une liste de fonctions ou une plage admissible modifiée constitue une modification sémantique. Elle atteint les fonctions nommées sur l'enregistrement, puis chaque fonction qui en dépend ; les essais de ces fonctions et exigences deviennent des essais de non-régression candidats.","learnTryTitle":"À tester","learnTry":"Ouvrez l'exemple « logique de vote modifiée lors d'un nettoyage » et comparez. Avant de poursuivre : s'agit-il d'une retouche cosmétique ?","learnExplainTitle":"Explication","learnExplain":"Le commentaire parle de nettoyage, mais la logique de vote est passée de 2oo3 à 1oo2 : c'est une modification sémantique. Comme l'enregistrement ne nomme aucune fonction, l'outil ne peut pas dire ce qu'elle atteint et marque le périmètre comme non établi.","learnFixTitle":"Correction","learnFix":"Rattachez la cause à la fonction de déclenchement FN-TRIP : la modification atteint désormais une fonction de sûreté de catégorie A et la fonction qui en dépend, deux essais sont candidats, et une revue de sûreté ainsi qu’une vérification indépendante sont requises.","learnBoundaryTitle":"Où s'arrête le résultat","learnBoundary":"L'outil compare uniquement des enregistrements structurés ; il n'analyse ni le code d'automate ni les images binaires. L'ensemble d'essais de non-régression est un ensemble candidat dont ni la minimalité ni la complétude ne sont démontrées, et l'approbation reste une décision distincte.","reportTitle":"Modification contrôle-commande et logiciel : comparaison sémantique et essais de non-régression candidats","modelVersion":"Version du modèle","eqNote":"Symboles : k — clé d'enregistrement ; v, u, F, [lo, hi] — valeur, unité, liste de fonctions et plage admissible d'un enregistrement dans la version B (référence) ou C (candidate) ; Δ — ensemble des clés modifiées ; F(Δ) — fonctions nommées sur les enregistrements modifiés ; D(f) — fonctions dont f dépend ; A — fonctions atteintes ; R_A — exigences de A ; T* — essais de non-régression candidats ; U — exigences sans essai. τ, i, φ — type d’enregistrement, ID et champ.","modelText":"Les valeurs lisibles comme des nombres sont comparées comme des nombres, les autres comme du texte aux espaces normalisés ; les ID, fonctions et champs sont comparés sans tenir compte de la casse ; les unités sont comparées comme du texte et jamais converties.","boundaryText":"L'outil n'établit pas l'intégrité de sécurité du logiciel, ne démontre pas la complétude d'un ensemble d'essais et ne fournit aucune conclusion réglementaire ; l'approbation est une décision distincte liée aux données.","scopeText":"Aide d'ingénierie préliminaire, réservée aux exports structurés. Les exemples intégrés sont synthétiques.","analyticalLimit":"Limite analytique","loopUncertainty":"Incertitude totale de boucle","limitDirection":"Sens de la limite","dirNone":"non indiqué","dirHigh":"haute (déclenchement sur valeur croissante)","dirLow":"basse (déclenchement sur valeur décroissante)","category":"Catégorie","catNone":"—","catA":"catégorie A","catB":"catégorie B","catC":"catégorie C","catNC":"non classée","marginTable":"Marges des consignes à la limite analytique","marginAl":"Marge après incertitude de boucle","g_category_inconsistent":"Marquée liée à la sûreté mais non classée.","g_limit_direction_missing":"Limite analytique sans sens.","g_loop_uncertainty_missing":"Limite analytique sans incertitude de boucle.","g_setpoint_margin_negative":"Consigne au-delà de la limite analytique moins l’incertitude de boucle.","w_category_a_affected":"Une fonction de catégorie A est atteinte : l’IEC 60880 demande une vérification indépendante de son logiciel.","a_independent_verification":"Faites vérifier le logiciel modifié de ma ecisión","decisionReason":"Motivo de la decisión","decPending":"pendiente","decApproved":"aprobado","decRejected":"rechazado","decStale":"aprobación caducada: datos modificados","decNoReason":"aprobación sin motivo","decisionBasis":"La decisión está vinculada a los datos para los que se tomó; cualquier cambio la deja caducada.","run":"Comparar","results":"Resultados","changeClass":"Clase de cambio","cls_none":"sin cambio semántico","cls_non_safety":"cambio fuera de las funciones de seguridad","cls_safety":"función de seguridad afectada","cls_unknown":"alcance no establecido","semanticChanges":"Cambios semánticos","traceOnly":"solo procedencia o comentario","unchanged":"sin cambios","affectedFunctions":"Funciones alcanzadas","candidateTests":"Pruebas de regresión candidatas","uncovered":"Requisitos sin prueba","retestPlan":"Plan de pruebas de regresión","critMet":"completo para los datos dados","critNotMet":"consigna fuera de su rango admisible","changeTable":"Cambios","record":"Registro","change":"Cambio","ch_added":"añadido","ch_removed":"eliminado","ch_modified":"modificado","ch_trace_only":"solo procedencia o comentario","f_value":"valor","f_unit":"unidad","f_functions":"funciones","f_range":"rango admisible","functionTable":"Funciones alcanzadas","impact":"Alcanzada","imp_direct":"directamente","imp_indirect":"a través de una dependencia","testTable":"Pruebas de regresión","role":"Papel","roleTest":"prueba de regresión candidata","roleUncovered":"requisito sin prueba","gapTable":"Puntos abiertos","gap":"Punto","actions":"Acciones","action":"Acción","warning":"Nota","plot":"Mapa de impacto: registros modificados (izquierda), funciones que alcanzan (centro), pruebas de regresión candidatas y requisitos sin prueba (derecha)","colChanges":"Registros modificados","colFunctions":"Funciones","colTests":"Pruebas de regresión","noSemantic":"Sin cambio semántico","noResult":"Aún no hay resultado","verdictBlocked":"No se pueden comparar las versiones: véanse los motivos.","verdict_none":"Sin cambio semántico: solo difieren el orden de las filas, los comentarios o la procedencia.","verdict_non_safety":"Los cambios semánticos alcanzan funciones fuera de las funciones de seguridad; se enumeran las pruebas de regresión candidatas.","verdict_safety":"Se alcanza una función relacionada con la seguridad; se requieren las pruebas de regresión candidatas y una revisión de seguridad.","verdict_unknown":"Un cambio no puede vincularse a una función definida, por lo que su alcance no está establecido.","b_unsupported_format":"Esta versión no es una exportación estructurada; no se intenta ninguna comparación semántica.","b_no_records":"Ninguna de las versiones contiene registros.","g_kind_unsupported":"El tipo de registro no está admitido; se ignora la fila.","g_id_missing":"La fila no tiene ID; se ignora.","g_duplicate_key":"El mismo registro aparece dos veces; se ignora la fila posterior.","g_record_unconfirmed":"Un registro modificado no está confirmado en una de las versiones.","g_unmapped_change":"El registro modificado no remite a ninguna función.","g_firmware_scope_undefined":"El cambio de firmware no nombra ninguna función; todas las funciones definidas se consideran alcanzadas.","g_unknown_function":"El registro remite a una función no definida.","g_setpoint_value_invalid":"El valor de la consigna no es un número.","g_setpoint_unit_missing":"La consigna no tiene unidad.","g_range_invalid":"El mínimo admisible es superior al máximo admisible.","g_setpoint_out_of_range":"La consigna de la versión candidata está fuera de su rango admisible.","g_requirement_uncovered":"El cambio alcanza el requisito, pero ninguna prueba lo cubre.","g_function_untested":"El cambio alcanza la función, pero ninguna prueba la cubre.","g_test_unconfirmed":"La definición de la prueba no está confirmada.","g_function_unconfirmed":"La definición de la función no está confirmada.","w_trace_only_changes":"Algunos registros solo difieren en la procedencia o el comentario; no son cambios semánticos.","w_candidate_set_not_minimal":"Las pruebas de regresión son candidatas: no está demostrado que el conjunto sea mínimo ni que sea completo.","w_safety_function_affected":"Se alcanza una función relacionada con la seguridad: se necesita una revisión de seguridad independiente.","w_restored_values":"Al cargar se sustituyeron valores guardados: ","a_provide_structured_export":"proporcionar una exportación estructurada de esta versión","a_import_records":"importar los registros de ambas versiones","a_correct_record":"corregir el registro","a_resolve_duplicate":"resolver el registro duplicado","a_confirm_record":"confirmar el registro","a_map_to_function":"asignar el registro a las funciones a las que sirve","a_define_firmware_scope":"definir a qué funciones sirve el firmware","a_define_function":"definir la función","a_correct_setpoint":"corregir los datos de la consigna","a_revise_setpoint":"revisar la consigna o su rango admisible","a_add_test":"añadir o vincular una prueba","a_confirm_test":"confirmar la definición de la prueba","a_confirm_function":"confirmar la definición de la función","a_run_test":"repetir esta prueba","a_safety_review":"realizar una revisión de seguridad independiente","exControl":"Solo comentarios y orden de filas (control)","exControlNote":"Tres registros reordenados, revisiones y comentarios modificados: sin cambio semántico, nada que repetir.","exTypical":"Cambio de consigna y de matriz causa-efecto (típico)","exTypicalNote":"Nivel de disparo 85 → 80 %, ahora un 9 % por debajo del límite analítico tras la incertidumbre del lazo, y una alarma añadida a la celda C&E: tres funciones alcanzadas, entre ellas un disparo de categoría A, dos pruebas de regresión, un requisito sin prueba.","exFirmware":"Actualización del firmware de una tarjeta de comunicaciones","exFirmwareNote":"4.2.1 → 4.3.0 en una tarjeta que solo sirve al enlace de datos: una función, una prueba de regresión.","exBinary":"Dos imágenes binarias de PLC (problema)","exBinaryNote":"Sin exportación estructurada: no se intenta ninguna comparación semántica.","exTry":"Ejercicio: votación cambiada en una «limpieza»","exTryNote":"La votación de la causa 2oo3 → 1oo2 no está asignada a ninguna función: el alcance no está establecido.","exFix":"Solución: votación asignada al disparo","exFixNote":"Asignada a la función de disparo: una función de seguridad de categoría A alcanzada, dos pruebas de regresión, una revisión de seguridad y una verificación independiente.","learnIntroTitle":"Qué responde la herramienta","learnIntro":"Qué cambió entre dos versiones de la lógica de control o de la configuración, a qué funciones de control alcanza el cambio y qué pruebas deben repetirse.","learnDataTitle":"Registros","learnData":"Cada versión es una lista de registros de una exportación estructurada: celdas C&E, causas, efectos, puntos de E/S, consignas, firmware. Un registro se identifica por tipo, ID y campo; el orden de las filas y los comentarios no importan. Los registros de una versión también pueden leerse del paquete del proyecto: puntos de E/S, matrices causa-efecto (causas, efectos, celdas) y, si están guardadas, las funciones de control y las pruebas funcionales sustituyen esa versión, sus funciones y sus pruebas. Los registros no contienen la lógica que solo está en el programa de aplicación, la clasificación de seguridad de las funciones, sus dependencias ni los límites de consigna: complételos después de leer.","learnModelTitle":"Del cambio a la prueba de regresión","learnModel":"Un valor, una unidad, una lista de funciones o un rango admisible modificados constituyen un cambio semántico. Alcanza las funciones nombradas en el registro y luego cada función que depende de ellas; las pruebas de esas funciones y requisitos pasan a ser pruebas de regresión candidatas.","learnTryTitle":"Ejercicio","learnTry":"Abra el ejemplo «votación cambiada en una limpieza» y compare. Antes de seguir leyendo: ¿es una edición cosmética?","learnExplainTitle":"Explicación","learnExplain":"El comentario lo llama limpieza, pero la votación pasó de 2oo3 a 1oo2: un cambio semántico. Como el registro no nombra ninguna función, la herramienta no puede decir a qué alcanza y marca el alcance como no establecido.","learnFixTitle":"Corrección","learnFix":"Asigne la causa a la función de disparo FN-TRIP: el cambio alcanza ahora una función de seguridad de categoría A y la función que depende de ella, dos pruebas son candidatas y se requieren una revisión de seguridad y una verificación independiente.","learnBoundaryTitle":"Dónde termina el resultado","learnBoundary":"La herramienta solo compara registros estructurados; no analiza código de PLC ni imágenes binarias. El conjunto de pruebas de regresión es un conjunto candidato sin minimalidad ni completitud demostradas, y la aprobación sigue siendo una decisión aparte.","reportTitle":"Cambio de control y software: comparación semántica y pruebas de regresión candidatas","modelVersion":"Versión del modelo","eqNote":"Símbolos: k — clave del registro; v, u, F, [lo, hi] — valor, unidad, lista de funciones y rango admisible de un registro en la versión B (referencia) o C (candidata); Δ — conjunto de claves modificadas; F(Δ) — funciones nombradas en los registros modificados; D(f) — funciones de las que depende f; A — funciones alcanzadas; R_A — requisitos de A; T* — pruebas de regresión candidatas; U — requisitos sin prueba. τ, i, φ — tipo de registro, ID y campo.","modelText":"Los valores que se leen como números se comparan como números; los demás, como texto con espacios normalizados; los ID, funciones y campos se comparan sin distinguir mayúsculas de minúsculas; las unidades se comparan como texto y nunca se convierten.","boundaryText":"La herramienta no establece la integridad de seguridad del software, no demuestra que un conjunto de pruebas sea completo ni emite conclusiones regulatorias; la aprobación es una decisión aparte vinculada a los datos.","scopeText":"A
