  "description": {
    "en": "Interactive 2.5D outdoor industrial-noise editor with octave-band point, line and area sources. The propagation kernel evaluates CNOSSOS-EU geometric divergence, ISO 9613-1 atmospheric absorption, user-defined TIN terrain with mean-ground-plane equivalent heights, path-dependent ground effect, H/F/LT propagation, horizontal multiple-edge diffraction, lateral diffraction around vertical edges for real point sources, and optional first/second-order image-source reflections with octave-band absorption and retrodiffraction. Receivers expose vertical, lateral and reflected contributions, terrain sections and noise maps. Reflected paths are unfolded to a flattened Chinese Screen so intervening horizontal-edge diffraction is evaluated in the same H/F boundary kernel; favourable reflections use common-radius curved rays in the unfolded vertical plane.",
    "uk": "Інтерактивний 2.5D-редактор промислового зовнішнього шуму з точковими, лінійними та площинними джерелами в октавних смугах. Ядро обчислює геометричне розходження CNOSSOS-EU, атмосферне поглинання ISO 9613-1, заданий користувачем TIN-рельєф з еквівалентними висотами від середньої площини ґрунту, залежний від траси ефект ґрунту, умови H/F/LT, горизонтальну множинну дифракцію, бічну дифракцію на вертикальних кромках для реальних точкових джерел та опційні дзеркальні відбиття першого/другого порядку з октавним поглинанням і ретродифракцією. Для приймачів показуються вертикальний, бічний та відбитий внески, переріз рельєфу й карти шуму. Відбиті траси розгортаються у flattened Chinese Screen, де проміжна дифракція на горизонтальних кромках розраховується тим самим H/F-ядром; favourable-відбиття використовують дуги спільного радіуса в розгорнутій вертикальній площині.",
    "de": "Interaktiver 2,5D-Editor für industriellen Außenlärm mit Punkt-, Linien- und Flächenquellen in Oktavbändern. Der Ausbreitungskern berechnet CNOSSOS-EU-Geometriedivergenz, atmosphärische Dämpfung nach ISO 9613-1, benutzerdefiniertes TIN-Gelände mit äquivalenten Höhen zur mittleren Bodenebene, pfadabhängigen Bodeneffekt, H/F/LT-Ausbreitung, horizontale Mehrfachbeugung, Seitenbeugung an vertikalen Kanten für reale Punktquellen sowie optionale Spiegelquellenreflexionen erster/zweiter Ordnung mit Oktavbandabsorption und Retrodiffraktion. Empfänger zeigen vertikale, seitliche und reflektierte Beiträge, Geländeschnitt und Lärmkarten. Reflektierte Pfade werden zu einem flattened Chinese Screen entfaltet; dazwischenliegende horizontale Beugung wird im selben H/F-Grenzterm ausgewertet, und günstige Reflexionen verwenden gekrümmte Strahlen mit gemeinsamem Radius in der entfalteten Vertikalebene.",
    "nl": "Interactieve 2,5D-editor voor industrieel buitengeluid met punt-, lijn- en vlakbronnen per octaafband. De propagatiekern berekent CNOSSOS-EU geometrische divergentie, atmosferische absorptie volgens ISO 9613-1, door de gebruiker gedefinieerd TIN-terrein met equivalente hoogten t.o.v. het gemiddelde grondvlak, padafhankelijk bodemeffect, H/F/LT-propagatie, horizontale meervoudige diffractie, zijwaartse diffractie rond verticale randen voor echte puntbronnen en optionele eerste/tweede-orde beeldbronreflecties met octaafbandabsorptie en retrodiffractie. Ontvangers tonen verticale, zijwaartse en gereflecteerde bijdragen, terreindoorsneden en geluidskaarten. Gereflecteerde paden worden ontvouwen tot een flattened Chinese Screen; tussenliggende horizontale diffractie gebruikt dezelfde H/F-kern en gunstige reflecties volgen gebogen stralen met gemeenschappelijke straal in het ontvouwde verticale vlak.",
    "fr": "Éditeur 2,5D interactif du bruit industriel extérieur avec sources ponctuelles, linéiques et surfaciques par bandes d’octave. Le noyau calcule la divergence géométrique CNOSSOS-EU, l’absorption atmosphérique ISO 9613-1, un terrain TIN défini par l’utilisateur avec hauteurs équivalentes au plan moyen du sol, l’effet de sol dépendant du trajet, la propagation H/F/LT, la diffraction horizontale multiple, la diffraction latérale sur arêtes verticales pour les sources ponctuelles réelles et des réflexions optionnelles d’ordre 1/2 par source image avec absorption par octave et rétrodiffraction. Les récepteurs exposent les contributions verticales, latérales et réfléchies, les coupes du terrain et les cartes de bruit. Les trajets réfléchis sont dépliés en flattened Chinese Screen ; la diffraction horizontale intermédiaire utilise le même noyau H/F et les réflexions favorables suivent des rayons courbes de rayon commun dans le plan vertical déplié.",
    "es": "Editor 2,5D interactivo de ruido industrial exterior con fuentes puntuales, lineales y superficiales por bandas de octava. El núcleo calcula divergencia geométrica CNOSSOS-EU, absorción atmosférica ISO 9613-1, terreno TIN definido por el usuario con alturas equivalentes al plano medio del suelo, efecto del suelo dependiente de la trayectoria, propagación H/F/LT, difracción horizontal múltiple, difracción lateral alrededor de bordes verticales para fuentes puntuales reales y reflexiones opcionales de primer/segundo orden mediante fuentes imagen con absorción por octava y retrodifracción. Los receptores muestran contribuciones verticales, laterales y reflejadas, secciones del terreno y mapas de ruido. Las trayectorias reflejadas se despliegan como flattened Chinese Screen; la difracción intermedia en bordes horizontales usa el mismo núcleo H/F. Las reflexiones favorables emplean rayos curvos de radio común en el plano vertical desplegado.",

  "limitations": {
    "en": "Terrain is a piecewise-planar TIN from user-entered nodes; outside its convex hull the nearest TIN edge is extended. Source/receiver z is height above local terrain. Ground regions define G and industrial-source Gs is explicit. Horizontal multiple-edge diffraction uses the shortest convex rubber-band path. Lateral diffraction is limited to real point sources, up to two convex side paths. Reflections use vertical barrier/building faces only, first or second order, with octave-band absorption, retrodiffraction, curved favourable rays, apparent reflector dimensions and flattened-Chinese-Screen mixed diffraction. Reflector tilt is not user-defined. Line/area sources are discretized. Detailed source directivity and finite obstacle thickness are not solved. Use for exploration and preliminary assessment, not compliance assessment. For mixed reflection–diffraction paths, retrodiffraction is still evaluated locally at each reflector; the CNOSSOS complex-path rule that truncates the retrodiffraction construction at the first diffraction point is not yet implemented.",
    "uk": "Рельєф задається кусково-площинною TIN з введених вузлів; поза її опуклою оболонкою продовжується найближче ребро TIN. z джерела/приймача — висота над місцевим рельєфом. Ділянки ґрунту задають G, а Gs промислового джерела вводиться явно. Горизонтальна множинна дифракція використовує найкоротшу опуклу rubber-band трасу. Бічна дифракція обмежена реальними точковими джерелами й двома опуклими боковими трасами. Відбиття враховуються лише від вертикальних граней екранів/будівель, до другого порядку, з октавним поглинанням, ретродифракцією, кривими favourable-променями, видимими розмірами відбивача та mixed diffraction через flattened Chinese Screen. Нахил відбивача не задається. Лінійні/площинні джерела дискретизуються. Детальна спрямованість і скінченна товщина перешкод не розв’язуються. Для дослідження та попередньої оцінки, не для оцінки відповідності. Для змішаних reflection–diffraction трас ретродифракція поки оцінюється локально на кожному відбивачі; правило CNOSSOS для складних трас із побудовою ретродифракції до першої точки дифракції ще не реалізовано.",
    "de": "Das Gelände wird als stückweise planes TIN aus eingegebenen Knoten modelliert; außerhalb der konvexen Hülle wird die nächstgelegene TIN-Kante fortgesetzt. z von Quelle/Empfänger ist die Höhe über lokalem Gelände. Bodenflächen definieren G, industrielles Gs ist explizit. Horizontale Mehrfachbeugung nutzt den kürzesten konvexen Rubber-Band-Pfad. Seitenbeugung ist auf reale Punktquellen und höchstens zwei konvexe Seitenpfade beschränkt. Reflexionen werden nur an vertikalen Schirm-/Gebäudeflächen bis zur zweiten Ordnung berücksichtigt, mit Oktavbandabsorption, Retrodiffraktion, gekrümmten günstigen Strahlen, scheinbaren Reflektorabmessungen und gemischter Beugung über einen flattened Chinese Screen. Reflektorneigung ist nicht einstellbar. Linien-/Flächenquellen werden diskretisiert. Detaillierte Richtwirkung und endliche Hindernisdicke werden nicht gelöst. Für Untersuchung und Vorbemessung, nicht für Konformitätsnachweise. Bei gemischten Reflexions-/Beugungspfaden wird die Retrodiffraktion noch lokal an jedem Reflektor bewertet; die CNOSSOS-Regel für komplexe Pfade mit Begrenzung der Retrodiffraktionskonstruktion am ersten Beugungspunkt ist noch nicht implementiert.",
    "nl": "Het terrein is een stukgewijs vlak TIN uit ingevoerde knopen; buiten de convexe huls wordt de dichtstbijzijnde TIN-rand verlengd. z van bron/ontvanger is hoogte boven lokaal terrein. Bodemgebieden definiëren G en Gs van industriële bronnen is expliciet. Horizontale meervoudige diffractie gebruikt het kortste convexe rubber-bandpad. Zijwaartse diffractie is beperkt tot echte puntbronnen en maximaal twee convexe zijpaden. Reflecties worden alleen berekend aan verticale scherm-/gebouwvlakken, tot tweede orde, met octaafbandabsorptie, retrodiffractie, gebogen gunstige stralen, schijnbare reflectorafmetingen en gemengde diffractie via een flattened Chinese Screen. Reflectorhelling is niet instelbaar. Lijn-/vlakbronnen worden gediscretiseerd. Gedetailleerde directiviteit en eindige obstakeldikte worden niet opgelost. Voor onderzoek en voorlopige beoordeling, niet voor conformiteitsbeoordeling. Bij gemengde reflectie-/diffractiepaden wordt retrodiffractie nog lokaal per reflector bepaald; de CNOSSOS-regel voor complexe paden waarbij de retrodiffractieconstructie bij het eerste diffractiepunt wordt afgekapt, is nog niet geïmplementeerd.",
    "fr": "Le terrain est un TIN plan par morceaux construit à partir des nœuds saisis; hors de son enveloppe convexe, l’arête TIN la plus proche est prolongée. z de la source/du récepteur est la hauteur au-dessus du terrain local. Les zones de sol définissent G et Gs des sources industrielles est explicite. La diffraction horizontale multiple utilise le plus court chemin convexe de type rubber-band. La diffraction latérale est limitée aux sources ponctuelles réelles et à deux trajets latéraux convexes au maximum. Les réflexions sont limitées aux faces verticales des écrans/bâtiments, jusqu’au second ordre, avec absorption par octave, rétrodiffraction, rayons favorables courbes, dimensions apparentes du réflecteur et diffraction mixte via un flattened Chinese Screen. L’inclinaison du réflecteur n’est pas paramétrable. Les sources linéiques/surfaciques sont discrétisées. Directivité détaillée et épaisseur finie des obstacles non résolues. Pour exploration et évaluation préliminaire, pas pour conformité. Pour les trajets mixtes réflexion–diffraction, la rétrodiffraction est encore évaluée localement à chaque réflecteur; la règle CNOSSOS des trajets complexes qui tronque la construction de rétrodiffraction au premier point de diffraction n’est pas encore implémentée.",
    "es": "El terreno es un TIN plano por tramos generado a partir de nodos introducidos; fuera de la envolvente convexa se prolonga el borde TIN más cercano. z de fuente/receptor es altura sobre el terreno local. Las áreas de suelo definen G y Gs de fuentes industriales es explícito. La difracción horizontal múltiple usa la trayectoria convexa más corta tipo rubber-band. La difracción lateral se limita a fuentes puntuales reales y como máximo dos trayectorias laterales convexas. Las reflexiones se calculan solo en caras verticales de pantallas/edificios, hasta segundo orden, con absorción por octava, retrodifracción, rayos favorables curvos, dimensiones aparentes del reflector y difracción mixta mediante flattened Chinese Screen. La inclinación del reflector no es configurable. Las fuentes lineales/superficiales se discretizan. No se resuelven directividad detallada ni espesor finito de obstáculos. Para exploración y evaluación preliminar, no para conformidad. Para trayectorias mixtas reflexión–difracción, la retrodifracción aún se evalúa localmente en cada reflector; todavía no se implementa la regla CNOSSOS para trayectorias complejas que trunca la construcción de retrodifracción en el primer punto de difracción.",
    "pl": "Teren jest kawałkami płaskiej sieci TIN z węzłów wprowadzonych przez użytkownika; poza jej wypukłą powłoką najbliższa krawędź TIN jest przedłużona. Źródło/odbiornik z to wysokość nad lokalnym terenem. Regiony naziemne definiują G, a źródło przemysłowe Gs jest jawne. Pozioma dyfrakcja wielokrawędziowa wykorzystuje najkrótszą wypukłą ścieżkę gumową. Dyfrakcja boczna jest ograniczona do rzeczywistych źródeł punktowych, do dwóch wypukłych ścieżek bocznych. Odbicia wykorzystują tylko pionowe ściany bariery/budynku, pierwszego lub drugiego rzędu, z absorpcją pasma oktawowego, retrodyfrakcją, zakrzywionymi korzystnymi promieniami, pozornymi wymiarami reflektora i mieszaną dyfrakcją spłaszczonego ekranu chińskiego. Pochylenie reflektora nie jest zdefiniowane przez użytkownika. Źródła liniowe/obszarowe są dyskretyzowane. Szczegółowa kierunkowość źródła i skończona grubość przeszkody nie zostały rozwiązane. Użyj do eksploracji i wstępnej oceny, a nie oceny zgodności. W przypadku mieszanych ścieżek odbicia i dyfrakcji retrodyfrakcja jest nadal oceniana lokalnie w każdym reflektorze; Reguła CNOSSOS dotycząca złożonych ścieżek, która obcina konstrukcję retrodyfrakcji w pierwszym punkcie dyfrakcyjnym, nie została jeszcze zaimplementowana."

  "validation": {
    "basis": {
      "en": "The 230-case artifact was re-executed on 2026-08-22 against this build (manifest revision 2026-08-15.compute-runtime-port): 230 of 230 cases pass, plus 7 added cases, and two consecutive runs are bit-identical. Every reference value is recomputed and none is reused: an independent Python implementation written from ISO 9613-1:1993 clause 6 equations (3)-(5) and CNOSSOS-EU (Directive (EU) 2015/996) Annex II section 2.5.6 equations 2.5.11-2.5.22, cross-checked against the published ISO 9613-2 Table 2 attenuation row for 10 C / 70 % and against the third-party python-acoustics implementation of ISO 9613-1, which agrees to 4.3e-14 dB/km over all 40 atmospheric states. Worst residual by group: atmosphere 5.7e-14 dB/km, ground 4.4e-16 dB, diffraction 8.9e-16 dB, geometry and reflection exactly 0, assembly 1.4e-14 dB; no tolerance was widened. Two things a reader should weigh. The equation terms are not reachable from the page - the tool is one IIFE and publishes no physics globals - so the harness appends one read-only block to the file the server actually returns, asserts that the instrumented body is the served bytes plus exactly that block, and records both md5 sums; the page's own path inspector agrees with the instrumented calls to its printed rounding of 0.05 dB, but the 0.002 dB this benchmark grades at is defensible only on internals. And 110 of the cases had inputs the 2026-08-14 artifact never recorded; they were recovered by inverting the independent implementation against the recorded numbers (residual 0 for all five ground geometries, 1.1e-13 or better for the arcs) and are marked inputs_recovered. The harness is the author's own; no external party has reviewed it.",
      "uk": "Артефакт із 230 випадків повторно виконано 2026-08-22 на цій збірці (ревізія маніфесту 2026-08-15.compute-runtime-port): проходять 230 із 230 випадків плюс 7 доданих, а два послідовні прогони збігаються побітово. Кожне еталонне значення переобчислено, жодне не взято зі сховища: незалежна реалізація на Python, написана за ISO 9613-1:1993, розділ 6, рівняння (3)-(5), і CNOSSOS-EU (Директива (ЄС) 2015/996), додаток II, п. 2.5.6, рівняння 2.5.11-2.5.22, перехресно звірена з опублікованим рядком таблиці 2 ISO 9613-2 для 10 C / 70 % і зі сторонньою реалізацією ISO 9613-1 у python-acoustics, яка збігається до 4,3e-14 дБ/км на всіх 40 станах атмосфери. Найгірший залишок за групами: атмосфера 5,7e-14 дБ/км, ґрунт 4,4e-16 дБ, дифракція 8,9e-16 дБ, геометрія та відбиття рівно 0, збірка 1,4e-14 дБ; жодного допуску не розширено. Дві речі, які читач має зважити. Члени рівнянь недосяжні зі сторінки - інструмент є одним IIFE і не публікує глобальних функцій фізики - тому стенд додає один блок лише для читання до файлу, який справді віддає сервер, перевіряє, що інструментоване тіло дорівнює відданим байтам плюс рівно цей блок, і записує обидві суми md5; власний інспектор шляхів сторінки збігається з інструментованими викликами до своєї друкованої точності 0,05 дБ, але допуск 0,002 дБ, за яким оцінює цей бенчмарк, виправданий лише на внутрішніх викликах. А в 110 випадках вхідні дані артефакт від 2026-08-14 ніколи не записував; їх відновлено оберненням незалежної реалізації за записаними числами (залишок 0 для всіх п'яти геометрій ґрунту, 1,1e-13 або краще для дуг) і позначено inputs_recovered. Стенд належить авторові; сторонньої перевірки не проводилося.",
      "de": "Das Artefakt mit 230 Fällen wurde am 2026-08-22 gegen diesen Build erneut ausgeführt (Manifest-Revision 2026-08-15.compute-runtime-port): 230 von 230 Fällen bestehen, dazu 7 hinzugefügte Fälle, und zwei aufeinanderfolgende Läufe sind bitgleich. Jeder Referenzwert wird neu berechnet, keiner wiederverwendet: eine unabhängige Python-Implementierung nach ISO 9613-1:1993 Abschnitt 6 Gleichungen (3)-(5) und CNOSSOS-EU (Richtlinie (EU) 2015/996) Anhang II Abschnitt 2.5.6 Gleichungen 2.5.11-2.5.22, gegengeprüft an der veröffentlichten Zeile der ISO-9613-2-Tabelle 2 für 10 C / 70 % und an der fremden ISO-9613-1-Implementierung von python-acoustics, die über alle 40 Atmosphärenzustände auf 4,3e-14 dB/km übereinstimmt. Groesster Restfehler je Gruppe: Atmosphäre 5,7e-14 dB/km, Boden 4,4e-16 dB, Beugung 8,9e-16 dB, Geometrie und Reflexion exakt 0, Zusammenbau 1,4e-14 dB; keine Toleranz wurde aufgeweitet. Zwei Punkte zur Abwägung. Die Gleichungsterme sind von der Seite aus nicht erreichbar - das Werkzeug ist ein einziges IIFE und veröffentlicht keine Physik-Globals -, daher hängt der Prüfstand genau einen nur lesenden Block an die Datei an, die der Server tatsächlich liefert, prüft, dass der instrumentierte Rumpf die ausgelieferten Bytes plus genau diesen Block ist, und protokolliert beide md5-Summen; der seiteneigene Pfadinspektor stimmt mit den instrumentierten Aufrufen bis zu seiner gedruckten Rundung von 0,05 dB überein, doch die 0,002 dB, nach denen dieser Benchmark bewertet, sind nur an den Interna vertretbar. Und bei 110 Fällen hat das Artefakt vom 2026-08-14 die Eingaben nie festgehalten; sie wurden durch Invertierung der unabhängigen Implementierung gegen die aufgezeichneten Zahlen zurückgewonnen (Restfehler 0 für alle fünf Bodengeometrien, 1,1e-13 oder besser für die Boegen) und sind als inputs_recovered gekennzeichnet. Der Prüfstand stammt vom Autor selbst; eine Prüfung durch Dritte fand nicht statt.",
      "nl": "Het artefact met 230 gevallen is op 2026-08-22 opnieuw uitgevoerd tegen deze build (manifestrevisie 2026-08-15.compute-runtime-port): 230 van de 230 gevallen slagen, plus 7 toegevoegde gevallen, en twee opeenvolgende runs zijn bit-identiek. Elke referentiewaarde wordt opnieuw berekend en geen enkele wordt hergebruikt: een onafhankelijke Python-implementatie geschreven naar ISO 9613-1:1993 hoofdstuk 6 vergelijkingen (3)-(5) en CNOSSOS-EU (Richtlijn (EU) 2015/996) bijlage II paragraaf 2.5.6 vergelijkingen 2.5.11-2.5.22, gecontroleerd tegen de gepubliceerde regel van ISO 9613-2 tabel 2 voor 10 C / 70 % en tegen de externe ISO 9613-1-implementatie van python-acoustics, die over alle 40 atmosfeertoestanden tot 4,3e-14 dB/km overeenkomt. Grootste restfout per groep: atmosfeer 5,7e-14 dB/km, bodem 4,4e-16 dB, diffractie 8,9e-16 dB, geometrie en reflectie exact 0, samenstelling 1,4e-14 dB; geen enkele tolerantie is verruimd. Twee dingen om te wegen. De termen van de vergelijkingen zijn vanaf de pagina niet bereikbaar - de tool is een enkele IIFE en publiceert geen fysica-globals - dus voegt de testbank precies een alleen-lezen blok toe aan het bestand dat de server werkelijk teruggeeft, controleert dat het geinstrumenteerde bestand gelijk is aan de geleverde bytes plus precies dat blok, en legt beide md5-sommen vast; de eigen padinspecteur van de pagina komt overeen met de geinstrumenteerde aanroepen tot zijn afdrukprecisie van 0,05 dB, maar de 0,002 dB waarop deze benchmark beoordeelt is alleen op de interne aanroepen verdedigbaar. En bij 110 gevallen heeft het artefact van 2026-08-14 de invoer nooit vastgelegd; die is teruggewonnen door de onafhankelijke implementatie te inverteren tegen de vastgelegde getallen (restfout 0 voor alle vijf bodemgeometrieen, 1,1e-13 of beter voor de bogen) en is gemarkeerd als inputs_recovered. De testbank is van de auteur zelf; er is geen review door derden.",
      "fr": "L'artefact de 230 cas a ete re-execute le 2026-08-22 sur cette version (revision de manifeste 2026-08-15.compute-runtime-port) : 230 cas sur 230 passent, plus 7 cas ajoutes, et deux executions consecutives sont identiques au bit pres. Chaque valeur de reference est recalculee et aucune n'est reprise : une implementation Python independante ecrite d'apres l'ISO 9613-1:1993 article 6 equations (3)-(5) et CNOSSOS-EU (directive (UE) 2015/996) annexe II section 2.5.6 equations 2.5.11-2.5.22, recoupee avec la ligne publiee du tableau 2 de l'ISO 9613-2 pour 10 C / 70 % et avec l'implementation tierce de l'ISO 9613-1 de python-acoustics, qui concorde a 4,3e-14 dB/km sur les 40 etats atmospheriques. Residu le plus grand par groupe : atmosphere 5,7e-14 dB/km, sol 4,4e-16 dB, diffraction 8,9e-16 dB, geometrie et reflexion exactement 0, assemblage 1,4e-14 dB ; aucune tolerance n'a ete elargie. Deux points a peser. Les termes des equations ne sont pas accessibles depuis la page - l'outil est une seule IIFE et ne publie aucune fonction de physique globale -, si bien que le banc ajoute un unique bloc en lecture seule au fichier que le serveur renvoie reellement, verifie que le corps instrumente est bien les octets servis plus exactement ce bloc, et enregistre les deux sommes md5 ; l'inspecteur de trajets de la page concorde avec les appels instrumentes a sa precision d'affichage de 0,05 dB, mais les 0,002 dB sur lesquels ce banc note ne sont defendables que sur les valeurs internes. Et pour 110 cas, l'artefact du 2026-08-14 n'a jamais consigne les entrees ; elles ont ete retrouvees en inversant l'implementation independante sur les nombres enregistres (residu 0 pour les cinq geometries de sol, 1,1e-13 ou mieux pour les arcs) et sont marquees inputs_recovered. Le banc d'essai est celui de l'auteur ; aucune revue externe n'a eu lieu.",
      "es": "El artefacto de 230 casos se volvio a ejecutar el 2026-08-22 sobre esta compilacion (revision de manifiesto 2026-08-15.compute-runtime-port): pasan 230 de 230 casos, mas 7 casos anadidos, y dos ejecuciones consecutivas son identicas bit a bit. Cada valor de referencia se recalcula y ninguno se reutiliza: una implementacion independiente en Python escrita a partir de la norma ISO 9613-1:1993 capitulo 6 ecuaciones (3)-(5) y de CNOSSOS-EU (Directiva (UE) 2015/996) anexo II apartado 2.5.6 ecuaciones 2.5.11-2.5.22, contrastada con la fila publicada de la tabla 2 de la ISO 9613-2 para 10 C / 70 % y con la implementacion de terceros de la ISO 9613-1 de python-acoustics, que concuerda hasta 4,3e-14 dB/km en los 40 estados atmosfericos. Residuo mayor por grupo: atmosfera 5,7e-14 dB/km, suelo 4,4e-16 dB, difraccion 8,9e-16 dB, geometria y reflexion exactamente 0, ensamblaje 1,4e-14 dB; no se amplio ninguna tolerancia. Dos cosas que el lector debe sopesar. Los terminos de las ecuaciones no son alcanzables desde la pagina - la herramienta es una sola IIFE y no publica funciones de fisica globales -, de modo que el banco anade un unico bloque de solo lectura al archivo que el servidor devuelve realmente, comprueba que el cuerpo instrumentado son los bytes servidos mas exactamente ese bloque, y registra ambas sumas md5; el inspector de trayectos de la propia pagina concuerda con las llamadas instrumentadas hasta su redondeo impreso de 0,05 dB, pero los 0,002 dB con los que califica este banco solo son defendibles sobre los valores internos. Y en 110 casos el artefacto del 2026-08-14 nunca registro las entradas; se recuperaron invirtiendo la implementacion independiente sobre los numeros registrados (residuo 0 en las cinco geometrias de suelo, 1,1e-13 o mejor en los arcos) y se marcan como inputs_recovered. El banco de pruebas es del propio autor; no ha habido revision externa.",
      "pl": "Artefakt 230 przypadków został ponownie wykonany 22.08.2026 r. w tej kompilacji (wersja manifestu 2026-08-15.compute-runtime-port): 230 z 230 przypadków zakończyło się sukcesem, plus 7 dodanych przypadków, a dwa kolejne uruchomienia są identyczne bitowo. Każda wartość odniesienia jest przeliczana, a żadna nie jest ponownie wykorzystywana: niezależna implementacja języka Python napisana na podstawie równań (3)-(5) z punktu 6 normy ISO 9613-1:1993 oraz równań 2.5.11-2.5.22 z załącznika II do dyrektywy (UE) 2015/996, sekcja 2.5.6, zgodna z opublikowanym wierszem tłumienia z tabeli 2 normy ISO 9613-2 dla 10°C/70% oraz z implementacją akustyki pythonowej normy ISO 9613-1, stworzoną przez stronę trzecią, która przyjmuje wartość 4,3e-14 dB/km dla wszystkich 40 stanów atmosferycznych. Najgorszy wynik resztkowy według grupy: atmosfera 5,7e-14 dB/km, grunt 4,4e-16 dB, dyfrakcja 8,9e-16 dB, geometria i odbicie dokładnie 0, montaż 1,4e-14 dB; nie zwiększono tolerancji. Czytelnik powinien rozważyć dwie kwestie. Wyrazy równania nie są dostępne ze strony – narzędzie jest w pełni zintegrowane (IIFE) i nie publikuje żadnych zmiennych globalnych fizyki – więc system dołącza jeden blok tylko do odczytu do pliku faktycznie zwracanego przez serwer, stwierdza, że ​​zinstrumentowane ciało to obsłużone bajty plus dokładnie ten blok i zapisuje obie sumy md5; własny inspektor ścieżki strony zgadza się z zinstrumentowanymi wywołaniami swojego wydrukowanego zaokrąglenia 0,05 dB, ale 0,002 dB, na które ocenia ten test porównawczy, można obronić jedynie w przypadku elementów wewnętrznych. W 110 przypadkach artefakt z 14.08.2026 nigdy nie został zarejestrowany; zostały one odzyskane poprzez odwrócenie niezależnej implementacji względem zarejestrowanych liczb (resztkowe 0 dla wszystkich pięciu geometrii gruntu, 1.1e-13 lub lepsze dla łuków) i są oznaczone jako inputs_recovered. System jest własnością autora; nie był sprawdzany przez żadną zewnętrzną stronę."

.coord{position:absolute;left:var(--sp-3);bottom:var(--sp-3);padding:var(--sp-1) var(--sp-2);

.placement-badge{position:absolute;left:50%;top:var(--sp-3);transform:translateX(-50%);z-index:2;

.placement-badge[hidden]{display:none}

/* ---- path inspector and results tables ---- */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.path-table,.receiver-table{width:100%;border-collapse:collapse;font-size:var(--fs-small)}
.path-table th,.path-table td,.receiver-table th,.receiver-table td{padding:var(--sp-1) var(--sp-2);
 border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.path-table th:first-child,.path-table td:first-child,
.receiver-table th:first-child,.receiver-table td:first-child{text-align:left}
.path-table th,.receiver-table th{position:sticky;top:0;background:var(--panel);color:var(--muted);

.receiver-table tr.sel{background:var(--weak)}
.receiver-table tbody tr{cursor:pointer}
.receiver-table td.dom{text-align:left;white-space:normal;overflow-wrap:anywhere}
.contrib{display:flex;flex-direction:column;gap:var(--sp-1)}
.contrib-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--sp-2);padding:var(--sp-2);

.contrib-row.active{border-color:var(--accent);background:var(--weak)}
.contrib-row .db{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.result-explain{font-size:var(--fs-small);color:var(--muted);line-height:1.45}

/* ---- results box: tabs, spectrum chart, tables ---- */
.results-box{display:flex;flex-direction:column;gap:var(--sp-3);min-width:0}
.view-tabs{display:flex;gap:var(--sp-1);overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.view-tabs::-webkit-scrollbar{display:none}
.chartbox{position:relative;min-height:220px;height:38vh}
.chartbox canvas{display:block;width:100%;height:100%}
#pathBody,#receiverView,#contribView,#uncertaintyView{min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch}

.stage-tl .scene3d-toolbar button{width:var(--ctl-h);height:var(--ctl-h);border:1px solid var(--line);

.stage-tl .scene3d-toolbar button:hover:not(:disabled){background:var(--weak)}
.stage-tl .scene3d-toolbar button.on{background:var(--weak);color:var(--accent);border-color:var(--accent);box-shadow:none}
.stage-tl .scene3d-toolbar .scene3d-sep{background:var(--line)}
#sceneList.scene3d-tree{font:400 var(--fs-label)/1.35 var(--font)}
.scene3d-tree-row{border-radius:var(--radius-sm);border-left:0;padding:var(--sp-1) var(--sp-2);min-height:var(--ctl-h)}
.scene3d-tree-row:hover{background:var(--panel-2)}
.scene3d-tree-row.selected,.scene3d-tree-row.primary{background:var(--weak);border:1px solid var(--accent)}
.scene3d-tree-row .scene3d-tree-name{color:var(--ink);white-space:normal;overflow:visible;overflow-wrap:anywhere}
.scene3d-tree-row .scene3d-tree-meta{color:var(--muted);font-size:var(--fs-micro)}
.scene3d-tree-row button{color:var(--muted);border-radius:var(--radius-sm);min-width:var(--sp-5)}
.scene3d-tree-row button:hover{background:var(--panel-2);color:var(--ink)}
.scene3d-tree-empty{color:var(--muted);padding:var(--sp-2)}

.scene3d-props-section{padding-bottom:var(--sp-2)}
.scene3d-props-section+.scene3d-props-section{border-top:1px solid var(--line)}
.scene3d-props-title{color:var(--ink);font-weight:650}
.scene3d-props-row>span:first-child,.scene3d-props-note,.scene3d-props-unit{color:var(--muted)}
.scene3d-props-row input,.scene3d-props-row select,.scene3d-props-row textarea{border:1px solid var(--line);
 background:var(--panel);color:var(--ink);border-radius:var(--radius-sm);padding:0 var(--sp-2);
 min-height:var(--ctl-h);font:400 var(--fs-label)/1 var(--font)}
.scene3d-props-actions button{min-height:var(--ctl-h);padding:0 var(--sp-3);border:1px solid var(--line);
 border-radius:var(--radius-sm);background:var(--panel);color:var(--ink);font:500 var(--fs-label)/1 var(--font)}
#placementBadge.scene3d-placement-badge{left:50%;top:var(--sp-3);transform:translateX(-50%);
 max-width:calc(100% - var(--sp-6));background:var(--ink);color:var(--bg);border-color:var(--line)}
.ctxmenu{position:fixed;z-index:var(--z-popover);display:none;min-width:14em;max-width:22em;padding:var(--sp-1);

.ctxmenu .ctitle{padding:var(--sp-1) var(--sp-2);color:var(--muted);font-size:var(--fs-small);
 border-bottom:1px solid var(--line);margin-bottom:var(--sp-1)}
.ctxmenu button{width:100%;text-align:left;background:transparent;border:0;color:var(--ink);font:500 var(--fs-label)/1.4 var(--font);
 padding:var(--sp-2);border-radius:var(--radius-sm);min-height:var(--ctl-h);cursor:pointer}
.ctxmenu button:hover{background:var(--weak)}
.ctxmenu hr{border:0;border-top:1px solid var(--line);margin:var(--sp-1) 0}
.receiver-label{pointer-events:none}

/* the 3-D editor is the point of the page: give it the room the old app shell gave it */
.dgu-app .dgu-stage{min-height:360px}
@media(min-width:1120px){.dgu-app .dgu-stage{min-height:60vh}}

/* diagram-ui.js appends .dgu-tour, .dgu-pop and .dgu-dialog to <body>, outside .dgu-app, so its
   own `box-sizing:border-box` rule does not reach them: at 390px the tour card is 394px wide and
   16px of it hangs off the right edge. One line until the framework fixes it. */
.dgu-tour,.dgu-pop,.dgu-dialog,.dgu-dialog-p{box-sizing:border-box}

const SceneEditor=window.DiagramScene3D;
if(!SceneEditor||SceneEditor.api!=='tools.petrov.re/scene-editor/v1'){
 /* The 3-D runtime is a hard dependency of the editor; the chrome is not (spec v3 section 3,
    UI_AUDIT.md S-2). Render the shell, say what failed, and let the shared bar build itself from
    the manifest, instead of leaving a blank page behind a thrown error. */
 const fail=()=>{try{
  if(window.DiagramUI&&DiagramUI.api==='tools.petrov.re/ui/v1'){
   const a=DiagramUI.app({id:'outdoornoise',mount:'#app',layout:'studio',compute:'live'});
   a.fail({en:'The 3-D scene runtime (diagram-scene3d.js) could not be loaded, so the editor cannot start. Nothing else on the page is affected.',

    de:'Die 3-D-Laufzeit (diagram-scene3d.js) konnte nicht geladen werden; der Editor startet nicht.',
    nl:'De 3-D-runtime (diagram-scene3d.js) kon niet worden geladen, dus de editor start niet.',
    fr:'Le moteur 3-D (diagram-scene3d.js) n’a pas pu être chargé : l’éditeur ne peut pas démarrer.',
    es:'No se pudo cargar el motor 3-D (diagram-scene3d.js); el editor no puede iniciarse.',pl:"Nie udało się załadować środowiska wykonawczego sceny 3D (diagram-scene3d.js), więc edytor nie może się uruchomić. Nie ma to wpływu na nic innego na stronie."});
  }else if(window.Diagram&&Diagram.toolbar&&Diagram.toolbar.refresh)Diagram.toolbar.refresh();
 }catch(e){}};
 if(document.readyState==='loading')window.addEventListener('DOMContentLoaded',fail,{once:true});else fail();
 throw new Error('diagram-scene3d.js v1 is required');
}

Object.assign(I18N.en,{learn:'Learn',selectedResult:'Selected',dominantSource:'Dominant source',instantCalc:'Receiver/path/spectrum update instantly. Calculate map computes only the spatial noise map.',tutorialWelcomeTitle:'Start with a solved example',tutorialWelcomeText:'A simple free-field scene is loaded automatically: one source, hard ground and three receivers. The selected receiver already has a calculated level.',tutorialSourceTitle:'1 · Source',tutorialSourceText:'Select the red source in 3D or in Objects. Its Inspector contains octave-band sound power Lw, height, directivity Dc and source-ground factor Gs. Changing a value recalculates receivers immediately.',tutorialReceiverTitle:'2 · Receiver',tutorialReceiverText:'Select a blue receiver. Its label in 3D shows dB(A); the Inspector shows the total level and source contributions. There is no separate Calculate button for a receiver.',tutorialPathTitle:'3 · Path Inspector',tutorialPathText:'Choose a source and receiver above the table. Each octave shows Adiv, Aatm, ground/diffraction boundary terms and H/F/LT levels. This is where you inspect why the result changed.',tutorialResultsTitle:'4 · Results',tutorialResultsText:'Spectrum shows the selected receiver by octave. Receivers compares every receiver. Section draws terrain, mean ground plane, H/F rays and active diffraction edges.',tutorialMapTitle:'5 · Noise map',tutorialMapText:'The map is the only result that needs a spatial grid calculation. LIVE recalculates a coarse map automatically; Calculate map forces it now. FINAL uses the requested grid spacing.',tutorialEditTitle:'6 · Edit the scene',tutorialEditText:'Pick an object from the palette, move its ghost over the terrain and click to place it. Select an object to expose direct handles for move/resize/rotate/height. Right-click opens its context menu.',tutorialDoneTitle:'7 · Try the presets',tutorialDoneText:'Basic presets isolate one physical effect; Barriers, Terrain and Reflections add complexity. Start simple, inspect the path, then change one thing at a time.'});
Object.assign(I18N.uk,{learn:'Навчання',selectedResult:'Вибраний',dominantSource:'Головне джерело',instantCalc:'Приймач/траса/спектр перераховуються миттєво. «Розрахувати карту» рахує лише просторову карту шуму.',tutorialWelcomeTitle:'Почніть з готового прикладу',tutorialWelcomeText:'Автоматично завантажено просту сцену вільного поля: одне джерело, твердий ґрунт і три приймачі. Для вибраного приймача рівень уже розрахований.',tutorialSourceTitle:'1 · Джерело',tutorialSourceText:'Виберіть червоне джерело в 3D або в Objects. В Inspector є октавний Lw, висота, Dc і Gs. Зміна значення одразу перераховує приймачі.',tutorialReceiverTitle:'2 · Приймач',tutorialReceiverText:'Виберіть синій приймач. Його мітка в 3D показує dB(A), а Inspector — сумарний рівень і внески джерел. Окремої кнопки Calculate для приймача немає.',tutorialPathTitle:'3 · Path Inspector',tutorialPathText:'Над таблицею виберіть джерело й приймач. Для кожної октави видно Adiv, Aatm, ground/diffraction terms і рівні H/F/LT — тут видно, чому змінився результат.',tutorialResultsTitle:'4 · Results',tutorialResultsText:'Spectrum показує октави вибраного приймача. Receivers порівнює всі приймачі. Section показує рельєф, середню площину ґрунту, H/F-промені та кромки дифракції.',tutorialMapTitle:'5 · Карта шуму',tutorialMapText:'Лише карта потребує розрахунку просторової сітки. LIVE автоматично рахує грубу карту; Calculate map запускає її негайно. FINAL використовує заданий крок.',tutorialEditTitle:'6 · Редагування сцени',tutorialEditText:'Виберіть об’єкт у палітрі, ведіть ghost по рельєфу й клацніть. Після вибору об’єкта з’являються прямі рукоятки переміщення/розміру/повороту/висоти. ПКМ відкриває меню.',tutorialDoneTitle:'7 · Спробуйте пресети',tutorialDoneText:'Basic ізолюють один фізичний ефект; Barriers, Terrain і Reflections додають складність. Починайте просто, дивіться трасу, потім змінюйте по одному параметру.'});
Object.assign(I18N.de,{learn:'Lernen',selectedResult:'Ausgewählt',dominantSource:'Dominante Quelle',instantCalc:'Empfänger/Pfad/Spektrum werden sofort aktualisiert. „Karte berechnen“ berechnet nur die räumliche Lärmkarte.',tutorialWelcomeTitle:'Mit einem berechneten Beispiel starten',tutorialWelcomeText:'Automatisch geladen: Freifeld mit einer Quelle, hartem Boden und drei Immissionspunkten. Der gewählte Punkt ist bereits berechnet.',tutorialSourceTitle:'1 · Quelle',tutorialSourceText:'Rote Quelle in 3D oder Objects wählen. Im Inspector stehen Oktav-Lw, Höhe, Dc und Gs. Änderungen berechnen die Empfänger sofort neu.',tutorialReceiverTitle:'2 · Immissionspunkt',tutorialReceiverText:'Blauen Empfänger wählen. Das 3D-Label zeigt dB(A), der Inspector Gesamtpegel und Quellenbeiträge. Für einzelne Empfänger gibt es keine separate Rechentaste.',tutorialPathTitle:'3 · Pfadinspektor',tutorialPathText:'Quelle und Empfänger über der Tabelle wählen. Pro Oktave werden Adiv, Aatm, Boden/Beugung sowie H/F/LT gezeigt — hier sieht man die Ursache einer Pegeländerung.',tutorialResultsTitle:'4 · Ergebnisse',tutorialResultsText:'Spektrum zeigt den gewählten Empfänger. Empfänger vergleicht alle Punkte. Schnitt zeigt Gelände, mittlere Bodenebene, H/F-Strahlen und Beugungskanten.',tutorialMapTitle:'5 · Lärmkarte',tutorialMapText:'Nur die Karte benötigt ein räumliches Raster. LIVE berechnet automatisch grob; „Karte berechnen“ startet sofort. FINAL verwendet den eingegebenen Rasterabstand.',tutorialEditTitle:'6 · Szene bearbeiten',tutorialEditText:'Objekt aus der Palette wählen, Ghost über Gelände führen und klicken. Nach Auswahl erscheinen direkte Griffe für Verschieben/Größe/Drehung/Höhe. Rechtsklick öffnet das Kontextmenü.',tutorialDoneTitle:'7 · Vorlagen nutzen',tutorialDoneText:'Basic isoliert einzelne Effekte; Barriers, Terrain und Reflections werden schrittweise komplexer. Einfach beginnen, Pfad prüfen, dann jeweils nur eine Größe ändern.'});
Object.assign(I18N.nl,{learn:'Leren',selectedResult:'Geselecteerd',dominantSource:'Dominante bron',instantCalc:'Ontvanger/pad/spectrum worden direct bijgewerkt. “Kaart berekenen” berekent alleen de ruimtelijke geluidskaart.',tutorialWelcomeTitle:'Begin met een berekend voorbeeld',tutorialWelcomeText:'Automatisch geladen: vrij veld met één bron, harde bodem en drie ontvangers. De geselecteerde ontvanger is al berekend.',tutorialSourceTitle:'1 · Bron',tutorialSourceText:'Selecteer de rode bron in 3D of Objects. De Inspector toont octaaf-Lw, hoogte, Dc en Gs. Een wijziging herberekent ontvangers direct.',tutorialReceiverTitle:'2 · Ontvanger',tutorialReceiverText:'Selecteer een blauwe ontvanger. Het 3D-label toont dB(A); de Inspector toont totaal en bronbijdragen. Voor een ontvanger is geen aparte Calculate-knop nodig.',tutorialPathTitle:'3 · Padinspecteur',tutorialPathText:'Kies bron en ontvanger boven de tabel. Per octaaf zie je Adiv, Aatm, bodem/diffractie en H/F/LT — hier zie je waarom het resultaat verandert.',tutorialResultsTitle:'4 · Resultaten',tutorialResultsText:'Spectrum toont de geselecteerde ontvanger. Receivers vergelijkt alle ontvangers. Section toont terrein, gemiddeld grondvlak, H/F-stralen en actieve diffractieranden.',tutorialMapTitle:'5 · Geluidskaart',tutorialMapText:'Alleen de kaart heeft een ruimtelijk raster nodig. LIVE rekent automatisch grof; Calculate map start direct. FINAL gebruikt de ingestelde rasterafstand.',tutorialEditTitle:'6 · Scène bewerken',tutorialEditText:'Kies een object uit het palet, beweeg de ghost over het terrein en klik. Na selectie verschijnen directe handgrepen voor verplaatsen/schalen/roteren/hoogte. Rechtsklik opent het menu.',tutorialDoneTitle:'7 · Probeer presets',tutorialDoneText:'Basic isoleert één fysisch effect; Barriers, Terrain en Reflections voegen complexiteit toe. Begin eenvoudig, inspecteer het pad en verander daarna één parameter tegelijk.'});
Object.assign(I18N.fr,{learn:'Apprendre',selectedResult:'Sélectionné',dominantSource:'Source dominante',instantCalc:'Récepteur/trajet/spectre se mettent à jour immédiatement. « Calculer la carte » ne calcule que la carte spatiale.',tutorialWelcomeTitle:'Commencer par un exemple calculé',tutorialWelcomeText:'Une scène simple en champ libre est chargée automatiquement : une source, sol dur et trois récepteurs. Le récepteur sélectionné est déjà calculé.',tutorialSourceTitle:'1 · Source',tutorialSourceText:'Sélectionnez la source rouge en 3D ou dans Objects. Inspector affiche Lw par octave, hauteur, Dc et Gs. Toute modification recalcule immédiatement les récepteurs.',tutorialReceiverTitle:'2 · Récepteur',tutorialReceiverText:'Sélectionnez un récepteur bleu. Son étiquette 3D affiche dB(A) et Inspector affiche le niveau total et les contributions. Aucun bouton Calculate séparé n’est nécessaire.',tutorialPathTitle:'3 · Path Inspector',tutorialPathText:'Choisissez source et récepteur au-dessus du tableau. Chaque octave montre Adiv, Aatm, sol/diffraction et H/F/LT — c’est ici qu’on comprend la variation du résultat.',tutorialResultsTitle:'4 · Results',tutorialResultsText:'Spectrum montre les octaves du récepteur choisi. Receivers compare tous les récepteurs. Section montre terrain, plan moyen, rayons H/F et arêtes de diffraction.',tutorialMapTitle:'5 · Carte de bruit',tutorialMapText:'Seule la carte nécessite une grille spatiale. LIVE recalcule automatiquement une grille grossière ; Calculate map la lance immédiatement. FINAL utilise le pas demandé.',tutorialEditTitle:'6 · Modifier la scène',tutorialEditText:'Choisissez un objet dans la palette, déplacez son ghost sur le terrain puis cliquez. Après sélection, des poignées directes servent au déplacement/redimensionnement/rotation/hauteur. Clic droit : menu.',tutorialDoneTitle:'7 · Essayer les presets',tutorialDoneText:'Basic isole un seul effet ; Barriers, Terrain et Reflections ajoutent progressivement de la complexité. Commencez simple, inspectez le trajet, puis changez un seul paramètre.'});
Object.assign(I18N.es,{learn:'Aprender',selectedResult:'Seleccionado',dominantSource:'Fuente dominante',instantCalc:'Receptor/trayectoria/espectro se actualizan al instante. “Calcular mapa” calcula únicamente el mapa espacial.',tutorialWelcomeTitle:'Empiece con un ejemplo calculado',tutorialWelcomeText:'Se carga automáticamente una escena simple de campo libre: una fuente, suelo duro y tres receptores. El receptor seleccionado ya está calculado.',tutorialSourceTitle:'1 · Fuente',tutorialSourceText:'Seleccione la fuente roja en 3D o en Objects. Inspector muestra Lw por octava, altura, Dc y Gs. Al cambiar un valor se recalculan los receptores inmediatamente.',tutorialReceiverTitle:'2 · Receptor',tutorialReceiverText:'Seleccione un receptor azul. Su etiqueta 3D muestra dB(A); Inspector muestra el nivel total y las contribuciones. No hace falta un botón Calculate separado.',tutorialPathTitle:'3 · Path Inspector',tutorialPathText:'Elija fuente y receptor sobre la tabla. Cada octava muestra Adiv, Aatm, suelo/difracción y H/F/LT: aquí se ve por qué cambia el resultado.',tutorialResultsTitle:'4 · Results',tutorialResultsText:'Spectrum muestra las octavas del receptor elegido. Receivers compara todos los receptores. Section muestra terreno, plano medio, rayos H/F y bordes de difracción.',tutorialMapTitle:'5 · Mapa de ruido',tutorialMapText:'Solo el mapa necesita una malla espacial. LIVE recalcula automáticamente una malla gruesa; Calculate map la ejecuta ahora. FINAL usa el paso solicitado.',tutorialEditTitle:'6 · Editar la escena',tutorialEditText:'Elija un objeto en la paleta, mueva el ghost sobre el terreno y haga clic. Al seleccionar aparecen tiradores directos para mover/redimensionar/girar/altura. Botón derecho: menú.',tutorialDoneTitle:'7 · Pruebe los presets',tutorialDoneText:'Basic aísla un efecto físico; Barriers, Terrain y Reflections añaden complejidad. Empiece simple, inspeccione la trayectoria y cambie un parámetro cada vez.'});

/* ===================== v2 step 2: the noise map as an ensemble =====================
 * calculateMap() evaluates 900 (live) or 5000 (final) receivers that share an immutable scene and
 * exchange nothing. That is an ensemble, not a field: there is no neighbour relation between two
 * map cells, so GridEngine/GridTopology have nothing to work with and multigrid nothing to
 * coarsen. The payload is 0.7-1.5 kB of scene per run and 8-32 bytes of result per case, so no
 * SharedArrayBuffer is needed (and AGENTS section 1 could not set COOP/COEP for one anyway).
 *
 * What moves here: the case space is a 'grid' design over the same x and y stations v1 built,
 * evaluated over EnsembleEngine's managed Worker pool, merged by case index, with progress, a
 * Stop button and a checkpoint that a re-request of the same map resumes from.
 *
 * What deliberately does NOT move:
 *   - dbsum and the assembly order in solveSample/solveSource/solveReceiver. The benchmark
 *     artifact grades assembled levels at 0.003 dB and the mean-ground-plane slope at 2e-5;
 *     an energy sum is not associative in floating point, so the array order stays as written and
 *     a source is never split across workers.
 *   - the octave bands. Eight bands of 0.5-2 us each, whose expensive part (the mean ground plane
 *     and the path ground factor) is COMMON to all eight -- splitting them would have frozen the
 *     redundancy step 1 removes.
 *   - WebGPU. The kernel is branchy (diffraction, reflections, lateral paths), the working set is
 *     kilobytes, and the artifact's tolerances (1e-10 m image-source geometry, 2e-8 m arc
 *     geometry) are below what f32 can represent at these magnitudes.

 * Chunking is budgeted in TIME, not in cells (MIGRATION_MAP gap 26, which the runtime does not
 * ship: EnsembleEngine takes chunkSize as a number, default 16). v1 took 30 cells per rAF in live
 * and 18 in final; on the 6.5 s cell the UI lets you build by hand that is 193 seconds of
 * uninterruptible blocking. Here the first wave measures the case cost and every later chunk is
 * sized from it. On the main-thread fallback the same budget is applied directly to the loop.
 * A single case still cannot be pre-empted -- the runtime says so about its own CPU path and it
 * is just as true here -- which is exactly why the expensive scenes need Workers and not a
 * cleverer scheduler.
 *
 * Degradation: no DiagramCompute, no Worker constructor, or any failure of the Worker path, and

function sweepTallyDefs(n){
 const defs={};
 for(let i=0;i<n;i++)defs['r'+i]={type:'quantile',probabilities:[0.05,0.5,0.95],relativeAccuracy:5e-4,
  /* set explicitly: the sketch's relative-accuracy guarantee is stated over this range, and a
     dB(A) level lives in it comfortably. tailKeep above the case count means both tails are kept
     exactly, so at these sizes the reported P5/P50/P95 ARE order statistics; the cross-check
     below verifies that instead of assuming it. */
  minValue:1e-2,maxValue:1e4,tailKeep:4096};

}
function exactQuantile(sorted,p){

}
async function runUncertaintySweep(n){

 ['freeSoft','presetFreeSoft','presetGroupBasic'],
 ['mixedGround','presetMixedGround','presetGroupBasic'],
 ['barrier','presetBarrier','presetGroupBarriers'],
 ['barrierHeights','presetBarrierHeights','presetGroupBarriers'],
 ['doubleBarrier','presetDoubleBarrier','presetGroupBarriers'],
 ['parapet','presetParapet','presetGroupBarriers'],
 ['terrain','presetTerrain','presetGroupTerrain'],
 ['berm','presetBerm','presetGroupTerrain'],
 ['cutting','presetCutting','presetGroupTerrain'],
 ['facade','presetFacade','presetGroupReflections'],
 ['reflection','presetReflection','presetGroupReflections'],
 ['mixed','presetMixed','presetGroupReflections'],
 ['yard','presetYard','presetGroupIndustrial'],
 ['roof','presetRoof','presetGroupIndustrial'],
 ['stack','presetStack','presetGroupIndustrial'],
 ['buildingScreen','presetBuildingScreen','presetGroupIndustrial']
];
/* The preset id stays addressable, but the framework carries it now (spec §8.3.1):
   `id:` puts data-example="<id>" on whatever the Examples panel renders — one
   <option> per entry here, since 17 is over §8.3's 12 — and DiagramUI.current
   .example('<id>') applies one by name. This file used to tag
   panel.node.querySelectorAll('button') itself, which was true of the old
   button-per-preset grid and silently dropped 16 of 17 ids once the panel became
   a <select> plus one Load. */
function buildExamples(){return EXAMPLE_DEFS.map(x=>({id:x[0],label:TL(x[1]),note:TL(x[2]),apply:()=>preset(x[0])}))}

/* ---- fields. Keys are paths into the tool's own state object; no unit is converted, so
   state, record, permalink and handoff keep exactly the values they had. ---- */
function envFields(){return[
 {id:'f-temp',key:'env.temperature',type:'number',unit:'°C',min:-20,max:50,step:1,
  label:TL('temperature'),learn:'atmosphere'},
 {id:'f-hum',key:'env.humidity',type:'number',unit:'%',min:1,max:100,step:1,
  label:TL('humidity'),learn:'atmosphere'},
 {id:'f-press',key:'env.pressure',type:'number',unit:'kPa',min:80,max:110,step:0.1,
  label:TL('pressure'),learn:'atmosphere'},
 {id:'f-cond',key:'env.condition',type:'select',label:TL('propagationCondition'),learn:'condition',
  options:()=>[['longterm',t('longTerm')],['H',t('homogeneous')],['F',t('favourable')]]},
 {id:'f-pfav',key:'env.favourablePct',type:'number',unit:'%',min:0,max:100,step:1,
  label:TL('favourableOccurrence'),learn:'condition'},
 {id:'f-lat',key:'env.lateralDiffraction',type:'toggle',label:TL('lateralDiffraction'),
  hint:TL('lateralHint'),learn:'lateral'},
 {id:'f-refl',key:'env.reflections',type:'toggle',label:TL('reflections'),
  hint:TL('reflectionsHint'),learn:'reflections'},
 {id:'f-order',key:'env.reflectionOrder',type:'select',label:TL('reflectionOrder'),learn:'reflections',
  options:()=>[[1,t('reflectionOrder1')],[2,t('reflectionOrder2')]],
  disabled:()=>state.env.reflections===false},
 {id:'f-mixrefl',key:'env.mixedReflections',type:'toggle',label:TL('mixedReflections'),
  hint:TL('mixedReflectionsHint'),learn:'reflections',disabled:()=>state.env.reflections===false}
]}
function mapFields(){return[
 {id:'f-mode',key:'mode',type:'segmented',label:TL('mapDensity'),learn:'map',
  options:()=>[['live','LIVE'],['final','FINAL']],
  hint:()=>state.mode==='live'?t('modeLive'):t('modeFinal')},
 {id:'f-spacing',key:'map.spacing',type:'number',unit:'m',display:'m',min:2,max:200,step:1,
  label:TL('spacing'),learn:'map'},
 {id:'f-mapz',key:'map.z',type:'number',unit:'m',display:'m',min:0.1,max:30,step:0.5,
  label:TL('receiverHeight'),learn:'map'}
]}
function pathFields(){return[
 {id:'f-pathrecv',key:'pathReceiver',type:'select',label:TL('receiver'),learn:'path',
  options:()=>receivers().length?receivers().map(r=>[r.id,r.name]):[['',t('noReceiver')]],
  disabled:()=>!receivers().length},
 {id:'f-pathsrc',key:'pathSource',type:'select',label:TL('source'),learn:'path',
  options:()=>sources().length?sources().map(s=>[s.id,s.name]):[['',t('noSource')]],
  disabled:()=>!sources().length},
 {id:'f-pathbody',type:'custom',label:TL('pathInspector'),render:box=>{if(NODE.pathBox)box.appendChild(NODE.pathBox)}}
]}

/* ---- learn: the tool's own eight-step tour, moved into the framework's tour, which docks clear
   of the shared chrome instead of underneath it (UI_AUDIT.md S-1/S-10). ---- */
const LEARN={
 version:1,
 intro:{title:TL('tutorialWelcomeTitle'),body:TL('tutorialWelcomeText')},
 topics:{
  welcome:{title:TL('tutorialWelcomeTitle'),body:TL('tutorialWelcomeText')},
  scene:{title:TL('tutorialSourceTitle'),body:TL('tutorialSourceText')},
  objects:{title:TL('tutorialEditTitle'),body:TL('tutorialEditText')},
  inspector:{title:TL('tutorialReceiverTitle'),body:TL('tutorialReceiverText')},
  path:{title:TL('tutorialPathTitle'),body:TL('tutorialPathText')},
  results:{title:TL('tutorialResultsTitle'),body:TL('tutorialResultsText')},
  map:{title:TL('tutorialMapTitle'),body:TL('tutorialMapText')},
  presets:{title:TL('tutorialDoneTitle'),body:TL('tutorialDoneText')},
  condition:{title:TL('propagationCondition'),body:TL('conditionHelp')},
  atmosphere:{title:TL('environment'),body:TL('cnossosFooter')},
  lateral:{title:TL('lateralDiffraction'),body:TL('lateralHint')},
  reflections:{title:TL('reflections'),body:()=>t('reflectionsHint')+'\n\n'+t('curvedReflectionNote')},
  kernel:{title:TL('kernel'),body:TL('kernelText')}
 },
 tour:[
  {topic:'welcome',focus:'.dgu-stage',action:()=>{const r=receivers()[0];if(r){state.pathReceiver=r.id;state.selected=r.id}setResultView('spectrum');refreshAll()}},
  {topic:'scene',focus:'[data-dgu-panel="scene"]',action:()=>{const s=sources()[0];if(s){state.selected=s.id;state.pathSource=s.id}refreshAll()}},
  {topic:'inspector',focus:'.dgu-r-detail',action:()=>{const r=receivers()[0];if(r){state.selected=r.id;state.pathReceiver=r.id}refreshAll()}},
  {topic:'path',focus:'[data-dgu-panel="path"]',action:()=>{const s=sources()[0],r=receivers()[0];if(s)state.pathSource=s.id;if(r)state.pathReceiver=r.id;refreshAll()}},
  {topic:'results',focus:'.dgu-r-results .dgu-tile',action:()=>{setResultView('spectrum');refreshAll()}},
  {topic:'map',focus:'[data-action="mapBtn"]',action:()=>{state.view.map=true;syncViewToggles();if(state.mapDirty)calculateMap()}},
  {topic:'objects',focus:'[data-dgu-panel="palette"]',action:()=>{}},
  {topic:'presets',focus:'[data-dgu-panel="dgu-examples"]',action:()=>{}}
 ]
};

/* ---- results. The five metric cards the tool used to draw itself become framework tiles, which
   do not truncate their own value (UI_AUDIT.md S-16). The spectrum chart, the receiver table, the
   source-contribution list and the uncertainty sweep stay exactly the nodes the tool draws. ---- */
function resultData(){
 const nodes=NODE.resultsBox?[NODE.resultsBox]:[];
 const notes=[];
 const r=resultReceiver();
 if(!r)return{tiles:[{label:TL('receiver'),value:null,hint:TL('noReceiver')}],nodes:nodes,notes:notes};
 const sol=solveReceiverUI(r),dom=sol.sources.slice().sort((a,b)=>b.LA-a.LA)[0];
 const cond=state.env.condition==='H'?'H':state.env.condition==='F'?'F':'LT';
 notes.push(TL('instantCalc'));
 if(resultView==='section')notes.push(TL('tutorialResultsText'));
 return{
  tiles:[
   {label:TL('receiver'),value:r.name},
   {label:()=>t('selectedResult')+' · '+cond,value:sol.LA,precision:1,hint:'dB(A)',learn:'results'},
   {label:'H / F / LT',value:fmt(sol.LAH,1)+' / '+fmt(sol.LAF,1)+' / '+fmt(sol.LALT,1),hint:'dB(A)',learn:'condition'},
   {label:TL('dominantSource'),value:dom&&dom.src?dom.src.name:'—'},
   {label:TL('receivers'),value:receivers().length,precision:0,headline:false}
  ],
  nodes:nodes,notes:notes
 };
}
function publishResults(){if(ui&&ui.resultsView)ui.results(resultData())}

function stageAlt(){
 let s=t('scene')+': '+state.objects.length+' '+t('objectsCount')+' · '+receivers().length+' '+t('receivers');
 const r=resultReceiver();
 if(r){try{s+=' · '+r.name+' '+fmt(solveReceiverUI(r).LA,1)+' dB(A)'}catch(e){}}
 return s;
}
function saveCase(){download(`outdoornoise-${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.json`,JSON.stringify(serialize(),null,2))}
function syncViewToggles(){
 const g=$('gridBtn'),m=$('mapOverlayBtn');
 if(g){g.classList.toggle('active',state.view.grid!==false);g.setAttribute('aria-pressed',String(state.view.grid!==false))}
 if(m){m.classList.toggle('active',state.view.map!==false);m.setAttribute('aria-pressed',String(state.view.map!==false))}
}
function syncHistoryButtons(){
 const u=actionEl('undo'),r=actionEl('redo');
 if(u)u.disabled=!(sceneHistory&&sceneHistory.canUndo());
 if(r)r.disabled=!(sceneHistory&&sceneHistory.canRedo());
}
function onFieldChange(key){
 if(key==='mode'){setMode(state.mode);return}
 if(key==='pathReceiver'||key==='pathSource'){refreshAll();return}
 markDirty();historyAfter();syncHistoryButtons();refreshAll();scheduleMap();
}
function legendGradient(){
 const g=$('legendGrad');if(!g)return;
 const stops=[];for(let i=0;i<=6;i++){const c=colorForLevel(i/6,0,1);stops.push('rgb('+c[0]+','+c[1]+','+c[2]+')')}
 g.style.background='linear-gradient(90deg,'+stops.join(',')+')';
}
function mountTabs(){
 const bar=$('resultTabs');if(!bar||bar.__wired)return;bar.__wired=1;
 const bs=Array.prototype.slice.call(bar.querySelectorAll('[data-result]'));
 bs.forEach((b,i)=>{
  b.addEventListener('click',()=>setResultView(b.dataset.result));
  b.addEventListener('keydown',e=>{
   let n=null;
   if(e.key==='ArrowRight')n=(i+1)%bs.length;else if(e.key==='ArrowLeft')n=(i-1+bs.length)%bs.length;
   else if(e.key==='Home')n=0;else if(e.key==='End')n=bs.length-1;
   if(n!==null){e.preventDefault();bs[n].focus();setResultView(bs[n].dataset.result)}
  });
 });
}
function manifestPick(field){
 try{const m=window.Diagram&&Diagram.manifest?Diagram.manifest():null;
  if(m&&m[field])return window.DiagramUI?DiagramUI.pick(m[field],state.lang):(m[field].en||'');}catch(e){}
 return '';
}

function uiOptions(){return{
 id:'outdoornoise',mount:'#app',layout:'studio',compute:'live',
 state:state,history:false,
 subtitle:()=>t('subtitle'),
 header:{actions:[
  {id:'undo',icon:'↶',title:()=>uiT('undo'),run:()=>{if(sceneHistory){sceneHistory.undo();refreshAll();syncHistoryButtons()}}},
  {id:'redo',icon:'↷',title:()=>uiT('redo'),run:()=>{if(sceneHistory){sceneHistory.redo();refreshAll();syncHistoryButtons()}}}
 ]},
 learn:LEARN,
 regions:{
  inputs:(host,app)=>{app.examples(buildExamples())},
  stage:(host,app)=>{
   stage=app.stage({
    caption:TL('sceneCaption'),
    fit:()=>fitScene(),
    resize:()=>{try{resizeCanvas()}catch(e){}},
    a11y:()=>stageAlt()
   });
   /* the framework's Fit tool carries a word, not a glyph, in the supported languages */
   const fitBtn=stage.tools.querySelector('button');
   if(fitBtn)fitBtn.classList.remove('icon');
   if(NODE.stageBox)stage.body.appendChild(NODE.stageBox);
   syncViewToggles();legendGradient();
  }
 },
 panels:[
  {id:'palette',slot:'inputs',title:TL('addObject'),learn:'objects',
   render:box=>{if(NODE.paletteBox)box.appendChild(NODE.paletteBox)}},
  {id:'scene',slot:'inputs',title:TL('scene'),learn:'scene',
   render:box=>{if(NODE.sceneBox)box.appendChild(NODE.sceneBox)},
   actions:[
    {id:'saveCase',label:TL('saveCase'),run:saveCase},
    {id:'loadCase',label:TL('loadCase'),run:()=>{if(NODE.loadFile)NODE.loadFile.click()}},
    {id:'reset',label:()=>uiT('reset'),variant:'ghost',run:()=>{if(ui)ui.reset()}}
   ]},
  {id:'env',slot:'inputs',title:TL('environment'),learn:'condition',fields:envFields()},
  {id:'map',slot:'inputs',title:TL('mapSettings'),learn:'map',
   fields:mapFields().concat([{id:'f-mapprogress',type:'custom',
    render:box=>{if(NODE.mapBox)box.appendChild(NODE.mapBox)}}]),
   actions:[
    {id:'mapBtn',label:TL('calcMap'),variant:'primary',run:()=>calculateMap()},
    {id:'mapStopBtn',label:TL('stopMap'),variant:'danger',run:()=>cancelMap()}
   ]},
  {id:'inspector',slot:'detail',title:TL('inspector'),learn:'inspector',
   render:box=>{if(NODE.inspectorBox)box.appendChild(NODE.inspectorBox)}},
  {id:'path',slot:'dock',title:TL('pathInspector'),learn:'path',fields:pathFields()}
 ],
 footer:(host)=>{
  const reg=runInternalRegression();
  const d=document.createElement('details');
  d.innerHTML='<summary>'+esc(t('modelNotes'))+'</summary>'
   +'<div class="status warn">'+esc(t('kernelText'))+'</div>'
   +'<div class="status '+(reg.failed?'warn':'ok')+'">'+esc(t('internalRegression'))+': <b>'+reg.passed+'/'+reg.total+'</b></div>'
   +'<p class="footer-note">'+esc(t('cnossosFooter'))+'</p>'
   +'<p class="footer-note">'+esc(manifestPick('limitations'))+'</p>';
  host.appendChild(d);
 },
 on:{
  compute:()=>resultData(),
  change:key=>onFieldChange(key),
  lang:l=>setLang(l),
  reset:()=>{newScene()}
 }
}}

function bootUI(){
 ['paletteBox','sceneBox','stageBox','inspectorBox','pathBox','resultsBox','mapBox','loadFile'].forEach(id=>{NODE[id]=document.getElementById(id)});
 mountTabs();
 if(!window.DiagramUI||DiagramUI.api!=='tools.petrov.re/ui/v1'){bootFallback();return}
 ui=DiagramUI.app(uiOptions());
 uiBooted=true;
 const stop=actionEl('mapStopBtn');if(stop)stop.hidden=!mapRun;
 syncHistoryButtons();
 ui.ready();
 setTimeout(()=>{LEARN.autostart=false},4000);
 if(!resultsRO&&window.ResizeObserver&&NODE.resultsBox){
  resultsRO=new ResizeObserver(()=>{try{resizeSpectrum();drawSpectrum()}catch(e){}});
  resultsRO.observe(NODE.resultsBox);
 }
 refreshAll();
}

/* Degrade honestly (UI_FRAMEWORK_SPEC.md rule 10, PORTING_PLAYBOOK.md §9): with diagram-ui.js
   blocked there is no token layer and no shell, so the tool publishes a minimal one of its own and
   keeps every capability, including the environment panel, which then comes back into the
   inspector where it used to live. */
function bootFallback(){
 const st=document.createElement('style');
 st.textContent=':root{--bg:#f6f8fb;--panel:#fff;--panel-2:#f9fafc;--ink:#12161d;--muted:#5b6675;--line:#e2e7ee;'
  +'--accent:#3763e6;--accent-ink:#fff;--weak:rgba(55,99,230,.10);--ok:#1f6f34;--ok-bg:rgba(31,111,52,.10);'
  +'--warn:#9a5a00;--warn-bg:rgba(154,90,0,.10);--bad:#a5261f;--bad-bg:rgba(165,38,31,.10);'
  +'--shadow:0 1px 2px rgba(16,24,40,.06);--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;'
  +'--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--fs-title:22px;--fs-section:13px;--fs-body:15px;'
  +'--fs-label:13px;--fs-small:12px;--fs-micro:11px;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;'
  +'--radius-sm:8px;--radius-md:14px;--radius-pill:999px;--ctl-h:36px;--tap:44px;--z-popover:700}'
  +'body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs-body)/1.5 var(--font)}'
  +'.onfb{display:flex;flex-direction:column;gap:var(--sp-3);padding:var(--sp-3)}'
  +'.onfb h1{font:650 var(--fs-title)/1.2 var(--font);margin:0}'
  +'.onfb section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--sp-3)}'
  +'.onfb .row{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center}'
  +'#stageBox{position:relative;height:60vh;min-height:280px}';
 document.head.appendChild(st);
 const host=document.getElementById('app')||document.body;
 const wrap=document.createElement('div');wrap.className='onfb';
 const h=document.createElement('h1');h.textContent=manifestPick('title')||'Outdoor Noise Studio';
 wrap.appendChild(h);
 const row=document.createElement('div');row.className='row';
 const mk=(key,fn,dataAction)=>{const b=document.createElement('button');b.type='button';b.className='btn';
  b.textContent=key?t(key):'LIVE / FINAL';if(key)b.dataset.i18n=key;   /* setLang re-translates these too */
  if(dataAction)b.dataset.action=dataAction;b.addEventListener('click',fn);row.appendChild(b);return b};
 mk('calcMap',()=>calculateMap(),'mapBtn').classList.add('primary');
 mk('stopMap',()=>cancelMap(),'mapStopBtn').hidden=true;
 mk('fit',()=>fitScene());
 mk('',()=>setMode(state.mode==='live'?'final':'live'));
 mk('newScene',()=>newScene());
 mk('saveCase',()=>saveCase());
 mk('loadCase',()=>{if(NODE.loadFile)NODE.loadFile.click()});
 const ls=document.createElement('select');ls.className='btn';ls.setAttribute('aria-label','Language');
 ['en','uk','de','nl','fr','es','pl'].forEach(l=>{const o=document.createElement('option');o.value=l;o.textContent=l.toUpperCase();ls.appendChild(o)});
 ls.value=state.lang;ls.addEventListener('change',()=>setLang(ls.value));row.appendChild(ls);
 wrap.appendChild(row);
 ['stageBox','paletteBox','sceneBox','mapBox','inspectorBox','pathBox','resultsBox'].forEach(id=>{
  const n=NODE[id];if(!n)return;const s=document.createElement('section');s.appendChild(n);wrap.appendChild(s)});
 host.appendChild(wrap);
 const td=document.getElementById('tool-dom');if(td&&td.parentNode)td.parentNode.removeChild(td);
 window.addEventListener('resize',()=>{try{resizeCanvas()}catch(e){}});
 setTimeout(()=>{try{resizeCanvas();refreshAll()}catch(e){}},60);
}

setLang(currentLang());setMode('live');preset('freeHard');fitScene();installUniversalAuthoring();sceneHistory.clear(true);setResultView('spectrum');refreshAll();selfCheck();
/* The shell is built before Diagram.init, and Diagram.init is called unconditionally: a failure
   anywhere in the tool costs the results, never the chrome (spec v3 section 3, S-2). */
window.addEventListener('DOMContentLoaded',()=>{bootUI();bootDiagram();initCompute()},{once:true});
if(!state.mapDirty||state.mode!=='live')setTimeout(finishFirstResult,0);setTimeout(finishFirstResult,12000);
})();
</script>
