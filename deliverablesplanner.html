<script type="application/json" id="diagram-tool-manifest">{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision":"2026-09-22.deliverablesplanner-runtime-v11","id":"deliverablesplanner","file":"deliverablesplanner.html","listed":true,"category":"project-delivery","order":20,"title":{"en":"Engineering Deliverables Planner","uk":"Планувальник інженерних результатів","de":"Planer für Engineering-Liefergegenstände","nl":"Planner voor engineering-deliverables","fr":"Planificateur des livrables d’ingénierie","es":"Planificador de entregables de ingeniería","pl":"Planer rezultatów inżynierskich"},"summary":{"en":"Derives the engineering information a project needs across its lifecycle and exposes missing, dependent and conflicting items.","uk":"Виводить інженерну інформацію, потрібну проєкту протягом життєвого циклу, та показує відсутні, залежні й суперечливі елементи.","de":"Leitet die über den Lebenszyklus benötigten Engineering-Informationen ab und zeigt fehlende, abhängige und widersprüchliche Elemente.","nl":"Leidt de benodigde engineering-informatie over de levenscyclus af en toont ontbrekende, afhankelijke en conflicterende items.","fr":"Déduit les informations d’ingénierie nécessaires sur le cycle de vie et signale les éléments manquants, dépendants ou contradictoires.","es":"Deriva la información de ingeniería necesaria durante el ciclo de vida y señala elementos faltantes, dependientes o contradictorios.","pl":"Wyprowadza informacje inżynierskie potrzebne w cyklu życia projektu i wskazuje elementy brakujące, zależne oraz sprzeczne."},"description":{"en":"Builds a gate-aware, purpose-based engineering deliverables plan from lifecycle, disciplines, project context, systems/packages and delivery characteristics. It separates what is in scope, what is due for the selected readiness target, what remains future, and what information state each deliverable is in.","uk":"Будує орієнтований на контрольну ціль план інженерних результатів за життєвим циклом, дисциплінами, контекстом, системами/пакетами та способом реалізації. Відокремлює обсяг, результати, потрібні до вибраної цілі готовності, майбутні результати та поточний інформаційний стан кожного результату.","de":"Erstellt einen gate-bezogenen, zweckorientierten Engineering-Deliverables-Plan aus Lebenszyklus, Disziplinen, Projektkontext, Systemen/Paketen und Abwicklungsmerkmalen. Er trennt Umfang, bis zum gewählten Bereitschaftsziel fällige Deliverables, spätere Deliverables und den aktuellen Informationsstand jedes Deliverables.","nl":"Bouwt een gate-gerichte, doelgerichte engineering-deliverablesplanning uit levenscyclus, disciplines, projectcontext, systemen/pakketten en uitvoeringskenmerken. Het onderscheidt scope, wat vóór het gekozen gereedheidsdoel nodig is, latere deliverables en de actuele informatiestatus per deliverable.","fr":"Construit un plan de livrables d’ingénierie orienté par jalon et finalité à partir du cycle de vie, des disciplines, du contexte, des systèmes/lots et du mode de réalisation. Il distingue le périmètre, les livrables requis avant la cible de préparation, les livrables futurs et l’état d’information de chaque livrable.","es":"Construye un plan de entregables de ingeniería orientado por hito y finalidad a partir del ciclo de vida, disciplinas, contexto, sistemas/paquetes y características de ejecución. Separa el alcance, lo necesario para el objetivo de preparación elegido, los entregables futuros y el estado de información de cada entregable.","pl":"Buduje ukierunkowany na bramkę i cel plan rezultatów inżynierskich na podstawie cyklu życia, branż, kontekstu, systemów/pakietów i sposobu realizacji. Rozdziela zakres, rezultaty wymagane do wybranego celu gotowości, rezultaty przyszłe oraz bieżący stan informacji każdego rezultatu."},"status":"benchmarked","independent_validation":false,"limitations":{"en":"Rule-based planning model. It proposes information classes and dependencies from declared project characteristics; contract, organisation, regulatory and discipline-specific requirements remain authoritative.","uk":"Модель планування на основі правил. Вона пропонує класи інформації та залежності із заявлених характеристик; контрактні, організаційні, регуляторні та галузеві вимоги залишаються визначальними.","de":"Regelbasiertes Planungsmodell. Es schlägt Informationsklassen und Abhängigkeiten aus angegebenen Merkmalen vor; Vertrags-, Organisations-, regulatorische und fachspezifische Anforderungen bleiben maßgebend.","nl":"Regelgebaseerd planningsmodel. Het stelt informatieklassen en afhankelijkheden voor; contractuele, organisatorische, regelgevende en disciplinespecifieke eisen blijven leidend.","fr":"Modèle fondé sur des règles. Il propose classes d’information et dépendances; les exigences contractuelles, organisationnelles, réglementaires et métier restent prépondérantes.","es":"Modelo basado en reglas. Propone clases de información y dependencias; requisitos contractuales, organizativos, regulatorios y de disciplina siguen siendo autoritativos.","pl":"Model regułowy. Proponuje klasy informacji i zależności; wymagania kontraktowe, organizacyjne, regulacyjne i branżowe pozostają nadrzędne."},"intended_use":"preliminary assessment","catalog_languages":["en","uk","de","nl","fr","es","pl"],"tool_languages":["en","uk","de","nl","fr","es","pl"],"dependencies":[],"network_access":{"mode":"none"},"validation":{"basis":{"en":"Method structure derived from ISO/IEC/IEEE 15288:2023, ISO/IEC/IEEE 15289:2019, ISO 21502:2020 and ISO 21511:2018. ISO 21511 edition 2 is at PRF stage as of 2026-09-11. Rules marked heuristic are author methodology, not normative requirements.","uk":"Структура методу спирається на ISO/IEC/IEEE 15288:2023, ISO/IEC/IEEE 15289:2019, ISO 21502:2020 та ISO 21511:2018. Станом на 2026-09-11 друге видання ISO 21511 перебуває на стадії PRF. Евристичні правила є авторською методикою, а не нормативними вимогами.","de":"Die Methodenstruktur stützt sich auf ISO/IEC/IEEE 15288:2023, ISO/IEC/IEE     var ctx=st.canvas(), w=size.w,h=size.h, coarse=size.density==='coarse';
    ctx.clearRect(0,0,w,h); if(!last)return;
    var cs=getComputedStyle(document.documentElement), muted=cs.getPropertyValue('--muted').trim()||'#777';
    var line=cs.getPropertyValue('--line').trim()||'#ddd', font=cs.getPropertyValue('--font').trim()||'sans-serif';
    var left=coarse?84:122, top=26, right=8,bottom=36;
    var cw=(w-left-right)/STAGE_ORDER.length, ch=(h-top-bottom)/PURPOSE_ORDER.length;
    var m=mapMatrix(last), series={existing:0,required:1,dependent:2,missing:3};
    ctx.font='400 '+(coarse?9:11)+'px '+font; ctx.textBaseline='middle';
    PURPOSE_ORDER.forEach(function(p,ri){
      var y=top+ri*ch; ctx.fillStyle=muted; ctx.textAlign='right';
      ctx.fillText(loc(DATA.purposes[p]),left-6,y+ch/2);
      STAGE_ORDER.forEach(function(s,ci){
        var x=left+ci*cw, stt=m[p][s];
        ctx.strokeStyle=line;ctx.lineWidth=1;ctx.strokeRect(x,y,cw,ch);
        if(stt){ctx.globalAlpha=.72;ctx.fillStyle=DiagramUI.series(series[stt]);ctx.fillRect(x+1,y+1,Math.max(0,cw-2),Math.max(0,ch-2));ctx.globalAlpha=1;}
      });
    });
    ctx.textAlign='center';ctx.fillStyle=muted;ctx.textBaseline='top';
    var labw=Math.max(14,cw-4);
    STAGE_ORDER.forEach(function(s,ci){
      ctx.fillText(fitLabel(ctx,loc(DATA.stages[s]),labw),left+(ci+.5)*cw,h-bottom+7);
    });
  }

    concept:M('A small greenfield concept. The design basis is still partial, which is normal here; later design deliverables are outside the current readiness target.','Невеликий greenfield-концепт. Основа проєктування ще часткова, що нормально на цьому етапі; пізніші результати не входять у поточну ціль готовності.','Kleine Greenfield-Konzeptphase. Die Auslegungsbasis ist noch teilweise offen; spätere Planungsdeliverables liegen außerhalb des aktuellen Bereitschaftsziels.','Klein greenfield-concept. De ontwerpbasis is nog gedeeltelijk; latere ontwerpdeliverables vallen buiten het huidige gereedheidsdoel.','Petit concept greenfield. La base de conception reste partielle; les livrables ultérieurs sont hors de la cible actuelle.','Concepto greenfield pequeño. La base de diseño sigue parcial; los entregables posteriores quedan fuera del objetivo actual.','Mały projekt greenfield na etapie koncepcji. Podstawa projektowa jest częściowa; późniejsze rezultaty są poza bieżącym celem gotowości.'),
    vendor:M('A pump-skid procurement package with named package owners, a defined interface basis and a usable procurement basis. Edit the package structure to match your supplier split.','Закупівельний пакет насосного skid з визначеними власниками пакетів, базою інтерфейсів і придатною технічною базою закупівлі. Відредагуйте структуру пакетів під своїх постачальників.','Beschaffungspaket für einen Pumpenskid mit benannten Paketverantwortlichen, definierter Schnittstellenbasis und nutzbarer Beschaffungsgrundlage. Paketstruktur an die Lieferaufteilung anpassen.','Inkooppakket voor een pompskid met benoemde pakketeigenaars, een gedefinieerde interfacebasis en bruikbare inkoopbasis. Pas de pakketstructuur aan uw leveranciersverdeling aan.','Lot d’achat d’un skid de pompe avec responsables nommés, base d’interface définie et base technique d’achat exploitable. Adaptez les lots à vos fournisseurs.','Paquete de compra de skid de bomba con responsables definidos, base de interfaces y base técnica de compra utilizable. Adapte los paquetes a sus proveedores.','Pakiet zakupowy skidu pompy z przypisanymi właścicielami, określoną bazą interfejsów i użyteczną podstawą zakupową. Dostosuj strukturę pakietów do dostawców.'),
    construction_commissioning:M('An IFC-stage utility installation carried through commissioning. Construction change capture is still partial, so as-built information remains dependent without blocking the commissioning target.','Монтаж utility-системи на стадії IFC до пусконалагодження. Фіксація змін будівництва ще часткова, тому as-built залишається залежним, але не блокує ціль пусконалагодження.','Utility-Installation im IFC-Stand bis zur Inbetriebnahme. Die Erfassung von Bauänderungen ist noch teilweise, daher bleibt As-built abhängig, ohne das Inbetriebnahmeziel zu blockieren.','Utility-installatie op IFC-niveau tot en met inbedrijfstelling. Registratie van bouwwijzigingen is nog gedeeltelijk; as-built blijft afhankelijk zonder het commissioningdoel te blokkeren.','Installation utilités au stade IFC jusqu’à la mise en service. La capture des modifications chantier reste partielle; l’as-built reste dépendant sans bloquer la cible de mise en service.','Instalación de utilities en IFC hasta puesta en marcha. La captura de cambios de obra es parcial; el as-built queda dependiente sin bloquear el objetivo de commissioning.','Instalacja utilities na etapie IFC do rozruchu. Rejestr zmian budowy jest częściowy; as-built pozostaje zależny, ale nie blokuje celu rozruchu.'),
    brownfield_problem:M('The replacement is approaching construction while the existing-condition baseline is still TBD and redline capture is undefined. Expect blockers on the brownfield baseline and configuration control.','Заміна наближається до будівництва, але базовий стан існуючого об’єкта ще TBD, а фіксація redline не визначена. Очікуйте блокери щодо brownfield-бази та контролю конфігурації.','Der Ersatz nähert sich der Ausführung, während der Bestandsstand noch offen und die Redline-Erfassung undefiniert ist. Erwartet werden Blocker bei Bestandsbasis und Konfigurationslenkung.','De vervanging nadert uitvoering terwijl de bestaande toestand nog TBD is en redline-registratie niet is gedefinieerd. Verwacht blokkades op baseline en configuratiebeheer.','Le remplacement approche la construction alors que l’état existant reste à définir et que la capture redline n’est pas définie. Attendez des blocages sur la base brownfield et la configuration.','La sustitución se acerca a construcción con el estado existente aún por definir y sin captura redline definida. Espere bloqueos en la base brownfield y el control de configuración.','Wymiana zbliża się do budowy, gdy stan istniejący jest nadal TBD, a rejestr redline nie jest zdefiniowany. Oczekuj blokad dla bazy brownfield i kontroli konfiguracji.'),
    regulated_problem:M('A safety-significant vendor package has procurement defined, but the verification basis is missing and interface information is only partial. Expect traceability and evidence-ownership findings.','Для safety-significant пакета постачальника закупівлю визначено, але основа верифікації відсутня, а інформація про інтерфейси лише часткова. Очікуйте висновки щодо простежуваності та власника доказів.','Für ein sicherheitsrelevantes Lieferantenpaket ist die Beschaffung definiert, aber die Verifikationsbasis fehlt und Schnittstelleninformationen sind nur teilweise vorhanden. Traceability- und Nachweisverantwortung werden auffällig.','Voor een veiligheidsrelevant leverancierspakket is inkoop gedefinieerd, maar de verificatiebasis ontbreekt en interface-informatie is gedeeltelijk. Verwacht bevindingen over traceerbaarheid en bewijsverantwoordelijkheid.','Pour un lot fournisseur sensible à la sûreté, l’achat est défini mais la base de vérification manque et les interfaces sont partielles. Attendez des constats sur la traçabilité et la responsabilité des preuves.','Para un paquete de proveedor sensible a seguridad, compras está definido, pero falta la base de verificación y las interfaces son parciales. Espere hallazgos de trazabilidad y propiedad de evidencia.','Dla pakietu dostawcy istotnego dla bezpieczeństwa zakupy są zdefiniowane, lecz brakuje podstawy weryfikacji, a interfejsy są częściowe. Oczekuj ustaleń o identyfikowalności i odpowiedzialności za dowody.'),

  function reportSvg(R){
    var m=mapMatrix(R), cellW=58,cellH=22,left=120,top=28,w=left+STAGE_ORDER.length*cellW+12,h=top+PURPOSE_ORDER.length*cellH+42;
    function esc(x){return String(x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
    var fill={existing:'#6b8e6b',required:'#6488b8',dependent:'#c39a4a',missing:'#b65c5c'};
    var a=['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+h+'" role="img">','<rect width="100%" height="100%" fill="white"/>'];
    PURPOSE_ORDER.forEach(function(p,ri){
      var y=top+ri*cellH;
      a.push('<text x="'+(left-6)+'" y="'+(y+15)+'" text-anchor="end" font-size="10" fill="#444">'+esc(loc(DATA.purposes[p]))+'</text>');
      STAGE_ORDER.forEach(function(s,ci){var x=left+ci*cellW,st=m[p][s],fc=st?fill[st]:'#f5f5f5';a.push('<rect x="'+x+'" y="'+y+'" width="'+cellW+'" height="'+cellH+'" fill="'+fc+'" stroke="#ddd"/>');});
    });
    STAGE_ORDER.forEach(function(s,ci){var x=left+(ci+.5)*cellW;a.push('<text x="'+x+'" y="'+(h-10)+'" text-anchor="middle" font-size="8" fill="#444">'+esc(loc(DATA.stages[s]))+'</text>');});
    a.push('</svg>');return a.join('');
  }

  /* diagram-common.js recordCSV() runs String() over every inputs/outputs
     value, so a nested object or an array of objects reaches the CSV as
     "[object Object]" and the plan is lost. Every row here is a scalar; the
     structures stay in report_context, which recordCSV does not flatten. */
  function flatInputs(st){
    var o=clone(st);
    delete o.packages; delete o.deliverable_states;
    (st.packages||[]).forEach(function(p,i){
      o['package['+(i+1)+']']=[p.id||('#'+(i+1)),p.name||'-',p.type||'-',p.owner||'-'].join(' | ');
    });
    (st.deliverable_states||[]).forEach(function(x,i){
      o['deliverable_state['+(i+1)+']']=[x.deliverable||'-',x.state||'auto'].join(' | ');
    });
    return o;
  }

  function flatOutputs(r){
    var o={readiness:r.readiness,target_gate:r.target_gate,future:r.future,open_due:r.openDue};
    Object.keys(r.counts||{}).forEach(function(k){o['count_'+k]=r.counts[k];});
    Object.keys(r.dueCounts||{}).forEach(function(k){o['due_count_'+k]=r.dueCounts[k];});
    o.deliverables_total=r.deliverables.length;
    o.findings_total=r.findings.length;
    r.deliverables.forEach(function(d,i){
      o['deliverable['+(i+1)+']']=[d.id,d.purpose,d.stage,d.timing,d.status,d.state_detail,
        d.package_name||'-',d.status_source||'-'].join(' | ');
    });
    r.findings.forEach(function(f,i){
      o['finding['+(i+1)+']']=[f.id,f.severity,f.stage,f.due?'due':'future'].join(' | ');
    });
    return o;
  }

  function dgcRecord(){
    if(!last)last=solve(state);
    return {
      inputs:flatInputs(state),
      outputs:flatOutputs(last),
      report_context:{
        packages:clone(state.packages||[]),deliverable_states:clone(state.deliverable_states||[]),
        counts:clone(last.counts),due_counts:clone(last.dueCounts),
        deliverables:last.deliverables.map(function(d){return {id:d.id,status:d.status,state:d.state_detail,timing:d.timing,purpose:d.purpose,stage:d.stage,package:d.package_name||null,status_source:d.status_source};}),
        findings:last.findings.map(function(f){return {id:f.id,severity:f.severity,stage:f.stage,due:f.due};})
      },
      units:{},
      model:{
        equations:['Applicable deliverables = information classes(project characteristics, selected lifecycle stages, disciplines, systems/packages)','Due deliverables = applicable deliverables with lifecycle stage at or before selected readiness target','Readiness = due blockers + unresolved due deliverables + due warnings'],
        ranges:['qualitative lifecycle/information planning; gate readiness, not compliance certification'],
        notes:[loc(MANIFEST.validation.basis)]

      warnings:last.dueFindings.filter(function(f){return f.severity==='blocker'||f.severity==='warning';}).map(function(f){return f.id+': '+f.message;})
    };
  }

  function reportProfile(rec){
    if(!last)last=solve(state);
    var R=last, projectRef=[state.project_name,state.project_ref].filter(Boolean).join(' · ')||'—';
    var exec=[
      {label:loc(DATA.ui.target),value:loc(DATA.stages[state.target_gate]||{en:state.target_gate})},
      {label:loc(DATA.ui.controlledDue),value:String(R.dueCounts.existing||0)},
      {label:loc(DATA.ui.openDue),value:String(R.openDue)},
      {label:loc(DATA.ui.blockersDue),value:String(R.blockers)},
      {label:loc(DATA.ui.future),value:String(R.future)}

    var checks=R.findings.map(function(f){return {status:f.due?(f.severity==='blocker'?'fail':(f.severity==='warning'?'attention':'info')):'info',title:(f.due?'':loc(DATA.ui.futureFinding)+': ')+f.message,detail:f.action,basis:f.basis+' · '+loc(DATA.ui.dueBy)+': '+loc(DATA.stages[f.stage]||{en:f.stage})};});

        {label:loc(DATA.ui.disc),value:selectedDisciplineKeys(state).map(function(k){return loc(DATA.disciplines[k]);}).join(', ')||'—'},
        {label:loc(DATA.ui.packageStruct),value:(state.packages||[]).map(function(p){return [p.name,loc(DATA.disciplines[p.discipline]||{en:p.discipline}),p.owner].filter(Boolean).join(' / ');}).join('; ')||'—'},
        {label:loc(DATA.ui.na),value:state.na_reason||'—'}
      ],
      system:{text:[loc(DATA.ui.map)],figure:{svg:reportSvg(R),caption:loc(DATA.ui.map),width:'100%'}},
      results:rows,checks:checks,risks:risks,
      actions:R.findings.map(function(f){return {status:f.due?(f.severity==='blocker'?'attention':'info'):'info',title:f.action,detail:(f.due?'':loc(DATA.ui.futureFinding)+': ')+f.message};}),
      method:{equations:rec.model.equations,ranges:rec.model.ranges,notes:rec.model.notes,references:['ISO/IEC/IEEE 15288:2023','ISO/IEC/IEEE 15289:2019','ISO 21502:2020','ISO 21511:2018 — edition 2 at PRF stage on 2026-09-11']},

/* §2.1 — canonical lifecycle stage -> this tool's lifecycle-scope stage key.
   `factory` is deliberately absent: this tool has no factory-acceptance stage, so
   a package standing at `factory` is REPORTED and the scope is left alone. Rounding
   it to procurement or construction would put deliverables in the plan that the
   user never placed there (§3.4).
   Canonical `close-out` and `decommissioning` both reach the one local stage whose
   own label is "Close-out / decommissioning"; that is a genuine equivalent in this
   vocabulary, not a neighbour. */
var PKG_STAGE_FROM={concept:'concept',basic:'basic',detailed:'detailed',procurement:'procurement',
 construction:'construction',commissioning:'commissioning',handover:'handover',operations:'operations',
 'close-out':'closeout',decommissioning:'closeout'};
/* The reverse spelling, and it is INJECTIVE: this is the direction this tool
   actually writes (every deliverable carries `lifecycle`), so nine local stages
   must reach nine distinct canonical ones. `decommissioning` is never produced
   back — the local vocabulary cannot tell the two apart, and guessing would put a
   canonical value in the package the user never chose. */
var PKG_STAGE_TO={concept:'concept',basic:'basic',detailed:'detailed',procurement:'procurement',
 construction:'construction',commissioning:'commissioning',handover:'handover',operations:'operations',
 closeout:'close-out'};

function pkgSafe(x){ if(x===undefined) return '<undefined>'; try{ return JSON.parse(JSON.stringify(x)); }catch(e){ return String(x); } }
function pkgEq(a,b){ try{ return JSON.stringify(a)===JSON.stringify(b); }catch(e){ return a===b; } }

/* ---- §2.3 / §6 flag display. This tool owns exactly one kind: `deliverable`. ---- */
var MY_FLAG_KINDS=['deliverable'];
function isFlagObject(f){ return !!f && typeof f==='object' && !Array.isArray(f); }
function rawText(f){ try{ var t=JSON.stringify(f); return t===undefined?String(f):t; }catch(e){ return String(f); } }
/* the flags of the package the user last applied, verbatim. Deliberately NOT part
   of `state`: nothing in the core calculation may depend on the package (§3.5), and
   a key added to state would move the recorded inputs of every benchmark case. */
var pkgFlags=[], pkgPkgDeliverableIds=[], pkgBucketCache=null;
function pkgFlagsInvalidate(){ pkgBucketCache=null; }
/* §6.2 — match over the merged local ∪ package id view. Matching the package view
   alone calls a flag orphaned that the user can see on screen; matching local state
   alone calls one orphaned that the package resolves. */
function pkgKnownIds(){
 var seen={},out=[];
 var rows=null; try{ rows=(last&&last.deliverables)||buildDeliverables(state); }catch(e){ rows=[]; }
 (rows||[]).forEach(function(d){ var id=String(d.id||''); if(id&&!seen[id]){seen[id]=1;out.push(id);} });
 pkgPkgDeliverableIds.forEach(function(id){ if(id&&!seen[id]){seen[id]=1;out.push(id);} });
 return out;
}
/* Three buckets, every entry in exactly one, nothing dropped (§6.2). */
function pkgBuckets(){
 if(pkgBucketCache) return pkgBucketCache;
 var mine={},orphan=[],foreign=[],kset={},nMine=0;
 pkgKnownIds().forEach(function(id){ kset[id]=1; });
 (pkgFlags||[]).forEach(function(f){
  /* guard EVERY field access: f.target_kind on the number 42 is undefined, and
     'kind_'+undefined is a missing label, not a crash anyone would notice. */
  if(!isFlagObject(f)){ foreign.push({raw:rawText(f),obj:null}); return; }
  if(MY_FLAG_KINDS.indexOf(String(f.target_kind))<0){ foreign.push({raw:null,obj:f}); return; }
  var id=String(f.target_id);
  if(kset[id]){ (mine[id]=mine[id]||[]).push(f); nMine++; } else orphan.push(f);
 });
 pkgBucketCache={mine:mine,orphan:orphan,foreign:foreign,nMine:nMine};
 return pkgBucketCache;
}
/* §6.1 — raised_against_revision is optional; when absent it is an em-dash. Agreed
   once, here, so six tools do not invent six placeholders. */
function ciRev(f){ var v=f.raised_against_revision; return (v===undefined||v===null)?'—':v; }
function pkgFlagLines(list){
 var out=[];
 if(list.length>1) out.push(CIt('heading'));
 list.forEach(function(f){
  /* the flag word localised, and f.reason VERBATIM — not translated, shortened or
     reformatted; it is the only part of a flag carrying engineering content. */
  out.push(CIt(String(f.flag))+': '+String(f.reason));
  out.push(CIt('origin',{tool:String(f.raised_by),when:String(f.raised_at),rev:ciRev(f)}));
 });
 out.push(CIt('notEdited'));
 return out;
}
/* The flag lands beside the row it concerns (§2.3, as amended), attached to the
   deliverable's name cell. Showing is not editing: nothing filters, reorders,
   hides or disables a flagged row, and this tool offers no way to resolve or
   dismiss a flag, because only changeimpact may write `flags`. */
var pkgOldDcell=dcell;
dcell=function(d,key){
 var base=pkgOldDcell(d,key);
 if(key!=='name'||!pkgFlags.length||!d||!d.id) return base;
 var list=pkgBuckets().mine[String(d.id)];
 if(!list||!list.length) return base;
 return base+'\n'+CIt('count',{n:list.length})+'\n'+pkgFlagLines(list).join('\n');
};

/* deliverables[] — the register this tool owns (§2.3), and now also READS BACK.
   Every local column is carried so local -> canonical -> local is exact, plus
   `lifecycle`, the canonical §2.1 spelling of the row's stage.
   §2.3 on ids: the rows that are not tied to a package carry this tool's own
   stable catalogue key (`project_definition`, `discipline_analysis__mechanical`),
   which survives every rename. The rows replicated per package carry a name-derived
   suffix, so renaming a package changes those ids — second best, and said so. */
function pkgLabelEn(d){
 var base=(DATA.names[d.base_id]&&DATA.names[d.base_id].en)||d.base_id;
 if(d.discipline) return ((DATA.disciplines[d.discipline]&&DATA.disciplines[d.discipline].en)||d.discipline)+' — '+base;
 return base;
}
function pkgDeliverablesOut(s){
 s=s||state;

 function packOf(name){ for(var i=0;i<packs.length;i++){ if(packs[i]&&String(packs[i].name||'')===String(name)) return packs[i]; } return null; }
 return rows.map(function(d){
  var pk=d.package_name?packOf(d.package_name):null;
  return { id:String(d.id||''), label:pkgLabelEn(d), base_id:String(d.base_id||''),
   lifecycle:PKG_STAGE_TO[d.stage]||'', stage:String(d.stage||''),
   purpose:String(d.purpose||''), type:String(d.type||''),
   producer:String(d.producer||''), receiver:String(d.receiver||''),
   prereq:String(d.prereq||''), consumer:String(d.consumer||''), reason:String(d.reason||''),
   evidence_key:String(d.evidence||''), trigger:String(d.trigger||''),
   discipline:String(d.discipline||''),
   /* §2.2 — never a name in an id field. system_id stays empty when upstream had
      only a free-text name; system_name carries the name it actually had. */
   package_id:String((pk&&pk.id)||''), package_name:String(d.package_name||''),
   package_owner:String(d.package_owner||''), package_type:String(d.package_type||''),
   package_maturity:String(d.package_maturity||''),
   system_id:String((pk&&pk.system_id)||''), system_name:String((pk&&pk.system_name)||''),
   status:String(d.status||''), state:String(d.state_detail||''), timing:String(d.timing||''),
   status_source:String(d.status_source||'') };
 });

function pkgLocalShape(d){

  stage:String(d.stage||''), producer:String(d.producer||''), receiver:String(d.receiver||''), prereq:String(d.prereq||''),
  consumer:String(d.consumer||''), reason:String(d.reason||''), evidence:String(d.evidence||''), trigger:String(d.trigger||''),
  status:String(d.status||''), state_detail:String(d.state_detail||''), timing:String(d.timing||''),
  status_source:String(d.status_source||'') };
 if(String(d.discipline||'')) o.discipline=String(d.discipline);
 if(String(d.package_name||'')){ o.package_name=String(d.package_name); o.package_owner=String(d.package_owner||'');
  o.package_type=String(d.package_type||''); o.package_maturity=String(d.package_maturity||''); }

}
function pkgDeliverablesIn(rows){
 return (Array.isArray(rows)?rows:[]).map(function(r){
  r=r||{};
  var o={ id:String(r.id||''), base_id:String(r.base_id||''), purpose:String(r.purpose||''), type:String(r.type||''),
   stage:String(r.stage||''), producer:String(r.producer||''), receiver:String(r.receiver||''), prereq:String(r.prereq||''),
   consumer:String(r.consumer||''), reason:String(r.reason||''), evidence:String(r.evidence_key||''), trigger:String(r.trigger||''),
   status:String(r.status||''), state_detail:String(r.state||''), timing:String(r.timing||''),
   status_source:String(r.status_source||'') };
  if(String(r.discipline||'')) o.discipline=String(r.discipline);
  if(String(r.package_name||'')){ o.package_name=String(r.package_name); o.package_owner=String(r.package_owner||'');
   o.package_type=String(r.package_type||''); o.package_maturity=String(r.package_maturity||''); }
  return o;
 });
}
/* §2.3 — uniqueness is tested on the ID THIS TOOL ACTUALLY EMITS, never on the
   name. Two distinct names slug to one id ("AHU-01" and "AHU 01"), so a
   name-uniqueness rule reports success while colliding ids ship. A collision
   refuses the save; it never gets a numeric suffix, which would hand two different
   things one identity on the next run. */
function pkgIdCollisions(rows){
 var seen={},dup=[];
 (rows||[]).forEach(function(r,i){
  var id=String((r&&r.id)||'');
  if(!id){ dup.push({id:'',index:i,label:String((r&&r.label)||''),first:-1}); return; }
  if(seen[id]!==undefined) dup.push({id:id,index:i,label:String((r&&r.label)||''),first:seen[id]});
  else seen[id]=i;
 });
 return dup;
}
/* §6 item 5 — read back what you write. A tool that writes a register it never
   reads announces on every reload that it is discarding data it wrote itself.
   The plan itself is always recomputed from the project, because it is derived;
   what the register carries that is genuinely the USER'S input, and is therefore
   restored, is the per-deliverable state overrides. */
function pkgDeliverablesApply(rows,st){
 var overrides=[],total=0;
 (Array.isArray(rows)?rows:[]).forEach(function(r){
  if(!r||typeof r!=='object'||Array.isArray(r)) return;
  total++;
  var id=String(r.id||''), sv=String(r.state||'');
  if(String(r.status_source||'')==='override'&&id&&sv&&sv!=='auto') overrides.push({deliverable:id,state:sv});
 });
 if(overrides.length){
  if(!Array.isArray(st.deliverable_states)) st.deliverable_states=[];
  st.deliverable_states.splice.apply(st.deliverable_states,[0,st.deliverable_states.length].concat(overrides));
 }
 return {total:total,restored:overrides.length,ids:overrides.map(function(o){return o.deliverable;})};
}

/* Apply what this tool reads. Called only from the Load / Load package buttons. */
function pkgApply(p,target){
 var st=target||state;
 var applied=[],unmapped=[],replaced=[],notes=[];
 function setField(labelKey,key,value){
  var was=st[key];
  if(String(was)===String(value)) return;
  if(String(was||'').trim()) replaced.push(Pt(labelKey)+': “'+String(was)+'” → “'+String(value)+'”');
  st[key]=value; applied.push(Pt(labelKey));
 }
 var pr=p&&p.project;
 if(pr&&typeof pr==='object'){
  setField('field_project_name','project_name',String(pr.name||''));
  setField('field_project_ref','project_ref',String(pr.reference||''));
  /* §2.1 — `gate` is "the tool-declared gate id the user is working toward", which
     is exactly this tool's readiness target. A gate spelled in another tool's
     vocabulary has no equivalent here; it is reported and the target left alone. */
  if(pr.gate!=null&&String(pr.gate)){
   var g=String(pr.gate);
   if(DATA.stages[g]) setField('field_gate','target_gate',g);
   else unmapped.push(Pt('field_gate')+': '+g);
  }
  /* The package carries ONE lifecycle stage; this tool carries a SET of nine
     stage booleans. A project standing at stage X has produced the engineering
     information of X and of every stage before it, so the scope is filled
     cumulatively to X; stages beyond X are left exactly as the user had them,
     because the package has no way to say whether they are in scope. */
  if(pr.lifecycle!=null&&String(pr.lifecycle)){
   var lc=String(pr.lifecycle);
   var localStage=Object.prototype.hasOwnProperty.call(PKG_STAGE_FROM,lc)?PKG_STAGE_FROM[lc]:null;
   if(localStage){
    var rank=STAGE_ORDER.indexOf(localStage), turned=[];
    STAGE_ORDER.forEach(function(k,i){ if(i<=rank&&!st['stage_'+k]){ st['stage_'+k]=true; turned.push(loc(DATA.stages[k])); } });
    if(turned.length) applied.push(Pt('field_scope'));
    notes.push(Pt('scopeSet',{stage:loc(DATA.stages[localStage]),list:turned.length?turned.join(', '):'—'}));
   } else unmapped.push(Pt('field_scope')+': '+lc);
  }
  notes.push(Pt('maturityKept',{value:loc(DATA.maturities[st.maturity]||{en:String(st.maturity)})}));
 }
 /* §2.2 — structure.packages is interfacebuilder's array. This tool reads it into
    its own optional project structure and never writes it back. */
 var stc=p&&p.structure;
 var rows=(stc&&Array.isArray(stc.packages))?stc.packages:null;
 if(rows&&rows.length){
  var mapped=[],byName=[],badDisc=[];
  rows.forEach(function(q,i){
   q=q||{};
   var dk=String(q.discipline||'');
   if(dk&&!DATA.disciplines[dk]){ badDisc.push(String(q.name||('#'+(i+1)))+': '+dk); dk=''; }
   mapped.push({ id:String(q.id||''), name:String(q.name||''), type:'system', discipline:dk||'mechanical',
    maturity:String(st.maturity||'concept'), owner:String(q.organisation||q.lead||''),
    system_id:String(q.system_id||''), system_name:String(q.system_name||'') });
   /* §2.2 — a tool holding only a free-text system name fills system_name and
      leaves system_id empty. Say the link is by name and unresolved, rather than
      matching a name against an id field and finding nothing. */
   if(!String(q.system_id||'')&&String(q.system_name||'')) byName.push(String(q.name||('#'+(i+1)))+' → '+String(q.system_name));
  });
  if(!Array.isArray(st.packages)) st.packages=[];
  st.packages.splice.apply(st.packages,[0,st.packages.length].concat(mapped));
  applied.push(Pt('field_packages'));
  notes.push(Pt('localOnly'));
  if(byName.length) notes.push(Pt('systemByName',{list:byName.join('; ')}));
  if(badDisc.length) unmapped.push(Pt('field_packages')+': '+badDisc.join('; '));
 } else notes.push(Pt('noStructure'));
 /* requirements[] is requirementsmatrix's register. It is read and shown as
    context; this tool never infers an evidence state from the fact that rows
    exist, and never edits a register it does not own (§3.3). This tool does not
    render requirement ROWS, so a `requirement` flag is not its kind and goes to
    the foreign bucket rather than being displayed beside anything here. */
 var reqs=p&&p.requirements;
 if(Array.isArray(reqs)){
  notes.push(reqs.length
   ? Pt('reqSeen',{n:reqs.length,value:loc(DATA.ev[st.ev_requirements_basis]||{en:String(st.ev_requirements_basis)})})
   : Pt('reqNone'));
 }
 /* §6 item 5 — read back the register this tool owns. */
 var mineRows=p&&p.deliverables;
 if(Array.isArray(mineRows)){
  var back=pkgDeliverablesApply(mineRows,st);
  pkgPkgDeliverableIds=mineRows.map(function(r){ return String((r&&r.id)||''); }).filter(Boolean);
  if(back.total){ notes.push(Pt('delivSeen',{n:back.total,m:back.restored})); if(back.restored) applied.push(Pt('field_states')); }
  else notes.push(Pt('delivNone'));
 } else { pkgPkgDeliverableIds=[]; notes.push(Pt('delivNone')); }
 /* §2.3 — flags are held verbatim for display. Never written, never edited. */
 pkgFlags=Array.isArray(p&&p.flags)?(p.flags||[]).slice():[];
 pkgFlagsInvalidate();
 return { applied:applied, unmapped:unmapped, replaced:replaced, notes:notes };
}
