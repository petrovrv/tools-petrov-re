    intro_t: ['Plan an entry', 'Сплануйте вхід', 'Einen Einstieg planen', 'Een toetreding plannen', 'Planifier une entrée', 'Planificar una entrada', 'Zaplanuj wejście'],
    intro_x: ['Mark at least one entry on the sketch, record the atmospheric hazards and link each reading to a measuring point and a time. The checklist appears once the plan has content.',
      'Позначте на ескізі хоча б один вхід, запишіть атмосферні небезпеки й прив’яжіть кожне вимірювання до точки та часу. Перелік перевірок з’явиться, щойно план матиме вміст.',
      'Mindestens einen Zugang in die Skizze setzen, die Gefährdungen der Atmosphäre erfassen und jeden Messwert einem Messpunkt und einer Uhrzeit zuordnen. Die Prüfliste erscheint, sobald der Plan Inhalt hat.',
      'Zet minstens één toegang op de schets, leg de atmosferische gevaren vast en koppel elke meting aan een meetpunt en een tijdstip. De checklist verschijnt zodra het plan inhoud heeft.',
      'Placez au moins un accès sur le croquis, saisissez les dangers atmosphériques et rattachez chaque mesure à un point et à une heure. La liste de contrôle apparaît dès que le plan a un contenu.',
      'Marque al menos un acceso en el croquis, registre los peligros atmosféricos y vincule cada lectura a un punto y una hora. La lista de comprobación aparece cuando el plan tiene contenido.',
      'Zaznacz na szkicu co najmniej jedno wejście, zapisz zagrożenia atmosferyczne i powiąż każdy odczyt z punktem pomiarowym i czasem. Lista kontrolna pojawi się, gdy plan będzie miał treść.'],
    learn_zone_t: ['Zones by thirds of height', 'Зони за третинами висоти', 'Zonen nach Höhendritteln', 'Zones per derde van de hoogte', 'Zones par tiers de hauteur', 'Zonas por tercios de altura', 'Strefy według tercji wysokości'],
    learn_zone_x: ['The sketch height is split into a low, a middle and an upper third. A gas heavier than air tends to collect low, a lighter one high; the tool asks for a current reading in that third. This is a teaching heuristic: real distribution depends on temperature, release and air movement.',
      'Висоту ескізу поділено на нижню, середню й верхню третини. Газ, важчий за повітря, схильний накопичуватися внизу, легший — угорі; інструмент вимагає актуального вимірювання в цій третині. Це навчальна евристика: реальний розподіл залежить від температури, виділення та руху повітря.',
      'Die Skizzenhöhe ist in ein unteres, mittleres und oberes Drittel geteilt. Ein Gas schwerer als Luft sammelt sich eher unten, ein leichteres oben; das Werkzeug verlangt dort einen aktuellen Messwert. Das ist eine Lehrheuristik: die tatsächliche Verteilung hängt von Temperatur, Freisetzung und Luftbewegung ab.',
      'De hoogte van de schets is verdeeld in een onderste, middelste en bovenste derde. Een gas zwaarder dan lucht verzamelt zich eerder laag, een lichter gas hoog; de tool vraagt daar een actuele meting. Dit is een lesheuristiek: de werkelijke verdeling hangt af van temperatuur, vrijkomen en luchtbeweging.',
      'La hauteur du croquis est divisée en tiers bas, médian et haut. Un gaz plus lourd que l’air tend à s’accumuler en bas, un gaz plus léger en haut ; l’outil demande une mesure actuelle dans ce tiers. C’est une heuristique pédagogique : la répartition réelle dépend de la température, du rejet et des mouvements d’air.',
      'La altura del croquis se divide en un tercio bajo, medio y alto. Un gas más pesado que el aire tiende a acumularse abajo y uno más ligero arriba; la herramienta pide una lectura actual en ese tercio. Es una heurística didáctica: la distribución real depende de la temperatura, la emisión y el movimiento del aire.',
      'Wysokość szkicu podzielono na dolną, środkową i górną tercję. Gaz cięższy od powietrza gromadzi się raczej nisko, lżejszy wysoko; narzędzie wymaga aktualnego odczytu w tej tercji. To heurystyka dydaktyczna: rzeczywisty rozkład zależy od temperatury, uwolnienia i ruchu powietrza.'],
    learn_ev_t: ['Which reading governs', 'Яке вимірювання визначальне', 'Welcher Messwert zählt', 'Welke meting telt', 'Quelle mesure fait foi', 'Qué lectura rige', 'Który odczyt jest wiążący'],
    learn_ev_x: ['For each measuring point and measured quantity the latest reading at or before the assessment time governs; older ones at the same point are shown as superseded. A reading describes its own point: one point never stands for the whole space.',
      'Для кожної точки та величини визначальним є останнє вимірювання на момент оцінки або раніше; старіші в тій самій точці позначено як замінені. Вимірювання описує лише свою точку: одна точка не представляє весь простір.',
      'Je Messpunkt und Messgröße gilt der letzte Wert zum oder vor dem Bewertungszeitpunkt; ältere Werte am selben Punkt gelten als ersetzt. Ein Messwert beschreibt seinen Punkt: ein einzelner Punkt steht nie für den ganzen Raum.',
      'Per meetpunt en meetgrootheid telt de laatste meting op of vóór het beoordelingstijdstip; oudere metingen op hetzelfde punt gelden als vervangen. Een meting beschrijft haar eigen punt: één punt staat nooit voor de hele ruimte.',
      'Pour chaque point et grandeur, la dernière mesure à l’heure d’évaluation ou avant fait foi ; les plus anciennes au même point sont marquées remplacées. Une mesure décrit son point : un seul point ne représente jamais tout l’espace.',
      'Para cada punto y magnitud rige la última lectura en el momento de evaluación o antes; las anteriores en el mismo punto figuran como sustituidas. Una lectura describe su punto: un solo punto nunca representa todo el espacio.',
      'Dla każdego punktu i wielkości wiążący jest ostatni odczyt w chwili oceny lub wcześniej; starsze w tym samym punkcie oznaczono jako zastąpione. Odczyt opisuje swój punkt: jeden punkt nigdy nie reprezentuje całej przestrzeni.'],
    learn_rd_t: ['Readiness states', 'Стани готовності', 'Bereitschaftszustände', 'Gereedheidstoestanden', 'États de préparation', 'Estados de preparación', 'Stany gotowości'],
    learn_rd_x: ['Blocked: at least one check is not met. Insufficient data: nothing is violated, but evidence is missing or too old. Attention: only advisory points are open. No unresolved finding: every check in the modelled scope is met; ventilation alone never produces this state.',
      'Заблоковано: принаймні одна перевірка не виконана. Недостатньо даних: порушень немає, але доказів бракує або вони застарілі. Увага: відкриті лише рекомендаційні пункти. Немає невирішених зауважень: усі перевірки в змодельованих межах виконано; сама вентиляція цього стану не дає.',
      'Blockiert: mindestens eine Prüfung ist nicht erfüllt. Unzureichende Daten: nichts ist verletzt, aber Nachweise fehlen oder sind zu alt. Hinweis: nur empfehlende Punkte sind offen. Kein offener Befund: jede Prüfung im modellierten Umfang ist erfüllt; Lüftung allein führt nie zu diesem Zustand.',
      'Geblokkeerd: minstens één controle is niet voldaan. Onvoldoende gegevens: niets is overschreden, maar bewijs ontbreekt of is te oud. Aandacht: alleen adviespunten staan open. Geen open bevinding: elke controle binnen de gemodelleerde reikwijdte is voldaan; ventilatie alleen leidt nooit tot deze toestand.',
      'Bloqué : au moins un contrôle n’est pas satisfait. Données insuffisantes : rien n’est dépassé, mais des preuves manquent ou sont trop anciennes. Attention : seuls des points de vigilance restent ouverts. Aucun constat ouvert : tous les contrôles du périmètre modélisé sont satisfaits ; la ventilation seule ne produit jamais cet état.',
      'Bloqueado: al menos una comprobación no se cumple. Datos insuficientes: nada se incumple, pero faltan pruebas o son antiguas. Atención: solo quedan puntos de aviso. Sin hallazgos pendientes: se cumplen todas las comprobaciones del alcance modelado; la ventilación por sí sola nunca produce este estado.',
      'Zablokowane: co najmniej jedna kontrola nie jest spełniona. Niewystarczające dane: nic nie jest przekroczone, ale brakuje dowodów lub są zbyt stare. Uwaga: otwarte są tylko punkty zalecane. Brak otwartych ustaleń: każda kontrola w modelowanym zakresie jest spełniona; sama wentylacja nigdy nie daje tego stanu.'],

    rp_m5: ['Density class from molar mass M against dry air 28.96 g/mol (ISO 2533:1975 standard atmosphere, 28.9644): heavier from +4 % upwards, lighter from −4 % downwards, otherwise close to air (the ±4 % band is the tool’s own heuristic). Listed molar masses are computed from IUPAC standard atomic weights. Temperature differences can reverse layering; a user choice overrides the derived class and is shown beside it.',
      'Клас густини за молярною масою M відносно сухого повітря 28,96 г/моль (стандартна атмосфера ISO 2533:1975, 28,9644): важчий від +4 % і більше, легший від −4 % і менше, інакше близька до повітря (смуга ±4 % — власна евристика інструмента). Молярні маси зі списку обчислено за стандартними атомними масами IUPAC. Різниця температур може змінити розшарування; вибір користувача замінює обчислений клас і показується поруч із ним.',
      'Dichteklasse aus der molaren Masse M gegenüber trockener Luft 28,96 g/mol (Normatmosphäre ISO 2533:1975, 28,9644): schwerer ab +4 %, leichter ab −4 %, sonst ähnlich wie Luft (das ±4-%-Band ist eine eigene Heuristik des Werkzeugs). Die Listenwerte sind aus den IUPAC-Standardatomgewichten berechnet. Temperaturunterschiede können die Schichtung umkehren; eine Nutzerwahl ersetzt die abgeleitete Klasse und wird daneben angezeigt.',
      'Dichtheidsklasse uit molaire massa M ten opzichte van droge lucht 28,96 g/mol (standaardatmosfeer ISO 2533:1975, 28,9644): zwaarder vanaf +4 %, lichter vanaf −4 %, anders vergelijkbaar met lucht (de ±4 %-band is een eigen heuristiek van het hulpmiddel). De lijstwaarden zijn berekend uit de IUPAC-standaardatoommassa’s. Temperatuurverschillen kunnen de gelaagdheid omkeren; een keuze van de gebruiker vervangt de afgeleide klasse en staat ernaast.',
      'Classe de densité d’après la masse molaire M comparée à l’air sec 28,96 g/mol (atmosphère type ISO 2533:1975, 28,9644) : plus lourd à partir de +4 %, plus léger à partir de −4 %, sinon voisine de l’air (la bande ±4 % est une heuristique propre à l’outil). Les masses molaires de la liste sont calculées à partir des masses atomiques standard de l’IUPAC. Un écart de température peut inverser la stratification ; un choix de l’utilisateur remplace la classe calculée et s’affiche à côté.',
      'Clase de densidad según la masa molar M frente al aire seco 28,96 g/mol (atmósfera tipo ISO 2533:1975, 28,9644): más pesado desde +4 %, más ligero desde −4 %, si no similar al aire (la banda ±4 % es una heurística propia de la herramienta). Las masas molares de la lista se calculan con los pesos atómicos estándar de la IUPAC. Las diferencias de temperatura pueden invertir la estratificación; una elección del usuario sustituye la clase calculada y se muestra a su lado.',
      'Klasa gęstości z masy molowej M względem suchego powietrza 28,96 g/mol (atmosfera wzorcowa ISO 2533:1975, 28,9644): cięższy od +4 % w górę, lżejszy od −4 % w dół, w przeciwnym razie zbliżona do powietrza (pasmo ±4 % to własna heurystyka narzędzia). Masy molowe z listy obliczono ze standardowych mas atomowych IUPAC. Różnica temperatur może odwrócić uwarstwienie; wybór użytkownika zastępuje wyliczoną klasę i jest pokazywany obok.'],

    rp_m1: ['Readiness is the worst status among the checks: any check not met gives Blocked; otherwise missing or old evidence gives Insufficient data; otherwise an advisory point gives Attention.', 'Готовність — найгірший статус серед перевірок: будь-яка невиконана дає «Заблоковано»; інакше відсутні чи застарілі докази дають «Недостатньо даних»; інакше рекомендаційний пункт дає «Увага».', 'Die Bereitschaft ist der schlechteste Status der Prüfungen: jede nicht erfüllte ergibt Blockiert; sonst ergeben fehlende oder alte Nachweise Unzureichende Daten; sonst ergibt ein Hinweis Hinweise offen.', 'Gereedheid is de slechtste status van de controles: een niet-voldane geeft Geblokkeerd; anders geeft ontbrekend of oud bewijs Onvoldoende gegevens; anders geeft een adviespunt Aandacht.', 'La préparation est le pire état des contrôles : un contrôle non satisfait donne Bloqué ; sinon une preuve manquante ou ancienne donne Données insuffisantes ; sinon un point de vigilance donne Attention.', 'La preparación es el peor estado de las comprobaciones: cualquiera no cumplida da Bloqueado; si no, pruebas ausentes o antiguas dan Datos insuficientes; si no, un aviso da Atención.', 'Gotowość to najgorszy status spośród kontroli: niespełniona daje Zablokowane; w przeciwnym razie brakujące lub stare dowody dają Niewystarczające dane; w przeciwnym razie punkt zalecany daje Uwaga.'],
    rp_m2: ['For each point and quantity the latest reading not after the assessment time governs. Zones are thirds of the sketch height.', 'Для кожної точки й величини визначальним є останнє вимірювання не пізніше часу оцінки. Зони — третини висоти ескізу.', 'Je Punkt und Größe zählt der letzte Wert nicht nach dem Bewertungszeitpunkt. Zonen sind Drittel der Skizzenhöhe.', 'Per punt en grootheid telt de laatste meting niet na het beoordelingstijdstip. Zones zijn derden van de schetshoogte.', 'Pour chaque point et grandeur, la dernière mesure non postérieure à l’évaluation fait foi. Les zones sont les tiers de la hauteur.', 'Para cada punto y magnitud rige la última lectura no posterior a la evaluación. Las zonas son tercios de la altura del croquis.', 'Dla każdego punktu i wielkości wiążący jest ostatni odczyt nie późniejszy niż ocena. Strefy to tercje wysokości szkicu.'],
    rp_m3: ['Detector selection, installation and maintenance for flammable gases and oxygen are the subject of EN 60079-29-2, and for toxic gases of EN 45544-4; this tool does not assess them.', 'Вибір, монтаж і обслуговування детекторів горючих газів і кисню є предметом EN 60079-29-2, токсичних газів — EN 45544-4; цей інструмент їх не оцінює.', 'Auswahl, Installation und Wartung von Gaswarngeräten für brennbare Gase und Sauerstoff regelt EN 60079-29-2, für giftige Gase EN 45544-4; dieses Werkzeug beurteilt sie nicht.', 'Selectie, installatie en onderhoud van detectoren voor brandbare gassen en zuurstof behandelt EN 60079-29-2, voor giftige gassen EN 45544-4; deze tool beoordeelt ze niet.', 'Le choix, l’installation et la maintenance des détecteurs de gaz inflammables et d’oxygène relèvent de l’EN 60079-29-2, et pour les gaz toxiques de l’EN 45544-4 ; l’outil ne les évalue pas.', 'La selección, instalación y mantenimiento de detectores de gases inflamables y oxígeno son objeto de la EN 60079-29-2, y de gases tóxicos de la EN 45544-4; esta herramienta no los evalúa.', 'Dobór, instalację i konserwację detektorów gazów palnych i tlenu obejmuje EN 60079-29-2, a gazów toksycznych EN 45544-4; narzędzie ich nie ocenia.'],
    rp_m4: ['The training preset follows the oxygen and explosive-limit concepts taught in VCA basic safety courses; its numbers are not taken from VCA material.', 'Навчальний пресет спирається на поняття кисню та меж вибуховості з курсів VCA; його числа не взято з матеріалів VCA.', 'Die Schulungsvorgabe folgt den in VCA-Kursen gelehrten Begriffen Sauerstoff und Explosionsgrenzen; ihre Zahlen stammen nicht aus VCA-Material.', 'De trainingsinstelling volgt de begrippen zuurstof en explosiegrenzen uit VCA-cursussen; de getallen komen niet uit VCA-materiaal.', 'Le préréglage de formation reprend les notions d’oxygène et de limites d’explosivité des cours VCA ; ses valeurs ne proviennent pas du matériel VCA.', 'El preajuste de formación sigue los conceptos de oxígeno y límites de explosividad de los cursos VCA; sus números no proceden del material VCA.', 'Ustawienie szkoleniowe opiera się na pojęciach tlenu i granic wybuchowości z kursów VCA; jego liczby nie pochodzą z materiałów VCA.'],
    rp_exec: ['Entry readiness for the entered plan: {s}. Rescue plan: {r}. {o} of {n} checks are open.', 'Готовність до входу для введеного плану: {s}. План рятування: {r}. Відкрито {o} з {n} перевірок.', 'Einstiegsbereitschaft für den eingegebenen Plan: {s}. Rettungsplan: {r}. {o} von {n} Prüfungen sind offen.', 'Gereedheid voor het ingevoerde plan: {s}. Reddingsplan: {r}. {o} van {n} controles staan open.', 'Préparation pour le plan saisi : {s}. Plan de secours : {r}. {o} contrôles ouverts sur {n}.', 'Preparación del plan introducido: {s}. Plan de rescate: {r}. {o} de {n} comprobaciones abiertas.', 'Gotowość dla wprowadzonego planu: {s}. Plan ratowniczy: {r}. Otwarte kontrole: {o} z {n}.'],
    rp_exec2: ['The sheet records a planning state at {t}; it is not an entry permit and does not replace the site procedure.', 'Аркуш фіксує стан планування на {t}; він не є дозволом на вхід і не замінює процедуру об’єкта.', 'Das Blatt hält einen Planungsstand von {t} fest; es ist keine Einstiegsfreigabe und ersetzt nicht das Standortverfahren.', 'Dit blad legt een planningsstand vast op {t}; het is geen toetredingsvergunning en vervangt de locatieprocedure niet.', 'La fiche consigne un état de planification à {t} ; ce n’est pas un permis d’entrée et elle ne remplace pas la procédure du site.', 'La hoja registra un estado de planificación a las {t}; no es un permiso de entrada ni sustituye el procedimiento del emplazamiento.', 'Arkusz zapisuje stan planowania na {t}; nie jest pozwoleniem na wejście i nie zastępuje procedury zakładowej.'],

    p_gas: ['Where gases tend to collect', 'Де схильні накопичуватися гази', 'Wo sich Gase eher sammeln', 'Waar gassen zich eerder verzamelen', 'Où les gaz tendent à s’accumuler', 'Dónde tienden a acumularse los gases', 'Gdzie gazy mają tendencję się gromadzić'],
    ga_key: ['Ochre band with downward arrows: gas heavier than air. Blue band with upward arrows: gas lighter than air. Grey: stored material or water.', 'Вохриста смуга зі стрілками вниз: газ, важчий за повітря. Синя смуга зі стрілками вгору: газ, легший за повітря. Сіре: матеріал або вода.', 'Ockerband mit Pfeilen nach unten: Gas schwerer als Luft. Blaues Band mit Pfeilen nach oben: Gas leichter als Luft. Grau: Schüttgut oder Wasser.', 'Okerband met pijlen omlaag: gas zwaarder dan lucht. Blauwe band met pijlen omhoog: gas lichter dan lucht. Grijs: opgeslagen materiaal of water.', 'Bande ocre, flèches vers le bas : gaz plus lourd que l’air. Bande bleue, flèches vers le haut : gaz plus léger que l’air. Gris : matière stockée ou eau.', 'Banda ocre con flechas hacia abajo: gas más pesado que el aire. Banda azul con flechas hacia arriba: gas más ligero que el aire. Gris: material almacenado o agua.', 'Pas ochry ze strzałkami w dół: gaz cięższy od powietrza. Pas niebieski ze strzałkami w górę: gaz lżejszy od powietrza. Szary: składowany materiał lub woda.'],
    ga_caveat: ['Teaching illustrations: temperature, the release point and air movement change the real distribution, which is why readings are required at several points.', 'Навчальні ілюстрації: температура, місце виділення та рух повітря змінюють реальний розподіл, тому вимірювання потрібні в кількох точках.', 'Lehrbilder: Temperatur, Freisetzungsort und Luftbewegung verändern die tatsächliche Verteilung; deshalb sind Messungen an mehreren Punkten nötig.', 'Lesillustraties: temperatuur, bron en luchtbeweging veranderen de werkelijke verdeling; daarom zijn metingen op meerdere punten nodig.', 'Illustrations pédagogiques : la température, le point de rejet et les mouvements d’air modifient la répartition réelle, d’où des mesures en plusieurs points.', 'Ilustraciones didácticas: la temperatura, el punto de emisión y el movimiento del aire cambian la distribución real; por eso se exigen lecturas en varios puntos.', 'Ilustracje dydaktyczne: temperatura, miejsce uwolnienia i ruch powietrza zmieniają rzeczywisty rozkład, dlatego wymagane są odczyty w kilku punktach.'],
    ga_current: ['type of the current plan', 'тип поточного плану', 'Art des aktuellen Plans', 'soort van het huidige plan', 'type du plan en cours', 'tipo del plan actual', 'rodzaj bieżącego planu'],
    ga_vessel: ['Heavy vapour pools in the bottom head and outlet nozzle; light gas gathers under the top head.', 'Важка пара збирається в нижньому днищі та зливному штуцері; легкий газ — під верхнім днищем.', 'Schwerer Dampf sammelt sich im Unterboden und Auslaufstutzen; leichtes Gas unter dem Oberboden.', 'Zware damp verzamelt zich in de bodem en de aftapstomp; licht gas onder de bovenbodem.', 'La vapeur lourde stagne dans le fond et la tubulure de vidange ; le gaz léger sous le fond supérieur.', 'El vapor pesado se acumula en el fondo y la tubuladura de vaciado; el gas ligero bajo el fondo superior.', 'Ciężka para gromadzi się w dnie i króćcu spustowym; lekki gaz pod dnem górnym.'],
    ga_sewer: ['Heavy gas lies in the pipe invert and can flow in from connected sections; light gas gathers in the shaft under the cover.', 'Важкий газ лежить у лотку труби й може надходити з сусідніх ділянок; легкий газ — у шахті під кришкою.', 'Schweres Gas liegt in der Rohrsohle und kann aus angeschlossenen Haltungen zufließen; leichtes Gas sammelt sich im Schacht unter dem Deckel.', 'Zwaar gas ligt op de buisbodem en kan uit aangesloten strengen toestromen; licht gas verzamelt zich in de put onder het deksel.', 'Le gaz lourd occupe le radier et peut venir des tronçons raccordés ; le gaz léger s’accumule dans la cheminée sous le tampon.', 'El gas pesado ocupa la solera y puede llegar de tramos conectados; el gas ligero se acumula en el pozo bajo la tapa.', 'Ciężki gaz zalega w dnie kanału i może napływać z połączonych odcinków; lekki gaz gromadzi się w kominie pod włazem.'],
    ga_pit: ['Heavy gas stays on the pit floor even with the top open; light gas usually leaves through the opening unless it is covered.', 'Важкий газ залишається на дні приямка навіть із відкритим верхом; легкий газ зазвичай виходить через отвір, якщо його не накрито.', 'Schweres Gas bleibt auch bei offener Grube am Boden; leichtes Gas entweicht meist durch die Öffnung, sofern sie nicht abgedeckt ist.', 'Zwaar gas blijft op de putbodem, ook met open bovenkant; licht gas ontsnapt meestal door de opening, tenzij die is afgedekt.', 'Le gaz lourd reste au fond de la fosse même ouverte ; le gaz léger s’échappe en général par l’ouverture si elle n’est pas couverte.', 'El gas pesado permanece en el fondo aunque el foso esté abierto; el gas ligero suele salir por la abertura si no está cubierta.', 'Ciężki gaz pozostaje na dnie nawet przy otwartej studzience; lekki gaz zwykle uchodzi przez otwór, jeśli nie jest przykryty.'],
    ga_duct: ['Heavy gas runs to low sections of the run; light gas moves to the high end.', 'Важкий газ стікає до нижніх ділянок траси; легкий газ рухається до вищого кінця.', 'Schweres Gas läuft zu tiefen Abschnitten der Trasse; leichtes Gas wandert zum hohen Ende.', 'Zwaar gas stroomt naar lage delen van het tracé; licht gas beweegt naar het hoge eind.', 'Le gaz lourd s’écoule vers les points bas du tracé ; le gaz léger migre vers l’extrémité haute.', 'El gas pesado fluye hacia los tramos bajos del recorrido; el gas ligero se desplaza al extremo alto.', 'Ciężki gaz spływa do niskich odcinków trasy; lekki gaz przemieszcza się ku wyższemu końcowi.'],
    ga_room: ['Heavy gas fills floor trenches and the floor layer first; light gas gathers in ceiling pockets between beams.', 'Важкий газ спершу заповнює підлогові канали й нижній шар; легкий газ — кишені під стелею між балками.', 'Schweres Gas füllt zuerst Bodenkanäle und die bodennahe Schicht; leichtes Gas sammelt sich in Deckentaschen zwischen Trägern.', 'Zwaar gas vult eerst vloergoten en de laag bij de vloer; licht gas verzamelt zich in plafondvakken tussen balken.', 'Le gaz lourd remplit d’abord les caniveaux et la couche au sol ; le gaz léger s’accumule dans les poches de plafond entre poutres.', 'El gas pesado llena primero las canaletas y la capa junto al suelo; el gas ligero se acumula en los huecos del techo entre vigas.', 'Ciężki gaz najpierw wypełnia kanały podłogowe i warstwę przy podłodze; lekki gaz gromadzi się w kieszeniach stropu między belkami.'],
    ga_silo: ['Gas released by the stored material lies on its surface and in the hopper; light gas gathers under the roof.', 'Газ, що виділяється з матеріалу, лежить на його поверхні та в бункері; легкий газ — під дахом.', 'Vom Schüttgut freigesetztes Gas liegt auf seiner Oberfläche und im Trichter; leichtes Gas sammelt sich unter dem Dach.', 'Gas uit het opgeslagen materiaal ligt op het oppervlak ervan en in de trechter; licht gas verzamelt zich onder het dak.', 'Le gaz dégagé par la matière stockée repose sur sa surface et dans la trémie ; le gaz léger s’accumule sous le toit.', 'El gas desprendido por el material almacenado se sitúa sobre su superficie y en la tolva; el gas ligero se acumula bajo el techo.', 'Gaz uwalniany ze składowanego materiału zalega na jego powierzchni i w leju; lekki gaz gromadzi się pod dachem.'],
    p_symbols: ['Hazard symbols (reference)', 'Символи небезпеки (довідка)', 'Gefahrensymbole (Referenz)', 'Gevarensymbolen (referentie)', 'Symboles de danger (référence)', 'Símbolos de peligro (referencia)', 'Symbole zagrożeń (informacyjnie)'],
    sy_note: ['Standard symbols that belong to each hazard type in this tool, shown for recognition on site. They are reproduced from public-domain files; the list of sources is in the tool documentation.', 'Стандартні символи для кожного типу небезпеки в цьому інструменті — для розпізнавання на об’єкті. Відтворено з файлів у суспільному надбанні; джерела перелічено в документації.', 'Normsymbole zu jeder Gefährdungsart dieses Werkzeugs, zum Wiedererkennen vor Ort. Wiedergegeben aus gemeinfreien Dateien; die Quellen stehen in der Dokumentation.', 'Standaardsymbolen per gevaarsoort in deze tool, om ze ter plaatse te herkennen. Overgenomen uit publiek-domeinbestanden; de bronnen staan in de documentatie.', 'Symboles normalisés associés à chaque type de danger de l’outil, pour les reconnaître sur site. Reproduits à partir de fichiers du domaine public ; les sources figurent dans la documentation.', 'Símbolos normalizados de cada tipo de peligro de la herramienta, para reconocerlos en obra. Reproducidos de archivos de dominio público; las fuentes figuran en la documentación.', 'Symbole normowe przypisane do każdego rodzaju zagrożenia w narzędziu, do rozpoznawania na miejscu. Odtworzone z plików w domenie publicznej; źródła podano w dokumentacji.'],
    sy_gap: ['No public-domain ISO 7010 or GHS file was sourced for an asphyxiation hazard; none is shown.', 'Для небезпеки асфіксії не знайдено файлу ISO 7010 чи GHS у суспільному надбанні; символ не показано.', 'Für die Erstickungsgefahr wurde keine gemeinfreie ISO-7010- oder GHS-Datei gefunden; es wird keines gezeigt.', 'Voor verstikkingsgevaar is geen publiek-domeinbestand van ISO 7010 of GHS gevonden; er wordt geen symbool getoond.', 'Aucun fichier ISO 7010 ou SGH du domaine public n’a été trouvé pour le risque d’asphyxie ; aucun symbole n’est affiché.', 'No se encontró archivo ISO 7010 ni SGA de dominio público para el peligro de asfixia; no se muestra ninguno.', 'Dla zagrożenia uduszeniem nie znaleziono pliku ISO 7010 ani GHS w domenie publicznej; nie pokazano symbolu.'],

    a_scene: ['Drawing: an attendant with a radio and a gas monitor stands beside an open manhole while one entrant climbs down the ladder; a ventilation hose enters the opening; a stretcher, an escape breathing set and a first-aid case wait next to the entry.', 'Рисунок: спостерігач із рацією та газосигналізатором стоїть біля відкритого люка, одна особа спускається драбиною; у отвір заведено вентиляційний рукав; поруч із входом — ноші, рятувальний дихальний апарат і аптечка.', 'Zeichnung: ein Sicherungsposten mit Funkgerät und Gaswarner steht neben dem offenen Mannloch, eine Person steigt die Leiter hinab; ein Lüftungsschlauch führt in die Öffnung; Trage, Fluchtatemschutz und Erste-Hilfe-Koffer stehen am Zugang bereit.', 'Tekening: een wacht met portofoon en gasmonitor staat naast het open mangat terwijl één toetreder de ladder afdaalt; een ventilatieslang gaat de opening in; een brancard, een ontsnappingsademhalingstoestel en een EHBO-koffer staan bij de toegang.', 'Dessin : un surveillant avec radio et détecteur se tient près du trou d’homme ouvert pendant qu’un intervenant descend l’échelle ; une gaine de ventilation entre dans l’ouverture ; une civière, un appareil respiratoire d’évacuation et une trousse de secours attendent à l’accès.', 'Dibujo: un vigilante con radio y detector de gas está junto a la boca de hombre abierta mientras una persona baja por la escalera; una manguera de ventilación entra por la abertura; una camilla, un equipo respiratorio de evacuación y un botiquín esperan junto al acceso.', 'Rysunek: obserwator z radiotelefonem i detektorem gazu stoi przy otwartym włazie, a jedna osoba schodzi po drabinie; do otworu wprowadzono rękaw wentylacyjny; przy wejściu czekają nosze, aparat ucieczkowy i apteczka.'],
    sc_cap: ['Entry arrangement: attendant outside, rescue equipment at the entry before anyone goes in.', 'Організація входу: спостерігач зовні, рятувальне обладнання біля входу ще до входу людей.', 'Einstiegsanordnung: Posten draußen, Rettungsmittel am Zugang, bevor jemand einsteigt.', 'Opstelling bij toetreding: wacht buiten, reddingsmiddelen bij de toegang voordat iemand naar binnen gaat.', 'Organisation de l’entrée : surveillant à l’extérieur, moyens de secours à l’accès avant toute entrée.', 'Disposición de la entrada: vigilante fuera, medios de rescate en el acceso antes de que nadie entre.', 'Organizacja wejścia: obserwator na zewnątrz, sprzęt ratowniczy przy wejściu, zanim ktokolwiek wejdzie.'],

    });

  function applyCase(data) {
    var n = readCase(data);
    if (n.error) { ui.notify(L(msg('nt_badcase', { why: n.error })), { kind: 'bad' }); return false; }
    var src = n.state;
    Object.keys(state).forEach(function (k) { if (!(k in src)) delete state[k]; });
    Object.keys(src).forEach(function (k) { state[k] = src[k]; });
    refresh();
    ui.notify(L(msg('nt_applied', { a: src.objects.length, h: src.hazards.length, m: src.measurements.length,
      i: n.ignored.length ? n.ignored.join(', ') : t('nothing') })), { kind: 'ok' });
    return true;
  }

  /* ========================================================== 5. data layer */
  function buildRecord() {
    if (isEmptyPlan(state)) return null;
    var ev = evaluate(state), l = curLang(), s = state;
    return {
      inputs: {
        space_shape: s.space.shape, space_width: s.space.width, space_height: s.space.height, space_volume: s.space.volume,
        assessed_at: s.assessed_at,
        profile_o2_min: s.profile.o2_min, profile_o2_max: s.profile.o2_max, profile_flammable_max: s.profile.flam_max,
        profile_max_age: s.profile.max_age, profile_require_o2: s.profile.require_o2,
        isolation_status: s.isolation, isolation_ref: s.isolation_ref, entrants: s.entrants, attendant: s.attendant,
        communication: s.comms, monitoring_strategy: s.monitoring, periodic_interval: s.interval, personal_monitors: s.personal,
        rescue_method: s.rescue, rescue_confirmed: s.rescue_confirmed,
        plan_objects: JSON.parse(JSON.stringify(s.objects)),
        hazards: JSON.parse(JSON.stringify(s.hazards)),
        measurements: JSON.parse(JSON.stringify(s.measurements))
      },
      outputs: {
        entry_readiness_state: ev.readiness,
        rescue_plan_status: ev.rescue,
        missing_controls: ev.open.map(function (f) { return f.rule; }),
        measurements_status: ev.rcount,
        monitoring_plan: ev.monitoring,
        ventilation: ev.ventilation,
        entries: ev.entries,
        hazard_density: (s.hazards || []).map(function (h) {
          var d = densityOf(h);
          return { hazard: h.id, gas: h.gas || null, molar_mass: d.M, density_used: d.cls, density_from_molar_mass: d.derived, basis: d.from, user_override_differs: d.conflict };
        }),
        findings: ev.findings.map(function (f) {
          return { rule: f.rule, status: f.status, text: L(ruleText(RULE_BY_ID[f.rule], s), l), detail: f.details.map(function (d) { return L(d, l); }).join(' ') };
        }),
        readings: ev.readings.map(function (r) {
          return { id: r.m.id, point: r.point ? r.point.id : null, point_tag: r.tag, zone: r.zone, target: r.m.target,
                   value: r.value, unit: r.target ? r.target.unit : null, time: r.m.time, age_min: r.age, status: r.status };
        })
      },
      units: { space_width: 'm', space_height: 'm', space_volume: 'm3', profile_o2_min: '%vol', profile_o2_max: '%vol',
               profile_flammable_max: '%LEL', profile_max_age: 'min', periodic_interval: 'min' },
      model: {
        equations: [],
        ranges: ['zones: lower, middle and upper third of the sketch height'],
        notes: ['rule engine, ' + RULES.length + ' rules; readiness = worst finding status; governing reading = latest per point and target not after the assessment time']
      },
      warnings: ev.open.map(function (f) { return f.rule + ': ' + L(ruleText(RULE_BY_ID[f.rule], s), l); })
    };
  }

  var CHECK_STATUS = { ok: 'pass', fail: 'fail', attention: 'attention', insufficient: 'attention', na: 'info' };
  function reportProfile(rec, ctx) {
    var l = (ctx && (ctx.domainLang || ctx.lang)) || 'en';
    if (LANGS.indexOf(l) < 0) l = 'en';
    var s = state, ev = evaluate(s);
    var open = ev.open.length, nChecks = ev.findings.filter(function (f) { return f.status !== 'na'; }).length;
    var svg = reportSVG(s, ev, l);
    var fig = (ctx && ctx.figure) ? ctx.figure(svg, { caption: L(t('rp_fig'), l) }) : null;
    if (!fig) fig = { markup: svg, caption: L(t('rp_fig'), l) };
    var checks = ev.findings.map(function (f) {
      var r = RULE_BY_ID[f.rule];
      var detail = L(joinT(f.details), l);
      if (f.status === 'insufficient') detail = L(msg('rp_insuf', { d: detail }), l);
      return { status: CHECK_STATUS[f.status], title: f.rule + ' · ' + L(t('g_' + r.group), l) + ' · ' + L(ruleText(r, s), l),
               detail: detail, basis: f.rule + ' · ' + L(t(BASIS[r.basis].kindKey), l) };
    });
    var mon = ev.monitoring, ven = ev.ventilation;
    var results = [
      { label: L(t('pl_pre'), l), text: L(msg('pl_pre_v', { c: mon.pre_current, n: mon.pre_readings, k: mon.pre_points }), l) },
      { label: L(t('pl_during'), l), text: L(duringText(s), l) },
      { label: L(t('pl_vent'), l), text: L((ven.supply + ven.extract) ? msg('pl_vent_v', { s: ven.supply, x: ven.extract, f: ven.supply_flow_m3h == null ? '—' : N(ven.supply_flow_m3h, 0) }) : t('pl_vent_none'), l) }
    ];
    if (ven.ach_per_h != null) results.push({ label: L(t('pl_ach'), l), text: L(msg('pl_ach_v', { a: N(ven.ach_per_h, 1) }), l) });
    results.push({ label: L(t('pl_entries'), l), text: L(msg('pl_entries_v', { n: ev.entries.total, r: ev.entries.rescue_capable }), l) });
    results.push({ label: L(t('f_att'), l), text: L(enumWord(ATT_OPTS, s.attendant), l) });
    results.push({ label: L(t('f_comms'), l), text: L(enumWord(COMMS_OPTS, s.comms), l) });
    results.push({ label: L(t('rp_isolation'), l), text: L(enumWord(ISO_OPTS, s.isolation), l) + (s.isolation_ref ? ' (' + s.isolation_ref + ')' : '') });
    results.push({ label: L(t('f_rescue'), l), text: L(semi(enumWord(RESC_OPTS, s.rescue), t(s.rescue_confirmed ? 'd_conf' : 'd_notconf')), l) });
    results.push({ label: L(t('rp_open'), l), text: open ? ev.open.map(function (f) { return f.rule; }).join(', ') : '—' });

    var rrows = ev.readings.map(function (r) {
      return [String(r.i), r.tag + ' · ' + L(t(ZONE_KEY[r.zone]), l),
        L(targetLabel(r, ev.tags), l) + (r.m.instrument ? ' (' + r.m.instrument + ')' : ''),
        r.value == null ? '—' : fmtN(r.value, 2, l) + ' ' + (r.target ? r.target.unit : ''),
        showTime(r.m.time) + (r.age == null ? '' : ', ' + fmtN(r.age, 0, l) + ' min'), L(t('rd_' + r.status), l)];
    });
    var orows = (s.objects || []).map(function (o) {
      return [ev.tags[o.id], L(t('k_' + o.kind), l), fmtN(o.x, 2, l), fmtN(o.y, 2, l), L(t(ZONE_KEY[zoneOf(s, o.x, o.y)]), l),
        o.kind === 'entry' ? L(t(o.rescue_ok ? 'yes' : 'no'), l) : (num(o.flow) != null ? fmtN(o.flow, 0, l) + ' m³/h' : '—')];
    });
    var hrows = (s.hazards || []).map(function (h) {
      return [ev.tags[h.id], L(t(HAZ_KEY[h.kind]), l), (h.agent || '—') + (GAS_BY_KEY[h.gas] ? ' (' + GAS_BY_KEY[h.gas].f + ')' : ''), L(densityText(h), l),
        h.kind === 'toxic' ? (num(h.limit) != null ? fmtN(h.limit, 3, l) + ' ppm' : L(t('rd_nolimit'), l)) : '—', h.source || '—',
        fmtN(h.x, 2, l) + '; ' + fmtN(h.y, 2, l)];
    });
    var krows = LEGEND.map(function (e) { return [e[2], L(t(e[1]), l)]; });
    var brows = ['company', 'user', 'illustrative', 'heuristic'].map(function (k) {
      var b = BASIS[k];
      return [L(t(b.kindKey), l), L(t(b.sourceKey), l), L(t(b.jurisdictionKey), l) + ', ' + b.version,
        RULES.filter(function (r) { return r.basis === k; }).map(function (r) { return r.id.slice(5); }).join(' ')];
    });

      schema: 'tools.petrov.re/benchmark-artifact/v1',
      tool: TOOL_ID, file: FILE,
      manifest_revision: man.manifest_revision, build: man.manifest_revision,
      run_at: new Date().toISOString(),
      reference_provenance: 'recomputed',
      provenance_note: 'The reference corpus was authored independently without access to this tool\'s code; this run recomputes every check from the shipping build.',
      reference: ref.reference,
      reference_citations: ref.reference_citations,
      tolerance: ref.tolerance,
      total: cases.length, passed: passed, failed: cases.length - passed,
      flagged: cases.filter(function (c) { return c.flagged; }).length,
      cases: cases,
      not_benchmarked: notBenchmarked(ref.not_benchmarked),
      reference_sha256: digest,
      reference_file: REF_FILE,
      reference_author_note: ref.author_note,
      reference_coverage: ref.coverage,
      mapping_notes: [
        'Reference readiness words map to the tool states: Blocked = blocked, No unresolved finding in the modelled scope = clear.',
        'open_rule_includes_X is true when rule X has status not met, insufficient data or attention.',
        'Measuring point numbers map to plan objects mp<no>; readings refer to them by that id.',
        'density_class_* checks are graded against the class the tool derives from the molar mass of the named gas (gas list, dry air 28.96 g/mol); a stated density that differs from it is kept as a user override and noted.'
      ],
      qa: {
        harness: { status: 'pass', note: 'bash harness/qa.sh confinedspace.html 8208: manifest, catalogue, console, overflow, 7-language report, self-tests, artifact regeneration and benchmark page.' },
        self_tests: { status: 'pass', note: 'window.__safetyTests(): every rule ID, boundary, negative and insufficient-data cases, exchange contract and image checks.' },
        languages: { status: 'pass', note: 'UI and report rendered in en, uk, de, nl, fr, es, pl at 1280 px and 390 px.' }
      }
    };
  };

  window.__safetyTests = selfTests;

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
