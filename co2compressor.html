  "summary": {"en":"Screening calculator for a multi-stage CO₂ compression, dehydration and pumping or liquefaction train for CCUS, giving stage count, power, specific energy, cooling duty and cost per tonne.","uk":"Скринінговий калькулятор багатоступеневої лінії компримування, осушення та перекачування або зрідження CO₂ для CCUS, що визначає кількість ступенів, потужність, питому енергію, холодильне навантаження та вартість за тонну.","de":"Screening-Rechner für eine mehrstufige CO₂-Verdichtungs-, Trocknungs- und Pump- bzw. Verflüssigungsstrecke für CCUS mit Stufenzahl, Leistung, spezifischer Energie, Kühlleistung und Kosten pro Tonne.","nl":"Screeningcalculator voor een meertraps CO₂-compressie-, droog- en pomp- of vloeibaarmakingstrein voor CCUS, met aantal trappen, vermogen, specifieke energie, koelvermogen en kosten per ton.","fr":"Calculateur de présélection pour une chaîne CCUS de compression multi-étagée, de déshydratation et de pompage ou liquéfaction du CO₂, donnant le nombre d'étages, la puissance, l'énergie spécifique, la charge de refroidissement et le coût par tonne.","es":"Calculadora de cribado para un tren CCUS de compresión multietapa, deshidratación y bombeo o licuefacción de CO₂, que estima número de etapas, potencia, energía específica, carga de refrigeración y coste por tonelada.","pl":"Kalkulator wstępnej oceny wielostopniowego ciągu sprężania, osuszania oraz pompowania lub skraplania CO₂ dla CCUS, podający liczbę stopni, moc, energię jednostkową, obciążenie chłodzenia i koszt na tonę."},
  "description": {"en":"Models integrally-geared, inline or reciprocating multi-stage compression with intercooling using the Span–Wagner real-gas equation of state, followed by water knock-out and TEG or molecular-sieve dehydration, with an optional dense-phase pump above about 80 bar or liquefaction for medium-pressure (15 bar) or low-pressure (7 bar) ship transport. Results include stage count, shaft power, specific energy in kWh/t, intercooler duty, recoverable heat, CAPEX and levelised cost in EUR/t.","uk":"Моделює багатоступеневе компримування інтегрально-редукторними, лінійними або поршневими компресорами з проміжним охолодженням за реально-газовим рівнянням стану Спана–Вагнера, з подальшим відділенням води та осушенням ТЕГ або молекулярними ситами, з опційним насосом щільної фази понад приблизно 80 бар або зрідженням для суднового транспортування за середнього (15 бар) чи низького (7 бар) тиску. Результати включають кількість ступенів, потужність на валу, питому енергію в кВт·год/т, навантаження проміжних охолоджувачів, рекуперовану теплоту, CAPEX та приведену вартість у EUR/т.","de":"Modelliert mehrstufige Verdichtung mit Getriebe-, Inline- oder Kolbenverdichtern und Zwischenkühlung auf Basis der Realgas-Zustandsgleichung nach Span–Wagner, gefolgt von Wasserabscheidung und TEG- oder Molekularsieb-Trocknung, mit optionaler Dichtphasenpumpe oberhalb von etwa 80 bar oder Verflüssigung für den Schiffstransport bei Mitteldruck (15 bar) oder Niederdruck (7 bar). Die Ergebnisse umfassen Stufenzahl, Wellenleistung, spezifische Energie in kWh/t, Zwischenkühlerleistung, rückgewinnbare Wärme, CAPEX und Gestehungskosten in EUR/t.","nl":"Modelleert meertrapscompressie met integraal-getande, inline- of zuigercompressoren met tussenkoeling op basis van de reëel-gastoestandsvergelijking van Span–Wagner, gevolgd door waterafscheiding en TEG- of moleculaire-zeefdroging, met een optionele dichte-fasepomp boven circa 80 bar of vloeibaarmaking voor scheepstransport op middendruk (15 bar) of lage druk (7 bar). Resultaten omvatten aantal trappen, asvermogen, specifieke energie in kWh/t, tussenkoelerbelasting, terugwinbare warmte, CAPEX en genivelleerde kosten in EUR/t.","fr":"Modélise une compression multi-étagée par compresseurs à engrenages intégrés, en ligne ou alternatifs avec refroidissement intermédiaire, à l'aide de l'équation d'état de gaz réel de Span–Wagner, suivie d'une séparation de l'eau et d'une déshydratation au TEG ou par tamis moléculaire, avec pompe en phase dense optionnelle au-delà d'environ 80 bar ou liquéfaction pour le transport maritime en moyenne pression (15 bar) ou basse pression (7 bar). Les résultats comprennent le nombre d'étages, la puissance à l'arbre, l'énergie spécifique en kWh/t, la charge des refroidisseurs intermédiaires, la chaleur récupérable, le CAPEX et le coût actualisé en EUR/t.","es":"Modela la compresión multietapa con compresores de engranajes integrados, en línea o alternativos con refrigeración intermedia mediante la ecuación de estado de gas real de Span–Wagner, seguida de separación de agua y deshidratación con TEG o tamiz molecular, con bomba opcional en fase densa por encima de unos 80 bar o licuefacción para transporte marítimo a media presión (15 bar) o baja presión (7 bar). Los resultados incluyen número de etapas, potencia en el eje, energía específica en kWh/t, carga de los refrigeradores intermedios, calor recuperable, CAPEX y coste nivelado en EUR/t.","pl":"Modeluje wielostopniowe sprężanie sprężarkami zintegrowanymi z przekładnią, rzędowymi lub tłokowymi z chłodzeniem międzystopniowym na podstawie równania stanu gazu rzeczywistego Spana–Wagnera, a następnie oddzielanie wody i osuszanie TEG lub sitami molekularnymi, z opcjonalną pompą fazy gęstej powyżej ok. 80 bar lub skraplaniem do transportu statkami przy średnim (15 bar) lub niskim (7 bar) ciśnieniu. Wyniki obejmują liczbę stopni, moc na wale, energię jednostkową w kWh/t, obciążenie chłodnic międzystopniowych, ciepło możliwe do odzysku, CAPEX oraz uśredniony koszt w EUR/t."},

  "limitations": {"en":"Screening-level estimates only, not for design or procurement. Thermodynamics use the pure-CO₂ Span–Wagner EOS with water content from a saturation correlation; impurities (N₂, O₂, Ar, H₂, SOx/NOx) are ignored and cost factors carry about ±40% uncertainty. Surge, choke, rotordynamics and mechanical design are not assessed.","uk":"Лише скринінгові оцінки, не для проєктування чи закупівель. Термодинаміка базується на рівнянні стану Спана–Вагнера для чистого CO₂, вміст води визначається за кореляцією насичення; домішки (N₂, O₂, Ar, H₂, SOx/NOx) не враховуються, а вартісні коефіцієнти мають невизначеність близько ±40%. Помпаж, запирання, динаміка роторів і механічне проєктування не оцінюються.","de":"Nur Screening-Abschätzungen, nicht für Auslegung oder Beschaffung. Die Thermodynamik nutzt die Span–Wagner-Zustandsgleichung für reines CO₂ mit Wassergehalt aus einer Sättigungskorrelation; Verunreinigungen (N₂, O₂, Ar, H₂, SOx/NOx) werden vernachlässigt, und Kostenfaktoren haben eine Unsicherheit von etwa ±40 %. Pumpgrenze, Stopfgrenze, Rotordynamik und mechanische Auslegung werden nicht bewertet.","nl":"Uitsluitend screeningschattingen, niet voor ontwerp of inkoop. De thermodynamica gebruikt de Span–Wagner-toestandsvergelijking voor zuiver CO₂ met watergehalte uit een verzadigingscorrelatie; verontreinigingen (N₂, O₂, Ar, H₂, SOx/NOx) worden genegeerd en kostenfactoren hebben een onzekerheid van circa ±40%. Pompgrens, smoorgrens, rotordynamica en mechanisch ontwerp worden niet beoordeeld.","fr":"Estimations de présélection uniquement, non destinées à la conception ni aux achats. La thermodynamique repose sur l'équation d'état de Span–Wagner pour le CO₂ pur, la teneur en eau étant issue d'une corrélation de saturation ; les impuretés (N₂, O₂, Ar, H₂, SOx/NOx) sont ignorées et les facteurs de coût présentent une incertitude d'environ ±40 %. Le pompage, l'engorgement, la dynamique des rotors et la conception mécanique ne sont pas évalués.","es":"Solo estimaciones de cribado, no aptas para diseño ni compras. La termodinámica usa la ecuación de estado de Span–Wagner para CO₂ puro, con el contenido de agua obtenido de una correlación de saturación; se ignoran las impurezas (N₂, O₂, Ar, H₂, SOx/NOx) y los factores de coste tienen una incertidumbre de aproximadamente ±40 %. No se evalúan el bombeo (surge), el ahogo, la rotodinámica ni el diseño mecánico.","pl":"Wyłącznie szacunki na poziomie wstępnej oceny, nie do projektowania ani zakupów. Termodynamika opiera się na równaniu stanu Spana–Wagnera dla czystego CO₂, a zawartość wody wynika z korelacji nasycenia; zanieczyszczenia (N₂, O₂, Ar, H₂, SOx/NOx) są pomijane, a współczynniki kosztowe obarczone są niepewnością ok. ±40%. Pompaż, dławienie, dynamika wirników i projekt mechaniczny nie są oceniane."},

in 0.5 K and polytropic and isentropic work within 0.5 % relative; train cases: exact stage count, electric power and kWh/t within 0.5 % relative, pump kWh/t within 0.05 absolute, and outlet temperature within 0.5 K.", "run_at": "2026-10-19T18:15:10Z", "artifact": "benchmarks/co2compressor.json"}]},

<script>
(function () {
  'use strict';

  /* ============================================================ 1. the model
     ccus-compress.js (window.CCUS.compress) on ccus-core.js; this page only wraps it. */
  function mod() { return (window.CCUS || {}).compress || null; }
  var DEFAULTS = null, state = null, last = null;
  function initState() {
    var m = mod(), d = { level: 'simple' }, k;
    if (m && m.defaults) for (k in m.defaults) if (m.defaults.hasOwnProperty(k)) d[k] = m.defaults[k];
    DEFAULTS = d;
    state = JSON.parse(JSON.stringify(d));
  }
  function solveState(s) {
    var m = mod();
    if (!m) { last = { ok: false, error: 'ccus-compress.js did not load' }; return last; }
    try { last = m.solve(s); } catch (e) { last = { ok: false, error: String(e && e.message || e) }; }
    return last;
  }

  /* ======================================================== 2. the interface */
  function T(en, uk, de, nl, fr, es, pl) { return { en: en, uk: uk, de: de, nl: nl, fr: fr, es: es, pl: pl }; }

  var stage = null;
  function adoptStage(app) { stage = app.stages[0] || null; }
  var ui = null;

  function PANELS(){
      var full=function(c){return c.state.level==='full';};
      var pipe=function(c){return c.state.dest==='pipeline';};
      var pump=function(c){return pipe(c)&&!!c.state.pumpOn;};
      return [
        { id:'mode', slot:'inputs', title:T('Detail level','Рівень деталізації','Detailgrad','Detailniveau','Niveau de détail','Nivel de detalle','Poziom szczegółów'), fields:[
          { id:'f-level', key:'level', type:'segmented', label:T('Level','Рівень','Stufe','Niveau','Niveau','Nivel','Poziom'), options:[
            {value:'simple',label:T('Simple','Простий','Einfach','Eenvoudig','Simple','Simple','Prosty')},
            {value:'full',label:T('Full','Повний','Vollständig','Volledig','Complet','Completo','Pełny')}]}
        ]},
        { id:'process', slot:'inputs', title:T('Process','Процес','Prozess','Proces','Procédé','Proceso','Proces'), collapsible:true, collapsed:false, fields:[
          { id:'f-mdot', key:'mdot', type:'number', unit:'kg/s', display:'t/h', min:0.1, max:1000, step:0.1, precision:1, learn:'flow',
            label:T('Mass flow','Масова витрата','Massenstrom','Massadebiet','Débit massique','Caudal másico','Przepływ masowy') },
          { id:'f-pin', key:'pin', type:'number', unit:'Pa', display:'bar', min:0.9e5, max:20e5, step:1e4, precision:2,
            label:T('Inlet pressure','Тиск на вході','Eintrittsdruck','Inlaatdruk','Pression entrée','Presión entrada','Ciśnienie wlotowe') },
          { id:'f-Tin', key:'Tin', type:'number', unit:'K', display:'degC', min:283.15, max:333.15, step:0.5, precision:1,
            label:T('Inlet temp.','Темп. на вході','Eintrittstemp.','Inlaattemp.','Temp. entrée','Temp. entrada','Temp. wlotowa') },
          { id:'f-dest', key:'dest', type:'select', learn:'ship',
            label:T('Destination','Призначення','Ziel','Bestemming','Destination','Destino','Cel'), options:[
            {value:'pipeline',label:T('Pipeline','Трубопровід','Pipeline','Pijpleiding','Pipeline','Gasoducto','Rurociąg')},
            {value:'shipMP',label:T('Ship MP','Судно СТ','Schiff MD','Schip MD','Navire MP','Buque MP','Statek ŚC')},
            {value:'shipLP',label:T('Ship LP','Судно НТ','Schiff ND','Schip LD','Navire BP','Buque BP','Statek NC')}]},
          { id:'f-pout', key:'pout', type:'number', unit:'Pa', display:'bar', min:5e5, max:250e5, step:1e5, precision:1, learn:'pressure', visible:pipe,
            label:T('Outlet pressure','Тиск на виході','Austrittsdruck','Uitlaatdruk','Pression sortie','Presión salida','Ciśnienie wylotowe') }
        ]},
        { id:'train', slot:'inputs', title:T('Compression train','Компресорна лінія','Verdichterstrang','Compressietrein','Train de compression','Tren de compresión','Ciąg sprężania'), collapsible:true, collapsed:false, fields:[
          { id:'f-machine', key:'machine', type:'select', learn:'machines',
            label:T('Machine','Машина','Maschine','Machine','Machine','Máquina','Maszyna'), options:[
            {value:'IG',label:T('Integrally geared','Мультивальний','Getriebeverdichter','Geïntegreerd tandwiel','Multi-arbres','Engranaje integral','Zintegr. przekładnia')},
            {value:'INL',label:T('Inline centrifugal','Відцентровий','Radial inline','Centrifugaal inline','Centrifuge en ligne','Centrífugo en línea','Odśrodkowa inline')},
            {value:'REC',label:T('Reciprocating','Поршневий','Kolben','Zuiger','Alternatif','Alternativo','Tłokowa')}]},
          { id:'f-Tic', key:'Tic', type:'number', unit:'K', display:'degC', min:293.15, max:333.15, step:0.5, precision:1, learn:'intercooling',
            label:T('Intercooler outlet T','T після охолодж.','T nach Zwischenkühler','T na tussenkoeler','T sortie refroid.','T salida enfriador','T za chłodnicą') },
          { id:'f-pumpOn', key:'pumpOn', type:'toggle', learn:'pump', visible:pipe,
            label:T('Dense-phase pump','Насос щільної фази','Dichtphasenpumpe','Dichtefasepomp','Pompe phase dense','Bomba fase densa','Pompa fazy gęstej') },
          { id:'f-pSwitch', key:'pSwitch', type:'number', unit:'Pa', display:'bar', min:60e5, max:120e5, step:1e5, precision:1,
            visible:function(c){return full(c)&&pump(c);},
            label:T('Pump switch pressure','Тиск переходу','Umschaltdruck','Schakeldruk pomp','Pression bascule','Presión cambio','Ciśn. przełączenia') },
          { id:'f-Tpump', key:'Tpump', type:'number', unit:'K', display:'degC', min:283.15, max:313.15, step:0.5, precision:1,
            visible:function(c){return full(c)&&pump(c);},
            label:T('Pump suction T','T всмокт. насоса','Pumpen-Saugtemp.','Pompzuigtemp.','T aspir. pompe','T aspir. bomba','T ssania pompy') },
          { id:'f-etaPump', key:'etaPump', type:'number', unit:'-', min:0.5, max:0.9, step:0.01, precision:2,
            visible:function(c){return full(c)&&pump(c);},
            label:T('Pump efficiency','ККД насоса','Pumpenwirkungsgrad','Pomprendement','Rendement pompe','Rendim. bomba','Sprawność pompy') },
          { id:'f-dehy', key:'dehy', type:'select', learn:'water',
            label:T('Dehydration','Осушення','Trocknung','Droging','Déshydratation','Deshidratación','Osuszanie'), options:[
            {value:'teg',label:T('TEG','TEG','TEG','TEG','TEG','TEG','TEG')},
            {value:'molsieve',label:T('Mol sieve','Мол. сито','Molsieb','Mol. zeef','Tamis mol.','Tamiz mol.','Sito mol.')},
            {value:'none',label:T('None','Немає','Keine','Geen','Aucune','Ninguna','Brak')}]},
          { id:'f-Tcw', key:'Tcw', type:'number', unit:'K', display:'degC', min:278.15, max:313.15, step:0.5, precision:1, visible:full,
            label:T('Cooling water T','T охол. води','Kühlwassertemp.','Koelwatertemp.','T eau refroid.','T agua refrig.','T wody chłodz.') },
          { id:'f-N', key:'N', type:'number', unit:'-', min:10, max:200, step:10, precision:0, visible:full,
            label:T('Integration steps','Кроки інтегр.','Integrationsschritte','Integratiestappen','Pas d\'intégration','Pasos integr.','Kroki całkowania') }
        ]},
        { id:'economics', slot:'inputs', title:T('Economics','Економіка','Wirtschaftlichkeit','Economie','Économie','Economía','Ekonomia'), collapsible:true, collapsed:true, fields:[
          { id:'f-elecPrice', key:'elecPrice', type:'number', unit:'EUR/MWh', min:0, max:400, step:1, precision:0, learn:'cost',
            label:T('Electricity price','Ціна електроенергії','Strompreis','Stroomprijs','Prix électricité','Precio electricidad','Cena energii el.') },
          { id:'f-heatPrice', key:'heatPrice', type:'number', unit:'EUR/MWh', min:0, max:200, step:1, precision:0,
            label:T('Heat price','Ціна тепла','Wärmepreis','Warmteprijs','Prix chaleur','Precio calor','Cena ciepła') },
          { id:'f-rate', key:'rate', type:'number', unit:'-', min:0, max:0.2, step:0.005, precision:3, visible:full,
            label:T('Discount rate','Ставка дисконту','Zinssatz','Discontovoet','Taux d\'actual.','Tasa descuento','Stopa dyskonta') },
          { id:'f-life', key:'life', type:'number', unit:'y', min:5, max:40, step:1, precision:0, visible:full,
            label:T('Lifetime','Термін служби','Lebensdauer','Levensduur','Durée de vie','Vida útil','Żywotność') },
          { id:'f-hours', key:'hours', type:'number', unit:'h/y', min:1000, max:8760, step:10, precision:0, visible:full,
            label:T('Operating hours','Години роботи','Betriebsstunden','Bedrijfsuren','Heures fonct.','Horas operación','Godziny pracy') }
        ]}
      ];
    }

  function COMPUTE(s){
      const r = solveState(s);
      if (stage) stage.schedule();
      const f = (v, n) => DiagramUI.fmt(v, {precision: n});
      if (!r || !r.ok) {
        const e = (r && r.error) || 'unknown error';
        return {verdict: {tone: 'bad', text: T('Cannot compute: ' + e, 'Неможливо розрахувати: ' + e, 'Berechnung nicht möglich: ' + e,
          'Kan niet berekenen: ' + e, 'Calcul impossible : ' + e, 'No se puede calcular: ' + e, 'Nie można obliczyć: ' + e)}, tiles: []};
      }
      const warns = r.warnings || [], n = r.nStages, e = f(r.kWh_t, 1), p = f(r.pOut / 1e5, 1);
      const verdict = {tone: warns.length ? 'warn' : 'ok', text: T(
        n + ' stages, ' + e + ' kWh/t to ' + p + ' bar',
        n + ' ступ., ' + e + ' кВт·год/т до ' + p + ' бар',
        n + ' Stufen, ' + e + ' kWh/t auf ' + p + ' bar',
        n + ' trappen, ' + e + ' kWh/t naar ' + p + ' bar',

              'Ship transport requires liquid CO₂: medium pressure ~15 bar/−28 °C or low pressure ~7 bar/−50 °C. Liquefaction adds refrigeration work, so kWh/t exceeds pipeline transport.',
              'Транспортування суднами потребує рідкого CO₂: середній тиск ~15 бар/−28 °C або низький тиск ~7 бар/−50 °C. Зрідження додає роботу холодильного циклу, тому кВт·год/т вищі, ніж для трубопроводу.',
              'Schiffstransport erfordert flüssiges CO₂: Mitteldruck ~15 bar/−28 °C oder Niederdruck ~7 bar/−50 °C. Die Verflüssigung erfordert zusätzliche Kältearbeit, daher liegt der kWh/t-Wert über dem einer Pipeline.',
              'Scheepstransport vereist vloeibaar CO₂: middendruk ~15 bar/−28 °C of lage druk ~7 bar/−50 °C. Vloeibaar maken vergt extra koelarbeid, dus kWh/t ligt hoger dan bij een pijpleiding.',
              'Le transport maritime exige du CO₂ liquide : moyenne pression ~15 bar/−28 °C ou basse pression ~7 bar/−50 °C. La liquéfaction ajoute un travail de réfrigération ; le kWh/t est donc supérieur à celui d\'un pipeline.',
              'El transporte marítimo requiere CO₂ líquido: media presión ~15 bar/−28 °C o baja presión ~7 bar/−50 °C. La licuefacción añade trabajo de refrigeración, por lo que los kWh/t superan los de una tubería.',
              'Transport statkami wymaga ciekłego CO₂: średnie ciśnienie ~15 bar/−28 °C lub niskie ~7 bar/−50 °C. Skraplanie wymaga dodatkowej pracy chłodniczej, więc kWh/t jest wyższe niż dla rurociągu.'
            )
          },
          cost: {
            title: T('Cost basis', 'Основа витрат', 'Kostenbasis', 'Kostenbasis', 'Base de coûts', 'Base de costes', 'Podstawa kosztów'),
            body: T(
              'Capital cost is annualised with a capital recovery factor (rate, life); adding electricity and cooling, minus recovered heat, gives EUR per tonne CO₂. Price base 2025, preliminary ±40 %.',
              'Капітальні витрати ануїтизуються за допомогою коефіцієнта повернення капіталу (ставка, строк); разом з електроенергією та охолодженням, за вирахуванням рекуперованого тепла, це дає EUR за тонну CO₂. Цінова база 2025, попередньо ±40 %.',
              'Die Investitionskosten werden mit einem Kapitalwiedergewinnungsfaktor (Zinssatz, Lebensdauer) annualisiert; zuzüglich Strom und Kühlung, abzüglich rückgewonnener Wärme, ergibt sich EUR pro Tonne CO₂. Preisbasis 2025, vorläufig ±40 %.',
              'De investeringskosten worden geannualiseerd met een kapitaalterugwinningsfactor (rente, levensduur); plus elektriciteit en koeling, min teruggewonnen warmte, geeft dit EUR per ton CO₂. Prijsbasis 2025, voorlopig ±40 %.',
              'Le coût d\'investissement est annualisé par un facteur de recouvrement du capital (taux, durée de vie) ; en ajoutant l\'électricité et le refroidissement, moins la chaleur récupérée, on obtient des EUR par tonne de CO₂. Base de prix 2025, préliminaire ±40 %.',
              'El coste de capital se anualiza con un factor de recuperación del capital (tasa, vida útil); sumando electricidad y refrigeración, menos el calor recuperado, se obtienen EUR por tonelada de CO₂. Base de precios 2025, preliminar ±40 %.',
              'Nakłady inwestycyjne są annualizowane współczynnikiem odzysku kapitału (stopa, okres eksploatacji); wraz z energią elektryczną i chłodzeniem, pomniejszone o odzyskane ciepło, dają EUR na tonę CO₂. Baza cenowa 2025, wstępnie ±40 %.'
            )
          },
          energy: {
            title: T('Specific energy', 'Питоме енергоспоживання', 'Spezifischer Energiebedarf', 'Specifiek energieverbruik', 'Énergie spécifique', 'Energía específica', 'Energia właściwa'),
            body: T(
              'Specific electricity use in kWh per tonne CO₂. Typically 85–120 kWh/t for 1.5→110 bar; higher for ship liquefaction. Includes motor and mechanical losses.',
              'Питоме споживання електроенергії в кВт·год на тонну CO₂. Зазвичай 85–120 кВт·год/т для 1,5→110 бар; більше для зрідження під судновий транспорт. Включає втрати двигуна та механічні втрати.',
              'Spezifischer Strombedarf in kWh pro Tonne CO₂. Typisch 85–120 kWh/t für 1,5→110 bar; höher bei Verflüssigung für Schiffstransport. Inklusive Motor- und mechanischer Verluste.',
              'Specifiek elektriciteitsverbruik in kWh per ton CO₂. Typisch 85–120 kWh/t voor 1,5→110 bar; hoger bij vloeibaar maken voor scheepstransport. Inclusief motor- en mechanische verliezen.',
              'Consommation électrique spécifique en kWh par tonne de CO₂. Typiquement 85–120 kWh/t pour 1,5→110 bar ; davantage pour la liquéfaction destinée au transport maritime. Pertes moteur et mécaniques incluses.',
              'Consumo eléctrico específico en kWh por tonelada de CO₂. Típicamente 85–120 kWh/t para 1,5→110 bar; mayor para licuefacción para transporte marítimo. Incluye pérdidas del motor y mecánicas.',
              'Jednostkowe zużycie energii elektrycznej w kWh na tonę CO₂. Typowo 85–120 kWh/t dla 1,5→110 bar; więcej przy skraplaniu do transportu statkami. Obejmuje straty silnika i mechaniczne.'
            )
          },
          heat: {
            title: T('Heat rejection & recovery', 'Відведення та утилізація тепла', 'Wärmeabfuhr und -rückgewinnung', 'Warmteafvoer en -terugwinning', 'Évacuation et récupération de chaleur', 'Disipación y recuperación de calor', 'Odprowadzanie i odzysk ciepła'),
            body: T(
              'Intercooler duty is rejected to cooling water. Heat above ~130 °C at stage outlets can be recovered, e.g. for the capture reboiler, and credited.',
              'Теплове навантаження проміжних охолоджувачів відводиться в охолоджувальну воду. Тепло понад ~130 °C на виходах ступенів можна утилізувати (напр., для ребойлера установки уловлювання) і зарахувати.',
              'Die Zwischenkühlerleistung wird an das Kühlwasser abgegeben. Wärme über ~130 °C an den Stufenaustritten kann zurückgewonnen (z. B. für den Reboiler der Abscheidung) und gutgeschrieben werden.',
              'De tussenkoelerbelasting wordt afgevoerd naar koelwater. Warmte boven ~130 °C aan de trapuitlaten kan worden teruggewonnen (bijv. voor de reboiler van de afvanginstallatie) en verrekend.',
              'La puissance des refroidisseurs intermédiaires est évacuée vers l\'eau de refroidissement. La chaleur au-delà de ~130 °C en sortie d\'étage peut être récupérée (p. ex. pour le rebouilleur du captage) et créditée.',
              'El calor de los interenfriadores se cede al agua de refrigeración. El calor por encima de ~130 °C a la salida de las etapas puede recuperarse (p. ej., para el rehervidor de captura) y acreditarse.',
              'Ciepło z chłodnic międzystopniowych jest odprowadzane do wody chłodzącej. Ciepło powyżej ~130 °C na wylotach stopni można odzyskać (np. dla reboilera instalacji wychwytu) i uwzględnić w bilansie.'
            )
          },
        stages: {
          title: T('Compression stages', 'Ступені стиснення', 'Verdichterstufen', 'Compressietrappen', 'Étages de compression', 'Etapas de compresión', 'Stopnie sprężania'),
          body: T(
            'Each stage compresses CO₂ at an equal pressure ratio using real-gas polytropic work; the intercooler then returns it to the set temperature, giving a sawtooth temperature–pressure chart.',
            'Кожен ступінь стискає CO₂ з однаковим ступенем підвищення тиску за політропною роботою реального газу; проміжний охолоджувач повертає його до заданої температури, тож графік температури від тиску має пилкоподібну форму.',
            'Jede Stufe verdichtet CO₂ mit gleichem Druckverhältnis bei polytroper Realgasarbeit; der Zwischenkühler bringt es danach auf die Solltemperatur zurück, sodass das Temperatur-Druck-Diagramm ein Sägezahnmuster zeigt.',
            'Elke trap comprimeert CO₂ met een gelijke drukverhouding volgens polytrope arbeid voor reëel gas; de tussenkoeler brengt het daarna terug naar de ingestelde temperatuur, wat een zaagtandpatroon geeft in de temperatuur-drukgrafiek.',
            'Chaque étage comprime le CO₂ à rapport de pression égal avec un travail polytropique en gaz réel ; le refroidisseur intermédiaire le ramène ensuite à la température de consigne, d\'où un graphique température-pression en dents de scie.',
            'Cada etapa comprime el CO₂ con igual relación de presión mediante trabajo politrópico de gas real; el interenfriador lo devuelve luego a la temperatura fijada, y el gráfico temperatura-presión muestra un diente de sierra.',
            'Każdy stopień spręża CO₂ przy jednakowym stosunku ciśnień z pracą politropową gazu rzeczywistego; chłodnica międzystopniowa przywraca następnie zadaną temperaturę, dlatego wykres temperatury w funkcji ciśnienia ma kształt zębów piły.'
          )
        }
      },
      tour: [
        { topic: 'flow', focus: '[data-dgu-field="f-mdot"]' },
        { topic: 'pressure', focus: '[data-dgu-field="f-pout"]' },
        { topic: 'energy', focus: '.dgu-r-results' },
        { topic: 'stages', focus: '.dgu-stage' },
        { topic: 'cost', focus: '.dgu-verdict' }
      ]
      },
      panels: PANELS(),
      on: {
        rebuild: adoptStage,
        compute: COMPUTE
      }
    });

    ui.panel({
      id: 'io',
      slot: 'inputs',
      actionsAlign: 'end',
      actions: [ui.resetAction()]
    });

    ui.examples(examplesList((mod() || {}).presets || {}));

    ui.stage({
      caption: T('Compression path: temperature vs pressure', 'Шлях стиснення: температура залежно від тиску', 'Verdichtungsverlauf: Temperatur über Druck', 'Compressietraject: temperatuur versus druk', 'Trajet de compression : température en fonction de la pression', 'Trayectoria de compresión: temperatura frente a presión', 'Ścieżka sprężania: temperatura w funkcji ciśnienia'),
      minHeight: 280,
      a11y: function () {
        if (!last || !last.ok || !last.stages || !last.stages.length) return '';
        var s = last.stages, mx = -Infinity, i;
        for (i = 0; i < s.length; i++) mx = Math.max(mx, s[i].Tout);
        return s.length + ' compression stages to ' + DiagramUI.fmt(last.pOut / 1e5, { precision: 3 }) + ' bar, highest discharge ' + DiagramUI.fmt(mx - 273.15, { precision: 3 }) + ' °C.';
      },
      render: function (size, st) {
        var ctx = st.canvas(), w = size.w, h = size.h;
        ctx.clearRect(0, 0, w, h);
        if (!last || !last.ok || !last.stages || !last.stages.length) return;
        var muted = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#888';
        var s = last.stages, n = s.length, L = 50, R = 12, TM = 12, B = 34, pw = w - L - R, ph = h - TM - B;
        var pLo = Infinity, pHi = -Infinity, tLo = Infinity, tHi = -Infinity, i, v, x, y, tk;
        function lg(p) { return Math.log(p) / Math.LN10; }
        function acc(p, t) { p /= 1e5; t -= 273.15; pLo = Math.min(pLo, p); pHi = Math.max(pHi, p); tLo = Math.min(tLo, t); tHi = Math.max(tHi, t); }
        for (i = 0; i < n; i++) { acc(s[i].pin, s[i].Tin); acc(s[i].pout, s[i].Tout); }
        acc(last.pOut, last.Tout);
        var lLo = lg(pLo), lHi = lg(pHi), dl = (lHi - lLo) * 0.04 || 0.1, dt = (tHi - tLo) * 0.06 || 1;
        lLo -= dl; lHi += dl; tLo -= dt; tHi += dt;
        function X(p) { return L + (lg(p / 1e5) - lLo) / (lHi - lLo) * pw; }
        function Y(t) { return TM + ph - (t - 273.15 - tLo) / (tHi - tLo) * ph; }
        function seg(p1, t1, p2, t2, col, lw, dash) {
          ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw; if (ctx.setLineDash) ctx.setLineDash(dash || []);
          ctx.beginPath(); ctx.moveTo(X(p1), Y(t1)); ctx.lineTo(X(p2), Y(t2)); ctx.stroke(); ctx.restore();
        }
        ctx.strokeStyle = muted; ctx.fillStyle = muted; ctx.lineWidth = 1; ctx.font = '11px sans-serif';
        ctx.beginPath(); ctx.moveTo(L, TM); ctx.lineTo(L, TM + ph); ctx.lineTo(L + pw, TM + ph); ctx.stroke();
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        tk = [1, 2, 5, 10, 20, 50, 100, 200];
        for (i = 0; i < tk.length; i++) {
          v = lg(tk[i]); if (v < lLo || v > lHi) continue;
          x = L + (v - lLo) / (lHi - lLo) * pw;
          ctx.beginPath(); ctx.moveTo(x, TM + ph); ctx.lineTo(x, TM + ph + 4); ctx.stroke();
          ctx.fillText(String(tk[i]), x, TM + ph + 6);
        }
        tk = DiagramUI.ticks(tLo, tHi, ph, size.density) || [];
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        for (i = 0; i < tk.length; i++) {
          if (tk[i] < tLo || tk[i] > tHi) continue;
          y = TM + ph - (tk[i] - tLo) / (tHi - tLo) * ph;
          ctx.beginPath(); ctx.moveTo(L - 4, y); ctx.lineTo(L, y); ctx.stroke();
          ctx.fillText(DiagramUI.fmt(tk[i], { precision: 0 }), L - 6, y);
        }
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText('p, bar', L + pw / 2, h - 2);
        ctx.save(); ctx.translate(12, TM + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textBaseline = 'middle'; ctx.fillText('T, °C', 0, 0); ctx.restore();
        for (i = 0; i < n; i++) {
          seg(s[i].pin, s[i].Tin, s[i].pout, s[i].Tout, DiagramUI.series(0), 2.5);
          seg(s[i].pout, s[i].Tout, s[i].pout, i < n - 1 ? s[i + 1].Tin : last.Tout, DiagramUI.series(1), 1.5, [5, 4]);
        }
        if (last.pOut > s[n - 1].pout * 1.01) seg(s[n - 1].pout, last.Tout, last.pOut, last.Tout, DiagramUI.series(2), 1.5);
      }
    });
    adoptStage(ui);

    ui.ready();
    window.__co2compressor = { ui: ui, state: state, solve: solveState, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function fin(v) { return typeof v === 'number' && isFinite(v); }
  var REC_UNITS = {
    mdot: 'kg/s', pin: 'Pa', Tin: 'K', pout: 'Pa', Tic: 'K', machine: '-', dest: '-', pumpOn: '-',
    pSwitch: 'Pa', Tpump: 'K', etaPump: '-', dehy: '-', Tcw: 'K', N: '-', elecPrice: 'EUR/MWh',
    heatPrice: 'EUR/MWh', rate: '-', life: 'y', hours: 'h/y', nStages: '-', pOut: 'Pa', Tout: 'K',
    P_el: 'W', P_shaft: 'W', Q_cool: 'W', Q_rec: 'W', water: 'kg/s', E_el: 'J/kg', kWh_t: 'kWh/t', perTonne: 'EUR/t'
  };
  var OUT_KEYS = ['nStages', 'pOut', 'Tout', 'P_el', 'P_shaft', 'Q_cool', 'Q_rec', 'water', 'E_el', 'kWh_t', 'perTonne'];
  function buildRecord() {
    if (!last) return null;
    var inputs = {}, outputs = null, units = {}, k, i;
    for (k in state) if (state.hasOwnProperty(k) && k !== 'level') inputs[k] = state[k];
    if (last.ok) {
      outputs = {};
      for (i = 0; i < OUT_KEYS.length; i++) outputs[OUT_KEYS[i]] = last[OUT_KEYS[i]];
    }
    for (k in REC_UNITS) if (REC_UNITS.hasOwnProperty(k)) units[k] = REC_UNITS[k];
    return {
      inputs: inputs, outputs: outputs, units: units,
      model: {
        equations: ['real-gas polytropic stage work on Span-Wagner CO2 EOS', 'equal stage pressure ratio, intercooling to Tic',
          'dense-phase pump above pSwitch', 'CRF annualisation'],
        ranges: ['pure CO2 with water, 1-200 bar'],
        notes: ['price base 2025 EUR, preliminary +/-40 %']
      },
      warnings: last.ok ? (last.warnings || []).slice() : [last.error]
    };
  }
  var HANDOFF = {
    provides: ['mdot', 'p', 'T', 'E', 'Q'],
    accepts: ['mdot', 'p', 'T'],
    build: function () {
      if (!(last && last.ok)) return null;
      var h = last.handoff;
      return {
        quantities: {
          mdot: { value: h.mdot, unit: 'kg/s' }, p: { value: h.p, unit: 'Pa' }, T: { value: h.T, unit: 'K' },
          E: { value: h.E, unit: 'J/kg' }, Q: { value: h.Q, unit: 'W' }
        },
        sets: (function (src) {
            var U = { mdot: 'kg/s', p: 'Pa', T: 'K', E: 'J/kg', Q: 'W', D: 'm', L: 'm', dp: 'Pa', x: '-', rho: 'kg/m3' };
            var out = {}, s, i, k, arr, el, ne;
            if (!src || typeof src !== 'object') return src;
            for (s in src) {
              if (!Object.prototype.hasOwnProperty.call(src, s)) continue;
              arr = src[s];
              if (Object.prototype.toString.call(arr) !== '[object Array]') { out[s] = arr; continue; }
              out[s] = [];
              for (i = 0; i < arr.length; i++) {
                el = arr[i];
                if (!el || typeof el !== 'object') { out[s].push(el); continue; }
                ne = {};
                for (k in el) {
                  if (!Object.prototype.hasOwnProperty.call(el, k)) continue;
                  ne[k] = (typeof el[k] === 'number' && Object.prototype.hasOwnProperty.call(U, k)) ? { value: el[k], unit: U[k] } : el[k];
                }
                out[s].push(ne);
              }
            }
            return out;
          })(h.sets)
      };
    },
    apply: function (payload) {
      var q = (payload && payload.quantities) || {};
      if (q.mdot && fin(q.mdot.value)) state.mdot = q.mdot.value;
      if (q.p && fin(q.p.value)) {
        if ((payload.sets && payload.sets.storage) || q.p.value > 20e5) state.pout = q.p.value;
        else state.pin = q.p.value;
      }
      if (q.T && fin(q.T.value)) state.Tin = q.T.value;
      solveState(state);
      if (ui) { ui.sync(); ui.run(); }
    }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'co2compressor',
        file: 'co2compressor.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); solveState(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
