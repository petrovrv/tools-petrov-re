  const SITE_LANGS = ['en','uk','de','nl','fr','es','pl'];

  function grp(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,','); }

  // ---- Physics constants: U-238 first (6.673 eV) s-wave capture resonance ----
  // Resolved-resonance parameters from the Reich-Moore analysis of H. Derrien, L.C. Leal,
  // N.M. Larson, A. Courcelle, ORNL/TM-2005/241 (2005), Table 8 — the U-238 resolved-resonance
  // evaluation adopted by ENDF/B-VII.0 and retained in ENDF/B-VIII.0.
  const E0      = 6.673;         // eV,  resonance energy
  const GN      = 1.476e-3;      // eV,  neutron width  Gamma_n
  const GG      = 23.00e-3;      // eV,  radiation width Gamma_gamma
  const GAMMA   = GN + GG;       // eV,  total width Gamma = 0.024476 eV
  const KB      = 8.617333262e-5;// eV/K, Boltzmann constant (CODATA 2018)
  const M_U238  = 238.0507884;   // u,   atomic mass of U-238 (AME2020)
  const M_N     = 1.00866491595; // u,   neutron rest mass
  const AR      = M_U238/M_N;    // -,   target/neutron mass ratio = 236.006
  const GJ      = 1.0;           // -,   statistical factor g=(2J+1)/(2(2I+1)); I=0, J=1/2 -> g=1
  // 4*pi*lambdabar^2 * E = 4*pi*hbar^2/(2 m_n) = 2.603897e6 eV*barn
  const FOURPIL2= 2.603897e6;
  // SLBW peak of the total resonance and of the radiative-capture channel at 0 K
  const SIGMA0  = FOURPIL2/E0*Math.pow((AR+1)/AR,2)*GJ*GN/GAMMA;   // barn
  const SIGPK   = SIGMA0*GG/GAMMA;                                 // barn, 0 K peak capture

  // Integration/report half-range about E0 and the padding needed so the Gaussian kernel is
  // never clipped by the end of the grid (8 sigma at the highest temperature = 0.97 eV).
  const HALFWIN = 1.0;                   // eV
  const PAD     = 1.10;                  // eV, >= 8 sigma at the highest temperature
  const dE      = 5e-4;                  // eV, uniform grid step (~49 points per 0 K FWHM)
  const NOUT    = Math.round(2*HALFWIN/dE)+1;   // output points, E0-1 .. E0+1
  const NPAD    = Math.round(PAD/dE);
  const NSRC    = NOUT + 2*NPAD;
  const Esrc = new Float64Array(NSRC);
  const L0   = new Float64Array(NSRC);   // Lorentzian line shape 1/(1+x^2) — the broadened quantity
  for (let j=0;j<NSRC;j++){
    const E = E0 - HALFWIN - PAD + j*dE;
    Esrc[j] = E;
    const x = 2*(E - E0)/GAMMA;
    L0[j] = 1/(1 + x*x);
  }
  const Egrid = Esrc.subarray(NPAD, NPAD+NOUT);
  const s0K   = new Float64Array(NOUT);  // 0 K capture cross-section on the output grid
  for (let i=0;i<NOUT;i++) s0K[i] = SIGPK*Math.sqrt(E0/Egrid[i])*L0[NPAD+i];

  // Plot window
  const WIN_LO = 6.3, WIN_HI = 7.0;

  // ---- Doppler broadening (free-gas / Gaussian kernel, SLBW psi function) ----
  // The quantity broadened by the thermal motion is v*sigma(v), i.e. sqrt(E)*sigma(E); for the
  // SLBW capture shape sqrt(E)*sigma = SIGPK*sqrt(E0)/(1+x^2) is a pure Lorentzian, so
  //   sigma(E,T) = SIGPK * sqrt(E0/E) * psi(xi,x),
  //   psi(xi,x)  = (1/(s*sqrt(2pi))) * INT 1/(1+x'^2) exp(-(E-E')^2/(2 s^2)) dE',  s = Delta_D/sqrt(2)
  // evaluated here as a direct numerical convolution on the uniform grid.
  function broaden(T){
    const DeltaD = Math.sqrt(4*E0*KB*T/AR);   // eV, Doppler width
    const sigmaE = DeltaD/Math.SQRT2;         // eV, Gaussian std in energy
    const half = Math.min(NPAD, Math.max(1, Math.ceil(8*sigmaE/dE)));
    const inv2s2 = 1/(2*sigmaE*sigmaE);
    const kern = new Float64Array(half+1);
    for (let k=0;k<=half;k++){ const d=k*dE; kern[k]=Math.exp(-d*d*inv2s2); }
    const norm = dE/(sigmaE*Math.sqrt(2*Math.PI));
    const out = new Float64Array(NOUT);
    for (let i=0;i<NOUT;i++){
      const c = NPAD+i;
      let acc = L0[c]*kern[0];
      for (let k=1;k<=half;k++) acc += (L0[c-k]+L0[c+k])*kern[k];
      out[i] = SIGPK*Math.sqrt(E0/Egrid[i])*acc*norm;
    }
    return {sig:out, DeltaD, sigmaE, xi:GAMMA/DeltaD};
  }

  // Derived metrics over the whole E0 +/- 1 eV grid
  function metrics(sig){
    // peak
    let peak=0, ipk=0;
    for (let i=0;i<NOUT;i++){ if (sig[i]>peak){peak=sig[i];ipk=i;} }
    // FWHM: find half-max crossings around peak
    const half = peak/2;
    let eL=Egrid[ipk], eR=Egrid[ipk];
    for (let i=ipk;i>0;i--){ if (sig[i]<half){ // interpolate between i and i+1
      const t=(half-sig[i])/(sig[i+1]-sig[i]); eL=Egrid[i]+t*dE; break; } }
    for (let i=ipk;i<NOUT-1;i++){ if (sig[i]<half){ const t=(half-sig[i])/(sig[i-1]-sig[i]); eR=Egrid[i]-t*dE; break; } }
    const fwhm = eR-eL;
    // resonance integral over E0 +/- 1 eV (trapezoid) — invariant under broadening
    let area=0;
    for (let i=0;i<NOUT-1;i++) area += 0.5*(sig[i]+sig[i+1])*dE;
    return {peak, fwhm, area, ipk, Epk:Egrid[ipk]};
  }

  /* ---------------------------------------------------------- the model
     solve() is the whole physics of the page: it takes the state and returns
     every quantity the screen, the record, the report and the export show.
     broaden() and metrics() above are unchanged, down to the summation order. */
  const TMIN = 300, TMAX = 3000, TSTEP = 10;   /* K — the modelled range and grid */
  const DEFAULTS = { T: 900 };
  const state = { T: DEFAULTS.T };
  let LAST = null, ui = null, stage = null, bareRender = null;

  function solve(T){
    const b = broaden(T);
    const m = metrics(b.sig);
    return { T:T, DeltaD:b.DeltaD, sigmaE:b.sigmaE, xi:b.xi, sig:b.sig, m:m };
  }

  /* ------------------------------------------------------------ helpers */
  function T6(en,uk,de,nl,fr,es,pl){ return {en:en,uk:uk,de:de,nl:nl,fr:fr,es:es,pl:pl||en}; }

  /* the same, with the tool's inline markup and entities resolved to text, so a
     string written once for the page body can also be a label or a topic body */

  /* ------------------------------------------------- the resonance parameters

  function paramsHTML(lang){

  /* ------------------------------------------------------------ the plot
     The same picture the page has always drawn — fixed 0 K y-scale so the drop
     is visible, the 6.3–7.0 eV window, the shaded broadened curve over the
     dashed 0 K reference. What changed is that it is sized by the stage instead
     of by a 920×480 constant, and that the tick and axis text is drawn at its
     real size instead of being scaled down with the drawing (UI spec §10). */
  const XT_FIXED = [6.3,6.4,6.5,6.6,6.7,6.8,6.9,7.0];
  const YT_FIXED = [0,5000,10000,15000,20000];

  function drawPlot(ctx,W,H,density,sigT,lang){
    const coarse = density==='coarse';
    const M = coarse ? {l:52,r:12,t:12,b:42} : {l:66,r:16,t:16,b:48};
    const pl=M.l, pr=W-M.r, pt=M.t, pb=H-M.b;
    ctx.clearRect(0,0,W,H);
    if(pr<=pl+16 || pb<=pt+16) return;

    const yMax = SIGPK*1.05, xMin=WIN_LO, xMax=WIN_HI;
    const X = e => pl + (e-xMin)/(xMax-xMin)*(pr-pl);
    const Y = s => pb - (s/yMax)*(pb-pt);

    const cLine=cssVar('--line','#e2e7ee'), cInk=cssVar('--ink','#12161d'),
          cMuted=cssVar('--muted','#5b6675'), cAcc=cssVar('--accent','#3763e6'),
          fSmall=cssVar('--fs-small','12px'), fLabel=cssVar('--fs-label','13px'),

          mono=cssVar('--font-mono','ui-monospace,Menlo,monospace');

    const yt = tickList(0,yMax,pb-pt,density,YT_FIXED);
    ctx.textAlign='right'; ctx.textBaseline='middle';
    yt.forEach(function(v){
      const y=Y(v);
      ctx.beginPath(); ctx.moveTo(pl,y); ctx.lineTo(pr,y); ctx.stroke();
      ctx.fillText((v/1000).toFixed(0)+'k', pl-8, y);
    });
    let xt = tickList(xMin,xMax,pr-pl,density,XT_FIXED);
    if(xt.length<3) xt = tickList(xMin,xMax,pr-pl,'fine',XT_FIXED);
    ctx.textAlign='center'; ctx.textBaseline='top';
    xt.forEach(function(v){
      const x=X(v);
      ctx.beginPath(); ctx.moveTo(x,pt); ctx.lineTo(x,pb); ctx.stroke();
      ctx.fillText(v.toFixed(1), x, pb+8);
    });

    /* axis frame */
    ctx.strokeStyle=cLine; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(pl,pt); ctx.lineTo(pl,pb); ctx.lineTo(pr,pb); ctx.stroke();

    /* axis labels */
    ctx.fillStyle=cInk; ctx.font='400 '+fLabel+'/1 '+fam;

    ctx.translate(coarse?11:14,(pt+pb)/2); ctx.rotate(-Math.PI/2);
    ctx.textBaseline='top';
    ctx.fillText(l.axisY, 0, 0);
    ctx.restore();

    if(!sigT) return;                  /* nothing computed yet: axes only */

    function trace(arr){
      ctx.beginPath(); let started=false;
      for (let i=0;i<NOUT;i++){
        const e=Egrid[i]; if (e<xMin||e>xMax) continue;
        const x=X(e), y=Y(arr[i]);
        if(!started){ctx.moveTo(x,y);started=true;} else ctx.lineTo(x,y);
      }
    }

    /* shaded fill under the broadened curve */
    ctx.beginPath(); let st=false;
    for (let i=0;i<NOUT;i++){ const e=Egrid[i]; if(e<xMin||e>xMax)continue;
      const x=X(e),y=Y(sigT[i]); if(!st){ctx.moveTo(x,pb);ctx.lineTo(x,y);st=true;} else ctx.lineTo(x,y); }
    ctx.lineTo(X(xMax),pb); ctx.closePath();
    ctx.fillStyle = hexA(cAcc,0.12); ctx.fill();

    /* 0 K reference (dashed) */
    ctx.setLineDash([5,4]); ctx.lineWidth=1.6; ctx.strokeStyle=cMuted;
    trace(s0K); ctx.stroke();
    ctx.setLineDash([]);

    /* broadened curve */
    ctx.lineWidth=2; ctx.strokeStyle=cAcc;
    trace(sigT); ctx.stroke();
  }

  function hexA(hex,a){
    hex=String(hex).trim();
    if(hex.charAt(0)!=='#') return hex;            /* not a hex token: use as is */
    hex=hex.replace('#','');
    if(hex.length===3) hex=hex.split('').map(function(c){return c+c;}).join('');
    const r=parseInt(hex.substr(0,2),16),g=parseInt(hex.substr(2,2),16),b=parseInt(hex.substr(4,2),16);
    return 'rgba('+r+','+g+','+b+','+a+')';
  }

inów wyżej od chłodziwa i to właśnie na temperaturę paliwa reaguje sprzężenie zwrotne Dopplera. Zakres obejmuje temperatury od 300 K (wyłączenie na zimno) do 3000 K (temperatura bliska temperaturze topnienia UO₂).")

        width: {

o de ξ = 1 la forma de la línea la fija la temperatura, no el núcleo.',"Δ_D = √(4 E₀ k T / A) to szerokość rozkładu Gaussa, który tworzy linię pod wpływem ruchu termicznego jąder paliwa: 54 meV przy 300 K, 171 meV przy 3000 K, rosnąca wraz z pierwiastkiem kwadratowym temperatury. Stosunek ξ = Γ/Δ_D porównuje go z naturalną szerokością Γ = 24,5 meV; poniżej ξ = 1 kształt linii jest ustalany przez temperaturę, a nie przez jądro.")

ustible exterior absorbe los neutrones antes de que alcancen el interior. Un pico más bajo y unas alas más altas permiten que más núcleos de U-238 vean el flujo resonante, de modo que la absorción efectiva crece con la temperatura.',"Wraz z poszerzaniem linii jej maksimum musi maleć, ponieważ całka rezonansowa pozostaje stała. Ma to znaczenie dla samoekranowania rezonansowego: w wąskim wysokim piku zewnętrzne warstwy paliwa pochłaniają neutrony, zanim dotrą one głębiej. Obniżenie maksimum i podniesienie skrzydeł linii sprawia, że większa część jąder U-238 uczestniczy w absorpcji rezonansowej, dlatego efektywna absorpcja rośnie z temperaturą.")

        area: {

ene el 99,23 % del área de Breit-Wigner en el dominio infinito; la pequeña deriva de los últimos dígitos es la integración numérica, no la física.',"Całka przekroju czynnego po energii nie zmienia się z temperaturą: poszerzenie jedynie przenosi przekrój czynny z maksimum do skrzydeł. Podana wartość jest całką w zakresie E₀ ± 1 eV i obejmuje 99,23% całki linii Breita–Wignera w nieskończonym zakresie; niewielkie różnice w ostatnich cyfrach wynikają z całkowania numerycznego, nie z fizyki.")

          body: T6('The lowest and strongest s-wave capture resonance of U-238, and the one that carries most of the Doppler effect in a thermal reactor. The parameters are the ENDF/B-VIII.0 resolved-resonance values of Derrien et al., ORNL/TM-2005/241, Table 8: Γ_n = 1.476 meV, Γ_γ = 23.00 meV, g = 1. Only this one resonance is modelled: no potential scattering, no interference term, no lattice binding.','Найнижчий і найсильніший s-хвильовий резонанс захоплення U-238, на який припадає більша частина доплерівського ефекту в тепловому реакторі. Параметри — значення роздільної резонансної області ENDF/B-VIII.0 за Derrien et al., ORNL/TM-2005/241, табл. 8: Γ_n = 1,476 меВ, Γ_γ = 23,00 меВ, g = 1. Модель охоплює лише цей резонанс: без потенціального розсіяння, інтерференції та зв’язку в ґратці.','Die niedrigste und stärkste s-Wellen-Einfangresonanz von U-238, die den größten Teil des Doppler-Effekts im thermischen Reaktor trägt. Die Parameter stammen aus der aufgelösten Resonanzregion von ENDF/B-VIII.0 nach Derrien et al., ORNL/TM-2005/241, Tabelle 8: Γ_n = 1,476 meV, Γ_γ = 23,00 meV, g = 1. Modelliert wird nur diese eine Resonanz: keine Potentialstreuung, kein Interferenzterm, keine Gitterbindung.','De laagste en sterkste s-golf vangstresonantie van U-238, die het grootste deel van het dopplereffect in een thermische reactor draagt. De parameters zijn de waarden uit het opgeloste resonantiegebied van ENDF/B-VIII.0 volgens Derrien et al., ORNL/TM-2005/241, tabel 8: Γ_n = 1,476 meV, Γ_γ = 23,00 meV, g = 1. Alleen deze ene resonantie wordt gemodelleerd: geen potentiaalverstrooiing, geen interferentieterm, geen roosterbinding.','La plus basse et la plus forte résonance de capture en onde s de l’U-238, qui porte l’essentiel de l’effet Doppler dans un réacteur thermique. Les paramètres sont ceux du domaine résolu d’ENDF/B-VIII.0 d’après Derrien et al., ORNL/TM-2005/241, tableau 8 : Γ_n = 1,476 meV, Γ_γ = 23,00 meV, g = 1. Seule cette résonance est modélisée : pas de diffusion potentielle, pas de terme d’interférence, pas de liaison au réseau.','La resonancia de captura en onda s más baja y más intensa del U-238, que aporta la mayor parte del efecto Doppler en un reactor térmico. Los parámetros son los de la región resuelta de ENDF/B-VIII.0 según Derrien et al., ORNL/TM-2005/241, tabla 8: Γ_n = 1,476 meV, Γ_γ = 23,00 meV, g = 1. Solo se modela esta resonancia: sin dispersión potencial, sin término de interferencia, sin ligadura de red.',"Najniższy i najsilniejszy rezonans wychwytu fali s dla U-238, który przenosi najwięcej efektu Dopplera w reaktorze termicznym. Parametry to wartości rezonansu z obszaru rezonansów rozdzielonych ENDF/B-VIII.0 według Derrien i in., ORNL/TM-2005/241, tabela 8: Γ_n = 1,476 meV, Γ_γ = 23,00 meV, g = 1. Modelowany jest tylko ten jeden rezonans: brak rozpraszania potencjalnego, brak członu interferencyjnego, brak efektów wiązania w sieci krystalicznej.")
        }

  /* ------------------------------------------------------------- results */
  function computeResults(s){
    const T = Number(s.T);
    if(!isFinite(T)) return null;
    LAST = solve(T);
    if(stage) stage.schedule();
    const lang = curLang(), m = LAST.m;
    return {
      verdict: { text: fill(pick(S.verdict,lang), { p:(100*m.peak/SIGPK).toFixed(1) }) },
      tiles: [
        { label:KP('stTemp'),    value:LAST.T, unit:'K', display:'K', precision:0,
          learn:'temperature', headline:false },
        { label:KP('stDoppler'), value:LAST.DeltaD*1000, unit:'meV', precision:2, learn:'width' },
        { label:KP('stPeak'),    value:m.peak, unit:'barn ↓', precision:0, learn:'peak' },
        { label:KP('st0K'),      value:SIGPK, unit:'barn', precision:0, learn:'peak', headline:false },
        { label:KP('stFwhm'),    value:m.fwhm*1000, unit:'meV', precision:2, learn:'fwhm' },
        { label:KP('stArea'),    value:m.area, unit:'barn·eV', precision:2,
          hint:pick(S.winHint,lang), learn:'area', headline:false },
        { label:S.xiLbl,         value:LAST.xi, precision:3, learn:'width', headline:false },
        { label:S.epkLbl,        value:m.Epk, unit:'eV', precision:3, learn:'resonance', headline:false }
      ],
      tables: [{
        title: S.tblTitle,
        head: [ pick(S.tblE,lang), pick(S.tbl0K,lang), LAST.T+' K (barn)' ],
        rows: SAMPLE_E.map(function(E){ const i=idxOf(E);
          return [E.toFixed(3), s0K[i], LAST.sig[i]]; })
      }]
    };
  }

  function a11yText(){
    if(!LAST) return '';
    return fill(pick(S.a11y,curLang()), {
      t: LAST.T, pk: Math.round(LAST.m.peak), ep: LAST.m.Epk.toFixed(3), p0: Math.round(SIGPK)
    });
  }

  /* ---------------------------------------------------------------- boot */
  function detectLang(){
    if (I18N[window.__diagramLang]) return window.__diagramLang;
    try{ const x=localStorage.getItem('diagram_lang'); if(I18N[x]) return x; }catch(e){}
    for (const n of (navigator.languages||[navigator.language||'en'])){
      const p=String(n).toLowerCase().split('-')[0];
      if (I18N[p]) return p;
    }
    return 'en';
  }

  /* the temperature echo the slider has always carried beside its value */
  function celsius(T){
    const v=Number(T);
    return isFinite(v) ? (v-273.15).toFixed(0)+' °C' : '';
  }

  function buildInputs(app){
    /* spec 8.3 / v3.1: reset() and example() mutate the one state object in
       place, so the local adopt() helper that used to re-point them is gone. */
    app.examples(EXAMPLES.map(function(ex){
      return { label:ex.label, note:ex.note, state:{ T:ex.T } };
    }));
    app.panel({
      slot:'inputs', id:'fuel', title:S.fuel, learn:'temperature',
      fields:[
        /* the framework writes native min/max/step and announces a clamp
           itself (spec 6.1), so this file no longer does either */
        { id:'f-T', key:'T', type:'number', unit:'K', display:'K',
          min:TMIN, max:TMAX, step:TSTEP, required:true,
          label:KP('tempLabel'), learn:'temperature',
          validate:function(v){ return (typeof v==='number' && isFinite(v)) ? true : S.badT; } },
        /* spec 6.2: a label declared as a function is re-read on every sync, so
           the "(627 °C)" echo that sat beside the slider on the pre-port page —
           and that the port had to move to a result tile because Field.build()
           rendered a hint once — is back on the control it belongs to. */
        { id:'f-T-r', key:'T', type:'range', unit:'K', display:'K', precision:0,
          min:TMIN, max:TMAX, step:TSTEP,
          label:function(ctx){
            const c=celsius(ctx && ctx.state ? ctx.state.T : state.T);
            return pick(S.sweep, (ctx&&ctx.lang)||curLang()) + (c ? ' — '+c : ''); } }
      ],
      /* the reset action in the inputs panel footer, per the placement law —
         it used to need a panel of its own with a hand-built actions row */
      actions:[ app.resetAction() ]
    });
  }

  /* the two curve descriptions, in the tool's own words. The colours are the
     same tokens drawPlot() strokes with, passed as var() so a swatch follows a
     theme change without waiting for a repaint. */
  function legendItems(lang){
    const l = I18N[lang] || I18N.en;
    return [ { label:plain(l.legBroad), color:'var(--accent)' },
             { label:plain(l.leg0K),    color:'var(--muted)', dash:true } ];
  }

  function buildStage(app){
    stage = app.stage({
      a11y: a11yText,
      render: function(size,st){
        drawPlot(st.canvas(), size.w, size.h, size.density, LAST?LAST.sig:null, app.lang);
      }
    });
    /* spec 7.3: the legend slot the port could not map — it was a tool-owned
       node with tool-owned CSS inside the stage — is a framework surface now. */
    stage.legend({ items: legendItems(app.lang) });
  }

  function buildFooter(host,app){
    const d=document.createElement('details');
    d.innerHTML='<summary>'+esc(pick(S.footSum,app.lang))+'</summary>'+
      '<p class="dop-note">'+paramsHTML(app.lang)+'</p>'+
      '<p class="dop-note">'+I18N[app.lang].note+'</p>';
    host.appendChild(d);
  }

  function boot(){
    LANG = detectLang();
    document.title = I18N[LANG].docTitle;
    if(!window.DiagramUI || DiagramUI.api!=='tools.petrov.re/ui/v1'){ bootBare(); dgcInit(); return; }

    ui = DiagramUI.app({
      id:'doppler', mount:'#app', layout:'calculator', compute:'live',
      lang: LANG, state: state, defaults: DEFAULTS, history:false,
      title: K('h1'), subtitle: KP('sub'),
      learn: learnData(),
      regions: {
        inputs: function(host,app){ buildInputs(app); },
        stage:  function(host,app){ buildStage(app); }
      },
      /* the footer option, not the footer region: only the option adds the
         .dgu-footer styling the placement law expects for model notes */
      footer: function(host,app){ buildFooter(host,app); },
      on: {
        compute: computeResults,
        lang: function(code){ LANG=code; document.title=I18N[code].docTitle; },
        /* spec 3.1: a rebuild does not hand the tool back its objects, so
           re-point the one reference this file keeps. The stage and its legend
           are declared in `regions` and are rebuilt with the shell. */
        rebuild: function(app){ ui = app; }
      }
    });
    /* the canvas colours come from the token layer, so it must be redrawn when
       the theme resolves differently — the page used to watch the media query */
    DiagramUI.theme.watch(function(){ if(stage) stage.schedule(); });
    ui.ready();
    dgcInit();
  }

  /* diagram-ui.js is missing (blocked, 404 or an old cache): the physics, the
     record, the permalink, the report and the exports all still work, so run
     them and say plainly which part is not there. */
  function bootBare(){
    const box=document.getElementById('app')||document.body;
    const l=I18N[LANG];
    box.innerHTML='';
    const h1=document.createElement('h1'); h1.textContent=l.h1; box.appendChild(h1);
    const sub=document.createElement('p'); sub.innerHTML=l.sub; box.appendChild(sub);
    const msg=document.createElement('p'); msg.textContent=pick(S.bare,LANG); box.appendChild(msg);
    const lab=document.createElement('label'); lab.htmlFor='temp';
    lab.textContent=plain(l.tempLabel)+' (K)'; box.appendChild(lab);
    const num=document.createElement('input');
    num.type='number'; num.id='temp'; num.min=TMIN; num.max=TMAX; num.step=TSTEP;
    box.appendChild(num);
    const cv=document.createElement('canvas'); cv.width=920; cv.height=480;
    cv.style.maxWidth='100%'; box.appendChild(cv);
    const dl=document.createElement('dl'); box.appendChild(dl);
    const note=document.createElement('p'); note.innerHTML=paramsHTML(LANG); box.appendChild(note);
    const phys=document.createElement('p'); phys.innerHTML=l.note; box.appendChild(phys);

    bareRender=function(){
      LAST=solve(state.T);
      num.value=String(state.T);
      const m=LAST.m;
      dl.innerHTML=[
        [plain(l.stTemp), LAST.T+' K'],
        [plain(l.stDoppler), (LAST.DeltaD*1000).toFixed(2)+' meV'],
        [plain(l.stPeak), grp(Math.round(m.peak))+' barn'],
        [plain(l.st0K), grp(Math.round(SIGPK))+' barn'],
        [plain(l.stFwhm), (m.fwhm*1000).toFixed(2)+' meV'],
        [plain(l.stArea), m.area.toFixed(2)+' barn·eV']
      ].map(function(r){ return '<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>'; }).join('');
      const ctx=cv.getContext('2d');
      ctx.setTransform(1,0,0,1,0,0);
      drawPlot(ctx,920,480,'fine',LAST.sig,LANG);
    };
    num.addEventListener('input',function(){
      const v=Number(num.value);
      if(isFinite(v)) { state.T=Math.min(TMAX,Math.max(TMIN,v)); bareRender(); }
    });
    /* the safe-area repair of UI spec 4.4 lives in the file that is missing, so
       the tool reserves the shared chrome's own space itself */
    const reserve=function(){
      const bar=document.getElementById('dgc-bar'), badge=document.getElementById('eng-disc-badge');
      const hb=bar?bar.getBoundingClientRect().height:0, hg=badge?badge.getBoundingClientRect().height:0;
      const h=Math.max(hb,hg);
      document.body.style.paddingBottom = h ? (Math.round(h)+24)+'px' : '';
    };
    setTimeout(reserve,300); setTimeout(reserve,1500);
    window.addEventListener('resize',reserve);
    bareRender();
  }

  /* =================== framework v2 (diagram-common.js) =================== */
  const SAMPLE_E = [5.700,6.000,6.300,6.500,6.600,6.673,6.750,6.900,7.200,7.600];
  const skey = E => 'sigma_gamma_at_'+E.toFixed(3)+'_eV';
  function idxOf(E){
    const i=Math.round((E-Egrid[0])/dE);
    return Math.max(0,Math.min(NOUT-1,i));
  }
  function dgcOutputs(){
    if(!LAST) return null;
    const o={
      Delta_D:LAST.DeltaD*1000,
      xi:LAST.xi,
      sigma_peak_T:LAST.m.peak,
      E_peak:LAST.m.Epk,
      fwhm:LAST.m.fwhm*1000,
      resonance_integral:LAST.m.area,
      sigma_0:SIGMA0,
      sigma_peak_0K:SIGPK
    };
    SAMPLE_E.forEach(E=>{o[skey(E)]=LAST.sig[idxOf(E)];});
    return o;
  }
  function dgcUnits(){
    const u={T_fuel:'K',Delta_D:'meV',xi:'-',sigma_peak_T:'barn',E_peak:'eV',fwhm:'meV',
             resonance_integral:'barn·eV',sigma_0:'barn',sigma_peak_0K:'barn'};
    SAMPLE_E.forEach(E=>{u[skey(E)]='barn';});
    return u;
  }
  /* the permalink contract: the same three keys the tool has always written */
  function dgcSerialize(){ return {v:1,T:state.T,lang:curLang()}; }
  function applyState(){
    const a=A();
    if(a){ a.sync(); a.run(); }
    else if(bareRender) bareRender();
  }
  function dgcDeserialize(st){
    if(!st||typeof st!=='object')throw new Error('unrecognised state payload');
    const T=Number(st.T);
    if(!isFinite(T))throw new Error('missing or non-numeric fuel temperature T');
    if(T<TMIN||T>TMAX)
      throw new Error('fuel temperature '+T+' K outside the modelled range '+TMIN+'–'+TMAX+' K');
    state.T=T;
    const a=A();
    if(st.lang&&I18N[st.lang]&&a&&st.lang!==a.lang){
      a.setLang(st.lang);             /* rebuilds the shell and recomputes */
      return;
    }
    if(st.lang&&I18N[st.lang]){ LANG=st.lang; document.title=I18N[LANG].docTitle; }
    applyState();
  }
  function dgcRecord(){
    const out=dgcOutputs(); if(!out) return null;
    return {
      inputs:{T_fuel:LAST.T},
      outputs:out,
      units:dgcUnits(),
      model:{
        equations:[
          'sigma_0 = 4 pi lambdabar^2 g Gamma_n/Gamma = (2.603897e6 / E0[eV]) ((A+1)/A)^2 g Gamma_n/Gamma   [barn]',
          'Single-level Breit-Wigner capture, 0 K: sigma_gamma(E) = sigma_0 (Gamma_gamma/Gamma) sqrt(E0/E) / (1 + x^2),  x = 2(E - E0)/Gamma',
          'Doppler width (free gas): Delta_D = sqrt(4 E0 k T / A),  A = M(U-238)/m_n',
          'Broadened: sigma_gamma(E,T) = sigma_0 (Gamma_gamma/Gamma) sqrt(E0/E) psi(xi,x),  xi = Gamma/Delta_D',
          'psi(xi,x) = (xi/(2 sqrt(pi))) INT exp(-xi^2 (x-y)^2 / 4)/(1 + y^2) dy, evaluated here as the equivalent energy convolution with a Gaussian of standard deviation s = Delta_D/sqrt(2)',
          'Only sqrt(E) sigma(E) (i.e. v sigma) is broadened by the thermal motion; the 1/v factor sqrt(E0/E) multiplies the broadened line shape and is not inside the convolution',
          'Resonance integral INT sigma_gamma dE over all E = (pi/2) sigma_0 (Gamma_gamma/Gamma) Gamma = '+(SIGPK*GAMMA*Math.PI/2).toFixed(3)+' barn eV, invariant under Doppler broadening'
        ],
        ranges:[
          'Fuel temperature T = '+TMIN+' … '+TMAX+' K',
          'Energy grid E = E0 ± 1 eV, uniform step 0.5 meV, Gaussian kernel truncated at 8 sigma (kernel never clipped by the grid)',
          'Resonance parameters: E0 = 6.673 eV, Gamma_n = 1.476 meV, Gamma_gamma = 23.00 meV, g = 1 (ENDF/B-VIII.0 resolved-resonance region; Derrien et al., ORNL/TM-2005/241, Table 8)'
        ],
        notes:[
          'The chi function of the psi-chi formalism enters only the resonance-potential interference term of elastic scattering and is not needed for radiative capture.',
          'Free-gas (Gaussian) broadening assumes E >> kT and Delta_D << E0; chemical binding / crystal-lattice effects on the 6.67 eV resonance in UO2 are not modelled.',
          'The reported resonance integral is taken over E0 ± 1 eV, which contains 99.23 % of the infinite-range Breit-Wigner area.'
        ]
      },
      warnings:[]
    };
  }
  function dgcSections(){
    if(!LAST) return [];
    return [{
      title:'sigma_gamma(E)',
      cols:'1fr 1fr 1fr',
      head:['E (eV)','sigma_gamma(E, 0 K) (barn)','sigma_gamma(E, '+LAST.T+' K) (barn)'],
      rows:SAMPLE_E.map(E=>{const i=idxOf(E);
        return [E.toFixed(3), s0K[i].toFixed(3), LAST.sig[i].toFixed(3)];}),
      notes:['Values read from the same uniform 0.5 meV grid the plot uses.']
    }];
  }
  function dgcHandoff(){
    if(!LAST) return null;
    return {quantities:{T:{value:LAST.T,unit:'K'}}};
  }
  function dgcApply(payload){
    const q=(payload&&payload.quantities)||{};
    const ignored=Object.keys(q).filter(k=>k!=='T');
    if(!q.T||typeof q.T.value!=='number'||!isFinite(q.T.value))
      return {accepted:[],ignored:ignored.concat(q.T?['T']:[])};
    const T=Math.min(TMAX,Math.max(TMIN,q.T.value));
    if(T!==q.T.value && window.Diagram)
      window.Diagram.notify('Received T = '+q.T.value.toFixed(1)+' K, clamped to the modelled range '
        +TMIN+'–'+TMAX+' K','warn');
    state.T=Math.round(T/TSTEP)*TSTEP;
    applyState();
    return {accepted:['T'],ignored:ignored};
  }

  function dgcPythonCode(){
    return [
'# ---- resonance parameters (ENDF/B-VIII.0 RRR; Derrien et al., ORNL/TM-2005/241, Table 8) ----',
'E0        = '+E0,
'GAMMA_N   = '+GN,
'GAMMA_G   = '+GG,
'GAMMA     = GAMMA_N + GAMMA_G',
'KB        = '+KB+'          # eV/K',
'MASS_U238 = '+M_U238+'        # u',
'MASS_N    = '+M_N+'      # u',
'A_RATIO   = MASS_U238/MASS_N',
'G_STAT    = '+GJ,
'FOURPIL2  = '+FOURPIL2+'         # eV*barn = 4 pi hbar^2 / (2 m_n)',
'SIGMA_0   = FOURPIL2/E0*((A_RATIO+1.0)/A_RATIO)**2*G_STAT*GAMMA_N/GAMMA   # barn',
'SIGMA_PK  = SIGMA_0*GAMMA_G/GAMMA                                          # barn, 0 K peak capture',
'',
'HALFWIN = '+HALFWIN+'      # eV, half-range of the reported grid',
'PAD     = '+PAD+'     # eV, source padding so the 8-sigma kernel is never clipped',
'DE      = '+dE+'     # eV, grid step',
'NOUT    = '+NOUT,
'NPAD    = '+NPAD,
'NSRC    = NOUT + 2*NPAD',
'',
'# Source grid and the Lorentzian line shape on it, built exactly as the page builds them.',
'ESRC = [E0 - HALFWIN - PAD + DE*j for j in range(NSRC)]',
'L0   = [1.0/(1.0 + (2.0*(E - E0)/GAMMA)**2) for E in ESRC]',
'EOUT = ESRC[NPAD:NPAD+NOUT]',
'S0K  = [SIGMA_PK*math.sqrt(E0/EOUT[i])*L0[NPAD+i] for i in range(NOUT)]',
'',
'',
'def doppler_width(T):',
'    """Free-gas Doppler width Delta_D = sqrt(4 E0 k T / A)  [eV]."""',
'    return math.sqrt(4.0*E0*KB*T/A_RATIO)',
'',
'',
'def broaden(T):',
'    """sigma_gamma(E,T) on EOUT: Lorentzian convolved with a normalised Gaussian, then 1/v.',
'',
'    The kernel is symmetric, so the page accumulates it as kern[0]*L0[c] plus the paired',
'    terms (L0[c-k] + L0[c+k])*kern[k]. That order is kept here term for term, which is why',
'    no array library is needed and why the result matches the page bit for bit."""',
'    s = doppler_width(T)/math.sqrt(2.0)',
'    half = min(NPAD, max(1, int(math.ceil(8.0*s/DE))))',
'    inv2s2 = 1.0/(2.0*s*s)',
'    kern = [math.exp(-(k*DE)*(k*DE)*inv2s2) for k in range(half + 1)]',
'    norm = DE/(s*math.sqrt(2.0*math.pi))',
'    out = [0.0]*NOUT',
'    for i in range(NOUT):',
'        c = NPAD + i',
'        acc = L0[c]*kern[0]',
'        for k in range(1, half + 1):',
'            acc += (L0[c-k] + L0[c+k])*kern[k]',
'        out[i] = SIGMA_PK*math.sqrt(E0/EOUT[i])*acc*norm',
'    return out',
'',
'',
'def metrics(sig):',
'    peak = 0.0',
'    ipk = 0',
'    for i in range(NOUT):',
'        if sig[i] > peak:',
'            peak = sig[i]',
'            ipk = i',
'    h = peak/2.0',
'    eL = eR = EOUT[ipk]',
'    for i in range(ipk, 0, -1):',
'        if sig[i] < h:',
'            eL = EOUT[i] + (h - sig[i])/(sig[i+1] - sig[i])*DE',
'            break',
'    for i in range(ipk, NOUT-1):',
'        if sig[i] < h:',
'            eR = EOUT[i] - (h - sig[i])/(sig[i-1] - sig[i])*DE',
'            break',
'    area = 0.0',
'    for i in range(NOUT - 1):',
'        area += 0.5*(sig[i] + sig[i+1])*DE',
'    return peak, eR - eL, area, EOUT[ipk]',
'',
'',
'SAMPLE_E = ['+SAMPLE_E.map(e=>e.toFixed(3)).join(', ')+']',
'',
'',
'def compute():',
'    T = float(T_FUEL)',
'    dd = doppler_width(T)',
'    sig = broaden(T)',
'    peak, fwhm, area, epk = metrics(sig)',
'    out = {',
'        "Delta_D": dd*1000.0,',
'        "xi": GAMMA/dd,',
'        "sigma_peak_T": peak,',
'        "E_peak": epk,',
