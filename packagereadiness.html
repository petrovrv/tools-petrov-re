 "summary": {
  "en": "Decides whether an equipment package is ready for its next gate — purchase order, FAT, delivery, installation or turnover — and names the register, item and reason behind every blocker.",
  "uk": "Визначає, чи готовий пакет обладнання до наступного рубежу — замовлення, FAT, відвантаження, монтажу чи передання — і називає реєстр, елемент і причину кожного блокера.",
  "de": "Entscheidet, ob ein Ausrüstungspaket für seine nächste Stufe bereit ist — Bestellung, FAT, Versand, Montage oder Übergabe — und nennt Register, Eintrag und Grund jedes Blockers.",

 "description": {
  "en": "Rule-based gate screening for equipment packages. Five gates in fixed order — purchase order, factory acceptance test, delivery release, installation, turnover — carry 39 explicit criteria that read the project package registers by id: requisitions, bid evaluations, deviations and technical queries, equipment datasheets, interfaces, vendor documents with their review codes, punch items, turnover dossiers, verification and commissioning evidence. Each package and gate returns a verdict (ready, ready with exceptions, not ready, insufficient data), the blockers naming register, item and reason, and the frontier — which gate is next. A criterion can be declared not applicable with a reason, project criteria can be added, and a change-impact flag on any item a criterion read turns a positive result into a stale re-check. The tool works from hand-entered rows when no project package is present, and writes one readiness record per package and gate into the project package.",
  "uk": "Аналіз рубежів для пакетів обладнання за правилами. П’ять рубежів у сталому порядку — замовлення, заводські приймальні випробування, дозвіл на відвантаження, монтаж, передання — мають 39 явних критеріїв, що читають реєстри пакета проєкту за ідентифікаторами: заявки, оцінки пропозицій, відхилення й технічні запити, опитувальні листи, інтерфейси, документи постачальника з кодами розгляду, зауваження, комплекти передання, докази верифікації та введення в експлуатацію. Для кожного пакета й рубежу подано висновок (готовий, готовий із винятками, не готовий, недостатньо даних), блокери з реєстром, елементом і причиною та наступний рубіж. Критерій можна позначити незастосовним із причиною, додати критерії проєкту, а позначка впливу змін на будь-якому прочитаному елементі перетворює позитивний результат на «застаріло, перевірити». Інструмент працює і з рядками, введеними вручну, а до пакета проєкту записує один запис готовності на пакет і рубіж.",
  "de": "Regelbasierte Stufenprüfung für Ausrüstungspakete. Fünf Stufen in fester Reihenfolge — Bestellung, Werksabnahme, Versandfreigabe, Montage, Übergabe — tragen 39 ausdrückliche Kriterien, die die Register des Projektpakets über Kennungen lesen: Anfragespezifikationen, Angebotsbewertungen, Abweichungen und technische Rückfragen, Datenblätter, Schnittstellen, Lieferantendokumente mit ihren Prüfcodes, Restpunkte, Übergabedokumentationen, Verifikations- und Inbetriebnahmenachweise. Je Paket und Stufe entstehen ein Urteil (bereit, bereit mit Ausnahmen, nicht bereit, unzureichende Daten), die Blocker mit Register, Eintrag und Grund sowie die nächste Stufe. Ein Kriterium lässt sich mit Begründung als nicht zutreffend erklären, Projektkriterien lassen sich ergänzen, und eine Änderungsmarkierung an einem gelesenen Eintrag macht aus einem positiven Befund eine veraltete Nachprüfung. Das Werkzeug arbeitet auch mit von Hand eingegebenen Zeilen und schreibt je Paket und Stufe einen Bereitschaftseintrag in das Projektpaket.",
  "nl": "Regelgebaseerde poorttoetsing voor uitrustingspakketten. Vijf poorten in vaste volgorde — order, fabrieksacceptatietest, vrijgave voor verzending, montage, overdracht — dragen 39 expliciete criteria die de registers van het projectpakket op id lezen: aanvraagspecificaties, biedingsbeoordelingen, afwijkingen en technische vragen, gegevensbladen, raakvlakken, leveranciersdocumenten met hun beoordelingscodes, restpunten, overdrachtsdossiers, verificatie- en commissioningbewijs. Per pakket en poort volgen een oordeel (gereed, gereed met uitzonderingen, niet gereed, onvoldoende gegevens), de blokkades met register, item en reden, en de volgende poort. Een criterium kan met reden niet van toepassing worden verklaard, projectcriteria kunnen erbij, en een wijzigingsmarkering op een gelezen item maakt van een positief resultaat een verouderde hercontrole. De tool werkt ook met handmatig ingevoerde regels en schrijft één gereedheidsrecord per pakket en poort in het projectpakket.",
  "fr": "Criblage de jalon fondé sur des règles pour les lots d’équipement. Cinq jalons dans un ordre fixe — commande, essais de réception en usine, autorisation d’expédition, installation, remise — portent 39 critères explicites qui lisent les registres du dossier de projet par identifiant : réquisitions, évaluations des offres, écarts et questions techniques, fiches techniques, interfaces, documents fournisseur avec leurs codes de revue, réserves, dossiers de remise, preuves de vérification et de mise en service. Pour chaque lot et chaque jalon viennent un verdict (prêt, prêt avec réserves, pas prêt, données insuffisantes), les blocages nommant registre, élément et motif, et le prochain jalon. Un critère peut être déclaré sans objet avec motif, des critères de projet peuvent être ajoutés, et un signalement d’impact de modification sur un élément lu transforme un résultat positif en revérification périmée. L’outil fonctionne aussi à partir de lignes saisies à la main et écrit dans le dossier de projet un enregistrement de préparation par lot et par jalon.",
  "es": "Cribado de hitos basado en reglas para paquetes de equipos. Cinco hitos en orden fijo — pedido, pruebas de aceptación en fábrica, liberación para envío, montaje, entrega — llevan 39 criterios explícitos que leen los registros del paquete del proyecto por identificador: requisiciones, evaluaciones de ofertas, desviaciones y consultas técnicas, hojas de datos, interfaces, documentos del proveedor con sus códigos de revisión, puntos pendientes, dosieres de entrega, evidencias de verificación y de puesta en marcha. Por paquete e hito se obtienen un veredicto (listo, listo con excepciones, no listo, datos insuficientes), los bloqueos con registro, elemento y motivo, y el siguiente hito. Un criterio puede declararse no aplicable con motivo, pueden añadirse criterios del proyecto, y una marca de impacto de cambios sobre un elemento leído convierte un resultado positivo en una recomprobación obsoleta. La herramienta también funciona con filas introducidas a mano y escribe en el paquete del proyecto un registro de preparación por paquete e hito.",
  "pl": "Badanie etapów pakietów urządzeń oparte na regułach. Pięć etapów w ustalonej kolejności — zamówienie, odbiór fabryczny, zwolnienie do wysyłki, montaż, przekazanie — obejmuje 39 jawnych kryteriów czytających rejestry pakietu projektu po identyfikatorach: specyfikacje zapytań, oceny ofert, odstępstwa i zapytania techniczne, karty danych, interfejsy, dokumenty dostawcy wraz z kodami przeglądu, usterki, dokumentacje przekazania, dowody weryfikacji i rozruchu. Dla każdego pakietu i etapu powstają werdykt (gotowy, gotowy z wyjątkami, niegotowy, niewystarczające dane), blokery wskazujące rejestr, pozycję i przyczynę oraz następny etap. Kryterium można oznaczyć jako niedotyczące wraz z uzasadnieniem, można dodać kryteria projektu, a oznaczenie wpływu zmian na czytanej pozycji zmienia wynik pozytywny w nieaktualne sprawdzenie. Narzędzie działa także na wierszach wprowadzonych ręcznie i zapisuje w pakiecie projektu jeden rekord gotowości na pakiet i etap."
 },

 "limitations": {
  "en": "A readiness screening aid, not a purchase-order release, a FAT certificate, a shipping release, a permit to install or a turnover acceptance: contracts, the project quality plan and the purchaser's procedures remain authoritative. The gate criteria are author engineering method informed by IEC 62381:2024, NORSOK Z-CR-007 Rev. 1 and ISO 9001:2015 8.6; they reproduce no standard checklist. The verdict is only as good as the registers: the tool checks that a registered status says approved, closed or accepted, never that the document, test or dossier is technically correct. Vendor-document review codes follow the 1-4 convention set out in the tool; other project codes must be mapped before entry. Commissioning evidence and turnover dossiers are matched to a package through its system id. Dates are not evaluated: no criterion depends on a planned date and no lateness is computed. A change-impact flag can only be cleared by the tool that raised it.",
  "uk": "Засіб попереднього аналізу готовності, а не дозвіл на замовлення, сертифікат FAT, дозвіл на відвантаження, дозвіл на монтаж чи акт передання: визначальними лишаються контракти, план якості проєкту та процедури замовника. Критерії рубежів є авторською інженерною методикою з урахуванням IEC 62381:2024, NORSOK Z-CR-007 Rev. 1 та ISO 9001:2015, 8.6; жодного чек-листа стандарту не відтворено. Висновок вартий рівно стільки, скільки реєстри: інструмент перевіряє, що зареєстрований статус каже «затверджено», «закрито» чи «прийнято», а не технічну правильність документа, випробування чи комплекту. Коди розгляду документів постачальника відповідають угоді 1-4, наведеній в інструменті; інші коди проєкту потрібно перетворити до введення. Докази введення в експлуатацію та комплекти передання зіставляються з пакетом через ідентифікатор системи. Дати не оцінюються: жоден критерій не залежить від планової дати, запізнення не обчислюється. Позначку впливу змін може зняти лише інструмент, який її підняв.",
  "de": "Ein Hilfsmittel zur Bereitschaftsprüfung, keine Bestellfreigabe, kein FAT-Zertifikat, keine Versandfreigabe, keine Montageerlaubnis und keine Übergabeabnahme: Verträge, der Qualitätsplan des Projekts und die Verfahren des Bestellers bleiben maßgebend. Die Stufenkriterien sind Autorenmethodik unter Berücksichtigung von IEC 62381:2024, NORSOK Z-CR-007 Rev. 1 und ISO 9001:2015, 8.6; keine Norm-Checkliste wird reproduziert. Das Urteil ist nur so gut wie die Register: geprüft wird, dass ein erfasster Status freigegeben, geschlossen oder angenommen sagt, nie ob Dokument, Prüfung oder Dokumentation technisch richtig ist. Prüfcodes für Lieferantendokumente folgen der im Werkzeug festgelegten 1-4-Konvention; abweichende Projektcodes sind vor der Eingabe umzuschlüsseln. Inbetriebnahmenachweise und Übergabedokumentationen werden über die System-ID dem Paket zugeordnet. Termine werden nicht bewertet: kein Kriterium hängt an einem Plandatum, kein Verzug wird berechnet. Eine Änderungsmarkierung kann nur das Werkzeug aufheben, das sie gesetzt hat.",
  "nl": "Een hulpmiddel voor gereedheidstoetsing, geen ordervrijgave, FAT-certificaat, verzendvrijgave, montagevergunning of overdrachtsacceptatie: contracten, het kwaliteitsplan van het project en de procedures van de opdrachtgever blijven leidend. De poortcriteria zijn auteursmethodiek, geïnformeerd door IEC 62381:2024, NORSOK Z-CR-007 Rev. 1 en ISO 9001:2015, 8.6; geen normchecklist wordt overgenomen. Het oordeel is niet beter dan de registers: de tool toetst dat een vastgelegde status goedgekeurd, gesloten of geaccepteerd zegt, nooit of het document, de proef of het dossier technisch juist is. Beoordelingscodes van leveranciersdocumenten volgen de in de tool vastgelegde 1-4-conventie; andere projectcodes moeten vóór invoer worden vertaald. Commissioningbewijs en overdrachtsdossiers worden via de systeem-id aan een pakket gekoppeld. Data worden niet beoordeeld: geen criterium hangt aan een plandatum en vertraging wordt niet berekend. Een wijzigingsmarkering kan alleen worden opgeheven door de tool die ze plaatste.",
  "fr": "Une aide au criblage de préparation, et non une libération de commande, un certificat de FAT, une autorisation d’expédition, un permis d’installer ou une acceptation de remise : les contrats, le plan qualité du projet et les procédures de l’acheteur restent prépondérants. Les critères de jalon sont une méthode d’auteur informée par IEC 62381:2024, NORSOK Z-CR-007 Rev. 1 et ISO 9001:2015, 8.6 ; aucune liste de contrôle normative n’est reproduite. Le verdict ne vaut que ce que valent les registres : l’outil vérifie qu’un statut enregistré dit approuvé, clos ou accepté, jamais que le document, l’essai ou le dossier est techniquement juste. Les codes de revue des documents fournisseur suivent la convention 1-4 définie dans l’outil ; d’autres codes de projet doivent être convertis avant saisie. Les preuves de mise en service et les dossiers de remise sont rattachés à un lot par l’identifiant de système. Les dates ne sont pas évaluées : aucun critère ne dépend d’une date prévue et aucun retard n’est calculé. Un signalement d’impact de modification ne peut être levé que par l’outil qui l’a posé.",
  "es": "Una ayuda de cribado de preparación, no una liberación de pedido, un certificado de FAT, una autorización de envío, un permiso de montaje ni una aceptación de entrega: los contratos, el plan de calidad del proyecto y los procedimientos del comprador siguen siendo autoritativos. Los criterios de hito son método de ingeniería del autor informado por IEC 62381:2024, NORSOK Z-CR-007 Rev. 1 e ISO 9001:2015, 8.6; no se reproduce ninguna lista de comprobación normativa. El veredicto vale lo que valen los registros: la herramienta comprueba que un estado registrado diga aprobado, cerrado o aceptado, nunca que el documento, el ensayo o el dosier sea técnicamente correcto. Los códigos de revisión de documentos del proveedor siguen la convención 1-4 definida en la herramienta; otros códigos del proyecto deben convertirse antes de introducirlos. Las evidencias de puesta en marcha y los dosieres de entrega se asocian al paquete por el id de sistema. No se evalúan fechas: ningún criterio depende de una fecha prevista ni se calcula retraso. Una marca de impacto de cambios solo puede retirarla la herramienta que la planteó.",
  "pl": "Narzędzie wstępnego badania gotowości, a nie zwolnienie zamówienia, certyfikat FAT, zgoda na wysyłkę, pozwolenie na montaż ani protokół przekazania: nadrzędne pozostają umowy, plan jakości projektu i procedury zamawiającego. Kryteria etapów są autorską metodą inżynierską opartą na IEC 62381:2024, NORSOK Z-CR-007 Rev. 1 i ISO 9001:2015, 8.6; nie odtwarzają żadnej listy kontrolnej normy. Werdykt jest wart tyle, ile rejestry: narzędzie sprawdza, że zarejestrowany status mówi „zatwierdzone”, „zamknięte” lub „przyjęte”, nigdy tego, czy dokument, badanie albo dokumentacja są technicznie poprawne. Kody przeglądu dokumentów dostawcy odpowiadają konwencji 1-4 przyjętej w narzędziu; inne kody projektu trzeba przeliczyć przed wprowadzeniem. Dowody rozruchu i dokumentacje przekazania wiąże się z pakietem przez identyfikator systemu. Daty nie są oceniane: żadne kryterium nie zależy od daty planowanej i nie liczy się opóźnień. Oznaczenie wpływu zmian może zdjąć tylko narzędzie, które je wystawiło."
 },

   "uk": "Незалежної валідації немає. Критерії рубежів є авторською інженерною методикою з урахуванням IEC 62381:2024 (документація до FAT 5.3.3, програма випробувань 5.3.4, перелік зауважень 5.4, звіт FAT 5.5.2, завершення 5.6), NORSOK Z-CR-007 Rev. 1 (категорії зауважень A і B, 4.1 та додаток A) і ISO 9001:2015, 8.6 (випуск після запланованих заходів). Жодного чек-листа стандарту не відтворено. Еталонний корпус написаний окремим агентом за відкритою специфікацією, без доступу до цього коду.",

  } catch (e) {}

  return LANGS.indexOf(h) >= 0 ? h : 'en';
}

  if (o == null) return '';

}

  equipment_datasheet: 'equipment datasheet', requisition: 'technical requisition', bid_evaluation: 'bid evaluation',

function regLabel(sec, l) {
  l = l || curLang();
  try { if (window.DiagramProject && DiagramProject.sectionLabel) { var s = DiagramProject.sectionLabel(sec, l); if (s && s !== sec) return s; } } catch (e) {}
  return REG_EN[sec] || sec;
}
function kindLabel(k, l) {
  l = l || curLang();
  if (!k) return '—';
  try { if (window.DiagramProject && DiagramProject.kindLabel) { var s = DiagramProject.kindLabel(k, l); if (s && s !== k) return s; } } catch (e) {}
  return KIND_EN[k] || k;
}
function gateL(g, l) { return GATE_L[g] ? pickL(GATE_L[g], l) : (g === 'complete' ? pickL(VERDICT_L.complete, l) : String(g || '—')); }
function critName(c, l) {
  if (c.custom) return c.label || c.id;
  var e = CRIT_L[c.id];
  return e ? pickL(e[0], l) : c.id;
}
function critCond(c, l) {
  if (c.custom) return c.label || c.id;
  var e = CRIT_L[c.id];
  return e ? pickL(e[1], l) : '';
}
/* one reason in the reader's language, or in English for the written register */
function reasonText(rk, rv, l) {
  rv = rv || {};
  if (!rk) return '';
  if (rk === 'verbatim') return String(rv.text || '');
  var o = REASON_L[rk];
  if (!o) return rk;
  var v = {};
  Object.keys(rv).forEach(function (k) { v[k] = rv[k]; });
  if (rv.reg) v.regl = regLabel(rv.reg, l);
  if (rv.flag) v.flagl = FLAGWORD_L[rv.flag] ? pickL(FLAGWORD_L[rv.flag], l) : rv.flag;
  if (rk === 'dev_open') v.kind = DEVKIND_L[norm(rv.kind)] ? pickL(DEVKIND_L[norm(rv.kind)], l) : rv.kind;
  return fill(pickL(o, l), v);
}
function findingText(f, l) {
  var o = FINDING_L[f.rk];
  if (!o) return f.rule;
  var v = {};
  Object.keys(f.rv || {}).forEach(function (k) { v[k] = f.rv[k]; });
  if (v.g) v.gl = gateL(v.g, l);
  if (v.e) v.el = gateL(v.e, l);
  if (v.stage) v.stagel = STAGE_L[v.stage] ? pickL(STAGE_L[v.stage], l) : v.stage;
  if (v.reg) v.regl = regLabel(v.reg, l);
  if (v.kind && KIND_REG[v.kind]) v.kind = kindLabel(v.kind, l);
  return fill(pickL(o, l), v);
}
function entryReason(e, l) {
  var s = reasonText(e.rk, e.rv, l);
  if (e.flag_note && e.flag_note.length) {
    s += (s ? '; ' : '') + e.flag_note.map(function (f) {
      return reasonText('flagged', { flag: tr(f.flag), text: str(f.reason), by: tr(f.raised_by) || '—' }, l);
    }).join('; ');
  }
  return s;
}

  learnTitle: T('What this tool does', 'Що робить цей інструмент', 'Was dieses Werkzeug tut', 'Wat deze tool doet', 'Ce que fait cet outil', 'Qué hace esta herramienta', 'Co robi to narzędzie'),

  learnVerdictB: T('A blocker that is not met makes the gate not ready. Otherwise a blocker or major criterion with no data, or stale, makes it insufficient data. Otherwise any exception, or a major criterion not met, makes it ready with exceptions. Minor criteria never change the verdict.',

    'Ein nicht erfülltes blockierendes Kriterium macht die Stufe nicht bereit. Sonst ergibt ein blockierendes oder wesentliches Kriterium ohne Daten oder veraltet „unzureichende Daten“. Sonst ergibt jede Ausnahme oder ein nicht erfülltes wesentliches Kriterium „bereit mit Ausnahmen“. Geringe Kriterien ändern das Urteil nie.',

    'Un critère bloquant non satisfait rend le jalon pas prêt. Sinon, un critère bloquant ou majeur sans données ou périmé donne « données insuffisantes ». Sinon, toute réserve ou un critère majeur non satisfait donne « prêt avec réserves ». Les critères mineurs ne changent jamais le verdict.',

/* ---- small value helpers, SPEC conventions ---- */
/* Lookup maps keyed by user text are prototype-free: a register named
   "constructor" or a criterion id named "toString" must not resolve through
   Object.prototype. Round 1 of validation found a project criterion with
   register "constructor" throwing in customValid, and an id "toString"
   shadowing the project-criterion branch of criterionOfGate. */
function hasOwn(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
function bare(o) {
  var m = Object.create(null);
  Object.keys(o || {}).forEach(function (k) { m[k] = o[k]; });
  return m;
}
function isObj(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }
function str(x) { return x == null ? '' : (typeof x === 'object' ? '' : String(x)); }
function tr(x) { return str(x).trim(); }
function empty(x) { return x == null || (typeof x === 'string' && x.trim() === ''); }
function norm(x) { return tr(x).toLowerCase().replace(/[\s-]+/g, '_'); }
function idEq(a, b) { var x = tr(a); return x !== '' && x === tr(b); }
function arr(x) { return Array.isArray(x) ? x : []; }
function objs(x) { return arr(x).filter(isObj); }

/* identical scheme to DiagramProject.slug/deriveId, used when the runtime is not
   present (a file:// copy, the node harness); the runtime's own is preferred */
function localSlug(name) {
  var s0 = String(name == null ? '' : name).toLowerCase(), re;
  try { if (s0.normalize) s0 = s0.normalize('NFC'); } catch (e) {}
  try { re = new RegExp('[^\\p{L}\\p{N}]+', 'gu'); } catch (e2) { re = /[^A-Za-z0-9]+/g; }
  var out = s0.replace(re, '-').replace(/^-+|-+$/g, '');
  return out.slice(0, 60).replace(/-+$/g, '');
}
function deriveId(prefix, name) {
  try {
    if (typeof window !== 'undefined' && window.DiagramProject && DiagramProject.deriveId) return DiagramProject.deriveId(prefix, name);
  } catch (e) {}
  var p = String(prefix || '').toUpperCase().replace(/[^A-Z0-9]+/g, ''), b = localSlug(name);
  return (p && b) ? p + '-' + b : null;
}

function vdPkg(row) {
  var r = isObj(row.package) ? tr(row.package.ref) : '';
  return r || tr(row.package_id);
}
function regOf(S, sec) {
  var r = S.registers && S.registers[sec];
  return { provided: !!(r && r.provided), items: r ? objs(r.items) : [] };
}
function itemKey(sec, row) {

}

function devAffects(d, g) {

}
function punchClosed(p) { return norm(p.status) === 'closed' || (empty(p.status) && !empty(p.closed_at)); }

  if (idEq(p.package_id, P.id)) return true;
  return empty(p.package_id) && tr(P.system_id) !== '' && idEq(p.system_id, P.system_id);
}

var PRECEDENCE = { not_met: 4, no_data: 3, exception: 2, met: 1 };

/* Accumulates item outcomes of one criterion and combines them by SPEC §4.2. */
function Acc() { this.items = []; this.refs = []; }
Acc.prototype.ref = function (kind, id) { if (kind && tr(id)) this.refs.push({ kind: kind, id: tr(id) }); return this; };
/* SPEC §7.3: a target names a register item by kind and id, and a null id is
   written only for a thing that is absent (`missing: true`). A row that is
   present but carries no id cannot be pointed at, so it is recorded at the
   level of the criterion — no kind, no id — and the reason still says why. */
Acc.prototype.add = function (res, kind, id, missing, rk, rv) {
  var tid = (id == null || tr(id) === '') ? null : tr(id);
  this.items.push({ result: res, target_kind: (tid === null && !missing) ? null : (kind || null), target_id: tid,
    missing: !!missing, rk: rk || null, rv: rv || {} });
  return this;
};
Acc.prototype.done = function (emptyResult) {
  if (!this.items.length) return { result: emptyResult || 'met', targets: [], refs: this.refs };
  var best = 'met';
  this.items.forEach(function (it) { if (PRECEDENCE[it.result] > PRECEDENCE[best]) best = it.result; });
  return { result: best, targets: best === 'met' ? [] : this.items.filter(function (it) { return it.result === best; }), refs: this.refs };
};
function one(res, kind, id, missing, rk, rv, refs) {
  var a = new Acc(); a.add(res, kind, id, missing, rk, rv);
  (refs || []).forEach(function (r) { a.ref(r.kind, r.id); });
  return a.done();
}
function notProvided(sec) { return one('no_data', REG_KIND[sec], null, true, 'reg_missing', { reg: sec }); }
function autoNa(rk, rv, refs) { return { result: 'na', na_source: 'auto', rk: rk, rv: rv || {}, targets: [], refs: refs || [] }; }

/* ---- context shared by the criteria of one package ---- */

  }) : [];
  var ds = regOf(S, 'equipment_datasheets');
  C.dsProvided = ds.provided;

function cellText(sec, col, item) {
  var key = col[0], kind = col[1];
  if (kind === 'pkgref') return vdPkg(item);
  if (kind === 'bool') return item[key] === true;
  if (kind === 'sel' && col[2] && col[2].code) return codeOf(item);
  if (CODEC[kind]) return CODEC[kind].fmt(item[key]);
  if (kind === 'ifitems') return CODEC.ifitems.fmt(item[key]);
  return item[key] == null ? '' : (typeof item[key] === 'object' ? JSON.stringify(item[key]) : String(item[key]));
}
function codecOf(kind) { return CODEC[kind] || null; }

/* write one view row back onto its item; a compact cell whose text is still what
   the stored value renders to leaves the stored value untouched */
function applyView(sec, view, item) {
  REG_COLS[sec].forEach(function (col) {
    var key = col[0], kind = col[1], v = view[key];
    var before = cellText(sec, col, item);
    if (kind === 'bool') { if (!!v !== (item[key] === true)) item[key] = !!v; return; }
    if (String(v == null ? '' : v) === String(before)) return;
    if (kind === 'pkgref') {
      if (isObj(item.package)) item.package.ref = String(v || '');
      else if (item.package_id !== undefined && !isObj(item.package)) item.package_id = String(v || '');
      else item.package = { ref: String(v || '') };
      return;
    }
    var c = codecOf(kind);
    if (c) { item[key] = c.parse(v); return; }
    item[key] = v == null ? '' : String(v);
  });
  return item;
}

var tableReg = [], tableWatch = false, tableTimer = null;
function tableBox(wrap, tb) {
  var box = dom('div', 'dgu-table-box');
  box.appendChild(wrap);
  var hint = dom('div', 'dgu-table-hint');
  var arrow = dom('span', null, '↔');
  arrow.setAttribute('aria-hidden', 'true');
  hint.appendChild(arrow);
  hint.appendChild(dom('span', null, uiText('table_wide')));
  box.appendChild(hint);
  wrap.addEventListener('scroll', function () {
    box.classList.toggle('end', wrap.scrollLeft + wrap.clientWidth >= wrap.scrollWidth - 2);
  });
  tableReg.push({ box: box, wrap: wrap, tb: tb });
  if (tableReg.length > 200) tableReg = tableReg.filter(function (e) { return e.box.isConnected !== false; });
  if (!tableWatch && window.addEventListener) {

    window.addEventListener('resize', measureTablesSoon);
    window.addEventListener('orientationchange', measureTablesSoon);

    var e = tableReg[i];
    if (e.box.isConnected === false) { tableReg.splice(i, 1); continue; }
    var avail = e.box.clientWidth, need = Math.max(e.tb.scrollWidth, e.tb.offsetWidth);
    var over = avail > 0 && need > avail + 2;
    e.box.classList.toggle('wide', over);

    else e.box.classList.remove('end');
