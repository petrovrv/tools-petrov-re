        });
        ui.sync(); ui.run();
      }
    }),
    ui.resetAction()
  ] });
  ui.examples(EXAMPLES);
  ui.stage(STAGE_DEF);
  adoptStage(ui);
  ui.ready();
  window.__co2ship = { ui: ui, state: state };
}

function installData() {
  if (!window.Diagram) return;
  Diagram.init({ id: 'co2ship', file: 'co2ship.html',
    state: {
      serialize: function () { return state; },
      deserialize: function (o) { o = o || {}; for (var k in o) if (o.hasOwnProperty(k)) state[k] = o[k]; if (ui) { ui.sync(); ui.run(); } }
    },
    record: function () {
      if (!last || !last.ok) return null;
      var inputs = {}, k;
      for (k in state) if (state.hasOwnProperty(k) && k !== 'level') inputs[k] = state[k];
      return {
        inputs: inputs,
        outputs: { perTonne: last.perTonne, E: last.E, P_el: last.P_el, fleet: last.fleet, RT_h: last.RT,
          Lbe_km: last.breakEven.Lbe, TLiq: last.liq.TLiq, pLiq: last.liq.pLiq, capex: last.costs.capex.total },
        units: { mdot: 'kg/s', L: 'm', pIn: 'Pa', TIn: 'K', perTonne: 'EUR/t', E: 'J/kg', P_el: 'W',
          RT_h: 'h', Lbe_km: 'km', TLiq: 'K', pLiq: 'Pa', capex: 'EUR' },
        model: {
          equations: ['w = (w_comp + Q_ref/COP)/eta_motor + w_dehy', 'COP = f_Carnot T_ev/(T_cond - T_ev)',
            'RT = 2L/v (1+margin) + 2(t_load + t_port)', 'fleet = ceil(trips_needed / trips_per_ship)',
            'LCOT = (CRF CAPEX + O&M + energy + fuel + fees + CO2)/t'],
          ranges: ['screening level, EUR 2025, +-40 %'],
          notes: ['CCUS.ship ' + CCUS.ship.VERSION]
        },
        warnings: last.warnings
      };
    },
    handoff: {
      provides: ['mdot', 'L', 'E', 'p', 'T', 'Q'],
      accepts: ['mdot', 'p', 'T', 'L'],
      build: function () {
        if (!last || !last.ok) return null;
        var h = last.handoff;
        return {
          quantities: { mdot: { value: h.mdot, unit: 'kg/s' }, L: { value: h.L, unit: 'm' }, E: { value: h.E, unit: 'J/kg' },
            p: { value: h.p, unit: 'Pa' }, T: { value: h.T, unit: 'K' }, Q: { value: h.Q, unit: 'W' } },
          sets: { ship: [{ L: { value: h.L, unit: 'm' } }, { E: { value: h.E, unit: 'J/kg' } }, { mdot: { value: h.mdot, unit: 'kg/s' } }] }
        };
      },
      apply: function (p) {
        var q = (p && p.quantities) || {};
        if (q.mdot) state.mdot = q.mdot.value;
        if (q.L) state.L = q.L.value;
        if (q.p) state.pIn = q.p.value;
        if (q.T) state.TIn = q.T.value;
        if (ui) { ui.sync(); ui.run(); }
      }
    }
  });
}

function boot() {
  if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1') buildInterface(); else degrade();
  installData();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
});
</script>
