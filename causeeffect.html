  function pickL(o, l) { if (!o) return ''; if (typeof o === 'string') return o; return o[l || lang] || o.en || ''; }
  function fill(s, vars) {
    s = String(s);
    if (vars) Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(vars[k] == null ? '—' : String(vars[k])); });
    return s;
  }
  /* tr: the string in the current (or given) language; S: the dictionary */
  function tr(k, vars, l) { var o = S[k]; return fill(o ? (o[l || lang] || o.en) : k, vars); }
  /* a framework label: the language object itself, so a rebuild re-picks it */
  function TL(k) { return S[k] || { en: k }; }
  function TLf(k, vars) { var o = S[k] || { en: k }, r = {}; LANGS.forEach(function (l) { r[l] = fill(o[l] || o.en, vars); }); return r; }

  function fmtNum(v, l, sig) {
    if (typeof v !== 'number' || !isFinite(v)) return '—';
    var loc = LOCALE[l || lang] || 'en-GB', grp = Math.abs(v) >= 1e4;
    try {
      /* An integer prints every digit it has. The combination count is 2^n and
         is the denominator the conflict fraction is read against, so six
         significant digits would put 1 048 580 on the sheet where the engine
         computed 1 048 576. Above 2^53 the double is still exact for a power of
         two, and BigInt carries all twenty digits of 2^64 through the formatter. */
      if (v === Math.round(v)) {
        if (Math.abs(v) < 1e6) return new Intl.NumberFormat(loc, { maximumFractionDigits: 0, useGrouping: grp }).format(v);
        return new Intl.NumberFormat(loc, { useGrouping: grp }).format(BigInt(v));
      }
      return new Intl.NumberFormat(loc, { maximumSignificantDigits: sig || 6, useGrouping: grp }).format(v);
    } catch (e) { return String(Math.round(v * 1e6) / 1e6); }
  }
  /* A rule's basis reaches the check card and the "rules cited" table of the
     printed sheet. The clause number is a proper noun and stands as written;
     the prose beside it is printed in the reader's language. */
  function basisText(b, l) {
    var k = CE.BASIS_KEY[String(b)];
    return k ? tr(k, null, l) : String(b);
  }
  function prettyUnit(u) { return String(u).replace('m3/', 'm³/'); }
  /* The SI unit of a dimensionless quantity is the numeral 1 (ISO 80000-1), so a
     value printed beside it reads as two numbers: "0.25 1". A dimensionless
     value carries no unit token on any surface; the quantity name and the
     operator already say what the number is. 1/s and %LEL are not affected,
     only the exact token "1". */
  function bareUnit(u) { return u === '1' ? '' : u; }
  function unitLabel(cd) {
    var u = bareUnit(prettyUnit(cd.display_unit || ''));
    if (cd.quantity === 'pressure') u += cd.reference === 'absolute' ? '(a)' : '(g)';
    return u;
  }
  function displayValue(cd) { return CE.fromSI(cd.quantity, cd.display_unit, cd.setpoint_si); }
  function condText(c, l) {
    var cd = c.condition || {};
    if (cd.quantity === 'discrete') return cd.label ? '“' + cd.label + '”' : (cd.state ? '= 1' : '= 0');
    var dv = displayValue(cd);
    var op = { '>': '>', '>=': '≥', '<': '<', '<=': '≤' }[cd.operator] || '?';
    var un = unitLabel(cd);
    return op + ' ' + (dv == null ? '—' : fmtNum(dv, l)) + (un ? ' ' + un : '');
  }
  function condTextSI(c, l) {
    var cd = c.condition || {};
    if (cd.quantity === 'discrete') return condText(c, l);
    var si = CE.UNITS[cd.quantity] ? CE.UNITS[cd.quantity].si : '';
    /* the SI value is printed beside the display value only where they differ,
       so a level in metres does not read "1.8 m [1.8 m]" */
    if (cd.display_unit === si) return condText(c, l);
    var siU = bareUnit(prettyUnit(si));
    return condText(c, l) + ' [' + (CE.isNum(cd.setpoint_si) ? fmtNum(cd.setpoint_si, l, 12) : '—') + (siU ? ' ' + siU : '') + ']';
  }

  function sevName(s, l) { return tr('sev_' + s, null, l); }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'text') n.textContent = v;
      else if (k === 'class') n.className = v;
      else if (k === 'on') Object.keys(v).forEach(function (ev) { n.addEventListener(ev, v[ev]); });
      else if (k === 'dataset') Object.keys(v).forEach(function (d) { n.dataset[d] = v[d]; });
      else if (k === 'value') n.value = v;
      else if (k === 'checked') n.checked = !!v;
      else if (k === 'disabled') n.disabled = !!v;
      else n.setAttribute(k, v === true ? '' : v);

  /* Removing a focused child fires blur synchronously, and a blur handler may
     re-enter the painter and detach further nodes, so a child read an instant
     ago can already have left. Re-read every time, give up on a foreign node,
     and finish with textContent, which cannot throw. */
  function clear(n) {
    if (!n) return;
    for (var c = n.firstChild; c; c = n.firstChild) {
      if (c.parentNode !== n) break;
      try { n.removeChild(c); } catch (err) { break; }
    }
    if (n.firstChild) n.textContent = '';
  }

  function presetState(key, l) { return CE.normState(PR.build(key, presetText(l || lang))).state; }

  /* The deferred runtimes have not loaded when this script runs, so the opening

     and on a language change, while it is still untouched. */
  var state = presetState('P1', 'en');
  function refreshPresetLanguage(from) {
    try {
      if (JSON.stringify(state) !== JSON.stringify(presetState('P1', from || 'en'))) return false;
      var ns = presetState('P1');
      Object.keys(state).forEach(function (k) { if (!Object.prototype.hasOwnProperty.call(ns, k)) delete state[k]; });

  }
  function runNow() { renderedSig = sigOf(); if (runTimer) { clearTimeout(runTimer); runTimer = null; } if (ui) ui.run(); }
  function rerenderEditors() { paintCauses(); paintEffects(); renderedSig = sigOf(); }

  function findCause(id) { for (var i = 0; i < state.causes.length; i++) if (state.causes[i].id === id) return state.causes[i]; return null; }
  function findEffect(id) { for (var i = 0; i < state.effects.length; i++) if (state.effects[i].id === id) return state.effects[i]; return null; }
  function cellOf(cid, eid) { for (var i = 0; i < state.cells.length; i++) { var x = state.cells[i]; if (x.cause_id === cid && x.effect_id === eid) return x; } return null; }

  /* rename a cause/effect id and every reference to it */
  function renameCause(oldId, newId) {
    if (oldId === newId) return;
    state.cells.forEach(function (x) { if (x.cause_id === oldId) x.cause_id = newId; });
    state.causes.forEach(function (c) { c.exclusive_with = (c.exclusive_with || []).map(function (k) { return k === oldId ? newId : k; }); });
    var sc = state.scenario;
    ['channels', 'bypassed'].forEach(function (k) { if (sc[k] && Object.prototype.hasOwnProperty.call(sc[k], oldId)) { sc[k][newId] = sc[k][oldId]; delete sc[k][oldId]; } });
  }
  function renameEffect(oldId, newId) {
    if (oldId === newId) return;
    state.cells.forEach(function (x) { if (x.effect_id === oldId) x.effect_id = newId; });
    var sc = state.scenario;
    if (sc.latched && Object.prototype.hasOwnProperty.call(sc.latched, oldId)) { sc.latched[newId] = sc.latched[oldId]; delete sc.latched[oldId]; }
  }

  /* §3.3/§3.4: the id pattern, refused at the field rather than repaired on the
     next load. The refusal is written into the input notes, so the reader sees
     in their own language which text was rejected and which id still stands. */
  function idOk(v, keep, inp) {
    if (CE.ID_RE.test(v)) return true;
    inputNotes = inputNotes.concat([{ k: 'id', what: keep, field: 'id', value: v, to: keep }]);
    if (inp) { inp.classList.add('ce-flash'); setTimeout(function () { inp.classList.remove('ce-flash'); }, 1500); }

  /* §7.6 flag placement */

  function pkgFlagPlacement() {

    var mid = state.matrix.id;
    function put(k, f) { (out[k] = out[k] || []).push(f); }
    (PKG.flags || []).forEach(function (f) {
      if (!f || typeof f !== 'object') return;
      var tid = String(f.target_id == null ? '' : f.target_id);
      if (f.target_kind === 'cause_effect') {
        if (tid === mid) { put('matrix:' + mid, f); return; }
        if (tid.indexOf(mid + ':') !== 0) { others++; return; }
        var rest = tid.slice(mid.length + 1), parts = rest.split(':');
        var hit = false;

        else if (parts.length === 1) {
          if (findCause(rest)) { put('cause:' + rest, f); hit = true; }
          if (findEffect(rest)) { put('effect:' + rest, f); hit = true; }
        }
        if (!hit) orphans.push(f);
      } else if (f.target_kind === 'io_point') {
        state.causes.forEach(function (c) { if ((c.channels || []).some(function (ch) { return CE.trim(ch.tag) && CE.tagEq(ch.tag, tid); })) put('cause:' + c.id, f); });
        state.effects.forEach(function (e) { if (CE.trim(e.tag) && CE.tagEq(e.tag, tid)) put('effect:' + e.id, f); });

          state.causes.forEach(function (c) { if ((c.channels || []).some(function (ch) { return CE.tagEq(ch.tag, t); })) { put('cause:' + c.id, f); any = true; } });

  }

  /* ============================================================ figure */
  var FIG = { bg: '#ffffff', ink: '#12161d', muted: '#5b6675', line: '#c9d1dc', head: '#eef2f7', x: '#1f3fa8', p: '#1f6f34', a: '#9a5a00', bad: '#c62828', warn: '#d98a00', excl: '#6b4fbb' };
  function drawMatrix(canvas, effects, l, scale) {
    scale = scale || 2;
    var C = state.causes, rowH = 34, colW = 78, rowHdr = 280, headH = 66;
    var W = rowHdr + effects.length * colW + 2, H = headH + C.length * rowH + 2;
    canvas.width = W * scale; canvas.height = H * scale;
    var g = canvas.getContext('2d'); g.setTransform(scale, 0, 0, scale, 0, 0);
    g.fillStyle = FIG.bg; g.fillRect(0, 0, W, H);
    var nums = conflictNumbers(), unsafe = unsafeCells();
    var excl = CE.map(); (last ? last.exclusive_pairs : []).forEach(function (p) { (excl[p.i] = excl[p.i] || []).push(p.j); (excl[p.j] = excl[p.j] || []).push(p.i); });
    var font = '"Segoe UI", Roboto, Helvetica, Arial, sans-serif';
    function text(t, x, y, size, color, weight, align, maxW) {
      g.font = (weight || 400) + ' ' + size + 'px ' + font; g.fillStyle = color; g.textAlign = align || 'left'; g.textBaseline = 'middle';
      var s = String(t);
      if (maxW) while (s.length > 1 && g.measureText(s).width > maxW) s = s.slice(0, -2) + '…';
      g.fillText(s, x, y);
    }
    g.fillStyle = FIG.head; g.fillRect(0, 0, W, headH);
    text(tr('causeEffect', null, l), 8, headH / 2, 12, FIG.muted, 600, 'left', rowHdr - 12);
    effects.forEach(function (e, k) {
      var x = rowHdr + k * colW;
      text(e.tag || e.id, x + colW / 2, 16, 11.5, FIG.ink, 700, 'center', colW - 6);
      text(glyph(e.action) + ' ' + actName(e.action, l), x + colW / 2, 34, 10, FIG.muted, 400, 'center', colW - 6);
      text(stName(e.safe_state, l), x + colW / 2, 50, 10, FIG.muted, 400, 'center', colW - 6);
    });
    C.forEach(function (c, i) {
      var y = headH + i * rowH;
      if (i % 2) { g.fillStyle = '#f7f9fc'; g.fillRect(0, y, W, rowH); }
      text(c.id + '  ' + tagLabel(c), 8, y + 11, 11.5, FIG.ink, 700, 'left', rowHdr - 16);
      text(condText(c, l) + ' · ' + c.voting + (excl[c.id] ? '   ⟂ ' + excl[c.id].join(',') : ''), 8, y + 24, 10, FIG.muted, 400, 'left', rowHdr - 16);
      effects.forEach(function (e, k) {
        var x = rowHdr + k * colW, cell = cellOf(c.id, e.id), key = c.id + ':' + e.id;
        if (cell) {
          var col = cell.type === 'X' ? FIG.x : cell.type === 'P' ? FIG.p : FIG.a;
          text(cell.type, x + colW / 2, y + (cell.action ? 12 : rowH / 2), 15, col, 700, 'center');
          if (cell.action) text(stName(CE.ACTIONS[cell.action].cmd, l), x + colW / 2, y + 26, 9, col, 400, 'center', colW - 8);
        }
        if (nums[key]) {
          g.strokeStyle = FIG.bad; g.lineWidth = 2.5; g.setLineDash([]); g.strokeRect(x + 3, y + 3, colW - 6, rowH - 6);
          g.fillStyle = FIG.bad; g.beginPath(); g.arc(x + colW - 10, y + 10, 8, 0, 6.2832); g.fill();
          text(nums[key].join(','), x + colW - 10, y + 10.5, 9, '#ffffff', 700, 'center');
        } else if (unsafe[key]) {
          g.strokeStyle = FIG.warn; g.lineWidth = 2; g.setLineDash([4, 3]); g.strokeRect(x + 3, y + 3, colW - 6, rowH - 6); g.setLineDash([]);
        }
      });
    });
    g.strokeStyle = FIG.line; g.lineWidth = 1; g.setLineDash([]);
    for (var i = 0; i <= C.length; i++) { g.beginPath(); g.moveTo(0, headH + i * rowH + 0.5); g.lineTo(W, headH + i * rowH + 0.5); g.stroke(); }
    for (var k = 0; k <= effects.length; k++) { g.beginPath(); g.moveTo(rowHdr + k * colW + 0.5, 0); g.lineTo(rowHdr + k * colW + 0.5, H); g.stroke(); }
    g.beginPath(); g.moveTo(0.5, 0); g.lineTo(0.5, H); g.stroke();
    g.strokeRect(0.5, 0.5, W - 1, H - 1);
    return canvas;
  }
