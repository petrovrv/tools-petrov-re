 "summary": {
  "en": "Builds a cause and effect matrix — causes with voting, delay and bypass, effects with safe state, latch and reset — evaluates any cause scenario and reviews every combination for conflicts, coverage, reset and convention gaps.",
  "uk": "Будує матрицю причин і наслідків — причини з голосуванням, затримкою і шунтуванням, наслідки з безпечним станом, фіксацією і скиданням — обчислює будь-який сценарій причин і перевіряє всі комбінації на конфлікти й прогалини.",
  "de": "Erstellt eine Ursache-Wirkungs-Matrix — Ursachen mit Votierung, Verzögerung und Überbrückung, Wirkungen mit sicherem Zustand, Selbsthaltung und Rücksetzen — wertet jedes Szenario aus und prüft alle Kombinationen auf Konflikte und Lücken.",
  "nl": "Bouwt een oorzaak-gevolgmatrix — oorzaken met stemming, vertraging en overbrugging, gevolgen met veilige toestand, vergrendeling en reset — rekent elk scenario door en toetst alle combinaties op conflicten en hiaten.",
  "fr": "Construit une matrice causes-effets — causes avec vote, temporisation et shunt, effets avec état sûr, verrouillage et réarmement — évalue tout scénario et examine chaque combinaison (conflits, couverture, réarmement, principe).",
  "es": "Construye una matriz causa-efecto — causas con votación, retardo y puenteo, efectos con estado seguro, enclavamiento y rearme — evalúa cualquier escenario y revisa todas las combinaciones en busca de conflictos y huecos.",
  "pl": "Buduje macierz przyczyn i skutków — przyczyny z głosowaniem, opóźnieniem i bocznikowaniem, skutki ze stanem bezpiecznym, podtrzymaniem i kasowaniem — oblicza dowolny scenariusz i sprawdza wszystkie kombinacje pod kątem konfliktów i luk."
 },
 "description": {
  "en": "A cause and effect matrix states which initiating conditions drive which final elements, and how: trip (X), permissive (P) or alarm-only (A). This page holds causes (initiating tags, an SI setpoint with its display unit, MooN voting over redundant channels, delay, process safety time, bypass provisions), effects (tag, action, safe state, state when de-energised, latching and reset rule, response time) and the cells between them, with an action override per trip cell. A scenario sets channel trips, values or bypasses and shows the state of every effect with its latch memory, including resets accepted or refused. The review checks 51 rules over the whole combination space of causes — exhaustively up to 16 causes, and by exact pair search plus a seeded sample above that — and reports conflicts (opposite commands, a trip against an active permissive), coverage gaps, latch and reset gaps, voting independence, the energise or de-energise to trip convention against the IO fail state, bypass provisions, the response-time budget against the process safety time, and interlock references from the project package that this matrix does not carry.",
  "uk": "Матриця причин і наслідків показує, які ініціювальні умови керують якими виконавчими елементами і як: спрацювання (X), дозвіл (P) чи лише сигнал (A). Сторінка тримає причини (позиції, уставка в SI з одиницею відображення, голосування MooN по резервованих каналах, затримка, час безпеки процесу, умови шунтування), наслідки (позиція, дія, безпечний стан, стан без живлення, фіксація і правило скидання, час реакції) та клітинки між ними з можливістю перевизначити дію. Сценарій задає спрацювання каналів, значення або шунти і показує стан кожного наслідку з пам’яттю фіксації, зокрема прийняті чи відхилені скидання. Перевірка застосовує 51 правило до всього простору комбінацій причин — повним перебором до 16 причин і точним пошуком пар із керованою вибіркою понад це — та повідомляє про конфлікти, прогалини покриття, фіксації й скидання, незалежність голосування, принцип спрацювання проти стану відмови IO, умови шунтування, бюджет часу реакції проти часу безпеки процесу і посилання на блокування з пакета проєкту, яких у цій матриці немає.",
  "de": "Eine Ursache-Wirkungs-Matrix sagt, welche auslösenden Bedingungen welche Stellglieder ansteuern und wie: Auslösung (X), Freigabe (P) oder nur Alarm (A). Diese Seite führt Ursachen (Kennzeichen, SI-Grenzwert mit Anzeigeeinheit, MooN-Votierung über redundante Kanäle, Verzögerung, Prozesssicherheitszeit, Überbrückungsregeln), Wirkungen (Kennzeichen, Aktion, sicherer Zustand, Zustand spannungslos, Selbsthaltung und Rücksetzregel, Stellzeit) und die Zellen dazwischen, mit abweichender Aktion je Auslösezelle. Ein Szenario setzt Kanäle, Werte oder Überbrückungen und zeigt den Zustand jeder Wirkung samt Haltespeicher, einschließlich angenommener und abgelehnter Rücksetzungen. Die Prüfung wendet 51 Regeln auf den gesamten Kombinationsraum an — vollständig bis 16 Ursachen, darüber exakte Paarsuche mit gesäter Stichprobe — und meldet Konflikte, Abdeckungslücken, Selbsthaltung und Rücksetzen, Unabhängigkeit der Votierung, Auslöseprinzip gegen E/A-Fehlerzustand, Überbrückungsregeln, Reaktionsbudget gegen Prozesssicherheitszeit und Verriegelungsverweise aus dem Projektpaket, die diese Matrix nicht führt.",
  "nl": "Een oorzaak-gevolgmatrix zegt welke initiërende condities welke eindelementen aansturen en hoe: trip (X), vrijgave (P) of alleen alarm (A). Deze pagina houdt oorzaken (tags, SI-instelwaarde met weergave-eenheid, MooN-stemming over redundante kanalen, vertraging, procesveiligheidstijd, overbruggingsregels), gevolgen (tag, actie, veilige toestand, toestand spanningsloos, vergrendeling en resetregel, reactietijd) en de cellen ertussen, met een afwijkende actie per tripcel. Een scenario zet kanalen, waarden of overbruggingen en toont de toestand van elk gevolg met zijn vergrendelgeheugen, inclusief aanvaarde en geweigerde resets. De toets past 51 regels toe op de hele combinatieruimte — volledig tot 16 oorzaken, daarboven exacte paarzoektocht plus een steekproef met vaste startwaarde — en meldt conflicten, dekkingshiaten, vergrendeling en reset, onafhankelijkheid van de stemming, het tripprincipe tegenover de I/O-faaltoestand, overbruggingsregels, het reactiebudget tegenover de procesveiligheidstijd en vergrendelingsverwijzingen uit het projectpakket die deze matrix niet draagt.",
  "fr": "Une matrice causes-effets indique quelles conditions initiatrices pilotent quels organes finaux, et comment : déclenchement (X), permissif (P) ou alarme seule (A). Cette page tient les causes (repères, seuil SI avec son unité d’affichage, vote MooN sur canaux redondants, temporisation, temps de sécurité du procédé, règles de shunt), les effets (repère, action, état sûr, état désexcité, verrouillage et règle de réarmement, temps de réponse) et les cases entre eux, avec une action forcée par case de déclenchement. Un scénario fixe les canaux, les valeurs ou les shunts et montre l’état de chaque effet avec sa mémoire de verrouillage, y compris les réarmements acceptés ou refusés. La revue applique 51 règles à tout l’espace des combinaisons — exhaustivement jusqu’à 16 causes, au-delà par recherche exacte de paires et échantillon à graine fixée — et signale conflits, lacunes de couverture, verrouillage et réarmement, indépendance du vote, principe de déclenchement face à l’état de repli des E/S, règles de shunt, budget de réponse face au temps de sécurité, et références de verrouillage du dossier de projet absentes de cette matrice.",
  "es": "Una matriz causa-efecto indica qué condiciones iniciadoras accionan qué elementos finales y cómo: disparo (X), permisivo (P) o solo alarma (A). Esta página mantiene causas (tags, punto de disparo en SI con su unidad de visualización, votación MooN sobre canales redundantes, retardo, tiempo de seguridad del proceso, reglas de puenteo), efectos (tag, acción, estado seguro, estado desenergizado, enclavamiento y regla de rearme, tiempo de respuesta) y las celdas entre ellos, con una acción forzada por celda de disparo. Un escenario fija canales, valores o puenteos y muestra el estado de cada efecto con su memoria de enclavamiento, incluidos los rearmes aceptados o rechazados. La revisión aplica 51 reglas a todo el espacio de combinaciones — exhaustivamente hasta 16 causas y, por encima, con búsqueda exacta de pares más una muestra con semilla fija — e informa de conflictos, huecos de cobertura, enclavamiento y rearme, independencia de la votación, principio de disparo frente al estado de fallo de E/S, reglas de puenteo, margen de respuesta frente al tiempo de seguridad y referencias de enclavamiento del paquete del proyecto ausentes de esta matriz.",
  "pl": "Macierz przyczyn i skutków mówi, które warunki inicjujące sterują którymi elementami wykonawczymi i w jaki sposób: wyzwolenie (X), zezwolenie (P) albo tylko alarm (A). Strona przechowuje przyczyny (oznaczenia, nastawa w SI z jednostką wyświetlania, głosowanie MooN po kanałach redundantnych, opóźnienie, czas bezpieczeństwa procesu, zasady bocznikowania), skutki (oznaczenie, działanie, stan bezpieczny, stan bez zasilania, podtrzymanie i zasada kasowania, czas reakcji) oraz komórki między nimi, z możliwością nadpisania działania w komórce wyzwalającej. Scenariusz ustawia kanały, wartości lub boczniki i pokazuje stan każdego skutku wraz z pamięcią podtrzymania, w tym kasowania przyjęte i odrzucone. Weryfikacja stosuje 51 reguł do całej przestrzeni kombinacji — wyczerpująco do 16 przyczyn, powyżej przez dokładne przeszukanie par i próbkę o ustalonym ziarnie — i zgłasza konflikty, luki pokrycia, podtrzymania i kasowania, niezależność głosowania, zasadę wyzwalania wobec stanu awaryjnego we/wy, zasady bocznikowania, budżet czasu reakcji wobec czasu bezpieczeństwa procesu oraz odwołania do blokad z pakietu projektu, których ta macierz nie zawiera."
 },

 "limitations": {
  "en": "1. The review checks the internal consistency of the matrix as entered; whether a cause, setpoint, voting or safe state is adequate for the hazard comes from the hazard and risk assessment, which this tool does not perform. 2. Cause states are boolean; delays, response times and process safety times are compared as a static budget, with no time-domain simulation, and the scenario applies trips instantly. 3. Channel faults, diagnostics, degraded-voting reconfiguration, deadbands, first-out and sequential logic are not modelled. 4. Conflict detection covers opposite commands to one effect and a trip toward a non-safe state against an active permissive; both are pairwise, so detection is complete at any size, while combination counts are exact up to 16 causes and sampled above. 5. Physical exclusivity is derived only for causes voting on the same devices with disjoint setpoint intervals, or as declared by the user. 6. The IO fail-state and control-function checks run only when a project package supplying those sections has been loaded explicitly. 7. No SIL, PFD or spurious-trip-rate calculation; voting is checked for channel independence only. 8. Standards clauses are cited where their text was read; clause numbers stated against the 2003 edition of IEC 61511-1 are marked as such.",
  "uk": "1. Перевірка стосується внутрішньої узгодженості матриці в тому вигляді, як її введено; достатність причини, уставки, голосування чи безпечного стану для небезпеки визначає аналіз небезпек і ризиків, якого цей інструмент не виконує. 2. Стани причин булеві; затримки, часи реакції та час безпеки процесу порівнюються як статичний бюджет, без моделювання в часі, а сценарій застосовує спрацювання миттєво. 3. Відмови каналів, діагностика, зміна голосування при відмові, зони нечутливості, логіка першопричини та крокова логіка не моделюються. 4. Виявлення конфліктів охоплює протилежні команди одному наслідку і спрацювання в небезпечний стан проти активного дозволу; обидва — властивості пар, тож виявлення повне за будь-якого розміру, а кількості комбінацій точні до 16 причин і вибіркові понад це. 5. Фізична виключність виводиться лише для причин, що голосують на тих самих пристроях із неперетинними інтервалами уставок, або задається користувачем. 6. Перевірки стану відмови IO та функцій керування працюють лише після явного завантаження пакета проєкту з цими розділами. 7. Розрахунків SIL, PFD чи частоти хибних спрацювань немає; голосування перевіряється лише на незалежність каналів. 8. Пункти стандартів наведено там, де їх текст прочитано; номери пунктів за виданням IEC 61511-1 2003 року позначено окремо.",
  "de": "1. Geprüft wird die innere Konsistenz der Matrix, wie sie eingegeben ist; ob Ursache, Grenzwert, Votierung oder sicherer Zustand der Gefährdung angemessen sind, ergibt die Gefährdungs- und Risikobeurteilung, die dieses Werkzeug nicht durchführt. 2. Ursachenzustände sind boolesch; Verzögerungen, Stellzeiten und Prozesssicherheitszeiten werden als statisches Budget verglichen, ohne Zeitsimulation, und das Szenario wirkt sofort. 3. Kanalfehler, Diagnosen, Rückfall der Votierung, Totzonen, First-out- und Schrittlogik werden nicht modelliert. 4. Die Konflikterkennung umfasst gegensätzliche Befehle an eine Wirkung und eine Auslösung in einen nicht sicheren Zustand gegen eine aktive Freigabe; beides sind Paareigenschaften, die Erkennung ist daher bei jeder Größe vollständig, die Kombinationszahlen sind bis 16 Ursachen exakt und darüber gezogen. 5. Physische Ausschließung wird nur für Ursachen auf denselben Geräten mit disjunkten Grenzwertbereichen abgeleitet oder vom Nutzer erklärt. 6. Prüfungen gegen E/A-Fehlerzustand und Steuerungsfunktionen laufen nur nach ausdrücklichem Laden eines Projektpakets mit diesen Abschnitten. 7. Keine SIL-, PFD- oder Fehlauslöseraten-Berechnung; die Votierung wird nur auf Kanalunabhängigkeit geprüft. 8. Normklauseln werden zitiert, wo ihr Text gelesen wurde; Nummern nach der Ausgabe 2003 der IEC 61511-1 sind als solche gekennzeichnet.",
  "nl": "1. Getoetst wordt de interne consistentie van de matrix zoals ingevoerd; of een oorzaak, instelwaarde, stemming of veilige toestand toereikend is voor het gevaar volgt uit de gevaren- en risicoanalyse, die deze tool niet uitvoert. 2. Oorzaaktoestanden zijn booleaans; vertragingen, reactietijden en procesveiligheidstijden worden als statisch budget vergeleken, zonder tijdsimulatie, en het scenario laat trips direct werken. 3. Kanaalfouten, diagnose, terugval van de stemming, dode banden, first-out- en stappenlogica worden niet gemodelleerd. 4. Conflictdetectie dekt tegengestelde commando’s aan één gevolg en een trip naar een niet-veilige toestand tegen een actieve vrijgave; beide zijn eigenschappen van paren, dus de detectie is volledig bij elke omvang, terwijl combinatietellingen exact zijn tot 16 oorzaken en daarboven bemonsterd. 5. Fysieke uitsluiting wordt alleen afgeleid voor oorzaken op dezelfde apparaten met disjuncte instelintervallen, of door de gebruiker opgegeven. 6. De controles op I/O-faaltoestand en besturingsfuncties draaien alleen na expliciet laden van een projectpakket met die secties. 7. Geen SIL-, PFD- of loze-tripberekening; de stemming wordt alleen op kanaalonafhankelijkheid getoetst. 8. Normclausules worden aangehaald waar hun tekst is gelezen; nummers volgens de uitgave 2003 van IEC 61511-1 zijn als zodanig gemarkeerd.",
  "fr": "1. La revue porte sur la cohérence interne de la matrice telle que saisie ; l’adéquation d’une cause, d’un seuil, d’un vote ou d’un état sûr au danger relève de l’analyse des dangers et des risques, que cet outil ne réalise pas. 2. Les états de cause sont booléens ; temporisations, temps de réponse et temps de sécurité sont comparés comme un budget statique, sans simulation temporelle, et le scénario applique les déclenchements sans délai. 3. Défauts de canal, diagnostics, repli du vote, bandes mortes, logique premier-défaut et logique séquentielle ne sont pas modélisés. 4. La détection couvre les commandes opposées sur un effet et un déclenchement vers un état non sûr contre un permissif actif ; ces propriétés étant par paires, la détection est complète à toute taille, tandis que les décomptes sont exacts jusqu’à 16 causes et échantillonnés au-delà. 5. L’exclusivité physique n’est déduite que pour des causes votant sur les mêmes appareils avec des intervalles disjoints, ou déclarée par l’utilisateur. 6. Les contrôles sur l’état de repli des E/S et les fonctions de contrôle-commande ne s’exécutent qu’après chargement explicite d’un dossier de projet contenant ces sections. 7. Aucun calcul de SIL, de PFD ou de taux de déclenchement intempestif ; le vote n’est vérifié que sur l’indépendance des canaux. 8. Les articles de normes sont cités là où leur texte a été lu ; les numéros issus de l’édition 2003 de l’IEC 61511-1 sont signalés comme tels.",
  "es": "1. La revisión comprueba la coherencia interna de la matriz tal como se ha introducido; si una causa, punto de disparo, votación o estado seguro son adecuados para el peligro lo determina el análisis de peligros y riesgos, que esta herramienta no realiza. 2. Los estados de causa son booleanos; retardos, tiempos de respuesta y tiempos de seguridad se comparan como margen estático, sin simulación temporal, y el escenario aplica los disparos de inmediato. 3. No se modelan fallos de canal, diagnósticos, degradación de la votación, bandas muertas, lógica de primer disparo ni lógica secuencial. 4. La detección cubre órdenes opuestas a un efecto y un disparo hacia un estado no seguro frente a un permisivo activo; ambas son propiedades de pares, por lo que la detección es completa a cualquier tamaño, mientras que los recuentos son exactos hasta 16 causas y muestreados por encima. 5. La exclusión física solo se deduce para causas que votan sobre los mismos equipos con intervalos disjuntos, o se declara por el usuario. 6. Los controles del estado de fallo de E/S y de las funciones de control solo se ejecutan tras cargar explícitamente un paquete de proyecto con esas secciones. 7. Sin cálculo de SIL, PFD ni tasa de disparos espurios; la votación solo se comprueba por independencia de canales. 8. Los apartados de normas se citan donde se leyó su texto; los números de la edición 2003 de IEC 61511-1 se señalan como tales.",
  "pl": "1. Weryfikacja obejmuje wewnętrzną spójność macierzy w postaci wprowadzonej; czy przyczyna, nastawa, głosowanie lub stan bezpieczny są odpowiednie dla zagrożenia, wynika z analizy zagrożeń i ryzyka, której to narzędzie nie wykonuje. 2. Stany przyczyn są logiczne; opóźnienia, czasy reakcji i czas bezpieczeństwa procesu porównywane są jako budżet statyczny, bez symulacji w czasie, a scenariusz stosuje wyzwolenia natychmiast. 3. Awarie kanałów, diagnostyka, degradacja głosowania, strefy nieczułości, logika pierwszego zadziałania i logika krokowa nie są modelowane. 4. Wykrywanie konfliktów obejmuje przeciwne polecenia do jednego skutku oraz wyzwolenie do stanu niebezpiecznego wbrew aktywnemu zezwoleniu; obie są własnościami par, więc wykrywanie jest pełne przy każdym rozmiarze, a liczności kombinacji są dokładne do 16 przyczyn i próbkowane powyżej. 5. Fizyczne wykluczenie wyprowadza się tylko dla przyczyn głosujących na tych samych urządzeniach z rozłącznymi przedziałami nastaw albo deklaruje je użytkownik. 6. Kontrole stanu awaryjnego we/wy i funkcji sterowania działają wyłącznie po jawnym wczytaniu pakietu projektu z tymi sekcjami. 7. Brak obliczeń SIL, PFD i częstości zadziałań zbędnych; głosowanie sprawdzane jest tylko pod kątem niezależności kanałów. 8. Punkty norm przywołano tam, gdzie przeczytano ich tekst; numery według wydania IEC 61511-1 z 2003 r. są oznaczone."
 },

 "validation": {

   "en": "Method basis: IEC 61511-1:2016 10.3.2 (safety requirements: safe state per SIF, input-output logic and permissives, manual shutdown, energize or de-energize to trip, reset after shutdown, overrides and bypasses and how they are cleared, dangerous combinations of output states), 11.8.4 and 11.8.5 (maximum bypass time, compensating measures); IEC 61511-1:2003 3.2.45 (MooN over N independent channels), 11.2.7 (remain in the safe state until reset), 11.6.2 (energize-to-trip circuit integrity), 11.8.3 (operator alerted to a bypass); API RP 14C 7th edition (2001) 4.3.3 (the SAFE chart as the origin of this form); ISO 10418:2019 for context. Rules with no verified clause behind them are marked as author method in the printed sheet. No independent validation.",

   layout then handed the column 30 px and broke C1+C2@E1 over three lines.

   longest legal pair from widening the table past its pane. */

  /* ---------------------------------------------------- IO / functions */

  /* --------------------------------------------------------- the review */

    }

    E.forEach(function (e, i) { if (!has(eIdx, e.id)) eIdx[e.id] = i; });

    cells.forEach(function (x) {

    E.forEach(function (e) { if (seid[e.id]) add('CAU-R-002', e.id, epath(e) + '.id'); seid[e.id] = 1; });

    });
    var tagsSeen = [];
    E.forEach(function (e) {

      for (var i = 0; i < tagsSeen.length; i++) if (tagEq(tagsSeen[i], e.tag)) { add('CAU-R-007', e.id, epath(e) + '.tag'); break; }

    E.forEach(function (e) {

      var cs = CLASS_STATES[a.cls];

    /* combination counts */
    var cPairs = Object.keys(confPairMask).map(function (k) { return confPairMask[k]; });
    var xPairs = exclList.map(function (p) { return [p.i, p.j]; });
    var comb = { method: n <= 16 ? 'exhaustive' : 'pairwise+sampled', n: n, total: Math.pow(2, n), feasible: 0, conflicting: 0,

})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
/* Presets P1–P5 of SPEC §9. Numbers are the SI values given in brackets there.
   `tx(key)` returns the free text of a preset in the reader's language; the
   default is English. No preset carries a client identity (AGENTS §6.3). */
(function (root) {
  'use strict';
  var EN = {
    p1_title: 'Separator overpressure and low-level shutdown',
    p1_c1_comp: 'Continuous operator watch on PI-105; manual ESD HS-100 at 11.5 bar(g)',
    p1_c2_comp: 'Operator watch on LG-102 sight glass',
    p1_c3_label: 'ESD pushbutton pressed',
    p2_title: 'Blowdown isolation',
    p2_c1_label: 'flame detected',
    p2_c1_comp: 'Fire watch at compressor enclosure',
    p2_c2_comp: 'Operator watch on LG-210',
    p2_c3_label: 'start sequence ready to load',
    p3_title: 'Heater shutdown',
    p3_c2_comp: 'Local temperature gauge TI-302 read every 15 min',
    p4_title: 'Compressor suction',
    p4_c4_label: 'high level',
    p5_title: 'Wide train'
  };
  function ch(tags, dev) { return tags.map(function (t, i) { return { tag: t, device_id: (dev && dev[i]) || '' }; }); }
  function bp(p, a, max, comp) { return { permitted: p, alarm: a, max_duration_s: max, compensating_measures: comp || '' }; }
  var NOBP = function () { return bp(false, false, null, ''); };
  function an(q, op, sp, du, ref) {
    var c = { quantity: q, operator: op, setpoint_si: sp, display_unit: du };
    if (q === 'pressure') c.reference = ref || 'gauge';
    return c;
  }
  function di(label) { return { quantity: 'discrete', state: true, label: label }; }
  function cause(id, channels, cond, voting, delay, pst, bypass, extra) {
    var c = { id: id, description: '', channels: channels, condition: cond, voting: voting, delay_s: delay,
              pst_s: pst == null ? null : pst, bypass: bypass, exclusive_with: [] };
    if (extra) Object.keys(extra).forEach(function (k) { c[k] = extra[k]; });
    return c;
  }
  var A = { open: ['open', 'open'], close: ['closed', 'closed'], stop: ['stopped', 'stopped'], start: ['running', 'running'], alarm: ['none', 'n/a'] };
  function effect(id, tag, action, latching, mode, after, resp, safe, de) {
    return { id: id, tag: tag, description: '', action: action, safe_state: safe || A[action][0],
             de_energised_state: de || A[action][1], latching: latching,
             reset: { mode: mode, after_cause_cleared: after }, response_time_s: resp == null ? null : resp, line_monitoring: false };
  }
  function cells(list) {
    return list.map(function (s) {
      var m = /^(\w+):(\w+) (X|P|A)(?: (\S+))?$/.exec(s);
      return { cause_id: m[1], effect_id: m[2], type: m[3], action: m[4] || null };
    });
  }
  function base(id, title) {
    return { schema: 'causeeffect-state/1',
             matrix: { id: id, title: title, revision: 'A', system_id: '', package_id: '', convention: 'de-energise-to-trip' },
             causes: [], effects: [], cells: [], scenario: { channels: {}, bypassed: {}, latched: {} },
             analysis: { sample_count: 4096, seed: 1 } };
  }
  function build(key, tx) {
    tx = tx || function (k) { return EN[k]; };
    var s;
    if (key === 'P1') {
      s = base('CE-SEPARATOR-SHUTDOWN', tx('p1_title'));
      s.causes = [
        cause('C1', ch(['PT-101A', 'PT-101B', 'PT-101C']), an('pressure', '>', 1200000, 'bar'), '2oo3', 2, 30, bp(true, true, 28800, tx('p1_c1_comp'))),
        cause('C2', ch(['LT-102A', 'LT-102B']), an('level', '<', 0.3, 'mm'), '1oo2', 5, 60, bp(true, true, 28800, tx('p1_c2_comp'))),
        cause('C3', ch(['HS-100']), di(tx('p1_c3_label')), '1oo1', 0, null, NOBP()),
        cause('C4', ch(['TT-103']), an('temperature', '>', 358.15, '°C'), '1oo1', 0, null, NOBP())
      ];
      s.effects = [
        effect('E1', 'SDV-101', 'close', true, 'manual-remote', true, 10),
        effect('E2', 'P-101', 'stop', true, 'manual-local', true, 2),
        effect('E3', 'LV-102', 'close', false, 'auto', true, 5),
        effect('E4', 'XA-103', 'alarm', false, 'auto', true, null)
      ];
      s.cells = cells(['C1:E1 X', 'C1:E2 X', 'C2:E2 X', 'C2:E3 X', 'C3:E1 X', 'C3:E2 X', 'C3:E3 X', 'C4:E4 A']);
    } else if (key === 'P2') {
      s = base('CE-BLOWDOWN-ISOLATION', tx('p2_title'));
      s.causes = [
        cause('C1', ch(['FD-201A', 'FD-201B', 'FD-201C']), di(tx('p2_c1_label')), '2oo3', 0, null, bp(true, true, 14400, tx('p2_c1_comp'))),
        cause('C2', ch(['LT-210']), an('level', '>', 1.8, 'm'), '1oo1', 3, null, bp(true, true, 3600, tx('p2_c2_comp'))),
        cause('C3', ch(['XS-205']), di(tx('p2_c3_label')), '1oo1', 0, null, NOBP()),
        cause('C4', ch(['LT-206']), an('level', '<', 0.2, 'mm'), '1oo1', 2, null, NOBP())
      ];
      s.effects = [
        effect('E1', 'BDV-201', 'open', true, 'manual-remote', true),
        effect('E2', 'SDV-200', 'close', true, 'manual-remote', true),
        effect('E3', 'XV-205', 'close', true, 'manual-remote', true),
        effect('E4', 'K-201', 'stop', true, 'manual-local', true)
      ];
      s.cells = cells(['C1:E1 X', 'C1:E2 X', 'C1:E3 X', 'C1:E4 X', 'C2:E1 X close', 'C3:E3 X open', 'C4:E3 P', 'C4:E4 X']);
    } else if (key === 'P3') {
      s = base('CE-HEATER-SHUTDOWN', tx('p3_title'));
      s.causes = [
        cause('C1', ch(['PT-301']), an('pressure', '>', 450000, 'bar'), '1oo1', 1, null, bp(true, false, null, '')),
        cause('C2', ch(['TT-302A', 'TT-302B']), an('temperature', '>', 393.15, '°C'), '1oo2', 0, null, bp(true, true, 3600, tx('p3_c2_comp'))),
        cause('C3', ch(['FT-303']), an('volume_flow', '<', 0.0125, 'm3/h'), '1oo1', 5, null, NOBP())
      ];
      s.effects = [
        effect('E1', 'XV-301', 'close', true, null, true),
        effect('E2', 'P-301', 'stop', true, 'manual-local', false),
        effect('E3', 'HV-302', 'close', true, 'auto', true),
        effect('E4', 'FV-303', 'close', false, 'manual-remote', true),
        effect('E5', 'XA-300', 'alarm', false, 'auto', true)
      ];
      s.cells = cells(['C1:E1 X', 'C1:E2 X', 'C1:E5 A', 'C2:E2 X', 'C2:E3 X', 'C3:E2 X', 'C3:E4 X']);
    } else if (key === 'P4') {
      s = base('CE-COMPRESSOR-SUCTION', tx('p4_title'));
      s.causes = [
        cause('C1', ch(['PT-401A', 'PT-401B', 'PT-401C'], ['PT-401A', 'PT-401A', 'PT-401C']), an('pressure', '>', 2500000, 'bar'), '2oo3', 0, null, NOBP()),
        cause('C2', ch(['PT-402']), an('pressure', '<', 200000, 'bar'), '1oo1', 0, null, NOBP()),
        cause('C3', ch(['PT-402']), an('pressure', '>', 2000000, 'bar'), '1oo1', 0, null, NOBP()),
        cause('C4', ch(['LSH-403']), di(tx('p4_c4_label')), '1oo1', 0, null, NOBP())
      ];
      s.effects = [
        effect('E1', 'SDV-401', 'close', true, 'manual-remote', true, null, 'closed', 'open'),
        effect('E2', 'ESV-404', 'close', true, 'manual-remote', true),
        effect('E3', 'BV-402', 'open', true, 'manual-remote', true),
        effect('E4', 'P-405', 'stop', false, 'auto', true)
      ];
      s.cells = cells(['C1:E1 X', 'C2:E3 X close', 'C3:E3 X', 'C3:E4 P']);
    } else if (key === 'P5') {
      s = base('CE-WIDE-TRAIN', tx('p5_title'));
      for (var k = 1; k <= 16; k++) {
        var t = 'PT-5' + (k < 10 ? '0' + k : String(k));
        s.causes.push(cause('C' + k, ch([t]), an('pressure', '>', 1000000, 'bar'), '1oo1', 0, null, NOBP()));
        s.cells.push({ cause_id: 'C' + k, effect_id: 'E1', type: 'X', action: null });
      }
      s.causes.push(cause('C17', ch(['TT-517']), an('temperature', '>', 473.15, '°C'), '1oo1', 0, null, NOBP()));
      s.causes.push(cause('C18', ch(['LT-518']), an('level', '>', 2, 'm'), '1oo1', 0, null, NOBP()));
      s.effects = [
        effect('E1', 'SDV-500', 'close', true, 'manual-remote', true),
        effect('E2', 'BDV-500', 'open', true, 'manual-remote', true)
      ];
      s.cells.push({ cause_id: 'C17', effect_id: 'E2', type: 'X', action: null });
      s.cells.push({ cause_id: 'C18', effect_id: 'E2', type: 'X', action: 'close' });
    }
    return s;
  }
  root.CEPresets = { build: build, keys: ['P1', 'P2', 'P3', 'P4', 'P5'], EN: EN };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>

(function () {

  function T(en, uk, de, nl, fr, es, pl) { return { en: en, uk: uk, de: de, nl: nl, fr: fr, es: es, pl: pl }; }

      'Eine Konsistenzprüfung der Matrix, wie sie eingegeben ist. Ob eine Ursache, ein Grenzwert, eine Votierung oder ein sicherer Zustand für die Gefährdung ausreicht, entscheidet die Gefährdungs- und Risikobeurteilung.',

    footer: T('Causes are boolean: a channel is in trip when its value meets the condition (exact comparison, > excludes the setpoint). A cause is active when at least M of its channels are in trip and it is not bypassed. X commands the effect, P holds it in its safe state, A only annunciates. Conflicts are pairwise properties, so detection is complete at any size; combination counts are exhaustive up to 16 causes and sampled with mulberry32 above.',
      'Причини булеві: канал у спрацюванні, коли його значення задовольняє умову (точне порівняння, > не включає уставку). Причина активна, коли щонайменше M її каналів у спрацюванні і вона не шунтована. X дає команду наслідку, P утримує його в безпечному стані, A лише сигналізує. Конфлікти — властивість пар, тож виявлення повне за будь-якого розміру; кількість комбінацій рахується повним перебором до 16 причин і вибіркою mulberry32 понад це.',
      'Ursachen sind boolesch: Ein Kanal ist ausgelöst, wenn sein Wert die Bedingung erfüllt (exakter Vergleich, > schließt den Grenzwert aus). Eine Ursache ist aktiv, wenn mindestens M Kanäle ausgelöst sind und sie nicht überbrückt ist. X steuert die Wirkung an, P hält sie im sicheren Zustand, A meldet nur. Konflikte sind Paareigenschaften, die Erkennung ist daher bei jeder Größe vollständig; Kombinationen werden bis 16 Ursachen vollständig gezählt, darüber mit mulberry32 gezogen.',
      'Oorzaken zijn booleaans: een kanaal is in trip als zijn waarde aan de voorwaarde voldoet (exacte vergelijking, > sluit de instelwaarde uit). Een oorzaak is actief als minstens M kanalen in trip zijn en ze niet overbrugd is. X stuurt het gevolg aan, P houdt het in de veilige toestand, A meldt alleen. Conflicten zijn eigenschappen van paren, dus de detectie is volledig bij elke omvang; combinaties worden tot 16 oorzaken volledig geteld en daarboven met mulberry32 bemonsterd.',
      'Les causes sont booléennes : un canal est déclenché quand sa valeur remplit la condition (comparaison exacte, > exclut le seuil). Une cause est active quand au moins M canaux sont déclenchés et qu’elle n’est pas shuntée. X commande l’effet, P le maintient dans son état sûr, A ne fait que signaler. Les conflits sont des propriétés de paires, la détection est donc complète à toute taille ; les combinaisons sont comptées exhaustivement jusqu’à 16 causes et échantillonnées par mulberry32 au-delà.',
      'Las causas son booleanas: un canal está disparado cuando su valor cumple la condición (comparación exacta, > excluye el punto de disparo). Una causa está activa cuando al menos M canales están disparados y no está puenteada. X ordena el efecto, P lo retiene en su estado seguro, A solo señaliza. Los conflictos son propiedades de pares, por lo que la detección es completa a cualquier tamaño; las combinaciones se cuentan exhaustivamente hasta 16 causas y se muestrean con mulberry32 por encima.',

    learnIntroB: T('Rows are causes (initiating conditions), columns are effects (final elements). Each cell says how a cause acts on an effect. Set cause states in the scenario to see what every effect does; the review searches all cause combinations for disagreements and lists gaps in coverage, latch and reset, voting, convention and bypass.',

      'Rijen zijn oorzaken (initiërende condities), kolommen zijn gevolgen (eindelementen). Elke cel zegt hoe een oorzaak op een gevolg werkt. Zet oorzaken in het scenario om te zien wat elk gevolg doet; de toets doorzoekt alle combinaties op tegenstrijdigheden en noemt hiaten in dekking, vergrendeling en reset, stemming, principe en overbrugging.',

      'Las filas son causas (condiciones iniciadoras), las columnas efectos (elementos finales). Cada celda dice cómo actúa una causa sobre un efecto. Fije causas en el escenario para ver qué hace cada efecto; la revisión busca desacuerdos en todas las combinaciones y lista huecos de cobertura, enclavamiento y rearme, votación, principio y puenteo.',
      'Wiersze to przyczyny (warunki inicjujące), kolumny to skutki (elementy wykonawcze). Każda komórka mówi, jak przyczyna działa na skutek. Ustaw przyczyny w scenariuszu, aby zobaczyć, co robi każdy skutek; weryfikacja przeszukuje wszystkie kombinacje pod kątem sprzeczności i wymienia luki w pokryciu, podtrzymaniu i kasowaniu, głosowaniu, zasadzie działania i bocznikowaniu.'),

    learnCellsB: T('X: the active cause commands the effect (its action, or the override on the cell). P: the active cause keeps the effect from being released from its safe state and commands nothing. A: the active cause only annunciates on that effect. Click a cell to cycle blank → X → P → A; right-click, long-press or key o sets an override action.',
      'X: активна причина дає команду наслідку (його дію або перевизначення в клітинці). P: активна причина не дає вивести наслідок із безпечного стану і нічого не командує. A: активна причина лише сигналізує на цьому наслідку. Натискання циклічно змінює порожньо → X → P → A; права кнопка, довге натискання або клавіша o задає перевизначену дію.',
      'X: die aktive Ursache steuert die Wirkung an (ihre Aktion oder die Übersteuerung der Zelle). P: die aktive Ursache verhindert, dass die Wirkung ihren sicheren Zustand verlässt, und steuert nichts an. A: die aktive Ursache meldet nur. Ein Klick schaltet leer → X → P → A; Rechtsklick, langes Drücken oder Taste o setzt eine abweichende Aktion.',

      'X : la cause active commande l’effet (son action, ou celle forcée dans la case). P : la cause active empêche l’effet de quitter son état sûr et ne commande rien. A : la cause active ne fait que signaler. Un clic fait défiler vide → X → P → A ; clic droit, appui long ou touche o fixe une action forcée.',

    learnVotingT: T('Voting MooN', 'Голосування MooN', 'Votierung MooN', 'Stemming MooN', 'Vote MooN', 'Votación MooN', 'Głosowanie MooN'),

      'Причина спрацьовує, коли M з N її каналів у спрацюванні: 1oo1, 1oo2, 2oo2, 2oo3. IEC 61511-1 визначає MooN для N незалежних каналів, тож два канали від одного перетворювача (однаковий ідентифікатор пристрою) рахуються як один і позначаються.',
      'Eine Ursache löst aus, wenn M ihrer N Kanäle ausgelöst sind: 1oo1, 1oo2, 2oo2, 2oo3. IEC 61511-1 definiert MooN über N unabhängige Kanäle; zwei Kanäle eines Messumformers (gleiche Geräte-ID) zählen als einer und werden gemeldet.',
      'Een oorzaak tript als M van haar N kanalen in trip zijn: 1oo1, 1oo2, 2oo2, 2oo3. IEC 61511-1 definieert MooN over N onafhankelijke kanalen, dus twee kanalen van één transmitter (zelfde apparaat-id) tellen als één en worden gemeld.',
      'Une cause déclenche quand M de ses N canaux sont déclenchés : 1oo1, 1oo2, 2oo2, 2oo3. L’IEC 61511-1 définit MooN sur N canaux indépendants ; deux canaux d’un même transmetteur (même identifiant d’appareil) comptent pour un et sont signalés.',
      'Una causa dispara cuando M de sus N canales están disparados: 1oo1, 1oo2, 2oo2, 2oo3. IEC 61511-1 define MooN sobre N canales independientes; dos canales de un mismo transmisor (mismo id de equipo) cuentan como uno y se señalan.',
      'Przyczyna zadziała, gdy M z jej N kanałów zadziałało: 1oo1, 1oo2, 2oo2, 2oo3. IEC 61511-1 definiuje MooN dla N niezależnych kanałów, więc dwa kanały z jednego przetwornika (ten sam identyfikator urządzenia) liczą się jako jeden i są zgłaszane.'),
    learnLatchT: T('Latch and reset', 'Фіксація і скидання', 'Selbsthaltung und Rücksetzen', 'Vergrendeling en reset', 'Verrouillage et réarmement', 'Enclavamiento y rearme', 'Podtrzymanie i kasowanie'),
    learnLatchB: T('A latching effect keeps its commanded state after the cause clears, until a reset is accepted: the mode and location must match, and with “after cause cleared” no trip cause of that effect may be active. A reset accepted while a cause is active re-latches at once.',
      'Наслідок із фіксацією зберігає заданий стан після зникнення причини, доки скидання не буде прийнято: режим і місце мають збігатися, а з умовою «після зникнення причини» жодна причина спрацювання цього наслідку не може бути активною. Скидання, прийняте за активної причини, одразу фіксується знову.',
      'Eine selbsthaltende Wirkung behält den angesteuerten Zustand nach dem Wegfall der Ursache, bis ein Rücksetzen angenommen wird: Art und Ort müssen passen, und mit „nach Wegfall der Ursache“ darf keine auslösende Ursache aktiv sein. Ein Rücksetzen bei aktiver Ursache hält sofort wieder.',
      'Een vergrendelend gevolg houdt de aangestuurde toestand vast nadat de oorzaak verdwijnt, tot een reset wordt aanvaard: soort en plaats moeten kloppen, en met “na wegvallen oorzaak” mag geen trippende oorzaak actief zijn. Een reset bij actieve oorzaak vergrendelt direct opnieuw.',
      'Un effet verrouillé garde l’état commandé après la disparition de la cause, jusqu’à ce qu’un réarmement soit accepté : mode et lieu doivent correspondre et, avec « après disparition de la cause », aucune cause de déclenchement ne doit être active. Un réarmement accepté cause active se reverrouille aussitôt.',
      'Un efecto enclavado conserva el estado ordenado tras desaparecer la causa, hasta que se acepta un rearme: modo y lugar deben coincidir y, con «tras desaparecer la causa», ninguna causa de disparo puede estar activa. Un rearme aceptado con causa activa se vuelve a enclavar en el acto.',
      'Skutek z podtrzymaniem zachowuje wysterowany stan po ustąpieniu przyczyny, aż kasowanie zostanie przyjęte: tryb i miejsce muszą się zgadzać, a przy „po ustąpieniu przyczyny” żadna przyczyna wyzwalająca nie może być aktywna. Kasowanie przyjęte przy aktywnej przyczynie natychmiast podtrzymuje się ponownie.'),
    learnExclT: T('Exclusive causes', 'Взаємовиключні причини', 'Sich ausschließende Ursachen', 'Elkaar uitsluitende oorzaken', 'Causes exclusives', 'Causas excluyentes', 'Przyczyny wzajemnie wykluczające się'),
    learnExclB: T('Two causes that cannot be active together are excluded from the combination count. The tool derives this only for causes voting on the same devices with disjoint trip intervals (e.g. < 2 bar and > 20 bar on PT-402), or for two single-channel switches of one device in opposite states; any other exclusivity you declare yourself.',
      'Дві причини, що не можуть бути активними разом, виключаються з підрахунку комбінацій. Інструмент виводить це лише для причин, що голосують на тих самих пристроях із неперетинними інтервалами спрацювання (напр. < 2 бар і > 20 бар на PT-402), або для двох одноканальних перемикачів одного пристрою з протилежними станами; будь-яку іншу виключність ви задаєте самі.',
      'Zwei Ursachen, die nicht zugleich aktiv sein können, werden aus der Kombinationszählung genommen. Das Werkzeug leitet das nur für Ursachen auf denselben Geräten mit disjunkten Auslösebereichen ab (z. B. < 2 bar und > 20 bar an PT-402) oder für zwei einkanalige Schalter eines Geräts mit entgegengesetztem Zustand; jede andere Ausschließung erklären Sie selbst.',
      'Twee oorzaken die niet tegelijk actief kunnen zijn, vallen buiten de telling. De tool leidt dit alleen af voor oorzaken op dezelfde apparaten met disjuncte tripintervallen (bv. < 2 bar en > 20 bar op PT-402), of voor twee enkelkanaals schakelaars van één apparaat met tegengestelde toestand; elke andere uitsluiting geeft u zelf op.',
      'Deux causes qui ne peuvent être actives ensemble sont exclues du décompte. L’outil ne le déduit que pour des causes votant sur les mêmes appareils avec des intervalles de déclenchement disjoints (p. ex. < 2 bar et > 20 bar sur PT-402), ou pour deux contacts monocanal d’un même appareil en états opposés ; toute autre exclusivité se déclare à la main.',
      'Dos causas que no pueden estar activas a la vez quedan fuera del recuento. La herramienta solo lo deduce para causas que votan sobre los mismos equipos con intervalos de disparo disjuntos (p. ej. < 2 bar y > 20 bar en PT-402), o para dos interruptores monocanal de un mismo equipo en estados opuestos; cualquier otra exclusión la declara usted.',
      'Dwie przyczyny, które nie mogą być aktywne jednocześnie, są wyłączane z liczenia kombinacji. Narzędzie wyprowadza to tylko dla przyczyn głosujących na tych samych urządzeniach z rozłącznymi przedziałami zadziałania (np. < 2 bar i > 20 bar na PT-402) lub dla dwóch jednokanałowych łączników jednego urządzenia w przeciwnych stanach; każde inne wykluczenie deklaruje się ręcznie.'),
    learnConvT: T('De-energise or energise to trip', 'Спрацювання зі зняттям або подачею живлення', 'Ruhestrom- oder Arbeitsstromprinzip', 'Ruststroom- of arbeidsstroomprincipe', 'Déclenchement par manque ou par émission', 'Disparo por desenergización o energización', 'Wyzwolenie przez odwzbudzenie lub wzbudzenie'),
    learnConvB: T('Under de-energise-to-trip the final element must reach its safe state when its output loses power, so the de-energised state should equal the safe state. Under energise-to-trip the circuit needs integrity monitoring (IEC 61511-1:2003 11.6.2). With an IO list loaded, the IO fail state is compared as well.',
      'За принципу спрацювання зі зняттям живлення виконавчий елемент має переходити в безпечний стан при втраті живлення виходу, тож стан без живлення має збігатися з безпечним. За спрацювання з подачею живлення коло потребує контролю цілісності (IEC 61511-1:2003 11.6.2). Із завантаженим переліком IO порівнюється і стан відмови IO.',
      'Beim Ruhestromprinzip muss das Stellglied bei Spannungsverlust seinen sicheren Zustand erreichen; der spannungslose Zustand sollte daher der sichere sein. Beim Arbeitsstromprinzip braucht der Kreis eine Leitungsüberwachung (IEC 61511-1:2003 11.6.2). Mit geladener E/A-Liste wird auch der Fehlerzustand des Signals verglichen.',
      'Bij het ruststroomprincipe moet het eindelement bij spanningsverlies zijn veilige toestand bereiken, dus de spanningsloze toestand hoort de veilige te zijn. Bij het arbeidsstroomprincipe heeft de kring lijnbewaking nodig (IEC 61511-1:2003 11.6.2). Met een geladen I/O-lijst wordt ook de faaltoestand van het signaal vergeleken.',
      'En déclenchement par manque de tension, l’organe final doit rejoindre son état sûr quand sa sortie perd l’alimentation ; l’état désexcité doit donc être l’état sûr. En déclenchement par émission, le circuit exige une surveillance de ligne (IEC 61511-1:2003 11.6.2). Avec une liste d’E/S chargée, l’état de repli du signal est aussi comparé.',
      'Con disparo por desenergización, el elemento final debe alcanzar su estado seguro al perder la alimentación su salida; el estado desenergizado debe ser el seguro. Con disparo por energización, el circuito necesita supervisión de línea (IEC 61511-1:2003 11.6.2). Con una lista de E/S cargada se compara también el estado de fallo de la señal.',
      'Przy wyzwalaniu przez odwzbudzenie element wykonawczy musi osiągnąć stan bezpieczny po utracie zasilania wyjścia, więc stan bez zasilania powinien być stanem bezpiecznym. Przy wyzwalaniu przez wzbudzenie obwód wymaga monitorowania ciągłości (IEC 61511-1:2003 11.6.2). Po wczytaniu listy we/wy porównywany jest też stan awaryjny sygnału.'),

    crit_method: T('stated for the reader', 'наведено для читача', 'zur Information', 'ter informatie', 'pour information', 'a título informativo', 'dla informacji'),
    mnCells: T('X: an active cause commands the effect to the state of its action (or the cell override). P: an active cause keeps the effect in its safe state and commands nothing. A: an active cause annunciates only.', 'X: активна причина переводить наслідок у стан його дії (або перевизначення клітинки). P: активна причина утримує наслідок у безпечному стані й нічого не командує. A: активна причина лише сигналізує.', 'X: eine aktive Ursache steuert die Wirkung in den Zustand ihrer Aktion (oder der Zellübersteuerung). P: eine aktive Ursache hält die Wirkung im sicheren Zustand und steuert nichts an. A: eine aktive Ursache meldet nur.', 'X: een actieve oorzaak stuurt het gevolg naar de toestand van zijn actie (of de celafwijking). P: een actieve oorzaak houdt het gevolg in de veilige toestand en stuurt niets aan. A: een actieve oorzaak meldt alleen.', 'X : une cause active commande l’effet vers l’état de son action (ou de la case forcée). P : une cause active maintient l’effet dans son état sûr sans rien commander. A : une cause active signale seulement.', 'X: una causa activa lleva el efecto al estado de su acción (o de la celda forzada). P: una causa activa retiene el efecto en su estado seguro sin ordenar nada. A: una causa activa solo señaliza.', 'X: aktywna przyczyna steruje skutek do stanu jego działania (lub nadpisania w komórce). P: aktywna przyczyna utrzymuje skutek w stanie bezpiecznym i niczym nie steruje. A: aktywna przyczyna tylko sygnalizuje.'),
    mnLatch: T('A reset from location L is accepted only if the effect latches and is latched, its manual mode matches L, and, with “after cause cleared”, no trip cause of it is active; an accepted reset with a cause active re-latches at once.', 'Скидання з місця L приймається, лише якщо наслідок фіксується і зафіксований, його ручний режим відповідає L, а з умовою «після зникнення причини» жодна його причина спрацювання не активна; скидання, прийняте за активної причини, одразу фіксується знову.', 'Ein Rücksetzen vom Ort L wird nur angenommen, wenn die Wirkung selbsthaltend ist und hält, ihre Handrücksetzung zu L passt und bei „nach Wegfall der Ursache“ keine auslösende Ursache aktiv ist; ein angenommenes Rücksetzen bei aktiver Ursache hält sofort wieder.', 'Een reset vanaf plaats L wordt alleen aanvaard als het gevolg vergrendelt en vergrendeld is, de handmatige soort bij L past en, met “na wegvallen oorzaak”, geen trippende oorzaak actief is; een aanvaarde reset bij actieve oorzaak vergrendelt direct opnieuw.', 'Un réarmement depuis le lieu L n’est accepté que si l’effet est verrouillable et verrouillé, que son mode manuel correspond à L et, avec « après disparition de la cause », qu’aucune cause de déclenchement n’est active ; un réarmement accepté cause active se reverrouille aussitôt.', 'Un rearme desde el lugar L solo se acepta si el efecto es enclavable y está enclavado, su modo manual coincide con L y, con «tras desaparecer la causa», ninguna causa de disparo está activa; un rearme aceptado con causa activa se vuelve a enclavar en el acto.', 'Kasowanie z miejsca L jest przyjmowane tylko wtedy, gdy skutek ma podtrzymanie i jest podtrzymany, jego tryb ręczny odpowiada L, a przy „po ustąpieniu przyczyny” żadna przyczyna wyzwalająca nie jest aktywna; kasowanie przyjęte przy aktywnej przyczynie natychmiast podtrzymuje się ponownie.'),
    mnExcl: T('Exclusivity is derived (author method) for two analog causes of one quantity on the same device-key set with the same N, disjoint trip intervals and M_i + M_j > N, or for two single-channel switches of one device in opposite states; declared exclusivity is taken as stated.', 'Виключність виводиться (метод автора) для двох аналогових причин однієї величини на тому самому наборі пристроїв з однаковим N, неперетинними інтервалами і M_i + M_j > N, або для двох одноканальних перемикачів одного пристрою в протилежних станах; задекларовану виключність прийнято як задано.', 'Ausschließung wird (Autorenmethode) abgeleitet für zwei analoge Ursachen derselben Größe auf derselben Gerätemenge mit gleichem N, disjunkten Auslösebereichen und M_i + M_j > N, oder für zwei einkanalige Schalter eines Geräts mit entgegengesetztem Zustand; erklärte Ausschließung gilt wie angegeben.', 'Uitsluiting wordt afgeleid (auteursmethode) voor twee analoge oorzaken van één grootheid op dezelfde apparatenset met gelijke N, disjuncte tripintervallen en M_i + M_j > N, of voor twee enkelkanaals schakelaars van één apparaat met tegengestelde toestand; opgegeven uitsluiting geldt zoals opgegeven.', 'L’exclusivité est déduite (méthode de l’auteur) pour deux causes analogiques d’une même grandeur sur le même ensemble d’appareils, même N, intervalles disjoints et M_i + M_j > N, ou pour deux contacts monocanal d’un même appareil en états opposés ; l’exclusivité déclarée est prise telle quelle.', 'La exclusión se deduce (método del autor) para dos causas analógicas de una misma magnitud sobre el mismo conjunto de equipos con igual N, intervalos disjuntos y M_i + M_j > N, o para dos interruptores monocanal de un equipo en estados opuestos; la exclusión declarada se toma tal cual.', 'Wykluczenie wyprowadza się (metoda autora) dla dwóch przyczyn analogowych jednej wielkości na tym samym zbiorze urządzeń z tym samym N, rozłącznymi przedziałami i M_i + M_j > N lub dla dwóch jednokanałowych łączników jednego urządzenia w przeciwnych stanach; wykluczenie zadeklarowane przyjmuje się tak, jak podano.'),
    mnPairs: T('Each cell belongs to one cause, so a set of active causes conflicts exactly when it contains both causes of a conflicting pair; the pair search is therefore complete for any number of causes, and enumeration only supplies the counts.', 'Кожна клітинка належить одній причині, тож набір активних причин конфліктує саме тоді, коли містить обидві причини конфліктної пари; тому пошук пар повний за будь-якої кількості причин, а перебір дає лише кількості.', 'Jede Zelle gehört zu einer Ursache; eine Menge aktiver Ursachen ist genau dann im Konflikt, wenn sie beide Ursachen eines Konfliktpaars enthält. Die Paarsuche ist daher bei jeder Anzahl vollständig, die Aufzählung liefert nur die Anzahlen.', 'Elke cel hoort bij één oorzaak, dus een set actieve oorzaken is precies in conflict als ze beide oorzaken van een conflictpaar bevat; het zoeken naar paren is daarom volledig bij elk aantal, de opsomming levert alleen de aantallen.', 'Chaque case appartient à une cause ; un ensemble de causes actives est en conflit exactement s’il contient les deux causes d’une paire conflictuelle. La recherche par paires est donc complète quel que soit le nombre de causes ; l’énumération ne fournit que les décomptes.', 'Cada celda pertenece a una causa, así que un conjunto de causas activas está en conflicto exactamente si contiene ambas causas de un par conflictivo; la búsqueda por pares es completa para cualquier número de causas y la enumeración solo aporta los recuentos.', 'Każda komórka należy do jednej przyczyny, więc zbiór aktywnych przyczyn jest w konflikcie dokładnie wtedy, gdy zawiera obie przyczyny pary konfliktowej; wyszukiwanie par jest pełne dla dowolnej liczby przyczyn, a wyliczanie daje tylko liczności.'),
    mnTime: T('Response budget (author method, a screening simplification): cause delay plus the largest stated response time of its trip effects, compared with the process safety time; logic-solver scan time and sensor lag are not included.', 'Бюджет реакції (метод автора, спрощення для відбору): затримка причини плюс найбільший заданий час реакції її наслідків спрацювання порівняно з часом безпеки процесу; час циклу логічного контролера і запізнення датчика не враховано.', 'Reaktionsbudget (Autorenmethode, Vereinfachung zur Vorprüfung): Verzögerung der Ursache plus größte angegebene Stellzeit ihrer auslösenden Wirkungen, verglichen mit der Prozesssicherheitszeit; Zykluszeit der Logik und Sensorverzug sind nicht enthalten.', 'Reactiebudget (auteursmethode, vereenvoudiging voor screening): vertraging van de oorzaak plus de grootste opgegeven reactietijd van haar trippende gevolgen, vergeleken met de procesveiligheidstijd; cyclustijd van de logica en sensorvertraging zijn niet meegenomen.', 'Budget de réponse (méthode de l’auteur, simplification de tri) : temporisation de la cause plus le plus grand temps de réponse indiqué de ses effets de déclenchement, comparé au temps de sécurité du procédé ; temps de cycle de l’automate et retard des capteurs non inclus.', 'Margen de respuesta (método del autor, simplificación de cribado): retardo de la causa más el mayor tiempo de respuesta indicado de sus efectos de disparo, frente al tiempo de seguridad del proceso; no incluye el tiempo de ciclo del sistema lógico ni el retraso del sensor.', 'Budżet reakcji (metoda autora, uproszczenie przesiewowe): opóźnienie przyczyny plus największy podany czas reakcji jej skutków wyzwalających, porównany z czasem bezpieczeństwa procesu; czas cyklu sterownika i opóźnienie czujnika nie są uwzględnione.'),

    'r_CAU-R-005': T('Enter the transmitter or switch tag for channel {target}.', 'Уведіть позицію перетворювача або перемикача для каналу {target}.', 'Tragen Sie das Kennzeichen des Messumformers oder Schalters für Kanal {target} ein.', 'Vul de tag van de transmitter of schakelaar in voor kanaal {target}.', 'Saisissez le repère du transmetteur ou du contact pour le canal {target}.', 'Introduzca el tag del transmisor o interruptor del canal {target}.', 'Wpisz oznaczenie przetwornika lub łącznika dla kanału {target}.'),
    't_CAU-R-006': T('Trip point missing', 'Уставка відсутня', 'Grenzwert fehlt', 'Instelwaarde ontbreekt', 'Seuil manquant', 'Punto de disparo ausente', 'Brak nastawy'),
    'm_CAU-R-006': T('Cause {target} has no finite setpoint or no comparison operator.', 'Причина {target} не має скінченної уставки або оператора порівняння.', 'Ursache {target} hat keinen endlichen Grenzwert oder keinen Vergleichsoperator.', 'Oorzaak {target} heeft geen eindige instelwaarde of geen vergelijkingsoperator.', 'La cause {target} n’a pas de seuil fini ou pas d’opérateur de comparaison.', 'La causa {target} no tiene un punto de disparo finito ni operador de comparación.', 'Przyczyna {target} nie ma skończonej nastawy lub operatora porównania.'),
    'r_CAU-R-006': T('State the setpoint and the operator of {target}; the safety requirements specify trip points.', 'Задайте уставку й оператор для {target}; вимоги безпеки визначають уставки спрацювання.', 'Geben Sie Grenzwert und Operator für {target} an; die Sicherheitsanforderungen legen Auslösepunkte fest.', 'Geef instelwaarde en operator van {target}; de veiligheidseisen leggen tripwaarden vast.', 'Indiquez le seuil et l’opérateur de {target} ; les exigences de sécurité fixent les points de déclenchement.', 'Indique el punto de disparo y el operador de {target}; los requisitos de seguridad fijan los puntos de disparo.', 'Podaj nastawę i operator dla {target}; wymagania bezpieczeństwa określają punkty zadziałania.'),
    't_CAU-R-007': T('Effect tag missing or repeated', 'Позиція наслідку відсутня або повторена', 'Kennzeichen der Wirkung fehlt oder doppelt', 'Tag van het gevolg ontbreekt of herhaalt', 'Repère d’effet manquant ou répété', 'Tag de efecto ausente o repetido', 'Brak lub powtórzone oznaczenie skutku'),
    'm_CAU-R-007': T('Effect {target} has an empty tag or repeats the tag of another effect.', 'Наслідок {target} має порожню позицію або повторює позицію іншого наслідку.', 'Wirkung {target} hat ein leeres Kennzeichen oder wiederholt das einer anderen Wirkung.', 'Gevolg {target} heeft een lege tag of herhaalt de tag van een ander gevolg.', 'L’effet {target} a un repère vide ou répète celui d’un autre effet.', 'El efecto {target} tiene el tag vacío o repite el de otro efecto.', 'Skutek {target} ma puste oznaczenie lub powtarza oznaczenie innego skutku.'),
    'r_CAU-R-007': T('Give effect {target} the tag of its own final element.', 'Надайте наслідку {target} позицію його власного виконавчого елемента.', 'Geben Sie der Wirkung {target} das Kennzeichen ihres eigenen Stellglieds.', 'Geef gevolg {target} de tag van zijn eigen eindelement.', 'Donnez à l’effet {target} le repère de son propre organe final.', 'Dé al efecto {target} el tag de su propio elemento final.', 'Nadaj skutkowi {target} oznaczenie jego własnego elementu wykonawczego.'),
    't_CAU-R-008': T('State outside the action class', 'Стан поза класом дії', 'Zustand außerhalb der Aktionsklasse', 'Toestand buiten de actieklasse', 'État hors classe d’action', 'Estado fuera de la clase de acción', 'Stan poza klasą działania'),
    'm_CAU-R-008': T('Effect {target}: a safe or de-energised state does not belong to the class of action {action}.', 'Наслідок {target}: безпечний стан або стан без живлення не належить до класу дії {action}.', 'Wirkung {target}: ein sicherer oder spannungsloser Zustand gehört nicht zur Klasse der Aktion {action}.', 'Gevolg {target}: een veilige of spanningsloze toestand hoort niet bij de klasse van actie {action}.', 'Effet {target} : un état sûr ou désexcité n’appartient pas à la classe de l’action {action}.', 'Efecto {target}: un estado seguro o desenergizado no pertenece a la clase de la acción {action}.', 'Skutek {target}: stan bezpieczny lub bez zasilania nie należy do klasy działania {action}.'),
    'r_CAU-R-008': T('Choose states of {target} from its own class: a valve is open or closed, a motor runs or stands, a circuit is energised or de-energised.', 'Виберіть стани {target} з його класу: клапан відкритий або закритий, двигун працює або зупинений, коло під живленням або без нього.', 'Wählen Sie Zustände von {target} aus seiner Klasse: Ventil offen oder geschlossen, Motor läuft oder steht, Kreis erregt oder spannungslos.', 'Kies toestanden van {target} uit zijn eigen klasse: klep open of dicht, motor draait of staat stil, kring bekrachtigd of spanningsloos.', 'Choisissez des états de {target} dans sa classe : vanne ouverte ou fermée, moteur en marche ou arrêté, circuit excité ou désexcité.', 'Elija estados de {target} de su clase: válvula abierta o cerrada, motor en marcha o parado, circuito energizado o desenergizado.', 'Wybierz stany {target} z jego klasy: zawór otwarty lub zamknięty, silnik pracuje lub stoi, obwód zasilony lub bez zasilania.'),
    't_CAU-R-009': T('Cell action of another class', 'Дія клітинки іншого класу', 'Zellaktion einer anderen Klasse', 'Celactie van een andere klasse', 'Action de case d’une autre classe', 'Acción de celda de otra clase', 'Działanie komórki z innej klasy'),
    'm_CAU-R-009': T('Cell {target} overrides the action with one from another class than the effect.', 'Клітинка {target} перевизначає дію дією з іншого класу, ніж наслідок.', 'Zelle {target} übersteuert die Aktion mit einer anderen Klasse als die Wirkung.', 'Cel {target} overschrijft de actie met een andere klasse dan het gevolg.', 'La case {target} force une action d’une autre classe que l’effet.', 'La celda {target} fuerza una acción de otra clase que el efecto.', 'Komórka {target} nadpisuje działanie z innej klasy niż skutek.'),
    'r_CAU-R-009': T('Set the override of {target} to an action of the effect’s own class, or clear it.', 'Установіть у {target} дію класу самого наслідку або приберіть перевизначення.', 'Setzen Sie die Übersteuerung von {target} auf eine Aktion der eigenen Klasse oder löschen Sie sie.', 'Zet de afwijking van {target} op een actie uit de eigen klasse of verwijder ze.', 'Choisissez pour {target} une action de la classe de l’effet, ou supprimez le forçage.', 'Fije en {target} una acción de la clase del efecto, o quite el forzado.', 'Ustaw w {target} działanie z klasy skutku albo usuń nadpisanie.'),
    't_CAU-R-010': T('Opposite commands to one effect', 'Протилежні команди одному наслідку', 'Gegensätzliche Befehle an eine Wirkung', 'Tegengestelde commando’s aan één gevolg', 'Commandes opposées sur un effet', 'Órdenes opuestas a un efecto', 'Przeciwne polecenia do jednego skutku'),
    'm_CAU-R-010': T('{i} and {j} can be active together and command {effect} to {a} and {b}.', '{i} і {j} можуть бути активними разом і командують {effect} у стани {a} і {b}.', '{i} und {j} können zugleich aktiv sein und steuern {effect} auf {a} und {b}.', '{i} en {j} kunnen tegelijk actief zijn en sturen {effect} naar {a} en {b}.', '{i} et {j} peuvent être actives ensemble et commandent {effect} vers {a} et {b}.', '{i} y {j} pueden estar activas a la vez y ordenan {effect} a {a} y {b}.', '{i} i {j} mogą być aktywne jednocześnie i sterują {effect} do stanów {a} oraz {b}.'),
    'r_CAU-R-010': T('On {effect}, remove or re-aim one of the two trip cells of {i} and {j}, or declare the two causes exclusive when the process makes them so.', 'Для {effect} приберіть або змініть одну з двох клітинок спрацювання {i} та {j}, або оголосіть ці причини взаємовиключними, якщо так диктує процес.', 'Entfernen oder ändern Sie bei {effect} eine der beiden Auslösezellen von {i} und {j}, oder erklären Sie die Ursachen als sich ausschließend, wenn der Prozess das hergibt.', 'Verwijder of wijzig bij {effect} een van de twee tripcellen van {i} en {j}, of geef de oorzaken als elkaar uitsluitend op als het proces dat zo maakt.', 'Sur {effect}, supprimez ou modifiez l’une des deux cases de déclenchement de {i} et {j}, ou déclarez les deux causes exclusives si le procédé l’impose.', 'En {effect}, quite o cambie una de las dos celdas de disparo de {i} y {j}, o declare ambas causas excluyentes si el proceso lo impone.', 'Dla {effect} usuń lub zmień jedną z dwóch komórek wyzwolenia {i} i {j} albo zadeklaruj przyczyny jako wykluczające się, jeśli tak wynika z procesu.'),
    't_CAU-R-011': T('Trip against an active permissive', 'Спрацювання проти активного дозволу', 'Auslösung gegen aktive Freigabe', 'Trip tegen actieve vrijgave', 'Déclenchement contre un permissif actif', 'Disparo contra un permisivo activo', 'Wyzwolenie wbrew aktywnemu zezwoleniu'),
    'm_CAU-R-011': T('{i} trips {effect} to {a} while the permissive of {j} holds it in its safe state.', '{i} переводить {effect} у {a}, тоді як дозвіл {j} утримує його в безпечному стані.', '{i} steuert {effect} auf {a}, während die Freigabe von {j} sie im sicheren Zustand hält.', '{i} stuurt {effect} naar {a} terwijl de vrijgave van {j} het in de veilige toestand houdt.', '{i} commande {effect} vers {a} alors que le permissif de {j} le maintient dans son état sûr.', '{i} lleva {effect} a {a} mientras el permisivo de {j} lo retiene en su estado seguro.', '{i} steruje {effect} do {a}, podczas gdy zezwolenie {j} utrzymuje go w stanie bezpiecznym.'),
    'r_CAU-R-011': T('Decide what {effect} does when both hold: command it to its safe state from {i}, or drop the permissive of {j}.', 'Вирішіть, що робить {effect}, коли діють обидві: командуйте його в безпечний стан від {i} або приберіть дозвіл {j}.', 'Entscheiden Sie, was {effect} tut, wenn beides gilt: Ansteuerung von {i} in den sicheren Zustand oder Freigabe von {j} entfernen.', 'Bepaal wat {effect} doet als beide gelden: stuur het vanuit {i} naar de veilige toestand of laat de vrijgave van {j} vervallen.', 'Décidez ce que fait {effect} quand les deux tiennent : commandez-le vers son état sûr depuis {i}, ou retirez le permissif de {j}.', 'Decida qué hace {effect} cuando ambos se dan: ordénelo a su estado seguro desde {i}, o retire el permisivo de {j}.', 'Zdecyduj, co robi {effect}, gdy zachodzą oba: steruj go do stanu bezpiecznego z {i} albo usuń zezwolenie {j}.'),
    't_CAU-R-012': T('Conflict excluded by exclusivity', 'Конфлікт виключено взаємовиключністю', 'Konflikt durch Ausschließung entschärft', 'Conflict uitgesloten door uitsluiting', 'Conflit écarté par exclusivité', 'Conflicto excluido por exclusividad', 'Konflikt wykluczony przez wykluczenie'),
    'm_CAU-R-012': T('{i} and {j} disagree on {effect}, and are recorded as never active together, so no combination counts it.', '{i} і {j} суперечать на {effect}, але записані як такі, що ніколи не активні разом, тож комбінації це не враховують.', '{i} und {j} widersprechen sich an {effect}, gelten aber als nie zugleich aktiv, daher zählt keine Kombination.', '{i} en {j} spreken elkaar tegen op {effect}, maar gelden als nooit tegelijk actief, dus geen combinatie telt mee.', '{i} et {j} se contredisent sur {effect} mais ne sont jamais actives ensemble : aucune combinaison ne le compte.', '{i} y {j} discrepan en {effect}, pero constan como nunca activas a la vez, así que ninguna combinación lo cuenta.', '{i} i {j} są sprzeczne na {effect}, lecz zapisano je jako nigdy nieaktywne razem, więc żadna kombinacja tego nie liczy.'),
    't_CAU-R-013': T('Time or duration not valid', 'Некоректний час або тривалість', 'Zeit oder Dauer ungültig', 'Tijd of duur ongeldig', 'Temps ou durée invalide', 'Tiempo o duración no válidos', 'Nieprawidłowy czas lub trwanie'),
    'm_CAU-R-013': T('{target}: a delay, response time or bypass duration is negative, not positive where it must be, or not a number.', '{target}: затримка, час реакції або тривалість шунтування від’ємні, не додатні там, де мають бути, або не є числом.', '{target}: eine Verzögerung, Stellzeit oder Überbrückungsdauer ist negativ, nicht positiv, wo sie es sein muss, oder keine Zahl.', '{target}: een vertraging, reactietijd of overbruggingsduur is negatief, niet positief waar dat moet, of geen getal.', '{target} : une temporisation, un temps de réponse ou une durée de shunt est négatif, non positif là où il le faut, ou n’est pas un nombre.', '{target}: un retardo, tiempo de respuesta o duración de puenteo es negativo, no positivo donde debe serlo, o no es un número.', '{target}: opóźnienie, czas reakcji lub czas bocznikowania jest ujemny, niedodatni tam, gdzie musi być dodatni, albo nie jest liczbą.'),
    'r_CAU-R-013': T('Correct the time values of {target}: a delay is zero or more, a process safety time and a bypass duration are above zero.', 'Виправте часові значення {target}: затримка — нуль або більше, час безпеки процесу й тривалість шунтування — більші за нуль.', 'Korrigieren Sie die Zeitwerte von {target}: Verzögerung null oder mehr, Prozesssicherheitszeit und Überbrückungsdauer größer als null.', 'Corrigeer de tijdwaarden van {target}: vertraging nul of meer, procesveiligheidstijd en overbruggingsduur groter dan nul.', 'Corrigez les temps de {target} : temporisation nulle ou positive, temps de sécurité et durée de shunt strictement positifs.', 'Corrija los tiempos de {target}: retardo cero o más, tiempo de seguridad y duración de puenteo mayores que cero.', 'Popraw wartości czasu w {target}: opóźnienie zero lub więcej, czas bezpieczeństwa procesu i czas bocznikowania większe od zera.'),
    't_CAU-R-014': T('Exclusivity names an unknown cause', 'Виключність вказує невідому причину', 'Ausschließung nennt unbekannte Ursache', 'Uitsluiting noemt onbekende oorzaak', 'Exclusivité vers une cause inconnue', 'La exclusión nombra una causa desconocida', 'Wykluczenie wskazuje nieznaną przyczynę'),
    'm_CAU-R-014': T('Cause {target} declares exclusivity with {ids}, which is not another cause of this matrix.', 'Причина {target} оголошує виключність із {ids}, що не є іншою причиною цієї матриці.', 'Ursache {target} erklärt Ausschließung mit {ids}, was keine andere Ursache dieser Matrix ist.', 'Oorzaak {target} noemt uitsluiting met {ids}, wat geen andere oorzaak van deze matrix is.', 'La cause {target} déclare une exclusivité avec {ids}, qui n’est pas une autre cause de cette matrice.', 'La causa {target} declara exclusión con {ids}, que no es otra causa de esta matriz.', 'Przyczyna {target} deklaruje wykluczenie z {ids}, co nie jest inną przyczyną tej macierzy.'),
    't_CAU-R-015': T('Cells dropped on input', 'Клітинки відкинуто під час введення', 'Zellen beim Einlesen verworfen', 'Cellen weggelaten bij invoer', 'Cases écartées à la lecture', 'Celdas descartadas al leer', 'Komórki odrzucone przy wczytaniu'),
    'm_CAU-R-015': T('Cells dropped on input for naming a cause or effect outside the matrix: {n}.', 'Відкинуто клітинок, що вказують відсутні в матриці причину або наслідок: {n}.', 'Beim Einlesen verworfene Zellen mit einer Ursache oder Wirkung außerhalb der Matrix: {n}.', 'Bij invoer weggelaten cellen met een oorzaak of gevolg buiten de matrix: {n}.', 'Cases écartées à la lecture pour une cause ou un effet absent de la matrice : {n}.', 'Celdas descartadas al leer por nombrar una causa o efecto ausente de la matriz: {n}.', 'Odrzucono komórek wskazujących nieobecną przyczynę lub skutek: {n}.'),
    't_CAU-R-016': T('Cause repeats another cause', 'Причина повторює іншу', 'Ursache wiederholt eine andere', 'Oorzaak herhaalt een andere', 'Cause identique à une autre', 'Causa que repite otra', 'Przyczyna powtarza inną'),
    'm_CAU-R-016': T('Cause {target} has the same devices, condition and voting as {same}.', 'Причина {target} має ті самі пристрої, умову й голосування, що і {same}.', 'Ursache {target} hat dieselben Geräte, dieselbe Bedingung und Votierung wie {same}.', 'Oorzaak {target} heeft dezelfde apparaten, voorwaarde en stemming als {same}.', 'La cause {target} a les mêmes appareils, la même condition et le même vote que {same}.', 'La causa {target} tiene los mismos equipos, condición y votación que {same}.', 'Przyczyna {target} ma te same urządzenia, warunek i głosowanie co {same}.'),
    't_CAU-R-017': T('Exclusivity derived by the tool', 'Виключність виведено інструментом', 'Ausschließung vom Werkzeug abgeleitet', 'Uitsluiting door de tool afgeleid', 'Exclusivité déduite par l’outil', 'Exclusión deducida por la herramienta', 'Wykluczenie wyprowadzone przez narzędzie'),
    'm_CAU-R-017': T('{i} and {j} read the same devices with trip intervals that do not overlap, so the tool treats them as never active together.', '{i} і {j} зчитують ті самі пристрої з інтервалами спрацювання, що не перетинаються, тож інструмент вважає їх ніколи не активними разом.', '{i} und {j} lesen dieselben Geräte mit nicht überlappenden Auslösebereichen; das Werkzeug behandelt sie als nie zugleich aktiv.', '{i} en {j} lezen dezelfde apparaten met niet-overlappende tripintervallen; de tool ziet ze als nooit tegelijk actief.', '{i} et {j} lisent les mêmes appareils avec des intervalles disjoints ; l’outil les considère jamais actives ensemble.', '{i} y {j} leen los mismos equipos con intervalos de disparo disjuntos; la herramienta las trata como nunca activas a la vez.', '{i} i {j} czytają te same urządzenia z nienakładającymi się przedziałami zadziałania, więc narzędzie traktuje je jako nigdy nieaktywne razem.'),
    't_CAU-R-020': T('Effect with no cause', 'Наслідок без причини', 'Wirkung ohne Ursache', 'Gevolg zonder oorzaak', 'Effet sans cause', 'Efecto sin causa', 'Skutek bez przyczyny'),
    'm_CAU-R-020': T('Effect {target} has no cell in the matrix, so no cause reaches it.', 'Наслідок {target} не має жодної клітинки, тож жодна причина його не досягає.', 'Wirkung {target} hat keine Zelle in der Matrix, also erreicht sie keine Ursache.', 'Gevolg {target} heeft geen enkele cel, dus geen oorzaak bereikt het.', 'L’effet {target} n’a aucune case : aucune cause ne l’atteint.', 'El efecto {target} no tiene ninguna celda, así que ninguna causa lo alcanza.', 'Skutek {target} nie ma żadnej komórki, więc nie dociera do niego żadna przyczyna.'),
    'r_CAU-R-020': T('Relate {target} to at least one cause, or take it out of the matrix.', 'Пов’яжіть {target} щонайменше з однією причиною або приберіть його з матриці.', 'Verknüpfen Sie {target} mit mindestens einer Ursache oder nehmen Sie sie aus der Matrix.', 'Koppel {target} aan minstens één oorzaak of haal het uit de matrix.', 'Reliez {target} à au moins une cause, ou retirez-le de la matrice.', 'Relacione {target} con al menos una causa, o sáquelo de la matriz.', 'Powiąż {target} z co najmniej jedną przyczyną albo usuń go z macierzy.'),
    't_CAU-R-021': T('Effect never commanded', 'Наслідок ніколи не отримує команди', 'Wirkung wird nie angesteuert', 'Gevolg wordt nooit aangestuurd', 'Effet jamais commandé', 'Efecto nunca ordenado', 'Skutek nigdy niesterowany'),
    'm_CAU-R-021': T('Effect {target} carries cells but no trip cell, so nothing commands it.', 'Наслідок {target} має клітинки, але жодної клітинки спрацювання, тож нічого його не командує.', 'Wirkung {target} hat Zellen, aber keine Auslösezelle; sie wird nie angesteuert.', 'Gevolg {target} heeft cellen maar geen tripcel, dus niets stuurt het aan.', 'L’effet {target} a des cases mais aucune de déclenchement : rien ne le commande.', 'El efecto {target} tiene celdas pero ninguna de disparo, así que nada lo ordena.', 'Skutek {target} ma komórki, lecz żadnej wyzwalającej, więc nic nim nie steruje.'),
    't_CAU-R-022': T('Cause with no effect', 'Причина без наслідку', 'Ursache ohne Wirkung', 'Oorzaak zonder gevolg', 'Cause sans effet', 'Causa sin efecto', 'Przyczyna bez skutku'),
    'm_CAU-R-022': T('Cause {target} has no cell in the matrix, so it drives nothing.', 'Причина {target} не має жодної клітинки, тож ні на що не впливає.', 'Ursache {target} hat keine Zelle in der Matrix und bewirkt nichts.', 'Oorzaak {target} heeft geen enkele cel en doet dus niets.', 'La cause {target} n’a aucune case : elle ne pilote rien.', 'La causa {target} no tiene ninguna celda, así que no acciona nada.', 'Przyczyna {target} nie ma żadnej komórki, więc niczego nie uruchamia.'),
    'r_CAU-R-022': T('Relate {target} to at least one effect, or take it out of the matrix.', 'Пов’яжіть {target} щонайменше з одним наслідком або приберіть її з матриці.', 'Verknüpfen Sie {target} mit mindestens einer Wirkung oder nehmen Sie sie aus der Matrix.', 'Koppel {target} aan minstens één gevolg of haal het uit de matrix.', 'Reliez {target} à au moins un effet, ou retirez-la de la matrice.', 'Relacione {target} con al menos un efecto, o sáquela de la matriz.', 'Powiąż {target} z co najmniej jednym skutkiem albo usuń ją z macierzy.'),

    'm_CAU-R-030': T('Cell {target} commands {s}; the safe state of that effect is {safe}.', 'Клітинка {target} командує {s}; безпечний стан цього наслідку — {safe}.', 'Zelle {target} steuert {s} an; der sichere Zustand dieser Wirkung ist {safe}.', 'Cel {target} stuurt {s} aan; de veilige toestand van dat gevolg is {safe}.', 'La case {target} commande {s} ; l’état sûr de cet effet est {safe}.', 'La celda {target} ordena {s}; el estado seguro de ese efecto es {safe}.', 'Komórka {target} steruje {s}; stanem bezpiecznym tego skutku jest {safe}.'),

    't_CAU-R-033': T('Latch released automatically', 'Фіксацію знімає автоматика', 'Selbsthaltung wird automatisch gelöst', 'Vergrendeling valt automatisch weg', 'Verrouillage levé automatiquement', 'Enclavamiento liberado automáticamente', 'Podtrzymanie zwalniane automatycznie'),

    'm_CAU-R-050': T('Effect {target} goes to {de} when its output loses power; its safe state is {safe}.', 'Наслідок {target} переходить у {de} при втраті живлення виходу; його безпечний стан — {safe}.', 'Wirkung {target} geht bei Spannungsverlust auf {de}; ihr sicherer Zustand ist {safe}.', 'Gevolg {target} gaat naar {de} bij verlies van uitgangsspanning; de veilige toestand is {safe}.', 'L’effet {target} passe à {de} quand sa sortie perd l’alimentation ; son état sûr est {safe}.', 'El efecto {target} pasa a {de} cuando su salida pierde alimentación; su estado seguro es {safe}.', 'Skutek {target} przechodzi w {de} po utracie zasilania wyjścia; jego stan bezpieczny to {safe}.'),

    't_CAU-R-051': T('Fail-safe element under energise to trip', 'Елемент із безпечною відмовою за принципу подачі живлення', 'Eigensicheres Stellglied bei Arbeitsstrom', 'Faalveilig element bij arbeidsstroom', 'Organe sûr par défaut en émission de tension', 'Elemento a prueba de fallo con disparo por energización', 'Element samoczynnie bezpieczny przy wzbudzeniu'),
    'm_CAU-R-051': T('Effect {target} already reaches its safe state {safe} when de-energised, so energise to trip adds no protection here.', 'Наслідок {target} і так переходить у безпечний стан {safe} без живлення, тож принцип подачі живлення тут нічого не додає.', 'Wirkung {target} erreicht den sicheren Zustand {safe} bereits spannungslos; das Arbeitsstromprinzip bringt hier keinen Zusatz.', 'Gevolg {target} bereikt de veilige toestand {safe} al spanningsloos; arbeidsstroom voegt hier niets toe.', 'L’effet {target} atteint déjà son état sûr {safe} désexcité ; l’émission de tension n’ajoute rien ici.', 'El efecto {target} ya alcanza su estado seguro {safe} desenergizado; la energización no añade nada aquí.', 'Skutek {target} osiąga stan bezpieczny {safe} już bez zasilania, więc wzbudzanie nic tu nie dodaje.'),

  /* ======================================================== core helpers */
  var CE = window.CEEngine, PR = window.CEPresets;
