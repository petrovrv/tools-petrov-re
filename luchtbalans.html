function lgi(color,label,shape){
  const box=shape==="line"?'<i style="background:'+color+';height:3px;border-radius:2px"></i>':
    '<i style="background:'+color+';border-radius:50%"></i>';
  return '<span>'+box+esc(label)+'</span>';
}

/* ---------------- built-in checks: probes that run the real solver ---------------- */
/* Every reference comparison below builds a small network, hands it to the same
   solve() / transport() that the page uses, and reads the answer back. Nothing is
   recomputed from a second copy of the formula. */
const PROBE_ENV={i_rho:1.20,i_cdleak:0.65,i_tout:20,i_rhout:50,i_tol:3,i_vmax:5,i_dpmax:50};
function probe(nodes,links,mode,env){
  const sn=NODES, sl=LINKS, se=ENV, sc=CLAMPED;
  NODES=nodes; LINKS=links; ENV=env||PROBE_ENV;
  let out={R:null,TR:null};
  try{ const R=solve(mode||"prod"); out={R:R,TR:transport(R)}; }
  catch(e){ out={R:null,TR:null}; }
  finally{ NODES=sn; LINKS=sl; ENV=se; CLAMPED=sc; }
  return out;
}
function pmode(v){ const o={}; MODES.forEach(m=>{o[m]=v;}); return o; }
/* one room, one imposed supply, one passive opening to outside */
function netOpening(qm3h,area,cd){
  const nodes=[
    {id:"AS1",type:"asup",name:"s",x:0,y:0,Q:qm3h,T:20,RH:50,m:pmode(1)},
    {id:"R1", type:"room",name:"r",x:0,y:0,V:1000,T:20,RH:50,leak:0,rank:1,tgt:0,qh:0,qc:0,gm:0,gc:0},
    {id:"PX1",type:"psink",name:"o",x:0,y:0,T:20,RH:50}];
  const links=[
    {id:"K1",a:"AS1",b:"R1",t:"duct",A:1,gap:1,cd:0.65,h:0,req:"none",f:pmode(1)},
    {id:"K2",a:"R1",b:"PX1",t:"open",A:area,gap:area,cd:cd,h:0,req:"none",f:pmode(1)}];
  return probe(nodes,links);
}
/* one room, imposed supply and imposed extract of the same size */
function netFlush(qm3h,vol,qh,gc){
  const nodes=[
    {id:"AS1",type:"asup", name:"s",x:0,y:0,Q:qm3h,T:20,RH:50,m:pmode(1)},
    {id:"R1", type:"room", name:"r",x:0,y:0,V:vol,T:20,RH:50,leak:0,rank:1,tgt:0,
     qh:qh||0,qc:0,gm:0,gc:gc||0},
    {id:"AX1",type:"asink",name:"e",x:0,y:0,Q:qm3h,T:20,RH:50,m:pmode(1)}];
  const links=[
    {id:"K1",a:"AS1",b:"R1",t:"duct",A:1,gap:1,cd:0.65,h:0,req:"none",f:pmode(1)},
    {id:"K2",a:"R1",b:"AX1",t:"duct",A:1,gap:1,cd:0.65,h:0,req:"none",f:pmode(1)}];
  return probe(nodes,links);
}
/* the opening law, read back as the pressure the solver needs to pass a known flow */
function devOpening(){
  let mx=0;
  REF_OPEN.forEach(row=>{
    if(row[0]<=0) return;
    [[1.0,row[1]],[0.25,row[2]]].forEach(c=>{
      const r=netOpening(c[1]*3600,c[0],0.65);
      if(!r.R||!r.R.p.length){ mx=Math.max(mx,1); return; }
      mx=Math.max(mx,Math.abs(r.R.p[0]-row[0])/row[0]);
    });
  });
  return mx;
}
/* the capture relation, taken from the very function the result panel uses */
function devCapture(){
  let mx=0;
  REF_CAPT.forEach(row=>{ const v=captureV(1.0,0.5,row[0]);
    if(row[1]>0) mx=Math.max(mx,Math.abs(v-row[1])/row[1]); });
  return mx;
}
/* the wash-out curve, on air change rates the solver itself produced */
function devTracer(){
  let mx=0;
  [2,5,10].forEach((n,j)=>{
    const r=netFlush(n*1000,1000,0,0);
    if(!r.R){ mx=Math.max(mx,1); return; }
    const nSolved=r.R.outflow[0]*3600/1000;
    REF_TRAC.forEach(row=>{ const c=washFrac(nSolved,row[0]);
      if(row[j+1]>0) mx=Math.max(mx,Math.abs(c-row[j+1])/row[j+1]); });
  });
  /* the wash-out time reported in the table must land on the same curve */
  [2,5,10].forEach(n=>{ const t=t99Of(n);
    if(t===null){ mx=Math.max(mx,1); return; }
    mx=Math.max(mx,Math.abs(washFrac(n,t/60)-0.01)/0.01); });
  return mx;
}
/* the solved pressures must not depend on the order of the blocks and the connections */
function devOrder(){
  if(!NODES.length||!LINKS.length) return 0;
  const rev=probe(NODES.slice().reverse(),LINKS.slice().reverse(),MODE,null);
  if(!rev.R) return 1e9;
  const base=ALL[MODE]; if(!base) return 0;
  let mx=0;
  base.rooms.forEach((r,i)=>{
    const j=rev.R.idx[r.id];
    if(j===undefined){ mx=1e9; return; }
    mx=Math.max(mx,Math.abs(base.p[i]-rev.R.p[j]));
  });
  return mx;
}
/* a room with no air change must be reported as having no steady state */
function devNoFlow(){
  const nodes=[{id:"R1",type:"room",name:"r",x:0,y:0,V:1000,T:20,RH:50,leak:0,rank:1,tgt:0,
    qh:26000,qc:0,gm:0.004,gc:0.0001}];
  const r=probe(nodes,[]);
  if(!r.TR) return false;
  const st=r.TR.map["R1"];
  return !!st&&st.noflow===true&&st.T===null&&st.c===null&&r.TR.noAir.indexOf("R1")>=0;
}
/* a mixed state far outside the physical window must be caught, not reported */
function devPlaus(){
  const bad=netFlush(1,100,9000,0);
  const good=netFlush(3600,100,9000,0);
  if(!bad.TR||!good.TR) return false;
  return bad.TR.noSense.indexOf("R1")>=0 && good.TR.noSense.length===0;
}

/* ---------------- main run ---------------- */
/* a room state that does not exist is left empty, never filled with the input */
function stT(st){ return (st&&st.T!==null&&st.T!==undefined)?fmt(st.T,1):"—"; }
function stRH(st){ return (st&&st.T!==null&&st.T!==undefined&&st.w!==null&&st.w!==undefined)?
  fmt(rhOfW(st.T,st.w),0):"—"; }
function stC(st){ return (st&&st.c!==null&&st.c!==undefined)?fmt(st.c*1e6,2):"—"; }
function stMark(st,txt){ return (st&&st.bad)?'<span class="pill b">'+esc(txt)+'</span>':txt; }
function selPassiveLink(){
  if(SELL){ const L=linkById(SELL); if(L&&!activeLink(L)) return L; }
  for(const L of LINKS) if(!activeLink(L)) return L;
  return null;
}
/* compute() is the whole calculation and everything that is drawn from it. The
   shell calls it through on.compute; run() is kept as the tool's own entry point so
   that every edit handler below is unchanged and every result surface — the tiles,
   the tables and the drawing — is refreshed by one path. */
function run(){ if(UI&&UI.run) UI.run(); else compute(); }
function compute(){
  CLAMPED=false;
  ALL={}; MODES.forEach(m=>{ ALL[m]=solve(m); });
  const R=ALL[MODE]; LASTR=R;
  const TR=transport(R); TRAN=TR;
  const tol=Math.max(0.2,gv("i_tol",3));
  const vmax=Math.max(0.2,gv("i_vmax",5));
  const dpmax=Math.max(1,gv("i_dpmax",50));
  const idx=R.idx;
  OUT={};

  /* headline numbers the engineer reads */
  let itMax=0,resMax=0,worst=0;
  MODES.forEach(m=>{ itMax=Math.max(itMax,ALL[m].it); resMax=Math.max(resMax,ALL[m].res*3600); });
  R.p.forEach(p=>{ worst=Math.max(worst,Math.abs(p)); });
  let supTot=0;
  NODES.forEach(n=>{ if(n.type==="asup")
    supTot+=Math.max(0,num(n.Q,0))*Math.max(0,num((n.m||{})[MODE],1)); });
  let achMin=null;
  R.rooms.forEach((r,i)=>{ const V=Math.max(1,num(r.V,1));
    const a=R.outflow[i]*3600/V; achMin=(achMin===null||a<achMin)?a:achMin; });
  KPI={worst:fmt(worst,1), imb:fmt(R.imb*3600,3), sup:fmt(supTot,0),
       ach:achMin===null?"—":fmt(achMin,1),
       close:T("n_close")+" "+fmt(Math.max(resMax,0),4)+" m³/h."};

  /* per-link results */
  const fmap={};
  R.flows.forEach(f=>{ const L=LINKS[f.li]; if(L) fmap[L.id]=f; });
  LINKS.forEach(L=>{
    const f=fmap[L.id];
    const q=f?f.q:0;
    const up=q>=0?L.a:L.b;
    const st=stateOf(up,TR);
    const rd=reqDir(L);
    const act=Math.abs(q)<2.8e-4?0:(q>0?1:-1);
    let cls="n", txt=T("s_na");
    if(activeLink(L)){ cls="n"; txt=T("s_set"); }
    else if(rd!==0){
      if(act===0){ cls="b"; txt=T("s_weak"); }
      else if(act===rd){ cls="g"; txt=T("s_ok"); }
      else { cls="b"; txt=T("s_rev"); }
    }
    OUT[L.id+":dpl"]=f&&f.dp!==null?fmt(f.dp,2):"—";
    OUT[L.id+":q"]=fmt(Math.abs(q)*3600,0);
    OUT[L.id+":vel"]=fmt(f?f.v:0,2);
    OUT[L.id+":at"]=stT(st);
    OUT[L.id+":arh"]=stRH(st);
    OUT[L.id+":ac"]=stC(st);
    OUT[L.id+":dir"]='<span class="pill '+cls+'">'+esc(txt)+'</span>';
  });

  /* per-node results */
  const ambNet={};
  R.flows.forEach(f=>{ const L=LINKS[f.li]; if(!L) return;
    const A=byId(L.a), B=byId(L.b);
    if(isAmb(A)||isActive(A)) ambNet[L.a]=(ambNet[L.a]||0)+f.q;
    if(isAmb(B)||isActive(B)) ambNet[L.b]=(ambNet[L.b]||0)-f.q;
  });
  NODES.forEach(n=>{
    const id=n.id;
    if(n.type==="room"){
      const i=idx[id], p=R.p[i], tg=num(n.tgt,0), V=Math.max(1,num(n.V,1));
      const nAch=R.outflow[i]*3600/V;
      const t99=t99Of(nAch);
      const st=stateOf(id,TR);
      let cls="w";
      if(Math.abs(p-tg)<=tol) cls="g";
      else if((p>=0)!==(tg>=0)&&Math.abs(tg)>0.5) cls="b";
      OUT[id+":dp"]='<span class="pill '+cls+'">'+esc(sfmt(p,1))+'</span>';
      OUT[id+":net"]=fmt(R.net[i]*3600,0);
      OUT[id+":ach"]=fmt(nAch,1);
      OUT[id+":t99"]=fmt(t99,1);
      OUT[id+":tc"]=stMark(st,stT(st));
      OUT[id+":rc"]=stMark(st,stRH(st));
      OUT[id+":cc"]=stMark(st,stC(st));
      OUT[id+":src"]="—";
    } else {
      const q=ambNet[id]||0;
      OUT[id+":dp"]=isAmb(n)?fmt(0,1):"—";
      OUT[id+":net"]=fmt(q*3600,0);
      OUT[id+":ach"]="—"; OUT[id+":t99"]="—";
      if(n.type==="asink"){ OUT[id+":tc"]="—"; OUT[id+":rc"]="—"; OUT[id+":cc"]="—"; }
      else { const st=extState(id);
        OUT[id+":tc"]=fmt(st.T,1); OUT[id+":rc"]=fmt(rhOfW(st.T,st.w),0); OUT[id+":cc"]=fmt(st.c*1e6,2); }
      OUT[id+":src"]='<span class="pill '+(isActive(n)?"n":"g")+'">'+
        esc(isActive(n)?T("s_set"):T("s_bal"))+'</span>';
    }
  });
  applyOut();

  /* mode matrix */
  const RM=R.rooms;
  MTX={head:[T("h_mode")].concat(RM.map(r=>r.id)),
       rows:MODES.map(m=>[T("m_"+m)+(m===MODE?" ·":"")].concat(RM.map((r,i)=>fmt(ALL[m].p[i],1))))};

  /* capture-velocity block */
  const cq=gv("i_cq",1), ca=Math.max(0.001,gv("i_ca",0.5)), cx=Math.max(0.001,gv("i_cx",0.4));
  const vx=captureV(cq,ca,cx);
  const xreq=captureX(cq,ca,CAPT_TGT);
  CAP={vx:fmt(vx,3), tgt:fmt(CAPT_TGT,2), xreq:xreq!==null?fmt(xreq,2):"—"};

  /* charts */
  const rh=Math.max(0.1,gv("i_rho",1.2));
  const Lsel=selPassiveLink();
  const fsel=Lsel?fmap[Lsel.id]:null;
  let dpTop=Math.max(50, fsel&&fsel.dp!==null&&isFinite(fsel.dp)?Math.abs(fsel.dp)*1.25:0);
  if(!isFinite(dpTop)||dpTop>1e6) dpTop=1e6;
  const cur=(cd,A,rr)=>{ const a=[]; for(let i=0;i<=60;i++){ const dp=dpTop*i/60;
    a.push([dp,cd*A*Math.sqrt(2*dp/rr)]); } return a; };
  const s1=cur(0.65,1.0,1.20), s2=cur(0.65,0.25,1.20);
  const sSel=(Lsel&&fsel)?cur(num(Lsel.cd,0.6),fsel.Ae,rh):[];
  let ymax=0; [s1,s2,sSel].forEach(a=>a.forEach(p=>{ymax=Math.max(ymax,p[1]);}));
  if(fsel) ymax=Math.max(ymax,Math.abs(fsel.q));
  ymax=Math.max(0.5,ymax*1.08); if(!isFinite(ymax)||ymax>1e9) ymax=1e9;
  const acc=cssv("--accent"), good=cssv("--ok"), warn=cssv("--warn"), bad=cssv("--bad"), mut=cssv("--muted");
  /* the chart configuration is kept and drawn by the stage that hosts it, at the
     width the stage measured, so that its labels are physical pixels (spec 10) */
  CH1={w:660,h:250,xmin:0,xmax:dpTop,ymin:0,ymax:ymax,xd:0,yd:2,
    xlab:T("ax_dp"),ylab:T("ax_q"),alab:T("h_chart1"),
    series:[{pts:s1,color:mut,w:1.6},{pts:s2,color:mut,w:1.6,dash:"5 4"},{pts:sSel,color:acc,w:2.4}],
    points:[{pts:REF_OPEN.map(r=>[r[0],r[1]]),color:good,r:2.8},
            {pts:REF_OPEN.map(r=>[r[0],r[2]]),color:warn,r:2.8},
            {pts:(fsel&&fsel.dp!==null)?[[Math.abs(fsel.dp),Math.abs(fsel.q)]]:[],color:acc,shape:"sq"}]};
  if(el("lgd1")) el("lgd1").innerHTML=lgi(good,T("g_ref1"))+lgi(warn,T("g_ref2"))+lgi(acc,T("g_sel"),"line")+
    lgi(acc,T("g_pt"))+(Lsel?'<span class="dgu-hint">'+esc(Lsel.id)+' · '+esc(T(TKEY[Lsel.t]))+'</span>':"");

  const xmax2=Math.max(2,cx*1.5);
  const c2=[]; for(let i=0;i<=80;i++){ const x=0.1+(xmax2-0.1)*i/80; c2.push([x,captureV(cq,ca,x)]); }
  let y2=0; c2.forEach(p=>{y2=Math.max(y2,p[1]);}); REF_CAPT.forEach(p=>{y2=Math.max(y2,p[1]);});
  CH2={w:660,h:230,xmin:0,xmax:xmax2,ymin:0,ymax:Math.max(0.2,y2*1.08),xd:1,yd:2,
    xlab:T("ax_x"),ylab:T("ax_v"),alab:T("h_chart2"),
    series:[{pts:c2,color:acc,w:2.2},{pts:[[0,CAPT_TGT],[xmax2,CAPT_TGT]],color:bad,w:1.3,dash:"5 4"}],
    points:[{pts:REF_CAPT,color:good,r:2.8},{pts:[[cx,vx]],color:acc,shape:"sq"}]};
  drawCharts();
  if(el("lgd2")) el("lgd2").innerHTML=lgi(acc,T("g_mod"),"line")+lgi(good,T("g_refc"))+lgi(bad,T("l_ctgt"),"line")+
    lgi(acc,T("g_pt"));

  /* the same content in words, for anyone who cannot read the drawing */
  const selCurve=(Lsel&&fsel&&isFinite(fsel.Ae))?
    (dp)=>num(Lsel.cd,0.6)*fsel.Ae*Math.sqrt(2*Math.max(0,dp)/rh):null;
  const rows1=REF_OPEN.map(r=>[fmt(r[0],2),fmt(r[1],3),fmt(r[2],3),
    selCurve?fmt(selCurve(r[0]),3):"—"]);
  const notes1=[];
  notes1.push(T("g_sel")+": "+(Lsel?(Lsel.id+" · "+T(TKEY[Lsel.t])):"—"));
  notes1.push(T("g_pt")+": "+((fsel&&fsel.dp!==null&&isFinite(fsel.dp))?
    (T("ax_dp")+" "+fmt(Math.abs(fsel.dp),2)+" · "+T("ax_q")+" "+fmt(Math.abs(fsel.q),3)):"—"));
  if(el("alt1")) el("alt1").innerHTML=altTable([T("ax_dp"),T("g_ref1"),T("g_ref2"),T("g_sel")],rows1,notes1);

  const rows2=REF_CAPT.map(r=>[fmt(r[0],3),fmt(captureV(cq,ca,r[0]),3),fmt(r[1],3)]);
  const notes2=[T("l_ctgt")+": "+fmt(CAPT_TGT,2)+" m/s",
    T("l_cxreq")+": "+(xreq!==null?fmt(xreq,2)+" m":"—"),
    T("g_pt")+": "+T("ax_x")+" "+fmt(cx,2)+" · "+T("ax_v")+" "+fmt(vx,3)];
  if(el("alt2")) el("alt2").innerHTML=altTable([T("ax_x"),T("g_mod"),T("g_refc")],rows2,notes2);

  renderScheme();
  markSel();
  updScroll();

  /* ---------------- structural checks (hidden container + console) ------- */
  const C=[];
  const add=(id,key,ok,detail)=>C.push({id:id,key:key,ok:ok,detail:detail||""});
  const badModes=MODES.filter(m=>ALL[m].res>=TOL_SOLVE&&ALL[m].it>=200);
  add("V1","v_conv",badModes.length===0,
    badModes.length?T("d_modes")+": "+badModes.map(m=>T("m_"+m)).join(", "):
    "≤ "+fmt(itMax,0)+" · "+T("d_maxerr")+" "+fmt(resMax,5)+" m³/h");
  const dOrd=devOrder();
  add("V2","v_bal",dOrd<1e-6,T("d_maxerr")+" "+dOrd.toExponential(2)+" Pa");
  let nres=0,nresM=MODES[0];
  MODES.forEach(m=>{ if(ALL[m].res>nres){nres=ALL[m].res;nresM=m;} });
  add("V3","v_node",nres*3600<0.01,T("d_worst")+": "+T("m_"+nresM)+" "+fmt(nres*3600,5)+" m³/h");

  const dirBad=[];
  MODES.forEach(m=>{ ALL[m].flows.forEach(f=>{ if(f.active) return;
    const L=LINKS[f.li]; if(!L) return; const rd=reqDir(L); if(rd===0) return;
    const a=Math.abs(f.q)<2.8e-4?0:(f.q>0?1:-1);
    if(a!==rd) dirBad.push(L.id+" / "+T("m_"+m)); }); });
  add("V4","v_dir",dirBad.length===0,dirBad.length?dirBad.slice(0,6).join("; "):"");

  let cleanIdx=-1;
  RM.forEach((r,i)=>{ if(cleanIdx<0||num(r.rank,0)<num(RM[cleanIdx].rank,0)) cleanIdx=i; });
  const gateModes=MODES.filter(m=>LINKS.some(L=>L.t==="gate"&&num(L.f[m],0)>0));
  const cleanBad=[];
  if(cleanIdx>=0) gateModes.forEach(m=>{ if(ALL[m].p[cleanIdx]<=0)
    cleanBad.push(T("m_"+m)+" "+fmt(ALL[m].p[cleanIdx],1)+" Pa"); });
  add("V5","v_clean",cleanBad.length===0,cleanBad.length?cleanBad.join("; "):
    (gateModes.length?T("d_modes")+": "+gateModes.map(m=>T("m_"+m)).join(", "):""));

  let vw=0,vwM=MODES[0],vwL="";
  MODES.forEach(m=>{ ALL[m].flows.forEach(f=>{ const L=LINKS[f.li]; if(!L) return;
    if(!f.active&&num(L.f[m],0)<=0) return;
    if(f.v>vw){vw=f.v;vwM=m;vwL=L.id;} }); });
  add("V6","v_vel",vw<=vmax,T("d_worst")+": "+(vwL||"n/a")+" / "+T("m_"+vwM)+" "+fmt(vw,2)+" m/s");

  let pw=0,pwM=MODES[0];
  MODES.forEach(m=>{ ALL[m].p.forEach(p=>{ if(Math.abs(p)>pw){pw=Math.abs(p);pwM=m;} }); });
  add("V7","v_range",pw<=dpmax,T("d_worst")+": "+T("m_"+pwM)+" "+fmt(pw,1)+" Pa · ≤ "+fmt(dpmax,0)+" Pa");

  const dO=devOpening(), dC=devCapture(), dT=devTracer();
  add("V8","v_open",dO<0.005,T("d_maxerr")+" "+fmt(dO*100,3)+" %");
  add("V9","v_capt",dC<0.005,T("d_maxerr")+" "+fmt(dC*100,3)+" %");
  add("V10","v_trac",dT<0.005,T("d_maxerr")+" "+fmt(dT*100,3)+" %");
  add("V11","v_mix",TR.resid<1e-8,T("d_maxerr")+" "+(TR.resid*100).toExponential(2)+" %");

  let psyErr=0;
  for(let t=-10;t<=40;t+=5){ for(let r2=10;r2<=90;r2+=10){
    const back=rhOfW(t,wOfRH(t,r2)); psyErr=Math.max(psyErr,Math.abs(back-r2)); } }
  add("V12","v_psy",psyErr<1e-6,T("d_maxerr")+" "+psyErr.toExponential(2)+" %");

  let allFinite=true;
  MODES.forEach(m=>{ if(!ALL[m].finite) allFinite=false;
    ALL[m].p.forEach(p=>{ if(!isFinite(p)) allFinite=false; });
    ALL[m].flows.forEach(f=>{ if(!isFinite(f.q)||!isFinite(f.v)) allFinite=false;
      if(f.dp!==null&&!isFinite(f.dp)) allFinite=false; }); });
  RM.forEach(r=>{ const st=stateOf(r.id,TR);
    if(st.noflow) return;
    if(!isFinite(st.T)||!isFinite(st.w)||!isFinite(st.c)) allFinite=false; });
  if(!isFinite(vx)) allFinite=false;
  add("V13","v_nan",allFinite,"");
  add("V14","v_noflow",devNoFlow(),"");
  add("V15","v_plaus",devPlaus(),"");

  const vo=el("val-out"); if(vo) vo.innerHTML=C.map(c=>'<div class="flag '+(c.ok?"ok":"bad")+'"><span class="fc">'+esc(c.id)+
    '</span><span>'+esc(T(c.key))+(c.detail?' <span class="dgu-hint">— '+esc(c.detail)+'</span>':"")+'</span></div>').join("");

  /* ---------------- what the user is told, in words ---------------- */
  const names=(ids)=>ids.map(i=>nameOf(i)+" ("+i+")").join(", ");
  const notes=[];
  if(TR.noAir.length) notes.push(T("w_noflow")+" "+names(TR.noAir)+".");
  if(TR.noSense.length) notes.push(T("w_implaus")+" "+names(TR.noSense)+".");
  if(CLAMPED) notes.push(T("w_clamp"));
  if(C.some(c=>!c.ok)) notes.push(T("w_check"));
  NOTES=notes;
}

/* ---------------- rebuild helpers ---------------- */
function rebuild(){ keepFocus(()=>{ renderTables(); renderDetail(true); run(); }); }

/* ==================== the shell (diagram-ui.js) ====================
   The screen is the framework's: header, slots, placement law, one h1, learn mode,
   language, theme, undo and the shared bar. Everything below hands the tool's own
   content to it; nothing below computes anything. */
let UI=null, STAGE=null, CH1S=null, CH2S=null;
let KPI={worst:"—",imb:"—",sup:"—",ach:"—",close:""}, MTX={head:[],rows:[]},
    CAP={vx:"—",tgt:"—",xreq:"—"}, NOTES=[], CH1=null, CH2=null;
/* "1" = the drawing at its designed size, so that its smallest label is the 8.5 px it
   was drawn as; "fit" = scaled into the box, which is what the page did at every width
   before the port. The choice is the reader's and it is remembered. */
let DETBOX=null;
let ZOOM=(()=>{ try{ const v=localStorage.getItem("luchtbalans_zoom");
  return (v==="fit"||v==="1")?v:"1"; }catch(e){ return "1"; } })();
let DETSIG="";                /* what the inspector is currently showing */

function mk(tag,attrs,html){
  const n=document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(k=>{ if(attrs[k]!==null&&attrs[k]!==undefined) n.setAttribute(k,attrs[k]); });
  if(html!==null&&html!==undefined) n.innerHTML=html;
  return n;
}
function hint(key){ return mk("p",{class:"dgu-hint"},esc(T(key))); }
/* One history entry per action. A snapshot is taken BEFORE the change, and a run of
   keystrokes in one cell is one entry, not one per character: EDITKEY remembers which
   cell the run belongs to and any other action clears it. */
let EDITKEY=null;
function hist(){ EDITKEY=null; if(UI&&UI.history) UI.history.push(); }
function editStart(t){
  const kind=t.getAttribute("data-n")?"n":"k";
  const key=kind+":"+t.getAttribute("data-"+kind)+":"+t.getAttribute("data-f");
  if(key===EDITKEY) return;
  hist(); EDITKEY=key;
}

/* Framework defect, repaired locally; it belongs upstream. rebuild() — which runs on
   every language change — builds a NEW App, copies its own properties onto the old
   object and points DiagramUI.current at the old one, while the controls it has just
   drawn are bound to the new one. Every callback hands over the instance that made
   it, so the tool keeps its pointer on that one and keeps the published one on the
   same state object. */
function live(app){
  if(!app) return;
  if(app.node&&!document.contains(app.node)) return;
  UI=app; STATE=app.state;
  if(window.DiagramUI&&DiagramUI.current&&DiagramUI.current!==app) DiagramUI.current.state=app.state;
}

/* ---------------- the stage: the drawing ---------------- */
function sizeCanvas(){
  const cv=el("canvas"); if(!cv) return;
  const box=cv.parentNode; if(!box) return;
  const avail=Math.max(120,Math.round(box.clientWidth||box.getBoundingClientRect().width||VW));
  const w=(ZOOM==="fit")?avail:Math.max(avail,VW);
  cv.style.width=w+"px";
  cv.style.height=Math.round(w*VH/VW)+"px";
}
function stageA11y(){
  if(!LASTR) return "";
  const parts=LASTR.rooms.map((r,i)=>nodeName(r)+" "+sfmt(LASTR.p[i],1)+" Pa");
  return T("h_editor")+" · "+T("m_"+MODE)+" · "+parts.join(" · ");
}
function buildStage(host,app){
  const st=app.stage({
    minHeight:320,
    a11y:stageA11y,
    fit:()=>{ ZOOM=(ZOOM==="fit")?"1":"fit";
      try{ localStorage.setItem("luchtbalans_zoom",ZOOM); }catch(e){}
      sizeCanvas(); },
    render:()=>{ sizeCanvas(); }
  });
  STAGE=st;
  st.node.setAttribute("data-learn-topic","editor");
  const box=mk("div",{class:"lb-canvasbox"},
    '<svg id="canvas" viewBox="0 0 '+VW+' '+VH+'" role="group" aria-label="'+esc(T("h_editor"))+'"></svg>');
  st.body.appendChild(box);
  st.body.appendChild(mk("div",{class:"lb-edmsg",id:"edmsg",role:"status","aria-live":"polite"},""));
  st.body.appendChild(mk("div",{class:"lb-legend",id:"schemeLegend"},""));
  st.body.appendChild(hint("n_pan"));

  const cv=box.querySelector("#canvas");
  cv.addEventListener("pointerdown",onDown);
  cv.addEventListener("pointermove",onMove);
  cv.addEventListener("pointerup",onUp);
  cv.addEventListener("pointercancel",onUp);
  cv.addEventListener("keydown",onCanvasKey);
  renderScheme();
}

/* ---------------- the inspector: the studio detail region ----------------
   The same generated controls as the matching table row, wired to the same two
   handlers, so a value edited here is clamped, validated and recorded exactly as it
   is when edited in the table. */
function detRow(label,html){
  return '<label class="row"><span>'+esc(label)+'</span>'+html+'</label>';
}
function detOut(label,id,k){
  return '<div class="row"><span>'+esc(label)+'</span><b data-o="'+esc(id)+':'+k+'">—</b></div>';
}
function nodeInspector(n){
  const id=n.id, t=n.type;
  let s='<div class="row"><span>'+esc(T("c_code"))+'</span><b class="code">'+esc(id)+'</b></div>';
  s+=detRow(T("c_type"),'<select data-n="'+esc(id)+'" data-f="type" aria-label="'+esc(T("c_type")+" — "+id)+'">'+
     NTYPES.map(x=>'<option value="'+x+'"'+(x===t?' selected':'')+'>'+esc(T(NTKEY[x]))+'</option>').join("")+'</select>');
  s+=detRow(T("c_name"),'<input type="text" data-n="'+esc(id)+'" data-f="name" value="'+esc(nodeName(n))+
     '" aria-label="'+esc(T("c_name")+" — "+id)+'">');
  if(t==="room"){
    s+=detRow(T("c_vol"),inp("n",id,"V",num(n.V,0),"10"));
    s+=detRow(T("c_temp"),inp("n",id,"T",num(n.T,20),"1"));
    s+=detRow(T("c_rh"),inp("n",id,"RH",num(n.RH,50),"1"));
    s+=detRow(T("c_qh"),inp("n",id,"qh",num(n.qh,0),"250"));
    s+=detRow(T("c_qc"),inp("n",id,"qc",num(n.qc,0),"250"));
    s+=detRow(T("c_gm"),inp("n",id,"gm",num(n.gm,0),"0.0005"));
    s+=detRow(T("c_gc"),inp("n",id,"gc",num(n.gc,0),"0.00001"));
    s+=detRow(T("c_leak"),inp("n",id,"leak",num(n.leak,0),"0.005"));
    s+=detRow(T("c_rank"),inp("n",id,"rank",num(n.rank,1),"1"));
    s+=detRow(T("c_tgt"),inp("n",id,"tgt",num(n.tgt,0),"1"));
    s+='<div class="hd">'+esc(T("h_res"))+'</div>';
    s+=detOut(T("c_dp"),id,"dp")+detOut(T("c_net"),id,"net")+detOut(T("c_ach"),id,"ach")+
       detOut(T("c_t99"),id,"t99")+detOut(T("c_tcalc"),id,"tc")+detOut(T("c_rhcalc"),id,"rc")+
       detOut(T("c_ccalc"),id,"cc");
  } else {
    if(t!=="asink"){
      s+=detRow(T("c_temp"),inp("n",id,"T",num(n.T,20),"1"));
      s+=detRow(T("c_rh"),inp("n",id,"RH",num(n.RH,50),"1"));
    }
    if(isActive(n)){
      s+=detRow(T("c_setq"),inp("n",id,"Q",num(n.Q,0),"100"));
      s+=detRow(T("c_mult")+" · "+T("m_"+MODE),inp("n",id,"mult",num((n.m||{})[MODE],1),"0.05"));
    }
    s+='<div class="hd">'+esc(T("h_res"))+'</div>';
    s+=detOut(T("c_net"),id,"net")+detOut(T("c_src"),id,"src");
  }
  return s;
}
function linkInspector(L){
  const id=L.id, act=activeLink(L);
  const opts=(sel)=>NODES.map(n=>'<option value="'+esc(n.id)+'"'+(n.id===sel?' selected':'')+'>'+
    esc(n.id)+' · '+esc(clip(nodeName(n),22))+'</option>').join("");
  let s='<div class="row"><span>'+esc(T("c_link"))+'</span><b class="code">'+esc(id)+'</b></div>';
  s+=detRow(T("c_from"),'<select data-k="'+esc(id)+'" data-f="a" aria-label="'+esc(T("c_from")+" — "+id)+'">'+opts(L.a)+'</select>');
  s+=detRow(T("c_to"),'<select data-k="'+esc(id)+'" data-f="b" aria-label="'+esc(T("c_to")+" — "+id)+'">'+opts(L.b)+'</select>');
  s+=detRow(T("c_ltype"),'<select data-k="'+esc(id)+'" data-f="t" aria-label="'+esc(T("c_ltype")+" — "+id)+'">'+
     LTYPES.map(x=>'<option value="'+x+'"'+(x===L.t?' selected':'')+'>'+esc(T(TKEY[x]))+'</option>').join("")+'</select>');
  s+=detRow(T("c_area"),inp("k",id,"A",num(L.A,0),"0.05"));
  if(!act){
    s+=detRow(T("c_gap"),inp("k",id,"gap",num(L.gap,0),"0.005"));
    s+=detRow(T("c_cd"),inp("k",id,"cd",num(L.cd,0.6),"0.01"));
    s+=detRow(T("c_h"),inp("k",id,"h",num(L.h,0),"0.1"));
    s+=detRow(T("c_phi")+" · "+T("m_"+MODE),inp("k",id,"phi",num(L.f[MODE],0),"0.05"));
    s+=detRow(T("c_req"),'<select data-k="'+esc(id)+'" data-f="req" aria-label="'+esc(T("c_req")+" — "+id)+'">'+
       ["auto","ab","ba","none"].map(v=>'<option value="'+v+'"'+(v===L.req?' selected':'')+'>'+esc(T("r_"+v))+
       '</option>').join("")+'</select>');
  }
  s+='<div class="hd">'+esc(T("h_res"))+'</div>';
  s+=detOut(T("c_dpl"),id,"dpl")+detOut(T("c_q"),id,"q")+detOut(T("c_vel"),id,"vel")+
     detOut(T("c_at"),id,"at")+detOut(T("c_arh"),id,"arh")+detOut(T("c_ac"),id,"ac")+
     detOut(T("c_dir"),id,"dir");
  return s;
}
function detailSig(){
  const n=SELN?byId(SELN):null, L=SELL?linkById(SELL):null;
  if(n) return "n:"+n.id+":"+n.type+":"+MODE+":"+LANG;
  if(L) return "k:"+L.id+":"+(activeLink(L)?"a":"p")+":"+NODES.map(x=>x.id).join(",")+":"+MODE+":"+LANG;
  return "none:"+LANG;
}
function renderDetail(force){
  const box=el("lb-detail")||DETBOX; if(!box) return;
  const sig=detailSig();
  if(!force&&sig===DETSIG) return;
  DETSIG=sig;
  const n=SELN?byId(SELN):null, L=SELL?linkById(SELL):null;
  /* the one destructive control on the page: disabled, not hidden, when there is
     nothing under it */
  const del=el("lb-detdel");
  if(del) del.disabled=!(n||L);
  if(n) box.innerHTML=nodeInspector(n);
  else if(L) box.innerHTML=linkInspector(L);
  else box.innerHTML='<p class="dgu-hint">'+esc(T("n_sel"))+'</p>';
  applyOut();
}

function tableBox(id,thId,tbId,hintId){

function drawCharts(){

function chartStage(app,hostId,legId,altId,cfgName,titleKey,noteKey,topic){

  st.body.appendChild(mk("div",{id:hostId}));

/* ---------------- panels ---------------- */
/* The unit slot takes a string, not a thunk, and the framework would convert a unit
   it knows (Pa to kPa, m to mm) for display; declaring the same unit as the display
   unit keeps the number the one the tool has always shown. relabelUnits() re-reads
   them when the language changes, because the panel definitions outlive the rebuild. */
function envField(key,learn){
  const lim=ELIM[key], u=unitOf("l_"+key.slice(2))();
  return {id:"f-"+key, key:"env."+key, type:"number", step:lim[2],
    label:labelOf("l_"+key.slice(2)), unit:u, display:u, learn:learn,
    hint:()=>lim[0]+" … "+lim[1]};
}
function relabelUnits(panels){
  (panels||[]).forEach(p=>{ (p.fields||[]).forEach(f=>{
    if(!f.key||f.key.indexOf("env.")!==0) return;
    const u=unitOf("l_"+f.key.slice(6))();
    f.unit=u; f.display=u;
  }); });
}
function panelDefs(){
  return [
    {slot:"inputs", id:"lb-mode", title:()=>T("h_mode"), learn:"mode",
     fields:[{id:"f-mode", key:"mode", type:"segmented", label:()=>T("h_mode"),
              options:()=>MODES.map(m=>[m,T("m_"+m)])}]},
    {slot:"inputs", id:"lb-add", title:()=>T("h_add"), learn:"editor",
     render:(box)=>{
       const row=mk("div",{class:"dgu-panel-actions"});
       [["room","b_addroom"],["psup","b_addpsup"],["asup","b_addasup"],
        ["psink","b_addpsink"],["asink","b_addasink"]].forEach(a=>{
         const b=mk("button",{type:"button",class:"dgu-btn"},esc(T(a[1])));
         b.addEventListener("click",()=>{ hist(); addNode(a[0]); });
         row.appendChild(b);
       });
       box.appendChild(row);
       const row2=mk("div",{class:"dgu-panel-actions"});
       const bd=mk("button",{type:"button",class:"dgu-btn danger",id:"lb-detdel"},esc(T("b_delsel")));
       bd.addEventListener("click",()=>{ hist(); deleteSelected(); });
       const ba=mk("button",{type:"button",class:"dgu-btn ghost"},esc(T("b_arrange")));
       ba.addEventListener("click",()=>{ hist(); arrange(); });
       row2.appendChild(bd); row2.appendChild(ba);
       box.appendChild(row2);
       box.appendChild(hint("n_kbd"));
     }},
    {slot:"inputs", id:"lb-glob", title:()=>T("h_glob"), learn:"global", note:()=>T("n_glob"),
     fields:["i_rho","i_tout","i_rhout","i_cdleak","i_tol","i_vmax","i_dpmax"]
       .map(k=>envField(k,k==="i_rho"||k==="i_cdleak"?"global":"tolerance"))},
    {slot:"inputs", id:"lb-capt", title:()=>T("h_capt"), learn:"capture", note:()=>T("n_capt"),
     fields:["i_cq","i_ca","i_cx"].map(k=>envField(k,"capture"))},
    /* the placement law: Reset in the inputs footer, under the name the tool gave it,
       because what it restores is the worked example it opens with */
    {slot:"inputs", id:"lb-reset",
     render:(box,ctx)=>{
       const row=mk("div",{class:"dgu-panel-actions"});
       row.appendChild(ctx.app.actionButton({label:()=>T("b_reset"),variant:"ghost",
         run:()=>{ hist(); ctx.app.reset(); }}));
       box.appendChild(row);
     }},

    /* the studio's detail region: whatever is selected in the drawing */
    {slot:"detail", id:"lb-detail-p", title:()=>T("h_sel"), learn:"selection",
     render:(box)=>{
       const d=mk("div",{class:"lb-det",id:"lb-detail"});
       box.appendChild(d);
       DETBOX=d;
       d.addEventListener("input",onNodeInput);
       d.addEventListener("change",onNodeChange);

/* ---------------- edit handlers, shared by the tables and the inspector -------
   The table row and the inspector carry the same data-n / data-k and data-f pair, so
   an edit made in one is written into the other: the two surfaces mirror the model,
   and the model, in both directions, exactly as the drawing and the tables already
   did before the port. */
function mirror(t){
  const kind=t.getAttribute("data-n")?"n":"k";
  const id=t.getAttribute("data-"+kind), f=t.getAttribute("data-f");
  if(!id||!f) return;
  document.querySelectorAll('[data-'+kind+'="'+CSS.escape(id)+'"][data-f="'+CSS.escape(f)+'"]')
    .forEach(o=>{ if(o!==t&&o.value!==t.value) o.value=t.value; });
}

function onNodeInput(ev){
  const t=ev.target, id=t.getAttribute&&t.getAttribute("data-n"), f=t.getAttribute("data-f");
  if(!id||!f) return;
  const n=byId(id); if(!n) return;
  editStart(t);
  SELN=id; SELL=null; markSel(); mirror(t);
  if(f==="name"){ n.key=null; n.name=t.value;
    document.querySelectorAll('#tbLinks select[data-f="a"] option[value="'+id+'"],#tbLinks select[data-f="b"] option[value="'+id+'"]')
      .forEach(o=>{ o.textContent=id+" · "+clip(nodeName(n),22); });
    renderScheme(); return; }
  if(f==="type") return;
  setNodeField(n,f,t.value); run();
}
function onNodeChange(ev){
  const t=ev.target, id=t.getAttribute&&t.getAttribute("data-n"), f=t.getAttribute("data-f");
  if(!id||!f) return;
  const n=byId(id); if(!n) return;
  if(f!=="type") return;          /* the value already went through onNodeInput */
  const nt=t.value;
  if(nt===n.type) return;
  if(n.type==="room"&&rooms().length<=1){ msg("e_r1"); redrawTables(); return; }
  hist();
  n.type=nt; n.key=null; if(!n.name) n.name=n.id;
  if(nt==="room"){ if(n.V===undefined) n.V=500; if(n.leak===undefined) n.leak=0.05;
    if(n.rank===undefined) n.rank=rooms().length; if(n.tgt===undefined) n.tgt=0;
    ["qh","qc","gm","gc"].forEach(k=>{ if(n[k]===undefined) n[k]=0; }); }
  if(nt==="asup"||nt==="asink"){ if(n.Q===undefined) n.Q=3000; n.m=copyM(MDEF[nt]); }
  if(n.T===undefined) n.T=20; if(n.RH===undefined) n.RH=50;
  /* connections that became impossible are dropped */
  LINKS=LINKS.filter(L=>{
    const A=byId(L.a), B=byId(L.b);
    if(!A||!B) return false;
    if(!isRoom(A)&&!isRoom(B)) return false;
    return true;
  });
  const seen={};
  LINKS=LINKS.filter(L=>{
    const A=byId(L.a), B=byId(L.b);
    if(isActive(A)){ if(seen["a"+A.id]) return false; seen["a"+A.id]=1; }
    if(isActive(B)){ if(seen["a"+B.id]) return false; seen["a"+B.id]=1; }
    return true;
  });
  LINKS.forEach(L=>{ const A=byId(L.a), B=byId(L.b);
    if(isActive(A)||isActive(B)){ L.t="duct"; L.req="none"; MODES.forEach(m=>{L.f[m]=1;});
      if(isActive(B)&&B.type==="asup"){ const x=L.a; L.a=L.b; L.b=x; }
      if(isActive(A)&&A.type==="asink"){ const x=L.a; L.a=L.b; L.b=x; } } });
  SELN=id; rebuild();
}
function onNodeFocus(ev){
  const id=ev.target.getAttribute&&ev.target.getAttribute("data-n");
  if(id){ SELN=id; SELL=null; markSel(); renderScheme(); }
}
function onLinkInput(ev){
  const t=ev.target, id=t.getAttribute&&t.getAttribute("data-k"), f=t.getAttribute("data-f");
  if(!id||!f) return;
  const L=linkById(id); if(!L) return;
  if(f==="a"||f==="b"||f==="t"||f==="req") return;
  editStart(t);
  SELL=id; SELN=null; markSel(); mirror(t);
  setLinkField(L,f,t.value); run();
}
function onLinkChange(ev){
  const t=ev.target, id=t.getAttribute&&t.getAttribute("data-k"), f=t.getAttribute("data-f");
  if(!id||!f) return;
  const L=linkById(id); if(!L) return;
  if(f!=="a"&&f!=="b"&&f!=="t"&&f!=="req") return;  /* went through onLinkInput */
  hist();
  if(f==="a"||f==="b"){
    const old=L[f]; L[f]=t.value;
    const A=byId(L.a), B=byId(L.b);
    let bad=null;
    if(L.a===L.b) bad="e_l1";
    else if(!isRoom(A)&&!isRoom(B)) bad="e_l2";
    else if(LINKS.some(o=>o!==L&&((o.a===L.a&&o.b===L.b)||(o.a===L.b&&o.b===L.a)))) bad="e_l4";
    else if((isActive(A)&&linkCount(L.a)>1)||(isActive(B)&&linkCount(L.b)>1)) bad="e_l3";
    if(bad){ L[f]=old; msg(bad); redrawTables(); return; }
    msg("");
    const A2=byId(L.a), B2=byId(L.b);
    if(isActive(A2)||isActive(B2)){ L.t="duct"; L.req="none"; MODES.forEach(m=>{L.f[m]=1;});
      if(isActive(B2)&&B2.type==="asup"){ const x=L.a; L.a=L.b; L.b=x; }
      if(isActive(A2)&&A2.type==="asink"){ const x=L.a; L.a=L.b; L.b=x; } }
    else if(L.t==="duct"){ L.t="door"; }
  } else { L[f]=t.value; }
  SELL=id; SELN=null; rebuild();
}
function onLinkFocus(ev){
  const id=ev.target.getAttribute&&ev.target.getAttribute("data-k");
  if(id){ SELL=id; SELN=null; markSel(); renderScheme(); }
}

/* ---------------- language ---------------- */
function applyLang(){
  document.documentElement.lang=LANG;
  document.title=T("ttl");
  if(UI){
    if(UI.lang!==LANG){ UI.setLang(LANG); return; }   /* rebuild redraws everything */
    UI.sync();
    keepFocus(()=>{ renderTables(); renderAsm(); renderDetail(true); run(); });
    return;
  }
  if(BARE){ syncBare(); renderTables(); run(); }
}
function initLang(){
  /* precedence is ?lang= -> localStorage.diagram_lang -> browser -> en, which the
     shared bootstrap has already resolved into window.__diagramLang */
  let l=window.__diagramLang||null;
  if(!l){ try{ l=new URLSearchParams(location.search).get("lang"); }catch(e){} }
  if(!l){ try{ l=localStorage.getItem("diagram_lang"); }catch(e){} }
  if(!l){ l=((navigator.language||"en").slice(0,2)||"en").toLowerCase(); }
  LANG=I18N[l]?l:"en";
}

/* ---------------- events ---------------- */
function setNodeField(n,f,v){
  const lim=NLIM[f]||[null,null];
  if(f==="mult"){ if(!n.m) n.m={}; n.m[MODE]=clampNum(v,lim[0],lim[1],1); return; }
  n[f]=clampNum(v,lim[0],lim[1],f==="RH"?50:0);
}
function setLinkField(L,f,v){
  const lim=LLIM[f]||[null,null];
  if(f==="phi"){ L.f[MODE]=clampNum(v,0,1,0); return; }
  L[f]=clampNum(v,lim[0],lim[1],0);
}

/* the whole drawing, for undo and redo */
function snapshot(){
  return JSON.stringify({mode:MODE,env:STATE.env,nodes:NODES,links:LINKS,sel:{n:SELN,l:SELL}});
}
function restore(snap){
  let o=null; try{ o=JSON.parse(snap); }catch(e){ return; }
  if(!o) return;
  setMode(MODES.indexOf(o.mode)>=0?o.mode:MODE);
  Object.keys(o.env||{}).forEach(k=>{ STATE.env[k]=o.env[k]; });
  NODES=o.nodes; LINKS=o.links;
  SELN=(o.sel&&o.sel.n)||null; SELL=(o.sel&&o.sel.l)||null;
  renderTables(); markSel(); renderDetail(true);
}

function boot(){
  defaultModel();
  initLang();
  if(!window.DiagramUI||DiagramUI.api!=="tools.petrov.re/ui/v1"){ bootBare(); dgcInit(); return; }
  const PANELS=panelDefs();
  UI=DiagramUI.app({
    id:"luchtbalans", mount:"#app", layout:"studio", compute:"live",
    lang:LANG, state:STATE, density:"comfortable",
    defaults:()=>({mode:"prod",env:Object.assign({},ENVD)}),
    subtitle:()=>T("sub"),

    learn:learnData(),
    panels:PANELS,
    regions:{stage:(host,app)=>buildStage(host,app)},
    footer:(host,app)=>buildFooter(host,app),
    on:{
      compute:(s,app)=>{ live(app); setMode(s.mode||MODE); compute(); return buildResults(); },
      change:(key,v,app)=>{ live(app); if(key==="mode"){ keepFocus(()=>{ renderTables(); }); } },
      reset:(fresh,app)=>{ live(app); STATE=fresh; setMode(fresh.mode); defaultModel();
                           msg(""); DETSIG=""; renderTables(); renderDetail(true); },
      lang:(code)=>{ LANG=code; closeMdl(); relabelUnits(PANELS); },

/* The framework appends its results panel after every panel the tool declared, so
   the answer would sit under the two tables. The placement law puts it first. */
function orderResults(app){
  const host=app.regions&&app.regions.results;
  const view=app.resultsView&&app.resultsView.node;
  if(!host||!view||view.parentNode!==host) return;
  if(host.firstChild!==view) host.insertBefore(view,host.firstChild);
}
/* everything that has to happen once the regions exist, on boot and after every
   language rebuild */
function afterRender(app){
  /* the framework's own results panel carries no learn affordance; the topic is the
     tool's, so the tool hangs it on the heading the framework drew */
  const rv=app.resultsView&&app.resultsView.node;
  if(rv&&!rv.querySelector(".dgu-q")){
    rv.setAttribute("data-learn-topic","results");
    const h=rv.querySelector(".dgu-panel-h");
    if(h) h.appendChild(app.learnButton("results"));
  }
  if(!CH1S) CH1S=chartStage(app,"chart1","lgd1","alt1","CH1","h_chart1","n_chart1","charts");
  if(!CH2S) CH2S=chartStage(app,"chart2","lgd2","alt2","CH2","h_chart2","n_chart2","capchart");
  renderTables(); markSel(); applyOut(); renderDetail(true); updScroll();
  renderScheme(); sizeCanvas(); drawCharts();
}
function bindGlobal(){
  /* category and status badges: real buttons, so click, Enter and Space all arrive here */
  document.addEventListener("click",(ev)=>{
    const t=ev.target;
    const b=(t&&t.closest)?t.closest("[data-cat],[data-st]"):null;
    if(!b) return;
    ev.preventDefault();
    const c=b.getAttribute("data-cat");
    showMdl(c!==null?"cat":"st", c!==null?c:b.getAttribute("data-st"));
  });
  document.addEventListener("keydown",(ev)=>{
    if(ev.key!=="Delete"&&ev.key!=="Backspace") return;
    const a=document.activeElement;
    if(a&&(a.tagName==="INPUT"||a.tagName==="SELECT"||a.tagName==="TEXTAREA")) return;
    if(SELN||SELL){ ev.preventDefault(); hist(); deleteSelected(); }
  });
  document.addEventListener("scroll",updScroll,true);
  window.addEventListener("resize",()=>{ renderScheme(); sizeCanvas(); updScroll(); });
  /* the drawing and the two charts paint the token colours into their own SVG, so a
     theme change has to redraw them; nothing else on the page holds a colour */
  if(window.DiagramUI&&DiagramUI.theme&&DiagramUI.theme.watch)
    DiagramUI.theme.watch(()=>{ run(); });
  updScroll();
}

/* ==================== without diagram-ui.js ====================
   The file can be blocked, 404 or stale. The physics, the record, the permalink, the
   report, the python export and the shared bar all live below it, so the page still
   works: it draws its own plain form, its own drawing and its own tables, and it
   carries a language control of its own because the one it would have used is in
   the file that is missing. */
let BARE=false, BAREF=[];
function bareField(host,key){
  const lim=ELIM[key], id="b-"+key;
  const wrap=mk("div",{class:"lb-det"});
  const lab=mk("label",{class:"row",for:id},'<span>'+esc(T("l_"+key.slice(2)))+'</span>');
  const i=mk("input",{type:"number",id:id,step:lim[2],min:lim[0],max:lim[1]});
  i.value=String(STATE.env[key]);
  i.addEventListener("input",()=>{ STATE.env[key]=i.value===""?null:parseFloat(i.value); run(); });
  lab.appendChild(i); wrap.appendChild(lab); host.appendChild(wrap);
  BAREF.push([key,i]);
}
function syncBare(){
  BAREF.forEach(f=>{ const v=STATE.env[f[0]]; if(v!==null&&v!==undefined) f[1].value=String(v); });
}
/* The token layer is published by diagram-ui.js, which is the file that is missing,

   never injected when the framework is present, and nothing in the ported page reads
   it. Without it the drawing loses the colour that tells overpressure from

const BARE_TOKENS=
 ":root{--bg:#f6f8fb;--panel:#fff;--panel-2:#f2f5fa;--ink:#12161d;--muted:#5b6675;"+

  box.appendChild(mk("div",{class:"offscreen","aria-hidden":"true"},'<div id="val-out" hidden></div>'));
  const foot=mk("div"); box.appendChild(foot); buildFooter(foot,null);
  /* the shared chrome docks itself to the bottom of the viewport and diagram-ui.js,
     which normally reserves that room, is the file that is missing */
  document.body.style.paddingBottom="96px";
  renderTables(); run();
  bindGlobal();
}

/* ==================== framework v2 (diagram-common.js) ==================== */
const DGC_LANGS=['en','uk','de','nl','fr','es','pl'];
const DGC_ENVF=["i_rho","i_cdleak","i_tout","i_rhout","i_tol","i_vmax","i_dpmax","i_cq","i_ca","i_cx"];
/* the model, in one place: the calculation record reports it and the footer shows it */
const DGC_EQ=["Opening law (orifice, incompressible): Q = Cd*A_e*sqrt(2*dp/rho_ref), i.e. the power law Q = C*dp^n with n = 1/2 and C = Cd*A_e*sqrt(2/rho_ref)",
      "Effective opening area over the operating modes: A_e = phi*A + (1 - phi)*A_gap, phi the open fraction of the connection in that mode",
      "Thermal draught across a connection with height offset h: dp_th = g*h*(rho(T_b) - rho(T_a)); the pressure argument of the opening law is dp = p_a - p_b + dp_th",
      "Regularised square root used by the solver: f(dp) = dp/sqrt(delta) for |dp| < delta and sign(dp)*sqrt(|dp|) otherwise, delta = 0.04 Pa",
      "Envelope leakage of a room: Q_leak = Cd_leak*A_leak*sqrt(2/rho_ref)*f(p_room)",
      "Zone (node) balance: SUM(imposed supply) - SUM(imposed extract) - SUM(Q through every connection of the zone) - Q_leak = 0, solved simultaneously for every room pressure",
      "Envelope identity: SUM(supply) - SUM(extract) = net volume flow through the envelope, i.e. through the passive openings plus the room leakages",
      "Air density: rho(T) = p_atm/(R_s*(T + 273.15)), p_atm = 101325 Pa, R_s = 287.05 J/(kg.K)",
      "Steady well-mixed room state: SUM(Q_in*x_in) + G = Q_out*x_room for temperature, humidity ratio and contaminant, solved as one linear system over the whole network",
      "Air change rate of a room: n = 3600*Q_out/V"];

/* the ten page-level numbers exactly as the user entered them: the record reports
   what was typed, and gv() reports what was used */
function dgcEnv(){ const o={}; DGC_ENVF.forEach(k=>{ o[k]=num(STATE.env[k],0); }); return o; }
function dgcSerialize(){
  return {v:2,lang:LANG,mode:MODE,env:dgcEnv(),
    nodes:NODES.map(n=>JSON.parse(JSON.stringify(n))),
    links:LINKS.map(L=>JSON.parse(JSON.stringify(L))),
    sel:{n:SELN,l:SELL}};
}
function dgcDeserialize(st){
  if(!st||typeof st!=="object")throw new Error("unrecognised state payload");
  if(!Array.isArray(st.nodes)||!Array.isArray(st.links))throw new Error("state carries no diagram");
  if(st.lang&&I18N[st.lang]) LANG=st.lang;
  if(st.mode&&MODES.indexOf(st.mode)>=0) setMode(st.mode);
  if(st.env) DGC_ENVF.forEach(k=>{ if(st.env[k]!==undefined) STATE.env[k]=st.env[k]; });
  NODES=st.nodes.map(n=>JSON.parse(JSON.stringify(n)));
  LINKS=st.links.map(L=>JSON.parse(JSON.stringify(L)));
  NODES.forEach(n=>{ if(n.type==="asup"||n.type==="asink"){ if(!n.m)n.m=fmode(1);
      MODES.forEach(m=>{ if(n.m[m]===undefined)n.m[m]=1; }); } });
  LINKS.forEach(L=>{ if(!L.f)L.f=fmode(1); MODES.forEach(m=>{ if(L.f[m]===undefined)L.f[m]=1; }); });
  SELN=(st.sel&&st.sel.n)||null; SELL=(st.sel&&st.sel.l)||null;
  DETSIG="";
  applyLang();
  return null;
}
function dgcWarn(){
  const w=[]; if(!LASTR) return w;
  const R=LASTR;
  if(!R.finite) w.push(T("dgc_w_nonfinite"));
  if(R.res>=TOL_SOLVE&&R.it>=200) w.push(T("dgc_w_conv"));
  const noOut=R.rooms.filter((r,i)=>R.outflow[i]<=1e-9);
  if(noOut.length) w.push(T("dgc_w_nosteady").replace("%s",noOut.map(r=>nodeName(r)).join(", ")));
  let small=0;
  R.flows.forEach(f=>{ if(!f.active&&f.dp!==null&&Math.abs(f.dp)<DELTA) small++; });
  if(small) w.push(T("dgc_w_delta").replace("%s",String(small)));
  if(CLAMPED) w.push(T("dgc_w_clamped"));
  return w;
}
function dgcRecord(){
  if(!LASTR) return null;
  const R=LASTR, env=dgcEnv();
  const fmap={}; R.flows.forEach(f=>{ const L=LINKS[f.li]; if(L)fmap[L.id]=f; });
  const inputs={mode:MODE,reference_density:env.i_rho,leak_discharge_coefficient:env.i_cdleak,
    outdoor_temperature:env.i_tout,outdoor_relative_humidity:env.i_rhout,
    target_pressure_step:env.i_tol,maximum_opening_velocity:env.i_vmax,
    maximum_pressure:env.i_dpmax,
    rooms:R.rooms.map(r=>({id:r.id,name:nodeName(r),volume:num(r.V,0),temperature:num(r.T,20),
      leakage_area:num(r.leak,0),rank:num(r.rank,0),target_pressure:num(r.tgt,0)})),
    units_active:NODES.filter(n=>isActive(n)).map(n=>({id:n.id,name:nodeName(n),type:n.type,
      flow:num(n.Q,0),multiplier:num((n.m||{})[MODE],1),temperature:num(n.T,20)})),
    ambient_nodes:NODES.filter(n=>isAmb(n)).map(n=>({id:n.id,name:nodeName(n),type:n.type,
      temperature:num(n.T,20)})),
    connections:LINKS.map(L=>({id:L.id,from:L.a,to:L.b,type:L.t,area:num(L.A,0),
      gap_area:num(L.gap,0),discharge_coefficient:num(L.cd,0.6),height_offset:num(L.h,0),
      open_fraction:num(L.f[MODE],0),required_direction:reqDir(L)}))};
  let supTot=0,extTot=0;
  NODES.forEach(n=>{ const q=Math.max(0,num(n.Q,0))*Math.max(0,num((n.m||{})[MODE],1));
    if(n.type==="asup")supTot+=q; else if(n.type==="asink")extTot+=q; });
  const pressures={}, achs={};
  R.rooms.forEach((r,i)=>{ pressures[r.id]=R.p[i];
    achs[r.id]=R.outflow[i]*3600/Math.max(1,num(r.V,1)); });
  const flows={}, vels={}, dps={};
  LINKS.forEach(L=>{ const f=fmap[L.id]; if(!f)return;
    flows[L.id]=f.q*3600; vels[L.id]=f.v; dps[L.id]=f.dp===null?null:f.dp; });
  const zone={}; R.rooms.forEach((r,i)=>{ zone[r.id]=R.net[i]; });
  R.flows.forEach(f=>{ if(f.active)return; const L=LINKS[f.li]; if(!L)return;
    const A=byId(L.a),B=byId(L.b);
    if(isRoom(A))zone[A.id]-=f.q; if(isRoom(B))zone[B.id]+=f.q; });
  R.leaks.forEach(k=>{ const r=R.rooms[k.i]; if(r)zone[r.id]-=k.q; });
  let worstZone=0; Object.keys(zone).forEach(k=>{ worstZone=Math.max(worstZone,Math.abs(zone[k])); });
  /* every output is a scalar: a record must flatten to key/value/unit */
  const outputs={};
  Object.keys(pressures).forEach(k=>{ outputs["pressure_"+k]=pressures[k]; });
  Object.keys(achs).forEach(k=>{ outputs["air_change_"+k]=achs[k]; });
  Object.keys(flows).forEach(k=>{ outputs["flow_"+k]=flows[k]; });
  Object.keys(vels).forEach(k=>{ outputs["velocity_"+k]=vels[k]; });
  Object.keys(dps).forEach(k=>{ outputs["dp_"+k]=dps[k]; });
  Object.assign(outputs,{total_supply:supTot,total_extract:extTot,
    envelope_net_flow:R.envOut*3600,envelope_imbalance:R.imb*3600,
    worst_zone_residual:worstZone*3600,solver_residual:R.res*3600,solver_iterations:R.it,
    worst_room_pressure:R.p.reduce((a,b)=>Math.max(a,Math.abs(b)),0)});
  R.rooms.forEach((r,i)=>{ outputs["leak_flow_"+r.id]=(R.leaks.find(k=>k.i===i)||{q:0}).q*3600; });
  const units={reference_density:"kg/m3",outdoor_temperature:"degC",
    outdoor_relative_humidity:"%",target_pressure_step:"Pa",maximum_opening_velocity:"m/s",
    maximum_pressure:"Pa",leak_discharge_coefficient:"-",
    total_supply:"m3/h",total_extract:"m3/h",envelope_net_flow:"m3/h",
    envelope_imbalance:"m3/h",worst_zone_residual:"m3/h",solver_residual:"m3/h",
    solver_iterations:"-",worst_room_pressure:"Pa"};
  Object.keys(pressures).forEach(k=>{ units["pressure_"+k]="Pa"; units["air_change_"+k]="1/h";
    units["leak_flow_"+k]="m3/h"; });
  Object.keys(flows).forEach(k=>{ units["flow_"+k]="m3/h"; units["velocity_"+k]="m/s";
    units["dp_"+k]="Pa"; });
  return {inputs:inputs,outputs:outputs,units:units,
    model:{equations:DGC_EQ.slice(),

      ranges:[T("dgc_r_1"),T("dgc_r_2"),T("dgc_r_3"),T("dgc_r_4")],
      notes:[T("dgc_n_1"),T("dgc_n_2"),T("dgc_n_3")]},
    warnings:dgcWarn()};
}
function dgcSections(){
  if(!LASTR) return [];
  const R=LASTR, fmap={};
  R.flows.forEach(f=>{ const L=LINKS[f.li]; if(L)fmap[L.id]=f; });
  const rrows=R.rooms.map((r,i)=>[nodeName(r),fmt(num(r.V,0),0),fmt(num(r.T,20),1),
    fmt(R.p[i],2),fmt(R.outflow[i]*3600,0),fmt(R.outflow[i]*3600/Math.max(1,num(r.V,1)),2)]);
  const lrows=LINKS.map(L=>{ const f=fmap[L.id];
    return [L.id,nameOf(L.a)+" \u2192 "+nameOf(L.b),T(TKEY[L.t]),fmt(num(L.A,0),3),
      fmt(num(L.cd,0.6),2),f?fmt(f.q*3600,0):"\u2014",f?fmt(f.v,2):"\u2014",
      (f&&f.dp!==null)?fmt(f.dp,2):"\u2014"];});
  const mrows=MODES.map(m=>[T("m_"+m)].concat(R.rooms.map((r,i)=>fmt(ALL[m].p[i],2))));
  return [
    {title:T("h_blocks"),cols:"1.4fr .7fr .6fr .7fr .8fr .7fr",
     head:[T("c_name"),T("c_vol"),T("c_temp"),"p (Pa)","Q (m\u00b3/h)","n (1/h)"],rows:rrows},
    {title:T("h_links"),cols:"0.6fr 1.6fr 0.9fr .6fr .5fr .8fr .6fr .7fr",
     head:["ID",T("c_link"),T("c_ltype"),"A (m\u00b2)","Cd","Q (m\u00b3/h)","v (m/s)","dp (Pa)"],
     rows:lrows},
    {title:T("h_matrix"),cols:"1fr "+R.rooms.map(()=>"1fr").join(" "),
     head:[T("h_mode")].concat(R.rooms.map(r=>r.id)),rows:mrows}
  ];
}
function dgcHandoff(){
  if(!LASTR) return null;
  let supTot=0;
  NODES.forEach(n=>{ if(n.type==="asup")
    supTot+=Math.max(0,num(n.Q,0))*Math.max(0,num((n.m||{})[MODE],1)); });
  return {quantities:{Vdot:{value:supTot/3600,unit:"m3/s"},
    dp:{value:LASTR.p.reduce((a,b)=>Math.abs(a)>Math.abs(b)?a:b,0),unit:"Pa"}}};
}
function dgcPython(){
  if(!LASTR) return null;
  const env=dgcEnv();
  const nodes=NODES.map(n=>({id:n.id,type:n.type,T:num(n.T,20),Q:num(n.Q,0),
    leak:num(n.leak,0),V:num(n.V,0),m:(n.m?num(n.m[MODE],1):1)}));
  const links=LINKS.map(L=>({id:L.id,a:L.a,b:L.b,A:num(L.A,0),gap:num(L.gap,0),
    cd:num(L.cd,0.6),h:num(L.h,0),f:num(L.f[MODE],0)}));
  const code=
"# ---- the diagram, exactly as it stood at export time ---------------------\n"+
"NODES = "+JSON.stringify(nodes)+"\n"+
"LINKS = "+JSON.stringify(links)+"\n"+
"G = 9.81\nPATM = 101325.0\nRS = 287.05\nDELTA = 0.04   # regularisation window of the opening law, Pa\n"+
"RHO_REF = REFERENCE_DENSITY\nCD_LEAK = LEAK_DISCHARGE_COEFFICIENT\nT_OUT = OUTDOOR_TEMPERATURE\n\n\n"+
"def rho(t_c):\n"+
"    return PATM/(RS*(t_c + 273.15))\n\n\n"+
"def fq(d):\n"+
"    \"\"\"Square-root opening law, straightened below DELTA so the Jacobian stays finite.\"\"\"\n"+
"    a = abs(d)\n"+
"    if a < DELTA:\n"+
"        return d/math.sqrt(DELTA)\n"+
"    return math.copysign(math.sqrt(a), d)\n\n\n"+
"def fqd(d):\n"+
"    a = abs(d)\n"+
"    return 1/math.sqrt(DELTA) if a < DELTA else 0.5/math.sqrt(a)\n\n\n"+
"def build():\n"+
"    by = {n['id']: n for n in NODES}\n"+
"    rooms = [n for n in NODES if n['type'] == 'room']\n"+
"    idx = {r['id']: i for i, r in enumerate(rooms)}\n"+
"    net = [0.0]*len(rooms)\n"+
"    edges, active = [], []\n"+
"    for li, L in enumerate(LINKS):\n"+
"        A, B = by.get(L['a']), by.get(L['b'])\n"+
"        if A is None or B is None:\n"+
"            continue\n"+
"        if A['type'] in ('asup', 'asink') or B['type'] in ('asup', 'asink'):\n"+
"            av = A if A['type'] in ('asup', 'asink') else B\n"+
"            rm = B if av is A else A\n"+
"            if rm['type'] != 'room':\n"+
"                continue\n"+
"            q = max(0.0, av['Q'])*max(0.0, av['m'])/3600.0\n"+
"            into = av['type'] == 'asup'\n"+
"            net[idx[rm['id']]] += q if into else -q\n"+
"            qab = (q if into else -q) if av is A else (-q if into else q)\n"+
"            active.append(dict(li=li, q=qab, Ae=max(1e-6, L['A'])))\n"+
"            continue\n"+
"        f = min(1.0, max(0.0, L['f']))\n"+
"        Ae = f*max(0.0, L['A']) + (1 - f)*max(0.0, L['gap'])\n"+
"        edges.append(dict(li=li,\n"+
"                          ia=idx[A['id']] if A['type'] == 'room' else -1,\n"+
"                          ib=idx[B['id']] if B['type'] == 'room' else -1,\n"+
"                          C=max(0.0, L['cd'])*Ae*math.sqrt(2/RHO_REF), Ae=Ae,\n"+
"                          dth=G*L['h']*(rho(B['T']) - rho(A['T'])), leak=False))\n"+
"    for i, r in enumerate(rooms):\n"+
"        edges.append(dict(li=-1, ia=i, ib=-1,\n"+
"                          C=CD_LEAK*max(0.0, r['leak'])*math.sqrt(2/RHO_REF),\n"+
"                          Ae=max(0.0, r['leak']), dth=0.0, leak=True))\n"+
"    return rooms, idx, net, edges, active\n\n\n"+
"def solve():\n"+
"    \"\"\"Damped Newton on the zone balance, with the analytic Jacobian.\"\"\"\n"+
"    rooms, idx, net, edges, active = build()\n"+
"    n = len(rooms)\n"+
"    p = [0.0]*n\n"+
"    it = 0\n"+
"    res = 0.0\n"+
"    for it in range(200):\n"+
"        R = list(net)\n"+
"        J = [[0.0]*n for _ in range(n)]\n"+
"        for e in edges:\n"+
"            pa = 0.0 if e['ia'] < 0 else p[e['ia']]\n"+
"            pb = 0.0 if e['ib'] < 0 else p[e['ib']]\n"+
"            d = pa - pb + e['dth']\n"+
"            q, dq = e['C']*fq(d), e['C']*fqd(d)\n"+
"            if e['ia'] >= 0:\n"+
"                R[e['ia']] -= q\n"+
"                J[e['ia']][e['ia']] -= dq\n"+
"                if e['ib'] >= 0:\n"+
"                    J[e['ia']][e['ib']] += dq\n"+
"            if e['ib'] >= 0:\n"+
"                R[e['ib']] += q\n"+
"                J[e['ib']][e['ib']] -= dq\n"+
"                if e['ia'] >= 0:\n"+
"                    J[e['ib']][e['ia']] += dq\n"+
"        res = max([abs(x) for x in R] + [0.0])\n"+
"        if res < 1e-10:\n"+
"            break\n"+
"        M = [J[i][:] + [-R[i]] for i in range(n)]\n"+
"        for c in range(n):\n"+
"            pi = max(range(c, n), key=lambda r2: abs(M[r2][c]))\n"+
"            if abs(M[pi][c]) < 1e-14:\n"+
"                continue\n"+
"            M[c], M[pi] = M[pi], M[c]\n"+
"            for r2 in range(n):\n"+
"                if r2 == c:\n"+
"                    continue\n"+
"                fct = M[r2][c]/M[c][c]\n"+
"                if not fct:\n"+
"                    continue\n"+
"                for k in range(c, n + 1):\n"+
"                    M[r2][k] -= fct*M[c][k]\n"+
"        dx = [0.0 if abs(M[c][c]) < 1e-14 else M[c][n]/M[c][c] for c in range(n)]\n"+
"        mx = max([abs(x) for x in dx] + [0.0])\n"+
"        sc = 30/mx if mx > 30 else 1.0\n"+
"        p = [p[i] + dx[i]*sc for i in range(n)]\n"+
"    return rooms, idx, net, edges, active, p, it, res\n\n\n"+
"def compute():\n"+
"    by = {n['id']: n for n in NODES}\n"+
"    rooms, idx, net, edges, active, p, it, res = solve()\n"+
"    flows, leaks = [], []\n"+
"    for e in edges:\n"+
"        pa = 0.0 if e['ia'] < 0 else p[e['ia']]\n"+
"        pb = 0.0 if e['ib'] < 0 else p[e['ib']]\n"+
"        d = pa - pb + e['dth']\n"+
"        q = e['C']*fq(d)\n"+
"        if e['leak']:\n"+
"            leaks.append(dict(i=e['ia'], q=q))\n"+
"        else:\n"+
"            flows.append(dict(li=e['li'], dp=d, q=q, Ae=e['Ae'],\n"+
"                              v=abs(q)/e['Ae'] if e['Ae'] > 1e-9 else 0.0, active=False))\n"+
"    for a in active:\n"+
"        flows.append(dict(li=a['li'], dp=None, q=a['q'], Ae=a['Ae'],\n"+
"                          v=abs(a['q'])/a['Ae'], active=True))\n"+
"    flows.sort(key=lambda f: f['li'])\n"+
"    env_out = 0.0\n"+
"    for f in flows:\n"+
"        if f['active']:\n"+
"            continue\n"+
"        L = LINKS[f['li']]\n"+
"        A, B = by[L['a']], by[L['b']]\n"+
"        if B['type'] in ('psup', 'psink'):\n"+
"            env_out += f['q']\n"+
"        elif A['type'] in ('psup', 'psink'):\n"+
"            env_out -= f['q']\n"+
"    for k in leaks:\n"+
"        env_out += k['q']\n"+
"    outflow = [0.0]*len(rooms)\n"+
"    for f in flows:\n"+
"        L = LINKS[f['li']]\n"+
"        A, B = by[L['a']], by[L['b']]\n"+
"        if f['q'] > 0 and A['type'] == 'room':\n"+
"            outflow[idx[A['id']]] += f['q']\n"+
"        elif f['q'] < 0 and B['type'] == 'room':\n"+
"            outflow[idx[B['id']]] += -f['q']\n"+
"    for k in leaks:\n"+
"        if k['q'] > 0:\n"+
"            outflow[k['i']] += k['q']\n"+
"    zone = list(net)\n"+
"    for f in flows:\n"+
"        if f['active']:\n"+
"            continue\n"+
"        L = LINKS[f['li']]\n"+
"        A, B = by[L['a']], by[L['b']]\n"+
"        if A['type'] == 'room':\n"+
"            zone[idx[A['id']]] -= f['q']\n"+
"        if B['type'] == 'room':\n"+
"            zone[idx[B['id']]] += f['q']\n"+
"    for k in leaks:\n"+
"        zone[k['i']] -= k['q']\n"+
"    sup = sum(max(0.0, n['Q'])*max(0.0, n['m']) for n in NODES if n['type'] == 'asup')\n"+
"    ext = sum(max(0.0, n['Q'])*max(0.0, n['m']) for n in NODES if n['type'] == 'asink')\n"+
"    lmap = {LINKS[f['li']]['id']: f for f in flows}\n"+
"    out = {}\n"+
"    for i, r in enumerate(rooms):\n"+
"        out['pressure_' + r['id']] = p[i]\n"+
"        out['air_change_' + r['id']] = outflow[i]*3600/max(1.0, r['V'])\n"+
"        out['leak_flow_' + r['id']] = next((k['q'] for k in leaks if k['i'] == i), 0.0)*3600\n"+
"    for k, v in lmap.items():\n"+
"        out['flow_' + k] = v['q']*3600\n"+
"        out['velocity_' + k] = v['v']\n"+
"        out['dp_' + k] = v['dp']\n"+
"    out.update(\n"+
"        total_supply=sup, total_extract=ext,\n"+
"        envelope_net_flow=env_out*3600,\n"+
"        envelope_imbalance=(sum(net) - env_out)*3600,\n"+
"        worst_zone_residual=max([abs(z) for z in zone] + [0.0])*3600,\n"+
"        solver_residual=res*3600, solver_iterations=it,\n"+
"        worst_room_pressure=max([abs(x) for x in p] + [0.0]))\n"+
"    return out\n";
  return {code:code,requires:[],
    scope:"the whole pressure network for the operating mode shown at export time: the "
      +"effective opening areas, the thermal draught terms, the damped Newton solve of the "
      +"zone balance, every connection flow, velocity and pressure difference, the envelope "
      +"identity and the per-zone residual. Only the heat, moisture and contaminant transport "
      +"and the other six operating modes are left out.",
    selftest:{tolerance:1e-9,
      note:"the script runs the identical damped Newton with the identical Jacobian, so "
        +"agreement to 1e-9 relative is expected"}};
}
function dgcInit(){
  if(!window.Diagram) return;
  window.Diagram.init({
    id:"luchtbalans",file:"luchtbalans.html",
    state:{serialize:dgcSerialize,deserialize:dgcDeserialize},
    record:dgcRecord,python:dgcPython,
    handoff:{provides:["Vdot","dp"],accepts:[],build:dgcHandoff},
    report:{sections:dgcSections}
  });
}

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
else boot();
