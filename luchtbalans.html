  "summary": {

  "description": {
    "en": "Draw the building as a diagram and read the pressure cascade off it. Blocks are placed and dragged on a canvas and joined by arrows that stay docked to their edges: rooms, passive supply and passive extract openings whose flow follows from the balance, and active supply and extract units whose flow is imposed. A room carries volume, temperature, leakage area, heat and cooling load, moisture and contaminant release; an arrow carries opening type, area, discharge coefficient, height offset, the state of the air passing through it and the direction of movement it is required to keep. A damped Newton iteration with an analytic Jacobian solves the node balance for all seven operating modes at once — production, wet cleaning, drying, defrost, standby, emergency and fire — so an arrow turns round on screen at the moment a cascade collapses, and the excess or shortfall in pascals is printed large inside every room. Two editable tables mirror the drawing in both directions. Every default coefficient carries a visible category and status badge, from binding law down to rule of thumb, and every recalculation is re-verified against the solver itself: convergence, balance closure, required directions, opening velocities, independence from the order of the blocks and three reference data sets. A room with no air change is reported as having no steady state instead of repeating its own input, and a mixed air state outside the physical window is flagged rather than printed as a result. The whole drawing is editable from the keyboard as well: Tab walks the blocks and the arrows, Enter selects, the arrow keys move a block, C starts and closes a connection and Delete removes what is under the focus.",
    "uk": "Накресліть будівлю як схему і прочитайте з неї каскад тиску. Блоки ставляться і перетягуються на полотні та з'єднуються стрілками, які лишаються пристикованими до їхніх граней: приміщення, пасивні подача та стік, витрата яких випливає з балансу, і активні подача та стік, витрату яких задано. Приміщення має об'єм, температуру, площу нещільностей, теплову та холодову навантаги, виділення вологи й забруднювача; стрілка має тип отвору, площу, коефіцієнт витрати, перепад висоти, стан повітря, що крізь неї йде, і потрібний напрямок руху. Демпфований метод Ньютона з аналітичним якобіаном розв'язує вузловий баланс одразу для всіх семи режимів — виробництво, вологе миття, сушіння, відтавання, очікування, аварія, пожежа — тож стрілка розвертається на екрані в ту мить, коли каскад руйнується, а надлишок або нестача в паскалях друкується великим шрифтом усередині кожного приміщення. Дві редаговані таблиці дзеркалять рисунок в обидва боки. Кожен коефіцієнт за замовчуванням має видимий бейдж категорії та статусу — від обов'язкового права до емпіричного правила, а кожен перерахунок наново звіряється із самим розв'язувачем: збіжність, замикання балансів, потрібні напрямки, швидкості у прорізах, незалежність від порядку блоків і три контрольні набори даних. Приміщення без повітрообміну позначається як таке, що не має стаціонарного розв'язку, а не повторює власні вхідні дані, а стан суміші поза фізичним вікном позначається, а не подається як результат. Увесь рисунок редагується і з клавіатури: Tab проходить блоками та стрілками, Enter вибирає, стрілки зсувають блок, C починає й замикає звʼязок, а Delete вилучає те, що під фокусом.",
    "de": "Zeichnen Sie das Gebäude als Schema und lesen Sie die Druckkaskade daran ab. Blöcke werden auf einer Zeichenfläche gesetzt und verschoben und durch Pfeile verbunden, die an ihren Kanten angedockt bleiben: Räume, passive Zuluft- und Abluftöffnungen, deren Volumenstrom aus der Bilanz folgt, und aktive Zu- und Abluftgeräte, deren Volumenstrom aufgeprägt ist. Ein Raum trägt Volumen, Temperatur, Leckfläche, Wärme- und Kältelast, Feuchte- und Schadstofffreisetzung; ein Pfeil trägt Öffnungstyp, Fläche, Ausflussbeiwert, Höhenversatz, den Zustand der durchströmenden Luft und die geforderte Strömungsrichtung. Eine gedämpfte Newton-Iteration mit analytischer Jacobi-Matrix löst die Knotenbilanz für alle sieben Betriebszustände zugleich — Produktion, Nassreinigung, Trocknen, Abtauen, Bereitschaft, Störfall und Brand — sodass sich ein Pfeil genau dann auf dem Bildschirm umdreht, wenn die Kaskade kippt, und der Über- oder Unterdruck in Pascal groß im Raum steht. Zwei editierbare Tabellen spiegeln die Zeichnung in beide Richtungen. Jeder voreingestellte Beiwert trägt ein sichtbares Kategorie- und Statusabzeichen, von zwingendem Recht bis zur Faustregel, und jede Neuberechnung wird gegen den Löser selbst nachgeprüft: Konvergenz, Bilanzschluss, geforderte Richtungen, Öffnungsgeschwindigkeiten, Unabhängigkeit von der Reihenfolge der Blöcke und drei Referenzdatensätze. Ein Raum ohne Luftwechsel wird als ohne stationäre Lösung gemeldet statt seine eigene Eingabe zu wiederholen, und ein Mischzustand außerhalb des physikalischen Fensters wird markiert statt als Ergebnis ausgegeben. Die ganze Zeichnung lässt sich auch über die Tastatur bearbeiten: Tab wandert durch Blöcke und Pfeile, Enter wählt aus, die Pfeiltasten verschieben einen Block, C beginnt und schließt eine Verbindung, und Entf löscht, was unter dem Fokus liegt.",
    "nl": "Teken het gebouw als schema en lees de drukcascade eraan af. Blokken worden op een tekenvlak geplaatst en versleept en verbonden door pijlen die aan hun randen vastzitten: ruimten, passieve toevoer- en afvoeropeningen waarvan het debiet uit de balans volgt, en actieve toevoer- en afvoereenheden waarvan het debiet is opgelegd. Een ruimte draagt volume, temperatuur, lekoppervlak, warmte- en koellast, vocht- en contaminantafgifte; een pijl draagt openingstype, oppervlak, afvoercoëfficiënt, hoogteverschil, de toestand van de doorstromende lucht en de vereiste stromingsrichting. Een gedempte Newton-iteratie met analytische jacobiaan lost de knooppuntbalans voor alle zeven bedrijfstoestanden tegelijk op — productie, nat reinigen, drogen, ontdooien, wachtstand, noodbedrijf en brand — zodat een pijl op het scherm omdraait op het moment dat een cascade omslaat, en de over- of onderdruk in pascal groot in elke ruimte staat. Twee bewerkbare tabellen spiegelen de tekening in beide richtingen. Elke standaardcoëfficiënt draagt een zichtbaar categorie- en statuslabel, van dwingend recht tot vuistregel, en elke herberekening wordt tegen de oplosser zelf nagerekend: convergentie, het sluiten van de balansen, de vereiste richtingen, de openingssnelheden, onafhankelijkheid van de volgorde van de blokken en drie referentiesets. Een ruimte zonder luchtverversing wordt gemeld als zonder stationaire oplossing in plaats van haar eigen invoer te herhalen, en een gemengde luchttoestand buiten het fysische venster wordt gemarkeerd in plaats van als resultaat getoond. De hele tekening is ook met het toetsenbord te bewerken: Tab loopt langs de blokken en de pijlen, Enter selecteert, de pijltoetsen verplaatsen een blok, C begint en sluit een verbinding en Delete verwijdert wat onder de focus ligt.",
    "fr": "Dessinez le bâtiment sous forme de schéma et lisez-y la cascade de pression. Les blocs se posent et se déplacent sur une zone de dessin et se relient par des flèches qui restent accrochées à leurs bords : locaux, apports et extractions passifs dont le débit découle du bilan, et unités actives de soufflage et d’extraction dont le débit est imposé. Un local porte volume, température, surface de fuite, charges de chaleur et de froid, dégagement d’humidité et de contaminant ; une flèche porte type d’ouverture, surface, coefficient de décharge, dénivelé, l’état de l’air qui la traverse et le sens de circulation exigé. Une itération de Newton amortie à jacobien analytique résout le bilan nodal pour les sept régimes à la fois — production, lavage humide, séchage, dégivrage, veille, mode secours et incendie — si bien qu’une flèche se retourne à l’écran à l’instant où la cascade s’inverse, et que la surpression ou la dépression en pascals s’affiche en grand dans chaque local. Deux tableaux modifiables reflètent le dessin dans les deux sens. Chaque coefficient par défaut porte une pastille visible de catégorie et de statut, du droit contraignant à la règle empirique, et chaque recalcul est revérifié contre le solveur lui-même : convergence, fermeture des bilans, sens exigés, vitesses aux ouvertures, indépendance vis-à-vis de l’ordre des blocs et trois jeux de référence. Un local sans renouvellement d’air est signalé comme sans régime permanent au lieu de répéter sa propre saisie, et un état d’air mélangé hors de la fenêtre physique est signalé plutôt qu’affiché comme résultat. Tout le dessin se modifie aussi au clavier : Tab parcourt les blocs et les flèches, Entrée sélectionne, les flèches déplacent un bloc, C commence et referme une liaison et Suppr efface ce qui est sous le focus.",
    "es": "Dibuje el edificio como un esquema y lea en él la cascada de presión. Los bloques se colocan y se arrastran sobre un lienzo y se unen con flechas que permanecen ancladas a sus bordes: locales, aportes y extracciones pasivas cuyo caudal sale del balance, y unidades activas de impulsión y extracción cuyo caudal está impuesto. Un local lleva volumen, temperatura, área de fugas, cargas de calor y de frío, emisión de humedad y de contaminante; una flecha lleva tipo de abertura, área, coeficiente de descarga, desnivel, el estado del aire que la atraviesa y el sentido de circulación exigido. Una iteración de Newton amortiguada con jacobiano analítico resuelve el balance nodal para los siete regímenes a la vez — producción, lavado húmedo, secado, desescarche, espera, modo de emergencia e incendio — de modo que una flecha se da la vuelta en pantalla en el instante en que la cascada se invierte, y la sobrepresión o depresión en pascales aparece en grande dentro de cada local. Dos tablas editables reflejan el dibujo en ambos sentidos. Cada coeficiente por defecto lleva una etiqueta visible de categoría y estado, desde el derecho vinculante hasta la regla empírica, y cada recálculo se vuelve a verificar contra el propio solucionador: convergencia, cierre de los balances, sentidos exigidos, velocidades en las aberturas, independencia del orden de los bloques y tres conjuntos de referencia. Un local sin renovación de aire se señala como sin régimen permanente en lugar de repetir su propia entrada, y un estado de aire mezclado fuera de la ventana física se marca en vez de mostrarse como resultado. Todo el dibujo también se edita con el teclado: Tab recorre los bloques y las flechas, Intro selecciona, las flechas mueven un bloque, C inicia y cierra una conexión y Supr borra lo que está bajo el foco.",
    "pl": "Narysuj budynek jako diagram i odczytaj z niego kaskadę ciśnień. Bloki są umieszczane i przeciągane na płótnie, a następnie łączone strzałkami, które pozostają zadokowane do ich krawędzi: pomieszczenia, pasywne otwory nawiewne i wywiewne, których przepływ wynika z równowagi, oraz aktywne jednostki nawiewne i wywiewne, których przepływ jest narzucony. Pomieszczenie przenosi objętość, temperaturę, powierzchnię nieszczelności, obciążenie cieplne i chłodnicze, emisję wilgoci i zanieczyszczeń; strzałka przenosi typ otworu, powierzchnię, współczynnik wypływu, przesunięcie wysokości, stan powietrza przepływającego przez nie oraz kierunek ruchu, który musi być utrzymany. Tłumiona iteracja Newtona z analitycznym Jakobianem rozwiązuje równowagę węzłów dla wszystkich siedmiu trybów pracy jednocześnie — produkcji, czyszczenia na mokro, suszenia, odszraniania, gotowości, sytuacji awaryjnej i pożaru — więc strzałka obraca się na ekranie w momencie załamania kaskady, a nadmiar lub niedobór w paskalach jest drukowany w dużym formacie wewnątrz każdego pomieszczenia. Dwie edytowalne tabele odzwierciedlają rysunek w obu kierunkach. Każdy domyślny współczynnik ma widoczną kategorię i oznaczenie statusu, od obowiązującego prawa po regułę praktyczną, a każde ponowne obliczenie jest ponownie weryfikowane względem samego solvera: zbieżność, domknięcie równowagi, wymagane kierunki, prędkości otwierania, niezależność od kolejności bloków i trzech referencyjnych zestawów danych. Pomieszczenie bez wymiany powietrza jest zgłaszane jako nie posiadające stanu stacjonarnego zamiast powtarzania własnych danych wejściowych, a mieszany stan powietrza poza oknem fizycznym jest w rezultacie oznaczany flagą, a nie drukowany. Cały rysunek można również edytować z klawiatury: Tab porusza się po blokach i strzałkach, Enter zaznacza, klawisze strzałek przesuwają blok, C rozpoczyna i zamyka połączenie, a Delete usuwa to, co jest pod fokusem."
  },

  "independent_validation": false,
  "limitations": {
    "en": "Steady-state node model with one mixed pressure and one mixed air state per room and a square-root opening law; active supply and extract units are imposed volume flows, so fan curves, duct networks and transients from door swings, damper strokes or fan run-up are absent. Discharge coefficients and closed-door gap areas are assumptions that scale every flow linearly and need a pressurisation and leakage test to become project values; thermal draught is a single height offset per connection with constant densities and wind pressure is not modelled. Heat, moisture and contaminant are carried by a well-mixed steady balance over the solved flows, so the tool returns a room average and not a local concentration; cleanliness classification, filtration, recovery time and fire and smoke control stay outside the model, and the incompressible law is only applied inside a limited pressure window. Pressure differences below 0.04 Pa across a connection are smoothed to a straight line through zero, which can shift the flow through an almost balanced opening by a few per cent and, at the threshold, the direction reported. A room with no air change has no steady temperature, humidity or contaminant concentration, and a mixed air state outside the physical window is not a result: both situations are marked instead of being filled in.",
    "uk": "Стаціонарна вузлова модель з одним усередненим тиском і одним усередненим станом повітря на приміщення та кореневим законом витікання; активні вузли подачі та витяжки задані як об'ємні витрати, тому немає ані характеристик вентиляторів, ані мережі повітроводів, ані перехідних процесів від відчинення дверей, ходу заслінок чи розгону вентилятора. Коефіцієнти витрати та площі щілин зачинених дверей — це припущення, з якими лінійно масштабується кожна витрата; проєктними вони стають лише після випробування на тиск і повітропроникність. Тепловий напір задано одним перепадом висоти на зв'язок зі сталими густинами, вітровий тиск не моделюється. Тепло, волога та забруднювач переносяться стаціонарним балансом за ідеального перемішування на розв'язаних витратах, тож інструмент дає середнє по приміщенню, а не локальну концентрацію; класифікація чистоти, фільтрація, час відновлення та протипожежний і димовий захист лишаються поза моделлю, а нестисливий закон застосовано лише у вузькому вікні тиску. Перепади тиску нижче 0,04 Па на зв'язку згладжуються прямою через нуль, що може змістити витрату крізь майже врівноважений отвір на кілька відсотків, а на порозі — і показаний напрямок. Приміщення без повітрообміну не має стаціонарних температури, вологості та концентрації, а стан суміші поза фізичним вікном не є результатом: обидві ситуації позначаються, а не заповнюються числом.",
    "de": "Stationäres Knotenmodell mit einem gemischten Druck und einem gemischten Luftzustand je Raum und dem Wurzelgesetz der Öffnungsströmung; aktive Zu- und Abluftgeräte sind aufgeprägte Volumenströme, daher fehlen Ventilatorkennlinien, Kanalnetze und Übergänge durch Türöffnung, Klappenlauf oder Ventilatorhochlauf. Ausflussbeiwerte und Spaltflächen geschlossener Türen sind Annahmen, mit denen jeder Volumenstrom linear skaliert und die erst eine Druck- und Leckageprüfung zu Projektwerten macht; der Auftrieb ist ein Höhenversatz je Verbindung mit konstanten Dichten, Winddruck wird nicht abgebildet. Wärme, Feuchte und Schadstoff werden über eine stationäre Mischbilanz auf den gelösten Volumenströmen transportiert, das Werkzeug liefert also einen Raummittelwert und keine örtliche Konzentration; Reinheitsklassifizierung, Filtration, Erholzeit sowie Brand- und Rauchschutz bleiben außerhalb des Modells, und das inkompressible Gesetz gilt nur in einem begrenzten Druckfenster. Druckdifferenzen unter 0,04 Pa über einer Verbindung werden zu einer Geraden durch null geglättet, was den Volumenstrom durch eine fast ausgeglichene Öffnung um einige Prozent und an der Schwelle auch die gemeldete Richtung verschieben kann. Ein Raum ohne Luftwechsel hat keine stationäre Temperatur, Feuchte oder Konzentration, und ein Mischzustand außerhalb des physikalischen Fensters ist kein Ergebnis: beide Fälle werden markiert statt ausgefüllt.",
    "nl": "Stationair knooppuntmodel met één gemengde druk en één gemengde luchttoestand per ruimte en een wortelverband voor openingsstroming; actieve toevoer- en afvoereenheden zijn opgelegde volumestromen, dus ventilatorkarakteristieken, kanaalnetten en overgangen door deurbeweging, klepslag of aanlopen van een ventilator ontbreken. Afvoercoëfficiënten en kieroppervlakken van gesloten deuren zijn aannamen waarmee elk debiet lineair schaalt en die pas na een druk- en lekproef projectwaarden worden; thermische trek is één hoogteverschil per verbinding met constante dichtheden en winddruk is niet meegenomen. Warmte, vocht en contaminant worden gedragen door een stationaire mengbalans over de opgeloste debieten, dus geeft de tool een ruimtegemiddelde en geen lokale concentratie; reinheidsklassificatie, filtratie, hersteltijd en brand- en rookbeheersing blijven buiten het model, en het incompressibele verband geldt alleen binnen een beperkt drukvenster. Drukverschillen onder 0,04 Pa over een verbinding worden afgevlakt tot een rechte lijn door nul, wat het debiet door een bijna gebalanceerde opening enkele procenten en op de drempel ook de gemelde richting kan verschuiven. Een ruimte zonder luchtverversing heeft geen stationaire temperatuur, vochtigheid of concentratie, en een gemengde luchttoestand buiten het fysische venster is geen resultaat: beide gevallen worden gemarkeerd in plaats van ingevuld.",
    "fr": "Modèle nodal permanent avec une pression mélangée et un état d’air mélangé par local et une loi d’ouverture en racine carrée ; les unités actives de soufflage et d’extraction sont des débits imposés, donc ni courbes de ventilateur, ni réseaux de gaines, ni transitoires d’ouverture de porte, de course de registre ou de démarrage. Les coefficients de décharge et les surfaces de jeu des portes fermées sont des hypothèses auxquelles chaque débit est directement proportionnel et qui n’ont valeur de projet qu’après un essai de pressurisation et de perméabilité ; le tirage thermique se réduit à un décalage de hauteur par liaison à masses volumiques constantes et la pression du vent n’est pas modélisée. Chaleur, humidité et contaminant sont transportés par un bilan permanent en mélange parfait sur les débits résolus : l’outil donne une moyenne de local et non une concentration locale ; classification de propreté, filtration, temps de récupération et désenfumage restent hors du modèle, et la loi incompressible n’est appliquée que dans une fenêtre de pression limitée. Les écarts de pression inférieurs à 0,04 Pa sur une liaison sont lissés en une droite passant par zéro, ce qui peut décaler de quelques pour cent le débit d’une ouverture presque équilibrée et, au seuil, le sens annoncé. Un local sans renouvellement d’air n’a ni température, ni humidité, ni concentration en régime permanent, et un état d’air mélangé hors de la fenêtre physique n’est pas un résultat : les deux cas sont signalés au lieu d’être remplis.",
    "es": "Modelo nodal estacionario con una presión mezclada y un estado de aire mezclado por local y una ley de aberturas en raíz cuadrada; las unidades activas de impulsión y extracción son caudales impuestos, por lo que no hay curvas de ventilador, redes de conductos ni transitorios por apertura de puerta, carrera de compuerta o arranque de ventilador. Los coeficientes de descarga y las áreas de holgura de puertas cerradas son hipótesis con las que cada caudal escala linealmente y que solo se convierten en valores de proyecto tras un ensayo de presurización y permeabilidad; el tiro térmico se reduce a un desnivel por conexión con densidades constantes y la presión del viento no se modela. Calor, humedad y contaminante se transportan mediante un balance estacionario de mezcla perfecta sobre los caudales resueltos, de modo que la herramienta da una media del local y no una concentración local; clasificación de limpieza, filtración, tiempo de recuperación y control de humo quedan fuera del modelo, y la ley incompresible solo se aplica dentro de una ventana de presión limitada. Las diferencias de presión inferiores a 0,04 Pa en una conexión se suavizan a una recta por cero, lo que puede desplazar unos pocos por ciento el caudal por una abertura casi equilibrada y, en el umbral, el sentido indicado. Un local sin renovación de aire no tiene temperatura, humedad ni concentración en régimen permanente, y un estado de aire mezclado fuera de la ventana física no es un resultado: ambos casos se señalan en vez de rellenarse.",
    "pl": "Model węzła stanu ustalonego z jednym stanem ciśnienia mieszanego i jednym stanem powietrza mieszanego na pomieszczenie oraz prawem pierwiastka kwadratowego otwarcia; aktywne jednostki nawiewne i wywiewne są narzuconymi przepływami objętości, więc krzywe wentylatorów, sieci kanałów i stany nieustalone wynikające z otwierania drzwi, skoków przepustnic lub rozbiegu wentylatora są nieobecne. Współczynniki wypływu i powierzchnie szczelin przy zamkniętych drzwiach to założenia, które skalują każdy przepływ liniowo i wymagają testu ciśnieniowego i szczelności, aby stały się wartościami projektowymi; ciąg termiczny to pojedyncze przesunięcie wysokości na przyłącze o stałej gęstości, a ciśnienie wiatru nie jest modelowane. Ciepło, wilgoć i zanieczyszczenia są przenoszone przez dobrze wymieszaną równowagę statyczną w rozwiązanych przepływach, więc narzędzie zwraca średnią dla pomieszczenia, a nie lokalne stężenie; klasyfikacja czystości, filtracja, czas regeneracji oraz kontrola pożaru i dymu pozostają poza modelem, a prawo nieściśliwości jest stosowane tylko w ograniczonym oknie ciśnienia. Różnice ciśnień poniżej 0,04 Pa na przyłączu są wygładzane do linii prostej przechodzącej przez zero, co może przesunąć przepływ przez prawie zrównoważony otwór o kilka procent, a na poziomie progowym – w podanym kierunku. W pomieszczeniu, w którym nie ma wymiany powietrza, nie ma stałej temperatury, wilgotności ani stężenia zanieczyszczeń, a mieszany stan powietrza za oknem fizycznym nie jest tego wynikiem: obie sytuacje są zaznaczone, zamiast zostać wypełnione."

let LANG="en";
const T=(k)=>(I18N[LANG]&&I18N[LANG][k])||I18N.en[k]||k;
/* A label that ends in ", unit" carries its unit inside the label, which the shell
   forbids: the unit has a slot of its own. Split on the last comma, in every
   language, and hand the two halves to the field and to the tile. */
function splitUnit(key){
  const s=T(key), i=s.lastIndexOf(", ");
  return i>0 ? [s.slice(0,i), s.slice(i+2)] : [s,null];
}
function labelOf(key){ return () => splitUnit(key)[0]; }
function unitOf(key){ return () => splitUnit(key)[1]; }
/* the manifest is already translated into all six languages, so the learn intro is
   its description rather than a second text that can drift away from it */
function manifestText(field){

/* ---------------- helpers ---------------- */
/* toFixed() writes an English decimal point, so the block and connection
   tables read 18.15 Pa while the report header, formatted by the framework in
   the document language, read 18,15 Pa for the same pressure. The grouping
   rule is the framework's own: separators from five digits up, so a four-digit
   flow stays a plain number in a dense column. */
const LOCMAP={en:"en-GB",nl:"nl-BE",de:"de-DE",fr:"fr-BE",es:"es-ES",pl:"pl-PL",uk:"uk-UA"};
function fmt(x,d){ if(x===null||x===undefined||typeof x!=="number"||!isFinite(x)) return "—";
  const dd=(d===undefined?1:d);
  let v;
  try{ v=x.toLocaleString(LOCMAP[LANG]||"nl-BE",
    {minimumFractionDigits:dd,maximumFractionDigits:dd,useGrouping:Math.abs(x)>=1e4}); }
  catch(e){ v=x.toFixed(dd); }
  return /^-0([.,]0*)?$/.test(v)?v.slice(1):v; }
function sfmt(x,d){ if(x===null||x===undefined||typeof x!=="number"||!isFinite(x)) return "—";
  const s=fmt(x,d); return (s.charAt(0)==="-"||parseFloat(s)===0)?s:("+"+s); }
function num(v,def){ const x=parseFloat(v); return isFinite(x)?x:def; }
/* accepted ranges of every editable quantity; anything outside is brought back and reported */
const NLIM={V:[1,1e7],T:[-60,120],RH:[1,100],Q:[0,1e7],mult:[0,20],qh:[0,1e9],qc:[0,1e9],
  gm:[0,100],gc:[0,100],leak:[0,1e4],rank:[1,999],tgt:[-500,500]};
const LLIM={A:[0.001,1e4],gap:[0,1e4],cd:[0.05,1],h:[-20,20],phi:[0,1]};
let CLAMPED=false;   /* an entered value had to be brought back into its accepted range */
function clampNum(v,lo,hi,def){
  let x=parseFloat(v);
  if(!isFinite(x)){ if(v!==""&&v!==null&&v!==undefined) CLAMPED=true; return def; }
  if(lo!==null&&lo!==undefined&&isFinite(lo)&&x<lo){ CLAMPED=true; x=lo; }
  if(hi!==null&&hi!==undefined&&isFinite(hi)&&x>hi){ CLAMPED=true; x=hi; }
  return x;
}
/* probe override of the global input fields, used by the built-in checks only */
let ENV=null;
function gv(id,def){
  if(ENV&&ENV[id]!==undefined) return ENV[id];
  const lim=ELIM[id]||[null,null];
  const v=(STATE.env||{})[id];
  if(v===undefined||v===null||v==="") return def;
  return clampNum(v,lim[0],lim[1],def);
}
function rho(Tc){ return PATM/(RS*(num(Tc,20)+273.15)); }
function byId(id){ for(let i=0;i<NODES.length;i++) if(NODES[i].id===id) return NODES[i]; return null; }
function linkById(id){ for(let i=0;i<LINKS.length;i++) if(LINKS[i].id===id) return LINKS[i]; return null; }
function nodeName(n){ if(!n) return ""; return n.key?T(n.key):(n.name||n.id); }
function nameOf(id){ const n=byId(id); return n?nodeName(n):id; }
function isRoom(n){ return !!n&&n.type==="room"; }
function isActive(n){ return !!n&&(n.type==="asup"||n.type==="asink"); }
function isAmb(n){ return !!n&&(n.type==="psup"||n.type==="psink"); }
function rooms(){ return NODES.filter(n=>n.type==="room"); }
function nsize(n){ return n.type==="room"?RSZ:NSZ; }
function rankOf(id){ const n=byId(id); return isRoom(n)?num(n.rank,0):999; }
function activeLink(L){ const A=byId(L.a),B=byId(L.b); return isActive(A)||isActive(B); }
function snap(v){ return Math.round(v/GRID)*GRID; }

/* psychrometrics: Magnus relation, humidity ratio at standard pressure */
function pSat(t){ return 610.94*Math.exp(17.625*t/(t+243.04)); }
function wOfRH(t,rhp){ const r=Math.max(0,Math.min(100,num(rhp,50)))/100;
  const pv=r*pSat(num(t,20)); return 0.622*pv/Math.max(1,PATM-pv); }
function rhOfW(t,w){ const ww=Math.max(0,num(w,0)); const pv=PATM*ww/(0.622+ww);
  const ps=pSat(num(t,20)); return ps>0?Math.max(0,Math.min(100,pv/ps*100)):0; }

/* ---------------- opening law (square-root form, regularised near zero) ---- */
function fq(d){ const a=Math.abs(d); return a<DELTA ? d/Math.sqrt(DELTA) : Math.sign(d)*Math.sqrt(a); }
function fqd(d){ const a=Math.abs(d); return a<DELTA ? 1/Math.sqrt(DELTA) : 0.5/Math.sqrt(a); }

/* ---------------- solver: damped Newton on the node balance --------------- */
function solve(mode){
  const rh=Math.max(0.1,gv("i_rho",1.2)), cdl=gv("i_cdleak",0.65), Tout=gv("i_tout",5);
  const RM=rooms(), n=RM.length, idx={};
  RM.forEach((r,i)=>{ idx[r.id]=i; });
  const net=new Array(n).fill(0);
  const edges=[], act=[];
  const rhoOut=rho(Tout);
  const nrho=(nd)=>nd?(isRoom(nd)||isAmb(nd)||isActive(nd)?rho(nd.T):rhoOut):rhoOut;

  LINKS.forEach((L,li)=>{
    const A=byId(L.a), B=byId(L.b); if(!A||!B) return;
    if(isActive(A)||isActive(B)){
      const av=isActive(A)?A:B, rm=isActive(A)?B:A;
      if(!isRoom(rm)) return;
      const q=Math.max(0,num(av.Q,0))*Math.max(0,num((av.m||{})[mode],1))/3600;
      const into=(av.type==="asup");
      net[idx[rm.id]]+= into?q:-q;
      /* flow measured positive from a to b */
      let qab;
      if(av===A) qab = into? q : -q;
      else       qab = into? -q : q;
      act.push({li:li,q:qab,Ae:Math.max(1e-6,num(L.A,0.2))});
      return;
    }
    const f=Math.max(0,Math.min(1,num(L.f[mode],0)));
    const Ae=f*Math.max(0,num(L.A,0))+(1-f)*Math.max(0,num(L.gap,0));
    edges.push({li:li,ia:isRoom(A)?idx[A.id]:-1,ib:isRoom(B)?idx[B.id]:-1,
      C:Math.max(0,num(L.cd,0.6))*Ae*Math.sqrt(2/rh), Ae:Ae,
      dth:G*num(L.h,0)*(nrho(B)-nrho(A)), leak:false});
  });
  RM.forEach((r,i)=>{ edges.push({li:-1,ia:i,ib:-1,
    C:cdl*Math.max(0,num(r.leak,0))*Math.sqrt(2/rh), Ae:Math.max(0,num(r.leak,0)), dth:0, leak:true}); });

  let p=new Array(n).fill(0), it=0, res=0;
  for(it=0; it<200; it++){
    const R=net.slice();
    const J=[]; for(let i=0;i<n;i++) J.push(new Array(n).fill(0));
    for(const e of edges){
      const pa=e.ia<0?0:p[e.ia], pb=e.ib<0?0:p[e.ib], d=pa-pb+e.dth;
      const q=e.C*fq(d), dq=e.C*fqd(d);
      if(e.ia>=0){ R[e.ia]-=q; J[e.ia][e.ia]-=dq; if(e.ib>=0) J[e.ia][e.ib]+=dq; }
      if(e.ib>=0){ R[e.ib]+=q; J[e.ib][e.ib]-=dq; if(e.ia>=0) J[e.ib][e.ia]+=dq; }
    }
    res=0; for(let i=0;i<n;i++) res=Math.max(res,Math.abs(R[i]));
    if(res<TOL_SOLVE) break;
    const M=[]; for(let i=0;i<n;i++) M.push(J[i].concat([-R[i]]));
    for(let c=0;c<n;c++){
      let pi=c; for(let r2=c+1;r2<n;r2++) if(Math.abs(M[r2][c])>Math.abs(M[pi][c])) pi=r2;
      if(Math.abs(M[pi][c])<1e-14) continue;
      const t=M[c]; M[c]=M[pi]; M[pi]=t;
      for(let r2=0;r2<n;r2++){ if(r2===c) continue; const f=M[r2][c]/M[c][c]; if(!f) continue;
        for(let k=c;k<=n;k++) M[r2][k]-=f*M[c][k]; }
    }
    let mx=0; const dx=new Array(n).fill(0);
    for(let c=0;c<n;c++){ dx[c]=Math.abs(M[c][c])<1e-14?0:M[c][n]/M[c][c];
      if(!isFinite(dx[c])) dx[c]=0; mx=Math.max(mx,Math.abs(dx[c])); }
    const sc=mx>30?30/mx:1;
    for(let i=0;i<n;i++) p[i]+=dx[i]*sc;
  }
  let finite=true;
  for(let i=0;i<n;i++) if(!isFinite(p[i])){ p[i]=0; finite=false; }

  const flows=[], leaks=[];
  for(const e of edges){
    const pa=e.ia<0?0:p[e.ia], pb=e.ib<0?0:p[e.ib], d=pa-pb+e.dth, q=e.C*fq(d);
    if(e.leak) leaks.push({i:e.ia,q:q,dp:d});
    else flows.push({li:e.li,dp:d,q:q,Ae:e.Ae,v:e.Ae>1e-9?Math.abs(q)/e.Ae:0,active:false});
  }
  act.forEach(a=>{ flows.push({li:a.li,dp:null,q:a.q,Ae:a.Ae,v:Math.abs(a.q)/a.Ae,active:true}); });
  flows.sort((x,y)=>x.li-y.li);
  /* nothing that is not a number is allowed to reach the drawing or the tables */
  flows.forEach(f=>{ if(!isFinite(f.q)){ f.q=0; finite=false; }
    if(!isFinite(f.v)){ f.v=0; finite=false; }
    if(f.dp!==null&&!isFinite(f.dp)){ f.dp=null; finite=false; } });
  leaks.forEach(k=>{ if(!isFinite(k.q)){ k.q=0; finite=false; }
    if(!isFinite(k.dp)){ k.dp=0; finite=false; } });

  let envOut=0;
  flows.forEach(f=>{ if(f.active) return; const L=LINKS[f.li]; if(!L) return;
    const A=byId(L.a), B=byId(L.b);
    if(isAmb(B)) envOut+=f.q; else if(isAmb(A)) envOut-=f.q; });
  leaks.forEach(k=>{ envOut+=k.q; });
  const netSum=net.reduce((a,b)=>a+b,0);

  const outflow=new Array(n).fill(0);
  flows.forEach(f=>{ const L=LINKS[f.li]; if(!L) return;
    const A=byId(L.a), B=byId(L.b);
    if(f.q>0){ if(isRoom(A)) outflow[idx[A.id]]+=f.q; }
    else if(f.q<0){ if(isRoom(B)) outflow[idx[B.id]]+=-f.q; } });
  leaks.forEach(k=>{ if(k.q>0) outflow[k.i]+=k.q; });

  if(!isFinite(envOut)){ envOut=0; finite=false; }
  let imb=netSum-envOut; if(!isFinite(imb)){ imb=0; finite=false; }
  for(let i=0;i<n;i++) if(!isFinite(outflow[i])){ outflow[i]=0; finite=false; }
  return {mode:mode,p:p,it:it,res:res,flows:flows,leaks:leaks,net:net,idx:idx,
    envOut:envOut,imb:imb,outflow:outflow,rooms:RM,finite:finite};
}

/* ---------------- steady mixing model: heat, moisture, contaminant -------- */
function extState(id){
  const Tout=gv("i_tout",5), RHo=gv("i_rhout",70);
  if(id==="AMB") return {T:Tout,w:wOfRH(Tout,RHo),c:0};
  const nd=byId(id);
  if(!nd) return {T:Tout,w:wOfRH(Tout,RHo),c:0};
  return {T:num(nd.T,Tout), w:wOfRH(num(nd.T,Tout),num(nd.RH,50)), c:0};
}
function transport(R){
  const rh=Math.max(0.1,gv("i_rho",1.2));
  const RM=R.rooms, n=RM.length, idx=R.idx;
  const A=[]; for(let i=0;i<n;i++) A.push(new Array(n).fill(0));
  const B=[]; for(let i=0;i<n;i++) B.push([0,0,0]);
  const vout=new Array(n).fill(0);
  const noAir=[], noSense=[];
  const streams=[];
  const push=(from,to,q)=>{ if(!(q>1e-12)) return; streams.push({from:from,to:to,q:q}); };
  R.flows.forEach(f=>{ const L=LINKS[f.li]; if(!L) return;
    if(f.q>0) push(L.a,L.b,f.q); else if(f.q<0) push(L.b,L.a,-f.q); });
  R.leaks.forEach(k=>{ const id=RM[k.i].id; if(k.q>0) push(id,"AMB",k.q); else if(k.q<0) push("AMB",id,-k.q); });

  streams.forEach(s=>{
    const fi=(idx[s.from]!==undefined&&isRoom(byId(s.from)))?idx[s.from]:-1;
    const ti=(idx[s.to]!==undefined&&isRoom(byId(s.to)))?idx[s.to]:-1;
    if(fi>=0) vout[fi]+=s.q;
    if(ti>=0){
      if(fi>=0) A[ti][fi]-=s.q;
      else { const ex=extState(s.from); B[ti][0]+=s.q*ex.T; B[ti][1]+=s.q*ex.w; B[ti][2]+=s.q*ex.c; }
    }
  });
  const ex0=extState("AMB");
  for(let i=0;i<n;i++){
    const r=RM[i];
    A[i][i]+=vout[i];
    B[i][0]+=(num(r.qh,0)-num(r.qc,0))/(rh*CP);
    B[i][1]+=num(r.gm,0)/rh;
    B[i][2]+=num(r.gc,0);
    if(vout[i]<1e-9){
      /* no air leaves this room, so heat, moisture and contaminant have nowhere to go:
         the steady problem has no solution. The row is made trivial only to keep the
         elimination well posed; the result is reported as absent, not as the input. */
      noAir.push(r.id);
      for(let j=0;j<n;j++) A[i][j]=0;
      A[i][i]=1; B[i][0]=num(r.T,20); B[i][1]=wOfRH(num(r.T,20),num(r.RH,50)); B[i][2]=0;
    }
  }
  const A0=A.map(r=>r.slice()), B0=B.map(r=>r.slice());
  const M=[]; for(let i=0;i<n;i++) M.push(A[i].concat(B[i]));
  for(let c=0;c<n;c++){
    let pi=c; for(let r2=c+1;r2<n;r2++) if(Math.abs(M[r2][c])>Math.abs(M[pi][c])) pi=r2;
    if(Math.abs(M[pi][c])<1e-14) continue;
    const t=M[c]; M[c]=M[pi]; M[pi]=t;
    for(let r2=0;r2<n;r2++){ if(r2===c) continue; const f=M[r2][c]/M[c][c]; if(!f) continue;
      for(let k=c;k<n+3;k++) M[r2][k]-=f*M[c][k]; }
  }
  const st=[];
  for(let i=0;i<n;i++){
    const d=M[i][i];
    const g=(k)=>{ if(Math.abs(d)<1e-14) return null; const v=M[i][n+k]/d; return isFinite(v)?v:null; };
    let Tm=g(0), wm=g(1), cm=g(2);
    if(Tm===null) Tm=num(RM[i].T,20);
    if(wm===null) wm=wOfRH(num(RM[i].T,20),num(RM[i].RH,50));
    if(cm===null) cm=0;
    st.push({T:Tm,w:Math.max(0,wm),c:Math.max(0,cm)});
  }
  /* residual of the original system */
  let resid=0;
  for(let i=0;i<n;i++){
    for(let k=0;k<3;k++){
      let s=0; for(let j=0;j<n;j++) s+=A0[i][j]*(k===0?st[j].T:(k===1?st[j].w:st[j].c));
      const sc=Math.max(1e-9,Math.abs(B0[i][k]));
      resid=Math.max(resid,Math.abs(s-B0[i][k])/sc);
    }
  }
  if(!isFinite(resid)) resid=0;
  const map={};
  RM.forEach((r,i)=>{
    const noflow=noAir.indexOf(r.id)>=0;
    const bad=!noflow&&!plausible(st[i]);
    if(bad) noSense.push(r.id);
    map[r.id]= noflow ? {T:null,w:null,c:null,noflow:true,bad:false}
                      : {T:st[i].T,w:st[i].w,c:st[i].c,noflow:false,bad:bad};
  });
  return {map:map,resid:resid,ex:ex0,streams:streams,noAir:noAir,noSense:noSense};
}
/* plausibility window of the mixed air state: outside it the steady mixing model
   is no longer a description of air, so the number must not be handed out as a result */
const PLAUS={Tmin:-80,Tmax:150,wmax:1.0,cmax:0.1};
function plausible(st){
  if(!st) return false;
  if(!isFinite(st.T)||!isFinite(st.w)||!isFinite(st.c)) return false;
  if(st.T<PLAUS.Tmin||st.T>PLAUS.Tmax) return false;
  if(st.w>PLAUS.wmax) return false;
  if(st.c>PLAUS.cmax) return false;
  return true;
}
function stateOf(id,tr){
  if(tr&&tr.map&&tr.map[id]) return tr.map[id];
  const e=extState(id); return {T:e.T,w:e.w,c:e.c,noflow:false,bad:false};
}

/* ---------------- local exhaust and wash-out sub-models ------------------- */
const CAPT_K=10;          /* empirical constant of the free-opening capture relation */
const CAPT_TGT=0.50;      /* design capture velocity, m/s */
function captureV(q,a,x){ return q/(CAPT_K*x*x+a); }
function captureX(q,a,vt){ const arg=q/vt-a; return arg>0?Math.sqrt(arg/CAPT_K):null; }
function washFrac(n,tHours){ return Math.exp(-n*tHours); }
function t99Of(n){ return n>1e-6?Math.log(100)/n*60:null; }   /* minutes */

/* ---------------- required direction ---------------- */
function reqDir(L){
  if(L.req==="ab") return 1;
  if(L.req==="ba") return -1;
  if(L.req==="none") return 0;
  const ra=rankOf(L.a), rb=rankOf(L.b);
  if(ra<rb) return 1; if(rb<ra) return -1; return 0;
}

/* ================== graphical editor ================== */
function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||"#888"; }
function rectOf(n){ const s=nsize(n); return {x:n.x,y:n.y,w:s.w,h:s.h,cx:n.x+s.w/2,cy:n.y+s.h/2}; }
function ptInRect(px,py,r,pad){ const p=pad||0;
  return px>=r.x-p&&px<=r.x+r.w+p&&py>=r.y-p&&py<=r.y+r.h+p; }
function nodeAt(px,py){
  for(let i=NODES.length-1;i>=0;i--){ if(ptInRect(px,py,rectOf(NODES[i]),0)) return NODES[i]; }
  return null;
}
/* point where the segment from the centre of r towards (dx,dy) leaves the rectangle */
function edgePt(r,dx,dy,pad){
  const hw=r.w/2+(pad||0), hh=r.h/2+(pad||0);
  const t=Math.min(Math.abs(dx)<1e-9?1e9:hw/Math.abs(dx), Math.abs(dy)<1e-9?1e9:hh/Math.abs(dy));
  return [r.cx+dx*t, r.cy+dy*t];
}
function segHitsOther(pts,ida,idb){
  for(const n of NODES){
    if(n.id===ida||n.id===idb) continue;
    const r=rectOf(n);
    for(const p of pts){ if(ptInRect(p[0],p[1],r,6)) return true; }
  }
  return false;
}
function qbez(a,c,b,t){ const u=1-t;
  return [u*u*a[0]+2*u*t*c[0]+t*t*b[0], u*u*a[1]+2*u*t*c[1]+t*t*b[1]]; }
function routeLink(L){
  const A=byId(L.a), B=byId(L.b);
  if(!A||!B) return null;
  const ra=rectOf(A), rb=rectOf(B);
  const dx=rb.cx-ra.cx, dy=rb.cy-ra.cy, len=Math.hypot(dx,dy)||1;
  const ux=dx/len, uy=dy/len;
  let a=edgePt(ra,ux,uy,3), b=edgePt(rb,-ux,-uy,3);
  const samp=(p0,p1)=>{ const o=[]; for(let i=1;i<10;i++) o.push([p0[0]+(p1[0]-p0[0])*i/10,p0[1]+(p1[1]-p0[1])*i/10]); return o; };
  if(!segHitsOther(samp(a,b),L.a,L.b)) return {a:a,b:b,c:null};
  const nx=-uy, ny=ux;
  for(const off of [70,-70,130,-130,200,-200]){
    const c=[(ra.cx+rb.cx)/2+nx*off,(ra.cy+rb.cy)/2+ny*off];
    const d1=[c[0]-ra.cx,c[1]-ra.cy], l1=Math.hypot(d1[0],d1[1])||1;
    const d2=[c[0]-rb.cx,c[1]-rb.cy], l2=Math.hypot(d2[0],d2[1])||1;
    const aa=edgePt(ra,d1[0]/l1,d1[1]/l1,3), bb=edgePt(rb,d2[0]/l2,d2[1]/l2,3);
    const pts=[]; for(let i=1;i<12;i++) pts.push(qbez(aa,c,bb,i/12));
    if(!segHitsOther(pts,L.a,L.b)) return {a:aa,b:bb,c:c};
  }
  return {a:a,b:b,c:null};
}
function clip(s,nmax){ const t=String(s); return t.length>nmax?t.slice(0,nmax-1)+"…":t; }

let GHOST=null;   /* {x0,y0,x1,y1} while pulling a new connection */
let KCONN=null;   /* block a keyboard connection was started from */
let KFOC=null;    /* {kind:"node"|"link", id} to focus after the next redraw */

function fitCanvas(){
  let mb=560;
  NODES.forEach(n=>{ const z=nsize(n); mb=Math.max(mb,n.y+z.h); });
  VH=Math.max(700,snap(mb+60));
  const cv=el("canvas"); if(cv) cv.setAttribute("viewBox","0 0 "+VW+" "+VH);
}
function renderScheme(){

    '<span><i style="background:'+cpos+'"></i>'+esc(T("sl_pos"))+'</span>'+
    '<span><i style="background:'+cneg+'"></i>'+esc(T("sl_neg"))+'</span>'+

/* ---------------- pointer interaction ---------------- */
let DRAG=null, RAF=0;
function toLocal(ev){
  const cv=el("canvas");
  const r=cv.getBoundingClientRect();
  const sx=r.width>0?VW/r.width:1, sy=r.height>0?VH/r.height:1;
  return {x:(ev.clientX-r.left)*sx, y:(ev.clientY-r.top)*sy};
}
function schedule(){
  if(RAF) return;
  RAF=requestAnimationFrame(()=>{ RAF=0; renderScheme(); });
}
function msg(k,extra){ const e=el("edmsg"); if(e) e.textContent=k?(T(k)+(extra?" "+extra:"")):""; }

function clampNode(n){
  const s=nsize(n);
  n.x=Math.max(0,Math.min(VW-s.w,n.x));
  n.y=Math.max(0,Math.min(VH-s.h,n.y));
}
function onDown(ev){
  const cv=el("canvas");
  const p=toLocal(ev);
  const tgt=ev.target;
  const portEl=tgt.closest?tgt.closest("[data-port]"):null;
  const delEl=tgt.closest?tgt.closest("[data-del]"):null;
  const nodeEl=tgt.closest?tgt.closest("[data-node]"):null;
  const linkEl=tgt.closest?tgt.closest("[data-link]"):null;
  msg("");
  if(delEl){ hist(); deleteNode(delEl.getAttribute("data-del")); return; }
  if(portEl){
    const id=portEl.getAttribute("data-port");
    DRAG={mode:"link",from:id};
    GHOST={x0:p.x,y0:p.y,x1:p.x,y1:p.y};
    try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
    ev.preventDefault(); schedule(); return;
  }
  if(nodeEl){
    const id=nodeEl.getAttribute("data-node"), n=byId(id); if(!n) return;
    SELN=id; SELL=null;
    DRAG={mode:"move",id:id,dx:p.x-n.x,dy:p.y-n.y,moved:false,x0:n.x,y0:n.y};
    try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
    ev.preventDefault(); markSel(); schedule(); return;
  }
  if(linkEl){
    SELL=linkEl.getAttribute("data-link"); SELN=null;
    markSel(); schedule(); return;
  }
  /* the drawing keeps its designed size and the box it sits in scrolls, so a drag
     on the background pans it — with touch-action:none that is the only gesture
     that can, and it is what makes the whole drawing reachable on a phone */
  SELN=null; SELL=null;
  const bx=cv.parentNode;
  if(bx&&(bx.scrollWidth>bx.clientWidth+1||bx.scrollHeight>bx.clientHeight+1)){
    DRAG={mode:"pan",px:ev.clientX,py:ev.clientY,sl:bx.scrollLeft,st:bx.scrollTop};
    try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
    cv.style.cursor="grabbing";
  }
  markSel(); schedule();
}
function onMove(ev){
  if(!DRAG) return;
  const p=toLocal(ev);
  if(DRAG.mode==="move"){
    const n=byId(DRAG.id); if(!n) return;
    n.x=snap(p.x-DRAG.dx); n.y=snap(p.y-DRAG.dy);
    clampNode(n); DRAG.moved=true; schedule();
  } else if(DRAG.mode==="link"){
    GHOST.x1=p.x; GHOST.y1=p.y; schedule();
  } else if(DRAG.mode==="pan"){
    const bx=el("canvas").parentNode;
    if(bx){ bx.scrollLeft=DRAG.sl-(ev.clientX-DRAG.px); bx.scrollTop=DRAG.st-(ev.clientY-DRAG.py); }
  }
  ev.preventDefault();
}
function onUp(ev){
  if(!DRAG) return;
  const cv=el("canvas");
  const p=toLocal(ev);
  const mode=DRAG.mode, from=DRAG.from, moved=DRAG.moved, mid=DRAG.id;
  const x0=DRAG.x0, y0=DRAG.y0;
  DRAG=null; GHOST=null;
  try{ cv.releasePointerCapture(ev.pointerId); }catch(e){}
  cv.style.cursor="";
  if(mode==="pan"){ return; }
  if(mode==="move"&&moved){
    /* one history entry per drag, not one per pointermove */
    const n=byId(mid);
    if(n){ const nx=n.x, ny=n.y; n.x=x0; n.y=y0; hist(); n.x=nx; n.y=ny; }
  }
  if(mode==="link"){
    const tn=nodeAt(p.x,p.y);
    if(tn){ hist(); addLink(from,tn.id); }
    else schedule();
  }
  run();
}

/* ---------------- keyboard interaction ----------------
   Tab walks the blocks and the connection labels, Enter/Space selects,
   the arrow keys move the selected block, C starts and closes a connection,
   Delete removes what is under the focus, Escape drops a started connection. */
const ARROWS={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
function onCanvasKey(ev){
  const k=ev.key;
  if(k==="Escape"){
    if(KCONN){ KCONN=null; msg("e_kcancel"); ev.preventDefault(); ev.stopPropagation(); schedule(); }
    return;
  }
  const t=ev.target;
  const g=(t&&t.closest)?t.closest("g[data-node],g[data-link]"):null;
  if(!g) return;
  const nid=g.getAttribute("data-node");
  const lid=nid?null:g.getAttribute("data-link");
  if(nid&&ARROWS[k]){
    const n=byId(nid); if(!n) return;
    ev.preventDefault(); ev.stopPropagation();
    const st=GRID*(ev.shiftKey?4:1), d=ARROWS[k];
    hist();
    n.x=snap(n.x+d[0]*st); n.y=snap(n.y+d[1]*st);
    clampNode(n);
    SELN=nid; SELL=null; markSel(); schedule();
    return;
  }
  if(k==="Enter"||k===" "||k==="Spacebar"){
    ev.preventDefault(); ev.stopPropagation();
    if(nid){
      if(KCONN&&KCONN!==nid){ const a=KCONN; KCONN=null; KFOC={kind:"node",id:nid}; hist(); addLink(a,nid); return; }
      SELN=nid; SELL=null; msg(""); markSel(); schedule();
    } else { SELL=lid; SELN=null; msg(""); markSel(); schedule(); }
    return;
  }
  if((k==="c"||k==="C")&&nid){
    ev.preventDefault(); ev.stopPropagation();
    if(KCONN===null){ KCONN=nid; SELN=nid; SELL=null; msg("e_kconn",nid); markSel(); schedule(); }
    else if(KCONN===nid){ KCONN=null; msg("e_kcancel"); schedule(); }
    else { const a=KCONN; KCONN=null; KFOC={kind:"node",id:nid}; hist(); addLink(a,nid); }
    return;
  }
  if(k==="Delete"||k==="Backspace"){
    ev.preventDefault(); ev.stopPropagation();
    KCONN=null; hist();
    if(nid){
      const i=NODES.map(x=>x.id).indexOf(nid);
      const nx=NODES[i+1]||NODES[i-1];
      if(nx) KFOC={kind:"node",id:nx.id};
      deleteNode(nid);
    } else {
      const i=LINKS.map(x=>x.id).indexOf(lid);
      const nx=LINKS[i+1]||LINKS[i-1];
      if(nx) KFOC={kind:"link",id:nx.id};
      deleteLink(lid);
    }
  }
}

/* ================== model operations ================== */
const PREFIX={room:"R",psup:"PS",asup:"AS",psink:"PX",asink:"AX"};
function nextNodeId(type){
  const p=PREFIX[type]; let k=1;
  while(NODES.some(n=>n.id===p+k)) k++;
  return p+k;
}
function nextLinkId(){ let k=1; while(LINKS.some(L=>L.id==="K"+k)) k++; return "K"+k; }

function freeSpot(type){
  const s=(type==="room")?RSZ:NSZ;
  for(let y=0;y+s.h<=VH+600;y+=GRID){
    for(let x=0;x+s.w<=VW;x+=GRID){
      const r={x:x,y:y,w:s.w,h:s.h};
      let ok=true;
      for(const n of NODES){ const q=rectOf(n);
        if(x<q.x+q.w+GRID&&x+s.w+GRID>q.x&&y<q.y+q.h+GRID&&y+s.h+GRID>q.y){ ok=false; break; } }
      if(ok) return {x:x,y:y};
    }
  }
  return null;
}
function addNode(type){
  const spot=freeSpot(type);
  if(!spot){ msg("e_full"); return; }
  const id=nextNodeId(type);
  const base={id:id,type:type,key:null,name:T("nn_"+type),x:spot.x,y:spot.y};
  if(type==="room") Object.assign(base,{V:500,T:20,RH:50,leak:0.05,
    rank:rooms().length+1,tgt:0,qh:0,qc:0,gm:0,gc:0});
  else if(type==="psup") Object.assign(base,{T:gv("i_tout",5),RH:gv("i_rhout",70)});
  else if(type==="psink") Object.assign(base,{T:gv("i_tout",5),RH:gv("i_rhout",70)});
  else if(type==="asup") Object.assign(base,{Q:3000,T:20,RH:45,m:copyM(MDEF.asup)});
  else if(type==="asink") Object.assign(base,{Q:3000,T:20,RH:50,m:copyM(MDEF.asink)});
  NODES.push(base);
  SELN=id; SELL=null;
  rebuild();
}
function deleteNode(id){
  const n=byId(id); if(!n) return;
  if(n.type==="room"&&rooms().length<=1){ msg("e_r1"); return; }
  NODES=NODES.filter(x=>x.id!==id);
  LINKS=LINKS.filter(L=>L.a!==id&&L.b!==id);
  if(SELN===id) SELN=null;
  if(SELL&&!linkById(SELL)) SELL=null;
  rebuild();
}
function linkCount(id){ return LINKS.filter(L=>L.a===id||L.b===id).length; }
function addLink(aId,bId){
  const A=byId(aId), B=byId(bId);
  if(!A||!B||aId===bId){ msg("e_l1"); rebuild(); return; }
  if(!isRoom(A)&&!isRoom(B)){ msg("e_l2"); rebuild(); return; }
  if(LINKS.some(L=>(L.a===aId&&L.b===bId)||(L.a===bId&&L.b===aId))){ msg("e_l4"); rebuild(); return; }
  if((isActive(A)&&linkCount(aId)>=1)||(isActive(B)&&linkCount(bId)>=1)){ msg("e_l3"); rebuild(); return; }
  let a=aId, b=bId;
  if(isActive(B)&&B.type==="asup"){ a=bId; b=aId; }
  if(isActive(A)&&A.type==="asink"){ a=bId; b=aId; }
  const act=isActive(A)||isActive(B);
  const amb=isAmb(A)||isAmb(B);
  const id=nextLinkId();
  const L=act
    ? {id:id,a:a,b:b,t:"duct",A:0.40,gap:0.40,cd:0.65,h:0,req:"none",f:fmode(1)}
    : {id:id,a:a,b:b,t:"door",A:1.90,gap:0.020,cd:0.60,h:0,req:amb?"none":"auto",
       f:{prod:0,clean:0.25,dry:0.15,defr:0.10,idle:0,emg:0.10,fire:1}};
  LINKS.push(L);
  SELL=id; SELN=null;
  msg("");
  rebuild();
}
function deleteLink(id){
  LINKS=LINKS.filter(L=>L.id!==id);
  if(SELL===id) SELL=null;
  rebuild();
}
function deleteSelected(){
  if(SELN) deleteNode(SELN);
  else if(SELL) deleteLink(SELL);
  else msg("e_sel");
}
/* tidy layout: supplies on top, rooms by rank in the middle, extracts below */
function arrange(){
  const sup=NODES.filter(n=>n.type==="asup"||n.type==="psup");
  const rm=rooms().slice().sort((a,b)=>(num(a.rank,0)-num(b.rank,0))||(a.id<b.id?-1:1));
  const snk=NODES.filter(n=>n.type==="asink"||n.type==="psink");
  const place=(list,size,y)=>{
    const per=Math.max(1,Math.floor((VW-20)/(size.w+GRID*4)));
    list.forEach((n,i)=>{
      const c=i%per, r=Math.floor(i/per);
      n.x=snap(20+c*(size.w+GRID*4));
      n.y=snap(y+r*(size.h+GRID*3));
      n.x=Math.max(0,Math.min(VW-size.w,n.x));
    });
    return Math.ceil(list.length/per);
  };
  const rowsA=place(sup,NSZ,20);
  let yy=20+rowsA*(NSZ.h+GRID*3)+GRID*2;
  const rowsB=place(rm,RSZ,yy);
  yy=yy+rowsB*(RSZ.h+GRID*3)+GRID*2;
  place(snk,NSZ,yy);
  rebuild();
}

/* ---------------- focus survives every redraw ---------------- */
function focusMark(){
  const a=document.activeElement;
  if(!a||a===document.body||!a.getAttribute) return null;
  const at=["data-mode","data-cat","data-st","data-n","data-k","data-o"];
  let sel=null;
  if(a.id) sel="#"+CSS.escape(a.id);
  else{
    for(const k of at){ const v=a.getAttribute(k);
      if(v!==null){ sel="["+k+'="'+CSS.escape(v)+'"]'; break; } }
    if(sel){ const f=a.getAttribute("data-f"); if(f!==null) sel+='[data-f="'+CSS.escape(f)+'"]'; }
  }
  if(!sel) return null;
  let ss=null,se=null;
  try{ if(a.selectionStart!==undefined&&a.selectionStart!==null){ ss=a.selectionStart; se=a.selectionEnd; } }catch(e){}
  return {sel:sel,ss:ss,se:se};
}
function focusRestore(m){
  if(!m) return;
  let e=null; try{ e=document.querySelector(m.sel); }catch(err){ e=null; }
  if(!e||typeof e.focus!=="function") return;
  try{ e.focus({preventScroll:true}); }catch(err){ try{ e.focus(); }catch(e2){} }
  if(m.ss!==null){ try{ e.setSelectionRange(m.ss,m.se); }catch(err){} }
}
function keepFocus(fn){ const m=focusMark(); fn(); focusRestore(m); }

function badgeSt(st,uid){

    '" aria-label="'+esc(T("bx_st")+": "+T(STKEY[st])+" — "+T("bx_expls"))+'" title="'+esc(T(STTIP[st]))+'">'+
    '<span class="gl" aria-hidden="true">'+STGLYPH[st]+'</span>'+esc(T(STKEY[st]))+'</button>';
}
function showMdl(kind,key){
  const isCat=(kind==="cat");
  const name=isCat?T(CATKEY[key]):T(STKEY[key]);
  const tip=isCat?T(CATTIP[key]):T(STTIP[key]);
  const cnt=isCat?ASM.filter(a=>a.cat===key).length:ASM.filter(a=>a.st===key).length;
  if(!UI||!UI.dialog) return;
  closeMdl();
  MDL=UI.dialog({
    title:(isCat?T("bx_cat"):T("bx_st"))+": "+name,
    body:(box)=>{
      box.innerHTML='<p>'+esc(tip)+'</p><p>'+esc(T("bx_mix"))+'</p>'+
        '<p class="dgu-hint">'+esc(T("h_asm")+": "+cnt)+'</p>'+
        '<p class="dgu-hint">'+esc(T("bx_leg"))+'</p>'+
        '<div class="catlegend">'+CATORDER.map(c=>badgeCat(c,"md-"+c)).join("")+
          STORDER.map(x=>badgeSt(x,"md-"+x)).join("")+'</div>';
    },
    actions:[{label:T("bx_close"),variant:"ghost"}],
    onClose:()=>{ MDL=null; }
  });
}
function renderCatLegend(){
  el("cat-legend").innerHTML='<span class="lgt">'+esc(T("h_srcbasis"))+'</span>'+
    CATORDER.map(c=>badgeCat(c,"lg-"+c)).join("")+
    STORDER.map(st=>badgeSt(st,"lg-"+st)).join("");
}
function renderAsm(){
  let s="";
  CATORDER.forEach(cat=>{
    const items=ASM.filter(a=>a.cat===cat); if(!items.length) return;
    s+='<div class="asmgrp"><h3>'+badgeCat(cat,"gr-"+cat)+'</h3>';
    items.forEach(a=>{
      s+='<div class="asm"><span class="code" style="min-width:26px">'+esc(a.id)+'</span>'+
         '<span class="v">'+esc(a.v?a.v:T("a_req"))+'</span>'+
         badgeSt(a.st,"as-"+a.id)+
         '<span class="t">'+esc(T(a.k))+'</span></div>';
    });
    s+='</div>';
  });
  el("asm-out").innerHTML=s;
  renderCatLegend();
}
/* ---------------- charts ---------------- */
function chart(hostId,cfg){
  const W=cfg.w||420, H=cfg.h||230, L=46, Rr=12, Tp=10, B=32;
  const iw=W-L-Rr, ih=H-Tp-B;
  const X=(x)=>L+(x-cfg.xmin)/(cfg.xmax-cfg.xmin)*iw;
  const Y=(y)=>Tp+ih-(y-cfg.ymin)/(cfg.ymax-cfg.ymin)*ih;
  const ink=cssv("--ink"), mut=cssv("--muted"), grid=cssv("--line");
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(cfg.alab||(cfg.ylab+" / "+cfg.xlab))+'">';
  for(let i=0;i<=5;i++){
    const xv=cfg.xmin+(cfg.xmax-cfg.xmin)*i/5, yv=cfg.ymin+(cfg.ymax-cfg.ymin)*i/5;
    s+='<line x1="'+X(xv).toFixed(1)+'" y1="'+Tp+'" x2="'+X(xv).toFixed(1)+'" y2="'+(Tp+ih)+'" stroke="'+grid+'" stroke-width="1"/>';
    s+='<line x1="'+L+'" y1="'+Y(yv).toFixed(1)+'" x2="'+(L+iw)+'" y2="'+Y(yv).toFixed(1)+'" stroke="'+grid+'" stroke-width="1"/>';
    s+='<text x="'+X(xv).toFixed(1)+'" y="'+(Tp+ih+13)+'" font-size="9" fill="'+mut+'" text-anchor="middle">'+fmt(xv,cfg.xd===undefined?0:cfg.xd)+'</text>';
    s+='<text x="'+(L-5)+'" y="'+(Y(yv)+3).toFixed(1)+'" font-size="9" fill="'+mut+'" text-anchor="end">'+fmt(yv,cfg.yd===undefined?1:cfg.yd)+'</text>';
  }
  s+='<rect x="'+L+'" y="'+Tp+'" width="'+iw+'" height="'+ih+'" fill="none" stroke="'+mut+'" stroke-width="1"/>';
  (cfg.series||[]).forEach(se=>{
    const d=se.pts.filter(p=>isFinite(p[0])&&isFinite(p[1]))
      .map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
    if(d) s+='<path d="'+d+'" fill="none" stroke="'+se.color+'" stroke-width="'+(se.w||2)+
      '"'+(se.dash?' stroke-dasharray="'+se.dash+'"':"")+'/>';
  });
  (cfg.points||[]).forEach(pg=>{
    pg.pts.forEach(p=>{ if(!isFinite(p[0])||!isFinite(p[1]))return;
      const x=X(p[0]), y=Y(p[1]);
      if(x<L-2||x>L+iw+2||y<Tp-2||y>Tp+ih+2) return;
      if(pg.shape==="sq") s+='<rect x="'+(x-4).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" width="8" height="8" fill="'+pg.color+'" stroke="'+ink+'" stroke-width="1"/>';
      else s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(pg.r||2.6)+'" fill="'+pg.color+'"/>';
    });
  });
  s+='<text x="'+(L+iw/2)+'" y="'+(H-2)+'" font-size="9.5" fill="'+mut+'" text-anchor="middle">'+esc(cfg.xlab)+'</text>';
  s+='<text x="10" y="'+(Tp+ih/2)+'" font-size="9.5" fill="'+mut+'" text-anchor="middle" transform="rotate(-90 10 '+(Tp+ih/2)+')">'+esc(cfg.ylab)+'</text>';
  s+='</svg>';
  el(hostId).innerHTML=s;
}
/* text alternative of a chart: the same numbers the drawing shows, as a table */
function altTable(cols,rows,notes){

    cols.map(c=>'<th>'+esc(c)+'</th>').join("")+'</tr></thead><tbody>'+
