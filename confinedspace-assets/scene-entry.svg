<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <!-- sky and ground -->
  <rect width="640" height="400" fill="#eef3f7"/>
  <rect y="170" width="640" height="230" fill="#c9bfae"/>
  <rect y="166" width="640" height="8" fill="#8a8173"/>
  <!-- buried vessel below ground -->
  <rect x="180" y="220" width="300" height="165" rx="40" fill="#dde3e8" stroke="#4d5763" stroke-width="5"/>
  <rect x="186" y="340" width="288" height="39" rx="18" fill="#d9b86a" opacity=".55"/>
  <!-- manway neck through the ground -->
  <rect x="290" y="150" width="70" height="75" fill="#dde3e8" stroke="#4d5763" stroke-width="5"/>
  <rect x="276" y="142" width="98" height="12" rx="3" fill="#6b7580"/>
  <!-- open cover leaning beside -->
  <ellipse cx="410" cy="160" rx="34" ry="9" fill="#6b7580" stroke="#3b434c" stroke-width="3"/>
  <!-- ladder -->
  <g stroke="#9a6a2f" stroke-width="5">
    <line x1="305" y1="140" x2="305" y2="370"/><line x1="345" y1="140" x2="345" y2="370"/>
  </g>
  <g stroke="#9a6a2f" stroke-width="4">
    <line x1="305" y1="165" x2="345" y2="165"/><line x1="305" y1="195" x2="345" y2="195"/>
    <line x1="305" y1="225" x2="345" y2="225"/><line x1="305" y1="255" x2="345" y2="255"/>
    <line x1="305" y1="285" x2="345" y2="285"/><line x1="305" y1="315" x2="345" y2="315"/>
    <line x1="305" y1="345" x2="345" y2="345"/>
  </g>
  <!-- entrant on the ladder -->
  <g>
    <circle cx="325" cy="238" r="12" fill="#e8c3a0"/>
    <path d="M313 232a12 11 0 0 1 24 0z" fill="#f2c200"/>
    <rect x="313" y="250" width="24" height="38" rx="6" fill="#f07c1f"/>
    <rect x="316" y="258" width="18" height="4" fill="#f5f5f5"/>
    <line x1="315" y1="256" x2="305" y2="226" stroke="#f07c1f" stroke-width="7" stroke-linecap="round"/>
    <line x1="335" y1="256" x2="345" y2="226" stroke="#f07c1f" stroke-width="7" stroke-linecap="round"/>
    <line x1="319" y1="286" x2="317" y2="316" stroke="#2f3e5c" stroke-width="8" stroke-linecap="round"/>
    <line x1="331" y1="286" x2="336" y2="310" stroke="#2f3e5c" stroke-width="8" stroke-linecap="round"/>
    <rect x="330" y="266" width="9" height="12" rx="2" fill="#303840"/>
  </g>
  <!-- ventilation hose -->
  <path d="M40 150 C 120 150, 200 120, 262 150 S 290 200, 296 300" fill="none" stroke="#2a78d6" stroke-width="12" stroke-linecap="round"/>
  <rect x="18" y="128" width="46" height="36" rx="6" fill="#2a78d6"/>
  <circle cx="41" cy="146" r="12" fill="#cfe0f5"/>
  <!-- attendant outside, standing beside the manway -->
  <g>
    <circle cx="228" cy="72" r="14" fill="#e8c3a0"/>
    <path d="M214 66a14 13 0 0 1 28 0z" fill="#f2c200"/>
    <rect x="213" y="88" width="30" height="46" rx="7" fill="#f07c1f"/>
    <rect x="216" y="98" width="24" height="5" fill="#f5f5f5"/>
    <line x1="243" y1="96" x2="252" y2="82" stroke="#f07c1f" stroke-width="8" stroke-linecap="round"/>
    <rect x="248" y="64" width="9" height="20" rx="2" fill="#303840"/>
    <line x1="213" y1="96" x2="206" y2="126" stroke="#f07c1f" stroke-width="8" stroke-linecap="round"/>
    <rect x="212" y="112" width="10" height="13" rx="2" fill="#303840"/>
    <line x1="221" y1="132" x2="219" y2="166" stroke="#2f3e5c" stroke-width="9" stroke-linecap="round"/>
    <line x1="235" y1="132" x2="238" y2="166" stroke="#2f3e5c" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- rescue equipment beside the entry -->
  <g>
    <rect x="450" y="150" width="150" height="14" rx="4" fill="#c0392b"/>
    <line x1="456" y1="164" x2="456" y2="170" stroke="#555" stroke-width="4"/>
    <line x1="594" y1="164" x2="594" y2="170" stroke="#555" stroke-width="4"/>
    <rect x="470" y="110" width="40" height="36" rx="8" fill="#2f3e5c"/>
    <circle cx="490" cy="104" r="9" fill="#9aa5b1"/>
    <rect x="530" y="118" width="46" height="28" rx="4" fill="#ffffff" stroke="#1f6f34" stroke-width="4"/>
    <rect x="547" y="112" width="12" height="7" rx="2" fill="#1f6f34"/>
  </g>
</svg>
