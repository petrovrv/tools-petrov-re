<script>
(function () {
'use strict';
/* Cycling & Fatigue Life — calculation core (pure functions, no DOM).
   Miner linear damage per transient group, optional environmental factor F_en after
   NUREG/CR-6909 Rev.1 Appendix A, future scenarios, deterministic uncertainty envelope. */
var CF_VERSION = '2026-10-16.cf-3';
var CF_STATUS = ['confirmed', 'unknown', 'rejected', 'na'];
var CF_PROFILE = ['air', 'nureg', 'manual'];
var CF_MATERIAL = ['ferritic', 'austenitic', 'nicrfe', 'inconel718'];
var CF_SS = ['wrought-normal', 'sensitized-or-cast'];
var CF_APPROVAL = ['not-assessed', 'approved', 'rejected'];
var CF_T_MAX = 325;           /* °C, upper bound of the Appendix A correlations; above it a recorded justification is required */
var CF_RATE_MIN = 0.0004;     /* %/s, lower saturation of the strain-rate term */
var CF_TOL = 1e-12;           /* relative tie tolerance for the criterion comparison */

function cfFinite(x) { return typeof x === 'number' && isFinite(x); }
function cfText(x) { return x === null || x === undefined ? '' : String(x).trim(); }

/* strain-rate term: 0 above the upper rate, ln(max(rate, 0.0004)/upper) below it */
function cfRateStar(rate, upper) { return rate > upper ? 0 : Math.log(Math.max(rate, CF_RATE_MIN) / upper); }
/* threshold below which F_en = 1 (strain amplitude in %, stress amplitude in MPa) */
function cfThreshold(material, g) {
  var e = material === 'ferritic' ? 0.07 : 0.10, s = material === 'ferritic' ? 145 : 195;
  return (cfFinite(g.strainAmpPct) && g.strainAmpPct <= e) || (cfFinite(g.stressAmpMPa) && g.stressAmpMPa <= s);
}
/* NUREG/CR-6909 Rev.1 Appendix A F_en; returns {ok, value, branch} or {ok:false, reason} */
function cfNuregFen(material, ssSubtype, g) {
  if (material === 'inconel718') return { ok: false, reason: 'inconel718' };
  if (['ferritic', 'austenitic', 'nicrfe'].indexOf(material) < 0) return { ok: false, reason: 'material' };
  if (!cfFinite(g.tempC)) return { ok: false, reason: 'temperature' };
  if (g.tempC > CF_T_MAX && !cfText(g.tempJustification)) return { ok: false, reason: 'temperature_justification' };
  if (!cfFinite(g.strainRatePctS) || g.strainRatePctS <= 0) return { ok: false, reason: 'rate' };
  if (!cfFinite(g.doPpm) || g.doPpm < 0) return { ok: false, reason: 'oxygen' };
  if (cfThreshold(material, g)) return { ok: true, value: 1, branch: 'threshold' };
  var T = g.tempC, r = g.strainRatePctS, O = g.doPpm, tt, rr, oo;
  if (material === 'ferritic') {
    if (!cfFinite(g.sulfurWtPct) || g.sulfurWtPct < 0) return { ok: false, reason: 'sulfur' };
    var ss = g.sulfurWtPct <= 0.015 ? 2 + 98 * g.sulfurWtPct : 3.47;
    tt = T < 150 ? 0.395 : (T - 75) / 190;
    oo = O < 0.04 ? 1.49 : (O <= 0.5 ? Math.log(O / 0.009) : 4.02);
    rr = cfRateStar(r, 2.2);
    return { ok: true, value: Math.exp((0.003 - 0.031 * rr) * ss * tt * oo), branch: 'nureg' };
  }
  if (material === 'austenitic') {
    tt = T < 100 ? 0 : (T - 100) / 250;
    rr = cfRateStar(r, 7);
    oo = O < 0.1 ? 0.29 : (ssSubtype === 'sensitized-or-cast' ? 0.29 : 0.14);
    return { ok: true, value: Math.exp(-tt * rr * oo), branch: 'nureg' };
  }
  tt = T < 50 ? 0 : (T - 50) / 275;
  rr = cfRateStar(r, 5);
  oo = O < 0.1 ? 0.14 : 0.06;
  return { ok: true, value: Math.exp(-tt * rr * oo), branch: 'nureg' };
}
function cfFen(s, g) {
  if (s.profile === 'air') return { ok: true, value: 1, branch: 'air' };
  if (s.profile === 'manual') {
    if (!cfText(s.manualFenSource) || s.manualFenApplicability !== true) return { ok: false, reason: 'manual_source' };
    if (!cfFinite(g.manualFen) || g.manualFen < 1) return { ok: false, reason: 'manual_value' };
    return { ok: true, value: g.manualFen, branch: 'manual' };
  }
  return cfNuregFen(s.material, s.ssSubtype, g);
}

function cfAssess(s) {
  var issues = [], warnings = [], rows = [];
  var curveOk = s.curveStatus === 'confirmed' && !!cfText(s.curveSource) && !!cfText(s.curveVersion);
  if (!curveOk) issues.push({ code: 'curve' });
  var groups = Array.isArray(s.groups) ? s.groups : [];
  if (!groups.length) issues.push({ code: 'no_groups' });
  var air = 0, cur = 0, annual = 0, startCuf = 0, startPerYear = 0, groupsOk = true;
  groups.forEach(function (g, i) {
    var name = cfText(g.name) || ('#' + (i + 1)), row = { name: name, status: 'blocked', reason: '' };
    function block(code) { row.reason = code; issues.push({ code: code, group: name }); groupsOk = false; rows.push(row); }
    if (g.status === 'na') { if (!cfText(g.reason)) return block('na_reason_missing'); row.status = 'na'; rows.push(row); return; }
    if (g.status !== 'confirmed') return block('group_status');
    if (!cfText(g.source) || !cfText(g.sourceDate)) return block('group_source');
    if (!cfFinite(g.N) || g.N <= 0) return block('N');
    if (!cfFinite(g.n) || g.n < 0 || !cfFinite(g.futurePerYear) || g.futurePerYear < 0) return block('n');
    var f = cfFen(s, g);
    if (!f.ok) return block(f.reason);
    var uAir = g.n / g.N, u = uAir * f.value, a = g.futurePerYear / g.N * f.value;
    air += uAir; cur += u; annual += a;
    if (g.start === true) { startCuf += u; startPerYear += g.futurePerYear; }
    if (s.profile === 'nureg' && g.tempC > CF_T_MAX) warnings.push({ code: 'above_325', group: name });
    if (f.branch === 'threshold') warnings.push({ code: 'threshold', group: name });
    if (s.profile === 'nureg' && !cfFinite(g.strainAmpPct) && !cfFinite(g.stressAmpMPa)) warnings.push({ code: 'no_amplitude', group: name });
    row.status = 'computed'; row.n = g.n; row.N = g.N; row.u_air = uAir; row.fen = f.value; row.fen_branch = f.branch; row.u = u; row.annual = a; row.start = g.start === true;
    rows.push(row);
  });
  var ok = curveOk && groupsOk && groups.length > 0;
  var critOk = cfFinite(s.criterion) && s.criterion > 0;
  if (!critOk) issues.push({ code: 'criterion' });
  var out = { model_version: CF_VERSION, calculation_status: ok ? 'computed' : 'blocked', rows: rows,
    total_cuf: null, air_cuf: null, annual_cuf: null, start_cuf: null, start_share: null,
    criterion_status: 'unknown', criterion_margin: null, uncertainty_low: null, uncertainty_high: null, scenarios: [], issues: issues, warnings: warnings };
  if (!ok) return out;

function cfCyrb53(str) { var h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (var i = 0; i < str.length; i++) { var ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }

rst einen synthetischen Fall verwenden. Unähnliche Transienten vor der Zuordnung von N und F_en trennen; anschließend prüfen, ob jede Umweltkorrelation in ihrem Gültigkeitsbereich bleibt.","Gebruik eerst een synthetische case. Splits verschillende transiënten vóór toekenning van N en F_en; controleer daarna of elke milieucorrelatie binnen het geldigheidsgebied blijft.","Commencer par un cas synthétique. Séparer les transitoires différents avant d’affecter N et F_en, puis vérifier que chaque corrélation environnementale reste dans son domaine.","Empiece con un caso sintético. Separe transitorios distintos antes de asignar N y F_en; después compruebe que cada correlación ambiental permanece dentro de su rango.","Zacznij od przypadku syntetycznego. Rozdziel różne stany przejściowe przed przypisaniem N i F_en, a potem sprawdź zakres stosowalności każdej korelacji środowiskowej."],"Miner grouping":["Miner grouping","Групування Майнера","Miner-Gruppierung","Miner-groepering","Groupement Miner","Agrupación Miner","Grupowanie Minera"],"Each row represents one population that shares its allowable cycle count N and applicable F_en assumptions. Combining different amplitudes, temperatures or rates into one row can hide a controlling contribution.":["Each row represents one population that shares its allowable cycle count N and applicable F_en assumptions. Combining different amplitudes, temperatures or rates into one row can hide a controlling contribution.","Кожен рядок представляє одну сукупність зі спільними N та припущеннями F_en. Об’єднання різних амплітуд, температур або швидкостей в один рядок може приховати визначальний внесок.","Jede Zeile steht für eine Population mit gemeinsamer zulässiger Zyklenzahl N und F_en-Annahmen. Das Zusammenfassen unterschiedlicher Amplituden, Temperaturen oder Raten kann den maßgebenden Beitrag verdecken.","Elke rij vertegenwoordigt een populatie met dezelfde N en F_en-aannames. Verschillende amplitudes, temperaturen of snelheden samenvoegen kan de bepalende bijdrage verbergen.","Chaque ligne représente une population partageant N et les hypothèses F_en. Fusionner des amplitudes, températures ou vitesses différentes peut masquer la contribution dominante.","Cada fila representa una población con el mismo N y supuestos F_en. Mezclar amplitudes, temperaturas o velocidades distintas puede ocultar la contribución dominante.","Każdy wiersz reprezentuje populację o wspólnym N i założeniach F_en. Łączenie różnych amplitud, temperatur lub prędkości może ukryć wkład dominujący."],"F_en applicability":["F_en applicability","Застосовність F_en","F_en-Gültigkeit","F_en-toepasbaarheid","Applicabilité de F_en","Aplicabilidad de F_en","Stosowalność F_en"],"Calculation, criterion, approval":["Calculation, criterion, approval","Obчислення, критерій, схвалення","Berechnung, Kriterium, Freigabe","Berekening, criterium, goedkeuring","Calcul, critère, approbation","Cálculo, criterio, aprobación","Obliczenie, kryterium, zatwierdzenie"],"CUF is the calculation. Comparison with the entered limit is the criterion check. Approval is a separately recorded human/project decision and is never generated from the number.":["CUF is the calculation. Comparison with the entered limit is the criterion check. Approval is a separately recorded human/project decision and is never generated from the number.","CUF є розрахунком. Порівняння з введеною межею є перевіркою критерію. Схвалення записується окремо як рішення відповідальної особи/проєкту й не генерується з числа.","CUF ist die Berechnung. Der Vergleich mit dem eingegebenen Grenzwert ist die Kriteriumsprüfung. Die Freigabe ist eine separat erfasste menschliche/Projektentscheidung und wird nie aus der Zahl erzeugt.","CUF is de berekening. Vergelijking met de ingevoerde grens is de criteriumcontrole. Goedkeuring is een afzonderlijk vastgelegde menselijke/projectbeslissing en wordt nooit uit het getal afgeleid.","Le CUF est le calcul. La comparaison à la limite saisie est le contrôle du critère. L’approbation est une décision humaine/projet enregistrée séparément et n’est jamais générée à partir du nombre.","El CUF es el cálculo. La comparación con el límite introducido es la comprobación del criterio. La aprobación es una decisión humana/proyecto registrada por separado y nunca se genera a partir del número.","CUF jest wynikiem obliczenia. Porównanie z wprowadzonym limitem stanowi kontrolę kryterium. Zatwierdzenie jest osobną decyzją człowieka/projektu i nigdy nie wynika automatycznie z liczby."],"Calculation complete · criterion met":["Calculation complete · criterion met","Розрахунок виконано · критерій виконано","Berechnung abgeschlossen · Kriterium erfüllt","Berekening voltooid · criterium gehaald","Calcul terminé · critère satisfait","Cálculo completo · criterio cumplido","Obliczenie wykonane · kryterium spełnione"],"Calculation complete · criterion exceeded":["Calculation complete · criterion exceeded","Розрахунок виконано · критерій перевищено","Berechnung abgeschlossen · Kriterium überschritten","Berekening voltooid · criterium overschreden","Calcul terminé · critère dépassé","Cálculo completo · criterio excedido","Obliczenie wykonane · kryterium przekroczone"],"Numerical result blocked":["Numerical result blocked","Числовий результат заблоковано","Numerisches Ergebnis gesperrt","Numeriek resultaat geblokkeerd","Résultat numérique bloqué","Resultado numérico bloqueado","Wynik liczbowy zablokowany"],"Synthetic/training case: do not use this calculation record as project evidence without replacing the synthetic inputs and clearing the flag.":["Synthetic/training case: do not use this calculation record as project evidence without replacing the synthetic inputs and clearing the flag.","Синтетичний/навчальний випадок: не використовуйте запис розрахунку як проєктний доказ без заміни синтетичних входів і зняття прапорця.","Synthetischer/Trainingsfall: diesen Berechnungsnachweis erst nach Ersatz der synthetischen Eingaben und Löschen der Kennz  wiersz czy dwa?"],"Load “Merged transients”: 140 thermal cycles are entered as one row with N = 1000. Before running, estimate the usage if the 40 more severe cycles really have N = 200.":["Load “Merged transients”: 140 thermal cycles are entered as one row with N = 1000. Before running, estimate the usage if the 40 more severe cycles really have N = 200.","Завантажте «Об’єднані перехідні режими»: 140 термічних циклів введено одним рядком з N = 1000. Перш ніж запускати, оцініть використання, якщо 40 жорсткіших циклів насправді мають N = 200.","Laden Sie „Zusammengelegte Transienten“: 140 thermische Zyklen stehen in einer Zeile mit N = 1000. Schätzen Sie vor dem Rechnen die Ausnutzung, wenn die 40 schärferen Zyklen tatsächlich N = 200 haben.","Laad ‘Samengevoegde transiënten’: 140 thermische cycli staan in één rij met N = 1000. Schat vóór het rekenen het gebruik als de 40 zwaardere cycli werkelijk N = 200 hebben.","Chargez « Transitoires fusionnés » : 140 cycles thermiques sont saisis sur une ligne avec N = 1000. Avant de calculer, estimez l’usage si les 40 cycles plus sévères ont en réalité N = 200.","Cargue «Transitorios fusionados»: 140 ciclos térmicos están en una fila con N = 1000. Antes de calcular, estime el uso si los 40 ciclos más severos tienen en realidad N = 200.","Wczytaj „Połączone stany przejściowe”: 140 cykli termicznych wpisano jednym wierszem z N = 1000. Przed obliczeniem oszacuj wykorzystanie, jeśli 40 ostrzejszych cykli ma w rzeczywistości N = 200."],"Why the merged row under-reports":["Why the merged row under-reports","Чому об’єднаний рядок занижує результат","Warum die zusammengelegte Zeile zu wenig ausweist","Waarom de samengevoegde rij te weinig toont","Pourquoi la ligne fusionnée sous-estime","Por qué la fila fusionada subestima","Dlaczego połączony wiersz zaniża wynik"],"The correction":["The correction","Виправлення","Die Korrektur","De correctie","La correction","La corrección","Poprawka"],"CUF is the calculation. Comparison with the entered limit is the criterion check. Approval is a separately recorded human/project decision and is never generated from the number. It holds only for the inputs it was given with.":["CUF is the calculation. Comparison with the entered limit is the criterion check. Approval is a separately recorded human/project decision and is never generated from the number. It holds only for the inputs it was given with.","CUF — це розрахунок. Порівняння з введеною межею — перевірка критерію. Затвердження — окремо зафіксоване рішення людини/проєкту, яке ніколи не генерується з числа. Воно чинне лише для входів, з якими його надано.","Der CUF ist die Berechnung. Der Vergleich mit dem eingegebenen Grenzwert ist die Kriteriumsprüfung. Die Freigabe ist eine separat dokumentierte Entscheidung von Menschen/Projekt und entsteht nie aus der Zahl. Sie gilt nur für die Eingaben, mit denen sie erteilt wurde.","De CUF is de berekening. De vergelijking met de ingevoerde grens is de criteriumcontrole. Goedkeuring is een apart vastgelegd besluit van mens/project en wordt nooit uit het getal afgeleid. Ze geldt alleen voor de invoer waarmee ze is gegeven.","Le CUF est le calcul. La comparaison avec la limite saisie est le contrôle du critère. L’approbation est une décision humaine/projet enregistrée séparément, jamais générée à partir du nombre. Elle ne vaut que pour les entrées avec lesquelles elle a été donnée.","El CUF es el cálculo. La comparación con el límite introducido es la comprobación del criterio. La aprobación es una decisión humana/del proyecto registrada aparte y nunca se genera a partir del número. Vale solo para las entradas con las que se dio.","CUF to obliczenie. Porównanie z wprowadzoną granicą to sprawdzenie kryterium. Zatwierdzenie to odrębnie zapisana decyzja człowieka/projektu, nigdy niegenerowana z liczby. Obowiązuje tylko dla danych, z którymi je nadano."],"Group to edit":["Group to edit","Група для редагування","Zu bearbeitende Gruppe","Te bewerken groep","Groupe à modifier","Grupo a editar","Grupa do edycji"],"Add at least one transient group.":["Add at least one transient group.","Додайте щонайменше одну групу перехідних режимів.","Mindestens eine Transientengruppe hinzufügen.","Voeg minstens één transiëntgroep toe.","Ajoutez au moins un groupe de transitoires.","Añada al menos un grupo de transitorios.","Dodaj co najmniej jedną grupę stanów przejściowych."],"Transient group “{n}” needs a source and a date/revision for its counts.":["Transient group “{n}” needs a source and a date/revision for its counts.","Група перехідних режимів «{n}» потребує джерела та дати/редакції для лічильників.","Transientengruppe „{n}“ braucht Quelle und Datum/Revision für ihre Zählungen.","Transiëntgroep “{n}” heeft een bron en datum/revisie voor de tellingen nodig.","Le groupe de transitoires « {n} » nécessite une source et une date/révision pour ses comptages.","El grupo de transitorios «{n}» necesita una fuente y una fecha/revisión para sus recuentos.","Grupa stanów przejściowych „{n}” wymaga źródła i daty/rewizji liczników."],"Select a material family for the NUREG F_en profile.":["Select a material family for the NUREG F_en profile.","Оберіть групу матеріалів для профілю NUREG F_en.","Werkstofffamilie für das NUREG-F_en-Profil wählen.","Kies een materiaalfamilie voor het NUREG-F_en-profiel.","Choisissez une famille de matériaux pour le profil F_en NUREG.","Seleccione una familia de materiales para el perfil F_en de NUREG.","Wybierz rodzinę materiałów dla profilu F_en NUREG."],"The cost per start must be zero or positive.":["The cost per start must be zero or positive.","Вартість одного пуску має бути нульовою або додатною.","Die Kosten je Start müssen null oder positiv sein.","De kosten per start moeten nul of positief zijn.","Le coût par démarrage doit être nul ou positif.","El coste por arranque debe ser cero o positivo.","Koszt jednego rozruchu musi być zerowy lub dodatni."],"The saved state held values outside the tool’s lists; they were replaced by defaults: ":["The saved state held values outside the tool’s lists; they were replaced by defaults: ","Збережений стан містив значення поза списками інструмента; їх замінено типовими: ","Der gespeicherte Zustand enthielt Werte außerhalb der Wertelisten; sie wurden durch Vorgaben ersetzt: ","De opgeslagen toestand bevatte waarden buiten de keuzelijsten; ze zijn vervangen door standaardwaarden: ","L’état enregistré contenait des valeurs hors des listes ; elles ont été remplacées par les valeurs par défaut : ","El estado guardado contenía valores fuera de las listas; se sustituyeron por los valores por defecto: ","Zapisany stan zawierał wartości spoza list; zastąpiono je domyślnymi: "],"Temperature":["Temperature","Температура","Temperatur","Temperatuur","Température","Temperatura","Temperatura"],"Dissolved oxygen":["Dissolved oxygen","Розчинений кисень","Gelöster Sauerstoff","Opgeloste zuurstof","Oxygène dissous","Oxígeno disuelto","Tlen rozpuszczony"],"Manual F_en value":["Manual F_en value","Ручне значення F_en","Manueller F_en-Wert","Handmatige F_en-waarde","Valeur F_en manuelle","Valor F_en manual","Ręczna wartość F_en"],"Thermal transient A":["Thermal transient A","Термічний перехідний режим A","Thermische Transiente A","Thermische transiënt A","Transitoire thermique A","Transitorio térmico A","Stan przejściowy cieplny A"],"Thermal transient B":["Thermal transient B","Термічний перехідний режим B","Thermische Transiente B","Thermische transiënt B","Transitoire thermique B","Transitorio térmico B","Stan przejściowy cieplny B"],"All thermal transients (merged)":["All thermal transients (merged)","Усі термічні перехідні режими (об’єднано)","Alle thermischen Transienten (zusammengelegt)","Alle thermische transiënten (samengevoegd)","Tous les transitoires thermiques (fusionnés)","Todos los transitorios térmicos (fusionados)","Wszystkie cieplne stany przejściowe (połączone)"],"Current basis":["Current basis","Поточна основа","Aktuelle Basis","Huidige basis","Base actuelle","Base actual","Obecna podstawa"],"Cold start":["Cold start","Холодний пуск","Kaltstart","Koude start","Démarrage à froid","Arranque en frío","Rozruch z zimnego stanu"],"Hot start":["Hot start","Гарячий пуск","Warmstart","Warme start","Démarrage à chaud","Arranque en caliente","Rozruch z gorącego stanu"],"Load swing":["Load swing","Зміна навантаження","Lastwechsel","Lastwisseling","Variation de charge","Variación de carga","Zmiana obciążenia"],"10 years":["10 years","10 років","10 Jahre","10 jaar","10 ans","10 años","10 lat"],"20 years":["20 years","20 років","20 Jahre","20 jaar","20 ans","20 años","20 lat"],"Heat-up / cool-down":["Heat-up / cool-down","Розігрів / розхолодження","Aufheizen / Abkühlen","Opwarmen / afkoelen","Montée en température / refroidissement","Calentamiento / enfriamiento","Nagrzewanie / wychładzanie"],"Pressure test":["Pressure test","Гідровипробування","Druckprüfung","Druktest","Épreuve de pression","Prueba de presión","Próba ciśnieniowa"],"Upset transient":["Upset transient","Порушення нормальної експлуатації","Störfalltransiente","Storingstransiënt","Transitoire d’incident","Transitorio de perturbación","Stan przejściowy zakłóceniowy"],"60-year horizon":["60-year horizon","Горизонт 60 років","60-Jahres-Horizont","Horizon 60 jaar","Horizon de 60 ans","Horizonte de 60 años","Horyzont 60 lat"],"80-year horizon":["80-year horizon","Горизонт 80 років","80-Jahres-Horizont","Horizon 80 jaar","Horizon de 80 ans","Horizonte de 80 años","Horyzont 80 lat"],"Hot transient":["Hot transient","Гарячий перехідний режим","Heiße Transiente","Hete transiënt","Transitoire chaud","Transitorio caliente","Gorący stan przejściowy"],"The merged row gives 140/1000 = 0.14. Separated, the 100 mild cycles give 0.10 and the 40 severe cycles 40/200 = 0.20, together 0.30: the merge assigned the mild N to the severe cycles and hid more than half of the usage.":["The merged row gives 140/1000 = 0.14. Separated, the 100 mild cycles give 0.10 and the 40 severe cycles 40/200 = 0.20, together 0.30: the merge assigned the mild N to the severe cycles and hid more than half of the usage.","Об’єднаний рядок дає 140/1000 = 0,14. Окремо 100 м’яких циклів дають 0,10, а 40 жорстких — 40/200 = 0,20, разом 0,30: об’єднання приписало жорстким циклам N м’яких і приховало понад половину використання.","Die zusammengelegte Zeile ergibt 140/1000 = 0,14. Getrennt ergeben die 100 milden Zyklen 0,10 und die 40 scharfen 40/200 = 0,20, zusammen 0,30: Die Zusammenlegung gab den scharfen Zyklen das N der milden und verbarg mehr als die Hälfte der Ausnutzung.","De samengevoegde rij geeft 140/1000 = 0,14. Apart geven de 100 milde cycli 0,10 en de 40 zware 40/200 = 0,20, samen 0,30: de samenvoeging gaf de zware cycli de N van de milde en verborg meer dan de helft van het gebruik.","La ligne fusionnée donne 140/1000 = 0,14. Séparés, les 100 cycles modérés donnent 0,10 et les 40 cycles sévères 40/200 = 0,20, soit 0,30 : la fusion a attribué aux cycles sévères le N des cycles modérés et masqué plus de la moitié de l’usage.","La fila fusionada da 140/1000 = 0,14. Por separado, los 100 ciclos suaves dan 0,10 y los 40 severos 40/200 = 0,20, en total 0,30: la fusión asignó a los ciclos severos el N de los suaves y ocultó más de la mitad del uso.","Połączony wiersz daje 140/1000 = 0,14. Osobno 100 łagodnych cykli daje 0,10, a 40 ostrych 40/200 = 0,20, razem 0,30: połączenie przypisało ostrym cyklom N łagodnych i ukryło ponad połowę wykorzystania."],"A temperature is required for NUREG F_en in “{n}”.":["A temperature is required for NUREG F_en in “{n}”.","Для NUREG F_en у «{n}» потрібна температура.","Für NUREG F_en in „{n}“ ist eine Temperatur erforderlich.","Voor NUREG F_en in “{n}” is een temperatuur vereist.","Une température est requise pour F_en NUREG dans « {n} ».","Se requiere una temperatura para F_en NUREG en «{n}».","Dla F_en NUREG w „{n}” wymagana jest temperatura."],"“{n}” is above 325 °C, the bound of NUREG/CR-6909 Rev.1 Appendix A: record the justification for the exceedance or correct the temperature.":["“{n}” is above 325 °C, the bound of NUREG/CR-6909 Rev.1 Appendix A: record the justification for the exceedance or correct the temperature.","«{n}» вище 325 °C — межі NUREG/CR-6909 Rev.1 Appendix A: запишіть обґрунтування перевищення або виправте температуру.","„{n}“ liegt über 325 °C, der Grenze von NUREG/CR-6909 Rev.1 Appendix A: Begründung der Überschreitung erfassen oder Temperatur korrigieren.","“{n}” ligt boven 325 °C, de grens van NUREG/CR-6909 Rev.1 Appendix A: leg de onderbouwing van de overschrijding vast of corrigeer de temperatuur.","« {n} » dépasse 325 °C, la limite de NUREG/CR-6909 Rev.1 Appendix A : consignez la justification du dépassement ou corrigez la température.","«{n}» supera 325 °C, el límite de NUREG/CR-6909 Rev.1 Appendix A: registre la justificación del exceso o corrija la temperatura.","„{n}” przekracza 325 °C, granicę NUREG/CR-6909 Rev.1 Appendix A: zapisz uzasadnienie przekroczenia lub popraw temperaturę."],"“{n}” is above 325 °C: Appendix A F_en is evaluated beyond its bound on the recorded justification.":["“{n}” is above 325 °C: Appendix A F_en is evaluated beyond its bound on the recorded justification.","«{n}» вище 325 °C: F_en за Appendix A обчислено поза його межею на підставі записаного обґрунтування.","„{n}“ liegt über 325 °C: F_en nach Appendix A wird auf Grundlage der erfassten Begründung außerhalb seiner Grenze ausgewertet.","“{n}” ligt boven 325 °C: F_en volgens Appendix A wordt op basis van de vastgelegde onderbouwing buiten zijn grens berekend.","« {n} » dépasse 325 °C : le F_en de l’Appendix A est évalué au-delà de sa limite sur la base de la justification consignée.","«{n}» supera 325 °C: el F_en del Appendix A se evalúa fuera de su límite con la justificación registrada.","„{n}” przekracza 325 °C: F_en wg Appendix A obliczono poza jego granicą na podstawie zapisanego uzasadnienia."],"Justification above 325 °C":["Justification above 325 °C","Обґрунтування вище 325 °C","Begründung über 325 °C","Onderbouwing boven 325 °C","Justification au-dessus de 325 °C","Justificación por encima de 325 °C","Uzasadnienie powyżej 325 °C"],"One row per population with its own N from the design curve — load “Base load — Miner control” to see the separated rows. Then try “NUREG extrapolation at 330 °C”: Appendix A bounds F_en at 325 °C, so the result stays blocked until the temperature is corrected or the group records a justification for the exceedance.":["One row per population with its own N from the design curve — load “Base load — Miner control” to see the separated rows. Then try “NUREG extrapolation at 330 °C”: Appendix A bounds F_en at 325 °C, so the result stays blocked until the temperature is corrected or the group records a justification for the exceedance.","Один рядок на популяцію з власним N із розрахункової кривої — завантажте «Базове навантаження — контроль Майнера», щоб побачити розділені рядки. Потім спробуйте «Екстраполяція NUREG при 330 °C»: Appendix A обмежує F_en температурою 325 °C, тож результат залишається заблокованим, доки температуру не виправлено або для групи не записано обґрунтування перевищення.","Eine Zeile je Population mit eigenem N aus der Auslegungskurve — laden Sie „Grundlast — Miner-Kontrolle“, um die getrennten Zeilen zu sehen. Versuchen Sie dann „NUREG-Extrapolation bei 330 °C“: Appendix A begrenzt F_en bei 325 °C, daher bleibt das Ergebnis gesperrt, bis die Temperatur korrigiert ist oder die Gruppe eine Begründung der Überschreitung enthält.","Eén rij per populatie met een eigen N uit de ontwerpkromme — laad “Basislast — Miner-controle” om de gescheiden rijen te zien. Probeer daarna “NUREG-extrapolatie bij 330 °C”: Appendix A begrenst F_en bij 325 °C, dus het resultaat blijft geblokkeerd tot de temperatuur is gecorrigeerd of de groep een onderbouwing van de overschrijding bevat.","Une ligne par population avec son propre N issu de la courbe de conception — chargez « Charge de base — contrôle Miner » pour voir les lignes séparées. Essayez ensuite « Extrapolation NUREG à 330 °C » : l’Appendix A borne F_en à 325 °C, le résultat reste donc bloqué jusqu’à ce que la température soit corrigée ou que le groupe consigne une justification du dépassement.","Una fila por población con su propio N de la curva de diseño: cargue «Carga base — control Miner» para ver las filas separadas. Después pruebe «Extrapolación NUREG a 330 °C»: el Appendix A limita F_en a 325 °C, por lo que el resultado sigue bloqueado hasta que se corrija la temperatura o el grupo registre una justificación del exceso.","Jeden wiersz na populację z własnym N z krzywej projektowej — wczytaj „Obciążenie bazowe — kontrola Minera”, aby zobaczyć rozdzielone wiersze. Następnie wypróbuj „Ekstrapolacja NUREG przy 330 °C”: Appendix A ogranicza F_en do 325 °C, więc wynik pozostaje zablokowany, dopóki temperatura nie zostanie poprawiona albo grupa nie otrzyma uzasadnienia przekroczenia."],"The NUREG profile uses Appendix A piecewise correlations. Inconel 718, missing chemistry or a missing positive strain rate blocks the numerical result. A temperature above 325 °C blocks it until the group records a justification; the computed row then carries a warning. Try the 330 °C problem preset, then correct the temperature or record the justification.":["The NUREG profile uses Appendix A piecewise correlations. Inconel 718, missing chemistry or a missing positive strain rate blocks the numerical result. A temperature above 325 °C blocks it until the group records a justification; the computed row then carries a warning. Try the 330 °C problem preset, then correct the temperature or record the justification.","Профіль NUREG використовує кусково-задані кореляції Appendix A. Inconel 718, відсутній хімічний склад або відсутня додатна швидкість деформації блокують числовий результат. Температура вище 325 °C блокує його, доки для групи не записано обґрунтування; тоді обчислений рядок має попередження. Спробуйте приклад 330 °C, потім виправте температуру або запишіть обґрунтування.","Das NUREG-Profil verwendet die stückweisen Korrelationen von Appendix A. Inconel 718, fehlende Chemie oder eine fehlende positive Dehnrate sperren das numerische Ergebnis. Eine Temperatur über 325 °C sperrt es, bis die Gruppe eine Begründung enthält; die berechnete Zeile trägt dann eine Warnung. Probieren Sie das 330-°C-Problembeispiel und korrigieren Sie dann die Temperatur oder erfassen Sie die Begründung.","Het NUREG-profiel gebruikt de stuksgewijze correlaties van Appendix A. Inconel 718, ontbrekende chemie of een ontbrekende positieve reksnelheid blokkeert het numerieke resultaat. Een temperatuur boven 325 °C blokkeert het tot de groep een onderbouwing bevat; de berekende rij krijgt dan een waarschuwing. Probeer het probleemvoorbeeld van 330 °C en corrigeer daarna de temperatuur of leg de onderbouwing vast.","Le profil NUREG utilise les corrélations par morceaux de l’Appendix A. Inconel 718, une chimie manquante ou une vitesse de déformation positive manquante bloque le résultat numérique. Une température au-dessus de 325 °C le bloque jusqu’à ce que le groupe consigne une justification ; la ligne calculée porte alors un avertissement. Essayez l’exemple problème à 330 °C, puis corrigez la température ou consignez la justification.","El perfil NUREG usa las correlaciones por tramos del Appendix A. Inconel 718, la falta de química o la falta de una velocidad de deformación positiva bloquean el resultado numérico. Una temperatura por encima de 325 °C lo bloquea hasta que el grupo registre una justificación; la fila calculada lleva entonces una advertencia. Pruebe el ejemplo problema de 330 °C y luego corrija la temperatura o registre la justificación.","Profil NUREG korzysta z przedziałowych korelacji Appendix A. Inconel 718, brak składu chemicznego lub brak dodatniej prędkości odkształcenia blokuje wynik liczbowy. Temperatura powyżej 325 °C blokuje go, dopóki grupa nie otrzyma uzasadnienia; obliczony wiersz ma wtedy ostrzeżenie. Wypróbuj przykład problemowy 330 °C, a następnie popraw temperaturę lub zapisz uzasadnienie."]};            /* English text -> [en, uk, de, nl, fr, es, pl] */
