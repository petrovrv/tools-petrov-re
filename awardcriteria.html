    noteLaw: T('Above the EU thresholds the documents must state the relative weighting of each criterion (a range is allowed; if weighting is objectively impossible, a descending order of importance); below them, the weighting or the order of importance, otherwise the criteria count equally (Wet 17.06.2016 art. 81 §4; Dir. 2014/24/EU art. 67(5)). The scoring method itself must not alter the criteria or their weights (CJEU C-6/15 TNS Dimarso, 14.07.2016).', 'Від порогів ЄС документація має визначати відносну вагу кожного критерію (допускається діапазон; якщо зважування об’єктивно неможливе — порядок спадання важливості); нижче порогів — вагу або порядок важливості, інакше критерії рівноцінні (бельгійський Закон 17.06.2016 ст. 81 §4; Дир. 2014/24/ЄС ст. 67(5)). Сам метод оцінки не може змінювати критерії чи їхню вагу (Суд ЄС C-6/15 TNS Dimarso, 14.07.2016).', 'Ab den EU-Schwellenwerten müssen die Unterlagen die Gewichtung jedes Kriteriums angeben (eine Marge ist zulässig; ist Gewichtung aus objektiven Gründen nicht möglich, die absteigende Rangfolge der Bedeutung); darunter Gewichtung oder Rangfolge, sonst sind die Kriterien gleichwertig (belgisches Gesetz 17.06.2016 Art. 81 § 4; RL 2014/24/EU Art. 67 Abs. 5). Die Bewertungsmethode selbst darf Kriterien und Gewichtung nicht verändern (EuGH C-6/15 TNS Dimarso, 14.07.2016).', 'Vanaf de Europese drempels moeten de opdrachtdocumenten het relatieve gewicht van elk criterium vermelden (een vork mag; is weging om objectieve redenen niet mogelijk, dan de dalende volgorde van belangrijkheid); daaronder het gewicht of de dalende volgorde van belangrijkheid, zo niet hebben de gunningscriteria dezelfde waarde (wet 17 juni 2016 art. 81, § 4; Richtlijn 2014/24/EU art. 67, lid 5). De beoordelingsmethode zelf mag de criteria en hun weging niet wijzigen (HvJ C-6/15 TNS Dimarso, 14.07.2016).', 'À partir des seuils européens, les documents du marché doivent indiquer la pondération relative de chaque critère (une fourchette est admise ; si la pondération est impossible pour des raisons objectives, l’ordre décroissant d’importance) ; en dessous, la pondération ou l’ordre décroissant d’importance, à défaut les critères ont la même valeur (loi du 17 juin 2016 art. 81, § 4 ; directive 2014/24/UE art. 67, § 5). La méthode de notation elle-même ne peut modifier les critères ni leur pondération (CJUE C-6/15 TNS Dimarso, 14.07.2016).', 'A partir de los umbrales de la UE, los pliegos deben indicar la ponderación relativa de cada criterio (se admite una banda; si no es posible por razones objetivas, el orden decreciente de importancia); por debajo, la ponderación o el orden de importancia; si no, los criterios valen lo mismo (ley belga 17.06.2016 art. 81 §4; Directiva 2014/24/UE art. 67.5). El método de puntuación no puede alterar los criterios ni su ponderación (TJUE C-6/15 TNS Dimarso, 14.07.2016).', 'Od progów UE dokumenty muszą podawać wagę każdego kryterium (dopuszczalny jest przedział; gdy ważenie jest obiektywnie niemożliwe — malejącą kolejność ważności); poniżej progów wagę albo kolejność ważności, w przeciwnym razie kryteria mają równą wartość (belgijska ustawa z 17.06.2016 art. 81 § 4; dyrektywa 2014/24/UE art. 67 ust. 5). Sama metoda punktacji nie może zmieniać kryteriów ani wag (TSUE C-6/15 TNS Dimarso, 14.07.2016).'),
    noteHeur: T('The recommendation is a stated heuristic (penalties: reversal seen 40, depends on other bids 15, zero points within 1.5 × lowest 15, mean-based 10, bids outside anchors 20, reference price outside 0.5–2 × the median bid 30), not a rule of law.', 'Рекомендація — відкрита евристика (штрафи: інверсія 40, залежність від інших пропозицій 15, нуль балів у межах 1,5 × найнижча 15, середня ціна 10, пропозиції поза опорними цінами 20, опорна ціна поза 0,5–2 × медіана пропозицій 30), а не норма права.', 'Die Empfehlung ist eine offengelegte Heuristik (Malus: Rangumkehr 40, abhängig von anderen Angeboten 15, null Punkte innerhalb 1,5 × niedrigster 15, mittelwertbasiert 10, Angebote außerhalb der Anker 20, Referenzpreis außerhalb 0,5–2 × Median der Angebote 30), keine Rechtsregel.', 'De aanbeveling is een expliciete heuristiek (strafpunten: omkering 40, afhankelijk van andere offertes 15, nul punten binnen 1,5 × laagste 15, gemiddelde als basis 10, offertes buiten de ankers 20, referentieprijs buiten 0,5–2 × de mediaan van de offertes 30), geen rechtsregel.', 'La recommandation est une heuristique explicite (pénalités : inversion 40, dépend des autres offres 15, zéro point à moins de 1,5 × le plus bas 15, basée sur la moyenne 10, offres hors ancrages 20, prix de référence hors 0,5–2 × la médiane des offres 30), pas une règle de droit.', 'La recomendación es una heurística explícita (penalizaciones: inversión 40, depende de otras ofertas 15, cero puntos dentro de 1,5 × la más baja 15, basada en la media 10, ofertas fuera de anclajes 20, precio de referencia fuera de 0,5–2 × la mediana de las ofertas 30), no una norma jurídica.', 'Rekomendacja to jawna heurystyka (kary: odwrócenie 40, zależność od innych ofert 15, zero punktów w granicach 1,5 × najniższa 15, oparcie na średniej 10, oferty poza cenami odniesienia 20, cena odniesienia poza 0,5–2 × mediana ofert 30), a nie przepis prawa.'),

      aha: T('Even a monetised method reverses ranks when quality is scored relative to the best bid: untick Y and Z overtakes X; switch quality to absolute and the reversal disappears', 'Навіть монетизований метод змінює ранжування, якщо якість оцінюють відносно найкращої: зніміть Y — і Z випереджає X; перемкніть якість на абсолютну — інверсія зникає', 'Selbst eine monetarisierte Methode kehrt Ränge um, wenn die Qualität relativ zum besten Angebot bewertet wird: Y abwählen, und Z überholt X; Qualität auf absolut stellen, und die Umkehr verschwindet', 'Zelfs een gemonetariseerde methode keert rangen om als de kwaliteit ten opzichte van de beste offerte wordt gescoord: vink Y uit en Z haalt X in; zet de kwaliteit op absoluut en de omkering verdwijnt', 'Même une méthode monétisée inverse le classement si la qualité est notée par rapport à la meilleure offre : décochez Y et Z passe devant X ; passez la qualité en absolu et l’inversion disparaît', 'Incluso un método monetizado invierte la clasificación si la calidad se puntúa respecto a la mejor oferta: desmarque Y y Z adelanta a X; pase la calidad a absoluta y la inversión desaparece', 'Nawet metoda pieniężna odwraca ranking, gdy jakość ocenia się względem najlepszej oferty: odznacz Y, a Z wyprzedza X; przełącz jakość na bezwzględną, a odwrócenie znika') }
  };
  var GROUP = {
    be: T('Belgian public tenders', 'Бельгійські публічні закупівлі', 'Belgische öffentliche Vergaben', 'Belgische overheidsopdrachten', 'Marchés publics belges', 'Licitaciones públicas belgas', 'Belgijskie zamówienia publiczne'),
    epc: T('Utilities and private EPC', 'Комунальні підприємства та приватні EPC', 'Versorger und private EPC', 'Nutsbedrijven en private EPC', 'Secteurs spéciaux et EPC privés', 'Sectores especiales y EPC privados', 'Sektor użyteczności publicznej i prywatne EPC'),
    eq: T('Equipment packages', 'Пакети обладнання', 'Ausrüstungspakete', 'Uitrustingspakketten', 'Lots d’équipements', 'Paquetes de equipos', 'Pakiety urządzeń')
  };
  function applyPreset(t, p) {
    var keep = { tenderRef: t.tenderRef, evaluator: t.evaluator }, l = lang();
    Object.keys(DEFAULTS).forEach(function (k) { t[k] = JSON.parse(JSON.stringify(DEFAULTS[k])); });
    t.tenderRef = keep.tenderRef; t.evaluator = keep.evaluator;
    t.W = p.W; t.method = p.method; t.qnorm = p.qnorm;
    t.refPrice = p.ref.price; t.lo = p.ref.lo; t.hi = p.ref.hi; t.Vauto = true;
    t.items.length = 0;
    p.items.forEach(function (it) { t.items.push({ name: str(QN[it.key], l) || it.key, weight: it.weight, max: it.max }); });
    t.bids.length = 0;
    p.bids.forEach(function (b) {
      var row = { name: b.id, price: b.price, q1: 0, q2: 0, q3: 0, included: true };
      p.items.forEach(function (it, k) { row['q' + (k + 1)] = b.q[it.id]; });
      t.bids.push(row);
    });
    t.testOn = false;
  }
  function buildExamples() {
    var A = lib();
    if (!A) return [];
    return A.PRESETS.map(function (p) {
      var x = EXT[p.id];
      return { id: p.id, group: GROUP[x.group], label: x.label, note: x.aha, apply: function (t) { applyPreset(t, p); } };
    });
  }

  /* ---- learn ---- */
  function buildLearn() {
    return {
      version: 1,
      intro: {
        title: T('Award criteria in one page', 'Критерії оцінки на одній сторінці', 'Zuschlagskriterien auf einer Seite', 'Gunningscriteria op één pagina', 'Les critères d’attribution en une page', 'Los criterios de adjudicación en una página', 'Kryteria oceny ofert na jednej stronie'),
        body: T('Life-cycle stage 4 (tender documents) and 8 (evaluation). Enter the weights, the quality scores and the prices; the tool scores the same bids with eight price formulas, tests each for rank reversal, prices one point in euro and shows the winner for every price weight. Start from an example in the list.',
                'Етап життєвого циклу 4 (тендерна документація) і 8 (оцінювання). Введіть ваги, бали якості та ціни; інструмент оцінює ті самі пропозиції за вісьмома формулами ціни, перевіряє кожну на інверсію рангів, оцінює один бал у євро й показує переможця для будь-якої ваги ціни. Почніть із прикладу зі списку.',
                'Lebenszyklus-Phase 4 (Vergabeunterlagen) und 8 (Wertung). Gewichte, Qualitätspunkte und Preise eingeben; das Werkzeug bewertet dieselben Angebote mit acht Preisformeln, prüft jede auf Rangumkehr, beziffert einen Punkt in Euro und zeigt den Sieger für jedes Preisgewicht. Beginnen Sie mit einem Beispiel aus der Liste.',
                'Fase 4 (opdrachtdocumenten) en 8 (beoordeling) van de levenscyclus. Voer de wegingen, de kwaliteitsscores en de prijzen in; de tool beoordeelt dezelfde offertes met acht prijsformules, toetst elke formule op rangomkering, drukt één punt uit in euro en toont de winnaar voor elke prijsweging. Begin met een voorbeeld uit de lijst.',
                'Étapes 4 (documents du marché) et 8 (évaluation) du cycle de vie. Saisissez les pondérations, les notes de qualité et les prix ; l’outil note les mêmes offres avec huit formules de prix, teste chacune pour l’inversion de classement, chiffre un point en euros et montre l’adjudicataire pour chaque pondération du prix. Commencez par un exemple de la liste.',
                'Etapas 4 (pliegos) y 8 (valoración) del ciclo de vida. Introduzca las ponderaciones, las puntuaciones de calidad y los precios; la herramienta puntúa las mismas ofertas con ocho fórmulas de precio, comprueba en cada una la inversión del orden, valora un punto en euros y muestra el adjudicatario para cada ponderación del precio. Empiece con un ejemplo de la lista.',
                'Etap 4 (dokumenty zamówienia) i 8 (ocena) cyklu życia. Wprowadź wagi, punkty jakości i ceny; narzędzie ocenia te same oferty ośmioma wzorami ceny, sprawdza każdy pod kątem odwrócenia rankingu, wycenia punkt w euro i pokazuje zwycięzcę dla każdej wagi ceny. Zacznij od przykładu z listy.')
      },
      topics: {
        meat: { title: T('Best price-quality ratio and the law', 'Найкраще співвідношення ціни та якості і право', 'Bestes Preis-Leistungs-Verhältnis und Recht', 'Beste prijs-kwaliteitverhouding en het recht', 'Meilleur rapport qualité-prix et droit', 'Mejor relación calidad-precio y derecho', 'Najlepsza relacja jakości do ceny a prawo'),
          body: T('The contract goes to the most economically advantageous tender (Dir. 2014/24/EU art. 67; in Belgium Wet 17.06.2016 art. 81): price or cost only, or the best price-quality ratio. Above the EU thresholds the documents must state the relative weighting of each criterion (a range is allowed; if weighting is objectively impossible, a descending order of importance); below them, the weighting or the order of importance, otherwise the criteria count equally (Wet 17.06.2016 art. 81 §4; Dir. 2014/24/EU art. 67(5)). The scoring formula is a method, not a criterion: the Court of Justice (C-6/15 TNS Dimarso) accepts that it need not be published in advance, provided it does not change the criteria or their weights. Publishing it is still good practice: bidders price to it.',
                  'Контракт отримує найбільш економічно вигідна пропозиція (Дир. 2014/24/ЄС ст. 67; у Бельгії Закон 17.06.2016 ст. 81): лише ціна чи вартість або найкраще співвідношення ціни та якості. Від порогів ЄС документація має визначати відносну вагу кожного критерію (допускається діапазон; якщо зважування об’єктивно неможливе — порядок спадання важливості); нижче порогів — вагу або порядок важливості, інакше критерії рівноцінні (бельгійський Закон 17.06.2016 ст. 81 §4; Дир. 2014/24/ЄС ст. 67(5)). Формула оцінки — метод, а не критерій: Суд ЄС (C-6/15 TNS Dimarso) допускає, що її можна не публікувати заздалегідь, якщо вона не змінює критеріїв чи ваг. Публікувати її все одно варто: учасники цінують під неї.',
                  'Den Zuschlag erhält das wirtschaftlich günstigste Angebot (RL 2014/24/EU Art. 67; in Belgien Gesetz vom 17.06.2016 Art. 81): nur Preis oder Kosten oder das beste Preis-Leistungs-Verhältnis. Ab den EU-Schwellenwerten müssen die Unterlagen die Gewichtung jedes Kriteriums angeben (eine Marge ist zulässig; ist Gewichtung aus objektiven Gründen nicht möglich, die absteigende Rangfolge der Bedeutung); darunter Gewichtung oder Rangfolge, sonst sind die Kriterien gleichwertig (belgisches Gesetz 17.06.2016 Art. 81 § 4; RL 2014/24/EU Art. 67 Abs. 5). Die Bewertungsformel ist eine Methode, kein Kriterium: Der EuGH (C-6/15 TNS Dimarso) akzeptiert, dass sie nicht vorab veröffentlicht wird, sofern sie Kriterien und Gewichte nicht verändert. Sie zu veröffentlichen ist dennoch gute Praxis: Bieter kalkulieren danach.',
                  'De opdracht gaat naar de economisch meest voordelige offerte (Richtlijn 2014/24/EU art. 67; in België de wet van 17 juni 2016 art. 81): enkel prijs of kosten, of de beste prijs-kwaliteitverhouding. Vanaf de Europese drempels moeten de opdrachtdocumenten het relatieve gewicht van elk criterium vermelden (een vork mag; is weging om objectieve redenen niet mogelijk, dan de dalende volgorde van belangrijkheid); daaronder het gewicht of de dalende volgorde van belangrijkheid, zo niet hebben de gunningscriteria dezelfde waarde (wet 17 juni 2016 art. 81, § 4; Richtlijn 2014/24/EU art. 67, lid 5). De beoordelingsformule is een methode, geen criterium: het Hof van Justitie (C-6/15 TNS Dimarso) aanvaardt dat ze niet vooraf bekend wordt gemaakt, als ze de criteria en hun weging niet wijzigt. Ze vermelden blijft goede praktijk: inschrijvers prijzen erop.',
                  'Le marché est attribué à l’offre économiquement la plus avantageuse (directive 2014/24/UE art. 67 ; en Belgique loi du 17 juin 2016 art. 81) : prix ou coût seul, ou meilleur rapport qualité-prix. À partir des seuils européens, les documents du marché doivent indiquer la pondération relative de chaque critère (une fourchette est admise ; si la pondération est impossible pour des raisons objectives, l’ordre décroissant d’importance) ; en dessous, la pondération ou l’ordre décroissant d’importance, à défaut les critères ont la même valeur (loi du 17 juin 2016 art. 81, § 4 ; directive 2014/24/UE art. 67, § 5). La formule de notation est une méthode, pas un critère : la Cour de justice (C-6/15 TNS Dimarso) admet qu’elle ne soit pas publiée à l’avance si elle ne modifie ni les critères ni leur pondération. La publier reste une bonne pratique : les soumissionnaires calculent en fonction d’elle.',
                  'El contrato se adjudica a la oferta económicamente más ventajosa (Directiva 2014/24/UE art. 67; en Bélgica ley de 17.06.2016 art. 81): solo precio o coste, o la mejor relación calidad-precio. A partir de los umbrales de la UE, los pliegos deben indicar la ponderación relativa de cada criterio (se admite una banda; si no es posible por razones objetivas, el orden decreciente de importancia); por debajo, la ponderación o el orden de importancia; si no, los criterios valen lo mismo (ley belga 17.06.2016 art. 81 §4; Directiva 2014/24/UE art. 67.5). La fórmula de puntuación es un método, no un criterio: el Tribunal de Justicia (C-6/15 TNS Dimarso) admite que no se publique de antemano si no altera los criterios ni su ponderación. Publicarla sigue siendo buena práctica: los licitadores calculan con ella.',
                  'Zamówienie otrzymuje oferta najkorzystniejsza ekonomicznie (dyrektywa 2014/24/UE art. 67; w Belgii ustawa z 17.06.2016 art. 81): sama cena lub koszt albo najlepsza relacja jakości do ceny. Od progów UE dokumenty muszą podawać wagę każdego kryterium (dopuszczalny jest przedział; gdy ważenie jest obiektywnie niemożliwe — malejącą kolejność ważności); poniżej progów wagę albo kolejność ważności, w przeciwnym razie kryteria mają równą wartość (belgijska ustawa z 17.06.2016 art. 81 § 4; dyrektywa 2014/24/UE art. 67 ust. 5). Wzór punktacji to metoda, nie kryterium: TSUE (C-6/15 TNS Dimarso) dopuszcza, by nie publikować go z góry, jeśli nie zmienia kryteriów ani wag. Publikacja to wciąż dobra praktyka: wykonawcy kalkulują pod wzór.') },
        formulas: { title: T('Eight price formulas', 'Вісім формул ціни', 'Acht Preisformeln', 'Acht prijsformules', 'Huit formules de prix', 'Ocho fórmulas de precio', 'Osiem wzorów ceny'),
          body: T('Score s from 0 to 1, price points = weight × s. Proportional s = Pmin/P; linear s = (k·Pmin − P)/((k − 1)·Pmin); linear % s = 1 − a·(P − Pmin)/Pmin; interpolation s = (Pmax − P)/(Pmax − Pmin); to mean s = 0.5 + a·(M − P)/M; floor s = max(Pmin, F)/max(P, F) with F = f·M; absolute s = (P_hi − P)/(P_hi − P_lo) between anchors from the reference price; monetised: evaluated price E = P − V·Q, lowest E wins. The first six read the other bids, the last two do not.',
                  'Бал s від 0 до 1, бали ціни = вага × s. Пропорційний s = Pmin/P; лінійний s = (k·Pmin − P)/((k − 1)·Pmin); лінійний % s = 1 − a·(P − Pmin)/Pmin; інтерполяція s = (Pmax − P)/(Pmax − Pmin); до середньої s = 0,5 + a·(M − P)/M; поріг s = max(Pmin, F)/max(P, F), F = f·M; абсолютний s = (P_hi − P)/(P_hi − P_lo) між опорними цінами від кошторису; монетизований: оцінна ціна E = P − V·Q, перемагає найнижча E. Перші шість залежать від інших пропозицій, останні два — ні.',
                  'Punktzahl s von 0 bis 1, Preispunkte = Gewicht × s. Proportional s = Pmin/P; linear s = (k·Pmin − P)/((k − 1)·Pmin); linear % s = 1 − a·(P − Pmin)/Pmin; Interpolation s = (Pmax − P)/(Pmax − Pmin); zum Mittel s = 0,5 + a·(M − P)/M; Untergrenze s = max(Pmin, F)/max(P, F) mit F = f·M; absolut s = (P_hi − P)/(P_hi − P_lo) zwischen Ankern aus dem Referenzpreis; monetarisiert: Wertungspreis E = P − V·Q, das niedrigste E gewinnt. Die ersten sechs lesen die anderen Angebote, die letzten zwei nicht.',
                  'Score s van 0 tot 1, prijspunten = weging × s. Proportioneel s = Pmin/P; lineair s = (k·Pmin − P)/((k − 1)·Pmin); lineair % s = 1 − a·(P − Pmin)/Pmin; interpolatie s = (Pmax − P)/(Pmax − Pmin); t.o.v. gemiddelde s = 0,5 + a·(M − P)/M; bodem s = max(Pmin, F)/max(P, F) met F = f·M; absoluut s = (P_hi − P)/(P_hi − P_lo) tussen ankers uit de referentieprijs; gemonetariseerd: beoordelingsprijs E = P − V·Q, de laagste E wint. De eerste zes lezen de andere offertes, de laatste twee niet.',
                  'Note s de 0 à 1, points prix = pondération × s. Proportionnelle s = Pmin/P ; linéaire s = (k·Pmin − P)/((k − 1)·Pmin) ; linéaire % s = 1 − a·(P − Pmin)/Pmin ; interpolation s = (Pmax − P)/(Pmax − Pmin) ; à la moyenne s = 0,5 + a·(M − P)/M ; plancher s = max(Pmin, F)/max(P, F) avec F = f·M ; absolue s = (P_hi − P)/(P_hi − P_lo) entre ancrages issus du prix de référence ; monétisée : prix évalué E = P − V·Q, le plus bas E l’emporte. Les six premières lisent les autres offres, les deux dernières non.',
                  'Puntuación s de 0 a 1, puntos de precio = ponderación × s. Proporcional s = Pmin/P; lineal s = (k·Pmin − P)/((k − 1)·Pmin); lineal % s = 1 − a·(P − Pmin)/Pmin; interpolación s = (Pmax − P)/(Pmax − Pmin); a la media s = 0,5 + a·(M − P)/M; suelo s = max(Pmin, F)/max(P, F) con F = f·M; absoluta s = (P_hi − P)/(P_hi − P_lo) entre anclajes del precio de referencia; monetizada: precio evaluado E = P − V·Q, gana la E más baja. Las seis primeras leen las demás ofertas; las dos últimas no.',
                  'Punktacja s od 0 do 1, punkty ceny = waga × s. Proporcjonalna s = Pmin/P; liniowa s = (k·Pmin − P)/((k − 1)·Pmin); liniowa % s = 1 − a·(P − Pmin)/Pmin; interpolacja s = (Pmax − P)/(Pmax − Pmin); do średniej s = 0,5 + a·(M − P)/M; próg s = max(Pmin, F)/max(P, F), F = f·M; bezwzględna s = (P_hi − P)/(P_hi − P_lo) między cenami odniesienia z kosztorysu; pieniężna: cena oceniana E = P − V·Q, wygrywa najniższa E. Sześć pierwszych zależy od innych ofert, dwie ostatnie nie.') },
        reversal: { title: T('Rank reversal', 'Інверсія рангів', 'Rangumkehr', 'Rangomkering', 'Inversion de classement', 'Inversión del orden', 'Odwrócenie rankingu'),
          body: T('If the order of A and B changes when a third bid C is added or removed, the method violates the independence of irrelevant alternatives. It happens when a score depends on Pmin, Pmax or the mean: excluding an abnormally low bid, a late withdrawal, or a cover bid can then hand the contract to someone else. The test removes each bidder in turn (and adds the optional test bidder) and lists every pair that swaps. Absolute scoring and monetised quality with absolute quality scores cannot reverse.',
                  'Якщо порядок A і B змінюється, коли додають чи вилучають третю пропозицію C, метод порушує незалежність від сторонніх альтернатив. Так буває, коли бал залежить від Pmin, Pmax чи середньої: відхилення аномально низької пропозиції, пізнє відкликання чи «прикривальна» пропозиція можуть віддати контракт іншому. Тест вилучає кожного учасника по черзі (і додає тестового) та перелічує всі пари, що міняються. Абсолютний метод і монетизована якість з абсолютними балами інверсії не дають.',
                  'Ändert sich die Reihenfolge von A und B, wenn ein drittes Angebot C hinzukommt oder wegfällt, verletzt die Methode die Unabhängigkeit von irrelevanten Alternativen. Das geschieht, wenn Punkte von Pmin, Pmax oder dem Mittel abhängen: Der Ausschluss eines ungewöhnlich niedrigen Angebots, ein später Rückzug oder ein Scheinangebot kann den Auftrag dann einem anderen geben. Der Test entfernt jeden Bieter einzeln (und fügt den optionalen Testbieter hinzu) und listet jedes Paar, das tauscht. Absolute Bewertung und monetarisierte Qualität mit absoluten Qualitätspunkten können nicht umkehren.',
                  'Als de volgorde van A en B verandert wanneer een derde offerte C wordt toegevoegd of weggelaten, schendt de methode de onafhankelijkheid van irrelevante alternatieven. Dat gebeurt wanneer een score afhangt van Pmin, Pmax of het gemiddelde: het weren van een abnormaal lage offerte, een late terugtrekking of een schijnofferte kan de opdracht dan aan een ander geven. De toets laat elke inschrijver beurtelings weg (en voegt de optionele testinschrijver toe) en somt elk paar op dat wisselt. Absolute beoordeling en gemonetariseerde kwaliteit met absolute kwaliteitsscores kunnen niet omkeren.',
                  'Si l’ordre de A et B change quand une troisième offre C est ajoutée ou retirée, la méthode viole l’indépendance des alternatives non pertinentes. Cela arrive quand une note dépend de Pmin, Pmax ou de la moyenne : l’écartement d’une offre anormalement basse, un retrait tardif ou une offre de couverture peuvent alors attribuer le marché à un autre. Le test retire chaque soumissionnaire à tour de rôle (et ajoute le soumissionnaire test) et liste chaque paire inversée. La notation absolue et la qualité monétisée avec des notes de qualité absolues ne peuvent pas s’inverser.',
                  'Si el orden de A y B cambia al añadir o retirar una tercera oferta C, el método viola la independencia de alternativas irrelevantes. Ocurre cuando la puntuación depende de Pmin, Pmax o la media: excluir una oferta anormalmente baja, una retirada tardía o una oferta de cobertura pueden entonces dar el contrato a otro. La prueba retira cada licitador por turno (y añade el licitador de prueba opcional) y lista cada par que se invierte. La puntuación absoluta y la calidad monetizada con puntuaciones de calidad absolutas no pueden invertirse.',
                  'Jeśli kolejność A i B zmienia się po dodaniu lub usunięciu trzeciej oferty C, metoda narusza niezależność od nieistotnych alternatyw. Dzieje się tak, gdy punkty zależą od Pmin, Pmax lub średniej: odrzucenie oferty rażąco niskiej, późne wycofanie lub oferta pozorna mogą wtedy oddać zamówienie komuś innemu. Test usuwa kolejno każdego wykonawcę (i dodaje opcjonalnego testowego) oraz wypisuje każdą parę, która się zamienia. Punktacja bezwzględna i jakość w pieniądzu z bezwzględnymi ocenami jakości nie mogą się odwrócić.') },
        eurpoint: { title: T('What a point costs', 'Скільки коштує бал', 'Was ein Punkt kostet', 'Wat een punt kost', 'Ce que coûte un point', 'Lo que cuesta un punto', 'Ile kosztuje punkt'),
          body: T('The euro value of one point is the price rise that costs the winner exactly one point of lead over the runner-up, all bids re-scored. It shows how the formula trades money against quality: if a point is cheap, the quality scores decide and a bidder can buy the contract with a small discount; if it is expensive, price decides. Under monetised quality it is fixed in advance: V ÷ quality weight.',
                  'Вартість одного бала в євро — це підвищення ціни, яке коштує переможцю рівно один бал відриву від другого місця, з переоцінкою всіх пропозицій. Вона показує, як формула обмінює гроші на якість: якщо бал дешевий, вирішують бали якості й учасник може «купити» контракт невеликою знижкою; якщо дорогий — вирішує ціна. За монетизованої якості вона фіксована наперед: V ÷ вага якості.',
                  'Der Eurowert eines Punktes ist die Preiserhöhung, die den Sieger genau einen Punkt Vorsprung vor dem Zweiten kostet, bei Neubewertung aller Angebote. Er zeigt, wie die Formel Geld gegen Qualität tauscht: Ist ein Punkt billig, entscheiden die Qualitätspunkte, und ein Bieter kann den Auftrag mit kleinem Nachlass kaufen; ist er teuer, entscheidet der Preis. Bei monetarisierter Qualität steht er vorab fest: V ÷ Qualitätsgewicht.',
                  'De waarde van één punt in euro is de prijsstijging die de winnaar precies één punt voorsprong op de tweede kost, met herberekening van alle offertes. Ze toont hoe de formule geld tegen kwaliteit ruilt: is een punt goedkoop, dan beslissen de kwaliteitsscores en kan een inschrijver de opdracht kopen met een kleine korting; is het duur, dan beslist de prijs. Bij gemonetariseerde kwaliteit ligt ze vooraf vast: V ÷ kwaliteitsweging.',
                  'La valeur d’un point en euros est la hausse de prix qui coûte exactement un point d’avance à l’adjudicataire sur le deuxième, toutes les offres étant renotées. Elle montre comment la formule échange l’argent contre la qualité : si le point est bon marché, les notes de qualité décident et un soumissionnaire peut acheter le marché avec un petit rabais ; s’il est cher, le prix décide. En qualité monétisée elle est fixée d’avance : V ÷ pondération qualité.',
                  'El valor en euros de un punto es la subida de precio que cuesta al adjudicatario exactamente un punto de ventaja sobre el segundo, repuntuando todas las ofertas. Muestra cómo la fórmula cambia dinero por calidad: si el punto es barato, deciden las puntuaciones de calidad y un licitador puede comprar el contrato con un pequeño descuento; si es caro, decide el precio. Con calidad monetizada se fija de antemano: V ÷ ponderación de calidad.',
                  'Wartość punktu w euro to wzrost ceny, który kosztuje zwycięzcę dokładnie jeden punkt przewagi nad drugim, przy ponownej ocenie wszystkich ofert. Pokazuje, jak wzór wymienia pieniądze na jakość: gdy punkt jest tani, decydują oceny jakości i wykonawca może „kupić” zamówienie niewielkim rabatem; gdy drogi — decyduje cena. Przy jakości w pieniądzu jest ustalona z góry: V ÷ waga jakości.') },
        sensitivity: { title: T('Weight sensitivity map', 'Карта чутливості до ваг', 'Gewichtssensitivität', 'Gevoeligheid voor de weging', 'Sensibilité aux pondérations', 'Sensibilidad a las ponderaciones', 'Wrażliwość na wagi'),
          body: T('The lower band of the drawing shows, for each method, which bidder wins when the price weight runs from 0 to 100 points (the quality criteria keep their mutual proportions). A switch close to the weight you intend to publish means the result rests on the weighting itself; discuss it before the documents go out, not after the bids are opened.',
                  'Нижня смуга рисунка показує для кожного методу, хто перемагає, коли вага ціни змінюється від 0 до 100 балів (критерії якості зберігають взаємні пропорції). Перемикання поблизу ваги, яку ви плануєте опублікувати, означає, що результат тримається на самій вазі; обговоріть це до виходу документації, а не після відкриття пропозицій.',
                  'Das untere Band der Zeichnung zeigt je Methode, welcher Bieter gewinnt, wenn das Preisgewicht von 0 bis 100 Punkte läuft (die Qualitätskriterien behalten ihr Verhältnis). Ein Wechsel nahe dem geplanten Gewicht bedeutet, dass das Ergebnis an der Gewichtung selbst hängt; besprechen Sie das vor dem Versand der Unterlagen, nicht nach der Angebotsöffnung.',
                  'De onderste band van de tekening toont per methode welke inschrijver wint als de prijsweging van 0 tot 100 punten loopt (de kwaliteitscriteria behouden hun onderlinge verhouding). Een wissel dicht bij de weging die u wilt publiceren betekent dat het resultaat op de weging zelf rust; bespreek dat vóór de publicatie van de opdrachtdocumenten, niet na de opening van de offertes.',
                  'La bande inférieure du dessin montre, pour chaque méthode, quel soumissionnaire l’emporte quand la pondération du prix va de 0 à 100 points (les critères de qualité gardent leurs proportions). Une bascule proche de la pondération que vous comptez publier signifie que le résultat repose sur la pondération elle-même ; discutez-en avant la publication des documents, pas après l’ouverture des offres.',
                  'La banda inferior del dibujo muestra, para cada método, qué licitador gana cuando la ponderación del precio va de 0 a 100 puntos (los criterios de calidad mantienen sus proporciones). Un cambio cerca de la ponderación que piensa publicar significa que el resultado depende de la propia ponderación; discútalo antes de publicar los pliegos, no tras abrir las ofertas.',
                  'Dolny pas rysunku pokazuje dla każdej metody, który wykonawca wygrywa, gdy waga ceny zmienia się od 0 do 100 punktów (kryteria jakości zachowują wzajemne proporcje). Zmiana blisko wagi, którą zamierzasz opublikować, oznacza, że wynik opiera się na samej wadze; omów to przed publikacją dokumentów, nie po otwarciu ofert.') },
        quality: { title: T('Absolute or relative quality scores', 'Абсолютні чи відносні бали якості', 'Absolute oder relative Qualitätspunkte', 'Absolute of relatieve kwaliteitsscores', 'Notes de qualité absolues ou relatives', 'Puntuaciones de calidad absolutas o relativas', 'Bezwzględne czy względne oceny jakości'),
          body: T('Absolute: the score on its scale (e.g. 7/10) gives 70 % of the criterion weight. Relative: the best bid on each criterion gets the full weight and the others pro rata. Relative quality scoring has the same weakness as a relative price formula: removing the best bid on one criterion re-scales everybody, so even a monetised method can then reverse ranks.',
                  'Абсолютні: бал на шкалі (напр. 7/10) дає 70 % ваги критерію. Відносні: найкраща пропозиція за кожним критерієм отримує повну вагу, інші — пропорційно. Відносна оцінка якості має ту саму ваду, що й відносна формула ціни: вилучення найкращої за одним критерієм перераховує всіх, тож навіть монетизований метод може змінити ранжування.',
                  'Absolut: die Note auf ihrer Skala (z. B. 7/10) ergibt 70 % des Kriteriengewichts. Relativ: das beste Angebot je Kriterium erhält das volle Gewicht, die anderen anteilig. Relative Qualitätsbewertung hat dieselbe Schwäche wie eine relative Preisformel: Fällt das beste Angebot eines Kriteriums weg, werden alle neu skaliert, und selbst eine monetarisierte Methode kann Ränge umkehren.',
                  'Absoluut: de score op zijn schaal (bv. 7/10) geeft 70 % van de weging van het criterium. Relatief: de beste offerte op elk criterium krijgt de volle weging, de andere naar verhouding. Relatieve kwaliteitsscores hebben dezelfde zwakte als een relatieve prijsformule: valt de beste offerte op één criterium weg, dan wordt iedereen herschaald en kan zelfs een gemonetariseerde methode rangen omkeren.',
                  'Absolue : la note sur son échelle (p. ex. 7/10) donne 70 % de la pondération du critère. Relative : la meilleure offre sur chaque critère reçoit toute la pondération, les autres au prorata. La notation relative de la qualité a la même faiblesse qu’une formule de prix relative : retirer la meilleure offre d’un critère renote tout le monde, et même une méthode monétisée peut alors inverser le classement.',
                  'Absoluta: la nota en su escala (p. ej. 7/10) da el 70 % de la ponderación del criterio. Relativa: la mejor oferta en cada criterio recibe toda la ponderación y las demás a prorrata. La puntuación relativa de la calidad tiene la misma debilidad que una fórmula de precio relativa: retirar la mejor oferta en un criterio reescala a todos, e incluso un método monetizado puede entonces invertir el orden.',
                  'Bezwzględna: ocena na skali (np. 7/10) daje 70 % wagi kryterium. Względna: najlepsza oferta w każdym kryterium dostaje pełną wagę, pozostałe proporcjonalnie. Względna ocena jakości ma tę samą słabość co względny wzór ceny: usunięcie najlepszej oferty w jednym kryterium przelicza wszystkich, więc nawet metoda pieniężna może odwrócić ranking.') },
        anchors: { title: T('Absolute anchors and monetised quality', 'Абсолютні опорні ціни та монетизована якість', 'Absolute Anker und monetarisierte Qualität', 'Absolute ankers en gemonetariseerde kwaliteit', 'Ancrages absolus et qualité monétisée', 'Anclajes absolutos y calidad monetizada', 'Bezwzględne ceny odniesienia i jakość w pieniądzu'),
          body: T('Both need a reference price fixed before the bids are opened (the owner’s estimate). Absolute: full points at lo × reference, zero at hi × reference, linear between; a bid outside the band is clipped, so choose the band wide enough. Monetised: each bid’s price is reduced by V × its quality share (V = value of full quality in euro); the lowest evaluated price wins. Practice in the Netherlands calls this “gunnen op waarde”, in Belgium it appears as fictitious price reductions.',
                  'Обидва методи потребують опорної ціни, зафіксованої до відкриття пропозицій (кошторис замовника). Абсолютний: повні бали при lo × опорна, нуль при hi × опорна, лінійно між ними; пропозиція поза діапазоном обрізається, тож оберіть його досить широким. Монетизований: ціну кожної пропозиції зменшують на V × частку якості (V — вартість повної якості в євро); перемагає найнижча оцінна ціна. У Нідерландах це «gunnen op waarde», у Бельгії — фіктивні знижки ціни.',
                  'Beide brauchen einen vor der Angebotsöffnung festgelegten Referenzpreis (Kostenschätzung). Absolut: volle Punkte bei lo × Referenz, null bei hi × Referenz, linear dazwischen; ein Angebot außerhalb wird abgeschnitten, das Band also breit genug wählen. Monetarisiert: Der Preis jedes Angebots wird um V × Qualitätsanteil vermindert (V = Wert voller Qualität in Euro); der niedrigste Wertungspreis gewinnt. In den Niederlanden heißt das „gunnen op waarde“, in Belgien erscheint es als fiktiver Preisnachlass.',
                  'Beide hebben een referentieprijs nodig die vóór de opening van de offertes vastligt (de raming). Absoluut: volle punten bij lo × referentie, nul bij hi × referentie, lineair ertussen; een offerte buiten de band wordt afgekapt, kies de band dus ruim genoeg. Gemonetariseerd: de prijs van elke offerte wordt verminderd met V × het kwaliteitsaandeel (V = waarde van volle kwaliteit in euro); de laagste beoordelingsprijs wint. In Nederland heet dat “gunnen op waarde”, in België komt het voor als fictieve prijsvermindering.',
                  'Les deux exigent un prix de référence fixé avant l’ouverture des offres (l’estimation). Absolue : note maximale à lo × référence, nulle à hi × référence, linéaire entre les deux ; une offre hors bande est écrêtée, choisissez donc une bande assez large. Monétisée : le prix de chaque offre est diminué de V × sa part de qualité (V = valeur de la qualité maximale en euros) ; le prix évalué le plus bas l’emporte. Aux Pays-Bas on parle de « gunnen op waarde », en Belgique de réductions de prix fictives.',
                  'Ambos requieren un precio de referencia fijado antes de abrir las ofertas (el presupuesto). Absoluto: puntos máximos en lo × referencia, cero en hi × referencia, lineal entre ambos; una oferta fuera de la banda se recorta, así que elija una banda amplia. Monetizado: el precio de cada oferta se reduce en V × su cuota de calidad (V = valor de la calidad máxima en euros); gana el precio evaluado más bajo. En los Países Bajos se llama «gunnen op waarde»; en Bélgica aparece como rebajas ficticias de precio.',
                  'Obie wymagają ceny odniesienia ustalonej przed otwarciem ofert (kosztorys zamawiającego). Bezwzględna: pełne punkty przy lo × odniesienie, zero przy hi × odniesienie, liniowo pomiędzy; oferta poza pasmem jest obcinana, więc wybierz pasmo dość szerokie. Pieniężna: cenę każdej oferty pomniejsza się o V × udział jakości (V = wartość pełnej jakości w euro); wygrywa najniższa cena oceniana. W Holandii to „gunnen op waarde”, w Belgii — fikcyjne obniżki ceny.') },
        recommend: { title: T('How the recommendation is made', 'Як формується рекомендація', 'Wie die Empfehlung entsteht', 'Hoe de aanbeveling tot stand komt', 'Comment la recommandation est établie', 'Cómo se forma la recomendación', 'Jak powstaje rekomendacja'),
          body: T('Each method collects penalty points: rank reversal seen in this bid set 40; score depends on the other bids 15; zero price points for a bid within 1.5 × the lowest 15; based on the mean price 10; absolute with bids outside the anchors 20; absolute or monetised with a reference price outside 0.5–2 × the median bid 30 (a stale estimate makes their anchors meaningless). The lowest total wins; ties go to absolute, monetised, proportional, linear, linear %, floor, mean, interpolation. It is a transparent rule of thumb for a design discussion, not a legal requirement.',
                  'Кожен метод отримує штрафні бали: інверсія рангів у цьому наборі 40; бал залежить від інших пропозицій 15; нуль балів ціни для пропозиції в межах 1,5 × найнижча 15; базується на середній ціні 10; абсолютний з пропозиціями поза опорними цінами 20; абсолютний чи монетизований з опорною ціною поза 0,5–2 × медіана пропозицій 30 (застарілий кошторис робить їхні опорні значення беззмістовними). Перемагає найменша сума; за рівності — абсолютний, монетизований, пропорційний, лінійний, лінійний %, поріг, середня, інтерполяція. Це прозоре практичне правило для обговорення, а не вимога закону.',
                  'Jede Methode sammelt Maluspunkte: Rangumkehr in diesem Angebotssatz 40; Punkte hängen von anderen Angeboten ab 15; null Preispunkte für ein Angebot innerhalb 1,5 × niedrigster 15; mittelwertbasiert 10; absolut mit Angeboten außerhalb der Anker 20; absolut oder monetarisiert mit einem Referenzpreis außerhalb 0,5–2 × Median der Angebote 30 (eine veraltete Schätzung macht ihre Anker bedeutungslos). Die kleinste Summe gewinnt; bei Gleichstand absolut, monetarisiert, proportional, linear, linear %, Untergrenze, Mittel, Interpolation. Eine offengelegte Faustregel für die Diskussion, keine Rechtspflicht.',
                  'Elke methode verzamelt strafpunten: rangomkering in deze offertes 40; score hangt af van andere offertes 15; nul prijspunten voor een offerte binnen 1,5 × de laagste 15; gebaseerd op de gemiddelde prijs 10; absoluut met offertes buiten de ankers 20; absoluut of gemonetariseerd met een referentieprijs buiten 0,5–2 × de mediaan van de offertes 30 (een verouderde raming maakt hun ankers zinloos). Het laagste totaal wint; bij gelijkstand absoluut, gemonetariseerd, proportioneel, lineair, lineair %, bodem, gemiddelde, interpolatie. Een transparante vuistregel voor de discussie, geen wettelijke verplichting.',
                  'Chaque méthode reçoit des points de pénalité : inversion constatée dans ce jeu d’offres 40 ; note dépendant des autres offres 15 ; zéro point prix pour une offre à moins de 1,5 × le plus bas 15 ; basée sur la moyenne 10 ; absolue avec des offres hors ancrages 20 ; absolue ou monétisée avec un prix de référence hors 0,5–2 × la médiane des offres 30 (une estimation périmée vide leurs ancrages de sens). Le total le plus bas l’emporte ; en cas d’égalité : absolue, monétisée, proportionnelle, linéaire, linéaire %, plancher, moyenne, interpolation. Une règle empirique explicite pour la discussion, pas une obligation légale.',
                  'Cada método suma puntos de penalización: inversión observada en estas ofertas 40; la puntuación depende de otras ofertas 15; cero puntos de precio para una oferta dentro de 1,5 × la más baja 15; basado en la media 10; absoluto con ofertas fuera de anclajes 20; absoluto o monetizado con un precio de referencia fuera de 0,5–2 × la mediana de las ofertas 30 (un presupuesto desfasado vacía de sentido sus anclajes). Gana el total más bajo; en empate: absoluto, monetizado, proporcional, lineal, lineal %, suelo, media, interpolación. Una regla práctica explícita para el debate, no una exigencia legal.',
                  'Każda metoda zbiera punkty karne: odwrócenie rankingu w tym zestawie 40; punkty zależą od innych ofert 15; zero punktów ceny dla oferty w granicach 1,5 × najniższa 15; oparcie na średniej 10; bezwzględna z ofertami poza cenami odniesienia 20; bezwzględna lub pieniężna z ceną odniesienia poza 0,5–2 × mediana ofert 30 (nieaktualny kosztorys odbiera sens jej punktom odniesienia). Wygrywa najniższa suma; przy remisie: bezwzględna, pieniężna, proporcjonalna, liniowa, liniowa %, próg, średnia, interpolacja. Jawna reguła kciuka do dyskusji, a nie wymóg prawa.') }
      },

  /* ---- project bar (tnd-core.js) ---- */
  var bar = null, useMsg = null;
  function projectPayload() {
    if (!last || !last.ok) return null;
    var inp = last.input, C = last.chosen;
    var criteria = { price_weight: inp.W / 100, price_formula: last.method, price_params: inp.params, quality_normalisation: inp.qnorm,
                     reference_price: inp.ref.price, anchors: { lo: inp.ref.lo, hi: inp.ref.hi },
                     items: inp.items.map(function (it) { return { id: it.id, name: it.name, weight: it.weight / 100, scale: '0-' + it.max, scale_max: it.max }; }) };
    return {
      state: JSON.parse(JSON.stringify(state)),
      results: { method: last.method, winner: C.ev.winner, order: C.ev.order, margin: C.ev.margin, eur_per_point: C.eur ? C.eur.perPoint : null,
                 reversal_methods: last.reversalMethods, recommended: last.recommend[0] ? last.recommend[0].method : null,
                 winners: (function () { var o = {}; lib().METHOD_IDS.forEach(function (k) { o[k] = last.methods[k].available ? last.methods[k].ev.winner : null; }); return o; })() },
      summary: { text: last.method + ': ' + C.ev.winner + (C.reversal && C.reversal.any ? ' (rank reversal)' : '') + '; recommended ' + (last.recommend[0] ? last.recommend[0].method : '-') },
      blocks: { criteria: criteria }
    };
  }
  function showUse(text, tone) {
    if (!useMsg) return;
    useMsg.textContent = text; useMsg.style.display = text ? '' : 'none';
    useMsg.style.borderColor = tone === 'bad' ? 'var(--bad,#c0392b)' : (tone === 'warn' ? 'var(--warn,#d68910)' : 'var(--line,#e2e7ee)');
  }
  /* "Use": restore our own module state, or take bids (party, price) and criteria from the shared blocks. Refuses invalid numbers. */
  function useProject(doc, moduleId) {
    var L = lang();
    if (!doc || typeof doc !== 'object') { showUse(S.useNone[L], 'warn'); return { ok: false }; }
    var mod = doc.modules && doc.modules[TOOL];
    if ((moduleId === TOOL || !moduleId) && mod && mod.state && typeof mod.state === 'object') {
      var clean = sanitize(mod.state);
      if (clean.bids && clean.bids.length >= 2) {
        Object.keys(clean).forEach(function (k) { state[k] = clean[k]; });
        if (ui) { ui.sync(); ui.run(); }
        showUse(S.useTaken[L] + ': ' + (mod.summary && mod.summary.text || TOOL), 'ok');
        return { ok: true, from: 'module' };
      }
    }
    var names = {}; (doc.parties || []).forEach(function (p) { if (p && p.id) names[p.id] = p.name || p.id; });
    var bids = [], refused = 0;
    (doc.bids || []).forEach(function (b) {
      if (!b || bids.length >= MAXB) return;
      if (!(typeof b.price === 'number' && isFinite(b.price) && b.price > 0 && b.price <= LIM.refPrice[1])) { refused++; return; }
      var q = b.quality || {}, row = { name: String(names[b.party] || b.party || '#' + (bids.length + 1)).slice(0, 40), price: b.price, q1: 0, q2: 0, q3: 0, included: true };
      var cr = doc.criteria && doc.criteria.items || [];
      cr.slice(0, NQ).forEach(function (it, k) { var v = q[it.id]; if (typeof v === 'number' && isFinite(v) && v >= 0) row['q' + (k + 1)] = v; });
      bids.push(row);
    });
    bids = sanitize({ bids: bids }).bids || [];
    if (bids.length < 2) { showUse(S.useNone[L] + (refused ? ' · ' + S.useRefused[L] + ': ' + refused : ''), 'warn'); return { ok: false, refused: refused }; }
    state.bids = bids;
    var est = doc.tender && doc.tender.value_est, hasEst = typeof est === 'number' && isFinite(est) && est > 0 && est <= LIM.refPrice[1], refMsg;
    if (hasEst) { state.refPrice = est; refMsg = S.useRefSet[L] + ' (' + eur(est, L) + ')'; }
    else refMsg = S.useRefKept[L] + ' (' + eur(state.refPrice, L) + ')';
    var c = doc.criteria;

  /* permalink / project import: known keys only, numbers within the field limits, enums checked, lists rebuilt */
  function sanitize(o) {
    var out = {};
    if (!o || typeof o !== 'object' || Array.isArray(o)) return out;
    Object.keys(DEFAULTS).forEach(function (k) {
      if (!Object.prototype.hasOwnProperty.call(o, k)) return;
      var v = o[k];
      if (ENUM[k]) { if (ENUM[k].indexOf(String(v)) >= 0) out[k] = String(v); return; }
      if (LIM[k]) { v = typeof v === 'string' && v.trim() !== '' ? +v : v; if (inLim(k, v)) out[k] = v; return; }
      if (k === 'Vauto' || k === 'testOn') { out[k] = v === true; return; }
      if (k === 'items' && Array.isArray(v)) {
        out.items = v.slice(0, NQ).filter(function (it) { return it && typeof it === 'object'; }).map(function (it) {
          return { name: String(it.name == null ? '' : it.name).slice(0, 60), weight: fin(+it.weight, 0, 100) ? +it.weight : 0, max: fin(+it.max, 1, 1000) ? +it.max : 10 };
        });
        return;
      }
      if (k === 'bids' && Array.isArray(v)) {
        var b = v.slice(0, MAXB).filter(function (x) { return x && typeof x === 'object'; }).map(function (x) {
          return { name: String(x.name == null ? '' : x.name).slice(0, 40), price: fin(+x.price, 0, 1e11) ? +x.price : 0,
                   q1: fin(+x.q1, 0, 1000) ? +x.q1 : 0, q2: fin(+x.q2, 0, 1000) ? +x.q2 : 0, q3: fin(+x.q3, 0, 1000) ? +x.q3 : 0, included: x.included !== false };
        });
        if (b.length >= 2) out.bids = b;
        return;
      }
      if (typeof v === 'string' && (k === 'tenderRef' || k === 'evaluator')) out[k] = v.slice(0, 200);
    });
    return out;
  }

        state: {

        },

      });
    }
  }

})();
