<script type="application/json" id="diagram-tool-manifest">{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision":"2026-08-11.2","id":"thermodynamiccycles","file":"thermodynamiccycles.html","listed":true,"category":"thermo","order":10,"title":{"en":"Thermodynamic Cycles","uk":"Термодинамічні цикли","de":"Thermodynamische Kreisprozesse","nl":"Thermodynamische kringprocessen","fr":"Cycles thermodynamiques","es":"Ciclos termodinámicos","pl":"Cykle termodynamiczne"},"summary":{"en":"Vapour power and refrigeration cycles — Rankine with reheat or regenerative feedwater heating, and vapour-compression with an internal heat exchanger, two-stage flash economiser or transcritical CO2 — for nine working fluids, plotted on T–s, h–s, lg p–h, lg p–v and T–h diagrams.","uk":"Пароcилові та холодильні цикли — Ренкіна з проміжним перегрівом або регенеративним підігрівом живильної води та парокомпресійний з внутрішнім теплообмінником, двоступеневим економайзером чи транскритичним CO₂ — для дев'яти робочих тіл на діаграмах T–s, h–s, lg p–h, lg p–v і T–h.","de":"Dampfkraft- und Kälteprozesse — Rankine mit Zwischenüberhitzung oder regenerativer Speisewasservorwärmung sowie Kaltdampfprozess mit internem Wärmeübertrager, zweistufigem Flash-Economiser oder transkritischem CO₂ — für neun Arbeitsmedien, dargestellt in T–s-, h–s-, lg p–h-, lg p–v- und T–h-Diagrammen.","nl":"Stoomkracht- en koelkringprocessen — Rankine met tussenoververhitting of regeneratieve voedingswatervoorverwarming, en dampcompressie met interne warmtewisselaar, tweetraps flash-economiser of transkritisch CO₂ — voor negen werkmedia, weergegeven in T–s-, h–s-, lg p–h-, lg p–v- en T–h-diagrammen.","fr":"Cycles moteurs à vapeur et frigorifiques — Rankine avec resurchauffe ou réchauffage régénératif de l'eau alimentaire, et compression de vapeur avec échangeur interne, économiseur flash à deux étages ou CO₂ transcritique — pour neuf fluides de travail, tracés sur des diagrammes T–s, h–s, lg p–h, lg p–v et T–h.","es":"Ciclos de potencia de vapor y de refrigeración — Rankine con recalentamiento o regeneración con calentadores de agua de alimentación, y compresión de vapor con intercambiador interno, economizador flash de dos etapas o CO₂ transcrítico — para nueve fluidos de trabajo, en diagramas T–s, h–s, lg p–h, lg p–v y T–h.","pl":"Obiegi parowe siłowe i chłodnicze — Rankine’a z przegrzewem wtórnym lub regeneracyjnym podgrzewaniem wody zasilającej oraz sprężarkowe z wewnętrznym wymiennikiem ciepła, dwustopniowym ekonomizerem rozprężnym lub transkrytycznym CO₂ — dla dziewięciu czynników roboczych, na wykresach T–s, h–s, lg p–h, lg p–v i T–h."},"description":{"en":"Vapour power and refrigeration cycles — Rankine with reheat or regenerative feedwater heating, and vapour-compression with an internal heat exchanger, two-stage flash economiser or transcritical CO2 — for nine working fluids, plotted on T–s, h–s, lg p–h, lg p–v and T–h diagrams.","uk":"Пароcилові та холодильні цикли — Ренкіна з проміжним перегрівом або регенеративним підігрівом живильної води та парокомпресійний з внутрішнім теплообмінником, двоступеневим економайзером чи транскритичним CO₂ — для дев'яти робочих тіл на діаграмах T–s, h–s, lg p–h, lg p–v і T–h.","de":"Dampfkraft- und Kälteprozesse — Rankine mit Zwischenüberhitzung oder regenerativer Speisewasservorwärmung sowie Kaltdampfprozess mit internem Wärmeübertrager, zweistufigem Flash-Economiser oder transkritischem CO₂ — für neun Arbeitsmedien, dargestellt in T–s-, h–s-, lg p–h-, lg p–v- und T–h-Diagrammen.","nl":"Stoomkracht- en koelkringprocessen — Rankine met tussenoververhitting of regeneratieve voedingswatervoorverwarming, en dampcompressie met interne warmtewisselaar, tweetraps flash-economiser of transkritisch CO₂ — voor negen werkmedia, weergegeven in T–s-, h–s-, lg p–h-, lg p–v- en T–h-diagrammen.","fr":"Cycles moteurs à vapeur et frigorifiques — Rankine avec resurchauffe ou réchauffage régénératif de l'eau alimentaire, et compression de vapeur avec échangeur interne, économiseur flash à deux étages ou CO₂ transcritique — pour neuf fluides de travail, tracés sur des diagrammes T–s, h–s, lg p–h, lg p–v et T–h.","es":"Ciclos de potencia de vapor y de refrigeración — Rankine con recalentamiento o regeneración con calentadores de agua de alimentación, y compresión de vapor con intercambiador interno, economizador flash de dos etapas o CO₂ transcrítico — para nueve fluidos de trabajo, en diagramas T–s, h–s, lg p–h, lg p–v y T–h.","pl":"Obiegi parowe siłowe i chłodnicze — Rankine’a z przegrzewem wtórnym lub regeneracyjnym podgrzewaniem wody zasilającej oraz sprężarkowe z wewnętrznym wymiennikiem ciepła, dwustopniowym ekonomizerem rozprężnym lub transkrytycznym CO₂ — dla dziewięciu czynników roboczych, na wykresach T–s, h–s, lg p–h, lg p–v i T–h."},"status":"benchmarked","independent_validation":false,"limitations":{"en":"Idealised steady-state component models: prescribed isentropic efficiencies, no pressure drop in the heat exchangers, no heat loss to ambient, no mechanical, electrical or generator losses, no machine performance maps and no off-design behaviour; heat-exchanger geometry and pinch points are not modelled, so the condensing and evaporating temperatures are inputs rather than results. Regeneration uses open (mixing) feedwater heaters at geometrically spaced bleed pressures. Properties come from CoolProp compiled to WebAssembly (version 7.2.1dev; water and steam through the IAPWS-IF97 backend, refrigerants through Helmholtz equations of state) and inherit its validity ranges and uncertainties; a newer CoolProp release changes some equations of state, notably R1234yf. R410A is treated as a pseudo-pure fluid, so its temperature glide is not resolved and its evaporating and condensing temperatures are dew-point values. Isentropic efficiencies outside (0,1], pressures outside the cycle's own pressure range and a turbine inlet below saturation are refused rather than clamped.","uk":"Ідеалізовані стаціонарні моделі компонентів: задані ізоентропні ККД, без втрат тиску в теплообмінниках, без тепловтрат у довкілля, без механічних, електричних і генераторних втрат, без характеристик машин і позарозрахункових режимів; геометрія теплообмінників і температурні напори не моделюються, тому температури конденсації та випаровування є вхідними даними, а не результатом. Регенерація виконана відкритими (змішувальними) підігрівачами живильної води з геометрично розподіленими тисками відборів. Властивості обчислює CoolProp, скомпільований у WebAssembly (версія 7.2.1dev; вода й пара — за IAPWS-IF97, холодоагенти — за рівняннями Гельмгольца), з його діапазонами чинності та невизначеностями; новіші випуски CoolProp змінюють деякі рівняння стану, зокрема для R1234yf. R410A розглядається як псевдочиста речовина, тому температурний глайд не враховується, а температури випаровування й конденсації є температурами роси. Ізоентропні ККД поза (0,1], тиски поза власним діапазоном циклу та вхід у турбіну нижче лінії насичення відхиляються, а не обрізаються.","de":"Idealisierte stationäre Komponentenmodelle: vorgegebene isentrope Wirkungsgrade, keine Druckverluste in den Wärmeübertragern, keine Wärmeverluste an die Umgebung, keine mechanischen, elektrischen oder Generatorverluste, keine Maschinenkennfelder und kein Teillastverhalten; Wärmeübertragergeometrie und Grädigkeiten werden nicht modelliert, Kondensations- und Verdampfungstemperatur sind daher Eingaben und keine Ergebnisse. Die Regeneration verwendet offene (mischende) Speisewasservorwärmer bei geometrisch gestuften Anzapfdrücken. Die Stoffdaten liefert CoolProp als WebAssembly (Version 7.2.1dev; Wasser und Dampf über IAPWS-IF97, Kältemittel über Helmholtz-Zustandsgleichungen) mit dessen Gültigkeitsbereichen und Unsicherheiten; neuere CoolProp-Versionen ändern einzelne Zustandsgleichungen, insbesondere R1234yf. R410A wird als pseudo-reiner Stoff behandelt, der Temperaturgleit wird also nicht aufgelöst und Verdampfungs- und Kondensationstemperatur sind Taupunktwerte. Isentrope Wirkungsgrade außerhalb (0,1], Drücke außerhalb des Druckbereichs des Prozesses und ein Turbineneintritt unterhalb der Sättigung werden abgelehnt statt begrenzt.","nl":"Geïdealiseerde stationaire componentmodellen: voorgeschreven isentropische rendementen, geen drukverlies in de warmtewisselaars, geen warmteverlies naar de omgeving, geen mechanische, elektrische of generatorverliezen, geen machinekarakteristieken en geen deellastgedrag; warmtewisselaargeometrie en pinch-punten worden niet gemodelleerd, zodat de condensatie- en verdampingstemperatuur invoer zijn en geen resultaat. Regeneratie gebruikt open (mengende) voedingswatervoorwarmers bij geometrisch verdeelde aftapdrukken. De stofeigenschappen komen van CoolProp gecompileerd naar WebAssembly (versie 7.2.1dev; water en stoom via IAPWS-IF97, koudemiddelen via Helmholtz-toestandsvergelijkingen) met de bijbehorende geldigheidsgebieden en onzekerheden; een nieuwere CoolProp-uitgave wijzigt sommige toestandsvergelijkingen, met name R1234yf. R410A wordt als pseudo-zuivere stof behandeld, dus de temperatuurglijding wordt niet opgelost en de verdampings- en condensatietemperatuur zijn dauwpuntwaarden. Isentropische rendementen buiten (0,1], drukken buiten het drukbereik van het kringproces en een turbine-inlaat onder verzadiging worden geweigerd in plaats van afgekapt.","fr":"Modèles de composants idéalisés en régime permanent : rendements isentropiques imposés, pas de pertes de charge dans les échangeurs, pas de pertes thermiques vers l'ambiance, pas de pertes mécaniques, électriques ou d'alternateur, pas de cartes de machines ni de fonctionnement hors point nominal ; la géométrie des échangeurs et les pincements ne sont pas modélisés, si bien que les températures de condensation et d'évaporation sont des données et non des résultats. La régénération utilise des réchauffeurs d'eau alimentaire ouverts (à mélange) à des pressions de soutirage réparties géométriquement. Les propriétés proviennent de CoolProp compilé en WebAssembly (version 7.2.1dev ; eau et vapeur par IAPWS-IF97, frigorigènes par des équations d'état de Helmholtz) et en héritent les domaines de validité et les incertitudes ; une version plus récente de CoolProp modifie certaines équations d'état, notamment pour le R1234yf. Le R410A est traité comme un fluide pseudo-pur : le glissement de température n'est pas résolu et ses températures d'évaporation et de condensation sont des valeurs au point de rosée. Les rendements isentropiques hors de (0,1], les pressions hors de la plage de pression du cycle et une entrée turbine sous la saturation sont refusés plutôt que bornés.","es":"Modelos de componentes idealizados en régimen permanente: rendimientos isentrópicos impuestos, sin pérdidas de carga en los intercambiadores, sin pérdidas de calor al ambiente, sin pérdidas mecánicas, eléctricas ni de generador, sin mapas de máquinas ni comportamiento fuera de diseño; no se modelan la geometría de los intercambiadores ni los pinzamientos, por lo que las temperaturas de condensación y evaporación son datos de entrada y no resultados. La regeneración emplea calentadores abiertos (de mezcla) del agua de alimentación con presiones de extracción espaciadas geométricamente. Las propiedades proceden de CoolProp compilado a WebAssembly (versión 7.2.1dev; agua y vapor mediante IAPWS-IF97, refrigerantes mediante ecuaciones de estado de Helmholtz) y heredan sus rangos de validez e incertidumbres; una versión más reciente de CoolProp cambia algunas ecuaciones de estado, en particular la del R1234yf. El R410A se trata como fluido pseudopuro, de modo que no se resuelve su deslizamiento de temperatura y sus temperaturas de evaporación y condensación son valores de punto de rocío. Los rendimientos isentrópicos fuera de (0,1], las presiones fuera del rango de presión del ciclo y una entrada a la turbina por debajo de la saturación se rechazan en lugar de recortarse.","pl":"Idealizowane modele komponentów w stanie ustalonym: z góry określone sprawności izentropowe, brak spadku ciśnienia w wymiennikach ciepła, brak strat ciepła do otoczenia, brak strat mechanicznych, elektrycznych lub generatorowych, brak map wydajności maszyn i brak zachowań niezgodnych z projektem; geometria wymiennika ciepła i punkty zwężenia nie są modelowane, więc temperatury skraplania i skraplania są danymi wejściowymi, a nie wynikami. Regeneracja wykorzystuje otwarte (mieszające) podgrzewacze wody zasilającej przy geometrycznie rozłożonych ciśnieniach upustowych. Właściwości pochodzą z CoolProp skompilowanego do WebAssembly (wersja 7.2.1dev; woda i para wodna poprzez oprogramowanie IAPWS-IF97, czynniki chłodnicze poprzez równania stanu Helmholtza) i dziedziczą jego zakresy ważności i niepewności; nowsza wersja CoolProp zmienia niektóre równania stanu, zwłaszcza R1234yf. R410A jest traktowany jako czynnik pseudoczysty, więc jego poślizg temperaturowy nie jest rozwiązany, a jego temperatury parowania i skraplania są wartościami punktu rosy. Sprawności izentropowe poza zakresem (0,1], ciśnienia poza zakresem ciśnień cyklu oraz wlot turbiny poniżej nasycenia są odrzucane zamiast być blokowane."},"intended_use":["education","technical exploration","preliminary assessment"],"catalog_languages":["en","uk","de","nl","fr","es","pl"],"tool_languages":["en","uk","de","nl","fr","es","pl"],"dependencies":["thermodynamiccycles.wasm","diagram-common.js"],"network_access":{"mode":"same-origin-data","note":"Fetches only its own declared local files from this site: thermodynamiccycles.wasm (the CoolProp property library) and diagram-common.js (the shared runtime). No external service is contacted and nothing is transmitted."},"validation":{"basis":{"en":"57 cases driven through the page DOM: every cycle the page offers, nine working fluids, the refusal of out-of-range input, and a case that used to kill the WebAssembly build. Each case is graded against an independent python implementation of the cycle algebra and, separately, against law-based invariants computed only from the numbers the page prints (loop energy balance, entropy generation per component, isentropic-efficiency direction, lever rule, COP_h = COP_c + 1, Carnot bound). Fluid properties come from CoolProp on both sides, so property agreement is a binding check, not an independent one. The harness is the author's own; no external party has reviewed it.","uk":"57 випадків, проведених через DOM сторінки: усі цикли, які пропонує сторінка, дев'ять робочих тіл, відмова від вхідних даних поза діапазоном і випадок, який раніше «вбивав» WebAssembly-збірку. Кожен випадок перевіряється за незалежною реалізацією алгебри циклу на python і окремо за законами збереження, обчисленими лише з чисел, які друкує сторінка (баланс енергії по контуру, генерація ентропії в кожному компоненті, напрям ізоентропного ККД, правило важеля, COP_h = COP_c + 1, межа Карно). Властивості з обох боків дає CoolProp, тож їх збіг перевіряє коректність прив'язки, а не є незалежною перевіркою. Випробувальний стенд належить авторові; сторонньої перевірки не проводилося.","de":"57 Fälle über das Seiten-DOM gefahren: jeder Kreisprozess der Seite, neun Arbeitsmedien, die Ablehnung von Eingaben außerhalb des Bereichs und ein Fall, der die WebAssembly-Build bisher zum Absturz brachte. Jeder Fall wird gegen eine unabhängige python-Implementierung der Kreisprozessalgebra und zusätzlich gegen Erhaltungssätze bewertet, die allein aus den von der Seite gedruckten Zahlen berechnet werden (Energiebilanz über den Kreislauf, Entropieerzeugung je Komponente, Richtung des isentropen Wirkungsgrads, Hebelgesetz, COP_h = COP_c + 1, Carnot-Grenze). Die Stoffdaten stammen auf beiden Seiten von CoolProp; ihre Übereinstimmung prüft daher die Anbindung, nicht die Stoffdaten selbst. Der Prüfstand stammt vom Autor; eine Prüfung durch Dritte fand nicht statt.","nl":"57 gevallen via de DOM van de pagina uitgevoerd: elk kringproces dat de pagina biedt, negen werkmedia, het weigeren van invoer buiten bereik en een geval dat de WebAssembly-build voorheen liet crashen. Elk geval wordt beoordeeld tegen een onafhankelijke python-implementatie van de kringprocesalgebra en daarnaast tegen behoudswetten die uitsluitend uit de door de pagina afgedrukte getallen volgen (energiebalans over de kringloop, entropieproductie per component, richting van het isentropisch rendement, hefboomregel, COP_h = COP_c + 1, Carnot-grens). De stofeigenschappen komen aan beide kanten van CoolProp; overeenstemming daarvan toetst de koppeling, niet de stofdata. De testbank is van de auteur zelf; er is geen review door derden.","fr":"57 cas pilotés via le DOM de la page : chaque cycle proposé, neuf fluides de travail, le refus des entrées hors domaine et un cas qui faisait auparavant planter la build WebAssembly. Chaque cas est comparé à une implémentation python indépendante de l'algèbre du cycle et, séparément, à des invariants issus des lois de conservation calculés uniquement à partir des nombres affichés (bilan d'énergie sur la boucle, entropie produite par composant, sens du rendement isentropique, règle des moments, COP_h = COP_c + 1, borne de Carnot). Les propriétés proviennent de CoolProp des deux côtés : leur accord vérifie le raccordement, pas les propriétés elles-mêmes. Le banc d'essai est celui de l'auteur ; aucune revue externe n'a eu lieu.","es":"57 casos ejecutados a través del DOM de la página: todos los ciclos que ofrece, nueve fluidos de trabajo, el rechazo de entradas fuera de rango y un caso que antes hacía caer la compilación WebAssembly. Cada caso se contrasta con una implementación independiente en python del álgebra del ciclo y, por separado, con invariantes de las leyes de conservación calculados solo a partir de los números que imprime la página (balance de energía del lazo, generación de entropía por componente, sentido del rendimiento isentrópico, regla de la palanca, COP_h = COP_c + 1, límite de Carnot). Las propiedades proceden de CoolProp en ambos lados, de modo que su acuerdo comprueba el enlace, no las propiedades. El banco de pruebas es del propio autor; no ha habido revisión externa.","pl":"57 przypadków przepuszczonych przez DOM strony: każdy cykl oferowany przez stronę, dziewięć płynów roboczych, odmowa wprowadzenia danych spoza zakresu oraz przypadek, który powodował zatrzymanie kompilacji WebAssembly. Każdy przypadek jest oceniany w oparciu o niezależną implementację algebry cykli w Pythonie oraz, oddzielnie, w oparciu o niezmienniki oparte na prawach obliczone wyłącznie na podstawie liczb wyświetlanych przez stronę (bilans energetyczny pętli, generowanie entropii na komponent, kierunek wydajności izentropowej, reguła dźwigni, COP_h = COP_c + 1, ograniczenie Carnota). Właściwości płynów pochodzą z CoolProp po obu stronach, więc uzgadnianie właściwości jest wiążącym sprawdzeniem, a nie niezależnym. Zestaw testowy został przygotowany przez autora; nie został poddany przeglądowi przez niezależną stronę trzecią."},"independent_validation":false,"benchmarks":[{"id":"cycles-first-and-second-law-2026-08-12","reference":"Independent python implementation of every cycle the page offers (component-by-component first and second law, written from the textbook definitions), plus law-based invariants — loop energy balance, component entropy generation, isentropic-efficiency direction and the Carnot bound — evaluated from the numbers the page itself prints. CoolProp 8.0.0 supplies the fluid properties on both sides, so property agreement is a check that the WebAssembly binding is wired correctly, not an independent property check.","citations":["M. J. Moran, H. N. Shapiro, D. D. Boettner, M. B. Bailey, Fundamentals of Engineering Thermodynamics, 8th ed., ch. 8 (vapour power systems: Rankine, reheat, regenerative with open feedwater heaters) and ch. 10 (vapour-compression refrigeration, flash-chamber two-stage, transcritical CO2) — component definitions of isentropic turbine/pump/compressor efficiency, open-feedwater-heater bleed fractions and flash-tank mass/energy balances.","Y. A. Cengel, M. A. Boles, Thermodynamics: An Engineering Approach, 8th ed., §10-6 (regenerative Rankine with open FWH) and §11-2/11-6 (vapour-compression and cascade/multistage systems).","Second law as applied here: Clausius inequality per adiabatic component (s_out >= s_in) and the Carnot limit eta <= 1 - T_sink/T_source, COP_c <= T_c/(T_h-T_c), evaluated with the temperatures the page itself reports.","CoolProp 8.0.0 (python) — property source shared with the page WebAssembly build; used for the binding check and as the property layer of the reference."],"cases":57,"passed":57,"tolerance":"Every graded quantity is compared at the precision the page prints it: efficiency and bleed fraction to 0.05 % (one decimal shown), COP to 0.005 (two decimals), power/duty cards to half of the last printed digit (0.5 MW, 0.05 MW or 0.005 MW by magnitude; 0.5 kW / 0.05 kW / 50 kW for the refrigeration cards), state-point enthalpy to 0.05 kJ/kg, entropy to 5e-5 kJ/(kg K), temperature to 0.05 K, plus 2e-6 relative for the property round-trips both implementations perform. Law-based invariants are graded at the propagated display tolerance of the numbers they combine; an entropy difference between two printed entropies can only be resolved to 1.05e-4 kJ/(kg K) (two values each rounded to four decimals), so that is the slack allowed on entropy generation, while the Carnot bound is required with no slack at all. Input-consistency checks (the state points must sit at the temperatures the user typed) are graded to 0.051 K, the display resolution. Refusal cases pass only if the page shows a message AND clears the previous result — an error banner over a stale state table is graded as a failure. Quantities on which CoolProp 8.0.0 and 7.2.0 disagree by more than the tolerance are flagged and not graded.","run_at":"2026-08-12T00:11:40.434Z","artifact":"benchmarks/thermodynamiccycles.json"}]},"report":{"pdf":true,"source_attribution":true},"python_export":{"supported":true,"requires":[],"reason":"Scoped to water/steam. The page gets its properties from CoolProp compiled to WebAssembly; an exported script must run on a bare python3 with nothing installed, so the export carries this site's own IAPWS-IF97 engine and reproduces every cycle exactly when the working fluid is H2O. For the eight refrigerants the property model is a multiparameter Helmholtz equation of state that cannot be ported honestly into one readable file, and those states are declined with that reason rather than exported against a pip dependency."},"handoff":{"provides":["mdot","T","p","h","s","x","Q"],"accepts":[]},"state_codec":{"permalink":true,"record":"tools.petrov.re/calculation-record/v1"},"ui":{"framework":"tools.petrov.re/ui/v1","level":3}}</script>

<style>
  /* The shell, the tokens, the theme and every control style come from
     diagram-ui.js. What is left here is the one surface the framework does not
     own — the readout that follows the pointer over the stage canvas — and two
     alignment rules for the state-point table. Every value is a v3 token
     (UI_FRAMEWORK_SPEC.md section 2); no colour, radius, shadow, font size or
     spacing literal appears below. */
  #tc-tip{position:absolute;pointer-events:none;display:none;z-index:var(--z-sticky);
    background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:var(--radius-sm);box-shadow:var(--shadow);
    padding:var(--sp-2) var(--sp-3);font:400 var(--fs-small)/1.5 var(--font);
    max-width:min(280px,60vw)}
  #tc-tip b{color:var(--accent)}
  /* diagram-ui.js hides a field or an empty panel with the hidden property, but
     its own .dgu-field{display:grid} / .dgu-panel{display:flex} rules outrank the
     user-agent [hidden] rule, so the node stays on screen. Until the framework
     carries this rule itself, the tool restores the intended behaviour. */
  .dgu-field[hidden],.dgu-panel[hidden]{display:none}
  #tc-states td:first-child,#tc-states th:first-child{text-align:left}
  #tc-states th:not(:first-child){text-align:right}
</style>

ometryczną.","fn_pseudo":"fn_pseudo","R410A is modelled as a pseudo-pure fluid: two-phase states are interpolated between the bubble and dew points and the temperature glide is not resolved.":"R410A jest modelowany jako czynnik pseudoczysty: stany dwufazowe interpoluje się między temperaturą pęcherzyków i punktem rosy, bez jawnego odwzorowania poślizgu temperaturowego.","w_isolines":"w_izolinii","Some isolines could not be drawn for this fluid in this region.":"Niektórych izolinii nie można narysować dla tego czynnika w tym obszarze.","prop_lib":"prop_lib","Property library: CoolProp %v (WebAssembly).":"Biblioteka właściwości: CoolProp %v (WebAssembly).","btn_png":"przycisk_png","Diagram (PNG)":"Diagram (PNG)","rep_cycle":"cykl rep","rep_fluid":"rep_fluid","this page gets its properties from CoolProp compiled to WebAssembly, and an exported ":"ta strona pobiera swoje właściwości z CoolProp skompilowanego do WebAssembly i wyeksportowanego","script has to run on a bare python3 with nothing installed. For water/steam that is ":"Skrypt musi działać na czystym pythonie 3 bez żadnych zainstalowanych elementów. W przypadku wody/pary jest to","possible — IAPWS-IF97 is a published set of polynomials and this site already carries ":"możliwe — IAPWS-IF97 to opublikowany zbiór wielomianów, a ta strona już go zawiera","the engine, so the water export reproduces the page exactly. For ":"Silnik, więc eksport wody dokładnie odtwarza stronę. Dla"," it is not: the ":"to nie jest: to","property model is a multiparameter Helmholtz equation of state":"model właściwości jest wieloparametrowym równaniem stanu Helmholtza","R410A":"R410A",", and for R410A a mixture model with departure functions on top of two of them":"i dla R410A model mieszany z funkcjami odjazdowymi na dwóch z nich",", which cannot be ported honestly into one readable file. Switch the working fluid to ":", którego nie da się uczciwie przenieść do jednego czytelnego pliku. Zmień płyn roboczy na","H₂O to export; the cycle algebra itself is fully exportable and is not what is missing.":"H₂O do eksportu; sama algebra cykli jest w pełni eksportowalna i to nie jej brakuje.","It closes a vapour cycle around real fluid properties: pick the working fluid, pick the cycle, set the pressures, temperatures and machine efficiencies, and the page solves every state point and draws the loop on a property diagram.":"Zamyka cykl parowania wokół rzeczywistych właściwości płynu: wybierz płyn roboczy, wybierz cykl, ustaw ciśnienia, temperatury i sprawność maszyny, a strona rozwiązuje każdy punkt stanu i rysuje pętlę na diagramie właściwości.","A power cycle turns heat into work: the fluid is boiled, expanded through a turbine and condensed. A refrigeration cycle runs the same loop the other way, spending compressor work to lift heat from the evaporator to the condenser. The choice also decides which fluids and which diagram axes are useful.":"Cykl energetyczny zamienia ciepło na pracę: ciecz jest gotowana, rozprężana przez turbinę i skraplana. Cykl chłodniczy działa w ten sam sposób, ale w drugą stronę, zużywając pracę sprężarki, aby przenieść ciepło z parownika do skraplacza. Wybór ten decyduje również o tym, które ciecze i które osie diagramu są przydatne.","Rankine is the plain loop: pump, boiler, turbine, condenser. Reheat takes the steam back to the boiler part-way down the expansion, which raises the mean temperature of heat addition and keeps the exhaust drier. Regeneration bleeds steam from the turbine into open feedwater heaters, so the feed water enters the boiler hot.":"Regeneracja Rankine'a to prosta pętla: pompa, kocioł, turbina, skraplacz. Przegrzewanie odprowadza parę z powrotem do kotła w połowie drogi rozprężania, co podnosi średnią temperaturę dodawania ciepła i utrzymuje spaliny bardziej suche. Regeneracja odprowadza parę z turbiny do otwartych podgrzewaczy wody zasilającej, dzięki czemu woda zasilająca wpływa do kotła w stanie gorącym.","Isentropic efficiency":"Sprawność izentropowa","The work of the real machine divided by the work of a reversible, adiabatic one between the same pressures. A value outside (0,1] would make entropy fall across an adiabatic machine, so this page refuses it with a message rather than quietly clamping it to a legal number.":"Praca rzeczywistej maszyny podzielona przez pracę maszyny odwracalnej, adiabatycznej, pomiędzy tymi samymi ciśnieniami. Wartość spoza zakresu (0,1) spowodowałaby spadek entropii w maszynie adiabatycznej, dlatego ta strona odrzuca ją komunikatem, zamiast po cichu ograniczać ją do dopuszczalnej wartości.","Open (mixing) feedwater heaters. The bleed pressures are spaced geometrically between the condenser and the boiler, and each heater takes exactly the steam it needs to bring its feed stream to saturated liquid; the bleed fractions are the result, not an input.":"Otwarte (mieszające) podgrzewacze wody zasilającej. Ciśnienia upustowe są rozłożone geometrycznie między skraplaczem a kotłem, a każdy podgrzewacz pobiera dokładnie tyle pary, ile potrzebuje, aby doprowadzić strumień zasilający do stanu nasyconego; frakcje upustowe są wynikiem, a nie wkładem.","The pressure at which the steam leaves the turbine for the second pass through the boiler. It has to lie between the condensing pressure and the boiler pressure; outside that band the cycle is not a reheat cycle and the page says so instead of drawing one.":"Ciśnienie, pod którym para opuszcza turbinę w drugim przejściu przez kocioł. Musi mieścić się między ciśnieniem skraplania a ciśnieniem w kotle; poza tym zakresem cykl nie jest cyklem dogrzewania, o czym strona informuje, zamiast go rysować.","A suction-line heat exchanger subcools the liquid leaving the condenser with the cold vapour leaving the evaporator. Effectiveness is the heat actually exchanged divided by the most the smaller of the two streams could take; it raises the cooling effect and the discharge temperature together.":"Wymiennik ciepła na linii ssącej przechładza ciecz opuszczającą skraplacz, a zimną parę opuszczającą parownik. Efektywność to iloraz faktycznie wymienionego ciepła i maksymalnej ilości ciepła, jaką może przyjąć mniejszy z dwóch strumieni; zwiększa to jednocześnie efekt chłodzenia i temperaturę tłoczenia.","Two compression stages with a flash tank between them: the liquid is throttled to the intermediate pressure, the vapour flashed off is injected between the stages and only the liquid goes on to the evaporator. ":"Dwa stopnie sprężania z umieszczonym pomiędzy nimi zbiornikiem buforowym: ciecz jest dławiona do ciśnienia pośredniego, odparowana para jest wtryskiwana między stopnie, a do parownika trafia tylko ciecz.","Transcritical operation":"Operacja transkrytyczna","Every corner of the loop, in the order the fluid meets it: pressure, temperature, specific enthalpy, specific entropy, specific volume and vapour quality. A dash in the quality column means the state is single-phase.":"Każdy narożnik pętli, w kolejności, w jakiej spotyka się z nim płyn: ciśnienie, temperatura, entalpia właściwa, entropia właściwa, objętość właściwa i jakość pary. Myślnik w kolumnie „jakość” oznacza stan jednofazowy.","For a power cycle the headline is the thermal efficiency, net work divided by heat added, with the turbine, boiler and condenser duties beside it. For a refrigeration cycle it is the COP, useful heat divided by compressor work, cooling first and heating second; the two differ by exactly one.":"W przypadku cyklu energetycznego nagłówkiem jest sprawność cieplna, czyli praca netto podzielona przez ciepło dodane, a obok niej zadania turbiny, kotła i skraplacza. W przypadku cyklu chłodniczego jest to współczynnik COP, czyli ciepło użyteczne podzielone przez pracę sprężarki, przy czym najpierw następuje chłodzenie, a potem grzanie; te dwa wskaźniki różnią się dokładnie o jeden.","Steam plant with reheat":"Elektrownia parowa z podgrzewaniem","Regenerative plant":"Roślina regeneracyjna","R134a chiller":"Agregat chłodniczy R134a","Transcritical CO₂":"Transkrytyczny CO₂","Compression":"Sprężanie","Grid":"Siatka","Axes":"Osie","x":"x","Results":"Wyniki","What this tool does":"Co robi to narzędzie","Reading the result":"Jak czytać wynik","Model, equations and limitations":"Model, równania i ograniczenia"};
let LANG='en';
function t(k){const d=I18N[LANG]||I18N.en;return (d[k]!==undefined?d[k]:(I18N.en[k]!==undefined?I18N.en[k]:k));}
/* applyLang() removed with the tool's own markup: the shell re-reads every
   label through this same dictionary when the language changes. */

/* ================= property layer (CoolProp) ================= */
let CP=null, IP=null, CPVER='?'; const AScache={}, FCONST={};
const FLUID_MAP={Water:'Water',R717:'Ammonia',R134a:'R134a',R1234yf:'R1234yf',R32:'R32',R410A:'R410A',R290:'Propane',R600a:'Isobutane',R744:'CarbonDioxide'};
function backendFor(k){return k==='Water'?'IF97':'HEOS';}
function AS(k){if(!AScache[k])AScache[k]=CP.factory(backendFor(k),FLUID_MAP[k]);return AScache[k];}
function constsFor(k){if(FCONST[k])return FCONST[k];const n=FLUID_MAP[k];const c={Tc:CP.PropsSI('Tcrit','',0,'',0,n),Pc:CP.PropsSI('Pcrit','',0,'',0,n)/1e6,Tmin:CP.PropsSI('Ttriple','',0,'',0,n),Tmax:CP.PropsSI('Tmax','',0,'',0,n),pmin:Math.max(CP.PropsSI('ptriple','',0,'',0,n)/1e6,1e-6)};FCONST[k]=c;return c;}
function rd(s){const Q=s.Q();return{p:s.p()/1e6,T:s.T(),h:s.hmass()/1000,s:s.smass()/1000,v:1/s.rhomass(),x:(Q>=-1e-9&&Q<=1+1e-9)?Math.min(1,Math.max(0,Q)):null};}
function PT(f,p,T){const s=AS(f);s.update(IP.PT_INPUTS,p*1e6,T);return rd(s);}
function PQ(f,p,q){const s=AS(f);s.update(IP.PQ_INPUTS,p*1e6,q);return rd(s);}
function QT(f,q,T){const s=AS(f);s.update(IP.QT_INPUTS,q,T);return rd(s);}
function PS(f,p,sv){const s=AS(f);s.update(IP.PSmass_INPUTS,p*1e6,sv*1e3);return rd(s);}
function PH(f,p,hv){const s=AS(f);s.update(IP.HmassP_INPUTS,hv*1e3,p*1e6);return rd(s);}
function psatT(f,T){const s=AS(f);s.update(IP.QT_INPUTS,1,T);return s.p()/1e6;}
function hf_p(f,p){return PQ(f,p,0).h;}
/* Failed property calls are not free: every exception that crosses the WebAssembly
   boundary leaks memory in the emscripten runtime, and a few hundred of them exhaust the
   heap and kill the page. Curves therefore fail fast — a fluid that rejects a whole class
   of inputs is probed once and remembered — and a lifetime budget stops the isoline
   drawing before the property library can be exhausted. */
let PFAILS=0; const PFAILMAX=200;
function ptry(fn){if(PFAILS>=PFAILMAX)return null;try{return fn();}catch(e){PFAILS++;return null;}}
function twoPhaseOK(f){const C=constsFor(f);
  if(C.qmid===undefined){try{QT(f,0.5,(C.Tmin+C.Tc)/2);C.qmid=true;}catch(e){C.qmid=false;}}
  return C.qmid;}
/* Two-phase state at quality x. A pseudo-pure fluid (R410A) refuses an intermediate
   quality, so the state is built with the lever rule between the bubble and the dew point:
   exact for a pure fluid, and for a pseudo-pure blend it ignores the temperature glide —
   which is exactly what the pseudo-pure model does anyway. */
function QX(f,x,T){
  if(x<=0)return QT(f,0,T);
  if(x>=1)return QT(f,1,T);
  if(twoPhaseOK(f))return QT(f,x,T);
  const a=QT(f,0,T),b=QT(f,1,T),m=(u,v)=>u+(v-u)*x;
  return{p:m(a.p,b.p),T:m(a.T,b.T),h:m(a.h,b.h),s:m(a.s,b.s),v:m(a.v,b.v),x:x};}
function pumpTo(f,hin,pFrom,pTo,ep){const sIn=PH(f,pFrom,hin).s;const h2s=PS(f,pTo,sIn).h;return hin+(h2s-hin)/ep;}

/* ================= input guards (prevent fatal out-of-range CoolProp calls) ================= */
function guard(f,cfg){const C=constsFor(f),Tmn=C.Tmin,Tmx=C.Tmax,Tc=C.Tc;
  const num=v=>String(+v.toPrecision(3));
  if(cfg.family==='power'){const Tcd=cfg.tCondP+273.15,Ts=cfg.tSup+273.15;
    if(Tcd<=Tmn+0.5||Tcd>=Tc)throw Error('cond T');
    if(Ts>=Tmx-1||Ts<=Tmn+1)throw Error('superheat T');
    if(cfg.pBoiler<=0||cfg.pBoiler>=Math.min(100,C.Pc*4))throw Error('boiler p');
    if(cfg.ptype==='reheat'&&(cfg.tReheat+273.15>=Tmx-1||cfg.tReheat+273.15<=Tmn+1))throw Error('reheat T');
    /* An isentropic efficiency outside (0,1] is not a loss factor: eta>1 makes entropy fall
       across an adiabatic machine and eta<=0 makes the work zero or negative. Refused
       instead of being computed. */
    if(!(cfg.etaT>0&&cfg.etaT<=1))throw Error(t('e_eta_t'));
    if(!(cfg.etaP>0&&cfg.etaP<=1))throw Error(t('e_eta_p'));
    if(!(cfg.mdotP>0))throw Error(t('e_mdot'));
    /* The turbine inlet must be vapour: below the saturation temperature of the boiler
       pressure the "superheater outlet" is compressed liquid and the whole cycle is
       meaningless. Above the critical pressure there is no such boundary. */
    if(cfg.pBoiler<C.Pc){const Tsat=PQ(f,cfg.pBoiler,1).T;
      if(Ts<=Tsat+0.05)throw Error(t('e_liquid').replace('%p',num(cfg.pBoiler)).replace('%t',(Tsat-273.15).toFixed(1)));}
    const pC=psatT(f,Tcd);
    if(cfg.ptype==='reheat'&&!(cfg.pReheat>pC&&cfg.pReheat<cfg.pBoiler))
      throw Error(t('e_preheat').replace('%a',num(pC)).replace('%b',num(cfg.pBoiler)));
  }else{const Te=cfg.tEvap+273.15,Tcd=cfg.tCond+273.15,trans=Tcd>=Tc-0.2;
    if(Te<=Tmn+0.2||Te>=Tc-0.5)throw Error('evap T');
    if(Te+cfg.dSh>=Tmx-1)throw Error('suction T');
    if(Te>=Tcd)throw Error('Te<Tc order');
    if(!trans&&Tcd<=Tmn+0.2)throw Error('cond T');
    if(trans){if(cfg.pGC<=C.Pc)throw Error('gas-cooler p');if(cfg.tGC+273.15>=Tmx-1||cfg.tGC+273.15<=Tmn+0.2)throw Error('gc T');}
    if(!(cfg.etaC>0&&cfg.etaC<=1))throw Error(t('e_eta_c'));
    if(!(cfg.mdotR>0))throw Error(t('e_mdot'));
    if(cfg.comp==='single'&&cfg.ihx&&!(cfg.ihxEff>=0&&cfg.ihxEff<=1))throw Error(t('e_ihxeff'));
    if(cfg.comp==='two'){const pE=psatT(f,Te),pH=trans?cfg.pGC:psatT(f,Tcd);
      if(cfg.pInter>0&&!(cfg.pInter>pE&&cfg.pInter<pH))
        throw Error(t('e_pinter').replace('%a',num(pE)).replace('%b',num(pH)));}
  }}

/* ================= cycle solvers ================= */
function solvePower(cfg){
  guard(cfg.fluid,cfg);
  const f=cfg.fluid, pB=cfg.pBoiler, Tsup=cfg.tSup+273.15, Tcond=cfg.tCondP+273.15, pC=psatT(f,Tcond);
  const et=cfg.etaT, ep=cfg.etaP, m=cfg.mdotP;
  const pts=[]; const push=(n,st,note)=>{pts.push(Object.assign({name:n,note},st));return st;};
  if(cfg.ptype==='regen'){
    const n=cfg.nFwh; const pe=[];for(let i=1;i<=n;i++)pe.push(pC*Math.pow(pB/pC,i/(n+1)));
    const p1=push('1',PQ(f,pC,0),'n_cond_out');
    const s3o=PT(f,pB,Tsup);
    // turbine expansion pB -> pe[n-1..0] -> pC
    const levels=pe.slice().reverse().concat([pC]);
    let hprev=s3o.h,sprev=s3o.s; const hext={};
    const p3=push('3',s3o,'n_sh_out');
    let ei=4; const extNames={};
    for(const pk of levels){const hs=PS(f,pk,sprev).h;const hk=hprev-et*(hprev-hs);const st=PH(f,pk,hk);hext[pk]=hk;
      if(pk!==pC){const nm=String(ei++);extNames[pk]=nm;push(nm,st,'n_extraction');}else{push('K',st,'n_turb_out');}
      hprev=hk;sprev=st.s;}
    const hExh=hprev;
    // bleed fractions high->low
    const order=pe.slice().reverse(); let S=1, y={};
    for(let i=0;i<order.length;i++){const Ph=order[i];const Pb=(i+1<order.length)?order[i+1]:pC;
      const hp=pumpTo(f,hf_p(f,Pb),Pb,Ph,ep);const yk=S*(hf_p(f,Ph)-hp)/(hext[Ph]-hp);y[Ph]=yk;S-=yk;}
    const mCond=1-Object.values(y).reduce((a,b)=>a+b,0);
    const hBF=pumpTo(f,hf_p(f,pe[n-1]),pe[n-1],pB,ep);
    push('2',PH(f,pB,hBF),'n_boiler_feed');
    // turbine work
    const seg=[pB].concat(pe.slice().reverse(),[pC]); let flow=1,wT=0,hb=s3o.h;
    for(let i=0;i<seg.length-1;i++){const pk=seg[i+1];wT+=flow*(hb-hext[pk]);hb=hext[pk];if(y[pk]!==undefined)flow-=y[pk];}
    // pumps
    let wP=mCond*(pumpTo(f,hf_p(f,pC),pC,pe[0],ep)-hf_p(f,pC));
    for(let k=1;k<n;k++){let fk=mCond;for(let j=0;j<k;j++)fk+=y[pe[j]];wP+=fk*(pumpTo(f,hf_p(f,pe[k-1]),pe[k-1],pe[k],ep)-hf_p(f,pe[k-1]));}
    wP+=1*(pumpTo(f,hf_p(f,pe[n-1]),pe[n-1],pB,ep)-hf_p(f,pe[n-1]));
    const qIn=s3o.h-hBF, qOut=mCond*(hExh-p1.h), wNet=wT-wP, eff=wNet/qIn;
    // processes for drawing: boiler isobar 2->3, turbine 3->K straight through extractions, condenser K->1
    const idx=name=>pts.findIndex(p=>p.name===name);
    const proc=[[idx('2'),idx('3'),'isoP',pB]];
    // turbine path: straight segments through the extraction points, by pressure descending
    const tnames=['3'];pe.slice().reverse().forEach(pk=>{if(extNames[pk])tnames.push(extNames[pk]);});tnames.push('K');
    for(let i=0;i<tnames.length-1;i++)proc.push([idx(tnames[i]),idx(tnames[i+1]),'line']);
    proc.push([idx('K'),idx('1'),'isoP',pC]);
    // feed line 1->2 (pump/regeneration) as line
    proc.push([idx('1'),idx('2'),'line']);
    return {pts,processes:proc,kind:'power',metrics:{cards:[
      ['c_eff',(eff*100).toFixed(1),'%'],['c_pnet',fmtP(m*wNet/1000),'MW'],['c_pturb',fmtP(m*wT/1000),'MW'],
      ['c_qin',fmtP(m*qIn/1000),'MW'],['c_qout',fmtP(m*qOut/1000),'MW'],
      ['c_bleed',(Object.values(y).reduce((a,b)=>a+b,0)*100).toFixed(1),'%']]}};
  }
  // Rankine / reheat
  const reheat=cfg.ptype==='reheat', Trh=cfg.tReheat+273.15; const pR=cfg.pReheat;   /* range enforced in guard() — never clamped silently */
  const p1=push('1',PQ(f,pC,0),'n_cond_out');
  const h2s=PS(f,pB,p1.s).h,h2=p1.h+(h2s-p1.h)/ep,p2=push('2',PH(f,pB,h2),'n_pump');
  const p3=push('3',PT(f,pB,Tsup),'n_sh_out');
  let wT,qIn,qOut,exhaust,processes;
  if(reheat){
    const h4s=PS(f,pR,p3.s).h,h4=p3.h-et*(p3.h-h4s),p4=push('4',PH(f,pR,h4),'n_hp_out');
    const p5=push('5',PT(f,pR,Trh),'n_reheat');
    const h6s=PS(f,pC,p5.s).h,h6=p5.h-et*(p5.h-h6s),p6=push('6',PH(f,pC,h6),'n_lp_out');
    wT=(p3.h-p4.h)+(p5.h-p6.h);qIn=(p3.h-p2.h)+(p5.h-p4.h);qOut=p6.h-p1.h;exhaust=p6;
    processes=[[0,1,'line'],[1,2,'isoP',pB],[2,3,'line'],[3,4,'isoP',pR],[4,5,'line'],[5,0,'isoP',pC]];
  }else{
    const h4s=PS(f,pC,p3.s).h,h4=p3.h-et*(p3.h-h4s),p4=push('4',PH(f,pC,h4),'n_turb_out');
    wT=p3.h-p4.h;qIn=p3.h-p2.h;qOut=p4.h-p1.h;exhaust=p4;
    processes=[[0,1,'line'],[1,2,'isoP',pB],[2,3,'line'],[3,0,'isoP',pC]];
  }
  const wP=p2.h-p1.h,wNet=wT-wP,eff=wNet/qIn;
  return {pts,processes,kind:'power',metrics:{cards:[
    ['c_eff',(eff*100).toFixed(1),'%'],['c_pnet',fmtP(m*wNet/1000),'MW'],['c_pturb',fmtP(m*wT/1000),'MW'],
    ['c_qin',fmtP(m*qIn/1000),'MW'],['c_qout',fmtP(m*qOut/1000),'MW'],
    ['c_xex',exhaust.x==null?t('u_vapor'):exhaust.x.toFixed(3),'']]}};
}

function solveRef(cfg){
  guard(cfg.fluid,cfg);
  const f=cfg.fluid, C=constsFor(f);
  const Te=cfg.tEvap+273.15, Tc=cfg.tCond+273.15, sh=cfg.dSh, sc=cfg.dSc, ec=cfg.etaC, m=cfg.mdotR;
  const pE=psatT(f,Te);
  const trans=Tc>=C.Tc-0.2;
  const pHigh= trans?cfg.pGC:psatT(f,Tc);
  const pts=[]; const push=(n,st,note)=>{pts.push(Object.assign({name:n,note},st));return st;};
  const kw=v=>{const a=Math.abs(v);return a>=1000?(v/1000).toFixed(1)+' MW':a>=100?v.toFixed(0)+' kW':v.toFixed(1)+' kW';};
  if(cfg.comp==='two'){
    const pI=cfg.pInter>0?cfg.pInter:Math.sqrt(pE*pHigh);   /* 0 = automatic geometric mean (see the note under the inputs); any other value is range-checked in guard() */
    const p1=push('1', sh>0?PT(f,pE,Te+sh):PQ(f,pE,1),'n_suction');
    const h2s=PS(f,pI,p1.s).h,h2=p1.h+(h2s-p1.h)/ec,p2=push('2',PH(f,pI,h2),'n_ls_disch');
    const p5= trans?push('5',PT(f,pHigh,cfg.tGC+273.15),'n_gc_out'):push('5', sc>0?PT(f,pHigh,Tc-sc):PQ(f,pHigh,0),'n_cond_out');
    const hgI=PQ(f,pI,1).h;
    const flash=PH(f,pI,p5.h); const xq=Math.min(Math.max(flash.x==null?0:flash.x,0),1);
    const p6=push('6',flash,'n_flash_in');            // flash-tank inlet (two-phase, after throttle)
    const p7=push('7',PQ(f,pI,0),'n_flash_liq');      // separated saturated liquid
    const p9=push('9',PQ(f,pI,1),'n_flash_vap');      // separated saturated vapour (injected)
    const h3=(1-xq)*p2.h+xq*hgI; const p3=push('3',PH(f,pI,h3),'n_mix');

      [I('2'),I('3'),'isoP',pI],       // LP-stage discharge de-superheated by mixing (@ pI)
      [I('9'),I('3'),'isoP',pI],       // flash vapour injected into the mixing point
      [I('3'),I('4'),'line'],
      [I('4'),I('5'), trans?'isoPT':'isoP', pHigh],
      [I('5'),I('6'),'isoH',null],     // throttle into the flash tank (h = const)
      [I('6'),I('7'),'isoP',pI],       // phase separation — saturated-liquid branch
      [I('6'),I('9'),'isoP',pI],       // phase separation — saturated-vapour branch
      [I('7'),I('8'),'isoH',null],     // throttle to the evaporator

      ['c_copc',copC.toFixed(2),''],['c_coph',copH.toFixed(2),''],['c_qcool',kw(m*qE),''],
      ['c_wcomp',kw(m*W),''],['c_qcond',kw(m*qC),''],['c_pinter',pE.toFixed(3)+' / '+pI.toFixed(2)+' / '+pHigh.toFixed(2),'MPa']]}};

      [I('3'),I('4'),'isoP',pHigh],[I('4'),I('5'),'isoH',null],[I('5'),I('6'),'isoP',pE]];
    return {pts,processes:proc,kind:'ref',metrics:{cards:[
      ['c_copc',copC.toFixed(2),''],['c_coph',copH.toFixed(2),''],['c_qcool',kw(m*qE),''],
      ['c_wcomp',kw(m*wC),''],['c_qcond',kw(m*qC),''],['c_plh',pE.toFixed(3)+' / '+pHigh.toFixed(2),'MPa']]}};
  }

  const p1=push('1', sh>0?PT(f,pE,Te+sh):PQ(f,pE,1),'n_suction');
  const h2s=PS(f,pHigh,p1.s).h,h2=p1.h+(h2s-p1.h)/ec,p2=push('2',PH(f,pHigh,h2),'n_disch');

  const qE=p1.h-p4.h, wC=p2.h-p1.h, qC=p2.h-p3.h, copC=qE/wC, copH=qC/wC;

  return {pts,processes:proc,kind:'ref',metrics:{cards:[
    ['c_copc',copC.toFixed(2),''],['c_coph',copH.toFixed(2),''],['c_qcool',kw(m*qE),''],
    ['c_wcomp',kw(m*wC),''],['c_qcond',kw(m*qC),''],['c_plh',pE.toFixed(3)+' / '+pHigh.toFixed(2),'MPa']]}};
}

const AX={Ts:{x:'s',y:'T',xl:'s, kJ/(kg·K)',yl:'T, °C',ytoC:true},hs:{x:'s',y:'h',xl:'s, kJ/(kg·K)',yl:'h, kJ/kg'},

function dome(f,ax){const C=constsFor(f);const liq=[],vap=[];const N=160;let miss=0;
  for(let i=0;i<=N;i++){const T=C.Tmin+(C.Tc-C.Tmin-0.02)*i/N;
    const a=ptry(()=>QT(f,0,T)),b=ptry(()=>QT(f,1,T));
    if(a&&b){liq.push(C2(a,ax));vap.push(C2(b,ax));}else if(++miss>8)break;}
  const cp=ptry(()=>PT(f,C.Pc,C.Tc));if(cp){liq.push(C2(cp,ax));vap.push(C2(cp,ax));}
  return{liq,vap};}
function isobarP(f,p,ax){const C=constsFor(f);const pl=[];const Tlo=C.Tmin+0.5,Thi=Math.min(C.Tmax-1,1070);
  const a=ptry(()=>PT(f,p,Tlo)),b=ptry(()=>PT(f,p,Thi));if(!a||!b)return pl;
  const hlo=a.h,hhi=b.h,N=90;let miss=0;
  for(let i=0;i<=N;i++){const h=hlo+(hhi-hlo)*i/N;const st=ptry(()=>PH(f,p,h));if(st)pl.push(C2(st,ax));else if(++miss>8)break;}
  return pl;}
function isothermT(f,T,ax){const C=constsFor(f);const pl=[];let miss=0;
  const add=st=>{if(st)pl.push(C2(st,ax));else miss++;};
  if(T>=C.Tc){const N=60;for(let i=0;i<=N;i++){const p=C.pmin*Math.pow(C.Pc*8/C.pmin,i/N);add(ptry(()=>PT(f,p,T)));if(miss>8)break;}return pl;}
  const ps=psatT(f,T);
  for(let i=0;i<=30;i++){const p=C.pmin*Math.pow(ps/C.pmin,i/30);if(p>=ps)break;add(ptry(()=>PT(f,p,T)));if(miss>8)break;}
  for(let i=0;i<=16;i++){add(ptry(()=>QX(f,1-i/16,T)));if(miss>8)break;}
  for(let i=1;i<=24;i++){const p=ps+(Math.min(C.Pc*6,ps*50)-ps)*i/24;add(ptry(()=>PT(f,p,T)));if(miss>8)break;}
  return pl;}
function qualLine(f,x,ax){const C=constsFor(f);const pl=[];const N=120;let miss=0;
  for(let i=1;i<=N;i++){const T=C.Tmin+(C.Tc-C.Tmin-0.02)*i/N;const st=ptry(()=>QX(f,x,T));
    if(st)pl.push(C2(st,ax));else if(++miss>8)break;}

let view=null, lastSol=null, lastCfg=null;

/* The drawing. Identical geometry and identical property calls to the version

   size comes from the stage's ResizeObserver instead of a fixed app frame. */
function drawStage(size,st){
  const ctx=st.canvas();const W=size.w,H=size.h;
  const cs=getComputedStyle(document.documentElement),cget=n=>cs.getPropertyValue(n).trim();
  const ink=cget('--ink')||'#111',muted=cget('--muted')||'#777',line=cget('--line')||'#ddd',
        accent=cget('--accent')||'#36e',okc=cget('--ok')||'#0a0',warnc=cget('--warn')||'#c80',
        panel=cget('--panel')||'#fff',font=cget('--font')||'sans-serif',

  ctx.clearRect(0,0,W,H);
  ensureTip(st);
  if(!lastSol||!lastCfg){view=null;return;}
  const sol=lastSol,cfg=lastCfg,f=cfg.fluid,ax=AX[cfg.axis];
  const coarse=size.density==='coarse';
  const padL=coarse?46:66,padR=coarse?14:24,padT=20,padB=coarse?34:44;
  const cyc=sol.pts.map(p=>C2(p,ax));const dm=dome(f,ax);const xlog=!!ax.xlog,ylog=!!ax.ylog;
  let xmin=Infinity,xmax=-Infinity,ymin=Infinity,ymax=-Infinity;
  const cxs=cyc.map(c=>c.X),cys=cyc.map(c=>c.Y);xmin=Math.min(...cxs);xmax=Math.max(...cxs);ymin=Math.min(...cys);ymax=Math.max(...cys);

  for(const c of dm.liq.concat(dm.vap))if(c.X>=xmin-sxx&&c.X<=xmax+sxx&&c.Y>=ymin-syy&&c.Y<=ymax+syy){xmin=Math.min(xmin,c.X);xmax=Math.max(xmax,c.X);ymin=Math.min(ymin,c.Y);ymax=Math.max(ymax,c.Y);}
  function pad(mn,mx,log){if(log){const a=Math.log10(Math.max(mn,1e-9)),b=Math.log10(mx),d=(b-a)*0.08+1e-3;return[Math.pow(10,a-d),Math.pow(10,b+d)];}const d=(mx-mn)*0.10+1e-9;return[mn-d,mx+d];}
  [xmin,xmax]=pad(xmin,xmax,xlog);[ymin,ymax]=pad(ymin,ymax,ylog);
  const sx=v=>{const tt=xlog?(Math.log10(v)-Math.log10(xmin))/(Math.log10(xmax)-Math.log10(xmin)):(v-xmin)/(xmax-xmin);return padL+tt*(W-padL-padR);};
  const sy=v=>{const tt=ylog?(Math.log10(v)-Math.log10(ymin))/(Math.log10(ymax)-Math.log10(ymin)):(v-ymin)/(ymax-ymin);return(H-padB)-tt*(H-padT-padB);};
  view={sx,sy,cyc,W,H};

  const showGrid=!!ST().showGrid;
  function ticks(mn,mx,log){const tk=[];if(log){for(let e=Math.floor(Math.log10(mn));e<=Math.ceil(Math.log10(mx));e++)for(const mm of[1,2,5]){const v=mm*Math.pow(10,e);if(v>=mn&&v<=mx)tk.push(v);}}else{const sp=mx-mn,st=Math.pow(10,Math.floor(Math.log10(sp))),s=sp/st>5?st:sp/st>2?st/2:st/5;for(let v=Math.ceil(mn/s)*s;v<=mx;v+=s)tk.push(v);}return tk;}
  /* below md the framework asks for a coarser density: the grid stays, every
     second label goes, so the labels stay physical instead of shrinking */
  const skip=coarse?2:1;
  ticks(xmin,xmax,xlog).forEach((v,i)=>{const X=sx(v);if(showGrid){ctx.strokeStyle=line;ctx.beginPath();ctx.moveTo(X,padT);ctx.lineTo(X,H-padB);ctx.stroke();}
    if(i%skip===0){ctx.fillStyle=muted;ctx.textAlign='center';ctx.fillText(nice(v),X,H-padB+16);}});
  ticks(ymin,ymax,ylog).forEach((v,i)=>{const Y=sy(v);if(showGrid){ctx.strokeStyle=line;ctx.beginPath();ctx.moveTo(padL,Y);ctx.lineTo(W-padR,Y);ctx.stroke();}
    if(i%skip===0){ctx.fillStyle=muted;ctx.textAlign='right';ctx.fillText(nice(v),padL-8,Y+4);}});
  ctx.strokeStyle=line;ctx.strokeRect(padL,padT,W-padL-padR,H-padT-padB);
  ctx.fillStyle=ink;ctx.textAlign='center';ctx.fillText(ax.xl,(padL+W-padR)/2,H-8);
  ctx.save();ctx.translate(14,(padT+H-padB)/2);ctx.rotate(-Math.PI/2);ctx.fillText(ax.yl,0,0);ctx.restore();

  if(ST().showIsobars){const set=new Set();for(const p of[C.pmin*4,C.Pc*0.02,C.Pc*0.06,C.Pc*0.2,C.Pc*0.5,C.Pc*0.9,C.Pc*1.3])if(p>C.pmin&&p<C.Pc*8)set.add(+p.toPrecision(3));for(const p of set)poly(isobarP(f,p,ax),accent,1,0.30);}

  let draw=[];for(const pr of sol.processes){const seg=procPath(pr[0],pr[1],pr[2],pr[3]);if(seg.length)draw=draw.concat(seg);}
  if(draw.length){ctx.save();ctx.globalAlpha=0.10;ctx.fillStyle=accent;ctx.beginPath();draw.forEach((c,i)=>{const X=sx(c.X),Y=sy(c.Y);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});ctx.closePath();ctx.fill();ctx.restore();poly(draw,accent,2.5);}
  ctx.font='500 '+fs+'px '+font;
  cyc.forEach(c=>{const X=sx(c.X),Y=sy(c.Y);ctx.fillStyle=warnc;ctx.strokeStyle=panel;ctx.lineWidth=2;ctx.beginPath();ctx.arc(X,Y,5,0,7);ctx.fill();ctx.stroke();ctx.fillStyle=ink;ctx.textAlign='left';ctx.fillText(c.st.name,X+8,Y-8);});

}

/* the readout that follows the pointer over the state points */
function ensureTip(st){
  if(st.__tip)return st.__tip;
  const tip=document.createElement('div');tip.id='tc-tip';st.body.appendChild(tip);st.__tip=tip;
  const cvEl=st.cv;if(!cvEl)return tip;
  cvEl.addEventListener('mousemove',e=>{if(!view){tip.style.display='none';return;}
    const r=cvEl.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;let best=null,bd=1e9;
    for(const c of view.cyc){const d=(view.sx(c.X)-mx)**2+(view.sy(c.Y)-my)**2;if(d<bd){bd=d;best=c;}}
    if(best&&bd<400){const p=best.st;tip.style.display='block';
      tip.style.left=Math.min(view.W-190,view.sx(best.X)+12)+'px';tip.style.top=(view.sy(best.Y)+12)+'px';
      tip.innerHTML=`<b>${t('th_pt')} ${p.name}</b> · ${t(p.note)}<br>p = ${nice(p.p)} MPa &nbsp; T = ${(p.T-273.15).toFixed(1)} °C<br>h = ${p.h.toFixed(1)} kJ/kg &nbsp; s = ${p.s.toFixed(4)}<br>v = ${p.v<0.01?p.v.toExponential(3):p.v.toFixed(4)} m³/kg ${p.x==null?'':'&nbsp; x = '+(p.x<=0?'0':p.x>=1?'1':p.x.toFixed(3))}`;
    }else tip.style.display='none';});
  cvEl.addEventListener('mouseleave',()=>{tip.style.display='none';});

/* Direct manipulation of physically independent state points. Derived turbine,

let TC_DRAG=null;
function tcDragKeys(cfg,name){
  if(cfg.family==='power'){
    if(name==='1')return['tCondP'];
    if(name==='3')return['pBoiler','tSup'];

    return[];
  }
  if(cfg.comp==='two'){
    if(name==='1')return['tEvap','dSh'];
    if(name==='5')return isTrans(ST())?['pGC','tGC']:['tCond','dSc'];
    return[];
  }
  if(cfg.ihx){
    if(name==='6')return['tEvap','dSh'];
    if(name==='3')return isTrans(ST())?['pGC','tGC']:['tCond','dSc'];
    return[];
  }
  if(name==='1')return['tEvap','dSh'];
  if(name==='3')return isTrans(ST())?['pGC','tGC']:['tCond','dSc'];
  return[];
}
const TC_STEP={pBoiler:.08,tSup:1,pReheat:.04,tReheat:1,tCondP:.25,tEvap:.25,dSh:.25,tCond:.25,dSc:.25,pGC:.04,tGC:.5};
function tcClamp(k,v,cfg){
  const lim={pBoiler:[.15,95],tSup:[20,790],pReheat:[.01,Math.max(.02,cfg.pBoiler-.01)],tReheat:[20,790],tCondP:[1,150],tEvap:[-100,80],dSh:[0,100],tCond:[-80,160],dSc:[0,80],pGC:[.1,40],tGC:[-80,200]}[k];

function tcPoint(sol,name){return sol&&sol.pts&&sol.pts.find(p=>p.name===name);}

/* ---------- python export ----------
   The runtime supplies the header, the INPUTS/EXPECTED blocks and the self-test driver; the
   code below must define compute() and return exactly the keys the record reports, rounded
   the way the page prints them.

   §1.4.0 — this export runs on a bare python3, standard library only, and that is what fixes
   its scope. This page IS CoolProp: the WebAssembly build in thermodynamiccycles.wasm answers
   every property call. Two of the three honest options are therefore closed. Declaring
   `requires: ['CoolProp']` is no longer allowed, and porting the property model is only
   possible for one of the nine working fluids: water/steam is IAPWS-IF97, a published set of
   polynomials that this site already carries (steam_tables.html emits the whole engine), while
   the eight refrigerants are multiparameter Helmholtz equations of state — a separate
   coefficient set, ideal-gas part, ancillary saturation equations and density solver per fluid,
   and for R410A a mixture model with departure functions on top. Porting a dozen of those into
   one exported file is not something a reader could check, and writing them by hand is how one
   ships a wrong number.

   So the export is SCOPED, not abandoned: for water it reproduces the page completely, with the
   IF97 engine ported in below; for a refrigerant it declines the state and says why, per §1.4.1.
   Every cycle on the page — Rankine, reheat, regeneration, vapour compression, SLHX, two-stage —
   is exported when the fluid is water; nothing about the cycle algebra is scoped away.

   One detail decides whether the water export is worth having. CoolProp's IF97 backend does not
   iterate on the basic equations when it is handed (p,h) or (p,s): it evaluates the IF97
   backward equations once, which are consistent with the basic equations only to ~0.02 K. Every
   pump, turbine and compressor exit on this page is such an inversion, and the page prints its
   temperatures to 0.1 K, so an engine that bisects to the exact root — the first version of this
   port did — disagrees with the page by a whole printed digit in about one water configuration
   in six. The backward equations are therefore ported too, and the script now takes the same
   route the page takes. Measured over 175 water configurations across every cycle type and the
   full input range, the worst disagreement fell from 1.7e-2 to 1.0e-3. */

# IF97 backend. A pip install of CoolProp would make this script depend on a build
# nobody can inspect, so instead the site's own IF97 engine — the one steam_tables.html
# emits into its export — is carried here in full: regions 1, 2, 3 and 5, the region
# 2/3 boundary, the region-4 saturation line and the numerical inversions that turn
# (p,h) and (p,s) back into a state. Coefficients are IAPWS R7-97 (2012), Tables 2,

class OutOfRange(Exception):
    pass


class NoConvergence(Exception):
    pass


def region1(p, T):
    pi = p / 16.53
    tau = 1386.0 / T
    g = gp = gt = gtt = 0.0
    for I, J, n in R1:
        a = (7.1 - pi) ** I
        b = (tau - 1.222) ** J
        g += n * a * b
        gp += -n * I * (7.1 - pi) ** (I - 1) * b
        gt += n * a * J * (tau - 1.222) ** (J - 1)
        gtt += n * a * J * (J - 1) * (tau - 1.222) ** (J - 2)
    return {"v": pi * gp * R * T / p / 1000.0, "h": tau * gt * R * T,
            "u": R * T * (tau * gt - pi * gp), "s": R * (tau * gt - g),
            "cp": -R * tau * tau * gtt}


def region2(p, T):
    pi = p
    tau = 540.0 / T
    go = math.log(pi)
    got = gott = 0.0
    for J, n in R2O:
        go += n * tau ** J
        got += n * J * tau ** (J - 1)
        gott += n * J * (J - 1) * tau ** (J - 2)
    gr = grp = grt = grtt = 0.0
    for I, J, n in R2R:
        a = pi ** I
        b = (tau - 0.5) ** J
        gr += n * a * b
        grp += n * I * pi ** (I - 1) * b
        grt += n * a * J * (tau - 0.5) ** (J - 1)
        grtt += n * a * J * (J - 1) * (tau - 0.5) ** (J - 2)
    gp = 1.0 / pi + grp
    gt = got + grt
    g = go + gr
    return {"v": pi * gp * R * T / p / 1000.0, "h": tau * gt * R * T,
            "u": R * T * (tau * gt - pi * gp), "s": R * (tau * gt - g),
            "cp": -R * tau * tau * (gott + grtt)}


def psat(T):
    th = T + N4[8] / (T - N4[9])
    A = th * th + N4[0] * th + N4[1]
    B = N4[2] * th * th + N4[3] * th + N4[4]
    C = N4[5] * th * th + N4[6] * th + N4[7]
    return (2.0 * C / (-B + math.sqrt(B * B - 4.0 * A * C))) ** 4


def Tsat(p):
    b = p ** 0.25
    E = b * b + N4[2] * b + N4[5]
    F = N4[0] * b * b + N4[3] * b + N4[6]
    G = N4[1] * b * b + N4[4] * b + N4[7]
    D = 2.0 * G / (-F - math.sqrt(F * F - 4.0 * E * G))
    return (N4[9] + D - math.sqrt((N4[9] + D) * (N4[9] + D) - 4.0 * (N4[8] + N4[9] * D))) / 2.0


def b23p(T):
    return B23[0] + B23[1] * T + B23[2] * T * T


def region3(rho, T):
    d = rho / RHOC
    tau = TCRIT / T
    f = R3N1 * math.log(d)
    fd = R3N1 / d
    fdd = -R3N1 / (d * d)
    ft = ftt = fdt = 0.0
    for I, J, n in R3T:
        dI = d ** I
        dI1 = d ** (I - 1)
        tJ = tau ** J
        tJ1 = tau ** (J - 1)
        f += n * dI * tJ
        fd += n * I * dI1 * tJ
        fdd += n * I * (I - 1) * d ** (I - 2) * tJ
        ft += n * dI * J * tJ1
        ftt += n * dI * J * (J - 1) * tau ** (J - 2)
        fdt += n * I * dI1 * J * tJ1
    num = d * fd - d * tau * fdt
    den = 2.0 * d * fd + d * d * fdd
    return {"p": d * fd * R * T * rho / 1000.0, "v": 1.0 / rho, "rho": rho,
            "h": R * T * (tau * ft + d * fd), "u": R * T * tau * ft,
            "s": R * (tau * ft - f), "cv": -R * tau * tau * ftt,
            "cp": R * (-tau * tau * ftt + num * num / den)}


def r3p(rho, T):
    d = rho / RHOC
    tau = TCRIT / T
    fd = R3N1 / d
    for I, J, n in R3T:
        fd += n * I * d ** (I - 1) * tau ** J
    return d * fd * R * T * rho / 1000.0


def r3dpdr(rho, T):
    d = rho / RHOC
    tau = TCRIT / T
    fd = R3N1 / d
    fdd = -R3N1 / (d * d)
    for I, J, n in R3T:
        tJ = tau ** J
        fd += n * I * d ** (I - 1) * tJ
        fdd += n * I * (I - 1) * d ** (I - 2) * tJ
    return R * T * (2.0 * d * fd + d * d * fdd) / 1000.0


R3RLO = 80.0
R3RHI = 800.0
R3NS = 280


def r3brackets(p, T):
    out = []
    rp = R3RLO
    fp = r3p(R3RLO, T) - p
    for i in range(1, R3NS + 1):
        r = R3RLO * (R3RHI / R3RLO) ** (i / R3NS)
        f = r3p(r, T) - p
        if _fin(f) and _fin(fp) and f * fp <= 0.0:
            out.append((rp, r))
        rp = r
        fp = f
    return out


def r3root(br, p, T):
    a, c = br
    fa = r3p(a, T) - p
    for _ in range(90):
        m = 0.5 * (a + c)
        fm = r3p(m, T) - p
        if fa * fm <= 0.0:
            c = m
        else:
            a = m
            fa = fm
        if c - a < 1e-11 * c:
            break
    r = 0.5 * (a + c)
    for _ in range(5):
        dp = r3dpdr(r, T)
        if not _fin(dp) or abs(dp) < 1e-14:
            break
        rn = r - (r3p(r, T) - p) / dp
        if not (a < rn < c):
            break
        dr = abs(rn - r)
        r = rn
        if dr < 1e-13 * r:
            break
    return r


def region3PT(p, T):
    brs = r3brackets(p, T)
    if not brs:
        raise NoConvergence()
    br = brs[-1]
    if len(brs) > 1 and T < TCRIT and p < psat(T):
        br = brs[0]
    return region3(r3root(br, p, T), T)


def sat3rho(T):
    ps = psat(T)
    brs = r3brackets(ps, T)
    if len(brs) < 2:
        return {"f": RHOC, "g": RHOC}
    return {"f": r3root(brs[-1], ps, T), "g": r3root(brs[0], ps, T)}


def region5(p, T):
    pi = p
    tau = 1000.0 / T
    go = math.log(pi)
    got = gott = 0.0
    for J, n in R5O:
        go += n * tau ** J
        got += n * J * tau ** (J - 1)
        gott += n * J * (J - 1) * tau ** (J - 2)
    gr = grp = grt = grtt = 0.0
    for I, J, n in R5R:
        a = pi ** I
        b = tau ** J
        gr += n * a * b
        grp += n * I * pi ** (I - 1) * b
        grt += n * a * J * tau ** (J - 1)
        grtt += n * a * J * (J - 1) * tau ** (J - 2)
    gp = 1.0 / pi + grp
    gt = got + grt
    g = go + gr
    return {"v": pi * gp * R * T / p / 1000.0, "h": tau * gt * R * T,
            "u": R * T * (tau * gt - pi * gp), "s": R * (tau * gt - g),
            "cp": -R * tau * tau * (gott + grtt)}


def propsPT(p, T):
    if not _fin(p) or not _fin(T) or p <= 0.0:
        raise OutOfRange()
    if T < TMIN - 1e-6 or T > T5MAX + 1e-6:
        raise OutOfRange()
    if T <= T2MAX + 1e-9:
        if p > PMAX + 1e-9:
            raise OutOfRange()
        if T <= T13:
            ps = psat(T)
            if p > ps:
                r = region1(p, T)
                r["reg"] = 1
                r["region"] = "compressed_liquid"
                r["x"] = 0.0
            else:
                r = region2(p, T)
                r["reg"] = 2
                r["region"] = "superheated_vapor"
                r["x"] = 1.0
        elif T <= T3MAX:
            if p > b23p(T):
                r = region3PT(p, T)
                r["reg"] = 3
                r["region"] = "region3"
                r["x"] = (0.0 if p > psat(T) else 1.0) if T < TCRIT else None
            else:
                r = region2(p, T)
                r["reg"] = 2
                r["region"] = "supercritical" if (T >= TCRIT and p >= PCRIT) else "superheated_vapor"
                r["x"] = 1.0
        else:
            r = region2(p, T)
            r["reg"] = 2
            r["region"] = "supercritical" if p >= PCRIT else "superheated_vapor"
            r["x"] = 1.0
    else:
        if p > P5MAX + 1e-9:
            raise OutOfRange()
        r = region5(p, T)
        r["reg"] = 5
        r["region"] = "region5"
        r["x"] = None
    if not _fin(r["v"]) or not _fin(r["h"]) or r["v"] <= 0.0:
        raise NoConvergence()
    return r


def tmaxAt(p):
    return T5MAX if p <= P5MAX + 1e-9 else T2MAX


def satProps(T):

    'Flash tank at p_i: x_6 from h_6 = h_5;  m_high/m_evap = 1/(1 - x_6)',
    'Interstage mixing: h_3 = (1 - x_6) h_2 + x_6 h_g(p_i)',
    'w = (h_2 - h_1) + m_high/m_evap (h_4 - h_3),   q_cond = m_high/m_evap (h_4 - h_5)']};
function dgcRecord(){
  if(!lastSol||!lastCfg)return null;
  const c=lastCfg,I=dgcInputs(),O=dgcOutputs();
  const C=constsFor(c.fluid);
  const eq=DGC_EQ.common.concat(c.family==='power'?DGC_EQ.power:DGC_EQ.ref);
  if(c.family==='power'&&c.ptype==='regen')eq.push.apply(eq,DGC_EQ.regen);
  if(c.family==='ref'&&c.comp==='two')eq.push.apply(eq,DGC_EQ.two);
  if(c.family==='ref'&&c.comp==='single'&&c.ihx)eq.push.apply(eq,DGC_EQ.ihx);
  const w=[];
  if(PFAILS>=PFAILMAX)w.push(t('w_isolines'));
  if(CP&&!twoPhaseOK(c.fluid))w.push(t('fn_pseudo'));
  return{
    inputs:I.inputs,outputs:O.outputs,units:Object.assign({},I.units,O.units),
    model:{equations:eq,
      ranges:[FLUID_MAP[c.fluid]+': '+(C.Tmin).toFixed(2)+' K … '+(C.Tmax).toFixed(2)+' K, p up to '+
        (C.Pc*4).toPrecision(3)+' MPa (equation-of-state limits of the property library); '+
        'critical point '+(C.Tc-273.15).toFixed(2)+' °C / '+C.Pc.toPrecision(4)+' MPa',
        'Steady state, no pressure drop in the heat exchangers, no heat loss to ambient, no mechanical or electrical losses; kinetic and potential energy neglected.'],
      notes:[t('prop_lib').replace('%v',CPVER),
        c.fluid==='Water'?'Water/steam through the IAPWS-IF97 backend; refrigerants through the HEOS Helmholtz equations of state.':'HEOS Helmholtz equation of state.',
        'Isentropic efficiencies are prescribed, not derived from machine geometry or a performance map; off-design behaviour is not modelled.']},
    warnings:w};
}
function dgcSections(){
  if(!lastSol)return[];
  const rows=lastSol.pts.map(p=>[p.name+' '+t(p.note),nice(p.p),(p.T-273.15).toFixed(1),p.h.toFixed(1),
    p.s.toFixed(4),(p.v<0.01?p.v.toExponential(3):p.v.toFixed(4)),(p.x==null?'—':p.x<=0?'0':p.x>=1?'1':p.x.toFixed(3))]);
  return[{title:t('pdf_states'),cols:'1.6fr .8fr .8fr .9fr 1fr .9fr .6fr',
    head:[t('th_pt'),t('th_p'),t('th_T'),t('th_h'),t('th_s'),t('th_v'),t('th_x')],rows:rows,
    notes:[t('rep_fluid')+': '+lastCfg.fluid+' — '+t('rep_cycle')+': '+
      (lastCfg.family==='power'?t('fam_power')+' / '+t('ct_'+lastCfg.ptype)
       :t('fam_ref')+' / '+t('cs_'+lastCfg.comp)+(lastCfg.comp==='single'&&lastCfg.ihx?' + SLHX':''))]}];
}
/* Cross-tool handoff: the working-fluid mass flow, the heat rejected in the condenser /
   gas cooler and the state at its outlet — the quantities another tool can actually use.
   Nothing is accepted: the inputs of this page are cycle design parameters, and there is no
   unambiguous single quantity another tool could set. */
function dgcHandoff(){
  if(!lastSol||!lastCfg)return null;
  const c=lastCfg,sol=lastSol,byName=n=>sol.pts.find(p=>p.name===n);
  const out=c.family==='power'?byName('1'):byName(c.comp==='two'?'5':'3');
  if(!out)return null;
  const cards={};sol.metrics.cards.forEach(cd=>cards[cd[0]]=cd);
  let Q=null;
  if(c.family==='power'){const v=parseFloat(cards.c_qout&&cards.c_qout[1]);if(isFinite(v))Q=v*1e6;}
  else{const txt=cards.c_qcond&&cards.c_qcond[1]||'';const v=parseFloat(txt);
    if(isFinite(v))Q=v*(/MW/.test(txt)?1e6:1e3);}
  const q={mdot:{value:(c.family==='power'?c.mdotP:c.mdotR),unit:'kg/s'},
    T:{value:out.T,unit:'K'},p:{value:out.p*1e6,unit:'Pa'},
    h:{value:out.h*1e3,unit:'J/kg'},s:{value:out.s*1e3,unit:'J/(kg.K)'}};
  if(out.x!=null)q.x={value:out.x,unit:'-'};
  if(Q!=null)q.Q={value:Q,unit:'W'};
  return{quantities:q};
}
function dgcInit(){
  if(!window.Diagram)return;
  window.Diagram.init({
    id:'thermodynamiccycles',file:'thermodynamiccycles.html',
    state:{serialize:dgcSerialize,deserialize:dgcDeserialize},
    record:dgcRecord,
    python:dgcPython,
    report:{sections:dgcSections},
    handoff:{provides:['mdot','T','p','h','s','x','Q'],accepts:[],build:dgcHandoff}
  });
}

/* Units live in their own slot, never in the label. The unit symbol is taken
   from the label this tool already ships, so it stays translated (МПа, кг/с). */
const UNIT_OF={pBoiler:'MPa',tSup:'°C',pReheat:'MPa',tReheat:'°C',tCondP:'°C',mdotP:'kg/s',
  tEvap:'°C',tCond:'°C',dSh:'K',dSc:'K',pInter:'MPa',pGC:'MPa',tGC:'°C',mdotR:'kg/s'};
function splitUnit(key){
  const s=t(key),i=s.lastIndexOf(',');
  if(i>0){const tail=s.slice(i+1).trim();
    if(tail&&tail.length<=6&&!/\s/.test(tail))return[s.slice(0,i),tail];}
  return[s,UNIT_OF[key]||''];
}
function labelText(key){return splitUnit(key)[0];}
function unitText(key){return splitUnit(key)[1];}

const NUMF=[];
function num(key,step,extra){
  const d=Object.assign({id:'f-'+key,key:key,type:'number',step:step,
    label:function(){return labelText(key);}},extra||{});
  const u=unitText(key);
  if(u){d.unit=u;d.display=u;}   /* display=unit: identity, and no page-level unit switch */
  NUMF.push(d);
  return d;
}
/* min/max are deliberately NOT declared: this tool refuses an out-of-range value
   with a message (guard()), it does not clamp it — see the manifest limitations. */

const FAM_REF=c=>c.state.family==='ref';

             'Beim Kraftprozess ist die Kennzahl der thermische Wirkungsgrad, Nutzarbeit durch zugeführte Wärme, daneben die Leistungen von Turbine, Kessel und Kondensator. Beim Kälteprozess ist es die Leistungszahl, Nutzwärme durch Verdichterarbeit, erst Kälte, dann Wärme; sie unterscheiden sich um genau eins.',
             'Bij een krachtkringproces is het kengetal het thermisch rendement, nuttige arbeid gedeeld door toegevoerde warmte, met daarnaast de vermogens van turbine, ketel en condensor. Bij een koelkringproces is het de COP, nuttige warmte gedeeld door compressorarbeid; koelen en verwarmen schelen precies één.',
             'Pour un cycle moteur, le chiffre clé est le rendement thermique, travail net divisé par chaleur fournie, avec les puissances de la turbine, de la chaudière et du condenseur. Pour un cycle frigorifique, c’est le COP, chaleur utile divisée par le travail du compresseur ; froid puis chaud, séparés d’exactement une unité.',
             'En un ciclo de potencia la cifra clave es el rendimiento térmico, trabajo neto entre calor aportado, junto a las potencias de turbina, caldera y condensador. En uno frigorífico es el COP, calor útil entre trabajo del compresor; frío y calor difieren exactamente en uno.')}
  },
  tour:[
    {topic:'fluid',focus:'[data-dgu-field="f-fluid"]'},

/* ---- the compute callback: one call into the model, nothing else ---- */
function computeTiles(){
  if(!CP)return null;
  const cfg=readCfg();
  let sol;
  try{sol=solve(cfg);}
  catch(e){clearResults();
    if(ui)ui.setState('error',t('err_calc')+': '+(e.message||e));
    return null;}
  lastSol=sol;lastCfg=cfg;
  fillStates(sol);
  if(stage)stage.schedule();
  return{tiles:sol.metrics.cards.map((c,i)=>({
    label:function(){return t(c[0]);},value:c[1],unit:c[2]||null,
    headline:i<3,learn:CARD_LEARN[c[0]]||null}))};
}
function loadingNode(){
  const box=document.createElement('div');box.className='dgu-empty';
  const a=document.createElement('div');a.textContent=wasmMsg||t('loading1');box.appendChild(a);
  const b=document.createElement('div');b.className='dgu-hint';b.textContent=t('subtitle');box.appendChild(b);
  return box;
}

/* ---- boot: the shell first, the property library second ---- */
function bootUI(){
  if(!window.DiagramUI||DiagramUI.api!=='tools.petrov.re/ui/v1'){legacyBoot();return;}
  refreshUnits();
  ui=DiagramUI.app({
    id:'thermodynamiccycles',mount:'#app',layout:'calculator',compute:'live',
    state:state,defaults:DEFAULTS,lang:LANG,
    subtitle:L('subtitle'),
    learn:LEARN,
    panels:PANELS,
    regions:{
      inputs:function(host,app){app.examples(EXAMPLES);},
      stage:function(host,app){
        app.panel({slot:'stage',id:'axes',
          fields:[{id:'f-axis',key:'axis',type:'segmented',label:L('axes_l'),learn:'axes',
            options:[['Ts',L('ax_Ts')],['hs',L('ax_hs')],['ph',L('ax_ph')],['pv',L('ax_pv')],['Th',L('ax_Th')]]}],
          sync:function(box){let n=box.querySelector('#tc-axhint');
            if(!n){n=document.createElement('div');n.className='dgu-hint';n.id='tc-axhint';box.appendChild(n);}
            n.textContent=t('hint_'+ST().axis)||'';}});
        stage=app.stage({minHeight:320,render:drawStage,a11y:stageAlt});
        stage.canvas();bindCycleDrag(stage);
        /* the picture, as a picture: a stage tool, not a second export bar */
        stage.tools.appendChild(app.actionButton({label:'PNG',title:L('btn_png'),run:exportPng}));
      }
    },
    footer:function(host,app){
      const f=document.createElement('div');f.id='tc-foot';host.appendChild(f);
      const d=document.createElement('details');
      const s=document.createElement('summary');
      s.textContent=P(T('Model, equations and limitations','Модель, рівняння та обмеження',
        'Modell, Gleichungen und Grenzen','Model, vergelijkingen en beperkingen',
        'Modèle, équations et limites','Modelo, ecuaciones y límites'));
      d.appendChild(s);
      const m=(window.Diagram&&Diagram.manifest&&Diagram.manifest())||null;
      if(m&&m.limitations){const p=document.createElement('p');
        p.textContent=DiagramUI.pick(m.limitations,app.lang);d.appendChild(p);}
      const ul=document.createElement('ul');
      DGC_EQ.common.concat(ST().family==='power'?DGC_EQ.power:DGC_EQ.ref).forEach(function(line){
        const li=document.createElement('li');li.textContent=line;ul.appendChild(li);});
      d.appendChild(ul);host.appendChild(d);
      setFoot();
    },
    on:{
      compute:function(){const r=computeTiles();return r||(CP?null:{nodes:[loadingNode()]});},
      lang:function(l){LANG=I18N[l]?l:'en';try{localStorage.setItem('diagram_site_lang',l);localStorage.setItem('diagram_lang',l)}catch(e){}document.documentElement.lang=l;refreshUnits();}
    }
  });
  /* The data layer is not gated on the property library: the bar, the permalink,
     the record and the report exist from the manifest alone (spec v3 section 3). */
  dgcInit();
  if(window.__CP)cpBoot();
  else if(wasmFailed)ui.fail(wasmFailed);
}
function cpBoot(){
  if(!window.__CP)return;
  CP=window.__CP;IP=CP.input_pairs;
  try{CPVER=CP.get_global_param_string('version');}catch(e){CPVER='?';}
  if(ui)ui.ready();
  else if(legacyOn)legacyRun();
  setFoot();
}
window.__tcWasmStep=function(m){wasmMsg=m;if(ui&&!CP)ui.run();};
window.__tcWasmFail=function(msg,detail){
  wasmFailed=msg+(detail?' ('+detail+')':'');
  if(ui)ui.fail(wasmFailed);
  else if(legacyOn){const n=document.getElementById('tc-legacy-msg');if(n)n.textContent=wasmFailed;}
};

/* ---- honest degradation: without diagram-ui.js the tool still computes ----
   Not a second framework: the same field definitions drive a plain form, the
   same drawing code fills a plain canvas, and the shared bar still carries the
   record, the report, the permalink, the CSV, the JSON and the python export. */
let legacyOn=false;
function legacyBoot(){
  legacyOn=true;
  const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const app=document.getElementById('app')||document.body;
  const m=(window.Diagram&&Diagram.manifest&&Diagram.manifest())||null;
  const h=document.createElement('h1');
  h.textContent=(m&&m.title&&(m.title[LANG]||m.title.en))||t('title');
  app.appendChild(h);
  const msg=document.createElement('p');msg.id='tc-legacy-msg';
  msg.textContent=wasmFailed||t('subtitle');app.appendChild(msg);
  const form=document.createElement('div');app.appendChild(form);
  const ctx0={state:state};
  const mk=(d)=>{
    if(d.visible&&!d.visible(ctx0))return;
    const row=document.createElement('p');
    const lab=document.createElement('label');
    lab.textContent=(typeof d.label==='function'?d.label():d.label&&(d.label[LANG]||d.label.en))||d.key;
    lab.htmlFor='lg-'+d.key;row.appendChild(lab);row.appendChild(document.createTextNode(' '));
    let el;
    if(d.type==='select'||d.type==='segmented'){
      el=document.createElement('select');
      (d.options||[]).forEach(o=>{const v=Array.isArray(o)?o[0]:o,tx=Array.isArray(o)?(typeof o[1]==='function'?o[1]():o[1]):o;
        const op=document.createElement('option');op.value=v;op.textContent=tx;el.appendChild(op);});
      el.value=String(state[d.key]);
    }else if(d.type==='toggle'){
      el=document.createElement('input');el.type='checkbox';el.checked=!!state[d.key];
    }else{el=document.createElement('input');el.type='number';el.step=d.step||'any';el.value=state[d.key];}
    el.id='lg-'+d.key;
    el.addEventListener('input',()=>{
      state[d.key]=d.type==='toggle'?el.checked:(el.type==='number'?+el.value:el.value);
      if(d.set)d.set(state[d.key],state);
      legacyRun();legacyForm();});
    el.addEventListener('change',()=>{
      state[d.key]=d.type==='toggle'?el.checked:(el.type==='number'?+el.value:el.value);
      if(d.set)d.set(state[d.key],state);
      legacyRun();legacyForm();});
    row.appendChild(el);form.appendChild(row);
  };
  window.__tcLegacyForm=function(){form.innerHTML='';
    PANELS.forEach(p=>(p.fields||[]).forEach(mk));
    [{id:'f-axis',key:'axis',type:'select',label:L('axes_l'),
      options:[['Ts',L('ax_Ts')],['hs',L('ax_hs')],['ph',L('ax_ph')],['pv',L('ax_pv')],['Th',L('ax_Th')]]}].forEach(mk);};
  const cv=document.createElement('canvas');cv.width=900;cv.height=520;app.appendChild(cv);
  const cards=document.createElement('div');cards.id='tc-legacy-cards';app.appendChild(cards);
  const tbl=document.createElement('table');tbl.id='tc-states';
  tbl.innerHTML='<thead><tr id="tc-states-head"></tr></thead><tbody id="tc-states-body"></tbody>';
  app.appendChild(tbl);
  const foot=document.createElement('div');foot.id='tc-foot';app.appendChild(foot);
  /* a stage-shaped shim so the drawing code is the same code */
  stage={cv:cv,body:app,canvas:function(){const c=cv.getContext('2d');c.setTransform(1,0,0,1,0,0);return c;},
    schedule:function(){drawStage({w:cv.width,h:cv.height,dpr:1,density:cv.width<768?'coarse':'fine'},stage);}};
  window.__tcLegacyCards=function(){
    cards.innerHTML=!lastSol?'':lastSol.metrics.cards.map(c=>'<b>'+E(t(c[0]))+'</b>: '+E(c[1])+' '+E(c[2])+'<br>').join('');};
  legacyForm();
  dgcInit();
  if(window.__CP)cpBoot();else legacyRun();
}
function legacyForm(){if(window.__tcLegacyForm)window.__tcLegacyForm();}
function legacyRun(){
  if(!CP)return;
  const cfg=readCfg();let sol;
  try{sol=solve(cfg);}catch(e){clearResults();
    const n=document.getElementById('tc-legacy-msg');if(n)n.textContent=t('err_calc')+': '+(e.message||e);
    if(window.__tcLegacyCards)window.__tcLegacyCards();return;}
  const n=document.getElementById('tc-legacy-msg');if(n)n.textContent=t('subtitle');
  lastSol=sol;lastCfg=cfg;fillStates(sol);stage.schedule();
  if(window.__tcLegacyCards)window.__tcLegacyCards();
}

/* the bootstrap in <head> has already resolved ?lang= -> localStorage -> browser -> en */
if(I18N[window.__diagramLang])LANG=window.__diagramLang;
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootUI);
else bootUI();
window.addEventListener('cpready',cpBoot);
