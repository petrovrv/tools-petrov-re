  "description": {
    "en": "List the places where drinking water meets another fluid — WCs, showers, a heating fill, a dental chair, a rainwater tank — or load an example, or take the fixture inventory of the project. For each point the tool sets the EN 1717 fluid category, applies the protection matrix together with the site conditions (back-pressure, pressure needed behind the device, hose outlet, drain, mounting height), shows which units are admissible and why the others are not, picks the preferred one with its installation conditions, flags points that need a break tank and booster, and exports the schedule and the maintenance list.",
    "uk": "Внесіть місця, де питна вода зустрічається з іншою рідиною, — унітази, душі, заповнення опалення, стоматологічну установку, резервуар дощової води — або завантажте приклад чи перелік приладів проєкту. Для кожної точки інструмент визначає категорію рідини за EN 1717, застосовує матрицю захисту разом з умовами місця (протитиск, потрібний тиск за пристроєм, шланговий вихід, дренаж, висота монтажу), показує допустимі пристрої і чому інші недопустимі, обирає рекомендований з умовами монтажу, позначає точки, яким потрібні розривний бак і насос, та експортує перелік і план обслуговування.",
    "de": "Erfassen Sie die Stellen, an denen Trinkwasser auf ein anderes Medium trifft — WCs, Duschen, Heizungsfüllung, Dentaleinheit, Regenwassertank —, laden Sie ein Beispiel oder übernehmen Sie das Objektinventar des Projekts. Für jede Stelle setzt das Werkzeug die Flüssigkeitskategorie nach EN 1717, wendet die Schutzmatrix zusammen mit den örtlichen Bedingungen an (Rückdrücken, Druckbedarf hinter der Einrichtung, Schlauchanschluss, Ablauf, Einbauhöhe), zeigt die zulässigen Einrichtungen und warum die anderen nicht zulässig sind, wählt die bevorzugte mit ihren Einbaubedingungen, markiert Stellen mit Vorlagebehälter und Druckerhöhung und exportiert die Liste und den Wartungsplan.",
    "nl": "Geef de plaatsen op waar drinkwater een andere vloeistof raakt — wc’s, douches, een verwarmingsvulling, een tandartsstoel, een regenwaterput — of laad een voorbeeld, of neem de toesteleninventaris van het project. Per punt bepaalt de tool de vloeistofcategorie volgens EN 1717, past de beveiligingsmatrix toe samen met de plaatselijke voorwaarden (terugdrukken, benodigde druk achter de beveiliging, slangaansluiting, afvoer, plaatsingshoogte), toont welke beveiligingen toegelaten zijn en waarom de andere niet, kiest de voorkeursbeveiliging met haar plaatsingsvoorwaarden, markeert punten die een onderbrekingsreservoir en drukverhoging vragen, en exporteert de lijst en het onderhoudsplan.",
    "fr": "Listez les endroits où l’eau potable rencontre un autre fluide — WC, douches, remplissage du chauffage, fauteuil dentaire, citerne d’eau de pluie — ou chargez un exemple, ou reprenez l’inventaire des appareils du projet. Pour chaque point l’outil fixe la catégorie de fluide EN 1717, applique la matrice de protection avec les conditions du site (contre-pression, pression nécessaire en aval, raccord de tuyau, évacuation, hauteur de pose), montre les dispositifs admis et pourquoi les autres ne le sont pas, choisit le préféré avec ses conditions de pose, signale les points nécessitant une bâche et un surpresseur, et exporte la liste et le plan d’entretien.",
    "es": "Liste los lugares donde el agua potable se encuentra con otro fluido — inodoros, duchas, el llenado de calefacción, un sillón dental, un depósito de lluvia — o cargue un ejemplo, o tome el inventario de aparatos del proyecto. Para cada punto la herramienta fija la categoría de fluido EN 1717, aplica la matriz de protección junto con las condiciones del lugar (contrapresión, presión necesaria tras el dispositivo, salida de manguera, desagüe, altura de montaje), muestra los dispositivos admisibles y por qué los demás no, elige el preferido con sus condiciones de instalación, señala los puntos que necesitan depósito de rotura y grupo de presión, y exporta la lista y el plan de mantenimiento.",
    "pl": "Wpisz miejsca, w których woda pitna styka się z innym płynem — WC, prysznice, napełnianie ogrzewania, unit stomatologiczny, zbiornik deszczówki — albo wczytaj przykład lub inwentarz przyborów projektu. Dla każdego punktu narzędzie ustala kategorię płynu wg EN 1717, stosuje macierz zabezpieczeń wraz z warunkami miejsca (przeciwciśnienie, wymagane ciśnienie za zabezpieczeniem, przyłącze węża, odpływ, wysokość montażu), pokazuje dopuszczalne zabezpieczenia i dlaczego inne nie są, wybiera preferowane z warunkami montażu, oznacza punkty wymagające zbiornika przerywającego i pompy oraz eksportuje zestawienie i plan konserwacji."

  'n.airgap_basis': T7('Air gap size: EN 1717 asks for three times the inlet bore, DIN 1988-4 for twice the bore and at least 20 mm (Resideo EN 1717 brochure p. 34); this tool takes the stricter of both, max(3·d, 20 mm). Check the product standard of the air gap (EN 13076 for AA) and the national rule.', 'Розмір розриву: EN 1717 вимагає трикратного внутрішнього діаметра входу, DIN 1988-4 — дворазового і щонайменше 20 мм (брошура Resideo EN 1717, с. 34); інструмент бере суворіше з двох, max(3·d, 20 мм). Перевірте стандарт виробу (EN 13076 для AA) і національне правило.', 'Abstand des freien Auslaufs: EN 1717 verlangt das Dreifache des Zulaufinnendurchmessers, DIN 1988-4 das Zweifache und mindestens 20 mm (Resideo-Broschüre EN 1717, S. 34); dieses Werkzeug nimmt das Strengere, max(3·d, 20 mm). Produktnorm (EN 13076 für AA) und nationale Regel prüfen.', 'Grootte van de vrije uitloop: EN 1717 vraagt driemaal de binnendiameter van de toevoer, DIN 1988-4 tweemaal en minstens 20 mm (Resideo-brochure EN 1717, p. 34); deze tool neemt de strengste van beide, max(3·d, 20 mm). Controleer de productnorm (EN 13076 voor AA) en de nationale regel.', 'Hauteur de la garde d’air : EN 1717 demande trois fois le diamètre intérieur d’alimentation, la DIN 1988-4 deux fois et au moins 20 mm (brochure Resideo EN 1717, p. 34) ; l’outil retient la plus sévère, max(3·d, 20 mm). Vérifiez la norme produit (EN 13076 pour AA) et la règle nationale.', 'Tamaño de la separación: EN 1717 pide tres veces el diámetro interior de entrada, DIN 1988-4 dos veces y al menos 20 mm (folleto Resideo EN 1717, p. 34); la herramienta toma la más estricta, max(3·d, 20 mm). Compruebe la norma del producto (EN 13076 para AA) y la regla nacional.', 'Wielkość przerwy: EN 1717 wymaga trzykrotności średnicy wewnętrznej dopływu, DIN 1988-4 dwukrotności i co najmniej 20 mm (broszura Resideo EN 1717, s. 34); narzędzie bierze ostrzejszą z nich, max(3·d, 20 mm). Sprawdź normę wyrobu (EN 13076 dla AA) i przepis krajowy.'),
  'fl.air_gap_insufficient': T7('%s: the height entered (%h mm) is below the air gap required for %g (%v mm = max(3 × inlet bore, 20 mm)) — the air gap as installed does not protect and is not counted as built-in. Raise the outlet or the overflow, or use the device shown.', '%s: введена висота (%h мм) менша за розрив, потрібний для %g (%v мм = max(3 × внутрішній діаметр входу, 20 мм)), — розрив у такому монтажі не захищає і не зараховується як вбудований. Підніміть вихід чи перелив або застосуйте показаний пристрій.', '%s: die eingegebene Höhe (%h mm) liegt unter dem für %g erforderlichen Abstand (%v mm = max(3 × Zulaufinnendurchmesser, 20 mm)) — der freie Auslauf schützt so eingebaut nicht und zählt nicht als integriert. Auslauf oder Überlauf höher setzen oder die angezeigte Einrichtung verwenden.', '%s: de ingevoerde hoogte (%h mm) ligt onder de afstand die %g vraagt (%v mm = max(3 × binnendiameter toevoer, 20 mm)) — de vrije uitloop beschermt zo niet en telt niet als ingebouwd. Verhoog de uitloop of de overloop, of gebruik de getoonde beveiliging.', '%s : la hauteur saisie (%h mm) est inférieure à la garde d’air requise pour %g (%v mm = max(3 × diamètre intérieur d’arrivée, 20 mm)) — la garde d’air telle qu’installée ne protège pas et n’est pas comptée comme intégrée. Remontez l’arrivée ou le trop-plein, ou utilisez le dispositif indiqué.', '%s: la altura introducida (%h mm) es menor que la separación exigida para %g (%v mm = max(3 × diámetro interior de entrada, 20 mm)): la separación tal como está instalada no protege y no cuenta como integrada. Eleve la salida o el rebosadero, o use el dispositivo indicado.', '%s: podana wysokość (%h mm) jest mniejsza od przerwy wymaganej dla %g (%v mm = max(3 × średnica wewnętrzna wlotu, 20 mm)) — przerwa w takim montażu nie chroni i nie jest liczona jako wbudowana. Podnieś wylot lub przelew albo zastosuj wskazane zabezpieczenie.'),

function curLang() { return (window.DiagramUI && DiagramUI.current && DiagramUI.current.lang) || document.documentElement.lang || 'en'; }
function tx(k) { return I18N[k] || { en: k }; }
function pick(o) { var l = curLang(); return (o && o[l]) || (o && o.en) || String(o == null ? '' : o); }
function S(k, subs) { var s = pick(tx(k)); if (subs) Object.keys(subs).sort(function (a, b) { return b.length - a.length; }).forEach(function (p) { s = s.split('%' + p).join(subs[p]); }); return s; }
function fmt(v, p) {

  if (window.DiagramUI && DiagramUI.fmt) return DiagramUI.fmt(v, { precision: p });
  return Number(v).toFixed(p);
}

        '1 — сама питна вода. 2 — ще нешкідлива, але змінена: нагріта, охолоджена, кава. 3 — містить менш токсичні речовини (миючий засіб, вода опалення, побутова ванна). 4 — токсичні, канцерогенні чи радіоактивні речовини (гальванічні ванни, лабораторні реактиви). 5 — може нести збудники (унітаз, дощова вода, басейн, стоматологічна установка). Запитання йдуть від 5 донизу: перше «так» вирішує, а «не впевнений» — це «так».',
        '1 ist Trinkwasser selbst. 2 ist noch harmlos, aber verändert — erwärmt, gekühlt, Kaffee. 3 enthält weniger giftige Stoffe (Reinigungsmittel, Heizungswasser, häusliches Bad). 4 enthält giftige, krebserzeugende oder radioaktive Stoffe (Galvanik, Laborchemikalien). 5 kann Krankheitserreger tragen (WC, Regenwasser, Schwimmbad, Dentaleinheit). Die Fragen gehen von 5 abwärts: das erste „ja“ entscheidet, und „unsicher“ ist ein Ja.',
        '1 is drinkwater zelf. 2 is nog onschadelijk maar veranderd — verwarmd, gekoeld, koffie. 3 bevat minder giftige stoffen (reinigingsmiddel, verwarmingswater, huishoudelijk bad). 4 bevat giftige, kankerverwekkende of radioactieve stoffen (galvanische baden, labochemicaliën). 5 kan ziekteverwekkers dragen (wc, regenwater, zwembad, tandartsstoel). De vragen gaan van 5 naar beneden: het eerste “ja” beslist, en “niet zeker” is een ja.',
        '1 est l’eau potable elle-même. 2 reste inoffensive mais modifiée — chauffée, refroidie, café. 3 contient des substances peu toxiques (détergent, eau de chauffage, bain domestique). 4 contient des substances toxiques, cancérogènes ou radioactives (bains galvaniques, réactifs). 5 peut porter des pathogènes (WC, eau de pluie, piscine, fauteuil dentaire). Les questions descendent depuis 5 : le premier « oui » décide, et « pas sûr » vaut oui.',
        '1 es el agua potable misma. 2 sigue siendo inocua pero cambiada: calentada, enfriada, café. 3 contiene sustancias poco tóxicas (detergente, agua de calefacción, bañera doméstica). 4 contiene sustancias tóxicas, cancerígenas o radiactivas (baños galvánicos, reactivos). 5 puede llevar patógenos (inodoro, agua de lluvia, piscina, sillón dental). Las preguntas bajan desde 5: el primer «sí» decide y «no seguro» es un sí.',
        '1 to sama woda pitna. 2 jest nadal nieszkodliwa, ale zmieniona — podgrzana, schłodzona, kawa. 3 zawiera mniej toksyczne substancje (detergent, woda grzewcza, domowa wanna). 4 zawiera substancje toksyczne, rakotwórcze lub radioaktywne (galwanizernie, odczynniki). 5 może przenosić patogeny (WC, deszczówka, basen, unit stomatologiczny). Pytania idą od 5 w dół: pierwsze „tak” rozstrzyga, a „nie wiem” to tak.') },
    matrix: { title: T7('Reading the matrix', 'Як читати матрицю', 'Die Matrix lesen', 'De matrix lezen', 'Lire la matrice', 'Leer la matriz', 'Jak czytać macierz'),
      body: T7('Each unit has one cell per category. X: it stops both back-siphonage (suction when the mains pressure drops) and back-pressure (the other side pushes harder). o: suction only — fine for an open basin, useless behind a pump or a boiler. –: not good enough for that category. Only air gaps (AA, AB, AD) and the pipe interrupter DC reach category 5; BA stops at 4, CA and GA at 3, check valves EA/EC at 2.',
        'Кожен пристрій має одну клітинку на категорію. X: зупиняє і зворотне всмоктування (коли тиск у мережі падає), і протитиск (інша сторона тисне сильніше). o: лише всмоктування — годиться для відкритої чаші, марний за насосом чи котлом. –: недостатній для цієї категорії. Категорії 5 досягають лише розриви струменя (AA, AB, AD) і переривник DC; BA — до 4, CA і GA — до 3, зворотні клапани EA/EC — до 2.',
        'Jede Einrichtung hat eine Zelle je Kategorie. X: sie verhindert Rücksaugen (Sog bei Druckabfall im Netz) und Rückdrücken (die andere Seite drückt stärker). o: nur Rücksaugen — gut für ein offenes Becken, nutzlos hinter einer Pumpe oder einem Kessel. –: für diese Kategorie nicht ausreichend. Nur freie Ausläufe (AA, AB, AD) und der Rohrunterbrecher DC erreichen Kategorie 5; BA endet bei 4, CA und GA bei 3, Rückflussverhinderer EA/EC bei 2.',
        'Elke beveiliging heeft één cel per categorie. X: ze stopt zowel terugzuigen (zuiging als de netdruk wegvalt) als terugdrukken (de andere kant duwt harder). o: alleen terugzuigen — goed voor een open bak, nutteloos achter een pomp of ketel. –: niet goed genoeg voor die categorie. Alleen vrije uitlopen (AA, AB, AD) en de leidingonderbreker DC halen categorie 5; BA stopt bij 4, CA en GA bij 3, keerkleppen EA/EC bij 2.',
        'Chaque dispositif a une case par catégorie. X : il arrête le siphonnage (aspiration quand la pression du réseau chute) et la contre-pression (l’autre côté pousse plus fort). o : siphonnage seulement — bien pour un bac ouvert, inutile derrière une pompe ou une chaudière. – : insuffisant pour cette catégorie. Seules les surverses (AA, AB, AD) et le disconnecteur DC atteignent la catégorie 5 ; BA s’arrête à 4, CA et GA à 3, les clapets EA/EC à 2.',
        'Cada dispositivo tiene una celda por categoría. X: detiene el sifonamiento (succión cuando cae la presión de red) y la contrapresión (el otro lado empuja más). o: solo sifonamiento — vale para una pila abierta, inútil tras una bomba o una caldera. –: insuficiente para esa categoría. Solo las descargas libres (AA, AB, AD) y el interruptor DC llegan a la categoría 5; BA llega a 4, CA y GA a 3, las antirretorno EA/EC a 2.',
        'Każde zabezpieczenie ma jedną komórkę na kategorię. X: zatrzymuje zasysanie (podciśnienie przy spadku ciśnienia w sieci) i przeciwciśnienie (druga strona napiera mocniej). o: tylko zasysanie — dobre dla otwartej misy, bezużyteczne za pompą lub kotłem. –: niewystarczające dla tej kategorii. Kategorię 5 osiągają tylko przerwy powietrzne (AA, AB, AD) i przerywacz DC; BA kończy na 4, CA i GA na 3, zawory zwrotne EA/EC na 2.') },
    conditions: { title: T7('Back-pressure, pressure, hose, drain, height', 'Протитиск, тиск, шланг, дренаж, висота', 'Rückdrücken, Druck, Schlauch, Ablauf, Höhe', 'Terugdrukken, druk, slang, afvoer, hoogte', 'Contre-pression, pression, tuyau, évacuation, hauteur', 'Contrapresión, presión, manguera, desagüe, altura', 'Przeciwciśnienie, ciśnienie, wąż, odpływ, wysokość'),
      body: T7('The site decides as much as the fluid. Back-pressure possible (pump, heating, pressurised machine) → every “o” unit drops out. The appliance needs pressure → pipe interrupters DB/DC drop out (they only work before a short open outlet) and an air gap needs a break tank with a booster. H-units are for hose outlets only. BA, CA, GA and GB discharge water and need a drain. DB and DC must sit more than 150 mm, HA 200 mm, HB and HD 250 mm above the highest possible water level.',
        'Місце вирішує не менше, ніж рідина. Можливий протитиск (насос, опалення, машина під тиском) → усі пристрої «o» відпадають. Приладу потрібен тиск → переривники DB/DC відпадають (вони працюють лише перед коротким відкритим виходом), а розриву струменя потрібен бак із насосом. Пристрої H — лише для шлангових виходів. BA, CA, GA і GB скидають воду й потребують дренажу. DB і DC мають бути вище ніж 150 мм, HA — 200 мм, HB і HD — 250 мм над найвищим можливим рівнем води.',
        'Der Ort entscheidet so viel wie das Medium. Rückdrücken möglich (Pumpe, Heizung, Maschine unter Druck) → alle „o“-Einrichtungen fallen weg. Das Gerät braucht Druck → Rohrunterbrecher DB/DC fallen weg (sie wirken nur vor einem kurzen offenen Auslauf) und ein freier Auslauf braucht einen Vorlagebehälter mit Druckerhöhung. H-Einrichtungen nur für Schlauchanschlüsse. BA, CA, GA und GB leiten Wasser ab und brauchen einen Ablauf. DB und DC müssen mehr als 150 mm, HA 200 mm, HB und HD 250 mm über dem höchstmöglichen Wasserspiegel sitzen.',
        'De plaats beslist evenveel als de vloeistof. Terugdrukken mogelijk (pomp, verwarming, machine onder druk) → alle “o”-beveiligingen vallen weg. Het toestel heeft druk nodig → leidingonderbrekers DB/DC vallen weg (ze werken alleen vóór een korte open uitloop) en een vrije uitloop vraagt een onderbrekingsreservoir met drukverhoging. H-beveiligingen alleen voor slangaansluitingen. BA, CA, GA en GB lozen water en vragen een afvoer. DB en DC moeten meer dan 150 mm, HA 200 mm, HB en HD 250 mm boven het hoogst mogelijke waterniveau zitten.',
        'Le site compte autant que le fluide. Contre-pression possible (pompe, chauffage, machine sous pression) → tous les dispositifs « o » tombent. L’appareil a besoin de pression → les disconnecteurs DB/DC tombent (ils ne fonctionnent qu’avant une sortie libre courte) et une surverse exige une bâche avec surpresseur. Les dispositifs H ne servent qu’aux raccords de tuyau. BA, CA, GA et GB rejettent de l’eau et exigent une évacuation. DB et DC doivent être à plus de 150 mm, HA 200 mm, HB et HD 250 mm au-dessus du niveau d’eau le plus haut possible.',
        'El lugar decide tanto como el fluido. Contrapresión posible (bomba, calefacción, máquina a presión) → caen todos los dispositivos «o». El aparato necesita presión → caen los interruptores DB/DC (solo funcionan antes de una salida abierta corta) y una descarga libre necesita depósito de rotura con grupo de presión. Los dispositivos H son solo para salidas de manguera. BA, CA, GA y GB descargan agua y necesitan desagüe. DB y DC deben quedar a más de 150 mm, HA 200 mm, HB y HD 250 mm sobre el nivel de agua más alto posible.',
        'Miejsce decyduje tyle samo co płyn. Możliwe przeciwciśnienie (pompa, ogrzewanie, maszyna pod ciśnieniem) → odpadają wszystkie zabezpieczenia „o”. Urządzenie potrzebuje ciśnienia → odpadają przerywacze DB/DC (działają tylko przed krótkim otwartym wylotem), a przerwa powietrzna wymaga zbiornika z pompą. Zabezpieczenia H tylko do przyłączy węża. BA, CA, GA i GB odprowadzają wodę i wymagają odpływu. DB i DC muszą być wyżej niż 150 mm, HA 200 mm, HB i HD 250 mm nad najwyższym możliwym poziomem wody.') },
    airgap: { title: T7('Air gaps and break tanks', 'Розриви струменя і розривні баки', 'Freie Ausläufe und Vorlagebehälter', 'Vrije uitlopen en onderbrekingsreservoirs', 'Surverses et bâches de disconnexion', 'Descargas libres y depósitos de rotura', 'Przerwy powietrzne i zbiorniki przerywające'),
      body: T7('An air gap is the only protection with no moving parts: water falls freely into a vessel, so nothing can be sucked or pushed back. The gap must be at least three times the inlet bore (EN 1717 as reproduced; this tool also keeps 20 mm as a floor). It also throws away the mains pressure — an appliance that needs pressure gets a break tank and a pump (plbbooster). Many fixtures already have one built in: the float valve of a WC cistern, a fixed tap spout above the rim, the inlet of a certified washing machine. If you enter the height and it is below the required gap, the built-in air gap does not count: the point is flagged and another device is proposed.',
        'Розрив струменя — єдиний захист без рухомих частин: вода вільно падає в посудину, тож нічого не всмоктується і не протискається назад. Розрив має бути щонайменше втричі більшим за внутрішній діаметр входу (EN 1717 у відтворенні; інструмент також тримає мінімум 20 мм). Він же знімає тиск мережі — приладу, якому потрібен тиск, ставлять розривний бак і насос (plbbooster). Багато приладів уже мають вбудований розрив: поплавковий клапан бачка, нерухомий злив над бортом, вхід сертифікованої пральної машини. Якщо ви ввели висоту і вона менша за потрібний розрив, вбудований розрив не зараховується: точку позначено, запропоновано інший пристрій.',
        'Ein freier Auslauf ist die einzige Sicherung ohne bewegliche Teile: Das Wasser fällt frei in einen Behälter, nichts kann zurückgesaugt oder -gedrückt werden. Der Abstand muss mindestens das Dreifache des Zulaufinnendurchmessers betragen (EN 1717 in der Wiedergabe; dieses Werkzeug hält zusätzlich 20 mm als Untergrenze). Er vernichtet aber auch den Netzdruck — ein Gerät, das Druck braucht, bekommt Vorlagebehälter und Pumpe (plbbooster). Viele Objekte haben ihn schon eingebaut: das Füllventil des Spülkastens, der feste Auslauf über dem Beckenrand, der Zulauf einer zertifizierten Waschmaschine. Ist die eingegebene Höhe kleiner als der erforderliche Abstand, zählt der eingebaute freie Auslauf nicht: Die Stelle wird markiert und eine andere Einrichtung vorgeschlagen.',
        'Een vrije uitloop is de enige beveiliging zonder bewegende delen: het water valt vrij in een reservoir, niets kan teruggezogen of -geduwd worden. De afstand is minstens driemaal de binnendiameter van de toevoer (EN 1717 zoals weergegeven; deze tool houdt ook 20 mm als ondergrens). Hij vernietigt wel de netdruk — een toestel dat druk vraagt krijgt een onderbrekingsreservoir en een pomp (plbbooster). Veel toestellen hebben er al één ingebouwd: de vlotterkraan van een wc-reservoir, een vaste kraanuitloop boven de rand, de toevoer van een gecertificeerde wasmachine. Is de ingevoerde hoogte kleiner dan de vereiste afstand, dan telt de ingebouwde vrije uitloop niet: het punt wordt gemarkeerd en een andere beveiliging voorgesteld.',
        'La surverse est la seule protection sans pièce mobile : l’eau tombe librement dans un réservoir, rien ne peut être aspiré ni repoussé. La garde d’air vaut au moins trois fois le diamètre intérieur d’alimentation (EN 1717 telle que reproduite ; l’outil garde aussi 20 mm minimum). Elle supprime aussi la pression du réseau — un appareil qui en a besoin reçoit une bâche et une pompe (plbbooster). Beaucoup d’appareils l’intègrent déjà : robinet flotteur du réservoir de WC, bec fixe au-dessus du bord, alimentation d’un lave-linge certifié. Si la hauteur saisie est inférieure à la garde requise, la garde d’air intégrée ne compte pas : le point est signalé et un autre dispositif est proposé.',
        'La descarga libre es la única protección sin piezas móviles: el agua cae libremente a un recipiente y nada puede ser aspirado ni empujado de vuelta. La separación debe ser al menos tres veces el diámetro interior de entrada (EN 1717 según la reproducción; la herramienta mantiene además 20 mm como mínimo). También elimina la presión de red: un aparato que la necesita lleva depósito de rotura y bomba (plbbooster). Muchos aparatos ya la integran: la válvula de flotador de la cisterna, el caño fijo sobre el borde, la entrada de una lavadora certificada. Si la altura introducida es menor que la separación exigida, la separación integrada no cuenta: el punto se marca y se propone otro dispositivo.',
        'Przerwa powietrzna to jedyne zabezpieczenie bez części ruchomych: woda swobodnie spada do zbiornika, nic nie może zostać zassane ani wepchnięte z powrotem. Przerwa musi wynosić co najmniej trzykrotność średnicy wewnętrznej dopływu (EN 1717 w reprodukcji; narzędzie trzyma też minimum 20 mm). Odbiera jednak ciśnienie sieci — urządzenie, które go potrzebuje, dostaje zbiornik i pompę (plbbooster). Wiele przyborów ma ją wbudowaną: zawór pływakowy spłuczki, stała wylewka nad krawędzią, dopływ certyfikowanej pralki. Jeśli podana wysokość jest mniejsza od wymaganej przerwy, wbudowana przerwa się nie liczy: punkt jest oznaczony i proponowane jest inne zabezpieczenie.') },
    devices: { title: T7('The devices: BA, CA, GA/GB, EA, DC, HD', 'Пристрої: BA, CA, GA/GB, EA, DC, HD', 'Die Einrichtungen: BA, CA, GA/GB, EA, DC, HD', 'De beveiligingen: BA, CA, GA/GB, EA, DC, HD', 'Les dispositifs : BA, CA, GA/GB, EA, DC, HD', 'Los dispositivos: BA, CA, GA/GB, EA, DC, HD', 'Zabezpieczenia: BA, CA, GA/GB, EA, DC, HD'),
      body: T7('BA (reduced-pressure zone): three chambers; the middle one empties to a drain as soon as the differential falls to about 0.14 bar — up to category 4, testable, needs a drain, frost protection and a yearly test. CA: the same idea without test ports — up to 3. GA/GB: mechanical disconnectors that open the line to atmosphere — 3 and 4. EA/EC: check valves — 2 only (a water heater inlet). DC: a pipe with permanent vents above the bowl — cheap and safe up to 5, but only against suction and only before an open outlet (flush valves). HD: hose anti-vacuum valve plus check valve — the usual minimum for hand showers and garden taps (3 without back-pressure).',
        'BA (зона зниженого тиску): три камери; середня спорожнюється в дренаж, щойно перепад падає приблизно до 0,14 бар, — до категорії 4, з контролем, потрібні дренаж, захист від морозу і щорічна перевірка. CA — та сама ідея без контрольних штуцерів — до 3. GA/GB — механічні роз’єднувачі, що відкривають лінію в атмосферу, — 3 і 4. EA/EC — зворотні клапани — лише 2 (вхід водонагрівача). DC — труба з постійними отворами над чашею: дешево й надійно до 5, але лише від всмоктування й тільки перед відкритим виходом (змивні крани). HD — шланговий антивакуумний клапан зі зворотним клапаном — звичний мінімум для ручних душів і садових кранів (3 без протитиску).',
        'BA (Systemtrenner mit Mitteldruckzone): drei Kammern; die mittlere entleert sich in den Ablauf, sobald die Druckdifferenz auf etwa 0,14 bar fällt — bis Kategorie 4, prüfbar, braucht Ablauf, Frostschutz und jährliche Prüfung. CA: dasselbe Prinzip ohne Prüfstutzen — bis 3. GA/GB: Rohrtrenner, die die Leitung zur Atmosphäre öffnen — 3 und 4. EA/EC: Rückflussverhinderer — nur 2 (Zulauf eines Speichers). DC: Rohrstück mit ständigen Lüftungsöffnungen über dem Becken — billig und sicher bis 5, aber nur gegen Rücksaugen und nur vor offenem Auslauf (Druckspüler). HD: Schlauch-Rohrbelüfter mit Rückflussverhinderer — das übliche Minimum für Handbrausen und Gartenventile (3 ohne Rückdrücken).',
        'BA (middendrukzone): drie kamers; de middelste loopt leeg naar een afvoer zodra het drukverschil tot ongeveer 0,14 bar daalt — tot categorie 4, controleerbaar, vraagt afvoer, vorstbescherming en een jaarlijkse test. CA: hetzelfde zonder testaansluitingen — tot 3. GA/GB: mechanische scheiders die de leiding naar de atmosfeer openen — 3 en 4. EA/EC: keerkleppen — alleen 2 (toevoer van een boiler). DC: een buisstuk met permanente openingen boven de pot — goedkoop en veilig tot 5, maar alleen tegen terugzuigen en alleen vóór een open uitloop (drukspoelers). HD: slangbeluchter met keerklep — het gebruikelijke minimum voor handdouches en tuinkranen (3 zonder terugdrukken).',
        'BA (zone de pression réduite) : trois chambres ; celle du milieu se vide à l’égout dès que l’écart tombe à environ 0,14 bar — jusqu’à la catégorie 4, contrôlable, exige évacuation, mise hors gel et test annuel. CA : même principe sans prises de test — jusqu’à 3. GA/GB : disjoncteurs mécaniques qui ouvrent la conduite à l’air — 3 et 4. EA/EC : clapets anti-retour — 2 seulement (entrée d’un chauffe-eau). DC : un tube à évents permanents au-dessus de la cuvette — bon marché et sûr jusqu’à 5, mais contre le siphonnage seul et seulement avant une sortie libre (robinets de chasse). HD : casse-vide de tuyau avec clapet — le minimum habituel des douchettes et robinets de jardin (3 sans contre-pression).',
        'BA (zona de presión reducida): tres cámaras; la central se vacía al desagüe en cuanto la diferencia baja a unos 0,14 bar — hasta categoría 4, comprobable, necesita desagüe, protección antiheladas y prueba anual. CA: la misma idea sin tomas de prueba — hasta 3. GA/GB: desconectores mecánicos que abren la tubería a la atmósfera — 3 y 4. EA/EC: válvulas antirretorno — solo 2 (entrada de un calentador). DC: un tubo con aberturas permanentes sobre la taza — barato y seguro hasta 5, pero solo contra el sifonamiento y solo antes de una salida abierta (fluxores). HD: antivacío de manguera con antirretorno — el mínimo habitual de teléfonos de ducha y grifos de jardín (3 sin contrapresión).',
        'BA (strefa obniżonego ciśnienia): trzy komory; środkowa opróżnia się do odpływu, gdy różnica spadnie do ok. 0,14 bar — do kategorii 4, z kontrolą, wymaga odpływu, ochrony przed mrozem i corocznego testu. CA: ta sama zasada bez króćców kontrolnych — do 3. GA/GB: rozdzielacze mechaniczne otwierające przewód do atmosfery — 3 i 4. EA/EC: zawory zwrotne — tylko 2 (wlot podgrzewacza). DC: odcinek rury ze stałymi otworami nad misą — tani i pewny do 5, ale tylko przed zasysaniem i tylko przed otwartym wylotem (zawory spłukujące). HD: napowietrzacz węża z zaworem zwrotnym — zwykłe minimum dla słuchawek prysznicowych i kranów ogrodowych (3 bez przeciwciśnienia).') },
    upkeep: { title: T7('Maintenance and local rules', 'Обслуговування і місцеві правила', 'Wartung und örtliche Regeln', 'Onderhoud en lokale regels', 'Entretien et règles locales', 'Mantenimiento y normas locales', 'Konserwacja i przepisy lokalne'),
      body: T7('A protection unit that nobody checks protects nothing. The tool lists an inspection interval per installed device (EN 806-5:2012 Table A.1: AA, AB, AD, BA, CA, DC, GA, GB every 6 months, the others yearly; routine maintenance yearly for BA, CA, DA, EA, EC, GA, GB, HA, HB, HD, LA, LB; EB and ED replaced every 10 years; national rules come first) and exports them as a maintenance CSV. Devices built into fixtures (cistern, tap, certified appliance) are counted but get no separate task. In Belgium the Belgaqua technical prescriptions (TVBI/PTI) apply EN 1717, and the keuring of a new connection or of a rainwater installation looks for exactly these devices. Where Table A.1 gives one frequency across the inspection and maintenance columns (e.g. AA, AB, AC, AD, AF, AG, DB, DC, HC), the visit is inspection and routine maintenance together; checks per year count visits (maintenance done on an inspection visit is not counted twice, replacements are not visits).',
        'Пристрій захисту, який ніхто не перевіряє, нічого не захищає. Інструмент дає інтервал огляду для кожного встановленого пристрою (EN 806-5:2012, табл. A.1: AA, AB, AD, BA, CA, DC, GA, GB — кожні 6 місяців, інші — щороку; планове обслуговування щороку для BA, CA, DA, EA, EC, GA, GB, HA, HB, HD, LA, LB; EB і ED замінюють кожні 10 років; національні правила мають перевагу) і експортує їх як CSV обслуговування. Пристрої, вбудовані в прилади (бачок, змішувач, сертифікований прилад), рахуються, але окремих завдань не мають. У Бельгії технічні приписи Belgaqua (TVBI/PTI) застосовують EN 1717, а keuring нового підключення чи установки дощової води шукає саме ці пристрої. Якщо в табл. A.1 одна частота охоплює стовпці огляду й обслуговування (напр. AA, AB, AC, AD, AF, AG, DB, DC, HC), відвідування — це огляд разом із плановим обслуговуванням; перевірки на рік рахують відвідування (обслуговування під час огляду не рахується двічі, заміни не є відвідуваннями).',
        'Eine Sicherungseinrichtung, die niemand prüft, schützt nichts. Das Werkzeug nennt je eingebauter Einrichtung ein Inspektionsintervall (EN 806-5:2012 Tabelle A.1: AA, AB, AD, BA, CA, DC, GA, GB alle 6 Monate, die übrigen jährlich; Wartung jährlich für BA, CA, DA, EA, EC, GA, GB, HA, HB, HD, LA, LB; EB und ED alle 10 Jahre austauschen; nationale Vorgaben gehen vor) und exportiert sie als Wartungs-CSV. In Objekte eingebaute Einrichtungen (Spülkasten, Armatur, zertifiziertes Gerät) werden gezählt, bekommen aber keine eigene Aufgabe. In Belgien wenden die technischen Vorschriften von Belgaqua (TVBI/PTI) EN 1717 an, und die Keuring eines neuen Anschlusses oder einer Regenwasseranlage sucht genau diese Einrichtungen. Wo Tabelle A.1 eine Frequenz über die Spalten Inspektion und Wartung angibt (z. B. AA, AB, AC, AD, AF, AG, DB, DC, HC), ist der Termin Inspektion und Wartung zusammen; Prüfungen pro Jahr zählen Termine (Wartung bei einer Inspektion wird nicht doppelt gezählt, Austausch ist kein Termin).',
        'Een beveiliging die niemand controleert, beschermt niets. De tool geeft per geplaatste beveiliging een inspectie-interval (EN 806-5:2012 tabel A.1: AA, AB, AD, BA, CA, DC, GA, GB elke 6 maanden, de rest jaarlijks; onderhoud jaarlijks voor BA, CA, DA, EA, EC, GA, GB, HA, HB, HD, LA, LB; EB en ED elke 10 jaar vervangen; nationale regels gaan voor) en exporteert ze als onderhouds-CSV. Beveiligingen die in toestellen zitten (reservoir, kraan, gecertificeerd toestel) worden geteld maar krijgen geen eigen taak. In België passen de technische voorschriften van Belgaqua (TVBI/PTI) EN 1717 toe, en de keuring van een nieuwe aansluiting of van een regenwaterinstallatie zoekt precies deze beveiligingen. Waar tabel A.1 één frequentie over de kolommen inspectie en onderhoud geeft (bv. AA, AB, AC, AD, AF, AG, DB, DC, HC), is het bezoek inspectie en routineonderhoud samen; controles per jaar tellen bezoeken (onderhoud tijdens een inspectie telt niet dubbel, vervanging is geen bezoek).',
        'Un dispositif que personne ne contrôle ne protège rien. L’outil donne un intervalle d’inspection par dispositif posé (EN 806-5:2012 tableau A.1 : AA, AB, AD, BA, CA, DC, GA, GB tous les 6 mois, les autres chaque année ; entretien annuel pour BA, CA, DA, EA, EC, GA, GB, HA, HB, HD, LA, LB ; EB et ED remplacés tous les 10 ans ; les règles nationales priment) et les exporte en CSV d’entretien. Les dispositifs intégrés aux appareils (réservoir, robinet, appareil certifié) sont comptés sans tâche propre. En Belgique les prescriptions techniques de Belgaqua (TVBI/PTI) appliquent l’EN 1717, et le contrôle d’un nouveau raccordement ou d’une installation d’eau de pluie vérifie précisément ces dispositifs. Lorsque le tableau A.1 donne une seule fréquence sur les colonnes inspection et entretien (p. ex. AA, AB, AC, AD, AF, AG, DB, DC, HC), la visite comprend l’inspection et l’entretien courant ; les contrôles par an comptent des visites (l’entretien fait lors d’une inspection n’est pas compté deux fois, les remplacements ne sont pas des visites).',
        'Un dispositivo que nadie revisa no protege nada. La herramienta da un intervalo de inspección por dispositivo instalado (EN 806-5:2012 tabla A.1: AA, AB, AD, BA, CA, DC, GA, GB cada 6 meses, los demás cada año; mantenimiento anual para BA, CA, DA, EA, EC, GA, GB, HA, HB, HD, LA, LB; EB y ED se sustituyen cada 10 años; prevalecen las normas nacionales) y los exporta como CSV de mantenimiento. Los dispositivos integrados en aparatos (cisterna, grifo, aparato certificado) se cuentan pero no tienen tarea propia. En Bélgica las prescripciones técnicas de Belgaqua (TVBI/PTI) aplican EN 1717, y la inspección de una nueva acometida o de una instalación de agua de lluvia busca justamente estos dispositivos. Cuando la tabla A.1 da una sola frecuencia para las columnas de inspección y mantenimiento (p. ej. AA, AB, AC, AD, AF, AG, DB, DC, HC), la visita es inspección y mantenimiento rutinario juntos; las revisiones al año cuentan visitas (el mantenimiento hecho en una inspección no se cuenta dos veces y las sustituciones no son visitas).',
        'Zabezpieczenie, którego nikt nie sprawdza, niczego nie chroni. Narzędzie podaje interwał przeglądu dla każdego zamontowanego zabezpieczenia (EN 806-5:2012 tablica A.1: AA, AB, AD, BA, CA, DC, GA, GB co 6 miesięcy, pozostałe co rok; konserwacja co rok dla BA, CA, DA, EA, EC, GA, GB, HA, HB, HD, LA, LB; EB i ED wymiana co 10 lat; przepisy krajowe mają pierwszeństwo) i eksportuje je jako CSV konserwacji. Zabezpieczenia wbudowane w przybory (spłuczka, bateria, certyfikowane urządzenie) są liczone, ale nie mają osobnych zadań. W Belgii techniczne przepisy Belgaqua (TVBI/PTI) stosują EN 1717, a keuring nowego przyłącza lub instalacji deszczówki szuka właśnie tych zabezpieczeń. Gdy tablica A.1 podaje jedną częstotliwość dla kolumn kontroli i konserwacji (np. AA, AB, AC, AD, AF, AG, DB, DC, HC), wizyta obejmuje kontrolę i konserwację rutynową; kontrole roczne liczą wizyty (konserwacja przy kontroli nie jest liczona podwójnie, wymiany nie są wizytami).') }
  },

var PL = {
  apartments: [T7('24 flats, Antwerp — with a rainwater tank', '24 квартири, Антверпен — з резервуаром дощової води', '24 Wohnungen, Antwerpen — mit Regenwassertank', '24 appartementen, Antwerpen — met regenwaterput', '24 logements, Anvers — avec citerne d’eau de pluie', '24 viviendas, Amberes — con depósito de lluvia', '24 mieszkania, Antwerpia — ze zbiornikiem deszczówki'),
    T7('Almost all protection is already inside the fixtures — the one point the keuring looks at is the mains top-up of the rainwater tank: category 5, an air gap only, never a check valve.', 'Майже весь захист уже вбудований у прилади — keuring дивиться на одну точку: підживлення резервуара дощової води з мережі: категорія 5, лише розрив струменя, ніколи не зворотний клапан.', 'Fast der ganze Schutz steckt schon in den Objekten — die Keuring schaut auf eine Stelle: die Trinkwassernachspeisung des Regenwassertanks: Kategorie 5, nur freier Auslauf, nie ein Rückflussverhinderer.', 'Bijna alle beveiliging zit al in de toestellen — de keuring kijkt naar één punt: de bijvulling van de regenwaterput met leidingwater: categorie 5, alleen een vrije uitloop, nooit een keerklep.', 'Presque toute la protection est déjà dans les appareils — le contrôle regarde un point : l’appoint d’eau de ville de la citerne : catégorie 5, surverse seulement, jamais un clapet.', 'Casi toda la protección ya está en los aparatos — la inspección mira un punto: el aporte de red al depósito de lluvia: categoría 5, solo descarga libre, nunca una antirretorno.', 'Prawie cała ochrona jest już w przyborach — keuring patrzy na jeden punkt: uzupełnianie zbiornika deszczówki z sieci: kategoria 5, tylko przerwa powietrzna, nigdy zawór zwrotny.')],
  heating: [T7('Boiler room — heating fill and solar loop', 'Котельня — заповнення опалення і сонячний контур', 'Heizraum — Heizungsfüllung und Solarkreis', 'Stookruimte — vulling verwarming en zonnecircuit', 'Chaufferie — remplissage du chauffage et boucle solaire', 'Sala de calderas — llenado y circuito solar', 'Kotłownia — napełnianie ogrzewania i obieg solarny'),
    T7('A check valve never suffices on a heating fill: the water is category 3 and the boiler pushes back, so CA or GA. Without a drain both are out and only an air gap with a pump is left; toxic glycol makes it category 4 → BA.', 'На заповненні опалення зворотного клапана ніколи не досить: вода — категорія 3, а котел тисне назад, тож CA або GA. Без дренажу обидва відпадають, лишається розрив струменя з насосом; токсичний гліколь дає категорію 4 → BA.', 'Ein Rückflussverhinderer reicht an der Heizungsfüllung nie: das Wasser ist Kategorie 3 und der Kessel drückt zurück, also CA oder GA. Ohne Ablauf fallen beide weg, nur freier Auslauf mit Pumpe bleibt; giftiges Glykol macht Kategorie 4 → BA.', 'Een keerklep volstaat nooit op een verwarmingsvulling: het water is categorie 3 en de ketel duwt terug, dus CA of GA. Zonder afvoer vallen beide weg en blijft alleen een vrije uitloop met pomp; giftige glycol maakt het categorie 4 → BA.', 'Un clapet ne suffit jamais sur un remplissage de chauffage : l’eau est en catégorie 3 et la chaudière repousse, donc CA ou GA. Sans évacuation les deux tombent, il ne reste qu’une surverse avec pompe ; un glycol toxique donne la catégorie 4 → BA.', 'Una antirretorno nunca basta en el llenado de calefacción: el agua es categoría 3 y la caldera empuja, así que CA o GA. Sin desagüe ambos quedan fuera y solo queda descarga libre con bomba; un glicol tóxico da categoría 4 → BA.', 'Zawór zwrotny nigdy nie wystarcza przy napełnianiu ogrzewania: woda to kategoria 3, a kocioł napiera, więc CA lub GA. Bez odpływu oba odpadają i zostaje przerwa powietrzna z pompą; toksyczny glikol daje kategorię 4 → BA.')],
  dental: [T7('Dental practice in a residential building', 'Стоматологія в житловому будинку', 'Zahnarztpraxis im Wohnhaus', 'Tandartspraktijk in een woongebouw', 'Cabinet dentaire dans un immeuble', 'Consulta dental en un edificio de viviendas', 'Gabinet stomatologiczny w budynku mieszkalnym'),
    T7('BA — the best mechanical device — stops at category 4. Dental chairs are 5: only an air gap with a break tank and pump, unless the chair is certified with its own. “Not sure” about the steriliser is treated as 5 too.', 'BA — найкращий механічний пристрій — закінчується на категорії 4. Стоматологічні установки — 5: лише розрив струменя з баком і насосом, якщо установка не сертифікована з власним. «Не впевнений» щодо стерилізатора теж дає 5.', 'BA — die beste mechanische Einrichtung — endet bei Kategorie 4. Dentaleinheiten sind 5: nur freier Auslauf mit Vorlagebehälter und Pumpe, außer die Einheit ist mit eigenem zertifiziert. „Unsicher“ beim Sterilisator zählt ebenfalls als 5.', 'BA — de beste mechanische beveiliging — stopt bij categorie 4. Tandartsstoelen zijn 5: alleen een vrije uitloop met reservoir en pomp, tenzij de stoel met een eigen beveiliging gecertificeerd is. “Niet zeker” bij de sterilisator telt ook als 5.', 'Le BA — le meilleur dispositif mécanique — s’arrête à la catégorie 4. Les fauteuils dentaires sont en 5 : seulement une surverse avec bâche et pompe, sauf fauteuil certifié avec la sienne. « Pas sûr » pour le stérilisateur compte aussi comme 5.', 'El BA — el mejor dispositivo mecánico — llega solo a la categoría 4. Los sillones dentales son 5: solo descarga libre con depósito y bomba, salvo sillón certificado con la suya. «No seguro» en el esterilizador también cuenta como 5.', 'BA — najlepsze zabezpieczenie mechaniczne — kończy się na kategorii 4. Unity stomatologiczne to 5: tylko przerwa powietrzna ze zbiornikiem i pompą, chyba że unit ma certyfikowaną własną. „Nie wiem” przy sterylizatorze też daje 5.')],
  care: [T7('Care home — the same shower, another category', 'Будинок догляду — той самий душ, інша категорія', 'Pflegeheim — dieselbe Dusche, andere Kategorie', 'Woonzorgcentrum — dezelfde douche, andere categorie', 'Maison de soins — même douche, autre catégorie', 'Residencia — la misma ducha, otra categoría', 'Dom opieki — ten sam prysznic, inna kategoria'),
    T7('At home a hand shower lying in the bath is category 3 and HD is enough. In a care home the bath water of sick people is 5: no hose device covers it — the hose must be arranged so the head cannot reach the water.', 'Удома ручний душ у ванні — категорія 3, і HD досить. У будинку догляду вода після купання хворих — 5: жоден шланговий пристрій її не покриває — шланг треба розмістити так, щоб лійка не діставала до води.', 'Zu Hause ist eine Handbrause in der Wanne Kategorie 3 und HD genügt. Im Pflegeheim ist das Badewasser kranker Menschen 5: keine Schlaucheinrichtung deckt das ab — der Schlauch muss so geführt sein, dass die Brause das Wasser nicht erreicht.', 'Thuis is een handdouche in het bad categorie 3 en volstaat HD. In een zorgcentrum is het badwater van zieken 5: geen enkele slangbeveiliging dekt dat — de slang moet zo hangen dat de kop het water niet bereikt.', 'À la maison une douchette dans la baignoire est en catégorie 3 et HD suffit. En maison de soins l’eau du bain de malades est en 5 : aucun dispositif de tuyau ne la couvre — le flexible doit être disposé pour que la douchette n’atteigne pas l’eau.', 'En casa un teléfono de ducha en la bañera es categoría 3 y basta HD. En una residencia el agua del baño de enfermos es 5: ningún dispositivo de manguera la cubre — la manguera debe disponerse para que la ducha no alcance el agua.', 'W domu słuchawka w wannie to kategoria 3 i wystarczy HD. W domu opieki woda z kąpieli chorych to 5: żadne zabezpieczenie węża jej nie obejmuje — wąż trzeba ułożyć tak, by słuchawka nie sięgała wody.')],
  garden: [T7('Garden — same tap, different device', 'Сад — той самий кран, інший пристрій', 'Garten — gleiches Ventil, anderes Gerät', 'Tuin — dezelfde kraan, ander toestel', 'Jardin — même robinet, autre appareil', 'Jardín — el mismo grifo, otro aparato', 'Ogród — ten sam kran, inne urządzenie'),
    T7('An HD on the garden tap is fine for a hose — but only if it sits more than 250 mm above the ground water level, otherwise a CA. A high-pressure cleaner with detergent on the same tap is category 4: a GB.', 'HD на садовому крані годиться для шланга — але лише якщо він вище ніж 250 мм над рівнем води, інакше CA. Мийка високого тиску з миючим засобом на тому самому крані — категорія 4: GB.', 'Ein HD am Gartenventil genügt für einen Schlauch — aber nur, wenn es mehr als 250 mm über dem höchsten Wasserspiegel sitzt, sonst ein CA. Ein Hochdruckreiniger mit Reinigungsmittel am selben Ventil ist Kategorie 4: ein GB.', 'Een HD op de tuinkraan volstaat voor een slang — maar alleen als hij meer dan 250 mm boven het hoogste waterniveau zit, anders een CA. Een hogedrukreiniger met reinigingsmiddel op dezelfde kraan is categorie 4: een GB.', 'Un HD sur le robinet de jardin suffit pour un tuyau — mais seulement à plus de 250 mm au-dessus du niveau d’eau, sinon un CA. Un nettoyeur haute pression avec détergent sur le même robinet est en catégorie 4 : un GB.', 'Un HD en el grifo de jardín basta para una manguera — pero solo a más de 250 mm sobre el nivel del agua, si no un CA. Una hidrolimpiadora con detergente en el mismo grifo es categoría 4: un GB.', 'HD na kranie ogrodowym wystarczy dla węża — ale tylko wyżej niż 250 mm nad poziomem wody, inaczej CA. Myjka ciśnieniowa z detergentem na tym samym kranie to kategoria 4: GB.')],
  industry: [T7('Workshop — galvanic bath vs printing press', 'Цех — гальванічна ванна проти друкарської машини', 'Werkstatt — Galvanikbad gegen Druckmaschine', 'Werkplaats — galvanisch bad tegenover drukpers', 'Atelier — bain galvanique contre presse', 'Taller — baño galvánico frente a imprenta', 'Warsztat — wanna galwaniczna a maszyna drukarska'),
    T7('Both are category 4. The open galvanic tank can take a cheap pipe interrupter DC; the press needs pressure, so DB/DC drop out and a BA with drain is needed — or, where there is no drain, an air gap with a booster.', 'Обидва — категорія 4. Відкритий гальванічний бак допускає дешевий переривник DC; друкарській машині потрібен тиск, тож DB/DC відпадають і треба BA з дренажем — або, де дренажу немає, розрив струменя з насосом.', 'Beide sind Kategorie 4. Der offene Galvanikbehälter verträgt einen billigen Rohrunterbrecher DC; die Druckmaschine braucht Druck, also fallen DB/DC weg und ein BA mit Ablauf wird nötig — oder, wo kein Ablauf ist, ein freier Auslauf mit Druckerhöhung.', 'Beide zijn categorie 4. De open galvanische bak mag een goedkope leidingonderbreker DC krijgen; de drukpers heeft druk nodig, dus DB/DC vallen weg en een BA met afvoer is nodig — of, zonder afvoer, een vrije uitloop met drukverhoging.', 'Les deux sont en catégorie 4. Le bac galvanique ouvert accepte un disconnecteur DC bon marché ; la presse a besoin de pression, donc DB/DC tombent et il faut un BA avec évacuation — ou, sans évacuation, une surverse avec surpresseur.', 'Ambos son categoría 4. El depósito galvánico abierto admite un interruptor DC barato; la imprenta necesita presión, así que DB/DC quedan fuera y hace falta un BA con desagüe — o, sin desagüe, una descarga libre con grupo de presión.', 'Oba to kategoria 4. Otwarta wanna galwaniczna przyjmie tani przerywacz DC; maszyna drukarska potrzebuje ciśnienia, więc DB/DC odpadają i potrzebny jest BA z odpływem — albo, bez odpływu, przerwa powietrzna z pompą.')],
  bar: [T7('Bar counter — coffee next to a glass washer', 'Барна стійка — кава поруч зі склямийкою', 'Theke — Kaffee neben der Gläserspüle', 'Toog — koffie naast de glazenspoeler', 'Comptoir — café à côté du lave-verres', 'Barra — café junto al lavavasos', 'Bar — kawa obok myjki do szkła'),
    T7('Half a metre apart, two ends of the scale: the coffee machine is category 2 (a check valve EA), the glass washer with its bottom rinse under the water is 5 (an air gap with a pump).', 'За пів метра — два краї шкали: кавова машина — категорія 2 (зворотний клапан EA), склямийка з донним ополіскуванням під водою — 5 (розрив струменя з насосом).', 'Einen halben Meter auseinander, zwei Enden der Skala: die Kaffeemaschine ist Kategorie 2 (Rückflussverhinderer EA), die Gläserspüle mit Bodenspülrohr unter Wasser ist 5 (freier Auslauf mit Pumpe).', 'Een halve meter uit elkaar, twee uitersten van de schaal: de koffiemachine is categorie 2 (keerklep EA), de glazenspoeler met bodemspoeling onder water is 5 (vrije uitloop met pomp).', 'À un demi-mètre, les deux bouts de l’échelle : la machine à café est en catégorie 2 (clapet EA), le lave-verres à rinçage de fond immergé en 5 (surverse avec pompe).', 'A medio metro, los dos extremos de la escala: la cafetera es categoría 2 (antirretorno EA), el lavavasos con aclarado de fondo bajo el agua es 5 (descarga libre con bomba).', 'Pół metra od siebie, dwa końce skali: ekspres do kawy to kategoria 2 (zawór zwrotny EA), myjka do szkła z płukaniem dennym pod wodą to 5 (przerwa powietrzna z pompą).')]
};

function presetState(k) {

}
function rowFromPoint(x) {
  var a = x.answers || {};
  return { id: String(x.id || ''), n: +x.n || 1, app: x.app || 'custom', cat: x.cat == null ? 'auto' : String(x.cat), bp: x.bp || 'auto', needp: x.needp || 'auto', hose: x.hose || 'auto', drain: x.drain || 'yes',
    height_mm: x.height_mm === '' || x.height_mm == null ? null : +x.height_mm, d_mm: +x.d_mm || 15, a_path: a.path || '', a_toxic: a.toxic || '', a_harm: a.harm || '', a_change: a.change || '' };
