  /* ---- the physics: the page's own code, unchanged ---- */
  var kB = 8.617333262e-5;     // eV/K (CODATA 2018)
  var Emin = 1e-4, Emax = 1e7; // eV
  var lgMin = Math.log10(Emin), lgMax = Math.log10(Emax);
  var N = 1101;                // 0.01 decade per step

  // precompute log-spaced energy grid (eV)
  var E = new Float64Array(N);
  for(var i=0;i<N;i++){
    var f = i/(N-1);

  }

  // Watt fission spectrum chi(E) = C exp(-E/a) sinh(sqrt(bE)) for thermal-neutron-induced
  // fission of U-235; a and b are the ENDF/B evaluated parameters (E in MeV).
  var aW = 0.988, bW = 2.249; // MeV, 1/MeV

  function sig(x){ return 1/(1+Math.exp(-x)); }

  // per-lethargy component builders (each normalized to own max = 1)
  function build(T, r){
    var kt = kB*T;
    var th  = new Float64Array(N);
    var epi = new Float64Array(N);
    var fast= new Float64Array(N);
    var thMax=0, epiMax=0, fastMax=0;

    // window edges for the 1/E plateau tied to thermal energy and fission onset
    var lnEon  = Math.log(4*kt);      // plateau turns on above the thermal region
    var lnEoff = Math.log(0.2e6);     // plateau ends where fission source dominates
    var wOn=0.85, wOff=1.0;

    for(var i=0;i<N;i++){
      var e = E[i];
      // 1) Maxwellian flux phi ~ E*exp(-E/kt); per lethargy ~ E^2*exp(-E/kt)
      var t = e*e*Math.exp(-e/kt);
      th[i]=t; if(t>thMax)thMax=t;
      // 2) epithermal 1/E -> per lethargy flat, windowed
      var lnE=Math.log(e);
      var w = sig((lnE-lnEon)/wOn) * sig(-(lnE-lnEoff)/wOff);
      epi[i]=w; if(w>epiMax)epiMax=w;
      // 3) fast Watt chi(E), E in MeV; per lethargy = E*chi
      var eM=e/1e6;
      var chi = Math.exp(-eM/aW)*Math.sinh(Math.sqrt(bW*eM));
      var fp = eM*chi;
      fast[i]=fp; if(fp>fastMax)fastMax=fp;
    }
    // amplitudes: fast = reference 1; thermal scaled by r; plateau moderate
    var Ath = r, Aepi = 0.42, Afast = 1.0;
    var total = new Float64Array(N);
    var tMax=0;
    for(var j=0;j<N;j++){
      th[j]   = Ath  * th[j]/thMax;

  // thermal fraction: numerical integration of phi(E) dE below cutoff.
  // phi(E) = perLethargy(E)/E ; trapezoid over the energy grid.
  function thermalFraction(total){
    var below=0, all=0;
    for(var i=0;i<N-1;i++){
      var phi0 = total[i]/E[i], phi1 = total[i+1]/E[i+1];
      var dE = E[i+1]-E[i];
      var area = 0.5*(phi0+phi1)*dE;
      all += area;
      if(E[i+1] <= cutoff){ below += area; }
      else if(E[i] < cutoff){
        // partial interval up to cutoff (linear-in-E approximation)
        var frac = (cutoff-E[i])/dE;
        var phiC = phi0 + (phi1-phi0)*frac;
        below += 0.5*(phi0+phiC)*(cutoff-E[i]);
      }
    }
    return below/all;
  }

  // ---- diagnostics measured on the curves themselves (nothing hard-coded) ----
  var dLg = (lgMax-lgMin)/(N-1);
  // vertex of the parabola through the three grid points around the maximum, in log10 E
  function peakEnergy(arr){
    var ip=0,i;
    for(i=0;i<N;i++) if(arr[i]>arr[ip]) ip=i;
    if(ip<=0||ip>=N-1) return E[ip];
    var y0=arr[ip-1], y1=arr[ip], y2=arr[ip+1], den=(y0-2*y1+y2);
    var d = den!==0 ? 0.5*(y0-y2)/den : 0;
    return Math.pow(10, Math.log10(E[ip]) + d*dLg);
  }
  // <E> of a flux spectrum given per unit lethargy: INT E phi dE / INT phi dE, phi = u/E
  function meanEnergy(u){
    var s1=0, s0=0;
    for(var i=0;i<N-1;i++){
      var dE=E[i+1]-E[i];
      s1 += 0.5*(u[i]+u[i+1])*dE;                 // INT phi E dE = INT u dE
      s0 += 0.5*(u[i]/E[i]+u[i+1]/E[i+1])*dE;     // INT phi dE
    }
    return s1/s0;
  }
  // Watt mean energy on a dedicated grid to 20 MeV, so it is not biased by the 10 MeV
  // right-hand edge of the plot (which holds 99.87 % of the fission spectrum)
  function wattMean(){
    var n=40001, Ehi=20, s0=0, s1=0, h=Ehi/(n-1);
    for(var i=0;i<n;i++){
      var e=i*h, c=Math.exp(-e/aW)*Math.sinh(Math.sqrt(bW*e)), w=(i===0||i===n-1)?0.5:1;
      s0 += w*c; s1 += w*c*e;
    }
    return s1/s0;   // MeV
  }
  // flatness of the 1/E plateau: max/min of the per-lethargy epithermal curve, 10 eV .. 10 keV
  function plateauFlatness(epi){
    var mn=Infinity, mx=0;
    for(var i=0;i<N;i++){
      if(E[i]<10||E[i]>1e4) continue;

  }
  function maxOf(arr){var m=0;for(var i=0;i<N;i++)if(arr[i]>m)m=arr[i];return m;}
  // steepest logarithmic slope |d ln u / d ln E| of the joined curve: a discontinuity at any

  /* ---------------------------------------------------------------- plot
     The same picture the page has always drawn: eleven decades of log energy,
     the three shaded components, the bold total, the cadmium cutoff and the
     three region annotations. What changed is that the stage sizes it instead
     of H = 0.52 W, that the tick and annotation text is drawn at its real size
     (UI spec §10) and clamped inside the plot box, that the decade labels thin
     out below md, and that the legend moved out of the drawing into the row
     underneath it, where it can wrap and be read by a screen reader. */
  function sup(n){
    var m={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
    return String(n).split('').map(function(c){return m[c]||c;}).join('');
  }

  function drawPlot(ctx,W,H,density,d,lang){
    var coarse = density==='coarse';
    ctx.clearRect(0,0,W,H);

    var cInk=cssVar('--ink','#12161d'), cMuted=cssVar('--muted','#5b6675'),
        cGrid=cssVar('--line','#e2e7ee'),
        cTotal=cssVar('--accent','#3763e6'), cTh=cssVar('--spc-thermal','#0e7490'),
        cEpi=cssVar('--ok','#1f6f34'), cFast=cssVar('--bad','#a5261f'),
        fSmall=cssVar('--fs-small','12px'), fMicro=cssVar('--fs-micro','11px'),
        fam=cssVar('--font','system-ui,sans-serif'),
        mono=cssVar('--font-mono','ui-monospace,Menlo,monospace');
    var l = I18N[lang] || I18N.en;

    /* The y-axis title runs along the axis while it fits there — the way the
       page has always drawn it. In a short plot (the 340 px stage column at
       1120 px, or a phone) it does not fit: rotated it was clipped by the
       canvas edge and printed over the tick labels, so it moves above the plot
       where the full canvas width is available. Labels are never scaled. */
    var M = coarse ? {l:40,r:12,t:14,b:36} : {l:58,r:18,t:18,b:42};
    ctx.font='400 '+fSmall+'/1 '+fam;
    var wY = ctx.measureText(l.axisY).width;
    var rotY = wY <= (H-M.t-M.b)-6;
    if(rotY){ M.l = coarse ? 52 : 58; } else { M.t = Math.max(M.t, 28); }
    var pl=M.l, pr=W-M.r, pt=M.t, pb=H-M.b;
    if(pr<=pl+16 || pb<=pt+16) return;
    var pw=pr-pl, ph=pb-pt;

    function px(e){ return pl + (Math.log10(e)-lgMin)/(lgMax-lgMin)*pw; }
    var ymax = d ? d.max*1.06 : 1;
    function py(v){ return pt + (1 - v/ymax)*ph; }

    /* Vertical decade grid. Every decade keeps its line; the labels thin out
       from the room actually available per decade rather than from the
       viewport, because the calculator layout gives the stage a 340 px column
       at 1120 px just as a phone does. */
    var perDec = pw/11;
    var lblStep = perDec>=34 ? 1 : (perDec>=20 ? 2 : 3);
    ctx.font='400 '+fMicro+'/1 '+mono;
    ctx.textAlign='center'; ctx.textBaseline='top';
    for(var dec=-4; dec<=7; dec++){
      var X=px(Math.pow(10,dec));
      ctx.strokeStyle=cGrid; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(X,pt); ctx.lineTo(X,pb); ctx.stroke();
      if(dec%lblStep===0){
        ctx.fillStyle=cMuted;
        ctx.fillText('10'+sup(dec), X, pb+6);
      }
    }
    /* horizontal gridlines, labelled as a fraction of the peak flux */
    ctx.textAlign='right'; ctx.textBaseline='middle';
    for(var g=0; g<=1.0001; g+=0.2){
      var Y = py(d ? g*d.max : g/1.06);
      ctx.strokeStyle=cGrid; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(pl,Y); ctx.lineTo(pr,Y); ctx.stroke();
      ctx.fillStyle=cMuted; ctx.fillText(g.toFixed(1), pl-8, Y);
    }

    /* cadmium cutoff marker */
    var Xc=px(cutoff);
    ctx.save();
    ctx.setLineDash([4,4]); ctx.strokeStyle=cMuted; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(Xc,pt); ctx.lineTo(Xc,pb); ctx.stroke();
    ctx.restore();
    ctx.fillStyle=cMuted; ctx.textBaseline='top';
    ctx.font='400 '+fMicro+'/1 '+mono;
    var wCd=ctx.measureText(l.annCd).width;
    if(Xc+4+wCd<=pr){ ctx.textAlign='left'; ctx.fillText(l.annCd, Xc+4, pt+2); }
    else { ctx.textAlign='right'; ctx.fillText(l.annCd, Math.min(Xc-4,pr), pt+2); }

    if(d){
      drawCurve(ctx,px,py,d.th,   cTh,    1.4, 0.10, pb);
      drawCurve(ctx,px,py,d.epi,  cEpi,   1.4, 0.10, pb);
      drawCurve(ctx,px,py,d.fast, cFast,  1.4, 0.10, pb);
      drawCurve(ctx,px,py,d.total,cTotal, 2.4, 0,    pb);

      /* Region annotations, kept inside the plot box at every width. In a plot
         narrower than about 420 px they are dropped (UI spec §10: at coarse
         density the tool reduces tick count and drops non-essential
         annotations) — there the three labels lie across the three curves they
         name, and the legend row immediately under the plot carries the same
         four names, in the same colours, in full. */
      if(pw>=420){
        ctx.font='400 '+fSmall+'/1 '+fam;
        ctx.textAlign='center'; ctx.textBaseline='alphabetic';
        annot(ctx,l.annThermal, px(d.kt*1.5), pt+ph*0.30, cTh,   pl,pr);
        annot(ctx,l.annEpi,     px(3e2),      pt+ph*0.72, cEpi,  pl,pr);
        annot(ctx,l.annFission, px(1.6e6),    pt+ph*0.30, cFast, pl,pr);
      }
    }

    /* axis titles */
    ctx.fillStyle=cInk; ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.font='400 '+fSmall+'/1 '+fam;
    ctx.fillText(l.axisX, pl+pw/2, H-2);
    if(rotY){
      ctx.save();
      ctx.translate(coarse?11:14, pt+ph/2); ctx.rotate(-Math.PI/2);
      ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.fillText(l.axisY, 0, 0);
      ctx.restore();
    } else {
      ctx.textAlign='left'; ctx.textBaseline='top';
      if(wY > W-6) ctx.font='400 '+fMicro+'/1 '+fam;
      ctx.fillText(l.axisY, 3, 4);
    }
  }

  function annot(ctx,text,x,y,color,pl,pr){
    ctx.fillStyle=color;
    var w=ctx.measureText(text).width;
    ctx.fillText(text, Math.min(Math.max(x, pl+w/2+2), pr-w/2-2), y);
  }

  function drawCurve(ctx,px,py,arr,color,width,fillAlpha,pb){
    var i,j;
    if(fillAlpha){
      ctx.beginPath();
      ctx.moveTo(px(E[0]), pb);
      for(i=0;i<N;i++) ctx.lineTo(px(E[i]), py(arr[i]));
      ctx.lineTo(px(E[N-1]), pb);
      ctx.closePath();
      ctx.globalAlpha=fillAlpha; ctx.fillStyle=color; ctx.fill(); ctx.globalAlpha=1;
    }
    ctx.beginPath();
    for(j=0;j<N;j++){
      var X=px(E[j]), Y=py(arr[j]);
      if(j===0)ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
    }
    ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineJoin='round'; ctx.stroke();
  }

  function legendHTML(lang){
    var l = I18N[lang] || I18N.en;
    return [['total',l.legTotal],['thermal',l.legThermal],['epi',l.legEpi],['fast',l.legFast]]
      .map(function(p){
        return '<span class="'+p[0]+'"><i class="spc-sw"></i><span>'+esc(p[1])+'</span></span>';
      }).join('');
  }

        body:  T6('The neutron flux of a thermal reactor per unit lethargy across ten decades of energy: the fast fission (Watt) source, the 1/E slowing-down plateau and the thermal Maxwellian in equilibrium with the moderator. Set the moderator temperature and the thermalization control; the curves and the readout follow every change.','Нейтронний потік теплового реактора на одиницю летаргії у десяти декадах енергії: швидке джерело поділу (Ватт), плато сповільнення 1/E та теплова максвеллівська область у рівновазі зі сповільнювачем. Задайте температуру сповільнювача та регулятор термалізації — криві й показники змінюються одразу.','Der Neutronenfluss eines thermischen Reaktors pro Lethargie-Einheit über zehn Energiedekaden: die schnelle Spaltquelle (Watt), das 1/E-Abbremsplateau und die thermische Maxwell-Verteilung im Gleichgewicht mit dem Moderator. Moderatortemperatur und Thermalisierungsregler einstellen; Kurven und Anzeige folgen sofort.','De neutronenflux van een thermische reactor per lethargie-eenheid over tien energiedecaden: de snelle splijtingsbron (Watt), het 1/E-afremplateau en de thermische Maxwell-verdeling in evenwicht met de moderator. Stel de moderatortemperatuur en de thermalisatieregelaar in; de curven en de uitlezing volgen direct.','Le flux neutronique d’un réacteur thermique par unité de léthargie sur dix décades d’énergie : la source de fission rapide (Watt), le plateau de ralentissement en 1/E et la maxwellienne thermique en équilibre avec le modérateur. Réglez la température du modérateur et la commande de thermalisation ; les courbes et l’affichage suivent aussitôt.','El flujo neutrónico de un reactor térmico por unidad de letargía a lo largo de diez décadas de energía: la fuente de fisión rápida (Watt), la meseta de moderación 1/E y la maxwelliana térmica en equilibrio con el moderador. Ajuste la temperatura del moderador y el control de termalización; las curvas y la lectura siguen cada cambio.',"Strumień neutronów reaktora termicznego na jednostkę letargu w ciągu dziesięciu dekad energii: szybkie źródło rozszczepienia (Watt), plateau spowalniania 1/E i termiczny rozkład Maxwella w równowadze z moderatorem. Ustaw temperaturę moderatora i sterowanie termalizacją; krzywe i odczyty podążają za każdą zmianą.")

      topics: {
        lethargy: {
          title: T6('Per unit lethargy','На одиницю летаргії','Pro Lethargie-Einheit','Per lethargie-eenheid','Par unité de léthargie','Por unidad de letargía',"Na jednostkę letargu"),
          body:  T6('The plot shows E·φ(E), the flux per unit lethargy, because that is what makes ideal slowing down a flat line: equal areas under equal decades of energy. It also moves the thermal peak: per unit lethargy the Maxwellian peaks at 2kT, while the most probable energy of the flux per unit energy is kT.','Графік показує E·φ(E) — потік на одиницю летаргії, бо саме так ідеальне сповільнення виглядає як пряма: рівні площі під рівними декадами енергії. Це зміщує й тепловий пік: на одиницю летаргії максвеллівський розподіл має пік при 2kT, тоді як найімовірніша енергія потоку на одиницю енергії дорівнює kT.','Dargestellt ist E·φ(E), der Fluss pro Lethargie-Einheit, denn so wird ideale Abbremsung zur waagerechten Linie: gleiche Flächen unter gleichen Energiedekaden. Das verschiebt auch den thermischen Peak: pro Lethargie-Einheit liegt das Maxwell-Maximum bei 2kT, die wahrscheinlichste Energie des Flusses pro Energieeinheit dagegen bei kT.','De grafiek toont E·φ(E), de flux per lethargie-eenheid, want daardoor wordt ideale afremming een vlakke lijn: gelijke oppervlakken onder gelijke energiedecaden. Het verschuift ook de thermische piek: per lethargie-eenheid piekt de Maxwell-verdeling bij 2kT, terwijl de meest waarschijnlijke energie van de flux per eenheid energie kT is.','Le tracé montre E·φ(E), le flux par unité de léthargie, car c’est ainsi qu’un ralentissement idéal devient une droite : aires égales sous des décades d’énergie égales. Cela déplace aussi le pic thermique : par unité de léthargie la maxwellienne culmine à 2kT, alors que l’énergie la plus probable du flux par unité d’énergie vaut kT.','La gráfica muestra E·φ(E), el flujo por unidad de letargía, porque así la moderación ideal se convierte en una recta: áreas iguales bajo décadas de energía iguales. También desplaza el pico térmico: por unidad de letargía la maxwelliana alcanza su máximo en 2kT, mientras que la energía más probable del flujo por unidad de energía es kT.',"Wykres pokazuje E·φ(E), czyli strumień na jednostkę letargu. W takim przedstawieniu idealne spowalnianie daje płaskie plateau: równe przedziały letargu mają równe pola. Dla rozkładu Maxwella maksimum na jednostkę letargu przypada przy 2kT, podczas gdy najbardziej prawdopodobna energia strumienia na jednostkę energii wynosi kT.")

        temperature: {
          title: T6('Moderator temperature','Температура сповільнювача','Moderatortemperatur','Moderatortemperatuur','Température du modérateur','Temperatura del moderador',"Temperatura moderatora"),
          body:  T6('The temperature of the material the neutrons come into equilibrium with. It fixes kT = 8.617333e-5 eV/K × T, and with it the position of the whole thermal group: the Maxwellian peaks at 2kT per unit lethargy and the lower edge of the 1/E window is tied to 4kT. Nothing else on the page depends on it.','Температура матеріалу, з яким нейтрони приходять у рівновагу. Вона задає kT = 8,617333e-5 еВ/K × T, а з ним і положення всієї теплової групи: максвеллівський пік на одиницю летаргії при 2kT, а нижній край вікна 1/E прив’язаний до 4kT. Більше ніщо на сторінці від неї не залежить.','Die Temperatur des Materials, mit dem die Neutronen ins Gleichgewicht kommen. Sie legt kT = 8,617333e-5 eV/K × T fest und damit die Lage der gesamten thermischen Gruppe: das Maxwell-Maximum pro Lethargie-Einheit bei 2kT und die untere Kante des 1/E-Fensters bei 4kT. Sonst hängt nichts auf der Seite davon ab.','De temperatuur van het materiaal waarmee de neutronen in evenwicht komen. Zij legt kT = 8,617333e-5 eV/K × T vast en daarmee de plaats van de hele thermische groep: de Maxwell-piek per lethargie-eenheid bij 2kT en de onderrand van het 1/E-venster bij 4kT. Verder hangt niets op de pagina ervan af.','La température du matériau avec lequel les neutrons s’équilibrent. Elle fixe kT = 8,617333e-5 eV/K × T et donc la position de tout le groupe thermique : le maximum maxwellien par unité de léthargie à 2kT et le bord inférieur de la fenêtre en 1/E à 4kT. Rien d’autre sur la page n’en dépend.','La temperatura del material con el que los neutrones alcanzan el equilibrio. Fija kT = 8,617333e-5 eV/K × T y con ella la posición de todo el grupo térmico: el máximo maxwelliano por unidad de letargía en 2kT y el borde inferior de la ventana 1/E en 4kT. Nada más en la página depende de ella.',"Temperatura materiału, z którym neutrony osiągają równowagę termiczną. Wyznacza kT = 8,617333·10⁻⁵ eV/K × T, a tym samym położenie całej grupy termicznej: maksimum rozkładu Maxwella na jednostkę letargu wypada przy 2kT, a dolna granica obszaru 1/E jest związana z 4kT. Pozostałe parametry modelu od niej nie zależą.")

        thermalization: {
          title: T6('Thermalization control','Регулятор термалізації','Thermalisierungsregler','Thermalisatieregelaar','Commande de thermalisation','Control de termalización',"Parametr termalizacji"),
          body:  T6('The height of the thermal peak relative to the fast bump: higher is a softer, better-moderated spectrum. It is a drawing control, not a calculation — it multiplies the normalised Maxwellian component, and the tile "T_mod / fast peak ratio" is exactly the number you set.','Висота теплового піку відносно швидкого горба: більше — м’якший, краще сповільнений спектр. Це регулятор рисунка, а не розрахунок: він множить нормовану максвеллівську компоненту, і показник відношення піків дорівнює саме заданому числу.','Die Höhe des thermischen Peaks gegenüber dem schnellen Buckel: höher heißt weicheres, besser moderiertes Spektrum. Es ist ein Zeichnungsregler, keine Rechnung — er multipliziert die normierte Maxwell-Komponente, und die angezeigte Peakverhältnis-Kachel ist genau der eingestellte Wert.','De hoogte van de thermische piek ten opzichte van de snelle bult: hoger is een zachter, beter gemodereerd spectrum. Het is een tekenregelaar, geen berekening — hij vermenigvuldigt de genormaliseerde Maxwell-component, en de getoonde piekverhouding is precies de ingestelde waarde.','La hauteur du pic thermique par rapport à la bosse rapide : plus haut signifie un spectre plus mou, mieux modéré. C’est une commande de tracé, non un calcul — elle multiplie la composante maxwellienne normalisée, et la tuile du rapport des pics vaut exactement la valeur réglée.','La altura del pico térmico frente a la joroba rápida: más alto es un espectro más blando y mejor moderado. Es un control de dibujo, no un cálculo: multiplica la componente maxwelliana normalizada, y la relación de picos mostrada es exactamente el valor fijado.',"Wysokość maksimum termicznego względem maksimum składowej szybkiej: większa wartość oznacza bardziej miękkie, lepiej moderowane widmo. Jest to parametr ilustracyjny, a nie wynik obliczenia — skaluje znormalizowaną składową Maxwella, a wskaźnik „T_mod / maksimum szybkie” pokazuje dokładnie ustawioną wartość.")

        thermal: {
          title: T6('Thermal (Maxwellian)','Теплові (максвеллівський розподіл)','Thermisch (Maxwell-Verteilung)','Thermisch (maxwellverdeling)','Thermique (distribution de Maxwell)','Térmico (distribución de Maxwell)',"Termiczny (Maxwellowski)"),
          body:  T6('Neutrons in equilibrium with the moderator follow φ(E) = C E exp(-E/kT), which is C E² exp(-E/kT) per unit lethargy. The flux per unit energy peaks at kT; the flux-weighted mean energy, and the per-lethargy peak, are both at 2kT.','Нейтрони в рівновазі зі сповільнювачем описуються φ(E) = C E exp(-E/kT), тобто C E² exp(-E/kT) на одиницю летаргії. Потік на одиницю енергії має пік при kT; середня за потоком енергія та пік на одиницю летаргії — обидва при 2kT.','Neutronen im Gleichgewicht mit dem Moderator folgen φ(E) = C E exp(-E/kT), pro Lethargie-Einheit also C E² exp(-E/kT). Der Fluss pro Energieeinheit hat sein Maximum bei kT; die flussgewichtete mittlere Energie und das Maximum pro Lethargie liegen beide bei 2kT.','Neutronen in evenwicht met de moderator volgen φ(E) = C E exp(-E/kT), per lethargie-eenheid dus C E² exp(-E/kT). De flux per eenheid energie piekt bij kT; de fluxgewogen gemiddelde energie en de piek per lethargie liggen beide bij 2kT.','Les neutrons en équilibre avec le modérateur suivent φ(E) = C E exp(-E/kT), soit C E² exp(-E/kT) par unité de léthargie. Le flux par unité d’énergie culmine à kT ; l’énergie moyenne pondérée par le flux et le maximum par léthargie valent tous deux 2kT.','Los neutrones en equilibrio con el moderador siguen φ(E) = C E exp(-E/kT), es decir C E² exp(-E/kT) por unidad de letargía. El flujo por unidad de energía alcanza su máximo en kT; la energía media ponderada por el flujo y el máximo por letargía están ambos en 2kT.',"Neutrony w równowadze z moderatorem podążają za φ(E) = C E exp(-E/kT), co odpowiada C E² exp(-E/kT) na jednostkę letargu. Strumień na jednostkę energii osiąga szczyt przy kT; średnia energia ważona strumieniem i szczyt na letarg osiągają 2 kT.")
        },
        epithermal: {
          title: T6('Epithermal 1/E plateau','Надтеплове плато 1/E','Epithermisches 1/E-Plateau','Epithermisch 1/E-plateau','Plateau épithermique en 1/E','Meseta epitérmica 1/E',"Epitermalne plateau 1/E"),
          body:  T6('Between birth and thermalization the neutrons lose energy in steps that are constant in lethargy, so the slowing-down flux goes as 1/E and its per-lethargy value is flat. Here it is windowed by two sigmoids, from 4kT up to 0.2 MeV; the readout reports how flat the result is between 10 eV and 10 keV.','Між народженням і термалізацією нейтрони втрачають енергію кроками, сталими в летаргії, тому потік сповільнення йде як 1/E, а на одиницю летаргії він плаский. Тут його обмежено двома сигмоїдами — від 4kT до 0,2 МеВ; у записі наведено, наскільки пласким є результат між 10 еВ і 10 кеВ.','Zwischen Entstehung und Thermalisierung verlieren Neutronen Energie in Schritten, die in der Lethargie konstant sind; der Abbremsfluss geht daher wie 1/E und ist pro Lethargie-Einheit flach. Hier begrenzen ihn zwei Sigmoiden von 4kT bis 0,2 MeV; der Datensatz gibt an, wie flach das Ergebnis zwischen 10 eV und 10 keV ist.','Tussen ontstaan en thermalisatie verliezen neutronen energie in stappen die constant zijn in lethargie, dus de afremflux gaat als 1/E en is per lethargie-eenheid vlak. Hier wordt hij door twee sigmoïden begrensd, van 4kT tot 0,2 MeV; het record vermeldt hoe vlak het resultaat tussen 10 eV en 10 keV is.','Entre la naissance et la thermalisation, les neutrons perdent de l’énergie par pas constants en léthargie : le flux de ralentissement varie en 1/E et sa valeur par léthargie est plate. Ici il est fenêtré par deux sigmoïdes, de 4kT à 0,2 MeV ; l’enregistrement indique la planéité obtenue entre 10 eV et 10 keV.','Entre el nacimiento y la termalización los neutrones pierden energía en pasos constantes en letargía, así que el flujo de moderación va como 1/E y su valor por letargía es plano. Aquí se limita con dos sigmoides, de 4kT a 0,2 MeV; el registro indica cuán plano queda el resultado entre 10 eV y 10 keV.',"Między narodzinami a termalizacją neutrony tracą energię w przybliżeniu równomiernie w letargu, dlatego strumień spowalniania jest proporcjonalny do 1/E, a jego wartość na jednostkę letargu jest płaska. W modelu obszar ten jest ograniczony dwiema funkcjami sigmoidalnymi, od 4kT do 0,2 MeV; odczyt ocenia płaskość między 10 eV a 10 keV.")

        fast: {
          title: T6('Fast fission (Watt) source','Швидке джерело поділу (Ватт)','Schnelle Spaltquelle (Watt)','Snelle splijtingsbron (Watt)','Source de fission rapide (Watt)','Fuente de fisión rápida (Watt)',"Szybkie źródło rozszczepieniowe (Watt)"),
          body:  T6('Neutrons are born with the U-235 thermal-fission Watt spectrum χ(E) = C exp(-E/a) sinh(√(bE)), a = 0.988 MeV, b = 2.249 1/MeV. Its mean energy is 3a/2 + a²b/4 = 2.031 MeV, integrated here on a dedicated 0–20 MeV grid so the 10 MeV edge of the plot does not truncate it.','Нейтрони народжуються зі спектром Ватта теплового поділу U-235: χ(E) = C exp(-E/a) sinh(√(bE)), a = 0,988 МеВ, b = 2,249 1/МеВ. Його середня енергія 3a/2 + a²b/4 = 2,031 МеВ; вона інтегрується на окремій сітці 0–20 МеВ, щоб край графіка при 10 МеВ її не обрізав.','Neutronen entstehen mit dem Watt-Spektrum der thermischen U-235-Spaltung χ(E) = C exp(-E/a) sinh(√(bE)), a = 0,988 MeV, b = 2,249 1/MeV. Die mittlere Energie 3a/2 + a²b/4 = 2,031 MeV wird auf einem eigenen 0–20-MeV-Raster integriert, damit der 10-MeV-Rand des Diagramms sie nicht abschneidet.','Neutronen ontstaan met het Watt-spectrum van de thermische U-235-splijting χ(E) = C exp(-E/a) sinh(√(bE)), a = 0,988 MeV, b = 2,249 1/MeV. De gemiddelde energie 3a/2 + a²b/4 = 2,031 MeV wordt op een apart 0–20 MeV-rooster geïntegreerd, zodat de 10 MeV-rand van de grafiek haar niet afkapt.','Les neutrons naissent avec le spectre de Watt de la fission thermique de l’U-235 : χ(E) = C exp(-E/a) sinh(√(bE)), a = 0,988 MeV, b = 2,249 1/MeV. Son énergie moyenne 3a/2 + a²b/4 = 2,031 MeV est intégrée sur une grille dédiée 0–20 MeV, pour que le bord à 10 MeV du tracé ne la tronque pas.','Los neutrones nacen con el espectro de Watt de la fisión térmica del U-235: χ(E) = C exp(-E/a) sinh(√(bE)), a = 0,988 MeV, b = 2,249 1/MeV. Su energía media 3a/2 + a²b/4 = 2,031 MeV se integra en una malla propia de 0–20 MeV para que el borde de 10 MeV de la gráfica no la trunque.',"Neutrony rodzą się z widmem Watta rozszczepienia termicznego U-235: χ(E) = C exp(-E/a) sinh(√(bE)), a = 0,988 MeV, b = 2,249 1/MeV. Jego średnia energia wynosi 3a/2 + a²b/4 = 2,031 MeV, zintegrowana tutaj na dedykowanej siatce 0–20 MeV, tak aby krawędź wykresu 10 MeV go nie przycinała.")

        cutoff: {
          title: T6('Cadmium cutoff and thermal fraction','Кадмієва межа та теплова частка','Cadmium-Grenze und thermischer Anteil','Cadmiumafsnijding en thermische fractie','Coupure cadmium et fraction thermique','Corte de cadmio y fracción térmica',"Próg kadmowy i udział termiczny"),
          body:  T6('0.625 eV is the conventional line between the thermal group and the epithermal region, because a thin cadmium sheet absorbs almost everything below it. The tile is ∫φ dE below the cutoff divided by the whole integral, with φ = u(E)/E — a property of the mixture drawn here, not of a particular reactor.','0,625 еВ — умовна межа між тепловою групою та надтепловою областю, бо тонкий кадмієвий лист поглинає майже все нижче неї. Показник — це ∫φ dE нижче межі, поділене на повний інтеграл, де φ = u(E)/E; це властивість намальованої тут суміші, а не конкретного реактора.','0,625 eV ist die übliche Grenze zwischen thermischer Gruppe und epithermischem Bereich, weil ein dünnes Cadmiumblech fast alles darunter absorbiert. Die Kachel zeigt ∫φ dE unterhalb der Grenze geteilt durch das Gesamtintegral, mit φ = u(E)/E — eine Eigenschaft der hier gezeichneten Mischung, nicht eines bestimmten Reaktors.','0,625 eV is de gebruikelijke grens tussen de thermische groep en het epithermische gebied, omdat een dun cadmiumblad vrijwel alles daaronder absorbeert. De tegel toont ∫φ dE onder de afsnijding gedeeld door de volledige integraal, met φ = u(E)/E — een eigenschap van het hier getekende mengsel, niet van een bepaalde reactor.','0,625 eV est la limite conventionnelle entre le groupe thermique et la région épithermique, car une fine feuille de cadmium absorbe presque tout en dessous. La tuile vaut ∫φ dE sous la coupure divisé par l’intégrale totale, avec φ = u(E)/E — une propriété du mélange tracé ici, pas d’un réacteur particulier.','0,625 eV es la línea convencional entre el grupo térmico y la región epitérmica, porque una lámina fina de cadmio absorbe casi todo por debajo. La tarjeta es ∫φ dE bajo el corte dividido por la integral total, con φ = u(E)/E: una propiedad de la mezcla dibujada aquí, no de un reactor concreto.',"0,625 eV to umowna granica między grupą termiczną a obszarem epitermalnym, ponieważ cienka warstwa kadmu pochłania prawie wszystko, co znajduje się poniżej. Wskaźnik podaje ∫φ dE poniżej punktu odcięcia podzielonego przez całkę całkowitą, gdzie φ = u(E)/E — właściwość narysowanej tutaj mieszanki, a nie konkretnego reaktora.")

        mixture: {
          title: T6('How the three regions are weighted','Як зважено три області','Wie die drei Bereiche gewichtet werden','Hoe de drie gebieden gewogen worden','Comment les trois régions sont pondérées','Cómo se ponderan las tres regiones',"Jak ważone są trzy regiony"),
          body:  T6('Each component is the exact analytic form, but the mixture is an illustrative recipe: every component is normalised to its own maximum and then scaled — thermal by the thermalization control, epithermal by a fixed 0.42, fast by 1 — with sigmoid windows joining the regions. No geometry-, material-, burnup- or transport-specific spectrum is calculated.','Кожна компонента — точна аналітична форма, але суміш є ілюстративним рецептом: кожну нормовано на власний максимум і помножено — теплову на регулятор термалізації, надтеплову на сталу 0,42, швидку на 1 — із сигмоїдними вікнами на стиках. Спектр, залежний від геометрії, матеріалів, вигоряння чи переносу, не розраховується.','Jede Komponente ist die exakte analytische Form, die Mischung aber ein illustratives Rezept: jede Komponente wird auf ihr eigenes Maximum normiert und dann skaliert — thermisch mit dem Thermalisierungsregler, epithermisch mit festen 0,42, schnell mit 1 — mit Sigmoid-Fenstern an den Übergängen. Es wird kein geometrie-, material-, abbrand- oder transportspezifisches Spektrum berechnet.','Elke component is de exacte analytische vorm, maar het mengsel is een illustratief recept: elke component wordt op zijn eigen maximum genormaliseerd en daarna geschaald — thermisch met de thermalisatieregelaar, epithermisch met een vaste 0,42, snel met 1 — met sigmoïde vensters op de overgangen. Er wordt geen geometrie-, materiaal-, opbrand- of transportspecifiek spectrum berekend.','Chaque composante est la forme analytique exacte, mais le mélange est une recette illustrative : chaque composante est normalisée à son propre maximum puis mise à l’échelle — thermique par la commande de thermalisation, épithermique par 0,42 fixe, rapide par 1 — avec des fenêtres sigmoïdes aux raccords. Aucun spectre dépendant de la géométrie, des matériaux, du taux de combustion ou du transport n’est calculé.','Cada componente es la forma analítica exacta, pero la mezcla es una receta ilustrativa: cada componente se normaliza a su propio máximo y luego se escala —térmica por el control de termalización, epitérmica por un 0,42 fijo, rápida por 1— con ventanas sigmoides en las uniones. No se calcula ningún espectro específico de geometría, materiales, quemado o transporte.',"Każda składowa ma dokładną postać analityczną, lecz ich mieszanina jest ilustracyjnym modelem. Każdą składową normalizuje się do własnego maksimum, a następnie skaluje: termiczną parametrem termalizacji, epitermalną stałą 0,42, szybką współczynnikiem 1; obszary łączą okna sigmoidalne. Nie jest obliczane widmo właściwe dla konkretnej geometrii, materiału, wypalenia ani zadania transportowego.")

    LAST = solve(T, r);

        { label:KP('tileMp'),   value:LAST.kt, unit:'eV', precision:4, learn:'thermal', headline:false },

          headline:false },

  /* ----------------------------------------------------------------- boot */
  function detectLang(){
    if (I18N[window.__diagramLang]) return window.__diagramLang;
    try{ var x=localStorage.getItem('diagram_lang'); if(I18N[x]) return x; }catch(e){}
    var langs = navigator.languages||[navigator.language||'en'];
    for (var i=0;i<langs.length;i++){

  /* UPSTREAM: App.reset() and App.example() replace app.state with a fresh
     object, so the object this file holds — the one serialize(), record() and
     the handoff write through — is orphaned the moment either runs, and the
     permalink then freezes at the reset value. Adopt the new values into the
     one state object and point the app back at it. */
  function adopt(fresh,app){
    Object.keys(fresh).forEach(function(k){ state[k]=fresh[k]; });
    app.state = state;
    return state;
  }

  /* UPSTREAM: Field.prototype.commit sets the "clamped" note and clears it two
     lines later, so a value the framework clamps is written back but never
     announced (spec §6, UI_AUDIT S-9). Announce it here, on the one surface the
     site has. The listener captures, because the framework's own change handler
     writes the clamped value back into the box first. */
  function announceClamp(app,sel,lo,hi,tpl,dp){
    var el = app.regions.inputs.querySelector(sel);
    if(!el) return;
    var said = null;                 /* one message per out-of-range entry */
    el.addEventListener('change', function(){
      var raw = parseFloat(el.value);
      if (!isFinite(raw) || (raw >= lo && raw <= hi)) { said = null; return; }
      if (raw === said) return;
      said = raw;
      app.notify(fill(pick(tpl, app.lang),
        { v: raw, c: Math.min(hi, Math.max(lo, raw)).toFixed(dp) }), { kind:'warn' });
    }, true);
  }

  /* UPSTREAM: Field.prototype.buildControl writes step onto a number input and
     min only when minDisplay is given, so a number field declaring min/max
     loses the browser's own range semantics — the spinner bounds, the mobile
     keypad hint and :invalid styling. The framework still clamps in commit();
     this restores what the old range controls had natively. */
  function nativeRange(app,sel,lo,hi){
    var el = app.regions.inputs.querySelector(sel);
    if(el){ el.min=String(lo); el.max=String(hi); }
  }

  /* UPSTREAM: Field.prototype.syncControl refuses to write into the control
     while it has focus, so after a clamped or unparsable entry the box keeps
     showing the number the tool did not use (spec §6, UI_AUDIT S-9 — the defect
     the audit found in beam_diagrams). On blur, put the value actually in use
     back in the box, drop the stale message and leave the shell in a computed
     state rather than in `error`. */
  function settleOnBlur(app,sel){
    var el = app.regions.inputs.querySelector(sel);
    if(!el) return;
    el.addEventListener('blur', function(){
      var field = null;
      app.panels.forEach(function(p){
        (p.fields||[]).forEach(function(f){ if(f.control===el) field=f; });
      });
      if(field) field.clearError();
      app.sync();
      app.run();
    });
  }

  /* =================== framework v2 (diagram-common.js) =================== */
  var SAMPLE_E=[1e-2,1e-1,1,10,100,1e3,1e5,1e6,1e7];
  var SAMPLE_TAG=SAMPLE_E.map(function(e){return e.toExponential(0);});
  function ekey(pre,i){ return pre+'_at_'+SAMPLE_TAG[i]+'_eV'; }
  function nearest(e){
    var i=Math.round((Math.log10(e)-lgMin)/dLg);
    return Math.max(0,Math.min(N-1,i));
  }
  function dgcOutputs(){
    if(!LAST) return null;
    var d=LAST.d, chi=chiCurve(d.fast);
    var o={
      kT:LAST.kt,
      E_most_probable:LAST.kt,
      E_mean_2kT:2*LAST.kt,
      E_peak_thermal_curve:peakEnergy(d.th),
      E_mean_maxwellian:meanEnergy(d.th),
      E_mean_watt:LAST.wattMean,
      E_peak_watt_chi:peakEnergy(chi)/1e6,
      E_peak_watt_lethargy:peakEnergy(d.fast)/1e6,
      plateau_flatness:plateauFlatness(d.epi),
      amplitude_thermal:maxOf(d.th),
      amplitude_epithermal:maxOf(d.epi),
      amplitude_fast:maxOf(d.fast),
      peak_ratio_thermal_fast:maxOf(d.th)/maxOf(d.fast),
      thermal_fraction_below_cutoff:LAST.frac,
      max_dln_u_dlnE:maxLogSlope(d.total)
    };
    for(var k=0;k<SAMPLE_E.length;k++){
      var i=nearest(SAMPLE_E[k]);
      o[ekey('u_total',k)]=d.total[i];
      o[ekey('u_thermal',k)]=d.th[i];
      o[ekey('u_epithermal',k)]=d.epi[i];
      o[ekey('u_fast',k)]=d.fast[i];
    }
    return o;
  }
  function dgcUnits(){
    var u={T_mod:'K',ratio:'-',kT:'eV',E_most_probable:'eV',E_mean_2kT:'eV',
           E_peak_thermal_curve:'eV',E_mean_maxwellian:'eV',E_mean_watt:'MeV',
           E_peak_watt_chi:'MeV',E_peak_watt_lethargy:'MeV',plateau_flatness:'-',
           amplitude_thermal:'-',amplitude_epithermal:'-',amplitude_fast:'-',
           peak_ratio_thermal_fast:'-',thermal_fraction_below_cutoff:'-',max_dln_u_dlnE:'-'};
    for(var k=0;k<SAMPLE_E.length;k++){
      u[ekey('u_total',k)]='-'; u[ekey('u_thermal',k)]='-';
      u[ekey('u_epithermal',k)]='-'; u[ekey('u_fast',k)]='-';
    }
    return u;
  }
  /* the permalink contract: the same four keys the tool has always written */
  function dgcSerialize(){ return {v:1,T:state.T,r:state.r,lang:document.documentElement.lang}; }
  function applyState(){
    var a=A();
    if(a){ a.sync(); a.run(); }
    else if(bareRender) bareRender();
  }
  function dgcDeserialize(st){
    if(!st||typeof st!=='object') throw new Error('unrecognised state payload');
    var T=Number(st.T), r=Number(st.r);
    if(!isFinite(T)||!isFinite(r)) throw new Error('missing or non-numeric T / ratio');
    if(T<TMIN||T>TMAX) throw new Error('moderator temperature '+T+' K outside '+TMIN+'-'+TMAX+' K');
    if(r<RMIN||r>RMAX) throw new Error('thermalization ratio '+r+' outside '+RMIN+'-'+RMAX);
    state.T=T; state.r=r;
    var a=A();
    if(st.lang&&I18N[st.lang]&&a&&st.lang!==a.lang){
      a.setLang(st.lang);              /* rebuilds the shell and recomputes */
      return;
    }
    if(st.lang&&I18N[st.lang]){ LANG=st.lang; document.title=I18N[LANG].title; }
    applyState();
  }
  function dgcRecord(){
    var out=dgcOutputs(); if(!out) return null;
    return {
      inputs:{T_mod:LAST.T,ratio:LAST.r},
      outputs:out,
      units:dgcUnits(),
      model:{
        equations:[
          'Maxwellian flux: phi_M(E) = C E exp(-E/kT); per unit lethargy u(E) = E phi(E) = C E^2 exp(-E/kT)',
          'phi_M peaks at E = kT; u_M peaks at E = 2kT, which is also the flux-weighted mean energy <E> = INT E phi dE / INT phi dE = 2kT',
          'Slowing down: phi_epi(E) = C/E, i.e. u_epi(E) = const, windowed by sig((lnE-ln(4kT))/0.85)*sig(-(lnE-ln(0.2 MeV))/1.0) with sig(x)=1/(1+exp(-x))',
          'Watt fission spectrum (U-235, thermal fission): chi(E) = C exp(-E/a) sinh(sqrt(bE)), a = 0.988 MeV, b = 2.249 1/MeV, C = 2 exp(-ab/4)/sqrt(pi a^3 b)',
          'Watt mean energy <E> = 3a/2 + a^2 b/4 = 2.0308 MeV; per unit lethargy u_fast(E) = E chi(E)',
          'Each component is normalised to its own maximum on the grid and then weighted: thermal x ratio, epithermal x 0.42, fast x 1',
          'Thermal fraction = INT_0^0.625eV phi dE / INT phi dE with phi(E) = u(E)/E (trapezoid on the log-spaced grid)'
        ],
        ranges:[
          'Moderator temperature T_mod = '+TMIN+' ... '+TMAX+' K',
          'Thermalization ratio = '+RMIN+' ... '+RMAX+' (height of the thermal peak relative to the fast bump)',
          'Energy grid E = 1e-4 ... 1e7 eV, '+N+' log-spaced points (0.01 decade per step)',
          'The Watt mean energy is integrated on a dedicated 0 ... 20 MeV grid so it is not truncated at the 10 MeV edge of the plot'
        ],
        notes:[
          'The relative weighting of the three components is an illustrative recipe fixed by the ratio control and a constant epithermal amplitude of 0.42 - it is not the result of a slowing-down or transport calculation, so the thermal fraction below the cadmium cutoff describes this drawing, not any particular reactor.',
          'The plot is per unit lethargy E phi(E), so the thermal component peaks at 2kT; the most probable energy of the flux per unit energy is kT, and of the neutron density kT/2.',
          'The epithermal plateau is flat only inside its sigmoid window; its flatness over 10 eV - 10 keV is reported as plateau_flatness (max/min).'
        ]
      },
      warnings:[]
    };
  }
  function dgcSections(){
    if(!LAST) return [];
    var d=LAST.d;
    return [{
      title:'E phi(E) per unit lethargy',
      cols:'1fr 1fr 1fr 1fr 1fr',
      head:['E (eV)','total','thermal','epithermal','fast'],
      rows:SAMPLE_E.map(function(e,k){var i=nearest(e);
        return [SAMPLE_TAG[k], d.total[i].toFixed(5), d.th[i].toFixed(5),
                d.epi[i].toFixed(5), d.fast[i].toFixed(5)];}),
      notes:['Each component is normalised to its own maximum and then weighted (thermal x '+LAST.r.toFixed(2)+', epithermal x 0.42, fast x 1).']
    }];
  }
  function dgcHandoff(){ return LAST?{quantities:{T:{value:LAST.T,unit:'K'}}}:null; }
  function dgcApply(payload){
    var q=(payload&&payload.quantities)||{};
    var ignored=Object.keys(q).filter(function(k){return k!=='T';});
    if(!q.T||typeof q.T.value!=='number'||!isFinite(q.T.value))
      return {accepted:[],ignored:ignored.concat(q.T?['T']:[])};
    var T=Math.min(TMAX,Math.max(TMIN,q.T.value));
    if(T!==q.T.value && window.Diagram)
      window.Diagram.notify('Received T = '+q.T.value.toFixed(1)+' K, clamped to the modelled range '
        +TMIN+'-'+TMAX+' K','warn');
    state.T=Math.round(T/TSTEP)*TSTEP;
    applyState();
    return {accepted:['T'],ignored:ignored};
  }
  function dgcPythonCode(){
    return [
'KB    = '+kB+'   # eV/K (CODATA 2018)',
'EMIN  = '+Emin+'; EMAX = '+Emax+'          # eV',
'LGMIN = math.log10(EMIN); LGMAX = math.log10(EMAX)',
'N     = '+N,
'DLG   = (LGMAX - LGMIN)/(N - 1)',
'E     = [10.0**(LGMIN + (i/(N - 1))*(LGMAX - LGMIN)) for i in range(N)]   # eV',
'CUTOFF = '+cutoff+'    # eV, cadmium cutoff',
'A_W    = '+aW+'    # MeV   Watt parameter a (U-235 thermal fission)',
'B_W    = '+bW+'    # 1/MeV Watt parameter b',
'A_EPI  = 0.42     # fixed epithermal amplitude of the illustrative mixture',
'',
'',
'def sig(x):',
'    return 1.0/(1.0 + math.exp(-x))',
'',
'',
'def build(T, r):',
'    """The three per-lethargy components, each normalised to its own maximum, then weighted.',
'',
'    Written as the page writes it: one pass that fills the three curves and tracks their',
'    maxima, then one pass that scales and sums. No array library is involved."""',
'    kt = KB*T',
'    ln_e_on, ln_e_off = math.log(4*kt), math.log(0.2e6)',
'    w_on, w_off = 0.85, 1.0',
'    th = [0.0]*N; epi = [0.0]*N; fast = [0.0]*N',
'    th_max = epi_max = fast_max = 0.0',
'    for i in range(N):',
'        e = E[i]',
'        t = e*e*math.exp(-e/kt)                   # Maxwellian flux per lethargy',
'        th[i] = t',
'        if t > th_max: th_max = t',
'        ln_e = math.log(e)',
'        w = sig((ln_e - ln_e_on)/w_on)*sig(-(ln_e - ln_e_off)/w_off)',
'        epi[i] = w',
'        if w > epi_max: epi_max = w',
'        em = e/1e6',
'        fp = em*math.exp(-em/A_W)*math.sinh(math.sqrt(B_W*em))   # Watt per lethargy',
'        fast[i] = fp',
'        if fp > fast_max: fast_max = fp',
'    total = [0.0]*N',
'    for j in range(N):',
'        th[j] = r*th[j]/th_max',
'        epi[j] = A_EPI*epi[j]/epi_max',
'        fast[j] = fast[j]/fast_max',
'        total[j] = th[j] + epi[j] + fast[j]',
'    return {"th": th, "epi": epi, "fast": fast, "total": total, "kt": kt}',
'',
'',
'def thermal_fraction(total):',
'    below = 0.0; all_ = 0.0',
'    for i in range(N - 1):',
'        phi0 = total[i]/E[i]; phi1 = total[i+1]/E[i+1]',
'        dE = E[i+1] - E[i]',
'        area = 0.5*(phi0 + phi1)*dE',
'        all_ += area',
'        if E[i+1] <= CUTOFF:',
'            below += area',
'        elif E[i] < CUTOFF:',
'            phiC = phi0 + (phi1 - phi0)*((CUTOFF - E[i])/dE)',
'            below += 0.5*(phi0 + phiC)*(CUTOFF - E[i])',
'    return below/all_',
'',
'',
'def peak_energy(arr):',
'    # vertex of the parabola through the three grid points around the maximum, in log10 E',
'    ip = 0',
'    for i in range(N):',
'        if arr[i] > arr[ip]:',
'            ip = i',
'    if ip <= 0 or ip >= N - 1:',
'        return E[ip]',
'    y0, y1, y2 = arr[ip-1], arr[ip], arr[ip+1]',
'    den = y0 - 2*y1 + y2',
'    d = 0.5*(y0 - y2)/den if den != 0 else 0.0',
'    return 10.0**(math.log10(E[ip]) + d*DLG)',
'',
'',
'def mean_energy(u):',
'    s1 = 0.0; s0 = 0.0',
'    for i in range(N - 1):',
'        dE = E[i+1] - E[i]',
'        s1 += 0.5*(u[i] + u[i+1])*dE                     # INT phi E dE = INT u dE',
'        s0 += 0.5*(u[i]/E[i] + u[i+1]/E[i+1])*dE         # INT phi dE',
'    return s1/s0',
'',
'',
'def watt_mean(n=40001, ehi=20.0):',
'    # <E> of the Watt spectrum on a dedicated 0..20 MeV grid  [MeV]',
'    s0 = 0.0; s1 = 0.0; h = ehi/(n - 1)',
'    for i in range(n):',
'        e = i*h',
'        c = math.exp(-e/A_W)*math.sinh(math.sqrt(B_W*e))',
'        w = 0.5 if (i == 0 or i == n - 1) else 1.0',
'        s0 += w*c; s1 += w*c*e',
'    return s1/s0',
'',
'',
'def max_log_slope(u):',
'    m = 0.0; dln = math.log(10.0)*DLG',
'    for i in range(N - 1):',
'        if u[i] <= 0 or u[i+1] <= 0:',
'            continue',
'        sl = abs(math.log(u[i+1]) - math.log(u[i]))/dln',
'        if sl > m: m = sl',
'    return m',
'',
'',
'def plateau_flatness(epi):',
'    mn = float("inf"); mx = 0.0',
'    for i in range(N):',
'        if E[i] < 10 or E[i] > 1e4:',
'            continue',
'        if epi[i] < mn: mn = epi[i]',
'        if epi[i] > mx: mx = epi[i]',
'    return mx/mn',
'',
'',
'def _max(arr):',
'    m = 0.0',
'    for v in arr:',
'        if v > m: m = v',
'    return m',
'',
'',
'SAMPLE_E   = ['+SAMPLE_E.map(function(e){return e.toExponential(0);}).join(', ')+']',
'SAMPLE_TAG = ['+SAMPLE_TAG.map(function(t){return '"'+t+'"';}).join(', ')+']',
'',
'',
'def compute():',
'    T = float(T_MOD); r = float(RATIO)',
'    d = build(T, r)',
'    chi = [d["fast"][i]/E[i] for i in range(N)]',
'    out = {',
'        "kT": d["kt"],',
'        "E_most_probable": d["kt"],',
'        "E_mean_2kT": 2*d["kt"],',
'        "E_peak_thermal_curve": peak_energy(d["th"]),',
'        "E_mean_maxwellian": mean_energy(d["th"]),',
'        "E_mean_watt": watt_mean(),',
'        "E_peak_watt_chi": peak_energy(chi)/1e6,',
'        "E_peak_watt_lethargy": peak_energy(d["fast"])/1e6,',
'        "plateau_flatness": plateau_flatness(d["epi"]),',
'        "amplitude_thermal": _max(d["th"]),',
'        "amplitude_epithermal": _max(d["epi"]),',
'        "amplitude_fast": _max(d["fast"]),',
'        "peak_ratio_thermal_fast": _max(d["th"])/_max(d["fast"]),',
'        "thermal_fraction_below_cutoff": thermal_fraction(d["total"]),',
'        "max_dln_u_dlnE": max_log_slope(d["total"]),',
'    }',
'    for e, tag in zip(SAMPLE_E, SAMPLE_TAG):',
'        i = int(round((math.log10(e) - LGMIN)/DLG))',
'        i = max(0, min(N - 1, i))',
'        for name, arr in (("u_total", d["total"]), ("u_thermal", d["th"]),',
'                          ("u_epithermal", d["epi"]), ("u_fast", d["fast"])):',
'            out["%s_at_%s_eV" % (name, tag)] = arr[i]',
'    return out',
'',
'',
'def fmt(v):',
'    return ("%.6g" % v) if isinstance(v, float) else repr(v)'
    ].join('\n');
  }
  function dgcPython(){
    if(!LAST) return null;
    return {
      code:dgcPythonCode(),
      requires:[],
      scope:'the complete model of this page: the three per-lethargy components (Maxwellian, windowed 1/E, Watt), their normalisation and weighting, the thermal fraction below the cadmium cutoff and every diagnostic in the readout, for the moderator temperature and thermalization ratio shown at export time',
      basis:{kind:'reproduce',
        note:'no library and no substitution: the same closed forms on the same 1101-point '+
          'log-spaced grid, with the three component loops, the running maxima, the trapezoid '+
          'sums and the 40001-point Watt grid all written out in the page\u2019s own order, so the '+
          'script adds the same terms in the same sequence the page does.',
        deviation:'3.8e-15 relative, worst of the fifty-one recorded outputs (the steepest '+
          'log-slope diagnostic, a difference of two logarithms); everything else is at or below '+
          '1e-16, i.e. one unit in the last place of a double'},
      selftest:{tolerance:1e-9,
        note:'left at the value this export used while it still summed with numpy. Written out '+
          'in the page\u2019s own summation order the measured deviation is at the last-bit level, '+
          'so 1e-9 is now a bound rather than the observed difference.'}
    };
  }
  function dgcInit(){
    if(!window.Diagram) return;
    window.Diagram.init({
      id:'spectrum', file:'spectrum.html',
      state:{serialize:dgcSerialize,deserialize:dgcDeserialize},
      record:dgcRecord,
      python:dgcPython,
      handoff:{provides:['T'],accepts:['T'],build:dgcHandoff,apply:dgcApply},
      report:{sections:dgcSections}
    });
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
