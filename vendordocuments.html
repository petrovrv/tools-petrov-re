 "description": {
  "en": "Purpose-based vendor-information planning for equipment and automation packages. It derives information requirements, required maturity at each gate, suggested vendor document containers, and audits a supplier MDR/VDRL for coverage gaps.",
  "uk": "Планування інформації постачальника за призначенням для обладнання та автоматизації. Інструмент формує вимоги до інформації, а не фіксований VDRL, відстежує дозрівання від попереднього до фінального стану та виявляє прогалини другого порядку: FAT без критеріїв, підіймання без центра ваги або ПЗ без відновлюваної базової конфігурації.",
  "de": "Zweckorientierte Planung von Lieferanteninformationen für Ausrüstungs- und Automatisierungspakete. Statt einer festen VDRL werden Informationsanforderungen erzeugt, ihre Reife von vorläufig bis final verfolgt und Lücken zweiter Ordnung erkannt, etwa FAT ohne Abnahmebasis, Heben ohne Schwerpunkt oder Software ohne wiederherstellbare Konfigurationsbaseline.",
  "nl": "Doelgerichte planning van leveranciersinformatie voor apparatuur- en automatiseringspakketten. De tool genereert informatie-eisen in plaats van een vaste VDRL, volgt maturiteit van voorlopig tot definitief en vindt tweede-orde lacunes zoals FAT zonder acceptatiebasis, hijsen zonder zwaartepunt of software zonder herstelbare configuratiebaseline.",
  "fr": "Planification des informations fournisseur par finalité pour équipements et automatismes. L’outil génère des exigences d’information plutôt qu’une VDRL fixe, suit la maturité du préliminaire au final et révèle des lacunes de second ordre : FAT sans base d’acceptation, levage sans centre de gravité ou logiciel sans configuration restaurable.",
  "es": "Planificación de información del proveedor por finalidad para paquetes de equipos y automatización. Genera requisitos de información en lugar de una VDRL fija, sigue la madurez de preliminar a final y detecta brechas de segundo orden como FAT sin base de aceptación, izado sin centro de gravedad o software sin configuración restaurable.",
  "pl": "Planowanie informacji dostawcy według celu dla pakietów urządzeń i automatyki. Narzędzie generuje wymagania informacyjne zamiast stałej VDRL, śledzi dojrzewanie od wersji wstępnej do finalnej i wykrywa luki drugiego rzędu, np. FAT bez kryteriów odbioru, podnoszenie bez środka ciężkości lub oprogramowanie bez odtwarzalnej konfiguracji."
 },

 "limitations": {
  "en": "Rule-based preliminary planning aid, not a contractual VDRL, compliance certificate or jurisdiction-specific certification checker. Project specifications, purchase orders, regulatory requirements and discipline-specific codes remain authoritative. The built-in rule corpus is author engineering methodology informed by the cited standards; it does not reproduce protected standard checklists.",
  "uk": "Попередній rule-based засіб планування, а не контрактний VDRL, сертифікат відповідності чи перевірка сертифікації конкретної юрисдикції. Визначальними залишаються специфікації проєкту, замовлення, регуляторні вимоги та галузеві норми. Вбудований корпус правил є авторською інженерною методикою, сформованою з урахуванням наведених стандартів; захищені таблиці стандартів не відтворюються.",
  "de": "Regelbasiertes Vorplanungswerkzeug, keine vertragliche VDRL, kein Konformitätsnachweis und kein jurisdiktionsspezifischer Zertifizierungsprüfer. Projektspezifikationen, Bestellungen, regulatorische Anforderungen und Fachnormen bleiben maßgebend. Der Regelkorpus ist Autorenmethodik unter Berücksichtigung der genannten Normen und reproduziert keine geschützten Checklisten.",
  "nl": "Regelgebaseerd hulpmiddel voor voorlopige planning, geen contractuele VDRL, conformiteitscertificaat of jurisdictiespecifieke certificatiecheck. Projectspecificaties, inkooporders, regelgeving en vaknormen blijven leidend. De ingebouwde regels zijn auteursmethodiek, geïnformeerd door de genoemde normen, zonder beschermde checklists te reproduceren.",
  "fr": "Outil préliminaire fondé sur des règles, ni VDRL contractuelle, ni certificat de conformité, ni vérificateur de certification propre à une juridiction. Les spécifications, commandes, exigences réglementaires et codes métier restent prépondérants. Le corpus de règles est une méthode d’auteur informée par les normes citées, sans reproduire leurs listes protégées.",
  "es": "Herramienta preliminar basada en reglas, no VDRL contractual, certificado de conformidad ni verificador de certificación jurisdiccional. Las especificaciones, órdenes de compra, requisitos regulatorios y códigos de disciplina siguen siendo autoritativos. El corpus de reglas es metodología del autor informada por las normas citadas, sin reproducir listas protegidas.",
  "pl": "Regułowe narzędzie planowania wstępnego, nie kontraktowa VDRL, certyfikat zgodności ani kontroler certyfikacji właściwy dla jurysdykcji. Specyfikacje projektu, zamówienia, wymagania regulacyjne i normy branżowe pozostają nadrzędne. Wbudowane reguły są autorską metodą inżynierską inspirowaną wskazanymi normami i nie odtwarzają chronionych checklist."

almente, cuándo debe madurar y qué dependencias faltan.","pl":"Opisz pakiet. Planer wyprowadza, jakie informacje są rzeczywiście potrzebne, kiedy muszą dojrzeć i jakich zależności brakuje."},"method":{"en":"The primary object is an information requirement, not a document title. Documents are possible containers for information.","uk":"Podstawowym obiektem jest wymóg informacyjny, a nie nazwa dokumentu. Dokument jest możliwym nośnikiem informacji.","de":"Das Primärobjekt ist eine Informationsanforderung, nicht ein Dokumenttitel. Dokumente sind mögliche Informationsträger.","nl":"Het primaire object is een informatie-eis, niet een documenttitel. Documenten zijn mogelijke informatiedragers.","fr":"L’objet principal est l’exigence d’information, non le titre d’un document. Un document n’est qu’un conteneur possible.","es":"El objeto principal es el requisito de información, no el título del documento. Un documento es solo un posible contenedor.","pl":"Podstawowym obiektem jest wymaganie informacyjne, nie nazwa dokumentu. Dokument jest tylko możliwym nośnikiem."},"future":{"en":"Future requirement","uk":"Майбутня вимога","de":"Spätere Anforderung","nl":"Toekomstige eis","fr":"Exigence future","es":"Requisito futuro","pl":"Przyszłe wymaganie"},"blocker":{"en":"Blocker","uk":"Блокер","de":"Blocker","nl":"Blokkade","fr":"Bloquant","es":"Bloqueo","pl":"Bloker"},"warning":{"en":"Warning","uk":"Попередження","de":"Warnung","nl":"Waarschuwing","fr":"Avertissement","es":"Advertencia","pl":"Ostrzeżenie"},"info":{"en":"Information","uk":"Інформація","de":"Information","nl":"Informatie","fr":"Information","es":"Información","pl":"Informacja"},"resolve_chain":{"en":"Complete the information chain before the dependent activity is released.","uk":"Завершіть інформаційний ланцюг до випуску залежної роботи.","de":"Informationskette vor Freigabe der abhängigen Tätigkeit schließen.","nl":"Voltooi de informatieketen vóór vrijgave van de afhankelijke activiteit.","fr":"Compléter la chaîne d’information avant de libérer l’activité dépendante.","es":"Completar la cadena de información antes de liberar la actividad dependiente.","pl":"Domknąć łańcuch informacji przed zwolnieniem zależnego działania."},"freeze":{"en":"Freeze or validate the affected information before this milestone.","uk":"Зафіксуйте або підтвердьте відповідну інформацію до цього етапу.","de":"Betroffene Information vor diesem Meilenstein freigeben oder validieren.","nl":"Bevries of valideer de betrokken informatie vóór deze mijlpaal.","fr":"Figer ou valider l’information concernée avant ce jalon.","es":"Congelar o validar la información afectada antes de este hito.","pl":"Zamrozić lub zweryfikować informację przed tym kamieniem milowym."},"final_gap":{"en":"Final dossier cannot be final until later changes are incorporated or recorded.","uk":"Фінальне досьє не є фінальним, доки пізніші зміни не внесені або не зафіксовані.","de":"Das Abschlussdossier ist erst final, wenn spätere Änderungen eingearbeitet oder dokumentiert sind.","nl":"Het einddossier is pas definitief nadat latere wijzigingen zijn verwerkt of vastgelegd.","fr":"Le dossier final ne peut être final tant que les modifications ultérieures ne sont pas intégrées ou enregistrées.","es":"El dossier final no puede ser final hasta incorporar o registrar los cambios posteriores.","pl":"Dokumentacja końcowa nie jest finalna, dopóki późniejsze zmiany nie zostaną wprowadzone lub zapisane."},"learn_lift":{"en":"Final mass alone is insufficient for a planned lift. The lifting configuration depends on centre of gravity, permitted lifting points, assembly state and restrictions.","uk":"Самої кінцевої маси недостатньо для планування підіймання. Схема залежить від центра ваги, дозволених точок, стану складання та обмежень.","de":"Die Endmasse allein reicht für einen geplanten Hub nicht aus. Hebekonfiguration hängt von Schwerpunkt, zulässigen Anschlagpunkten, Montagezustand und Einschränkungen ab.","nl":"Alleen de eindmassa is onvoldoende voor een geplande hijs. De configuratie hangt af van zwaartepunt, toegestane hijspunten, assemblagetoestand en beperkingen.","fr":"La masse finale seule ne suffit pas pour un levage planifié. La configuration dépend du centre de gravité, des points de levage autorisés, de l’état d’assemblage et des restrictions.","es":"La masa final por sí sola no basta para planificar un izado. La configuración depende del centro de gravedad, puntos permitidos, estado de montaje y restricciones.","pl":"Sama masa końcowa nie wystarcza do planowania podnoszenia. Konfiguracja zależy od środka ciężkości, dopuszczonych punktów, stanu montażu i ograniczeń."},"learn_tests":{"en":"FAT verifies the factory configuration; FIT addresses integration between automation packages before site; SAT verifies the installed package at site; SIT addresses integration at site. Not every package needs all four.","uk":"FAT перевіряє заводську конфігурацію; FIT — інтеграцію пакетів автоматики до майданчика; SAT — встановлений пакет на майданчику; SIT — інтеграцію на майданчику. Не кожному пакету потрібні всі чотири.","de":"FAT prüft die Werkskonfiguration; FIT die Integration mehrerer Automatisierungspakete vor Ort; SAT das installierte Paket am Standort; SIT die Integration am Standort. Nicht jedes Paket benötigt alle vier.","nl":"FAT verifieert de fabrieksconfiguratie; FIT de integratie tussen automatiseringspakketten vóór locatie; SAT het geïnstalleerde pakket op locatie; SIT de integratie op locatie. Niet elk pakket heeft alle vier nodig.","fr":"FAT vérifie la configuration en usine; FIT l’intégration entre lots d’automatisme avant site; SAT le lot installé sur site; SIT l’intégration sur site. Tous les lots n’ont pas besoin des quatre.","es":"FAT verifica la configuración en fábrica; FIT la integración entre paquetes de automatización antes del sitio; SAT el paquete instalado; SIT la integración en el sitio. No todos los paquetes necesitan las cuatro.","pl":"FAT sprawdza konfigurację fabryczną; FIT integrację pakietów automatyki przed obiektem; SAT pakiet zainstalowany na obiekcie; SIT integrację na obiekcie. Nie każdy pakiet potrzebuje wszystkich czterech."},"learn_status":{"en":"Unknown, TBD, not requested, not received and N/A are different states. N/A needs a recorded reason because it removes an information obligation.","uk":"Unknown, TBD, не запитано, не отримано та N/A — різні стани. Для N/A потрібна зафіксована причина, бо він прибирає інформаційне зобов’язання.","de":"Unbekannt, TBD, nicht angefordert, nicht erhalten und N/A sind verschiedene Zustände. N/A braucht eine dokumentierte Begründung, weil damit eine Informationspflicht entfällt.","nl":"Onbekend, TBD, niet aangevraagd, niet ontvangen en N.v.t. zijn verschillende toestanden. N.v.t. vereist een vastgelegde reden omdat een informatieplicht vervalt.","fr":"Inconnu, TBD, non demandé, non reçu et N/A sont des états distincts. N/A exige une justification enregistrée car il supprime une obligation d’information.","es":"Desconocido, TBD, no solicitado, no recibido y N/A son estados distintos. N/A necesita una justificación registrada porque elimina una obligación de información.","pl":"Nieznane, TBD, niezamówione, nieotrzymane i N/D to różne stany. N/D wymaga zapisanej przyczyny, bo usuwa obowiązek informacyjny."}},"milestones":{"rfq":{"en":"Enquiry / RFQ","uk":"Запит / RFQ","de":"Anfrage / RFQ","nl":"Aanvraag / RFQ","fr":"Consultation / RFQ","es":"Consulta / RFQ","pl":"Zapytanie / RFQ"},"bid":{"en":"Bid / technical evaluation","uk":"Пропозиція / технічна оцінка","de":"Angebot / technische Bewertung","nl":"Offerte / technische evaluatie","fr":"Offre / évaluation technique","es":"Oferta / evaluación técnica","pl":"Oferta / ocena techniczna"},"approval":{"en":"Post-order / approval","uk":"Після замовлення / погодження","de":"Nach Bestellung / Freigabe","nl":"Na bestelling / goedkeuring","fr":"Après commande / approbation","es":"Pospedido / aprobación","pl":"Po zamówieniu / zatwierdzenie"},"manufacture":{"en function degrade(host){

 if(!a)return null;

 try{document.title=title;}catch(e){}

 var h1=document.createElement('h1');h1.textContent=title;

function providerFor(i){return V2.purchaserIds[i.id]?'purchaser':(V2.sharedIds[i.id]?'shared':'supplier');}
function reviewerFor(i){if(i.family==='quality')return loc(V2.ui.qa);if(i.family==='testing'||i.family==='operation'||i.family==='final')return loc(V2.ui.operations);if(i.family==='control'||i.family==='software')return loc(V2.ui.automation);if(i.family==='general')return loc(V2.ui.package_eng);return loc(V2.ui.discipline);}
function criticalityFor(i){return V2.blockingIds[i.id]?'blocking':(['general','quality','testing','final'].indexOf(i.family)>=0?'required':'required');}
var MAT_RANK={unknown:0,preliminary:1,reviewed:2,approved:3,final:4,as_built:5};
function requiredMaturity(i,s){if(rank(s.target)<rank(i.first))return 'unknown';if(rank(s.target)>=rank(i.final)){return V2.asBuiltIds[i.id]?'as_built':'final';}if(i.family==='testing'||i.id==='ga'||i.id==='interface_register'||i.id==='itp')return 'approved';return rank(s.target)>rank(i.first)?'approved':'preliminary';}
function currentMaturity(o,st){if(o&&o.maturity&&MAT_RANK[o.maturity]!=null)return o.maturity;if(st==='final')return 'final';if(st==='accepted')return 'approved';if(st==='review')return 'reviewed';if(st==='received')return 'preliminary';return 'unknown';}
function statusMeets(r){if(r.status==='na')return true;var need=r.required_maturity,have=r.maturity;if(need==='unknown')return true;if(MAT_RANK[have]<MAT_RANK[need])return false;if(need==='preliminary')return ['received','review','accepted','final'].indexOf(r.status)>=0;if(need==='reviewed')return ['review','accepted','final'].indexOf(r.status)>=0;if(need==='approved')return ['accepted','final'].indexOf(r.status)>=0;if(need==='final'||need==='as_built')return r.status==='final';return false;}

/* ---- §2.1 canonical lifecycle <-> this tool's milestone vocabulary ----
   This tool's nine milestones start at RFQ: it has no concept of concept,
   basic or detailed design, nor of operations, close-out or decommissioning.
   Those six canonical stages are reported unmapped and the user's target is
   left alone — never rounded to a neighbouring stage (§3.4).

   `factory` is the canonical home of manufacture, prefat and shipment: the
   milestones a package is worked toward while it is at the supplier's works.
   The tool's `fat` flag is NOT a stage — it is a lifecycle *activity* of the
   package ("this package has a factory acceptance test"), true from RFQ
   onward, and it travels in package.activities. Writing lifecycle:'factory'
   because fat==='yes' would be a category error, so the flag never reaches
   the lifecycle vocabulary; only the prefat milestone does.                */
var PKG_MS_TO={rfq:'procurement',bid:'procurement',approval:'procurement',manufacture:'factory',prefat:'factory',shipment:'factory',installation:'construction',commission:'commissioning',handover:'handover'};
/* canonical -> local: the entry milestone of each canonical stage this tool

var PKG_MS_FROM={procurement:'rfq',factory:'manufacture',construction:'installation',commissioning:'commission',handover:'handover'};
function pkgLifecycleOf(ms){ return Object.prototype.hasOwnProperty.call(PKG_MS_TO,String(ms))?PKG_MS_TO[String(ms)]:''; }

/* ---- package binding (§2.2) ----
   The tool holds one free-text `tag`. structure.packages is interfacebuilder's
   register and may arrive with system_name filled and system_id empty. This
   resolves the tag to a real package id and binds only when it finds one; it
   never puts a name in an id field and never invents a PKG- id that
   interfacebuilder did not issue. The third attempt asks the shared
   derivation what id that name *would* have produced and binds only if that
   id is actually present. */
var PKGCTX={packages:[],interfaces:[],flags:[],register:[],package_ref:'',package_name:'',system_id:'',system_name:'',bound:false};
function pkgNorm(s){ return String(s==null?'':s).trim().toLowerCase(); }
function pkgResolvePackage(tag,rows){

 var t=pkgNorm(tag); if(!t||!rows.length) return null;
 var i;
 for(i=0;i<rows.length;i++) if(pkgNorm(rows[i].id)===t) return rows[i];
 for(i=0;i<rows.length;i++) if(pkgNorm(rows[i].name)===t) return rows[i];
 var d=null; try{ d=window.DiagramProject&&DiagramProject.deriveId('PKG',String(tag)); }catch(e){ d=null; }

}

/* ---- vendor_documents[] (§2.3) ----
   One record per suggested vendor document container. `id` is the tool's own
   stable container key with a VD- prefix; §2.3's slug-of-the-human-name
   scheme is deliberately NOT used here, because this tool's human names are
   localised into seven languages and a name-derived id would change when the
   user switches language. A stable id beats a uniform one. */
function pkgTrueKeys(map,s){ return Object.keys(map).filter(function(k){ return yes(s[k]); }); }
function pkgScope(s){
 return { ref:PKGCTX.package_ref||'', name:String(PKGCTX.package_name||s.tag||''),
          system_id:PKGCTX.system_id||'', system_name:PKGCTX.system_name||'',
          type:String(s.package_type||''), supplier_status:String(s.supplier_status||''),
          supply_character:String(s.supply_character||''),
          disciplines:pkgTrueKeys(DATA.scope,s), activities:pkgTrueKeys(DATA.activities,s) };
}
/* a canonical token, derived from the data and never from the localised
   audit_status label: a stored field that changes with the UI language is
   not a canonical field. */
function pkgAuditToken(d,audited){ return d.audit?'listed':(audited?'missing':'not_audited'); }
function pkgDocsOut(s,R){
 var res=R||solve(s), scope=pkgScope(s), ifaceIds=pkgInterfacesForPackage();

  return { id:'VD-'+d.id, label:String(d.title||''), container_id:String(d.id||''),
           package:pdeep(scope),
           target_milestone:String(s.target||''), target_lifecycle:pkgLifecycleOf(s.target),
           first_milestone:String(d.first||''), first_lifecycle:pkgLifecycleOf(d.first),
           final_milestone:String(d.final||''), final_lifecycle:pkgLifecycleOf(d.final),
           critical:!!d.critical,
           audit_status:pkgAuditToken(d,(res.vendor_docs||[]).length>0),
           vendor_reference:String((d.audit&&d.audit.reference)||''),
           requirement_ids:(d.requirements||[]).slice(),

           interface_ids:(d.requirements||[]).indexOf('interface_register')>=0?ifaceIds.slice():[] };

}
/* §2.3 — uniqueness is tested on the EMITTED id, never on the name: two names
   can slug to one id, and a name-uniqueness check would pass while colliding
   ids shipped. A collision refuses the save; it never takes a numeric suffix,
   which would hand two different documents one identity on the next run. */
function pkgIdProblems(rows){
 var seen={},dup=[];
 (rows||[]).forEach(function(r){ var id=String(r.id||''); if(seen[id]&&dup.indexOf(id)<0) dup.push(id); seen[id]=1; });
 return dup.sort();
}
/* The ids are this tool's own stable container keys, which §2.3 now names the
   preferred case: a stable id survives a rename and every flag against it
   survives with it. They are ASCII and language-independent by construction,
   and this is what asserts that nothing localised leaks into an id. */
function pkgIdIsStable(id){ return /^VD-[a-z0-9_]+$/.test(String(id)); }

/* The inverse map, declared in `reads` and applied on Load by
   pkgApplyRegister(): a tool that cannot reopen what it wrote is a dead end for
   the user, so this register is read as well as written. §3.2 wants the mapping
   lossless in both directions, and this is the other direction. */
function pkgDocsIn(rows){
 rows=Array.isArray(rows)?rows:[]; if(!rows.length) return null;

 s.supply_character=String(sc.supply_character||DEFAULTS.supply_character);
 s.target=String(rows[0].target_milestone||DEFAULTS.target);
 Object.keys(DATA.scope).forEach(function(k){ s[k]=(sc.disciplines||[]).indexOf(k)>=0?'yes':'no'; });
 Object.keys(DATA.activities).forEach(function(k){ s[k]=(sc.activities||[]).indexOf(k)>=0?'yes':'no'; });
 return s;
}

/* ---- interfaces (§5): read, and actually rendered ---- */
function pkgInterfaceRows(){
 var ref=PKGCTX.package_ref||'', nm=pkgNorm(PKGCTX.package_name);
 return (PKGCTX.interfaces||[]).filter(function(x){
  if(!x||typeof x!=='object') return false;
  var a=String(x.side_a_id||''), b=String(x.side_b_id||'');
  if(ref&&(a===ref||b===ref)) return true;
  return !!nm&&(pkgNorm(a)===nm||pkgNorm(b)===nm);

}
function pkgInterfacesForPackage(){ return pkgInterfaceRows().map(function(x){ return String(x.id||''); }).filter(Boolean); }

/* ---- apply the register this tool owns ----
   The register may legitimately hold records for more than one package, so only
   the rows whose package matches the one this session is bound to are applied;
   the rest are counted, left alone and reported. */
function pkgSplitRegister(rows,ref,name){
 var nm=pkgNorm(name), mine=[], other=[];
 (Array.isArray(rows)?rows:[]).forEach(function(d){
  if(!d||typeof d!=='object'||Array.isArray(d)){ other.push(d); return; }
  var pr=(d.package&&typeof d.package==='object')?d.package:{};
  var hit=(ref&&String(pr.ref||'')===ref)||(!!nm&&pkgNorm(pr.name)===nm)||(!ref&&!nm);
  (hit?mine:other).push(d);

}
function pkgApplyRegister(rows,st,applied,replaced,notes){
 PKGCTX.register=pdeep(rows)||[];
 var split=pkgSplitRegister(rows,PKGCTX.package_ref,PKGCTX.package_name||st.tag);
 if(!split.mine.length){ if(split.other.length) notes.push(Pt('register_other',{n:split.other.length})); return null; }
 var was=pkgDocsIn(split.mine); if(!was) return null;
 var keys=['tag','package_type','supplier_status','supply_character','target']
   .concat(Object.keys(DATA.scope)).concat(Object.keys(DATA.activities));
 var changed=[];
 keys.forEach(function(k){ if(String(st[k])!==String(was[k])){ changed.push(k); st[k]=was[k]; } });
 applied.push(Pt('field_docs'));
 if(changed.length) replaced.push(Pt('field_docs')+': '+changed.join(', '));
 notes.push(Pt('register_in',{n:split.mine.length}));
 if(split.other.length) notes.push(Pt('register_other',{n:split.other.length}));
 return was.target;
}

/* ---- apply what this tool reads (§3.1: from the Load button only) ---- */
function pkgApply(p,target){
 var st=target||state, applied=[],unmapped=[],replaced=[],notes=[];
 function setField(labelKey,key,value){
  var was=st[key];
  if(String(was)===String(value)) return;
  if(String(was||'').trim()) replaced.push(Pt(labelKey)+': “'+String(was)+'” → “'+String(value)+'”');
  st[key]=value; applied.push(Pt(labelKey));
 }
 PKGCTX.packages=[]; PKGCTX.interfaces=[]; PKGCTX.flags=[]; PKGCTX.register=[];
 PKGCTX.package_ref=''; PKGCTX.package_name=''; PKGCTX.system_id=''; PKGCTX.system_name=''; PKGCTX.bound=false;
 var projectMs=null, projectStage='';
 var pr=p&&p.project;
 if(pr&&typeof pr==='object'){
  if(pr.name!=null) setField('field_project','project_name',String(pr.name||''));
  if(pr.lifecycle!=null&&String(pr.lifecycle)){
   projectStage=String(pr.lifecycle);
   var ms=Object.prototype.hasOwnProperty.call(PKG_MS_FROM,projectStage)?PKG_MS_FROM[projectStage]:null;
   if(ms){ projectMs=ms; setField('field_target','target',ms); }

  }

 var stc=p&&p.structure;
 if(stc&&typeof stc==='object'&&Array.isArray(stc.packages)&&stc.packages.length){
  PKGCTX.packages=pdeep(stc.packages)||[];
  notes.push(Pt('packages_seen',{n:PKGCTX.packages.length}));
  /* §3.4: the Load button is the visible action, so a blank tag with exactly
     one candidate may be filled; several candidates are shown, never chosen. */
  if(!String(st.tag||'').trim()&&PKGCTX.packages.length===1) setField('field_tag','tag',String(PKGCTX.packages[0].name||PKGCTX.packages[0].id||''));
  var hit=pkgResolvePackage(st.tag,PKGCTX.packages);
  if(hit){
   PKGCTX.package_ref=String(hit.id||''); PKGCTX.package_name=String(hit.name||'');
   PKGCTX.system_id=String(hit.system_id||''); PKGCTX.system_name=String(hit.system_name||'');
   PKGCTX.bound=true;
   notes.push(Pt('bound',{id:PKGCTX.package_ref}));
   /* §2.2 — interfacebuilder holds only a free-text system name, so this is
      the normal case, not an error. Say so rather than matching nothing. */
   if(!PKGCTX.system_id&&PKGCTX.system_name) notes.push(Pt('system_name_only',{name:PKGCTX.package_name}));
  } else {
   PKGCTX.package_name=String(st.tag||'');

    specific statement of what this package was planned to. */

  var regMs=pkgApplyRegister(p.vendor_documents,st,applied,replaced,notes);
  /* §3.4 — both values shown, and which one is in effect said plainly. */

   notes.push(Pt('target_conflict',{stage:projectStage,project_ms:mlab(projectMs),register_ms:mlab(regMs)}));

}

/* ---- panel ---- */
var pkgBox=null, pkgLines=[];
function pkgLabels(keys){ return keys.map(function(k){ return DiagramProject.sectionLabel(k,siteLang())||k; }).join(', '); }
function pkgPaint(){
 if(!pkgBox) return;
 while(pkgBox.firstChild) pkgBox.removeChild(pkgBox.firstChild);
 var lines=[];
 if(!PKG_OK()||!DiagramProject.storageOk()) lines.push(Pt('storageOff'));
 else {
  var m=null; try{ m=DiagramProject.peek(); }catch(e){ m=null; }
  if(m) lines.push(Pt('available',{project:m.project||'—',rev:m.revision,when:(m.updated_at||'').replace('T',' ').replace('Z',' UTC')}));
  else lines.push(Pt('none'));

 lines.forEach(function(t){
  var q=document.createElement('p');
  q.style.cssText='margin:0 0 .45em;font-size:.85em;line-height:1.45;overflow-wrap:anywhere;color:var(--muted,#6b7280);';
  q.textContent=t; pkgBox.appendChild(q);

 a.textContent=Pt('continueIn',{tool:(PKG_NEXT[siteLang()]||PKG_NEXT.en)});

}
function pkgSay(list){ pkgLines=list.filter(function(x){return !!x;}); pkgPaint(); }
function pkgReportFor(r,out){
 var msgs=[];
 if(out&&out.applied&&out.applied.length) msgs.push(Pt('applied',{list:out.applied.join(', ')}));
 if(out&&out.replaced&&out.replaced.length) msgs.push(Pt('replaced',{list:out.replaced.join('; ')}));
 if(out&&out.unmapped&&out.unmapped.length) msgs.push(Pt('unmapped',{list:out.unmapped.join('; ')}));
 if(out&&out.notes&&out.notes.length) msgs=msgs.concat(out.notes);
 msgs.push(r.ignored&&r.ignored.length?Pt('ignored',{list:pkgLabels(r.ignored)}):Pt('ignoredNone'));
 return msgs;
}
function pkgLoadNow(){
 if(!PKG_OK()){ pkgSay([Pt('storageOff')]); return null; }
 var r=null; try{ r=DiagramProject.load(); }catch(e){ r=null; }
 if(!r){ pkgSay([Pt('none')]); return null; }
 var out=pkgApply(r.package);
 if(ui){ try{ ui.sync(); ui.run(); }catch(e){} }
 pkgSay(pkgReportFor(r,out));
 return r;
}
function pkgSaveNow(){
 if(!PKG_OK()){ pkgSay([Pt('storageOff')]); return null; }
 var rows=pkgDocsOut(state);
 /* §2.3 — tested on the emitted id, and a collision refuses the save rather
    than taking a numeric suffix. */
 var dup=pkgIdProblems(rows);
 if(dup.length){ pkgSay([Pt('id_collision',{list:dup.join(', ')})]); return {ok:false,reason:'id-collision',written:[],rejected:[],duplicates:dup}; }
 /* Only the register this tool owns. Never `deliverables`, never a whole
    section that would swallow another owner's array (§2.3). */
 var patch={ vendor_documents:rows };
 var r=null; try{ r=DiagramProject.save(patch); }catch(e){ r=null; }
 if(r&&r.reason==='rejected'){ pkgSay([Pt('refused',{list:pkgLabels(r.rejected)})]); return r; }
 if(!r||!r.ok){ pkgSay([Pt(r&&r.reason==='quota'?'quota':'storageOff')]); return r; }
 var msgs=[Pt('saved',{list:pkgLabels(r.written),rev:r.package_revision}),
           Pt('docs_out',{n:rows.length,name:(PKGCTX.package_name||state.tag||'—')})];
 msgs.push(Pt('deliverables_kept'));
 if(!r.stored) msgs.push(Pt(r.reason==='quota'?'quota':'storageOff'));

}
function pkgExportNow(){

 var r=DiagramProject.exportFile();

 return r;
}
function pkgImportNow(text){
 if(!PKG_OK()){ pkgSay([Pt('storageOff')]); return; }
 DiagramProject.importFile(String(text||'')).then(function(r){
  if(!r||r.error||!r.package){ pkgSay([Pt('badFile')]); return; }
  var out=pkgApply(r.package);
  if(ui){ try{ ui.sync(); ui.run(); }catch(e){} }
  pkgSay(pkgReportFor(r,out));

}
function pkgPanel(){
 if(!ui) return;
 ui.panel({ id:'pkg', slot:'inputs', title:P('panel'), collapsible:true, collapsed:false,
  fields:[{ id:'pkg-status', type:'custom', label:P('status'), render:function(box){ pkgBox=box; pkgPaint(); } }],
  actionsAlign:'end',

                     run:function(data){ pkgImportNow(data); } })
  ]});

}
var pkgOldBuild=buildInterface;
buildInterface=function(){
 /* Wrap the framework's app() so the flags land on the row they concern (§2.3)
    without editing this tool's own compute function and without touching
    solve(), so no computed value can move. */
 try{
  if(window.DiagramUI&&!DiagramUI.__pkgWrapped){
   var _app=DiagramUI.app;
   DiagramUI.app=function(cfg){
    try{
     if(cfg&&cfg.id==='vendordocuments'&&cfg.on&&typeof cfg.on.compute==='function'){
      var oldCompute=cfg.on.compute;
      cfg.on.compute=function(s){ var r=oldCompute.call(this,s); try{ pkgDecorate(r,s); }catch(e){} return r; };
     }
    }catch(e){}

   };

  }

};

/* ---- flag display (§2.3; agentCI REPORT.md §6) ----
   CI_FLAG_DISPLAY is extracted from changeimpact.html by brace matching and its
   shape asserted before use — 17 label objects, seven languages each, every
   placeholder intact. Not retyped and not retranslated. */
function CIt(k,vars){ var o=CI_FLAG_DISPLAY[k]||{en:k}, l=siteLang(); var s=(o&&(o[l]||o.en))||k;
 Object.keys(vars||{}).forEach(function(v){ s=s.split('{'+v+'}').join(String(vars[v])); }); return s; }
/* §6.3 — a kind with no label (a retired `decision`, say) is shown with its RAW
   value; it is never guessed at, and never rendered as the word "undefined". */
function CIkind(k){ return CI_FLAG_DISPLAY['kind_'+String(k)]?CIt('kind_'+String(k)):((window.DiagramProject&&DiagramProject.kindLabel)?DiagramProject.kindLabel(String(k),siteLang()):String(k)); }
function CIhasKind(k){ return typeof k==='string'&&k!==''&&k!=='undefined'&&k!=='null'; }
/* §6.2 — importFile() does not validate and must not, so a loaded file can carry
   a string, a number, null, an array or an object with none of the seven fields.
   Guard every field access with this first. */
function isFlagObject(f){ return !!f && typeof f==='object' && !Array.isArray(f); }
function flagRawText(f){ try{ var t=JSON.stringify(f); return t===undefined?String(f):t; }catch(e){ return String(f); } }
/* §6.1 — raised_against_revision is optional; an em-dash, never undefined/null/?. */
function flagRev(f){ var n=f.raised_against_revision; return (n===undefined||n===null)?'—':n; }
/* This tool owns exactly one kind. `interface` is NOT one of its kinds — it is a
   register it displays but does not own, which §2.3 now lets it annotate in place. */
var PKG_MY_KINDS=['vendor_document'];
var PKG_SHOWN_KINDS=['interface'];

/* §6.2 — every entry lands in exactly one bucket and all of them are visible.
   Orphan matching runs over the merged local ∪ package id view: a flag must not
   be called orphaned when the user can see the row on screen, nor when the
   loaded package resolves it. */
function pkgFlagBuckets(myIds,shownIds){
 var mine={},orphan=[],foreign=[],shown={},seen=0;
 var my=(myIds||[]).slice(), sh=(shownIds||[]).slice();
 (PKGCTX.flags||[]).forEach(function(f){
  seen++;
  if(!isFlagObject(f)){ foreign.push({raw:flagRawText(f),kind:null,flag:f}); return; }
  var kind=String(f.target_kind), id=String(f.target_id);
  if(PKG_MY_KINDS.indexOf(kind)>=0){
   if(my.indexOf(id)>=0){ (mine[id]=mine[id]||[]).push(f); } else orphan.push(f);
   return;
  }
  if(PKG_SHOWN_KINDS.indexOf(kind)>=0&&sh.indexOf(id)>=0){ (shown[id]=shown[id]||[]).push(f); return; }
  foreign.push({raw:flagRawText(f),kind:CIhasKind(f.target_kind)?kind:null,flag:f});
 });
 return {mine:mine,orphan:orphan,foreign:foreign,shown:shown,seen:seen,
  placed:Object.keys(mine).reduce(function(a,k){return a+mine[k].length;},0)
        +Object.keys(shown).reduce(function(a,k){return a+shown[k].length;},0)};
}
/* §6.1 — the flag word from the display strings (never the raw enum), the reason
   VERBATIM, the origin line, and notEdited once per item. */
function pkgFlagText(list,attributed){
 var out=[];
 if(list.length>1) out.push(CIt('heading')+' ('+CIt('count',{n:list.length})+')');
 list.forEach(function(f){
  var word=CI_FLAG_DISPLAY[String(f.flag)]?CIt(String(f.flag)):String(f.flag);
  out.push(word+' — '+String(f.reason==null?'':f.reason));
  out.push(CIt('origin',{tool:String(f.raised_by==null?'':f.raised_by),when:String(f.raised_at==null?'':f.raised_at),rev:flagRev(f)}));
  if(attributed) out.push(CIkind(f.target_kind));
 });
 out.push(CIt('notEdited'));
 return out.join(' · ');
}

/* Decorate the computed view. Wrapping DiagramUI.app lets the flags sit on the
   row they concern (§2.3) without editing the tool's own compute function, and
   without touching solve(), so no computed value can move. Nothing here offers
   to edit, resolve or dismiss a row this tool does not own — and `flags` is not
   in this tool's `writes`, so save({flags:…}) is refused by the runtime anyway. */
function pkgDecorate(view,s){
 /* `tables` is the key diagram-ui.js renders, and the key the other seven
    project-delivery tools use. This tool returned its three result tables under
    `sections:` — a spelling the framework knows nothing about — so findings,
    suggested documents and information requirements were computed and discarded
    on every load. Renamed at source in on.compute; the outside alias that stood
    in for it is gone. Pure rename: same array, same content, same order. */
 if(!view||!Array.isArray(view.tables)) return;
 if(!last) return;
 var rows=pkgDocsOut(s,last), myIds=rows.map(function(r){ return r.id; });
 /* local ∪ package: ids this tool would emit now, plus ids already in the
    loaded register (a document dropped from the current scope is still a real
    id a flag may legitimately name). */
 (PKGCTX.register||[]).forEach(function(d){ if(isFlagObject(d)&&d.id&&myIds.indexOf(String(d.id))<0) myIds.push(String(d.id)); });
 var ifs=pkgInterfaceRows(), shownIds=ifs.map(function(x){ return String(x.id||''); });
 var B=pkgFlagBuckets(myIds,shownIds);
 /* 1. in place, on this tool's own register rows */
 var docSec=view.tables.filter(function(x){ return x.title===V2.ui.suggested_docs; })[0];
 if(docSec&&Object.keys(B.mine).length){
  docSec.head=docSec.head.concat([CI_FLAG_DISPLAY.heading]);
  docSec.rows.forEach(function(row,i){
   var id=rows[i]?rows[i].id:null, list=(id&&B.mine[id])||[];
   row.cells=row.cells.concat([list.length?pkgFlagText(list,false):'']);
   if(list.length) row.tone=row.tone||'warn';
  });
 }
 /* 2. in place, on a register this tool displays but does not own (§2.3):
       read-only, attributed, no edit / resolve / dismiss affordance. */
