              'W równaniu z 1991 roku log V = 5,8 − 1710/T + 0,67 log fCO2 (T w K, V w mm/rok) szybkość podwaja się mniej więcej co 15–20 °C. Dotyczy to tylko sytuacji, zanim powstanie ochronna warstwa węglanu żelaza, zwykle powyżej 60–90 °C; tam krzywa na wykresie opada. Pułapka: przyjmuj najwyższą temperaturę zwilżonego odcinka, nie średnią.') },
          fugacity: { title: T('CO2 Partial Pressure and Fugacity', 'Парціальний тиск і фугітивність CO2', 'CO2-Partialdruck und Fugazität', 'CO2-partiële druk en fugaciteit', 'Pression partielle et fugacité du CO2', 'Presión parcial y fugacidad del CO2', 'Ciśnienie cząstkowe i lotność CO2'),
            body: T('pCO2 = yCO2·P (bar) is the driving force. At high pressure the gas is non-ideal: fCO2 = a·pCO2 with log a = P·(0.0031 − 1.4/T), so a < 1 (about 0.88 at 50 bar and 60 °C) and the 1991 rate falls below the ideal-gas value. Pitfall: yCO2 is the mole fraction in the gas phase, not the CO2 content of the liquid.',
              'pCO2 = yCO2·P (бар) — рушійна сила. За високого тиску газ неідеальний: fCO2 = a·pCO2, log a = P·(0,0031 − 1,4/T), тож a < 1 (близько 0,88 при 50 бар і 60 °C), і швидкість за моделлю 1991 нижча за значення для ідеального газу. Пастка: yCO2 — мольна частка в газовій фазі, а не вміст CO2 у рідині.',
              'pCO2 = yCO2·P (bar) ist die treibende Kraft. Bei hohem Druck ist das Gas nicht ideal: fCO2 = a·pCO2 mit log a = P·(0,0031 − 1,4/T), also a < 1 (etwa 0,88 bei 50 bar und 60 °C), und die Rate nach 1991 liegt unter dem Idealgaswert. Falle: yCO2 ist der Molanteil in der Gasphase, nicht der CO2-Gehalt der Flüssigkeit.',
              'pCO2 = yCO2·P (bar) is de drijvende kracht. Bij hoge druk is het gas niet ideaal: fCO2 = a·pCO2 met log a = P·(0,0031 − 1,4/T), dus a < 1 (circa 0,88 bij 50 bar en 60 °C) en de snelheid volgens 1991 ligt onder de idealegaswaarde. Valkuil: yCO2 is de molfractie in de gasfase, niet het CO2-gehalte van de vloeistof.',
              'pCO2 = yCO2·P (bar) est la force motrice. À haute pression le gaz n’est pas idéal : fCO2 = a·pCO2 avec log a = P·(0,0031 − 1,4/T), donc a < 1 (environ 0,88 à 50 bar et 60 °C) et la vitesse de 1991 est inférieure à celle du gaz parfait. Piège : yCO2 est la fraction molaire dans la phase gazeuse, pas la teneur en CO2 du liquide.',
              'pCO2 = yCO2·P (bar) es la fuerza impulsora. A alta presión el gas no es ideal: fCO2 = a·pCO2 con log a = P·(0,0031 − 1,4/T), así que a < 1 (unos 0,88 a 50 bar y 60 °C) y la velocidad de 1991 queda por debajo del valor de gas ideal. Trampa: yCO2 es la fracción molar en la fase gaseosa, no el contenido de CO2 del líquido.',
              'pCO2 = yCO2·P (bar) jest siłą napędową. Przy wysokim ciśnieniu gaz nie jest idealny: fCO2 = a·pCO2, log a = P·(0,0031 − 1,4/T), więc a < 1 (około 0,88 przy 50 bar i 60 °C), a szybkość z modelu 1991 jest niższa niż dla gazu idealnego. Pułapka: yCO2 to udział molowy w fazie gazowej, a nie zawartość CO2 w cieczy.') },
          scale: { title: T('Protective FeCO3 Scale', 'Захисний шар FeCO3', 'Schützende FeCO3-Schicht', 'Beschermende FeCO3-laag', 'Dépôt protecteur FeCO3', 'Capa protectora FeCO3', 'Ochronna warstwa FeCO3'),
            body: T('Above the scaling temperature Tscale = 2400/(6.7 + 0.6 log fCO2) an iron carbonate film forms and the rate is multiplied by Fscale, log Fscale = 2400/T − 2400/Tscale (≤ 1). Higher fCO2 lowers Tscale: about 87 °C at fCO2 ≈ 1 bar, about 66 °C at 4 bar. Pitfall: high velocity, low pH or upsets can strip the film, so do not take this credit without evidence.',
              'Вище температури утворення шару Tscale = 2400/(6,7 + 0,6 log fCO2) утворюється плівка карбонату заліза, і швидкість множиться на Fscale, log Fscale = 2400/T − 2400/Tscale (≤ 1). Більша fCO2 знижує Tscale: близько 87 °C при fCO2 ≈ 1 бар, близько 66 °C при 4 бар. Пастка: висока швидкість, низький pH чи збурення можуть зірвати плівку, тож не враховуйте цей ефект без доказів.',
              'Oberhalb der Deckschichttemperatur Tscale = 2400/(6,7 + 0,6 log fCO2) bildet sich ein Eisencarbonatfilm, und die Rate wird mit Fscale multipliziert, log Fscale = 2400/T − 2400/Tscale (≤ 1). Höhere fCO2 senkt Tscale: etwa 87 °C bei fCO2 ≈ 1 bar, etwa 66 °C bei 4 bar. Falle: hohe Geschwindigkeit, niedriger pH oder Störungen können den Film abtragen, diese Gutschrift also nicht ohne Nachweis ansetzen.',
              'Boven de laagvormingstemperatuur Tscale = 2400/(6,7 + 0,6 log fCO2) vormt zich een ijzercarbonaatfilm en wordt de snelheid vermenigvuldigd met Fscale, log Fscale = 2400/T − 2400/Tscale (≤ 1). Hogere fCO2 verlaagt Tscale: circa 87 °C bij fCO2 ≈ 1 bar, circa 66 °C bij 4 bar. Valkuil: hoge snelheid, lage pH of verstoringen kunnen de film verwijderen, reken dus niet zonder bewijs op dit voordeel.',
              'Au-delà de la température de dépôt Tscale = 2400/(6,7 + 0,6 log fCO2), un film de carbonate de fer se forme et la vitesse est multipliée par Fscale, log Fscale = 2400/T − 2400/Tscale (≤ 1). Une fCO2 plus élevée abaisse Tscale : environ 87 °C pour fCO2 ≈ 1 bar, environ 66 °C pour 4 bar. Piège : une vitesse élevée, un pH bas ou des incidents peuvent arracher le film ; ne comptez pas sur ce gain sans preuve.',
              'Por encima de la temperatura de incrustación Tscale = 2400/(6,7 + 0,6 log fCO2) se forma una película de carbonato de hierro y la velocidad se multiplica por Fscale, log Fscale = 2400/T − 2400/Tscale (≤ 1). Una fCO2 mayor baja Tscale: unos 87 °C con fCO2 ≈ 1 bar, unos 66 °C con 4 bar. Trampa: velocidad alta, pH bajo o perturbaciones pueden arrancar la película, así que no cuente con este beneficio sin evidencia.',
              'Powyżej temperatury tworzenia warstwy Tscale = 2400/(6,7 + 0,6 log fCO2) powstaje film węglanu żelaza, a szybkość mnoży się przez Fscale, log Fscale = 2400/T − 2400/Tscale (≤ 1). Wyższa fCO2 obniża Tscale: około 87 °C przy fCO2 ≈ 1 bar, około 66 °C przy 4 bar. Pułapka: duża prędkość, niskie pH lub zakłócenia mogą zerwać film, więc nie licz na ten efekt bez dowodów.') },
          flow: { title: T('Flow and Mass Transfer', 'Потік і масоперенос', 'Strömung und Stofftransport', 'Stroming en stoftransport', 'Écoulement et transfert de masse', 'Flujo y transferencia de masa', 'Przepływ i transport masy'),
            body: T('The 1995 model puts reaction and mass transfer in series: 1/V = 1/Vr + 1/Vm, with log Vr = 4.93 − 1119/T + 0.58 log pCO2 and Vm = 2.45·U^0.8/d^0.2·pCO2. Vm is usually the smaller term, so a faster liquid raises the rate and a larger diameter lowers it slightly. At U = 0 the flow model is switched off and the 1991 model governs. Pitfall: U is the velocity of the water-wetting liquid, not the gas superficial velocity.',
              'Модель 1995 року розглядає реакцію і масоперенос послідовно: 1/V = 1/Vr + 1/Vm, де log Vr = 4,93 − 1119/T + 0,58 log pCO2, а Vm = 2,45·U^0,8/d^0,2·pCO2. Зазвичай менший член — Vm, тож швидша рідина підвищує швидкість корозії, а більший діаметр трохи її знижує. При U = 0 модель потоку вимикається і визначає модель 1991. Пастка: U — швидкість рідини, що змочує стінку, а не приведена швидкість газу.',
              'Das Modell von 1995 schaltet Reaktion und Stofftransport in Reihe: 1/V = 1/Vr + 1/Vm, mit log Vr = 4,93 − 1119/T + 0,58 log pCO2 und Vm = 2,45·U^0,8/d^0,2·pCO2. Meist ist Vm der kleinere Term, daher erhöht schnellere Flüssigkeit die Rate und ein größerer Durchmesser senkt sie leicht. Bei U = 0 entfällt das Strömungsmodell, und das Modell von 1991 ist maßgebend. Falle: U ist die Geschwindigkeit der benetzenden Flüssigkeit, nicht die Gas-Leerrohrgeschwindigkeit.',
              'Het model van 1995 zet reactie en stofoverdracht in serie: 1/V = 1/Vr + 1/Vm, met log Vr = 4,93 − 1119/T + 0,58 log pCO2 en Vm = 2,45·U^0,8/d^0,2·pCO2. Meestal is Vm de kleinste term, dus snellere vloeistof verhoogt de snelheid en een grotere diameter verlaagt die licht. Bij U = 0 vervalt het stromingsmodel en is het model van 1991 maatgevend. Valkuil: U is de snelheid van de bevochtigende vloeistof, niet de superficiële gassnelheid.',
              'Le modèle de 1995 place réaction et transfert de masse en série : 1/V = 1/Vr + 1/Vm, avec log Vr = 4,93 − 1119/T + 0,58 log pCO2 et Vm = 2,45·U^0,8/d^0,2·pCO2. Vm est en général le terme le plus petit : un liquide plus rapide augmente la vitesse et un diamètre plus grand la réduit un peu. À U = 0 le modèle d’écoulement est désactivé et celui de 1991 gouverne. Piège : U est la vitesse du liquide qui mouille la paroi, pas la vitesse superficielle du gaz.',
              'El modelo de 1995 pone reacción y transferencia de masa en serie: 1/V = 1/Vr + 1/Vm, con log Vr = 4,93 − 1119/T + 0,58 log pCO2 y Vm = 2,45·U^0,8/d^0,2·pCO2. Normalmente Vm es el término menor, así que un líquido más rápido aumenta la velocidad y un diámetro mayor la reduce algo. Con U = 0 el modelo de flujo se desactiva y gobierna el de 1991. Trampa: U es la velocidad del líquido que moja la pared, no la velocidad superficial del gas.',
              'Model z 1995 roku łączy reakcję i transport masy szeregowo: 1/V = 1/Vr + 1/Vm, gdzie log Vr = 4,93 − 1119/T + 0,58 log pCO2, a Vm = 2,45·U^0,8/d^0,2·pCO2. Zwykle mniejszy jest Vm, więc szybsza ciecz zwiększa szybkość korozji, a większa średnica nieco ją zmniejsza. Przy U = 0 model przepływu jest wyłączony i decyduje model 1991. Pułapka: U to prędkość cieczy zwilżającej ściankę, a nie prędkość pozorna gazu.') },
          allowance: { title: T('Corrosion Allowance', 'Допуск на корозію', 'Korrosionszuschlag', 'Corrosietoeslag', 'Surépaisseur de corrosion', 'Sobreespesor de corrosión', 'Naddatek korozyjny'),
            body: T('CA = Vdes·(1 − inhibitor efficiency)·design life. Typical carbon-steel allowances are 3–6 mm; above about 6 mm the line is usually not viable without inhibition or a corrosion-resistant alloy (CRA). Pitfall: the allowance covers uniform loss only; pitting and mesa attack can go faster locally.',
              'CA = Vdes·(1 − ефективність інгібітора)·проєктний строк. Типові допуски для вуглецевої сталі — 3–6 мм; понад приблизно 6 мм лінія зазвичай нежиттєздатна без інгібування або корозійностійкого сплаву (CRA). Пастка: допуск покриває лише рівномірну втрату; виразкова і мезакорозія локально можуть бути швидшими.',
              'CA = Vdes·(1 − Inhibitorwirkungsgrad)·Auslegungslebensdauer. Übliche Zuschläge für Kohlenstoffstahl sind 3–6 mm; ab etwa 6 mm ist die Leitung ohne Inhibierung oder korrosionsbeständige Legierung (CRA) meist nicht tragbar. Falle: der Zuschlag deckt nur gleichmäßigen Abtrag; Lochfraß und Mesa-Angriff können örtlich schneller sein.',
              'CA = Vdes·(1 − inhibitorrendement)·ontwerplevensduur. Gebruikelijke toeslagen voor koolstofstaal zijn 3–6 mm; boven circa 6 mm is de leiding zonder inhibitie of corrosiebestendige legering (CRA) meestal niet haalbaar. Valkuil: de toeslag dekt alleen uniform verlies; putcorrosie en mesa-aantasting kunnen plaatselijk sneller gaan.',
              'CA = Vdes·(1 − efficacité de l’inhibiteur)·durée de vie. Les surépaisseurs usuelles de l’acier au carbone sont de 3 à 6 mm ; au-delà d’environ 6 mm la ligne n’est en général pas viable sans inhibition ni alliage résistant à la corrosion (CRA). Piège : la surépaisseur ne couvre que la perte uniforme ; piqûres et attaque mesa peuvent aller plus vite localement.',
              'CA = Vdes·(1 − eficiencia del inhibidor)·vida de diseño. Los sobreespesores típicos del acero al carbono son 3–6 mm; por encima de unos 6 mm la línea no suele ser viable sin inhibición o una aleación resistente a la corrosión (CRA). Trampa: el sobreespesor cubre solo la pérdida uniforme; las picaduras y el ataque mesa pueden ir más rápido localmente.',
              'CA = Vdes·(1 − skuteczność inhibitora)·projektowy okres eksploatacji. Typowe naddatki dla stali węglowej to 3–6 mm; powyżej około 6 mm rurociąg zwykle nie jest wykonalny bez inhibitowania lub stopu odpornego na korozję (CRA). Pułapka: naddatek pokrywa tylko ubytek równomierny; wżery i korozja typu mesa mogą lokalnie postępować szybciej.') },
          severity: { title: T('Design Rate and Severity Classes', 'Розрахункова швидкість і класи небезпеки', 'Auslegungsrate und Schweregrade', 'Ontwerpsnelheid en ernstklassen', 'Vitesse de calcul et classes de sévérité', 'Velocidad de diseño y clases de severidad', 'Szybkość projektowa i klasy zagrożenia'),
            body: T('The verdict classes the inhibited design rate: low < 0.1 mm/yr, medium 0.1–1 mm/yr, high 1–10 mm/yr, very high ≥ 10 mm/yr. Unmitigated de Waard-Milliams rates in wet CO2 service are often several mm/yr; they are a conservative upper bound, and field rates with scale, oil wetting or inhibitor are usually lower.',
              'Вердикт класифікує розрахункову швидкість з урахуванням інгібітора: низька < 0,1 мм/рік, середня 0,1–1 мм/рік, висока 1–10 мм/рік, дуже висока ≥ 10 мм/рік. Без заходів захисту швидкості de Waard-Milliams у вологому CO2 часто становлять кілька мм/рік; це консервативна верхня межа, фактичні швидкості з плівкою, змочуванням нафтою чи інгібітором зазвичай нижчі.',
              'Das Urteil ordnet die inhibierte Auslegungsrate ein: niedrig < 0,1 mm/a, mittel 0,1–1 mm/a, hoch 1–10 mm/a, sehr hoch ≥ 10 mm/a. Ungeschützte Raten nach de Waard-Milliams liegen in nassem CO2-Betrieb oft bei mehreren mm/a; sie sind eine konservative Obergrenze, Feldraten mit Deckschicht, Ölbenetzung oder Inhibitor sind meist niedriger.',
              'Het oordeel deelt de geïnhibeerde ontwerpsnelheid in: laag < 0,1 mm/jaar, gemiddeld 0,1–1 mm/jaar, hoog 1–10 mm/jaar, zeer hoog ≥ 10 mm/jaar. Onbeschermde snelheden volgens de Waard-Milliams in nat CO2-bedrijf zijn vaak enkele mm/jaar; ze zijn een conservatieve bovengrens, veldwaarden met laag, oliebevochtiging of inhibitor liggen meestal lager.',
              'Le verdict classe la vitesse de calcul inhibée : faible < 0,1 mm/an, moyenne 0,1–1 mm/an, élevée 1–10 mm/an, très élevée ≥ 10 mm/an. Sans protection, les vitesses de Waard-Milliams en service CO2 humide atteignent souvent plusieurs mm/an ; c’est une borne supérieure prudente, les vitesses réelles avec dépôt, mouillage par l’huile ou inhibiteur sont en général plus faibles.',
              'El veredicto clasifica la velocidad de diseño inhibida: baja < 0,1 mm/año, media 0,1–1 mm/año, alta 1–10 mm/año, muy alta ≥ 10 mm/año. Sin mitigación, las velocidades de Waard-Milliams en servicio de CO2 húmedo suelen ser de varios mm/año; son un límite superior conservador, y las de campo con capa, mojado por aceite o inhibidor suelen ser menores.',
              'Werdykt klasyfikuje projektową szybkość po inhibitowaniu: niska < 0,1 mm/rok, średnia 0,1–1 mm/rok, wysoka 1–10 mm/rok, bardzo wysoka ≥ 10 mm/rok. Bez ochrony szybkości de Waard-Milliams w mokrym CO2 wynoszą często kilka mm/rok; to konserwatywna górna granica, a rzeczywiste szybkości z warstwą, zwilżaniem ropą lub inhibitorem są zwykle niższe.') },
          inhibitor: { title: T('Inhibitor Efficiency', 'Ефективність інгібітора', 'Inhibitorwirkungsgrad', 'Inhibitorrendement', 'Efficacité de l’inhibiteur', 'Eficiencia del inhibidor', 'Skuteczność inhibitora'),
            body: T('In the Full level the design rate is multiplied by (1 − inhibitor efficiency). Efficiencies of 0.8–0.95 are typical claims; anything above 0.9 needs reliable injection (availability), monitoring and a qualified chemical. Pitfall: 0.9 sounds high but still leaves 10 % of a rate of several mm/yr.',
              'На Повному рівні розрахункова швидкість множиться на (1 − ефективність інгібітора). Типові заявлені значення — 0,8–0,95; усе понад 0,9 потребує надійного дозування (готовності), моніторингу і кваліфікованого реагенту. Пастка: 0,9 звучить високо, але залишає 10 % від швидкості в кілька мм/рік.',
              'In der Stufe Vollständig wird die Auslegungsrate mit (1 − Inhibitorwirkungsgrad) multipliziert. Üblich angesetzt werden 0,8–0,95; alles über 0,9 erfordert zuverlässige Dosierung (Verfügbarkeit), Überwachung und ein qualifiziertes Produkt. Falle: 0,9 klingt hoch, lässt aber 10 % einer Rate von mehreren mm/a übrig.',
              'In het niveau Volledig wordt de ontwerpsnelheid vermenigvuldigd met (1 − inhibitorrendement). Gebruikelijke waarden zijn 0,8–0,95; alles boven 0,9 vraagt betrouwbare injectie (beschikbaarheid), monitoring en een gekwalificeerd product. Valkuil: 0,9 klinkt hoog, maar laat 10 % van een snelheid van enkele mm/jaar over.',
              'Au niveau Complet, la vitesse de calcul est multipliée par (1 − efficacité de l’inhibiteur). Les valeurs courantes vont de 0,8 à 0,95 ; au-delà de 0,9 il faut une injection fiable (disponibilité), une surveillance et un produit qualifié. Piège : 0,9 paraît élevé mais laisse 10 % d’une vitesse de plusieurs mm/an.',
              'En el nivel Completo la velocidad de diseño se multiplica por (1 − eficiencia del inhibidor). Los valores típicos son 0,8–0,95; por encima de 0,9 hace falta una inyección fiable (disponibilidad), monitorización y un producto cualificado. Trampa: 0,9 suena alto, pero deja el 10 % de una velocidad de varios mm/año.',
              'Na poziomie Pełnym szybkość projektowa jest mnożona przez (1 − skuteczność inhibitora). Typowo przyjmuje się 0,8–0,95; powyżej 0,9 potrzebny jest niezawodne dozowanie (dyspozycyjność), monitoring i kwalifikowany środek. Pułapka: 0,9 brzmi wysoko, ale zostawia 10 % szybkości wynoszącej kilka mm/rok.') },
          correction: { title: T('Correction Factor', 'Поправковий коефіцієнт', 'Korrekturfaktor', 'Correctiefactor', 'Facteur de correction', 'Factor de corrección', 'Współczynnik korekcyjny'),
            body: T('The correction factor Fcorr (Full level, 0–1) multiplies the design rate for effects outside the base equations, such as glycol or methanol in the water phase or a raised pH from bicarbonate. 1 means no credit; take reductions from the de Waard correction charts or NORSOK M-506, not from judgement.',
              'Поправковий коефіцієнт Fcorr (Повний рівень, 0–1) множить розрахункову швидкість для ефектів поза базовими рівняннями, як-от гліколь чи метанол у водній фазі або підвищений pH через бікарбонат. 1 означає без знижки; беріть зменшення з поправкових діаграм de Waard або NORSOK M-506, а не на око.',
              'Der Korrekturfaktor Fcorr (Stufe Vollständig, 0–1) multipliziert die Auslegungsrate für Effekte außerhalb der Grundgleichungen, etwa Glykol oder Methanol in der Wasserphase oder einen durch Bicarbonat erhöhten pH. 1 heißt keine Gutschrift; Abminderungen aus den Korrekturdiagrammen nach de Waard oder NORSOK M-506 nehmen, nicht nach Gefühl.',
              'De correctiefactor Fcorr (niveau Volledig, 0–1) vermenigvuldigt de ontwerpsnelheid voor effecten buiten de basisvergelijkingen, zoals glycol of methanol in de waterfase of een door bicarbonaat verhoogde pH. 1 betekent geen korting; neem reducties uit de correctiediagrammen van de Waard of NORSOK M-506, niet op gevoel.',
              'Le facteur de correction Fcorr (niveau Complet, 0–1) multiplie la vitesse de calcul pour des effets hors des équations de base, comme du glycol ou du méthanol dans la phase aqueuse ou un pH relevé par le bicarbonate. 1 signifie aucun crédit ; prenez les réductions dans les abaques de correction de de Waard ou la NORSOK M-506, pas à l’estime.',
              'El factor de corrección Fcorr (nivel Completo, 0–1) multiplica la velocidad de diseño por efectos fuera de las ecuaciones base, como glicol o metanol en la fase acuosa o un pH elevado por bicarbonato. 1 significa sin reducción; tome las reducciones de los gráficos de corrección de de Waard o de NORSOK M-506, no a ojo.',
              'Współczynnik korekcyjny Fcorr (poziom Pełny, 0–1) mnoży szybkość projektową dla efektów spoza równań bazowych, np. glikolu lub metanolu w fazie wodnej albo pH podwyższonego przez wodorowęglan. 1 oznacza brak ulgi; redukcje bierz z wykresów korekcyjnych de Waard lub NORSOK M-506, a nie na oko.') },
          validity: { title: T('Validity Range and Limits', 'Межі застосовності', 'Gültigkeitsbereich und Grenzen', 'Geldigheidsgebied en beperkingen', 'Domaine de validité et limites', 'Rango de validez y límites', 'Zakres stosowalności i ograniczenia'),
            body: T('The equations are fitted for carbon steel with free water, 0–150 °C and pCO2 up to about 10 bar; above that the page warns and the result is an extrapolation. H2S, organic acids (acetic), top-of-line condensation, oxygen and pH buffering are not modelled. For detailed design use NORSOK M-506 or a mechanistic model.',
              'Рівняння підібрано для вуглецевої сталі з вільною водою, 0–150 °C і pCO2 приблизно до 10 бар; вище сторінка попереджає, і результат є екстраполяцією. H2S, органічні кислоти (оцтова), конденсація у верхній частині труби, кисень і буферування pH не моделюються. Для детального проєктування використовуйте NORSOK M-506 або механістичну модель.',
              'Die Gleichungen sind für Kohlenstoffstahl mit freiem Wasser, 0–150 °C und pCO2 bis etwa 10 bar angepasst; darüber warnt die Seite, und das Ergebnis ist eine Extrapolation. H2S, organische Säuren (Essigsäure), Top-of-Line-Kondensation, Sauerstoff und pH-Pufferung werden nicht modelliert. Für die Detailauslegung NORSOK M-506 oder ein mechanistisches Modell verwenden.',
              'De vergelijkingen zijn gefit voor koolstofstaal met vrij water, 0–150 °C en pCO2 tot circa 10 bar; daarboven waarschuwt de pagina en is het resultaat een extrapolatie. H2S, organische zuren (azijnzuur), condensatie bovenin de leiding, zuurstof en pH-buffering worden niet gemodelleerd. Gebruik voor detailontwerp NORSOK M-506 of een mechanistisch model.',
              'Les équations sont calées pour l’acier au carbone avec eau libre, 0–150 °C et pCO2 jusqu’à environ 10 bar ; au-delà la page avertit et le résultat est une extrapolation. H2S, acides organiques (acétique), condensation en génératrice supérieure, oxygène et effet tampon du pH ne sont pas modélisés. Pour l’étude détaillée, utilisez la NORSOK M-506 ou un modèle mécaniste.',
              'Las ecuaciones están ajustadas para acero al carbono con agua libre, 0–150 °C y pCO2 hasta unos 10 bar; por encima la página avisa y el resultado es una extrapolación. No se modelan H2S, ácidos orgánicos (acético), condensación en la parte superior de la línea, oxígeno ni el efecto tampón del pH. Para el diseño detallado use NORSOK M-506 o un modelo mecanicista.',
              'Równania dopasowano dla stali węglowej z wolną wodą, 0–150 °C i pCO2 do około 10 bar; powyżej strona ostrzega, a wynik jest ekstrapolacją. H2S, kwasy organiczne (octowy), kondensacja w górnej części rury, tlen i buforowanie pH nie są modelowane. Do projektu szczegółowego użyj NORSOK M-506 lub modelu mechanistycznego.') },
          ccus: { title: T('Dense-phase CO2 (CCUS)', 'CO2 у щільній фазі (CCUS)', 'CO2 in dichter Phase (CCUS)', 'CO2 in dichte fase (CCUS)', 'CO2 en phase dense (CCUS)', 'CO2 en fase densa (CCUS)', 'CO2 w fazie gęstej (CCUS)'),
            body: T('Dry dense-phase CO2 is not corrosive to carbon steel. If free water drops out, the model is far outside its range (pCO2 ≫ 10 bar) and returns extreme rates of tens to hundreds of mm/yr. The practical answer is strict dehydration well below water solubility and impurity limits (SO2, NO2, O2, H2S), not a corrosion allowance.',
              'Сухий CO2 у щільній фазі не викликає корозії вуглецевої сталі. Якщо випадає вільна вода, модель працює далеко поза межами (pCO2 ≫ 10 бар) і дає екстремальні швидкості — десятки й сотні мм/рік. Практичне рішення — глибоке осушення значно нижче розчинності води та обмеження домішок (SO2, NO2, O2, H2S), а не допуск на корозію.',
              'Trockenes CO2 in dichter Phase greift Kohlenstoffstahl nicht an. Fällt freies Wasser aus, liegt das Modell weit außerhalb seines Bereichs (pCO2 ≫ 10 bar) und liefert extreme Raten von zehn bis hunderten mm/a. Die praktische Antwort ist strenge Trocknung weit unter der Wasserlöslichkeit und Grenzwerte für Begleitstoffe (SO2, NO2, O2, H2S), kein Korrosionszuschlag.',
              'Droog CO2 in dichte fase tast koolstofstaal niet aan. Valt er vrij water uit, dan ligt het model ver buiten zijn bereik (pCO2 ≫ 10 bar) en geeft het extreme snelheden van tientallen tot honderden mm/jaar. Het praktische antwoord is strenge droging ver onder de wateroplosbaarheid en limieten voor verontreinigingen (SO2, NO2, O2, H2S), geen corrosietoeslag.',
              'Le CO2 sec en phase dense n’attaque pas l’acier au carbone. Si de l’eau libre se forme, le modèle est très loin de son domaine (pCO2 ≫ 10 bar) et donne des vitesses extrêmes de dizaines à centaines de mm/an. La vraie réponse est une déshydratation poussée bien en dessous de la solubilité de l’eau et des limites d’impuretés (SO2, NO2, O2, H2S), pas une surépaisseur.',
              'El CO2 seco en fase densa no corroe el acero al carbono. Si se separa agua libre, el modelo queda muy fuera de su rango (pCO2 ≫ 10 bar) y da velocidades extremas de decenas a cientos de mm/año. La respuesta práctica es una deshidratación estricta muy por debajo de la solubilidad del agua y límites de impurezas (SO2, NO2, O2, H2S), no un sobreespesor.',
              'Suchy CO2 w fazie gęstej nie powoduje korozji stali węglowej. Jeśli wydzieli się wolna woda, model działa daleko poza zakresem (pCO2 ≫ 10 bar) i daje skrajne szybkości rzędu dziesiątek i setek mm/rok. Praktyczną odpowiedzią jest głębokie osuszanie znacznie poniżej rozpuszczalności wody i limity zanieczyszczeń (SO2, NO2, O2, H2S), a nie naddatek korozyjny.') }
        },

      { id: 'low_temp_gas', label: T('Low-temperature gas', 'Низькотемпературний газ', 'Niedertemperaturgas', 'Lagetemperatuurgas', 'Gaz basse température', 'Gas a baja temperatura', 'Gaz niskotemperaturowy'),
        note: T('Look at the governing model: at 15 °C the 1991 equation gives only 0.478 mm/yr, but the 1995 flow model gives 2.68 mm/yr, 5.6 times more, so a cold line is not automatically benign.',
          'Подивіться на визначальну модель: при 15 °C рівняння 1991 дає лише 0,478 мм/рік, а модель потоку 1995 — 2,68 мм/рік, у 5,6 раза більше, тож холодна лінія не є безпечною автоматично.',
          'Achten Sie auf das maßgebende Modell: bei 15 °C liefert die Gleichung von 1991 nur 0,478 mm/a, das Strömungsmodell von 1995 aber 2,68 mm/a, das 5,6-Fache; eine kalte Leitung ist nicht automatisch harmlos.',
          'Kijk naar het maatgevende model: bij 15 °C geeft de vergelijking van 1991 slechts 0,478 mm/jaar, maar het stromingsmodel van 1995 2,68 mm/jaar, 5,6 keer zoveel; een koude leiding is niet vanzelf onschuldig.',
          'Regardez le modèle déterminant : à 15 °C l’équation de 1991 ne donne que 0,478 mm/an, mais le modèle d’écoulement 1995 donne 2,68 mm/an, 5,6 fois plus ; une ligne froide n’est pas d’office sans risque.',
          'Fíjese en el modelo determinante: a 15 °C la ecuación de 1991 da solo 0,478 mm/año, pero el modelo de flujo de 1995 da 2,68 mm/año, 5,6 veces más; una línea fría no es inocua por sí misma.',
          'Zwróć uwagę na model decydujący: przy 15 °C równanie 1991 daje tylko 0,478 mm/rok, a model przepływu 1995 aż 2,68 mm/rok, 5,6 razy więcej; zimny rurociąg nie jest automatycznie bezpieczny.'),
        apply: function (t) { exBase(t); t.T = 288.15; t.P = 70e5; t.yCO2 = 0.01; t.U = 2; } },
      { id: 'ccus_dense', label: T('CCUS dense phase', 'CCUS, щільна фаза', 'CCUS, dichte Phase', 'CCUS, dichte fase', 'CCUS, phase dense', 'CCUS, fase densa', 'CCUS, faza gęsta'),
        note: T('Look at the warning: with free water at pCO2 = 95 bar the model is far outside its 10 bar range and returns 165 mm/yr; for CCUS the design answer is dehydration, not a corrosion allowance.',
          'Подивіться на попередження: з вільною водою при pCO2 = 95 бар модель далеко поза межею 10 бар і дає 165 мм/рік; для CCUS проєктне рішення — осушення, а не допуск на корозію.',
          'Achten Sie auf die Warnung: mit freiem Wasser bei pCO2 = 95 bar liegt das Modell weit außerhalb seines 10-bar-Bereichs und liefert 165 mm/a; bei CCUS ist die Antwort Trocknung, kein Korrosionszuschlag.',
          'Kijk naar de waarschuwing: met vrij water bij pCO2 = 95 bar ligt het model ver buiten zijn bereik van 10 bar en geeft het 165 mm/jaar; bij CCUS is het antwoord droging, geen corrosietoeslag.',
          'Regardez l’avertissement : avec eau libre à pCO2 = 95 bar le modèle est très loin de son domaine de 10 bar et donne 165 mm/an ; pour le CCUS la réponse est la déshydratation, pas une surépaisseur.',
          'Fíjese en el aviso: con agua libre a pCO2 = 95 bar el modelo queda muy fuera de su rango de 10 bar y da 165 mm/año; en CCUS la respuesta es la deshidratación, no un sobreespesor.',
          'Zwróć uwagę na ostrzeżenie: z wolną wodą przy pCO2 = 95 bar model jest daleko poza zakresem 10 bar i daje 165 mm/rok; dla CCUS odpowiedzią jest osuszanie, a nie naddatek korozyjny.'),
        apply: function (t) { exBase(t); t.T = 303.15; t.P = 100e5; t.yCO2 = 0.95; t.U = 2; } }
    ];
    ui.examples(EX);

    function curveData() {
      if (!last || !last.ok) return null;
      var s = {}, k, a = [], b = [], m = 0.1, i, TK, r;
      for (k in state) if (state.hasOwnProperty(k)) s[k] = state[k];
      for (i = 0; i <= 27; i++) {
        TK = 278.15 + 5 * i; s.T = TK; r = solve(s);
        if (!r || !r.ok || !isFinite(r.V91s) || !isFinite(r.V95s)) continue;
        a.push({ x: TK - 273.15, y: r.V91s }); b.push({ x: TK - 273.15, y: r.V95s });
        m = Math.max(m, r.V91s, r.V95s);
      }
      return { series: [a, b], xMin: 5, xMax: 140, yMax: 1.15 * m, xCur: state.T - 273.15, cur: [last.V91s, last.V95s] };
    }
    ui.stage({
      caption: T('Corrosion rate versus temperature (dWM 1991 and 1995, with scale factor)', 'Швидкість корозії залежно від температури (dWM 1991 і 1995, з коефіцієнтом плівки)', 'Korrosionsrate über Temperatur (dWM 1991 und 1995, mit Deckschichtfaktor)', 'Corrosiesnelheid versus temperatuur (dWM 1991 en 1995, met schaalfactor)', 'Vitesse de corrosion en fonction de la température (dWM 1991 et 1995, avec facteur de film)', 'Velocidad de corrosión frente a temperatura (dWM 1991 y 1995, con factor de capa)', 'Szybkość korozji w funkcji temperatury (dWM 1991 i 1995, ze współczynnikiem warstwy)'),
      minHeight: 300,
      a11y: function () {
        var l = (ui && ui.lang) || DiagramUI.lang(), o;
        if (!last || !last.ok) {
          o = T('Chart of CO2 corrosion rate versus temperature; no result is available.', 'Графік швидкості CO2-корозії залежно від температури; результат недоступний.', 'Diagramm der CO2-Korrosionsrate über der Temperatur; kein Ergebnis verfügbar.', 'Grafiek van de CO2-corrosiesnelheid versus temperatuur; geen resultaat beschikbaar.', 'Graphique de la vitesse de corrosion CO2 en fonction de la température ; aucun résultat disponible.', 'Gráfico de la velocidad de corrosión por CO2 frente a la temperatura; no hay resultado disponible.', 'Wykres szybkości korozji CO2 w funkcji temperatury; brak wyniku.');
        } else {
          o = TF(T('Line chart of CO2 corrosion rate versus temperature from 5 to 140 °C for the de Waard-Milliams 1991 and 1995 models with the scale factor; at the operating point {0} °C the 1991 rate is {1} mm/yr and the 1995 rate {2} mm/yr.',
            'Лінійний графік швидкості CO2-корозії залежно від температури від 5 до 140 °C за моделями de Waard-Milliams 1991 і 1995 з коефіцієнтом плівки; у робочій точці {0} °C швидкість 1991 — {1} мм/рік, 1995 — {2} мм/рік.',
            'Liniendiagramm der CO2-Korrosionsrate über der Temperatur von 5 bis 140 °C nach den Modellen de Waard-Milliams 1991 und 1995 mit Deckschichtfaktor; im Betriebspunkt {0} °C beträgt die Rate nach 1991 {1} mm/a und nach 1995 {2} mm/a.',
            'Lijngrafiek van de CO2-corrosiesnelheid versus temperatuur van 5 tot 140 °C volgens de modellen de Waard-Milliams 1991 en 1995 met laagfactor; in het werkpunt {0} °C is de snelheid volgens 1991 {1} mm/jaar en volgens 1995 {2} mm/jaar.',
            'Courbes de la vitesse de corrosion CO2 en fonction de la température de 5 à 140 °C selon les modèles de Waard-Milliams 1991 et 1995 avec facteur de couche ; au point de fonctionnement {0} °C, la vitesse 1991 vaut {1} mm/an et la vitesse 1995 {2} mm/an.',
            'Gráfico de líneas de la velocidad de corrosión por CO2 frente a la temperatura de 5 a 140 °C según los modelos de Waard-Milliams 1991 y 1995 con factor de capa; en el punto de operación {0} °C la velocidad de 1991 es {1} mm/año y la de 1995 {2} mm/año.',
            'Wykres liniowy szybkości korozji CO2 w funkcji temperatury od 5 do 140 °C według modeli de Waard-Milliams 1991 i 1995 ze współczynnikiem warstwy; w punkcie pracy {0} °C szybkość 1991 wynosi {1} mm/rok, a 1995 {2} mm/rok.'), [[state.T - 273.15, 1], [last.V91s, sig(last.V91s, 3)], [last.V95s, sig(last.V95s, 3)]]);
        }
        return o[l] != null ? o[l] : o.en;
      },
      render: function (size, st) {
        var ctx = st.canvas(), w = size.w, h = size.h, coarse = size.density === 'coarse';
        var cs = getComputedStyle(document.documentElement);
        var muted = cs.getPropertyValue('--muted').trim() || '#888', line = cs.getPropertyValue('--line').trim() || '#ccc', font = cs.getPropertyValue('--font').trim() || 'sans-serif';
        ctx.clearRect(0, 0, w, h);
        var d = curveData(); if (!d) return;
        var L = coarse ? 46 : 58, R = 14, TOP = 12, B = coarse ? 36 : 44, pw = w - L - R, ph = h - TOP - B, i, j, v, p;
        function X(x) { return L + (x - d.xMin) / (d.xMax - d.xMin) * pw; }
        function Y(y) { return TOP + ph - y / d.yMax * ph; }
        ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.beginPath();
        ctx.moveTo(L, TOP); ctx.lineTo(L, TOP + ph); ctx.lineTo(L + pw, TOP + ph); ctx.stroke();
        ctx.fillStyle = muted; ctx.font = (coarse ? 11 : 12) + 'px ' + font;
        var xt = DiagramUI.ticks(d.xMin, d.xMax, pw, size.density), yt = DiagramUI.ticks(0, d.yMax, ph, size.density);
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        for (i = 0; i < xt.length; i++) { v = xt[i]; if (v < d.xMin || v > d.xMax) continue; ctx.beginPath(); ctx.moveTo(X(v), TOP + ph); ctx.lineTo(X(v), TOP + ph + 4); ctx.stroke(); ctx.fillText(DiagramUI.fmt(v, { precision: 3 }), X(v), TOP + ph + 6); }
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        for (i = 0; i < yt.length; i++) { v = yt[i]; if (v < 0 || v > d.yMax) continue; ctx.beginPath(); ctx.moveTo(L - 4, Y(v)); ctx.lineTo(L, Y(v)); ctx.stroke(); ctx.fillText(DiagramUI.fmt(v, { precision: 3 }), L - 6, Y(v)); }
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText('T, °C', L + pw / 2, h - 2);
        ctx.save(); ctx.translate(9, TOP + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textBaseline = 'middle'; var yl = T('rate, mm/yr', 'швидкість, мм/рік', 'Rate, mm/a', 'snelheid, mm/jaar', 'vitesse, mm/an', 'velocidad, mm/año', 'szybkość, mm/rok'), ll = (ui && ui.lang) || DiagramUI.lang(); ctx.fillText(yl[ll] != null ? yl[ll] : yl.en, 0, 0); ctx.restore();
        ctx.save(); ctx.beginPath(); ctx.rect(L, TOP, pw, ph); ctx.clip();
        ctx.setLineDash([4, 4]); ctx.strokeStyle = muted; ctx.beginPath(); ctx.moveTo(X(d.xCur), TOP); ctx.lineTo(X(d.xCur), TOP + ph); ctx.stroke(); ctx.setLineDash([]);
        for (j = 0; j < d.series.length; j++) {
          p = d.series[j]; if (!p.length) continue;
          ctx.strokeStyle = DiagramUI.series(j); ctx.lineWidth = 2; ctx.beginPath();
          for (i = 0; i < p.length; i++) { if (i === 0) ctx.moveTo(X(p[i].x), Y(p[i].y)); else ctx.lineTo(X(p[i].x), Y(p[i].y)); }
          ctx.stroke();
        }
        for (j = 0; j < d.cur.length; j++) {
          if (!isFinite(d.cur[j])) continue;
          ctx.fillStyle = DiagramUI.series(j); ctx.beginPath(); ctx.arc(X(d.xCur), Y(d.cur[j]), coarse ? 3 : 4, 0, 2 * Math.PI); ctx.fill();
        }
        ctx.restore();
      }
    });
    adoptStage(ui);

    ui.ready();
    window['__co2_corrosion_rate'] = { ui: ui, state: state, solve: solve, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function buildRecord(){
    if (!last) { return null; }
    var inputs = {}, outputs = {}, units = {}, warnings, i, k;
    var inU = [['T','K'],['P','Pa'],['yCO2','-'],['U','m/s'],['Dh','m'],['life','yr'],['CA_avail','-'],['Fcorr','-'],['level','-']];
    for (i = 0; i < inU.length; i++) { k = inU[i][0]; inputs[k] = state[k]; units[k] = inU[i][1]; }
    if (last.ok) {
      var outU = [['pCO2','bar'],['fCO2','bar'],['V91','mm/yr'],['Tscale','K'],['Fscale','-'],['V91s','mm/yr'],['Vr','mm/yr'],['Vm','mm/yr'],['V95s','mm/yr'],['Vdes','mm/yr'],['Vinh','mm/yr'],['CA','mm'],['governing','-'],['severity','-']];
      for (i = 0; i < outU.length; i++) { k = outU[i][0]; outputs[k] = last[k]; units[k] = outU[i][1]; }
      warnings = (last.warnings && last.warnings.slice) ? last.warnings.slice() : [];
    } else {
      warnings = [last.error];
    }
    return { inputs:inputs, outputs:outputs, units:units, model:{
      equations:['log10 Vcor = 5.8 - 1710/T + 0.67 log10 fCO2 (dWM 1991)',
        'log10 Fscale = 2400/T - 2400/Tscale, Tscale = 2400/(6.7 + 0.6 log10 fCO2)',
        '1/Vcor = 1/Vr + 1/Vm, log10 Vr = 4.93 - 1119/T + 0.58 log10 pCO2, Vm = 2.45 U^0.8/d^0.2 pCO2 (dWM 1995)',
        'CA = Vdes (1 - inhibitor efficiency) life'],
      ranges:['0-150 C, pCO2 up to 10 bar, carbon steel, free water present'],
      notes:['H2S, organic acids, top-of-line corrosion and pH buffering not modelled'] }, warnings:warnings };
  }
  function posFinite(v){ return typeof v === 'number' && isFinite(v) && v > 0; }
  var HANDOFF = {
    provides:['T','p'],
    accepts:['T','p'],
    build: function(){
      return (last && last.ok) ? { quantities:{ T:{ value:state.T, unit:'K' }, p:{ value:state.P, unit:'Pa' } } } : null;
    },
    apply: function(payload){
      var q = (payload && payload.quantities) || {};
      if (q.T && posFinite(q.T.value)) { state.T = q.T.value; }
      if (q.p && posFinite(q.p.value)) { state.P = q.p.value; }
      last = solve(state);
      if (ui) { ui.sync(); ui.run(); }
    }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'co2_corrosion_rate',
        file: 'co2_corrosion_rate.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
