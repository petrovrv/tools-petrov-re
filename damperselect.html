  "title": {"en":"Fire and smoke damper selection","uk":"Підбір протипожежних і димових клапанів","de":"Auswahl von Brandschutz- und Entrauchungsklappen","nl":"Selectie van brand- en rookkleppen","fr":"Sélection de clapets coupe-feu et de désenfumage","es":"Selección de compuertas cortafuego y de control de humos","pl":"Dobór klap przeciwpożarowych i dymowych"},
  "summary": {"en":"A seven-step wizard: duct opening, wall or floor construction, required fire resistance, damper type, actuator and control integration, ending in a selection report with face velocity, pressure drop, actuator torque and a classification designation.","uk":"Майстер із семи кроків: отвір повітроводу, конструкція стіни чи перекриття, потрібна вогнестійкість, тип клапана, привід і керування, а в кінці — звіт із швидкістю, втратою тиску, моментом приводу та позначенням класу.","de":"Ein siebenstufiger Assistent: Kanalöffnung, Wand- oder Deckenaufbau, geforderte Feuerwiderstandsdauer, Klappentyp, Antrieb und Ansteuerung, am Ende ein Auswahlbericht mit Geschwindigkeit, Druckverlust, Drehmoment und Klassifizierungsbezeichnung.","nl":"Een wizard in zeven stappen: kanaalopening, wand- of vloeropbouw, vereiste brandwerendheid, kleptype, aandrijving en aansturing, met als sluitstuk een selectierapport met snelheid, drukval, koppel en classificatieaanduiding.","fr":"Un assistant en sept étapes : ouverture de gaine, paroi ou plancher, résistance au feu exigée, type de clapet, actionneur et commande, puis un rapport de sélection avec vitesse, perte de charge, couple et désignation de classement.","es":"Un asistente de siete pasos: hueco de conducto, muro o forjado, resistencia al fuego exigida, tipo de compuerta, actuador y control, y un informe de selección con velocidad, pérdida de carga, par y designación de clasificación.","pl":"Kreator w siedmiu krokach: otwór w przewodzie, konstrukcja ściany lub stropu, wymagana odporność ogniowa, typ klapy, siłownik i integracja sterowania, kończący się raportem doboru z prędkością czołową, spadkiem ciśnienia, momentem siłownika i oznaczeniem klasyfikacyjnym."},
  "description": {"en":"The tool walks a fire damper or a smoke control damper selection from the duct opening to the control interface. A smoke control damper asks for its operating temperature class, leakage class, cycle class and whether it serves one compartment or several; a fire damper does not. Nothing is reported until the last step, where the wizard prints the free area, the face and net velocity, the damper pressure drop, the required and selected actuator torque, the actuator count and power, the cable cores, the minimum barrier thickness for the class, and the classification designation the selection is expressed in.","uk":"Інструмент веде підбір протипожежного або димового клапана від отвору повітроводу до інтерфейсу керування. Димовий клапан потребує класу робочої температури, класу щільності, класу циклів і числа відсіків, які він обслуговує; протипожежний — ні. Результат з’являється лише на останньому кроці.","de":"Das Werkzeug führt die Auswahl einer Brandschutz- oder Entrauchungsklappe von der Kanalöffnung bis zur Ansteuerung. Eine Entrauchungsklappe verlangt Betriebstemperaturklasse, Leckageklasse, Zyklenklasse und die Zahl der versorgten Abschnitte; eine Brandschutzklappe nicht. Das Ergebnis erscheint erst im letzten Schritt.","nl":"De tool loopt de selectie van een brandklep of rookbeheersingsklep door, van kanaalopening tot aansturing. Een rookbeheersingsklep vraagt om bedrijfstemperatuurklasse, lekklasse, cyclusklasse en het aantal bediende compartimenten; een brandklep niet. Het resultaat verschijnt pas in de laatste stap.","fr":"L’outil conduit la sélection d’un clapet coupe-feu ou de désenfumage, de l’ouverture de gaine jusqu’à la commande. Un clapet de désenfumage demande sa classe de température, sa classe d’étanchéité, sa classe de cycles et le nombre de compartiments desservis ; un clapet coupe-feu non. Le résultat n’apparaît qu’à la dernière étape.","es":"La herramienta guía la selección de una compuerta cortafuego o de control de humos, desde el hueco del conducto hasta la interfaz de control. Una compuerta de control de humos pide clase de temperatura, clase de estanquidad, clase de ciclos y número de sectores servidos; una cortafuego no. El resultado sólo aparece en el último paso.","pl":"Narzędzie prowadzi dobór klapy przeciwpożarowej lub klapy dymowej od otworu w przewodzie do interfejsu sterowania. Klapa dymowa wymaga podania klasy temperatury roboczej, klasy szczelności, klasy cykli oraz liczby obsługiwanych stref pożarowych; klapa przeciwpożarowa — nie. Wynik pojawia się dopiero w ostatnim kroku, gdzie kreator wypisuje pole wolnej powierzchni, prędkość czołową i netto, spadek ciśnienia na klapie, wymagany i dobrany moment siłownika, liczbę i moc siłowników, żyły kabla, minimalną grubość przegrody dla danej klasy oraz oznaczenie klasyfikacyjne, w którym wyrażony jest dobór."},

  "limitations": {"en":"A teaching selection aid, not a compliance document and not a substitute for a manufacturer classification report. Free area, pressure drop and actuator torque come from declared generic coefficients for a multi-blade or curtain damper, not from any product's measured data; a real damper's aerodynamic and torque figures differ, often by tens of per cent. The minimum barrier thickness table is indicative for common European constructions and is superseded by the tested installation detail of the specific product. Classification designations are composed from the answers given; the tool performs no test and certifies nothing. Only cold-state air at 1.2 kg/m3 is considered — no hot-gas density, no duct system effects, no leakage flow, no acoustic assessment, no seismic or structural check of the supporting construction.","uk":"Навчальний помічник підбору, а не документ відповідності й не заміна класифікаційному звіту виробника. Вільна площа, втрата тиску й момент приводу отримані з узагальнених оголошених коефіцієнтів, а не з вимірів конкретного виробу. Таблиця мінімальної товщини огородження є орієнтовною; випробуваний вузол монтажу конкретного виробу має перевагу. Позначення класу складається з відповідей; інструмент нічого не випробовує й не сертифікує. Розглядається лише холодне повітря 1,2 кг/м3.","de":"Eine Lehrhilfe zur Auswahl, kein Nachweis und kein Ersatz für den Klassifizierungsbericht des Herstellers. Freie Fläche, Druckverlust und Drehmoment stammen aus erklärten generischen Beiwerten, nicht aus Messdaten eines Produkts. Die Tabelle der Mindestbauteildicke ist orientierend; das geprüfte Einbaudetail des Produkts geht vor. Die Klassifizierungsbezeichnung wird aus den Antworten zusammengesetzt; das Werkzeug prüft und zertifiziert nichts. Nur kalte Luft mit 1,2 kg/m3.","nl":"Een lesmatig selectiehulpmiddel, geen toetsingsdocument en geen vervanging van het classificatierapport van de fabrikant. Vrije doorlaat, drukval en koppel komen uit verklaarde generieke coëfficiënten, niet uit meetgegevens van een product. De tabel met minimale dikte is indicatief; het beproefde inbouwdetail van het product gaat voor. De classificatieaanduiding wordt uit de antwoorden samengesteld; de tool beproeft en certificeert niets. Alleen koude lucht van 1,2 kg/m3.","fr":"Une aide pédagogique à la sélection, ni justification réglementaire ni substitut au rapport de classement du fabricant. Section libre, perte de charge et couple proviennent de coefficients génériques déclarés, non de mesures d’un produit. Le tableau d’épaisseur minimale est indicatif ; le détail de pose testé du produit prévaut. La désignation de classement est composée à partir des réponses ; l’outil n’essaie ni ne certifie rien. Air froid à 1,2 kg/m3 uniquement.","es":"Una ayuda docente a la selección, no un documento de cumplimiento ni un sustituto del informe de clasificación del fabricante. Sección libre, pérdida de carga y par proceden de coeficientes genéricos declarados, no de datos medidos de un producto. La tabla de espesor mínimo es indicativa; prevalece el detalle de instalación ensayado del producto. La designación de clasificación se compone a partir de las respuestas; la herramienta no ensaya ni certifica nada. Sólo aire frío a 1,2 kg/m3.","pl":"Pomoc dydaktyczna do doboru, a nie dokument zgodności ani zamiennik sprawozdania klasyfikacyjnego producenta. Pole wolnej powierzchni, spadek ciśnienia i moment siłownika pochodzą z zadeklarowanych współczynników ogólnych dla klapy wielołopatkowej lub żaluzjowej, a nie z danych pomiarowych wyrobu; rzeczywiste wartości aerodynamiczne i moment rzeczywistej klapy różnią się, nieraz o dziesiątki procent. Tabela minimalnej grubości przegrody jest orientacyjna dla typowych europejskich konstrukcji i ustępuje badanemu szczegółowi montażu konkretnego wyrobu. Oznaczenia klasyfikacyjne są zestawiane z udzielonych odpowiedzi; narzędzie nie wykonuje żadnego badania i niczego nie certyfikuje. Uwzględniane jest wyłącznie powietrze w stanie zimnym o gęstości 1,2 kg/m³ — bez gęstości gorącego gazu, efektów instalacji, przepływu nieszczelności, oceny akustycznej oraz sprawdzenia sejsmicznego lub konstrukcyjnego przegrody wsporczej."},

<script>
/* damperselect.html — fire and smoke damper selection wizard.
 * tools.petrov.re UI framework v3, level 3, archetype `wizard`.
 *
 * Three parts, in this order:
 *   1. the model      — pure functions and a defaults object, SI throughout.
 *   2. the interface  — ONE DiagramUI.app({…}) declaration plus the wizard's
 *                       step rail, examples, io row and stage.
 *   3. the data layer — Diagram.init({state, record, python, handoff, report}).
 *
 * It contains no <style> element, no CSS at all and no style attribute, and it
 * builds no DOM: it constructs no element, sets no markup and appends nothing.
 * It touches the document in five places, each named here so the claim can be
 * checked rather than believed:
 *   - document.title, only on the path where diagram-ui.js is absent and there
 *     is no framework left to render a message with;
 *   - document.documentElement.lang, on that same degraded path, because the
 *     record and the report still need to know which language to print in;
 *   - getComputedStyle, to read the theme tokens the canvas draws with;
 *   - one DOMContentLoaded listener, to boot;
 *   - one querySelectorAll, marked UPSTREAM at its site: the framework keeps no
 *     registry of Steps instances, so after a language rebuild the only way to
 *     move the step marker is to press the framework's own step button.
 * Plus stage.cv.toDataURL(), which reads the drawing into the PDF report.
 * The canvas is the only pixels this tool owns.
 */
(function () {
  'use strict';

  /* ============================================================ 1. the model
     Pure. No document, no strings for the screen: the checks it raises are
     identifiers, and the interface layer owns their six-language wording. */

  var RHO      = 1.2;      /* kg/m3, cold air, stated and fixed          */
  var TF_RECT  = 0.010;    /* m, frame inset per side, rectangular       */
  var TF_CIRC  = 0.008;    /* m, frame inset per side, circular          */
  var HB       = 0.100;    /* m, blade pitch of a multi-blade damper     */
  var TB       = 0.012;    /* m, projected blade thickness, blades open  */
  var KC       = 0.93;     /* curtain pocket allowance, circular damper  */
  var ZETA_R   = 0.20;     /* clean-section loss coefficient, rectangular*/
  var ZETA_C   = 0.15;     /* clean-section loss coefficient, circular   */
  var M_DENS   = 26;       /* N m per m2 of damper face                  */
  var M_BREAK  = 3;        /* N m, seal break-out                        */
  var LADDER   = [4, 8, 15, 20, 40];                 /* N m, catalogue ladder */
  var ACT_P    = { 4:[2.5,1.0], 8:[5,2.5], 15:[7,3.5], 20:[9,4.5], 40:[14,7] };
  var CLOSE_S  = { fuse:0, spring24:16, spring230:16, pneum:5 };  /* s */
  var MAX_W    = 1.5;      /* m, largest classified single unit, width   */
  var MAX_H    = 0.8;      /* m, largest classified single unit, height  */
  var MAX_D    = 0.63;     /* m, largest classified single unit, circular*/
  var V_MAX    = 12;       /* m/s, face velocity ceiling used here       */
  var DP_MAX   = 60;       /* Pa, above this the note is raised          */
  var SIG_CORES = { none:0, contacts:4, modbus:2, bacnet:2, knx:2, loop:2 };
  /* indicative minimum barrier thickness, metres, by construction and class */
  var T_MIN = {
    masonry:     { 1800:0.100, 3600:0.100, 5400:0.100, 7200:0.150 },
    concrete:    { 1800:0.100, 3600:0.100, 5400:0.125, 7200:0.150 },
    lightweight: { 1800:0.075, 3600:0.100, 5400:0.100, 7200:0.125 },
    shaft:       { 1800:0.075, 3600:0.080, 5400:0.100, 7200:0.125 }
  };

  function solve(s) {
    var circ = s.shape === 'circ';
    var tf   = circ ? TF_CIRC : TF_RECT;
    var A    = circ ? Math.PI * s.D * s.D / 4 : s.W * s.H;
    var nb, Afree;
    if (circ) {
      var di = Math.max(0.02, s.D - 2 * tf);
      Afree = KC * Math.PI * di * di / 4;
      nb = 1;
    } else {
      var wi = Math.max(0.02, s.W - 2 * tf);
      var hi = Math.max(0.02, s.H - 2 * tf);
      nb = Math.max(1, Math.ceil(hi / HB));
      Afree = Math.max(0.05 * A, wi * hi - nb * TB * wi);
    }
    var sigma = Afree / A;
    var vFace = s.Vdot / A;
    var vNet  = s.Vdot / Afree;
    var zeta  = (circ ? ZETA_C : ZETA_R) / (sigma * sigma);
    var dp    = zeta * 0.5 * RHO * vFace * vFace;

    var nUnits = circ ? 1 : Math.max(1, Math.ceil(s.W / MAX_W) * Math.ceil(s.H / MAX_H));
    var Aunit  = A / nUnits;
    var Mreq   = M_BREAK + M_DENS * Aunit;

    var powered = s.act !== 'fuse';
    var elec    = s.act === 'spring24' || s.act === 'spring230';
    var Msel = 0, nPer = 0, nAct = 0, Prun = 0, Phold = 0;
    if (powered) {
      nPer = Math.max(1, Math.ceil(Mreq / LADDER[LADDER.length - 1]));
      var need = Mreq / nPer;
      Msel = LADDER[LADDER.length - 1];
      for (var i = 0; i < LADDER.length; i++) {
        if (LADDER[i] >= need - 1e-12) { Msel = LADDER[i]; break; }
      }
      nAct = nPer * nUnits;
      if (elec) { Prun = nAct * ACT_P[Msel][0]; Phold = nAct * ACT_P[Msel][1]; }
    }
    var tClose = CLOSE_S[s.act] || 0;
    var cores  = (elec ? 2 : 0) + (s.act === 'pneum' ? 2 : 0) + (SIG_CORES[s.ctrl] || 0);
    var tMin   = (T_MIN[s.constr] && T_MIN[s.constr][s.tReq]) || 0.150;

    var mins   = Math.round(s.tReq / 60);
    var desig;
    if (s.dtype === 'fire') {
      desig = s.crit + ' ' + mins + ' (' + (s.barrier === 'wall' ? 've' : 'ho') +
              ' i↔o)' + (s.sReq ? ' S' : '');
    } else {
      desig = 'E' + Math.round(s.Tclass - 273.15) + ' ' + mins + ' (' +
              (s.barrier === 'wall' ? 'ved' : 'hod') + ' i↔o) S' + s.leak +
              ' C' + s.cyc + ' AA ' + (s.scope === 'multi' ? 'MA' : 'SA');
    }

    /* checks: identifiers only. Blocking ones first. */
    var blocking = [], advisory = [];
    if (s.dtype === 'smoke' && s.act === 'fuse') blocking.push('fusesmoke');
    if (s.act === 'fuse' && s.ctrl !== 'none')   blocking.push('fusectrl');
    if (s.act === 'fuse' && s.mon)               blocking.push('fusemon');
    if (s.dtype === 'smoke' && !s.mon)           blocking.push('smokemon');
    if (s.barrier === 'floor' && (s.constr === 'lightweight' || s.constr === 'shaft'))
      blocking.push('floorlight');
    if (s.tw + 1e-9 < tMin)                      advisory.push('thin');
    if (vFace > V_MAX)                           advisory.push('fast');
    if (circ ? s.D > MAX_D : (s.W > MAX_W || s.H > MAX_H)) advisory.push('oversize');
    if (s.crit === 'E' && s.tReq > 3600)         advisory.push('eonly');
    if (s.dtype === 'smoke' && s.scope === 'multi' && s.cyc < 10000) advisory.push('cycles');
    if (s.dtype === 'fire' && s.mount === 'remote') advisory.push('remote');
    if (dp > DP_MAX)                             advisory.push('dp');

    return {
      circ: circ, A: A, Afree: Afree, sigma: sigma,
      vFace: vFace, vNet: vNet, zeta: zeta, dp: dp,
      nBlades: nb, nUnits: nUnits, Aunit: Aunit,
      Mreq: Mreq, Msel: Msel, nAct: nAct, Prun: Prun, Phold: Phold,
      powered: powered, elec: elec, tClose: tClose, cores: cores,
      tMin: tMin, desig: desig, mins: mins,
      blocking: blocking, advisory: advisory,
      ok: blocking.length === 0
    };
  }

  var DEFAULTS = {
    step: 'opening',
    shape: 'rect', W: 0.600, H: 0.400, D: 0.315, Vdot: 1.000,
    barrier: 'wall', constr: 'masonry', tw: 0.120, mount: 'mortar',
    crit: 'EI', tReq: 5400, sReq: false,
    dtype: 'fire', scope: 'single', Tclass: 873.15, leak: 1500, cyc: 10000,
    act: 'spring24', Tfuse: 345.15,
    ctrl: 'contacts', mon: true, psu: 'local'
  };

  var state = JSON.parse(JSON.stringify(DEFAULTS));
  var last  = null;

  /* ======================================================== 2. the interface */

  function T(en, uk, de, nl, fr, es, pl) { return { en:en, uk:uk, de:de, nl:nl, fr:fr, es:es, pl:pl }; }
  var LANGS = ['en', 'uk', 'de', 'nl', 'fr', 'es', 'pl'];
  function curLang() {
    if (window.DiagramUI) {
      return (DiagramUI.current && DiagramUI.current.lang) || DiagramUI.lang();
    }
    /* degraded path only: diagram-ui.js is gone but diagram-common.js still
       exports the record and the report, and both need a language */
    var l = String(document.documentElement.lang || 'en').slice(0, 2).toLowerCase();
    return LANGS.indexOf(l) >= 0 ? l : 'en';
  }
  function L(o) {
    if (o == null) return '';
    if (typeof o === 'string') return o;
    return window.DiagramUI ? DiagramUI.pick(o, curLang()) : (o[curLang()] || o.en || '');
  }
  function N(v, p) {
    if (window.DiagramUI) return DiagramUI.fmt(v, { precision: p });
    return p != null ? Number(v).toFixed(p) : String(v);
  }

  var STEPS = ['opening', 'barrier', 'class', 'type', 'actuator', 'control', 'report'];
  function idx(id) { var i = STEPS.indexOf(id); return i < 0 ? 0 : i; }
  function here() { return idx(state.step); }

  var ui = null, stage = null, stepsNav = null;

  /* ------------------------------------------------------------- vocabulary */

  var STEP_LABEL = {
    opening:  T('Opening and airflow','Отвір і витрата','Öffnung und Luftstrom','Opening en luchtdebiet','Ouverture et débit','Hueco y caudal','Otwór i przepływ powietrza'),

      var ahead = idx(r[0]) > cur;

         AUTHORING.md §5.5 and NEW_TOOL_TEMPLATE.html both pass T() straight in,
         and the template's own resistance table shows three em dashes today. */
      return {
        cells: [{ text: r[1] }, ahead ? '—' : r[2]],

  /* the marker must be right on every build, including the one a language

  Object.defineProperty(stepsDef, 'value', { get: function () { return state.step; } });

  /* Move the step marker to whatever `state.step` now says.
     UPSTREAM — the framework publishes app.stages, app.panels, app.notices and
     app.transports as live arrays, but keeps no registry of Steps (or Tabs)
     instances, and rebuild() replays ui.steps() without handing the tool the
     new object. After a language change the handle a tool holds is detached,
     so a step moved by anything other than a click on the rail cannot reach
     the marker. Until there is an app.steps array or a `key:` on the
     imperative constructors, the fallback drives the framework's own step
     button — which re-points us through onSelect — rather than re-implementing
     Steps.sync() by hand, which is what two ported tools ended up doing. */
  var markerBusy = false;
  function syncMarker() {
    if (stepsNav && stepsNav.node && stepsNav.node.isConnected) { stepsNav.sync(state.step); return; }
    if (markerBusy) return;
    var btn = document.querySelectorAll('.dgu-r-nav .dgu-steps > .dgu-step')[here()];
    if (!btn || btn.getAttribute('aria-selected') === 'true') return;
    /* deferred, so the fallback never re-enters the compute it was called from */
    markerBusy = true;
    setTimeout(function () { markerBusy = false; btn.click(); }, 0);
  }

  function go(i) {
    var n = Math.max(0, Math.min(STEPS.length - 1, i));

  function drawSection(size, st) {
    var ctx = st.canvas(), w = size.w, h = size.h;
    var coarse = size.density === 'coarse';
    var cs = getComputedStyle(document.documentElement);
    var muted = cs.getPropertyValue('--muted').trim() || '#777';
    var line  = cs.getPropertyValue('--line').trim() || '#ddd';
    var ink   = cs.getPropertyValue('--ink').trim() || '#222';
    var font  = cs.getPropertyValue('--font').trim() || 'sans-serif';
    ctx.clearRect(0, 0, w, h);
    if (!last) return;

    var s = state;
    var open = s.shape === 'circ' ? s.D : s.H;      /* cross dimension, m */
    var Lcase = 0.25;                               /* casing length, m   */
    var side  = s.mount === 'remote' ? 0.55 : 0.32; /* clear duct each side */
    var spanU = Math.max(s.tw, Lcase) + 2 * side;   /* along the airway   */
    var spanV = open + 2 * Math.max(0.10, open * 0.45);
    var rot   = s.barrier === 'floor';
    var padX  = coarse ? 14 : 22, padY = coarse ? 34 : 42;
    var sw = rot ? spanV : spanU, sh = rot ? spanU : spanV;
    var sc = Math.min((w - 2 * padX) / sw, (h - 2 * padY) / sh);
    if (!(sc > 0)) return;
    var cx = w / 2, cy = h / 2 + (coarse ? 4 : 6);

    ctx.save();
    ctx.translate(cx, cy);
    if (rot) ctx.rotate(Math.PI / 2);
    ctx.scale(sc, sc);
    ctx.lineWidth = 1.6 / sc;

    /* the separating element, hatched, with the opening cut out of it */
    var half = s.tw / 2, halfOpen = open / 2, edge = spanV / 2;
    var bands = [[-edge, -halfOpen], [halfOpen, edge]];
    ctx.strokeStyle = line;
    bands.forEach(function (b) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(-half, b[0], s.tw, b[1] - b[0]);
      ctx.clip();
      ctx.strokeStyle = line;
      ctx.lineWidth = 0.9 / sc;
      for (var u = -edge - s.tw; u < edge + s.tw; u += 0.035) {
        ctx.beginPath(); ctx.moveTo(-half + u, b[0]); ctx.lineTo(-half + u + (b[1] - b[0]), b[1]); ctx.stroke();
      }
      ctx.restore();
      ctx.strokeStyle = DiagramUI.series(2);
      ctx.lineWidth = 1.8 / sc;
      ctx.beginPath(); ctx.rect(-half, b[0], s.tw, b[1] - b[0]); ctx.stroke();
    });

    /* the duct either side of the opening */
    ctx.strokeStyle = line;
    ctx.lineWidth = 1.2 / sc;
    ctx.setLineDash([0.02, 0.02]);
    [-1, 1].forEach(function (sgn) {
      ctx.beginPath();
      ctx.moveTo(sgn * half, -halfOpen); ctx.lineTo(sgn * (half + side), -halfOpen);
      ctx.moveTo(sgn * half, halfOpen);  ctx.lineTo(sgn * (half + side), halfOpen);
      ctx.stroke();
    });
    ctx.setLineDash([]);

    /* the damper casing: in the opening, or out on the duct when remote */
    var cU = s.mount === 'remote' ? (half + side * 0.55) : 0;
    ctx.strokeStyle = DiagramUI.series(0);
    ctx.lineWidth = 2.2 / sc;
    ctx.beginPath(); ctx.rect(cU - Lcase / 2, -halfOpen, Lcase, open); ctx.stroke();

    /* the blades, drawn at the pitch the model counted */
    ctx.lineWidth = 1.3 / sc;
    ctx.strokeStyle = DiagramUI.series(0);
    var nb = last.nBlades, pitch = open / nb;
    for (var k = 0; k < nb; k++) {
      var v = -halfOpen + pitch * (k + 0.5);
      ctx.beginPath();
      ctx.moveTo(cU - Lcase * 0.22, v - pitch * 0.30);
      ctx.lineTo(cU + Lcase * 0.22, v + pitch * 0.30);
      ctx.stroke();
    }

    /* the actuator, only when there is one */
    if (last.powered) {
      ctx.strokeStyle = DiagramUI.series(1);
      ctx.lineWidth = 2 / sc;
      ctx.beginPath();
      ctx.rect(cU - 0.045, halfOpen + 0.012, 0.09, 0.075);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cU, halfOpen); ctx.lineTo(cU, halfOpen + 0.012); ctx.stroke();
    }
    ctx.restore();

    /* labels: physical size, drawn in screen space so nothing scales them */
    ctx.font = '400 12px ' + font;
    ctx.fillStyle = muted;
    ctx.textAlign = 'left';
    ctx.fillText(L(OPT.barrier[s.barrier]) + ' · ' + N(s.tw * 1000, 0) + ' mm', 10, 16);
    ctx.fillText(sizeText(s), 10, 32);
    if (!coarse) {
      ctx.textAlign = 'right';
      ctx.fillStyle = ink;
      ctx.fillText(last.desig, w - 10, 16);
      ctx.fillStyle = muted;
      ctx.fillText(L(OPT.mount[s.mount]), w - 10, 32);
    }
  }

  /* --------------------------------------------------------------- the boot */

  /* Honest degradation, §7.2. Losing diagram-ui.js costs the whole interface —
     there is no framework left to render a message with, so the tool says so
     in the one place it can. It must NOT also cost the shared bar, the status
     badge, the limitations modal, the permalink or the record export: those
     come from site-disclaimer.js and diagram-common.js, which are still here.
     So buildInterface() is conditional and initData() is not. */
  function boot() {
    if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1') {
      buildInterface();
    } else {
      document.title = 'diagram-ui.js v1 is required';
      /* the model needs no screen: the record, the permalink and the PDF stay
         truthful for the state the page was opened with */
      last = solve(state);
    }
    initData();
  }

                 'Schnitt durch das trennende Bauteil im Maßstab der Antworten',
                 'Doorsnede door het scheidende element, op de schaal die de antwoorden geven',
                 'Coupe de l’élément séparatif, à l’échelle qu’impliquent les réponses',
                 'Sección del elemento separador, a la escala que implican las respuestas','Przekrój przez przegrodę oddzielającą, w skali wynikającej z odpowiedzi'),
      minHeight: 240,
      a11y: stageA11y,
      render: drawSection
    });
    adoptStage(ui);

    ui.sync();
    ui.ready();
  }

  /* ======================================================= 3. the data layer
     Called unconditionally from boot(), never from inside a branch that a
     missing file can take away. window.__diagramReady is set by this and by
     nothing else. */
  function initData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'damperselect',
        file: 'damperselect.html',

        state: {
          serialize: function () { return state; },
          deserialize: function (o) {
            Object.assign(state, o || {});
            syncMarker();
            if (ui) { ui.sync(); ui.run(); } else { last = solve(state); }
          }
        },

        record: function () {
          if (!last) return null;
          return {
            inputs: {
              shape: state.shape, W: state.W, H: state.H, D: state.D, Vdot: state.Vdot,
              barrier: state.barrier, construction: state.constr, t_element: state.tw,
              installation: state.mount, criterion: state.crit, t_required: state.tReq,
              smoke_leakage_required: state.sReq, damper_type: state.dtype,
              compartments: state.scope, T_class: state.Tclass, leakage_class_pressure: state.leak,
              cycle_class: state.cyc, actuator: state.act, T_fusible: state.Tfuse,
              control_interface: state.ctrl, position_monitoring: state.mon, supply: state.psu
            },
            outputs: {
              designation: last.desig,
              A_face: last.A, A_free: last.Afree, free_area_ratio: last.sigma,
              v_face: last.vFace, v_net: last.vNet, zeta: last.zeta, dp_damper: last.dp,
              n_blades: last.nBlades, n_units: last.nUnits,
              M_required: last.Mreq, M_actuator: last.Msel, n_actuators: last.nAct,
              P_running: last.Prun, P_holding: last.Phold,
              t_close: last.tClose, cable_cores: last.cores, t_element_min: last.tMin
            },
            units: {
              shape: '-', W: 'm', H: 'm', D: 'm', Vdot: 'm3/s',
              barrier: '-', construction: '-', t_element: 'm', installation: '-',
              criterion: '-', t_required: 's', smoke_leakage_required: '-', damper_type: '-',
              compartments: '-', T_class: 'K', leakage_class_pressure: 'Pa', cycle_class: '-',
              actuator: '-', T_fusible: 'K', control_interface: '-', position_monitoring: '-',
              supply: '-',
              designation: '-', A_face: 'm2', A_free: 'm2', free_area_ratio: '-',
              v_face: 'm/s', v_net: 'm/s', zeta: '-', dp_damper: 'Pa',
              n_blades: '-', n_units: '-', M_required: 'N m', M_actuator: 'N m',
              n_actuators: '-', P_running: 'W', P_holding: 'W', t_close: 's',
              cable_cores: '-', t_element_min: 'm'
            },
            model: {
              equations: [
                'A = W H  (rectangular)   |   A = pi D^2 / 4  (circular)',
                'A_free = (W-2tf)(H-2tf) - n_blades tb (W-2tf),  n_blades = ceil((H-2tf)/hb)',
                'A_free = 0.93 pi (D-2tf)^2 / 4  (circular)',
                'v_face = Vdot / A,  v_net = Vdot / A_free,  sigma = A_free / A',
                'zeta = zeta0 / sigma^2,  dp = zeta (rho/2) v_face^2',
                'M_required = 3 + 26 A_unit,  M_actuator = ceil to {4,8,15,20,40} N m'
              ],
              ranges: [
                'cold air, rho = 1.2 kg/m3; no hot-gas density, no system effect, no leakage flow',
                'tf = 0.010 m rectangular, 0.008 m circular; hb = 0.100 m; tb = 0.012 m',
                'zeta0 = 0.20 rectangular, 0.15 circular; single classified unit 1.5 x 0.8 m or DN 630',
                'minimum element thickness is an indicative table, not a test result'
              ],
              notes: [
                'new tool, prototype status, no benchmark and no independent validation',
                'classification designations are composed from the answers; nothing is certified here',
                last.blocking.length ? 'the answers are mutually incompatible' : 'no blocking incompatibility'
              ]
            },
            warnings: last.blocking.concat(last.advisory).map(function (k) {
              return k + ': ' + CHECK[k].en;
            })
          };
        },

        python: function () {
          if (!last) {
            return { unsupported: T('Answer the wizard first: there is nothing to export until the model has run.',
                                    'Спершу пройдіть майстер: експортувати нічого, доки модель не виконано.',
                                    'Zuerst den Assistenten beantworten: vor dem Modelllauf gibt es nichts zu exportieren.',
                                    'Beantwoord eerst de wizard: voor de modelrun valt er niets te exporteren.',
                                    'Répondez d’abord à l’assistant : rien à exporter avant l’exécution du modèle.',
                                    'Responda primero al asistente: no hay nada que exportar antes de ejecutar el modelo.','Najpierw odpowiedz w kreatorze: nie ma nic do eksportu, dopóki model nie zostanie obliczony.') };
          }
          return {
            code: pySource(),
            requires: [],
            basis: {
              kind: 'reproduce',
              note: 'the same expressions, the same constants and the same catalogue ladder as the page',
              deviation: 'none observed; both sides use IEEE-754 doubles in the same order'
            },
            selftest: { tolerance: 1e-12 }
          };
        },

        handoff: {
          provides: ['Vdot', 'A', 'dp'],
          accepts: ['Vdot'],
          build: function () {
            if (!last) return null;
            return { quantities: {
              Vdot: { value: state.Vdot, unit: 'm3/s' },
              A:    { value: last.Afree, unit: 'm2' },
              dp:   { value: last.dp, unit: 'Pa' }
            } };
          },
          apply: function (p) {
            var q = (p && p.quantities) || {};
            if (q.Vdot && isFinite(q.Vdot.value)) state.Vdot = q.Vdot.value;
            if (ui) { ui.sync(); ui.run(); } else { last = solve(state); }
          }
        },

        report: {
          sections: function (rec) {
            if (!rec || !last) return [];
            var out = [{
              title: L(T('The selection','Підбір','Die Auswahl','De selectie','La sélection','La selección','Dobór')),
              text: L(OPT.dtype[state.dtype]) + ' · ' + sizeText(state) + ' · ' + last.desig,
              head: [L(T('Item','Позиція','Position','Post','Poste','Concepto','Pozycja')),
                     L(T('Value','Значення','Wert','Waarde','Valeur','Valor','Wartość'))],
              rows: summaryRows(state).map(function (r) {
                return [L(r.cells[0].text), r.cells[1]];
              }),
              notes: [L(T('Composed from the answers given. Not a compliance statement; the manufacturer classification report governs.',
                          'Складено з наданих відповідей. Не є підтвердженням відповідності.',
                          'Aus den gegebenen Antworten zusammengestellt. Kein Konformitätsnachweis.',
                          'Samengesteld uit de gegeven antwoorden. Geen conformiteitsverklaring.',
                          'Composé à partir des réponses données. Pas une déclaration de conformité.',
                          'Compuesto a partir de las respuestas dadas. No es una declaración de conformidad.','Sporządzone na podstawie podanych odpowiedzi. Nie jest to oświadczenie o zgodności — rozstrzyga sprawozdanie klasyfikacyjne producenta.'))]
            }];
            try {
              if (stage && stage.cv) {
                out.push({
                  title: L(T('Section','Переріз','Schnitt','Doorsnede','Coupe','Sección','Przekrój')),
                  image: { src: stage.cv.toDataURL('image/png'), width: '92%',
                           caption: L(T('Section through the separating element','Переріз крізь огороджувальний елемент','Schnitt durch das trennende Bauteil','Doorsnede door het scheidende element','Coupe de l’élément séparatif','Sección del elemento separador','Przekrój przez przegrodę oddzielającą')),
                           alt: stageA11y() }
                });
              }
            } catch (e) { /* a tainted or absent canvas simply contributes no figure */ }
            return out;
          }
        }
      });
    }
  }

  /* ------------------------------------------------------ the python export
     One self-contained file on a bare python3: the same constants, the same
     expressions and the same ladder, with the page's own answers asserted. */
  function pySource() {
    var expect = {
      A_face: last.A, A_free: last.Afree, free_area_ratio: last.sigma,
      v_face: last.vFace, v_net: last.vNet, zeta: last.zeta, dp_damper: last.dp,
      n_blades: last.nBlades, n_units: last.nUnits,
      M_required: last.Mreq, M_actuator: last.Msel, n_actuators: last.nAct,
      P_running: last.Prun, P_holding: last.Phold,
      t_close: last.tClose, cable_cores: last.cores, t_element_min: last.tMin,
      designation: last.desig
    };
    return [
      '#!/usr/bin/env python3',
      '# -*- coding: utf-8 -*-',
      '"""damperselect — fire and smoke damper selection.',
      'Source: '+(window.Diagram&&Diagram.site?Diagram.site.sourceRef():'https://tools.petrov.re/damperselect.html'),
      'Manifest revision 2026-08-18a. Prototype: no benchmark, no independent validation.',
      'Generic coefficients, not product data. Standard library only.',
      '"""',
      'import json, math, sys',
      '',
      'RHO = 1.2',
      'TF_RECT, TF_CIRC = 0.010, 0.008',
      'HB, TB, KC = 0.100, 0.012, 0.93',
      'ZETA_R, ZETA_C = 0.20, 0.15',
      'M_DENS, M_BREAK = 26.0, 3.0',
      'LADDER = [4, 8, 15, 20, 40]',
      'ACT_P = {4: (2.5, 1.0), 8: (5.0, 2.5), 15: (7.0, 3.5), 20: (9.0, 4.5), 40: (14.0, 7.0)}',
      'CLOSE_S = {"fuse": 0, "spring24": 16, "spring230": 16, "pneum": 5}',
      'MAX_W, MAX_H, MAX_D = 1.5, 0.8, 0.63',
      'SIG_CORES = {"none": 0, "contacts": 4, "modbus": 2, "bacnet": 2, "knx": 2, "loop": 2}',
      'T_MIN = {',
      '    "masonry":     {1800: 0.100, 3600: 0.100, 5400: 0.100, 7200: 0.150},',
      '    "concrete":    {1800: 0.100, 3600: 0.100, 5400: 0.125, 7200: 0.150},',
      '    "lightweight": {1800: 0.075, 3600: 0.100, 5400: 0.100, 7200: 0.125},',
      '    "shaft":       {1800: 0.075, 3600: 0.080, 5400: 0.100, 7200: 0.125},',
      '}',
      '',
      'def solve(s):',
      '    circ = s["shape"] == "circ"',
      '    tf = TF_CIRC if circ else TF_RECT',
      '    A = math.pi * s["D"] ** 2 / 4 if circ else s["W"] * s["H"]',
      '    if circ:',
      '        di = max(0.02, s["D"] - 2 * tf)',
      '        afree = KC * math.pi * di * di / 4',
      '        nb = 1',
      '    else:',
      '        wi = max(0.02, s["W"] - 2 * tf)',
      '        hi = max(0.02, s["H"] - 2 * tf)',
      '        nb = max(1, math.ceil(hi / HB))',
      '        afree = max(0.05 * A, wi * hi - nb * TB * wi)',
      '    sigma = afree / A',
      '    v_face = s["Vdot"] / A',
      '    v_net = s["Vdot"] / afree',
      '    zeta = (ZETA_C if circ else ZETA_R) / (sigma * sigma)',
      '    dp = zeta * 0.5 * RHO * v_face * v_face',
      '    n_units = 1 if circ else max(1, math.ceil(s["W"] / MAX_W) * math.ceil(s["H"] / MAX_H))',
      '    a_unit = A / n_units',
      '    m_req = M_BREAK + M_DENS * a_unit',
      '    powered = s["act"] != "fuse"',
      '    elec = s["act"] in ("spring24", "spring230")',
      '    m_sel = n_act = 0',
      '    p_run = p_hold = 0.0',
      '    if powered:',
      '        n_per = max(1, math.ceil(m_req / LADDER[-1]))',
      '        need = m_req / n_per',
      '        m_sel = LADDER[-1]',
      '        for k in LADDER:',
      '            if k >= need - 1e-12:',
      '                m_sel = k',
      '                break',
      '        n_act = n_per * n_units',
      '        if elec:',
      '            p_run = n_act * ACT_P[m_sel][0]',
      '            p_hold = n_act * ACT_P[m_sel][1]',
      '    t_close = CLOSE_S.get(s["act"], 0)',
      '    cores = (2 if elec else 0) + (2 if s["act"] == "pneum" else 0) + SIG_CORES.get(s["ctrl"], 0)',
      '    t_min = T_MIN.get(s["constr"], {}).get(s["tReq"], 0.150)',
      '    mins = round(s["tReq"] / 60)',
      '    if s["dtype"] == "fire":',
      '        desig = "%s %d (%s i\\u2194o)%s" % (s["crit"], mins,',
      '                "ve" if s["barrier"] == "wall" else "ho", " S" if s["sReq"] else "")',
      '    else:',
      '        desig = "E%d %d (%s i\\u2194o) S%d C%d AA %s" % (',
      '            round(s["Tclass"] - 273.15), mins,',
      '            "ved" if s["barrier"] == "wall" else "hod",',
      '            s["leak"], s["cyc"], "MA" if s["scope"] == "multi" else "SA")',
      '    return {',
      '        "A_face": A, "A_free": afree, "free_area_ratio": sigma,',
      '        "v_face": v_face, "v_net": v_net, "zeta": zeta, "dp_damper": dp,',
      '        "n_blades": nb, "n_units": n_units,',
      '        "M_required": m_req, "M_actuator": m_sel, "n_actuators": n_act,',
      '        "P_running": p_run, "P_holding": p_hold,',
      '        "t_close": t_close, "cable_cores": cores, "t_element_min": t_min,',
      '        "designation": desig,',
      '    }',
      '',
      'STATE = json.loads(r\'\'\'' + JSON.stringify(state) + '\'\'\')',
      'EXPECT = json.loads(r\'\'\'' + JSON.stringify(expect) + '\'\'\')',
      '',
      'def main():',
      '    out = solve(STATE)',
      '    tol = 1e-12',
      '    bad = []',
      '    for k, want in EXPECT.items():',
      '        got = out[k]',
      '        if isinstance(want, bool) or isinstance(got, str) or isinstance(want, str):',
      '            if str(got) != str(want):',
      '                bad.append("%s: %r != %r" % (k, got, want))',
      '        else:',
      '            if abs(got - want) > tol * max(1.0, abs(want)):',
      '                bad.append("%s: %.17g != %.17g" % (k, got, want))',
      '    for k in sorted(out):',
      '        print("%-18s %s" % (k, out[k]))',
      '    print("self-test: %d checks, tolerance %g, %s"',
      '          % (len(EXPECT), tol, "PASS" if not bad else "FAIL"))',
      '    for b in bad:',
      '        print("  " + b)',
      '    return 0 if not bad else 1',
      '',
      'if __name__ == "__main__":',
      '    sys.exit(main())',
      ''
    ].join('\n');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
