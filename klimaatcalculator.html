  "description": {
    "en": "Compare three strategies for an industrial hall — ventilation only, adiabatic (evaporative) cooling and mechanical cooling — on a common fan backbone. From the internal heat load it sizes the airflow and fans (Cairox catalogue), auto-excludes options that miss the target temperature or humidity, and returns indicative unit selection, energy and water use, an investment range and lifetime cost.",
    "uk": "Порівняння трьох стратегій для промислового цеху — лише вентиляція, адіабатичне (випарне) охолодження та механічне охолодження — на спільній основі з вентиляторів. За внутрішнім тепловим навантаженням підбирає витрату повітря та вентилятори (каталог Cairox), автоматично вилучає варіанти, що не досягають цільової температури чи вологості, і видає орієнтовний підбір обладнання, споживання енергії й води, діапазон інвестицій і вартість за весь строк служби.",
    "de": "Vergleich dreier Strategien für eine Industriehalle — nur Lüftung, adiabatische (Verdunstungs-)Kühlung und mechanische Kühlung — auf gemeinsamer Ventilatorbasis. Aus der inneren Wärmelast werden Luftvolumenstrom und Ventilatoren (Cairox-Katalog) ausgelegt; Optionen, die Zieltemperatur oder -feuchte verfehlen, werden automatisch ausgeschlossen. Ergebnis: indikative Geräteauswahl, Energie- und Wasserverbrauch, Investitionsbandbreite und Lebenszykluskosten.",

    "fr": "Comparez trois stratégies pour un hall industriel — ventilation seule, refroidissement adiabatique (évaporatif) et refroidissement mécanique — sur une même base de ventilateurs. À partir de la charge thermique interne, l’outil dimensionne le débit d’air et les ventilateurs (catalogue Cairox), exclut automatiquement les options qui n’atteignent pas la température ou l’humidité cible, et fournit une sélection indicative des unités, les consommations d’énergie et d’eau, une fourchette d’investissement et le coût sur la durée de vie.",
    "es": "Compare tres estrategias para una nave industrial — solo ventilación, refrigeración adiabática (evaporativa) y refrigeración mecánica — sobre una misma base de ventiladores. A partir de la carga térmica interna dimensiona el caudal de aire y los ventiladores (catálogo Cairox), excluye automáticamente las opciones que no alcanzan la temperatura o humedad objetivo, y ofrece una selección indicativa de equipos, el consumo de energía y agua, un rango de inversión y el coste a lo largo de la vida útil.",
    "pl": "Porównaj trzy strategie dla hali przemysłowej – tylko wentylację, chłodzenie adiabatyczne (parne) i chłodzenie mechaniczne – na wspólnym szkielecie wentylatorów. Na podstawie wewnętrznego obciążenia cieplnego dobiera on wielkość przepływu powietrza i wentylatorów (katalog Cairox), automatycznie wyklucza opcje, które nie osiągają docelowej temperatury lub wilgotności, oraz zwraca orientacyjny wybór jednostki, zużycie energii i wody, zakres inwestycji oraz koszt cyklu życia."

  "limitations": {
    "en": "Concept-level sizing at a single design point: psychrometrics follow ASHRAE Fundamentals ch. 1 (ideal-gas humidity ratio, about 0.5 % below real moist air) and the mechanical coil is loaded with the total enthalpy drop less the condensate, but the annual energy is that design point times fixed load factors rather than a weather-bin calculation, the lifetime cost is undiscounted, and the catalogue data, prices, design-day correction and occupied-zone stratification convention are indicative assumptions. Supplier data, prices, controls, ductwork, acoustics, redundancy, part-load chiller behaviour and any reheat a dehumidifying coil needs must be checked separately. Bolton's saturation-pressure fit is published to 0.1 % between -35 and +35 degC, and the wet-bulb bisection brackets at -70 degC; a value that arrives from another tool is refused below 203.15 K, and refused for any total pressure at or below the saturation pressure the humidity ratio divides by, with the figure and the limit named. No barometric band is declared here, so none is enforced. An incoming humidity ratio is carried as the relative humidity of the 5-99 % field of this page and applied at the edge of that band when it falls outside, which is said with the figure received and the figure used.",
    "uk": "Концептуальний підбір в одній розрахунковій точці: психрометрія за ASHRAE Fundamentals розд. 1 (вологовміст за ідеальним газом, приблизно на 0,5 % нижчий за реальне вологе повітря), механічна батарея навантажується повним падінням ентальпії за вирахуванням конденсату, але річна енергія — це та сама розрахункова точка помножена на сталі коефіцієнти завантаження, а не розрахунок за кліматичними інтервалами; вартість за строк служби не дисконтована, а каталожні дані, ціни, поправка розрахункового дня та умовна модель стратифікації робочої зони — орієнтовні припущення. Дані постачальників, ціни, автоматику, повітроводи, акустику, резервування, роботу чилера на часткових навантаженнях і можливий підігрів після осушувальної батареї перевіряють окремо. Апроксимація тиску насичення за Bolton опублікована з точністю 0,1 % між −35 і +35 °C, а бісекція вологої кулі починається від −70 °C; значення від іншого інструмента відхиляється нижче за 203,15 К, а також за повного тиску, не вищого за тиск насичення, на який ділиться вологовміст, із зазначенням числа та межі. Барометричної смуги тут не заявлено, тому її й не накидається. Вхідний вологовміст переноситься як відносна вологість поля 5–99 % цієї сторінки і за межами смуги застосовується на її межі, про що повідомляється разом із отриманим і використаним числом.",
    "de": "Konzeptauslegung in einem einzigen Auslegungspunkt: Die Psychrometrie folgt ASHRAE Fundamentals Kap. 1 (Feuchtegrad nach idealem Gas, rund 0,5 % unter realer feuchter Luft) und die mechanische Kühlbatterie wird mit dem gesamten Enthalpiegefälle abzüglich Kondensat belastet; die Jahresenergie ist jedoch dieser Auslegungspunkt mal feste Lastfaktoren statt einer Klimaklassenrechnung, die Lebenszykluskosten sind nicht diskontiert, und Katalogdaten, Preise, Auslegungstagskorrektur und die Schichtungskonvention der Aufenthaltszone sind indikative Annahmen. Herstellerdaten, Preise, Regelung, Kanäle, Akustik, Redundanz, Teillastverhalten der Kältemaschine und eine eventuell nötige Nacherwärmung sind separat zu prüfen. Boltons Sättigungsdruckfit ist zwischen −35 und +35 °C mit 0,1 % veröffentlicht, und die Feuchtkugel-Bisektion beginnt bei −70 °C; ein von einem anderen Werkzeug eintreffender Wert wird unter 203,15 K abgewiesen sowie bei jedem Gesamtdruck auf oder unter dem Sättigungsdruck, durch den der Feuchtegrad geteilt wird, jeweils mit Zahl und Grenze. Ein barometrisches Band ist hier nicht erklärt und wird deshalb nicht erzwungen. Ein eintreffender Feuchtegrad wird als relative Feuchte des 5–99-%-Feldes dieser Seite geführt und außerhalb dieses Bandes an dessen Rand übernommen, was mit der empfangenen und der verwendeten Zahl gesagt wird.",
    "nl": "Conceptdimensionering in één ontwerppunt: de psychrometrie volgt ASHRAE Fundamentals hfst. 1 (vochtgehalte volgens ideaal gas, ongeveer 0,5 % onder reëel vochtige lucht) en de mechanische koelbatterij wordt belast met de totale enthalpiedaling min het condensaat, maar de jaarenergie is dat ontwerppunt maal vaste belastingsfactoren in plaats van een binberekening, de levensduurkost is niet verdisconteerd, en catalogusdata, prijzen, ontwerpdagcorrectie en de stratificatieconventie van de verblijfszone zijn indicatieve aannames. Leveranciersdata, prijzen, regeling, kanalen, akoestiek, redundantie, deellastgedrag van de koelmachine en eventuele naverwarming apart controleren. Boltons fit voor de verzadigingsdruk is tussen −35 en +35 °C op 0,1 % gepubliceerd en de natte-bol-bisectie begint bij −70 °C; een waarde die van een andere tool binnenkomt wordt onder 203,15 K geweigerd, en ook bij elke totale druk op of onder de verzadigingsdruk waardoor het vochtgehalte wordt gedeeld, met het getal en de grens erbij. Een barometrische band wordt hier niet aangegeven en dus ook niet opgelegd. Een binnenkomend vochtgehalte wordt gedragen als de relatieve vochtigheid van het 5–99-%-veld van deze pagina en buiten die band op de grens toegepast, wat met het ontvangen en het gebruikte getal wordt gemeld.",
    "fr": "Dimensionnement conceptuel en un seul point de calcul : la psychrométrie suit l'ASHRAE Fundamentals ch. 1 (rapport de mélange en gaz parfait, environ 0,5 % sous l'air humide réel) et la batterie mécanique reçoit la chute d'enthalpie totale moins les condensats, mais l'énergie annuelle est ce point de calcul multiplié par des facteurs de charge fixes plutôt qu'un calcul par classes météo, le coût sur la durée de vie n'est pas actualisé, et les données catalogue, les prix, la correction du jour de calcul et la convention de stratification de la zone d'occupation sont des hypothèses indicatives. Données fournisseurs, prix, régulation, réseaux, acoustique, redondance, comportement à charge partielle du groupe froid et éventuelle postchauffe à vérifier séparément. L’ajustement de Bolton pour la pression de saturation est publié à 0,1 % entre −35 et +35 °C, et la bissection du bulbe humide démarre à −70 °C ; une valeur venue d’un autre outil est refusée sous 203,15 K, et refusée pour toute pression totale égale ou inférieure à la pression de saturation par laquelle le rapport de mélange est divisé, le nombre et la limite étant nommés. Aucune bande barométrique n’est déclarée ici, donc aucune n’est imposée. Un rapport de mélange entrant est porté comme l’humidité relative du champ 5–99 % de cette page et appliqué au bord de cette bande lorsqu’il en sort, ce qui est dit avec le nombre reçu et le nombre utilisé.",
    "es": "Dimensionamiento conceptual en un único punto de cálculo: la psicrometría sigue el ASHRAE Fundamentals cap. 1 (humedad específica de gas ideal, unos 0,5 % por debajo del aire húmedo real) y la batería mecánica recibe la caída de entalpía total menos el condensado, pero la energía anual es ese punto de cálculo por factores de carga fijos en vez de un cálculo por intervalos climáticos, el coste a lo largo de la vida no está descontado, y los datos de catálogo, los precios, la corrección del día de cálculo y la convención de estratificación de la zona ocupada son supuestos indicativos. Datos de proveedor, precios, control, conductos, acústica, redundancia, comportamiento a carga parcial de la enfriadora y el posible recalentamiento tras una batería deshumectadora deben verificarse aparte. El ajuste de Bolton para la presión de saturación se publica con un 0,1 % entre −35 y +35 °C, y la bisección del bulbo húmedo arranca en −70 °C; un valor que llega de otra herramienta se rechaza por debajo de 203,15 K, y también para cualquier presión total igual o inferior a la presión de saturación por la que se divide la humedad específica, indicando la cifra y el límite. Aquí no se declara ninguna banda barométrica, de modo que no se impone ninguna. Una humedad específica entrante se lleva como la humedad relativa del campo 5–99 % de esta página y se aplica en el borde de esa banda cuando queda fuera, lo que se informa con la cifra recibida y la usada.",
    "pl": "Wymiarowanie na poziomie koncepcyjnym w jednym punkcie projektowym: psychrometria jest zgodna z ASHRAE Fundamentals, rozdz. 1 (stosunek wilgotności gazu idealnego, około 0,5% poniżej rzeczywistej wilgotności powietrza), a wężownica mechaniczna jest obciążana całkowitym spadkiem entalpii pomniejszonym o kondensat, ale roczne zużycie energii jest iloczynem punktu projektowego i stałych współczynników obciążenia, a nie kalkulacją uwzględniającą warunki pogodowe. Koszty eksploatacji nie są dyskontowane, a dane katalogowe, ceny, korekta na dzień projektowy i konwencja stratyfikacji stref zajętych stanowią założenia orientacyjne. Dane dostawcy, ceny, sterowanie, kanały, akustyka, redundancja, zachowanie agregatu chłodniczego przy częściowym obciążeniu oraz wszelkie potrzeby związane z dogrzewaniem wężownicy osuszającej muszą zostać sprawdzone osobno. Dopasowanie Boltona dla ciśnienia nasycenia jest opublikowane z dokładnością 0,1 % między −35 a +35 °C, a bisekcja termometru mokrego startuje od −70 °C; wartość nadchodząca z innego narzędzia jest odrzucana poniżej 203,15 K oraz dla każdego ciśnienia całkowitego równego ciśnieniu nasycenia, przez które dzieli się zawartość wilgoci, lub od niego mniejszego — z podaniem liczby i granicy. Pasma barometrycznego nie zadeklarowano tu wcale, więc nie jest ono wymuszane. Nadchodząca zawartość wilgoci jest niesiona jako wilgotność względna pola 5–99 % tej strony, a poza tym pasmem jest stosowana na jego krawędzi, co jest zgłaszane wraz z liczbą otrzymaną i użytą."

      "uk": "185 із 185 записів еталонного тесту пройдено. Кожен психрометричний стан звірено з CoolProp 8.0.0 (реальне вологе повітря за ASHRAE RP-1485) і з незалежною реалізацією замкнених формул Bolton (1980) рівн. 10 та ASHRAE Fundamentals (2021) розд. 1 рівн. 20, 32, 33 і 35; підбір, енергію та вартість перевірено як точні бухгалтерські тотожності. Каталожні дані, поправка розрахункового дня, сталі річні коефіцієнти завантаження та умовна модель стратифікації свідомо не тестувалися. Стенд авторський; сторонньої перевірки не було.",
      "de": "185 von 185 Benchmark-Einträgen bestanden. Jeder psychrometrische Zustand wird gegen CoolProp 8.0.0 (reale feuchte Luft nach ASHRAE RP-1485) und gegen eine unabhängige geschlossene Implementierung von Bolton (1980) Gl. 10 sowie ASHRAE Fundamentals (2021) Kap. 1 Gl. 20, 32, 33 und 35 geprüft; Auslegung, Energie und Preisbildung werden als exakte Buchhaltungsidentitäten geprüft. Katalogdaten, die Auslegungstagskorrektur, die festen Jahreslastfaktoren und die Schichtungskonvention sind ausdrücklich nicht benchmarkt. Der Prüfstand stammt vom Autor; eine externe Prüfung fand nicht statt.",
      "nl": "185 van 185 benchmarkregels slagen. Elke psychrometrische toestand wordt getoetst aan CoolProp 8.0.0 (reëel vochtige lucht volgens ASHRAE RP-1485) en aan een onafhankelijke gesloten implementatie van Bolton (1980) verg. 10 en ASHRAE Fundamentals (2021) hfst. 1 verg. 20, 32, 33 en 35; dimensionering, energie en prijsopbouw worden als exacte boekhoudkundige identiteiten getoetst. Catalogusdata, de ontwerpdagcorrectie, de vaste jaarbelastingsfactoren en de stratificatieconventie zijn uitdrukkelijk niet gebenchmarkt. De testbank is van de auteur zelf; er was geen externe review.",
      "fr": "185 entrées de banc d'essai sur 185 réussissent. Chaque état psychrométrique est comparé à CoolProp 8.0.0 (air humide réel, ASHRAE RP-1485) et à une implémentation indépendante en forme fermée de Bolton (1980) éq. 10 et de l'ASHRAE Fundamentals (2021) ch. 1 éq. 20, 32, 33 et 35 ; le dimensionnement, l'énergie et le chiffrage sont vérifiés comme identités comptables exactes. Les données catalogue, la correction du jour de calcul, les facteurs de charge annuels fixes et la convention de stratification ne sont explicitement pas testés. Le banc est celui de l'auteur ; aucun tiers ne l'a examiné.",
      "es": "185 de 185 entradas del banco de pruebas pasan. Cada estado psicrométrico se contrasta con CoolProp 8.0.0 (aire húmedo real, ASHRAE RP-1485) y con una implementación independiente en forma cerrada de Bolton (1980) ec. 10 y ASHRAE Fundamentals (2021) cap. 1 ec. 20, 32, 33 y 35; el dimensionamiento, la energía y el coste se verifican como identidades contables exactas. Los datos de catálogo, la corrección del día de cálculo, los factores de carga anuales fijos y la convención de estratificación no se contrastan de forma explícita. El banco es del propio autor; ningún tercero lo ha revisado.",

  wWater:{en:"Adiabatic uses water (~{w} m³/yr, {c}) but saves a lot on electricity vs mechanical.",nl:"Adiabatiek verbruikt water (~{w} m³/jaar, {c}) maar bespaart fors op elektriciteit t.o.v. mechanisch.",fr:"L’adiabatique consomme de l’eau (~{w} m³/an, {c}) mais économise beaucoup d’électricité vs mécanique.",uk:"Адіабат споживає воду (~{w} м³/рік, {c}), але значно економить електрику проти механіки.",ru:"Адиабат расходует воду (~{w} м³/год, {c}), но сильно экономит электричество против механики.",de:"Adiabatik verbraucht Wasser (~{w} m³/Jahr, {c}), spart aber viel Strom vs. mechanisch.",es:"El adiabático consume agua (~{w} m³/año, {c}) pero ahorra mucha electricidad frente al mecánico.",pl:"Proces adiabatyczny zużywa wodę (~{w} m³/rok, {c}), ale pozwala zaoszczędzić dużo energii elektrycznej w porównaniu z procesem mechanicznym."},
  wExd:{en:"Design day lowered from {a} to {b} °C by {d} allowed exceedance days — this shrinks the installation considerably.",nl:"Ontwerpdag verlaagd van {a} naar {b} °C door {d} toegestane overschrijdingsdagen — dat verkleint de installatie aanzienlijk.",fr:"Jour de calcul abaissé de {a} à {b} °C par {d} jours de dépassement admis — cela réduit fortement l’installation.",uk:"Розрахунковий день знижено з {a} до {b} °C через {d} дозволених днів перевищення — це суттєво зменшує установку.",ru:"Расчётный день снижен с {a} до {b} °C за счёт {d} допустимых дней превышения — это заметно уменьшает установку.",de:"Auslegungstag von {a} auf {b} °C gesenkt durch {d} zulässige Überschreitungstage — das verkleinert die Anlage erheblich.",es:"Día de cálculo reducido de {a} a {b} °C por {d} días de excedencia permitidos — reduce mucho la instalación.",pl:"Dzień projektowy zmniejszono z {a} do {b} °C o {d} dni przekroczenia dozwolonego — powoduje to znaczne zmniejszenie instalacji."},
  wPv:{en:"Solar panels {k} kWp: ~{c}% of electricity self-generated — cooling peaks with the summer sun and then runs largely on free solar power.",nl:"Zonnepanelen {k} kWp: ~{c}% van de elektriciteit zelf opgewekt — de koeling piekt met de zomerzon en draait dan grotendeels op gratis zonnestroom.",fr:"Panneaux solaires {k} kWc : ~{c}% de l’électricité autoproduite — le refroidissement culmine avec le soleil d’été et fonctionne alors en grande partie gratuitement.",uk:"Сонячні панелі {k} кВт·п: ~{c}% електрики власного вироблення — охолодження пікує з літнім сонцем і працює переважно на безкоштовній енергії.",ru:"Солнечные панели {k} кВт·п: ~{c}% электроэнергии собственной генерации — охлаждение пикует с летним солнцем и работает в основном бесплатно.",de:"Solarmodule {k} kWp: ~{c}% des Stroms selbst erzeugt — die Kühlung hat mit der Sommersonne Spitzen und läuft dann weitgehend gratis.",es:"Paneles solares {k} kWp: ~{c}% de la electricidad autogenerada — la refrigeración alcanza su pico con el sol de verano y funciona en gran parte gratis.",pl:"Panele słoneczne {k} kWp: ~{c}% energii elektrycznej wytwarzanej samodzielnie — chłodzenie osiąga szczyt latem, gdy świeci słońce, a następnie działa w dużej mierze w oparciu o darmową energię słoneczną."},

  scenSub:{en:"Same Cairox fans as the base. Colder supply = less airflow = fewer fans. Options that miss the comfort target (temperature and humidity) are excluded automatically. Click a card for the detailed estimate.",nl:"Zelfde Cairox-ventilatoren als basis. Koudere toevoer = minder debiet = minder ventilatoren. Opties die het comfortdoel (temperatuur én vocht) niet halen, worden automatisch uitgesloten. Klik een kaart voor de detailraming.",fr:"Mêmes ventilateurs Cairox en base. Air plus froid = moins de débit = moins de ventilateurs. Les options qui manquent l’objectif (température et humidité) sont exclues automatiquement. Cliquez une carte pour le détail.",uk:"Ті самі вентилятори Cairox як основа. Холодніша подача = менша витрата = менше вентиляторів. Варіанти, що не досягають цілі (температура та вологість), виключаються автоматично. Клацніть картку для деталей.",ru:"Те же вентиляторы Cairox как основа. Холоднее приток = меньше расход = меньше вентиляторов. Варианты, не достигающие цели (температура и влажность), исключаются автоматически. Кликните карточку для деталей.",de:"Gleiche Cairox-Ventilatoren als Basis. Kältere Zuluft = weniger Volumenstrom = weniger Ventilatoren. Optionen, die das Komfortziel (Temperatur und Feuchte) verfehlen, werden automatisch ausgeschlossen. Karte anklicken für die Detailschätzung.",es:"Mismos ventiladores Cairox como base. Impulsión más fría = menos caudal = menos ventiladores. Las opciones que no cumplen el objetivo (temperatura y humedad) se excluyen automáticamente. Haga clic en una tarjeta para el detalle.",pl:"Te same wentylatory Cairox co w wersji podstawowej. Niższy nawiew = mniejszy przepływ powietrza = mniej wentylatorów. Opcje, które nie spełniają docelowego poziomu komfortu (temperatury i wilgotności), są automatycznie wykluczane. Kliknij kartę, aby uzyskać szczegółową wycenę."},

  assumTitle:{en:"Assumptions & sources",nl:"Aannames & bronnen",fr:"Hypothèses & sources",uk:"Припущення та джерела",ru:"Допущения и источники",de:"Annahmen & Quellen",es:"Supuestos y fuentes",pl:"Założenia i źródła"},
  assumBody:{
    en:"<b>Indicative public tool.</b> Selection and prices are indications based on the Cairox catalogue, <b>excluding VAT and without project or volume discounts</b>. The fans (supply + exhaust) are selected; the cooling itself — adiabatic section or mechanical coil — is out of scope and assumed <b>passive in the airstream</b>, driven by the same fans, and shown only as an indicative extra investment.<br><b>Basis:</b> psychrometrics after ASHRAE Handbook — Fundamentals (2021) ch. 1: saturation pressure from Bolton (1980) eq. 10, humidity ratio eq. 20, specific enthalpy eq. 32 and the thermodynamic wet-bulb temperature eq. 33 solved iteratively, so the wet bulb follows the entered barometric pressure. Adiabatic cooling follows the constant-wet-bulb line at the entered saturation effectiveness. The mechanical coil load is the <b>total</b> enthalpy drop less the enthalpy of the condensate (eq. 35), not the sensible part alone, and the coil can never add moisture. Each strategy is sized on its own supply state — colder supply needs less air. The occupied-zone temperature uses a stratification <b>convention</b>: a linear vertical profile, half the supply-to-extract rise at floor level and the full rise at the roof extract. The <b>design day</b> is the peak temperature minus a correction for the allowed exceedance days. Annual energy is a single design point times fixed load factors (fans 50 % of operating hours, cooling 50 %, evaporative wet fraction from the design temperature) — <b>not</b> a weather-bin calculation — and lifetime cost is undiscounted.",
    nl:"<b>Indicatieve publieke tool.</b> Selectie en prijzen zijn indicaties op basis van de Cairox-catalogus, <b>exclusief btw en zonder project- of volumekortingen</b>. De ventilatoren (toevoer + afvoer) worden geselecteerd; de koeling zelf — adiabatische sectie of mechanische koelbatterij — valt buiten de selectie en is <b>passief in de luchtstroom</b>, aangedreven door dezelfde ventilatoren, enkel getoond als indicatieve meerinvestering.<br><b>Basis:</b> psychrometrie volgens ASHRAE Handbook — Fundamentals (2021) hfst. 1: verzadigingsdruk uit Bolton (1980) verg. 10, vochtgehalte verg. 20, enthalpie verg. 32 en de thermodynamische natteboltemperatuur verg. 33 iteratief opgelost, zodat de natte bol de ingegeven luchtdruk volgt. Adiabatische koeling volgt de lijn van constante natte bol bij het ingegeven verzadigingsrendement. De mechanische koelbatterij wordt belast met de <b>totale</b> enthalpiedaling min de enthalpie van het condensaat (verg. 35), niet enkel het voelbare deel, en de batterij kan nooit vocht toevoegen. Elke strategie wordt op haar eigen toevoertoestand gedimensioneerd — koudere toevoer vraagt minder lucht. De temperatuur in de verblijfszone gebruikt een stratificatie<b>conventie</b>: een lineair verticaal profiel, de helft van de opwarming op vloerniveau en de volledige opwarming aan de dakafvoer. De <b>ontwerpdag</b> is de piektemperatuur min een correctie voor de toegestane overschrijdingsdagen. Jaarenergie is één ontwerppunt maal vaste belastingsfactoren (ventilatoren 50 % van de bedrijfsuren, koeling 50 %, natte fractie uit de ontwerptemperatuur) — <b>geen</b> binberekening op klimaatdata — en de levensduurkost is niet verdisconteerd.",
    fr:"<b>Outil public indicatif.</b> La sélection et les prix sont des indications d’après le catalogue Cairox, <b>hors TVA et sans remises de projet ou de volume</b>. Les ventilateurs (soufflage + extraction) sont sélectionnés ; le refroidissement lui-même — section adiabatique ou batterie mécanique — est hors périmètre et supposé <b>passif dans le flux d’air</b>, entraîné par les mêmes ventilateurs, et présenté seulement comme surcoût indicatif.<br><b>Base :</b> psychrométrie d’après l’ASHRAE Handbook — Fundamentals (2021) ch. 1 : pression de saturation de Bolton (1980) éq. 10, rapport de mélange éq. 20, enthalpie éq. 32 et température de bulbe humide thermodynamique éq. 33 résolue itérativement, de sorte que le bulbe humide suit la pression barométrique saisie. Le refroidissement adiabatique suit la ligne à bulbe humide constant à l’efficacité de saturation saisie. La batterie mécanique reçoit la chute d’enthalpie <b>totale</b> moins l’enthalpie des condensats (éq. 35), et non la seule part sensible ; elle ne peut jamais ajouter d’humidité. Chaque stratégie est dimensionnée sur son propre état de soufflage — un air plus froid demande moins d’air. La température de la zone d’occupation utilise une <b>convention</b> de stratification : profil vertical linéaire, la moitié de l’élévation au niveau du sol et l’élévation complète à l’extraction en toiture. Le <b>jour de calcul</b> est la température de pic moins une correction pour les jours de dépassement admis. L’énergie annuelle est un point de calcul unique multiplié par des facteurs de charge fixes (ventilateurs 50 % des heures, froid 50 %, fraction humide issue de la température de calcul) — <b>pas</b> un calcul par classes météo — et le coût sur la durée de vie n’est pas actualisé.",
    uk:"<b>Орієнтовний публічний інструмент.</b> Підбір і ціни — орієнтовні за каталогом Cairox, <b>без ПДВ і без проєктних чи об’ємних знижок</b>. Вентилятори (подача + витяжка) підбираються; саме охолодження — адіабатична секція чи механічна батарея — поза підбором і вважається <b>пасивним у потоці</b>, приводиться тими ж вентиляторами, показане лише як орієнтовна доінвестиція.<br><b>Основа:</b> психрометрія за ASHRAE Handbook — Fundamentals (2021), розд. 1: тиск насичення за Bolton (1980) рівн. 10, вологовміст рівн. 20, ентальпія рівн. 32 і термодинамічна температура вологої кулі рівн. 33, розв’язана ітеративно, тож волога куля враховує введений барометричний тиск. Адіабатичне охолодження йде лінією сталої вологої кулі за введеною ефективністю насичення. Механічна батарея навантажується <b>повним</b> падінням ентальпії мінус ентальпія конденсату (рівн. 35), а не лише явною частиною, і не може додавати вологу. Кожна стратегія підбирається за власним станом подачі — холодніша подача потребує менше повітря. Температура робочої зони використовує <b>умовну</b> модель стратифікації: лінійний вертикальний профіль, половина нагріву на рівні підлоги і повний нагрів на даховій витяжці. <b>Розрахунковий день</b> — пікова температура мінус поправка на дозволені дні перевищення. Річна енергія — одна розрахункова точка помножена на сталі коефіцієнти завантаження (вентилятори 50 % годин роботи, холод 50 %, волога частка з розрахункової температури), а <b>не</b> розрахунок за кліматичними інтервалами; вартість за строк служби не дисконтована.",
    ru:"<b>Ориентировочный публичный инструмент.</b> Подбор и цены — ориентировочные по каталогу Cairox, <b>без НДС и без проектных или объёмных скидок</b>. Вентиляторы (приток + вытяжка) подбираются; само охлаждение — адиабатическая секция или механическая батарея — вне подбора и считается <b>пассивным в потоке</b>, приводится теми же вентиляторами, показано лишь как ориентировочная доинвестиция.<br><b>Основа:</b> психрометрия по ASHRAE Handbook — Fundamentals (2021), гл. 1: давление насыщения по Bolton (1980) ур. 10, влагосодержание ур. 20, энтальпия ур. 32 и термодинамическая температура мокрого термометра ур. 33, решаемая итеративно, поэтому мокрый термометр учитывает введённое барометрическое давление. Адиабатическое охлаждение идёт по линии постоянного мокрого термометра при введённой эффективности насыщения. Механический воздухоохладитель нагружается <b>полным</b> падением энтальпии за вычетом энтальпии конденсата (ур. 35), а не только явной частью, и не может добавлять влагу. Каждая стратегия подбирается по собственному состоянию притока — более холодный приток требует меньше воздуха. Температура рабочей зоны использует <b>условную</b> модель стратификации: линейный вертикальный профиль, половина нагрева на уровне пола и полный нагрев на кровельной вытяжке. <b>Расчётный день</b> — пиковая температура минус поправка на разрешённые дни превышения. Годовая энергия — одна расчётная точка, умноженная на постоянные коэффициенты загрузки (вентиляторы 50 % часов работы, холод 50 %, влажная доля из расчётной температуры), а <b>не</b> расчёт по климатическим интервалам; стоимость за срок службы не дисконтирована.",
    de:"<b>Indikatives öffentliches Tool.</b> Auswahl und Preise sind Richtwerte nach dem Cairox-Katalog, <b>exklusive MwSt. und ohne Projekt- oder Mengenrabatte</b>. Die Ventilatoren (Zu- + Abluft) werden ausgewählt; die Kühlung selbst — adiabatische Sektion oder mechanisches Register — liegt außerhalb der Auswahl und gilt als <b>passiv im Luftstrom</b>, angetrieben von denselben Ventilatoren, nur als indikative Mehrinvestition gezeigt.<br><b>Basis:</b> Psychrometrie nach ASHRAE Handbook — Fundamentals (2021) Kap. 1: Sättigungsdruck nach Bolton (1980) Gl. 10, Feuchtegrad Gl. 20, Enthalpie Gl. 32 und die thermodynamische Feuchtkugeltemperatur Gl. 33 iterativ gelöst, sodass die Feuchtkugel dem eingegebenen Luftdruck folgt. Die adiabatische Kühlung folgt der Linie konstanter Feuchtkugeltemperatur bei der eingegebenen Sättigungseffizienz. Die mechanische Kühlbatterie wird mit dem <b>gesamten</b> Enthalpiegefälle abzüglich der Kondensatenthalpie belastet (Gl. 35), nicht nur mit dem sensiblen Anteil, und kann niemals Feuchte zuführen. Jede Strategie wird auf ihren eigenen Zuluftzustand ausgelegt — kältere Zuluft braucht weniger Luft. Die Aufenthaltszonentemperatur nutzt eine Schichtungs<b>konvention</b>: lineares Vertikalprofil, die halbe Erwärmung auf Bodenhöhe und die volle Erwärmung an der Dachabsaugung. Der <b>Auslegungstag</b> ist die Spitzentemperatur abzüglich einer Korrektur für die zulässigen Überschreitungstage. Die Jahresenergie ist ein einzelner Auslegungspunkt mal feste Lastfaktoren (Ventilatoren 50 % der Betriebsstunden, Kühlung 50 %, Nassanteil aus der Auslegungstemperatur) — <b>keine</b> Klimaklassenrechnung — und die Lebenszykluskosten sind nicht diskontiert.",
    es:"<b>Herramienta pública indicativa.</b> Selección y precios son indicaciones según el catálogo Cairox, <b>sin IVA y sin descuentos de proyecto o volumen</b>. Los ventiladores (impulsión + extracción) se seleccionan; la refrigeración en sí — sección adiabática o batería mecánica — queda fuera del alcance y se supone <b>pasiva en el flujo</b>, accionada por los mismos ventiladores, y se muestra solo como sobreinversión indicativa.<br><b>Base:</b> psicrometría según ASHRAE Handbook — Fundamentals (2021) cap. 1: presión de saturación de Bolton (1980) ec. 10, humedad específica ec. 20, entalpía ec. 32 y temperatura de bulbo húmedo termodinámico ec. 33 resuelta iterativamente, de modo que el bulbo húmedo sigue la presión barométrica introducida. El enfriamiento adiabático sigue la línea de bulbo húmedo constante con la eficacia de saturación introducida. La batería mecánica recibe la caída de entalpía <b>total</b> menos la entalpía del condensado (ec. 35), no solo la parte sensible, y nunca puede añadir humedad. Cada estrategia se dimensiona con su propio estado de impulsión — un aire más frío exige menos caudal. La temperatura de la zona ocupada usa una <b>convención</b> de estratificación: perfil vertical lineal, la mitad del calentamiento a nivel de suelo y el calentamiento completo en la extracción de cubierta. El <b>día de cálculo</b> es la temperatura pico menos una corrección por los días de excedencia admitidos. La energía anual es un único punto de cálculo por factores de carga fijos (ventiladores 50 % de las horas, frío 50 %, fracción húmeda a partir de la temperatura de cálculo) — <b>no</b> un cálculo por intervalos climáticos — y el coste a lo largo de la vida no está descontado.",
  pl:"<b>Publiczne narzędzie orientacyjne.</b> Dobór i ceny mają charakter orientacyjny i opierają się na katalogu Cairox, <b>bez VAT oraz bez rabatów projektowych i ilościowych</b>. Dobierane są wentylatory nawiewne i wywiewne; samo chłodzenie — sekcja adiabatyczna lub chłodnica mechaniczna — pozostaje poza zakresem i jest traktowane jako <b>pasywny element strumienia powietrza</b>, obsługiwany przez te same wentylatory i pokazany jedynie jako orientacyjny dodatkowy nakład inwestycyjny.<br><b>Podstawa:</b> psychrometria wg ASHRAE Handbook — Fundamentals (2021), rozdz. 1: ciśnienie nasycenia wg Boltona (1980), równ. 10, zawartość wilgoci wg równ. 20, entalpia właściwa wg równ. 32 oraz termodynamiczna temperatura termometru mokrego wg równ. 33, rozwiązywana iteracyjnie, dzięki czemu zależy od wprowadzonego ciśnienia barometrycznego. Chłodzenie adiabatyczne przebiega wzdłuż linii stałej temperatury termometru mokrego z zadaną sprawnością nasycenia. Obciążenie chłodnicy mechanicznej jest <b>całkowitym</b> spadkiem entalpii pomniejszonym o entalpię kondensatu (równ. 35), a nie tylko częścią jawną; chłodnica nigdy nie może dodawać wilgoci. Każda strategia jest wymiarowana dla własnego stanu nawiewu — chłodniejsze powietrze nawiewane wymaga mniejszego strumienia. Temperatura w strefie przebywania ludzi wykorzystuje <b>umowny</b> model stratyfikacji: liniowy profil pionowy, połowę wzrostu temperatury od nawiewu do wywiewu przy podłodze i pełny wzrost przy wywiewie dachowym. <b>Dzień obliczeniowy</b> to temperatura szczytowa pomniejszona o korektę wynikającą z dopuszczalnej liczby dni przekroczenia. Roczne zużycie energii jest obliczane z jednego punktu projektowego i stałych współczynników obciążenia (wentylatory 50% godzin pracy, chłodzenie 50%, udział pracy mokrej chłodzenia wyparnego wynikający z temperatury obliczeniowej) — <b>nie</b> jest to obliczenie metodą koszy pogodowych — a koszt w całym okresie użytkowania nie jest dyskontowany."},
  heroAdiaH:{en:"Adiabatic cooling: ~{a} °C → ~{b} °C at working height",nl:"Adiabatische koeling: ~{a} °C → ~{b} °C op werkhoogte",fr:"Refroidissement adiabatique : ~{a} °C → ~{b} °C à hauteur de travail",uk:"Адіабатичне охолодження: ~{a} °C → ~{b} °C на робочій висоті",ru:"Адиабатическое охлаждение: ~{a} °C → ~{b} °C на рабочей высоте",de:"Adiabatische Kühlung: ~{a} °C → ~{b} °C auf Arbeitshöhe",es:"Refrigeración adiabática: ~{a} °C → ~{b} °C a altura de trabajo",pl:"Chłodzenie adiabatyczne: ~{a} °C → ~{b} °C na wysokości roboczej"},
  heroAdiaP:{en:"At design day {t} °C / {r} % RH adiabatic meets the comfort target{x}. Colder supply with mechanical saves fans, but the chiller weighs more.",nl:"Bij ontwerpdag {t} °C / {r} % RV haalt adiabatiek het comfortdoel{x}. Koudere toevoer bij mechanisch bespaart ventilatoren, maar de koelmachine weegt zwaarder.",fr:"Au jour de calcul {t} °C / {r} % HR l’adiabatique atteint l’objectif{x}. Un air plus froid en mécanique économise des ventilateurs, mais le groupe froid pèse davantage.",uk:"За розрахунк. дня {t} °C / {r} % ВВ адіабат досягає цілі{x}. Холодніша подача в механіці економить вентилятори, але чилер важить більше.",ru:"При расч. дне {t} °C / {r} % ОВ адиабат достигает цели{x}. Холоднее приток в механике экономит вентиляторы, но чиллер весит больше.",de:"Am Auslegungstag {t} °C / {r} % rF erreicht Adiabatik das Komfortziel{x}. Kältere Zuluft bei mechanisch spart Ventilatoren, doch die Kältemaschine wiegt schwerer.",es:"En el día de cálculo {t} °C / {r} % HR el adiabático cumple el objetivo{x}. Una impulsión más fría en mecánico ahorra ventiladores, pero la enfriadora pesa más.",pl:"W dniu projektowym {t} °C / {r} % RH adiabatyczne warunki spełniają cel komfortu {x}. Chłodniejsze zasilanie mechaniczne oszczędza wentylatory, ale agregat chłodniczy waży więcej."},
  heroAdiaX:{en:" and is {p}% cheaper to install than mechanical cooling",nl:" en is {p}% goedkoper in investering dan mechanische koeling",fr:" et coûte {p}% moins cher à installer que le refroidissement mécanique",uk:" і на {p}% дешевший у монтажі за механічне охолодження",ru:" и на {p}% дешевле в установке, чем механическое охлаждение",de:" und ist {p}% günstiger als mechanische Kühlung",es:" y es {p}% más barato de instalar que la refrigeración mecánica",pl:" i jest o {p}% tańsze w inwestycji niż chłodzenie mechaniczne"},
  heroVentH:{en:"Ventilation alone suffices: ~{r} °C at working height",nl:"Alleen ventilatie volstaat: ~{r} °C op werkhoogte",fr:"La ventilation seule suffit : ~{r} °C à hauteur de travail",uk:"Достатньо лише вентиляції: ~{r} °C на робочій висоті",ru:"Достаточно одной вентиляции: ~{r} °C на рабочей высоте",de:"Nur Lüftung genügt: ~{r} °C auf Arbeitshöhe",es:"Basta la ventilación: ~{r} °C a altura de trabajo",pl:"Sama wentylacja wystarczy: ~{r} °C na wysokości roboczej"},
  heroVentP:{en:"With {d} allowed exceedance days/year the design day drops to {t} °C — fresh air alone holds the comfort target. No cooling needed, the cheapest solution.",nl:"Met {d} toegestane overschrijdingsdagen/jaar zakt de ontwerpdag naar {t} °C — verse lucht alleen houdt het comfortdoel. Geen koeling nodig, de goedkoopste oplossing.",fr:"Avec {d} jours de dépassement admis/an, le jour de calcul tombe à {t} °C — l’air neuf seul tient l’objectif. Pas de froid nécessaire, la solution la moins chère.",uk:"За {d} дозволених днів перевищення/рік розрахунковий день падає до {t} °C — саме свіже повітря тримає ціль. Охолодження не потрібне, найдешевше рішення.",ru:"При {d} допустимых днях превышения/год расчётный день падает до {t} °C — один свежий воздух держит цель. Охлаждение не нужно, самое дешёвое решение.",de:"Mit {d} zulässigen Überschreitungstagen/Jahr sinkt der Auslegungstag auf {t} °C — Frischluft allein hält das Ziel. Keine Kühlung nötig, die günstigste Lösung.",es:"Con {d} días de excedencia permitidos/año el día de cálculo baja a {t} °C — solo el aire fresco cumple el objetivo. Sin refrigeración, la solución más barata.",pl:"Przy {d} dopuszczalnych dniach przekroczenia temperatury w roku, temperatura w ciągu dnia projektowego spada do {t} °C — samo świeże powietrze utrzymuje docelowy poziom komfortu. Brak potrzeby chłodzenia, najtańsze rozwiązanie."},
  heroMechH:{en:"Mechanical cooling required: comfort target {t} °C / {r} % RH",nl:"Mechanische koeling nodig: comfortdoel {t} °C / {r} % RV",fr:"Refroidissement mécanique requis : objectif {t} °C / {r} % HR",uk:"Потрібне механічне охолодження: ціль {t} °C / {r} % ВВ",ru:"Нужно механическое охлаждение: цель {t} °C / {r} % ОВ",de:"Mechanische Kühlung nötig: Komfortziel {t} °C / {r} % rF",es:"Se requiere refrigeración mecánica: objetivo {t} °C / {r} % HR",pl:"Wymagane chłodzenie mechaniczne: cel komfortu {t} °C / {r}% RH"},
  heroMechP:{en:"In this climate ventilation and adiabatic miss the target (temperature or humidity). Mechanical cooling holds {t} °C and dries the air — higher investment and running cost.",nl:"In dit klimaat halen ventilatie en adiabatiek het doel niet (temperatuur of vocht). Mechanische koeling houdt {t} °C en droogt de lucht — hogere investering en werkingskost.",fr:"Dans ce climat, ventilation et adiabatique manquent l’objectif (température ou humidité). Le refroidissement mécanique tient {t} °C et assèche l’air — investissement et coût plus élevés.",uk:"У цьому кліматі вентиляція й адіабат не досягають цілі (температура чи вологість). Механічне охолодження тримає {t} °C і осушує повітря — вищі інвестиція та витрати.",ru:"В этом климате вентиляция и адиабат не достигают цели (температура или влажность). Механическое охлаждение держит {t} °C и осушает воздух — выше инвестиция и расходы.",de:"In diesem Klima verfehlen Lüftung und Adiabatik das Ziel (Temperatur oder Feuchte). Mechanische Kühlung hält {t} °C und trocknet die Luft — höhere Investition und Betriebskosten.",es:"En este clima la ventilación y el adiabático no alcanzan el objetivo (temperatura o humedad). La refrigeración mecánica mantiene {t} °C y seca el aire — mayor inversión y coste.",pl:"W tym klimacie wentylacja i adiabatyka nie osiągają celu (temperatury lub wilgotności). Chłodzenie mechaniczne utrzymuje {t} °C i osusza powietrze — co wiąże się z wyższymi kosztami inwestycyjnymi i eksploatacyjnymi."}

  kbDesign:{en:"The design day is the peak temperature minus a correction for the allowed exceedance days.",nl:"De ontwerpdag is de piektemperatuur min een correctie voor de toegestane overschrijdingsdagen.",fr:"Le jour de calcul est la température de pic moins une correction pour les jours de dépassement admis.",uk:"Розрахунковий день — пікова температура мінус поправка на дозволені дні перевищення.",ru:"Расчётный день — пиковая температура минус поправка на разрешённые дни превышения.",de:"Der Auslegungstag ist die Spitzentemperatur abzüglich einer Korrektur für die zulässigen Überschreitungstage.",es:"El día de cálculo es la temperatura pico menos una corrección por los días de excedencia admitidos.",pl:"Temperatura dnia obliczeniowego jest temperaturą szczytową pomniejszoną o korektę wynikającą z dopuszczalnej liczby dni przekroczenia."},
  kbStrat:{en:"The occupied-zone temperature uses a stratification convention: a linear vertical profile, half the supply-to-extract rise at floor level and the full rise at the roof extract.",nl:"De temperatuur in de verblijfszone gebruikt een stratificatieconventie: een lineair verticaal profiel, de helft van de opwarming op vloerniveau en de volledige opwarming aan de dakafvoer.",fr:"La température de la zone d’occupation utilise une convention de stratification : profil vertical linéaire, la moitié de l’élévation au niveau du sol et l’élévation complète à l’extraction en toiture.",uk:"Температура робочої зони використовує умовну модель стратифікації: лінійний вертикальний профіль, половина нагріву на рівні підлоги і повний нагрів на даховій витяжці.",ru:"Температура рабочей зоны использует условную модель стратификации: линейный вертикальный профиль, половина нагрева на уровне пола и полный нагрев на кровельной вытяжке.",de:"Die Aufenthaltszonentemperatur nutzt eine Schichtungskonvention: lineares Vertikalprofil, die halbe Erwärmung auf Bodenhöhe und die volle Erwärmung an der Dachabsaugung.",es:"La temperatura de la zona ocupada usa una convención de estratificación: perfil vertical lineal, la mitad del calentamiento a nivel de suelo y el calentamiento completo en la extracción de cubierta.",pl:"Temperaturę w strefie zajmowanej oblicza się na podstawie konwencji stratyfikacji: liniowy profil pionowy, połowa wzrostu dopływu do wyciągu na poziomie podłogi i pełny wzrost na poziomie wyciągu dachowego."},
  kbAdia:{en:"Adiabatic cooling follows the constant-wet-bulb line at the entered saturation effectiveness.",nl:"Adiabatische koeling volgt de lijn van constante natte bol bij het ingegeven verzadigingsrendement.",fr:"Le refroidissement adiabatique suit la ligne à bulbe humide constant à l’efficacité de saturation saisie.",uk:"Адіабатичне охолодження йде лінією сталої вологої кулі за введеною ефективністю насичення.",ru:"Адиабатическое охлаждение идёт по линии постоянного мокрого термометра при введённой эффективности насыщения.",de:"Die adiabatische Kühlung folgt der Linie konstanter Feuchtkugeltemperatur bei der eingegebenen Sättigungseffizienz.",es:"El enfriamiento adiabático sigue la línea de bulbo húmedo constante con la eficacia de saturación introducida.",pl:"Chłodzenie adiabatyczne przebiega wzdłuż linii stałej temperatury termometru mokrego z zadaną sprawnością nasycenia."},
  kbCoil:{en:"The mechanical coil load is the total enthalpy drop less the enthalpy of the condensate (ASHRAE Fundamentals 2021 ch. 1 eq. 35), not the sensible part alone, and the coil can never add moisture.",nl:"De mechanische koelbatterij wordt belast met de totale enthalpiedaling min de enthalpie van het condensaat (ASHRAE Fundamentals 2021 hfst. 1 verg. 35), niet enkel het voelbare deel, en de batterij kan nooit vocht toevoegen.",fr:"La batterie mécanique reçoit la chute d’enthalpie totale moins l’enthalpie des condensats (ASHRAE Fundamentals 2021 ch. 1 éq. 35), et non la seule part sensible ; elle ne peut jamais ajouter d’humidité.",uk:"Механічна батарея навантажується повним падінням ентальпії мінус ентальпія конденсату (ASHRAE Fundamentals 2021 розд. 1 рівн. 35), а не лише явною частиною, і не може додавати вологу.",ru:"Механический воздухоохладитель нагружается полным падением энтальпии за вычетом энтальпии конденсата (ASHRAE Fundamentals 2021 гл. 1 ур. 35), а не только явной частью, и не может добавлять влагу.",de:"Die mechanische Kühlbatterie wird mit dem gesamten Enthalpiegefälle abzüglich der Kondensatenthalpie belastet (ASHRAE Fundamentals 2021 Kap. 1 Gl. 35), nicht nur mit dem sensiblen Anteil, und kann niemals Feuchte zuführen.",es:"La batería mecánica recibe la caída de entalpía total menos la entalpía del condensado (ASHRAE Fundamentals 2021 cap. 1 ec. 35), no solo la parte sensible, y nunca puede añadir humedad.",pl:"Obciążenie cewki mechanicznej to całkowity spadek entalpii pomniejszony o entalpię kondensatu (ASHRAE Fundamentals 2021, rozdz. 1, równ. 35), a nie sama część odczuwalna, przy czym cewka nigdy nie może dodać wilgoci."},
  kbSize:{en:"Each strategy is sized on its own supply state — colder supply needs less air.",nl:"Elke strategie wordt op haar eigen toevoertoestand gedimensioneerd — koudere toevoer vraagt minder lucht.",fr:"Chaque stratégie est dimensionnée sur son propre état de soufflage — un air plus froid demande moins d’air.",uk:"Кожна стратегія підбирається за власним станом подачі — холодніша подача потребує менше повітря.",ru:"Каждая стратегия подбирается по собственному состоянию притока — более холодный приток требует меньше воздуха.",de:"Jede Strategie wird auf ihren eigenen Zuluftzustand ausgelegt — kältere Zuluft braucht weniger Luft.",es:"Cada estrategia se dimensiona con su propio estado de impulsión — un aire más frío exige menos caudal.",pl:"Każda strategia jest wymiarowana dla własnego stanu nawiewu — chłodniejsze powietrze nawiewane wymaga mniejszego strumienia."},
  kbPrice:{en:"Selection and prices are indications based on the Cairox catalogue, excluding VAT and without project or volume discounts. The fans (supply + exhaust) are selected; the cooling itself — adiabatic section or mechanical coil — is out of scope and assumed passive in the airstream, driven by the same fans, and shown only as an indicative extra investment.",nl:"Selectie en prijzen zijn indicaties op basis van de Cairox-catalogus, exclusief btw en zonder project- of volumekortingen. De ventilatoren (toevoer + afvoer) worden geselecteerd; de koeling zelf — adiabatische sectie of mechanische koelbatterij — valt buiten de selectie en is passief in de luchtstroom, aangedreven door dezelfde ventilatoren, enkel getoond als indicatieve meerinvestering.",fr:"La sélection et les prix sont des indications d’après le catalogue Cairox, hors TVA et sans remises de projet ou de volume. Les ventilateurs (soufflage + extraction) sont sélectionnés ; le refroidissement lui-même — section adiabatique ou batterie mécanique — est hors périmètre et supposé passif dans le flux d’air, entraîné par les mêmes ventilateurs, et présenté seulement comme surcoût indicatif.",uk:"Підбір і ціни — орієнтовні за каталогом Cairox, без ПДВ і без проєктних чи об’ємних знижок. Вентилятори (подача + витяжка) підбираються; саме охолодження — адіабатична секція чи механічна батарея — поза підбором і вважається пасивним у потоці, приводиться тими ж вентиляторами, показане лише як орієнтовна доінвестиція.",ru:"Подбор и цены — ориентировочные по каталогу Cairox, без НДС и без проектных или объёмных скидок. Вентиляторы (приток + вытяжка) подбираются; само охлаждение — адиабатическая секция или механическая батарея — вне подбора и считается пассивным в потоке, приводится теми же вентиляторами, показано лишь как ориентировочная доинвестиция.",de:"Auswahl und Preise sind Richtwerte nach dem Cairox-Katalog, exklusive MwSt. und ohne Projekt- oder Mengenrabatte. Die Ventilatoren (Zu- + Abluft) werden ausgewählt; die Kühlung selbst — adiabatische Sektion oder mechanisches Register — liegt außerhalb der Auswahl und gilt als passiv im Luftstrom, angetrieben von denselben Ventilatoren, nur als indikative Mehrinvestition gezeigt.",es:"Selección y precios son indicaciones según el catálogo Cairox, sin IVA y sin descuentos de proyecto o volumen. Los ventiladores (impulsión + extracción) se seleccionan; la refrigeración en sí — sección adiabática o batería mecánica — queda fuera del alcance y se supone pasiva en el flujo, accionada por los mismos ventiladores, y se muestra solo como sobreinversión indicativa.",pl:"Wybór i ceny są orientacyjne, oparte na katalogu Cairox, bez VAT i bez rabatów projektowych lub ilościowych. Dobierane są wentylatory (nawiewne i wywiewne); samo chłodzenie – sekcja adiabatyczna lub wężownica mechaniczna – nie jest objęte zakresem i zakłada się, że jest pasywne w strumieniu powietrza, napędzane tymi samymi wentylatorami i pokazane jedynie jako orientacyjna dodatkowa inwestycja."},
  kbEnergy:{en:"Annual energy is a single design point times fixed load factors (fans 50 % of operating hours, cooling 50 %, evaporative wet fraction from the design temperature) — not a weather-bin calculation — and lifetime cost is undiscounted.",nl:"Jaarenergie is één ontwerppunt maal vaste belastingsfactoren (ventilatoren 50 % van de bedrijfsuren, koeling 50 %, natte fractie uit de ontwerptemperatuur) — geen binberekening op klimaatdata — en de levensduurkost is niet verdisconteerd.",fr:"L’énergie annuelle est un point de calcul unique multiplié par des facteurs de charge fixes (ventilateurs 50 % des heures, froid 50 %, fraction humide issue de la température de calcul) — pas un calcul par classes météo — et le coût sur la durée de vie n’est pas actualisé.",uk:"Річна енергія — одна розрахункова точка помножена на сталі коефіцієнти завантаження (вентилятори 50 % годин роботи, холод 50 %, волога частка з розрахункової температури), а не розрахунок за кліматичними інтервалами; вартість за строк служби не дисконтована.",ru:"Годовая энергия — одна расчётная точка, умноженная на постоянные коэффициенты загрузки (вентиляторы 50 % часов работы, холод 50 %, влажная доля из расчётной температуры), а не расчёт по климатическим интервалам; стоимость за срок службы не дисконтирована.",de:"Die Jahresenergie ist ein einzelner Auslegungspunkt mal feste Lastfaktoren (Ventilatoren 50 % der Betriebsstunden, Kühlung 50 %, Nassanteil aus der Auslegungstemperatur) — keine Klimaklassenrechnung — und die Lebenszykluskosten sind nicht diskontiert.",es:"La energía anual es un único punto de cálculo por factores de carga fijos (ventiladores 50 % de las horas, frío 50 %, fracción húmeda a partir de la temperatura de cálculo) — no un cálculo por intervalos climáticos — y el coste a lo largo de la vida no está descontado.",pl:"Roczne zużycie energii to iloczyn pojedynczego punktu projektowego i stałych współczynników obciążenia (wentylatory 50% godzin pracy, chłodzenie 50%, parowanie wilgotnej frakcji od temperatury projektowej) — nie jest to wyliczenie zależne od warunków atmosferycznych — a koszt cyklu życia nie jest dyskontowany."},
  kbLoad:{en:"Either build the sensible heat load up from machines, people, lighting and solar gains, or enter one known total. The two methods are exclusive: with a known total the build-up fields are not used.",nl:"Bouw de voelbare warmtelast op uit machines, personen, verlichting en zonlast, of geef één gekend totaal in. De twee methodes sluiten elkaar uit: bij een gekend totaal worden de opbouwvelden niet gebruikt.",fr:"Composez la charge thermique sensible à partir des machines, des personnes, de l’éclairage et des apports solaires, ou saisissez un total connu. Les deux méthodes sont exclusives : avec un total connu, les champs de composition ne servent pas.",uk:"Складіть явне теплове навантаження з машин, людей, освітлення та сонячних надходжень або введіть одне відоме сумарне значення. Методи взаємовиключні: за відомого сумарного значення поля складання не використовуються.",ru:"Сложите явную тепловую нагрузку из машин, людей, освещения и солнечных поступлений или введите один известный итог. Методы взаимоисключающие: при известном итоге поля составления не используются.",de:"Bauen Sie die sensible Wärmelast aus Maschinen, Personen, Beleuchtung und Solarlasten auf oder geben Sie einen bekannten Gesamtwert ein. Die beiden Methoden schließen sich aus: bei einem bekannten Gesamtwert werden die Aufbaufelder nicht verwendet.",es:"Componga la carga térmica sensible a partir de máquinas, personas, iluminación y ganancias solares, o introduzca un total conocido. Los dos métodos son excluyentes: con un total conocido no se usan los campos de composición.",pl:"Obciążenie ciepłem jawnym można zbudować ze składowych od maszyn, ludzi, oświetlenia i zysków słonecznych albo podać jedną znaną wartość całkowitą. Metody są rozłączne: po podaniu wartości całkowitej pola składowych nie są używane."},
  kbClamp:{en:"Accepted range {a}–{b}; values outside it are held at the limit in the calculation.",nl:"Aanvaard bereik {a}–{b}; waarden erbuiten worden in de berekening op de grens gehouden.",fr:"Plage acceptée {a}–{b} ; au-delà, la valeur est maintenue à la limite dans le calcul.",uk:"Прийнятний діапазон {a}–{b}; поза ним значення утримується на межі в розрахунку.",ru:"Допустимый диапазон {a}–{b}; вне его значение удерживается на границе расчёта.",de:"Zulässiger Bereich {a}–{b}; darüber hinaus wird der Grenzwert gerechnet.",es:"Rango aceptado {a}–{b}; fuera de él se calcula con el límite.",pl:"Zakres akceptowany {a}–{b}; wartości poza nim są utrzymywane na poziomie granicznym w obliczeniach."},
  hoRangeLo:{en:"Handoff: {q} = {v} {u} is below {a} {u}, the lowest value this page’s model reaches for it. Nothing was applied for {q}.",nl:"Overdracht: {q} = {v} {u} ligt onder {a} {u}, de laagste waarde die het model van deze pagina ervoor bereikt. Voor {q} is niets toegepast.",fr:"Transfert : {q} = {v} {u} est sous {a} {u}, la valeur la plus basse que le modèle de cette page atteigne pour elle. Rien n’a été appliqué pour {q}.",uk:"Передача: {q} = {v} {u} нижче за {a} {u} — найменше значення, якого для нього досягає модель цієї сторінки. Для {q} нічого не застосовано.",ru:"Передача: {q} = {v} {u} ниже {a} {u} — наименьшего значения, которого для него достигает модель этой страницы. Для {q} ничего не применено.",de:"Übergabe: {q} = {v} {u} liegt unter {a} {u}, dem niedrigsten Wert, den das Modell dieser Seite dafür erreicht. Für {q} wurde nichts übernommen.",es:"Traspaso: {q} = {v} {u} está por debajo de {a} {u}, el valor más bajo que el modelo de esta página alcanza para ello. No se aplicó nada para {q}.",pl:"Przekazanie: {q} = {v} {u} jest poniżej {a} {u}, najniższej wielkości, jaką osiąga dla niej model tej strony. Dla {q} nie zastosowano nic."},
  hoRangeSat:{en:"Handoff: {v} Pa is at or below the saturation pressure {e} Pa at {t} K, so eq. 20 of ASHRAE ch. 1 has no moist-air state there. Nothing was applied.",nl:"Overdracht: {v} Pa ligt op of onder de verzadigingsdruk {e} Pa bij {t} K, zodat verg. 20 van ASHRAE hfst. 1 daar geen toestand van vochtige lucht heeft. Er is niets toegepast.",fr:"Transfert : {v} Pa est égal ou inférieur à la pression de saturation {e} Pa à {t} K, si bien que l’éq. 20 de l’ASHRAE ch. 1 n’y a aucun état d’air humide. Rien n’a été appliqué.",uk:"Передача: {v} Pa дорівнює або менше за тиск насичення {e} Pa за {t} K, тому рівн. 20 ASHRAE розд. 1 не має там стану вологого повітря. Нічого не застосовано.",ru:"Передача: {v} Pa равно или меньше давления насыщения {e} Pa при {t} K, поэтому ур. 20 ASHRAE гл. 1 не имеет там состояния влажного воздуха. Ничего не применено.",de:"Übergabe: {v} Pa liegt auf oder unter dem Sättigungsdruck {e} Pa bei {t} K, sodass Gl. 20 aus ASHRAE Kap. 1 dort keinen Zustand feuchter Luft hat. Es wurde nichts übernommen.",es:"Traspaso: {v} Pa es igual o inferior a la presión de saturación {e} Pa a {t} K, de modo que la ec. 20 del ASHRAE cap. 1 no tiene ahí ningún estado de aire húmedo. No se aplicó nada.",pl:"Przekazanie: {v} Pa jest równe ciśnieniu nasycenia {e} Pa przy {t} K lub od niego mniejsze, więc równ. 20 z ASHRAE rozdz. 1 nie ma tam stanu powietrza wilgotnego. Nie zastosowano nic."},
  hoClampRh:{en:"Handoff: w = {v} kg/kg gives a relative humidity of {r} %, outside the {a}–{b} % band this page’s own humidity field states; it was applied at the edge of that band, {e} %.",nl:"Overdracht: w = {v} kg/kg geeft een relatieve vochtigheid van {r} %, buiten de band {a}–{b} % die het vochtveld van deze pagina zelf aangeeft; toegepast op de grens van die band, {e} %.",fr:"Transfert : w = {v} kg/kg donne une humidité relative de {r} %, hors de la bande {a}–{b} % que le champ d’humidité de cette page indique lui-même ; appliquée au bord de cette bande, {e} %.",uk:"Передача: w = {v} kg/kg дає відносну вологість {r} %, поза смугою {a}–{b} %, яку задає власне поле вологості цієї сторінки; застосовано на межі цієї смуги, {e} %.",ru:"Передача: w = {v} kg/kg даёт относительную влажность {r} %, вне полосы {a}–{b} %, которую задаёт собственное поле влажности этой страницы; применено на границе этой полосы, {e} %.",de:"Übergabe: w = {v} kg/kg ergibt eine relative Feuchte von {r} %, außerhalb des Bandes {a}–{b} %, das das Feuchtefeld dieser Seite selbst angibt; übernommen am Rand dieses Bandes, {e} %.",es:"Traspaso: w = {v} kg/kg da una humedad relativa del {r} %, fuera de la banda {a}–{b} % que indica el propio campo de humedad de esta página; se aplicó en el borde de esa banda, {e} %.",pl:"Przekazanie: w = {v} kg/kg daje wilgotność względną {r} %, poza pasmem {a}–{b} %, które podaje własne pole wilgotności tej strony; zastosowano na krawędzi tego pasma, {e} %."}

function t(k){const o=T[k];return o?(o[LANG]||o.en):k;}
function tf(k,v){let s=t(k);for(const p in v)s=s.split("{"+p+"}").join(v[p]);return s;}

/* number formatting.
   The separator between the items of a list of values is a locale decision in
   exactly the way the decimal separator is, and for the same reason: where the
   comma is the decimal mark it cannot also separate items, so "19,5 °C, 21,0 °C"
   reads as four numbers. One place owns it, and that place is the framework's
   locale map (_docs/NUMBER-FORMAT.md): en keeps ", ", the other six take "; ",
   French with the non-breaking space the Imprimerie nationale rule asks for.
   nf/eur/nfLoc below are not routed to that map: measured on ICU 78.2 their
   separators equal it character for character in all six non-English languages,
   and in English they print the CLDR comma where the map's screen rule prints
   U+2009, so routing them moves 41 English renderings. See DELIVERY.md R-1. */
const nlist=a=>{const U=window.DiagramUI;
  return (U&&U.num&&U.num.list)?U.num.list(a):a.join(", ");};
const nf=(n,d)=>new Intl.NumberFormat(LOCALE[LANG],{maximumFractionDigits:d,minimumFractionDigits:d}).format(n);
const fmt=(n,d=0)=>nf(n,d);
const eur=n=>"€"+new Intl.NumberFormat(LOCALE[LANG],{maximumFractionDigits:0}).format(Math.round(n/100)*100);
const eurk=n=>"€"+fmt(n/1000,0)+"k";

/* psychrometrics — ASHRAE Handbook Fundamentals (2021) ch.1.
   esat  : Bolton (1980) eq.10, kPa, 0.1 % for -35..+35 °C
   W     : eq.20   W = 0.62198 p_w/(P - p_w)
   h     : eq.32   h = 1.006 t + W (2501 + 1.86 t)  kJ per kg dry air
   t*    : eq.33   thermodynamic wet bulb, solved by bisection (pressure dependent)
   rho   : dry-air partial pressure over R_da T, i.e. kg dry air per m3 of moist air */
const MWR=0.62198, RA=287.042, CPA=1006, CPV=1860, HFG0=2501000, CPW=4186;
const esat=T2=>0.6112*Math.exp(17.67*T2/(T2+243.5));
const wSat=(T2,P)=>{const e=esat(T2);return MWR*e/(P-e);};
const humRatio=(T2,RH,P)=>{const e=(RH/100)*esat(T2);return MWR*e/(P-e);};
const relHum=(w,T2,P)=>{const e=w*P/(MWR+w);return Math.min(100,100*e/esat(T2));};
const enth=(T2,w)=>CPA*T2+w*(HFG0+CPV*T2);                       /* J per kg dry air */
const cpMoist=w=>CPA+CPV*w;                                      /* J/(kg dry air·K) */
const rho=(T2,w,P)=>{const e=w*P/(MWR+w);return (P-e)*1000/(RA*(T2+273.15));};
/* humidity ratio at dry bulb T2 on the constant-wet-bulb line through t* (eq.33) */
const wOnWetBulb=(T2,ts,P)=>((2501-2.326*ts)*wSat(ts,P)-1.006*(T2-ts))/(2501+1.86*T2-4.186*ts);
function wetBulb(T2,w,P){let lo=-70,hi=T2;
  for(let n=0;n<90;n++){const ts=0.5*(lo+hi);if(wOnWetBulb(T2,ts,P)>w)hi=ts;else lo=ts;}
  return 0.5*(lo+hi);}
