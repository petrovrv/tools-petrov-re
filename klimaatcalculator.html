const WALL={vFree:27855,der:0.62,kW:2.2,price:3600};
const ADIAB_PER_M3H=0.45, MECH_PER_KW=850, MECH_SUPPLY=16, MECH_RH=95, NAT_PER_M3H=0.16;
const DT_VENT=3;   /* design supply-to-extract rise for the ventilation-only case, K */
const DT_MIN=2;    /* smallest supply-to-target difference that can still be dimensioned, K */
const FAN_LOAD=0.5, PV_YIELD=0.45, BLEED=1.15;

/* ---- what an incoming quantity is held to (AGENTS 2.4; the 2026-09-26 re-decision) ----
   A bound is either the one the receiving field declares, or the one this page's own model
   declares, cited to its line. No other number is used.
   T  : floor 203,15 K - wetBulb() (line 480) brackets ASHRAE F-2021 ch. 1 eq. 33 at
        lo = -70 degC, so below it the bisection returns the bracket end in place of a wet
        bulb. No upper number is declared, so the ceiling is the model's own possibility
        test below.
   p  : no range is declared anywhere on this page. What the model needs is eq. 20's
        denominator P - p_w (wSat, humRatio, relHum, lines 472-474): the total pressure has
        to exceed the saturation pressure it is divided by. That one test is applied to T
        and to p together, so neither carries an invented band.
   rh : 5-99 %, the band readInputs() holds the typed humidity field to (line 540). w is
        held in no field of this page, so an incoming w is CLAMPED into that band and the
        figure received, the figure used and the edge are all shown.
   Q  : the sensible load. Neither a field nor the model declares a bound, so the only test
        is that it is positive. */
const HO_RANGE={
  T :{lo:203.15,loC:-70,unit:"K"},
  rh:{lo:5,hi:99,unit:"%"},
  Q :{lo:0,unit:"W"}
};
const KINDS=["vent","adia","mech"];
const KMETA={vent:{s:"sVent",n:"nVent"},adia:{s:"sAdia",n:"nAdia"},mech:{s:"sMech",n:"nMech"}};
/* Strategy colours are tokens, not tool literals: the three tones the token layer
   publishes are used consistently in the cards, the bars and the curves. */
const KCOL={vent:"var(--warn)",adia:"var(--ok)",mech:"var(--accent)"};
const LOADCOL=["var(--accent)","var(--warn)","var(--ok)","var(--bad)","var(--muted)"];
let LAST=null,SELK="adia",ui=null;

/* ===================== state =====================
   The state object holds exactly the keys the permalink has always carried, with
   the same string values the input elements used to report, so a link made before
   this port deserialises unchanged. */
const IDS=["len","wid","hgt","wh","ppl","hrs","todb","rh","p","exdays","ttar","maxrh",
  "qknown","qmach","activity","qlight","qroof","qglass","qsun","vexist","extract","balance","eff",
  "pel","pwat","pvkwp","eer","mrate","years","mvent","madia","mmech","lm"];
const DEFAULTS={loadMode:"build",extMode:"mech",sel:null,
  len:"60",wid:"30",hgt:"8",wh:"1.7",ppl:"25",hrs:"2200",
  todb:"32",rh:"40",p:"1013",exdays:"5",ttar:"27",maxrh:"75",
  qknown:"150",qmach:"60",activity:"140",qlight:"10",qroof:"20",qglass:"120",qsun:"300",
  vexist:"8000",extract:"roof",balance:"0",eff:"88",
  pel:"0.28",pwat:"4.0",pvkwp:"0",eer:"3.4",
  mrate:"65",years:"10",mvent:"10",madia:"28",mmech:"40",lm:"40"};
let state=Object.assign({},DEFAULTS);

function readInputs(st){
  return {loadMode:st.loadMode,extMode:st.extMode,len:+st.len,wid:+st.wid,hgt:+st.hgt,wh:+st.wh,ppl:+st.ppl,hrs:+st.hrs,
    Tdb:Math.max(HO_RANGE.T.loC,+st.todb),
    RH:Math.min(HO_RANGE.rh.hi,Math.max(HO_RANGE.rh.lo,+st.rh)),
    P:+st.p/10,exdays:Math.max(0,+st.exdays),
    Ttar:+st.ttar,maxrh:Math.min(100,Math.max(30,+st.maxrh)),
    qknown:+st.qknown,qmach:+st.qmach,activity:+st.activity,qlight:+st.qlight,qroof:+st.qroof,qglass:+st.qglass,qsun:+st.qsun,
    vexist:+st.vexist,extract:st.extract,balance:+st.balance,eff:Math.min(95,Math.max(40,+st.eff))/100,
    pel:+st.pel,pwat:+st.pwat,pvkwp:Math.max(0,+st.pvkwp),eer:Math.max(2,+st.eer),lm:+st.lm,years:Math.max(1,Math.min(25,+st.years)),
    mrate:Math.max(0,+st.mrate),mvent:Math.max(0,+st.mvent),madia:Math.max(0,+st.madia),mmech:Math.max(0,+st.mmech)};
}

function wetFraction(i){return Math.min(0.85,Math.max(0.2,(i.designTdb-20)/22));}
/* Occupied-zone fraction of the supply-to-extract temperature rise.  Convention (not a
   validated model): a linear vertical profile, half the rise at floor level and the full
   rise at the roof extract, so the extract temperature always closes the sensible balance. */
function stratFraction(i){return 0.5+0.5*Math.min(1,Math.max(0,i.wh/i.hgt));}
function extObj(i){return i.extract==="wall"?{o:WALL,name:t("fanWall")}:{o:ROOF,name:t("fanRoof")};}

function compute(i){
  const vol=i.len*i.wid*i.hgt, floor=i.len*i.wid;
  let Q, comp;
  if(i.loadMode==="known"){comp=[[t("cKnown"),i.qknown]]; Q=i.qknown;}
  else{comp=[[t("cMachines"),i.qmach],[t("cPeople"),i.ppl*i.activity/1000],[t("cLight"),i.qlight*floor/1000],[t("cRoof"),i.qroof*floor/1000],[t("cGlass"),i.qsun*i.qglass/1000]];
       Q=comp.reduce((a,r)=>a+r[1],0);}
  const exRed=2.2*Math.log(1+i.exdays/3);
  const designTdb=Math.max(20,i.Tdb-exRed); i.designTdb=designTdb;
  const wOut=humRatio(designTdb,i.RH,i.P);
  const Twb=wetBulb(designTdb,wOut,i.P), Tad=designTdb-i.eff*(designTdb-Twb);
  const wSup=wOnWetBulb(Tad,Twb,i.P);           /* exactly on the constant-wet-bulb line */
  const rhoOut=rho(designTdb,wOut,i.P);
  return {i,vol,floor,Q,comp,exRed,designTdb,Twb,Tad,wOut,wSup,rhoOut,fStrat:stratFraction(i)};
}
function scen(c,k){
  const i=c.i,P=i.P,target=i.Ttar;
  let Ts,wS;
  if(k==="vent"){Ts=c.designTdb;wS=c.wOut;}
  else if(k==="adia"){Ts=c.Tad;wS=c.wSup;}
  /* a cooling coil can only remove moisture: the leaving humidity ratio is the entering
     one when the coil runs dry, otherwise the near-saturated state at the supply temperature */
  else{Ts=MECH_SUPPLY;wS=Math.min(c.wOut,humRatio(MECH_SUPPLY,MECH_RH,P));}
  /* the fan moves supply air, so the mass flow follows the supply-state properties */
  const rhoS=rho(Ts,wS,P),cpS=cpMoist(wS);
  const dT=k==="vent"?DT_VENT:(target-Ts);
  const dimensionable=dT>=DT_MIN;
  const Vfresh=i.ppl*40,ACHfloor=c.vol*1.5;
  const Vreq=dimensionable?Math.max((c.Q*1000)/(rhoS*cpS*dT)*3600,Vfresh,ACHfloor)
                          :Math.max(Vfresh,ACHfloor);
  const nSup=Math.max(1,Math.ceil(Vreq/SUPPLY.v));
  const Vdes=nSup*SUPPLY.v,mDes=rhoS*Vdes/3600,rise=(c.Q*1000)/(mDes*cpS);
  const room=k==="mech"?Math.max(target,Ts+c.fStrat*rise):Ts+c.fStrat*rise;
  const rhIn=relHum(wS,room,P);
  const ex=extObj(i),ext=ex.o;
  let nExt=0,extCap=0,extKW=0,extFlow=0;
  const extNeed=Math.max(0,Vdes*(1-i.balance/100)-i.vexist);
  if(i.extMode==="mech"){nExt=extNeed>0?Math.ceil(extNeed/(ext.vFree*ext.der)):0;extCap=nExt*ext.price;extKW=nExt*ext.kW;extFlow=nExt*ext.vFree*ext.der;}
  else{extCap=NAT_PER_M3H*Vdes;extFlow=extNeed;}
  /* coil load = total enthalpy drop less the enthalpy the condensate carries away
     (ASHRAE Fundamentals 2021 ch.1 eq.35), not the sensible part alone */
  const coolKW=k==="mech"
    ?Math.max(0,mDes*((enth(c.designTdb,c.wOut)-enth(Ts,wS))-(c.wOut-wS)*CPW*Ts)/1000):0;
  const water_m3=k==="adia"?Math.max(0,mDes*(c.wSup-c.wOut)*3600)*BLEED*i.hrs*wetFraction(i)/1000:0;
  const elecFan=(nSup*SUPPLY.kW+extKW)*FAN_LOAD*i.hrs;
  let elecCool=0,addCap=0;
  if(k==="adia"){elecCool=nSup*0.164*wetFraction(i)*i.hrs;addCap=ADIAB_PER_M3H*Vdes;}
  if(k==="mech"){elecCool=coolKW*0.5*i.hrs/i.eer;addCap=MECH_PER_KW*coolKW;}
  const elec=elecFan+elecCool;
  const pvBudget=i.pvkwp*i.hrs*PV_YIELD;
  const solarCool=Math.min(elecCool,pvBudget);
  const solarSelf=solarCool+Math.min(elecFan,Math.max(0,pvBudget-solarCool));
  const paidElec=Math.max(0,elec-solarSelf);
  const maintH=k==="vent"?i.mvent:k==="adia"?i.madia:i.mmech;
  const maintCost=maintH*i.mrate;
  const meetsT=room<=target+0.5,meetsRH=rhIn<=i.maxrh+2;
  const feasible=dimensionable&&meetsT&&meetsRH;
  let reason="";
  if(!dimensionable)reason=tf("reasonDT",{d:fmt(DT_MIN,0)});
  else if(!meetsT)reason=tf("reasonT",{t:fmt(target,0)});
  else if(!meetsRH)reason=tf("reasonRH",{r:fmt(rhIn,0)});
  const pr=priceScen(c,k,{nSup,nExt,extCap,extName:ex.name,addCap});
  const runEl=paidElec*i.pel,runWat=water_m3*i.pwat,run=runEl+runWat+maintCost;
  return {k,Ts,wS,rhoS,cpS,Vreq,room,rise,mDes,rhIn,Vdes,nSup,nExt,extCap,extKW,extFlow,extName:ex.name,
          coolKW,water_m3,elec,elecFan,elecCool,paidElec,solarSelf,maintCost,addCap,
          feasible,dimensionable,reason,pr,runEl,runWat,run};
}
function priceScen(c,k,x){
  const i=c.i,rows=[],add=(l,v,s)=>rows.push({l,v,s});
  add(tf("prSupply",{name:t("fanSupply"),n:x.nSup}),x.nSup*SUPPLY.price,"inc");
  if(i.extMode==="mech"){if(x.nExt>0)add(tf("prSupply",{name:x.extName,n:x.nExt}),x.extCap,"inc");}
  else add(t("prNat"),x.extCap,"tbd");
  add(t("prDist"),x.nSup*4200,"inc");
  add(t("prOpen"),x.nSup*3000,"tbd");
  add(t("prElec"),x.nSup*1900+i.lm*38,"inc");
  add(t("prCtrl"),3200+x.nSup*450,"inc");
  if(k==="adia"){add(t("prAdiab"),x.addCap,"tbd");add(t("prWater"),x.nSup*1200,"inc");}
  if(k==="mech")add(t("prMech"),x.addCap,"tbd");
  const equip=rows.reduce((a,r)=>a+r.v,0),install=equip*0.24;
  add(t("prInstall"),install,"inc");
  add(t("prUtil"),0,"client");
  const mid=equip+install;return {rows,mid,low:mid*0.88,high:mid*1.27};
}

/* ===================== SVG =====================
   The drawings are unchanged in content; they are drawn in real pixels instead of a
   fixed 440-unit viewBox, so tick and value labels keep their physical size at every
   width (UI_FRAMEWORK_SPEC §10) and the charts follow the stage instead of a constant. */
const NS="http://www.w3.org/2000/svg";
const el=(tag,a,x)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(x!=null)e.textContent=x;return e;};
const clr=s=>{while(s.firstChild)s.removeChild(s.firstChild);};
function svgSize(svg,W,H){svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.setAttribute("preserveAspectRatio","xMidYMid meet");}
function barsH(svg,data,unit,dec,W,H){
  clr(svg);svgSize(svg,W,H);
  const narrow=W<460,R=narrow?Math.round(W*0.2):Math.max(52,Math.round(W*0.16)),
        L=narrow?2:Math.max(96,Math.min(190,Math.round(W*0.34))),
        top=narrow?16:10,n=data.length,
        gap=narrow?26:14,bh=Math.max(14,(H-top-6-gap*(n-1))/n);
  const max=Math.max(...data.map(d=>d.val))*1.12||1;
  data.forEach((d,idx)=>{const y=top+idx*(bh+gap),w=(W-L-R)*(d.val/max);
    if(narrow)svg.appendChild(el("text",{x:L,y:y-5,class:"bl"},d.label));
    else svg.appendChild(el("text",{x:L-10,y:y+bh/2+4,"text-anchor":"end",class:"bl"},d.label));
    svg.appendChild(el("rect",{x:L,y,width:Math.max(1,W-L-R),height:bh,rx:6,fill:"var(--line)",opacity:.5}));
    svg.appendChild(el("rect",{x:L,y,width:Math.max(3,w),height:bh,rx:6,fill:d.color,opacity:d.dim?0.4:1}));
    svg.appendChild(el("text",{x:L+Math.max(3,w)+8,y:y+bh/2+4,class:"vl"},fmt(d.val,dec)+unit));});
}
function stackRun(svg,items,W,H){
  clr(svg);svgSize(svg,W,H);
  const L=Math.max(46,Math.round(W*0.11)),R=14,top=14,bot=40;
  const totals=items.map(d=>d.el+d.wat+d.mnt),max=Math.max(1,...totals)*1.2;
  const plotH=H-top-bot,plotW=W-L-R,gw=plotW/items.length;
  for(let g=0;g<=4;g++){const y=top+plotH*(1-g/4);svg.appendChild(el("line",{x1:L,y1:y,x2:W-R,y2:y,stroke:"var(--line)","stroke-width":1}));
    svg.appendChild(el("text",{x:L-6,y:y+3,"text-anchor":"end",class:"ax"},eurk(max*g/4)));}
  items.forEach((d,idx)=>{const bw=gw*0.46,x=L+idx*gw+gw*0.5-bw/2;let yb=top+plotH;
    [[d.el,"var(--accent)"],[d.wat,"var(--ok)"],[d.mnt,"var(--warn)"]].forEach(seg=>{const h=plotH*(seg[0]/max);if(h>0.5){svg.appendChild(el("rect",{x,y:yb-h,width:bw,height:h,rx:3,fill:seg[1]}));yb-=h+2;}});
    svg.appendChild(el("text",{x:x+bw/2,y:yb-6,"text-anchor":"middle",class:"vl"},eur(d.el+d.wat+d.mnt)));
    svg.appendChild(el("text",{x:x+bw/2,y:H-22,"text-anchor":"middle",class:"bl"},d.name));});
}
function lineTco(svg,series,years,W,H,coarse){
  clr(svg);svgSize(svg,W,H);
  const L=Math.max(52,Math.round(W*0.09)),R=16,top=16,bot=40;
  const maxY=Math.max(...series.flatMap(s=>s.pts))*1.08||1;
  const plotH=H-top-bot,plotW=W-L-R,X=x=>L+plotW*(x/years),Y=v=>top+plotH*(1-v/maxY);
  for(let g=0;g<=4;g++){const y=top+plotH*(1-g/4);svg.appendChild(el("line",{x1:L,y1:y,x2:W-R,y2:y,stroke:"var(--line)","stroke-width":1}));
    svg.appendChild(el("text",{x:L-8,y:y+3,"text-anchor":"end",class:"ax"},eurk(maxY*g/4)));}
  let step=years>12?2:1;if(coarse)step*=2;
  for(let x=0;x<=years;x+=step)svg.appendChild(el("text",{x:X(x),y:H-22,"text-anchor":"middle",class:"ax"},x));
  svg.appendChild(el("text",{x:L+plotW/2,y:H-6,"text-anchor":"middle",class:"ax"},t("axisYear")));
  series.forEach(s=>{let d="";s.pts.forEach((v,x)=>{d+=(x===0?"M":"L")+X(x).toFixed(1)+" "+Y(v).toFixed(1)+" ";});
    svg.appendChild(el("path",{d,fill:"none",stroke:s.color,"stroke-width":2.5,"stroke-linejoin":"round",opacity:s.dim?0.45:1}));
    const lv=s.pts[years];svg.appendChild(el("circle",{cx:X(years),cy:Y(lv),r:3.5,fill:s.color}));
    svg.appendChild(el("text",{x:X(years)-6,y:Y(lv)-8,"text-anchor":"end",class:"vl",fill:s.color},eurk(lv)));});
}

/* ===================== result nodes ===================== */
const mk=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n;};
const CH=(host,kids)=>{kids.forEach(k=>{if(k)host.appendChild(k)});return host;};

function nodeWarns(i,c,S,rec){
  const box=mk("div","kc-warns");
  const aw=(cls,ic,txt)=>{const d=mk("div","kc-warn "+cls);d.appendChild(mk("span","kc-wi",ic));d.appendChild(mk("div",null,txt));box.appendChild(d);};
  aw("ok","✓",tf("wRec",{s:t(KMETA[rec].s),t:fmt(i.Ttar,1),r:fmt(i.maxrh,0)}));
  KINDS.forEach(k=>{if(!S[k].feasible)aw("warn","▲",tf("wExcl",{s:t(KMETA[k].s),r:S[k].reason}));});
  if(S.adia.feasible)aw("ok","ℹ",tf("wWater",{w:fmt(S.adia.water_m3),c:eur(S.adia.water_m3*i.pwat)}));
  if(i.exdays>0)aw("ok","ℹ",tf("wExd",{a:fmt(i.Tdb,0),b:fmt(c.designTdb,1),d:i.exdays}));
  if(i.pvkwp>0){const R=S[rec],cov=R.elec>0?Math.round(R.solarSelf/R.elec*100):0;aw("ok","☀",tf("wPv",{k:fmt(i.pvkwp),c:cov}));}
  return box;
}

function nodeCards(i,S,rec,selKind){
  const box=mk("section","kc-block");
  box.appendChild(mk("h3","kc-h",t("scenTitle")));
  box.appendChild(mk("p","kc-note",t("heroLead")+" — "+t("scenSub")));
  const grid=mk("div","kc-cards");
  KINDS.forEach(k=>{
    const s=S[k],b=mk("button","kc-sc"+(s.feasible?"":" no"));
    b.type="button";b.setAttribute("aria-pressed",String(k===selKind));
    if(k===rec){const g=mk("span","kc-bdg",t("badgeRec"));g.style.color=KCOL[k];b.appendChild(g);}
    else if(!s.feasible){const g=mk("span","kc-bdg",s.reason);g.style.color="var(--bad)";b.appendChild(g);}
    const tag=mk("span","kc-tag");tag.style.color=KCOL[k];
    const dot=mk("i","kc-dot");dot.style.background=KCOL[k];
    tag.appendChild(dot);tag.appendChild(mk("span",null,t(KMETA[k].s)));
    b.appendChild(tag);
    b.appendChild(mk("div","kc-big",fmt(s.room,1)+" °C · "+fmt(s.rhIn,0)+"% RV"));
    b.appendChild(mk("div","kc-note",t(KMETA[k].n)+" · "+t("cSupply")+" "+fmt(s.Ts,1)+" °C"));
    const row=(l,v)=>{const r=mk("div","kc-row");r.appendChild(mk("span",null,l));r.appendChild(mk("b",null,v));b.appendChild(r);};
    row(t("rDebiet"),fmt(s.Vdes/1000,0)+"k · "+s.nSup+"+"+(i.extMode==="mech"?s.nExt:0));
    row(t("rInvest"),eur(s.pr.low)+"–"+eur(s.pr.high).replace("€",""));
    row(t("rRun"),eur(s.run));
    row(t("rWater"),s.water_m3>0?fmt(s.water_m3)+" "+t("uM3"):"—");
    b.addEventListener("click",()=>{state.sel=k;if(ui)ui.run();else fbRender();});
    grid.appendChild(b);
  });
  box.appendChild(grid);
  box.appendChild(mk("p","kc-note",tf("selHint",{n:t(KMETA[selKind].s),a:state.sel?"":t("selAuto")})));
  return box;
}

function nodePrice(S,selKind){
  const s=S[selKind],pr=s.pr,box=mk("section","kc-block");
  const h=mk("h3","kc-h",t("detailTitle")+" ");
  const nm=mk("span",null,t(KMETA[selKind].s));nm.style.color=KCOL[selKind];h.appendChild(nm);
  box.appendChild(h);
  box.appendChild(mk("p","kc-note",t("detailSub")));
  box.appendChild(CH(mk("div","kc-pricelabels"),[mk("span",null,t("pLow")),mk("span",null,t("pMid")),mk("span",null,t("pHigh"))]));
  const bar=mk("div","kc-pricebar"),band=mk("div","kc-band");
  band.style.left=(((pr.mid*0.94)-pr.low)/(pr.high-pr.low)*100).toFixed(1)+"%";
  band.style.width=((pr.mid*0.12)/(pr.high-pr.low)*100).toFixed(1)+"%";
  bar.appendChild(band);box.appendChild(bar);
  const money=mk("div","kc-pricelabels");
  [eur(pr.low),eur(pr.mid),eur(pr.high)].forEach(v=>money.appendChild(mk("span","kc-money",v)));
  box.appendChild(money);
  const wrap=mk("div","dgu-table-wrap"),tb=mk("table","dgu-table"),tbody=document.createElement("tbody");
  pr.rows.forEach(r=>{
    const tr=document.createElement("tr"),td1=mk("td",null,r.l+" "),td2=mk("td","num",r.v>0?eur(r.v):"—");
    const st=mk("span","dgu-chip "+(r.s==="inc"?"ok":r.s==="tbd"?"warn":""),r.s==="inc"?t("stInc"):r.s==="tbd"?t("stTbd"):t("stClient"));
    td1.appendChild(st);td1.style.whiteSpace="normal";
    tr.appendChild(td1);tr.appendChild(td2);tbody.appendChild(tr);});
  tb.appendChild(tbody);wrap.appendChild(tb);box.appendChild(wrap);
  return box;
}

/* dock: heat-load build-up and air balance — persistent nodes, refilled per run */
const LOADBOX=mk("div","kc-block"),BALBOX=mk("div","kc-block");
function fillLoad(comp){
  clr2(LOADBOX);
  const total=comp.reduce((a,r)=>a+r[1],0)||1;
  const head=mk("div","kc-note");
  const tot=mk("b",null,fmt(total,0)+" "+t("uKW"));tot.style.color="var(--accent)";
  head.appendChild(mk("span",null,t("loadTitle")+" "));head.appendChild(tot);
  head.appendChild(mk("span",null," "));head.appendChild(mk("span","dgu-chip",t("chipCalc")));
  LOADBOX.appendChild(head);
  const bar=mk("div","kc-loadbar"),leg=mk("div","kc-legend");
  comp.forEach((r,idx)=>{const col=LOADCOL[idx%LOADCOL.length];
    const seg=mk("div");seg.style.width=(r[1]/total*100).toFixed(1)+"%";seg.style.background=col;
    seg.title=r[0]+": "+fmt(r[1],1);bar.appendChild(seg);
    const sp=mk("span");const sw=mk("i","kc-sw");sw.style.background=col;
    const b=mk("b",null,fmt(r[1],0)+" "+t("uKW"));b.style.color="var(--ink)";
    sp.appendChild(sw);sp.appendChild(mk("span",null,r[0]+" · "));sp.appendChild(b);leg.appendChild(sp);});
  LOADBOX.appendChild(bar);LOADBOX.appendChild(leg);
}
function clr2(n){while(n.firstChild)n.removeChild(n.firstChild);}
function fillBalance(c,s){
  const i=c.i;clr2(BALBOX);
  const head=mk("div","kc-note",t("chBalTitle")+" · "+t(KMETA[SELK].s));
  BALBOX.appendChild(head);
  BALBOX.appendChild(mk("p","kc-note",i.extMode==="mech"?t("chBalSubMech"):t("chBalSubNat")));
  const supply=s.Vdes,existExtract=i.vexist,addExtract=Math.round(s.extFlow);
  const addLabel=i.extMode==="mech"?tf("balAddMech",{n:s.extName}):t("balAddNat");
  const rows=[[t("balSupply"),supply,"var(--accent)"],[t("balExist"),existExtract,"var(--muted)"],
              [addLabel,addExtract,i.extMode==="mech"?"var(--ok)":"var(--warn)"]];
  const max=Math.max(...rows.map(r=>r[1]),1);
  rows.forEach(r=>{
    const d=mk("div");
    const line=mk("div","kc-balrow");line.appendChild(mk("span",null,r[0]));line.appendChild(mk("b",null,fmt(r[1])+" "+t("uM3h")));
    const track=mk("div","kc-track"),fill=mk("div","kc-fill");
    fill.style.width=(r[1]/max*100).toFixed(0)+"%";fill.style.background=r[2];
    track.appendChild(fill);d.appendChild(line);d.appendChild(track);BALBOX.appendChild(d);});
  const net=supply-(existExtract+addExtract);
  const dir=Math.abs(net)<supply*0.05?t("balDN"):net>0?t("balDO"):t("balDU");
  const okBal=Math.abs(net)<supply*0.05;
  const n=mk("div","kc-net");
  n.style.background=okBal?"var(--ok-bg)":"var(--warn-bg)";
  n.style.borderColor=okBal?"var(--ok)":"var(--warn)";
  n.appendChild(mk("b",null,t("balNet")+" "));
  n.appendChild(mk("span",null,(net>0?"+":"")+fmt(net)+" "+t("uM3h")+" — "+dir));
  BALBOX.appendChild(n);
}

  let rec=null;KINDS.forEach(k=>{if(S[k].feasible&&(rec===null||S[k].pr.mid<S[rec].pr.mid))rec=k;});if(!rec)rec="mech";
  const selKind=(s.sel&&KINDS.indexOf(s.sel)>=0)?s.sel:rec;
  SELK=selKind;
  const R=S[rec];
  LAST={i,c,S,rec};

  let hh,hp;
  if(rec==="vent"){hh=tf("heroVentH",{r:fmt(R.room,1)});hp=tf("heroVentP",{d:i.exdays,t:fmt(c.designTdb,1)});}
  else if(rec==="adia"){const cheaper=S.mech.pr.mid>0?Math.round((1-R.pr.mid/S.mech.pr.mid)*100):0;
    hh=tf("heroAdiaH",{a:fmt(S.vent.room,1),b:fmt(R.room,1)});

  const anyOk=KINDS.some(k=>S[k].feasible);
  setCaps(i,c);

       hint:tf("kpiDesignS",{t:fmt(i.Tdb,0),d:i.exdays})+" · "+t("chipCalc")},
      {label:t("kpiRec"),value:t(KMETA[rec].s),tone:R.feasible?"ok":"warn",learn:"scen",
       hint:fmt(R.room,1)+"° · "+(R.feasible?t("kpiMeets"):t("kpiBest"))},
      {label:t("kpiFans"),value:fmt(R.Vdes),unit:t("uM3h"),learn:"flow",
       hint:tf("kpiFansS",{sup:R.nSup,ext:i.extMode==="mech"?R.nExt:0})},
      {label:t("kpiInv"),value:eur(R.pr.low)+"–"+eur(R.pr.high).replace("€",""),learn:"price",

}

  ["required_airflow","m3/h"],["design_airflow","m3/h"],["supply_units","-"],

  ["capex_low","EUR"],["capex_high","EUR"],["running_cost","EUR/yr"],["lifetime_cost","EUR"],
  ["feasible","-"]];
function dgcScVal(s,key){
  switch(key){
    case "supply_temperature":return s.Ts; case "supply_humidity_ratio":return s.wS;
    case "supply_dry_air_density":return s.rhoS; case "supply_specific_heat":return s.cpS;
    case "required_airflow":return s.Vreq; case "design_airflow":return s.Vdes;
    case "supply_units":return s.nSup; case "dry_air_mass_flow":return s.mDes;
    case "temperature_rise":return s.rise; case "occupied_zone_temperature":return s.room;
    case "occupied_zone_humidity":return s.rhIn; case "exhaust_units":return s.nExt;
    case "exhaust_airflow":return s.extFlow; case "cooling_coil_duty":return s.coolKW;
    case "water_use":return s.water_m3; case "fan_electricity":return s.elecFan;
    case "cooling_electricity":return s.elecCool; case "purchased_electricity":return s.paidElec;
    case "capex_mid":return s.pr.mid; case "capex_low":return s.pr.low;
    case "capex_high":return s.pr.high; case "running_cost":return s.run;
    case "lifetime_cost":return s.pr.mid+s.run*LAST.i.years;
    case "feasible":return s.feasible;

function dgcSerialize(){
  const o={v:1,lang:LANG,loadMode:state.loadMode,extMode:state.extMode,sel:state.sel||null};
  IDS.forEach(id=>{o[id]=state[id];});
  return o;
}
function dgcDeserialize(st){
  if(!st||typeof st!=="object")throw new Error("unrecognised state payload");
  if(st.loadMode==="build"||st.loadMode==="known")state.loadMode=st.loadMode;
  if(st.extMode==="mech"||st.extMode==="nat")state.extMode=st.extMode;
  IDS.forEach(id=>{if(st[id]!==undefined&&st[id]!==null)state[id]=String(st[id]);});
  state.sel=(st.sel&&KINDS.indexOf(st.sel)>=0)?st.sel:null;
  const l=(st.lang&&SUP.indexOf(st.lang)>=0)?st.lang:null;
  if(ui){
    if(l&&l!==LANG)ui.setLang(l);       /* rebuilds the shell in that language, then runs */
    else{ui.sync();ui.run();}
  }else{
    if(l)LANG=l;
    fbSync();
  }
}

function dgcInputs(){
  const o={};
  DGC_IDS.forEach(id=>{const v=state[id];o[DGC_IN[id]]=(id==="extract")?v:(+v);});
  o.load_method=state.loadMode;o.exhaust_mode=state.extMode;
  return o;
}
/* Seventy-two of this tool's outputs are one of twenty-four quantities carried
   for each of the three strategies, and the record spells them by prefixing the
   strategy: vent_supply_temperature, adia_supply_temperature and so on. No
   vocabulary can hold that product, so the report printed them in English.
   Build the names instead: the quantity from the report's shared vocabulary,
   the strategy from this tool's own dictionary. The recommended strategy is
   stored as its key and was printed as "adia". */
const DGC_PFX=/^(vent|adia|mech)_/;
function dgcReportProfile(rec, ctx){
  const labels={},values={recommended_strategy:{}};
  KINDS.forEach(k=>{
    values.recommended_strategy[k]=t(KMETA[k].s);
    DGC_SC.forEach(([key,un])=>{
      labels[k+"_"+key]=ctx.label(key,un)+" \u00b7 "+t(KMETA[k].s);
    });
  });
  /* The three strategies stand side by side in the comparison table, which is
     the comparison this tool exists to make. The same seventy-two values as a
     flat list before it said everything a second time, one strategy at a time. */
  const out=rec.outputs,un=rec.units;
  const results=Object.keys(out).filter(k=>!DGC_PFX.test(k)).map(k=>{
    const m=values[k],v=out[k];
    return {key:k,label:ctx.label(k,un[k]),
      value:(m&&m[String(v)]!==undefined)?m[String(v)]:v,unit:un[k]||""};
  });
  return {labels:labels,values:values,results:results};
}
function dgcRecord(){
  if(!LAST)return null;
  const c=LAST.c,S=LAST.S,i=LAST.i;
  const out={heat_load_total:c.Q,design_outdoor_dry_bulb:c.designTdb,
    design_outdoor_wet_bulb:c.Twb,design_outdoor_humidity_ratio:c.wOut,
    design_outdoor_dry_air_density:c.rhoOut,adiabatic_supply_temperature:c.Tad,
    adiabatic_supply_humidity_ratio:c.wSup,stratification_fraction:c.fStrat,
    wet_operation_fraction:wetFraction(i),recommended_strategy:LAST.rec};
  const u={heat_load_total:"kW",design_outdoor_dry_bulb:"degC",design_outdoor_wet_bulb:"degC",
    design_outdoor_humidity_ratio:"kg/kg",design_outdoor_dry_air_density:"kg/m3",
    adiabatic_supply_temperature:"degC",adiabatic_supply_humidity_ratio:"kg/kg",
    stratification_fraction:"-",wet_operation_fraction:"-",recommended_strategy:"-"};
  KINDS.forEach(k=>DGC_SC.forEach(([key,un])=>{out[k+"_"+key]=dgcScVal(S[k],key);u[k+"_"+key]=un;}));
  Object.keys(DGC_INU).forEach(k=>{u[k]=DGC_INU[k];});
  const w=[];
  KINDS.forEach(k=>{if(!S[k].feasible)w.push(t(KMETA[k].s)+": "+S[k].reason);});
  if(c.designTdb<-20||c.designTdb>50)w.push("design dry bulb outside the -20..50 degC range in which the Bolton (1980) saturation-pressure fit is quoted");
  if(i.P<70||i.P>110)w.push("barometric pressure outside 700-1100 hPa");
  if(!KINDS.some(k=>S[k].feasible))w.push("no strategy meets both the temperature and the humidity target; the mechanical option is shown as the best achievable");
  return {inputs:dgcInputs(),outputs:out,units:u,
    model:{equations:[
      "Saturation vapour pressure: e_s(t) = 0.6112 exp(17.67 t/(t + 243.5)) kPa   [Bolton 1980 eq.10]",
      "Humidity ratio: W = 0.62198 p_w/(P - p_w)   [ASHRAE Fundamentals 2021 ch.1 eq.20]",
      "Specific enthalpy: h = 1.006 t + W (2501 + 1.86 t) kJ per kg dry air   [ch.1 eq.32]",
      "Thermodynamic wet bulb t*: W = ((2501 - 2.326 t*) W_s(t*) - 1.006 (t - t*))/(2501 + 1.86 t - 4.186 t*)   [ch.1 eq.33], solved by bisection",
      "Dry-air density: rho_da = (P - p_w)/(R_da T),  R_da = 287.042 J/(kg.K)",
      "Direct evaporative cooling: t_2 = t_1 - eps (t_1 - t*), W_2 taken on the same constant-wet-bulb line (eq.33 at t_2)",
      "Cooling-coil load: q = m_da[(h_1 - h_2) - (W_1 - W_2) c_w t_2]   [ch.1 eq.35]; a coil cannot raise W, so W_2 = min(W_1, W(t_2, 95 % RH))",
      "Airflow: V = Q/(rho_da c_p,ma dT), c_p,ma = 1006 + 1860 W J per kg dry air per K",
      "Occupied zone: t_room = t_supply + f (Q/(m_da c_p,ma)), f = 0.5 + 0.5 (z_work/H)   [stratification convention, not a validated model]",
      "Design day: t_design = max(20, t_peak - 2.2 ln(1 + n_exceedance/3))   [in-house correlation]",
      "Annual electricity: E = (n_sup P_sup + n_ext P_ext) 0.5 h + E_cooling; lifetime cost = CAPEX + N x annual cost, undiscounted"],
      ranges:[
        "Bolton (1980) eq.10 is quoted to 0.1 % for -35 <= t <= +35 degC; outside that band the saturation pressure is an extrapolation.",
        "The humidity ratio uses the ideal-gas form without the water-vapour enhancement factor; against CoolProp (ASHRAE RP-1485) that is about 0.5 % low.",
        "Catalogue data (Cairox supply unit 22000 m3/h / 3.0 kW, roof ARFV 31500 m3/h / 4.0 kW, wall axial 27855 m3/h / 2.2 kW) and all prices are indicative, excluding VAT.",
        "The design-day correction, the fan and cooling load factors (0.5), the evaporative wet fraction, the PV yield (0.45 kWh/kWp per operating hour) and the price build-up are conventions of this tool, not standardised methods.",
        "Single design point: there is no weather-bin or hourly simulation, and the lifetime cost is undiscounted."],
      notes:[
        "The three strategies share the same fan catalogue and the same specific fan power (3.0 kW per 22000 m3/h); they do not share the same number of fans, because a colder supply needs less air.",
        "The adiabatic section and the cooling coil are assumed passive in the airstream: their additional pressure drop is not charged to the fans.",
        "Feasibility is judged on the occupied-zone temperature (target + 0.5 K) and relative humidity (limit + 2 %)."]},
    warnings:w};
}
/* Eleven columns of English headings on A4, one row per strategy, nine of the
   twenty-four quantities. Turned on its side it is four columns and the whole
   set, and the quantity names come from the report's own vocabulary, so the
   table is written in the language of the document it is printed in. */
function dgcSections(){
  if(!LAST)return [];
  const S=LAST.S,D=window.Diagram;
  const name=(k,u)=>(D&&D.label?D.label(k,u):k);
  const unit=u=>(D&&D.unit?D.unit(u):u);
  const val=(st,key)=>{
    const v=dgcScVal(st,key);
    if(key==="feasible")return v?"\u2713":(st.reason||"\u2717");
    return typeof v==="number"&&isFinite(v)?nfLoc(v):"\u2014";
  };
  const rows=DGC_SC.map(([key,un])=>{
    const u=un&&un!=="-"?unit(un):"";
    return [name(key,un)+(u?" ["+u+"]":"")].concat(KINDS.map(k=>val(S[k],key)));
  });
  return [{title:t("scenTitle"),cols:"2fr 1fr 1fr 1fr",
    head:[""].concat(KINDS.map(k=>t(KMETA[k].s))),rows:rows}];
}
/* One number formatter for that table, in the locale of the document. */
function nfLoc(v){
  const a=Math.abs(v);
  const d=Number.isInteger(v)?0:(a<10?2:(a<1000?1:0));
  try{return v.toLocaleString(DGC_LOC[LANG]||"nl-BE",
    {minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:a>=1e4});}
  catch(e){return String(+v.toFixed(d));}
}
const DGC_LOC={en:"en-GB",uk:"uk-UA",de:"de-DE",nl:"nl-BE",fr:"fr-BE",es:"es-ES",pl:"pl-PL"};

const DGC_PY=String.raw`
MWR = 0.62198
RA = 287.042
CPA = 1006.0
CPV = 1860.0
HFG0 = 2501000.0
CPW = 4186.0
SUPPLY_V, SUPPLY_KW, SUPPLY_PRICE = 22000.0, 3.0, 5200.0
EXT = {"roof": (31500.0, 0.62, 4.0, 6800.0), "wall": (27855.0, 0.62, 2.2, 3600.0)}
ADIAB_PER_M3H, MECH_PER_KW, MECH_SUPPLY, MECH_RH, NAT_PER_M3H = 0.45, 850.0, 16.0, 95.0, 0.16
DT_VENT, DT_MIN, FAN_LOAD, PV_YIELD, BLEED = 3.0, 2.0, 0.5, 0.45, 1.15
KINDS = ("vent", "adia", "mech")


def esat(t):
    """Saturation vapour pressure over liquid water, kPa (Bolton 1980 eq. 10)."""
    return 0.6112 * math.exp(17.67 * t / (t + 243.5))


def w_sat(t, P):
    e = esat(t)
    return MWR * e / (P - e)


def hum_ratio(t, rh, P):
    e = rh / 100.0 * esat(t)
    return MWR * e / (P - e)


def rel_hum(w, t, P):
    e = w * P / (MWR + w)
    return min(100.0, 100.0 * e / esat(t))


def enth(t, w):
    """Moist-air specific enthalpy, J per kg dry air (ASHRAE ch.1 eq. 32)."""
    return CPA * t + w * (HFG0 + CPV * t)


def cp_moist(w):
    return CPA + CPV * w


def rho_da(t, w, P):
    e = w * P / (MWR + w)
    return (P - e) * 1000.0 / (RA * (t + 273.15))


def w_on_wetbulb(t, ts, P):
    """Humidity ratio at dry bulb t on the constant-wet-bulb line through t* (eq. 33)."""
    return ((2501.0 - 2.326 * ts) * w_sat(ts, P) - 1.006 * (t - ts)) \
           / (2501.0 + 1.86 * t - 4.186 * ts)


def wet_bulb(t, w, P):
    lo, hi = -70.0, t
    for _ in range(90):
        ts = 0.5 * (lo + hi)
        if w_on_wetbulb(t, ts, P) > w:
            hi = ts
        else:
            lo = ts
    return 0.5 * (lo + hi)


def compute():
    I = INPUTS
    P = I["barometric_pressure"] / 10.0
    rh_out = min(99.0, max(5.0, I["outdoor_relative_humidity"]))
    eff = min(95.0, max(40.0, I["adiabatic_effectiveness"])) / 100.0
    maxrh = min(100.0, max(30.0, I["max_relative_humidity"]))
    eer = max(2.0, I["chiller_eer"])
    years = max(1, min(25, int(I["comparison_period"])))
    vol = I["length"] * I["width"] * I["height"]
    floor = I["length"] * I["width"]
    if I["load_method"] == "known":
        Q = I["known_heat_load"]
    else:
        Q = (I["machine_load"] + I["people"] * I["activity_level"] / 1000.0
             + I["lighting_load"] * floor / 1000.0 + I["roof_solar_load"] * floor / 1000.0
             + I["glazing_solar_load"] * I["glazing_area"] / 1000.0)
    # the wet-bulb bisection of the page brackets at -70 degC (wetBulb, line 480)
    t_out = max(-70.0, I["outdoor_dry_bulb"])
    design_t = max(20.0, t_out - 2.2 * math.log(1.0 + I["exceedance_days"] / 3.0))
    w_out = hum_ratio(design_t, rh_out, P)
    twb = wet_bulb(design_t, w_out, P)
    t_ad = design_t - eff * (design_t - twb)
    w_sup = w_on_wetbulb(t_ad, twb, P)
    f_strat = 0.5 + 0.5 * min(1.0, max(0.0, I["working_height"] / I["height"]))
    wet_frac = min(0.85, max(0.2, (design_t - 20.0) / 22.0))
    ext_v, ext_der, ext_kw, ext_price = EXT[I["exhaust_fan_type"]]
    target = I["target_temperature"]

    out = {"heat_load_total": Q, "design_outdoor_dry_bulb": design_t,
           "design_outdoor_wet_bulb": twb, "design_outdoor_humidity_ratio": w_out,
           "design_outdoor_dry_air_density": rho_da(design_t, w_out, P),
           "adiabatic_supply_temperature": t_ad, "adiabatic_supply_humidity_ratio": w_sup,
           "stratification_fraction": f_strat, "wet_operation_fraction": wet_frac}
    best, best_capex = None, None
    for k in KINDS:
        if k == "vent":
            ts, ws = design_t, w_out
        elif k == "adia":
            ts, ws = t_ad, w_sup
        else:
            ts, ws = MECH_SUPPLY, min(w_out, hum_ratio(MECH_SUPPLY, MECH_RH, P))
        rho_s, cp_s = rho_da(ts, ws, P), cp_moist(ws)
        dt = DT_VENT if k == "vent" else (target - ts)
        dimensionable = dt >= DT_MIN
        v_fresh, ach_floor = I["people"] * 40.0, vol * 1.5
        if dimensionable:
            v_req = max(Q * 1000.0 / (rho_s * cp_s * dt) * 3600.0, v_fresh, ach_floor)
        else:
            v_req = max(v_fresh, ach_floor)
        n_sup = max(1, int(math.ceil(v_req / SUPPLY_V - 1e-12)))
        v_des = n_sup * SUPPLY_V
        m_des = rho_s * v_des / 3600.0
        rise = Q * 1000.0 / (m_des * cp_s)
        room = max(target, ts + f_strat * rise) if k == "mech" else ts + f_strat * rise
        rh_in = rel_hum(ws, room, P)
        ext_need = max(0.0, v_des * (1.0 - I["pressure_balance"] / 100.0) - I["existing_extraction"])
        if I["exhaust_mode"] == "mech":
            n_ext = int(math.ceil(ext_need / (ext_v * ext_der) - 1e-12)) if ext_need > 0 else 0
            ext_cap, ext_power = n_ext * ext_price, n_ext * ext_kw
            ext_flow = n_ext * ext_v * ext_der
        else:
            n_ext, ext_cap, ext_power, ext_flow = 0, NAT_PER_M3H * v_des, 0.0, ext_need
        if k == "mech":
            cool = max(0.0, m_des * ((enth(design_t, w_out) - enth(ts, ws))
                                     - (w_out - ws) * CPW * ts) / 1000.0)
        else:
            cool = 0.0
        water = (max(0.0, m_des * (w_sup - w_out) * 3600.0) * BLEED * I["operating_hours"]
                 * wet_frac / 1000.0) if k == "adia" else 0.0
        e_fan = (n_sup * SUPPLY_KW + ext_power) * FAN_LOAD * I["operating_hours"]
        e_cool, add_cap = 0.0, 0.0
        if k == "adia":
            e_cool = n_sup * 0.164 * wet_frac * I["operating_hours"]
            add_cap = ADIAB_PER_M3H * v_des
        if k == "mech":
            e_cool = cool * 0.5 * I["operating_hours"] / eer
            add_cap = MECH_PER_KW * cool
        elec = e_fan + e_cool
        pv = I["pv_capacity"] * I["operating_hours"] * PV_YIELD
        solar_cool = min(e_cool, pv)
        solar_self = solar_cool + min(e_fan, max(0.0, pv - solar_cool))
        paid = max(0.0, elec - solar_self)
        rows = [n_sup * SUPPLY_PRICE]
        if I["exhaust_mode"] == "mech":
            if n_ext > 0:
                rows.append(ext_cap)
        else:
            rows.append(ext_cap)
        rows += [n_sup * 4200.0, n_sup * 3000.0, n_sup * 1900.0 + I["cable_length"] * 38.0,
                 3200.0 + n_sup * 450.0]
        if k == "adia":
            rows += [add_cap, n_sup * 1200.0]
        if k == "mech":
            rows += [add_cap]
        rows += [0.0]
        equip = sum(rows)
        mid = equip * 1.24
        maint_h = {"vent": I["maintenance_hours_ventilation"],
                   "adia": I["maintenance_hours_adiabatic"],
                   "mech": I["maintenance_hours_mechanical"]}[k]
        maint = maint_h * I["maintenance_rate"]
        run = paid * I["electricity_tariff"] + water * I["water_tariff"] + maint
        feasible = bool(dimensionable and room <= target + 0.5 and rh_in <= maxrh + 2.0)
        out[k + "_supply_temperature"] = ts
        out[k + "_supply_humidity_ratio"] = ws
        out[k + "_supply_dry_air_density"] = rho_s
        out[k + "_supply_specific_heat"] = cp_s
        out[k + "_required_airflow"] = v_req
        out[k + "_design_airflow"] = v_des
        out[k + "_supply_units"] = n_sup
        out[k + "_dry_air_mass_flow"] = m_des
        out[k + "_temperature_rise"] = rise
        out[k + "_occupied_zone_temperature"] = room
        out[k + "_occupied_zone_humidity"] = rh_in
        out[k + "_exhaust_units"] = n_ext
        out[k + "_exhaust_airflow"] = ext_flow
        out[k + "_cooling_coil_duty"] = cool
        out[k + "_water_use"] = water
        out[k + "_fan_electricity"] = e_fan
        out[k + "_cooling_electricity"] = e_cool
        out[k + "_purchased_electricity"] = paid
        out[k + "_capex_mid"] = mid
        out[k + "_capex_low"] = mid * 0.88
        out[k + "_capex_high"] = mid * 1.27
        out[k + "_running_cost"] = run
        out[k + "_lifetime_cost"] = mid + run * years
        out[k + "_feasible"] = feasible
        if feasible and (best is None or mid < best_capex):
            best, best_capex = k, mid
    out["recommended_strategy"] = best if best is not None else "mech"
    return out
`;

function dgcPython(){
  if(!LAST)return null;
  return {code:DGC_PY,requires:[],
    scope:"the complete design-point calculation of this page: the psychrometric states, the "
         +"airflow and fan selection, the coil load, the annual energy and water use and the "
         +"indicative price build-up for all three strategies",
    selftest:{tolerance:1e-9,
      note:"the script re-evaluates the same closed forms with the same bisection depth, so "
          +"agreement to 1e-9 relative is expected"}};
}
function dgcHandoff(){
  if(!LAST)return null;
  const c=LAST.c,R=LAST.S[LAST.rec];
  return {quantities:{
    T:{value:c.designTdb+273.15,unit:"K"},
    p:{value:LAST.i.P*1000,unit:"Pa"},
    w:{value:c.wOut,unit:"kg/kg"},
    Vdot:{value:R.Vdes/3600,unit:"m3/s"},
    Q:{value:LAST.c.Q*1000,unit:"W"}}};
}

/* One sentence per refused quantity, in the page's own language, beside the
   framework's own "ignored" line (AGENTS 2.4). */
function hoSay(msg){try{if(window.Diagram&&Diagram.notify)Diagram.notify(msg,"warn");}catch(e){}}

function dgcApply(payload){
  const q=(payload&&payload.quantities)||{};
  const accepted=[],ignored=[];
  const num=k=>q[k]&&typeof q[k].value==="number"&&isFinite(q[k].value)?q[k].value:null;
  const T2=num("T"),p=num("p"),w=num("w"),Q=num("Q");
  const R=HO_RANGE;
  /* A refused quantity appears in neither list: the framework prints "this tool does not
     use them" for anything in `ignored`, which is false of a name the manifest accepts. */
  const said=[];
  const refuse=(k,msg)=>{said.push(k);hoSay(msg);};
  /* One test serves T and p, because eq. 20 divides by P - p_w: the total pressure in
     force has to exceed the saturation pressure of the dry bulb in force. Below that the
     humidity ratio has no moist-air state, and no other number bounds either quantity.
     T carries one further limit, the wet-bulb bracket of eq. 33. */
  const Pin=(p!==null?p/1000:readInputs(state).P);
  let satFail=false;
  if(T2!==null){
    const Tc=T2-273.15,es=esat(Tc);
    if(T2<R.T.lo) refuse("T",tf("hoRangeLo",{q:"T",v:fmt(T2,2),u:R.T.unit,a:fmt(R.T.lo,2)}));
    else if(!(es<Pin)){satFail=true;
      refuse("T",tf("hoRangeSat",{v:fmt(Pin*1000,0),t:fmt(T2,2),e:fmt(es*1000,0)}));}
    else{state.todb=String(Math.round(Tc*100)/100);accepted.push("T");}}
  /* one payload describes one state: where the T it carried is not a moist-air state at the
     pressure it carried, the pressure is not a barometric reading either. The sentence for
     that state names no single quantity and is said once for the pair. */
  if(p!==null){
    if(satFail) said.push("p");
    else{
      const Tc=(T2!==null?T2-273.15:readInputs(state).Tdb),es=esat(Tc)*1000;
      if(p>es){state.p=String(Math.round(p/100*10)/10);accepted.push("p");}
      else refuse("p",tf("hoRangeSat",{v:fmt(p,0),t:fmt(Tc+273.15,2),e:fmt(es,0)}));}}
  /* w is held in no field of this page: it is carried as the relative humidity of the
     5-99 % field, so an out-of-band value is applied at the edge and all three figures said */
  if(w!==null){
    const I0=readInputs(state),Tc=I0.Tdb,Pk=I0.P,es=esat(Tc);
    const rh=100*(w*Pk/(MWR+w))/es;
    if(Pk>es&&isFinite(rh)&&rh>0){
      const used=Math.min(R.rh.hi,Math.max(R.rh.lo,rh));
      state.rh=String(Math.round(used*10)/10);accepted.push("w");
      if(rh<R.rh.lo||rh>R.rh.hi)
        hoSay(tf("hoClampRh",{v:fmt(w,5),r:fmt(rh,4),a:fmt(R.rh.lo,2),b:fmt(R.rh.hi,2),
          e:fmt(used,2)}));
    }else refuse("w",tf("hoRangeSat",{v:fmt(Pk*1000,0),t:fmt(Tc+273.15,2),e:fmt(es*1000,0)}));}
  /* Q - neither a field nor the model declares a bound, so the only test is positivity */
  if(Q!==null){
    if(Q>R.Q.lo){state.loadMode="known";
      state.qknown=String(Math.round(Q/1000*1e6)/1e6);accepted.push("Q");}
    else refuse("Q",tf("hoRangeLo",{q:"Q",v:fmt(Q,0),u:R.Q.unit,a:fmt(R.Q.lo,0)}));}
  Object.keys(q).forEach(k=>{if(accepted.indexOf(k)<0&&said.indexOf(k)<0)ignored.push(k);});
  if(ui){ui.sync();ui.run();}else fbSync();
  return {accepted,ignored};
}
function dgcInit(){
  if(!window.Diagram)return;
  window.Diagram.init({
    id:"klimaatcalculator",file:"klimaatcalculator.html",
    state:{serialize:dgcSerialize,deserialize:dgcDeserialize},
    record:dgcRecord,
    python:dgcPython,
    handoff:{provides:["T","p","w","Vdot","Q"],accepts:["T","p","w","Q"],
             build:dgcHandoff,apply:dgcApply},
    report:{profile:dgcReportProfile,sections:dgcSections}
  });
}

/* Everything this tool adds to the shell by hand, in one place, because a rebuild

  STAGES.flow=app.stage({caption:()=>t("chFlowTitle"),minHeight:220,
    render:(size)=>paint("flow",size.w,size.h,size.density==="coarse"),
    a11y:()=>LAST?t("chFlowTitle")+": "+nlist(KINDS.map(k=>t(KMETA[k].s)+" "+fmt(LAST.S[k].Vdes)+" "+t("uM3h"))):""});
  STAGES.run=app.stage({caption:()=>t("chRunTitle"),minHeight:240,
    render:(size)=>paint("run",size.w,size.h,size.density==="coarse"),
    a11y:()=>LAST?t("chRunTitle")+": "+nlist(KINDS.map(k=>t(KMETA[k].s)+" "+eur(LAST.S[k].run))):""});
  STAGES.tco=app.stage({caption:()=>t("chTcoTitle"),minHeight:280,
    render:(size)=>paint("tco",size.w,size.h,size.density==="coarse"),
    a11y:()=>LAST?t("chTcoTitle")+": "+nlist(KINDS.map(k=>t(KMETA[k].s)+" "+eur(LAST.S[k].pr.mid+LAST.S[k].run*LAST.i.years))):""});

  app.panel({slot:"dock",id:"kc-load",title:t("loadTitle"),learn:"load",render:box=>{box.appendChild(LOADBOX);}});
  app.panel({slot:"dock",id:"kc-balance",title:t("chBalTitle"),learn:"bal",render:box=>{box.appendChild(BALBOX);}});

  ["temp","flow","run","tco"].forEach(k=>{
    STAGES[k].body.appendChild(SVGS[k]);
    CAPN[k]=STAGES[k].node.querySelector(".dgu-stage-cap");});
}

function patchLanguage(app){
  const proto=Object.getPrototypeOf(app);
  if(!proto.__kcSeven){
    proto.__kcSeven=true;
    const rebuild=proto.rebuild;
    proto.rebuild=function(){
      this.opts=OPTS;                 /* the live options, not last language's snapshot */
      const r=rebuild.apply(this,arguments);
      ui=this;                        /* the tool holds the instance the shell now uses */
      LANG=this.lang;
      mountTool(this);
      patchLangSelect(this);
      this.run();                     /* the stages exist again; fill them */
      return r;};
    proto.setLang=function(l){
      if(SUP.indexOf(l)<0)return this.lang;
      this.lang=l;
      try{localStorage.setItem("diagram_lang",l);}catch(e){}
      try{const u=new URL(location.href);u.searchParams.set("lang",l);
          history.replaceState(null,"",u);}catch(e){}
      if(window.Diagram){
        if(Diagram.setDocumentLang)Diagram.setDocumentLang(l);
        if(Diagram.setLang)Diagram.setLang(l);
      }else if(document.documentElement.lang!==l)document.documentElement.lang=l;
      try{const h=this.opts.on&&this.opts.on.lang;if(h)h(l,this);}catch(e){}
      this.rebuild();
      return l;};
  }
  patchLangSelect(app);
}

/* ===================== boot ===================== */
const OPTS={
  id:"klimaatcalculator",mount:"#app",layout:"calculator",compute:"live",
  state:state,defaults:DEFAULTS,history:false,
  get lang(){return LANG;},
  get title(){return appTitle();},
  get strings(){return FW||(FW=frameworkStrings());},
  get subtitle(){return t("appSub")+" · "+t("badge");},
  get learn(){return LEARN();},
  get panels(){return buildPanels();},
  footer:footerContent,
  on:{
    compute:s=>computeView(s),
    reset:s=>{state=s;},
    lang:l=>{LANG=SUP.indexOf(l)>=0?l:DEFLANG;document.title=t("appTitle");},
    ready:()=>{document.title=t("appTitle");}
  }
};

function boot(){
  if(!window.DiagramUI||DiagramUI.api!=="tools.petrov.re/ui/v1"){
    /* degrade honestly: same fields, same maths, same record, no framework */
    LANG=detectLang();
    fbMount();
    dgcInit();
    window.__klimaatcalculator={ui:null,state:()=>state,computeView:computeView};
    return;
  }
  /* the same precedence the framework uses (§3), over the tool's seven rather than the
     site registry, while the tool-local Russian option survives the shared bootstrap gate */
  LANG=detectLang();
  /* the bootstrap in <head> gates on the site's six, so on ?lang=ru it left the document
     marked en; the page is about to speak Russian and should say so */
  if(document.documentElement.lang!==LANG){
    if(window.Diagram&&Diagram.setDocumentLang)Diagram.setDocumentLang(LANG);
    else document.documentElement.lang=LANG;}
  ui=DiagramUI.app(OPTS);
  patchLanguage(ui);
  mountTool(ui);
  document.title=t("appTitle");
  ui.ready();
  dgcInit();
  /* a rebuild replaces the instance, so hand out the live one rather than the first */
  window.__klimaatcalculator={get ui(){return ui;},state:()=>state,computeView:computeView};
}

/* ---------- framework-less fallback ---------- */
function detectLang(){
  try{const q=new URLSearchParams(location.search).get("lang");
      if(q&&SUP.indexOf(String(q).slice(0,2).toLowerCase())>=0)return String(q).slice(0,2).toLowerCase();}catch(e){}
  try{const s=localStorage.getItem("diagram_lang");if(s&&SUP.indexOf(s)>=0)return s;}catch(e){}
  const cands=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||""];
  for(const c of cands){const base=String(c).toLowerCase().split("-")[0];if(SUP.indexOf(base)>=0)return base;}
  return DEFLANG;
}
const FB_CSS=[

 '--fs-title:22px;--fs-section:13px;--fs-body:15px;--fs-label:13px;--fs-small:12px;--fs-micro:11px;',

 '--radius-md:14px;--radius-pill:999px}',
 'body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs-body)/1.5 var(--font)}',

 '.fb svg{max-width:100%;height:auto}',
 '.fb-head{display:flex;gap:var(--sp-3);align-items:baseline;flex-wrap:wrap}',
 '.fb-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);overflow-wrap:anywhere;',
 'padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3);min-width:0}',
 '.fb-box h2{font:650 var(--fs-section)/1.3 var(--font);text-transform:uppercase;letter-spacing:.08em;',

 '.fb-field{display:grid;gap:var(--sp-1);min-width:0}',
 '.fb-row{display:flex;gap:var(--sp-2);align-items:center;min-width:0}',
 '.fb-row input,.fb-row select{flex:1 1 auto;min-width:0;min-height:44px;padding:0 var(--sp-2);',
 'border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel);color:var(--ink)}',
 '.fb-lab{font:500 var(--fs-label)/1.3 var(--font)}',

 '.fb-seg button{min-height:44px;padding:0 var(--sp-3);border:1px solid var(--line);',

 '.fb-seg button[aria-pressed="true"]{background:var(--accent);color:#fff}',

 '@media(min-width:768px){.fb-cols{grid-template-columns:340px minmax(0,1fr)}}',
 '.fb-verdict{padding:var(--sp-3);border:1px solid var(--line);border-radius:var(--radius-sm);',
 'background:var(--panel-2)}',
 '.fb-tiles{display:grid;gap:var(--sp-3);grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}',
 '.fb-tile{border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--sp-3)}',
 '.fb-tile b{display:block;font-size:var(--fs-body)}',
 '.dgu-table{border-collapse:collapse;width:100%;font-size:var(--fs-label)}',
 '.dgu-table td{padding:6px var(--sp-2);border-bottom:1px solid var(--line)}',
 '.dgu-table td.num{text-align:right;font-variant-numeric:tabular-nums}',
 '.dgu-table-wrap{overflow-x:auto}',
 '.dgu-chip{font-size:var(--fs-micro);padding:0 var(--sp-2);border-radius:var(--radius-pill);',
 'background:var(--panel-2);color:var(--muted);margin-left:var(--sp-1)}',
 '.dgu-chip.ok{background:var(--ok-bg);color:var(--ok)}',
 '.dgu-chip.warn{background:var(--warn-bg);color:var(--warn)}'

const FB={boxes:null};
function fbMount(){
  const host=$("app")||document.body;host.innerHTML="";
  if(!$("fb-css")){const st=document.createElement("style");st.id="fb-css";st.textContent=FB_CSS;document.head.appendChild(st);}
  document.title=t("appTitle");
  document.documentElement.lang=LANG;
  const wrap=mk("div","fb");
  const head=mk("div","fb-head");
  const h1=document.createElement("h1");h1.textContent=appTitle();
  const sub=mk("span","fb-sub",t("appSub")+" · "+t("badge"));
  const home=document.createElement("a");home.href="index.html?lang="+LANG;home.textContent=(window.Diagram&&Diagram.site?Diagram.site.name():"tools.petrov.re");
  const ls=document.createElement("select");ls.setAttribute("aria-label","Language");
  SUP.forEach(l=>{const o=document.createElement("option");o.value=l;o.textContent=LANG_NAMES[l];ls.appendChild(o);});
  ls.value=LANG;
  ls.onchange=()=>{LANG=ls.value;try{localStorage.setItem("diagram_lang",LANG)}catch(e){}
    if(window.Diagram&&Diagram.setLang)Diagram.setLang(LANG);fbMount();};
  CH(head,[h1,sub,home,ls]);wrap.appendChild(head);
  const cols=mk("div","fb-cols"),left=mk("div","fb"),right=mk("div","fb");
  left.style.padding="0";right.style.padding="0";
  buildPanels().forEach(p=>{
    const box=mk("div","fb-box");box.dataset.dguPanel=p.id;
    box.appendChild(mk("h2",null,p.title));
    (p.fields||[]).forEach(f=>fbField(f,box));
    left.appendChild(box);});
  const resetBox=mk("div","fb-box");
  const rbtn=document.createElement("button");rbtn.type="button";rbtn.textContent="Reset";
  rbtn.onclick=()=>{state=Object.assign({},DEFAULTS);fbMount();};
  resetBox.appendChild(rbtn);left.appendChild(resetBox);
  const res=mk("div","fb-box");
  FB.boxes={verdict:mk("div","fb-verdict"),tiles:mk("div","fb-tiles"),nodes:mk("div","fb")};
  FB.boxes.nodes.style.padding="0";
  CH(res,[FB.boxes.verdict,FB.boxes.tiles,FB.boxes.nodes]);right.appendChild(res);
  ["temp","flow","run","tco"].forEach(k=>{const b=mk("div","fb-box");b.appendChild(SVGS[k]);
    CAPN[k]=mk("div","fb-sub");b.appendChild(CAPN[k]);right.appendChild(b);});
  const dock=mk("div","fb-box");dock.appendChild(LOADBOX);dock.appendChild(BALBOX);right.appendChild(dock);
  const foot=mk("div","fb-box");footerContent(foot);
  CH(cols,[left,right]);wrap.appendChild(cols);wrap.appendChild(foot);host.appendChild(wrap);
  fbSync();
}
function fbField(f,box){
  if(f.visible&&!f.visible({state:state}))return;
  const wrap=mk("div","fb-field");
  const lab=mk("label","fb-lab",f.label);
  const row=mk("div","fb-row");
  let ctl;
  if(f.type==="segmented"){
    ctl=mk("div","fb-seg");
    f.options.forEach(o=>{const b=document.createElement("button");b.type="button";b.textContent=o[1];
      b.setAttribute("aria-pressed",String(state[f.key]===o[0]));
      b.onclick=()=>{f.set(o[0],state);fbMount();};ctl.appendChild(b);});
  }else if(f.type==="select"){
    ctl=document.createElement("select");
    f.options.forEach(o=>{const op=document.createElement("option");op.value=o[0];op.textContent=o[1];ctl.appendChild(op);});
    ctl.value=f.get(state);
    ctl.onchange=()=>{f.set(ctl.value,state);fbSync();};
  }else{
    ctl=document.createElement("input");ctl.type="number";if(f.step)ctl.step=f.step;
    ctl.value=f.get(state);
    ctl.oninput=()=>{f.set(ctl.value===""?null:parseFloat(ctl.value),state);fbSync();};
  }
  ctl.id="fb-"+f.key;lab.setAttribute("for",ctl.id);
  row.appendChild(ctl);
  if(f.unit)row.appendChild(mk("span","fb-unit",f.unit));
  CH(wrap,[lab,row,f.hint?mk("div","fb-sub",f.hint):null]);
  box.appendChild(wrap);
}
function fbSync(){
  if(!FB.boxes){if(LAST===null&&!ui)computeView(state);return;}
  const v=computeView(state);
  FB.boxes.verdict.textContent=v.verdict.text;
  clr2(FB.boxes.tiles);
  v.tiles.forEach(ti=>{const b=mk("div","fb-tile");
    b.appendChild(mk("div","fb-sub",ti.label));
    b.appendChild(mk("b",null,ti.value+(ti.unit?" "+ti.unit:"")));
    if(ti.hint)b.appendChild(mk("div","fb-sub",ti.hint));
    FB.boxes.tiles.appendChild(b);});
  clr2(FB.boxes.nodes);
  v.nodes.forEach(n=>FB.boxes.nodes.appendChild(n));
  repaintAll();
}

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
else boot();
