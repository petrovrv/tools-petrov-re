/* Operating Envelope Change & Margin Consumer — calculation core (pure functions, no DOM).
   Every boundary row is evaluated on its own, in its own unit; nothing is aggregated into one figure. */
var OE_VERSION = '2026-10-02.oe-2';
var OE_CRITERIA = ['max', 'min', 'band', 'max_delta'];
var OE_CONF = ['confirmed', 'estimated', 'unknown'];
var OE_APP = ['direct', 'validated_new_medium', 'requires_data', 'outside_domain', 'not_applicable'];
var OE_CALC = ['none', 'operatingpoint', 'moodydiagram', 'cablesizing', 'shortcircuit', 'protectioncoordination'];
var OE_DEC = ['pending', 'approved', 'rejected', 'not_required'];
/* uncertainty fields each criterion uses */
var OE_UNC = { max: ['after_unc', 'limit_unc'], min: ['after_unc', 'limit_unc'], band: ['after_unc', 'lower_unc', 'upper_unc'], max_delta: ['before_unc', 'after_unc', 'limit_unc'] };

function oeNum(v) { return typeof v === 'number' && isFinite(v) ? v : null; }

function oeSameMedium(a, b) { return oeText(a).toLowerCase() === oeText(b).toLowerCase(); }
function oeMediumChanged(ctx) { return !!(oeText(ctx.medium_before) && oeText(ctx.medium_after) && !oeSameMedium(ctx.medium_before, ctx.medium_after)); }

/* applicability gate: null when the boundary may be evaluated, else {status, reason} */
function oeApplicability(row, ctx) {
  var app = row.applicability;
  if (app === 'not_applicable') return oeText(row.applicability_note) ? { status: 'not_applicable', reason: 'declared_not_applicable' } : { status: 'unknown', reason: 'na_reason_missing' };
  if (app === 'outside_domain') return { status: 'not_applicable', reason: 'outside_model_domain' };
  if (app === 'requires_data') return { status: 'unknown', reason: 'model_requires_data' };
  var after = oeNum(row.after), mn = oeNum(row.model_min), mx = oeNum(row.model_max);
  if (mn !== null && mx !== null && mn > mx) return { status: 'unknown', reason: 'invalid_model_range' };
  if (after !== null && mn !== null && after < mn) return { status: 'not_applicable', reason: 'below_model_range' };
  if (after !== null && mx !== null && after > mx) return { status: 'not_applicable', reason: 'above_model_range' };

/* margin of one state value v against the row's boundary; positive = criterion met */
function oeMarginsAt(c, v, u, L) {
  if (c === 'max') return { nominal: L.limit - v, worst: (L.limit - L.ul) - (v + u), best: (L.limit + L.ul) - (v - u), scale: L.limit, side: null };
  if (c === 'min') return { nominal: v - L.limit, worst: (v - u) - (L.limit + L.ul), best: (v + u) - (L.limit - L.ul), scale: L.limit, side: null };

  var wlo = (v - u) - (L.lower + L.ulo), whi = (L.upper - L.uhi) - (v + u);
  var blo = (v + u) - (L.lower - L.ulo), bhi = (L.upper + L.uhi) - (v - u);
  /* equal widths within rounding count as a tie, which goes to the lower side */
  var side = wlo <= whi + 1e-12 * Math.max(1, Math.abs(wlo), Math.abs(whi)) ? 'lower' : 'upper';
  return { nominal: Math.min(nlo, nhi), worst: Math.min(wlo, whi), best: Math.min(blo, bhi), scale: side === 'lower' ? L.lower : L.upper, side: side };
}

function oeEvaluateRow(row, ctx) {
  var c = row.criterion;

  var anyMet = res.some(function (r) { return r.criterion_status === 'met'; });

  var limiting = null;
  res.forEach(function (r) { if (r.margins && r.margins.relative_worst !== null && (limiting === null || r.margins.relative_worst < limiting.relative_worst)) limiting = { row_id: r.id, relative_worst: r.margins.relative_worst }; });
  var add = [], seen = {};

    if (res[i].status === 'confirmed' || res[i].status === 'not_applicable') return;

    if (casc && !seen['a:' + casc]) { seen['a:' + casc] = 1; add.push({ kind: 'cascade', value: casc, row_id: res[i].id }); }
  });

  if (!rows.length) warnings.push('no_boundaries');
  if (state.synthetic === true) warnings.push('synthetic_case');
  if (oeMediumChanged(ctx)) warnings.push('medium_changed');
  if (counts.unknown) warnings.push('unknown_results_present');
  if (counts.not_applicable) warnings.push('not_applicable_results_present');

           calculation_performed: res.length > 0 && res.every(function (r) { return r.calculation_status !== 'incomplete'; }),
           criterion_summary: summary, counts: counts, limiting: limiting, rows: res, additional_checks: add, warnings: warnings };
}

  return 'cyrb53:' + oeCyrb53(oeCanon({ row: x, medium_before: oeText(ctx.medium_before), medium_after: oeText(ctx.medium_after) })); }

}

ня введеного критерію. Для максимуму: межа − значення. Для мінімуму: значення − межа. Результат лишається невідомим, якщо інтервал невизначеності перетинає нуль або джерело попереднє.","de":"Positive Marge bedeutet, dass das eingegebene Kriterium erfüllt ist. Maximum: Grenzwert − Wert. Minimum: Wert − Grenzwert. Bei Überlappung mit Null oder vorläufiger Evidenz bleibt das Ergebnis unbekannt.","nl":"Positieve marge betekent dat het ingevoerde criterium is gehaald. Maximum: limiet − waarde. Minimum: waarde − limiet. Bij overlap met nul of voorlopige evidence blijft het resultaat onbekend.","fr":"Une marge positive signifie que le critère saisi est respecté. Maximum : limite − valeur. Minimum : valeur − limite. Le résultat reste inconnu si l’intervalle d’incertitude traverse zéro ou si la preuve est provisoire.","es":"Un margen positivo significa que se cumple el criterio introducido. Máximo: límite − valor. Mínimo: valor − límite. El resultado queda desconocido si la incertidumbre cruza cero o la evidencia es provisional.","pl":"Dodatni margines oznacza spełnienie wprowadzonego kryterium. Maksimum: limit − wartość. Minimum: wartość − limit. Wynik pozostaje nieznany, gdy przedział niepewności przecina zero lub podstawa jest tymczasowa."},"learn_app_title":{"en":"Applicability first","uk":"Спочатку застосовність","de":"Zuerst Anwendbarkeit","nl":"Eerst toepasbaarheid","fr":"Applicabilité d’abord","es":"Primero aplicabilidad","pl":"Najpierw stosowalność"},"learn_app_body":{"en":"A numerical margin is suppressed when the selected model is outside its valid range. Medium-sensitive checks require explicit validation for the new medium after a medium change.","uk":"Числовий запас не використовується, якщо модель поза допустимим діапазоном. Після зміни середовища залежні від нього перевірки потребують явного підтвердження застосовності.","de":"Eine numerische Marge wird unterdrückt, wenn das Modell außerhalb seines Gültigkeitsbereichs liegt. Mediumabhängige Prüfungen brauchen nach Mediumwechsel eine explizite Validierung.","nl":"Een numerieke marge wordt onderdrukt wanneer het model buiten zijn geldigheidsgebied valt. Mediumafhankelijke controles vereisen expliciete validatie na mediumwijziging.","fr":"La marge numérique est supprimée si le modèle est hors de son domaine de validité. Après changement de fluide, les contrôles sensibles au fluide exigent une validation explicite.","es":"El margen numérico se suprime si el modelo está fuera de su rango válido. Tras cambiar el medio, las comprobaciones sensibles al medio requieren validación explícita.","pl":"Margines liczbowy jest pomijany, gdy model jest poza zakresem ważności. Po zmianie medium kontrole zależne od medium wymagają jawnego potwierdzenia stosowalności."},"preset_control":{"en":"Control — unchanged state","uk":"Контроль — стан без зміни","de":"Kontrolle — unveränderter Zustand","nl":"Controle — ongewijzigde toestand","fr":"Contrôle — état inchangé","es":"Control — estado sin cambio","pl":"Kontrola — stan bez zmiany"},"preset_uprate":{"en":"Uprate — flow limits","uk":"Підвищення витрати — межі","de":"Leistungserhöhung — Durchflussgrenzen","nl":"Capaciteitsverhoging — debietgrenzen","fr":"Augmentation de débit — limites","es":"Aumento de caudal — límites","pl":"Zwiększenie przepływu — limity"},"preset_minload":{"en":"Minimum load","uk":"Мінімальне навантаження","de":"Mindestlast","nl":"Minimumlast","fr":"Charge minimale","es":"Carga mínima","pl":"Minimalne obciążenie"},"preset_medium":{"en":"Process-medium change","uk":"Зміна технологічного середовища","de":"Prozessmediumwechsel","nl":"Wijziging procesmedium","fr":"Changement de fluide procédé","es":"Cambio de medio de proceso","pl":"Zmiana medium procesowego"},"preset_learn":{"en":"Learn — cable/protection limit","uk":"Навчання — межа кабелю/захисту","de":"Lernfall — Kabel-/Schutzgrenze","nl":"Leercase — kabel-/beveiligingsgrens","fr":"Cas pédagogique — limite câble/protection","es":"Caso formativo — límite de cable/protección","pl":"Szkolenie — limit kabla/zabezpieczenia"},"no_limit_exceeded":{"en":"No entered criterion is exceeded; unresolved evidence or approvals may remain.","uk":"Жоден введений критерій не перевищено; можуть лишатися невирішені джерела або схвалення.","de":"Kein eingegebenes Kriterium ist überschritten; offene Evidenz oder Freigaben können verbleiben.","nl":"Geen ingevoerd criterium is overschreden; open bewijs of goedkeuring kan blijven bestaan.","fr":"Aucun critère saisi n’est dépassé ; des preuves ou approbations peuvent rester ouvertes.","es":"No se supera ningún criterio introducido; pueden quedar evidencias o aprobaciones pendientes.","pl":"Żadne wprowadzone kryterium nie jest przekroczone; mogą pozostać otwarte dowody lub zatwierdzenia."},"has_exceeded":{"en":"At least one confirmed boundary is exceeded.","uk":"Принаймні одну підтверджену межу перевищено.","de":"Mindestens eine bestätigte Grenze ist überschritten.","nl":"Ten minste één bevestigde grens is overschreden.","fr":"Au moins une limite confirmée est dépassée.","es":"Al menos un límite confirmado está excedido.","pl":"Co najmniej jedna potwierdzona granica jest przekroczona."},"has_unknown":{"en":"One or more checks remain unknown or require additional data.","uk":"Одна або кілька перевірок лишаються невідомими або потребують даних.","de":"Eine oder mehrere Prüfungen bleiben unbekannt oder benötigen zusätzliche Daten.","nl":"Eén of meer controles blijven onbekend of vereisen aanvullende gegevens.","fr":"Un ou plusieurs contrôles restent inconnus ou nécessitent des données supplémentaires.","es":"Una o más comprobaciones quedan desconocidas o requieren datos adicionales.","pl":"Jedna lub więcej kontroli pozostaje nieznana lub wymaga dodatkowych danych."},"figure_caption":{"en":"Entered boundaries and evidence status","uk":"Введені межі та статус доказів","de":"Eingegebene Grenzen und Evidenzstatus","nl":"Ingevoerde grenzen en bewijsstatus","fr":"Limites saisies et statut des preuves","es":"Límites in ertitude franchit la limite","es":"El intervalo de incertidumbre cruza el límite","pl":"Przedział niepewności przecina granicę"},"r_criterion_met_with_confirmed_basis":{"en":"Criterion met on a confirmed basis","uk":"Критерій виконано на підтвердженій основі","de":"Kriterium auf bestätigter Grundlage erfüllt","nl":"Criterium voldaan op bevestigde basis","fr":"Critère satisfait sur base confirmée","es":"Criterio cumplido con base confirmada","pl":"Kryterium spełnione na potwierdzonej podstawie"},"r_criterion_exceeded_with_confirmed_basis":{"en":"Boundary exceeded on a confirmed basis","uk":"Межу перевищено на підтвердженій основі","de":"Grenze auf bestätigter Grundlage überschritten","nl":"Grens overschreden op bevestigde basis","fr":"Limite dépassée sur base confirmée","es":"Límite excedido con base confirmada","pl":"Granica przekroczona na potwierdzonej podstawie"},"dec_stale":{"en":"Decision stale: row changed after it","uk":"Рішення застаріло: рядок змінено після нього","de":"Entscheidung veraltet: Zeile danach geändert","nl":"Besluit verouderd: rij daarna gewijzigd","fr":"Décision périmée : ligne modifiée ensuite","es":"Decisión caducada: fila modificada después","pl":"Decyzja nieaktualna: wiersz zmieniono później"},"dec_basis_missing":{"en":"Decision without basis / approver","uk":"Рішення без основи / затверджувача","de":"Entscheidung ohne Grundlage / Freigebenden","nl":"Besluit zonder basis / goedkeurder","fr":"Décision sans base / approbateur","es":"Decisión sin base / aprobador","pl":"Decyzja bez podstawy / zatwierdzającego"},"decisions_all":{"en":"All boundary decisions recorded","uk":"Усі рішення за межами зафіксовано","de":"Alle Grenzentscheidungen erfasst","nl":"Alle grensbesluiten vastgelegd","fr":"Toutes les décisions par limite enregistrées","es":"Todas las decisiones por límite registradas","pl":"Wszystkie decyzje dla granic zapisane"},"decisions_open":{"en":"Open boundary decisions","uk":"Відкриті рішення за межами","de":"Offene Grenzentscheidungen","nl":"Open grensbesluiten","fr":"Décisions de limite ouvertes","es":"Decisiones de límite abiertas","pl":"Otwarte decyzje dla granic"},"calc_summary":{"en":"Calculation","uk":"Розрахунок","de":"Berechnung","nl":"Berekening","fr":"Calcul","es":"Cálculo","pl":"Obliczenie"},"crit_summary":{"en":"Criterion over all rows","uk":"Критерій за всіма рядками","de":"Kriterium über alle Zeilen","nl":"Criterium over alle rijen","fr":"Critère sur toutes les lignes","es":"Criterio en todas las filas","pl":"Kryterium dla wszystkich wierszy"},"w_no_boundaries":{"en":"Add at least one boundary row.","uk":"Додайте щонайменше один рядок межі.","de":"Mindestens eine Grenzzeile hinzufügen.","nl":"Voeg minstens één grensrij toe.","fr":"Ajoutez au moins une ligne de limite.","es":"Añada al menos una fila de límite.","pl":"Dodaj co najmniej jeden wiersz granicy."},"w_synthetic_case":{"en":"Synthetic case: values serve behaviour checks or training only and are not project data.","uk":"Синтетичний випадок: значення лише для перевірки поведінки або навчання, це не дані проєкту.","de":"Synthetischer Fall: Werte dienen nur der Funktionsprüfung oder Schulung und sind keine Projektdaten.","nl":"Synthetische case: waarden dienen alleen voor gedragscontrole of training en zijn geen projectgegevens.","fr":"Cas synthétique : valeurs réservées à la vérification ou à la formation, ce ne sont pas des données de projet.","es":"Caso sintético: valores solo para comprobar el comportamiento o formar; no son datos del proyecto.","pl":"Przypadek syntetyczny: wartości służą tylko do sprawdzenia działania lub szkolenia i nie są danymi projektu."},"w_medium_changed":{"en":"The medium changes; medium-sensitive checks need validation for the new medium.","uk":"Середовище змінюється; перевірки, залежні від середовища, потребують підтвердження для нового середовища.","de":"Das Medium wechselt; mediumabhängige Prüfungen brauchen eine Validierung für das neue Medium.","nl":"Het medium wijzigt; mediumafhankelijke controles vereisen validatie voor het nieuwe medium.","fr":"Le fluide change ; les contrôles sensibles au fluide doivent être validés pour le nouveau fluide.","es":"El medio cambia; las comprobaciones sensibles al medio requieren validación para el nuevo medio.","pl":"Medium się zmienia; sprawdzenia zależne od medium wymagają weryfikacji dla nowego medium."},"w_unknown_results_present":{"en":"Some boundaries remain unknown: missing data, unconfirmed basis or an uncertainty interval crossing the boundary.","uk":"Деякі межі лишаються невідомими: бракує даних, обґрунтування не підтверджено або інтервал невизначеності перетинає межу.","de":"Einige Grenzen bleiben unbekannt: fehlende Daten, unbestätigte Grundlage oder ein Unsicherheitsintervall über der Grenze.","nl":"Sommige grenzen blijven onbekend: ontbrekende gegevens, onbevestigde basis of een onzekerheidsinterval over de grens.","fr":"Certaines limites restent inconnues : données manquantes, base non confirmée ou intervalle d’incertitude franchissant la limite.","es":"Algunos límites siguen desconocidos: faltan datos, base sin confirmar o un intervalo de incertidumbre que cruza el límite.","pl":"Niektóre granice pozostają nieznane: brak danych, niepotwierdzona podstawa lub przedział niepewności przecinający granicę."},"w_not_applicable_results_present":{"en":"Some boundaries are not evaluated: model outside its range or declared not applicable.","uk":"Деякі межі не оцінено: модель поза діапазоном або межу позначено незастосовною.","de":"Einige Grenzen sind nicht bewertet: Modell außerhalb seines Bereichs oder als nicht anwendbar erklärt.","nl":"Sommige grenzen zijn niet beoordeeld: model buiten bereik of niet van toepassing verklaard.","fr":"Certaines limites ne sont pas évaluées : modèle hors domaine ou limite déclarée non applicable.","es":"Algunos límites no se evalúan: modelo fuera de rango o declarado no aplicable.","pl":"Niektóre granice nie są oceniane: model poza zakresem lub uznano je za niedotyczące."},"w_restored_values":{"en":"The saved state held values outside the tool’s lists; they were replaced by defaults: ","uk":"Збережений стан містив значення поза списками інструмента; їх замінено типовими: ","de":"Der gespeicherte Zustand enthielt Werte außerhalb der Wertelisten; sie wurden durch Vorgaben ersetzt: ","nl":"De opgeslagen toestand bevatte waarden buiten de keuzelijsten; ze zijn vervangen door standaardwaarden: ","fr":"L’état enregistré contenait des valeurs hors des listes ; elles ont été remplacées par les valeurs par défaut : ","es":"El estado guardado contenía valores fuera de las listas; se sustituyeron por los valores por defecto: ","pl":"Zapisany stan zawierał wartości spoza list; zastąpiono je domyślnymi: "},"v_exceeded":{"en":"At least one boundary is exceeded by the new state.","uk":"Новий режим перевищує щонайменше одну межу.","de":"Der neue Zustand überschreitet mindestens eine Grenze.","nl":"De nieuwe toestand overschrijdt ten minste één grens.","fr":"Le nouvel état dépasse au moins une limite.","es":"El nuevo estado excede al menos un límite.","pl":"Nowy stan przekracza co najmniej jedną granicę."},"v_unknown":{"en":"No boundary is shown exceeded, but one or more checks remain open.","uk":"Перевищення не показано, але одна або кілька перевірок лишаються відкритими.","de":"Keine Grenze ist als überschritten ausgewiesen, aber Prüfungen bleiben offen.","nl":"Geen grens is als overschreden getoond, maar controles blijven open.","fr":"Aucune limite n’apparaît dépassée, mais des contrôles restent ouverts.","es":"Ningún límite aparece excedido, pero quedan comprobaciones abiertas.","pl":"Żadna granica nie jest przekroczona, ale sprawdzenia pozostają otwarte."},"v_met":{"en":"Every evaluated boundary keeps a non-negative conservative margin.","uk":"Кожна оцінена межа зберігає невід’ємний консервативний запас.","de":"Jede bewertete Grenze behält eine nicht negative konservative Marge.","nl":"Elke beoordeelde grens houdt een niet-negatieve conservatieve marge.","fr":"Chaque limite évaluée garde une marge conservative non négative.","es":"Cada límite evaluado mantiene un margen conservador no negativo.","pl":"Każda oceniona granica zachowuje nieujemny margines konserwatywny."},"v_basis":{"en":" Rows without a confirmed basis: ","uk":" Рядків без підтвердженого обґрунтування: ","de":" Zeilen ohne bestätigte Grundlage: ","nl":" Rijen zonder bevestigde basis: ","fr":" Lignes sans base confirmée : ","es":" Filas sin base confirmada: ","pl":" Wiersze bez potwierdzonej podstawy: "},"learn_case_title":{"en":"Try it: which boundary controls?","uk":"Спробуйте: яка межа визначальна?","de":"Ausprobieren: Welche Grenze bestimmt?","nl":"Probeer het: welke grens is bepalend?","fr":"Essayez : quelle limite gouverne ?","es":"Pruébelo: ¿qué límite manda?","pl":"Spróbuj: która granica decyduje?"},"learn_case_body":{"en":"Load “Learn — cable/protection limit”. The pump flow rises from 92 to 108 m³/h against a limit of 120. Before reading the table, decide which of the three rows limits the change.","uk":"Завантажте «Навчання — межа кабелю/захисту». Витрата насоса зростає з 92 до 108 м³/год при межі 120. Перш ніж читати таблицю, вирішіть, який із трьох рядків обмежує зміну.","de":"Laden Sie „Lernfall — Kabel-/Schutzgrenze“. Der Pumpendurchfluss steigt von 92 auf 108 m³/h bei einer Grenze von 120. Entscheiden Sie vor dem Lesen der Tabelle, welche der drei Zeilen die Änderung begrenzt.","nl":"Laad ‘Leercase — kabel-/beveiligingsgrens’. Het pompdebiet stijgt van 92 naar 108 m³/h bij een limiet van 120. Bepaal vóór het lezen van de tabel welke van de drie rijen de wijziging beperkt.","fr":"Chargez « Cas pédagogique — limite câble/protection ». Le débit de la pompe passe de 92 à 108 m³/h pour une limite de 120. Avant de lire le tableau, décidez laquelle des trois lignes limite la modification.","es":"Cargue «Caso formativo — límite de cable/protección». El caudal de la bomba sube de 92 a 108 m³/h con un límite de 120. Antes de leer la tabla, decida cuál de las tres filas limita el cambio.","pl":"Wczytaj „Szkolenie — limit kabla/zabezpieczenia”. Przepływ pompy rośnie z 92 do 108 m³/h przy limicie 120. Zanim przeczytasz tabelę, zdecyduj, który z trzech wierszy ogranicza zmianę."},"learn_explain_title":{"en":"Why the pump is not the answer","uk":"Чому відповідь — не насос","de":"Warum die Pumpe nicht die Antwort ist","nl":"Waarom de pomp niet het antwoord is","fr":"Pourquoi la pompe n’est pas la réponse","es":"Por qué la bomba no es la respuesta","pl":"Dlaczego to nie pompa"},"learn_explain_body":{"en":"The pump keeps a conservative margin of 10 m³/h. The motor feeder current rises from 142 to 168 A against a cable ampacity of 160 A: even the optimistic bound is −4 A, so the cable row is exceeded. The protection pickup keeps 3 A. Margins in different units are never averaged; the limiting row is ranked by conservative margin divided by its boundary.","uk":"Насос зберігає консервативний запас 10 м³/год. Струм живлення двигуна зростає зі 142 до 168 А при допустимому струмі кабелю 160 А: навіть оптимістична межа становить −4 А, тож рядок кабелю перевищено. Уставка захисту зберігає 3 А. Запаси в різних одиницях ніколи не усереднюються; обмежувальний рядок визначають за консервативним запасом, поділеним на його межу.","de":"Die Pumpe behält eine konservative Marge von 10 m³/h. Der Motorabgangsstrom steigt von 142 auf 168 A bei einer Kabelbelastbarkeit von 160 A: selbst die optimistische Grenze ist −4 A, die Kabelzeile ist überschritten. Der Schutzansprechwert behält 3 A. Margen verschiedener Einheiten werden nie gemittelt; die begrenzende Zeile ergibt sich aus konservativer Marge geteilt durch ihre Grenze.","nl":"De pomp houdt een conservatieve marge van 10 m³/h. De stroom van de motorvoeding stijgt van 142 naar 168 A bij een kabelbelastbaarheid van 160 A: zelfs de optimistische grens is −4 A, dus de kabelrij is overschreden. De beveiligingsinstelling houdt 3 A. Marges in verschillende eenheden worden nooit gemiddeld; de beperkende rij volgt uit conservatieve marge gedeeld door de grens.","fr":"La pompe garde une marge conservative de 10 m³/h. Le courant du départ moteur passe de 142 à 168 A pour une capacité de câble de 160 A : même la borne optimiste vaut −4 A, la ligne câble est dépassée. Le seuil de protection garde 3 A. Des marges d’unités différentes ne sont jamais moyennées ; la ligne déterminante est classée par marge conservative divisée par sa limite.","es":"La bomba mantiene un margen conservador de 10 m³/h. La corriente del alimentador del motor sube de 142 a 168 A con una capacidad del cable de 160 A: incluso el límite optimista es −4 A, así que la fila del cable está excedida. El ajuste de protección conserva 3 A. Los márgenes en unidades distintas nunca se promedian; la fila determinante se clasifica por margen conservador dividido por su límite.","pl":"Pompa zachowuje margines konserwatywny 10 m³/h. Prąd zasilania silnika rośnie ze 142 do 168 A przy obciążalności kabla 160 A: nawet granica optymistyczna wynosi −4 A, więc wiersz kabla jest przekroczony. Nastawa zabezpieczenia zachowuje 3 A. Marginesów w różnych jednostkach nigdy się nie uśrednia; wiersz ograniczający wyznacza margines konserwatywny podzielony przez jego granicę."},"learn_fix_title":{"en":"What changes the answer","uk":"Що змінює відповідь","de":"Was die Antwort ändert","nl":"Wat het antwoord verandert","fr":"Ce qui change la réponse","es":"Qué cambia la respuesta","pl":"Co zmienia odpowiedź"},"learn_fix_body":{"en":"A larger feeder, a recalculated ampacity with confirmed derating, or a lower new flow. Set the cable limit to 185 A (a resized cable) and the row turns met; the follow-up list keeps cable sizing until the basis is confirmed. The tool does not size the cable: the Cable sizing calculator does.","uk":"Більший кабель живлення, перерахований допустимий струм із підтвердженими коефіцієнтами або менша нова витрата. Задайте межу кабелю 185 А (кабель більшого перерізу), і рядок стане виконаним; підбір кабелю лишається в списку подальших кроків, доки основу не підтверджено. Інструмент не підбирає кабель: це робить калькулятор «Підбір кабелю».","de":"Ein größerer Abgang, eine neu berechnete Belastbarkeit mit bestätigter Reduktion oder ein geringerer neuer Durchfluss. Setzen Sie die Kabelgrenze auf 185 A (größeres Kabel), und die Zeile ist erfüllt; die Kabeldimensionierung bleibt in der Folgeliste, bis die Grundlage bestätigt ist. Das Werkzeug dimensioniert kein Kabel: das macht der Rechner Kabeldimensionierung.","nl":"Een zwaardere voeding, een herberekende belastbaarheid met bevestigde reductie of een lager nieuw debiet. Zet de kabellimiet op 185 A (zwaardere kabel) en de rij wordt voldaan; kabeldimensionering blijft in de vervolglijst tot de basis bevestigd is. De tool dimensioneert geen kabel: dat doet de calculator Kabeldimensionering.","fr":"Un départ plus gros, une capacité recalculée avec déclassement confirmé, ou un débit plus faible. Mettez la limite câble à 185 A (câble redimensionné) et la ligne devient satisfaite ; le dimensionnement du câble reste dans la liste de suite tant que la base n’est pas confirmée. L’outil ne dimensionne pas le câble : c’est le rôle du calculateur Dimensionnement câble.","es":"Un alimentador mayor, una capacidad recalculada con reducción confirmada o un caudal nuevo menor. Ponga el límite del cable en 185 A (cable redimensionado) y la fila pasa a cumplida; el dimensionamiento del cable sigue en la lista de seguimiento hasta confirmar la base. La herramienta no dimensiona el cable: lo hace la calculadora Dimensionamiento de cable.","pl":"Większy przekrój zasilania, przeliczona obciążalność z potwierdzonymi współczynnikami lub mniejszy nowy przepływ. Ustaw limit kabla na 185 A (większy kabel), a wiersz będzie spełniony; dobór kabla pozostaje na liście dalszych kroków do potwierdzenia podstawy. Narzędzie nie dobiera kabla: robi to kalkulator Dobór kabla."},"learn_states_title":{"en":"Calculation, criterion, decision","uk":"Розрахунок, критерій, рішення","de":"Berechnung, Kriterium, Entscheidung","nl":"Berekening, criterium, besluit","fr":"Calcul, critère, décision","es":"Cálculo, criterio, decisión","pl":"Obliczenie, kryterium, decyzja"},"learn_states_body":{"en":"Each row has three separate states: whether a margin could be computed, whether the criterion is met with its uncertainty, and the engineering decision. A decision holds only for the row inputs it was given with: change the row afterwards and it shows as stale until it is selected again.","uk":"Кожен рядок має три окремі стани: чи вдалося обчислити запас, чи виконано критерій з урахуванням невизначеності, та інженерне рішення. Рішення чинне лише для тих входів рядка, з якими його ухвалено: після зміни рядка воно позначається як застаріле, доки його не оберуть знову.","de":"Jede Zeile hat drei getrennte Zustände: ob eine Marge berechnet werden konnte, ob das Kriterium mit seiner Unsicherheit erfüllt ist, und die Engineering-Entscheidung. Eine Entscheidung gilt nur für die Zeileneingaben, mit denen sie getroffen wurde: Wird die Zeile danach geändert, erscheint sie als veraltet, bis sie erneut gewählt wird.","nl":"Elke rij heeft drie afzonderlijke toestanden: of een marge berekend kon worden, of het criterium met zijn onzekerheid voldaan is, en het engineeringbesluit. Een besluit geldt alleen voor de rij-invoer waarmee het genomen is: wijzig de rij daarna en het verschijnt als verouderd tot het opnieuw wordt gekozen.","fr":"Chaque ligne a trois états distincts : la marge a-t-elle pu être calculée, le critère est-il satisfait avec son incertitude, et la décision d’ingénierie. Une décision ne vaut que pour les entrées de ligne avec lesquelles elle a été prise : modifiez la ligne ensuite et elle apparaît périmée jusqu’à ce qu’elle soit de nouveau choisie.","es":"Cada fila tiene tres estados separados: si se pudo calcular un margen, si el criterio se cumple con su incertidumbre y la decisión de ingeniería. Una decisión vale solo para las entradas de la fila con las que se tomó: si después cambia la fila, aparece caducada hasta que se vuelva a seleccionar.","pl":"Każdy wiersz ma trzy odrębne stany: czy udało się obliczyć margines, czy kryterium jest spełnione z uwzględnieniem niepewności, oraz decyzję inżynierską. Decyzja obowiązuje tylko dla danych wiersza, z którymi ją podjęto: po zmianie wiersza jest oznaczona jako nieaktualna, dopóki nie zostanie wybrana ponownie."},"title":{"en":"Operating Envelope Change & Margin Consumer","uk":"Зміна робочої області та контроль запасів","de":"Betriebsbereichsänderung und Margenprüfung","nl":"Wijziging bedrijfsgebied en marges","fr":"Modification du domaine de fonctionnement et marges","es":"Cambio de envolvente operativa y márgenes","pl":"Zmiana obwiedni eksploatacyjnej i kontrola marginesów"},"limits":{"en":"Preliminary boundary screening only. Limits, validity ranges, uncertainties and evidence quality are user inputs. The tool does not derive pump, valve, cable, protection or short-circuit capability and does not establish regulatory compliance or approve a change.","uk":"Лише попередній скринінг меж. Межі, діапазони застосовності, невизначеності та якість доказів задає користувач. Інструмент не визначає характеристики насосів, клапанів, кабелів, захистів чи КЗ і не встановлює нормативну відповідність або схвалення зміни.","de":"Nur vorläufiges Grenzscreening. Grenzen, Gültigkeitsbereiche, Unsicherheiten und Evidenzqualität sind Benutzereingaben. Das Werkzeug ermittelt keine Pumpen-, Ventil-, Kabel-, Schutz- oder Kurzschlussfähigkeit und erteilt keine Freigabe.","nl":"Alleen voorlopige grensscreening. Grenzen, geldigheidsbereiken, onzekerheden en bewijskwaliteit zijn gebruikersinvoer. De tool bepaalt geen pomp-, klep-, kabel-, beveiligings- of kortsluitcapaciteit en keurt geen wijziging goed.","fr":"Dépistage préliminaire des limites uniquement. Limites, domaines de validité, incertitudes et qualité des preuves sont fournis par l’utilisateur. L’outil ne dimensionne pas pompes, vannes, câbles, protections ou courts-circuits et n’approuve pas la modification.","es":"Solo cribado preliminar de límites. Límites, rangos de validez, incertidumbres y calidad de evidencia son entradas del usuario. La herramienta no dimensiona bombas, válvulas, cables, protecciones ni cortocircuitos y no aprueba el cambio.","pl":"Wyłącznie wstępne sprawdzenie granic. Limity, zakresy ważności, niepewności i jakość dowodów wprowadza użytkownik. Narzędzie nie wyznacza zdolności pomp, zaworów, kabli, zabezpieczeń ani zwarciowej i nie zatwierdza zmiany."},"lower_unc":{"en":"Lower bound uncertainty ±","uk":"Невизначеність нижньої межі ±","de":"Unsicherheit Untergrenze ±","nl":"Onzekerheid ondergrens ±","fr":"Incertitude borne inférieure ±","es":"Incertidumbre límite inferior ±","pl":"Niepewność dolnej granicy ±"},"upper_unc":{"en":"Upper bound uncertainty ±","uk":"Невизначеність верхньої межі ±","de":"Unsicherheit Obergrenze ±","nl":"Onzekerheid bovengrens ±","fr":"Incertitude borne supérieure ±","es":"Incertidumbre límite superior ±","pl":"Niepewność górnej granicy ±"},"model_version":{"en":"Model version","uk":"Версія моделі","de":"Modellversion","nl":"Modelversie","fr":"Version du modèle","es":"Versión del modelo","pl":"Wersja modelu"},"edit_row":{"en":"Boundary to edit","uk":"Межа для редагування","de":"Zu bearbeitende Grenze","nl":"Te bewerken grens","fr":"Limite à modifier","es":"Límite a editar","pl":"Granica do edycji"},"evidence":{"en":"Evidence for this boundary","uk":"Докази для цієї межі","de":"Nachweis dieser Grenze","nl":"Bewijs voor deze grens","fr":"Preuves de cette limite","es":"Evidencia de este límite","pl":"Dowody dla tej granicy"}};

var PY_CORE = "import math\n\nOE_VERSION = '2026-10-02.oe-2'\nOE_UNC = {'max': ['after_unc', 'limit_unc'], 'min': ['after_unc', 'limit_unc'], 'band': ['after_unc', 'lower_unc', 'upper_unc'],\n          'max_delta': ['before_unc', 'after_unc', 'limit_unc']}\n\ndef oe_num(v):\n    return float(v) if isinstance(v, (int, float)) and not isinstance(v, bool) and math.isfinite(v) else None\n\ndef oe_text(v):\n    return '' if v is None else str(v).strip()\n\ndef oe_medium_changed(ctx):\n    a, b = oe_text(ctx.get('medium_before')), oe_text(ctx.get('medium_after'))\n    return bool(a and b and a.lower() != b.lower())\n\ndef oe_applicability(row, ctx):\n    app = row.get('applicability')\n    if app == 'not_applicable':\n        return {'status': 'not_applicable', 'reason': 'declared_not_applicable'} if oe_text(row.get('applicability_note')) else {'status': 'unknown', 'reason': 'na_reason_missing'}\n    if app == 'outside_domain': return {'status': 'not_applicable', 'reason': 'outside_model_domain'}\n    if app == 'requires_data': return {'status': 'unknown', 'reason': 'model_requires_data'}\n    after, mn, mx = oe_num(row.get('after')), oe_num(row.get('model_min')), oe_num(row.get('model_max'))\n    if mn is not None and mx is not None and mn > mx: return {'status': 'unknown', 'reason': 'invalid_model_range'}\n    if after is not None and mn is not None and after < mn: return {'status': 'not_applicable', 'reason': 'below_model_range'}\n    if after is not None and mx is not None and after > mx: return {'status': 'not_applicable', 'reason': 'above_model_range'}\n    if oe_medium_changed(ctx) and row.get('medium_sensitive') is True and app != 'validated_new_medium':\n        return {'status': 'unknown', 'reason': 'new_medium_not_validated'}\n    return None\n\ndef oe_margins_at(c, v, u, L):\n    if c == 'max':\n        return {'nominal': L['limit'] - v, 'worst': (L['limit'] - L['ul']) - (v + u), 'best': (L['limit'] + L['ul']) - (v - u), 'scale': L['limit'], 'side': None}\n    if c == 'min':\n        return {'nominal': v - L['limit'], 'worst': (v - u) - (L['limit'] + L['ul']), 'best': (v + u) - (L['limit'] - L['ul']), 'scale': L['limit'], 'side': None}\n    nlo = v - L['lower']; nhi = L['upper'] - v\n    wlo = (v - u) - (L['lower'] + L['ulo']); whi = (L['upper'] - L['uhi']) - (v + u)\n    blo = (v + u) - (L['lower'] - L['ulo']); bhi = (L['upper'] + L['uhi']) - (v - u)\n    side = 'lower' if wlo <= whi + 1e-12 * max(1, abs(wlo), abs(whi)) else 'upper'\n    return {'nominal': min(nlo, nhi), 'worst': min(wlo, whi), 'best': min(blo, bhi), 'scale': L['lower'] if side == 'lower' else L['upper'], 'side': side}\n\ndef oe_evaluate_row(row, ctx):\n    c = row.get('criterion')\n    out = {'id': oe_text(row.get('id')), 'item': oe_text(row.get('item')), 'quantity': oe_text(row.get('quantity')), 'unit': oe_text(row.get('unit')), 'criterion': c,\n           'calculation_status': 'incomplete', 'criterion_status': 'unknown', 'status': 'unknown', 'reason': '', 'gaps': [], 'margins': None}\n    gate = oe_applicability(row, ctx)\n    if gate:\n        out['status'] = gate['status']; out['reason'] = gate['reason']\n        if gate['status'] == 'not_applicable':\n            out['calculation_status'] = 'not_applicable'; out['criterion_status'] = 'not_applicable'\n        return out\n    before, after, limit, lower, upper = (oe_num(row.get(k)) for k in ('before', 'after', 'limit', 'lower', 'upper'))\n    U = {}; gaps = []; neg = False\n    for k in OE_UNC[c]:\n        x = oe_num(row.get(k))\n        if x is None:\n            gaps.append('unc:' + k); x = 0.0\n        elif x < 0:\n            neg = True\n        U[k] = x\n    if neg: out['reason'] = 'negative_uncertainty'; return out\n    if after is None: out['reason'] = 'missing_after'; return out\n    if c in ('max', 'min') and limit is None: out['reason'] = 'missing_limit'; return out\n    if c == 'band' and (lower is None or upper is None or lower > upper): out['reason'] = 'missing_or_invalid_band'; return out\n    if c == 'max_delta' and (limit is None or before is None): out['reason'] = 'missing_limit_or_before'; return out\n    if c == 'max_delta':\n        d = abs(after - before); u = U['before_unc'] + U['after_unc']\n        m = {'nominal': limit - d, 'worst': (limit - U['limit_unc']) - (d + u), 'best': (limit + U['limit_unc']) - max(0, d - u), 'scale': limit, 'side': None,\n             'observed': d, 'boundary': limit, 'nominal_before': None}\n    else:\n        L = {'limit': limit, 'ul': U.get('limit_unc') or 0, 'lower': lower, 'upper': upper, 'ulo': U.get('lower_unc') or 0, 'uhi': U.get('upper_unc') or 0}\n        m = oe_margins_at(c, after, U['after_unc'], L)\n        m['observed'] = after; m['boundary'] = [lower, upper] if c == 'band' else limit\n        m['nominal_before'] = None if before is None else oe_margins_at(c, before, 0, L)['nominal']\n    out['calculation_status'] = 'performed'\n    out['margins'] = {'nominal': m['nominal'], 'worst': m['worst'], 'best': m['best'], 'observed': m['observed'], 'boundary': m['boundary'], 'side': m['side'],\n                      'nominal_before': m['nominal_before'], 'consumed': None if m['nominal_before'] is None else m['nominal_before'] - m['nominal'],\n                      'relative_worst': None if m['scale'] == 0 else m['worst'] / abs(m['scale']),\n                      'relative_nominal': None if m['scale'] == 0 else m['nominal'] / abs(m['scale'])}\n    out['criterion_status'] = 'met' if m['worst'] >= 0 else ('exceeded' if m['best'] < 0 else 'unknown')\n    if not out['unit']: gaps.append('unit')\n    for k in ('value_source', 'value_date', 'limit_source', 'limit_revision', 'limit_date'):\n        if not oe_text(row.get(k)): gaps.append(k)\n    if row.get('value_confidence') != 'confirmed': gaps.append('value_confidence')\n    if row.get('limit_confidence') != 'confirmed': gaps.append('limit_confidence')\n    out['gaps'] = gaps\n    if gaps: out['status'] = 'unknown'; out['reason'] = 'basis_not_confirmed'\n    elif out['criterion_status'] == 'met': out['status'] = 'confirmed'; out['reason'] = 'criterion_met_with_confirmed_basis'\n    elif out['criterion_status'] == 'exceeded': out['status'] = 'rejected'; out['reason'] = 'criterion_exceeded_with_confirmed_basis'\n    else: out['status'] = 'unknown'; out['reason'] = 'uncertainty_overlaps_boundary'\n    return out\n\ndef oe_row_id(row, i):\n    t = oe_text(row.get('id'))\n    return t or ('B%02d' % (i + 1) if i + 1 < 100 else 'B%d' % (i + 1))\n\ndef oe_solve(state):\n    ctx = {'medium_before': state.get('medium_before'), 'medium_after': state.get('medium_after')}\n    rows = state.get('rows') if isinstance(state.get('rows'), list) else []\n    res = []\n    for i, r in enumerate(rows):\n        x = oe_evaluate_row(r, ctx); x['id'] = oe_row_id(r, i); res.append(x)\n    counts = {'confirmed': 0, 'rejected': 0, 'unknown': 0, 'not_applicable': 0}\n    for r in res: counts[r['status']] += 1\n    any_ex = any(r['criterion_status'] == 'exceeded' for r in res)\n    any_open = any(r['criterion_status'] == 'unknown' or (r['criterion_status'] == 'not_applicable' and r['reason'] != 'declared_not_applicable') for r in res)\n    any_met = any(r['criterion_status'] == 'met' for r in res)\n    summary = 'exceeded' if any_ex else ('unknown' if any_open else ('met' if any_met else 'unknown'))\n    limiting = None\n    for r in res:\n        if r['margins'] and r['margins']['relative_worst'] is not None and (limiting is None or r['margins']['relative_worst'] < limiting['relative_worst']):\n            limiting = {'row_id': r['id'], 'relative_worst': r['margins']['relative_worst']}\n    add = []; seen = set()\n    for i, r in enumerate(rows):\n        if res[i]['status'] in ('confirmed', 'not_applicable'): continue\n        calc, casc = oe_text(r.get('calculator')), oe_text(r.get('cascade'))\n        if calc and calc != 'none' and ('c:' + calc) not in seen:\n            seen.add('c:' + calc); add.append({'kind': 'calculator', 'value': calc, 'row_id': res[i]['id']})\n        if casc and ('a:' + casc) not in seen:\n            seen.add('a:' + casc); add.append({'kind': 'cascade', 'value': casc, 'row_id': res[i]['id']})\n    warnings = []\n    if not rows: warnings.append('no_boundaries')\n    if state.get('synthetic') is True: warnings.append('synthetic_case')\n    if oe_medium_changed(ctx): warnings.append('medium_changed')\n    if counts['unknown']: warnings.append('unknown_results_present')\n    if counts['not_applicable']: warnings.append('not_applicable_results_present')\n    return {'model_version': OE_VERSION, 'calculation_performed': len(res) > 0 and all(r['calculation_status'] != 'incomplete' for r in res),\n            'criterion_summary': summary, 'counts': counts, 'limiting': limiting, 'rows': res, 'additional_checks': add, 'warnings': warnings}\n\ndef compute():\n    st = {'medium_before': INPUTS.get('medium_before'), 'medium_after': INPUTS.get('medium_after'), 'synthetic': INPUTS.get('synthetic'), 'rows': INPUTS.get('boundaries')}\n    return {k: v for k, v in oe_solve(st).items()}\n";
