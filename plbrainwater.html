    "uk": "Введіть покрівлю, з якої вода стікає в бак, людей і споживачів дощової води та об’єм бака або завантажте приклад. Інструмент моделює кожен день 30 синтетичних років, побудованих за нормами KMI для Уккела 1991–2020, показує, яку частку споживання покриває бак і як часто він переливається, будує криву віддачі від об’єму та перевіряє фламандську GSV Hemelwater 2023 (чинна з 2 жовтня 2023): мінімальний бак за площею покрівлі й кількістю житла, площу й об’єм інфільтрації, буфер з обмеженим скидом.",

    "fr": "Saisissez la toiture raccordée à la citerne, les personnes et usages qui utilisent l’eau de pluie et le volume de la citerne, ou chargez un exemple. L’outil simule chaque jour de 30 années synthétiques construites à partir des normales KMI d’Uccle 1991–2020, montre la part de la demande couverte et la fréquence des débordements, trace le rendement en fonction du volume et vérifie le GSV Hemelwater 2023 flamand (en vigueur depuis le 2 octobre 2023) : citerne minimale selon la toiture et les logements, surface et volume d’infiltration, tamponnement avec débit de fuite limité.",

  "limitations": {
    "en": "Synthetic daily rain (Markov chain fitted to monthly normals; reproduces wet-day frequency and dry-spell persistence, not observed extreme droughts), one tank, demand constant over the year and garden watering evenly April–September, no evaporation or first-flush loss beyond the filter efficiency. Yield coefficients from DIN 1989-1; persistence, per-person uses and the water price are learning assumptions. The GSV check is a pre-check of the minimum volumes of the 2023 regional regulation, not a permit assessment: municipal and provincial rules may be stricter, exceptions (art. 12) are not modelled.",
    "uk": "Синтетичні добові опади (ланцюг Маркова за місячними нормами; відтворює частоту дощових днів і тривалість сухих періодів, але не спостережені екстремальні посухи), один бак, споживання стале протягом року, полив саду рівномірно квітень–вересень, без випаровування і втрат першого змиву понад ККД фільтра. Коефіцієнти стоку — за DIN 1989-1; персистентність, питоме споживання і ціна води — навчальні припущення. Перевірка GSV — попередня перевірка мінімальних об’ємів регіонального регламенту 2023, а не оцінка дозволу: муніципальні й провінційні правила можуть бути суворішими, винятки (ст. 12) не моделюються.",
    "de": "Synthetischer Tagesregen (Markow-Kette an Monatsnormalwerte angepasst; gibt Häufigkeit der Regentage und Andauer von Trockenperioden wieder, nicht beobachtete Extremdürren), ein Speicher, Bedarf über das Jahr konstant, Gartenbewässerung gleichmäßig April–September, keine Verdunstung und kein Erstspülverlust über den Filterwirkungsgrad hinaus. Ertragsbeiwerte nach DIN 1989-1; Persistenz, Verbräuche je Person und Wasserpreis sind Lernannahmen. Die GSV-Prüfung ist eine Vorprüfung der Mindestvolumen der regionalen Verordnung 2023, keine Genehmigungsprüfung: Gemeinden und Provinzen können strenger sein, Ausnahmen (Art. 12) sind nicht abgebildet.",
    "nl": "Synthetische dagneerslag (Markovketen afgestemd op maandnormalen; geeft de frequentie van neerslagdagen en de duur van droge periodes weer, geen waargenomen extreme droogtes), één put, verbruik constant over het jaar en tuinbesproeiing gelijkmatig april–september, geen verdamping of first-flushverlies buiten het filterrendement. Opbrengstcoëfficiënten volgens DIN 1989-1; persistentie, verbruik per persoon en waterprijs zijn leeraannames. De GSV-toets is een voorcontrole van de minimale volumes van de gewestelijke verordening 2023, geen vergunningsbeoordeling: gemeentelijke en provinciale verordeningen kunnen strenger zijn, afwijkingen (art. 12) zijn niet gemodelleerd.",
    "fr": "Pluie journalière synthétique (chaîne de Markov ajustée aux normales mensuelles ; reproduit la fréquence des jours de pluie et la persistance des périodes sèches, pas les sécheresses extrêmes observées), une citerne, demande constante sur l’année et arrosage du jardin réparti d’avril à septembre, pas d’évaporation ni de perte de premier flot au-delà du rendement du filtre. Coefficients de rendement DIN 1989-1 ; persistance, consommations par personne et prix de l’eau sont des hypothèses pédagogiques. Le contrôle GSV est une vérification préalable des volumes minimaux du règlement régional 2023, pas une instruction de permis : les règlements communaux et provinciaux peuvent être plus stricts, les dérogations (art. 12) ne sont pas modélisées.",
    "es": "Lluvia diaria sintética (cadena de Markov ajustada a las normales mensuales; reproduce la frecuencia de días de lluvia y la persistencia de rachas secas, no sequías extremas observadas), un solo depósito, demanda constante durante el año y riego repartido de abril a septiembre, sin evaporación ni pérdida de primer lavado más allá del rendimiento del filtro. Coeficientes de escorrentía de DIN 1989-1; persistencia, consumos por persona y precio del agua son supuestos didácticos. La comprobación GSV es una verificación previa de los volúmenes mínimos del reglamento regional de 2023, no una evaluación del permiso: las normas municipales y provinciales pueden ser más estrictas, las excepciones (art. 12) no se modelan.",
    "pl": "Syntetyczne opady dobowe (łańcuch Markowa dopasowany do norm miesięcznych; odtwarza częstość dni z opadem i trwałość okresów suchych, nie obserwowane ekstremalne susze), jeden zbiornik, zapotrzebowanie stałe w roku, podlewanie ogrodu równomiernie kwiecień–wrzesień, bez parowania i strat pierwszego spłukania poza sprawnością filtra. Współczynniki spływu wg DIN 1989-1; trwałość opadów, zużycie na osobę i cena wody to założenia dydaktyczne. Sprawdzenie GSV to wstępna kontrola minimalnych objętości regionalnego rozporządzenia 2023, a nie ocena pozwolenia: przepisy gmin i prowincji mogą być ostrzejsze, odstępstwa (art. 12) nie są modelowane."

        "reference": {
          "en": "64 cases solved on the page against an independent Python implementation of the published method: the six presets, five tank volumes, five roofs around the GSV steps, four roof surfaces, dry and wet rain factors, persistence 0 and 0.6, another seed over 50 years, filter efficiency, an office, a school-like roof and a building without use, and twelve GSV situations (Codex example of 7 flats, two-family house, undersized tank, green roof under 50 L/m², extensions with and without an existing tank, plot under 120 m², buffer above and below 1000 m², check off, connected dwellings, a connected extensive green roof), including 7 external anchors written by hand from the decree text (art. 7 §1 and §2: 10 000 L for 150 m²; 11 000 L with 2 and 3 connected flats; art. 8: 120 m² → 9.6 m² and 3960 L; art. 9: 89 010 L and 1.035 l/s) and from the DIN 1989-1 simplified formula. Six input cases (r3): the Codex inputs with infiltration impossible (43 L/m² buffer) and five unrecognised choices — a typo in infiltration, an unknown building use, kind of works, roof surface and rain station — which must be refused, not replaced by a default.",
          "uk": "64 випадки, розв’язані на сторінці, порівняно з незалежною реалізацією опублікованого методу на Python: шість прикладів, п’ять об’ємів бака, п’ять покрівель біля порогів GSV, чотири типи покриття, сухий і вологий коефіцієнти опадів, персистентність 0 і 0,6, інше зерно на 50 років, ККД фільтра, офіс, велика покрівля з малим споживанням і будівля без споживання, а також дванадцять ситуацій GSV (приклад Codex на 7 квартир, двоквартирний будинок, замалий бак, зелена покрівля менше 50 л/м², прибудови з наявним баком і без нього, ділянка менше 120 м², буфер понад і менше 1000 м², перевірку вимкнено). Серед них 7 зовнішніх опорних випадків, обчислених вручну з тексту постанови (ст. 7 §1 і §2, ст. 8, ст. 9) і за спрощеною формулою DIN 1989-1. Шість випадків введення (r3): вхідні дані Codex з неможливою інфільтрацією (буфер 43 л/м²) і п’ять нерозпізнаних варіантів вибору — помилка в полі інфільтрації, невідоме призначення будівлі, вид робіт, покриття покрівлі та метеостанція, — які мають бути відхилені, а не замінені типовим значенням.",
          "de": "64 auf der Seite gerechnete Fälle gegen eine unabhängige Python-Umsetzung der veröffentlichten Methode: die sechs Beispiele, fünf Speichervolumen, fünf Dachflächen um die GSV-Stufen, vier Dachoberflächen, trockener und nasser Regenfaktor, Persistenz 0 und 0,6, ein anderer Startwert über 50 Jahre, Filterwirkungsgrad, ein Büro, ein großes Dach mit kleinem Bedarf und ein Gebäude ohne Nutzung sowie zwölf GSV-Situationen (Codex-Beispiel mit 7 Wohnungen, Zweifamilienhaus, zu kleine Zisterne, Gründach unter 50 L/m², Erweiterungen mit und ohne vorhandene Zisterne, Grundstück unter 120 m², Puffer über und unter 1000 m², Prüfung aus). Darunter 7 externe Ankerfälle, von Hand aus dem Verordnungstext (Art. 7 §1 und §2, Art. 8, Art. 9) und der vereinfachten Formel der DIN 1989-1 berechnet. Sechs Eingabefälle (r3): die Codex-Eingaben mit unmöglicher Versickerung (Puffer 43 L/m²) und fünf nicht erkannte Auswahlwerte — ein Tippfehler bei der Versickerung, unbekannte Gebäudenutzung, Maßnahme, Dachoberfläche und Regenstation —, die abgelehnt und nicht durch einen Standardwert ersetzt werden müssen.",
          "nl": "64 gevallen op de pagina berekend tegen een onafhankelijke Python-implementatie van de gepubliceerde methode: de zes voorbeelden, vijf putvolumes, vijf daken rond de GSV-trappen, vier dakbedekkingen, droge en natte neerslagfactor, persistentie 0 en 0,6, een andere startwaarde over 50 jaar, filterrendement, een kantoor, een groot dak met klein verbruik en een gebouw zonder gebruik, en twaalf GSV-situaties (Codex-voorbeeld met 7 appartementen, tweegezinswoning, te kleine put, groendak onder 50 L/m², uitbreidingen met en zonder bestaande put, perceel onder 120 m², buffer boven en onder 1000 m², toets uit). Daaronder 7 externe ankergevallen, met de hand berekend uit de tekst van het besluit (art. 7 §1 en §2, art. 8, art. 9) en de vereenvoudigde formule van DIN 1989-1. Zes invoergevallen (r3): de Codex-invoer met infiltratie onmogelijk (buffer 43 L/m²) en vijf niet-herkende keuzes — een tikfout bij infiltratie, een onbekend gebouwgebruik, soort werken, dakbedekking en neerslagstation — die geweigerd moeten worden en niet door een standaardwaarde vervangen.",

  'fl.low_coverage': T7('Less than half of the demand is covered: the roof is small for this demand — size the mains top-up for the full demand.', 'Покрито менше половини споживання: покрівля мала для такого споживання — доповнення з водогону розраховуйте на повне споживання.', 'Weniger als die Hälfte des Bedarfs ist gedeckt: das Dach ist für diesen Bedarf klein — Nachspeisung auf den vollen Bedarf auslegen.', 'Minder dan de helft van het verbruik is gedekt: het dak is klein voor dit verbruik — dimensioneer de bijvulling op het volledige verbruik.', 'Moins de la moitié de la demande est couverte : la toiture est petite pour cette demande — dimensionnez l’appoint pour la demande totale.', 'Se cubre menos de la mitad de la demanda: la cubierta es pequeña para esta demanda; dimensione el aporte de red para la demanda total.', 'Pokryto mniej niż połowę zapotrzebowania: dach jest mały dla tego zapotrzebowania — uzupełnianie z wodociągu dobierz na pełne zapotrzebowanie.'),
  'fl.roof_limited': T7('The tank almost never overflows: the roof, not the tank, limits the yield — a larger tank adds nothing.', 'Бак майже ніколи не переливається: віддачу обмежує покрівля, а не бак — більший бак нічого не додасть.', 'Der Speicher läuft fast nie über: das Dach, nicht der Speicher, begrenzt den Ertrag — ein größerer Speicher bringt nichts.', 'De put loopt bijna nooit over: het dak, niet de put, beperkt de opbrengst — een grotere put levert niets op.', 'La citerne ne déborde presque jamais : c’est la toiture, pas la citerne, qui limite le rendement — une citerne plus grande n’apporte rien.', 'El depósito casi nunca rebosa: la cubierta, no el depósito, limita el rendimiento; un depósito mayor no aporta nada.', 'Zbiornik prawie nigdy się nie przelewa: uzysk ogranicza dach, a nie zbiornik — większy zbiornik nic nie da.'),
  'fl.tank_below_gsv': T7('The tank is below the GSV minimum: the permit needs at least %g L below the overflow.', 'Бак менший за мінімум GSV: дозвіл вимагає щонайменше %g л нижче переливу.', 'Der Speicher liegt unter dem GSV-Minimum: die Genehmigung verlangt mindestens %g L unter dem Überlauf.', 'De put is kleiner dan het GSV-minimum: de vergunning vraagt minstens %g L onder de overloop.', 'La citerne est sous le minimum GSV : le permis exige au moins %g L sous le trop-plein.', 'El depósito está por debajo del mínimo GSV: el permiso exige al menos %g L bajo el rebosadero.', 'Zbiornik jest mniejszy od minimum GSV: pozwolenie wymaga co najmniej %g L poniżej przelewu.'),
  'fl.defaults_used': T7('Missing values replaced by the defaults: %k.', 'Відсутні значення замінено типовими: %k.', 'Fehlende Werte durch Vorgaben ersetzt: %k.', 'Ontbrekende waarden vervangen door standaardwaarden: %k.', 'Valeurs manquantes remplacées par les valeurs par défaut : %k.', 'Valores ausentes sustituidos por los predeterminados: %k.', 'Brakujące wartości zastąpiono domyślnymi: %k.'),
  'fl.gsv_no_use_unproven': T7('No demand is modelled, but art. 7 §3 still asks for the tank unless the application demonstrates that there is no use now or in the foreseeable future — tick that input only then.', 'Споживання не змодельовано, але ст. 7 §3 однаково вимагає бак, якщо заявка не доводить, що використання немає ні зараз, ні в осяжному майбутньому — лише тоді позначайте цей параметр.', 'Es ist kein Bedarf modelliert, doch Art. 7 §3 verlangt die Zisterne trotzdem, solange der Antrag nicht nachweist, dass es weder jetzt noch absehbar eine Nutzung gibt — nur dann diese Eingabe ankreuzen.', 'Er is geen verbruik gemodelleerd, maar art. 7 §3 vraagt toch de put, tenzij de aanvraag aantoont dat er nu noch in de toekomst gebruiksmogelijkheden zijn — vink die invoer alleen dan aan.', 'Aucune demande n’est modélisée, mais l’art. 7 §3 exige quand même la citerne, sauf si la demande démontre qu’il n’y a aucun usage ni maintenant ni à l’avenir — ne cochez cette entrée qu’alors.', 'No se modela demanda, pero el art. 7 §3 sigue exigiendo el depósito salvo que la solicitud justifique que no hay usos ni ahora ni en un futuro razonable; marque esa entrada solo entonces.', 'Nie zamodelowano zapotrzebowania, ale art. 7 §3 i tak wymaga zbiornika, chyba że wniosek wykaże brak zastosowania teraz i w przyszłości — tylko wtedy zaznacz to pole.'),
  'fl.dry_month_redrawn': T7('A calendar month came out without any wet day (short series): it was drawn again from the same generator so that every month meets its normal.', 'Календарний місяць вийшов без жодного дощового дня (короткий ряд): його згенеровано повторно тим самим генератором, щоб кожен місяць відповідав нормі.', 'Ein Kalendermonat hatte keinen einzigen Regentag (kurze Reihe): er wurde mit demselben Generator neu gezogen, damit jeder Monat seinen Normalwert erreicht.', 'Een kalendermaand kwam uit zonder enige natte dag (korte reeks): ze werd opnieuw getrokken met dezelfde generator zodat elke maand haar normaal haalt.', 'Un mois civil est sorti sans aucun jour de pluie (série courte) : il a été retiré avec le même générateur pour que chaque mois atteigne sa normale.', 'Un mes natural salió sin ningún día de lluvia (serie corta): se volvió a generar con el mismo generador para que cada mes alcance su normal.', 'Miesiąc kalendarzowy wyszedł bez żadnego dnia z opadem (krótki szereg): wylosowano go ponownie tym samym generatorem, aby każdy miesiąc osiągnął swoją normę.'),
  'fl.no_demand': T7('No demand entered: nothing is reused.', 'Споживання не задано: нічого не використовується.', 'Kein Bedarf eingegeben: nichts wird genutzt.', 'Geen verbruik ingegeven: niets wordt hergebruikt.', 'Aucune demande saisie : rien n’est réutilisé.', 'No se ha introducido demanda: no se reutiliza nada.', 'Nie podano zapotrzebowania: nic nie jest wykorzystywane.'),
  'n.balance': T7('Average of %n synthetic years: %r mm rain, %i m³ into the tank, %y m³ used, %o m³ overflow on %d days, mains top-up %m m³.', 'Середнє з %n синтетичних років: %r мм опадів, %i м³ у бак, %y м³ використано, %o м³ переливу за %d днів, доповнення з водогону %m м³.', 'Mittel aus %n synthetischen Jahren: %r mm Regen, %i m³ in den Speicher, %y m³ genutzt, %o m³ Überlauf an %d Tagen, Nachspeisung %m m³.', 'Gemiddelde van %n synthetische jaren: %r mm neerslag, %i m³ naar de put, %y m³ gebruikt, %o m³ overloop op %d dagen, bijvulling %m m³.', 'Moyenne de %n années synthétiques : %r mm de pluie, %i m³ vers la citerne, %y m³ utilisés, %o m³ débordés en %d jours, appoint %m m³.', 'Media de %n años sintéticos: %r mm de lluvia, %i m³ al depósito, %y m³ usados, %o m³ rebosados en %d días, aporte de red %m m³.', 'Średnia z %n syntetycznych lat: %r mm opadu, %i m³ do zbiornika, %y m³ wykorzystane, %o m³ przelewu w %d dni, uzupełnienie %m m³.'),
  'n.din': T7('DIN 1989-1 simplified: 6 % of the smaller of yield (%a m³) and demand (%b m³) = %v m³.', 'Спрощено за DIN 1989-1: 6 % від меншого з віддачі (%a м³) і споживання (%b м³) = %v м³.', 'DIN 1989-1 vereinfacht: 6 % des kleineren Werts aus Ertrag (%a m³) und Bedarf (%b m³) = %v m³.', 'DIN 1989-1 vereenvoudigd: 6 % van het kleinste van opbrengst (%a m³) en verbruik (%b m³) = %v m³.', 'DIN 1989-1 simplifiée : 6 % du plus petit du rendement (%a m³) et de la demande (%b m³) = %v m³.', 'DIN 1989-1 simplificado: 6 % del menor entre rendimiento (%a m³) y demanda (%b m³) = %v m³.', 'DIN 1989-1 uproszczona: 6 % mniejszej z wartości uzysku (%a m³) i zapotrzebowania (%b m³) = %v m³.'),
  'n.gsv': T7('GSV Hemelwater 2023 (in force 2 October 2023; applications filed earlier follow the 2013 GSV). Municipal or provincial regulations may be stricter; the permitting authority can allow exceptions (art. 12).', 'GSV Hemelwater 2023 (чинна з 2 жовтня 2023; раніше подані заявки — за GSV 2013). Муніципальні чи провінційні правила можуть бути суворішими; орган дозволів може надати виняток (ст. 12).', 'GSV Hemelwater 2023 (gültig ab 2. Oktober 2023; früher eingereichte Anträge nach der GSV 2013). Kommunale oder provinziale Verordnungen können strenger sein; die Genehmigungsbehörde kann Ausnahmen zulassen (Art. 12).', 'GSV Hemelwater 2023 (van kracht sinds 2 oktober 2023; eerder ingediende aanvragen volgen de GSV 2013). Gemeentelijke of provinciale verordeningen kunnen strenger zijn; de vergunningverlenende overheid kan afwijkingen toestaan (art. 12).', 'GSV Hemelwater 2023 (en vigueur depuis le 2 octobre 2023 ; les demandes antérieures suivent le GSV 2013). Les règlements communaux ou provinciaux peuvent être plus stricts ; l’autorité délivrante peut accorder des dérogations (art. 12).', 'GSV Hemelwater 2023 (vigente desde el 2 de octubre de 2023; las solicitudes anteriores siguen el GSV 2013). Las normas municipales o provinciales pueden ser más estrictas; la autoridad que concede el permiso puede admitir excepciones (art. 12).', 'GSV Hemelwater 2023 (obowiązuje od 2 października 2023; wcześniejsze wnioski — wg GSV 2013). Przepisy gminne lub prowincjonalne mogą być ostrzejsze; organ wydający pozwolenie może dopuścić odstępstwa (art. 12).'),
  'n.big': T7('Counted area above 1000 m²: a facility deeper than 50 cm needs a groundwater-level measurement and at least three infiltration tests (art. 8 §4).', 'Врахована площа понад 1000 м²: для споруди глибше 50 см потрібні вимірювання рівня ґрунтових вод і щонайменше три інфільтраційні проби (ст. 8 §4).', 'Anzurechnende Fläche über 1000 m²: eine Anlage tiefer als 50 cm braucht eine Grundwassermessung und mindestens drei Versickerungsversuche (Art. 8 §4).', 'In rekening te brengen oppervlakte boven 1000 m²: een voorziening dieper dan 50 cm vraagt een grondwaterpeilmeting en minstens drie infiltratieproeven (art. 8 §4).', 'Surface prise en compte supérieure à 1000 m² : un ouvrage de plus de 50 cm de profondeur exige une mesure de la nappe et au moins trois essais d’infiltration (art. 8 §4).', 'Superficie computada superior a 1000 m²: una instalación de más de 50 cm de profundidad requiere medir el nivel freático y al menos tres ensayos de infiltración (art. 8 §4).', 'Uwzględniana powierzchnia ponad 1000 m²: urządzenie głębsze niż 50 cm wymaga pomiaru poziomu wód gruntowych i co najmniej trzech prób chłonności (art. 8 §4).'),

    body: T7('Rain that falls on a roof can flush toilets, run the washing machine and water the garden. Enter the roof, the users and the tank (or load an example) and read how much of the demand the tank covers, what it saves, how often it overflows — and what the Flemish GSV Hemelwater 2023 requires. Start with “House, 120 m² roof”: the law asks for 10 000 L, the curve shows that 5 m³ already covers nearly everything.',
      'Дощ, що падає на покрівлю, може змивати унітази, живити пральну машину й поливати сад. Введіть покрівлю, споживачів і бак (або завантажте приклад) і подивіться, яку частку споживання покриває бак, скільки він заощаджує, як часто переливається — і що вимагає фламандська GSV Hemelwater 2023. Почніть з «Будинок, покрівля 120 м²»: закон вимагає 10 000 л, а крива показує, що 5 м³ уже покривають майже все.',
      'Regen auf dem Dach kann Toiletten spülen, die Waschmaschine versorgen und den Garten bewässern. Geben Sie Dach, Nutzer und Speicher ein (oder laden Sie ein Beispiel) und lesen Sie, welchen Anteil des Bedarfs der Speicher deckt, was er einspart, wie oft er überläuft — und was die flämische GSV Hemelwater 2023 verlangt. Beginnen Sie mit „Haus, 120 m² Dach“: das Gesetz verlangt 10 000 L, die Kurve zeigt, dass 5 m³ schon fast alles decken.',

      'La lluvia que cae sobre una cubierta puede alimentar inodoros, la lavadora y el riego. Introduzca la cubierta, los usuarios y el depósito (o cargue un ejemplo) y lea qué parte de la demanda cubre, cuánto ahorra, cada cuánto rebosa — y qué exige el GSV Hemelwater 2023 flamenco. Empiece por «Vivienda, cubierta de 120 m²»: la ley pide 10 000 L y la curva muestra que 5 m³ ya cubren casi todo.',
      'Deszcz spadający na dach może spłukiwać toalety, zasilać pralkę i podlewać ogród. Wprowadź dach, użytkowników i zbiornik (albo wczytaj przykład) i odczytaj, jaką część zapotrzebowania pokrywa zbiornik, ile oszczędza, jak często się przelewa — oraz czego wymaga flamandzkie GSV Hemelwater 2023. Zacznij od „Dom, dach 120 m²”: prawo wymaga 10 000 L, a krzywa pokazuje, że 5 m³ pokrywa już prawie wszystko.')

  topics: {
    balance: { title: T7('The daily tank balance', 'Добовий баланс бака', 'Die tägliche Speicherbilanz', 'De dagelijkse putbalans', 'Le bilan journalier de la citerne', 'El balance diario del depósito', 'Dobowy bilans zbiornika'),
      body: T7('Every day the tank first delivers what is asked, as far as it holds water (Y = min(D, V)); then the day’s rain flows in, and what does not fit leaves through the overflow. This “yield after spillage” rule is the behavioural model of EN 16941-1. Summed over the year it gives the rainwater used, the mains top-up and the overflow; coverage = used / demand.',
        'Щодня бак спочатку віддає потрібне, наскільки вистачає води (Y = min(D, V)); потім надходить дощ доби, а що не вміщується, йде через перелив. Це правило «віддача після переливу» — поведінкова модель EN 16941-1. Сума за рік дає використану дощову воду, доповнення з водогону й перелив; покриття = використано / споживання.',
        'Jeden Tag gibt der Speicher zuerst ab, was verlangt wird, soweit er Wasser enthält (Y = min(D, V)); dann fließt der Tagesregen zu, und was nicht passt, geht über den Überlauf. Diese Regel „Ertrag nach Überlauf“ ist das Verhaltensmodell der EN 16941-1. Über das Jahr summiert ergibt sie genutztes Regenwasser, Nachspeisung und Überlauf; Deckungsgrad = genutzt / Bedarf.',
        'Elke dag levert de put eerst wat gevraagd wordt, voor zover er water in zit (Y = min(D, V)); daarna stroomt de neerslag van die dag in en wat niet past gaat via de overloop weg. Deze regel ‘opbrengst na overloop’ is het gedragsmodel van EN 16941-1. Opgeteld over het jaar geeft hij het gebruikte hemelwater, de bijvulling en de overloop; dekkingsgraad = gebruikt / verbruik.',
        'Chaque jour la citerne fournit d’abord ce qui est demandé, dans la limite de l’eau stockée (Y = min(D, V)) ; puis la pluie du jour entre et ce qui ne tient pas part au trop-plein. Cette règle « rendement après débordement » est le modèle comportemental de l’EN 16941-1. Sommée sur l’année, elle donne l’eau de pluie utilisée, l’appoint et le débordement ; couverture = utilisé / demande.',
        'Cada día el depósito entrega primero lo pedido, en la medida del agua que contiene (Y = min(D, V)); luego entra la lluvia del día y lo que no cabe sale por el rebosadero. Esta regla de «rendimiento tras rebose» es el modelo de comportamiento de EN 16941-1. Sumada en el año da el agua de lluvia usada, el aporte de red y el rebose; cobertura = usado / demanda.',
        'Każdego dnia zbiornik najpierw oddaje to, czego potrzeba, na ile starcza wody (Y = min(D, V)); potem dopływa deszcz z tego dnia, a to, co się nie mieści, odpływa przelewem. Reguła „uzysk po przelewie” to model behawioralny EN 16941-1. Zsumowana w roku daje wykorzystaną deszczówkę, uzupełnienie z wodociągu i przelew; pokrycie = wykorzystane / zapotrzebowanie.') },
    rain: { title: T7('Where the rain comes from', 'Звідки беруться опади', 'Woher der Regen kommt', 'Waar de neerslag vandaan komt', 'D’où vient la pluie', 'De dónde sale la lluvia', 'Skąd biorą się opady'),
      body: T7('Uccle gets 837 mm a year on 133 days with at least 1 mm (KMI normals 1991–2020). A tank lives on dry spells, so monthly totals are not enough: the tool builds 30 synthetic years day by day — a wet day follows a wet day more often than a dry one (persistence r = 0.35) and every wet day brings at least 1 mm, as KMI counts them, plus an exponential excess; each month is then scaled to its normal. The series is reproducible (fixed seed) and matches the normals on average; it does not contain the record droughts of 2011 or 2020 — try a rain factor of 0.75 for a dry year.',
        'Уккел отримує 837 мм на рік за 133 дні з опадами щонайменше 1 мм (норми KMI 1991–2020). Бак живе сухими періодами, тому місячних сум недостатньо: інструмент будує 30 синтетичних років день за днем — дощовий день частіше йде за дощовим, ніж за сухим (персистентність r = 0,35), а кожен дощовий день дає щонайменше 1 мм, як їх рахує KMI, плюс експоненційний надлишок; потім кожен місяць масштабується до норми. Ряд відтворюваний (фіксоване зерно) і в середньому відповідає нормам; рекордних посух 2011 чи 2020 у ньому немає — спробуйте коефіцієнт 0,75 для посушливого року.',
        'Uccle erhält 837 mm im Jahr an 133 Tagen mit mindestens 1 mm (KMI-Normalwerte 1991–2020). Ein Speicher lebt von Trockenperioden, Monatssummen reichen also nicht: das Werkzeug erzeugt 30 synthetische Jahre Tag für Tag — auf einen Regentag folgt öfter ein Regentag als auf einen trockenen (Persistenz r = 0,35), jeder Regentag bringt mindestens 1 mm, wie KMI zählt, plus einen exponentiell verteilten Überschuss; danach wird jeder Monat auf seinen Normalwert skaliert. Die Reihe ist reproduzierbar (fester Startwert) und trifft im Mittel die Normalwerte; die Rekorddürren 2011 oder 2020 enthält sie nicht — probieren Sie einen Regenfaktor von 0,75 für ein trockenes Jahr.',
        'Ukkel krijgt 837 mm per jaar op 133 dagen met minstens 1 mm (KMI-normalen 1991–2020). Een put leeft van droge periodes, maandtotalen volstaan dus niet: de tool bouwt 30 synthetische jaren dag per dag op — een natte dag volgt vaker op een natte dan op een droge (persistentie r = 0,35) en elke natte dag brengt minstens 1 mm, zoals het KMI ze telt, plus een exponentieel verdeeld overschot; daarna wordt elke maand op haar normaal geschaald. De reeks is reproduceerbaar (vaste startwaarde) en klopt gemiddeld met de normalen; de recorddroogtes van 2011 of 2020 zitten er niet in — probeer een neerslagfactor 0,75 voor een droog jaar.',
        'Uccle reçoit 837 mm par an sur 133 jours d’au moins 1 mm (normales KMI 1991–2020). Une citerne vit des périodes sèches, les totaux mensuels ne suffisent donc pas : l’outil construit 30 années synthétiques jour par jour — un jour de pluie suit plus souvent un jour de pluie qu’un jour sec (persistance r = 0,35) et chaque jour de pluie apporte au moins 1 mm, comme le compte le KMI, plus un excédent exponentiel ; chaque mois est ensuite ramené à sa normale. La série est reproductible (graine fixe) et respecte les normales en moyenne ; elle ne contient pas les sécheresses record de 2011 ou 2020 — essayez un facteur de pluie de 0,75 pour une année sèche.',
        'Uccle recibe 837 mm al año en 133 días con al menos 1 mm (normales del KMI 1991–2020). Un depósito vive de las rachas secas, así que los totales mensuales no bastan: la herramienta construye 30 años sintéticos día a día — un día de lluvia sigue más a menudo a otro de lluvia que a uno seco (persistencia r = 0,35) y cada día de lluvia aporta al menos 1 mm, como los cuenta el KMI, más un exceso exponencial; después cada mes se escala a su normal. La serie es reproducible (semilla fija) y coincide en media con las normales; no contiene las sequías récord de 2011 o 2020 — pruebe un factor de lluvia de 0,75 para un año seco.',
        'Uccle otrzymuje 837 mm rocznie w 133 dniach z opadem co najmniej 1 mm (normy KMI 1991–2020). Zbiornik żyje okresami suchymi, więc sumy miesięczne nie wystarczą: narzędzie buduje 30 syntetycznych lat dzień po dniu — dzień deszczowy częściej następuje po deszczowym niż po suchym (trwałość r = 0,35), a każdy dzień deszczowy daje co najmniej 1 mm, tak jak liczy je KMI, plus wykładniczą nadwyżkę; potem każdy miesiąc skaluje się do jego normy. Szereg jest powtarzalny (stałe ziarno) i średnio zgadza się z normami; nie zawiera rekordowych susz 2011 czy 2020 — spróbuj współczynnika 0,75 dla suchego roku.') },
    roof: { title: T7('Roof, yield coefficient and filter', 'Покрівля, коефіцієнт стоку і фільтр', 'Dach, Ertragsbeiwert und Filter', 'Dak, opbrengstcoëfficiënt en filter', 'Toiture, coefficient de rendement et filtre', 'Cubierta, coeficiente de escorrentía y filtro', 'Dach, współczynnik spływu i filtr'),
      body: T7('Only part of the rain reaches the tank: Q = A · e · η · P. A is the horizontal projection of the roof, e the yield coefficient of DIN 1989-1 (0.8 tiles or a bare flat roof, 0.6 gravel, 0.5 extensive and 0.3 intensive green roof, Table 3) and η the filter efficiency (0.9). A green roof keeps water for the plants and for evaporation — good for the sewer, bad for the tank.',
        'До бака доходить лише частина дощу: Q = A · e · η · P. A — горизонтальна проєкція покрівлі, e — коефіцієнт стоку за DIN 1989-1 (0,8 черепиця або плоска без гравію, 0,6 гравій, 0,5 екстенсивна і 0,3 інтенсивна зелена покрівля, табл. 3), η — ККД фільтра (0,9). Зелена покрівля затримує воду для рослин і випаровування — добре для каналізації, погано для бака.',
        'Nur ein Teil des Regens erreicht den Speicher: Q = A · e · η · P. A ist die horizontale Dachprojektion, e der Ertragsbeiwert nach DIN 1989-1 (0,8 Ziegel oder Flachdach ohne Kies, 0,6 Kies, 0,5 extensives und 0,3 intensives Gründach, Tabelle 3) und η der Filterwirkungsgrad (0,9). Ein Gründach hält Wasser für Pflanzen und Verdunstung zurück — gut für den Kanal, schlecht für den Speicher.',
        'Slechts een deel van de neerslag bereikt de put: Q = A · e · η · P. A is de horizontale dakprojectie, e de opbrengstcoëfficiënt volgens DIN 1989-1 (0,8 pannen of plat dak zonder grind, 0,6 grind, 0,5 extensief en 0,3 intensief groendak, tabel 3) en η het filterrendement (0,9). Een groendak houdt water vast voor planten en verdamping — goed voor de riolering, slecht voor de put.',
        'Seule une partie de la pluie atteint la citerne : Q = A · e · η · P. A est la projection horizontale de la toiture, e le coefficient de rendement DIN 1989-1 (0,8 tuiles ou toiture plate sans gravier, 0,6 gravier, 0,5 toiture verte extensive et 0,3 intensive, tableau 3) et η le rendement du filtre (0,9). Une toiture verte retient l’eau pour les plantes et l’évaporation — bon pour l’égout, mauvais pour la citerne.',
        'Solo parte de la lluvia llega al depósito: Q = A · e · η · P. A es la proyección horizontal de la cubierta, e el coeficiente de DIN 1989-1 (0,8 teja o cubierta plana sin grava, 0,6 grava, 0,5 cubierta verde extensiva y 0,3 intensiva, tabla 3) y η el rendimiento del filtro (0,9). Una cubierta verde retiene agua para las plantas y la evaporación: buena para el alcantarillado, mala para el depósito.',
        'Do zbiornika dociera tylko część deszczu: Q = A · e · η · P. A to rzut poziomy dachu, e współczynnik spływu wg DIN 1989-1 (0,8 dachówka lub dach płaski bez żwiru, 0,6 żwir, 0,5 zielony dach ekstensywny i 0,3 intensywny, tabela 3), η sprawność filtra (0,9). Zielony dach zatrzymuje wodę dla roślin i parowania — dobrze dla kanalizacji, źle dla zbiornika.') },
    curve: { title: T7('Reading the tank curve', 'Як читати криву бака', 'Die Speicherkurve lesen', 'De putcurve lezen', 'Lire la courbe de citerne', 'Leer la curva del depósito', 'Jak czytać krzywą zbiornika'),
      body: T7('The chart repeats the whole simulation for 25 tank sizes. Coverage rises steeply at first and then flattens: past the knee each extra cubic metre buys little water. When the demand is larger than what the roof can give, the curve flattens below 100 % — the roof is the limit, not the tank. The second line shows the share of the collected rain that is used; the rest overflows.',
        'Графік повторює всю симуляцію для 25 розмірів бака. Покриття спершу різко зростає, а потім вирівнюється: після «коліна» кожен додатковий кубометр дає мало води. Якщо споживання більше, ніж може дати покрівля, крива вирівнюється нижче 100 % — обмеженням є покрівля, а не бак. Друга лінія показує частку зібраного дощу, що використовується; решта переливається.',
        'Das Diagramm wiederholt die ganze Simulation für 25 Speichergrößen. Der Deckungsgrad steigt zuerst steil und flacht dann ab: hinter dem Knick bringt jeder weitere Kubikmeter wenig Wasser. Ist der Bedarf größer als das, was das Dach liefern kann, flacht die Kurve unter 100 % ab — das Dach begrenzt, nicht der Speicher. Die zweite Linie zeigt den genutzten Anteil des Zuflusses; der Rest läuft über.',
        'De grafiek herhaalt de volledige simulatie voor 25 putgroottes. De dekkingsgraad stijgt eerst steil en vlakt dan af: voorbij de knik levert elke extra kubieke meter weinig water op. Is het verbruik groter dan wat het dak kan geven, dan vlakt de curve af onder 100 % — het dak is de grens, niet de put. De tweede lijn toont het gebruikte deel van de instroom; de rest loopt over.',
        'Le graphique répète la simulation complète pour 25 tailles de citerne. La couverture monte d’abord vite puis s’aplatit : après le coude, chaque mètre cube supplémentaire apporte peu d’eau. Si la demande dépasse ce que la toiture peut fournir, la courbe plafonne sous 100 % — la limite est la toiture, pas la citerne. La seconde courbe montre la part de la pluie collectée qui est utilisée ; le reste déborde.',
        'El gráfico repite toda la simulación para 25 tamaños de depósito. La cobertura sube rápido al principio y luego se aplana: pasado el codo, cada metro cúbico adicional aporta poca agua. Si la demanda es mayor de lo que la cubierta puede dar, la curva se aplana por debajo del 100 %: el límite es la cubierta, no el depósito. La segunda línea muestra la parte de la lluvia recogida que se usa; el resto rebosa.',
        'Wykres powtarza całą symulację dla 25 wielkości zbiornika. Pokrycie najpierw szybko rośnie, potem się wypłaszcza: za „kolanem” każdy kolejny metr sześcienny daje mało wody. Gdy zapotrzebowanie przekracza to, co może dać dach, krzywa wypłaszcza się poniżej 100 % — ogranicza dach, nie zbiornik. Druga linia pokazuje wykorzystaną część dopływu; reszta się przelewa.') },
    din: { title: T7('The DIN 1989-1 rule of thumb', 'Правило DIN 1989-1', 'Die Faustregel der DIN 1989-1', 'De vuistregel van DIN 1989-1', 'La règle simplifiée de la DIN 1989-1', 'La regla práctica de DIN 1989-1', 'Reguła uproszczona DIN 1989-1'),
      body: T7('The simplified method of DIN 1989-1 takes 6 % of the smaller of annual yield and annual demand — about three weeks of supply. It lands near the knee of the curve. The Flemish minimum volumes are often larger: they also serve to hold back storm water, not only to save drinking water.',
        'Спрощений метод DIN 1989-1 бере 6 % від меншого з річної віддачі та річного споживання — приблизно три тижні запасу. Це близько до «коліна» кривої. Фламандські мінімальні об’єми часто більші: вони служать і для затримання зливової води, а не лише для економії питної.',
        'Das vereinfachte Verfahren der DIN 1989-1 nimmt 6 % des kleineren Werts aus Jahresertrag und Jahresbedarf — etwa drei Wochen Vorrat. Das liegt nahe am Knick der Kurve. Die flämischen Mindestvolumen sind oft größer: sie dienen auch dem Rückhalt von Starkregen, nicht nur dem Sparen von Trinkwasser.',
        'De vereenvoudigde methode van DIN 1989-1 neemt 6 % van het kleinste van jaaropbrengst en jaarverbruik — ongeveer drie weken voorraad. Dat ligt dicht bij de knik van de curve. De Vlaamse minimale volumes zijn vaak groter: ze dienen ook om regenwater bij piekbuien op te houden, niet alleen om drinkwater te sparen.',
        'La méthode simplifiée de la DIN 1989-1 prend 6 % du plus petit du rendement annuel et de la demande annuelle — environ trois semaines d’autonomie. Elle tombe près du coude de la courbe. Les volumes minimaux flamands sont souvent plus grands : ils servent aussi à retenir les eaux d’orage, pas seulement à économiser l’eau potable.',
        'El método simplificado de DIN 1989-1 toma el 6 % del menor entre el rendimiento y la demanda anuales, unas tres semanas de suministro. Cae cerca del codo de la curva. Los volúmenes mínimos flamencos suelen ser mayores: también sirven para retener aguas de tormenta, no solo para ahorrar agua potable.',
        'Uproszczona metoda DIN 1989-1 przyjmuje 6 % mniejszej z wartości rocznego uzysku i rocznego zapotrzebowania — około trzech tygodni zapasu. Wypada blisko „kolana” krzywej. Flamandzkie minimalne objętości są często większe: służą też do zatrzymania wód nawalnych, nie tylko do oszczędzania wody pitnej.') },
    gsv: { title: T7('GSV Hemelwater 2023: tank', 'GSV Hemelwater 2023: бак', 'GSV Hemelwater 2023: Zisterne', 'GSV Hemelwater 2023: hemelwaterput', 'GSV Hemelwater 2023 : citerne', 'GSV Hemelwater 2023: depósito', 'GSV Hemelwater 2023: zbiornik'),
      body: T7('In Flanders rainwater is first reused, then infiltrated, then buffered, and only then discharged — separately from wastewater. Art. 7 of the 2023 regulation (in force 2 October 2023, no 40 m² threshold any more): one dwelling needs 5000 L below 80 m² of roof, 7500 L up to 120 m², 10 000 L up to 200 m² and 100 L/m² above; several dwellings or other buildings 100 L/m², with one dwelling connected per started 5000 L. Green roofs storing ≥ 50 L/m² count half. The tank needs a pump and pipes to every WC, the washing machine and the garden.',
        'У Фландрії дощову воду спершу використовують, потім інфільтрують, потім буферизують і лише тоді скидають — окремо від стічних вод. Ст. 7 регламенту 2023 (чинний з 2 жовтня 2023, порогу 40 м² більше немає): одне житло — 5000 л при покрівлі до 80 м², 7500 л до 120 м², 10 000 л до 200 м² і 100 л/м² понад це; кілька житлових одиниць або інші будівлі — 100 л/м², одне житло підключається на кожні розпочаті 5000 л. Зелені покрівлі з утриманням ≥ 50 л/м² рахуються наполовину. Бак потребує насоса й труб до кожного WC, пральної машини та саду.',
        'In Flandern wird Regenwasser zuerst genutzt, dann versickert, dann gepuffert und erst dann abgeleitet — getrennt vom Schmutzwasser. Art. 7 der Verordnung 2023 (gültig ab 2. Oktober 2023, keine 40-m²-Schwelle mehr): eine Wohnung braucht 5000 L unter 80 m² Dach, 7500 L bis 120 m², 10 000 L bis 200 m² und darüber 100 L/m²; mehrere Wohnungen oder andere Gebäude 100 L/m², je angefangene 5000 L eine angeschlossene Wohnung. Gründächer mit ≥ 50 L/m² Speicher zählen zur Hälfte. Die Zisterne braucht eine Pumpe und Leitungen zu jedem WC, zur Waschmaschine und in den Garten.',
        'In Vlaanderen wordt hemelwater eerst hergebruikt, dan geïnfiltreerd, dan gebufferd en pas dan afgevoerd — gescheiden van afvalwater. Art. 7 van de verordening 2023 (van kracht sinds 2 oktober 2023, geen drempel van 40 m² meer): één woongelegenheid vraagt 5000 L onder 80 m² dak, 7500 L tot 120 m², 10 000 L tot 200 m² en daarboven 100 L/m²; meerdere woongelegenheden of andere gebouwen 100 L/m², met één aangesloten woongelegenheid per begonnen 5000 L. Groendaken met ≥ 50 L/m² berging tellen voor de helft. De put krijgt een pomp en leidingen naar elk toilet, de wasmachine en de tuin.',
        'En Flandre l’eau de pluie est d’abord réutilisée, puis infiltrée, puis tamponnée et seulement ensuite évacuée — séparément des eaux usées. Art. 7 du règlement 2023 (en vigueur depuis le 2 octobre 2023, plus de seuil de 40 m²) : un logement demande 5000 L sous 80 m² de toiture, 7500 L jusqu’à 120 m², 10 000 L jusqu’à 200 m² et 100 L/m² au-delà ; plusieurs logements ou d’autres bâtiments 100 L/m², avec un logement raccordé par tranche entamée de 5000 L. Les toitures vertes stockant ≥ 50 L/m² comptent pour moitié. La citerne reçoit une pompe et des conduites vers chaque WC, le lave-linge et le jardin.',
        'En Flandes el agua de lluvia primero se reutiliza, después se infiltra, luego se lamina y solo entonces se vierte, separada de las aguas residuales. Art. 7 del reglamento de 2023 (vigente desde el 2 de octubre de 2023, ya sin umbral de 40 m²): una vivienda necesita 5000 L con menos de 80 m² de cubierta, 7500 L hasta 120 m², 10 000 L hasta 200 m² y 100 L/m² por encima; varias viviendas u otros edificios 100 L/m², con una vivienda conectada por cada 5000 L iniciados. Las cubiertas verdes con ≥ 50 L/m² cuentan la mitad. El depósito lleva bomba y tuberías a cada inodoro, la lavadora y el jardín.',
        'We Flandrii deszczówkę najpierw się wykorzystuje, potem rozsącza, potem retencjonuje, a dopiero potem odprowadza — oddzielnie od ścieków. Art. 7 rozporządzenia 2023 (obowiązuje od 2 października 2023, bez progu 40 m²): jedno mieszkanie wymaga 5000 L przy dachu poniżej 80 m², 7500 L do 120 m², 10 000 L do 200 m² i 100 L/m² powyżej; kilka mieszkań lub inne budynki 100 L/m², z jednym mieszkaniem podłączonym na każde rozpoczęte 5000 L. Zielone dachy magazynujące ≥ 50 L/m² liczą się w połowie. Zbiornik wymaga pompy i rur do każdego WC, pralki i ogrodu.') },
    infiltration: { title: T7('Infiltration and buffer', 'Інфільтрація і буфер', 'Versickerung und Puffer', 'Infiltratie en buffer', 'Infiltration et tamponnement', 'Infiltración y laminación', 'Rozsączanie i retencja'),
      body: T7('Art. 8: on plots of 120 m² or more the counted area — new paving plus the counted roof, minus 30 m² per dwelling connected to a compliant tank — must drain to an infiltration facility with an area of at least 8 % and a buffer volume of at least 33 L/m². An extension counts up to three times its own area. Art. 9: only if infiltration is technically impossible and the counted area is at least 1000 m², a buffer of 43 L/m² with an outflow of at most 5 l/s per hectare is built instead.',
        'Ст. 8: на ділянках від 120 м² врахована площа — нове мощення плюс врахована покрівля мінус 30 м² на кожне житло, підключене до відповідного бака, — має відводитися в інфільтраційну споруду площею щонайменше 8 % і буферним об’ємом щонайменше 33 л/м². Прибудова рахується до трьох разів своєї площі. Ст. 9: лише якщо інфільтрація технічно неможлива і врахована площа становить щонайменше 1000 м², замість неї влаштовують буфер 43 л/м² зі скидом не більше 5 л/с на гектар.',
        'Art. 8: auf Grundstücken ab 120 m² muss die anzurechnende Fläche — neue Befestigung plus anzurechnendes Dach, abzüglich 30 m² je an eine konforme Zisterne angeschlossene Wohnung — in eine Versickerungsanlage mit mindestens 8 % Fläche und mindestens 33 L/m² Puffervolumen entwässern. Eine Erweiterung zählt bis zum Dreifachen ihrer Fläche. Art. 9: nur wenn Versickerung technisch unmöglich ist und die Fläche mindestens 1000 m² beträgt, wird stattdessen ein Puffer mit 43 L/m² und höchstens 5 l/s je Hektar Abfluss gebaut.',
        'Art. 8: op percelen van 120 m² of meer moet de in rekening te brengen oppervlakte — nieuwe verharding plus het in rekening te brengen dak, min 30 m² per woongelegenheid die op een conforme put is aangesloten — afwateren naar een infiltratievoorziening met een oppervlakte van minstens 8 % en een buffervolume van minstens 33 L/m². Een uitbreiding telt tot drie keer haar eigen oppervlakte. Art. 9: alleen als infiltratie technisch onmogelijk is en de oppervlakte minstens 1000 m² bedraagt, komt er een buffer van 43 L/m² met een lozingsdebiet van hoogstens 5 l/s per hectare.',
        'Art. 8 : sur les parcelles de 120 m² ou plus, la surface prise en compte — revêtements neufs plus toiture prise en compte, moins 30 m² par logement raccordé à une citerne conforme — doit s’écouler vers un ouvrage d’infiltration d’au moins 8 % de surface et 33 L/m² de volume tampon. Une extension compte jusqu’à trois fois sa propre surface. Art. 9 : seulement si l’infiltration est techniquement impossible et que la surface atteint 1000 m², on réalise à la place un bassin de 43 L/m² avec un débit de fuite d’au plus 5 l/s par hectare.',
        'Art. 8: en parcelas de 120 m² o más, la superficie computada — pavimento nuevo más la cubierta computada, menos 30 m² por vivienda conectada a un depósito conforme — debe desaguar a una instalación de infiltración con al menos el 8 % de superficie y 33 L/m² de volumen de almacenamiento. Una ampliación cuenta hasta tres veces su superficie. Art. 9: solo si la infiltración es técnicamente imposible y la superficie es de al menos 1000 m², se construye en su lugar una laminación de 43 L/m² con un vertido máximo de 5 l/s por hectárea.',
        'Art. 8: na działkach od 120 m² uwzględniana powierzchnia — nowa nawierzchnia plus uwzględniany dach minus 30 m² na każde mieszkanie podłączone do zgodnego zbiornika — musi odpływać do urządzenia rozsączającego o powierzchni co najmniej 8 % i objętości buforowej co najmniej 33 L/m². Rozbudowa liczy się do trzykrotności własnej powierzchni. Art. 9: tylko gdy rozsączanie jest technicznie niemożliwe, a powierzchnia wynosi co najmniej 1000 m², buduje się zamiast tego retencję 43 L/m² z odpływem najwyżej 5 l/s na hektar.') },
    savings: { title: T7('Savings and demand', 'Економія і споживання', 'Einsparung und Bedarf', 'Besparing en verbruik', 'Économies et demande', 'Ahorro y demanda', 'Oszczędności i zapotrzebowanie'),
      body: T7('Savings = rainwater used × the integral water price (drinking water plus sanitation, about 5–6 EUR/m³ in Flanders — a learning assumption, check your water bill). Typical uses per person and day: WC about 24 L, washing machine about 12 L; an office person with urinals about 15 L on working days. Garden watering is entered as a depth over the season (100–150 mm a year for a lawn). A pump and the filter maintenance cost money too.',
        'Економія = використана дощова вода × повна ціна води (питна вода плюс водовідведення, близько 5–6 EUR/м³ у Фландрії — навчальне припущення, перевірте свій рахунок). Типове споживання на особу на добу: WC близько 24 л, пральна машина близько 12 л; працівник офісу з пісуарами — близько 15 л у робочі дні. Полив саду задається шаром за сезон (100–150 мм на рік для газону). Насос і обслуговування фільтра теж коштують грошей.',
        'Einsparung = genutztes Regenwasser × integraler Wasserpreis (Trinkwasser plus Abwasser, in Flandern etwa 5–6 EUR/m³ — eine Lernannahme, prüfen Sie Ihre Abrechnung). Typische Verbräuche je Person und Tag: WC etwa 24 L, Waschmaschine etwa 12 L; im Büro mit Urinalen etwa 15 L an Arbeitstagen. Die Gartenbewässerung wird als Höhe über die Saison eingegeben (100–150 mm im Jahr für Rasen). Pumpe und Filterwartung kosten ebenfalls Geld.',
        'Besparing = gebruikt hemelwater × de integrale waterprijs (drinkwater plus sanering, ongeveer 5–6 EUR/m³ in Vlaanderen — een leeraanname, controleer uw waterfactuur). Typisch verbruik per persoon en dag: toilet ongeveer 24 L, wasmachine ongeveer 12 L; een kantoormedewerker met urinoirs ongeveer 15 L op werkdagen. Tuinbesproeiing wordt ingegeven als hoogte over het seizoen (100–150 mm per jaar voor gazon). Ook de pomp en het filteronderhoud kosten geld.',
        'Économie = eau de pluie utilisée × prix intégral de l’eau (eau potable plus assainissement, environ 5–6 EUR/m³ en Flandre — hypothèse pédagogique, vérifiez votre facture). Consommations typiques par personne et par jour : WC environ 24 L, lave-linge environ 12 L ; au bureau avec urinoirs environ 15 L les jours ouvrables. L’arrosage est saisi comme une hauteur sur la saison (100–150 mm par an pour une pelouse). La pompe et l’entretien du filtre ont aussi un coût.',
        'Ahorro = agua de lluvia usada × precio integral del agua (agua potable más saneamiento, unos 5–6 EUR/m³ en Flandes — supuesto didáctico, compruebe su factura). Consumos típicos por persona y día: inodoro unos 24 L, lavadora unos 12 L; en oficina con urinarios unos 15 L en días laborables. El riego se introduce como lámina en la temporada (100–150 mm al año para césped). La bomba y el mantenimiento del filtro también cuestan dinero.',
        'Oszczędność = wykorzystana deszczówka × łączna cena wody (woda pitna plus ścieki, we Flandrii ok. 5–6 EUR/m³ — założenie dydaktyczne, sprawdź swój rachunek). Typowe zużycie na osobę na dobę: WC ok. 24 L, pralka ok. 12 L; pracownik biura z pisuarami ok. 15 L w dni robocze. Podlewanie ogrodu wprowadza się jako wysokość w sezonie (100–150 mm rocznie dla trawnika). Pompa i serwis filtra też kosztują.') }
