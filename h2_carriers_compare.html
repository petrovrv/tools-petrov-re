  function computeView(s){
    last = solve(s); if (stage) stage.schedule();
    var r = last, e, k, i, w, c;
    if (!r || !r.ok) { e = (r && r.error) || 'Unknown error'; return { verdict: { tone: 'bad', text: trMsg(e) }, tiles: [], notes: [] }; }
    function fin(v){ return typeof v === 'number' && isFinite(v); }
    var tiles = [], notes = [], tables = [], t = [], IDS = ['lh2', 'nh3', 'lohc'];
    function add(label, v, unit, learn, head, tone){ if (!fin(v)) return; tiles.push({ label: label, value: sigv(v, 4), hint: unit, precision: sig(v, 4), tone: tone || null, learn: learn, headline: !!head }); }
    var N = CNAME[r.best], X = DiagramUI.fmt(r.best_cost, { precision: 2 }), Y = DiagramUI.fmt(r[r.best + '_transport'], { precision: 2 });
    var A = ['Cheapest carrier: ', 'Найдешевший носій: ', 'Günstigster Träger: ', 'Goedkoopste drager: ', 'Vecteur le moins cher : ', 'Portador más barato: ', 'Najtańszy nośnik: '];
    var B = [' — delivered ', ' — з доставкою ', ' — geliefert ', ' — geleverd ', ' — livré ', ' — entregado ', ' — dostarczony '];
    var Cc = [' EUR/kg H₂, of which transport ', ' EUR/кг H₂, з них транспорт ', ' EUR/kg H₂, davon Transport ', ' EUR/kg H₂, waarvan transport ', ' EUR/kg H₂, dont transport ', ' EUR/kg H₂, de ellos transporte ', ' EUR/kg H₂, w tym transport '];
    for (k = 0; k < 7; k++) t.push(A[k] + N[k] + B[k] + X + Cc[k] + Y);
    var verdict = { tone: 'ok', text: T.apply(null, t) };
    var LBL = {
      cost: ['Delivered cost', 'Вартість з доставкою', 'Lieferkosten', 'Geleverde kosten', 'Coût livré', 'Coste entregado', 'Koszt dostarczenia'],
      eff: ['Chain efficiency', 'ККД ланцюга', 'Kettenwirkungsgrad', 'Ketenrendement', 'Rendement de la chaîne', 'Eficiencia de la cadena', 'Sprawność łańcucha']
    };
    function L2(a, n) { var o = []; for (var j = 0; j < 7; j++) o.push(n[j] + ' · ' + a[j]); return T.apply(null, o); }
    for (i = 0; i < IDS.length; i++) { c = IDS[i]; add(L2(LBL.cost, CNAME[c]), r[c + '_cost'], 'EUR/kg', 'costs', c === r.best); }
    for (i = 0; i < IDS.length; i++) { c = IDS[i]; add(L2(LBL.eff, CNAME[c]), 100 * r[c + '_eff'], '%', 'efficiency'); }
    if (s && s.level === 'full') {
      add(T('Voyage time', 'Тривалість рейсу', 'Fahrtdauer', 'Reistijd', 'Durée du voyage', 'Duración del viaje', 'Czas rejsu'), r.days, 'd', 'boiloff');
      for (i = 0; i < IDS.length; i++) { c = IDS[i]; add(L2(['Delivered share of H₂ fed', 'Частка доставленого H₂', 'Gelieferter Anteil des H₂', 'Geleverd aandeel H₂', 'Part de H₂ livrée', 'Fracción de H₂ entregada', 'Dostarczony udział H₂'], CNAME[c]), 100 * r[c + '_deliv'], '%', 'efficiency'); }
    }
    var STEP = [
      ['production', T('Hydrogen production', 'Виробництво водню', 'Wasserstofferzeugung', 'Waterstofproductie', 'Production d’hydrogène', 'Producción de hidrógeno', 'Produkcja wodoru')],
      ['conversion', T('Conversion', 'Перетворення', 'Umwandlung', 'Conversie', 'Conversion', 'Conversión', 'Konwersja')],
      ['terminals', T('Storage and terminals', 'Зберігання та термінали', 'Lager und Terminals', 'Opslag en terminals', 'Stockage et terminaux', 'Almacenamiento y terminales', 'Magazynowanie i terminale')],
      ['shipping', T('Shipping', 'Морське перевезення', 'Schiffstransport', 'Scheepvaart', 'Transport maritime', 'Transporte marítimo', 'Transport morski')],
      ['reconversion', T('Reconversion', 'Зворотне перетворення', 'Rückumwandlung', 'Terugconversie', 'Reconversion', 'Reconversión', 'Rekonwersja')]
    ], rows = [];
    for (i = 0; i < STEP.length; i++) {
      rows.push({ cells: [STEP[i][1], { value: r.breakdown.lh2[STEP[i][0]], precision: 3 }, { value: r.breakdown.nh3[STEP[i][0]], precision: 3 }, { value: r.breakdown.lohc[STEP[i][0]], precision: 3 }] });
    }
    tables.push({
      title: T('Cost per kg delivered (EUR/kg H₂)', 'Вартість на кг доставленого (EUR/кг H₂)', 'Kosten je geliefertem kg (EUR/kg H₂)', 'Kosten per geleverde kg (EUR/kg H₂)', 'Coût par kg livré (EUR/kg H₂)', 'Coste por kg entregado (EUR/kg H₂)', 'Koszt na dostarczony kg (EUR/kg H₂)'),
      head: [T('Step', 'Етап', 'Schritt', 'Stap', 'Étape', 'Etapa', 'Etap'), { label: T('LH₂', 'LH₂', 'LH₂', 'LH₂', 'LH₂', 'LH₂', 'LH₂'), num: true }, { label: T('NH₃', 'NH₃', 'NH₃', 'NH₃', 'NH₃', 'NH₃', 'NH₃'), num: true }, { label: T('LOHC', 'LOHC', 'LOHC', 'LOHC', 'LOHC', 'LOHC', 'LOHC'), num: true }],
      rows: rows,
      foot: [T('Total', 'Разом', 'Summe', 'Totaal', 'Total', 'Total', 'Razem'), { value: r.lh2_cost, precision: 3 }, { value: r.nh3_cost, precision: 3 }, { value: r.lohc_cost, precision: 3 }]
    });
    notes.push(T('Basis: hydrogen LHV 120 MJ/kg (33.3 kWh/kg); costs per kg of hydrogen delivered as pure H₂ at the import terminal, EUR 2025, indicative defaults after IEA The Future of Hydrogen (2019)',
      'Основа: LHV водню 120 МДж/кг (33,3 кВт·год/кг); вартість на кг водню, доставленого як чистий H₂ на імпортний термінал, EUR 2025, орієнтовні значення за IEA The Future of Hydrogen (2019)',
      'Grundlage: Heizwert Wasserstoff 120 MJ/kg (33,3 kWh/kg); Kosten je kg Wasserstoff, als reiner H₂ am Importterminal geliefert, EUR 2025, Richtwerte nach IEA The Future of Hydrogen (2019)',
      'Basis: onderwaarde waterstof 120 MJ/kg (33,3 kWh/kg); kosten per kg waterstof geleverd als zuivere H₂ aan de importterminal, EUR 2025, indicatieve waarden naar IEA The Future of Hydrogen (2019)',
      'Base : PCI de l’hydrogène 120 MJ/kg (33,3 kWh/kg) ; coûts par kg d’hydrogène livré pur au terminal d’import, EUR 2025, valeurs indicatives d’après IEA The Future of Hydrogen (2019)',
      'Base: PCI del hidrógeno 120 MJ/kg (33,3 kWh/kg); costes por kg de hidrógeno entregado como H₂ puro en la terminal de importación, EUR 2025, valores orientativos según IEA The Future of Hydrogen (2019)',
      'Podstawa: LHV wodoru 120 MJ/kg (33,3 kWh/kg); koszty na kg wodoru dostarczonego jako czysty H₂ do terminalu importowego, EUR 2025, wartości orientacyjne wg IEA The Future of Hydrogen (2019)'));
    for (i = 0; r.warnings && i < r.warnings.length; i++) { w = r.warnings[i]; notes.push(trMsg(w)); }
    return { verdict: verdict, tiles: tiles, meters: [], tables: tables, notes: notes };
  }

  function degrade() {
    document.title = 'diagram-ui.js v1 is required';
    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1');
    h.textContent = 'Hydrogen carriers compared: LH2, ammonia, LOHC';
    var p = document.createElement('p');
    p.textContent = 'The interactive interface could not load. The export, the calculation record '
                  + 'and the limitations are still available from the bar at the bottom of the page.';
    host.appendChild(h);
    host.appendChild(p);
    last = solve(state);
  }

    function curveData() {
      if (!last || !last.ok) return null;
      var s = {}, k, i, r, pts = [], ymn = 1e9, ymx = 0, x, xm = Math.max(20000, 1.2 * state.dist);
      for (k in state) if (Object.prototype.hasOwnProperty.call(state, k)) s[k] = state[k];
      for (i = 0; i <= 40; i++) {
        x = xm * i / 40; s.dist = x; r = solve(s);
        if (r && r.ok) { pts.push({ x: x, a: r.lh2_cost, b: r.nh3_cost, c: r.lohc_cost }); ymn = Math.min(ymn, r.lh2_cost, r.nh3_cost, r.lohc_cost); ymx = Math.max(ymx, r.lh2_cost, r.nh3_cost, r.lohc_cost); }
      }
      return { pts: pts, xMin: 0, xMax: xm, yMin: Math.max(0, ymn - 0.1 * (ymx - ymn) - 0.1), yMax: ymx + 0.1 * (ymx - ymn) + 0.1, xCur: state.dist, yCur: last.best_cost };
    }
    ui.stage({
      caption: T('Delivered hydrogen cost versus shipping distance for liquid hydrogen, ammonia and LOHC (LHV, EUR 2025)', 'Вартість доставленого водню залежно від відстані перевезення для рідкого водню, аміаку та LOHC (LHV, EUR 2025)', 'Lieferkosten für Wasserstoff über der Transportentfernung für Flüssigwasserstoff, Ammoniak und LOHC (Hi, EUR 2025)', 'Geleverde waterstofkosten tegen vaarafstand voor vloeibare waterstof, ammoniak en LOHC (LHV, EUR 2025)', 'Coût de l’hydrogène livré en fonction de la distance pour l’hydrogène liquide, l’ammoniac et le LOHC (PCI, EUR 2025)', 'Coste del hidrógeno entregado frente a la distancia para hidrógeno líquido, amoníaco y LOHC (PCI, EUR 2025)', 'Koszt dostarczonego wodoru w funkcji odległości dla ciekłego wodoru, amoniaku i LOHC (LHV, EUR 2025)'),
      minHeight: 300,
      a11y: function () {
        if (!last || !last.ok) return '';
        var d = DiagramUI.fmt(state.dist, { precision: 0 }), c = DiagramUI.fmt(last.best_cost, { precision: 2 }), n = CNAME[last.best][0];
        return tx(T('Line chart: delivered hydrogen cost in EUR/kg versus shipping distance in km for liquid hydrogen, ammonia and LOHC; at the current ' + d + ' km the cheapest is ' + n + ' at ' + c + ' EUR/kg.',
          'Лінійний графік: вартість доставленого водню в EUR/кг залежно від відстані перевезення в км для рідкого водню, аміаку та LOHC; на поточних ' + d + ' км найдешевший ' + n + ' — ' + c + ' EUR/кг.',
          'Liniendiagramm: Lieferkosten von Wasserstoff in EUR/kg über der Transportentfernung in km für Flüssigwasserstoff, Ammoniak und LOHC; bei den aktuellen ' + d + ' km ist ' + n + ' mit ' + c + ' EUR/kg am günstigsten.',
          'Lijngrafiek: geleverde waterstofkosten in EUR/kg tegen de vaarafstand in km voor vloeibare waterstof, ammoniak en LOHC; bij de huidige ' + d + ' km is ' + n + ' het goedkoopst met ' + c + ' EUR/kg.',
          'Graphique linéaire : coût de l’hydrogène livré en EUR/kg en fonction de la distance maritime en km pour l’hydrogène liquide, l’ammoniac et le LOHC ; à la distance actuelle de ' + d + ' km, le moins cher est ' + n + ' à ' + c + ' EUR/kg.',
          'Gráfico de líneas: coste del hidrógeno entregado en EUR/kg frente a la distancia de transporte en km para hidrógeno líquido, amoníaco y LOHC; a los ' + d + ' km actuales el más barato es ' + n + ' con ' + c + ' EUR/kg.',
          'Wykres liniowy: koszt dostarczonego wodoru w EUR/kg w funkcji odległości transportu w km dla ciekłego wodoru, amoniaku i LOHC; przy bieżących ' + d + ' km najtańszy jest ' + n + ' — ' + c + ' EUR/kg.'));
      },
      render: function (size, st) {
        var ctx = st.canvas(), w = size.w, h = size.h, coarse = size.density === 'coarse';
        var cs = getComputedStyle(document.documentElement);
        var muted = cs.getPropertyValue('--muted').trim() || '#888', line = cs.getPropertyValue('--line').trim() || '#ccc', font = cs.getPropertyValue('--font').trim() || 'sans-serif';
        ctx.clearRect(0, 0, w, h);
        var d = curveData(); if (!d) return;
        var L = coarse ? 46 : 58, R = 14, TOP = 12, B = coarse ? 36 : 44, pw = w - L - R, ph = h - TOP - B, i, t;
        function X(x) { return L + (x - d.xMin) / (d.xMax - d.xMin) * pw; }
        function Y(y) { return TOP + ph - (y - d.yMin) / (d.yMax - d.yMin) * ph; }
        function seg(x0, y0, x1, y1, col, lw, dash) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.setLineDash(dash || []); ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
        seg(L, TOP, L, TOP + ph, line, 1); seg(L, TOP + ph, L + pw, TOP + ph, line, 1);
        ctx.fillStyle = muted; ctx.font = (coarse ? 11 : 12) + 'px ' + font;
        var xt = DiagramUI.ticks(d.xMin, d.xMax, pw, size.density), yt = DiagramUI.ticks(d.yMin, d.yMax, ph, size.density);
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        for (i = 0; i < xt.length; i++) { t = X(xt[i]); seg(t, TOP + ph, t, TOP + ph + 4, line, 1); ctx.fillText(DiagramUI.fmt(xt[i], { precision: 0 }), t, TOP + ph + 6); }
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        for (i = 0; i < yt.length; i++) { t = Y(yt[i]); seg(L - 4, t, L, t, line, 1); ctx.fillText(DiagramUI.fmt(yt[i], { precision: 1 }), L - 6, t); }
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText('km', L + pw / 2, h - 2);
        ctx.save(); ctx.translate(12, TOP + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textBaseline = 'middle'; ctx.fillText('EUR/kg', 0, 0); ctx.restore();
        ctx.save(); ctx.beginPath(); ctx.rect(L, TOP, pw, ph); ctx.clip();
        seg(X(d.xCur), TOP, X(d.xCur), TOP + ph, muted, 1, [5, 4]);
        function poly(key, col, lw, dash) { ctx.setLineDash(dash || []); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
          for (var j = 0; j < d.pts.length; j++) { if (j) ctx.lineTo(X(d.pts[j].x), Y(d.pts[j][key])); else ctx.moveTo(X(d.pts[j].x), Y(d.pts[j][key])); } ctx.stroke(); }
        poly('a', DiagramUI.series(0), 2); poly('b', DiagramUI.series(1), 2); poly('c', DiagramUI.series(2), 2);
        ctx.setLineDash([]);
        if (isFinite(d.yCur)) { ctx.fillStyle = muted; ctx.beginPath(); ctx.arc(X(d.xCur), Y(d.yCur), coarse ? 3 : 4, 0, 2 * Math.PI); ctx.fill(); }
        ctx.restore();
      }
    });
    adoptStage(ui);

    ui.ready();
    window['__h2_carriers_compare'] = { ui: ui, state: state, solve: solve, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function buildRecord(){
    if (!last) return null;
    var inputs = {}, outputs = {}, units = {}, warnings, i, j, k, ids = ['lh2', 'nh3', 'lohc'];
    var inU = [['level','-'], ['dist','km'], ['speed','km/day'], ['P_h2','EUR/kg'], ['elec_price','EUR/MWh'], ['imp_elec','EUR/MWh'], ['heat_price','EUR/MWh'], ['heat_h2','-'], ['eta_burn','-']];
    var pu = { conv_kWh: 'kWh/kg H2', conv_eur: 'EUR/kg H2', f_conv: '-', term_eur: 'EUR/kg H2', ship_eur: 'EUR/kg H2 per 1000 km', bo_day: '%/day', rec_heat: 'kWh(th)/kg H2', rec_kWh: 'kWh/kg H2', rec_eur: 'EUR/kg H2', f_rec: '-' };
    for (i = 0; i < ids.length; i++) { for (k in pu) { if (pu.hasOwnProperty(k)) { inU.push([ids[i] + '_' + k, pu[k]]); } } }
    for (i = 0; i < inU.length; i++) { k = inU[i][0]; inputs[k] = state[k]; units[k] = inU[i][1]; }
    if (last.ok) {
      var outU = [['best','-'], ['best_cost','EUR/kg delivered'], ['days','d']];
      var ou = { cost: 'EUR/kg delivered', transport: 'EUR/kg delivered', eff: '- (LHV)', deliv: 'kg delivered / kg fed', kWh: 'kWh/kg delivered' };
      for (i = 0; i < ids.length; i++) { for (k in ou) { if (ou.hasOwnProperty(k)) { outU.push([ids[i] + '_' + k, ou[k]]); } } }
      outU.push(['energy_basis', '-']);
      for (i = 0; i < outU.length; i++) { k = outU[i][0]; outputs[k] = last[k]; units[k] = outU[i][1]; }
      for (i = 0; i < ids.length; i++) { for (j in last.breakdown[ids[i]]) { if (last.breakdown[ids[i]].hasOwnProperty(j)) { outputs[ids[i] + '_part_' + j] = last.breakdown[ids[i]][j]; units[ids[i] + '_part_' + j] = 'EUR/kg delivered'; } } }
      warnings = (last.warnings || []).slice();
    } else {
      warnings = [last.error];
    }
    return {
      inputs: inputs,
      outputs: outputs,
      units: units,
      model: {
        equations: [
          'days = dist / speed; f_ship = (1 - bo_day/100)^days',
          'f_in = f_conv * f_ship; h = rec_heat / (33.33 * eta_burn) if heat from H2 else 0',
          'delivered per kg fed d = f_in * f_rec * (1 - h)',
          'cost = [P_h2 + conv_kWh*price + conv_eur + term_eur + ship_eur*dist/1000 + f_in*(rec_kWh*price_imp + rec_eur + rec_heat*heat_price)] / d',
          'efficiency = d * 33.33 / (33.33 + conv_kWh + f_in*(rec_kWh + rec_heat))',
          'IEA The Future of Hydrogen (2019-06), ch. 3 and annex'
        ],
        ranges: [ 'Ship transport 0 - 40 000 km', 'Hydrogen delivered as pure H2 at the import terminal (after reconversion)' ],
        notes: [ 'Energy basis: hydrogen LHV 120 MJ/kg (33.33 kWh/kg)', 'Default unit costs are indicative EUR 2025 values and must be replaced by project data' ]
      },
      warnings: warnings
    };
  }

  var HANDOFF = {
    provides: ['L'],
    accepts: ['L'],
    build: function(){
      if (!(last && last.ok)) return null;
      return {
        quantities: { L: { value: state.dist * 1000, unit: 'm' } },
        /* numeric rows only; the cost is EUR per kg H2 (no SI unit -> '-'), carrier name and basis stay in the record */
        sets: { econ: [{ delivered_EUR_per_kg: { value: last.best_cost, unit: '-' } }] }
      };
    },
    apply: function(payload){
      var q = (payload && payload.quantities) || {}, l;
      function val(o){ return (o && typeof o === 'object') ? +o.value : +o; }
      if (q.L != null) { l = val(q.L); if (isFinite(l) && l >= 0) state.dist = l / 1000; }
      last = solve(state);
      if (ui) { ui.sync(); ui.run(); }
    }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'h2_carriers_compare',
        file: 'h2_carriers_compare.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
