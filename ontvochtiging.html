k1:{en:"No result is derived from a room state above saturation: a required dew point above the room temperature is refused, not computed.",uk:"Жоден результат не виводиться зі стану приміщення вище насичення: потрібна точка роси вище за температуру приміщення відхиляється, а не рахується.",de:"Kein Ergebnis wird aus einem Raumzustand über der Sättigung abgeleitet: ein geforderter Taupunkt über der Raumtemperatur wird abgelehnt statt gerechnet.",nl:"Geen resultaat wordt afgeleid uit een ruimtetoestand boven verzadiging: een gevraagd dauwpunt boven de ruimtetemperatuur wordt geweigerd, niet berekend.",fr:"Aucun résultat n’est tiré d’un état de local au-dessus de la saturation: un point de rosée requis supérieur à la température du local est refusé, pas calculé.",es:"Ningún resultado procede de un estado del local por encima de la saturación: un punto de rocío requerido superior a la temperatura del local se rechaza, no se calcula.",pl:"Nie otrzymuje się żadnego wyniku ze stanu pomieszczenia powyżej nasycenia: wymagany punkt rosy powyżej temperatury pomieszczenia jest odrzucany, a nie obliczany."},
k2:{en:"Humidity ratio and dew point invert each other from −60 to +30 °C.",uk:"Вологовміст і точка роси взаємно оборотні від −60 до +30 °C.",de:"Feuchtegrad und Taupunkt sind von −60 bis +30 °C gegenseitig umkehrbar.",nl:"Vochtverhouding en dauwpunt zijn van −60 tot +30 °C omkeerbaar.",fr:"Teneur en eau et point de rosée s’inversent l’un l’autre de −60 à +30 °C.",es:"La humedad absoluta y el punto de rocío se invierten mutuamente de −60 a +30 °C.",pl:"Zawartość wilgoci i punkt rosy są wzajemnie odwracalne w zakresie od −60 do +30 °C."},
k3:{en:"Cooling and reheat duty of every method are non-negative.",uk:"Холодопродуктивність і потужність підігріву кожного методу невід’ємні.",de:"Kälte- und Nacherwärmungsleistung jedes Verfahrens sind nicht negativ.",nl:"Koel- en naverwarmingsvermogen van elke methode zijn niet negatief.",fr:"La puissance de froid et de post-chauffage de chaque méthode est non négative.",es:"La potencia de frío y de post-calentamiento de cada método no es negativa.",pl:"Moc chłodzenia i dogrzewania dla każdej metody jest nieujemna."},
k4:{en:"Every applicable method has a positive specific energy and draws at least its own fan power.",uk:"Кожен придатний метод має додатну питому енергію і споживає щонайменше потужність власних вентиляторів.",de:"Jedes geeignete Verfahren hat eine positive spezifische Energie und nimmt mindestens seine eigene Ventilatorleistung auf.",nl:"Elke geschikte methode heeft een positieve specifieke energie en neemt ten minste haar eigen ventilatorvermogen op.",fr:"Chaque méthode applicable a une énergie spécifique positive et absorbe au moins la puissance de ses propres ventilateurs.",es:"Cada método aplicable tiene una energía específica positiva y absorbe al menos la potencia de sus propios ventiladores.",pl:"Każda stosowana metoda ma dodatnią energię właściwą i pobiera co najmniej własną moc wentylatora."},
k5:{en:"Water removed by every method is non-negative.",uk:"Видалена волога в кожному методі невід’ємна.",de:"Das entzogene Wasser ist bei jedem Verfahren nicht negativ.",nl:"Het verwijderde water is bij elke methode niet negatief.",fr:"L’eau extraite par chaque méthode est non négative.",es:"El agua extraída por cada método es no negativa.",pl:"Woda usunięta dowolną metodą jest nieujemna."},
k6:{en:"Saturation vapour pressure over water matches the reference values at 0, 20 and 100 °C.",uk:"Тиск насиченої пари над водою збігається з еталонами за 0, 20 і 100 °C.",de:"Der Sättigungsdampfdruck über Wasser trifft die Referenzwerte bei 0, 20 und 100 °C.",nl:"De verzadigingsdampdruk boven water komt overeen met de referentiewaarden bij 0, 20 en 100 °C.",fr:"La pression de vapeur saturante sur l’eau reproduit les valeurs de référence à 0, 20 et 100 °C.",es:"La presión de vapor de saturación sobre agua coincide con los valores de referencia a 0, 20 y 100 °C.",pl:"Ciśnienie pary nasyconej nad wodą jest zgodne z wartościami odniesienia dla 0, 20 i 100 °C."},
k7:{en:"Saturation vapour pressure over ice matches the reference value at −40 °C.",uk:"Тиск насиченої пари над льодом збігається з еталоном за −40 °C.",de:"Der Sättigungsdampfdruck über Eis trifft den Referenzwert bei −40 °C.",nl:"De verzadigingsdampdruk boven ijs komt overeen met de referentiewaarde bij −40 °C.",fr:"La pression de vapeur saturante sur la glace reproduit la valeur de référence à −40 °C.",es:"La presión de vapor de saturación sobre hielo coincide con el valor de referencia a −40 °C.",pl:"Ciśnienie pary nasyconej nad lodem jest zgodne z wartością odniesienia dla −40 °C."},
k8:{en:"Saturation humidity ratio rises with temperature across the ice and water branches from −60 to +60 °C.",uk:"Вологовміст насичення зростає з температурою на крижаній і водяній гілках від −60 до +60 °C.",de:"Der Sättigungsfeuchtegrad steigt mit der Temperatur über Eis- und Wasserzweig von −60 bis +60 °C.",nl:"De verzadigingsvochtverhouding stijgt met de temperatuur over de ijs- en watertak van −60 tot +60 °C.",fr:"La teneur en eau à saturation croît avec la température sur les branches glace et eau de −60 à +60 °C.",es:"La humedad absoluta de saturación crece con la temperatura en las ramas de hielo y agua de −60 a +60 °C.",pl:"Współczynnik nasycenia i wilgotności wzrasta wraz z temperaturą wzdłuż gałęzi lodu i wody od −60 do +60 °C."},
k9:{en:"Rotor moisture balance: the process stream loses what the regeneration stream gains.",uk:"Баланс вологи ротора: робочий потік втрачає стільки, скільки набирає потік регенерації.",de:"Feuchtebilanz des Rotors: der Prozessstrom verliert, was der Regenerationsstrom aufnimmt.",nl:"Vochtbalans van de rotor: de processtroom verliest wat de regeneratiestroom opneemt.",fr:"Bilan d’humidité du rotor: le flux traité perd ce que le flux de régénération gagne.",es:"Balance de humedad del rotor: el flujo tratado pierde lo que gana el flujo de regeneración.",pl:"Bilans wilgoci wirnika: ilość wilgoci odebrana strumieniowi procesowemu jest równa ilości przejętej przez strumień regeneracyjny."},
k10:{en:"Every method reported as applicable really reaches the required supply dew point.",uk:"Кожен метод, поданий як придатний, справді досягає потрібної точки роси припливу.",de:"Jedes als geeignet gemeldete Verfahren erreicht den geforderten Zulufttaupunkt tatsächlich.",nl:"Elke als geschikt gemelde methode haalt het vereiste toevoerdauwpunt werkelijk.",fr:"Chaque méthode annoncée comme applicable atteint réellement le point de rosée de soufflage requis.",es:"Cada método declarado aplicable alcanza realmente el punto de rocío de impulsión requerido.",pl:"Każda metoda uznana za stosowalną rzeczywiście osiąga wymagany punkt rosy."},
k11:{en:"Across the whole dew-point range of the comparison chart no method is reported applicable above the room temperature or with a non-positive specific energy.",uk:"У всьому діапазоні точки роси порівняльного графіка жоден метод не подається придатним вище за температуру приміщення або з недодатною питомою енергією.",de:"Über den gesamten Taupunktbereich des Vergleichsdiagramms wird kein Verfahren oberhalb der Raumtemperatur oder mit nicht positiver spezifischer Energie als geeignet gemeldet.",nl:"Over het hele dauwpuntbereik van de vergelijkingsgrafiek wordt geen methode als geschikt gemeld boven de ruimtetemperatuur of met een niet-positieve specifieke energie.",fr:"Sur toute la plage de points de rosée du graphique de comparaison, aucune méthode n’est annoncée applicable au-dessus de la température du local ni avec une énergie spécifique non positive.",es:"En todo el rango de puntos de rocío del gráfico de comparación, ningún método se declara aplicable por encima de la temperatura del local ni con energía específica no positiva.",pl:"W całym zakresie punktu rosy na wykresie porównawczym żadna metoda nie jest oznaczana jako możliwa, gdy punkt rosy przekracza temperaturę pomieszczenia albo gdy energia właściwa jest niedodatnia."},
k13:{en:"The regeneration air stream of the rotor stays inside the minimum and maximum fractions set for it over the whole range of moisture demand, purge sector included; it is never larger than the demand or that minimum requires, and its moisture pickup never exceeds the declared limit.",uk:"Потік повітря регенерації ротора залишається в заданих мінімальній і максимальній частках у всьому діапазоні потреби у волозі, разом із продувним сектором; він ніколи не більший, ніж вимагає потреба або сам мінімум, а поглинання вологи не перевищує заявленої межі.",de:"Der Regenerationsluftstrom des Rotors bleibt über den gesamten Feuchtebedarfsbereich innerhalb der gesetzten Mindest- und Höchstanteile, Spülsektor eingeschlossen; er ist nie größer, als der Bedarf oder dieser Mindestwert verlangt, und seine Feuchteaufnahme überschreitet die angegebene Grenze nie.",nl:"De regeneratieluchtstroom van de rotor blijft over het hele bereik van de vochtvraag binnen de ingestelde minimale en maximale aandelen, spoelsector inbegrepen; hij is nooit groter dan de vraag of dat minimum vergt, en de vochtopname overschrijdt de opgegeven grens nooit.",fr:"Le débit d’air de régénération de la roue reste dans les fractions minimale et maximale fixées sur toute la plage de demande d’humidité, secteur de purge compris; il n’excède jamais ce que la demande ou ce minimum exige, et sa reprise d’humidité ne dépasse jamais la limite déclarée.",es:"El caudal de aire de regeneración del rotor se mantiene dentro de las fracciones mínima y máxima fijadas en todo el rango de demanda de humedad, incluido el sector de purga; nunca es mayor de lo que exige la demanda o ese mínimo, y su captación de humedad nunca supera el límite declarado.",pl:"Strumień powietrza regeneracyjnego wirnika pozostaje w obrębie ustalonych dla niego frakcji minimalnej i maksymalnej w całym zakresie zapotrzebowania na wilgoć, włączając sektor przedmuchu; nigdy nie jest większy od zapotrzebowania lub od tego, czego wymaga minimum, a jego wchłanianie wilgoci nigdy nie przekracza zadeklarowanego limitu."},
k12:{en:"Every printed result field is a finite number.",uk:"Кожне виведене числове поле є скінченним числом.",de:"Jedes ausgegebene Ergebnisfeld ist eine endliche Zahl.",nl:"Elk weergegeven resultaatveld is een eindig getal.",fr:"Chaque champ de résultat affiché est un nombre fini.",es:"Cada campo de resultado mostrado es un número finito.",pl:"Każde wydrukowane pole wyniku jest liczbą skończoną."},

/* ---- limitations ---- */
li1:{en:"<b>Steady state only.</b> Start-up, batch drying, door transients and control lag are outside the model; a dryroom is verified at real occupancy and door movement, not at a design point.",uk:"<b>Лише стаціонарний режим.</b> Пуск, періодичне сушіння, перехідні процеси дверей і запізнення регулювання поза моделлю; суху кімнату перевіряють за реального завантаження й руху дверей, а не в розрахунковій точці.",de:"<b>Nur stationär.</b> Anfahren, chargenweises Trocknen, Türvorgänge und Regelverzug bleiben außen vor; ein Trockenraum wird bei realer Belegung und Türbewegung geprüft, nicht am Auslegungspunkt.",nl:"<b>Alleen stationair.</b> Opstarten, batchdrogen, deurovergangen en regelvertraging vallen buiten het model; een dryroom wordt bij werkelijke bezetting en deurbeweging getoetst.",fr:"<b>Régime permanent seulement.</b> Démarrage, séchage par lots, transitoires de porte et retard de régulation restent hors modèle; une salle sèche se vérifie en occupation réelle.",es:"<b>Solo régimen estacionario.</b> Arranque, secado por lotes, transitorios de puerta y retardo de control quedan fuera; una sala seca se verifica con ocupación real.",pl:"<b>Tylko stan ustalony.</b> Rozruch, suszenie wsadowe, przejściowe stany drzwi i opóźnienie sterowania nie są uwzględnione w modelu. Pomieszczenie suche jest weryfikowane przy rzeczywistym obciążeniu i ruchu drzwi, a nie w punkcie projektowym."},
li2:{en:"<b>Lumped air states, ice branch below zero.</b> One mixed room state, one coil bypass factor, one rotor effectiveness; stratification, short-circuiting between supply and return and local wet spots need measurement or a flow model. Below 0 °C the saturation pressure is taken over ice, so every dew point shown below zero is a frost point — over supercooled water the same air holds about 48 % more water at −40 °C.",uk:"<b>Зосереджені стани повітря, крижана гілка нижче нуля.</b> Один змішаний стан приміщення, один коефіцієнт байпасу, одна ефективність ротора; розшарування, перетікання між припливом і витяжкою та локальні вологі місця потребують вимірювань або моделі течії. Нижче 0 °C тиск насичення береться над льодом, тож кожна показана нижче нуля точка роси є точкою інею — над переохолодженою водою те саме повітря за −40 °C містить приблизно на 48 % більше вологи.",de:"<b>Konzentrierte Luftzustände, Eiszweig unter null.</b> Ein gemischter Raumzustand, ein Bypassfaktor, ein Rotorwirkungsgrad; Schichtung, Kurzschluss zwischen Zu- und Abluft und örtlich feuchte Stellen erfordern Messung oder ein Strömungsmodell. Unter 0 °C wird der Sättigungsdruck über Eis genommen, jeder unter null angezeigte Taupunkt ist damit ein Reifpunkt — über unterkühltem Wasser trägt dieselbe Luft bei −40 °C rund 48 % mehr Wasser.",nl:"<b>Geconcentreerde luchttoestanden, ijstak onder nul.</b> Eén gemengde ruimtetoestand, één bypassfactor, één rotorrendement; stratificatie, kortsluiting tussen toevoer en retour en lokale natte plekken vragen om meting of een stromingsmodel. Onder 0 °C wordt de verzadigingsdruk boven ijs genomen, zodat elk onder nul getoond dauwpunt een rijppunt is — boven onderkoeld water bevat dezelfde lucht bij −40 °C ongeveer 48 % meer water.",fr:"<b>États d’air globalisés, branche glace sous zéro.</b> Un état de local mélangé, un facteur de contournement, une efficacité de rotor; stratification, court-circuit entre soufflage et reprise et zones humides locales demandent une mesure ou un modèle d’écoulement. Sous 0 °C la pression de saturation est prise au-dessus de la glace: tout point de rosée affiché sous zéro est donc un point de givrage — au-dessus d’eau surfondue, le même air contient environ 48 % d’eau en plus à −40 °C.",es:"<b>Estados de aire agrupados, rama de hielo bajo cero.</b> Un estado de local mezclado, un factor de bypass, una eficacia de rotor; la estratificación, el cortocircuito entre impulsión y retorno y los puntos húmedos locales exigen medición o un modelo de flujo. Bajo 0 °C la presión de saturación se toma sobre hielo, por lo que todo punto de rocío mostrado bajo cero es un punto de escarcha — sobre agua subenfriada el mismo aire contiene un 48 % más de agua a −40 °C.",pl:"<b>Skupione stany powietrza, gałąź lodowa poniżej zera.</b> Model używa jednego mieszanego stanu powietrza w pomieszczeniu, jednego współczynnika obejścia wymiennika i jednej skuteczności wirnika; rozwarstwienie, krótkie spięcie nawiewu z wywiewem oraz lokalne obszary wilgoci wymagają pomiarów lub modelu przepływu. Poniżej 0 °C ciśnienie nasycenia jest liczone nad lodem, dlatego każdy punkt rosy pokazany poniżej zera jest w istocie punktem szronu — względem przechłodzonej wody to samo powietrze przy −40 °C zawierałoby około 48 % więcej wilgoci."},
li3:{en:"<b>Idealised machines.</b> Chiller and heat pump follow a fraction of Carnot efficiency, not a manufacturer curve; part load, defrost recovery, oil management and refrigerant selection are not modelled.",uk:"<b>Ідеалізовані машини.</b> Холодильна машина й тепловий насос узяті як частка ефективності Карно, а не за кривою виробника; часткове навантаження, відновлення після відтавання, оливообіг і вибір холодоагенту не моделюються.",de:"<b>Idealisierte Maschinen.</b> Kältemaschine und Wärmepumpe folgen einem Anteil des Carnot-Wirkungsgrads, keiner Herstellerkennlinie; Teillast, Abtauerholung, Ölhaushalt und Kältemittelwahl fehlen.",nl:"<b>Geïdealiseerde machines.</b> Koelmachine en warmtepomp volgen een deel van het Carnot-rendement, geen fabrikantscurve; deellast, herstel na ontdooien, oliehuishouding en koudemiddelkeuze ontbreken.",fr:"<b>Machines idéalisées.</b> Groupe froid et pompe à chaleur suivent une fraction du rendement de Carnot, pas une courbe constructeur; charge partielle, reprise après dégivrage, huile et choix du fluide sont absents.",es:"<b>Máquinas idealizadas.</b> Enfriadora y bomba de calor siguen una fracción del rendimiento de Carnot, no una curva de fabricante; carga parcial, recuperación tras desescarche, aceite y elección de refrigerante no se modelan.",pl:"<b>Wyidealizowane maszyny.</b> Agregat chłodniczy i pompa ciepła mają COP wyznaczany jako stały udział wartości odwracalnej (Carnota), a nie z charakterystyki producenta; nie modeluje się pracy przy częściowym obciążeniu, odzysku ciepła z odszraniania, gospodarki olejowej ani doboru czynnika chłodniczego."},
li4:{en:"<b>Rotor model is a sorption proxy.</b> The attainable floor is tied to regeneration temperature by an empirical line, not by an isotherm of a named desiccant; carry-over, purge and rotor speed are single lumped fractions.",uk:"<b>Модель ротора — сорбційне наближення.</b> Досяжна межа пов’язана з температурою регенерації емпіричною прямою, а не ізотермою конкретного сорбенту; перенос, продувка й швидкість обертання — узагальнені частки.",de:"<b>Rotormodell ist ein Sorptionsersatz.</b> Die erreichbare Grenze folgt einer empirischen Geraden über der Regenerationstemperatur, nicht einer Isotherme eines benannten Sorbens; Übertrag, Spülung und Drehzahl sind Pauschalanteile.",nl:"<b>Rotormodel is een sorptiebenadering.</b> De haalbare ondergrens volgt een empirische lijn met de regeneratietemperatuur, geen isotherm van een benoemd sorbens; overdracht, spoeling en toerental zijn forfaitair.",fr:"<b>Modèle de rotor approché.</b> Le plancher atteignable suit une droite empirique de la température de régénération, non l’isotherme d’un dessiccant nommé; report, purge et vitesse sont forfaitaires.",es:"<b>Modelo de rotor aproximado.</b> El límite alcanzable sigue una recta empírica con la temperatura de regeneración, no la isoterma de un desecante concreto; arrastre, purga y velocidad son globales.",pl:"<b>Model wirnika jest zastępczym modelem sorpcji.</b> Minimalny osiągalny punkt rosy jest powiązany z temperaturą regeneracji zależnością empiryczną, a nie izotermą konkretnego sorbentu; przenoszenie wilgoci, przedmuch i prędkość wirnika są opisane pojedynczymi parametrami skupionymi."},
li5:{en:"<b>Energy is site energy.</b> Electricity and heat are added kilowatt for kilowatt; primary-energy factors, tariffs, emissions and simultaneity of heat recovery are not weighted.",uk:"<b>Енергія — кінцева на об’єкті.</b> Електрику й теплоту складено кіловат до кіловата; коефіцієнти первинної енергії, тарифи, викиди та одночасність утилізації не враховано.",de:"<b>Energie ist Endenergie am Standort.</b> Strom und Wärme werden Kilowatt für Kilowatt addiert; Primärenergiefaktoren, Tarife, Emissionen und Gleichzeitigkeit der Rückgewinnung fehlen.",nl:"<b>Energie is eindenergie.</b> Elektriciteit en warmte worden kilowatt voor kilowatt opgeteld; primaire-energiefactoren, tarieven, emissies en gelijktijdigheid van terugwinning ontbreken.",fr:"<b>Énergie finale sur site.</b> Électricité et chaleur sont additionnées kilowatt pour kilowatt; facteurs d’énergie primaire, tarifs, émissions et simultanéité de la récupération ne sont pas pondérés.",es:"<b>Energía final en sitio.</b> Electricidad y calor se suman kilovatio a kilovatio; factores de energía primaria, tarifas, emisiones y simultaneidad de la recuperación no se ponderan.",pl:"<b>Energia oznacza energię końcową na obiekcie.</b> Energia elektryczna i ciepło są sumowane wprost w kilowatach; nie uwzględnia się współczynników energii pierwotnej, taryf, emisji ani jednoczesności odzysku ciepła."},
li6:{en:"<b>Sizing and comparison, not compliance.</b> Refrigerant law, pressure equipment rules, explosion protection, hygiene and product qualification are outside this tool and stay with the project.",uk:"<b>Для добору й порівняння, не для підтвердження відповідності.</b> Законодавство про холодоагенти, правила щодо обладнання під тиском, вибухозахист, гігієна та кваліфікація продукту лишаються за проєктом.",de:"<b>Auslegung und Vergleich, kein Konformitätsnachweis.</b> Kältemittelrecht, Druckgeräteregeln, Explosionsschutz, Hygiene und Produktqualifizierung bleiben Sache des Projekts.",nl:"<b>Dimensionering en vergelijking, geen conformiteit.</b> Koudemiddelwetgeving, drukapparatuurregels, explosieveiligheid, hygiëne en productkwalificatie blijven bij het project.",fr:"<b>Dimensionnement et comparaison, non conformité.</b> Droit des fluides frigorigènes, équipements sous pression, protection contre les explosions, hygiène et qualification produit restent au projet.",es:"<b>Dimensionado y comparación, no conformidad.</b> Legislación de refrigerantes, equipos a presión, protección contra explosiones, higiene y cualificación del producto quedan en el proyecto.",pl:"<b>Dobór i porównanie, nie ocena zgodności.</b> Przepisy dotyczące czynników chłodniczych i urządzeń ciśnieniowych, ochrona przeciwwybuchowa, higiena oraz kwalifikacja produktu pozostają poza zakresem tego narzędzia i muszą być rozpatrywane w projekcie."}

sb_leg:{en:"The five categories — select one to read what it means and what force it has.",uk:"П’ять категорій — виберіть одну, щоб прочитати її значення та силу.",de:"Die fünf Kategorien — eine auswählen, um Bedeutung und Verbindlichkeit zu lesen.",nl:"De vijf categorieën — kies er een om betekenis en gewicht te lezen.",fr:"Les cinq catégories — choisissez-en une pour lire sa portée et sa force.",es:"Las cinco categorías — elija una para leer su significado y su fuerza.",pl:"Pięć kategorii — wybierz jedną, aby przeczytać, co oznacza i jaką ma moc."},
cx_law:{en:"Mandatory law. A legal requirement in force: it is not negotiable, it is not a recommendation, and no calculation in this tool sets it aside. What it means for a given project is decided by the applicable text and the competent authority, not here.",uk:"Обовʼязкове право. Чинна юридична вимога: вона не обговорюється, не є рекомендацією, і жоден розрахунок у цьому інструменті її не скасовує. Що вона означає для конкретного проєкту, вирішують чинний текст і компетентний орган, а не ця сторінка.",de:"Zwingendes Recht. Eine geltende rechtliche Anforderung: nicht verhandelbar, keine Empfehlung, und keine Rechnung in diesem Werkzeug hebt sie auf. Was sie für ein konkretes Projekt bedeutet, entscheiden der geltende Text und die zuständige Behörde.",nl:"Dwingend recht. Een geldende juridische eis: niet onderhandelbaar, geen aanbeveling, en geen enkele berekening in dit hulpmiddel zet hem opzij. Wat hij voor een concreet project betekent, bepalen de geldende tekst en het bevoegd gezag.",fr:"Droit contraignant. Une exigence juridique en vigueur: non négociable, ce n’est pas une recommandation, et aucun calcul de cet outil ne l’écarte. Ce qu’elle implique pour un projet donné est décidé par le texte applicable et l’autorité compétente.",es:"Derecho vinculante. Un requisito jurídico en vigor: no es negociable, no es una recomendación y ningún cálculo de esta herramienta lo deja de lado. Lo que implica en un proyecto concreto lo deciden el texto aplicable y la autoridad competente.",pl:"Obowiązujące prawo. Obowiązujący wymóg prawny: nie podlega negocjacjom, nie jest zaleceniem i żadne obliczenia w tym narzędziu go nie uchylają. O tym, co oznacza dla danego projektu, decydują obowiązujące przepisy i właściwy organ, a nie tutaj."},
cx_standard:{en:"Standard. A published consensus document. It carries weight and is widely referenced, but it becomes obligatory only where a contract or a legal text makes it so; editions differ, and the edition that applies has to be checked.",uk:"Стандарт. Опублікований документ консенсусу. Він має вагу й на нього широко посилаються, але обов’язковим стає лише там, де так каже договір або правовий акт; редакції різняться, тож чинну редакцію треба перевіряти.",de:"Norm. Ein veröffentlichtes Konsensdokument. Es hat Gewicht und wird breit zitiert, verbindlich wird es aber erst durch Vertrag oder Rechtstext; die Ausgaben unterscheiden sich, die geltende ist zu prüfen.",nl:"Norm. Een gepubliceerd consensusdocument. Het heeft gewicht en wordt breed aangehaald, maar het verplicht pas waar een contract of wettekst dat bepaalt; edities verschillen en de geldende editie moet worden nagegaan.",fr:"Norme. Un document de consensus publié. Il fait autorité et est largement cité, mais il n’oblige que si un contrat ou un texte juridique le rend obligatoire; les éditions diffèrent et celle qui s’applique doit être vérifiée.",es:"Norma. Un documento de consenso publicado. Tiene peso y se cita ampliamente, pero solo obliga cuando un contrato o un texto legal lo hace obligatorio; las ediciones difieren y hay que comprobar la que aplica.",pl:"Norma. Opublikowany dokument uzgodniony w drodze konsensusu. Ma istotne znaczenie i jest powszechnie przywoływany, ale staje się obowiązujący tylko wtedy, gdy wynika to z umowy lub przepisu prawa; wydania różnią się, dlatego należy sprawdzić, które wydanie ma zastosowanie."},
cx_guidance:{en:"Industry guidance. Good practice written down by a trade body or a manufacturer. It records what usually works, it is not a legal duty, and a project may depart from it with a reason stated in writing.",uk:"Галузева настанова. Добра практика, записана галузевим об’єднанням або виробником. Вона фіксує те, що зазвичай працює, не є юридичним обов’язком, і проєкт може від неї відступити з письмово наведеною причиною.",de:"Branchenleitfaden. Gute Praxis, festgehalten von einem Verband oder Hersteller. Sie hält fest, was üblicherweise funktioniert, ist keine Rechtspflicht, und ein Projekt darf mit schriftlicher Begründung davon abweichen.",nl:"Brancheleidraad. Goede praktijk, vastgelegd door een branchevereniging of fabrikant. Zij legt vast wat gewoonlijk werkt, is geen wettelijke plicht, en een project mag ervan afwijken met een schriftelijk vastgelegde reden.",fr:"Guide sectoriel. Bonne pratique consignée par une organisation professionnelle ou un fabricant. Il enregistre ce qui fonctionne d’ordinaire, n’est pas une obligation juridique, et un projet peut s’en écarter avec un motif écrit.",es:"Guía sectorial. Buena práctica recogida por una asociación profesional o un fabricante. Registra lo que suele funcionar, no es una obligación jurídica, y un proyecto puede apartarse de ella con un motivo escrito.",pl:"Wskazówki branżowe. Dobre praktyki spisane przez organizację branżową lub producenta. Rejestrują one to, co zazwyczaj się sprawdza, nie stanowią obowiązku prawnego, a projekt może od nich odstąpić, podając powód na piśmie."},
cx_method:{en:"Calculation method. A formula or correlation with a stated range of validity. Inside that range it holds; outside it says nothing. What it delivers is a computed number, never a permission and never a design value.",uk:"Розрахункова методика. Формула або кореляція з визначеним діапазоном застосовності. У цьому діапазоні вона правильна, поза ним не каже нічого. Її результат — обчислене число, а не дозвіл і не проєктне значення.",de:"Berechnungsverfahren. Eine Formel oder Korrelation mit angegebenem Gültigkeitsbereich. Innerhalb gilt sie, außerhalb sagt sie nichts. Was sie liefert, ist eine berechnete Zahl, keine Genehmigung und kein Auslegungswert.",nl:"Rekenmethode. Een formule of correlatie met een opgegeven geldigheidsbereik. Binnen dat bereik klopt zij, daarbuiten zegt zij niets. Wat zij levert is een berekend getal, geen toestemming en geen ontwerpwaarde.",fr:"Méthode de calcul. Une formule ou corrélation avec un domaine de validité annoncé. Dans ce domaine elle tient; au-delà elle ne dit rien. Ce qu’elle produit est un nombre calculé, jamais une autorisation ni une valeur de projet.",es:"Método de cálculo. Una fórmula o correlación con un dominio de validez declarado. Dentro de ese dominio se sostiene; fuera no dice nada. Lo que entrega es un número calculado, nunca un permiso ni un valor de proyecto.",pl:"Metoda obliczeniowa. Wzór lub korelacja o określonym zakresie ważności. Wewnątrz tego zakresu obowiązuje; poza nim nic nie mówi. Dostarcza jedynie obliczoną liczbę, nigdy pozwolenia i nigdy wartości projektowej."},
cx_rule:{en:"Rule of thumb. A round figure that experience keeps producing. It is useful for a first pass and as a sanity check, it carries no authority at all, and it has to be replaced by a measurement or a manufacturer figure before anything is ordered.",uk:"Емпіричне правило. Округлене число, яке раз у раз дає досвід. Воно корисне для першої прикидки й для перевірки на здоровий глузд, не має жодної сили, і його треба замінити вимірюванням або даними виробника перед будь-яким замовленням.",de:"Faustregel. Eine runde Zahl, die die Praxis immer wieder liefert. Sie taugt für den ersten Überschlag und zur Plausibilitätsprüfung, hat keinerlei Verbindlichkeit und ist vor jeder Bestellung durch eine Messung oder eine Herstellerangabe zu ersetzen.",nl:"Vuistregel. Een rond getal dat de praktijk telkens weer oplevert. Het is bruikbaar voor een eerste schatting en als plausibiliteitstoets, heeft geen enkel gezag en moet vóór elke bestelling worden vervangen door een meting of een fabrieksopgave.",fr:"Règle empirique. Un ordre de grandeur que l’expérience redonne sans cesse. Utile pour un premier calcul et comme vérification de bon sens, sans aucune autorité, à remplacer par une mesure ou une donnée constructeur avant toute commande.",es:"Regla empírica. Una cifra redonda que la experiencia repite. Sirve para un primer tanteo y como comprobación de sentido común, no tiene autoridad alguna y debe sustituirse por una medición o un dato de fabricante antes de cualquier pedido.",pl:"Reguła praktyczna. Zaokrąglona wartość wynikająca z doświadczenia. Jest użyteczna do pierwszego oszacowania i kontroli zdroworozsądkowej, ale nie ma mocy normatywnej i przed zamówieniem urządzeń musi zostać zastąpiona wynikiem pomiaru albo wartością producenta."},
cx_mix:{en:"Why the categories are never merged: they do not carry the same force. A legal requirement has to be met; a standard binds only where it is invoked; guidance is advice; a calculation method holds only inside its range; a rule of thumb is a guess. Merge them and a guess starts to look like a duty while a duty starts to look negotiable — so every default here shows its own category and keeps it.",uk:"Чому категорії ніколи не зливають: вони мають різну силу. Вимогу закону треба виконати; стандарт зобов’язує лише там, де на нього посилаються; настанова — це порада; розрахункова методика чинна лише в своєму діапазоні; емпіричне правило — це припущення. Якщо їх злити, припущення починає виглядати як обов’язок, а обов’язок — як предмет торгу, тому кожен типовий коефіцієнт тут несе власну категорію.",de:"Warum die Kategorien nie vermischt werden: sie haben nicht dieselbe Kraft. Eine Rechtspflicht ist zu erfüllen; eine Norm bindet nur, wo sie in Bezug genommen wird; ein Branchenleitfaden ist ein Rat; ein Berechnungsverfahren gilt nur in seinem Bereich; eine Faustregel ist eine Schätzung. Vermischt man sie, sieht eine Schätzung wie eine Pflicht aus und eine Pflicht wie Verhandlungssache — deshalb trägt jeder Vorgabewert hier seine eigene Kategorie.",nl:"Waarom de categorieën nooit worden samengevoegd: zij hebben niet dezelfde kracht. Een wettelijke eis moet worden gehaald; een norm bindt alleen waar zij wordt aangeroepen; een brancheleidraad is advies; een rekenmethode geldt alleen binnen haar bereik; een vuistregel is een schatting. Voeg je ze samen, dan lijkt een schatting een plicht en een plicht onderhandelbaar — daarom draagt elke standaardwaarde hier haar eigen categorie.",fr:"Pourquoi les catégories ne sont jamais fondues: elles n’ont pas la même force. Une obligation légale doit être satisfaite; une norme n’oblige que là où elle est invoquée; un guide est un conseil; une méthode de calcul ne vaut que dans son domaine; une règle empirique est une estimation. En les fondant, une estimation prend l’allure d’une obligation et une obligation celle d’un sujet de négociation — chaque valeur par défaut porte donc ici sa propre catégorie.",es:"Por qué las categorías no se funden nunca: no tienen la misma fuerza. Una obligación legal debe cumplirse; una norma solo obliga donde se invoca; una guía es un consejo; un método de cálculo solo vale dentro de su dominio; una regla empírica es una estimación. Al fundirlas, una estimación parece una obligación y una obligación parece negociable — por eso cada valor por defecto lleva aquí su propia categoría.",pl:"Dlaczego kategorie nie są łączone: mają różną moc. Wymóg prawny trzeba spełnić; norma wiąże tylko wtedy, gdy została przywołana; wytyczne są zaleceniem; metoda obliczeniowa jest ważna wyłącznie w swoim zakresie; reguła praktyczna jest przybliżeniem. Po ich połączeniu przybliżenie zaczyna wyglądać jak obowiązek, a obowiązek jak coś negocjowalnego — dlatego każda wartość domyślna zachowuje własną kategorię."},
sx_confirmed:{en:"Confirmed: the value is reproduced here from its own formula or definition and is re-checked against reference points at every recalculation.",uk:"Підтверджено: величина відтворена тут із власної формули або визначення й звіряється з контрольними точками при кожному перерахунку.",de:"Bestätigt: der Wert wird hier aus seiner eigenen Formel oder Definition reproduziert und bei jeder Neuberechnung gegen Referenzpunkte geprüft.",nl:"Bevestigd: de waarde wordt hier uit de eigen formule of definitie gereproduceerd en bij elke herberekening tegen referentiepunten getoetst.",fr:"Confirmé: la valeur est reproduite ici à partir de sa propre formule ou définition et recontrôlée sur des points de référence à chaque recalcul.",es:"Confirmado: el valor se reproduce aquí a partir de su propia fórmula o definición y se contrasta con puntos de referencia en cada recálculo.",pl:"Potwierdzone: wartość jest tutaj odtwarzana bezpośrednio z właściwego wzoru lub definicji i przy każdym przeliczeniu ponownie sprawdzana względem punktów odniesienia."},
sx_assumed:{en:"Applicable with assumptions: the value is a defensible default for this model, but it depends on the case and has to be replaced by a project figure before it is used for anything binding.",uk:"Застосовно з припущеннями: величина є прийнятним типовим значенням для цієї моделі, але залежить від випадку й має бути замінена проєктним значенням, перш ніж її використають для чогось зобов’язального.",de:"Anwendbar mit Annahmen: der Wert ist ein vertretbarer Vorgabewert für dieses Modell, hängt aber vom Fall ab und ist vor jeder verbindlichen Verwendung durch eine Projektangabe zu ersetzen.",nl:"Toepasbaar met aannames: de waarde is een verdedigbare standaardwaarde voor dit model, maar hangt van het geval af en moet vóór elk bindend gebruik door een projectwaarde worden vervangen.",fr:"Applicable sous hypothèses: la valeur est un défaut défendable pour ce modèle, mais elle dépend du cas et doit être remplacée par une donnée de projet avant tout usage engageant.",es:"Aplicable con supuestos: el valor es un valor por defecto defendible para este modelo, pero depende del caso y debe sustituirse por un dato de proyecto antes de cualquier uso vinculante.",pl:"Zastosowanie przy założeniach: wartość jest domyślną wartością, którą można bronić w tym modelu, ale zależy od przypadku i musi zostać zastąpiona wartością projektu, zanim zostanie użyta w wiążącym celu."},

/* ---- source-basis register items ---- */
p_pws:{en:"Saturation vapour pressure over water and ice",uk:"Тиск насиченої пари над водою та льодом",de:"Sättigungsdampfdruck über Wasser und Eis",nl:"Verzadigingsdampdruk boven water en ijs",fr:"Pression de vapeur saturante sur eau et glace",es:"Presión de vapor de saturación sobre agua y hielo",pl:"Ciśnienie pary nasyconej nad wodą i lodem"},
t_pws:{en:"Closed-form correlation with separate branches over water and over ice, checked here against reference values at 0, 20, 100 and −40 °C.",uk:"Замкнена кореляція з окремими гілками над водою та льодом, звірена тут з еталонами за 0, 20, 100 і −40 °C.",de:"Geschlossene Korrelation mit getrennten Zweigen über Wasser und Eis, hier gegen Referenzwerte bei 0, 20, 100 und −40 °C geprüft.",nl:"Gesloten correlatie met aparte takken boven water en ijs, hier getoetst aan referentiewaarden bij 0, 20, 100 en −40 °C.",fr:"Corrélation fermée à branches distinctes sur eau et sur glace, vérifiée ici aux valeurs de référence à 0, 20, 100 et −40 °C.",es:"Correlación cerrada con ramas separadas sobre agua y hielo, verificada aquí frente a valores de referencia a 0, 20, 100 y −40 °C.",pl:"Korelacja w formie zamkniętej z oddzielnymi gałęziami nad wodą i nad lodem, sprawdzona tutaj w stosunku do wartości odniesienia w temperaturach 0, 20, 100 i −40 °C."},
p_air:{en:"Property constants of dry air and water vapour",uk:"Сталі властивостей сухого повітря та водяної пари",de:"Stoffkonstanten trockener Luft und von Wasserdampf",nl:"Stofconstanten van droge lucht en waterdamp",fr:"Constantes des propriétés de l’air sec et de la vapeur",es:"Constantes de propiedades del aire seco y el vapor",pl:"Stałe właściwości suchego powietrza i pary wodnej"},
t_air:{en:"Specific heats, gas constant and the mass ratio of water to dry air are taken as standardised values for air of normal composition.",uk:"Питомі теплоємності, газова стала та відношення мас води й сухого повітря взяті як стандартизовані значення для повітря звичайного складу.",de:"Spezifische Wärmen, Gaskonstante und Massenverhältnis Wasser zu trockener Luft sind genormte Werte für Luft normaler Zusammensetzung.",nl:"Soortelijke warmten, gasconstante en de massaverhouding water tot droge lucht zijn genormeerde waarden voor lucht van normale samenstelling.",fr:"Chaleurs massiques, constante des gaz et rapport de masse eau/air sec sont des valeurs normalisées pour un air de composition normale.",es:"Calores específicos, constante de los gases y relación de masas agua/aire seco son valores normalizados para aire de composición normal.",pl:"Ciepła właściwe, stała gazowa i stosunek masy wody do masy suchego powietrza są przyjmowane jako znormalizowane wartości dla powietrza o typowym składzie."},
p_bal:{en:"Steady-state moisture balance of the room",uk:"Стаціонарний баланс вологи приміщення",de:"Stationäre Feuchtebilanz des Raumes",nl:"Stationaire vochtbalans van de ruimte",fr:"Bilan d’humidité en régime permanent",es:"Balance de humedad en régimen estacionario",pl:"Bilans wilgoci w pomieszczeniu w stanie ustalonym"},
t_bal:{en:"Dry-air mass flow times the difference in humidity ratio equals the sum of the internal sources; the same relation sizes the drying time after wet cleaning.",uk:"Масова витрата сухого повітря на різницю вологовмісту дорівнює сумі внутрішніх джерел; те саме співвідношення дає час сушіння після вологого прибирання.",de:"Trockenluftmassenstrom mal Feuchtegraddifferenz gleich Summe der inneren Quellen; dieselbe Beziehung liefert die Trocknungszeit nach Nassreinigung.",nl:"Droge-luchtmassastroom maal het verschil in vochtverhouding is gelijk aan de som van de interne bronnen; dezelfde relatie geeft de droogtijd na nat reinigen.",fr:"Débit massique d’air sec par la différence de teneur en eau égale la somme des sources internes; la même relation donne le temps de séchage après nettoyage humide.",es:"El caudal másico de aire seco por la diferencia de humedad absoluta iguala la suma de las fuentes internas; la misma relación da el tiempo de secado tras limpieza húmeda.",pl:"Strumień masy suchego powietrza pomnożony przez różnicę zawartości wilgoci jest równy sumie źródeł wewnętrznych; ta sama zależność służy do oszacowania czasu osuszania po czyszczeniu na mokro."},
p_pers:{en:"Moisture emission per occupant",uk:"Вологовиділення однієї людини",de:"Feuchteabgabe je Person",nl:"Vochtafgifte per persoon",fr:"Émission d’humidité par personne",es:"Emisión de humedad por ocupante",pl:"Emisja wilgoci na osobę"},
t_pers:{en:"Default for light work in protective clothing. Real emission depends on activity, clothing and the airlock regime and should be measured for a dryroom.",uk:"Типове значення для легкої роботи в захисному одязі. Дійсне виділення залежить від активності, одягу та режиму шлюзів і має бути виміряне.",de:"Vorgabe für leichte Arbeit in Schutzkleidung. Die tatsächliche Abgabe hängt von Tätigkeit, Kleidung und Schleusenregime ab und ist zu messen.",nl:"Standaard voor licht werk in beschermende kleding. De werkelijke afgifte hangt af van activiteit, kleding en sluisregime en moet worden gemeten.",fr:"Valeur par défaut pour un travail léger en tenue de protection. L’émission réelle dépend de l’activité, de la tenue et du régime de sas.",es:"Valor por defecto para trabajo ligero con ropa de protección. La emisión real depende de la actividad, la ropa y el régimen de esclusas.",pl:"Wartość domyślna dla lekkiej pracy w odzieży ochronnej. Rzeczywista emisja zależy od aktywności, odzieży i sposobu użytkowania śluzy; dla suchego pomieszczenia powinna być wyznaczona pomiarem."},
p_door:{en:"Door exchange coefficient",uk:"Коефіцієнт обміну через двері",de:"Türaustauschbeiwert",nl:"Deuruitwisselingscoëfficiënt",fr:"Coefficient d’échange à la porte",es:"Coeficiente de intercambio en puerta",pl:"Współczynnik wymiany przez otwarte drzwi"},
t_door:{en:"Volume exchanged per second and per square metre of open doorway. A single coefficient replaces gravity exchange, traffic, wind and airlock effects; door-use measurements are worth more than a fixed factor.",uk:"Обмінюваний об’єм за секунду на квадратний метр прорізу. Один коефіцієнт замінює гравітаційний обмін, рух персоналу, вітер і дію шлюзу; вимірювання користування дверима цінніші за сталий множник.",de:"Ausgetauschtes Volumen je Sekunde und Quadratmeter Türöffnung. Ein Beiwert ersetzt Dichteaustausch, Verkehr, Wind und Schleusenwirkung; Messungen des Türgebrauchs sind wertvoller.",nl:"Uitgewisseld volume per seconde en per vierkante meter deuropening. Eén coëfficiënt vervangt dichtheidsuitwisseling, verkeer, wind en sluiswerking; metingen van deurgebruik zijn waardevoller.",fr:"Volume échangé par seconde et par mètre carré d’ouverture. Un coefficient unique remplace l’échange gravitaire, le trafic, le vent et le sas; la mesure de l’usage des portes vaut mieux.",es:"Volumen intercambiado por segundo y metro cuadrado de hueco. Un solo coeficiente sustituye al intercambio gravitatorio, tráfico, viento y esclusa; medir el uso de puertas vale más.",pl:"Objętość wymieniana w ciągu sekundy na każdy metr kwadratowy otwartego przejścia. Jeden współczynnik zastępuje wpływ wymiany grawitacyjnej, ruchu osób, wiatru i śluzy; pomiary rzeczywistego użytkowania drzwi są bardziej miarodajne niż stały współczynnik."},
p_bf:{en:"Coil bypass factor",uk:"Коефіцієнт байпасу батареї",de:"Bypassfaktor des Registers",nl:"Bypassfactor van de batterij",fr:"Facteur de contournement de la batterie",es:"Factor de bypass de la batería",pl:"Współczynnik obejścia wymiennika"},
t_bf:{en:"Fraction of air that passes the coil without touching the fin surface. It follows from rows, fin spacing and face velocity and is the reason the leaving state is not exactly saturated.",uk:"Частка повітря, що проходить повз оребрення. Залежить від кількості рядів, кроку ребер і фронтальної швидкості; саме через неї стан на виході не є точно насиченим.",de:"Anteil der Luft, der die Lamellen nicht berührt. Er folgt aus Rohrreihen, Lamellenabstand und Stirnflächengeschwindigkeit und erklärt, warum der Austrittszustand nicht exakt gesättigt ist.",nl:"Deel van de lucht dat de lamellen niet raakt. Volgt uit buisrijen, lamelafstand en frontsnelheid en verklaart waarom de uittredetoestand niet exact verzadigd is.",fr:"Part d’air qui ne touche pas les ailettes. Elle découle du nombre de rangs, du pas d’ailettes et de la vitesse frontale, et explique pourquoi l’état de sortie n’est pas exactement saturé.",es:"Fracción de aire que no toca las aletas. Depende del número de filas, el paso de aleta y la velocidad frontal, y explica que el estado de salida no sea exactamente saturado.",pl:"Udział powietrza przepływającego przez wymiennik bez kontaktu z powierzchnią lamel. Zależy od liczby rzędów, rozstawu lamel i prędkości czołowej; dlatego stan powietrza na wylocie nie leży dokładnie na linii nasycenia."},
p_frost:{en:"Frost-free coil surface limit",uk:"Межа поверхні батареї без обмерзання",de:"Frostfreie Grenze der Registeroberfläche",nl:"Vorstvrije grens van het batterijoppervlak",fr:"Limite hors gel de la surface de batterie",es:"Límite sin escarcha de la superficie de batería",pl:"Minimalna temperatura powierzchni wymiennika bez oszronienia"},
t_frost:{en:"Below the freezing point condensate turns to frost and a single coil cannot run continuously. The default keeps a small margin above zero for control and measurement error.",uk:"Нижче точки замерзання конденсат перетворюється на іній і одна батарея не може працювати безперервно. Типове значення лишає невеликий запас над нулем.",de:"Unter dem Gefrierpunkt gefriert das Kondensat und ein einzelnes Register kann nicht durchlaufen. Die Vorgabe hält einen kleinen Abstand über null.",nl:"Onder het vriespunt bevriest het condensaat en kan één batterij niet continu werken. De standaard houdt een kleine marge boven nul.",fr:"Sous le point de congélation le condensat givre et une batterie unique ne peut fonctionner en continu. La valeur par défaut garde une petite marge au-dessus de zéro.",es:"Bajo el punto de congelación el condensado se convierte en escarcha y una sola batería no puede funcionar en continuo. El valor por defecto guarda un pequeño margen sobre cero.",pl:"Poniżej temperatury zamarzania kondensat zamienia się w szron i pojedynczy wymiennik nie może pracować ciągle. Wartość domyślna zachowuje niewielki margines powyżej 0 °C na potrzeby regulacji i błędu pomiaru."},
p_cop:{en:"Fraction of Carnot efficiency for chiller and heat pump",uk:"Частка ефективності Карно для холодомашини й теплового насоса",de:"Anteil des Carnot-Wirkungsgrads für Kältemaschine und Wärmepumpe",nl:"Aandeel van het Carnot-rendement voor koelmachine en warmtepomp",fr:"Fraction du rendement de Carnot pour groupe froid et pompe à chaleur",es:"Fracción del rendimiento de Carnot para enfriadora y bomba de calor",pl:"Udział sprawności odwracalnej (Carnota) dla agregatu chłodniczego i pompy ciepła"},
t_cop:{en:"The coefficient of performance is built from the evaporating and condensing temperatures times a fixed fraction of the reversible value. It is a placeholder for a manufacturer curve.",uk:"Коефіцієнт перетворення будується з температур випаровування й конденсації, помножених на сталу частку оборотного значення. Це заміна кривої виробника.",de:"Die Leistungszahl entsteht aus Verdampfungs- und Verflüssigungstemperatur mal einem festen Anteil des reversiblen Werts. Sie ersetzt eine Herstellerkennlinie.",nl:"De prestatiecoëfficiënt volgt uit verdampings- en condensatietemperatuur maal een vast deel van de omkeerbare waarde. Het vervangt een fabrikantscurve.",fr:"Le coefficient de performance découle des températures d’évaporation et de condensation multipliées par une fraction fixe de la valeur réversible. Il remplace une courbe constructeur.",es:"El coeficiente de eficiencia surge de las temperaturas de evaporación y condensación por una fracción fija del valor reversible. Sustituye a una curva de fabricante.",pl:"Współczynnik COP jest wyznaczany z temperatur parowania i skraplania jako stały udział wartości odwracalnej. Jest to model zastępczy dla charakterystyki producenta."},
p_rot:{en:"Rotor removal effectiveness",uk:"Ефективність осушення ротора",de:"Entfeuchtungsgrad des Rotors",nl:"Ontvochtigingsrendement van de rotor",fr:"Efficacité d’extraction du rotor",es:"Eficacia de extracción del rotor",pl:"Skuteczność osuszania wirnika"},
t_rot:{en:"Share of the distance between the inlet humidity ratio and the attainable floor that the rotor actually covers in one pass. Deep-drying wheels with a purge sector sit near the upper end.",uk:"Частка відстані між вологовмістом на вході та досяжною межею, яку ротор долає за один прохід. Ротори глибокого осушення з продувним сектором — біля верхньої межі.",de:"Anteil des Abstands zwischen Eintrittsfeuchtegrad und erreichbarer Grenze, den der Rotor in einem Durchgang schafft. Tieftrocknungsräder mit Spülsektor liegen am oberen Ende.",nl:"Deel van de afstand tussen de vochtverhouding bij intrede en de haalbare ondergrens dat de rotor in één doorgang aflegt. Diepdrogende wielen met spoelsector liggen bovenaan.",fr:"Part de l’écart entre la teneur en eau d’entrée et le plancher atteignable que le rotor franchit en un passage. Les roues de séchage profond à secteur de purge sont en haut de plage.",es:"Parte de la distancia entre la humedad absoluta de entrada y el límite alcanzable que el rotor recorre en un paso. Las ruedas de secado profundo con sector de purga están en el extremo alto.",pl:"Udział różnicy między zawartością wilgoci na wlocie a minimalną osiągalną zawartością wilgoci, który wirnik rzeczywiście usuwa w jednym przejściu. Wirniki do głębokiego osuszania z sektorem przedmuchu znajdują się zwykle w górnej części tego zakresu."},
p_treg:{en:"Regeneration temperature and the attainable dew-point floor",uk:"Температура регенерації та досяжна межа точки роси",de:"Regenerationstemperatur und erreichbare Taupunktgrenze",nl:"Regeneratietemperatuur en de haalbare dauwpuntgrens",fr:"Température de régénération et plancher de point de rosée",es:"Temperatura de regeneración y límite de punto de rocío",pl:"Temperatura regeneracji i minimalny osiągalny punkt rosy"},
t_treg:{en:"The driest state a wheel can deliver is tied to how completely the sorbent is dried out; here a straight line from regeneration temperature stands in for a real sorption isotherm.",uk:"Найсухіший стан, який дає ротор, залежить від повноти висушування сорбенту; тут пряма лінія від температури регенерації замінює справжню ізотерму сорбції.",de:"Der trockenste erreichbare Zustand hängt davon ab, wie vollständig das Sorbens ausgetrocknet wird; hier ersetzt eine Gerade über der Regenerationstemperatur eine echte Sorptionsisotherme.",nl:"De droogste toestand die een wiel levert hangt af van hoe volledig het sorbens uitdroogt; hier vervangt een rechte lijn met de regeneratietemperatuur een echte sorptie-isotherm.",fr:"L’état le plus sec délivré dépend du degré de séchage du dessiccant; ici une droite en fonction de la température de régénération remplace une isotherme réelle.",es:"El estado más seco que entrega la rueda depende de cuán completamente se seca el desecante; aquí una recta con la temperatura de regeneración sustituye a una isoterma real.",pl:"Najsuchszy stan, jaki może uzyskać wirnik, zależy od stopnia regeneracji sorbentu; tutaj rzeczywistą izotermę sorpcji zastępuje liniowa zależność od temperatury regeneracji."},
p_freg:{en:"Regeneration air stream: flow window, moisture pickup and purge sector",uk:"Потік повітря регенерації: діапазон витрати, поглинання вологи та продувний сектор",de:"Regenerationsluftstrom: Strombereich, Feuchteaufnahme und Spülsektor",nl:"Regeneratieluchtstroom: debietvenster, vochtopname en spoelsector",fr:"Flux d’air de régénération: plage de débit, reprise d’humidité et secteur de purge",es:"Corriente de aire de regeneración: rango de caudal, captación de humedad y sector de purga",pl:"Strumień powietrza regeneracyjnego: zakres przepływu, przyrost zawartości wilgoci i sektor przedmuchu"},
t_freg:{en:"The regeneration stream is bounded between a minimum and a maximum fraction of the process air, and the purge sector is served from the same stream, so the demand is converted to a total flow before those bounds apply. Both fractions, the assumed pickup and the purge share are typical wheel figures, not data for a named machine.",uk:"Потік регенерації обмежений мінімальною й максимальною частками робочого повітря, а продувний сектор живиться з того самого потоку, тож потребу переводять у повну витрату до застосування меж. Обидві частки, прийняте поглинання й частка продувки — типові значення для ротора, а не дані конкретної машини.",de:"Der Regenerationsstrom ist zwischen einem Mindest- und einem Höchstanteil der Prozessluft begrenzt, und der Spülsektor wird aus demselben Strom versorgt; der Bedarf wird daher vor diesen Grenzen in einen Gesamtstrom umgerechnet. Beide Anteile, die angesetzte Aufnahme und der Spülanteil sind übliche Radwerte, keine Daten einer benannten Maschine.",nl:"De regeneratiestroom ligt tussen een minimaal en een maximaal aandeel van de proceslucht, en de spoelsector wordt uit dezelfde stroom gevoed; de vraag wordt daarom vóór die grenzen naar een totaaldebiet omgerekend. Beide aandelen, de aangenomen opname en het spoelaandeel zijn gebruikelijke wielwaarden, geen gegevens van een benoemde machine.",fr:"Le flux de régénération est borné entre une fraction minimale et une fraction maximale de l’air de process, et le secteur de purge est alimenté par le même flux; la demande est donc convertie en débit total avant l’application de ces bornes. Les deux fractions, la reprise retenue et la part de purge sont des ordres de grandeur usuels, non les données d’une machine nommée.",es:"La corriente de regeneración está acotada entre una fracción mínima y una máxima del aire de proceso, y el sector de purga se alimenta de la misma corriente; por eso la demanda se convierte en caudal total antes de aplicar esos límites. Ambas fracciones, la captación supuesta y la parte de purga son valores habituales de rueda, no datos de una máquina concreta.",pl:"Strumień regeneracyjny jest ograniczony minimalnym i maksymalnym udziałem względem strumienia powietrza procesowego. Sektor przedmuchu jest zasilany z tego samego strumienia, dlatego przed zastosowaniem ograniczeń zapotrzebowanie przelicza się na całkowity przepływ regeneracyjny. Oba udziały, zakładany przyrost zawartości wilgoci i udział przedmuchu są typowymi wartościami dla wirników, a nie danymi konkretnego urządzenia."},
p_dts:{en:"Safety margin against surface condensation",uk:"Запас проти конденсації на поверхнях",de:"Sicherheitsabstand gegen Oberflächenkondensation",nl:"Veiligheidsmarge tegen oppervlaktecondensatie",fr:"Marge de sécurité contre la condensation superficielle",es:"Margen de seguridad frente a condensación superficial",pl:"Margines bezpieczeństwa przed kondensacją powierzchniową"},
t_dts:{en:"The surface must stay above the dew point by this margin, which absorbs sensor error, thermal bridges, still air in corners and load swings. A mean room state is not proof.",uk:"Поверхня має бути вищою за точку роси на цей запас, який поглинає похибку датчиків, містки холоду, застій повітря в кутах і коливання навантаження. Середній стан приміщення не є доказом.",de:"Die Oberfläche muss um diesen Abstand über dem Taupunkt bleiben; er deckt Messfehler, Wärmebrücken, ruhende Luft in Ecken und Lastwechsel ab. Ein Mittelwert des Raumes ist kein Nachweis.",nl:"Het oppervlak moet met deze marge boven het dauwpunt blijven; die dekt meetfout, koudebruggen, stilstaande lucht in hoeken en lastwisseling. Een gemiddelde ruimtetoestand is geen bewijs.",fr:"La surface doit rester au-dessus du point de rosée de cette marge, qui absorbe l’erreur de mesure, les ponts thermiques, l’air mort dans les angles et les variations de charge.",es:"La superficie debe mantenerse sobre el punto de rocío con este margen, que absorbe error de medida, puentes térmicos, aire en calma en esquinas y variaciones de carga.",pl:"Powierzchnia musi utrzymywać się powyżej punktu rosy o ten margines, co kompensuje błędy czujnika, mostki termiczne, zastałe powietrze w narożnikach i wahania obciążenia. Średni stan pomieszczenia nie jest dowodem."},
p_ref:{en:"Refrigerant choice for the low-temperature circuit",uk:"Вибір холодоагенту для низькотемпературного контуру",de:"Kältemittelwahl für den Tieftemperaturkreis",nl:"Koudemiddelkeuze voor de lagetemperatuurkring",fr:"Choix du fluide frigorigène du circuit basse température",es:"Elección del refrigerante del circuito de baja temperatura",pl:"Wybór czynnika chłodniczego dla obwodu niskotemperaturowego"},
t_ref:{en:"Fluorinated-gas legislation, safety classes and pressure-equipment duties restrict what may be used, and deep evaporating temperatures narrow the field further. This tool selects no refrigerant and proves no compliance.",uk:"Законодавство про фторовані гази, класи безпеки та вимоги до обладнання під тиском обмежують вибір, а глибокі температури випаровування звужують його ще більше. Цей інструмент не добирає холодоагент і нічого не підтверджує.",de:"Recht über fluorierte Gase, Sicherheitsklassen und Druckgerätepflichten schränken die Auswahl ein, tiefe Verdampfungstemperaturen weiter. Dieses Werkzeug wählt kein Kältemittel und weist keine Konformität nach.",nl:"Wetgeving over gefluoreerde gassen, veiligheidsklassen en drukapparatuurplichten beperken de keuze, diepe verdampingstemperaturen nog verder. Dit hulpmiddel kiest geen koudemiddel en bewijst geen conformiteit.",fr:"La législation sur les gaz fluorés, les classes de sécurité et les obligations sur les équipements sous pression restreignent le choix, et les basses températures d’évaporation le réduisent encore. Cet outil ne choisit aucun fluide.",es:"La legislación sobre gases fluorados, las clases de seguridad y las obligaciones de equipos a presión restringen la elección, y las bajas temperaturas de evaporación la estrechan más. Esta herramienta no elige refrigerante.",pl:"Przepisy dotyczące fluorowanych gazów cieplarnianych, klasy bezpieczeństwa i wymagania dla urządzeń ciśnieniowych ograniczają dopuszczalne rozwiązania, a bardzo niskie temperatury parowania dodatkowo zawężają wybór. To narzędzie nie dobiera czynnika chłodniczego ani nie potwierdza zgodności z przepisami."},
p_ice:{en:"Ice allowance per coil and defrost duration",uk:"Допустима маса льоду та тривалість відтавання",de:"Zulässige Eismasse je Register und Abtaudauer",nl:"Toegestane ijsmassa per batterij en ontdooiduur",fr:"Masse de glace admise par batterie et durée de dégivrage",es:"Masa de hielo admitida por batería y duración del desescarche",pl:"Dopuszczalna masa lodu na wymiennik i czas odszraniania"},
t_ice:{en:"The switch-over follows pressure drop, leaving dew point, coil temperature and time since the last defrost. A fixed clock may serve as an upper bound but does not react to real frost build-up.",uk:"Перемикання йде за втратою тиску, точкою роси на виході, температурою батареї та часом від останнього відтавання. Стала витримка може бути лише верхньою межею.",de:"Die Umschaltung folgt Druckverlust, Austrittstaupunkt, Registertemperatur und Zeit seit dem letzten Abtauen. Eine feste Uhr taugt höchstens als Obergrenze.",nl:"De omschakeling volgt drukval, uittredend dauwpunt, batterijtemperatuur en tijd sinds de laatste ontdooiing. Een vaste klok dient hooguit als bovengrens.",fr:"Le basculement suit la perte de charge, le point de rosée de sortie, la température de batterie et le temps depuis le dernier dégivrage. Une horloge fixe n’est qu’une borne supérieure.",es:"La conmutación sigue la pérdida de carga, el punto de rocío de salida, la temperatura de batería y el tiempo desde el último desescarche. Un reloj fijo solo sirve de cota superior.",pl:"Przełączenie następuje po spadku ciśnienia, punkcie rosy, temperaturze wężownicy i czasie od ostatniego odszraniania. Stały zegar może służyć jako górna granica, ale nie reaguje na rzeczywiste narastanie szronu."},

lg_room:{en:"Room and mixed inlet state",uk:"Стан приміщення та суміші на вході",de:"Raum- und Mischzustand am Eintritt",nl:"Ruimte- en mengtoestand bij intrede",fr:"État du local et du mélange d’entrée",es:"Estado del local y de la mezcla de entrada",pl:"Stan pomieszczenia i stan mieszaniny na wlocie"},
lg_tgt:{en:"Required supply state",uk:"Потрібний стан припливу",de:"Geforderter Zuluftzustand",nl:"Vereiste toevoertoestand",fr:"État de soufflage requis",es:"Estado de impulsión requerido",pl:"Wymagany stan nawiewu"},
n_psy:{en:"Each path starts at the mixed inlet state and ends at the supply state the room balance demands. The cooling paths run down the saturation line and back up at constant humidity ratio; the rotor path runs up and to the left at nearly constant enthalpy and is then cooled back to room temperature.",uk:"Кожен тракт починається зі стану суміші на вході й закінчується станом припливу, який вимагає баланс приміщення. Тракти охолодження йдуть униз лінією насичення й повертаються вгору за сталого вологовмісту; тракт ротора йде вгору і вліво майже за сталої ентальпії, а потім охолоджується до температури приміщення.",de:"Jeder Weg beginnt im Mischzustand am Eintritt und endet im Zuluftzustand, den die Raumbilanz verlangt. Die Kühlwege laufen die Sättigungslinie hinab und bei konstantem Feuchtegrad wieder hinauf; der Rotorweg läuft nahezu isenthalp nach oben links und wird danach auf Raumtemperatur zurückgekühlt.",nl:"Elk traject begint in de mengtoestand bij intrede en eindigt in de toevoertoestand die de ruimtebalans eist. De koeltrajecten lopen langs de verzadigingslijn omlaag en bij constante vochtverhouding weer omhoog; het rotortraject loopt bijna isenthalp naar linksboven en wordt daarna teruggekoeld.",fr:"Chaque trajet part de l’état de mélange d’entrée et finit à l’état de soufflage exigé par le bilan du local. Les trajets de refroidissement descendent la courbe de saturation puis remontent à teneur en eau constante; le trajet du rotor monte vers la gauche presque à enthalpie constante avant d’être refroidi.",es:"Cada trayecto parte del estado de mezcla de entrada y acaba en el estado de impulsión que exige el balance del local. Los trayectos de enfriamiento bajan por la línea de saturación y suben a humedad absoluta constante; el del rotor sube hacia la izquierda casi a entalpía constante y luego se enfría.",pl:"Każdy przebieg zaczyna się od stanu mieszaniny na wlocie i kończy w stanie nawiewu wymaganym przez bilans wilgoci w pomieszczeniu. Procesy chłodnicze biegną w dół po linii nasycenia, a następnie w górę przy stałej zawartości wilgoci; proces wirnikowy biegnie w górę i w lewo przy niemal stałej entalpii, po czym powietrze jest chłodzone do temperatury pomieszczenia."},
n_ice:{en:"Convention below zero: the saturation pressure is taken over ice, so every dew point on this page — required, supply and attainable — is a frost point below 0 °C, the temperature at which frost forms on a surface. Over supercooled water the same air would show a higher humidity ratio; at −40 °C the difference in the moisture load of a dryroom is about 48 %. Check which of the two the specification means.",uk:"Домовленість нижче нуля: тиск насичення береться над льодом, тож кожна точка роси на цій сторінці — потрібна, припливу та досяжна — нижче 0 °C є точкою інею, тобто температурою, за якої на поверхні утворюється іній. Над переохолодженою водою те саме повітря мало б більший вологовміст; за −40 °C різниця у вологонадходженні сухої кімнати становить близько 48 %. Перевірте, що саме має на увазі завдання.",de:"Konvention unter null: der Sättigungsdruck wird über Eis genommen, deshalb ist jeder Taupunkt auf dieser Seite — gefordert, Zuluft und erreichbar — unterhalb 0 °C ein Reifpunkt, also die Temperatur, bei der sich Reif auf einer Oberfläche bildet. Über unterkühltem Wasser zeigte dieselbe Luft einen höheren Feuchtegrad; bei −40 °C beträgt der Unterschied in der Feuchtelast eines Trockenraums rund 48 %. Prüfen Sie, welche der beiden das Leistungsverzeichnis meint.",nl:"Afspraak onder nul: de verzadigingsdruk wordt boven ijs genomen, dus elk dauwpunt op deze pagina — vereist, toevoer en haalbaar — is onder 0 °C een rijppunt, de temperatuur waarbij zich rijp op een oppervlak vormt. Boven onderkoeld water zou dezelfde lucht een hogere vochtverhouding tonen; bij −40 °C scheelt dat ongeveer 48 % in de vochtlast van een dryroom. Ga na welke van de twee het bestek bedoelt.",fr:"Convention sous zéro: la pression de saturation est prise au-dessus de la glace, donc tout point de rosée de cette page — requis, soufflage et atteignable — est en dessous de 0 °C un point de givrage, la température à laquelle le givre se forme sur une surface. Au-dessus d’eau surfondue, le même air afficherait une teneur en eau plus élevée; à −40 °C l’écart sur la charge d’humidité d’une salle sèche atteint environ 48 %. Vérifiez laquelle des deux le cahier des charges vise.",es:"Convenio bajo cero: la presión de saturación se toma sobre hielo, de modo que todo punto de rocío de esta página — requerido, de impulsión y alcanzable — es por debajo de 0 °C un punto de escarcha, la temperatura a la que se forma escarcha sobre una superficie. Sobre agua subenfriada el mismo aire mostraría una humedad absoluta mayor; a −40 °C la diferencia en la carga de humedad de una sala seca ronda el 48 %. Compruebe cuál de los dos exige el pliego.",pl:"Konwencja poniżej zera: ciśnienie nasycenia jest liczone nad lodem, dlatego każdy punkt rosy na tej stronie — wymagany, nawiewu i osiągalny — poniżej 0 °C jest w rzeczywistości punktem szronu, czyli temperaturą powstawania szronu na powierzchni. Względem przechłodzonej wody to samo powietrze miałoby większą zawartość wilgoci; przy −40 °C różnica w obciążeniu wilgocią suchego pomieszczenia wynosi około 48 %. Należy sprawdzić, którą definicję przyjmuje specyfikacja."},
n_energy:{en:"Every point on the curves is a full recalculation: lowering the required dew point changes the room humidity ratio, therefore the leakage and door loads, therefore the supply state each method must reach. A curve stops where its physical limit is hit, and the gap that opens on the left is the region where sorption is the only remaining path.",uk:"Кожна точка кривих — повний перерахунок: зниження потрібної точки роси змінює вологовміст у приміщенні, отже надходження через неплотності й двері, отже стан припливу, якого має досягти метод. Крива уривається там, де досягнуто фізичної межі, а розрив ліворуч — це зона, де сорбція лишається єдиним шляхом.",de:"Jeder Kurvenpunkt ist eine vollständige Neurechnung: ein tieferer geforderter Taupunkt ändert den Raumfeuchtegrad, damit Leckage- und Türlasten und damit den Zuluftzustand. Eine Kurve endet an ihrer physikalischen Grenze; die Lücke links ist der Bereich, in dem nur noch Sorption bleibt.",nl:"Elk punt op de curven is een volledige herberekening: een lager gevraagd dauwpunt verandert de vochtverhouding in de ruimte, dus de lek- en deurlasten, dus de toevoertoestand. Een curve stopt bij haar fysische grens; het gat links is het gebied waar alleen sorptie overblijft.",fr:"Chaque point des courbes est un recalcul complet: abaisser le point de rosée requis change la teneur en eau du local, donc les charges de fuite et de porte, donc l’état de soufflage. Une courbe s’arrête à sa limite physique; le vide à gauche est la zone où seule la sorption subsiste.",es:"Cada punto de las curvas es un recálculo completo: bajar el punto de rocío requerido cambia la humedad del local, y con ella las cargas de fugas y puertas, y el estado de impulsión. Una curva termina en su límite físico; el hueco de la izquierda es la zona donde solo queda la sorción.",pl:"Każdy punkt krzywych jest wynikiem pełnego przeliczenia: obniżenie wymaganego punktu rosy zmienia zawartość wilgoci w pomieszczeniu, a przez to obciążenia od nieszczelności i otwierania drzwi oraz wymagany stan nawiewu. Krzywa kończy się po osiągnięciu fizycznego ograniczenia danej metody; obszar po lewej stronie, w którym pozostaje już tylko przebieg sorpcyjny, pokazuje zakres dostępny wyłącznie dla osuszania sorpcyjnego."},
n_sb:{en:"Every default carries one category and one status. Categories are never mixed: a value is either mandatory law, a standard, industry guidance, a calculation method or a rule of thumb. Nothing here is a design value for a project.",uk:"Кожен типовий коефіцієнт має одну категорію й один статус. Категорії не змішуються: значення є або обовʼязковим правом, або стандартом, або галузевою настановою, або розрахунковою методикою, або емпіричним правилом. Жодне з них не є проєктним значенням.",de:"Jeder Vorgabewert trägt eine Kategorie und einen Status. Kategorien werden nicht vermischt: ein Wert ist zwingendes Recht, Norm, Branchenleitfaden, Berechnungsverfahren oder Faustregel. Nichts davon ist ein Projektauslegungswert.",nl:"Elke standaardwaarde draagt één categorie en één status. Categorieën worden niet gemengd: een waarde is dwingend recht, norm, brancheleidraad, rekenmethode of vuistregel. Niets hiervan is een projectontwerpwaarde.",fr:"Chaque valeur par défaut porte une catégorie et un statut. Les catégories ne sont pas mélangées: droit contraignant, norme, guide sectoriel, méthode de calcul ou règle empirique. Rien ici n’est une valeur de projet.",es:"Cada valor por defecto lleva una categoría y un estado. Las categorías no se mezclan: derecho vinculante, norma, guía sectorial, método de cálculo o regla empírica. Nada de esto es un valor de proyecto.",pl:"Każda wartość domyślna ma jedną kategorię i jeden status. Kategorie nie są mieszane: wartość jest albo wymogiem prawa, normą, wytyczną branżową, metodą obliczeniową albo regułą praktyczną. Żadna z tych wartości nie jest automatycznie wartością projektową dla konkretnego projektu."},
disc:{en:"Simplified steady-state engineering model of four dehumidification paths with lumped air states and idealised machines. Use it to compare methods and to see which physical limit bites first, not to size equipment for a contract or to prove compliance.",uk:"Спрощена стаціонарна інженерна модель чотирьох трактів осушення із зосередженими станами повітря та ідеалізованими машинами. Використовуйте для порівняння методів і розуміння, яка фізична межа спрацьовує першою, а не для добору обладнання за контрактом чи підтвердження відповідності.",de:"Vereinfachtes stationäres Ingenieurmodell von vier Entfeuchtungswegen mit konzentrierten Luftzuständen und idealisierten Maschinen. Zum Vergleich der Verfahren und zum Erkennen der zuerst greifenden Grenze, nicht zur vertraglichen Auslegung oder zum Konformitätsnachweis.",nl:"Vereenvoudigd stationair rekenmodel van vier ontvochtigingstrajecten met geconcentreerde luchttoestanden en geïdealiseerde machines. Bedoeld om methoden te vergelijken en te zien welke fysische grens het eerst bijt, niet voor contractuele dimensionering of conformiteit.",fr:"Modèle d’ingénierie simplifié en régime permanent de quatre trajets de déshumidification, à états d’air globalisés et machines idéalisées. Pour comparer les méthodes et voir quelle limite physique agit en premier, non pour dimensionner un marché ni prouver une conformité.",es:"Modelo de ingeniería simplificado en régimen estacionario de cuatro trayectos de deshumidificación, con estados de aire agrupados y máquinas idealizadas. Sirve para comparar métodos y ver qué límite físico actúa primero, no para dimensionar un contrato ni demostrar conformidad.",pl:"Uproszczony inżynierski model stanu ustalonego czterech metod osuszania, ze skupionymi stanami powietrza i wyidealizowanymi maszynami. Służy do porównania metod i wskazania, które ograniczenie fizyczne pojawia się jako pierwsze, a nie do kontraktowego doboru urządzeń ani do wykazywania zgodności."}
});

/* Every separator this page prints comes from the framework's one locale map
   (AGENTS §0.1, _docs/NUMBER-FORMAT.md): nsep holds no separator of its own and

/* ============================================================
   PSYCHROMETRICS  (re-implemented in this file)
   ============================================================ */
const RA=287.042, RATIO=0.621945, CPA=1.006, CPV=1.86, HFG=2501.0;
const CW=4.186, CICE=2.05, HFUS=333.6;

function pws(t){                       // saturation vapour pressure, Pa
  const K=t+273.15;
  if(K<=0) return 1e-9;
  if(t>=0){
    const C8=-5800.2206,C9=1.3914993,C10=-0.048640239,C11=4.1764768e-5,C12=-1.4452093e-8,C13=6.5459673;
    return Math.exp(C8/K+C9+C10*K+C11*K*K+C12*K*K*K+C13*Math.log(K));
  }
  const D1=-5674.5359,D2=6.3925247,D3=-0.009677843,D4=6.2215701e-7,D5=2.0747825e-9,D6=-9.484024e-13,D7=4.1635019;
  return Math.exp(D1/K+D2+D3*K+D4*K*K+D5*K*K*K+D6*K*K*K*K+D7*Math.log(K));
}
function xFromPv(pv,p){ const q=Math.min(Math.max(pv,0),p*0.999999); return RATIO*q/(p-q); }
function pvFromX(x,p){ const q=Math.max(x,0); return p*q/(RATIO+q); }
function satX(t,p){ return xFromPv(Math.min(pws(t),p*0.999),p); }
function tdFromX(x,p){                 // inverse of satX, same saturation branches
  const pv=pvFromX(x,p);
  if(pv<=pws(-100)) return -100;
  if(pv>=pws(100)) return 100;
  let lo=-100,hi=100;
  for(let i=0;i<80;i++){ const mid=0.5*(lo+hi); if(pws(mid)<pv) lo=mid; else hi=mid; }
  return 0.5*(lo+hi);
}
function enth(t,x){ return CPA*t + x*(HFG+CPV*t); }
function tFromHX(h,x){ return (h - HFG*x)/(CPA+CPV*x); }
function rhoDa(t,x,p){ return (p-pvFromX(x,p))/(RA*(t+273.15)); }
function rhFromX(t,x,p){ const s=pws(t); return s<=0?0:pvFromX(x,p)/s; }
