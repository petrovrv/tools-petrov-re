  "summary": {
    "en": "Four dehumidification paths — cooling below the dew point with reheat, freeze-out on two alternating coils, a desiccant rotor with regeneration and purge sector, and a refrigerant heat-pump unit…",
    "uk": "Чотири тракти осушення — охолодження нижче точки роси з підігрівом, виморожування двома батареями по черзі, адсорбційний ротор з регенерацією та продувним сектором і теплонасосний осушувач…",
    "de": "Vier Entfeuchtungswege — Kühlen unter den Taupunkt mit Nacherwärmung, Ausfrieren auf zwei wechselnden Registern, ein Sorptionsrotor mit Regeneration und Spülsektor sowie ein Kältemittel-Wärmepumpengerät…",
    "nl": "Vier ontvochtigingstrajecten — koelen onder het dauwpunt met naverwarming, uitvriezen op twee wisselende batterijen, een adsorptierotor met regeneratie en spoelsector, en een warmtepompontvochtiger…",

    "es": "Cuatro trayectos de deshumidificación — enfriamiento bajo el punto de rocío con post-calentamiento, congelación en dos baterías alternas, rotor desecante con regeneración y sector de purga…",
    "pl": "Cztery ścieżki osuszania — chłodzenie poniżej punktu rosy z ponownym ogrzewaniem, wymrażanie na dwóch wymiennych wężownicach, wirnik osuszacza z sektorem regeneracji i oczyszczania oraz jednostka pompy ciepła czynnika chłodniczego…"

  "description": {
    "en": "Four dehumidification paths — cooling below the dew point with reheat, freeze-out on two alternating coils, a desiccant rotor with regeneration and purge sector, and a refrigerant heat-pump unit — computed in parallel from one moisture balance. The moisture load of the room is built from occupants, product, envelope leakage, door openings and outdoor make-up air, so the supply dew point each method has to reach follows from the numbers rather than from a rule. Every verdict quotes the figure that decides it: the coil surface temperature against the frost limit, the rotor floor against the required dew point, the icing time against the defrost time. A comparison chart plots specific energy per kilogram of water against the required dew point and shows where cooling stops working and sorption is the only remaining path. Below 0 °C the saturation pressure is taken over ice, so every dew point shown below zero is a frost point; a required dew point above the room temperature is refused with an explanation instead of computed, because that room state does not exist.",
    "uk": "Чотири тракти осушення — охолодження нижче точки роси з підігрівом, виморожування двома батареями по черзі, адсорбційний ротор з регенерацією та продувним сектором і теплонасосний осушувач — рахуються паралельно з одного балансу вологи. Вологонадходження складається з людей, продукту, неплотностей оболонки, відкривання дверей і зовнішнього припливу, тож потрібна точка роси припливу випливає з чисел, а не з поради. Кожен вердикт наводить число, яке його вирішує: температуру поверхні батареї проти межі обмерзання, межу ротора проти потрібної точки роси, час обмерзання проти часу відтавання. Порівняльний графік показує питому енергію на кілограм вологи залежно від потрібної точки роси й місце, де охолодження перестає працювати. Нижче 0 °C тиск насичення береться над льодом, тож кожна показана нижче нуля точка роси є точкою інею; потрібна точка роси вище за температуру приміщення відхиляється з поясненням, а не рахується, бо такого стану приміщення не існує.",
    "de": "Vier Entfeuchtungswege — Kühlen unter den Taupunkt mit Nacherwärmung, Ausfrieren auf zwei wechselnden Registern, ein Sorptionsrotor mit Regeneration und Spülsektor sowie ein Kältemittel-Wärmepumpengerät — werden parallel aus einer einzigen Feuchtebilanz gerechnet. Die Feuchtelast entsteht aus Personen, Produkt, Hüllenleckage, Türöffnungen und Außenluftnachspeisung, sodass der geforderte Zulufttaupunkt aus den Zahlen folgt und nicht aus einer Regel. Jedes Urteil nennt die entscheidende Größe: Registeroberfläche gegen Frostgrenze, Rotorgrenze gegen geforderten Taupunkt, Vereisungszeit gegen Abtauzeit. Ein Vergleichsdiagramm zeigt die spezifische Energie je Kilogramm Wasser über dem geforderten Taupunkt und die Stelle, an der Kühlung ausfällt. Unter 0 °C wird der Sättigungsdruck über Eis genommen, jeder unter null gezeigte Taupunkt ist damit ein Reifpunkt; ein geforderter Taupunkt über der Raumtemperatur wird mit Begründung abgelehnt statt gerechnet, weil dieser Raumzustand nicht existiert.",
    "nl": "Vier ontvochtigingstrajecten — koelen onder het dauwpunt met naverwarming, uitvriezen op twee wisselende batterijen, een adsorptierotor met regeneratie en spoelsector, en een warmtepompontvochtiger — worden parallel uit één vochtbalans berekend. De vochtlast wordt opgebouwd uit personen, product, lekkage van de schil, deuropeningen en buitenluchtsuppletie, zodat het vereiste toevoerdauwpunt uit de getallen volgt en niet uit een vuistregel. Elk oordeel noemt het getal dat het bepaalt: batterijoppervlak tegen de vorstgrens, rotorgrens tegen het vereiste dauwpunt, ijstijd tegen ontdooitijd. Een vergelijkingsgrafiek zet de specifieke energie per kilogram water uit tegen het gevraagde dauwpunt en toont waar koelen ophoudt te werken. Onder 0 °C wordt de verzadigingsdruk boven ijs genomen, zodat elk onder nul getoond dauwpunt een rijppunt is; een gevraagd dauwpunt boven de ruimtetemperatuur wordt met uitleg geweigerd in plaats van berekend, omdat die ruimtetoestand niet bestaat.",
    "fr": "Quatre trajets de déshumidification — refroidissement sous le point de rosée avec post-chauffage, givrage sur deux batteries alternées, rotor dessiccant avec régénération et secteur de purge, et déshumidificateur à pompe à chaleur — sont calculés en parallèle à partir d’un seul bilan d’humidité. La charge d’humidité est construite à partir des occupants, du produit, des fuites de l’enveloppe, des ouvertures de porte et de l’air neuf d’appoint: le point de rosée de soufflage requis découle donc des nombres et non d’une règle. Chaque verdict cite la grandeur qui le décide: surface de batterie contre limite de givrage, plancher du rotor contre point de rosée requis, temps de givrage contre temps de dégivrage. Un graphique compare l’énergie spécifique par kilogramme d’eau au point de rosée requis et montre où le refroidissement cesse de fonctionner. Sous 0 °C la pression de saturation est prise au-dessus de la glace: tout point de rosée affiché sous zéro est donc un point de givrage; un point de rosée requis supérieur à la température du local est refusé avec explication au lieu d’être calculé, car cet état de local n’existe pas.",
    "es": "Cuatro trayectos de deshumidificación — enfriamiento bajo el punto de rocío con post-calentamiento, congelación en dos baterías alternas, rotor desecante con regeneración y sector de purga, y deshumidificador de bomba de calor — se calculan en paralelo a partir de un único balance de humedad. La carga de humedad se compone de ocupantes, producto, fugas de la envolvente, aperturas de puerta y aire exterior de aporte, de modo que el punto de rocío de impulsión requerido surge de los números y no de una regla. Cada veredicto cita la magnitud que lo decide: superficie de batería frente al límite de escarcha, límite del rotor frente al punto de rocío requerido, tiempo de escarcha frente al de desescarche. Un gráfico compara la energía específica por kilogramo de agua con el punto de rocío requerido y muestra dónde el enfriamiento deja de funcionar. Bajo 0 °C la presión de saturación se toma sobre hielo, por lo que todo punto de rocío mostrado bajo cero es un punto de escarcha; un punto de rocío requerido superior a la temperatura del local se rechaza con explicación en lugar de calcularse, porque ese estado del local no existe.",
    "pl": "Cztery ścieżki osuszania — chłodzenie poniżej punktu rosy z ponownym nagrzewaniem, wymrażanie na dwóch naprzemiennych wężownicach, wirnik osuszacza z sektorem regeneracji i przedmuchu oraz jednostka pompy ciepła czynnika chłodniczego — obliczane równolegle z jednego bilansu wilgoci. Obciążenie wilgocią pomieszczenia jest zbudowane z osób, produktu, nieszczelności powłoki, otworów drzwiowych i zewnętrznego powietrza uzupełniającego, więc punkt rosy zasilania, który każda metoda musi osiągnąć, wynika z liczb, a nie z reguły. Każdy werdykt cytuje liczbę, która go decyduje: temperatura powierzchni wężownicy w stosunku do limitu szronu, podłoga wirnika w stosunku do wymaganego punktu rosy, czas oblodzenia w stosunku do czasu odszraniania. Wykres porównawczy przedstawia energię właściwą na kilogram wody w stosunku do wymaganego punktu rosy i pokazuje, gdzie chłodzenie przestaje działać, a sorpcja jest jedyną pozostałą ścieżką. Poniżej 0 °C ciśnienie nasycenia jest mierzone nad lodem, więc każdy punkt rosy pokazany poniżej zera jest punktem szronu; wymagany punkt rosy powyżej temperatury pokojowej jest odrzucany i zamiast obliczany podawany jest opis, ponieważ taki stan pokojowy nie istnieje."
  },

  "limitations": {
    "en": "Steady-state, lumped-state model of four dehumidification paths: one mixed room state, one coil bypass factor and one rotor effectiveness; chiller and heat pump follow a fraction of Carnot efficiency instead of manufacturer curves, and the rotor floor follows an empirical line in regeneration temperature rather than a sorption isotherm. The wet-coil duty carries the enthalpy of the condensate, and of the frost below 0 °C, but fan power is charged as electricity without being added to the air enthalpy. Specific energy is site energy per kilogram of water: the first three paths return the supply air to the room temperature and are charged for the reheat or post-cooling that takes them there, while the heat-pump unit leaves its whole electrical input in the room as heat, so its figure is not on the same balance boundary as the other three. Below 0 °C the saturation pressure is taken over ice, so every dew point below zero is a frost point. Transients, start-up, door dynamics, part load, defrost recovery, refrigerant law, pressure-equipment and hygiene requirements are outside the model, and no primary-energy or tariff weighting is applied. Use for sizing comparison and for seeing which physical limit bites first, not for compliance. A value that arrives from another tool is held to the bound of the field that receives it, the same bound a typed value obeys: outdoor dry bulb 233.15-328.15 K and barometric pressure 60-110 kPa; outside it nothing is written and the quantity, its figure and the bound are reported. An incoming humidity ratio is held in no field of its own: it is carried as the outdoor relative humidity, whose field states 1-100 %, and outside that band it is applied at the edge, with the figure received, the figure used and the edge all shown.",
    "uk": "Стаціонарна зосереджена модель чотирьох трактів осушення: один змішаний стан приміщення, один коефіцієнт байпасу батареї та одна ефективність ротора; чилер і тепловий насос описано часткою ККД Карно, а не характеристиками виробника, а межа ротора — емпіричною залежністю від температури регенерації, а не ізотермою сорбції. Навантаження мокрої батареї враховує ентальпію конденсату, а нижче 0 °C — і інею, але потужність вентилятора зараховано до електрики без додавання до ентальпії повітря. Питома енергія — це енергія на місці на кілограм вологи: перші три тракти повертають приплив до температури приміщення, і їхній підігрів чи доохолодження враховано, тоді як теплонасосний осушувач лишає всю спожиту електрику в приміщенні у вигляді теплоти, тож його показник узято на іншій межі балансу. Нижче 0 °C тиск насичення береться над льодом, тому кожна від'ємна точка роси є точкою інею. Перехідні режими, пуск, динаміка дверей, часткове навантаження, відновлення після відтавання, вимоги до холодоагентів, обладнання під тиском і гігієни поза моделлю; первинну енергію і тарифи не враховано. Використовуйте для порівняння та пошуку обмежувального чинника, а не для підтвердження відповідності. Значення, що надійшло від іншого інструмента, утримується у межах поля, яке його приймає, тих самих, яким підлягає введене вручну: зовнішня суха куля 233,15–328,15 К і барометричний тиск 60–110 кПа; поза цим нічого не записується, а величина, її число та межа повідомляються. Вхідний вологовміст власного поля не має: він переноситься як відносна вологість зовнішнього повітря, поле якої задає 1–100 %, і поза цією смугою застосовується на її межі, із зазначенням отриманого та використаного числа і самої межі.",
    "de": "Stationäres, konzentriertes Modell von vier Entfeuchtungswegen: ein gemischter Raumzustand, ein Bypassfaktor des Registers und ein Rotorwirkungsgrad; Kältemaschine und Wärmepumpe folgen einem Bruchteil des Carnot-Wirkungsgrads statt Herstellerkennlinien, und die Rotorgrenze folgt einer empirischen Geraden über der Regenerationstemperatur statt einer Sorptionsisotherme. Die Leistung des nassen Registers enthält die Enthalpie des Kondensats und unter 0 °C des Reifs, die Ventilatorleistung wird jedoch als Strom gezählt, ohne der Luftenthalpie zugeschlagen zu werden. Die spezifische Energie ist Endenergie je Kilogramm Wasser: die ersten drei Wege führen die Zuluft auf Raumtemperatur zurück und tragen die dafür nötige Nacherwärmung bzw. Nachkühlung, während das Wärmepumpengerät seine gesamte elektrische Leistung als Wärme im Raum lässt, sein Wert steht also nicht auf derselben Bilanzgrenze. Unter 0 °C wird der Sättigungsdruck über Eis genommen, jeder Taupunkt unter null ist damit ein Reifpunkt. Instationäres Verhalten, Anfahren, Türdynamik, Teillast, Abtauerholung, Kältemittelrecht, Druckgeräte- und Hygieneanforderungen liegen außerhalb des Modells; Primärenergie- oder Tarifgewichtung erfolgt nicht. Für Auslegungsvergleiche und zum Erkennen der zuerst greifenden physikalischen Grenze, nicht für Nachweise. Ein von einem anderen Werkzeug eintreffender Wert wird an die Grenze des aufnehmenden Feldes gehalten, an dieselbe Grenze wie ein eingegebener Wert: Außentrockenkugel 233,15–328,15 K und barometrischer Druck 60–110 kPa; darüber hinaus wird nichts geschrieben und die Größe, ihre Zahl und die Grenze werden gemeldet. Ein eintreffender Feuchtegrad hat kein eigenes Feld: er wird als relative Außenluftfeuchte geführt, deren Feld 1–100 % angibt, und außerhalb dieses Bandes am Rand übernommen — mit der empfangenen Zahl, der verwendeten Zahl und dem Rand.",
    "nl": "Stationair, samengevat model van vier ontvochtigingstrajecten: één gemengde ruimtetoestand, één bypassfactor van de batterij en één rotorrendement; koelmachine en warmtepomp volgen een fractie van het Carnot-rendement in plaats van fabriekskrommen, en de rotorbodem volgt een empirische lijn in regeneratietemperatuur in plaats van een sorptie-isotherm. Het vermogen van de natte batterij bevat de enthalpie van het condensaat en onder 0 °C van de rijp, maar het ventilatorvermogen wordt als elektriciteit geteld zonder bij de luchtenthalpie te worden opgeteld. De specifieke energie is energie op locatie per kilogram water: de eerste drie trajecten brengen de toevoerlucht terug op ruimtetemperatuur en dragen de bijbehorende naverwarming of nakoeling, terwijl de warmtepompontvochtiger zijn volledige elektrische opname als warmte in de ruimte achterlaat, zodat zijn getal niet op dezelfde balansgrens staat. Onder 0 °C wordt de verzadigingsdruk boven ijs genomen, dus elk dauwpunt onder nul is een rijppunt. Overgangsgedrag, opstart, deurdynamica, deellast, herstel na ontdooien, koudemiddelwetgeving, drukapparatuur- en hygiëne-eisen vallen buiten het model; primaire energie of tarieven worden niet gewogen. Bedoeld voor vergelijking bij het dimensioneren en om te zien welke fysische grens het eerst knelt, niet voor toetsing. Een waarde die van een andere tool binnenkomt wordt aan de grens van het ontvangende veld gehouden, dezelfde grens die een ingetypte waarde volgt: buitendrogebol 233,15–328,15 K en barometrische druk 60–110 kPa; daarbuiten wordt niets weggeschreven en de grootheid, haar getal en de grens worden gemeld. Een binnenkomend vochtgehalte heeft geen eigen veld: het wordt gedragen als de relatieve buitenluchtvochtigheid, waarvan het veld 1–100 % aangeeft, en buiten die band op de grens toegepast — met het ontvangen getal, het gebruikte getal en de grens.",
    "fr": "Modèle stationnaire et globalisé de quatre trajets de déshumidification : un seul état de local mélangé, un seul facteur de contournement de batterie et un seul rendement de rotor ; le groupe froid et la pompe à chaleur suivent une fraction du rendement de Carnot plutôt que des courbes constructeur, et le plancher du rotor suit une droite empirique en température de régénération plutôt qu'une isotherme de sorption. La puissance de la batterie humide comprend l'enthalpie du condensat, et du givre au-dessous de 0 °C, mais la puissance des ventilateurs est comptée en électricité sans être ajoutée à l'enthalpie de l'air. L'énergie spécifique est l'énergie finale par kilogramme d'eau : les trois premiers trajets ramènent le soufflage à la température du local et supportent le post-chauffage ou le post-refroidissement correspondant, tandis que l'appareil à pompe à chaleur laisse toute sa puissance électrique dans le local sous forme de chaleur, si bien que son chiffre n'est pas pris sur la même frontière de bilan. Au-dessous de 0 °C la pression de saturation est prise sur la glace : tout point de rosée négatif est un point de givre. Les régimes transitoires, le démarrage, la dynamique des portes, la charge partielle, la reprise après dégivrage, la réglementation frigorigène, les exigences des équipements sous pression et d'hygiène sont hors modèle ; aucune pondération en énergie primaire ni tarifaire n'est appliquée. À utiliser pour comparer des dimensionnements et voir quelle limite physique intervient la première, non pour justifier une conformité. Une valeur venue d’un autre outil est maintenue dans la borne du champ qui la reçoit, la même borne qu’une valeur saisie : bulbe sec extérieur 233,15–328,15 K et pression barométrique 60–110 kPa ; au-delà, rien n’est écrit et la grandeur, son nombre et la borne sont signalés. Un rapport de mélange entrant n’a pas de champ propre : il est porté comme l’humidité relative extérieure, dont le champ indique 1–100 %, et hors de cette bande il est appliqué au bord, avec le nombre reçu, le nombre utilisé et le bord.",
    "es": "Modelo estacionario y agrupado de cuatro trayectos de deshumidificación: un único estado de local mezclado, un único factor de bypass de la batería y un único rendimiento de rotor; la enfriadora y la bomba de calor siguen una fracción del rendimiento de Carnot en lugar de curvas de fabricante, y el suelo del rotor sigue una recta empírica en temperatura de regeneración en vez de una isoterma de sorción. La potencia de la batería húmeda incluye la entalpía del condensado, y de la escarcha por debajo de 0 °C, pero la potencia de los ventiladores se contabiliza como electricidad sin sumarse a la entalpía del aire. La energía específica es energía final por kilogramo de agua: los tres primeros trayectos devuelven la impulsión a la temperatura del local y cargan con el post-calentamiento o post-enfriamiento necesario, mientras que el equipo de bomba de calor deja toda su potencia eléctrica en el local como calor, de modo que su cifra no está tomada en la misma frontera de balance. Por debajo de 0 °C la presión de saturación se toma sobre hielo, así que todo punto de rocío negativo es un punto de escarcha. Los transitorios, el arranque, la dinámica de puertas, la carga parcial, la recuperación tras desescarche, la reglamentación de refrigerantes y los requisitos de equipos a presión e higiene quedan fuera del modelo; no se aplica ponderación de energía primaria ni tarifaria. Úsese para comparar dimensionados y ver qué límite físico aparece primero, no para justificar cumplimiento. Un valor que llega de otra herramienta se mantiene en el límite del campo que lo recibe, el mismo límite que cumple un valor introducido: bulbo seco exterior 233,15–328,15 K y presión barométrica 60–110 kPa; fuera de ello no se escribe nada y se informa de la magnitud, su cifra y el límite. Una humedad específica entrante no tiene campo propio: se lleva como la humedad relativa exterior, cuyo campo indica 1–100 %, y fuera de esa banda se aplica en el borde, con la cifra recibida, la usada y el borde.",
    "pl": "Model stanu ustalonego i skupionego czterech ścieżek osuszania: jedna dla stanu mieszanego pomieszczenia, jeden dla współczynnika obejścia wężownicy i jedna dla sprawności wirnika; agregat chłodniczy i pompa ciepła podążają za ułamkiem sprawności Carnota, a nie za krzywymi producenta, a podłoga wirnika podąża za empiryczną linią temperatury regeneracji, a nie izotermą sorpcji. Praca wężownicy mokrej przenosi entalpię kondensatu i szronu poniżej 0°C, ale moc wentylatora jest naliczana jako energia elektryczna bez dodawania do entalpii powietrza. Energia właściwa to energia miejsca na kilogram wody: pierwsze trzy ścieżki przywracają powietrze nawiewane do temperatury pokojowej i są ładowane za dogrzewanie lub schładzanie końcowe, które je tam doprowadza, podczas gdy jednostka pompy ciepła pozostawia całą swoją energię elektryczną w pomieszczeniu w postaci ciepła, więc jej wartość nie znajduje się na tej samej granicy równowagi co pozostałe trzy. Poniżej 0°C ciśnienie nasycenia jest mierzone nad lodem, więc każdy punkt rosy poniżej zera jest punktem szronu. Stany przejściowe, rozruch, dynamika drzwi, obciążenie częściowe, odzysk z rozmrażania, przepisy dotyczące czynnika chłodniczego, wymagania dotyczące urządzeń ciśnieniowych i higieny nie są uwzględnione w modelu, a nie stosuje się ważenia energii pierwotnej ani taryf. Służy do porównywania rozmiarów i sprawdzania, które ograniczenia fizyczne są pierwsze, a nie do zapewnienia zgodności. Wartość nadchodząca z innego narzędzia jest utrzymywana w granicy pola, które ją przyjmuje, tej samej granicy, której podlega wartość wpisana: zewnętrzna temperatura termometru suchego 233,15–328,15 K i ciśnienie barometryczne 60–110 kPa; poza nią nic nie jest zapisywane, a wielkość, jej liczba i granica są zgłaszane. Nadchodząca zawartość wilgoci nie ma własnego pola: jest niesiona jako wilgotność względna powietrza zewnętrznego, której pole podaje 1–100 %, a poza tym pasmem jest stosowana na jego krawędzi — z podaniem liczby otrzymanej, użytej i samej krawędzi."

intro:{en:"Start with the outdoor air, the room requirement and the moisture sources. The same room moisture balance is then put through four dehumidification methods at once: each one is either ranked by the energy it needs per kilogram of water removed, or ruled out — with the number that rules it out written next to it.",uk:"Почніть із зовнішнього повітря, вимоги до приміщення та джерел вологи. Той самий баланс вологи приміщення одразу проганяється через чотири методи осушення: кожен або посідає місце за енергією на кілограм видаленої вологи, або відпадає — із числом, яке його відкидає, поруч.",de:"Beginnen Sie mit der Außenluft, der Raumanforderung und den Feuchtequellen. Dieselbe Feuchtebilanz des Raumes läuft dann gleichzeitig durch vier Entfeuchtungsverfahren: jedes wird entweder nach der Energie je Kilogramm entzogenen Wassers eingeordnet oder scheidet aus — mit der Zahl daneben, die es ausscheiden lässt.",nl:"Begin met de buitenlucht, de eis in de ruimte en de vochtbronnen. Dezelfde vochtbalans van de ruimte gaat vervolgens tegelijk door vier ontvochtigingsmethoden: elke methode wordt gerangschikt naar de energie per kilogram verwijderd water, of valt af — met het getal ernaast dat haar doet afvallen.",fr:"Commencez par l’air extérieur, l’exigence du local et les sources d’humidité. Le même bilan d’humidité du local passe ensuite simultanément dans quatre méthodes de déshumidification: chacune est soit classée selon l’énergie par kilogramme d’eau extraite, soit écartée — avec, à côté, le nombre qui l’écarte.",es:"Empiece por el aire exterior, el requisito del local y las fuentes de humedad. El mismo balance de humedad del local pasa después a la vez por cuatro métodos de deshumidificación: cada uno se ordena por la energía por kilogramo de agua extraída, o queda descartado — con el número que lo descarta al lado.",pl:"Zacznij od powietrza zewnętrznego, wymagań dla pomieszczenia i źródeł wilgoci. Ten sam bilans wilgoci w pomieszczeniu jest następnie równolegle przeliczany dla czterech metod osuszania: każda z nich jest albo klasyfikowana według energii potrzebnej do usunięcia kilograma wody, albo wykluczana — z podaniem wartości, która o tym decyduje."},
hoRangeNo:{en:"Handoff: {q} = {v} {u} lies outside {a}–{b} {u}, the range this page models. Nothing was applied for {q}.",uk:"Передача: {q} = {v} {u} поза діапазоном {a}–{b} {u}, який моделює ця сторінка. Для {q} нічого не застосовано.",de:"Übergabe: {q} = {v} {u} liegt außerhalb von {a}–{b} {u}, dem Bereich, den diese Seite modelliert. Für {q} wurde nichts übernommen.",nl:"Overdracht: {q} = {v} {u} valt buiten {a}–{b} {u}, het bereik dat deze pagina modelleert. Voor {q} is niets toegepast.",fr:"Transfert : {q} = {v} {u} sort de la plage {a}–{b} {u} que modélise cette page. Rien n’a été appliqué pour {q}.",es:"Traspaso: {q} = {v} {u} queda fuera de {a}–{b} {u}, el rango que modela esta página. No se aplicó nada para {q}.",pl:"Przekazanie: {q} = {v} {u} wykracza poza zakres {a}–{b} {u} modelowany na tej stronie. Dla {q} nie zastosowano nic."},
hoRangeSat:{en:"Handoff: {v} Pa is at or below the saturation pressure {e} Pa at {t} K, so no moist-air state exists there. Nothing was applied for w.",uk:"Передача: {v} Pa дорівнює або менше за тиск насичення {e} Pa за {t} K, тому стану вологого повітря там не існує. Для w нічого не застосовано.",de:"Übergabe: {v} Pa liegt auf oder unter dem Sättigungsdruck {e} Pa bei {t} K, dort existiert kein Zustand feuchter Luft. Für w wurde nichts übernommen.",nl:"Overdracht: {v} Pa ligt op of onder de verzadigingsdruk {e} Pa bij {t} K, daar bestaat geen toestand van vochtige lucht. Voor w is niets toegepast.",fr:"Transfert : {v} Pa est égal ou inférieur à la pression de saturation {e} Pa à {t} K ; aucun état d’air humide n’y existe. Rien n’a été appliqué pour w.",es:"Traspaso: {v} Pa es igual o inferior a la presión de saturación {e} Pa a {t} K; ahí no existe ningún estado de aire húmedo. No se aplicó nada para w.",pl:"Przekazanie: {v} Pa jest równe ciśnieniu nasycenia {e} Pa przy {t} K lub od niego mniejsze, więc nie istnieje tam stan powietrza wilgotnego. Dla w nie zastosowano nic."},
hoClampRh:{en:"Handoff: w = {v} kg/kg gives a relative humidity of {r} %, outside the {a}–{b} % band this page’s own humidity field states; it was applied at the edge of that band, {e} %.",uk:"Передача: w = {v} kg/kg дає відносну вологість {r} %, поза смугою {a}–{b} %, яку задає власне поле вологості цієї сторінки; застосовано на межі цієї смуги, {e} %.",de:"Übergabe: w = {v} kg/kg ergibt eine relative Feuchte von {r} %, außerhalb des Bandes {a}–{b} %, das das Feuchtefeld dieser Seite selbst angibt; übernommen am Rand dieses Bandes, {e} %.",nl:"Overdracht: w = {v} kg/kg geeft een relatieve vochtigheid van {r} %, buiten de band {a}–{b} % die het vochtveld van deze pagina zelf aangeeft; toegepast op de grens van die band, {e} %.",fr:"Transfert : w = {v} kg/kg donne une humidité relative de {r} %, hors de la bande {a}–{b} % que le champ d’humidité de cette page indique lui-même ; appliquée au bord de cette bande, {e} %.",es:"Traspaso: w = {v} kg/kg da una humedad relativa del {r} %, fuera de la banda {a}–{b} % que indica el propio campo de humedad de esta página; se aplicó en el borde de esa banda, {e} %.",pl:"Przekazanie: w = {v} kg/kg daje wilgotność względną {r} %, poza pasmem {a}–{b} %, które podaje własne pole wilgotności tej strony; zastosowano na krawędzi tego pasma, {e} %."},
w_chk:{en:"An internal consistency check did not pass with the present input. The numbers shown may be wrong — do not rely on them.",uk:"Внутрішня перевірка узгодженості не пройшла за цих вхідних даних. Показані числа можуть бути хибними — не покладайтеся на них.",de:"Eine interne Konsistenzprüfung ist mit diesen Eingaben nicht bestanden. Die angezeigten Zahlen können falsch sein — verlassen Sie sich nicht darauf.",nl:"Een interne consistentiecontrole is met deze invoer niet geslaagd. De getoonde getallen kunnen onjuist zijn — vertrouw er niet op.",fr:"Un contrôle interne de cohérence n’est pas passé avec ces données. Les nombres affichés peuvent être faux — ne vous y fiez pas.",es:"Una comprobación interna de coherencia no se ha superado con estos datos. Los números mostrados pueden ser erróneos — no confíe en ellos.",pl:"Wewnętrzna kontrola spójności nie powiodła się dla bieżących danych wejściowych. Wyświetlane liczby mogą być błędne — nie należy na nich polegać."},
w_above:{en:"The required room dew point of {a} °C is above the room temperature of {b} °C. Air cannot carry more water than saturation at its own temperature, so this room state does not exist — it would mean more than 100 % relative humidity. Nothing has to be dried here, and every duty computed from it comes out negative, so the comparison is switched off. Set the required dew point below the room temperature, or raise the room temperature.",uk:"Потрібна точка роси в приміщенні {a} °C вища за температуру приміщення {b} °C. Повітря не може містити більше вологи, ніж за насичення при власній температурі, тож такого стану приміщення не існує — це означало б понад 100 % відносної вологості. Осушувати тут нічого, а всі потужності, пораховані з такого стану, виходять від’ємними, тому порівняння вимкнено. Задайте точку роси нижче за температуру приміщення або підніміть температуру приміщення.",de:"Der geforderte Raumtaupunkt von {a} °C liegt über der Raumtemperatur von {b} °C. Luft kann nicht mehr Wasser tragen als bei Sättigung ihrer eigenen Temperatur, dieser Raumzustand existiert also nicht — er bedeutete über 100 % relative Feuchte. Hier ist nichts zu trocknen, und jede daraus gerechnete Leistung wird negativ; der Vergleich ist deshalb abgeschaltet. Setzen Sie den geforderten Taupunkt unter die Raumtemperatur oder erhöhen Sie die Raumtemperatur.",nl:"Het gevraagde dauwpunt in de ruimte van {a} °C ligt boven de ruimtetemperatuur van {b} °C. Lucht kan niet meer water bevatten dan bij verzadiging op haar eigen temperatuur, dus deze ruimtetoestand bestaat niet — hij zou meer dan 100 % relatieve vochtigheid betekenen. Er valt hier niets te drogen, en elk daaruit berekend vermogen wordt negatief; de vergelijking is daarom uitgeschakeld. Zet het gevraagde dauwpunt onder de ruimtetemperatuur, of verhoog de ruimtetemperatuur.",fr:"Le point de rosée requis dans le local, {a} °C, est supérieur à la température du local, {b} °C. L’air ne peut pas contenir plus d’eau qu’à saturation à sa propre température: cet état de local n’existe pas, il signifierait plus de 100 % d’humidité relative. Il n’y a rien à sécher ici et toute puissance calculée à partir de cet état devient négative; la comparaison est donc désactivée. Placez le point de rosée requis sous la température du local, ou relevez la température du local.",es:"El punto de rocío requerido en el local, {a} °C, es superior a la temperatura del local, {b} °C. El aire no puede contener más agua que en saturación a su propia temperatura, así que ese estado del local no existe: supondría más del 100 % de humedad relativa. Aquí no hay nada que secar y toda potencia calculada a partir de ese estado sale negativa; por eso la comparación queda desactivada. Sitúe el punto de rocío requerido por debajo de la temperatura del local, o suba la temperatura del local.",pl:"Wymagany punkt rosy w pomieszczeniu, {a} °C, jest wyższy od temperatury pomieszczenia, {b} °C. Powietrze nie może zawierać więcej pary wodnej niż wynika ze stanu nasycenia przy jego własnej temperaturze, więc taki stan pomieszczenia nie istnieje — oznaczałby wilgotność względną powyżej 100 %. Nie ma tu zadania osuszania, a obliczone moce procesu stają się ujemne, dlatego porównanie jest wyłączone. Ustaw wymagany punkt rosy poniżej temperatury pomieszczenia albo podnieś temperaturę pomieszczenia."},
b_above:{en:"No moisture load and no surface check are computed while the required dew point lies above the room temperature.",uk:"Поки потрібна точка роси вища за температуру приміщення, вологонадходження й перевірка поверхонь не рахуються.",de:"Solange der geforderte Taupunkt über der Raumtemperatur liegt, werden Feuchtelast und Oberflächenprüfung nicht gerechnet.",nl:"Zolang het gevraagde dauwpunt boven de ruimtetemperatuur ligt, worden vochtlast en oppervlaktecontrole niet berekend.",fr:"Tant que le point de rosée requis dépasse la température du local, la charge d’humidité et le contrôle de surface ne sont pas calculés.",es:"Mientras el punto de rocío requerido supere la temperatura del local, no se calculan la carga de humedad ni la comprobación de superficies.",pl:"Obciążenie wilgocią ani kontrola kondensacji na powierzchniach nie są obliczane, dopóki wymagany punkt rosy jest wyższy od temperatury pomieszczenia."},
n_basis:{en:"Specific energy is the site energy of the unit divided by the water it removes. Paths 1-3 return the supply air to the room temperature, and their reheat or post-cooling is charged to them; the heat-pump unit instead leaves its whole electrical input in the room as heat, so its figure is not on the same boundary as the other three and understates the total energy whenever the room also has to be cooled.",uk:"Питома енергія — це енергія установки на місці, поділена на видалену вологу. Тракти 1-3 повертають приплив до температури приміщення, і їхній підігрів чи доохолодження враховано; теплонасосний осушувач натомість лишає всю спожиту електрику в приміщенні у вигляді теплоти, тож його показник узято на іншій межі балансу і занижує сумарну енергію, якщо приміщення ще й треба охолоджувати.",de:"Die spezifische Energie ist die Endenergie des Geräts geteilt durch das entzogene Wasser. Die Wege 1-3 führen die Zuluft auf Raumtemperatur zurück, ihre Nacherwärmung bzw. Nachkühlung ist eingerechnet; das Wärmepumpengerät lässt dagegen seine gesamte elektrische Leistung als Wärme im Raum, sein Wert steht also nicht auf derselben Bilanzgrenze und unterschätzt den Gesamtaufwand, sobald der Raum zusätzlich gekühlt werden muss.",nl:"De specifieke energie is de energie van het toestel op locatie gedeeld door het verwijderde water. Trajecten 1-3 brengen de toevoerlucht terug op ruimtetemperatuur en hun naverwarming of nakoeling is meegerekend; de warmtepompontvochtiger laat zijn volledige elektrische opname als warmte in de ruimte achter, zodat zijn getal niet op dezelfde balansgrens staat en het totaal onderschat zodra de ruimte ook gekoeld moet worden.",fr:"L'energie specifique est l'energie finale de l'appareil divisee par l'eau extraite. Les trajets 1-3 ramenent le soufflage a la temperature du local et leur post-chauffage ou post-refroidissement leur est impute ; l'appareil a pompe a chaleur laisse au contraire toute sa puissance electrique dans le local sous forme de chaleur, si bien que son chiffre n'est pas pris sur la meme frontiere de bilan et sous-estime le total des que le local doit aussi etre refroidi.",es:"La energia especifica es la energia final del equipo dividida por el agua extraida. Los trayectos 1-3 devuelven la impulsion a la temperatura del local y su post-calentamiento o post-enfriamiento se les imputa; el equipo de bomba de calor, en cambio, deja toda su potencia electrica en el local como calor, de modo que su cifra no esta tomada en la misma frontera de balance y subestima el total en cuanto el local tambien deba enfriarse.",pl:"Energia właściwa to energia miejsca jednostki podzielona przez usuwaną wodę. Ścieżki 1-3 doprowadzają powietrze nawiewane z powrotem do temperatury pokojowej, a ich dogrzewanie lub schładzanie jest do nich ładowane; pompa ciepła pozostawia całą swoją energię elektryczną w pomieszczeniu w postaci ciepła, więc jej wartość nie pokrywa się z wartością pozostałych trzech i zaniża całkowitą energię, gdy pomieszczenie również musi zostać schłodzone."},
n_res:{en:"Feasible methods come first, ordered by specific energy — the lowest figure takes rank 1. A method that cannot reach the required supply dew point follows them and carries the number that rules it out.",uk:"Спочатку йдуть придатні методи, впорядковані за питомою енергією — найменше число дає перше місце. Метод, який не досягає потрібної точки роси припливу, стоїть після них і несе число, через яке він відпадає.",de:"Zuerst die geeigneten Verfahren, geordnet nach spezifischer Energie — der kleinste Wert erhält Rang 1. Ein Verfahren, das den geforderten Zulufttaupunkt nicht erreicht, folgt dahinter und trägt die Zahl, die es ausscheiden lässt.",nl:"Eerst de geschikte methoden, geordend op specifieke energie — het laagste getal krijgt rang 1. Een methode die het vereiste toevoerdauwpunt niet haalt, volgt daarna en draagt het getal dat haar doet afvallen.",fr:"D’abord les méthodes applicables, classées par énergie spécifique — la plus faible valeur prend le rang 1. Une méthode qui n’atteint pas le point de rosée de soufflage requis vient ensuite, avec le nombre qui l’écarte.",es:"Primero los métodos aplicables, ordenados por energía específica — el valor más bajo ocupa el puesto 1. Un método que no alcanza el punto de rocío de impulsión requerido va después, con el número que lo descarta.",pl:"Najpierw umieszczane są metody wykonalne, uszeregowane według energii właściwej — liczba najniższa ma rangę 1. Metoda, która nie może osiągnąć wymaganego punktu rosy, jest umieszczana po nich i ma numer, który ją wyklucza."},

v_frost:{en:"Ruled out because the coil surface would have to sit at {a} °C to reach {b} °C supply dew point, and that is below the frost-free limit of {c} °C.",uk:"Відпадає, бо поверхня батареї мала б мати {a} °C, щоб дати точку роси {b} °C, а це нижче межі без обмерзання {c} °C.",de:"Scheidet aus, weil die Registeroberfläche {a} °C annehmen müsste, um {b} °C Zulufttaupunkt zu erreichen, und das liegt unter der frostfreien Grenze von {c} °C.",nl:"Valt af omdat het batterijoppervlak op {a} °C zou moeten staan voor {b} °C toevoerdauwpunt, en dat ligt onder de vorstvrije grens van {c} °C.",fr:"Écarté car la surface de batterie devrait être à {a} °C pour atteindre {b} °C de point de rosée, ce qui est sous la limite hors gel de {c} °C.",es:"Descartado porque la superficie de la batería tendría que estar a {a} °C para alcanzar {b} °C de punto de rocío, por debajo del límite sin escarcha de {c} °C.",pl:"Wykluczono to, ponieważ powierzchnia wężownicy musiałaby osiągnąć temperaturę {a} °C, aby osiągnąć temperaturę punktu rosy zasilania {b} °C, a to jest poniżej granicy bez zamarzania wynoszącej {c} °C."},
v_srflim:{en:"Ruled out because the required coil surface temperature is {a} °C, below the lowest attainable {b} °C of the low-temperature circuit.",uk:"Відпадає, бо потрібна температура поверхні {a} °C нижча за найнижчу досяжну {b} °C низькотемпературного контуру.",de:"Scheidet aus, weil die erforderliche Oberflächentemperatur {a} °C unter der tiefsten erreichbaren {b} °C des Tieftemperaturkreises liegt.",nl:"Valt af omdat de vereiste oppervlaktetemperatuur {a} °C onder de laagst haalbare {b} °C van de lagetemperatuurkring ligt.",fr:"Écarté car la température de surface requise {a} °C est inférieure à la plus basse atteignable {b} °C du circuit basse température.",es:"Descartado porque la temperatura de superficie requerida {a} °C está por debajo de la mínima alcanzable {b} °C del circuito de baja temperatura.",pl:"Wykluczono, ponieważ wymagana temperatura powierzchni cewki wynosi {a} °C, czyli jest niższa od najniższej osiągalnej temperatury {b} °C obwodu niskotemperaturowego."},
v_bypass:{en:"Ruled out because a bypass factor of {a} leaves at least {b} g/kg in the air stream, while {c} g/kg is required.",uk:"Відпадає, бо коефіцієнт байпасу {a} лишає щонайменше {b} г/кг у потоці, а потрібно {c} г/кг.",de:"Scheidet aus, weil ein Bypassfaktor von {a} mindestens {b} g/kg im Luftstrom belässt, gefordert sind {c} g/kg.",nl:"Valt af omdat een bypassfactor van {a} minstens {b} g/kg in de luchtstroom laat, terwijl {c} g/kg nodig is.",fr:"Écarté car un facteur de contournement de {a} laisse au moins {b} g/kg dans le flux, alors que {c} g/kg est requis.",es:"Descartado porque un factor de bypass de {a} deja al menos {b} g/kg en el flujo, mientras se requieren {c} g/kg.",pl:"Wykluczono, ponieważ współczynnik obejścia {a} pozostawia co najmniej {b} g/kg w strumieniu powietrza, podczas gdy wymagane jest {c} g/kg."},
v_floor:{en:"Ruled out because at {a} °C regeneration the rotor bottoms out at {b} °C dew point, above the {c} °C required.",uk:"Відпадає, бо за регенерації {a} °C ротор досягає лише {b} °C точки роси, тоді як потрібно {c} °C.",de:"Scheidet aus, weil der Rotor bei {a} °C Regeneration nur {b} °C Taupunkt erreicht, gefordert sind {c} °C.",nl:"Valt af omdat de rotor bij {a} °C regeneratie blijft steken op {b} °C dauwpunt, terwijl {c} °C nodig is.",fr:"Écarté car à {a} °C de régénération le rotor plafonne à {b} °C de point de rosée, au-dessus des {c} °C requis.",es:"Descartado porque a {a} °C de regeneración el rotor se detiene en {b} °C de punto de rocío, por encima de los {c} °C requeridos.",pl:"Wykluczono, ponieważ przy regeneracji {a} °C wirnik osiąga najniższy punkt rosy {b} °C, czyli powyżej wymaganego {c} °C."},
v_cycle:{en:"Ruled out because each coil ices up in {a} min while defrosting takes {b} min, so two coils leave a gap of {c} min in the duty.",uk:"Відпадає, бо кожна батарея обмерзає за {a} хв, а відтавання триває {b} хв: дві батареї лишають розрив {c} хв.",de:"Scheidet aus, weil jedes Register in {a} min vereist, das Abtauen aber {b} min dauert; zwei Register lassen eine Lücke von {c} min.",nl:"Valt af omdat elke batterij in {a} min dichtvriest terwijl ontdooien {b} min duurt; twee batterijen laten een gat van {c} min.",fr:"Écarté car chaque batterie givre en {a} min alors que le dégivrage dure {b} min: deux batteries laissent un trou de {c} min.",es:"Descartado porque cada batería se escarcha en {a} min mientras el desescarche dura {b} min: dos baterías dejan un hueco de {c} min.",pl:"Wykluczono, ponieważ każdy wymiennik obladza się po {a} min, a odszranianie trwa {b} min; przy dwóch wymiennikach pozostaje więc przerwa {c} min w ciągłości pracy."},
v_regsat:{en:"Ruled out because the regeneration air would have to take up {a} g/kg, above the {b} g/kg assumed as its capacity.",uk:"Відпадає, бо повітря регенерації мало б поглинути {a} г/кг, а прийнята межа {b} г/кг.",de:"Scheidet aus, weil die Regenerationsluft {a} g/kg aufnehmen müsste, über den angesetzten {b} g/kg.",nl:"Valt af omdat de regeneratielucht {a} g/kg zou moeten opnemen, boven de aangenomen {b} g/kg.",fr:"Écarté car l’air de régénération devrait absorber {a} g/kg, au-delà des {b} g/kg retenus.",es:"Descartado porque el aire de regeneración tendría que absorber {a} g/kg, por encima de los {b} g/kg supuestos.",pl:"Wykluczono, ponieważ powietrze regeneracyjne musiałoby wchłonąć {a} g/kg, czyli więcej niż {b} g/kg przyjęto jako jego pojemność."},
v_regmax:{en:"Ruled out because regeneration would need {a} % of the process air flow once the {c} % purge sector is served, above the {b} % maximum set for the wheel.",uk:"Відпадає, бо регенерація потребувала б {a} % робочого потоку повітря разом із продувним сектором {c} %, тоді як для ротора задано максимум {b} %.",de:"Scheidet aus, weil die Regeneration {a} % des Prozessluftstroms benötigen würde, wenn der Spülsektor von {c} % mitversorgt wird, über dem für das Rad gesetzten Höchstwert von {b} %.",nl:"Valt af omdat de regeneratie {a} % van de processluchtstroom zou vergen wanneer de spoelsector van {c} % wordt meegevoed, boven het voor het wiel ingestelde maximum van {b} %.",fr:"Écarté car la régénération exigerait {a} % du débit d’air de process une fois le secteur de purge de {c} % alimenté, au-delà du maximum de {b} % fixé pour la roue.",es:"Descartado porque la regeneración exigiría el {a} % del caudal de aire de proceso una vez atendido el sector de purga del {c} %, por encima del máximo del {b} % fijado para la rueda.",pl:"Wykluczono, ponieważ regeneracja wymagałaby {a} % przepływu powietrza procesowego po obsłużeniu {c} % sektora oczyszczania, ponad {b} % maksymalnego ustawionego dla koła."},
v_regrng:{en:"Ruled out because the minimum regeneration flow set for the wheel, {a} % of the process air, is above its maximum of {b} %.",uk:"Відпадає, бо задана мінімальна витрата регенерації {a} % робочого повітря перевищує заданий максимум {b} %.",de:"Scheidet aus, weil der gesetzte Mindestregenerationsstrom von {a} % der Prozessluft über dem Höchstwert von {b} % liegt.",nl:"Valt af omdat de ingestelde minimale regeneratiestroom van {a} % van de proceslucht boven het maximum van {b} % ligt.",fr:"Écarté car le débit de régénération minimal fixé, {a} % de l’air de process, dépasse son maximum de {b} %.",es:"Descartado porque el caudal mínimo de regeneración fijado, {a} % del aire de proceso, supera su máximo del {b} %.",pl:"Wykluczono, ponieważ minimalny przepływ regeneracyjny ustalony dla koła, {a} % powietrza procesowego, jest wyższy od jego maksymalnego przepływu wynoszącego {b} %."},
v_srcoff:{en:"Ruled out because the heat source chosen for this path is not among the available energy sources.",uk:"Відпадає, бо обране для цього тракту джерело теплоти відсутнє в переліку доступних.",de:"Scheidet aus, weil die für diesen Weg gewählte Wärmequelle nicht zu den verfügbaren Energiequellen gehört.",nl:"Valt af omdat de voor dit traject gekozen warmtebron niet bij de beschikbare energiebronnen staat.",fr:"Écarté car la source de chaleur choisie pour ce trajet ne figure pas parmi les sources disponibles.",es:"Descartado porque la fuente de calor elegida para este trayecto no figura entre las fuentes disponibles.",pl:"Wykluczono, ponieważ źródło ciepła wybrane dla tej ścieżki nie znajduje się wśród dostępnych źródeł energii."},
v_nosrc:{en:"Ruled out because no listed source reaches {a} °C; the hottest one offered is {b} °C.",uk:"Відпадає, бо жодне заявлене джерело не дає {a} °C; найгарячіше має {b} °C.",de:"Scheidet aus, weil keine angegebene Quelle {a} °C erreicht; die heißeste bietet {b} °C.",nl:"Valt af omdat geen enkele opgegeven bron {a} °C haalt; de heetste levert {b} °C.",fr:"Écarté car aucune source listée n’atteint {a} °C; la plus chaude offre {b} °C.",es:"Descartado porque ninguna fuente indicada alcanza {a} °C; la más caliente ofrece {b} °C.",pl:"Wykluczono, ponieważ żadne z dostępnych źródeł ciepła nie osiąga {a} °C; najwyższa dostępna temperatura wynosi {b} °C."},
v_noel:{en:"Ruled out because the path needs {a} kW of electric drive power and electricity is switched off in the source list.",uk:"Відпадає, бо тракт потребує {a} кВт електричного приводу, а електроенергію вимкнено в переліку джерел.",de:"Scheidet aus, weil der Weg {a} kW elektrische Antriebsleistung braucht und Strom in der Quellenliste abgeschaltet ist.",nl:"Valt af omdat het traject {a} kW elektrisch aandrijfvermogen nodig heeft en elektriciteit in de bronnenlijst uit staat.",fr:"Écarté car le trajet exige {a} kW de puissance électrique et l’électricité est désactivée dans la liste des sources.",es:"Descartado porque el trayecto necesita {a} kW de potencia eléctrica y la electricidad está desactivada en la lista de fuentes.",pl:"Wykluczono, ponieważ ten wariant wymaga {a} kW mocy elektrycznej napędu, a energia elektryczna jest wyłączona na liście dostępnych źródeł energii."},
v_nocold:{en:"Ruled out because the path needs {a} kW of cooling and neither a chiller nor a chilled water plant is available.",uk:"Відпадає, бо тракт потребує {a} кВт холоду, а ні холодильної машини, ні станції холоду немає.",de:"Scheidet aus, weil der Weg {a} kW Kälte braucht und weder Kältemaschine noch Kaltwasseranlage vorhanden ist.",nl:"Valt af omdat het traject {a} kW koeling nodig heeft en er geen koelmachine of koudwaterinstallatie is.",fr:"Écarté car le trajet demande {a} kW de froid et il n’y a ni groupe froid ni centrale d’eau glacée.",es:"Descartado porque el trayecto necesita {a} kW de frío y no hay enfriadora ni planta de agua enfriada.",pl:"Wykluczono, ponieważ ścieżka wymaga {a} kW chłodzenia, a nie ma dostępnej chłodziarki ani instalacji wody lodowej."},
v_hpheat:{en:"Applicable, but the whole compressor input of {a} kW stays in the room: the supply leaves at {b} °C against a room at {c} °C.",uk:"Придатний, але вся потужність компресора {a} кВт лишається в приміщенні: приплив виходить із {b} °C проти {c} °C у приміщенні.",de:"Geeignet, doch die gesamte Verdichterleistung von {a} kW bleibt im Raum: die Zuluft tritt mit {b} °C aus, der Raum hat {c} °C.",nl:"Geschikt, maar het volledige compressorvermogen van {a} kW blijft in de ruimte: de toevoer verlaat met {b} °C tegen {c} °C in de ruimte.",fr:"Applicable, mais toute la puissance du compresseur, {a} kW, reste dans le local: le soufflage sort à {b} °C contre {c} °C dans le local.",es:"Aplicable, pero toda la potencia del compresor, {a} kW, queda en el local: la impulsión sale a {b} °C frente a {c} °C del local.",pl:"Metoda jest możliwa, ale całe {a} kW mocy pobieranej przez sprężarkę pozostaje w pomieszczeniu: nawiew opuszcza urządzenie z temperaturą {b} °C przy temperaturze pomieszczenia {c} °C."},
v_flowneg:{en:"No method can work at this air flow: a load of {a} kg/h against a room humidity ratio of {b} g/kg needs a negative supply humidity ratio. Raise the treated flow above {c} m³/h or cut the load at source.",uk:"За такого потоку жоден метод не працює: навантаження {a} кг/год при вологовмісті в приміщенні {b} г/кг вимагає від’ємного вологовмісту припливу. Підніміть потік вище {c} м³/год або зменшіть надходження.",de:"Bei diesem Luftstrom funktioniert kein Verfahren: eine Last von {a} kg/h bei einem Raumfeuchtegrad von {b} g/kg verlangt einen negativen Zuluftfeuchtegrad. Strom über {c} m³/h anheben oder die Last an der Quelle senken.",nl:"Bij deze luchtstroom werkt geen enkele methode: een last van {a} kg/h bij een vochtverhouding van {b} g/kg in de ruimte vraagt een negatieve toevoervochtverhouding. Verhoog de stroom boven {c} m³/h of beperk de last bij de bron.",fr:"Aucune méthode ne fonctionne à ce débit: une charge de {a} kg/h pour une teneur en eau de {b} g/kg dans le local exige une teneur de soufflage négative. Portez le débit au-delà de {c} m³/h ou réduisez la charge à la source.",es:"Ningún método funciona con este caudal: una carga de {a} kg/h con una humedad absoluta de {b} g/kg en el local exige una humedad de impulsión negativa. Suba el caudal por encima de {c} m³/h o reduzca la carga en origen.",pl:"Żadna metoda nie sprawdzi się przy takim przepływie powietrza: obciążenie {a} kg/h przy wilgotności powietrza w pomieszczeniu wynoszącej {b} g/kg wymaga ujemnego współczynnika wilgotności powietrza nawiewanego. Należy zwiększyć przepływ oczyszczonego powietrza powyżej {c} m³/h lub zmniejszyć obciążenie u źródła."},
v_none:{en:"No method reaches the required dew point with the present parameters.",uk:"Жоден метод не досягає потрібної точки роси за цих параметрів.",de:"Kein Verfahren erreicht mit diesen Vorgaben den geforderten Taupunkt.",nl:"Geen methode haalt het gevraagde dauwpunt met deze invoer.",fr:"Aucune méthode n’atteint le point de rosée requis avec ces paramètres.",es:"Ningún método alcanza el punto de rocío requerido con estos parámetros.",pl:"Żadna metoda nie pozwala na osiągnięcie wymaganego punktu rosy przy obecnych parametrach."},
v_above:{en:"Ruled out because the required room dew point of {a} °C lies above the room temperature of {b} °C: that room state would be supersaturated, so there is no dehumidification task to compare.",uk:"Відпадає, бо потрібна точка роси {a} °C вища за температуру приміщення {b} °C: такий стан приміщення був би перенасиченим, тож задачі осушення тут немає.",de:"Scheidet aus, weil der geforderte Raumtaupunkt von {a} °C über der Raumtemperatur von {b} °C liegt: dieser Raumzustand wäre übersättigt, es gibt also keine Entfeuchtungsaufgabe zu vergleichen.",nl:"Valt af omdat het gevraagde dauwpunt van {a} °C boven de ruimtetemperatuur van {b} °C ligt: die ruimtetoestand zou oververzadigd zijn, er is dus geen ontvochtigingsopgave om te vergelijken.",fr:"Écarté car le point de rosée requis de {a} °C dépasse la température du local de {b} °C: cet état de local serait sursaturé, il n’y a donc pas de tâche de déshumidification à comparer.",es:"Descartado porque el punto de rocío requerido de {a} °C supera la temperatura del local de {b} °C: ese estado del local estaría sobresaturado, de modo que no hay tarea de deshumidificación que comparar.",pl:"Wykluczono, ponieważ wymagany punkt rosy w pomieszczeniu wynoszący {a} °C jest wyższy od temperatury w pomieszczeniu wynoszącej {b} °C: taki stan pomieszczenia byłby przesycony, więc nie ma zadania osuszania, które można by porównać."},
v_negduty:{en:"Ruled out because the balance of this path comes out negative: {a} kW of cooling and {b} kW of reheat. A machine cannot deliver negative duty; with these inputs the air needs no drying along this path.",uk:"Відпадає, бо баланс тракту виходить від’ємним: {a} кВт холоду та {b} кВт підігріву. Машина не може давати від’ємну потужність; за цих вхідних даних повітря на цьому тракті сушити не треба.",de:"Scheidet aus, weil die Bilanz dieses Weges negativ wird: {a} kW Kälte und {b} kW Nacherwärmung. Eine Maschine kann keine negative Leistung liefern; mit diesen Eingaben ist die Luft auf diesem Weg nicht zu trocknen.",nl:"Valt af omdat de balans van dit traject negatief uitvalt: {a} kW koeling en {b} kW naverwarming. Een machine kan geen negatief vermogen leveren; met deze invoer hoeft de lucht op dit traject niet te worden gedroogd.",fr:"Écarté car le bilan de ce trajet devient négatif: {a} kW de froid et {b} kW de post-chauffage. Une machine ne peut pas fournir une puissance négative; avec ces données, l’air n’a pas à être séché sur ce trajet.",es:"Descartado porque el balance de este trayecto resulta negativo: {a} kW de frío y {b} kW de post-calentamiento. Una máquina no puede entregar potencia negativa; con estos datos el aire no necesita secado en este trayecto.",pl:"Wykluczone, ponieważ bilans tej ścieżki jest ujemny: {a} kW chłodzenia i {b} kW dogrzewania. Maszyna nie może pracować z obciążeniem ujemnym; przy takich nakładach powietrze nie wymaga suszenia na tej ścieżce."},

c_state:{en:"Coldest surface {a} °C, room dew point {b} °C, required margin {c} K.",uk:"Найхолодніша поверхня {a} °C, точка роси в приміщенні {b} °C, потрібний запас {c} K.",de:"Kälteste Oberfläche {a} °C, Raumtaupunkt {b} °C, geforderter Abstand {c} K.",nl:"Koudste oppervlak {a} °C, dauwpunt in de ruimte {b} °C, vereiste marge {c} K.",fr:"Surface la plus froide {a} °C, point de rosée du local {b} °C, marge requise {c} K.",es:"Superficie más fría {a} °C, punto de rocío del local {b} °C, margen requerido {c} K.",pl:"Najzimniejsza powierzchnia: {a} °C; punkt rosy w pomieszczeniu: {b} °C; wymagany margines: {c} K."},
c_ok:{en:"No condensation expected: the surface sits {a} K above the dew point, {b} K more than the margin demands.",uk:"Конденсації не очікується: поверхня на {a} K вища за точку роси, це на {b} K більше за потрібний запас.",de:"Keine Kondensation zu erwarten: die Oberfläche liegt {a} K über dem Taupunkt, {b} K mehr als gefordert.",nl:"Geen condensatie te verwachten: het oppervlak ligt {a} K boven het dauwpunt, {b} K meer dan de marge eist.",fr:"Pas de condensation attendue: la surface est {a} K au-dessus du point de rosée, soit {b} K de plus que la marge.",es:"No se espera condensación: la superficie está {a} K por encima del punto de rocío, {b} K más que el margen.",pl:"Nie przewiduje się kondensacji: temperatura powierzchni jest o {a} K wyższa od punktu rosy, czyli o {b} K powyżej wymaganego marginesu."},
c_bad:{en:"Condensation risk: the surface is {a} K below the minimum of {b} °C set by the dew point plus the margin.",uk:"Ризик конденсації: поверхня на {a} K нижча за мінімум {b} °C, заданий точкою роси плюс запас.",de:"Kondensationsrisiko: die Oberfläche liegt {a} K unter dem Minimum von {b} °C aus Taupunkt plus Abstand.",nl:"Condensatierisico: het oppervlak ligt {a} K onder het minimum van {b} °C uit dauwpunt plus marge.",fr:"Risque de condensation: la surface est {a} K sous le minimum de {b} °C fixé par le point de rosée plus la marge.",es:"Riesgo de condensación: la superficie está {a} K por debajo del mínimo de {b} °C fijado por el punto de rocío más el margen.",pl:"Ryzyko kondensacji: powierzchnia jest o {a} K niższa od minimalnej temperatury {b} °C ustalonej przez temperaturę punktu rosy powiększoną o margines."},

d_dom:{en:"Dominant contributor: {a}, {b} % of the total. At very low dew points occupants and doors often outweigh the vapour permeance of the envelope.",uk:"Домінує: {a}, {b} % загального. За дуже низьких точок роси люди та двері часто важать більше, ніж паропроникність оболонки.",de:"Größter Beitrag: {a}, {b} % der Summe. Bei sehr tiefen Taupunkten wiegen Personen und Türen oft schwerer als die Dampfdurchlässigkeit der Hülle.",nl:"Grootste bijdrage: {a}, {b} % van het totaal. Bij zeer lage dauwpunten wegen personen en deuren vaak zwaarder dan de dampdoorlaat van de schil.",fr:"Contribution dominante: {a}, {b} % du total. Aux points de rosée très bas, occupants et portes pèsent souvent plus que la perméance à la vapeur de l’enveloppe.",es:"Contribución dominante: {a}, {b} % del total. Con puntos de rocío muy bajos, ocupantes y puertas pesan a menudo más que la permeancia al vapor de la envolvente.",pl:"Dominujący czynnik: {a}, {b} % całości. Przy bardzo niskich temperaturach punktu rosy, osoby przebywające w budynku i drzwi często przeważają nad paroprzepuszczalnością powłoki."},
d_neg:{en:"Negative entries mean the outdoor air is drier than the room, so that path removes moisture instead of adding it.",uk:"Від’ємні значення означають, що зовнішнє повітря сухіше за внутрішнє, тож цей шлях вологу забирає, а не додає.",de:"Negative Beiträge bedeuten, dass die Außenluft trockener ist als der Raum; dieser Pfad entzieht dann Feuchte.",nl:"Negatieve posten betekenen dat de buitenlucht droger is dan de ruimte; dat pad onttrekt dan vocht.",fr:"Les valeurs négatives indiquent un air extérieur plus sec que le local: ce chemin retire de l’humidité au lieu d’en apporter.",es:"Los valores negativos indican que el aire exterior es más seco que el local: esa vía retira humedad en vez de aportarla.",pl:"Wartości ujemne oznaczają, że powietrze na zewnątrz jest bardziej suche niż w pomieszczeniu, więc taka ścieżka usuwa wilgoć zamiast ją dodawać."},
