/* ============================================================
   STATE
   The maths reads this object, never the DOM. readInputs() applies exactly the
   clamping and the fall-back to the declared default that the old DOM reader
   applied when it parsed a control value, so the record, the report, the python
   export and the permalink carry the same numbers as before the port.
   ============================================================ */
const DEFAULTS={};
CTRL.forEach(g=>g.items.forEach(it=>{ DEFAULTS[it.id]=it.v; }));
let state=Object.assign({},DEFAULTS);
let APP=null, BARE=false;

/* ---- ranges an incoming quantity is held to (AGENTS 2.4 and 2.7, TZ-engineering-workflow 5.1) ----
   A pressure, a temperature and a humidity ratio are readings at a place. The three
   quantities this page accepts land in the outdoor-air group S1, so each one is held to
   the bound of the field that receives it and to no other number: tout -40...55 degC,
   press 60...110 kPa, rhout 1...100 %. readInputs() holds a typed value to the same
   three bounds, so the page has one range per field and not two. */
const HO_RANGE=(()=>{
  const by={};CTRL.forEach(g=>g.items.forEach(it=>{by[it.id]=it;}));
  return {T :{lo:by.tout.min+273.15,hi:by.tout.max+273.15,unit:"K"},
          p :{lo:by.press.min*1000,hi:by.press.max*1000,unit:"Pa"},
          rh:{lo:by.rhout.min,hi:by.rhout.max,unit:"%"}};
})();
/* Reset and Examples replace the state object, so the live one is asked for rather
   than captured. */
function ST(){ return (APP&&APP.state)?APP.state:state; }

function readInputs(){
  const st=ST(), P={};
  CTRL.forEach(g=>g.items.forEach(it=>{
    const raw=st[it.id];
    if(it.t==="chk"){ P[it.id]=!!raw; return; }
    if(it.t==="sel"){ P[it.id]=(raw==null?it.v:String(raw)); return; }
    let v=(typeof raw==="number")?raw:parseFloat(raw);
    if(!isFinite(v)) v=it.v;
    v=Math.min(Math.max(v,it.min),it.max);
    P[it.id]=v;
  }));
  return P;
}

function mk(tag,attrs,html){
  const n=document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(k=>{ if(attrs[k]!=null) n.setAttribute(k,attrs[k]); });
  if(html!=null) n.innerHTML=html;
  return n;
}

/* ============================================================
   LOAD MODEL  (five sources, steady-state room moisture balance)
   ============================================================ */
function computeLoad(P,tdreq,scale){
  const p=P.press*1000;
  const s=(scale==null)?1:scale;
  const pvOut=Math.min(P.rhout/100*pws(P.tout),p*0.98);
  const xOut=xFromPv(pvOut,p);
  const xRoom=satX(tdreq,p);
  const rhoOut=rhoDa(P.tout,xOut,p);
  const rhoRoom=rhoDa(P.troom,xRoom,p);
  const mda=P.flow/3600*rhoRoom;
  const phi=P.phi/100;
  const L={};
  L.p=p; L.xOut=xOut; L.xRoom=xRoom; L.mda=mda; L.phi=phi; L.tdreq=tdreq;
  L.people=s*P.np*P.gp/1000/3600;
  L.prod=s*P.prod/3600;
  L.leak=s*P.ach*P.vol/3600*rhoOut*(xOut-xRoom);
  L.door=s*P.adoor*P.kdoor*(P.dopen/60)*rhoOut*(xOut-xRoom);
  L.make=mda*phi*(xOut-xRoom);
  L.internal=L.people+L.prod+L.leak+L.door;
  L.xSup=xRoom-L.internal/mda;
  L.x1=(1-phi)*xRoom+phi*xOut;
  L.t1=(1-phi)*P.troom+phi*P.tout;
  L.mw=mda*(L.x1-L.xSup);
  L.total=L.internal+L.make;
  L.h1=enth(L.t1,L.x1);
  L.h3=enth(P.troom,Math.max(L.xSup,0));
  L.tdSup=L.xSup>0?tdFromX(L.xSup,p):-100;
  L.vmin=L.internal>0?L.internal/xRoom/rhoRoom*3600:0;
  // A required dew point above the room temperature would mean room air held above
  // saturation. No such state exists, and every duty derived from it turns negative,
  // so the whole comparison is refused rather than answered.
  L.above=(tdreq>P.troom+1e-9);
  L.ok=(L.xSup>0)&&(L.mw>0)&&!L.above;
  return L;
}

/* ============================================================
   SHARED COIL ROUTINE
   ============================================================ */
/* specific enthalpy of the water leaving the coil, kJ/kg, datum liquid water at 0 °C */
function hwCond(ts){ return ts>=0 ? CW*ts : (CICE*ts-HFUS); }
function coil(P,L,surfLimit){
  const p=L.p,bf=P.bf;
  const R={};
  R.xFloor=bf*L.x1;                                  // bypass-only floor
  R.xsNeed=(L.xSup-bf*L.x1)/(1-bf);
  R.bypassFail=(R.xsNeed<=1e-9);
  R.tsReq=R.bypassFail?-100:tdFromX(R.xsNeed,p);
  // a coil can only remove water, never add it: the driest attainable state is
  // capped by the inlet humidity ratio
  R.xAch=Math.min(bf*L.x1+(1-bf)*satX(surfLimit,p),L.x1);
  R.tdAch=tdFromX(Math.max(R.xAch,1e-12),p);
  R.limitFail=R.bypassFail||(R.tsReq<surfLimit);
  const ts=R.limitFail?surfLimit:R.tsReq;
  R.ts=ts;
  R.t2=bf*L.t1+(1-bf)*ts;
  R.x2=R.limitFail?R.xAch:L.xSup;
  R.h2=enth(R.t2,R.x2);
  R.mw=L.mda*(L.x1-R.x2);
  /* Energy balance on the wet coil, ASHRAE F Ch.1: q = mda[(h1-h2) - (x1-x2) hw].
     The water leaves the coil as condensate above 0 °C and as frost below it, and
     below zero the latent heat of fusion is released on the surface and has to be
     carried away with the rest of the load. Dropping the term understates a
     freezing coil by several per cent and overstates a wet one. */
  R.hw=hwCond(ts);
  R.qc=L.mda*(L.h1-R.h2)-R.mw*R.hw;
  R.qh=L.mda*(L.h3-R.h2);
  return R;
}
/* No path may be reported as applicable with a negative cooling or reheat duty:
   a machine cannot deliver negative power, and a negative duty that survives into
   the ranking cancels against the fan power and produces a plausible-looking
   specific energy. Every method tests its own duties before it claims feasibility. */
function dutyBad(qc,qh){ return !(qc>=-1e-9) || !(qh>=-1e-9); }
function copCool(tEvap,tCond,frac){
  const dT=Math.max((tCond+273.15)-(tEvap+273.15),3);
  return Math.max(frac*(tEvap+273.15)/dT,0.2);
}
function fanKW(P,extraPa){ return P.flow/3600*(P.dpfan+extraPa)/(P.etafan/100)/1000; }
function srcTemp(P,mode){
  if(mode==="elec") return P.s_el?900:-273;
  if(mode==="gas") return P.s_gas?900:-273;
  if(mode==="hw") return P.s_hw?P.thw:-273;
  if(mode==="rec") return P.s_rec?P.trec:-273;
  if(mode==="cond") return 900;
  return -273;
}
function srcOn(P,mode){
  if(mode==="elec") return !!P.s_el;
  if(mode==="gas") return !!P.s_gas;
  if(mode==="hw") return !!P.s_hw;
  if(mode==="rec") return !!P.s_rec;
  if(mode==="cond") return !!P.s_el;
  return false;
}
function reheatEnergy(P,qh,condAvail){
  const m=P.reheat;
  if(!srcOn(P,m)) return {err:["v_srcoff",{}]};
  const need=P.troom+10, av=srcTemp(P,m);
  if(av<need) return {err:["v_nosrc",{a:fnum(need,0),b:fnum(av,0)}]};
  if(m==="cond"){ const d=Math.max(0,qh-condAvail); return {site:d,el:d,deficit:d}; }
  if(m==="elec") return {site:qh,el:qh,deficit:0};
  if(m==="gas") return {site:qh/0.9,el:0,deficit:0};
  return {site:qh,el:0,deficit:0};
}
function bestHeatTemp(P){
  let b=-273;
  if(P.s_el) b=Math.max(b,900);
  if(P.s_gas) b=Math.max(b,900);
  if(P.s_hw) b=Math.max(b,P.thw);
  if(P.s_rec) b=Math.max(b,P.trec);
  return b;
}
/* ============================================================
   METHOD 1 — cooling below dew point with reheat
   ============================================================ */
function methodCool(P,L){
  const R={id:"m1",name:"m1",ok:false,rows:[],states:[]};
  const C=coil(P,L,P.adpmin); R.C=C;
  R.tdAch=C.tdAch;
  R.dashed=true;
  R.states=[{t:L.t1,x:L.x1},{t:C.t2,x:C.x2},{t:P.troom,x:C.x2}];
  if(C.bypassFail){
    R.reason=["v_bypass",{a:fnum(P.bf,2),b:fnum(C.xFloor*1000,3),c:fnum(L.xSup*1000,3)}];
    return R;
  }
  if(C.limitFail){
    R.reason=["v_frost",{a:fnum(C.tsReq,1),b:fnum(L.tdSup,1),c:fnum(P.adpmin,1)}];
    return R;
  }
  if(dutyBad(C.qc,C.qh)){ R.reason=["v_negduty",{a:fnum(C.qc,1),b:fnum(C.qh,1)}]; return R; }
  if(!P.s_el&&!P.s_cw){ R.reason=["v_nocold",{a:fnum(C.qc,1)}]; return R; }
  const te=C.tsReq-P.appr;
  const cop=copCool(te,P.tcond,P.etac/100);
  const pcool=C.qc/cop;
  const fan=fanKW(P,250);
  const RH=reheatEnergy(P,C.qh,C.qc+pcool);
  if(RH.err){ R.reason=RH.err; return R; }
  const heatSite=RH.site, deficit=RH.deficit;
  if(!P.s_el){ R.reason=["v_noel",{a:fnum(pcool+fan,1)}]; return R; }
  R.ok=true; R.dashed=false;
  R.qc=C.qc; R.qh=C.qh; R.mw=C.mw; R.el=pcool+fan+RH.el;
  R.site=pcool+fan+heatSite;
  R.e=R.site/(R.mw*3600);
  R.ts=C.tsReq; R.te=te; R.cop=cop; R.deficit=deficit;
  R.frost=C.tsReq-P.adpmin;
  R.states=[{t:L.t1,x:L.x1},{t:C.t2,x:C.x2},{t:P.troom,x:L.xSup}];
  R.rows=[["r_surf",fnum(C.tsReq,1)],["r_frost",fnum(R.frost,1)],["r_cool",fnum(C.qc,1)],
          ["r_heat",fnum(C.qh,1)],["r_el",fnum(R.el,1)],["r_water",fnum(R.mw*3600,2)]];
  R.verdict=["v_ok",{a:fnum(R.tdAch,1),b:fnum(L.tdSup,1),c:fnum(R.e,2)}];
  return R;
}

/* ============================================================
   METHOD 2 — freeze-out on two alternating coils
   ============================================================ */
function methodFreeze(P,L){
  const R={id:"m2",name:"m2",ok:false,rows:[],states:[]};
  const C=coil(P,L,P.tsfzlim); R.C=C;
  R.tdAch=C.tdAch;
  R.dashed=true;
  R.states=[{t:L.t1,x:L.x1},{t:C.t2,x:C.x2},{t:P.troom,x:C.x2}];
  if(C.bypassFail){
    R.reason=["v_bypass",{a:fnum(P.bf,2),b:fnum(C.xFloor*1000,3),c:fnum(L.xSup*1000,3)}];
    return R;
  }
  if(C.limitFail){
    R.reason=["v_srflim",{a:fnum(C.tsReq,1),b:fnum(P.tsfzlim,1)}];
    return R;
  }
  if(dutyBad(C.qc,C.qh)){ R.reason=["v_negduty",{a:fnum(C.qc,1),b:fnum(C.qh,1)}]; return R; }
  if(!P.s_el&&!P.s_cw){ R.reason=["v_nocold",{a:fnum(C.qc,1)}]; return R; }
  const mw=C.mw;
  const frosting=C.tsReq<0;
  const tDry=mw>1e-12?P.mice/mw:1e9;                  // s
  const tDef=P.tdef*60;
  R.tDry=tDry/60; R.tDef=P.tdef; R.frosting=frosting;
  if(frosting&&tDry<tDef){
    R.reason=["v_cycle",{a:fnum(tDry/60,1),b:fnum(P.tdef,0),c:fnum((tDef-tDry)/60,1)}];
    return R;
  }
  const te=C.tsReq-P.appr;
  const cop=copCool(te,P.tcond,P.etac/100);
  const pcool=C.qc/cop;
  const eDef=frosting?P.mice*(HFUS+CICE*Math.max(0-C.tsReq,0)+CW*5)/(tDry+tDef)/(P.etadef/100):0;
  const fan=fanKW(P,350);
  const RH=reheatEnergy(P,C.qh,C.qc+pcool);
  if(RH.err){ R.reason=RH.err; return R; }
  const heatSite=RH.site;
  if(!P.s_el){ R.reason=["v_noel",{a:fnum(pcool+fan+eDef,1)}]; return R; }
  R.ok=true; R.dashed=false;
  R.qc=C.qc; R.qh=C.qh+eDef; R.mw=mw;
  R.el=pcool+fan+eDef+RH.el;
  R.site=pcool+fan+eDef+heatSite;
  R.e=R.site/(R.mw*3600);
  R.ts=C.tsReq; R.te=te; R.cop=cop; R.eDef=eDef;
  R.frost=C.tsReq-P.tsfzlim;
  R.states=[{t:L.t1,x:L.x1},{t:C.t2,x:C.x2},{t:P.troom,x:L.xSup}];
  R.rows=[["r_surf",fnum(C.tsReq,1)],
          frosting?["r_cycle",fnum(tDry/60,1)]:["r_frost",fnum(C.tsReq-P.tsfzlim,1)],
          ["r_cool",fnum(C.qc,1)],
          ["r_heat",fnum(R.qh,1)],["r_el",fnum(R.el,1)],["r_water",fnum(R.mw*3600,2)]];
  R.verdict=["v_ok",{a:fnum(R.tdAch,1),b:fnum(L.tdSup,1),c:fnum(R.e,2)}];
  return R;
}

/* ============================================================
   METHOD 3 — desiccant rotor with regeneration and purge sector
   ============================================================ */
function rotorFloor(P,L){
  const tdFloor=Math.min(-10,Math.max(-75,-35-0.75*(P.treg-80)));
  const xFloor=satX(tdFloor,L.p);
  const xIdeal=xFloor+(1-P.etarot)*(L.x1-xFloor);
  const xRot=xIdeal+(P.carry/100)*(L.x1-xIdeal);
  return {tdFloor:tdFloor,xFloor:xFloor,xRot:Math.max(xRot,1e-9)};
}
/* The purge sector is fed from the same regeneration stream, so the moisture demand is
   first converted into a total regeneration flow and only that total is held between the
   minimum and the maximum fraction. Bounding the demand before the purge share is added
   lets the flow that is actually heated and blown exceed the declared maximum. */
function regenFlow(P,L,mw){
  const eff=Math.max(1-P.purge/100,1e-6);
  const need=Math.max(mw,0)/(P.dxreg/1000);       // stream that carries the water at the assumed pickup
  const tot=need/eff;                             // same stream with the purge sector served
  const fmin=(P.fregmin/100)*L.mda, fmax=(P.fregmax/100)*L.mda;
  return {need:need,tot:tot,fmin:fmin,fmax:fmax,eff:eff,
          mReg:Math.min(Math.max(tot,Math.min(fmin,fmax)),fmax),
          over:tot>fmax, range:fmin>fmax};
}
function methodDesiccant(P,L){
  const R={id:"m3",name:"m3",ok:false,rows:[],states:[]};
  const F=rotorFloor(P,L);
  R.tdAch=tdFromX(F.xRot,L.p);
  R.dashed=true;
  R.states=[{t:L.t1,x:L.x1},{t:tFromHX(L.h1,F.xRot),x:F.xRot},{t:P.troom,x:F.xRot}];
  if(F.xRot>L.xSup){
    R.reason=["v_floor",{a:fnum(P.treg,0),b:fnum(R.tdAch,1),c:fnum(L.tdSup,1)}];
    return R;
  }
  const tReg=P.treg;
  if(!srcOn(P,P.regsrc)){ R.reason=["v_srcoff",{}]; return R; }
  const avail=srcTemp(P,P.regsrc);
  if(avail<tReg){ R.reason=["v_nosrc",{a:fnum(tReg,0),b:fnum(avail,0)}]; return R; }
  const mw=L.mda*(L.x1-L.xSup);
  const G=regenFlow(P,L,mw);
  if(G.range){
    R.reason=["v_regrng",{a:fnum(P.fregmin,0),b:fnum(P.fregmax,0)}];
    return R;
  }
  if(G.over){
    R.reason=["v_regmax",{a:fnum(G.tot/Math.max(L.mda,1e-12)*100,1),b:fnum(P.fregmax,0),c:fnum(P.purge,0)}];
    return R;
  }
  const mReg=G.mReg;
  const dxReg=mw/mReg;
  const hRegIn=enth(tReg,L.xOut);
  const qReg=mReg*(hRegIn-enth(P.tout,L.xOut));
  const xRegOut=L.xOut+dxReg;
  const tRegEx=tFromHX(hRegIn,xRegOut);
  const rhEx=rhFromX(tRegEx,xRegOut,L.p);
  if(rhEx>1){
    R.reason=["v_regsat",{a:fnum(dxReg*1000,2),b:fnum(P.dxreg,1)}];
    return R;
  }
  const t2r=tFromHX(L.h1,L.xSup);                    // near-isenthalpic sorption
  const qPost=L.mda*(enth(t2r,L.xSup)-L.h3);         // post-cooling back to room temperature
  const tePost=P.troom-8-P.appr;
  const copPost=copCool(tePost,P.tcond,P.etac/100);
  const pPost=qPost>0?qPost/copPost:0;
  if(dutyBad(Math.max(qPost,0),qReg)){ R.reason=["v_negduty",{a:fnum(Math.max(qPost,0),1),b:fnum(qReg,1)}]; return R; }
  const fan=fanKW(P,450)+mReg/Math.max(L.mda,1e-9)*fanKW(P,300);
  if(!P.s_el){ R.reason=["v_noel",{a:fnum(pPost+fan,1)}]; return R; }
  let regSite=qReg;
  if(P.regsrc==="gas") regSite=qReg/0.9;
  R.ok=true; R.dashed=false;
  R.qc=Math.max(qPost,0); R.qh=qReg; R.mw=mw;
  R.el=pPost+fan+(P.regsrc==="elec"?qReg:0);
  R.site=pPost+fan+regSite;
  R.e=R.site/(R.mw*3600);
  R.mReg=mReg; R.dxReg=dxReg; R.tRegEx=tRegEx; R.rhEx=rhEx; R.t2r=t2r;
  R.states=[{t:L.t1,x:L.x1},{t:t2r,x:L.xSup},{t:P.troom,x:L.xSup}];
  R.rows=[["r_treg",fnum(tReg,0)],["r_regex",fnum(tRegEx,1)+" / "+fnum(rhEx*100,0)],
          ["r_cool",fnum(R.qc,1)],["r_heat",fnum(qReg,1)],["r_el",fnum(R.el,1)],
          ["r_water",fnum(R.mw*3600,2)]];
  R.verdict=["v_ok",{a:fnum(R.tdAch,1),b:fnum(L.tdSup,1),c:fnum(R.e,2)}];
  return R;
}

/* ============================================================
   METHOD 4 — refrigerant heat-pump dehumidifier
   ============================================================ */
function methodHeatPump(P,L){
  const R={id:"m4",name:"m4",ok:false,rows:[],states:[]};
  const C=coil(P,L,P.tehp); R.C=C;
  R.tdAch=C.tdAch;
  R.dashed=true;
  R.states=[{t:L.t1,x:L.x1},{t:C.t2,x:C.x2},{t:P.troom,x:C.x2}];
  if(C.bypassFail){
    R.reason=["v_bypass",{a:fnum(P.bf,2),b:fnum(C.xFloor*1000,3),c:fnum(L.xSup*1000,3)}];
    return R;
  }
  if(C.limitFail){
    R.reason=["v_frost",{a:fnum(C.tsReq,1),b:fnum(L.tdSup,1),c:fnum(P.tehp,1)}];
    return R;
  }
  if(dutyBad(C.qc,C.qh)){ R.reason=["v_negduty",{a:fnum(C.qc,1),b:fnum(C.qh,1)}]; return R; }
  if(!P.s_el){ R.reason=["v_noel",{a:fnum(C.qc/3,1)}]; return R; }
  const te=C.tsReq-P.appr;
  const cpm=CPA+CPV*Math.max(L.xSup,0);
  let pc=C.qc/3, t3=P.troom, tc=P.troom+15;
  for(let i=0;i<12;i++){
    tc=t3+12;
    const cop=copCool(te,tc,P.etachp/100);
    pc=C.qc/cop;
    t3=C.t2+(C.qc+pc)/(L.mda*cpm);
  }
  const fan=fanKW(P,250);
  R.ok=true; R.dashed=false;
  R.qc=C.qc; R.qh=C.qc+pc; R.mw=C.mw;
  R.el=pc+fan; R.site=pc+fan;
  R.e=R.site/(R.mw*3600);
  R.ts=C.tsReq; R.te=te; R.t3=t3; R.pc=pc;
  R.frost=C.tsReq-P.tehp;
  R.states=[{t:L.t1,x:L.x1},{t:C.t2,x:C.x2},{t:t3,x:L.xSup}];
  R.rows=[["r_surf",fnum(C.tsReq,1)],["r_room",fnum(pc+fan,1)],["r_cool",fnum(C.qc,1)],
          ["r_heat",fnum(R.qh,1)],["r_smer",fnum(R.mw*3600/Math.max(R.el,1e-9),2)],
          ["r_water",fnum(R.mw*3600,2)]];
  R.verdict=(t3>P.troom+0.1)?["v_hpheat",{a:fnum(pc,1),b:fnum(t3,1),c:fnum(P.troom,1)}]
                          :["v_ok",{a:fnum(R.tdAch,1),b:fnum(L.tdSup,1),c:fnum(R.e,2)}];
  return R;
}

const METHODS=[methodCool,methodFreeze,methodDesiccant,methodHeatPump];
function runMethods(P,L){
  if(L.above) return METHODS.map((f,i)=>({id:"m"+(i+1),name:"m"+(i+1),ok:false,tdAch:null,
    reason:["v_above",{a:fnum(L.tdreq,1),b:fnum(P.troom,1)}],rows:[],states:[]}));
  if(!L.ok) return METHODS.map((f,i)=>({id:"m"+(i+1),name:"m"+(i+1),ok:false,tdAch:null,
    reason:["v_flowneg",{a:fnum(L.internal*3600,2),b:fnum(L.xRoom*1000,3),c:fnum(L.vmin,0)}],rows:[],states:[]}));
  return METHODS.map(f=>f(P,L));
}
/* ============================================================
   BUILT-IN CHECKS
   ============================================================ */
function buildChecks(P,L,MS,S){
  const p=L.p, C=[];
  const add=(code,key,pass,detail)=>C.push({code:code,key:key,pass:!!pass,detail:detail});

  // C1 nothing is ever computed from a room state above saturation
  const rhReq=rhFromX(P.troom,satX(L.tdreq,p),p);
  const sat1=(L.tdreq>P.troom+1e-9)||(rhReq>1.000001);
  add("C1","k1",!sat1||(L.above&&!MS.some(m=>m.ok)),fnum(rhReq*100,1)+" %");

  // C2 x <-> dew point reversibility
  let e2=0;
  for(let td=-60;td<=30;td+=5){ const x=satX(td,p); const back=tdFromX(x,p); e2=Math.max(e2,Math.abs(back-td)); }
  add("C2","k2",e2<1e-6,"max Δ = "+nsep(e2.toExponential(1))+" K");

  // C3 cooling and reheat duty of every method are non-negative
  let minq=1e30, nq=0;
  MS.forEach(m=>{ [m.qc,m.qh].forEach(v=>{ if(typeof v==="number"&&isFinite(v)){
    minq=Math.min(minq,v); if(v<-1e-9) nq++; } }); });
  if(minq>=1e29) minq=0;
  add("C3","k3",nq===0,fnum(minq,2)+" kW");

  // C4 an applicable path costs energy: positive specific energy, at least its own fans
  const fanFloor=fanKW(P,0);
  let mine=1e30, n4=0;
  MS.forEach(m=>{ if(m.ok){ mine=Math.min(mine,m.e);
    if(!(m.e>0)||!isFinite(m.e)||!(m.site>=fanFloor-1e-9)) n4++; } });
  if(mine>=1e29) mine=0;
  add("C4","k4",n4===0,fnum(mine,3)+" kWh/kg");

  // C5 non-negative water removal
  let neg=0, minmw=1e9;
  MS.forEach(m=>{ if(m.ok){ minmw=Math.min(minmw,m.mw); if(m.mw<0) neg++; } });
  if(minmw>1e8) minmw=0;
  add("C5","k5",neg===0,fnum(minmw*3600,3)+" kg/h");

  // C6 saturation pressure over water
  const r0=Math.abs(pws(0)-611.2), r20=Math.abs(pws(20)-2339.3), r100=Math.abs(pws(100)-101325);
  add("C6","k6",r0<0.5&&r20<2&&r100<200,
      fnum(pws(0),1)+" / "+fnum(pws(20),1)+" / "+fnum(pws(100)/1000,2)+" kPa");

  // C7 saturation pressure over ice
  const ri=Math.abs(pws(-40)-12.84);
  add("C7","k7",ri<0.05,fnum(pws(-40),2)+" Pa");

  // C8 saturation humidity ratio rises with temperature across both branches
  let n8=0, prev8=-1, x8=0;
  for(let t=-60;t<=60;t+=1){ x8=satX(t,p); if(!(x8>prev8)) n8++; prev8=x8; }
  add("C8","k8",n8===0,fnum(x8*1000,2)+" g/kg at +60 \u00b0C");

  // C9 rotor moisture balance
  const M3=MS[2];
  let e9=0, d9="—";
  if(M3.ok){ e9=Math.abs(M3.mw-M3.mReg*M3.dxReg)/Math.max(M3.mw,1e-12); d9=nsep(e9.toExponential(1)); }
  else { const mReg=Math.max((P.fregmin/100)*L.mda,1e-9), dx=Math.max(L.mw,0)/mReg;
         e9=Math.abs(Math.max(L.mw,0)-mReg*dx)/Math.max(Math.abs(L.mw),1e-12); d9=nsep(e9.toExponential(1)); }
  add("C9","k9",e9<1e-9,"Δ = "+d9);

  // C10 a method called applicable really reaches the required supply dew point
  let worst=1e30, n10=0;
  MS.forEach(m=>{ if(m.ok&&typeof m.tdAch==="number"&&isFinite(m.tdAch)){
    const marg=L.tdSup-m.tdAch; worst=Math.min(worst,marg); if(marg<-0.05) n10++; } });
  if(worst>=1e29) worst=0;
  add("C10","k10",n10===0,fnum(worst,2)+" K");

  // C11 the same guards hold over the whole range of the comparison chart
  const s11=S||{badAbove:0,badE:0,badQ:0};
  add("C11","k11",(s11.badAbove|0)+(s11.badE|0)+(s11.badQ|0)===0,
      String((s11.badAbove|0)+(s11.badE|0)+(s11.badQ|0)));

  // C13 the regeneration flow window is applied to the flow that is really heated and blown:
  //     the demand is swept from below the floor to twice the ceiling, and for every demand the
  //     wheel either refuses or stays inside the window with its pickup below the declared limit
  let n13=0, worst13=0;
  if(L.mda>0&&P.dxreg>0){
    const fmax=(P.fregmax/100)*L.mda, fmin=Math.min((P.fregmin/100)*L.mda,fmax);
    for(let k=0;k<=40;k++){
      const demand=(k/20)*fmax*(P.dxreg/1000);
      const G=regenFlow(P,L,demand);
      if(G.over) continue;
      const f=G.mReg/L.mda;
      if(f>worst13) worst13=f;
      if(!(G.mReg<=fmax*(1+1e-9))) n13++;
      if(!(G.mReg>=fmin*(1-1e-9))) n13++;
      if(!(G.mReg<=Math.max(G.tot,fmin)*(1+1e-9))) n13++;
      if(demand>0&&!(demand/(G.mReg*G.eff)<=P.dxreg/1000*(1+1e-9))) n13++;
    }
  }
  add("C13","k13",n13===0,fnum(worst13*100,2)+" %");

  return C;
}

/* ============================================================
   SWEEP FOR THE COMPARISON CHART
   ============================================================ */
function sweep(P){
  const out={td:[],e:[[],[],[],[]],badAbove:0,badE:0,badQ:0};
  for(let td=15;td>=-60;td-=1){
    const L=computeLoad(P,td);
    out.td.push(td);
    if(!L.ok){ for(let i=0;i<4;i++) out.e[i].push(null); continue; }
    const MS=[methodCool(P,L),methodFreeze(P,L),methodDesiccant(P,L),methodHeatPump(P,L)];
    for(let i=0;i<4;i++){
      const m=MS[i];
      if(m.ok){
        if(td>P.troom+1e-9) out.badAbove++;
        if(!(m.e>0)||!isFinite(m.e)) out.badE++;
        if(dutyBad(m.qc,m.qh)) out.badQ++;
      }
      out.e[i].push((m.ok&&isFinite(m.e)&&m.e>0&&m.e<1e5)?m.e:null);
    }
  }
  return out;
}

/* ============================================================
   SVG HELPERS
   ============================================================ */
/* Spec 10: label size is physical, not scaled. Both charts are drawn in a fixed
   580-unit viewBox that the stage scales down on a narrow screen, which used to take
   the tick labels to about 6 px at 390 px wide. The text is therefore drawn in user
   units scaled by the same factor the stage shrinks the picture by, so it lands at
   the same physical size at every width. Nothing else about the drawing changes. */
const SVGW=580;
let TXF=10,PSY_VIEW=null;
function txf(px){ return Math.min(18, Math.max(10, 10*SVGW/Math.max(px||SVGW,160))); }
function svgOpen(w,h,alab){ return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" preserveAspectRatio="xMidYMid meet" '+
  'style="max-width:'+w+'px;background:transparent" xmlns="http://www.w3.org/2000/svg" role="img" '+
  'aria-label="'+esc(alab||"")+'"><title>'+esc(alab||"")+'</title>'; }
function ln(x1,y1,x2,y2,st){ return '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+
  '" y2="'+y2.toFixed(1)+'" style="'+st+'"/>'; }
function tx(x,y,s,st,anc){ return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="'+(anc||"middle")+
  '" style="font-size:'+TXF+'px;'+(st||"fill:var(--muted)")+'">'+esc(s)+'</text>'; }

/* ---- psychrometric field ---- */
function drawPsy(P,L,MS){
  const W=580,H=400,ml=54,mr=16,mt=14,mb=42;
  const pw=W-ml-mr, ph=H-mt-mb;
  const xs=[L.x1*1000,Math.max(L.xSup,1e-6)*1000], ts=[L.t1,P.troom,P.tout];
  MS.forEach(m=>m.states.forEach(s=>{ xs.push(Math.max(s.x,1e-9)*1000); ts.push(s.t); }));
  let xmin=Math.min.apply(null,xs), xmax=Math.max.apply(null,xs);
  xmin=Math.max(0.0015,xmin/3); xmax=Math.min(120,Math.max(xmax*3,xmin*10));
  let tmin=Math.min.apply(null,ts)-8, tmax=Math.max.apply(null,ts)+10;
  tmin=Math.min(tmin,tdFromX(xmin/1000,L.p)-4);          // keep the saturation line inside the frame
  tmin=Math.max(-75,Math.min(tmin,-5)); tmax=Math.min(170,Math.max(tmax,35));
  const lx=(v)=>ml+(Math.log10(Math.max(v,xmin/2))-Math.log10(xmin))/(Math.log10(xmax)-Math.log10(xmin))*pw;
  const ly=(v)=>mt+ph-(v-tmin)/(tmax-tmin)*ph;
  PSY_VIEW={W,H,ml,mr,mt,mb,pw,ph,xmin,xmax,tmin,tmax};
  let s=svgOpen(W,H,T("h_psy"));
  s+='<rect x="'+ml+'" y="'+mt+'" width="'+pw+'" height="'+ph+'" style="fill:var(--panel);stroke:var(--line)"/>';
  // x grid at decades and 1-2-5
  for(let d=-4;d<=2;d++){ for(const m of [1,2,5]){ const v=m*Math.pow(10,d);
    if(v<xmin||v>xmax) continue; const X=lx(v);
    s+=ln(X,mt,X,mt+ph,"stroke:var(--line);stroke-width:"+(m===1?1:0.5));
    s+=tx(X,mt+ph+14,nsep(String(v))); } }
  // y grid
  const step=(tmax-tmin)>120?20:10;
  for(let t=Math.ceil(tmin/step)*step;t<=tmax;t+=step){ const Y=ly(t);
    s+=ln(ml,Y,ml+pw,Y,"stroke:var(--line);stroke-width:"+(t===0?1.2:0.5));
    s+=tx(ml-6,Y+3,fnum(t,0),"fill:var(--muted)","end"); }
  // saturation line
  let pts=[];
  for(let t=tmin;t<=tmax;t+=1){ const xv=satX(t,L.p)*1000; if(xv<xmin/2) continue; pts.push(lx(Math.min(xv,xmax))+","+ly(t)); }
  if(pts.length>1) s+='<polyline points="'+pts.join(" ")+'" style="fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:5 3"/>';
  // method paths
  MS.forEach((m,i)=>{ if(!m.states||!m.states.length) return;
    const col="var(--m"+(i+1)+")", dash=m.ok?"":";stroke-dasharray:6 4;opacity:.65";
    const pp=m.states.map(st=>lx(Math.max(st.x,1e-9)*1000)+","+ly(st.t));
    s+='<polyline points="'+pp.join(" ")+'" style="fill:none;stroke:'+col+';stroke-width:2.2;stroke-linejoin:round'+dash+'"/>';
    m.states.forEach((st,j)=>{ s+='<circle cx="'+lx(Math.max(st.x,1e-9)*1000).toFixed(1)+'" cy="'+ly(st.t).toFixed(1)+

function bindPsyDrag(host){
  if(!host||host.__psyDragBound)return;host.__psyDragBound=true;let mode=null;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const point=e=>{const V=PSY_VIEW,svg=host.querySelector('svg');if(!V||!svg)return null;const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*V.W,y=(e.clientY-r.top)/r.height*V.H;if(x<V.ml||x>V.ml+V.pw||y<V.mt||y>V.mt+V.ph)return null;const q=(x-V.ml)/V.pw,kg=Math.pow(10,Math.log10(V.xmin)+q*(Math.log10(V.xmax)-Math.log10(V.xmin))),t=V.tmax-(y-V.mt)/V.ph*(V.tmax-V.tmin);return{x:kg/1000,t};};
  const apply=e=>{const q=point(e);if(!q||!APP)return;const P=readInputs();
    if(mode==='inlet'){const phi=P.phi/100;if(phi<.02)return;const p=P.press*1000,xRoom=satX(P.tdreq,p),tout=(q.t-(1-phi)*P.troom)/phi,xout=(q.x-(1-phi)*xRoom)/phi;if(!(xout>0))return;const rh=100*rhFromX(tout,xout,p);APP.state.tout=clamp(tout,-40,55);APP.state.rhout=clamp(rh,1,100);}
    else if(mode==='target'){const troom=clamp(q.t,-30,45);APP.state.troom=troom;const P2=readInputs();P2.troom=troom;const L2=computeLoad(P2,P2.tdreq),rho=rhoDa(troom,L2.xRoom,L2.p),den=L2.xRoom-q.x;if(L2.internal>0&&den>1e-7)APP.state.flow=clamp(L2.internal/den/rho*3600,100,400000);}
    APP.sync();APP.run();};
  host.addEventListener('pointerdown',e=>{const h=e.target&&e.target.closest&&e.target.closest('[data-psy-drag]');if(!h||e.button!==0)return;mode=h.getAttribute('data-psy-drag');host.setPointerCapture?.(e.pointerId);host.style.cursor='grabbing';e.preventDefault();});
  host.addEventListener('pointermove',e=>{if(mode){apply(e);e.preventDefault();}});const up=e=>{if(!mode)return;mode=null;try{host.releasePointerCapture?.(e.pointerId)}catch(_e){}host.style.cursor='';};host.addEventListener('pointerup',up);host.addEventListener('pointercancel',up);
}

/* ---- specific energy chart ---- */
function drawEnergy(P,S,tdCur){
  const W=580,H=320,ml=54,mr=16,mt=14,mb=42;
  const pw=W-ml-mr, ph=H-mt-mb;
  let lo=1e9,hi=1e-9,any=false;
  S.e.forEach(a=>a.forEach(v=>{ if(v!==null){ any=true; lo=Math.min(lo,v); hi=Math.max(hi,v);} }));
  if(!any){ lo=0.1; hi=10; }
  lo=Math.max(0.02,Math.pow(10,Math.floor(Math.log10(lo)))); hi=Math.min(1e4,Math.pow(10,Math.ceil(Math.log10(hi))));
  if(hi<=lo) hi=lo*10;
  const x0=-60,x1=15;
  const px=(v)=>ml+(v-x0)/(x1-x0)*pw;
  const py=(v)=>mt+ph-(Math.log10(Math.min(Math.max(v,lo),hi))-Math.log10(lo))/(Math.log10(hi)-Math.log10(lo))*ph;
  let s=svgOpen(W,H,T("h_energy"));
  s+='<rect x="'+ml+'" y="'+mt+'" width="'+pw+'" height="'+ph+'" style="fill:var(--panel);stroke:var(--line)"/>';
  for(let t=x0;t<=x1;t+=15){ const X=px(t);
    s+=ln(X,mt,X,mt+ph,"stroke:var(--line);stroke-width:0.6");
    s+=tx(X,mt+ph+14,fnum(t,0)); }
  for(let d=Math.log10(lo);d<=Math.log10(hi)+1e-9;d+=1){ const v=Math.pow(10,d), Y=py(v);
    s+=ln(ml,Y,ml+pw,Y,"stroke:var(--line);stroke-width:0.6");
    s+=tx(ml-6,Y+3,v>=1?String(Math.round(v)):String(v),"fill:var(--muted)","end"); }
  S.e.forEach((arr,i)=>{
    const col="var(--m"+(i+1)+")";
    let run=[];
    const flush=()=>{ if(run.length>1) s+='<polyline points="'+run.join(" ")+'" style="fill:none;stroke:'+col+';stroke-width:2.2"/>';
      else if(run.length===1) s+='<circle cx="'+run[0].split(",")[0]+'" cy="'+run[0].split(",")[1]+'" r="2.2" style="fill:'+col+'"/>';
      run=[]; };
    arr.forEach((v,j)=>{ if(v===null){ flush(); return; } run.push(px(S.td[j]).toFixed(1)+","+py(v).toFixed(1)); });
    flush();
  });
  const XC=px(Math.min(Math.max(tdCur,x0),x1));
  s+=ln(XC,mt,XC,mt+ph,"stroke:var(--acc2);stroke-width:1.6;stroke-dasharray:4 3");
  s+=tx(XC,mt+10,fnum(tdCur,0)+" °C","fill:var(--acc2)");
  s+=tx(ml+pw/2,H-6,T("ax_x2"));
  s+='<text x="14" y="'+(mt+ph/2)+'" text-anchor="middle" transform="rotate(-90 14 '+(mt+ph/2)+')" style="font-size:'+TXF+'px;fill:var(--muted)">'+esc(T("ax_y2"))+'</text>';
  s+='</svg>';
  return s;
}

/* The structural checks run on every recalculation. Their detail is internal and
   stays in a hidden container. Nothing is written out while everything passes; a
   single record is left only when a check did not pass. The interface itself shows
   one short warning in the user's language, without codes. */
let chkSig="";
function renderChecks(C){
  const host=el("val-out");
  if(host) host.innerHTML=C.map(c=>'<div class="flag '+(c.pass?"ok":"bad")+'"><span class="code">'+c.code+
    '</span><span>'+esc(T(c.key))+' <span class="mini">('+esc(c.detail)+')</span></span></div>').join("");
  const bad=C.filter(c=>!c.pass);
  const w=el("chkWarn");
  if(w){ w.textContent=bad.length?T("w_chk"):""; w.hidden=bad.length===0; }
  const sig=bad.map(c=>c.code).join(",")+"/"+C.length;
  if(sig!==chkSig){
    chkSig=sig;
    if(bad.length){
      try{
        console.warn("Dehumidification Method Selector — structural checks: "+
          bad.length+" of "+C.length+" did not pass",bad.map(c=>c.code+" "+c.detail).join("; "));
      }catch(e){}
    }
  }
}

const DGC_IN_UNITS={tout:"°C",rhout:"%",press:"kPa",troom:"°C",tdreq:"°C",dtsafe:"K",
  tsurf:"°C",np:"-",gp:"g/h per person",prod:"kg/h",vol:"m³",ach:"1/h",adoor:"m²",
  dopen:"min per hour",kdoor:"m/s",phi:"%",flow:"m³/h",dpfan:"Pa",etafan:"%",bf:"-",
  adpmin:"°C",appr:"K",tcond:"°C",etac:"% of Carnot",reheat:"",tsfzlim:"°C",mice:"kg",
  tdef:"min",etadef:"%",etarot:"-",treg:"°C",fregmin:"%",fregmax:"%",dxreg:"g/kg",
  purge:"%",carry:"%",regsrc:"",tehp:"°C",etachp:"% of Carnot",s_el:"",s_cw:"",s_gas:"",
  s_hw:"",thw:"°C",s_rec:"",trec:"°C"};

  internal_load:"kg/h",total_load:"kg/h",water_removed:"kg/h"};
["m1","m2","m3","m4"].forEach(m=>{DGC_OUT_UNITS[m+"_feasible"]="";
  DGC_OUT_UNITS[m+"_td_attainable"]="°C";DGC_OUT_UNITS[m+"_e"]="kWh/kg";
  DGC_OUT_UNITS[m+"_qc"]="kW";DGC_OUT_UNITS[m+"_qh"]="kW";DGC_OUT_UNITS[m+"_el"]="kW";
  DGC_OUT_UNITS[m+"_water"]="kg/h";});
let DGC_LAST=null;
function dgcSerialize(){ return {v:2,lang:LANG,P:readInputs()}; }
function dgcDeserialize(st){
  if(!st||typeof st!=="object"||!st.P) throw new Error("unrecognised state payload for the dehumidification selector");
  const target=ST();
  const langChanged=(st.lang&&LANGS.indexOf(st.lang)>=0&&st.lang!==LANG);
  if(st.lang&&LANGS.indexOf(st.lang)>=0) LANG=st.lang;
  /* the same coercion the controls used to perform when the values were written
     into them: an unusable number falls back to the declared default and an unknown
     select value is ignored, so a malformed link cannot poison the state */
  CTRL.forEach(g=>g.items.forEach(it=>{
    if(!(it.id in st.P)) return;
    const v=st.P[it.id];
    if(it.t==="chk"){ target[it.id]=!!v; return; }
    if(it.t==="sel"){ if(it.o.some(o=>o[0]===String(v))) target[it.id]=String(v); return; }
    const n=parseFloat(v);
    target[it.id]=isFinite(n)?n:it.v;
  }));
  if(BARE){ bareRelabel(); return; }
  if(langChanged&&APP){ APP.setLang(LANG); return; }   /* rebuild syncs and runs */
  syncAndRun();
}

function dgcRecord(){
  const S=DGC_LAST; if(!S) return null;
  const P=S.P,L=S.L,MS=S.MS;
  const out={mda:L.mda,x_room:L.xRoom*1000,x_supply:L.xSup*1000,td_supply:L.ok?L.tdSup:null,
    internal_load:L.internal*3600,total_load:L.total*3600,water_removed:L.mw*3600};
  MS.forEach((m,i)=>{const k="m"+(i+1)+"_";
    out[k+"feasible"]=!!m.ok; out[k+"td_attainable"]=(m.tdAch==null)?null:m.tdAch;
    out[k+"e"]=m.ok?m.e:null; out[k+"qc"]=m.ok?m.qc:null; out[k+"qh"]=m.ok?m.qh:null;
    out[k+"el"]=m.ok?m.el:null; out[k+"water"]=m.ok?m.mw*3600:null;});
  const warn=[];
  if(L.above) warn.push(tf("w_above",{a:fnum(P.tdreq,1),b:fnum(P.troom,1)}));
  MS.forEach((m,i)=>{ if(!m.ok&&m.reason) warn.push(T("m"+(i+1))+": "+tf(m.reason[0],m.reason[1])); });
  const hp=MS[3]; if(hp&&hp.ok) warn.push(T("n_basis"));
  return {inputs:P,outputs:out,units:Object.assign({},DGC_IN_UNITS,DGC_OUT_UNITS),
    model:{equations:[
      "p_ws(t): ASHRAE Fundamentals 2017 Ch.1 Eq.(5) over ice, Eq.(6) over liquid water",
      "W = 0.621945 p_v/(p - p_v)   (Eq.20);  h = 1.006 t + W(2501 + 1.86 t) kJ/kg(da)   (Eq.30)",
      "room moisture balance: mda (x_room - x_sup) = G_people + G_product + G_leak + G_door",
      "water removed by the unit: mw = mda (x1 - x_sup) = internal load + make-up air load",
      "coil with bypass factor b: x2 = b x1 + (1-b) x_sat(ts),  t2 = b t1 + (1-b) ts",
      "wet coil energy balance: q_c = mda[(h1 - h2) - (x1 - x2) h_w],  h_w = 4.186 ts above 0 °C and 2.05 ts - 333.6 below (frost)",
      "reheat to the room state: q_h = mda (h3 - h2),  h3 = h(t_room, x_sup)",
      "COP = f (T_evap)/(T_cond - T_evap), f the stated fraction of Carnot",
      "freeze-out defrost: E_def = m_ice (333.6 + 2.05 |ts| + 4.186·5)/(t_dry + t_def)/η_def",
      "rotor moisture balance: mda (x1 - x_sup) = m_reg (x_reg,out - x_out)",
      "rotor regeneration heat: q_reg = m_reg [h(t_reg, x_out) - h(t_out, x_out)]",
      "rotor process side is taken isenthalpic: t2 = t(h1, x_sup)",
      "heat-pump unit: q_cond = q_evap + P_comp,  t3 = t2 + (q_evap + P_comp)/(mda c_p)",
      "specific energy: e = site energy / water removed, kWh per kg"],
      ranges:[
        "Steady state, one mixed room state, one coil bypass factor, one rotor effectiveness.",
        "Chiller and heat pump follow a fraction of Carnot, not manufacturer curves.",
        "The rotor floor follows an empirical line in regeneration temperature, not a sorption isotherm.",
        "Below 0 °C the saturation pressure is taken over ice, so every dew point below zero is a frost point.",
        "A required dew point above the room temperature is refused, not extrapolated."],
      notes:[T("n_basis"),
        "Fan power is charged as electricity but is not added to the air enthalpy in any of the four paths.",
        "Energy is site energy: no primary-energy or tariff weighting."]},
    warnings:warn};
}

    notes:MS.map((m,i)=>T("m"+(i+1))+": "+(m.ok?tf(m.verdict[0],m.verdict[1]):tf(m.reason[0],m.reason[1])))
      .concat([T("n_basis")])});
  secs.push({title:T("h_dry"),cols:"1fr 28mm 20mm",
    head:[T("h_dry"),"kg/h","%"],
    rows:[["d_people",L.people],["d_prod",L.prod],["d_leak",L.leak],["d_door",L.door],

      .concat([[T("d_int"),fnum(L.internal*3600,3),""],[T("d_tot"),fnum(L.total*3600,3),""]])});

function dgcHandoffBuild(){

    p:{value:P.press*1000,unit:"Pa"},

/* One sentence per refused quantity, in the page's own language, beside the
   framework's own "ignored" line (AGENTS 2.4). */
function hoSay(msg){try{if(window.Diagram&&Diagram.notify)Diagram.notify(msg,"warn");}catch(e){}}

function dgcHandoffApply(payload){
  const q=(payload&&payload.quantities)||{};
  const accepted=[],ignored=[];
  let Tk=null,w=null,pp=null;
  Object.keys(q).forEach(k=>{
    const v=q[k]&&q[k].value;
    if(!isFinite(v)){ignored.push(k);return;}
    if(k==="T") Tk=v; else if(k==="w") w=v; else if(k==="p") pp=v; else ignored.push(k);
  });
  /* an incoming air state is applied to the OUTDOOR air, which is the only measured
     state this tool takes; the room state is a design target and is never overwritten.
     A value outside the bound of the field that receives it writes nothing and one sentence
     names the quantity, the figure that arrived and that bound. */
  const st=ST(),R=HO_RANGE;
  /* A refused quantity goes into neither list: the framework renders anything in `ignored`
     as "this tool does not use them", which is false of a name the manifest accepts. */
  const said=[];
  const refuse=(k,v,r,d)=>{said.push(k);
    hoSay(tf("hoRangeNo",{q:k,v:fnum(v,d),u:r.unit,a:fnum(r.lo,d),b:fnum(r.hi,d)}));};
  /* p - the barometric pressure field, 60 000-110 000 Pa */
  if(pp!=null){
    if(pp>=R.p.lo&&pp<=R.p.hi){ st.press=Math.round(pp/10)/100; accepted.push("p"); }
    else refuse("p",pp,R.p,0);
  }
  /* T - the outdoor dry-bulb field, 233,15-328,15 K */
  if(Tk!=null){
    if(Tk>=R.T.lo&&Tk<=R.T.hi){ st.tout=Math.round((Tk-273.15)*10)/10; accepted.push("T"); }
    else refuse("T",Tk,R.T,2);
  }
  /* w is held in no field of this page: it is carried as the relative humidity of the
     1-100 % field, so a value outside that band is applied at the edge and the figure
     received, the figure used and the edge are all shown. Only a w that forms no relative
     humidity at all is refused. */
  if(w!=null){
    const P0=readInputs(),p=P0.press*1000,t=P0.tout,es=pws(t);
    const rh=100*(p*w/(RATIO+w))/es;
    if(w>0&&isFinite(rh)&&rh>0&&p>es){
      const used=Math.min(R.rh.hi,Math.max(R.rh.lo,rh));
      st.rhout=Math.round(used*10)/10; accepted.push("w");
      if(rh<R.rh.lo||rh>R.rh.hi)
        hoSay(tf("hoClampRh",{v:fnum(w,5),r:fnum(rh,4),a:fnum(R.rh.lo,2),b:fnum(R.rh.hi,2),
          e:fnum(used,2)}));
    }else{
      said.push("w");
      hoSay(tf("hoRangeSat",{v:fnum(p,0),t:fnum(t+273.15,2),e:fnum(es,0)}));
    }
  }
  syncAndRun();
  return {accepted:accepted,ignored:ignored};
}

/* --- python export: the full four-path model of this page --- */
const PY_SRC=`RA = 287.042
RATIO = 0.621945
CPA, CPV, HFG = 1.006, 1.86, 2501.0
CW, CICE, HFUS = 4.186, 2.05, 333.6


def pws(t):
    """ASHRAE F-2017 Ch.1 Eq.(5) over ice, Eq.(6) over water, Pa"""
    K = t + 273.15
    if K <= 0:
        return 1e-9
    if t >= 0:
        return math.exp(-5800.2206 / K + 1.3914993 - 0.048640239 * K
                        + 4.1764768e-5 * K * K - 1.4452093e-8 * K ** 3
                        + 6.5459673 * math.log(K))
    return math.exp(-5674.5359 / K + 6.3925247 - 0.009677843 * K
                    + 6.2215701e-7 * K * K + 2.0747825e-9 * K ** 3
                    - 9.484024e-13 * K ** 4 + 4.1635019 * math.log(K))


def x_from_pv(pv, p):
    q = min(max(pv, 0.0), p * 0.999999)
    return RATIO * q / (p - q)


def pv_from_x(x, p):
    return p * max(x, 0.0) / (RATIO + max(x, 0.0))


def satx(t, p):
    return x_from_pv(min(pws(t), p * 0.999), p)


def td_from_x(x, p):
    pv = pv_from_x(x, p)
    if pv <= pws(-100):
        return -100.0
    if pv >= pws(100):
        return 100.0
    lo, hi = -100.0, 100.0
    for _ in range(80):
        mid = 0.5 * (lo + hi)
        if pws(mid) < pv:
            lo = mid
        else:
            hi = mid
    return 0.5 * (lo + hi)


def enth(t, x):
    return CPA * t + x * (HFG + CPV * t)


def t_from_hx(h, x):
    return (h - HFG * x) / (CPA + CPV * x)


def rho_da(t, x, p):
    return (p - pv_from_x(x, p)) / (RA * (t + 273.15))


def rh_from_x(t, x, p):
    s = pws(t)
    return 0.0 if s <= 0 else pv_from_x(x, p) / s


def hw_cond(ts):
    """enthalpy of the water leaving the coil, kJ/kg (liquid above 0 C, ice below)"""
    return CW * ts if ts >= 0 else (CICE * ts - HFUS)


def load(tdreq, scale=1.0):
    p = PRESS * 1000.0
    x_out = x_from_pv(min(RHOUT / 100.0 * pws(TOUT), p * 0.98), p)
    x_room = satx(tdreq, p)
    mda = FLOW / 3600.0 * rho_da(TROOM, x_room, p)
    rho_out = rho_da(TOUT, x_out, p)
    phi = PHI / 100.0
    L = dict(p=p, x_out=x_out, x_room=x_room, mda=mda, phi=phi)
    L['internal'] = scale * (NP * GP / 1000.0 / 3600.0 + PROD / 3600.0
                             + ACH * VOL / 3600.0 * rho_out * (x_out - x_room)
                             + ADOOR * KDOOR * (DOPEN / 60.0) * rho_out * (x_out - x_room))
    L['make'] = mda * phi * (x_out - x_room)
    L['x_sup'] = x_room - L['internal'] / mda
    L['x1'] = (1 - phi) * x_room + phi * x_out
    L['t1'] = (1 - phi) * TROOM + phi * TOUT
    L['mw'] = mda * (L['x1'] - L['x_sup'])
    L['total'] = L['internal'] + L['make']
    L['h1'] = enth(L['t1'], L['x1'])
    L['h3'] = enth(TROOM, max(L['x_sup'], 0.0))
    L['td_sup'] = td_from_x(L['x_sup'], p) if L['x_sup'] > 0 else -100.0
    L['above'] = tdreq > TROOM + 1e-9
    L['ok'] = (L['x_sup'] > 0) and (L['mw'] > 0) and not L['above']
    return L


def coil(L, surf_limit):
    p = L['p']
    R = {}
    R['xs_need'] = (L['x_sup'] - BF * L['x1']) / (1 - BF)
    R['bypass_fail'] = R['xs_need'] <= 1e-9
    R['ts_req'] = -100.0 if R['bypass_fail'] else td_from_x(R['xs_need'], p)
    R['x_ach'] = min(BF * L['x1'] + (1 - BF) * satx(surf_limit, p), L['x1'])
    R['td_ach'] = td_from_x(max(R['x_ach'], 1e-12), p)
    R['limit_fail'] = R['bypass_fail'] or (R['ts_req'] < surf_limit)
    ts = surf_limit if R['limit_fail'] else R['ts_req']
    R['ts'] = ts
    R['t2'] = BF * L['t1'] + (1 - BF) * ts
    R['x2'] = R['x_ach'] if R['limit_fail'] else L['x_sup']
    R['h2'] = enth(R['t2'], R['x2'])
    R['mw'] = L['mda'] * (L['x1'] - R['x2'])
    R['qc'] = L['mda'] * (L['h1'] - R['h2']) - R['mw'] * hw_cond(ts)
    R['qh'] = L['mda'] * (L['h3'] - R['h2'])
    return R


def cop_cool(te, tc, frac):
    return max(frac * (te + 273.15) / max((tc + 273.15) - (te + 273.15), 3.0), 0.2)


def fan_kw(extra):
    return FLOW / 3600.0 * (DPFAN + extra) / (ETAFAN / 100.0) / 1000.0


def src_on(mode):
    return {'elec': S_EL, 'gas': S_GAS, 'hw': S_HW, 'rec': S_REC, 'cond': S_EL}.get(mode, False)


def src_temp(mode):
    return {'elec': 900 if S_EL else -273, 'gas': 900 if S_GAS else -273,
            'hw': THW if S_HW else -273, 'rec': TREC if S_REC else -273,
            'cond': 900}.get(mode, -273)


def reheat_energy(qh, cond_avail):
    if not src_on(REHEAT) or src_temp(REHEAT) < TROOM + 10:
        return None
    if REHEAT == 'cond':
        d = max(0.0, qh - cond_avail)
        return dict(site=d, el=d)
    if REHEAT == 'elec':
        return dict(site=qh, el=qh)
    if REHEAT == 'gas':
        return dict(site=qh / 0.9, el=0.0)
    return dict(site=qh, el=0.0)


def m_cool(L):
    C = coil(L, ADPMIN)
    R = dict(ok=False, td_ach=C['td_ach'])
    if C['bypass_fail'] or C['limit_fail'] or not (S_EL or S_CW) or not S_EL:
        return R
    te = C['ts_req'] - APPR
    pcool = C['qc'] / cop_cool(te, TCOND, ETAC / 100.0)
    fan = fan_kw(250)
    RH = reheat_energy(C['qh'], C['qc'] + pcool)
    if RH is None or C['qc'] < -1e-9 or C['qh'] < -1e-9:
        return R
    R.update(ok=True, qc=C['qc'], qh=C['qh'], water=C['mw'] * 3600.0, ts=C['ts_req'],
             el=pcool + fan + RH['el'], site=pcool + fan + RH['site'])
    R['e'] = R['site'] / max(C['mw'] * 3600.0, 1e-12)
    return R


def m_freeze(L):
    C = coil(L, TSFZLIM)
    R = dict(ok=False, td_ach=C['td_ach'])
    if C['bypass_fail'] or C['limit_fail'] or not (S_EL or S_CW) or not S_EL:
        return R
    frosting = C['ts_req'] < 0
    t_dry = MICE / C['mw'] if C['mw'] > 1e-12 else 1e9
    if frosting and t_dry < TDEF * 60.0:
        return R
    te = C['ts_req'] - APPR
    pcool = C['qc'] / cop_cool(te, TCOND, ETAC / 100.0)
    e_def = (MICE * (HFUS + CICE * max(0 - C['ts_req'], 0) + CW * 5)
             / (t_dry + TDEF * 60.0) / (ETADEF / 100.0)) if frosting else 0.0
    fan = fan_kw(350)
    RH = reheat_energy(C['qh'], C['qc'] + pcool)
    if RH is None or C['qc'] < -1e-9 or C['qh'] < -1e-9:
        return R
    R.update(ok=True, qc=C['qc'], qh=C['qh'] + e_def, water=C['mw'] * 3600.0,
             ts=C['ts_req'], t_dry=t_dry / 60.0,
             el=pcool + fan + e_def + RH['el'], site=pcool + fan + e_def + RH['site'])
    R['e'] = R['site'] / max(C['mw'] * 3600.0, 1e-12)
    return R


def m_desiccant(L):
    p = L['p']
    td_floor = min(-10.0, max(-75.0, -35 - 0.75 * (TREG - 80)))
    x_ideal = satx(td_floor, p) + (1 - ETAROT) * (L['x1'] - satx(td_floor, p))
    x_rot = max(x_ideal + (CARRY / 100.0) * (L['x1'] - x_ideal), 1e-9)
    R = dict(ok=False, td_ach=td_from_x(x_rot, p))
    if x_rot > L['x_sup'] or not src_on(REGSRC) or src_temp(REGSRC) < TREG:
        return R
    mw = L['mda'] * (L['x1'] - L['x_sup'])
    eff = max(1 - PURGE / 100.0, 1e-6)
    tot = max(mw, 0.0) / (DXREG / 1000.0) / eff
    fmin, fmax = FREGMIN / 100.0 * L['mda'], FREGMAX / 100.0 * L['mda']
    if fmin > fmax or tot > fmax:
        return R
    m_reg = min(max(tot, min(fmin, fmax)), fmax)
    dx_reg = mw / m_reg
    h_reg_in = enth(TREG, L['x_out'])
    q_reg = m_reg * (h_reg_in - enth(TOUT, L['x_out']))
    t_reg_ex = t_from_hx(h_reg_in, L['x_out'] + dx_reg)
    if rh_from_x(t_reg_ex, L['x_out'] + dx_reg, p) > 1:
        return R
    t2r = t_from_hx(L['h1'], L['x_sup'])
    q_post = L['mda'] * (enth(t2r, L['x_sup']) - L['h3'])
    p_post = q_post / cop_cool(TROOM - 8 - APPR, TCOND, ETAC / 100.0) if q_post > 0 else 0.0
    fan = fan_kw(450) + m_reg / max(L['mda'], 1e-9) * fan_kw(300)
    if not S_EL:
        return R
    reg_site = q_reg / 0.9 if REGSRC == 'gas' else q_reg
    R.update(ok=True, qc=max(q_post, 0.0), qh=q_reg, water=mw * 3600.0,
             m_reg=m_reg, dx_reg=dx_reg * 1000.0, t_reg_ex=t_reg_ex,
             el=p_post + fan + (q_reg if REGSRC == 'elec' else 0.0),
             site=p_post + fan + reg_site)
    R['e'] = R['site'] / max(mw * 3600.0, 1e-12)
    return R


def m_heatpump(L):
    C = coil(L, TEHP)
    R = dict(ok=False, td_ach=C['td_ach'])
    if C['bypass_fail'] or C['limit_fail'] or not S_EL:
        return R
    te = C['ts_req'] - APPR
    cpm = CPA + CPV * max(L['x_sup'], 0.0)
    pc, t3 = C['qc'] / 3.0, TROOM
    for _ in range(12):
        pc = C['qc'] / cop_cool(te, t3 + 12, ETACHP / 100.0)
        t3 = C['t2'] + (C['qc'] + pc) / (L['mda'] * cpm)
    fan = fan_kw(250)
    R.update(ok=True, qc=C['qc'], qh=C['qc'] + pc, water=C['mw'] * 3600.0,
             ts=C['ts_req'], t3=t3, el=pc + fan, site=pc + fan)
    R['e'] = R['site'] / max(C['mw'] * 3600.0, 1e-12)
    return R


def compute():
    L = load(TDREQ)
    out = dict(mda=L['mda'], x_room=L['x_room'] * 1000.0,
               x_supply=L['x_sup'] * 1000.0, td_supply=L['td_sup'],
               internal_load=L['internal'] * 3600.0, total_load=L['total'] * 3600.0,
               water_removed=L['mw'] * 3600.0)
    ms = [m_cool(L), m_freeze(L), m_desiccant(L), m_heatpump(L)] if L['ok'] else \
         [dict(ok=False, td_ach=None) for _ in range(4)]
    for i, m in enumerate(ms):
        k = 'm%d_' % (i + 1)
        out[k + 'feasible'] = bool(m['ok'])
        out[k + 'td_attainable'] = m.get('td_ach')
        for f in ('e', 'qc', 'qh', 'el', 'water'):
            out[k + f] = m.get(f) if m['ok'] else None
    return out

const HASUNIT={tout:1,rhout:1,press:1,troom:1,tdreq:1,dtsafe:1,tsurf:1,gp:1,prod:1,vol:1,
  ach:1,adoor:1,dopen:1,kdoor:1,phi:1,flow:1,dpfan:1,etafan:1,adpmin:1,appr:1,tcond:1,

function ilab(it){ return HASUNIT[it.id]?cut(T(it.k)):{label:T(it.k),unit:""}; }
/* the page numbers its own sections S1..S6, P1..P3, R1..R4 and its notes refer to

function code(c,k){ return c+" · "+T(k); }

/* The provenance tooltips the register already carries become learn topics on the

const LEARNOF={gp:"sb_pers",kdoor:"sb_door",dtsafe:"sb_dts",bf:"sb_bf",adpmin:"sb_frost",
  etac:"sb_cop",etachp:"sb_cop",tsfzlim:"sb_ref",mice:"sb_ice",tdef:"sb_ice",etarot:"sb_rot",

function fieldOf(it){
  const base={id:"f-"+it.id,key:it.id,label:()=>ilab(it).label,learn:LEARNOF[it.id]||null};
  if(it.t==="chk") return Object.assign(base,{type:"toggle"});
  if(it.t==="sel") return Object.assign(base,{type:"select",
    options:()=>it.o.map(o=>[o[0],T(o[1])])});
  const u=ilab(it).unit;
  return Object.assign(base,{type:it.t==="rng"?"range":"number",
    min:it.min,max:it.max,step:it.step,
    /* display = unit is the framework's identity conversion: the state, the record,
       the permalink, the report and the python export keep the units the v2 contract
       already documents for this tool. */
    unit:u||null,display:u||null,
    precision:it.dec!=null?it.dec:null});
}
/* a field reads its unit text once, when it is built, and the unit is localised too */
function relabelUnits(list){
  list.forEach(p=>(p.fields||[]).forEach(f=>{
    const it=ITEM[f.key]; if(!it||it.t==="chk"||it.t==="sel") return;
    const u=ilab(it).unit; f.unit=u||null; f.display=u||null;
  }));
}

function panelDefs(){
  /* the lead paragraph the page has always opened with, kept visible above the first
     field; the same text is learn.intro, so the header ? repeats it rather than
     hiding it behind a modal */
  const out=[{slot:"inputs",id:"ont-intro",
    render:(box)=>{ box.appendChild(mk("p",{class:"dgu-hint",id:"intro"},esc(T("intro")))); }}];
  CTRL.forEach(g=>out.push({slot:"inputs",id:"ont-"+g.code.toLowerCase(),
    title:()=>code(g.code,g.h),learn:SECLEARN[g.code],fields:g.items.map(fieldOf)}));
  /* placement law: Reset lives in the inputs footer, under that name */
  out.push({slot:"inputs",id:"ont-reset",render:(box,ctx)=>{
    const row=mk("div",{class:"dgu-panel-actions"});
    row.appendChild(ctx.app.actionButton(ctx.app.resetAction()));

  return out;
}

let badgesBound=false;
function bindBadges(){
  if(badgesBound) return; badgesBound=true;
  document.addEventListener("click",(ev)=>{
    const t=ev.target;
    if(!t||!t.closest) return;
    const pb=t.closest("[data-sb]"), cb=t.closest("[data-cat]");
    if(!pb&&!cb) return;
    ev.preventDefault();
    const key=pb?("sb_"+pb.getAttribute("data-sb")):("cat_"+cb.getAttribute("data-cat"));
    if(APP&&APP.learn) APP.learn.show(key,pb||cb);
  });
}
/* the provenance badges qualify the field they sit on; the framework builds the
   label, so they are hung on it once the fields exist */
function attachBadges(){
  CTRL.forEach(g=>g.items.forEach(it=>{
    if(!it.sb) return;
    const lab=document.querySelector('[data-dgu-field="f-'+it.id+'"] .dgu-flabel');
    if(!lab||lab.querySelector(".sb")) return;
    lab.insertAdjacentHTML("beforeend",badge(it.sb));

/* min, max and step were attributes on the controls before the port and the
   browser's stepper and validity reporting still read them */
function applyNativeRanges(){
  CTRL.forEach(g=>g.items.forEach(it=>{
    if(it.t!=="num"&&it.t!=="rng") return;
    const c=el("f-"+it.id+"-c"); if(!c) return;
    c.min=String(it.min); c.max=String(it.max); c.step=String(it.step);
  }));
}

/* Framework defect, repaired locally; it belongs upstream. rebuild() — which runs on
   every language change — builds a NEW App, copies its own properties onto the old
   object and points DiagramUI.current at the old one, while the controls it just
   drew are bound to the new one. Every callback hands over the instance that made
   it, so the tool keeps its pointer on that one. */
function live(app){
  if(!app) return;
  if(app.node&&!document.contains(app.node)) return;
  APP=app;
  if(window.DiagramUI&&DiagramUI.current&&DiagramUI.current!==app) DiagramUI.current.state=app.state;
}

/* ---- the answer, as the framework renders it ---- */
function buildResults(){
  const S=DGC_LAST; if(!S) return null;
  const L=S.L,MS=S.MS;
  const order=MS.map((m,i)=>i).filter(i=>MS[i].ok).sort((a,b)=>MS[a].e-MS[b].e);
  const best=order.length?MS[order[0]]:null;
  const verdict=L.above?{tone:"bad",text:T("b_above")}
    :(!best?{tone:"bad",text:T("v_none")}
           :{tone:"ok",text:T(best.name)+" — "+tf(best.verdict[0],best.verdict[1])});
  const tile=(k,v,extra)=>{ const r=rlab(k);
    return Object.assign({label:r.label,value:v,hint:r.unit||null},extra||{}); };
  return {
    verdict:verdict,
    tiles:[
      tile("r_e",best?fnum(best.e,2):null,{tone:best?"ok":"bad",
        hint:best?T(best.name):null,learn:"ranking"}),
      tile("r_need",L.ok?fnum(L.tdSup,1):null,{learn:"ice"}),
      tile("d_tot",L.above?null:fnum(L.total*3600,3),{learn:"bal"}),
      tile("r_td",best?fnum(best.tdAch,1):null,{headline:false}),
      tile("r_cool",best?fnum(best.qc,1):null,{headline:false}),
      tile("r_heat",best?fnum(best.qh,1):null,{headline:false}),
      tile("r_el",best?fnum(best.el,1):null,{headline:false})
    ],
    nodes:[rankBox,condBox,dryBox]
  };
}

function buildControls(){
  let h="";
  CTRL.forEach(g=>{
    h+='<div class="card"><h2 class="ont-h"><span id="hh_'+g.h+'"></span></h2>';
    g.items.forEach(it=>{
      h+='<div class="row"><label for="i_'+it.id+'"><span id="lb_'+it.id+'"></span></label>'+
         '<span id="sbh_'+it.id+'"></span>';
      if(it.t==="num"){
        h+='<input type="number" id="i_'+it.id+'" value="'+it.v+'" min="'+it.min+'" max="'+it.max+'" step="'+it.step+'">';
      }else if(it.t==="rng"){
        h+='<span class="val" id="vv_'+it.id+'">'+it.v+'</span>'+
           '<input type="range" id="i_'+it.id+'" value="'+it.v+'" min="'+it.min+'" max="'+it.max+'" step="'+it.step+'">';
      }else if(it.t==="sel"){
        h+='<select id="i_'+it.id+'">'+
           it.o.map(o=>'<option value="'+o[0]+'"'+(o[0]===it.v?" selected":"")+'></option>').join("")+'</select>';
      }else{
        h+='<input type="checkbox" id="i_'+it.id+'"'+(it.v?" checked":"")+'>';
      }
      h+='</div>';
    });
    h+='</div>';
  });
  el("controls").innerHTML=h;
}
function bindBare(){
  CTRL.forEach(g=>g.items.forEach(it=>{
    const e=el("i_"+it.id); if(!e) return;
    const set=()=>{ const st=ST();
      if(it.t==="chk") st[it.id]=e.checked;
      else if(it.t==="sel") st[it.id]=e.value;
      else { const v=parseFloat(e.value); st[it.id]=isFinite(v)?v:e.value; }
      run(); };
    e.addEventListener("input",set);
    e.addEventListener("change",set);
  }));
}
function syncBare(){
  const st=ST();
  CTRL.forEach(g=>g.items.forEach(it=>{
    const e=el("i_"+it.id); if(!e) return;
    if(it.t==="chk") e.checked=!!st[it.id]; else e.value=String(st[it.id]);
  }));
}

  CTRL.forEach(g=>{
    const hh=el("hh_"+g.h); if(hh) hh.textContent=code(g.code,g.h);
    g.items.forEach(it=>{
      const lb=el("lb_"+it.id); if(lb) lb.textContent=T(it.k);
      const sbh=el("sbh_"+it.id); if(sbh) sbh.innerHTML=it.sb?badge(it.sb):"";
      if(it.t==="sel"){ const sel=el("i_"+it.id);
        if(sel) it.o.forEach((o,j)=>{ sel.options[j].textContent=T(o[1]); }); }
    });
  });
  fillStatic();
  run();
}

/* Framework defect, repaired locally; it belongs upstream. Below md the shared bar
   is not fixed: diagram-ui.js docks it into the flow, so the safe area is zero and
   the tour card is placed against the bottom of the viewport. Scroll to the end of
   the document with the tour open and the bar — which paints in its own z band, far
   above the tour — lands on the card's own buttons. The card is lifted by however
   much of the bar is on screen, and never past the top of the viewport. */
function liftTour(){
  const card=document.querySelector(".dgu-tour"); if(!card) return;
  card.style.marginTop="";
  let top=Infinity;
  ["dgc-bar","eng-disc-badge"].forEach(id=>{
    const n=document.getElementById(id); if(!n) return;
    const br=n.getBoundingClientRect();
    if(!(br.width>0&&br.height>0)) return;
    const cr=card.getBoundingClientRect();
    if(cr.bottom>br.top&&cr.top<br.bottom&&cr.left<br.right&&cr.right>br.left) top=Math.min(top,br.top);
  });
  if(!isFinite(top)) return;
  const cr=card.getBoundingClientRect();
  const shift=Math.min(cr.bottom-top+8,Math.max(0,cr.top-8));
  if(shift>0) card.style.marginTop=(-shift)+"px";
}
["scroll","resize","click","keyup"].forEach(ev=>{
  window.addEventListener(ev,()=>{ try{ liftTour(); }catch(e){} },{passive:true});
});

/* ================= boot ================= */
function syncAndRun(){
  if(APP){ APP.sync(); APP.run(); } else { syncBare(); run(); }
}
function boot(){
  initLang();
  if(!window.DiagramUI||DiagramUI.api!=="tools.petrov.re/ui/v1"){ bootBare(); dgcInit(); return; }
  const PANELS=panelDefs();
  APP=DiagramUI.app({
    id:"ontvochtiging",mount:"#app",layout:"calculator",compute:"live",
    lang:LANG,state:state,defaults:DEFAULTS,history:false,
    subtitle:()=>T("sub"),
    strings:{results:()=>code("R1","h_res")},
    learn:learnData(),
    panels:PANELS,
    regions:{results:(host,app)=>buildResultRegion(host,app),
             stage:(host,app)=>buildStageRegion(host,app)},
    footer:(host,app)=>buildFooter(host,app),
    on:{
      compute:(s,app)=>{ live(app); run(); return buildResults(); },
      reset:(fresh,app)=>{ live(app); state=fresh; },
      lang:(code)=>{ LANG=code; relabelUnits(PANELS); },
      ready:(app)=>{ live(app); app.examples(exampleList()); fillStatic();
                     attachBadges(); bindBadges(); applyNativeRanges(); }
    }
  });
  APP.ready();
  /* the data layer stays with diagram-common.js, and init is unconditional */
  dgcInit();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
else boot();
