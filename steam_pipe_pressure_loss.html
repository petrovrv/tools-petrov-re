    "fr": "Vapeur surchauffée traitée comme gaz parfait à température constante, avec une corrélation de viscosité de dégrossissage. Comparée à l’IAPWS-IF97 sur la même conduite, la perte est surestimée de 5,4 % au cas livré par défaut (20 bar, 300 °C), de 8,7 % à 100 bar/500 °C et de 41 % à 100 bar avec 10 K de surchauffe ; elle ne reste dans les 5 % qu’en dessous d’environ 10 bar, ou au-delà d’environ 100 K de surchauffe à 20 bar et 290 K à 100 bar, et dès environ 2 bar elle dépasse les 0,001 bar affichés. L’hypothèse isotherme plutôt qu’adiabatique coûte moins de 0,01 % au cas par défaut, mais 2 % à 90 % de la résistance critique et 14 % à 99,999 %. Les deux écarts vont dans le sens de la surestimation. Aucun test de saturation n’est effectué, et aucune formulation de la vapeur ne couvre le domaine au-delà de 100 MPa que les champs de saisie autorisent. Pas pour vapeur humide, flash, condensation, pertes thermiques, dénivelé ni dimensionnement réglementaire. Les entrées restent dans le domaine du modèle, saisies comme reçues par le transfert SI : pression amont 10 kPa à 200 MPa, température vapeur 300 à 1500 K, débit massique 0,001 à 100 000 kg/s, diamètre intérieur 1 mm à 5 m, longueur 0,01 m à 1000 km. Une valeur saisie hors borne est ramenée à cette borne et signalée ; une valeur reçue hors plage est nommée avec la plage et n'est pas appliquée.",

  "validation": {
    "basis": {
      "en": "The compressible pipe-flow relation and its inversion are graded against an independent reference written in Python along four structurally different routes: a closed-form Lambert-W inversion of the isothermal duct equation, which does no root-finding at all where the tool bisects; a 50-digit root of the same relation; a Gauss-Legendre quadrature in pressure that recovers the pipe length from the reported outlet and needs no marching step; and the friction factor against the published Swamee-Jain and laminar correlations, with Colebrook-White solved to convergence beside it. 51 cases driven through the page span the whole declared input box — 0.1 to 2000 bar, 300 to 1500 K, 1 mm to 5 m bore, 10 mm to 1000 km, hydraulically smooth to 50 mm roughness, laminar flow up to 99.999 per cent of the critical resistance and beyond it into choking — and give 447 independent checks, all passing, the largest relative residual 3.3e-9. The 28 in-page checks are merged and kept, labelled as self-checks. The page's own RK4 march, graded here against the closed form rather than against itself, stays within 2.9e-6 Pa of it even at 99.999 per cent of the critical resistance, against a printed resolution of 100 Pa, so its first step of L/1000 is adequate across the range. Measured against IAPWS-IF97, the declared ideal-gas isothermal model over-predicts the loss by 5.4 per cent at the shipped default and by up to 41 per cent near saturation at 100 bar, while the isothermal-versus-adiabatic spread stays below 0.01 per cent at the default and only reaches 14 per cent close to choking. Verification used an independent reference and the author's own harness; there has been no third-party review.",
      "uk": "Співвідношення для стисливої течії в трубі та його обернення перевірено за незалежним еталоном, написаним мовою Python чотирма структурно різними шляхами: замкнене обернення ізотермічного рівняння труби через функцію Ламберта W, яке взагалі не шукає кореня там, де інструмент застосовує бісекцію; корінь того самого співвідношення з 50 значущими цифрами; квадратура Гаусса-Лежандра за тиском, що відновлює довжину труби з наведеного виходу і не потребує кроку інтегрування; а також коефіцієнт тертя проти опублікованих кореляцій Swamee-Jain і ламінарної, поряд із рівнянням Colebrook-White, розв’язаним до збіжності. 51 випадок, проведений крізь сторінку, охоплює весь заявлений діапазон вводу — від 0,1 до 2000 бар, від 300 до 1500 K, діаметр від 1 мм до 5 м, довжину від 10 мм до 1000 км, від гідравлічно гладкої стінки до шорсткості 50 мм, від ламінарної течії до 99,999 % критичного опору і далі в режим запирання — і дає 447 незалежних перевірок, усі пройдені, з найбільшою відносною нев’язкою 3,3e-9. 28 перевірок усередині сторінки збережено й позначено як самоперевірки. Власний марш RK4 сторінки, перевірений тут проти замкненої форми, а не проти себе, відхиляється від неї не більш як на 2,9e-6 Па навіть за 99,999 % критичного опору, тоді як друкована роздільність становить 100 Па; отже, його перший крок L/1000 достатній у всьому діапазоні. За порівнянням з IAPWS-IF97 заявлена ізотермічна модель ідеального газу завищує втрату на 5,4 % для типового набору і до 41 % поблизу насичення за 100 бар, тоді як розбіжність між ізотермічним та адіабатичним випадками лишається нижчою за 0,01 % для типового набору і сягає 14 % лише поблизу запирання. Використано незалежний еталон і власний стенд автора; стороннього рецензування не було.",
      "de": "Die Beziehung für kompressible Rohrströmung und ihre Umkehrung werden gegen eine unabhängige, in Python geschriebene Referenz mit vier strukturell verschiedenen Wegen geprüft: eine geschlossene Umkehrung der isothermen Rohrgleichung über die Lambert-W-Funktion, die dort gar keine Nullstellensuche ausführt, wo das Werkzeug bisektiert; eine 50-stellige Nullstelle derselben Beziehung; eine Gauss-Legendre-Quadratur über den Druck, die die Rohrlänge aus dem ausgegebenen Austrittsdruck zurückgewinnt und keinen Integrationsschritt braucht; und den Reibungsbeiwert gegen die veröffentlichten Korrelationen von Swamee-Jain und den laminaren Zweig, daneben die bis zur Konvergenz gelöste Colebrook-White-Gleichung. 51 durch die Seite gefahrene Fälle decken den gesamten angegebenen Eingabebereich ab — 0,1 bis 2000 bar, 300 bis 1500 K, 1 mm bis 5 m Durchmesser, 10 mm bis 1000 km Länge, hydraulisch glatt bis 50 mm Rauheit, laminare Strömung bis 99,999 Prozent des kritischen Widerstands und darüber hinaus in die Sperrung — und ergeben 447 unabhängige Prüfungen, alle bestanden, mit dem größten relativen Residuum 3,3e-9. Die 28 seiteneigenen Prüfungen sind übernommen und als Selbstprüfungen gekennzeichnet. Der seiteneigene RK4-Marsch, hier gegen die geschlossene Form und nicht gegen sich selbst geprüft, weicht selbst bei 99,999 Prozent des kritischen Widerstands um höchstens 2,9e-6 Pa ab, bei einer gedruckten Auflösung von 100 Pa; sein erster Schritt L/1000 genügt also im gesamten Bereich. Gegen IAPWS-IF97 gemessen überschätzt das angegebene isotherme Idealgasmodell den Verlust im Auslieferungsfall um 5,4 Prozent und nahe der Sättigung bei 100 bar um bis zu 41 Prozent, während der Abstand zwischen isothermer und adiabater Rechnung im Auslieferungsfall unter 0,01 Prozent bleibt und erst nahe der Sperrung 14 Prozent erreicht. Geprüft wurde mit einer unabhängigen Referenz und dem eigenen Prüfstand des Autors; eine Begutachtung durch Dritte gab es nicht.",
      "nl": "De relatie voor compressibele leidingstroming en de inversie ervan worden getoetst aan een onafhankelijke, in Python geschreven referentie langs vier structureel verschillende routes: een gesloten inversie van de isotherme leidingvergelijking via de Lambert-W-functie, die daar in het geheel geen nulpunt zoekt waar de tool bisecteert; een 50-cijferig nulpunt van dezelfde relatie; een Gauss-Legendre-kwadratuur over de druk die de leidinglengte terugrekent uit de gerapporteerde uitlaatdruk en geen integratiestap nodig heeft; en de wrijvingsfactor tegen de gepubliceerde correlaties van Swamee-Jain en de laminaire tak, met daarnaast de tot convergentie opgeloste Colebrook-White-vergelijking. 51 door de pagina gedreven gevallen beslaan het volledige opgegeven invoerbereik — 0,1 tot 2000 bar, 300 tot 1500 K, 1 mm tot 5 m diameter, 10 mm tot 1000 km lengte, hydraulisch glad tot 50 mm ruwheid, laminaire stroming tot 99,999 procent van de kritische weerstand en daarvoorbij tot verstikking — en leveren 447 onafhankelijke controles op, alle geslaagd, met als grootste relatieve residu 3,3e-9. De 28 controles in de pagina zijn behouden en gemarkeerd als zelfcontroles. De eigen RK4-mars van de pagina, hier getoetst aan de gesloten vorm in plaats van aan zichzelf, wijkt zelfs bij 99,999 procent van de kritische weerstand hoogstens 2,9e-6 Pa af, bij een afgedrukte resolutie van 100 Pa; de eerste stap L/1000 volstaat dus over het hele bereik. Gemeten tegen IAPWS-IF97 overschat het opgegeven isotherme ideaalgasmodel het verlies met 5,4 procent bij de standaardinstelling en met tot 41 procent nabij verzadiging bij 100 bar, terwijl het verschil tussen isotherm en adiabatisch bij de standaardinstelling onder 0,01 procent blijft en pas dicht bij verstikking 14 procent bereikt. Er is gebruikgemaakt van een onafhankelijke referentie en het eigen testtuig van de auteur; beoordeling door derden heeft niet plaatsgevonden.",
      "fr": "La relation d’écoulement compressible en conduite et son inversion sont évaluées par rapport à une référence indépendante écrite en Python suivant quatre voies structurellement différentes : une inversion en forme close de l’équation isotherme par la fonction W de Lambert, qui ne cherche aucune racine là où l’outil procède par dichotomie ; une racine de la même relation à 50 chiffres ; une quadrature de Gauss-Legendre en pression qui reconstitue la longueur de conduite à partir de la pression aval rapportée, sans aucun pas d’intégration ; et le facteur de frottement comparé aux corrélations publiées de Swamee-Jain et à la branche laminaire, avec à côté l’équation de Colebrook-White résolue jusqu’à convergence. 51 cas passés par la page couvrent tout le domaine d’entrée déclaré — de 0,1 à 2000 bar, de 300 à 1500 K, de 1 mm à 5 m de diamètre, de 10 mm à 1000 km de longueur, du lisse hydraulique à 50 mm de rugosité, de l’écoulement laminaire jusqu’à 99,999 pour cent de la résistance critique puis au-delà en régime bloqué — et donnent 447 contrôles indépendants, tous réussis, le plus grand résidu relatif valant 3,3e-9. Les 28 contrôles internes à la page sont conservés et étiquetés comme auto-contrôles. La marche RK4 propre à la page, évaluée ici par rapport à la forme close et non par rapport à elle-même, en reste à moins de 2,9e-6 Pa même à 99,999 pour cent de la résistance critique, pour une résolution affichée de 100 Pa : son premier pas L/1000 suffit donc sur tout le domaine. Comparé à l’IAPWS-IF97, le modèle isotherme de gaz parfait déclaré surestime la perte de 5,4 pour cent au cas par défaut et jusqu’à 41 pour cent près de la saturation à 100 bar, tandis que l’écart entre isotherme et adiabatique reste sous 0,01 pour cent au cas par défaut et n’atteint 14 pour cent qu’à proximité du blocage. La vérification a utilisé une référence indépendante et le banc d’essai de l’auteur ; il n’y a pas eu de revue par un tiers.",
      "es": "La relación de flujo compresible en tubería y su inversión se evalúan frente a una referencia independiente escrita en Python por cuatro vías estructuralmente distintas: una inversión en forma cerrada de la ecuación isotérmica mediante la función W de Lambert, que no busca ninguna raíz allí donde la herramienta biseca; una raíz de la misma relación con 50 cifras; una cuadratura de Gauss-Legendre en presión que recupera la longitud de la tubería a partir de la presión de salida informada y no necesita paso de integración; y el factor de fricción frente a las correlaciones publicadas de Swamee-Jain y la rama laminar, junto con la ecuación de Colebrook-White resuelta hasta convergencia. 51 casos ejecutados a través de la página abarcan todo el dominio de entrada declarado — de 0,1 a 2000 bar, de 300 a 1500 K, de 1 mm a 5 m de diámetro, de 10 mm a 1000 km de longitud, de hidráulicamente liso a 50 mm de rugosidad, de flujo laminar hasta el 99,999 por ciento de la resistencia crítica y más allá hasta el bloqueo — y dan 447 comprobaciones independientes, todas superadas, con el mayor residuo relativo de 3,3e-9. Las 28 comprobaciones internas de la página se conservan y se etiquetan como autocomprobaciones. La propia marcha RK4 de la página, evaluada aquí frente a la forma cerrada y no frente a sí misma, se mantiene dentro de 2,9e-6 Pa incluso al 99,999 por ciento de la resistencia crítica, frente a una resolución impresa de 100 Pa, de modo que su primer paso L/1000 es suficiente en todo el rango. Medido frente a IAPWS-IF97, el modelo isotérmico de gas ideal declarado sobrestima la pérdida en un 5,4 por ciento en el caso por defecto y hasta un 41 por ciento cerca de la saturación a 100 bar, mientras que la diferencia entre isotérmico y adiabático se mantiene por debajo del 0,01 por ciento en el caso por defecto y solo alcanza el 14 por ciento cerca del bloqueo. La verificación empleó una referencia independiente y el banco de pruebas del propio autor; no ha habido revisión por terceros.",
      "pl": "Relacja przepływu ściśliwego w rurociągu i jej odwrócenie są oceniane względem niezależnego wzorca napisanego w Pythonie czterema strukturalnie różnymi drogami: odwrócenie izotermicznego równania rury w postaci zamkniętej przez funkcję W Lamberta, które nie szuka żadnego pierwiastka tam, gdzie narzędzie stosuje bisekcję; pierwiastek tej samej relacji wyznaczony z dokładnością 50 cyfr; kwadratura Gaussa-Legendre’a po ciśnieniu, która odtwarza długość rurociągu z podanego ciśnienia wylotowego i nie wymaga kroku całkowania; oraz współczynnik tarcia porównany z opublikowanymi korelacjami Swamee-Jaina i gałęzią laminarną, obok równania Colebrooka-White’a rozwiązanego do zbieżności. 51 przypadków przepuszczonych przez stronę obejmuje cały deklarowany zakres wejściowy — od 0,1 do 2000 bar, od 300 do 1500 K, średnicę od 1 mm do 5 m, długość od 10 mm do 1000 km, od gładkości hydraulicznej do chropowatości 50 mm, od przepływu laminarnego do 99,999 procent oporu krytycznego i dalej w zadławienie — i daje 447 niezależnych sprawdzeń, wszystkie zaliczone, przy największym residuum względnym 3,3e-9. 28 sprawdzeń wewnątrz strony zachowano i oznaczono jako samosprawdzenia. Własny marsz RK4 strony, oceniony tutaj względem postaci zamkniętej, a nie względem siebie, odbiega od niej najwyżej o 2,9e-6 Pa nawet przy 99,999 procent oporu krytycznego, przy nadrukowanej rozdzielczości 100 Pa, więc jego pierwszy krok L/1000 wystarcza w całym zakresie. W porównaniu z IAPWS-IF97 deklarowany izotermiczny model gazu doskonałego zawyża stratę o 5,4 procent w przypadku domyślnym i nawet o 41 procent w pobliżu nasycenia przy 100 bar, podczas gdy rozbieżność między ujęciem izotermicznym a adiabatycznym pozostaje poniżej 0,01 procent w przypadku domyślnym i dopiero blisko zadławienia sięga 14 procent. Weryfikacja wykorzystała niezależny wzorzec i własny stend autora; nie było recenzji strony trzeciej."

        "reference": "An external reference implemented in Python from a derivation carried out for this benchmark, along four structurally independent routes. The steady one-dimensional momentum balance for a constant-area duct, dp + G^2 dv + (f/D + SigmaK/L)/2 * G^2 v dx = 0, is divided through by G^2 v and integrated, which separates for ANY one-parameter state path and gives q/2 = (1/G^2) INT_{p2}^{p1} rho(p) dp + ln(rho(p2)/rho(p1)). (A) With the ideal isotherm this is the published complete isothermal pipe equation, and the substitution u = p^2/G^2RT inverts it in CLOSED FORM through the Lambert W function, p2 = sqrt(C * -W_{-1}(-exp(-(g(u1)-q)))) with g(u) = u - ln u: no root-finding and no stepping at all, against the tool's bisection. (B) The same relation driven to a root in 50-digit mpmath arithmetic, so the reference is never the limiting error. (C) The pipe length recovered from the tool's own reported outlet by 240-node Gauss-Legendre quadrature of dx/dp in PRESSURE, where the critical point is a zero of the integrand rather than a pole -- this route shows no node dependence at all at q/q* = 0.99999 and is what settles the marching question. (D) The general quadrature solved by Brent, fed the IAPWS-IF97 isotherm and an adiabatic Fanno line to measure the declared idealisation itself. The friction factor is graded separately against Swamee & Jain (1976) and the laminar f = 64/Re implemented from their published algebra, and the Colebrook-White equation is solved to convergence so the cost of the explicit correlation is measured rather than assumed. The reference was verified against IAPWS R7-97 and R12-08 verification tables and the published Fanno relations before any tool output was graded.",

          "P. K. Swamee and A. K. Jain, \"Explicit equations for pipe-flow problems\", Journal of the Hydraulics Division, ASCE 102(HY5) (1976) 657-664: f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, stated valid for 5e3 <= Re <= 1e8 and 1e-6 <= eps/D <= 1e-2. This is the correlation the tool declares above its Re = 2300 switch; it is implemented here from the published algebra, not from the page.",

        "reference_provenance": "Written independently in Python for this benchmark. The page's JavaScript was read only for input keys, units, declared minima and maxima, defaults, the declared model boundary, the names of the correlations it declares, the list of reported quantities and the precision at which each is printed. Nothing in the reference is transcribed, ported or paraphrased from it, and no reference route evaluates any expression taken from it. The reference was self-verified before any tool output was graded: the closed-form Lambert-W inversion against a 50-digit root of the same relation to 2e-16 over the declared input box; the general quadrature against that root to 4e-14; the pressure-domain length quadrature closed to 7e-11; node refinement 50 -> 800 moving the length integral by less than 1e-12 even at q/q* = 0.99999; the low-Mach limit converging on the incompressible Darcy-Weisbach loss at second order in Mach; the p^2 asymptote recovered as the mass flux vanishes; the critical limit approaching p* = G sqrt(RT); the Fanno quadrature against Shapiro's published closed form to 1.8e-13; and the IAPWS-IF97 and R12-08 property source against the releases' own verification tables. Verification used an independent reference and the author's own harness; there has been no third-party review.",

function dgcPlot(ctx, w, h, spec, opt) {
  opt = opt || {};

  ctx.fillStyle = text; ctx.font = '500 ' + f2 + 'px ' + font;
  var xTitle = (spec.x && spec.x.label ? spec.x.label : '') + (spec.x && spec.x.unit ? ', ' + spec.x.unit : '');
  if (xTitle) { ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText(xTitle, padL + W / 2, h - (spec.series.length > 1 ? 20 * fs : 5 * fs)); }
  function axisTitle(g, right) {
    var t = (g.series.length === 1 && g.series[0].label ? g.series[0].label : (g.title || '')) + (g.unit ? ', ' + g.unit : '');
    if (!t) return;
    // Both titles are rotated so their glyphs fall inside the canvas: after the
    // rotation a 'top' baseline places them toward the plot, either way.
    ctx.save(); ctx.translate(right ? w - 3 * fs : 13 * fs, padT + H / 2);
    ctx.rotate(right ? Math.PI / 2 : -Math.PI / 2);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(t, 0, 0); ctx.restore();
  }
  axisTitle(groups[0], false); if (hasRight) axisTitle(groups[1], true);

  // Curves.
  var colors = opt.colors || ['#1f6feb', '#d1651a', '#2f9e44', '#9333ea', '#0891b2'];
  var idx = 0, legend = [];
  groups.forEach(function (g, gi) {
    var Y = Yof(g);
    g.series.forEach(function (s) {
      var col = s.color || colors[idx % colors.length];
      legend.push({ label: s.label || '', unit: g.unit, color: col, dash: gi === 1 });
      ctx.strokeStyle = col; ctx.lineWidth = 2 * fs; ctx.lineJoin = 'round';
      ctx.setLineDash(gi === 1 ? [6 * fs, 4 * fs] : []);
      ctx.beginPath(); var began = false;
      for (var i = 0; i < s.x.length; i++) {
        var xv = s.x[i], yv = s.y[i];
        if (!isFinite(xv) || !isFinite(yv)) { began = false; continue; }
        var px = X(xv), py = Y(yv);
        if (!began) { ctx.moveTo(px, py); began = true; } else ctx.lineTo(px, py);
      }
      ctx.stroke(); ctx.setLineDash([]);
      idx++;
    });
  });

  // Legend, only when more than one curve is on the plot.
  if (legend.length > 1) {
    ctx.font = '400 ' + f1 + 'px ' + font; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    var items = legend.map(function (l) { return { l: l, w: ctx.measureText(l.label + (l.unit ? ', ' + l.unit : '')).width + 26 * fs }; });
    var total = items.reduce(function (a, b) { return a + b.w; }, 0);
    var cx = padL + Math.max(0, (W - total) / 2), cy = h - 6 * fs;
    items.forEach(function (it) {
      ctx.strokeStyle = it.l.color; ctx.lineWidth = 2 * fs;
      ctx.setLineDash(it.l.dash ? [6 * fs, 4 * fs] : []);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + 18 * fs, cy); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = text; ctx.fillText(it.l.label + (it.l.unit ? ', ' + it.l.unit : ''), cx + 22 * fs, cy);
      cx += it.w;
    });
  }
  return { drawn: idx, skipped: skipped };
}

 ckEqB:"De volledige stationaire isotherme ideaal-gasrelatie p₁² − p₂² + 2G²RT ln(p₂/p₁) = (fL/D + ΣK)G²RT, geëvalueerd bij de gemelde uitlaatdruk en genormeerd op p₁². Dit is de vergelijking uit de voettekst van het gereedschap zelf.",
 ckEqNA:"De gevraagde weerstand overschrijdt de grootste die de relatie toelaat, dus de vergelijking heeft hier geen wortel en een residu is niet gedefinieerd.",
 ckRk4:"Uitlaatdruk tegen directe RK4-integratie",
 ckRk4B:"Dezelfde balans in differentiaalvorm, dp/dx = −(f/D + ΣK/L)·G²RT·p/(2(p² − G²RT)), vanaf de inlaat gemarcheerd met klassieke vierde-orde Runge-Kutta onder stapverdubbeling voor lokale foutbeheersing. Zij deelt de vergelijking en niet het wortelzoeken, en toetst de bisectie dus onafhankelijk.",
 ckRk4NA:"De afgeleide groeit onbegrensd waar de druk de kritische waarde bereikt, zodat een mars over de lengte de uitlaat niet haalt.",
 ckEnd:"Getekend profiel tegen de gemelde uitlaat",
 ckEndB:"Het laatste monster van het getekende profiel draagt de volle weerstand fL/D + ΣK, dezelfde waarde waarbij de gemelde uitlaatdruk wordt opgelost. Figuur en tabel moeten daarom één getal tonen.",
 ckMono:"Monotone druk langs de leiding",
 ckMonoB:"Elk van de 81 profielpunten wordt met een eigen bisectie opgelost. De impulsbalans geeft een negatieve gradiënt overal waar de druk boven de kritische waarde ligt, dus geen punt mag boven het voorgaande liggen.",
 ckMach:"Sluiting van het uitlaat-Machgetal",
 ckMachB:"Het gemelde Machgetal komt uit uitlaatdichtheid en -snelheid. Eliminatie van beide geeft M·p₂·√γ = G√(RT), wat de kritische druk is. Het herberekenen van die identiteit toetst het dichtheids- en snelheidspad tegen de massaflux.",
 ckReg:"Isotherm kritisch regime",
 ckRegB:"Uitlaatdruk tegen de isotherme kritische druk p* = G√(RT), het smoorcriterium uit de modelnotities van het gereedschap zelf. Bij p* is de weerstand die de leiding kan opnemen maximaal.",
 rChoked:"op de kritische druk",rSub:"boven de kritische druk",
 riskSteamT:"Stoomeigenschappen",
 riskSteam:"Het gas is ideaal met constante R en γ, en de viscositeit komt uit een screeningcorrelatie. Echte oververhitte stoom wijkt bij hoge druk enkele procenten van de ideale dichtheid af; natheid en condensatie zijn niet gemodelleerd.",
 riskIsoT:"Isotherme aanname",
 riskIso:"De temperatuur wordt over de hele lengte op de inlaatwaarde gehouden. Een leiding die warmte aan de omgeving verliest, wordt stroomafwaarts kouder en dichter, wat zowel de wrijvingsfactor als de kritische druk verschuift.",
 riskMachT:"Samendrukbaarheidsbereik",
 riskMach:"De relatie is eendimensionaal en isotherm. Boven uitlaat-Mach 0,3 verdienen de aannames controle, en boven 0,5 verwijst de eigen toepassingsnotitie van het gereedschap naar een volledige samendrukbare solver.",
 mNote:"De weerstandsterm fL/D + ΣK is gelijkmatig over het getekende profiel verdeeld, zodat fittingverliezen over de lengte uitgesmeerd verschijnen in plaats van als trap bij elke fitting.",

 dGeom:"Boring en lengte",dGeomWhy:"De boring bepaalt de massaflux; met de lengte de wrijvingsweerstand fL/D.",
 dRough:"Ruwheid",dRoughWhy:"De relatieve ruwheid legt de wrijvingsfactor vast zodra de stroming volledig turbulent is.",

fr:{title:"Perte de charge vapeur — écoulement compressible isotherme en conduite",
 summary:"Une conduite de {D} mm d'alésage et {L} m de longueur transporte {m} kg/s de vapeur surchauffée à {T} °C depuis {p1} bar. Le frottement (f = {f}) et les pertes singulières (ΣK = {K}) amènent l'aval à {p2} bar, soit une perte de {dp} bar. Le Mach aval vaut {M} pour une pression critique isotherme de {pc} bar.",
 concOK:"La pression aval reste au-dessus de la pression critique isotherme, le débit demandé traverse donc la conduite avec la perte indiquée.",
 concChoked:"Le débit demandé atteint la condition critique isotherme avant la sortie. La pression aval indiquée est la pression critique, et ce modèle ne soutient pas le débit demandé.",
 system:"La vitesse massique découle du débit demandé et de l'alésage. La température est maintenue à sa valeur amont sur toute la longueur, la masse volumique ne suit donc que la pression. Frottement et pertes singulières sont sommés en un seul terme de résistance, et le bilan de quantité de mouvement intégré conserve l'accélération longitudinale née de la chute de masse volumique.",
 figCap:"Pression statique le long de la conduite. La distance part de l'entrée; le terme de résistance est réparti uniformément sur la longueur.",
 ckEq:"Résidu de l'équation fermée",
 ckEqB:"La relation complète de gaz parfait isotherme permanent p₁² − p₂² + 2G²RT ln(p₂/p₁) = (fL/D + ΣK)G²RT, évaluée à la pression aval indiquée et normalisée par p₁². C'est l'équation imprimée dans le pied de page de l'outil lui-même.",
 ckEqNA:"La résistance demandée dépasse la plus grande que la relation admette, l'équation n'a donc pas de racine ici et aucun résidu n'est défini.",
 ckRk4:"Pression aval face à une intégration RK4 directe",
 ckRk4B:"Le même bilan sous forme différentielle, dp/dx = −(f/D + ΣK/L)·G²RT·p/(2(p² − G²RT)), intégré depuis l'entrée par Runge-Kutta classique d'ordre quatre avec contrôle d'erreur locale par doublement de pas. Il partage l'équation et non la recherche de racine, ce qui teste la bissection de façon indépendante.",
 ckRk4NA:"La dérivée croît sans borne là où la pression atteint la valeur critique; une marche en longueur n'atteint donc pas la sortie.",
 ckEnd:"Profil tracé face à la sortie indiquée",
 ckEndB:"Le dernier échantillon du profil tracé porte la résistance complète fL/D + ΣK, la valeur même à laquelle la pression aval indiquée est résolue. Figure et tableau doivent donc afficher un seul nombre.",
 ckMono:"Pression monotone le long de la conduite",
 ckMonoB:"Chacun des 81 points du profil est résolu par sa propre bissection. Le bilan de quantité de mouvement donne un gradient négatif partout où la pression dépasse la valeur critique, aucun point ne peut donc se placer au-dessus du précédent.",
 ckMach:"Fermeture du Mach aval",
 ckMachB:"Le Mach indiqué est construit à partir de la masse volumique et de la vitesse aval. Leur élimination donne M·p₂·√γ = G√(RT), soit la pression critique. Recalculer cette identité teste la voie masse volumique-vitesse face à la vitesse massique.",
 ckReg:"Régime critique isotherme",
 ckRegB:"Pression aval face à la pression critique isotherme p* = G√(RT), le critère de blocage énoncé dans les notes de modèle de l'outil. À p*, la résistance que la conduite peut absorber est maximale.",
 rChoked:"à la pression critique",rSub:"au-dessus de la pression critique",
 riskSteamT:"Propriétés de la vapeur",
 riskSteam:"Le gaz est parfait à R et γ constants, et la viscosité vient d'une corrélation de dégrossissage. La vapeur surchauffée réelle s'écarte de la masse volumique idéale de quelques pour cent à haute pression; humidité et condensation ne sont pas modélisées.",
 riskIsoT:"Hypothèse isotherme",
 riskIso:"La température est maintenue à la valeur amont sur toute la longueur. Une conduite qui perd de la chaleur vers l'ambiance devient plus froide et plus dense vers l'aval, ce qui déplace le coefficient de frottement et la pression critique.",
 riskMachT:"Domaine de compressibilité",
 riskMach:"La relation est unidimensionnelle et isotherme. Au-dessus d'un Mach aval de 0,3 les hypothèses demandent vérification, et au-dessus de 0,5 la note de domaine de l'outil renvoie vers un solveur compressible complet.",
 mNote:"Le terme de résistance fL/D + ΣK est réparti uniformément sur le profil tracé, les pertes singulières apparaissent donc étalées sur la longueur au lieu de marquer une marche à chaque accessoire.",
 rSteps:"pas",rAtol:"tolérance locale",
 axDist:"Distance depuis l'entrée",axPress:"Pression statique",
 rOutP:"Pression aval",rLoss:"Perte de pression",rLossPc:"Part de la pression amont",
 rVel:"Vitesse aval",rMach:"Mach aval",rCritP:"Pression critique isotherme",
 rInP:"Pression amont",rTemp:"Température de la vapeur",rFlux:"Vitesse massique G",
 rFric:"Coefficient de frottement de Darcy",rRe:"Nombre de Reynolds",
 rRes:"Résistance totale fL/D + ΣK",rResCrit:"Résistance à la condition critique",
 rMargin:"Marge jusqu'à la pression critique",rDens:"Masse volumique aval",rDensIn:"Masse volumique amont",
 rGrad:"Gradient de pression moyen",rRelRough:"Rugosité relative",
 rRegLam:"branche laminaire",rRegTurb:"branche turbulente",rOfCrit:"de la résistance critique",
 flowInlet:"État amont",flowPipe:"Conduite",flowOutlet:"État aval",
 dGeom:"Alésage et longueur",dGeomWhy:"L'alésage fixe la vitesse massique; avec la longueur, la résistance de frottement fL/D.",
 dRough:"Rugosité",dRoughWhy:"La rugosité relative fixe le coefficient de frottement dès que l'écoulement est pleinement turbulent.",
 dLocal:"Pertes singulières",dLocalWhy:"Accessoires et robinetterie entrent comme un K sommé unique, ajouté à la résistance de frottement.",
 dGas:"Modèle de gaz",dGasWhy:"R et γ fixent la relation isotherme de masse volumique et la vitesse du son derrière le Mach."},
es:{title:"Pérdida de presión en línea de vapor — flujo compresible isotermo",
 summary:"Una línea de {D} mm de diámetro interior y {L} m de longitud transporta {m} kg/s de vapor sobrecalentado a {T} °C desde {p1} bar. La fricción (f = {f}) y las pérdidas locales (ΣK = {K}) llevan la salida a {p2} bar, una pérdida de {dp} bar. El Mach de salida es {M} frente a una presión crítica isoterma de {pc} bar.",
 concOK:"La presión de salida se mantiene por encima de la presión crítica isoterma, de modo que el caudal solicitado recorre la línea con la pérdida indicada.",
 concChoked:"El caudal solicitado alcanza la condición crítica isoterma antes de la salida. La presión de salida indicada es la presión crítica, y este modelo no sostiene el caudal solicitado.",
 system:"La velocidad másica queda fijada por el caudal solicitado y el diámetro. La temperatura se mantiene en el valor de entrada a lo largo de la línea, por lo que la densidad depende solo de la presión. Fricción y pérdidas en accesorios se suman en un único término de resistencia, y el balance de cantidad de movimiento integrado conserva la aceleración longitudinal que produce la caída de densidad.",
 figCap:"Presión estática a lo largo de la tubería. La distancia se mide desde la entrada; el término de resistencia se reparte uniformemente por la longitud.",
 ckEq:"Residuo de la ecuación cerrada",
 ckEqB:"La relación completa de gas ideal isotermo estacionario p₁² − p₂² + 2G²RT ln(p₂/p₁) = (fL/D + ΣK)G²RT, evaluada en la presión de salida indicada y normalizada por p₁². Es la ecuación impresa en el pie de la propia herramienta.",
 ckEqNA:"La resistencia solicitada supera la mayor que admite la relación, por lo que la ecuación no tiene raíz aquí y el residuo no está definido.",
 ckRk4:"Presión de salida frente a integración RK4 directa",
 ckRk4B:"El mismo balance en forma diferencial, dp/dx = −(f/D + ΣK/L)·G²RT·p/(2(p² − G²RT)), integrado desde la entrada con Runge-Kutta clásico de cuarto orden y control de error local por duplicación de paso. Comparte la ecuación y no la búsqueda de raíz, por lo que prueba la bisección de forma independiente.",
 ckRk4NA:"La derivada crece sin cota donde la presión alcanza el valor crítico, de modo que una marcha en longitud no llega a la salida.",
 ckEnd:"Perfil trazado frente a la salida indicada",
 ckEndB:"La última muestra del perfil trazado lleva la resistencia completa fL/D + ΣK, el mismo valor con el que se resuelve la presión de salida indicada. Figura y tabla deben mostrar por tanto un solo número.",
 ckMono:"Presión monótona a lo largo de la tubería",
 ckMonoB:"Cada uno de los 81 puntos del perfil se resuelve con su propia bisección. El balance de cantidad de movimiento da gradiente negativo dondequiera que la presión supere el valor crítico, así que ningún punto puede quedar por encima del anterior.",
 ckMach:"Cierre del Mach de salida",
 ckMachB:"El Mach indicado se forma con la densidad y la velocidad de salida. Al eliminar ambas resulta M·p₂·√γ = G√(RT), que es la presión crítica. Recalcular esa identidad prueba la vía densidad-velocidad frente a la velocidad másica.",
 ckReg:"Régimen crítico isotermo",
 ckRegB:"Presión de salida frente a la presión crítica isoterma p* = G√(RT), el criterio de bloqueo enunciado en las notas de modelo de la propia herramienta. En p* la resistencia que la línea puede absorber es máxima.",
 rChoked:"en la presión crítica",rSub:"por encima de la presión crítica",
 riskSteamT:"Propiedades del vapor",
 riskSteam:"El gas es ideal con R y γ constantes, y la viscosidad procede de una correlación de cribado. El vapor sobrecalentado real se aparta de la densidad ideal en algunos por ciento a alta presión; humedad y condensación no se modelan.",
 riskIsoT:"Hipótesis isoterma",
 riskIso:"La temperatura se mantiene en el valor de entrada en toda la longitud. Una línea que pierde calor al ambiente queda más fría y más densa aguas abajo, lo que desplaza el factor de fricción y la presión crítica.",
 riskMachT:"Rango de compresibilidad",
 riskMach:"La relación es unidimensional e isoterma. Por encima de Mach 0,3 en la salida conviene revisar las hipótesis, y por encima de 0,5 la nota de alcance de la herramienta remite a un solver compresible completo.",
 mNote:"El término de resistencia fL/D + ΣK se reparte uniformemente por el perfil trazado, de modo que las pérdidas en accesorios aparecen extendidas por la longitud en lugar de escalonarse en cada accesorio.",
 rSteps:"pasos",rAtol:"tolerancia local",
 axDist:"Distancia desde la entrada",axPress:"Presión estática",
 rOutP:"Presión de salida",rLoss:"Pérdida de presión",rLossPc:"Fracción de la presión de entrada",
 rVel:"Velocidad de salida",rMach:"Mach de salida",rCritP:"Presión crítica isoterma",
 rInP:"Presión de entrada",rTemp:"Temperatura del vapor",rFlux:"Velocidad másica G",
 rFric:"Factor de fricción de Darcy",rRe:"Número de Reynolds",
 rRes:"Resistencia total fL/D + ΣK",rResCrit:"Resistencia en la condición crítica",
 rMargin:"Margen hasta la presión crítica",rDens:"Densidad de salida",rDensIn:"Densidad de entrada",
 rGrad:"Gradiente medio de presión",rRelRough:"Rugosidad relativa",
 rRegLam:"rama laminar",rRegTurb:"rama turbulenta",rOfCrit:"de la resistencia crítica",
 flowInlet:"Estado de entrada",flowPipe:"Tubería",flowOutlet:"Estado de salida",
 dGeom:"Diámetro y longitud",dGeomWhy:"El diámetro fija la velocidad másica; con la longitud, la resistencia de fricción fL/D.",
 dRough:"Rugosidad",dRoughWhy:"La rugosidad relativa fija el factor de fricción una vez el flujo es plenamente turbulento.",
 dLocal:"Pérdidas locales",dLocalWhy:"Accesorios y válvulas entran como una K sumada única, añadida a la resistencia de fricción.",
 dGas:"Modelo de gas",dGasWhy:"R y γ fijan la relación isoterma de densidad y la velocidad del sonido tras el número de Mach."},
pl:{title:"Spadek ciśnienia w rurociągu pary — izotermiczny przepływ ściśliwy",
 summary:"Rurociąg o średnicy {D} mm i długości {L} m prowadzi {m} kg/s pary przegrzanej o {T} °C od {p1} bar. Tarcie (f = {f}) i straty miejscowe (ΣK = {K}) sprowadzają wylot do {p2} bar, co daje stratę {dp} bar. Liczba Macha na wylocie wynosi {M} przy izotermicznym ciśnieniu krytycznym {pc} bar.",
 concOK:"Ciśnienie wylotowe pozostaje powyżej izotermicznego ciśnienia krytycznego, więc żądany strumień masy przechodzi przez rurociąg ze wskazaną stratą.",
 concChoked:"Żądany strumień masy osiąga izotermiczny warunek krytyczny przed wylotem. Podane ciśnienie wylotowe jest ciśnieniem krytycznym, a model ten nie przenosi zadanego strumienia.",
 system:"Gęstość strumienia masy wynika z żądanego strumienia i średnicy. Temperaturę utrzymuje się na wartości wlotowej wzdłuż rurociągu, więc gęstość zależy wyłącznie od ciśnienia. Tarcie i straty na kształtkach sumują się w jeden człon oporu, a scałkowany bilans pędu zachowuje przyspieszenie wzdłużne wynikające ze spadku gęstości.",
 figCap:"Ciśnienie statyczne wzdłuż rury. Odległość liczona od wlotu; człon oporu rozłożono równomiernie na długości.",
 ckEq:"Residuum równania zamkniętego",
 ckEqB:"Pełna ustalona izotermiczna relacja gazu doskonałego p₁² − p₂² + 2G²RT ln(p₂/p₁) = (fL/D + ΣK)G²RT, obliczona przy podanym ciśnieniu wylotowym i unormowana przez p₁². To równanie wydrukowane w stopce samego narzędzia.",
 ckEqNA:"Żądany opór przekracza największy dopuszczany przez tę relację, więc równanie nie ma tu pierwiastka i residuum nie jest zdefiniowane.",
 ckRk4:"Ciśnienie wylotowe wobec bezpośredniego całkowania RK4",
 ckRk4B:"Ten sam bilans w postaci różniczkowej, dp/dx = −(f/D + ΣK/L)·G²RT·p/(2(p² − G²RT)), całkowany od wlotu klasyczną metodą Runge-Kutty czwartego rzędu z kontrolą błędu lokalnego przez podwajanie kroku. Dzieli równanie i nie dzieli poszukiwania pierwiastka, więc sprawdza bisekcję niezależnie.",
 ckRk4NA:"Pochodna rośnie nieograniczenie tam, gdzie ciśnienie osiąga wartość krytyczną, więc marsz po długości nie dociera do wylotu.",
 ckEnd:"Wykreślony profil wobec podanego wylotu",
 ckEndB:"Ostatnia próbka wykreślonego profilu niesie pełny opór fL/D + ΣK, tę samą wartość, dla której rozwiązywane jest podane ciśnienie wylotowe. Rysunek i tabela muszą więc pokazywać jedną liczbę.",
 ckMono:"Monotoniczność ciśnienia wzdłuż rury",
 ckMonoB:"Każdy z 81 punktów profilu rozwiązywany jest własną bisekcją. Bilans pędu daje ujemny gradient wszędzie tam, gdzie ciśnienie przewyższa wartość krytyczną, więc żaden punkt nie może leżeć powyżej poprzedniego.",
 ckMach:"Domknięcie liczby Macha na wylocie",
 ckMachB:"Podaną liczbę Macha tworzy się z gęstości i prędkości na wylocie. Eliminacja obu daje M·p₂·√γ = G√(RT), czyli ciśnienie krytyczne. Przeliczenie tej tożsamości sprawdza ścieżkę gęstości i prędkości wobec gęstości strumienia masy.",
 ckReg:"Izotermiczny reżim krytyczny",
 ckRegB:"Ciśnienie wylotowe wobec izotermicznego ciśnienia krytycznego p* = G√(RT), kryterium zadławienia podanego w notatkach modelu samego narzędzia. Przy p* opór, jaki rurociąg może pochłonąć, jest największy.",
 rChoked:"na ciśnieniu krytycznym",rSub:"powyżej ciśnienia krytycznego",
 riskSteamT:"Właściwości pary",
 riskSteam:"Gaz jest doskonały o stałych R i γ, a lepkość pochodzi z korelacji przesiewowej. Rzeczywista para przegrzana odbiega od gęstości idealnej o kilka procent przy wysokim ciśnieniu; wilgotność i kondensacja nie są modelowane.",
 riskIsoT:"Założenie izotermiczności",
 riskIso:"Temperaturę utrzymuje się na wartości wlotowej na całej długości. Rurociąg tracący ciepło do otoczenia jest dalej chłodniejszy i gęstszy, co przesuwa zarówno współczynnik tarcia, jak i ciśnienie krytyczne.",
 riskMachT:"Zakres ściśliwości",
 riskMach:"Relacja jest jednowymiarowa i izotermiczna. Powyżej liczby Macha 0,3 na wylocie założenia wymagają sprawdzenia, a powyżej 0,5 własna nota zakresu narzędzia kieruje do pełnego solvera ściśliwego.",
 mNote:"Człon oporu fL/D + ΣK rozłożono równomiernie na wykreślonym profilu, więc straty na kształtkach pojawiają się rozmyte po długości zamiast skokiem przy każdej kształtce.",
 rSteps:"kroków",rAtol:"tolerancja lokalna",

};
function dgcLang(){try{return (window.Diagram&&Diagram.lang&&Diagram.lang())||'en';}catch(e){return 'en';}}
function dgcRt(k){var l=dgcLang();return (DGC_RT[l]&&DGC_RT[l][k])||DGC_RT.en[k]||k;}
var DGC_LOC={en:'en-GB',uk:'uk-UA',de:'de-DE',nl:'nl-BE',fr:'fr-BE',es:'es-ES',pl:'pl-PL'};
function dgcNum(v,d){if(!isFinite(v))return '—';

/* Verification computed live from the current state.
   Two references are recomputed here. The first is the closed steady isothermal
   ideal-gas relation the tool prints in its own footer, evaluated as a residual
   at the reported outlet pressure. The second is a direct fourth-order
   Runge-Kutta march of the same balance in differential form: it shares the
   equation and not the bisection, so it tests the root-finding independently. */
function dgcPipeTerms(s){
  var A=Math.PI*s.D*s.D/4;
  var mu=1.34e-5*Math.pow(s.T/373.15,0.72);
  var Re=s.mdot*s.D/(A*mu);
  var f=frictionFactor(Re,s.eps,s.D);
  var G=s.mdot/A, C=G*G*s.R*s.T;
  return {A:A,mu:mu,Re:Re,f:f,G:G,C:C,pc:Math.sqrt(C),q:f*s.L/s.D+s.K};
}
/* Direct RK4 on dp/dx = -(f/D + K/L) C p / (2 (p^2 - C)), which integrates to
   the closed relation above. Step doubling controls the local error, because a
   fixed partition cannot hold the recorded 1e-6 Pa tolerance where the gradient
   steepens toward the critical pressure. */
function dgcRk4Outlet(s,atol){
  var t=dgcPipeTerms(s), c=t.f/s.D+s.K/s.L, C=t.C;
  if(!(c>0)||!(C>0))return {p:s.p1,steps:0,ok:true};
  var d=function(p){return -c*C*p/(2*(p*p-C));};
  var step=function(p,h){var k1=d(p),k2=d(p+h*k1/2),k3=d(p+h*k2/2),k4=d(p+h*k3);
    return p+h*(k1+2*k2+2*k3+k4)/6;};
  var x=0,p=s.p1,h=s.L/1000,n=0,hmin=s.L*1e-12,ok=true;
  while(x<s.L&&n<60000){
    if(h>s.L-x)h=s.L-x;
    var pa=step(p,h),pm=step(p,h/2),pb=step(pm,h/2);
    if(!isFinite(pa)||!isFinite(pb)||pb<=t.pc){ok=false;break;}
    var err=Math.abs(pb-pa)/15;
    if(err<=atol||h<=hmin){p=pb+(pb-pa)/15;x+=h;n++;
      h*=Math.min(2,Math.max(0.2,err>0?0.9*Math.pow(atol/err,0.2):2));}
    else h*=Math.max(0.1,0.9*Math.pow(atol/err,0.25));
  }
  if(x<s.L)ok=false;
  return {p:p,steps:n,ok:ok};
}
/* Returns one row per check: what was measured, what it was measured against,
   the difference and the verdict. A row without a criterion is recorded as a
   diagnostic and is excluded from the graded count. */
function dgcVerify(s){
  var out=[],r=solve(s),t=dgcPipeTerms(s),p2=r.p,choked=!!r.choked;

  // 1. Closed-equation residual, normalised by p1^2. Only a subcritical case
  //    has a root: above the critical resistance the relation admits none.
  var F=s.p1*s.p1-p2*p2+2*t.C*Math.log(p2/s.p1)-t.q*t.C;
  var relF=Math.abs(F)/(s.p1*s.p1);
  out.push({id:'closed-equation-residual',key:'ckEq',
    graded:!choked,
    got:relF,ref:0,rel:relF,tol:1e-12,unit:'-',dp:6,
    pass:relF<=1e-12,
    status:choked?'info':(relF<=1e-12?'pass':'fail'),
    extra:{q:t.q,qcrit:r.qcrit,choked:choked}});

  // 2. Outlet pressure against the direct RK4 march of the same balance.
  var rk=choked?null:dgcRk4Outlet(s,1e-9);
  var dP=rk&&rk.ok?Math.abs(rk.p-p2):null;
  out.push({id:'outlet-pressure-vs-rk4-momentum-integration',key:'ckRk4',
    graded:!!(rk&&rk.ok),
    got:rk&&rk.ok?rk.p:null,ref:p2,abs:dP,
    rel:(dP!=null&&p2!==0)?dP/p2:null,tol:1e-6,unit:'Pa',dp:6,
    pass:dP!=null&&dP<=1e-6,
    status:(rk&&rk.ok)?(dP<=1e-6?'pass':'fail'):'info',
    extra:rk?{steps:rk.steps,atol:1e-9}:null});

  // 3. The plotted profile ends at the reported outlet pressure. The last
  //    sample carries the full resistance, so the two must coincide.
  var ys=(r.series&&r.series[0]&&r.series[0].y)||[];
  var pEnd=ys.length?ys[ys.length-1]*1e5:null;
  var relE=(pEnd!=null&&p2!==0)?Math.abs(pEnd-p2)/Math.abs(p2):null;
  out.push({id:'profile-endpoint-vs-reported-outlet',key:'ckEnd',
    graded:true,
    got:pEnd,ref:p2,abs:pEnd!=null?Math.abs(pEnd-p2):null,rel:relE,
    tol:1e-12,unit:'Pa',dp:6,
    pass:relE!=null&&relE<=1e-12,
    status:(relE!=null&&relE<=1e-12)?'pass':'fail'});

  // 4. Every profile sample is solved by its own bisection. The differential
  //    balance is negative above the critical pressure, so the samples must
  //    never rise along the pipe.
  var maxInc=-Infinity,idxInc=-1;
  for(var i=1;i<ys.length;i++){var dI=(ys[i]-ys[i-1])*1e5;if(dI>maxInc){maxInc=dI;idxInc=i;}}
  if(!isFinite(maxInc))maxInc=0;
  out.push({id:'profile-monotonicity',key:'ckMono',
    graded:true,
    got:maxInc,ref:0,abs:maxInc,rel:null,tol:0,unit:'Pa',dp:6,
    pass:maxInc<=0,status:maxInc<=0?'pass':'fail',
    extra:{samples:ys.length,at:idxInc}});

  // 5. Mach closure. M is built from outlet density and velocity; eliminating
  //    both leaves M p2 sqrt(gamma) = G sqrt(R T), the critical pressure.
  var lhs=r.M*p2*Math.sqrt(s.gamma);
  var relM=t.pc!==0?Math.abs(lhs-t.pc)/t.pc:null;
  out.push({id:'outlet-mach-closure',key:'ckMach',
    graded:true,
    got:lhs,ref:t.pc,abs:Math.abs(lhs-t.pc),rel:relM,
    tol:1e-12,unit:'Pa',dp:6,
    pass:relM!=null&&relM<=1e-12,
    status:(relM!=null&&relM<=1e-12)?'pass':'fail'});

  // 6. Where the outlet state sits against the isothermal critical pressure.
  //    This reports the regime of the solved case and carries no criterion.
  var margin=t.pc!==0?p2/t.pc:null;
  out.push({id:'isothermal-critical-regime',key:'ckReg',
    graded:false,
    got:p2,ref:t.pc,rel:null,unit:'Pa',dp:0,
    pass:!choked,status:choked?'attention':'info',
    word:choked?'rChoked':'rSub',
    extra:{margin:margin,q:t.q,qcrit:r.qcrit,mach:r.M}});
  return out;
}

/* The report is a separate document without the tool's stylesheet, so the
   figure is drawn into its own canvas at print resolution rather than scraped
   off the screen. Without this the engine falls back to the on-screen stage,
   which carries no caption, no axis title and no unit. */
function dgcFigureCanvas(w,h,scale){
  var c=document.createElement('canvas');
  c.width=Math.round(w*scale); c.height=Math.round(h*scale);
  var ctx=c.getContext('2d'); ctx.scale(scale,scale);
  return {canvas:c,ctx:ctx};
}
/* One series: static pressure against distance from the inlet. The x axis of
   this tool is a length, so it is labelled as one. */
function dgcPlotSpec(){
  if(!last||!last.series||!last.series.length)return null;
  var s0=last.series[0];
  if(!s0||!s0.x||!s0.x.length)return null;
  return {x:{label:dgcRt('axDist'),unit:'m'},
    series:[{x:s0.x,y:s0.y,label:dgcRt('axPress'),unit:'bar',color:'#1f6feb'}]};
}
function dgcReportFigure(ctx){
  var spec=dgcPlotSpec(); if(!spec)return null;
  var f=dgcFigureCanvas(720,300,2);
  dgcPlot(f.ctx,720,300,spec,{css:{bg:'#ffffff',muted:'#5a6570',line:'#c9d0d8',text:'#17202a',
    font:'-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif'},fontScale:1});
  return ctx.figure(f.canvas,{caption:dgcRt('figCap'),alt:dgcRt('figCap')});
}
function dgcReportProfile(rec,ctx){

  var n=dgcNum, ex=function(v,d){return (v==null||!isFinite(v))?'—':Number(v).toExponential(d);};

    system:{text:dgcRt('system'),

/* Rebuilds the in-page self-check record. Open the tool and call
   window.__dgcBenchmark() to reproduce the self-check half of
   benchmarks/steam_pipe_pressure_loss.json; the independent half of that artifact
   is produced outside the page by gen_steam_pipe_pressure_loss.py. */
function dgcBenchmark(scenarios){
  var list=scenarios||DGC_BENCH_CASES, cases=[], total=0, passed=0, flagged=0;
  list.forEach(function(sc){
    var v=dgcVerify(sc.s);
    var cmp=v.map(function(c){
      if(c.graded){total++; if(c.pass)passed++;}
      else if(c.status==='attention')flagged++;
      return {check:c.id,
        got:(c.got===undefined?null:c.got),
        ref:(c.ref===undefined?null:c.ref),
        abs:(c.abs===undefined?null:c.abs),
        rel:(c.rel===undefined?null:c.rel),
        tol:(c.tol===undefined?null:c.tol),
        unit:c.unit,extra:c.extra||null,
        graded:!!c.graded,
        status:c.status||(c.pass?'pass':'fail'),ok:c.graded?!!c.pass:null};
    });
    cases.push({id:sc.id,note:sc.note,inputs:sc.s,cmp:cmp,
      pass:cmp.every(function(x){return !x.graded||x.ok;})});
  });
  var rev='';
  try{rev=JSON.parse(document.getElementById('diagram-tool-manifest').textContent).manifest_revision;}catch(e){}
  var pick=function(id,chk){var c=cases.filter(function(x){return x.id===id;})[0];
    if(!c)return null;return c.cmp.filter(function(x){return x.check===chk;})[0]||null;};
  var ex=function(x,n){return (x==null||!isFinite(x))?'—':Number(x).toExponential(n);};
  var e0=pick('default-baseline','closed-equation-residual');
  var r0=pick('default-baseline','outlet-pressure-vs-rk4-momentum-integration');
  var rn=pick('near-critical-margin','outlet-pressure-vs-rk4-momentum-integration');
  return {
    schema:'tools.petrov.re/benchmark/v1',
    tool:'steam-pipe-pressure-loss',file:'steam_pipe_pressure_loss.html',manifest_revision:rev,
    reference:'The complete steady isothermal ideal-gas pipe-flow relation p1^2 - p2^2 + 2 G^2 R T ln(p2/p1) = (f L/D + K) G^2 R T, evaluated as a residual at the reported outlet pressure, together with an independent direct RK4 integration of the same balance in differential form, dp/dx = -(f/D + K/L) G^2 R T p / (2 (p^2 - G^2 R T)). Every figure recorded here is recomputed in the page.',
    reference_citations:[
      'Closed relation as printed in the footer of steam_pipe_pressure_loss.html and listed in its record model.equations.',
      'The RK4 march shares that relation but not the bisection the tool uses to invert it, so it tests the root-finding independently. Step doubling holds the local error at 1e-9 Pa.'],
    reference_provenance:'recomputed in page',

function frictionFactor(Re,eps,D){if(Re<=0)return 0;if(Re<2300)return 64/Re;var a=eps/(3.7*D)+5.74/Math.pow(Re,0.9);return 0.25/Math.pow(Math.log10(a),2);}

function pressureForResistance(p1,C,q){
  if(C<=0||q<=0)return {p:p1,choked:false};
  var pc=Math.sqrt(C), qcrit=(p1*p1-C+2*C*Math.log(pc/p1))/C;
  if(!(p1>pc)||q>=qcrit)return {p:Math.min(p1,pc),choked:true,qcrit:qcrit};
  var lo=pc,hi=p1;
  for(var n=0;n<80;n++){
    var mid=.5*(lo+hi),res=(p1*p1-mid*mid+2*C*Math.log(mid/p1))/C;
    if(res>q)lo=mid;else hi=mid;
  }
  return {p:.5*(lo+hi),choked:false,qcrit:qcrit};
}
function solve(s){
  var A=Math.PI*s.D*s.D/4,mu=1.34e-5*Math.pow(s.T/373.15,.72),Re=s.mdot*s.D/(A*mu),f=frictionFactor(Re,s.eps,s.D),G=s.mdot/A,C=G*G*s.R*s.T,q=f*s.L/s.D+s.K,pr=pressureForResistance(s.p1,C,q),p2=pr.p,dp=s.p1-p2,rho2=p2/(s.R*s.T),v2=s.mdot/(rho2*A),a=Math.sqrt(s.gamma*s.R*s.T),M=v2/a,x=[],y=[];
  for(var i=0;i<=80;i++){var xx=s.L*i/80,qi=f*xx/s.D+s.K*i/80,pi=pressureForResistance(s.p1,C,qi).p;x.push(xx);y.push(pi/1e5);}
  var warnings=[];
  if(pr.choked)warnings.push('The requested mass flow reaches the isothermal critical condition before the outlet; the specified flow cannot be sustained by this model.');
  if(M>.5)warnings.push('Outlet Mach exceeds 0.5; use a full compressible-flow or real-steam model.');else if(M>.3)warnings.push('Outlet Mach exceeds 0.3; ideal-gas/isothermal assumptions should be checked carefully.');
  return {p:p2,dp:dp,rho:rho2,Re:Re,f:f,M:M,mdot:s.mdot,choked:pr.choked,qcrit:pr.qcrit,series:[{x:x,y:y}],a11y:'Steam pipe pressure profile.',warnings:warnings,notes:['Darcy friction factor = '+f.toPrecision(4)+', Reynolds = '+Re.toPrecision(4)+'.','Momentum equation includes the streamwise acceleration term; isothermal critical pressure is p*=G sqrt(RT).']};
}

/* ---- incoming SI handoff: one range check per accepted quantity -------------
   A quantity that arrives over the handoff is a reading taken somewhere else. A
   pressure named p may be a barometric reading, a pump suction pressure or a
   contained line pressure, and the name alone does not say which (AGENTS.md
   2.4, 2.7). Each accepted quantity is therefore applied only inside LIM, the
   same lo/hi the typed field enforces: a typed value outside the bound is moved
   to it and announced by the framework, an arriving value outside the bound is
   refused and nothing is written for it.
   The refused name is kept out of the `ignored` array, because the framework
   renders that array as "this tool does not use them" and the tool does use
   these quantities; the refusal sentence below carries the reason instead. */
