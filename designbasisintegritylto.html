(function () {
'use strict';
/* Design Basis Integrity & LTO — calculation core (pure functions, no DOM).
   A traceability matrix requirement – configuration – document – analysis with a value check per row,
   and for long-term operation the chain scope → screening → AMR → AMP → TLAA against a target horizon.
   Linked calculation records are evidence only: their conclusions are recorded by the user, never read. */
var DB_VERSION = '2026-10-09.db-3';
var DB_MODES = ['basis_recovery', 'drift', 'external', 'lto'];
var DB_STATUS = ['confirmed', 'rejected', 'unknown', 'not_applicable'];
var DB_CHECK = ['evidence', 'target', 'range', 'at_most', 'at_least', 'text'];
var DB_SCOPE = ['in_scope', 'out_of_scope', 'unknown'];
var DB_SCREEN = ['subject_to_amr', 'screened_out', 'unknown'];
var DB_YNU = ['yes', 'no', 'unknown'];
var DB_DISP = ['remains_valid', 'projected', 'managed_by_amp', 'replaced', 'unknown'];
var DB_DECISION = ['pending', 'approved', 'rejected'];
var DB_VERTICES = ['requirement', 'configuration', 'document', 'analysis'];
var DB_REJECTING = ['amp:rejected', 'tlaa:rejected', 'tlaa:expires_before_horizon', 'tlaa:replacement_after_expiry'];

function dbNum(v) { return typeof v === 'number' && isFinite(v) ? v : null; }
function dbText(v) { return v === null || v === undefined ? '' : String(v).trim(); }
function dbNorm(v) { return dbText(v).toLowerCase().replace(/\s+/g, ' '); }
/* tool ids named on a row: split on commas, semicolons and white space, first occurrence kept */
function dbCalcList(v) { var out = []; dbText(v).split(/[,;\s]+/).forEach(function (t) { if (t && out.indexOf(t) < 0) out.push(t); }); return out; }

/* ---- one vertex of the traceability chain ---- */
function dbVertex(status, ref, reason) {
  if (status === 'confirmed') return dbText(ref) ? { state: 'ok', gap: null } : { state: 'gap', gap: 'source_missing' };
  if (status === 'rejected') return { state: 'rejected', gap: 'rejected' };
  if (status === 'not_applicable') return dbText(reason) ? { state: 'not_applicable', gap: null } : { state: 'gap', gap: 'reason_missing' };
  return { state: 'gap', gap: 'unknown' };
}

/* ---- value check of a traceability row; evaluated only when requirement and configuration are confirmed ---- */
function dbCheck(r) {
  var t = r.check_type, a = dbNum(r.actual_value), q = dbNum(r.required_value);
  if (t === 'target') { var tol = dbNum(r.tolerance); if (a === null || q === null || tol === null || tol < 0) return { gap: 'values_missing' }; var d = a - q, m = tol - Math.abs(d); return { met: m >= 0, margin: m, deviation: d }; }
  if (t === 'range') { var lo = dbNum(r.min_value), hi = dbNum(r.max_value); if (a === null || lo === null || hi === null) return { gap: 'values_missing' }; if (lo > hi) return { gap: 'range_invalid' };
    var mr = Math.min(a - lo, hi - a); return { met: mr >= 0, margin: mr, deviation: null }; }
  if (t === 'at_most') { if (a === null || q === null) return { gap: 'values_missing' }; return { met: q - a >= 0, margin: q - a, deviation: a - q }; }
  if (t === 'at_least') { if (a === null || q === null) return { gap: 'values_missing' }; return { met: a - q >= 0, margin: a - q, deviation: a - q }; }
  if (t === 'text') { if (!dbText(r.required_text) || !dbText(r.actual_text)) return { gap: 'values_missing' }; return { met: dbNorm(r.required_text) === dbNorm(r.actual_text), margin: null, deviation: null }; }
  return { gap: 'type_unsupported' };
}
function dbTrace(r, i) {
  var id = dbText(r.id) || ('trace-' + (i + 1)), gaps = [], v = {}, allNa = true;
  DB_VERTICES.forEach(function (k) { var x = dbVertex(r[k + '_status'], r[k + '_ref'], r.reason); v[k] = x.state; if (x.gap) gaps.push(k + ':' + x.gap); if (x.state !== 'not_applicable') allNa = false; });
  var out = { id: id, parameter: dbText(r.parameter), status: 'unknown', vertices: v, check_type: DB_CHECK.indexOf(r.check_type) >= 0 ? r.check_type : null, check: 'unknown',
    margin: null, deviation: null, required_calcs: dbCalcList(r.required_calcs), gaps: gaps };
  if (allNa) { out.status = 'not_applicable'; out.check = 'not_applicable'; return out; }
  if (r.check_type === 'evidence') out.check = 'not_applicable';
  else if (r.requirement_status === 'confirmed' && r.configuration_status === 'confirmed') {
    var c = dbCheck(r);
    if (c.gap) gaps.push('check:' + c.gap);
    else { out.check = c.met ? 'met' : 'not_met'; out.margin = c.margin; out.deviation = c.deviation; if (!c.met) gaps.push('check:not_met'); }
  } else if (v.requirement !== 'gap' && v.requirement !== 'rejected' && v.configuration !== 'gap' && v.configuration !== 'rejected') gaps.push('check:not_traceable');
  return out;
}

/* ---- LTO chain of one SSC against the target horizon T ---- */
function dbLto(r, i, T) {
  var id = dbText(r.id) || ('lto-' + (i + 1)), g = [], st = { scope: 'gap', screening: 'not_evaluated', amr: 'not_evaluated', amp: 'not_evaluated', tlaa: 'not_evaluated' }, short = null;
  var out = { id: id, ssc: dbText(r.ssc), status: 'unknown', stages: st, tlaa_shortfall_years: null, required_calcs: dbCalcList(r.required_calcs), gaps: g, in_scope: false };
  if (r.scope === 'out_of_scope') { if (dbText(r.reason)) { st.scope = 'not_applicable'; out.status = 'not_applicable'; return out; } g.push('scope:reason_missing'); return out; }
  if (r.scope !== 'in_scope') { g.push('scope:unknown'); return out; }
  out.in_scope = true;
  if (dbText(r.scope_ref)) st.scope = 'ok'; else g.push('scope:source_missing');
  /* screening, AMR, AMP */
  if (r.screening === 'subject_to_amr') {
    st.screening = 'ok';
    if (dbText(r.ageing_mechanisms)) st.amr = 'ok'; else { st.amr = 'gap'; g.push('amr:mechanism_missing'); }
    var a = r.amp_status;
    if (a === 'confirmed') { if (dbText(r.amp_ref)) st.amp = 'ok'; else { st.amp = 'gap'; g.push('amp:source_missing'); } }
    else if (a === 'rejected') { st.amp = 'rejected'; g.push('amp:rejected'); }
    else if (a === 'not_applicable') { st.amp = 'gap'; g.push('amp:missing'); }
    else { st.amp = 'gap'; g.push('amp:unknown'); }
  } else if (r.screening === 'screened_out') {
    if (dbText(r.reason)) { st.screening = 'not_applicable'; st.amr = st.amp = 'not_applicable'; } else { st.screening = 'gap'; g.push('screening:reason_missing'); }
  } else { st.screening = 'gap'; g.push('screening:unknown'); }
  /* TLAA */
  if (r.tlaa_required === 'no') st.tlaa = 'not_applicable';
  else if (r.tlaa_required !== 'yes') { st.tlaa = 'gap'; g.push('tlaa:required_unknown'); }
  else {
    var tg = [], s = r.tlaa_status;
    if (s === 'unknown' || DB_STATUS.indexOf(s) < 0) tg.push('tlaa:unknown');
    else if (s === 'rejected') tg.push('tlaa:rejected');
    else if (s === 'not_applicable') tg.push('tlaa:status_invalid');
    else if (!dbText(r.tlaa_ref)) tg.push('tlaa:source_missing');
    var d = r.tlaa_disposition, vt = dbNum(r.tlaa_valid_to_year), ah = dbNum(r.tlaa_analysis_horizon_year);
    if (d === 'remains_valid' || d === 'projected') {
      if (vt === null) tg.push('tlaa:validity_missing');
      else if (T !== null && vt < T) { tg.push('tlaa:expires_before_horizon'); short = T - vt; }
      if (ah === null) tg.push('tlaa:horizon_missing');
      else if (T !== null && ah !== T) tg.push('tlaa:horizon_changed');
    } else if (d === 'replaced') {
      /* SSG-48 replacement option: the component is replaced before the analysis expires */
      var rp = dbNum(r.tlaa_replacement_year);
      if (vt === null) tg.push('tlaa:validity_missing');
      if (rp === null) tg.push('tlaa:replacement_year_missing');
      if (vt !== null && rp !== null && rp > vt) { tg.push('tlaa:replacement_after_expiry'); short = rp - vt; }
    } else if (d === 'managed_by_amp') {
      if (!(r.amp_status === 'confirmed' && dbText(r.amp_ref))) tg.push('tlaa:managed_without_amp');
    } else tg.push('tlaa:disposition_unknown');
    st.tlaa = tg.some(function (x) { return x === 'tlaa:rejected' || x === 'tlaa:expires_before_horizon' || x === 'tlaa:replacement_after_expiry'; }) ? 'rejected' : (tg.length ? 'gap' : 'ok');
    out.tlaa_shortfall_years = short; tg.forEach(function (x) { g.push(x); });
  }
  return out;
}

/* ---- required calculation records named on a row ---- */
function dbCalcGaps(item, links) {
  item.required_calcs.forEach(function (t) {
    var m = links.filter(function (l) { return dbText(l.tool) === t && dbText(l.supports) === item.id; });
    if (!m.length) item.gaps.push('calc:' + t + ':missing');
    else if (m.some(function (l) { return l.status === 'confirmed'; })) return;
    else if (m.some(function (l) { return l.status === 'rejected'; })) item.gaps.push('calc:' + t + ':rejected');
    else item.gaps.push('calc:' + t + ':unknown');
  });
}
function dbStatus(item) {
  if (item.status === 'not_applicable') return 'not_applicable';
  var rej = item.gaps.some(function (x) { return DB_REJECTING.indexOf(x) >= 0 || /^(requirement|configuration|document|analysis):rejected$/.test(x) || x === 'check:not_met' || /^calc:.+:rejected$/.test(x); });
  return rej ? 'rejected' : (item.gaps.length ? 'unknown' : 'confirmed');

var DB_ACTION_NOT_MET = { basis_recovery: 'resolve_deviation', drift: 'resolve_drift', external: 'reassess_external_hazard', lto: 'resolve_deviation' };
