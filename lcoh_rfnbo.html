  function degrade() {
    document.title = 'diagram-ui.js v1 is required';
    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1');
    h.textContent = 'Levelised cost of hydrogen and RFNBO check';
    var p = document.createElement('p');
    p.textContent = 'The interactive interface could not load. The export, the calculation record '
                  + 'and the limitations are still available from the bar at the bottom of the page.';
    host.appendChild(h);
    host.appendChild(p);
    last = solve(state);
  }

    { id: 'hydro_zone', label: T('Zone > 90 % renewable, 8 000 h/yr', 'Зона > 90 % ВДЕ, 8 000 год/рік', 'Zone > 90 % erneuerbar, 8 000 h/a', 'Zone > 90 % hernieuwbaar, 8 000 h/jr', 'Zone > 90 % renouvelable, 8 000 h/an', 'Zona > 90 % renovable, 8 000 h/año', 'Strefa > 90 % OZE, 8 000 h/rok'),
      note: T('Look at the LCOH: in a bidding zone with 95 % renewables (Art. 4(1)) grid power counts as renewable, and 8 000 h/yr spread the capital — 4.08 EUR/kg, the cheapest RFNBO case here.',
              'Подивіться на LCOH: у торговій зоні з 95 % ВДЕ (ст. 4(1)) мережева енергія вважається відновлюваною, а 8 000 год/рік розподіляють капітал — 4,08 EUR/кг, найдешевший випадок RFNBO тут.',
              'Achten Sie auf LCOH: In einer Gebotszone mit 95 % Erneuerbaren (Art. 4(1)) gilt Netzstrom als erneuerbar, und 8 000 h/a verteilen das Kapital — 4,08 EUR/kg, der günstigste RFNBO-Fall hier.',
              'Kijk naar de LCOH: in een biedzone met 95 % hernieuwbaar (art. 4(1)) telt netstroom als hernieuwbaar en 8 000 h/jr spreiden het kapitaal — 4,08 EUR/kg, het goedkoopste RFNBO-geval hier.',
              'Regardez le LCOH : dans une zone à 95 % renouvelable (art. 4(1)), l’électricité du réseau compte comme renouvelable et 8 000 h/an répartissent le capital — 4,08 EUR/kg, le cas RFNBO le moins cher ici.',
              'Fíjese en el LCOH: en una zona de oferta con un 95 % renovable (art. 4(1)) la electricidad de red cuenta como renovable y 8 000 h/año reparten el capital; 4,08 EUR/kg, el caso RFNBO más barato aquí.',
              'Zwróć uwagę na LCOH: w strefie cenowej z 95 % OZE (art. 4(1)) energia z sieci liczy się jako odnawialna, a 8 000 h/rok rozkłada kapitał — 4,08 EUR/kg, najtańszy przypadek RFNBO tutaj.'),
      apply: function (t) { t.source = 'grid_res'; t.flh = 8000; t.elec_price = 45; t.grid_res_share = 0.95; t.level = 'simple'; } },
    { id: 'hydro_8500', label: T('Same zone, 8 500 h/yr', 'Та сама зона, 8 500 год/рік', 'Gleiche Zone, 8 500 h/a', 'Zelfde zone, 8 500 h/jr', 'Même zone, 8 500 h/an', 'Misma zona, 8 500 h/año', 'Ta sama strefa, 8 500 h/rok'),
      note: T('Look at the hours check: 500 more hours lower the LCOH only from 4.08 to 3.98 EUR/kg, but exceed 0.95 × 8 760 = 8 322 h, so the RFNBO share falls to 0 % (Art. 4(1)).',
              'Подивіться на перевірку годин: ще 500 годин знижують LCOH лише з 4,08 до 3,98 EUR/кг, але перевищують 0,95 × 8 760 = 8 322 год, тож частка RFNBO падає до 0 % (ст. 4(1)).',
              'Achten Sie auf die Stundenprüfung: 500 Stunden mehr senken LCOH nur von 4,08 auf 3,98 EUR/kg, überschreiten aber 0,95 × 8 760 = 8 322 h, daher fällt der RFNBO-Anteil auf 0 % (Art. 4(1)).',
              'Kijk naar de urentoets: 500 uur meer verlagen de LCOH maar van 4,08 naar 3,98 EUR/kg, maar overschrijden 0,95 × 8 760 = 8 322 h, dus het RFNBO-aandeel zakt naar 0 % (art. 4(1)).',
              'Regardez le contrôle des heures : 500 heures de plus ne font baisser le LCOH que de 4,08 à 3,98 EUR/kg, mais dépassent 0,95 × 8 760 = 8 322 h, la part RFNBO tombe donc à 0 % (art. 4(1)).',
              'Fíjese en la comprobación de horas: 500 horas más solo bajan el LCOH de 4,08 a 3,98 EUR/kg, pero superan 0,95 × 8 760 = 8 322 h, así que la cuota RFNBO cae al 0 % (art. 4(1)).',
              'Zwróć uwagę na kontrolę godzin: 500 godzin więcej obniża LCOH tylko z 4,08 do 3,98 EUR/kg, ale przekracza 0,95 × 8 760 = 8 322 h, więc udział RFNBO spada do 0 % (art. 4(1)).'),
      apply: function (t) { t.source = 'grid_res'; t.flh = 8500; t.elec_price = 45; t.grid_res_share = 0.95; t.level = 'simple'; } },
    { id: 'grid_mix', label: T('Average EU grid (not RFNBO)', 'Середня мережа ЄС (не RFNBO)', 'EU-Netzmix (kein RFNBO)', 'Gemiddeld EU-net (geen RFNBO)', 'Réseau UE moyen (pas RFNBO)', 'Red media de la UE (no RFNBO)', 'Średnia sieć UE (nie RFNBO)'),
      note: T('Look at the GHG intensity: grid power at 70 gCO₂e/MJ gives 115.5 gCO₂e/MJ of hydrogen — more than the 94 g/MJ fossil comparator (−22.8 % saving) — so grid hydrogen fails the 70 % saving by far.',
              'Подивіться на інтенсивність ПГ: мережева енергія з 70 гCO₂e/МДж дає 115,5 гCO₂e/МДж водню — більше за викопний еталон 94 г/МДж (скорочення −22,8 %) — тож мережевий водень далеко не досягає скорочення 70 %.',
              'Achten Sie auf die THG-Intensität: Netzstrom mit 70 gCO₂e/MJ ergibt 115,5 gCO₂e/MJ Wasserstoff — mehr als der fossile Vergleichswert 94 g/MJ (Einsparung −22,8 %) —, Netz-Wasserstoff verfehlt die 70 % also deutlich.',
              'Kijk naar de broeikasgasintensiteit: netstroom met 70 gCO₂e/MJ geeft 115,5 gCO₂e/MJ waterstof — meer dan de fossiele referentie 94 g/MJ (besparing −22,8 %) — dus netwaterstof haalt de 70 % besparing bij lange na niet.',
              'Regardez l’intensité GES : l’électricité du réseau à 70 gCO₂e/MJ donne 115,5 gCO₂e/MJ d’hydrogène — plus que le comparateur fossile de 94 g/MJ (réduction −22,8 %) — l’hydrogène du réseau échoue donc largement aux 70 %.',
              'Fíjese en la intensidad de GEI: la electricidad de red a 70 gCO₂e/MJ da 115,5 gCO₂e/MJ de hidrógeno, más que el comparador fósil de 94 g/MJ (ahorro −22,8 %), así que el hidrógeno de red queda muy lejos del 70 %.',
              'Zwróć uwagę na emisyjność GHG: energia z sieci o 70 gCO₂e/MJ daje 115,5 gCO₂e/MJ wodoru — więcej niż kopalny punkt odniesienia 94 g/MJ (redukcja −22,8 %) — więc wodór z sieci daleko nie osiąga 70 %.'),
      apply: function (t) { t.source = 'grid'; t.flh = 8000; t.elec_price = 80; t.grid_ef = 70; t.level = 'full'; } }
    ]; ui.examples(EX);

    function curveData() {
      if (!last || !last.ok) return null;
      var s = {}, k, i, r, pts = [], ymx = 0, f;
      for (k in state) if (Object.prototype.hasOwnProperty.call(state, k)) s[k] = state[k];
      for (i = 0; i <= 35; i++) {
        f = 500 + i * 236; s.flh = f; r = solve(s);
        if (r && r.ok && isFinite(r.lcoh)) { pts.push({ x: f, y: r.lcoh, e: r.c_elec, c: r.c_capex + r.c_stack + r.c_opex }); ymx = Math.max(ymx, Math.min(r.lcoh, 4 * last.lcoh)); }
      }
      return { pts: pts, xMin: 0, xMax: 8760, yMin: 0, yMax: Math.max(ymx, last.lcoh) * 1.08, xCur: state.flh, yCur: last.lcoh };
    }
    ui.stage({
      caption: T('Levelised cost of hydrogen versus full-load hours, with the electricity and the capital, stack and O&M parts (LHV, EUR 2025)', 'Нормована вартість водню залежно від годин повного навантаження, зі складовими електроенергії та капіталу, стека й експлуатації (LHV, EUR 2025)', 'Wasserstoffgestehungskosten über Volllaststunden mit Strom- sowie Kapital-, Stack- und Betriebsanteil (Hi, EUR 2025)', 'Genivelleerde waterstofkosten tegen vollasturen, met het deel elektriciteit en het deel kapitaal, stack en O&M (LHV, EUR 2025)', 'Coût actualisé de l’hydrogène en fonction des heures à pleine charge, avec les parts électricité et capital, stack et exploitation (PCI, EUR 2025)', 'Coste nivelado del hidrógeno frente a horas a plena carga, con la parte de electricidad y la de capital, stack y O&M (PCI, EUR 2025)', 'Uśredniony koszt wodoru w funkcji godzin pełnego obciążenia, z częścią energii oraz kapitału, stosu i eksploatacji (LHV, EUR 2025)'),
      minHeight: 300,
      a11y: function () {
        if (!last || !last.ok) return '';
        var a = DiagramUI.fmt(last.lcoh, { precision: 2 }), b = DiagramUI.fmt(state.flh, { precision: 0 });
        return tx(T('Line chart: levelised cost of hydrogen in EUR/kg versus full-load hours 500–8 760 h per year, split into the electricity part and the capital, stack and O&M part; current point ' + b + ' h/yr at ' + a + ' EUR/kg.',
          'Лінійний графік: нормована вартість водню в EUR/кг залежно від годин повного навантаження 500–8 760 год на рік, з розділенням на складову електроенергії та складову капіталу, стека й експлуатації; поточна точка ' + b + ' год/рік при ' + a + ' EUR/кг.',
          'Liniendiagramm: Wasserstoff-Gestehungskosten in EUR/kg über den Volllaststunden 500–8 760 h pro Jahr, aufgeteilt in Stromanteil und Anteil Kapital, Stack und Betrieb; aktueller Punkt ' + b + ' h/a bei ' + a + ' EUR/kg.',
          'Lijngrafiek: genivelleerde waterstofkosten in EUR/kg tegen vollasturen 500–8 760 h per jaar, opgesplitst in het deel elektriciteit en het deel kapitaal, stack en O&M; huidig punt ' + b + ' h/jr bij ' + a + ' EUR/kg.',
          'Graphique linéaire : coût actualisé de l’hydrogène en EUR/kg en fonction des heures à pleine charge 500–8 760 h par an, réparti entre la part électricité et la part capital, stack et exploitation ; point actuel ' + b + ' h/an à ' + a + ' EUR/kg.',
          'Gráfico de líneas: coste nivelado del hidrógeno en EUR/kg frente a las horas a plena carga 500–8 760 h al año, dividido en la parte de electricidad y la de capital, stack y O&M; punto actual ' + b + ' h/año a ' + a + ' EUR/kg.',
          'Wykres liniowy: uśredniony koszt wodoru w EUR/kg w funkcji godzin pełnego obciążenia 500–8 760 h rocznie, z podziałem na część energii oraz część kapitału, stosu i eksploatacji; bieżący punkt ' + b + ' h/rok przy ' + a + ' EUR/kg.'));
      },
      render: function (size, st) {
        var ctx = st.canvas(), w = size.w, h = size.h, coarse = size.density === 'coarse';
        var cs = getComputedStyle(document.documentElement);
        var muted = cs.getPropertyValue('--muted').trim() || '#888', line = cs.getPropertyValue('--line').trim() || '#ccc', font = cs.getPropertyValue('--font').trim() || 'sans-serif';
        ctx.clearRect(0, 0, w, h);
        var d = curveData(); if (!d) return;
        var L = coarse ? 46 : 58, R = 14, TOP = 12, B = coarse ? 36 : 44, pw = w - L - R, ph = h - TOP - B, i, t;
        function X(x) { return L + (x - d.xMin) / (d.xMax - d.xMin) * pw; }
        function Y(y) { return TOP + ph - (y - d.yMin) / (d.yMax - d.yMin) * ph; }
        function seg(x0, y0, x1, y1, col, lw, dash) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.setLineDash(dash || []); ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
        seg(L, TOP, L, TOP + ph, line, 1); seg(L, TOP + ph, L + pw, TOP + ph, line, 1);
        ctx.fillStyle = muted; ctx.font = (coarse ? 11 : 12) + 'px ' + font;
        var xt = DiagramUI.ticks(d.xMin, d.xMax, pw, size.density), yt = DiagramUI.ticks(d.yMin, d.yMax, ph, size.density);
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        for (i = 0; i < xt.length; i++) { t = X(xt[i]); seg(t, TOP + ph, t, TOP + ph + 4, line, 1); ctx.fillText(DiagramUI.fmt(xt[i], { precision: 0 }), t, TOP + ph + 6); }
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        for (i = 0; i < yt.length; i++) { t = Y(yt[i]); seg(L - 4, t, L, t, line, 1); ctx.fillText(DiagramUI.fmt(yt[i], { precision: 1 }), L - 6, t); }
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText('h/yr', L + pw / 2, h - 2);
        ctx.save(); ctx.translate(12, TOP + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textBaseline = 'middle'; ctx.fillText('EUR/kg', 0, 0); ctx.restore();
        ctx.save(); ctx.beginPath(); ctx.rect(L, TOP, pw, ph); ctx.clip();
        seg(X(d.xCur), TOP, X(d.xCur), TOP + ph, muted, 1, [5, 4]);
        function poly(key, col, lw, dash) { ctx.setLineDash(dash || []); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
          for (var j = 0; j < d.pts.length; j++) { if (j) ctx.lineTo(X(d.pts[j].x), Y(d.pts[j][key])); else ctx.moveTo(X(d.pts[j].x), Y(d.pts[j][key])); } ctx.stroke(); }
        poly('e', DiagramUI.series(1), 1.5, [6, 3]); poly('c', DiagramUI.series(2), 1.5, [2, 3]);
        ctx.setLineDash([]); ctx.strokeStyle = DiagramUI.series(0); ctx.lineWidth = 2; ctx.beginPath();
        for (i = 0; i < d.pts.length; i++) { if (i) ctx.lineTo(X(d.pts[i].x), Y(d.pts[i].y)); else ctx.moveTo(X(d.pts[i].x), Y(d.pts[i].y)); }
        ctx.stroke();
        if (isFinite(d.yCur)) { ctx.fillStyle = DiagramUI.series(0); ctx.beginPath(); ctx.arc(X(d.xCur), Y(d.yCur), coarse ? 3 : 4, 0, 2 * Math.PI); ctx.fill(); }
        ctx.restore();
      }
    });
    adoptStage(ui);

    ui.ready();
    window['__lcoh_rfnbo'] = { ui: ui, state: state, solve: solve, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function buildRecord(){
    if (!last) return null;
    var inputs = {}, outputs = {}, units = {}, warnings, i, k;
    var inU = [
      ['level','-'], ['P_MW','MW (electrical)'], ['capex_kW','EUR/kW'], ['opex_pct','%/yr of capex'], ['sec','kWh/kg'], ['flh','h/yr'],
      ['stack_life_h','h'], ['stack_pct','% of capex'], ['elec_price','EUR/MWh'], ['water_L','L/kg'], ['water_price','EUR/m3'],
      ['wacc','-'], ['life','yr'], ['source','-'], ['res_share','-'], ['corr','-'], ['same_zone','-'], ['res_age_m','months'],
      ['res_no_aid','-'], ['cod_year','yr'], ['year','yr'], ['grid_res_share','-'], ['grid_ef','gCO2e/MJ electricity'], ['other_kg','kgCO2e/kg H2']
    ];
    for (i = 0; i < inU.length; i++) { k = inU[i][0]; inputs[k] = state[k]; units[k] = inU[i][1]; }
    if (last.ok) {
      var outU = [
        ['lcoh','EUR/kg'], ['lcoh_MWh','EUR/MWh (LHV)'], ['c_capex','EUR/kg'], ['c_stack','EUR/kg'], ['c_opex','EUR/kg'], ['c_elec','EUR/kg'], ['c_water','EUR/kg'],
        ['m_t','t/yr'], ['E_GWh','GWh/yr'], ['eff_lhv','-'], ['capex_total','EUR'], ['crf','1/yr'], ['stacks','-'],
        ['f_ren','-'], ['rfnbo_t','t/yr'], ['rfnbo','-'], ['rfnbo_share_pct','%'],
        ['e_elec','gCO2e/MJ H2 (LHV)'], ['e_other','gCO2e/MJ H2 (LHV)'], ['e_tot','gCO2e/MJ H2 (LHV)'], ['e_kg','kgCO2e/kg H2'],
        ['e_rfnbo','gCO2e/MJ H2 (LHV)'], ['saving_pct','%'], ['ghg_limit','gCO2e/MJ H2 (LHV)'], ['ghg_pass','-'], ['energy_basis','-']
      ];
      for (i = 0; i < outU.length; i++) { k = outU[i][0]; outputs[k] = last[k]; units[k] = outU[i][1]; }
      warnings = (last.warnings || []).slice();
      for (i = 0; i < last.checks.length; i++) { outputs['check_' + last.checks[i].id] = last.checks[i].ok; units['check_' + last.checks[i].id] = last.checks[i].text; }
    } else {
      warnings = [last.error];
    }
    return {
      inputs: inputs,
      outputs: outputs,
      units: units,
      model: {
        equations: [
          'm = P * flh / sec (kg/yr)',
          'CRF = i (1+i)^n / ((1+i)^n - 1)',
          'LCOH = (capex * CRF + PV(stack replacements) * CRF + O&M) / m + sec * price + water',
          'Commission Delegated Regulation (EU) 2023/1184 (2023-02-10): Art. 3, 4, 5, 6, 7, 11',
          'Commission Delegated Regulation (EU) 2023/1185 (2023-02-10): e = (1 - f_ren) * sec * 3.6 * EF_grid / 120 + e_other; RFNBO if e <= 0.3 * 94 = 28.2 gCO2e/MJ'
        ],
        ranges: [ 'Grid-connected or directly connected electrolysers, 100 - 8760 h/yr', 'Constant yearly operation and prices (no degradation, no price profile)' ],
        notes: [
          'Energy basis: hydrogen LHV 120 MJ/kg (33.3 kWh/kg)',
          'Grid electricity not covered by a renewable route is counted at the grid intensity and not as RFNBO',
          'Simplified rule check, not a certification audit'
        ]
      },
      warnings: warnings
    };
  }

  var HANDOFF = {
    provides: ['mdot'],
    accepts: [],
    build: function(){
      if (!(last && last.ok)) return null;
      return {
        quantities: {
          mdot: { value: last.m_t * 1000 / (state.flh * 3600), unit: 'kg/s' }
        },
        sets: {
          /* numeric rows only; rfnbo flag and basis stay in the record; EUR/kg has no SI unit -> '-' */
          h2_product: [{ CI_kgCO2e_kg: { value: last.e_kg, unit: 'kg/kg' }, rfnbo_share: { value: last.rfnbo_share_pct / 100, unit: '-' }, P_el: { value: state.P_MW * 1e6, unit: 'W' } }],
          econ: [{ lcoh_EUR_per_kg: { value: last.lcoh, unit: '-' } }]
        }
      };
    },
    apply: function(payload){
      /* nothing is accepted: electrolyser power is neither E (J/kg) nor Q */
      last = solve(state);
      if (ui) { ui.sync(); ui.run(); }
    }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'lcoh_rfnbo',
        file: 'lcoh_rfnbo.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
