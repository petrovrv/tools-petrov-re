 "summary": {
  "en": "Builds a load list per board and operating case: demand P, Q, S and current, board diversity, transformer and generator loading, the largest-motor start step and UPS battery energy.",
  "uk": "Складає перелік навантажень за секціями та режимами: P, Q, S і струм, коефіцієнт одночасності секції, завантаження трансформаторів і генераторів, пусковий крок найбільшого двигуна та енергію батареї ДБЖ.",
  "de": "Erstellt die Lastenliste je Schiene und Betriebsfall: Bedarf P, Q, S und Strom, Gleichzeitigkeitsfaktor der Schiene, Transformator- und Generatorauslastung, Anlaufstufe des größten Motors und USV-Batterieenergie.",
  "nl": "Stelt de belastingslijst op per rail en bedrijfsgeval: vraag P, Q, S en stroom, gelijktijdigheidsfactor per rail, transformator- en generatorbelasting, aanloopstap van de grootste motor en UPS-batterijenergie.",
  "fr": "Établit le bilan de puissance par tableau et cas d’exploitation : P, Q, S et courant appelés, facteur de simultanéité du tableau, charge des transformateurs et des groupes, gradin de démarrage du plus gros moteur et énergie de la batterie ASI.",
  "es": "Elabora el listado de cargas por cuadro y caso de operación: demanda P, Q, S y corriente, factor de simultaneidad del cuadro, carga de transformadores y generadores, escalón de arranque del motor mayor y energía de batería del SAI.",
  "pl": "Tworzy listę odbiorów dla każdej rozdzielnicy i przypadku pracy: zapotrzebowanie P, Q, S i prąd, współczynnik jednoczesności rozdzielnicy, obciążenie transformatorów i generatorów, stopień rozruchu największego silnika oraz energię baterii UPS."
 },
 "description": {
  "en": "Every consumer carries its board, type, rated power, efficiency, power factor, quantity installed and in duty, supply category, phase count and voltage, and one load factor for each of five operating cases (normal, peak, start-up, emergency, maintenance). Per board and per case the tool sums P and Q over the units that run, applies a coincidence factor — the distribution rows of IEC 61439-2:2020 Table 101 by default, or a value you enter — and reports S, the current at the entered nominal voltage and the resulting power factor. A sub-board is a load of its parent; a board fed by its own source in a case stops that propagation; a board behind a UPS contributes P divided by the inverter efficiency. Transformer and generator loading, a one-step largest-motor start screen built from the locked-rotor ratio, UPS loading and an indicative battery energy follow from the same arithmetic. The design current and the voltage of a selected load or board feeder are handed to Cable Sizing. Harmonic analysis, short-circuit duty, protection settings, conductor selection, energy over time and tariffs are outside the model.",
  "uk": "Кожен споживач несе секцію, тип, номінальну потужність, ККД, коефіцієнт потужності, кількість установлену та в роботі, категорію живлення, число фаз і напругу, а також коефіцієнт завантаження для кожного з п’яти режимів (нормальний, піковий, пусковий, аварійний, ремонтний). Для кожної секції та режиму інструмент додає P і Q по агрегатах, що працюють, застосовує коефіцієнт одночасності — за умовчанням рядки «розподіл» таблиці 101 IEC 61439-2:2020 або задане вами значення — і подає S, струм за введеною номінальною напругою та отриманий коефіцієнт потужності. Підсекція є навантаженням своєї секції; секція, яка в цьому режимі живиться власним джерелом, далі не передається; секція за ДБЖ віддає P, поділене на ККД інвертора. Звідси ж виходять завантаження трансформаторів і генераторів, однокроковий контроль пуску найбільшого двигуна за кратністю пускового струму, завантаження ДБЖ та орієнтовна енергія батареї. Розрахунковий струм і напруга вибраного навантаження або фідера секції передаються до «Вибору кабелю». Гармоніки, струми КЗ, уставки захисту, вибір перерізу, спожита енергія за час і тарифи поза моделлю.",
  "de": "Jeder Verbraucher trägt Schiene, Typ, Bemessungsleistung, Wirkungsgrad, Leistungsfaktor, installierte und betriebene Stückzahl, Versorgungskategorie, Phasenzahl und Spannung sowie je einen Belastungsfaktor für fünf Betriebsfälle (Normal, Spitze, Anlauf, Notbetrieb, Instandhaltung). Je Schiene und Fall summiert das Werkzeug P und Q über die laufenden Einheiten, wendet einen Gleichzeitigkeitsfaktor an — voreingestellt die Verteilungszeilen der Tabelle 101 aus IEC 61439-2:2020 oder ein von Ihnen eingegebener Wert — und gibt S, den Strom bei der eingegebenen Nennspannung und den resultierenden Leistungsfaktor aus. Eine Unterverteilung ist eine Last ihrer übergeordneten Schiene; eine Schiene, die im betrachteten Fall von einer eigenen Quelle gespeist wird, gibt nichts nach oben weiter; eine Schiene hinter einer USV liefert P geteilt durch den Wechselrichter-Wirkungsgrad. Transformator- und Generatorauslastung, eine einstufige Anlaufprüfung des größten Motors aus dem Anzugsstromverhältnis, USV-Auslastung und eine Richtgröße der Batterieenergie folgen derselben Rechnung. Bemessungsstrom und Spannung einer gewählten Last oder eines Schienenabgangs gehen an die Kabelauswahl. Oberschwingungen, Kurzschlussbeanspruchung, Schutzeinstellungen, Leiterauswahl, Energie über die Zeit und Tarife liegen außerhalb des Modells.",
  "nl": "Elke verbruiker draagt zijn rail, type, nominaal vermogen, rendement, arbeidsfactor, aantal geïnstalleerd en in bedrijf, voedingscategorie, fasenaantal en spanning, plus één belastingsfactor voor elk van vijf bedrijfsgevallen (normaal, piek, aanloop, nood, onderhoud). Per rail en per geval telt de tool P en Q op over de draaiende eenheden, past een gelijktijdigheidsfactor toe — standaard de distributierijen van tabel 101 uit IEC 61439-2:2020, of een waarde die u invoert — en geeft S, de stroom bij de ingevoerde nominale spanning en de resulterende arbeidsfactor. Een onderverdeler is een belasting van zijn moederrail; een rail die in dat geval door een eigen bron gevoed wordt, geeft niets door naar boven; een rail achter een UPS levert P gedeeld door het omvormerrendement. Transformator- en generatorbelasting, een eenstaps aanloopcontrole van de grootste motor uit de aanloopstroomverhouding, UPS-belasting en een indicatieve batterij-energie volgen uit dezelfde rekensom. De ontwerpstroom en de spanning van een gekozen belasting of railvoeding gaan naar Kabelberekening. Harmonischen, kortsluitbelasting, beveiligingsinstellingen, geleiderkeuze, energie over de tijd en tarieven vallen buiten het model.",
  "fr": "Chaque récepteur porte son tableau, son type, sa puissance assignée, son rendement, son facteur de puissance, les quantités installée et en service, sa catégorie d’alimentation, son nombre de phases et sa tension, ainsi qu’un facteur de charge pour chacun des cinq cas d’exploitation (normal, pointe, démarrage, secours, maintenance). Par tableau et par cas, l’outil somme P et Q sur les unités en marche, applique un facteur de simultanéité — par défaut les lignes « distribution » du tableau 101 de la CEI 61439-2:2020, ou une valeur que vous saisissez — et donne S, le courant à la tension nominale saisie et le facteur de puissance obtenu. Un tableau divisionnaire est une charge de son tableau amont ; un tableau alimenté par sa propre source dans ce cas ne remonte rien ; un tableau derrière une ASI remonte P divisé par le rendement de l’onduleur. La charge des transformateurs et des groupes, un contrôle de démarrage en un gradin du plus gros moteur à partir du rapport de courant rotor bloqué, la charge de l’ASI et une énergie batterie indicative découlent du même calcul. Le courant d’emploi et la tension d’une charge ou d’un départ sélectionné sont transmis au Dimensionnement de câble. Harmoniques, contraintes de court-circuit, réglages de protection, choix des conducteurs, énergie dans le temps et tarifs sortent du modèle.",
  "es": "Cada receptor lleva su cuadro, tipo, potencia asignada, rendimiento, factor de potencia, cantidades instalada y en servicio, categoría de alimentación, número de fases y tensión, además de un factor de carga para cada uno de los cinco casos de operación (normal, punta, arranque, emergencia, mantenimiento). Por cuadro y por caso la herramienta suma P y Q sobre las unidades en marcha, aplica un factor de simultaneidad — por defecto las filas de distribución de la tabla 101 de IEC 61439-2:2020, o un valor que usted introduzca — y da S, la corriente a la tensión nominal introducida y el factor de potencia resultante. Un subcuadro es una carga de su cuadro aguas arriba; un cuadro alimentado por su propia fuente en ese caso no propaga nada; un cuadro tras un SAI aporta P dividido por el rendimiento del inversor. La carga de transformadores y generadores, un control de arranque en un escalón del motor mayor a partir de la relación de corriente de rotor bloqueado, la carga del SAI y una energía de batería indicativa salen del mismo cálculo. La corriente de diseño y la tensión de una carga o salida seleccionada se entregan al Dimensionado de cables. Armónicos, solicitación de cortocircuito, ajustes de protección, elección de conductores, energía en el tiempo y tarifas quedan fuera del modelo.",
  "pl": "Każdy odbiornik niesie swoją rozdzielnicę, typ, moc znamionową, sprawność, współczynnik mocy, liczbę zainstalowaną i pracującą, kategorię zasilania, liczbę faz i napięcie oraz po jednym współczynniku obciążenia dla pięciu przypadków pracy (normalny, szczytowy, rozruchowy, awaryjny, remontowy). Dla każdej rozdzielnicy i przypadku narzędzie sumuje P i Q po pracujących jednostkach, stosuje współczynnik jednoczesności — domyślnie wiersze rozdziału z tablicy 101 normy IEC 61439-2:2020 albo wartość wpisaną przez użytkownika — i podaje S, prąd przy wpisanym napięciu znamionowym oraz wynikowy współczynnik mocy. Rozdzielnica podrzędna jest odbiorem rozdzielnicy nadrzędnej; rozdzielnica zasilana w danym przypadku z własnego źródła nie przenosi nic wyżej; rozdzielnica za UPS-em oddaje P podzielone przez sprawność falownika. Z tego samego rachunku wynikają obciążenie transformatorów i generatorów, jednostopniowa kontrola rozruchu największego silnika z krotności prądu rozruchowego, obciążenie UPS-a i orientacyjna energia baterii. Prąd obliczeniowy i napięcie wybranego odbioru lub pola zasilającego trafiają do Doboru kabla. Analiza harmonicznych, obciążenia zwarciowe, nastawy zabezpieczeń, dobór przewodów, energia w czasie i taryfy są poza modelem."
 },
 "status": "benchmarked",
 "independent_validation": false,
 "limitations": {
  "en": "Steady-state balanced demand arithmetic: no load flow, no voltage drop, no busbar voltage solution; currents follow the nominal voltage entered. Single-phase loads are added to three-phase totals as if spread evenly over the phases, so unbalance and neutral current are not computed. The power factor is the displacement power factor and is held at its full-load value at part load; drive, UPS rectifier and IT harmonics are not modelled, so the true RMS current of such loads is under-stated. Load factors are user entries, not derived from process duty. The default board diversity is the distribution rows of IEC 61439-2:2020 Table 101, a switchgear design assumption used here as a demand coincidence factor, and it compounds at every board level. The motor-start check is a one-step apparent-power screen with a user-entered locked-rotor ratio: no voltage dip, no acceleration time, no transient reactance, no governor or AVR response. UPS battery energy is indicative and excludes ageing, temperature, end-of-discharge voltage, Peukert behaviour and charger input power. Transformer and generator loading carry no temperature, altitude or overload derating. The permalink holds about 25 to 35 loads; a longer list travels as record JSON, CSV or project package. No standard is implemented in full.",
  "uk": "Арифметика усталеного збалансованого попиту: без потокорозподілу, без втрат напруги, без розв’язку напруги на шинах; струми рахуються за введеною номінальною напругою. Однофазні навантаження додаються до трифазних сум так, ніби вони рівномірно розподілені по фазах, тож несиметрія та струм нейтралі не обчислюються. Коефіцієнт потужності — це коефіцієнт зсуву, він тримається на повнонавантаженому значенні й при частковому завантаженні; гармоніки перетворювачів, випрямлячів ДБЖ і ІТ-живлення не моделюються, тому дійсний середньоквадратичний струм таких навантажень занижено. Коефіцієнти завантаження вводить користувач, вони не виводяться з технологічного режиму. Типова одночасність секції — рядки «розподіл» таблиці 101 IEC 61439-2:2020, проєктне припущення для НКУ, вжите тут як коефіцієнт одночасності попиту, і воно перемножується на кожному рівні секцій. Перевірка пуску — однокроковий контроль повної потужності за введеною кратністю пускового струму: без провалу напруги, часу розгону, надперехідного опору та реакції регулятора чи АРЗ. Енергія батареї ДБЖ орієнтовна: без старіння, температури, кінцевої напруги розряду, ефекту Пейкерта та потужності заряджання. Завантаження трансформаторів і генераторів без поправок на температуру, висоту чи перевантаження. Постійне посилання вміщає приблизно 25–35 навантажень; довший перелік передається як JSON запису, CSV або пакет проєкту. Жоден стандарт не реалізовано повністю.",
  "de": "Stationäre symmetrische Bedarfsrechnung: keine Lastflussrechnung, kein Spannungsfall, keine Schienenspannung; die Ströme folgen der eingegebenen Nennspannung. Einphasige Lasten werden den dreiphasigen Summen zugeschlagen, als wären sie gleichmäßig auf die Phasen verteilt, daher werden Unsymmetrie und Neutralleiterstrom nicht berechnet. Der Leistungsfaktor ist der Verschiebungsfaktor und bleibt auch bei Teillast auf dem Volllastwert; Oberschwingungen von Umrichtern, USV-Gleichrichtern und IT-Netzteilen sind nicht modelliert, der echte Effektivstrom solcher Lasten wird also zu klein angegeben. Belastungsfaktoren sind Eingaben und werden nicht aus dem Prozessbetrieb abgeleitet. Die voreingestellte Gleichzeitigkeit je Schiene sind die Verteilungszeilen der Tabelle 101 aus IEC 61439-2:2020, eine Auslegungsannahme für Schaltgerätekombinationen, hier als Bedarfs-Gleichzeitigkeitsfaktor verwendet, und sie multipliziert sich über jede Schienenebene. Die Anlaufprüfung ist eine einstufige Scheinleistungsabschätzung mit eingegebenem Anzugsstromverhältnis: kein Spannungseinbruch, keine Hochlaufzeit, keine transiente Reaktanz, keine Regler- oder AVR-Antwort. Die USV-Batterieenergie ist ein Richtwert ohne Alterung, Temperatur, Entladeschlussspannung, Peukert-Verhalten und Ladeleistung. Transformator- und Generatorauslastung tragen keine Temperatur-, Höhen- oder Überlastminderung. Der Permalink fasst etwa 25 bis 35 Lasten; eine längere Liste reist als Record-JSON, CSV oder Projektpaket. Keine Norm ist vollständig umgesetzt.",
  "nl": "Stationaire symmetrische vraagberekening: geen lastverdeling, geen spanningsval, geen railspanningsoplossing; stromen volgen de ingevoerde nominale spanning. Eenfasige belastingen worden bij de driefasige totalen opgeteld alsof ze gelijk over de fasen verdeeld zijn, dus onbalans en nulleiderstroom worden niet berekend. De arbeidsfactor is de verschuivingsfactor en blijft bij deellast op de vollastwaarde; harmonischen van omvormers, UPS-gelijkrichters en IT-voedingen zijn niet gemodelleerd, waardoor de werkelijke effectieve stroom van zulke belastingen te laag uitkomt. Belastingsfactoren zijn invoer en worden niet uit het procesbedrijf afgeleid. De standaard gelijktijdigheid per rail zijn de distributierijen van tabel 101 uit IEC 61439-2:2020, een ontwerpaanname voor schakelinstallaties, hier gebruikt als gelijktijdigheidsfactor van de vraag, en zij vermenigvuldigt zich op elk railniveau. De aanloopcontrole is een eenstaps schijnbaar-vermogenstoets met een ingevoerde aanloopstroomverhouding: geen spanningsdip, geen aanlooptijd, geen transiënte reactantie, geen regelaar- of AVR-respons. De UPS-batterijenergie is indicatief en laat veroudering, temperatuur, ontlaadeindspanning, Peukert-gedrag en laadvermogen buiten beschouwing. Transformator- en generatorbelasting dragen geen temperatuur-, hoogte- of overbelastingsreductie. De permalink houdt ongeveer 25 tot 35 belastingen; een langere lijst reist als record-JSON, CSV of projectpakket. Geen norm is volledig geïmplementeerd.",
  "fr": "Arithmétique de puissance appelée en régime permanent équilibré : pas de répartition de charge, pas de chute de tension, pas de résolution de la tension des jeux de barres ; les courants suivent la tension nominale saisie. Les charges monophasées s’ajoutent aux totaux triphasés comme si elles étaient réparties également sur les phases, donc le déséquilibre et le courant de neutre ne sont pas calculés. Le facteur de puissance est le facteur de déplacement et reste à sa valeur pleine charge en charge partielle ; les harmoniques des variateurs, des redresseurs d’ASI et des alimentations informatiques ne sont pas modélisés, de sorte que le courant efficace réel de ces charges est sous-estimé. Les facteurs de charge sont des saisies et ne sont pas déduits du régime du procédé. La simultanéité par défaut est celle des lignes « distribution » du tableau 101 de la CEI 61439-2:2020, une hypothèse de conception d’ensembles d’appareillage employée ici comme facteur de simultanéité de la demande, et elle se cumule à chaque niveau de tableau. Le contrôle de démarrage est un gradin unique en puissance apparente avec un rapport de courant rotor bloqué saisi : pas de creux de tension, pas de temps d’accélération, pas de réactance transitoire, pas de réponse du régulateur ni de l’AVR. L’énergie batterie de l’ASI est indicative et exclut le vieillissement, la température, la tension de fin de décharge, l’effet Peukert et la puissance du chargeur. La charge des transformateurs et des groupes ne porte aucun déclassement de température, d’altitude ou de surcharge. Le lien permanent contient environ 25 à 35 charges ; une liste plus longue voyage en JSON d’enregistrement, en CSV ou dans le paquet projet. Aucune norme n’est mise en œuvre intégralement.",
  "es": "Aritmética de demanda en régimen permanente equilibrado: sin flujo de carga, sin caída de tensión, sin resolución de la tensión de barras; las corrientes siguen la tensión nominal introducida. Las cargas monofásicas se suman a los totales trifásicos como si estuvieran repartidas por igual entre las fases, por lo que el desequilibrio y la corriente de neutro no se calculan. El factor de potencia es el de desplazamiento y se mantiene en su valor a plena carga también a carga parcial; los armónicos de variadores, rectificadores de SAI y fuentes informáticas no se modelan, de modo que la corriente eficaz real de esas cargas queda por debajo. Los factores de carga son entradas del usuario y no se deducen del régimen del proceso. La simultaneidad por defecto del cuadro son las filas de distribución de la tabla 101 de IEC 61439-2:2020, una hipótesis de diseño de conjuntos de aparamenta empleada aquí como factor de simultaneidad de la demanda, y se acumula en cada nivel de cuadro. El control de arranque es un escalón único en potencia aparente con una relación de corriente de rotor bloqueado introducida: sin hueco de tensión, sin tiempo de aceleración, sin reactancia transitoria, sin respuesta del regulador ni del AVR. La energía de batería del SAI es indicativa y excluye envejecimiento, temperatura, tensión final de descarga, efecto Peukert y potencia del cargador. La carga de transformadores y generadores no lleva reducción por temperatura, altitud ni sobrecarga. El enlace permanente admite unas 25 a 35 cargas; una lista más larga viaja como JSON de registro, CSV o paquete de proyecto. Ninguna norma se implementa por completo.",
  "pl": "Arytmetyka zapotrzebowania w stanie ustalonym i przy symetrii: bez rozpływu mocy, bez spadku napięcia, bez rozwiązania napięcia szyn; prądy liczone są przy wpisanym napięciu znamionowym. Odbiory jednofazowe dodaje się do sum trójfazowych tak, jakby były rozłożone równo na fazy, więc asymetria i prąd w przewodzie neutralnym nie są liczone. Współczynnik mocy to współczynnik przesunięcia i przy obciążeniu częściowym pozostaje na wartości pełnego obciążenia; harmoniczne przemienników, prostowników UPS i zasilaczy informatycznych nie są modelowane, więc rzeczywisty prąd skuteczny takich odbiorów jest zaniżony. Współczynniki obciążenia wpisuje użytkownik, nie wynikają z reżimu technologicznego. Domyślna jednoczesność rozdzielnicy to wiersze rozdziału z tablicy 101 normy IEC 61439-2:2020, założenie projektowe dla rozdzielnic użyte tu jako współczynnik jednoczesności zapotrzebowania, i mnoży się ono na każdym poziomie rozdzielnic. Kontrola rozruchu to jednostopniowe oszacowanie mocy pozornej z wpisaną krotnością prądu rozruchowego: bez zapadu napięcia, bez czasu rozbiegu, bez reaktancji przejściowej, bez odpowiedzi regulatora i AVR. Energia baterii UPS jest orientacyjna i pomija starzenie, temperaturę, napięcie końcowe rozładowania, efekt Peukerta i moc ładowarki. Obciążenie transformatorów i generatorów nie zawiera poprawek na temperaturę, wysokość ani przeciążenie. Link trwały mieści około 25 do 35 odbiorów; dłuższa lista podróżuje jako JSON zapisu, CSV albo pakiet projektu. Żadna norma nie jest wdrożona w całości."
 },

(function () {

  var PY_SRC = "\"\"\"Model of the electrical load list, reproduced from the page's own code.\n\nThe equations are sections 4.1 to 4.7 of the public specification\n_docs/SPEC-loadlist.md, and the rules are its section 5. The five operating\ncases, the boards, the sources, the UPS units and the loads are the module\nconstants above, exactly as the calculation record holds them.\n\nNot carried into this file: the project package, and with it the five rules\nthat need one (LOA-R-026, 036, 037, 045, 046). Every other rule\n(LOA-R-001 to 025, 030 to 035, 038 to 044, 047) and the verdict are here.\n\"\"\"\n\nimport math\n\nSQ3 = math.sqrt(3.0)\nCASE_IDS = [\"normal\", \"peak\", \"startup\", \"emergency\", \"maintenance\"]\nCATS = [\"normal\", \"essential\", \"emergency\", \"ups\"]\n\nMOTOR_TYPES = (\"motor_dol\", \"motor_vfd\", \"motor_softstart\")\nTYPE_PF = {\"motor_dol\": 0.85, \"motor_softstart\": 0.85, \"motor_vfd\": 0.95, \"heater\": 1.00,\n           \"lighting\": 0.95, \"socket\": 0.90, \"ups_input\": 0.95, \"it\": 0.95, \"other\": 0.90}\n\n# The state of the page at export time is already above, as the module-level\n# constants the runtime wrote from the calculation record. They are reassembled\n# here into the one object every function below reads.\nSTATE = {\"schema\": SCHEMA, \"title\": TITLE, \"frequency_Hz\": FREQUENCY_HZ,\n         \"cases\": CASES, \"boards\": BOARDS, \"sources\": SOURCES, \"ups\": UPS, \"loads\": LOADS}\n\n# One English sentence per rule, the same text the calculation record carries.\nRULE_TEXT_EN = __RULEMSG__\n\n\ndef tanphi(pf):\n    return math.tan(math.acos(pf))\n\n\ndef p_in(load):\n    if load[\"P_basis\"] == \"mechanical\":\n        return load[\"P_rated_W\"] / load[\"eta\"]\n    return load[\"P_rated_W\"]\n\n\ndef k_table(n):\n    \"\"\"Distribution rows of IEC 61439-2:2020 Table 101; n <= 1 -> 1.0 is author method.\"\"\"\n    if n <= 1:\n        return 1.0\n    if n <= 3:\n        return 0.9\n    if n <= 5:\n        return 0.8\n    if n <= 9:\n        return 0.7\n    return 0.6\n\n\ndef compute_all(state):\n    boards = state[\"boards\"]\n    sources = state[\"sources\"]\n    upslist = state[\"ups\"]\n    loads = state[\"loads\"]\n    cases = state[\"cases\"]\n    case_by = dict((c[\"id\"], c) for c in cases)\n    board_by = dict((b[\"id\"], b) for b in boards)\n    ups_by = dict((u[\"id\"], u) for u in upslist)\n\n    children = dict((b[\"id\"], []) for b in boards)\n    for b in boards:\n        if b.get(\"parent_id\") and b[\"parent_id\"] in children:\n            children[b[\"parent_id\"]].append(b)\n    loads_on = dict((b[\"id\"], []) for b in boards)\n    for l in loads:\n        if l[\"board_id\"] in loads_on:\n            loads_on[l[\"board_id\"]].append(l)\n\n    L = {}\n    for l in loads:\n        pin = p_in(l)\n        sr = pin / l[\"pf\"]\n        ir = pin / (SQ3 * l[\"U_V\"] * l[\"pf\"]) if l[\"phases\"] == 3 else pin / (l[\"U_V\"] * l[\"pf\"])\n        maxlf = max(l[\"lf\"][c] for c in CASE_IDS)\n        rec = {\"P_in_W\": pin, \"S_r_VA\": sr, \"I_rated_A\": ir,\n               \"I_design_A\": ir * max(1.0, maxlf), \"n_run\": {}, \"P\": {}, \"Q\": {}}\n        for c in cases:\n            if l[\"category\"] not in c[\"categories\"]:\n                n = 0\n            else:\n                n = l[\"qty_duty\"] + ((l[\"qty_installed\"] - l[\"qty_duty\"]) if c[\"include_standby\"] else 0)\n            rec[\"n_run\"][c[\"id\"]] = n\n            p = n * l[\"lf\"][c[\"id\"]] * pin\n            rec[\"P\"][c[\"id\"]] = p\n            rec[\"Q\"][c[\"id\"]] = p * tanphi(l[\"pf\"])\n        L[l[\"id\"]] = rec\n\n    B = {}\n    for b in boards:\n        n = sum(l[\"qty_installed\"] for l in loads_on[b[\"id\"]]) + len(children[b[\"id\"]])\n        mode = b.get(\"diversity\", {}).get(\"mode\", \"table\")\n        if mode == \"table\":\n            k = k_table(n)\n        elif mode == \"user\":\n            k = b[\"diversity\"][\"value\"]\n        else:\n            k = 1.0\n        B[b[\"id\"]] = {\"n_out\": n, \"k_used\": k, \"demand\": {}, \"I_feeder_A\": 0.0}\n\n    def fed(bid, cid):\n        return [s for s in sources if s[\"board_id\"] == bid and cid in s[\"cases\"]]\n\n    def supplied(bid, cid):\n        b = board_by.get(bid)\n        guard = 0\n        while b is not None and guard <= len(boards) + 1:\n            guard += 1\n            if fed(b[\"id\"], cid):\n                return True\n            b = board_by.get(b[\"parent_id\"]) if b.get(\"parent_id\") else None\n        return False\n\n    memo = {}\n\n    def demand(bid, cid):\n        key = (bid, cid)\n        if key in memo:\n            return memo[key]\n        b = board_by[bid]\n        c = case_by[cid]\n        psum = 0.0\n        qsum = 0.0\n        for l in loads_on[bid]:\n            psum += L[l[\"id\"]][\"P\"][cid]\n            qsum += L[l[\"id\"]][\"Q\"][cid]\n        for ch in children[bid]:\n            if fed(ch[\"id\"], cid):\n                continue\n            d = demand(ch[\"id\"], cid)\n            u = ups_by.get(ch[\"ups_id\"]) if ch.get(\"ups_id\") else None\n            if u is not None:\n                pu = d[\"P_W\"] / u[\"eta_inverter\"]\n                psum += pu\n                qsum += pu * tanphi(u[\"pf_input\"])\n            else:\n                psum += d[\"P_W\"]\n                qsum += d[\"Q_var\"]\n        k = B[bid][\"k_used\"] if c[\"apply_diversity\"] else 1.0\n        p = k * psum\n        q = k * qsum\n        s = math.sqrt(p * p + q * q)\n        i = s / (SQ3 * b[\"U_V\"]) if b[\"phases\"] == 3 else s / b[\"U_V\"]\n        out = {\"P_W\": p, \"Q_var\": q, \"S_VA\": s, \"I_A\": i, \"k\": k,\n               \"pf\": None if s == 0 else p / s}\n        memo[key] = out\n        return out\n\n    for b in boards:\n        mi = 0.0\n        for c in cases:\n            d = demand(b[\"id\"], c[\"id\"])\n            B[b[\"id\"]][\"demand\"][c[\"id\"]] = d\n            mi = max(mi, d[\"I_A\"])\n        B[b[\"id\"]][\"I_feeder_A\"] = mi\n\n    def region(bid, cid):\n        out = [bid]\n\n        def walk(i):\n            for ch in children[i]:\n                if fed(ch[\"id\"], cid) or ch.get(\"ups_id\"):\n                    continue\n                out.append(ch[\"id\"])\n                walk(ch[\"id\"])\n        walk(bid)\n        return out\n\n    SRC = {}\n    for s in sources:\n        rec = {\"S_rated_tot\": {}, \"loading\": {}, \"motor\": {}, \"S_st_VA\": {},\n               \"step\": {}, \"S_ts_VA\": {}, \"loading_start\": {}}\n        for cid in s[\"cases\"]:\n            if cid not in case_by:\n                continue\n            tot = sum(o[\"S_rated_VA\"] for o in fed(s[\"board_id\"], cid))\n            d = B[s[\"board_id\"]][\"demand\"][cid]\n            rec[\"S_rated_tot\"][cid] = tot\n            rec[\"loading\"][cid] = d[\"S_VA\"] / tot\n            best = None\n            best_s = -1.0\n            for bid in region(s[\"board_id\"], cid):\n                for l in loads_on[bid]:\n                    if l[\"type\"] not in MOTOR_TYPES:\n                        continue\n                    if L[l[\"id\"]][\"n_run\"][cid] < 1 or l[\"lf\"][cid] <= 0:\n                        continue\n                    sst = l[\"k_LR\"] * L[l[\"id\"]][\"S_r_VA\"]\n                    if sst > best_s:\n                        best_s = sst\n                        best = l\n            if best is None:\n                for key in (\"motor\", \"S_st_VA\", \"step\", \"S_ts_VA\", \"loading_start\"):\n                    rec[key][cid] = None\n                continue\n            sst = best[\"k_LR\"] * L[best[\"id\"]][\"S_r_VA\"]\n            prun = best[\"lf\"][cid] * L[best[\"id\"]][\"P_in_W\"]\n            qrun = prun * tanphi(best[\"pf\"])\n            pts = d[\"P_W\"] - prun + sst * best[\"pf_start\"]\n            qts = d[\"Q_var\"] - qrun + sst * math.sqrt(1.0 - best[\"pf_start\"] ** 2)\n            sts = math.sqrt(pts * pts + qts * qts)\n            rec[\"motor\"][cid] = best[\"id\"]\n            rec[\"S_st_VA\"][cid] = sst\n            rec[\"step\"][cid] = sst / tot\n            rec[\"S_ts_VA\"][cid] = sts\n            rec[\"loading_start\"][cid] = sts / tot\n        SRC[s[\"id\"]] = rec\n\n    UPS = {}\n    for u in upslist:\n        host = None\n        for b in boards:\n            if b.get(\"ups_id\") == u[\"id\"]:\n                host = b\n        rec = {\"board_id\": host[\"id\"] if host else None, \"P_max_W\": 0.0, \"S_max_VA\": 0.0,\n               \"loading\": None, \"E_batt_J\": None}\n        if host is not None:\n            for c in cases:\n                d = B[host[\"id\"]][\"demand\"][c[\"id\"]]\n                rec[\"P_max_W\"] = max(rec[\"P_max_W\"], d[\"P_W\"])\n                rec[\"S_max_VA\"] = max(rec[\"S_max_VA\"], d[\"S_VA\"])\n            if u.get(\"S_rated_VA\") is not None:\n                rec[\"loading\"] = rec[\"S_max_VA\"] / u[\"S_rated_VA\"]\n            if u[\"autonomy_s\"] > 0:\n                rec[\"E_batt_J\"] = rec[\"P_max_W\"] * u[\"autonomy_s\"] / (u[\"eta_inverter\"] * u[\"dod\"])\n        UPS[u[\"id\"]] = rec\n\n    return {\"loads\": L, \"boards\": B, \"sources\": SRC, \"ups\": UPS,\n            \"fed\": fed, \"supplied\": supplied, \"board_by\": board_by,\n            \"loads_on\": loads_on, \"children\": children}\n\n\nSEVERITY = {}\nfor _r in range(1, 20):\n    SEVERITY[\"LOA-R-%03d\" % _r] = \"blocker\"\nfor _r in range(20, 27):\n    SEVERITY[\"LOA-R-%03d\" % _r] = \"major\"\nfor _r in list(range(30, 40)) + [46]:\n    SEVERITY[\"LOA-R-%03d\" % _r] = \"minor\"\nfor _r in [40, 41, 42, 43, 44, 45, 47]:\n    SEVERITY[\"LOA-R-%03d\" % _r] = \"info\"\n\n\ndef slug(s):\n    out = []\n    prev_dash = False\n    for ch in str(s).upper():\n        if (\"A\" <= ch <= \"Z\") or (\"0\" <= ch <= \"9\"):\n            out.append(ch)\n            prev_dash = False\n        elif not prev_dash:\n            out.append(\"-\")\n            prev_dash = True\n    return \"\".join(out).strip(\"-\")\n\n\ndef blockers(state):\n    \"\"\"LOA-R-001 to 019. Nothing is computed while one of these fires.\"\"\"\n    out = []\n\n    def add(rule, target):\n        out.append((rule, str(target), []))\n\n    boards = state[\"boards\"]\n    sources = state[\"sources\"]\n    upslist = state[\"ups\"]\n    loads = state[\"loads\"]\n    if not boards or not loads:\n        add(\"LOA-R-001\", \"state\")\n    import re\n    pat = re.compile(r\"^LD-[A-Z0-9]+(-[A-Z0-9]+)*$\")\n    seen = set()\n    dup = set()\n    for x in boards + sources + upslist + loads:\n        i = str(x.get(\"id\", \"\"))\n        if not pat.match(i):\n            add(\"LOA-R-002\", i)\n            continue\n        if i in seen:\n            dup.add(i)\n        seen.add(i)\n    for i in sorted(dup):\n        add(\"LOA-R-002\", i)\n    board_by = dict((b[\"id\"], b) for b in boards)\n    ups_ids = set(u[\"id\"] for u in upslist)\n    for l in loads:\n        if l[\"board_id\"] not in board_by:\n            add(\"LOA-R-003\", l[\"id\"])\n        p = l.get(\"P_rated_W\")\n        if not isinstance(p, (int, float)) or p != p or p <= 0 or p > 1e8:\n            add(\"LOA-R-006\", l[\"id\"])\n        if l[\"P_basis\"] == \"mechanical\" and not (isinstance(l.get(\"eta\"), (int, float)) and 0 < l[\"eta\"] <= 1):\n            add(\"LOA-R-007\", l[\"id\"])\n        if not (isinstance(l.get(\"pf\"), (int, float)) and 0 < l[\"pf\"] <= 1):\n            add(\"LOA-R-008\", l[\"id\"])\n        qi, qd = l.get(\"qty_installed\"), l.get(\"qty_duty\")\n        if not (isinstance(qi, int) and qi >= 1 and isinstance(qd, int) and 0 <= qd <= qi):\n            add(\"LOA-R-009\", l[\"id\"])\n        if not (isinstance(l.get(\"U_V\"), (int, float)) and 1 <= l[\"U_V\"] <= 36000):\n            add(\"LOA-R-010\", l[\"id\"])\n        b = board_by.get(l[\"board_id\"])\n        if b is not None and l[\"phases\"] == 3 and b[\"phases\"] == 1:\n            add(\"LOA-R-011\", l[\"id\"])\n        if any(not isinstance(l[\"lf\"].get(c), (int, float)) or not (0 <= l[\"lf\"][c] <= 1.5) for c in CASE_IDS):\n            add(\"LOA-R-012\", l[\"id\"])\n        if l[\"type\"] in MOTOR_TYPES:\n            k = l.get(\"k_LR\")\n            pfs = l.get(\"pf_start\")\n            if not (isinstance(k, (int, float)) and 1 <= k <= 12) or not (isinstance(pfs, (int, float)) and 0 < pfs <= 1):\n                add(\"LOA-R-017\", l[\"id\"])\n        if str(l.get(\"tag\", \"\")).strip() == \"\":\n            add(\"LOA-R-018\", l[\"id\"])\n    for b in boards:\n        if b.get(\"parent_id\") and b[\"parent_id\"] not in board_by:\n            add(\"LOA-R-004\", b[\"id\"])\n        if not (isinstance(b.get(\"U_V\"), (int, float)) and 1 <= b[\"U_V\"] <= 36000):\n            add(\"LOA-R-010\", b[\"id\"])\n        d = b.get(\"diversity\") or {}\n        if d.get(\"mode\") == \"user\" and not (isinstance(d.get(\"value\"), (int, float)) and 0 < d[\"value\"] <= 1):\n            add(\"LOA-R-013\", b[\"id\"])\n        if b.get(\"ups_id\") and b[\"ups_id\"] not in ups_ids:\n            add(\"LOA-R-015\", b[\"id\"])\n    use = {}\n    for b in boards:\n        if b.get(\"ups_id\"):\n            use.setdefault(b[\"ups_id\"], []).append(b[\"id\"])\n    for u, lst in use.items():\n        if len(lst) > 1:\n            for bid in lst:\n                add(\"LOA-R-015\", bid)\n    for b in boards:\n        cur = b\n        guard = 0\n        seen_b = set()\n        while cur is not None and cur.get(\"parent_id\") and cur[\"parent_id\"] in board_by and guard <= len(boards) + 1:\n            guard += 1\n            if cur[\"id\"] in seen_b:\n                break\n            seen_b.add(cur[\"id\"])\n            cur = board_by[cur[\"parent_id\"]]\n            if cur is b:\n                add(\"LOA-R-005\", b[\"id\"])\n                break\n    for s in sources:\n        if (s[\"board_id\"] not in board_by or not isinstance(s.get(\"S_rated_VA\"), (int, float))\n                or s[\"S_rated_VA\"] <= 0 or not s.get(\"cases\")):\n            add(\"LOA-R-014\", s[\"id\"])\n        ss = s.get(\"start_step_max_frac\")\n        if ss is not None and not (isinstance(ss, (int, float)) and ss > 0):\n            add(\"LOA-R-019\", s[\"id\"])\n    for u in upslist:\n        ok = (isinstance(u.get(\"eta_inverter\"), (int, float)) and 0 < u[\"eta_inverter\"] <= 1\n              and isinstance(u.get(\"pf_input\"), (int, float)) and 0 < u[\"pf_input\"] <= 1\n              and isinstance(u.get(\"dod\"), (int, float)) and 0 < u[\"dod\"] <= 1\n              and isinstance(u.get(\"autonomy_s\"), (int, float)) and u[\"autonomy_s\"] >= 0\n              and (u.get(\"S_rated_VA\") is None or (isinstance(u[\"S_rated_VA\"], (int, float)) and u[\"S_rated_VA\"] > 0)))\n        if not ok:\n            add(\"LOA-R-016\", u[\"id\"])\n    uniq = []\n    seen_f = set()\n    for f in out:\n        key = (f[0], f[1])\n        if key in seen_f:\n            continue\n        seen_f.add(key)\n        uniq.append(f)\n    return uniq\n\n\ndef rules(state, r):\n    \"\"\"The non-package rules: 020 to 025, 030 to 035, 038 to 044, 047.\"\"\"\n    out = []\n\n    def add(rule, target, cs=None):\n        out.append((rule, str(target), list(cs or [])))\n\n    def order(cs):\n        return [c for c in CASE_IDS if c in cs]\n\n    boards = state[\"boards\"]\n    sources = state[\"sources\"]\n    upslist = state[\"ups\"]\n    loads = state[\"loads\"]\n    board_by = r[\"board_by\"]\n\n    for s in sources:\n        R = r[\"sources\"][s[\"id\"]]\n        over, step, start_over, margin = [], [], [], []\n        for cid in s[\"cases\"]:\n            if cid not in R[\"loading\"]:\n                continue\n            if R[\"loading\"][cid] > 1.0:\n                over.append(cid)\n            elif R[\"loading\"][cid] > 0.8:\n                margin.append(cid)\n            lim = s.get(\"start_step_max_frac\")\n            if lim is not None and R[\"step\"][cid] is not None and R[\"step\"][cid] > lim:\n                step.append(cid)\n            if R[\"loading_start\"][cid] is not None and R[\"loading_start\"][cid] > 1.0:\n                start_over.append(cid)\n        if over:\n            add(\"LOA-R-020\", s[\"id\"], order(over))\n        if step:\n            add(\"LOA-R-021\", s[\"id\"], order(step))\n        if start_over:\n            add(\"LOA-R-031\", s[\"id\"], order(start_over))\n        if margin:\n            add(\"LOA-R-032\", s[\"id\"], order(margin))\n        if s.get(\"start_step_max_frac\") is None:\n            add(\"LOA-R-042\", s[\"id\"])\n\n    for u in upslist:\n        R = r[\"ups\"][u[\"id\"]]\n        if u.get(\"S_rated_VA\") is not None and R[\"loading\"] is not None and R[\"loading\"] > 1.0:\n            add(\"LOA-R-022\", u[\"id\"])\n        if u[\"autonomy_s\"] == 0:\n            add(\"LOA-R-047\", u[\"id\"])\n\n    slugs = {}\n    for l in loads:\n        slugs.setdefault(slug(l[\"tag\"]), []).append(l[\"id\"])\n\n    for l in loads:\n        b = board_by[l[\"board_id\"]]\n        u_exp = b[\"U_V\"] if l[\"phases\"] == b[\"phases\"] else b[\"U_V\"] / SQ3\n        if abs(l[\"U_V\"] - u_exp) > 0.02 * u_exp:\n            add(\"LOA-R-023\", l[\"id\"])\n        if l[\"category\"] in (\"essential\", \"emergency\") and not r[\"supplied\"](l[\"board_id\"], \"emergency\"):\n            add(\"LOA-R-024\", l[\"id\"])\n        chain_ups = False\n        cur = b\n        guard = 0\n        while cur is not None and guard <= len(boards) + 1:\n            guard += 1\n            if cur.get(\"ups_id\"):\n                chain_ups = True\n                break\n            cur = board_by.get(cur[\"parent_id\"]) if cur.get(\"parent_id\") else None\n        if l[\"category\"] == \"ups\" and not chain_ups:\n            add(\"LOA-R-025\", l[\"id\"])\n        if l[\"category\"] != \"ups\" and chain_ups:\n            add(\"LOA-R-035\", l[\"id\"])\n        hi = [c for c in CASE_IDS if l[\"lf\"][c] > 1.0]\n        if hi:\n            add(\"LOA-R-030\", l[\"id\"], hi)\n        if all(r[\"loads\"][l[\"id\"]][\"P\"][c] == 0 for c in CASE_IDS):\n            add(\"LOA-R-033\", l[\"id\"])\n        if l[\"phases\"] == 1 and b[\"phases\"] == 3:\n            add(\"LOA-R-040\", l[\"id\"])\n        if l.get(\"pf_user\") is False:\n            add(\"LOA-R-041\", l[\"id\"])\n        if l[\"type\"] == \"motor_vfd\":\n            add(\"LOA-R-044\", l[\"id\"])\n        if len(slugs[slug(l[\"tag\"])]) > 1:\n            add(\"LOA-R-038\", l[\"id\"])\n\n    for b in boards:\n        parent = board_by.get(b[\"parent_id\"]) if b.get(\"parent_id\") else None\n        if b.get(\"ups_id\") and parent is not None and any(x[\"type\"] == \"ups_input\" for x in r[\"loads_on\"][parent[\"id\"]]):\n            add(\"LOA-R-034\", b[\"id\"])\n        if parent is not None and b[\"phases\"] == 1 and parent[\"phases\"] == 3:\n            add(\"LOA-R-040\", b[\"id\"])\n        if (b.get(\"diversity\") or {}).get(\"mode\") != \"table\":\n            add(\"LOA-R-043\", b[\"id\"])\n        if not b.get(\"parent_id\"):\n            cs = [c[\"id\"] for c in state[\"cases\"]\n                  if r[\"boards\"][b[\"id\"]][\"demand\"][c[\"id\"]][\"S_VA\"] > 0 and not r[\"fed\"](b[\"id\"], c[\"id\"])]\n            if cs:\n                add(\"LOA-R-039\", b[\"id\"], order(cs))\n\n    uniq = []\n    seen = set()\n    for f in out:\n        key = (f[0], f[1])\n        if key in seen:\n            continue\n        seen.add(key)\n        uniq.append(f)\n    uniq.sort(key=lambda f: (f[0], f[1]))\n    return uniq\n\n\ndef solve(state):\n    bl = blockers(state)\n    if any(f[0] == \"LOA-R-001\" for f in bl):\n        return {\"verdict\": \"empty\", \"findings\": bl, \"results\": None}\n    if bl:\n        return {\"verdict\": \"blocked\", \"findings\": bl, \"results\": None}\n    r = compute_all(state)\n    f = rules(state, r)\n    counts = {\"blocker\": 0, \"major\": 0, \"minor\": 0, \"info\": 0}\n    for x in f:\n        counts[SEVERITY[x[0]]] += 1\n    if counts[\"major\"]:\n        v = \"review_required\"\n    elif counts[\"minor\"]:\n        v [\"ups\"] = []\n    for u in state[\"ups\"]:\n        R = r[\"ups\"][u[\"id\"]]\n        out[\"ups\"].append({\"id\": u[\"id\"], \"name\": u[\"name\"], \"board_id\": R[\"board_id\"],\n                           \"P_max_W\": R[\"P_max_W\"], \"S_max_VA\": R[\"S_max_VA\"],\n                           \"loading\": R[\"loading\"], \"E_batt_J\": R[\"E_batt_J\"]})\n    out[\"loads\"] = []\n    for l in state[\"loads\"]:\n        R = r[\"loads\"][l[\"id\"]]\n        out[\"loads\"].append({\"id\": l[\"id\"], \"tag\": l[\"tag\"], \"bus\": l[\"board_id\"],\n                             \"P_in_W\": R[\"P_in_W\"], \"S_rated_VA\": R[\"S_r_VA\"],\n                             \"I_rated_A\": R[\"I_rated_A\"], \"I_design_A\": R[\"I_design_A\"],\n                             \"source\": l.get(\"source\", {\"kind\": \"manual\"})})\n    gov = {\"loading\": None, \"loadSrc\": None, \"loadCase\": None,\n           \"step\": None, \"stepSrc\": None, \"stepCase\": None}\n    for x in state[\"sources\"]:\n        R = r[\"sources\"][x[\"id\"]]\n        for c in x[\"cases\"]:\n            if c not in R[\"loading\"]:\n                continue\n            if gov[\"loading\"] is None or R[\"loading\"][c] > gov[\"loading\"]:\n                gov[\"loading\"] = R[\"loading\"][c]\n                gov[\"loadSrc\"] = x[\"id\"]\n                gov[\"loadCase\"] = c\n            if R[\"step\"][c] is not None and (gov[\"step\"] is None or R[\"step\"][c] > gov[\"step\"]):\n                gov[\"step\"] = R[\"step\"][c]\n                gov[\"stepSrc\"] = x[\"id\"]\n                gov[\"stepCase\"] = c\n    out[\"governing_loading\"] = gov[\"loading\"]\n    out[\"governing_loading_source\"] = gov[\"loadSrc\"]\n    out[\"governing_loading_case\"] = gov[\"loadCase\"]\n    out[\"governing_step\"] = gov[\"step\"]\n    out[\"governing_step_source\"] = gov[\"stepSrc\"]\n    out[\"governing_step_case\"] = gov[\"stepCase\"]\n    return out\n\n\ndef compute():\n    \"\"\"Recompute what the tool displayed, from the constants above.\"\"\"\n    return outputs(solve(STATE), STATE)\n";

/* ============================================================ 1. the model
   SI throughout: W, var, VA, V, A, s, J. Display units belong to the
   interface and the report, never to the state or the record. */

var SQ3 = Math.sqrt(3);
var CASE_IDS = ['normal', 'peak', 'startup', 'emergency', 'maintenance'];
var CATS = ['normal', 'essential', 'emergency', 'ups'];
var TYPES = ['motor_dol', 'motor_vfd', 'motor_softstart', 'heater', 'lighting',
             'socket', 'ups_input', 'it', 'other'];

/* Type defaults, SPEC §3.8. Author method: k_LR 7.0 is a typical catalogue value
   for IEC cage motors, 3.5 a soft-start current limit, 1.0 a drive holding the
   starting current at rated. IEC 60034-12 limits were not verified and no rule
   uses them. */
var TYPE_DEF = {
  motor_dol:       { basis: 'mechanical', eta: 0.93, pf: 0.85, kLR: 7.0, pfs: 0.30, motor: true },
  motor_softstart: { basis: 'mechanical', eta: 0.93, pf: 0.85, kLR: 3.5, pfs: 0.30, motor: true },
  motor_vfd:       { basis: 'mechanical', eta: 0.90, pf: 0.95, kLR: 1.0, pfs: 0.95, motor: true },

  lighting:        { basis: 'electrical', eta: 1.00, pf: 0.95, kLR: null, pfs: null, motor: false },
  socket:          { basis: 'electrical', eta: 1.00, pf: 0.90, kLR: null, pfs: null, motor: false },
  ups_input:       { basis: 'electrical', eta: 1.00, pf: 0.95, kLR: null, pfs: null, motor: false },
  it:              { basis: 'electrical', eta: 1.00, pf: 0.95, kLR: null, pfs: null, motor: false },
  other:           { basis: 'electrical', eta: 1.00, pf: 0.90, kLR: null, pfs: null, motor: false }
};

var ID_RE = /^LD-[A-Z0-9]+(-[A-Z0-9]+)*$/;

function slug(s) {
  return String(s == null ? '' : s).toUpperCase().replace(/[^A-Z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
function num(x) { return typeof x === 'number' && isFinite(x); }
function isInt(x) { return num(x) && Math.floor(x) === x; }
function tanphi(pf) { return Math.tan(Math.acos(pf)); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }

function defaultCases() {
  return [
    { id: 'normal',      categories: CATS.slice(), include_standby: false, apply_diversity: true },
    { id: 'peak',        categories: CATS.slice(), include_standby: false, apply_diversity: false },
    { id: 'startup',     categories: CATS.slice(), include_standby: false, apply_diversity: false },
    { id: 'emergency',   categories: ['essential', 'emergency', 'ups'], include_standby: false, apply_diversity: true },
    { id: 'maintenance', categories: CATS.slice(), include_standby: false, apply_diversity: true }
  ];
}

/* SPEC 3.1 fixes the state at exactly the five cases of 3.2, in that order. A
   hand-edited permalink can carry fewer, or none; the list is repaired here so
   every reader of the state -- the interface, the record, the Python export --
   sees the five keys the model indexes by. Fields the caller did supply for a
   case are kept. */
function normaliseCases(a) {
  var given = {};
  if (Array.isArray(a)) a.forEach(function (c) { if (c && typeof c === 'object' && c.id) given[c.id] = c; });

    var g = given[d.id];
    if (!g) return d;
    if (Array.isArray(g.categories) && g.categories.length) d.categories = g.categories.slice();
    if (typeof g.include_standby === 'boolean') d.include_standby = g.include_standby;
    if (typeof g.apply_diversity === 'boolean') d.apply_diversity = g.apply_diversity;
    return d;
  });
}

/* The rated diversity step set: the "Distribution" rows of IEC 61439-2:2020
   Table 101. n <= 1 -> 1.0 is author method; the motor rows of that table are
   deliberately not applied, because the per-load load factors already carry
   motor loading and applying both would count it twice. */
function kTable(n) {
  if (n <= 1) return 1.0;
  if (n <= 3) return 0.9;
  if (n <= 5) return 0.8;
  if (n <= 9) return 0.7;
  return 0.6;
}

function P_in(l) {
  return l.P_basis === 'mechanical' ? l.P_rated_W / l.eta : l.P_rated_W;
}

/* ---------------------------------------------------------------- blockers */
/* No computation runs while any of LOA-R-001..019 fires (SPEC §4, §6). */
function blockers(s) {
  var out = [], i, j;
  var boards = s.boards || [], sources = s.sources || [], ups = s.ups || [], loads = s.loads || [];
  function add(rule, target) { out.push({ rule: rule, target: String(target), cases: [] }); }

  if (boards.length === 0 || loads.length === 0) add('LOA-R-001', 'state');

  /* 002 — id pattern and uniqueness across all four arrays together */
  var seen = {}, dup = {};
  var all = boards.concat(sources, ups, loads);
  for (i = 0; i < all.length; i++) {
    var id = String(all[i].id == null ? '' : all[i].id);
    if (!ID_RE.test(id)) { add('LOA-R-002', id); continue; }
    if (seen[id]) dup[id] = 1; else seen[id] = 1;
  }
  Object.keys(dup).forEach(function (k) { add('LOA-R-002', k); });

  var boardById = {};
  boards.forEach(function (b) { boardById[b.id] = b; });
  var upsById = {};
  ups.forEach(function (u) { upsById[u.id] = u; });

  loads.forEach(function (l) {
    if (!boardById[l.board_id]) add('LOA-R-003', l.id);
    if (!num(l.P_rated_W) || l.P_rated_W <= 0 || l.P_rated_W > 1e8) add('LOA-R-006', l.id);
    if (l.P_basis === 'mechanical' && (!num(l.eta) || l.eta <= 0 || l.eta > 1)) add('LOA-R-007', l.id);
    if (!num(l.pf) || l.pf <= 0 || l.pf > 1) add('LOA-R-008', l.id);
    if (!isInt(l.qty_installed) || l.qty_installed < 1 || !isInt(l.qty_duty) ||
        l.qty_duty < 0 || l.qty_duty > l.qty_installed) add('LOA-R-009', l.id);
    if (!num(l.U_V) || l.U_V < 1 || l.U_V > 36000) add('LOA-R-010', l.id);
    var b = boardById[l.board_id];
    if (b && l.phases === 3 && b.phases === 1) add('LOA-R-011', l.id);
    var bad = false;
    CASE_IDS.forEach(function (c) {
      var v = l.lf ? l.lf[c] : undefined;
      if (!num(v) || v < 0 || v > 1.5) bad = true;
    });
    if (bad) add('LOA-R-012', l.id);
    if (TYPE_DEF[l.type] && TYPE_DEF[l.type].motor) {
      if (!num(l.k_LR) || l.k_LR < 1 || l.k_LR > 12 ||
          !num(l.pf_start) || l.pf_start <= 0 || l.pf_start > 1) add('LOA-R-017', l.id);
    }
    if (String(l.tag == null ? '' : l.tag).trim() === '') add('LOA-R-018', l.id);
  });

  boards.forEach(function (b) {
    if (b.parent_id !== null && b.parent_id !== undefined && b.parent_id !== '' && !boardById[b.parent_id]) add('LOA-R-004', b.id);
    if (!num(b.U_V) || b.U_V < 1 || b.U_V > 36000) add('LOA-R-010', b.id);
    if (b.diversity && b.diversity.mode === 'user' &&
        (!num(b.diversity.value) || b.diversity.value <= 0 || b.diversity.value > 1)) add('LOA-R-013', b.id);
    if (b.ups_id !== null && b.ups_id !== undefined && b.ups_id !== '' && !upsById[b.ups_id]) add('LOA-R-015', b.id);
  });

  /* one UPS output may sit on one board only */
  var upsUse = {};
  boards.forEach(function (b) {
    if (b.ups_id) (upsUse[b.ups_id] || (upsUse[b.ups_id] = [])).push(b.id);
  });
  Object.keys(upsUse).forEach(function (u) {
    if (upsUse[u].length > 1) upsUse[u].forEach(function (bid) { add('LOA-R-015', bid); });
  });

  /* 005 — a parent chain that returns to its own board */
  boards.forEach(function (b) {
    var seenB = {}, cur = b, guard = 0;
    while (cur && cur.parent_id && boardById[cur.parent_id] && guard++ <= boards.length + 1) {
      if (seenB[cur.id]) break;
      seenB[cur.id] = 1;
      cur = boardById[cur.parent_id];
      if (cur === b) { add('LOA-R-005', b.id); break; }
    }
  });

  sources.forEach(function (sc) {
    if (!boardById[sc.board_id] || !num(sc.S_rated_VA) || sc.S_rated_VA <= 0 ||
        !Array.isArray(sc.cases) || sc.cases.length === 0) add('LOA-R-014', sc.id);
    if (sc.start_step_max_frac !== null && sc.start_step_max_frac !== undefined &&
        (!num(sc.start_step_max_frac) || sc.start_step_max_frac <= 0)) add('LOA-R-019', sc.id);
  });

  ups.forEach(function (u) {
    var ok = num(u.eta_inverter) && u.eta_inverter > 0 && u.eta_inverter <= 1 &&
             num(u.pf_input) && u.pf_input > 0 && u.pf_input <= 1 &&
             num(u.dod) && u.dod > 0 && u.dod <= 1 &&
             num(u.autonomy_s) && u.autonomy_s >= 0 &&
             (u.S_rated_VA === null || u.S_rated_VA === undefined || (num(u.S_rated_VA) && u.S_rated_VA > 0));
    if (!ok) add('LOA-R-016', u.id);
  });

  /* one finding per rule per target */
  var uniq = {}, res = [];
  out.forEach(function (f) {
    var k = f.rule + '|' + f.target;
    if (uniq[k]) return;
    uniq[k] = 1;
    res.push(f);
  });
  return res;
}

/* -------------------------------------------------------------- the figures */
function compute(s) {
  var boards = s.boards, sources = s.sources, ups = s.ups, loads = s.loads;
  var cases = s.cases;
  var caseById = {};
  cases.forEach(function (c) { caseById[c.id] = c; });
  var boardById = {}, upsById = {};
  boards.forEach(function (b) { boardById[b.id] = b; });
  ups.forEach(function (u) { upsById[u.id] = u; });

  var children = {};
  boards.forEach(function (b) { children[b.id] = []; });
  boards.forEach(function (b) {
    if (b.parent_id && children[b.parent_id]) children[b.parent_id].push(b);
  });
  var loadsOn = {};
  boards.forEach(function (b) { loadsOn[b.id] = []; });
  loads.forEach(function (l) { if (loadsOn[l.board_id]) loadsOn[l.board_id].push(l); });

  /* per load */
  var L = {};
  loads.forEach(function (l) {
    var pin = P_in(l);
    var sr = pin / l.pf;
    var ir = l.phases === 3 ? pin / (SQ3 * l.U_V * l.pf) : pin / (l.U_V * l.pf);
    var maxLf = 0;
    CASE_IDS.forEach(function (c) { if (l.lf[c] > maxLf) maxLf = l.lf[c]; });
    var rec = { id: l.id, P_in_W: pin, S_r_VA: sr, I_rated_A: ir,
                I_design_A: ir * Math.max(1, maxLf), n_run: {}, P: {}, Q: {} };
    cases.forEach(function (c) {
      var n = c.categories.indexOf(l.category) < 0 ? 0
            : l.qty_duty + (c.include_standby ? (l.qty_installed - l.qty_duty) : 0);
      rec.n_run[c.id] = n;
      var P = n * l.lf[c.id] * pin;
      rec.P[c.id] = P;
      rec.Q[c.id] = P * tanphi(l.pf);
    });
    L[l.id] = rec;
  });

  /* n_out and k per board */
  var B = {};
  boards.forEach(function (b) {
    var n = 0;
    loadsOn[b.id].forEach(function (l) { n += l.qty_installed; });
    n += children[b.id].length;
    var mode = (b.diversity && b.diversity.mode) || 'table';
    var k = mode === 'table' ? kTable(n) : (mode === 'user' ? b.diversity.value : 1.0);
    B[b.id] = { id: b.id, n_out: n, k_used: k, demand: {}, I_feeder_A: 0 };
  });

  /* which sources feed a board in a case, and whether a board is supplied at all */
  function fed(bid, c) {
    return sources.filter(function (sc) { return sc.board_id === bid && sc.cases.indexOf(c) >= 0; });
  }
  var fedCache = {};
  function fedOf(bid, c) {
    var k = bid + '|' + c;
    if (!fedCache[k]) fedCache[k] = fed(bid, c);
    return fedCache[k];
  }
  function supplied(bid, c) {
    var b = boardById[bid], guard = 0;
    while (b && guard++ <= boards.length + 1) {
      if (fedOf(b.id, c).length) return true;
      b = b.parent_id ? boardById[b.parent_id] : null;
    }
    return false;
  }

  /* post-order board demand; a child fed by its own source in this case is a
     supply boundary and propagates nothing to its parent */
  var demandMemo = {};
  function demand(bid, cid) {
    var key = bid + '|' + cid;
    if (demandMemo[key]) return demandMemo[key];
    var b = boardById[bid], c = caseById[cid];
    var Psum = 0, Qsum = 0;
    loadsOn[bid].forEach(function (l) { Psum += L[l.id].P[cid]; Qsum += L[l.id].Q[cid]; });
    children[bid].forEach(function (ch) {
      if (fedOf(ch.id, cid).length) return;
      var d = demand(ch.id, cid);
      var u = ch.ups_id ? upsById[ch.ups_id] : null;
      if (u) {
        var Pu = d.P_W / u.eta_inverter;
        Psum += Pu;
        Qsum += Pu * tanphi(u.pf_input);
      } else {
        Psum += d.P_W;
        Qsum += d.Q_var;
      }
    });
    var k = c.apply_diversity ? B[bid].k_used : 1.0;
    var P = k * Psum, Q = k * Qsum;
    var S = Math.sqrt(P * P + Q * Q);
    var I = b.phases === 3 ? S / (SQ3 * b.U_V) : S / b.U_V;
    var out = { P_W: P, Q_var: Q, S_VA: S, I_A: I, k: k, pf: S === 0 ? null : P / S };
    demandMemo[key] = out;
    return out;
  }
  boards.forEach(function (b) {
    var maxI = 0;
    cases.forEach(function (c) {
      var d = demand(b.id, c.id);
      B[b.id].demand[c.id] = d;
      if (d.I_A > maxI) maxI = d.I_A;
    });
    B[b.id].I_feeder_A = maxI;
  });

  /* the boards a source carries in a case: itself plus every descendant reached
     without entering a board that has its own source in that case or sits
     behind a UPS */
  function region(bid, cid) {
    var out = [bid];
    (function walk(id) {
      children[id].forEach(function (ch) {
        if (fedOf(ch.id, cid).length || ch.ups_id) return;
        out.push(ch.id);
        walk(ch.id);
      });
    })(bid);
    return out;
  }

  var SRC = {};
  sources.forEach(function (sc) {
    var rec = { id: sc.id, S_rated_tot: {}, loading: {}, motor: {}, S_st_VA: {},
                step: {}, S_ts_VA: {}, loading_start: {} };
    sc.cases.forEach(function (cid) {
      if (!caseById[cid]) return;
      var tot = 0;
      fedOf(sc.board_id, cid).forEach(function (o) { tot += o.S_rated_VA; });
      var d = B[sc.board_id].demand[cid];
      rec.S_rated_tot[cid] = tot;
      rec.loading[cid] = d.S_VA / tot;
      var reg = region(sc.board_id, cid), best = null, bestS = -1;
      reg.forEach(function (bid) {
        loadsOn[bid].forEach(function (l) {
          if (!TYPE_DEF[l.type] || !TYPE_DEF[l.type].motor) return;
          if (L[l.id].n_run[cid] < 1 || l.lf[cid] <= 0) return;
          var Sst = l.k_LR * L[l.id].S_r_VA;
          if (Sst > bestS) { bestS = Sst; best = l; }
        });
      });
      if (!best) {
        rec.motor[cid] = null; rec.S_st_VA[cid] = null; rec.step[cid] = null;
        rec.S_ts_VA[cid] = null; rec.loading_start[cid] = null;
        return;
      }
      var Sst = best.k_LR * L[best.id].S_r_VA;
      var Prun = best.lf[cid] * L[best.id].P_in_W;
      var Qrun = Prun * tanphi(best.pf);
      var Pts = d.P_W - Prun + Sst * best.pf_start;
      var Qts = d.Q_var - Qrun + Sst * Math.sqrt(1 - best.pf_start * best.pf_start);
      var Sts = Math.sqrt(Pts * Pts + Qts * Qts);
      rec.motor[cid] = best.id;
      rec.S_st_VA[cid] = Sst;
      rec.step[cid] = Sst / tot;
      rec.S_ts_VA[cid] = Sts;
      rec.loading_start[cid] = Sts / tot;
    });
    SRC[sc.id] = rec;
  });

  var UPS = {};
  ups.forEach(function (u) {
    var host = null;
    boards.forEach(function (b) { if (b.ups_id === u.id) host = b; });
    var rec = { id: u.id, board_id: host ? host.id : null, P_max_W: 0, S_max_VA: 0,
                loading: null, E_batt_J: null };
    if (host) {
      cases.forEach(function (c) {
        var d = B[host.id].demand[c.id];
        if (d.P_W > rec.P_max_W) rec.P_max_W = d.P_W;
        if (d.S_VA > rec.S_max_VA) rec.S_max_VA = d.S_VA;
      });
      if (u.S_rated_VA !== null && u.S_rated_VA !== undefined) rec.loading = rec.S_max_VA / u.S_rated_VA;
      if (u.autonomy_s > 0) rec.E_batt_J = rec.P_max_W * u.autonomy_s / (u.eta_inverter * u.dod);
    }
    UPS[u.id] = rec;
  });

  return { loads: L, boards: B, sources: SRC, ups: UPS,
           fed: fedOf, supplied: supplied, children: children,
           loadsOn: loadsOn, boardById: boardById, upsById: upsById, caseById: caseById };
}

/* ------------------------------------------------------------- the rules
   Severity per SPEC §5. 020-026 major, 030-039 and 046 minor, the rest info.
   (P) rules 026, 036, 037, 045, 046 are evaluated only after a project package
   has been applied in this session. */
var SEVERITY = {
  'LOA-R-001': 'blocker', 'LOA-R-002': 'blocker', 'LOA-R-003': 'blocker', 'LOA-R-004': 'blocker',
  'LOA-R-005': 'blocker', 'LOA-R-006': 'blocker', 'LOA-R-007': 'blocker', 'LOA-R-008': 'blocker',
  'LOA-R-009': 'blocker', 'LOA-R-010': 'blocker', 'LOA-R-011': 'blocker', 'LOA-R-012': 'blocker',
  'LOA-R-013': 'blocker', 'LOA-R-014': 'blocker', 'LOA-R-015': 'blocker', 'LOA-R-016': 'blocker',
  'LOA-R-017': 'blocker', 'LOA-R-018': 'blocker', 'LOA-R-019': 'blocker',
  'LOA-R-020': 'major', 'LOA-R-021': 'major', 'LOA-R-022': 'major', 'LOA-R-023': 'major',
  'LOA-R-024': 'major', 'LOA-R-025': 'major', 'LOA-R-026': 'major',
  'LOA-R-030': 'minor', 'LOA-R-031': 'minor', 'LOA-R-032': 'minor', 'LOA-R-033': 'minor',
  'LOA-R-034': 'minor', 'LOA-R-035': 'minor', 'LOA-R-036': 'minor', 'LOA-R-037': 'minor',
  'LOA-R-038': 'minor', 'LOA-R-039': 'minor',
  'LOA-R-040': 'info', 'LOA-R-041': 'info', 'LOA-R-042': 'info', 'LOA-R-043': 'info',
  'LOA-R-044': 'info', 'LOA-R-045': 'info', 'LOA-R-046': 'minor', 'LOA-R-047': 'info'
};

/* Resolves "calc:<tool id>/<record id>/<output key>" against an applied package.
   -> {value} when the entry and the key are there, null otherwise. */
function calcLookup(pkg, ref) {
  if (!pkg || !pkg.calculations || typeof ref !== 'string') return null;
  var m = /^calc:([^/]+)\/([^/]+)\/(.+)$/.exec(ref);
  if (!m) return null;
  var list = pkg.calculations[m[1]];
  if (!Array.isArray(list)) return null;
  for (var i = 0; i < list.length; i++) {
    var e = list[i];
    if (!e || String(e.id) !== m[2]) continue;
    var o = e.record && e.record.outputs;
    if (!o || !num(o[m[3]])) return null;
    return { value: o[m[3]] };
  }
  return null;
}

function rules(s, r, pkg) {
  var out = [];
  function add(rule, target, cs) { out.push({ rule: rule, target: String(target), cases: cs || [] }); }
  var P = pkg && pkg.applied ? pkg : null;
  var boards = s.boards, sources = s.sources, ups = s.ups, loads = s.loads;

  sources.forEach(function (sc) {
    var R = r.sources[sc.id], over = [], step = [], startOver = [], margin = [];
    sc.cases.forEach(function (cid) {
      if (R.loading[cid] === undefined) return;
      if (R.loading[cid] > 1.0) over.push(cid);
      else if (R.loading[cid] > 0.8) margin.push(cid);
      if (sc.start_step_max_frac !== null && sc.start_step_max_frac !== undefined &&
          R.step[cid] !== null && R.step[cid] > sc.start_step_max_frac) step.push(cid);
      if (R.loading_start[cid] !== null && R.loading_start[cid] > 1.0) startOver.push(cid);
    });
    if (over.length) add('LOA-R-020', sc.id, order(over));
    if (step.length) add('LOA-R-021', sc.id, order(step));
    if (startOver.length) add('LOA-R-031', sc.id, order(startOver));
    if (margin.length) add('LOA-R-032', sc.id, order(margin));
    if (sc.start_step_max_frac === null || sc.start_step_max_frac === undefined) add('LOA-R-042', sc.id);
  });

  ups.forEach(function (u) {
    var R = r.ups[u.id];
    if (u.S_rated_VA !== null && u.S_rated_VA !== undefined && R.loading !== null && R.loading > 1.0) add('LOA-R-022', u.id);
    if (u.autonomy_s === 0) add('LOA-R-047', u.id);
  });

  var slugs = {};
  loads.forEach(function (l) { (slugs[slug(l.tag)] || (slugs[slug(l.tag)] = [])).push(l.id); });

  loads.forEach(function (l) {
    var b = r.boardById[l.board_id];
    var Uexp = l.phases === b.phases ? b.U_V : b.U_V / SQ3;
    if (Math.abs(l.U_V - Uexp) > 0.02 * Uexp) add('LOA-R-023', l.id);
    if ((l.category === 'essential' || l.category === 'emergency') && !r.supplied(l.board_id, 'emergency')) add('LOA-R-024', l.id);
    var chainUps = false, cur = b, guard = 0;
    while (cur && guard++ <= boards.length + 1) {
      if (cur.ups_id) { chainUps = true; break; }
      cur = cur.parent_id ? r.boardById[cur.parent_id] : null;
    }
    if (l.category === 'ups' && !chainUps) add('LOA-R-025', l.id);
    if (l.category !== 'ups' && chainUps) add('LOA-R-035', l.id);
    var hi = CASE_IDS.filter(function (c) { return l.lf[c] > 1.0; });
    if (hi.length) add('LOA-R-030', l.id, hi);
    var zero = CASE_IDS.every(function (c) { return r.loads[l.id].P[c] === 0; });
    if (zero) add('LOA-R-033', l.id);
    if (l.phases === 1 && b.phases === 3) add('LOA-R-040', l.id);
    if (l.pf_user === false) add('LOA-R-041', l.id);
    if (l.type === 'motor_vfd') add('LOA-R-044', l.id);
    if (slugs[slug(l.tag)].length > 1) add('LOA-R-038', l.id);
    if (P && l.source && l.source.kind === 'calc') {
      var hit = calcLookup(P, l.source.ref);
      if (!hit) add('LOA-R-036', l.id);
      else if (Math.abs(l.P_rated_W - hit.value) > 1e-9 * Math.abs(hit.value)) add('LOA-R-026', l.id);
    }
    if (P && structureMiss(P, l)) add('LOA-R-037', l.id);
  });

  boards.forEach(function (b) {
    var parent = b.parent_id ? r.boardById[b.parent_id] : null;
    if (b.ups_id && parent && r.loadsOn[parent.id].some(function (l) { return l.type === 'ups_input'; })) add('LOA-R-034', b.id);
    if (parent && b.phases === 1 && parent.phases === 3) add('LOA-R-040', b.id);
    if (!b.diversity || b.diversity.mode !== 'table') add('LOA-R-043', b.id);
    if (!b.parent_id) {
      var cs = [];
      s.cases.forEach(function (c) {
        if (r.boards[b.id].demand[c.id].S_VA > 0 && r.fed(b.id, c.id).length === 0) cs.push(c.id);
      });
      if (cs.length) add('LOA-R-039', b.id, order(cs));
    }
    if (P && structureMiss(P, b)) add('LOA-R-037', b.id);
  });

  /* (P) flags: a flag against an item of this register shows beside its row;
     one whose target is in neither the state nor the register is kept and
     reported rather than dropped (TZ-project-package §2.3). */
  if (P) {
    /* The item universe of LOA-R-045 is the working state together with the
       applied register (SPEC 5, LOA-R-045; SPEC 7.6). An item held in the
       register but not in the state has no row, so its finding is shown in the
       findings panel. LOA-R-046 is left for an id in neither. */
    var known = {};
    boards.concat(sources, ups, loads).forEach(function (x) { known[x.id] = 1; });
    (P.electrical_loads || []).forEach(function (x) { if (x && x.id) known[String(x.id)] = 1; });
    var hitIds = {}, orphan = {};
    (P.flags || []).forEach(function (f) {
      if (!f || f.target_kind !== 'electrical_load') return;
      var t = String(f.target_id);
      if (known[t]) hitIds[t] = 1;
      else orphan[t] = 1;
    });
    Object.keys(hitIds).forEach(function (t) { add('LOA-R-045', t); });
    Object.keys(orphan).forEach(function (t) { add('LOA-R-046', t); });
  }

  var uniq = {}, res = [];
  out.forEach(function (f) {
    var k = f.rule + '|' + f.target;
    if (uniq[k]) return;
    uniq[k] = 1;
    res.push(f);
  });
  res.sort(function (a, b) { return a.rule < b.rule ? -1 : a.rule > b.rule ? 1 : (a.target < b.target ? -1 : a.target > b.target ? 1 : 0); });
  return res;
}

function order(cs) {
  return CASE_IDS.filter(function (c) { return cs.indexOf(c) >= 0; });
}

/* A system_id or package_id that names nothing in the applied structure. */
function structureMiss(pkg, item) {
  var st = pkg.structure || {};
  var sys = (st.systems || []).map(function (x) { return String(x && x.id); });
  var pk = (st.packages || []).map(function (x) { return String(x && x.id); });
  if (item.system_id && sys.indexOf(String(item.system_id)) < 0) return true;
  if (item.package_id && pk.indexOf(String(item.package_id)) < 0) return true;
  return false;
}

function counts(findings) {
  var c = { blocker: 0, major: 0, minor: 0, info: 0 };
  findings.forEach(function (f) { c[SEVERITY[f.rule]]++; });
  return c;
}

/* solve() is the one entry every surface uses: the interface, the record, the
   report, the Python export and the benchmark adapter. */
function solve(s, pkg) {
  var bl = blockers(s);
  var hasEmpty = bl.some(function (f) { return f.rule === 'LOA-R-001'; });
  if (hasEmpty) return { verdict: 'empty', findings: bl, counts: counts(bl), results: null, pkgApplied: !!(pkg && pkg.applied) };
  if (bl.length) return { verdict: 'blocked', findings: bl, counts: counts(bl), results: null, pkgApplied: !!(pkg && pkg.applied) };
  var r = compute(s);
  var f = rules(s, r, pkg);
  var c = counts(f);
  var v = c.major ? 'review_required' : (c.minor ? 'remarks' : 'clear');
  return { verdict: v, findings: f, counts: c, results: r, pkgApplied: !!(pkg && pkg.applied) };
}

/* The governing figure the headline prints: the highest source loading with its
   source and case, and the highest start step ratio. */
function governing(res, s) {
  var out = { loading: null, loadSrc: null, loadCase: null, step: null, stepSrc: null, stepCase: null,
              S: null, Ssrc: null, Scase: null };
  if (!res || !res.results) return out;
  s.sources.forEach(function (sc) {
    var R = res.results.sources[sc.id];
    sc.cases.forEach(function (cid) {
      if (R.loading[cid] === undefined) return;
      if (out.loading === null || R.loading[cid] > out.loading) { out.loading = R.loading[cid]; out.loadSrc = sc.id; out.loadCase = cid; }
      var S = res.results.boards[sc.board_id].demand[cid].S_VA;
      if (out.S === null || S > out.S) { out.S = S; out.Ssrc = sc.id; out.Scase = cid; }
      if (R.step[cid] !== null && (out.step === null || R.step[cid] > out.step)) { out.step = R.step[cid]; out.stepSrc = sc.id; out.stepCase = cid; }
    });
  });
  return out;
}
