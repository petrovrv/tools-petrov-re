'LOA-R-010': T('The nominal voltage is outside 1 V to 36 kV.','Номінальна напруга поза межами від 1 В до 36 кВ.','Die Nennspannung liegt außerhalb von 1 V bis 36 kV.','De nominale spanning ligt buiten 1 V tot 36 kV.','La tension nominale sort de la plage 1 V à 36 kV.','La tensión nominal está fuera de 1 V a 36 kV.','Napięcie znamionowe jest poza zakresem od 1 V do 36 kV.'),
'LOA-R-011': T('A three-phase load cannot sit on a single-phase board.','Трифазне навантаження не може бути на однофазній секції.','Eine dreiphasige Last kann nicht an einer einphasigen Schiene liegen.','Een driefasige belasting kan niet op een eenfasige rail zitten.','Une charge triphasée ne peut pas être sur un tableau monophasé.','Una carga trifásica no puede estar en un cuadro monofásico.','Odbiór trójfazowy nie może być na rozdzielnicy jednofazowej.'),
'LOA-R-012': T('A load factor is outside the range 0 to 1.5.','Коефіцієнт завантаження поза діапазоном від 0 до 1,5.','Ein Belastungsfaktor liegt außerhalb von 0 bis 1,5.','Een belastingsfactor ligt buiten het bereik 0 tot 1,5.','Un facteur de charge sort de la plage 0 à 1,5.','Un factor de carga está fuera del rango 0 a 1,5.','Współczynnik obciążenia jest poza zakresem od 0 do 1,5.'),
'LOA-R-013': T('The entered diversity factor is outside the range 0 to 1.','Задане значення одночасності поза діапазоном від 0 до 1.','Der eingegebene Gleichzeitigkeitsfaktor liegt außerhalb von 0 bis 1.','De ingevoerde gelijktijdigheidsfactor ligt buiten 0 tot 1.','Le facteur de simultanéité saisi sort de la plage 0 à 1.','El factor de simultaneidad introducido está fuera del rango 0 a 1.','Wpisany współczynnik jednoczesności jest poza zakresem od 0 do 1.'),
'LOA-R-014': T('The source needs an existing board, a rating above zero and at least one case.','Джерело потребує наявної секції, потужності понад нуль і принаймні одного режиму.','Die Quelle braucht eine vorhandene Schiene, eine Leistung über null und mindestens einen Fall.','De bron heeft een bestaande rail, een vermogen boven nul en minstens één geval nodig.','La source exige un tableau existant, une puissance supérieure à zéro et au moins un cas.','La fuente necesita un cuadro existente, una potencia mayor que cero y al menos un caso.','Źródło wymaga istniejącej rozdzielnicy, mocy powyżej zera i co najmniej jednego przypadku.'),
'LOA-R-015': T('The UPS link names no UPS, or one UPS output is set on two boards.','Посилання на ДБЖ не існує, або вихід одного ДБЖ задано на двох секціях.','Der USV-Verweis nennt keine USV, oder ein USV-Ausgang steht an zwei Schienen.','De UPS-verwijzing noemt geen UPS, of één UPS-uitgang staat op twee rails.','Le lien ASI ne désigne aucune ASI, ou une sortie d’ASI est placée sur deux tableaux.','El enlace del SAI no nombra ningún SAI, o una salida de SAI está en dos cuadros.','Odwołanie do UPS nie wskazuje UPS-a albo jedno wyjście UPS przypisano do dwóch rozdzielnic.'),
'LOA-R-016': T('An efficiency, power factor, depth of discharge, autonomy or rating of the UPS is out of range.','ККД, коефіцієнт потужності, глибина розряду, автономія чи потужність ДБЖ поза межами.','Wirkungsgrad, Leistungsfaktor, Entladetiefe, Autonomie oder Leistung der USV liegt außerhalb.','Een rendement, arbeidsfactor, ontlaaddiepte, autonomie of vermogen van de UPS ligt buiten bereik.','Un rendement, facteur de puissance, profondeur de décharge, autonomie ou puissance de l’ASI est hors plage.','Un rendimiento, factor de potencia, profundidad de descarga, autonomía o potencia del SAI está fuera de rango.','Sprawność, współczynnik mocy, głębokość rozładowania, czas podtrzymania lub moc UPS-a są poza zakresem.'),
'LOA-R-017': T('A motor needs a locked-rotor ratio of 1 to 12 and a starting power factor above 0.','Двигун потребує кратності пускового струму від 1 до 12 і коефіцієнта потужності пуску понад 0.','Ein Motor braucht ein Anzugsstromverhältnis von 1 bis 12 und einen Anlauf-Leistungsfaktor über 0.','Een motor heeft een aanloopstroomverhouding van 1 tot 12 en een arbeidsfactor bij aanloop boven 0 nodig.','Un moteur exige un rapport de courant rotor bloqué de 1 à 12 et un facteur de puissance au démarrage supérieur à 0.','Un motor necesita una relación de corriente de rotor bloqueado de 1 a 12 y un factor de potencia de arranque mayor que 0.','Silnik wymaga krotności prądu rozruchowego od 1 do 12 i współczynnika mocy rozruchu powyżej 0.'),
'LOA-R-018': T('The tag is empty.','Позиція порожня.','Das Kennzeichen ist leer.','De tag is leeg.','Le repère est vide.','La etiqueta está vacía.','Oznaczenie jest puste.'),
'LOA-R-019': T('The permissible start step must be above zero.','Допустимий пусковий крок має бути більшим за нуль.','Die zulässige Anlaufstufe muss über null liegen.','De toegestane aanloopstap moet boven nul liggen.','Le gradin de démarrage admissible doit être supérieur à zéro.','El escalón de arranque admisible debe ser mayor que cero.','Dopuszczalny stopień rozruchu musi być większy od zera.'),
'LOA-R-020': T('The demand passes the rating of the source.','Попит перевищує потужність джерела.','Der Bedarf übersteigt die Bemessungsleistung der Quelle.','De vraag gaat over het nominale vermogen van de bron.','La puissance appelée dépasse la puissance assignée de la source.','La demanda supera la potencia asignada de la fuente.','Zapotrzebowanie przekracza moc znamionową źródła.'),
'LOA-R-021': T('The start step passes the limit entered for this source.','Пусковий крок перевищує задану для джерела межу.','Die Anlaufstufe übersteigt den für diese Quelle eingegebenen Grenzwert.','De aanloopstap gaat over de voor deze bron ingevoerde grens.','Le gradin de démarrage dépasse la limite saisie pour cette source.','El escalón de arranque supera el límite introducido para esta fuente.','Stopień rozruchu przekracza granicę wpisaną dla tego źródła.'),
'LOA-R-022': T('The UPS output rating is passed by the load behind it.','Навантаження за ДБЖ перевищує його вихідну потужність.','Die USV-Ausgangsleistung wird von der dahinterliegenden Last überschritten.','Het uitgangsvermogen van de UPS wordt overschreden door de belasting erachter.','La puissance de sortie de l’ASI est dépassée par la charge qui la suit.','La potencia de salida del SAI la supera la carga situada tras él.','Moc wyjściową UPS-a przekracza odbiór za nim.'),
'LOA-R-023': T('The load voltage differs from the board voltage by more than 2 %.','Напруга навантаження відрізняється від напруги секції більш ніж на 2 %.','Die Lastspannung weicht um mehr als 2 % von der Schienenspannung ab.','De belastingspanning wijkt meer dan 2 % af van de railspanning.','La tension de la charge s’écarte de plus de 2 % de celle du tableau.','La tensión de la carga difiere más del 2 % de la del cuadro.','Napięcie odbioru różni się od napięcia rozdzielnicy o więcej niż 2 %.'),
'LOA-R-024': T('A generator-backed or safety load sits on a board that no source supplies in the emergency case.','Відповідальне чи аварійне навантаження стоїть на секції, яку в аварійному режимі не живить жодне джерело.','Eine wichtige oder Sicherheitslast liegt an einer Schiene, die im Notfall keine Quelle speist.','Een essentiële of veiligheidsbelasting zit op een rail die in het noodgeval door geen bron gevoed wordt.','Une charge essentielle ou de sécurité est sur un tableau qu’aucune source n’alimente en secours.','Una carga esencial o de seguridad está en un cuadro que ninguna fuente alimenta en emergencia.','Odbiór ważny lub bezpieczeństwa jest na rozdzielnicy, której w przypadku awaryjnym nie zasila żadne źródło.'),
'LOA-R-025': T('A UPS-backed load sits on a board with no UPS anywhere above it.','Навантаження від ДБЖ стоїть на секції, над якою немає жодного ДБЖ.','Eine USV-gestützte Last liegt an einer Schiene, über der keine USV steht.','Een UPS-belasting zit op een rail zonder UPS erboven.','Une charge sur ASI est sur un tableau sans aucune ASI en amont.','Una carga respaldada por SAI está en un cuadro sin ningún SAI aguas arriba.','Odbiór z UPS jest na rozdzielnicy, nad którą nie ma żadnego UPS-a.'),
'LOA-R-026': T('The attached calculation now gives a different rated power.','Прикріплений розрахунок тепер дає іншу номінальну потужність.','Die angehängte Berechnung liefert jetzt eine andere Bemessungsleistung.','De gekoppelde berekening geeft nu een ander nominaal vermogen.','Le calcul attaché donne désormais une autre puissance assignée.','El cálculo adjunto da ahora otra potencia asignada.','Dołączone obliczenie daje teraz inną moc znamionową.'),
'LOA-R-030': T('A load factor above 1 means the load runs above its rating in that case.','Коефіцієнт завантаження понад 1 означає роботу вище номіналу в цьому режимі.','Ein Belastungsfaktor über 1 bedeutet Betrieb über der Bemessungsleistung in diesem Fall.','Een belastingsfactor boven 1 betekent bedrijf boven het nominale vermogen in dat geval.','Un facteur de charge supérieur à 1 signifie un fonctionnement au-dessus de la puissance assignée dans ce cas.','Un factor de carga superior a 1 significa funcionamiento por encima de la potencia asignada en ese caso.','Współczynnik obciążenia powyżej 1 oznacza pracę powyżej mocy znamionowej w tym przypadku.'),
'LOA-R-031': T('The source is above its rating while the largest motor starts.','Джерело перевантажене під час пуску найбільшого двигуна.','Die Quelle liegt beim Anlauf des größten Motors über ihrer Bemessungsleistung.','De bron zit boven haar nominale vermogen terwijl de grootste motor aanloopt.','La source dépasse sa puissance assignée pendant le démarrage du plus gros moteur.','La fuente supera su potencia asignada durante el arranque del motor mayor.','Źródło jest powyżej mocy znamionowej podczas rozruchu największego silnika.'),
'LOA-R-032': T('The source runs between 80 % and 100 % of its rating.','Джерело працює в діапазоні 80–100 % номіналу.','Die Quelle läuft zwischen 80 % und 100 % ihrer Bemessungsleistung.','De bron draait tussen 80 % en 100 % van haar nominale vermogen.','La source fonctionne entre 80 % et 100 % de sa puissance assignée.','La fuente funciona entre el 80 % y el 100 % de su potencia asignada.','Źródło pracuje między 80 % a 100 % mocy znamionowej.'),
'LOA-R-033': T('The load draws nothing in any of the five cases.','Навантаження не споживає нічого в жодному з п’яти режимів.','Die Last nimmt in keinem der fünf Fälle Leistung auf.','De belasting neemt in geen van de vijf gevallen vermogen op.','La charge n’appelle rien dans aucun des cinq cas.','La carga no consume nada en ninguno de los cinco casos.','Odbiór nie pobiera nic w żadnym z pięciu przypadków.'),
'LOA-R-034': T('The parent board also carries a UPS input load, so this power may be counted twice.','Материнська секція також несе навантаження «вхід ДБЖ», тож потужність може бути врахована двічі.','Die übergeordnete Schiene trägt auch eine USV-Eingangslast, die Leistung kann doppelt gezählt sein.','De moederrail draagt ook een UPS-ingangsbelasting, dus dit vermogen kan dubbel geteld zijn.','Le tableau amont porte aussi une charge d’entrée ASI, cette puissance peut être comptée deux fois.','El cuadro aguas arriba lleva también una carga de entrada de SAI, esa potencia puede contarse dos veces.','Rozdzielnica nadrzędna niesie też odbiór wejścia UPS, więc ta moc może być policzona dwa razy.'),
'LOA-R-035': T('The load sits behind a UPS but is not marked UPS-backed.','Навантаження стоїть за ДБЖ, але не позначене як живлене від ДБЖ.','Die Last liegt hinter einer USV, ist aber nicht als USV-gestützt gekennzeichnet.','De belasting zit achter een UPS maar is niet als UPS-belasting gemarkeerd.','La charge est derrière une ASI mais n’est pas marquée comme alimentée par ASI.','La carga está tras un SAI pero no se marca como respaldada por SAI.','Odbiór jest za UPS-em, ale nie oznaczono go jako zasilanego z UPS.'),
'LOA-R-036': T('The attached calculation this power came from is no longer in the project.','Розрахунок, з якого взято цю потужність, більше не в проєкті.','Die Berechnung, aus der diese Leistung stammt, ist nicht mehr im Projekt.','De berekening waar dit vermogen vandaan kwam, staat niet meer in het project.','Le calcul d’où vient cette puissance n’est plus dans le projet.','El cálculo del que salió esta potencia ya no está en el proyecto.','Obliczenia, z których pochodzi ta moc, nie ma już w projekcie.'),
'LOA-R-037': T('The system or work package named here is not in the project structure.','Названа тут система або пакет робіт відсутні у структурі проєкту.','Das hier genannte System oder Arbeitspaket steht nicht in der Projektstruktur.','Het hier genoemde systeem of werkpakket staat niet in de projectstructuur.','Le système ou lot de travaux nommé ici n’est pas dans la structure du projet.','El sistema o paquete de trabajo nombrado aquí no está en la estructura del proyecto.','Wskazany tu system lub pakiet robót nie występuje w strukturze projektu.'),
'LOA-R-038': T('Two loads carry tags that reduce to the same identifier.','Дві позиції зводяться до однакового ідентифікатора.','Zwei Lasten tragen Kennzeichen, die auf dieselbe Kennung führen.','Twee belastingen dragen tags die tot dezelfde id herleiden.','Deux charges portent des repères qui se réduisent au même identifiant.','Dos cargas llevan etiquetas que se reducen al mismo identificador.','Dwa odbiory mają oznaczenia sprowadzające się do tego samego identyfikatora.'),
'LOA-R-039': T('The incoming board draws power in this case with no source declared, so no loading is computed.','Вхідна секція в цьому режимі споживає потужність без оголошеного джерела, тож завантаження не рахується.','Die Einspeiseschiene nimmt in diesem Fall Leistung auf, ohne dass eine Quelle erklärt ist; es wird keine Auslastung berechnet.','De inkomende rail neemt in dit geval vermogen op zonder aangegeven bron, dus er wordt geen belasting berekend.','Le tableau d’arrivée appelle de la puissance dans ce cas sans source déclarée ; aucune charge n’est calculée.','El cuadro de acometida consume potencia en este caso sin fuente declarada, por lo que no se calcula carga.','Rozdzielnica wejściowa pobiera w tym przypadku moc bez zadeklarowanego źródła, więc obciążenie nie jest liczone.'),
'LOA-R-040': T('A single-phase item on a three-phase board is spread evenly over the phases; unbalance is not computed.','Однофазний елемент на трифазній секції розподілено рівномірно по фазах; несиметрія не обчислюється.','Ein einphasiges Element an einer dreiphasigen Schiene wird gleichmäßig auf die Phasen verteilt; Unsymmetrie wird nicht berechnet.','Een eenfasig item op een driefasige rail wordt gelijk over de fasen verdeeld; onbalans wordt niet berekend.','Un élément monophasé sur un tableau triphasé est réparti également sur les phases ; le déséquilibre n’est pas calculé.','Un elemento monofásico en un cuadro trifásico se reparte por igual entre las fases; el desequilibrio no se calcula.','Element jednofazowy na rozdzielnicy trójfazowej rozkłada się równo na fazy; asymetria nie jest liczona.'),
'LOA-R-041': T('The power factor is the type default, not a value from the equipment.','Коефіцієнт потужності — типове значення, не з даних обладнання.','Der Leistungsfaktor ist der Typ-Vorgabewert, kein Gerätewert.','De arbeidsfactor is de standaardwaarde van het type, geen waarde van het apparaat.','Le facteur de puissance est la valeur par défaut du type, pas une donnée de l’équipement.','El factor de potencia es el valor por defecto del tipo, no un dato del equipo.','Współczynnik mocy to wartość domyślna typu, nie dana urządzenia.'),
'LOA-R-042': T('No permissible start step is entered, so the starting step is reported but not judged.','Допустимий пусковий крок не заданий, тож крок показано, але не оцінено.','Es ist keine zulässige Anlaufstufe eingegeben; die Stufe wird gezeigt, aber nicht bewertet.','Er is geen toegestane aanloopstap ingevoerd; de stap wordt getoond maar niet beoordeeld.','Aucun gradin de démarrage admissible n’est saisi ; le gradin est indiqué mais non jugé.','No se ha introducido escalón de arranque admisible; el escalón se muestra pero no se juzga.','Nie wpisano dopuszczalnego stopnia rozruchu, więc stopień jest pokazany, lecz nieoceniony.'),
'LOA-R-043': T('The diversity factor of this board is an agreement, not the table value.','Коефіцієнт одночасності цієї секції — домовленість, а не табличне значення.','Der Gleichzeitigkeitsfaktor dieser Schiene ist eine Vereinbarung, kein Tabellenwert.','De gelijktijdigheidsfactor van deze rail is een afspraak, geen tabelwaarde.','Le facteur de simultanéité de ce tableau est un accord, pas la valeur du tableau normatif.','El factor de simultaneidad de este cuadro es un acuerdo, no el valor de la tabla.','Współczynnik jednoczesności tej rozdzielnicy jest ustaleniem, nie wartością tablicową.'),
'LOA-R-044': T('Only the displacement power factor of the drive is modelled; its harmonic current is not.','Модельовано лише коефіцієнт зсуву перетворювача; гармонічний струм не враховано.','Nur der Verschiebungsfaktor des Umrichters ist modelliert, sein Oberschwingungsstrom nicht.','Alleen de verschuivingsfactor van de regelaar is gemodelleerd, de harmonische stroom niet.','Seul le facteur de déplacement du variateur est modélisé ; son courant harmonique ne l’est pas.','Solo se modela el factor de desplazamiento del variador; su corriente armónica no.','Modelowany jest tylko współczynnik przesunięcia przemiennika; jego prąd harmonicznych nie.'),
'LOA-R-045': T('Another tool has raised a flag against this item in the project package.','Інший інструмент підняв позначку на цей елемент у пакеті проєкту.','Ein anderes Werkzeug hat im Projektpaket eine Markierung gegen dieses Element gesetzt.','Een andere tool heeft in het projectpakket een markering op dit item gezet.','Un autre outil a posé un signalement sur cet élément dans le paquet projet.','Otra herramienta ha marcado este elemento en el paquete de proyecto.','Inne narzędzie oznaczyło ten element w pakiecie projektu.'),
'LOA-R-046': T('A flag in the project package names an item that is in neither this list nor the register.','Позначка в пакеті проєкту вказує на елемент, якого немає ні в цьому переліку, ні в реєстрі.','Eine Markierung im Projektpaket nennt ein Element, das weder in dieser Liste noch im Register steht.','Een markering in het projectpakket noemt een item dat noch in deze lijst noch in het register staat.','Un signalement du paquet projet désigne un élément absent de cette liste et du registre.','Una marca del paquete de proyecto nombra un elemento que no está ni en esta lista ni en el registro.','Oznaczenie w pakiecie projektu wskazuje element, którego nie ma ani na tej liście, ani w rejestrze.'),
'LOA-R-047': T('With no autonomy entered, no battery energy is computed.','Без заданої автономії енергія батареї не обчислюється.','Ohne eingegebene Autonomiezeit wird keine Batterieenergie berechnet.','Zonder ingevoerde autonomie wordt geen batterijenergie berekend.','Sans autonomie saisie, aucune énergie batterie n’est calculée.','Sin autonomía introducida no se calcula energía de batería.','Bez wpisanego czasu podtrzymania energia baterii nie jest liczona.')

/* ======================================================== 3. the interface */
var state = presetA();
var last = null;            /* the solve() result the whole page reads */
var ui = null;
var stage = null;
var editCase = 'normal';    /* which case the case panel edits; not part of the state */
var editSource = null;
var editUps = null;

function caseLabel(id) {
  return S[{ normal: 'caseNormal', peak: 'casePeak', startup: 'caseStartup',
             emergency: 'caseEmergency', maintenance: 'caseMaintenance' }[id]];
}
function catLabel(id) {
  return S[{ normal: 'catNormal', essential: 'catEssential', emergency: 'catEmergency', ups: 'catUps' }[id]];
}
function typeLabel(id) {
  return S[{ motor_dol: 'typeMotorDol', motor_vfd: 'typeMotorVfd', motor_softstart: 'typeMotorSoft',
             heater: 'typeHeater', lighting: 'typeLighting', socket: 'typeSocket',
             ups_input: 'typeUpsInput', it: 'typeIt', other: 'typeOther' }[id]];
}
function sevLabel(sv) {
  return S[{ blocker: 'sevBlocker', major: 'sevMajor', minor: 'sevMinor', info: 'sevInfo' }[sv]];
}
function nameOf(id) {
  var i, a = state.boards.concat(state.sources, state.ups);
  for (i = 0; i < a.length; i++) if (a[i].id === id) return a[i].name;
  for (i = 0; i < state.loads.length; i++) if (state.loads[i].id === id) return state.loads[i].tag;
  return id;
}
function caseById(id) {
  for (var i = 0; i < state.cases.length; i++) if (state.cases[i].id === id) return state.cases[i];
  return state.cases[0];
}
function srcSel() {
  for (var i = 0; i < state.sources.length; i++) if (state.sources[i].id === editSource) return state.sources[i];
  return state.sources[0] || null;
}
function upsSel() {
  for (var i = 0; i < state.ups.length; i++) if (state.ups[i].id === editUps) return state.ups[i];
  return state.ups[0] || null;
}
function boardOptions() {
  return state.boards.map(function (b) { return [b.id, b.name]; });
}
/* A power factor of 1e-300 is legal per SPEC 3.6, and S = P/pf then leaves the
   double range. The framework formatter falls back to String(x), which prints
   "4.095744680851063e+302" and "Infinity" in a results cell. Anything past the
   range an electrical figure can occupy is printed in exponential form, and a
   value that is not finite prints as the em dash every empty cell uses. */
function fmt(v, p) {
  if (typeof v === 'number' && !isFinite(v)) return '\u2014';
  if (typeof v === 'number' && Math.abs(v) >= 1e12) return v.toExponential(3);
  return DiagramUI.fmt(v, { precision: p });
}
/* The same guard for a results-table cell: those go to DiagramUI.tableCell as
   {value, precision}, not through fmt(), and carried the overflow to the sheet. */
function ncell(v, p) {
  if (typeof v === 'number' && (!isFinite(v) || Math.abs(v) >= 1e12)) return { text: fmt(v), num: true };
  return { value: v, precision: p, num: true };
}
function pct(v, p) { return v === null || v === undefined ? '—' : fmt(100 * v, p == null ? 1 : p) + ' %'; }

/* An id is minted once, from the name or tag the item is created with, and then
   stays fixed so a flag raised against it survives a rename (SPEC §3.7). */
function freeId(prefix, base) {
  var taken = {};
  state.boards.concat(state.sources, state.ups, state.loads).forEach(function (x) { taken[x.id] = 1; });
  var n = 1, id;
  do { id = prefix + slug(base) + (n > 1 ? '-' + n : ''); n++; } while (taken[id] && n < 500);
  return id;
}

function recompute() { last = solve(state, pkgCtx()); }

/* ------------------------------------------------------------ the drawing */
/* Source loading by operating case: one group per source, one bar per case in
   that source's cases, a rule at the combined source rating, and a hollow
   marker at the apparent power during the largest-motor start. One y-axis,
   kVA. The same function draws the screen canvas and the report figure. */
function drawFigure(ctx, w, h, coarse, cs, withLegend) {
  var muted = cs.muted, line = cs.line, ink = cs.ink, font = cs.font;
  ctx.clearRect(0, 0, w, h);
  if (!last || !last.results) return;
  var groups = [];
  state.sources.forEach(function (sc) {
    var R = last.results.sources[sc.id], bars = [];
    sc.cases.forEach(function (cid) {
      if (R.loading[cid] === undefined) return;
      bars.push({ cid: cid, S: last.results.boards[sc.board_id].demand[cid].S_VA / 1000,
                  Sts: R.S_ts_VA[cid] === null ? null : R.S_ts_VA[cid] / 1000 });
    });
    groups.push({ name: sc.name, rated: R.S_rated_tot[sc.cases[0]] / 1000, bars: bars });
  });
  if (!groups.length) return;
  var padL = coarse ? 46 : 58, padR = 12, padT = withLegend ? (coarse ? 30 : 34) : 14, padB = coarse ? 30 : 36;
  var maxY = 0;
  groups.forEach(function (g) {
    if (g.rated > maxY) maxY = g.rated;
    g.bars.forEach(function (b) {
      if (b.S > maxY) maxY = b.S;
      if (b.Sts !== null && b.Sts > maxY) maxY = b.Sts;
    });
  });
  if (!(maxY > 0)) maxY = 1;
  maxY *= 1.12;
  var X0 = padL, X1 = w - padR, Y0 = h - padB, Y1 = padT;
  function Y(v) { return Y0 - (Y0 - Y1) * (v / maxY); }
  ctx.font = '400 12px ' + font;
  ctx.strokeStyle = line; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(X0, Y1); ctx.lineTo(X0, Y0); ctx.lineTo(X1, Y0); ctx.stroke();
  ctx.fillStyle = muted; ctx.textAlign = 'right';
  DiagramUI.ticks(0, maxY, Y0 - Y1, coarse ? 'coarse' : 'fine').forEach(function (t) {
    var y = Y(t);
    if (y < Y1 - 2 || y > Y0 + 2) return;
    ctx.beginPath(); ctx.moveTo(X0 - 4, y); ctx.lineTo(X0, y); ctx.stroke();
    ctx.fillText(DiagramUI.fmt(t, { precision: 0 }), X0 - 7, y + 4);
  });
  ctx.save(); ctx.translate(12, (Y0 + Y1) / 2); ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center'; ctx.fillText('kVA', 0, 0); ctx.restore();
  /* The bars are coloured by case and the report carries no screen legend, so
     the key is drawn into the figure itself. */
  var lx = X0, ly = coarse ? 12 : 14;
  ctx.textAlign = 'left';
  if (withLegend) CASE_IDS.forEach(function (cid, i) {
    var w2 = ctx.measureText(tx(caseLabel(cid))).width + 20;
    if (lx + w2 > X1) { lx = X0; ly += 13; }
    ctx.fillStyle = DiagramUI.series(i);
    ctx.fillRect(lx, ly - 7, 8, 8);
    ctx.fillStyle = muted;
    ctx.fillText(tx(caseLabel(cid)), lx + 12, ly);
    lx += w2;
  });
  var nBars = 0;
  groups.forEach(function (g) { nBars += Math.max(1, g.bars.length); });
  var slot = (X1 - X0 - 10) / (nBars + groups.length * 0.6);
  var bw = Math.max(4, Math.min(38, slot * 0.8));
  var x = X0 + 8;
  groups.forEach(function (g) {
    var gx0 = x;
    g.bars.forEach(function (b) {
      var ci = CASE_IDS.indexOf(b.cid);
      ctx.fillStyle = DiagramUI.series(ci);
      ctx.fillRect(x, Y(b.S), bw, Y0 - Y(b.S));
      if (b.Sts !== null) {
        ctx.strokeStyle = ink; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(x + bw / 2, Y(Math.min(b.Sts, maxY)), 3.4, 0, 6.2832); ctx.stroke();
      }
      x += slot;
    });
    ctx.strokeStyle = ink; ctx.lineWidth = 1.6; ctx.setLineDash([5, 3]);
    ctx.beginPath(); ctx.moveTo(gx0 - 3, Y(g.rated)); ctx.lineTo(x - slot + bw + 3, Y(g.rated)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = muted; ctx.textAlign = 'center';
    ctx.fillText(g.name, (gx0 + x - slot + bw) / 2, Y0 + (coarse ? 14 : 17));
    x += slot * 0.6;
  });
}
function themeTokens() {
  var c = getComputedStyle(document.documentElement);
  return { muted: c.getPropertyValue('--muted').trim() || '#777',
           line: c.getPropertyValue('--line').trim() || '#ddd',
           ink: c.getPropertyValue('--ink').trim() || '#222',
           bg: c.getPropertyValue('--panel').trim() || c.getPropertyValue('--bg').trim() || '#fff',
           font: c.getPropertyValue('--font').trim() || 'sans-serif' };
}

/* --------------------------------------------- the one-line (SPEC 10.2) */
/* The second on-screen view: the board tree drawn as a one-line. Boards are
   busbars, a parent sits above its children, a source hangs over the board it
   feeds in the case on screen, and a UPS is a box on the link into the board
   behind it. Each busbar carries S of that case in kVA. IEC 60617 symbols are
   used so the drawing carries no word that would need translating: two
   overlapping circles for a transformer, a circle with a sine for a generator,
   a box with a cell symbol for a UPS. */
var ONE_LINE_MAX = 24;

function oneLineTree() {
  var byId = {}, order = [], depth = {}, i;
  state.boards.forEach(function (b) { byId[b.id] = b; });
  state.boards.forEach(function (b) {
    var d = 0, cur = b, guard = 0;
    while (cur && cur.parent_id && byId[cur.parent_id] && guard++ <= state.boards.length) {
      cur = byId[cur.parent_id]; d++;
    }
    depth[b.id] = d;
  });
  /* depth-first over the forest, so a child stands under its own parent */
  var kids = {};
  state.boards.forEach(function (b) { kids[b.id] = []; });
  var roots = [];
  state.boards.forEach(function (b) {
    if (b.parent_id && kids[b.parent_id] && b.parent_id !== b.id) kids[b.parent_id].push(b);
    else roots.push(b);
  });
  function walk(b, guard) {
    if (guard > state.boards.length || order.length >= ONE_LINE_MAX) return;
    order.push(b);
    kids[b.id].forEach(function (c) { walk(c, guard + 1); });
  }
  for (i = 0; i < roots.length; i++) walk(roots[i], 0);
  return { order: order, depth: depth, hidden: state.boards.length - order.length };
}

function drawOneLine(ctx, w, h, coarse, cs) {
  var muted = cs.muted, line = cs.line, ink = cs.ink, font = cs.font;
  ctx.clearRect(0, 0, w, h);
  if (!last || !last.results || !state.boards.length) return;
  var cv = state.ui.case_view, t = oneLineTree(), bars = t.order;
  if (!bars.length) return;
  var maxD = 0;
  bars.forEach(function (b) { if (t.depth[b.id] > maxD) maxD = t.depth[b.id]; });
  var padL = 8, padR = 8, padT = 34, padB = coarse ? 16 : 20;
  var levels = maxD + 1;
  var levelH = Math.max(52, (h - padT - padB) / levels);
  var slotW = (w - padL - padR) / bars.length;
  var bw = Math.max(22, Math.min(slotW * 0.8, 130));
  var upsById = {};
  state.ups.forEach(function (u) { upsById[u.id] = u; });
  var xOf = {}, yOf = {};
  bars.forEach(function (b, i) {
    xOf[b.id] = padL + slotW * (i + 0.5);
    yOf[b.id] = padT + levelH * t.depth[b.id];
  });
  ctx.font = '400 ' + (coarse ? 10 : 11) + 'px ' + font;
  ctx.textAlign = 'center';

  /* the links first, so a busbar draws over its own drop */
  bars.forEach(function (b) {
    if (!b.parent_id || xOf[b.parent_id] === undefined) return;
    var x = xOf[b.id], y0 = yOf[b.parent_id], y1 = yOf[b.id];
    ctx.strokeStyle = line; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
    var u = b.ups_id ? upsById[b.ups_id] : null;
    if (!u) return;
    var my = (y0 + y1) / 2;
    ctx.fillStyle = cs.bg || '#fff';
    ctx.fillRect(x - 11, my - 8, 22, 16);
    ctx.strokeStyle = ink; ctx.lineWidth = 1.2;
    ctx.strokeRect(x - 11, my - 8, 22, 16);
    /* cell symbol: one long plate, one short plate */
    ctx.beginPath();
    ctx.moveTo(x - 3, my - 5); ctx.lineTo(x - 3, my + 5);
    ctx.moveTo(x + 3, my - 3); ctx.lineTo(x + 3, my + 3);
    ctx.stroke();
    if (!coarse) {
      ctx.fillStyle = muted; ctx.textAlign = 'left';
      ctx.fillText(u.name, x + 14, my + 4);
      ctx.textAlign = 'center';
    }
  });

  /* the sources over the boards they feed in this case */
  state.sources.forEach(function (sc) {
    if (sc.cases.indexOf(cv) < 0 || xOf[sc.board_id] === undefined) return;
    var x = xOf[sc.board_id], y = yOf[sc.board_id], sy = y - 22;
    ctx.strokeStyle = line; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(x, sy + 9); ctx.lineTo(x, y); ctx.stroke();
    ctx.strokeStyle = ink; ctx.lineWidth = 1.3;
    if (sc.kind === 'generator') {
      ctx.beginPath(); ctx.arc(x, sy, 8, 0, 6.2832); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - 4.5, sy + 1.5);
      ctx.bezierCurveTo(x - 2.2, sy - 4, x - 2.2, sy + 4, x, sy);
      ctx.bezierCurveTo(x + 2.2, sy - 4, x + 2.2, sy + 4, x + 4.5, sy - 1.5);
      ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(x, sy - 3.5, 6.5, 0, 6.2832); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, sy + 3.5, 6.5, 0, 6.2832); ctx.stroke();
    }
    if (!coarse) {
      ctx.fillStyle = muted; ctx.textAlign = 'left';
      ctx.fillText(sc.name, x + 12, sy + 4);
      ctx.textAlign = 'center';
    }
  });

  /* the busbars and their apparent power in this case */
  bars.forEach(function (b) {
    var x = xOf[b.id], y = yOf[b.id];
    ctx.strokeStyle = ink; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x - bw / 2, y); ctx.lineTo(x + bw / 2, y); ctx.stroke();
    ctx.fillStyle = ink;
    ctx.fillText(b.name, x, y - 7);
    var d = last.results.boards[b.id].demand[cv];
    ctx.fillStyle = muted;
    ctx.fillText(fmt(d ? d.S_VA / 1000 : null, 1) + ' kVA', x, y + 14);
  });

  ctx.fillStyle = muted; ctx.textAlign = 'left';
  ctx.fillText(tx(caseLabel(cv)) + (t.hidden > 0 ? ' · ' + tx(S.olMore).replace('{n}', String(t.hidden)) : ''),
               padL, 14);
}

/* Keeps the list consistent with SPEC §3.8 after an edit in the grid: a type
   change resets the defaults it owns, a hand-edited rated power drops the
   calculation trace, and a hand-edited power factor becomes a user override. */
var typeMemo = {}, pfMemo = {};
function normalise() {
  state.loads.forEach(function (l) {
    var d = TYPE_DEF[l.type] || TYPE_DEF.other;
    if (!l.lf) l.lf = { normal: 1, peak: 1, startup: 1, emergency: 1, maintenance: 1 };
    if (!l.source) l.source = { kind: 'manual' };
    if (typeMemo[l.id] !== undefined && typeMemo[l.id] !== l.type) {
      l.P_basis = d.basis;
      l.eta = d.eta;
      l.k_LR = d.motor ? d.kLR : null;
      l.pf_start = d.motor ? d.pfs : null;
      if (l.pf_user === false) { l.pf = d.pf; pfMemo[l.id] = l.pf; }
    }
    typeMemo[l.id] = l.type;
    if (pfMemo[l.id] !== undefined && pfMemo[l.id] !== l.pf) l.pf_user = (l.pf !== d.pf);
    pfMemo[l.id] = l.pf;
    if (l.source.kind === 'calc' && l.P_rated_W !== l.source.value_W) l.source = { kind: 'manual' };
  });
  state.boards.forEach(function (b) {
    if (!b.diversity) b.diversity = { mode: 'table', value: null };
    if (b.diversity.mode !== 'user') b.diversity.value = null;
    else if (!num(b.diversity.value)) b.diversity.value = 0.9;
  });
}

        start: {

                  'Лише один крок: найбільший двигун зони, яку несе джерело, пускається, поки решта навантажень режиму працює. Пускова повна потужність — кратність пускового струму, помножена на номінальну повну потужність, за коефіцієнтом потужності пуску. Провал напруги, час розгону та перехідні процеси генератора не рахуються.',
                  'Nur eine Stufe: der größte Motor im Bereich der Quelle läuft an, während alle übrigen Lasten des Falls laufen. Die Anlaufscheinleistung ist das Anzugsstromverhältnis mal die Bemessungsscheinleistung, beim Anlauf-Leistungsfaktor. Spannungseinbruch, Hochlaufzeit und Generatorübergangsverhalten werden nicht berechnet.',

                  'Tylko jeden stopień: największy silnik w obszarze niesionym przez źródło rusza, gdy pozostałe odbiory danego przypadku pracują. Moc pozorna rozruchu to krotność prądu rozruchowego razy moc pozorna znamionowa, przy współczynniku mocy rozruchu. Zapad napięcia, czas rozbiegu i stany przejściowe generatora nie są liczone.')

          body: T('A UPS sits on the link between a board and its parent: the board behind it contributes its P divided by the inverter efficiency, with Q from the input power factor. The battery energy is P times autonomy divided by the inverter efficiency and the usable fraction of the battery; it is indicative and excludes recharge power.',
                  'ДБЖ стоїть на зв’язку між секцією та її материнською: секція за ним віддає P, поділене на ККД інвертора, а Q бере з коефіцієнта потужності входу. Енергія батареї — P, помножене на час автономії й поділене на ККД інвертора та придатну частку батареї; це орієнтовна величина без потужності заряджання.',
                  'Eine USV liegt auf der Verbindung zwischen einer Schiene und ihrer übergeordneten: die Schiene dahinter liefert ihr P geteilt durch den Wechselrichter-Wirkungsgrad, Q folgt dem Eingangsleistungsfaktor. Die Batterieenergie ist P mal Autonomiezeit geteilt durch Wirkungsgrad und nutzbaren Batterieanteil; sie ist ein Richtwert ohne Ladeleistung.',
                  'Een UPS zit op de verbinding tussen een rail en zijn moederrail: de rail erachter levert zijn P gedeeld door het omvormerrendement, met Q uit de arbeidsfactor van de ingang. De batterijenergie is P maal autonomie gedeeld door rendement en bruikbaar batterijdeel; indicatief, zonder laadvermogen.',
                  'Une ASI est sur la liaison entre un tableau et son amont : le tableau situé derrière remonte son P divisé par le rendement de l’onduleur, avec Q issu du facteur de puissance d’entrée. L’énergie batterie vaut P multiplié par l’autonomie et divisé par le rendement et la fraction utilisable de la batterie ; c’est un ordre de grandeur, sans la puissance de recharge.',
                  'Un SAI está en el enlace entre un cuadro y su cuadro aguas arriba: el cuadro situado detrás aporta su P dividida por el rendimiento del inversor, con Q del factor de potencia de entrada. La energía de batería es P por la autonomía dividida por el rendimiento y la fracción utilizable de la batería; es indicativa y excluye la potencia de recarga.',
                  'UPS znajduje się na połączeniu między rozdzielnicą a nadrzędną: rozdzielnica za nim oddaje swoje P podzielone przez sprawność falownika, a Q wynika ze współczynnika mocy wejścia. Energia baterii to P razy czas podtrzymania podzielone przez sprawność i użyteczną część baterii; jest orientacyjna i pomija moc ładowania.')
        }

    footer: T('P(l,c) = n_run · lf · P_in, Q = P · tan(acos cos φ), S = √(P² + Q²), I = S / (√3 · U) three-phase. Board demand is k · Σ over the running loads and the sub-boards that no source of that case feeds. Start step = k_LR · S_rated of the largest motor ÷ the source rating.',
              'P(l,c) = n_run · lf · P_in, Q = P · tg(arccos cos φ), S = √(P² + Q²), I = S / (√3 · U) для трифазної. Попит секції — k · Σ по працюючих навантаженнях і підсекціях, яких у цьому режимі не живить власне джерело. Пусковий крок = k_LR · S_ном найбільшого двигуна ÷ потужність джерела.',
              'P(l,c) = n_run · lf · P_in, Q = P · tan(arccos cos φ), S = √(P² + Q²), I = S / (√3 · U) dreiphasig. Der Schienenbedarf ist k · Σ über die laufenden Lasten und die Unterverteilungen, die in diesem Fall keine eigene Quelle speist. Anlaufstufe = k_LR · S_bem des größten Motors ÷ Quellenleistung.',
              'P(l,c) = n_run · lf · P_in, Q = P · tan(arccos cos φ), S = √(P² + Q²), I = S / (√3 · U) driefasig. De railvraag is k · Σ over de draaiende belastingen en de onderverdelers die in dat geval geen eigen bron voedt. Aanloopstap = k_LR · S_nom van de grootste motor ÷ het bronvermogen.',
              'P(l,c) = n_run · lf · P_in, Q = P · tan(arccos cos φ), S = √(P² + Q²), I = S / (√3 · U) en triphasé. La puissance appelée d’un tableau vaut k · Σ sur les charges en marche et les tableaux divisionnaires qu’aucune source de ce cas n’alimente. Gradin de démarrage = k_LR · S assignée du plus gros moteur ÷ puissance de la source.',
              'P(l,c) = n_run · lf · P_in, Q = P · tan(arccos cos φ), S = √(P² + Q²), I = S / (√3 · U) en trifásico. La demanda del cuadro es k · Σ sobre las cargas en marcha y los subcuadros que ninguna fuente de ese caso alimenta. Escalón de arranque = k_LR · S asignada del motor mayor ÷ potencia de la fuente.',
              'P(l,c) = n_run · lf · P_in, Q = P · tg(arccos cos φ), S = √(P² + Q²), I = S / (√3 · U) dla trójfazowego. Zapotrzebowanie rozdzielnicy to k · Σ po pracujących odbiorach i rozdzielnicach podrzędnych, których w tym przypadku nie zasila własne źródło. Stopień rozruchu = k_LR · S znamionowa największego silnika ÷ moc źródła.'),

function newLoadRow(rows) {
  var t = 'L-' + (rows.length + 1);
  var o = mkLoad({ id: freeId('LD-', t), tag: t,
                   board_id: state.boards.length ? state.boards[0].id : '',
                   type: 'other', P_rated_W: 1000, qty_installed: 1, qty_duty: 1, category: 'normal' });
  typeMemo[o.id] = o.type; pfMemo[o.id] = o.pf;
  return o;
}
function lfCell(cid) {
  return { key: cid, type: 'number', label: caseLabel(cid), min: 0, max: 1.5, step: 0.05,
           precision: 2, width: 'minmax(0,.7fr)' };
}
var lfRows = [];
var oneLine = null;
function lfMirror() {
  lfRows = state.loads.map(function (l) {
    var r = { id: l.id, tag: l.tag, board: nameOf(l.board_id), flagged: findingWord(l.id) };
    CASE_IDS.forEach(function (c) { r[c] = l.lf[c]; });
    return r;
  });
  return lfRows;
}
function writeLfMirror(rows) {
  var byId = {};
  state.loads.forEach(function (l) { byId[l.id] = l; });
  (rows || []).forEach(function (r) {
    var l = byId[r.id];
    if (!l) return;
    CASE_IDS.forEach(function (c) { if (num(r[c])) l.lf[c] = r[c]; });
  });
}
function divWord(row) {
  var mode = (row.diversity && row.diversity.mode) || 'table';
  var k = last && last.results && last.results.boards[row.id] ? last.results.boards[row.id].k_used : null;
  var name = tx(mode === 'table' ? S.divTableShort : (mode === 'user' ? S.divUser : S.divNone));
  return k === null ? name : name + ' \u00b7 ' + DiagramUI.fmt(k, { precision: 2 });
}
/* The rule ids raised against one row, so a finding is visible beside the load
   it concerns and not only in the findings table. */
function findingWord(id) {
  if (!last) return '';
  var hits = last.findings.filter(function (f) { return f.target === id && SEVERITY[f.rule] !== 'info'; });
  var flag = flagOn(id);
  var out = hits.map(function (f) { return f.rule.slice(6); });
  if (flag) out.push(String(flag.flag));
  return out.join(' ');
}

function splitCsvLine(line) {
  var out = [], cur = '', q = false, i;
  for (i = 0; i < line.length; i++) {
    var ch = line[i];

      else if (ch === '"') q = false;
      else cur += ch;
    } else if (ch === '"') q = true;

  if (head.join(',') !== CSV_HEAD.join(',')) { csvSay(S.csvBad); return; }

  typeMemo = {}; pfMemo = {};

function installData() {

/* ---------------------------------------------------------- Python export */
/* The script carries the state as module constants and re-evaluates the same
   closed forms in the same summation order, so the self-test tolerance is the
   printing tolerance and nothing else. */
function pyLiteral(v) {
  return JSON.stringify(v, function (k, x) { return x === undefined ? null : x; }, 1)
    .replace(/\bnull\b/g, 'None').replace(/\btrue\b/g, 'True').replace(/\bfalse\b/g, 'False');
}
function dgcPython() {
  if (!last) recompute();
  if (last.verdict === 'empty' || last.verdict === 'blocked') {

  }
  var msgs = {};
  Object.keys(RULE_MSG).forEach(function (k) { msgs[k] = RULE_MSG[k].en; });
  var code = PY_SRC.replace('__RULEMSG__', pyLiteral(msgs));
  return {

             deviation: 'none observed; both sides evaluate the same closed forms on the same numbers' },
    scope: 'the complete demand, diversity, source loading, largest-motor start step, UPS loading and battery arithmetic of the list shown at export time, plus the rules LOA-R-001 to 025, 030 to 035, 038 to 044 and 047 and the verdict.',
    covers: ['verdict', 'findings_count', 'findings', 'boards', 'sources', 'ups', 'loads',

             'governing_step', 'governing_step_source', 'governing_step_case'],
    selftest: { tolerance: 1e-9,
                note: 'relative 1e-9, absolute 1e-6 in SI units where the displayed value is zero; the same closed forms are evaluated in the same summation order, so only double-precision printing separates the two' }
  };
}

/* =============================================== 6. the benchmark adapter
   The reference corpus is authored separately from this code, from the public
   specification, and is fetched only when this function is called. */
var BENCH_REF_URL = 'benchmarks/loadlist.reference.json';

function benchState(raw) {

    if (raw[k] !== undefined) s[k] = clone(raw[k]);
  });
  if (Array.isArray(raw.cases) && raw.cases.length) s.cases = normaliseCases(clone(raw.cases));
  s.boards = (s.boards || []).map(function (b) {
    return { id: b.id === undefined ? ('LD-B-' + slug(b.name)) : b.id,
             name: b.name === undefined ? String(b.id) : b.name,
             parent_id: b.parent_id === undefined ? null : b.parent_id,
             ups_id: b.ups_id === undefined ? null : b.ups_id,
             U_V: b.U_V === undefined ? 400 : b.U_V,

             system_id: b.system_id === undefined ? '' : b.system_id,
             package_id: b.package_id === undefined ? '' : b.package_id };
  });
  s.sources = (s.sources || []).map(function (x) {
    return { id: x.id === undefined ? ('LD-S-' + slug(x.name)) : x.id,
             name: x.name === undefined ? String(x.id) : x.name, kind: x.kind, board_id: x.board_id,
             S_rated_VA: x.S_rated_VA,
             cases: Array.isArray(x.cases) ? x.cases.slice()
                  : (x.kind === 'generator' ? ['emergency'] : ['normal', 'peak', 'startup', 'maintenance']),
             start_step_max_frac: x.start_step_max_frac === undefined ? null : x.start_step_max_frac };
  });
  s.ups = (s.ups || []).map(function (u) {
    return { id: u.id === undefined ? ('LD-U-' + slug(u.name)) : u.id,
             name: u.name === undefined ? String(u.id) : u.name,
             S_rated_VA: u.S_rated_VA === undefined ? null : u.S_rated_VA,

             dod: u.dod === undefined ? 0.8 : u.dod };
  });
  /* optional load fields fall back to the type defaults of SPEC 3.8 */
  s.loads = (s.loads || []).map(function (l) {
    var d = TYPE_DEF[l.type] || TYPE_DEF.other;
    var o = {
      id: l.id !== undefined ? l.id : ('LD-' + slug(l.tag)),
      tag: l.tag === undefined ? '' : l.tag,
      description: l.description === undefined ? '' : l.description,
      board_id: l.board_id,
      type: l.type,
      P_rated_W: l.P_rated_W,
      P_basis: l.P_basis === undefined ? d.basis : l.P_basis,
      eta: l.eta === undefined ? d.eta : l.eta,
      pf: l.pf === undefined ? d.pf : l.pf,
      pf_user: l.pf_user === undefined ? false : !!l.pf_user,
      qty_installed: l.qty_installed === undefined ? 1 : l.qty_installed,
      qty_duty: l.qty_duty === undefined ? (l.qty_installed === undefined ? 1 : l.qty_installed) : l.qty_duty,
      category: l.category === undefined ? 'normal' : l.category,
      phases: l.phases === undefined ? 3 : l.phases,
      k_LR: l.k_LR === undefined ? (d.motor ? d.kLR : null) : l.k_LR,
      pf_start: l.pf_start === undefined ? (d.motor ? d.pfs : null) : l.pf_start,
      lf: { normal: 1, peak: 1, startup: 1, emergency: 1, maintenance: 1 },
      system_id: l.system_id === undefined ? '' : l.system_id,
      package_id: l.package_id === undefined ? '' : l.package_id,
      source: l.source === undefined ? { kind: 'manual' } : clone(l.source)
    };
    if (l.lf) CASE_IDS.forEach(function (c) { if (num(l.lf[c])) o.lf[c] = l.lf[c]; });
    if (l.U_V !== undefined) o.U_V = l.U_V;
    else {
      var b = null;
      s.boards.forEach(function (x) { if (x.id === o.board_id) b = x; });
      o.U_V = !b ? 400 : (o.phases === 3 || b.phases === 1 ? b.U_V : Math.round(b.U_V / SQ3));
    }

  });
  return s;
}

function benchOutputs(st, res, pk, sel) {
  var o = { verdict: res.verdict, counts: res.counts,
            findings: res.findings.map(function (f) { return { rule_id: f.rule, target_id: f.target, cases: f.cases.slice() }; }),
            boards: {}, sources: {}, ups: {}, loads: {}, handoff: null, register: null,
            record_is_null: benchRecordIsNull(st, res) };
  /* <rule>.fires: presence of the rule id in the finding set (SPEC 13.2
     "presence/absence per rule id"), exposed for every id the rule table knows
     so a near-miss case can assert absence. */
  var firing = {};
  res.findings.forEach(function (f) { firing[f.rule] = true; });
  Object.keys(SEVERITY).forEach(function (id) { o[id] = { fires: !!firing[id] }; });
  var r = res.results;
  if (r) {
    st.boards.forEach(function (b) {
      var B = r.boards[b.id], dem = {};
      CASE_IDS.forEach(function (c) {
        var d = B.demand[c];
        dem[c] = { P_W: d.P_W, Q_var: d.Q_var, S_VA: d.S_VA, I_A: d.I_A, k: d.k, pf: d.pf };
      });
      o.boards[b.id] = { n_out: B.n_out, k_used: B.k_used, I_feeder_A: B.I_feeder_A, demand: dem };
    });
    st.sources.forEach(function (x) {
      var R = r.sources[x.id], e = { loading: {}, step: {}, S_st_VA: {}, S_ts_VA: {}, loading_start: {}, motor: {} };
      x.cases.forEach(function (c) {
        if (R.loading[c] === undefined) return;
        e.loading[c] = R.loading[c]; e.step[c] = R.step[c]; e.S_st_VA[c] = R.S_st_VA[c];
        e.S_ts_VA[c] = R.S_ts_VA[c]; e.loading_start[c] = R.loading_start[c]; e.motor[c] = R.motor[c];
      });
      o.sources[x.id] = e;
    });
    st.ups.forEach(function (u) {
      var R = r.ups[u.id];
      o.ups[u.id] = { P_max_W: R.P_max_W, S_max_VA: R.S_max_VA, loading: R.loading, E_batt_J: R.E_batt_J };
    });
    st.loads.forEach(function (l) {
      var R = r.loads[l.id];
      o.loads[l.id] = { P_in_W: R.P_in_W, S_rated_VA: R.S_r_VA, I_rated_A: R.I_rated_A, I_design_A: R.I_design_A };
    });
    if (sel) {
      var L2 = null, B2 = null;
      st.loads.forEach(function (l) { if (l.id === sel) L2 = l; });
      st.boards.forEach(function (b) { if (b.id === sel) B2 = b; });
      if (L2) o.handoff = { I: { value: r.loads[L2.id].I_design_A, unit: 'A' }, V_volt: { value: L2.U_V, unit: 'V' } };
      else if (B2) o.handoff = { I: { value: r.boards[B2.id].I_feeder_A, unit: 'A' }, V_volt: { value: B2.U_V, unit: 'V' } };
    }
  }
  if (pk) {
    var reg = benchRegister(st, res, pk);
    o.register = reg;
    o.register.items = reg.map(function (x) { return [x.item_kind, x.id]; });
  }
  return o;
}

/* record() returns null at verdict empty (SPEC 15.7). Exercised through the
   shipping dgcRecord() with the case state swapped in, not restated. */
function benchRecordIsNull(st, res) {
  var keepState = state, keepLast = last, out;
  state = st; last = res;
  try { out = dgcRecord() === null; } finally { state = keepState; last = keepLast; }
  return out;
}

/* The register a Save to project would write for this state, built without
   touching storage so a corpus case can grade it. */
function benchRegister(st, res, pk) {
  var keepState = state, keepLast = last, keepPkg = clone(PKG);
  state = st; last = res;
  PKG.applied = true;
  PKG.held = ((pk && pk.electrical_loads) || []).filter(function (x) {
    return x && ['study', 'board', 'source', 'ups', 'load'].indexOf(String(x.item_kind)) < 0;
  });
  var out;
  try { out = registerOut(); } finally {
    state = keepState; last = keepLast;
    Object.keys(keepPkg).forEach(function (k) { PKG[k] = keepPkg[k]; });
  }
  return out;
}

/* Resolves a dotted check key and reports how far it got, so an absent leaf of
   a container the tool does build ("a null reference means null or absent") is
   separated from a key root this tool has no concept of, which is a defect of
   the adapter and never a pass. */
function benchPath(obj, key) {
  var parts = String(key).replace(/\[(['"]?)([^\]]*?)\1\]/g, '.$2').split('.').filter(function (x) { return x !== ''; });
  var cur = obj, parent = null;
  for (var i = 0; i < parts.length; i++) {
    if (cur === null || cur === undefined) return { value: undefined, parent_ok: false, depth: i };
    parent = cur;
    cur = cur[parts[i]];
  }
  return { value: cur, parent_ok: parent !== null && typeof parent === 'object', depth: parts.length };
}
function findingKey(f) {
  var rule = f.rule_id || f.rule || f[0];
  var target = f.target_id || f.target || f[1];
  var cs = f.cases || f[2] || [];
  return String(rule) + '|' + String(target) + '|' + (Array.isArray(cs) ? cs.join(',') : String(cs));
}
/* A check may name a scalar, an object or a whole register item: numbers are
   compared to the stated tolerance wherever they sit, ids and strings exactly
   (SPEC 13.2). */
function benchCompare(got, ref, tol) {
  var exact = (tol === 'exact' || tol === 'exact-set');
  var obj = (tol && typeof tol === 'object') ? tol : null;
  var rel = exact ? 0 : (obj && obj.rel !== undefined ? obj.rel : 1e-9);
  var abs = exact ? 0 : (obj && obj.abs_if_zero !== undefined ? obj.abs_if_zero
                       : (obj && obj.abs !== undefined ? obj.abs : 1e-6));
  var worst = null, ok = true;
  (function walk(g, r) {
    if (!ok) return;
    if (typeof r === 'number' && isFinite(r)) {
      if (typeof g !== 'number' || !isFinite(g)) { ok = false; return; }
      if (r === 0) { if (Math.abs(g) > abs) ok = false; return; }
      var d = Math.abs(g - r) / Math.abs(r);
      if (worst === null || d > worst) worst = d;
      if (d > rel) ok = false;
      return;
    }
    if (Array.isArray(r)) {
      if (!Array.isArray(g) || g.length !== r.length) { ok = false; return; }
      for (var i = 0; i < r.length; i++) walk(g[i], r[i]);
      return;
    }
    if (r && typeof r === 'object') {
      if (!g || typeof g !== 'object') { ok = false; return; }
      var kr = Object.keys(r).sort(), kg = Object.keys(g).sort();
      if (kr.join(',') !== kg.join(',')) { ok = false; return; }
      kr.forEach(function (k) { walk(g[k], r[k]); });
      return;
    }
    if (g !== r) ok = false;
  })(got, ref);
  return { ok: ok, rel: worst };
}

async function sha256Hex(text) {
  try {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.prototype.map.call(new Uint8Array(buf), function (b) { return (b < 16 ? '0' : '') + b.toString(16); }).join('');
  } catch (e) { return null; }
}

async function benchmarkArtifact() {
  var resp;
  try { resp = await fetch(BENCH_REF_URL, { credentials: 'same-origin', cache: 'no-store' }); }
  catch (e) { throw new Error('Benchmark reference ' + BENCH_REF_URL + ' could not be loaded: ' + (e && e.message || e)); }
  if (!resp.ok) throw new Error('Benchmark reference ' + BENCH_REF_URL + ' could not be loaded: HTTP ' + resp.status);
  var text = await resp.text();
  var digest = await sha256Hex(text);
  var ref = JSON.parse(text);
  var cases = (ref.cases || []).map(function (c) {
    var inp = c.inputs || c;
    var raw = inp.state || inp;
    var st, res, outs, notes = [], cmp = {}, pass = true;
    try {
      st = benchState(raw);
      var pk = inp.package ? { applied: true, project: inp.package.project || null,
                               structure: inp.package.structure || null,
                               calculations: inp.package.calculations || null,
                               electrical_loads: inp.package.electrical_loads || null,
                               flags: inp.package.flags || null } : null;
      res = solve(st, pk);
      outs = benchOutputs(st, res, inp.package || null, inp.select || null);
    } catch (e) {
      notes.push('The adapter could not evaluate this case: ' + (e && e.message || e));
      return { id: c.id, intent: c.intent || '', note: notes.join(' '), ref_source: 'recomputed',
               disputable: !!c.disputable, inputs: inp, cmp: {}, pass: false };
    }
    var checks = c.checks || c.outputs || {};
    Object.keys(checks).forEach(function (k) {
      var spec = checks[k];
      var refv = (spec && typeof spec === 'object' && 'ref' in spec) ? spec.ref : spec;
      var tol = (spec && typeof spec === 'object') ? spec.tol : null;
      var got, r;
      if (k === 'findings') {
        var gset = outs.findings.map(findingKey).sort();
        var rset = (refv || []).map(findingKey).sort();
        got = gset;
        r = { ok: JSON.stringify(gset) === JSON.stringify(rset), rel: null };
        refv = rset;
        if (!r.ok) notes.push('Finding sets differ. Reported: ' + (gset.join(' ') || 'none') + '.');
      } else {
        var hit = benchPath(outs, k);
        got = hit.value;
        if (got === undefined) {
          if (refv === null && hit.parent_ok) got = null;   /* absent == null */
          else {
            notes.push('No output of this tool answers to "' + k + '".');
            cmp[k] = { got: null, ref: refv, tol: tol || 'exact', rel: null, ok: false,
                       ref_source: 'recomputed', unresolved: true };
            pass = false;
            return;
          }
        }
        r = benchCompare(got, refv, tol);
      }
      if (!r.ok) pass = false;
      cmp[k] = { got: got, ref: refv, tol: tol || { rel: 1e-9, abs: 1e-6 }, rel: r.rel, ok: r.ok, ref_source: 'recomputed' };
    });
    if (c.note) notes.unshift(c.note);
    return { id: c.id, intent: c.intent || '', note: notes.join(' '), ref_source: 'recomputed',
             disputable: !!c.disputable, inputs: inp, cmp: cmp, pass: pass };
  });
  var passed = cases.filter(function (c) { return c.pass; }).length;
  var flagged = cases.filter(function (c) { return c.disputable && c.pass; }).length;
  return {
    schema: 'tools.petrov.re/benchmark-artifact/v1',
    tool: 'loadlist',
    file: 'loadlist.html',
    manifest_revision: MANIFEST_REV,
    build: MANIFEST_REV,
    run_at: new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'),
    reference_provenance: 'recomputed',
    provenance_note: 'The reference corpus was authored by another agent from the public specification of this tool and the cited standards, without access to this code; this run recomputes every check from the shipping build.',
    reference: ref.reference || 'independent load-list corpus',
    reference_citations: ref.reference_citations || [],
    tolerance: ref.tolerance || 'relative 1e-9 on every computed quantity, absolute 1e-6 in SI units where the reference is zero; verdicts, finding sets and identifiers exact.',
    total: cases.length,
    passed: passed,
    failed: cases.length - passed,
    flagged: flagged,
    flagged_note: 'Cases the corpus itself marks disputable: the specification admits more than one reading of the target set and the reference states which reading it took. They are counted as passed and listed here so the reading is not buried.',
    cases: cases,
    not_benchmarked: ref.not_benchmarked || {},
    reference_sha256: digest,
    qa: { adapter: { status: 'pass',
                     note: 'Every case is mapped onto the tool state of SPEC section 3 and evaluated with solve(), the same function the interface, the record, the report and the Python export use.' } }
  };
}

/* ---------------------------------------------------------- honest degrade */

   framework that would render the message is absent. installData() still runs

function degrade() {
  document.title = 'diagram-ui.js v1 is required';

                + 'and the limitations are still available from the bar at the bottom of the page.';
  host.appendChild(h);
  host.appendChild(p);
  recompute();
}

function boot() {
  if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1') buildInterface();
  else degrade();
  installData();
}

window.__dgcBenchmark = benchmarkArtifact;
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
