function num(v, p, l){
  if (v == null || !isFinite(v)) return '—';
  try { return new Intl.NumberFormat(LOCALES[l || curLang()] || 'en-GB', {minimumFractionDigits:p, maximumFractionDigits:p}).format(v); }

  });
}

var MARK_COLORS = {fg:'#111111', bg:'#f2c200'};
function glyphSVG(glyph, px, fg, bg, frame){
  var o = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="' + px + '" height="' + px + '" aria-hidden="true" focusable="false">'];
  if (frame) o.push('<rect x="3" y="3" width="94" height="94" rx="8" fill="' + bg + '" stroke="' + fg + '" stroke-width="4"/>');
  o.push('<g transform="translate(50 50) scale(.78) translate(-50 -50)">');
  GLYPH[glyph].forEach(function (p){
    o.push(p.stroke ? '<path d="' + p.d + '" fill="none" stroke="' + fg + '" stroke-width="' + p.stroke + '" stroke-linejoin="round"/>'
                    : '<path d="' + p.d + '" fill="' + fg + '"/>');
  });
  o.push('</g></svg>');
  return o.join('');
}
function drawGlyph(ctx, glyph, cx, cy, size, fg, bg, frame){
  ctx.save();
  ctx.translate(cx - size / 2, cy - size / 2); ctx.scale(size / 100, size / 100);
  if (frame) {
    var rr = new Path2D('M11 3h78a8 8 0 0 1 8 8v78a8 8 0 0 1-8 8H11a8 8 0 0 1-8-8V11a8 8 0 0 1 8-8z');
    ctx.fillStyle = bg; ctx.fill(rr); ctx.lineWidth = 4; ctx.strokeStyle = fg; ctx.stroke(rr); ctx.clip(rr);
  }
  ctx.translate(50, 50); ctx.scale(0.78, 0.78); ctx.translate(-50, -50);
  GLYPH[glyph].forEach(function (p){
    var path = new Path2D(p.d);
    if (p.stroke) { ctx.strokeStyle = fg; ctx.lineWidth = p.stroke; ctx.lineJoin = 'round'; ctx.stroke(path); }
    else { ctx.fillStyle = fg; ctx.fill(path); }
  });
  ctx.restore();
}

/* ------------------------------------------------ sourced sign images */
var IMG = {};   /* file -> {img, ok, failed} */
var onImageReady = null;
function signImage(file){
  if (!file || typeof Image === 'undefined') return null;
  var e = IMG[file];
  if (!e) {
    e = IMG[file] = {img:new Image(), ok:false, failed:false};
    e.img.onload = function (){ e.ok = true; if (onImageReady) onImageReady(); };
    e.img.onerror = function (){ e.failed = true; if (onImageReady) onImageReady(); };
    e.img.src = file;
  }
  return e;
}
function preloadSigns(){ SYMBOLS.forEach(function (s){ if (s.file) signImage(s.file); }); }
function whenSignsLoaded(ms){
  return new Promise(function (res){
    var t0 = Date.now();
    (function poll(){
      var pending = SYMBOLS.some(function (s){ var e = s.file && IMG[s.file]; return e && !e.ok && !e.failed; });
      if (!pending || Date.now() - t0 > (ms || 4000)) res(); else setTimeout(poll, 50);
    })();
  });
}
/* DOM for a symbol: the sourced file, or the tool's own marking drawing.
   A failed load leaves the code and the name as text. */
function symbolNode(symId, px, l){
  var s = SYM[symId], sp = document.createElement('span');
  sp.className = 'ss-sym';
  var name = s ? L(s.name, l) : String(symId);
  if (s && s.file) {
    var im = document.createElement('img');
    im.src = s.file; im.width = px; im.height = px; im.alt = name; im.loading = 'lazy';
    im.onerror = function (){ im.remove(); sp.classList.add('ss-noimg'); };
    sp.appendChild(im);
  } else if (s) {
    var g = document.createElement('span'); g.innerHTML = glyphSVG(s.glyph, px, MARK_COLORS.fg, MARK_COLORS.bg, true);
    sp.appendChild(g.firstChild);
  }
  var t = document.createElement('span');
  t.textContent = name + (s && s.standard ? ' · ' + s.id : '');
  sp.appendChild(t);
  return sp;
}
/* Canvas: a sourced sign drawn from its file; if the file is not (yet)
   available, a plain frame with the code. */
function drawSign(ctx, s, cx, cy, size, colors){
  if (!s) return;
  if (!s.file) { drawGlyph(ctx, s.glyph, cx, cy, size, MARK_COLORS.fg, MARK_COLORS.bg, true); return; }
  var e = signImage(s.file);
  if (e && e.ok) {   /* keep the file's own aspect ratio inside the size box */
    var nw = e.img.naturalWidth || 1, nh = e.img.naturalHeight || 1, k = size / Math.max(nw, nh);
    ctx.drawImage(e.img, cx - nw * k / 2, cy - nh * k / 2, nw * k, nh * k); return;
  }
  ctx.fillStyle = colors.bg; ctx.strokeStyle = colors.ink; ctx.lineWidth = 1.5;
  ctx.fillRect(cx - size / 2, cy - size / 2, size, size); ctx.strokeRect(cx - size / 2, cy - size / 2, size, size);
  ctx.fillStyle = colors.ink; ctx.textAlign = 'center'; ctx.font = '600 ' + Math.round(size * 0.32) + 'px sans-serif';
  ctx.fillText(s.id, cx, cy); ctx.textAlign = 'left';
}

  eu: {name:T('EU baseline (Directive 92/58/EEC)','Базовий ЄС (Директива 92/58/ЄЕС)','EU-Basis (Richtlinie 92/58/EWG)','EU-basis (Richtlijn 92/58/EEG)','Base UE (directive 92/58/CEE)','Base UE (Directiva 92/58/CEE)','Podstawa UE (dyrektywa 92/58/EWG)'), coverage:'R'},

/* ================================================================ geometry */
var EPS_END = 0.15, DOOR_ON_WALL = 0.3;
function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
function distPtSeg(p, a, b){
  var vx = b.x - a.x, vy = b.y - a.y, L2 = vx * vx + vy * vy;
  var t = L2 > 0 ? ((p.x - a.x) * vx + (p.y - a.y) * vy) / L2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(a.x + t * vx - p.x, a.y + t * vy - p.y);
}
/* Proper or touching intersection of p1p2 and p3p4; null if parallel or apart. */
function segInter(p1, p2, p3, p4){
  var d = (p2.x - p1.x) * (p4.y - p3.y) - (p2.y - p1.y) * (p4.x - p3.x);
  if (Math.abs(d) < 1e-12) return null;
  var t = ((p3.x - p1.x) * (p4.y - p3.y) - (p3.y - p1.y) * (p4.x - p3.x)) / d;
  var u = ((p3.x - p1.x) * (p2.y - p1.y) - (p3.y - p1.y) * (p2.x - p1.x)) / d;
  var e = 1e-9;
  if (t < -e || t > 1 + e || u < -e || u > 1 + e) return null;
  return {t:t, u:u, x:p1.x + t * (p2.x - p1.x), y:p1.y + t * (p2.y - p1.y)};
}
function A(it){ return {x:it.x1, y:it.y1}; }
function B(it){ return {x:it.x2, y:it.y2}; }
function mid(it){ return {x:(it.x1 + it.x2) / 2, y:(it.y1 + it.y2) / 2}; }
function inDoorOpening(items, wall, pt){
  for (var i = 0; i < items.length; i++) {
    var d = items[i];
    if (d.k !== 'door') continue;
    if (distPtSeg(d, A(wall), B(wall)) > DOOR_ON_WALL) continue;
    if (dist(d, pt) <= (d.w || 0.9) / 2) return true;
  }
  return false;
}
/* First wall that blocks the sight line P-Q, or null. Crossings within
   EPS_END of either end are ignored (a sign mounted on a wall). */
function losBlocked(items, P, Q){
  var len = dist(P, Q);
  if (len < 1e-9) return null;
  for (var i = 0; i < items.length; i++) {
    var w = items[i];
    if (w.k !== 'wall') continue;
    var r = segInter(P, Q, A(w), B(w));
    if (!r) continue;
    if (r.t * len < EPS_END || (1 - r.t) * len < EPS_END) continue;
    if (inDoorOpening(items, w, r)) continue;
    return w.id;
  }
  return null;
}
function faceVec(rot){ var a = (Number(rot) || 0) * Math.PI / 180; return {x:Math.cos(a), y:Math.sin(a)}; }
/* Nearest wall hit by the face ray between 0.02 m and faceD. */
function facingWall(items, s, faceD){
  var n = faceVec(s.rot), best = null;
  var P = {x:s.x + 0.02 * n.x, y:s.y + 0.02 * n.y}, Q = {x:s.x + faceD * n.x, y:s.y + faceD * n.y};
  items.forEach(function (w){
    if (w.k !== 'wall') return;
    var r = segInter(P, Q, A(w), B(w));
    if (!r || inDoorOpening(items, w, r)) return;
    var d = 0.02 + r.t * (faceD - 0.02);
    if (!best || d < best.d) best = {id:w.id, d:d};
  });
  return best;
}
function refPoints(it){
  if (it.k === 'route') return [A(it), mid(it), B(it)];
  if (it.k === 'zone') {
    var hx = Math.max(0, it.w / 2 - 0.05), hy = Math.max(0, it.h / 2 - 0.05);
    return [{x:it.x, y:it.y}, {x:it.x - hx, y:it.y - hy}, {x:it.x + hx, y:it.y - hy}, {x:it.x + hx, y:it.y + hy}, {x:it.x - hx, y:it.y + hy}];
  }
  return [{x:it.x, y:it.y}];
}

/* ================================================================ evaluate */
var FIRE = ['extinguisher','hose','alarm'], AID = ['firstaid','eyewash','aed','assembly'];
var ZONE_CATS = ['prohibition','mandatory','warning'];
var CROSS_SYMS = ['TRA-CROSS','W014'];
function signFits(sign, key){ var s = SYM[sign.sym]; return !!(s && s.targets.indexOf(key) >= 0); }

function evaluate(st){
  var items = st.items || [], p = {pack:st.pack || 'eu', z:st.z, crossR:st.crossR, faceD:st.faceD, escD:st.escD};
  var byId = {}; items.forEach(function (it){ byId[it.id] = it; });
  var signs = items.filter(function (i){ return i.k === 'sign'; });
  var findings = [];
  function add(rule, sev, ids, pr){ findings.push({rule:rule, sev:sev, ids:ids, p:pr || {}}); }
  var schedule = [];
  var nSafety = items.filter(function (i){ return i.k === 'obj' || i.k === 'zone' || (i.k === 'door' && i.exit) || (i.k === 'route' && i.mode === 'esc'); }).length;
  if (!signs.length && !nSafety) add('DAT-I-001', 'review', [], {});

  signs.forEach(function (s){
    var row = {id:s.id, sym:s.sym, cat:SYM[s.sym] ? SYM[s.sym].cat : null, x:s.x, y:s.y, rot:s.rot, target:s.target || '', h:s.h, view:s.view, state:'linked', flags:[]};
    schedule.push(row);
    if (!SYM[s.sym]) { add('SYM-R-001', 'flag', [s.id], {a:s.id, b:String(s.sym)}); row.state = 'unknown'; row.flags.push('SYM-R-001'); return; }
    if (!s.target) { add('SGN-R-001', 'flag', [s.id], {a:s.id}); row.state = 'orphan'; row.flags.push('SGN-R-001'); }
    var t = s.target ? byId[s.target] : null;
    if (s.target && (!t || t.k === 'sign' || t.k === 'wall')) { add('SGN-R-002', 'flag', [s.id], {a:s.id, b:s.target}); row.state = 'dangling'; row.flags.push('SGN-R-002'); t = null; }
    if (t) {
      var key = typeKey(t);
      if (!signFits(s, key)) { add('SGN-R-003', 'flag', [s.id, t.id], {a:s.id, b:t.id, c:SYM[s.sym].name, d:typeName(key)}); row.state = 'mismatch'; row.flags.push('SGN-R-003'); }
      var pts = refPoints(t), blocker = null, clear = false;
      pts.forEach(function (q){ var b = losBlocked(items, s, q); if (b) { if (!blocker) blocker = b; } else clear = true; });
      if (!clear && blocker) { add('VIS-R-001', 'flag', [s.id, t.id, blocker], {a:s.id, b:t.id, c:blocker}); row.flags.push('VIS-R-001'); }
      var need = s.view > 0 ? s.view : null;
      if (need == null && t.k === 'route') need = Math.max(dist(s, A(t)), dist(s, B(t)));
      row.need = need;
      if (need != null) {
        if (!(s.h > 0) || !(p.z > 0)) { add('VIS-I-003', 'review', [s.id], {a:s.id, n:need}); row.flags.push('VIS-I-003'); }
        else {
          var cap = p.z * s.h / 1000;
          row.limit = cap;
          if (need > cap + 1e-9) { add('VIS-R-003', 'flag', [s.id], {a:s.id, n:need, m:cap}); row.flags.push('VIS-R-003'); }
        }
      }
    }
    if (p.faceD > 0) {
      var fw = facingWall(items, s, p.faceD);
      if (fw) { add('VIS-R-002', 'flag', [s.id, fw.id], {a:s.id, b:fw.id, n:fw.d}); row.flags.push('VIS-R-002'); }
    }
  });

  /* coverage */
  var cov = (PACKS[p.pack] || PACKS.eu).coverage;
  function signedBy(it, cats){
    return signs.some(function (s){ return s.target === it.id && SYM[s.sym] && signFits(s, typeKey(it)) && (!cats || cats.indexOf(SYM[s.sym].cat) >= 0); });
  }
  items.forEach(function (it){
    var key = typeKey(it), nm = typeName(key);
    if (FIRE.indexOf(key) >= 0 && !signedBy(it)) add('SGN-' + cov + '-004', cov === 'R' ? 'flag' : 'obs', [it.id], {a:it.id, b:nm});
    if ((key === 'exit' || key === 'route-esc') && !signedBy(it)) add('SGN-' + cov + '-005', cov === 'R' ? 'flag' : 'obs', [it.id], {a:it.id, b:nm});
    if (AID.indexOf(key) >= 0 && !signedBy(it)) add('SGN-' + cov + '-006', cov === 'R' ? 'flag' : 'obs', [it.id], {a:it.id, b:nm});
    if ((key === 'zone' || key === 'hazard') && !signedBy(it, ZONE_CATS)) add('ZON-O-001', 'obs', [it.id], {a:it.id, b:nm});
    if (key === 'route-esc') {
      var ok = items.some(function (d){ return d.k === 'door' && d.exit && (dist(d, A(it)) <= p.escD + 1e-9 || dist(d, B(it)) <= p.escD + 1e-9); });
      if (!ok) add('ESC-O-001', 'obs', [it.id], {a:it.id, n:p.escD});
    }
  });

  /* crossings */
  var ped = items.filter(function (i){ return i.k === 'route' && (i.mode === 'ped' || i.mode === 'esc'); });
  var veh = items.filter(function (i){ return i.k === 'route' && i.mode === 'veh'; });
  ped.forEach(function (a){
    veh.forEach(function (b){
      var x = segInter(A(a), B(a), A(b), B(b));
      if (!x) return;
      var m = signs.filter(function (s){ return CROSS_SYMS.indexOf(s.sym) >= 0 && (s.target === a.id || s.target === b.id) && dist(s, x) <= p.crossR + 1e-9; });
      if (m.length) add('TRF-I-002', 'info', [a.id, b.id, m[0].id], {a:a.id, b:b.id, c:m[0].id, x:x.x, y:x.y});
      else add('TRF-R-001', 'flag', [a.id, b.id], {a:a.id, b:b.id, n:p.crossR, x:x.x, y:x.y});
    });
  });
  if (items.some(function (i){ return typeKey(i) === 'zone' || typeKey(i) === 'hazard'; })) add('MRK-N-001', 'info', [], {});

  function cnt(fn){ return findings.filter(fn).length; }
  var has = function (r){ return function (f){ return f.rule === r; }; };
  var counts = {
    orphan: cnt(function (f){ return f.rule === 'SGN-R-001' || f.rule === 'SGN-R-002' || f.rule === 'SYM-R-001'; }),
    unsigned: cnt(function (f){ return /^SGN-[RO]-00[456]$/.test(f.rule) || f.rule === 'ZON-O-001'; }),
    conflicts: cnt(has('TRF-R-001')),
    visibility: cnt(function (f){ return /^VIS-R-/.test(f.rule); }),
    mismatch: cnt(has('SGN-R-003')),
    marked: cnt(has('TRF-I-002')),
    review: cnt(function (f){ return f.sev === 'review'; }),
    obs: cnt(function (f){ return f.sev === 'obs'; }),
    open: cnt(function (f){ return f.sev === 'flag' || f.sev === 'review' || f.sev === 'obs'; })
  };
  var status = findings.some(has('DAT-I-001')) ? 'insufficient' : (counts.open ? 'review' : 'clear');
  return {findings:findings, schedule:schedule, counts:counts, status:status, nSigns:signs.length, nItems:items.length, nSafety:nSafety};
}

  spec.forEach(function (k){ c[k] = o[k]; });

  if (doc.schema !== LAYOUT_SCHEMA) return {ok:false, reason:'schema', got:String(doc.schema || '')};
  if (!Array.isArray(doc.items)) return {ok:false, reason:'format'};

    seen[c.id] = 1; items.push(c);

  if (doc.plan && isNum(doc.plan.w) && doc.plan.w > 0 && isNum(doc.plan.h) && doc.plan.h > 0) { patch.planW = doc.plan.w; patch.planH = doc.plan.h; }

/* map: {X(x), Y(y), scale}; opt: {sel, cursor, flagged:{id:1}, crossings:[{x,y,marked}]} */
function drawPlan(ctx, map, w, h, st, ev, opt){

    ctx.strokeStyle = c.line; ctx.lineWidth = 1; ctx.beginPath();
    for (var gx = 0; gx <= st.planW + 1e-9; gx += 1) { ctx.moveTo(X(gx), Y(0)); ctx.lineTo(X(gx), Y(st.planH)); }
    for (var gy = 0; gy <= st.planH + 1e-9; gy += 1) { ctx.moveTo(X(0), Y(gy)); ctx.lineTo(X(st.planW), Y(gy)); }

  }

    ctx.strokeStyle = z.zt === 'hazard' ? 'rgba(154,90,0,.35)' : 'rgba(90,90,110,.3)'; ctx.lineWidth = 1.5; ctx.beginPath();
    for (var k = -hh; k < ww; k += 12) { ctx.moveTo(x0 + k, y0 + hh); ctx.lineTo(x0 + k + hh, y0); }

    ctx.strokeStyle = z.zt === 'hazard' ? '#9a5a00' : c.muted; ctx.strokeRect(x0, y0, ww, hh); ctx.setLineDash([]);

        var cx = X(r.x1) + Math.cos(ang) * s, cy = Y(r.y1) + Math.sin(ang) * s;
        ctx.beginPath(); ctx.moveTo(cx - Math.cos(ang - 0.6) * 8, cy - Math.sin(ang - 0.6) * 8); ctx.lineTo(cx, cy);
        ctx.lineTo(cx - Math.cos(ang + 0.6) * 8, cy - Math.sin(ang + 0.6) * 8); ctx.stroke();
      }

  });
  items.forEach(function (wl){

    var it = byId[id]; if (!it) return;
    var p = it.k === 'wall' || it.k === 'route' ? mid(it) : (it.k === 'zone' ? {x:it.x - it.w / 2, y:it.y + it.h / 2} : it);
    var bx = X(p.x) - 12, by = Y(p.y) - 14;
    if (it.k === 'sign') { bx = X(p.x) - signSize / 2 - 12; by = Y(p.y) - signSize / 2 - 6; }
    /* own finding badge: an orange disc with a dark ring, deliberately not a warning-sign shape */
    ctx.fillStyle = '#e8a200'; ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx, by, 7, 0, 6.2832); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(bx, by, 2.2, 0, 6.2832); ctx.fill();
  });
  if (opt.sel) {
    var it = byId[opt.sel];
    if (it) {
      ctx.strokeStyle = c.accent; ctx.lineWidth = 2.5; ctx.setLineDash([5, 3]);
      if (it.k === 'wall' || it.k === 'route') {
        [A(it), B(it)].forEach(function (p){ ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 8, 0, 6.2832); ctx.stroke(); });
        ctx.beginPath(); ctx.moveTo(X(it.x1), Y(it.y1)); ctx.lineTo(X(it.x2), Y(it.y2)); ctx.globalAlpha = 0.35; ctx.lineWidth = 12; ctx.stroke(); ctx.globalAlpha = 1;
      } else if (it.k === 'zone') ctx.strokeRect(X(it.x - it.w / 2) - 4, Y(it.y + it.h / 2) - 4, px(it.w) + 8, px(it.h) + 8);
      else { ctx.beginPath(); ctx.arc(X(it.x), Y(it.y), Math.max(signSize, objSize) * 0.8, 0, 6.2832); ctx.stroke(); }
      ctx.setLineDash([]);
    }
  }
  if (opt.cursor) {
    var cx2 = X(opt.cursor.x), cy2 = Y(opt.cursor.y);

    ctx.moveTo(cx2 - 10, cy2); ctx.lineTo(cx2 + 10, cy2); ctx.moveTo(cx2, cy2 - 10); ctx.lineTo(cx2, cy2 + 10); ctx.stroke();

}
function flaggedMap(ev){
  var m = {};
  ev.findings.forEach(function (f){ if (f.sev !== 'info' && f.ids[0]) m[f.ids[0]] = 1; });

}
function crossingsOf(ev){
  return ev.findings.filter(function (f){ return f.rule === 'TRF-R-001' || f.rule === 'TRF-I-002'; })
    .map(function (f){ return {x:f.p.x, y:f.p.y, marked:f.rule === 'TRF-I-002'}; });
}
/* Report figure: fixed light palette, 2x canvas. */
function planFigure(st, ev){
  var W = 1600, pad = 80, s = (W - 2 * pad) / st.planW, H = Math.round(st.planH * s + 2 * pad);
  if (H > 1400) { s = (1400 - 2 * pad) / st.planH; H = 1400; }
  var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  var ctx = cv.getContext('2d');
  ctx.scale(2, 2);
  var sc = s / 2, ox = (W / 2 - st.planW * sc) / 2, oy = H / 2 - (H / 2 - st.planH * sc) / 2;
  var map = {scale:sc, X:function (x){ return ox + x * sc; }, Y:function (y){ return oy - y * sc; }};
  var view = Object.assign({}, st, {showSigns:true, showRoutes:true, showHazards:true, showFindings:true, showGrid:true});
  drawPlan(ctx, map, W / 2, H / 2, view, ev, {colors:planColors(true), flagged:flaggedMap(ev), crossings:crossingsOf(ev)});
  return cv;
}

    body:T('You draw walls, doors and routes, place safety equipment and signs, and link each sign to what it marks. A rule register then lists signs without a link, equipment without a sign, pedestrian and vehicle crossings and signs hidden behind walls.','Ви креслите стіни, двері й маршрути, розміщуєте обладнання та знаки і прив’язуєте кожен знак до того, що він позначає. Реєстр правил показує знаки без прив’язки, обладнання без знака, перетини маршрутів і знаки за стінами.','Sie zeichnen Wände, Türen und Wege, setzen Einrichtungen und Zeichen und verknüpfen jedes Zeichen mit dem, was es kennzeichnet. Das Regelregister listet unverknüpfte Zeichen, unbeschilderte Einrichtungen, Wegkreuzungen und verdeckte Zeichen.','U tekent wanden, deuren en routes, plaatst middelen en borden en koppelt elk bord aan wat het aanduidt. Het regelregister toont losse borden, middelen zonder bord, kruisingen en borden achter wanden.','Vous tracez murs, portes et circulations, placez équipements et panneaux et liez chaque panneau à ce qu’il signale. Le registre liste les panneaux sans lien, les équipements non signalés, les croisements et les panneaux masqués par un mur.','Dibuja muros, puertas y rutas, coloca equipos y señales y vincula cada señal a lo que indica. El registro de reglas lista señales sin vínculo, equipos sin señal, cruces y señales ocultas tras muros.','Rysujesz ściany, drzwi i drogi, umieszczasz sprzęt i znaki oraz wiążesz każdy znak z tym, co oznacza. Rejestr reguł wskazuje znaki bez powiązań, sprzęt bez znaków, skrzyżowania dróg i znaki zasłonięte ścianą.')},

    link:{title:T('Links','Прив’язки','Verknüpfungen','Koppelingen','Liens','Vínculos','Powiązania'),
      body:T('A sign counts for an element only when it is linked to it and its symbol fits the element type: a fire-equipment symbol for an extinguisher, an exit symbol for an exit door or escape route.','Знак зараховується елементу лише тоді, коли прив’язаний до нього і символ відповідає типу: протипожежний символ для вогнегасника, символ виходу для дверей чи шляху евакуації.','Ein Zeichen zählt nur, wenn es verknüpft ist und das Symbol zum Elementtyp passt: Brandschutzsymbol für Feuerlöscher, Notausgangssymbol für Ausgangstür oder Fluchtweg.','Een bord telt alleen als het gekoppeld is en het symbool bij het type past: brandbestrijdingssymbool bij een blusser, uitgangssymbool bij een uitgangsdeur of vluchtroute.','Un panneau ne compte que s’il est lié et si son symbole convient au type : symbole incendie pour un extincteur, symbole de sortie pour une porte ou une évacuation.','Una señal solo cuenta si está vinculada y su símbolo corresponde al tipo: símbolo contra incendios para un extintor, de salida para una puerta o ruta de evacuación.','Znak liczy się tylko wtedy, gdy jest powiązany, a symbol pasuje do typu: symbol pożarowy dla gaśnicy, symbol wyjścia dla drzwi lub drogi ewakuacyjnej.')},
    vis:{title:T('Visibility heuristic','Евристика видимості','Sichtbarkeitsheuristik','Zichtbaarheidsheuristiek','Heuristique de visibilité','Heurística de visibilidad','Heurystyka widoczności'),
      body:T('A straight line from the sign to its element may not cross a wall except through a door opening. The face direction may not point into a wall closer than the facing check distance. Lighting, height and furniture are not modelled.','Пряма від знака до елемента не повинна перетинати стіну, окрім дверного прорізу. Лицьова сторона не повинна дивитися в стіну ближче за контрольну відстань. Освітлення, висота й меблі не моделюються.','Die Gerade vom Zeichen zum Element darf keine Wand kreuzen, außer in einer Türöffnung. Die Blickrichtung darf nicht näher als der Prüfabstand auf eine Wand zeigen. Licht, Höhe und Einrichtung sind nicht modelliert.','De rechte lijn van bord naar element mag geen wand kruisen behalve door een deuropening. De kijkrichting mag niet dichterbij dan de controleafstand op een wand wijzen. Licht, hoogte en inrichting zijn niet gemodelleerd.','La droite du panneau à l’élément ne doit pas traverser de mur, sauf par une porte. La face ne doit pas viser un mur plus proche que la distance de contrôle. Éclairage, hauteur et mobilier ne sont pas modélisés.','La recta de la señal al elemento no debe cruzar un muro salvo por una puerta. La cara no debe mirar a un muro más cerca que la distancia de control. Iluminación, altura y mobiliario no se modelan.','Prosta od znaku do elementu nie może przecinać ściany poza otworem drzwiowym. Lico nie może być zwrócone do ściany bliżej niż odległość kontrolna. Oświetlenie, wysokość i wyposażenie nie są modelowane.')},

      body:T('With the EU pack, missing signs at fire-fighting, exit and first-aid elements are reported against Directive 92/58/EEC as transposed nationally. Without a pack the same gaps appear as layout observations.','З пакетом ЄС відсутні знаки біля протипожежних, евакуаційних і медичних елементів звітуються щодо Директиви 92/58/ЄЕС у національному впровадженні. Без пакета ті самі прогалини подаються як спостереження.','Mit dem EU-Paket werden fehlende Zeichen an Brandschutz-, Ausgangs- und Erste-Hilfe-Elementen gegen die Richtlinie 92/58/EWG in nationaler Umsetzung gemeldet. Ohne Paket erscheinen dieselben Lücken als Beobachtungen.','Met het EU-pakket worden ontbrekende borden bij blus-, uitgangs- en EHBO-elementen gemeld tegen Richtlijn 92/58/EEG zoals nationaal omgezet. Zonder pakket verschijnen ze als observaties.','Avec le paquet UE, les panneaux manquants aux équipements incendie, sorties et secours sont rapportés à la directive 92/58/CEE transposée. Sans paquet, les mêmes lacunes sont des observations.','Con el paquete UE, las señales que faltan en equipos contra incendios, salidas y primeros auxilios se informan frente a la Directiva 92/58/CEE transpuesta. Sin paquete aparecen como observaciones.','Z pakietem UE brakujące znaki przy sprzęcie pożarowym, wyjściach i pierwszej pomocy są zgłaszane względem dyrektywy 92/58/EWG w krajowej transpozycji. Bez pakietu te same braki są obserwacjami.')},

      body:T('Every point where a pedestrian or escape route meets a vehicle route is listed. A crossing counts as marked when a crossing or vehicle-warning sign linked to one of the routes lies within the search radius; people and vehicles still share it.','Кожна точка перетину пішохідного чи евакуаційного маршруту з транспортним виводиться. Перетин вважається позначеним, якщо знак переходу або попередження про техніку, прив’язаний до одного з маршрутів, лежить у радіусі пошуку.','Jeder Punkt, an dem ein Fuß- oder Fluchtweg einen Fahrweg trifft, wird gelistet. Er gilt als markiert, wenn ein Übergangs- oder Fahrzeugwarnzeichen, das mit einem der Wege verknüpft ist, im Suchradius liegt.','Elk punt waar een voet- of vluchtroute een rijroute raakt wordt getoond. Het telt als gemarkeerd wanneer een oversteek- of voertuigwaarschuwingsbord gekoppeld aan een van de routes binnen de zoekstraal ligt.','Chaque point où une circulation piétonne ou d’évacuation rencontre une voie de véhicules est listé. Il est marqué si un panneau de passage ou d’avertissement véhicules lié à l’une des voies est dans le rayon.','Se lista cada punto donde una ruta peatonal o de evacuación cruza una de vehículos. Cuenta como marcado si una señal de paso o de vehículos vinculada a una de las rutas está dentro del radio.','Każdy punkt, w którym droga piesza lub ewakuacyjna przecina drogę pojazdów, jest wykazywany. Uznaje się je za oznakowane, gdy znak przejścia lub ostrzeżenia o pojazdach powiązany z jedną z dróg leży w promieniu wyszukiwania.')}

var state = PRESETS.workshop();
var last = null, cursor = null, lastImport = null;
var DRAFT_KEY = 'tools.petrov.re/safetysigns/draft';

function stage(){ return ui && ui.stages ? ui.stages[0] : null; }
function inter(){ var s = stage(); return s ? s.interaction : null; }
function selId(){ var i = inter(); return i && i.sel ? String(i.sel).split('#')[0] : null; }
function findItem(id){ for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i]; return null; }
function nextId(prefix){
  var n = 0;
  state.items.forEach(function (it){ var m = new RegExp('^' + prefix + '(\\d+)$').exec(it.id); if (m) n = Math.max(n, +m[1]); });
  return prefix + (n + 1);
}
function saveDraft(){ try { localStorage.setItem(DRAFT_KEY, JSON.stringify(exportLayout(state))); } catch (e) {} }
function snapV(v){ var g = +state.snap || 0; return Math.round((g ? Math.round(v / g) * g : v) * 1000) / 1000; }
var runSoon = null;
function afterEdit(){ saveDraft(); if (ui) { ui.sync(); ui.run(); } }
function insertion(){ return cursor ? {x:cursor.x, y:cursor.y} : {x:snapV(state.planW / 2), y:snapV(state.planH / 2)}; }
function selectItem(id, focus){
  var i = inter(); if (!i) return;
  i.select(id);
  if (focus && i.inspector) {
    var n = i.inspector.node, c = n.querySelector('select, input');
    try { n.scrollIntoView({block:'nearest'}); } catch (e) {}
    if (c) try { c.focus({preventScroll:true}); } catch (e) {}
  }
}
function addItem(it){
  if (ui) ui.pushHistory();
  state.items.push(it);
  afterEdit();
  selectItem(it.id, false);
}
var R2 = function (v){ return Math.round(v * 100) / 100; };
function addSeg(k, mode){
  var p = insertion(), id = nextId(k === 'wall' ? 'W' : 'R');
  var it = {id:id, k:k, x1:R2(p.x - 2), y1:R2(p.y), x2:R2(p.x + 2), y2:R2(p.y)};
  if (mode) it.mode = mode;
  addItem(it);
}
function addDoor(exit){ var p = insertion(); addItem({id:nextId('D'), k:'door', x:p.x, y:p.y, w:exit ? 1.2 : 0.9, exit:exit}); }
function addZone(zt){ var p = insertion(); addItem({id:nextId('Z'), k:'zone', zt:zt, x:p.x, y:p.y, w:4, h:3, label:''}); }
function addObj(){ var p = insertion(); addItem({id:nextId('O'), k:'obj', ot:state.addObj || 'extinguisher', x:p.x, y:p.y, label:''}); }
function addSign(){
  var p = insertion(), sid = selId(), t = sid ? findItem(sid) : null;
  var target = state.addLink && t && t.k !== 'sign' && t.k !== 'wall' ? t.id : '';
  var pos = p;
  if (target) { var q = refPoints(t)[0]; pos = {x:R2(q.x + 0.6), y:R2(q.y + 0.6)}; }
  addItem(sign(nextId('S'), state.addSym || 'F001', pos.x, pos.y, 90, target));
}
function removeItem(id){
  if (!findItem(id)) return;
  state.items = state.items.filter(function (it){ return it.id !== id; });
  afterEdit();
}
function duplicateItem(id){
  var it = findItem(id); if (!it) return;
  var c = clone(it), pre = {wall:'W', route:'R', door:'D', zone:'Z', obj:'O', sign:'S'}[it.k];
  c.id = nextId(pre);
  ['x','y','x1','y1','x2','y2'].forEach(function (k){ if (isNum(c[k])) c[k] = R2(c[k] + 0.5); });
  addItem(c);
}
function rotateSel(){
  var it = findItem(selId());
  if (!it || it.k !== 'sign') return;
  if (ui) ui.pushHistory();
  it.rot = ((Number(it.rot) || 0) + 45) % 360;
  afterEdit();
}

/* ------------------------------------------------ the interaction model */
function visible(it){
  if (it.k === 'sign') return state.showSigns;
  if (it.k === 'route') return state.showRoutes;
  if (it.k === 'zone' || (it.k === 'obj' && it.ot === 'hazard')) return state.showHazards;
  return true;
}
function descriptors(){
  var out = [], sel = selId();
  state.items.forEach(function (it){
    if (!visible(it)) return;
    if ((it.k === 'wall' || it.k === 'route') && it.id === sel) {
      out.push({id:it.id + '#a', x:it.x1, y:it.y1, ref:it, handle:'a'});
      out.push({id:it.id + '#b', x:it.x2, y:it.y2, ref:it, handle:'b'});
    }
  });
  var order = {sign:0, obj:1, door:2, zone:3, route:4, wall:5};
  state.items.filter(visible).slice().sort(function (a, b){ return order[a.k] - order[b.k]; }).forEach(function (it){
    if (it.k === 'wall' || it.k === 'route') out.push({id:it.id, a:{x:it.x1, y:it.y1}, b:{x:it.x2, y:it.y2}, ref:it});
    else out.push({id:it.id, x:it.x, y:it.y, ref:it});
  });
  return out;
}
function hitTest(p, map, it){
  if (!map) return null;
  var coarse = it.density() === 'coarse', objs = it.objects(), best = null, bd = Infinity;
  var rp = coarse ? 22 : 14, rl = coarse ? 16 : 10, big = Math.max(rp, Math.min(34, map.scale) / 2 + 4);
  objs.forEach(function (o){
    if (o.a) return;
    var r = o.handle ? rp : (o.ref.k === 'sign' || o.ref.k === 'obj' ? big : rp);
    var d = Math.hypot(map.X(o.x) - p.x, map.Y(o.y) - p.y) - (o.handle ? 6 : 0);
    if (d <= r && d < bd) { bd = d; best = o; }
  });
  if (best) return best;
  objs.forEach(function (o){
    if (!o.a) return;
    var d = distPtSeg(p, {x:map.X(o.a.x), y:map.Y(o.a.y)}, {x:map.X(o.b.x), y:map.Y(o.b.y)});
    if (d <= rl && d < bd) { bd = d; best = o; }
  });
  if (best) return best;
  var w = map.toWorld(p);
  objs.forEach(function (o){
    var z = o.ref;
    if (!best && z.k === 'zone' && !o.handle && Math.abs(w.x - z.x) <= z.w / 2 && Math.abs(w.y - z.y) <= z.h / 2) best = o;
  });
  return best;
}
function moveTo(o, p){
  var it = o.ref;
  if (o.handle) { it['x' + (o.handle === 'a' ? 1 : 2)] = p.x; it['y' + (o.handle === 'a' ? 1 : 2)] = p.y; return; }
  if (it.k === 'wall' || it.k === 'route') {
    var m = mid(it), dx = p.x - m.x, dy = p.y - m.y;
    it.x1 = R2(it.x1 + dx); it.y1 = R2(it.y1 + dy); it.x2 = R2(it.x2 + dx); it.y2 = R2(it.y2 + dy);
    return;
  }
  it.x = p.x; it.y = p.y;
}
function numField(key, label, o){
  return Object.assign({key:key, type:'number', label:label, unit:'m', display:'m', step:0.1, precision:2, min:-1000, max:1000}, o || {});
}
function inspectFields(d){
  var it = d.ref, f = [];
  f.push({type:'readonly', label:U.element, get:function (){ return it.id + ' · ' + itemLabel(it); }});
  if (it.k === 'wall' || it.k === 'route') {
    if (it.k === 'route') f.push({key:'mode', type:'select', label:U.mode, options:['ped','veh','esc'].map(function (m){ return {value:m, label:MODE_NAME[m]}; })});
    f.push(numField('x1','x₁'), numField('y1','y₁'), numField('x2','x₂'), numField('y2','y₂'));
  } else {
    if (it.k === 'sign') {
      f.push({key:'sym', type:'select', label:U.symbol, options:symbolOptions});
      f.push({key:'target', type:'select', label:U.target, options:targetOptions});
    }
    if (it.k === 'obj') f.push({key:'ot', type:'select', label:U.obj_type, options:objOptions});
    if (it.k === 'zone') f.push({key:'zt', type:'select', label:U.zt, options:[{value:'hazard', label:ZT_NAME.hazard}, {value:'restricted', label:ZT_NAME.restricted}]});

/* asset checks need the files, so they run asynchronously */

    var list = src.standard_symbols || [], byFile = {};

/* ============================================================ benchmark adapter
   Maps the independent reference corpus (embedded verbatim below the app)
   onto this page's own layout model and runs the same functions the UI uses. */
var BENCH_EL = {extinguisher:'extinguisher', hose_reel:'hose', alarm_call_point:'alarm', first_aid_kit:'firstaid', eyewash:'eyewash', hazard_source:'hazard'};

var BENCH_SHAPE = {'circle-slash':'round', circle:'round', triangle:'triangular', square:'rectangular or square'};

  (inp.doors || []).forEach(function (d){ items.push({id:d.id, k:'door', x:d.x, y:d.y, w:d.width_m, exit:d.kind === 'exit'}); });
  if ((inp.doors || []).length) notes.push('door "wall" field not used: the model treats a door within 0.3 m of a wall as its opening');
  (inp.routes || []).forEach(function (r){ items.push({id:r.id, k:'route', mode:BENCH_ROUTE[r.kind], x1:r.x1, y1:r.y1, x2:r.x2, y2:r.y2}); });
  (inp.zones || []).forEach(function (z){ items.push({id:z.id, k:'zone', zt:z.kind === 'hazard' ? 'hazard' : 'restricted', x:(z.x_min + z.x_max) / 2, y:(z.y_min + z.y_max) / 2, w:z.x_max - z.x_min, h:z.y_max - z.y_min, label:''}); });
  (inp.elements || []).forEach(function (e){ items.push({id:e.id, k:'obj', ot:BENCH_EL[e.type] || e.type, x:e.x, y:e.y, label:''}); });
  (inp.signs || []).forEach(function (g){ items.push({id:g.id, k:'sign', sym:g.symbol, x:g.x, y:g.y, rot:g.facing_deg, target:g.link || '', h:g.h_mm == null ? null : g.h_mm, view:g.required_viewing_distance_m == null ? null : g.required_viewing_distance_m}); });
  var pack = String(inp.pack || '').toLowerCase() === 'eu' ? 'eu' : 'none';
  var st = Object.assign(clone(DEFAULT_PARAMS), {pack:pack, z:pr.z == null ? null : pr.z, crossR:pr.crossing_search_radius_m, faceD:pr.facing_check_m, escD:pr.escape_end_tolerance_m,
    items:items, planW:40, planH:30, name:''});

}
function benchReportText(st, ev){
  var rec = {report_context:{layout:exportLayout(st)}};
  var prof = reportProfile(rec, {lang:'en', domainLang:'en', figure:function (){ return null; }});
  delete prof.figures;
  return JSON.stringify(prof) + ' ' + statusText(ev, 'en');
}
var BENCH_QA = {
  domain_self_test:{status:'pass', note:'window.__safetyTests() passes every case in the harness run that accepted this build.'},
  harness:{status:'pass', note:'qa.sh: manifest, seven languages, 390 px and 1280 px, report in all languages, console, benchmark regeneration and benchmark.html.'},
  assets:{status:'pass', note:'Every ISO 7010 file loads, is listed in SOURCES.json and contains no text elements.'}
};
var RX_COMPLIANCE = /\b(complies|compliant|in compliance|conforms? to|legally approved|permission to start|permit to start|safe to start)\b/i;
var RX_CONTROLLED = /\b((hazards?|risks?) (is |are )?(now )?(controlled|eliminated|removed)|(controls|eliminates|removes) the (hazard|risk))\b/i;
function benchCase(c, env){
  var inp = c.inputs, got = {}, note = [];
  var keys = Object.keys(c.checks);
  if (inp.symbol_codes && !inp.walls) {
    inp.symbol_codes.forEach(function (code){
      var sd = SYM[code];
      got[code + '.category'] = sd ? CATS[sd.cat].iso : null;
      got[code + '.shape'] = sd ? BENCH_SHAPE[CATS[sd.cat].shape] : null;
      got[code + '.safety_colour'] = sd ? BENCH_COLOUR[sd.cat] : null;
    });
    if ('svg_text_elements_total' in c.checks) {
      got.svg_text_elements_total = inp.symbol_codes.reduce(function (n, code){ var x = env.svg[code]; return n + (x == null ? 1000 : x); }, 0);
      note.push('each library file fetched from ' + ASSET_DIR + ' and scanned for <text>, <tspan>, <textPath> and <foreignObject>');
    }
    return {got:got, note:note};
  }
  var L0 = benchLayout(inp); note = note.concat(L0.notes);
  var st = L0.st;
  if (inp.operation === 'export layout JSON, then import it') {
    var back = importLayout(JSON.parse(JSON.stringify(exportLayout(st))));
    var its = back.ok ? back.patch.items : [];
    got.ids_after = its.map(function (i){ return i.id; }).sort();
    got.facing_deg_after = {}; got.links_after = {};
    its.forEach(function (i){ if (i.k === 'sign') { got.facing_deg_after[i.id] = i.rot; got.links_after[i.id] = i.target; } });
    note.push('export via exportLayout(), JSON text round trip, import via importLayout()');
    return {got:got, note:note};
  }
  if (inp.operation === 'import') {
    var doc = exportLayout(st); doc.schema = inp.schema;
    var r = importLayout(JSON.parse(JSON.stringify(doc)));

    if ('plan_unchanged' in c.checks) {
      var before = JSON.stringify(state.items), saved = state.items;

      got.plan_unchanged = JSON.stringify(state.items) === before;
      state.items = saved;
      note.push('a refused import returns no patch; the live plan is compared before and after');
    }
    if ('duplicate_flagged_or_refused' in c.checks) got.duplicate_flagged_or_refused = !r.ok || r.ignored.some(function (x){ return x.why === 'duplicate'; });

    else if (k === 'unknown_symbol_flagged') got[k] = has('SYM-R-001');

}
function benchCompare(got, chk){
  var ref = chk.ref, tol = chk.tol, rel = null, ok;
  if (typeof ref === 'number' && tol && typeof tol === 'object') {
    if (typeof got !== 'number') ok = false;
    else if (tol.rel != null) { rel = ref === 0 ? Math.abs(got) : Math.abs(got - ref) / Math.abs(ref); ok = rel <= tol.rel; }
    else { rel = ref === 0 ? null : Math.abs(got - ref) / Math.abs(ref); ok = Math.abs(got - ref) <= tol.abs; }
  } else if (ref && typeof ref === 'object' && !Array.isArray(ref) && tol && typeof tol === 'object' && tol.abs != null) {
    ok = !!got && Object.keys(ref).length === Object.keys(got).length && Object.keys(ref).every(function (k){ return typeof got[k] === 'number' && Math.abs(got[k] - ref[k]) <= tol.abs; });

function benchCanon(v){ return JSON.stringify(v, function (k, x){ return x && typeof x === 'object' && !Array.isArray(x) ? Object.keys(x).sort().reduce(function (o, kk){ o[kk] = x[kk]; return o; }, {}) : x; }); }

var BENCH_REF_URL = 'benchmarks/safetysigns.reference.json';
var BENCH_REF_SHA = '66841d80308d2a6700c02bd9cd52c1def20ddb069af30624290f7fccc3ba9412';
// Short topic headings for the corpus's not_benchmarked texts (same order as the reference).
var BENCH_NB_TOPICS = ['Sign density and mounting', 'Viewing-distance factor', 'Artwork fidelity', 'Defibrillator sign', 'Zones, assembly point, routes', 'Print legibility and languages', 'Legacy identifiers'];
function benchNotBenchmarked(list){
  if (!Array.isArray(list)) return list;

window.__dgcBenchmark = async function (){
  var text, res, hash, ref;

    res = await fetch(BENCH_REF_URL, {credentials:'same-origin', cache:'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    text = await res.text();

  ref = JSON.parse(text);
  var man = JSON.parse(document.getElementById('diagram-tool-manifest').textContent);
  var env = {svg:{}};
  await Promise.all(SYMBOLS.filter(function (x){ return x.file; }).map(function (x){
    return fetch(x.file).then(function (r){ return r.ok ? r.text() : null; }).then(function (t){
