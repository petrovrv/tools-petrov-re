  "order": 120,
  "title": {"en":"Chemical Storage Compatibility Matrix","uk":"Матриця сумісності зберігання хімічних речовин","de":"Verträglichkeitsmatrix für die Chemikalienlagerung","nl":"Verenigbaarheidsmatrix voor chemicaliënopslag","fr":"Matrice de compatibilité pour le stockage des produits chimiques","es":"Matriz de compatibilidad para el almacenamiento de productos químicos","pl":"Macierz zgodności składowania chemikaliów"},
  "summary": {"en":"Enter substances with hazard codes and a compatibility group; get a pairwise segregation matrix with rule IDs, unresolved pairs and proposed storage groups.","uk":"Введіть речовини з кодами небезпеки та групою сумісності й отримайте попарну матрицю розділення з ID правил, нерозв’язаними парами та запропонованими групами зберігання.","de":"Stoffe mit Gefahrenhinweisen und Verträglichkeitsgruppe eingeben; Ergebnis ist eine paarweise Trennmatrix mit Regel-IDs, ungeklärten Paaren und vorgeschlagenen Lagergruppen.","nl":"Voer stoffen in met gevarencodes en een verenigbaarheidsgroep; u krijgt een paarsgewijze scheidingsmatrix met regel-ID’s, onopgehelderde paren en voorgestelde opslaggroepen.","fr":"Saisissez les substances avec leurs mentions de danger et un groupe de compatibilité ; obtenez une matrice de séparation par paires avec identifiants de règles, paires non résolues et groupes de stockage proposés.","es":"Introduzca sustancias con códigos de peligro y un grupo de compatibilidad; obtenga una matriz de separación por pares con ID de reglas, pares sin resolver y grupos de almacenamiento propuestos.","pl":"Wprowadź substancje z kodami zagrożeń i grupą zgodności; otrzymasz macierz rozdzielenia par z identyfikatorami reguł, parami nierozstrzygniętymi i proponowanymi grupami składowania."},
  "description": {"en":"A screening matrix for packaged chemicals. Each entry carries a name, physical state, CLP/GHS hazard statement codes and a generic compatibility group. A versioned rule pack, loaded from a data file beside the page, maps these to hazard flags and rates every pair as prohibited, segregate, unknown or no modelled conflict, taking the most conservative applicable rule. Entries without a classification, or with contradictory data, are never shown as compatible. Every cell names its rule IDs and their basis. The page proposes storage zones and sub-groups, checks declared co-location and prints the rule pack version in the report.","uk":"Скринінгова матриця для фасованих хімікатів. Кожен запис має назву, агрегатний стан, коди небезпеки CLP/GHS і загальну групу сумісності. Версіонований пакет правил, що завантажується з файлу даних поруч зі сторінкою, перетворює їх на ознаки небезпеки й оцінює кожну пару як «заборонено», «розділити», «невідомо» або «немає модельованого конфлікту», беручи найконсервативніше застосовне правило. Записи без класифікації чи з суперечливими даними ніколи не показуються як сумісні. Кожна клітинка називає ID правил і їхню підставу. Сторінка пропонує зони та підгрупи зберігання, перевіряє задеклароване спільне розміщення та друкує версію пакета правил у звіті.","de":"Eine Screening-Matrix für verpackte Chemikalien. Jeder Eintrag hat Namen, Aggregatzustand, CLP/GHS-Gefahrenhinweise und eine allgemeine Verträglichkeitsgruppe. Ein versioniertes Regelpaket aus einer Datendatei neben der Seite ordnet diesen Gefahrenmerkmale zu und bewertet jedes Paar als verboten, trennen, unbekannt oder ohne modellierten Konflikt, wobei die strengste zutreffende Regel gilt. Einträge ohne Einstufung oder mit widersprüchlichen Angaben erscheinen nie als verträglich. Jede Zelle nennt ihre Regel-IDs und deren Grundlage. Die Seite schlägt Lagerzonen und Untergruppen vor, prüft angegebene gemeinsame Lagerorte und druckt die Version des Regelpakets in den Bericht.","nl":"Een screeningsmatrix voor verpakte chemicaliën. Elke invoer heeft een naam, aggregatietoestand, CLP/GHS-gevarenaanduidingen en een algemene verenigbaarheidsgroep. Een geversioneerd regelpakket, geladen uit een gegevensbestand naast de pagina, zet deze om in gevarenkenmerken en beoordeelt elk paar als verboden, scheiden, onbekend of zonder gemodelleerd conflict, volgens de strengste toepasselijke regel. Invoeren zonder indeling of met tegenstrijdige gegevens worden nooit als verenigbaar getoond. Elke cel noemt haar regel-ID’s en hun grondslag. De pagina stelt opslagzones en subgroepen voor, controleert opgegeven gezamenlijke locaties en drukt de versie van het regelpakket af in het rapport.","fr":"Une matrice de criblage pour produits chimiques conditionnés. Chaque entrée comporte un nom, un état physique, des mentions de danger CLP/SGH et un groupe de compatibilité générique. Un jeu de règles versionné, chargé depuis un fichier de données à côté de la page, les traduit en indicateurs de danger et classe chaque paire comme interdite, à séparer, inconnue ou sans conflit modélisé, en retenant la règle applicable la plus prudente. Une entrée non classée ou contradictoire n’apparaît jamais comme compatible. Chaque cellule nomme ses identifiants de règles et leur base. La page propose des zones et sous-groupes de stockage, vérifie les cohabitations déclarées et imprime la version du jeu de règles dans le rapport.","es":"Una matriz de cribado para productos químicos envasados. Cada entrada lleva nombre, estado físico, indicaciones de peligro CLP/SGA y un grupo de compatibilidad genérico. Un paquete de reglas versionado, cargado desde un archivo de datos junto a la página, los convierte en indicadores de peligro y califica cada par como prohibido, a separar, desconocido o sin conflicto modelado, aplicando la regla más conservadora. Las entradas sin clasificación o con datos contradictorios nunca aparecen como compatibles. Cada celda indica sus ID de regla y su base. La página propone zonas y subgrupos de almacenamiento, comprueba la ubicación conjunta declarada e imprime la versión del paquete en el informe.","pl":"Macierz przesiewowa dla chemikaliów w opakowaniach. Każdy wpis ma nazwę, stan skupienia, kody zwrotów zagrożenia CLP/GHS i ogólną grupę zgodności. Wersjonowany pakiet reguł, wczytywany z pliku danych obok strony, przekłada je na znaczniki zagrożeń i ocenia każdą parę jako zakazaną, do rozdzielenia, nieznaną lub bez modelowanego konfliktu, stosując najostrożniejszą regułę. Wpisy bez klasyfikacji lub ze sprzecznymi danymi nigdy nie są pokazywane jako zgodne. Każda komórka podaje identyfikatory reguł i ich podstawę. Strona proponuje strefy i podgrupy składowania, sprawdza zadeklarowane wspólne miejsca i drukuje wersję pakietu reguł w raporcie."},
  "status": "benchmarked",
  "independent_validation": false,
  "limitations": {"en":"Advisory screening at hazard-group level. It does not replace supplier SDS sections 7 and 10 or a review by a competent chemical-safety specialist, and no such specialist has reviewed the rule pack. No reaction thermodynamics, no quantities, no national segregation distances or quantity limits, and no product-specific incompatibility beyond the modelled flags. Explosives, self-reactive substances and unrecognised hazard codes are left for specialist review.","uk":"Дорадчий скринінг на рівні груп небезпеки. Не замінює розділів 7 і 10 SDS постачальника чи перевірки компетентним фахівцем з хімічної безпеки; такий фахівець пакет правил не перевіряв. Без термодинаміки реакцій, кількостей, національних відстаней розділення чи граничних кількостей і без специфічних для продукту несумісностей понад модельовані ознаки. Вибухові, самореактивні речовини та нерозпізнані коди небезпеки залишено для фахової перевірки.","de":"Beratendes Screening auf Ebene von Gefahrengruppen. Es ersetzt weder die Abschnitte 7 und 10 des Lieferanten-SDB noch die Prüfung durch eine fachkundige Person für Chemikaliensicherheit; eine solche Prüfung des Regelpakets liegt nicht vor. Keine Reaktionsthermodynamik, keine Mengen, keine nationalen Trennabstände oder Mengengrenzen und keine produktspezifischen Unverträglichkeiten über die modellierten Merkmale hinaus. Explosivstoffe, selbstzersetzliche Stoffe und unbekannte Gefahrencodes bleiben der Fachprüfung überlassen.","nl":"Adviserende screening op het niveau van gevarengroepen. Vervangt niet rubriek 7 en 10 van het VIB van de leverancier of een beoordeling door een deskundige chemische veiligheid; een dergelijke beoordeling van het regelpakket is er niet. Geen reactiethermodynamica, geen hoeveelheden, geen nationale scheidingsafstanden of hoeveelheidsgrenzen en geen productspecifieke onverenigbaarheden buiten de gemodelleerde kenmerken. Explosieven, zelfontledende stoffen en onbekende gevarencodes blijven voor specialistische beoordeling.","fr":"Criblage consultatif au niveau des groupes de danger. Il ne remplace ni les sections 7 et 10 de la FDS du fournisseur ni l’examen par un spécialiste compétent en sécurité chimique, et aucun spécialiste n’a examiné le jeu de règles. Pas de thermodynamique des réactions, pas de quantités, pas de distances de séparation ni de seuils nationaux, pas d’incompatibilité propre à un produit au-delà des indicateurs modélisés. Explosifs, substances autoréactives et codes de danger non reconnus relèvent d’un avis spécialisé.","es":"Cribado orientativo a nivel de grupos de peligro. No sustituye las secciones 7 y 10 de la FDS del proveedor ni la revisión por un especialista competente en seguridad química, y ningún especialista ha revisado el paquete de reglas. Sin termodinámica de reacciones, sin cantidades, sin distancias de separación ni límites nacionales de cantidad y sin incompatibilidades propias de un producto más allá de los indicadores modelados. Explosivos, sustancias autorreactivas y códigos de peligro no reconocidos quedan para revisión especializada.","pl":"Doradcza ocena przesiewowa na poziomie grup zagrożeń. Nie zastępuje sekcji 7 i 10 karty SDS dostawcy ani oceny kompetentnego specjalisty ds. bezpieczeństwa chemicznego; żaden specjalista nie sprawdził pakietu reguł. Bez termodynamiki reakcji, ilości, krajowych odległości rozdzielenia i limitów ilościowych oraz bez niezgodności specyficznych dla produktu poza modelowanymi znacznikami. Materiały wybuchowe, substancje samoreaktywne i nierozpoznane kody zagrożeń pozostawiono do oceny specjalisty."},
  "intended_use": "preliminary assessment",
  "catalog_languages": ["en","uk","de","nl","fr","es","pl"],
  "tool_languages": ["en","uk","de","nl","fr","es","pl"],
  "dependencies": ["chemicalstorage-rules.json", "chemicalstorage-assets/", "benchmarks/chemicalstorage.reference.json"],
  "network_access": {"mode":"same-origin-data","note":"Fetches only chemicalstorage-rules.json (the versioned rule pack) and loads the GHS pictogram SVG files from chemicalstorage-assets/ on this site; window.__dgcBenchmark() alone fetches benchmarks/chemicalstorage.reference.json from the same site. Inventory data stay in the browser; nothing is transmitted."},
  "validation": {"basis":{"en":"Rule-by-rule self-tests of the page's own rule engine (window.__safetyTests): every rule ID, boundary, negative and insufficient-data cases, symmetry and state round trip. Pair rules rest on general reaction chemistry and on the pack's conservative policy. No golden matrix reviewed by a chemical-safety specialist exists yet.","uk":"Самоперевірки власного рушія правил сторінки за кожним правилом (window.__safetyTests): кожен ID правила, граничні, негативні випадки й випадки нестачі даних, симетрія та збереження стану. Парні правила спираються на загальну хімію реакцій і консервативну політику пакета. Еталонної матриці, перевіреної фахівцем з хімічної безпеки, ще немає.","de":"Regelweise Selbsttests der eigenen Regelmaschine der Seite (window.__safetyTests): jede Regel-ID, Grenz-, Negativ- und Datenmangelfälle, Symmetrie und Zustands-Rundreise. Paarregeln beruhen auf allgemeiner Reaktionschemie und der vorsichtigen Grundhaltung des Pakets. Eine von einer Fachperson geprüfte Referenzmatrix gibt es noch nicht.","nl":"Zelftests per regel van de eigen regelmotor van de pagina (window.__safetyTests): elke regel-ID, grens-, negatieve en gegevenstekortgevallen, symmetrie en toestandsrondreis. Paarregels berusten op algemene reactiechemie en het voorzichtige beleid van het pakket. Een door een specialist beoordeelde referentiematrix bestaat nog niet.","fr":"Autotests règle par règle du moteur de règles de la page (window.__safetyTests) : chaque identifiant de règle, cas limites, négatifs et de données insuffisantes, symétrie et aller-retour d’état. Les règles de paires reposent sur la chimie réactionnelle générale et la politique prudente du jeu. Aucune matrice de référence examinée par un spécialiste n’existe encore.","es":"Autopruebas regla por regla del motor de reglas de la página (window.__safetyTests): cada ID de regla, casos límite, negativos y de datos insuficientes, simetría e ida y vuelta del estado. Las reglas de pares se basan en la química de reacciones general y en la política conservadora del paquete. Aún no existe una matriz de referencia revisada por un especialista.","pl":"Autotesty reguła po regule własnego silnika reguł strony (window.__safetyTests): każdy identyfikator reguły, przypadki graniczne, negatywne i braku danych, symetria oraz odtworzenie stanu. Reguły par opierają się na ogólnej chemii reakcji i ostrożnej polityce pakietu. Macierzy wzorcowej sprawdzonej przez specjalistę jeszcze nie ma."},"independent_validation":false,"benchmarks":[{"id": "chemicalstorage-independent-reference-2026-09-16", "reference": "Pairwise-outcome corpus for a hazard-group chemical storage compatibility matrix. Each case lists a small inventory (name, physical state, CLP/GHS hazard statement codes, optional generic group meaning, optional location) and the expected matrix cell(s) in the README vocabulary X (prohibited together) / S (segregate) / U (unknown - review SDS) / C (no modelled conflict), or a boolean property (not C / not X) where the sources establish only that a pair reacts or must be separated. Expectations come from the CLP hazard-statement texts (EUH031/EUH032/EUH014/H26x/H27x), HSE HSG71 paras 71, 73, 120, the EPA-600/2-80-076 compatibility chart as transcribed by NIH ORF and Rutgers REHS and explained in WIPP Addendum B2, and the acceptance criteria of spec 11 / 00-common (unknown never safe, no inference from product name, symmetry, non-transitivity, rule id per cell, pack version in report). Stated mapping principle: fire, explosion, toxic/flammable gas or 'do not mix' -> X; heat or innocuous gas only -> S. Four randomized inventories (seed 20260916, n = 6/12/20/30) are generated by ref.py. 'group' values are generic meanings the harness maps to the tool's nearest group; null means no group chosen.", "citations": ["Regulation (EC) No 1272/2008 (CLP) Annex III hazard statements, texts as reproduced on EU SAMANCTA 'H/P phrases', https://sampling-manual-customs-taxation.ec.europa.eu/health-and-safety/hazardous-substances/hazard-symbols/hp-phrases_en (H200, H220, H224-H228, H240-H242, H250, H260, H261, H270-H272, H280, H290, H314, EUH001, EUH014, EUH019, EUH031, EUH032, EUH044)", "HSE HSG71 Chemical warehousing: The storage of packaged dangerous substances (2009), https://www.hse.gov.uk/pubns/priced/hsg71.pdf, paras 71, 73, 109, 116, 120 (Table 2 cells not used)", "Hatayama H.K. et al., A Method for Determining the Compatibility of Hazardous Wastes, EPA-600/2-80-076, April 1980; chart as reproduced at https://orf.od.nih.gov/EnvironmentalProtection/WasteDisposal/Documents/chemical_waste_chemical_compatibility_chart.pdf and https://construction.rutgers.edu/rehs/chemical-compatibilty-chart-epa (groups 1, 2, 10, 11, 30, 33, 101, 102, 104, 107)", "WIPP Hazardous Waste Facility Permit renewal application, Addendum B2 Chemical Compatibility Analysis (2009), https://www.wipp.energy.gov/library/rcrapermit/WIPP_HWFP%20Renewal%20Application_4_09/156%20Addendum%20B2%204-19-09%20Version%200.1.pdf (explanations for 1x104, 101x104, 104x107)", "Los Angeles County Fire Dept. HHMD fact sheet 'Separation of Incompatible Chemicals' (04/15), https://fire.lacounty.gov/wp-content/uploads/2019/08/HHMD-Fact-Sheet-Separation-of-Incompatible-Chemicals.pdf (context: families to separate)", "tools.petrov.re spec 11 Chemical Compatibility & Storage Matrix (MVP, model rules, results, QA, acceptance criteria) and spec 00-common section 0.5", "Case generator and count/property evaluator: bench/chemicalstorage/ref.py (stdlib, seed 20260916)"], "cases": 53, "passed": 53, "tolerance": "All checks are categorical or integer and compared exactly: the tool is a rule engine with no numerical model, so there is no physical scale to set a tolerance from. Two non-scalar forms are used in the inventory cases: 'exact-subset' (every listed pair must have the stated cell; unlisted pairs are unconstrained because no source was read for them) and 'lower-bound' (count must be at least ref). Where the sources establish only a reaction or a separation duty, the check is the boolean 'not C' rather than a guessed X/S/U.", "run_at": "2026-09-16T11:31:20.977Z", "artifact": "benchmarks/chemicalstorage.json"}]},
  "report": {"pdf": true, "source_attribution": true},
  "python_export": {"supported": false, "reason": "Rule engine over a shipped data pack; there is no numerical model to reproduce in a script."},
  "handoff": {"provides":[],"accepts":[]},
  "state_codec": {"permalink": true, "record": "tools.petrov.re/calculation-record/v1"},

}

.cs-pics img{display:block}

.cs-matrix th.cs-ch .cs-pics{flex-direction:column;margin-top:3px}
.cs-fail{padding:12px;border:1px solid var(--bad,#a22);border-radius:8px;color:var(--bad,#a22);background:var(--bad-bg,#fee)}

  function has(arr, x) { return arr.indexOf(x) >= 0; }

  /* Validate a rule pack; returns a list of problems (empty = usable). */
  function validatePack(p) {
    var err = [];
    if (!p || typeof p !== 'object') return ['not an object'];

      });

    });
    lines.push(q(tr('packNote', l, { p: last.pack.id, v: last.pack.version, j: last.pack.jurisdiction })));

  /* matrix figure for the report: numbers and symbols only */
  function matrixSvg() {
    if (!last || last.n < 2) return null;
    var n = last.n, cell = 26, pad = 30, W = pad + n * cell + 6, H = pad + n * cell + 6;
    var col = { X: ['#fbe4e2', '#a5261f'], S: ['#fbefdc', '#9a5a00'], U: ['#ffffff', '#3763e6'], C: ['#ffffff', '#8a94a3'] };
    var o = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" font-family="Arial,sans-serif">'];
    for (var i = 0; i < n; i++) {
      o.push('<text x="' + (pad + i * cell + cell / 2) + '" y="' + (pad - 10) + '" text-anchor="middle" font-size="11" fill="#333">' + (i + 1) + '</text>');
      o.push('<text x="' + (pad - 8) + '" y="' + (pad + i * cell + cell / 2 + 4) + '" text-anchor="end" font-size="11" fill="#333">' + (i + 1) + '</text>');
    }
    last.cls.forEach(function (ca, i) {
      last.cls.forEach(function (cb, j) {
        var x = pad + j * cell + 1, y = pad + i * cell + 1, w = cell - 2;
        if (i === j) {
          o.push('<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + w + '" fill="#eef0f3" stroke="#c9d0d9" stroke-width="1"/>');
          return;
        }
        var p = last.grid[pairKey(ca.id, cb.id)], c = col[p.result];
        o.push('<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + w + '" rx="3" fill="' + c[0] + '" stroke="' + c[1] + '" stroke-width="1"' + (p.result === 'U' ? ' stroke-dasharray="3 2"' : '') + '/>');
        o.push('<text x="' + (x + w / 2) + '" y="' + (y + w / 2 + 5) + '" text-anchor="middle" font-size="14" font-weight="700" fill="' + c[1] + '">' + GLYPH[p.result] + (p.exception ? '*' : '') + '</text>');
      });
    });
    o.push('</svg>');
    return o.join('');
  }

  function reportProfile(rec, ctx) {
    var l = (ctx && ctx.domainLang) || lang();

    var status = { fail: 'fail', attention: 'attention', info: 'info' };

    var srcList = [], srcIx = {};
    var srcRef = function (b) {
      var k = [b.kind, b.source, b.jurisdiction, b.version].join('|');
      if (!srcIx[k]) { srcList.push(b); srcIx[k] = 'B' + srcList.length; }
      return srcIx[k];
    };
    last.used.forEach(function (id) { if (IX.rule[id]) srcRef(IX.rule[id].basis); });
    var checks = last.findings.map(function (f) {
      var r = IX.rule[f.rule] || {};
      var subj = f.kind === 'none' ? '' : (f.kind === 'pair' ? tr('subjPairs', l) : tr('subjEntries', l)) + ': ' + subjectText(f, l, true);
      return { status: status[f.status], title: f.rule + ' — ' + ruleText(f.rule, l), detail: subj,
        basis: kindText((r.basis || {}).kind, l) + ' [' + srcRef(r.basis || {}) + ']' };
    });
    var inv = state.substances.map(function (s, i) {
      var c = last.cls[i];
      return [String(i + 1), s.name || '—', s.state ? tr('st_' + s.state, l) : tr('stNone', l), groupText(s.group, l),
        s.codes || '—', s.loc || '—', c.unresolved.length ? '? ' + c.unresolved.join(' ') : zoneText(c.zone, l, c.sub, (last.zones.filter(function (z) { return z.zone === c.zone; })[0] || { subs: [] }).subs.length)];
    });
    var pairRows = last.X.concat(last.U, last.S).map(function (p) {
      var a = last.num[p.a], b = last.num[p.b];
      return [(a < b ? a + ' ↔ ' + b : b + ' ↔ ' + a), GLYPH[p.result] + ' ' + levelText(p.result, l), p.rules.map(function (x) { return x.id; }).join(', ')];
    });
    var zoneRows = [], seenZ = {};
    last.groups.forEach(function (g) {

      zoneRows.push([zoneText(g.zone, l, g.sub, g.of), g.members.map(function (m) { return last.num[m]; }).join(', '),
        seenZ[g.zone] ? '〃' : (z ? loc(z.note, l) : '')]);

    });
    var ruleRows = last.used.filter(function (id) { return IX.rule[id]; }).map(function (id) {

    var srcRows = srcList.map(function (b, i) {

    var excRows = state.exceptions.map(function (e) {

    });
    var fig = matrixSvg();

          : '<span style="border:1px solid #a5261f;padding:0 1mm;margin-right:1.5mm;font-size:8pt">' + p + '</span>';
      }).join('');
      var esc = function (x) { return String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
      picApps.push({ html: '<div style="display:flex;align-items:center;gap:3mm;padding:1mm 0;border-bottom:.2mm solid #d9dee5;break-inside:avoid;font-size:9pt">' +
        '<span style="width:7mm;font-weight:600">' + (i + 1) + '</span><span style="flex:0 0 58mm">' + (imgs || '<span style="color:#666">' + esc(tr('noPicto', l)) + '</span>') + '</span>' +
        '<span style="flex:1 1 auto">' + esc(ps.join(', ') || '—') + ' · ' + esc(s.codes || '—') + '</span></div>' });
    });
    if (picApps.length) { picApps[0].title = tr('rPicto', l); picApps.push({ notes: [tr('pictoNote', l)] }); }
    var apps = [
      { title: tr('rInventory', l), head: S.invHead[li(l)],

    if (pairRows.length) apps.push({ title: tr('rPairs', l), head: [tr('cPair', l), tr('cResult', l), tr('cRules', l)], cols: '.6fr 1fr 1.6fr', rows: pairRows });

    if (excRows.length) apps.push({ title: tr('rExc', l), head: [tr('cPair', l), tr('excTo', l), tr('cSource', l), tr('cRule', l)], cols: '.6fr .9fr 1.6fr .8fr', rows: excRows });
    apps.push({ title: tr('rPack', l), cols: '1fr 2fr', rows: [

      [tr('pSchema', l), IX.pack.schema], [tr('pPrec', l), tr('precText', l)]
    ], notes: [IX.pack.note] });

        results: [

  /* ======================================================= 4. self-tests
     They call the same functions the interface uses. */
  function selfTests() {
    var out = [];
    var T0 = function (id, rule, kind, name, got, expected, pass) {
      out.push({ id: id, rule: rule, kind: kind, name: name, got: got, expected: expected,
        pass: pass === undefined ? JSON.stringify(got) === JSON.stringify(expected) : !!pass });
    };
    if (!IX) { T0('pack-loaded', null, 'setup', 'rule pack loaded', packError, 'loaded', false); return out; }
    var mk = function (id, group, st, codes, loc) { return { id: id, name: '', group: group || '', state: st, codes: codes || '', loc: loc || '' }; };
    var pr = function (a, b, exc) {
      var ca = classify(a, IX), cb = classify(b, IX);
      return evalPair(ca, cb, IX, exc || {});
    };
    var ids = function (p) { return p.rules.map(function (x) { return x.id; }); };
    var L_ = 'liquid', So = 'solid', G = 'gas';
    /* pack integrity */
    var perr = validatePack(IX.pack);
    T0('pack-valid', null, 'data', 'shipped rule pack passes validation', perr, []);
    var missing = [];
    IX.pack.pair_rules.concat(IX.pack.policy_rules).forEach(function (r) {
      LANGS.forEach(function (lg) { if (!r.text[lg]) missing.push(r.id + ':' + lg); });
    });
    IX.pack.groups.forEach(function (g) { LANGS.forEach(function (lg) { if (!g.label[lg]) missing.push(g.id + ':' + lg); }); });
    IX.pack.zones.forEach(function (z) { LANGS.forEach(function (lg) { if (!z.label[lg] || !z.note[lg]) missing.push(z.id + ':' + lg); }); });
    Object.keys(IX.pack.flags).forEach(function (f) { LANGS.forEach(function (lg) { if (!IX.pack.flags[f][lg]) missing.push(f + ':' + lg); }); });
    T0('pack-langs', null, 'data', 'every pack text exists in seven languages', missing, []);
    var kindsMixed = IX.pack.pair_rules.concat(IX.pack.policy_rules).filter(function (r) { return typeof r.basis.kind !== 'string' || !has(KINDS, r.basis.kind); }).map(function (r) { return r.id; });
    T0('pack-kinds', null, 'data', 'each rule has exactly one basis kind', kindsMixed, []);
    var badPack = validatePack({ schema: 'something/else', pack_id: 'x', version: '1' });
    T0('pack-refuse-schema', null, 'negative', 'a pack with a wrong schema is refused', badPack.length > 0, true);
    var dup = JSON.parse(JSON.stringify(IX.pack)); dup.pair_rules.push(dup.pair_rules[0]);
    T0('pack-refuse-dup', null, 'negative', 'a pack with a duplicate rule id is refused', validatePack(dup).some(function (e) { return /duplicate/.test(e); }), true);

    /* pair rules, one positive case each */
    var cases = [
      ['CHEM-P-001', mk('a', 'OX', So, 'H272'), mk('b', 'FL', L_, 'H225'), 'X'],
      ['CHEM-P-002', mk('a', 'OX', So, 'H272'), mk('b', 'CO', L_, ''), 'S'],
      ['CHEM-P-003', mk('a', 'MA', L_, 'H314'), mk('b', 'BA', L_, 'H314'), 'S'],
      ['CHEM-P-004', mk('a', 'MA', L_, 'H314'), mk('b', 'CY', So, 'H300, EUH032'), 'X'],
      ['CHEM-P-005', mk('a', 'MA', L_, 'H314'), mk('b', 'HY', L_, 'H314, EUH031'), 'X'],
      ['CHEM-P-006', mk('a', 'WR', So, 'H260'), mk('b', 'MA', L_, 'H314'), 'X'],
      ['CHEM-P-007', mk('a', 'WR', So, 'H261'), mk('b', 'NR', L_, ''), 'S'],
      ['CHEM-P-008', mk('a', 'PY', So, 'H250'), mk('b', 'NR', So, ''), 'S'],
      ['CHEM-P-009', mk('a', 'PX', L_, 'H242'), mk('b', 'BA', L_, 'H314'), 'X'],
      ['CHEM-P-010', mk('a', 'PX', L_, 'H242'), mk('b', 'NR', So, ''), 'S'],
      ['CHEM-P-011', mk('a', 'IG', G, 'H280'), mk('b', 'MA', L_, 'H314'), 'S'],
      ['CHEM-P-012', mk('a', 'IG', G, 'H280'), mk('b', 'FL', L_, 'H225'), 'S'],
      ['CHEM-P-013', mk('a', 'TX', So, 'H301'), mk('b', 'FL', L_, 'H225'), 'S'],
      ['CHEM-P-014', mk('a', 'CY', So, 'H300, EUH032'), mk('b', 'OX', So, 'H272'), 'S'],
      ['CHEM-P-015', mk('a', 'MA', L_, 'H314'), mk('b', 'OX', So, 'H272'), 'X']
    ];
    cases.forEach(function (c) {
      var p = pr(c[1], c[2]), q = pr(c[2], c[1]);
      T0(c[0] + '-hit', c[0], 'positive', c[0] + ' applies and gives ' + c[3], { result: p.result, hit: has(ids(p), c[0]) }, { result: c[3], hit: true });
      T0(c[0] + '-sym', c[0], 'symmetry', c[0] + ' result is independent of order', q.result, p.result);
    });
    /* negative and boundary cases */
    T0('neg-FLxFL', 'CHEM-C-000', 'negative', 'two flammable liquids: no rule, C-000 named', { r: pr(mk('a', 'FL', L_, 'H225'), mk('b', 'FL', L_, 'H226')).result, ids: ids(pr(mk('a', 'FL', L_, 'H225'), mk('b', 'FL', L_, 'H226'))) }, { r: 'C', ids: ['CHEM-C-000'] });
    T0('neg-FGxFG', 'CHEM-P-012', 'negative', 'two flammable gases: P-012 excluded by its not-gas clause', pr(mk('a', 'FG', G, 'H220'), mk('b', 'FG', G, 'H221')).result, 'C');
    T0('neg-P013-flam-tox', 'CHEM-P-013', 'negative', 'toxic flammable liquid with a flammable liquid: P-013 excluded', has(ids(pr(mk('a', 'FL', L_, 'H225, H301'), mk('b', 'FL', L_, 'H225'))), 'CHEM-P-013'), false);
    T0('neg-P015-oxacid', 'CHEM-P-015', 'negative', 'oxidising acid with a non-oxidising acid: P-015 excluded', pr(mk('a', 'OA', L_, 'H272, H314'), mk('b', 'MA', L_, 'H314')).result, 'C');
