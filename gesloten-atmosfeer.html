<script type="application/json" id="diagram-tool-manifest">{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision":"2026-08-11.2","id":"gesloten-atmosfeer","file":"gesloten-atmosfeer.html","listed":true,"category":"hvac","order":37,"title":{"en":"Closed-Atmosphere Life Support","uk":"Життєзабезпечення замкненої атмосфери","de":"Lebenserhaltung in geschlossener Atmosphäre","nl":"Levensondersteuning in gesloten atmosfeer","fr":"Survie en atmosphère close","es":"Soporte vital en atmósfera cerrada","pl":"Podtrzymywanie życia w atmosferze zamkniętej"},"summary":{"en":"Dynamic atmosphere model of a sealed habitable volume: carbon dioxide, oxygen, water vapour, trace contaminants and temperature are integrated together with a fourth-order Runge-Kutta scheme.","uk":"Динамічна модель атмосфери герметичного житлового об'єму: діоксид вуглецю, кисень, водяна пара, слідові домішки і температура інтегруються разом схемою Рунге-Кутти четвертого порядку.","de":"Dynamisches Atmosphärenmodell eines dichten Aufenthaltsraums: Kohlendioxid, Sauerstoff, Wasserdampf, Spurenstoffe und Temperatur werden gemeinsam mit einem Runge-Kutta-Verfahren vierter Ordnung integriert.","nl":"Dynamisch atmosfeermodel van een gesloten verblijfsvolume: kooldioxide, zuurstof, waterdamp, sporenstoffen en temperatuur worden samen geïntegreerd met een Runge-Kutta-schema van de vierde orde.","fr":"Modèle dynamique de l’atmosphère d’un volume habitable étanche: dioxyde de carbone, oxygène, vapeur d’eau, traces et température sont intégrés ensemble par un schéma de Runge-Kutta d’ordre quatre.","es":"Modelo dinámico de la atmósfera de un volumen habitable estanco: dióxido de carbono, oxígeno, vapor de agua, trazas y temperatura se integran conjuntamente con un esquema de Runge-Kutta de cuarto orden.","pl":"Dynamiczny model atmosfery zamkniętej, nadającej się do zamieszkania przestrzeni: dwutlenek węgla, tlen, para wodna, śladowe zanieczyszczenia i temperatura są zintegrowane ze schematem Rungego-Kutty czwartego rzędu."},"description":{"en":"Dynamic atmosphere model of a sealed habitable volume: carbon dioxide, oxygen, water vapour, trace contaminants and temperature are integrated together with a fourth-order Runge-Kutta scheme. A closure scale runs from a mechanically ventilated building through ships, submersibles and submarines to a space capsule and an orbital module, and each step changes volume, crew, outside-air share, scrubber duty, oxygen source, dehumidification, heat rejection and stored consumables. Failure scenarios — loss of carbon-dioxide removal, of oxygen supply, of dehumidification, of heat rejection, of pressure integrity — are started at a chosen moment and the tool reports when each threshold is crossed. Two linked schematics run beside the numbers: a sectional layout of the selected platform with the habitable volume drawn to scale, the crew, the equipment positions, the pressure boundary, the leak paths and the airlock, and a principle diagram of the treatment loop in which line thickness follows the volumetric flow, line colour follows the carbon-dioxide band and a device switched off by the scenario is dimmed and crossed out; a time slider replays the run and both drawings follow it, with every label repeated as text. Every metabolic rate, device efficiency and threshold carries a category badge and a status badge, and each badge is a button that opens what the category means, what the status means and why the categories are never mixed, with a clickable legend of all five beside the list. A set of built-in checks drives the calculation core itself at every recalculation: mass conservation, the closed-form mole balance and the predicted time to a threshold at reduced, standard and raised compartment pressure, non-negativity, step stability, three stored reference series, closure of the sensible heat balance, the saturation limit on the air, the remaining-water curve, and the reporting of a runaway or out-of-range input; the interface warns in plain language if one of them does not pass.","uk":"Динамічна модель атмосфери герметичного житлового об'єму: діоксид вуглецю, кисень, водяна пара, слідові домішки і температура інтегруються разом схемою Рунге-Кутти четвертого порядку. Шкала замкненості веде від будівлі з механічною вентиляцією через судна, підводні апарати та човни до космічної капсули й орбітального модуля, і кожен крок змінює об'єм, екіпаж, частку зовнішнього повітря, продуктивність скрубера, джерело кисню, осушення, тепловідведення та запаси. Сценарії відмов — втрата видалення діоксиду вуглецю, подачі кисню, осушення, тепловідведення, герметичності — запускаються у заданий момент, а інструмент показує, коли перетнуто кожен поріг. Поряд із числами працюють дві пов'язані схеми: розріз обраної платформи з житловим об'ємом у масштабі, екіпажем, розташуванням обладнання, межею герметичності, місцями витоків і шлюзом, та принципова схема контуру обробки, де товщина лінії відповідає об'ємній витраті, колір — діапазону діоксиду вуглецю, а вимкнений сценарієм пристрій згасає і перекреслюється; повзунок часу програє прогін, обидва креслення стежать за ним, і кожен підпис продубльовано текстом. Кожна швидкість обміну, ефективність пристрою і поріг мають бейдж категорії та бейдж статусу, і кожен бейдж — це кнопка, яка відкриває пояснення категорії, статусу і того, чому категорії не змішують; поруч зі списком лежить клікабельна легенда з усіх пʼяти. Набір вбудованих перевірок при кожному перерахунку запускає саме розрахункове ядро: збереження маси, замкнену форму мольного балансу і передбачений час до порога за зниженого, стандартного і підвищеного тиску у відсіку, невідʼємність, стійкість кроку, три збережені контрольні ряди, замикання балансу явної теплоти, обмеження насичення повітря, криву залишку води та повідомлення про розбіжність чи вихід вводу за діапазон; інтерфейс попереджає зрозумілою мовою, якщо якась із них не проходить.","de":"Dynamisches Atmosphärenmodell eines dichten Aufenthaltsraums: Kohlendioxid, Sauerstoff, Wasserdampf, Spurenstoffe und Temperatur werden gemeinsam mit einem Runge-Kutta-Verfahren vierter Ordnung integriert. Eine Skala der Geschlossenheit führt vom maschinell belüfteten Gebäude über Schiffe, Tauchboote und U-Boote bis zur Raumkapsel und zum Orbitalmodul; jede Stufe ändert Volumen, Besatzung, Außenluftanteil, Scrubberleistung, Sauerstoffquelle, Entfeuchtung, Wärmeabfuhr und Vorräte. Störungsszenarien — Ausfall der Kohlendioxidentfernung, der Sauerstoffzufuhr, der Entfeuchtung, der Wärmeabfuhr, der Druckdichtheit — beginnen zu einem gewählten Zeitpunkt, und das Werkzeug nennt die Zeit bis zu jeder Grenze. Neben den Zahlen laufen zwei verknüpfte Schemata: ein Schnitt der gewählten Plattform mit maßstäblich gezeichnetem bewohntem Volumen, Besatzung, Geräteanordnung, Druckgrenze, Leckstellen und Schleuse sowie ein Prinzipschema des Aufbereitungskreises, in dem die Linienstärke dem Volumenstrom folgt, die Farbe dem Kohlendioxidband und ein vom Szenario abgeschaltetes Gerät blass und durchgestrichen erscheint; ein Zeitregler spielt den Ablauf ab, beide Zeichnungen folgen ihm, und jede Beschriftung steht zusätzlich als Text darunter. Jede Stoffwechselrate, jeder Wirkungsgrad und jeder Grenzwert trägt ein Kategorie- und ein Statusabzeichen, und jedes Abzeichen ist eine Schaltfläche, die erklärt, was die Kategorie bedeutet, was der Status bedeutet und warum die Kategorien nie vermischt werden; neben der Liste liegt eine anklickbare Legende aller fünf. Eingebaute Prüfungen führen bei jeder Neuberechnung den Rechenkern selbst aus: Massenerhaltung, die geschlossene Molbilanz und die vorhergesagte Zeit bis zu einer Grenze bei vermindertem, normalem und erhöhtem Abteildruck, Nichtnegativität, Schrittstabilität, drei hinterlegte Referenzreihen, den Schluss der fühlbaren Wärmebilanz, die Sättigungsgrenze der Luft, die Restwasserkurve und die Meldung eines weglaufenden oder außerhalb des Bereichs liegenden Eingabewerts; die Oberfläche warnt in klarer Sprache, wenn eine davon nicht besteht.","nl":"Dynamisch atmosfeermodel van een gesloten verblijfsvolume: kooldioxide, zuurstof, waterdamp, sporenstoffen en temperatuur worden samen geïntegreerd met een Runge-Kutta-schema van de vierde orde. Een schaal van geslotenheid loopt van een mechanisch geventileerd gebouw via schepen, duikboten en onderzeeboten naar een ruimtecapsule en een stationmodule; elke stap verandert volume, bemanning, aandeel buitenlucht, scrubbercapaciteit, zuurstofbron, ontvochtiging, warmteafvoer en voorraden. Storingsscenario's — uitval van de kooldioxideverwijdering, van de zuurstoftoevoer, van de ontvochtiging, van de warmteafvoer, van de drukdichtheid — starten op een gekozen moment en het hulpmiddel toont wanneer elke grenswaarde wordt overschreden. Naast de getallen staan twee gekoppelde schema's: een doorsnede van het gekozen platform met het bewoonde volume op schaal, de bemanning, de plaats van de apparatuur, de drukgrens, de lekwegen en de sluis, en een principeschema van het behandelcircuit waarin de lijndikte het volumedebiet volgt, de kleur de kooldioxideband en een door het scenario uitgeschakeld toestel bleek en doorgekruist wordt getekend; een tijdschuif speelt het verloop af, beide tekeningen volgen die, en elk opschrift staat er ook als tekst onder. Elke stofwisselingsstroom, elk rendement en elke grenswaarde draagt een categoriebadge en een statusbadge, en elke badge is een knop die uitlegt wat de categorie betekent, wat de status betekent en waarom de categorieën nooit worden vermengd; naast de lijst staat een aanklikbare legenda van alle vijf. Ingebouwde controles draaien bij elke herberekening de rekenkern zelf: massabehoud, de gesloten molbalans en de voorspelde tijd tot een grens bij verlaagde, normale en verhoogde compartimentsdruk, niet-negativiteit, stapstabiliteit, drie opgeslagen referentiereeksen, het sluiten van de voelbare warmtebalans, de verzadigingsgrens van de lucht, de restwatercurve en het melden van weglopende of buiten het bereik ingevoerde waarden; de interface waarschuwt in gewone taal als er een niet slaagt.","fr":"Modèle dynamique de l’atmosphère d’un volume habitable étanche: dioxyde de carbone, oxygène, vapeur d’eau, traces et température sont intégrés ensemble par un schéma de Runge-Kutta d’ordre quatre. Une échelle de fermeture va du bâtiment à ventilation mécanique aux navires, submersibles et sous-marins, puis à la capsule spatiale et au module orbital; chaque marche modifie volume, effectif, part d’air neuf, débit d’épuration, source d’oxygène, déshumidification, évacuation de chaleur et consommables. Les scénarios de panne — perte de l’élimination du dioxyde de carbone, de l’apport d’oxygène, de la déshumidification, de l’évacuation de chaleur, de l’étanchéité — démarrent à un instant choisi et l’outil indique le délai avant chaque seuil. Deux schémas liés accompagnent les nombres: une coupe de la plate-forme choisie avec le volume habitable à l’échelle, l’équipage, l’emplacement des équipements, la limite de pression, les fuites et le sas, et un schéma de principe de la boucle de traitement où l’épaisseur du trait suit le débit volumique, la couleur suit la bande de dioxyde de carbone et un appareil coupé par le scénario est estompé et barré; un curseur de temps rejoue l’essai, les deux dessins le suivent, et chaque repère est repris en texte. Chaque débit métabolique, chaque rendement et chaque seuil porte un badge de catégorie et un badge de statut, et chaque badge est un bouton qui explique ce que signifie la catégorie, ce que signifie le statut et pourquoi les catégories ne sont jamais mêlées ; une légende cliquable des cinq figure à côté de la liste. Des contrôles intégrés exécutent à chaque recalcul le cœur de calcul lui-même : conservation de la masse, bilan molaire en forme fermée et temps prédit jusqu’à un seuil à pression réduite, normale et élevée, positivité, stabilité du pas, trois séries de référence enregistrées, fermeture du bilan de chaleur sensible, limite de saturation de l’air, courbe d’eau restante et signalement d’un calcul qui diverge ou d’une saisie hors plage ; l’interface avertit en langage clair si l’un d’eux échoue.","es":"Modelo dinámico de la atmósfera de un volumen habitable estanco: dióxido de carbono, oxígeno, vapor de agua, trazas y temperatura se integran conjuntamente con un esquema de Runge-Kutta de cuarto orden. Una escala de cierre va del edificio con ventilación mecánica a buques, sumergibles y submarinos, y de ahí a la cápsula espacial y al módulo orbital; cada escalón cambia volumen, tripulación, fracción de aire exterior, capacidad del depurador, fuente de oxígeno, deshumidificación, evacuación de calor y consumibles. Los escenarios de fallo — pérdida de la eliminación de dióxido de carbono, del aporte de oxígeno, de la deshumidificación, de la evacuación de calor, de la estanqueidad — arrancan en un instante elegido y la herramienta indica cuándo se cruza cada umbral. Junto a los números funcionan dos esquemas enlazados: un corte de la plataforma elegida con el volumen habitable a escala, la tripulación, la posición de los equipos, el límite de presión, las fugas y la esclusa, y un esquema de principio del circuito de tratamiento en el que el grosor de la línea sigue el caudal volumétrico, el color sigue la banda de dióxido de carbono y un equipo apagado por el escenario aparece atenuado y tachado; un deslizador de tiempo reproduce el ensayo, ambos dibujos lo siguen y cada rótulo se repite como texto. Cada tasa metabólica, cada rendimiento y cada umbral lleva una insignia de categoría y otra de estado, y cada insignia es un botón que explica qué significa la categoría, qué significa el estado y por qué las categorías nunca se mezclan; junto a la lista hay una leyenda de las cinco en la que se puede pulsar. Unas comprobaciones integradas ejecutan en cada recálculo el propio núcleo de cálculo: conservación de la masa, balance molar en forma cerrada y tiempo previsto hasta un umbral a presión reducida, normal y elevada, no negatividad, estabilidad del paso, tres series de referencia almacenadas, cierre del balance de calor sensible, límite de saturación del aire, curva de agua restante y aviso de un cálculo que diverge o de una entrada fuera de rango; la interfaz avisa en lenguaje claro si alguna no se supera.","pl":"Dynamiczny model atmosfery zamkniętej przestrzeni mieszkalnej: dwutlenek węgla, tlen, para wodna, śladowe zanieczyszczenia i temperatura są zintegrowane ze schematem Rungego-Kutty czwartego rzędu. Skala zamknięcia przebiega od budynku z wentylacją mechaniczną, przez statki, okręty podwodne i łodzie podwodne, po kapsułę kosmiczną i moduł orbitalny, a każdy krok zmienia objętość, załogę, udział powietrza zewnętrznego, pracę skrubera, źródło tlenu, osuszanie, odprowadzanie ciepła i przechowywane materiały eksploatacyjne. Scenariusze awarii — utrata usuwania dwutlenku węgla, dopływu tlenu, osuszania, odprowadzania ciepła i integralności ciśnienia — są uruchamiane w wybranym momencie, a narzędzie zgłasza przekroczenie każdego progu. Obok liczb znajdują się dwa powiązane schematy: przekrojowy układ wybranej platformy z narysowaną w skali objętością nadającą się do zamieszkania, załogą, rozmieszczeniem sprzętu, granicą ciśnienia, ścieżkami wycieków i śluzą powietrzną oraz schemat ideowy pętli oczyszczania, w którym grubość linii odpowiada przepływowi objętościowemu, kolor linii odpowiada pasmu dwutlenku węgla, a urządzenie wyłączone przez scenariusz jest przyciemnione i przekreślone; suwak czasu odtwarza przebieg, a oba rysunki następują po nim, a każda etykieta jest powtórzona jako tekst. Każde tempo metabolizmu, wydajność urządzenia i próg mają przypisaną odznakę kategorii i odznakę statusu, a każda odznaka to przycisk, który otwiera okno z informacjami o znaczeniu kategorii, statusie i powodach, dla których kategorie nigdy nie są mieszane, z klikalną legendą wszystkich pięciu kategorii obok listy. Zestaw wbudowanych kontroli steruje rdzeniem obliczeniowym przy każdym ponownym obliczeniu: zachowanie masy, bilans molowy w formie zamkniętej i przewidywany czas do osiągnięcia progu przy obniżonym, standardowym i podwyższonym ciśnieniu w przedziale, nieujemność, stabilność kroku, trzy zapisane serie odniesienia, zamknięcie bilansu ciepła jawnego, granica nasycenia powietrza, krzywa pozostałej wody i raportowanie niekontrolowanego lub poza zakresem sygnału wejściowego; interfejs wyświetla ostrzeżenie w języku zwykłym, jeśli któryś z tych warunków nie zostanie spełniony."},"status":"benchmarked","independent_validation":false,"limitations":{"en":"Single fully mixed volume with first-order removal devices: stratification, local pockets, transport delays, sorbent breakthrough, coil frosting and sorption in surfaces are not modelled, and only sensible heat plus an explicit condensate term is balanced. Atmosphere threshold values shown are teaching values; binding limits follow from the rules in force for the platform and from medical supervision, so the tool must not be used to demonstrate compliance or to set an exposure limit. Consumables, endurance and specific power are order-of-magnitude comparison figures, not sizing data. The integration is a fixed-step fourth-order Runge-Kutta scheme whose step comes from a stability estimate and is capped at 10 s; a run needing more than 60 000 steps is made with a longer step and the page reports it. Once the gas phase saturates, the surplus vapour is projected back onto the saturation curve at the end of each step, so that branch is first order in the step. The metabolic CO2 and O2 rates are entered separately, so their ratio is whatever the user makes it; the defaults imply a respiratory quotient of 0.76 against the 0.87 of the NASA baseline pair, and the page shows the quotient with that context.","uk":"Єдиний повністю перемішаний об'єм із пристроями видалення першого порядку: стратифікацію, локальні застійні зони, затримки переносу, проскок поглинача, обмерзання охолодника і сорбцію в поверхнях не змодельовано, а баланс охоплює лише явне тепло та окремий член конденсату. Показані порогові значення атмосфери навчальні; обов'язкові межі випливають із чинних для платформи правил і з медичного контролю, тому інструмент не можна використовувати для підтвердження відповідності чи встановлення межі впливу. Витратні матеріали, автономія та питома потужність — порівняльні оцінки порядку величини, а не дані для підбору обладнання. Інтегрування — метод Рунге-Кутти четвертого порядку зі сталим кроком з оцінки стійкості, обмеженим 10 с; розрахунок, що потребує понад 60 000 кроків, виконується з довшим кроком, і сторінка про це повідомляє. Після досягнення насичення надлишок пари наприкінці кожного кроку проєктується на криву насичення, тож ця гілка має перший порядок за кроком. Метаболічні швидкості CO2 і O2 задаються окремо, тож їхнє відношення визначає користувач; значення за замовчуванням дають дихальний коефіцієнт 0,76 проти 0,87 базової пари NASA, і сторінка показує цей коефіцієнт із відповідним поясненням.","de":"Ein einziges vollständig durchmischtes Volumen mit Entfernungsgliedern erster Ordnung: Schichtung, örtliche Nester, Transportverzögerungen, Sorbensdurchbruch, Registervereisung und Sorption in Oberflächen sind nicht modelliert, bilanziert werden nur fühlbare Wärme und ein ausdrücklicher Kondensatterm. Die gezeigten Atmosphärenschwellen sind Lehrwerte; verbindliche Grenzen folgen aus den für die Plattform geltenden Regeln und aus der medizinischen Überwachung, das Werkzeug darf daher weder für einen Konformitätsnachweis noch zur Festlegung eines Expositionsgrenzwerts dienen. Verbrauchsstoffe, Durchhaltezeit und spezifische Leistung sind Größenordnungswerte zum Vergleich, keine Auslegungsdaten. Integriert wird mit einem Runge-Kutta-Verfahren vierter Ordnung mit festem Schritt aus einer Stabilitätsabschätzung, begrenzt auf 10 s; ein Lauf mit mehr als 60 000 Schritten wird mit größerem Schritt gerechnet und die Seite weist darauf hin. Nach Erreichen der Sättigung wird der Dampfüberschuss am Ende jedes Schritts auf die Sättigungskurve projiziert, dieser Zweig ist also erster Ordnung im Schritt. Die metabolischen CO2- und O2-Raten werden getrennt eingegeben, ihr Verhältnis bestimmt also der Benutzer; die Voreinstellungen ergeben einen respiratorischen Quotienten von 0,76 gegenüber 0,87 des NASA-Basispaars, und die Seite zeigt den Quotienten mit diesem Hinweis.","nl":"Eén volledig gemengd volume met eerste-orde-verwijderingselementen: stratificatie, plaatselijke nesten, transportvertraging, sorbentdoorbraak, ijsvorming op de batterij en sorptie in oppervlakken zijn niet gemodelleerd, en er wordt alleen voelbare warmte plus een expliciete condensaatterm gebalanceerd. De getoonde atmosfeergrenswaarden zijn lesgetallen; bindende grenzen volgen uit de voor het platform geldende regels en uit medisch toezicht, zodat het hulpmiddel niet mag worden gebruikt om conformiteit aan te tonen of een blootstellingsgrens vast te stellen. Verbruiksstoffen, uithoudingstijd en specifiek vermogen zijn ordegroottewaarden ter vergelijking, geen dimensioneringsgegevens. De integratie is een Runge-Kutta-schema van de vierde orde met vaste stap uit een stabiliteitsschatting, begrensd op 10 s; een run die meer dan 60 000 stappen vergt wordt met een grotere stap gemaakt en de pagina meldt dat. Zodra de gasfase verzadigd is, wordt de overtollige damp aan het eind van elke stap op de verzadigingskromme geprojecteerd, zodat die tak eerste orde in de stap is. De metabole CO2- en O2-snelheden worden apart ingevoerd, dus hun verhouding bepaalt de gebruiker; de standaardwaarden geven een respiratoir quotiënt van 0,76 tegenover 0,87 van het NASA-basispaar, en de pagina toont het quotiënt met die context.","fr":"Un seul volume parfaitement mélangé avec des organes d’élimination du premier ordre: stratification, poches locales, retards de transport, percée du sorbant, givrage des batteries et sorption dans les surfaces ne sont pas modélisés, et seul un bilan de chaleur sensible avec un terme de condensat explicite est établi. Les seuils d’atmosphère affichés sont des valeurs pédagogiques; les limites contraignantes découlent des règles en vigueur pour la plateforme et du suivi médical, l’outil ne doit donc servir ni à démontrer une conformité ni à fixer une limite d’exposition. Consommables, autonomie et puissance spécifique sont des ordres de grandeur de comparaison, pas des données de dimensionnement. L'intégration est un schéma de Runge-Kutta d'ordre quatre à pas fixe issu d'une estimation de stabilité et plafonné à 10 s ; un calcul demandant plus de 60 000 pas est fait avec un pas plus long, et la page le signale. Dès la saturation, l'excès de vapeur est reprojeté sur la courbe de saturation à la fin de chaque pas : cette branche est donc d'ordre un en pas. Les débits métaboliques de CO2 et d'O2 se saisissent séparément, leur rapport est donc celui que l'utilisateur choisit ; les valeurs par défaut donnent un quotient respiratoire de 0,76 contre 0,87 pour le couple de référence NASA, et la page affiche ce quotient avec cette mise en contexte.","es":"Un único volumen perfectamente mezclado con órganos de eliminación de primer orden: no se modelan la estratificación, las bolsas locales, los retardos de transporte, la ruptura del sorbente, la escarcha en las baterías ni la sorción en superficies, y solo se balancea calor sensible más un término explícito de condensado. Los umbrales de atmósfera mostrados son valores didácticos; los límites vinculantes se derivan de las reglas vigentes para la plataforma y del control médico, por lo que la herramienta no debe usarse para demostrar conformidad ni para fijar un límite de exposición. Consumibles, autonomía y potencia específica son órdenes de magnitud de comparación, no datos de dimensionado. La integración es un esquema de Runge-Kutta de cuarto orden con paso fijo tomado de una estimación de estabilidad y limitado a 10 s; una simulación que necesite más de 60 000 pasos se hace con un paso mayor y la página lo indica. Una vez saturada la fase gaseosa, el vapor sobrante se proyecta sobre la curva de saturación al final de cada paso, de modo que esa rama es de primer orden en el paso. Las tasas metabólicas de CO2 y O2 se introducen por separado, así que su relación la fija el usuario; los valores por defecto implican un cociente respiratorio de 0,76 frente al 0,87 del par de referencia de la NASA, y la página muestra ese cociente con ese contexto.","pl":"Pojedyncza, w pełni wymieszana objętość z urządzeniami do usuwania pierwszego rzędu: stratyfikacja, kieszenie lokalne, opóźnienia transportu, przebicie sorbentu, szronienie wężownicy i sorpcja w powierzchniach nie są modelowane, a jedynie ciepło odczuwalne plus wyraźny składnik kondensatu jest równoważone. Podane wartości progowe atmosfery są wartościami edukacyjnymi; limity wiążące wynikają z obowiązujących przepisów platformy oraz nadzoru medycznego, dlatego narzędzia nie należy używać do demonstrowania zgodności ani do ustalania limitu narażenia. Materiały eksploatacyjne, wytrzymałość i moc właściwa są wartościami porównawczymi rzędu wielkości, a nie danymi dotyczącymi wielkości. Całkowanie jest schematem Runge-Kutty czwartego rzędu o stałym kroku, którego krok pochodzi z oszacowania stabilności i jest ograniczony do 10 s; przebieg wymagający ponad 60 000 kroków jest wykonywany z dłuższym krokiem, o czym strona informuje. Po nasyceniu fazy gazowej, nadmiar pary jest rzutowany z powrotem na krzywą nasycenia na końcu każdego kroku, tak że gałąź ta jest pierwszym rzędem w kroku. Wskaźniki metabolicznego stężenia CO2 i O2 wprowadza się osobno, więc ich stosunek zależy od decyzji użytkownika; wartości domyślne wskazują na współczynnik oddechowy wynoszący 0,76 w porównaniu z wartością bazową NASA wynoszącą 0,87, a strona wyświetla ten iloraz w tym kontekście."},"intended_use":["education","technical exploration","preliminary assessment"],"catalog_languages":["en","uk","de","nl","fr","es","pl"],"tool_languages":["en","uk","de","nl","fr","es","pl"],"dependencies":["diagram-common.js"],"network_access":{"mode":"same-origin-data","note":"Loads only its own declared local dependency diagram-common.js (the shared runtime) from this site. No external service is contacted and nothing is transmitted."},"validation":{"basis":{"en":"28 cases driven through the page DOM: all seven closure presets, the five failure scenarios, sorbent and oxygen-store exhaustion, a saturating compartment, 40 and 130 kPa, an empty compartment, a case that must be reported as out of range, plus dedicated step-size and respiratory-quotient cases. Each case is compared with the same ODE system re-implemented independently in python and integrated with scipy solve_ivp at rtol 1e-11, and separately with invariants read off the page's own output (carbon and oxygen balance, ideal-gas closure, saturation limit, store capacities, analytic steady temperature). The rate constants are the page's own, so what is graded is the mathematics; the data provenance is stated separately in the artifact. The harness is the author's own; no external party has reviewed it.","uk":"28 випадків, проведених через DOM сторінки: усі сім пресетів замкненості, п'ять сценаріїв відмов, вичерпання поглинача та запасу кисню, відсік із насиченням, 40 і 130 кПа, порожній відсік, випадок, який має бути позначений як позамежний, а також окремі випадки для кроку інтегрування й дихального коефіцієнта. Кожен випадок порівнюється з тією самою системою ОДР, незалежно реалізованою на python та проінтегрованою scipy solve_ivp з rtol 1e-11, і окремо — з інваріантами, зчитаними з власного виводу сторінки (баланс вуглецю й кисню, замикання рівняння стану, межа насичення, місткість запасів, аналітична стала температура). Константи швидкостей — власні для сторінки, тож перевіряється математика; походження даних наведено в артефакті окремо. Стенд належить авторові; сторонньої перевірки не було.","de":"28 Fälle über das Seiten-DOM gefahren: alle sieben Geschlossenheits-Voreinstellungen, die fünf Ausfallszenarien, Erschöpfung von Sorbens und Sauerstoffvorrat, ein sättigendes Abteil, 40 und 130 kPa, ein leeres Abteil, ein Fall, der als außerhalb des Bereichs gemeldet werden muss, dazu eigene Fälle für Schrittweite und respiratorischen Quotienten. Jeder Fall wird mit demselben, unabhängig in python implementierten Differentialgleichungssystem verglichen, integriert mit scipy solve_ivp bei rtol 1e-11, und getrennt mit Invarianten aus der eigenen Ausgabe der Seite (Kohlenstoff- und Sauerstoffbilanz, Zustandsgleichung, Sättigungsgrenze, Vorratskapazitäten, analytische Beharrungstemperatur). Die Ratenkonstanten sind die der Seite; geprüft wird also die Mathematik, die Datenherkunft steht getrennt im Artefakt. Der Prüfstand stammt vom Autor; eine Prüfung durch Dritte fand nicht statt.","nl":"28 gevallen via de DOM van de pagina: alle zeven geslotenheidspresets, de vijf faalscenario's, uitputting van sorbent en zuurstofvoorraad, een verzadigend compartiment, 40 en 130 kPa, een leeg compartiment, een geval dat als buiten bereik gemeld moet worden, plus aparte gevallen voor stapgrootte en respiratoir quotiënt. Elk geval wordt vergeleken met hetzelfde stelsel differentiaalvergelijkingen, onafhankelijk in python geïmplementeerd en met scipy solve_ivp op rtol 1e-11 geïntegreerd, en daarnaast met invarianten uit de eigen uitvoer van de pagina (koolstof- en zuurstofbalans, gaswet, verzadigingsgrens, voorraadcapaciteiten, analytische eindtemperatuur). De snelheidsconstanten zijn die van de pagina zelf, dus getoetst wordt de wiskunde; de herkomst van de data staat apart in het artefact. De testbank is van de auteur; er is geen review door derden.","fr":"28 cas pilotés via le DOM de la page : les sept préréglages de fermeture, les cinq scénarios de panne, l'épuisement du sorbant et de la réserve d'oxygène, un compartiment qui sature, 40 et 130 kPa, un compartiment vide, un cas qui doit être signalé hors domaine, plus des cas dédiés au pas d'intégration et au quotient respiratoire. Chaque cas est comparé au même système d'équations différentielles réimplémenté indépendamment en python et intégré par scipy solve_ivp à rtol 1e-11, et séparément à des invariants tirés de la sortie de la page elle-même (bilans de carbone et d'oxygène, loi des gaz parfaits, limite de saturation, capacités des réserves, température d'équilibre analytique). Les constantes de vitesse sont celles de la page : c'est donc la mathématique qui est jugée, la provenance des données étant indiquée à part dans l'artefact. Le banc d'essai est celui de l'auteur ; aucune revue externe n'a eu lieu.","es":"28 casos ejecutados a través del DOM de la página: los siete ajustes de cierre, los cinco escenarios de fallo, el agotamiento del sorbente y de la reserva de oxígeno, un compartimento que satura, 40 y 130 kPa, un compartimento vacío, un caso que debe notificarse como fuera de rango, y casos dedicados al paso de integración y al cociente respiratorio. Cada caso se compara con el mismo sistema de ecuaciones diferenciales reimplementado de forma independiente en python e integrado con scipy solve_ivp a rtol 1e-11, y por separado con invariantes leídos de la propia salida de la página (balances de carbono y oxígeno, ley de los gases ideales, límite de saturación, capacidad de las reservas, temperatura estacionaria analítica). Las constantes de velocidad son las de la página, de modo que se juzga la matemática; la procedencia de los datos se indica aparte en el artefacto. El banco de pruebas es del propio autor; no ha habido revisión externa.","pl":"28 przypadków przepuszczonych przez DOM strony: wszystkie siedem predefiniowanych ustawień zamknięcia, pięć scenariuszy awarii, wyczerpanie sorbentu i zapasu tlenu, komora nasycona, 40 i 130 kPa, komora pusta, przypadek, który musi zostać zgłoszony jako poza zakresem, plus dedykowane przypadki wielkości kroku i ilorazu oddechowego. Każdy przypadek jest porównywany z tym samym systemem ODE, ponownie zaimplementowanym niezależnie w Pythonie i zintegrowanym z solve_ivp SciPy w rtol 1e-11, a także oddzielnie z niezmiennikami odczytanymi z danych wyjściowych strony (bilans węgla i tlenu, zamknięcie gazu doskonałego, granica nasycenia, pojemności magazynów, analityczna temperatura stacjonarna). Stałe szybkości są własnością strony, więc oceniana jest matematyka; pochodzenie danych jest określone osobno w artefakcie. Zestaw testowy został przygotowany przez autora; nie została zweryfikowana przez żadną stronę zewnętrzną."},"independent_validation":false,"benchmarks":[{"id":"closed-atmosphere-ode-2026-08-12","reference":"The same coupled ODE system (CO2, O2, water vapour, trace contaminants, temperature, and the five accumulators) re-implemented independently in python from the model description and from the rate constants, crew rates and device characteristics read out of the page, integrated with scipy.integrate.solve_ivp (LSODA, rtol 1e-11, saturation handled as a constrained sub-system through a terminal event) — a different integrator family from the page fixed-step RK4. Grading is completed by invariants that owe nothing to either integration: the carbon and oxygen balances over the whole run, the analytic steady temperature, the ideal-gas closure, non-negativity, and the observed order of the scheme under step halving.","citations":["scipy 1.17.1, scipy.integrate.solve_ivp (LSODA: Adams/BDF with automatic stiffness switching and local error control) — the independent integrator.","The rate constants, crew metabolic rates and device characteristics are the page's own, read out of the file, so that the benchmark grades the mathematics rather than the choice of physiological data.","Data provenance of those rates, checked separately: NASA/SP-2010-3407/REV1 Human Integration Design Handbook and NASA Baseline Values and Assumptions Document (BVAD, NASA/TP-2015-218570) give per crew member and day: 0.835 kg O2 consumed, 1.0 kg CO2 produced (respiratory quotient 0.87), about 1.9 kg metabolic water vapour and 2.5 kg drinking water; ASHRAE Standard 62.1 uses about 0.0052 L/s (19 L/h) of CO2 per sedentary adult.","Fourth-order Runge-Kutta truncation behaviour: E. Hairer, S. P. Norsett, G. Wanner, Solving Ordinary Differential Equations I, 2nd ed., Springer 1993, ch. II.1-II.3 (order conditions and the (h^4) global error of the classical scheme)."],"cases":28,"passed":28,"tolerance":"Every displayed quantity is graded at 1e-7 relative plus a small absolute floor per quantity (1e-5 ppm CO2, 1e-7 kPa, 1e-6 K, 1e-6 % RH) for the near-zero cases. That is two orders of magnitude above the deviation actually observed against the adaptive reference (1e-9 or better) and two orders below anything that could reach the digits the page prints, so it grades the integration rather than the display. Carbon and oxygen balances are graded at 1e-9 relative for a sealed compartment, since the accumulators the page itself reports must close those balances exactly. The analytic steady temperature is graded at 0.02 K. The run at the step the page chooses must be step-converged: refining the step 16-fold must not move any displayed quantity by more than 1e-9 relative. The observed order of the scheme, measured where truncation is still visible (a reduced case with only the slow gas modes, steps of 225 s to 7200 s), must lie between 3.5 and 4.5. The saturated branch is the exception: there the surplus vapour is projected onto the saturation curve at the end of every step, which is a first-order splitting (measured order 1.00 over five halvings), so the saturating case is graded at 1e-4 relative — the deviation actually measured at the 10 s step the page uses is 1.8e-5 relative on the vapour pressure, 4.6e-5 K on the temperature and 1.3 g in 203 kg of condensate, three orders of magnitude below the resolution of anything the page prints — and the case additionally requires that deviation to fall linearly with the step, which is what proves the splitting consistent with the constrained solution.","run_at":"2026-10-04T11:33:39.291Z","artifact":"benchmarks/gesloten-atmosfeer.json"}]},"report":{"pdf":true,"source_attribution":true},"python_export":{"supported":true,"requires":[]},"handoff":{"provides":["T","p","w","Vdot"],"accepts":[]},"state_codec":{"permalink":true,"record":"tools.petrov.re/calculation-record/v1"},"ui":{"framework":"tools.petrov.re/ui/v1","level":3}}</script>

  /* framework defect, repaired locally: overflow-wrap:anywhere on the tool title also

  @media(max-width:768px){
    /* and the title, the return link and the subtitle share one flex line, so a long

       wrap and give the title the width it needs. Belongs upstream. */
    .dgu-app .dgu-head-l{flex-wrap:wrap}
    .dgu-app .dgu-title{flex:1 1 auto;min-width:60%}
    .dgu-app .dgu-sub{flex:1 1 100%}
  }

  /* the two warning bars, in the results region above the answer */
  .ga-warn{background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);
    border-radius:var(--radius-sm);padding:var(--sp-2) var(--sp-3);font-size:var(--fs-small);
    line-height:1.5}
  .ga-warn.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}

  /* charts and schematics: SVG that scales with its box, with a floor under the
     drawing so the labels never fall below reading size (spec 10) */
  .plot{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);
    display:block;width:100%}
  .lg{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-3);margin-top:var(--sp-2);
    font-size:var(--fs-micro);color:var(--muted)}
  .lg i{display:inline-block;width:14px;height:3px;border-radius:var(--radius-pill);
    vertical-align:middle;margin-right:var(--sp-1)}
  .lg i.dsh{height:0;border-top:2px dashed currentColor;background:none!important}
  .lg i.mk{width:8px;height:8px;border-radius:var(--radius-pill)}
  .schwrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:var(--sp-1);overflow-x:auto}
  .sch{display:block;width:100%;min-width:560px;height:auto}
  .chwrap{overflow-x:auto}
  .chwrap>.plot{min-width:420px}
  .skey{display:flex;flex-wrap:wrap;gap:var(--sp-1) var(--sp-4);margin-top:var(--sp-2);
    font-size:var(--fs-micro);color:var(--muted);line-height:1.5}
  .skey .ki{display:inline-flex;gap:var(--sp-1);align-items:baseline}
  .skey .ki b{font-size:var(--fs-micro);font-weight:650;color:var(--accent)}
  .skey .ki.off{opacity:.72} .skey .ki.off b{color:var(--muted)}
  .skey .ki.bad b{color:var(--bad)}
  .skey .ki .v{color:var(--ink);font-variant-numeric:tabular-nums}

  /* the eight charts sit in the dock, full width, two abreast on a wide screen */
  @media(min-width:1120px){
    .dgu-app .dgu-r-dock{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
      align-items:start}
  }
  /* the time control */
  .tbar{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap}
  .tbar input[type=range]{flex:1 1 200px;min-width:150px;width:auto;padding:0;
    accent-color:var(--accent);background:transparent;border:0;min-height:var(--ctl-h)}
  @media(max-width:768px){.tbar input[type=range]{min-height:var(--tap)}}
  .tbar .val{font-variant-numeric:tabular-nums;font-size:var(--fs-label);color:var(--ink)}
  .ga-flags{display:grid;gap:var(--sp-1)}
  .flag{display:flex;align-items:flex-start;gap:var(--sp-2);padding:var(--sp-1) 0;
    border-bottom:1px solid var(--line);font-size:var(--fs-small);line-height:1.45}
  .flag:last-child{border-bottom:0}
  .flag .ic{width:18px;height:18px;border-radius:var(--radius-sm);flex:none;display:grid;
    place-items:center;font-size:var(--fs-micro);font-weight:650;color:var(--accent-ink)}
  .flag.ok .ic{background:var(--ok)}
  .flag.bad .ic{background:var(--bad)}
  .flag .d{color:var(--muted);font-variant-numeric:tabular-nums}
  #lim-out{margin:0;padding-left:var(--sp-5)}
  #lim-out li{font-size:var(--fs-small);color:var(--muted);line-height:1.5;
    margin-bottom:var(--sp-1)}
  .ga-eq{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--muted);
    line-height:1.6;margin:var(--sp-2) 0 0;padding-left:var(--sp-4)}
  @keyframes flowdash{to{stroke-dashoffset:-36}}
  .fl{animation:flowdash 1.15s linear infinite}
  @media (prefers-reduced-motion:reduce){.fl{animation:none}}
  /* framework defect, repaired locally: [hidden] does not win against the
     display rules of .dgu-panel/.dgu-field/flex children. Belongs upstream. */
  [hidden]{display:none!important}
  /* framework defect, repaired locally: the tour card, the popover and the dialog are
     appended to <body>, outside the .dgu-app rule that sets border-box, so at 390 px
     the 380 px tour card plus its padding is 394 px wide and hangs off the screen.
     Belongs upstream. */
  .dgu-tour,.dgu-pop,.dgu-dialog,.dgu-dialog-p,.dgu-tour *,.dgu-pop *,.dgu-dialog *{
    box-sizing:border-box}

 bn_oap:"Зовнішнє повітря подають за тиском, заданим для відсіку, і за зовнішньою температурою, а виходить воно за станом, якого відсік справді досягає; саме тракт скидання і тримає тиск. Тому приплив стежить за заданим тиском, а не за сталими 101,325 кПа, і член зовнішнього повітря узгоджується з балансом мольних часток за будь-якого дозволеного тиску. Відсік із тиском, далеким від тиску довкілля, потребував би власного обладнання забору, якого ця модель не має.",

  lim7:"Integriert wird mit einem Runge-Kutta-Verfahren vierter Ordnung mit festem Schritt, der aus einer Stabilitätsabschätzung stammt und auf 10 s begrenzt ist; ein Lauf, der mehr als 60 000 Schritte bräuchte, wird mit größerem Schritt gerechnet, und die Seite weist darauf hin. Sobald die Gasphase Sättigung erreicht, wird der Dampfüberschuss am Ende jedes Schritts auf die Sättigungskurve zurückprojiziert — auf diesem Zweig eine Behandlung erster Ordnung: beim verwendeten Schritt verschiebt sie die Temperatur um etwa 5e-5 K und das Kondensat um rund ein Gramm auf zweihundert Kilogramm und konvergiert linear mit feinerem Schritt.", n_rq:"Die metabolischen CO2- und O2-Raten werden getrennt eingegeben, der respiratorische Quotient ist also genau ihr Verhältnis. Eine gemischte Kost bei leichter Tätigkeit ergibt etwa 0,82-0,87; die NASA-Basiswerte kombinieren 1,0 kg CO2 mit 0,835 kg O2 je Person und Tag, also 0,87. Die Voreinstellungen hier (20 l/h und 0,84 kg/d) ergeben 0,76, das Fettoxidations-Ende des physiologischen Bereichs — prüfen Sie das Paar, bevor Sie die Sauerstoffkurve quantitativ lesen.", warn_cap:"Dieser Lauf braucht mehr Schritte, als der Integrator zulässt; er wurde daher mit einem Schritt von %a s statt der von der Stabilitätsabschätzung geforderten %b s gerechnet. Verkürzen Sie die Dauer, wenn Sie den feineren Schritt brauchen.", rep_title:"Lauf der geschlossenen Atmosphäre", rep_end:"Zustand am Ende des Laufs", rep_qty:"Größe", rep_val:"Wert", rep_unit:"Einheit", b_pdf:"PDF-Bericht",

 bn_gco2:"Stoffwechselbedingte CO2-Abgabe bei leichter Tätigkeit, in Litern bei 20 °C und 101,325 kPa. Das sind keine Normliter nach DIN 1343, die sich auf 0 °C beziehen.",

 h_lim:"Einschränkungen",
 lim1:"Ein einziges vollständig durchmischtes Volumen: Schichtung, örtliche Nester hinter Geräten, Totzonen und Transportverzögerungen zwischen Abteilungen sind nicht abgebildet, örtliche Spitzen können deutlich höher liegen als der angezeigte Wert.",
 lim2:"Die Schwellenwerte in den Diagrammen sind Lehrwerte. Verbindliche Atmosphärengrenzen folgen aus den für die Plattform geltenden Regeln und aus der medizinischen Überwachung; das Werkzeug darf weder für einen Konformitätsnachweis noch zur Festlegung eines Expositionsgrenzwerts verwendet werden.",
 lim3:"Sorption und spätere Freisetzung aus Oberflächen, Verkleidungen und Dämmstoffen sind nicht modelliert; bei Spurenstoffen und Feuchte kann das Spitzenwert und Erholungszeit erheblich verschieben.",
 lim4:"Scrubber, Dosierung und Entfeuchtung sind ideale Glieder erster Ordnung mit konstantem Wirkungsgrad; realer Sorbensdurchbruch, Vereisung des Registers, Vergiftung des Betts und Regeldynamik fehlen.",
 lim5:"Die Energiebilanz der Luft erfasst nur fühlbare Wärme: die latente Wärme, die die Besatzung mit ihrer Feuchte einbringt, und die latente Wärme, die mit dem Kondensat abgeht, heben einander auf; beide werden getrennt ausgewiesen und verschieben die Lufttemperatur nicht. Strahlung, thermische Masse von Struktur und Geräten sowie das instationäre Verhalten der Kühlfläche bleiben außerhalb des Modells.",
 lim6:"Verbrauchsstoffe, Durchhaltezeit und spezifische Leistung sind Größenordnungswerte zum Vergleich von Plattformen; sie sind keine Auslegungsdaten und decken Verpflegung, Trinkwasser, Sanitär und Belastbarkeit der Besatzung nicht ab.",
 disc:"Lehrmodell eines dichten Aufenthaltsraums: vollständig durchmischte Atmosphäre, Entfernungsglieder erster Ordnung, fühlbare Wärmebilanz und ein ausdrücklicher Kondensatterm, integriert mit einem Runge-Kutta-Verfahren vierter Ordnung mit festem Schritt. Für das Verständnis von Geschlossenheit und Störungszeiten, nicht für Auslegung, Zulassung oder Expositionsbewertung.",
 n_ch6:"Die Kurven beantworten eine Frage: Wenn sowohl der Entfernungspfad als auch die Außenluft ausfallen, wie lange steigt das Kohlendioxid vom eingegebenen Anfangswert bis zur Kurzzeitgrenze? Sie sind die geschlossene Lösung der Molbilanz des dichten, vollständig durchmischten Volumens, ausgewertet bei dem Druck und der Temperatur, die der Lauf im Abteil erreicht, und gezeichnet für das gewählte Volumen sowie für das halbe und das doppelte. Eine Besatzungsstärke, deren Antwort länger dauert als die doppelte Laufdauer, bleibt außerhalb der Zeichnung.",
 n_ch7:"Das obere Feld prüft den linearen Anstieg ohne Entfernung gegen die gespeicherten Referenzwerte. Das untere Feld prüft den exponentiellen Übergang gegen gespeicherte Referenzwerte mit drei Entfernungsvolumenströmen.",

 n_ch4:"Die erste Gruppe heizt oder kühlt die Luft; ihre Summe ist die Netto-Linie, und genau diese Linie bewegt die Temperatur. Die beiden latenten Kurven dienen der Auslegung der Entfeuchtung: die Besatzung bringt diese Wärme mit ihrer Feuchte ein, das Kondensat trägt dieselbe Wärme wieder hinaus; sie heben sich auf und verschieben die Lufttemperatur nicht.",

 bn_nlref:"Die Stoffwechselraten werden als Liter bei 20 °C und 101,325 kPa eingegeben. Ein Normliter nach DIN 1343 bezieht sich auf 0 °C und enthält 7,3 % mehr Stoff; eine bei 0 °C angegebene Rate muss vor der Eingabe um diesen Betrag erhöht werden.",
 l_hullc:"Als kondensierend angesetzte Hüllfläche",
 bn_hullc:"Die gesamte Hüllleitfähigkeit wird als kondensierende Fläche angesetzt, und der Stoffübergang wird über die Analogie von Wärme- und Stoffübertragung mit Lewis-Zahl eins aus dem Wärmeübergang gewonnen. Eine reale Hülle kondensiert nur dort, wo ihre Oberfläche unter dem Taupunkt liegt; das Kondensat auf diesem Weg ist daher eine obere Schranke.",
 l_oap:"Zustand der eintretenden Außenluft",
 bn_oap:"Die Außenluft wird beim eingegebenen Abteildruck und bei der Außentemperatur zugeführt und verlässt das Abteil wieder in dem Zustand, den es tatsächlich erreicht; die Entlastung hält den Druck. Die Zufuhr folgt damit dem eingegebenen Druck statt festen 101,325 kPa, und der Außenluftterm stimmt bei jedem zugelassenen Druck mit der Molanteilbilanz überein. Ein Abteil weit ab vom Druck seiner Umgebung bräuchte eigene Ansaugtechnik, die dieses Modell nicht führt.",
 l_oarh:"Relative Feuchte der Außenluft",
 bn_oarh:"Die Außenluft wird bei halber Sättigung ihrer eigenen Temperatur angesetzt. Wetterdaten werden nicht gelesen, ein Jahresgang wird nicht berücksichtigt.",
 l_pfan:"Druckerhöhung der Ventilatoren",
 bn_pfan:"Jedem Ventilator der Anlage wird dieselbe Gesamtdruckerhöhung zugeschrieben, um die Volumenströme in elektrische Leistung umzurechnen. Ein runder Lehrwert, keine Ventilatorauswahl.",
 l_cop:"Leistungszahl der Kälteanlage",

 h_lim:"Limites",
 lim1:"Volume unique parfaitement mélangé: stratification, poches locales derrière les équipements, zones mortes et retards de transport entre compartiments ne sont pas représentés, de sorte que les pics locaux peuvent dépasser largement la valeur affichée.",
 lim2:"Les seuils portés sur les graphiques sont des valeurs pédagogiques. Les limites contraignantes d’atmosphère découlent des règles en vigueur pour la plateforme et du suivi médical; cet outil ne doit servir ni à démontrer une conformité ni à fixer une limite d’exposition.",
 lim3:"La sorption puis le relargage par les surfaces, les habillages et les isolants ne sont pas modélisés; pour les traces et l’humidité, cela peut déplacer nettement le pic et le temps de retour à la normale.",
 lim4:"Épurateur, dosage et déshumidification sont traités comme des organes idéaux du premier ordre à rendement constant; percée réelle du sorbant, givrage de batterie, empoisonnement du lit et dynamique de régulation sont absents.",
 lim5:"Le bilan énergétique de l'air ne comporte que de la chaleur sensible : la chaleur latente apportée par l'humidité de l'équipage et celle qui part avec le condensat se compensent, elles sont donc indiquées à part et ne déplacent pas la température de l'air. Le rayonnement, la masse thermique de la structure et des équipements et le comportement transitoire de la batterie restent hors du modèle.",
 lim6:"Consommables, autonomie et puissance spécifique sont des ordres de grandeur pédagogiques pour comparer des plateformes; ce ne sont pas des données de dimensionnement et ils ne couvrent ni les vivres, ni l’eau de boisson, ni l’assainissement, ni l’endurance de l’équipage.",
 disc:"Modèle pédagogique d’un volume habitable étanche: atmosphère parfaitement mélangée, organes d’élimination du premier ordre, bilan de chaleur sensible et terme de condensat explicite, intégrés par un schéma de Runge-Kutta d’ordre quatre à pas fixe. À utiliser pour comprendre la fermeture et les délais de panne, pas pour concevoir, certifier ou évaluer une exposition.",
 n_ch6:"Les courbes répondent à une seule question : si le circuit d'élimination et l'air neuf sont perdus tous les deux, combien de temps le dioxyde de carbone met-il à monter du niveau initial saisi jusqu'à la limite court terme ? Elles sont la solution en forme fermée du bilan molaire du volume étanche parfaitement mélangé, évaluée à la pression et à la température atteintes dans le compartiment, et tracées pour le volume choisi, la moitié et le double. Un effectif dont la réponse dépasse le double de la durée de calcul reste hors du tracé.",
 n_ch7:"Le panneau supérieur vérifie la montée linéaire sans élimination face au jeu enregistré. Le panneau inférieur vérifie l’approche exponentielle face à un jeu enregistré à trois débits d’élimination.",

 bn_nlref:"Les débits métaboliques sont saisis en litres pris à 20 °C et 101,325 kPa. Un litre normal au sens de la DIN 1343 se rapporte à 0 °C et contient 7,3 % de matière en plus ; un débit donné à 0 °C doit donc être majoré d'autant avant d'être saisi ici.",
 l_hullc:"Surface de coque comptée comme condensante",
 bn_hullc:"Toute la conductance de coque est comptée comme surface de condensation, et la conductance de transfert de masse est déduite de la conductance thermique par l'analogie entre transferts de chaleur et de masse avec un nombre de Lewis égal à un. Une coque réelle ne condense que là où sa surface est sous le point de rosée : le condensat obtenu par cette voie est donc une borne supérieure.",
 l_oap:"État de l'air neuf entrant",
 bn_oap:"L'air neuf est fourni à la pression saisie pour le compartiment et à la température extérieure, et il ressort à l'état que le compartiment atteint réellement ; c'est la décharge qui tient la pression. L'apport suit donc la pression saisie au lieu d'une valeur figée de 101,325 kPa, et le terme d'air neuf s'accorde avec le bilan de fractions molaires à toute pression permise par le champ. Un compartiment maintenu loin de la pression de son environnement exigerait ses propres organes d'admission, absents de ce modèle.",
 l_oarh:"Humidité relative de l'air neuf",

  lim7:"La integración es un esquema de Runge-Kutta de cuarto orden con paso fijo, tomado de una estimación de estabilidad y limitado a 10 s; una simulación que necesitaría más de 60 000 pasos se hace con un paso mayor, y la página lo indica. En cuanto la fase gaseosa alcanza la saturación, el vapor sobrante se proyecta de vuelta sobre la curva de saturación al final de cada paso, un tratamiento de primer orden en esa rama: con el paso empleado desplaza la temperatura unos 5e-5 K y el condensado alrededor de un gramo por cada doscientos kilogramos, y converge linealmente al refinar el paso.", n_rq:"Las tasas metabólicas de CO2 y O2 se introducen por separado, de modo que el cociente respiratorio es exactamente su relación. Una dieta mixta en actividad ligera da unos 0,82-0,87; la base de la NASA asocia 1,0 kg de CO2 con 0,835 kg de O2 por persona y día, es decir 0,87. Los valores por defecto aquí (20 l/h y 0,84 kg/d) dan 0,76, el extremo de oxidación de grasas del rango fisiológico: compruebe el par antes de leer cuantitativamente la curva de oxígeno.", warn_cap:"Esta simulación necesita más pasos de los que permite el integrador, así que se ha hecho con un paso de %a s en lugar de los %b s que pedía la estimación de estabilidad. Acorte la duración si necesita el paso más fino.", rep_title:"Simulación de atmósfera cerrada", rep_end:"Estado al final", rep_qty:"Magnitud", rep_val:"Valor", rep_unit:"Unidad", b_pdf:"Informe PDF",

 disc:"Modelo didáctico de un volumen habitable estanco: atmósfera perfectamente mezclada, órganos de eliminación de primer orden, balance de calor sensible y un término explícito de condensado, integrados con un esquema de Runge-Kutta de cuarto orden y paso fijo. Sirve para entender el cierre y los tiempos de fallo, no para diseñar, certificar ni evaluar exposiciones.",
 n_ch6:"Las curvas responden a una sola pregunta: si se pierden a la vez la vía de depuración y el aire exterior, ¿cuánto tarda el dióxido de carbono en subir desde el nivel inicial introducido hasta el límite de corta duración? Son la solución en forma cerrada del balance molar del volumen estanco totalmente mezclado, evaluada a la presión y la temperatura que alcanza el compartimento, y se dibujan para el volumen elegido, la mitad y el doble. Una dotación cuya respuesta supera el doble de la duración del cálculo queda fuera del trazado.",

,pl:{"lg_trppm":"Zanieczyszczenia śladowe, ppm","lim7":"Całkowanie to schemat Runge-Kutty czwartego rzędu o stałym kroku, którego krok pochodzi z oszacowania stabilności i jest ograniczony do 10 s; przebieg, który wymagałby ponad 60 000 kroków, jest wykonywany z dłuższym krokiem, o czym informuje strona. Gdy faza gazowa osiągnie stan nasycenia, nadmiar pary jest rzutowany z powrotem na krzywą nasycenia na końcu każdego kroku, co stanowi pierwszorzędne podejście do tej gałęzi: w zastosowanym kroku przesuwa temperaturę o około 5e-5 K, a kondensat o około gram na dwieście kilogramów, i zbiega liniowo w miarę udoskonalania kroku.","n_rq":"Tempo metabolizmu CO2 i O2 jest wprowadzane oddzielnie, więc iloraz oddechowy jest równy wartościom, jakie daje ich stosunek. Dieta mieszana o niskiej aktywności daje około 0,82-0,87; bazowa wartość NASA to 1,0 kg CO2 i 0,835 kg O2 na osobę dziennie, czyli 0,87. Wartości domyślne (20 l/h i 0,84 kg/d) dają 0,76, czyli wartość graniczną utleniania tłuszczu w zakresie fizjologicznym — przed ilościowym odczytem krzywej tlenowej należy sprawdzić tę wartość.","warn_cap":"Ten przebieg wymaga więcej kroków, niż pozwala na to integrator, dlatego wykonano go z krokiem %a s zamiast %b s, o który wnioskowała ocena stabilności. Skróć czas trwania, jeśli potrzebujesz dokładniejszego kroku.","rep_title":"Bieg w atmosferze zamkniętej","rep_end":"Stan końca biegu","rep_qty":"Ilość","rep_val":"Wartość","rep_unit":"Jednostka","b_pdf":"Raport PDF","ttl":"Podtrzymywanie życia w atmosferze zamkniętej","sub":"Zamknięta przestrzeń mieszkalna · Dynamika CO2 / O2 / wilgoci / ciepła · Harmonogram awarii","lang":"Język","h_preset":"Skala zamknięcia","l_platform":"Platforma","l_closure":"Indeks zamknięcia","p_bld":"Budynek (wentylowany mechanicznie)","p_shp":"Zakwaterowanie na statku cywilnym","p_bat":"Łódź podwodna / batyskaf","p_ssk":"Okręt podwodny z napędem dieslowsko-elektrycznym, zanurzony","p_ssn":"Okręt podwodny o napędzie atomowym","p_cap":"Kapsuła kosmic "Pojedyncza, całkowicie wymieszana objętość: stratyfikacja, lokalne kieszenie za urządzeniami, martwe strefy i opóźnienia transportu między przedziałami nie są uwzględnione, więc lokalne szczyty mogą być znacznie wyższe niż pokazana wartość.","lim2":"Wartości progowe na wykresach mają charakter edukacyjny. Obowiązujące limity atmosferyczne wynikają z obowiązujących przepisów platformy oraz nadzoru medycznego; narzędzia tego nie należy używać do wykazywania zgodności ani do ustalania limitu narażenia.","lim3":"Sorpcja i późniejsze uwalnianie z powierzchni, wykładzin i izolacji nie są modelowane; w przypadku śladowych ilości zanieczyszczeń i wilgoci może to znacznie przesunąć zarówno szczyt, jak i czas odzyskiwania.","lim4":"Skruber, dozowanie i osuszanie są traktowane jako urządzenia idealne pierwszego rzędu o stałej wydajności; rzeczywisty przełom sorbentu, oszronienie wężownicy, zatrucie złoża i dynamika sterowania nie są uwzględniona.","lim5":"Bilans energetyczny powietrza dotyczy wyłącznie ciepła odczuwalnego: ciepło utajone, które załoga wnosi wraz z wilgocią, oraz ciepło utajone, które odchodzi wraz z kondensatem, kompensują się wzajemnie, dlatego oba są raportowane oddzielnie i żadne z nich nie zmienia temperatury powietrza. Promieniowanie, masa termiczna konstrukcji i wyposażenia oraz przejściowe zachowanie wężownicy znajdują się poza modelem.","lim6":"Materiały eksploatacyjne, wytrzymałość i moc właściwa to dane liczbowe rzędu wielkości, które służą do porównywania platform; nie są to dane dotyczące rozmiarów i nie obejmują pożywienia, wody pitnej, warunków sanitarnych ani wytrzymałości załogi.","disc":"Model dydaktyczny zamkniętej przestrzeni mieszkalnej: w pełni wymieszana atmosfera, urządzenia do usuwania pierwszego rzędu, bilans ciepła jawnego i wyraźny składnik kondensatu, zintegrowany ze schematem Runge-Kutty czwartego rzędu o stałym kroku. Służy do budowania intuicji dotyczącej zamknięcia i harmonogramów awarii, a nie do projektowania, certyfikacji czy oceny narażenia.","n_ch6":"Krzywe odpowiadają na jedno pytanie: jeśli zarówno ścieżka usuwania, jak i ścieżka do powietrza zewnętrznego zostaną utracone, ile czasu zajmie dwutlenkowi węgla wzniesienie się od wprowadzonego poziomu początkowego do granicy krótkoterminowej? Są one zamkniętym rozwiązaniem bilansu molowego zamkniętej, całkowicie wymieszanej objętości, obliczonym przy ciśnieniu i temperaturze w komorze, osiąganych w trakcie testu, i są rysowane dla wybranej objętości oraz dla połowy i dwukrotności tej objętości. Liczba członków załogi, której odpowiedź jest dłuższa niż dwukrotność czasu trwania testu, jest pomijana na wykresie.","n_ch7":"Górny panel weryfikuje liniowy wzrost bez usuwania w porównaniu z zapisaną serią wzrostów. Dolny panel weryfikuje wykładnicze podejście do stanu ustalonego w porównaniu z zapisaną serią z trzema prędkościami przepływu usuwania.","warn_neg":"Obliczenia nie były w stanie zachować każdej wartości fizycznie znaczącej przy tych danych wejściowych. Nie należy polegać na wartościach od tego momentu; należy zmienić dane wejściowe.","u_cont":"ciągły","u_ge":"nad","cat_open":"otwórz wyjaśnienie","cat_h":"Podstawa źródłowa","cat_cat":"Kategoria","cat_stat":"Status","cat_leg":"Wszystkie pięć kategorii, po jednym przycisku w każdej:","cat_close":"Zamknąć","cx_law":"Wymóg prawny. Jest wiążący sam w sobie i nie wymaga porozumienia między stronami.","cx_standard":"Norma, zharmonizowana lub dobrowolna. Staje się wiążąca tylko wtedy, gdy odwołuje się do niej ustawa, umowa lub specyfikacja.","cx_guidance":"Wytyczne branżowe lub uznana praktyka. Opierają się na doświadczeniu, a nie na prawie.","cx_method":"Metoda obliczeniowa: równanie, z którego pochodzi ta liczba. Jest ona ważna tylko w ramach założeń, na podstawie których została wyprowadzona.","cx_rule":"Zasada praktyczna: przewodnik po rzędzie wielkości. Używaj go do sprawdzania, czy odpowiedź jest prawdopodobna, nigdy jako wartości projektowej.","sx_conf":"Potwierdzono: wartość została sprawdzona pod kątem źródła, z którego pochodzi.","sx_asm":"Dotyczy założeń: wartość obowiązuje wyłącznie przy założeniach z nią związanych; sprawdź je zanim na niej polegasz.","cx_mix":"Te pięć kategorii zostało celowo rozdzielonych: wymóg prawny nie ma takiej samej mocy jak praktyka branżowa, a zasada praktyczna nie ma żadnej z nich. Nigdy nie łącz ich w jedną wartość.","warn_range":"Wprowadzono wartość spoza dozwolonego zakresu i przywrócono ją do najbliższej dozwolonej wartości. Sprawdź te pola:","warn_div":"Po wprowadzeniu tych danych stan komory przekroczył zakres fizycznie zrozumiały, więc pomiar został przerwany, a wynik nie jest wyświetlany. Zmień objętość, liczebność załogi lub bilans cieplny.","val_warn":"Kontrola spójności wewnętrznej nie powiodła się z obecnymi danymi wejściowymi. Podane liczby mogą być błędne — nie należy na nich polegać.","l_gwat":"Zużycie wody, kg/d","bn_gwat":"Woda do picia, przygotowywania posiłków i celów higienicznych pobrana ze sklepu na osobę i dzień; odzyskany kondensat jest raportowany osobno i nie jest zwracany do sklepu.","lg_qli":"Ludzie (utajeni)","lg_qnet":"Siatka w powietrze","b_wuse":"Woda pobrana ze sklepu, kg","n_ch4":"Pierwsza grupa to czynniki ogrzewające lub chłodzące powietrze; sumują się one do linii netto, a ta linia to właśnie czynnik zmieniający temperaturę. Dwie krzywe utajone służą do doboru wielkości instalacji wilgoci: załoga wprowadza to ciepło wraz z wilgocią, a kondensat ponownie je odprowadza, więc znoszą się one i nie zmieniają temperatury powietrza.","v12":"Bilans ciepła odczuwalnego zamyka się: zmagazynowana szybkość równa się źródłom pomniejszonym o pochłaniacze w każdym punkcie próbkowania","v13":"Wilgotność nigdy nie przekracza poziomu nasycenia, a punkt rosy nigdy nie przekracza temperatury powietrza","v14":"Krzywa pozostałej wody przedstawia wodę faktycznie pobraną z magazynu","v15":"Bieg wykraczający poza zakres fizycznie znaczący jest zgłaszany, a nie automatycznie blokowany","v16":"Stała let LANG = "en";

const el = (id) => document.getElementById(id);

/* ================= constants & helpers ================= */
const RGAS = 8.314462618;
const MM = {N2:0.0280134, O2:0.0319988, CO2:0.0440095, H2O:0.0180153, TR:0.050};
const CP = 1005, CV = 718, HFG = 2450e3, RHO_REF = 1.2;
const P_STD = 101325, T_STD = 293.15;            // reference state of the entered litre
const MOL_PER_NL = P_STD * 1e-3 / (RGAS * T_STD); // mol per litre at that reference state
/* Coefficients that used to sit unnamed inside the equations. Each one is listed in
   the source-basis table with its own category and status badge. */
const FAN_DP   = 1200;   // Pa, assumed total pressure rise of every fan
const COP_COOL = 3.0;    // -, assumed coefficient of performance of the cooling plant
const O2_KWH   = 4.5;    // kWh per kg of oxygen released by the on-board generator
const COIL_CF  = 0.85;   // -, share of the air brought to the coil dew point
const OA_RH    = 0.5;    // -, assumed relative humidity of the outside air
const OUT_CO2 = 420e-6, OUT_O2 = 0.2095;

function fmt(x, d){
  if (x === null || x === undefined || !isFinite(x)) return "—";
  const v = Number(x);
  if (Math.abs(v) >= 1e6) return v.toExponential(2).replace("e+","e");
  return v.toFixed(d === undefined ? 1 : d);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function clamp(x,a,b){ return x<a?a:(x>b?b:x); }
function num(id, def){ const v = parseFloat(el(id).value); return isFinite(v) ? v : def; }
function psat(TC){ return 610.94 * Math.exp(17.625 * TC / (TC + 243.04)); }
function dewC(pv){ if (!(pv > 10)) return -60; const l = Math.log(pv/610.94); return 243.04*l/(17.625-l); }
function xhum(pv, p){ const d = Math.max(p - pv, 1); return 0.62198 * pv / d; }
function smoothOff(t, tf, ramp){ return 0.5 * (1 - Math.tanh((t - tf) / ramp)); }

 [100,0.5,0.393469,0.276151],[110,0.55,0.42305,0.28849],[120,0.6,0.451188,0.299289]]};
/* Stored consumables rate used as a sanity reference: kg per person and day */
const REF_CONS_RATE = 1.15;

/* ================= thresholds ================= */
