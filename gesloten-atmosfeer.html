const DGC_EQ = [
 "Mixed volume, ideal gas: p = (sum n_i) R T / V,   y_i = n_i / sum n_i,   p_i = y_i p",
 "dn_CO2/dt = N g_CO2 + n_in,CO2 - y_CO2 (n_out + k_leak n) - eta_s V_s n_CO2 / V",
 "dn_O2/dt  = n_in,O2 - y_O2 (n_out + k_leak n) - N g_O2 + m_O2,feed",
 "dn_H2O/dt = N g_H2O + n_in,H2O - y_H2O (n_out + k_leak n) - m_coil/M_H2O - m_hull/M_H2O",
 "dn_TR/dt  = N g_TR - y_TR (n_out + k_leak n) - eta_tr V_tr n_TR / V",
 "m_air c_v dT/dt = N q_s + Q_eq - Q_cool - UA (T - T_hull) - rho c_p V_oa (T - T_oa) - m_da c_p (T - T_coil) f_coil",
 "Coil condensate: m_coil = rho V_d (x(p_v,p) - x(p_sat(T_coil),p)) f_coil,  x = 0.62198 p_v/(p - p_v)",
 "Hull condensate (Lewis number one): m_hull = (UA/(rho c_p)) (p_v - p_sat(T_hull))/(R T)",
 "Saturation limit: n_H2O <= p_sat(T) V/(R T); the surplus is moved to the condensate at the end of each step",
 "O2 dosing: m_feed = m_max min(max((p_O2,set - p_O2)/1500 Pa, 0), 1) · (store and failure availability)",
 "p_sat(T) = 610.94 exp(17.625 T / (T + 243.04)) Pa  (Magnus form, T in °C)",
 "Integration: classical fourth-order Runge-Kutta at a fixed step from a stability estimate"
];
function dgcRecord(){
  if (!LAST || !LAST.run) return null;
  const P = LAST.P, run = LAST.run;
  const I = dgcInputs(), O = dgcOutputs();
  const w = [];
  if (run.diverged) w.push(T("warn_div"));
  if (run.clipped) w.push(T("warn_neg"));
  if (run.capped) w.push(T("warn_cap").replace("%a", fmt(run.dt,1)).replace("%b", fmt(run.dtWanted,1)));
  if (run.saturated) w.push(T("lim7"));
  if (P.badInputs && P.badInputs.length) w.push(T("warn_range"));
  if (P.rq > 0 && (P.rq < 0.75 || P.rq > 0.95)) w.push(T("n_rq"));
  return {
    inputs:I.inputs, outputs:O.outputs, units:Object.assign({}, I.units, O.units),
    model:{equations:DGC_EQ,
      ranges:["Every input field carries its own range and a value outside it is brought back "
             +"and reported; the air temperature is required to stay inside 180-400 K and a run "
             +"that leaves that band is reported instead of being shown.",
             "One fully mixed volume, ideal gas, first-order removal devices, sensible heat balance."],
      notes:[T("lim1"), T("lim4"), T("lim5"), T("lim7"), T("n_rq")]},
    warnings:w};
}
function dgcSections(){
  if (!LAST || !LAST.run || LAST.run.diverged) return [];
  const O = dgcOutputs();
  const rows = Object.keys(O.outputs).map(k => [k, (typeof O.outputs[k] === "number") ? fmt(O.outputs[k], 4) : String(O.outputs[k]), O.units[k] || ""]);
  const cr = LASTCROSS.map(r => [r[0], r[1]]);
  const out = [{title:T("rep_end"), cols:"2fr 1fr .8fr",
                head:[T("rep_qty"), T("rep_val"), T("rep_unit")], rows:rows}];
  if (cr.length) out.push({title:T("h_cross"), cols:"2fr 1fr", head:[T("rep_qty"), T("rep_val")], rows:cr});
  return out;
}
/* Handoff: the compartment state another tool can actually use — temperature, total
   pressure and the humidity ratio of the air in the volume, plus the outside-air flow.
   Nothing is accepted: every input here is a design parameter of the compartment. */
function dgcHandoff(){
  if (!LAST || !LAST.run || LAST.run.diverged) return null;
  const tr = LAST.run.tr, n = tr.t.length - 1, P = LAST.P;
  const p = tr.p[n]*1000, pv = tr.pv[n]*1000;
  const q = {T:{value:tr.tC[n]+273.15, unit:"K"}, p:{value:p, unit:"Pa"},
             w:{value:0.62198*pv/Math.max(p-pv,1), unit:"kg/kg"}};
  if (P.oa > 0) q.Vdot = {value:P.oa, unit:"m3/s"};
  return {quantities:q};
}

       box.appendChild(note("n_thr", "n_thr"));
     }},
    {slot:"results", id:"ga-cmp", title:() => T("h_cmp"), learn:"comparison",
     render:(box) => {
       box.appendChild(mk("div", {class:"ga-scroll"}, '<table class="ga-t" id="cmptbl"></table>'));
       box.appendChild(note("n_cmp", "n_cmp"));
     }},
    {slot:"results", id:"ga-bal", title:() => T("h_bal"), learn:"budget",
     render:(box) => {
       box.appendChild(mk("div", {class:"ga-scroll"}, '<table class="ga-t" id="baltbl"></table>'));
       box.appendChild(note("n_bal", "n_bal"));
     }},
    {slot:"results", id:"ga-basis", title:() => T("h_basis"), learn:"basis",
     render:(box) => {
       box.appendChild(note("n_basis", "n_basis"));
       box.appendChild(mk("div", {class:"ga-scroll"},
         '<table class="ga-t" id="basistbl"><tbody></tbody></table>'));
       box.appendChild(note("n_cat", "cat_leg"));
       box.appendChild(mk("div", {class:"catleg", id:"catleg"}, catLegend()));
     }}
  ];

  /* the dock: the eight charts, full width, two abreast above 1120 px */
  [["ch1","h_ch1",null,"charts"], ["ch2","h_ch2",null,"charts"], ["ch3","h_ch3",null,"charts"],
   ["ch4","h_ch4","n_ch4","heat"], ["ch5","h_ch5",null,"charts"], ["ch6","h_ch6","n_ch6","endurance"]
  ].forEach(c => {
    list.push({slot:"dock", id:"ga-" + c[0], title:() => T(c[1]), learn:c[3],
      render:(box) => {
        box.appendChild(mk("div", {id:c[0]}));
        box.appendChild(mk("div", {class:"lg", id:"lg" + c[0].slice(2)}));
        if (c[2]) box.appendChild(note(c[2], c[2]));
      }});
  });
  list.push({slot:"dock", id:"ga-ch7", title:() => T("h_ch7"), learn:"refdata",
    render:(box) => {
      box.appendChild(mk("div", {id:"ch7"}));
      box.appendChild(mk("div", {class:"lg", id:"lg7"}));
      box.appendChild(mk("div", {id:"ch8"}));
      box.appendChild(mk("div", {class:"lg", id:"lg8"}));
      box.appendChild(note("n_ch7", "n_ch7"));
    }});
  return list;
}

/* ================= the stage =================
   The time the diagrams show, then the two schematics. Declared as a region builder,
   not as a call after boot, so it is rebuilt with everything else when the language
   changes. */
function buildStage(host, app){
  const box = mk("section", {class:"dgu-panel", "data-dgu-panel":"ga-time",
                             "data-learn-topic":"timeline"});
  const h = mk("div", {class:"dgu-panel-h"});
  h.appendChild(mk("h2", {class:"dgu-panel-t"}, esc(T("h_time"))));
  h.appendChild(app.learnButton("timeline"));
  box.appendChild(h);
  const bar = mk("div", {class:"tbar"});
  const b = mk("button", {type:"button", class:"dgu-btn", id:"btnPlay"});
  b.textContent = T("b_play");
  const r = mk("input", {type:"range", id:"i_tplay", min:"0", max:"1000", step:"1",
                         value:"1000", "aria-label":T("h_time")});
  const v = mk("span", {class:"val", id:"v_tnow"});
  v.textContent = "—";
  bar.appendChild(b); bar.appendChild(r); bar.appendChild(v);
  box.appendChild(bar);
  host.appendChild(box);
  b.addEventListener("click", togglePlay);
  r.addEventListener("input", () => {
    stopPlay();
    PLAYF = clamp(parseFloat(r.value) / 1000, 0, 1);
    drawSchemes();
  });

  const s1 = app.stage({minHeight:280, render:() => {},
    a11y:() => { const k = el("objkey"); return k ? T("h_obj") + ". " + k.textContent : ""; }});
  s1.node.setAttribute("data-learn-topic", "objlayout");
  s1.body.appendChild(mk("h2", {class:"ga-h"}, esc(T("h_obj"))));
  s1.body.appendChild(mk("div", {class:"schwrap", id:"objsvg"}));
  s1.body.appendChild(mk("div", {class:"skey", id:"objkey"}));
  s1.body.appendChild(note("n_obj", "n_obj"));

  const s2 = app.stage({minHeight:280, render:() => {},
    a11y:() => { const k = el("airkey"); return k ? T("h_air") + ". " + k.textContent : ""; }});
  s2.node.setAttribute("data-learn-topic", "airpath");
  s2.body.appendChild(mk("h2", {class:"ga-h"}, esc(T("h_air"))));
  s2.body.appendChild(mk("div", {class:"schwrap", id:"airsvg"}));
  s2.body.appendChild(mk("div", {class:"lg", id:"airlg"}));
  s2.body.appendChild(mk("div", {class:"skey", id:"airkey"}));
  s2.body.appendChild(note("n_air", "n_air"));
}

/* the footer: model notes, limitations and the tool's own disclaimer */
function buildFooter(host){
  const d = mk("details");
  d.appendChild(mk("summary", null, esc(T("h_lim"))));
  let li = "";
  for (let i = 1; i <= 7; i++) li += '<li id="lim' + i + '">' + esc(T("lim" + i)) + '</li>';
  d.appendChild(mk("ul", {id:"lim-out"}, li));
  d.appendChild(mk("div", {class:"ga-eq"}, DGC_EQ.map(e => esc(e)).join("<br>")));
  host.appendChild(d);
  host.appendChild(mk("div", {class:"ga-note", id:"disclaimer"}, esc(T("disc"))));
  /* the built-in check sheet: computed on every run, out of the interface, exactly as
     it was before the port */
  host.appendChild(mk("div", {class:"ga-flags", id:"val-out", hidden:"hidden"}));
}

/* ================= results ================= */
function buildResults(){
  syncWarnBars();
  return {
    tiles:LASTKPI.map((k, i) => ({label:k[1], value:k[0], headline:i < 3})),
    tables:[{title:() => T("h_cross"), rows:LASTCROSS}]
  };
}

/* The framework appends its results panel after every panel the tool declared, so
   the answer would sit under four reference tables. The placement law puts it first:
   right under the warning bars, which is where the end-of-run state was before the
   port. */
function orderResults(app){
  const host = app.regions && app.regions.results;
  const view = app.resultsView && app.resultsView.node;
  const last = el("valwarn");
  if (!host || !view || !last || last.parentNode !== host) return;
  if (view.previousElementSibling !== last) host.insertBefore(view, last.nextSibling);
}

/* the provenance badges qualify the field they sit on; the framework builds the
   label, so they are hung on it once the field exists */
function attachBadges(){
  Object.keys(BADGED).forEach(k => {
    const f = document.querySelector('[data-dgu-field="f-' + k + '"] .dgu-flabel');
    if (!f || f.querySelector(".bdg")) return;
    const b = BADGED[k];
    f.insertAdjacentHTML("beforeend", badge(b[0], b[1], b[2]));
  });
  applyBadges();
}

/* min, max and step were attributes on the inputs before the port and the browser's
   stepper and validity reporting still read them, so the tool writes them. They are
   deliberately NOT declared to the framework: the ranges are applied where they
   always were, in readParams(), which brings a value back to the nearest allowed one
   AND reports the correction. A silent clamp at the control would take that warning
   out of the calculation record. */
function applyNativeRanges(){
  Object.keys(RANGE).forEach(k => {
    const c = document.getElementById("f-" + k + "-c");
    if (!c) return;
    c.min = String(RANGE[k][0]); c.max = String(RANGE[k][1]); c.step = String(STEP[k]);
  });
}

/* Framework defect, repaired locally; it belongs upstream. rebuild() — which runs on
   every language change — builds a NEW App, copies its own properties onto the old
   object and points DiagramUI.current at the old one, while the controls it just
   drew are bound to the new one. After two rebuilds DiagramUI.current is a
   generation behind the live screen, so anything that REPLACES the state object
   (Reset, examples) updates one instance and not the other. Every callback the
   framework makes hands over the instance that made it, so the tool keeps its own
   pointer on that one and keeps the published one on the same state object. */
function live(app){
  if (!app) return;
  /* never let a generation whose nodes are already off the page take the pointer */
  if (app.node && !document.contains(app.node)) return;
  UI = app;
  if (window.DiagramUI && DiagramUI.current && DiagramUI.current !== app) {
    DiagramUI.current.state = app.state;
  }
}

/* ================= boot ================= */
function boot(){
  initLang();
  if (!window.DiagramUI || DiagramUI.api !== "tools.petrov.re/ui/v1"){ bootBare(); dgcInit(); return; }
  const PANELS = panelDefs();
  UI = DiagramUI.app({
    id:"gesloten-atmosfeer", mount:"#app", layout:"calculator", compute:"live",
    lang:LANG, state:state, history:false,
    subtitle:() => T("sub"),
    strings:{results:() => T("h_state")},
    defaults:() => Object.assign({}, ST(), presetVals(ST().preset)),
    learn:learnData(),
    panels:PANELS,
    regions:{results:(host) => warnBox(host), stage:(host, app) => buildStage(host, app)},
    footer:(host) => buildFooter(host),
    on:{
      compute:(s, app) => { live(app); recompute(); return buildResults(); },
      change:(key, v, app) => { live(app); if (key === "preset"){ stopPlay(); PLAYF = 1; } },
      reset:(fresh, app) => { live(app); state = fresh; },
      lang:(code) => { LANG = code; stopPlay(); relabelUnits(PANELS); },
      ready:(app) => { live(app); orderResults(app); attachBadges(); applyNativeRanges(); }
    }
  });
  UI.ready();
  dgcInit();
  /* a stable driving surface for the benchmark harness, which used to set the input
     elements by id and call recompute() */
  window.__gesloten = {ui:() => UI, state:() => ST(), recompute:recompute, last:() => LAST,
                       set:(o) => { Object.assign(ST(), o); UI.sync(); UI.run(); }};
}

/* ================= without diagram-ui.js =================
   The file can be blocked, 404 or stale. The physics, the record, the permalink, the
   report, the python export and the shared bar all live below it, so the page still
   works: it draws its own plain form and its own result containers, and reserves the
   space the shared chrome occupies. */
let BARE = false, BAREFIELDS = [], bareTimer = null;
function scheduleBare(){
  if (bareTimer) clearTimeout(bareTimer);
  bareTimer = setTimeout(() => { bareTimer = null; recompute(); }, 40);
}
function syncBare(){
  const st = ST();
  BAREFIELDS.forEach(f => { if (st[f[0]] != null) f[1].value = String(st[f[0]]); });
}
function renderBare(){
  const k = el("kpis");
  if (k) k.innerHTML = LASTKPI.map(x => '<div class="b"><b>' + esc(x[0]) + '</b> ' + esc(x[1]) + '</div>').join("");
  const c = el("crosstbl");
  if (c) c.querySelector("tbody").innerHTML = LASTCROSS.map(r =>
    '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>').join("");
  syncWarnBars();
}
function bootBare(){
  BARE = true;
  const box = document.getElementById("app") || document.body;
  box.innerHTML = "";
  const h1 = mk("h1");
  h1.textContent = T("ttl");
  box.appendChild(h1);
  box.appendChild(mk("p", {class:"ga-note"}, esc(T("sub"))));
  /* the framework owns the language control, and the framework is what is missing,
     so the degraded page carries one of its own rather than stranding a reader in a
     language they did not choose */
  const lsel = mk("select", {id:"i_lang", "aria-label":T("lang")});
  ["en","uk","de","nl","fr","es","pl"].forEach(l => {
    const o = mk("option", {value:l});
    o.textContent = {en:"English", uk:"Українська", de:"Deutsch", nl:"Nederlands",
                     fr:"Français", es:"Español"}[l];
    lsel.appendChild(o);
  });
  lsel.value = LANG;
  lsel.addEventListener("change", () => {
    LANG = lsel.value;
    try { localStorage.setItem("diagram_lang", LANG); } catch(e){}
    document.documentElement.lang = LANG;
    if (window.Diagram && Diagram.setLang) Diagram.setLang(LANG);
    stopPlay(); BAREFIELDS = []; bootBare();
  });
  box.appendChild(mk("label", {for:"i_lang"}, esc(T("lang"))));
  box.appendChild(lsel);
  warnBox(box);
  const st = ST();
  const groups = [["h_preset", []], ["h_geom", ["V","N","p0","T0","rh0","co20"]],
    ["h_meta", ["gco2","go2","gh2o","qs","gtr","gwat"]],
    ["h_sys", ["oa","toa","vs","eta","o2max","po2set","vd","tcoil","qc","tset","qe","ua",
               "thull","vtr","etatr","leak"]],
    ["h_store", ["so2","ssorb","sratio","swat","sener"]],
    ["h_run", ["dur","ftime","lkr"]]];
  groups.forEach(g => {
    box.appendChild(mk("h2", {class:"ga-h"}, esc(T(g[0]))));
    if (g[0] === "h_preset"){
      const sel = mk("select", {id:"i_preset", "aria-label":T("l_platform")});
      PRESET_KEYS.forEach(k => {
        const o = mk("option", {value:k}); o.textContent = T("p_" + k); sel.appendChild(o);
      });
      sel.value = st.preset;
      sel.addEventListener("change", () => {
        st.preset = sel.value; Object.assign(st, presetVals(sel.value));
        stopPlay(); PLAYF = 1; syncBare(); recompute();
      });
      box.appendChild(sel);
    }
    g[1].forEach(k => {
      const id = "i_" + k, L = labelOf(k);
      const lab = mk("label", {for:id});
      lab.textContent = L.label + (L.unit ? ", " + L.unit : "");
      const inp = mk("input", {type:"number", id:id, min:String(RANGE[k][0]),
                               max:String(RANGE[k][1]), step:String(STEP[k])});
      inp.value = String(st[k]);
      inp.addEventListener("input", () => {
        st[k] = inp.value === "" ? null : parseFloat(inp.value); scheduleBare();
      });
      box.appendChild(lab); box.appendChild(inp);
      BAREFIELDS.push([k, inp]);
    });
    if (g[0] === "h_run"){
      const sel = mk("select", {id:"i_fail", "aria-label":T("l_fail")});
      ["none","co2","o2","deh","heat","leak"].forEach(k => {
        const o = mk("option", {value:k}); o.textContent = T("f_" + k); sel.appendChild(o);
      });
      sel.value = st.fail;
      sel.addEventListener("change", () => { st.fail = sel.value; recompute(); });
      box.appendChild(mk("label", {for:"i_fail"}, esc(T("l_fail"))));
      box.appendChild(sel);
      BAREFIELDS.push(["fail", sel]);
    }
  });
  const bar = mk("div", {class:"tbar"});
  const pb = mk("button", {type:"button", id:"btnPlay"});
  pb.textContent = T("b_play");
  const rg = mk("input", {type:"range", id:"i_tplay", min:"0", max:"1000", step:"1",
                          value:"1000", "aria-label":T("h_time")});
  const tn = mk("span", {class:"val", id:"v_tnow"});
  bar.appendChild(pb); bar.appendChild(rg); bar.appendChild(tn);
  box.appendChild(mk("h2", {class:"ga-h"}, esc(T("h_time"))));
  box.appendChild(bar);
  pb.addEventListener("click", togglePlay);
  rg.addEventListener("input", () => {
    stopPlay(); PLAYF = clamp(parseFloat(rg.value) / 1000, 0, 1); drawSchemes();
  });
  [["h_obj", '<div class="schwrap" id="objsvg"></div><div class="skey" id="objkey"></div><div class="ga-note">' + esc(T("n_obj")) + '</div>'],
   ["h_air", '<div class="schwrap" id="airsvg"></div><div class="lg" id="airlg"></div><div class="skey" id="airkey"></div><div class="ga-note">' + esc(T("n_air")) + '</div>'],
   ["h_state", '<div id="kpis"></div>'],
   ["h_cross", '<table class="ga-t" id="crosstbl"><tbody></tbody></table>'],
   ["h_thr", '<table class="ga-t" id="thrtbl"><tbody></tbody></table>'],
   ["h_cmp", '<div class="ga-scroll"><table class="ga-t" id="cmptbl"></table></div>'],
   ["h_bal", '<table class="ga-t" id="baltbl"></table>'],
   ["h_basis", '<table class="ga-t" id="basistbl"><tbody></tbody></table><div class="catleg" id="catleg"></div>'],
   ["h_ch1", '<div id="ch1"></div><div class="lg" id="lg1"></div>'],
   ["h_ch2", '<div id="ch2"></div><div class="lg" id="lg2"></div>'],
   ["h_ch3", '<div id="ch3"></div><div class="lg" id="lg3"></div>'],
   ["h_ch4", '<div id="ch4"></div><div class="lg" id="lg4"></div>'],
   ["h_ch5", '<div id="ch5"></div><div class="lg" id="lg5"></div>'],
   ["h_ch6", '<div id="ch6"></div><div class="lg" id="lg6"></div>'],
   ["h_ch7", '<div id="ch7"></div><div class="lg" id="lg7"></div><div id="ch8"></div><div class="lg" id="lg8"></div>']
  ].forEach(c => {
    box.appendChild(mk("h2", {class:"ga-h"}, esc(T(c[0]))));
    box.appendChild(mk("div", null, c[1]));
  });
  buildFooter(box);
  el("catleg").innerHTML = catLegend();
  recompute();
  /* the safe-area repair of spec 4.4 lives in the file that is missing */
  const reserve = () => {
    const b = document.getElementById("dgc-bar"), g = document.getElementById("eng-disc-badge");
    const h = Math.max(b ? b.getBoundingClientRect().height : 0,
                       g ? g.getBoundingClientRect().height : 0);
    document.body.style.paddingBottom = (h + 12) + "px";
  };
  reserve(); setTimeout(reserve, 400); window.addEventListener("resize", reserve);
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
