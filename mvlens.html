  "summary": {
    "en": "Which lens and camera see my part sharp enough: focal length from sensor, field of view and working distance, pixels per feature, depth of field, diffraction and MTF at Nyquist, best f-number, motion blur and exposure, image circle and mount, telecentric check — with 75 Sony industrial sensors.",
    "uk": "Який об’єктив і камера побачать деталь достатньо різко: фокусна відстань за сенсором, полем зору й робочою відстанню, пікселі на деталь, глибина різкості, дифракція й MTF на частоті Найквіста, найкраща діафрагма, розмиття руху й експозиція, коло зображення й кріплення, перевірка телецентрики — з 75 промисловими сенсорами Sony.",
    "de": "Welches Objektiv und welche Kamera sehen mein Teil scharf genug: Brennweite aus Sensor, Sichtfeld und Arbeitsabstand, Pixel pro Merkmal, Schärfentiefe, Beugung und MTF bei Nyquist, beste Blende, Bewegungsunschärfe und Belichtung, Bildkreis und Anschluss, Telezentrie-Prüfung — mit 75 industriellen Sony-Sensoren.",
    "nl": "Welke lens en camera zien mijn onderdeel scherp genoeg: brandpuntsafstand uit sensor, beeldveld en werkafstand, pixels per detail, scherptediepte, buiging en MTF bij Nyquist, beste diafragma, bewegingsonscherpte en belichting, beeldcirkel en vatting, telecentrische controle — met 75 industriële Sony-sensoren.",
    "fr": "Quel objectif et quelle caméra voient ma pièce assez nette : focale à partir du capteur, du champ et de la distance de travail, pixels par détail, profondeur de champ, diffraction et FTM à Nyquist, meilleure ouverture, flou de bougé et pose, cercle image et monture, contrôle télécentrique — avec 75 capteurs industriels Sony.",
    "es": "Qué objetivo y qué cámara ven mi pieza con nitidez suficiente: focal a partir del sensor, el campo y la distancia de trabajo, píxeles por detalle, profundidad de campo, difracción y MTF en Nyquist, mejor número f, desenfoque de movimiento y exposición, círculo de imagen y montura, comprobación telecéntrica — con 75 sensores industriales Sony.",
    "pl": "Jaki obiektyw i kamera zobaczą detal wystarczająco ostro: ogniskowa z sensora, pola widzenia i odległości roboczej, piksele na szczegół, głębia ostrości, dyfrakcja i MTF przy Nyquiście, najlepsza przysłona, rozmycie ruchu i ekspozycja, koło obrazowe i mocowanie, kontrola telecentryczności — z 75 przemysłowymi sensorami Sony."

  "description": {
    "en": "Choose a sensor from Sony’s public industrial list (or type your own), enter the field of view, the working distance and the smallest feature. The tool finds the ideal focal length and the longest standard lens that still covers the field, lists the neighbouring focal lengths with the distance each would need, and checks every requirement: pixels across the feature, depth of field for the object’s depth range, the Airy disc against the pixel, the system MTF at the sensor’s Nyquist frequency, the f-number that gives the sharpest image over the depth range (where diffraction overtakes defocus), motion blur for a moving part and the longest allowed exposure, the image circle, lens format and mount, and the perspective error of a gauging task with the telecentric alternative. A second sensor can be compared side by side.",
    "uk": "Виберіть сенсор із публічного переліку Sony (або введіть свій), задайте поле зору, робочу відстань і найменшу деталь. Інструмент знаходить ідеальну фокусну відстань і найдовший стандартний об’єктив, що ще охоплює поле, показує сусідні фокусні з потрібною для кожної відстанню і перевіряє всі вимоги: пікселі на деталь, глибину різкості для діапазону глибини об’єкта, диск Ейрі проти пікселя, MTF системи на частоті Найквіста сенсора, діафрагму з найрізкішим зображенням у діапазоні глибини (де дифракція переважає розфокусування), розмиття руху й найдовшу допустиму експозицію, коло зображення, формат об’єктива й кріплення, а також похибку перспективи при вимірюваннях і телецентричну альтернативу. Можна порівняти другий сенсор поруч.",
    "de": "Wählen Sie einen Sensor aus Sonys öffentlicher Industrieliste (oder geben Sie einen eigenen ein), tragen Sie Sichtfeld, Arbeitsabstand und kleinstes Merkmal ein. Das Werkzeug ermittelt die ideale Brennweite und das längste Standardobjektiv, das das Feld noch abdeckt, listet die benachbarten Brennweiten mit dem jeweils nötigen Abstand und prüft jede Anforderung: Pixel über dem Merkmal, Schärfentiefe für den Tiefenbereich des Objekts, Airy-Scheibe gegen Pixel, System-MTF bei der Nyquist-Frequenz des Sensors, die Blende mit dem schärfsten Bild über den Tiefenbereich (wo Beugung den Defokus überholt), Bewegungsunschärfe eines bewegten Teils und die längste zulässige Belichtung, Bildkreis, Objektivformat und Anschluss sowie den Perspektivfehler einer Messaufgabe mit der telezentrischen Alternative. Ein zweiter Sensor lässt sich daneben vergleichen.",
    "nl": "Kies een sensor uit Sony’s openbare industriële lijst (of voer uw eigen in), geef beeldveld, werkafstand en kleinste detail op. De tool vindt de ideale brandpuntsafstand en de langste standaardlens die het veld nog dekt, toont de naburige brandpuntsafstanden met de afstand die elk nodig heeft en controleert elke eis: pixels over het detail, scherptediepte voor het dieptebereik van het object, de Airy-schijf tegenover de pixel, de systeem-MTF bij de Nyquist-frequentie van de sensor, het diafragma met het scherpste beeld over het dieptebereik (waar buiging de defocus inhaalt), bewegingsonscherpte van een bewegend onderdeel en de langste toegestane belichting, beeldcirkel, lensformaat en vatting, en de perspectieffout van een meettaak met het telecentrische alternatief. Een tweede sensor kan ernaast worden vergeleken.",
    "fr": "Choisissez un capteur dans la liste industrielle publique de Sony (ou saisissez le vôtre), indiquez le champ, la distance de travail et le plus petit détail. L’outil trouve la focale idéale et la plus longue focale standard qui couvre encore le champ, liste les focales voisines avec la distance que chacune demanderait et vérifie chaque exigence : pixels sur le détail, profondeur de champ pour la plage de profondeur de l’objet, tache d’Airy face au pixel, FTM du système à la fréquence de Nyquist du capteur, l’ouverture qui donne l’image la plus nette sur la plage de profondeur (là où la diffraction dépasse la défocalisation), flou de bougé d’une pièce en mouvement et pose maximale, cercle image, format d’objectif et monture, ainsi que l’erreur de perspective d’une mesure avec l’alternative télécentrique. Un second capteur peut être comparé côte à côte.",
    "es": "Elija un sensor de la lista industrial pública de Sony (o escriba el suyo), indique el campo, la distancia de trabajo y el detalle mínimo. La herramienta halla la focal ideal y la focal estándar más larga que aún cubre el campo, lista las focales vecinas con la distancia que necesitaría cada una y comprueba cada requisito: píxeles sobre el detalle, profundidad de campo para el rango de profundidad del objeto, disco de Airy frente al píxel, MTF del sistema en la frecuencia de Nyquist del sensor, el número f con la imagen más nítida en el rango de profundidad (donde la difracción supera al desenfoque), desenfoque de movimiento de una pieza móvil y la exposición máxima, círculo de imagen, formato de objetivo y montura, y el error de perspectiva de una medición con la alternativa telecéntrica. Se puede comparar un segundo sensor al lado.",
    "pl": "Wybierz sensor z publicznej listy przemysłowej Sony (lub wpisz własny), podaj pole widzenia, odległość roboczą i najmniejszy szczegół. Narzędzie wyznacza idealną ogniskową i najdłuższy standardowy obiektyw, który jeszcze obejmuje pole, pokazuje sąsiednie ogniskowe z odległością potrzebną dla każdej i sprawdza każde wymaganie: piksele na szczegół, głębię ostrości dla zakresu głębi obiektu, krążek Airy’ego wobec piksela, MTF systemu przy częstotliwości Nyquista sensora, przysłonę dającą najostrzejszy obraz w zakresie głębi (gdzie dyfrakcja przeważa nad rozogniskowaniem), rozmycie ruchu detalu i najdłuższą dopuszczalną ekspozycję, koło obrazowe, format obiektywu i mocowanie, a także błąd perspektywy zadania pomiarowego z alternatywą telecentryczną. Drugi sensor można porównać obok."

  "limitations": {
    "en": "Paraxial thin-lens model in air with the entrance and exit pupils at the lens (pupil magnification 1): the working distance is counted from the lens principal plane, real lenses add their own offset, minimum object distance and distortion. Image quality is the aberration-free diffraction limit for one wavelength and a 100 % fill-factor pixel; real lenses, micro-lenses, Bayer colour filters and noise lower it. The combination of defocus and diffraction blur as a root sum of squares is an engineering heuristic. Lens formats and mount limits are typical practice, standard focal lengths a typical series — check the actual catalogue. Telecentric lenses are judged only by their residual chief-ray angle. Lighting, exposure level and noise are not modelled.",
    "uk": "Параксіальна модель тонкої лінзи в повітрі зі зіницями входу й виходу в площині лінзи (збільшення зіниць 1): робоча відстань рахується від головної площини, реальні об’єктиви додають власний зсув, мінімальну дистанцію фокусування й дисторсію. Якість зображення — межа дифракції без аберацій для однієї довжини хвилі й пікселя з коефіцієнтом заповнення 100 %; реальні об’єктиви, мікролінзи, кольорові фільтри Баєра й шум її знижують. Поєднання розфокусування й дифракції як корінь із суми квадратів — інженерна евристика. Формати об’єктивів і межі кріплень — типова практика, стандартні фокусні — типовий ряд; звіряйтеся з реальним каталогом. Телецентричні об’єктиви оцінюються лише за залишковим кутом головного променя. Освітлення, рівень експозиції й шум не моделюються.",
    "de": "Paraxiales Dünnlinsenmodell in Luft mit Ein- und Austrittspupille in der Linse (Pupillenmaßstab 1): der Arbeitsabstand zählt ab der Hauptebene, reale Objektive haben eigenen Versatz, Naheinstellgrenze und Verzeichnung. Die Bildqualität ist die aberrationsfreie Beugungsgrenze für eine Wellenlänge und ein Pixel mit 100 % Füllfaktor; reale Objektive, Mikrolinsen, Bayer-Farbfilter und Rauschen senken sie. Die Kombination von Defokus- und Beugungsunschärfe als Wurzel der Quadratsumme ist eine Ingenieurheuristik. Objektivformate und Anschlussgrenzen sind übliche Praxis, Standardbrennweiten eine typische Reihe — den tatsächlichen Katalog prüfen. Telezentrische Objektive werden nur nach dem Resthauptstrahlwinkel beurteilt. Beleuchtung, Belichtungsniveau und Rauschen werden nicht modelliert.",
    "nl": "Paraxiaal dunnelensmodel in lucht met in- en uittreepupil in de lens (pupilvergroting 1): de werkafstand telt vanaf het hoofdvlak, echte lenzen hebben een eigen verschuiving, minimale objectafstand en vertekening. De beeldkwaliteit is de aberratievrije buigingsgrens voor één golflengte en een pixel met 100 % vulfactor; echte lenzen, microlenzen, Bayer-kleurfilters en ruis verlagen haar. De combinatie van defocus- en buigingsonscherpte als wortel uit de kwadratensom is een ingenieursheuristiek. Lensformaten en vattinggrenzen zijn gangbare praktijk, standaardbrandpuntsafstanden een typische reeks — controleer de echte catalogus. Telecentrische lenzen worden alleen beoordeeld op hun resterende hoofdstraalhoek. Verlichting, belichtingsniveau en ruis worden niet gemodelleerd.",
    "fr": "Modèle paraxial de lentille mince dans l’air, pupilles d’entrée et de sortie dans la lentille (grandissement pupillaire 1) : la distance de travail part du plan principal ; un objectif réel ajoute son propre décalage, une distance minimale de mise au point et de la distorsion. La qualité d’image est la limite de diffraction sans aberration pour une longueur d’onde et un pixel à taux de remplissage de 100 % ; objectifs réels, microlentilles, filtres de Bayer et bruit l’abaissent. Combiner flou de défocalisation et de diffraction en somme quadratique est une heuristique d’ingénieur. Les formats d’objectif et limites de monture sont des usages courants, les focales standard une série typique — vérifiez le vrai catalogue. Les objectifs télécentriques ne sont jugés que par leur angle résiduel de rayon principal. Éclairage, niveau d’exposition et bruit ne sont pas modélisés.",
    "es": "Modelo paraxial de lente delgada en aire con las pupilas de entrada y salida en la lente (aumento pupilar 1): la distancia de trabajo se mide desde el plano principal; los objetivos reales añaden su propio desplazamiento, distancia mínima de enfoque y distorsión. La calidad de imagen es el límite de difracción sin aberraciones para una longitud de onda y un píxel con factor de relleno del 100 %; objetivos reales, microlentes, filtros Bayer y ruido la reducen. Combinar el desenfoque y la difracción como raíz de la suma de cuadrados es una heurística de ingeniería. Formatos de objetivo y límites de montura son práctica habitual, las focales estándar una serie típica — compruebe el catálogo real. Los telecéntricos se valoran solo por su ángulo residual de rayo principal. No se modelan iluminación, nivel de exposición ni ruido.",
    "pl": "Przyosiowy model cienkiej soczewki w powietrzu ze źrenicą wejściową i wyjściową w soczewce (powiększenie źrenic 1): odległość robocza liczona jest od płaszczyzny głównej, rzeczywiste obiektywy mają własne przesunięcie, minimalną odległość ostrzenia i dystorsję. Jakość obrazu to granica dyfrakcyjna bez aberracji dla jednej długości fali i piksela o współczynniku wypełnienia 100 %; rzeczywiste obiektywy, mikrosoczewki, filtry Bayera i szum ją obniżają. Łączenie rozmycia z rozogniskowania i dyfrakcji jako pierwiastka sumy kwadratów to heurystyka inżynierska. Formaty obiektywów i granice mocowań to typowa praktyka, standardowe ogniskowe — typowy szereg; sprawdź rzeczywisty katalog. Obiektywy telecentryczne oceniane są tylko po resztkowym kącie promienia głównego. Oświetlenie, poziom ekspozycji i szum nie są modelowane."

    "basis": {
      "en": "First-order imaging: thin-lens equation and magnification, working f-number N(1 + m) (W. J. Smith, Modern Optical Engineering, 4th ed. 2008, ch. 6), depth of field from the thin-lens blur circle (Smith §6.5), incoherent diffraction MTF of a circular pupil and the Airy disc (J. W. Goodman, Introduction to Fourier Optics, 4th ed. 2017, §7.4), pixel aperture MTF and Nyquist sampling, perspective error of entocentric lenses and the telecentric principle; sensor geometry from Sony’s public industrial image-sensor list (read 2026-11-13)."

    "independent_validation": false,
    "benchmarks": [
      {
        "id": "mvlens-method-2026-11-13",
        "reference": {
          "en": "49 cases against an independent Python reference: 25 camera set-ups (18 sensors from 0.4 to 24.5 MP including SWIR and a custom sensor, automatic and fixed focal lengths, 0.2 to 500 mm depth ranges, moving parts and gauging tasks) with magnification and field from a paraxial chief-ray trace, depth-of-field limits by bisection on the traced blur circle, the Airy disc from the first root of J1, the lens MTF from the numerically integrated pupil overlap, motion blur and perspective error by chief-ray projection and the sharpest f-number by a dense scan; four MTF curves at 12 frequencies; and the claim of every preset. Plus 13 review cases: the warning rules (rolling shutter, motion, feature, vignetting, cut-off, field, macro), image circle and mount for five formats, the two-sensor comparison, no standard focal length, and a depth range just inside and beyond the focal-plane limit 2 (WD − f).",
          "uk": "49 випадки проти незалежної реалізації на Python: 25 налаштування камери (18 сенсорів від 0,4 до 24,5 Мп, зокрема SWIR і власний сенсор, автоматична й фіксована фокусна, діапазони глибини від 0,2 до 500 мм, рухомі деталі й вимірювальні задачі) зі збільшенням і полем із параксіального трасування головного променя, межами глибини різкості бісекцією за трасованим кружком розсіяння, диском Ейрі з першого кореня J1, MTF об’єктива з чисельно проінтегрованого перекриття зіниць, розмиттям руху й похибкою перспективи проєкцією головних променів і найрізкішою діафрагмою щільним перебором; чотири криві MTF на 12 частотах і твердження кожного прикладу. Також 13 випадків після рецензії: правила попереджень (ковзний затвор, рух, деталь, віньєтування, гранична частота, поле, макро), коло зображення й кріплення для п’яти форматів, порівняння двох сенсорів, відсутність стандартної фокусної відстані та діапазон глибини трохи всередині й за межею фокальної площини 2 (WD − f).",
          "de": "49 Fälle gegen eine unabhängige Python-Implementierung: 25 Kamera-Aufbauten (18 Sensoren von 0,4 bis 24,5 MP einschließlich SWIR und eines eigenen Sensors, automatische und feste Brennweiten, Tiefenbereiche von 0,2 bis 500 mm, bewegte Teile und Messaufgaben) mit Abbildungsmaßstab und Sichtfeld aus einer paraxialen Hauptstrahlrechnung, Schärfentiefegrenzen per Bisektion am durchgerechneten Unschärfekreis, Airy-Scheibe aus der ersten Nullstelle von J1, Objektiv-MTF aus dem numerisch integrierten Pupillenüberlapp, Bewegungsunschärfe und Perspektivfehler per Hauptstrahlprojektion und schärfster Blende per dichter Abtastung; vier MTF-Kurven bei 12 Frequenzen und die Aussage jedes Beispiels. Dazu 13 Fälle aus dem Review: die Warnregeln (Rolling Shutter, Bewegung, Merkmal, Vignettierung, Grenzfrequenz, Sichtfeld, Makro), Bildkreis und Anschluss für fünf Formate, der Vergleich zweier Sensoren, keine Standardbrennweite sowie ein Tiefenbereich knapp innerhalb und jenseits der Brennebenengrenze 2 (Abstand − f).",
          "nl": "49 gevallen tegen een onafhankelijke Python-implementatie: 25 camera-opstellingen (18 sensoren van 0,4 tot 24,5 MP inclusief SWIR en een eigen sensor, automatische en vaste brandpuntsafstanden, dieptebereiken van 0,2 tot 500 mm, bewegende onderdelen en meettaken) met vergroting en beeldveld uit een paraxiale hoofdstraaltrace, scherptediepte-grenzen via bisectie op de getraceerde onscherptecirkel, de Airy-schijf uit de eerste nulwaarde van J1, de lens-MTF uit de numeriek geïntegreerde pupiloverlap, bewegingsonscherpte en perspectieffout via hoofdstraalprojectie en het scherpste diafragma via een dichte scan; vier MTF-curven bij 12 frequenties en de bewering van elk voorbeeld. Daarnaast 13 reviewgevallen: de waarschuwingsregels (rolling shutter, beweging, detail, vignettering, afsnijfrequentie, beeldveld, macro), beeldcirkel en vatting voor vijf formaten, de vergelijking van twee sensoren, geen standaard brandpuntsafstand, en een dieptebereik net binnen en voorbij de brandvlakgrens 2 (werkafstand − f).",
          "fr": "49 cas contre une implémentation Python indépendante : 25 configurations de caméra (18 capteurs de 0,4 à 24,5 MP dont SWIR et un capteur personnalisé, focales automatiques et fixes, plages de profondeur de 0,2 à 500 mm, pièces en mouvement et tâches de mesure) avec grandissement et champ par tracé paraxial du rayon principal, limites de profondeur de champ par dichotomie sur le cercle de flou tracé, tache d’Airy à partir du premier zéro de J1, FTM de l’objectif par intégration numérique du recouvrement des pupilles, flou de bougé et erreur de perspective par projection des rayons principaux et ouverture la plus nette par balayage dense ; quatre courbes de FTM à 12 fréquences et l’affirmation de chaque exemple. S’y ajoutent 13 cas issus de la revue : les règles d’avertissement (obturateur déroulant, mouvement, détail, vignetage, coupure, champ, macro), cercle image et monture pour cinq formats, la comparaison de deux capteurs, l’absence de focale standard, et une plage de profondeur juste en deçà et au-delà de la limite du plan focal 2 (distance − f).",
          "es": "49 casos frente a una implementación independiente en Python: 25 montajes de cámara (18 sensores de 0,4 a 24,5 MP, incluidos SWIR y un sensor personalizado, focales automáticas y fijas, rangos de profundidad de 0,2 a 500 mm, piezas en movimiento y tareas de medición) con aumento y campo por trazado paraxial del rayo principal, límites de profundidad de campo por bisección sobre el círculo de desenfoque trazado, disco de Airy a partir del primer cero de J1, MTF del objetivo por integración numérica del solapamiento de pupilas, desenfoque de movimiento y error de perspectiva por proyección de rayos principales y número f más nítido por barrido denso; cuatro curvas MTF en 12 frecuencias y la afirmación de cada ejemplo. Además, 13 casos de la revisión: las reglas de aviso (obturador rodante, movimiento, detalle, viñeteo, corte, campo, macro), círculo de imagen y montura para cinco formatos, la comparación de dos sensores, la falta de focal estándar y un rango de profundidad justo dentro y más allá del límite del plano focal 2 (distancia − f).",

    depthRange: function (r) { var L = F3(r.depthMax_mm), f = F3(r.fChosen); return T('The depth range reaches the focal plane of the lens: the near end (WD − depth/2) must stay farther away than f. With f = ' + f + ' mm keep the depth under ' + L + ' mm = 2 (WD − f), or move further away.', 'Діапазон глибини сягає фокальної площини об’єктива: ближній край (WD − глибина/2) має лишатися далі за f. При f = ' + f + ' мм тримайте глибину меншою за ' + L + ' мм = 2 (WD − f) або відійдіть далі.', 'Der Tiefenbereich reicht bis in die Brennebene des Objektivs: das nahe Ende (Abstand − Tiefe/2) muss weiter weg liegen als f. Bei f = ' + f + ' mm die Tiefe unter ' + L + ' mm = 2 (Abstand − f) halten oder weiter weg gehen.', 'Het dieptebereik reikt tot het brandvlak van de lens: het nabije einde (werkafstand − diepte/2) moet verder liggen dan f. Houd bij f = ' + f + ' mm de diepte onder ' + L + ' mm = 2 (werkafstand − f), of ga verder weg.', 'La plage de profondeur atteint le plan focal de l’objectif : l’extrémité proche (distance − profondeur/2) doit rester au-delà de f. Avec f = ' + f + ' mm, gardez la profondeur sous ' + L + ' mm = 2 (distance − f) ou éloignez-vous.', 'El rango de profundidad llega al plano focal del objetivo: el extremo cercano (distancia − profundidad/2) debe quedar más lejos que f. Con f = ' + f + ' mm mantenga la profundidad por debajo de ' + L + ' mm = 2 (distancia − f) o aléjese.', 'Zakres głębi sięga płaszczyzny ogniskowej obiektywu: bliższy koniec (odległość − głębia/2) musi leżeć dalej niż f. Przy f = ' + f + ' mm utrzymaj głębię poniżej ' + L + ' mm = 2 (odległość − f) lub odsuń się.'); },
    nostandard: function (r) { var a = V.FOCALS[0] + '–' + V.FOCALS[V.FOCALS.length - 1], f = F3(r.fIdeal); return T('No standard focal length (' + a + ' mm) covers this field at this working distance: the ideal value ' + f + ' mm is shown. Move further away, or look for a wide-angle, board (M12) or macro lens.', 'Жодна стандартна фокусна відстань (' + a + ' мм) не охоплює це поле на цій робочій відстані: показано ідеальне значення ' + f + ' мм. Відійдіть далі або шукайте ширококутний, платний (M12) чи макрооб’єктив.', 'Keine Standardbrennweite (' + a + ' mm) deckt dieses Sichtfeld bei diesem Abstand ab: gezeigt wird der Idealwert ' + f + ' mm. Weiter weg gehen oder ein Weitwinkel-, Platinen- (M12) oder Makroobjektiv suchen.', 'Geen standaard brandpuntsafstand (' + a + ' mm) dekt dit beeldveld op deze werkafstand: de ideale waarde ' + f + ' mm wordt getoond. Ga verder weg of zoek een groothoek-, board- (M12) of macrolens.', 'Aucune focale standard (' + a + ' mm) ne couvre ce champ à cette distance : la valeur idéale ' + f + ' mm est affichée. Éloignez-vous ou cherchez un objectif grand-angle, de carte (M12) ou macro.', 'Ninguna focal estándar (' + a + ' mm) cubre este campo a esta distancia: se muestra el valor ideal ' + f + ' mm. Aléjese o busque un objetivo gran angular, de placa (M12) o macro.', 'Żadna standardowa ogniskowa (' + a + ' mm) nie obejmuje tego pola na tej odległości: pokazano wartość idealną ' + f + ' mm. Odsuń się lub poszukaj obiektywu szerokokątnego, płytkowego (M12) albo makro.'); },

    rolling: function () { return T('Rolling-shutter sensor with a moving part: rows are exposed at different times, so the image is skewed — prefer a global-shutter sensor or a short strobe in a dark enclosure.', 'Сенсор із ковзним затвором і рухома деталь: рядки експонуються в різний час, зображення перекошується — краще сенсор із глобальним затвором або короткий спалах у темному кожусі.', 'Rolling-Shutter-Sensor mit bewegtem Teil: die Zeilen werden zu verschiedenen Zeiten belichtet, das Bild wird schräg — besser Global-Shutter-Sensor oder kurzer Blitz in dunkler Einhausung.', 'Rolling-shuttersensor met bewegend onderdeel: de rijen worden op verschillende momenten belicht, het beeld wordt scheef — kies liever global shutter of een korte flits in een donkere behuizing.', 'Capteur à obturateur déroulant et pièce en mouvement : les lignes sont exposées à des instants différents, l’image est cisaillée — préférez un obturateur global ou un flash bref dans un caisson sombre.', 'Sensor de obturador rodante con pieza en movimiento: las filas se exponen en instantes distintos y la imagen se inclina — mejor obturador global o un destello corto en una carcasa oscura.', 'Sensor z migawką szczelinową i ruchomy detal: wiersze naświetlane są w różnych chwilach, obraz się skośnie zniekształca — lepiej migawka globalna lub krótki błysk w ciemnej obudowie.'); },
    vignette: function (r) { return T('The lens image circle (' + F(r.inp.circle_mm, 1) + ' mm) is smaller than the sensor diagonal (' + F(r.diag, 1) + ' mm): dark or soft corners.', 'Коло зображення об’єктива (' + F(r.inp.circle_mm, 1) + ' мм) менше за діагональ сенсора (' + F(r.diag, 1) + ' мм): темні або нечіткі кути.', 'Der Bildkreis des Objektivs (' + F(r.inp.circle_mm, 1) + ' mm) ist kleiner als die Sensordiagonale (' + F(r.diag, 1) + ' mm): dunkle oder unscharfe Ecken.', 'De beeldcirkel van de lens (' + F(r.inp.circle_mm, 1) + ' mm) is kleiner dan de sensordiagonaal (' + F(r.diag, 1) + ' mm): donkere of onscherpe hoeken.', 'Le cercle image de l’objectif (' + F(r.inp.circle_mm, 1) + ' mm) est plus petit que la diagonale du capteur (' + F(r.diag, 1) + ' mm) : coins sombres ou flous.', 'El círculo de imagen del objetivo (' + F(r.inp.circle_mm, 1) + ' mm) es menor que la diagonal del sensor (' + F(r.diag, 1) + ' mm): esquinas oscuras o borrosas.', 'Koło obrazowe obiektywu (' + F(r.inp.circle_mm, 1) + ' mm) jest mniejsze niż przekątna sensora (' + F(r.diag, 1) + ' mm): ciemne lub nieostre narożniki.'); },
    macro: function (r) { return T('Magnification ' + F(r.main.m, 3) + '×: the lens must sit ' + F(r.main.ext, 3) + ' mm further from the sensor than at infinity focus — check the lens close-focus limit or add extension tubes; f/' + F(r.inp.N, 2) + ' then works like f/' + F(r.main.Nw, 2) + '.', 'Збільшення ' + F(r.main.m, 3) + '×: об’єктив має стояти на ' + F(r.main.ext, 3) + ' мм далі від сенсора, ніж при фокусуванні на нескінченність — перевірте мінімальну дистанцію фокусування або додайте подовжувальні кільця; f/' + F(r.inp.N, 2) + ' тоді працює як f/' + F(r.main.Nw, 2) + '.', 'Abbildungsmaßstab ' + F(r.main.m, 3) + '×: das Objektiv muss ' + F(r.main.ext, 3) + ' mm weiter vom Sensor stehen als bei Fokus unendlich — Naheinstellgrenze prüfen oder Zwischenringe einsetzen; f/' + F(r.inp.N, 2) + ' wirkt dann wie f/' + F(r.main.Nw, 2) + '.', 'Vergroting ' + F(r.main.m, 3) + '×: de lens moet ' + F(r.main.ext, 3) + ' mm verder van de sensor staan dan bij focus op oneindig — controleer de minimale scherpstelafstand of gebruik tussenringen; f/' + F(r.inp.N, 2) + ' werkt dan als f/' + F(r.main.Nw, 2) + '.', 'Grandissement ' + F(r.main.m, 3) + '× : l’objectif doit être ' + F(r.main.ext, 3) + ' mm plus loin du capteur qu’à la mise au point à l’infini — vérifiez la distance minimale ou ajoutez des bagues allonge ; f/' + F(r.inp.N, 2) + ' agit alors comme f/' + F(r.main.Nw, 2) + '.', 'Aumento ' + F(r.main.m, 3) + '×: el objetivo debe quedar ' + F(r.main.ext, 3) + ' mm más lejos del sensor que enfocado a infinito — compruebe la distancia mínima o añada tubos de extensión; f/' + F(r.inp.N, 2) + ' funciona entonces como f/' + F(r.main.Nw, 2) + '.', 'Powiększenie ' + F(r.main.m, 3) + '×: obiektyw musi stać ' + F(r.main.ext, 3) + ' mm dalej od sensora niż przy ostrości na nieskończoność — sprawdź minimalną odległość ostrzenia lub dodaj pierścienie pośrednie; f/' + F(r.inp.N, 2) + ' działa wtedy jak f/' + F(r.main.Nw, 2) + '.'); }

  /* ============================================================ 4. drawing */
  function tokens() {
    var cs = getComputedStyle(document.documentElement);
    return { muted: cs.getPropertyValue('--muted').trim() || '#777', line: cs.getPropertyValue('--line').trim() || '#ccc',
             ink: cs.getPropertyValue('--ink').trim() || '#222', font: cs.getPropertyValue('--font').trim() || 'sans-serif', bg: cs.getPropertyValue('--bg').trim() || '#fff' };
  }
  function axes(ctx, w, h, P, xr, yr, xlab, ylab, tk, coarse, logx) {
    ctx.strokeStyle = tk.line; ctx.lineWidth = 1; ctx.fillStyle = tk.muted;
    ctx.beginPath(); ctx.moveTo(P.l, P.t); ctx.lineTo(P.l, h - P.b); ctx.lineTo(w - P.r, h - P.b); ctx.stroke();
    var X = logx ? function (v) { return P.l + (w - P.l - P.r) * Math.log(v / xr[0]) / Math.log(xr[1] / xr[0]); } : function (v) { return P.l + (w - P.l - P.r) * (v - xr[0]) / (xr[1] - xr[0]); };
    var Y = function (v) { return P.t + (h - P.t - P.b) * (1 - (v - yr[0]) / (yr[1] - yr[0])); };
    ctx.textAlign = 'right';
    DiagramUI.ticks(yr[0], yr[1], h - P.t - P.b, coarse ? 'coarse' : 'fine').forEach(function (t) {
      var y = Y(t); if (y < P.t - 1 || y > h - P.b + 1) return;
      ctx.strokeStyle = tk.line; ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.moveTo(P.l, y); ctx.lineTo(w - P.r, y); ctx.stroke(); ctx.globalAlpha = 1;
      ctx.fillText(DiagramUI.fmt(t, { precision: Math.abs(t) < 10 && t % 1 ? 2 : 0 }), P.l - 5, y + 4);
    });
    ctx.textAlign = 'center';
    var xt = logx ? STOPS_ALL.filter(function (v) { return v >= xr[0] && v <= xr[1]; }) : DiagramUI.ticks(xr[0], xr[1], w - P.l - P.r, coarse ? 'coarse' : 'fine');
    xt.forEach(function (t) {
      var x = X(t); if (x < P.l - 1 || x > w - P.r + 1) return;
      ctx.strokeStyle = tk.line; ctx.beginPath(); ctx.moveTo(x, h - P.b); ctx.lineTo(x, h - P.b + 4); ctx.stroke();
      ctx.fillText(DiagramUI.fmt(t, { precision: t % 1 ? 1 : 0 }), x, h - P.b + 16);
    });
    ctx.textAlign = 'left'; ctx.fillText(ylab, 4, 14);
    ctx.textAlign = 'right'; ctx.fillText(xlab, w - P.r, h - 4);
    return { X: X, Y: Y };
  }
  var STOPS_ALL = [1, 1.4, 2, 2.8, 4, 5.6, 8, 11, 16, 22, 32, 45];
  function legend(ctx, items, x, y, tk) {
    ctx.textAlign = 'left';
    var wmax = 0; items.forEach(function (it) { wmax = Math.max(wmax, String(it.t).length * 6.4); });
    ctx.fillStyle = tk.bg; ctx.globalAlpha = 0.88; ctx.fillRect(x - 6, y - 15, wmax + 40, items.length * 16 + 8); ctx.globalAlpha = 1;
    items.forEach(function (it, i) {
      var yy = y + i * 16; ctx.strokeStyle = it.c; ctx.lineWidth = 2; ctx.setLineDash(it.dash || []);
      ctx.beginPath(); ctx.moveTo(x, yy - 4); ctx.lineTo(x + 22, yy - 4); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = tk.ink; ctx.fillText(it.t, x + 28, yy);
    });
  }
  function poly(ctx, pts, X, Y, col, dash, lw) {
    ctx.strokeStyle = col; ctx.lineWidth = lw || 2; ctx.setLineDash(dash || []); ctx.beginPath();
    var pen = false; pts.forEach(function (p) { if (!isFinite(p[1])) { pen = false; return; } if (pen) ctx.lineTo(X(p[0]), Y(p[1])); else { ctx.moveTo(X(p[0]), Y(p[1])); pen = true; } });
    ctx.stroke(); ctx.setLineDash([]);
  }

  function draw(ctx, w, h, coarse, tk) {
    ctx.clearRect(0, 0, w, h);
    if (!last || last.err) return;
    ctx.font = '400 12px ' + tk.font;
    if (state.view === 'blur') return drawBlur(ctx, w, h, coarse, tk);
    if (state.view === 'mtf') return drawMTF(ctx, w, h, coarse, tk);
    drawScheme(ctx, w, h, coarse, tk);

    tables.push(candTable(r));
    if (r.cmpA && r.cmpB) tables.push(cmpTable(r));
    notes.push(T('Thin-lens model with the pupils at the lens: WD is measured from the lens principal plane; real lenses add their own offset and have a minimum object distance. Diffraction MTF is the aberration-free upper bound; real lenses are lower, especially in the corners.', 'Модель тонкої лінзи зі зіницями в площині лінзи: робоча відстань рахується від головної площини; реальні об’єктиви додають власний зсув і мають мінімальну дистанцію фокусування. Дифракційна MTF — верхня межа без аберацій; у реальних об’єктивів нижча, особливо по кутах.', 'Dünnlinsenmodell mit Pupillen in der Linse: der Arbeitsabstand zählt ab der Hauptebene; reale Objektive haben einen eigenen Versatz und eine Naheinstellgrenze. Die Beugungs-MTF ist die aberrationsfreie Obergrenze; reale Objektive liegen darunter, besonders in den Ecken.', 'Dunnelensmodel met de pupillen in de lens: de werkafstand telt vanaf het hoofdvlak; echte lenzen hebben een eigen verschuiving en een minimale objectafstand. De buigings-MTF is de aberratievrije bovengrens; echte lenzen zitten lager, vooral in de hoeken.', 'Modèle de lentille mince, pupilles dans la lentille : la distance de travail part du plan principal ; un objectif réel ajoute son décalage et a une distance minimale. La FTM de diffraction est la borne sans aberrations ; un objectif réel est en dessous, surtout dans les coins.', 'Modelo de lente delgada con las pupilas en la lente: la distancia de trabajo se mide desde el plano principal; los objetivos reales añaden su desplazamiento y tienen distancia mínima. La MTF de difracción es la cota sin aberraciones; los objetivos reales quedan por debajo, sobre todo en las esquinas.', 'Model cienkiej soczewki ze źrenicami w soczewce: odległość robocza liczona jest od płaszczyzny głównej; rzeczywiste obiektywy mają własne przesunięcie i minimalną odległość. MTF dyfrakcyjna to górna granica bez aberracji; rzeczywiste obiektywy są niżej, zwłaszcza w narożnikach.'));
    return { verdict: verdictOf(r), tiles: tiles, tables: tables, notes: notes };
  }

  /* ============================================================ 7. learn */
  var LEARN = {
    version: 1,
    intro: { title: T('What this tool does', 'Що робить цей інструмент', 'Was dieses Werkzeug tut', 'Wat deze tool doet', 'Ce que fait cet outil', 'Qué hace esta herramienta', 'Co robi to narzędzie'),
      body: T('It picks the lens for a machine-vision camera: from the sensor, the field of view and the working distance it finds the focal length, then checks whether the smallest feature gets enough pixels, whether the depth range stays sharp, whether diffraction or motion blur spoil the image, and whether a telecentric lens is needed. Start with a preset.', 'Він підбирає об’єктив для камери машинного зору: за сенсором, полем зору й робочою відстанню знаходить фокусну відстань, а потім перевіряє, чи вистачає пікселів на найменшу деталь, чи різкий увесь діапазон глибини, чи не псують зображення дифракція або рух і чи потрібен телецентричний об’єктив. Почніть із прикладу.', 'Es wählt das Objektiv für eine Bildverarbeitungskamera: aus Sensor, Sichtfeld und Arbeitsabstand ergibt sich die Brennweite; dann wird geprüft, ob das kleinste Merkmal genug Pixel bekommt, ob der Tiefenbereich scharf bleibt, ob Beugung oder Bewegung das Bild verderben und ob ein telezentrisches Objektiv nötig ist. Beginnen Sie mit einem Beispiel.', 'Het kiest de lens voor een machine-visioncamera: uit sensor, beeldveld en werkafstand volgt de brandpuntsafstand; daarna wordt gecontroleerd of het kleinste detail genoeg pixels krijgt, of het dieptebereik scherp blijft, of buiging of beweging het beeld bederven en of een telecentrische lens nodig is. Begin met een voorbeeld.', 'Il choisit l’objectif d’une caméra de vision industrielle : du capteur, du champ et de la distance de travail il tire la focale, puis vérifie que le plus petit détail a assez de pixels, que la plage de profondeur reste nette, que la diffraction ou le bougé n’abîment pas l’image et s’il faut un objectif télécentrique. Commencez par un exemple.', 'Elige el objetivo de una cámara de visión artificial: a partir del sensor, el campo y la distancia de trabajo calcula la focal, y luego comprueba si el detalle mínimo recibe suficientes píxeles, si el rango de profundidad queda nítido, si la difracción o el movimiento estropean la imagen y si hace falta un telecéntrico. Empiece con un ejemplo.', 'Dobiera obiektyw do kamery wizyjnej: z sensora, pola widzenia i odległości roboczej wyznacza ogniskową, a potem sprawdza, czy najmniejszy szczegół dostaje dość pikseli, czy cały zakres głębi jest ostry, czy dyfrakcja lub ruch nie psują obrazu i czy potrzebny jest obiektyw telecentryczny. Zacznij od przykładu.') },
    topics: {
      mag: { title: T('Magnification and focal length', 'Збільшення й фокусна відстань', 'Abbildungsmaßstab und Brennweite', 'Vergroting en brandpuntsafstand', 'Grandissement et focale', 'Aumento y focal', 'Powiększenie i ogniskowa'),
        body: T('m = sensor size / field size, taken on the tighter axis so the whole field fits. For a thin lens at object distance s: f = s·m/(1 + m). Catalogue lenses come in steps, so the tool takes the longest standard focal length that still covers the field (★) and shows how far you would have to move for the next one.', 'm = розмір сенсора / розмір поля, за тіснішою віссю, щоб помістилося все поле. Для тонкої лінзи на відстані s: f = s·m/(1 + m). Каталожні об’єктиви йдуть кроками, тому інструмент бере найдовшу стандартну фокусну, що ще охоплює поле (★), і показує, на скільки довелося б відійти для наступної.', 'm = Sensorgröße / Feldgröße, auf der engeren Achse, damit das ganze Feld passt. Für eine dünne Linse im Gegenstandsabstand s: f = s·m/(1 + m). Katalogobjektive gibt es in Stufen; das Werkzeug nimmt die längste Standardbrennweite, die das Feld noch abdeckt (★), und zeigt, wie weit man für die nächste zurückgehen müsste.', 'm = sensorgrootte / veldgrootte, op de krapste as zodat het hele veld past. Voor een dunne lens op objectafstand s: f = s·m/(1 + m). Cataloguslenzen bestaan in stappen; de tool neemt de langste standaardbrandpuntsafstand die het veld nog dekt (★) en toont hoe ver u voor de volgende achteruit moet.', 'm = taille du capteur / taille du champ, sur l’axe le plus serré pour que tout le champ tienne. Pour une lentille mince à la distance objet s : f = s·m/(1 + m). Les objectifs du catalogue vont par paliers : l’outil prend la plus longue focale standard qui couvre encore le champ (★) et indique de combien reculer pour la suivante.', 'm = tamaño del sensor / tamaño del campo, en el eje más ajustado para que quepa todo el campo. Para una lente delgada a distancia objeto s: f = s·m/(1 + m). Los objetivos de catálogo van por saltos: la herramienta toma la focal estándar más larga que aún cubre el campo (★) y muestra cuánto habría que alejarse para la siguiente.', 'm = rozmiar sensora / rozmiar pola, na ciaśniejszej osi, aby całe pole się zmieściło. Dla cienkiej soczewki w odległości s: f = s·m/(1 + m). Obiektywy katalogowe występują skokowo, więc narzędzie bierze najdłuższą standardową ogniskową, która jeszcze obejmuje pole (★), i pokazuje, o ile trzeba by się odsunąć dla następnej.') },
      resolution: { title: T('Pixels per feature', 'Пікселі на деталь', 'Pixel pro Merkmal', 'Pixels per detail', 'Pixels par détail', 'Píxeles por detalle', 'Piksele na szczegół'),
        body: T('One pixel sees p/m on the object. Nyquist needs 2 pixels per line pair (one period of a pattern); detecting a single feature reliably usually takes 2–3 pixels across it, gauging more (engineering rules, set your own). More pixels only help if the optics resolve them — see MTF.', 'Один піксель бачить p/m на об’єкті. Критерій Найквіста вимагає 2 пікселі на пару ліній (один період візерунка); для надійного виявлення окремої деталі зазвичай беруть 2–3 пікселі на неї, для вимірювання — більше (інженерні правила, задайте своє). Більше пікселів допомагає, лише якщо оптика їх розрізняє — див. MTF.', 'Ein Pixel sieht p/m am Objekt. Nyquist verlangt 2 Pixel pro Linienpaar (eine Periode eines Musters); ein einzelnes Merkmal sicher zu erkennen braucht meist 2–3 Pixel darüber, Messen mehr (Ingenieurregeln, eigenen Wert setzen). Mehr Pixel helfen nur, wenn die Optik sie auflöst — siehe MTF.', 'Eén pixel ziet p/m op het object. Nyquist vraagt 2 pixels per lijnpaar (één periode van een patroon); een los detail betrouwbaar detecteren vraagt meestal 2–3 pixels erover, meten meer (ingenieursregels, stel uw eigen waarde in). Meer pixels helpen alleen als de optiek ze oplost — zie MTF.', 'Un pixel voit p/m sur l’objet. Nyquist exige 2 pixels par paire de lignes (une période d’un motif) ; détecter un détail isolé de façon fiable demande en général 2 à 3 pixels sur sa largeur, la mesure davantage (règles d’ingénieur, mettez la vôtre). Plus de pixels n’aident que si l’optique les résout — voir FTM.', 'Un píxel ve p/m en el objeto. Nyquist pide 2 píxeles por par de líneas (un periodo de un patrón); detectar con fiabilidad un detalle aislado suele pedir 2–3 píxeles sobre él, medir más (reglas de ingeniería, ponga la suya). Más píxeles solo ayudan si la óptica los resuelve — vea MTF.', 'Jeden piksel widzi p/m na obiekcie. Kryterium Nyquista wymaga 2 pikseli na parę linii (jeden okres wzoru); pewne wykrycie pojedynczego szczegółu zwykle wymaga 2–3 pikseli na nim, pomiar więcej (reguły inżynierskie, ustaw własną). Więcej pikseli pomaga tylko, gdy optyka je rozdziela — zob. MTF.') },
      diffraction: { title: T('Diffraction and working f-number', 'Дифракція й робоче діафрагмове число', 'Beugung und effektive Blende', 'Buiging en werkelijk diafragmagetal', 'Diffraction et ouverture effective', 'Difracción y número f de trabajo', 'Dyfrakcja i robocza liczba przysłony'),
        body: T('Even a perfect lens images a point as an Airy disc of diameter 2.44 λ N_w. Close up, the image-side cone is slower than the f-number on the ring: N_w = N(1 + m). Compare the disc with the pixel pitch: much larger than 2 pixels means the sensor is finer than the optics.', 'Навіть ідеальний об’єктив зображає точку диском Ейрі діаметром 2,44 λ N_w. На близьких відстанях конус променів з боку зображення вужчий, ніж показує кільце: N_w = N(1 + m). Порівняйте диск із кроком пікселя: значно більше 2 пікселів — сенсор дрібніший за оптику.', 'Selbst ein perfektes Objektiv bildet einen Punkt als Airy-Scheibe mit 2,44 λ N_w Durchmesser ab. Im Nahbereich ist der bildseitige Kegel schlanker als die Blendenzahl am Ring: N_w = N(1 + m). Vergleichen Sie die Scheibe mit dem Pixelabstand: deutlich über 2 Pixel heißt, der Sensor ist feiner als die Optik.', 'Zelfs een perfecte lens beeldt een punt af als een Airy-schijf met diameter 2,44 λ N_w. Dichtbij is de beeldzijdige kegel slanker dan het getal op de ring: N_w = N(1 + m). Vergelijk de schijf met de pixelafstand: ruim boven 2 pixels betekent dat de sensor fijner is dan de optiek.', 'Même un objectif parfait image un point en une tache d’Airy de diamètre 2,44 λ N_w. De près, le cône côté image est plus fermé que l’ouverture gravée : N_w = N(1 + m). Comparez la tache au pas pixel : bien au-delà de 2 pixels, le capteur est plus fin que l’optique.', 'Incluso un objetivo perfecto forma de un punto un disco de Airy de diámetro 2,44 λ N_w. De cerca, el cono del lado imagen es más cerrado que el número del anillo: N_w = N(1 + m). Compare el disco con el paso de píxel: muy por encima de 2 píxeles, el sensor es más fino que la óptica.', 'Nawet idealny obiektyw odwzorowuje punkt jako krążek Airy’ego o średnicy 2,44 λ N_w. Z bliska stożek po stronie obrazu jest węższy niż liczba na pierścieniu: N_w = N(1 + m). Porównaj krążek z rozstawem pikseli: znacznie ponad 2 piksele oznacza, że sensor jest drobniejszy niż optyka.') },
      mtf: { title: T('MTF and Nyquist', 'MTF і частота Найквіста', 'MTF und Nyquist', 'MTF en Nyquist', 'FTM et Nyquist', 'MTF y Nyquist', 'MTF i Nyquist'),
        body: T('The modulation transfer function tells how much contrast survives at each line frequency. The sensor can record up to Nyquist = 1/(2p); the lens transmits nothing above its cut-off 1/(λ N_w). The system value at Nyquist is lens × pixel (the pixel alone gives 2/π ≈ 0.64). Below about 0.1 the finest pixel detail is mostly noise.', 'Функція передачі модуляції показує, скільки контрасту лишається на кожній частоті. Сенсор записує до частоти Найквіста 1/(2p); об’єктив нічого не пропускає вище граничної 1/(λ N_w). Значення системи на Найквісті = об’єктив × піксель (сам піксель дає 2/π ≈ 0,64). Нижче приблизно 0,1 найдрібніші деталі — здебільшого шум.', 'Die Modulationsübertragungsfunktion sagt, wie viel Kontrast bei jeder Linienfrequenz übrig bleibt. Der Sensor erfasst bis Nyquist = 1/(2p); das Objektiv überträgt nichts oberhalb der Grenzfrequenz 1/(λ N_w). Der Systemwert bei Nyquist ist Objektiv × Pixel (das Pixel allein gibt 2/π ≈ 0,64). Unter etwa 0,1 ist feinstes Pixeldetail überwiegend Rauschen.', 'De modulatieoverdrachtsfunctie geeft aan hoeveel contrast bij elke lijnfrequentie overblijft. De sensor registreert tot Nyquist = 1/(2p); de lens laat niets door boven de afsnijfrequentie 1/(λ N_w). De systeemwaarde bij Nyquist is lens × pixel (de pixel alleen geeft 2/π ≈ 0,64). Onder ongeveer 0,1 is het fijnste pixeldetail vooral ruis.', 'La fonction de transfert de modulation dit quel contraste survit à chaque fréquence. Le capteur enregistre jusqu’à Nyquist = 1/(2p) ; l’objectif ne transmet rien au-delà de sa coupure 1/(λ N_w). La valeur système à Nyquist vaut objectif × pixel (le pixel seul donne 2/π ≈ 0,64). Sous 0,1 environ, le détail le plus fin est surtout du bruit.', 'La función de transferencia de modulación indica cuánto contraste sobrevive a cada frecuencia. El sensor registra hasta Nyquist = 1/(2p); el objetivo no transmite nada por encima de su corte 1/(λ N_w). El valor del sistema en Nyquist es objetivo × píxel (el píxel solo da 2/π ≈ 0,64). Por debajo de 0,1 aproximadamente, el detalle más fino es sobre todo ruido.', 'Funkcja przenoszenia modulacji mówi, ile kontrastu zostaje przy każdej częstotliwości. Sensor rejestruje do Nyquista = 1/(2p); obiektyw nie przenosi niczego powyżej częstotliwości granicznej 1/(λ N_w). Wartość systemu przy Nyquiście to obiektyw × piksel (sam piksel daje 2/π ≈ 0,64). Poniżej ok. 0,1 najdrobniejszy szczegół to głównie szum.') },
      dof: { title: T('Depth of field', 'Глибина різкості', 'Schärfentiefe', 'Scherptediepte', 'Profondeur de champ', 'Profundidad de campo', 'Głębia ostrości'),
        body: T('Objects nearer or farther than the focused plane blur into a circle. Depth of field is the range where that circle stays below c (here c = chosen number of pixels × pitch): near = s f²/(f² + N c (s − f)), far = s f²/(f² − N c (s − f)). Roughly DOF ≈ 2 N c (1 + m)/m²: it grows with N and shrinks fast with magnification.', 'Об’єкти ближче чи далі від площини фокусування розмиваються в кружок. Глибина різкості — діапазон, де кружок менший за c (тут c = вибране число пікселів × крок): ближня = s f²/(f² + N c (s − f)), дальня = s f²/(f² − N c (s − f)). Приблизно ГР ≈ 2 N c (1 + m)/m²: росте з N і швидко падає зі збільшенням.', 'Objekte vor oder hinter der Fokusebene werden zu einem Kreis verwischt. Die Schärfentiefe ist der Bereich, in dem dieser Kreis unter c bleibt (hier c = gewählte Pixelzahl × Abstand): nah = s f²/(f² + N c (s − f)), fern = s f²/(f² − N c (s − f)). Grob ST ≈ 2 N c (1 + m)/m²: sie wächst mit N und schrumpft schnell mit dem Abbildungsmaßstab.', 'Objecten voor of achter het scherpstelvlak vervagen tot een cirkel. De scherptediepte is het bereik waarin die cirkel onder c blijft (hier c = gekozen aantal pixels × afstand): nabij = s f²/(f² + N c (s − f)), ver = s f²/(f² − N c (s − f)). Grofweg SD ≈ 2 N c (1 + m)/m²: groeit met N en krimpt snel met de vergroting.', 'Les objets avant ou après le plan net s’étalent en un cercle. La profondeur de champ est la plage où ce cercle reste sous c (ici c = nombre de pixels choisi × pas) : proche = s f²/(f² + N c (s − f)), lointain = s f²/(f² − N c (s − f)). En gros PdC ≈ 2 N c (1 + m)/m² : elle croît avec N et chute vite avec le grandissement.', 'Los objetos más cerca o más lejos del plano enfocado se emborronan en un círculo. La profundidad de campo es el rango donde ese círculo queda por debajo de c (aquí c = número de píxeles elegido × paso): cerca = s f²/(f² + N c (s − f)), lejos = s f²/(f² − N c (s − f)). Aproximadamente PdC ≈ 2 N c (1 + m)/m²: crece con N y cae rápido con el aumento.', 'Obiekty bliżej lub dalej niż płaszczyzna ostrości rozmywają się w krążek. Głębia ostrości to zakres, w którym krążek pozostaje poniżej c (tu c = wybrana liczba pikseli × rozstaw): bliska = s f²/(f² + N c (s − f)), daleka = s f²/(f² − N c (s − f)). W przybliżeniu GO ≈ 2 N c (1 + m)/m²: rośnie z N i szybko maleje z powiększeniem.') },
      fnum: { title: T('The best f-number', 'Найкраще діафрагмове число', 'Die beste Blende', 'Het beste diafragmagetal', 'La meilleure ouverture', 'El mejor número f', 'Najlepsza przysłona'),
        body: T('Stopping down shrinks the defocus blur at the edges of the depth range (∝ 1/N) but grows the Airy disc (∝ N). Their combination √(a² + b²) — an engineering heuristic, not an exact MTF — has a minimum; past it, a smaller aperture makes the whole image softer. The Blur plot shows both curves and the optimum.', 'Прикривання діафрагми зменшує розмиття розфокусування на краях діапазону глибини (∝ 1/N), але збільшує диск Ейрі (∝ N). Їх поєднання √(a² + b²) — інженерна евристика, не точна MTF — має мінімум; далі менша діафрагма робить усе зображення м’якшим. Графік розмиття показує обидві криві й оптимум.', 'Abblenden verkleinert die Defokusunschärfe an den Grenzen des Tiefenbereichs (∝ 1/N), vergrößert aber die Airy-Scheibe (∝ N). Ihre Kombination √(a² + b²) — eine Ingenieurheuristik, keine exakte MTF — hat ein Minimum; danach wird das ganze Bild mit kleinerer Blende weicher. Das Unschärfe-Diagramm zeigt beide Kurven und das Optimum.', 'Diafragmeren verkleint de defocusonscherpte aan de randen van het dieptebereik (∝ 1/N) maar vergroot de Airy-schijf (∝ N). Hun combinatie √(a² + b²) — een ingenieursheuristiek, geen exacte MTF — heeft een minimum; daarna maakt een kleinere opening het hele beeld zachter. De onscherptegrafiek toont beide curven en het optimum.', 'Fermer le diaphragme réduit le flou de défocalisation aux limites de la plage (∝ 1/N) mais agrandit la tache d’Airy (∝ N). Leur combinaison √(a² + b²) — une heuristique d’ingénieur, pas une FTM exacte — passe par un minimum ; au-delà, une ouverture plus petite adoucit toute l’image. Le tracé de flou montre les deux courbes et l’optimum.', 'Cerrar el diafragma reduce el desenfoque en los límites del rango (∝ 1/N) pero agranda el disco de Airy (∝ N). Su combinación √(a² + b²) — una heurística de ingeniería, no una MTF exacta — tiene un mínimo; pasado este, una apertura menor suaviza toda la imagen. El gráfico de desenfoque muestra ambas curvas y el óptimo.', 'Przymykanie zmniejsza rozmycie z rozogniskowania na granicach zakresu głębi (∝ 1/N), ale powiększa krążek Airy’ego (∝ N). Ich połączenie √(a² + b²) — heurystyka inżynierska, nie dokładna MTF — ma minimum; dalej mniejsza przysłona zmiękcza cały obraz. Wykres rozmycia pokazuje obie krzywe i optimum.') },
      motion: { title: T('Motion blur and exposure', 'Розмиття руху й експозиція', 'Bewegungsunschärfe und Belichtung', 'Bewegingsonscherpte en belichting', 'Flou de bougé et pose', 'Desenfoque de movimiento y exposición', 'Rozmycie ruchu i ekspozycja'),
        body: T('During the exposure t a part moving at v travels v·t, i.e. v·t·m/p pixels on the sensor. Keep it under about 1 pixel: t ≤ p/(m v). Short exposures need more light — strobed LEDs with pulses of tens of microseconds are common. Rolling-shutter sensors also skew moving parts.', 'За експозицію t деталь зі швидкістю v проходить v·t, тобто v·t·m/p пікселів на сенсорі. Тримайте це менше приблизно 1 пікселя: t ≤ p/(m v). Короткі експозиції потребують більше світла — поширені імпульсні світлодіоди з імпульсами в десятки мікросекунд. Сенсори з ковзним затвором ще й перекошують рухомі деталі.', 'Während der Belichtung t legt ein Teil mit der Geschwindigkeit v die Strecke v·t zurück, also v·t·m/p Pixel auf dem Sensor. Halten Sie das unter etwa 1 Pixel: t ≤ p/(m v). Kurze Belichtungen brauchen mehr Licht — geblitzte LEDs mit Pulsen von einigen zehn Mikrosekunden sind üblich. Rolling-Shutter-Sensoren verzerren bewegte Teile zusätzlich.', 'Tijdens de belichting t legt een onderdeel met snelheid v de afstand v·t af, dus v·t·m/p pixels op de sensor. Houd dat onder ongeveer 1 pixel: t ≤ p/(m v). Korte belichtingen vragen meer licht — geflitste leds met pulsen van tientallen microseconden zijn gebruikelijk. Rolling-shuttersensoren vervormen bewegende delen bovendien.', 'Pendant la pose t, une pièce à la vitesse v parcourt v·t, soit v·t·m/p pixels sur le capteur. Gardez-le sous 1 pixel environ : t ≤ p/(m v). Les poses courtes demandent plus de lumière — des LED flashées avec des impulsions de quelques dizaines de microsecondes sont courantes. Les capteurs à obturateur déroulant déforment en plus les pièces mobiles.', 'Durante la exposición t, una pieza a velocidad v recorre v·t, es decir v·t·m/p píxeles en el sensor. Manténgalo por debajo de 1 píxel aproximadamente: t ≤ p/(m v). Las exposiciones cortas necesitan más luz — son habituales los LED pulsados con destellos de decenas de microsegundos. Los sensores de obturador rodante además deforman las piezas en movimiento.', 'W czasie ekspozycji t detal o prędkości v przebywa v·t, czyli v·t·m/p pikseli na sensorze. Utrzymuj to poniżej ok. 1 piksela: t ≤ p/(m v). Krótkie ekspozycje wymagają więcej światła — typowe są impulsowe diody LED z impulsami rzędu dziesiątek mikrosekund. Sensory z migawką szczelinową dodatkowo zniekształcają ruchome detale.') },
      telecentric: { title: T('Telecentric lenses', 'Телецентричні об’єктиви', 'Telezentrische Objektive', 'Telecentrische lenzen', 'Objectifs télécentriques', 'Objetivos telecéntricos', 'Obiektywy telecentryczne'),
        body: T('An ordinary (entocentric) lens sees nearer things larger: a length L whose distance changes by δ appears L·δ/(s − δ) too long or short. An object-side telecentric lens keeps the chief rays parallel, so the magnification does not depend on distance; the residual error is about 2 δ tan θ for a chief-ray angle θ (often ≤ 0.1°). Its front lens must be larger than the field.', 'Звичайний (ентоцентричний) об’єктив бачить ближче більшим: довжина L, відстань до якої змінюється на δ, здається на L·δ/(s − δ) довшою чи коротшою. Телецентричний з боку об’єкта об’єктив тримає головні промені паралельними, тому збільшення не залежить від відстані; залишкова похибка близько 2 δ tg θ для кута головного променя θ (часто ≤ 0,1°). Його передня лінза має бути більшою за поле.', 'Ein gewöhnliches (entozentrisches) Objektiv sieht Näheres größer: eine Länge L, deren Abstand sich um δ ändert, erscheint um L·δ/(s − δ) zu lang oder zu kurz. Ein objektseitig telezentrisches Objektiv hält die Hauptstrahlen parallel, der Abbildungsmaßstab hängt nicht vom Abstand ab; der Restfehler ist etwa 2 δ tan θ für einen Hauptstrahlwinkel θ (oft ≤ 0,1°). Seine Frontlinse muss größer als das Sichtfeld sein.', 'Een gewone (entocentrische) lens ziet dichtbij groter: een lengte L waarvan de afstand δ verandert, lijkt L·δ/(s − δ) te lang of te kort. Een objectzijdig telecentrische lens houdt de hoofdstralen evenwijdig, dus de vergroting hangt niet van de afstand af; de restfout is ongeveer 2 δ tan θ bij een hoofdstraalhoek θ (vaak ≤ 0,1°). Zijn frontlens moet groter zijn dan het beeldveld.', 'Un objectif ordinaire (entocentrique) voit plus grand ce qui est proche : une longueur L dont la distance varie de δ paraît trop longue ou trop courte de L·δ/(s − δ). Un objectif télécentrique côté objet garde les rayons principaux parallèles : le grandissement ne dépend pas de la distance ; l’erreur résiduelle vaut environ 2 δ tan θ pour un angle de rayon principal θ (souvent ≤ 0,1°). Sa lentille frontale doit dépasser le champ.', 'Un objetivo normal (entocéntrico) ve más grande lo cercano: una longitud L cuya distancia cambia δ parece L·δ/(s − δ) más larga o corta. Un telecéntrico en el lado objeto mantiene paralelos los rayos principales, así que el aumento no depende de la distancia; el error residual es unos 2 δ tan θ para un ángulo de rayo principal θ (a menudo ≤ 0,1°). Su lente frontal debe ser mayor que el campo.', 'Zwykły (entocentryczny) obiektyw widzi bliższe większym: długość L, której odległość zmienia się o δ, wydaje się o L·δ/(s − δ) za długa lub za krótka. Obiektyw telecentryczny od strony obiektu utrzymuje promienie główne równoległe, więc powiększenie nie zależy od odległości; błąd resztkowy to ok. 2 δ tg θ dla kąta promienia głównego θ (często ≤ 0,1°). Jego soczewka przednia musi być większa niż pole.') },
      circle: { title: T('Image circle and mount', 'Коло зображення й кріплення', 'Bildkreis und Anschluss', 'Beeldcirkel en vatting', 'Cercle image et monture', 'Círculo de imagen y montura', 'Koło obrazowe i mocowanie'),
        body: T('The lens must illuminate the whole sensor: its image circle must be at least the sensor diagonal (the optical "type" in inches is a naming convention, not a size). C-mount (flange 17.526 mm) serves sensors up to about 1.1″; larger ones use TFL-II, F/M42 or M58–M72 mounts. CS lenses (12.526 mm) do not focus on C-mount cameras.', 'Об’єктив має освітлювати весь сенсор: його коло зображення не менше за діагональ сенсора (оптичний «тип» у дюймах — умовна назва, а не розмір). Кріплення C (робочий відрізок 17,526 мм) підходить для сенсорів приблизно до 1,1″; більші використовують TFL-II, F/M42 або M58–M72. Об’єктиви CS (12,526 мм) не фокусуються на камерах із кріпленням C.', 'Das Objektiv muss den ganzen Sensor ausleuchten: sein Bildkreis muss mindestens die Sensordiagonale sein (der optische „Typ“ in Zoll ist eine Bezeichnung, kein Maß). C-Mount (Auflagemaß 17,526 mm) reicht für Sensoren bis etwa 1,1″; größere nutzen TFL-II, F/M42 oder M58–M72. CS-Objektive (12,526 mm) fokussieren nicht an C-Mount-Kameras.', 'De lens moet de hele sensor belichten: de beeldcirkel moet minstens de sensordiagonaal zijn (het optische „type“ in inch is een naam, geen maat). C-mount (flensafstand 17,526 mm) dient sensoren tot ongeveer 1,1″; grotere gebruiken TFL-II, F/M42 of M58–M72. CS-lenzen (12,526 mm) stellen niet scherp op C-mountcamera’s.', 'L’objectif doit éclairer tout le capteur : son cercle image doit valoir au moins la diagonale du capteur (le « type » optique en pouces est un nom, pas une taille). La monture C (tirage 17,526 mm) sert jusqu’à environ 1,1″ ; au-delà, TFL-II, F/M42 ou M58–M72. Les objectifs CS (12,526 mm) ne font pas le point sur une caméra C.', 'El objetivo debe iluminar todo el sensor: su círculo de imagen debe ser al menos la diagonal del sensor (el «tipo» óptico en pulgadas es un nombre, no una medida). La montura C (tiraje 17,526 mm) sirve hasta 1,1″ aproximadamente; los mayores usan TFL-II, F/M42 o M58–M72. Los objetivos CS (12,526 mm) no enfocan en cámaras C.', 'Obiektyw musi oświetlić cały sensor: jego koło obrazowe musi być co najmniej równe przekątnej sensora („typ” optyczny w calach to nazwa, nie wymiar). Mocowanie C (odległość kołnierza 17,526 mm) obsługuje sensory do ok. 1,1″; większe używają TFL-II, F/M42 lub M58–M72. Obiektywy CS (12,526 mm) nie ostrzą na kamerach C.') },
      sensor: { title: T('Sensor data (Sony only)', 'Дані сенсорів (лише Sony)', 'Sensordaten (nur Sony)', 'Sensorgegevens (alleen Sony)', 'Données des capteurs (Sony uniquement)', 'Datos de los sensores (solo Sony)', 'Dane sensorów (tylko Sony)'),
        body: T('The list holds 75 Sony industrial sensors (global and rolling shutter, SWIR) with effective pixels, pixel pitch and optical type from Sony’s public product list (read 13.11.2026). Cameras often crop a few rows; for an exact camera, choose Custom and type its resolution and pitch.', 'Перелік містить 75 промислових сенсорів Sony (глобальний і ковзний затвор, SWIR) з ефективною кількістю пікселів, кроком і оптичним типом із публічного каталогу Sony (прочитано 13.11.2026). Камери часто обрізають кілька рядків; для конкретної камери виберіть «Власний» і введіть її роздільність і крок.', 'Die Liste enthält 75 industrielle Sony-Sensoren (Global und Rolling Shutter, SWIR) mit effektiven Pixeln, Pixelabstand und optischem Typ aus Sonys öffentlicher Produktliste (gelesen am 13.11.2026). Kameras schneiden oft einige Zeilen ab; für eine bestimmte Kamera „Eigener“ wählen und Auflösung und Abstand eintragen.', 'De lijst bevat 75 industriële Sony-sensoren (global en rolling shutter, SWIR) met effectieve pixels, pixelafstand en optisch type uit Sony’s openbare productlijst (gelezen 13.11.2026). Camera’s snijden vaak enkele rijen af; kies voor een bepaalde camera „Eigen“ en vul resolutie en afstand in.', 'La liste contient 75 capteurs industriels Sony (obturateur global et déroulant, SWIR) avec pixels effectifs, pas pixel et type optique tirés de la liste publique de Sony (lue le 13.11.2026). Les caméras rognent souvent quelques lignes ; pour une caméra précise, choisissez « Personnalisé » et saisissez sa résolution et son pas.', 'La lista contiene 75 sensores industriales Sony (obturador global y rodante, SWIR) con píxeles efectivos, paso de píxel y tipo óptico de la lista pública de Sony (leída el 13.11.2026). Las cámaras suelen recortar algunas filas; para una cámara concreta elija «Personalizado» y escriba su resolución y paso.', 'Lista zawiera 75 przemysłowych sensorów Sony (migawka globalna i szczelinowa, SWIR) z efektywną liczbą pikseli, rozstawem i typem optycznym z publicznej listy produktów Sony (odczyt 13.11.2026). Kamery często obcinają kilka wierszy; dla konkretnej kamery wybierz „Własny” i wpisz jej rozdzielczość i rozstaw.') }
    },
