 riskClipT:"Geschwindigkeit bei null abgeschnitten",riskClip:"Der Marsch hält die Rohrgeschwindigkeit bei null oder darüber, die Säule kann also nicht umkehren. Ein Fall, dessen Stand den Rand überschreitet, endet dort statt zurückzuschwingen, und die Treibhöhe am Ende zeigt, ob das eingetreten ist.",
 riskFricT:"Konstanter Reibungsbeiwert",riskFric:"Der Darcy-Beiwert ist eine für den ganzen Vorgang feste Eingabe. Er folgt der Reynolds-Zahl nicht, während die Geschwindigkeit aus der Ruhe ansteigt; der frühe Teil der Beschleunigung trägt diesen Fehler.",
 mNote:"Starre inkompressible Flüssigkeitssäule fester Länge in starrem Rohr. Konstanter Darcy-Beiwert und Einzel-K, gleichförmige Behältergrundfläche, festes Randniveau, kein eingeschlossenes Gas, keine Wellenelastizität."},
nl:{title:"Leiding vullen / ledigen — inertiële vloeistofkolomtransiënt",
 sumDrain:"Een tank met {At} m² grondvlak op {h0} m loost naar een grens op {hb} m via een vloeistofgevulde leiding van {D} mm boring en {L} m kolomlengte, totale verliescoëfficiënt {Kt}. Na {t} s staat het niveau op {h} m en de leidingsnelheid op {v} m/s, goed voor {Q} m³/s.",
 sumFill:"Een bron op {hb} m vult een tank met {At} m² grondvlak vanaf {h0} m via een vloeistofgevulde leiding van {D} mm boring en {L} m kolomlengte, totale verliescoëfficiënt {Kt}. Na {t} s staat het niveau op {h} m en de leidingsnelheid op {v} m/s, goed voor {Q} m³/s.",
 concHorizon:"Het gevraagde venster eindigde terwijl er nog drijfhoogte over was; de eindtoestand is een momentopname van een lopend verloop.",
 concDrained:"De drijfhoogte was binnen het gevraagde venster op; de berekening stopte bij gelijke niveaus met de kolom in rust.",
 system:"Eén vloeistofgevulde leiding verbindt een tank met vast grondvlak met een grens op vast niveau. Het niveauverschil drijft de kolom tegen wrijving en lokale weerstanden in; de traagheid van de kolom bepaalt hoe snel de snelheid kan volgen. Niveau en snelheid worden samen opgelost, zodat de drijfhoogte afneemt naarmate inhoud verplaatst wordt.",
 figCap:"Tankniveau en leidingsnelheid tegen de tijd. Het niveau wordt links afgelezen, de snelheid rechts.",
 ckHarm:"Verliesvrije harmonische limiet",ckHarmB:"Darcy-factor en lokale K op nul brengen het stelsel terug tot d²u/dt² = −(g A_leiding/(A_tank L)) u, waarmee het niveauverloop een cosinus om het grensniveau is. De solver draait op die invoervector en wordt punt voor punt met de gesloten oplossing vergeleken.",
 ckTanh:"Verliesgevende limiet bij vaste drijfhoogte",ckTanhB:"Een grondvlak groot genoeg om het niveau stil te houden houdt de drijfhoogte vast, en dv/dt = (g H − K_t v²/2)/L integreert tot v = v_∞ tanh(g H t/(L v_∞)) met v_∞ = √(2 g H/K_t). De solver draait op die invoervector en wordt punt voor punt met de gesloten oplossing vergeleken.",
 ckHandoff:"Niveausluiting van de overdracht",ckHandoffB:"De SI-overdracht zet een binnenkomend volumedebiet om in een niveauverschuiving ΔH = v²(fL/D + K)/(2g), boven de grens bij ledigen en eronder bij vullen. Die hoogte terugrekenen via dezelfde verliescoëfficiënt moet de oorspronkelijke snelheid opleveren, en beide takken moeten symmetrisch om het grensniveau liggen.",
 ckConv:"Convergentie bij stapverfijning",ckConvB:"Dezelfde mars met een stapregeltolerantie van 1e-6 en van 1e-7, elk gemeten tegen de verliesvrije gesloten oplossing. Het schema is een Rosenbrock-methode van tweede orde met foutregeling, dus een strakkere tolerantie mag de afwijking niet vergroten.",
 ckHorizon:"Beëindigingstak",ckHorizonB:"De mars stopt ofwel op de gevraagde simulatietijd, ofwel wanneer de drijfhoogte nul wordt met de kolom in rust. Wat er gebeurde bepaalt of de eindtoestand als ingespeeld gelezen mag worden.",
 ckHead:"Drijfhoogte aan het eind",ckHeadB:"Resterende hoogte bij de laatste stap, op de tak die liep. De leidingsnelheid wordt in de mars op nul afgekapt, dus een niveau dat de grens passeert kan niet terugstromen, en een negatieve hoogte zou betekenen dat de kolom doorgeschoten is.",
 flowTank:"Tank (grondvlak, niveau)",flowPipe:"Vloeistofgevulde leiding (D, L, f, K)",flowBoundary:"Grensniveau",flowSource:"Bronniveau",
 rDrain:"ledigen",rFill:"vullen",rHorizon:"simulatietijd bereikt",rDrained:"drijfhoogte op",
 rVdot:"Volumedebiet",rPeak:"Piekleidingsnelheid",rDrive:"Drijfhoogtedruk",
 rH0:"Beginniveau in de tank",rHB:"Grensniveau",rHead0:"Aanvankelijke drijfhoogte",rHeadEnd:"Drijfhoogte aan het eind",
 rKt:"Totale verliescoëfficiënt fL/D + K",rApipe:"Doorstroomoppervlak leiding",rAlpha:"Oppervlakteverhouding A_leiding / A_tank",
 rVol:"Verplaatst volume",rVqs:"Quasi-stationaire snelheid bij eindhoogte",rTau:"Traagheidstijdconstante",
 rModeWhy:"Bepaalt het teken van de niveauvergelijking en welke zijde de hoogte levert",
 rKtWhy:"Bepaalt de snelheid die de hoogte kan dragen: v_∞ = √(2 g ΔH / K_t)",
 rAreaWhy:"Bepaalt hoe snel de hoogte afneemt naarmate inhoud verschuift: dh/dt = ±(A_leiding/A_tank) v",
 riskWaveT:"Elastische golfvoortplanting",riskWave:"De kolom geldt als star en onsamendrukbaar, dus er loopt geen drukgolf doorheen. Een afsluiterdichting of pompuitval die telt op de golftijdschaal 2L/a hoort bij het waterslagmodel, dat deze tool als overdrachtsdoel noemt.",
 riskClipT:"Snelheid afgekapt op nul",riskClip:"De mars houdt de leidingsnelheid op nul of hoger, dus de kolom kan niet omkeren. Een geval waarvan het niveau de grens passeert stopt daar in plaats van terug te slingeren, en de drijfhoogte aan het eind laat zien of dat gebeurd is.",
 riskFricT:"Constante wrijvingsfactor",riskFric:"De Darcy-factor is een invoer die het hele verloop vast blijft. Hij volgt het Reynoldsgetal niet terwijl de snelheid uit stilstand oploopt, dus het vroege deel van de versnelling draagt die fout.",
 mNote:"Starre onsamendrukbare vloeistofkolom van vaste lengte in een starre leiding. Constante Darcy-factor en lokale K, uniform tankgrondvlak, vast grensniveau, geen ingesloten gas en geen golfelasticiteit."},
fr:{title:"Remplissage / vidange de conduite — transitoire inertiel de colonne liquide",
 sumDrain:"Un réservoir de {At} m² de surface au niveau {h0} m se vide vers une limite tenue à {hb} m par une conduite pleine de liquide de {D} mm d’alésage et {L} m de colonne, coefficient de perte total {Kt}. Après {t} s le niveau est de {h} m et la vitesse en conduite de {v} m/s, soit {Q} m³/s.",
 sumFill:"Une source tenue à {hb} m remplit un réservoir de {At} m² de surface depuis {h0} m par une conduite pleine de liquide de {D} mm d’alésage et {L} m de colonne, coefficient de perte total {Kt}. Après {t} s le niveau est de {h} m et la vitesse en conduite de {v} m/s, soit {Q} m³/s.",
 concHorizon:"La fenêtre demandée s’est achevée alors qu’il restait de la charge motrice; l’état final est un instantané d’un transitoire en cours.",
 concDrained:"La charge motrice s’est épuisée à l’intérieur de la fenêtre demandée; le calcul s’est arrêté à niveaux égaux, colonne au repos.",
 system:"Une conduite pleine de liquide relie un réservoir de surface fixe à une limite tenue à niveau fixe. L’écart de niveau pousse la colonne contre le frottement et les pertes locales; l’inertie de la colonne fixe la vitesse à laquelle le débit peut suivre. Niveau et vitesse sont résolus ensemble, de sorte que la charge décroît à mesure que le volume se déplace.",
 figCap:"Niveau du réservoir et vitesse en conduite en fonction du temps. Le niveau se lit à gauche, la vitesse à droite.",
 ckHarm:"Limite harmonique sans pertes",ckHarmB:"Un facteur de Darcy et un K local nuls ramènent le système à d²u/dt² = −(g A_conduite/(A_réservoir L)) u, dont le niveau est un cosinus autour du niveau limite. Le solveur est lancé sur ce vecteur d’entrées et comparé point par point à la solution fermée.",
 ckTanh:"Limite avec pertes à charge constante",ckTanhB:"Une surface de réservoir assez grande pour immobiliser le niveau fige la charge, et dv/dt = (g H − K_t v²/2)/L s’intègre en v = v_∞ tanh(g H t/(L v_∞)) avec v_∞ = √(2 g H/K_t). Le solveur est lancé sur ce vecteur d’entrées et comparé point par point à la solution fermée.",
 ckHandoff:"Fermeture du niveau au transfert",ckHandoffB:"Le transfert SI convertit un débit volumique entrant en un décalage de niveau ΔH = v²(fL/D + K)/(2g), placé au-dessus de la limite en vidange et en dessous en remplissage. Inverser cette charge avec le même coefficient de perte doit rendre la vitesse de départ, et les deux branches doivent être symétriques par rapport au niveau limite.",
 ckConv:"Convergence par raffinement du pas",ckConvB:"La même marche avec une tolérance de contrôle du pas de 1e-6 puis de 1e-7, chacune mesurée contre la solution fermée sans pertes. Le schéma est une méthode de Rosenbrock du second ordre à contrôle d’erreur, donc resserrer la tolérance ne doit pas accroître l’écart.",
 ckHorizon:"Branche d’arrêt",ckHorizonB:"La marche s’arrête soit au temps de simulation demandé, soit quand la charge motrice atteint zéro, colonne au repos. Ce qui s’est produit décide si l’état final peut se lire comme un état établi.",
 ckHead:"Charge motrice finale",ckHeadB:"Charge restant au dernier pas, sur la branche exécutée. La vitesse en conduite est bornée à zéro dans la marche, donc un niveau qui franchit la limite ne peut refluer, et une charge négative signifierait que la colonne a dépassé.",
 flowTank:"Réservoir (surface, niveau)",flowPipe:"Conduite pleine de liquide (D, L, f, K)",flowBoundary:"Niveau limite",flowSource:"Niveau source",
 rDrain:"vidange",rFill:"remplissage",rHorizon:"temps de simulation atteint",rDrained:"charge motrice épuisée",
 rVdot:"Débit volumique",rPeak:"Vitesse de pointe en conduite",rDrive:"Pression de charge motrice",
 rH0:"Niveau initial du réservoir",rHB:"Niveau limite",rHead0:"Charge motrice initiale",rHeadEnd:"Charge motrice finale",
 rKt:"Coefficient de perte total fL/D + K",rApipe:"Section de la conduite",rAlpha:"Rapport de sections A_conduite / A_réservoir",
 rVol:"Volume transféré",rVqs:"Vitesse quasi permanente à la charge finale",rTau:"Constante de temps inertielle",
 rModeWhy:"Fixe le signe de l’équation de niveau et le côté qui fournit la charge",
 rKtWhy:"Fixe la vitesse que la charge peut soutenir : v_∞ = √(2 g ΔH / K_t)",
 rAreaWhy:"Fixe la vitesse de décroissance de la charge à mesure que le volume se déplace : dh/dt = ±(A_conduite/A_réservoir) v",
 riskWaveT:"Propagation d’onde élastique",riskWave:"La colonne est traitée comme rigide et incompressible, donc aucune onde de pression ne la parcourt. Une fermeture de vanne ou un arrêt de pompe qui compte à l’échelle de temps 2L/a relève du modèle de coup de bélier, que cet outil désigne comme cible de transfert.",
 riskClipT:"Vitesse bornée à zéro",riskClip:"La marche maintient la vitesse en conduite à zéro ou au-dessus, la colonne ne peut donc pas s’inverser. Un cas dont le niveau franchit la limite s’y arrête au lieu d’osciller en retour, et la charge motrice finale indique si cela s’est produit.",
 riskFricT:"Facteur de frottement constant",riskFric:"Le facteur de Darcy est une entrée figée pour tout le transitoire. Il ne suit pas le nombre de Reynolds pendant que la vitesse monte depuis l’arrêt, et le début de l’accélération porte cette erreur.",
 mNote:"Colonne liquide rigide et incompressible de longueur fixe dans une conduite rigide. Facteur de Darcy et K local constants, surface de réservoir uniforme, niveau limite fixe, sans gaz piégé ni élasticité d’onde."},
es:{title:"Llenado / vaciado de tubería — transitorio inercial de columna líquida",
 sumDrain:"Un tanque de {At} m² de planta al nivel {h0} m descarga a una frontera fijada en {hb} m por una tubería llena de líquido de {D} mm de diámetro y {L} m de columna, coeficiente de pérdida total {Kt}. Tras {t} s el nivel es {h} m y la velocidad en tubería {v} m/s, equivalente a {Q} m³/s.",
 sumFill:"Una fuente fijada en {hb} m llena un tanque de {At} m² de planta desde {h0} m por una tubería llena de líquido de {D} mm de diámetro y {L} m de columna, coeficiente de pérdida total {Kt}. Tras {t} s el nivel es {h} m y la velocidad en tubería {v} m/s, equivalente a {Q} m³/s.",
 concHorizon:"La ventana solicitada terminó con carga motriz aún disponible; el estado final es una instantánea de un transitorio en curso.",
 concDrained:"La carga motriz se agotó dentro de la ventana solicitada; el cálculo se detuvo con niveles iguales y la columna en reposo.",
 system:"Una tubería llena de líquido conecta un tanque de planta fija con una frontera a nivel fijo. La diferencia de niveles impulsa la columna contra la fricción y las pérdidas locales; la inercia de la columna fija con qué rapidez puede seguir la velocidad. Nivel y velocidad se resuelven juntos, de modo que la carga decae a medida que se traslada volumen.",
 figCap:"Nivel del tanque y velocidad en tubería frente al tiempo. El nivel se lee en el eje izquierdo y la velocidad en el derecho.",
 ckHarm:"Límite armónico sin pérdidas",ckHarmB:"Con factor de Darcy y K local nulos el sistema se reduce a d²u/dt² = −(g A_tubería/(A_tanque L)) u, y el nivel es un coseno alrededor del nivel de frontera. El solver se ejecuta sobre ese vector de entradas y se compara punto a punto con la solución cerrada.",
 ckTanh:"Límite con pérdidas a carga constante",ckTanhB:"Una planta lo bastante grande para inmovilizar el nivel mantiene fija la carga, y dv/dt = (g H − K_t v²/2)/L se integra a v = v_∞ tanh(g H t/(L v_∞)) con v_∞ = √(2 g H/K_t). El solver se ejecuta sobre ese vector de entradas y se compara punto a punto con la solución cerrada.",
 ckHandoff:"Cierre de nivel en la transferencia",ckHandoffB:"La transferencia SI convierte un caudal volumétrico entrante en un desplazamiento de nivel ΔH = v²(fL/D + K)/(2g), por encima de la frontera en vaciado y por debajo en llenado. Invertir esa carga con el mismo coeficiente de pérdida debe devolver la velocidad de partida, y ambas ramas deben quedar simétricas respecto al nivel de frontera.",
 ckConv:"Convergencia al refinar el paso",ckConvB:"La misma marcha con una tolerancia de control de paso de 1e-6 y de 1e-7, medida cada una contra la solución cerrada sin pérdidas. El esquema es un método de Rosenbrock de segundo orden con control de error, así que estrechar la tolerancia no debe aumentar la desviación.",
 ckHorizon:"Rama de terminación",ckHorizonB:"La marcha se detiene en el tiempo de simulación solicitado o cuando la carga motriz llega a cero con la columna en reposo. Lo ocurrido decide si el estado final puede leerse como estado asentado.",
 ckHead:"Carga motriz final",ckHeadB:"Carga restante en el último paso, en la rama que se ejecutó. La velocidad en tubería se recorta a cero en la marcha, así que un nivel que cruza la frontera no puede refluir, y una carga negativa significaría que la columna se pasó.",
 flowTank:"Tanque (planta, nivel)",flowPipe:"Tubería llena de líquido (D, L, f, K)",flowBoundary:"Nivel de frontera",flowSource:"Nivel de fuente",
 rDrain:"vaciado",rFill:"llenado",rHorizon:"tiempo de simulación alcanzado",rDrained:"carga motriz agotada",
 rVdot:"Caudal volumétrico",rPeak:"Velocidad máxima en tubería",rDrive:"Presión de carga motriz",
 rH0:"Nivel inicial del tanque",rHB:"Nivel de frontera",rHead0:"Carga motriz inicial",rHeadEnd:"Carga motriz final",
 rKt:"Coeficiente de pérdida total fL/D + K",rApipe:"Área de paso de la tubería",rAlpha:"Relación de áreas A_tubería / A_tanque",
 rVol:"Volumen trasegado",rVqs:"Velocidad cuasiestacionaria a la carga final",rTau:"Constante de tiempo inercial",
 rModeWhy:"Fija el signo de la ecuación de nivel y qué lado aporta la carga",
 rKtWhy:"Fija la velocidad que la carga puede sostener: v_∞ = √(2 g ΔH / K_t)",
 rAreaWhy:"Fija con qué rapidez decae la carga al trasladarse volumen: dh/dt = ±(A_tubería/A_tanque) v",
 riskWaveT:"Propagación de onda elástica",riskWave:"La columna se trata como rígida e incompresible, así que ninguna onda de presión la recorre. Un cierre de válvula o una parada de bomba que cuente en la escala 2L/a pertenece al modelo de golpe de ariete, que esta herramienta señala como destino de transferencia.",
 riskClipT:"Velocidad recortada a cero",riskClip:"La marcha mantiene la velocidad en tubería en cero o por encima, de modo que la columna no puede invertirse. Un caso cuyo nivel cruza la frontera se detiene allí en vez de oscilar de vuelta, y la carga motriz final indica si eso ocurrió.",
 riskFricT:"Factor de fricción constante",riskFric:"El factor de Darcy es una entrada fija para todo el transitorio. No sigue al número de Reynolds mientras la velocidad sube desde el reposo, y la parte temprana de la aceleración arrastra ese error.",
 mNote:"Columna líquida rígida e incompresible de longitud fija en tubería rígida. Factor de Darcy y K local constantes, planta de tanque uniforme, nivel de frontera fijo, sin gas atrapado ni elasticidad de onda."},
pl:{title:"Napełnianie / opróżnianie rurociągu — inercyjny stan przejściowy słupa cieczy",
 sumDrain:"Zbiornik o polu {At} m² na poziomie {h0} m opróżnia się do brzegu utrzymywanego na {hb} m przez wypełniony cieczą rurociąg o średnicy {D} mm i długości słupa {L} m, sumaryczny współczynnik strat {Kt}. Po {t} s poziom wynosi {h} m, prędkość w rurze {v} m/s, co daje {Q} m³/s.",
 sumFill:"Źródło utrzymywane na {hb} m napełnia zbiornik o polu {At} m² z poziomu {h0} m przez wypełniony cieczą rurociąg o średnicy {D} mm i długości słupa {L} m, sumaryczny współczynnik strat {Kt}. Po {t} s poziom wynosi {h} m, prędkość w rurze {v} m/s, co daje {Q} m³/s.",
 concHorizon:"Żądane okno zakończyło się, gdy wysokość napędowa była jeszcze dostępna; stan końcowy to migawka trwającego procesu.",
 concDrained:"Wysokość napędowa wyczerpała się w żądanym oknie; obliczenie zatrzymało się przy równych poziomach i słupie w spoczynku.",
 system:"Jeden wypełniony cieczą rurociąg łączy zbiornik o stałym polu z brzegiem na stałym poziomie. Różnica poziomów pcha słup wbrew tarciu i oporom miejscowym; bezwładność samego słupa decyduje, jak szybko prędkość może za tym nadążyć. Poziom i prędkość rozwiązywane są razem, więc wysokość napędowa maleje w miarę przemieszczania objętości.",
 figCap:"Poziom zbiornika i prędkość w rurze w czasie. Poziom odczytuje się na osi lewej, prędkość na prawej.",
 ckHarm:"Granica bezstratna — harmoniczna",ckHarmB:"Zerowy współczynnik Darcy’ego i zerowe K sprowadzają układ do d²u/dt² = −(g A_rury/(A_zbiornika L)) u, a przebieg poziomu jest kosinusem wokół poziomu brzegowego. Solver uruchamiany jest na tym wektorze danych i porównywany punkt po punkcie z rozwiązaniem zamkniętym.",
 ckTanh:"Granica stratna przy stałej wysokości",ckTanhB:"Pole zbiornika na tyle duże, by poziom stał w miejscu, utrzymuje wysokość stałą, a dv/dt = (g H − K_t v²/2)/L całkuje się do v = v_∞ tanh(g H t/(L v_∞)) przy v_∞ = √(2 g H/K_t). Solver uruchamiany jest na tym wektorze danych i porównywany punkt po punkcie z rozwiązaniem zamkniętym.",
 ckHandoff:"Domknięcie poziomu przy przekazaniu",ckHandoffB:"Przekazanie SI zamienia napływający strumień objętości na przesunięcie poziomu ΔH = v²(fL/D + K)/(2g), powyżej brzegu przy opróżnianiu i poniżej przy napełnianiu. Odwrócenie tej wysokości tym samym współczynnikiem strat musi zwrócić wyjściową prędkość, a obie gałęzie muszą leżeć symetrycznie względem poziomu brzegowego.",
 ckConv:"Zbieżność przy zagęszczaniu kroku",ckConvB:"Ten sam marsz przy tolerancji sterowania krokiem 1e-6 i 1e-7, każdy mierzony wobec bezstratnego rozwiązania zamkniętego. Schemat to metoda Rosenbrocka drugiego rzędu ze sterowaniem błędem, więc zacieśnienie tolerancji nie może zwiększyć odchyłki.",
 ckHorizon:"Gałąź zakończenia",ckHorizonB:"Marsz kończy się albo na żądanym czasie symulacji, albo gdy wysokość napędowa osiąga zero przy słupie w spoczynku. To, co nastąpiło, rozstrzyga, czy stan końcowy wolno czytać jako ustalony.",
 ckHead:"Końcowa wysokość napędowa",ckHeadB:"Wysokość pozostała w ostatnim kroku, na gałęzi, która się wykonała. Prędkość w rurze jest w marszu obcinana do zera, więc poziom, który przekroczył brzeg, nie może popłynąć z powrotem, a ujemna wysokość oznaczałaby przeregulowanie słupa.",
 flowTank:"Zbiornik (pole, poziom)",flowPipe:"Rurociąg wypełniony cieczą (D, L, f, K)",flowBoundary:"Poziom brzegowy",flowSource:"Poziom źródła",

function dgcLang(){try{return (window.Diagram&&Diagram.lang&&Diagram.lang())||'en';}catch(e){return 'en';}}
function dgcRt(k){var l=dgcLang();return (DGC_RT[l]&&DGC_RT[l][k])||DGC_RT.en[k]||k;}
var DGC_LOC={en:'en-GB',uk:'uk-UA',de:'de-DE',nl:'nl-BE',fr:'fr-BE',es:'es-ES',pl:'pl-PL'};
function dgcNum(v,d){if(!isFinite(v))return '—';
 try{return Number(v).toLocaleString(DGC_LOC[dgcLang()]||'en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});}
 catch(e){return Number(v).toFixed(d);}}

/* Verification computed live from the current state.
   Two analytic limiting cases of the shipped equations carry the grading. Both
   are obtained by calling solve() on a modified input vector, so the marched
   side of every comparison is the shipped solver itself. */
var DGC_G=9.80665;
function dgcWith(s,o){var r={};for(var k in s)r[k]=s[k];for(var k in o)r[k]=o[k];return r;}
function dgcGeom(s){var Ap=Math.PI*s.D*s.D/4;
  return {Ap:Ap,Kt:s.f*s.L/s.D+s.K,alpha:Ap/s.Atank,
          head0:(s.mode==='fill'?(s.hBoundary-s.h0):(s.h0-s.hBoundary))};}
/* The same ROS2 march as solve(), with the step-control tolerance left free so the
   terminal answer can be watched under refinement. Nothing else differs. There is
   no partition of the display window left to refine: the step comes from the
   scheme's own error estimate, so the refinement knob is that tolerance. */
function dgcMarch(s,rtol){
  var r=solve(s,rtol);
  return {x:r.series[0].x,h:r.series[0].y,v:r.series[1].y,t:r.time,vEnd:r.v,steps:r.series[0].x.length};
}
/* Zero loss (f = 0, K = 0) reduces the pair to d2u/dt2 = -(g A_pipe / A_tank L) u,
   so the level is a cosine about the boundary level at omega = sqrt(g A_p/(A_t L)).
   Returns the largest level departure over the recorded history. */
function dgcHarmonic(s,rtol){
  var gm=dgcGeom(s),w=Math.sqrt(DGC_G*gm.Ap/(s.Atank*s.L)),u0=s.h0-s.hBoundary;
  var r=dgcMarch(dgcWith(s,{f:0,K:0}),rtol);
  var e=0,at=null;
  for(var k=0;k<r.x.length;k++){
    var d=Math.abs(r.h[k]-(s.hBoundary+u0*Math.cos(w*r.x[k])));
    if(d>e){e=d;at=r.x[k];}
  }
  return {err:e,at:at,omega:w,halfPeriod:w>0?Math.PI/w:null,n:r.x.length,t:r.t};
}
/* A tank plan area large enough that the level does not move holds the head at
   its initial value. The velocity equation is then dv/dt = (g H - Kt v^2/2)/L,
   whose solution is v = v_inf tanh(g H t /(L v_inf)) with v_inf = sqrt(2 g H/Kt). */
function dgcConstHead(s){
  var gm=dgcGeom(s),H=gm.head0;
  if(!(H>0)||!(gm.Kt>0))return null;
  var r=solve(dgcWith(s,{Atank:s.Atank*1e9}));
  var vinf=Math.sqrt(2*DGC_G*H/gm.Kt),a=DGC_G*H/s.L;
  var X=r.series[0].x,V=r.series[1].y,e=0,at=null;
  for(var k=0;k<X.length;k++){
    var d=Math.abs(V[k]-vinf*Math.tanh(a*X[k]/vinf));
    if(d>e){e=d;at=X[k];}
  }
  return {err:e,at:at,vinf:vinf,tau:vinf/a,vEnd:V.length?V[V.length-1]:0,n:X.length};
}
/* Returns one row per case: what was measured, what it was measured against,
   the difference and the verdict. No case reports a verdict it cannot show the
   numbers for. */
function dgcVerify(s){
  var out=[],r=solve(s),gm=dgcGeom(s),moved=r.series[0].x.length>0;
  /* Acceptance bands below are the second-order truncation bound of the ROS2
     march at its declared step-control tolerance RTOL = 1e-7, expressed on the
     physical scale each check measures. They do not contain tEnd, and nothing
     the user can type widens them. */
  var DGC_TOL_LEVEL=1e-6, DGC_TOL_VEL=1e-5;

  // 1. Zero-loss harmonic limit. Acceptance comes from the solver's own
  //    step-control tolerance, not from the display window: the march holds its
  //    embedded error estimate to RTOL = 1e-7 per step, so the level may depart
  //    from the exact cosine by at most 1e-6 of its amplitude |h0 - hB|.
  var hm=moved?dgcHarmonic(s,0):null;
  var hmTol=hm?DGC_TOL_LEVEL*Math.abs(s.h0-s.hBoundary):null;
  out.push({id:'zero-loss-harmonic-limit',key:'ckHarm',graded:!!hm,
    got:hm?hm.err:null,ref:0,abs:hm?hm.err:null,rel:null,tol:hmTol,unit:'m',dp:8,
    pass:hm?hm.err<=hmTol:false,status:hm?(hm.err<=hmTol?'pass':'attention'):'info',
    extra:hm?{omega:hm.omega,halfPeriod:hm.halfPeriod,at:hm.at,points:hm.n}:null});

  // 2. Constant-head lossy limit. Acceptance is again the scheme's own
  //    step-control bound, here 1e-5 of the terminal velocity v_inf.
  var ch=moved?dgcConstHead(s):null;
  var chTol=ch?DGC_TOL_VEL*ch.vinf:null;
  out.push({id:'constant-head-tanh-limit',key:'ckTanh',graded:!!ch,
    got:ch?ch.err:null,ref:0,abs:ch?ch.err:null,rel:null,tol:chTol,unit:'m/s',dp:8,
    pass:ch?ch.err<=chTol:false,status:ch?(ch.err<=chTol?'pass':'attention'):'info',
    extra:ch?{vinf:ch.vinf,tau:ch.tau,vEnd:ch.vEnd,at:ch.at}:null});

  // 3. Handoff level closure. The tool's handoff apply() turns an incoming Vdot
  //    into a level offset headReq = v^2 (fL/D+K)/(2g) placed above the boundary
  //    for drain and below it for fill. Inverting that head through the same
  //    loss coefficient must return the velocity it was built from, and the two
  //    branches must place the level symmetrically about the boundary.
  var vIn=gm.Ap>0?Math.abs(r.Vdot)/gm.Ap:0;
  var headReq=vIn*vIn*gm.Kt/(2*DGC_G);
  var hDrain=s.hBoundary+headReq,hFill=s.hBoundary-headReq;
  var vBack=gm.Kt>0?Math.sqrt(2*DGC_G*headReq/gm.Kt):0;
  var relV=vIn>0?Math.abs(vBack-vIn)/vIn:0;
  // The offsets are formed by adding and subtracting the same head to the same
  // boundary level, so their sum is a floating-point residue on the scale of
  // that head; it is held to the same relative precision as the velocity.
  var relS=headReq>0?Math.abs((hDrain-s.hBoundary)+(hFill-s.hBoundary))/headReq:0;
  var signOk=headReq>0?(hDrain>s.hBoundary&&hFill<s.hBoundary):(hDrain===hFill);
  var relH=Math.max(relV,relS),okH=signOk&&relH<=1e-12;
  out.push({id:'handoff-head-sign-closure',key:'ckHandoff',graded:true,
    got:vBack,ref:vIn,abs:Math.abs(vBack-vIn),rel:relH,tol:1e-12,unit:'m/s',dp:8,
    pass:okH,status:okH?'pass':'attention',
    extra:{headReq:headReq,hDrain:hDrain,hFill:hFill,relVelocity:relV,relSymmetry:relS,signOk:signOk}});

  // 4. Step refinement against the zero-loss exact solution. The march is a
  //    second-order Rosenbrock method under error control, so tightening the
  //    step-control tolerance tenfold must not increase the departure from the
  //    exact level. There is no window partition left to refine.
  var e1=moved?dgcHarmonic(s,1e-6).err:null,e2=moved?dgcHarmonic(s,1e-7).err:null;
  var ord=(e1&&e2&&e2>0)?e1/e2:null;
  out.push({id:'step-refinement-convergence',key:'ckConv',graded:moved,
    got:e2,ref:e1,abs:e2,rel:null,tol:e1,unit:'m',dp:9,
    pass:moved?(e2<=e1):false,status:moved?(e2<=e1?'pass':'attention'):'info',
    extra:{eCoarse:e1,eFine:e2,rtolCoarse:1e-6,rtolFine:1e-7,ratio:ord}});

  // 5. Did the march reach the requested horizon, or run out of driving head?
  //    Both are legitimate terminations; which one happened decides how the
  //    terminal state may be read. No criterion, so this is recorded, not graded.
  var atHorizon=r.time>=s.tEnd-1e-12;
  out.push({id:'termination-branch',key:'ckHorizon',graded:false,
    got:r.time,ref:s.tEnd,rel:null,unit:'s',dp:4,pass:true,status:'info',
    word:atHorizon?'rHorizon':'rDrained'});

  // 6. Terminal driving head and the branch that produced it. The march clips
  //    velocity at zero, so a level that crosses the boundary cannot flow back;
  //    the sign of the terminal head says whether that happened.
  var headEnd=s.mode==='fill'?(s.hBoundary-r.h):(r.h-s.hBoundary);
  out.push({id:'terminal-driving-head',key:'ckHead',graded:false,
    got:headEnd,ref:gm.head0,rel:null,unit:'m',dp:5,pass:true,status:'info',
    word:s.mode==='fill'?'rFill':'rDrain',
    extra:{crossed:headEnd<0,vTerminal:r.v}});
  return out;
}

/* The report is a separate document without the tool's stylesheet, so the
   figure is drawn into its own canvas at print resolution rather than scraped
   off the screen. Without this the engine falls back to the on-screen stage,
   which carries no caption and no axis titles. */
function dgcFigureCanvas(w,h,scale){
  var c=document.createElement('canvas');
  c.width=Math.round(w*scale); c.height=Math.round(h*scale);
  var ctx=c.getContext('2d'); ctx.scale(scale,scale);
  return {canvas:c,ctx:ctx};
}
function dgcPlotSpec(){
  if(!last||!last.series||last.series.length<2)return null;
  return {x:{label:dgcLabel('time'),unit:'s'},
    series:[{x:last.series[0].x,y:last.series[0].y,label:dgcLabel('level'),unit:'m',color:'#1f6feb'},
            {x:last.series[1].x,y:last.series[1].y,label:dgcLabel('velocity'),unit:'m/s',color:'#d1651a'}]};
}
var DGC_AXIS={
 time:{en:'Time',uk:'Час',de:'Zeit',nl:'Tijd',fr:'Temps',es:'Tiempo',pl:'Czas'},
 level:{en:'Tank level',uk:'Рівень у резервуарі',de:'Behälterstand',nl:'Tankniveau',fr:'Niveau du réservoir',es:'Nivel del tanque',pl:'Poziom zbiornika'},
 velocity:{en:'Pipe velocity',uk:'Швидкість у трубі',de:'Rohrgeschwindigkeit',nl:'Leidingsnelheid',fr:'Vitesse en conduite',es:'Velocidad en tubería',pl:'Prędkość w rurze'}
};
function dgcLabel(k){var l=dgcLang();return (DGC_AXIS[k]&&(DGC_AXIS[k][l]||DGC_AXIS[k].en))||k;}
function dgcReportFigure(ctx){
  var spec=dgcPlotSpec(); if(!spec)return null;
  var f=dgcFigureCanvas(720,300,2);
  dgcPlot(f.ctx,720,300,spec,{css:{bg:'#ffffff',muted:'#5a6570',line:'#c9d0d8',text:'#17202a',
    font:'-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif'},fontScale:1});
  return ctx.figure(f.canvas,{caption:dgcRt('figCap'),alt:dgcRt('figCap')});
}
function dgcReportProfile(rec,ctx){
  if(!rec||!last)return null;
  var i=rec.inputs||{}, o=rec.outputs||{}, u=rec.units||{};
  var row=function(label,value,unit,note){return {label:label,value:value,unit:unit||'',note:note||''};};
  var n=dgcNum, g=DGC_G, fill=i.mode==='fill';
  var gm=dgcGeom(i);
  var headEnd=fill?(i.hBoundary-o.h_final):(o.h_final-i.hBoundary);
  var atHorizon=o.elapsed>=i.tEnd-1e-12;

  var summary=dgcRt(fill?'sumFill':'sumDrain')
    .replace('{At}',n(i.Atank,2)).replace('{h0}',n(i.h0,3)).replace('{hb}',n(i.hBoundary,3))
    .replace('{D}',n(i.D*1000,1)).replace('{L}',n(i.L,2)).replace('{Kt}',n(gm.Kt,3))
    .replace('{t}',n(o.elapsed,2)).replace('{h}',n(o.h_final,3))
    .replace('{v}',n(o.v_final,3)).replace('{Q}',n(o.Vdot_final,4));

  /* Values are shown in the units an engineer reads them in. The record keeps SI. */
  var tiles=[
    row(dgcLabel('level'),n(o.h_final,3),'m'),
    row(dgcLabel('velocity'),n(o.v_final,3),'m/s'),
    row(dgcRt('rVdot'),n(o.Vdot_final,4),'m³/s'),
    row(dgcRt('rPeak'),n(o.v_peak,3),'m/s'),
    row(dgcRt('rDrive'),n(o.dp_head_final/1000,2),'kPa'),
    row(ctx.label('elapsed',u.elapsed||'s'),n(o.elapsed,2),'s')
  ];
  /* Quantities the tiles do not carry: the geometry that sets the timescale and
     the two closed-form figures the terminal state can be read against. */
  var vqs=gm.Kt>0&&headEnd>0?Math.sqrt(2*g*headEnd/gm.Kt):null;
  var vinf0=gm.Kt>0&&gm.head0>0?Math.sqrt(2*g*gm.head0/gm.Kt):null;
  var tau=vinf0&&gm.head0>0?i.L*vinf0/(g*gm.head0):null;
  var results=tiles.concat([
    row(dgcRt('rH0'),n(i.h0,3),'m',dgcRt('rHB')+': '+n(i.hBoundary,3)+' m'),
    row(dgcRt('rHead0'),n(gm.head0,3),'m',dgcRt('rHeadEnd')+': '+n(headEnd,3)+' m'),
    row(dgcRt('rKt'),n(gm.Kt,4),'-','fL/D = '+n(i.f*i.L/i.D,4)+' · K = '+n(i.K,3)),
    row(dgcRt('rApipe'),n(gm.Ap*1e4,3),'cm²',dgcRt('rAlpha')+': '+Number(gm.alpha).toExponential(3)),
    row(dgcRt('rVol'),n(i.Atank*Math.abs(i.h0-o.h_final),3),'m³'),
    row(dgcRt('rVqs'),vqs===null?'—':n(vqs,3),'m/s',vinf0===null?'':'v_∞(t=0) = '+n(vinf0,3)+' m/s'),
    row(dgcRt('rTau'),tau===null?'—':n(tau,2),'s')
  ]);

  var v=dgcVerify(state);
  var checks=v.map(function(c){
    var st=c.status||(c.pass?'pass':'attention');
    var actual,criterion='',note='';
    if(c.key==='ckHarm'){
      actual=c.got===null?'—':'max |Δh| = '+Number(c.got).toExponential(3)+' m';
      criterion=c.tol===null?'—':'≤ ω |h₀ − h_b| Δt = '+Number(c.tol).toExponential(3)+' m';
      if(c.extra)note='ω = '+Number(c.extra.omega).toExponential(4)+' rad/s · '+
        dgcRt('rHead0')+' '+n(gm.head0,3)+' m · '+n(c.extra.points,0)+' pts';
    } else if(c.key==='ckTanh'){
      actual=c.got===null?'—':'max |Δv| = '+Number(c.got).toExponential(3)+' m/s';
      criterion=c.tol===null?'—':'≤ (g H / L) Δt = '+Number(c.tol).toExponential(3)+' m/s';
      if(c.extra)note='v_∞ = '+n(c.extra.vinf,4)+' m/s · τ = '+n(c.extra.tau,3)+' s';
    } else if(c.key==='ckHandoff'){
      actual='max(|Δv|/v, Σ/ΔH) = '+Number(c.rel).toExponential(2);
      criterion='≤ 1·10⁻¹²';
      if(c.extra)note='ΔH = '+n(c.extra.headReq,5)+' m · '+dgcRt('rDrain')+' '+n(c.extra.hDrain,5)+
        ' m · '+dgcRt('rFill')+' '+n(c.extra.hFill,5)+' m · Σ/ΔH = '+Number(c.extra.relSymmetry).toExponential(2);
    } else if(c.key==='ckConv'){
      actual=c.got===null?'—':'max |Δh| = '+Number(c.got).toExponential(3)+' m';
      criterion=c.ref===null?'—':'≤ '+Number(c.ref).toExponential(3)+' m';
      if(c.extra&&c.extra.eCoarse&&c.extra.eFine)
        note='step tolerance 1·10⁻⁶ → 1·10⁻⁷, departure ratio '+n(c.extra.eCoarse/c.extra.eFine,2)+'×';
    } else if(c.key==='ckHorizon'){
      actual=n(c.got,3)+' s ('+dgcRt(c.word)+')';
      criterion=ctx.label('tEnd',u.tEnd||'s')+' = '+n(c.ref,3)+' s';
    } else {
      actual=n(c.got,4)+' m ('+dgcRt(c.word)+')';
      criterion=dgcRt('rHead0')+' = '+n(c.ref,4)+' m';
      if(c.extra)note='v = '+n(c.extra.vTerminal,4)+' m/s';
    }
    return {status:st,title:dgcRt(c.key),actual:actual,criterion:criterion,
            basis:dgcRt(c.key+'B'),detail:note};
  });
  (rec.warnings||[]).forEach(function(w){checks.push({status:'attention',title:dgcRt('ckHorizon'),detail:w});});

  var decisions=[
    row(ctx.label('mode',u.mode||'-'),dgcRt(fill?'rFill':'rDrain'),'',dgcRt('rModeWhy')),
    row('f · K',n(i.f,4)+' · '+n(i.K,3),'',dgcRt('rKtWhy')),
    row('A_pipe / A_tank',Number(gm.alpha).toExponential(3),'',dgcRt('rAreaWhy'))
  ];

  var g1='1 · '+dgcRt('flowTank'), g2='2 · '+dgcRt('flowPipe');
  var inputs=[
    {label:ctx.label('mode',u.mode||'-'),value:dgcRt(fill?'rFill':'rDrain'),unit:'',group:g1},
    {label:ctx.label('Atank',u.Atank),value:n(i.Atank,3),unit:'m²',group:g1},
    {label:dgcRt('rH0'),value:n(i.h0,3),unit:'m',group:g1},
    {label:dgcRt('rHB'),value:n(i.hBoundary,3),unit:'m',group:g1},
    {label:ctx.label('D',u.D),value:n(i.D*1000,2),unit:'mm',group:g2},
    {label:ctx.label('L',u.L),value:n(i.L,3),unit:'m',group:g2},
    {label:ctx.label('f',u.f),value:n(i.f,4),unit:'-',group:g2},
    {label:ctx.label('K',u.K),value:n(i.K,3),unit:'-',group:g2},
    {label:ctx.label('rho',u.rho),value:n(i.rho,1),unit:'kg/m³',group:g2},
    {label:ctx.label('tEnd',u.tEnd),value:n(i.tEnd,2),unit:'s',group:g2}
  ];

  /* The flow is written in the direction the branch that ran actually moves. */
  var flow=fill
    ?[{label:dgcRt('flowSource'),detail:n(i.hBoundary,3)+' m'},
      {label:dgcRt('flowPipe'),detail:n(i.D*1000,1)+' mm · '+n(i.L,2)+' m · K_t '+n(gm.Kt,3)},
      {label:dgcRt('flowTank'),detail:n(i.Atank,2)+' m² · '+n(i.h0,3)+' m'}]
    :[{label:dgcRt('flowTank'),detail:n(i.Atank,2)+' m² · '+n(i.h0,3)+' m'},
      {label:dgcRt('flowPipe'),detail:n(i.D*1000,1)+' mm · '+n(i.L,2)+' m · K_t '+n(gm.Kt,3)},
      {label:dgcRt('flowBoundary'),detail:n(i.hBoundary,3)+' m'}];

  return {
    title:dgcRt('title'),
    executive:{text:[summary],results:tiles,
      conclusion:atHorizon?dgcRt('concHorizon'):dgcRt('concDrained')},
    system:{text:dgcRt('system'),flow:flow},
    results:results,
    decisions:decisions,
    checks:checks,
    figures:[dgcReportFigure(ctx)].filter(Boolean),
    risks:[{status:'attention',title:dgcRt('riskWaveT'),detail:dgcRt('riskWave')},
           {status:'attention',title:dgcRt('riskClipT'),detail:dgcRt('riskClip')},
           {status:'attention',title:dgcRt('riskFricT'),detail:dgcRt('riskFric')}],
    method:{
      equations:['dv/dt = [g ΔH − (fL/D + K) v|v| / 2] / L','dh/dt = ± (A_pipe / A_tank) v',
        'ΔH = h − h_b (drain), h_b − h (fill)','V̇ = A_pipe v','Δp = ρ g max(0, ΔH)'],
      ranges:['incompressible full liquid column','rigid pipe','no trapped gas or water-hammer elasticity'],
      notes:[dgcRt('mNote')]
    },
    inputs:inputs
  };
}

var DGC_BENCH_CASES=[
 {id:'drain-shipped-default',note:'Shipped default: 20 m² tank at 8 m draining to 0 m through 150 mm / 40 m',

    reference_provenance:'recomputed in page; self-check only. The benchmark reference is gen_pipe_filling_draining.py, an independent second implementation that reduces the pair to a closed form in the head domain plus one quadrature and never runs the page code.',
    tolerance:'Each limiting case must agree with the closed solution to within the march\'s own step-control bound, expressed on the physical scale it measures and containing no input the user can type: 1e-6 of the level amplitude |h0 - h_b| for the harmonic case and 1e-5 of v_inf for the constant-head case, both ten times the ROS2 embedded-error tolerance RTOL = 1e-7 that the march holds per step. Handoff closure to floating-point precision (1e-12 relative), covering both the velocity recovered from the level offset and the symmetry of the two branch offsets about the boundary level, with the drain offset above that level and the fill offset below it. Tightening the step-control tolerance from 1e-6 to 1e-7 must not increase the level departure. Observed on the shipped default: level departure '+ex(h0&&h0.got,3)+' m against a band of '+ex(h0&&h0.tol,3)+' m, velocity departure '+ex(t0&&t0.got,3)+' m/s against '+ex(t0&&t0.tol,3)+' m/s, and the level departure falling to '+ex(c0&&c0.got,3)+' m at the tighter tolerance.',

/* Time integration of the reduced liquid-column pair.  The state is carried as the
   driving head H (positive while liquid still moves toward the other boundary) and
   the pipe velocity v:

       dH/dt = -(A_pipe/A_tank) v
       dv/dt = [g H - (fL/D + K) v|v| / 2] / L

   Two properties of that pair decide the scheme.

   (a) It is stiff.  The drag relaxes velocity on L/(K_t v) -- milliseconds for a
       short pipe with heavy local loss -- while the level moves on
       A_tank H/(A_pipe v), which can be days.  The march is therefore ROS2, the
       two-stage second-order Rosenbrock method of Verwer, Spee, Blom and
       Hundsdorfer (SIAM J. Sci. Comput. 20 (1999) 1456), with gamma = 1 - 1/sqrt(2).
       ROS2 is L-stable, so the stiff drag can never grow whatever the step is.

   (b) The step is chosen by the scheme's own embedded first-order estimate against
       a tolerance fixed on the initial physical scales -- the head amplitude H0 and
       the smaller of the loss-limited and inertia-limited velocity scales.  It is
       therefore taken from the transient.  The simulated-time input tEnd enters the
       march only through Math.min(dt, tEnd - t), which can shorten the last step to
       land exactly on the requested horizon and can never lengthen any step.  The
       reported terminal time, level, velocity and peak velocity are independent of
       tEnd: widening the display window returns the same numbers.

   The terminal event (v reaching zero) and the velocity peak (dv/dt changing sign)
   are each located inside the step that brackets them by bisection on the step
   length, so neither is quantised to the partition.  The plotted history is
   decimated afterwards, so curve resolution costs the answer nothing. */
function solve(s,rtolIn){
  var g=9.80665,Ap=Math.PI*s.D*s.D/4,Kt=s.f*s.L/s.D+s.K,L=s.L,
      alpha=Ap/s.Atank,fill=s.mode==='fill',
      H0=fill?(s.hBoundary-s.h0):(s.h0-s.hBoundary),
      RTOL=(rtolIn>0?rtolIn:1e-7),GUARD=400000,NPLOT=1200,GAM=1-Math.SQRT1_2,
      H=H0,v=0,t=0,peak=0,n=0,rej=0,guardHit=false,
      tx=[],th=[],tv=[];
  function acc(H1,v1){return (g*H1-Kt*v1*Math.abs(v1)/2)/L;}
  /* One ROS2 step. Returns [H, v, errH, errV]; the error pair is the difference
     between the second-order result and its embedded first-order companion. */
  function stage(H1,v1,dt){
    var a12=GAM*dt*alpha,a21=-GAM*dt*g/L,a22=1+GAM*dt*Kt*Math.abs(v1)/L,
        det=a22-a12*a21,
        r1=-alpha*v1,r2=acc(H1,v1),
        k1a=(a22*r1-a12*r2)/det,k1b=(r2-a21*r1)/det,
        H2=H1+dt*k1a,v2=v1+dt*k1b,
        q1=-alpha*v2-2*k1a,q2=acc(H2,v2)-2*k1b,
        k2a=(a22*q1-a12*q2)/det,k2b=(q2-a21*q1)/det;
    return [H1+1.5*dt*k1a+0.5*dt*k2a,v1+1.5*dt*k1b+0.5*dt*k2b,
            0.5*dt*(k1a+k2a),0.5*dt*(k1b+k2b)];
  }
  if(H0>0&&alpha>0&&L>0&&s.tEnd>0){
    var vLoss=Kt>0?Math.sqrt(2*g*H0/Kt):Infinity,
        vOsc=H0*Math.sqrt(g/(alpha*L)),
        vScale=Math.min(vLoss,vOsc),hScale=H0,
        atolH=1e-3*RTOL*hScale,atolV=1e-3*RTOL*vScale,
        tau=Math.min(L*vScale/(g*H0),Math.sqrt(L/(g*alpha))),
        dtNext=1e-6*tau,dtFloor=1e-12*tau,
        accPrev=acc(H0,0),peakDone=false,i,j,m,q,st,lo,hi,dt,err,fac;
    tx.push(0);th.push(s.h0);tv.push(0);
    while(t<s.tEnd&&n<GUARD){
      if(H<=0&&v<=0)break;
      dt=Math.min(Math.max(dtNext,dtFloor),s.tEnd-t);
      if(!(dt>0))break;
      st=stage(H,v,dt);
      err=Math.max(Math.abs(st[2])/(atolH+RTOL*Math.abs(H)),
                   Math.abs(st[3])/(atolV+RTOL*Math.abs(v)));
      if(err>1&&dt>dtFloor&&rej<40){
        dtNext=Math.max(dtFloor,dt*Math.max(0.2,0.9/Math.sqrt(err)));rej++;continue;}
      if(st[1]<=0){
        lo=0;hi=dt;
        for(i=0;i<60;i++){m=0.5*(lo+hi);if(stage(H,v,m)[1]>0)lo=m;else hi=m;}
        dt=hi;st=stage(H,v,dt);st[1]=0;
      }
      var Hp=H,vp=v;
      H=st[0];v=st[1]>0?st[1]:0;t+=dt;n++;rej=0;
      fac=Math.max(0.2,Math.min(4,0.9/Math.sqrt(err>1e-16?err:1e-16)));
      dtNext=dt*fac;
      if(v>peak)peak=v;
      var accNew=acc(H,v);
      if(!peakDone&&accPrev>0&&accNew<=0){
        lo=0;hi=dt;
        for(j=0;j<60;j++){m=0.5*(lo+hi);q=stage(Hp,vp,m);if(acc(q[0],q[1])>0)lo=m;else hi=m;}
        q=stage(Hp,vp,0.5*(lo+hi));
        if(q[1]>peak)peak=q[1];
        peakDone=true;
      }
      accPrev=accNew;
      tx.push(t);th.push(fill?(s.hBoundary-H):(s.hBoundary+H));tv.push(v);
      if(v<=0&&H<=0)break;
    }
    guardHit=n>=GUARD;
  }
  var hEnd=n>0?(fill?(s.hBoundary-H):(s.hBoundary+H)):s.h0,
      x=[],hh=[],vv=[],stride=Math.max(1,Math.ceil(tx.length/NPLOT)),k;
  for(k=0;k<tx.length;k+=stride){x.push(tx[k]);hh.push(th[k]);vv.push(tv[k]);}
  if(tx.length&&x[x.length-1]!==tx[tx.length-1]){
    x.push(tx[tx.length-1]);hh.push(th[th.length-1]);vv.push(tv[tv.length-1]);}
  var Vdot=Ap*v,dp=s.rho*g*Math.max(0,fill?(s.hBoundary-hEnd):(hEnd-s.hBoundary)),w=[];
  if(s.Atank<=0||s.L<=0)w.push('Tank area and liquid-column length must be positive.');
  if(guardHit)w.push('Step guard reached before the column came to rest; the terminal time is a lower bound.');
  return {h:hEnd,v:v,Vdot:Vdot,p:101325+dp,dp:dp,rho:s.rho,peak:peak,time:t,
    series:[{x:x,y:hh},{x:x,y:vv}],
    a11y:'Tank level and pipe velocity history.',
    warnings:w,
    notes:['Total loss coefficient fL/D + K = '+Kt.toPrecision(4)+'.',
           'Time integration: L-stable two-stage Rosenbrock (ROS2) march with the step set by its own embedded error estimate at a tolerance of '+RTOL+' on the initial head and velocity scales; the terminal stop and the velocity peak are located by bisection inside the step that brackets them. The simulation-time input can only shorten the final step onto the requested horizon; it does not set the step, and the reported terminal state does not depend on it.',
           'Steps taken: '+n+'.']};}

function hoRanges(){

    bounded +-10000 m, so the flow accepted is the one whose required head stays

 var Ap=Math.PI*state.D*state.D/4,

function hoApply(p){

 python:function(){return {code:"\ndef compute():\n    mode=INPUTS['mode']; Atank=INPUTS['Atank']; h0=INPUTS['h0']; hb=INPUTS['hBoundary']\n    D=INPUTS['D']; L=INPUTS['L']; f=INPUTS['f']; K=INPUTS['K']; rho=INPUTS['rho']; tEnd=INPUTS['tEnd']\n    g=9.80665; Ap=math.pi*D*D/4; Kt=f*L/D+K; alpha=Ap/Atank; fill=(mode=='fill')\n    H0=(hb-h0) if fill else (h0-hb)\n    RTOL=1e-7; GUARD=400000; GAM=1.0-2.0**-0.5\n    def acc(H,v): return (g*H-Kt*v*abs(v)/2.0)/L\n    def stage(H,v,dt):\n        a12=GAM*dt*alpha; a21=-GAM*dt*g/L; a22=1.0+GAM*dt*Kt*abs(v)/L; det=a22-a12*a21\n        r1=-alpha*v; r2=acc(H,v)\n        k1a=(a22*r1-a12*r2)/det; k1b=(r2-a21*r1)/det\n        H2=H+dt*k1a; v2=v+dt*k1b\n        q1=-alpha*v2-2.0*k1a; q2=acc(H2,v2)-2.0*k1b\n        k2a=(a22*q1-a12*q2)/det; k2b=(q2-a21*q1)/det\n        return (H+1.5*dt*k1a+0.5*dt*k2a, v+1.5*dt*k1b+0.5*dt*k2b,\n                0.5*dt*(k1a+k2a), 0.5*dt*(k1b+k2b))\n    H=H0; v=0.0; t=0.0; peak=0.0; n=0; rej=0\n    if H0>0 and alpha>0 and L>0 and tEnd>0:\n        vLoss=math.sqrt(2*g*H0/Kt) if Kt>0 else float('inf')\n        vScale=min(vLoss,H0*math.sqrt(g/(alpha*L))); hScale=H0\n        atolH=1e-3*RTOL*hScale; atolV=1e-3*RTOL*vScale\n        tau=min(L*vScale/(g*H0), math.sqrt(L/(g*alpha)))\n        dtNext=1e-6*tau; dtFloor=1e-12*tau\n        accPrev=acc(H0,0.0); peakDone=False\n        while t<tEnd and n<GUARD:\n            if H<=0 and v<=0: break\n            dt=min(max(dtNext,dtFloor), tEnd-t)\n            if not dt>0: break\n            st=stage(H,v,dt)\n            err=max(abs(st[2])/(atolH+RTOL*abs(H)), abs(st[3])/(atolV+RTOL*abs(v)))\n            if err>1 and dt>dtFloor and rej<40:\n                dtNext=max(dtFloor, dt*max(0.2, 0.9/math.sqrt(err))); rej+=1; continue\n            if st[1]<=0:\n                lo=0.0; hi=dt\n                for _ in range(60):\n                    m=0.5*(lo+hi)\n                    if stage(H,v,m)[1]>0: lo=m\n                    else: hi=m\n                dt=hi; st=list(stage(H,v,dt)
