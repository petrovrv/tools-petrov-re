function pageVal(p){
  p=p||DOCKBOX;if(!p)return;
  p.innerHTML="";
  p.append(el("div","dgu-verdict",t("val_intro")));
  const rows=VCASES();
  let pass=0;
  const mk=(grp,title)=>{
    const items=rows.filter(r=>r.grp===grp);
    if(!items.length)return null;
    const c=el("div","hx-card");
    c.append(el("h3",null,title));
    const tb=el("table","hx-t");
    tb.innerHTML=`<thead><tr><th>${t("val_check")}</th><th>${t("val_ref")}</th><th>${t("val_model")}</th>
      <th>${t("val_dev")}</th></tr></thead>`;
    const bd=el("tbody");
    items.forEach(r=>{
      const dev=Math.abs(r.ref)>1e-12?Math.abs(r.got-r.ref)/Math.abs(r.ref):Math.abs(r.got-r.ref);
      const ok=isFinite(dev)&&dev<=r.tol;
      if(ok)pass++;
      const f=v=>Math.abs(v)>=1e5||(Math.abs(v)<1e-3&&v!==0)?v.toExponential(3):fmt(v,4);
      const tr=el("tr");
      tr.innerHTML=`<td>${r.name}<small>${r.src||""}</small></td>
        <td>${f(r.ref)} <span class="dgu-hint" style="display:inline">${r.unit}</span></td>
        <td>${f(r.got)}</td>
        <td style="color:${ok?"var(--ok)":"var(--warn)"};font-weight:650" title="${ok?t("val_pass"):t("val_fail")}">
          ${ok?"✓":"!"} ${(dev*100).toFixed(dev<0.001?3:2)} %</td>`;
      bd.append(tr);
    });
    tb.append(bd);
    const sc=el("div","dgu-table-wrap");sc.append(tb);c.append(sc);
    return c;
  };
  const g=el("div","hx-grid");
  const a=mk("case",t("val_case"));if(a)g.append(a);
  const b=mk("lib",t("val_lib"));if(b)g.append(b);
  p.append(g);
  const sum=el("div","dgu-verdict "+(pass===rows.length?"ok":"warn"));
  sum.textContent=t("val_sum")+": "+pass+" / "+rows.length;
  p.insertBefore(sum,p.firstChild.nextSibling);
  p.append(el("div","dgu-verdict",t("val_note")));
}

const HELP={
ru:`<h2>Как считает HX-Lab</h2>
<p><b>Тепловой расчёт</b> ведётся методом ε–NTU с итерацией по свойствам сред: температуры на выходе → средние температуры → свойства → коэффициенты теплоотдачи → U → NTU → ε → новые температуры (до сходимости). Для конструктивного режима размер аппарата подбирается делением пополам так, чтобы расчётная мощность совпала с требуемой, затем добавляется запас поверхности.</p>
<h3>Корреляции теплоотдачи</h3>
<ul>
<li><b>Пластинчатый (шевронный)</b> — Martin (1996), обобщённое уравнение Левека: Nu = 0,122·Pr<sup>1/3</sup>·(μ/μ<sub>w</sub>)<sup>1/6</sup>·[ξ·Re²·sin2β]<sup>0,374</sup>; ξ по Мартину, d<sub>h</sub>=2b/Φ.</li>
<li><b>Широкозазорный</b> — та же модель при b = 6…16 мм, Φ≈1,05, β≈45°. Корреляция экстраполирована — точность ниже (±25 %).</li>
<li><b>В трубах</b> — Гнилинский (Re&gt;10⁴), Хаузен (ламинар), плавная сшивка в переходной зоне; опционально <b>Стендер–Меркель</b> для воды: α=2040(1+0,015·θ)·v<sup>0,87</sup>·d<sup>−0,13</sup> (Handboek Installatietechniek, ф. 15/16).</li>
<li><b>Межтрубное пространство</b> — Керн: Nu = 0,36·Re<sup>0,55</sup>·Pr<sup>1/3</sup>·(μ/μ<sub>w</sub>)<sup>0,14</sup>; либо упрощённый Белл–Делавэр с поправками J<sub>c</sub>, J<sub>l</sub>, J<sub>b</sub>.</li>
<li><b>Воздушная сторона</b> — пучок труб: Nu = 0,33·Re<sup>0,6</sup>·Pr<sup>1/3</sup> по скорости в сжатом сечении; поверхности и A<sub>e</sub>/A<sub>i</sub> из таблицы 3.5-1; ΔP по рис. 3.5-22.</li>
<li><b>Кипение</b> — Гунгор–Уинтертон (1986): α = E·α<sub>l</sub> + S·α<sub>nb</sub>, α<sub>nb</sub> по Куперу; для горизонтальных аппаратов вводится поправка на расслоение по числу Фруда.</li>
<li><b>Конденсация</b> — Нуссельт для вертикальной плёнки с волновым и турбулентным режимами (Re<sub>f</sub> ≷ 30/1800), для горизонтального пучка — 0,729·[…/(N·d)]<sup>1/4</sup>. Отсюда разница между вертикальным и горизонтальным исполнением.</li>
<li><b>Пульсирующий «тяни-толкай»</b> — две модели: (а) эмпирическое усиление конвекции по амплитуде хода и числу Уомерсли α<sub>w</sub>=r√(ω/ν); (б) осциллирующий перенос по Курцвегу с эффективной температуропроводностью D<sub>eff</sub> ~ Δx²ω. Модель полуэмпирическая — коэффициент C настраивается по стенду.</li>
</ul>
<h3>Схемы тока</h3>
<p>ε–NTU: противоток, прямоток, перекрёстный (оба неперемешанных и с перемешиванием Cmax), 1-2 и 2-4 кожухотрубные. График γ–β воспроизводит рис. 3.5-17…3.5-19 «Handboek Installatietechniek»: β = UA/(c·q)<sub>гор</sub>, α = (c·q)<sub>гор</sub>/(c·q)<sub>хол</sub>, γ = (T<sub>wi</sub>−T<sub>wu</sub>)/(T<sub>wi</sub>−T<sub>ki</sub>).</p>
<p>Перекрёстный ток с обоими неперемешанными средами считается по <b>точному ряду Мейсона (1954)</b>, а не по известному приближению Инкроперы (ур. 11.32), которое отличается от точного решения до 3,8 % при малых NTU и C*→1; приближение оставлено только как запасной вариант при отсутствии сходимости ряда.</p>
<p><b>Поправка F</b> = Δt<sub>ср</sub>/LMTD<sub>противоток</sub> выводится из схемы тока (Боумен/TEMA для кожухотрубных, обращение ε–NTU для остальных) и сверяется с F = Q/(U·A·LMTD); нижнего ограничения нет. F ниже 0,75 — не погрешность, а признак неподходящей схемы тока, о чём выдаётся предупреждение. Если мощность ограничена теплотой фазового перехода, ε и F пересчитываются по фактической (ограниченной) мощности, чтобы U·A·F·LMTD совпадало с показанным Q.</p>
<h3>Что учитывается ещё</h3>
<p>Загрязнение по TEMA, термическое сопротивление стенки (для труб — логарифмическое), поправка на вязкость у стенки (μ/μ<sub>w</sub>), потери в портах ПТО, число перегородок, оребрение (η₀), эрозионные и ΔP-ограничения.</p>
<h3>Границы применимости — что модель НЕ делает</h3>
<ul>
<li>Двухфазный расчёт ведётся по средним параметрам (среднее паросодержание), без пошагового интегрирования по длине и <b>без учёта кризиса теплообмена (dryout)</b> при x → 1.</li>
<li>Потери давления двухфазного потока — гомогенная модель; для точных значений нужен Локхарт–Мартинелли/Фридель.</li>
<li>Белл–Делавэр реализован упрощённо: J<sub>c</sub> зависит от выреза перегородки, а J<sub>l</sub> (перетечки) и J<sub>b</sub> (байпас) приняты постоянными 0,80 и 0,90 — реальные зазоры не учитываются.</li>
<li>Керн справедлив при Re &gt; 2·10³; ниже результат экстраполирован.</li>
<li>Воздушная сторона: корреляция гладкого пучка с поправкой 0,8 на оребрение; КПД оребрения η₀ задаётся пользователем, а не рассчитывается по высоте и толщине ребра.</li>
<li>Свойства сред — инженерные аппроксимации: вода ±1 %, гликоли ±8 %, масла ±15 %, хладагенты ±3 % (R410A ±5 %).</li>
<li>Пульсирующий режим — полуэмпирическая модель с настраиваемым коэффициентом C, требует валидации на стенде.</li>
<li>Не учитываются: неконденсирующиеся газы, переохлаждение конденсата и перегрев пара, распределение потока по каналам, тепловые потери в окружающую среду, механика (прочность, вибрация труб).</li>
</ul>
<p>Инструмент не заменяет расчёт производителя и не является основанием для сертификации.</p>`,
en:`<h2>How HX-Lab computes</h2>
<p><b>Thermal rating</b> uses the ε–NTU method with property iteration: outlet temperatures → mean temperatures → properties → film coefficients → U → NTU → ε → new outlets, until convergence. In sizing mode the unit size is found by bisection so that the calculated duty matches the required one, then the surface margin is added.</p>
<h3>Correlations</h3>
<ul>
<li><b>Chevron plate</b> — Martin (1996) generalised Lévêque: Nu = 0.122·Pr<sup>1/3</sup>·(μ/μ<sub>w</sub>)<sup>1/6</sup>·[ξ·Re²·sin2β]<sup>0.374</sup>, d<sub>h</sub>=2b/Φ.</li>
<li><b>Wide-gap plate</b> — same model with b = 6…16 mm, Φ≈1.05; extrapolated, ±25 %.</li>
<li><b>Tube side</b> — Gnielinski / Hausen with transition blending; optional <b>Stender–Merkel</b> for water: α=2040(1+0.015·θ)·v<sup>0.87</sup>·d<sup>−0.13</sup>.</li>
<li><b>Shell side</b> — Kern, or simplified Bell–Delaware with J<sub>c</sub>, J<sub>l</sub>, J<sub>b</sub> corrections.</li>
<li><b>Air side</b> — tube bank Nu = 0.33·Re<sup>0.6</sup>·Pr<sup>1/3</sup>; surface ratios from table 3.5-1, ΔP after fig. 3.5-22.</li>
<li><b>Boiling</b> — Gungor–Winterton (1986) with Cooper nucleate term; Froude stratification correction for horizontal units.</li>
<li><b>Condensation</b> — Nusselt vertical film (laminar / wavy / turbulent) or horizontal bank 0.729·[…/(N·d)]<sup>1/4</sup> — this is where orientation matters.</li>
<li><b>Pulsating push–pull</b> — (a) empirical convection enhancement vs stroke and Womersley number; (b) Kurzweg oscillating transport with D<sub>eff</sub> ~ Δx²ω. Semi-empirical, coefficient C to be tuned.</li>
</ul>
<h3>Arrangements</h3>
<p>ε–NTU for counter, parallel, crossflow (both unmixed / Cmax mixed), 1-2 and 2-4 shell-and-tube. The γ–β chart reproduces fig. 3.5-17…3.5-19 of the Dutch "Handboek Installatietechniek".</p>
<p>Crossflow with both fluids unmixed uses the <b>exact Mason (1954) series</b>, not the familiar Incropera Eq. 11.32 approximation, which departs from the exact solution by up to 3.8 % at low NTU and C*→1; that approximation is kept only as a fallback if the series fails to converge.</p>
<p>The <b>correction factor F</b> = Δt<sub>m</sub>/LMTD<sub>counterflow</sub> is derived from the arrangement (Bowman/TEMA for shell-and-tube, an ε–NTU inversion otherwise) and cross-checked against F = Q/(U·A·LMTD); there is no lower clamp. An F below 0.75 is not a numerical artefact but a sign that the arrangement is unsuitable, and it is reported as a warning. When the duty is limited by the latent capacity of a phase-change side, ε and F are re-derived from that capped duty so that U·A·F·LMTD reproduces the Q shown.</p>
<h3>What the model does NOT do</h3>
<ul>
<li>Two-phase duty is evaluated at the mean vapour quality — no stepwise integration along the length and <b>no dryout / CHF limit</b> as x → 1.</li>
<li>Two-phase pressure drop uses the homogeneous model; Lockhart–Martinelli / Friedel is needed for accurate values.</li>
<li>Bell–Delaware is simplified: J<sub>c</sub> follows the baffle cut, while J<sub>l</sub> (leakage) and J<sub>b</sub> (bypass) are fixed at 0.80 and 0.90 — real clearances are not modelled.</li>
<li>Kern is valid for Re &gt; 2·10³; below that the result is extrapolated.</li>
<li>Air side: smooth-bank correlation with a 0.8 finned-bundle factor; fin efficiency η₀ is a user input, not computed from fin height and thickness.</li>
<li>Fluid data are engineering fits: water ±1 %, glycols ±8 %, oils ±15 %, refrigerants ±3 % (R410A ±5 %).</li>
<li>The pulsating mode is a semi-empirical model with a tunable coefficient C and needs bench validation.</li>
<li>Not covered: non-condensable gases, subcooling and superheat, maldistribution between channels, ambient heat loss, mechanical design (strength, tube vibration).</li>
</ul>
<p>Correlations ±15…30 %. Not a substitute for a vendor calculation.</p>`

function renderChartPNG(host,drawFn,w,h){

  cv.style.width=w+"px";cv.style.height=h+"px";

function methodList(){
  const st=ST,L=[];
  if(st.type==="plate"||st.type==="widegap")
    L.push("Martin (1996) — Nu = 0,122·Pr^(1/3)·(μ/μw)^(1/6)·[ξ·Re²·sin2β]^0,374; d<sub>h</sub> = 2b/Φ"
      +(st.type==="widegap"?" — extrapolated to wide-gap channels (b &gt; 6 mm)":""));
  if(st.type==="shell"){
    L.push(st.opts.tubeCorr==="stender"&&(st.opts.tubeSide==="h"?st.hot:st.cold).fluid==="water"
      ? "Stender–Merkel: α = 2040(1+0,015·θ)·v^0,87·d^−0,13 (Handboek Installatietechniek)"
      : "Gnielinski / Hausen (tube side) with transition blending");
    L.push(st.opts.shellMethod==="bell"?"Bell–Delaware (simplified, J<sub>c</sub>·J<sub>l</sub>·J<sub>b</sub>)":
      "Kern: Nu = 0,36·Re^0,55·Pr^(1/3)·(μ/μw)^0,14");
  }
  if(st.type==="dbl")L.push("Gnielinski (inner tube) + annulus correlation, D<sub>h</sub> = D<sub>i</sub> − d<sub>o</sub>");
  if(st.type==="air")L.push("Tube bank Nu = 0,33·Re^0,6·Pr^(1/3); surface data — tabel 3.5-1, ΔP — fig. 3.5-22");
  if(st.type==="pulse")L.push(st.geom.pulse.model==="kurzweg"
      ? "Kurzweg (1985) oscillating transport, D<sub>eff</sub> ~ Δx²ω, Womersley α<sub>w</sub> = r√(ω/ν)"
      : "Empirical pulsation enhancement E(Δx/d, α<sub>w</sub>), C = "+ST.geom.pulse.C);
  [["hot",st.hot],["cold",st.cold]].forEach(([k,s])=>{
    if(s.phase==="evap")L.push("Gungor–Winterton (1986) + Cooper nucleate boiling — "+t("sec_"+k)
      +(st.orient==="horiz"?" (Froude stratification correction)":""));
    if(s.phase==="cond")L.push((st.orient==="vert"||st.type==="plate"||st.type==="widegap")
      ? "Nusselt vertical film condensation (laminar / wavy / turbulent) — "+t("sec_"+k)
      : "Horizontal tube bank condensation 0,729·[…/(N·d)]^(1/4) — "+t("sec_"+k));
  });
  L.push("ε–NTU: "+t("a_"+st.arr)+"; "+t("f_orient")+": "+t("o_"+st.orient));
  L.push("R = 1/α<sub>h</sub> + R<sub>f,h</sub> + δ/λ + R<sub>f,c</sub> + 1/α<sub>c</sub>"
     +(st.type==="shell"||st.type==="dbl"?" (referred to the outside area, log wall resistance)":""));
  return L;
}

/* ======================= DOCK / RENDER / RUN =======================
   The old page was seven tabs.  Four of them — Process, Geometry, Results and
   the schematic — are now regions of the calculator shell and are on screen at
   the same time, which is what the archetype buys: Calculate no longer jumps
   the user away from the inputs.  The other three sheets plus the manual are
   secondary reading and live in the dock, behind a real role="tablist".
   `curTab` keeps its old name and its old domain because it is part of the
   permalink payload; a stored value of setup/geom/res simply selects no dock
   sheet, so a link made before the port round-trips unchanged.               */
const DOCK_IDS=["charts","val","db","help"];
let curTab="setup";
let APP=null,STAGE=null,DOCKTABS=null,DOCKBOX=null;
function dockSel(){return DOCK_IDS.indexOf(curTab)>=0?curTab:"charts";}

   call it, and because the document title follows the language */
function render(){
  document.title="HX-Lab · "+t("app");
  /* a language or a unit system arriving with a permalink or a handoff has to
     relabel the whole form, exactly as APP.rebuild() does for the shell */
  if(BARE){if(BARE.lang!==LANG||BARE.unit!==UNIT)bareBuild();else bareSync();return;}

/* the single compute entry point the shell calls; identical arithmetic to the
   old run(), including the sizing write-back of the selected size */
/* the arithmetic, in one place, so the shell and the fallback form of bootBare()
   run byte-identical solves — the same sanitize, the same compute, the same
   sizing write-back */
function hxSolve(){
  sanitize();
  RES=compute(JSON.parse(JSON.stringify(ST)));
  if(RES&&RES.sizing&&RES.sizing.ok){       // adopt the selected size as the new geometry
    const k=RES.sizing.key, v=RES.sizing.scaleMargin;
    const tgt=(ST.type==="widegap")?ST.geom.wide
             :ST.type==="plate"?ST.geom.plate
             :ST.type==="shell"?ST.geom.shell
             :ST.type==="dbl"?ST.geom.dbl
             :ST.type==="air"?ST.geom.air:ST.geom.pulse;
    if(tgt[k]!==v)tgt[k]=v;
  }
}
function hxCompute(){
  try{
    hxSolve();
  }catch(e){
    RES=null;console.error(e);
    if(APP)APP.setState("error",String(e&&e.message||e));
    return null;
  }
  const out=hxResults();
  if(APP)APP.sync();
  if(STAGE)STAGE.schedule();
  requestAnimationFrame(renderDock);
  return out;
}

/* ---------- import ----------
   The shared bar exports the record as JSON but has no import, so reading back a
   case the user saved from this page is a capability of the tool and not of the
   bar.  Behaviour and file format are the ones this page always had: a plain
   JSON object with the shape of ST, deep-merged over the current state, then
   sanitize() + render() + run().  A payload written by the permalink
   (`{v,lang,unit,tab,st}`) is unwrapped so the two shapes cannot be confused;
   nothing else about the format changed.  Errors are announced through the one
   message surface the framework owns instead of window.alert().              */
function fileInput(){
  let f=document.getElementById("fileIn");
  if(!f){
    f=document.createElement("input");
    f.type="file";f.id="fileIn";f.accept=".json,application/json";
    f.style.display="none";f.tabIndex=-1;f.setAttribute("aria-hidden","true");
    f.onchange=e=>{const file=e.target.files[0];e.target.value="";if(file)readCase(file);};
    document.body.append(f);
  }
  return f;
}
function importCase(){fileInput().click();}
function noteMsg(msg,kind){
  if(APP&&APP.notify)APP.notify(msg,{kind:kind});
  else if(window.Diagram&&Diagram.notify)Diagram.notify(msg,kind);
  else if(kind==="err")alert(msg);
}
function readCase(file){
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      let obj=JSON.parse(rd.result);
      if(!obj||typeof obj!=="object"||Array.isArray(obj))throw new Error("not an object");
      if(obj.st&&typeof obj.st==="object")obj=obj.st;      /* a permalink payload */
      deepMerge(ST,obj);
      sanitize();
      render();
      run();
      noteMsg(t("b_load_ok")+": "+file.name,"ok");
    }catch(err){
      noteMsg(t("b_load_err")+" — JSON: "+(err&&err.message||err),"err");
    }
  };
  rd.onerror=()=>noteMsg(t("b_load_err")+": "+file.name,"err");
  rd.readAsText(file);
}

/* Below md the framework moves #dgc-bar and #eng-disc-badge into a dock inside
   the shell node; App.rebuild() destroys that node, and with it the shared
   chrome.  Park the chrome on <body> across the rebuild and hand it back. */
function rebuildKeepingChrome(app){
  const ids=["dgc-bar","eng-disc-badge","dgc-menu","dgc-notes"];
  const kept=ids.map(id=>document.getElementById(id)).filter(Boolean);
  const docked=document.documentElement.getAttribute("data-dgu-chrome")==="flow";
  kept.forEach(n=>document.body.appendChild(n));
  app.rebuild();
  const live=DiagramUI.current;
  const dock=(docked&&live&&live.node)?live.node.querySelector(".dgu-chromedock"):null;
  if(dock){kept.forEach(n=>dock.appendChild(n));dock.hidden=false;}
  try{DiagramUI.measure();}catch(e){}
}
function patchLanguage(app){
  const proto=Object.getPrototypeOf(app);
  if(!proto.__hxLang){
    proto.__hxLang=true;
    proto.setLang=function(l){
      if(LI[l]===undefined)return this.lang;
      LANG=l;this.lang=l;
      persistLang(l);
      try{const u=new URL(location.href);u.searchParams.set("lang",l);history.replaceState(null,"",u);}catch(e){}
      try{if(window.Diagram&&Diagram.setLang)Diagram.setLang(l);}catch(e){}
      document.documentElement.lang=l;
      rebuildKeepingChrome(this);
      return l;
    };
  }
  const sels=app.head?app.head.querySelectorAll("select.dgu-sel"):[];
  for(let i=0;i<sels.length;i++){
    const sel=sels[i];
    if(sel.dataset.hxUnits)continue;
    let isLang=sel.options.length>0;
    for(let j=0;j<sel.options.length;j++)
      if(SITE_LANGS.indexOf(sel.options[j].value)<0&&sel.options[j].value!=="ru")isLang=false;
    if(!isLang)continue;
    if(!sel.querySelector('option[value="ru"]')){
      const o=document.createElement("option");o.value="ru";o.textContent="Русский";
      sel.insertBefore(o,sel.firstChild);
    }
    for(let j=0;j<sel.options.length;j++){
      const nm=LANGS.find(x=>x[0]===sel.options[j].value);
      if(nm)sel.options[j].textContent=nm[1];
    }
    sel.value=LANG;
  }
}
/* ---- the page-level unit control -----------------------------------------
   This tool carries its own SI|US registry over eighteen dimensions (W/m²K,
   m²K/W, kJ/kgK, mPa·s, BTU/h·ft²·F, GPM, …).  The shared registry in
   diagram-ui.js has nine SI bases and no US entry for most of them, so
   App.hasConvertibleUnits() finds nothing convertible and never draws the
   control.  Rather than lose eighteen dimensions of conversion, the control is
   rebuilt here in the framework's own class, in the framework's own place, and
   drives the tool's table.  The registry gap belongs upstream.               */
function unitFromSystem(){return DiagramUI.units.system()==="us"?"us":"si";}
function patchUnits(app){
  const right=app.head?app.head.querySelector(".dgu-head-r"):null;
  if(!right||right.querySelector("select[data-hx-units]"))return;
  const sel=document.createElement("select");
  sel.className="dgu-sel";sel.dataset.hxUnits="1";
  sel.setAttribute("aria-label",app.t("units"));
  [["si","SI"],["us","US"]].forEach(p=>{
    const o=document.createElement("option");o.value=p[0];o.textContent=p[1];sel.append(o);});
  sel.value=UNIT;
  sel.onchange=()=>{
    DiagramUI.units.set(sel.value==="us"?"us":"si");
    UNIT=unitFromSystem();
    rebuildKeepingChrome(app);
  };
  right.insertBefore(sel,app.learnBtn||right.firstChild);
}

   still work — not merely still print.  So this is not a second framework and
   not a second UI: the very same field definitions that hxPanels() hands to
   DiagramUI drive a plain form here, through the same label()/options()/
   visible()/get()/set() contract, the same sanitize(), the same solver by way
   of hxSolve(), the same drawScheme() and the same record.  What is missing is
   the shell — the header, the learn layer, the dock and the tour — and nothing
   else.  The shared bar still carries the permalink, the record, the report,
   the CSV/JSON export and the Python export, because Diagram.init() was never
   gated on diagram-ui.js.                                                     */

const bareText=v=>(typeof v==="function"?v():v)||"";
function bareUnitName(d){
  const u=d.unit?String(d.unit):"";
  return u.indexOf("hx/")===0?uname(u.slice(3)):"";
}
function bareVisible(d){return !d.visible||d.visible({state:ST});}
function bareOpts(d){
  const o=(typeof d.options==="function"?d.options():d.options)||[];
  return o.map(x=>Array.isArray(x)?[x[0],bareText(x[1])]:[x,String(x)]);
}
function bareGet(d){return d.get?d.get(ST):(d.key?gp(ST,d.key):null);}
function bareSet(d,v){if(d.set)d.set(v,ST);else if(d.key)sp(ST,d.key,v);}

/* one row per declared field; the shim carries the {def,node,control} shape the
   field definitions' own dyn() hooks already expect, so the concentration range
   still takes its bounds from the fluid and the saturation hints still update */
function bareRow(d,host){
  const row=document.createElement("p");row.className="hx-brow";
  const shim={def:d,node:row,control:null,hint:null,out:null};
  if(d.type==="note"){
    const n=document.createElement("span");n.className="dgu-hint";
    n.textContent=bareText(d.label);row.append(n);shim.hint=n;
    host.append(row);return shim;
  }
  const id="bare-"+(d.id||d.key);
  const lab=document.createElement("label");lab.htmlFor=id;
  lab.textContent=bareText(d.label);row.append(lab);
  let ctl;
  if(d.type==="readonly"){
    ctl=document.createElement("output");shim.out=ctl;
  }else if(d.type==="select"||d.type==="segmented"){
    ctl=document.createElement("select");
  }else{
    ctl=document.createElement("input");
    ctl.type=d.type==="range"?"range":"number";
    if(d.step)ctl.step=d.step;
    if(d.min!==undefined)ctl.min=d.min;
    if(d.max!==undefined)ctl.max=d.max;
  }
  ctl.id=id;ctl.setAttribute("aria-label",bareText(d.label));
  row.append(ctl);shim.control=ctl;
  const u=bareUnitName(d);
  if(u){const s=document.createElement("span");s.className="hx-bu";s.textContent=u;row.append(s);}
  if(d.hint||d.dyn){const h=document.createElement("span");h.className="dgu-hint";
    row.append(h);shim.hint=h;}
  if(d.type!=="readonly"){
    const commit=()=>{
      let v;
      if(d.type==="select"||d.type==="segmented")v=ctl.value;
      else v=ctl.value===""?null:+ctl.value;   /* an empty box leaves the stored value alone */
      bareSet(d,v);
      bareRun();bareSync();
    };
    ctl.addEventListener("input",commit);
    ctl.addEventListener("change",commit);
  }
  host.append(row);
  return shim;
}
function bareSync(){
  if(!BARE)return;
  BARE.panels.forEach(p=>{
    let any=false;
    p.rows.forEach(r=>{
      const d=r.def,vis=bareVisible(d);
      r.node.hidden=!vis;
      if(!vis)return;
      any=true;
      if(d.type==="note"&&r.hint)r.hint.textContent=bareText(d.label);
      else if(d.type==="readonly"&&r.out){const v=bareGet(d);r.out.textContent=v==null?"—":String(v);}
      else if(r.control&&r.control!==document.activeElement){
        if(d.type==="select"||d.type==="segmented"){
          const opts=bareOpts(d),sig=JSON.stringify(opts);
          if(r.sig!==sig){r.sig=sig;r.control.innerHTML="";
            opts.forEach(o=>{const op=document.createElement("option");
              op.value=o[0];op.textContent=o[1];r.control.append(op);});}
          r.control.value=String(bareGet(d));
        }else{
          const v=bareGet(d);
          r.control.value=(v==null||!isFinite(v))?"":fmtIn(v);
        }
      }
      const un=r.node.querySelector(".hx-bu");
      if(un)un.textContent=bareUnitName(d);
      if(d.hint&&r.hint)r.hint.textContent=bareText(d.hint);
      if(d.dyn){try{d.dyn(r);}catch(e){}}
    });
    p.node.hidden=!any;
    if(p.legend)p.legend.textContent=bareText(p.def.title);
  });
}

let BARE_DEFAULTS=null;
function bareBuild(){
  const box=document.getElementById("app")||document.body;
  box.className="hx-bare";box.innerHTML="";
  sanitize();
  if(!BARE_DEFAULTS)BARE_DEFAULTS=JSON.parse(JSON.stringify(ST));
  const DEFAULTS=BARE_DEFAULTS;
  const h1=document.createElement("h1");h1.textContent=t("app");box.append(h1);
  const msg=document.createElement("p");
  msg.textContent=BARE_MSG[LI[LANG]]||BARE_MSG[1];box.append(msg);
  document.title="HX-Lab · "+t("app");

  /* the same panels, the same fields, in the same order */
  const panels=hxPanels().map(def=>{
    const fs=document.createElement("fieldset");
    const lg=document.createElement("legend");lg.textContent=bareText(def.title);
    fs.append(lg);box.append(fs);
    return{def:def,node:fs,legend:lg,rows:(def.fields||[]).map(f=>bareRow(f,fs))};
  });

  /* examples, reset and the case import — the placement law's inputs footer,
     flattened into one row because there is no shell to put a footer in */
  const acts=document.createElement("div");acts.className="hx-bactions";box.append(acts);
  const mkb=(txt,title,fn)=>{const b=document.createElement("button");
    b.type="button";b.textContent=txt;if(title)b.title=title;b.onclick=fn;acts.append(b);return b;};
  EXAMPLES.forEach((ex,i)=>mkb(EX_LABELS[i]?(EX_LABELS[i][LI[LANG]]||EX_LABELS[i][1]):ex.name,
    EX_NOTES[i]||"",()=>{ex.apply(ST);sanitize();bareRun();bareSync();}));
  mkb(t("b_reset")||"Reset",null,()=>{deepMerge(ST,JSON.parse(JSON.stringify(DEFAULTS)));
    sanitize();bareRun();bareSync();});
  mkb("⇧ "+t("b_load"),t("b_load_t"),()=>importCase());

  const cv=document.createElement("canvas");cv.id="cvScheme";box.append(cv);
  const inf=document.createElement("div");inf.id="cvSchemeInfo";box.append(inf);
  const res=document.createElement("div");box.append(res);
  const dis=document.createElement("p");dis.textContent=t("disclaimer");box.append(dis);

  BARE={panels:panels,msg:msg,cv:cv,res:res,lang:LANG,unit:UNIT};
  bareRun();bareSync();
}
/* Section 4.4's safe area, by hand: diagram-ui.js is the thing that measures the
   shared furniture and reserves room for it, and diagram-ui.js is exactly what
   is missing here, so the fallback measures #dgc-bar and #eng-disc-badge itself
   rather than letting the bar sit on top of a live control. */
function bareSafeArea(){
  const box=document.querySelector(".hx-bare");if(!box)return;
  let h=0;
  ["dgc-bar","eng-disc-badge"].forEach(id=>{const n=document.getElementById(id);
    if(n&&getComputedStyle(n).position==="fixed")h=Math.max(h,n.getBoundingClientRect().height);});
  box.style.paddingBottom=(h?h+24:16)+"px";
}
function bootBare(){
  bareBuild();
  /* the data layer is not gated on the shell: the bar, the permalink, the
     record, the report and the exports exist from the manifest alone */
  dgcInit();
  bareSafeArea();
  setTimeout(bareSafeArea,600);
  window.addEventListener("resize",bareSafeArea);
}
function boot(){
  if(!window.DiagramUI||DiagramUI.api!=="tools.petrov.re/ui/v1"){bootBare();return;}
  UNIT=unitFromSystem();
  sanitize();
  const DEFAULTS=JSON.parse(JSON.stringify(ST));

  const panels=hxPanels();
  /* Examples first, Reset last: the placement law, declared so a rebuild keeps them */
  panels.unshift({id:"dgu-examples",slot:"inputs",title:()=>fwT("examples"),render:(box,ctx)=>{
    EXAMPLES.forEach((ex,i)=>{
      const b=document.createElement("button");
      b.type="button";b.className="dgu-btn";
      b.style.cssText="justify-content:flex-start;text-align:left;height:auto;padding:8px 12px";
      const w=document.createElement("span");
      const t1=document.createElement("div");t1.style.fontWeight="650";
      t1.textContent=EX_LABELS[i]?(EX_LABELS[i][LI[LANG]]||EX_LABELS[i][1]):ex.name;
      const t2=document.createElement("div");t2.className="dgu-hint";t2.textContent=EX_NOTES[i]||"";
      w.append(t1,t2);b.append(w);
      b.onclick=()=>ctx.app.example({label:t1.textContent,apply:s=>{ex.apply(s);sanitize();}});
      box.append(b);
    });
  }});
  /* Reset, and next to it the one export-shaped affordance the shared bar does
     not carry: reading a saved case back in.  The bar owns every direction that
     goes out of the page; this is the only one that comes in.                */
  panels.push({id:"hx-reset",slot:"inputs",render:(box,ctx)=>{
    const row=document.createElement("div");row.className="dgu-panel-actions";
    row.append(ctx.app.actionButton(ctx.app.resetAction()));
    row.append(ctx.app.actionButton({id:"hx-import",label:"⇧ "+t("b_load"),
      title:t("b_load_t"),variant:"ghost",run:()=>importCase()}));
    box.append(row);
  }});

  APP=DiagramUI.app({
    id:"heat-exchangers",mount:"#app",layout:"calculator",
    /* the manifest carries the six site languages; Russian falls back to the
       tool's own title so the h1 is never in the wrong language */

     names; the four that are now regions of the shell select no dock sheet, so
     a link built before the port round-trips byte for byte. */

    document.documentElement.lang=LANG;re=true;}
  if((s.unit==="si"||s.unit==="us")&&s.unit!==UNIT){UNIT=s.unit;

/* The report printed "no explicit acceptance checks were supplied for this
   state". The tool holds every number an engineer checks a heat exchanger
   against and stated none of them. Each card carries the value measured and
   the criterion it was measured against; nothing is graded without both. */
function dgcReportProfile(rec,ctx){
  const r=RES;
  if(!r||r.invalid)return null;
  const V=(v,u)=>ctx.value(v,u||"");
  const checks=[];

  /* F is one by construction in pure counter and parallel flow, so the check
     carries information only where the arrangement makes it less than one. */
  if(isFinite(r.F)&&ST.arr!=="counter"&&ST.arr!=="parallel")
    checks.push({status:r.F>=0.75?"pass":(r.F>=0.5?"attention":"fail"),
      title:t("ck_f"),actual:V(r.F,"-"),criterion:t("ck_f_crit"),basis:t("ck_f_basis")});

  /* A cold outlet above the hot outlet is a temperature cross: ordinary in
     counter flow, and what collapses F in a 1-2 or 2-4 shell and tube. */
  if(isFinite(r.tho)&&isFinite(r.tco)){
    const cross=r.tco>r.tho,st=ST.arr==="st12"||ST.arr==="st24";
    checks.push({status:cross&&st?"attention":"info",title:t("ck_cross"),
      detail:cross?t("ck_cross_y"):t("ck_cross_n"),
      actual:t("sec_hot")+" "+V(r.tho,"°C")+" · "+t("sec_cold")+" "+V(r.tco,"°C")});
  }

  if(isFinite(r.hh.Re)&&isFinite(r.hc.Re))
    checks.push({status:"info",title:t("ck_re"),
      actual:t("sec_hot")+" "+V(r.hh.Re,"-")+" · "+t("sec_cold")+" "+V(r.hc.Re,"-"),
      criterion:t("ck_re_crit")});

  if(ST.mode==="sizing"){
    const req=requiredDuty(ST);
    if(isFinite(req)&&req>0&&isFinite(r.Q))
      checks.push({status:r.Q>=req?"pass":"fail",title:t("ck_duty"),
        actual:V(r.Q,"W"),criterion:V(req,"W")});
  }

  /* The share of each resistance is the thermal-resistance table below and
     the bar under it; a card repeating those three numbers stated them a
     third time in one document. */

  return {checks:checks};
}

/* ---- handoff: the cold-side outlet stream and the duty ---- */
function dgcHandoffBuild(){
  if(!RES||RES.invalid)return null;
  const r=RES;
  const q={T:{value:r.tco+273.15,unit:"K"},Q:{value:r.Q,unit:"W"},
    U:{value:r.U,unit:"W/(m2.K)"},A:{value:r.Aref,unit:"m2"},
    NTU:{value:r.NTU,unit:"-"},eps:{value:r.eps,unit:"-"}};
  if(isFinite(r.C._m)&&r.C._m>0)q.mdot={value:r.C._m,unit:"kg/s"};
  if(isFinite(r.hc.dp))q.dp={value:r.hc.dp,unit:"Pa"};
  if(isFinite(ST.cold.p))q.p={value:ST.cold.p,unit:"Pa"};
  return {quantities:q};
}
function dgcHandoffApply(payload){
  const q=(payload&&payload.quantities)||{};
  const acc=[],ign=[];
  if(q.T&&isFinite(q.T.value)){
    const c=q.T.value-273.15;
    if(isPhase(ST.hot))ST.hot.tsat=c;else ST.hot.tin=c;
    acc.push("T");
  }
  if(q.p&&isFinite(q.p.value)&&q.p.value>0){ST.hot.p=q.p.value;acc.push("p");}
  if(q.mdot&&isFinite(q.mdot.value)&&q.mdot.value>0){
    ST.hot.flowMode="m";ST.hot.m=q.mdot.value;acc.push("mdot");}
  Object.keys(q).forEach(k=>{if(acc.indexOf(k)<0)ign.push(k);});
  sanitize();render();run();
  if(acc.length&&window.Diagram)Diagram.notify(recT("hoNote"),"ok");
  return {accepted:acc,ignored:ign};
}
/* ---- python export: the thermal assembly of the computed case ---- */
const PY_HX=`def eps_cross_unmixed(n, c):
    """Crossflow, both fluids unmixed - exact Mason (1954) series, Poisson-scaled."""
    e_n = math.exp(-n)
    q = e_n
    qc = 0.0
    s = 0.0
    p = math.exp(-c * n)
    pc = p
    total = 0.0
    conv = False
    for k in range(1, 4001):
        q = q * n / k
        qc += q
        s += qc
        p = p * c * n / k
        pc += p
        total += p * s / (k + 1)
        if k > c * n and 1 - pc < 1e-15:
            conv = True
            break
    e = 1 - e_n - total
    if not conv or not math.isfinite(e) or e <= 0 or e > 1:
        return 1 - math.exp((1 / c) * n ** 0.22 * (math.exp(-c * n ** 0.78) - 1))
    return e


def eff_ntu(arr, ntu, c):
    """Effectiveness of the arrangement at the given NTU and capacity ratio."""
    if ntu <= 0:
        return 0.0
    if c < 1e-6:
        return 1 - math.exp(-ntu)
    if arr == "parallel":
        return (1 - math.exp(-ntu * (1 + c))) / (1 + c)
    if arr == "cross":
        return eps_cross_unmixed(ntu, c)
    if arr == "crossmix":
        return (1 / c) * (1 - math.exp(-c * (1 - math.exp(-ntu))))
    if arr == "st12":
        r = math.sqrt(1 + c * c)
        e = math.exp(-ntu * r)
        return 2 / ((1 + c) + r * (1 + e) / (1 - e))
    if arr == "st24":
        r = math.sqrt(1 + c * c)
        e = math.exp(-ntu * r / 2)
        e1 = 2 / ((1 + c) + r * (1 + e) / (1 - e))
        if abs(c - 1) < 1e-6:
            return 2 * e1 / (1 + e1)
        a = ((1 - e1 * c) / (1 - e1)) ** 2
        return (a - 1) / (a - c)
    if abs(c - 1) < 1e-6:
        return ntu / (1 + ntu)
    e = math.exp(-ntu * (1 - c))
    return (1 - e) / (1 - c * e)


def ntu_from_eff(arr, eps, c):
    lo, hi = 1e-4, 60.0
    if eff_ntu(arr, hi, c) < eps:
        return float("nan")
    for _ in range(80):
        m = (lo + hi) / 2
        if eff_ntu(arr, m, c) < eps:
            lo = m
        else:
            hi = m
    return (lo + hi) / 2


def lmtd(dt1, dt2):
    if dt1 <= 0 or dt2 <= 0:
        return max((dt1 + dt2) / 2, 0.01)
    if abs(dt1 - dt2) < 1e-6:
        return dt1
    return (dt1 - dt2) / math.log(dt1 / dt2)


def clamp(v, a, b):
    return max(a, min(b, v))


def f_corr(arr, thi, tho, tci, tco):
    """LMTD correction factor for the arrangement (Bowman/TEMA, or eps-NTU inversion)."""
    if arr == "counter":
        return 1.0
    dt = thi - tci
    if abs(dt) < 1e-9:
        return 1.0
    pp = (tco - tci) / dt
    rr = (thi - tho) / max(tco - tci, 1e-9)
    if arr in ("st12", "st24"):
        n = 1 if arr == "st12" else 2
        r = math.sqrt(rr * rr + 1)
        px = pp
        if n == 2:
            a = ((1 - pp * rr) / (1 - pp)) ** (1.0 / n)
            px = (a - 1) / (a - rr)
        if abs(rr - 1) < 1e-4:
            num = px * r / (1 - px)
            den = math.log((2 / px - 1 - rr + r) / (2 / px - 1 - rr - r))
            return (num / den) or 1.0
        num = r * math.log((1 - px) / (1 - px * rr))
        den = (rr - 1) * math.log((2 / px - 1 - rr + r) / (2 / px - 1 - rr - r))
        f = num / den
        return f if (math.isfinite(f) and 0 < f <= 1) else float("nan")
    c = clamp(min(rr, 1 / rr), 0, 1)
    eps = clamp(pp if rr <= 1 else pp * rr, 0, 1)
    lcf = lmtd(thi - tco, tho - tci)
    if not (eps > 0) or not (lcf > 0):
        return float("nan")
    if eps >= eff_ntu(arr, 60.0, c) * (1 - 1e-6):
        return float("nan")
    n = ntu_from_eff(arr, eps, c)
    if not math.isfinite(n) or n <= 0:
        return float("nan")
    f = eps * dt / (n * lcf)
    return min(f, 1.0) if (math.isfinite(f) and 0 < f <= 1 + 1e-9) else float("nan")


def compute():
    """Thermal assembly of the exchanger from the converged coefficients of the page."""
    c_h = C_HOT if C_HOT is not None else math.inf  # phase change -> infinite capacity rate
    c_c = C_COLD if C_COLD is not None else math.inf
    if math.isinf(c_h) and math.isinf(c_c):
        c_h = c_c = 1e9
    c_min = min(c_h, c_c)
    c_max = max(c_h, c_c)
    c_star = clamp(c_min / c_max, 0, 1) if (math.isfinite(c_max) and c_max > 0) else 0.0
    if math.isinf(c_min):
        c_min = 1e9
    ntu = U_OVERALL * AREA / c_min
    arr = EFFECTIVE_ARRANGEMENT
    eps = eff_ntu(arr, ntu, c_star)
    q = eps * c_min * (T_HOT_IN - T_COLD_IN)
    cap_limited = LATENT_CAPACITY is not None and q > LATENT_CAPACITY
    if cap_limited:
        q = LATENT_CAPACITY
    tho = T_HOT_SAT if C_HOT is None else T_HOT_IN - q / c_h
    tco = T_COLD_SAT if C_COLD is None else T_COLD_IN + q / c_c
    dtm = lmtd(T_HOT_IN - tco, tho - T_COLD_IN)
    dtmax = T_HOT_IN - T_COLD_IN
    if cap_limited and c_min > 0 and abs(dtmax) > 1e-9:
        eps = clamp(q / (c_min * dtmax), 0, 1)
    fx = clamp(q / max(U_OVERALL * AREA * dtm, 1e-9), 0, 1)
    if not cap_limited:
        if arr == "counter":
            fx = 1.0
        else:
            fa = f_corr(arr, T_HOT_IN, tho, T_COLD_IN, tco)
            if math.isfinite(fa) and fa > 0 and abs(fa - fx) <= 1e-4 * fx:
                fx = fa
    if not math.isfinite(fx) or fx <= 0:
        fx = 1.0
    out = {"Q": q, "U": U_OVERALL, "area": AREA, "NTU": ntu, "effectiveness": eps,
           "C_star": c_star, "T_hot_out": tho, "T_cold_out": tco, "LMTD": dtm,
           "F_factor": fx}
    # ---- values carried over from the page, NOT re-derived here -------------
    # The heat-transfer coefficients, the Reynolds/Prandtl numbers, the velocities
    # and the pressure drops come from the correlation and property database of the
    # page (see "Reproduces" in the header). They are repeated so that the printed
    # output is the complete result set and the self-test can confirm that the
    # exported record is internally consistent.
    out.update(FROM_PAGE)
    return out`;
function dgcPython(){
  if(!RES||RES.invalid)return null;
  const r=RES;
  const from_page={alpha_hot:finN(r.hh.h),alpha_cold:finN(r.hc.h),
    Re_hot:finN(r.hh.Re),Re_cold:finN(r.hc.Re),Pr_hot:finN(r.prh.Pr),Pr_cold:finN(r.prc.Pr),
    v_hot:finN(r.hh.v),v_cold:finN(r.hc.v),dp_hot:finN(r.hh.dp),dp_cold:finN(r.hc.dp),
    R_hot:finN(r.Rh),R_cold:finN(r.Rc),R_wall:finN(r.Rw)};
  let cap=null;
  if(isPhase(ST.hot)){const s=satOf(ST.hot);cap=r.H._m*s.hfg*Math.abs((ST.hot.xin??1)-(ST.hot.xout??0));}
  if(isPhase(ST.cold)){const s=satOf(ST.cold);const c2=r.C._m*s.hfg*Math.abs((ST.cold.xout??1)-(ST.cold.xin??0));
    cap=(cap==null)?c2:Math.min(cap,c2);}
  const pre="# ---- state of the exchanger as the page solved it ----\n"+
    "U_OVERALL = "+r.U+"            # W/(m2.K), from the converged correlations\n"+
    "AREA = "+r.Aref+"              # m2, reference heat-transfer area\n"+
    "C_HOT = "+(isPhase(ST.hot)?"None":(r.Ch))+"   # W/K, None = phase change at T_HOT_SAT\n"+
    "C_COLD = "+(isPhase(ST.cold)?"None":(r.Cc))+" # W/K, None = phase change at T_COLD_SAT\n"+
    "T_HOT_IN = "+r.thi+"           # degC\n"+
    "T_COLD_IN = "+r.tci+"          # degC\n"+
    "T_HOT_SAT = "+(isPhase(ST.hot)?ST.hot.tsat:"None")+"\n"+
    "T_COLD_SAT = "+(isPhase(ST.cold)?ST.cold.tsat:"None")+"\n"+
    "EFFECTIVE_ARRANGEMENT = "+JSON.stringify(dgcEffArr())+"\n"+
    "LATENT_CAPACITY = "+(cap==null||!isFinite(cap)?"None":cap)+"   # W, latent limit of the phase-change side\n"+
    "FROM_PAGE = "+JSON.stringify(from_page).replace(/null/g,"None")+"\n\n";
  return {code:pre+PY_HX,requires:[],
    scope:"the THERMAL ASSEMBLY of this one computed case only: NTU, C*, the eps-NTU relation of the arrangement, the duty with its latent-capacity limit, both outlet temperatures, the LMTD and the F factor. The overall coefficient U, the reference area, the capacity rates and the side quantities are taken from the page as recorded above - the heat-transfer correlations, the geometry model and the fluid-property database of this tool are NOT reproduced by this script",
    selftest:{tolerance:1e-4,
      note:"the page solves U, the coefficients and the outlet temperatures by a damped fixed-point iteration; this script re-derives the assembly from the converged values, so agreement is limited by the residual of that iteration (observed below 1e-5 relative, and the page prints the duty to 1e-5 relative)"}};
}
function dgcInit(){

  window.Diagram.init({
