const LT={
intro_t:["Что это и с чего начать","What this tool is and where to start","Що це і з чого почати",
 "Was dieses Werkzeug ist und wo man anfängt","Wat deze tool is en waar te beginnen",
 "Ce qu'est cet outil et par où commencer","Qué es esta herramienta y por dónde empezar","Czym jest to narzędzie i od czego zacząć"],
intro_b:[
 "Тепловой и гидравлический расчёт теплообменника методом ε–NTU: пластинчатого, широкозазорного, кожухотрубного, «труба в трубе», оребрённого воздушного и пульсирующего. Начните с режима и типа аппарата, затем задайте обе стороны (среда, расход, температура на входе, фазовый переход) и геометрию. Результат пересчитывается на каждое изменение; схема аппарата и графики следуют за ним.",
 "Thermal and hydraulic rating of a heat exchanger by the ε–NTU method: plate, wide-gap plate, shell-and-tube, double-pipe, finned air coil and pulsating push-pull. Start with the calculation mode and the exchanger type, then set both sides (fluid, flow, inlet temperature, phase change) and the geometry. The answer is recomputed on every edit; the schematic and the charts follow it.",
 "Тепловий і гідравлічний розрахунок теплообмінника методом ε–NTU: пластинчастого, широкозазорного, кожухотрубного, «труба в трубі», оребреного повітряного та пульсуючого. Почніть із режиму та типу апарата, далі задайте обидві сторони (середовище, витрата, температура на вході, фазовий перехід) і геометрію. Результат перераховується на кожну зміну.",
 "Thermische und hydraulische Berechnung eines Wärmeübertragers nach der ε–NTU-Methode: Platten-, Weitspalt-, Rohrbündel-, Doppelrohr-, berippter Luft- und pulsierender Bauart. Beginnen Sie mit Rechenmodus und Bauart, setzen Sie dann beide Seiten (Medium, Durchfluss, Eintrittstemperatur, Phasenwechsel) und die Geometrie. Das Ergebnis wird bei jeder Änderung neu berechnet.",
 "Thermische en hydraulische berekening van een warmtewisselaar volgens de ε–NTU-methode: platen, wijde spleet, shell-and-tube, dubbele buis, geribde luchtbatterij en pulserend. Begin met de rekenmodus en het type, stel daarna beide zijden in (medium, debiet, intredetemperatuur, faseovergang) en de geometrie. Het resultaat volgt elke wijziging.",
 "Calcul thermique et hydraulique d'un échangeur par la méthode ε–NTU : plaques, plaques à large espace, faisceau tubulaire, tube en tube, batterie à ailettes et pulsatoire. Commencez par le mode de calcul et le type d'appareil, puis renseignez les deux côtés (fluide, débit, température d'entrée, changement de phase) et la géométrie. Le résultat se recalcule à chaque modification.",
 "Cálculo térmico e hidráulico de un intercambiador por el método ε–NTU: placas, placas de paso ancho, carcasa y tubos, tubo en tubo, batería aleteada y pulsante. Empiece por el modo de cálculo y el tipo de equipo, después fije ambos lados (fluido, caudal, temperatura de entrada, cambio de fase) y la geometría. El resultado se recalcula con cada cambio.","Ocena termiczna i hydrauliczna wymiennika ciepła metodą ε–NTU: płytowy, płytowy o dużej szczelinie, płaszczowo-rurowy, dwururowy, z żebrowaną wężownicą powietrzną i pulsacyjny układ przeciwsobny. Zacznij od trybu obliczeń i typu wymiennika, a następnie ustaw obie strony (czynnik, przepływ, temperaturę na wlocie, przemianę fazową) i geometrię. Wynik jest przeliczany przy każdej edycji; schemat i wykresy są po nim nanoszone."],

type_b:[
 "Тип задаёт и модель теплоотдачи, и набор геометрических параметров, и доступные схемы тока. Пластинчатый — корреляция Мартина по углу шеврона; широкозазорный — та же модель, экстраполированная на широкий канал (±25 %); кожухотрубный — Гнилинский или Стендер–Меркель в трубах и Керн либо упрощённый Белл–Делавэр в межтрубном пространстве; «труба в трубе» — Гнилинский плюс кольцевой канал; воздушный — пучок труб с поправкой на оребрение; пульсирующий — полуэмпирическая модель, требующая валидации на стенде.",
 "The type fixes the heat-transfer model, the geometry set and the flow arrangements on offer. Plate: the Martin chevron-angle correlation. Wide-gap: the same model extrapolated to a wide channel (±25 %). Shell and tube: Gnielinski or Stender–Merkel inside the tubes, Kern or a simplified Bell–Delaware on the shell side. Double pipe: Gnielinski plus an annulus correlation. Air coil: a tube bank with a finned-bundle factor. Pulsating: a semi-empirical model that needs bench validation.",
 "Тип визначає модель тепловіддачі, набір геометричних параметрів і доступні схеми течії. Пластинчастий — кореляція Мартіна; широкозазорний — та сама модель, екстрапольована (±25 %); кожухотрубний — Гнілінський або Стендер–Меркель у трубах і Керн чи спрощений Белл–Делавер у міжтрубному просторі; «труба в трубі» — Гнілінський плюс кільцевий канал; повітряний — пучок труб; пульсуючий — напівемпірична модель.",
 "Die Bauart legt das Wärmeübergangsmodell, den Geometriesatz und die angebotenen Stromführungen fest. Platte: Martin-Korrelation über den Prägewinkel. Weitspalt: dasselbe Modell, extrapoliert (±25 %). Rohrbündel: Gnielinski oder Stender–Merkel rohrseitig, Kern oder vereinfachtes Bell–Delaware mantelseitig. Doppelrohr: Gnielinski plus Ringspalt. Luftkühler: Rohrbündel mit Rippenfaktor. Pulsierend: halbempirisch, Validierung nötig.",
 "Het type bepaalt het warmteoverdrachtsmodel, de geometrieset en de beschikbare stroomvoeringen. Platen: Martin-correlatie via de chevronhoek. Wijde spleet: hetzelfde model, geëxtrapoleerd (±25 %). Shell-and-tube: Gnielinski of Stender–Merkel in de buizen, Kern of vereenvoudigd Bell–Delaware aan de mantelzijde. Dubbele buis: Gnielinski plus ringspleet. Luchtbatterij: buizenbundel met ribfactor. Pulserend: semi-empirisch.",
 "Le type fixe le modèle de transfert, le jeu géométrique et les dispositions d'écoulement proposées. Plaques : corrélation de Martin selon l'angle chevron. Large espace : même modèle extrapolé (±25 %). Faisceau tubulaire : Gnielinski ou Stender–Merkel côté tubes, Kern ou Bell–Delaware simplifié côté calandre. Tube en tube : Gnielinski plus espace annulaire. Batterie à ailettes : faisceau avec facteur d'ailettes. Pulsatoire : semi-empirique.",
 "El tipo fija el modelo de transferencia, el juego geométrico y las disposiciones de flujo disponibles. Placas: correlación de Martin según el ángulo chevron. Paso ancho: el mismo modelo extrapolado (±25 %). Carcasa y tubos: Gnielinski o Stender–Merkel en los tubos, Kern o Bell–Delaware simplificado en la carcasa. Tubo en tubo: Gnielinski más el espacio anular. Batería aleteada: haz de tubos con factor de aletas. Pulsante: semiempírico.","Typ ustala model wymiany ciepła, zbiór geometrii i oferowane układy przepływu. Płytka: korelacja kąta szewronu Martina. Model z szeroką szczeliną: ten sam model ekstrapolowany do szerokiego kanału (±25%). Płaszcz i rura: Gnieliński lub Stender-Merkel wewnątrz rur, Kern lub uproszczony Bell-Delaware po stronie płaszcza. Podwójna rura: korelacja Gnieliński plus korelacja pierścieniowa. Cewka powietrzna: zespół rur o współczynniku wiązek żebrowanych. Model pulsacyjny: model półempiryczny, który wymaga walidacji laboratoryjnej."],

arr_b:[
 "Схема тока входит и в ε–NTU, и в поправку F к LMTD. Противоток даёт наибольшую ε при том же NTU; прямоток ограничен пересечением температур; перекрёстный с обоими неперемешанными средами считается точным рядом Мейсона (1954), а не приближением Инкропери. Для кожухотрубных доступны схемы 1-2 и 2-4 по Боумену/TEMA. F ниже 0,75 — не погрешность, а признак неподходящей схемы, и об этом выдаётся предупреждение. При кипении или конденсации схема тока не влияет на ε: сторона с фазовым переходом изотермична.",
 "The arrangement enters both the ε–NTU relation and the F correction to the LMTD. Counterflow gives the highest ε at a given NTU; parallel flow is limited by the temperature pinch; crossflow with both fluids unmixed is summed as the exact Mason (1954) series rather than the familiar Incropera approximation. Shell-and-tube offers the Bowman/TEMA 1-2 and 2-4 relations. An F below 0.75 is not a numerical artefact but a sign that the arrangement is unsuitable, and it is reported as a warning. With boiling or condensation the arrangement no longer changes ε: the phase-change side is isothermal.",
 "Схема течії входить і в ε–NTU, і в поправку F до LMTD. Протитечія дає найбільшу ε за того самого NTU; прямотечія обмежена перетином температур; перехресний потік з обома незмішуваними середовищами обчислюється точним рядом Мейсона (1954). Для кожухотрубних доступні схеми 1-2 і 2-4 за Боуменом/TEMA. F нижче 0,75 — ознака непридатної схеми. За кипіння чи конденсації схема на ε не впливає.",
 "Die Stromführung geht sowohl in die ε–NTU-Beziehung als auch in die F-Korrektur der LMTD ein. Gegenstrom liefert bei gleichem NTU die höchste ε; Gleichstrom ist durch die Temperaturannäherung begrenzt; Kreuzstrom mit beidseitig unvermischten Fluiden wird als exakte Mason-Reihe (1954) summiert. Rohrbündel bietet die Bowman/TEMA-Schaltungen 1-2 und 2-4. Ein F unter 0,75 zeigt eine ungeeignete Stromführung an. Bei Sieden oder Kondensation ändert die Stromführung ε nicht mehr.",
 "De stroomvoering zit zowel in de ε–NTU-relatie als in de F-correctie op de LMTD. Tegenstroom geeft bij gelijke NTU de hoogste ε; gelijkstroom wordt begrensd door de temperatuurknijp; kruisstroom met beide media ongemengd wordt als de exacte Mason-reeks (1954) gesommeerd. Shell-and-tube biedt de Bowman/TEMA-schakelingen 1-2 en 2-4. Een F onder 0,75 wijst op een ongeschikte schakeling. Bij koken of condenseren verandert de schakeling ε niet meer.",
 "La disposition intervient dans la relation ε–NTU et dans la correction F de la DTLM. Le contre-courant donne l'efficacité la plus élevée à NTU donné ; le co-courant est limité par le pincement ; le courant croisé à deux fluides non brassés est sommé par la série exacte de Mason (1954). Le faisceau tubulaire propose les schémas 1-2 et 2-4 de Bowman/TEMA. Un F inférieur à 0,75 signale une disposition inadaptée. En ébullition ou condensation, la disposition n'agit plus sur ε.",
 "La disposición interviene en la relación ε–NTU y en la corrección F de la DTML. La contracorriente da la mayor eficacia a igual NTU; la corriente paralela está limitada por el pinzamiento; el flujo cruzado con ambos fluidos sin mezclar se suma con la serie exacta de Mason (1954). Carcasa y tubos ofrece los esquemas 1-2 y 2-4 de Bowman/TEMA. Una F por debajo de 0,75 indica una disposición inadecuada. Con ebullición o condensación la disposición ya no altera ε.","Układ ten uwzględnia zarówno relację ε–NTU, jak i korektę F do LMTD. Przepływ przeciwprądowy daje najwyższe ε przy danej NTU; przepływ równoległy jest ograniczony przez szczyptę temperaturową; przepływ krzyżowy z obiema niezmieszanymi płynami jest sumowany jako dokładny szereg Masona (1954), a nie znane przybliżenie Incropery. Układ rurowo-płaszczowy oferuje relacje Bowmana/TEMA 1-2 i 2-4. Wartość F poniżej 0,75 nie jest artefaktem liczbowym, lecz sygnałem, że układ jest nieodpowiedni i jest zgłaszany jako ostrzeżenie. Podczas wrzenia lub kondensacji układ nie zmienia już ε: strona przemiany fazowej jest izotermiczna."],

sides_t:["Горячая и холодная сторона","The hot and the cold side","Гаряча і холодна сторона",
 "Warme und kalte Seite","Warme en koude zijde","Côté chaud et côté froid","Lado caliente y lado frío","Ciepła i zimna strona"],
sides_b:[
 "«Горячая» и «холодная» — это роли, а не место в аппарате: горячая сторона отдаёт теплоту, холодная принимает. Расчёт требует, чтобы горячий вход был минимум на 0,5 K теплее холодного. Для каждой стороны задаются среда (или рабочее тело при фазовом переходе), расход массовый либо объёмный, температура на входе, абсолютное давление и загрязнение. По какому именно каналу идёт сторона (трубы или межтрубное пространство, внутренняя или наружная труба, воздух) задаётся в «Опциях».",
 "Hot and cold are roles, not places in the unit: the hot side gives heat up, the cold side takes it. The calculation requires the hot inlet to be at least 0.5 K warmer than the cold one. For each side you set the fluid (or the working fluid when there is a phase change), the flow as a mass or a volume rate, the inlet temperature, the absolute pressure and the fouling. Which physical channel a side occupies — tubes or shell, inner or outer pipe, the air stream — is chosen under Options.",
 "«Гаряча» і «холодна» — це ролі, а не місце в апараті: гаряча сторона віддає теплоту, холодна приймає. Розрахунок вимагає, щоб гарячий вхід був щонайменше на 0,5 K тепліший за холодний. Для кожної сторони задаються середовище, витрата, температура на вході, абсолютний тиск і забруднення. Який саме канал займає сторона, обирається в «Опціях».",
 "Warm und kalt sind Rollen, keine Orte im Apparat: die warme Seite gibt Wärme ab, die kalte nimmt sie auf. Die Rechnung verlangt, dass der warme Eintritt mindestens 0,5 K wärmer ist als der kalte. Je Seite werden Medium, Massen- oder Volumenstrom, Eintrittstemperatur, Absolutdruck und Fouling gesetzt. Welchen Kanal eine Seite belegt — Rohr oder Mantel, Innen- oder Außenrohr, Luft — wird unter Optionen gewählt.",
 "Warm en koud zijn rollen, geen plaatsen in het toestel: de warme zijde staat warmte af, de koude neemt haar op. De berekening eist dat de warme intrede minstens 0,5 K warmer is dan de koude. Per zijde stelt u het medium, het massa- of volumedebiet, de intredetemperatuur, de absolute druk en de vervuiling in. Welk kanaal een zijde inneemt — buis of mantel, binnen- of buitenbuis, lucht — kiest u bij Opties.",
 "Chaud et froid sont des rôles, non des emplacements : le côté chaud cède la chaleur, le côté froid la reçoit. Le calcul exige que l'entrée chaude soit au moins 0,5 K plus chaude que l'entrée froide. Pour chaque côté on renseigne le fluide, le débit massique ou volumique, la température d'entrée, la pression absolue et l'encrassement. Le canal occupé par un côté — tubes ou calandre, tube interne ou externe, air — se choisit dans Options.",
 "Caliente y frío son papeles, no lugares en el equipo: el lado caliente cede calor, el frío lo recibe. El cálculo exige que la entrada caliente esté al menos 0,5 K más caliente que la fría. Para cada lado se fija el fluido, el caudal másico o volumétrico, la temperatura de entrada, la presión absoluta y el ensuciamiento. El canal que ocupa cada lado — tubos o carcasa, tubo interno o externo, aire — se elige en Opciones.","Ciepło i zimno to role, a nie miejsca w jednostce: strona gorąca oddaje ciepło, strona zimna je odbiera. Obliczenia wymagają, aby wlot gorącej wody był co najmniej o 0,5 K cieplejszy od wlotu zimnej wody. Dla każdej strony ustawia się czynnik (lub czynnik roboczy, gdy występuje zmiana fazy), natężenie przepływu jako masę lub objętość, temperaturę wlotową, ciśnienie bezwzględne i stopień zanieczyszczenia. To, który kanał fizyczny zajmuje dana strona — rury czy płaszcz, rura wewnętrzna czy zewnętrzna, strumień powietrza — wybiera się w Opcjach."],

phase_b:[
 "При кипении или конденсации сторона считается изотермической при температуре насыщения, а мощность ограничивается теплотой фазового перехода: Q ≤ m·r·|Δx|. Кипение — Гунгор–Уинтертон (1986) с нуклеационным членом Купера; конденсация — Нуссельт для вертикальной плёнки или 0,729·[…/(N·d)]^(1/4) для горизонтального пучка, поэтому ориентация аппарата здесь важна. Расчёт ведётся при среднем паросодержании, без пошагового интегрирования и без учёта кризиса теплообмена при x → 1.",
 "With boiling or condensation the side is treated as isothermal at the saturation temperature and the duty is capped by the latent capacity, Q ≤ m·r·|Δx|. Boiling uses Gungor–Winterton (1986) with the Cooper nucleate term; condensation uses the Nusselt vertical film or 0.729·[…/(N·d)]^(1/4) for a horizontal bank, which is why the orientation matters here. The duty is evaluated at the mean vapour quality, without stepwise integration along the length and without a dryout limit as x → 1.",
 "За кипіння чи конденсації сторона вважається ізотермічною при температурі насичення, а потужність обмежена теплотою фазового переходу: Q ≤ m·r·|Δx|. Кипіння — Гунгор–Уінтертон (1986) з членом Купера; конденсація — Нуссельт для вертикальної плівки або 0,729·[…/(N·d)]^(1/4) для горизонтального пучка. Розрахунок ведеться за середнім паровмістом, без урахування кризи теплообміну.",
 "Bei Sieden oder Kondensation gilt die Seite als isotherm bei Sättigungstemperatur, und die Leistung wird durch die latente Kapazität begrenzt: Q ≤ m·r·|Δx|. Sieden nach Gungor–Winterton (1986) mit Cooper-Term; Kondensation nach Nusselt (senkrechter Film) oder 0,729·[…/(N·d)]^(1/4) für ein waagerechtes Bündel — deshalb zählt hier die Einbaulage. Bewertet wird beim mittleren Dampfgehalt, ohne Dryout-Grenze.",
 "Bij koken of condenseren geldt de zijde als isotherm bij de verzadigingstemperatuur en wordt het vermogen begrensd door de latente capaciteit: Q ≤ m·r·|Δx|. Koken volgens Gungor–Winterton (1986) met de Cooper-term; condenseren volgens Nusselt (verticale film) of 0,729·[…/(N·d)]^(1/4) voor een horizontale bundel — daarom telt de opstelling hier. Bepaald bij het gemiddelde dampgehalte, zonder dryout-grens.",
 "En ébullition ou condensation, le côté est traité comme isotherme à la température de saturation et la puissance est plafonnée par la capacité latente : Q ≤ m·r·|Δx|. Ébullition : Gungor–Winterton (1986) avec le terme de Cooper ; condensation : Nusselt en film vertical ou 0,729·[…/(N·d)]^(1/4) pour un faisceau horizontal — d'où l'importance de l'orientation. Évaluation au titre vapeur moyen, sans limite d'assèchement.",
 "Con ebullición o condensación el lado se trata como isotermo a la temperatura de saturación y la potencia queda limitada por la capacidad latente: Q ≤ m·r·|Δx|. Ebullición: Gungor–Winterton (1986) con el término de Cooper; condensación: Nusselt en película vertical o 0,729·[…/(N·d)]^(1/4) para un haz horizontal — por eso importa la orientación. Se evalúa al título de vapor medio, sin límite de secado.","W przypadku wrzenia lub kondensacji, strona jest traktowana jako izotermiczna w temperaturze nasycenia, a obciążenie jest ograniczone pojemnością utajoną, Q ≤ m·r·|Δx|. Wrzenie wykorzystuje równanie Gungora–Wintertona (1986) z terminem zarodkowym Coopera; kondensacja wykorzystuje pionowy film Nusselta lub 0,729·[…/(N·d)]^(1/4) dla poziomego brzegu, dlatego orientacja ma tu znaczenie. Obciążenie jest oceniane przy średniej jakości pary, bez całkowania krokowego wzdłuż długości i bez granicy suchości, gdy x → 1."],

foul_b:[
 "Термическое сопротивление отложений на поверхности, м²К/Вт, по TEMA. Оно складывается последовательно с 1/α обеих сторон и сопротивлением стенки, поэтому в аппаратах с высоким U (пластинчатые, вода/вода) именно загрязнение часто определяет требуемую поверхность. Значения из списка — типовые проектные, «custom» позволяет задать своё. Загрязнение — проектный запас, а не измеренная величина.",
 "The thermal resistance of the deposit on the surface, m²K/W, after TEMA. It adds in series with 1/α on both sides and with the wall resistance, so in a high-U unit — a plate exchanger on water/water — the fouling allowance is often what sets the surface required. The listed values are typical design allowances; `custom` lets you enter your own. Fouling is a design allowance, not a measurement.",
 "Термічний опір відкладень на поверхні, м²К/Вт, за TEMA. Він додається послідовно до 1/α обох сторін і опору стінки, тому в апаратах з високим U саме забруднення часто визначає потрібну поверхню. Значення зі списку — типові проєктні; «custom» дозволяє задати своє. Забруднення — проєктний запас, а не виміряна величина.",
 "Der Wärmewiderstand der Beläge auf der Fläche, m²K/W, nach TEMA. Er liegt in Reihe mit 1/α beider Seiten und dem Wandwiderstand; in einem Apparat mit hohem k-Wert — Plattenwärmeübertrager Wasser/Wasser — bestimmt der Foulingzuschlag daher oft die erforderliche Fläche. Die Listenwerte sind übliche Auslegungszuschläge, `custom` erlaubt einen eigenen Wert. Fouling ist ein Zuschlag, keine Messgröße.",
 "De warmteweerstand van de aanslag op het oppervlak, m²K/W, volgens TEMA. Hij staat in serie met 1/α van beide zijden en de wandweerstand; in een toestel met hoge U — platenwisselaar water/water — bepaalt de vervuilingstoeslag daarom vaak het benodigde oppervlak. De lijstwaarden zijn gebruikelijke ontwerptoeslagen; `custom` laat een eigen waarde toe. Vervuiling is een toeslag, geen meting.",
 "La résistance thermique du dépôt sur la surface, m²K/W, d'après TEMA. Elle s'ajoute en série à 1/α des deux côtés et à la résistance de paroi ; dans un appareil à U élevé — échangeur à plaques eau/eau — l'encrassement fixe donc souvent la surface requise. Les valeurs de la liste sont des marges de conception usuelles ; `custom` permet une valeur propre. L'encrassement est une marge, pas une mesure.",
 "La resistencia térmica del depósito sobre la superficie, m²K/W, según TEMA. Se suma en serie con 1/α de ambos lados y con la resistencia de pared; en un equipo de U alta — intercambiador de placas agua/agua — el ensuciamiento suele fijar la superficie requerida. Los valores de la lista son márgenes de diseño típicos; `custom` permite uno propio. El ensuciamiento es un margen, no una medición.","Opór cieplny osadu na powierzchni, m²K/W, po TEMA. Dodaje się on szeregowo z 1/α po obu stronach i z oporem ścianki, więc w urządzeniu o wysokim współczynniku U – wymienniku płytowym woda/woda – tolerancja na zanieczyszczenia często decyduje o wymaganej powierzchni. Podane wartości to typowe tolerancje projektowe; opcja „custom” pozwala na wprowadzenie własnych. Zanieczyszczenie jest tolerancją projektową, a nie miarą."],

eff_b:[
 "Эффективность ε = Q / (C_min·(T_гор,вх − T_хол,вх)) — доля термодинамически максимально возможной мощности, которую аппарат действительно передаёт. Она зависит только от NTU, отношения C* = C_min/C_max и схемы тока; для противотока при C* = 1 предел ε = NTU/(1+NTU). Если мощность ограничена теплотой фазового перехода, ε пересчитывается по фактической (ограниченной) мощности и уже не равна ε(NTU, C*).",
 "Effectiveness ε = Q / (C_min·(T_hot,in − T_cold,in)) is the fraction of the thermodynamically largest possible duty the unit actually transfers. It depends only on NTU, on the capacity ratio C* = C_min/C_max and on the arrangement; for counterflow at C* = 1 the limit is ε = NTU/(1+NTU). When the duty is capped by the latent capacity of a phase-change side, ε is re-derived from that capped duty and is no longer ε(NTU, C*).",
 "Ефективність ε = Q / (C_min·(T_гар,вх − T_хол,вх)) — частка термодинамічно максимально можливої потужності, яку апарат справді передає. Вона залежить лише від NTU, відношення C* = C_min/C_max і схеми течії; для протитечії за C* = 1 межа ε = NTU/(1+NTU). Якщо потужність обмежена теплотою фазового переходу, ε перераховується за фактичною потужністю.",
 "Die Effektivität ε = Q / (C_min·(T_warm,ein − T_kalt,ein)) ist der Anteil der thermodynamisch größtmöglichen Leistung, den der Apparat tatsächlich überträgt. Sie hängt nur von NTU, vom Kapazitätsverhältnis C* = C_min/C_max und von der Stromführung ab; im Gegenstrom bei C* = 1 gilt die Grenze ε = NTU/(1+NTU). Ist die Leistung durch die latente Kapazität begrenzt, wird ε aus dieser Leistung neu bestimmt.",
 "De effectiviteit ε = Q / (C_min·(T_warm,in − T_koud,in)) is het deel van het thermodynamisch grootst mogelijke vermogen dat het toestel werkelijk overdraagt. Zij hangt alleen af van NTU, van de capaciteitsverhouding C* = C_min/C_max en van de schakeling; bij tegenstroom en C* = 1 geldt ε = NTU/(1+NTU). Wordt het vermogen begrensd door de latente capaciteit, dan volgt ε uit dat begrensde vermogen.",
 "L'efficacité ε = Q / (C_min·(T_chaud,e − T_froid,e)) est la fraction de la puissance thermodynamiquement maximale que l'appareil transfère réellement. Elle ne dépend que du NTU, du rapport C* = C_min/C_max et de la disposition ; en contre-courant à C* = 1 la limite vaut ε = NTU/(1+NTU). Si la puissance est plafonnée par la capacité latente, ε est recalculée à partir de cette puissance.",
 "La eficacia ε = Q / (C_min·(T_cal,ent − T_frío,ent)) es la fracción de la potencia termodinámicamente máxima que el equipo transfiere realmente. Solo depende del NTU, de la relación C* = C_min/C_max y de la disposición; en contracorriente con C* = 1 el límite es ε = NTU/(1+NTU). Si la potencia queda limitada por la capacidad latente, ε se recalcula a partir de esa potencia.","Efektywność ε = Q / (C_min·(T_gorące,in − T_zimne,in)) to ułamek największego możliwego termodynamicznie obciążenia, jakie jednostka faktycznie przenosi. Zależy ona jedynie od NTU, od stosunku wydajności C* = C_min/C_max oraz od układu; dla przepływu przeciwprądowego przy C* = 1 granica wynosi ε = NTU/(1+NTU). Gdy obciążenie jest ograniczone przez utajoną wydajność strony przemiany fazowej, ε jest ponownie wyprowadzane z tego ograniczonego obciążenia i nie wynosi już ε(NTU, C*)."],

ntu_b:[
 "NTU = U·A / C_min — безразмерный «размер» аппарата: во сколько раз его проводимость больше меньшей расходной теплоёмкости. NTU до 1 — дешёвый аппарат с умеренной ε; NTU выше 4–5 даёт очень малый прирост ε и растёт только поверхность и потери давления. Именно NTU, а не поверхность как таковая, определяет, что можно получить от данной схемы тока.",
 "NTU = U·A / C_min is the dimensionless size of the unit: how many times its conductance exceeds the smaller capacity rate. An NTU up to 1 is a cheap unit with a modest ε; above about 4–5 the gain in ε is very small and only the surface and the pressure drop keep growing. It is NTU, not the surface as such, that decides what a given arrangement can deliver.",
 "NTU = U·A / C_min — безрозмірний «розмір» апарата: у скільки разів його провідність більша за меншу витратну теплоємність. NTU до 1 — дешевий апарат із помірною ε; вище 4–5 приріст ε дуже малий, а зростають лише поверхня і втрати тиску.",
 "NTU = U·A / C_min ist die dimensionslose Größe des Apparats: um wie viel seine Leitfähigkeit den kleineren Kapazitätsstrom übersteigt. Ein NTU bis 1 ergibt einen günstigen Apparat mit mäßiger ε; oberhalb von etwa 4–5 wächst ε kaum noch, wohl aber Fläche und Druckverlust.",
 "NTU = U·A / C_min is de dimensieloze maat van het toestel: hoeveel maal zijn geleiding de kleinste capaciteitsstroom overtreft. Een NTU tot 1 geeft een goedkoop toestel met bescheiden ε; boven ongeveer 4–5 groeit ε nauwelijks nog, wel het oppervlak en de drukval.",
 "NTU = U·A / C_min est la taille adimensionnelle de l'appareil : combien de fois sa conductance dépasse le plus petit débit de capacité. Un NTU jusqu'à 1 donne un appareil bon marché à ε modeste ; au-delà de 4–5, ε ne progresse presque plus, seuls la surface et la perte de charge augmentent.",
 "NTU = U·A / C_min es el tamaño adimensional del equipo: cuántas veces su conductancia supera la menor tasa de capacidad. Un NTU hasta 1 da un equipo barato con ε modesta; por encima de 4–5 la ε apenas crece y solo aumentan la superficie y la pérdida de carga.","NTU = U·A / C_min to bezwymiarowy rozmiar jednostki: ile razy jej przewodność przekracza mniejszą wydajność. Jednostka NTU do 1 to tania jednostka o skromnym ε; powyżej około 4–5 wzmocnienie ε jest bardzo małe i rośnie tylko powierzchnia i spadek ciśnienia. To NTU, a nie powierzchnia sama w sobie, decyduje o tym, co dany układ może dostarczyć."],

lmtd_b:[
 "LMTD — среднелогарифмический температурный напор противотока, а F — поправка на реальную схему тока: Q = U·A·F·LMTD. F выводится из схемы (Боумен/TEMA для кожухотрубных, обращение ε–NTU для остальных) и сверяется с F = Q/(U·A·LMTD); нижнего ограничения нет. F ниже 0,75 означает, что схема тока плохо подходит к задаче, а не что расчёт ошибся.",
 "The LMTD is the logarithmic mean temperature difference of pure counterflow, and F corrects it for the arrangement actually used: Q = U·A·F·LMTD. F is derived from the arrangement (Bowman/TEMA for shell-and-tube, an ε–NTU inversion otherwise) and cross-checked against F = Q/(U·A·LMTD); there is no lower clamp. An F below 0.75 means the arrangement is poorly suited to the duty, not that the calculation went wrong.",
 "LMTD — середньологарифмічний температурний напір протитечії, а F — поправка на реальну схему течії: Q = U·A·F·LMTD. F виводиться зі схеми (Боумен/TEMA для кожухотрубних, обернення ε–NTU для решти) і звіряється з F = Q/(U·A·LMTD); нижнього обмеження немає. F нижче 0,75 означає непридатну схему течії.",
 "Die LMTD ist die logarithmische mittlere Temperaturdifferenz des reinen Gegenstroms, F korrigiert sie auf die tatsächliche Stromführung: Q = U·A·F·LMTD. F folgt aus der Schaltung (Bowman/TEMA beim Rohrbündel, ε–NTU-Umkehr sonst) und wird gegen F = Q/(U·A·LMTD) geprüft; eine untere Begrenzung gibt es nicht. F unter 0,75 heißt: die Stromführung passt schlecht zur Aufgabe.",
 "De LMTD is het logaritmisch gemiddelde temperatuurverschil van zuivere tegenstroom, en F corrigeert dat voor de werkelijke schakeling: Q = U·A·F·LMTD. F volgt uit de schakeling (Bowman/TEMA bij shell-and-tube, ε–NTU-inversie anders) en wordt getoetst aan F = Q/(U·A·LMTD); een ondergrens is er niet. F onder 0,75 betekent dat de schakeling slecht past.",
 "La DTLM est l'écart logarithmique moyen du contre-courant pur, et F la corrige pour la disposition réellement employée : Q = U·A·F·DTLM. F découle de la disposition (Bowman/TEMA pour le faisceau tubulaire, inversion ε–NTU sinon) et est recoupée avec F = Q/(U·A·DTLM) ; il n'y a pas de borne inférieure. Un F sous 0,75 signale une disposition mal adaptée.",
 "La DTML es la diferencia media logarítmica de la contracorriente pura, y F la corrige para la disposición realmente empleada: Q = U·A·F·DTML. F se deduce de la disposición (Bowman/TEMA en carcasa y tubos, inversión ε–NTU en el resto) y se contrasta con F = Q/(U·A·DTML); no hay límite inferior. Una F bajo 0,75 indica una disposición mal adaptada.","LMTD to logarytmiczna średnia różnica temperatur czystego przepływu przeciwprądowego, a F koryguje ją dla faktycznie zastosowanego układu: Q = U·A·F·LMTD. F jest wyprowadzane z układu (Bowman/TEMA dla płaszczowo-rurowego, w przeciwnym razie inwersja ε–NTU) i porównywane z F = Q/(U·A·LMTD); nie ma dolnego zacisku. F poniżej 0,75 oznacza, że ​​układ jest słabo dostosowany do obciążenia, a nie, że obliczenia były błędne."],

u_b:[
 "Коэффициент теплопередачи U собирается последовательно: 1/U = 1/α_гор + R_f,гор + δ/λ + R_f,хол + 1/α_хол, всё отнесено к опорной поверхности (для труб — с логарифмическим сопротивлением стенки). Таблица «Термические сопротивления» показывает, какое звено доминирует: улучшать имеет смысл только его. α берутся из корреляций с разбросом ±15–30 %, поэтому U — оценка, а не паспортная величина.",
 "The overall coefficient is assembled in series: 1/U = 1/α_hot + R_f,hot + δ/λ + R_f,cold + 1/α_cold, everything referred to the reference area (with a logarithmic wall resistance for tubes). The Thermal resistances table shows which link dominates — that is the only one worth improving. The film coefficients come from correlations with a ±15–30 % spread, so U is an estimate, not a rated value.",
 "Коефіцієнт теплопередачі збирається послідовно: 1/U = 1/α_гар + R_f,гар + δ/λ + R_f,хол + 1/α_хол, усе віднесено до опорної поверхні. Таблиця «Термічні опори» показує, яка ланка домінує — саме її має сенс покращувати. α беруться з кореляцій із розкидом ±15–30 %.",
 "Der k-Wert entsteht in Reihe: 1/U = 1/α_warm + R_f,warm + δ/λ + R_f,kalt + 1/α_kalt, alles auf die Bezugsfläche bezogen (bei Rohren mit logarithmischem Wandwiderstand). Die Tabelle der Wärmewiderstände zeigt das dominierende Glied — nur dieses zu verbessern lohnt. Die α stammen aus Korrelationen mit ±15–30 % Streuung.",
 "De U-waarde ontstaat in serie: 1/U = 1/α_warm + R_f,warm + δ/λ + R_f,koud + 1/α_koud, alles herleid naar het referentieoppervlak (bij buizen met logaritmische wandweerstand). De tabel Warmteweerstanden toont welke schakel domineert — alleen die verbeteren loont. De α's komen uit correlaties met ±15–30 % spreiding.",
 "Le coefficient global s'assemble en série : 1/U = 1/α_chaud + R_f,chaud + δ/λ + R_f,froid + 1/α_froid, le tout rapporté à la surface de référence (résistance de paroi logarithmique pour les tubes). Le tableau des résistances thermiques montre le maillon dominant — le seul qu'il vaille la peine d'améliorer. Les α viennent de corrélations à ±15–30 %.",
 "El coeficiente global se monta en serie: 1/U = 1/α_cal + R_f,cal + δ/λ + R_f,frío + 1/α_frío, todo referido a la superficie de referencia (resistencia de pared logarítmica en tubos). La tabla de resistencias térmicas muestra el eslabón dominante — el único que merece mejorarse. Los α provienen de correlaciones con ±15–30 %.","Ogólny współczynnik jest zestawiany szeregowo: 1/U = 1/α_gorący + R_f,gorący + δ/λ + R_f,zimny + 1/α_zimny, wszystko odniesione do obszaru odniesienia (z logarytmiczną rezystancją ścianek dla rur). Tabela rezystancji cieplnych pokazuje, które ogniwo dominuje — tylko ono jest warte poprawy. Współczynniki warstwy pochodzą z korelacji z rozrzutem ±15–30%, więc U jest wartością szacunkową, a nie nominalną."],

dp_b:[
 "Потери давления считаются по той же геометрии и тому же режиму, что и теплоотдача: трение по длине, местные потери, для ПТО — дополнительно потери в портах, для двухфазного потока — гомогенная модель. Скорость и ΔP связаны с α: рост скорости почти всегда покупает теплоотдачу ценой кубического роста потерь. Предупреждение выдаётся выше ≈100 кПа и при скоростях вне обычного диапазона 0,25…4,5 м/с для жидкостей.",
 "Pressure drop is computed on the same geometry and in the same regime as the heat transfer: wall friction along the length, local losses, plus the port losses for a plate pack and the homogeneous model for two-phase flow. Velocity and ΔP are tied to α: raising the velocity nearly always buys heat transfer at the price of a roughly cubic rise in loss. A warning is raised above about 100 kPa and outside the usual 0.25…4.5 m/s band for liquids.",
 "Втрати тиску рахуються за тією ж геометрією і тим самим режимом, що й тепловіддача: тертя по довжині, місцеві втрати, для ПТО — ще й втрати в портах, для двофазного потоку — гомогенна модель. Швидкість і ΔP пов'язані з α. Попередження видається вище ≈100 кПа і за швидкостей поза діапазоном 0,25…4,5 м/с.",
 "Der Druckverlust wird auf derselben Geometrie und im selben Regime berechnet wie der Wärmeübergang: Wandreibung über die Länge, Einzelverluste, beim Plattenpaket zusätzlich die Anschlussverluste, zweiphasig das homogene Modell. Geschwindigkeit und ΔP hängen mit α zusammen. Gewarnt wird oberhalb von etwa 100 kPa und außerhalb von 0,25…4,5 m/s bei Flüssigkeiten.",
 "De drukval wordt op dezelfde geometrie en in hetzelfde regime berekend als de warmteoverdracht: wandwrijving over de lengte, plaatselijke verliezen, bij een platenpakket ook de poortverliezen, tweefasig het homogene model. Snelheid en ΔP hangen samen met α. Er wordt gewaarschuwd boven circa 100 kPa en buiten 0,25…4,5 m/s voor vloeistoffen.",
 "La perte de charge est calculée sur la même géométrie et dans le même régime que le transfert : frottement de paroi, pertes singulières, plus les pertes aux orifices pour un pack de plaques et le modèle homogène en diphasique. Vitesse et ΔP sont liées à α. Un avertissement apparaît au-delà d'environ 100 kPa et hors de 0,25…4,5 m/s pour les liquides.",
 "La pérdida de carga se calcula sobre la misma geometría y en el mismo régimen que la transferencia: fricción de pared, pérdidas locales, más las pérdidas en las bocas del paquete de placas y el modelo homogéneo en bifásico. Velocidad y ΔP están ligadas a α. Se avisa por encima de unos 100 kPa y fuera de 0,25…4,5 m/s para líquidos.","Spadek ciśnienia oblicza się na podstawie tej samej geometrii i w tym samym schemacie, co wymiana ciepła: tarcie ścianek wzdłuż długości, straty lokalne, a także straty w otworach dla pakietu płyt i modelu jednorodnego dla przepływu dwufazowego. Prędkość i ΔP są powiązane z α: zwiększenie prędkości prawie zawsze skutkuje wymianą ciepła kosztem wzrostu strat sześciennych. Ostrzeżenie pojawia się powyżej około 100 kPa i poza typowym pasmem 0,25–4,5 m/s dla cieczy."],

geom_b:[
 "Набор геометрических параметров зависит от выбранного типа. В поверочном режиме геометрия задана и определяет поверхность, U и мощность. В конструктивном режиме один параметр — число пластин, длина труб, число секций, число рядов или длина канала — подбирается делением пополам до совпадения с требуемой нагрузкой, после чего добавляется запас поверхности и результат записывается обратно в эти поля.",
 "Which geometry you set depends on the type. In rating mode the geometry is given and fixes the surface, U and the duty. In sizing mode one parameter — the number of plates, the tube length, the number of hairpins, the number of rows or the channel length — is found by bisection until the calculated duty matches the required one; the surface margin is then added and the result is written back into these fields.",
 "Набір геометричних параметрів залежить від обраного типу. У повірочному режимі геометрія задана й визначає поверхню, U та потужність. У конструктивному режимі один параметр підбирається діленням навпіл до збігу з потрібним навантаженням, після чого додається запас поверхні й результат записується назад у ці поля.",
 "Welche Geometrie zu setzen ist, hängt von der Bauart ab. In der Nachrechnung ist die Geometrie gegeben und legt Fläche, k-Wert und Leistung fest. In der Auslegung wird ein Parameter — Plattenzahl, Rohrlänge, Anzahl Haarnadeln, Rohrreihen oder Kanallänge — durch Intervallhalbierung gesucht, bis die Leistung passt; danach wird der Flächenzuschlag addiert und das Ergebnis in diese Felder zurückgeschrieben.",
 "Welke geometrie u instelt hangt van het type af. In nacalculatie is de geometrie gegeven en bepaalt zij oppervlak, U en vermogen. In dimensionering wordt één parameter — aantal platen, buislengte, aantal haarspelden, aantal rijen of kanaallengte — met bisectie gezocht tot het vermogen klopt; daarna komt de oppervlaktemarge erbij en wordt het resultaat in deze velden teruggeschreven.",
 "La géométrie à renseigner dépend du type. En vérification, la géométrie est donnée et fixe la surface, U et la puissance. En dimensionnement, un paramètre — nombre de plaques, longueur des tubes, nombre d'épingles, nombre de rangs ou longueur de canal — est cherché par dichotomie jusqu'à la puissance requise ; la marge de surface est ensuite ajoutée et le résultat réécrit dans ces champs.",
 "La geometría a introducir depende del tipo. En verificación la geometría está dada y fija la superficie, U y la potencia. En dimensionado un parámetro — número de placas, longitud de tubos, número de horquillas, número de filas o longitud de canal — se busca por bisección hasta alcanzar la carga requerida; después se añade el margen de superficie y el resultado se reescribe en estos campos.","Wybór geometrii zależy od typu. W trybie oceny geometria jest podana i ustala powierzchnię, współczynnik U i obciążenie. W trybie wymiarowania jeden parametr – liczba płyt, długość rury, liczba szpilek, liczba rzędów lub długość kanału – jest znajdowany przez podział na dwie części, aż obliczone obciążenie będzie zgodne z wymaganym; następnie dodawany jest margines powierzchni, a wynik jest zapisywany z powrotem do tych pól."],

margin_b:[
 "Запас поверхности в процентах добавляется к найденному размеру после подбора: сначала находится размер, дающий ровно требуемую мощность, затем он умножается на (1 + запас/100) и округляется вверх до целого (для пластин — до нечётного числа пластин). Запас покрывает неопределённость корреляций (±15–30 %) и рост загрязнения в эксплуатации; он не является дополнительной мощностью, на которую можно рассчитывать.",
 "The surface margin, in per cent, is added to the size found by the sizing search: first the size that gives exactly the required duty is found, then it is multiplied by (1 + margin/100) and rounded up to a whole unit — to an odd plate count for a plate pack. The margin covers the ±15–30 % spread of the correlations and the growth of fouling in service; it is not extra duty you may plan on.",
 "Запас поверхні у відсотках додається до знайденого розміру після підбору: спочатку знаходиться розмір, що дає рівно потрібну потужність, потім він множиться на (1 + запас/100) і округлюється вгору (для пластин — до непарного числа). Запас покриває невизначеність кореляцій і зростання забруднення.",
 "Der Flächenzuschlag in Prozent wird nach der Auslegung addiert: zuerst wird die Größe gesucht, die genau die geforderte Leistung liefert, dann mit (1 + Zuschlag/100) multipliziert und aufgerundet — bei Plattenpaketen auf eine ungerade Plattenzahl. Der Zuschlag deckt die Streuung der Korrelationen und das Anwachsen des Foulings; er ist keine planbare Mehrleistung.",
 "De oppervlaktemarge in procenten komt na de dimensionering erbij: eerst wordt de maat gezocht die precies het vereiste vermogen geeft, daarna vermenigvuldigd met (1 + marge/100) en naar boven afgerond — bij een platenpakket op een oneven aantal platen. De marge dekt de spreiding van de correlaties en de groei van vervuiling; het is geen inzetbaar extra vermogen.",
 "La marge de surface, en pour cent, s'ajoute à la taille trouvée : on cherche d'abord la taille donnant exactement la puissance requise, puis on la multiplie par (1 + marge/100) et on arrondit à l'unité supérieure — à un nombre impair de plaques pour un pack. La marge couvre la dispersion des corrélations et la croissance de l'encrassement ; ce n'est pas une puissance supplémentaire utilisable.",
 "El margen de superficie, en por ciento, se añade al tamaño hallado: primero se busca el tamaño que da exactamente la carga requerida, después se multiplica por (1 + margen/100) y se redondea al alza — a un número impar de placas en un paquete. El margen cubre la dispersión de las correlaciones y el crecimiento del ensuciamiento; no es potencia adicional utilizable.","Margines powierzchni, wyrażony w procentach, jest dodawany do rozmiaru znalezionego w procesie wyszukiwania: najpierw znajduje się rozmiar, który dokładnie odpowiada wymaganemu obciążeniu, a następnie mnoży się go przez (1 + margines/100) i zaokrągla w górę do pełnej jednostki – do nieparzystej liczby płyt w pakiecie płyt. Margines obejmuje rozrzut korelacji w zakresie ±15–30% oraz wzrost zanieczyszczeń podczas eksploatacji; nie jest to dodatkowe obciążenie, którego można się spodziewać."],

wall_b:[
 "Материал и толщина стенки дают сопротивление δ/λ, для труб — логарифмическое по отношению наружного и внутреннего диаметров. У металлической стенки это обычно самое малое звено цепи; заметным оно становится для нержавеющей стали при высоком U или для толстых стенок. Выбор материала из списка подставляет его теплопроводность; «custom» позволяет задать любую.",
 "The wall material and thickness give the resistance δ/λ — logarithmic in the outside/inside diameter ratio for tubes. For a metal wall this is usually the smallest link in the chain; it becomes noticeable for stainless steel at high U or for thick walls. Picking a material from the list fills in its conductivity; `custom` lets you set any value.",
 "Матеріал і товщина стінки дають опір δ/λ, для труб — логарифмічний за відношенням діаметрів. У металевої стінки це зазвичай найменша ланка; помітною вона стає для нержавіючої сталі за високого U або для товстих стінок. Вибір матеріалу підставляє його теплопровідність; «custom» дозволяє задати будь-яку.",
 "Werkstoff und Wanddicke ergeben den Widerstand δ/λ — bei Rohren logarithmisch im Verhältnis Außen-/Innendurchmesser. Bei einer Metallwand ist das meist das kleinste Glied; spürbar wird es bei Edelstahl und hohem k-Wert oder bei dicken Wänden. Die Werkstoffwahl setzt die Leitfähigkeit ein, `custom` erlaubt jeden Wert.",
 "Wandmateriaal en -dikte geven de weerstand δ/λ — bij buizen logaritmisch in de verhouding buiten/binnendiameter. Bij een metalen wand is dit meestal de kleinste schakel; merkbaar wordt hij bij roestvast staal en hoge U of bij dikke wanden. De materiaalkeuze vult de geleiding in; `custom` laat elke waarde toe.",
 "Le matériau et l'épaisseur de paroi donnent la résistance δ/λ — logarithmique dans le rapport des diamètres pour les tubes. Pour une paroi métallique c'est en général le maillon le plus faible ; il devient sensible en inox à U élevé ou pour des parois épaisses. Choisir un matériau renseigne sa conductivité ; `custom` autorise toute valeur.",
 "El material y el espesor de pared dan la resistencia δ/λ — logarítmica en la relación de diámetros para tubos. En una pared metálica suele ser el eslabón menor; se nota en acero inoxidable con U alta o en paredes gruesas. Elegir un material rellena su conductividad; `custom` admite cualquier valor.","Materiał i grubość ścianki dają rezystancję δ/λ — logarytmiczną w stosunku średnicy zewnętrznej do wewnętrznej rur. W przypadku ścianki metalowej jest to zazwyczaj najmniejsze ogniwo w łańcuchu; staje się to zauważalne w przypadku stali nierdzewnej o wysokim współczynniku U lub grubych ścianek. Wybór materiału z listy powoduje uzupełnienie jego przewodności; opcja „custom” pozwala ustawić dowolną wartość."],

scheme_b:[
 "Схема перерисовывается по текущим геометрии, ориентации и назначению сторон: она показывает, что именно понял расчёт, и её стоит сверять с задумкой прежде, чем смотреть на числа. Под схемой выводится опорная поверхность, к которой отнесены U и все сопротивления.",
 "The schematic is redrawn from the current geometry, orientation and side assignment: it shows what the calculation actually understood, and it is worth checking against your intent before reading the numbers. The reference area — the one U and every resistance are referred to — is printed beneath it.",
 "Схема перемальовується за поточними геометрією, орієнтацією та призначенням сторін: вона показує, що саме зрозумів розрахунок. Під схемою виводиться опорна поверхня, до якої віднесені U та всі опори.",
 "Das Schema wird aus der aktuellen Geometrie, Einbaulage und Seitenzuordnung neu gezeichnet: es zeigt, was die Rechnung tatsächlich verstanden hat. Darunter steht die Bezugsfläche, auf die k-Wert und alle Widerstände bezogen sind.",
 "Het schema wordt hertekend uit de huidige geometrie, opstelling en zijdetoewijzing: het toont wat de berekening werkelijk begrepen heeft. Eronder staat het referentieoppervlak waarop U en alle weerstanden betrokken zijn.",
 "Le schéma est redessiné à partir de la géométrie, de l'orientation et de l'affectation des côtés : il montre ce que le calcul a réellement compris. La surface de référence, à laquelle U et toutes les résistances se rapportent, est indiquée dessous.",
 "El esquema se redibuja con la geometría, la orientación y la asignación de lados actuales: muestra lo que el cálculo ha entendido realmente. Debajo se indica la superficie de referencia a la que se refieren U y todas las resistencias.","Schemat został przerysowany na podstawie aktualnej geometrii, orientacji i przypisania stron: pokazuje, co faktycznie zostało zrozumiane przez obliczenia, i warto sprawdzić to z intencją przed odczytaniem liczb. Obszar odniesienia – do którego odnosi się jedno U i każdy opór – jest wydrukowany pod nim."],

charts_b:[
 "Четыре графика: профиль температур вдоль поверхности, диаграмма γ–β из «Handboek Installatietechniek» (рис. 3.5-17…19) с текущей рабочей точкой, семейство ε–NTU для четырёх схем тока при текущем C* и чувствительность мощности и ΔP к расходу в диапазоне 0,4…1,6 от заданного. Последний график считает одиннадцать полных решений и показывает, насколько результат устойчив к ошибке в расходе.",
 "Four charts: the temperature profile along the surface, the γ–β diagram from the Dutch Handboek Installatietechniek (fig. 3.5-17…19) with the current operating point, the ε–NTU family for four arrangements at the current C*, and the sensitivity of duty and ΔP to flow over 0.4…1.6 of the value you set. The last one solves the exchanger eleven times and shows how robust the answer is to an error in the flow.",
 "Чотири графіки: профіль температур уздовж поверхні, діаграма γ–β із «Handboek Installatietechniek» із поточною робочою точкою, сімейство ε–NTU для чотирьох схем течії за поточного C* і чутливість потужності та ΔP до витрати в діапазоні 0,4…1,6. Останній графік рахує одинадцять повних розв'язків.",
 "Vier Diagramme: der Temperaturverlauf über der Fläche, das γ–β-Diagramm aus dem Handboek Installatietechniek (Bild 3.5-17…19) mit dem aktuellen Betriebspunkt, die ε–NTU-Schar für vier Stromführungen beim aktuellen C* und die Empfindlichkeit von Leistung und ΔP gegenüber dem Durchfluss über 0,4…1,6. Das letzte rechnet elf vollständige Lösungen.",
 "Vier grafieken: het temperatuurverloop over het oppervlak, het γ–β-diagram uit het Handboek Installatietechniek (fig. 3.5-17…19) met het huidige werkpunt, de ε–NTU-schaar voor vier schakelingen bij de huidige C*, en de gevoeligheid van vermogen en ΔP voor het debiet over 0,4…1,6. De laatste rekent elf volledige oplossingen.",
 "Quatre graphiques : le profil de température le long de la surface, le diagramme γ–β du Handboek Installatietechniek (fig. 3.5-17…19) avec le point de fonctionnement courant, la famille ε–NTU pour quatre dispositions au C* courant, et la sensibilité de la puissance et de la perte de charge au débit sur 0,4…1,6. Le dernier résout l'échangeur onze fois.",
 "Cuatro gráficos: el perfil de temperaturas a lo largo de la superficie, el diagrama γ–β del Handboek Installatietechniek (fig. 3.5-17…19) con el punto de operación actual, la familia ε–NTU para cuatro disposiciones al C* actual, y la sensibilidad de la potencia y la ΔP al caudal entre 0,4 y 1,6. El último resuelve el intercambiador once veces.","Cztery wykresy: profil temperatury wzdłuż powierzchni, diagram γ–β z holenderskiego podręcznika „Installatietechniek” (rys. 3.5-17…19) z aktualnym punktem pracy, rodzina ε–NTU dla czterech układów przy aktualnym ciśnieniu C* oraz wrażliwość wypełnienia i ΔP na przepływ w zakresie 0,4…1,6 ustawionej wartości. Ostatni wykres rozwiązuje wymiennik jedenastokrotnie i pokazuje, jak odporna jest odpowiedź na błąd w przepływie."],

db_b:[
 "Справочные таблицы, на которых стоит расчёт: свойства сред при выбранной температуре, теплопроводности материалов, типовые сопротивления загрязнения по TEMA и таблицы насыщения рабочих тел. Свойства сред — инженерные аппроксимации: вода ±1 %, гликоли ±8 %, масла ±15 %, хладагенты ±3–5 %. Строки, выделенные бледным, лежат вне диапазона данных для этой среды.",
 "The reference tables the calculation stands on: fluid properties at the temperature you choose, material conductivities, the typical TEMA fouling resistances and the saturation tables of the working fluids. Fluid data are engineering fits: water ±1 %, glycols ±8 %, oils ±15 %, refrigerants ±3–5 %. A row shown faint is outside the data range of that fluid.",
 "Довідкові таблиці, на яких стоїть розрахунок: властивості середовищ, теплопровідності матеріалів, типові опори забруднення за TEMA і таблиці насичення. Властивості середовищ — інженерні апроксимації: вода ±1 %, гліколі ±8 %, оливи ±15 %, холодоагенти ±3–5 %.",
 "Die Referenztabellen, auf denen die Rechnung steht: Stoffwerte bei der gewählten Temperatur, Werkstoffleitfähigkeiten, die üblichen TEMA-Foulingwiderstände und die Sättigungstabellen der Arbeitsmedien. Die Stoffwerte sind ingenieurmäßige Anpassungen: Wasser ±1 %, Glykole ±8 %, Öle ±15 %, Kältemittel ±3–5 %.",
 "De referentietabellen waarop de berekening rust: stofeigenschappen bij de gekozen temperatuur, materiaalgeleidingen, de gebruikelijke TEMA-vervuilingsweerstanden en de verzadigingstabellen van de werkmedia. De stofgegevens zijn technische fits: water ±1 %, glycolen ±8 %, oliën ±15 %, koudemiddelen ±3–5 %.",
 "Les tables de référence sur lesquelles repose le calcul : propriétés des fluides à la température choisie, conductivités des matériaux, résistances d'encrassement TEMA usuelles et tables de saturation des fluides de travail. Les propriétés sont des ajustements d'ingénierie : eau ±1 %, glycols ±8 %, huiles ±15 %, frigorigènes ±3–5 %.",
 "Las tablas de referencia sobre las que se apoya el cálculo: propiedades de los fluidos a la temperatura elegida, conductividades de materiales, resistencias de ensuciamiento TEMA habituales y tablas de saturación de los fluidos de trabajo. Los datos son ajustes de ingeniería: agua ±1 %, glicoles ±8 %, aceites ±15 %, refrigerantes ±3–5 %.","Tabele odniesienia, na których opierają się obliczenia: właściwości cieczy w wybranej temperaturze, przewodność materiałów, typowe opory przed zanieczyszczeniami TEMA oraz tabele nasycenia cieczy roboczych. Dane dotyczące cieczy są zgodne z danymi technicznymi: woda ±1%, glikole ±8%, oleje ±15%, czynniki chłodnicze ±3–5%. Wiersz oznaczony jako niewyraźny znajduje się poza zakresem danych dla danej cieczy."],

opt_b:[
 "Здесь задаётся, какая сторона идёт по какому каналу, и какими корреляциями считать. Для кожухотрубного — среда в трубах, метод межтрубного пространства (Керн или упрощённый Белл–Делавэр) и корреляция в трубах (Гнилинский/Хаузен или Стендер–Меркель для воды). Для «трубы в трубе» — что идёт по внутренней трубе, для воздушного — какая сторона является воздухом. Для остальных типов выбирать нечего, и панель не показывается.",
 "This is where you say which side occupies which channel, and which correlations to use. For shell and tube: the tube-side fluid, the shell-side method (Kern or a simplified Bell–Delaware) and the tube-side correlation (Gnielinski/Hausen or Stender–Merkel for water). For a double pipe: what runs in the inner tube. For an air coil: which side is the air. For the other types there is nothing to choose and the panel is not shown.",
 "Тут задається, яка сторона йде по якому каналу і якими кореляціями рахувати. Для кожухотрубного — середовище в трубах, метод міжтрубного простору та кореляція в трубах. Для «труби в трубі» — що йде по внутрішній трубі, для повітряного — яка сторона є повітрям. Для решти типів вибирати нічого, і панель не показується.",
 "Hier wird festgelegt, welche Seite welchen Kanal belegt und mit welchen Korrelationen gerechnet wird. Beim Rohrbündel: rohrseitiges Medium, Mantelraum-Methode (Kern oder vereinfachtes Bell–Delaware) und rohrseitige Korrelation (Gnielinski/Hausen oder Stender–Merkel für Wasser). Beim Doppelrohr: was im Innenrohr strömt. Beim Luftkühler: welche Seite die Luft ist. Bei den übrigen Bauarten gibt es nichts zu wählen, und die Karte erscheint nicht.",
 "Hier legt u vast welke zijde welk kanaal inneemt en met welke correlaties gerekend wordt. Bij shell-and-tube: het buiszijdige medium, de mantelzijdemethode (Kern of vereenvoudigd Bell–Delaware) en de buiszijdige correlatie. Bij een dubbele buis: wat in de binnenbuis stroomt. Bij een luchtbatterij: welke zijde de lucht is. Bij de andere typen valt er niets te kiezen en verschijnt het paneel niet.",
 "C'est ici qu'on indique quel côté occupe quel canal et quelles corrélations employer. Faisceau tubulaire : fluide côté tubes, méthode côté calandre (Kern ou Bell–Delaware simplifié) et corrélation côté tubes. Tube en tube : ce qui circule dans le tube interne. Batterie : quel côté est l'air. Pour les autres types il n'y a rien à choisir et le panneau ne s'affiche pas.",
 "Aquí se indica qué lado ocupa qué canal y qué correlaciones emplear. Carcasa y tubos: fluido del lado tubos, método del lado carcasa (Kern o Bell–Delaware simplificado) y correlación del lado tubos. Tubo en tubo: qué circula por el tubo interno. Batería: qué lado es el aire. En los demás tipos no hay nada que elegir y el panel no se muestra.","Tutaj określasz, która strona zajmuje który kanał i jakich korelacji użyć. W przypadku płaszcza i rury: płyn po stronie rury, metoda płaszcza (Kerna lub uproszczona metoda Bella-Delaware'a) oraz korelacja po stronie rury (Gnielińskiego/Hausena lub Stendera-Merkla dla wody). W przypadku rury podwójnej: co biegnie w rurze wewnętrznej. W przypadku wężownicy powietrznej: która strona jest powietrzem. W przypadku pozostałych typów nie ma wyboru, a panel nie jest pokazany."],

conc_b:[
 "Массовая доля гликоля или сахара в водном растворе. Она сильно меняет вязкость и заметно — теплоёмкость и теплопроводность, поэтому переход с воды на 35 % гликоль обычно снижает α и увеличивает ΔP при том же расходе. Диапазон ползунка ограничен диапазоном данных выбранной среды.",
 "The mass fraction of glycol or sugar in the aqueous solution. It changes the viscosity strongly and the specific heat and conductivity noticeably, so moving from water to 35 % glycol usually lowers α and raises ΔP at the same flow. The slider range is limited to the data range of the selected fluid.",
 "Масова частка гліколю або цукру у водному розчині. Вона сильно змінює в'язкість і помітно — теплоємність і теплопровідність, тож перехід з води на 35 % гліколь зазвичай знижує α і збільшує ΔP за тієї самої витрати. Діапазон повзунка обмежений діапазоном даних середовища.",
 "Der Massenanteil Glykol oder Zucker in der wässrigen Lösung. Er verändert die Viskosität stark und Wärmekapazität wie Leitfähigkeit merklich; der Wechsel von Wasser auf 35 % Glykol senkt α und erhöht ΔP bei gleichem Durchfluss. Der Schieberbereich folgt dem Datenbereich des Mediums.",
 "De massafractie glycol of suiker in de waterige oplossing. Zij verandert de viscositeit sterk en de warmtecapaciteit en geleiding merkbaar; van water naar 35 % glycol verlaagt α en verhoogt ΔP bij gelijk debiet. Het schuifbereik volgt het databereik van het medium.",
 "La fraction massique de glycol ou de sucre dans la solution aqueuse. Elle modifie fortement la viscosité et sensiblement la capacité thermique et la conductivité ; passer de l'eau à 35 % de glycol abaisse α et augmente ΔP à débit égal. La plage du curseur suit celle des données du fluide.",
 "La fracción másica de glicol o azúcar en la disolución acuosa. Cambia mucho la viscosidad y de forma apreciable el calor específico y la conductividad; pasar de agua a glicol al 35 % baja α y sube ΔP al mismo caudal. El rango del deslizador sigue el de los datos del fluido.","Ułamek masowy glikolu lub cukru w ​​roztworze wodnym. Zmienia on znacząco lepkość, a także zauważalnie ciepło właściwe i przewodność elektryczną, dlatego przejście z wody do 35% glikolu zazwyczaj obniża α i podnosi ΔP przy tym samym przepływie. Zakres suwaka jest ograniczony do zakresu danych wybranego płynu."],

flow_b:[
 "Расход можно задавать массовым или объёмным; объёмный пересчитывается в массовый по плотности при средней температуре стороны, поэтому при смене среды массовый расход меняется. Расход входит в расходную теплоёмкость C = m·cp, а через неё — в C*, NTU и в то, какая сторона окажется C_min. У воздушного аппарата расход воздушной стороны не задаётся: он следует из фронтальной скорости и площади фронта.",
 "The flow may be given as a mass or a volume rate; a volume rate is converted with the density at the mean temperature of that side, so changing the fluid changes the mass flow. The flow enters the capacity rate C = m·cp and through it C*, NTU and which side turns out to be C_min. On an air coil the air-side flow is not entered: it follows from the face velocity and the face area.",
 "Витрату можна задавати масовою або об'ємною; об'ємна перераховується за густиною при середній температурі сторони. Витрата входить у витратну теплоємність C = m·cp, а через неї — у C*, NTU і в те, яка сторона виявиться C_min. У повітряного апарата витрата повітря не задається: вона випливає з фронтальної швидкості.",
 "Der Durchfluss kann als Massen- oder Volumenstrom gegeben werden; ein Volumenstrom wird mit der Dichte bei der mittleren Temperatur dieser Seite umgerechnet. Der Durchfluss geht in den Kapazitätsstrom C = m·cp ein und darüber in C*, NTU und in die Frage, welche Seite C_min ist. Beim Luftkühler folgt der Luftstrom aus Anströmgeschwindigkeit und Anströmfläche.",
 "Het debiet kan als massa- of volumestroom worden gegeven; een volumestroom wordt omgerekend met de dichtheid bij de gemiddelde temperatuur van die zijde. Het debiet gaat in de capaciteitsstroom C = m·cp en daarmee in C*, NTU en de vraag welke zijde C_min is. Bij een luchtbatterij volgt de luchtstroom uit frontsnelheid en frontoppervlak.",
 "Le débit peut être donné en masse ou en volume ; un débit volumique est converti avec la masse volumique à la température moyenne de ce côté. Le débit entre dans le débit de capacité C = m·cp et par là dans C*, le NTU et le côté qui sera C_min. Sur une batterie, le débit d'air n'est pas saisi : il découle de la vitesse frontale et de la surface frontale.",
 "El caudal puede darse en masa o en volumen; un caudal volumétrico se convierte con la densidad a la temperatura media de ese lado. El caudal entra en la tasa de capacidad C = m·cp y con ella en C*, el NTU y en qué lado resulta ser C_min. En una batería el caudal de aire no se introduce: se deduce de la velocidad frontal y del área frontal.","Przepływ może być podany jako natężenie masowe lub objętościowe; natężenie objętościowe jest przeliczane na gęstość w średniej temperaturze po danej stronie, więc zmiana płynu zmienia natężenie przepływu masowego. Przepływ wchodzi do współczynnika wydajności C = m·cp i przez niego C*, NTU, a po której stronie okazuje się, że jest to C_min. W cewce powietrznej przepływ po stronie powietrza nie jest wprowadzany: wynika on z prędkości czołowej i powierzchni czołowej."],

sizing_b:[
 "В конструктивном режиме задаётся не геометрия, а требование: температура на выходе одной из сторон или прямо тепловая нагрузка. Из требования вычисляется нужная мощность, затем размер аппарата подбирается делением пополам так, чтобы расчётная мощность совпала с требуемой. Если даже максимальный размер не даёт нужной мощности — выдаётся ошибка, а не молча увеличенный аппарат.",
 "In sizing mode you give a requirement rather than a geometry: the outlet temperature of one side, or the duty itself. The required duty follows from that, and the size is then found by bisection until the calculated duty matches it. If even the largest size falls short the tool reports an error rather than silently returning an oversized unit.",
 "У конструктивному режимі задається не геометрія, а вимога: температура на виході однієї зі сторін або прямо теплове навантаження. З вимоги обчислюється потрібна потужність, далі розмір підбирається діленням навпіл. Якщо навіть максимальний розмір не дає потрібної потужності — видається помилка.",
 "In der Auslegung geben Sie eine Anforderung statt einer Geometrie an: die Austrittstemperatur einer Seite oder die Leistung selbst. Daraus folgt die erforderliche Leistung, und die Größe wird durch Intervallhalbierung gesucht. Reicht selbst die größte Größe nicht, meldet das Werkzeug einen Fehler statt stillschweigend zu überdimensionieren.",
 "In dimensionering geeft u een eis in plaats van een geometrie: de uittredetemperatuur van één zijde, of het vermogen zelf. Daaruit volgt het vereiste vermogen, en de maat wordt met bisectie gezocht. Haalt zelfs de grootste maat het niet, dan meldt de tool een fout in plaats van stil te overdimensioneren.",
 "En dimensionnement, vous donnez une exigence plutôt qu'une géométrie : la température de sortie d'un côté, ou la puissance elle-même. La puissance requise en découle et la taille est cherchée par dichotomie. Si même la plus grande taille est insuffisante, l'outil signale une erreur au lieu de surdimensionner en silence.",
 "En dimensionado se da un requisito en lugar de una geometría: la temperatura de salida de un lado, o la propia potencia. De ahí sale la potencia requerida y el tamaño se busca por bisección. Si ni el mayor tamaño basta, la herramienta informa de un error en lugar de sobredimensionar en silencio.","W trybie określania rozmiaru podaje się wymaganie, a nie geometrię: temperaturę wylotową jednej strony lub samo obciążenie. Wymagane obciążenie wynika z tego, a następnie rozmiar jest znajdowany poprzez podział na dwie części, aż do momentu, gdy obliczone obciążenie będzie do niego pasować. Jeśli nawet największy rozmiar jest za mały, narzędzie zgłasza błąd zamiast bezgłośnie zwracać jednostkę zawyżoną."],

duty_b:[
 "Тепловая мощность Q — это одновременно U·A·F·LMTD и ε·C_min·(T_гор,вх − T_хол,вх); расчёт сходится, когда обе записи совпадают. Если одна из сторон меняет фазу, Q дополнительно ограничено её теплотой парообразования, и тогда аппарат оказывается избыточным: излишняя поверхность (переохлаждение конденсата, перегрев пара) не моделируется.",
 "The duty Q is both U·A·F·LMTD and ε·C_min·(T_hot,in − T_cold,in); the solution has converged when the two agree. If one side changes phase, Q is additionally capped by its latent capacity, and the exchanger is then oversized: the surplus surface — condensate subcooling, vapour superheat — is not modelled.",
 "Теплова потужність Q — це одночасно U·A·F·LMTD і ε·C_min·(T_гар,вх − T_хол,вх); розрахунок збігається, коли обидва записи однакові. Якщо одна зі сторін змінює фазу, Q додатково обмежена теплотою пароутворення, і апарат виявляється надлишковим.",
 "Die Leistung Q ist zugleich U·A·F·LMTD und ε·C_min·(T_warm,ein − T_kalt,ein); die Lösung ist konvergiert, wenn beide übereinstimmen. Wechselt eine Seite die Phase, wird Q zusätzlich durch deren latente Kapazität begrenzt, und der Apparat ist dann überdimensioniert; die überschüssige Fläche wird nicht modelliert.",
 "Het vermogen Q is zowel U·A·F·LMTD als ε·C_min·(T_warm,in − T_koud,in); de oplossing is geconvergeerd als beide gelijk zijn. Wisselt één zijde van fase, dan wordt Q bovendien door haar latente capaciteit begrensd en is het toestel overgedimensioneerd; het overtollige oppervlak wordt niet gemodelleerd.",
 "La puissance Q vaut à la fois U·A·F·DTLM et ε·C_min·(T_chaud,e − T_froid,e) ; la solution a convergé quand les deux coïncident. Si un côté change de phase, Q est en outre plafonnée par sa capacité latente et l'appareil est alors surdimensionné ; la surface excédentaire n'est pas modélisée.",
 "La potencia Q es a la vez U·A·F·DTML y ε·C_min·(T_cal,ent − T_frío,ent); la solución ha convergido cuando ambas coinciden. Si un lado cambia de fase, Q queda además limitada por su capacidad latente y el equipo resulta sobredimensionado; la superficie sobrante no se modela.","Wypełnienie Q to zarówno U·A·F·LMTD, jak i ε·C_min·(T_gorące,in − T_zimne,in); rozwiązanie jest zbieżne, gdy oba parametry się zgadzają. Jeśli jedna strona zmienia fazę, Q jest dodatkowo ograniczone przez jej pojemność utajoną, a wymiennik jest wówczas przewymiarowany: nadwyżka powierzchni – przechłodzenie kondensatu, przegrzanie pary – nie jest modelowana."]
};

/* ======================= GEOMETRY FIELD TABLE =======================
   unchanged data, but parameterised by type so every type's field list can be
   declared up front and switched with visible() instead of a re-render        */
function geomPrefix(tp){tp=tp||ST.type;return tp==="widegap"?"geom.wide":"geom."+tp;}
function geomFields(tp){
  tp=tp||ST.type;
  const p=geomPrefix(tp);
  switch(tp){
   case "plate": case "widegap": return [
    ["g_np",p+".Np","none","1"],["g_lp",p+".Lp","mm","10"],["g_lw",p+".Lw","mm","10"],
    ["g_b",p+".b","mm","0.1"],["g_phi",p+".Phi","none","0.01"],["g_beta",p+".beta","deg","5"],
    ["g_pass_h",p+".passH","none","1"],["g_pass_c",p+".passC","none","1"],
    ["g_dport",p+".dport","mm","5"]];
   case "shell": return [
    ["g_ds",p+".Ds","mm","10"],["g_do",p+".do","mm","0.05"],["g_tthk",p+".tthk","mm","0.05"],
    ["g_nt",p+".Nt","none","1"],["g_ltube",p+".L","mtr","0.1"],["g_pt",p+".Pt","mm","0.5"],
    ["g_layout",p+".layout","sel",[[30,"30° △"],[45,"45° ◇"],[60,"60° ▽"],[90,"90° □"]]],
    ["g_baffle",p+".B","mm","10"],["g_cut",p+".cut","pct","1"],["g_tubepass",p+".tubePass","none","1"]];
   case "dbl": return [
    ["g_di_in",p+".diIn","mm","0.1"],["g_do_in",p+".doIn","mm","0.1"],
    ["g_di_out",p+".diOut","mm","0.1"],["g_nhair",p+".nHair","none","1"],
    ["g_lhair",p+".Lhair","mtr","0.1"]];
   case "air": return [
    ["g_form",p+".form","sel",FINFORMS.map(f=>[f.id,f.id+" · "+f.lbl])],
    ["g_face_w",p+".W","mm","10"],["g_face_h",p+".H","mm","10"],["g_rows",p+".rows","none","1"],
    ["g_vface",p+".vface","vel","0.1"],["g_ntubes_row",p+".ntr","none","1"],
    ["g_eta",p+".eta","none","0.01"]];
   default: return [
    ["g_nch",p+".nch","none","1"],["g_dch",p+".dch","mm","0.5"],["g_lch",p+".Lch","mtr","0.05"],
    ["g_freq",p+".freq","freq","0.5"],["g_stroke",p+".stroke","mm","1"],
    ["g_pmodel",p+".model","sel",[["enh",t("pm_enh")],["kurzweg",t("pm_kurz")]]],
    ["g_ccoef",p+".C","none","0.1"]];
  }
}
function geomValueText(f){
  const[,path,dim,extra]=f;
  const v=gp(ST,path);
  if(dim==="sel"){const it=extra.find(x=>String(x[0])===String(v));return it?it[1]:String(v);}
  const dec=extra&&extra!=="any"?Math.max(0,(String(extra).split(".")[1]||"").length):2;
  return fmt(toU(v,dim),dec)+" "+uname(dim);
}

/* ======================= PANELS =======================
   One panel per group the user already thought of as a group: the process, the
   two sides, the geometry of the selected type, the wall, and the per-type
   options.  The OPTIONS panel declares only conditional fields, so for a plate,
   a wide-gap plate or a pulsating unit it has nothing visible and the framework
   refuses to draw it — the ~200 px of empty card the audit found is gone       */
function sideFields(sd){
  const S=()=>ST[sd];
  const foulKey=sd==="hot"?"f_rf_h":"f_rf_c";
  return [
    sF("f_fluid",sd+".fluid",fluidOpts,{learn:"fluid"}),
    withUnit({id:fid(sd+".conc"),key:sd+".conc",type:"range",min:0,max:100,step:5,precision:0,
     label:()=>t("f_conc"),learn:"concentration",
     visible:()=>!!getFluid(S().fluid).conc,
     dyn:f=>{const fl=getFluid(S().fluid);if(!fl.conc)return;
       f.def.min=fl.conc[0];f.def.max=fl.conc[1];
       if(f.control){f.control.min=fl.conc[0];f.control.max=fl.conc[1];}},

function mkNode(cls,html){const d=document.createElement("div");d.className=cls;
  if(html!==undefined)d.innerHTML=html;return d;}
function msgTone(k){return k==="e"?"bad":k==="w"?"warn":k==="ok"?"ok":"";}
function hxTable(title,head,rows,hl){
  const wrap=mkNode("hx-card");
  wrap.append(el("h3",null,title));
  const sc=mkNode("dgu-table-wrap");
  const tb=el("table","hx-t");
  tb.innerHTML="<thead><tr>"+head.map(h=>`<th>${h}</th>`).join("")+"</tr></thead>";
  const bd=el("tbody");
  rows.forEach((r,i)=>{const tr=el("tr",(hl&&hl.indexOf(i)>=0)?"hl":null);
    tr.innerHTML=r.map(c=>`<td>${c}</td>`).join("");bd.append(tr);});
  tb.append(bd);sc.append(tb);wrap.append(sc);
  return wrap;
}

/* ======================= CHART ENGINE ======================= */
function setupCv(cv,h,wOv){
  const dpr=wOv?2:(window.devicePixelRatio||1);
  const w=Math.max(wOv||(cv.parentElement?cv.parentElement.clientWidth-4:0),120);
  cv.style.width=w+"px";cv.style.height=h+"px";
  cv.width=w*dpr;cv.height=h*dpr;
  const x=cv.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);
  x.clearRect(0,0,w,h);return{x,w,h};
}
/* The tool's private palette is gone; the drawings read the section 2 tokens
   through this map, so no CSS custom property outside the token set survives
   and every canvas follows the theme the shell resolved. */
const TOK={"--hot":"--bad","--cold":"--accent","--tx":"--ink","--tx2":"--muted",
  "--tx3":"--muted","--bg2":"--panel","--bg3":"--panel-2","--ac":"--accent",
  "--ac2":"--ok","--wr":"--warn","--er":"--bad","--line":"--line"};
/* The printed report is an exported artefact and may not change.  While it is
   being rendered (RPT.w is set) the drawings use the exact palette the light
   theme of the pre-port page had, so every PNG in the PDF is bit-identical to
   the one the tool produced before the port. */
const RPT_PAL={"--bg":"#f2f5f8","--bg2":"#ffffff","--bg3":"#eef2f6","--line":"#d4dde6",
  "--tx":"#15202b","--tx2":"#4a5b6b","--tx3":"#7b8b9a","--ac":"#0b6bcb","--ac2":"#1a7f37",
  "--wr":"#b26a00","--er":"#c62828","--hot":"#d93b1f","--cold":"#0b6bcb"};
function css(v){
  if(RPT.w&&RPT_PAL[v])return RPT_PAL[v];
  return getComputedStyle(document.documentElement).getPropertyValue(TOK[v]||v).trim();
}
function plot(cv,o){
  const H=o.h||260,{x,w,h}=setupCv(cv,H,o.wFixed);
  const m={l:50,r:o.endLabels?30:12,t:o.legend?30:16,b:36};
  const pw=w-m.l-m.r,ph=h-m.t-m.b;
  const lx=!!o.logx,ly=!!o.logy;
  const tx=v=>lx?Math.log10(Math.max(v,1e-9)):v, ty=v=>ly?Math.log10(Math.max(v,1e-9)):v;
  const x0=tx(o.xmin),x1=tx(o.xmax),y0=ty(o.ymin),y1=ty(o.ymax);
  const X=v=>m.l+(tx(v)-x0)/(x1-x0)*pw, Y=v=>m.t+ph-(ty(v)-y0)/(y1-y0)*ph;
  x.fillStyle=css("--bg2");x.fillRect(0,0,w,h);
  x.strokeStyle=css("--line");x.lineWidth=1;x.font="10px system-ui";x.fillStyle=css("--tx3");
  const ticks=(min,max,log)=>{const a=[];
    if(log){for(let e=Math.floor(Math.log10(min));e<=Math.ceil(Math.log10(max));e++)
      for(const mlt of[1,2,5]){const v=mlt*Math.pow(10,e);if(v>=min*0.999&&v<=max*1.001)a.push(v);}}
    else{const st=(max-min)/5;for(let i=0;i<=5;i++)a.push(min+st*i);}
    return a;};
  const fm=v=>Math.abs(v)>=100?v.toFixed(0):Math.abs(v)>=1?v.toFixed(1):v.toFixed(2);
  ticks(o.xmin,o.xmax,lx).forEach(v=>{const px=X(v);
    x.beginPath();x.moveTo(px,m.t);x.lineTo(px,m.t+ph);x.globalAlpha=.3;x.stroke();x.globalAlpha=1;
    x.textAlign="center";x.fillText(fm(v),px,h-20);});
  ticks(o.ymin,o.ymax,ly).forEach(v=>{const py=Y(v);
    x.beginPath();x.moveTo(m.l,py);x.lineTo(m.l+pw,py);x.globalAlpha=.3;x.stroke();x.globalAlpha=1;
    x.textAlign="right";x.fillText(fm(v),m.l-5,py+3);});
  x.strokeStyle=css("--tx3");x.strokeRect(m.l,m.t,pw,ph);
  x.save();x.beginPath();x.rect(m.l-1,m.t-1,pw+2,ph+2);x.clip();
  (o.series||[]).forEach(s=>{
    x.strokeStyle=s.c||css("--ac");x.lineWidth=s.w||1.8;x.setLineDash(s.dash||[]);
    x.beginPath();let started=false;
    s.pts.forEach(([px,py])=>{if(!isFinite(px)||!isFinite(py))return;
      const cx=X(px),cy=Y(py);if(!started){x.moveTo(cx,cy);started=true;}else x.lineTo(cx,cy);});
    x.stroke();x.setLineDash([]);
  });
  x.restore();
  if(o.endLabels){const used=[];
    (o.series||[]).forEach(s=>{
      if(!s.label||!s.pts.length)return;const [lxp,lyp]=s.pts[s.pts.length-1];
      const py=clamp(Y(lyp)+3,m.t+8,m.t+ph);
      if(used.some(u=>Math.abs(u-py)<9))return;
      used.push(py);
      x.fillStyle=s.c||css("--ac");x.textAlign="left";x.font="9.5px system-ui";
      x.fillText(s.label,clamp(X(lxp)+3,m.l,w-30),py);});}
  (o.points||[]).forEach(p=>{
    x.fillStyle=p.c||css("--ac2");x.beginPath();x.arc(X(p.x),Y(p.y),4.5,0,7);x.fill();
    x.strokeStyle=css("--bg2");x.lineWidth=2;x.stroke();
    if(p.label){x.fillStyle=css("--tx");x.textAlign=X(p.x)>w*0.6?"right":"left";x.font="11px system-ui";
      x.fillText(p.label,X(p.x)+(X(p.x)>w*0.6?-8:8),Y(p.y)-8);}
  });
  if(o.legend){let cx=4;x.font="10.5px system-ui";x.textAlign="left";
    (o.series||[]).filter(s=>s.label).forEach(s=>{
      const lb=s.label.length>16?s.label.slice(0,15)+"…":s.label;
      const lw=24+x.measureText(lb).width;
      if(cx+lw>w-2)return;
      x.strokeStyle=s.c;x.lineWidth=2.4;x.setLineDash(s.dash||[]);
      x.beginPath();x.moveTo(cx,12);x.lineTo(cx+14,12);x.stroke();x.setLineDash([]);
      x.fillStyle=css("--tx2");x.fillText(lb,cx+18,15.5);
      cx+=lw+8;});}
  x.font="10px system-ui";x.fillStyle=css("--tx3");
  if(o.xlabel){x.textAlign="right";x.fillText(o.xlabel,w-2,h-4);}
  if(o.ylabel){x.textAlign="left";x.fillText(o.ylabel,2,h-4);}
}
function drawRes(cv){
  cv=cv||$("#cvRes");if(!cv||!RES)return;
  const r=RES,Rt=r.Rh+r.Rc+r.Rw;
  const{x,w,h}=setupCv(cv,64,RPT.w);
  const parts=[[r.Rh,css("--hot"),t("sec_hot")],[r.Rw,css("--tx3"),t("r_wall")],[r.Rc,css("--cold"),t("sec_cold")]];
  let cx=0;const bw=w-2,y=14,bh=22;
  parts.forEach(([v,c,l])=>{const pw=bw*v/Rt;
    x.fillStyle=c;x.fillRect(1+cx,y,pw,bh);

function tempProfile(r){
  const N=200,st=r.st;
  const Ch=isFinite(r.Ch)?r.Ch:1e12, Cc=isFinite(r.Cc)?r.Cc:1e12;
  /* effective conductance consistent with the actual duty (handles
     capacity-limited two-phase cases where U*A >> Q/LMTD) */
  const UA=clamp(r.Q/Math.max(r.dTm*(r.F||1),0.01),0,1e12), dUA=UA/N;
  const par=(st.arr==="parallel");
  let th=r.thi, tc=par?r.tci:r.tco;
  const A=[[0,th,tc]];
  for(let i=1;i<=N;i++){
    let dQ=dUA*(th-tc);
    const dTmax=0.45*Math.abs(th-tc)*Math.min(Ch,Cc);
    if(Math.abs(dQ)>dTmax)dQ=Math.sign(dQ)*dTmax;
    th-=dQ/Ch;
    tc+= par? dQ/Cc : -dQ/Cc;
    if(isPhase(st.hot))th=st.hot.tsat;
    if(isPhase(st.cold))tc=st.cold.tsat;
    if(!par&&tc>th)tc=th;
    if(par&&tc>th)tc=th=(tc+th)/2;
    A.push([i/N,th,tc]);
  }
  return A.filter((_,i)=>i%Math.round(N/60)===0||i===N);
}

/* ======================= PAGE: VALIDATION SHEET =======================
   What this sheet is, exactly — the rows are NOT all of the same kind:
     • "published value" / "reference data" rows compare the model with a number
       taken from outside the tool (IAPWS/REFPROP data points, a published limit
       such as Nu = 3.66, a textbook constant). Those rows can fail on physics.
     • "closed form" rows evaluate the published relation in a second, separately
       written expression. They catch a typo in the production branch but not an
       error shared by both writings of the same formula.
     • rows tagged "same correlation, external value" compare the model with a
       number produced off-line from the SAME published correlation the model
       implements. They verify the coding of that correlation only — they say
       nothing about how well the correlation matches reality (±15–30 % for the
       empirical ones), and a 0.000 % deviation there is expected, not evidence.
   Nothing in this sheet is an independent validation of the tool. */
function VCASES(){
  const L=[];
  const add=(grp,name,ref,got,tol,unit,src)=>L.push({grp,name,ref,got,tol:tol||0.005,unit:unit||"",src});
  /* --- effectiveness–NTU relations --- */
  add("lib","ε–NTU counterflow, NTU=2, C*=0.5",
      (()=>{const e=Math.exp(-2*0.5);return (1-e)/(1-0.5*e);})(),
      effNTU("counter",2,0.5),1e-6,"","Kays & London — closed form, re-derived");
  add("lib","ε–NTU counterflow, NTU=2, C*=1",2/3,effNTU("counter",2,1),1e-6,"","published limit NTU/(1+NTU)");
  add("lib","ε–NTU parallel flow, NTU=2, C*=1",(1-Math.exp(-4))/2,effNTU("parallel",2,1),1e-6,"","closed form, re-derived");
  add("lib","ε–NTU 1-2 shell & tube, NTU=2, C*=1",
      (()=>{const r=Math.SQRT2,e=Math.exp(-2*r);return 2/(2+r*(1+e)/(1-e));})(),
      effNTU("st12",2,1),1e-6,"","Bowman/TEMA — closed form, re-derived");
  add("lib","ε–NTU 2-4 shell & tube, NTU=3, C*=1",
      (()=>{const r=Math.SQRT2,e=Math.exp(-1.5*r),e1=2/(2+r*(1+e)/(1-e));return 2*e1/(1+e1);})(),
      effNTU("st24",3,1),1e-6,"","Kays & London limit — closed form, re-derived");
  /* External value: the exact Mason (1954) series summed off-line to machine
     precision and cross-checked against a finite-difference solution of the
     crossflow PDE (agreement 2.5e-7). Independent of the code path it tests.
     The Incropera Eq. 11.32 shortcut would give 0.615407 at this point, i.e.
     1.9e-3 high — this row is what keeps the exact relation in place.       */
