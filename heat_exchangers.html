<script type="application/json" id="diagram-tool-manifest">{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision":"2026-08-22.report-charts","id":"heat-exchangers","file":"heat_exchangers.html","listed":true,"category":"thermo","order":23,"title":{"en":"Heat Exchanger Calculator","uk":"Розрахунок теплообмінників","de":"Wärmeübertrager-Rechner","nl":"Warmtewisselaar-calculator","fr":"Calcul d’échangeurs de chaleur","es":"Cálculo de intercambiadores de calor","pl":"Kalkulator wymiennika ciepła"},"summary":{"en":"Rating and sizing of plate, wide-gap plate, shell-and-tube, double-pipe, finned air coil and pulsating push-pull exchangers.","uk":"Повірочний і конструктивний розрахунок пластинчастих, широкозазорних, кожухотрубних, «труба в трубі», оребрених повітряних та пульсуючих теплообмінників.","de":"Nachrechnung und Auslegung von Platten-, Weitspalt-, Rohrbündel-, Doppelrohr-, berippten Luft- und pulsierenden Wärmeübertragern.","nl":"Nacalculatie en dimensionering van platen-, wijdespleet-, shell-and-tube-, dubbelebuis-, geribde lucht- en pulserende warmtewisselaars.","fr":"Vérification et dimensionnement d’échangeurs à plaques, à large espace, à faisceau tubulaire, tube en tube, batteries à ailettes et échangeurs pulsatoires.","es":"Verificación y dimensionado de intercambiadores de placas, de paso ancho, de carcasa y tubos, tubo en tubo, baterías aleteadas e intercambiadores pulsantes.","pl":"Ocena i wymiarowanie wymienników płytowych, płytowych o dużej szczelinie, płaszczowo-rurowych, dwururowych, żebrowanych wymienników powietrznych i pulsacyjnych wymienników przeciwsobnych."},"description":{"en":"Rating and sizing of plate, wide-gap plate, shell-and-tube, double-pipe, finned air coil and pulsating push-pull exchangers. ε–NTU method with boiling and condensation, vertical or horizontal orientation, fluid and material databases, pressure drop, temperature profile, γ–β and ε–NTU charts, a built-in verification sheet and a printable report.","uk":"Повірочний і конструктивний розрахунок пластинчастих, широкозазорних, кожухотрубних, «труба в трубі», оребрених повітряних та пульсуючих теплообмінників. Метод ε–NTU з кипінням і конденсацією, вертикальне чи горизонтальне виконання, бази середовищ і матеріалів, втрати тиску, профіль температур, графіки γ–β та ε–NTU, вбудований аркуш верифікації і звіт для друку.","de":"Nachrechnung und Auslegung von Platten-, Weitspalt-, Rohrbündel-, Doppelrohr-, berippten Luft- und pulsierenden Wärmeübertragern. ε–NTU-Methode mit Sieden und Kondensation, senkrechte oder waagerechte Einbaulage, Stoff- und Werkstoffdatenbank, Druckverlust, Temperaturverlauf, γ–β- und ε–NTU-Diagramme, integrierte Verifikationsliste und druckbarer Bericht.","nl":"Nacalculatie en dimensionering van platen-, wijdespleet-, shell-and-tube-, dubbelebuis-, geribde lucht- en pulserende warmtewisselaars. ε–NTU-methode met koken en condenseren, verticale of horizontale opstelling, media- en materiaaldatabase, drukval, temperatuurverloop, γ–β- en ε–NTU-diagrammen, ingebouwde verificatielijst en afdrukbaar rapport.","fr":"Vérification et dimensionnement d’échangeurs à plaques, à large espace, à faisceau tubulaire, tube en tube, batteries à ailettes et échangeurs pulsatoires. Méthode ε–NTU avec ébullition et condensation, orientation verticale ou horizontale, bases de fluides et de matériaux, pertes de charge, profil de température, diagrammes γ–β et ε–NTU, feuille de vérification intégrée et rapport imprimable.","es":"Verificación y dimensionado de intercambiadores de placas, de paso ancho, de carcasa y tubos, tubo en tubo, baterías aleteadas e intercambiadores pulsantes. Método ε–NTU con ebullición y condensación, orientación vertical u horizontal, bases de fluidos y materiales, pérdida de carga, perfil de temperaturas, diagramas γ–β y ε–NTU, hoja de verificación integrada e informe imprimible.","pl":"Ocena i wymiarowanie wymienników płytowych, płytowych o dużej szczelinie, płaszczowo-rurowych, dwururowych, żebrowanych wężownic powietrznych i pulsacyjnych wymienników typu push-pull. Metoda ε–NTU z bazami danych dotyczącymi wrzenia i kondensacji, orientacji pionowej lub poziomej, płynów i materiałów, spadkiem ciśnienia, profilem temperatury, wykresami γ–β i ε–NTU, wbudowaną kartą weryfikacyjną i raportem do wydruku."},"status":"benchmarked","independent_validation":false,"validation":{"basis":{"en":"263 benchmark cases driven through the page DOM: the effectiveness-NTU relations of every arrangement, the LMTD and its F correction, the energy balance and the standard Nusselt correlations are compared with an independent python implementation and with published worked examples and verification tables. The harness is the author's own; no external party has reviewed it. Changed 2026-08-22: the six charts (unit schematic, temperature profile, resistance breakdown, gamma-beta diagram, eps-NTU family, duty and pressure-drop sensitivity) are back in the printed report, the framework pager now decoding a raster figure before it measures it. The 263 benchmark cases above were NOT re-executed against this build; that run is from 2026-08-11.","uk":"263 контрольні випадки, проведені через DOM сторінки: співвідношення ефективність-NTU для кожної схеми, LMTD та поправка F, енергетичний баланс і стандартні кореляції Нуссельта порівняно з незалежною реалізацією в python та з опублікованими розв'язаними прикладами й перевірочними таблицями. Випробувальний стенд належить авторові; сторонньої перевірки не проводилося. Зміна від 2026-08-22: шість графіків (схема апарата, профіль температур, розподіл опорів, діаграма гамма-бета, сімейство eps-NTU, чутливість потужності та втрат тиску) повернулися до друкованого звіту, оскільки пагінатор фреймворку тепер декодує растровий рисунок перед вимірюванням. 263 контрольні випадки вище НЕ виконувалися повторно на цій збірці; той прогін від 2026-08-11.","de":"263 Prüffälle über das Seiten-DOM: die Wirkungsgrad-NTU-Beziehungen aller Schaltungen, die LMTD und ihre F-Korrektur, die Energiebilanz und die Standard-Nusselt-Korrelationen werden mit einer unabhängigen python-Implementierung sowie mit veröffentlichten Rechenbeispielen und Prüftabellen verglichen. Der Prüfstand stammt vom Autor selbst; eine Prüfung durch Dritte fand nicht statt. Geändert am 2026-08-22: Die sechs Diagramme (Apparateschema, Temperaturverlauf, Widerstandsaufteilung, Gamma-Beta-Diagramm, eps-NTU-Schar, Empfindlichkeit von Leistung und Druckverlust) sind wieder im gedruckten Bericht, da der Pager des Frameworks eine Rasterabbildung nun dekodiert, bevor er sie misst. Die 263 Prüffälle oben wurden gegen diesen Build NICHT erneut ausgeführt; jener Lauf stammt vom 2026-08-11.","nl":"263 testgevallen via de DOM van de pagina: de effectiviteit-NTU-relaties van elke schakeling, de LMTD en de F-correctie, de energiebalans en de standaard Nusselt-correlaties worden vergeleken met een onafhankelijke python-implementatie en met gepubliceerde uitgewerkte voorbeelden en verificatietabellen. De testbank is van de auteur zelf; er is geen review door derden. Gewijzigd op 2026-08-22: de zes grafieken (toestelschema, temperatuurverloop, weerstandsverdeling, gamma-beta-diagram, eps-NTU-familie, gevoeligheid van vermogen en drukval) staan weer in het afgedrukte rapport, nu de pager van het framework een rasterfiguur decodeert voordat hij die meet. De 263 testgevallen hierboven zijn NIET opnieuw uitgevoerd tegen deze build; die run is van 2026-08-11.","fr":"263 cas de test pilotés via le DOM de la page : les relations efficacité-NTU de chaque configuration, la DTLM et sa correction F, le bilan d'énergie et les corrélations de Nusselt normalisées sont comparés à une implémentation python indépendante ainsi qu'à des exemples résolus et des tables de vérification publiés. Le banc d'essai est celui de l'auteur ; aucune revue externe n'a eu lieu. Modifie le 2026-08-22 : les six graphiques (schema de l'appareil, profil de temperature, repartition des resistances, diagramme gamma-beta, faisceau eps-NTU, sensibilite de la puissance et de la perte de charge) sont de nouveau dans le rapport imprime, le pagineur du cadre decodant desormais une figure matricielle avant de la mesurer. Les 263 cas de test ci-dessus n'ont PAS ete re-executes sur cette version ; cette execution date du 2026-08-11.","es":"263 casos de prueba ejecutados a través del DOM de la página: las relaciones eficacia-NTU de cada disposición, la DTLM y su corrección F, el balance de energía y las correlaciones estándar de Nusselt se comparan con una implementación independiente en python y con ejemplos resueltos y tablas de verificación publicados. El banco de pruebas es del propio autor; no ha habido revisión externa. Modificado el 2026-08-22: los seis graficos (esquema del equipo, perfil de temperaturas, reparto de resistencias, diagrama gamma-beta, familia eps-NTU, sensibilidad de potencia y perdida de carga) vuelven a estar en el informe impreso, ya que el paginador del marco decodifica una figura rasterizada antes de medirla. Los 263 casos de prueba anteriores NO se han vuelto a ejecutar sobre esta compilacion; esa ejecucion es del 2026-08-11.","pl":"263 przypadki porównawcze przeprowadzone na stronie DOM: relacje efektywności-NTU każdego układu, LMTD i jego korekta F, bilans energetyczny i standardowe korelacje Nusselta porównano z niezależną implementacją w Pythonie oraz opublikowanymi przykładami i tabelami weryfikacyjnymi. Zestaw testowy został przygotowany przez autora; nie był recenzowany przez żadną stronę zewnętrzną. Zmieniono 22.08.2026: sześć wykresów (schemat jednostki, profil temperatury, przebicie rezystancji, wykres gamma-beta, rodzina eps-NTU, obciążenie i wrażliwość na spadek ciśnienia) powróciło do drukowanego raportu, pager struktury dekoduje teraz dane rastrowe przed ich pomiarem. Powyższe 263 przypadki porównawcze NIE zostały ponownie wykonane w tej kompilacji; ten przebieg pochodzi z 11.08.2026."},"independent_validation":false,"benchmarks":[{"id":"hx-entu-lmtd-correlations","reference":"Closed-form effectiveness-NTU relations implemented independently in python; for crossflow with both fluids unmixed the EXACT Mason (1954) series, cross-checked against a finite-difference solution of the crossflow PDE (mutual agreement 1.2e-6 absolute); LMTD in closed form; the Bowman/TEMA F factor, independently confirmed to equal eps/(NTU*LMTD_counterflow) to 1e-15. Empirical heat-transfer correlations are deliberately NOT benchmarked against truth - the tool declares +-15..30% scatter; only internal consistency and validity-range flagging are tested.","citations":["W.M. Kays and A.L. London, \"Compact Heat Exchangers\", 3rd ed., McGraw-Hill 1984, Table 2-1 (effectiveness-NTU relations).","R.K. Shah and D.P. Sekulic, \"Fundamentals of Heat Exchanger Design\", Wiley 2003, Table 3.3 and Table 3.8 (eps-NTU and P-NTU relations, F factor).","W.R. Mason, \"Heat transfer in crossflow\", Proc. 2nd U.S. National Congress of Applied Mechanics (1954) 801-803 - exact series for crossflow, both fluids unmixed.","R.A. Bowman, A.C. Mueller, W.M. Nagle, \"Mean temperature difference in design\", Trans. ASME 62 (1940) 283-294 - F correction factor.","F.P. Incropera and D.P. DeWitt, \"Fundamentals of Heat and Mass Transfer\", Eq. 11.32 - the crossflow approximation, which the tool retains only as a non-convergence fallback; its distance from the exact series is reported, not scored."],"cases":263,"passed":263,"tolerance":"Closed-form eps-NTU relations and LMTD: 1e-12 / 1e-9 relative (pure double arithmetic, probed directly, no display rounding). Crossflow both unmixed: 1e-2 relative against the exact series, because the arrangement label promises the arrangement, not an approximation; the distance to the Incropera Eq. 11.32 shortcut is reported but not scored, since exact and shortcut differ by up to 3.8 % and no implementation can match both. F factor: 1e-9 relative against Bowman/TEMA. End-to-end identity checks: tolerances propagated from the printed precision of the CSV export (NTU 3 dp, eps 4 dp, Cr 3 dp, F 3 dp, T 2 dp, U 1 dp, A 3 dp). Where the tool reports the duty as limited by the latent capacity of the phase-change side, eps is checked against its definition Q/(Cmin*dTmax) and bounded above by eps(NTU,Cr), because a capped duty is no longer eps(NTU,Cr)*Cmin*dTmax. Empirical correlations: not benchmarked.","run_at":"2026-10-17T14:23:17Z","artifact":"benchmarks/heat_exchangers.json"}]},"limitations":{"en":"Engineering correlations with a typical ±15–30 % spread (Martin for chevron plates, Gnielinski, Kern or a simplified Bell–Delaware, Gungor–Winterton with Cooper, Nusselt/Chato); two-phase duty is evaluated at the mean vapour quality without a dryout limit, two-phase pressure drop uses the homogeneous model, fin efficiency and shell-side leakage factors are user inputs, and fluid data are engineering fits (water ±1 %, glycols ±8 %, oils ±15 %, refrigerants ±3–5 %). The ε–NTU relations themselves are exact closed forms; crossflow with both fluids unmixed is summed as the exact Mason (1954) series, and the Incropera Eq. 11.32 shortcut (up to 3.8 % off at low NTU and C*→1) is kept only as a fallback if that series fails to converge. F is reported as computed, with no lower clamp: an F below 0.75 is flagged as an unsuitable flow arrangement instead of being hidden. When the duty is cut back to the latent capacity of the phase-change side, ε and F are re-derived from that capped duty, so U·A·F·LMTD always reproduces the stated duty; the exchanger is then oversized and the surplus surface (condensate subcooling, vapour superheat) is not modelled. The built-in verification sheet is an implementation self-check, not an independent validation: several of its rows re-evaluate the same published correlation the model implements and therefore verify the coding only. Maldistribution, non-condensable gases, subcooling, superheat and mechanical design are not covered; it does not replace a manufacturer's selection or a certified design calculation.","uk":"Інженерні кореляції з типовим розкидом ±15–30 % (Мартін для шевронних пластин, Гнілінський, Керн або спрощений Белл–Делавер, Гунгор–Уінтертон із Купером, Нуссельт/Чато); двофазний розрахунок ведеться за середнім паровмістом без урахування кризи теплообміну, втрати тиску двофазного потоку — за гомогенною моделлю, ККД оребрення та коефіцієнти перетікань задає користувач, властивості середовищ — інженерні апроксимації. Самі співвідношення ε–NTU точні: перехресний потік із обома неперемішуваними середовищами обчислюється за точним рядом Мейсона (1954), а наближення Інкропери (рівн. 11.32), що відхиляється до 3,8 %, лишається тільки як запасний варіант за відсутності збіжності ряду. Коефіцієнт F виводиться як розраховано, без нижнього обмеження: F нижче 0,75 позначається як непридатна схема течії, а не приховується. Якщо потужність обмежена теплотою фазового переходу, ε та F перераховуються за фактичною (обмеженою) потужністю, тож U·A·F·LMTD завжди відтворює наведену потужність; апарат тоді надлишковий, а надлишкова поверхня (переохолодження конденсату, перегрів пари) не моделюється. Вбудований аркуш верифікації — це самоперевірка реалізації, а не незалежна валідація: частина рядків повторно обчислює ту саму кореляцію, тобто перевіряє лише кодування. Не враховуються нерівномірність роздачі, неконденсовані гази, переохолодження, перегрів і механічний розрахунок; інструмент не замінює підбір виробника.","de":"Ingenieurkorrelationen mit typischer Streuung von ±15–30 % (Martin für Prägeplatten, Gnielinski, Kern oder vereinfachtes Bell–Delaware, Gungor–Winterton mit Cooper, Nusselt/Chato); die Zweiphasenleistung wird beim mittleren Dampfgehalt ohne Dryout-Grenze bewertet, der Zweiphasendruckverlust folgt dem homogenen Modell, Rippenwirkungsgrad und Leckagefaktoren sind Benutzereingaben und die Stoffwerte sind ingenieurmäßige Anpassungen. Die ε–NTU-Beziehungen selbst sind exakt: Kreuzstrom mit beidseitig unvermischten Fluiden wird als exakte Mason-Reihe (1954) summiert; die Näherung nach Incropera (Gl. 11.32), die bis zu 3,8 % abweicht, dient nur noch als Rückfallebene, falls die Reihe nicht konvergiert. F wird ohne untere Begrenzung ausgegeben: ein F unter 0,75 wird als ungeeignete Stromführung gemeldet und nicht kaschiert. Wird die Leistung auf die latente Kapazität der Phasenwechselseite begrenzt, werden ε und F aus dieser begrenzten Leistung neu bestimmt, sodass U·A·F·LMTD stets die angegebene Leistung wiedergibt; der Apparat ist dann überdimensioniert, die überschüssige Fläche (Kondensatunterkühlung, Dampfüberhitzung) wird nicht modelliert. Die integrierte Verifikationsliste ist eine Eigenprüfung der Implementierung, keine unabhängige Validierung: mehrere Zeilen werten dieselbe veröffentlichte Korrelation erneut aus und prüfen damit nur die Codierung. Ungleichverteilung, Inertgase, Unterkühlung, Überhitzung und Festigkeitsnachweise fehlen; ersetzt keine Herstellerauslegung.","nl":"Technische correlaties met een gebruikelijke spreiding van ±15–30 % (Martin voor chevronplaten, Gnielinski, Kern of vereenvoudigd Bell–Delaware, Gungor–Winterton met Cooper, Nusselt/Chato); het tweefasevermogen wordt bepaald bij het gemiddelde dampgehalte zonder dryout-grens, de tweefasedrukval volgt het homogene model, ribrendement en lekfactoren zijn invoer van de gebruiker en de stofgegevens zijn technische fits. De ε–NTU-relaties zelf zijn exact: kruisstroom met beide media ongemengd wordt als de exacte Mason-reeks (1954) gesommeerd; de benadering van Incropera (verg. 11.32), die tot 3,8 % afwijkt, blijft alleen als terugvaloptie wanneer die reeks niet convergeert. F wordt weergegeven zoals berekend, zonder ondergrens: een F onder 0,75 wordt gemeld als een ongeschikte stromingsschakeling in plaats van verborgen. Wordt het vermogen begrensd door de latente capaciteit van de faseovergangszijde, dan worden ε en F opnieuw uit dat begrensde vermogen afgeleid, zodat U·A·F·LMTD altijd het vermelde vermogen reproduceert; het toestel is dan overgedimensioneerd en het overtollige oppervlak (onderkoeling van condensaat, oververhitting van damp) wordt niet gemodelleerd. De ingebouwde verificatielijst is een zelfcontrole van de implementatie, geen onafhankelijke validatie: enkele regels evalueren dezelfde gepubliceerde correlatie opnieuw en controleren dus alleen de codering. Maldistributie, inerte gassen, onderkoeling, oververhitting en sterkteberekening ontbreken; vervangt geen leveranciersselectie.","fr":"Corrélations d’ingénierie avec une dispersion typique de ±15–30 % (Martin pour plaques chevron, Gnielinski, Kern ou Bell–Delaware simplifié, Gungor–Winterton avec Cooper, Nusselt/Chato) ; la puissance diphasique est évaluée au titre vapeur moyen sans limite d’assèchement, la perte de charge diphasique suit le modèle homogène, l’efficacité d’ailette et les facteurs de fuite sont saisis par l’utilisateur et les propriétés des fluides sont des ajustements d’ingénierie. Les relations ε–NTU elles-mêmes sont exactes : le courant croisé à deux fluides non brassés est sommé par la série exacte de Mason (1954), l’approximation d’Incropera (éq. 11.32), écartée jusqu’à 3,8 %, n’étant conservée qu’en repli si la série ne converge pas. F est affiché tel que calculé, sans borne inférieure : un F inférieur à 0,75 est signalé comme une disposition d’écoulement inadaptée au lieu d’être masqué. Lorsque la puissance est ramenée à la capacité latente du côté à changement de phase, ε et F sont recalculés à partir de cette puissance plafonnée, de sorte que U·A·F·LMTD reproduit toujours la puissance annoncée ; l’appareil est alors surdimensionné et la surface excédentaire (sous-refroidissement du condensat, surchauffe de la vapeur) n’est pas modélisée. La feuille de vérification intégrée est une auto-vérification de l’implémentation, non une validation indépendante : plusieurs de ses lignes réévaluent la corrélation publiée que le modèle applique et ne vérifient donc que la programmation. Maldistribution, incondensables, sous-refroidissement, surchauffe et calcul mécanique ne sont pas traités ; ne remplace pas la sélection d’un fabricant.","es":"Correlaciones de ingeniería con una dispersión típica de ±15–30 % (Martin para placas chevron, Gnielinski, Kern o Bell–Delaware simplificado, Gungor–Winterton con Cooper, Nusselt/Chato); la potencia bifásica se evalúa al título de vapor medio sin límite de secado, la pérdida de carga bifásica usa el modelo homogéneo, la eficiencia de aleta y los factores de fuga son datos del usuario y las propiedades de los fluidos son ajustes de ingeniería. Las relaciones ε–NTU son exactas: el flujo cruzado con ambos fluidos sin mezclar se suma mediante la serie exacta de Mason (1954), y la aproximación de Incropera (ec. 11.32), con desviaciones de hasta 3,8 %, se conserva solo como respaldo si la serie no converge. F se muestra tal como se calcula, sin límite inferior: un F por debajo de 0,75 se señala como una disposición de flujo inadecuada en lugar de ocultarse. Cuando la potencia queda limitada por la capacidad latente del lado con cambio de fase, ε y F se recalculan a partir de esa potencia limitada, de modo que U·A·F·LMTD siempre reproduce la potencia indicada; el equipo queda entonces sobredimensionado y la superficie sobrante (subenfriamiento del condensado, sobrecalentamiento del vapor) no se modela. La hoja de verificación integrada es una autocomprobación de la implementación, no una validación independiente: varias de sus filas reevalúan la misma correlación publicada que implementa el modelo y por tanto solo verifican la programación. No cubre maldistribución, incondensables, subenfriamiento, sobrecalentamiento ni cálculo mecánico; no sustituye la selección del fabricante.","pl":"Korelacje inżynierskie z typowym rozrzutem ±15–30% (Martin dla płyt szewronowych, Gnielinski, Kern lub uproszczone Bell–Delaware, Gungor–Winterton z Cooperem, Nusselt/Chato); obciążenie dwufazowe oceniane jest przy średniej jakości pary bez limitu /* ---------------------------------------------------------------------------
   Tool-owned CSS, framework v3 (tools.petrov.re/ui/v1).

   Everything the shell already owns — page background, header, tabs, cards,
   fields, KPI tiles, theme palette — is gone; what is left is (a) the four
   dense reference surfaces the framework has no component for (the charts
   sheet, the verification sheet, the fluid/material database and the built-in
   manual), (b) the bespoke A4 print report, which is an exported artefact and
   is therefore preserved unchanged, and (c) four local repairs of framework
   defects that belong upstream in diagram-ui.js.  Every value is a section 2
   token; the print block is deliberately theme-independent because paper has
   no theme.
   --------------------------------------------------------------------------- */

/* ---- local repairs of framework defects (belong upstream in diagram-ui.js) ---- */
/* 1. diagram-ui.js hides regions with [hidden] but nothing collapses a hidden
      field or panel, so a field whose visible() is false still occupies a row. */
.dgu-app [hidden]{display:none!important}
/* 2. body-level cards (popover, dialog, tour) inherit the page box model, not
      the shell's; without this they overflow their own padding. */
.dgu-pop,.dgu-pop *,.dgu-dialog,.dgu-dialog *,.dgu-tour,.dgu-tour *{box-sizing:border-box}
/* 3. sub-44px tap targets on framework-owned controls below md: the shell's own
      rule is scoped to .dgu-app, which reaches neither the segmented buttons
      (min-height is set on .dgu-seg button, inside the scope but with its own
      smaller value) nor the tour, popover and dialog cards, which live on
      <body>. */
@media(max-width:768px){
  .dgu-app .dgu-sel,.dgu-app .dgu-home,.dgu-app .dgu-tab,.dgu-app .dgu-q{min-height:var(--tap)}
  .dgu-app .dgu-seg button{min-height:var(--tap)}
  .dgu-tour .dgu-btn,.dgu-pop .dgu-btn,.dgu-dialog .dgu-btn{min-height:var(--tap)}
}
/* 4. a canvas placed in the stage body must not be stretched by the shell rule
      `.dgu-stage-body>canvas{height:100%}`: the schematic sets its own height. */
.dgu-stage-body>canvas.hx-fixed{height:auto}

/* ---- the four dense reference surfaces (dock) ---- */
.hx-grid{display:grid;gap:var(--sp-4);grid-template-columns:repeat(auto-fit,minmax(min(100%,32ch),1fr))}

val_intro:["Лист внутренней верификации. Строки неравноценны: «опубликованное значение» и «справочные данные» сравнивают модель с числом извне (IAPWS/REFPROP, табличный предел); «замкнутая форма, выведена повторно» — это второй, отдельно записанный вариант той же формулы; «та же корреляция, внешнее значение» — число, посчитанное вне инструмента по той же самой корреляции, то есть проверяется только кодирование корреляции, а не её физическая точность (±15–30 % для эмпирических). Нулевое отклонение в таких строках ожидаемо и ничего не доказывает. Это самопроверка реализации, а не независимая валидация инструмента.",
"Internal verification sheet. The rows are not equivalent: rows sourced from a \"published value\" or \"reference data\" compare the model with a number from outside the tool (IAPWS/REFPROP points, a tabulated limit); rows marked \"closed form, re-derived\" evaluate the same published relation in a second, separately written expression, which catches a typo but not an error shared by both writings; rows marked \"same correlation, external value\" compare the model with a number produced off-line from the very correlation the model implements, so they verify the coding of that correlation only — not its physical accuracy (±15–30 % for the empirical ones). A 0.000 % deviation in those rows is expected and proves nothing beyond the coding. This is an implementation self-check, not an independent validation of the tool.",
"Аркуш внутрішньої верифікації. Рядки нерівноцінні: «опубліковане значення» і «довідкові дані» порівнюють модель із числом ззовні; «замкнена форма, виведена повторно» — це другий, окремо записаний варіант тієї самої формули; «та сама кореляція, зовнішнє значення» — число, обчислене поза інструментом за тією ж кореляцією, тобто перевіряється лише кодування кореляції, а не її фізична точність (±15–30 % для емпіричних). Нульове відхилення в таких рядках очікуване. Це самоперевірка реалізації, а не незалежна валідація.",
"Interne Verifikationsliste. Die Zeilen sind nicht gleichwertig: «veröffentlichter Wert» und «Referenzdaten» vergleichen das Modell mit einer Zahl von außerhalb des Werkzeugs; «geschlossene Form, neu hergeleitet» ist eine zweite, getrennt geschriebene Fassung derselben Formel; «gleiche Korrelation, externer Wert» ist eine offline aus genau derselben Korrelation berechnete Zahl — geprüft wird also nur die Codierung der Korrelation, nicht ihre physikalische Genauigkeit (±15–30 % bei den empirischen). Eine Abweichung von 0,000 % ist dort zu erwarten. Dies ist eine Eigenprüfung der Implementierung, keine unabhängige Validierung.",
"Interne verificatielijst. De regels zijn niet gelijkwaardig: «gepubliceerde waarde» en «referentiegegevens» vergelijken het model met een getal van buiten het gereedschap; «gesloten vorm, opnieuw afgeleid» is een tweede, apart geschreven versie van dezelfde formule; «zelfde correlatie, externe waarde» is een buiten het gereedschap berekend getal uit precies die correlatie — daarmee wordt alleen de codering gecontroleerd, niet de fysische nauwkeurigheid (±15–30 % bij de empirische). Een afwijking van 0,000 % is daar te verwachten. Dit is een zelfcontrole van de implementatie, geen onafhankelijke validatie.",
"Feuille de vérification interne. Les lignes ne sont pas équivalentes : « valeur publiée » et « données de référence » comparent le modèle à un nombre extérieur à l'outil ; « forme fermée, re-dérivée » est une seconde écriture, séparée, de la même relation ; « même corrélation, valeur externe » est un nombre calculé hors de l'outil à partir de cette même corrélation — seule la programmation est vérifiée, pas la justesse physique (±15–30 % pour les corrélations empiriques). Un écart de 0,000 % y est attendu. Il s'agit d'une auto-vérification, non d'une validation indépendante.",
"Hoja de verificación interna. Las filas no son equivalentes: «valor publicado» y «datos de referencia» comparan el modelo con un número externo a la herramienta; «forma cerrada, re-derivada» es una segunda escritura, separada, de la misma relación; «misma correlación, valor externo» es un número calculado fuera de la herramienta a partir de esa misma correlación, por lo que solo se comprueba la programación, no la exactitud física (±15–30 % en las empíricas). Una desviación del 0,000 % allí es lo esperado. Es una autocomprobación, no una validación independiente.","Arkusz weryfikacji wewnętrznej. Wiersze nie są równoważne: wiersze pochodzące z „wartości opublikowanej” lub „danych referencyjnych” porównują model z liczbą spoza narzędzia (punkty IAPWS/REFPROP, limit tabelaryczny); wiersze oznaczone jako „forma zamknięta, ponownie wyprowadzona” oceniają tę samą opublikowaną relację w drugim, oddzielnie napisanym wyrażeniu, co wychwytuje literówkę, ale nie błąd wspólny dla obu wersji; wiersze oznaczone jako „ta sama korelacja, wartość zewnętrzna” porównują model z liczbą wygenerowaną offline z tej samej korelacji, którą model implementuje, więc weryfikują tylko kodowanie tej korelacji — a nie jej fizyczną dokładność (±15–30% dla danych empirycznych). Odchylenie 0,000% w tych wierszach jest oczekiwane i nie dowodzi niczego poza kodowaniem. Jest to autotest implementacji, a nie niezależna walidacja narzędzia."],

const NM=(ru,en,uk,de,nl,fr,es)=>[ru,en,uk,de,nl,fr,es];
function itp(x,xs,ys){ // linear interpolation with clamped extrapolation
  if(x<=xs[0])return ys[0]+(ys[1]-ys[0])*(x-xs[0])/(xs[1]-xs[0]);
  const n=xs.length;
  if(x>=xs[n-1])return ys[n-2]+(ys[n-1]-ys[n-2])*(x-xs[n-2])/(xs[n-1]-xs[n-2]);
  for(let i=0;i<n-1;i++)if(x<=xs[i+1]){const f=(x-xs[i])/(xs[i+1]-xs[i]);return ys[i]+f*(ys[i+1]-ys[i]);}
  return ys[n-1];
}
function itpLog(x,xs,ys){ // interpolate ln(y) — correct for viscosity
  const l=ys.map(v=>Math.log(Math.max(v,1e-12)));
  return Math.exp(itp(x,xs,l));
}
function itpC(x,xs,ys){ // clamped (no extrapolation)
  return itp(clamp(x,xs[0],xs[xs.length-1]),xs,ys);
}

const WT=[0,20,40,60,80,100,120,140,160,180,200];
const WCP=[4217,4182,4179,4185,4197,4216,4245,4285,4339,4408,4497];   // IAPWS, J/kgK
const WK =[0.561,0.598,0.630,0.654,0.670,0.679,0.683,0.684,0.680,0.673,0.663];
function waterProps(T){
  const Tk=T+273.15;
  const rho=(999.83952+16.945176*T-7.9870401e-3*T*T-46.170461e-6*T**3+105.56302e-9*T**4-280.54253e-12*T**5)/(1+16.87985e-3*T);
  const cp=itpC(T,WT,WCP);
  const mu=2.414e-5*Math.pow(10,247.8/(Tk-140));
  const k=itpC(T,WT,WK);
  return{rho,cp,mu,k};
}
function egPure(T){const Tk=T+273.15;return{rho:1113-0.65*(T-20),cp:(2.35+0.0043*T)*1000,
  k:0.252+0.0002*T,mu:Math.exp(-14.677+3154/Tk)};}
function pgPure(T){const Tk=T+273.15;return{rho:1036-0.72*(T-20),cp:(2.48+0.0045*T)*1000,
  k:0.200-0.0001*T,mu:Math.exp(-16.54+4005/Tk)};}
function mix(w,a,b){ // w = mass fraction of component a (glycol)
  const rho=1/((w/a.rho)+((1-w)/b.rho));
  const cp=w*a.cp+(1-w)*b.cp;
  const mu=Math.exp(w*Math.log(a.mu)+(1-w)*Math.log(b.mu)-0.92*w*(1-w)); // fitted to ASHRAE HoF ch.31
  const va=w/a.rho/((w/a.rho)+((1-w)/b.rho)),vb=1-va;
  const k=(va*a.k+vb*b.k)-0.72*va*vb*(b.k-a.k); // Filippov-like
  return{rho,cp,mu,k};
}
/* generic table fluid: T list + property lists */
function tbl(Ts,rho,cp,k,mu){return T=>({rho:itp(T,Ts,rho),cp:itp(T,Ts,cp),
  k:itp(T,Ts,k),mu:itpLog(T,Ts,mu)});}
/* ideal-ish gas: props at 1 atm, density scaled by p */
function gas(Ts,cp,k,mu,M){return(T,p)=>({rho:(p||101325)*M/(8314.46*(T+273.15)),
  cp:itp(T,Ts,cp),k:itp(T,Ts,k),mu:itp(T,Ts,mu),gas:true});}

const G0=9.80665;

/* ---- effectiveness–NTU ---- */
/* Crossflow with BOTH fluids unmixed has no elementary closed form. The classical
   engineering shortcut (Incropera Eq. 11.32) deviates from the true solution by up
   to 3.8 % (worst at low NTU and C*→1), so it is kept only as a fallback; the
   production path evaluates the EXACT series solution of Mason (1954)
     ε = 1 − e^−N − e^−(1+C)N · Σ_{n≥1} C^n P_n(N),
     P_n(N) = 1/(n+1)! · Σ_{j=1..n+1} (n+1−j)/j! · N^(n+j)
   rearranged into a Poisson-scaled form in which every factor stays bounded by 1,
   so no term overflows and nothing cancels catastrophically at large NTU:
     ε = 1 − e^−N − Σ_{n≥1} p_n·S_n/(n+1),
     p_n = e^−CN (CN)^n/n!,  S_n = Σ_{j=1..n+1} (n+1−j)·e^−N N^j/j!  (S_n/(n+1) ≤ 1)
   The truncation error is bounded by the remaining Poisson mass 1 − Σp_n, which is
   what the loop tests, so the series is stopped on a rigorous bound. */
function epsCrossUnmixedApprox(N,C){          // Incropera Eq. 11.32 — fallback only
  return 1-Math.exp((1/C)*Math.pow(N,0.22)*(Math.exp(-C*Math.pow(N,0.78))-1));
}
function epsCrossUnmixed(N,C){
  const eN=Math.exp(-N);
  let q=eN,Qc=0,S=0,p=Math.exp(-C*N),Pc=p,sum=0,conv=false;
  for(let n=1;n<=4000;n++){
    q=q*N/n; Qc+=q; S+=Qc;                    // q=q_n, Qc=Σ_{j≤n}q_j, S=S_n
    p=p*C*N/n; Pc+=p;
    sum+=p*S/(n+1);
    if(n>C*N&&1-Pc<1e-15){conv=true;break;}   // rigorous truncation bound
  }
  const e=1-eN-sum;
  if(!conv||!isFinite(e)||e<=0||e>1)return epsCrossUnmixedApprox(N,C);
  return e;
}
function effNTU(arr,NTU,C){
  if(NTU<=0)return 0;
  if(C<1e-6)return 1-Math.exp(-NTU);
  switch(arr){
   case "parallel": return (1-Math.exp(-NTU*(1+C)))/(1+C);
   case "cross":    return epsCrossUnmixed(NTU,C);
   case "crossmix": return (1/C)*(1-Math.exp(-C*(1-Math.exp(-NTU))));
   case "st12": {const r=Math.sqrt(1+C*C),e=Math.exp(-NTU*r);
                 return 2/((1+C)+r*(1+e)/(1-e));}
   case "st24": {const r=Math.sqrt(1+C*C),e=Math.exp(-NTU*r/2);
                 const e1=2/((1+C)+r*(1+e)/(1-e));
                 if(Math.abs(C-1)<1e-6)return 2*e1/(1+e1);      // Kays & London limit
                 const a=Math.pow((1-e1*C)/(1-e1),2);
                 return (a-1)/(a-C);}
   default: { if(Math.abs(C-1)<1e-6)return NTU/(1+NTU);
              const e=Math.exp(-NTU*(1-C));return (1-e)/(1-C*e);}
  }
}
function ntuFromEff(arr,eps,C){
  let lo=1e-4,hi=60;
  if(effNTU(arr,hi,C)<eps)return NaN;
  for(let i=0;i<80;i++){const m=(lo+hi)/2;(effNTU(arr,m,C)<eps?lo=m:hi=m);}
  return (lo+hi)/2;
}
function lmtd(dt1,dt2){
  if(dt1<=0||dt2<=0)return Math.max((dt1+dt2)/2,0.01);
  if(Math.abs(dt1-dt2)<1e-6)return dt1;
  return (dt1-dt2)/Math.log(dt1/dt2);
}
function fCorr(arr,Thi,Tho,Tci,Tco){
  if(arr==="counter")return 1;
  const dT=Thi-Tci; if(Math.abs(dT)<1e-9)return 1;
  const P=(Tco-Tci)/dT, R=(Thi-Tho)/Math.max(Tco-Tci,1e-9);
  if(arr==="st12"||arr==="st24"){
    const N=arr==="st12"?1:2, r=Math.sqrt(R*R+1);
    let Px=P;
    if(N===2){const a=Math.pow((1-P*R)/(1-P),1/N);Px=(a-1)/(a-R);}
    let num,den;
    if(Math.abs(R-1)<1e-4){num=Px*r/(1-Px);den=Math.log((2/Px-1-R+r)/(2/Px-1-R-r));return num/den||1;}
    num=r*Math.log((1-Px)/(1-Px*R));
    den=(R-1)*Math.log((2/Px-1-R+r)/(2/Px-1-R-r));
    const F=num/den; return (isFinite(F)&&F>0&&F<=1)?F:NaN;
  }
  /* Every other arrangement (parallel flow, both crossflow variants): F is the
     ratio of the true mean temperature difference to the counter-flow LMTD.
     With Q = ε·C_min·Δt_max and U·A = NTU·C_min this is
        F = Δt_m / LMTD_cf = ε·Δt_max / (NTU · LMTD_cf),
     where NTU follows from the arrangement's own ε–NTU relation. The inversion
     is ill-conditioned once ε approaches the arrangement's ceiling (a parallel-
     flow pinch), and NaN is returned there rather than a fabricated number. */
  const C=clamp(Math.min(R,1/R),0,1);
  const eps=clamp(R<=1?P:P*R,0,1);            // ε of the C_min stream
  const Lcf=lmtd(Thi-Tco,Tho-Tci);
  if(!(eps>0)||!(Lcf>0))return NaN;
  const epsMax=effNTU(arr,60,C);
  if(eps>=epsMax*(1-1e-6))return NaN;         // pinched: NTU not determined by the temperatures
  const N=ntuFromEff(arr,eps,C);
  if(!isFinite(N)||N<=0)return NaN;
  const F=eps*dT/(N*Lcf);
  return (isFinite(F)&&F>0&&F<=1+1e-9)?Math.min(F,1):NaN;
}
/* ---- single phase convection ---- */
function nuTube(Re,Pr,d,L,muRatio){
  if(Re<2300){
    const gz=(d/L)*Re*Pr;
    return (3.66+0.0668*gz/(1+0.04*Math.pow(gz,2/3)))*Math.pow(muRatio,0.14);
  }
  const gnie=(re)=>{const f=Math.pow(0.79*Math.log(re)-1.64,-2);
    return (f/8)*(re-1000)*Pr/(1+12.7*Math.sqrt(f/8)*(Math.pow(Pr,2/3)-1));};
  if(Re<1e4){ // smooth blend laminar → turbulent
    const gz=(d/L)*2300*Pr, nl=3.66+0.0668*gz/(1+0.04*Math.pow(gz,2/3));
    const nt=gnie(1e4), w=(Re-2300)/(1e4-2300);
    return (nl*(1-w)+nt*w)*Math.pow(muRatio,0.14);
  }
  return gnie(Re)*Math.pow(muRatio,0.14);
}
function stenderMerkel(v,d,Tm){ // Handboek Installatietechniek, water only [W/m2K]
  return 2040*(1+0.015*Tm)*Math.pow(Math.max(v,0.05),0.87)*Math.pow(d,-0.13);
}
/* ---- Martin chevron plate ---- */
function martinPlate(Re,Pr,betaDeg,muRatio){
  const b=betaDeg*Math.PI/180;
  const f0=Re<2000?64/Re:Math.pow(1.8*Math.log10(Re)-1.5,-2);
  const f1=Re<2000?597/Re+3.85:39/Math.pow(Re,0.289);
  const t1=Math.cos(b)/Math.sqrt(0.18*Math.tan(b)+0.36*Math.sin(b)+f0/Math.cos(b));
  const t2=(1-Math.cos(b))/Math.sqrt(3.8*f1);
  const xi=Math.pow(1/(t1+t2),2);
  const Nu=0.122*Math.pow(Pr,1/3)*Math.pow(muRatio,1/6)*
           Math.pow(xi*Re*Re*Math.abs(Math.sin(2*b)),0.374);
  return{xi,Nu};
}
/* ---- shell side ---- */
function kernShell(Re,Pr,muRatio){
  const Nu=0.36*Math.pow(Math.max(Re,10),0.55)*Math.pow(Pr,1/3)*Math.pow(muRatio,0.14);
  const f=Math.exp(0.576-0.19*Math.log(Math.max(Re,10)));
  return{Nu,f};
}
function bellShell(Re,Pr,cut,muRatio,layout){
  const a=layout===90?0.37:0.34;
  const j=a*Math.pow(Math.max(Re,10),-0.4);
  const Jc=clamp(0.55+0.72*(1-2*cut/100),0.5,1.15);
  const Jl=0.80, Jb=0.90, Jr=Re<100?0.85:1.0;
  return{jTotal:j*Jc*Jl*Jb*Jr, f:Math.exp(0.576-0.19*Math.log(Math.max(Re,10)))*0.6};
}
/* ---- tube bank (air side) ---- */
function nuBank(Re,Pr){return 0.33*Math.pow(Math.max(Re,10),0.6)*Math.pow(Pr,1/3);}
/* ---- boiling: Gungor–Winterton 1986 + Cooper ---- */
function hBoil(sat,G,d,x,q,orient,gLevel){
  const {rl,rv,cl,kl,ml,hfg,M,pc,p}=sat;
  const muv=1.2e-5;
  const Rel=Math.max(G*(1-x)*d/ml,10);
  const Prl=cl*ml/kl;
  const hl=0.023*Math.pow(Rel,0.8)*Math.pow(Prl,0.4)*kl/d;
  const pr=clamp(p/pc,0.001,0.9);
  const hnb=55*Math.pow(pr,0.12)*Math.pow(-Math.log10(pr),-0.55)*Math.pow(M,-0.5)*Math.pow(Math.max(q,50),0.67);
  const xx=clamp(x,0.01,0.95);
  const Xtt=Math.pow((1-xx)/xx,0.9)*Math.pow(rv/rl,0.5)*Math.pow(ml/muv,0.1);
  const Bo=Math.max(q/(G*hfg),1e-6);
  let E=1+24000*Math.pow(Bo,1.16)+1.37*Math.pow(1/Xtt,0.86);
  let S=1/(1+1.15e-6*E*E*Math.pow(Rel,1.17));
  if(orient==="horiz"){ // stratification correction (Froude)
    const Fr=G*G/(rl*rl*G0*d);
    if(Fr<0.05){E*=Math.pow(Fr,0.1-2*Fr);S*=Math.sqrt(Fr);}
  }
  return{h:E*hl+S*hnb,E,S,hnb,hl};
}
/* ---- condensation ---- */
function hCondVert(sat,L,dT,Gamma){
  const {rl,rv,kl,ml,hfg,cl}=sat;
  const nu=ml/rl, Prl=cl*ml/kl;
  const Re=4*Gamma/ml;
  const gterm=Math.pow(G0/(nu*nu),1/3);
  if(Re<30){
    const hfgp=hfg*(1+0.68*cl*Math.max(dT,0.5)/hfg);
    return 0.943*Math.pow(rl*(rl-rv)*G0*hfgp*kl**3/(ml*L*Math.max(dT,0.5)),0.25);
  }
  if(Re<1800) return (Re*kl/(1.08*Math.pow(Re,1.22)-5.2))*gterm;
  return (Re*kl/(8750+58*Math.pow(Prl,-0.5)*(Math.pow(Re,0.75)-253)))*gterm;
}
function hCondHoriz(sat,d,dT,Nrow,inTube){
  const {rl,rv,kl,ml,hfg,cl}=sat;
  // inside horizontal tubes: Chato (1962) C=0.555, h'fg = hfg + 3/8 cp dT
  // outside a horizontal bank: Nusselt C=0.729/N^0.25, h'fg = hfg(1+0.68 Ja)
  const C=inTube?0.555:0.729;
  const hfgp=inTube? hfg+0.375*cl*Math.max(dT,0.5) : hfg*(1+0.68*cl*Math.max(dT,0.5)/hfg);
  const N=inTube?1:Math.max(Nrow,1);
  return C*Math.pow(rl*(rl-rv)*G0*hfgp*kl**3/(N*ml*d*Math.max(dT,0.5)),0.25);
}
/* pool / flooded-bundle boiling: Cooper + bundle convection factor */
function hPoolBoil(sat,q,Fb){
  const pr=clamp(sat.p/sat.pc,0.001,0.9);
  return (Fb||1.8)*55*Math.pow(pr,0.12)*Math.pow(-Math.log10(pr),-0.55)
         *Math.pow(sat.M,-0.5)*Math.pow(Math.max(q,50),0.67);
}
/* ---- pressure drop helpers ---- */
function darcy(Re,rough,d){
  if(Re<2300)return 64/Math.max(Re,1);
  const rr=(rough||1.5e-6)/d;
  let f=0.02;
  for(let i=0;i<25;i++){f=Math.pow(-2*Math.log10(rr/3.7+2.51/(Re*Math.sqrt(f))),-2);}
  return f;
}
/* ---- fluid property resolver ---- */
function getFluid(id){return FLUIDS.find(f=>f.id===id);}
function props(side,T){
  const fl=getFluid(side.fluid);
  const p=(side.p||101325);
  const o=fl.f(clamp(T,fl.tmin,fl.tmax),p,side.conc);
  o.Pr=o.cp*o.mu/o.k; o.nu=o.mu/o.rho;
  o.outOfRange=(T<fl.tmin-2||T>fl.tmax+2);
  return o;
}
function isPhase(side){return side.phase==="evap"||side.phase==="cond";}
function satOf(side){return satProps(side.satFluid||"water",side.tsat);}

/* =================== GEOMETRY MODELS ===================
   each returns {Aref, sideH:{Ac,Dh,L,Nch,ref}, sideC:{...}, extra}      */
function geomPlate(g,scale){
  const Np=Math.max(3,Math.round(scale||g.Np));
  const Neff=Np-2, b=Math.max(g.b,0.2)/1000, Lw=Math.max(g.Lw,20)/1000,
        Lp=Math.max(g.Lp,50)/1000, Phi=clamp(g.Phi,1,1.6);
  const A=Math.max(Neff,1)*Lw*Lp*Phi;
  const nchTot=(Np-1)/2;
  const mk=(passes)=>({Ac:Math.max(nchTot/passes,0.5)*b*Lw, Dh:2*b/Phi, L:Lp*passes,
                       Nch:nchTot, passes:passes, A:A});
  return {A, h:mk(g.passH||1), c:mk(g.passC||1), Np, Neff, b, Lw, Lp, Phi, beta:g.beta,
          dport:(g.dport||100)/1000};
}
function geomShell(g,scale){
  const L=Math.max(scale||g.L,0.05), do_=Math.max(g.do,1)/1000,
        di=Math.max(g.do-2*g.tthk,0.15*g.do)/1000,
        Nt=Math.max(Math.round(g.Nt),1), np=Math.max(Math.round(g.tubePass||1),1);
  const Ao=Math.PI*do_*L*Nt, Ai=Math.PI*di*L*Nt;
  const Ac_t=Math.PI/4*di*di*Nt/np;
  const Pt=Math.max(g.Pt,g.do*1.15)/1000, Ds=Math.max(g.Ds,g.do*2)/1000, B=Math.max(g.B,20)/1000;
  const As=Ds*(Pt-do_)/Pt*B;
  const De=(g.layout===90||g.layout===45)? 4*(Pt*Pt-Math.PI*do_*do_/4)/(Math.PI*do_)
                        : 4*(0.43301*Pt*Pt-Math.PI*do_*do_/8)/(Math.PI*do_/2);
  const Nb=Math.max(Math.round(L/B)-1,0);
  return {A:Ao,Ao,Ai,di,do_,L,Nt,np,Ac_t,As,De,Nb,Ds,B,Pt,cut:g.cut||25,layout:g.layout,
          Ltube:L*np/np};
}
function geomDbl(g,scale){
  const n=Math.max(1,Math.round(scale||g.nHair));
  const L=g.Lhair*2*n;
  const do_=Math.max(g.doIn,1)/1000, di=clamp(g.diIn,0.2*g.doIn,0.98*g.doIn)/1000,
        Do=Math.max(g.diOut,g.doIn*1.08)/1000;
  const A=Math.PI*do_*L;
  return {A,L,di,do_,Do,Ac_i:Math.PI/4*di*di,Ac_a:Math.PI/4*(Do*Do-do_*do_),
          Dh_a:Do-do_, n};
}
function geomAir(g,scale){
  const rows=Math.max(1,Math.round(scale||g.rows));
  const form=FINFORMS.find(f=>f.id===(g.form||1))||FINFORMS[0];
  const Af=Math.max(g.W,50)/1000*Math.max(g.H,50)/1000;
  const Ae=form.Aper_face*Af*rows;
  const Ai=Ae/form.AeAi;
  const di=form.di/1000;
  const ntr=g.ntr||Math.max(1,Math.round((g.H/1000)/0.06));
  const circuits=Math.max(1,Math.round(ntr/(g.circDiv||1)));
  const Ltube=(g.W/1000)*rows;
  return {A:Ae,Ae,Ai,Af,rows,di,form,ntr,circuits,Ltube,
          Ac_i:Math.PI/4*di*di*circuits};
}
function geomPulse(g,scale){
  const L=Math.max(scale||g.Lch,0.02), d=Math.max(g.dch,0.3)/1000,
        n=Math.max(Math.round(g.nch),1);
  const A=Math.PI*d*L*n;
  return {A,L,d,n,Ac:Math.PI/4*d*d*n};
}
/* ======================= SOLVER ======================= */
/* phase-aware property resolver: two-phase uses homogeneous mean density,
   saturated-liquid transport properties */
function propsX(side,T){
  if(isPhase(side)){
    const s=satOf(side);
    const x=clamp(((side.xin??0)+(side.xout??1))/2,0,1);
    const rho=1/(x/s.rv+(1-x)/s.rl);
    return{rho,cp:s.cl,k:s.kl,mu:s.ml,Pr:s.cl*s.ml/s.kl,nu:s.ml/rho,outOfRange:false,sat:s,twoPhase:true};
  }
  return props(side,T);
}
function massFlow(side,Tm){
  if(side.flowMode==="v"){const p=propsX(side,Tm);return side.V/3600*p.rho;}
  return side.m;
}
function wallR(type,g,kw,thk){
  if(type==="plate"||type==="widegap"||type==="pulse")return (thk/1000)/kw;
  if(type==="shell")return g.do_*Math.log(g.do_/g.di)/(2*kw);
  if(type==="dbl")return g.do_*Math.log(g.do_/g.di)/(2*kw);
  if(type==="air")return (thk/1000)/kw*1.0;
  return (thk/1000)/kw;
}
/* --- per-side convective calculation --- */
function sideCalc(st,g,which,side,pr,Tm,Tw,q,dTm){
  const type=st.type, out={notes:[]};
  const muRatio=isPhase(side)?1:clamp(pr.mu/props(side,Tw).mu,0.3,3);
  const phase=side.phase;
  let ch=null; // channel description
  if(type==="plate"||type==="widegap"){
    ch=(which==="h")?g.h:g.c;
  }
  const m=side._m;
  out.hGuess=side._hprev||6000;
  /* opt = {per: wetted perimeter for film condensation [m],
             inTube: film inside a tube, pool: flooded bundle / pool boiling,
             d: characteristic diameter, N: tube rows for a bank,
             qRef: heat flux referred to THIS side [W/m2]} */
  const doPhase=(Dh,G,Lref,opt)=>{
    const sat=satOf(side);
    const qs=Math.max(opt.qRef||q,100);
    if(phase==="evap"){
      if(opt.pool){                       // flooded bundle / pool boiling
        out.regime="boil-pool";
        const h=hPoolBoil(sat,qs,1.8);
        out.hnb=h;return h;
      }
      const x=clamp(((side.xin??0)+(side.xout??1))/2,0.01,0.95);
      const r=hBoil(sat,Math.max(G,20),Dh,x,qs,st.orient,0);
      out.regime="boil"; out.E=r.E; out.S=r.S; out.hnb=r.hnb;
      return r.h;
    }
    const dT=clamp(qs/Math.max(out.hGuess||6000,500),0.3,40);
    if(st.orient==="vert"||type==="plate"||type==="widegap"){
      const Gam=clamp(m/Math.max(opt.per||1e-3,1e-4),1e-5,50);
      out.regime="cond-v"; out.Gamma=Gam;
      return hCondVert(sat,Lref,dT,Gam)*((type==="plate"||type==="widegap")?1.15:1);
    }
    out.regime="cond-h";
    return hCondHoriz(sat,opt.d||Dh,dT,opt.N||3,!!opt.inTube);
  };

  if(type==="plate"||type==="widegap"){
    const G=m/ch.Ac, Dh=ch.Dh, v=G/pr.rho;
    const Re=G*Dh/pr.mu;
    out.G=G; out.v=v; out.Re=Re; out.Pr=pr.Pr; out.Dh=Dh;
    if(isPhase(side)){ out.h=doPhase(Dh,G,g.Lp,{per:g.Lw*ch.Nch*2,qRef:q}); out.Nu=out.h*Dh/pr.k;
      out.dp=(martinPlate(Math.max(Re,20),pr.Pr,g.beta,1).xi)*(ch.L/Dh)*(pr.rho*v*v/2);
    }else{
      const M=martinPlate(Math.max(Re,20),pr.Pr,g.beta,muRatio);
      out.Nu=M.Nu; out.xi=M.xi; out.h=M.Nu*pr.k/Dh;
      out.dp=M.xi*(ch.L/Dh)*(pr.rho*v*v/2);
    }
    const Gp=m/(Math.PI/4*g.dport*g.dport);
    out.dpPort=1.5*ch.passes*Gp*Gp/(2*pr.rho);
    out.dp+=out.dpPort;
    out.area=g.A;
  }
  else if(type==="shell"){
    const tubeIsThis=(st.opts.tubeSide===which);
    if(tubeIsThis){
      const G=m/g.Ac_t, v=G/pr.rho, Re=G*g.di/pr.mu;
      out.G=G;out.v=v;out.Re=Re;out.Pr=pr.Pr;out.Dh=g.di;
      if(isPhase(side)){out.h=doPhase(g.di,G,g.L,
        {per:Math.PI*g.di*g.Nt,inTube:true,d:g.di,qRef:q*(g.Ao/g.Ai)});out.Nu=out.h*g.di/pr.k;
        out.dp=darcy(Math.max(Re,100),1.5e-6,g.di)*(g.L*g.np/g.di)*(pr.rho*v*v/2);}
      else if(st.opts.tubeCorr==="stender"&&side.fluid==="water"){
        out.h=stenderMerkel(v,g.di,Tm);out.Nu=out.h*g.di/pr.k;
        out.dp=(darcy(Re,1.5e-6,g.di)*(g.L*g.np/g.di)+4*g.np)*(pr.rho*v*v/2);
      }else{
        out.Nu=nuTube(Math.max(Re,10),pr.Pr,g.di,g.L,muRatio);out.h=out.Nu*pr.k/g.di;
        out.dp=(darcy(Math.max(Re,100),1.5e-6,g.di)*(g.L*g.np/g.di)+4*g.np)*(pr.rho*v*v/2);
      }
      out.area=g.Ai;
    }else{
      const Gs=m/g.As, v=Gs/pr.rho, Re=g.De*Gs/pr.mu;
      out.G=Gs;out.v=v;out.Re=Re;out.Pr=pr.Pr;out.Dh=g.De;
      if(isPhase(side)){
        const Nrow=Math.max(2,Math.round(Math.sqrt(g.Nt)*0.67));
        out.h=doPhase(g.do_,Gs,g.L,{per:Math.PI*g.do_*g.Nt,N:Nrow,d:g.do_,
                                    pool:(side.phase==="evap"),qRef:q});
        out.Nu=out.h*g.De/pr.k;
        out.dp=kernShell(Math.max(Re,10),pr.Pr,1).f*Gs*Gs*(g.Nb+1)*g.Ds/(2*pr.rho*g.De);
      }else if(st.opts.shellMethod==="bell"){
        const B=bellShell(g.do_*Gs/pr.mu,pr.Pr,g.cut,muRatio,g.layout);
        out.h=B.jTotal*pr.cp*Gs*Math.pow(pr.Pr,-2/3)*Math.pow(muRatio,0.14);
        out.Nu=out.h*g.De/pr.k;
        out.dp=B.f*Gs*Gs*(g.Nb+1)*g.Ds/(2*pr.rho*g.De);
      }else{
        const K=kernShell(Math.max(Re,10),pr.Pr,muRatio);
        out.Nu=K.Nu;out.h=K.Nu*pr.k/g.De;
        out.dp=K.f*Gs*Gs*(g.Nb+1)*g.Ds/(2*pr.rho*g.De)/Math.pow(muRatio,0.14);
      }
      out.area=g.Ao;
    }
  }
  else if(type==="dbl"){
    const innerIsThis=(st.opts.innerFluid===which);
    if(innerIsThis){
      const G=m/g.Ac_i,v=G/pr.rho,Re=G*g.di/pr.mu;
      out.G=G;out.v=v;out.Re=Re;out.Pr=pr.Pr;out.Dh=g.di;
      if(isPhase(side)){out.h=doPhase(g.di,G,g.L,{per:Math.PI*g.di,inTube:true,d:g.di,qRef:q*(g.do_/g.di)});}
      else out.h=nuTube(Math.max(Re,10),pr.Pr,g.di,g.L,muRatio)*pr.k/g.di;
      out.Nu=out.h*g.di/pr.k;
      out.dp=(darcy(Math.max(Re,100),1.5e-6,g.di)*(g.L/g.di)+2*g.n)*(pr.rho*v*v/2);
      out.area=Math.PI*g.di*g.L;
    }else{
      const G=m/g.Ac_a,v=G/pr.rho,Dh=g.Dh_a,Re=G*Dh/pr.mu;
      out.G=G;out.v=v;out.Re=Re;out.Pr=pr.Pr;out.Dh=Dh;
      const corr=0.86*Math.pow(g.Do/g.do_,0.16);   // Petukhov–Roizen, inner wall heated
      if(isPhase(side)){out.h=doPhase(Dh,G,g.L,{per:Math.PI*g.do_,d:g.do_,N:1,qRef:q});}
      else out.h=nuTube(Math.max(Re,10),pr.Pr,Dh,g.L,muRatio)*pr.k*corr/Dh;
      out.Nu=out.h*Dh/pr.k;
      out.dp=(darcy(Math.max(Re,100),1.5e-6,Dh)*(g.L/Dh)+2*g.n)*(pr.rho*v*v/2);
      out.area=g.A;
    }
  }
  else if(type==="air"){
    const isAir=(st.opts.airSide===which);
    if(isAir){
      const vface=st.geom.air.vface;
      const Vdot=vface*g.Af;                       // m3/s
      const vmax=vface*1.8;
      const d=(g.form.di+3)/1000;          // tube OD of the selected fin form
      const Re=pr.rho*vmax*d/pr.mu;
      out.v=vface;out.vmax=vmax;out.Re=Re;out.Pr=pr.Pr;out.Dh=d;
      out.Nu=nuBank(Re,pr.Pr);
      const hbare=0.8*out.Nu*pr.k/d;   // bare-bank Nu reduced for finned bundle
      out.eta=st.geom.air.eta||0.85;
      out.h=hbare;
      out.dp=g.rows*9.5*Math.pow(Math.max(vface,0.3)/1.5,1.75);
      out.area=g.Ae;out.Vdot=Vdot;
      side._m=pr.rho*Vdot;   // air mass flow from face velocity
    }else{
      const G=m/g.Ac_i,v=G/pr.rho,Re=G*g.di/pr.mu;
      out.G=G;out.v=v;out.Re=Re;out.Pr=pr.Pr;out.Dh=g.di;
      out.Nu=nuTube(Math.max(Re,10),pr.Pr,g.di,g.Ltube,muRatio);
      out.h=isPhase(side)?doPhase(g.di,G,g.Ltube,
        {per:Math.PI*g.di*g.circuits,inTube:true,d:g.di,qRef:q*(g.Ae/g.Ai)}):out.Nu*pr.k/g.di;
      out.dp=(darcy(Math.max(Re,100),1.5e-6,g.di)*(g.Ltube/g.di)+4)*(pr.rho*v*v/2);
      out.area=g.Ai;
    }
  }
  else if(type==="pulse"){
    const P=st.geom.pulse;
    const G=m/g.Ac, v=G/pr.rho, Re=Math.max(G*g.d/pr.mu,1);
    const om=2*Math.PI*P.freq;
    const alphaW=(g.d/2)*Math.sqrt(om/pr.nu);          // Womersley
    const dx=P.stroke/1000;                             // tidal displacement [m]
    const vosc0=dx*om/2;                 // peak oscillatory velocity
    const Reosc=vosc0*g.d/pr.nu;
    out.G=G;out.v=v;out.Re=Re;out.Pr=pr.Pr;out.Dh=g.d;
    out.alphaW=alphaW;out.Reosc=Reosc;
    const NuSteady=nuTube(Math.max(Re,10),pr.Pr,g.d,g.L,muRatio);
    const aTh=pr.k/(pr.rho*pr.cp);
    if(P.model==="kurzweg"){
      // tuned oscillatory transport: efficiency peaks near gamma = 1 and decays
      const gam=alphaW*Math.sqrt(pr.Pr)/3;
      const ftune=2*gam/(1+gam*gam);                    // 0..1, max at gam = 1
      out.tune=ftune;
      out.Deff=(dx*dx*om/8)*ftune;                      // [m2/s]
      out.enh=clamp(1+P.C*Math.pow(Math.max(out.Deff/Math.max(aTh,1e-9),0),0.25),1,12);
    }else{
      out.Deff=null;
      out.enh=clamp(1+P.C*Math.pow(dx/Math.max(g.d,1e-4),0.5)*Math.pow(alphaW,0.5)*0.25,1,8);
    }
    out.Nu=NuSteady*out.enh;
    out.h=isPhase(side)?doPhase(g.d,G,g.L,{per:Math.PI*g.d*g.n,inTube:true,d:g.d,qRef:q})*out.enh
                       :out.Nu*pr.k/g.d;
    const fD=darcy(Math.max(Re,100),1.5e-6,g.d);
    const vosc=vosc0;
    out.dp=fD*(g.L/g.d)*(pr.rho*v*v/2)+0.5*pr.rho*vosc*vosc*0.3;
    out.area=g.A;
  }
  out.regime=out.regime||(out.Re<2300?"lam":out.Re<1e4?"tra":"tur");
  return out;
}

/* ---- one full thermal pass at given geometry scale ---- */
function plateGeomOf(st){return st.type==="widegap"?st.geom.wide:st.geom.plate;}
function solveAt(st,scale){
  const g=(st.type==="plate"||st.type==="widegap")?geomPlate(plateGeomOf(st),scale)
        :st.type==="shell"?geomShell(st.geom.shell,scale)
        :st.type==="dbl"?geomDbl(st.geom.dbl,scale)
        :st.type==="air"?geomAir(st.geom.air,scale)
        :geomPulse(st.geom.pulse,scale);
  const H=JSON.parse(JSON.stringify(st.hot)), C=JSON.parse(JSON.stringify(st.cold));
  const thi=isPhase(H)?H.tsat:H.tin, tci=isPhase(C)?C.tsat:C.tin;
  let tho=thi-0.5*(thi-tci), tco=tci+0.5*(thi-tci);
  const kw=st.wall.k, Rw=wallR(st.type,g,kw,st.wall.thk);
  let res={};
  let Q=0,U=0,dTm=Math.abs(thi-tci)/2,hh,hc,prh,prc,Ch,Cc,Cmin,Cr,NTU,eps;
  for(let it=0;it<40;it++){
    const TmH=isPhase(H)?H.tsat:(thi+tho)/2, TmC=isPhase(C)?C.tsat:(tci+tco)/2;
    prh=propsX(H,TmH); prc=propsX(C,TmC);
    H._m=massFlow(H,TmH); C._m=massFlow(C,TmC);
    const q=Math.max(U*dTm,200);
    const Rt0=(res.Rh||1e-3)+(res.Rc||1e-3)+(res.Rw||1e-5);
    const fH=clamp((res.Rh||1e-3)/Rt0,0.05,0.95), fC=clamp((res.Rc||1e-3)/Rt0,0.05,0.95);
    const TwH=TmH-(TmH-TmC)*fH, TwC=TmC+(TmH-TmC)*fC;
    hh=sideCalc(st,g,"h",H,prh,TmH,TwH,q,dTm);
    hc=sideCalc(st,g,"c",C,prc,TmC,TwC,q,dTm);
    H._hprev=hh.h; C._hprev=hc.h;
    if(st.type==="air"){ if(st.opts.airSide==="h")H._m=H._m; }
    // reference area & U
    let Aref,Rh,Rc;
    const Rfh=H.foulVal, Rfc=C.foulVal;
    if(st.type==="shell"){Aref=g.Ao;
      const tubeHot=(st.opts.tubeSide==="h");
      const rin=(tubeHot?(1/hh.h+Rfh):(1/hc.h+Rfc))*(g.Ao/g.Ai);
      const rout=(tubeHot?(1/hc.h+Rfc):(1/hh.h+Rfh));
      U=1/(rin+rout+Rw);
      Rh=tubeHot?rin:rout; Rc=tubeHot?rout:rin;
    }else if(st.type==="air"){Aref=g.Ae;
      const airHot=(st.opts.airSide==="h");
      const eta=(airHot?hh.eta:hc.eta)||0.85;
      const rair=airHot?(1/(hh.h*eta)+Rfh):(1/(hc.h*eta)+Rfc);
      const rliq=(airHot?(1/hc.h+Rfc):(1/hh.h+Rfh))*(g.Ae/g.Ai);
      U=1/(rair+rliq+Rw*(g.Ae/g.Ai));
      Rh=airHot?rair:rliq; Rc=airHot?rliq:rair;
    }else if(st.type==="dbl"){Aref=g.A;
      const innerHot=(st.opts.innerFluid==="h");
      const rin=(innerHot?(1/hh.h+Rfh):(1/hc.h+Rfc))*(g.do_/g.di);
      const rout=(innerHot?(1/hc.h+Rfc):(1/hh.h+Rfh));
      U=1/(rin+rout+Rw); Rh=innerHot?rin:rout; Rc=innerHot?rout:rin;
    }else{Aref=g.A;
      Rh=1/hh.h+Rfh; Rc=1/hc.h+Rfc; U=1/(Rh+Rc+Rw);
    }
    res.Rh=Rh;res.Rc=Rc;res.Rw=Rw;res.Aref=Aref;
    // capacity rates
    Ch=isPhase(H)?Infinity:H._m*prh.cp;
    Cc=isPhase(C)?Infinity:C._m*prc.cp;
    if(!isFinite(Ch)&&!isFinite(Cc)){Ch=1e9;Cc=1e9;}
    Cmin=Math.min(Ch,Cc); const Cmax=Math.max(Ch,Cc);
    Cr=isFinite(Cmax)&&Cmax>0?clamp(Cmin/Cmax,0,1):0;
    if(!isFinite(Cmin))Cmin=1e9;
    NTU=U*Aref/Cmin;
    const arr=(isPhase(H)||isPhase(C))?"counter":st.arr;
    eps=effNTU(arr,NTU,Cr);
    let Qn=eps*Cmin*(thi-tci);
    // latent capacity limits
    let cap=Infinity;
    if(isPhase(H)){const s=satOf(H);cap=Math.min(cap,H._m*s.hfg*Math.abs((H.xin??1)-(H.xout??0)));}
    if(isPhase(C)){const s=satOf(C);cap=Math.min(cap,C._m*s.hfg*Math.abs((C.xout??1)-(C.xin??0)));}
    res.capLimited=Qn>cap; Qn=Math.min(Qn,cap);
    Q=Q*0.4+Qn*0.6;
    const thoN=isPhase(H)?H.tsat:thi-Q/Ch;
    const tcoN=isPhase(C)?C.tsat:tci+Q/Cc;
    tho=tho*0.4+thoN*0.6; tco=tco*0.4+tcoN*0.6;
    const dt1=thi-tco, dt2=tho-tci;
    dTm=lmtd(dt1,dt2);
  }
  /* ε and F must describe the duty that is actually reported. When the duty is
     cut back to the latent capacity of the phase-change side, Q is no longer
     ε(NTU,C*)·C_min·Δt_max, so ε is re-derived from its definition and F from
     the design equation — otherwise the KPI panel would state a duty that its
     own U·A·F·LMTD contradicts. */
  const dTmax=thi-tci;
  if(res.capLimited&&Cmin>0&&Math.abs(dTmax)>1e-9)
    eps=clamp(Q/(Cmin*dTmax),0,1);
  /* F is defined from the counter-flow LMTD and must reproduce Q = U·A·F·LMTD.
     The duty-derived value is the robust one and is what is reported; where the
     arrangement's own F (Bowman/TEMA for shell-and-tube, the ε–NTU inversion
     otherwise, see fCorr) is well determined and agrees with it, that textbook
     value is used instead. NO lower clamp: a genuinely low F is a real result. */
  let Fx=clamp(Q/Math.max(U*res.Aref*dTm,1e-9),0,1);
  if(!res.capLimited){
    if(st.arr==="counter"||isPhase(H)||isPhase(C))Fx=1;
    else{
      const Fa=fCorr(st.arr,thi,tho,tci,tco);
      if(isFinite(Fa)&&Fa>0&&Math.abs(Fa-Fx)<=1e-4*Fx)Fx=Fa;
    }
  }
  if(!isFinite(Fx)||Fx<=0)Fx=1;
  return {g,Q,U,NTU,eps,Cr,Cmin,dTm,F:Fx,tho,tco,thi,tci,hh,hc,prh,prc,
          Ch,Cc,H,C,Rh:res.Rh,Rc:res.Rc,Rw:res.Rw,Aref:res.Aref,capLimited:res.capLimited};
}

/* ---- scale variable bounds per type ---- */
function scaleInfo(st){
  switch(st.type){
   case "plate": case "widegap": return {get:()=>plateGeomOf(st).Np,lo:3,hi:900,key:"Np"};
   case "shell": return {get:()=>st.geom.shell.L,lo:0.3,hi:30,key:"L"};
   case "dbl":   return {get:()=>st.geom.dbl.nHair,lo:1,hi:200,key:"nHair"};
   case "air":   return {get:()=>st.geom.air.rows,lo:1,hi:24,key:"rows"};
   default:      return {get:()=>st.geom.pulse.Lch,lo:0.05,hi:20,key:"Lch"};
  }
}
/* ---- required duty for sizing ---- */
function requiredDuty(st){
  const H=st.hot,C=st.cold;
  const TmH=isPhase(H)?H.tsat:(H.tin+(H.tout_req??H.tin-10))/2;
  const TmC=isPhase(C)?C.tsat:(C.tin+(C.tout_req??C.tin+10))/2;
  const ph=propsX(H,TmH),pc=propsX(C,TmC);
  const mh=massFlow(H,TmH),mc=massFlow(C,TmC);
  if(st.spec==="duty")return st.duty;
  if(st.spec==="hot"){
    if(isPhase(H)){const s=satOf(H);return mh*s.hfg*Math.abs((H.xin??1)-(H.xout??0));}
    return mh*ph.cp*(H.tin-H.tout_req);
  }
  if(isPhase(C)){const s=satOf(C);return mc*s.hfg*Math.abs((C.xout??1)-(C.xin??0));}
  return mc*pc.cp*(C.tout_req-C.tin);
}
/* ---- input validation ---- */
function validate(st){
  const E=[];
  [["hot",st.hot],["cold",st.cold]].forEach(([k,sd])=>{
    const fw=sd.flowMode==="v"?sd.V:sd.m;
    if(!(fw>0))E.push(["e","e_flow"]);
    if(isPhase(sd)){
      if(Math.abs((sd.xout??1)-(sd.xin??0))<0.01)E.push(["e","e_x"]);
      const [t0,t1]=satRange(sd.satFluid||"water");
      if(sd.tsat<t0-0.01||sd.tsat>t1+0.01)E.push(["e","e_tsat"]);
    }else{
      const fl=getFluid(sd.fluid);
      if(sd.tin<fl.tmin-2||sd.tin>fl.tmax+2)E.push(["w","w_range"]);
      if(!(sd.p>0))E.push(["e","e_press"]);
    }
  });
  const thi=isPhase(st.hot)?st.hot.tsat:st.hot.tin,
        tci=isPhase(st.cold)?st.cold.tsat:st.cold.tin;
  if(thi-tci<0.5)E.push(["e","e_dt"]);
  const g=st.geom;
  if(st.type==="shell"){
    if(2*g.shell.tthk>=0.85*g.shell.do)E.push(["e","e_geom"]);
    if(!(g.shell.B>0)||!(g.shell.Nt>0)||!(g.shell.L>0))E.push(["e","e_geom"]);
    if(g.shell.Pt<=g.shell.do)E.push(["e","e_geom"]);
    if(g.shell.Ds<=g.shell.do*2)E.push(["e","e_geom"]);
  }
  if(st.type==="dbl"){
    if(g.dbl.diOut<=g.dbl.doIn)E.push(["e","e_geom"]);
    if(g.dbl.diIn>=g.dbl.doIn||!(g.dbl.diIn>0))E.push(["e","e_geom"]);
    if(!(g.dbl.nHair>0)||!(g.dbl.Lhair>0))E.push(["e","e_geom"]);
  }
  if(st.type==="plate"||st.type==="widegap"){
    const pg=plateGeomOf(st);
    if(!(pg.Np>=3)||!(pg.b>0.2)||!(pg.Lw>20)||!(pg.Lp>50))E.push(["e","e_geom"]);
    if(!(pg.dport>5))E.push(["e","e_geom"]);
  }
  if(st.type==="air"&&(!(g.air.vface>0)||!(g.air.rows>0)||!(g.air.W>0)||!(g.air.H>0)))E.push(["e","e_geom"]);
  if(st.type==="pulse"&&(!(g.pulse.nch>0)||!(g.pulse.dch>0)||!(g.pulse.Lch>0)))E.push(["e","e_geom"]);
  return E;
}
/* ---- main entry ---- */
function compute(st){
  // resolve fouling values
  st.hot.foulVal=st.hot.foul==="custom"?st.hot.foulC:(FOULING.find(f=>f[0]===st.hot.foul)||[,,0])[2];
  st.cold.foulVal=st.cold.foul==="custom"?st.cold.foulC:(FOULING.find(f=>f[0]===st.cold.foul)||[,,0])[2];
  const msgs=[];
  const errs=validate(st);
  let r,sizing=null;
  if(errs.some(e=>e[0]==="e")){
    r=solveAt(st,null);            // clamped geometry keeps the numbers finite
    r.msgs=errs; r.st=st; r.invalid=true;
    return r;
  }
  msgs.push(...errs);
  if(st.mode==="sizing"){
    const Qreq=requiredDuty(st);
    const si=scaleInfo(st);
    let lo=si.lo,hi=si.hi;
    const f=s=>solveAt(st,s).Q-Qreq;
    let sol,fail=null;
    if(!isFinite(Qreq)||Qreq<=0){sol=lo;fail=["e","w_size_neg"];}
    else{
      const flo=f(lo),fhi=f(hi);
      if(flo>0){sol=lo;fail=["w","w_size_min"];}
      else if(fhi<0){sol=hi;fail=["e","w_size_max"];}
      else{for(let i=0;i<60;i++){const m=(lo+hi)/2;(f(m)<0?lo=m:hi=m);}sol=(lo+hi)/2;}
    }
    if(fail)msgs.push(fail);
    const margin=1+(st.margin||0)/100;
    let solM=(st.type==="shell"||st.type==="pulse")?sol*margin:Math.ceil(sol*margin);
    if(si.key==="Np"&&solM%2===0)solM+=1;              // plate packs have an odd plate count
    const rBase=solveAt(st,sol);
    r=solveAt(st,solM);                                 // report the SELECTED size
    sizing={Qreq,scale:sol,scaleMargin:solM,key:si.key,area:rBase.Aref,
            areaMargin:r.Aref,Qsel:r.Q,ok:!fail};
    r.sizing=sizing;
  }else{
    r=solveAt(st,null);
  }
  /* ---- warnings ---- */
  const vlim=(side,o)=>{
    if(isPhase(side)){
      if(o&&isFinite(o.v)&&o.v>25)msgs.push(["w","w_vel_2ph"]);
      return;
    }
    const gasy=getFluid(side.fluid).cat==="gas";
    if(!o||!isFinite(o.v))return;
    if(!gasy&&o.v<0.25)msgs.push(["w","w_vel_lo"]);
    if(!gasy&&o.v>4.5)msgs.push(["w","w_vel_hi"]);
    if(gasy&&o.v>30)msgs.push(["w","w_vel_hi"]);
  };
  vlim(st.hot,r.hh);vlim(st.cold,r.hc);
  if(r.hh.dp>1e5||r.hc.dp>1e5)msgs.push(["w","w_dp_hi"]);
  const lamLim=(st.type==="plate"||st.type==="widegap")?15:2300;
  if((r.hh.Re<lamLim&&!isPhase(st.hot))||(r.hc.Re<lamLim&&!isPhase(st.cold)))msgs.push(["w","w_lam"]);
  if(r.prh.outOfRange||r.prc.outOfRange)msgs.push(["w","w_range"]);
  if(st.type==="widegap")msgs.push(["i","w_wide"]);
  if(st.type==="pulse")msgs.push(["i","w_pulse"]);
  if(r.tho<r.tci-0.01&&st.arr==="parallel")msgs.push(["e","w_dtcross"]);
  if(r.capLimited)msgs.push(["w","w_cap"]);
  if(!r.capLimited&&isFinite(r.F)&&r.F<0.75&&st.arr!=="counter"&&!isPhase(st.hot)&&!isPhase(st.cold))
    msgs.push(["w","w_lowf"]);
  const seen={};const uniq=msgs.filter(m=>{const k=m[0]+m[1];if(seen[k])return false;seen[k]=1;return true;});
  msgs.length=0;msgs.push(...uniq);
  const bad=[r.Q,r.U,r.Aref,r.tho,r.tco,r.dTm,r.hh.h,r.hc.h].some(v=>!isFinite(v));
  if(bad){msgs.unshift(["e","w_nan"]);r.invalid=true;}
  else if(msgs.filter(m=>m[0]!=="i"&&m[0]!=="ok").length===0)
    msgs.unshift(["ok",st.mode==="sizing"?"w_sizing_ok":"w_ok"]);
  r.msgs=msgs;
  r.st=st;
  return r;
}
/* ======================= UNIT PATCHES ======================= */
U.mm={si:["мм",1,0],us:["in",0.0393701,0]};
U.mtr={si:["м",1,0],us:["ft",3.28084,0]};
U.vflow={si:["м³/ч",1,0],us:["GPM",4.40287,0]};
U.deg={si:["°",1,0],us:["°",1,0]};
U.pct={si:["%",1,0],us:["%",1,0]};

let RPT={w:0};
/* ======================= STATE ======================= */
let ST={
 mode:"rating", type:"plate", arr:"counter", orient:"vert", spec:"cold", duty:150000, margin:10,
 hot:{fluid:"water",conc:35,flowMode:"m",m:2.0,V:7.2,tin:80,tout_req:55,p:400000,
      phase:"none",satFluid:"water",tsat:100,xin:1,xout:0,foul:"treated",foulC:0.00005},
 cold:{fluid:"water",conc:35,flowMode:"m",m:2.0,V:7.2,tin:15,tout_req:55,p:400000,
      phase:"none",satFluid:"water",tsat:5,xin:0.15,xout:1,foul:"city",foulC:0.00005},
 wall:{mat:"ss316",k:14.5,thk:0.5},
 opts:{tubeSide:"c",shellMethod:"kern",tubeCorr:"gniel",innerFluid:"h",airSide:"c"},
 geom:{

const $=(s,r)=>(r||document).querySelector(s);
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;

function gp(o,p){return p.split(".").reduce((a,k)=>a&&a[k],o);}
function sp(o,p,v){const k=p.split(".");let t=o;for(let i=0;i<k.length-1;i++)t=t[k[i]];t[k[k.length-1]]=v;}
function fmt(v,d){if(!isFinite(v))return "—";
  const a=Math.abs(v);d=d??(a>=1000?0:a>=100?1:a>=10?2:a>=1?2:3);
  return v.toLocaleString(LANG==="en"?"en-US":"ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d});}
function G(){return ST.type==="widegap"?ST.geom.wide:ST.geom[ST.type==="plate"?"plate":ST.type];}
function fmtIn(v,dec){                       // locale-independent value for <input type=number>
  if(!isFinite(v))return "";
  const d=dec===undefined?(Math.abs(v)>=100?1:Math.abs(v)>=1?3:5):dec;
  return String(parseFloat(v.toFixed(Math.min(d,6))));
}
function deepMerge(dst,src){
  for(const k in src){const v=src[k];
    if(v&&typeof v==="object"&&!Array.isArray(v)&&dst[k]&&typeof dst[k]==="object")deepMerge(dst[k],v);
    else if(v!==undefined&&v!==null&&typeof v!=="object")dst[k]=v;}
  return dst;
}
function sanitize(){                         // repair any impossible state combination
  if(!["plate","widegap","shell","dbl","air","pulse"].includes(ST.type))ST.type="plate";
  if(!["rating","sizing"].includes(ST.mode))ST.mode="rating";
  if(ST.type!=="shell"&&(ST.arr==="st12"||ST.arr==="st24"))ST.arr="counter";
  if(!["counter","parallel","cross","crossmix","st12","st24"].includes(ST.arr))ST.arr="counter";
  if(!["vert","horiz"].includes(ST.orient))ST.orient="vert";
  ["hot","cold"].forEach(k=>{const s=ST[k];
    if(!getFluid(s.fluid))s.fluid="water";
    if(!SAT[s.satFluid])s.satFluid="water";
    if(!["none","evap","cond"].includes(s.phase))s.phase="none";
    const [t0,t1]=satRange(s.satFluid);
    if(!(s.tsat>=t0&&s.tsat<=t1))s.tsat=clamp(s.tsat||0,t0,t1);
    if(!FOULING.some(f=>f[0]===s.foul))s.foul="clean";
    if(getFluid(s.fluid).cat==="gas"&&s.p>2.5e5)s.p=101325;
    s.xin=clamp(s.xin??0,0,1);s.xout=clamp(s.xout??1,0,1);
  });
  if(!MATS.some(m=>m.id===ST.wall.mat))ST.wall.mat="ss316";
  ST.margin=clamp(ST.margin||0,0,200);
}
/* ======================= FIELD FACTORIES =======================
   The permalink contract is the SHAPE OF ST and it may not change, so nothing
   about storage moves: ST keeps °C, mm, m, Pa, kg/s exactly where it kept them
   before the port.  ST is therefore not pure SI in the framework's sense and
   the shared unit registry is not used for storage; get()/set() convert through
   this tool's own SI|US table, which carries fourteen dimensions the shared
   registry does not have (W/m²K, m²K/W, kJ/kgK, mPa·s, BTU/h·ft²·F …).  The
   page-level SI|US control in the header drives that table (see boot()).
   `display` is a getter, so a language or unit change picks the new unit label
   up when the framework rebuilds the fields.                                  */
function fid(path){return "f-"+String(path).replace(/[^A-Za-z0-9]+/g,"-");}
function withUnit(d,dim){
  if(dim==="none")return d;
  d.unit="hx/"+dim;
  Object.defineProperty(d,"display",{get:function(){return uname(dim);},enumerable:true});
  return d;
}
/* number field bound to a state path, converted through U[dim] */
function nF(labelKey,path,dim,step,extra){
  const d={id:fid(path),key:path,type:"number",step:step||"any",
    label:()=>t(labelKey),
    get:s=>toU(gp(s,path),dim),
    /* an empty or half-typed box must leave the stored value alone — the old
       page did the same with `if(isFinite(v))` and the parity harness relies on it */
    set:(v,s)=>{if(v==null||!isFinite(v))return;sp(s,path,frU(v,dim));}};
  if(extra)for(const k in extra)d[k]=extra[k];
  return withUnit(d,dim);
}
/* select bound to a state path; `re` re-runs sanitize() the way the old
   fSel/fSeg handlers did, so an impossible combination is repaired before the
   fields re-sync rather than one debounce later */
function sF(labelKey,path,options,extra){
  const d={id:fid(path),key:path,type:"select",options:options,label:()=>t(labelKey),
    get:s=>gp(s,path),set:(v,s)=>{sp(s,path,v);sanitize();}};
  if(extra)for(const k in extra)d[k]=extra[k];
  return d;
}
function segF(labelKey,path,options,extra){
  const d={id:fid(path),key:path,type:"segmented",options:options,label:()=>t(labelKey),
    get:s=>gp(s,path),set:(v,s)=>{sp(s,path,v);sanitize();}};
  if(extra)for(const k in extra)d[k]=extra[k];
  return d;
}

const satOpts=()=>Object.keys(SAT).map(k=>[k,SAT[k].n[LI[LANG]]]);
const matOpts=()=>MATS.map(m=>[m.id,m.n[LI[LANG]]]);
const foulOpts=()=>FOULING.map(f=>[f[0],f[1][LI[LANG]]+(f[2]?` (${f[2].toExponential(1)})`:"")]);
const sideOpts=()=>[["h",t("side_hot")],["c",t("side_cold")]];
const arrOpts=()=>{

           ["crossmix",t("a_crossmix")]];

};
