    n: ['Living room 30 m³, LA,day 65 dB, class C → DAtr ≥ 31 dB. Annex A asks every element RAtr ≥ 31 + 3 + 10 lg[3(4 + 5)/30] = 33,5 dB and the vent Dn,e,Atr ≥ 36,5 dB: the window RAtr 33 fails the quick rule. The detailed EN ISO 12354-3 sum gives 34,2 dB, a 3,2 dB margin. The quick rule is the safer (stricter) one — use it to set element minima, and the detailed calculation to check a real façade.', 'Вітальня 30 м³, LA,day 65 дБ, клас C → DAtr ≥ 31 дБ. Додаток A вимагає від кожного елемента RAtr ≥ 31 + 3 + 10 lg[3(4 + 5)/30] = 33,5 дБ, а від провітрювача Dn,e,Atr ≥ 36,5 дБ: вікно RAtr 33 не проходить спрощене правило. Детальна сума EN ISO 12354-3 дає 34,2 дБ, запас 3,2 дБ. Спрощене правило безпечніше (суворіше) — ним задають мінімуми елементів, а детальним розрахунком перевіряють реальний фасад.', 'Wohnzimmer 30 m³, LA,day 65 dB, Klasse C → DAtr ≥ 31 dB. Anhang A verlangt von jedem Bauteil RAtr ≥ 31 + 3 + 10 lg[3(4 + 5)/30] = 33,5 dB und vom Lüfter Dn,e,Atr ≥ 36,5 dB: das Fenster RAtr 33 fällt durch die Faustregel. Die genaue Summe nach EN ISO 12354-3 ergibt 34,2 dB, 3,2 dB Reserve. Die Faustregel ist die sicherere (strengere) — mit ihr Mindestwerte festlegen, mit der genauen Rechnung eine reale Fassade prüfen.', 'Woonkamer 30 m³, LA,day 65 dB, klasse C → DAtr ≥ 31 dB. Bijlage A vraagt van elk element RAtr ≥ 31 + 3 + 10 lg[3(4 + 5)/30] = 33,5 dB en van het rooster Dn,e,Atr ≥ 36,5 dB: het raam RAtr 33 faalt op de vuistregel. De gedetailleerde som volgens EN ISO 12354-3 geeft 34,2 dB, 3,2 dB marge. De vuistregel is de veiligere (strengere) — gebruik hem voor minima per element, en de gedetailleerde berekening om een echte gevel te toetsen.', 'Séjour de 30 m³, LA,day 65 dB, classe C → DAtr ≥ 31 dB. L’annexe A demande à chaque élément RAtr ≥ 31 + 3 + 10 lg[3(4 + 5)/30] = 33,5 dB et à la grille Dn,e,Atr ≥ 36,5 dB : la fenêtre RAtr 33 échoue à la règle simplifiée. La somme détaillée de l’EN ISO 12354-3 donne 34,2 dB, soit 3,2 dB de marge. La règle simplifiée est la plus sûre (plus sévère) — elle fixe les minima des éléments, le calcul détaillé vérifie une façade réelle.', 'Salón de 30 m³, LA,day 65 dB, clase C → DAtr ≥ 31 dB. El anexo A pide a cada elemento RAtr ≥ 31 + 3 + 10 lg[3(4 + 5)/30] = 33,5 dB y al aireador Dn,e,Atr ≥ 36,5 dB: la ventana RAtr 33 no cumple la regla simplificada. La suma detallada de EN ISO 12354-3 da 34,2 dB, 3,2 dB de margen. La regla simplificada es la más segura (más estricta) — úsela para fijar mínimos y el cálculo detallado para comprobar una fachada real.', 'Pokój dzienny 30 m³, LA,day 65 dB, klasa C → DAtr ≥ 31 dB. Załącznik A wymaga od każdego elementu RAtr ≥ 31 + 3 + 10 lg[3(4 + 5)/30] = 33,5 dB, a od nawiewnika Dn,e,Atr ≥ 36,5 dB: okno RAtr 33 nie spełnia reguły. Dokładna suma wg EN ISO 12354-3 daje 34,2 dB, zapas 3,2 dB. Reguła uproszczona jest bezpieczniejsza (surowsza) — nią ustala się minima elementów, a dokładnym obliczeniem sprawdza rzeczywistą fasadę.'] },
  { id: 'balcony', g: 'shape', s: Object.assign({}, LIV, { LAday: 70, shMode: 'table', shape: 'balcony6', los: 'high', shAlpha: 0.9 }),
    l: ['Balcony above with an absorbent soffit', 'Балкон зверху з поглинальною стелею', 'Balkon darüber mit absorbierender Untersicht', 'Balkon erboven met absorberende onderzijde', 'Balcon au-dessus avec sous-face absorbante', 'Balcón encima con intradós absorbente', 'Balkon powyżej z chłonnym spodem'],
    n: ['LA,day 70 dB → DAtr ≥ 36 dB. Under an open balcony (Table C.1 shape 6, line of sight > 2,5 m) ΔLfs is + 1 dB with a hard soffit (αw ≤ 0,3) and + 3 dB with an absorbent one (αw ≥ 0,9): D2m,nT,Atr 37,2 instead of 35,2 dB — the façade passes without changing the glazing.', 'LA,day 70 дБ → DAtr ≥ 36 дБ. Під відкритим балконом (табл. C.1, форма 6, лінія видимості > 2,5 м) ΔLfs = + 1 дБ за твердої стелі (αw ≤ 0,3) і + 3 дБ за поглинальної (αw ≥ 0,9): D2m,nT,Atr 37,2 замість 35,2 дБ — фасад проходить без зміни скла.', 'LA,day 70 dB → DAtr ≥ 36 dB. Unter einem offenen Balkon (Tabelle C.1 Form 6, Sichtlinie > 2,5 m) ist ΔLfs + 1 dB bei harter Untersicht (αw ≤ 0,3) und + 3 dB bei absorbierender (αw ≥ 0,9): D2m,nT,Atr 37,2 statt 35,2 dB — die Fassade besteht ohne andere Verglasung.', 'LA,day 70 dB → DAtr ≥ 36 dB. Onder een open balkon (tabel C.1 vorm 6, zichtlijn > 2,5 m) is ΔLfs + 1 dB met een harde onderzijde (αw ≤ 0,3) en + 3 dB met een absorberende (αw ≥ 0,9): D2m,nT,Atr 37,2 in plaats van 35,2 dB — de gevel haalt het zonder ander glas.', 'LA,day 70 dB → DAtr ≥ 36 dB. Sous un balcon ouvert (tableau C.1 forme 6, ligne de vue > 2,5 m), ΔLfs vaut + 1 dB avec une sous-face dure (αw ≤ 0,3) et + 3 dB avec une sous-face absorbante (αw ≥ 0,9) : D2m,nT,Atr 37,2 au lieu de 35,2 dB — la façade passe sans changer le vitrage.', 'LA,day 70 dB → DAtr ≥ 36 dB. Bajo un balcón abierto (tabla C.1 forma 6, línea de visión > 2,5 m) ΔLfs es + 1 dB con intradós duro (αw ≤ 0,3) y + 3 dB con uno absorbente (αw ≥ 0,9): D2m,nT,Atr 37,2 en vez de 35,2 dB — la fachada cumple sin cambiar el vidrio.', 'LA,day 70 dB → DAtr ≥ 36 dB. Pod otwartym balkonem (tablica C.1 kształt 6, linia widzenia > 2,5 m) ΔLfs wynosi + 1 dB przy twardym spodzie (αw ≤ 0,3) i + 3 dB przy chłonnym (αw ≥ 0,9): D2m,nT,Atr 37,2 zamiast 35,2 dB — fasada spełnia bez zmiany szyb.'] },
  { id: 'map', g: 'road', s: Object.assign({}, LIV, { method: 'map', src: 'road', mapKind: 'lden', Lden: 68, Lnight: 0 }),
    l: ['Noise map Lden 68 dB → façade level', 'Шумова карта Lden 68 дБ → рівень фасаду', 'Lärmkarte Lden 68 dB → Fassadenpegel', 'Geluidskaart Lden 68 dB → gevelniveau', 'Carte de bruit Lden 68 dB → niveau de façade', 'Mapa de ruido Lden 68 dB → nivel de fachada', 'Mapa hałasu Lden 68 dB → poziom na fasadzie'],
    n: ['Road traffic, Lden 68 dB on the map → LA,day = Lden − 1 + 3 = 70 dB on the pane (Annex D.5): the map value is not the façade value. A class C living room then needs DAtr ≥ 36 dB, not the 34 dB the raw map number suggests; the same façade (34,2 dB) fails by 1,8 dB.', 'Дорожній рух, Lden 68 дБ на карті → LA,day = Lden − 1 + 3 = 70 дБ на ділянці (D.5): значення карти — не значення фасаду. Вітальні класу C тоді потрібно DAtr ≥ 36 дБ, а не 34 дБ, як підказує сире число карти; той самий фасад (34,2 дБ) не проходить на 1,8 дБ.', 'Straßenverkehr, Lden 68 dB in der Karte → LA,day = Lden − 1 + 3 = 70 dB an der Fläche (D.5): der Kartenwert ist nicht der Fassadenwert. Ein Wohnzimmer der Klasse C braucht dann DAtr ≥ 36 dB, nicht 34 dB wie die rohe Kartenzahl nahelegt; dieselbe Fassade (34,2 dB) verfehlt um 1,8 dB.', 'Wegverkeer, Lden 68 dB op de kaart → LA,day = Lden − 1 + 3 = 70 dB op het vlak (D.5): de kaartwaarde is niet de gevelwaarde. Een woonkamer klasse C vraagt dan DAtr ≥ 36 dB, niet de 34 dB die het ruwe kaartgetal suggereert; dezelfde gevel (34,2 dB) faalt met 1,8 dB.', 'Trafic routier, Lden 68 dB sur la carte → LA,day = Lden − 1 + 3 = 70 dB sur le pan (D.5) : la valeur de la carte n’est pas celle de la façade. Un séjour de classe C demande alors DAtr ≥ 36 dB, pas les 34 dB que suggère le chiffre brut ; la même façade (34,2 dB) échoue de 1,8 dB.', 'Tráfico rodado, Lden 68 dB en el mapa → LA,day = Lden − 1 + 3 = 70 dB en el paño (D.5): el valor del mapa no es el de la fachada. Un salón de clase C necesita entonces DAtr ≥ 36 dB, no los 34 dB que sugiere la cifra bruta; la misma fachada (34,2 dB) falla por 1,8 dB.', 'Ruch drogowy, Lden 68 dB na mapie → LA,day = Lden − 1 + 3 = 70 dB na fragmencie (D.5): wartość z mapy to nie wartość na fasadzie. Pokój dzienny klasy C potrzebuje wtedy DAtr ≥ 36 dB, a nie 34 dB, jak sugeruje surowa liczba; ta sama fasada (34,2 dB) nie spełnia o 1,8 dB.'] },
  { id: 'rail', g: 'road', s: Object.assign({}, BED4, { method: 'direct', LAday: 60, LAnight: 55, LAmax: 75 }, EL(3, 'vent', true, 0, 0, 1, 38)),
    l: ['Bedroom near a railway: night pass-bys', 'Спальня біля залізниці: нічні проїзди', 'Schlafzimmer an der Bahn: nächtliche Vorbeifahrten', 'Slaapkamer bij het spoor: nachtelijke passages', 'Chambre près d’une voie ferrée : passages nocturnes', 'Dormitorio junto al ferrocarril: pasos nocturnos', 'Sypialnia przy kolei: nocne przejazdy'],
    n: ['LA,day 60 and LA,night 55 dB would ask only 28 dB (26 / 27 dB by the offsets, floor 28), but trains passing at night with LAmax,3x,night 75 dB ≥ 70 dB raise a bedroom to DAtr ≥ 34 dB (Tab. 3 note c). With an acoustic vent Dn,e,Atr 38 the pane gives 38,8 dB and passes.', 'LA,day 60 і LA,night 55 дБ вимагали б лише 28 дБ (26 / 27 дБ за відступами, мінімум 28), але нічні потяги з LAmax,3x,night 75 дБ ≥ 70 дБ піднімають вимогу до спальні до DAtr ≥ 34 дБ (табл. 3, прим. c). З акустичним провітрювачем Dn,e,Atr 38 ділянка дає 38,8 дБ і проходить.', 'LA,day 60 und LA,night 55 dB verlangten nur 28 dB (26 / 27 dB nach Abzug, Mindestwert 28), doch nächtliche Züge mit LAmax,3x,night 75 dB ≥ 70 dB heben ein Schlafzimmer auf DAtr ≥ 34 dB (Tab. 3 Anm. c). Mit einem Schalldämmlüfter Dn,e,Atr 38 ergibt die Fläche 38,8 dB und besteht.', 'LA,day 60 en LA,night 55 dB zouden maar 28 dB vragen (26 / 27 dB na aftrek, minimum 28), maar nachtelijke treinen met LAmax,3x,night 75 dB ≥ 70 dB brengen een slaapkamer op DAtr ≥ 34 dB (tab. 3 noot c). Met een akoestisch rooster Dn,e,Atr 38 geeft het vlak 38,8 dB en haalt het.', 'LA,day 60 et LA,night 55 dB ne demanderaient que 28 dB (26 / 27 dB par les écarts, plancher 28), mais des trains la nuit avec LAmax,3x,night 75 dB ≥ 70 dB portent une chambre à DAtr ≥ 34 dB (tab. 3 note c). Avec une grille acoustique Dn,e,Atr 38, le pan donne 38,8 dB et passe.', 'LA,day 60 y LA,night 55 dB pedirían solo 28 dB (26 / 27 dB por las diferencias, mínimo 28), pero los trenes nocturnos con LAmax,3x,night 75 dB ≥ 70 dB elevan un dormitorio a DAtr ≥ 34 dB (tab. 3 nota c). Con un aireador acústico Dn,e,Atr 38 el paño da 38,8 dB y cumple.', 'LA,day 60 i LA,night 55 dB wymagałyby tylko 28 dB (26 / 27 dB po odjęciu, minimum 28), ale nocne pociągi z LAmax,3x,night 75 dB ≥ 70 dB podnoszą wymaganie dla sypialni do DAtr ≥ 34 dB (tab. 3 uw. c). Z nawiewnikiem akustycznym Dn,e,Atr 38 fragment daje 38,8 dB i spełnia.'] },
  { id: 'g1', g: 'norm', s: Object.assign({}, DEFAULTS, { method: 'direct', LAday: 60, LAnight: 0, use: 'living', cls: 'C', V: 50, S: 11.3, LAmax: 0, second: false, gallery: false, shMode: 'table', shape: 'plane', los: 'high' },
      EL(1, 'wall', true, 6, 51, 1, 34), EL(2, 'window', true, 4.5, 29, 1, 34), EL(3, 'window', true, 0.5, 30, 1, 34), EL(4, 'vent', true, 0, 0, 1, 29), EL(5, 'shutter_box', false, 0, 0, 1, 40), EL(6, 'door', false, 2, 30, 1, 34)),
    l: ['Norm example: brick façade with two windows and a vent (EN ISO 12354-3 G.1)', 'Приклад норми: цегляний фасад із двома вікнами і провітрювачем (EN ISO 12354-3 G.1)', 'Normbeispiel: Ziegelfassade mit zwei Fenstern und Lüfter (EN ISO 12354-3 G.1)', 'Normvoorbeeld: bakstenen gevel met twee ramen en een rooster (EN ISO 12354-3 G.1)', 'Exemple de la norme : façade brique avec deux fenêtres et une grille (EN ISO 12354-3 G.1)', 'Ejemplo de la norma: fachada de ladrillo con dos ventanas y un aireador (EN ISO 12354-3 G.1)', 'Przykład z normy: fasada ceglana z dwoma oknami i nawiewnikiem (EN ISO 12354-3 G.1)'],
    n: ['The worked example of the norm (Tables G.1–G.2): 11,3 m² façade, 50 m³ room, 6 m² double brick RAtr 51, window 4,5 m² RAtr 29, window 0,5 m² RAtr 30, 3 m of air inlet Dn,e,Atr 29 dB. R′Atr = 27,8 dB and D2m,nT,Atr = 29,3 dB as printed; the inlet carries 67 % of the sound.', 'Розрахунковий приклад норми (табл. G.1–G.2): фасад 11,3 м², приміщення 50 м³, 6 м² подвійної цегли RAtr 51, вікно 4,5 м² RAtr 29, вікно 0,5 м² RAtr 30, 3 м приточного пристрою Dn,e,Atr 29 дБ. R′Atr = 27,8 дБ і D2m,nT,Atr = 29,3 дБ, як надруковано; пристрій пропускає 67 % звуку.', 'Das Rechenbeispiel der Norm (Tabellen G.1–G.2): 11,3 m² Fassade, 50 m³ Raum, 6 m² zweischaliges Mauerwerk RAtr 51, Fenster 4,5 m² RAtr 29, Fenster 0,5 m² RAtr 30, 3 m Lüfter Dn,e,Atr 29 dB. R′Atr = 27,8 dB und D2m,nT,Atr = 29,3 dB wie gedruckt; der Lüfter trägt 67 % des Schalls.', 'Het rekenvoorbeeld van de norm (tabellen G.1–G.2): gevel 11,3 m², ruimte 50 m³, 6 m² dubbel metselwerk RAtr 51, raam 4,5 m² RAtr 29, raam 0,5 m² RAtr 30, 3 m rooster Dn,e,Atr 29 dB. R′Atr = 27,8 dB en D2m,nT,Atr = 29,3 dB zoals gedrukt; het rooster draagt 67 % van het geluid.', 'L’exemple de la norme (tableaux G.1–G.2) : façade de 11,3 m², local de 50 m³, 6 m² de double maçonnerie RAtr 51, fenêtre 4,5 m² RAtr 29, fenêtre 0,5 m² RAtr 30, 3 m d’entrée d’air Dn,e,Atr 29 dB. R′Atr = 27,8 dB et D2m,nT,Atr = 29,3 dB comme imprimé ; l’entrée d’air porte 67 % du son.', 'El ejemplo de la norma (tablas G.1–G.2): fachada de 11,3 m², recinto de 50 m³, 6 m² de doble fábrica RAtr 51, ventana 4,5 m² RAtr 29, ventana 0,5 m² RAtr 30, 3 m de aireador Dn,e,Atr 29 dB. R′Atr = 27,8 dB y D2m,nT,Atr = 29,3 dB como en la norma; el aireador lleva el 67 % del sonido.', 'Przykład z normy (tablice G.1–G.2): fasada 11,3 m², pomieszczenie 50 m³, 6 m² podwójnego muru RAtr 51, okno 4,5 m² RAtr 29, okno 0,5 m² RAtr 30, 3 m nawiewnika Dn,e,Atr 29 dB. R′Atr = 27,8 dB i D2m,nT,Atr = 29,3 dB jak w druku; nawiewnik przenosi 67 % dźwięku.'] }
];
function applyPreset(t, id) {
  var p = PRESETS.filter(function (x) { return x.id === id; })[0]; if (!p) return;
  var x = sanitize(Object.assign({}, DEFAULTS, p.s)); x.preset = id;
  Object.keys(t).forEach(function (k) { delete t[k]; }); Object.assign(t, x);
}

var LEARN = {
  version: 1,
  intro: { title: T7(['What this tool does', 'Що робить цей інструмент', 'Was dieses Werkzeug tut', 'Wat deze tool doet', 'Ce que fait cet outil', 'Qué hace esta herramienta', 'Co robi to narzędzie']),
    body: T7(['Traffic noise reaches a room through every part of its façade at once. The Belgian norm sets the required insulation DAtr from the outdoor level on that pane; EN ISO 12354-3 adds up what each wall, window and vent lets through. The tool shows both sides and which element is the weak link.', 'Шум транспорту потрапляє в приміщення через усі частини фасаду одночасно. Бельгійська норма задає потрібну ізоляцію DAtr із зовнішнього рівня на ділянці; EN ISO 12354-3 підсумовує, що пропускає кожна стіна, вікно й провітрювач. Інструмент показує обидві сторони і найслабшу ланку.', 'Verkehrslärm gelangt durch alle Teile der Fassade zugleich in den Raum. Die belgische Norm legt das verlangte DAtr aus dem Außenpegel an der Fläche fest; EN ISO 12354-3 addiert, was Wand, Fenster und Lüfter durchlassen. Das Werkzeug zeigt beide Seiten und das schwächste Glied.', 'Verkeerslawaai bereikt een ruimte via alle delen van de gevel tegelijk. De Belgische norm legt de vereiste isolatie DAtr vast uit het buitenniveau op het vlak; EN ISO 12354-3 telt op wat elke wand, elk raam en rooster doorlaat. De tool toont beide kanten en de zwakste schakel.', 'Le bruit du trafic entre dans un local par toutes les parties de sa façade à la fois. La norme belge fixe l’isolement DAtr exigé à partir du niveau extérieur sur le pan ; l’EN ISO 12354-3 additionne ce que laisse passer chaque mur, fenêtre et grille. L’outil montre les deux côtés et le maillon faible.', 'El ruido del tráfico entra en un recinto por todas las partes de su fachada a la vez. La norma belga fija el aislamiento DAtr exigido a partir del nivel exterior en el paño; EN ISO 12354-3 suma lo que deja pasar cada muro, ventana y aireador. La herramienta muestra ambos lados y el eslabón débil.', 'Hałas ruchu dociera do pomieszczenia przez wszystkie części fasady naraz. Norma belgijska ustala wymagane DAtr z poziomu zewnętrznego na fragmencie; EN ISO 12354-3 sumuje, co przepuszcza każda ściana, okno i nawiewnik. Narzędzie pokazuje obie strony i najsłabsze ogniwo.']) },
  topics: {
    sum: { title: T7(['Energy sum of the elements', 'Енергетична сума елементів', 'Energiesumme der Bauteile', 'Energiesom van de elementen', 'Somme énergétique des éléments', 'Suma energética de los elementos', 'Suma energetyczna elementów']),
      body: T7(['Each element passes τ = (Si/S)·10^(−R/10) of the sound, a small one τ = (10 m²/S)·10^(−Dn,e/10) per piece (Formula (7), (8)); R′ = −10 lg Στ (1). One vent with Dn,e,Atr 32 dB passes as much as 10 m² of wall at 32 dB — a hundred times a 52 dB wall: the weakest element dominates.', 'Кожен елемент пропускає τ = (Si/S)·10^(−R/10) звуку, малий — τ = (10 м²/S)·10^(−Dn,e/10) на штуку (формули (7), (8)); R′ = −10 lg Στ (1). Один провітрювач з Dn,e,Atr 32 дБ пропускає стільки ж, скільки 10 м² стіни з 32 дБ, — у сто разів більше за стіну 52 дБ: домінує найслабший елемент.', 'Jedes Bauteil lässt τ = (Si/S)·10^(−R/10) des Schalls durch, ein kleines τ = (10 m²/S)·10^(−Dn,e/10) je Stück (Formel (7), (8)); R′ = −10 lg Στ (1). Ein Lüfter mit Dn,e,Atr 32 dB lässt so viel durch wie 10 m² Wand mit 32 dB — hundertmal so viel wie eine 52-dB-Wand: das schwächste Bauteil dominiert.', 'Elk element laat τ = (Si/S)·10^(−R/10) van het geluid door, een klein element τ = (10 m²/S)·10^(−Dn,e/10) per stuk (formule (7), (8)); R′ = −10 lg Στ (1). Eén rooster met Dn,e,Atr 32 dB laat evenveel door als 10 m² wand van 32 dB — honderd keer een wand van 52 dB: het zwakste element domineert.', 'Chaque élément laisse passer τ = (Si/S)·10^(−R/10) du son, un petit élément τ = (10 m²/S)·10^(−Dn,e/10) par pièce (formules (7), (8)) ; R′ = −10 lg Στ (1). Une grille de Dn,e,Atr 32 dB laisse passer autant que 10 m² de mur à 32 dB — cent fois un mur à 52 dB : l’élément le plus faible domine.', 'Cada elemento deja pasar τ = (Si/S)·10^(−R/10) del sonido, uno pequeño τ = (10 m²/S)·10^(−Dn,e/10) por pieza (fórmulas (7), (8)); R′ = −10 lg Στ (1). Un aireador con Dn,e,Atr 32 dB deja pasar tanto como 10 m² de muro de 32 dB — cien veces un muro de 52 dB: domina el elemento más débil.', 'Każdy element przepuszcza τ = (Si/S)·10^(−R/10) dźwięku, mały τ = (10 m²/S)·10^(−Dn,e/10) na sztukę (wzory (7), (8)); R′ = −10 lg Στ (1). Jeden nawiewnik o Dn,e,Atr 32 dB przepuszcza tyle co 10 m² ściany 32 dB — sto razy więcej niż ściana 52 dB: dominuje najsłabszy element.']) },
    req: { title: T7(['The Belgian requirement', 'Бельгійська вимога', 'Die belgische Anforderung', 'De Belgische eis', 'L’exigence belge', 'El requisito belga', 'Wymaganie belgijskie']),
