<script type="application/json" id="diagram-tool-manifest">{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision":"2026-10-16.cablesizing-bench-rerun-1","id":"cablesizing","file":"cablesizing.html","listed":true,"category":"electrical","order":25,"title":{"en":"Cable Sizing","uk":"Розрахунок перерізу кабелю","de":"Kabeldimensionierung","nl":"Kabeldimensionering","fr":"Dimensionnement des câbles","es":"Dimensionado de cables","pl":"Dobór przekroju kabli"},"summary":{"en":"Manufacturer-neutral low-voltage cable sizing by conductor material, insulation and installation conditions.","uk":"Незалежний від виробника розрахунок кабелів низької напруги за матеріалом жили, ізоляцією та умовами прокладання.","de":"Herstellerneutrale Dimensionierung von Niederspannungskabeln nach Leitermaterial, Isolierung und Verlegebedingungen.","nl":"Merkenonafhankelijke dimensionering van laagspanningskabels op basis van geleidermateriaal, isolatie en aanlegcondities.","fr":"Dimensionnement indépendant du fabricant des câbles basse tension selon le matériau du conducteur, l’isolation et les conditions de pose.","es":"Dimensionado de cables de baja tensión independiente del fabricante según el material del conductor, el aislamiento y las condiciones de instalación.","pl":"Niezależne od producenta wymiary kabli niskonapięciowych według materiału przewodnika, izolacji i warunków instalacji."},"description":{"en":"Manufacturer-neutral low-voltage cable sizing by conductor material, insulation and installation conditions. Calculates design current, corrected ampacity, voltage drop and optional adiabatic short-circuit withstand; checks terminal-temperature limits, grouping, soil conditions and thermal insulation, and shows exactly which criterion governs the selected standard section. Unsupported table combinations are blocked rather than estimated.","uk":"Незалежний від виробника розрахунок кабелів низької напруги за матеріалом жили, ізоляцією та умовами прокладання. Обчислює розрахунковий струм, скоригований допустимий струм, падіння напруги та, за потреби, адіабатичну термічну стійкість при короткому замиканні; враховує температуру клем, групування, умови ґрунту й теплоізоляцію та показує, який саме критерій визначає вибраний стандартний переріз. Непідтверджені табличні комбінації блокуються, а не оцінюються наближено.","de":"Herstellerneutrale Dimensionierung von Niederspannungskabeln nach Leitermaterial, Isolierung und Verlegebedingungen. Berechnet Betriebsstrom, korrigierte Strombelastbarkeit, Spannungsfall und optional die adiabatische Kurzschlussfestigkeit; berücksichtigt Anschlussklemmentemperatur, Häufung, Bodenbedingungen und Wärmedämmung und zeigt, welches Kriterium den gewählten Normquerschnitt bestimmt. Nicht belegte Tabellenkombinationen werden gesperrt statt geschätzt.","nl":"Merkenonafhankelijke dimensionering van laagspanningskabels op basis van geleidermateriaal, isolatie en aanlegcondities. Berekent ontwerpstroom, gecorrigeerde stroombelastbaarheid, spanningsval en optioneel de adiabatische kortsluitvastheid; controleert klemtemperatuur, groepering, bodemcondities en thermische isolatie en toont welk criterium de gekozen standaarddoorsnede bepaalt. Niet-onderbouwde tabelcombinaties worden geblokkeerd in plaats van geschat.","fr":"Dimensionnement indépendant du fabricant des câbles basse tension selon le matériau du conducteur, l’isolation et les conditions de pose. Calcule le courant de calcul, l’intensité admissible corrigée, la chute de tension et, en option, la tenue thermique adiabatique au court-circuit ; vérifie la température des bornes, le groupement, les conditions du sol et l’isolation thermique, et indique quel critère dimensionne la section normalisée retenue. Les combinaisons de tableaux non vérifiées sont bloquées plutôt qu’estimées.","es":"Dimensionado de cables de baja tensión independiente del fabricante según el material del conductor, el aislamiento y las condiciones de instalación. Calcula la corriente de diseño, la intensidad admisible corregida, la caída de tensión y, opcionalmente, la resistencia térmica adiabática al cortocircuito; comprueba la temperatura de bornes, la agrupación, las condiciones del suelo y el aislamiento térmico, e indica qué criterio gobierna la sección normalizada seleccionada. Las combinaciones de tablas no verificadas se bloquean en lugar de estimarse.","pl":"Niezależny od producenta dobór przekrojów kabli niskiego napięcia według materiału przewodnika, izolacji i warunków instalacji. Oblicza prąd obliczeniowy, skorygowaną obciążalność prądową, spadek napięcia i opcjonalną wytrzymałość na zwarcie adiabatyczne; sprawdza ograniczenia temperatury zacisków, grupowanie, warunki glebowe i izolację termiczną oraz dokładnie wskazuje, które kryterium ma zastosowanie do wybranej sekcji normy. Nieobsługiwane kombinacje tabel są blokowane, a nie szacowane."},"status":"benchmarked","independent_validation":false,"limitations":{"en":"Manufacturer-neutral low-voltage cable-sizing prototype. The verified ampacity subset is exactly one column of IEC 60364-5-52: PVC insulation / 70 °C conductor temperature, three loaded conductors, copper or aluminium, 1.5–300 mm², reference methods A1, A2, B1, B2, C, D1, D2 and E — 242 usable (material, method, cross-section) cells, 23.6 % of the tool's own input grid and 18.9 % of the grid once IEC reference methods F and G are counted. XLPE is usable only where the terminals limit the conductor to 70 °C; XLPE at 90 °C terminals, two loaded conductors, single-phase and DC circuits, parallel conductors and methods F/G all fail closed instead of being extrapolated. Buried grouping uses Table B.52.18 (cables laid directly in the ground, 2–6 circuits) for both D1 and D2 — the separate Table B.52.19 for cables in ducts in the ground is not implemented, so D1 is treated conservatively — and more than six buried circuits is refused. Voltage drop is the Annex G equation including the reactance and power-factor terms, but with a physical ρ(θ) conductor model (22.21 Cu / 35.29 Al Ω·mm²/km at 70 °C) instead of Annex G's ρ1 = 1.25 ρ20 = 22.5 / 36.0, so it reads 1.3 % (Cu) and 2.0 % (Al) low against that convention, and it is not a complete cable-construction model. The optional short-circuit check is the adiabatic I²t ≤ k²S² screen. When Protection Coordination supplies matched max/min fault-current and clearing-time sets, the handoff selects the thermally governing I²t case; protective-device let-through I²t is still not modelled. Terminal-temperature, grouping, soil and thermal-insulation corrections are screening calculations. This tool does not constitute protection coordination or a certified cable selection and every project result requires independent verification.","uk":"Прототип підбору кабелів НН, незалежний від виробника. Перевірена підмножина струмових навантажень — рівно один стовпець IEC 60364-5-52: ізоляція ПВХ / 70 °C, три навантажені жили, мідь або алюміній, 1,5–300 мм², еталонні способи A1, A2, B1, B2, C, D1, D2 та E — 242 придатні комірки (матеріал, спосіб, переріз), тобто 23,6 % власної вхідної сітки інструмента і 18,9 % сітки з урахуванням способів F і G. Зшитий поліетилен доступний лише тоді, коли затискачі обмежують жилу до 70 °C; XLPE при 70/90 °C затискачах, дві навантажені жили, однофазні та постійного струму кола, паралельні жили та способи F/G блокуються, а не екстраполюються. Групування в ґрунті використовує таблицю B.52.18 (прокладання безпосередньо в ґрунті, 2–6 кіл) як для D1, так і для D2 — окрему таблицю B.52.19 не реалізовано, тому D1 оцінюється консервативно, — а понад шість підземних кіл відхиляється. Падіння напруги — рівняння додатка G з реактивним і косинусним членами, але з фізичною моделлю ρ(θ) (22,21 Cu / 35,29 Al Ω·мм²/км при 70 °C) замість ρ1 = 1,25 ρ20 = 22,5 / 36,0, тож воно на 1,3 % (Cu) і 2,0 % (Al) нижче за домовленість додатка G; це не повна модель конструкції кабелю. Перевірка КЗ — адіабатичний екран I²t ≤ k²S², без пропущеної енергії апарата, мінімального струму КЗ і автоматичного вимкнення. Поправки на температуру затискачів, групування, ґрунт і теплоізоляцію є скринінговими. Інструмент не є селективністю захисту чи сертифікованим вибором кабелю; кожен проєктний результат потребує незалежної перевірки.","de":"Herstellerneutraler Prototyp zur Niederspannungs-Kabeldimensionierung. Die verifizierte Strombelastbarkeits-Teilmenge ist genau eine Spalte der IEC 60364-5-52: PVC-Isolierung / 70 °C Leitertemperatur, drei belastete Adern, Kupfer oder Aluminium, 1,5–300 mm², Referenzverlegearten A1, A2, B1, B2, C, D1, D2 und E — 242 nutzbare Zellen (Werkstoff, Verlegeart, Querschnitt), 23,6 % des Eingaberasters des Werkzeugs und 18,9 % des Rasters einschließlich der Verlegearten F und G. XLPE ist nur nutzbar, wenn die Klemmen den Leiter auf 70 °C begrenzen; XLPE an 90-°C-Klemmen, zwei belastete Adern, Wechselstrom-Einphasen- und Gleichstromkreise, parallele Leiter sowie F/G werden blockiert statt extrapoliert. Die Häufung im Erdreich verwendet Tabelle B.52.18 (Direkterdverlegung, 2–6 Stromkreise) für D1 und D2 — die eigene Tabelle B.52.19 ist nicht umgesetzt, D1 wird daher konservativ behandelt —, mehr als sechs erdverlegte Stromkreise werden abgelehnt. Der Spannungsfall ist die Gleichung aus Anhang G einschließlich Reaktanz- und Leistungsfaktorterm, jedoch mit einem physikalischen ρ(θ)-Leitermodell (22,21 Cu / 35,29 Al Ω·mm²/km bei 70 °C) statt ρ1 = 1,25 ρ20 = 22,5 / 36,0; er liegt damit 1,3 % (Cu) bzw. 2,0 % (Al) unter dieser Konvention und ist kein vollständiges Kabelaufbaumodell. Die optionale Kurzschlussprüfung ist der adiabatische Nachweis I²t ≤ k²S² ohne Durchlassenergie des Schutzgeräts, Mindestkurzschlussstrom oder Abschaltbedingung. Klemmentemperatur-, Häufungs-, Boden- und Wärmedämmkorrekturen sind Screening-Rechnungen. Dieses Werkzeug ersetzt weder eine Selektivitätsstudie noch eine zertifizierte Kabelauswahl; jedes Projektergebnis erfordert eine unabhängige Prüfung.","nl":"Fabrikantneutraal prototype voor laagspanningskabelberekening. De geverifieerde stroombelastbaarheidsdeelverzameling is precies één kolom van IEC 60364-5-52: PVC-isolatie / 70 °C geleidertemperatuur, drie belaste aders, koper of aluminium, 1,5–300 mm², referentiemethoden A1, A2, B1, B2, C, D1, D2 en E — 242 bruikbare cellen (materiaal, methode, doorsnede), 23,6 % van het eigen invoerraster van de tool en 18,9 % van het raster inclusief methoden F en G. XLPE is alleen bruikbaar wanneer de klemmen de geleider tot 70 °C beperken; XLPE op 90 °C-klemmen, twee belaste aders, eenfase- en gelijkstroomkringen, parallelle geleiders en F/G worden geblokkeerd in plaats van geëxtrapoleerd. Groepering in de grond gebruikt tabel B.52.18 (rechtstreeks in de grond, 2–6 kringen) voor zowel D1 als D2 — de aparte tabel B.52.19 is niet geïmplementeerd, dus D1 is conservatief — en meer dan zes ondergrondse kringen wordt geweigerd. De spanningsval is de vergelijking uit bijlage G inclusief reactantie- en arbeidsfactorterm, maar met een fysisch ρ(θ)-geleidermodel (22,21 Cu / 35,29 Al Ω·mm²/km bij 70 °C) in plaats van ρ1 = 1,25 ρ20 = 22,5 / 36,0, waardoor hij 1,3 % (Cu) en 2,0 % (Al) lager uitkomt dan die conventie; het is geen volledig kabelconstructiemodel. De optionele kortsluitcontrole is de adiabatische toets I²t ≤ k²S² zonder doorlaatenergie van het beveiligingstoestel, minimale kortsluitstroom of automatische uitschakeling. Klemtemperatuur-, groeperings-, bodem- en thermische-isolatiecorrecties zijn screeningberekeningen. Deze tool is geen selectiviteitsstudie of gecertificeerde kabelkeuze; elk projectresultaat vereist onafhankelijke verificatie.","fr":"Prototype de dimensionnement de câbles BT, indépendant des fabricants. Le sous-ensemble vérifié de courants admissibles est exactement une colonne de l'IEC 60364-5-52 : isolation PVC / 70 °C, trois conducteurs chargés, cuivre ou aluminium, 1,5–300 mm², méthodes de référence A1, A2, B1, B2, C, D1, D2 et E — 242 cellules exploitables (matériau, méthode, section), soit 23,6 % de la grille d'entrée de l'outil et 18,9 % de la grille incluant les méthodes F et G. Le XLPE n'est utilisable que lorsque les bornes limitent le conducteur à 70 °C ; XLPE sur bornes 90 °C, deux conducteurs chargés, circuits monophasés et continus, conducteurs en parallèle et méthodes F/G sont bloqués et non extrapolés. Le groupement enterré utilise la table B.52.18 (pose directe dans le sol, 2 à 6 circuits) pour D1 comme pour D2 — la table B.52.19 propre aux conduits enterrés n'est pas implémentée, D1 est donc conservatif — et plus de six circuits enterrés est refusé. La chute de tension est l'équation de l'annexe G, terme réactif et facteur de puissance compris, mais avec un modèle physique ρ(θ) (22,21 Cu / 35,29 Al Ω·mm²/km à 70 °C) au lieu de ρ1 = 1,25 ρ20 = 22,5 / 36,0 : elle est donc inférieure de 1,3 % (Cu) et 2,0 % (Al) à cette convention, et ce n'est pas un modèle complet de construction de câble. Le contrôle de court-circuit optionnel est l'écran adiabatique I²t ≤ k²S², sans énergie laissée passer par l'appareil, courant de court-circuit minimal ni coupure automatique. Les corrections de température aux bornes, de groupement, de sol et d'isolation thermique sont des calculs de dégrossissage. Cet outil ne constitue ni une étude de sélectivité ni un choix de câble certifié ; tout résultat de projet exige une vérification indépendante.","es":"Prototipo de dimensionado de cables de baja tensión, neutral respecto al fabricante. El subconjunto verificado de intensidades admisibles es exactamente una columna de IEC 60364-5-52: aislamiento PVC / 70 °C, tres conductores cargados, cobre o aluminio, 1,5–300 mm², métodos de referencia A1, A2, B1, B2, C, D1, D2 y E — 242 celdas utilizables (material, método, sección), el 23,6 % de la propia rejilla de entrada de la herramienta y el 18,9 % de la rejilla incluyendo los métodos F y G. El XLPE solo es utilizable cuando los bornes limitan el conductor a 70 °C; XLPE con bornes de 90 °C, dos conductores cargados, circuitos monofásicos y de corriente continua, conductores en paralelo y los métodos F/G se bloquean en lugar de extrapolarse. El agrupamiento enterrado usa la tabla B.52.18 (instalación directa en el terreno, 2 a 6 circuitos) tanto para D1 como para D2 — la tabla B.52.19 específica de conductos enterrados no está implementada, por lo que D1 es conservador — y más de seis circuitos enterrados se rechaza. La caída de tensión es la ecuación del anexo G con los términos de reactancia y factor de potencia, pero con un modelo físico ρ(θ) (22,21 Cu / 35,29 Al Ω·mm²/km a 70 °C) en vez de ρ1 = 1,25 ρ20 = 22,5 / 36,0, por lo que resulta un 1,3 % (Cu) y un 2,0 % (Al) inferior a esa convención, y no es un modelo completo de construcción del cable. La comprobación opcional de cortocircuito es el criterio adiabático I²t ≤ k²S², sin energía específica pasante del dispositivo, corriente mínima de cortocircuito ni desconexión automática. Las correcciones por temperatura de bornes, agrupamiento, terreno y aislamiento térmico son cálculos de cribado. Esta herramienta no constituye un estudio de selectividad ni una selección de cable certificada; todo resultado de proyecto exige verificación independiente.","pl":"Prototyp niezależnego od producenta przekroju kabla niskonapięciowego. Zweryfikowany podzbiór obciążalności prądowej to dokładnie jedna kolumna normy IEC 60364-5-52: izolacja PVC / temperatura przewodu 70°C, trzy obciążone przewody, miedź lub aluminium, 1,5–300 mm², metody odniesienia A1, A2, B1, B2, C, D1, D2 i E — 242 użyteczne (materiał, metoda, przekrój) ogniwa, 23,6% własnej siatki wejściowej narzędzia i 18,9% siatki po uwzględnieniu metod odniesienia IEC F i G. XLPE nadaje się do użytku tylko wtedy, gdy zaciski ograniczają temperaturę przewodu do 70°C; XLPE przy zaciskach 90°C, dwóch obciążonych przewodach, obwodach jednofazowych i prądu stałego, przewodach równoległych i metodach F/G wszystkie działają w stanie zamkniętym, a nie ekstrapolowanym. Grupowanie kabli podziemnych wykorzystuje tabelę B.52.18 (kable ułożone bezpośrednio w ziemi, 2–6 obwodów) zarówno dla D1, jak i D2 — oddzielna tabela B.52.19 dla kabli w kanałach w ziemi nie jest stosowana, więc D1 jest traktowany konserwatywnie — i odrzuca więcej niż sześć obwodów podziemnych. Spadek napięcia to równanie z Załącznika G, obejmujące reaktancję i współczynnik mocy, ale z fizycznym modelem przewodnika ρ(θ) (22,21 Cu / 35,29 Al Ω·mm²/km przy 70°C) zamiast ρ1 = 1,25 ρ20 = 22,5 / 36,0 z Załącznika G, więc odczyt wynosi 1,3% (Cu) i 2,0% (Al) mniej niż w tej konwencji i nie jest to kompletny model konstrukcji kabla. Opcjonalna kontrola zwarcia to ekran adiabatyczny I²t ≤ k²S² i nie wykorzystuje prądu przepustowego I²t, minimalnego prądu zwarciowego ani automatycznego rozłączenia. Korekty temperatury zacisków, grupowania, gruntu i izolacji termicznej są obliczeniami ekranowania. To narzędzie nie stanowi koordynacji zabezpieczeń ani certyfikowanego doboru kabli, a każdy wynik projektu wymaga niezależnej weryfikacji."},"intended_use":["education","technical exploration","preliminary assessment"],"catalog_languages":["en","uk","de","nl","fr","es","pl"],"tool_languages":["en","uk","de","nl","fr","es","pl"],"dependencies":[],"network_access":{"mode":"none"},"validation":{"basis":{"en":"72 cases driven through the page: the IEC 60364-5-52 correction-factor tables, the Annex G voltage drop, the IEC 60364-4-43 adiabatic check and the IEC 60364-5-54 protective conductor, all recomputed by an independent python implementation, plus integrity and fail-closed checks on the ampacity table itself. The tabulated current-carrying capacities are copyrighted and could not be quoted from a primary source, so they are checked for integrity, for one exact primary-source value and against a ratio bound to the published two-loaded-conductor table; the aluminium and buried columns are recorded but not graded. The harness is the author's own; no external party has reviewed it.","uk":"72 випадки, проведені через сторінку: таблиці поправкових коефіцієнтів IEC 60364-5-52, падіння напруги за додатком G, адіабатична перевірка IEC 60364-4-43 і захисний провідник за IEC 60364-5-54 — усе перераховано незалежною реалізацією на python, плюс перевірки цілісності та відмови-в-безпечний-бік для самої таблиці струмів. Табличні тривало допустимі струми захищені авторським правом і їх не вдалося процитувати з первинного джерела, тож вони перевірені на цілісність, на одне точне значення з первинного джерела та за співвідношенням до опублікованої таблиці для двох навантажених жил; алюмінієві та підземні стовпці записано, але не оцінено. Стенд авторський; жодна стороння особа його не перевіряла.","de":"72 über die Seite gefahrene Fälle: die Korrekturfaktor-Tabellen der IEC 60364-5-52, der Spannungsfall nach Anhang G, der adiabatische Nachweis der IEC 60364-4-43 und der Schutzleiter nach IEC 60364-5-54, alle von einer unabhängigen Python-Implementierung nachgerechnet, dazu Integritäts- und Fail-closed-Prüfungen der Strombelastbarkeitstabelle selbst. Die tabellierten Strombelastbarkeiten sind urheberrechtlich geschützt und konnten aus keiner Primärquelle zitiert werden; sie werden daher auf Integrität, auf einen exakten Primärquellenwert und gegen eine Verhältnisschranke zur veröffentlichten Tabelle für zwei belastete Adern geprüft. Die Aluminium- und Erdverlegungsspalten werden festgehalten, aber nicht bewertet. Der Prüfstand stammt vom Autor selbst; keine dritte Partei hat ihn geprüft.","nl":"72 gevallen door de pagina gedreven: de correctiefactortabellen van IEC 60364-5-52, de spanningsval uit bijlage G, de adiabatische toets van IEC 60364-4-43 en de beschermingsleiding volgens IEC 60364-5-54, alle herberekend door een onafhankelijke python-implementatie, plus integriteits- en fail-closed-controles op de stroombelastbaarheidstabel zelf. De getabelleerde belastbaarheden zijn auteursrechtelijk beschermd en konden niet uit een primaire bron worden geciteerd; ze worden daarom gecontroleerd op integriteit, op één exacte primaire-bronwaarde en tegen een verhoudingsgrens met de gepubliceerde tabel voor twee belaste aders. De aluminium- en grondkolommen worden vastgelegd maar niet beoordeeld. De testbank is van de auteur zelf; geen derde partij heeft die beoordeeld.","fr":"72 cas exécutés via la page : les tables de facteurs de correction de l'IEC 60364-5-52, la chute de tension de l'annexe G, le contrôle adiabatique de l'IEC 60364-4-43 et le conducteur de protection de l'IEC 60364-5-54, tous recalculés par une implémentation python indépendante, plus des contrôles d'intégrité et de refus explicite sur la table de courants admissibles elle-même. Les courants admissibles tabulés sont protégés par le droit d'auteur et n'ont pu être cités depuis une source primaire ; ils sont donc vérifiés en intégrité, sur une valeur exacte de source primaire et contre une borne de rapport à la table publiée pour deux conducteurs chargés. Les colonnes aluminium et enterrées sont consignées mais non notées. Le banc d'essai est celui de l'auteur ; aucun tiers ne l'a examiné.","es":"72 casos ejecutados a través de la página: las tablas de factores de corrección de IEC 60364-5-52, la caída de tensión del anexo G, la comprobación adiabática de IEC 60364-4-43 y el conductor de protección de IEC 60364-5-54, todos recalculados por una implementación independiente en python, más comprobaciones de integridad y de rechazo explícito sobre la propia tabla de intensidades. Las intensidades admisibles tabuladas están protegidas por derechos de autor y no pudieron citarse desde una fuente primaria; se comprueban por tanto en integridad, con un valor exacto de fuente primaria y frente a una cota de relación con la tabla publicada para dos conductores cargados. Las columnas de aluminio y enterradas quedan registradas pero no calificadas. El banco es del propio autor; ningún tercero lo ha revisado.","pl":"Na stronie omówiono 72 przypadki: tabele współczynników korekcyjnych normy IEC 60364-5-52, spadek napięcia zgodnie z załącznikiem G, adiabatyczną kontrolę zgodnie z normą IEC 60364-4-43 oraz przewód ochronny zgodnie z normą IEC 60364-5-54, wszystkie przeliczone przez niezależną implementację w Pythonie, a także kontrole integralności i zamknięcia awaryjnego samej tabeli obciążalności prądowej. Podane w tabelach wartości obciążalności prądowej są chronione prawami autorskimi i nie mogły zostać zacytowane ze źródła pierwotnego, dlatego są sprawdzane pod kątem integralności, dla jednej dokładnej wartości źródła pierwotnego oraz w odniesieniu do współczynnika powiązanego z opublikowaną tabelą dla dwóch przewodów obciążonych; kolumny aluminiowe i zakopane są rejestrowane, ale nie oceniane. Zestaw testowy został przygotowany przez autora; nie został poddany przeglądowi przez niezależną stronę trzecią."},"independent_validation":false,"benchmarks":[{"id":"iec60364-cable-sizing","reference":"The IEC 60364-5-52 correction-factor tables re-typed from published transcriptions of the standard (ambient air B.52.14, ground temperature B.52.15, soil thermal resistivity B.52.16, grouping B.52.17, buried grouping B.52.18, thermal insulation Table 52.2), the Annex G voltage-drop closed form u = b(rho1 L/S cos(phi) + lambda L sin(phi)) I_B, the IEC 60364-4-43 434.5.2 adiabatic equation with the Table 43A k values, the 433.1 I_B <= I_n <= I_z rule and the IEC 60364-5-54 Table 54.2 protective-conductor rule - all implemented independently in python. The raw current-carrying-capacity columns (Table B.52.4 for A1-D2 and B.52.10/B.52.11 for method E) are copyrighted and could not be obtained from any source that reproduces them, so they are treated as an empirical data table: the whole table is read back out of the page and checked for integrity and monotonicity, the one value a public copy of the standard does show (A1, copper, 1,5 mm2 = 13,5 A) is checked exactly, and every copper column is checked against the published two-loaded-conductor Table B.52.2 through a physically bounded ratio. The aluminium columns and the buried D1/D2 columns have no independent source at all and are recorded as flagged, not passed.","citations":["IEC 60364-5-52:2009 (ed. 3.0) / ed. 3.1:2024-11, Table B.52.1 - schedule of reference methods of installation A1, A2, B1, B2, C, D1, D2, E, F, G","IEC 60364-5-52, Table B.52.2 - current-carrying capacities, PVC insulation, TWO loaded conductors, copper or aluminium (used here as the independent consistency bound; values as transcribed by ECalPro, 'IEC 60364 Table B.52 - Cable Current Ratings')","IEC 60364-5-52, Table B.52.4 - current-carrying capacities, PVC insulation, THREE loaded conductors, copper or aluminium - the table the page implements for methods A1 to D2; the value A1/copper/1,5 mm2 = 13,5 A is visible in a public copy of the standard","IEC 60364-5-52, Tables B.52.10 and B.52.11 - installation methods E, F and G, PVC insulation, copper and aluminium conductors","IEC 60364-5-52, Table B.52.14 - correction factors for ambient air temperatures other than 30 C (values as published in the Schneider Electric Electrical Installation Guide, ch. G fig. G12, and by ECalPro)","IEC 60364-5-52, Table B.52.15 - correction factors for ambient ground temperatures other than 20 C (Schneider Electric Electrical Installation Guide, ch. G fig. G13)","IEC 60364-5-52, Table B.52.16 - correction factors for soil thermal resistivities other than 2,5 K.m/W, buried-duct and direct-buried rows (Schneider Electric Electrical Installation Guide, ch. G fig. G14; buried-duct row also published by ECalPro)","IEC 60364-5-52, Table B.52.17 - reduction factors for groups of more than one circuit or multi-core cable","IEC 60364-5-52, Table B.52.18 - reduction factors for more than one circuit, cables laid directly in the ground, installation method D2, 2 to 6 circuits (Schneider Electric Electrical Installation Guide, ch. G fig. G18)","IEC 60364-5-52, Table B.52.19 - reduction factors for more than one circuit, cables laid in ducts in the ground, installation method D1 - a separate table that the page does not implement","IEC 60364-5-52, clause 525 and Annex G - voltage drop u = b (rho1 L/S cos(phi) + lambda L sin(phi)) I_B with rho1 = 1,25 rho_20 = 0,0225 ohm mm2/m for copper and 0,036 for aluminium; b = sqrt3 for three-phase, 2 for single-phase","IEC 60364-5-52, clause 523.9 and Table 52.2 - cable in a thermally insulating wall: 0,89 / 0,81 / 0,68 / 0,55 for 50 / 100 / 200 / 400 mm, and 0,5 beyond 0,5 m","IEC 60364-4-43:2017, clause 434.5.2 - adiabatic check I^2 t <= k^2 S^2, and Table 43A - k = 115 (Cu/PVC), 143 (Cu/XLPE), 76 (Al/PVC), 94 (Al/XLPE)","IEC 60364-4-43:2017, clause 433.1 - I_B <= I_n <= I_z","IEC 60364-5-54:2011, Table 54.2 - protective conductor cross-section S, 16, S/2"],"cases":72,"passed":72,"tolerance":"Agreement to the last digit the page prints: |got-ref| <= 0.5*10^-d + 1e-9*|ref|, with d = 1 decimal for the design current and the corrected ampacity (A), 0 decimals for the ampacity column of the candidate table, 2 decimals for voltage drop (%) and losses (kW), 3 decimals for every correction factor, 1 decimal for the adiabatic minimum section (mm2) and the short-circuit withstand (kA). Every graded quantity is a closed form on both sides, so the only physical slack is double-precision round-off. The ampacity table itself is an empirical data table and is not graded to a numeric tolerance: it is checked for integrity, for one exact primary-source value, and against a 0.82-0.96 (0.78-0.90 for method E) ratio band to the published two-loaded-conductor table with no cell more than 0.06 from its column median.","run_at":"2026-10-16T09:36:11Z","artifact":"benchmarks/cablesizing.json"}]},"report":{"pdf":true,"source_attribution":true},"python_export":{"supported":true,"requires":[]},"handoff":{"provides":["I","L","V_volt","Z"],"accepts":["I","L","V_volt","Ik","t_clear"]},"state_codec":{"permalink":true,"record":"tools.petrov.re/calculation-record/v1"},"ui":{"framework":"tools.petrov.re/ui/v1","level":3}}</script>

/* ------------------------------------------------------------------ fields */
function setLabelText(fid,text){
 const l=document.querySelector('[data-dgu-field="'+fid+'"] .dgu-flabel');
 if(!l)return;
 if(l.firstChild&&l.firstChild.nodeType===3)l.firstChild.nodeValue=text;
 else l.insertBefore(document.createTextNode(text),l.firstChild);
}
function setUnitText(fid,text){
 const u=document.querySelector('[data-dgu-field="'+fid+'"] .dgu-unit');
 if(u)u.textContent=text;
}

/* the two cross-field rules the old event handlers carried, shared by the
   framework path and the degraded path */
function applyChange(key){
 if(key==='method'){
  const now=isBuriedMethod(state.method);
  if(now!==lastBuried)state.ambient=now?20:30;
  lastBuried=now;
 }
 if(key==='system'){
  const old=lastSystem;lastSystem=state.system;
  if(state.system==='3ph'&&old!=='3ph'&&nv(state.voltage)===230)state.voltage=400;
  if(state.system==='1ph'&&old==='3ph'&&nv(state.voltage)===400)state.voltage=230;
 }
 if(key==='insulation')normalize(state);
}

 const d1=document.createElement('details');
 d1.innerHTML='<summary></summary><p></p><p><code>Iz,corr = Iz,table · kT · kG · ksoil · kins · kextra</code></p>'+
  '<p><code>ΔU3φ = √3 · I · (R cosφ ± X sinφ) · L</code></p>'+
  '<p><code>Smin = I√t/k</code> <span></span></p>';
 d1.querySelector('summary').textContent=t('methodTitle');
 d1.querySelectorAll('p')[0].textContent=t('eqLoad');
 d1.querySelector('span').textContent=t('eqScNote');
 const d2=document.createElement('details');
 d2.innerHTML='<summary></summary><p class="cs-src"></p><p class="cs-src"></p><p class="cs-src"></p>';
 d2.querySelector('summary').textContent=t('sourcesTitle');
 ['source1','source2','source3'].forEach((k,i)=>{d2.querySelectorAll('p')[i].textContent=t(k)});

function boot(){
 if(!window.DiagramUI||DiagramUI.api!=='tools.petrov.re/ui/v1'){
  /* degrade honestly: the same fields, the same maths, no framework */
  fbMount();
  document.title=t('title')+' — '+(window.Diagram&&Diagram.site?Diagram.site.name():'tools.petrov.re');
  dgcInit();
  window.__cablesizing={ui:null,state:()=>state,getData,computeView};
  return;
 }
 lang=LANGS.includes(DiagramUI.lang())?DiagramUI.lang():'en';
 lastSystem=state.system;lastBuried=isBuriedMethod(state.method);
 ui=DiagramUI.app({
  id:'cablesizing',mount:'#app',layout:'calculator',compute:'live',
  state,defaults:DEFAULTS,history:false,
  subtitle:()=>t('subtitle'),
  learn:LEARN,
  panels:PANELS,
  footer:footerContent,
  on:{
   compute:s=>computeView(s),
   change:key=>{applyChange(key);if(ui)ui.sync()},
   reset:s=>{state=s;lastSystem=s.system;lastBuried=isBuriedMethod(s.method)},
   lang:l=>{
    lang=LANGS.includes(l)?l:'en';
    document.title=t('title')+' — '+(window.Diagram&&Diagram.site?Diagram.site.name():'tools.petrov.re');
    const md=document.querySelector('meta[name="description"]');if(md)md.content=t('subtitle');
    syncNodeText();
   },
   ready:()=>{syncNodeText();updateQa()}
  }
 });
 document.title=t('title')+' — '+(window.Diagram&&Diagram.site?Diagram.site.name():'tools.petrov.re');
 ui.ready();
 dgcInit();
 window.__cablesizing={ui,state:()=>state,getData,computeView};
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();
