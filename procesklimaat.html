y uzyskane, i nigdy nie są obliczane dla Twojego przypadku.","No rule pairs a measure with itself":"Żadna reguła nie łączy środka z nim samym","No standing water: sloped trays, traps and a visible discharge":"Brak stojącej wody: pochylone tace, syfony i widoczny odpływ","No text in any language claims that an item is obligatory for the reader or sufficient on its own":"Żaden tekst w żadnym języku nie twierdzi, że dany element jest obowiązkowy dla czytelnika lub sam w sobie wystarczający","No traced figure is attached to this measure. The attention point above states what the measure is meant to limit; the primary source has to be identified for the project itself.":"Do tego środka nie dołączono żadnej narysowanej figury. Powyższy punkt uwagi wskazuje, co środek ten ma ograniczać; główne źródło musi zostać zidentyfikowane dla samego projektu.","No typical set contains a measure that this page declares incompatible with the hazard classification of the same industry":"Żaden typowy zestaw nie zawiera środka, który ta strona uznaje za niezgodny z klasyfikacją zagrożeń danej branży","No wet or condensing service routed through the electrical room":"Brak mokrej lub kondensującej się wody doprowadzanej przez pomieszczenie elektryczne","Nominal air change rate of the cleanroom in the recovery example":"Nominalna szybkość wymiany powietrza w pomieszczeniu czystym w przykładzie odzysku","Nominal air change rate of the emergency purge":"Nominalna szybkość wymiany powietrza w układzie odpowietrzania awaryjnego","Nominal air change rate used in a tracer test":"Nominalna szybkość wymiany powietrza stosowana w teście wskaźnikowym","None of these entries asserts that it applies to your project. Each one states where its figure comes from and under which conditions it was obtained.":"Żaden z tych wpisów nie potwierdza, że ​​dotyczy on Twojego projektu. Każdy z nich podaje, skąd pochodzi dana liczba i w jakich warunkach została uzyskana.","Nothing a panel puts on screen carries an item code or a file path of the source material, in any of the seven languages":"Żadna treść wyświetlana przez panel nie zawiera kodu elementu ani ścieżki pliku materiału źródłowego w żadnym z siedmiu języków","Nothing ticked yet. Tick any measure below and this panel answers at once: which attention point it closes, whether it clashes with your earlier ticks, and what is usually needed next.":"Nic jeszcze nie zostało zaznaczone. Zaznacz dowolny środek poniżej, a ten panel natychmiast odpowie: który punkt uwagi zamyka, czy koliduje z wcześniejszymi zaznaczeniami i co zazwyczaj jest potrzebne jako następne.","Nuclear and radiological installations":"Instalacje jądrowe i radiologiczne","Obtained under":"Uzyskano na podstawie","Occupational exposure limit for a hazardous substance":"Dopuszczalne stężenie w środowisku pracy substancji niebezpiecznej","Occupational exposure limit for the substance actually handled":"Dopuszczalne stężenie w środowisku pracy dla substancji faktycznie używanej","Odour and greasy aerosol from frying, baking and cooking":"Zapach i tłusty aerozol po smażeniu, pieczeniu i gotowaniu","Odour treatment on the exhaust before discharge":"Usuwanie zapachów z wydechu przed wydmuchem","Oil mist and thermally generated ultrafine aerosol":"Mgła olejowa i aerozol ultradrobny generowany termicznie","On a moving platform, drainage, condensate and duct supports behave differently.":"Na ruchomej platformie drenaż, kondensat i podpory kanałów zachowują się inaczej.","On-torch or on-tool extraction directly at the arc":"Odciąg z palnika lub narzędzia bezpośrednio przy łuku","Once-through discharge of the captured hazardous stream to treatment":"Jednorazowe odprowadzanie wychwyconego strumienia niebezpiecznego do oczyszczalni","One room cannot be above and below the surrounding pressure at the same time. When a zone must protect open product and also contain a flammable or toxic release, the answer is a physical barrier with an airlock — a sandwich or bubble arrangement — not a single pressure setpoint.":"Jedno pomieszczenie nie może jednocześnie znajdować się powyżej i poniżej ciśnienia otoczenia. Gdy strefa musi chronić otwarty produkt i jednocześnie powstrzymywać wyciek substancji łatwopalnych lub toksycznych, rozwiązaniem jest fizyczna bariera z śluzą powietrzną – układ warstwowy lub pęcherzykowy – a nie pojedyncza nastawa ciśnienia.","Only in A":"Tylko w A","Only in B":"Tylko w B","Open product exposed to airborne contamination":"Otwarty produkt narażony na zanieczyszczenie powietrza","Openly published law":"Prawo publikowane jawnie","Operating modes":"Tryby pracy","Operating point at reduced speed with the system unchanged":"Punkt pracy przy zmniejszonej prędkości i niezmienionym systemie","Outdoor air intake quality and re-entrainment of the own exhaust":"Jakość powietrza dolotowego i ponowne wciąganie spalin własnych","Outdoor design conditions for the installation":"Warunki zewnętrzne dotyczące projektowania instalacji","Overpressure with filtered, dry supply air for the electrical room":"Nadciśnienie z filtrowanym, suchym powietrzem nawiewnym do pomieszczenia elektrycznego","Oxygen deficiency and confined space entry":"Niedobór tlenu i wejście do przestrzeni zamkniętej","Oxygen depletion monitoring with alarm in the affected zones":"Monitorowanie niedoboru tlenu z alarmem w strefach zagrożonych","Oxygen dosing is bounded against local enrichment; the example is declared non-normative":"Dawkowanie tlenu jest ograniczone lokalnym wzbogaceniem; przykład jest uznany za nienormatywny","PROCESS CLIMATE ADVISOR — WORKING NOTE":"DORADCA DS. KLIMATU PROCESU — NOTATKA ROBOCZA","Pairing hints":"Wskazówki dotyczące parowania","Paper, board and corrugated board":"Papier, tektura i tektura falista","Particle cleanliness class of the protected zone":"Klasa czystości cząstek w strefie chronionej","People as a particle and microbiological source":"Ludzie jako cząstka i źródło mikrobiologiczne","Periodic re-verification against recorded acceptance criteria":"Okresowa ponowna weryfikacja w oparciu o zarejestrowane kryteria akceptacji","Permissible air temperature rise in a machinery space":"Dopuszczalny wzrost temperatury powietrza w maszynowni","Personnel requirements":"Wymagania kadrowe","Pharmaceutical and biotechnological production":"Produkcja farmaceutyczna i biotechnologiczna","Physical separation is required; a slope and a tray are not a barrier.":"Wymagane jest fizyczne oddzielenie; nachylenie i tacka nie stanowią bariery.","Physically separate routing: no wet service above or through electrical rooms":"Oddzielone fizycznie trasy: brak mokrej obsługi nad lub przez pomieszczenia elektryczne","Pick an industry or process, read the attention points it brings, tick the countermeasures you intend to use, and let the tool look for combinations that contradict each other.":"Wybierz branżę lub proces, zapoznaj się z punktami uwagi, jakie on przedstawia, zaznacz środki zaradcze, które zamierzasz zastosować, i pozwól narzędziu poszukać kombinacji, które sobie przeczą.","Pick the industry: the tool lists the attention points that this kind of process brings.":"Wybierz branżę: narzędzie wyświetla listę punktów uwagi, jakie niesie ze sobą ten rodzaj procesu.","Pits, cellars and sumps are the design case; one low extract point rarely solves mixing.":"Przykładem projektu są doły, piwnice i studzienki; jeden niski punkt poboru rzadko rozwiązuje problem mieszania.","Place the intake outside plumes, traffic and the own exhaust":"Umieść wlot poza zasięgiem dymów, ruchu ulicznego i własnego wydechu","Place the recovery surface directly in the untreated process exhaust":"Umieścić powierzchnię odzysku bezpośrednio w nieoczyszczonym spalinie procesowym","Placing the collector outdoors protects the workroom from the vessel, but not from what travels back along the duct. Isolation between collector and process closes that path.":"Umieszczenie kolektora na zewnątrz chroni pomieszczenie robocze przed zbiornikiem, ale nie przed tym, co powraca kanałem. Izolacja między kolektorem a procesem zamyka tę drogę.","Points covered":"Omówione punkty","Positive pressure cascade protecting the clean or product zone":"Kaskada ciśnienia dodatniego chroniąca strefę czystą lub produktową","Powder production, milk powder and dry food processes":"Produkcja proszku, mleko w proszku i przetwórstwo żywności suchej","Predefined access, alarm response and evacuation procedure":"Zdefiniowana procedura dostępu, reagowania na alarmy i ewakuacji","Pressure difference between zones in the pressure cascade example":"Różnica ciśnień między strefami w przykładzie kaskady ciśnień","Pressure difference between zones of different cleanliness":"Różnica ciśnień pomiędzy strefami o różnej czystości","Pressurisation maintained continuously in every mode, including fire":"Ciśnienie utrzymywane jest w sposób ciągły w każdym trybie, łącznie z ogniem","Prevent cleaning aerosol from travelling towards a cleaner zone":"Zapobiegaj przedostawaniu się aerozolu czyszczącego do strefy czystszej","Printing, coating and plastics processing":"Drukowanie, powlekanie i przetwórstwo tworzyw sztucznych","Priority between conflicting functions belongs in a written cause-and-effect matrix.":"Priorytet pomiędzy sprzecznymi funkcjami powinien zostać określony w pisemnej macierzy przyczynowo-skutkowej.","Process Climate Advisor":"Doradca ds. klimatu procesowego","Process enclosure and drying section kept under controlled negative pressure":"Obudowa procesowa i sekcja suszenia utrzymywane pod kontrolowanym ciśnieniem ujemnym","Product requirements":"Wymagania dotyczące produktu","Production, cleaning, drying and standstill are separate modes":"Produkcja, czyszczenie, suszenie i postój to oddzielne tryby","Protected-volume mode; equivalent leakage area 0,010 m²; discharge coefficient 0,65; density 1,20 kg/m³; steady state":"Tryb objętości chronionej; równoważna powierzchnia wycieku 0,010 m²; współczynnik rozładowania 0,65; gęstość 1,20 kg/m³; stan ustalony","Protective coating and material selection for the marine atmosphere":"Powłoki ochronne i dobór materiałów do atmosfery morskiej","Provides the purge time once the source has been isolated":"Zapewnia czas oczyszczania po odizolowaniu źródła","Provides the reference against which the measured wash-out of the room is compared":"Stanowi punkt odniesienia, z którym porównuje się zmierzone wypłukanie pomieszczenia","Provides, together with the mixing factor, the recovery time after a disturbance":"Zapewnia, wraz ze współczynnikiem mieszania, czas regeneracji po zakłóceniu","Purchasable standard":"Standard do kupienia","Push-pull across the open surface towards the extraction slot":"Przesuwanie w kierunku szczeliny ekstrakcyjnej po otwartej powierzchni","Puts a figure on what geometry buys compared with fitting a larger fan":"Przedstawia cenę zakupu geometrii w porównaniu z montażem większego wentylatora","Q = 1,924 m³/s; pressure rise 1800 Pa; overall efficiency 0,65":"Q = 1,924 m³/s; wzrost ciśnienia 1800 Pa; sprawność całkowita 0,65","Radiant and convective heat from furnaces, ovens and molten material":"Ciepło promieniowania i konwekcji z pieców, pieców i stopionego materiału","Radiant screening and insulation of hot surfaces before any air is moved":"Ekranowanie radiacyjne i izolacja gorących powierzchni przed przemieszczaniem powietrza","Radiant temperature and local air speed matter more than the room average.":"Temperatura promieniowania i lokalna prędkość powietrza są ważniejsze niż średnia temperatura w pomieszczeniu.","Radioactive aerosol and gaseous activity":"Aerozol radioaktywny i aktywność gazowa","Rapid humidity peaks from steam, boiling and open water surfaces":"Gwałtowne wzrosty wilgotności spowodowane parą, wrzeniem i otwartymi powierzchniami wody","Rate at which ice builds up on the active coil":"Szybkość gromadzenia się lodu na aktywnej cewce","Rate of rise of carbon dioxide after the loss of regeneration":"Szybkość wzrostu dwutlenku węgla po utracie regeneracji","Re-check the system curve whenever a branch or a filter is changed":"Sprawdź ponownie krzywą systemu za każdym razem, gdy zmieniona zostanie gałąź lub filtr","Read the result: pairs that cannot work together, combinations that need justification, measures usually needed alongside, and everything still open.":"Przeczytaj wynik: pary, które nie mogą ze sobą współpracować, kombinacje, które wymagają uzasadnienia, środki zwykle potrzebne równolegle i wszystko nadal otwarte.","Real bypass, sorbent capacity, temperature and moisture are verified separately":"Rzeczywisty bypass, pojemność sorpcyjna, temperatura i wilgotność są weryfikowane osobno","Real defrost energy is higher: coil mass, evaporation and losses to the air are not counted":"Rzeczywista energia odszraniania jest wyższa: masa wężownicy, parowanie i straty do powietrza nie są brane pod uwagę","Real fan curves and efficiency islands come from the manufacturer; efficiency is not constant":"Rzeczywiste krzywe wentylatorów i wyspy wydajności pochodzą od producenta; wydajność nie jest stała","Real gassing depends on battery type, charging method, temperature and fault mode; the calculation gives a minimum before spatial and failure corrections":"Rzeczywiste gazowanie zależy od typu akumulatora, metody ładowania, temperatury i rodzaju usterki; obliczenia dają minimum przed korektą przestrzenną i awarią","Recirculate filtered room air back to the same zone":"Ponowne wprowadzenie przefiltrowanego powietrza z pomieszczenia do tej samej strefy","Recirculated room air under a unidirectional field is possible but has to be argued: the unidirectional flow is only as clean as what feeds it, so filter integrity, leakage monitoring and the substances present in the room decide whether the recirculation is acceptable.":"Recyrkulacja powietrza w pomieszczeniu w ramach pola jednokierunkowego jest możliwa, ale należy wziąć pod uwagę, że przepływ jednokierunkowy jest tak czysty, jak powietrze, które go zasila, więc integralność filtra, monitorowanie nieszczelności i substancje obecne w pomieszczeniu decydują o tym, czy recyrkulacja jest dopuszczalna.","Recirculation through high-efficiency filtration can be defensible when the release is purely particulate, the filter integrity is tested in place and the substances handled are known and stable. Record that assessment: a filter class on its own is not the argument.":"Recyrkulacja poprzez filtrację wysokosprawną może być uzasadniona, gdy emisja jest czysto cząsteczkowa, integralność filtra jest sprawdzona na miejscu, a substancje, którymi filtr jest stosowany, są znane i stabilne. Należy odnotować tę ocenę: sama klasa filtra nie jest argumentem.","Recovery surfaces placed directly in a greasy, fibrous or dust-laden exhaust become deposit traps and a fire load in the part of the system that was supposed to stay cleanable. Either the recovery is separated from the dirty stream, or the cleanability requirement is dropped — and the design basis has to say which.":"Powierzchnie odzysku umieszczone bezpośrednio w zatłuszczonym, włóknistym lub zapylonym spalinie stają się pułapkami osadów i stanowią obciążenie pożarowe w części systemu, która powinna pozostać łatwa do czyszczenia. Albo odzysk jest oddzielany od zanieczyszczonego strumienia, albo wymóg możliwości czyszczenia zostaje pominięty — a podstawę projektu trzeba określić, który z tych warunków należy zastosować.","Reduction of the required flow when the hood is moved closer":"Zmniejszenie wymaganego przepływu w przypadku bliższego przesunięcia okapu","Redundancy, one train out and loss of power":"Nadmiarowość, jeden pociąg odjechał i utrata zasilania","Redundant trains with automatic changeover for the continuous function":"Pociągi redundantne z automatycznym przełączaniem do pracy ciągłej","Reference air density used in opening-flow and infiltration calculations":"Referencyjna gęstość powietrza stosowana w obliczeniach przepływu i infiltracji","Reference effective ventilation factor at full mixing":"Współczynnik efektywnej wentylacji odniesienia przy pełnym mieszaniu","Refrigerant charge limit and the machinery room requirements that follow from it":"Limit ładunku czynnika chłodniczego i wynikające z niego wymagania dotyczące maszynowni","Refrigerant chosen through both a safety gate and an environmental gate":"Czynnik chłodniczy wybierany przez bramkę bezpieczeństwa i bramkę środowiskową","Refrigerant machinery room with detection and emergency ventilation":"Maszynownia chłodnicza z systemem detekcji i wentylacją awaryjną","Refrigerant safety and machinery room requirements":"Wymagania dotyczące bezpieczeństwa czynników chłodniczych i maszynowni","Regeneration air and burner surfaces of a high-temperature desiccant rotor exceed the maximum surface temperature the zone allows, whether that limit comes from a temperature class or from the product. Either the regeneration section moves outside the limited zone, or another drying principle is chosen.":"Powierzchnie powietrza regeneracyjnego i palnika wysokotemperaturowego wirnika osuszającego przekraczają maksymalną dopuszczalną temperaturę powierzchni w strefie, niezależnie od tego, czy ograniczenie to wynika z klasy temperaturowej, czy z produktu. Sekcja regeneracji albo opuszcza strefę graniczną, albo wybierana jest inna zasada suszenia.","Regeneration temperature and flow of the desiccant rotor":"Temperatura regeneracji i przepływ wirnika osuszającego","Regenerative removal of carbon dioxide and trace contaminants":"Regeneracyjne usuwanie dwutlenku węgla i śladowych zanieczyszczeń","Reheat capacity after the dehumidifying coil":"Wydajność ponownego nagrzewania za wężownicą osuszającą","Reheat the air after the dehumidifying coil":"Podgrzewanie powietrza za wężownicą osuszającą","Rejected power 2,26 kW; radiator temperature 300 K; emissivity 0,85; effective view and duty factor 0,70":"Moc odrzucona 2,26 kW; temperatura radiatora 300 K; emisyjność 0,85; efektywny współczynnik widoczności i pracy 0,70","Rejection threshold in an acceptance measurement of flow":"Próg odrzucenia w pomiarze akceptacji przepływu","Release for work is procedural and instrumented, never a verbal statement.":"Zwolnienie do pracy jest proceduralne i dokumentowane, nigdy nie jest to ustne oświadczenie.","Remaining flow margin in the balance of the protected volume":"Pozostały margines przepływu w saldzie chronionego wolumenu","Removable grease or lint filters upstream of the duct":"Wyjmowane filtry tłuszczu lub kłaczków przed kanałem","Remove the wet growth surface upstream instead of filtering downstream":"Usuń mokrą powierzchnię wzrostu w górnym biegu rzeki zamiast filtrować ją w dolnym biegu rzeki","Repeated opening of a freezer door; outdoor air 25 °C and 60 % relative humidity; store at -20 °C":"Wielokrotne otwieranie drzwi zamrażarki; temperatura powietrza zewnętrznego 25°C i wilgotność względna 60%; przechowywać w temperaturze -20°C","Required availability of the ventilation function":"Wymagana dostępność funkcji wentylacji","Required carbon dioxide removal capacity including a margin":"Wymagana zdolność usuwania dwutlenku węgla, w tym margines","Result of flow times pressure rise divided by the overall efficiency":"Wynik przepływu pomnożony przez wzrost ciśnienia podzielony przez całkowitą sprawność","Return the cleaned collector air to the workroom":"Zwróć oczyszczone powietrze kolektora do warsztatu","Returning collector air is accepted in some jurisdictions when flow and filter condition are monitored continuously and a broken-bag detector is fitted. Check the national rule and the actual dust data before you rely on it.":"W niektórych jurysdykcjach dopuszcza się powrót powietrza z kolektora, pod warunkiem ciągłego monitorowania przepływu i stanu filtra oraz zamontowania czujnika uszkodzonego worka. Przed podjęciem decyzji należy sprawdzić przepisy krajowe i rzeczywiste dane dotyczące zapylenia.","Returning the cleaned collector air to the workroom and routing the captured stream once-through to treatment are two answers for the same substance. If the substance justifies once-through discharge, the collector outlet belongs to that same stream and cannot be returned.":"Zawrócenie oczyszczonego powietrza z kolektora do pomieszczenia roboczego i skierowanie wychwyconego strumienia przepływowego do oczyszczania to dwie odpowiedzi dla tej samej substancji. Jeśli substancja uzasadnia odprowadzanie przepływowe, wylot kolektora należy do tego samego strumienia i nie może zostać zawrócony.","Rime is both a capacity loss and a slip and door-sealing problem.":"Szron jest zarówno przyczyną utraty wydajności, jak i problemem poślizgu i uszczelnienia drzwi.","Room and supply steady for the duration of the test; tracer source switched off at the start; supply concentration 420 ppm":"Pomieszczenie i zasilanie muszą być stabilne przez cały czas trwania testu, źródło sygnału pomiarowego wyłączone na początku, stężenie zasilania 420 ppm","Room cross-draught at which the simple capture relation loses its validity":"Przesunięcie pokoju, w którym prosta relacja przechwytywania traci swoją ważność","Room temperature held continuously within a narrow band":"Temperatura pokojowa utrzymywana stale w wąskim paśmie","Room volume 300 m³; supply 6000 m³/h through a high-efficiency filter; effective mixing and removal factor 0,80; full-mixing model":"Kubatura pomieszczenia 300 m³; dopływ 6000 m³/h przez filtr wysokosprawny; efektywny współczynnik mieszania i usuwania 0,80; model z pełnym mieszaniem","Room volume 500 m³; effective removal factor 0,70; source completely stopped; negligible concentration in the supply":"Kubatura pomieszczenia 500 m³; efektywny współczynnik usuwania 0,70; źródło całkowicie zatrzymane; znikome stężenie w dopływie","Rotary heat or enthalpy wheel between exhaust and supply":"Obrotowe koło ciepła lub entalpii pomiędzy wylotem a nawiewem","Round duct D = 0,35 m; design (nominal) duty; the figure is expressly not a universal limit":"Kanał okrągły D = 0,35 m; obciążenie obliczeniowe (nominalne); wartość ta wyraźnie nie stanowi ograniczenia uniwersalnego","Rule of thumb":"Reguła praktyczna","Rule of thumb: an empirical or experience-based statement; it orders the discussion but proves nothing and must not be used as acceptance evidence.":"Zasada praktyczna: stwierdzenie empiryczne lub oparte na doświadczeniu; porządkuje dyskusję, ale niczego nie udowadnia i nie może być wykorzystywane jako dowód akceptacji.","Rules for the extent of each zone, for the equipment category and temperature class, and for the credit that ventilation may receive":"Zasady dotyczące zasięgu każdej strefy, kategorii urządzeń i klasy temperaturowej oraz uprawnień, jakie może otrzymać wentylacja","Safety margin between the surface temperature and the dew point":"Margines bezpieczeństwa pomiędzy temperaturą powierzchni a punktem rosy","Salt and moisture separation at the air intake":"Separacja soli i wilgoci na wlocie powietrza","Salt, humidity and marine atmosphere":"Sól, wilgotność i atmosfera morska","Same duct D = 0,35 m; flow reduced to 80 % of nominal":"Ten sam kanał D = 0,35 m; przepływ zmniejszony do 80% wartości nominalnej","Selected industry":"Wybrana branża","Semiconductor and micro-electronics production":"Produkcja półprzewodników i mikroelektroniki","Sensible and latent heat sources":"Źródła ciepła jawnego i utajonego","Sensible metabolic heat released by one person":"Ciepło odczuwalne metaboliczne wydzielane przez jedną osobę","Sensor span, accuracy and zero drift not matched to the decisive tolerance; pressure difference between adjacent zones":"Zakres czujnika, dokładność i dryft zera nie odpowiadają tolerancji; różnica ciśnień pomiędzy sąsiadującymi strefami","Separate temperature zone with its own control loop for the product":"Oddzielna strefa temperaturowa z własną pętlą sterowania dla produktu","Separate the hot and cold air paths inside the room":"Oddziel ścieżki ciepłego i zimnego powietrza w pomieszczeniu","Sets the alternating pattern in which one coil works while the other is defrosted":"Ustawia naprzemienny wzór, w którym jedna cewka pracuje, podczas gdy druga jest rozmrażana","Sets the concentration ratio that governs the purge time":"Ustawia współczynnik stężenia, który reguluje czas oczyszczania","Sets the difference that has to be held across an envelope with a known leakage area":"Ustawia różnicę, która musi być zachowana w obrębie koperty o znanym obszarze wycieku","Sets the door regime that governs the infiltration":"Ustawia reżim drzwi, który reguluje infiltrację","Sets the driving density difference behind the draught":"Ustawia różnicę gęstości napędu za przeciągiem","Sets the duct velocity at which the dust stays airborne; it depends on the dust, the duct and the process":"Ustawia prędkość w kanale, przy której pył pozostaje w powietrzu; zależy to od pyłu, kanału i procesu","Sets the head from which, together with flow and efficiency, the power follows":"Ustawia głowicę, z której wraz z przepływem i wydajnością, wypływa moc","Sets the infiltration from which the moisture and ice loads follow":"Ustawia infiltrację, z której wynikają obciążenia wilgocią i lodem","Sets the level at which the atmosphere of the volume is judged":"Ustawia poziom, na którym oceniana jest atmosfera danej objętości","Sets the local air velocity required at the assessment point; it depends on the distance to the source and on the area of the opening":"Ustawia lokalną prędkość powietrza wymaganą w punkcie oceny; zależy ona od odległości od źródła i powierzchni otworu","Sets the lower level watched from the assumed starting content":"Ustawia niższy poziom oglądany od założonej zawartości początkowej","Sets the minimum removal rate at the assumed production and margin":"Ustawia minimalną szybkość usuwania przy założonej produkcji i marży","Sets the per-person share of the internal heat load of the volume":"Ustawia udział obciążenia cieplnego objętości przypadający na jedną osobę","Sets the pressure difference between the protected volume and the unprotected surroundings":"Ustawia różnicę ciśnień między chronioną objętością a otoczeniem niechronionym","Sets the rise in pressure drop against which the fan reserve and the change strategy are judged":"Ustawia wzrost spadku ciśnienia, na podstawie którego oceniana jest rezerwa wentylatora i strategia zmiany","Sets the source strength for the carbon dioxide balance of the volume":"Ustawia siłę źródła dla bilansu dwutlenku węgla w objętości","Sets the source strength for the moisture balance of the volume":"Ustawia siłę źródła dla bilansu wilgoci objętości","Sets the starting point of the psychrometric process":"Ustawia punkt początkowy procesu psychrometrycznego","Sets the two key points of the cool, dehumidify and reheat process":"Ustawia dwa kluczowe punkty procesu chłodzenia, osuszania i ponownego ogrzewania","Settle the battery technology and charging regime, the cell count and whether the charging is interlocked with proven flow":"Ustal technologię baterii i sposób ładowania, liczbę ogniw i to, czy ładowanie jest powiązane ze sprawdzonym przepływem","Settle the coil geometry, the face velocity and the fin spacing with the equipment supplier":"Ustal z dostawcą sprzętu geometrię cewki, prędkość czołową i odstęp między żebrami","Settle the compartment strategy, which function has priority in fire mode and how the damper is actuated and proven":"Ustal strategię przedziału, która funkcja ma pierwszeństwo w trybie ogniowym oraz w jaki sposób uruchamiana i sprawdzana jest klapa","Settle the consequence of losing the function, the acceptable changeover time and the common-cause failures of the two trains":"Rozstrzygnięcie konsekwencji utraty funkcji, akceptowalnego czasu przezbrojenia i wspólnych przyczyn awarii obu pociągów","Settle the contaminant class, the design capture distance, the enclosure geometry and whether a flange or a skirt is fitted":"Określ klasę zanieczyszczeń, odległość przechwytywania projektu, geometrię obudowy oraz to, czy zamontowany jest kołnierz lub fartuch","Settle the dust characteristics, the network layout and the variable-flow operating modes":"Określenie charakterystyki pyłu, układu sieci i trybów pracy przy zmiennym przepływie","Settle the dust explosion characteristics by test, the vessel strength and a safe discharge direction with no personnel access":"Określenie charakterystyki wybuchu pyłu poprzez test, wytrzymałość naczynia i bezpieczny kierunek zrzutu bez dostępu personelu","Settle the equipment inventory, the duty cycle of each item and which part of its heat leaves with a service medium":"Ustal stan zapasów sprzętu, cykl pracy każdego elementu oraz jaka część jego ciepła opuszcza medium serwisowe","Settle the equivalent leakage area by a pressure test, the door opening scenarios and what exactly is protected":"Określ obszar wycieku równoważnego za pomocą próby ciśnieniowej, scenariusze otwierania drzwi i to, co dokładnie jest chronione","Settle the measured deposit or degradation, the consequence of a silent failure and the acceptance criteria recorded at handover":"Rozliczenie zmierzonego depozytu lub degradacji, konsekwencji cichej awarii i kryteriów akceptacji odnotowanych podczas przekazania","Settle the measured outdoor air quality, the particle size that matters for the process and whether in-place testing is required":"Ustal zmierzoną jakość powietrza zewnętrznego, wielkość cząstek mającą znaczenie dla procesu oraz to, czy wymagane jest przeprowadzenie testów na miejscu","Settle the measurement and control uncertainty and map the cold surfaces of the room":"Ustalenie niepewności pomiaru i kontroli oraz mapowanie zimnych powierzchni pomieszczenia","Settle the occupancy state used for qualification and the dominant contamination mechanism":"Ustal stan zajętości używany do kwalifikacji i dominujący mechanizm skażenia","Settle the protected volume, the enclosure integrity test and the shutdown and damper closure that precede release":"Ustalenie objętości chronionej, przeprowadzenie testu integralności obudowy oraz wyłączenie i zamknięcie przepustnicy przed zwolnieniem","Settle the refrigerant and its safety group, the occupancy category of the served spaces and the room volumes":"Ustal czynnik chłodniczy i jego grupę bezpieczeństwa, kategorię zajętości obsługiwanych pomieszczeń oraz kubatury pomieszczeń","Settle the release assessment, the substance properties and the availability that the ventilation can actually be credited with":"Rozstrzygnięcie oceny uwolnienia, właściwości substancji i dostępności, z którą wentylacja może być faktycznie powiązana","Settle the required dew point, the stage arrangement and where the regeneration air and its burner may be placed":"Określ wymagany punkt rosy, układ stopni oraz miejsce, w którym może być umieszczone powietrze regeneracyjne i jego palnik","Settle the site, the exceedance level you accept and the operating hours the design has to cover":"Określ lokalizację, akceptowany poziom przekroczenia i godziny pracy, które musi obejmować projekt","Settle the source strength, the concentration to be held, the mixing effectiveness and the operating mode":"Ustaw moc źródła, stężenie, które ma być utrzymywane, skuteczność mieszania i tryb pracy","Settle the substance inventory, the country whose rules apply and the measurement strategy in real working conditions":"Ustalenie spisu substancji, kraju, którego przepisy obowiązują, oraz strategii pomiaru w rzeczywistych warunkach pracy","Settle the substances and their loads in the stream, the plant category and the immission situation around the site":"Określenie substancji i ich ładunków w strumieniu, kategorii zakładu i sytuacji imisyjnej wokół obiektu","Settle this first":"Najpierw to rozstrzygnij","Several filtration stages in housings that can be tested in place":"Kilka etapów filtracji w obudowach, które można testować na miejscu","Several slopes of the decay curve or scatter between measuring points indicate dead zones, short-circuiting or a varying flow; one point does not prove uniformity":"Kilka nachyleń krzywej zaniku lub rozrzut między punktami pomiarowymi wskazuje na strefy martwe, zwarcia lub zmienny przepływ; jeden punkt nie świadczy o jednorodności","Shaft power of the dust extraction fan in the example":"Moc na wale wentylatora odpylającego w przykładzie","Shared by both":"Współdzielone przez oboje","Shielding and screening between the worker and the radiant source":"Ekranowanie i przesiewanie pomiędzy pracownikiem a źródłem promieniowania","Show a conflict example":"Pokaż przykład konfliktu","Show all categories":"Pokaż wszystkie kategorie","Show only":"Pokaż tylko","Showing only this category":"Pokazywana jest tylko ta kategoria","Shows how far geometry alone reduces the flow that has to be moved":"Pokazuje, jak bardzo sama geometria redukuje przepływ, który należy przesunąć","Shows the case in which the cube law between flow and power does hold":"Pokazuje przypadek, w którym obowiązuje prawo sześcianu między przepływem a mocą","Shows the moisture actually removed as the difference of two humidity ratios":"Pokazuje faktycznie usuniętą wilgoć jako różnicę dwóch współczynników wilgotności","Shows the reserve left for control and for damage at the assumed supply and controlled extract":"Pokazuje rezerwę pozostałą do kontroli i uszkodzeń przy założonym dostarczeniu i kontrolowanym wydobyciu","Shows the risk of losing transport velocity as soon as the flow is modulated":"Pokazuje ryzyko utraty prędkości transportu w momencie modulacji przepływu","Shows the share of the leakage in the supply air balance of the protected volume":"Pokazuje udział nieszczelności w bilansie powietrza nawiewanego do chronionej objętości","Shows what share of the nominal wash-out the room actually uses":"Pokazuje, jaka część nominalnego zużycia wody jest faktycznie wykorzystywana przez pomieszczenie","Shows which atmospheric parameter becomes limiting first":"Pokazuje, który parametr atmosferyczny staje się pierwszy ograniczający","Side-by-side comparison":"Porównanie obok siebie","Size the hood on the peak event, not on the averaged emission":"Dobierz okap do zdarzenia szczytowego, a nie do uśrednionej emisji","Sizing of explosion venting, isolation and suppression on a collector":"Wymiarowanie odpowietrzania, izolacji i tłumienia wybuchu w kolektorze","Smoke extraction with large dedicated make-up openings":"Odciąg dymu z dużymi, dedykowanymi otworami wylotowymi","Smoke extraction with large make-up openings destroys the pressure cascade that keeps the contamination inside its confinement. Where the confinement is a licensed safety function, the fire concept is built around it — with filtered smoke paths and a stated priority — and not against it.":"Oddymianie z dużymi otworami upustowymi niszczy kaskadę ciśnienia, która utrzymuje zanieczyszczenia w ich obrębie. W przypadku, gdy oddymianie jest licencjonowaną funkcją bezpieczeństwa, koncepcja pożaru jest zbudowana wokół niego – z filtrowanymi ścieżkami dymu i określonym priorytetem – a nie przeciwko niemu.","Smoke mode moves flows and opens make-up paths far beyond anything the containment balance was designed for. The fire scenario has to be resolved as a separate operating state with a stated priority, not laid on top of the containment setpoints.":"Tryb dymowy powoduje ruch przepływów i otwiera drogi uzupełniające znacznie wykraczające poza możliwości, jakie zostały przewidziane w równowadze bezpieczeństwa. Scenariusz pożaru musi zostać rozwiązany jako oddzielny stan operacyjny z określonym priorytetem, a nie nałożony na punkty nastaw bezpieczeństwa.","Smoke mode with large make-up openings and a negative-pressure containment of the hazardous zone are two states of the same building. They coexist only if the priority between them is written down, the smoke path is defined and the loss of containment is knowingly accepted for the duration of the fire.":"Tryb dymowy z dużymi otworami upustowymi i podciśnieniowa izolacja strefy zagrożonej to dwa stany tego samego budynku. Współistnieją one tylko wtedy, gdy priorytet między nimi jest zapisany, droga dymu jest zdefiniowana, a utrata izolacji jest świadomie akceptowana przez cały czas trwania pożaru.","Smoke or tracer test at representative door and process states":"Test dymu lub smugów w reprezentatywnych stanach drzwi i procesu","Solvent vapour and monomer release from lines, mixing and cleaning":"Uwalnianie oparów rozpuszczalników i monomerów z linii, mieszania i czyszczenia","Solvent; source completely isolated; entry only after measurement; flammability and toxicity need separate thresholds":"Rozpuszczalnik; źródło całkowicie odizolowane; wejście dopiero po dokonaniu pomiaru; palność i toksyczność wymagają osobnych progów","Something is wrong with the content of this page: part of it may be missing or inconsistent. Do not rely on the lists and answers shown here. Please reload the page.":"Wystąpił błąd w treści tej strony: część może być niekompletna lub niespójna. Nie należy polegać na listach i odpowiedziach wyświetlanych tutaj. Prosimy o ponowne załadowanie strony.","Source basis":"Podstawa źródłowa","Source capture only works when the extracted volume is replaced in a controlled way. Without planned make-up air the room goes into depression, doors bind, combustion appliances misbehave and the hood loses its capture velocity.":"Wychwytywanie u źródła działa tylko wtedy, gdy wychwytywana objętość powietrza jest uzupełniana w sposób kontrolowany. Bez zaplanowanego uzupełniania powietrza w pomieszczeniu dochodzi do podciśnienia, drzwi się zacinają, urządzenia spalające nie działają prawidłowo, a okap traci prędkość wychwytywania.","Source layer":"Warstwa źródłowa","Space, weight and maintenance access constrain the installation":"Przestrzeń, waga i dostęp do konserwacji ograniczają instalację","Spark detection and extinguishing in the duct upstream of the filter":"Wykrywanie i gaszenie iskier w kanale przed filtrem","Specific heat gain of the process equipment":"Właściwy zysk ciepła urządzeń procesowych","Speed ratio 0,80 with the changed system 400 + 50 Q²; the actual point is 2,36 m³/s at 679 Pa and 2,29 kW":"Przełożenie 0,80 przy zmienionym układzie 400 + 50 Q²; rzeczywisty punkt to 2,36 m³/s przy 679 Pa i 2,29 kW","Speed ratio 0,80; system unchanged at 200 + 24 Q²; same fan; efficiency taken as 0,70":"Współczynnik prędkości 0,80; układ bez zmian przy 200 + 24 Q²; ten sam wentylator; wydajność przyjęta jako 0,70","Spot cooling improves the worker's condition by raising the local air speed, which is exactly what the open product or bath does not tolerate. Aim the jet at the operator, never across the product, and verify with smoke.":"Chłodzenie punktowe poprawia warunki pracy pracownika poprzez zwiększenie lokalnej prędkości powietrza, czego nie toleruje otwarty produkt lub wanna. Skieruj strumień powietrza na operatora, nigdy prostopadle do produktu, i sprawdź za pomocą dymu.","Stack pressure depends on height and on density difference; it reverses when the process stops.":"Ciśnienie w kominie zależy od wysokości i różnicy gęstości; odwraca się, gdy proces się kończy.","Standard":"Norma","Standard: a published technical standard covers this point; it is not law by itself unless it is referenced by law or by contract.":"Norma: opublikowana norma techniczna obejmuje tę kwestię; sama w sobie nie stanowi prawa, dopóki nie powoła się na nią ustawa lub umowa.","Standing water inside an air handling unit is a design fault, not a maintenance detail.":"Stojąca woda wewnątrz jednostki przetwarzania powietrza jest wadą konstrukcyjną, a nie kwestią konserwacji.","Start concentration and entry threshold in the purge example":"Początkowe stężenie i próg wejścia w przykładzie oczyszczania","Start here":"Zacznij tutaj","Start the extraction before the emission event, not after it":"Uruchom wyciąg przed zdarzeniem emisyjnym, nie po nim","Start-up, purge and safe release for maintenance":"Uruchomienie, przedmuchanie i bezpieczne zwolnienie w celu konserwacji","Status":"Status","Steady incompressible approximation at limited pressure differences; equivalent free opening":"Stałe przybliżenie nieściśliwe przy ograniczonych różnicach ciśnień; równoważne swobodne otwarcie","Steady state; constant representative densities assumed; with stratification the pressure is integrated over the height":"Stan ustalony; przyjęto stałe gęstości reprezentatywne; w przypadku stratyfikacji ciśnienie jest integrowane po wysokości","Steady state; dry-air mass flow 2,00 kg/s; inlet 30 °C and 60 % relative humidity at 101,325 kPa":"Stan ustalony; przepływ masy suchego powietrza 2,00 kg/s; wlot 30 °C i wilgotność względna 60% przy 101,325 kPa","Steam plume from open hot vessels and boiling":"Z otwartych gorących naczyń i wrzących wydobywa się para wodna","Sticky aerosol fouls coils, dampers and fire dampers faster than the schedule assumes.":"Lepki aerozol zanieczyszcza wężownice, przepustnice i klapy przeciwpożarowe szybciej, niż zakłada harmonogram.","Still open":"Nadal otwarte","Stopping the fans removes the very pressure that keeps the barrier standing. If a zone has to remain pressurised during a fire, the fire mode must state which fans keep running, on which power supply, where their air comes from and what happens to the smoke they push.":"Zatrzymanie wentylatorów usuwa ciśnienie, które utrzymuje barierę w pozycji stojącej. Jeśli strefa musi pozostać pod ciśnieniem podczas pożaru, tryb pożarowy musi określać, które wentylatory nadal pracują, z którego źródła zasilania korzystają, skąd pochodzi powietrze i co dzieje się z dymem, który wypychają.","Stopping the supply and extract fans in fire mode and running a dedicated smoke extraction with large make-up openings are two different fire strategies for the same compartment. One takes the air movement away, the other creates it on purpose; a compartment is built for one of them, not for both at once. Which one applies follows from the fire safety concept, not from the ventilation design.":"Zatrzymanie wentylatorów nawiewnych i wywiewnych w trybie pożarowym oraz uruchomienie dedykowanego systemu oddymiania z dużymi otworami nawiewnymi to dwie różne strategie przeciwpożarowe dla tej samej komory. Jedna ogranicza ruch powietrza, druga celowo go tworzy; komora jest budowana dla jednej z nich, a nie dla obu jednocześnie. Wybór odpowiedniej strategii wynika z koncepcji bezpieczeństwa pożarowego, a nie z projektu wentylacji.","Submarines, submersibles and spacecraft life support":"Podtrzymywanie życia na okrętach podwodnych, okrętach podwodnych i statkach kosmicznych","Summary card":"Karta podsumowująca","Supply 5000 m³/h; controlled extract 3000 m³/h; leakage 478 m³/h at 250 Pa":"Dopływ 5000 m³/h; kontrolowany wyciąg 3000 m³/h; wyciek 478 m³/h przy 250 Pa","Surface condensation on ceilings, ducts and cable trays":"Kondensacja powierzchniowa na sufitach, kanałach i korytkach kablowych","System curve 200 + 24 Q²; fan curve 1200 - 16 Q², with flow in m³/s and pressure in Pa; efficiency taken as 70 %":"Krzywa układu 200 + 24 Q²; krzywa wentylatora 1200 - 16 Q², z przepływem w m³/s i ciśnieniem w Pa; sprawność przyjęta jako 70%","Target overpressure of a protected volume":"Docelowe nadciśnienie chronionej objętości","Temperature cables and gas indication inside the silo":"Kable temperaturowe i wskaźniki gazu wewnątrz silosu","Test the fire mode together with the process supplier":"Przetestuj tryb pożaru wspólnie z dostawcą procesu","Test with a deliberate disturbance: door open, one train out, filter loaded":"Test z celowym zakłóceniem: otwarte drzwi, jeden pociąg wyjechał, filtr obciążony","Textile finishing and industrial laundries":"Wykańczanie tekstyliów i pralnie przemysłowe","The calculation does not demonstrate a protection factor: filter leakage, bypass, airlock use and agent carry-over are assessed separately":"Obliczenia nie wykazują współczynnika ochrony: nieszczelność filtra, obejście, użycie śluzy powietrznej i przeniesienie środka są oceniane oddzielnie","The calculation does not predict a cleanliness class; with unidirectional flow or a dominant local source the full-mixing model does not apply":"Obliczenia nie przewidują klasy czystości; w przypadku przepływu jednokierunkowego lub dominującego źródła lokalnego model pełnego mieszania nie ma zastosowania","The collector must not become the path that carries flame back to the machines.":"Kolektor nie może stać się ścieżką niosącą płomień z powrotem do maszyn.","The comparison names the attention points only the first industry brings, the ones only the second brings, and the ones both carry, with the measures each side offers for its own points. It is a way of borrowing a question from a neighbouring process, not a statement that two processes are alike.":"Porównanie pokazuje punkty właściwe tylko pierwszej branży, tylko drugiej oraz wspólne dla obu, wraz ze środkami dostępnymi po każdej stronie. Służy to zapożyczeniu pytania z procesu sąsiedniego, a nie stwierdzeniu, że oba procesy są podobne.","The cube law applies only to similar operating points of one fan in an unchanged system":"Prawo sześcianu obowiązuje tylko w przypadku podobnych punktów pracy jednego wentylatora w niezmienionym układzie","The current selection was checked against the rules of this page and none of them objects to it. That is not a proof of correctness: these rules are a limited, non-exhaustive list, and an incompatibility they do not describe passes unnoticed.":"Aktualny wybór został sprawdzony pod kątem zgodności z regulaminem tej strony i nikt nie wyraził sprzeciwu. Nie jest to jednak dowód jego poprawności: regulaminy te stanowią ograniczoną, niewyczerpującą listę, a niezgodność, której nie opisują, pozostaje niezauważona.","The curtain and the airlock cover the same opening duty. Decide which one carries the barrier function; a curtain in front of an airlock usually adds energy use and a false sense of separation rather than performance.":"Kurtyna i śluza powietrzna pełnią tę samą funkcję otwierania. Należy zdecydować, która z nich pełni funkcję bariery; kurtyna przed śluzą powietrzną zazwyczaj zwiększa zużycie energii i stwarza złudne poczucie oddzielenia, a nie wydajność.","The curtain jet entrains room air and generates strong turbulence exactly where the unidirectional field has to stay undisturbed. One of the two has to move away from the open product, and the visualisation test will show which.":"Strumień kurtynowy unosi powietrze z pomieszczenia i generuje silne turbulencje dokładnie tam, gdzie pole jednokierunkowe musi pozostać niezakłócone. Jeden z nich musi oddalić się od otwartego produktu, a test wizualny pokaże, który.","The data card calls these didactic example data; for a project the equipment curves are used":"Karta danych zawiera przykładowe dane dydaktyczne; w projekcie wykorzystuje się krzywe sprzętu","The design figure is tied to the mission profile and the duration of the emergency mode; the local concentration around people can bind earlier than the volume average":"Wartość projektu jest powiązana z profilem misji i czasem trwania trybu awaryjnego; lokalne skupisko wokół ludzi może zostać osiągnięte wcześniej niż średnia objętość","The edition in force is verified with the issuing body.":"Obowiązujące wydanie weryfikowane jest u organu wydającego.","The engines draw their combustion air directly from the machinery space":"Silniki pobierają powietrze do spalania bezpośrednio z przestrzeni maszynowej","The environmental legislation and the site permit of the country of the project":"Przepisy dotyczące ochrony środowiska i pozwolenie na lokalizację kraju, w którym realizowany jest projekt","The equivalent opening is best determined by a pressure test, not by measuring gaps":"Równoważny otwór najlepiej określić za pomocą próby ciśnieniowej, a nie poprzez pomiar szczelin","The example is declared non-normative; the local concentration around people can become limiting before the volume average":"Przykład jest jawnie nienormatywny; lokalne stężenie w otoczeniu ludzi może stać się ograniczające wcześniej niż średnie stężenie w całej objętości","The exhaust is often the largest single load and the hardest one to recover cleanly.":"Spaliny stanowią często największą pojedynczą dawkę i są najtrudniejsze do odzyskania w sposób czysty.","The figure applies to the active battery while the second one is defrosting":"Rysunek dotyczy aktywnego akumulatora, podczas gdy drugi się rozmraża","The figure belongs to one particular door regime and to the assumed outdoor condition":"Rysunek odnosi się do konkretnego systemu drzwi i zakładanych warunków zewnętrznych","The figure holds for that one diameter and does not transfer to another network":"Wartość ta obowiązuje dla tej jednej średnicy i nie przenosi się do innej sieci","The figure is obtained before corrections for flow disturbance; confirm with a smoke picture":"Dane uzyskano przed uwzględnieniem korekty zakłóceń przepływu; należy je potwierdzić za pomocą zdjęcia dymu.","The figures inside an entry read identically in all seven languages":"Wartości liczbowe we wpisie są identyczne we wszystkich siedmiu językach","The five categories and the two statuses — click any of them to read its meaning:":"Pięć kategorii i dwa statusy — kliknij dowolny z nich, aby przeczytać jego znaczenie:","The formula material on cooling and dehumidifying coils":"Materiał formuły na wężownice chłodzące i osuszające","The formula material on surface condensation; the criterion is given, the margin is not":"Wzór materiału na kondensację powierzchniową; kryterium jest podane, margines nie jest","The lists of attention points and measures are not exhaustive; a real process can present hazards and requirements absent from this library.":"Listy punktów uwagi i środków zaradczych nie są wyczerpujące; rzeczywisty proces może wiązać się z zagrożeniami i wymaganiami, których nie ma w tej bibliotece.","The loaded filter is process material and needs a defined route out.":"Zużyty filtr zawiera materiał procesowy i wymaga zdefiniowanej drogi usunięcia.","The material calls this a minimum before corrections for the distribution in the room and for failures":"W materiale określono to jako minimum przed poprawkami dotyczącymi rozkładu w pomieszczeniu i błędami","The material calls this an example input of the calculation, not a regulatory limit; confirm with a smoke picture and a velocity measurement":"W materiale tym podano przykładowe dane wejściowe obliczeń, a nie limit regulacyjny; należy to potwierdzić za pomocą zdjęcia dymnego i pomiaru prędkości","The material does not attribute the figure to legislation in force; the current edition and the national rules are checked with the competent authority":"W materiale nie przypisano tej liczby do obowiązujących przepisów; bieżąca edycja i przepisy krajowe zostały sprawdzone przez właściwy organ","The material expressly forbids adding this figure to the calculated velocity; a test at the source is needed":"W materiale wyraźnie zabrania się dodawania tej wartości do obliczonej prędkości; konieczne jest przeprowadzenie testu u źródła","The material expressly forbids treating this factor as a fixed property of the system":"Materiał wyraźnie zabrania traktowania tego czynnika jako stałej właściwości układu","The material on air change and ventilation effectiveness, which refuses a generic figure":"Materiał dotyczący wymiany powietrza i efektywności wentylacji, który nie podaje ogólnej liczby","The material on commissioning proof and periodic re-verification":"Materiał dotyczący dowodu uruchomienia i okresowej ponownej weryfikacji","The material on deep dehumidification, which describes the arrangement but fixes no temperature":"Materiał dotyczący głębokiego osuszania, który opisuje układ, ale nie ustala temperatury","The material on internal loads, which prescribes an inventory instead of a generic figure":"Materiał dotyczący obciążeń wewnętrznych, który zaleca inwentaryzację zamiast ogólnej liczby","The material on outdoor air intake, which refers the design conditions to the project design basis":"Materiał dotyczący dopływu powietrza zewnętrznego, w którym odniesiono warunki projektowe do podstawy projektu","The material on redundancy and on behaviour when one train is out":"Materiał na temat redundancji i zachowania podczas postoju jednego pociągu","The material requires separate alarm and entry thresholds for flammability, toxicity and measurement uncertainty":"Materiał wymaga osobnych progów alarmowych i wejściowych dla palności, toksyczności i niepewności pomiaru","The material states that the required transport velocity depends on the dust and the process and is not treated as a universal limit":"W materiale podano, że wymagana prędkość transportu zależy od pyłu i procesu i nie jest traktowana jako uniwersalna granica","The material warns that this is an assumption, not a general value; measured door use is worth more than a fixed infiltration coefficient":"W materiale ostrzega się, że jest to założenie, a nie wartość ogólna; zmierzone użycie drzwi jest ważniejsze niż stały współczynnik infiltracji","The material warns that this is not a flight design: solar input, Earth view, degradation and peak modes are not included":"W materiale ostrzega się, że nie jest to projekt lotu: nie uwzględniono danych wejściowych ze słońca, widoku Ziemi, degradacji ani trybów szczytowych","The material warns that this is not a universal requirement; people, doors, materials and leakage often carry more moisture than the outdoor air":"W materiale ostrzega się, że nie jest to wymóg uniwersalny; ludzie, drzwi, materiały i przecieki często przenoszą więcej wilgoci niż powietrze zewnętrzne","The measurement method, the sampling points and the occupancy state are fixed separately; the calculation does not replace qualification":"Metoda pomiaru, punkty poboru próbek i stan zajętości ustalane są oddzielnie; obliczenia nie zastępują kwalifikacji","The model holds only where the decay is approximately exponential":"Model ten jest ważny tylko wtedy, gdy rozpad jest w przybliżeniu wykładniczy","The moisture limit follows from the material, not from the working hours.":"Limit wilgotności wynika z materiału, a nie z czasu pracy.","The moisture limit follows from the material, not from the working schedule. Hygroscopic material takes up water during the hours when the plant is off, and the first shift is then spent recovering a condition that should never have been lost.":"Limit wilgotności wynika z materiału, a nie z harmonogramu pracy. Materiał higroskopijny chłonie wodę w godzinach, gdy zakład jest wyłączony, a pierwsza zmiana jest wtedy poświęcana na przywrócenie warunków, które nigdy nie powinny zostać utracone.","The national occupational health legislation of the country of the project":"Krajowe przepisy dotyczące zdrowia zawodowego obowiązujące w kraju realizacji projektu","The outdoor air fraction cannot be large and small at the same time. Free cooling with a large untreated outdoor fraction and a high recirculation ratio with a small, deeply dried outdoor fraction are two positions of the same damper. Decide in which operating states each of them is allowed and write them down separately.":"Udział powietrza zewnętrznego nie może być jednocześnie duży i mały. Chłodzenie swobodne z dużą, nieoczyszczoną frakcją powietrza zewnętrznego i wysoki współczynnik recyrkulacji z małą, głęboko osuszoną frakcją powietrza zewnętrznego to dwa położenia tej samej przepustnicy. Określ, w jakich stanach pracy każdy z nich jest dozwolony i zapisz je osobno.","The reference is carried in the markup of the page rather than printed on screen: the source material keeps its own item numbering, and that numbering is not published on this site. What the entry does show is the figure, the assumptions it was obtained under, and where the primary source is to be looked for.":"Odniesienie znajduje się w znacznikach strony, a nie jest drukowane na ekranie: materiał źródłowy ma własną numerację pozycji, która nie jest publikowana na tej stronie. Wpis zawiera jedynie informację o rysunku, założeniach, na podstawie których go uzyskano, oraz o tym, gdzie należy szukać źródła pierwotnego.","The relation is a geometric design aid, not a universal normative equation":"Relacja ta jest pomocą w projektowaniu geometrycznym, a nie uniwersalnym równaniem normatywnym","The roof zone can carry a high thermal and fire load while the floor still feels comfortable.":"Strefa dachowa może przenosić duże obciążenie termiczne i ogniowe, a podłoga nadal zapewnia komfort.","The scrubbing liquor becomes an effluent, a corrosion agent and a freezing risk of its own. Its chemistry belongs in the material selection and in the discharge permit, not only in the abatement efficiency figure.":"Płyn płuczący staje się ściekiem, czynnikiem korozyjnym i sam w sobie stwarza ryzyko zamarzania. Jego skład chemiczny ma wpływ na dobór materiału i pozwolenie na zrzut, a nie tylko na wskaźnik skuteczności oczyszczania.","The sector guidance on local exhaust ventilation, in its part on capture devices":"Wytyczne sektorowe dotyczące lokalnej wentylacji wyciągowej, w części dotyczącej urządzeń wychwytujących","The source grows with temperature, so moisture and heat reinforce each other.":"Źródło rośnie wraz z temperaturą, dlatego wilgoć i ciepło wzmacniają się wzajemnie.","The source-basis categories separate law from standard from practice, but no legal text is reproduced or interpreted here; the competent authority remains the deciding party.":"Kategorie źródłowe oddzielają prawo, standard i praktykę, ale w niniejszym tekście nie przytacza się ani nie interpretuje żadnego tekstu prawnego; stroną decydującą pozostaje właściwy organ.","The specification states span, accuracy, repeatability, response time, drift, ambient conditions and the calibration method":"Specyfikacja określa zakres, dokładność, powtarzalność, czas reakcji, dryft, warunki otoczenia i metodę kalibracji","The standard and guidance family on dust extraction installations":"Rodzina norm i wytycznych dotyczących instalacji odpylających","The standard family on air filter classification and on filter testing":"Standardy rodzinne dotyczące klasyfikacji filtrów powietrza i testowania filtrów","The standard family on area classification for flammable gas, vapour and combustible dust":"Standardowa rodzina klasyfikacji obszarów występowania gazów palnych, par i pyłów palnych","The standard family on cleanroom classification and monitoring":"Standardowa rodzina klasyfikacji i monitorowania pomieszczeń czystych","The standard family on cleanroom design and on hygienic zoning":"Standardowa rodzina w zakresie projektowania pomieszczeń czystych i stref higienicznych","The standard family on dust explosion protection of equipment":"Standardowa rodzina zabezpieczeń urządzeń przed wybuchem pyłu","The standard family on fire dampers, ducts and smoke control":"Standardowa rodzina klap przeciwpożarowych, kanałów i systemów kontroli dymu","The standard family on gaseous extinguishing systems":"Standardowa rodzina systemów gaśniczych gazowych","The standard family on refrigerating system safety and environmental requirements":"Standardy rodzinne dotyczące bezpieczeństwa układów chłodniczych i wymagań środowiskowych","The standard family on stationary battery installations":"Standardowa rodzina w stacjonarnych instalacjach akumulatorowych","The three layers are shown apart so that a figure from a worked example never looks like a requirement laid down by a document:":"Trzy warstwy pokazane są oddzielnie, tak aby rysunek z przykładu roboczego nigdy nie wyglądał jak wymóg określony w dokumencie:","The two statements name different primary barriers for the same release. In the hierarchy of control a source that can be enclosed or captured must be, and general dilution is at most the secondary layer; the design basis has to say which one carries the duty.":"Te dwa stwierdzenia wymieniają różne bariery pierwotne dla tego samego uwolnienia. W hierarchii kontroli musi znajdować się źródło, które można zamknąć lub przechwycić, a ogólne rozcieńczenie to co najwyżej warstwa wtórna; podstawa projektowa musi określić, która z nich pełni funkcję.","The typical set is a starting selection for this industry against which no rule of this page objects; edit it to match your own process. The conflict example ticks two measures of this industry that cannot be used together and states the reason.":"Typowy zestaw jest punktem wyjścia dla tej branży i nie narusza żadnej reguły tej strony; dostosuj go do własnego procesu. Przykład konfliktu zaznacza dwa środki, których nie można stosować razem, i podaje przyczynę.","The ventilation can become the hidden common-cause failure of the safety function.":"Wentylacja może stać się ukrytą, wspólną przyczyną awarii funkcji bezpieczeństwa.","The window applies at the product, not at the room sensor on the wall.":"Okno dotyczy produktu, a nie czujnika pokojowego umieszczonego na ścianie.","Theoretical minimum energy for one defrost":"Teoretyczna minimalna energia na jedno rozmrożenie","Thermal oxidiser or solvent recovery on the collected exhaust":"Utleniacz termiczny lub odzysk rozpuszczalnika z zebranych spalin","Thermal stratification and buoyancy in a tall hall":"Stratyfikacja termiczna i wyporność w wysokiej hali","These are two mutually exclusive cleaning regimes for the same room. The choice determines the moisture load, the drainage, the surface finish, the electrical protection and the drying time, so it cannot be left open in the design basis.":"To dwa wzajemnie wykluczające się sposoby czyszczenia tego samego pomieszczenia. Wybór ten determinuje obciążenie wilgocią, drenaż, wykończenie powierzchni, ochronę elektryczną i czas schnięcia, dlatego nie można go pozostawić bez odpowiedzi w projekcie.","These rooms usually need overpressure and a filtered, dry supply of their own.":"Takie pomieszczenia zwykle wymagają nadciśnienia oraz własnego filtrowanego, suchego nawiewu.","These two act on different streams: the captured stream goes once-through to treatment, while the general room air is partly returned. That combination is normal in solvent, welding and pharmaceutical plants, but it has to be argued: particle filters do not remove vapours or gases, and for carcinogenic, mutagenic or reprotoxic agents the hierarchy of control demands removal rather than a dilution loop. State the substance, the residual room concentration and the monitoring that carries the return.":"Te dwa systemy działają na różne strumienie: strumień wychwycony przepływa jednorazowo do oczyszczania, podczas gdy powietrze w pomieszczeniu jest częściowo zawracane. Taka kombinacja jest powszechna w zakładach produkujących rozpuszczalniki, spawalniczych i farmaceutycznych, ale należy podkreślić, że filtry cząstek stałych nie usuwają oparów ani gazów, a w przypadku czynników rakotwórczych, mutagennych lub reprotoksycznych hierarchia kontroli wymaga usuwania, a nie pętli rozcieńczania. Należy podać nazwę substancji, stężenie resztkowe w pomieszczeniu oraz sposób monitorowania, który obejmuje zawracanie.","This attention point was already covered by another ticked measure.":"Ten punkt wymagający uwagi był już pokryty innym zaznaczonym środkiem.","This is a minimum modelled time; the actual release for entry follows a measurement only":"Jest to minimalny modelowany czas; rzeczywiste wydanie do wejścia następuje wyłącznie po pomiarze","This item":"Ten przedmiot","This page structures the questions to ask. It contains no flow rates, no pressures, no equipment selection and no compliance verdict. Nothing here replaces a project design basis, a hazard assessment or a decision of the competent authority.":"Ta strona zawiera strukturę pytań, które należy zadać. Nie zawiera ona żadnych danych dotyczących natężenia przepływu, ciśnień, doboru sprzętu ani oceny zgodności. Nic tutaj nie zastępuje podstawy projektu, oceny zagrożeń ani decyzji właściwego organu.","Tick a measure straight from here:":"Zaznacz środek bezpośrednio tutaj:","Tick a measure: the attention point it closes is marked at once and the result panel answers immediately.":"Zaznacz środek: odpowiadający mu punkt zostanie od razu oznaczony jako pokryty, a panel wyników natychmiast pokaże konsekwencje.","Tick or untick a measure to see its immediate effect here.":"Zaznacz lub odznacz środek, aby zobaczyć jego natychmiastowy efekt.","Time to a limit value after loss of heat rejection becomes a primary design parameter.":"Czas do osiągnięcia wartości granicznej po utracie odprowadzenia ciepła staje się podstawowym parametrem projektowym.","Tools":"Narzędzia","Total fan pressure rise assumed in the dust extraction example":"Całkowity wzrost ciśnienia wentylatora przyjęty w przykładzie odpylania","Total flooding extinguishing system in the space":"Całkowite zalanie wodą w pomieszczeniu poprzez system gaśniczy","Total flooding needs a closed, evacuated space and a defined hold time for the agent concentration. Ventilation that cannot be stopped removes the agent and the hold time, so the space then has neither a working extinguishing system nor a defensible ventilation function.":"Całkowite zalanie wymaga zamkniętej, ewakuowanej przestrzeni i określonego czasu utrzymywania stężenia środka gaśniczego. Wentylacja, której nie można zatrzymać, usuwa środek gaśniczy i czas utrzymywania, w związku z czym przestrzeń nie ma sprawnego systemu gaśniczego ani funkcji wentylacji obronnej.","Total flooding needs a closed, evacuated space and a defined hold time.":"Do całkowitego zalania potrzebna jest zamknięta, ewakuowana przestrzeń i określony czas zatrzymania.","Total internal heat load of a closed habitable module":"Całkowite wewnętrzne obciążenie cieplne zamkniętego modułu mieszkalnego","Total open time of the door per hour":"Całkowity czas otwarcia drzwi na godzinę","Total supply air to the machinery space including combustion air":"Całkowita ilość powietrza dostarczanego do maszynowni, wliczając powietrze do spalania","Toxic, corrosive or reactive process gas":"Toksyczny, żrący lub reaktywny gaz procesowy","Trace contaminants accumulating in a closed atmosphere":"Śladowe zanieczyszczenia gromadzące się w zamkniętej atmosferze","Traced to a named file and line of the worked reference material.":"Śledzono do nazwanego pliku i wiersza opracowanego materiału referencyjnego.","Transport velocity required in dust extraction ducts":"Prędkość transportu wymagana w kanałach odpylających","Trays, traps and drains must be reachable and demonstrably working, in every season.":"Tacki, syfony i odpływy muszą być łatwo dostępne i działać prawidłowo, niezależnie od pory roku.","Two measures that cannot be combined have been ticked on purpose. The physical or regulatory reason is stated below.":"Celowo zaznaczono dwa pola, których nie można połączyć. Przyczyna fizyczna lub prawna jest podana poniżej.","Two parallel batteries; the second takes the full flow during defrost; inlet 2 °C and 90 % relative humidity, outlet -8 °C taken as saturated; dry-air mass flow 1,20 kg/s":"Dwie równoległe baterie; druga przejmuje cały przepływ podczas odszraniania; wlot 2 °C i wilgotność względna 90%, wylot -8 °C przyjmowany jako nasycony; przepływ masowy powietrza suchego 1,20 kg/s","Typical measures offered only here":"Typowe środki oferowane tylko tutaj","Unbroken cold chain: no heat is introduced into the product zone itself":"Nieprzerwany łańcuch chłodniczy: do strefy produktu nie jest wprowadzane żadne ciepło","Uncertainty must not be used to cover an evident shortfall; the acceptance rule is fixed in advance":"Niepewność nie może być wykorzystywana do pokrycia ewidentnego niedoboru; reguła akceptacji jest ustalona z góry","Unidirectional low-turbulence protection directly over the open product":"Jednokierunkowa ochrona przed niskimi turbulencjami bezpośrednio nad otwartym produktem","Unticked. The attention point stays covered by another measure.":"Odznaczono. Punkt wymagający uwagi pozostaje pokryty innym środkiem.","Unticked. This attention point is open again:":"Odznaczone. Ten punkt uwagi jest ponownie otwarty:","Untreated outdoor air is the dominant moisture source for a dry room during most of the year. Free cooling with a large outdoor fraction defeats the very function the dew-point limit represents, and the two cannot be scheduled against the same room.":"Nieuzdatnione powietrze zewnętrzne jest dominującym źródłem wilgoci w suchym pomieszczeniu przez większość roku. Chłodzenie swobodne z dużą zawartością powietrza zewnętrznego niweczy funkcję, jaką pełni limit punktu rosy, a ich obu nie da się zaplanować dla tego samego pomieszczenia.","Usable oxygen reserve and the time to the lower assessment value":"Zapas tlenu możliwy do wykorzystania i czas do osiągnięcia dolnej wartości oceny","Use general dilution ventilation as the primary control":"Jako kontrolę podstawową należy stosować wentylację rozcieńczającą ogólną","Usually needed alongside:":"Zwykle potrzebne obok:","Validated drying mode after wet cleaning":"Zatwierdzony tryb suszenia po czyszczeniu na mokro","Values taken from the worked examples and data sets of the reference material, each with the assumptions under which it was obtained and with the file it was traced to. They are examples of a calculation, not limits laid down by a document.":"Wartości pobrane z opracowanych przykładów i zestawów danych z materiału referencyjnego, z uwzględnieniem założeń, na podstawie których zostały uzyskane, oraz pliku, do którego zostały odniesione. Są to przykłady obliczeń, a nie limity określone w dokumencie.","Variable flow must not lead to settling in inactive branches; shut-off dampers are tested together with the system":"Zmienny przepływ nie może powodować osiadania w nieaktywnych gałęziach; przepustnice odcinające są testowane razem z systemem","Velocity in the same duct when the flow is turned down":"Prędkość w tym samym kanale, gdy przepływ jest zmniejszony","Vent area, isolation and suppression requirements derived from the tested dust characteristics":"Wymagania dotyczące obszaru odpowietrzania, izolacji i tłumienia wynikające z badanych charakterystyk pyłu","Ventilation credited only with proven effectiveness and availability":"Wentylacja uznawana jedynie za metodę o udowodnionej skuteczności i dostępności","Ventilation effectiveness 0,82; air change 2,5 1/h; background 420 ppm; source switched off; approximately exponential decay":"Skuteczność wentylacji 0,82; wymiana powietrza 2,5 1/h; tło 420 ppm; źródło wyłączone; zanik w przybliżeniu wykładniczy","Ventilation is a fire connection between compartments before it is a safety measure.":"Wentylacja jest najpierw połączeniem ogniowym między przedziałami, a dopiero potem środkiem bezpieczeństwa.","Ventilation may reduce a zone only if its effectiveness and availability are demonstrated.":"Wentylacja może zmniejszyć strefę tylko wtedy, gdy udowodniona zostanie jej skuteczność i dostępność.","Ventilation of this space runs continuously and cannot be stopped":"Wentylacja tego pomieszczenia działa w sposób ciągły i nie można jej zatrzymać","Ventilation requirement for a room where batteries are charged":"Wymagania dotyczące wentylacji pomieszczenia, w którym ładowane są baterie","Ventilation supports the entry permit; it does not replace it.":"Wentylacja wspomaga uzyskanie pozwolenia na wstęp, ale go nie zastępuje.","Very low dew-point requirement of the process":"Bardzo niskie wymagania dotyczące punktu rosy procesu","Vibration, motion and structural interfaces":"Wibracje, ruch i interfejsy strukturalne","Visible mist and odour are not a reliable measure of exposure or filter loading.":"Widoczna mgła i zapach nie są wiarygodnym wskaźnikiem narażenia ani obciążenia filtra.","Volume 500 m³; air change 6 1/h; effectiveness 0,70; decay from 2000 to 100 ppm; source stopped":"Objętość 500 m³; wymiana powietrza 6 1/h; skuteczność 0,70; rozkład od 2000 do 100 ppm; źródło zatrzymane","Warnings":"Ostrzeżenia","Waste-to-energy and thermal waste treatment":"Przetwarzanie odpadów na energię i termiczne przetwarzanie odpadów","Wastewater, biogas, composting and animal by-products":"Ścieki, biogaz, kompostowanie i produkty uboczne pochodzenia zwierzęcego","Water and reactive or pyrophoric metal powder react, producing hydrogen and heat. Wet separation or water-based suppression in that extract path adds a hazard instead of removing one, and the extinguishing agent must match the powder, not the duct.":"Woda i reaktywny lub piroforyczny proszek metalowy reagują, wytwarzając wodór i ciepło. Mokra separacja lub tłumienie na bazie wody w tym kanale wyciągowym powoduje zwiększenie zagrożenia zamiast jego usunięcia, a środek gaśniczy musi być dobrany do proszku, a nie do przewodu.","Water introduced during foam cleaning evaporates into exactly the volume whose dew point must stay below the limit. A continuously held dry limit and a wet cleaning regime cannot coexist without a defined temporary release of the limit, a separate drying mode and a decision on product status.":"Woda wprowadzona podczas czyszczenia pianą odparowuje dokładnie do objętości, której punkt rosy musi pozostać poniżej limitu. Stale utrzymywany limit suchości i tryb czyszczenia na mokro nie mogą współistnieć bez zdefiniowanego, tymczasowego zwolnienia limitu, oddzielnego trybu suszenia i decyzji o statusie produktu.","Water-based suppression or wet separation in the extract path":"Gaszenie wodne lub separacja mokra w torze wyciągowym","Welding fume, metal fume and ozone formed close to the arc":"Dym spawalniczy, dym metaliczny i ozon tworzą się w pobliżu łuku","Welding, thermal cutting and grinding":"Spawanie, cięcie termiczne i szlifowanie","Wet cleaning ends with free water on floors, surfaces and equipment. A validated drying mode removes it without dragging aerosol towards a cleaner zone; without that mode the room simply starts production wet.":"Czyszczenie na mokro kończy się darmową wodą na podłogach, powierzchniach i sprzęcie. Zweryfikowany tryb suszenia usuwa ją bez wciągania aerozolu do czystszej strefy; bez tego trybu pomieszczenie po prostu zaczyna wytwarzać wodę.","Wet cleaning regime with foam, water and chemicals":"Czyszczenie na mokro pianą, wodą i środkami chemicznymi","Wet foam cleaning with water and chemicals as the cleaning regime":"Czyszczenie pianą na mokro z użyciem wody i środków chemicznych jako sposób czyszczenia","Wet food production and high-care zones":"Produkcja mokrej karmy i strefy o wysokiej ostrożności","Wet scrubber on the collected exhaust":"Mokry skruber na zebranych spalinach","What cannot be inspected will be discovered at the moment it fails.":"To, czego nie można sprawdzić, zostanie odkryte w momencie awarii.","What is being limited in this situation, and why it is watched":"Co jest ograniczone w tej sytuacji i dlaczego jest to obserwowane","What it constrains":"Co ogranicza","What this measure is driven by, and which figures are used for orientation alongside it":"Czym jest napędzany ten środek i jakie liczby służą do orientacji obok niego","What to expect from the primary source":"Czego można oczekiwać od źródła pierwotnego","Where to look":"Gdzie szukać","Which fan stops, which damper closes, in what order and on which detection input belongs in a written cause-and-effect matrix that the process supplier and the fire authority both recognise.":"Który wentylator się zatrzyma, która przepustnica się zamknie, w jakiej kolejności i na podstawie którego sygnału detekcji należy zapisać w pisemnej macierzy przyczynowo-skutkowej, którą uznają zarówno dostawca procesu, jak i organ ochrony przeciwpożarowej.","Wind can strengthen, weaken or reverse the flow; where source control is critical, hybrid support is needed":"Wiatr może wzmacniać, osłabiać lub odwracać przepływ; tam, gdzie kontrola źródła jest kluczowa, potrzebne jest wsparcie hybrydowe","With a large outdoor fraction the outdoor air quality becomes the limiting factor for the room. Use measured intake data rather than a default filter class, and check the seasonal pollen, dust and odour episodes.":"Przy dużej zawartości powietrza na zewnątrz, jakość powietrza zewnętrznego staje się czynnikiem ograniczającym dla danego pomieszczenia. Zamiast domyślnej klasy filtra, należy korzystać z danych pomiarowych dotyczących poboru powietrza i sprawdzać sezonowe występowanie pyłków, kurzu i nieprzyjemnych zapachów.","With no outdoor sink, every material and every leak becomes a term in the balance.":"Bez zewnętrznego odbiornika ciepła każdy materiał i każda nieszczelność stają się składnikiem bilansu.","With one air handling unit per product zone the wheel connects that zone's own extract to its own supply, so it does not create a path between two product zones. What remains is carry-over inside the zone itself, which matters at product changeover and for any substance the wheel can transfer. Specify the purge sector, the fan arrangement that keeps the pressure difference across the wheel in the right direction, and the flush time at changeover.":"Przy jednej centrali wentylacyjnej na strefę produktu rotor łączy wywiew tej strefy wyłącznie z jej własnym nawiewem, więc nie tworzy drogi między dwiema strefami produktu. Pozostaje przenoszenie zanieczyszczeń w obrębie tej samej strefy, istotne przy zmianie produktu i dla każdej substancji przenoszonej przez rotor. Należy określić sektor przedmuchu, układ wentylatorów utrzymujący właściwy kierunek różnicy ciśnień na rotorze oraz czas przepłukania przy zmianie produktu.","Woodworking and composite production":"Obróbka drewna i produkcja materiałów kompozytowych","Worked reference material":"Materiał referencyjny do pracy","Written housekeeping regime with vacuum systems, never compressed air":"Pisemny program utrzymania czystości z wykorzystaniem systemów próżniowych, nigdy sprężonego powietrza","You are assembling a set of measures for your own process. The tool checks that set for mutual incompatibility and shows which attention points are left uncovered.":"Tworzysz zestaw środków dla własnego procesu. Narzędzie sprawdza ich wzajemną zgodność i wskazuje punkty wymagające uwagi, które pozostały niepokryte.","Zone separation with airlocks and defined material routes":"Podział stref za pomocą śluz powietrznych i zdefiniowanych tras materiałowych","key conditions for":"kluczowe warunki dla","open the explanation":"otwórz objaśnienie","positions in this industry":"stanowiska w tej branży","— no comparison —":"— bez porównania —"};
