ale celowo pozostawiono margines otwarty, ponieważ wynika on z niepewności pomiaru i kontroli, mostków termicznych, lokalnej stagnacji i zmienności obciążenia","Bounds how long a function may run unverified; it depends on the rate of degradation, the fouling observed and the history of results, and the chapter gives no calendar figure":"Określa, jak długo funkcja może działać bez weryfikacji; zależy to od szybkości degradacji, zaobserwowanego zanieczyszczenia i historii wyników, a rozdział nie podaje żadnych danych kalendarzowych","Bounds how much unavailability the process can absorb; it depends on the changeover time, the common-cause failures and the consequence of losing the function, and the chapter fixes no target figure":"Określa granice niedostępności, jaką proces może wchłonąć; zależy to od czasu przezbrojenia, częstych usterek i konsekwencji utraty funkcji, a rozdział nie ustala żadnej wartości docelowej","Bounds the agent quantity and the time the enclosure must stay tight; it depends on the protected volume, the enclosure leakage, the fuel and the ventilation that has to be stopped first":"Ogranicza ilość środka i czas, przez jaki obudowa musi pozostać szczelna; zależy to od chronionej objętości, nieszczelności obudowy, paliwa i wentylacji, którą należy najpierw zatrzymać","Bounds the air velocity required at the capture point; it depends on the class and toxicity of the contaminant, the capture distance, the enclosure geometry, the momentum of the release itself and the cross-draughts in the room":"Ogranicza prędkość powietrza wymaganą w punkcie wychwytywania; zależy ona od klasy i toksyczności substancji zanieczyszczającej, odległości wychwytywania, geometrii obudowy, pędu samego uwolnienia i przeciągów poprzecznych w pomieszczeniu","Bounds the applicability of the capture relation: a cross-draught does not simply add to it":"Ogranicza stosowalność relacji przechwytywania: przeciągnięcie krzyżowe nie jest po prostu jej uzupełnieniem","Bounds the charge permitted for a given occupancy and room, and the emergency ventilation and detection that go with it; it depends on the refrigerant safety group, the room volume and the access category":"Określa dopuszczalny ładunek dla danej liczby osób i pomieszczenia oraz związaną z tym wentylację awaryjną i wykrywanie; zależy to od grupy bezpieczeństwa czynnika chłodniczego, objętości pomieszczenia i kategorii dostępu","Bounds the choice of measuring range: a wide span cannot control a small setpoint reliably":"Ogranicza wybór zakresu pomiarowego: szeroki zakres nie pozwala na niezawodną kontrolę małej wartości zadanej","Bounds the classified volume around a release and the equipment permitted inside it; it depends on the grade and duration of the release, the substance properties, the ventilation effectiveness and its proven availability":"Ogranicza objętość klasyfikowaną wokół uwolnienia i sprzętu dozwolonego w jego obrębie; zależy ona od stopnia i czasu trwania uwolnienia, właściwości substancji, skuteczności wentylacji i jej udowodnionej dostępności","Bounds the concentration in the breathing zone over a defined averaging period; it depends on the substance, the country of the project and the measurement strategy":"Ogranicza stężenie w strefie oddechowej w określonym okresie uśredniania; zależy ono od substancji, kraju projektu i strategii pomiaru","Bounds the counted particle concentration per size and the sampling plan; it depends on the occupancy state, the process risk and the qualification method":"Ogranicza stężenie liczonych cząstek w zależności od rozmiaru i planu pobierania próbek; zależy to od stanu zajętości, ryzyka procesu i metody kwalifikacji","Bounds the design temperature and humidity of the outdoor air; they depend on the location, the exceedance level accepted and the operating regime, and the chapter refers them to the project design basis instead of naming values":"Określa ograniczenia projektowe temperatury i wilgotności powietrza zewnętrznego; zależą one od lokalizacji, akceptowanego poziomu przekroczenia i trybu pracy, a rozdział odsyła je do podstawy projektu zamiast podawania wartości","Bounds the difference that keeps the flow direction; it depends on the leakage area of the envelope, the door regime, the presence of airlocks and on whether the product or the environment is being protected":"Ogranicza różnicę, która utrzymuje kierunek przepływu; zależy ona od powierzchni nieszczelności obudowy, reżimu drzwi, obecności śluz powietrznych oraz od tego, czy chroniony jest produkt lub środowisko","Bounds the efficiency claimed for a filter stage and the way it is proven; it depends on the particle size range of interest, the test aerosol, the face velocity and whether the filter is tested in place":"Ogranicza wydajność deklarowaną dla danego stopnia filtracji i sposób jej udowodnienia; zależy ona od zakresu wielkości cząstek będących przedmiotem zainteresowania, aerozolu testowego, prędkości przepływu powietrza i tego, czy filtr jest testowany na miejscu","Bounds the endotoxin concentration in the breathing zone; it is proposed as advisory, not as a general statutory limit":"Ogranicza stężenie endotoksyn w strefie oddychania; jest proponowane jako zalecenie, a nie jako ogólny ustawowy limit","Bounds the fire and smoke performance required where a duct crosses a compartment boundary; it depends on the compartment strategy, the duct orientation, the penetration detail and the actuation logic":"Określa wymagania dotyczące odporności na ogień i dym w miejscu, gdzie kanał przekracza granicę przedziału; zależy to od strategii przedziału, orientacji kanału, szczegółów penetracji i logiki działania.","Bounds the flow and the arrangement of the extract above the cells; it depends on the battery technology, the charging regime, the cell count and the enclosure of the battery":"Ogranicza przepływ i układ wyciągu nad ogniwami; zależy to od technologii akumulatora, sposobu ładowania, liczby ogniw i obudowy akumulatora.","Bounds the heat that has to be supplied to the regeneration air; it depends on the depth of drying, the cascade of stages, the heat recovery and the limits on infiltration, and the chapter gives no figure for it":"Ogranicza ciepło, które należy dostarczyć do powietrza regeneracyjnego; zależy to od głębokości suszenia, kaskady etapów, odzysku ciepła i ograniczeń infiltracji, a rozdział nie podaje żadnych danych na ten temat","Bounds the internal heat load of the room; it depends on an inventory of the sources by operating mode, and the chapter names the inventory as the method rather than giving a figure per unit or per area":"Ogranicza wewnętrzne obciążenie cieplne pomieszczenia; zależy ono od inwentaryzacji źródeł według trybu pracy, a rozdział podaje inwentaryzację jako metodę, a nie wartość na jednostkę lub powierzchnię","Bounds the minimum duct velocity at which the dust does not settle; it depends on the kind and grading of the dust, its moisture and stickiness, the duct geometry, the horizontal runs and the inactive branches":"Ogranicza minimalną prędkość w kanale, przy której pył nie osiada; zależy ona od rodzaju i uziarnienia pyłu, jego wilgotności i lepkości, geometrii kanału, odcinków poziomych i nieaktywnych odgałęzień","Bounds the moisture content of the air; it is stated as a dew point, not as a relative humidity":"Określa zawartość wilgoci w powietrzu; jest ona podawana jako punkt rosy, a nie jako wilgotność względna","Bounds the outdoor or treated air flow per room; the chapter states expressly that an air change rate is only the consequence of a calculation or of a proven configuration and never an independent design quantity":"Ogranicza przepływ powietrza zewnętrznego lub oczyszczonego w danym pomieszczeniu; w rozdziale wyraźnie stwierdzono, że szybkość wymiany powietrza jest jedynie konsekwencją obliczeń lub sprawdzonej konfiguracji, a nigdy niezależną wielkością projektową","Bounds the room concentration and thereby sets the ventilation flow that is needed":"Ogranicza stężenie powietrza w pomieszczeniu i tym samym ustala wymagany przepływ wentylacji","Bounds the use of an acceptance criterion: a result inside the measurement uncertainty cannot be rejected on its own":"Ogranicza stosowanie kryterium akceptacji: wynik mieszczący się w granicach niepewności pomiaru nie może zostać odrzucony sam w sobie","Bounds the use of the cube law: once the system curve moves, the estimate runs high":"Ogranicza stosowanie prawa sześcianu: gdy krzywa układu się przesuwa, oszacowanie jest wysokie","Bounds the vent area, the isolation distance and the response time; it depends on the dust explosion characteristics, the vessel volume and strength, and the duct runs into and out of it":"Ogranicza obszar odpowietrzania, odległość izolacyjną i czas reakcji; zależy to od charakterystyki wybuchu pyłu, objętości i wytrzymałości zbiornika, a także przewodu, który do niego wchodzi i wychodzi","Bounds the warming of the supply air when the heat is carried away by ventilation":"Ogranicza nagrzewanie się powietrza nawiewanego, gdy ciepło jest odprowadzane przez wentylację","Bounds what may leave the stack and under which conditions; it depends on the substances in the stream, the plant category, the surroundings and the permit of the site":"Określa granice tego, co może opuścić składowisko i na jakich warunkach; zależy to od substancji w strumieniu, kategorii zakładu, otoczenia i pozwolenia na budowę.","Breweries, beverages and fermentation":"Browary, napoje i fermentacja","Build the flow from the cleanest zone towards the less clean zones":"Zbuduj przepływ od strefy najczystszej do strefy mniej czystej","Buoyancy-driven relief through openings has no guaranteed direction: it reverses with wind, with outdoor temperature and when the process stops. A containment that has to be maintained at all times cannot rest on it.":"Uwolnienie wody przez otwory, napędzane siłą wyporu, nie ma określonego kierunku: zmienia kierunek wraz z wiatrem, temperaturą zewnętrzną i zatrzymaniem procesu. Osłona, która musi być stale konserwowana, nie może na niej spoczywać.","Bypass factor of the cooling coil":"Współczynnik obejścia wężownicy chłodzącej","Bypass, start-up and purge states of an oxidiser can send untreated solvent straight to the stack. Those states belong in the emission assessment and in the permit, not only in the process description.":"Stany obejścia, rozruchu i przedmuchu utleniacza mogą powodować skierowanie nieprzetworzonego rozpuszczalnika bezpośrednio do komina. Stany te powinny być uwzględnione w ocenie emisji i pozwoleniu, a nie tylko w opisie procesu.","Calculated shaft power is not annual energy consumption; real fan curves and efficiency islands come from the manufacturer":"Obliczona moc na wale nie stanowi rocznego zużycia energii; rzeczywiste krzywe wentylatorów i wyspy wydajności pochodzą od producenta","Calculation method":"Metoda obliczeniowa","Calculation method: the point is addressed by an explicit balance or sizing method; the result depends entirely on the input assumptions.":"Metoda obliczeniowa: punkt ten jest rozpatrywany za pomocą jawnej metody równoważenia lub określania wielkości; wynik zależy całkowicie od założeń wejściowych.","Capture at source as the primary barrier, before any dilution":"Wychwytywanie u źródła jako główna bariera przed jakimkolwiek rozcieńczeniem","Capture the steam at the source before it reaches the room":"Wychwytuj parę u źródła, zanim dotrze do pomieszczenia","Capture velocity and evaporation control pull in opposite directions over the same surface. Raising the slot velocity to catch the plume also raises mass transfer from the open bath or product; the two requirements are resolved by enclosure, a lip or a flange, not by one velocity figure.":"Prędkość przechwytywania i kontrola parowania działają w przeciwnych kierunkach na tej samej powierzchni. Zwiększenie prędkości szczeliny w celu przechwycenia smugi powoduje również wzrost transferu masy z otwartej kąpieli lub produktu; te dwa wymagania są rozwiązywane przez obudowę, krawędź lub kołnierz, a nie przez jedną wartość prędkości.","Capture velocity as a function of the contaminant class":"Prędkość przechwytywania jako funkcja klasy zanieczyszczeń","Capture velocity at the assessment point in front of a free extraction opening":"Prędkość przechwytywania w punkcie oceny przed wolnym otworem wyciągowym","Carbon dioxide released by one person per day in a closed volume":"Dwutlenek węgla uwalniany przez jedną osobę dziennie w zamkniętej objętości","Categories are kept apart on purpose. A legal obligation has to be met; a standard applies where a contract or a regulation invokes it; sector practice has to be argued for; a calculation method delivers only what its assumptions allow; a rule of thumb orders the discussion and proves nothing. Presenting them alike turns a duty into an opinion, or an opinion into a duty.":"Kategorie są celowo rozdzielane. Należy spełnić obowiązek prawny; norma ma zastosowanie tam, gdzie odwołuje się do niej umowa lub przepis; należy uzasadnić praktykę branżową; metoda obliczeniowa dostarcza tylko tego, na co pozwalają jej założenia; reguła praktyczna porządkuje dyskusję i niczego nie dowodzi. Prezentowanie ich na równi zmienia obowiązek w opinię, a opinię w obowiązek.","Category":"Kategoria","Changeover, not steady production, is when the air path usually fails.":"Zmiana, a nie stała produkcja, jest zazwyczaj sytuacją, w której zawodzi ścieżka powietrza.","Charge, class and room volume decide detection, emergency ventilation and access.":"O wykryciu, wentylacji awaryjnej i dostępie decydują ładunek, klasa i objętość pomieszczenia.","Charging interlocked with proven ventilation flow":"Ładowanie połączone ze sprawdzonym przepływem wentylacyjnym","Check before you use it":"Sprawdź przed użyciem","Checked against the rules of this page: none of them objects to this combination. That list of rules is not exhaustive.":"Sprawdzono zgodność z zasadami tej strony: żaden z nich nie sprzeciwia się tej kombinacji. Ta lista zasad nie jest wyczerpująca.","Chemical production and solvent rooms":"Pomieszczenia do produkcji chemikaliów i rozpuszczalników","Chemically compatible duct, damper and instrument materials":"Materiały na kanały, przepustnice i urządzenia zgodne chemicznie","Class limits per particle size, the sampling plan and the rules for classifying and monitoring":"Limity klas dla każdego rozmiaru cząstek, plan pobierania próbek oraz zasady klasyfikacji i monitorowania","Classification of the fire performance, the installation conditions of the penetration and the test evidence required":"Klasyfikacja odporności ogniowej, warunki montażu przepustu i wymagane dowody badań","Classify and monitor the zone in a defined occupancy state":"Klasyfikuj i monitoruj strefę w określonym stanie zajętości","Cleanable duct interior with real access points":"Możliwość czyszczenia wnętrza kanału z prawdziwymi punktami dostępu","Cleanable duct with access doors placed where they can be reached":"Kanał nadający się do czyszczenia, z drzwiami dostępowymi umieszczonymi w miejscu, do którego można dotrzeć","Cleaning interval driven by measured deposit, not by the calendar":"Częstotliwość czyszczenia ustalana jest na podstawie ilości osadu, a nie kalendarza","Cleaning is an operating state with its own air, moisture and aerosol behaviour.":"Czyszczenie jest stanem operacyjnym charakteryzującym się specyficznymi zachowaniami powietrza, wilgoci i aerozolu.","Cleaning treated as a separate ventilation mode with its own setpoints":"Czyszczenie traktowane jako osobny tryb wentylacji z własnymi nastawami","Clear all ticks":"Wyczyść wszystkie znaczniki","Close":"Zamknij","Close-fitting hood over open cooking vessels and kettles":"Dopasowany okap nad otwartymi naczyniami do gotowania i czajnikami","Closed thermal control loop with a defined heat rejection path":"Zamknięta pętla kontroli termicznej z określoną ścieżką odprowadzania ciepła","Closed transfer and local capture ahead of any dilution":"Zamknięty transfer i lokalne przechwytywanie przed jakimkolwiek rozcieńczeniem","Closed volume of 80 m³ with 6 people; full mixing; no scrubber; declared a non-normative worked example":"Zamknięta objętość 80 m³ z udziałem 6 osób; pełne mieszanie; brak skrubera; zadeklarowano jako nienormatywny przykład badawczy","Closes this attention point:":"Zamyka ten punkt uwagi:","Clouds and layers are assessed separately; a layer can create the next cloud.":"Chmury i warstwy oceniane są osobno; warstwa może tworzyć kolejną chmurę.","Coatings, filters and dampers age faster than the shore-based experience suggests.":"Powłoki, filtry i amortyzatory starzeją się szybciej, niż sugerują doświadczenia na lądzie.","Cold chain continuity":"Ciągłość łańcucha chłodniczego","Cold stores, freezer stores and refrigerated logistics":"Chłodnie, mroźnie i logistyka chłodnicza","Combinations that need justification":"Kombinacje wymagające uzasadnienia","Combustible or respirable process dust: cloud and settled layers":"Pył procesowy palny lub respirabilny: chmura i warstwy osiadłe","Combustion air drawn by the engines from the space":"Powietrze do spalania pobierane przez silniki z przestrzeni","Commissioning proof and periodic re-verification":"Dowód uruchomienia i okresowa ponowna weryfikacja","Compare with (optional)":"Porównaj z (opcjonalnie)","Composition follows the base material, the coating and the consumable, not the process name.":"Skład zależy od materiału bazowego, powłoki i materiału eksploatacyjnego, a nie od nazwy procesu.","Concentrated equipment heat in a confined technical space":"Skoncentrowane ciepło urządzeń w ograniczonej przestrzeni technicznej","Condensate in air handling units, drip trays and ducts":"Kondensat w centralach wentylacyjnych, tackach ociekowych i kanałach","Condensate or moisture path into electrical rooms":"Ścieżka kondensatu lub wilgoci do pomieszczeń elektrycznych","Condensate production inside a closed cabin":"Produkcja kondensatu w zamkniętej kabinie","Condensate production of the dehumidification train":"Produkcja kondensatu w układzie osuszania","Confinement direction and filtration stages are a licensed safety function, not an HVAC option.":"Kierunek ograniczania i stopnie filtracji są licencjonowaną funkcją bezpieczeństwa, a nie opcją HVAC.","Confinement with a pressure cascade towards the higher contamination level":"Ograniczenie z kaskadą ciśnienia w kierunku wyższego poziomu skażenia","Confirmed":"Potwierdzone","Confirmed: the point applies to this kind of process in the general case and was cross-checked against the source chapter.":"Potwierdzono: punkt ten odnosi się do tego rodzaju procesu w ogólnym przypadku i został sprawdzony w rozdziale źródłowym.","Conflict evaluation is symmetric and no unordered pair is duplicated":"Ocena konfliktu jest symetryczna i żadna nieuporządkowana para nie jest duplikowana","Conflict rules are simplified pairwise statements; real incompatibilities may involve three or more measures, the layout and the time dimension.":"Reguły konfliktu są uproszczonymi zależnościami parami; rzeczywiste niezgodności mogą obejmować trzy lub więcej środków, układ przestrzenny oraz sekwencję w czasie.","Conflicts, warnings and pairings":"Konflikty, ostrzeżenia i parowanie","Continuing evaporation turns the task into a source-and-removal balance; entry is released only on a measurement":"Ciągłe parowanie zmienia zadanie w równowagę źródła i usuwania; wejście jest zwalniane tylko w momencie pomiaru","Continuous filter integrity and leakage monitoring on the return path":"Ciągły monitoring integralności filtra i wycieków na drodze powrotnej","Continuous open purge with outdoor air through the enclosure":"Ciągły, otwarty przepływ powietrza zewnętrznego przez obudowę","Continuous temperature recording along the whole chain":"Ciągły pomiar temperatury w całym łańcuchu","Control at source ranks above dilution in the legal hierarchy of control.":"W prawnej hierarchii kontroli kontrola u źródła ma wyższą rangę niż rozwodnienie.","Control on dew point rather than on relative humidity":"Kontrola punktu rosy, a nie wilgotności względnej","Controlled aeration of the stored bulk following the product temperature":"Kontrolowane napowietrzanie składowanej masy po osiągnięciu temperatury produktu","Converts the door regime into an hourly volume flow":"Konwertuje reżim drzwi na godzinowy przepływ objętościowy","Cooling below dew point and reheating afterwards is the standard way to hold a low humidity in a chilled room, and it does not break the cold chain as long as the reheat sits in the air handling unit and brings the overcooled air back to the supply temperature that holds the room setpoint. It does break it if a heater is placed in the product zone itself, or if the supply temperature is raised above the required room condition. State where the reheat coil sits and which supply and room temperatures follow from it.":"Schłodzenie poniżej punktu rosy i późniejsze dogrzanie to standardowy sposób utrzymania niskiej wilgotności w chłodzonym pomieszczeniu. Nie przerywa to łańcucha chłodniczego, o ile nagrzewnica znajduje się w centrali wentylacyjnej i doprowadza przechłodzone powietrze z powrotem do temperatury nawiewu, która utrzymuje zadaną temperaturę w pomieszczeniu. Łańcuch chłodniczy zostaje przerwany, jeśli nagrzewnica zostanie umieszczona w samej strefie produktu lub jeśli temperatura nawiewu wzrośnie powyżej wymaganej temperatury w pomieszczeniu. Należy określić, gdzie znajduje się nagrzewnica i jakie temperatury nawiewu i w pomieszczeniu z niej wynikają.","Cooling capacity of the dehumidification train":"Wydajność chłodnicza układu osuszającego","Cooling load of the active freezing coil":"Obciążenie chłodnicze aktywnej wężownicy zamrażającej","Corrosion and condensation":"Korozja i kondensacja","Corrosion inspection programme that includes hidden sections":"Program kontroli korozyjnej obejmujący sekcje ukryte","Corrosion under insulation and in hidden duct sections":"Korozja pod izolacją i w ukrytych odcinkach kanałów","Corrosion-under-insulation programme with removable cladding":"Program izolacji antykorozyjnej z wyjmowaną obudową","Corrosive process atmosphere attacking the ventilation itself":"Atmosfera korozyjna atakująca samą wentylację","Cover or close the vessel and keep it closed as the primary barrier":"Przykryj lub zamknij naczynie i utrzymuj je zamknięte jako główną barierę","Cross-contamination between products, batches or material campaigns":"Zanieczyszczenie krzyżowe pomiędzy produktami, partiami lub kampaniami materiałowymi","Damage can raise the leakage area in a step; a failure and recovery scenario is needed, and real leakage comes from a pressure test":"Uszkodzenie może zwiększyć obszar wycieku o jeden krok; konieczne jest przeprowadzenie scenariusza awarii i naprawy, a rzeczywisty wyciek wynika z próby ciśnieniowej","Decay from 100 000 to 1000 particles/m³ with 100 particles/m³ in the supply; air change 20 1/h; effectiveness 0,80; full mixing":"Rozpad od 100 000 do 1000 cząstek/m³ przy 100 cząsteczkach/m³ w nawiewie; wymiana powietrza 20 1/h; skuteczność 0,80; pełne mieszanie","Decay from 1200 to 700 ppm in 0,50 h at a nominal 2,5 1/h; background 420 ppm; approximately exponential decay":"Rozpad od 1200 do 700 ppm w ciągu 0,50 h przy nominalnym przepływie 2,5 1/h; tło 420 ppm; rozpad w przybliżeniu wykładniczy","Dedicated cooling of the technical room with its own heat sink":"Dedykowane chłodzenie pomieszczenia technicznego z własnym radiatorem","Dedicated dry separation for reactive or pyrophoric metal powder":"Dedykowana separacja na sucho dla reaktywnych lub piroforycznych proszków metalowych","Dedicated once-through exhaust duct from each dryer or oven":"Dedykowany kanał wylotowy z każdej suszarki lub pieca","Define and test the occupancy state that the classification refers to":"Zdefiniuj i przetestuj stan zajętości, do którego odnosi się klasyfikacja","Define the leakage area and the door schedule together with the pressure difference":"Określ obszar nieszczelności i schemat drzwi wraz z różnicą ciśnień","Defrost all evaporators at the same time":"Jednoczesne odmrażanie wszystkich parowników","Defrost the evaporators in a staggered sequence, one battery at a time":"Odmrażaj parowniki w kolejności stopniowej, po jednym akumulatorze na raz","Defrosting every evaporator at once injects heat and water vapour into the room at the same moment. A narrow temperature band and the product cannot ride through that; defrost has to be staggered per battery or per zone so that cooling capacity is never fully absent.":"Jednoczesne odszranianie każdego parownika powoduje jednoczesne wprowadzenie ciepła i pary wodnej do pomieszczenia. Wąski zakres temperatur i produkt nie są w stanie go wytrzymać; odszranianie musi być stopniowane dla każdego akumulatora lub każdej strefy, aby nigdy nie zabrakło całkowicie mocy chłodniczej.","Dehumidify by cooling below dew point with condensate removal":"Osuszanie poprzez chłodzenie poniżej punktu rosy z usuwaniem kondensatu","Demonstrate the recovery time after a deliberate disturbance":"Wykazanie czasu rekonwalescencji po celowym zakłóceniu","Deposit rate is set by the process, so cleaning intervals follow inspection, not a calendar.":"Tempo osadzania wynika z procesu, dlatego częstotliwość czyszczenia należy ustalać na podstawie inspekcji, a nie kalendarza.","Desiccant rotor with high-temperature regeneration inside the zone":"Wirnik osuszający z regeneracją wysokotemperaturową wewnątrz strefy","Desiccant unit with regeneration air and burner outside the controlled zone":"Jednostka osuszająca z powietrzem regeneracyjnym i palnikiem poza strefą kontrolowaną","Design concentration and hold time of the extinguishing agent":"Projektowe stężenie i czas utrzymywania środka gaśniczego","Design hydrogen concentration for battery room ventilation":"Projektowe stężenie wodoru do wentylacji pomieszczenia akumulatorów","Design maintenance access and lifting routes before fixing the layout":"Przed ustaleniem układu zaprojektuj trasy dostępu konserwacyjnego i podnoszenia","Design transport velocity in a round dust extraction duct":"Projektowa prędkość transportu w okrągłym kanale odpylającym","Determines the flow through an equivalent opening at a given pressure difference":"Określa przepływ przez otwór równoważny przy danej różnicy ciśnień","Dew point measured at several points and followed as a trend":"Pomiar punktu rosy w kilku punktach i śledzenie trendu","Dew point of a dry room for moisture-sensitive processes":"Punkt rosy w pomieszczeniu suchym w przypadku procesów wrażliwych na wilgoć","Dew point, not relative humidity, is the transferable quantity between rooms.":"Między pomieszczeniami można przenosić ilość wilgoci, a nie wilgotność względną.","Didactic example data; relative flow 1,0; quadratic dependence on flow over the range 0,5 to 1,4":"Dane przykładowe dydaktyczne; przepływ względny 1,0; zależność kwadratowa od przepływu w zakresie od 0,5 do 1,4","Direction of flow at the product is the requirement; the air change rate is only a consequence.":"Kierunek przepływu powietrza w produkcie jest wymogiem, szybkość wymiany powietrza jest jedynie konsekwencją.","Discharge coefficient of an opening in cross-flow calculations":"Współczynnik wypływu otworu w obliczeniach przepływu krzyżowego","Discharge conditions and emission limits of the stack":"Warunki zrzutu i limity emisji ze stosu","Discharge height and velocity chosen against re-entrainment and immission":"Wysokość i prędkość wyładowania dobrana w oparciu o ponowne wciąganie i imisję","Distribute compensating make-up air at low velocity away from workstations":"Rozprowadzaj kompensacyjne powietrze uzupełniające z niską prędkością z dala od stanowisk pracy","Distribution that sweeps low stagnation zones, pits and cellars":"Dystrybucja obejmująca strefy niskiego stagnacji, doły i piwnice","Document which function has priority when modes conflict":"Dokument określający, która funkcja ma priorytet w przypadku konfliktu trybów","Documents that are sold. Their numerical requirement is exactly the content that is paid for, so only the shape of the requirement is shown here: what is regulated, what it depends on, what to settle first and what to expect from it. No figure appears in these entries in any language.":"Dokumenty, które są sprzedawane. Ich wymagania liczbowe to dokładnie ta treść, za którą się płaci, więc tutaj pokazany jest tylko kształt wymagania: co jest regulowane, od czego zależy, co należy najpierw uregulować i czego się po tym spodziewać. W tych wpisach nie pojawia się żadna liczba w żadnym języku.","Door interlock with status indication and alarm":"Blokada drzwi ze wskaźnikiem stanu i alarmem","Door open time per hour is a design input, not an operational detail.":"Czas otwarcia drzwi na godzinę jest parametrem projektowym, a nie szczegółem operacyjnym.","Downdraught or backdraught cutting and grinding table":"Stół do cięcia i szlifowania z ciągiem w dół lub w tył","Drainable, inspectable air handling unit without standing water":"Odwadnialna, możliwa do sprawdzenia jednostka przetwarzania powietrza bez stojącej wody","Drainage that still works with list, trim and vibration":"Drenaż, który nadal działa z listwą, przycinaniem i wibracjami","Drained, sloped and trapped condensate trays with a visible discharge":"Odwodnione, pochylone i uwięzione tacki kondensacyjne z widocznym odpływem","Draught, noise and local discomfort at workstations":"Przeciągi, hałas i lokalny dyskomfort na stanowiskach pracy","Drip formation is a direct hygienic route to the product below.":"Tworzenie się kropel to bezpośrednia, higieniczna droga do produktu poniżej.","Dry cleaning and vacuuming only, no water introduced into the room":"Tylko czyszczenie chemiczne i odkurzanie, nie wlewać wody do pokoju","Dry-air mass flow 1,20 kg/s; humidity ratio drop from 3,92 to 2,06 g/kg; operating period 45 min":"Przepływ masowy powietrza suchego 1,20 kg/s; spadek wilgotności z 3,92 do 2,06 g/kg; czas pracy 45 min","Dry-air mass flow 2,00 kg/s; from 10 °C saturated to 18 °C; no moisture added":"Przepływ masowy powietrza suchego 2,00 kg/s; od 10 °C nasycenia do 18 °C; bez dodawania wilgoci","Dry-air mass flow 2,00 kg/s; inlet 30 °C and 60 % relative humidity; saturated outlet at 10 °C":"Przepływ masowy powietrza suchego 2,00 kg/s; wlot 30 °C i wilgotność względna 60%; wylot nasycony przy 10 °C","Duct material and joints selected for the cleaning agent actually used":"Materiał kanałów i złącza dobrane do faktycznie używanego środka czyszczącego","Duct sized for the transport velocity that keeps the dust airborne":"Kanał o odpowiednim rozmiarze, uwzględniający prędkość transportu, która utrzymuje kurz w powietrzu","Dust collector placed outdoors, away from occupied areas":"Odpylacz umieszczony na zewnątrz, z dala od miejsc zajmowanych przez ludzi","Dust extraction system with duct D = 0,35 m at 20 m/s; declared input value of the example":"Instalacja odpylająca z przewodem D = 0,35 m przy 20 m/s; deklarowana wartość wejściowa przykładu","Dust or contaminant containment maintained in this space at all times":"W tym pomieszczeniu przez cały czas utrzymywane jest zabezpieczenie przed kurzem lub zanieczyszczeniami","Dust zone classification treating clouds and layers separately":"Klasyfikacja stref pyłowych uwzględniająca chmury i warstwy oddzielnie","Duty and defrost periods of parallel freezing coils":"Okresy pracy i rozmrażania równoległych wężownic zamrażających","Effective mixing and removal factor of the cleanroom":"Efektywny współczynnik mieszania i usuwania w pomieszczeniu czystym","Effective opening area 2,0 m²; height 12 m between the neutral levels; 40 °C inside, 20 °C outside; discharge coefficient 0,65; wind not taken into account":"Efektywna powierzchnia otworu 2,0 m²; wysokość między poziomami neutralnymi 12 m; 40 °C wewnątrz, 20 °C na zewnątrz; współczynnik odpływu 0,65; wiatr nie jest brany pod uwagę","Effective removal factor during the emergency purge":"Skuteczny współczynnik usuwania podczas awaryjnego oczyszczania","Effective ventilation factor obtained from a tracer test":"Efektywny współczynnik wentylacji uzyskany w badaniu znacznikowym","Eight-hour exposure; proposed by a national health council as advisory; expressly not an unconditional general statutory limit; measurement, exposure duration and local regulation remain decisive":"Ośmiogodzinna ekspozycja; zaproponowana przez krajową radę zdrowia jako zalecenie; wyraźnie nie jest bezwarunkowym ogólnym ustawowym limitem; decydujące znaczenie mają pomiary, czas trwania ekspozycji i lokalne przepisy","Electrical, control and server rooms need protected air":"Pomieszczenia elektryczne, sterownicze i serwerowe wymagają ochrony powietrza","Emergency power for the functions that must survive a black-out":"Zasilanie awaryjne dla funkcji, które muszą przetrwać przerwę w dostawie prądu","Emergency purge can raise the outdoor emission and needs its own assessment.":"Awaryjne oczyszczanie może zwiększyć emisję na zewnątrz i wymaga osobnej oceny.","Emergency ventilation must not push hot gas or vapour into the escape route.":"Wentylacja awaryjna nie może wprowadzać gorącego gazu lub pary do drogi ewakuacyjnej.","Emission limit values, discharge height and velocity rules, and the monitoring obligations attached to them":"Wartości graniczne emisji, zasady dotyczące wysokości i prędkości zrzutu oraz związane z nimi obowiązki monitorowania","Emission treatment and discharge conditions of the stack":"Obróbka emisji i warunki zrzutu z komina","Enclose the transfer point and extract at the source":"Zamknij punkt transferowy i wyciągnij u źródła","Enclosing the transfer point and extracting at the source is a source measure; making general dilution the primary control says the opposite about the same release. Only one of the two can be the primary barrier, and the assessment has to name which.":"Zamknięcie punktu transferu i ekstrakcja u źródła to miara źródła; uczynienie ogólnego rozcieńczenia kontrolą podstawową mówi coś przeciwnego o tym samym uwolnieniu. Tylko jedna z tych dwóch barier może stanowić barierę podstawową, a ocena musi wskazać, która z nich.","Energy and water consumption of the climate system":"Zużycie energii i wody w systemie klimatycznym","Entry permit with forced ventilation and continuous measurement":"Pozwolenie na wjazd z wentylacją wymuszoną i pomiarem ciągłym","Environment and equipment requirements":"Wymagania dotyczące środowiska i sprzętu","Equivalent free opening 0,040 m²; discharge coefficient 0,65; density 1,20 kg/m³; steady state; doors closed":"Równoważna powierzchnia otworu swobodnego 0,040 m²; współczynnik wypływu 0,65; gęstość 1,20 kg/m³; stan ustalony; drzwi zamknięte","Error of the cube-law power estimate after the system has been changed":"Błąd oszacowania mocy metodą prawa sześciennego po zmianie układu","Escape routes, refuge and emergency atmosphere":"Drogi ewakuacyjne, schronienia i atmosfera awaryjna","Establish the time to a limit value after loss of heat rejection":"Określ czas do wartości granicznej po utracie odprowadzenia ciepła","Evaporation, skinning and weight loss scale with surface velocity.":"Parowanie, kożuszenie i utrata masy zależą od prędkości powierzchniowej.","Every attention point in the library is used by at least one industry":"Każdy punkt uwagi w bibliotece jest wykorzystywany przez co najmniej jedną branżę","Every attention point of this industry has at least one measure ticked. Coverage is not the same as adequacy.":"Każdy punkt zainteresowania tej branży ma co najmniej jeden wskaźnik zaznaczony. Pokrycie nie jest tym samym, co adekwatność.","Every badge is a button: click it, or press Enter or Space, to read what its category and its status mean. Escape closes the explanation. The filter buttons above show one category at a time.":"Każda odznaka to przycisk: kliknij go lub naciśnij Enter lub spację, aby odczytać znaczenie kategorii i statusu. Klawisz Esc zamyka wyjaśnienie. Powyższe przyciski filtrów wyświetlają po jednej kategorii na raz.","Every entry says where to look for the primary source, what to settle beforehand, and belongs to at least one measure or attention point":"Każdy wpis wskazuje, gdzie szukać źródła pierwotnego, co należy ustalić wcześniej i należy do co najmniej jednego środka lub punktu uwagi","Every entry that carries a figure names the source file it was traced to":"Każdy wpis zawierający liczbę zawiera nazwę pliku źródłowego, do którego została doprowadzona","Every industry carries a point in each of the ten mandatory groups":"Każda branża ma punkt w każdej z dziesięciu obowiązkowych grup","Every industry contains at least one demonstrable incompatible pair":"W każdej branży występuje co najmniej jedna para, która jest wyraźnie niekompatybilna","Every measure is linked to an existing attention point":"Każdy środek jest powiązany z istniejącym punktem wymagającym uwagi","Every point and every measure carries a category and a status badge":"Każdy punkt i każdy środek ma przypisaną kategorię oraz znacznik statusu","Every rule references existing measures only":"Każda reguła odwołuje się wyłącznie do istniejących środków","Every traceability reference names a file that exists in the worked material, at a line that exists in it":"Każde odniesienie do śledzenia wskazuje plik, który istnieje w materiale roboczym, w wierszu, który w nim istnieje","Every transition needs a trigger, a permissive and a confirmation.":"Każda zmiana potrzebuje bodźca, pozwolenia i potwierdzenia.","Example for moisture-sensitive cell manufacturing; expressly an example and not a universal requirement; the admissible moisture follows from the cell chemistry, the product exposure time and the quality validation":"Przykład produkcji ogniw wrażliwych na wilgoć; wyraźnie przykładowy, a nie uniwersalny wymóg; dopuszczalna wilgotność wynika ze składu chemicznego ogniwa, czasu ekspozycji produktu i walidacji jakości","Explosion and fire hazard":"Zagrożenie wybuchem i pożarem","Explosion isolation between the collector and the process":"Izolacja wybuchu pomiędzy kolektorem a procesem","Explosion isolation, venting or suppression of the collector":"Izolacja, odpowietrzanie lub tłumienie wybuchu kolektora","Explosion protection document kept current with the plant":"Dokument dotyczący ochrony przeciwwybuchowej aktualizowany na bieżąco w zakładzie","Explosion suppression system on the collector":"System tłumienia wybuchu na kolektorze","Explosion venting to a safe outdoor area with no personnel access":"Odprowadzenie powietrza w razie wybuchu do bezpiecznego obszaru zewnętrznego, bez dostępu personelu","Export as text":"Eksportuj jako tekst","Exposure measurement in the breathing zone under real working conditions":"Pomiar narażenia w strefie oddechowej w rzeczywistych warunkach pracy","Extent of the hazardous zone and the equipment category inside it":"Zakres strefy niebezpiecznej i kategoria sprzętu znajdującego się w niej","Extinguishing media that are incompatible with running ventilation":"Środki gaśnicze nieodpowiednie do pracy wentylacji","Extra cooling load from infiltration through the door":"Dodatkowe obciążenie chłodnicze wynikające z przenikania przez drzwi","Extract flow once the hood is brought closer to the source":"Przepływ wyciągowy po zbliżeniu okapu do źródła","Extract flow that delivers the assumed capture velocity":"Strumień wyciągu zapewniający przyjętą prędkość wychwytu","Extraction at the highest point of the battery room":"Wyciąg w najwyższym punkcie pomieszczenia baterii","Extraction is distributed above the cells and tied to the charging interlock and the fan monitoring":"Wyciąg jest rozprowadzony nad ogniwami i powiązany z blokadą ładowania oraz monitoringiem wentylatora","Fan and casing heat are accounted for separately; the point after the coil is rarely strictly saturated":"Ciepło wentylatora i obudowy jest liczone oddzielnie; punkt za wężownicą rzadko jest całkowicie nasycony","Fan heat, duct losses and condensate subcooling are not included":"Nie uwzględniono strat ciepła wentylatora, strat w kanałach i przechłodzenia kondensatu","Fan operating point on the original system curve":"Punkt pracy wentylatora na oryginalnej krzywej systemu","Fan power drops further only if the pressure loss does not rise with the new geometry":"Moc wentylatora spada dalej tylko wtedy, gdy strata ciśnienia nie wzrośnie wraz z nową geometrią","Fan power follows the cube of flow only while the system curve stays unchanged.":"Moc wentylatora podąża wyłącznie za sześcianem przepływu, podczas gdy krzywa układu pozostaje niezmienna.","Fast-acting doors with a short open time":"Drzwi szybko otwierające się z krótkim czasem otwarcia","Figure":"Postać","Filter change without a secondary release into the room":"Wymiana filtra bez wtórnego uwolnienia do pomieszczenia","Filter performance designation and its test method":"Oznaczenie wydajności filtra i metoda jego badania","Filter resistance when clean and when loaded, at nominal flow":"Opór filtra w stanie czystym i obciążonym przy przepływie nominalnym","Filter selection matched to the measured outdoor air quality":"Dobór filtrów dopasowany do mierzonej jakości powietrza zewnętrznego","Filters lower the count but do not remove a wet growth surface upstream.":"Filtry obniżają liczbę, ale nie usuwają mokrej powierzchni wzrostu powyżej.","Fire and emergency mode against the normal ventilation function":"Tryb pożarowy i awaryjny w zestawieniu z funkcją normalnej wentylacji","Fire and smoke spread through the ventilation system":"Ogień i dym rozprzestrzeniały się przez system wentylacyjny","Fire dampers and compartment integrity at every duct crossing":"Klapy przeciwpożarowe i integralność przedziałów przy każdym skrzyżowaniu kanałów","Fire mode stops the supply and extract fans":"Tryb pożarowy zatrzymuje wentylatory nawiewne i wyciągowe","Fire resistance of the duct crossing and the classification of the damper":"Odporność ogniowa przejścia kanału i klasyfikacja przepustnicy","First estimate of the radiator area for heat rejection":"Pierwsza ocena powierzchni radiatora w celu odprowadzenia ciepła","First-level advisor only. No flow rates, pressures, equipment selection or compliance verdict. Verify every item against the project design basis and with the competent authority.":"Tylko doradca pierwszego stopnia. Brak danych o przepływach, ciśnieniach, doborze sprzętu i weryfikacji zgodności. Zweryfikuj każdy element pod kątem zgodności z projektem i we współpracy z właściwym organem.","First-level advisor — not a design guide":"Doradca pierwszego poziomu — nie przewodnik projektowy","First-level advisor: it structures the questions, it does not produce design decisions, flow rates, pressures or equipment selections.":"Doradca pierwszego stopnia: strukturyzuje pytania, nie podejmuje decyzji projektowych, dotyczących przepływów, ciśnień ani wyboru sprzętu.","Fixed gas detection with independent alarm levels":"Stała detekcja gazu z niezależnymi poziomami alarmu","Fixes the conversion between mass flow and volume flow across the whole balance":"Naprawia konwersję między przepływem masy a przepływem objętości w całym bilansie","Flexible connections and supports rated for motion and vibration":"Elastyczne połączenia i podpory dostosowane do ruchu i wibracji","Flow at the transport velocity for that one duct size":"Przepływ z prędkością transportu dla danego rozmiaru kanału","Flow driven by natural thermal draught in a tall hot zone":"Przepływ napędzany naturalnym ciągiem cieplnym w wysokiej, gorącej strefie","Forced circulation and mixing to remove local dead zones":"Wymuszona cyrkulacja i mieszanie w celu usunięcia lokalnych martwych stref","Foundries, steel working and forges":"Odlewnie, huty i kuźnie","Free cooling with a large untreated outdoor air fraction":"Bezpłatne chłodzenie z dużą ilością nieoczyszczonego powietrza zewnętrznego","Frost, rime and ice on cold surfaces and evaporators":"Szron, szron i lód na zimnych powierzchniach i parownikach","Full machine enclosure held at a slight negative pressure":"Pełna obudowa maszyny utrzymywana przy niewielkim podciśnieniu","Full mixing; locally higher with displacement flow; depends on place and duty and is not a constant property of the system":"Pełne mieszanie; lokalnie wyższe przy przepływie wyporowym; zależy od miejsca i zadania i nie jest stałą właściwością układu","Gas, aerosol, dust, odour":"Gaz, aerozol, kurz, zapach","General dilution as the primary control contradicts closed transfer with local capture. The hierarchy of control puts containment and capture at source above dilution, so dilution cannot be the primary measure while a closed transfer is claimed for the same release.":"Ogólne rozcieńczenie jako kontrola podstawowa stoi w sprzeczności z zamkniętym transferem i lokalnym wychwytem. Hierarchia kontroli stawia powstrzymywanie i wychwytywanie u źródła ponad rozcieńczaniem, więc rozcieńczenie nie może być środkiem podstawową, podczas gdy dla tego samego uwolnienia deklarowany jest zamknięty transfer.","Gives a lower bound on the flow needed to hold the design concentration":"Podaje dolną granicę przepływu potrzebną do utrzymania stężenia projektowego","Gives a lower bound on the heat needed to warm and melt the accumulated ice":"Podaje dolną granicę ciepła potrzebnego do ogrzania i stopienia nagromadzonego lodu","Gives a lower bound on the time before people may be let in":"Określa dolną granicę czasu, po którym można wpuścić ludzi","Gives the duty needed to cool, condense and freeze the infiltrating air":"Zapewnia chłodzenie, skraplanie i zamrażanie wnikającego powietrza","Gives the extra supply or extract the plant needs in order to hold the cascade":"Podaje dodatkowy strumień nawiewu lub wywiewu wymagany w instalacji do utrzymania kaskady ciśnień","Gives the flow and pressure where the fan curve and the system curve cross":"Podaje przepływ i ciśnienie w miejscu przecięcia krzywej wentylatora i krzywej układu","Gives the flush time once the source has been switched off":"Podaje czas spłukiwania po wyłączeniu źródła","Gives the heat needed to raise the temperature without adding moisture":"Zapewnia ciepło potrzebne do podniesienia temperatury bez dodawania wilgoci","Gives the mass and volume flow for the sensible heat alone":"Podaje przepływ masy i objętości dla samego ciepła odczuwalnego","Gives the mass of ice from which the defrost energy and the defrost interval follow":"Podaje masę lodu, z której wynika energia rozmrażania i interwał rozmrażania","Gives the rate at which the infiltrated moisture freezes out on the coils and structures":"Podaje szybkość, z jaką przenikająca wilgoć zamarza na cewkach i konstrukcjach","Gives the reference from which a departure points to dead zones or to short-circuiting of the flow":"Podaje punkt odniesienia, od którego odchylenie wskazuje na strefy martwe lub zwarcie przepływu","Gives the resulting demand on the supply ventilation of the space":"Podaje zapotrzebowanie na wentylację nawiewną pomieszczenia","Gives the source strength on which the ventilation calculation is built":"Podaje siłę źródła, na której opiera się obliczenie wentylacji","Gives the time available before the assessment value is reached":"Podaje czas dostępny przed osiągnięciem wartości oceny","Gives the time for the particle count to fall back to the target level":"Podaje czas potrzebny na spadek liczby cząstek do poziomu docelowego","Gives the total duty of the coil during its working phase":"Podaje całkowitą wartość obciążenia cewki podczas jej fazy roboczej","Gives the total, sensible plus latent, cooling load of the process":"Podaje całkowite, jawne i ukryte obciążenie chłodnicze procesu","Gives the water that the trays, traps and drains have to carry away without standing water":"Zapewnia odprowadzenie wody przez tacki, syfony i odpływy bez zalegania wody","Gives the water the separator has to collect and remove":"Podaje wodę, którą separator musi zebrać i usunąć","Glass, ceramics, cement and hot mineral processes":"Procesy szklarskie, ceramiczne, cementowe i obróbki minerałów na gorąco","Gowning, airlock and behaviour rules for personnel entry":"Zasady dotyczące ubioru, śluzy powietrznej i zachowania personelu wchodzącego do pomieszczenia","Gowning, behaviour and flow of people are part of the air concept, not around it.":"Ubiór, zachowanie i przepływ ludzi są częścią koncepcji powietrza, a nie wokół niej.","Grain storage, feed production and intensive livestock":"Przechowywanie zboża, produkcja pasz i intensywna hodowla zwierząt","Grease-capturing hood with removable filters over fryers and ovens":"Okap wychwytujący tłuszcz z wyjmowanymi filtrami nad frytkownicami i piekarnikami","Greasy, fibrous or lint deposit inside the extract path":"Tłuste, włókniste lub kłaczkowate osady wewnątrz kanału wyciągowego","Ground-level conditions, moderate temperature; large temperature and density differences call for a mass balance instead":"Warunki na poziomie gruntu, umiarkowana temperatura; duże różnice temperatur i gęstości wymagają raczej bilansu masy","HEPA-filtered supply to the protected zone":"Dostawa do strefy chronionej z filtrem HEPA","Hard conflict with a measure you already ticked:":"Twardy konflikt z już zaznaczonym środkiem:","Hard conflicts":"Trudne konflikty","Hazardous area classification for combustible dust":"Klasyfikacja obszarów niebezpiecznych dla pyłu palnego","Hazardous area classification for flammable gas and vapour":"Klasyfikacja obszarów niebezpiecznych dla gazów i par łatwopalnych","Hazardous area classification supported by a documented release assessment":"Klasyfikacja obszaru niebezpiecznego poparta udokumentowaną oceną uwolnienia","Health-based advisory value for airborne endotoxin":"Wartość doradcza dla zdrowia w odniesieniu do endotoksyn unoszących się w powietrzu","Heat and moisture release are split by activity and by the suit or cabin configuration":"Uwalnianie ciepła i wilgoci jest podzielone w zależności od aktywności oraz konfiguracji skafandra lub kabiny","Heat leaving with the cooling water or the exhaust gas must not re-enter the room load":"Ciepło opuszczające pomieszczenie wraz z wodą chłodzącą lub spalinami nie może ponownie przedostawać się do pomieszczenia.","Heat load 500 kW; temperature rise 12 K; specific heat 1,005 kJ/(kg·K); density 1,18 kg/m³":"Obciążenie cieplne 500 kW; wzrost temperatury 12 K; ciepło właściwe 1,005 kJ/(kg·K); gęstość 1,18 kg/m³","Heat recovery by plate or run-around circuit, with no mass transfer between the streams":"Odzysk ciepła za pomocą płyty lub obiegu pośredniego, bez wymiany masy między strumieniami","Heat release data per item from the equipment supplier, per operating mode":"Dane dotyczące uwalniania ciepła dla każdego elementu od dostawcy sprzętu i dla każdego trybu pracy","Heat removal is limited by the available sink temperature, not by the fan you would like to fit.":"Możliwość odprowadzania ciepła ogranicza temperatura dostępnego odbiornika ciepła, a nie wentylator, który chcielibyśmy dobrać.","Heat stress at hot workplaces":"Stres cieplny w gorących miejscach pracy","Heated door frames, floor heating and drainage under the door":"Ogrzewane ościeżnice, ogrzewanie podłogowe i odwodnienie pod drzwiami","High capture velocity at the slot right over the open bath":"Wysoka prędkość przechwytywania w szczelinie tuż nad otwartą kąpielą","High recirculation ratio with a small, deeply dried outdoor fraction":"Wysoki współczynnik recyrkulacji z małą, głęboko wysuszoną frakcją zewnętrzną","High-level extraction of the buoyant plume at roof level":"Wysokopoziomowe usuwanie unoszącego się pióropusza z poziomu dachu","High-temperature regeneration means burner surfaces and hot regeneration air inside the space. Placed inside a classified combustible-dust zone that is an ignition source in the very zone it is meant to serve. The regeneration side belongs outside the classified zone, with its own air path and its own discharge.":"Regeneracja wysokotemperaturowa oznacza, że ​​powierzchnie palnika i gorące powietrze regeneracyjne znajdują się wewnątrz pomieszczenia. Umieszczone są w klasyfikowanej strefie pyłu palnego, która jest źródłem zapłonu w strefie, którą mają obsługiwać. Strona regeneracyjna znajduje się poza strefą klasyfikowaną, z własnym torem przepływu powietrza i własnym wylotem.","Hold the dew point continuously, including non-production hours":"Utrzymuj punkt rosy w sposób ciągły, także w godzinach nieprodukcyjnych","Holding the dew point continuously, including non-production hours, does not go together with free cooling on a large untreated outdoor fraction: the outdoor air brings its own moisture as soon as it is more humid than the room target, which in most climates is most of the year.":"Utrzymywanie stałego punktu rosy, także w godzinach nieprodukcyjnych, nie idzie w parze z chłodzeniem swobodnym przy wykorzystaniu dużej, nieoczyszczonej frakcji zewnętrznej: powietrze zewnętrzne zawiera własną wilgoć, gdy tylko stanie się bardziej wilgotne niż docelowa wilgotność pomieszczenia, co w większości klimatów ma miejsce przez większą część roku.","Hood at the furnace mouth, the tap hole and the pouring points of a metallurgical process":"Okap przy wlocie pieca, otworze spustowym i punktach zalewania procesu metalurgicznego","Hood over the hot source itself, sized on the rising plume and the cross-draught":"Okap nad samym gorącym źródłem, dobrany do unoszącego się pióropusza termicznego i przepływów poprzecznych","Horizontal cross-draught at a freely suspended hood; calls for a source test or a different hood geometry":"Poziomy ciąg poprzeczny przy swobodnie zawieszonym okapie; wymaga testu źródłowego lub innej geometrii okapu","Hot exhaust and drying heat from dryers, kilns and curing sections":"Gorące spaliny i ciepło suszenia z suszarek, pieców i sekcji utwardzania","Hot regeneration surfaces and a burner inside or next to a classified area require an explicit temperature-class and ignition-source assessment, including the failure states of the rotor drive and of the regeneration fan.":"Gorące powierzchnie regeneracyjne i palnik wewnątrz lub w pobliżu obszaru klasyfikowanego wymagają wyraźnej oceny klasy temperatury i źródła zapłonu, w tym stanów awarii napędu wirnika i wentylatora regeneracyjnego.","Hot regeneration surfaces stand in a space where a dust containment has to be maintained. Even without a formal zone, settled dust on hot parts is an ignition path; the regeneration side and its discharge need their own assessment and preferably their own location.":"Gorące powierzchnie regeneracyjne znajdują się w przestrzeni, w której konieczne jest utrzymanie izolacji pyłowej. Nawet bez formalnej strefy, osadzający się na gorących częściach pył stanowi drogę zapłonu; strona regeneracyjna i jej odprowadzanie wymagają osobnej oceny i najlepiej oddzielnej lokalizacji.","Hourly infiltration volume through the door":"Objętość godzinowa infiltracji przez drzwi","Housekeeping and inspection are barriers with the same status as hardware.":"Utrzymanie porządku i kontrola są barierami o takim samym statusie jak sprzęt.","Humidity ratio before and after the cooling coil":"Stosunek wilgotności przed i za wężownicą chłodzącą","Hybrid operation is workable, but the switch-over logic, the wind and temperature range of each mode and the proof against short-circuiting between openings all have to be written down and tested.":"Praca hybrydowa jest możliwa, ale logika przełączania, zakres wiatru i temperatury każdego trybu oraz zabezpieczenie przed zwarciem pomiędzy otworami — wszystko to musi zostać zapisane i przetestowane.","Hydrogen collects at the ceiling; a low extract point does not see it.":"Wodór gromadzi się przy suficie, dolny punkt poboru go nie wykryje.","Hydrogen release 167,2 L/h; design concentration 1 vol-%; mixing factor 2; before spatial and failure corrections":"Wydzielanie wodoru 167,2 l/h; stężenie projektowe 1% obj.; współczynnik mieszania 2; przed korektą przestrzenną i awarią","Hydrogen release during battery charging":"Uwalnianie wodoru podczas ładowania akumulatora","Hydrogen release while the battery is being charged":"Uwalnianie wodoru podczas ładowania akumulatora","Hygiene and cleanability":"Higiena i łatwość czyszczenia","Hygienic execution of the air handling unit with cleanable surfaces":"Higieniczne wykonanie centrali wentylacyjnej z powierzchniami nadającymi się do czyszczenia","Hygroscopic product: caking, loss of flow and microbiological growth":"Produkt higroskopijny: zbrylanie, utrata płynności i rozwój mikrobiologiczny","Ice formation caused by the door regime":"Powstawanie lodu spowodowane przez drzwi","If air is returned to the room, the filter is a barrier and not a comfort item. It needs integrity and leakage monitoring with a defined action on alarm, not only a pressure-drop indication.":"Jeśli powietrze zostanie zwrócone do pomieszczenia, filtr będzie stanowił barierę, a nie element zapewniający komfort. Wymaga on monitorowania szczelności i szczelności z określonym działaniem w przypadku alarmu, a nie tylko wskazania spadku ciśnienia.","Ignition sources: sparks, hot surfaces and static electricity":"Źródła zapłonu: iskry, gorące powierzchnie i elektryczność statyczna","In a stratified hall the extract temperature is not the mean room temperature":"W hali warstwowej temperatura wyciągu nie jest średnią temperaturą pomieszczenia","In microgravity water does not run off by itself: separators, capillary or centrifugal devices are needed":"W warunkach mikrograwitacji woda nie spływa sama: potrzebne są separatory, urządzenia kapilarne lub wirówki","In this example carbon dioxide binds earlier than oxygen; the system boundary must cover every route of production, storage, leakage and consumption":"W tym przykładzie dwutlenek węgla wiąże się wcześniej niż tlen; granica systemu musi obejmować każdą drogę produkcji, magazynowania, wycieku i zużycia","Incompatible streams must be kept apart before any common treatment is considered.":"Przed rozważeniem wspólnego oczyszczania należy oddzielić niezgodne strumienie.","Industry":"Przemysł","Industry guidance":"Wytyczne branżowe","Industry guidance: established sector practice or a guidance document; useful and widely applied, but it carries no legal force of its own.":"Wskazówki branżowe: przyjęta praktyka branżowa lub dokument z wytycznymi; przydatny i szeroko stosowany, jednak nie mający własnej mocy prawnej.","Industry or process":"Branża lub proces","Inert gas blanketing of the enclosure or printer chamber":"Otulina gazowa obudowy lub komory drukarki","Inerting displaces oxygen. Any volume that people can enter, and any low space the inert gas can reach, needs oxygen monitoring with an alarm and a written entry rule.":"Inertyzacja wypiera tlen. Każda przestrzeń, do której mogą wejść ludzie, oraz każda niska przestrzeń, do której może dotrzeć gaz obojętny, wymaga monitorowania poziomu tlenu za pomocą alarmu i pisemnego regulaminu wejścia.","Infiltration changes with door size, open time, temperature difference, wind and traffic":"Infiltracja zmienia się w zależności od rozmiaru drzwi, czasu otwarcia, różnicy temperatur, wiatru i ruchu","Inside and outside temperatures assumed in the thermal draught example":"Temperatury wewnętrzne i zewnętrzne przyjęte w przykładzie ciągu termicznego","Inspection doors and drainable sections in every wet part of the unit":"Drzwi inspekcyjne i sekcje odwadniające w każdej mokrej części jednostki","Inspection openings at hidden and insulated duct sections":"Otwory inspekcyjne w ukrytych i izolowanych odcinkach kanałów","Instrumented gas-free declaration before entry or hot work":"Oświadczenie o braku gazu przed wejściem lub pracą na gorąco","Insulate and seal cold surfaces, ducts and cable trays overhead":"Izoluj i uszczelniaj zimne powierzchnie, kanały i korytka kablowe nad głową","Intakes are placed relative to plumes and traffic, not to the nearest free facade.":"Wloty powietrza rozmieszczone są względem smug i ruchu ulicznego, a nie najbliższej wolnej fasady.","Interval between periodic function tests and inspections":"Odstęp czasu pomiędzy okresowymi testami funkcjonalnymi i przeglądami","Iodine and gaseous activity trapping stage with in-situ efficiency test":"Etap wychwytywania jodu i aktywności gazowej z testem wydajności in situ","Keep escape routes and refuge clear of the emergency discharge path":"Utrzymuj drogi ewakuacyjne i schronienia z dala od ścieżki ewakuacyjnej","Keep incompatible streams in physically separate exhaust systems":"Utrzymuj niekompatybilne strumienie w fizycznie oddzielnych układach wydechowych","Keep the extraction running after the process stops, before the door is released":"Po zatrzymaniu procesu utrzymuj wyciąg do czasu zwolnienia blokady drzwi","Keep the surface temperature above dew point with a defined margin":"Utrzymuj temperaturę powierzchni powyżej punktu rosy z określonym marginesem","Keep the workroom outside any classified hazardous zone":"Utrzymuj pomieszczenie robocze poza jakąkolwiek sklasyfikowaną strefą niebezpieczną","Key conditions":"Warunki kluczowe","Language":"Język","Large door opening; bidirectional exchange driven by the density difference; expressly a measured or design assumption and not a general value":"Duże otwarcie drzwi; dwukierunkowa wymiana napędzana różnicą gęstości; wyraźnie zmierzone lub projektowe założenie, a nie wartość ogólna","Latent heat from washing, wet cleaning and product moisture":"Ciepło utajone powstające podczas prania, czyszczenia na mokro i wilgoci w produkcie","Lead-acid charging; 100 cells; gassing current 5 A per cell; gassing factor 0,80; mixing and uncertainty factor 2":"Ładowanie akumulatora kwasowo-ołowiowego; 100 ogniw; prąd gazowania 5 A na ogniwo; współczynnik gazowania 0,80; współczynnik mieszania i niepewności 2","Leak and moisture detection with alarm in the electrical room":"Wykrywanie wycieków i wilgoci z alarmem w pomieszczeniu elektrycznym","Leakage flow of the protected volume at the target overpressure":"Przepływ wycieku chronionej objętości przy docelowym nadciśnieniu","Leakage flow through the equivalent opening at that pressure difference":"Przepływ nieszczelności przez otwór równoważny przy tej różnicy ciśnień","Legislation and public rules. The subject of the requirement is named, but a figure appears only where it could be traced to a source file, and the edition in force is verified with the issuing body.":"Przepisy prawa i regulacje publiczne. Przedmiot wymogu jest określony, ale liczba pojawia się tylko tam, gdzie można go powiązać z plikiem źródłowym, a obowiązujące wydanie jest weryfikowane przez organ wydający.","Limit the air velocity over the open product or bath":"Ogranicz prędkość powietrza nad otwartym produktem lub kąpielą","Limitations":"Ograniczenia","Links the flow to the distance and to the opening area; it grows roughly with the square of the distance":"Łączy przepływ z odległością i obszarem otwarcia; rośnie mniej więcej kwadratowo względem odległości","Links the flow to the height between neutral levels, the temperature difference and the opening area":"Łączy przepływ z wysokością między poziomami neutralnymi, różnicą temperatur i obszarem otwarcia","Links the rejected heat to the radiating surface that has to be carried":"Łączy odrzucone ciepło z promieniującą powierzchnią, która musi zostać przeniesiona","Links velocity and duct cross-section to the volume flow the fan has to deliver":"Łączy prędkość i przekrój kanału z przepływem objętości, jaki wentylator musi dostarczyć","Lithium-ion battery production and dry rooms":"Produkcja baterii litowo-jonowych i pomieszczenia suche","Live result of your selection":"Wynik na żywo Twojego wyboru","Load a typical set":"Załaduj typowy zestaw","Loading lock or vestibule between the cold store and the dock":"Śluza lub przedsionek załadunkowy pomiędzy chłodnią a dokiem","Local spot cooling or air showers at hot workplaces":"Lokalne chłodzenie punktowe lub natryski powietrzne w gorących miejscach pracy","Loss of extraction stops the source, it does not only raise an alarm":"Utrata wydobycia zatrzymuje źródło, nie tylko powoduje alarm","Low-level make-up air at low velocity, not aimed at the plume":"Powietrze uzupełniające o niskiej prędkości i niskiej wysokości, nie skierowane na pióropusz","Lowers the actual purge rate relative to the nominal air change rate":"Obniża rzeczywistą szybkość oczyszczania w stosunku do nominalnej szybkości wymiany powietrza","Lowers the actual wash-out rate relative to the nominal air change rate":"Obniża rzeczywistą szybkość wypłukiwania w stosunku do nominalnej szybkości wymiany powietrza","Machining, metalworking fluids and oil mist":"Obróbka skrawaniem, płyny do obróbki metali i mgła olejowa","Make-up air introduced badly is the usual cause of complaints and of bypassed equipment.":"Częstą przyczyną skarg i pomijania sprzętu jest nieprawidłowe wprowadzanie powietrza uzupełniającego.","Manage the cutting fluid or the process water itself: concentration, pH, temperature and microbiological condition":"Zarządzanie płynem tnącym lub samą wodą procesową: stężeniem, pH, temperaturą i stanem mikrobiologicznym","Mandatory law":"Prawo obowiązujące","Mandatory law: a binding legal requirement exists for this point; the national implementation and the competent authority decide the detail.":"Prawo bezwzględnie obowiązujące: w tym punkcie istnieje wiążący wymóg prawny; szczegóły ustala krajowy przepis wykonawczy oraz właściwy organ.","Manual cleaning is often the peak release, not normal production.":"Ręczne czyszczenie często powoduje emisję szczytową; nie występuje ona podczas normalnej produkcji.","Material airlock and pass-through separate from the personnel route":"Śluza powietrzna i przejście materiałowe oddzielone od drogi dla personelu","Material and outgassing control inside the pressurised volume":"Kontrola materiału i odgazowania wewnątrz objętości pod ciśnieniem","Material on air change, ventilation effectiveness and tracer testing":"Materiał na temat wymiany powietrza, skuteczności wentylacji i badania wskaźników","Material on battery rooms and hydrogen release":"Materiał na temat pomieszczeń akumulatorowych i uwalniania wodoru","Material on bioaerosol and endotoxin":"Materiał na temat bioaerozolu i endotoksyny","Material on chilled and frozen stores and on door use":"Materiały dotyczące magazynów chłodniczych i mrożonek oraz użytkowania na drzwiach","Material on cleanliness recovery after a disturbance":"Materiał na temat odzyskiwania czystości po zakłóceniu","Material on cooling, dehumidification and reheat":"Materiał na temat chłodzenia, osuszania i ponownego ogrzewania","Material on deep dehumidification and dry rooms":"Materiał na temat głębokiego osuszania i suchych pomieszczeń","Material on dust, fume, mist and vapour; worked example on dust extraction":"Materiał na temat pyłu, dymu, mgły i pary; przykład praktyczny dotyczący odpylania","Material on fans, system curves and energy":"Materiał na temat wentylatorów, krzywych systemowych i energii","Material on filters and their resistance":"Materiały na filtrach i ich rezystancja","Material on heat and moisture in closed habitable volumes":"Materiał na temat ciepła i wilgoci w zamkniętych przestrzeniach mieszkalnych","Material on instruments, acceptance testing and measurement uncertainty":"Materiał na temat przyrządów, testów odbiorczych i niepewności pomiaru","Material on localising sources and on the types of extraction device; worked example on local capture":"Materiał dotyczący lokalizacji źródeł i typów urządzeń ekstrakcyjnych; przykładowy opis lokalnego wychwytywania","Material on low-temperature coils and defrosting":"Materiał na cewkach niskotemperaturowych i rozmrażanie","Material on ship machinery spaces":"Materiały dotyczące maszynowni okrętowych","Material on the air balance and the pressure hierarchy; flow through leaks and openings":"Materiał na temat bilansu powietrza i hierarchii ciśnień; przepływ przez nieszczelności i otwory","Material on the atmosphere of closed habitable volumes":"Materiał na temat atmosfery zamkniętych przestrzeni mieszkalnych","Material on the emergency purge after a release":"Materiał na temat awaryjnego oczyszczenia po wydaniu","Material on the operation of a protected volume held at overpressure":"Materiał dotyczący eksploatacji chronionej objętości utrzymywanej pod nadciśnieniem","Material on thermal draught in tall and hot buildings":"Materiał na temat ciągu cieplnego w wysokich i gorących budynkach","Mean outdoor air flow through an open cold store door":"Średni przepływ powietrza zewnętrznego przez otwarte drzwi chłodni","Measure flow or pressure, not just the fan status contact":"środek przepływu lub ciśnienia, a nie tylko styku stanu wentylatora","Measurement uncertainty exceeds the difference; for critical functions a guard band is agreed in advance":"Niepewność pomiaru przekracza różnicę; dla funkcji krytycznych ustala się z góry pasmo ochronne","Measures ticked":"Środki zostały zaznaczone","Measures usually needed as a pair":"Środki zwykle potrzebne jako para","Mechanical high-level extraction with a defined flow rate":"Mechaniczny wyciąg górą o określonym strumieniu objętości","Merchant ships and passenger vessels":"Statki handlowe i pasażerskie","Metabolic and equipment heat in a closed volume without an outdoor sink":"Ciepło metaboliczne i od urządzeń w zamkniętej objętości bez zewnętrznego odbiornika ciepła","Minimum calculated ventilation flow for the battery room":"Minimalny obliczony przepływ wentylacji dla pomieszczenia akumulatorowni","Minimum modelled purge time after the source has been isolated":"Minimalny modelowany czas oczyszczania po wyizolowaniu źródła","Mismatch between the sensor span and the cascade setpoint":"Niezgodność między zakresem czujnika a punktem nastawy kaskady","Modelled cleanliness recovery time after a disturbance":"Modelowany czas odzyskiwania czystości po zakłóceniu","Modelled time for the concentration to fall to the target level":"Modelowany czas spadku stężenia do poziomu docelowego","Modular units that can be serviced without opening the classified barrier":"Jednostki modułowe, które można obsługiwać bez otwierania bariery klasyfikowanej","Moisture":"Wilgoć","Moisture from biological activity: grain heating, livestock, composting":"Wilgoć pochodząca z aktywności biologicznej: ogrzewanie ziarna, hodowla zwierząt, kompostowanie","Moisture ingress through doors, airlocks and material transfer":"Wnikanie wilgoci przez drzwi, śluzy powietrzne i przenoszenie materiału","Moisture released by one person per day in a closed volume":"Wilgoć uwalniana przez jedną osobę dziennie w zamkniętej objętości","Movable extraction arm positioned by written procedure at each station":"Ruchome ramię wyciągowe ustawione zgodnie z pisemną procedurą na każdej stacji","Multi-stage coalescing and fine filtration of the mist":"Wielostopniowe łączenie i dokładna filtracja mgły","Narrow humidity or dew-point window for product quality":"Wąskie okno wilgotności lub punktu rosy dla jakości produktu","Narrow temperature window for product quality":"Wąskie okno temperaturowe dla jakości produktu","Natural high-level relief driven by the stack effect":"Naturalna, wysokopoziomowa rzeźba terenu, będąca efektem efektu kominowego","Needs justification together with:":"Uzasadnienie potrzeb wraz z:","Negative pressure containment of the hazardous or toxic zone":"Ograniczanie podciśnieniem strefy niebezpiecznej lub toksycznej","Net heat release into the space 500 kW; specific heat 1,005 kJ/(kg·K); density 1,18 kg/m³; sensible heat only":"Czysta emisja ciepła do przestrzeni 500 kW; ciepło właściwe 1,005 kJ/(kg·K); gęstość 1,18 kg/m³; tylko ciepło jawne","Night
