{id:"q69",lay:"chapter",c:"method",s:"assumed",v:"28 %",tr:"calculations/RC-4A-12-001.md:91",cd:"fa3",wh:"w_fa",ck:"k_fa3",ap:["V7","O7"],ms:["m_syscurve","m_ductclean","m_reverify"],su:L("Error of the cube-law power estimate after the system has been changed","Похибка кубічної оцінки потужності після зміни мережі","Fehler der kubischen Leistungsschätzung nach Änderung der Anlage","Fout van de derdemachtsschatting van het vermogen nadat het systeem is gewijzigd","Erreur de l'estimation cubique de puissance après modification du réseau","Error de la estimación cúbica de potencia tras modificar la red"),sh:L("Bounds the use of the cube law: once the system curve moves, the estimate runs high","Обмежує застосування кубічного закону: щойно крива мережі зміщується, оцінка стає завищеною","Begrenzt die Anwendung des kubischen Gesetzes: sobald sich die Anlagenkennlinie verschiebt, liegt die Schätzung zu hoch","Begrenst het gebruik van de derdemachtswet: zodra de systeemkarakteristiek verschuift, valt de schatting te hoog uit","Borne l'usage de la loi cubique : dès que la courbe de réseau se déplace, l'estimation est trop élevée","Acota el uso de la ley cúbica: en cuanto la curva de red se desplaza, la estimación queda alta")},
{id:"q70",lay:"chapter",c:"method",s:"assumed",v:"120 Pa / 250 Pa",tr:"D-data/D-4A-05-002.csv:12",cd:"fi1",wh:"w_fi",ck:"k_fi1",ap:["G5","V1"],ms:["m_bagin","m_intake_filter","m_filtermon","m_disturbtest"],su:L("Filter resistance when clean and when loaded, at nominal flow","Опір фільтра в чистому та забрудненому стані за номінальної витрати","Filterwiderstand im sauberen und im beladenen Zustand bei Nennvolumenstrom","Filterweerstand in schone en in beladen toestand bij nominaal debiet","Résistance du filtre propre et colmaté, au débit nominal","Resistencia del filtro limpio y colmatado, a caudal nominal"),sh:L("Sets the rise in pressure drop against which the fan reserve and the change strategy are judged","Задає зростання перепаду тиску, за яким оцінюють запас вентилятора та стратегію заміни","Legt den Anstieg des Druckverlusts fest, an dem Ventilatorreserve und Wechselstrategie beurteilt werden","Bepaalt de toename van het drukverlies waaraan ventilatorreserve en wisselstrategie worden getoetst","Fixe la hausse de perte de charge à l'aune de laquelle on juge la réserve du ventilateur et la stratégie de remplacement","Fija el aumento de pérdida de carga con el que se juzgan la reserva del ventilador y la estrategia de sustitución")},
{id:"q71",lay:"chapter",c:"guidance",s:"assumed",v:"90 EU/m³",tr:"02_outline/HIT_4A_final_v1.0.md:493",cd:"en1",wh:"w_en",ck:"k_en1",ap:["A8","E1"],ms:["m_wetsource","m_fluidmgmt","m_exposure_meas","m_hepa_supply"],su:L("Health-based advisory value for airborne endotoxin","Медично обґрунтована рекомендаційна величина для ендотоксину в повітрі","Gesundheitsbasierter Empfehlungswert für Endotoxin in der Luft","Gezondheidskundige advieswaarde voor endotoxine in de lucht","Valeur indicative sanitaire pour l'endotoxine en suspension","Valor orientativo sanitario para la endotoxina en suspensión"),sh:L("Bounds the endotoxin concentration in the breathing zone; it is proposed as advisory, not as a general statutory limit","Обмежує концентрацію ендотоксину в зоні дихання; запропоновано як рекомендацію, а не як загальну законодавчу межу","Begrenzt die Endotoxinkonzentration im Atembereich; vorgeschlagen als Empfehlung, nicht als allgemeine gesetzliche Grenze","Begrenst de endotoxineconcentratie in de ademzone; voorgesteld als advies, niet als algemene wettelijke grens","Borne la concentration d'endotoxine dans la zone respiratoire ; proposée à titre indicatif, non comme limite légale générale","Acota la concentración de endotoxina en la zona respiratoria; se propone como orientación, no como límite legal general")},
{id:"n01",lay:"paidstd",c:"standard",s:"assumed",wh:"wx_n01",ck:"kx_n01",ex:"ex_n01",ap:["E1","A1","A4"],ms:["m_source_first","m_leseal","m_torch","m_arm","m_hood_generic","m_table"],su:L("Capture velocity as a function of the contaminant class","Швидкість захоплення як функція класу забруднювача","Erfassungsgeschwindigkeit als Funktion der Schadstoffklasse","Vangsnelheid als functie van de verontreinigingsklasse","Vitesse de captage en fonction de la classe de polluant","Velocidad de captación en función de la clase de contaminante"),sh:L("Bounds the air velocity required at the capture point; it depends on the class and toxicity of the contaminant, the capture distance, the enclosure geometry, the momentum of the release itself and the cross-draughts in the room","Обмежує швидкість повітря, потрібну в точці захоплення; залежить від класу й токсичності забруднювача, відстані захоплення, геометрії укриття, імпульсу самого викиду та поперечних потоків у приміщенні","Begrenzt die am Erfassungspunkt erforderliche Luftgeschwindigkeit; sie hängt von Klasse und Toxizität des Schadstoffs, vom Erfassungsabstand, von der Einhausungsgeometrie, vom Impuls der Freisetzung und von den Querströmungen im Raum ab","Begrenst de luchtsnelheid die op het vangpunt nodig is; die hangt af van klasse en toxiciteit van de verontreiniging, de vangafstand, de omkastingsgeometrie, de impuls van de emissie zelf en de dwarsstromen in de ruimte","Borne la vitesse d'air requise au point de captage ; elle dépend de la classe et de la toxicité du polluant, de la distance de captage, de la géométrie de l'enceinte, de la quantité de mouvement du rejet et des courants transversaux du local","Acota la velocidad de aire requerida en el punto de captación; depende de la clase y toxicidad del contaminante, la distancia de captación, la geometría del encerramiento, el impulso de la propia emisión y las corrientes transversales del local")},
{id:"n02",lay:"paidstd",c:"standard",s:"assumed",wh:"wx_n02",ck:"kx_n02",ex:"ex_n02",ap:["A1","G3"],ms:["m_transportvel","m_ductclean","m_housekeep"],su:L("Transport velocity required in dust extraction ducts","Транспортна швидкість, потрібна у повітропроводах пиловидалення","Erforderliche Transportgeschwindigkeit in Entstaubungskanälen","Vereiste transportsnelheid in stofafzuigkanalen","Vitesse de transport requise dans les gaines de dépoussiérage","Velocidad de transporte requerida en conductos de aspiración de polvo"),sh:L("Bounds the minimum duct velocity at which the dust does not settle; it depends on the kind and grading of the dust, its moisture and stickiness, the duct geometry, the horizontal runs and the inactive branches","Обмежує мінімальну швидкість у повітропроводі, за якої пил не осідає; залежить від виду й гранулометрії пилу, його вологості й липкості, геометрії повітропроводу, горизонтальних ділянок і неактивних віток","Begrenzt die Mindestkanalgeschwindigkeit, bei der sich Staub nicht ablagert; sie hängt von Art und Körnung des Staubs, seiner Feuchte und Klebrigkeit, der Kanalgeometrie, den horizontalen Strecken und den inaktiven Strängen ab","Begrenst de minimale kanaalsnelheid waarbij het stof niet bezinkt; die hangt af van soort en korrelverdeling van het stof, vocht en kleverigheid, de kanaalgeometrie, de horizontale trajecten en de inactieve takken","Borne la vitesse minimale en gaine à laquelle la poussière ne se dépose pas ; elle dépend de la nature et de la granulométrie de la poussière, de son humidité et de son adhérence, de la géométrie des gaines, des tronçons horizontaux et des branches inactives","Acota la velocidad mínima en conducto a la que el polvo no sedimenta; depende del tipo y granulometría del polvo, su humedad y adherencia, la geometría del conducto, los tramos horizontales y las ramas inactivas")},
{id:"n03",lay:"paidstd",c:"standard",s:"assumed",wh:"wx_n03",ck:"kx_n03",ex:"ex_n03",ap:["P1","G6","W3"],ms:["m_pos","m_neg","m_airlock","m_leakage_def","m_matlock"],su:L("Pressure difference between zones of different cleanliness","Перепад тиску між зонами різної чистоти","Druckdifferenz zwischen Zonen unterschiedlicher Reinheit","Drukverschil tussen zones van verschillende reinheid","Différence de pression entre zones de propreté différente","Diferencia de presión entre zonas de distinta limpieza"),sh:L("Bounds the difference that keeps the flow direction; it depends on the leakage area of the envelope, the door regime, the presence of airlocks and on whether the product or the environment is being protected","Обмежує різницю, що утримує напрям перетікання; залежить від площі нещільностей огородження, режиму дверей, наявності шлюзів і від того, що саме захищають — продукт чи довкілля","Begrenzt die Differenz, die die Strömungsrichtung hält; sie hängt von der Leckfläche der Hülle, vom Türregime, vom Vorhandensein von Schleusen und davon ab, ob Produkt oder Umgebung geschützt wird","Begrenst het verschil dat de stromingsrichting handhaaft; dat hangt af van het lekoppervlak van de omhulling, het deurregime, de aanwezigheid van sluizen en of het product dan wel de omgeving wordt beschermd","Borne l'écart qui maintient le sens d'écoulement ; il dépend de la surface de fuite de l'enveloppe, du régime des portes, de la présence de sas et de ce que l'on protège, produit ou environnement","Acota la diferencia que mantiene el sentido del flujo; depende del área de fuga de la envolvente, el régimen de puertas, la existencia de esclusas y de si se protege el producto o el entorno")},
{id:"n04",lay:"paidstd",c:"standard",s:"assumed",wh:"wx_n04",ck:"kx_n04",ex:"ex_n04",ap:["P6","E6"],ms:["m_classify","m_recovery","m_unidir","m_occupancy"],su:L("Particle cleanliness class of the protected zone","Клас чистоти за частинками для захищеної зони","Partikelreinheitsklasse der geschützten Zone","Deeltjesreinheidsklasse van de beschermde zone","Classe de propreté particulaire de la zone protégée","Clase de limpieza por partículas de la zona protegida"),sh:L("Bounds the counted particle concentration per size and the sampling plan; it depends on the occupancy state, the process risk and the qualification method","Обмежує лічильну концентрацію частинок за розмірами та план відбору; залежить від стану зайнятості, ризику процесу та методу кваліфікації","Begrenzt die gezählte Partikelkonzentration je Größe und den Probenahmeplan; sie hängt vom Belegungszustand, vom Prozessrisiko und vom Qualifizierungsverfahren ab","Begrenst de getelde deeltjesconcentratie per grootte en het bemonsteringsplan; dat hangt af van de bezettingstoestand, het procesrisico en de kwalificatiemethode","Borne la concentration particulaire comptée par taille et le plan de prélèvement ; cela dépend de l'état d'occupation, du risque du procédé et de la méthode de qualification","Acota la concentración de partículas contada por tamaño y el plan de muestreo; depende del estado de ocupación, el riesgo del proceso y el método de cualificación")},
{id:"n05",lay:"paidstd",c:"standard",s:"assumed",wh:"wx_n05",ck:"kx_n05",ex:"ex_n05",ap:["G5","V1"],ms:["m_intake_filter","m_hepa_supply","m_multifilt","m_bagin","m_filtermon"],su:L("Filter performance designation and its test method","Позначення характеристики фільтра та метод його випробування","Leistungsbezeichnung eines Filters und das zugehörige Prüfverfahren","Prestatieaanduiding van een filter en de bijbehorende beproevingsmethode","Désignation de performance d'un filtre et sa méthode d'essai","Designación de prestaciones de un filtro y su método de ensayo"),sh:L("Bounds the efficiency claimed for a filter stage and the way it is proven; it depends on the particle size range of interest, the test aerosol, the face velocity and whether the filter is tested in place","Обмежує ефективність, заявлену для ступеня фільтрації, і спосіб її доведення; залежить від діапазону розмірів частинок, випробувального аерозолю, швидкості в перерізі та від того, чи випробовують фільтр на місці","Begrenzt die für eine Filterstufe angegebene Abscheideleistung und deren Nachweis; sie hängt vom interessierenden Partikelgrößenbereich, vom Prüfaerosol, von der Anströmgeschwindigkeit und davon ab, ob der Filter vor Ort geprüft wird","Begrenst het rendement dat voor een filtertrap wordt geclaimd en de wijze van aantonen; dat hangt af van het relevante deeltjesgroottegebied, het testaerosol, de aanstroomsnelheid en of het filter ter plaatse wordt beproefd","Borne l'efficacité annoncée pour un étage de filtration et sa démonstration ; cela dépend de la plage granulométrique visée, de l'aérosol d'essai, de la vitesse frontale et de l'essai éventuel en place","Acota la eficacia declarada para una etapa de filtración y su demostración; depende del rango de tamaños de interés, el aerosol de ensayo, la velocidad frontal y de si el filtro se ensaya en obra")},
{id:"n06",lay:"paidstd",c:"standard",s:"assumed",wh:"wx_n06",ck:"kx_n06",ex:"ex_n06",ap:["X1","X2","X3"],ms:["m_zone_gas","m_zone_dust","m_avail_vent","m_earthing","m_tempcap","m_explosion_doc"],su:L("Extent of the hazardous zone and the equipment category inside it","Протяжність вибухонебезпечної зони та категорія обладнання в ній","Ausdehnung der explosionsgefährdeten Zone und Gerätekategorie darin","Omvang van de gevarenzone en de apparatuurcategorie daarbinnen","Étendue de la zone dangereuse et catégorie de matériel qui s'y applique","Extensión de la zona peligrosa y categoría de equipos en su interior"),sh:L("Bounds the classified volume around a release and the equipment permitted inside it; it depends on the grade and duration of the release, the substance properties, the ventilation effectiveness and its proven availability","Обмежує класифікований об'єм навколо джерела витоку та обладнання, дозволене в ньому; залежить від класу й тривалості витоку, властивостей речовини, ефективності вентиляції та доведеної її доступності","Begrenzt das klassifizierte Volumen um eine Freisetzung und die dort zulässigen Geräte; es hängt von Grad und Dauer der Freisetzung, den Stoffeigenschaften, der Lüftungswirksamkeit und deren nachgewiesener Verfügbarkeit ab","Begrenst het geclassificeerde volume rond een emissie en de daarin toegestane apparatuur; dat hangt af van graad en duur van de emissie, de stofeigenschappen, de ventilatie-effectiviteit en de aangetoonde beschikbaarheid daarvan","Borne le volume classé autour d'un dégagement et le matériel admis à l'intérieur ; cela dépend du degré et de la durée du dégagement, des propriétés de la substance, de l'efficacité de la ventilation et de sa disponibilité prouvée","Acota el volumen clasificado en torno a un escape y los equipos admitidos en él; depende del grado y duración del escape, las propiedades de la sustancia, la eficacia de la ventilación y su disponibilidad probada")},
{id:"n07",lay:"paidstd",c:"standard",s:"assumed",wh:"wx_n07",ck:"kx_n07",ex:"ex_n07",ap:["X4","X2"],ms:["m_explvent","m_explisol","m_explsuppr","m_drysep_react"],su:L("Sizing of explosion venting, isolation and suppression on a collector","Розрахунок вибухорозвантаження, ізоляції та придушення на фільтрі-збірнику","Auslegung von Explosionsdruckentlastung, Entkopplung und Unterdrückung an einem Abscheider","Dimensionering van explosieontlasting, ontkoppeling en onderdrukking op een afscheider","Dimensionnement de l'évent, du découplage et de la suppression d'explosion sur un dépoussiéreur","Dimensionado del alivio, desacoplo y supresión de explosión en un separador"),sh:L("Bounds the vent area, the isolation distance and the response time; it depends on the dust explosion characteristics, the vessel volume and strength, and the duct runs into and out of it","Обмежує площу розвантаження, відстань ізоляції та час спрацьовування; залежить від вибухових характеристик пилу, об'єму й міцності апарата та ділянок повітропроводів до нього й від нього","Begrenzt Entlastungsfläche, Entkopplungsabstand und Ansprechzeit; sie hängen von den Staubexplosionskenngrößen, von Volumen und Festigkeit des Behälters sowie von den zu- und abführenden Kanälen ab","Begrenst het ontlastingsoppervlak, de ontkoppelingsafstand en de responstijd; dat hangt af van de stofexplosiekentallen, het volume en de sterkte van het toestel en de aan- en afvoerkanalen","Borne la surface d'évent, la distance de découplage et le temps de réponse ; cela dépend des caractéristiques d'explosivité de la poussière, du volume et de la résistance de l'appareil et des gaines amont et aval","Acota el área de alivio, la distancia de desacoplo y el tiempo de respuesta; depende de las características de explosividad del polvo, el volumen y la resistencia del equipo y los conductos de entrada y salida")},
{id:"n08",lay:"paidstd",c:"standard",s:"assumed",wh:"wx_n08",ck:"kx_n08",ex:"ex_n08",ap:["X5","O4"],ms:["m_firedamper","m_firestop","m_smokeextract","m_causeeffect","m_prioritydoc","m_firetest"],su:L("Fire resistance of the duct crossing and the classification of the damper","Вогнестійкість перетину повітропроводу та класифікація клапана","Feuerwiderstand der Kanaldurchführung und Klassifizierung der Klappe","Brandwerendheid van de kanaaldoorvoer en classificatie van de klep","Résistance au feu de la traversée de gaine et classification du clapet","Resistencia al fuego del paso del conducto y clasificación de la compuerta"),sh:L("Bounds the fire and smoke performance required where a duct crosses a compartment boundary; it depends on the compartment strategy, the duct orientation, the penetration detail and the actuation logic","Обмежує вимоги до вогне- та димостійкості там, де повітропровід перетинає межу відсіку; залежить від стратегії поділу на відсіки, орієнтації повітропроводу, вузла проходження та логіки спрацьовування","Begrenzt die geforderte Brand- und Rauchleistung dort, wo ein Kanal eine Abschnittsgrenze quert; sie hängt von der Abschnittsstrategie, der Kanallage, dem Durchführungsdetail und der Auslöselogik ab","Begrenst de vereiste brand- en rookprestatie waar een kanaal een compartimentsgrens kruist; dat hangt af van de compartimenteringsstrategie, de kanaalligging, het doorvoerdetail en de aansturingslogica","Borne la performance au feu et à la fumée exigée là où une gaine traverse une limite de compartiment ; cela dépend de la stratégie de compartimentage, de l'orientation de la gaine, du détail de traversée et de la logique de commande","Acota el desempeño frente a fuego y humo exigido donde un conducto cruza un límite de sector; depende de la estrategia de sectorización, la orientación del conducto, el detalle de paso y la lógica de accionamiento")},
{id:"n09",lay:"paidstd",c:"standard",s:"assumed",wh:"wx_n09",ck:"kx_n09",ex:"ex_n09",ap:["X6","O4"],ms:["m_totalflood","m_shutdown_ext","m_contvent","m_firetest"],su:L("Design concentration and hold time of the extinguishing agent","Розрахункова концентрація та час утримання вогнегасної речовини","Auslegungskonzentration und Haltezeit des Löschmittels","Ontwerpconcentratie en standtijd van het blusmiddel","Concentration de calcul et temps de maintien de l'agent extincteur","Concentración de cálculo y tiempo de mantenimiento del agente extintor"),sh:L("Bounds the agent quantity and the time the enclosure must stay tight; it depends on the protected volume, the enclosure leakage, the fuel and the ventilation that has to be stopped first","Обмежує кількість речовини та час, протягом якого приміщення має лишатися щільним; залежить від захищуваного об'єму, нещільності огородження, виду пального й вентиляції, яку треба спершу зупинити","Begrenzt die Löschmittelmenge und die Zeit, in der der Raum dicht bleiben muss; sie hängen vom geschützten Volumen, der Raumleckage, dem Brennstoff und der zuvor abzuschaltenden Lüftung ab","Begrenst de hoeveelheid middel en de tijd dat de ruimte dicht moet blijven; dat hangt af van het beschermde volume, de lekkage van de omhulling, de brandstof en de eerst te stoppen ventilatie","Borne la quantité d'agent et la durée pendant laquelle le local doit rester étanche ; cela dépend du volume protégé, de la fuite de l'enceinte, du combustible et de la ventilation à arrêter au préalable","Acota la cantidad de agente y el tiempo que el recinto debe permanecer estanco; depende del volumen protegido, la fuga de la envolvente, el combustible y la ventilación que hay que parar antes")},
{id:"n10",lay:"paidstd",c:"standard",s:"assumed",wh:"wx_n10",ck:"kx_n10",ex:"ex_n10",ap:["V3"],ms:["m_refrig_room","m_refrig_choice","m_gasdet"],su:L("Refrigerant charge limit and the machinery room requirements that follow from it","Гранична заправка холодоагентом і вимоги до машинного приміщення, що з неї випливають","Kältemittelfüllmengengrenze und die daraus folgenden Anforderungen an den Maschinenraum","Koudemiddelvullimiet en de daaruit volgende eisen aan de machinekamer","Limite de charge en fluide frigorigène et exigences de local machine qui en découlent","Límite de carga de refrigerante y requisitos de sala de máquinas que se derivan"),sh:L("Bounds the charge permitted for a given occupancy and room, and the emergency ventilation and detection that go with it; it depends on the refrigerant safety group, the room volume and the access category","Обмежує заправку, дозволену для певного типу зайнятості й приміщення, та пов'язані з нею аварійну вентиляцію й виявлення; залежить від групи безпеки холодоагенту, об'єму приміщення й категорії доступу","Begrenzt die für eine Nutzung und einen Raum zulässige Füllmenge sowie die zugehörige Notlüftung und Detektion; sie hängt von der Sicherheitsgruppe des Kältemittels, dem Raumvolumen und der Zugangskategorie ab","Begrenst de voor een gebruik en ruimte toegestane vulling en de bijbehorende noodventilatie en detectie; dat hangt af van de veiligheidsgroep van het koudemiddel, het ruimtevolume en de toegangscategorie","Borne la charge admise pour une occupation et un local donnés, ainsi que la ventilation de secours et la détection associées ; cela dépend du groupe de sécurité du fluide, du volume du local et de la catégorie d'accès","Acota la carga admitida para una ocupación y local dados, junto con la ventilación de emergencia y la detección asociadas; depende del grupo de seguridad del refrigerante, el volumen del local y la categoría de acceso")},
{id:"n11",lay:"paidstd",c:"standard",s:"assumed",wh:"wx_n11",ck:"kx_n11",ex:"ex_n11",ap:["X7"],ms:["m_h2_high","m_charge_interlock","m_avail_vent"],su:L("Ventilation requirement for a room where batteries are charged","Вимога до вентиляції приміщення, де заряджають акумулятори","Lüftungsanforderung für einen Raum, in dem Batterien geladen werden","Ventilatie-eis voor een ruimte waar accu's worden geladen","Exigence de ventilation pour un local de charge de batteries","Requisito de ventilación para un local donde se cargan baterías"),sh:L("Bounds the flow and the arrangement of the extract above the cells; it depends on the battery technology, the charging regime, the cell count and the enclosure of the battery","Обмежує витрату та розташування витяжки над елементами; залежить від технології акумулятора, режиму заряджання, кількості елементів і виконання корпусу батареї","Begrenzt Volumenstrom und Anordnung der Absaugung über den Zellen; sie hängen von der Batterietechnologie, dem Ladeverfahren, der Zellenzahl und der Einhausung der Batterie ab","Begrenst het debiet en de opstelling van de afzuiging boven de cellen; dat hangt af van de accutechnologie, het laadregime, het aantal cellen en de omkasting van de accu","Borne le débit et la disposition de l'extraction au-dessus des éléments ; cela dépend de la technologie de batterie, du régime de charge, du nombre d'éléments et de l'enveloppe de la batterie","Acota el caudal y la disposición de la extracción sobre los elementos; depende de la tecnología de batería, el régimen de carga, el número de elementos y la envolvente de la batería")},
{id:"n12",lay:"openlaw",c:"law",s:"assumed",wh:"wx_n12",ck:"kx_n12",ex:"ex_n12",ap:["E1","A2","A4","A7"],ms:["m_exposure_meas","m_source_first","m_toxic_once","m_closedtransfer"],su:L("Occupational exposure limit for the substance actually handled","Гранично допустима концентрація для речовини, яку насправді використовують","Arbeitsplatzgrenzwert für den tatsächlich gehandhabten Stoff","Grenswaarde voor beroepsmatige blootstelling aan de werkelijk gehanteerde stof","Valeur limite d'exposition professionnelle pour la substance réellement manipulée","Valor límite de exposición profesional para la sustancia realmente manipulada"),sh:L("Bounds the concentration in the breathing zone over a defined averaging period; it depends on the substance, the country of the project and the measurement strategy","Обмежує концентрацію в зоні дихання за визначений період усереднення; залежить від речовини, країни проєкту та стратегії вимірювання","Begrenzt die Konzentration im Atembereich über einen definierten Mittelungszeitraum; sie hängt vom Stoff, vom Land des Projekts und von der Messstrategie ab","Begrenst de concentratie in de ademzone over een gedefinieerde middelingsperiode; dat hangt af van de stof, het land van het project en de meetstrategie","Borne la concentration dans la zone respiratoire sur une période de moyennage définie ; cela dépend de la substance, du pays du projet et de la stratégie de mesure","Acota la concentración en la zona respiratoria durante un periodo de promediado definido; depende de la sustancia, el país del proyecto y la estrategia de medición")},
{id:"n13",lay:"openlaw",c:"law",s:"assumed",wh:"wx_n13",ck:"kx_n13",ex:"ex_n13",ap:["V2","V7"],ms:["m_stack","m_odour_treat","m_thermox","m_emerg_assess"],su:L("Discharge conditions and emission limits of the stack","Умови викиду та гранично допустимі викиди димової труби","Ableitbedingungen und Emissionsgrenzwerte des Kamins","Afvoercondities en emissiegrenswaarden van de schoorsteen","Conditions de rejet et valeurs limites d'émission de la cheminée","Condiciones de descarga y valores límite de emisión de la chimenea"),sh:L("Bounds what may leave the stack and under which conditions; it depends on the substances in the stream, the plant category, the surroundings and the permit of the site","Обмежує те, що може виходити з труби, і за яких умов; залежить від речовин у потоці, категорії установки, оточення та дозволу для майданчика","Begrenzt, was den Kamin verlassen darf und unter welchen Bedingungen; dies hängt von den Stoffen im Strom, der Anlagenkategorie, der Umgebung und der Genehmigung des Standorts ab","Begrenst wat de schoorsteen mag verlaten en onder welke condities; dat hangt af van de stoffen in de stroom, de inrichtingscategorie, de omgeving en de vergunning van de locatie","Borne ce qui peut sortir de la cheminée et à quelles conditions ; cela dépend des substances présentes, de la catégorie d'installation, de l'environnement et de l'autorisation du site","Acota lo que puede salir por la chimenea y en qué condiciones; depende de las sustancias presentes, la categoría de instalación, el entorno y la autorización del emplazamiento")},
{id:"n14",lay:"chapter",c:"method",s:"assumed",wh:"wx_n14",ck:"kx_n14",ex:"ex_n14",ap:["C1","W7","C4"],ms:["m_surfacetemp","m_insulate","m_leakdet_elec","m_no_wet_elec"],su:L("Safety margin between the surface temperature and the dew point","Запас безпеки між температурою поверхні та точкою роси","Sicherheitsabstand zwischen Oberflächentemperatur und Taupunkt","Veiligheidsmarge tussen oppervlaktetemperatuur en dauwpunt","Marge de sécurité entre la température de surface et le point de rosée","Margen de seguridad entre la temperatura superficial y el punto de rocío"),sh:L("Bounds how far the surface has to stay above the dew point of the adjacent air; the chapter gives the criterion but deliberately leaves the margin open, because it follows from measurement and control uncertainty, cold bridges, local stagnation and load variation","Обмежує, наскільки поверхня має лишатися вищою за точку роси прилеглого повітря; матеріал дає критерій, але свідомо лишає запас відкритим, бо він випливає з невизначеності вимірювання й регулювання, містків холоду, місцевого застою та змінності навантаження","Begrenzt, wie weit die Oberfläche über dem Taupunkt der angrenzenden Luft bleiben muss; das Material gibt das Kriterium, lässt die Reserve aber bewusst offen, da sie aus Mess- und Regelunsicherheit, Wärmebrücken, örtlicher Stagnation und Lastschwankung folgt","Begrenst hoever het oppervlak boven het dauwpunt van de aangrenzende lucht moet blijven; het materiaal geeft het criterium maar laat de marge bewust open, omdat die volgt uit meet- en regelonzekerheid, koudebruggen, plaatselijke stagnatie en lastvariatie","Borne l'écart minimal entre la surface et le point de rosée de l'air adjacent ; le matériau donne le critère mais laisse volontairement la marge ouverte, car elle découle de l'incertitude de mesure et de régulation, des ponts thermiques, des stagnations locales et des variations de charge","Acota cuánto debe mantenerse la superficie por encima del punto de rocío del aire adyacente; el material da el criterio pero deja la margen abierta a propósito, ya que se deriva de la incertidumbre de medida y control, los puentes térmicos, el estancamiento local y la variación de carga")},
{id:"n15",lay:"chapter",c:"method",s:"assumed",wh:"wx_n15",ck:"kx_n15",ex:"ex_n15",ap:["O1","P6","W1","W6","G1"],ms:["m_statematrix","m_peakdesign","m_classify","m_modeperm","m_tempcable","m_cleanmode"],su:L("Air change rate for a class of room","Кратність повітрообміну для класу приміщення","Luftwechsel für eine Raumklasse","Luchtwisseling voor een klasse van ruimte","Taux de renouvellement d'air pour une classe de local","Tasa de renovación de aire para una clase de local"),sh:L("Bounds the outdoor or treated air flow per room; the chapter states expressly that an air change rate is only the consequence of a calculation or of a proven configuration and never an independent design quantity","Обмежує витрату зовнішнього чи обробленого повітря на приміщення; матеріал прямо зазначає, що кратність повітрообміну є лише наслідком розрахунку або випробуваної конфігурації і ніколи не є самостійною проєктною величиною","Begrenzt den Außen- oder Zuluftstrom je Raum; das Material stellt ausdrücklich fest, dass ein Luftwechsel nur die Folge einer Berechnung oder einer erprobten Konfiguration ist und nie eine eigenständige Auslegungsgröße","Begrenst het buiten- of behandelde luchtdebiet per ruimte; het materiaal stelt uitdrukkelijk dat een luchtwisseling alleen het gevolg is van een berekening of een beproefde configuratie en nooit een zelfstandige ontwerpgrootheid","Borne le débit d'air neuf ou traité par local ; le matériau indique expressément qu'un taux de renouvellement n'est que la conséquence d'un calcul ou d'une configuration éprouvée et jamais une grandeur de conception autonome","Acota el caudal de aire exterior o tratado por local; el material señala expresamente que una tasa de renovación solo es consecuencia de un cálculo o de una configuración probada y nunca una magnitud de diseño autónoma")},
{id:"n16",lay:"chapter",c:"rule",s:"assumed",wh:"wx_n16",ck:"kx_n16",ex:"ex_n16",ap:["W1","P3"],ms:["m_dehum_cool","m_reheat","m_dpcontrol"],su:L("Bypass factor of the cooling coil","Байпас-фактор охолоджувальної батареї","Bypassfaktor des Kühlregisters","Bypassfactor van het koelblok","Facteur de contournement de la batterie froide","Factor de derivación de la batería de frío"),sh:L("Bounds how far the real outlet state departs from saturation; it depends on the coil geometry, the face velocity and the fin spacing, and the chapter gives no figure for it","Обмежує, наскільки реальний стан на виході відхиляється від насичення; залежить від геометрії батареї, швидкості в перерізі та кроку ламелей, і матеріал числа для нього не дає","Begrenzt, wie weit der reale Austrittszustand von der Sättigung abweicht; das hängt von Registergeometrie, Anströmgeschwindigkeit und Lamellenabstand ab, und das Material nennt dafür keine Zahl","Begrenst hoever de werkelijke uittredetoestand van verzadiging afwijkt; dat hangt af van de blokgeometrie, de aanstroomsnelheid en de lamelafstand, en het materiaal geeft er geen getal voor","Borne l'écart de l'état réel de sortie par rapport à la saturation ; cela dépend de la géométrie de la batterie, de la vitesse frontale et du pas d'ailettes, et le matériau n'en donne aucun chiffre","Acota cuánto se aparta de la saturación el estado real de salida; depende de la geometría de la batería, la velocidad frontal y el paso de aletas, y el material no da ninguna cifra")},
{id:"n17",lay:"chapter",c:"rule",s:"assumed",wh:"wx_n17",ck:"kx_n17",ex:"ex_n17",ap:["W2"],ms:["m_desicc_remote","m_desicc_hot","m_recirc_dry"],su:L("Regeneration temperature and flow of the desiccant rotor","Температура та витрата регенераційного повітря сорбційного ротора","Regenerationstemperatur und -volumenstrom des Sorptionsrotors","Regeneratietemperatuur en -debiet van de sorptierotor","Température et débit de régénération du rotor dessiccant","Temperatura y caudal de regeneración del rotor desecante"),sh:L("Bounds the heat that has to be supplied to the regeneration air; it depends on the depth of drying, the cascade of stages, the heat recovery and the limits on infiltration, and the chapter gives no figure for it","Обмежує теплоту, яку треба підвести до регенераційного повітря; залежить від глибини осушення, каскаду ступенів, теплоутилізації та обмежень інфільтрації, і матеріал числа для цього не дає","Begrenzt die der Regenerationsluft zuzuführende Wärme; sie hängt von der Trocknungstiefe, der Stufenkaskade, der Wärmerückgewinnung und den Infiltrationsgrenzen ab, und das Material nennt dafür keine Zahl","Begrenst de warmte die aan de regeneratielucht moet worden toegevoerd; dat hangt af van de droogdiepte, de trappencascade, de warmteterugwinning en de infiltratiegrenzen, en het materiaal geeft er geen getal voor","Borne la chaleur à fournir à l'air de régénération ; cela dépend de la profondeur de séchage, de la cascade d'étages, de la récupération et des limites d'infiltration, et le matériau n'en donne aucun chiffre","Acota el calor que hay que aportar al aire de regeneración; depende de la profundidad de secado, la cascada de etapas, la recuperación y los límites de infiltración, y el material no da ninguna cifra")},
{id:"n18",lay:"chapter",c:"method",s:"assumed",wh:"wx_n18",ck:"kx_n18",ex:"ex_n18",ap:["H3","H1","H4"],ms:["m_dedicatedcool","m_hotaisle","m_screen_rad","m_hrw_plate","m_hrw_wheel","m_hrw_dirty"],su:L("Specific heat gain of the process equipment","Питоме тепловиділення технологічного обладнання","Spezifischer Wärmeeintrag der Prozessausrüstung","Specifieke warmtelast van de procesapparatuur","Apport de chaleur spécifique des équipements de procédé","Ganancia de calor específica de los equipos de proceso"),sh:L("Bounds the internal heat load of the room; it depends on an inventory of the sources by operating mode, and the chapter names the inventory as the method rather than giving a figure per unit or per area","Обмежує внутрішнє теплове навантаження приміщення; залежить від інвентаризації джерел за режимами роботи, і матеріал називає методом саме інвентаризацію, а не число на одиницю обладнання чи на площу","Begrenzt die innere Wärmelast des Raums; sie hängt von einer Bestandsaufnahme der Quellen nach Betriebsart ab, und das Material nennt die Bestandsaufnahme als Methode statt einer Zahl je Gerät oder Fläche","Begrenst de interne warmtelast van de ruimte; dat hangt af van een inventarisatie van de bronnen per bedrijfstoestand, en het materiaal noemt de inventarisatie als methode in plaats van een getal per toestel of per oppervlak","Borne la charge thermique interne du local ; cela dépend d'un inventaire des sources par régime, et le matériau désigne l'inventaire comme méthode plutôt que de donner un chiffre par appareil ou par surface","Acota la carga térmica interna del local; depende de un inventario de las fuentes por régimen, y el material señala el inventario como método en lugar de dar una cifra por equipo o por superficie")},
{id:"n19",lay:"chapter",c:"guidance",s:"assumed",wh:"wx_n19",ck:"kx_n19",ex:"ex_n19",ap:["O7","G4","C2","C3","C5"],ms:["m_reverify","m_inspect_int","m_corr_insp","m_disturbtest","m_matcompat","m_coating","m_insp_hatch","m_cui_prog"],su:L("Interval between periodic function tests and inspections","Інтервал між періодичними випробуваннями функції та оглядами","Abstand zwischen wiederkehrenden Funktionsprüfungen und Inspektionen","Interval tussen periodieke functiebeproevingen en inspecties","Intervalle entre essais de fonction et inspections périodiques","Intervalo entre ensayos de función e inspecciones periódicas"),sh:L("Bounds how long a function may run unverified; it depends on the rate of degradation, the fouling observed and the history of results, and the chapter gives no calendar figure","Обмежує, як довго функція може працювати без перевірки; залежить від швидкості деградації, спостережуваного забруднення та історії результатів, і матеріал календарного числа не дає","Begrenzt, wie lange eine Funktion ungeprüft laufen darf; das hängt von der Degradationsrate, der beobachteten Verschmutzung und der Ergebnishistorie ab, und das Material nennt keine Kalenderzahl","Begrenst hoelang een functie ongecontroleerd mag draaien; dat hangt af van de degradatiesnelheid, de waargenomen vervuiling en de resultatenhistorie, en het materiaal geeft geen kalendergetal","Borne la durée pendant laquelle une fonction peut fonctionner sans vérification ; cela dépend de la vitesse de dégradation, de l'encrassement observé et de l'historique, et le matériau ne donne aucun délai calendaire","Acota cuánto puede funcionar sin verificar una función; depende de la velocidad de degradación, el ensuciamiento observado y el historial, y el material no da un plazo de calendario")},
{id:"n20",lay:"chapter",c:"guidance",s:"assumed",wh:"wx_n20",ck:"kx_n20",ex:"ex_n20",ap:["O5","O3"],ms:["m_redundant","m_singletrain","m_emerpower","m_contfunc"],su:L("Required availability of the ventilation function","Потрібна доступність функції вентиляції","Erforderliche Verfügbarkeit der Lüftungsfunktion","Vereiste beschikbaarheid van de ventilatiefunctie","Disponibilité requise de la fonction de ventilation","Disponibilidad requerida de la función de ventilación"),sh:L("Bounds how much unavailability the process can absorb; it depends on the changeover time, the common-cause failures and the consequence of losing the function, and the chapter fixes no target figure","Обмежує, скільки недоступності може витримати процес; залежить від часу перемикання, відмов із загальної причини та наслідків втрати функції, і матеріал цільового числа не фіксує","Begrenzt, wie viel Nichtverfügbarkeit der Prozess verträgt; das hängt von der Umschaltzeit, den Ausfällen gemeinsamer Ursache und der Folge des Funktionsverlusts ab, und das Material legt keinen Zielwert fest","Begrenst hoeveel onbeschikbaarheid het proces kan opvangen; dat hangt af van de omschakeltijd, de gemeenschappelijke-oorzaakstoringen en het gevolg van functieverlies, en het materiaal legt geen streefgetal vast","Borne l'indisponibilité que le procédé peut absorber ; cela dépend du temps de basculement, des défaillances de cause commune et de la conséquence de la perte de fonction, et le matériau ne fixe aucune cible","Acota cuánta indisponibilidad puede absorber el proceso; depende del tiempo de conmutación, los fallos de causa común y la consecuencia de perder la función, y el material no fija una cifra objetivo")},
{id:"n21",lay:"chapter",c:"method",s:"assumed",wh:"wx_n21",ck:"kx_n21",ex:"ex_n21",ap:["V1","H6","C3"],ms:["m_intake_place","m_freecool","m_naturalvent","m_saltfilter"],su:L("Outdoor design conditions for the installation","Розрахункові зовнішні умови для установки","Außenauslegungsbedingungen für die Anlage","Buitenontwerpcondities voor de installatie","Conditions extérieures de calcul pour l'installation","Condiciones exteriores de cálculo para la instalación"),sh:L("Bounds the design temperature and humidity of the outdoor air; they depend on the location, the exceedance level accepted and the operating regime, and the chapter refers them to the project design basis instead of naming values","Обмежує розрахункові температуру й вологість зовнішнього повітря; вони залежать від місця розташування, прийнятої забезпеченості та режиму роботи, і матеріал відсилає їх до проєктної основи замість називання величин","Begrenzt Auslegungstemperatur und -feuchte der Außenluft; sie hängen von Standort, akzeptierter Überschreitungshäufigkeit und Betriebsweise ab, und das Material verweist sie auf die Auslegungsgrundlage statt Werte zu nennen","Begrenst de ontwerptemperatuur en -vochtigheid van de buitenlucht; die hangen af van de locatie, de aanvaarde overschrijdingsfrequentie en het bedrijfsregime, en het materiaal verwijst ze naar de ontwerpbasis in plaats van waarden te noemen","Borne la température et l'humidité extérieures de calcul ; elles dépendent du lieu, du niveau de dépassement accepté et du régime, et le matériau les renvoie à la base de conception au lieu de citer des valeurs","Acota la temperatura y humedad exteriores de cálculo; dependen de la ubicación, el nivel de excedencia aceptado y el régimen, y el material las remite a la base de diseño en lugar de nombrar valores")}
];

/* ---------- key conditions: source layers, indexes and rendering ----------
   The three layers are told apart by colour, by border style and by a shape
   glyph, so a value quoted from a worked example cannot be mistaken for a
   requirement laid down by a document. */
var LAYS=["openlaw","paidstd","chapter"];
var LKEY={openlaw:"pv_l_openlaw",chapter:"pv_l_chapter",paidstd:"pv_l_paidstd"};
var LDESC={openlaw:"pv_d_openlaw",chapter:"pv_d_chapter",paidstd:"pv_d_paidstd"};
var LSHAPE={openlaw:"§",paidstd:"◫",chapter:"◐"};
var PVBY={},PVOFMS={},PVOFAP={};
PROV.forEach(function(r){PVBY[r.id]=r;
  r.ms.forEach(function(m){(PVOFMS[m]=PVOFMS[m]||[]).push(r);});
  r.ap.forEach(function(a){(PVOFAP[a]=PVOFAP[a]||[]).push(r);});});
var PVOPEN=Object.create(null);
function layOrder(a,b){return LAYS.indexOf(a.lay)-LAYS.indexOf(b.lay);}
/* A measure inherits the entries of its own attention point, so the panel is
   never empty where the material has something to say about the situation. */
/* An entry is withheld from an industry when every measure it is tied to that
   this industry's own attention points would otherwise offer is a measure this
   page marks as belonging to a different process. A refuge-volume condition
   therefore does not follow the escape-route point into a glass works, in the
   same way that a foreign measure is not offered there. Where the entry ties to
   no such measure at all, the attention point alone decides, as before. */
function pvForeign(r,sid){
  var s=INDBY[sid];if(!s)return false;
  var has={};s.aps.forEach(function(a){has[a]=1;});
  var cand=r.ms.filter(function(x){var m=MSBY[x];return m&&has[m.ap];});
  if(!cand.length)return false;
  return cand.every(function(x){var m=MSBY[x];return !!(m.x&&m.x.indexOf(sid)>=0);});
}
function provOfMeasure(mid,sid){
  var m=MSBY[mid],seen={},out=[];
  function take(r){if(seen[r.id])return;if(sid&&pvForeign(r,sid))return;seen[r.id]=1;out.push(r);}
  (PVOFMS[mid]||[]).forEach(take);
  if(m)(PVOFAP[m.ap]||[]).forEach(take);
  return out.sort(layOrder);
}
function provOfAp(a,sid){
  return (PVOFAP[a]||[]).filter(function(r){return !(sid&&pvForeign(r,sid));}).sort(layOrder);
}
function layBadge(l){

function layInner(l){

}
/* The traceability stays machine-readable and stays inside the page, but the
   file and line of the worked material are carried in data attributes only:
   the item codes of the source book are never printed for the reader. */
function trFile(t){var s=String(t||""),i=s.lastIndexOf(":");return i<0?s:s.slice(0,i);}
function trLine(t){var s=String(t||""),i=s.lastIndexOf(":");return i<0?"":s.slice(i+1);}
function provRow(r){
  var h='<div class="pvr l-'+r.lay+'" data-entry="'+esc(r.id)+'" data-layer="'+esc(r.lay)+'"'+
    (r.tr?' data-source-file="'+esc(trFile(r.tr))+'" data-source-line="'+esc(trLine(r.tr))+'"':"")+'>';
  h+='<span class="pvsub">'+esc(tx(r.su))+'</span>';
  h+='<div class="pvbd">'+layBadge(r.lay)+catBadge(r.c)+statBadge(r.s)+'</div>';
  if(r.v)h+='<div class="pvv">'+esc(T("pv_val"))+': '+esc(r.v)+'</div>';
  h+='<p class="pvf"><b>'+esc(T("pv_shape"))+'</b>'+esc(tx(r.sh))+'</p>';
  if(r.cd&&PCD[r.cd])h+='<p class="pvf"><b>'+esc(T("pv_cond"))+'</b>'+esc(tx(PCD[r.cd]))+'</p>';
  if(r.ck&&PCK[r.ck])h+='<p class="pvf"><b>'+esc(T(r.v?"pv_check":"pv_dec"))+'</b>'+esc(tx(PCK[r.ck]))+'</p>';
  if(r.ex&&PEX[r.ex])h+='<p class="pvf"><b>'+esc(T("pv_exp"))+'</b>'+esc(tx(PEX[r.ex]))+'</p>';
  if(r.wh&&PWH[r.wh])h+='<p class="pvf"><b>'+esc(T("pv_where"))+'</b>'+esc(tx(PWH[r.wh]))+'</p>';
  if(r.tr)h+='<p class="pvtr">'+esc(T("pv_trace"))+'</p>';
  if(r.lay==="paidstd")h+='<p class="pvno">'+esc(T("pv_nonum"))+'</p>';
  if(r.lay==="openlaw")h+='<p class="pvno">'+esc(T("pv_edition"))+'</p>';

}

/* ---------- rule engine ---------- */
function evaluate(selArr){
  var S={};selArr.forEach(function(x){S[x]=1;});
  var hard=[],warn=[],hint=[];
  RULES.forEach(function(r){
    if(r.k==="pair"){ if(S[r.a]&&!S[r.b]) hint.push(r); return; }
    if(S[r.a]&&S[r.b]){ (r.k==="hard"?hard:warn).push(r); }
  });
  return {hard:hard,warn:warn,hint:hint};
}

/* ---------- typical starting set and conflict demonstration ---------- */
var PRESET={},DEMO={};
function presetFor(sid){
  if(PRESET[sid])return PRESET[sid];
  var chosen=[];
  apsOf(sid).forEach(function(i){
    var list=msOf(i,sid);
    if(list.some(function(m){return chosen.indexOf(m.id)>=0;}))return;
    for(var k=0;k<list.length;k++){
      var trial=chosen.concat([list[k].id]);
      var r=evaluate(trial);
      if(!r.hard.length&&!r.warn.length){chosen=trial;return;}
    }
  });
  var avail={};measuresOf(sid).forEach(function(m){avail[m.id]=1;});
  for(var pass=0;pass<4;pass++){
    var added=false;
    evaluate(chosen).hint.forEach(function(h){
      if(!avail[h.b]||chosen.indexOf(h.b)>=0)return;
      var trial=chosen.concat([h.b]);
      var q=evaluate(trial);
      if(!q.hard.length&&!q.warn.length){chosen=trial;added=true;}
    });
    if(!added)break;
  }
  PRESET[sid]=chosen;return chosen;
}
function demoFor(sid){
  if(DEMO[sid]!==undefined)return DEMO[sid];
  var avail={};measuresOf(sid).forEach(function(m){avail[m.id]=1;});
  var found=null;
  RULES.forEach(function(r){if(found||r.k!=="hard")return;if(avail[r.a]&&avail[r.b])found=r;});
  if(!found)RULES.forEach(function(r){if(found||r.k!=="warn")return;if(avail[r.a]&&avail[r.b])found=r;});
  DEMO[sid]=found;return found;
}

/* ---------- rendering ----------
   Every function below turns the current selection into markup and nothing
   else: it reads the state, it returns a string, and it touches no element.
   The shell decides where the markup lands — a framework panel when
   diagram-ui.js is present, the plain fallback shell when it is not. */
function catCount(c){
  var n=0;
  apsOf(state.a).forEach(function(i){
    if(APBY[i].c===c)n++;
    msOf(i,state.a).forEach(function(m){if(m.c===c)n++;});
  });
  return n;
}
function legendHTML(){
  var h='<span class="mini lgl">'+esc(T("lg_cat"))+':</span>';
  CATS.forEach(function(c){h+=catBadge(c,' <span class="cn">'+catCount(c)+'</span>');});
  h+='<span class="mini lgl">'+esc(T("lg_stat"))+':</span>';
  ["confirmed","assumed"].forEach(function(s){h+=statBadge(s);});
  return h;
}

function apPass(i){
  if(!state.f)return true;
  if(APBY[i].c===state.f)return true;
  return msOf(i,state.a).some(function(m){return m.c===state.f;});

    list.forEach(function(i){

            '<div class="apnote">'+esc(tx(a.n))+'</div>'+
            provBlock("pvA_"+a.id,provOfAp(a.id,state.a),T("pv_ah"),tx(a.t))+'<ul class="ms">';
      msOf(i,state.a).forEach(function(m){
        if(state.f&&m.c!==state.f)return;
        html+='<li'+(SEL(m.id)?' class="sel"':'')+'><label><input type="checkbox" data-m="'+m.id+'"'+(SEL(m.id)?" checked":"")+'>'+
              '<span class="mtx">'+esc(tx(m.t))+'</span></label>'+badges(m)+
              provBlock("pvM_"+m.id,provOfMeasure(m.id,state.a),T("pv_th"),tx(m.t))+'</li>';
      });
      html+='</ul></div>';
    });
    html+='</div>';
  });
  return html;
}
/* The six live tiles, as data: the framework draws them in the results region
   and lifts the first three onto the mobile result strip. */

    {label:T("k_cov"), value:cov+" / "+ids.length, tone:cov?"ok":""},
    {label:T("k_open"), value:String(open), tone:open?"warn":"ok"},
    {label:T("r_conf"), value:String(res.hard.length), tone:res.hard.length?"bad":"ok"},
    {label:T("r_warn"), value:String(res.warn.length), tone:res.warn.length?"warn":"ok", headline:false},
    {label:T("r_hint"), value:String(res.hint.length), tone:res.hint.length?"info":"ok", headline:false},
    {label:T("r_meas"), value:String(sel), tone:"", headline:false}

function compareHTML(){

  var both=A.filter(function(x){return B.indexOf(x)>=0;});
  function apList(arr){return arr.length?'<ul>'+arr.map(function(i){
      return '<li data-ap="'+i+'">'+esc(T(GKEY[APBY[i].g]))+' &middot; '+esc(tx(APBY[i].t))+'</li>';}).join("")+'</ul>'
      :'<p class="mini">'+esc(T("exp_none"))+'</p>';}

/* ---------- immediate feedback ---------- */
function flashTick(mid,on){
  var m=MSBY[mid];if(!m){FLASH=[];return;}
  var ap=APBY[m.ap];
  var others=msOf(m.ap,state.a).filter(function(x){return x.id!==mid&&SEL(x.id);});
  var parts=[];
  if(on){
    parts.push([others.length?"info":"ok","fl_closed",ap.id]);
    if(others.length)parts.push(["info","fl_already"]);
    var res=evaluate(selectedHere());
    var cf=res.hard.filter(function(r){return r.a===mid||r.b===mid;});
    var wr=res.warn.filter(function(r){return r.a===mid||r.b===mid;});
    cf.forEach(function(r){var o=(r.a===mid?r.b:r.a);
      parts.push(["bad","fl_conf",o,r.id]);});
    wr.forEach(function(r){var o=(r.a===mid?r.b:r.a);
      parts.push(["warn","fl_warn2",o,r.id]);});
    if(!cf.length&&!wr.length)parts.push(["ok","fl_clean"]);
    res.hint.forEach(function(r){if(r.a===mid)parts.push(["info","fl_next",r.b]);});
  }else{
    if(others.length)parts.push(["info","fl_reopen2"]);
    else parts.push(["warn","fl_reopen",ap.id]);
  }
  FLASH=parts;
}

/* ---------- structural checks (internal hygiene, not part of the interface) ---------- */
function structuralChecks(){
  var out=[],apIds={},msIds={},allIds={},dup=false;
  function reg(id){if(allIds[id])dup=true;allIds[id]=1;}
  AP.forEach(function(a){apIds[a.id]=1;reg(a.id);});
  MS.forEach(function(m){msIds[m.id]=1;reg(m.id);});
  RULES.forEach(function(r){reg(r.id);});
  IND.forEach(function(s){reg(s.id);});

  var missing=0;
  function chk(d){if(!d){missing++;return;}LANGS.forEach(function(l){
    if(typeof d[l]!=="string"||!d[l].trim())missing++;});}
  AP.forEach(function(a){chk(a.t);chk(a.n);});
  MS.forEach(function(m){chk(m.t);});
  RULES.forEach(function(r){chk(r.x);});
  IND.forEach(function(s){chk(s.t);});
  Object.keys(UI).forEach(function(k){chk(UI[k]);});
  out.push(["v1",missing===0]);

  out.push(["v2",MS.filter(function(m){return !apIds[m.ap];}).length===0]);
  out.push(["v3",RULES.filter(function(r){return !msIds[r.a]||!msIds[r.b];}).length===0]);

  /* The rule engine is re-checked against the rule table by a second path.
     Feeding a pair back into evaluate() in both orders proves nothing, because
     the engine reads the selection as a set; so the expectation is read
     straight out of RULES with an index built here, and the engine has to
     reproduce it: the pair is reported with the declared severity when both
     measures are ticked, and nothing is reported when only one of them is. */
  var pairSeen={},pairDup=0,engineMiss=0,engineGhost=0;
  RULES.forEach(function(r){
    if(r.k==="pair")return;
    var key=[r.a,r.b].sort().join("|");
    if(pairSeen[key])pairDup++; pairSeen[key]=r.k;
  });
  Object.keys(pairSeen).forEach(function(key){
    var ab=key.split("|"),kind=pairSeen[key];
    var both=evaluate(ab),lone=evaluate([ab[0]]);
    var hit=(kind==="hard"?both.hard:both.warn).filter(function(r){
      return (r.a===ab[0]&&r.b===ab[1])||(r.a===ab[1]&&r.b===ab[0]);}).length;
    var wrong=(kind==="hard"?both.warn:both.hard).filter(function(r){
      return (r.a===ab[0]&&r.b===ab[1])||(r.a===ab[1]&&r.b===ab[0]);}).length;
    if(hit!==1||wrong)engineMiss++;
    if(lone.hard.length||lone.warn.length)engineGhost++;
  });
  out.push(["v4",pairDup===0&&engineMiss===0&&engineGhost===0]);
  out.push(["v5",!dup]);

  var uncov=0;
  IND.forEach(function(s){
    var gs={};s.aps.forEach(function(i){if(APBY[i])gs[APBY[i].g]=1;});
    GROUPS.forEach(function(g){if(!gs[g])uncov++;});
  });
  out.push(["v6",uncov===0]);

  var badge=0;
  AP.concat(MS).forEach(function(o){if(!CKEY[o.c]||!SKEY[o.s])badge++;});
  out.push(["v7",badge===0]);
  out.push(["v8",RULES.filter(function(r){return r.a===r.b;}).length===0]);

  var used={};IND.forEach(function(s){s.aps.forEach(function(i){used[i]=1;});});
  out.push(["v9",AP.filter(function(a){return !used[a.id];}).length===0]);

  /* The typical set is built with the rule engine, so re-running the engine on
     it would only repeat the construction. Instead every unordered pair of the
     set is looked up directly in an index of the rule table: an engine that
     stopped reporting a conflict would leave that conflict inside the set, and
     this pass would find it there. */
  var RIDX={};
  RULES.forEach(function(r){if(r.k!=="pair")RIDX[[r.a,r.b].sort().join("|")]=r.k;});
  var badPreset=0,presetClash=0;
  IND.forEach(function(s){
    var p=presetFor(s.id),i,j;
    if(!p.length){badPreset++;return;}
    for(i=0;i<p.length;i++)for(j=i+1;j<p.length;j++){
      if(RIDX[[p[i],p[j]].sort().join("|")])presetClash++;
    }
  });
  out.push(["v10",badPreset===0&&presetClash===0]);
  /* The demonstration must exist in the rule table and the engine must actually
     report it, otherwise the button would promise a conflict it cannot show. */
  var demoBad=0;
  IND.forEach(function(s){
    var d=demoFor(s.id);
    if(!d||!RIDX[[d.a,d.b].sort().join("|")]){demoBad++;return;}
    var e=evaluate([d.a,d.b]);
    if(!e.hard.length&&!e.warn.length)demoBad++;
  });
  out.push(["v11",demoBad===0]);

  var hazBad=0;
  IND.forEach(function(s){
    var set=presetFor(s.id).slice();
    apsOf(s.id).forEach(function(i){
      var a=APBY[i];
      if(!a||a.g!=="ex"||a.c!=="law")return;
      var list=msOf(i,s.id);
      if(list.length&&set.indexOf(list[0].id)<0)set.push(list[0].id);
    });
    if(evaluate(set).hard.length)hazBad++;
  });
  out.push(["v12",hazBad===0]);

  /* Asking msOf() whether its own output still contains a foreign measure can
     only ever answer no. The list a point offers is therefore rebuilt here from
     the measure table alone and compared with the list the page renders, so a
     filter that stopped filtering — or started dropping measures — is seen. */
  var foreign=0,starved=0;
  IND.forEach(function(s){
    apsOf(s.id).forEach(function(i){
      var shown=msOf(i,s.id).map(function(m){return m.id;}).sort().join(",");
      var want=MS.filter(function(m){
        return m.ap===i&&!(m.x&&m.x.indexOf(s.id)>=0);}).map(function(m){return m.id;}).sort().join(",");
      if(shown!==want)foreign++;
      if(!want.length)starved++;
    });
  });
  out.push(["v13",foreign===0&&starved===0]);

  /* --- key conditions layer: the strict part of the hygiene --- */
  var DIG=/[0-9]/,NUMS=/[0-9]+/g;
  function numsOf(s){return (String(s).match(NUMS)||[]).join("|");}
  function sameNums(d){
    if(!d)return true;
    var base=numsOf(d[LANGS[0]]);
    for(var i=1;i<LANGS.length;i++){if(numsOf(d[LANGS[i]])!==base)return false;}
    return true;
  }
  function pvTexts(r){
    var a=[],dicts=[r.su,r.sh,r.cd&&PCD[r.cd],r.wh&&PWH[r.wh],r.ck&&PCK[r.ck],r.ex&&PEX[r.ex]];
    dicts.forEach(function(d){if(d)LANGS.forEach(function(l){a.push(String(d[l]||""));});});
    return a;
  }
  var pvPaid=0,pvTrace=0,pvStruct=0,pvNum=0,pvGenre=0,pvSrc=0;
  PROV.forEach(function(r){
    chk(r.su);chk(r.sh);
    if(!CKEY[r.c]||!SKEY[r.s]||!LKEY[r.lay])pvStruct++;
    if(r.lay==="paidstd"){
      if(r.v)pvPaid++;
      else if(pvTexts(r).some(function(s){return DIG.test(s);}))pvPaid++;
    }
    /* A figure is a figure wherever the reader meets it. The demand for
       traceability therefore covers the whole visible body of the entry in all
       seven languages, not only the separate figure field: a number slipped into
       the subject, the shape, the assumptions, the place to look or the check
       would otherwise carry no source at all. */
    var hasNum=!!(r.v&&DIG.test(String(r.v)));
    if(!hasNum)hasNum=pvTexts(r).some(function(s){return DIG.test(s);});
    if(hasNum&&!(r.tr&&String(r.tr).length>0))pvTrace++;
    /* And a named file has to be a file that exists, at a line that exists. */
    if(r.tr){
      var f=trFile(r.tr),ln=trLine(r.tr),n=parseInt(ln,10);
      if(!Object.prototype.hasOwnProperty.call(SRCFILES,f))pvSrc++;
      else if(!/^[0-9]+$/.test(ln)||!(n>=1)||n>SRCFILES[f])pvSrc++;
    }
    if(!r.wh||!PWH[r.wh]||!r.ck||!PCK[r.ck])pvStruct++;
    var ok=r.ap.filter(function(x){return APBY[x];}).length+r.ms.filter(function(x){return MSBY[x];}).length;
    if(!ok||ok!==r.ap.length+r.ms.length)pvStruct++;
    if(!sameNums(r.su)||!sameNums(r.sh)||(r.cd&&!sameNums(PCD[r.cd]))||
       (r.wh&&!sameNums(PWH[r.wh]))||(r.ck&&!sameNums(PCK[r.ck]))||(r.ex&&!sameNums(PEX[r.ex])))pvNum++;
  });
  /* Genre guard: this stays a first-level advisor, so nothing may read as an
     obligation upon the reader or as a claim that one measure is enough. */
  var BAN={en:["you must","is mandatory","is sufficient","is enough"],
    uk:["ви зобов","цього достатньо"],
    de:["sie müssen","ist ausreichend","das genügt"],
    nl:["u moet","is voldoende","dat volstaat"],
    fr:["vous devez","est suffisant","cela suffit"],
    es:["usted debe","es suficiente","esto basta"]};
  function genre(d){
    if(!d)return;
    LANGS.forEach(function(l){
      var s=String(d[l]||"").toLowerCase();
      (BAN[l]||[]).forEach(function(w){if(s.indexOf(w)>=0)pvGenre++;});
    });
  }
  PROV.forEach(function(r){
    genre(r.su);genre(r.sh);
    if(r.cd)genre(PCD[r.cd]);
    if(r.wh)genre(PWH[r.wh]);
    if(r.ck)genre(PCK[r.ck]);
    if(r.ex)genre(PEX[r.ex]);
  });
  Object.keys(UI).forEach(function(k){genre(UI[k]);});
  AP.forEach(function(a){genre(a.t);genre(a.n);});
  MS.forEach(function(m){genre(m.t);});
  RULES.forEach(function(r){genre(r.x);});
  out.push(["v14",pvPaid===0]);
  out.push(["v15",pvTrace===0]);
  out.push(["v16",pvStruct===0&&PROV.length>0]);
  out.push(["v17",pvGenre===0]);
  out.push(["v18",pvNum===0]);
  out.push(["v19",pvSrc===0&&PROV.filter(function(r){return r.tr;}).length>0]);

  /* What each industry is shown is rebuilt here from the three tables on their
     own — points of the industry, measures of those points, entries tied to
     either — and compared with what the panels actually hand out. A condition
     whose measures all belong to another process must not follow an attention
     point into an industry that will never build them; if the filter in the
     rendering path were removed or widened, the two sets would part here. */
  var pvLeak=0,pvLost=0;
  IND.forEach(function(s){
    var has={};s.aps.forEach(function(a){if(APBY[a])has[a]=1;});
    var offered={};
    Object.keys(has).forEach(function(a){
      MS.forEach(function(m){if(m.ap===a&&!(m.x&&m.x.indexOf(s.id)>=0))offered[m.id]=1;});
    });
    var want={};
    PROV.forEach(function(r){
      var tied=r.ms.filter(function(x){var m=MSBY[x];return m&&has[m.ap];});
      var barred=tied.length&&tied.every(function(x){return offered[x]!==1;});
      if(barred)return;
      if(r.ap.some(function(a){return has[a];})||r.ms.some(function(x){return offered[x]===1;}))want[r.id]=1;
    });
    var got={};
    Object.keys(has).forEach(function(a){provOfAp(a,s.id).forEach(function(r){got[r.id]=1;});});
    Object.keys(offered).forEach(function(m){provOfMeasure(m,s.id).forEach(function(r){got[r.id]=1;});});
    Object.keys(got).forEach(function(id){if(!want[id])pvLeak++;});
    Object.keys(want).forEach(function(id){if(!got[id])pvLost++;});
  });
  out.push(["v20",pvLeak===0&&pvLost===0]);

  /* The traceability is kept, but the source material keeps its own numbering,
     and that numbering is not published here. The panels are therefore rendered
     into a detached node in every language and read back as the reader would
     read them — text, and the attributes a screen reader speaks — so that an
     item code or a file path cannot creep back into view through a template. */
  var HIDDEN=/(4A[-._])|(\.(?:md|csv|json|zip)\b)|(\b(?:D-data|F-cards|02_outline|07_normative)\b)|(calculations\/)/i;
  var codeLeak=0,keepLang=LANG,box=document.createElement("div"),li,ni,att,q;
  try{
    for(li=0;li<LANGS.length;li++){
      LANG=LANGS[li];
      box.innerHTML=PROV.map(provRow).join("");
      if(HIDDEN.test(box.textContent))codeLeak++;
      att=box.querySelectorAll("[title],[aria-label],[alt]");
      for(ni=0;ni<att.length;ni++){
        q=(att[ni].getAttribute("title")||"")+" "+(att[ni].getAttribute("aria-label")||"")+" "+(att[ni].getAttribute("alt")||"");
        if(HIDDEN.test(q))codeLeak++;
      }
    }
  }finally{LANG=keepLang;box.innerHTML="";}
  out.push(["v21",codeLeak===0]);
  /* The entry texts were counted after v1 was pushed, so its verdict is settled
     here, once every translated string of the page has been through chk(). */
  out[0][1]=(missing===0);
  return out;
}
var CHECKS=structuralChecks();

/* ---------- export ---------- */
function buildReport(res){

  var ids=apsOf(state.a);

  var s=T("exp_hdr")+nl+L1+nl;

  s+=T("r_ap")+": "+ids.length+nl+T("r_ap_hit")+": "+touched.length+" / "+ids.length+nl;
  s+=T("r_meas")+": "+selectedHere().length+nl+nl;
  GROUPS.forEach(function(g){
    var list=ids.filter(function(i){return APBY[i].g===g;});

    s+="["+T(GKEY[g]).toUpperCase()+"]"+nl;
    list.forEach(function(i){

      msOf(i,state.a).forEach(function(m){
        if(SEL(m.id))s+="      [x] "+tx(m.t)+"  ("+T(CKEY[m.c])+" / "+T(SKEY[m.s])+")"+nl;});
    });

  });
  s+=L1+nl+T("h_conf")+" ("+res.hard.length+")"+nl;
  if(!res.hard.length)s+="  "+T("exp_none")+nl;
  res.hard.forEach(function(r){s+="  ! "+tx(MSBY[r.a].t)+" <-> "+tx(MSBY[r.b].t)+nl+"    "+tx(r.x)+nl;});
  s+=nl+T("h_warn")+" ("+res.warn.length+")"+nl;
  if(!res.warn.length)s+="  "+T("exp_none")+nl;
  res.warn.forEach(function(r){s+="  ? "+tx(MSBY[r.a].t)+" + "+tx(MSBY[r.b].t)+nl+"    "+tx(r.x)+nl;});
  s+=nl+T("h_hint")+" ("+res.hint.length+")"+nl;
  if(!res.hint.length)s+="  "+T("exp_none")+nl;
  res.hint.forEach(function(r){s+="  > "+tx(MSBY[r.a].t)+" -> "+tx(MSBY[r.b].t)+nl+"    "+tx(r.x)+nl;});
  var unc=ids.filter(function(i){return !covered(i);});
  s+=nl+T("h_unc")+" ("+unc.length+")"+nl;
  if(!unc.length)s+="  "+T("n_unc_none")+nl;
  unc.forEach(function(i){s+="  - "+T(GKEY[APBY[i].g])+" / "+tx(APBY[i].t)+nl;});
  s+=nl+L1+nl+T("exp_dis")+nl;
  ["lim1","lim2","lim3","lim4","lim5","lim6"].forEach(function(k,n){s+=(n+1)+". "+T(k)+nl;});

/* ---------- update, keeping the keyboard position ---------- */
function focusToken(){
  var a=document.activeElement,sel=null;
  if(!a||!a.getAttribute)return null;
  if(a.getAttribute("data-m"))sel='input[data-m="'+a.getAttribute("data-m")+'"]';
  else if(a.getAttribute("data-bdg"))sel='button[data-bdg="'+a.getAttribute("data-bdg")+'"][data-part="'+a.getAttribute("data-part")+'"]';
  else if(a.getAttribute("data-pv"))sel='button[data-pv="'+a.getAttribute("data-pv")+'"]';
  else if(a.getAttribute("data-lay"))sel='button[data-lay="'+a.getAttribute("data-lay")+'"]';
  else if(a.getAttribute("data-cat"))sel='button[data-cat="'+a.getAttribute("data-cat")+'"]';
  else if(a.getAttribute("data-stat"))sel='button[data-stat="'+a.getAttribute("data-stat")+'"]';
  else if(a.getAttribute("data-filt"))sel='button[data-filt="'+a.getAttribute("data-filt")+'"]';
  else if(a.getAttribute("data-pick"))sel='button[data-pick="'+a.getAttribute("data-pick")+'"]';
  else if(a.hasAttribute&&a.hasAttribute("data-allcat"))sel='button[data-allcat]';
  if(!sel)return null;
  var list=document.querySelectorAll(sel);
  var i=Array.prototype.indexOf.call(list,a);
  return [sel,i<0?0:i,a.getAttribute("data-pick")||""];
}
function restoreFocus(t){
  if(!t)return;
  var list=document.querySelectorAll(t[0]);
  var el=list[t[1]]||list[0];
  if(!el&&t[2])el=document.querySelector('input[data-m="'+t[2]+'"]');
  if(!el)return;
  try{el.focus({preventScroll:true});}catch(e){try{el.focus();}catch(e2){}}
}
function update(){
  var tok=focusToken();
  if(ui){ui.sync();ui.run();}
  else bareRender();
  restoreFocus(tok);
}

/* ---------- tools.petrov.re v2 runtime ----------
   This page compares industries and shows which measures conflict; it computes nothing.
   The record is a record of a COMPARISON: the industry, the optional comparison partner,
   the category filter and the measures ticked, and exactly what that produced. */
function dgcState(){
  return {v:1,a:state.a,b:state.b,f:state.f,sel:Object.keys(state.sel).filter(function(k){return !!state.sel[k];})};
}
function dgcRestore(st){
  if(!st||typeof st!=="object")return;
  if(st.a&&INDBY[st.a])state.a=st.a;
  state.b=(st.b&&INDBY[st.b])?st.b:"";
  state.f=(st.f&&CATS.indexOf(st.f)>=0)?st.f:"";
  state.sel={};
  (st.sel||[]).forEach(function(id){if(MSBY[id])state.sel[id]=true;});
  FLASH=[];
  update();
}
function dgcRecord(){
  var res=evaluate(selectedHere());
  var ids=apsOf(state.a),cov=ids.filter(covered),open=ids.filter(function(i){return !covered(i);});
  var out={
    attention_points_for_this_industry:ids.length,
    attention_points_answered:cov.length,
    attention_points_still_open:open.length,
    measures_selected:selectedHere().length,
    hard_conflicts:res.hard.length,
    warnings:res.warn.length,
    pairing_hints:res.hint.length
  };
  CATS.forEach(function(c){out["items_in_"+T(CKEY[c])]=catCount(c);});
  out.open_attention_points=open.map(function(i){return tx(APBY[i].t);}).join("; ");
  out.selected_measures=selectedHere().map(function(id){return tx(MSBY[id].t);}).join("; ");
  out.conflicting_pairs=res.hard.map(function(r){
    return tx(MSBY[r.a].t)+" <-> "+tx(MSBY[r.b].t);}).join("; ");
  if(state.b&&INDBY[state.b]){
    var A=apsOf(state.a),B=apsOf(state.b);
    out.only_in_A=A.filter(function(x){return B.indexOf(x)<0;}).map(function(i){return tx(APBY[i].t);}).join("; ");
    out.only_in_B=B.filter(function(x){return A.indexOf(x)<0;}).map(function(i){return tx(APBY[i].t);}).join("; ");
    out.shared_by_both=A.filter(function(x){return B.indexOf(x)>=0;}).length;
  }
  return {
    inputs:{
      industry:tx(INDBY[state.a].t),
      compared_with:(state.b&&INDBY[state.b])?tx(INDBY[state.b].t):T("o_none"),
      category_filter:state.f?T(CKEY[state.f]):T("f_reset"),
      measures_ticked:selectedHere().length
    },
    outputs:out,
    units:{},
    model:{equations:[
      "attention points(industry) = the points the industry record names, in the group order of the page",
      "measures(attention point, industry) = the measures answering that point, minus the ones the " +
        "measure record excludes for this industry",
      "hard conflict = both measures of a rule of kind 'hard' are ticked",
      "warning = both measures of a rule of kind 'warn' are ticked",
      "pairing hint = the first measure of a rule of kind 'pair' is ticked and the second is not",
      "answered = at least one measure of the attention point is ticked"],
      ranges:["lim1","lim2","lim3","lim4","lim5","lim6"].map(function(k){return T(k);}),
      notes:[T("genre_t")]},
    warnings:(function(){
      var w=[];
      if(res.hard.length)w.push(T("h_conf")+": "+res.hard.length);
      if(res.warn.length)w.push(T("h_warn")+": "+res.warn.length);
      if(open.length)w.push(T("h_unc")+": "+open.length);
      w.push(T("genre_t"));
      return w;})()
  };
}
function dgcInit(){
  if(!window.Diagram)return;
  try{
    window.Diagram.init({
      id:"procesklimaat",file:"procesklimaat.html",
      state:{serialize:dgcState,deserialize:dgcRestore},
      record:dgcRecord,
      /* nothing to export as a script: the result is a selection out of a shipped catalogue */
      handoff:{provides:[],accepts:[]}
    });
  }catch(e){}
}

/* ---------- the explanation behind every badge ----------
   One dialog, the framework's, with the legend inside it: click, Enter or Space
   open it, Escape closes it and the focus goes back to the badge that opened it. */
var openDlg=null,mdlPrev=null,mdlSwap=false;
function closeMdl(){if(openDlg){var d=openDlg;openDlg=null;try{d.close();}catch(e){}}}
function showMdl(title,inner,src){
  var body=inner+mdlLegend();
  if(!ui){window.alert(title+"\n\n"+body.replace(/<[^>]*>/g," ").replace(/\s+/g," "));return;}
  /* a badge inside the dialog opens the next explanation in place; the focus
     still returns to the badge on the page that opened the first one */
  var prev=openDlg?mdlPrev:(src||null);
  mdlSwap=true;closeMdl();mdlSwap=false;
  mdlPrev=prev;
  openDlg=ui.dialog({
    title:title,
    body:function(box){box.innerHTML=body;},
    actions:[{label:T("mdl_close"),variant:"ghost"}],
    onClose:function(){
      openDlg=null;
      if(mdlSwap)return;
      var f=mdlPrev;mdlPrev=null;
      if(f&&document.contains(f)&&f.focus){try{f.focus();}catch(e){}}
    }
  });
  /* clicking the backdrop dismissed the tool's own dialog; <dialog> does not do
     it by itself, and losing it would be a capability the reader had */
  if(openDlg&&openDlg.node)openDlg.node.addEventListener("click",function(e){
    if(openDlg&&e.target===openDlg.node)openDlg.close();
  });
}

/* precedence: ?lang= -> localStorage.diagram_lang -> browser -> en. The bootstrap in
   the document head has already resolved exactly that order into window.__diagramLang;
   reading the stored value first would let it win over an explicit ?lang= in the address.
   diagram-ui.js resolves the same order for its own header control. */
function initLang(){
  var l=null;
  try{l=window.__diagramLang||null;}catch(e){}
  if(!l){try{l=new URLSearchParams(location.search).get("lang");}catch(e){}}
  if(!l){try{l=localStorage.getItem("diagram_lang");}catch(e){}}
  if(!l){try{l=(navigator.language||"en").slice(0,2).toLowerCase();}catch(e){}}
  l=(l||"").slice(0,2).toLowerCase();
  LANG=(l&&UI.ttl[l])?l:DEFAULT_LANG;
}

/* The examples row and the reset row are added imperatively, and
   DiagramUI.app() rebuilds itself from opts on a language change: anything added
   after app() is gone with the old instance. They are therefore (re)built from
   on.ready, which the framework calls for the rebuilt instance as well. This
   belongs upstream — ui-demo.html adds both the same way and loses them too. */
function buildLooseRows(app){
  var exP=app.examples([
    {label:UI.b_preset,note:quickNote(0),apply:function(){
      state.sel={};
      presetFor(state.a).forEach(function(id){state.sel[id]=true;});
      state.f="";FLASH=[["ok","fl_preset"]];showResult();
    }},
    {label:UI.b_demo,note:quickNote(1),apply:function(){
      var r=demoFor(state.a);if(!r)return;
      state.sel={};state.sel[r.a]=true;state.sel[r.b]=true;state.f="";
      FLASH=[["bad","fl_demo",r.a,r.b]];showResult();
    }}
  ]);
  /* the conflict demonstration is offered only where this industry has one */
  if(exP){
    exP.def.sync=function(box){var b=box.children[1];if(b)b.hidden=!demoFor(state.a);};
    exP.def.sync(exP.body);
  }
  /* reset lives in the inputs footer, per the placement law */
  app.panel({slot:"inputs",id:"pk-reset",
    render:function(box){
      var row=el("div","dgu-panel-actions");
      row.appendChild(app.actionButton(app.resetAction()));
      box.appendChild(row);
    }});
}

var ui=null;
/* Loading a set answers in the result panel, and the panel is a column of its
   own on a wide screen but below the list on a narrow one: the page brought it
   into view before the port and still does. */
function showResult(){
  setTimeout(function(){
    var r=ui?ui.regions.results:document.getElementById("tiles");
    if(r&&r.scrollIntoView){try{r.scrollIntoView({block:"nearest"});}catch(e){}}
  },0);
}
/* The reset of this page is the reset the page always had: it clears the ticks.
   The industry, the comparison partner and the category filter are what the user
   is looking at, not values to be thrown away — the button this replaces was
   called "Clear all ticks" and did exactly this. */
function DEFAULTS(){return {a:state.a,b:state.b,f:state.f,sel:{}};}

function el(tag,cls,html){
  var n=document.createElement(tag);
  if(cls)n.className=cls;
  if(html!=null)n.innerHTML=html;
  return n;
}
function genreNode(){
  var d=el("div","genre");
  d.setAttribute("role","note");
  d.innerHTML='<span class="gi" aria-hidden="true">&#9888;</span>'+
    '<span><b id="genre_h"></b><span class="gtxt" id="genre_t"></span></span>';
  d.querySelector("#genre_h").textContent=T("genre_h");
  d.querySelector("#genre_t").textContent=T("genre_t");
  return d;
}
/* The page checks its own tables on load. The verdict list stays in the
   document, machine-readable and out of the reader's way, exactly as before;
   only a failure speaks up, and it speaks up at the top of the column. */
function warnNode(){
  var bad=CHECKS.filter(function(c){return !c[1];}).length;
  var w=el("div","valwarn");
  w.id="val-warn";w.hidden=(bad===0);w.textContent=bad?T("val_warn"):"";
  return w;
}
function checkListNode(){
  var o=el("div");o.id="val-out";o.hidden=true;
  o.innerHTML=CHECKS.map(function(c){
    return '<div class="flag '+(c[1]?"ok":"bad")+'"><span>'+esc(T(c[0]))+'</span></div>';}).join("");
  return o;
}
/* The note under the two quick buttons is one sentence per button in every
   language; each button carries its own. */
function quickNote(i){
  var o={};
  LANGS.forEach(function(l){
    var s=(UI.n_quick&&UI.n_quick[l])||"",k=s.indexOf(". ");
    o[l]=k<0?s:(i===0?s.slice(0,k+1):s.slice(k+2));
  });
  return o;
}

/* ---------- the page without diagram-ui.js ----------
   The shared UI file is a third script, and a third script can fail to load.
   When it does, the page still has to answer the question it exists for, so it
   builds a plain shell over the same element ids and the same renderers. */
function bareRender(){
  var res=evaluate(selectedHere());
  var g=function(i){return document.getElementById(i);};
  if(g("legend"))g("legend").innerHTML=legendHTML();
  if(g("filtrow"))g("filtrow").innerHTML=filtRowHTML();
  if(g("filtbar")){var h=filtBarHTML();g("filtbar").innerHTML=h;g("filtbar").hidden=!h;}
  if(g("ap-out"))g("ap-out").innerHTML=apHTML();
  if(g("tiles"))g("tiles").innerHTML=tilesData(res).map(function(t){
    return '<div class="tile '+(t.tone||"")+'"><div class="tv tabnum">'+esc(t.value)+'</div><div class="tl">'+esc(t.label)+'</div></div>';}).join("");
  if(g("flash"))g("flash").innerHTML=flashHTML();
  if(g("cf-out"))g("cf-out").innerHTML=flagsHTML(res);
  if(g("unc-out"))g("unc-out").innerHTML=openHTML();
  var c=g("cmp-out");
  if(c){var ch=compareHTML();c.innerHTML=ch;if(g("cmp-card"))g("cmp-card").hidden=!ch;}
  if(g("sector"))g("sector").value=state.a;
  if(g("sectorB"))g("sectorB").value=state.b;
  var d=g("b_demo");if(d)d.hidden=!demoFor(state.a);
}
