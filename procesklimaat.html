<script type="application/json" id="diagram-tool-manifest">{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision":"2026-08-11.2","id":"procesklimaat","file":"procesklimaat.html","listed":true,"category":"hvac","order":36,"title":{"en":"Process Climate Advisor","uk":"Порадник із технологічного мікроклімату","de":"Prozessklima-Berater","nl":"Procesklimaat-adviseur","fr":"Conseiller climat de procédé","es":"Asesor de clima de proceso","pl":"Doradca ds. klimatu procesowego"},"summary":{"en":"An industry-by-industry comparator for process climate and ventilation.","uk":"Порівняльник технологічного мікроклімату та вентиляції за галузями.","de":"Ein branchenweiser Vergleicher für Prozessklima und Lüftung.","nl":"Een vergelijker per branche voor procesklimaat en ventilatie.","fr":"Un comparateur secteur par secteur pour le climat de procédé et la ventilation.","es":"Un comparador sector por sector para el clima de proceso y la ventilación.","pl":"Porównywarka branżowa do kwestii klimatu i wentylacji procesowej."},"description":{"en":"An industry-by-industry comparator for process climate and ventilation. Pick one of 24 industries — from wet food production and dry rooms to foundries, nuclear facilities and closed life-support volumes — read the attention points it brings, grouped into ten mandatory families, and tick the countermeasures you intend to use; a permanently visible result panel answers every tick at once with coverage, conflicts, warnings and the measure usually needed alongside. One button loads a typical set for the chosen industry that none of those rules objects to, another deliberately ticks two incompatible measures and states why they cannot coexist, and every attention point still open stays an active list from which measures can be ticked directly. Seventy-five rules separate combinations that are physically or legally impossible from those that merely need justification. Every attention point and measure carries two badges that work as buttons under click, Enter and Space: they open an explanation of what the category and the status mean, with a clickable legend, and Escape returns the focus to the badge; a separate filter button narrows the list to one category, so a legal obligation never looks like sector practice. It is a first-level advisor for structuring questions, not a design guide. Each attention point and each measure carries a collapsed key-conditions panel: what the measure is driven by, which parameter it constrains, which figures are used for orientation and under which assumptions those figures were obtained, every one of them traced to its own source file and line, a reference the page carries in its markup instead of printing the source material's own item numbering; where the number belongs to a purchasable standard the panel shows the shape of the requirement instead — what is regulated, what it depends on, what to settle first and what to expect — and no figure at all, in any language. Three source layers are kept apart in that panel and named on it: openly published law, the worked reference material of this collection, and purchasable standards — the traced figures come from the middle layer, the first adds the reminder that the edition in force is verified with the issuing body, and the third carries none.","uk":"Порівняльник технологічного мікроклімату та вентиляції за галузями. Оберіть одну з 24 галузей — від вологої харчової переробки й сухих кімнат до ливарень, ядерних об'єктів і замкнутих систем життєзабезпечення, — перегляньте пункти уваги, згруповані в десять обов'язкових родин, і позначте заходи парирування; постійно видима панель результату відповідає на кожну позначку одразу: покриття, конфлікти, попередження та захід, потрібний у пару. Одна кнопка завантажує типовий набір для обраної галузі, проти якого не заперечує жодне з цих правил, друга навмисно позначає два несумісні заходи й пояснює, чому вони не можуть співіснувати, а кожен ще відкритий пункт уваги лишається активним списком, з якого заходи позначаються напряму. Сімдесят п'ять правил відокремлюють фізично чи юридично неможливі поєднання від тих, що лише потребують обґрунтування. Кожен пункт і захід має два бейджі, що працюють як кнопки за кліком, Enter і пробілом: вони відкривають пояснення того, що означають категорія та статус, із клікабельною легендою, а Escape повертає фокус на бейдж; окрема кнопка фільтра звужує список до однієї категорії, тож юридичний обов'язок ніколи не виглядає як галузева практика. Це порадник першого рівня для структурування питань, а не посібник з проєктування. Кожен пункт уваги і кожен захід має згорнуту панель ключових умов: чим захід зумовлений, який параметр обмежується, якими величинами орієнтуються і за яких припущень ці величини одержано, кожну з них простежено до власного файла-джерела і рядка, і це посилання сторінка тримає в розмітці, а не друкує власну нумерацію елементів вихідного матеріалу; там, де число належить платному стандарту, панель натомість показує форму вимоги — що регулюється, від чого залежить, що визначити спершу і чого чекати — і жодного числа в жодній мові. У цій панелі три шари джерела розділені й названі: відкрито оприлюднене право, опрацьований довідковий матеріал добірки та платні стандарти — простежені величини походять із середнього шару, перший додає нагадування, що чинну редакцію перевіряють у видавця документа, а третій не несе жодної.","de":"Ein branchenweiser Vergleicher für Prozessklima und Lüftung. Wählen Sie eine von 24 Branchen — von nasser Lebensmittelproduktion und Trockenräumen bis zu Gießereien, kerntechnischen Anlagen und geschlossenen Lebenserhaltungsvolumen —, lesen Sie die zugehörigen Aufmerksamkeitspunkte in zehn Pflichtgruppen und haken Sie die vorgesehenen Gegenmaßnahmen an; eine dauerhaft sichtbare Ergebnisansicht beantwortet jeden Haken sofort mit Abdeckung, Konflikten, Warnungen und der üblicherweise ergänzenden Maßnahme. Eine Schaltfläche lädt einen typischen Satz für die gewählte Branche, dem keine dieser Regeln widerspricht, eine zweite hakt absichtlich zwei unverträgliche Maßnahmen an und nennt den Grund, und jeder noch offene Aufmerksamkeitspunkt bleibt eine aktive Liste, aus der Maßnahmen direkt angehakt werden. Fünfundsiebzig Regeln trennen physikalisch oder rechtlich unmögliche Kombinationen von solchen, die nur begründet werden müssen. Jeder Punkt und jede Maßnahme trägt zwei Abzeichen, die als Schaltflächen auf Klick, Enter und Leertaste reagieren: sie öffnen eine Erklärung der Bedeutung von Kategorie und Status samt anklickbarer Legende, und Escape gibt den Fokus an das Abzeichen zurück; eine eigene Filterschaltfläche schränkt die Liste auf eine Kategorie ein, damit eine Rechtspflicht nie wie Branchenpraxis aussieht. Es ist ein Berater der ersten Ebene zum Strukturieren von Fragen, kein Planungsleitfaden. Jeder Aufmerksamkeitspunkt und jede Maßnahme trägt ein eingeklapptes Feld der wesentlichen Bedingungen: wodurch die Maßnahme bedingt ist, welcher Parameter begrenzt wird, an welchen Größen man sich orientiert und unter welchen Annahmen diese Größen gewonnen wurden, jede davon auf ihre eigene Quelldatei und Zeile zurückgeführt, ein Nachweis, den die Seite im Quelltext führt, statt die eigene Elementnummerierung des Quellmaterials abzudrucken; wo die Zahl zu einer kostenpflichtigen Norm gehört, zeigt das Feld stattdessen die Form der Anforderung — was geregelt wird, wovon es abhängt, was zuerst festzulegen ist und was zu erwarten ist — und in keiner Sprache eine Zahl. Drei Quellenschichten werden in diesem Feld getrennt und benannt: offen veröffentlichtes Recht, das ausgearbeitete Referenzmaterial dieser Sammlung und kostenpflichtige Normen — die zurückgeführten Größen stammen aus der mittleren Schicht, die erste ergänzt den Hinweis, dass die geltende Fassung bei der herausgebenden Stelle geprüft wird, und die dritte trägt keine.","nl":"Een vergelijker per branche voor procesklimaat en ventilatie. Kies een van 24 branches — van natte voedingsproductie en dryrooms tot gieterijen, nucleaire installaties en gesloten leefsystemen —, lees de bijbehorende aandachtspunten in tien verplichte families en vink de beoogde maatregelen aan; een blijvend zichtbaar resultaatpaneel antwoordt op elk vinkje meteen met dekking, conflicten, waarschuwingen en de maatregel die er meestal bij hoort. Eén knop laadt een typische set voor de gekozen branche waartegen geen van die regels bezwaar maakt, een tweede vinkt opzettelijk twee onverenigbare maatregelen aan en geeft de reden, en elk nog open aandachtspunt blijft een actieve lijst waaruit maatregelen rechtstreeks worden aangevinkt. Vijfenzeventig regels scheiden fysisch of juridisch onmogelijke combinaties van combinaties die alleen onderbouwing vragen. Elk aandachtspunt en elke maatregel draagt twee badges die als knop werken bij klik, Enter en spatie: zij openen een uitleg van wat de categorie en de status betekenen, met een aanklikbare legenda, en Escape brengt de focus terug naar de badge; een aparte filterknop beperkt de lijst tot één categorie, zodat een wettelijke plicht er nooit uitziet als branchepraktijk. Het is een adviseur van het eerste niveau om vragen te structureren, geen ontwerphandleiding. Elk aandachtspunt en elke maatregel draagt een ingeklapt paneel met kernvoorwaarden: waardoor de maatregel wordt bepaald, welke parameter wordt begrensd, aan welke grootheden men zich oriënteert en onder welke aannamen die grootheden zijn verkregen, elk daarvan herleid tot een eigen bronbestand en regel, een verwijzing die de pagina in haar opmaak meedraagt in plaats van de eigen elementnummering van het bronmateriaal af te drukken; waar het getal bij een betaalde norm hoort, toont het paneel in plaats daarvan de vorm van de eis — wat wordt geregeld, waarvan het afhangt, wat eerst moet worden vastgelegd en wat te verwachten is — en in geen enkele taal een getal. Drie bronlagen worden in dat paneel gescheiden en benoemd: openbaar gepubliceerd recht, het uitgewerkte referentiemateriaal van deze verzameling en betaalde normen — de herleide grootheden komen uit de middelste laag, de eerste voegt de herinnering toe dat de vigerende uitgave bij de uitgevende instantie wordt getoetst, en de derde draagt er geen.","fr":"Un comparateur secteur par secteur pour le climat de procédé et la ventilation. Choisissez l'un des 24 secteurs — de la production alimentaire humide et des salles sèches aux fonderies, aux installations nucléaires et aux volumes de support-vie fermés —, lisez les points d'attention associés, répartis en dix familles obligatoires, et cochez les mesures envisagées ; un panneau de résultat en permanence visible répond à chaque coche aussitôt : couverture, conflits, avertissements et mesure habituellement associée. Un bouton charge un jeu type pour le secteur choisi auquel aucune de ces règles ne s'oppose, un autre coche volontairement deux mesures incompatibles et en donne la raison, et chaque point d'attention encore ouvert reste une liste active depuis laquelle les mesures se cochent directement. Soixante-quinze règles séparent les combinaisons physiquement ou juridiquement impossibles de celles qui exigent seulement une justification. Chaque point et chaque mesure porte deux badges qui fonctionnent comme des boutons au clic, à Entrée et à Espace : ils ouvrent une explication de ce que signifient la catégorie et le statut, avec une légende cliquable, et Échap rend le focus au badge ; un bouton de filtre distinct restreint la liste à une seule catégorie, afin qu'une obligation légale ne ressemble jamais à une pratique sectorielle. C'est un conseiller de premier niveau pour structurer les questions, pas un guide de conception. Chaque point d'attention et chaque mesure porte un volet replié de conditions essentielles : ce qui conditionne la mesure, le paramètre borné, les grandeurs qui servent de repère et les hypothèses dans lesquelles elles ont été obtenues, chacune tracée jusqu'à son propre fichier source et à sa ligne, une référence que la page porte dans son balisage au lieu d'imprimer la numérotation propre des éléments du matériau source ; lorsque le nombre appartient à une norme payante, le volet montre à la place la forme de l'exigence — ce qui est réglementé, ce dont cela dépend, ce qu'il faut trancher d'abord et ce qu'il faut en attendre — et aucun chiffre, dans aucune langue. Trois couches de source y sont séparées et nommées : le droit publié ouvertement, le matériau de référence élaboré de cette collection et les normes payantes — les grandeurs tracées viennent de la couche médiane, la première ajoute le rappel que l'édition en vigueur se vérifie auprès de l'organisme émetteur, et la troisième n'en porte aucune.","es":"Un comparador sector por sector para el clima de proceso y la ventilación. Elija uno de los 24 sectores — desde la producción alimentaria húmeda y las salas secas hasta fundiciones, instalaciones nucleares y volúmenes cerrados de soporte vital —, lea sus puntos de atención agrupados en diez familias obligatorias y marque las medidas previstas; un panel de resultado siempre visible responde a cada marca al instante con cobertura, conflictos, avisos y la medida que suele acompañar. Un botón carga un conjunto típico para el sector elegido al que ninguna de esas reglas objeta, otro marca a propósito dos medidas incompatibles e indica por qué no pueden coexistir, y cada punto de atención aún abierto sigue siendo una lista activa desde la que se marcan medidas directamente. Setenta y cinco reglas separan las combinaciones física o jurídicamente imposibles de las que solo exigen justificación. Cada punto y cada medida lleva dos insignias que funcionan como botones al pulsarlas y con Intro y Espacio: abren una explicación de lo que significan la categoría y el estado, con una leyenda pulsable, y Escape devuelve el foco a la insignia; un botón de filtro aparte reduce la lista a una sola categoría, de modo que una obligación legal nunca parezca práctica sectorial. Es un asesor de primer nivel para estructurar preguntas, no una guía de diseño. Cada punto de atención y cada medida lleva un panel plegado de condiciones clave: qué condiciona la medida, qué parámetro se acota, qué magnitudes sirven de orientación y bajo qué hipótesis se obtuvieron, cada una trazada hasta su propio archivo fuente y su línea, una referencia que la página lleva en su marcado en vez de imprimir la numeración propia de los elementos del material fuente; cuando la cifra pertenece a una norma de pago, el panel muestra en su lugar la forma del requisito — qué se regula, de qué depende, qué determinar primero y qué esperar — y ninguna cifra, en ningún idioma. En ese panel se separan y se nombran tres capas de origen: el derecho publicado abiertamente, el material de referencia elaborado de esta colección y las normas de pago — las magnitudes trazadas provienen de la capa intermedia, la primera añade el recordatorio de que la edición vigente se comprueba con el organismo emisor, y la tercera no lleva ninguna.","pl":"Porównywarka branżowa dla klimatu i wentylacji procesowej. Wybierz jedną z 24 branż — od produkcji mokrej żywności i suchych pomieszczeń, po odlewnie, obiekty jądrowe i zamknięte systemy podtrzymywania życia — przeczytaj wyświetlane przez nią punkty uwagi, pogrupowane w dziesięć obowiązkowych rodzin, i zaznacz środki zaradcze, które zamierzasz zastosować; stale widoczny panel wyników odpowiada na każde zaznaczenie jednocześnie, podając zakres, konflikty, ostrzeżenia i zazwyczaj potrzebną miarę. Jeden przycisk ładuje typowy zestaw dla wybranej branży, któremu żadna z tych reguł nie sprzeciwia się, inny celowo zaznacza dwie niekompatybilne miary i wyjaśnia, dlaczego nie mogą one współistnieć, a każdy otwarty punkt uwagi pozostaje aktywną listą, z której można bezpośrednio zaznaczyć środki. Siedemdziesiąt pięć reguł oddziela kombinacje fizycznie lub prawnie niemożliwe od tych, które wymagają jedynie uzasadnienia. Każdy punkt uwagi i miara mają dwie plakietki, które działają jak przyciski po kliknięciu, Enter i Spacja: otwierają one wyjaśnienie znaczenia kategorii i statusu, z klikalną legendą, a Escape przywraca fokus do plakietki; Osobny przycisk filtra zawęża listę do jednej kategorii, dzięki czemu zobowiązanie prawne nigdy nie wygląda jak praktyka sektorowa. Jest to doradca pierwszego poziomu do strukturyzowania pytań, a nie przewodnik projektowy. Każdy punkt uwagi i każda miara zawiera zwinięty panel warunków kluczowych: czym jest napędzana miara, jaki parametr ogranicza, które rysunki służą do orientacji i przy jakich założeniach zostały uzyskane, każdy z nich jest odniesiony do własnego pliku źródłowego i wiersza, odniesienia, które strona zawiera w swoich znacznikach zamiast drukowania własnej numeracji pozycji materiału źródłowego; jeśli numer należy do standardu do kupienia, panel pokazuje zamiast tego kształt wymogu — co jest regulowane, od czego zależy, co należy najpierw ustalić i czego się spodziewać — i nie zawiera żadnego rysunku, w żadnym języku. W tym panelu są oddzielone trzy warstwy źródłowe i na nim wymienione: jawnie opublikowane prawo, opracowany materiał referencyjny tej kolekcji i standardy do kupienia — odszukane rysunki pochodzą ze środkowej warstwy, pierwsza dodaje przypomnienie, że obowiązujące wydanie jest zweryfikowane przez organ wydający, a trzecia nie zawiera żadnego."},"status":"benchmarked","independent_validation":false,"limitations":{"en":"First-level advisor only: it structures the questions and never produces flow rates, pressures, equipment selection or a compliance verdict. The catalogue of industries, attention points, countermeasures and conflict rules is not exhaustive, and the pairwise conflict statements simplify incompatibilities that in reality involve layout, timing and three or more measures at once. Applicability of every item must be verified against the project design basis, the substances actually handled and with the competent authority. The key-conditions panels quote figures from worked examples together with the assumptions under which those figures were obtained and a traceability reference to the named source file, kept in the markup of the page rather than printed, because the source material's own item numbering is not published here: they are neither requirements of a document nor an assertion that they apply to your project, and for purchasable standards only the shape of the requirement is shown, without any figure.","uk":"Лише порадник першого рівня: він структурує питання і ніколи не видає витрат повітря, тисків, підбору обладнання чи висновку про відповідність. Каталог галузей, пунктів уваги, заходів парирування та правил конфлікту не є вичерпним, а парні формулювання конфліктів спрощують несумісності, які насправді охоплюють компонування, час і три та більше заходів одночасно. Застосовність кожного пункту слід перевіряти за проєктною основою, фактично використовуваними речовинами та з компетентним органом. Панелі ключових умов наводять величини з розрахункових прикладів разом із припущеннями, за яких їх одержано, і посиланням простежуваності на названий файл-джерело, яке міститься в розмітці сторінки, а не надруковане, бо власна нумерація елементів вихідного матеріалу тут не публікується: це ні вимоги документа, ні твердження про застосовність до вашого проєкту, а для платних стандартів показано лише форму вимоги, без жодного числа.","de":"Nur ein Berater der ersten Ebene: er strukturiert die Fragen und liefert niemals Volumenströme, Drücke, Gerätewahl oder ein Konformitätsurteil. Der Katalog der Branchen, Aufmerksamkeitspunkte, Gegenmaßnahmen und Konfliktregeln ist nicht abschließend, und die paarweisen Konfliktaussagen vereinfachen Unverträglichkeiten, die in Wirklichkeit Anordnung, Zeitverlauf und drei oder mehr Maßnahmen zugleich betreffen. Die Anwendbarkeit jedes Eintrags ist gegen die Auslegungsgrundlage, die tatsächlich gehandhabten Stoffe und mit der zuständigen Behörde zu prüfen. Die Felder der wesentlichen Bedingungen zitieren Größen aus Rechenbeispielen samt den Annahmen ihrer Gewinnung und einem Nachweis auf die benannte Quelldatei, der im Quelltext der Seite steht und nicht abgedruckt wird, weil die eigene Elementnummerierung des Quellmaterials hier nicht veröffentlicht wird: sie sind weder Anforderungen eines Dokuments noch eine Behauptung, dass sie auf Ihr Projekt zutreffen, und für kostenpflichtige Normen wird nur die Form der Anforderung ohne jede Zahl gezeigt.","nl":"Uitsluitend een adviseur van het eerste niveau: het structureert de vragen en levert nooit debieten, drukken, apparatuurkeuze of een conformiteitsoordeel. De catalogus van branches, aandachtspunten, maatregelen en conflictregels is niet uitputtend, en de paarsgewijze conflictuitspraken vereenvoudigen onverenigbaarheden die in werkelijkheid opstelling, tijd en drie of meer maatregelen tegelijk betreffen. De toepasbaarheid van elk item moet worden getoetst aan de ontwerpbasis, de werkelijk gehanteerde stoffen en met het bevoegd gezag. De panelen met kernvoorwaarden citeren grootheden uit rekenvoorbeelden samen met de aannamen waaronder ze zijn verkregen en een herleidingsverwijzing naar het genoemde bronbestand, die in de opmaak van de pagina staat en niet wordt afgedrukt, omdat de eigen elementnummering van het bronmateriaal hier niet wordt gepubliceerd: het zijn geen eisen van een document en geen bewering dat ze op uw project van toepassing zijn, en voor betaalde normen wordt alleen de vorm van de eis getoond, zonder enig getal.","fr":"Conseiller de premier niveau uniquement : il structure les questions et ne produit jamais de débits, de pressions, de choix d'équipement ni de verdict de conformité. Le catalogue des secteurs, points d'attention, mesures et règles de conflit n'est pas exhaustif, et les énoncés de conflit par paires simplifient des incompatibilités qui, en réalité, mettent en jeu l'implantation, le temps et trois mesures ou plus à la fois. L'applicabilité de chaque élément doit être vérifiée au regard de la base de conception, des substances réellement manipulées et avec l'autorité compétente. Les volets de conditions essentielles citent des grandeurs issues d'exemples de calcul avec les hypothèses de leur obtention et une référence de traçabilité vers le fichier source nommé, portée par le balisage de la page plutôt qu'imprimée, car la numérotation propre des éléments du matériau source n'est pas publiée ici : ce ne sont ni des exigences d'un document ni une affirmation qu'elles s'appliquent à votre projet, et pour les normes payantes seule la forme de l'exigence est montrée, sans aucun chiffre.","es":"Solo un asesor de primer nivel: estructura las preguntas y nunca produce caudales, presiones, selección de equipos ni veredicto de conformidad. El catálogo de sectores, puntos de atención, medidas y reglas de conflicto no es exhaustivo, y los enunciados de conflicto por pares simplifican incompatibilidades que en realidad implican la implantación, el tiempo y tres o más medidas a la vez. La aplicabilidad de cada elemento debe verificarse frente a la base de diseño, las sustancias realmente manipuladas y con la autoridad competente. Los paneles de condiciones clave citan magnitudes de ejemplos de cálculo junto con las hipótesis en que se obtuvieron y una referencia de trazabilidad al archivo fuente nombrado, que figura en el marcado de la página y no se imprime, porque la numeración propia de los elementos del material fuente no se publica aquí: no son requisitos de ningún documento ni una afirmación de que se apliquen a su proyecto, y para las normas de pago solo se muestra la forma del requisito, sin cifra alguna.","pl":"Tylko doradca pierwszego stopnia: strukturyzuje pytania i nigdy nie generuje przepływów, ciśnień, doboru sprzętu ani werdyktu zgodności. Katalog branż, punktów uwagi, środków zaradczych i reguł kolizyjnych nie jest wyczerpujący, a parami sformułowane oświadczenia o konfliktach upraszczają niezgodności, które w rzeczywistości obejmują układ, harmonogram i trzy lub więcej środków jednocześnie. Stosowalność każdego elementu musi zostać zweryfikowana w odniesieniu do podstawy projektu, faktycznie obsługiwanych substancji oraz właściwego organu. Panele warunków kluczowych cytują dane z opracowanych przykładów wraz z założeniami, na podstawie których te dane zostały uzyskane, oraz odnośnikiem do wskazanego pliku źródłowego, który jest przechowywany w znacznikach strony, a nie drukowany, ponieważ numeracja elementów materiału źródłowego nie jest tutaj publikowana: nie są one ani wymaganiami dokumentu, ani stwierdzeniem, że mają zastosowanie do projektu, a w przypadku norm dostępnych do zakupu pokazany jest jedynie kształt wymagania, bez żadnego rysunku."},"intended_use":["education","technical exploration","preliminary assessment"],"catalog_languages":["en","uk","de","nl","fr","es","pl"],"tool_languages":["en","uk","de","nl","fr","es","pl"],"dependencies":[],"network_access":{"mode":"none"},"validation":{"basis":{"en":"10 of 10 benchmark cases pass. This is a DATA-INTEGRITY benchmark, not a physics one: the page computes nothing, so what is verified is the catalogue and the comparison over it. An independent python re-implementation of the record schema, the referential closure, the per-industry selection, the category filter and the conflict engine — written from the documented meaning of the tables, not from the page's own code — is compared with what the page renders in the DOM: 24 industries, 48 filter paths, 174 reachable conflict paths including every rule and the all-selected case, 26 comparator pairs, and the starting set offered for every industry, which must raise no conflict at all. Every key figure's trace is checked against the shipped source-file index, including that the cited line lies inside the file. The page's own structural-check panel counts for nothing here. The harness is the author's own; no external party has reviewed it.","uk":"10 з 10 випадків пройдено. Це перевірка ЦІЛІСНОСТІ ДАНИХ, а не фізики: сторінка нічого не обчислює, тому перевіряється каталог і порівняння за ним. Незалежна реалізація мовою python схеми записів, замкненості посилань, вибору за галуззю, фільтра категорій та механізму конфліктів — написана з документованого змісту таблиць, а не з коду сторінки — порівнюється з тим, що сторінка відображає в DOM: 24 галузі, 48 шляхів фільтрації, 174 досяжні шляхи конфліктів, 26 пар порівняння та стартовий набір для кожної галузі, який не має спричиняти жодного конфлікту. Кожне посилання на джерело звіряється з індексом файлів, зокрема що вказаний рядок є в межах файлу. Власна панель перевірок сторінки не зараховується. Стенд авторський; сторонньої перевірки не було.","de":"10 von 10 Prüffällen bestanden. Dies ist eine DATENINTEGRITÄTS-Prüfung, keine physikalische: die Seite rechnet nichts, geprüft werden der Katalog und der Vergleich darüber. Eine unabhängige Python-Nachbildung des Datensatzschemas, der referenziellen Geschlossenheit, der Auswahl je Branche, des Kategorienfilters und der Konfliktlogik — aus der dokumentierten Bedeutung der Tabellen geschrieben, nicht aus dem Code der Seite — wird mit der Darstellung im DOM verglichen: 24 Branchen, 48 Filterpfade, 174 erreichbare Konfliktpfade einschließlich des Falls „alles gewählt“, 26 Vergleichspaare und der Startsatz jeder Branche, der keinerlei Konflikt auslösen darf. Jede Quellenangabe wird gegen den Dateiindex geprüft, auch dass die zitierte Zeile in der Datei liegt. Die eigene Prüftafel der Seite zählt hier nicht. Der Prüfstand stammt vom Autor; eine Prüfung durch Dritte gab es nicht.","nl":"10 van 10 toetsgevallen geslaagd. Dit is een toets op GEGEVENSINTEGRITEIT, geen fysische toets: de pagina rekent niets, getoetst worden de catalogus en de vergelijking erover. Een onafhankelijke python-herimplementatie van het recordschema, de verwijzingssluiting, de selectie per branche, het categoriefilter en de conflictlogica — geschreven vanuit de gedocumenteerde betekenis van de tabellen en niet vanuit de code van de pagina — wordt vergeleken met wat de pagina in de DOM toont: 24 branches, 48 filterpaden, 174 bereikbare conflictpaden inclusief het geval waarin alles is gekozen, 26 vergelijkingsparen en de startset van elke branche, die geen enkel conflict mag oproepen. Elke bronverwijzing wordt getoetst aan de bestandsindex, inclusief dat het aangehaalde regelnummer binnen het bestand valt. Het eigen controlepaneel van de pagina telt niet mee. De testbank is van de auteur; er was geen beoordeling door derden.","fr":"10 cas de référence sur 10 réussis. Il s'agit d'un contrôle d'INTÉGRITÉ DES DONNÉES et non de physique : la page ne calcule rien, ce qui est vérifié c'est le catalogue et la comparaison qui s'y appuie. Une réimplémentation python indépendante du schéma des enregistrements, de la fermeture référentielle, de la sélection par branche, du filtre par catégorie et du moteur de conflits — écrite à partir du sens documenté des tables et non du code de la page — est comparée au rendu réel dans le DOM : 24 branches, 48 chemins de filtrage, 174 chemins de conflit atteignables y compris le cas « tout sélectionné », 26 paires de comparaison, et le jeu de départ proposé pour chaque branche, qui ne doit soulever aucun conflit. Chaque renvoi de source est vérifié contre l'index des fichiers, y compris que la ligne citée se trouve bien dans le fichier. Le panneau de contrôle propre à la page ne compte pas ici. Le banc d'essai est celui de l'auteur ; aucun tiers ne l'a examiné.","es":"10 de 10 casos superados. Es una comprobación de INTEGRIDAD DE DATOS, no de física: la página no calcula nada, se verifica el catálogo y la comparación sobre él. Una reimplementación independiente en python del esquema de registros, del cierre referencial, de la selección por sector, del filtro por categoría y del motor de conflictos — escrita a partir del significado documentado de las tablas y no del código de la página — se compara con lo que la página representa en el DOM: 24 sectores, 48 rutas de filtrado, 174 rutas de conflicto alcanzables incluido el caso de todo seleccionado, 26 pares de comparación y el conjunto inicial ofrecido para cada sector, que no debe provocar ningún conflicto. Cada referencia de fuente se contrasta con el índice de archivos, incluido que la línea citada esté dentro del archivo. El panel de comprobaciones propio de la página no cuenta aquí. El banco de pruebas es del autor; ningún tercero lo ha revisado.","pl":"10 z 10 przypadków testowych przechodzi. Jest to test integralności danych, a nie fizyki: strona niczego nie oblicza, więc weryfikowany jest katalog i porównanie z nim. Niezależna reimplementacja schematu rekordów, domknięcia referencyjnego, wyboru branż, filtra kategorii i silnika konfliktów w Pythonie — napisana na podstawie udokumentowanego znaczenia tabel, a nie z własnego kodu strony — jest porównywana z tym, co strona renderuje w DOM: 24 branże, 48 ścieżek filtrów, 174 osiągalne ścieżki konfliktów, w tym każda reguła i przypadek „wszystko wybrane”, 26 par komparatorów oraz zestaw startowy oferowany dla każdej branży, który nie może powodować żadnego konfliktu. Ślad każdej kluczowej liczby jest sprawdzany pod kątem dostarczonego indeksu pliku źródłowego, w tym, czy cytowany wiersz znajduje się w pliku. Własny panel sprawdzania struktury strony nie ma tu żadnego znaczenia. Zestaw testowy został przygotowany przez autora; nie została zweryfikowana przez żadną stronę zewnętrzną."},"independent_validation":false,"benchmarks":[{"id":"catalogue-integrity-and-comparison","reference":"DATA-INTEGRITY benchmark, not a physics one: this tool computes nothing, it compares industries over a catalogue of attention points, counter-measures, conflicts between measures and key figures traced to worked material. The reference is an independent python re-implementation (/root/bench/ref/gen_procesklimaat.py) of the record schema, the referential closure, the per-industry selection semantics, the category filter and the conflict engine, written from the documented meaning of the tables rather than from the page's own functions.","citations":["Independent re-implementation of the schema, referential closure, selection, filter and conflict semantics: /root/bench/ref/gen_procesklimaat.py (this repository).","The key figures are traced by the data itself to the worked material of this collection (file and line); the benchmark verifies that every cited file is in the shipped source-file index and that every cited line lies inside the recorded length of that file."],"cases":10,"passed":10,"tolerance":"Exact set equality, with no tolerance at all. Every industry, filter, comparator pair and conflict path must produce exactly the set of record ids computed independently in python; every printed count and live tile must equal a recount; schema, referential-closure and seven-language checks must report zero errors. The preset invariant is absolute: a starting set offered to a user must raise no hard conflict and no warning under the independently recomputed verdict.","run_at":"2026-10-04T11:46:56.788Z","artifact":"benchmarks/procesklimaat.json"}]},"report":{"pdf":true,"source_attribution":true},"python_export":{"supported":false,"reason":{"en":"The result is a selection out of a shipped catalogue and a rule table, not a computation: there is no equation for a standalone script to re-run.","uk":"Результат — вибірка з наявного каталогу і таблиці правил, а не обчислення: немає рівняння для окремого скрипта.","de":"Das Ergebnis ist eine Auswahl aus einem mitgelieferten Katalog und einer Regeltabelle, keine Berechnung: es gibt keine Gleichung für ein eigenständiges Skript.","nl":"Het resultaat is een selectie uit een meegeleverde catalogus en regeltabel, geen berekening: er is geen vergelijking voor een losstaand script.","fr":"Le résultat est une sélection dans un catalogue et une table de règles livrés avec la page, non un calcul : il n'y a pas d'équation p /* --- framework repairs, local to this file; they belong upstream in
       diagram-ui.js and are applied here the same way the earlier ports did.
   1. .dgu-panel{display:flex} and .dgu-field{display:grid} outrank the user
      agent's [hidden] rule, so a hidden panel or field never collapsed.
   2. the tour card, the popover and the dialog are appended to the document
      body, outside .dgu-app, so they miss the framework's own box-sizing reset.
   3. the header's own <select> keeps the 36 px control height below md, under
      the 44 px tap target the spec asks for.
   4. .dgu-btn is white-space:nowrap, and an Examples entry puts its one-line
      description inside the button, so a description longer than the column
      pushed the page 350 px wide at 390 px.
   5. the header title and the header subtitle are flex siblings that both
      shrink, so below lg a long subtitle squeezed the h1 down to one word per
      line and .dgu-title{overflow-wrap:anywhere} then broke it mid-word.
   6. the framework's own ? affordance is a 28 px circle below md, under the
      44 px tap target the same spec asks for. The circle stays 28 px — a 44 px
      disc beside every label would be the loudest thing on a phone — and the
      hit area is extended to 44 px instead.                                --- */
.dgu-app [hidden],.dgu-panel[hidden],.dgu-field[hidden]{display:none!important}
.dgu-tour,.dgu-tour *,.dgu-pop,.dgu-pop *,.dgu-dialog,.dgu-dialog *{box-sizing:border-box}
@media(max-width:768px){.dgu-app .dgu-sel{min-height:var(--tap)}
  .dgu-app .dgu-q{position:relative}
  .dgu-app .dgu-q::after{content:"";position:absolute;left:50%;top:50%;
    width:var(--tap);height:var(--tap);transform:translate(-50%,-50%)}}
.dgu-app [data-dgu-panel="dgu-examples"] .dgu-btn{white-space:normal;min-width:0}
.dgu-app [data-dgu-panel="dgu-examples"] .dgu-btn>span{min-width:0}
.dgu-app .dgu-title{overflow-wrap:break-word}
@media(max-width:1120px){.dgu-app .dgu-head-l{flex-wrap:wrap}.dgu-app .dgu-sub{flex:1 1 100%}}

  .dgu-app .ms input{width:22px;height:22px}
}

/* --- badges: every badge is a real button, and the shape glyph carries the
       same distinction as the colour ---------------------------------------- */
.bdg{display:inline-flex;align-items:center;gap:var(--sp-1);padding:2px var(--sp-2);
  border-radius:var(--radius-pill);font:650 var(--fs-micro)/1.5 var(--font);letter-spacing:.02em;
  white-space:nowrap;border:1px solid transparent;cursor:pointer;min-height:24px}
.bdg .sh{font-size:var(--fs-micro);line-height:1}
.bdg.law{background:var(--pk-law-l);color:var(--pk-law);border-color:var(--pk-law)}
.bdg.standard{background:var(--pk-std-l);color:var(--pk-std);border-color:var(--pk-std)}
.bdg.guidance{background:var(--pk-guide-l);color:var(--pk-guide);border-color:var(--pk-guide)}
.bdg.method{background:var(--pk-calc-l);color:var(--pk-calc);border-color:var(--pk-calc)}
.bdg.rule{background:var(--pk-rule-l);color:var(--pk-rule);border-color:var(--pk-rule)}
.bdg.st{border-style:solid;background:var(--panel);color:var(--muted);border-color:var(--line);font-weight:500}
.bdg.st.confirmed{color:var(--ok);border-color:var(--ok)}
.bdg.st.assumed{color:var(--warn);border-color:var(--warn)}
.bdg:hover{filter:brightness(1.06);text-decoration:underline}
.bdg .cn{margin-left:var(--sp-1);font-size:var(--fs-micro);opacity:.9;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:var(--sp-1);align-items:center}
.filtrow{display:flex;flex-wrap:wrap;gap:var(--sp-1);align-items:center;margin-top:var(--sp-2)}
.filtbar{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap;
  padding:var(--sp-2) var(--sp-3);background:var(--weak);border:1px solid var(--line);
  border-radius:var(--radius-sm);font-size:var(--fs-label);font-weight:650;color:var(--accent)}

/* --- messages ------------------------------------------------------------- */
.msg{border-radius:var(--radius-sm);padding:var(--sp-3);margin-bottom:var(--sp-2);
  font-size:var(--fs-label);border:1px solid var(--line);background:var(--panel-2)}
.msg:last-child{margin-bottom:0}
.msg.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.msg.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.msg.info{background:var(--weak);border-color:var(--accent);color:var(--accent)}
.msg.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.msg b{display:block;margin-bottom:var(--sp-1)}
.msg .why{color:inherit;opacity:.92;font-weight:400}
.secl{font-weight:650;font-size:var(--fs-section);letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin:0 0 var(--sp-2)}
.flash{margin-top:var(--sp-3)}
#cf-out{margin-top:var(--sp-4)}
#unc-out{margin-top:var(--sp-4)}

/* --- live tiles: the framework draws them; the fifth tone, and the ring the
       result panel wears while a hard conflict stands, are this page's --- */
.dgu-r-results.hasconf .dgu-results{border-color:var(--bad);outline:2px solid var(--bad-bg)}
.dgu-tile.info{background:var(--weak);border-color:var(--accent)}
.dgu-tile.info .dgu-tile-v{color:var(--accent)}

/* --- attention points still open ------------------------------------------ */
.opl{margin:var(--sp-2) 0 0;padding:0;list-style:none}
.opl li{border-top:1px dashed var(--line);padding:var(--sp-2) 0}
.opl li:first-child{border-top:0}
.opl .opg{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);font-weight:650}
.opl .opt{font-size:var(--fs-label);font-weight:650;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-1);margin-top:var(--sp-2)}
.chip{border:1px dashed var(--accent);color:var(--accent);background:transparent;
  border-radius:var(--radius-pill);padding:var(--sp-1) var(--sp-3);font:500 var(--fs-small)/1.35 var(--font);
  cursor:pointer;text-align:left;min-height:var(--ctl-h)}
.chip:hover{background:var(--weak);border-style:solid}
@media(max-width:768px){.dgu-app .chip{min-height:var(--tap)}}

/* --- side-by-side comparison ---------------------------------------------- */
.cmp{display:grid;grid-template-columns:1fr;gap:var(--sp-3)}
@media(min-width:768px){.cmp{grid-template-columns:1fr 1fr}}
.cmpcol h3{margin:0 0 var(--sp-2);font:650 var(--fs-section)/1.3 var(--font);
  text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.cmpbox{border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--sp-3);
  background:var(--panel-2);font-size:var(--fs-label)}
.cmpbox h4{margin:0 0 var(--sp-1);font:650 var(--fs-micro)/1.4 var(--font);
  text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cmpbox+.cmpbox{margin-top:var(--sp-2)}
.cmpbox ul{margin:0;padding-left:var(--sp-4)}
.cmpbox li{margin-bottom:2px}

/* --- limitations and the page's own structural checks --------------------- */
ul.plain{margin:var(--sp-2) 0 0;padding-left:var(--sp-4);font-size:var(--fs-label)}
ul.plain li{margin-bottom:var(--sp-1)}
.flag{display:flex;align-items:flex-start;gap:var(--sp-2);padding:var(--sp-2) 0;
  border-bottom:1px solid var(--line);font-size:var(--fs-label)}
.flag:last-child{border-bottom:0}
.flag::before{width:18px;height:18px;border-radius:var(--radius-sm);flex:none;display:grid;
  place-items:center;font:650 var(--fs-micro)/1 var(--font);color:var(--accent-ink);margin-top:2px}
.flag.ok::before{content:"\2713";background:var(--ok)}
.flag.bad::before{content:"\2715";background:var(--bad)}

/* --- key conditions: the three source layers are kept visually apart, so that
       a figure quoted from a worked example never reads like a document
       requirement ------------------------------------------------------------ */
.pvw{flex:1 1 100%;margin:var(--sp-1) 0 0}
.ap>.pvw{margin:var(--sp-2) 0 0}
.pvt{border:1px dashed var(--line);background:transparent;color:var(--muted);
  border-radius:var(--radius-sm);padding:var(--sp-1) var(--sp-2);font:650 var(--fs-micro)/1.35 var(--font);
  cursor:pointer;display:inline-flex;align-items:center;gap:var(--sp-1);text-align:left;min-height:var(--ctl-h)}
.pvt:hover{border-color:var(--accent);color:var(--accent);border-style:solid}
.pvt .tw{font-size:var(--fs-micro);flex:none}
.pvt .cn{font-variant-numeric:tabular-nums;opacity:.85}
@media(max-width:768px){.dgu-app .pvt{min-height:var(--tap)}}
.pvb{margin:var(--sp-2) 0 var(--sp-1);padding-left:var(--sp-2);border-left:3px solid var(--line)}
.pvhd{font:650 var(--fs-micro)/1.4 var(--font);text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);margin:0 0 var(--sp-2)}
.pvr{border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--sp-2) var(--sp-3);
  margin-bottom:var(--sp-2);background:var(--panel-2)}
.pvr.l-chapter{border-left:5px solid var(--pk-calc);background:var(--pk-calc-l)}
.pvr.l-paidstd{border-left:5px dashed var(--pk-std);background:var(--pk-std-l)}
.pvr.l-openlaw{border-left:5px double var(--pk-law);background:var(--pk-law-l)}
.pvr .pvsub{font-weight:650;font-size:var(--fs-label);display:block;margin-bottom:var(--sp-1)}
.pvbd{display:flex;flex-wrap:wrap;gap:var(--sp-1);margin-bottom:var(--sp-1);align-items:center}
.pvv{font:650 var(--fs-body)/1.3 var(--font);font-variant-numeric:tabular-nums;margin:2px 0 var(--sp-2)}
.pvf{font-size:var(--fs-small);margin:var(--sp-1) 0;line-height:1.5}
.pvf b{display:block;font:650 var(--fs-micro)/1.4 var(--font);text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted)}
.pvtr{font-size:var(--fs-micro);color:var(--muted);margin:var(--sp-2) 0 0;word-break:break-all;
  font-variant-numeric:tabular-nums}
.pvno{font-size:var(--fs-micro);font-weight:650;margin:var(--sp-2) 0 0}
.pvnote{font-size:var(--fs-micro);color:var(--muted);margin:2px 0 0}
.bdg.lay{background:var(--panel);border-style:dashed;color:var(--muted)}
.bdg.lay.l-chapter{color:var(--pk-calc);border-color:var(--pk-calc);background:var(--pk-calc-l)}
.bdg.lay.l-paidstd{color:var(--pk-std);border-color:var(--pk-std);background:var(--pk-std-l)}
.bdg.lay.l-openlaw{color:var(--pk-law);border-color:var(--pk-law);background:var(--pk-law-l)}

/* --- the explanation dialog is the framework's <dialog>; only the badge rows
       inside it are this page's ------------------------------------------------ */
.mrow{display:flex;flex-wrap:wrap;gap:var(--sp-1);margin:var(--sp-2) 0 2px;align-items:center}
.dgu-dialog-p .note{font-size:var(--fs-small);color:var(--muted);margin-top:var(--sp-3)}
.dgu-dialog-p p{margin:var(--sp-2) 0}
.dgu-dialog-p p.meta{font-size:var(--fs-small);color:var(--muted);margin:2px 0}

/* --- the fallback shell, used only when diagram-ui.js could not be loaded --- */
.pk-bare{max-width:1120px;margin:0 auto;padding:var(--sp-4);
  font:400 var(--fs-body)/1.5 var(--font);color:var(--ink);background:var(--bg)}
.pk-bare *{box-sizing:border-box}
.pk-bare h1{font-size:var(--fs-title);font-weight:650;margin:0 0 var(--sp-3)}
.pk-bare h2{font:650 var(--fs-section)/1.3 var(--font);text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);margin:var(--sp-5) 0 var(--sp-2)}
.pk-bare select{width:100%;max-width:420px;min-height:var(--tap);padding:0 var(--sp-2);
  border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel);color:var(--ink)}
.pk-bare label{display:block;font:500 var(--fs-label)/1.3 var(--font);margin:var(--sp-3) 0 var(--sp-1)}
.pk-bare .tiles{display:grid;gap:var(--sp-2);grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  margin-bottom:var(--sp-3)}
.pk-bare .tile{border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--sp-3);
  background:var(--panel-2)}
.pk-bare .tile .tv{font:650 var(--fs-body)/1.2 var(--font);font-variant-numeric:tabular-nums}
.pk-bare .tile .tl{font:500 var(--fs-micro)/1.3 var(--font);color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

var PL={"(none)":"(nic)","100 cells; gassing current 5 A per cell; 0,418 L per Ah and cell; gassing factor 0,80":"100 ogniw; prąd gazowania 5 A na ogniwo; 0,418 L na Ah i ogniwo; współczynnik gazowania 0,80","1500 m³/h of infiltration; outdoor air 25 °C and 60 % relative humidity; store at -20 °C; all excess moisture freezes out":"1500 m³/h infiltracji; temperatura powietrza zewnętrznego 25 °C i wilgotność względna 60%; przechowywać w temperaturze -20 °C; nadmiar wilgoci zamarza","2,5 m³/s while the door is open; 600 s of open time per hour":"2,5 m³/s przy otwartych drzwiach; 600 s czasu otwarcia na godzinę","35,1 m³/s for heat removal plus 15 m³/s for combustion; temperature rise 12 K; load 500 kW":"35,1 m³/s na odprowadzanie ciepła plus 15 m³/s na spalanie; wzrost temperatury 12 K; obciążenie 500 kW","4 crew members; closed atmosphere with condensate collection; example value":"4 członków załogi; atmosfera zamknięta z gromadzeniem kondensatu; przykładowa wartość","4 crew members; coupled moisture and heat balance of the closed volume; example value":"4 członków załogi; sprzężony bilans wilgoci i ciepła zamkniętej objętości; przykładowa wartość","4 crew members; moisture release 2,5 kg per person and day; the cabin heat exchanger cools below the dew point":"4 członków załogi; emisja wilgoci 2,5 kg na osobę na dzień; wymiennik ciepła w kabinie chłodzi poniżej punktu rosy","4 people at 120 W each; equipment load 1,50 kW; condensate 0,417 kg/h at 2440 kJ/kg":"4 osoby po 120 W każda; obciążenie urządzeń 1,50 kW; kondensat 0,417 kg/h przy 2440 kJ/kg","6 people in 80 m³; consumption 0,84 kg per person and day; start at 21,0 vol-%; no oxygen supply; the threshold is reached after 7,6 h":"6 osób w 80 m³; zużycie 0,84 kg na osobę na dobę; start od 21,0% obj.; brak dopływu tlenu; próg osiągnięty po 7,6 godz.","6 people in 80 m³; output 0,90 kg per person and day; start at 800 ppm; full mixing; no scrubber; the assessment value is reached after 2,69 h":"6 osób w 80 m³; wydajność 0,90 kg na osobę na dzień; rozpoczęcie od 800 ppm; pełne mieszanie; brak płuczki; wartość oceny osiągana jest po 2,69 h","6 people in a free gas volume of 80 m³; full mixing; no scrubber; the metabolic output depends strongly on activity":"6 osób w wolnej objętości gazu 80 m³; pełne mieszanie; bez skrubera; wydajność metaboliczna w dużym stopniu zależy od aktywności","6 people; carbon dioxide output 0,90 kg per person and day; 50 % margin; full mixing":"6 osób; emisja dwutlenku węgla 0,90 kg na osobę na dobę; marża 50%; pełne mieszanie","6,04 kg of ice per 45 min operating cycle; only heating the ice to 0 °C and melting it are counted":"6,04 kg lodu na 45-minutowy cykl pracy; brane pod uwagę jest jedynie podgrzewanie lodu do 0°C i jego topienie","A = 0,12 m²; x = 0,20 m; capture velocity 0,50 m/s; same geometry as at x = 0,35 m":"A = 0,12 m²; x = 0,20 m; prędkość przechwytywania 0,50 m/s; ta sama geometria co przy x = 0,35 m","A binding limit value per substance and averaging period, published by the competent authority of that country":"Wartość wiążąca dla każdej substancji i okresu uśredniania, publikowana przez właściwy organ danego kraju","A buoyancy-driven opening reverses with wind, with outdoor temperature and as soon as the process stops. A guaranteed pressure direction cannot rest on an opening whose flow direction is not controlled and not measured.":"Otwór napędzany siłą wyporu zmienia kierunek pod wpływem wiatru, temperatury zewnętrznej i natychmiast po zatrzymaniu procesu. Gwarantowany kierunek ciśnienia nie może opierać się na otworze, którego kierunek przepływu nie jest kontrolowany i nie jest mierzony.","A bypass factor or an apparatus dew point taken from the selection software of the equipment":"Współczynnik obejścia lub punkt rosy urządzenia pobrany z oprogramowania doboru sprzętu","A capture velocity given as a function of class and distance, together with the control point at which performance is verified":"Prędkość przechwytywania podana jako funkcja klasy i odległości, wraz z punktem kontrolnym, w którym weryfikowana jest wydajność","A charge limit per room and occupancy, with the detection, alarm and emergency ventilation that goes with it":"Limit opłat na pokój i liczbę osób, z detekcją, alarmem i wentylacją awaryjną, która się z tym wiąże","A classification is a measured state in a defined occupancy, not a design promise.":"Klasyfikacja to zmierzony stan w określonym stopniu zajętości, a nie obietnica projektowa.","A classification of filter performance and the corresponding laboratory and in-place test procedures":"Klasyfikacja wydajności filtrów i odpowiadające jej procedury testowe w laboratorium i na miejscu","A cleaning shift can dominate the annual moisture balance of the room.":"Zmiana sposobu sprzątania może mieć decydujący wpływ na roczny bilans wilgoci w pomieszczeniu.","A climate data set for the site, with the exceedance level stated together with the values":"Zestaw danych klimatycznych dla danego miejsca, z podanym poziomem przekroczenia i wartościami","A conflict-free typical starting set can be built for every industry":"Dla każdej branży można stworzyć bezkonfliktowy, typowy zestaw startowy","A containment cascade pulls air towards the more contaminated side. Check that the resulting route does not run along the escape path or through the refuge, especially in the incident and post-incident states.":"Kaskada ograniczająca wciąga powietrze w stronę bardziej zanieczyszczoną. Sprawdź, czy powstała w ten sposób droga nie biegnie wzdłuż drogi ewakuacyjnej ani przez schron, szczególnie w stanie incydentu i po incydencie.","A containment direction is a claim until it is measured. Add differential pressure or flow measurement with an alarm, because a fan status contact does not prove that the room is still in depression.":"Kierunek zamknięcia jest twierdzeniem obowiązującym do momentu jego zmierzenia. Należy dodać pomiar różnicy ciśnień lub przepływu z alarmem, ponieważ styk stanu wentylatora nie dowodzi, że pomieszczenie nadal znajduje się w stanie podciśnienia.","A continuous open purge with outdoor air through the enclosure and a hard dew-point limit in the same volume cannot both hold: the purge replaces the treated air with untreated outdoor air at exactly the flow rate it is sized for.":"Ciągły, otwarty przepływ powietrza zewnętrznego przez obudowę i sztywny limit punktu rosy w tej samej objętości nie mogą być stosowane jednocześnie: przedmuch zastępuje oczyszczone powietrze nieoczyszczonym powietrzem zewnętrznym dokładnie z takim natężeniem przepływu, do jakiego został zaprojektowany.","A continuous outdoor-air purge through the enclosure destroys the inert atmosphere it is meant to protect. Purging and inerting are alternating states governed by permissives and by an oxygen measurement, never simultaneous ones.":"Ciągły przepływ powietrza zewnętrznego przez obudowę niszczy atmosferę obojętną, którą ma ona chronić. Przedmuch i inertyzacja to stany naprzemienne, regulowane przez czynniki permisywne i pomiar tlenu, nigdy jednoczesne.","A curtain jet across an opening in a pressure cascade adds its own momentum to the pressure difference. Direction and flow through the opening then depend on the curtain setting, so the cascade has to be verified with the curtain on and off.":"Strumień kurtyny przepływającej przez otwór w kaskadzie ciśnień dodaje swój pęd do różnicy ciśnień. Kierunek i przepływ przez otwór zależą od ustawienia kurtyny, dlatego kaskadę należy weryfikować zarówno przy włączonej, jak i wyłączonej kurtynie.","A dedicated air handling unit per product zone, with no shared return":"Dedykowana jednostka przetwarzania powietrza dla każdej strefy produktu, bez wspólnego powrotu","A defined disposal route for the loaded filter as process material":"Określona droga utylizacji załadowanego filtra jako materiału procesowego","A defined purge before start-up and before release for maintenance":"Zdefiniowane oczyszczanie przed uruchomieniem i przed dopuszczeniem do konserwacji","A detector without a written access, alarm-response and evacuation procedure produces a noise, not a barrier. Fix as well who may reset it and after which measurement.":"Detektor bez pisemnej procedury dostępu, alarmu i ewakuacji generuje hałas, a nie barierę. Należy również ustalić, kto może go zresetować i po jakim pomiarze.","A dew-point limit that is not measured at several representative points and followed as a trend cannot be defended. A single sensor near the unit tells you about the unit, not about the room.":"Nie da się obronić limitu punktu rosy, który nie jest mierzony w kilku reprezentatywnych punktach i nie jest traktowany jako trend. Pojedynczy czujnik w pobliżu urządzenia informuje o urządzeniu, a nie o pomieszczeniu.","A dry recirculation loop running next to a hazardous process is defensible only when the two air systems are demonstrably separate: separate units, separate penetrations, and a written leak-path analysis between them.":"Sucha pętla recyrkulacyjna działająca obok niebezpiecznego procesu jest możliwa do obrony tylko wtedy, gdy oba układy powietrza są wyraźnie oddzielone: ​​oddzielne jednostki, oddzielne przejścia i pisemna analiza ścieżek wycieku między nimi.","A fan status contact is not proof of flow; the permissive should watch the process quantity.":"Styk potwierdzenia pracy wentylatora nie dowodzi przepływu; sygnał zezwolenia powinien monitorować rzeczywistą wielkość procesową.","A filter that cannot be reached safely will not be changed at the right interval.":"Filtr, do którego nie można bezpiecznie dotrzeć, nie zostanie wymieniony we właściwym odstępie czasu.","A fixed timer can serve only as an upper bound; switching is better driven by pressure difference, dew point and coil temperature":"Stały timer może służyć jedynie jako górna granica; przełączanie jest lepiej sterowane różnicą ciśnień, punktem rosy i temperaturą wężownicy","A flow derived from your own balance, with the air change rate as an output rather than an input":"Przepływ wynikający z Twojego własnego bilansu, w którym szybkość wymiany powietrza jest wyjściem, a nie wejściem","A function that must never be interrupted needs availability, not only a design flow rate. With a single train, every filter change, every belt and every motor failure becomes an interruption of the safety function, and the safe state has to be declared for each of them.":"Funkcja, której nie wolno nigdy przerywać, wymaga dostępności, a nie tylko projektowego natężenia przepływu. W przypadku pojedynczego pociągu każda wymiana filtra, każda awaria pasa i silnika powoduje przerwanie funkcji bezpieczeństwa, a dla każdego z nich należy zadeklarować stan bezpieczny.","A function that must never stop needs availability, not only a design flow rate.":"Funkcja, która nigdy nie może zostać zatrzymana, wymaga dostępności, a nie tylko projektowanego natężenia przepływu.","A hard dew-point limit held continuously in the room":"Twardy limit punktu rosy utrzymywany stale w pomieszczeniu","A hard dew-point limit held continuously in the room and fans off or reduced outside production hours describe opposite night behaviour. Moisture keeps entering through the envelope, the doors and the material when the fans are down, and the limit is the first thing lost.":"Stały, sztywny limit punktu rosy w pomieszczeniu i wyłączone lub zmniejszone obroty wentylatorów poza godzinami pracy opisują odwrotne zachowanie w nocy. Wilgoć nadal przedostaje się przez obudowę, drzwi i materiał, gdy wentylatory są wyłączone, a limit jest pierwszą rzeczą, która zostaje utracona.","A hard maximum surface and air temperature limit inside the zone":"Wewnątrz strefy obowiązuje sztywny limit maksymalnej temperatury powierzchni i powietrza","A high recirculation ratio with a small deeply dried outdoor fraction and a continuous open outdoor purge through the same enclosure describe opposite air paths. Either the volume is closed and dried, or it is swept with outdoor air; the drying plant is sized for only one of the two.":"Wysoki współczynnik recyrkulacji z niewielką, głęboko osuszoną frakcją zewnętrzną i ciągłym, otwartym przedmuchem zewnętrznym przez tę samą obudowę opisują przeciwstawne ścieżki powietrza. Objętość jest albo zamknięta i osuszona, albo przedmuchiwana powietrzem zewnętrznym; suszarnia jest zaprojektowana tylko dla jednego z tych dwóch rozwiązań.","A high-velocity capture slot and a push-pull field across the same surface are two different capture principles. Combined without a visualisation test they usually spoil each other: the jet overshoots the slot and the capture efficiency falls instead of rising.":"Szczelinowy odciąg o dużej prędkości i układ nadmuchowo-wyciągowy (push-pull) nad tą samą powierzchnią są dwiema różnymi zasadami wychwytu. Połączone bez testu wizualizacyjnego zwykle wzajemnie się zakłócają: struga omija szczelinę i skuteczność wychwytu spada zamiast rosnąć.","A loading lock helps only if the door open time is short. Fast doors and the discipline of not parking pallets in the opening are part of the same measure.":"Blokada załadunku pomaga tylko wtedy, gdy czas otwarcia drzwi jest krótki. Szybkie otwieranie drzwi i dyscyplina w unikaniu parkowania palet w otworze to elementy tego samego działania.","A margin derived from your own uncertainty budget, not a fixed figure taken from a table":"Marża wynikająca z Twojego własnego budżetu niepewności, a nie stała wartość z tabeli","A permissive and a confirmation for each mode transition":"Zezwolenie i potwierdzenie dla każdej zmiany trybu","A pressure cascade protecting a clean or product zone does not survive a smoke extraction that opens the compartment. The fire concept has to state which zones lose their cascade, for how long, and what the product status is afterwards.":"Kaskada ciśnień chroniąca strefę czystą lub produktową nie przetrwa działania wyciągu dymu, który otworzy komorę. Koncepcja pożaru musi określać, które strefy tracą kaskadę, na jak długo i jaki będzie później status produktu.","A pressure difference is never specified apart from the leakage area and the door schedule":"Różnica ciśnień nie jest nigdy określona poza obszarem nieszczelności i harmonogramem drzwi","A pressure difference or a doorway velocity tied to the zone class, together with the state in which it is verified":"Różnica ciśnień lub prędkość drzwi powiązana z klasą strefy, wraz ze stanem, w którym jest weryfikowana","A pressure difference without a defined leakage area and door schedule proves nothing.":"Różnica ciśnień bez określonego obszaru nieszczelności i harmonogramu otwarcia drzwi niczego nie dowodzi.","A pressure setpoint without a defined leakage area and door schedule proves nothing: the same pascal figure can describe a healthy cascade or a room that empties as soon as one door opens.":"Wartość zadana ciśnienia bez określonego obszaru nieszczelności i harmonogramu otwierania drzwi niczego nie dowodzi: ta sama liczba Pascalów może opisywać zdrową kaskadę lub pomieszczenie, które opróżnia się natychmiast po otwarciu jednych drzwi.","A protected volume held at overpressure with filtered air":"Objętość chroniona, utrzymywana pod ciśnieniem za pomocą przefiltrowanego powietrza","A push jet is only useful if it drives the contaminant into the extraction slot and not through the breathing zone of the operator. Verify the direction with smoke at real working positions before you accept the arrangement.":"Strumień wypychający jest skuteczny tylko wtedy, gdy wtłacza zanieczyszczenia do otworu odciągowego, a nie przez strefę oddechową operatora. Przed zaakceptowaniem tego rozwiązania należy sprawdzić kierunek przepływu w rzeczywistych warunkach pracy.","A push-pull jet across the surface creates at the bath or at the product exactly the high mass transfer that a velocity limit over an open bath or open product is meant to prevent. Either the surface tolerates the jet, or the velocity limit governs and the capture has to be built differently.":"Strumień pchająco-ciągnący po powierzchni tworzy w kąpieli lub w produkcie dokładnie taki wysoki transfer masy, jaki ma zapobiegać ograniczenie prędkości nad otwartą kąpielą lub otwartym produktem. Albo powierzchnia toleruje strumień, albo decyduje ograniczenie prędkości, a system przechwytywania musi być skonstruowany inaczej.","A real coil has a bypass factor; the calculation with a saturated outlet is idealised":"Rzeczywista cewka ma współczynnik obejścia; obliczenia z nasyconym wyjściem są idealizowane","A regeneration temperature and flow from the rotor manufacturer for your own dew point duty":"Temperatura regeneracji i przepływ od producenta wirnika do Twojego własnego punktu rosy","A required ventilation flow and the interlock and monitoring that must accompany it":"Wymagany przepływ wentylacji oraz towarzysząca mu blokada i monitoring","A return duct from a collector handling combustible dust is a credible path for dust and for flame and pressure propagation. Returning that air keeps the workroom inside the hazardous area instead of outside it, and the zone drawing has to say so.":"Kanał powrotny z kolektora odprowadzającego pył palny stanowi wiarygodną ścieżkę dla pyłu oraz rozprzestrzeniania się płomienia i ciśnienia. Powrót tego powietrza utrzymuje pomieszczenie robocze w strefie zagrożonej wybuchem, a nie poza nią, co musi być uwzględnione w planie strefowym.","A rotary wheel is a mass-transfer path from the extract back into the supply. If a stream has been declared hazardous and routed once-through to treatment, a wheel on that same stream returns part of it to the room and cancels the declaration. Recovery on such a stream is made with a plate exchanger or a run-around circuit instead.":"Koło obrotowe to ścieżka transportu masy z wyciągu z powrotem do źródła. Jeśli strumień został uznany za niebezpieczny i skierowany jednorazowo do oczyszczania, koło w tym samym strumieniu zwraca jego część do pomieszczenia i anuluje zgłoszenie. Odzysk takiego strumienia odbywa się za pomocą wymiennika płytowego lub obiegu pośredniego.","A rotary wheel transfers mass as well as heat: carry-over in the matrix and casing leakage create a path from the extract side to the supply side. A confinement whose entire purpose is that nothing crosses from the contaminated side requires a recovery device without mass transfer.":"Koło obrotowe przenosi zarówno masę, jak i ciepło: przenoszenie w matrycy i nieszczelności obudowy tworzą ścieżkę od strony wydobywczej do strony zasilającej. Zamknięcie, którego jedynym celem jest zapobieganie przedostawaniu się zanieczyszczeń ze strony zanieczyszczonej, wymaga urządzenia odzyskującego bez przenoszenia masy.","A safety function that must not be interrupted in any mode":"Funkcja bezpieczeństwa, której nie wolno przerywać w żadnym trybie","A single train without redundancy and redundant trains with automatic changeover are the two ends of the same decision. Ticking both leaves the availability of the function undefined, and the rest of the design depends on exactly that.":"Pojedynczy pociąg bez redundancji i pociągi redundantne z automatycznym przesiadką to dwa końce tej samej decyzji. Zaznaczenie obu opcji pozostawia dostępność funkcji nieokreśloną, a reszta projektu zależy właśnie od tego.","A single ventilation train without redundancy":"Pojedynczy ciąg wentylacyjny bez redundancji","A small door or material infiltration can dominate the whole drying load.":"Niewielkie drzwi lub infiltracja materiału może zdominować cały ładunek suszenia.","A table of transport velocities by material type, and the way to treat branches that are switched off":"Tabela prędkości transportu według rodzaju materiału i sposobu postępowania z gałęziami wyłączonymi","A typical starting set for this industry is ticked. No rule of this page objects to it, which makes it a starting point for the discussion, not a design proposal. Change it wherever your process differs.":"Typowy zestaw startowy dla tej branży jest zaznaczony. Żadna z zasad na tej stronie temu nie przeszkadza, co czyni go punktem wyjścia do dyskusji, a nie propozycją projektową. Zmień go, jeśli Twój proces się różni.","A validated drying mode after wet cleaning belongs to a wet cleaning regime. Ticked together with dry cleaning only, the two describe two different cleaning philosophies; say which zones or which campaigns each of them applies to.":"Zatwierdzony tryb suszenia po czyszczeniu na mokro należy do programu czyszczenia na mokro. Razem z czyszczeniem wyłącznie na sucho, oba te tryby opisują dwie różne filozofie czyszczenia; określają, do których stref lub kampanii każdy z nich się odnosi.","A ventilation declared uninterruptible cannot at the same time be switched off by the fire mode. One of the two statements has to give way, and which one is a question of priority between a safety function and the fire strategy, settled before the cause-and-effect matrix is written.":"Wentylacja uznana za nieprzerwaną nie może być jednocześnie wyłączona przez tryb pożarowy. Jedno z dwóch stwierdzeń musi ustąpić, a które z nich jest kwestią pierwszeństwa między funkcją bezpieczeństwa a strategią pożarową, ustaloną przed napisaniem macierzy przyczynowo-skutkowej.","A ventilation that cannot be stopped and an automatic shutdown with damper closure before the extinguishing release are direct opposites in the same space. If the extinguishing concept needs a closed, evacuated volume, the ventilation is not a continuously running function; if it must run continuously, another extinguishing principle has to be chosen.":"Wentylacja, której nie można zatrzymać, i automatyczne wyłączenie z zamknięciem przepustnicy przed uruchomieniem środka gaśniczego to dwa przeciwstawne zjawiska w tej samej przestrzeni. Jeśli koncepcja gaszenia wymaga zamkniętej, ewakuowanej przestrzeni, wentylacja nie działa w sposób ciągły; jeśli musi działać w sposób ciągły, należy wybrać inną zasadę gaszenia.","A vestibule, a fast door, an air curtain and dry make-up air are judged on the measured reduction they achieve":"Przedsionek, drzwi szybkobieżne, kurtyna powietrzna i suche powietrze dolotowe oceniane są na podstawie zmierzonej redukcji, jaką osiągają","A visible plume is a latent load first and a comfort problem second.":"Widoczny pióropusz jest przede wszystkim obciążeniem utajonym, a dopiero potem problemem komfortu.","A wheel upstream of a supply protected by a high-efficiency final filter carries part of the extract back across the recovery section. The final filter holds particles but not gases and odour, and the carry-over rate depends on the purge sector and on the fan arrangement; both belong in the acceptance test.":"Koło umieszczone przed dopływem, chronione wysokosprawnym filtrem końcowym, odprowadza część wyciągu z powrotem przez sekcję odzysku. Filtr końcowy zatrzymuje cząstki stałe, ale nie gazy i zapachy, a szybkość przenoszenia zależy od sektora oczyszczania i układu wentylatora; oba te czynniki podlegają testowi odbiorczemu.","A written cause-and-effect matrix for detection, dampers and fans":"Pisemna macierz przyczynowo-skutkowa dla wykrywania, przepustnic i wentylatorów","A written changeover mode with a flush time before the next product":"Pisemny tryb przełączania z czasem spłukiwania przed następnym produktem","A written state matrix covering every operating mode":"Pisemna macierz stanu obejmująca każdy tryb pracy","Absolute humidity, not relative humidity, is the quantity that has to balance.":"Należy zachować równowagę, czyli wilgotność bezwzględną, a nie względną.","Acceptance rests on flow direction, control of the parameter and alarm action together.":"Akceptacja opiera się na kierunku przepływu, kontroli parametru i działaniu alarmu.","Additive manufacturing and powder-bed processes":"Produkcja addytywna i procesy proszkowe","Adds metabolic, equipment and latent heat into one figure for the heat rejection path":"Dodaje do jednej figury ciepło metaboliczne, sprzętowe i utajone dla ścieżki oddawania ciepła","Adds to the flow for heat removal and must not be counted twice":"Dodaje do przepływu w celu usunięcia ciepła i nie należy go liczyć dwa razy","After the system is changed by dampers, filters, closed branches, heat exchangers or pressure setpoints, the intersection point has to be found again":"Po zmianie układu poprzez przepustnice, filtry, zamknięte odgałęzienia, wymienniki ciepła lub nastawy ciśnienia konieczne jest ponowne znalezienie punktu przecięcia","Air change rate for a class of room":"Współczynnik wymiany powietrza dla danej klasy pomieszczeń","Air curtain across the opening":"Kurtyna powietrzna w poprzek otworu","Air distribution at the engine intakes and hot surfaces matters as much as the total flow":"Rozprowadzanie powietrza w wlotach silnika i gorących powierzchniach jest równie ważne jak całkowity przepływ","Air flow needed to carry the heat out of the machinery space":"Przepływ powietrza potrzebny do odprowadzenia ciepła z maszynowni","Air leaves the coil saturated (idealisation); no moisture is added between the coil and the reheater":"Powietrze opuszcza wężownicę nasycone (idealizacja); pomiędzy wężownicą a nagrzewnicą nie jest dodawana wilgoć","Air movement over open product or an open bath must be limited":"Należy ograniczyć ruch powietrza nad otwartym produktem lub otwartą wanną","Air state at the inlet of the dehumidification train":"Stan powietrza na wlocie do układu osuszającego","Air temperature after the coil and after the reheater":"Temperatura powietrza za wężownicą i za nagrzewnicą","Airlock between zones with interlocked doors":"Śluza powietrzna między strefami z drzwiami blokowanymi","All data strings are present in all seven languages":"Wszystkie teksty danych są dostępne we wszystkich siedmiu językach","All flows must be referred to one and the same reference density":"Wszystkie przepływy muszą być odnoszone do tej samej gęstości odniesienia","All ticks removed.":"Wszystkie kleszcze zostały usunięte.","An access door drawn on a plan is not an access door reachable on site.":"Drzwi dostępowe narysowane na planie nie są drzwiami dostępowymi, do których można dotrzeć na miejscu.","An agent concentration and a hold time together with the enclosure integrity that has to be demonstrated":"Należy wykazać stężenie środka i czas jego utrzymywania wraz z integralnością obudowy","An air change rate is not an independent design quantity: it follows from a calculation or from a proven configuration":"Współczynnik wymiany powietrza nie jest niezależną wielkością projektową: wynika z obliczeń lub sprawdzonej konfiguracji","An airlock whose two doors can be open at once is a corridor. Interlocking, status indication and an alarm on override are what turn it into a barrier.":"Śluza powietrzna, której dwoje drzwi można otworzyć jednocześnie, to korytarz. Blokada, sygnalizacja stanu i alarm o obejściu sprawiają, że staje się ona barierą.","An availability target derived from your own consequence analysis, not a number taken from a table":"Cel dostępności wyprowadzony z własnej analizy konsekwencji, a nie liczba pobrana z tabeli","An averaged emission factor hides the peak the hood must actually catch.":"Uśredniony współczynnik emisji ukrywa szczyt, który okap musi faktycznie wychwycić.","An example value, not a measured property of a particular room":"Wartość przykładowa, a nie mierzona właściwość konkretnego pomieszczenia","An example value; in a project it follows from the engine data and the applicable ship rules":"Wartość przykładowa; w projekcie wynika z danych silnika i obowiązujących zasad dotyczących statku","An explosion vent needs a defined discharge area that nobody can occupy and that does not point at an escape route, an air intake or a neighbouring building.":"Otwór wylotowy wybuchu wymaga określonego obszaru zrzutu, w którym nikt nie może przebywać i który nie może być skierowany w stronę drogi ewakuacyjnej, wlotu powietrza lub sąsiedniego budynku.","An expressly declared input of the example, not a universal outdoor design condition":"Wyraźnie zadeklarowany wkład przykładu, a nie uniwersalny warunek projektowania na zewnątrz","An expressly declared input value of the example, not a design norm":"Wyraźnie zadeklarowana wartość wejściowa przykładu, a nie norma projektowa","An interval derived from measured condition, not from the calendar":"Interwał wynikający ze zmierzonego stanu, a nie z kalendarza","An open door is not a small opening: there the unsteady bidirectional flow and the frequency of use govern":"Otwarte drzwi to nie małe otwarcie: tam rządzi niestabilny dwukierunkowy przepływ i częstotliwość użytkowania","Any local reheat, defrost or door event is a break that must be justified and recorded.":"Każde lokalne podgrzanie, rozmrożenie lub otwarcie drzwi jest przerwą, którą należy uzasadnić i zarejestrować.","Applicability of every item must be verified against the project design basis, the substances actually handled and the national implementation of the referenced law.":"Przydatność każdego elementu musi zostać zweryfikowana w kontekście projektu, faktycznie wykorzystywanych substancji i krajowej implementacji powołanego prawa.","Applicable with assumptions":"Ma zastosowanie przy założeniach","Applicable with assumptions: the point holds only for certain substances, layouts or operating states; check the assumption before you use it.":"Stosuje się z założeniami: punkt ten obowiązuje tylko dla niektórych substancji, układów lub stanów operacyjnych; sprawdź założenie przed jego użyciem.","Asphyxiant or oxygen-displacing gas collecting in low zones":"Gaz duszący lub wypierający tlen, gromadzący się w niskich strefach","Assess the outdoor impact of the emergency purge before selecting it":"Przed wyborem awaryjnego czyszczenia należy ocenić jego wpływ na otoczenie zewnętrzne","Assess the water and cooling demand of the chosen humidity strategy":"Oceń zapotrzebowanie na wodę i chłodzenie dla wybranej strategii nawilżania","Assessment point x = 0,35 m in front of the opening; opening area 0,12 m²; free (unflanged) suction; cross-draughts, flanges and source momentum assessed separately":"Punkt oceny x = 0,35 m przed otworem; powierzchnia otworu 0,12 m²; swobodne (bezkołnierzowe) ssanie; ciągi poprzeczne, kołnierze i pęd źródłowy oceniane oddzielnie","Assessment value for carbon dioxide in a closed habitable volume":"Wartość szacunkowa dwutlenku węgla w zamkniętej przestrzeni mieszkalnej","Assessment value for oxygen in a closed habitable volume":"Wartość oceny tlenu w zamkniętej przestrzeni mieszkalnej","At reduced flow, surfaces cool down and the margin above dew point shrinks overnight. Check the coldest surface in the unoccupied state, not only during production, and include the first hour after restart.":"Przy zmniejszonym przepływie powierzchnie się ochładzają, a margines powyżej punktu rosy zmniejsza się w ciągu nocy. Sprawdź najzimniejszą powierzchnię w stanie nieużytkowanym, nie tylko podczas produkcji, i uwzględnij pierwszą godzinę po ponownym uruchomieniu.","Attention points addressed":"Omówione punkty uwagi","Attention points and countermeasures":"Punkty uwagi i środki zaradcze","Attention points are grouped by type. Each item carries a source-basis badge: mandatory law, standards, industry guidance, calculation methods and rules of thumb are deliberately not shown alike.":"Punkty uwagi są pogrupowane według typu. Każdy element ma oznaczenie źródła: obowiązujące prawo, normy, wytyczne branżowe, metody obliczeniowe i zasady praktyczne celowo nie są prezentowane w ten sam sposób.","Attention points in this industry":"Punkty uwagi w tej branży","Attention points still without any measure":"Punkty wymagające uwagi nadal bez przypisanego środka","Attenuation and vibration isolation at the workplace":"Tłumienie i izolacja drgań w miejscu pracy","Automatic ventilation shutdown and damper closure before release":"Automatyczne wyłączenie wentylacji i zamknięcie przepustnicy przed zwolnieniem","Bag-in bag-out or an equivalent contained filter change":"Wymiana filtra w systemie bag-in-bag lub równoważnym systemie zamkniętym","Bakeries, ovens and frying lines":"Piekarnie, piece i linie do smażenia","Batch and event-driven emission peaks":"Szczyty emisji zbiorczych i wyzwalanych zdarzeniami","Before the agent is released, the ventilation has to stop and the dampers have to close, otherwise the design concentration is never reached and the hold time is fiction.":"Zanim środek zostanie uwolniony, wentylacja musi się zatrzymać, a przepustnice muszą się zamknąć, w przeciwnym razie stężenie projektowe nigdy nie zostanie osiągnięte, a czas utrzymania będzie fikcją.","Behaviour on loss of extraction or fan failure":"Zachowanie w przypadku utraty wyciągu lub awarii wentylatora","Bioaerosol, endotoxin and microbiological load":"Bioaerozole, endotoksyny i ładunek mikrobiologiczny","Bonding and earthing continuity is part of the ventilation scope when ducts carry dust.":"Ciągłość połączeń i uziemienia wchodzi w zakres wentylacji, gdy kanały przenoszą pył.","Bonding and earthing continuity monitored along the extract path":"Ciągłość połączeń i uziemienia monitorowana wzdłuż ścieżki wyciągowej","Bounds how far the real outlet state departs from saturation; it depends on the coil geometry, the face velocity and the fin spacing, and the chapter gives no figure for it":"Granice, w jakich rzeczywisty stan wyjściowy odbiega od nasycenia; zależą od geometrii cewki, prędkości na powierzchni i odstępu między żebrami, a w rozdziale nie podano żadnych danych na ten temat","Bounds how far the surface has to stay above the dew point of the adjacent air; the chapter gives the criterion but deliberately leaves the margin open, because it follows from measurement and control uncertainty, cold bridges, local stagnation and load variation":"Określa, jak daleko powierzchnia musi znajdować się ponad punktem rosy sąsiedniego powietrza; w rozdziale podano kryterium,
