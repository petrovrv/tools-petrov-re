var PCK={k_lev1:L("The material calls this an example input of the calculation, not a regulatory limit; confirm with a smoke picture and a velocity measurement","Матеріал називає це прикладом вхідного параметра розрахунку, а не нормативною межею; підтвердьте димовою картиною та вимірюванням швидкості","Das Material nennt dies einen Beispieleingangswert der Berechnung, keine normative Grenze; mit Rauchbild und Geschwindigkeitsmessung bestätigen","Het materiaal noemt dit een voorbeeldinvoer van de berekening, geen normatieve grens; bevestig met een rookbeeld en een snelheidsmeting","Le matériau qualifie cette valeur d'entrée d'exemple du calcul, non de limite normative ; confirmer par une image de fumée et une mesure de vitesse","El material la califica como valor de entrada de ejemplo del cálculo, no como límite normativo; confírmelo con una imagen de humo y una medición de velocidad"),
k_lev2:L("The figure is obtained before corrections for flow disturbance; confirm with a smoke picture","Величину отримано до поправок на збурення потоку; підтвердьте димовою картиною","Der Wert gilt vor Korrekturen für Strömungsstörungen; mit einem Rauchbild bestätigen","De waarde geldt vóór correcties voor stromingsverstoring; bevestig met een rookbeeld","La valeur est obtenue avant corrections des perturbations d'écoulement ; confirmer par une image de fumée","El valor se obtiene antes de correcciones por perturbación del flujo; confírmelo con una imagen de humo"),
k_lev3:L("The relation is a geometric design aid, not a universal normative equation","Це співвідношення — геометрична допомога проєктувальникові, а не універсальне нормативне рівняння","Die Beziehung ist eine geometrische Entwurfshilfe, keine universelle normative Gleichung","De relatie is een geometrisch ontwerphulpmiddel, geen universele normatieve vergelijking","La relation est une aide géométrique à la conception, non une équation normative universelle","La relación es una ayuda geométrica al diseño, no una ecuación normativa universal"),
k_lev4:L("Fan power drops further only if the pressure loss does not rise with the new geometry","Потужність вентилятора падає сильніше лише тоді, коли втрати тиску не зростають за нової геометрії","Die Ventilatorleistung sinkt nur dann stärker, wenn der Druckverlust bei der neuen Geometrie nicht steigt","Het ventilatorvermogen daalt alleen verder als het drukverlies bij de nieuwe geometrie niet stijgt","La puissance du ventilateur ne baisse davantage que si la perte de charge n'augmente pas avec la nouvelle géométrie","La potencia del ventilador solo baja más si la pérdida de carga no aumenta con la nueva geometría"),
k_lev5:L("The material expressly forbids adding this figure to the calculated velocity; a test at the source is needed","Матеріал прямо забороняє додавати цю величину до розрахункової швидкості; потрібне випробування на джерелі","Das Material verbietet ausdrücklich, diesen Wert zur berechneten Geschwindigkeit zu addieren; ein Versuch an der Quelle ist erforderlich","Het materiaal verbiedt uitdrukkelijk deze waarde bij de berekende snelheid op te tellen; een proef bij de bron is nodig","Le matériau interdit expressément d'ajouter cette valeur à la vitesse calculée ; un essai à la source est nécessaire","El material prohíbe expresamente sumar este valor a la velocidad calculada; hace falta un ensayo en la fuente"),
k_dust1:L("The material states that the required transport velocity depends on the dust and the process and is not treated as a universal limit","Матеріал зазначає, що потрібна транспортна швидкість залежить від пилу та процесу і не розглядається як універсальна межа","Das Material stellt fest, dass die erforderliche Transportgeschwindigkeit vom Staub und vom Prozess abhängt und nicht als universelle Grenze behandelt wird","Het materiaal stelt dat de vereiste transportsnelheid afhangt van het stof en het proces en niet als universele grens wordt behandeld","Le matériau indique que la vitesse de transport requise dépend de la poussière et du procédé et n'est pas traitée comme une limite universelle","El material indica que la velocidad de transporte requerida depende del polvo y del proceso y no se trata como límite universal"),
k_dust2:L("Variable flow must not lead to settling in inactive branches; shut-off dampers are tested together with the system","Змінна витрата не має призводити до осідання в неактивних вітках; відсічні клапани випробовують разом із системою","Variabler Volumenstrom darf nicht zu Ablagerungen in inaktiven Strängen führen; Absperrklappen werden zusammen mit der Anlage geprüft","Variabel debiet mag niet leiden tot bezinking in inactieve takken; afsluitkleppen worden samen met het systeem beproefd","Le débit variable ne doit pas provoquer de dépôt dans les branches inactives ; les registres d'isolement sont essayés avec le système","El caudal variable no debe provocar sedimentación en ramas inactivas; las compuertas de corte se ensayan junto con el sistema"),
k_dust3:L("The figure holds for that one diameter and does not transfer to another network","Величина справджується для одного цього діаметра і не переноситься на іншу мережу","Der Wert gilt für diesen einen Durchmesser und lässt sich nicht auf ein anderes Netz übertragen","De waarde geldt voor die ene diameter en is niet overdraagbaar naar een ander net","La valeur vaut pour ce seul diamètre et ne se transpose pas à un autre réseau","El valor vale para ese único diámetro y no se traslada a otra red"),
k_dust4:L("An expressly declared input value of the example, not a design norm","Явно оголошене вхідне значення прикладу, а не проєктна норма","Ein ausdrücklich erklärter Eingangswert des Beispiels, keine Auslegungsnorm","Een uitdrukkelijk verklaarde invoerwaarde van het voorbeeld, geen ontwerpnorm","Une valeur d'entrée expressément déclarée de l'exemple, non une norme de conception","Un valor de entrada expresamente declarado del ejemplo, no una norma de diseño"),
k_pow:L("Calculated shaft power is not annual energy consumption; real fan curves and efficiency islands come from the manufacturer","Розрахункова потужність не дорівнює річному споживанню енергії; реальні криві вентилятора та острівці ККД беруть у виробника","Die berechnete Leistung ist nicht der Jahresenergieverbrauch; reale Ventilatorkennlinien und Wirkungsgradinseln stammen vom Hersteller","Het berekende vermogen is geen jaarlijks energieverbruik; werkelijke ventilatorcurves en rendementseilanden komen van de fabrikant","La puissance calculée n'est pas la consommation annuelle ; les courbes réelles et les îlots de rendement viennent du constructeur","La potencia calculada no es el consumo anual de energía; las curvas reales y las islas de rendimiento las da el fabricante"),
k_leak1:L("The equivalent opening is best determined by a pressure test, not by measuring gaps","Еквівалентний отвір краще визначати випробуванням на тиск, а не обміром щілин","Die äquivalente Öffnung wird am besten durch eine Druckprüfung bestimmt, nicht durch Ausmessen von Spalten","De equivalente opening wordt het best bepaald met een drukproef, niet door kieren op te meten","L'ouverture équivalente se détermine de préférence par un essai de pression, non par mesure des jeux","La abertura equivalente se determina mejor con un ensayo de presión, no midiendo holguras"),
k_leak2:L("All flows must be referred to one and the same reference density","Усі витрати мають бути віднесені до однієї опорної густини","Alle Volumenströme sind auf ein und dieselbe Bezugsdichte zu beziehen","Alle debieten moeten op één en dezelfde referentiedichtheid worden betrokken","Tous les débits doivent être rapportés à une seule et même masse volumique de référence","Todos los caudales deben referirse a una misma densidad de referencia"),
k_leak3:L("An open door is not a small opening: there the unsteady bidirectional flow and the frequency of use govern","Відчинені двері не є малим отвором: там визначальними стають нестаціонарний двонапрямлений потік і частота користування","Eine offene Tür ist keine kleine Öffnung: dort bestimmen die instationäre bidirektionale Strömung und die Nutzungshäufigkeit","Een open deur is geen kleine opening: daar zijn de instationaire bidirectionele stroming en de gebruiksfrequentie bepalend","Une porte ouverte n'est pas une petite ouverture : le flux bidirectionnel instationnaire et la fréquence d'usage y gouvernent","Una puerta abierta no es una abertura pequeña: allí gobiernan el flujo bidireccional no estacionario y la frecuencia de uso"),
k_leak4:L("A pressure difference is never specified apart from the leakage area and the door schedule","Перепад тиску ніколи не задають окремо від площі нещільностей і режиму користування дверима","Eine Druckdifferenz wird nie losgelöst von Leckfläche und Türnutzung festgelegt","Een drukverschil wordt nooit los van lekoppervlak en deurgebruik vastgelegd","Une différence de pression n'est jamais spécifiée indépendamment de la surface de fuite et de l'usage des portes","Una diferencia de presión nunca se especifica al margen del área de fuga y del uso de puertas"),
k_cit1:L("The calculation does not demonstrate a protection factor: filter leakage, bypass, airlock use and agent carry-over are assessed separately","Розрахунок не доводить коефіцієнта захисту: проскок фільтра, байпас, користування шлюзами та перенесення агента оцінюють окремо","Die Berechnung weist keinen Schutzfaktor nach: Filterdurchlass, Bypass, Schleusennutzung und Stoffverschleppung werden getrennt bewertet","De berekening toont geen beschermingsfactor aan: filterdoorslag, bypass, sluisgebruik en meesleep van het agens worden apart beoordeeld","Le calcul ne démontre pas un facteur de protection : passage du filtre, contournement, usage du sas et entraînement de l'agent sont évalués séparément","El cálculo no demuestra un factor de protección: fuga del filtro, derivación, uso de esclusas y arrastre del agente se evalúan aparte"),
k_cit2:L("Damage can raise the leakage area in a step; a failure and recovery scenario is needed, and real leakage comes from a pressure test","Пошкодження може стрибком збільшити площу нещільностей; потрібен сценарій відмови й відновлення, а реальні нещільності визначає випробування на тиск","Eine Beschädigung kann die Leckfläche sprunghaft vergrößern; ein Ausfall- und Wiederherstellungsszenario ist nötig, reale Leckagen liefert die Druckprüfung","Schade kan het lekoppervlak sprongsgewijs vergroten; een uitval- en herstelscenario is nodig, werkelijke lekken volgen uit een drukproef","Un dommage peut augmenter brusquement la surface de fuite ; un scénario de défaillance et de rétablissement est nécessaire, les fuites réelles viennent d'un essai de pression","Un daño puede aumentar bruscamente el área de fuga; hace falta un escenario de fallo y recuperación, y las fugas reales salen de un ensayo de presión"),
k_inst1:L("The specification states span, accuracy, repeatability, response time, drift, ambient conditions and the calibration method","У специфікації зазначають діапазон, точність, повторюваність, час відгуку, дрейф, умови середовища та метод калібрування","Die Spezifikation nennt Messbereich, Genauigkeit, Wiederholbarkeit, Ansprechzeit, Drift, Umgebungsbedingungen und Kalibrierverfahren","De specificatie noemt meetbereik, nauwkeurigheid, herhaalbaarheid, responstijd, drift, omgevingscondities en kalibratiemethode","La spécification indique l'étendue, l'exactitude, la répétabilité, le temps de réponse, la dérive, les conditions ambiantes et la méthode d'étalonnage","La especificación indica alcance, exactitud, repetibilidad, tiempo de respuesta, deriva, condiciones ambientales y método de calibración"),
k_inst2:L("Uncertainty must not be used to cover an evident shortfall; the acceptance rule is fixed in advance","Невизначеністю не можна прикривати явний дефіцит; правило приймання фіксують заздалегідь","Unsicherheit darf ein offensichtliches Defizit nicht verdecken; die Abnahmeregel wird vorab festgelegt","Onzekerheid mag een duidelijk tekort niet verhullen; de acceptatieregel wordt vooraf vastgelegd","L'incertitude ne doit pas masquer un déficit manifeste ; la règle de réception est fixée à l'avance","La incertidumbre no debe encubrir un déficit evidente; la regla de aceptación se fija de antemano"),
k_stack1:L("Wind can strengthen, weaken or reverse the flow; where source control is critical, hybrid support is needed","Вітер може посилити, послабити або розвернути потік; за критичного контролю джерела потрібна гібридна підтримка","Wind kann die Strömung verstärken, schwächen oder umkehren; bei kritischer Quellenkontrolle ist eine hybride Unterstützung nötig","Wind kan de stroming versterken, verzwakken of omkeren; bij kritische bronbeheersing is hybride ondersteuning nodig","Le vent peut renforcer, affaiblir ou inverser l'écoulement ; si le contrôle à la source est critique, un appui hybride est nécessaire","El viento puede reforzar, debilitar o invertir el flujo; si el control en la fuente es crítico, se necesita apoyo híbrido"),
k_stack2:L("In a stratified hall the extract temperature is not the mean room temperature","У стратифікованому цеху температура витяжного повітря не дорівнює середній температурі приміщення","In einer geschichteten Halle ist die Ablufttemperatur nicht die mittlere Raumtemperatur","In een gelaagde hal is de afzuigtemperatuur niet de gemiddelde ruimtetemperatuur","Dans un hall stratifié, la température d'extraction n'est pas la température moyenne du local","En una nave estratificada la temperatura de extracción no es la temperatura media del local"),
k_tr1:L("An air change rate is not an independent design quantity: it follows from a calculation or from a proven configuration","Кратність повітрообміну не є самостійною проєктною величиною: вона випливає з розрахунку або з випробуваної конфігурації","Ein Luftwechsel ist keine eigenständige Auslegungsgröße: er folgt aus einer Berechnung oder aus einer erprobten Konfiguration","Een luchtwisseling is geen zelfstandige ontwerpgrootheid: zij volgt uit een berekening of uit een beproefde configuratie","Un taux de renouvellement n'est pas une grandeur de conception autonome : il découle d'un calcul ou d'une configuration éprouvée","Una tasa de renovación no es una magnitud de diseño autónoma: se deriva de un cálculo o de una configuración probada"),
k_tr2:L("Several slopes of the decay curve or scatter between measuring points indicate dead zones, short-circuiting or a varying flow; one point does not prove uniformity","Кілька нахилів кривої спаду або розкид між точками вимірювання вказують на мертві зони, коротке замикання потоку чи змінну витрату; одна точка не доводить однорідності","Mehrere Steigungen der Abklingkurve oder Streuung zwischen Messstellen deuten auf Totzonen, Kurzschlussströmung oder wechselnden Volumenstrom hin; ein Punkt beweist keine Gleichmäßigkeit","Meerdere hellingen van de vervalcurve of spreiding tussen meetpunten wijzen op dode zones, kortsluitstroming of wisselend debiet; één punt bewijst geen uniformiteit","Plusieurs pentes de la courbe de décroissance ou une dispersion entre points de mesure signalent des zones mortes, un court-circuit ou un débit variable ; un point ne prouve pas l'uniformité","Varias pendientes de la curva de decaimiento o dispersión entre puntos de medida indican zonas muertas, cortocircuito o caudal variable; un punto no prueba uniformidad"),
k_tr3:L("The material expressly forbids treating this factor as a fixed property of the system","Матеріал прямо забороняє вважати цей коефіцієнт сталою властивістю системи","Das Material verbietet ausdrücklich, diesen Faktor als feste Systemeigenschaft zu behandeln","Het materiaal verbiedt uitdrukkelijk deze factor als vaste systeemeigenschap te behandelen","Le matériau interdit expressément de traiter ce facteur comme une propriété fixe du système","El material prohíbe expresamente tratar este factor como una propiedad fija del sistema"),
k_tr4:L("The model holds only where the decay is approximately exponential","Модель справджується лише там, де спад наближено експоненційний","Das Modell gilt nur dort, wo der Abfall näherungsweise exponentiell ist","Het model geldt alleen waar de daling bij benadering exponentieel is","Le modèle ne vaut que là où la décroissance est approximativement exponentielle","El modelo solo vale donde el descenso es aproximadamente exponencial"),
k_cr1:L("The calculation does not predict a cleanliness class; with unidirectional flow or a dominant local source the full-mixing model does not apply","Розрахунок не передбачає класу чистоти; за однонапрямленого потоку чи домінантного локального джерела модель повного перемішування непридатна","Die Berechnung sagt keine Reinheitsklasse voraus; bei turbulenzarmer Verdrängungsströmung oder dominanter lokaler Quelle gilt das Modell vollständiger Durchmischung nicht","De berekening voorspelt geen reinheidsklasse; bij unidirectionele stroming of een dominante lokale bron geldt het volledig-mengmodel niet","Le calcul ne prédit pas une classe de propreté ; en flux unidirectionnel ou avec une source locale dominante, le modèle de mélange complet ne s'applique pas","El cálculo no predice una clase de limpieza; con flujo unidireccional o una fuente local dominante el modelo de mezcla completa no aplica"),
k_cr2:L("An example value, not a measured property of a particular room","Величина прикладу, а не виміряна характеристика конкретного приміщення","Ein Beispielwert, keine gemessene Eigenschaft eines konkreten Raums","Een voorbeeldwaarde, geen gemeten eigenschap van een concrete ruimte","Une valeur d'exemple, non une propriété mesurée d'un local donné","Un valor de ejemplo, no una propiedad medida de un local concreto"),
k_cr3:L("The measurement method, the sampling points and the occupancy state are fixed separately; the calculation does not replace qualification","Метод вимірювання, точки відбору та стан зайнятості фіксують окремо; розрахунок не замінює кваліфікації","Messverfahren, Probenahmestellen und Belegungszustand werden gesondert festgelegt; die Berechnung ersetzt keine Qualifizierung","Meetmethode, meetpunten en bezettingstoestand worden apart vastgelegd; de berekening vervangt geen kwalificatie","La méthode de mesure, les points de prélèvement et l'état d'occupation sont fixés à part ; le calcul ne remplace pas la qualification","El método de medida, los puntos de muestreo y el estado de ocupación se fijan aparte; el cálculo no sustituye la cualificación"),
k_pu1:L("Continuing evaporation turns the task into a source-and-removal balance; entry is released only on a measurement","Тривале випаровування перетворює задачу на баланс «джерело — видалення»; допуск дають лише за вимірюванням","Fortdauernde Verdunstung macht daraus eine Quellen-Senken-Bilanz; der Zutritt wird nur aufgrund einer Messung freigegeben","Voortdurende verdamping maakt er een bron-en-afvoerbalans van; toegang wordt alleen op een meting vrijgegeven","Une évaporation persistante transforme le problème en bilan source-élimination ; l'accès n'est autorisé que sur mesure","La evaporación continuada convierte el problema en un balance fuente-eliminación; el acceso solo se autoriza mediante medición"),
k_pu2:L("The material requires separate alarm and entry thresholds for flammability, toxicity and measurement uncertainty","Матеріал вимагає окремих порогів тривоги й допуску за горючістю, токсичністю та невизначеністю вимірювання","Das Material verlangt getrennte Alarm- und Zutrittsschwellen für Brennbarkeit, Toxizität und Messunsicherheit","Het materiaal eist aparte alarm- en toegangsdrempels voor brandbaarheid, toxiciteit en meetonzekerheid","Le matériau exige des seuils d'alarme et d'accès distincts pour l'inflammabilité, la toxicité et l'incertitude de mesure","El material exige umbrales de alarma y de acceso separados para inflamabilidad, toxicidad e incertidumbre de medida"),
k_pu3:L("This is a minimum modelled time; the actual release for entry follows a measurement only","Це мінімальний модельний час; фактичний допуск настає лише за вимірюванням","Dies ist eine minimale Modellzeit; die tatsächliche Freigabe erfolgt nur nach einer Messung","Dit is een minimale modeltijd; de werkelijke vrijgave volgt alleen op een meting","Il s'agit d'un temps minimal modélisé ; la libération réelle ne suit qu'une mesure","Es un tiempo mínimo modelado; la liberación real solo sigue a una medición"),
k_dh1:L("An expressly declared input of the example, not a universal outdoor design condition","Явно оголошене вхідне значення прикладу, а не універсальна розрахункова зовнішня умова","Ein ausdrücklich erklärter Eingangswert des Beispiels, keine universelle Außenauslegungsbedingung","Een uitdrukkelijk verklaarde invoerwaarde van het voorbeeld, geen universele buitenontwerpconditie","Une valeur d'entrée expressément déclarée de l'exemple, non une condition extérieure de calcul universelle","Un valor de entrada expresamente declarado del ejemplo, no una condición exterior de cálculo universal"),
k_dh2:L("A real coil has a bypass factor; the calculation with a saturated outlet is idealised","Реальна батарея має байпас-фактор; розрахунок із насиченим виходом ідеалізовано","Ein reales Register hat einen Bypassfaktor; die Rechnung mit gesättigtem Austritt ist idealisiert","Een reëel blok heeft een bypassfactor; de berekening met verzadigde uittrede is geïdealiseerd","Une batterie réelle a un facteur de contournement ; le calcul à sortie saturée est idéalisé","Una batería real tiene factor de derivación; el cálculo con salida saturada está idealizado"),
k_dh3:L("Fan heat, duct losses and condensate subcooling are not included","Теплоту вентилятора, втрати у повітропроводах і переохолодження конденсату не враховано","Ventilatorwärme, Kanalverluste und Kondensatunterkühlung sind nicht enthalten","Ventilatorwarmte, kanaalverliezen en onderkoeling van condensaat zijn niet meegenomen","La chaleur du ventilateur, les pertes de gaine et le sous-refroidissement du condensat ne sont pas inclus","El calor del ventilador, las pérdidas del conducto y el subenfriamiento del condensado no se incluyen"),
k_dh4:L("Fan and casing heat are accounted for separately; the point after the coil is rarely strictly saturated","Теплоту вентилятора й корпусу враховують окремо; точка після батареї рідко буває строго насиченою","Ventilator- und Gehäusewärme werden gesondert erfasst; der Punkt nach dem Register ist selten streng gesättigt","Ventilator- en omkastingswarmte worden apart verrekend; het punt na het blok is zelden strikt verzadigd","La chaleur du ventilateur et du caisson est comptée à part ; le point après la batterie est rarement strictement saturé","El calor del ventilador y de la envolvente se cuenta aparte; el punto tras la batería rara vez está estrictamente saturado"),
k_dry1:L("The material warns that this is not a universal requirement; people, doors, materials and leakage often carry more moisture than the outdoor air","Матеріал попереджає, що це не універсальна вимога; люди, двері, матеріали та нещільності часто несуть більше вологи, ніж зовнішнє повітря","Das Material warnt, dass dies keine universelle Anforderung ist; Menschen, Türen, Materialien und Leckagen bringen oft mehr Feuchte ein als die Außenluft","Het materiaal waarschuwt dat dit geen universele eis is; mensen, deuren, materialen en lekkage brengen vaak meer vocht binnen dan de buitenlucht","Le matériau avertit que ce n'est pas une exigence universelle ; personnes, portes, matériaux et fuites apportent souvent plus d'humidité que l'air extérieur","El material advierte que no es un requisito universal; personas, puertas, materiales y fugas aportan a menudo más humedad que el aire exterior"),
k_fz1:L("A fixed timer can serve only as an upper bound; switching is better driven by pressure difference, dew point and coil temperature","Фіксований таймер може правити лише за верхню межу; перемикання краще вести за перепадом тиску, точкою роси й температурою батареї","Ein fester Zeitgeber kann nur eine Obergrenze sein; die Umschaltung erfolgt besser nach Druckdifferenz, Taupunkt und Registertemperatur","Een vaste timer kan alleen een bovengrens zijn; omschakelen gaat beter op drukverschil, dauwpunt en batterijtemperatuur","Une minuterie fixe ne peut servir que de borne supérieure ; la commutation se pilote mieux par différence de pression, point de rosée et température de batterie","Un temporizador fijo solo puede servir de cota superior; la conmutación se guía mejor por diferencia de presión, punto de rocío y temperatura de batería"),
k_fz2:L("Real defrost energy is higher: coil mass, evaporation and losses to the air are not counted","Реальна енергія відтавання вища: масу батареї, випаровування та втрати в повітря не враховано","Die reale Abtauenergie ist höher: Registermasse, Verdunstung und Verluste an die Luft sind nicht berücksichtigt","De werkelijke ontdooienergie is hoger: batterijmassa, verdamping en verliezen aan de lucht zijn niet meegeteld","L'énergie réelle de dégivrage est plus élevée : masse de la batterie, évaporation et pertes vers l'air ne sont pas comptées","La energía real de desescarche es mayor: masa de la batería, evaporación y pérdidas al aire no se cuentan"),
k_fz3:L("The figure applies to the active battery while the second one is defrosting","Величина стосується активної батареї, тоді як друга перебуває у відтаванні","Der Wert gilt für das aktive Register, während das zweite abgetaut wird","De waarde geldt voor de actieve batterij terwijl de tweede ontdooit","La valeur s'applique à la batterie active pendant que la seconde dégivre","El valor se aplica a la batería activa mientras la segunda desescarcha"),
k_cs1:L("The material warns that this is an assumption, not a general value; measured door use is worth more than a fixed infiltration coefficient","Матеріал попереджає: це припущення, а не універсальна величина; виміряний режим користування дверима цінніший за фіксований коефіцієнт інфільтрації","Das Material warnt, dass dies eine Annahme und kein allgemeiner Wert ist; gemessene Türnutzung ist wertvoller als ein fester Infiltrationsbeiwert","Het materiaal waarschuwt dat dit een aanname is en geen algemene waarde; gemeten deurgebruik is waardevoller dan een vaste infiltratiecoëfficiënt","Le matériau avertit qu'il s'agit d'une hypothèse et non d'une valeur générale ; un usage des portes mesuré vaut mieux qu'un coefficient d'infiltration figé","El material advierte que es una hipótesis y no un valor general; el uso de puertas medido vale más que un coeficiente de infiltración fijo"),
k_cs2:L("A vestibule, a fast door, an air curtain and dry make-up air are judged on the measured reduction they achieve","Тамбур, швидкісні двері, повітряну завісу та сухе компенсувальне повітря оцінюють за виміряним зниженням, якого вони досягають","Windfang, Schnelllauftor, Luftschleier und trockene Zuluft werden an der gemessenen erreichten Minderung beurteilt","Een sluis, een snelloopdeur, een luchtgordijn en droge compensatielucht worden beoordeeld op de gemeten reductie","Un sas, une porte rapide, un rideau d'air et un air de compensation sec se jugent sur la réduction mesurée obtenue","Un vestíbulo, una puerta rápida, una cortina de aire y aire de compensación seco se juzgan por la reducción medida lograda"),
k_cs3:L("Infiltration changes with door size, open time, temperature difference, wind and traffic","Інфільтрація змінюється з розміром дверей, часом відчинення, різницею температур, вітром і трафіком","Die Infiltration ändert sich mit Türgröße, Öffnungszeit, Temperaturdifferenz, Wind und Verkehr","De infiltratie verandert met deurgrootte, openingstijd, temperatuurverschil, wind en verkeer","L'infiltration varie avec la taille de porte, le temps d'ouverture, l'écart de température, le vent et le trafic","La infiltración cambia con el tamaño de puerta, el tiempo de apertura, la diferencia de temperatura, el viento y el tráfico"),
k_cs4:L("The figure belongs to one particular door regime and to the assumed outdoor condition","Величина належить одному конкретному режиму дверей і прийнятій зовнішній умові","Der Wert gehört zu genau einem Türregime und zur angenommenen Außenbedingung","De waarde hoort bij één bepaald deurregime en bij de aangenomen buitenconditie","La valeur correspond à un régime de porte donné et à la condition extérieure supposée","El valor corresponde a un régimen de puerta concreto y a la condición exterior supuesta"),
k_er1:L("Heat leaving with the cooling water or the exhaust gas must not re-enter the room load","Теплота, що йде з охолодною водою чи вихлопом, не повинна повторно потрапляти до навантаження приміщення","Wärme, die mit dem Kühlwasser oder dem Abgas abgeführt wird, darf nicht erneut in die Raumlast eingehen","Warmte die met het koelwater of de uitlaat weggaat, mag niet opnieuw in de ruimtelast terechtkomen","La chaleur évacuée par l'eau de refroidissement ou l'échappement ne doit pas revenir dans la charge du local","El calor que sale con el agua de refrigeración o el escape no debe volver a la carga del local"),
k_er2:L("Air distribution at the engine intakes and hot surfaces matters as much as the total flow","Розподіл повітря біля повітрозабірників двигунів і гарячих поверхонь важить не менше за сумарну витрату","Die Luftverteilung an den Motoransaugungen und heißen Flächen ist ebenso wichtig wie der Gesamtvolumenstrom","De luchtverdeling bij de motoraanzuigingen en hete oppervlakken telt even zwaar als het totale debiet","La distribution d'air aux aspirations moteur et aux surfaces chaudes compte autant que le débit total","La distribución de aire en las tomas del motor y las superficies calientes pesa tanto como el caudal total"),
k_er3:L("An example value; in a project it follows from the engine data and the applicable ship rules","Величина прикладу; у проєкті вона випливає з даних двигунів і застосовних суднових правил","Ein Beispielwert; im Projekt folgt er aus den Motordaten und den anwendbaren Schiffsvorschriften","Een voorbeeldwaarde; in een project volgt zij uit de motorgegevens en de toepasselijke scheepsregels","Une valeur d'exemple ; dans un projet elle découle des données moteur et des règles navires applicables","Un valor de ejemplo; en un proyecto se deriva de los datos del motor y de las reglas de buques aplicables"),
k_bt1:L("Real gassing depends on battery type, charging method, temperature and fault mode; the calculation gives a minimum before spatial and failure corrections","Реальне газоутворення залежить від типу акумулятора, методу заряджання, температури й аварійного режиму; розрахунок дає мінімум до просторових та аварійних поправок","Die reale Gasung hängt von Batterietyp, Ladeverfahren, Temperatur und Störfall ab; die Rechnung liefert ein Minimum vor räumlichen und Störfallkorrekturen","De werkelijke gasvorming hangt af van accutype, laadmethode, temperatuur en storingsmodus; de berekening geeft een minimum vóór ruimtelijke en storingscorrecties","Le dégagement réel dépend du type de batterie, du mode de charge, de la température et du défaut ; le calcul donne un minimum avant corrections spatiales et de défaillance","El gaseo real depende del tipo de batería, el método de carga, la temperatura y el modo de fallo; el cálculo da un mínimo antes de correcciones espaciales y de fallo"),
k_bt2:L("Extraction is distributed above the cells and tied to the charging interlock and the fan monitoring","Відсмоктування розподіляють над елементами і пов'язують із блокуванням заряджання та контролем вентилятора","Die Absaugung wird über den Zellen verteilt und mit der Ladefreigabe und der Ventilatorüberwachung verknüpft","De afzuiging wordt boven de cellen verdeeld en gekoppeld aan de laadvergrendeling en de ventilatorbewaking","L'extraction est répartie au-dessus des éléments et liée au verrouillage de charge et à la surveillance du ventilateur","La extracción se reparte sobre los elementos y se enlaza con el enclavamiento de carga y la supervisión del ventilador"),
k_bt3:L("The material calls this a minimum before corrections for the distribution in the room and for failures","Матеріал називає це мінімумом до поправок на розподіл у приміщенні та на відмови","Das Material nennt dies ein Minimum vor Korrekturen für die Verteilung im Raum und für Ausfälle","Het materiaal noemt dit een minimum vóór correcties voor de verdeling in de ruimte en voor storingen","Le matériau qualifie cela de minimum avant corrections pour la répartition dans le local et pour les défaillances","El material lo califica de mínimo antes de correcciones por la distribución en el local y por fallos"),
k_ca1:L("The design figure is tied to the mission profile and the duration of the emergency mode; the local concentration around people can bind earlier than the volume average","Проєктну величину прив'язують до профілю місії та тривалості аварійного режиму; локальна концентрація навколо людей може стати визначальною раніше за середню по об'єму","Der Auslegungswert ist an das Missionsprofil und die Dauer des Notbetriebs gebunden; die lokale Konzentration um Personen kann früher bindend werden als der Volumenmittelwert","De ontwerpwaarde is gekoppeld aan het missieprofiel en de duur van de noodtoestand; de lokale concentratie rond mensen kan eerder bepalend worden dan het volumegemiddelde","La valeur de conception est liée au profil de mission et à la durée du mode d'urgence ; la concentration locale autour des personnes peut contraindre avant la moyenne du volume","El valor de diseño se ata al perfil de misión y a la duración del modo de emergencia; la concentración local en torno a las personas puede limitar antes que la media del volumen"),
k_ca2:L("The example is declared non-normative; the local concentration around people can become limiting before the volume average","Приклад оголошено ненормативним; локальна концентрація навколо людей може стати обмежувальною раніше за середню по об'єму","Das Beispiel ist als nicht normativ erklärt; die lokale Konzentration um Personen kann vor dem Volumenmittel begrenzend werden","Het voorbeeld is als niet-normatief verklaard; de lokale concentratie rond mensen kan eerder beperkend worden dan het volumegemiddelde","L'exemple est déclaré non normatif ; la concentration locale autour des personnes peut devenir limitante avant la moyenne du volume","El ejemplo se declara no normativo; la concentración local en torno a las personas puede limitar antes que la media del volumen"),
k_ca3:L("Oxygen dosing is bounded against local enrichment; the example is declared non-normative","Дозування кисню обмежують проти локального збагачення; приклад оголошено ненормативним","Die Sauerstoffdosierung wird gegen örtliche Anreicherung begrenzt; das Beispiel ist als nicht normativ erklärt","Zuurstofdosering wordt begrensd tegen lokale verrijking; het voorbeeld is als niet-normatief verklaard","Le dosage d'oxygène est borné contre l'enrichissement local ; l'exemple est déclaré non normatif","La dosificación de oxígeno se acota frente al enriquecimiento local; el ejemplo se declara no normativo"),
k_ca4:L("In this example carbon dioxide binds earlier than oxygen; the system boundary must cover every route of production, storage, leakage and consumption","У цьому прикладі діоксид вуглецю стає визначальним раніше за кисень; межі системи мають охоплювати всі маршрути утворення, зберігання, витоку та споживання","In diesem Beispiel wird Kohlendioxid früher bindend als Sauerstoff; die Systemgrenze muss alle Wege von Erzeugung, Speicherung, Leckage und Verbrauch erfassen","In dit voorbeeld wordt kooldioxide eerder bepalend dan zuurstof; de systeemgrens moet alle routes van productie, opslag, lekkage en verbruik omvatten","Dans cet exemple, le dioxyde de carbone contraint avant l'oxygène ; la frontière du système doit couvrir toutes les voies de production, stockage, fuite et consommation","En este ejemplo el dióxido de carbono limita antes que el oxígeno; la frontera del sistema debe cubrir todas las vías de producción, almacenamiento, fuga y consumo"),
k_ca5:L("Real bypass, sorbent capacity, temperature and moisture are verified separately","Реальний байпас, ємність сорбенту, температуру та вологу перевіряють окремо","Realer Bypass, Sorbenskapazität, Temperatur und Feuchte werden gesondert nachgewiesen","Werkelijke bypass, sorbentcapaciteit, temperatuur en vocht worden apart geverifieerd","Le contournement réel, la capacité du sorbant, la température et l'humidité sont vérifiés séparément","La derivación real, la capacidad del sorbente, la temperatura y la humedad se verifican por separado"),
k_ec1:L("Heat and moisture release are split by activity and by the suit or cabin configuration","Тепло- та вологовиділення розділяють за видами активності та за конфігурацією скафандра чи кабіни","Wärme- und Feuchteabgabe werden nach Tätigkeit und nach Anzug- oder Kabinenkonfiguration aufgeteilt","Warmte- en vochtafgifte worden gesplitst naar activiteit en naar pak- of cabineconfiguratie","Les dégagements de chaleur et d'humidité sont répartis par activité et par configuration combinaison ou cabine","Las emisiones de calor y humedad se separan por actividad y por configuración de traje o cabina"),
k_ec2:L("In microgravity water does not run off by itself: separators, capillary or centrifugal devices are needed","У мікрогравітації вода не стікає сама: потрібні сепаратори, капілярні або відцентрові пристрої","In Mikrogravitation läuft Wasser nicht von selbst ab: Abscheider, Kapillar- oder Zentrifugalgeräte sind erforderlich","In microzwaartekracht loopt water niet vanzelf weg: afscheiders, capillaire of centrifugale voorzieningen zijn nodig","En microgravité l'eau ne s'écoule pas d'elle-même : séparateurs, dispositifs capillaires ou centrifuges sont nécessaires","En microgravedad el agua no escurre sola: hacen falta separadores, dispositivos capilares o centrífugos"),
k_ec3:L("The material warns that this is not a flight design: solar input, Earth view, degradation and peak modes are not included","Матеріал попереджає, що це не льотний проєкт: сонячний приплив, огляд Землі, деградацію та пікові режими не враховано","Das Material warnt, dass dies kein Flugentwurf ist: Solareintrag, Erdsicht, Degradation und Spitzenbetrieb sind nicht enthalten","Het materiaal waarschuwt dat dit geen vluchtontwerp is: zoninstraling, aardzicht, degradatie en piekbedrijf zijn niet meegenomen","Le matériau avertit qu'il ne s'agit pas d'un dimensionnement de vol : apport solaire, vue de la Terre, dégradation et régimes de pointe ne sont pas inclus","El material advierte de que no es un diseño de vuelo: aporte solar, vista de la Tierra, degradación y regímenes pico no se incluyen"),
k_fa1:L("Real fan curves and efficiency islands come from the manufacturer; efficiency is not constant","Реальні криві вентилятора та острівці ККД беруть у виробника; ККД не є сталим","Reale Ventilatorkennlinien und Wirkungsgradinseln stammen vom Hersteller; der Wirkungsgrad ist nicht konstant","Werkelijke ventilatorcurves en rendementseilanden komen van de fabrikant; het rendement is niet constant","Les courbes réelles et les îlots de rendement viennent du constructeur ; le rendement n'est pas constant","Las curvas reales y las islas de rendimiento las da el fabricante; el rendimiento no es constante"),
k_fa2:L("The cube law applies only to similar operating points of one fan in an unchanged system","Кубічний закон застосовний лише до подібних робочих точок одного вентилятора в незміненій мережі","Das kubische Gesetz gilt nur für ähnliche Betriebspunkte eines Ventilators in unveränderter Anlage","De derdemachtswet geldt alleen voor gelijkvormige werkpunten van één ventilator in een ongewijzigd systeem","La loi cubique ne vaut que pour des points de fonctionnement semblables d'un même ventilateur dans un réseau inchangé","La ley cúbica solo vale para puntos de funcionamiento semejantes de un mismo ventilador en una red sin cambios"),
k_fa3:L("After the system is changed by dampers, filters, closed branches, heat exchangers or pressure setpoints, the intersection point has to be found again","Після зміни мережі клапанами, фільтрами, закритими вітками, теплообмінниками чи уставками тиску точку перетину треба знаходити наново","Nachdem die Anlage durch Klappen, Filter, geschlossene Stränge, Wärmeübertrager oder Drucksollwerte verändert wurde, ist der Schnittpunkt neu zu bestimmen","Nadat het systeem is gewijzigd door kleppen, filters, gesloten takken, warmtewisselaars of druksetpoints, moet het snijpunt opnieuw worden bepaald","Après modification du réseau par registres, filtres, branches fermées, échangeurs ou consignes de pression, le point d'intersection doit être recherché à nouveau","Tras modificar la red con compuertas, filtros, ramas cerradas, intercambiadores o consignas de presión, hay que hallar de nuevo el punto de intersección"),
k_fi1:L("The data card calls these didactic example data; for a project the equipment curves are used","Картка даних називає це дидактичними прикладами даних; для проєкту беруть криві обладнання","Die Datenkarte nennt dies didaktische Beispieldaten; für ein Projekt werden die Gerätekennlinien verwendet","De datakaart noemt dit didactische voorbeeldgegevens; voor een project worden de apparaatcurves gebruikt","La fiche de données qualifie ces valeurs de données d'exemple didactiques ; pour un projet on utilise les courbes des équipements","La ficha de datos las califica de datos de ejemplo didácticos; para un proyecto se usan las curvas del equipo"),
k_en1:L("The material does not attribute the figure to legislation in force; the current edition and the national rules are checked with the competent authority","Матеріал не приписує величину чинному законодавству; чинну редакцію та національні правила перевіряють у компетентного органу","Das Material schreibt den Wert nicht der geltenden Gesetzgebung zu; die aktuelle Fassung und die nationalen Regeln werden bei der zuständigen Behörde geprüft","Het materiaal schrijft de waarde niet toe aan geldende wetgeving; de vigerende uitgave en de nationale regels worden bij het bevoegd gezag getoetst","Le matériau n'attribue pas la valeur à la législation en vigueur ; l'édition applicable et les règles nationales se vérifient auprès de l'autorité compétente","El material no atribuye el valor a la legislación vigente; la edición aplicable y las reglas nacionales se comprueban con la autoridad competente"),
kx_n01:L("Settle the contaminant class, the design capture distance, the enclosure geometry and whether a flange or a skirt is fitted","Визначте клас забруднювача, розрахункову відстань захоплення, геометрію укриття та наявність фланця чи обичайки","Legen Sie Schadstoffklasse, Auslegungserfassungsabstand, Einhausungsgeometrie sowie das Vorhandensein von Flansch oder Schürze fest","Leg de verontreinigingsklasse, de ontwerpvangafstand, de omkastingsgeometrie en de aanwezigheid van een flens of schort vast","Fixez la classe de polluant, la distance de captage de calcul, la géométrie de l'enceinte et la présence d'une collerette ou d'une jupe","Determine la clase de contaminante, la distancia de captación de cálculo, la geometría del encerramiento y si hay pestaña o faldón"),
kx_n02:L("Settle the dust characteristics, the network layout and the variable-flow operating modes","Визначте характеристики пилу, схему мережі та режими змінної витрати","Legen Sie die Staubkennwerte, das Netzkonzept und die Betriebsarten mit variablem Volumenstrom fest","Leg de stofeigenschappen, de netopzet en de bedrijfstoestanden met variabel debiet vast","Fixez les caractéristiques de la poussière, l'architecture du réseau et les régimes à débit variable","Determine las características del polvo, el trazado de la red y los regímenes de caudal variable"),
kx_n03:L("Settle the equivalent leakage area by a pressure test, the door opening scenarios and what exactly is protected","Визначте еквівалентну площу нещільностей випробуванням на тиск, сценарії відчинення дверей і те, що саме захищають","Bestimmen Sie die äquivalente Leckfläche durch eine Druckprüfung, die Türöffnungsszenarien und den eigentlichen Schutzgegenstand","Bepaal het equivalente lekoppervlak met een drukproef, de deuropeningsscenario's en wat precies wordt beschermd","Déterminez la surface de fuite équivalente par un essai de pression, les scénarios d'ouverture des portes et l'objet exact de la protection","Determine el área de fuga equivalente mediante ensayo de presión, los escenarios de apertura de puertas y qué se protege exactamente"),
kx_n04:L("Settle the occupancy state used for qualification and the dominant contamination mechanism","Визначте стан зайнятості, за яким проводять кваліфікацію, та домінантний механізм забруднення","Legen Sie den für die Qualifizierung maßgeblichen Belegungszustand und den dominanten Kontaminationsmechanismus fest","Leg de bezettingstoestand voor de kwalificatie en het dominante contaminatiemechanisme vast","Fixez l'état d'occupation retenu pour la qualification et le mécanisme de contamination dominant","Determine el estado de ocupación usado en la cualificación y el mecanismo de contaminación dominante"),
kx_n05:L("Settle the measured outdoor air quality, the particle size that matters for the process and whether in-place testing is required","Визначте виміряну якість зовнішнього повітря, розмір частинок, важливий для процесу, та потребу випробування на місці","Klären Sie die gemessene Außenluftqualität, die für den Prozess maßgebliche Partikelgröße und die Notwendigkeit einer Vor-Ort-Prüfung","Bepaal de gemeten buitenluchtkwaliteit, de voor het proces maatgevende deeltjesgrootte en of beproeving ter plaatse nodig is","Précisez la qualité d'air extérieur mesurée, la taille de particule déterminante pour le procédé et la nécessité d'un essai en place","Determine la calidad medida del aire exterior, el tamaño de partícula relevante para el proceso y si se exige ensayo en obra"),
kx_n06:L("Settle the release assessment, the substance properties and the availability that the ventilation can actually be credited with","Виконайте оцінювання витоків, визначте властивості речовини та доступність, яку справді можна зарахувати вентиляції","Erstellen Sie die Freisetzungsbewertung, klären Sie die Stoffeigenschaften und die Verfügbarkeit, die der Lüftung tatsächlich angerechnet werden kann","Stel de emissiebeoordeling op, bepaal de stofeigenschappen en de beschikbaarheid die de ventilatie werkelijk mag worden toegerekend","Établissez l'évaluation des dégagements, les propriétés de la substance et la disponibilité réellement créditable à la ventilation","Elabore la evaluación de escapes, las propiedades de la sustancia y la disponibilidad realmente acreditable a la ventilación"),
kx_n07:L("Settle the dust explosion characteristics by test, the vessel strength and a safe discharge direction with no personnel access","Визначте вибухові характеристики пилу випробуванням, міцність апарата та безпечний напрям викиду без доступу персоналу","Bestimmen Sie die Staubexplosionskenngrößen durch Prüfung, die Behälterfestigkeit und eine sichere Ausblasrichtung ohne Personenzugang","Bepaal de stofexplosiekentallen door beproeving, de sterkte van het toestel en een veilige uitblaasrichting zonder toegang van personen","Déterminez par essai les caractéristiques d'explosivité, la résistance de l'appareil et une direction de décharge sûre sans accès du personnel","Determine mediante ensayo las características de explosividad, la resistencia del equipo y una dirección de descarga segura sin acceso de personal"),
kx_n08:L("Settle the compartment strategy, which function has priority in fire mode and how the damper is actuated and proven","Визначте стратегію поділу на відсіки, яка функція має пріоритет у пожежному режимі та як клапан спрацьовує і як це доводять","Legen Sie die Abschnittsstrategie fest, welche Funktion im Brandfall Vorrang hat und wie die Klappe ausgelöst und nachgewiesen wird","Leg de compartimenteringsstrategie vast, welke functie voorrang heeft in brandmodus en hoe de klep wordt aangestuurd en aangetoond","Fixez la stratégie de compartimentage, la fonction prioritaire en mode incendie et le mode de commande et de preuve du clapet","Determine la estrategia de sectorización, qué función tiene prioridad en modo incendio y cómo se acciona y demuestra la compuerta"),
kx_n09:L("Settle the protected volume, the enclosure integrity test and the shutdown and damper closure that precede release","Визначте захищуваний об'єм, випробування щільності огородження та зупинення й закриття клапанів, що передують випуску","Klären Sie das geschützte Volumen, die Dichtheitsprüfung der Umschließung sowie Abschaltung und Klappenschluss vor der Auslösung","Bepaal het beschermde volume, de dichtheidsproef van de omhulling en de uitschakeling en klepsluiting vóór de inzet","Précisez le volume protégé, l'essai d'étanchéité de l'enceinte et l'arrêt et la fermeture des clapets avant la décharge","Determine el volumen protegido, el ensayo de estanquidad del recinto y la parada y cierre de compuertas previos a la descarga"),
kx_n10:L("Settle the refrigerant and its safety group, the occupancy category of the served spaces and the room volumes","Визначте холодоагент і його групу безпеки, категорію зайнятості обслуговуваних приміщень та об'єми приміщень","Legen Sie Kältemittel und Sicherheitsgruppe, die Nutzungskategorie der versorgten Räume und die Raumvolumina fest","Leg het koudemiddel en de veiligheidsgroep, de gebruikscategorie van de bediende ruimten en de ruimtevolumes vast","Fixez le fluide et son groupe de sécurité, la catégorie d'occupation des locaux desservis et les volumes des locaux","Determine el refrigerante y su grupo de seguridad, la categoría de ocupación de los locales servidos y los volúmenes"),
kx_n11:L("Settle the battery technology and charging regime, the cell count and whether the charging is interlocked with proven flow","Визначте технологію акумулятора й режим заряджання, кількість елементів і чи заблоковано заряджання за доведеною витратою","Klären Sie Batterietechnologie und Ladeverfahren, die Zellenzahl und ob die Ladung mit nachgewiesenem Volumenstrom verriegelt ist","Bepaal de accutechnologie en het laadregime, het aantal cellen en of het laden is vergrendeld op aangetoond debiet","Précisez la technologie de batterie et le régime de charge, le nombre d'éléments et le verrouillage éventuel de la charge sur débit prouvé","Determine la tecnología de batería y el régimen de carga, el número de elementos y si la carga está enclavada con caudal probado"),
kx_n12:L("Settle the substance inventory, the country whose rules apply and the measurement strategy in real working conditions","Складіть перелік речовин, визначте країну, чиї правила застосовні, та стратегію вимірювання в реальних робочих умовах","Erstellen Sie das Stoffverzeichnis, klären Sie das maßgebliche Land und die Messstrategie unter realen Arbeitsbedingungen","Stel de stoffenlijst op, bepaal het land waarvan de regels gelden en de meetstrategie onder werkelijke werkomstandigheden","Établissez l'inventaire des substances, le pays dont les règles s'appliquent et la stratégie de mesure en conditions réelles","Elabore el inventario de sustancias, el país cuyas reglas aplican y la estrategia de medición en condiciones reales"),
kx_n13:L("Settle the substances and their loads in the stream, the plant category and the immission situation around the site","Визначте речовини та їхні навантаження в потоці, категорію установки та ситуацію з імісією навколо майданчика","Klären Sie Stoffe und Frachten im Strom, die Anlagenkategorie und die Immissionssituation rund um den Standort","Bepaal de stoffen en vrachten in de stroom, de inrichtingscategorie en de immissiesituatie rond de locatie","Précisez les substances et leurs flux, la catégorie d'installation et la situation d'immission autour du site","Determine las sustancias y sus cargas en la corriente, la categoría de instalación y la situación de inmisión del entorno"),
kx_n14:L("Settle the measurement and control uncertainty and map the cold surfaces of the room","Визначте невизначеність вимірювання й регулювання та складіть карту холодних поверхонь приміщення","Bestimmen Sie die Mess- und Regelunsicherheit und kartieren Sie die kalten Flächen des Raums","Bepaal de meet- en regelonzekerheid en breng de koude oppervlakken van de ruimte in kaart","Déterminez l'incertitude de mesure et de régulation et cartographiez les surfaces froides du local","Determine la incertidumbre de medida y control y cartografíe las superficies frías del local"),
kx_n15:L("Settle the source strength, the concentration to be held, the mixing effectiveness and the operating mode","Визначте потужність джерела, потрібну концентрацію, ефективність перемішування та режим роботи","Klären Sie Quellstärke, zu haltende Konzentration, Mischwirksamkeit und Betriebsart","Bepaal de bronsterkte, de te houden concentratie, de mengeffectiviteit en de bedrijfstoestand","Précisez l'intensité de la source, la concentration à tenir, l'efficacité de mélange et le régime","Determine la intensidad de la fuente, la concentración a mantener, la eficacia de mezcla y el régimen"),
kx_n16:L("Settle the coil geometry, the face velocity and the fin spacing with the equipment supplier","Узгодьте з постачальником обладнання геометрію батареї, швидкість у перерізі та крок ламелей","Klären Sie Registergeometrie, Anströmgeschwindigkeit und Lamellenabstand mit dem Gerätelieferanten","Stem blokgeometrie, aanstroomsnelheid en lamelafstand af met de apparatuurleverancier","Précisez avec le fournisseur la géométrie de la batterie, la vitesse frontale et le pas d'ailettes","Acuerde con el suministrador la geometría de la batería, la velocidad frontal y el paso de aletas"),
kx_n17:L("Settle the required dew point, the stage arrangement and where the regeneration air and its burner may be placed","Визначте потрібну точку роси, компонування ступенів і місце розміщення регенераційного повітря та його пальника","Legen Sie den geforderten Taupunkt, die Stufenanordnung sowie den Ort von Regenerationsluft und Brenner fest","Leg het vereiste dauwpunt, de trappenopstelling en de plaats van regeneratielucht en brander vast","Fixez le point de rosée requis, la disposition des étages et l'emplacement de l'air de régénération et de son brûleur","Determine el punto de rocío requerido, la disposición de etapas y dónde se sitúan el aire de regeneración y su quemador"),
kx_n18:L("Settle the equipment inventory, the duty cycle of each item and which part of its heat leaves with a service medium","Складіть перелік обладнання, визначте робочий цикл кожної позиції та яку частину теплоти відводить робоче середовище","Erstellen Sie das Geräteverzeichnis, den Betriebszyklus jedes Geräts und den Wärmeanteil, der mit einem Medium abgeführt wird","Stel de apparatuurlijst op, de bedrijfscyclus van elk toestel en welk deel van de warmte met een medium wegvloeit","Établissez l'inventaire des équipements, le cycle de fonctionnement de chacun et la part de chaleur évacuée par un fluide","Elabore el inventario de equipos, el ciclo de trabajo de cada uno y qué parte del calor sale con un fluido de servicio"),
kx_n19:L("Settle the measured deposit or degradation, the consequence of a silent failure and the acceptance criteria recorded at handover","Визначте виміряні відкладення чи деградацію, наслідки прихованої відмови та критерії приймання, зафіксовані під час передавання","Klären Sie gemessene Ablagerung oder Degradation, die Folge eines unbemerkten Ausfalls und die bei der Übergabe festgehaltenen Abnahmekriterien","Bepaal de gemeten aanslag of degradatie, het gevolg van een onopgemerkte storing en de bij oplevering vastgelegde acceptatiecriteria","Précisez le dépôt ou la dégradation mesurés, la conséquence d'une défaillance silencieuse et les critères de réception consignés","Determine el depósito o la degradación medidos, la consecuencia de un fallo silencioso y los criterios de aceptación registrados"),
kx_n20:L("Settle the consequence of losing the function, the acceptable changeover time and the common-cause failures of the two trains","Визначте наслідки втрати функції, прийнятний час перемикання та відмови із загальної причини для двох ліній","Klären Sie die Folge des Funktionsverlusts, die zulässige Umschaltzeit und die Ausfälle gemeinsamer Ursache beider Stränge","Bepaal het gevolg van functieverlies, de aanvaardbare omschakeltijd en de gemeenschappelijke-oorzaakstoringen van beide strengen","Précisez la conséquence de la perte de fonction, le temps de basculement acceptable et les défaillances de cause commune des deux chaînes","Determine la consecuencia de perder la función, el tiempo de conmutación aceptable y los fallos de causa común de ambas líneas"),
kx_n21:L("Settle the site, the exceedance level you accept and the operating hours the design has to cover","Визначте майданчик, прийнятну забезпеченість і години роботи, які має покрити проєкт","Legen Sie Standort, akzeptierte Überschreitungshäufigkeit und die abzudeckenden Betriebsstunden fest","Leg de locatie, de aanvaarde overschrijdingsfrequentie en de te dekken bedrijfsuren vast","Fixez le site, le niveau de dépassement accepté et les heures de fonctionnement à couvrir","Determine el emplazamiento, el nivel de excedencia aceptado y las horas de funcionamiento a cubrir")};

ex_n04:L("Class limits per particle size, the sampling plan and the rules for classifying and monitoring","Межі класів за розмірами частинок, план відбору та правила класифікації й моніторингу","Klassengrenzen je Partikelgröße, den Probenahmeplan sowie die Regeln für Klassifizierung und Überwachung","Klassengrenzen per deeltjesgrootte, het bemonsteringsplan en de regels voor classificatie en monitoring","Des limites de classe par taille de particule, le plan de prélèvement et les règles de classification et de surveillance","Límites de clase por tamaño de partícula, el plan de muestreo y las reglas de clasificación y monitorización"),

ex_n08:L("Classification of the fire performance, the installation conditions of the penetration and the test evidence required","Класифікацію вогнестійкості, умови монтажу вузла проходження та потрібні докази випробувань","Die Klassifizierung der Brandleistung, die Einbaubedingungen der Durchführung und die geforderten Prüfnachweise","De classificatie van de brandprestatie, de inbouwcondities van de doorvoer en het vereiste beproevingsbewijs","La classification de la performance au feu, les conditions de pose de la traversée et les preuves d'essai exigées","La clasificación del desempeño al fuego, las condiciones de montaje del paso y las pruebas de ensayo exigidas"),
ex_n09:L("An agent concentration and a hold time together with the enclosure integrity that has to be demonstrated","Концентрацію речовини й час утримання разом із щільністю огородження, яку треба довести","Eine Löschmittelkonzentration und eine Haltezeit samt der nachzuweisenden Raumdichtheit","Een middelconcentratie en een standtijd samen met de aan te tonen dichtheid van de omhulling","Une concentration d'agent et un temps de maintien avec l'étanchéité de l'enceinte à démontrer","Una concentración de agente y un tiempo de mantenimiento con la estanquidad del recinto que hay que demostrar"),

{id:"q01",lay:"chapter",c:"rule",s:"assumed",v:"0,50 m/s",tr:"02_outline/HIT_4A_final_v1.0.md:1626",cd:"lev1",wh:"w_lev",ck:"k_lev1",ap:["E1","A1","A4","A5"],ms:["m_source_first","m_leseal","m_torch","m_arm","m_hood_generic","m_greasehood"],su:L("Capture velocity at the assessment point in front of a free extraction opening","Швидкість захоплення в контрольній точці перед вільним витяжним отвором","Erfassungsgeschwindigkeit im Bewertungspunkt vor einer freien Absaugöffnung","Vangsnelheid in het beoordelingspunt voor een vrije afzuigopening","Vitesse de captage au point d'évaluation devant une ouverture d'extraction libre","Velocidad de captación en el punto de evaluación ante una abertura de extracción libre"),sh:L("Sets the local air velocity required at the assessment point; it depends on the distance to the source and on the area of the opening","Задає місцеву швидкість повітря, потрібну в точці оцінювання; залежить від відстані до джерела та площі отвору","Legt die im Bewertungspunkt erforderliche örtliche Luftgeschwindigkeit fest; sie hängt vom Abstand zur Quelle und von der Öffnungsfläche ab","Bepaalt de plaatselijke luchtsnelheid die in het beoordelingspunt nodig is; die hangt af van de afstand tot de bron en van het openingsoppervlak","Fixe la vitesse d'air locale requise au point d'évaluation ; elle dépend de la distance à la source et de la surface d'ouverture","Fija la velocidad local de aire requerida en el punto de evaluación; depende de la distancia a la fuente y del área de la abertura")},
{id:"q02",lay:"chapter",c:"method",s:"assumed",v:"0,672 m³/s (2421 m³/h)",tr:"02_outline/HIT_4A_final_v1.0.md:1636",cd:"lev1",wh:"w_lev",ck:"k_lev2",ap:["A1","E1"],ms:["m_source_first","m_leseal","m_greasehood","m_vesselhood"],su:L("Extract flow that delivers the assumed capture velocity","Витрата витяжки, що забезпечує прийняту швидкість захоплення","Absaugvolumenstrom, der die angenommene Erfassungsgeschwindigkeit liefert","Afzuigdebiet dat de aangenomen vangsnelheid levert","Débit d'extraction assurant la vitesse de captage supposée","Caudal de extracción que aporta la velocidad de captación supuesta"),sh:L("Links the flow to the distance and to the opening area; it grows roughly with the square of the distance","Пов'язує витрату з відстанню та площею отвору; зростає приблизно квадратично з відстанню","Verknüpft den Volumenstrom mit dem Abstand und der Öffnungsfläche; er wächst etwa quadratisch mit dem Abstand","Koppelt het debiet aan de afstand en het openingsoppervlak; het groeit ongeveer kwadratisch met de afstand","Relie le débit à la distance et à la surface d'ouverture ; il croît à peu près comme le carré de la distance","Relaciona el caudal con la distancia y el área de abertura; crece aproximadamente con el cuadrado de la distancia")},
{id:"q03",lay:"chapter",c:"method",s:"assumed",v:"0,260 m³/s (936 m³/h)",tr:"calculations/RC-4A-03-002.md:34",cd:"lev2",wh:"w_lev",ck:"k_lev3",ap:["A1","H2"],ms:["m_hood_generic","m_arm","m_vesselhood","m_hood_hot"],su:L("Extract flow once the hood is brought closer to the source","Витрата витяжки після наближення зонта до джерела","Absaugvolumenstrom, wenn die Haube näher an die Quelle gebracht wird","Afzuigdebiet wanneer de kap dichter bij de bron wordt gebracht","Débit d'extraction lorsque la hotte est rapprochée de la source","Caudal de extracción al acercar la campana a la fuente"),sh:L("Shows how far geometry alone reduces the flow that has to be moved","Показує, наскільки сама лише геометрія зменшує потрібну витрату","Zeigt, wie stark allein die Geometrie den zu bewegenden Volumenstrom senkt","Laat zien hoezeer alleen de geometrie het te verplaatsen debiet verlaagt","Montre à quel point la seule géométrie réduit le débit à déplacer","Muestra cuánto reduce la sola geometría el caudal que hay que mover")},
{id:"q04",lay:"chapter",c:"method",s:"assumed",v:"61,3 %",tr:"calculations/RC-4A-03-002.md:42",cd:"lev2",wh:"w_lev",ck:"k_lev4",ap:["A1","V7","O2"],ms:["m_hood_generic","m_arm","m_peakdesign","m_syscurve","m_anticipate"],su:L("Reduction of the required flow when the hood is moved closer","Зниження потрібної витрати при наближенні зонта","Verringerung des erforderlichen Volumenstroms beim Annähern der Haube","Verlaging van het benodigde debiet bij het dichterbij brengen van de kap","Réduction du débit nécessaire lorsque la hotte est rapprochée","Reducción del caudal necesario al acercar la campana"),sh:L("Puts a figure on what geometry buys compared with fitting a larger fan","Кількісно показує виграш від геометрії порівняно зі встановленням більшого вентилятора","Beziffert den Gewinn durch die Geometrie im Vergleich zu einem größeren Ventilator","Kwantificeert de winst van de geometrie ten opzichte van een grotere ventilator","Chiffre le gain apporté par la géométrie par rapport à un ventilateur plus grand","Cuantifica la ganancia de la geometría frente a instalar un ventilador mayor")},
{id:"q05",lay:"chapter",c:"rule",s:"assumed",v:"0,25 m/s",tr:"calculations/RC-4A-03-002.md:19",cd:"lev3",wh:"w_lev",ck:"k_lev5",ap:["P7","E3"],ms:["m_lowvel","m_highvel","m_makeup_dist","m_lowsupply"],su:L("Room cross-draught at which the simple capture relation loses its validity","Поперечний потік у приміщенні, за якого просте співвідношення захоплення втрачає чинність","Raumquerströmung, bei der die einfache Erfassungsbeziehung ihre Gültigkeit verliert","Dwarsstroom in de ruimte waarbij de eenvoudige vangrelatie haar geldigheid verliest","Courant transversal du local au-delà duquel la relation de captage simple perd sa validité","Corriente transversal del local a partir de la cual la relación simple de captación pierde validez"),sh:L("Bounds the applicability of the capture relation: a cross-draught does not simply add to it","Обмежує застосовність співвідношення захоплення: поперечний потік не додається до нього напряму","Begrenzt die Anwendbarkeit der Erfassungsbeziehung: eine Querströmung addiert sich nicht einfach dazu","Begrenst de toepasbaarheid van de vangrelatie: een dwarsstroom telt er niet zomaar bij op","Borne l'applicabilité de la relation de captage : un courant transversal ne s'y ajoute pas simplement","Acota la aplicabilidad de la relación de captación: una corriente transversal no se suma sin más")},
