 x:L("Buoyancy-driven relief through openings has no guaranteed direction: it reverses with wind, with outdoor temperature and when the process stops. A containment that has to be maintained at all times cannot rest on it.","Природне видалення через прорізи не має гарантованого напрямку: воно перевертається від вітру, від зовнішньої температури і при зупинці процесу. Локалізація, яку треба тримати постійно, не може на ньому ґрунтуватися.","Ein auftriebsgetriebener Abzug über Öffnungen hat keine garantierte Richtung: er kehrt sich mit Wind, Außentemperatur und bei Prozessstillstand um. Eine jederzeit aufrechtzuerhaltende Einhausung kann darauf nicht beruhen.","Een thermisch gedreven afvoer via openingen heeft geen gegarandeerde richting: hij keert om bij wind, bij buitentemperatuur en bij processtilstand. Een insluiting die altijd in stand moet blijven kan daar niet op steunen.","Un tirage par flottabilité à travers des ouvertures n'a pas de direction garantie : il s'inverse avec le vent, la température extérieure et à l'arrêt du procédé. Un confinement à maintenir en permanence ne peut pas reposer dessus.","Un tiro por flotabilidad a través de aberturas no tiene dirección garantizada: se invierte con el viento, con la temperatura exterior y al parar el proceso. Un confinamiento que debe mantenerse en todo momento no puede apoyarse en él.")},
{id:"k21",k:"hard",a:"m_freecool",b:"m_drylimit",
 x:L("Untreated outdoor air is the dominant moisture source for a dry room during most of the year. Free cooling with a large outdoor fraction defeats the very function the dew-point limit represents, and the two cannot be scheduled against the same room.","Необроблене зовнішнє повітря — головне джерело вологи для сухої кімнати протягом більшої частини року. Вільне охолодження з великою зовнішньою часткою нищить саме ту функцію, яку втілює межа точки роси; ці два заходи не можна призначати на одне приміщення.","Unbehandelte Außenluft ist über den größten Teil des Jahres die dominierende Feuchtequelle eines Trockenraums. Freie Kühlung mit großem Außenluftanteil hebt genau die Funktion auf, die die Taupunktgrenze darstellt; beides lässt sich nicht demselben Raum zuordnen.","Onbehandelde buitenlucht is het grootste deel van het jaar de dominante vochtbron van een dryroom. Vrije koeling met een grote buitenluchtfractie ondermijnt precies de functie die de dauwpuntgrens vertegenwoordigt; beide passen niet op dezelfde ruimte.","L'air extérieur non traité est la source d'humidité dominante d'une salle sèche la majeure partie de l'année. Le refroidissement libre à forte fraction d'air neuf annule la fonction même que représente la limite de point de rosée ; les deux ne peuvent viser le même local.","El aire exterior sin tratar es la fuente de humedad dominante de una sala seca la mayor parte del año. El enfriamiento gratuito con gran fracción exterior anula la función que representa el límite de punto de rocío; ambos no pueden aplicarse al mismo local.")},
{id:"k29",k:"hard",a:"m_freecool",b:"m_recirc_dry",
 x:L("The outdoor air fraction cannot be large and small at the same time. Free cooling with a large untreated outdoor fraction and a high recirculation ratio with a small, deeply dried outdoor fraction are two positions of the same damper. Decide in which operating states each of them is allowed and write them down separately.","Частка зовнішнього повітря не може бути водночас великою і малою. Вільне охолодження з великою необробленою часткою і висока рециркуляція з малою глибоко осушеною часткою — це два положення однієї заслінки. Визначте, у яких режимах дозволено кожен з них, і запишіть їх окремо.","Der Außenluftanteil kann nicht gleichzeitig groß und klein sein. Freie Kühlung mit großem unbehandeltem Außenluftanteil und hohe Umluftrate mit kleinem, tief getrocknetem Anteil sind zwei Stellungen derselben Klappe. Legen Sie getrennt fest, in welchen Betriebszuständen jeweils welche gilt.","Het buitenluchtaandeel kan niet tegelijk groot en klein zijn. Vrije koeling met een groot onbehandeld buitenluchtaandeel en een hoge recirculatieverhouding met een klein, diep gedroogd aandeel zijn twee standen van dezelfde klep. Leg apart vast in welke bedrijfstoestanden elk geldt.","La fraction d'air neuf ne peut pas être à la fois grande et petite. Le free cooling avec une grande fraction d'air neuf non traité et un fort taux de recyclage avec une petite fraction profondément séchée sont deux positions du même registre. Définissez séparément les états de fonctionnement où chacun s'applique.","La fracción de aire exterior no puede ser grande y pequeña a la vez. El enfriamiento gratuito con una gran fracción exterior sin tratar y una alta recirculación con una fracción pequeña y profundamente secada son dos posiciones de la misma compuerta. Defina por separado los estados en que rige cada una.")},
{id:"k35",k:"hard",a:"m_nightsetback",b:"m_drylimit",
 x:L("A hard dew-point limit held continuously in the room and fans off or reduced outside production hours describe opposite night behaviour. Moisture keeps entering through the envelope, the doors and the material when the fans are down, and the limit is the first thing lost.","Жорстка межа точки роси, що витримується безперервно, і вимкнені чи знижені вентилятори поза виробничими годинами описують протилежну нічну поведінку. Волога далі надходить через оболонку, двері та матеріал, коли вентилятори стоять, і межа втрачається першою.","Ein hart gehaltener Taupunktgrenzwert im Raum und außerhalb der Produktionszeit abgeschaltete oder reduzierte Ventilatoren beschreiben entgegengesetztes Nachtverhalten. Feuchte dringt weiter über Hülle, Türen und Material ein, wenn die Ventilatoren stehen, und der Grenzwert geht als Erstes verloren.","Een hard dauwpuntlimiet dat continu wordt gehouden en ventilatoren uit of teruggeregeld buiten productietijd beschrijven tegengesteld nachtgedrag. Vocht blijft binnenkomen via schil, deuren en materiaal als de ventilatoren stilstaan, en de limiet gaat als eerste verloren.","Une limite dure de point de rosée tenue en continu et des ventilateurs à l'arrêt ou réduits hors production décrivent des comportements nocturnes opposés. L'humidité continue d'entrer par l'enveloppe, les portes et la matière quand les ventilateurs sont arrêtés, et la limite est la première perdue.","Un límite duro de punto de rocío mantenido de forma continua y ventiladores parados o reducidos fuera de producción describen comportamientos nocturnos opuestos. La humedad sigue entrando por la envolvente, las puertas y el material con los ventiladores parados, y el límite es lo primero que se pierde.")},
{id:"k23",k:"hard",a:"m_nightsetback",b:"m_contdew",
 x:L("The moisture limit follows from the material, not from the working schedule. Hygroscopic material takes up water during the hours when the plant is off, and the first shift is then spent recovering a condition that should never have been lost.","Межа вологості випливає з матеріалу, а не з робочого графіка. Гігроскопічний матеріал набирає воду в години, коли виробництво стоїть, і перша зміна витрачається на відновлення стану, який не мав би бути втрачений.","Die Feuchtegrenze folgt aus dem Material, nicht aus dem Arbeitsplan. Hygroskopisches Material nimmt in den Stillstandsstunden Wasser auf, und die erste Schicht geht dafür drauf, einen Zustand wiederherzustellen, der nie hätte verloren gehen dürfen.","De vochtgrens volgt uit het materiaal, niet uit het werkrooster. Hygroscopisch materiaal neemt water op in de uren dat de fabriek stilstaat, en de eerste ploeg herstelt dan een toestand die nooit verloren had mogen gaan.","La limite d'humidité découle du matériau, pas de l'horaire. Un matériau hygroscopique absorbe de l'eau pendant les heures d'arrêt, et le premier poste sert alors à retrouver un état qui n'aurait jamais dû être perdu.","El límite de humedad se deriva del material, no del horario. El material higroscópico toma agua en las horas de parada, y el primer turno se dedica a recuperar un estado que nunca debió perderse.")},
{id:"k36",k:"hard",a:"m_freecool",b:"m_contdew",
 x:L("Holding the dew point continuously, including non-production hours, does not go together with free cooling on a large untreated outdoor fraction: the outdoor air brings its own moisture as soon as it is more humid than the room target, which in most climates is most of the year.","Безперервне утримання точки роси, зокрема поза виробничими годинами, не поєднується з вільним охолодженням на великій необробленій частці зовнішнього повітря: зовнішнє повітря приносить власну вологу щоразу, коли воно вологіше за цільове значення, а в більшості кліматів це більшу частину року.","Den Taupunkt durchgehend zu halten, auch außerhalb der Produktionszeit, verträgt sich nicht mit freier Kühlung über einen großen unbehandelten Außenluftanteil: die Außenluft bringt ihre eigene Feuchte mit, sobald sie feuchter ist als der Raumsollwert — in den meisten Klimaten den größten Teil des Jahres.","Het dauwpunt continu houden, ook buiten productietijd, gaat niet samen met vrije koeling op een groot onbehandeld buitenluchtaandeel: de buitenlucht brengt haar eigen vocht mee zodra zij vochtiger is dan het ruimtesetpoint, in de meeste klimaten het grootste deel van het jaar.","Tenir le point de rosée en continu, y compris hors production, est incompatible avec un free cooling sur une grande fraction d'air neuf non traité : l'air extérieur apporte sa propre humidité dès qu'il est plus humide que la consigne du local, ce qui, sous la plupart des climats, est le cas la majeure partie de l'année.","Mantener el punto de rocío de forma continua, también fuera de producción, es incompatible con el enfriamiento gratuito sobre una gran fracción exterior sin tratar: el aire exterior aporta su propia humedad en cuanto es más húmedo que la consigna del local, lo que en la mayoría de los climas ocurre casi todo el año.")},
{id:"k38",k:"hard",a:"m_openpurge",b:"m_recirc_dry",
 x:L("A high recirculation ratio with a small deeply dried outdoor fraction and a continuous open outdoor purge through the same enclosure describe opposite air paths. Either the volume is closed and dried, or it is swept with outdoor air; the drying plant is sized for only one of the two.","Висока рециркуляція з малою глибоко осушеною часткою зовнішнього повітря і безперервна відкрита продувка зовнішнім повітрям через ту саму огорожу описують протилежні повітряні тракти. Або об'єм закритий і осушений, або він продувається зовнішнім повітрям; осушувальну установку розраховано лише на щось одне.","Hohe Umluftrate mit kleinem, tief getrocknetem Außenluftanteil und eine dauernde offene Außenluftspülung durch dieselbe Einhausung beschreiben entgegengesetzte Luftwege. Entweder ist das Volumen geschlossen und getrocknet, oder es wird mit Außenluft gespült; die Trocknungsanlage ist nur für eines von beiden ausgelegt.","Een hoge recirculatieverhouding met een klein, diep gedroogd buitenluchtaandeel en een continue open buitenluchtspoeling door dezelfde omkasting beschrijven tegengestelde luchtwegen. Ofwel is het volume gesloten en gedroogd, ofwel wordt het met buitenlucht doorgespoeld; de drooginstallatie is maar op één van beide gedimensioneerd.","Un fort taux de recyclage avec une petite fraction d'air neuf profondément séchée et un balayage extérieur continu à travers la même enceinte décrivent des circuits d'air opposés. Soit le volume est fermé et séché, soit il est balayé à l'air extérieur ; l'installation de séchage n'est dimensionnée que pour l'un des deux.","Una alta recirculación con una pequeña fracción exterior profundamente secada y un barrido exterior continuo por la misma envolvente describen circuitos de aire opuestos. O el volumen está cerrado y secado, o se barre con aire exterior; la planta de secado está dimensionada solo para uno de los dos.")},
{id:"k37",k:"hard",a:"m_openpurge",b:"m_drylimit",
 x:L("A continuous open purge with outdoor air through the enclosure and a hard dew-point limit in the same volume cannot both hold: the purge replaces the treated air with untreated outdoor air at exactly the flow rate it is sized for.","Безперервна відкрита продувка зовнішнім повітрям через огорожу і жорстка межа точки роси в тому самому об'ємі не можуть виконуватися одночасно: продувка замінює оброблене повітря необробленим зовнішнім саме з тією витратою, на яку її розраховано.","Eine dauernde offene Spülung mit Außenluft durch die Einhausung und ein harter Taupunktgrenzwert im selben Volumen sind nicht gleichzeitig haltbar: die Spülung ersetzt die aufbereitete Luft genau mit dem Volumenstrom, für den sie ausgelegt ist, durch unbehandelte Außenluft.","Een continue open spoeling met buitenlucht door de omkasting en een hard dauwpuntlimiet in hetzelfde volume kunnen niet allebei gelden: de spoeling vervangt de behandelde lucht door onbehandelde buitenlucht met precies het debiet waarop zij is gedimensioneerd.","Un balayage ouvert continu à l'air extérieur à travers l'enceinte et une limite dure de point de rosée dans le même volume ne peuvent pas tenir ensemble : le balayage remplace l'air traité par de l'air extérieur non traité au débit même pour lequel il est dimensionné.","Un barrido abierto continuo con aire exterior a través de la envolvente y un límite duro de punto de rocío en el mismo volumen no pueden cumplirse a la vez: el barrido sustituye el aire tratado por aire exterior sin tratar justo al caudal para el que está dimensionado.")},
{id:"k09",k:"hard",a:"m_desicc_hot",b:"m_tempcap",
 x:L("Regeneration air and burner surfaces of a high-temperature desiccant rotor exceed the maximum surface temperature the zone allows, whether that limit comes from a temperature class or from the product. Either the regeneration section moves outside the limited zone, or another drying principle is chosen.","Регенераційне повітря та поверхні пальника високотемпературного адсорбційного ротора перевищують максимальну температуру поверхонь, дозволену в зоні, — чи то за температурним класом, чи то за вимогою продукту. Або секція регенерації виноситься за межі зони, або обирається інший принцип осушення.","Regenerationsluft und Brenneroberflächen eines Hochtemperatur-Sorptionsrotors überschreiten die in der Zone zulässige Höchsttemperatur, gleich ob diese aus einer Temperaturklasse oder aus dem Produkt folgt. Entweder wandert die Regeneration aus der begrenzten Zone, oder ein anderes Trocknungsprinzip wird gewählt.","Regeneratielucht en brandersoppervlakken van een hoge-temperatuur adsorptierotor overschrijden de maximaal toegestane oppervlaktetemperatuur in de zone, of die nu uit een temperatuurklasse of uit het product volgt. Óf de regeneratie gaat buiten de begrensde zone, óf er wordt een ander droogprincipe gekozen.","L'air de régénération et les surfaces du brûleur d'une roue dessiccante haute température dépassent la température de surface maximale admise dans la zone, que cette limite vienne d'une classe de température ou du produit. Soit la régénération sort de la zone limitée, soit un autre principe de séchage est retenu.","El aire de regeneración y las superficies del quemador de un rotor desecante de alta temperatura superan la temperatura superficial máxima admitida en la zona, ya venga ese límite de una clase de temperatura o del producto. O la regeneración sale de la zona limitada, o se elige otro principio de secado.")},
{id:"k30",k:"hard",a:"m_desicc_hot",b:"m_zone_dust",
 x:L("High-temperature regeneration means burner surfaces and hot regeneration air inside the space. Placed inside a classified combustible-dust zone that is an ignition source in the very zone it is meant to serve. The regeneration side belongs outside the classified zone, with its own air path and its own discharge.","Високотемпературна регенерація означає поверхні пальника і гаряче регенераційне повітря всередині приміщення. Розміщені в класифікованій зоні горючого пилу, вони є джерелом займання саме в тій зоні, яку мають обслуговувати. Регенераційна частина має бути поза класифікованою зоною, з власним повітряним трактом і власним викидом.","Hochtemperaturregeneration bedeutet Brenneroberflächen und heiße Regenerationsluft im Raum. In einer eingestuften Staubzone ist das eine Zündquelle genau in der Zone, die versorgt werden soll. Die Regenerationsseite gehört außerhalb der eingestuften Zone, mit eigenem Luftweg und eigener Fortluft.","Hoge-temperatuurregeneratie betekent brandersoppervlakken en hete regeneratielucht in de ruimte. In een ingedeelde stofzone is dat een ontstekingsbron in juist de zone die bediend moet worden. De regeneratiezijde hoort buiten de ingedeelde zone, met een eigen luchtweg en eigen afvoer.","Une régénération à haute température signifie des surfaces de brûleur et de l'air chaud de régénération dans le local. Dans une zone poussière classée, c'est une source d'inflammation dans la zone même à desservir. Le côté régénération se place hors zone classée, avec son propre circuit d'air et son propre rejet.","La regeneración a alta temperatura implica superficies de quemador y aire caliente de regeneración dentro del local. En una zona de polvo clasificada eso es una fuente de ignición en la misma zona que debe servir. El lado de regeneración va fuera de la zona clasificada, con su propio circuito de aire y su propia descarga.")},
{id:"k02",k:"hard",a:"m_hrw_wheel",b:"m_confine_neg",
 x:L("A rotary wheel transfers mass as well as heat: carry-over in the matrix and casing leakage create a path from the extract side to the supply side. A confinement whose entire purpose is that nothing crosses from the contaminated side requires a recovery device without mass transfer.","Роторний теплообмінник переносить не лише теплоту, а й масу: винесення в насадці та нещільності корпусу створюють шлях з витяжного боку на припливний. Утримання, увесь сенс якого — щоб нічого не переходило з брудного боку, потребує рекуперації без масообміну.","Ein Rotationsrad überträgt neben Wärme auch Masse: Übertrag in der Speichermasse und Gehäuseleckage schaffen einen Weg von der Ab- zur Zuluftseite. Ein Einschluss, dessen ganzer Zweck ist, dass nichts von der kontaminierten Seite übertritt, braucht eine Rückgewinnung ohne Stoffübertragung.","Een roterend wiel draagt naast warmte ook massa over: carry-over in de massa en lekkage van de kast vormen een pad van afvoer naar toevoer. Een insluiting die juist bedoeld is om overgang vanaf de vuile zijde uit te sluiten, vereist terugwinning zonder massaoverdracht.","Une roue rotative transfère de la masse autant que de la chaleur : l'entraînement dans la matrice et les fuites du caisson créent un chemin de l'extraction vers le soufflage. Un confinement dont tout l'objet est qu'aucun transfert n'ait lieu exige une récupération sans transfert de masse.","Una rueda rotativa transfiere masa además de calor: el arrastre en la matriz y las fugas de la envolvente crean un camino de la extracción a la impulsión. Un confinamiento cuyo único fin es que nada pase desde el lado contaminado exige recuperación sin transferencia de masa.")},
{id:"k28",k:"hard",a:"m_hrw_wheel",b:"m_toxic_once",
 x:L("A rotary wheel is a mass-transfer path from the extract back into the supply. If a stream has been declared hazardous and routed once-through to treatment, a wheel on that same stream returns part of it to the room and cancels the declaration. Recovery on such a stream is made with a plate exchanger or a run-around circuit instead.","Роторний рекуператор — це шлях масопереносу з витяжки назад у приплив. Якщо потік визнано небезпечним і скеровано прямоточно на очищення, ротор на цьому ж потоці повертає частину його в приміщення і скасовує це рішення. Рекуперацію на такому потоці роблять пластинчастим апаратом або проміжним контуром.","Ein Rotationswärmeübertrager ist ein Stoffübertragungsweg von der Abluft zurück in die Zuluft. Ist ein Strom als gefährlich eingestuft und im Einweg zur Behandlung geführt, holt ein Rad in genau diesem Strom einen Teil davon in den Raum zurück und hebt die Einstufung auf. Die Rückgewinnung erfolgt hier über einen Plattenwärmeübertrager oder einen Kreislaufverbund.","Een warmtewiel is een stofoverdrachtspad van de afvoer terug naar de toevoer. Is een stroom als gevaarlijk aangemerkt en in enkele doorgang naar behandeling geleid, dan haalt een wiel in diezelfde stroom een deel ervan terug de ruimte in en heft de aanmerking op. Terugwinning gebeurt hier met een platenwisselaar of een twin-coilkring.","Une roue rotative est un chemin de transfert de masse de l'extraction vers le soufflage. Si un flux est déclaré dangereux et dirigé en simple passage vers le traitement, une roue sur ce même flux en ramène une partie dans le local et annule la déclaration. La récupération se fait alors par échangeur à plaques ou boucle à eau glycolée.","Una rueda rotativa es un camino de transferencia de masa de la extracción al impulso. Si un flujo se ha declarado peligroso y se conduce en paso único a tratamiento, una rueda en ese mismo flujo devuelve parte al local y anula la declaración. La recuperación se hace entonces con intercambiador de placas o circuito de agua.")},
{id:"k16",k:"hard",a:"m_diluteonly",b:"m_source_first",
 x:L("The two statements name different primary barriers for the same release. In the hierarchy of control a source that can be enclosed or captured must be, and general dilution is at most the secondary layer; the design basis has to say which one carries the duty.","Ці два твердження називають різні первинні бар'єри для одного й того самого виділення. За ієрархією заходів джерело, яке можна закрити або вловити, має бути закрите чи вловлене, а загальне розбавлення — щонайбільше вторинний шар; проєктна основа має вказати, що саме несе функцію.","Beide Aussagen benennen unterschiedliche primäre Barrieren für dieselbe Freisetzung. In der Maßnahmenhierarchie muss eine kapselbare oder erfassbare Quelle gekapselt bzw. erfasst werden; allgemeine Verdünnung ist höchstens die zweite Schicht. Die Auslegungsgrundlage muss die Zuständigkeit benennen.","Beide uitspraken benoemen verschillende primaire barrières voor dezelfde emissie. In de beheershiërarchie moet een bron die ingekapseld of afgezogen kan worden dat ook zijn; algemene verdunning is hoogstens de tweede laag. De ontwerpbasis moet aangeven wie de taak draagt.","Les deux énoncés désignent des barrières primaires différentes pour le même dégagement. Dans la hiérarchie des mesures, une source encoffrable ou captable doit l'être ; la dilution générale n'est au mieux que la couche secondaire. La base de conception doit dire laquelle porte la fonction.","Ambos enunciados designan barreras primarias distintas para la misma emisión. En la jerarquía de control, una fuente encapsulable o captable debe serlo; la dilución general es a lo sumo la capa secundaria. La base de diseño debe indicar cuál asume la función.")},
{id:"k31",k:"hard",a:"m_diluteonly",b:"m_closedtransfer",
 x:L("General dilution as the primary control contradicts closed transfer with local capture. The hierarchy of control puts containment and capture at source above dilution, so dilution cannot be the primary measure while a closed transfer is claimed for the same release.","Загальне розбавлення як основний захід суперечить закритому перевантаженню з місцевим уловлюванням. Ієрархія заходів ставить герметизацію і вловлювання біля джерела вище за розбавлення, тож розбавлення не може бути основним, поки для того самого виділення заявлено закрите перевантаження.","Allgemeine Verdünnung als primäre Beherrschung widerspricht dem geschlossenen Umfüllen mit örtlicher Erfassung. Die Rangfolge stellt Einhausung und Erfassung an der Quelle über die Verdünnung; Verdünnung kann daher nicht die Primärmaßnahme sein, wenn für dieselbe Freisetzung geschlossene Übergabe angegeben wird.","Algemene verdunning als primaire beheersing spreekt gesloten overdracht met lokale afzuiging tegen. De beheersingshiërarchie zet insluiting en afzuiging aan de bron boven verdunning; verdunning kan dus niet de primaire maatregel zijn terwijl voor dezelfde vrijzetting gesloten overdracht wordt geclaimd.","La dilution générale comme moyen principal contredit le transfert fermé avec captage local. La hiérarchie des mesures place le confinement et le captage à la source au-dessus de la dilution ; la dilution ne peut donc pas être la mesure principale si un transfert fermé est revendiqué pour le même dégagement.","La dilución general como control primario contradice el trasvase cerrado con captación local. La jerarquía de control sitúa el confinamiento y la captación en origen por encima de la dilución; la dilución no puede ser la medida principal si para la misma emisión se declara trasvase cerrado.")},
{id:"k32",k:"hard",a:"m_diluteonly",b:"m_leseal",
 x:L("Enclosing the transfer point and extracting at the source is a source measure; making general dilution the primary control says the opposite about the same release. Only one of the two can be the primary barrier, and the assessment has to name which.","Герметизація точки перевантаження з відсмоктуванням біля джерела — це захід на джерелі; оголошення загального розбавлення основним заходом стверджує протилежне щодо того самого виділення. Основним бар'єром може бути лише щось одне, і оцінка має вказати, що саме.","Das Einhausen der Übergabestelle mit Absaugung an der Quelle ist eine Quellenmaßnahme; allgemeine Verdünnung als Primärmaßnahme behauptet für dieselbe Freisetzung das Gegenteil. Nur eines von beiden kann die primäre Barriere sein, und die Beurteilung muss sagen, welches.","Het omkasten van het overstortpunt met afzuiging aan de bron is een bronmaatregel; algemene verdunning als primaire beheersing beweert voor dezelfde vrijzetting het tegendeel. Slechts één van beide kan de primaire barrière zijn, en de beoordeling moet zeggen welke.","Enfermer le point de transfert et capter à la source est une mesure à la source ; faire de la dilution générale la mesure principale affirme l'inverse pour le même dégagement. Une seule des deux peut être la barrière primaire, et l'évaluation doit dire laquelle.","Encerrar el punto de trasvase y captar en origen es una medida en la fuente; hacer de la dilución general el control primario afirma lo contrario para la misma emisión. Solo una de las dos puede ser la barrera primaria, y la evaluación debe decir cuál.")},
{id:"k33",k:"hard",a:"m_pushpull",b:"m_lowvel",
 x:L("A push-pull jet across the surface creates at the bath or at the product exactly the high mass transfer that a velocity limit over an open bath or open product is meant to prevent. Either the surface tolerates the jet, or the velocity limit governs and the capture has to be built differently.","Струмінь «push-pull» над поверхнею створює біля ванни чи продукту саме той інтенсивний масообмін, якому має запобігати обмеження швидкості над відкритою ванною чи відкритим продуктом. Або поверхня витримує струмінь, або діє обмеження швидкості й уловлювання будують інакше.","Ein Push-Pull-Strahl über der Oberfläche erzeugt am Bad oder am Produkt genau den hohen Stoffübergang, den eine Geschwindigkeitsbegrenzung über offenem Bad oder offenem Produkt verhindern soll. Entweder verträgt die Oberfläche den Strahl, oder die Begrenzung gilt und die Erfassung wird anders gebaut.","Een push-pullstraal over het oppervlak geeft aan het bad of het product juist de hoge stofoverdracht die een snelheidsbegrenzing boven open bad of open product moet voorkomen. Ofwel verdraagt het oppervlak de straal, ofwel geldt de begrenzing en wordt de afzuiging anders opgezet.","Un jet push-pull au-dessus de la surface crée au bain ou au produit précisément le transfert de masse élevé qu'une limitation de vitesse au-dessus d'un bain ou d'un produit ouvert doit empêcher. Soit la surface supporte le jet, soit la limitation prime et le captage se conçoit autrement.","Un chorro push-pull sobre la superficie genera en el baño o el producto justo la alta transferencia de masa que una limitación de velocidad sobre baño o producto abierto pretende evitar. O la superficie tolera el chorro, o rige la limitación y la captación se construye de otro modo.")},
{id:"k34",k:"hard",a:"m_smokeextract",b:"m_confine_neg",
 x:L("Smoke extraction with large make-up openings destroys the pressure cascade that keeps the contamination inside its confinement. Where the confinement is a licensed safety function, the fire concept is built around it — with filtered smoke paths and a stated priority — and not against it.","Димовидалення з великими прорізами для припливу руйнує каскад тисків, який утримує забруднення в межах локалізації. Там, де локалізація є ліцензованою функцією безпеки, протипожежну концепцію будують навколо неї — з фільтрованими шляхами диму і встановленим пріоритетом, — а не всупереч їй.","Eine Rauchabführung mit großen Nachströmöffnungen zerstört die Druckkaskade, die die Kontamination im Einschluss hält. Wo der Einschluss eine genehmigte Sicherheitsfunktion ist, wird das Brandkonzept um ihn herum gebaut — mit gefilterten Rauchwegen und festgelegtem Vorrang — und nicht gegen ihn.","Rookafvoer met grote toevoeropeningen vernietigt de drukcascade die de besmetting binnen de insluiting houdt. Waar de insluiting een vergunde veiligheidsfunctie is, wordt het brandconcept eromheen gebouwd — met gefilterde rookwegen en een vastgelegde voorrang — en niet ertegenin.","Un désenfumage à grandes amenées d'air détruit la cascade de pression qui maintient la contamination dans son confinement. Là où le confinement est une fonction de sûreté autorisée, le concept incendie se construit autour de lui — chemins de fumée filtrés et priorité énoncée — et non contre lui.","La extracción de humos con grandes aberturas de reposición destruye la cascada de presión que mantiene la contaminación dentro del confinamiento. Donde el confinamiento es una función de seguridad autorizada, el concepto de incendio se construye en torno a él — con rutas de humo filtradas y prioridad declarada — y no contra él.")},
{id:"k05",k:"hard",a:"m_firestop",b:"m_pressmaint",
 x:L("Stopping the fans removes the very pressure that keeps the barrier standing. If a zone has to remain pressurised during a fire, the fire mode must state which fans keep running, on which power supply, where their air comes from and what happens to the smoke they push.","Зупинка вентиляторів знімає саме той тиск, який тримає бар'єр. Якщо зона має лишатися під підпором під час пожежі, пожежний режим повинен визначити, які вентилятори працюють, від якого живлення, звідки беруть повітря і що стається з димом, який вони штовхають.","Das Abschalten der Ventilatoren nimmt genau den Druck weg, der die Barriere trägt. Muss eine Zone im Brandfall unter Druck bleiben, hat der Brandfall festzulegen, welche Ventilatoren weiterlaufen, an welcher Einspeisung, woher ihre Luft kommt und was mit dem geschobenen Rauch geschieht.","Het stoppen van de ventilatoren neemt juist de druk weg die de barrière overeind houdt. Moet een zone bij brand op druk blijven, dan legt de brandmodus vast welke ventilatoren doordraaien, op welke voeding, waar hun lucht vandaan komt en wat er met de geduwde rook gebeurt.","Arrêter les ventilateurs supprime précisément la pression qui tient la barrière. Si une zone doit rester en surpression pendant l'incendie, le mode incendie doit préciser quels ventilateurs continuent, sur quelle alimentation, d'où vient leur air et ce que devient la fumée poussée.","Parar los ventiladores elimina justamente la presión que sostiene la barrera. Si una zona debe seguir presurizada durante el incendio, el modo incendio debe indicar qué ventiladores siguen, con qué alimentación, de dónde toman el aire y qué ocurre con el humo que empujan.")},
{id:"k26",k:"hard",a:"m_contvent",b:"m_shutdown_ext",
 x:L("A ventilation that cannot be stopped and an automatic shutdown with damper closure before the extinguishing release are direct opposites in the same space. If the extinguishing concept needs a closed, evacuated volume, the ventilation is not a continuously running function; if it must run continuously, another extinguishing principle has to be chosen.","Вентиляція, яку не можна зупиняти, і автоматичний останов із закриттям клапанів перед випуском вогнегасної речовини — прямі протилежності в одному приміщенні. Якщо концепція гасіння потребує закритого евакуйованого об'єму, вентиляція не є безперервною функцією; якщо вона має працювати безперервно, треба обрати інший принцип гасіння.","Eine Lüftung, die nicht gestoppt werden darf, und eine automatische Abschaltung mit Klappenschluss vor der Löschmittelfreigabe sind im selben Raum direkte Gegensätze. Verlangt das Löschkonzept ein geschlossenes, geräumtes Volumen, ist die Lüftung keine dauernd laufende Funktion; muss sie dauernd laufen, ist ein anderes Löschprinzip zu wählen.","Een ventilatie die niet stilgezet mag worden en een automatische uitschakeling met klepsluiting vóór de blusmiddelvrijgave zijn in dezelfde ruimte directe tegenpolen. Vraagt het blusconcept een gesloten, ontruimd volume, dan is de ventilatie geen continu draaiende functie; moet zij continu draaien, dan is een ander blusprincipe nodig.","Une ventilation qui ne peut pas être arrêtée et un arrêt automatique avec fermeture des registres avant la décharge de l'agent extincteur sont des contraires directs dans le même local. Si le concept d'extinction exige un volume fermé et évacué, la ventilation n'est pas une fonction continue ; si elle doit l'être, il faut un autre principe d'extinction.","Una ventilación que no puede pararse y una parada automática con cierre de compuertas antes de la descarga del agente extintor son opuestos directos en el mismo local. Si el concepto de extinción exige un volumen cerrado y evacuado, la ventilación no es una función continua; si debe serlo, hay que elegir otro principio de extinción.")},
{id:"k27",k:"hard",a:"m_contvent",b:"m_firestop",
 x:L("A ventilation declared uninterruptible cannot at the same time be switched off by the fire mode. One of the two statements has to give way, and which one is a question of priority between a safety function and the fire strategy, settled before the cause-and-effect matrix is written.","Вентиляцію, оголошену безперервною, не можна водночас вимикати пожежним режимом. Одне з двох тверджень має поступитися, а яке саме — це питання пріоритету між функцією безпеки і протипожежною стратегією, що вирішується до складання матриці причин і наслідків.","Eine als unterbrechungsfrei erklärte Lüftung kann nicht zugleich durch den Brandfall abgeschaltet werden. Eine der beiden Aussagen muss weichen; welche, ist eine Frage des Vorrangs zwischen Sicherheitsfunktion und Brandstrategie und wird vor der Ursache-Wirkungs-Matrix entschieden.","Een als ononderbreekbaar verklaarde ventilatie kan niet tegelijk door de brandstand worden uitgeschakeld. Eén van beide uitspraken moet wijken; welke, is een kwestie van voorrang tussen veiligheidsfunctie en brandstrategie, te beslissen vóór de oorzaak-gevolgmatrix.","Une ventilation déclarée ininterruptible ne peut pas être en même temps coupée par le mode incendie. L'un des deux énoncés doit céder ; lequel relève de la priorité entre fonction de sécurité et stratégie incendie, tranchée avant la matrice cause-effet.","Una ventilación declarada ininterrumpible no puede a la vez ser cortada por el modo incendio. Uno de los dos enunciados debe ceder; cuál es cuestión de prioridad entre función de seguridad y estrategia de incendio, decidida antes de la matriz causa-efecto.")},
{id:"k17",k:"hard",a:"m_singletrain",b:"m_contfunc",
 x:L("A function that must never be interrupted needs availability, not only a design flow rate. With a single train, every filter change, every belt and every motor failure becomes an interruption of the safety function, and the safe state has to be declared for each of them.","Функція, яку не можна переривати, потребує доступності, а не лише проєктної витрати. За однієї лінії кожна заміна фільтра, кожен пас і кожна відмова двигуна стає перериванням функції безпеки, і для кожного випадку треба оголосити безпечний стан.","Eine Funktion, die nie ausfallen darf, braucht Verfügbarkeit, nicht nur einen Auslegungsvolumenstrom. Bei einem einzigen Strang wird jeder Filterwechsel, jeder Riemen und jeder Motorausfall zur Unterbrechung der Sicherheitsfunktion; für jeden Fall ist der sichere Zustand zu benennen.","Een functie die nooit mag stoppen heeft beschikbaarheid nodig, niet alleen een ontwerpdebiet. Met één trein wordt elke filterwissel, elke riem en elke motorstoring een onderbreking van de veiligheidsfunctie; voor elk daarvan moet de veilige toestand zijn vastgelegd.","Une fonction qui ne doit jamais s'interrompre exige de la disponibilité, pas seulement un débit de conception. Avec une seule file, chaque changement de filtre, chaque courroie et chaque panne moteur interrompt la fonction de sûreté ; l'état sûr doit être défini pour chacun.","Una función que nunca debe interrumpirse exige disponibilidad, no solo un caudal de diseño. Con un solo tren, cada cambio de filtro, cada correa y cada fallo de motor interrumpe la función de seguridad; hay que declarar el estado seguro para cada caso.")},
{id:"k40",k:"hard",a:"m_return_collector",b:"m_toxic_once",
 x:L("Returning the cleaned collector air to the workroom and routing the captured stream once-through to treatment are two answers for the same substance. If the substance justifies once-through discharge, the collector outlet belongs to that same stream and cannot be returned.","Повернення очищеного повітря фільтра в робоче приміщення і прямоточне скерування вловленого потоку на очищення — це дві різні відповіді щодо однієї речовини. Якщо речовина виправдовує прямоточний викид, вихід фільтра належить до того самого потоку і поверненню не підлягає.","Die gereinigte Abscheiderluft in den Arbeitsraum zurückzuführen und den erfassten Strom im Einweg zur Behandlung zu leiten sind zwei Antworten auf denselben Stoff. Rechtfertigt der Stoff die Einwegableitung, gehört der Abscheiderauslass zu genau diesem Strom und darf nicht zurückgeführt werden.","De gereinigde afscheiderlucht terugvoeren naar de werkruimte en de afgevangen stroom in enkele doorgang naar behandeling leiden zijn twee antwoorden op dezelfde stof. Rechtvaardigt de stof enkelvoudige afvoer, dan hoort de afscheideruitlaat bij diezelfde stroom en mag hij niet worden teruggevoerd.","Renvoyer l'air épuré du dépoussiéreur dans l'atelier et diriger le flux capté en simple passage vers le traitement sont deux réponses pour la même substance. Si la substance justifie le rejet en simple passage, la sortie du dépoussiéreur appartient à ce même flux et ne peut pas être renvoyée.","Devolver el aire depurado del colector al taller y conducir el flujo captado en paso único a tratamiento son dos respuestas para la misma sustancia. Si la sustancia justifica la descarga en paso único, la salida del colector pertenece a ese mismo flujo y no puede devolverse.")},
{id:"k24",k:"hard",a:"m_firestop",b:"m_smokeextract",
 x:L("Stopping the supply and extract fans in fire mode and running a dedicated smoke extraction with large make-up openings are two different fire strategies for the same compartment. One takes the air movement away, the other creates it on purpose; a compartment is built for one of them, not for both at once. Which one applies follows from the fire safety concept, not from the ventilation design.","Зупинка припливних і витяжних вентиляторів у пожежному режимі та виділене димовидалення з великими прорізами для припливу — це дві різні протипожежні стратегії для одного відсіку. Перша прибирає рух повітря, друга свідомо його створює; відсік будують під одну з них, а не під обидві водночас. Яка саме діє, випливає з протипожежної концепції, а не з проєкту вентиляції.","Das Abschalten der Zu- und Abluftventilatoren im Brandfall und eine eigene Rauchabführung mit großen Nachströmöffnungen sind zwei verschiedene Brandstrategien für denselben Abschnitt. Die eine nimmt die Luftbewegung weg, die andere erzeugt sie bewusst; ein Abschnitt wird für eine davon gebaut, nicht für beide zugleich. Welche gilt, folgt aus dem Brandschutzkonzept, nicht aus der Lüftungsplanung.","Het stilzetten van toevoer- en afvoerventilatoren in brandstand en een eigen rookafvoer met grote toevoeropeningen zijn twee verschillende brandstrategieën voor hetzelfde compartiment. De ene haalt de luchtbeweging weg, de andere maakt haar juist; een compartiment wordt voor één ervan gebouwd, niet voor beide tegelijk. Welke geldt volgt uit het brandveiligheidsconcept, niet uit het ventilatieontwerp.","Arrêter les ventilateurs de soufflage et d'extraction en mode incendie et exploiter un désenfumage dédié avec de grandes amenées d'air sont deux stratégies incendie différentes pour le même compartiment. L'une supprime le mouvement d'air, l'autre le crée volontairement ; un compartiment est conçu pour l'une, pas pour les deux à la fois. Laquelle s'applique découle du concept de sécurité incendie, non de la conception de la ventilation.","Parar los ventiladores de impulsión y extracción en modo incendio y operar una extracción de humos dedicada con grandes aberturas de reposición son dos estrategias de incendio distintas para el mismo sector. Una elimina el movimiento del aire, la otra lo crea a propósito; un sector se construye para una, no para ambas a la vez. Cuál rige se deduce del concepto de seguridad contra incendios, no del diseño de la ventilación.")},
{id:"k25",k:"hard",a:"m_singletrain",b:"m_redundant",
 x:L("A single train without redundancy and redundant trains with automatic changeover are the two ends of the same decision. Ticking both leaves the availability of the function undefined, and the rest of the design depends on exactly that.","Одна лінія без резерву і резервовані лінії з автоматичним перемиканням — два кінці одного рішення. Позначивши обидва, ви залишаєте доступність функції невизначеною, а решта проєкту залежить саме від неї.","Ein einzelner Strang ohne Redundanz und redundante Stränge mit automatischer Umschaltung sind die beiden Enden derselben Entscheidung. Beides anzuhaken lässt die Verfügbarkeit der Funktion offen, und genau davon hängt der Rest der Planung ab.","Eén trein zonder redundantie en redundante treinen met automatische omschakeling zijn de twee uiteinden van dezelfde beslissing. Beide aanvinken laat de beschikbaarheid van de functie onbepaald, en juist daarvan hangt de rest van het ontwerp af.","Une seule ligne sans redondance et des lignes redondantes avec permutation automatique sont les deux extrémités d'une même décision. Cocher les deux laisse indéfinie la disponibilité de la fonction, dont dépend le reste de la conception.","Un solo tren sin redundancia y trenes redundantes con conmutación automática son los dos extremos de la misma decisión. Marcar ambos deja indefinida la disponibilidad de la función, de la que depende el resto del diseño.")},
{id:"k01",k:"warn",a:"m_recirc_filt",b:"m_toxic_once",
 x:L("These two act on different streams: the captured stream goes once-through to treatment, while the general room air is partly returned. That combination is normal in solvent, welding and pharmaceutical plants, but it has to be argued: particle filters do not remove vapours or gases, and for carcinogenic, mutagenic or reprotoxic agents the hierarchy of control demands removal rather than a dilution loop. State the substance, the residual room concentration and the monitoring that carries the return.","Ці два заходи діють на різні потоки: вловлений потік іде прямоточно на очищення, а загальне повітря приміщення частково повертається. Таке поєднання нормальне для розчинникових, зварювальних і фармацевтичних виробництв, але його треба обґрунтувати: фільтри частинок не видаляють пари й гази, а для канцерогенів, мутагенів і репротоксикантів ієрархія заходів вимагає видалення, а не циклу розбавлення. Назвіть речовину, залишкову концентрацію в приміщенні та контроль, який виправдовує повернення.","Beide wirken auf verschiedene Ströme: der erfasste Strom geht im Einweg zur Behandlung, die allgemeine Raumluft wird teilweise zurückgeführt. Diese Kombination ist in Lösemittel-, Schweiß- und Pharmabetrieben üblich, muss aber begründet werden: Partikelfilter entfernen keine Dämpfe und Gase, und für krebserzeugende, keimzellmutagene oder reproduktionstoxische Stoffe verlangt die Rangfolge Entfernung statt eines Verdünnungskreises. Nennen Sie Stoff, Restkonzentration im Raum und die Überwachung, die die Rückführung trägt.","Deze twee werken op verschillende stromen: de afgevangen stroom gaat in enkele doorgang naar behandeling, terwijl de algemene ruimtelucht deels wordt teruggevoerd. Die combinatie is normaal in oplosmiddel-, las- en farmabedrijven, maar moet worden onderbouwd: deeltjesfilters verwijderen geen dampen of gassen, en voor kankerverwekkende, mutagene of reprotoxische stoffen vraagt de beheersingshiërarchie verwijdering in plaats van een verdunningslus. Noem de stof, de restconcentratie in de ruimte en de bewaking die de terugvoer draagt.","Ces deux mesures agissent sur des flux différents : le flux capté part en simple passage vers le traitement, tandis que l'air général du local est en partie recyclé. Cette combinaison est courante en solvants, soudage et pharmacie, mais elle doit être argumentée : les filtres à particules n'éliminent ni vapeurs ni gaz, et pour les agents cancérogènes, mutagènes ou reprotoxiques la hiérarchie des mesures exige l'élimination plutôt qu'une boucle de dilution. Indiquez la substance, la concentration résiduelle et la surveillance qui portent le recyclage.","Ambas actúan sobre flujos distintos: el flujo captado va en paso único a tratamiento, mientras que el aire general del local se recircula en parte. Esa combinación es habitual en plantas de disolventes, soldadura y farmacia, pero debe argumentarse: los filtros de partículas no eliminan vapores ni gases, y para agentes cancerígenos, mutágenos o reprotóxicos la jerarquía de control exige eliminación en lugar de un lazo de dilución. Indique la sustancia, la concentración residual y la vigilancia que sostienen el retorno.")},
{id:"k03",k:"warn",a:"m_hrw_wheel",b:"m_dedicated_ahu",
 x:L("With one air handling unit per product zone the wheel connects that zone's own extract to its own supply, so it does not create a path between two product zones. What remains is carry-over inside the zone itself, which matters at product changeover and for any substance the wheel can transfer. Specify the purge sector, the fan arrangement that keeps the pressure difference across the wheel in the right direction, and the flush time at changeover.","Коли на кожну продуктову зону припадає своя установка, ротор з'єднує витяжку цієї ж зони з її ж припливом, тобто шляху між двома зонами він не створює. Лишається перенос усередині самої зони — він важливий під час зміни продукту і для будь-якої речовини, яку ротор здатен перенести. Задайте продувний сектор, схему вентиляторів, яка тримає перепад тиску на роторі в потрібному напрямку, і час промивання при переході.","Bei einem Lüftungsgerät je Produktzone verbindet das Rad die Abluft dieser Zone mit ihrer eigenen Zuluft und schafft damit keinen Weg zwischen zwei Produktzonen. Es bleibt die Übertragung innerhalb derselben Zone, die beim Produktwechsel und für jeden übertragbaren Stoff zählt. Legen Sie Spülsektor, die Ventilatoranordnung mit richtiger Druckdifferenz über das Rad und die Spülzeit beim Wechsel fest.","Met één luchtbehandelingskast per productzone verbindt het wiel de afvoer van die zone met haar eigen toevoer en maakt dus geen pad tussen twee productzones. Wat blijft is overdracht binnen dezelfde zone, van belang bij productwissel en voor elke stof die het wiel kan overdragen. Leg de spoelsector vast, de ventilatoropstelling die het drukverschil over het wiel de goede kant op houdt, en de spoeltijd bij wissel.","Avec une centrale par zone produit, la roue relie l'extraction de cette zone à son propre soufflage et ne crée donc pas de chemin entre deux zones produit. Reste le transfert à l'intérieur de la même zone, qui compte au changement de produit et pour toute substance transférable. Précisez le secteur de purge, la disposition des ventilateurs assurant le bon sens de la différence de pression sur la roue, et le temps de balayage au changement.","Con una unidad de tratamiento por zona de producto, la rueda conecta la extracción de esa zona con su propia impulsión y no crea un camino entre dos zonas de producto. Queda el arrastre dentro de la misma zona, relevante en el cambio de producto y para cualquier sustancia transferible. Defina el sector de purga, la disposición de ventiladores que da el sentido correcto a la diferencia de presión en la rueda y el tiempo de barrido en el cambio.")},
{id:"k07",k:"warn",a:"m_wetclean",b:"m_drylimit",
 x:L("Water introduced during foam cleaning evaporates into exactly the volume whose dew point must stay below the limit. A continuously held dry limit and a wet cleaning regime cannot coexist without a defined temporary release of the limit, a separate drying mode and a decision on product status.","Вода, внесена під час пінного прибирання, випаровується саме в той об'єм, точка роси якого має лишатися нижче межі. Безперервно утримувана суха межа й режим вологого прибирання не можуть співіснувати без визначеного тимчасового зняття межі, окремого режиму сушіння та рішення щодо статусу продукту.","Beim Schaumreinigen eingebrachtes Wasser verdunstet genau in das Volumen, dessen Taupunkt unter der Grenze bleiben muss. Eine durchgehend gehaltene Trockengrenze und ein Nassreinigungsregime bestehen nicht nebeneinander ohne definierte befristete Aufhebung der Grenze, eigenen Trocknungsbetrieb und Entscheidung zum Produktstatus.","Water dat bij schuimreinigen wordt ingebracht verdampt precies in het volume waarvan het dauwpunt onder de grens moet blijven. Een continu gehandhaafde droge grens en een nat reinigingsregime gaan niet samen zonder vastgelegde tijdelijke opheffing van de grens, een aparte droogmodus en een besluit over de productstatus.","L'eau introduite au nettoyage mousse s'évapore précisément dans le volume dont le point de rosée doit rester sous la limite. Une limite sèche tenue en continu et un régime de nettoyage humide ne coexistent pas sans levée temporaire définie de la limite, un mode de séchage distinct et une décision sur le statut produit.","El agua introducida en la limpieza con espuma se evapora justo en el volumen cuyo punto de rocío debe quedar bajo el límite. Un límite seco mantenido en continuo y un régimen de limpieza húmeda no conviven sin una liberación temporal definida del límite, un modo de secado aparte y una decisión sobre el estado del producto.")},
{id:"k10",k:"warn",a:"m_reheat",b:"m_coldchain",
 x:L("Cooling below dew point and reheating afterwards is the standard way to hold a low humidity in a chilled room, and it does not break the cold chain as long as the reheat sits in the air handling unit and brings the overcooled air back to the supply temperature that holds the room setpoint. It does break it if a heater is placed in the product zone itself, or if the supply temperature is raised above the required room condition. State where the reheat coil sits and which supply and room temperatures follow from it.","Охолодження нижче точки роси з подальшим підігрівом — стандартний спосіб тримати низьку вологість в охолоджуваному приміщенні, і холодовий ланцюг це не розриває, доки підігрів стоїть в установці й повертає переохолоджене повітря до припливної температури, що тримає уставку приміщення. Розрив настає, якщо нагрівач розміщено в самій продуктовій зоні або якщо припливну температуру піднято вище за потрібний стан приміщення. Вкажіть, де стоїть підігрівач і які при цьому припливна та кімнатна температури.","Unter den Taupunkt kühlen und danach nachheizen ist der Standardweg, um in einem gekühlten Raum niedrige Feuchte zu halten; die Kühlkette bricht dabei nicht, solange das Nachheizen im Lüftungsgerät sitzt und die unterkühlte Luft auf die Zulufttemperatur bringt, die den Raumsollwert hält. Sie bricht, wenn ein Heizer in der Produktzone selbst steht oder die Zulufttemperatur über den geforderten Raumzustand angehoben wird. Geben Sie an, wo das Nachheizregister sitzt und welche Zuluft- und Raumtemperaturen daraus folgen.","Koelen onder het dauwpunt en daarna naverwarmen is de standaardmanier om in een gekoelde ruimte een lage vochtigheid te houden; de koudeketen breekt daarbij niet zolang de naverwarming in de luchtbehandelingskast zit en de onderkoelde lucht terugbrengt naar de toevoertemperatuur die het ruimtesetpoint houdt. Zij breekt wel als een verwarmer in de productzone zelf staat of als de toevoertemperatuur boven de vereiste ruimteconditie wordt gebracht. Geef aan waar de naverwarmer zit en welke toevoer- en ruimtetemperaturen daaruit volgen.","Refroidir sous le point de rosée puis réchauffer est la manière standard de tenir une humidité basse dans un local réfrigéré, et cela ne rompt pas la chaîne du froid tant que la batterie de post-chauffage est dans la centrale et ramène l'air surrefroidi à la température de soufflage qui tient la consigne du local. Elle rompt si un réchauffeur est placé dans la zone produit elle-même, ou si la température de soufflage dépasse la condition exigée. Précisez l'emplacement de la batterie et les températures de soufflage et de local qui en découlent.","Enfriar por debajo del punto de rocío y recalentar después es la forma estándar de mantener humedad baja en un local refrigerado, y no rompe la cadena de frío mientras el recalentamiento esté en la unidad de tratamiento y devuelva el aire subenfriado a la temperatura de impulsión que mantiene la consigna del local. Sí la rompe si se coloca un calentador en la propia zona de producto o si la temperatura de impulsión supera la condición exigida. Indique dónde está la batería y qué temperaturas de impulsión y de local resultan.")},
{id:"k13",k:"warn",a:"m_aircurtain",b:"m_unidir",
 x:L("The curtain jet entrains room air and generates strong turbulence exactly where the unidirectional field has to stay undisturbed. One of the two has to move away from the open product, and the visualisation test will show which.","Струмінь завіси підмішує повітря приміщення й створює сильну турбулентність саме там, де односпрямоване поле має лишатися незбуреним. Один із двох заходів має відійти від відкритого продукту — випробування з візуалізацією покаже, який саме.","Der Schleierstrahl reißt Raumluft mit und erzeugt starke Turbulenz genau dort, wo die Verdrängungsströmung ungestört bleiben muss. Eine der beiden Maßnahmen muss vom offenen Produkt weg, und der Visualisierungstest zeigt welche.","De gordijnstraal zuigt ruimtelucht mee en veroorzaakt sterke turbulentie precies waar het unidirectionele veld ongestoord moet blijven. Een van beide moet weg van het open product; de visualisatieproef laat zien welke.","Le jet du rideau entraîne l'air ambiant et crée une forte turbulence là précisément où le champ unidirectionnel doit rester intact. L'une des deux mesures doit s'éloigner du produit ouvert, et l'essai de visualisation dira laquelle.","El chorro de la cortina arrastra aire del local y genera fuerte turbulencia justo donde el campo unidireccional debe permanecer intacto. Una de las dos medidas debe alejarse del producto abierto, y el ensayo de visualización dirá cuál.")},
{id:"k19",k:"warn",a:"m_smokeextract",b:"m_dustcontain",
 x:L("Smoke mode moves flows and opens make-up paths far beyond anything the containment balance was designed for. The fire scenario has to be resolved as a separate operating state with a stated priority, not laid on top of the containment setpoints.","Режим димовидалення змінює витрати й відкриває шляхи припливу далеко за межами того, на що розраховувався баланс утримання. Пожежний сценарій слід вирішувати як окремий режим із заявленим пріоритетом, а не накладати на уставки утримання.","Der Rauchbetrieb verschiebt Volumenströme und öffnet Zuluftwege weit jenseits dessen, wofür die Einschlussbilanz ausgelegt wurde. Das Brandszenario ist als eigener Betriebszustand mit benannter Priorität zu lösen, nicht über die Einschlusssollwerte zu legen.","De rookmodus verschuift debieten en opent toevoerpaden ver buiten waarvoor de insluitbalans is ontworpen. Het brandscenario moet als aparte bedrijfstoestand met een benoemde prioriteit worden opgelost, niet over de insluitsetpoints heen gelegd.","Le mode désenfumage déplace les débits et ouvre des amenées d'air bien au-delà de ce pour quoi le bilan de confinement a été conçu. Le scénario incendie doit être traité comme un état distinct avec une priorité énoncée, non superposé aux consignes de confinement.","El modo de humos desplaza caudales y abre aportes muy por encima de aquello para lo que se diseñó el balance de confinamiento. El escenario de incendio debe resolverse como estado separado con prioridad declarada, no superpuesto a las consignas de confinamiento.")},
{id:"w01",k:"warn",a:"m_recirc_filt",b:"m_hepa_supply",
 x:L("Recirculation through high-efficiency filtration can be defensible when the release is purely particulate, the filter integrity is tested in place and the substances handled are known and stable. Record that assessment: a filter class on its own is not the argument.","Рециркуляція через високоефективну фільтрацію може бути виправданою, якщо викид суто аерозольний, цілісність фільтра перевіряється на місці, а речовини відомі й стабільні. Зафіксуйте цю оцінку: сам лише клас фільтра не є аргументом.","Umluft über Hochleistungsfilter kann vertretbar sein, wenn die Freisetzung rein partikulär ist, die Filterintegrität vor Ort geprüft wird und die Stoffe bekannt und stabil sind. Diese Bewertung ist zu dokumentieren: eine Filterklasse allein ist kein Argument.","Recirculatie via hoogwaardige filtratie kan verdedigbaar zijn als de emissie zuiver deeltjesvormig is, de filterintegriteit ter plaatse wordt getest en de stoffen bekend en stabiel zijn. Leg die beoordeling vast: een filterklasse alleen is geen argument.","Le recyclage via une filtration à haute efficacité peut se défendre si le dégagement est purement particulaire, l'intégrité du filtre testée in situ et les substances connues et stables. Documentez cette évaluation : une classe de filtre seule n'est pas un argument.","La recirculación con filtración de alta eficiencia puede defenderse si la emisión es puramente particulada, la integridad del filtro se ensaya in situ y las sustancias son conocidas y estables. Documente esa evaluación: la clase de filtro por sí sola no es un argumento.")},
{id:"w02",k:"warn",a:"m_return_collector",b:"m_flowproof",
 x:L("Returning collector air is accepted in some jurisdictions when flow and filter condition are monitored continuously and a broken-bag detector is fitted. Check the national rule and the actual dust data before you rely on it.","Повернення повітря пиловловлювача допускається в деяких юрисдикціях за умови безперервного контролю витрати й стану фільтра та наявності детектора прориву рукава. Перевірте національні правила й фактичні дані про пил, перш ніж на це покладатися.","Die Rückführung der Abscheiderluft wird in manchen Rechtsordnungen akzeptiert, wenn Volumenstrom und Filterzustand laufend überwacht werden und eine Filterbruchüberwachung vorhanden ist. Prüfen Sie nationale Regel und tatsächliche Staubdaten, bevor Sie sich darauf stützen.","Terugvoeren van afscheiderlucht wordt in sommige rechtsgebieden aanvaard als debiet en filterconditie continu worden bewaakt en er filterbreukdetectie is. Controleer de nationale regel en de werkelijke stofgegevens voordat u erop steunt.","Le renvoi de l'air du dépoussiéreur est admis dans certaines juridictions si le débit et l'état du filtre sont surveillés en continu et qu'un détecteur de rupture de manche est installé. Vérifiez la règle nationale et les données réelles de poussière.","El retorno del aire del separador se admite en algunas jurisdicciones si se vigilan de forma continua el caudal y el estado del filtro y hay detector de rotura de manga. Compruebe la norma nacional y los datos reales del polvo.")},
{id:"w03",k:"warn",a:"m_aircurtain",b:"m_airlock",
 x:L("The curtain and the airlock cover the same opening duty. Decide which one carries the barrier function; a curtain in front of an airlock usually adds energy use and a false sense of separation rather than performance.","Завіса та шлюз виконують ту саму функцію на одному прорізі. Визначте, який із них несе бар'єрну функцію; завіса перед шлюзом зазвичай додає витрату енергії та хибне відчуття розділення, а не якість.","Schleier und Schleuse decken dieselbe Öffnungsaufgabe ab. Entscheiden Sie, welcher die Barrierefunktion trägt; ein Schleier vor einer Schleuse bringt meist Energieverbrauch und ein Trenngefühl, aber keine Leistung.","Het gordijn en de sluis dekken dezelfde openingstaak. Bepaal welke de barrièrefunctie draagt; een gordijn vóór een sluis levert meestal energieverbruik en een schijngevoel van scheiding op, geen prestatie.","Le rideau et le sas remplissent la même fonction sur la même ouverture. Décidez lequel porte la barrière ; un rideau devant un sas ajoute surtout de la consommation et une illusion de séparation.","La cortina y la esclusa cubren la misma función en el mismo hueco. Decida cuál asume la barrera; una cortina delante de una esclusa suele añadir consumo y una falsa sensación de separación.")},
{id:"w04",k:"warn",a:"m_naturalvent",b:"m_mechhigh",
 x:L("Hybrid operation is workable, but the switch-over logic, the wind and temperature range of each mode and the proof against short-circuiting between openings all have to be written down and tested.","Гібридна робота можлива, але логіку перемикання, діапазон вітру й температури для кожного режиму та доказ відсутності короткого замикання між отворами треба записати й перевірити.","Hybridbetrieb ist möglich, aber Umschaltlogik, Wind- und Temperaturbereich je Zustand sowie der Nachweis gegen Kurzschluss zwischen Öffnungen müssen schriftlich festgelegt und geprüft sein.","Hybride bedrijf kan, maar de omschakellogica, het wind- en temperatuurbereik per modus en het bewijs tegen kortsluiting tussen openingen moeten zijn vastgelegd en beproefd.","Le fonctionnement hybride est possible, mais la logique de bascule, la plage de vent et de température de chaque mode et la preuve contre le court-circuit entre ouvertures doivent être écrites et éprouvées.","El funcionamiento híbrido es viable, pero la lógica de conmutación, el rango de viento y temperatura de cada modo y la prueba contra el cortocircuito entre aberturas deben escribirse y ensayarse.")},
{id:"w05",k:"warn",a:"m_freecool",b:"m_intake_filter",
 x:L("With a large outdoor fraction the outdoor air quality becomes the limiting factor for the room. Use measured intake data rather than a default filter class, and check the seasonal pollen, dust and odour episodes.","За великої частки зовнішнього повітря саме його якість стає обмежувальним чинником для приміщення. Використовуйте виміряні дані на заборі, а не типовий клас фільтра, і врахуйте сезонні епізоди пилку, пилу й запахів.","Bei großem Außenluftanteil wird die Außenluftqualität zum begrenzenden Faktor für den Raum. Nutzen Sie gemessene Ansaugdaten statt einer Standardfilterklasse und prüfen Sie saisonale Pollen-, Staub- und Geruchsepisoden.","Bij een grote buitenluchtfractie wordt de buitenluchtkwaliteit de beperkende factor voor de ruimte. Gebruik gemeten inlaatgegevens in plaats van een standaardfilterklasse en let op seizoensepisodes met pollen, stof en geur.","Avec une forte fraction d'air neuf, la qualité de l'air extérieur devient le facteur limitant. Utilisez des données mesurées à la prise plutôt qu'une classe de filtre par défaut, et examinez les épisodes saisonniers de pollens, poussières et odeurs.","Con gran fracción exterior, la calidad del aire exterior se vuelve el factor limitante. Use datos medidos en la toma en lugar de una clase de filtro por defecto y revise los episodios estacionales de polen, polvo y olor.")},
{id:"w06",k:"warn",a:"m_nightsetback",b:"m_surfacetemp",
 x:L("At reduced flow, surfaces cool down and the margin above dew point shrinks overnight. Check the coldest surface in the unoccupied state, not only during production, and include the first hour after restart.","За зниженої витрати поверхні охолоджуються, і запас над точкою роси за ніч зменшується. Перевіряйте найхолоднішу поверхню в неробочому стані, а не лише під час виробництва, і врахуйте першу годину після пуску.","Bei reduziertem Volumenstrom kühlen Flächen aus und der Abstand zum Taupunkt schrumpft über Nacht. Prüfen Sie die kälteste Fläche im unbelegten Zustand, nicht nur im Produktionsbetrieb, samt der ersten Stunde nach dem Wiederanfahren.","Bij gereduceerd debiet koelen oppervlakken af en krimpt de marge boven het dauwpunt 's nachts. Controleer het koudste oppervlak in onbezette toestand, niet alleen tijdens productie, inclusief het eerste uur na herstart.","À débit réduit, les surfaces refroidissent et la marge au-dessus du point de rosée se réduit la nuit. Vérifiez la surface la plus froide à l'état inoccupé, pas seulement en production, y compris la première heure après redémarrage.","Con caudal reducido las superficies se enfrían y el margen sobre el punto de rocío se reduce de noche. Compruebe la superficie más fría en estado desocupado, no solo en producción, incluida la primera hora tras el rearranque.")},
{id:"w07",k:"warn",a:"m_pushpull",b:"m_makeup_dist",
 x:L("A push jet is only useful if it drives the contaminant into the extraction slot and not through the breathing zone of the operator. Verify the direction with smoke at real working positions before you accept the arrangement.","Струмінь піддуву корисний лише тоді, коли жене забруднювач у відсмоктувальну щілину, а не крізь зону дихання оператора. Перевірте напрямок димом на реальних робочих позиціях, перш ніж приймати рішення.","Ein Push-Strahl nützt nur, wenn er den Schadstoff in den Absaugschlitz treibt und nicht durch die Atemzone des Bedieners. Prüfen Sie die Richtung mit Rauch an realen Arbeitspositionen, bevor Sie die Anordnung annehmen.","Een push-straal helpt alleen als hij de contaminant in de afzuigsleuf drijft en niet door de ademzone van de operator. Controleer de richting met rook op echte werkposities voordat u de opstelling aanvaardt.","Un jet de poussée n'est utile que s'il conduit le contaminant vers la fente d'extraction et non à travers la zone respiratoire de l'opérateur. Vérifiez le sens à la fumée aux postes réels avant d'accepter la disposition.","Un chorro de empuje solo sirve si lleva el contaminante a la ranura de extracción y no a través de la zona respiratoria del operador. Verifique el sentido con humo en posiciones reales antes de aceptar la disposición.")},
{id:"w08",k:"warn",a:"m_desicc_hot",b:"m_zone_gas",
 x:L("Hot regeneration surfaces and a burner inside or next to a classified area require an explicit temperature-class and ignition-source assessment, including the failure states of the rotor drive and of the regeneration fan.","Гарячі поверхні регенерації та пальник усередині або поруч із класифікованою зоною потребують явної оцінки температурного класу й джерел запалювання, зокрема аварійних станів приводу ротора та вентилятора регенерації.","Heiße Regenerationsflächen und ein Brenner in oder neben einem eingeteilten Bereich verlangen eine ausdrückliche Bewertung von Temperaturklasse und Zündquellen, einschließlich der Fehlerzustände von Rotorantrieb und Regenerationsventilator.","Hete regeneratieoppervlakken en een brander in of naast een ingedeelde zone vragen een expliciete beoordeling van temperatuurklasse en ontstekingsbronnen, inclusief de faaltoestanden van rotoraandrijving en regeneratieventilator.","Des surfaces de régénération chaudes et un brûleur dans ou près d'une zone classée exigent une évaluation explicite de la classe de température et des sources d'inflammation, y compris les défaillances de l'entraînement de roue et du ventilateur de régénération.","Superficies calientes de regeneración y un quemador dentro o junto a una zona clasificada exigen una evaluación explícita de clase de temperatura y fuentes de ignición, incluidos los fallos del accionamiento del rotor y del ventilador de regeneración.")},
{id:"w09",k:"warn",a:"m_scrub",b:"m_matcompat",
 x:L("The scrubbing liquor becomes an effluent, a corrosion agent and a freezing risk of its own. Its chemistry belongs in the material selection and in the discharge permit, not only in the abatement efficiency figure.","Промивна рідина скрубера сама стає стоком, корозійним агентом і ризиком замерзання. Її хімія має потрапити у вибір матеріалів і дозвіл на скидання, а не лише в цифру ефективності очищення.","Die Waschflüssigkeit wird selbst zu Abwasser, Korrosionsmittel und Frostrisiko. Ihre Chemie gehört in die Werkstoffwahl und in die Einleitgenehmigung, nicht nur in die Abscheidegradzahl.","De wasvloeistof wordt zelf afvalwater, corrosiemiddel en vriesrisico. Haar chemie hoort in de materiaalkeuze en de lozingsvergunning, niet alleen in het rendementsgetal.","Le liquide de lavage devient lui-même un effluent, un agent de corrosion et un risque de gel. Sa chimie relève du choix des matériaux et de l'autorisation de rejet, pas seulement du rendement d'abattement.","El líquido de lavado se convierte en efluente, agente de corrosión y riesgo de congelación. Su química pertenece a la selección de materiales y al permiso de vertido, no solo a la cifra de rendimiento.")},
{id:"w10",k:"warn",a:"m_confine_neg",b:"m_escape_clear",
 x:L("A containment cascade pulls air towards the more contaminated side. Check that the resulting route does not run along the escape path or through the refuge, especially in the incident and post-incident states.","Каскад утримання тягне повітря в бік більшого забруднення. Перевірте, щоб отриманий маршрут не проходив уздовж шляху евакуації чи крізь укриття, особливо в аварійних і післяаварійних станах.","Eine Einschlusskaskade zieht Luft zur stärker kontaminierten Seite. Prüfen Sie, dass der entstehende Weg nicht entlang des Fluchtwegs oder durch den Zufluchtsraum verläuft, besonders im Stör- und Nachstörfall.","Een insluitcascade trekt lucht naar de meer gecontamineerde zijde. Controleer dat de ontstane route niet langs de vluchtweg of door de toevlucht loopt, vooral in incident- en na-incidenttoestanden.","Une cascade de confinement tire l'air vers le côté plus contaminé. Vérifiez que le trajet obtenu ne longe pas la voie d'évacuation ni ne traverse le refuge, surtout en situation d'incident et après incident.","Una cascada de confinamiento arrastra aire hacia el lado más contaminado. Compruebe que la ruta resultante no discurra por la vía de escape ni por el refugio, sobre todo en estados de incidente y posteriores.")},
{id:"w11",k:"warn",a:"m_thermox",b:"m_emerg_assess",
 x:L("Bypass, start-up and purge states of an oxidiser can send untreated solvent straight to the stack. Those states belong in the emission assessment and in the permit, not only in the process description.","Стани байпаса, пуску та продування установки термічного окиснення можуть відправити необроблений розчинник просто в трубу. Ці стани мають потрапити в оцінку викидів і в дозвіл, а не лише в опис процесу.","Bypass-, Anfahr- und Spülzustände einer Nachverbrennung können unbehandeltes Lösemittel direkt in den Kamin führen. Diese Zustände gehören in die Emissionsbewertung und in die Genehmigung, nicht nur in die Prozessbeschreibung.","Bypass-, opstart- en spoeltoestanden van een naverbrander kunnen onbehandeld oplosmiddel rechtstreeks naar de schoorsteen sturen. Die toestanden horen in de emissiebeoordeling en de vergunning, niet alleen in de procesbeschrijving.","Les états de by-pass, de démarrage et de purge d'un oxydateur peuvent envoyer du solvant non traité directement à la cheminée. Ces états relèvent de l'évaluation des émissions et de l'autorisation, pas seulement de la description du procédé.","Los estados de by-pass, arranque y purga de un oxidador pueden enviar disolvente sin tratar directamente a la chimenea. Esos estados pertenecen a la evaluación de emisiones y al permiso, no solo a la descripción del proceso.")},
{id:"w12",k:"warn",a:"m_recirc_dry",b:"m_toxic_once",
 x:L("A dry recirculation loop running next to a hazardous process is defensible only when the two air systems are demonstrably separate: separate units, separate penetrations, and a written leak-path analysis between them.","Сухий рециркуляційний контур поруч із небезпечним процесом виправданий лише тоді, коли дві повітряні системи доказово розділені: окремі установки, окремі проходки та письмовий аналіз шляхів витоку між ними.","Ein trockener Umluftkreis neben einem gefährlichen Prozess ist nur vertretbar, wenn beide Luftsysteme nachweislich getrennt sind: eigene Geräte, eigene Durchführungen und eine schriftliche Leckwegbetrachtung dazwischen.","Een droge recirculatielus naast een gevaarlijk proces is alleen verdedigbaar als beide luchtsystemen aantoonbaar gescheiden zijn: eigen kasten, eigen doorvoeren en een schriftelijke lekpadanalyse ertussen.","Une boucle de recyclage sèche voisine d'un procédé dangereux ne se défend que si les deux systèmes d'air sont démontrablement séparés : centrales distinctes, traversées distinctes et analyse écrite des chemins de fuite.","Un bucle de recirculación seco junto a un proceso peligroso solo se defiende si ambos sistemas de aire están demostrablemente separados: unidades propias, pasos propios y un análisis escrito de vías de fuga.")},
{id:"w13",k:"warn",a:"m_spotcool",b:"m_lowvel",
 x:L("Spot cooling improves the worker's condition by raising the local air speed, which is exactly what the open product or bath does not tolerate. Aim the jet at the operator, never across the product, and verify with smoke.","Точкове охолодження покращує стан працівника за рахунок підвищення локальної швидкості повітря — саме того, чого не терпить відкритий продукт чи ванна. Спрямовуйте струмінь на оператора, а не через продукт, і перевірте димом.","Punktkühlung verbessert die Lage des Beschäftigten über eine höhere lokale Luftgeschwindigkeit — genau das, was offenes Produkt oder Bad nicht verträgt. Den Strahl auf die Person richten, nie über das Produkt, und mit Rauch prüfen.","Spotkoeling verbetert de situatie van de medewerker door de lokale luchtsnelheid te verhogen — precies wat open product of bad niet verdraagt. Richt de straal op de operator, nooit over het product, en controleer met rook.","Le refroidissement ponctuel améliore la condition du travailleur en augmentant la vitesse locale, ce que le produit ou le bain ouvert ne tolère pas. Dirigez le jet vers l'opérateur, jamais au-dessus du produit, et vérifiez à la fumée.","El enfriamiento puntual mejora la condición del trabajador subiendo la velocidad local, justo lo que el producto o baño abierto no tolera. Dirija el chorro al operador, nunca sobre el producto, y verifique con humo.")},
{id:"w14",k:"warn",a:"m_desicc_hot",b:"m_dustcontain",
 x:L("Hot regeneration surfaces stand in a space where a dust containment has to be maintained. Even without a formal zone, settled dust on hot parts is an ignition path; the regeneration side and its discharge need their own assessment and preferably their own location.","Гарячі поверхні регенерації опиняються в приміщенні, де треба підтримувати локалізацію пилу. Навіть без формальної зони осілий пил на гарячих частинах є шляхом займання; регенераційна частина і її викид потребують окремої оцінки й, бажано, окремого розташування.","Heiße Regenerationsflächen stehen in einem Raum, in dem eine Staubeinhausung aufrechterhalten werden muss. Auch ohne förmliche Zone ist abgelagerter Staub auf heißen Teilen ein Zündpfad; Regenerationsseite und Fortluft brauchen eine eigene Beurteilung und möglichst einen eigenen Standort.","Hete regeneratieoppervlakken staan in een ruimte waar stofinsluiting in stand moet blijven. Ook zonder formele zone is neergeslagen stof op hete delen een ontstekingspad; de regeneratiezijde en haar afvoer vragen een eigen beoordeling en bij voorkeur een eigen plaats.","Des surfaces de régénération chaudes se trouvent dans un local où un confinement des poussières doit être maintenu. Même sans zone formelle, la poussière déposée sur des pièces chaudes est un chemin d'inflammation ; le côté régénération et son rejet demandent une évaluation propre et de préférence un emplacement séparé.","Superficies calientes de regeneración quedan en un local donde debe mantenerse el confinamiento de polvo. Aun sin zona formal, el polvo depositado sobre piezas calientes es un camino de ignición; el lado de regeneración y su descarga exigen evaluación propia y, preferentemente, ubicación separada.")},
{id:"w15",k:"warn",a:"m_highvel",b:"m_pushpull",
 x:L("A high-velocity capture slot and a push-pull field across the same surface are two different capture principles. Combined without a visualisation test they usually spoil each other: the jet overshoots the slot and the capture efficiency falls instead of rising.","Щілина з високою швидкістю вловлювання і поле «push-pull» над тією самою поверхнею — два різні принципи вловлювання. Поєднані без візуалізаційного випробування, вони зазвичай псують одне одного: струмінь перелітає щілину, і ефективність уловлювання падає, а не зростає.","Ein Absaugschlitz mit hoher Erfassungsgeschwindigkeit und ein Push-Pull-Feld über derselben Oberfläche sind zwei verschiedene Erfassungsprinzipien. Ohne Sichtbarmachungsversuch kombiniert stören sie einander meist: der Strahl schießt über den Schlitz hinaus und die Erfassung wird schlechter statt besser.","Een afzuigsleuf met hoge vangsnelheid en een push-pullveld over hetzelfde oppervlak zijn twee verschillende vangprincipes. Zonder visualisatieproef gecombineerd bederven ze elkaar meestal: de straal schiet de sleuf voorbij en het vangrendement daalt in plaats van te stijgen.","Une fente de captage à haute vitesse et un champ push-pull au-dessus de la même surface sont deux principes de captage différents. Combinés sans essai de visualisation, ils se nuisent généralement : le jet dépasse la fente et l'efficacité de captage baisse au lieu d'augmenter.","Una ranura de captación de alta velocidad y un campo push-pull sobre la misma superficie son dos principios de captación distintos. Combinados sin ensayo de visualización suelen estropearse mutuamente: el chorro sobrepasa la ranura y la eficacia de captación baja en vez de subir.")},
{id:"w16",k:"warn",a:"m_smokeextract",b:"m_neg",
