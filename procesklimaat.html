 n:L("A visible plume is a latent load first and a comfort problem second.","Видимий факел — це передусім приховане навантаження, а вже потім проблема комфорту.","Eine sichtbare Fahne ist zuerst eine latente Last und erst danach ein Komfortproblem.","Een zichtbare pluim is eerst een latente last en pas daarna een comfortprobleem.","Un panache visible est d'abord une charge latente, ensuite un problème de confort.","Un penacho visible es primero una carga latente y después un problema de confort.")},
{id:"H3",g:"heat",c:"method",s:"confirmed",
 t:L("Concentrated equipment heat in a confined technical space","Зосереджена теплота обладнання в тісному технічному приміщенні","Konzentrierte Gerätewärme in einem engen Technikraum","Geconcentreerde apparatuurwarmte in een krappe technische ruimte","Chaleur d'équipement concentrée dans un local technique exigu","Calor de equipos concentrado en un local técnico reducido"),
 n:L("Heat removal is limited by the available sink temperature, not by the fan you would like to fit.","Відведення теплоти обмежене температурою доступного стоку, а не вентилятором, який хотілося б поставити.","Die Wärmeabfuhr begrenzt die Temperatur der verfügbaren Senke, nicht der gewünschte Ventilator.","De warmteafvoer wordt begrensd door de beschikbare put, niet door de gewenste ventilator.","L'évacuation est limitée par la température du puits disponible, pas par le ventilateur souhaité.","La evacuación la limita la temperatura del sumidero disponible, no el ventilador deseado.")},
{id:"H4",g:"heat",c:"guidance",s:"confirmed",
 t:L("Hot exhaust and drying heat from dryers, kilns and curing sections","Гаряче відхідне повітря та теплота сушіння від сушарок, печей і секцій затвердіння","Heiße Abluft und Trocknungswärme aus Trocknern, Öfen und Härtezonen","Hete afvoerlucht en droogwarmte uit drogers, ovens en uithardsecties","Air chaud rejeté et chaleur de séchage des sécheurs, fours et sections de cuisson","Aire caliente y calor de secado de secadores, hornos y secciones de curado"),
 n:L("The exhaust is often the largest single load and the hardest one to recover cleanly.","Викид часто є найбільшим одиничним навантаженням і найважчим для чистої рекуперації.","Die Abluft ist oft die größte Einzellast und am schwersten sauber zurückzugewinnen.","De afvoerlucht is vaak de grootste enkele last en het lastigst schoon terug te winnen.","Le rejet est souvent la plus grande charge unique et la plus difficile à récupérer proprement.","El aire de escape suele ser la mayor carga individual y la más difícil de recuperar limpiamente.")},
{id:"H5",g:"heat",c:"method",s:"confirmed",
 t:L("Latent heat from washing, wet cleaning and product moisture","Прихована теплота від миття, вологого прибирання та вологи продукту","Latente Wärme aus Waschen, Nassreinigung und Produktfeuchte","Latente warmte uit wassen, nat reinigen en productvocht","Chaleur latente du lavage, du nettoyage humide et de l'humidité du produit","Calor latente del lavado, la limpieza húmeda y la humedad del producto"),
 n:L("A cleaning shift can dominate the annual moisture balance of the room.","Зміна прибирання може домінувати в річному балансі вологи приміщення.","Eine Reinigungsschicht kann die Jahresfeuchtebilanz des Raums dominieren.","Een reinigingsdienst kan de jaarlijkse vochtbalans van de ruimte domineren.","Un poste de nettoyage peut dominer le bilan d'humidité annuel du local.","Un turno de limpieza puede dominar el balance anual de humedad del local.")},
{id:"H6",g:"heat",c:"method",s:"assumed",
 t:L("Thermal stratification and buoyancy in a tall hall","Температурна стратифікація та підйомна сила у високому цеху","Temperaturschichtung und Auftrieb in einer hohen Halle","Temperatuurstratificatie en opwaartse stroming in een hoge hal","Stratification thermique et poussée d'Archimède dans une halle haute","Estratificación térmica y flotabilidad en una nave alta"),
 n:L("Stack pressure depends on height and on density difference; it reverses when the process stops.","Тепловий напір залежить від висоти й різниці густин; він змінює знак після зупинки процесу.","Der thermische Druck hängt von Höhe und Dichteunterschied ab und kehrt sich beim Prozessstopp um.","De thermische druk hangt af van hoogte en dichtheidsverschil en keert om als het proces stopt.","La pression thermique dépend de la hauteur et de l'écart de densité ; elle s'inverse à l'arrêt.","La presión térmica depende de la altura y del salto de densidad; se invierte al parar el proceso.")},
{id:"H7",g:"heat",c:"method",s:"confirmed",
 t:L("Metabolic and equipment heat in a closed volume without an outdoor sink","Метаболічна та апаратна теплота в замкнутому об'ємі без зовнішнього стоку","Stoffwechsel- und Gerätewärme in einem geschlossenen Volumen ohne Außensenke","Metabolische en apparatuurwarmte in een gesloten volume zonder buitenput","Chaleur métabolique et des équipements en volume clos sans puits extérieur","Calor metabólico y de equipos en volumen cerrado sin sumidero exterior"),
 n:L("Time to a limit value after loss of heat rejection becomes a primary design parameter.","Час до досягнення граничного значення після втрати тепловідведення стає головним параметром проєкту.","Die Zeit bis zum Grenzwert nach Verlust der Wärmeabfuhr wird zum primären Auslegungsparameter.","De tijd tot een grenswaarde na verlies van warmteafvoer wordt een primaire ontwerpparameter.","Le temps jusqu'à la valeur limite après perte d'évacuation devient un paramètre de conception primaire.","El tiempo hasta el valor límite tras perder la evacuación es un parámetro de diseño primario.")},
{id:"W1",g:"moist",c:"method",s:"confirmed",
 t:L("Rapid humidity peaks from steam, boiling and open water surfaces","Різкі піки вологості від пари, кипіння та відкритих водних поверхонь","Schnelle Feuchtespitzen aus Dampf, Kochen und offenen Wasserflächen","Snelle vochtpieken uit stoom, koken en open wateroppervlakken","Pics d'humidité rapides dus à la vapeur, l'ébullition et les surfaces libres","Picos rápidos de humedad por vapor, ebullición y superficies libres de agua"),
 n:L("Absolute humidity, not relative humidity, is the quantity that has to balance.","Балансувати треба абсолютну, а не відносну вологість.","Ausgeglichen werden muss die absolute, nicht die relative Feuchte.","De absolute, niet de relatieve vochtigheid moet in balans zijn.","C'est l'humidité absolue, non relative, qui doit s'équilibrer.","Lo que debe equilibrarse es la humedad absoluta, no la relativa.")},
{id:"W2",g:"moist",c:"standard",s:"confirmed",
 t:L("Very low dew-point requirement of the process","Вимога дуже низької точки роси процесу","Sehr niedrige Taupunktanforderung des Prozesses","Zeer lage dauwpunteis van het proces","Exigence de point de rosée très bas du procédé","Requisito de punto de rocío muy bajo del proceso"),
 n:L("A small door or material infiltration can dominate the whole drying load.","Невелика інфільтрація через двері чи з матеріалом може визначати все навантаження на осушення.","Eine kleine Tür- oder Materialinfiltration kann die gesamte Trocknungslast bestimmen.","Een kleine deur- of materiaalinfiltratie kan de hele drooglast bepalen.","Une petite infiltration par porte ou matériau peut dominer toute la charge de séchage.","Una pequeña infiltración por puerta o material puede dominar toda la carga de secado.")},
{id:"W3",g:"moist",c:"method",s:"confirmed",
 t:L("Moisture ingress through doors, airlocks and material transfer","Надходження вологи крізь двері, шлюзи та передачу матеріалів","Feuchteeintrag über Türen, Schleusen und Materialtransfer","Vochtinbreng via deuren, sluizen en materiaaltransfer","Entrée d'humidité par portes, sas et transfert de matières","Entrada de humedad por puertas, esclusas y transferencia de material"),
 n:L("Door open time per hour is a design input, not an operational detail.","Час відкриття дверей за годину — вхідний параметр проєкту, а не експлуатаційна дрібниця.","Türöffnungszeit je Stunde ist eine Auslegungsgröße, kein Betriebsdetail.","Deuropeningstijd per uur is een ontwerpinvoer, geen bedrijfsdetail.","La durée d'ouverture des portes par heure est une donnée de conception, pas un détail d'exploitation.","El tiempo de puerta abierta por hora es un dato de diseño, no un detalle de operación.")},
{id:"W4",g:"moist",c:"guidance",s:"confirmed",
 t:L("Hygroscopic product: caking, loss of flow and microbiological growth","Гігроскопічний продукт: злежування, втрата сипкості та мікробіологічний ріст","Hygroskopisches Produkt: Verbacken, Fließverlust und mikrobielles Wachstum","Hygroscopisch product: koeken, verlies van stroming en microbiële groei","Produit hygroscopique : prise en masse, perte d'écoulement et croissance microbienne","Producto higroscópico: apelmazamiento, pérdida de fluidez y crecimiento microbiano"),
 n:L("The moisture limit follows from the material, not from the working hours.","Межа вологості випливає з властивостей матеріалу, а не з графіка роботи.","Die Feuchtegrenze folgt aus dem Material, nicht aus der Arbeitszeit.","De vochtgrens volgt uit het materiaal, niet uit de werktijden.","La limite d'humidité découle du matériau, pas des heures de travail.","El límite de humedad se deriva del material, no del horario de trabajo.")},
{id:"W5",g:"moist",c:"method",s:"confirmed",
 t:L("Frost, rime and ice on cold surfaces and evaporators","Іній, наморозь і лід на холодних поверхнях та випарниках","Reif und Eis an kalten Oberflächen und Verdampfern","Rijp en ijs op koude oppervlakken en verdampers","Givre et glace sur surfaces froides et évaporateurs","Escarcha y hielo en superficies frías y evaporadores"),
 n:L("Rime is both a capacity loss and a slip and door-sealing problem.","Наморозь — це і втрата продуктивності, і проблема слизької підлоги та ущільнення дверей.","Reif bedeutet Kapazitätsverlust und zugleich Rutsch- und Türdichtungsprobleme.","Rijp is zowel capaciteitsverlies als een gladheids- en deurafdichtingsprobleem.","Le givre est à la fois une perte de capacité et un problème de glissance et d'étanchéité.","La escarcha es a la vez pérdida de capacidad y problema de resbalones y estanqueidad.")},
{id:"W6",g:"moist",c:"rule",s:"assumed",
 t:L("Moisture from biological activity: grain heating, livestock, composting","Волога від біологічної активності: самозігрівання зерна, тваринництво, компостування","Feuchte aus biologischer Aktivität: Getreideerwärmung, Tierhaltung, Kompostierung","Vocht uit biologische activiteit: broei in graan, veehouderij, compostering","Humidité d'origine biologique : échauffement du grain, élevage, compostage","Humedad de actividad biológica: calentamiento del grano, ganadería, compostaje"),
 n:L("The source grows with temperature, so moisture and heat reinforce each other.","Джерело зростає з температурою, тому волога й теплота підсилюють одне одного.","Die Quelle wächst mit der Temperatur, sodass Feuchte und Wärme sich verstärken.","De bron groeit met de temperatuur, zodat vocht en warmte elkaar versterken.","La source croît avec la température : humidité et chaleur se renforcent mutuellement.","La fuente crece con la temperatura, así que humedad y calor se refuerzan.")},
{id:"W7",g:"moist",c:"standard",s:"confirmed",
 t:L("Condensate in air handling units, drip trays and ducts","Конденсат у припливних установках, піддонах і повітроводах","Kondensat in Lüftungsgeräten, Tropfwannen und Kanälen","Condensaat in luchtbehandelingskasten, lekbakken en kanalen","Condensat dans les centrales, bacs et gaines","Condensado en climatizadores, bandejas y conductos"),
 n:L("Standing water inside an air handling unit is a design fault, not a maintenance detail.","Застійна вода всередині установки — це помилка проєкту, а не деталь обслуговування.","Stehendes Wasser im Lüftungsgerät ist ein Konstruktionsfehler, kein Wartungsdetail.","Stilstaand water in een luchtbehandelingskast is een ontwerpfout, geen onderhoudsdetail.","L'eau stagnante dans une centrale est un défaut de conception, pas un détail d'entretien.","El agua estancada en un climatizador es un fallo de diseño, no un detalle de mantenimiento.")},
{id:"A1",g:"air",c:"law",s:"confirmed",
 t:L("Combustible or respirable process dust: cloud and settled layers","Горючий або респірабельний технологічний пил: хмара та осілі шари","Brennbarer oder alveolengängiger Prozessstaub: Wolke und Ablagerungen","Brandbaar of respirabel processtof: wolk en afgezette lagen","Poussière de procédé combustible ou respirable : nuage et dépôts","Polvo de proceso combustible o respirable: nube y capas depositadas"),
 n:L("Clouds and layers are assessed separately; a layer can create the next cloud.","Хмару й шар оцінюють окремо; шар може породити наступну хмару.","Wolke und Ablagerung werden getrennt bewertet; eine Schicht kann die nächste Wolke erzeugen.","Wolk en laag worden apart beoordeeld; een laag kan de volgende wolk vormen.","Nuage et couche s'évaluent séparément ; une couche peut créer le nuage suivant.","Nube y capa se evalúan por separado; una capa puede generar la siguiente nube.")},
{id:"A2",g:"air",c:"law",s:"confirmed",
 t:L("Solvent vapour and monomer release from lines, mixing and cleaning","Виділення парів розчинника й мономерів із ліній, змішування та миття","Lösemitteldampf und Monomerfreisetzung aus Linien, Mischen und Reinigen","Oplosmiddeldamp en monomeeremissie uit lijnen, mengen en reinigen","Vapeurs de solvant et monomères des lignes, du mélange et du nettoyage","Vapor de disolvente y monómeros de líneas, mezclado y limpieza"),
 n:L("Manual cleaning is often the peak release, not normal production.","Пік виділень часто припадає на ручне миття, а не на нормальне виробництво.","Die Spitzenfreisetzung entsteht oft bei der Handreinigung, nicht im Normalbetrieb.","De piekemissie ontstaat vaak bij handmatig reinigen, niet bij normale productie.","Le pic d'émission survient souvent au nettoyage manuel, pas en production normale.","El pico de emisión suele darse en la limpieza manual, no en producción normal.")},
{id:"A3",g:"air",c:"guidance",s:"confirmed",
 t:L("Oil mist and thermally generated ultrafine aerosol","Масляний туман і термічно утворений ультрадисперсний аерозоль","Ölnebel und thermisch erzeugtes ultrafeines Aerosol","Olienevel en thermisch gevormd ultrafijn aerosol","Brouillard d'huile et aérosol ultrafin d'origine thermique","Niebla de aceite y aerosol ultrafino de origen térmico"),
 n:L("Visible mist and odour are not a reliable measure of exposure or filter loading.","Видимий туман і запах не є надійною мірою експозиції чи завантаження фільтра.","Sichtbarer Nebel und Geruch sind kein verlässliches Maß für Exposition oder Filterbeladung.","Zichtbare nevel en geur zijn geen betrouwbare maat voor blootstelling of filterbelading.","Le brouillard visible et l'odeur ne mesurent pas l'exposition ni le colmatage du filtre.","La niebla visible y el olor no miden la exposición ni la carga del filtro.")},
{id:"A4",g:"air",c:"law",s:"confirmed",
 t:L("Welding fume, metal fume and ozone formed close to the arc","Зварювальний дим, металевий дим та озон, утворені біля дуги","Schweißrauch, Metallrauch und Ozon nahe dem Lichtbogen","Lasrook, metaalrook en ozon dicht bij de boog","Fumées de soudage, fumées métalliques et ozone près de l'arc","Humo de soldadura, humo metálico y ozono junto al arco"),
 n:L("Composition follows the base material, the coating and the consumable, not the process name.","Склад визначається основним матеріалом, покриттям і присадкою, а не назвою процесу.","Die Zusammensetzung folgt Grundwerkstoff, Beschichtung und Zusatzwerkstoff, nicht dem Verfahrensnamen.","De samenstelling volgt basismateriaal, coating en toevoegmateriaal, niet de procesnaam.","La composition suit le métal de base, le revêtement et le consommable, pas le nom du procédé.","La composición depende del material base, el recubrimiento y el consumible, no del nombre del proceso.")},
{id:"A5",g:"air",c:"guidance",s:"assumed",
 t:L("Odour and greasy aerosol from frying, baking and cooking","Запах і жировий аерозоль від смаження, випікання та варіння","Geruch und Fettaerosol aus Fritieren, Backen und Kochen","Geur en vetaerosol uit frituren, bakken en koken","Odeur et aérosol gras de la friture, de la cuisson et du four","Olor y aerosol graso de fritura, horneado y cocción"),
 n:L("Sticky aerosol fouls coils, dampers and fire dampers faster than the schedule assumes.","Липкий аерозоль забруднює теплообмінники, заслінки й вогнезатримувальні клапани швидше за графік.","Klebriges Aerosol verschmutzt Register, Klappen und Brandschutzklappen schneller als geplant.","Kleverig aerosol vervuilt batterijen, kleppen en brandkleppen sneller dan het schema aanneemt.","L'aérosol collant encrasse batteries, registres et clapets plus vite que prévu au planning.","El aerosol pegajoso ensucia baterías, compuertas y cortafuegos más rápido de lo previsto.")},
{id:"A6",g:"air",c:"law",s:"confirmed",
 t:L("Asphyxiant or oxygen-displacing gas collecting in low zones","Задушливий або киснезаміщувальний газ, що накопичується в низьких зонах","Erstickendes oder sauerstoffverdrängendes Gas in tiefen Zonen","Verstikkend of zuurstofverdringend gas in lage zones","Gaz asphyxiant ou déplaçant l'oxygène s'accumulant en zones basses","Gas asfixiante o desplazante de oxígeno acumulado en zonas bajas"),
 n:L("Pits, cellars and sumps are the design case; one low extract point rarely solves mixing.","Приямки, підвали й зумпфи — розрахунковий випадок; одна нижня точка витяжки рідко вирішує перемішування.","Gruben, Keller und Sümpfe sind der Auslegungsfall; ein tiefer Absaugpunkt löst die Mischung selten.","Putten, kelders en zinkputten zijn het ontwerpgeval; één laag afzuigpunt lost de menging zelden op.","Fosses, caves et puisards sont le cas de conception ; un seul point bas résout rarement le mélange.","Fosos, sótanos y sumideros son el caso de diseño; un solo punto bajo rara vez resuelve la mezcla.")},
{id:"A7",g:"air",c:"law",s:"confirmed",
 t:L("Toxic, corrosive or reactive process gas","Токсичний, корозійний або реакційноздатний технологічний газ","Toxisches, korrosives oder reaktives Prozessgas","Toxisch, corrosief of reactief procesgas","Gaz de procédé toxique, corrosif ou réactif","Gas de proceso tóxico, corrosivo o reactivo"),
 n:L("Incompatible streams must be kept apart before any common treatment is considered.","Несумісні потоки слід розділити до розгляду будь-якого спільного очищення.","Unverträgliche Ströme sind zu trennen, bevor eine gemeinsame Behandlung erwogen wird.","Onverenigbare stromen worden gescheiden voordat een gezamenlijke behandeling wordt overwogen.","Les flux incompatibles sont séparés avant d'envisager tout traitement commun.","Los flujos incompatibles se separan antes de plantear cualquier tratamiento común.")},
{id:"A8",g:"air",c:"guidance",s:"assumed",
 t:L("Bioaerosol, endotoxin and microbiological load","Біоаерозоль, ендотоксин і мікробіологічне навантаження","Bioaerosol, Endotoxin und mikrobiologische Last","Bioaerosol, endotoxine en microbiologische belasting","Bioaérosol, endotoxine et charge microbiologique","Bioaerosol, endotoxina y carga microbiológica"),
 n:L("Filters lower the count but do not remove a wet growth surface upstream.","Фільтри знижують кількість, але не усувають вологу поверхню росту вище за потоком.","Filter senken die Keimzahl, beseitigen aber keine feuchte Wachstumsfläche davor.","Filters verlagen het aantal maar verwijderen geen natte groeioppervlakken stroomopwaarts.","Les filtres réduisent le comptage mais n'éliminent pas une surface humide de croissance en amont.","Los filtros bajan el recuento pero no eliminan una superficie húmeda de crecimiento aguas arriba.")},
{id:"A9",g:"air",c:"law",s:"confirmed",
 t:L("Radioactive aerosol and gaseous activity","Радіоактивний аерозоль і газоподібна активність","Radioaktives Aerosol und gasförmige Aktivität","Radioactief aerosol en gasvormige activiteit","Aérosol radioactif et activité gazeuse","Aerosol radiactivo y actividad gaseosa"),
 n:L("Confinement direction and filtration stages are a licensed safety function, not an HVAC option.","Напрямок утримання й ступені фільтрації — ліцензована функція безпеки, а не опція вентиляції.","Einschlussrichtung und Filterstufen sind eine genehmigte Sicherheitsfunktion, keine Lüftungsoption.","Insluitrichting en filtertrappen zijn een vergunde veiligheidsfunctie, geen HVAC-optie.","Le sens du confinement et les étages de filtration sont une fonction de sûreté autorisée, pas une option CVC.","La dirección de confinamiento y las etapas de filtración son una función de seguridad autorizada, no una opción de climatización.")},
{id:"A10",g:"air",c:"method",s:"confirmed",
 t:L("Trace contaminants accumulating in a closed atmosphere","Слідові забруднювачі, що накопичуються в замкнутій атмосфері","Spurenverunreinigungen, die sich in geschlossener Atmosphäre anreichern","Spoorverontreinigingen die zich in een gesloten atmosfeer ophopen","Contaminants traces s'accumulant dans une atmosphère fermée","Contaminantes traza que se acumulan en atmósfera cerrada"),
 n:L("With no outdoor sink, every material and every leak becomes a term in the balance.","Без зовнішнього стоку кожен матеріал і кожен витік стає доданком балансу.","Ohne Außensenke wird jedes Material und jede Leckage zum Bilanzglied.","Zonder buitenput wordt elk materiaal en elke lekkage een balansterm.","Sans puits extérieur, chaque matériau et chaque fuite devient un terme du bilan.","Sin sumidero exterior, cada material y cada fuga es un término del balance.")},
{id:"P1",g:"prod",c:"law",s:"assumed",
 t:L("Open product exposed to airborne contamination","Відкритий продукт, наражений на забруднення з повітря","Offenes Produkt, das luftgetragener Kontamination ausgesetzt ist","Open product blootgesteld aan luchtgedragen contaminatie","Produit ouvert exposé à la contamination aéroportée","Producto abierto expuesto a contaminación aérea"),
 n:L("Direction of flow at the product is the requirement; the air change rate is only a consequence.","Вимогою є напрямок потоку біля продукту; кратність повітрообміну — лише наслідок.","Die Anforderung ist die Strömungsrichtung am Produkt; die Luftwechselrate ist nur Folge.","De eis is de stromingsrichting bij het product; de luchtwisseling is slechts gevolg.","L'exigence est le sens de l'écoulement au produit ; le taux de renouvellement n'en est qu'une conséquence.","El requisito es el sentido del flujo en el producto; la tasa de renovación es solo consecuencia.")},
{id:"P2",g:"prod",c:"guidance",s:"confirmed",
 t:L("Narrow temperature window for product quality","Вузьке температурне вікно для якості продукту","Enges Temperaturfenster für die Produktqualität","Smal temperatuurvenster voor productkwaliteit","Fenêtre de température étroite pour la qualité produit","Ventana de temperatura estrecha para la calidad del producto"),
 n:L("The window applies at the product, not at the room sensor on the wall.","Вікно діє біля продукту, а не біля кімнатного датчика на стіні.","Das Fenster gilt am Produkt, nicht am Raumfühler an der Wand.","Het venster geldt bij het product, niet bij de ruimtevoeler aan de wand.","La fenêtre s'applique au produit, pas à la sonde d'ambiance au mur.","La ventana se aplica en el producto, no en la sonda de ambiente de la pared.")},
{id:"P3",g:"prod",c:"guidance",s:"confirmed",
 t:L("Narrow humidity or dew-point window for product quality","Вузьке вікно вологості або точки роси для якості продукту","Enges Feuchte- oder Taupunktfenster für die Produktqualität","Smal vocht- of dauwpuntvenster voor productkwaliteit","Fenêtre d'humidité ou de point de rosée étroite pour la qualité produit","Ventana estrecha de humedad o punto de rocío para la calidad"),
 n:L("Dew point, not relative humidity, is the transferable quantity between rooms.","Між приміщеннями переносною величиною є точка роси, а не відносна вологість.","Zwischen Räumen ist der Taupunkt die übertragbare Größe, nicht die relative Feuchte.","Tussen ruimten is het dauwpunt de overdraagbare grootheid, niet de relatieve vochtigheid.","Entre locaux, la grandeur transférable est le point de rosée, pas l'humidité relative.","Entre locales la magnitud transferible es el punto de rocío, no la humedad relativa.")},
{id:"P4",g:"prod",c:"law",s:"confirmed",
 t:L("Cold chain continuity","Безперервність холодового ланцюга","Durchgängigkeit der Kühlkette","Continuïteit van de koudeketen","Continuité de la chaîne du froid","Continuidad de la cadena de frío"),
 n:L("Any local reheat, defrost or door event is a break that must be justified and recorded.","Будь-який локальний підігрів, відтавання чи відкриття дверей — це розрив, який треба обґрунтувати й зафіксувати.","Jede lokale Nacherwärmung, Abtauung oder Türöffnung ist eine Unterbrechung, die zu begründen und zu dokumentieren ist.","Elke lokale naverwarming, ontdooiing of deuropening is een onderbreking die onderbouwd en vastgelegd moet worden.","Tout réchauffage local, dégivrage ou ouverture de porte est une rupture à justifier et à enregistrer.","Todo recalentamiento local, desescarche o apertura de puerta es una ruptura que debe justificarse y registrarse.")},
{id:"P5",g:"prod",c:"law",s:"assumed",
 t:L("Cross-contamination between products, batches or material campaigns","Перехресне забруднення між продуктами, партіями чи кампаніями матеріалу","Kreuzkontamination zwischen Produkten, Chargen oder Materialkampagnen","Kruisbesmetting tussen producten, batches of materiaalcampagnes","Contamination croisée entre produits, lots ou campagnes de matière","Contaminación cruzada entre productos, lotes o campañas de material"),
 n:L("Changeover, not steady production, is when the air path usually fails.","Повітряний тракт зазвичай підводить під час переходу, а не в усталеному виробництві.","Der Luftweg versagt meist beim Produktwechsel, nicht im stationären Betrieb.","Het luchtpad faalt meestal bij productwissel, niet bij stabiele productie.","C'est au changement de produit, non en production stable, que le chemin d'air échoue.","El camino del aire falla en el cambio de producto, no en producción estable.")},
{id:"P6",g:"prod",c:"standard",s:"confirmed",
 t:L("Particle cleanliness class of the protected zone","Клас чистоти за частинками захищеної зони","Partikelreinheitsklasse der geschützten Zone","Deeltjesreinheidsklasse van de beschermde zone","Classe de propreté particulaire de la zone protégée","Clase de limpieza de partículas de la zona protegida"),
 n:L("A classification is a measured state in a defined occupancy, not a design promise.","Класифікація — це виміряний стан за визначеної зайнятості, а не проєктна обіцянка.","Eine Klassifizierung ist ein gemessener Zustand bei definierter Belegung, kein Planungsversprechen.","Een classificatie is een gemeten toestand bij gedefinieerde bezetting, geen ontwerpbelofte.","Une classification est un état mesuré dans une occupation définie, pas une promesse de conception.","Una clasificación es un estado medido con una ocupación definida, no una promesa de diseño.")},
{id:"P7",g:"prod",c:"rule",s:"assumed",
 t:L("Air movement over open product or an open bath must be limited","Рух повітря над відкритим продуктом чи ванною має бути обмежений","Luftbewegung über offenem Produkt oder offenem Bad ist zu begrenzen","Luchtbeweging over open product of open bad moet beperkt blijven","Le mouvement d'air au-dessus du produit ou du bain ouvert doit être limité","El movimiento de aire sobre producto o baño abierto debe limitarse"),
 n:L("Evaporation, skinning and weight loss scale with surface velocity.","Випаровування, підсихання кірки та втрата маси зростають зі швидкістю біля поверхні.","Verdunstung, Hautbildung und Gewichtsverlust wachsen mit der Oberflächengeschwindigkeit.","Verdamping, velvorming en gewichtsverlies schalen met de oppervlaktesnelheid.","Évaporation, croûtage et perte de poids croissent avec la vitesse en surface.","La evaporación, la formación de costra y la pérdida de peso crecen con la velocidad superficial.")},
{id:"E1",g:"pers",c:"law",s:"confirmed",
 t:L("Occupational exposure limit for a hazardous substance","Гранично допустима концентрація шкідливої речовини","Arbeitsplatzgrenzwert für einen Gefahrstoff","Grenswaarde voor beroepsmatige blootstelling aan een gevaarlijke stof","Valeur limite d'exposition professionnelle d'une substance dangereuse","Valor límite de exposición profesional de una sustancia peligrosa"),
 n:L("Control at source ranks above dilution in the legal hierarchy of control.","У правовій ієрархії заходів контроль у джерелі стоїть вище за розбавлення.","In der rechtlichen Maßnahmenhierarchie steht Quellenerfassung über Verdünnung.","In de wettelijke beheershiërarchie staat bronaanpak boven verdunning.","Dans la hiérarchie légale des mesures, le captage à la source prime sur la dilution.","En la jerarquía legal de medidas, el control en origen prevalece sobre la dilución.")},
{id:"E2",g:"pers",c:"guidance",s:"confirmed",
 t:L("Heat stress at hot workplaces","Тепловий стрес на гарячих робочих місцях","Hitzebelastung an heißen Arbeitsplätzen","Hittebelasting op hete werkplekken","Contrainte thermique aux postes chauds","Estrés térmico en puestos calientes"),
 n:L("Radiant temperature and local air speed matter more than the room average.","Радіаційна температура й локальна швидкість повітря важливіші за середню по приміщенню.","Strahlungstemperatur und lokale Luftgeschwindigkeit zählen mehr als der Raummittelwert.","Stralingstemperatuur en lokale luchtsnelheid tellen zwaarder dan het ruimtegemiddelde.","La température de rayonnement et la vitesse locale comptent plus que la moyenne du local.","La temperatura radiante y la velocidad local importan más que la media del local.")},
{id:"E3",g:"pers",c:"rule",s:"assumed",
 t:L("Draught, noise and local discomfort at workstations","Протяг, шум і локальний дискомфорт на робочих місцях","Zugluft, Lärm und lokale Unbehaglichkeit an Arbeitsplätzen","Tocht, geluid en lokaal ongerief op werkplekken","Courant d'air, bruit et inconfort local aux postes","Corrientes, ruido e incomodidad local en los puestos"),
 n:L("Make-up air introduced badly is the usual cause of complaints and of bypassed equipment.","Погано введене припливне повітря — звична причина скарг і обходу обладнання.","Schlecht eingebrachte Zuluft ist die übliche Ursache für Beschwerden und umgangene Technik.","Slecht ingebrachte toevoerlucht is de gebruikelijke oorzaak van klachten en omzeilde techniek.","Un air de compensation mal introduit cause plaintes et contournement des équipements.","El aire de compensación mal introducido causa quejas y equipos anulados.")},
{id:"E4",g:"pers",c:"law",s:"confirmed",
 t:L("Oxygen deficiency and confined space entry","Нестача кисню та вхід у замкнений простір","Sauerstoffmangel und Befahren enger Räume","Zuurstoftekort en betreden van besloten ruimten","Manque d'oxygène et entrée en espace confiné","Deficiencia de oxígeno y entrada en espacio confinado"),
 n:L("Ventilation supports the entry permit; it does not replace it.","Вентиляція підтримує наряд-допуск, але не замінює його.","Lüftung unterstützt die Befahrerlaubnis, ersetzt sie aber nicht.","Ventilatie ondersteunt de betredingsvergunning, maar vervangt die niet.","La ventilation appuie le permis d'entrée ; elle ne le remplace pas.","La ventilación apoya el permiso de entrada; no lo sustituye.")},
{id:"E5",g:"pers",c:"law",s:"confirmed",
 t:L("Escape routes, refuge and emergency atmosphere","Шляхи евакуації, укриття та аварійна атмосфера","Fluchtwege, Zufluchtsraum und Notatmosphäre","Vluchtwegen, toevlucht en noodatmosfeer","Voies d'évacuation, refuge et atmosphère de secours","Vías de escape, refugio y atmósfera de emergencia"),
 n:L("Emergency ventilation must not push hot gas or vapour into the escape route.","Аварійна вентиляція не повинна гнати гарячий газ чи пару на шлях евакуації.","Notlüftung darf kein heißes Gas oder Dampf in den Fluchtweg drücken.","Noodventilatie mag geen heet gas of damp de vluchtweg in duwen.","La ventilation de secours ne doit pas pousser gaz chaud ou vapeur dans l'évacuation.","La ventilación de emergencia no debe empujar gas caliente o vapor a la vía de escape.")},
{id:"E6",g:"pers",c:"standard",s:"confirmed",
 t:L("People as a particle and microbiological source","Люди як джерело частинок і мікроорганізмів","Menschen als Partikel- und Keimquelle","Mensen als deeltjes- en kiembron","Les personnes comme source de particules et de germes","Las personas como fuente de partículas y microorganismos"),
 n:L("Gowning, behaviour and flow of people are part of the air concept, not around it.","Одягання, поведінка й потік людей — частина повітряної концепції, а не додаток до неї.","Kleidung, Verhalten und Personenfluss gehören zum Luftkonzept, nicht daneben.","Kleding, gedrag en personenstroom horen bij het luchtconcept, niet ernaast.","Habillage, comportement et flux de personnes font partie du concept d'air, pas à côté.","Vestimenta, comportamiento y flujo de personas forman parte del concepto de aire, no a su lado.")},
{id:"V1",g:"env",c:"standard",s:"confirmed",
 t:L("Outdoor air intake quality and re-entrainment of the own exhaust","Якість зовнішнього повітря на заборі та підсмоктування власного викиду","Außenluftqualität am Ansaug und Rückansaugung der eigenen Fortluft","Buitenluchtkwaliteit bij de inlaat en herinzuiging van de eigen afvoer","Qualité de l'air neuf à la prise et réaspiration du propre rejet","Calidad del aire exterior en la toma y readmisión del propio escape"),
 n:L("Intakes are placed relative to plumes and traffic, not to the nearest free facade.","Забір розміщують відносно факелів і транспорту, а не за найближчим вільним фасадом.","Ansaugungen werden nach Fahnen und Verkehr platziert, nicht nach der nächsten freien Fassade.","Inlaten worden geplaatst ten opzichte van pluimen en verkeer, niet naar de dichtstbijzijnde gevel.","Les prises se placent par rapport aux panaches et au trafic, pas selon la façade libre la plus proche.","Las tomas se ubican respecto a penachos y tráfico, no según la fachada libre más cercana.")},
{id:"V2",g:"env",c:"law",s:"assumed",
 t:L("Emission treatment and discharge conditions of the stack","Очищення викидів та умови їх відведення в трубу","Emissionsbehandlung und Abgabebedingungen des Kamins","Emissiebehandeling en afvoercondities van de schoorsteen","Traitement des émissions et conditions de rejet à la cheminée","Tratamiento de emisiones y condiciones de descarga en chimenea"),
 n:L("Emergency purge can raise the outdoor emission and needs its own assessment.","Аварійне продування може підвищити викид назовні й потребує окремої оцінки.","Notspülung kann die Außenemission erhöhen und braucht eine eigene Bewertung.","Noodspoeling kan de emissie naar buiten verhogen en vraagt een eigen beoordeling.","La purge d'urgence peut accroître l'émission extérieure et exige sa propre évaluation.","La purga de emergencia puede aumentar la emisión exterior y exige su propia evaluación.")},
{id:"V3",g:"env",c:"law",s:"confirmed",
 t:L("Refrigerant safety and machinery room requirements","Безпека холодоагенту та вимоги до машинного відділення","Kältemittelsicherheit und Anforderungen an den Maschinenraum","Koudemiddelveiligheid en eisen aan de machinekamer","Sécurité du fluide frigorigène et exigences du local machines","Seguridad del refrigerante y requisitos de la sala de máquinas"),
 n:L("Charge, class and room volume decide detection, emergency ventilation and access.","Заряд, клас і об'єм приміщення визначають детекцію, аварійну вентиляцію та доступ.","Füllmenge, Klasse und Raumvolumen bestimmen Detektion, Notlüftung und Zugang.","Vulling, klasse en ruimtevolume bepalen detectie, noodventilatie en toegang.","Charge, classe et volume du local déterminent détection, ventilation de secours et accès.","Carga, clase y volumen del local determinan detección, ventilación de emergencia y acceso.")},
{id:"V4",g:"env",c:"guidance",s:"confirmed",
 t:L("Electrical, control and server rooms need protected air","Електротехнічні, диспетчерські та серверні приміщення потребують захищеного повітря","Elektro-, Leit- und Serverräume brauchen geschützte Luft","Elektro-, regel- en serverruimten hebben beschermde lucht nodig","Locaux électriques, de commande et serveurs exigent un air protégé","Salas eléctricas, de control y de servidores necesitan aire protegido"),
 n:L("These rooms usually need overpressure and a filtered, dry supply of their own.","Такі приміщення зазвичай потребують надлишкового тиску й власного фільтрованого сухого припливу.","Diese Räume brauchen meist Überdruck und eigene gefilterte, trockene Zuluft.","Deze ruimten hebben meestal overdruk en een eigen gefilterde, droge toevoer nodig.","Ces locaux exigent en général une surpression et un air neuf filtré et sec propre.","Estos locales suelen requerir sobrepresión y un aire propio filtrado y seco.")},
{id:"V5",g:"env",c:"guidance",s:"confirmed",
 t:L("Space, weight and maintenance access constrain the installation","Простір, маса та доступ для обслуговування обмежують установку","Platz, Gewicht und Wartungszugang begrenzen die Anlage","Ruimte, gewicht en onderhoudstoegang beperken de installatie","L'espace, le poids et l'accès de maintenance contraignent l'installation","Espacio, peso y acceso de mantenimiento limitan la instalación"),
 n:L("A filter that cannot be reached safely will not be changed at the right interval.","Фільтр, до якого не дістатися безпечно, не змінюватимуть у потрібний строк.","Ein nicht sicher erreichbarer Filter wird nicht im richtigen Intervall gewechselt.","Een filter dat niet veilig bereikbaar is, wordt niet op tijd vervangen.","Un filtre inaccessible en sécurité ne sera pas remplacé au bon intervalle.","Un filtro sin acceso seguro no se cambiará en el intervalo correcto.")},
{id:"V6",g:"env",c:"standard",s:"assumed",
 t:L("Vibration, motion and structural interfaces","Вібрація, рух і взаємодія з будівельними конструкціями","Schwingungen, Bewegung und bauliche Schnittstellen","Trilling, beweging en bouwkundige raakvlakken","Vibrations, mouvement et interfaces structurelles","Vibración, movimiento e interfaces estructurales"),
 n:L("On a moving platform, drainage, condensate and duct supports behave differently.","На рухомій платформі дренаж, конденсат і кріплення повітроводів поводяться інакше.","Auf beweglicher Plattform verhalten sich Entwässerung, Kondensat und Kanalhalterungen anders.","Op een bewegend platform gedragen afvoer, condensaat en kanaalophanging zich anders.","Sur une plateforme mobile, drainage, condensat et supports de gaines se comportent autrement.","En una plataforma móvil, drenaje, condensado y soportes de conducto se comportan distinto.")},
{id:"V7",g:"env",c:"method",s:"confirmed",
 t:L("Energy and water consumption of the climate system","Споживання енергії та води системою мікроклімату","Energie- und Wasserverbrauch der Klimaanlage","Energie- en waterverbruik van de klimaatinstallatie","Consommation d'énergie et d'eau du système climatique","Consumo de energía y agua del sistema de clima"),
 n:L("Fan power follows the cube of flow only while the system curve stays unchanged.","Потужність вентилятора змінюється як куб витрати лише доти, доки характеристика мережі незмінна.","Die Ventilatorleistung folgt der dritten Potenz nur bei unveränderter Anlagenkennlinie.","Ventilatorvermogen volgt de derde macht alleen zolang de systeemcurve gelijk blijft.","La puissance du ventilateur suit le cube du débit tant que la courbe réseau reste inchangée.","La potencia del ventilador sigue el cubo del caudal solo si la curva del sistema no cambia.")},
{id:"G1",g:"hyg",c:"guidance",s:"assumed",
 t:L("Wet cleaning regime with foam, water and chemicals","Режим вологого прибирання з піною, водою та хімією","Nassreinigung mit Schaum, Wasser und Chemikalien","Nat reinigen met schuim, water en chemie","Nettoyage humide à la mousse, à l'eau et aux produits chimiques","Limpieza húmeda con espuma, agua y productos químicos"),
 n:L("Cleaning is an operating state with its own air, moisture and aerosol behaviour.","Прибирання — це окремий режим із власною поведінкою повітря, вологи й аерозолю.","Reinigung ist ein Betriebszustand mit eigenem Luft-, Feuchte- und Aerosolverhalten.","Reinigen is een bedrijfstoestand met eigen lucht-, vocht- en aerosolgedrag.","Le nettoyage est un état de fonctionnement avec son propre comportement d'air et d'aérosol.","La limpieza es un estado de operación con su propio comportamiento de aire y aerosol.")},
{id:"G2",g:"hyg",c:"standard",s:"confirmed",
 t:L("Drainable, inspectable air handling unit without standing water","Осушувана та придатна до огляду установка без застійної води","Entwässerbares, inspizierbares Lüftungsgerät ohne stehendes Wasser","Afwaterbare, inspecteerbare luchtbehandelingskast zonder stilstaand water","Centrale drainable et inspectable sans eau stagnante","Climatizador drenable e inspeccionable sin agua estancada"),
 n:L("Trays, traps and drains must be reachable and demonstrably working, in every season.","Піддони, сифони й дренажі мають бути досяжними та доказово працювати в будь-який сезон.","Wannen, Siphons und Abläufe müssen erreichbar und nachweislich wirksam sein, jederzeit.","Bakken, sifons en afvoeren moeten bereikbaar zijn en aantoonbaar werken, elk seizoen.","Bacs, siphons et drains doivent être accessibles et fonctionner de façon démontrable, en toute saison.","Bandejas, sifones y drenajes deben ser accesibles y funcionar demostrablemente en toda estación.")},
{id:"G3",g:"hyg",c:"standard",s:"confirmed",
 t:L("Cleanable duct interior with real access points","Очищуваний внутрішній простір повітроводів із реальними люками","Reinigbares Kanalinneres mit tatsächlichen Zugängen","Reinigbaar kanaalinwendige met echte toegangspunten","Intérieur de gaine nettoyable avec accès réels","Interior de conducto limpiable con accesos reales"),
 n:L("An access door drawn on a plan is not an access door reachable on site.","Люк, намальований на плані, — це не люк, досяжний на місці.","Eine im Plan gezeichnete Reinigungsöffnung ist keine vor Ort erreichbare Öffnung.","Een op tekening getekend inspectieluik is nog geen bereikbaar luik ter plaatse.","Une trappe dessinée sur plan n'est pas une trappe accessible sur site.","Una trampilla dibujada en plano no es una trampilla accesible en obra.")},
{id:"G4",g:"hyg",c:"rule",s:"assumed",
 t:L("Greasy, fibrous or lint deposit inside the extract path","Жирові, волокнисті чи ворсові відкладення у витяжному тракті","Fett-, Faser- oder Flusenablagerung im Abluftweg","Vet-, vezel- of pluisafzetting in het afvoertraject","Dépôt gras, fibreux ou de peluche dans le circuit d'extraction","Depósito graso, fibroso o de pelusa en el circuito de extracción"),
 n:L("Deposit rate is set by the process, so cleaning intervals follow inspection, not a calendar.","Швидкість відкладень задає процес, тож інтервали чищення визначає огляд, а не календар.","Die Ablagerungsrate bestimmt der Prozess; Reinigungsintervalle folgen der Inspektion, nicht dem Kalender.","De afzettingssnelheid volgt uit het proces; reinigingsintervallen volgen inspectie, geen kalender.","Le taux de dépôt vient du procédé ; les intervalles suivent l'inspection, pas le calendrier.","La tasa de depósito la fija el proceso; los intervalos siguen la inspección, no el calendario.")},
{id:"G5",g:"hyg",c:"guidance",s:"confirmed",
 t:L("Filter change without a secondary release into the room","Заміна фільтра без вторинного викиду в приміщення","Filterwechsel ohne Sekundärfreisetzung in den Raum","Filterwissel zonder secundaire emissie naar de ruimte","Changement de filtre sans émission secondaire dans le local","Cambio de filtro sin emisión secundaria al local"),
 n:L("The loaded filter is process material and needs a defined route out.","Завантажений фільтр — це технологічний матеріал, який потребує визначеного маршруту виведення.","Der beladene Filter ist Prozessmaterial und braucht einen definierten Abtransportweg.","Het beladen filter is procesmateriaal en heeft een vastgelegde afvoerroute nodig.","Le filtre chargé est un matériau de procédé et exige une voie de sortie définie.","El filtro cargado es material de proceso y necesita una ruta de salida definida.")},
{id:"G6",g:"hyg",c:"standard",s:"confirmed",
 t:L("Zone separation with airlocks and defined material routes","Розділення зон шлюзами та визначеними маршрутами матеріалів","Zonentrennung mit Schleusen und definierten Materialwegen","Zonescheiding met sluizen en vastgelegde materiaalroutes","Séparation de zones par sas et itinéraires de matières définis","Separación de zonas con esclusas y rutas de material definidas"),
 n:L("A pressure difference without a defined leakage area and door schedule proves nothing.","Перепад тиску без визначеної площі нещільностей і графіка дверей нічого не доводить.","Ein Druckunterschied ohne definierte Leckfläche und Türregime beweist nichts.","Een drukverschil zonder gedefinieerd lekoppervlak en deurregime bewijst niets.","Un écart de pression sans surface de fuite ni régime de portes définis ne prouve rien.","Una diferencia de presión sin superficie de fuga ni régimen de puertas definido no prueba nada.")},
{id:"X1",g:"ex",c:"law",s:"confirmed",
 t:L("Hazardous area classification for flammable gas and vapour","Класифікація вибухонебезпечних зон за горючими газами та парами","Zoneneinteilung für brennbare Gase und Dämpfe","Zone-indeling voor brandbare gassen en dampen","Classement de zone pour gaz et vapeurs inflammables","Clasificación de zonas para gases y vapores inflamables"),
 n:L("Ventilation may reduce a zone only if its effectiveness and availability are demonstrated.","Вентиляція може зменшити зону лише за доведених ефективності та доступності.","Lüftung darf eine Zone nur mindern, wenn Wirksamkeit und Verfügbarkeit nachgewiesen sind.","Ventilatie mag een zone alleen beperken als effectiviteit en beschikbaarheid zijn aangetoond.","La ventilation ne peut réduire une zone que si efficacité et disponibilité sont démontrées.","La ventilación solo reduce una zona si se demuestran su eficacia y disponibilidad.")},
{id:"X2",g:"ex",c:"law",s:"confirmed",
 t:L("Hazardous area classification for combustible dust","Класифікація вибухонебезпечних зон за горючим пилом","Zoneneinteilung für brennbaren Staub","Zone-indeling voor brandbaar stof","Classement de zone pour poussières combustibles","Clasificación de zonas para polvos combustibles"),
 n:L("Housekeeping and inspection are barriers with the same status as hardware.","Прибирання й огляд — це бар'єри з тим самим статусом, що й обладнання.","Sauberkeit und Inspektion sind Barrieren mit demselben Status wie Hardware.","Huishouding en inspectie zijn barrières met dezelfde status als hardware.","La propreté et l'inspection sont des barrières au même titre que le matériel.","El orden y la inspección son barreras con el mismo estatus que el equipo.")},
{id:"X3",g:"ex",c:"standard",s:"confirmed",
 t:L("Ignition sources: sparks, hot surfaces and static electricity","Джерела запалювання: іскри, гарячі поверхні та статична електрика","Zündquellen: Funken, heiße Oberflächen und statische Elektrizität","Ontstekingsbronnen: vonken, hete oppervlakken en statische elektriciteit","Sources d'inflammation : étincelles, surfaces chaudes et électricité statique","Fuentes de ignición: chispas, superficies calientes y electricidad estática"),
 n:L("Bonding and earthing continuity is part of the ventilation scope when ducts carry dust.","Безперервність зрівнювання потенціалів і заземлення входить у сферу вентиляції, коли повітроводи несуть пил.","Potentialausgleich und Erdungsdurchgängigkeit gehören zum Lüftungsumfang, wenn Kanäle Staub führen.","Vereffening en aardingscontinuïteit horen bij de ventilatiescope als kanalen stof voeren.","La continuité d'équipotentialité et de mise à la terre relève de la ventilation si les gaines portent de la poussière.","La continuidad de equipotencialidad y puesta a tierra pertenece al alcance de ventilación si los conductos llevan polvo.")},
{id:"X4",g:"ex",c:"standard",s:"confirmed",
 t:L("Explosion isolation, venting or suppression of the collector","Вибухова розв'язка, скидання чи придушення на пиловловлювачі","Explosionsentkopplung, Druckentlastung oder Unterdrückung am Abscheider","Explosie-isolatie, ontlasting of onderdrukking van de afscheider","Découplage, évent ou suppression d'explosion sur le dépoussiéreur","Aislamiento, alivio o supresión de explosión en el separador"),
 n:L("The collector must not become the path that carries flame back to the machines.","Пиловловлювач не має стати шляхом повернення полум'я до машин.","Der Abscheider darf nicht zum Weg werden, der die Flamme zurück zu den Maschinen führt.","De afscheider mag niet het pad worden dat vlam terugvoert naar de machines.","Le dépoussiéreur ne doit pas devenir le chemin ramenant la flamme aux machines.","El separador no debe convertirse en el camino que devuelve la llama a las máquinas.")},
{id:"X5",g:"ex",c:"law",s:"assumed",
 t:L("Fire and smoke spread through the ventilation system","Поширення вогню та диму системою вентиляції","Brand- und Rauchausbreitung über die Lüftungsanlage","Brand- en rookverspreiding via het ventilatiesysteem","Propagation du feu et de la fumée par la ventilation","Propagación de fuego y humo por la ventilación"),
 n:L("Ventilation is a fire connection between compartments before it is a safety measure.","Вентиляція — це насамперед пожежний зв'язок між відсіками, а вже потім захід безпеки.","Lüftung ist zuerst eine Brandverbindung zwischen Abschnitten, dann eine Schutzmaßnahme.","Ventilatie is eerst een brandverbinding tussen compartimenten, daarna een veiligheidsmaatregel.","La ventilation est d'abord une liaison incendie entre compartiments, ensuite une mesure de sécurité.","La ventilación es primero una conexión de incendio entre sectores y después una medida de seguridad.")},
{id:"X6",g:"ex",c:"standard",s:"confirmed",
 t:L("Extinguishing media that are incompatible with running ventilation","Вогнегасні речовини, несумісні з працюючою вентиляцією","Löschmittel, die mit laufender Lüftung unverträglich sind","Blusmiddelen die onverenigbaar zijn met draaiende ventilatie","Agents extincteurs incompatibles avec une ventilation en marche","Agentes extintores incompatibles con la ventilación en marcha"),
 n:L("Total flooding needs a closed, evacuated space and a defined hold time.","Об'ємне гасіння потребує закритого, евакуйованого простору й визначеного часу утримання.","Vollflutung erfordert einen geschlossenen, geräumten Raum und eine definierte Haltezeit.","Volledige verdringing vereist een gesloten, ontruimde ruimte en een gedefinieerde houdtijd.","Le noyage total exige un local fermé, évacué, et un temps de maintien défini.","La inundación total exige un local cerrado, evacuado y un tiempo de retención definido.")},
{id:"X7",g:"ex",c:"standard",s:"confirmed",
 t:L("Hydrogen release during battery charging","Виділення водню під час заряджання акумуляторів","Wasserstofffreisetzung beim Laden von Batterien","Waterstofemissie bij het laden van accu's","Dégagement d'hydrogène lors de la charge des batteries","Liberación de hidrógeno durante la carga de baterías"),
 n:L("Hydrogen collects at the ceiling; a low extract point does not see it.","Водень збирається під стелею; нижня точка витяжки його не бачить.","Wasserstoff sammelt sich an der Decke; ein tiefer Absaugpunkt erfasst ihn nicht.","Waterstof verzamelt zich tegen het plafond; een laag afzuigpunt ziet het niet.","L'hydrogène s'accumule au plafond ; un point d'extraction bas ne le voit pas.","El hidrógeno se acumula en el techo; un punto de extracción bajo no lo detecta.")},
{id:"C1",g:"corr",c:"method",s:"confirmed",
 t:L("Surface condensation on ceilings, ducts and cable trays","Поверхнева конденсація на стелях, повітроводах і кабельних лотках","Oberflächenkondensation an Decken, Kanälen und Kabeltrassen","Oppervlaktecondensatie op plafonds, kanalen en kabelgoten","Condensation superficielle sur plafonds, gaines et chemins de câbles","Condensación superficial en techos, conductos y bandejas de cables"),
 n:L("Drip formation is a direct hygienic route to the product below.","Утворення крапель — прямий гігієнічний шлях до продукту внизу.","Tropfenbildung ist ein direkter hygienischer Weg zum darunterliegenden Produkt.","Druppelvorming is een directe hygiënische route naar het product eronder.","La formation de gouttes est une voie hygiénique directe vers le produit en dessous.","La formación de gotas es una vía higiénica directa hacia el producto de abajo.")},
{id:"C2",g:"corr",c:"guidance",s:"confirmed",
 t:L("Corrosive process atmosphere attacking the ventilation itself","Корозійна технологічна атмосфера, що руйнує саму вентиляцію","Korrosive Prozessatmosphäre greift die Lüftung selbst an","Corrosieve procesatmosfeer tast de ventilatie zelf aan","Atmosphère de procédé corrosive attaquant la ventilation elle-même","Atmósfera de proceso corrosiva que ataca la propia ventilación"),
 n:L("The ventilation can become the hidden common-cause failure of the safety function.","Вентиляція може стати прихованою відмовою із загальної причини для функції безпеки.","Die Lüftung kann zum verdeckten Common-Cause-Ausfall der Sicherheitsfunktion werden.","De ventilatie kan de verborgen common-cause storing van de veiligheidsfunctie worden.","La ventilation peut devenir la défaillance de cause commune cachée de la fonction de sûreté.","La ventilación puede ser el fallo de causa común oculto de la función de seguridad.")},
{id:"C3",g:"corr",c:"rule",s:"assumed",
 t:L("Salt, humidity and marine atmosphere","Сіль, волога та морська атмосфера","Salz, Feuchte und Meeresatmosphäre","Zout, vocht en zeeatmosfeer","Sel, humidité et atmosphère marine","Sal, humedad y atmósfera marina"),
 n:L("Coatings, filters and dampers age faster than the shore-based experience suggests.","Покриття, фільтри й заслінки старіють швидше, ніж підказує береговий досвід.","Beschichtungen, Filter und Klappen altern schneller als landgestützte Erfahrung nahelegt.","Coatings, filters en kleppen verouderen sneller dan de ervaring aan wal suggereert.","Revêtements, filtres et registres vieillissent plus vite que ne le suggère l'expérience à terre.","Recubrimientos, filtros y compuertas envejecen más rápido de lo que sugiere la experiencia en tierra.")},
{id:"C4",g:"corr",c:"guidance",s:"confirmed",
 t:L("Condensate or moisture path into electrical rooms","Шлях конденсату або вологи в електроприміщення","Kondensat- oder Feuchteweg in Elektroräume","Condensaat- of vochtroute naar elektroruimten","Chemin de condensat ou d'humidité vers les locaux électriques","Ruta de condensado o humedad hacia salas eléctricas"),
 n:L("Physical separation is required; a slope and a tray are not a barrier.","Потрібне фізичне розділення; ухил і піддон бар'єром не є.","Erforderlich ist physische Trennung; Gefälle und Wanne sind keine Barriere.","Fysieke scheiding is vereist; afschot en een bak zijn geen barrière.","Une séparation physique est requise ; une pente et un bac ne sont pas une barrière.","Se requiere separación física; una pendiente y una bandeja no son una barrera.")},
{id:"C5",g:"corr",c:"guidance",s:"assumed",
 t:L("Corrosion under insulation and in hidden duct sections","Корозія під ізоляцією та в прихованих ділянках повітроводів","Korrosion unter Dämmung und in verdeckten Kanalabschnitten","Corrosie onder isolatie en in verborgen kanaaldelen","Corrosion sous calorifuge et dans les tronçons de gaine cachés","Corrosión bajo aislamiento y en tramos ocultos de conducto"),
 n:L("What cannot be inspected will be discovered at the moment it fails.","Те, що неможливо оглянути, виявиться в момент відмови.","Was nicht inspizierbar ist, wird im Moment des Versagens entdeckt.","Wat niet inspecteerbaar is, wordt ontdekt op het moment van falen.","Ce qui n'est pas inspectable se découvre au moment de la défaillance.","Lo que no se puede inspeccionar se descubre en el momento del fallo.")},
{id:"O1",g:"ops",c:"guidance",s:"confirmed",
 t:L("Production, cleaning, drying and standstill are separate modes","Виробництво, прибирання, сушіння та простій — окремі режими","Produktion, Reinigung, Trocknung und Stillstand sind eigene Zustände","Productie, reiniging, droging en stilstand zijn aparte modi","Production, nettoyage, séchage et arrêt sont des modes distincts","Producción, limpieza, secado y parada son modos distintos"),
 n:L("Every transition needs a trigger, a permissive and a confirmation.","Кожен перехід потребує тригера, дозволу та підтвердження.","Jeder Übergang braucht Auslöser, Freigabe und Bestätigung.","Elke overgang heeft een trigger, permissie en bevestiging nodig.","Chaque transition exige un déclencheur, une permission et une confirmation.","Cada transición exige un disparador, un permisivo y una confirmación.")},
{id:"O2",g:"ops",c:"rule",s:"confirmed",
 t:L("Batch and event-driven emission peaks","Пікові виділення за партіями та подіями","Chargen- und ereignisgesteuerte Emissionsspitzen","Batch- en gebeurtenisgestuurde emissiepieken","Pics d'émission par lots et par événements","Picos de emisión por lotes y por eventos"),
 n:L("An averaged emission factor hides the peak the hood must actually catch.","Усереднений коефіцієнт викиду приховує пік, який має вловити зонт.","Ein gemittelter Emissionsfaktor verdeckt die Spitze, die die Haube erfassen muss.","Een gemiddelde emissiefactor verbergt de piek die de kap moet vangen.","Un facteur d'émission moyen masque le pic que la hotte doit réellement capter.","Un factor de emisión promedio oculta el pico que la campana debe captar.")},
{id:"O3",g:"ops",c:"standard",s:"confirmed",
 t:L("Behaviour on loss of extraction or fan failure","Поведінка при втраті витяжки чи відмові вентилятора","Verhalten bei Verlust der Absaugung oder Ventilatorausfall","Gedrag bij verlies van afzuiging of ventilatoruitval","Comportement en cas de perte d'extraction ou de panne de ventilateur","Comportamiento ante pérdida de extracción o fallo de ventilador"),
 n:L("A fan status contact is not proof of flow; the permissive should watch the process quantity.","Контакт стану вентилятора не доводить наявність витрати; дозвіл має спиратися на технологічну величину.","Ein Ventilatorstatuskontakt beweist keinen Volumenstrom; die Freigabe soll die Prozessgröße überwachen.","Een ventilatorstatuscontact bewijst geen debiet; de permissie moet de procesgrootheid bewaken.","Un contact d'état de ventilateur ne prouve pas le débit ; la permission doit surveiller la grandeur du procédé.","Un contacto de estado de ventilador no prueba caudal; el permisivo debe vigilar la magnitud del proceso.")},
{id:"O4",g:"ops",c:"law",s:"confirmed",
 t:L("Fire and emergency mode against the normal ventilation function","Пожежний та аварійний режим проти нормальної функції вентиляції","Brand- und Notbetrieb gegen die normale Lüftungsfunktion","Brand- en noodbedrijf tegenover de normale ventilatiefunctie","Mode incendie et secours face à la fonction normale de ventilation","Modo de incendio y emergencia frente a la función normal de ventilación"),
 n:L("Priority between conflicting functions belongs in a written cause-and-effect matrix.","Пріоритет між суперечливими функціями має бути в письмовій матриці причина-наслідок.","Die Priorität zwischen widersprüchlichen Funktionen gehört in eine schriftliche Ursache-Wirkungs-Matrix.","De prioriteit tussen strijdige functies hoort in een geschreven oorzaak-gevolgmatrix.","La priorité entre fonctions contradictoires appartient à une matrice cause-effet écrite.","La prioridad entre funciones contradictorias pertenece a una matriz causa-efecto escrita.")},
{id:"O5",g:"ops",c:"standard",s:"confirmed",
 t:L("Redundancy, one train out and loss of power","Резервування, вихід з ладу однієї лінії та втрата живлення","Redundanz, Ausfall eines Strangs und Spannungsverlust","Redundantie, één trein uit en spanningsverlies","Redondance, une file hors service et perte d'alimentation","Redundancia, un tren fuera de servicio y pérdida de alimentación"),
 n:L("A function that must never stop needs availability, not only a design flow rate.","Функція, яка не має спинятися, потребує доступності, а не лише проєктної витрати.","Eine Funktion, die nie ausfallen darf, braucht Verfügbarkeit, nicht nur einen Auslegungsvolumenstrom.","Een functie die nooit mag stoppen heeft beschikbaarheid nodig, niet alleen een ontwerpdebiet.","Une fonction qui ne doit jamais s'arrêter exige de la disponibilité, pas seulement un débit de conception.","Una función que nunca debe parar exige disponibilidad, no solo un caudal de diseño.")},
{id:"O6",g:"ops",c:"guidance",s:"confirmed",
 t:L("Start-up, purge and safe release for maintenance","Пуск, продування та безпечна передача в обслуговування","Anfahren, Spülen und sichere Freigabe zur Wartung","Opstarten, spoelen en veilige vrijgave voor onderhoud","Démarrage, purge et libération sûre pour la maintenance","Arranque, purga y liberación segura para mantenimiento"),
 n:L("Release for work is procedural and instrumented, never a verbal statement.","Передача до робіт є процедурною й приладово підтвердженою, а не усною заявою.","Die Arbeitsfreigabe ist prozedural und messtechnisch belegt, nie eine mündliche Aussage.","Werkvrijgave is procedureel en instrumenteel geborgd, nooit een mondelinge uitspraak.","La libération de travail est procédurale et instrumentée, jamais une déclaration orale.","La liberación para trabajo es procedimental e instrumentada, nunca una declaración verbal.")},
{id:"O7",g:"ops",c:"method",s:"confirmed",
 t:L("Commissioning proof and periodic re-verification","Доказ при введенні в експлуатацію та періодична переперевірка","Nachweis bei Inbetriebnahme und wiederkehrende Überprüfung","Bewijs bij inbedrijfstelling en periodieke herverificatie","Preuve à la mise en service et re-vérification périodique","Prueba en puesta en marcha y reverificación periódica"),
 n:L("Acceptance rests on flow direction, control of the parameter and alarm action together.","Приймання спирається на напрямок потоку, керування параметром і дію сигналізації разом.","Die Abnahme stützt sich gemeinsam auf Strömungsrichtung, Parameterführung und Alarmreaktion.","Acceptatie rust samen op stromingsrichting, parameterbeheersing en alarmactie.","La réception repose ensemble sur le sens d'écoulement, la maîtrise du paramètre et l'action d'alarme.","La aceptación se apoya conjuntamente en el sentido del flujo, el control del parámetro y la acción de alarma.")}
];

var MS=[

{id:"m_lidclose",ap:"H2",c:"guidance",s:"confirmed",

{id:"m_dedicatedcool",ap:"H3",c:"method",s:"confirmed",

{id:"m_hotaisle",ap:"H3",c:"guidance",s:"confirmed",

{id:"m_dryerexh",ap:"H4",c:"guidance",s:"confirmed",

{id:"m_hrw_plate",ap:"H4",c:"standard",s:"confirmed",

{id:"m_smoketest",ap:"O7",c:"method",s:"confirmed",

{id:"m_reverify",ap:"O7",c:"standard",s:"confirmed",

var RULES=[
{id:"k04",k:"hard",a:"m_pos",b:"m_neg",
 x:L("One room cannot be above and below the surrounding pressure at the same time. When a zone must protect open product and also contain a flammable or toxic release, the answer is a physical barrier with an airlock — a sandwich or bubble arrangement — not a single pressure setpoint.","Одне приміщення не може бути водночас під надлишковим і зниженим тиском щодо оточення. Коли зона має захищати відкритий продукт і водночас утримувати горючий чи токсичний викид, відповідь — фізичний бар'єр зі шлюзом (схема «сендвіч» або «бульбашка»), а не одна уставка тиску.","Ein Raum kann nicht gleichzeitig über und unter dem Umgebungsdruck liegen. Muss eine Zone offenes Produkt schützen und zugleich eine brennbare oder toxische Freisetzung einschließen, ist die Antwort eine physische Barriere mit Schleuse — Sandwich- oder Bubble-Anordnung — und kein einzelner Drucksollwert.","Eén ruimte kan niet tegelijk boven en onder de omgevingsdruk staan. Moet een zone open product beschermen én een brandbare of toxische emissie insluiten, dan is het antwoord een fysieke barrière met sluis — sandwich- of bubble-opzet — en niet één druksetpoint.","Un même local ne peut être à la fois au-dessus et au-dessous de la pression environnante. Si une zone doit protéger un produit ouvert et confiner un dégagement inflammable ou toxique, la réponse est une barrière physique avec sas — dispositif sandwich ou bulle — pas une consigne de pression unique.","Un mismo local no puede estar a la vez por encima y por debajo de la presión del entorno. Si una zona debe proteger producto abierto y contener una emisión inflamable o tóxica, la respuesta es una barrera física con esclusa — disposición sándwich o burbuja — no una única consigna de presión.")},
{id:"k06",k:"hard",a:"m_highvel",b:"m_lowvel",
 x:L("Capture velocity and evaporation control pull in opposite directions over the same surface. Raising the slot velocity to catch the plume also raises mass transfer from the open bath or product; the two requirements are resolved by enclosure, a lip or a flange, not by one velocity figure.","Швидкість вловлювання та обмеження випаровування тягнуть у протилежні боки над однією поверхнею. Підвищення швидкості у щілині для захоплення факела збільшує й масообмін із відкритої ванни чи продукту; ці дві вимоги вирішують кожухом, бортовим відсмоктуванням чи фланцем, а не однією цифрою швидкості.","Erfassungsgeschwindigkeit und Verdunstungsbegrenzung wirken über derselben Fläche gegeneinander. Eine höhere Schlitzgeschwindigkeit zum Erfassen der Fahne erhöht auch den Stoffübergang vom offenen Bad oder Produkt; gelöst wird das durch Kapselung, Randabsaugung oder Flansch, nicht durch eine Geschwindigkeitszahl.","Vangsnelheid en verdampingsbeheersing werken boven hetzelfde oppervlak tegen elkaar in. Een hogere sleufsnelheid om de pluim te vangen verhoogt ook de massaoverdracht van het open bad of product; dat lost men op met inkapseling, randafzuiging of flens, niet met één snelheidsgetal.","Vitesse de captation et maîtrise de l'évaporation s'opposent au-dessus de la même surface. Augmenter la vitesse à la fente pour capter le panache augmente aussi le transfert de masse depuis le bain ou le produit ouvert ; on résout par encoffrement, aspiration à fente latérale ou collerette, pas par un chiffre de vitesse.","La velocidad de captación y el control de la evaporación tiran en sentidos opuestos sobre la misma superficie. Subir la velocidad en la ranura para captar el penacho también aumenta la transferencia de masa del baño o producto abierto; se resuelve con encapsulado, aspiración de borde o pestaña, no con una cifra de velocidad.")},
{id:"k08",k:"hard",a:"m_wetclean",b:"m_dryclean",
 x:L("These are two mutually exclusive cleaning regimes for the same room. The choice determines the moisture load, the drainage, the surface finish, the electrical protection and the drying time, so it cannot be left open in the design basis.","Це два взаємовиключні режими прибирання для одного приміщення. Вибір визначає вологісне навантаження, дренаж, оздоблення поверхонь, електрозахист і час сушіння, тож у проєктній основі його не можна лишати відкритим.","Das sind zwei einander ausschließende Reinigungsregime für denselben Raum. Die Wahl bestimmt Feuchtelast, Entwässerung, Oberflächenausführung, Elektroschutz und Trocknungszeit und darf in der Auslegungsgrundlage nicht offen bleiben.","Dit zijn twee elkaar uitsluitende reinigingsregimes voor dezelfde ruimte. De keuze bepaalt vochtlast, afwatering, oppervlakteafwerking, elektrische bescherming en droogtijd en mag in de ontwerpbasis niet open blijven.","Ce sont deux régimes de nettoyage mutuellement exclusifs pour le même local. Le choix détermine la charge d'humidité, le drainage, la finition des surfaces, la protection électrique et le temps de séchage : il ne peut rester ouvert dans la base de conception.","Son dos regímenes de limpieza mutuamente excluyentes para el mismo local. La elección determina la carga de humedad, el drenaje, el acabado de superficies, la protección eléctrica y el tiempo de secado: no puede quedar abierta en la base de diseño.")},
{id:"k18",k:"hard",a:"m_defrost_all",b:"m_contcold",
 x:L("Defrosting every evaporator at once injects heat and water vapour into the room at the same moment. A narrow temperature band and the product cannot ride through that; defrost has to be staggered per battery or per zone so that cooling capacity is never fully absent.","Одночасне відтавання всіх випарників подає теплоту й водяну пару в приміщення в один момент. Вузький температурний діапазон і продукт цього не витримають; відтавання слід рознести по батареях або зонах, щоб холодопродуктивність ніколи не зникала повністю.","Das gleichzeitige Abtauen aller Verdampfer bringt Wärme und Wasserdampf im selben Moment in den Raum. Ein enges Temperaturband und das Produkt überstehen das nicht; das Abtauen ist je Batterie oder Zone zu staffeln, damit Kälteleistung nie ganz fehlt.","Alle verdampers tegelijk ontdooien brengt warmte en waterdamp op hetzelfde moment de ruimte in. Een smalle temperatuurband en het product houden dat niet; ontdooien moet per batterij of zone gespreid, zodat er nooit volledig koelvermogen ontbreekt.","Dégivrer tous les évaporateurs en même temps injecte chaleur et vapeur d'eau au même instant. Une plage étroite et le produit ne l'absorbent pas ; le dégivrage doit être décalé par batterie ou par zone pour ne jamais perdre toute la puissance frigorifique.","Desescarchar todos los evaporadores a la vez inyecta calor y vapor de agua en el mismo instante. Una banda estrecha y el producto no lo soportan; el desescarche debe escalonarse por batería o zona para que nunca falte toda la potencia frigorífica.")},
{id:"k14",k:"hard",a:"m_inert",b:"m_openpurge",
 x:L("A continuous outdoor-air purge through the enclosure destroys the inert atmosphere it is meant to protect. Purging and inerting are alternating states governed by permissives and by an oxygen measurement, never simultaneous ones.","Безперервне продування кожуха зовнішнім повітрям руйнує ту інертну атмосферу, яку мало б захищати. Продування й інертизація — це почергові стани, керовані дозволами та вимірюванням кисню, а не одночасні.","Eine kontinuierliche Außenluftspülung durch die Kapselung zerstört genau die Inertatmosphäre, die sie schützen soll. Spülen und Inertisieren sind wechselnde, über Freigaben und Sauerstoffmessung gesteuerte Zustände, keine gleichzeitigen.","Een continue buitenluchtspoeling door de omhulling vernietigt juist de inerte atmosfeer die zij moet beschermen. Spoelen en inertiseren zijn afwisselende toestanden, gestuurd door permissies en een zuurstofmeting, nooit gelijktijdige.","Une purge continue d'air extérieur à travers l'encoffrement détruit l'atmosphère inerte qu'elle est censée protéger. Purge et inertage sont des états alternés, pilotés par des permissions et une mesure d'oxygène, jamais simultanés.","Una purga continua con aire exterior a través del encapsulado destruye la atmósfera inerte que debe proteger. Purga e inertizado son estados alternos, gobernados por permisivos y una medida de oxígeno, nunca simultáneos.")},
{id:"k20",k:"hard",a:"m_totalflood",b:"m_contvent",
 x:L("Total flooding needs a closed, evacuated space and a defined hold time for the agent concentration. Ventilation that cannot be stopped removes the agent and the hold time, so the space then has neither a working extinguishing system nor a defensible ventilation function.","Об'ємне гасіння потребує закритого, евакуйованого простору та визначеного часу утримання концентрації. Вентиляція, яку не можна зупинити, виносить речовину й руйнує час утримання, тож приміщення не має ні працездатної системи гасіння, ні захищуваної функції вентиляції.","Vollflutung braucht einen geschlossenen, geräumten Raum und eine definierte Haltezeit der Löschmittelkonzentration. Eine nicht abschaltbare Lüftung trägt das Mittel aus und zerstört die Haltezeit; der Raum hat dann weder eine wirksame Löschanlage noch eine vertretbare Lüftungsfunktion.","Volledige verdringing vereist een gesloten, ontruimde ruimte en een gedefinieerde houdtijd van de concentratie. Ventilatie die niet kan stoppen voert het middel af en vernietigt de houdtijd; de ruimte heeft dan noch een werkende blusinstallatie noch een verdedigbare ventilatiefunctie.","Le noyage total exige un local fermé, évacué, et un temps de maintien défini de la concentration. Une ventilation impossible à arrêter évacue l'agent et détruit ce temps ; le local n'a alors ni système d'extinction efficace ni fonction de ventilation défendable.","La inundación total exige un local cerrado, evacuado y un tiempo de retención definido de la concentración. Una ventilación que no puede pararse arrastra el agente y destruye ese tiempo; el local no tiene entonces ni extinción eficaz ni función de ventilación defendible.")},
{id:"k22",k:"hard",a:"m_hrw_dirty",b:"m_ductclean",
 x:L("Recovery surfaces placed directly in a greasy, fibrous or dust-laden exhaust become deposit traps and a fire load in the part of the system that was supposed to stay cleanable. Either the recovery is separated from the dirty stream, or the cleanability requirement is dropped — and the design basis has to say which.","Поверхні рекуперації, розміщені просто в жирному, волокнистому чи запиленому викиді, стають пастками для відкладень і пожежним навантаженням у тій частині системи, яка мала лишатися очищуваною. Або рекуперацію відокремлюють від брудного потоку, або відмовляються від вимоги очищуваності — і проєктна основа має це сказати.","Rückgewinnungsflächen direkt in fett-, faser- oder staubhaltiger Abluft werden zu Ablagerungsfallen und Brandlast in dem Anlagenteil, der reinigbar bleiben sollte. Entweder wird die Rückgewinnung vom schmutzigen Strom getrennt, oder die Reinigbarkeitsforderung entfällt — die Auslegungsgrundlage muss es benennen.","Terugwinoppervlakken rechtstreeks in vette, vezelrijke of stoffige afvoerlucht worden afzettingsvallen en brandlast in juist dat deel dat reinigbaar moest blijven. Óf de terugwinning wordt van de vuile stroom gescheiden, óf de reinigbaarheidseis vervalt — en de ontwerpbasis moet dat zeggen.","Des surfaces de récupération placées directement dans un rejet gras, fibreux ou chargé de poussière deviennent des pièges à dépôts et une charge d'incendie dans la partie censée rester nettoyable. Soit la récupération est séparée du flux sale, soit l'exigence de nettoyabilité tombe — et la base de conception doit trancher.","Las superficies de recuperación colocadas directamente en un escape graso, fibroso o cargado de polvo se convierten en trampas de depósito y carga de incendio en la parte que debía seguir siendo limpiable. O se separa la recuperación del flujo sucio, o se abandona el requisito de limpiabilidad — y la base de diseño debe decidirlo.")},
{id:"k11",k:"hard",a:"m_return_collector",b:"m_room_nozone",
 x:L("A return duct from a collector handling combustible dust is a credible path for dust and for flame and pressure propagation. Returning that air keeps the workroom inside the hazardous area instead of outside it, and the zone drawing has to say so.","Зворотний повітровід від пиловловлювача з горючим пилом — вірогідний шлях для пилу та для поширення полум'я й тиску. Повернення цього повітря лишає робоче приміщення всередині вибухонебезпечної зони, а не поза нею, і це має бути показано на схемі зон.","Ein Rückluftkanal von einem Abscheider mit brennbarem Staub ist ein plausibler Weg für Staub sowie für Flammen- und Druckfortpflanzung. Die Rückführung hält den Arbeitsraum innerhalb der Ex-Zone statt außerhalb, und der Zonenplan muss das ausweisen.","Een retourkanaal vanaf een afscheider met brandbaar stof is een geloofwaardig pad voor stof en voor vlam- en drukvoortplanting. Terugvoeren houdt de werkruimte binnen de gevarenzone in plaats van erbuiten, en de zonetekening moet dat tonen.","Une gaine de retour depuis un dépoussiéreur traitant une poussière combustible est un chemin crédible pour la poussière et pour la propagation de flamme et de pression. Ce retour maintient l'atelier dans la zone dangereuse au lieu de l'en sortir, et le plan de zonage doit l'indiquer.","Un conducto de retorno desde un separador con polvo combustible es una vía creíble para el polvo y para la propagación de llama y presión. Ese retorno mantiene la sala dentro de la zona clasificada en lugar de fuera, y el plano de zonas debe reflejarlo.")},
{id:"k12",k:"hard",a:"m_naturalvent",b:"m_neg",
 x:L("A buoyancy-driven opening reverses with wind, with outdoor temperature and as soon as the process stops. A guaranteed pressure direction cannot rest on an opening whose flow direction is not controlled and not measured.","Отвір, що працює на тепловому напорі, змінює напрямок від вітру, зовнішньої температури та щойно зупиниться процес. Гарантований напрямок тиску не може спиратися на отвір, напрямок течії в якому не керується й не вимірюється.","Eine auftriebsgetriebene Öffnung kehrt sich bei Wind, bei anderer Außentemperatur und beim Prozessstopp um. Eine garantierte Druckrichtung kann nicht auf einer Öffnung beruhen, deren Strömungsrichtung weder geregelt noch gemessen wird.","Een opening op thermische trek keert om bij wind, bij andere buitentemperatuur en zodra het proces stopt. Een gegarandeerde drukrichting kan niet rusten op een opening waarvan de stromingsrichting niet wordt geregeld en niet gemeten.","Une ouverture pilotée par la poussée thermique s'inverse avec le vent, la température extérieure et dès l'arrêt du procédé. Un sens de pression garanti ne peut reposer sur une ouverture dont le sens d'écoulement n'est ni régulé ni mesuré.","Una abertura gobernada por flotabilidad se invierte con el viento, con la temperatura exterior y en cuanto el proceso para. Un sentido de presión garantizado no puede apoyarse en una abertura cuyo sentido de flujo no se controla ni se mide.")},
{id:"k15",k:"hard",a:"m_watersuppr",b:"m_drysep_react",
 x:L("Water and reactive or pyrophoric metal powder react, producing hydrogen and heat. Wet separation or water-based suppression in that extract path adds a hazard instead of removing one, and the extinguishing agent must match the powder, not the duct.","Вода й реакційноздатний або пірофорний металевий порошок реагують із виділенням водню й теплоти. Мокре відділення чи водяне придушення в цьому витяжному тракті додає небезпеку, а не усуває її; вогнегасна речовина має відповідати порошку, а не повітроводу.","Wasser und reaktives oder pyrophores Metallpulver reagieren unter Wasserstoff- und Wärmefreisetzung. Nassabscheidung oder wasserbasierte Unterdrückung in diesem Absaugweg fügt eine Gefahr hinzu, statt eine zu beseitigen; das Löschmittel muss zum Pulver passen, nicht zum Kanal.","Water en reactief of pyrofoor metaalpoeder reageren onder vorming van waterstof en warmte. Natte afscheiding of waterbaseerde onderdrukking in dat afzuigtraject voegt een gevaar toe in plaats van er een weg te nemen; het blusmiddel moet bij het poeder passen, niet bij het kanaal.","L'eau et une poudre métallique réactive ou pyrophorique réagissent en produisant hydrogène et chaleur. Une séparation humide ou une suppression à l'eau dans ce circuit ajoute un danger au lieu d'en retirer un ; l'agent extincteur doit correspondre à la poudre, pas à la gaine.","El agua y el polvo metálico reactivo o pirofórico reaccionan generando hidrógeno y calor. La separación húmeda o la supresión con agua en ese circuito añade un peligro en vez de quitarlo; el agente extintor debe corresponder al polvo, no al conducto.")},
{id:"k39",k:"hard",a:"m_naturalvent",b:"m_dustcontain",
