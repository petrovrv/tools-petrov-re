ct_law:L("Mandatory law: a binding legal requirement exists for this point; the national implementation and the competent authority decide the detail.",
"Обов'язкове право: щодо цього пункту існує юридично обов'язкова вимога; деталі визначає національна імплементація та компетентний орган.",
"Zwingendes Recht: für diesen Punkt besteht eine verbindliche Rechtspflicht; Einzelheiten bestimmen die nationale Umsetzung und die zuständige Behörde.",
"Dwingend recht: voor dit punt bestaat een bindende wettelijke eis; de nationale omzetting en het bevoegd gezag bepalen het detail.",
"Droit contraignant : une obligation légale existe pour ce point ; la transposition nationale et l'autorité compétente en fixent le détail.",
"Derecho vinculante: existe una obligación legal para este punto; la transposición nacional y la autoridad competente fijan el detalle."),
ct_std:L("Standard: a published technical standard covers this point; it is not law by itself unless it is referenced by law or by contract.",
"Стандарт: цей пункт охоплено опублікованим технічним стандартом; сам собою він не є правом, доки на нього не посилається закон або договір.",
"Norm: eine veröffentlichte technische Norm behandelt diesen Punkt; sie ist für sich kein Recht, solange kein Gesetz oder Vertrag sie in Bezug nimmt.",
"Norm: een gepubliceerde technische norm behandelt dit punt; op zichzelf is zij geen recht, tenzij wet of contract ernaar verwijst.",
"Norme : une norme technique publiée traite ce point ; elle n'est pas la loi en soi tant qu'un texte ou un contrat n'y renvoie pas.",
"Norma: una norma técnica publicada trata este punto; por sí sola no es ley salvo que una ley o un contrato la invoque."),
ct_guide:L("Industry guidance: established sector practice or a guidance document; useful and widely applied, but it carries no legal force of its own.",
"Галузеве керівництво: усталена галузева практика або настановчий документ; корисно і широко застосовується, але власної юридичної сили не має.",
"Branchenleitfaden: etablierte Sektorpraxis oder ein Leitfaden; nützlich und weit verbreitet, aber ohne eigene Rechtskraft.",
"Brancheleidraad: gevestigde sectorpraktijk of een leidraad; nuttig en breed toegepast, maar zonder eigen rechtskracht.",
"Guide sectoriel : pratique établie du secteur ou document d'orientation ; utile et largement appliqué, mais sans force juridique propre.",
"Guía sectorial: práctica establecida del sector o documento de orientación; útil y muy aplicado, pero sin fuerza jurídica propia."),
ct_calc:L("Calculation method: the point is addressed by an explicit balance or sizing method; the result depends entirely on the input assumptions.",
"Розрахункова методика: пункт опрацьовується явним балансом або методом підбору; результат цілком залежить від вхідних припущень.",
"Rechenverfahren: der Punkt wird über eine explizite Bilanz oder Auslegungsmethode behandelt; das Ergebnis hängt vollständig von den Eingangsannahmen ab.",
"Rekenmethode: het punt wordt via een expliciete balans of dimensioneringsmethode behandeld; het resultaat hangt volledig af van de aannamen.",
"Méthode de calcul : le point est traité par un bilan ou une méthode de dimensionnement explicite ; le résultat dépend entièrement des hypothèses.",
"Método de cálculo: el punto se trata mediante un balance o método de dimensionado explícito; el resultado depende por completo de las hipótesis."),
ct_rule:L("Rule of thumb: an empirical or experience-based statement; it orders the discussion but proves nothing and must not be used as acceptance evidence.",
"Емпіричне правило: твердження з досвіду; воно впорядковує обговорення, але нічого не доводить і не може бути доказом приймання.",
"Faustregel: eine erfahrungsbasierte Aussage; sie ordnet die Diskussion, beweist aber nichts und taugt nicht als Abnahmenachweis.",
"Vuistregel: een ervaringsuitspraak; zij ordent de discussie, bewijst niets en is geen opleveringsbewijs.",
"Règle empirique : énoncé fondé sur l'expérience ; il ordonne la discussion mais ne prouve rien et ne vaut pas preuve de réception.",
"Regla empírica: enunciado basado en la experiencia; ordena la discusión pero no prueba nada ni sirve como evidencia de aceptación."),
s_conf:L("Confirmed","Підтверджено","Bestätigt","Bevestigd","Confirmé","Confirmado"),
s_assum:L("Applicable with assumptions","Застосовно з припущеннями","Anwendbar mit Annahmen","Toepasbaar met aannames","Applicable sous hypothèses","Aplicable con supuestos"),
st_conf:L("Confirmed: the point applies to this kind of process in the general case and was cross-checked against the source chapter.",
"Підтверджено: пункт застосовний до такого типу процесу в загальному випадку та звірений із вихідним розділом.",
"Bestätigt: der Punkt gilt für diese Prozessart im Regelfall und wurde gegen das Quellkapitel geprüft.",
"Bevestigd: het punt geldt in het algemene geval voor dit type proces en is tegen het bronhoofdstuk gecontroleerd.",
"Confirmé : le point s'applique en général à ce type de procédé et a été recoupé avec le chapitre source.",
"Confirmado: el punto se aplica en general a este tipo de proceso y se ha contrastado con el capítulo fuente."),
st_assum:L("Applicable with assumptions: the point holds only for certain substances, layouts or operating states; check the assumption before you use it.",
"Застосовно з допущеннями: пункт справджується лише для певних речовин, компонувань чи режимів; перевірте допущення перед застосуванням.",
"Anwendbar mit Annahmen: der Punkt gilt nur für bestimmte Stoffe, Anordnungen oder Betriebszustände; prüfen Sie die Annahme vor der Anwendung.",
"Toepasbaar met aannamen: het punt geldt alleen voor bepaalde stoffen, opstellingen of bedrijfstoestanden; controleer de aanname vooraf.",
"Applicable avec hypothèses : le point ne vaut que pour certaines substances, dispositions ou états de fonctionnement ; vérifiez l'hypothèse avant usage.",
"Aplicable con hipótesis: el punto solo vale para ciertas sustancias, disposiciones o estados de operación; verifique la hipótesis antes de usarlo."),

n_noflag:L("The current selection was checked against the rules of this page and none of them objects to it. That is not a proof of correctness: these rules are a limited, non-exhaustive list, and an incompatibility they do not describe passes unnoticed.",
"Поточний вибір перевірено за правилами цієї сторінки, і жодне з них проти нього не заперечує. Це не доказ правильності: ці правила — обмежений і невичерпний перелік, і несумісність, якої вони не описують, проходить непоміченою.",
"Die aktuelle Auswahl wurde gegen die Regeln dieser Seite geprüft, und keine widerspricht ihr. Das ist kein Richtigkeitsbeweis: diese Regeln sind eine begrenzte, nicht abschließende Liste, und eine von ihnen nicht beschriebene Unverträglichkeit bleibt unbemerkt.",
"De huidige keuze is getoetst aan de regels van deze pagina en geen ervan maakt er bezwaar tegen. Dat is geen bewijs van juistheid: deze regels vormen een beperkte, niet-uitputtende lijst, en een onverenigbaarheid die zij niet beschrijven blijft onopgemerkt.",
"La sélection actuelle a été vérifiée au regard des règles de cette page et aucune ne s'y oppose. Ce n'est pas une preuve de justesse : ces règles forment une liste limitée et non exhaustive, et une incompatibilité qu'elles ne décrivent pas passe inaperçue.",
"La selección actual se ha comprobado frente a las reglas de esta página y ninguna la objeta. No es prueba de corrección: estas reglas son una lista limitada y no exhaustiva, y una incompatibilidad que no describan pasa inadvertida."),

exp_dis:L("First-level advisor only. No flow rates, pressures, equipment selection or compliance verdict. Verify every item against the project design basis and with the competent authority.",
"Лише порадник першого рівня. Без витрат повітря, тисків, підбору обладнання та висновку про відповідність. Перевіряйте кожен пункт за проєктною основою та з компетентним органом.",
"Nur Berater der ersten Ebene. Keine Volumenströme, Drücke, Gerätewahl oder Konformitätsaussage. Jeden Punkt gegen die Auslegungsgrundlage und mit der zuständigen Behörde prüfen.",
"Alleen adviseur van het eerste niveau. Geen debieten, drukken, apparatuurkeuze of conformiteitsoordeel. Controleer elk punt tegen de ontwerpbasis en met het bevoegd gezag.",
"Conseiller de premier niveau uniquement. Ni débits, ni pressions, ni choix d'équipement, ni verdict de conformité. Vérifiez chaque point avec la base de conception et l'autorité compétente.",
"Solo asesor de primer nivel. Sin caudales, presiones, selección de equipos ni veredicto de conformidad. Verifique cada punto con la base de diseño y la autoridad competente."),

v2:L("Every measure is linked to an existing attention point","Кожен захід прив'язаний до наявного пункту уваги","Jede Maßnahme ist einem vorhandenen Aufmerksamkeitspunkt zugeordnet","Elke maatregel is aan een bestaand aandachtspunt gekoppeld","Chaque mesure est rattachée à un point d'attention existant","Cada medida está vinculada a un punto de atención existente"),
v3:L("Every rule references existing measures only","Кожне правило посилається лише на наявні заходи","Jede Regel verweist nur auf vorhandene Maßnahmen","Elke regel verwijst alleen naar bestaande maatregelen","Chaque règle ne référence que des mesures existantes","Cada regla referencia solo medidas existentes"),
v4:L("Conflict evaluation is symmetric and no unordered pair is duplicated","Оцінка конфліктів симетрична, невпорядковані пари не дублюються","Konfliktauswertung ist symmetrisch, kein ungeordnetes Paar doppelt","Conflictevaluatie is symmetrisch, geen ongeordend paar dubbel","L'évaluation des conflits est symétrique et aucune paire non ordonnée n'est doublée","La evaluación de conflictos es simétrica y ningún par no ordenado se duplica"),
v5:L("No duplicate identifiers among industries, points, measures and rules","Немає дублікатів ідентифікаторів галузей, пунктів, заходів і правил","Keine doppelten Kennungen bei Branchen, Punkten, Maßnahmen und Regeln","Geen dubbele identificatoren bij branches, punten, maatregelen en regels","Aucun identifiant en double parmi secteurs, points, mesures et règles","Sin identificadores duplicados entre sectores, puntos, medidas y reglas"),
v6:L("Every industry carries a point in each of the ten mandatory groups","Кожна галузь має пункт у кожній з десяти обов'язкових груп","Jede Branche hat einen Punkt in jeder der zehn Pflichtgruppen","Elke branche heeft een punt in elk van de tien verplichte groepen","Chaque secteur a un point dans chacun des dix groupes obligatoires","Cada sector tiene un punto en cada uno de los diez grupos obligatorios"),
v7:L("Every point and every measure carries a category and a status badge","Кожен пункт і кожен захід мають бейдж категорії та статусу","Jeder Punkt und jede Maßnahme trägt Kategorie- und Statusabzeichen","Elk punt en elke maatregel draagt een categorie- en statusbadge","Chaque point et chaque mesure porte un badge de catégorie et de statut","Cada punto y cada medida lleva insignia de categoría y estado"),
v8:L("No rule pairs a measure with itself","Жодне правило не поєднує захід із самим собою","Keine Regel paart eine Maßnahme mit sich selbst","Geen regel koppelt een maatregel aan zichzelf","Aucune règle n'associe une mesure à elle-même","Ninguna regla empareja una medida consigo misma"),
v9:L("Every attention point in the library is used by at least one industry","Кожен пункт уваги бібліотеки використано принаймні однією галуззю","Jeder Aufmerksamkeitspunkt der Bibliothek wird von mindestens einer Branche genutzt","Elk aandachtspunt in de bibliotheek wordt door minstens één branche gebruikt","Chaque point d'attention de la bibliothèque est utilisé par au moins un secteur","Cada punto de atención de la biblioteca lo usa al menos un sector"),
lim1:L("First-level advisor: it structures the questions, it does not produce design decisions, flow rates, pressures or equipment selections.",
"Порадник першого рівня: він структурує питання, а не видає проєктні рішення, витрати повітря, тиски чи підбір обладнання.",
"Berater der ersten Ebene: er strukturiert die Fragen, liefert aber keine Planungsentscheidungen, Volumenströme, Drücke oder Gerätewahl.",
"Adviseur van het eerste niveau: het structureert de vragen, maar levert geen ontwerpbeslissingen, debieten, drukken of apparatuurkeuze.",
"Conseiller de premier niveau : il structure les questions, il ne produit ni décisions de conception, ni débits, ni pressions, ni choix d'équipement.",
"Asesor de primer nivel: estructura las preguntas, no produce decisiones de diseño, caudales, presiones ni selección de equipos."),
lim2:L("The lists of attention points and measures are not exhaustive; a real process can present hazards and requirements absent from this library.",
"Переліки пунктів уваги та заходів не є вичерпними; реальний процес може мати небезпеки й вимоги, яких немає в цій бібліотеці.",
"Die Listen der Aufmerksamkeitspunkte und Maßnahmen sind nicht abschließend; ein realer Prozess kann Gefahren und Anforderungen aufweisen, die hier fehlen.",
"De lijsten met aandachtspunten en maatregelen zijn niet uitputtend; een echt proces kan gevaren en eisen kennen die hier ontbreken.",
"Les listes de points d'attention et de mesures ne sont pas exhaustives ; un procédé réel peut présenter des dangers et exigences absents de cette bibliothèque.",
"Las listas de puntos de atención y medidas no son exhaustivas; un proceso real puede presentar peligros y requisitos ausentes de esta biblioteca."),
lim3:L("Conflict rules are simplified pairwise statements; real incompatibilities may involve three or more measures, the layout and the time dimension.",
"Правила конфліктів — спрощені парні твердження; справжні несумісності можуть охоплювати три й більше заходів, компонування та часовий вимір.",
"Konfliktregeln sind vereinfachte Paaraussagen; echte Unverträglichkeiten können drei und mehr Maßnahmen, die Anordnung und die Zeitachse betreffen.",
"Conflictregels zijn vereenvoudigde paaruitspraken; echte onverenigbaarheden kunnen drie of meer maatregelen, de opstelling en de tijd betreffen.",
"Les règles de conflit sont des énoncés simplifiés par paires ; les incompatibilités réelles peuvent impliquer trois mesures ou plus, l'implantation et le temps.",
"Las reglas de conflicto son enunciados simplificados por pares; las incompatibilidades reales pueden implicar tres o más medidas, la implantación y el tiempo."),
lim4:L("Applicability of every item must be verified against the project design basis, the substances actually handled and the national implementation of the referenced law.",
"Застосовність кожного пункту слід перевіряти за проєктною основою, фактично використовуваними речовинами та національною імплементацією відповідного права.",
"Die Anwendbarkeit jedes Eintrags ist gegen die Auslegungsgrundlage, die tatsächlich gehandhabten Stoffe und die nationale Umsetzung des Rechts zu prüfen.",
"De toepasbaarheid van elk item moet worden getoetst aan de ontwerpbasis, de werkelijk gehanteerde stoffen en de nationale omzetting van het recht.",
"L'applicabilité de chaque élément doit être vérifiée au regard de la base de conception, des substances réellement manipulées et de la transposition nationale du droit.",
"La aplicabilidad de cada elemento debe verificarse frente a la base de diseño, las sustancias realmente manipuladas y la transposición nacional del derecho."),
lim5:L("The source-basis categories separate law from standard from practice, but no legal text is reproduced or interpreted here; the competent authority remains the deciding party.",
"Категорії основи джерела відокремлюють право від стандарту й практики, але жодного правового тексту тут не відтворено й не витлумачено; вирішує компетентний орган.",
"Die Kategorien der Quellengrundlage trennen Recht von Norm und Praxis, doch kein Rechtstext wird hier wiedergegeben oder ausgelegt; entscheidend bleibt die zuständige Behörde.",
"De categorieën van de brongrondslag scheiden recht van norm en praktijk, maar geen wettekst wordt hier weergegeven of uitgelegd; het bevoegd gezag beslist.",
"Les catégories de base de la source séparent droit, norme et pratique, mais aucun texte juridique n'est ici reproduit ni interprété ; l'autorité compétente décide.",
"Las categorías de base de la fuente separan derecho, norma y práctica, pero aquí no se reproduce ni interpreta ningún texto legal; decide la autoridad competente."),
lim6:L("No quantitative model runs behind this page: nothing is computed, no dose, concentration, dew point or air change rate is derived. The figures in the key-conditions panels are quoted from worked examples together with the assumptions under which they were obtained, never calculated for your case.",
"За цією сторінкою немає кількісної моделі: нічого не обчислюється, жодна доза, концентрація, точка роси чи кратність повітрообміну не виводиться. Величини на панелях ключових умов наведено з розрахункових прикладів разом із припущеннями, за яких їх одержано, і ніколи не обчислено для вашого випадку.",
"Hinter dieser Seite läuft kein quantitatives Modell: es wird nichts berechnet, keine Dosis, Konzentration, Taupunkt oder Luftwechselrate abgeleitet. Die Größen in den Feldern der wesentlichen Bedingungen sind aus Rechenbeispielen samt ihren Annahmen zitiert und nie für Ihren Fall berechnet.",
"Achter deze pagina draait geen kwantitatief model: er wordt niets berekend, geen dosis, concentratie, dauwpunt of luchtwisseling afgeleid. De grootheden in de panelen met kernvoorwaarden zijn met hun aannamen uit rekenvoorbeelden geciteerd en nooit voor uw geval berekend.",
"Aucun modèle quantitatif ne tourne derrière cette page : rien n'est calculé, ni dose, ni concentration, ni point de rosée, ni taux de renouvellement. Les grandeurs des volets de conditions essentielles sont citées d'exemples de calcul avec leurs hypothèses, jamais calculées pour votre cas.",
"Detrás de esta página no corre ningún modelo cuantitativo: nada se calcula, ni dosis, ni concentración, ni punto de rocío, ni tasa de renovación. Las magnitudes de los paneles de condiciones clave se citan de ejemplos de cálculo con sus hipótesis, nunca se calculan para su caso."),
h_start:L("Start here","Почніть тут","Hier starten","Hier beginnen","Commencer ici","Empiece aquí"),
pay:L("You are assembling a set of measures for your own process. The tool checks that set for mutual incompatibility and shows which attention points are left uncovered.",
"Ви збираєте набір заходів під свій процес. Інструмент перевіряє цей набір на взаємну несумісність і показує, які пункти уваги лишилися непокритими.",
"Sie stellen einen Maßnahmensatz für Ihren eigenen Prozess zusammen. Das Werkzeug prüft diesen Satz auf gegenseitige Unverträglichkeit und zeigt, welche Aufmerksamkeitspunkte unabgedeckt bleiben.",
"U stelt een set maatregelen samen voor uw eigen proces. Het hulpmiddel toetst die set op onderlinge onverenigbaarheid en toont welke aandachtspunten onafgedekt blijven.",
"Vous composez un ensemble de mesures pour votre propre procédé. L'outil vérifie cet ensemble quant aux incompatibilités mutuelles et montre quels points d'attention restent non couverts.",
"Usted compone un conjunto de medidas para su propio proceso. La herramienta comprueba ese conjunto en cuanto a incompatibilidades mutuas y muestra qué puntos de atención quedan sin cubrir."),
st1:L("Pick the industry: the tool lists the attention points that this kind of process brings.",
"Оберіть галузь: інструмент перелічує пункти уваги, які приносить такий процес.",
"Branche wählen: das Werkzeug listet die Aufmerksamkeitspunkte auf, die ein solcher Prozess mit sich bringt.",
"Kies de branche: het hulpmiddel somt de aandachtspunten op die zo'n proces meebrengt.",
"Choisissez le secteur : l'outil énumère les points d'attention qu'un tel procédé apporte.",
"Elija el sector: la herramienta enumera los puntos de atención que trae un proceso de este tipo."),
st2:L("Tick a measure: the attention point it closes is marked at once and the result panel answers immediately.",
"Позначте захід: пункт уваги, який він закриває, одразу позначається, а панель результату відповідає негайно.",
"Maßnahme anhaken: der damit geschlossene Aufmerksamkeitspunkt wird sofort markiert und die Ergebnisansicht antwortet unmittelbar.",
"Vink een maatregel aan: het aandachtspunt dat zij sluit wordt meteen gemarkeerd en het resultaatpaneel antwoordt direct.",
"Cochez une mesure : le point d'attention qu'elle referme est marqué aussitôt et le panneau de résultat répond immédiatement.",
"Marque una medida: el punto de atención que cierra queda señalado de inmediato y el panel de resultado responde al instante."),
st3:L("Read the result: pairs that cannot work together, combinations that need justification, measures usually needed alongside, and everything still open.",
"Читайте результат: пари, які не можуть працювати разом, поєднання, що потребують обґрунтування, заходи, потрібні в парі, і все, що лишилося відкритим.",
"Ergebnis lesen: Paare, die nicht zusammen funktionieren, begründungsbedürftige Kombinationen, üblicherweise ergänzende Maßnahmen und alles, was offen bleibt.",
"Lees het resultaat: paren die niet samen kunnen, combinaties die onderbouwing vragen, maatregelen die er meestal bij horen, en alles wat nog openstaat.",
"Lisez le résultat : paires incompatibles, combinaisons à justifier, mesures habituellement associées et tout ce qui reste ouvert.",
"Lea el resultado: pares incompatibles, combinaciones que exigen justificación, medidas que suelen acompañar y todo lo que sigue abierto."),
b_preset:L("Load a typical set","Завантажити типовий набір","Typischen Satz laden","Typische set laden","Charger un jeu type","Cargar un conjunto típico"),
b_demo:L("Show a conflict example","Показати приклад конфлікту","Konfliktbeispiel zeigen","Toon een conflictvoorbeeld","Montrer un exemple de conflit","Mostrar un ejemplo de conflicto"),
n_quick:L("The typical set is a starting selection for this industry against which no rule of this page objects; edit it to match your own process. The conflict example ticks two measures of this industry that cannot be used together and states the reason.",
"Типовий набір — це початковий вибір для цієї галузі, проти якого не заперечує жодне правило цієї сторінки; правте його під власний процес. Приклад конфлікту позначає два заходи цієї галузі, які не можна застосовувати разом, і наводить причину.",
"Der typische Satz ist eine Startauswahl für diese Branche, der keine Regel dieser Seite widerspricht; passen Sie ihn an Ihren Prozess an. Das Konfliktbeispiel hakt zwei Maßnahmen dieser Branche an, die nicht zusammen verwendbar sind, und nennt den Grund.",
"De typische set is een startselectie voor deze branche waartegen geen regel van deze pagina bezwaar maakt; pas hem aan uw eigen proces aan. Het conflictvoorbeeld vinkt twee maatregelen van deze branche aan die niet samen kunnen, met de reden erbij.",
"Le jeu type est une sélection de départ pour ce secteur à laquelle aucune règle de cette page ne s'oppose ; adaptez-la à votre propre procédé. L'exemple de conflit coche deux mesures de ce secteur qui ne peuvent pas coexister et en donne la raison.",
"El conjunto típico es una selección inicial para este sector a la que ninguna regla de esta página objeta; adáptela a su propio proceso. El ejemplo de conflicto marca dos medidas de este sector que no pueden coexistir e indica el motivo."),
h_live:L("Live result of your selection","Живий результат вашого вибору","Laufendes Ergebnis Ihrer Auswahl","Actueel resultaat van uw selectie","Résultat en direct de votre sélection","Resultado en vivo de su selección"),

k_open:L("Still open","Ще відкрито","Noch offen","Nog open","Encore ouverts","Aún abiertos"),
fl_none:L("Nothing ticked yet. Tick any measure below and this panel answers at once: which attention point it closes, whether it clashes with your earlier ticks, and what is usually needed next.",
"Поки нічого не позначено. Позначте будь-який захід нижче — і ця панель одразу відповість: який пункт уваги він закриває, чи не суперечить він раніше позначеним і що зазвичай потрібно далі.",
"Noch nichts angehakt. Haken Sie unten eine Maßnahme an, und diese Ansicht antwortet sofort: welchen Aufmerksamkeitspunkt sie schließt, ob sie mit früheren Haken kollidiert und was üblicherweise als Nächstes nötig ist.",
"Nog niets aangevinkt. Vink hieronder een maatregel aan en dit paneel antwoordt meteen: welk aandachtspunt zij sluit, of zij botst met eerdere vinkjes en wat er meestal daarna nodig is.",
"Rien de coché pour l'instant. Cochez une mesure ci-dessous et ce panneau répond aussitôt : quel point d'attention elle referme, si elle heurte vos choix précédents et ce qui est habituellement nécessaire ensuite.",
"Todavía no hay nada marcado. Marque cualquier medida abajo y este panel responde de inmediato: qué punto de atención cierra, si choca con lo ya marcado y qué suele hacer falta a continuación."),

fl_clean:L("Checked against the rules of this page: none of them objects to this combination. That list of rules is not exhaustive.",
"Перевірено за правилами цієї сторінки: жодне з них не заперечує проти цього поєднання. Перелік правил не є вичерпним.",

"Getoetst aan de regels van deze pagina: geen ervan maakt bezwaar tegen deze combinatie. Die regellijst is niet uitputtend.",

fl_preset:L("A typical starting set for this industry is ticked. No rule of this page objects to it, which makes it a starting point for the discussion, not a design proposal. Change it wherever your process differs.",
"Позначено типовий стартовий набір для цієї галузі. Жодне правило цієї сторінки проти нього не заперечує, тож це відправна точка для обговорення, а не проєктна пропозиція. Змініть його там, де ваш процес відрізняється.",
"Ein typischer Startsatz für diese Branche ist angehakt. Keine Regel dieser Seite widerspricht ihm; das macht ihn zu einem Ausgangspunkt für das Gespräch, nicht zu einem Planungsvorschlag. Ändern Sie ihn dort, wo Ihr Prozess abweicht.",
"Een typische startset voor deze branche is aangevinkt. Geen regel van deze pagina maakt er bezwaar tegen; dat maakt hem een startpunt voor het gesprek, geen ontwerpvoorstel. Wijzig hem waar uw proces afwijkt.",
"Un jeu de départ type pour ce secteur est coché. Aucune règle de cette page ne s'y oppose, ce qui en fait un point de départ pour la discussion, pas une proposition de conception. Modifiez-le là où votre procédé diffère.",
"Se ha marcado un conjunto inicial típico para este sector. Ninguna regla de esta página lo objeta, lo que lo convierte en un punto de partida para la discusión, no en una propuesta de diseño. Cámbielo donde su proceso difiera."),
fl_demo:L("Two measures that cannot be combined have been ticked on purpose. The physical or regulatory reason is stated below.",
"Навмисно позначено два заходи, які не можна поєднувати. Фізичну або нормативну причину наведено нижче.",
"Absichtlich wurden zwei nicht kombinierbare Maßnahmen angehakt. Die physikalische oder rechtliche Begründung steht unten.",
"Er zijn opzettelijk twee onverenigbare maatregelen aangevinkt. De fysische of normatieve reden staat hieronder.",
"Deux mesures incompatibles ont été cochées volontairement. La raison physique ou réglementaire figure ci-dessous.",
"Se han marcado a propósito dos medidas incompatibles. El motivo físico o normativo aparece abajo."),
fl_clear:L("All ticks removed.","Усі позначки знято.","Alle Haken entfernt.","Alle vinkjes gewist.","Toutes les coches ont été retirées.","Se han quitado todas las marcas."),

lg_hint:L("Every badge is a button: click it, or press Enter or Space, to read what its category and its status mean. Escape closes the explanation. The filter buttons above show one category at a time.",
"Кожен бейдж — це кнопка: натисніть його або клавішу Enter чи пробіл, щоб прочитати, що означають його категорія та статус. Escape закриває пояснення. Кнопки фільтра вище показують по одній категорії.",
"Jedes Abzeichen ist eine Schaltfläche: klicken Sie es an oder drücken Sie Enter oder die Leertaste, um Bedeutung von Kategorie und Status zu lesen. Escape schließt die Erklärung. Die Filterschaltflächen oben zeigen jeweils eine Kategorie.",
"Elke badge is een knop: klik erop of druk op Enter of de spatiebalk om te lezen wat de categorie en de status betekenen. Escape sluit de uitleg. De filterknoppen hierboven tonen één categorie tegelijk.",
"Chaque badge est un bouton : cliquez-le ou appuyez sur Entrée ou Espace pour lire ce que signifient sa catégorie et son statut. Échap ferme l'explication. Les boutons de filtre ci-dessus n'affichent qu'une catégorie à la fois.",
"Cada insignia es un botón: púlsela o presione Intro o Espacio para leer qué significan su categoría y su estado. Escape cierra la explicación. Los botones de filtro de arriba muestran una categoría cada vez."),

mdl_leg:L("The five categories and the two statuses — click any of them to read its meaning:",
"П'ять категорій і два статуси — натисніть будь-який, щоб прочитати значення:",
"Die fünf Kategorien und die zwei Status — klicken Sie eines an, um seine Bedeutung zu lesen:",

f_show:L("Show only","Показати лише","Nur zeigen","Alleen tonen","Afficher seulement","Mostrar solo"),
cat_mix:L("Categories are kept apart on purpose. A legal obligation has to be met; a standard applies where a contract or a regulation invokes it; sector practice has to be argued for; a calculation method delivers only what its assumptions allow; a rule of thumb orders the discussion and proves nothing. Presenting them alike turns a duty into an opinion, or an opinion into a duty.",
"Категорії розділено навмисно. Юридичний обов'язок треба виконати; стандарт діє там, де на нього посилається договір або норма; галузеву практику треба обґрунтувати; розрахункова методика дає лише те, що дозволяють її припущення; емпіричне правило впорядковує обговорення і нічого не доводить. Однакове подання перетворює обов'язок на думку або думку на обов'язок.",
"Die Kategorien werden bewusst getrennt gehalten. Eine Rechtspflicht ist zu erfüllen; eine Norm gilt dort, wo ein Vertrag oder eine Vorschrift sie in Bezug nimmt; Branchenpraxis muss begründet werden; ein Rechenverfahren liefert nur, was seine Annahmen zulassen; eine Faustregel ordnet das Gespräch und beweist nichts. Gleiche Darstellung macht aus einer Pflicht eine Meinung oder aus einer Meinung eine Pflicht.",
"De categorieën worden bewust gescheiden gehouden. Een wettelijke plicht moet worden nageleefd; een norm geldt waar een contract of voorschrift ernaar verwijst; branchepraktijk moet worden onderbouwd; een rekenmethode levert alleen wat haar aannamen toelaten; een vuistregel ordent het gesprek en bewijst niets. Gelijke weergave maakt van een plicht een mening, of van een mening een plicht.",
"Les catégories sont volontairement tenues à part. Une obligation légale doit être respectée ; une norme s'applique là où un contrat ou un règlement l'invoque ; la pratique sectorielle doit être argumentée ; une méthode de calcul ne donne que ce que ses hypothèses permettent ; une règle empirique ordonne la discussion et ne prouve rien. Les présenter de la même façon transforme un devoir en opinion, ou une opinion en devoir.",
"Las categorías se mantienen separadas a propósito. Una obligación legal debe cumplirse; una norma rige allí donde un contrato o un reglamento la invoca; la práctica sectorial debe argumentarse; un método de cálculo solo entrega lo que permiten sus hipótesis; una regla empírica ordena la discusión y no demuestra nada. Presentarlas por igual convierte un deber en opinión, o una opinión en deber."),

val_warn:L("Something is wrong with the content of this page: part of it may be missing or inconsistent. Do not rely on the lists and answers shown here. Please reload the page.",
"Із вмістом цієї сторінки щось не так: частина його може бути відсутньою або суперечливою. Не покладайтеся на показані тут переліки й відповіді. Перезавантажте сторінку.",
"Mit dem Inhalt dieser Seite stimmt etwas nicht: ein Teil davon kann fehlen oder widersprüchlich sein. Verlassen Sie sich nicht auf die hier gezeigten Listen und Antworten. Bitte laden Sie die Seite neu.",

"Quelque chose ne va pas dans le contenu de cette page : une partie peut manquer ou être contradictoire. Ne vous fiez pas aux listes et réponses affichées. Rechargez la page.",

v10:L("A conflict-free typical starting set can be built for every industry","Для кожної галузі можна побудувати безконфліктний типовий стартовий набір","Für jede Branche lässt sich ein konfliktfreier typischer Startsatz bilden","Voor elke branche is een conflictvrije typische startset op te bouwen","Un jeu de départ type sans conflit peut être construit pour chaque secteur","Para cada sector puede construirse un conjunto inicial típico sin conflictos"),

v12:L("No typical set contains a measure that this page declares incompatible with the hazard classification of the same industry","Жоден типовий набір не містить заходу, який ця сторінка визнає несумісним із класифікацією небезпек тієї самої галузі","Kein typischer Satz enthält eine Maßnahme, die diese Seite als unverträglich mit der Gefahreneinstufung derselben Branche erklärt","Geen typische set bevat een maatregel die deze pagina onverenigbaar verklaart met de gevarenindeling van dezelfde branche","Aucun jeu type ne contient une mesure que cette page déclare incompatible avec la classification des dangers du même secteur","Ningún conjunto típico contiene una medida que esta página declare incompatible con la clasificación de peligros del mismo sector"),
v13:L("No industry is offered a measure that belongs to a different process, and every attention point keeps at least one measure in every industry that carries it",
"Жодній галузі не пропонується захід, що належить іншому процесу, і кожен пункт уваги зберігає щонайменше один захід у кожній галузі, яка його містить",
"Keiner Branche wird eine Maßnahme angeboten, die zu einem anderen Prozess gehört, und jeder Aufmerksamkeitspunkt behält in jeder Branche, die ihn trägt, mindestens eine Maßnahme",
"Aan geen enkele branche wordt een maatregel aangeboden die bij een ander proces hoort, en elk aandachtspunt behoudt minstens één maatregel in elke branche die het draagt",
"Aucun secteur ne se voit proposer une mesure relevant d'un autre procédé, et chaque point d'attention conserve au moins une mesure dans chaque secteur qui le porte",
"A ningún sector se le ofrece una medida propia de otro proceso, y cada punto de atención conserva al menos una medida en cada sector que lo incluye"),
pv_t:L("Key conditions","Ключові умови","Wesentliche Bedingungen","Kernvoorwaarden","Conditions essentielles","Condiciones clave"),
pv_th:L("What this measure is driven by, and which figures are used for orientation alongside it",
"Чим зумовлений цей захід і якими величинами при ньому орієнтуються",
"Wodurch diese Maßnahme bedingt ist und an welchen Größen man sich dabei orientiert",
"Waardoor deze maatregel wordt bepaald en aan welke grootheden men zich daarbij oriënteert",
"Ce qui conditionne cette mesure et les grandeurs qui servent de repère",
"Qué condiciona esta medida y qué magnitudes sirven de orientación"),
pv_ah:L("What is being limited in this situation, and why it is watched",
"Що саме обмежується в цій ситуації і чому на це дивляться",
"Was in dieser Situation begrenzt wird und warum darauf geachtet wird",
"Wat in deze situatie wordt begrensd en waarom erop wordt gelet",

"Qué se limita en esta situación y por qué se vigila"),
pv_none:L("No traced figure is attached to this measure. The attention point above states what the measure is meant to limit; the primary source has to be identified for the project itself.",
"До цього заходу не прив'язано жодної простеженої величини. Пункт уваги вище пояснює, що саме захід має обмежувати; першоджерело визначають для самого проєкту.",
"Dieser Maßnahme ist keine nachverfolgte Größe zugeordnet. Der Aufmerksamkeitspunkt oben nennt, was die Maßnahme begrenzen soll; die Primärquelle ist für das Projekt selbst zu bestimmen.",
"Aan deze maatregel is geen herleide grootheid gekoppeld. Het aandachtspunt hierboven benoemt wat de maatregel moet begrenzen; de primaire bron wordt voor het project zelf bepaald.",
"Aucune grandeur tracée n'est rattachée à cette mesure. Le point d'attention ci-dessus indique ce que la mesure doit limiter ; la source primaire est à identifier pour le projet lui-même.",
"A esta medida no se le ha asociado ninguna magnitud trazada. El punto de atención anterior indica qué debe limitar la medida; la fuente primaria se identifica para el propio proyecto."),
pv_note:L("None of these entries asserts that it applies to your project. Each one states where its figure comes from and under which conditions it was obtained.",
"Жоден із цих записів не стверджує, що він застосовний до вашого проєкту. Кожен зазначає, звідки походить його величина і за яких умов її одержано.",
"Keiner dieser Einträge behauptet, auf Ihr Projekt zuzutreffen. Jeder nennt, woher seine Größe stammt und unter welchen Bedingungen sie gewonnen wurde.",
"Geen van deze items beweert op uw project van toepassing te zijn. Elk item vermeldt waar zijn grootheid vandaan komt en onder welke voorwaarden die is verkregen.",
"Aucune de ces entrées n'affirme s'appliquer à votre projet. Chacune indique d'où vient sa grandeur et dans quelles conditions elle a été obtenue.",
"Ninguna de estas entradas afirma aplicarse a su proyecto. Cada una indica de dónde procede su magnitud y en qué condiciones se obtuvo."),

pv_where:L("Where to look","Де шукати","Wo zu suchen","Waar te zoeken","Où chercher","Dónde buscar"),
pv_trace:L("Traced to a named file and line of the worked reference material.",
"Простежено до названого файла і рядка опрацьованого довідкового матеріалу.",
"Nachgewiesen in einer benannten Datei und Zeile des ausgearbeiteten Referenzmaterials.",
"Herleid tot een genoemd bestand en een genoemde regel van het uitgewerkte referentiemateriaal.",
"Tracé vers un fichier et une ligne nommés du matériau de référence élaboré.",
"Trazado a un archivo y una línea con nombre del material de referencia elaborado."),
pv_tracex:L("The reference is carried in the markup of the page rather than printed on screen: the source material keeps its own item numbering, and that numbering is not published on this site. What the entry does show is the figure, the assumptions it was obtained under, and where the primary source is to be looked for.",
"Посилання міститься в розмітці сторінки, а не надруковане на екрані: вихідний матеріал має власну нумерацію елементів, і ця нумерація на цьому сайті не публікується. Запис показує саму величину, припущення, за яких її одержано, і де шукати першоджерело.",
"Der Nachweis steht im Quelltext der Seite und wird nicht am Bildschirm abgedruckt: das Quellmaterial führt eine eigene Elementnummerierung, und diese wird auf dieser Website nicht veröffentlicht. Der Eintrag zeigt die Größe selbst, die Annahmen ihrer Gewinnung und wo die Primärquelle zu suchen ist.",
"De verwijzing staat in de opmaak van de pagina en wordt niet op het scherm afgedrukt: het bronmateriaal voert een eigen elementnummering, en die wordt op deze site niet gepubliceerd. Het item toont wel de grootheid zelf, de aannamen waaronder die is verkregen, en waar de primaire bron te zoeken is.",
"La référence figure dans le balisage de la page et n'est pas imprimée à l'écran : le matériau source porte sa propre numérotation d'éléments, qui n'est pas publiée sur ce site. L'entrée montre en revanche la grandeur elle-même, les hypothèses dans lesquelles elle a été obtenue et où chercher la source primaire.",
"La referencia figura en el marcado de la página y no se imprime en pantalla: el material fuente lleva su propia numeración de elementos, que no se publica en este sitio. La entrada sí muestra la magnitud misma, los supuestos en que se obtuvo y dónde buscar la fuente primaria."),
pv_nonum:L("No figure is reproduced here: the number itself is the content that the document is sold for.",
"Тут не відтворено жодного числа: саме число і є тим змістом, за який продають документ.",
"Hier wird keine Zahl wiedergegeben: die Zahl selbst ist der Inhalt, für den das Dokument verkauft wird.",
"Hier wordt geen getal weergegeven: het getal zelf is de inhoud waarvoor het document wordt verkocht.",
"Aucun chiffre n'est reproduit ici : le nombre lui-même est le contenu pour lequel le document est vendu.",
"Aquí no se reproduce ninguna cifra: el número mismo es el contenido por el que se vende el documento."),
pv_edition:L("The edition in force is verified with the issuing body.",
"Чинну редакцію перевіряють у видавця документа.",
"Die geltende Fassung wird bei der herausgebenden Stelle geprüft.",
"De vigerende uitgave wordt bij de uitgevende instantie getoetst.",
"L'édition en vigueur se vérifie auprès de l'organisme émetteur.",
"La edición vigente se comprueba con el organismo emisor."),
pv_l_openlaw:L("Openly published law","Відкрито оприлюднене право","Offen veröffentlichtes Recht","Openbaar gepubliceerd recht","Droit publié ouvertement","Derecho publicado abiertamente"),
pv_l_chapter:L("Worked reference material","Опрацьований довідковий матеріал","Ausgearbeitetes Referenzmaterial","Uitgewerkt referentiemateriaal","Matériau de référence élaboré","Material de referencia elaborado"),
pv_l_paidstd:L("Purchasable standard","Платний стандарт","Kostenpflichtige Norm","Betaalde norm","Norme payante","Norma de pago"),
pv_d_openlaw:L("Legislation and public rules. The subject of the requirement is named, but a figure appears only where it could be traced to a source file, and the edition in force is verified with the issuing body.",
"Законодавство та публічні правила. Названо предмет вимоги, але величина з'являється лише там, де її вдалося простежити до файла-джерела, а чинну редакцію перевіряють у видавця.",
"Gesetzgebung und öffentliche Regeln. Der Gegenstand der Anforderung wird benannt, eine Größe erscheint jedoch nur dort, wo sie auf eine Quelldatei zurückgeführt werden konnte, und die geltende Fassung wird bei der herausgebenden Stelle geprüft.",
"Wetgeving en publieke regels. Het onderwerp van de eis wordt benoemd, maar een grootheid verschijnt alleen waar die tot een bronbestand kon worden herleid, en de vigerende uitgave wordt bij de uitgevende instantie getoetst.",
"Législation et règles publiques. L'objet de l'exigence est nommé, mais une grandeur n'apparaît que là où elle a pu être tracée jusqu'à un fichier source, et l'édition en vigueur se vérifie auprès de l'organisme émetteur.",
"Legislación y reglas públicas. Se nombra el objeto del requisito, pero una magnitud solo aparece donde pudo trazarse hasta un archivo fuente, y la edición vigente se comprueba con el organismo emisor."),
pv_d_chapter:L("Values taken from the worked examples and data sets of the reference material, each with the assumptions under which it was obtained and with the file it was traced to. They are examples of a calculation, not limits laid down by a document.",
"Величини, узяті з розрахункових прикладів і наборів даних довідкового матеріалу, кожна з припущеннями, за яких її одержано, і з файлом, до якого її простежено. Це приклади розрахунку, а не межі, встановлені документом.",
"Werte aus den Rechenbeispielen und Datensätzen des Referenzmaterials, jeweils mit den Annahmen, unter denen sie gewonnen wurden, und mit der Datei, auf die sie zurückgeführt wurden. Es sind Beispiele einer Berechnung, keine von einem Dokument gesetzten Grenzen.",
"Waarden uit de rekenvoorbeelden en datasets van het referentiemateriaal, elk met de aannamen waaronder ze zijn verkregen en met het bestand waarnaar ze zijn herleid. Het zijn voorbeelden van een berekening, geen door een document gestelde grenzen.",
"Valeurs issues des exemples de calcul et des jeux de données du matériau de référence, chacune avec les hypothèses de son obtention et le fichier auquel elle a été tracée. Ce sont des exemples de calcul, non des limites posées par un document.",
"Valores tomados de los ejemplos de cálculo y los conjuntos de datos del material de referencia, cada uno con las hipótesis en que se obtuvo y con el archivo al que se trazó. Son ejemplos de cálculo, no límites fijados por un documento."),
pv_d_paidstd:L("Documents that are sold. Their numerical requirement is exactly the content that is paid for, so only the shape of the requirement is shown here: what is regulated, what it depends on, what to settle first and what to expect from it. No figure appears in these entries in any language.",
"Документи, які продають. Їхня числова вимога і є тим змістом, за який платять, тому тут показано лише форму вимоги: що регулюється, від чого залежить, що визначити спершу і чого від неї чекати. У таких записах немає жодного числа в жодній мові.",
"Dokumente, die verkauft werden. Ihre zahlenmäßige Anforderung ist genau der Inhalt, für den bezahlt wird; daher wird hier nur die Form der Anforderung gezeigt: was geregelt wird, wovon es abhängt, was zuerst festzulegen ist und was zu erwarten ist. In diesen Einträgen erscheint in keiner Sprache eine Zahl.",
"Documenten die worden verkocht. Hun numerieke eis is precies de inhoud waarvoor wordt betaald; daarom wordt hier alleen de vorm van de eis getoond: wat wordt geregeld, waarvan het afhangt, wat eerst moet worden vastgelegd en wat ervan te verwachten is. In deze items verschijnt in geen enkele taal een getal.",
"Documents qui se vendent. Leur exigence chiffrée est précisément le contenu payé ; seule la forme de l'exigence est donc montrée ici : ce qui est réglementé, ce dont cela dépend, ce qu'il faut trancher d'abord et ce qu'il faut en attendre. Aucun chiffre n'apparaît dans ces entrées, dans aucune langue.",
"Documentos que se venden. Su requisito numérico es justamente el contenido por el que se paga; por eso aquí solo se muestra la forma del requisito: qué se regula, de qué depende, qué determinar primero y qué esperar de él. En estas entradas no aparece ninguna cifra en ningún idioma."),
pv_lay:L("Source layer","Шар джерела","Quellenschicht","Bronlaag","Couche de source","Capa de fuente"),
pv_layd:L("The three layers are shown apart so that a figure from a worked example never looks like a requirement laid down by a document:",
"Три шари подано окремо, щоб величина з розрахункового прикладу ніколи не виглядала як вимога, встановлена документом:",
"Die drei Schichten werden getrennt gezeigt, damit eine Größe aus einem Rechenbeispiel nie wie eine von einem Dokument gesetzte Anforderung aussieht:",
"De drie lagen worden apart getoond zodat een grootheid uit een rekenvoorbeeld nooit oogt als een door een document gestelde eis:",
"Les trois couches sont présentées séparément afin qu'une grandeur issue d'un exemple de calcul ne ressemble jamais à une exigence posée par un document :",
"Las tres capas se muestran por separado para que una magnitud de un ejemplo de cálculo nunca parezca un requisito fijado por un documento:"),

v15:L("Every entry that carries a figure names the source file it was traced to",

"Jeder Eintrag mit einer Zahl nennt die Quelldatei, auf die er zurückgeführt wurde",

v16:L("Every entry says where to look for the primary source, what to settle beforehand, and belongs to at least one measure or attention point",
"Кожен запис каже, де шукати першоджерело, що визначити заздалегідь, і належить щонайменше до одного заходу чи пункту уваги",

v17:L("No text in any language claims that an item is obligatory for the reader or sufficient on its own",
"Жоден текст у жодній мові не стверджує, що пункт є обов'язковим для читача або достатнім сам собою",
"Kein Text behauptet in irgendeiner Sprache, ein Punkt sei für den Lesenden verpflichtend oder für sich genommen ausreichend",
"Geen tekst beweert in enige taal dat een item voor de lezer verplicht of op zichzelf toereikend is",
"Aucun texte, dans aucune langue, n'affirme qu'un élément est obligatoire pour le lecteur ou suffisant à lui seul",
"Ningún texto, en ningún idioma, afirma que un elemento sea obligatorio para el lector o suficiente por sí solo"),
v18:L("The figures inside an entry read identically in all seven languages",
"Числа всередині запису читаються однаково всіма сімома мовами",
"Die Zahlen innerhalb eines Eintrags lauten in allen sieben Sprachen gleich",
"De getallen binnen een item luiden in alle zeven talen gelijk",
"Les chiffres d'une entrée sont identiques dans les sept langues",
"Las cifras dentro de una entrada son idénticas en los siete idiomas"),
v19:L("Every traceability reference names a file that exists in the worked material, at a line that exists in it",
"Кожне посилання простежуваності називає файл, який справді існує в опрацьованому матеріалі, і рядок, який у ньому існує",
"Jeder Nachweis nennt eine Datei, die im ausgearbeiteten Material tatsächlich vorhanden ist, und eine darin vorhandene Zeile",
"Elke herleidingsverwijzing noemt een bestand dat in het uitgewerkte materiaal bestaat, op een regel die daarin bestaat",
"Chaque référence de traçabilité nomme un fichier qui existe dans le matériau élaboré, à une ligne qui y existe",
"Cada referencia de trazabilidad nombra un archivo que existe en el material elaborado, en una línea que existe en él"),
v20:L("No industry is shown a key condition whose measures all belong to a different process, and none of the conditions that do belong to it goes missing",
"Жодній галузі не показано ключової умови, усі заходи якої належать іншому процесу, і жодна з умов, що справді її стосуються, не зникає",
"Keiner Branche wird eine wesentliche Bedingung gezeigt, deren Maßnahmen sämtlich zu einem anderen Prozess gehören, und keine der wirklich zugehörigen Bedingungen geht verloren",
"Geen enkele branche krijgt een kernvoorwaarde te zien waarvan alle maatregelen tot een ander proces behoren, en geen van de voorwaarden die er wel bij horen valt weg",
"Aucun secteur ne se voit présenter une condition essentielle dont toutes les mesures relèvent d'un autre procédé, et aucune des conditions qui le concernent vraiment ne disparaît",
"A ningún sector se le muestra una condición clave cuyas medidas pertenecen todas a otro proceso, y ninguna de las condiciones que sí le corresponden desaparece"),
v21:L("Nothing a panel puts on screen carries an item code or a file path of the source material, in any of the seven languages",
"Ніщо з того, що панель виводить на екран, не містить коду елемента чи шляху до файла вихідного матеріалу в жодній із шести мов",
"Nichts, was eine Tafel auf den Bildschirm bringt, trägt in einer der sieben Sprachen eine Elementkennung oder einen Dateipfad des Quellmaterials",
"Niets wat een paneel op het scherm zet bevat in een van de zeven talen een elementcode of een bestandspad van het bronmateriaal",
"Rien de ce qu'un panneau affiche ne porte, dans aucune des sept langues, un code d'élément ni un chemin de fichier du matériau source",
"Nada de lo que un panel muestra en pantalla lleva, en ninguno de los siete idiomas, un código de elemento ni una ruta de archivo del material fuente"),
