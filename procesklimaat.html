 x:L("Smoke mode with large make-up openings and a negative-pressure containment of the hazardous zone are two states of the same building. They coexist only if the priority between them is written down, the smoke path is defined and the loss of containment is knowingly accepted for the duration of the fire.","Режим димовидалення з великими прорізами і локалізація небезпечної зони під розрідженням — це два стани однієї будівлі. Вони співіснують лише тоді, коли пріоритет між ними зафіксовано, шлях диму визначено, а втрата розрідження свідомо прийнята на час пожежі.","Rauchbetrieb mit großen Nachströmöffnungen und eine Unterdruckeinhausung der Gefahrzone sind zwei Zustände desselben Gebäudes. Sie bestehen nebeneinander nur, wenn der Vorrang festgeschrieben, der Rauchweg definiert und der Verlust des Unterdrucks für die Branddauer bewusst akzeptiert ist.","Rookstand met grote toevoeropeningen en een onderdrukinsluiting van de gevarenzone zijn twee toestanden van hetzelfde gebouw. Zij bestaan alleen naast elkaar als de voorrang is vastgelegd, de rookweg is bepaald en het verlies van de onderdruk voor de brandduur bewust is aanvaard.","Le mode désenfumage à grandes amenées d'air et un confinement en dépression de la zone dangereuse sont deux états du même bâtiment. Ils ne coexistent que si la priorité est écrite, le chemin de fumée défini et la perte de dépression acceptée en connaissance de cause pendant l'incendie.","El modo humos con grandes aberturas de reposición y un confinamiento en depresión de la zona peligrosa son dos estados del mismo edificio. Solo coexisten si la prioridad está escrita, la ruta de humos definida y la pérdida de depresión se acepta conscientemente durante el incendio.")},
{id:"w17",k:"warn",a:"m_smokeextract",b:"m_pos",
 x:L("A pressure cascade protecting a clean or product zone does not survive a smoke extraction that opens the compartment. The fire concept has to state which zones lose their cascade, for how long, and what the product status is afterwards.","Каскад надлишкового тиску, що захищає чисту чи продуктову зону, не переживає димовидалення, яке відкриває відсік. Протипожежна концепція має вказати, які зони втрачають каскад, на який час і який статус продукту після цього.","Eine Druckkaskade zum Schutz einer reinen oder Produktzone übersteht eine Rauchabführung, die den Abschnitt öffnet, nicht. Das Brandkonzept muss angeben, welche Zonen ihre Kaskade verlieren, wie lange und welchen Produktstatus das nach sich zieht.","Een drukcascade die een schone of productzone beschermt overleeft een rookafvoer die het compartiment opent niet. Het brandconcept moet aangeven welke zones hun cascade verliezen, hoe lang, en wat de productstatus daarna is.","Une cascade de pression protégeant une zone propre ou produit ne survit pas à un désenfumage qui ouvre le compartiment. Le concept incendie doit indiquer quelles zones perdent leur cascade, pendant combien de temps et quel est ensuite le statut du produit.","Una cascada de presión que protege una zona limpia o de producto no sobrevive a una extracción de humos que abre el sector. El concepto de incendio debe indicar qué zonas pierden su cascada, durante cuánto tiempo y cuál es después el estado del producto.")},
{id:"w18",k:"warn",a:"m_recirc_filt",b:"m_unidir",
 x:L("Recirculated room air under a unidirectional field is possible but has to be argued: the unidirectional flow is only as clean as what feeds it, so filter integrity, leakage monitoring and the substances present in the room decide whether the recirculation is acceptable.","Рециркульоване повітря приміщення під однонаправленим потоком можливе, але потребує обґрунтування: однонаправлений потік настільки чистий, наскільки чисте те, що його живить, тож цілісність фільтрів, контроль негерметичності та наявні в приміщенні речовини визначають прийнятність рециркуляції.","Umluft aus dem Raum unter einem turbulenzarmen Verdrängungsfeld ist möglich, muss aber begründet werden: die Verdrängungsströmung ist nur so sauber wie das, was sie speist; Filterintegrität, Leckageüberwachung und die im Raum vorhandenen Stoffe entscheiden über die Zulässigkeit.","Gerecirculeerde ruimtelucht onder een unidirectioneel veld kan, maar moet worden onderbouwd: de unidirectionele stroom is niet schoner dan wat haar voedt, dus filterintegriteit, lekbewaking en de aanwezige stoffen bepalen of de recirculatie aanvaardbaar is.","De l'air de local recyclé sous un flux unidirectionnel est possible mais doit être argumenté : le flux unidirectionnel n'est propre que dans la mesure de ce qui l'alimente ; intégrité des filtres, surveillance des fuites et substances présentes décident de son acceptabilité.","Aire de local recirculado bajo un flujo unidireccional es posible pero debe argumentarse: el flujo unidireccional solo es tan limpio como lo que lo alimenta; integridad de filtros, vigilancia de fugas y sustancias presentes deciden si la recirculación es aceptable.")},
{id:"w19",k:"warn",a:"m_aircurtain",b:"m_pos",
 x:L("A curtain jet across an opening in a pressure cascade adds its own momentum to the pressure difference. Direction and flow through the opening then depend on the curtain setting, so the cascade has to be verified with the curtain on and off.","Струмінь повітряної завіси через проріз у каскаді тисків додає власний імпульс до перепаду тиску. Напрямок і витрата через проріз тоді залежать від налаштування завіси, тому каскад треба перевіряти із завісою увімкненою і вимкненою.","Ein Schleierstrahl über einer Öffnung in einer Druckkaskade fügt dem Druckunterschied seinen eigenen Impuls hinzu. Richtung und Volumenstrom durch die Öffnung hängen dann von der Schleiereinstellung ab; die Kaskade ist mit ein- und ausgeschaltetem Schleier zu prüfen.","Een luchtgordijnstraal over een opening in een drukcascade voegt zijn eigen impuls toe aan het drukverschil. Richting en debiet door de opening hangen dan af van de gordijninstelling; de cascade moet met gordijn aan én uit worden geverifieerd.","Un jet de rideau d'air en travers d'une ouverture dans une cascade de pression ajoute sa propre quantité de mouvement à la différence de pression. Le sens et le débit à travers l'ouverture dépendent alors du réglage du rideau ; la cascade doit être vérifiée rideau en marche et à l'arrêt.","Un chorro de cortina de aire a través de una abertura en una cascada de presión añade su propio impulso a la diferencia de presión. El sentido y el caudal por la abertura dependen entonces del ajuste de la cortina; la cascada debe verificarse con la cortina en marcha y parada.")},
{id:"w20",k:"warn",a:"m_dryclean",b:"m_dryingmode",
 x:L("A validated drying mode after wet cleaning belongs to a wet cleaning regime. Ticked together with dry cleaning only, the two describe two different cleaning philosophies; say which zones or which campaigns each of them applies to.","Валідований режим сушіння після вологого прибирання належить до вологого регламенту. Позначений разом із «лише сухе прибирання», вони описують дві різні філософії прибирання; вкажіть, до яких зон чи кампаній належить кожна.","Ein validierter Trocknungsmodus nach Nassreinigung gehört zu einem Nassreinigungsregime. Zusammen mit ausschließlich trockener Reinigung angehakt beschreiben beide zwei verschiedene Reinigungsphilosophien; benennen Sie, für welche Bereiche oder Kampagnen jede gilt.","Een gevalideerde droogmodus na natte reiniging hoort bij een nat reinigingsregime. Samen met uitsluitend droge reiniging aangevinkt beschrijven beide twee verschillende reinigingsfilosofieën; benoem voor welke zones of campagnes elk geldt.","Un mode de séchage validé après nettoyage humide relève d'un régime de nettoyage humide. Coché avec un nettoyage exclusivement à sec, les deux décrivent deux philosophies de nettoyage différentes ; précisez à quelles zones ou campagnes chacune s'applique.","Un modo de secado validado tras limpieza húmeda pertenece a un régimen de limpieza húmeda. Marcado junto con limpieza solo en seco, ambos describen dos filosofías de limpieza distintas; indique a qué zonas o campañas se aplica cada una.")},
{id:"w21",k:"warn",a:"m_hrw_wheel",b:"m_hepa_supply",
 x:L("A wheel upstream of a supply protected by a high-efficiency final filter carries part of the extract back across the recovery section. The final filter holds particles but not gases and odour, and the carry-over rate depends on the purge sector and on the fan arrangement; both belong in the acceptance test.","Ротор перед припливом із фінішним фільтром високої ефективності переносить частину витяжки через секцію рекуперації. Фінішний фільтр затримує частинки, але не гази й запах, а перенос залежить від продувного сектора і схеми вентиляторів; обидва належать до приймальних випробувань.","Ein Rad vor einer durch einen Endfilter hoher Abscheidung geschützten Zuluft trägt einen Teil der Abluft über die Rückgewinnungsstufe zurück. Der Endfilter hält Partikel, aber keine Gase und Gerüche; die Übertragungsrate hängt von Spülsektor und Ventilatoranordnung ab — beides gehört in die Abnahmeprüfung.","Een wiel vóór een toevoer die door een eindfilter met hoge afscheiding wordt beschermd, draagt een deel van de afvoer terug over de terugwinsectie. Het eindfilter houdt deeltjes tegen maar geen gassen en geur, en de overdracht hangt af van spoelsector en ventilatoropstelling; beide horen in de opleveringsproef.","Une roue en amont d'un soufflage protégé par un filtre final à haute efficacité ramène une partie de l'extraction à travers l'étage de récupération. Le filtre final retient les particules mais ni les gaz ni les odeurs, et le taux de transfert dépend du secteur de purge et de la disposition des ventilateurs ; les deux relèvent de l'essai de réception.","Una rueda aguas arriba de una impulsión protegida por un filtro final de alta eficacia arrastra parte de la extracción a través de la etapa de recuperación. El filtro final retiene partículas pero no gases ni olor, y la tasa de arrastre depende del sector de purga y de la disposición de ventiladores; ambos entran en el ensayo de recepción.")},
{id:"p01",k:"pair",a:"m_leseal",b:"m_makeup_dist",
 x:L("Source capture only works when the extracted volume is replaced in a controlled way. Without planned make-up air the room goes into depression, doors bind, combustion appliances misbehave and the hood loses its capture velocity.","Вловлювання в джерелі працює лише тоді, коли вилучений об'єм заміщується керовано. Без запланованого припливу приміщення йде в розрідження, двері заклинюють, паливні прилади працюють неправильно, а зонт втрачає швидкість вловлювання.","Quellenerfassung wirkt nur, wenn das abgesaugte Volumen kontrolliert ersetzt wird. Ohne geplante Zuluft gerät der Raum in Unterdruck, Türen klemmen, Feuerstätten arbeiten falsch und die Haube verliert ihre Erfassungsgeschwindigkeit.","Bronafzuiging werkt alleen als het afgezogen volume gecontroleerd wordt aangevuld. Zonder geplande toevoerlucht komt de ruimte in onderdruk, klemmen deuren, werken verbrandingstoestellen verkeerd en verliest de kap zijn vangsnelheid.","Le captage à la source ne fonctionne que si le volume extrait est remplacé de façon maîtrisée. Sans air de compensation prévu, le local se met en dépression, les portes coincent, les appareils à combustion se dérèglent et la hotte perd sa vitesse de captation.","La captación en origen solo funciona si el volumen extraído se repone de forma controlada. Sin aire de compensación previsto, el local entra en depresión, las puertas se traban, los aparatos de combustión fallan y la campana pierde velocidad de captación.")},
{id:"p02",k:"pair",a:"m_neg",b:"m_flowproof",
 x:L("A containment direction is a claim until it is measured. Add differential pressure or flow measurement with an alarm, because a fan status contact does not prove that the room is still in depression.","Напрямок утримання лишається твердженням, доки його не виміряно. Додайте вимірювання перепаду тиску або витрати із сигналізацією, бо контакт стану вентилятора не доводить, що приміщення й далі під розрідженням.","Eine Einschlussrichtung ist eine Behauptung, bis sie gemessen wird. Ergänzen Sie Differenzdruck- oder Volumenstrommessung mit Alarm, denn ein Ventilatorstatuskontakt beweist keinen anhaltenden Unterdruck.","Een insluitrichting is een bewering tot ze gemeten wordt. Voeg drukverschil- of debietmeting met alarm toe, want een ventilatorstatuscontact bewijst geen aanhoudende onderdruk.","Un sens de confinement reste une affirmation tant qu'il n'est pas mesuré. Ajoutez une mesure de pression différentielle ou de débit avec alarme : un contact d'état de ventilateur ne prouve pas la dépression.","Un sentido de confinamiento es una afirmación hasta que se mide. Añada medida de presión diferencial o de caudal con alarma: un contacto de estado de ventilador no prueba la depresión.")},
{id:"p03",k:"pair",a:"m_explvent",b:"m_escape_clear",
 x:L("An explosion vent needs a defined discharge area that nobody can occupy and that does not point at an escape route, an air intake or a neighbouring building.","Скидання вибуху потребує визначеної зони випуску, яку ніхто не може займати і яка не спрямована на шлях евакуації, повітрозабір чи сусідню будівлю.","Eine Druckentlastung braucht einen definierten Ausblasbereich, den niemand betreten kann und der nicht auf Fluchtweg, Ansaugung oder Nachbargebäude zeigt.","Een explosieontlasting heeft een gedefinieerde uitblaaszone nodig die niemand kan betreden en die niet op een vluchtweg, luchtinlaat of naburig gebouw is gericht.","Un évent d'explosion exige une zone de décharge définie, inoccupable, qui ne vise ni une voie d'évacuation, ni une prise d'air, ni un bâtiment voisin.","Un alivio de explosión exige una zona de descarga definida, no ocupable, que no apunte a una vía de escape, una toma de aire ni un edificio vecino.")},
{id:"p04",k:"pair",a:"m_collector_out",b:"m_explisol",
 x:L("Placing the collector outdoors protects the workroom from the vessel, but not from what travels back along the duct. Isolation between collector and process closes that path.","Розміщення пиловловлювача надворі захищає робоче приміщення від апарата, але не від того, що повертається повітроводом. Розв'язка між пиловловлювачем і процесом закриває цей шлях.","Die Aufstellung des Abscheiders im Freien schützt den Arbeitsraum vor dem Behälter, nicht aber vor dem, was durch den Kanal zurückläuft. Die Entkopplung zwischen Abscheider und Prozess schließt diesen Weg.","De afscheider buiten plaatsen beschermt de werkruimte tegen het vat, maar niet tegen wat door het kanaal terugkomt. Isolatie tussen afscheider en proces sluit dat pad.","Installer le dépoussiéreur à l'extérieur protège l'atelier du caisson, mais pas de ce qui remonte par la gaine. Le découplage entre dépoussiéreur et procédé ferme ce chemin.","Situar el separador en el exterior protege la sala del recipiente, pero no de lo que retorna por el conducto. El aislamiento entre separador y proceso cierra esa vía.")},
{id:"p05",k:"pair",a:"m_recirc_filt",b:"m_filtermon",
 x:L("If air is returned to the room, the filter is a barrier and not a comfort item. It needs integrity and leakage monitoring with a defined action on alarm, not only a pressure-drop indication.","Якщо повітря повертається в приміщення, фільтр є бар'єром, а не елементом комфорту. Потрібен контроль цілісності й витоків із визначеною дією за тривогою, а не лише індикація перепаду тиску.","Wird Luft in den Raum zurückgeführt, ist der Filter eine Barriere und kein Komfortbauteil. Er braucht Integritäts- und Leckageüberwachung mit definierter Alarmreaktion, nicht nur eine Druckverlustanzeige.","Wordt lucht naar de ruimte teruggevoerd, dan is het filter een barrière en geen comfortonderdeel. Het vraagt integriteits- en lekkagebewaking met een vastgelegde alarmactie, niet alleen drukvalindicatie.","Si l'air retourne au local, le filtre est une barrière et non un élément de confort. Il faut une surveillance d'intégrité et de fuite avec action définie sur alarme, pas seulement une indication de perte de charge.","Si el aire vuelve al local, el filtro es una barrera y no un elemento de confort. Necesita vigilancia de integridad y fugas con acción definida ante alarma, no solo indicación de pérdida de carga.")},
{id:"p06",k:"pair",a:"m_drylimit",b:"m_dewmon",
 x:L("A dew-point limit that is not measured at several representative points and followed as a trend cannot be defended. A single sensor near the unit tells you about the unit, not about the room.","Межу точки роси, яку не вимірюють у кількох представницьких точках і не відстежують як тренд, захистити неможливо. Один датчик біля установки розповідає про установку, а не про приміщення.","Eine Taupunktgrenze, die nicht an mehreren repräsentativen Stellen gemessen und als Trend verfolgt wird, lässt sich nicht verteidigen. Ein einzelner Fühler am Gerät sagt etwas über das Gerät aus, nicht über den Raum.","Een dauwpuntgrens die niet op meerdere representatieve punten wordt gemeten en als trend gevolgd, is niet te verdedigen. Eén voeler bij de kast vertelt iets over de kast, niet over de ruimte.","Une limite de point de rosée non mesurée en plusieurs points représentatifs et non suivie en tendance ne peut être défendue. Une sonde unique près de la centrale renseigne sur la centrale, pas sur le local.","Un límite de punto de rocío que no se mide en varios puntos representativos ni se sigue como tendencia no puede defenderse. Una sola sonda junto al equipo informa del equipo, no del local.")},
{id:"p07",k:"pair",a:"m_airlock",b:"m_doorinterlock",
 x:L("An airlock whose two doors can be open at once is a corridor. Interlocking, status indication and an alarm on override are what turn it into a barrier.","Шлюз, обидві двері якого можуть бути відчинені одночасно, — це коридор. Бар'єром його роблять блокування, індикація стану та сигналізація при обході блокування.","Eine Schleuse, deren beide Türen zugleich offen sein können, ist ein Flur. Erst Verriegelung, Statusanzeige und Alarm bei Übersteuerung machen daraus eine Barriere.","Een sluis waarvan beide deuren tegelijk open kunnen, is een gang. Vergrendeling, statusindicatie en alarm bij overbrugging maken er een barrière van.","Un sas dont les deux portes peuvent être ouvertes en même temps est un couloir. L'asservissement, l'indication d'état et l'alarme sur forçage en font une barrière.","Una esclusa cuyas dos puertas pueden abrirse a la vez es un pasillo. El enclavamiento, la indicación de estado y la alarma ante anulación la convierten en barrera.")},
{id:"p08",k:"pair",a:"m_wetclean",b:"m_dryingmode",
 x:L("Wet cleaning ends with free water on floors, surfaces and equipment. A validated drying mode removes it without dragging aerosol towards a cleaner zone; without that mode the room simply starts production wet.","Вологе прибирання завершується вільною водою на підлозі, поверхнях і обладнанні. Валідований режим сушіння видаляє її, не тягнучи аерозоль до чистішої зони; без такого режиму приміщення просто починає зміну мокрим.","Nassreinigung endet mit freiem Wasser auf Böden, Flächen und Anlagen. Ein validierter Trocknungsbetrieb entfernt es, ohne Aerosol in eine sauberere Zone zu ziehen; ohne diesen Zustand startet der Raum die Produktion nass.","Nat reinigen eindigt met vrij water op vloeren, oppervlakken en apparatuur. Een gevalideerde droogmodus voert dat af zonder aerosol naar een schonere zone te trekken; zonder die modus begint de ruimte de productie nat.","Le nettoyage humide se termine avec de l'eau libre sur les sols, surfaces et machines. Un mode de séchage validé l'élimine sans entraîner d'aérosol vers une zone plus propre ; sans ce mode, le local démarre la production mouillé.","La limpieza húmeda acaba con agua libre en suelos, superficies y equipos. Un modo de secado validado la elimina sin arrastrar aerosol a una zona más limpia; sin ese modo, el local empieza la producción mojado.")},
{id:"p09",k:"pair",a:"m_gasdet",b:"m_actionplan",
 x:L("A detector without a written access, alarm-response and evacuation procedure produces a noise, not a barrier. Fix as well who may reset it and after which measurement.","Детектор без письмової процедури доступу, реагування на тривогу та евакуації створює шум, а не бар'єр. Зафіксуйте також, хто може його скинути і після якого вимірювання.","Ein Melder ohne schriftliches Zugangs-, Alarmreaktions- und Evakuierungsverfahren erzeugt Lärm, keine Barriere. Legen Sie auch fest, wer ihn nach welcher Messung zurücksetzen darf.","Een melder zonder schriftelijke toegangs-, alarmrespons- en evacuatieprocedure levert geluid op, geen barrière. Leg ook vast wie hem na welke meting mag resetten.","Un détecteur sans procédure écrite d'accès, de réponse à l'alarme et d'évacuation produit du bruit, pas une barrière. Fixez aussi qui peut le réarmer et après quelle mesure.","Un detector sin procedimiento escrito de acceso, respuesta a alarma y evacuación produce ruido, no barrera. Fije también quién puede rearmarlo y tras qué medición.")},
{id:"p10",k:"pair",a:"m_coldstore_lock",b:"m_fastdoor",
 x:L("A loading lock helps only if the door open time is short. Fast doors and the discipline of not parking pallets in the opening are part of the same measure.","Завантажувальний шлюз допомагає лише за короткого часу відкриття дверей. Швидкодійні двері та дисципліна не лишати піддони в прорізі — частина того самого заходу.","Eine Ladeschleuse hilft nur bei kurzer Türöffnungszeit. Schnelllauftore und die Disziplin, keine Paletten in der Öffnung abzustellen, gehören zur selben Maßnahme.","Een laadsluis helpt alleen bij korte deuropeningstijd. Snelloopdeuren en de discipline om geen pallets in de opening te zetten horen bij dezelfde maatregel.","Un sas de chargement n'aide que si le temps d'ouverture est court. Portes rapides et discipline de ne pas stationner de palettes dans l'ouverture font partie de la même mesure.","Una esclusa de carga solo ayuda si el tiempo de apertura es corto. Las puertas rápidas y la disciplina de no dejar palés en el hueco forman parte de la misma medida.")},
{id:"p11",k:"pair",a:"m_pos",b:"m_leakage_def",
 x:L("A pressure setpoint without a defined leakage area and door schedule proves nothing: the same pascal figure can describe a healthy cascade or a room that empties as soon as one door opens.","Уставка тиску без визначеної площі нещільностей і графіка дверей нічого не доводить: одна й та сама цифра в паскалях може означати здоровий каскад або приміщення, що спорожнюється щойно відчиняться одні двері.","Ein Drucksollwert ohne definierte Leckfläche und Türregime beweist nichts: dieselbe Pascalzahl kann eine gesunde Kaskade oder einen Raum beschreiben, der beim Öffnen einer Tür zusammenbricht.","Een druksetpoint zonder gedefinieerd lekoppervlak en deurregime bewijst niets: hetzelfde pascalgetal kan een gezonde cascade of een ruimte beschrijven die leegloopt zodra één deur opengaat.","Une consigne de pression sans surface de fuite ni régime de portes définis ne prouve rien : le même chiffre en pascals peut décrire une cascade saine ou un local qui se vide dès l'ouverture d'une porte.","Una consigna de presión sin área de fuga ni régimen de puertas definido no prueba nada: la misma cifra en pascales puede describir una cascada sana o un local que se vacía al abrir una puerta.")},
{id:"p12",k:"pair",a:"m_firestop",b:"m_causeeffect",
 x:L("Which fan stops, which damper closes, in what order and on which detection input belongs in a written cause-and-effect matrix that the process supplier and the fire authority both recognise.","Який вентилятор зупиняється, який клапан закривається, у якому порядку та за яким сигналом детекції — усе це має бути в письмовій матриці причина-наслідок, визнаній і постачальником процесу, і пожежним органом.","Welcher Ventilator stoppt, welche Klappe schließt, in welcher Reihenfolge und auf welches Detektionssignal — das gehört in eine schriftliche Ursache-Wirkungs-Matrix, die Prozesslieferant und Brandschutzbehörde anerkennen.","Welke ventilator stopt, welke klep sluit, in welke volgorde en op welk detectiesignaal hoort in een geschreven oorzaak-gevolgmatrix die zowel de procesleverancier als de brandweer erkent.","Quel ventilateur s'arrête, quel clapet ferme, dans quel ordre et sur quelle entrée de détection : cela relève d'une matrice cause-effet écrite reconnue par le fournisseur du procédé et l'autorité incendie.","Qué ventilador para, qué compuerta cierra, en qué orden y ante qué señal de detección pertenece a una matriz causa-efecto escrita reconocida por el proveedor del proceso y la autoridad de bomberos.")},
{id:"p13",k:"pair",a:"m_totalflood",b:"m_shutdown_ext",
 x:L("Before the agent is released, the ventilation has to stop and the dampers have to close, otherwise the design concentration is never reached and the hold time is fiction.","Перед випуском вогнегасної речовини вентиляція має зупинитися, а клапани закритися, інакше розрахункова концентрація ніколи не досягається, а час утримання є вигадкою.","Vor der Auslösung muss die Lüftung stoppen und die Klappen müssen schließen, sonst wird die Auslegungskonzentration nie erreicht und die Haltezeit ist Fiktion.","Vóór de uitstoot moet de ventilatie stoppen en moeten de kleppen sluiten, anders wordt de ontwerpconcentratie nooit bereikt en is de houdtijd fictie.","Avant l'émission de l'agent, la ventilation doit s'arrêter et les registres se fermer, sinon la concentration de calcul n'est jamais atteinte et le temps de maintien est une fiction.","Antes de la descarga del agente, la ventilación debe pararse y las compuertas cerrarse; si no, nunca se alcanza la concentración de diseño y el tiempo de retención es ficción.")},
{id:"p14",k:"pair",a:"m_inert",b:"m_o2mon",
 x:L("Inerting displaces oxygen. Any volume that people can enter, and any low space the inert gas can reach, needs oxygen monitoring with an alarm and a written entry rule.","Інертизація витісняє кисень. Будь-який об'єм, куди можуть увійти люди, і будь-який низький простір, куди може дійти інертний газ, потребує контролю кисню із сигналізацією та письмовим правилом входу.","Inertisierung verdrängt Sauerstoff. Jedes von Personen betretbare Volumen und jeder tiefe Raum, den das Inertgas erreichen kann, braucht Sauerstoffüberwachung mit Alarm und eine schriftliche Zutrittsregel.","Inertiseren verdringt zuurstof. Elk volume dat mensen kunnen betreden en elke lage ruimte die het inerte gas kan bereiken, vraagt zuurstofbewaking met alarm en een schriftelijke betredingsregel.","L'inertage déplace l'oxygène. Tout volume accessible aux personnes et tout espace bas que le gaz inerte peut atteindre exige une surveillance d'oxygène avec alarme et une règle d'entrée écrite.","El inertizado desplaza oxígeno. Todo volumen accesible a personas y todo espacio bajo al que pueda llegar el gas inerte exige vigilancia de oxígeno con alarma y una regla de entrada escrita.")}
];

dust3:L("Dust extraction system with duct D = 0,35 m at 20 m/s; declared input value of the example","Система пиловидалення з повітропроводом D = 0,35 m при 20 m/s; оголошене вхідне значення прикладу","Entstaubungsanlage mit Kanal D = 0,35 m bei 20 m/s; erklärter Eingangswert des Beispiels","Stofafzuiging met kanaal D = 0,35 m bij 20 m/s; verklaarde invoerwaarde van het voorbeeld","Installation de dépoussiérage avec gaine D = 0,35 m à 20 m/s ; valeur d'entrée déclarée de l'exemple","Instalación de aspiración de polvo con conducto D = 0,35 m a 20 m/s; valor de entrada declarado del ejemplo"),
dust4:L("Q = 1,924 m³/s; pressure rise 1800 Pa; overall efficiency 0,65","Q = 1,924 m³/s; підвищення тиску 1800 Pa; загальний ККД 0,65","Q = 1,924 m³/s; Druckerhöhung 1800 Pa; Gesamtwirkungsgrad 0,65","Q = 1,924 m³/s; drukverhoging 1800 Pa; totaalrendement 0,65","Q = 1,924 m³/s ; élévation de pression 1800 Pa ; rendement global 0,65","Q = 1,924 m³/s; aumento de presión 1800 Pa; rendimiento global 0,65"),
leak1:L("Steady incompressible approximation at limited pressure differences; equivalent free opening","Стаціонарне нестисливе наближення за обмежених перепадів тиску; еквівалентний вільний отвір","Stationäre inkompressible Näherung bei begrenzten Druckdifferenzen; äquivalente freie Öffnung","Stationaire onsamendrukbare benadering bij beperkte drukverschillen; equivalente vrije opening","Approximation stationnaire incompressible à différences de pression limitées ; ouverture libre équivalente","Aproximación estacionaria incompresible con diferencias de presión limitadas; abertura libre equivalente"),
leak2:L("Ground-level conditions, moderate temperature; large temperature and density differences call for a mass balance instead","Приземні умови, помірна температура; великі різниці температур і густин вимагають переходу до масового балансу","Bodennahe Bedingungen, gemäßigte Temperatur; große Temperatur- und Dichteunterschiede erfordern stattdessen eine Massenbilanz","Omstandigheden nabij maaiveld, gematigde temperatuur; grote temperatuur- en dichtheidsverschillen vragen om een massabalans","Conditions au niveau du sol, température modérée ; de grands écarts de température et de masse volumique imposent un bilan massique","Condiciones a nivel del suelo, temperatura moderada; grandes diferencias de temperatura y densidad exigen un balance másico"),
leak3:L("Equivalent free opening 0,040 m²; discharge coefficient 0,65; density 1,20 kg/m³; steady state; doors closed","Еквівалентний вільний отвір 0,040 m²; коефіцієнт витрати 0,65; густина 1,20 kg/m³; стаціонарний режим; двері зачинені","Äquivalente freie Öffnung 0,040 m²; Durchflussbeiwert 0,65; Dichte 1,20 kg/m³; stationär; Türen geschlossen","Equivalente vrije opening 0,040 m²; afvoercoëfficiënt 0,65; dichtheid 1,20 kg/m³; stationair; deuren dicht","Ouverture libre équivalente 0,040 m² ; coefficient de débit 0,65 ; masse volumique 1,20 kg/m³ ; régime permanent ; portes fermées","Abertura libre equivalente 0,040 m²; coeficiente de descarga 0,65; densidad 1,20 kg/m³; estado estacionario; puertas cerradas"),
cit1:L("Protected-volume mode; equivalent leakage area 0,010 m²; discharge coefficient 0,65; density 1,20 kg/m³; steady state","Режим захищеного об'єму; еквівалентна площа нещільностей 0,010 m²; коефіцієнт витрати 0,65; густина 1,20 kg/m³; стаціонарний режим","Schutzraumbetrieb; äquivalente Leckfläche 0,010 m²; Durchflussbeiwert 0,65; Dichte 1,20 kg/m³; stationär","Beschermde-volumebedrijf; equivalent lekoppervlak 0,010 m²; afvoercoëfficiënt 0,65; dichtheid 1,20 kg/m³; stationair","Mode volume protégé ; surface de fuite équivalente 0,010 m² ; coefficient de débit 0,65 ; masse volumique 1,20 kg/m³ ; régime permanent","Modo de volumen protegido; área de fuga equivalente 0,010 m²; coeficiente de descarga 0,65; densidad 1,20 kg/m³; estado estacionario"),
cit2:L("Supply 5000 m³/h; controlled extract 3000 m³/h; leakage 478 m³/h at 250 Pa","Приплив 5000 m³/h; контрольована витяжка 3000 m³/h; витік 478 m³/h за 250 Pa","Zuluft 5000 m³/h; kontrollierte Abluft 3000 m³/h; Leckstrom 478 m³/h bei 250 Pa","Toevoer 5000 m³/h; gecontroleerde afvoer 3000 m³/h; lekdebiet 478 m³/h bij 250 Pa","Soufflage 5000 m³/h ; extraction contrôlée 3000 m³/h ; fuite 478 m³/h à 250 Pa","Impulsión 5000 m³/h; extracción controlada 3000 m³/h; fuga 478 m³/h a 250 Pa"),
inst1:L("Sensor span, accuracy and zero drift not matched to the decisive tolerance; pressure difference between adjacent zones","Діапазон, точність і дрейф нуля давача не узгоджені з вирішальним допуском; перепад тиску між суміжними зонами","Messbereich, Genauigkeit und Nullpunktdrift des Sensors passen nicht zur entscheidenden Toleranz; Druckdifferenz zwischen benachbarten Zonen","Meetbereik, nauwkeurigheid en nuldrift van de sensor sluiten niet aan op de beslissende tolerantie; drukverschil tussen aangrenzende zones","Étendue, exactitude et dérive de zéro du capteur non adaptées à la tolérance décisive ; différence de pression entre zones adjacentes","Alcance, exactitud y deriva de cero del sensor no ajustados a la tolerancia decisiva; diferencia de presión entre zonas contiguas"),
inst2:L("Measurement uncertainty exceeds the difference; for critical functions a guard band is agreed in advance","Невизначеність вимірювання перевищує різницю; для критичних функцій смугу запасу узгоджують заздалегідь","Die Messunsicherheit übersteigt die Differenz; für kritische Funktionen wird vorab ein Sicherheitsband vereinbart","De meetonzekerheid is groter dan het verschil; voor kritische functies wordt vooraf een veiligheidsband afgesproken","L'incertitude de mesure dépasse l'écart ; pour les fonctions critiques une bande de garde est convenue à l'avance","La incertidumbre de medida supera la diferencia; para funciones críticas se acuerda de antemano una banda de guarda"),
stack1:L("Effective opening area 2,0 m²; height 12 m between the neutral levels; 40 °C inside, 20 °C outside; discharge coefficient 0,65; wind not taken into account","Ефективна площа отворів 2,0 m²; висота 12 m між нейтральними рівнями; 40 °C усередині, 20 °C зовні; коефіцієнт витрати 0,65; вплив вітру не враховано","Wirksame Öffnungsfläche 2,0 m²; Höhe 12 m zwischen den Neutralebenen; 40 °C innen, 20 °C außen; Durchflussbeiwert 0,65; Wind nicht berücksichtigt","Effectief openingsoppervlak 2,0 m²; hoogte 12 m tussen de neutrale vlakken; 40 °C binnen, 20 °C buiten; afvoercoëfficiënt 0,65; wind niet meegenomen","Surface d'ouverture efficace 2,0 m² ; hauteur 12 m entre les plans neutres ; 40 °C intérieur, 20 °C extérieur ; coefficient de débit 0,65 ; vent non pris en compte","Área efectiva de aberturas 2,0 m²; altura 12 m entre niveles neutros; 40 °C interior, 20 °C exterior; coeficiente de descarga 0,65; viento no considerado"),
stack2:L("Steady state; constant representative densities assumed; with stratification the pressure is integrated over the height","Стаціонарний стан; прийнято сталі представницькі густини; за стратифікації тиск інтегрують за висотою","Stationärer Zustand; konstante repräsentative Dichten angenommen; bei Schichtung wird der Druck über die Höhe integriert","Stationaire toestand; constante representatieve dichtheden aangenomen; bij gelaagdheid wordt de druk over de hoogte geïntegreerd","Régime permanent ; masses volumiques représentatives constantes ; en cas de stratification la pression est intégrée sur la hauteur","Estado estacionario; densidades representativas constantes; con estratificación la presión se integra en altura"),
tr1:L("Room and supply steady for the duration of the test; tracer source switched off at the start; supply concentration 420 ppm","Приміщення й приплив стаціонарні на час випробування; джерело трасера вимкнено на початку; концентрація у припливі 420 ppm","Raum und Zuluft während des Versuchs stationär; Tracerquelle zu Beginn abgeschaltet; Zuluftkonzentration 420 ppm","Ruimte en toevoer stationair tijdens de proef; tracerbron bij aanvang uitgeschakeld; toevoerconcentratie 420 ppm","Local et soufflage stationnaires pendant l'essai ; source de traceur coupée au départ ; concentration au soufflage 420 ppm","Local e impulsión estacionarios durante el ensayo; fuente de trazador apagada al inicio; concentración en impulsión 420 ppm"),
tr2:L("Decay from 1200 to 700 ppm in 0,50 h at a nominal 2,5 1/h; background 420 ppm; approximately exponential decay","Спад від 1200 до 700 ppm за 0,50 h за номінальних 2,5 1/h; фон 420 ppm; наближено експоненційний спад","Abfall von 1200 auf 700 ppm in 0,50 h bei nominal 2,5 1/h; Hintergrund 420 ppm; näherungsweise exponentieller Abfall","Daling van 1200 naar 700 ppm in 0,50 h bij nominaal 2,5 1/h; achtergrond 420 ppm; bij benadering exponentiële daling","Décroissance de 1200 à 700 ppm en 0,50 h à 2,5 1/h nominal ; fond 420 ppm ; décroissance approximativement exponentielle","Descenso de 1200 a 700 ppm en 0,50 h con 2,5 1/h nominal; fondo 420 ppm; descenso aproximadamente exponencial"),
tr3:L("Full mixing; locally higher with displacement flow; depends on place and duty and is not a constant property of the system","Повне перемішування; за витісняльного потоку локально може бути вищим; залежить від місця й режиму і не є сталою властивістю системи","Vollständige Durchmischung; bei Verdrängungsströmung örtlich höher; hängt von Ort und Betriebsart ab und ist keine konstante Systemeigenschaft","Volledige menging; bij verdringingsstroming plaatselijk hoger; hangt af van plaats en bedrijfstoestand en is geen constante systeemeigenschap","Mélange complet ; localement plus élevé en flux par déplacement ; dépend du lieu et du régime et n'est pas une propriété constante du système","Mezcla completa; localmente mayor con flujo por desplazamiento; depende del lugar y del régimen y no es una propiedad constante del sistema"),
tr4:L("Ventilation effectiveness 0,82; air change 2,5 1/h; background 420 ppm; source switched off; approximately exponential decay","Ефективність вентиляції 0,82; кратність 2,5 1/h; фон 420 ppm; джерело вимкнено; наближено експоненційний спад","Lüftungswirksamkeit 0,82; Luftwechsel 2,5 1/h; Hintergrund 420 ppm; Quelle abgeschaltet; näherungsweise exponentieller Abfall","Ventilatie-effectiviteit 0,82; luchtwisseling 2,5 1/h; achtergrond 420 ppm; bron uitgeschakeld; bij benadering exponentiële daling","Efficacité de ventilation 0,82 ; taux de renouvellement 2,5 1/h ; fond 420 ppm ; source coupée ; décroissance approximativement exponentielle","Eficacia de ventilación 0,82; renovación 2,5 1/h; fondo 420 ppm; fuente apagada; descenso aproximadamente exponencial"),
cr1:L("Room volume 300 m³; supply 6000 m³/h through a high-efficiency filter; effective mixing and removal factor 0,80; full-mixing model","Об'єм приміщення 300 m³; приплив 6000 m³/h крізь фільтр високої ефективності; ефективний коефіцієнт перемішування та видалення 0,80; модель повного перемішування","Raumvolumen 300 m³; Zuluft 6000 m³/h über Hochleistungsfilter; effektiver Misch- und Abscheidefaktor 0,80; Modell vollständiger Durchmischung","Ruimtevolume 300 m³; toevoer 6000 m³/h via hoogwaardig filter; effectieve meng- en verwijderingsfactor 0,80; volledig-mengmodel","Volume du local 300 m³ ; soufflage 6000 m³/h à travers un filtre à haute efficacité ; facteur effectif de mélange et d'élimination 0,80 ; modèle de mélange complet","Volumen del local 300 m³; impulsión 6000 m³/h a través de filtro de alta eficacia; factor efectivo de mezcla y eliminación 0,80; modelo de mezcla completa"),
cr2:L("Decay from 100 000 to 1000 particles/m³ with 100 particles/m³ in the supply; air change 20 1/h; effectiveness 0,80; full mixing","Спад від 100 000 до 1000 частинок/m³ за 100 частинок/m³ у припливі; кратність 20 1/h; ефективність 0,80; повне перемішування","Abfall von 100 000 auf 1000 Partikel/m³ bei 100 Partikel/m³ in der Zuluft; Luftwechsel 20 1/h; Wirksamkeit 0,80; vollständige Durchmischung","Daling van 100 000 naar 1000 deeltjes/m³ bij 100 deeltjes/m³ in de toevoer; luchtwisseling 20 1/h; effectiviteit 0,80; volledige menging","Décroissance de 100 000 à 1000 particules/m³ avec 100 particules/m³ au soufflage ; taux 20 1/h ; efficacité 0,80 ; mélange complet","Descenso de 100 000 a 1000 partículas/m³ con 100 partículas/m³ en impulsión; renovación 20 1/h; eficacia 0,80; mezcla completa"),
pu1:L("Room volume 500 m³; effective removal factor 0,70; source completely stopped; negligible concentration in the supply","Об'єм приміщення 500 m³; ефективний коефіцієнт видалення 0,70; джерело повністю зупинено; концентрація у припливі знехтувана","Raumvolumen 500 m³; effektiver Abscheidefaktor 0,70; Quelle vollständig gestoppt; vernachlässigbare Zuluftkonzentration","Ruimtevolume 500 m³; effectieve verwijderingsfactor 0,70; bron volledig gestopt; verwaarloosbare concentratie in de toevoer","Volume du local 500 m³ ; facteur effectif d'élimination 0,70 ; source complètement arrêtée ; concentration négligeable au soufflage","Volumen del local 500 m³; factor efectivo de eliminación 0,70; fuente completamente detenida; concentración despreciable en impulsión"),
pu2:L("Solvent; source completely isolated; entry only after measurement; flammability and toxicity need separate thresholds","Розчинник; джерело повністю ізольовано; допуск лише після вимірювання; горючість і токсичність потребують окремих порогів","Lösemittel; Quelle vollständig abgetrennt; Zutritt erst nach Messung; Brennbarkeit und Toxizität erfordern eigene Schwellen","Oplosmiddel; bron volledig afgesloten; toegang pas na meting; brandbaarheid en toxiciteit vragen aparte drempels","Solvant ; source complètement isolée ; accès seulement après mesure ; inflammabilité et toxicité exigent des seuils distincts","Disolvente; fuente completamente aislada; acceso solo tras medición; inflamabilidad y toxicidad exigen umbrales propios"),
pu3:L("Volume 500 m³; air change 6 1/h; effectiveness 0,70; decay from 2000 to 100 ppm; source stopped","Об'єм 500 m³; кратність 6 1/h; ефективність 0,70; спад від 2000 до 100 ppm; джерело зупинено","Volumen 500 m³; Luftwechsel 6 1/h; Wirksamkeit 0,70; Abfall von 2000 auf 100 ppm; Quelle gestoppt","Volume 500 m³; luchtwisseling 6 1/h; effectiviteit 0,70; daling van 2000 naar 100 ppm; bron gestopt","Volume 500 m³ ; taux 6 1/h ; efficacité 0,70 ; décroissance de 2000 à 100 ppm ; source arrêtée","Volumen 500 m³; renovación 6 1/h; eficacia 0,70; descenso de 2000 a 100 ppm; fuente detenida"),
dh1:L("Steady state; dry-air mass flow 2,00 kg/s; inlet 30 °C and 60 % relative humidity at 101,325 kPa","Стаціонарний режим; масова витрата сухого повітря 2,00 kg/s; на вході 30 °C і 60 % відносної вологості за 101,325 kPa","Stationär; Trockenluft-Massenstrom 2,00 kg/s; Eintritt 30 °C und 60 % relative Feuchte bei 101,325 kPa","Stationair; droge-luchtmassastroom 2,00 kg/s; intrede 30 °C en 60 % relatieve vochtigheid bij 101,325 kPa","Régime permanent ; débit massique d'air sec 2,00 kg/s ; entrée 30 °C et 60 % d'humidité relative à 101,325 kPa","Estado estacionario; caudal másico de aire seco 2,00 kg/s; entrada 30 °C y 60 % de humedad relativa a 101,325 kPa"),
dh2:L("Air leaves the coil saturated (idealisation); no moisture is added between the coil and the reheater","Повітря виходить з охолоджувача насиченим (ідеалізація); між охолоджувачем і догрівачем волога не додається","Die Luft verlässt den Kühler gesättigt (Idealisierung); zwischen Kühler und Nacherhitzer wird keine Feuchte zugeführt","De lucht verlaat het koelblok verzadigd (idealisering); tussen koelblok en naverwarmer wordt geen vocht toegevoegd","L'air quitte la batterie saturé (idéalisation) ; aucune humidité n'est ajoutée entre la batterie et le réchauffeur","El aire sale de la batería saturado (idealización); entre la batería y el recalentador no se añade humedad"),
dh3:L("Dry-air mass flow 2,00 kg/s; inlet 30 °C and 60 % relative humidity; saturated outlet at 10 °C","Масова витрата сухого повітря 2,00 kg/s; на вході 30 °C і 60 % відносної вологості; насичений вихід за 10 °C","Trockenluft-Massenstrom 2,00 kg/s; Eintritt 30 °C und 60 % relative Feuchte; gesättigter Austritt bei 10 °C","Droge-luchtmassastroom 2,00 kg/s; intrede 30 °C en 60 % relatieve vochtigheid; verzadigde uittrede bij 10 °C","Débit massique d'air sec 2,00 kg/s ; entrée 30 °C et 60 % d'humidité relative ; sortie saturée à 10 °C","Caudal másico de aire seco 2,00 kg/s; entrada 30 °C y 60 % de humedad relativa; salida saturada a 10 °C"),
dh4:L("Dry-air mass flow 2,00 kg/s; from 10 °C saturated to 18 °C; no moisture added","Масова витрата сухого повітря 2,00 kg/s; від 10 °C у насиченому стані до 18 °C; волога не додається","Trockenluft-Massenstrom 2,00 kg/s; von 10 °C gesättigt auf 18 °C; keine Feuchtezufuhr","Droge-luchtmassastroom 2,00 kg/s; van 10 °C verzadigd naar 18 °C; geen vocht toegevoegd","Débit massique d'air sec 2,00 kg/s ; de 10 °C saturé à 18 °C ; sans apport d'humidité","Caudal másico de aire seco 2,00 kg/s; de 10 °C saturado a 18 °C; sin aporte de humedad"),
dry1:L("Example for moisture-sensitive cell manufacturing; expressly an example and not a universal requirement; the admissible moisture follows from the cell chemistry, the product exposure time and the quality validation","Приклад для виробництва вологочутливих елементів живлення; це явно приклад, а не універсальна вимога; допустима волога випливає з хімії елемента, часу експонування продукту та валідації якості","Beispiel für die Fertigung feuchteempfindlicher Zellen; ausdrücklich ein Beispiel und keine universelle Anforderung; die zulässige Feuchte folgt aus der Zellchemie, der Produktexpositionszeit und der Qualitätsvalidierung","Voorbeeld voor de fabricage van vochtgevoelige cellen; uitdrukkelijk een voorbeeld en geen universele eis; de toelaatbare vochtigheid volgt uit de celchemie, de blootstellingstijd van het product en de kwaliteitsvalidatie","Exemple pour la fabrication de cellules sensibles à l'humidité ; expressément un exemple et non une exigence universelle ; l'humidité admissible découle de la chimie de la cellule, du temps d'exposition du produit et de la validation qualité","Ejemplo para la fabricación de celdas sensibles a la humedad; expresamente un ejemplo y no un requisito universal; la humedad admisible se deriva de la química de la celda, el tiempo de exposición del producto y la validación de calidad"),
fz1:L("Two parallel batteries; the second takes the full flow during defrost; inlet 2 °C and 90 % relative humidity, outlet -8 °C taken as saturated; dry-air mass flow 1,20 kg/s","Дві паралельні батареї; друга приймає весь потік на час відтавання; на вході 2 °C і 90 % відносної вологості, на виході -8 °C, прийнято насиченим; масова витрата сухого повітря 1,20 kg/s","Zwei parallele Register; das zweite übernimmt während der Abtauung den vollen Strom; Eintritt 2 °C und 90 % relative Feuchte, Austritt -8 °C als gesättigt angenommen; Trockenluft-Massenstrom 1,20 kg/s","Twee parallelle batterijen; de tweede neemt tijdens het ontdooien de volle stroom over; intrede 2 °C en 90 % relatieve vochtigheid, uittrede -8 °C als verzadigd aangenomen; droge-luchtmassastroom 1,20 kg/s","Deux batteries en parallèle ; la seconde reprend tout le débit pendant le dégivrage ; entrée 2 °C et 90 % d'humidité relative, sortie -8 °C supposée saturée ; débit massique d'air sec 1,20 kg/s","Dos baterías en paralelo; la segunda asume todo el caudal durante el desescarche; entrada 2 °C y 90 % de humedad relativa, salida -8 °C supuesta saturada; caudal másico de aire seco 1,20 kg/s"),
