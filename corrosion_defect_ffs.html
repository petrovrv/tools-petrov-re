              'Zmodyfikowana metoda B31G (0,85dL)'
            ),
            body: T(
              'Uses a flow stress of SMYS + 69 MPa, an effective metal-loss area of 0.85·d·L and the Folias factor M = √(1 + 0.6275z − 0.003375z²) for z = L²/(D·t) ≤ 50 (M = 0.032z + 3.3 for z > 50). The safe pressure equals F × failure pressure, where F is the design factor (e.g. 0.72).',
              'Використовує напругу течії SMYS + 69 МПа, ефективну площу втрати металу 0,85·d·L і коефіцієнт Фоліаса M = √(1 + 0,6275z − 0,003375z²) для z = L²/(D·t) ≤ 50 (M = 0,032z + 3,3 для z > 50). Безпечний тиск дорівнює F × тиск руйнування, де F — проєктний коефіцієнт (наприклад, 0,72).',
              'Verwendet eine Fließspannung von SMYS + 69 MPa, eine effektive Metallverlustfläche von 0,85·d·L und den Folias-Faktor M = √(1 + 0,6275z − 0,003375z²) für z = L²/(D·t) ≤ 50 (M = 0,032z + 3,3 für z > 50). Der sichere Druck beträgt F × Versagensdruck, wobei F der Auslegungsfaktor ist (z. B. 0,72).',
              'Gebruikt een vloeispanning van SMYS + 69 MPa, een effectief metaalverliesoppervlak van 0,85·d·L en de Folias-factor M = √(1 + 0,6275z − 0,003375z²) voor z = L²/(D·t) ≤ 50 (M = 0,032z + 3,3 voor z > 50). De veilige druk is F × bezwijkdruk, waarbij F de ontwerpfactor is (bijv. 0,72).',
              'Utilise une contrainte d\'écoulement de SMYS + 69 MPa, une aire effective de perte de métal de 0,85·d·L et le facteur de Folias M = √(1 + 0,6275z − 0,003375z²) pour z = L²/(D·t) ≤ 50 (M = 0,032z + 3,3 pour z > 50). La pression admissible vaut F × pression de rupture, F étant le coefficient de calcul (p. ex. 0,72).',
              'Utiliza una tensión de flujo de SMYS + 69 MPa, un área efectiva de pérdida de metal de 0,85·d·L y el factor de Folias M = √(1 + 0,6275z − 0,003375z²) para z = L²/(D·t) ≤ 50 (M = 0,032z + 3,3 para z > 50). La presión segura es F × presión de rotura, donde F es el factor de diseño (p. ej., 0,72).',
              'Stosuje naprężenie płynięcia SMYS + 69 MPa, efektywne pole ubytku 0,85·d·L oraz współczynnik Foliasa M = √(1 + 0,6275z − 0,003375z²) dla z = L²/(D·t) ≤ 50 (M = 0,032z + 3,3 dla z > 50). Ciśnienie bezpieczne wynosi F × ciśnienie niszczące, gdzie F to współczynnik projektowy (np. 0,72).'
            )
          },
          depth: {
            title: T(
              'Defect depth limits (d/t)',
              'Обмеження глибини дефекту (d/t)',
              'Grenzen der Fehlertiefe (d/t)',
              'Grenzen van de defectdiepte (d/t)',
              'Limites de profondeur du défaut (d/t)',
              'Límites de profundidad del defecto (d/t)',
              'Ograniczenia głębokości wady (d/t)'
            ),
            body: T(
              'B31G methods are valid only up to d/t = 0.8, and any defect deeper than 80 % of the wall thickness requires repair regardless of the calculated pressure. Depth measurement uncertainty is significant: DNV-RP-F101 Part A explicitly includes the sizing standard deviation StD[d/t] in its partial safety factors.',
              'Методи B31G чинні лише до d/t = 0,8, а будь-який дефект глибиною понад 80 % товщини стінки потребує ремонту незалежно від розрахункового тиску. Похибка вимірювання глибини суттєва: DNV-RP-F101 Частина A явно враховує стандартне відхилення вимірювання StD[d/t] у часткових коефіцієнтах безпеки.',
              'B31G-Verfahren gelten nur bis d/t = 0,8, und jeder Fehler mit mehr als 80 % der Wanddicke muss unabhängig vom berechneten Druck repariert werden. Die Messunsicherheit der Tiefe ist maßgeblich: DNV-RP-F101 Teil A berücksichtigt die Standardabweichung der Vermessung StD[d/t] explizit in den Teilsicherheitsbeiwerten.',
              'B31G-methoden zijn alleen geldig tot d/t = 0,8, en elk defect dieper dan 80 % van de wanddikte moet worden gerepareerd, ongeacht de berekende druk. De meetonzekerheid van de diepte is belangrijk: DNV-RP-F101 Deel A neemt de standaardafwijking van de meting StD[d/t] expliciet op in de partiële veiligheidsfactoren.',
              'Les méthodes B31G ne sont valables que jusqu\'à d/t = 0,8, et tout défaut dépassant 80 % de l\'épaisseur de paroi doit être réparé, quelle que soit la pression calculée. L\'incertitude de mesure de la profondeur est déterminante : la Partie A de DNV-RP-F101 intègre explicitement l\'écart-type de mesure StD[d/t] dans ses coefficients partiels de sécurité.',
              'Los métodos B31G solo son válidos hasta d/t = 0,8, y todo defecto con más del 80 % del espesor de pared requiere reparación, independientemente de la presión calculada. La incertidumbre de medición de la profundidad es relevante: la Parte A de DNV-RP-F101 incluye explícitamente la desviación estándar de medición StD[d/t] en sus factores parciales de seguridad.',
              'Metody B31G obowiązują tylko do d/t = 0,8, a każda wada głębsza niż 80 % grubości ścianki wymaga naprawy niezależnie od obliczonego ciśnienia. Niepewność pomiaru głębokości ma istotne znaczenie: DNV-RP-F101 Część A jawnie uwzględnia odchylenie standardowe pomiaru StD[d/t] w częściowych współczynnikach bezpieczeństwa.'
            )
          },
          lallow: { title: T('Max allowable defect length', 'Макс. допустима довжина дефекту', 'Max. zulässige Fehlerlänge', 'Max. toelaatbare defectlengte', 'Longueur de défaut max. admissible', 'Longitud máx. admisible del defecto', 'Maks. dopuszczalna długość wady'), body: T('Longest defect of the given depth whose safe pressure still equals MAOP; the chart shows failure pressure versus defect length.', 'Найбільша довжина дефекту заданої глибини, за якої безпечний тиск ще дорівнює MAOP; графік показує тиск руйнування залежно від довжини дефекту.', 'Längster Fehler der gegebenen Tiefe, dessen sicherer Druck noch dem MAOP entspricht; das Diagramm zeigt den Versagensdruck über der Fehlerlänge.', 'Langste defect van de opgegeven diepte waarvan de veilige druk nog gelijk is aan de MAOP; de grafiek toont de bezwijkdruk versus de defectlengte.', 'Défaut le plus long de profondeur donnée dont la pression sûre égale encore la MAOP ; le graphique montre la pression de rupture en fonction de la longueur du défaut.', 'Defecto más largo de la profundidad dada cuya presión segura aún iguala la MAOP; el gráfico muestra la presión de falla frente a la longitud del defecto.', 'Najdłuższa wada o zadanej głębokości, dla której ciśnienie bezpieczne nadal równa się MAOP; wykres pokazuje ciśnienie zniszczenia w funkcji długości wady.') },
          dnv_a: { title: T('DNV-RP-F101 Part A', 'DNV-RP-F101, частина A', 'DNV-RP-F101 Teil A', 'DNV-RP-F101 deel A', 'DNV-RP-F101 partie A', 'DNV-RP-F101 parte A', 'DNV-RP-F101 część A'), body: T('Capacity from SMTS with length factor Q = √(1 + 0.31(L/√(Dt))²) and partial safety factors γm and γd, set by safety class and depth sizing accuracy StD[d/t], gives the allowable pressure directly.', 'Несна здатність за SMTS із коефіцієнтом довжини Q = √(1 + 0,31(L/√(Dt))²) та частковими коефіцієнтами безпеки γm і γd, що залежать від класу безпеки й точності вимірювання глибини StD[d/t], безпосередньо дає допустимий тиск.', 'Die Tragfähigkeit aus SMTS mit Längenfaktor Q = √(1 + 0,31(L/√(Dt))²) und Teilsicherheitsbeiwerten γm und γd, abhängig von Sicherheitsklasse und Genauigkeit der Tiefenmessung StD[d/t], liefert direkt den zulässigen Druck.', 'Capaciteit uit SMTS met lengtefactor Q = √(1 + 0,31(L/√(Dt))²) en partiële veiligheidsfactoren γm en γd, afhankelijk van veiligheidsklasse en nauwkeurigheid van de dieptemeting StD[d/t], geeft direct de toelaatbare druk.', 'La capacité basée sur la SMTS avec le facteur de longueur Q = √(1 + 0,31(L/√(Dt))²) et les coefficients partiels de sécurité γm et γd, fonction de la classe de sécurité et de la précision de mesure de la profondeur StD[d/t], donne directement la pression admissible.', 'La capacidad a partir de la SMTS con factor de longitud Q = √(1 + 0,31(L/√(Dt))²) y factores parciales de seguridad γm y γd, según la clase de seguridad y la precisión de medición de profundidad StD[d/t], da directamente la presión admisible.', 'Nośność z SMTS ze współczynnikiem długości Q = √(1 + 0,31(L/√(Dt))²) i częściowymi współczynnikami bezpieczeństwa γm i γd, zależnymi od klasy bezpieczeństwa i dokładności pomiaru głębokości StD[d/t], daje bezpośrednio ciśnienie dopuszczalne.') },
          dnv_b: { title: T('DNV-RP-F101 Part B (allowable stress)', 'DNV-RP-F101, частина B (допустимі напруження)', 'DNV-RP-F101 Teil B (zulässige Spannungen)', 'DNV-RP-F101 deel B (toelaatbare spanning)', 'DNV-RP-F101 partie B (contrainte admissible)', 'DNV-RP-F101 parte B (tensión admisible)', 'DNV-RP-F101 część B (naprężenia dopuszczalne)'), body: T('Failure pressure is computed from SMTS and the length factor Q, and the safe pressure is F × failure pressure with total usage factor F = F1·F2 (modelling factor F1 = 0.9, operational usage factor F2 typically 0.72–0.9).', 'Тиск руйнування обчислюється за SMTS і коефіцієнтом довжини Q, а безпечний тиск дорівнює F × тиск руйнування із загальним коефіцієнтом використання F = F1·F2 (коефіцієнт моделювання F1 = 0,9, експлуатаційний коефіцієнт використання F2 зазвичай 0,72–0,9).', 'Der Versagensdruck wird aus SMTS und dem Längenfaktor Q berechnet, und der sichere Druck beträgt F × Versagensdruck mit dem Gesamtausnutzungsfaktor F = F1·F2 (Modellfaktor F1 = 0,9, betrieblicher Ausnutzungsfaktor F2 typisch 0,72–0,9).', 'De bezwijkdruk wordt berekend uit SMTS en de lengtefactor Q, en de veilige druk is F × bezwijkdruk met totale gebruiksfactor F = F1·F2 (modelfactor F1 = 0,9, operationele gebruiksfactor F2 doorgaans 0,72–0,9).', 'La pression de rupture est calculée à partir de la SMTS et du facteur de longueur Q, et la pression admissible vaut F × pression de rupture avec le facteur d\'utilisation total F = F1·F2 (facteur de modélisation F1 = 0,9, facteur d\'utilisation opérationnel F2 généralement 0,72–0,9).', 'La presión de rotura se calcula a partir de la SMTS y del factor de longitud Q, y la presión segura es F × presión de rotura con el factor de uso total F = F1·F2 (factor de modelado F1 = 0,9, factor de uso operacional F2 típicamente 0,72–0,9).', 'Ciśnienie niszczące oblicza się na podstawie SMTS i współczynnika długości Q, a ciśnienie bezpieczne wynosi F × ciśnienie niszczące przy całkowitym współczynniku wykorzystania F = F1·F2 (współczynnik modelowania F1 = 0,9, eksploatacyjny współczynnik wykorzystania F2 zwykle 0,72–0,9).') },
          b31g_orig: { title: T('Original B31G (Level 1)', 'Оригінальний B31G (рівень 1)', 'Originales B31G (Stufe 1)', 'Originele B31G (niveau 1)', 'B31G original (niveau 1)', 'B31G original (nivel 1)', 'Oryginalna B31G (poziom 1)'),
            body: T('The 1984 method models the metal loss as a parabola (area 2/3·d·L) with flow stress 1.1·SMYS and a two-term Folias factor M = √(1 + 0.8z). For z > 20 the defect is treated as infinitely long and the area becomes the full rectangle d·L, so for long defects it is usually the most conservative method. It is simple and well proven but often over-conservative for short pits.',
              'Метод 1984 року подає втрату металу як параболу (площа 2/3·d·L) з напругою течії 1,1·SMYS і двочленним коефіцієнтом Фоліаса M = √(1 + 0,8z). Для z > 20 дефект вважається нескінченно довгим, і площа стає повним прямокутником d·L, тож для довгих дефектів це зазвичай найконсервативніший метод. Він простий і перевірений, але для коротких виразок часто надто консервативний.',
              'Das Verfahren von 1984 bildet den Metallverlust als Parabel ab (Fläche 2/3·d·L) mit Fließspannung 1,1·SMYS und zweigliedrigem Folias-Faktor M = √(1 + 0,8z). Für z > 20 gilt der Fehler als unendlich lang und die Fläche wird zum vollen Rechteck d·L, daher ist es bei langen Fehlern meist das konservativste Verfahren. Es ist einfach und bewährt, für kurze Gruben aber oft zu konservativ.',
              'De methode uit 1984 modelleert het metaalverlies als parabool (oppervlak 2/3·d·L) met vloeispanning 1,1·SMYS en een tweetermige Folias-factor M = √(1 + 0,8z). Voor z > 20 wordt het defect als oneindig lang behandeld en wordt het oppervlak de volle rechthoek d·L, zodat het voor lange defecten meestal de meest conservatieve methode is. Ze is eenvoudig en beproefd, maar voor korte putten vaak te conservatief.',
              'La méthode de 1984 représente la perte de métal par une parabole (aire 2/3·d·L) avec une contrainte d’écoulement de 1,1·SMYS et un facteur de Folias à deux termes M = √(1 + 0,8z). Pour z > 20, le défaut est considéré comme infiniment long et l’aire devient le rectangle complet d·L ; pour les défauts longs, c’est donc en général la méthode la plus conservative. Simple et éprouvée, elle est souvent trop conservative pour les piqûres courtes.',
              'El método de 1984 modela la pérdida de metal como una parábola (área 2/3·d·L) con tensión de flujo 1,1·SMYS y un factor de Folias de dos términos M = √(1 + 0,8z). Para z > 20 el defecto se trata como infinitamente largo y el área pasa a ser el rectángulo completo d·L, por lo que en defectos largos suele ser el método más conservador. Es sencillo y probado, pero a menudo demasiado conservador para picaduras cortas.',
              'Metoda z 1984 r. modeluje ubytek jako parabolę (pole 2/3·d·L) z naprężeniem płynięcia 1,1·SMYS i dwuczłonowym współczynnikiem Foliasa M = √(1 + 0,8z). Dla z > 20 wada jest traktowana jako nieskończenie długa, a pole staje się pełnym prostokątem d·L, dlatego dla długich wad jest to zwykle metoda najbardziej zachowawcza. Jest prosta i sprawdzona, ale dla krótkich wżerów często nadmiernie zachowawcza.') },
          folias: { title: T('Folias bulging factor M and length parameter z', 'Коефіцієнт випинання Фоліаса M і параметр довжини z', 'Folias-Ausbauchungsfaktor M und Längenparameter z', 'Folias-uitbollingsfactor M en lengteparameter z', 'Facteur de bombement de Folias M et paramètre de longueur z', 'Factor de abombamiento de Folias M y parámetro de longitud z', 'Współczynnik wybrzuszenia Foliasa M i parametr długości z'),
            body: T('The thinned wall bulges outward under pressure, which concentrates stress at the defect; M describes this and grows with z = L²/(D·t). A short pit (z < 1) has M close to 1 and the remaining ligament carries almost the full hoop stress, while a long groove (z > 50) behaves like a uniformly thinned pipe. Typical values: M = 1.1–1.5 for pits, 3–10 for long general corrosion.',
              'Потоншена стінка під тиском випинається назовні, що концентрує напруження на дефекті; M описує цей ефект і зростає з z = L²/(D·t). Коротка виразка (z < 1) має M близько 1, і залишкова перемичка несе майже повне кільцеве напруження, а довга канавка (z > 50) поводиться як рівномірно потоншена труба. Типові значення: M = 1,1–1,5 для виразок, 3–10 для довгої загальної корозії.',
              'Die geschwächte Wand baucht unter Druck nach außen aus und konzentriert die Spannung am Fehler; M beschreibt dies und wächst mit z = L²/(D·t). Eine kurze Grube (z < 1) hat M nahe 1, das Restligament trägt fast die volle Umfangsspannung, während eine lange Rinne (z > 50) wie ein gleichmäßig abgedünntes Rohr wirkt. Typische Werte: M = 1,1–1,5 für Gruben, 3–10 für lange Flächenkorrosion.',
              'De verzwakte wand bolt onder druk naar buiten, wat de spanning bij het defect concentreert; M beschrijft dit en groeit met z = L²/(D·t). Een korte put (z < 1) heeft M dicht bij 1 en het restligament draagt bijna de volle ringspanning, terwijl een lange groef (z > 50) zich gedraagt als een gelijkmatig verdunde buis. Typische waarden: M = 1,1–1,5 voor putten, 3–10 voor lange algemene corrosie.',
              'La paroi amincie se bombe vers l’extérieur sous pression, ce qui concentre la contrainte au défaut ; M décrit cet effet et croît avec z = L²/(D·t). Une piqûre courte (z < 1) a un M proche de 1 et le ligament restant reprend presque toute la contrainte circonférentielle, tandis qu’une rainure longue (z > 50) se comporte comme un tube uniformément aminci. Valeurs typiques : M = 1,1–1,5 pour les piqûres, 3–10 pour une corrosion généralisée longue.',
              'La pared adelgazada se abomba hacia fuera bajo presión, lo que concentra la tensión en el defecto; M describe este efecto y crece con z = L²/(D·t). Una picadura corta (z < 1) tiene M cercano a 1 y el ligamento restante soporta casi toda la tensión circunferencial, mientras que una ranura larga (z > 50) se comporta como un tubo adelgazado uniformemente. Valores típicos: M = 1,1–1,5 para picaduras, 3–10 para corrosión general larga.',
              'Pocieniona ścianka pod ciśnieniem wybrzusza się na zewnątrz, co koncentruje naprężenia przy wadzie; M opisuje to zjawisko i rośnie z z = L²/(D·t). Krótki wżer (z < 1) ma M bliskie 1, a pozostały mostek przenosi prawie pełne naprężenie obwodowe, natomiast długi rowek (z > 50) zachowuje się jak równomiernie pocieniona rura. Typowe wartości: M = 1,1–1,5 dla wżerów, 3–10 dla długiej korozji ogólnej.') },
          lengthdepth: { title: T('Why a long shallow defect can be worse than a short deep one', 'Чому довгий неглибокий дефект може бути гіршим за короткий глибокий', 'Warum ein langer flacher Fehler schlimmer sein kann als ein kurzer tiefer', 'Waarom een lang ondiep defect erger kan zijn dan een kort diep', 'Pourquoi un défaut long et peu profond peut être pire qu’un défaut court et profond', 'Por qué un defecto largo y poco profundo puede ser peor que uno corto y profundo', 'Dlaczego długa płytka wada może być gorsza od krótkiej głębokiej'),
            body: T('Around a short pit the surrounding full-thickness wall carries the load past the defect (M ≈ 1), so even 60 % depth can be tolerated. A long defect has no such support: the failure pressure tends to flow stress × (1 − d/t) in both B31G and DNV, because M and Q grow with length. Do not rank anomalies by depth alone; always assess depth together with length.',
              'Навколо короткої виразки повнотовщинна стінка переносить навантаження в обхід дефекту (M ≈ 1), тож можна допустити навіть 60 % глибини. Довгий дефект такої підтримки не має: тиск руйнування прямує до напруги течії × (1 − d/t) і за B31G, і за DNV, бо M і Q зростають із довжиною. Не ранжуйте аномалії лише за глибиною; завжди оцінюйте глибину разом із довжиною.',
              'Um eine kurze Grube trägt die volle Wand die Last am Fehler vorbei (M ≈ 1), daher sind sogar 60 % Tiefe tolerierbar. Ein langer Fehler hat diese Stütze nicht: der Versagensdruck strebt gegen Fließspannung × (1 − d/t) sowohl nach B31G als auch nach DNV, weil M und Q mit der Länge wachsen. Bewerten Sie Anzeigen nie nur nach der Tiefe, sondern immer Tiefe und Länge zusammen.',
              'Rond een korte put draagt de volle wand de belasting om het defect heen (M ≈ 1), zodat zelfs 60 % diepte toelaatbaar kan zijn. Een lang defect heeft die steun niet: de bezwijkdruk nadert vloeispanning × (1 − d/t) zowel volgens B31G als DNV, omdat M en Q met de lengte groeien. Rangschik afwijkingen nooit alleen op diepte; beoordeel diepte altijd samen met lengte.',
              'Autour d’une piqûre courte, la paroi pleine épaisseur reprend la charge autour du défaut (M ≈ 1), si bien que même 60 % de profondeur peut être toléré. Un défaut long n’a pas ce soutien : la pression de rupture tend vers contrainte d’écoulement × (1 − d/t) selon B31G comme selon DNV, car M et Q croissent avec la longueur. Ne classez jamais les anomalies sur la seule profondeur ; évaluez toujours profondeur et longueur ensemble.',
              'Alrededor de una picadura corta la pared de espesor completo lleva la carga rodeando el defecto (M ≈ 1), por lo que incluso un 60 % de profundidad puede tolerarse. Un defecto largo no tiene ese apoyo: la presión de rotura tiende a tensión de flujo × (1 − d/t) tanto en B31G como en DNV, porque M y Q crecen con la longitud. No clasifique anomalías solo por profundidad; evalúe siempre profundidad y longitud juntas.',
              'Wokół krótkiego wżeru pełnej grubości ścianka przenosi obciążenie obok wady (M ≈ 1), więc dopuszczalna może być nawet głębokość 60 %. Długa wada nie ma takiego wsparcia: ciśnienie niszczące dąży do naprężenia płynięcia × (1 − d/t) zarówno wg B31G, jak i DNV, bo M i Q rosną z długością. Nie szereguj anomalii tylko według głębokości; zawsze oceniaj głębokość razem z długością.') },
          sizing: { title: T('Depth sizing uncertainty, γd and (d/t)*', 'Похибка вимірювання глибини, γd і (d/t)*', 'Unsicherheit der Tiefenmessung, γd und (d/t)*', 'Onzekerheid van de dieptemeting, γd en (d/t)*', 'Incertitude de mesure de profondeur, γd et (d/t)*', 'Incertidumbre de medición de profundidad, γd y (d/t)*', 'Niepewność pomiaru głębokości, γd i (d/t)*'),
            body: T('DNV Part A raises the measured depth to a characteristic value (d/t)* = d/t + εd·StD[d/t] and multiplies it by γd. When γd·(d/t)* approaches 1 the allowable pressure collapses, which is why a few tenths of a millimetre of extra depth can flip the verdict. Typical in-line inspection accuracy is ±10 % of t at 80 % confidence (StD ≈ 0.08); with StD = 0.16 or worse deep defects often keep no capacity, so re-measure in the field before repairing.',
              'DNV частина A підвищує виміряну глибину до характеристичного значення (d/t)* = d/t + εd·StD[d/t] і множить його на γd. Коли γd·(d/t)* наближається до 1, допустимий тиск різко падає, тому кілька десятих міліметра додаткової глибини можуть змінити висновок. Типова точність внутрішньотрубної діагностики ±10 % t з довірчою ймовірністю 80 % (StD ≈ 0,08); при StD = 0,16 і більше глибокі дефекти часто не мають несної здатності, тож перед ремонтом переміряйте на місці.',
              'DNV Teil A erhöht die gemessene Tiefe auf einen charakteristischen Wert (d/t)* = d/t + εd·StD[d/t] und multipliziert ihn mit γd. Nähert sich γd·(d/t)* dem Wert 1, bricht der zulässige Druck ein; deshalb können wenige Zehntelmillimeter Zusatztiefe das Ergebnis kippen. Typische Molchgenauigkeit ist ±10 % von t bei 80 % Vertrauen (StD ≈ 0,08); bei StD = 0,16 oder schlechter behalten tiefe Fehler oft keine Tragfähigkeit, daher vor einer Reparatur vor Ort nachmessen.',
              'DNV deel A verhoogt de gemeten diepte tot een karakteristieke waarde (d/t)* = d/t + εd·StD[d/t] en vermenigvuldigt die met γd. Als γd·(d/t)* naar 1 gaat, stort de toelaatbare druk in; daarom kunnen enkele tienden van een millimeter extra diepte het oordeel doen kantelen. Typische nauwkeurigheid van een inspectiepig is ±10 % van t bij 80 % betrouwbaarheid (StD ≈ 0,08); bij StD = 0,16 of slechter houden diepe defecten vaak geen draagvermogen over, dus meet in het veld na voordat u repareert.',
              'La partie A de DNV porte la profondeur mesurée à une valeur caractéristique (d/t)* = d/t + εd·StD[d/t] et la multiplie par γd. Quand γd·(d/t)* approche 1, la pression admissible s’effondre ; c’est pourquoi quelques dixièmes de millimètre de profondeur en plus peuvent faire basculer le verdict. La précision typique d’un racleur instrumenté est de ±10 % de t à 80 % de confiance (StD ≈ 0,08) ; avec StD = 0,16 ou pire, les défauts profonds n’ont souvent plus de capacité : remesurez sur site avant de réparer.',
              'La parte A de DNV eleva la profundidad medida a un valor característico (d/t)* = d/t + εd·StD[d/t] y lo multiplica por γd. Cuando γd·(d/t)* se acerca a 1, la presión admisible se desploma; por eso unas décimas de milímetro de profundidad adicional pueden cambiar el veredicto. La precisión típica de un raspatubos inteligente es ±10 % de t con 80 % de confianza (StD ≈ 0,08); con StD = 0,16 o peor, los defectos profundos a menudo se quedan sin capacidad, así que vuelva a medir en campo antes de reparar.',
              'DNV część A podnosi zmierzoną głębokość do wartości charakterystycznej (d/t)* = d/t + εd·StD[d/t] i mnoży ją przez γd. Gdy γd·(d/t)* zbliża się do 1, ciśnienie dopuszczalne gwałtownie spada; dlatego kilka dziesiątych milimetra dodatkowej głębokości może zmienić werdykt. Typowa dokładność tłoka inspekcyjnego to ±10 % t przy ufności 80 % (StD ≈ 0,08); przy StD = 0,16 lub gorszym głębokie wady często tracą nośność, więc przed naprawą zmierz ponownie w terenie.') },
          flowstress: { title: T('Flow stress and SMYS', 'Напруга течії та SMYS', 'Fließspannung und SMYS', 'Vloeispanning en SMYS', 'Contrainte d’écoulement et SMYS', 'Tensión de flujo y SMYS', 'Naprężenie płynięcia i SMYS'),
            body: T('Corroded line pipe fails by plastic collapse, so B31G uses a flow stress between yield and tensile strength: 1.1·SMYS in the original method and SMYS + 69 MPa in the modified one, capped at SMTS. SMYS is the specified minimum of the pipe grade (X52 = 359 MPa, X65 = 448 MPa, X70 = 483 MPa), not the mill test value. Using actual test values without a documented basis removes part of the safety margin.',
              'Корозована труба руйнується пластичним колапсом, тому B31G використовує напругу течії між границею текучості та межею міцності: 1,1·SMYS в оригінальному методі та SMYS + 69 МПа в модифікованому, з обмеженням SMTS. SMYS — це мінімальне значення за класом труби (X52 = 359 МПа, X65 = 448 МПа, X70 = 483 МПа), а не фактичне значення із сертифіката. Використання фактичних значень без задокументованого обґрунтування зменшує запас безпеки.',
              'Korrodierte Leitungsrohre versagen durch plastischen Kollaps, daher verwendet B31G eine Fließspannung zwischen Streckgrenze und Zugfestigkeit: 1,1·SMYS im Originalverfahren und SMYS + 69 MPa im modifizierten, begrenzt auf SMTS. SMYS ist der Mindestwert der Rohrgüte (X52 = 359 MPa, X65 = 448 MPa, X70 = 483 MPa), nicht der Werksprüfwert. Prüfwerte ohne dokumentierte Grundlage zu verwenden, verzehrt einen Teil der Sicherheitsreserve.',
              'Gecorrodeerde leidingbuis bezwijkt door plastische instorting, daarom gebruikt B31G een vloeispanning tussen vloei- en treksterkte: 1,1·SMYS in de originele methode en SMYS + 69 MPa in de gemodificeerde, begrensd tot SMTS. SMYS is de minimumwaarde van de buiskwaliteit (X52 = 359 MPa, X65 = 448 MPa, X70 = 483 MPa), niet de fabriekstestwaarde. Testwaarden gebruiken zonder gedocumenteerde basis kost een deel van de veiligheidsmarge.',
              'Un tube corrodé rompt par effondrement plastique ; B31G utilise donc une contrainte d’écoulement entre limite d’élasticité et résistance à la traction : 1,1·SMYS dans la méthode originale et SMYS + 69 MPa dans la méthode modifiée, plafonnée à la SMTS. La SMYS est le minimum spécifié de la nuance (X52 = 359 MPa, X65 = 448 MPa, X70 = 483 MPa), pas la valeur d’essai en usine. Utiliser des valeurs d’essai sans justification documentée réduit la marge de sécurité.',
              'La tubería corroída falla por colapso plástico, por eso B31G usa una tensión de flujo entre el límite elástico y la resistencia a la tracción: 1,1·SMYS en el método original y SMYS + 69 MPa en el modificado, limitada a la SMTS. La SMYS es el mínimo especificado del grado (X52 = 359 MPa, X65 = 448 MPa, X70 = 483 MPa), no el valor del ensayo de fábrica. Usar valores de ensayo sin una base documentada reduce parte del margen de seguridad.',
              'Skorodowana rura przewodowa niszczy się przez kolaps plastyczny, dlatego B31G stosuje naprężenie płynięcia między granicą plastyczności a wytrzymałością: 1,1·SMYS w metodzie oryginalnej i SMYS + 69 MPa w zmodyfikowanej, ograniczone do SMTS. SMYS to minimalna wartość dla gatunku rury (X52 = 359 MPa, X65 = 448 MPa, X70 = 483 MPa), a nie wartość z atestu. Stosowanie wartości z badań bez udokumentowanej podstawy zmniejsza zapas bezpieczeństwa.') },
          material: { title: T('Tensile strength SMTS, αU and fu,temp in DNV', 'Межа міцності SMTS, αU та fu,temp у DNV', 'Zugfestigkeit SMTS, αU und fu,temp in DNV', 'Treksterkte SMTS, αU en fu,temp in DNV', 'Résistance à la traction SMTS, αU et fu,temp dans DNV', 'Resistencia a la tracción SMTS, αU y fu,temp en DNV', 'Wytrzymałość SMTS, αU i fu,temp w DNV'),
            body: T('DNV-RP-F101 bases capacity on the tensile strength: fu = (SMTS − fu,temp)·αU. αU = 0.96 is the normal material strength factor and 1.00 applies to pipe with supplementary requirement U; fu,temp is the derating above about 50 °C (zero at ambient). Typical SMTS: X52 = 455 MPa, X65 = 531 MPa, X70 = 565 MPa; entering SMYS here instead of SMTS is a common input error.',
              'DNV-RP-F101 базує несну здатність на межі міцності: fu = (SMTS − fu,temp)·αU. αU = 0,96 — звичайний коефіцієнт міцності матеріалу, 1,00 застосовують для труб із додатковою вимогою U; fu,temp — зниження міцності вище приблизно 50 °C (нуль за кімнатної температури). Типові SMTS: X52 = 455 МПа, X65 = 531 МПа, X70 = 565 МПа; введення тут SMYS замість SMTS — поширена помилка.',
              'DNV-RP-F101 stützt die Tragfähigkeit auf die Zugfestigkeit: fu = (SMTS − fu,temp)·αU. αU = 0,96 ist der normale Werkstofffestigkeitsfaktor, 1,00 gilt für Rohr mit Zusatzanforderung U; fu,temp ist die Abminderung oberhalb von etwa 50 °C (null bei Umgebungstemperatur). Typische SMTS: X52 = 455 MPa, X65 = 531 MPa, X70 = 565 MPa; hier SMYS statt SMTS einzugeben, ist ein häufiger Eingabefehler.',
              'DNV-RP-F101 baseert het draagvermogen op de treksterkte: fu = (SMTS − fu,temp)·αU. αU = 0,96 is de normale materiaalsterktefactor en 1,00 geldt voor buis met aanvullende eis U; fu,temp is de reductie boven circa 50 °C (nul bij omgevingstemperatuur). Typische SMTS: X52 = 455 MPa, X65 = 531 MPa, X70 = 565 MPa; hier SMYS in plaats van SMTS invullen is een veelgemaakte fout.',
              'DNV-RP-F101 fonde la capacité sur la résistance à la traction : fu = (SMTS − fu,temp)·αU. αU = 0,96 est le facteur de résistance normal du matériau et 1,00 s’applique aux tubes avec l’exigence supplémentaire U ; fu,temp est la réduction au-delà d’environ 50 °C (nulle à l’ambiante). SMTS typiques : X52 = 455 MPa, X65 = 531 MPa, X70 = 565 MPa ; saisir ici la SMYS au lieu de la SMTS est une erreur fréquente.',
              'DNV-RP-F101 basa la capacidad en la resistencia a la tracción: fu = (SMTS − fu,temp)·αU. αU = 0,96 es el factor normal de resistencia del material y 1,00 se aplica a tubos con el requisito suplementario U; fu,temp es la reducción por encima de unos 50 °C (cero a temperatura ambiente). SMTS típicas: X52 = 455 MPa, X65 = 531 MPa, X70 = 565 MPa; introducir aquí la SMYS en lugar de la SMTS es un error frecuente.',
              'DNV-RP-F101 opiera nośność na wytrzymałości na rozciąganie: fu = (SMTS − fu,temp)·αU. αU = 0,96 to zwykły współczynnik wytrzymałości materiału, a 1,00 stosuje się dla rur z wymaganiem dodatkowym U; fu,temp to redukcja powyżej ok. 50 °C (zero w temperaturze otoczenia). Typowe SMTS: X52 = 455 MPa, X65 = 531 MPa, X70 = 565 MPa; wpisanie tu SMYS zamiast SMTS to częsty błąd.') },
          hoop: { title: T('Pipe geometry, design factor F and MAOP', 'Геометрія труби, проєктний коефіцієнт F і MAOP', 'Rohrgeometrie, Auslegungsfaktor F und MAOP', 'Buisgeometrie, ontwerpfactor F en MAOP', 'Géométrie du tube, facteur de conception F et MAOP', 'Geometría del tubo, factor de diseño F y MAOP', 'Geometria rury, współczynnik projektowy F i MAOP'),
            body: T('All methods start from the Barlow hoop stress σ = P·D/(2t) of the intact pipe, so D and t must be the nominal outside diameter and wall thickness. The design factor F (0.72 for location class 1; 0.60, 0.50 and 0.40 for classes 2–4 under ASME B31.8) and the temperature factor T scale the failure pressure down to a safe pressure. MAOP should be the actual pressure limit of the segment; checking at a lower operating pressure hides defects that matter.',
              'Усі методи виходять із кільцевого напруження за Барлоу σ = P·D/(2t) неушкодженої труби, тож D і t мають бути номінальними зовнішнім діаметром і товщиною стінки. Проєктний коефіцієнт F (0,72 для класу місцевості 1; 0,60, 0,50 і 0,40 для класів 2–4 за ASME B31.8) і температурний коефіцієнт T зменшують тиск руйнування до безпечного тиску. MAOP має бути фактичною межею тиску ділянки; перевірка за нижчого робочого тиску приховує важливі дефекти.',
              'Alle Verfahren gehen von der Barlow-Umfangsspannung σ = P·D/(2t) des intakten Rohres aus, daher müssen D und t Nenn-Außendurchmesser und Nenn-Wanddicke sein. Der Auslegungsfaktor F (0,72 für Ortsklasse 1; 0,60, 0,50 und 0,40 für die Klassen 2–4 nach ASME B31.8) und der Temperaturfaktor T verkleinern den Versagensdruck zum sicheren Druck. MAOP sollte die tatsächliche Druckgrenze des Abschnitts sein; eine Prüfung bei niedrigerem Betriebsdruck verdeckt relevante Fehler.',
              'Alle methoden gaan uit van de Barlow-ringspanning σ = P·D/(2t) van de intacte buis, dus D en t moeten de nominale buitendiameter en wanddikte zijn. De ontwerpfactor F (0,72 voor locatieklasse 1; 0,60, 0,50 en 0,40 voor klassen 2–4 volgens ASME B31.8) en de temperatuurfactor T schalen de bezwijkdruk terug tot een veilige druk. MAOP moet de werkelijke drukgrens van het segment zijn; toetsen bij een lagere bedrijfsdruk verbergt relevante defecten.',
              'Toutes les méthodes partent de la contrainte circonférentielle de Barlow σ = P·D/(2t) du tube intact ; D et t doivent donc être le diamètre extérieur et l’épaisseur nominaux. Le facteur de conception F (0,72 pour la classe d’emplacement 1 ; 0,60, 0,50 et 0,40 pour les classes 2 à 4 selon ASME B31.8) et le facteur de température T ramènent la pression de rupture à une pression admissible. La MAOP doit être la limite réelle de pression du tronçon ; vérifier à une pression de service plus basse masque des défauts importants.',
              'Todos los métodos parten de la tensión circunferencial de Barlow σ = P·D/(2t) del tubo intacto, por lo que D y t deben ser el diámetro exterior y el espesor nominales. El factor de diseño F (0,72 para la clase de ubicación 1; 0,60, 0,50 y 0,40 para las clases 2–4 según ASME B31.8) y el factor de temperatura T reducen la presión de rotura a una presión segura. La MAOP debe ser el límite real de presión del tramo; comprobar a una presión de operación menor oculta defectos relevantes.',
              'Wszystkie metody wychodzą od naprężenia obwodowego Barlowa σ = P·D/(2t) nieuszkodzonej rury, więc D i t muszą być nominalną średnicą zewnętrzną i grubością ścianki. Współczynnik projektowy F (0,72 dla klasy lokalizacji 1; 0,60, 0,50 i 0,40 dla klas 2–4 wg ASME B31.8) i współczynnik temperaturowy T sprowadzają ciśnienie niszczące do ciśnienia bezpiecznego. MAOP powinno być rzeczywistą granicą ciśnienia odcinka; sprawdzenie przy niższym ciśnieniu roboczym ukrywa istotne wady.') },
          scope: { title: T('Scope and common pitfalls', 'Межі застосування та типові помилки', 'Anwendungsbereich und typische Fehler', 'Toepassingsgebied en veelgemaakte fouten', 'Domaine d’application et pièges courants', 'Alcance y errores habituales', 'Zakres stosowania i typowe błędy'),
            body: T('The tool assesses one isolated, longitudinally oriented metal-loss defect under internal pressure only. Interacting defects (closer than about 2√(D·t) axially), circumferential grooves, defects in welds or with cracks, dents with metal loss and combined axial or bending loads need the DNV-RP-F101 interaction rules or a Level 2/3 assessment. Add a corrosion-growth allowance to the depth for the time until the next inspection.',
              'Інструмент оцінює один ізольований поздовжньо орієнтований дефект втрати металу лише під внутрішнім тиском. Взаємодіючі дефекти (ближче приблизно 2√(D·t) по осі), кільцеві канавки, дефекти у зварних швах або з тріщинами, вм’ятини з утратою металу та комбіновані осьові чи згинальні навантаження потребують правил взаємодії DNV-RP-F101 або оцінки рівня 2/3. Додайте до глибини запас на зростання корозії до наступного обстеження.',
              'Das Werkzeug bewertet einen einzelnen, längs orientierten Metallverlustfehler nur unter Innendruck. Interagierende Fehler (axial näher als etwa 2√(D·t)), Umfangsrinnen, Fehler in Schweißnähten oder mit Rissen, Beulen mit Metallverlust und kombinierte Axial- oder Biegelasten erfordern die Interaktionsregeln der DNV-RP-F101 oder eine Bewertung der Stufe 2/3. Schlagen Sie der Tiefe einen Korrosionszuwachs bis zur nächsten Inspektion zu.',
              'De tool beoordeelt één geïsoleerd, axiaal georiënteerd metaalverliesdefect onder alleen inwendige druk. Interacterende defecten (axiaal dichter dan circa 2√(D·t)), omtreksgroeven, defecten in lassen of met scheuren, deuken met metaalverlies en gecombineerde axiale of buigbelastingen vereisen de interactieregels van DNV-RP-F101 of een beoordeling op niveau 2/3. Tel bij de diepte een corrosiegroeitoeslag op voor de tijd tot de volgende inspectie.',
              'L’outil évalue un seul défaut isolé de perte de métal orienté longitudinalement, sous pression interne uniquement. Les défauts en interaction (à moins d’environ 2√(D·t) axialement), les rainures circonférentielles, les défauts dans les soudures ou fissurés, les enfoncements avec perte de métal et les charges axiales ou de flexion combinées exigent les règles d’interaction de DNV-RP-F101 ou une évaluation de niveau 2/3. Ajoutez à la profondeur une marge de croissance de la corrosion jusqu’à la prochaine inspection.',
              'La herramienta evalúa un único defecto aislado de pérdida de metal orientado longitudinalmente, solo bajo presión interna. Los defectos que interactúan (a menos de unos 2√(D·t) en dirección axial), las ranuras circunferenciales, los defectos en soldaduras o con grietas, las abolladuras con pérdida de metal y las cargas axiales o de flexión combinadas requieren las reglas de interacción de DNV-RP-F101 o una evaluación de nivel 2/3. Añada a la profundidad un margen de crecimiento de la corrosión hasta la próxima inspección.',
              'Narzędzie ocenia jedną odosobnioną, wzdłużnie zorientowaną wadę ubytku metalu wyłącznie pod ciśnieniem wewnętrznym. Wady oddziałujące (osiowo bliżej niż ok. 2√(D·t)), rowki obwodowe, wady w spoinach lub z pęknięciami, wgniecenia z ubytkiem oraz złożone obciążenia osiowe lub zginające wymagają reguł interakcji DNV-RP-F101 albo oceny poziomu 2/3. Dodaj do głębokości naddatek na przyrost korozji do następnej inspekcji.') }
        },

          'Fíjese en la dispersión de métodos: B31G y la parte B de DNV aceptan esta picadura corta y profunda con 10,6–11,2 MPa, pero la parte A de DNV da solo 4,32 MPa (ERF 2,31): con d/t = 0,69 decide la incertidumbre de medición de la profundidad, no la longitud.',
          'Spójrz na rozrzut metod: B31G i DNV część B akceptują ten krótki głęboki wżer przy 10,6–11,2 MPa, ale DNV część A daje tylko 4,32 MPa (ERF 2,31): przy d/t = 0,69 decyduje niepewność pomiaru głębokości, a nie długość.'),
        apply: function (t) { presetBase(t); t.D = 1.067; t.t = 0.0159; t.d = 0.011; t.L = 0.05; t.SMYS = 483e6; t.SMTS = 565e6; t.MAOP = 10e6; t.level = 'simple'; } },
      { id: 'x60_reject', group: G2, label: T('X60 20 in, expected reject', 'X60 20 in, очікувана відбраковка', 'X60 20 in, erwartete Ablehnung', 'X60 20 in, verwachte afkeuring', 'X60 20 in, rejet attendu', 'X60 20 in, rechazo esperado', 'X60 20 in, oczekiwane odrzucenie'),
        note: T('Look at the method table: all four methods fail against MAOP 9 MPa, from 6.80 MPa (modified B31G) down to 1.65 MPa (DNV Part A), so the defect must be repaired or the pressure reduced (ERF 5.45).',
          'Подивіться на таблицю методів: усі чотири методи не проходять при MAOP 9 МПа, від 6,80 МПа (модифікований B31G) до 1,65 МПа (DNV частина A), тож дефект треба ремонтувати або знижувати тиск (ERF 5,45).',
          'Achten Sie auf die Methodentabelle: alle vier Methoden versagen gegenüber MAOP 9 MPa, von 6,80 MPa (modifiziertes B31G) bis 1,65 MPa (DNV Teil A); der Fehler muss repariert oder der Druck abgesenkt werden (ERF 5,45).',
          'Kijk naar de methodetabel: alle vier methoden falen tegenover MAOP 9 MPa, van 6,80 MPa (gemodificeerde B31G) tot 1,65 MPa (DNV deel A), dus het defect moet worden gerepareerd of de druk verlaagd (ERF 5,45).',
          'Regardez le tableau des méthodes : les quatre méthodes échouent pour une MAOP de 9 MPa, de 6,80 MPa (B31G modifié) à 1,65 MPa (partie A de DNV) ; il faut réparer le défaut ou réduire la pression (ERF 5,45).',
          'Fíjese en la tabla de métodos: los cuatro métodos fallan frente a una MAOP de 9 MPa, desde 6,80 MPa (B31G modificado) hasta 1,65 MPa (parte A de DNV), así que hay que reparar el defecto o reducir la presión (ERF 5,45).',
          'Spójrz na tabelę metod: wszystkie cztery metody nie spełniają MAOP 9 MPa, od 6,80 MPa (zmodyfikowana B31G) do 1,65 MPa (DNV część A), więc wadę trzeba naprawić albo obniżyć ciśnienie (ERF 5,45).'),
        apply: function (t) { presetBase(t); t.D = 0.508; t.t = 0.00953; t.d = 0.006; t.L = 0.5; t.SMYS = 414e6; t.SMTS = 517e6; t.MAOP = 9e6; t.level = 'full'; } }
    ];
    ui.examples(EX1.concat(EX3, EX2));

    function curveData() {
      if (!last || !last.ok) return null;
      var Lmax = Math.max(3 * state.L, 0.1);
      var La = last.Lallow;
      if (typeof La === 'number' && isFinite(La)) Lmax = Math.max(Lmax, 1.5 * La);
      Lmax = Math.min(Lmax, 20);
      var series = [[], [], [], []];
      var yMax = state.MAOP / 1e6;
      for (var k = 0; k <= 40; k++) {
        var Lk = 0.002 + (Lmax - 0.002) * k / 40;
        var copy = {};
        for (var key in state) {
          if (Object.prototype.hasOwnProperty.call(state, key)) copy[key] = state[key];
        }
        copy.L = Lk;
        var r = solve(copy);
        if (!r || !r.ok) continue;
        for (var i = 0; i < 4; i++) {
          var y = r.rows[i].Psafe / 1e6;
          series[i].push({ x: Lk * 1000, y: y });
          if (y > yMax) yMax = y;
        }
      }
      return {
        series: series,
        xMax: Lmax * 1000,
        yMax: 1.15 * yMax,
        maop: state.MAOP / 1e6,
        Lcur: state.L * 1000,
        cur: last.rows.map(function (r) { return r.Psafe / 1e6; })
      };
    }
    ui.stage({
      caption: T('Safe pressure versus defect length (four methods)', 'Безпечний тиск залежно від довжини дефекту (чотири методи)', 'Sicherer Druck in Abhängigkeit von der Fehlerlänge (vier Methoden)', 'Veilige druk versus defectlengte (vier methoden)', 'Pression admissible en fonction de la longueur du défaut (quatre méthodes)', 'Presión segura frente a la longitud del defecto (cuatro métodos)', 'Ciśnienie bezpieczne w funkcji długości wady (cztery metody)'),
      minHeight: 300,
      a11y: function () {
        var c = curveData(), m = Infinity, i, lg = (ui && ui.lang) || 'en', o;
        if (!c) {
          o = T('Safe pressure versus defect length chart; no result is available.', 'Графік безпечного тиску залежно від довжини дефекту; результат недоступний.', 'Diagramm sicherer Druck über Fehlerlänge; kein Ergebnis verfügbar.', 'Grafiek veilige druk versus defectlengte; geen resultaat beschikbaar.', 'Graphique de la pression admissible en fonction de la longueur du défaut ; aucun résultat disponible.', 'Gráfico de presión segura frente a longitud del defecto; no hay resultado disponible.', 'Wykres ciśnienia bezpiecznego w funkcji długości wady; brak wyniku.');
          return o[lg] || o.en;
        }
        for (i = 0; i < c.cur.length; i++) if (isFinite(c.cur[i]) && c.cur[i] < m) m = c.cur[i];
        o = TF(T('Safe pressure versus defect length for B31G original, B31G modified, DNV Part A and DNV Part B; at L = {0} mm the governing safe pressure is {1} MPa against MAOP {2} MPa.',
          'Безпечний тиск залежно від довжини дефекту за B31G оригінальним, B31G модифікованим, DNV частиною A і DNV частиною B; при L = {0} мм визначальний безпечний тиск {1} МПа проти MAOP {2} МПа.',
          'Sicherer Druck über der Fehlerlänge nach B31G Original, B31G modifiziert, DNV Teil A und DNV Teil B; bei L = {0} mm beträgt der maßgebende sichere Druck {1} MPa gegenüber MAOP {2} MPa.',
          'Veilige druk versus defectlengte volgens B31G origineel, B31G gemodificeerd, DNV deel A en DNV deel B; bij L = {0} mm is de maatgevende veilige druk {1} MPa tegenover MAOP {2} MPa.',
          'Pression admissible en fonction de la longueur du défaut selon B31G original, B31G modifié, DNV partie A et DNV partie B ; à L = {0} mm, la pression admissible déterminante est de {1} MPa pour une MAOP de {2} MPa.',
          'Presión segura frente a la longitud del defecto según B31G original, B31G modificado, DNV parte A y DNV parte B; con L = {0} mm la presión segura determinante es {1} MPa frente a una MAOP de {2} MPa.',
          'Ciśnienie bezpieczne w funkcji długości wady według B31G oryginalnej, B31G zmodyfikowanej, DNV część A i DNV część B; przy L = {0} mm decydujące ciśnienie bezpieczne wynosi {1} MPa wobec MAOP {2} MPa.'),
          [c.Lcur, m, c.maop]);
        return o[lg] || o.en;
      },
      render: function (size, st) {
        var ctx = st.canvas(), w = size.w, h = size.h, coarse = size.density === 'coarse';
        var cs = getComputedStyle(document.documentElement);
        var muted = cs.getPropertyValue('--muted').trim() || '#888';
        var lineC = cs.getPropertyValue('--line').trim() || '#ccc';
        var font = cs.getPropertyValue('--font').trim() || 'sans-serif';
        ctx.clearRect(0, 0, w, h);
        var c = curveData();
        var xMax = c ? c.xMax : 100, yMax = c ? c.yMax : 10;
        var L = coarse ? 46 : 58, R = 14, TOP = 12, B = coarse ? 36 : 44;
        var pw = w - L - R, ph = h - TOP - B, i, j, t, s, p, pen;
        if (pw < 20 || ph < 20) return;
        var X = function (v) { return L + v / xMax * pw; }, Y = function (v) { return TOP + ph - v / yMax * ph; };
        ctx.font = (coarse ? 10 : 11) + 'px ' + font;
        ctx.strokeStyle = muted; ctx.fillStyle = muted; ctx.lineWidth = 1; ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(L, TOP); ctx.lineTo(L, TOP + ph); ctx.lineTo(L + pw, TOP + ph); ctx.stroke();
        var xt = DiagramUI.ticks(0, xMax, pw, size.density), yt = DiagramUI.ticks(0, yMax, ph, size.density);
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        for (i = 0; i < xt.length; i++) { t = xt[i]; ctx.beginPath(); ctx.moveTo(X(t), TOP + ph); ctx.lineTo(X(t), TOP + ph + 4); ctx.stroke(); ctx.fillText(DiagramUI.fmt(t, { precision: 4 }), X(t), TOP + ph + 6); }
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        for (i = 0; i < yt.length; i++) { t = yt[i]; ctx.beginPath(); ctx.moveTo(L - 4, Y(t)); ctx.lineTo(L, Y(t)); ctx.stroke(); ctx.fillText(DiagramUI.fmt(t, { precision: 4 }), L - 6, Y(t)); }
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillText('L, mm', L + pw / 2, h - 2);
        ctx.save(); ctx.translate(2, TOP + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textBaseline = 'top'; ctx.fillText('Psafe, MPa', 0, 0); ctx.restore();
        if (!c) return;
        ctx.save(); ctx.beginPath(); ctx.rect(L, TOP, pw, ph); ctx.clip();
        ctx.setLineDash([5, 4]); ctx.lineWidth = 1;
        if (isFinite(c.maop)) {
          ctx.strokeStyle = lineC; ctx.beginPath(); ctx.moveTo(L, Y(c.maop)); ctx.lineTo(L + pw, Y(c.maop)); ctx.stroke();
          ctx.fillStyle = muted; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText('MAOP', L + pw - 4, Y(c.maop) - 3);
        }
        if (isFinite(c.Lcur)) { ctx.strokeStyle = muted; ctx.beginPath(); ctx.moveTo(X(c.Lcur), TOP); ctx.lineTo(X(c.Lcur), TOP + ph); ctx.stroke(); }
        ctx.setLineDash([]); ctx.lineWidth = 2; ctx.lineJoin = 'round';
        for (i = 0; i < c.series.length; i++) {
          s = c.series[i]; if (!s || !s.length) continue;
          ctx.strokeStyle = DiagramUI.series(i); ctx.beginPath(); pen = false;
          for (j = 0; j < s.length; j++) {
            p = s[j];
            if (p && isFinite(p.x) && isFinite(p.y)) { if (pen) ctx.lineTo(X(p.x), Y(p.y)); else ctx.moveTo(X(p.x), Y(p.y)); pen = true; } else pen = false;
          }
          ctx.stroke();
        }
        for (i = 0; i < c.cur.length; i++) {
          if (!isFinite(c.cur[i]) || !isFinite(c.Lcur)) continue;
          ctx.fillStyle = DiagramUI.series(i); ctx.beginPath(); ctx.arc(X(c.Lcur), Y(c.cur[i]), 4, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      }
    });
    adoptStage(ui);

    ui.ready();
    window['__corrosion_defect_ffs'] = { ui: ui, state: state, solve: solve, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function buildRecord() {
    if (!last) {
      return null;
    }
    var inputKeys = ['D', 't', 'd', 'L', 'SMYS', 'SMTS', 'MAOP', 'fuTemp', 'F', 'T', 'StD', 'alphaU', 'F2', 'safetyClass', 'level'];
    var inputUnitMap = { D: 'm', t: 'm', d: 'm', L: 'm', SMYS: 'Pa', SMTS: 'Pa', MAOP: 'Pa', fuTemp: 'Pa' };
    var inputs = {};
    var units = {};
    var outputs = {};
    var warnings = [];
    var i, k, r, src;
    var st = state || {};
    for (i = 0; i < inputKeys.length; i++) {
      k = inputKeys[i];
      inputs[k] = st[k];
      units[k] = inputUnitMap.hasOwnProperty(k) ? inputUnitMap[k] : '-';
    }
    if (last.ok) {
      outputs.Psafe_min = last.Psafe_min;
      units.Psafe_min = 'Pa';
      outputs.ERF_max = last.ERF_max;
      units.ERF_max = '-';
      outputs.Pf_B31Gmod = last.Pf_B31Gmod;
      units.Pf_B31Gmod = 'Pa';
      if (typeof last.Lallow === 'number' && isFinite(last.Lallow)) {
        outputs.Lallow = last.Lallow;
        units.Lallow = 'm';
      }
      outputs.d_t = last.d_t;
      units.d_t = '-';
      outputs.z = last.z;
      units.z = '-';
      outputs.Q = last.Q;
      units.Q = '-';
      outputs.verdict = last.verdict;
      units.verdict = '-';
      outputs.governing = (last.governing && last.governing.label !== undefined) ? last.governing.label : null;
      units.governing = '-';
      if (last.rows && last.rows.length) {
        for (i = 0; i < last.rows.length; i++) {
          r = last.rows[i];
          if (!r) {
            continue;
          }
          outputs['Psafe_' + r.id] = r.Psafe;
          units['Psafe_' + r.id] = 'Pa';
          if (r.Pf !== null) {
            outputs['Pf_' + r.id] = r.Pf;
            units['Pf_' + r.id] = 'Pa';
          }
        }
      }
      src = last.warnings || [];
      for (i = 0; i < src.length; i++) {
        warnings.push(src[i]);
      }
    } else {
      warnings = [last.error];
    }
    return {
      inputs: inputs,
      outputs: outputs,
      units: units,
      model: {
        equations: [
          'ASME B31G-2012 original (Level 1): Sflow = 1.1 SMYS, parabolic area',
          'ASME B31G-2012 modified (0.85dL): Sflow = SMYS + 69 MPa',
          'DNV-RP-F101 (2019-09) Part A partial safety factors, single defect',
          'DNV-RP-F101 (2019-09) Part B allowable stress, usage factor F2'
        ],
        ranges: [
          'single isolated longitudinal metal-loss defect, internal pressure only, d/t <= 0.8 (B31G) / 0.85 (DNV)'
        ],
        notes: [
          'Psafe = Pf x F x T for B31G; ERF = MAOP / Psafe'
        ]
      },
      warnings: warnings
    };
  }
  var HANDOFF = {
    provides: ['p', 'D'],
    accepts: ['p', 'D'],
    build: function () {
      if (!last || !last.ok) return null;
      return {
        quantities: {
          p: { value: last.Psafe_min, unit: 'Pa' },
          D: { value: state.D, unit: 'm' }
        }
      };
    },
    apply: function (payload) {
      var q = (payload && payload.quantities) || {};
      var map = { p: 'MAOP', D: 'D' };
      var k, v;
      for (k in map) {
        if (!Object.prototype.hasOwnProperty.call(map, k)) continue;
        if (!q[k]) continue;
        v = q[k].value;
        if (typeof v === 'number' && isFinite(v) && v > 0) state[map[k]] = v;
      }
      last = solve(state);
      if (ui) { ui.sync(); ui.run(); }
    }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'corrosion_defect_ffs',
        file: 'corrosion_defect_ffs.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
