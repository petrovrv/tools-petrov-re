  var pmin=Math.min(i.pMin,i.p0*0.999999),
      ps0=waterPsat(i.T0),
      h0=hemAtPressure(i.p0,i.T0,i.p0).h,
      atEnd=hemAtPressure(i.p0,i.T0,pmin),
      interior=o.p_crit>pmin*(1+1e-9);
  var summary=dgcRt('summary')
    .replace('{p0}',n(i.p0/1e5,2)).replace('{T0}',n(i.T0-273.15,1))
    .replace('{pMin}',n(i.pMin/1e5,3)).replace('{Gc}',n(o.Gcrit,1))
    .replace('{pc}',n(o.p_crit/1e5,3)).replace('{x}',n(o.x_crit,4))
    .replace('{Tc}',n(o.T_crit-273.15,1)).replace('{A}',n(i.A*1e6,2))
    .replace('{Cd}',n(i.Cd,2)).replace('{mdot}',n(o.mdot_equiv,4));

  /* Values are shown in the units an engineer reads them in. The record keeps SI. */
  var tiles=[
    row(dgcRt('rGcap'),n(o.Gcrit,1),'kg/(m²·s)'),
    row(dgcRt('rPcrit'),n(o.p_crit/1e5,3),'bar'),
    row(dgcLabel('quality'),n(o.x_crit,4),'-'),
    row(dgcRt('rTeq'),n(o.T_crit-273.15,1),'°C',n(o.T_crit,2)+' K'),
    row(dgcRt('rRhoC'),n(o.rho_crit,2),'kg/m³'),
    row(dgcRt('rMdotEq'),n(o.mdot_equiv,4),'kg/s')
  ];

  var results=[
    row(dgcRt('rSubc'),n((i.p0-ps0)/1e5,3),'bar'),
    row(dgcRt('rRatio'),n(o.p_crit/i.p0,4),'-'),
    row(dgcRt('rDT'),n(i.T0-o.T_crit,2),'K'),
    row(dgcRt('rH'),n(o.h_crit/1000,2),'kJ/kg'),
    row(dgcRt('rDrop'),n((h0-o.h_crit)/1000,2),'kJ/kg'),
    row(dgcRt('rGend'),n(atEnd.G,1),'kg/(m²·s)'),
    row(dgcRt('rQvC'),o.rho_crit>0?n(o.mdot_equiv/o.rho_crit,5):'—','m³/s'),
    row(dgcRt('rAeff'),n(i.A*i.Cd*1e6,3),'mm²')
  ];

  /* Symbols rather than the record's machine keys: a report never prints
     rho_g in a table heading. */
  var SYM={p_sat:'p_s',rho_f:'\u03c1\u2032',rho_g:'\u03c1\u2033'};
  var UN=function(x){return String(x).replace('kg/m3','kg/m\u00b3').replace('kg/(m2 s)','kg/(m\u00b2\u00b7s)');};
  var v=dgcVerify(state);
  var checks=v.map(function(c){
    var st=c.status||(c.pass?'pass':'attention'),actual,criterion,note='';
    if(c.key==='ckFlux'){
      actual='|\u0394G| / G = '+dgcExp(c.rel,2);
      criterion='\u2264 '+dgcExp(c.tol,0);
      note=dgcRt('rFluxAt')+' '+n(c.extra.p/1e5,3)+' bar: '+n(c.got,4)+' '+UN(c.unit);
    } else if(c.key==='ckMax'){
      actual=n(c.got,4)+' '+UN(c.unit);
      criterion='\u2265 '+n(c.ref,4)+' '+UN(c.unit)+' ('+dgcRt('rScanRef')+')';
      note=dgcRt('rBracket')+' '+dgcExp(c.extra.bracket,2)+' \u00b7 '+dgcRt(c.extra.place);
    } else if(c.key==='ckIapws'){
      actual='|\u0394| = '+dgcExp(c.abs,2)+' '+UN(c.unit)+' ('+(SYM[c.extra.q]||c.extra.q)+', '+n(c.extra.T,4)+' K)';
      criterion='\u2264 '+dgcExp(c.tol,1)+' '+UN(c.unit);
      note=c.extra.graded+' '+dgcRt('rIapwsPts');
    } else if(c.key==='ckBranch'){
      actual=c.got==null?'\u2014':dgcRt('rJump')+' '+dgcExp(c.got,2);
      note=c.extra?n(c.extra.p/1e5,4)+' bar: '+n(c.extra.gLiq,2)+' / '+n(c.extra.gTwo,2)+' kg/(m\u00b2\u00b7s)':'';
    } else if(c.key==='ckPlacement'){
      actual='p_crit / p_sat(T\u2080) = '+n(c.got,4)+' ('+dgcRt(c.word)+')';
      note=dgcRt('rBracket')+' '+dgcExp(c.extra.bracket,2);
    } else if(c.key==='ckScan'){
      actual='p_min / p_sat(T\u2080) = '+n(c.got,4)+' ('+dgcRt(c.word)+')';
      criterion='< 1';
    } else if(c.key==='ckSub'){
      actual='p\u2080 \u2212 p_sat(T\u2080) = '+n(c.got/1e5,3)+' bar';
      criterion='> 0 bar';
    } else if(c.key==='ckRhoC'){
      actual='\u03c1\u2032 = '+n(c.got,4)+' kg/m\u00b3, \u03c1\u2033 = '+n(c.extra.rhoG,4)+' kg/m\u00b3';
      criterion='\u03c1_c = '+n(c.ref,0)+' kg/m\u00b3';
      note=n(100*c.rel,3)+' % / '+n(100*c.extra.relG,3)+' % \u00b7 \u03c4 = '+dgcExp(c.extra.tau,2);
    } else {
      actual=n(c.got,0)+' '+dgcRt('rOutside');
      criterion='\u00b12\u03c3';
      note=c.extra.span+' \u00b7 '+dgcRt('rRecorded');
    }
    var r={status:st,title:dgcRt(c.key),actual:actual,basis:dgcRt(c.key+'B'),detail:note};
    if(criterion)r.criterion=criterion;
    return r;
  });
  (rec.warnings||[]).forEach(function(w){checks.push({status:'attention',title:dgcRt('ckSub'),detail:w});});

  /* The engine prints decisions as selection / rationale / governing data, so
     the rationale goes in text and the figure that drives it in driver. */
  var decisions=[
    {label:dgcRt('rDecUp'),text:dgcRt('rWhyUp'),driver:n(i.p0/1e5,2)+' bar / '+n(i.T0-273.15,1)+' °C'},
    {label:dgcRt('rDecScan'),text:dgcRt('rWhyScan'),driver:n(i.pMin/1e5,3)+' bar'},
    {label:dgcRt('rDecArea'),text:dgcRt('rWhyArea'),driver:n(i.A*1e6,2)+' mm² · Cd '+n(i.Cd,2)}
  ];

  var gUp='1 · '+dgcRt('flowUp'),gS='2 · '+dgcRt('flowScan');
  var inputs=[
    {label:ctx.label('p0',u.p0),value:n(i.p0/1e5,3),unit:'bar',group:gUp},
    {label:ctx.label('T0',u.T0),value:n(i.T0-273.15,2),unit:'°C',group:gUp},
    {label:ctx.label('pMin',u.pMin),value:n(i.pMin/1e5,3),unit:'bar',group:gS},
    {label:ctx.label('A',u.A),value:n(i.A*1e6,3),unit:'mm²',group:gS},
    {label:ctx.label('Cd',u.Cd),value:n(i.Cd,3),unit:'-',group:gS}
  ];

  return {
    title:dgcRt('title'),
    executive:{text:[summary],results:tiles,
      conclusion:interior?dgcRt('concInterior'):dgcRt('concBoundary')},
    system:{text:dgcRt('system'),
      flow:[{label:dgcRt('flowUp'),detail:n(i.p0/1e5,2)+' bar / '+n(i.T0-273.15,1)+' °C'},
            {label:dgcRt('flowThroat'),detail:'s = s\u2080'},
            {label:dgcRt('flowScan'),detail:n(i.pMin/1e5,3)+' bar'}]},
    results:results,
    decisions:decisions,
    checks:checks,
    figures:[dgcReportFigure(ctx)].filter(Boolean),
    risks:[{status:'attention',title:dgcRt('riskNonEqT'),detail:dgcRt('riskNonEq')},
           {status:'attention',title:dgcRt('riskLiqT'),detail:dgcRt('riskLiq')}],
    method:{
      equations:(rec.model&&rec.model.equations)||[],
      ranges:(rec.model&&rec.model.ranges)||[],
      notes:[dgcRt('mNote')]
    },
    inputs:inputs
  };
}

/* Cases the published benchmark covers. They live here rather than in a
   separate harness so the artifact is defined by the tool it describes.
   The four numerical cases put the maximiser in the three places it can land:
   at flash onset, inside the two-phase region, and on the scan boundary. */
var DGC_BENCH_CASES=[
 {id:'critical-point-numerical-case-1',
  note:'Shipped default: 50 bar / 250 °C scanned down to 0.1 bar',
  s:{p0:5000000.0,T0:523.15,pMin:10000.0,A:1e-4,Cd:1.0}},
 {id:'critical-point-numerical-case-2',
  note:'Inlet just above saturation: the maximum lies inside the two-phase region',
  s:{p0:1003500.0,T0:453.15,pMin:10000.0,A:1e-4,Cd:1.0}},
 {id:'critical-point-numerical-case-3',
  note:'Scan window stops above flash onset: the maximum lies on the window boundary',
  s:{p0:5000000.0,T0:523.15,pMin:4500000.0,A:2.5e-5,Cd:0.8}},
 {id:'critical-point-numerical-case-4',
  note:'150 bar / 326.85 °C scanned down to 1 bar',
  s:{p0:15000000.0,T0:600.0,pMin:100000.0,A:1e-4,Cd:1.0}}
];
function dgcCmp(o){
  return {check:o.check,
    got:(o.got===undefined?null:o.got),
    ref:(o.ref===undefined?null:o.ref),
    abs:(o.abs===undefined?null:o.abs),
    rel:(o.rel===undefined?null:o.rel),
    tol:(o.tol===undefined?null:o.tol),
    unit:o.unit||'-',
    criterion:o.criterion||null,
    extra:o.extra||null,
    graded:!!o.graded,
    provenance:o.provenance||'recomputed in page',
    status:o.status||(o.ok?'pass':'fail'),
    ok:o.graded?!!o.ok:null};
}
/* Rebuilds the published benchmark record from this page. Open the tool and
   call window.__dgcBenchmark() to reproduce benchmarks/two_phase_critical_flow.json. */
function dgcBenchmark(){
  var cases=[],total=0,passed=0,worstBracket=0,worstRel=null;

  /* 1-4. The critical-point search, against an independent scan of the same
     range and probes either side of the reported pressure. */
  DGC_BENCH_CASES.forEach(function(sc){
    var s=sc.s,pmin=Math.min(s.pMin,s.p0*0.999999),
        cp=dgcCritProbe(s,pmin),os=dgcOnsetStep(s),
        h0=hemAtPressure(s.p0,s.T0,s.p0).h,
        gClosed=Math.sqrt(2*Math.max(0,h0-cp.h))*cp.rho,
        relG=cp.G>0?Math.abs(gClosed-cp.G)/cp.G:0,
        ps0=waterPsat(s.T0);
    if(cp.bracket>worstBracket)worstBracket=cp.bracket;
    if(worstRel===null||cp.rel<worstRel)worstRel=cp.rel;
    cases.push({id:sc.id,note:sc.note,inputs:s,reference_provenance:'recomputed in page',
      cmp:[
        dgcCmp({check:'reported-maximum-not-exceeded',graded:true,ok:cp.rel>=-1e-12,
          got:cp.G,ref:cp.probeG,rel:cp.rel,tol:1e-12,unit:'kg/(m2 s)',
          criterion:'the reported critical mass flux is not exceeded by a 2001-point logarithmic scan of the same pressure range, nor by probes at 1e-8, 1e-6, 1e-4, 1e-3 and 1e-2 relative pressure either side of the reported critical pressure',
          extra:{p_crit:cp.p,probe_p:cp.probeP,quality:cp.x,
                 log_pressure_bracket:cp.bracket,placement:cp.place,
                 p_sat_T0:ps0,p_min_scanned:pmin}}),
        dgcCmp({check:'mass-flux-closure-at-the-critical-point',graded:false,status:'info',
          got:gClosed,ref:cp.G,rel:relG,unit:'kg/(m2 s)',
          criterion:'G = sqrt(2(h0 - h))/v as stated in record.model.equations; reported here because the case is graded on the maximality of the same figure',
          extra:{h0:h0,h:cp.h,rho:cp.rho}}),
        dgcCmp({check:'flash-onset-continuity',graded:false,status:'info',
          got:os?os.rel:null,ref:0,unit:'-',
          criterion:'reported; neither the tool nor SR1-86 supplies an acceptance bound for the step across the branch switch',
          extra:os?{p_sat_T0:os.p,G_liquid_side:os.gLiq,G_two_phase_side:os.gTwo,offset:1e-9}:null})
      ]});
  });

  /* 5-7. IAPWS SR1-86(1992) verification values. */
  for(var k=0;k<DGC_SR1.length;k++){
    var r=dgcIapws(k),cmp=[];
    cmp.push(dgcCmp({check:'sr1-86-verification-values',graded:true,ok:r.pass,
      got:r.worst.got,ref:r.worst.ref,abs:r.worst.dev,rel:r.worst.ratio,tol:r.worst.half,
      unit:r.worst.unit,
      criterion:'worst graded quantity within half a unit in the last digit the SR1-86 table prints',
      extra:{T:r.T,worst_quantity:r.worst.q,
        quantities:r.items.map(function(it){
          return {quantity:it.q,got:it.got,ref:it.ref,deviation:it.dev,
                  half_unit:it.half,ratio:it.ratio,graded:it.graded};})}}));
    if(k===2){
      var cr=dgcCriticalRho();
      cmp.push(dgcCmp({check:'saturated-densities-at-the-critical-temperature',
        graded:false,status:'attention',
        got:cr.rhoL,ref:cr.rhoC,rel:cr.relL,unit:'kg/m3',
        criterion:'rho_f = rho_g = rho_c = 322 kg/m3 at T_c; the tool clamps pressure to p_c(1 - 1e-6) before the temperature inverse, so it does not evaluate at tau = 0 and the published value is not a bound on what it returns there',
        extra:{rho_g:cr.rhoG,rho_g_relative:cr.relG,T_returned:cr.T,tau:cr.tau}}));
    }
    cases.push({id:r.id,note:'IAPWS saturation point '+r.T+' K',
      inputs:{T:r.T},reference_provenance:'recomputed in page',cmp:cmp});
  }

  /* 8-16. The recorded experimental comparison. The measurements are external
     and cannot be produced from the model, so the ids, notes and verdicts of
     the QA record are carried forward unchanged and marked as recorded. */
  dgcLgqCases().forEach(function(c){
    cases.push({id:c.id,note:c.note,inputs:null,reference_provenance:'recorded',
      cmp:[dgcCmp({check:'hem-mass-flux-against-measurement',graded:true,ok:c.pass,
        got:null,ref:null,tol:null,unit:'kg/(m2 s)',provenance:'recorded',
        status:c.pass?'pass':'fail',
        criterion:'HEM mass flux within +/-2 sigma of the reported experimental uncertainty',
        extra:{source:DGC_LGQ_SRC,
          recorded_span_over_the_nine_points:DGC_LGQ_SPAN,
          recomputed_in_page:false}})]});
  });

  cases.forEach(function(c){
    c.pass=c.cmp.every(function(x){return !x.graded||x.ok;});
    c.cmp.forEach(function(x){if(x.graded){total++;if(x.ok)passed++;}});
  });

  var rev='';
  try{rev=JSON.parse(document.getElementById('diagram-tool-manifest').textContent).manifest_revision;}catch(e){}
  var iw=dgcIapwsWorst(),crr=dgcCriticalRho();
  var ex=function(x,n){return x==null||!isFinite(x)?'-':Number(x).toExponential(n);};
  var pc=function(x,n){return x==null||!isFinite(x)?'-':(x*100).toFixed(n)+' %';};
  return {
    schema:'tools.petrov.re/benchmark/v1',
    tool:'two-phase-critical-flow',file:'two_phase_critical_flow.html',manifest_revision:rev,build:rev,
    reference:'An independent rescan of the same pressure range against the tool’s own critical-point search, IAPWS SR1-86(1992) saturation-property verification values, and the recorded Lin-Gruen-Quapp water-nozzle comparison of the HEM mass flux. The first two are recomputed in the page; the third is carried from its QA record.',
    reference_citations:[
      'IAPWS, Revised Supplementary Release on Saturation Properties of Ordinary Water Substance, SR1-86(1992), values for computer-program verification.',
      'Lin, Gruen & Quapp water critical-flow nozzle data as recorded in '+DGC_LGQ_SRC+'.',
      'Mass-flux relation G = sqrt(2(h0 - h))/v and the bounded maximum of G(p) as stated in record.model.equations of two_phase_critical_flow.html.'],
    reference_provenance:'mixed',
    provenance_note:'Recomputed in page, except the nine Lin-Gruen-Quapp cases, which are recorded. This record is exported by window.__dgcBenchmark() on the page itself; no external driver exists for it, and the recorded cases are carried by the page unchanged.',
    tolerance:'The reported maximum must not be exceeded by an independent scan or by local probes; SR1-86 figures within half a unit in the last digit the published table prints; experimental points against +/-2 sigma of the reported uncertainty. Measured on this build: no probe exceeds the reported maximum in any of the four numerical cases, the smallest margin between the two being '+ex(worstRel,3)+' relative, the golden-section refinement leaves a log-pressure bracket of at most '+ex(worstBracket,3)+', and the worst SR1-86 deviation is '+ex(iw.worst.dev,3)+' '+iw.worst.unit+' against an allowed '+ex(iw.worst.half,3)+' '+iw.worst.unit+' on '+iw.worst.q+' at '+iw.worst.T+' K.',
    /* Stamped with the revision the record describes rather than the clock,
       so calling __dgcBenchmark() twice on the same build gives the same file. */
    run_at:(String(rev).split('.')[0]||'2026-09-11')+'T00:00:00Z',
    total:total,passed:passed,failed:total-passed,flagged:0,page_errors:[],
    grading:'total counts checks that carry an acceptance criterion: one per case. The recomputed cases are graded on figures this page produces. The nine experimental cases carry the verdict of the QA record named above and are not recomputed here; they are graded because that record grades them, and their provenance is marked on every row. Items reporting the state of a solved case rather than a bound are recorded with their numbers and excluded from the count.',
    cases:cases,
    model_envelope:'The HEM mass flux spans '+DGC_LGQ_SPAN+' of the measured mass flux across the nine recorded nozzle points. Points 1 to 4 fall inside the reported +/-2 sigma band and points 5 to 9 fall outside it. No correction was fitted to close that gap, so the five failures stand as the edge of the model.',
    not_benchmarked:[
      'Nucleation delay, metastable flashing and phase slip; the model is homogeneous and at equilibrium throughout.',
      'Nozzle and orifice geometry, which enters only through the user-supplied discharge coefficient.',
      'Real-fluid compressed-liquid behaviour; the liquid branch carries one density and an incompressible pressure correction.',
      'Browser/Python parity, which needs a Python runtime and is not re-run in the page.'],
    notes:[
      'Every recomputed figure here is produced by calling window.__dgcBenchmark() on the tool, so any verdict in this record can be reproduced by opening the page.',
      'Case 3 places the maximum on the lower boundary of the scan window rather than inside the range; the reported figure is then a property of the window. The placement of every case is recorded on its row.',
      'At the critical temperature the property routine returns rho_f = '+crr.rhoL.toFixed(4)+' kg/m3 and rho_g = '+crr.rhoG.toFixed(4)+' kg/m3 against rho_c = 322 kg/m3 ('+pc(crr.relL,3)+' and '+pc(crr.relG,3)+'), because waterTsat clamps pressure to p_c(1 - 1e-6) before inverting and the saturated densities vary as tau^(1/3). Only the saturation pressure is graded at that point.',
      'The compressed-liquid Bernoulli branch shared with flashing_valve.html is graded in benchmarks/flashing_valve.json; it is not repeated here.']
  };
}

function buildLearn(){return {version:1,autostart:false,intro:{title:T("Learn this model","Як користуватися моделлю","Modell verstehen","Model leren","Comprendre le modèle","Aprender el modelo","Poznaj model"),body:T("Start with an Example, then change one input at a time. Watch which result moves, which regime is active, and whether the model limitation still fits your case.","Почніть із прикладу, потім змінюйте по одному параметру. Стежте, який результат змінюється, який режим активний і чи відповідають обмеження моделі вашому випадку.","Beginnen Sie mit einem Beispiel und ändern Sie dann jeweils nur eine Eingabe. Beobachten Sie Ergebnis, aktives Regime und Modellgrenze.","Begin met een voorbeeld en wijzig daarna één invoer tegelijk. Bekijk welk resultaat verandert, welk regime actief is en of de modelgrens nog past.","Commencez par un exemple puis modifiez une entrée à la fois. Observez le résultat, le régime actif et la limite du modèle.","Empiece con un ejemplo y cambie una entrada cada vez. Observe qué resultado cambia, qué régimen está activo y si el límite del modelo sigue siendo válido.","Zacznij od przykładu, potem zmieniaj po jednym parametrze. Obserwuj wynik, aktywny reżim i to, czy granice modelu nadal pasują do przypadku.")},topics:{'t1':{title:T("Initial state / inputs","Початковий стан / вхідні дані","Anfangszustand / Eingaben","Begintoestand / invoer","État initial / entrées","Estado inicial / entradas","Stan początkowy / dane"),body:T("These values establish the inventory and starting thermodynamic or hydraulic state.","Ці значення задають запас і початковий термодинамічний або гідравлічний стан.","Diese Werte legen Inventar und thermodynamischen bzw. hydraulischen Anfangszustand fest.","Deze waarden bepalen inventaris en thermodynamische of hydraulische begintoestand.","Ces valeurs fixent l’inventaire et l’état thermodynamique ou hydraulique initial.","Estos valores fijan el inventario y el estado termodinámico o hidráulico inicial.","Te wartości ans flash, remplissage/vidange ou stockage/déstockage. Elles changent la branche de calcul.","Vigile cambios como choked/subcrítico, flashing/sin flashing, llenado/vaciado o packing/depacking. Cambian la rama gobernante del cálculo.","Obserwuj przejścia krytyczny/podkrytyczny, flashing/brak flashingu, napełnianie/opróżnianie lub packing/depacking. Zmieniają one gałąź równań.")},'t4':{title:T("Model boundary","Межа моделі","Modellgrenze","Modelgrens","Limite du modèle","Límite del modelo","Granica modelu"),body:T("Use the stated limitation as part of the result. A numerically converged answer outside the model assumptions is not a validated design answer.","Сприймайте зазначене обмеження як частину результату. Чисельно збіжна відповідь поза припущеннями моделі не є валідованою проєктною відповіддю.","Die angegebene Einschränkung gehört zum Ergebnis. Eine numerisch konvergierte Lösung außerhalb der Modellannahmen ist keine validierte Auslegungsantwort.","De vermelde beperking hoort bij het resultaat. Een numeriek geconvergeerd antwoord buiten de modelaannames is geen gevalideerd ontwerpantwoord.","La limitation déclarée fait partie du résultat. Une solution convergée hors des hypothèses du modèle n’est pas une réponse de conception validée.","La limitación declarada forma parte del resultado. Una solución convergida fuera de las hipótesis no es una respuesta de diseño validada.","Podane ograniczenie jest częścią wyniku. Numerycznie zbieżna odpowiedź poza założeniami modelu nie jest zwalidowaną odpowiedzią projektową.")}},tour:[{topic:'t1',focus:'[data-dgu-panel=\"dgu-examples\"]'},{topic:'t2',focus:'[data-dgu-panel=\"upstream\"]'},{topic:'t3',focus:'[data-dgu-panel=\"area\"]'},{topic:'t4',focus:'[data-dgu-panel=\"io\"]'}]};}

var W_TC=647.096,W_PC=22.064e6,W_RHOC=322;
var W_PA=[-7.85951783,1.84408259,-11.7866497,22.6807411,-15.9618719,1.80122502],W_PN=[1,1.5,3,3.5,4,7.5];
var W_LA=[1.99274064,1.09965342,-0.510839303,-1.75493479,-45.5170352,-6.74694450e5],W_LN=[1/3,2/3,5/3,16/3,43/3,110/3];
var W_GA=[-2.03150240,-2.68302940,-5.38626492,-17.2991605,-44.7586581,-63.9201063],W_GN=[2/6,4/6,8/6,18/6,37/6,71/6];
function waterPsat(T){var th=T/W_TC,tau=1-th,F=0;for(var i=0;i<W_PA.length;i++)F+=W_PA[i]*Math.pow(tau,W_PN[i]);return W_PC*Math.exp(F/th);}
function waterTsat(p){p=Math.max(611.657,Math.min(W_PC*0.999999,p));var lo=273.16,hi=W_TC-1e-5;for(var i=0;i<70;i++){var m=.5*(lo+hi);if(waterPsat(m)>p)hi=m;else lo=m;}return .5*(lo+hi);}
function waterSat(p){var T=waterTsat(p),th=T/W_TC,tau=1-th,F=0,Ft=0,i;for(i=0;i<W_PA.length;i++){F+=W_PA[i]*Math.pow(tau,W_PN[i]);Ft+=W_PA[i]*W_PN[i]*Math.pow(tau,W_PN[i]-1);}var ps=W_PC*Math.exp(F/th),dpdT=ps*(-th*Ft-F)/(W_TC*th*th),rhoL=W_RHOC,rhoGlog=0;for(i=0;i<W_LA.length;i++)rhoL+=W_RHOC*W_LA[i]*Math.pow(tau,W_LN[i]);for(i=0;i<W_GA.length;i++)rhoGlog+=W_GA[i]*Math.pow(tau,W_GN[i]);var rhoG=W_RHOC*Math.exp(rhoGlog),d1=-5.65134998e-8,d2=2690.66631,d3=127.287297,d4=-135.003439,d5=0.981825814,alpha=1000*(-1135.905627715+d1*Math.pow(th,-19)+d2*th+d3*Math.pow(th,4.5)+d4*Math.pow(th,5)+d5*Math.pow(th,54.5)),phi=(1000/W_TC)*(2319.5246+(19/20)*d1*Math.pow(th,-20)+d2*Math.log(th)+(9/7)*d3*Math.pow(th,3.5)+(5/4)*d4*Math.pow(th,4)+(109/107)*d5*Math.pow(th,53.5)),hf=alpha+T*dpdT/rhoL,hg=alpha+T*dpdT/rhoG,sf=phi+dpdT/rhoL,sg=phi+dpdT/rhoG;return {T:T,hf:hf,hfg:hg-hf,sf:sf,sfg:sg-sf,rhoL:rhoL,rhoG:rhoG};}
function hemAtPressure(p0,T0,p){var ps0=waterPsat(T0),sat0=waterSat(ps0),rho0=sat0.rhoL,h0=sat0.hf+Math.max(0,p0-ps0)/rho0,s0=sat0.sf;if(p>=ps0&&p<=p0){var dhL=Math.max(0,(p0-p)/rho0),vL=1/rho0,hL=h0-dhL;return {p:p,T:T0,x:0,h:hL,v:vL,rho:rho0,G:Math.sqrt(2*dhL)/vL};}var sat=waterSat(p),x=Math.max(0,Math.min(1,(s0-sat.sf)/Math.max(sat.sfg,1))),h=sat.hf+x*sat.hfg,v=(1-x)/sat.rhoL+x/sat.rhoG,dh=Math.max(0,h0-h),G=Math.sqrt(2*dh)/Math.max(v,1e-12);return {p:p,T:sat.T,x:x,h:h,v:v,rho:1/v,G:G};}
function hemCritical(p0,T0,pmin){var n=240,arr=[],bestI=0,l0=Math.log(Math.max(pmin,611.657)),l1=Math.log(p0);for(var i=0;i<=n;i++){var lp=l1+(l0-l1)*i/n,z=hemAtPressure(p0,T0,Math.exp(lp));arr.push(z);if(z.G>arr[bestI].G)bestI=i;}var best=arr[bestI];if(bestI>0&&bestI<n){var a=Math.log(arr[bestI+1].p),b=Math.log(arr[bestI-1].p),gr=(Math.sqrt(5)-1)/2,c=b-gr*(b-a),d=a+gr*(b-a),zc=hemAtPressure(p0,T0,Math.exp(c)),zd=hemAtPressure(p0,T0,Math.exp(d));for(var k=0;k<48;k++){if(zc.G>zd.G){b=d;d=c;zd=zc;c=b-gr*(b-a);zc=hemAtPressure(p0,T0,Math.exp(c));}else{a=c;c=d;zc=zd;d=a+gr*(b-a);zd=hemAtPressure(p0,T0,Math.exp(d));}}best=zc.G>zd.G?zc:zd;if(arr[bestI].G>best.G)best=arr[bestI];}return {best:best,curve:arr};}

function solve(s){var crit=hemCritical(s.p0,s.T0,Math.min(s.pMin,s.p0*.999999)),b=crit.best,x=[],y=[];crit.curve.forEach(function(z){x.push(z.p/1e5);y.push(z.G)});return {p:b.p,T:b.T,rho:b.rho,xq:b.x,h:b.h,Gcrit:b.G,mdot:s.Cd*s.A*b.G,series:[{x:x,y:y}],a11y:'Two-phase critical mass-flux curve.',warnings:(s.p0<waterPsat(s.T0)?['Upstream state is not compressed/subcooled liquid (p0 < psat(T0)); this flashing-liquid model is outside its intended range.']:[]).concat(s.pMin>=s.p0?['Minimum scanned pressure must be below upstream pressure.']:[]),notes:['The 241-point logarithmic grid is used for plotting and bracketing; an interior maximum is refined with 48 golden-section iterations in log-pressure.']};}

/* ---- handoff receiver bound (AGENTS.md 2.4; _docs/TZ-engineering-workflow.md 5.1)

   Where the field declares none, the bound is the one this tool's own model

function hoRanges(){

function hoNum(v){if(v==null||typeof v!=='number'||!isFinite(v))return '—';if(v===0)return '0';var a=Math.abs(v);

/* A quantity refused for range is not a quantity this tool does not use: the

function hoOut(v,r){if(!r||typeof v!=='number'||!isFinite(v))return true;

 return false;}

 record:function(){if(!last)return null;return {inputs:{"p0":state["p0"],"T0":state["T0"],"pMin":state["pMin"],"A":state["A"],"Cd":state["Cd"]},outputs:{"Gcrit":last.Gcrit,"p_crit":last.p,"T_crit":last.T,"x_crit":last.xq,"rho_crit":last.rho,"h_crit":last.h,"mdot_equiv":last.mdot},units:{"p0":"Pa","T0":"K","pMin":"Pa","A":"m2","Cd":"-","Gcrit":"kg/(m2 s)","p_crit":"Pa","T_crit":"K","x_crit":"-","rho_crit":"kg/m3","h_crit":"J/kg","mdot_equiv":"kg/s"},model:{equations:["same water saturation/property screen as flashing_valve.html", "isentropic equilibrium quality from s0 = sf + x sfg", "G(p) = sqrt(2(h0-h))/v", "critical point = bounded maximum of G(p), bracketed by the pressure scan and refined in log-pressure"],ranges:["water only", "homogeneous equilibrium model", "241 logarithmic pressure points for plot/bracketing; 48-iteration golden-section refinement for an interior maximum"],notes:["same HEM core as flashing_valve.html so the critical cap is internally consistent"]},warnings:last.warnings||[]};},
 python:function(){return {code:"\nW_TC=647.096; W_PC=22.064e6; W_RHOC=322.0\nW_PA=(-7.85951783,1.84408259,-11.7866497,22.6807411,-15.9618719,1.80122502); W_PN=(1,1.5,3,3.5,4,7.5)\nW_LA=(1.99274064,1.09965342,-0.510839303,-1.75493479,-45.5170352,-6.74694450e5); W_LN=(1/3,2/3,5/3,16/3,43/3,110/3)\nW_GA=(-2.03150240,-2.68302940,-5.38626492,-17.2991605,-44.7586581,-63.9201063); W_GN=(2/6,4/6,8/6,18/6,37/6,71/6)\ndef water_psat(T):\n    th=T/W_TC; tau=1-th; F=sum(a*tau**n for a,n in zip(W_PA,W_PN))\n    return W_PC*math.exp(F/th)\ndef water_tsat(p):\n    p=max(611.657,min(W_PC*0.999999,p)); lo=273.16; hi=W_TC-1e-5\n    for _ in range(70):\n        m=.5*(lo+hi)\n        if water_psat(m)>p: hi=m\n        else: lo=m\n    return .5*(lo+hi)\ndef water_sat(p):\n    T=water_tsat(p); th=T/W_TC; tau=1-th\n    F=sum(a*tau**n for a,n in zip(W_PA,W_PN)); Ft=sum(a*n*tau**(n-1) for a,n in zip(W_PA,W_PN)); ps=W_PC*math.exp(F/th)\n    dpdT=ps*(-th*Ft-F)/(W_TC*th*th)\n    rhoL=W_RHOC*(1+sum(a*tau**n for a,n in zip(W_LA,W_LN))); rhoG=W_RHOC*math.exp(sum(a*tau**n for a,n in zip(W_GA,W_GN)))\n    d1=-5.65134998e-8; d2=2690.66631; d3=127.287297; d4=-135.003439; d5=0.981825814\n    alpha=1000*(-1135.905627715+d1*th**-19+d2*th+d3*th**4.5+d4*th**5+d5*th**54.5)\n    phi=(1000/W_TC)*(2319.5246+(19/20)*d1*th**-20+d2*math.log(th)+(9/7)*d3*th**3.5+(5/4)*d4*th**4+(109/107)*d5*th**53.5)\n    hf=alpha+T*dpdT/rhoL; hg=alpha+T*dpdT/rhoG; sf=phi+dpdT/rhoL; sg=phi+dpdT/rhoG\n    return T,hf,hg-hf,sf,sg-sf,rhoL,rhoG\ndef hem_at(p0,T0,p):\n    ps0=water_psat(T0); T_sat0,hf0,hfg0,sf0,sfg0,rho0,rhog0=water_sat(ps0)\n    h0=hf0+max(0.0,p0-ps0)/rho0; s0=sf0\n    if ps0<=p<=p0:\n        dh=max(0.0,(p0-p)/rho0); v=1.0/rho0; h=h0-dh\n        return {'p':p,'T':T0,'x':0.0,'h':h,'v':v,'rho':rho0,'G':math.sqrt(2*dh)/v}\n    T,hf,hfg,sf,sfg,rhoL,rhoG=water_sat(p)\n    x=max(0.0,min(1.0,(s0-sf)/max(sfg,1.0))); h=hf+x*hfg; v=(1-x)/rhoL+x/rhoG\n    dh=max(0.0,h0-h); G=math.sqrt(2*dh)/max(v,1e-12)\n    return {'p':p,'T':T,'x':x,'h':h,'v':v,'rho':1/v,'G':G}\ndef hem_critical(p0,T0,pmin):\n    l0=math.log(max(pmin,611.657)); l1=math.log(p0); arr=[]\n    for i in range(241):\n        p=math.exp(l1+(l0-l1)*i/240); arr.append(hem_at(p0,T0,p))\n    best_i=max(range(len(arr)),key=lambda i:arr[i]['G']); best=arr[best_i]\n    if 0<best_i<240:\n        a=math.log(arr[best_i+1]['p']); b=math.log(arr[best_i-1]['p']); gr=(math.sqrt(5)-1)/2\n        c=b-gr*(b-a); d=a+gr*(b-a); zc=hem_at(p0,T0,math.exp(c)); zd=hem_at(p0,T0,math.exp(d))\n        for _ in range(48):\n            if zc['G']>zd['G']:\n                b=d; d=c; zd=zc; c=b-gr*(b-a); zc=hem_at(p0,T0,math.exp(c))\n            else:\n                a=c; c=d; zc=zd; d=a+gr*(b-a); zd=hem_at(p0,T0,math.exp(d))\n        refined=zc if zc['G']>zd['G'] else zd\n        if refined['G']>best['G']: best=refined\n    return best\n\ndef compute():\n    p0=INPUTS['p0']; T0=INPUTS['T0']; pMin=INPUTS['pMin']; A=INPUTS['A']; Cd=INPUTS['Cd']; b=hem_critical(p0,T0,min(pMin,p0*0.999999))\n    return {'Gcrit':b['G'],'p_crit':b['p'],'T_crit':b['T'],'x_crit':b['x'],'rho_crit':b['rho'],'h_crit':b['h'],'mdot_equiv':Cd*A*b['G']}\n",requires:[],basis:{kind:'reproduce',note:'Standard-library port of the same compressed-liquid/HEM property equations, 241-point bracket scan and 48-iteration golden-section refinement used by the browser tool.'},selftest:{tolerance:1e-7,note:'Relative tolerance for scalar outputs.'}};},
