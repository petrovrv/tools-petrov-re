  "title": {"en":"Planar truss sketcher","uk":"Ескіз плоскої ферми","de":"Skizzenwerkzeug für ebene Fachwerke","nl":"Schetsgereedschap voor vlakke vakwerken","fr":"Esquisse de treillis plan","es":"Bocetador de celosías planas","pl":"Szkicownik kratownic płaskich"},
  "summary": {"en":"Place joints on a grid, connect them with members, set pin and roller supports and joint loads, and read the axial force in every member from joint equilibrium.","uk":"Розставте вузли на сітці, з'єднайте їх стрижнями, задайте шарнірні та каткові опори й вузлові навантаження і отримайте поздовжню силу в кожному стрижні з рівноваги вузлів.","de":"Knoten auf einem Raster setzen, mit Stäben verbinden, Fest- und Rollenlager sowie Knotenlasten festlegen und die Normalkraft jedes Stabes aus dem Knotengleichgewicht ablesen.","nl":"Plaats knopen op een raster, verbind ze met staven, kies scharnier- en roloplegging en knooppuntbelastingen, en lees de staafkracht van elke staaf uit het knoopevenwicht.","fr":"Placez des nœuds sur une grille, reliez-les par des barres, définissez appuis articulés et à rouleau et charges nodales, puis lisez l'effort normal de chaque barre par l'équilibre des nœuds.","es":"Coloque nudos en una retícula, únalos con barras, defina apoyos fijos y móviles y cargas en los nudos, y lea el esfuerzo axil de cada barra a partir del equilibrio de nudos.","pl":"Rozstaw węzły na siatce, połącz je prętami, ustaw podpory stałe i przesuwne oraz obciążenia węzłowe, i odczytaj siłę osiową w każdym pręcie z równowagi węzłów."},
  "description": {"en":"A drawing surface for statically determinate planar pin-jointed trusses. Joints are placed and dragged on a snap grid, members connect them, supports and point loads live on the joints. The tool assembles the two equilibrium equations of every joint into one linear system — the method of joints, written out at once — and solves it for the member axial forces and the support reactions. It states the determinacy count m + r − 2n before it states any force, and refuses to invent one for a mechanism or for a statically indeterminate frame.","uk":"Робоче поле для статично визначуваних плоских шарнірних ферм. Вузли ставляться й перетягуються по сітці, стрижні їх з'єднують, опори та зосереджені навантаження належать вузлам. Інструмент збирає по два рівняння рівноваги кожного вузла в одну лінійну систему — метод вирізання вузлів, записаний одразу — і розв'язує її щодо поздовжніх сил і опорних реакцій. Спершу подається число m + r − 2n, і лише потім — сили; для механізму чи статично невизначуваної системи сили не подаються.","de":"Eine Zeichenfläche für statisch bestimmte ebene Fachwerke mit gelenkigen Knoten. Knoten werden auf einem Fangraster gesetzt und gezogen, Stäbe verbinden sie, Lager und Einzellasten gehören zu den Knoten. Das Werkzeug fügt die zwei Gleichgewichtsbedingungen jedes Knotens zu einem linearen System zusammen — das Knotenpunktverfahren, auf einmal aufgeschrieben — und löst es nach den Stabkräften und Auflagerreaktionen. Der Abzählwert m + r − 2n steht vor jeder Kraft; für eine kinematische Kette oder ein statisch unbestimmtes System wird keine Kraft erfunden.","nl":"Een tekenvlak voor statisch bepaalde vlakke vakwerken met scharnierende knopen. Knopen worden op een vangraster geplaatst en versleept, staven verbinden ze, opleggingen en puntlasten horen bij de knopen. De tool voegt de twee evenwichtsvergelijkingen van elke knoop samen tot één lineair stelsel — de knopenmethode, in één keer opgeschreven — en lost dat op naar staafkrachten en oplegreacties. Het telgetal m + r − 2n komt vóór elke kracht; voor een mechanisme of een statisch onbepaald vakwerk wordt geen kracht verzonnen.","fr":"Une surface de dessin pour treillis plans isostatiques à nœuds articulés. Les nœuds se placent et se déplacent sur une grille magnétique, les barres les relient, appuis et charges ponctuelles appartiennent aux nœuds. L'outil assemble les deux équations d'équilibre de chaque nœud en un seul système linéaire — la méthode des nœuds, écrite d'un coup — et le résout pour les efforts normaux et les réactions d'appui. Le compte m + r − 2n précède tout effort ; pour un mécanisme ou un treillis hyperstatique, aucun effort n'est inventé.","es":"Una superficie de dibujo para celosías planas isostáticas de nudos articulados. Los nudos se colocan y se arrastran sobre una retícula magnética, las barras los unen, apoyos y cargas puntuales pertenecen a los nudos. La herramienta reúne las dos ecuaciones de equilibrio de cada nudo en un único sistema lineal — el método de los nudos, escrito de una vez — y lo resuelve para los esfuerzos axiles y las reacciones. El recuento m + r − 2n precede a cualquier esfuerzo; para un mecanismo o una celosía hiperestática no se inventa ningún esfuerzo.","pl":"Płótno do rysowania statycznie wyznaczalnych płaskich kratownic przegubowych. Węzły są stawiane i przeciągane po siatce przyciągania, pręty je łączą, podpory i obciążenia skupione należą do węzłów. Narzędzie zestawia dwa równania równowagi każdego węzła w jeden układ liniowy — metodę równowagi węzłów, zapisaną od razu w całości — i rozwiązuje go względem sił osiowych w prętach oraz reakcji podporowych. Podaje wartość wyznaczalności m + r − 2n, zanim poda jakąkolwiek siłę, i odmawia wymyślenia jej dla mechanizmu lub statycznie niewyznaczalnego układu."},

  "limitations": {"en":"Ideal pin-jointed planar truss: straight weightless members, loads only at joints, small displacements, linear statics. Only statically determinate frames are solved — a mechanism or a statically indeterminate frame is reported as such and no force is given. No member self-weight, no buckling check, no member sizing, no material, no stiffness, no second-order effects, no out-of-plane behaviour, no load combinations and no code check of any kind.","uk":"Ідеальна плоска шарнірна ферма: прямі невагомі стрижні, навантаження лише у вузлах, малі переміщення, лінійна статика. Розв'язуються лише статично визначувані системи — механізм або статично невизначувана система позначається як така, і сили не подаються. Без власної ваги стрижнів, без перевірки стійкості, без підбору перерізів, без матеріалу, без жорсткості, без ефектів другого порядку, без роботи з площини, без сполучень навантажень і без будь-якої нормативної перевірки.","de":"Ideales ebenes Fachwerk mit Gelenkknoten: gerade, gewichtslose Stäbe, Lasten nur in den Knoten, kleine Verschiebungen, lineare Statik. Gelöst werden nur statisch bestimmte Systeme — eine kinematische Kette oder ein statisch unbestimmtes System wird als solches gemeldet, ohne Kraftangabe. Kein Stabeigengewicht, kein Stabilitätsnachweis, keine Querschnittswahl, kein Werkstoff, keine Steifigkeit, keine Theorie II. Ordnung, kein Verhalten aus der Ebene, keine Lastkombinationen und kein Normnachweis.","nl":"Ideaal vlak vakwerk met scharnierende knopen: rechte gewichtloze staven, belastingen alleen in de knopen, kleine verplaatsingen, lineaire statica. Alleen statisch bepaalde vakwerken worden opgelost — een mechanisme of een statisch onbepaald vakwerk wordt als zodanig gemeld en er wordt geen kracht gegeven. Geen eigen gewicht van staven, geen knikcontrole, geen profielkeuze, geen materiaal, geen stijfheid, geen tweede-orde-effecten, geen gedrag uit het vlak, geen belastingcombinaties en geen enkele normtoets.","fr":"Treillis plan idéal à nœuds articulés : barres droites sans poids, charges uniquement aux nœuds, petits déplacements, statique linéaire. Seuls les treillis isostatiques sont résolus — un mécanisme ou un treillis hyperstatique est signalé comme tel et aucun effort n'est donné. Pas de poids propre des barres, pas de vérification au flambement, pas de dimensionnement, pas de matériau, pas de rigidité, pas d'effets du second ordre, pas de comportement hors plan, pas de combinaisons de charges et aucune vérification réglementaire.","es":"Celosía plana ideal de nudos articulados: barras rectas sin peso, cargas solo en los nudos, pequeños desplazamientos, estática lineal. Solo se resuelven celosías isostáticas — un mecanismo o una celosía hiperestática se señala como tal y no se da ningún esfuerzo. Sin peso propio de las barras, sin comprobación de pandeo, sin dimensionamiento, sin material, sin rigidez, sin efectos de segundo orden, sin comportamiento fuera del plano, sin combinaciones de carga y sin ninguna comprobación normativa.","pl":"Idealna płaska kratownica przegubowa: proste, nieważkie pręty, obciążenia wyłącznie w węzłach, małe przemieszczenia, statyka liniowa. Rozwiązywane są wyłącznie układy statycznie wyznaczalne — mechanizm lub układ statycznie niewyznaczalny jest zgłaszany jako taki i żadna siła nie jest podawana. Bez ciężaru własnego prętów, sprawdzenia wyboczenia, doboru przekrojów, materiału, sztywności, efektów drugiego rzędu, zachowania poza płaszczyzną, kombinacji obciążeń i jakiegokolwiek sprawdzenia zgodności z przepisami."},

  "validation": {"basis":{"en":"None. This is a new tool with no benchmark: no reference case has been run against it and validation.benchmarks is empty. The numbers rest on textbook linear statics — two equilibrium equations per pin joint, solved by Gaussian elimination with partial pivoting — and on nothing else. Reproduce a hand-worked truss before you trust a number from it.","uk":"Немає. Це новий інструмент без бенчмарку: жодного еталонного випадку не проганяли, validation.benchmarks порожній. Числа спираються лише на підручникову лінійну статику — два рівняння рівноваги на шарнірний вузол, розв'язані методом Гаусса з частковим вибором головного елемента. Перевірте на фермі, порахованій вручну, перш ніж довіряти числу.","de":"Keine. Dies ist ein neues Werkzeug ohne Benchmark: es wurde kein Referenzfall gerechnet, validation.benchmarks ist leer. Die Zahlen beruhen allein auf linearer Statik aus dem Lehrbuch — zwei Gleichgewichtsbedingungen je Gelenkknoten, gelöst mit Gauß-Elimination und Spaltenpivotisierung. Rechnen Sie ein von Hand gelöstes Fachwerk nach, bevor Sie einer Zahl trauen.","nl":"Geen. Dit is een nieuwe tool zonder benchmark: er is geen referentiegeval doorgerekend en validation.benchmarks is leeg. De getallen berusten alleen op lineaire statica uit het leerboek — twee evenwichtsvergelijkingen per scharnierknoop, opgelost met Gauss-eliminatie en partiële pivotering. Reken eerst een met de hand opgelost vakwerk na voordat u een getal vertrouwt.","fr":"Aucune. Cet outil est nouveau et sans référence de comparaison : aucun cas de référence n'a été calculé et validation.benchmarks est vide. Les nombres reposent uniquement sur la statique linéaire des manuels — deux équations d'équilibre par nœud articulé, résolues par élimination de Gauss avec pivot partiel. Refaites un treillis calculé à la main avant de faire confiance à un nombre.","es":"Ninguna. Es una herramienta nueva sin banco de pruebas: no se ha calculado ningún caso de referencia y validation.benchmarks está vacío. Los números descansan solo en la estática lineal de manual — dos ecuaciones de equilibrio por nudo articulado, resueltas por eliminación de Gauss con pivoteo parcial. Reproduzca una celosía resuelta a mano antes de confiar en un número.","pl":"Brak. To nowe narzędzie bez benchmarku: nie przeprowadzono wobec niego żadnego przypadku odniesienia, a validation.benchmarks jest puste. Liczby opierają się wyłącznie na podręcznikowej statyce liniowej — dwóch równaniach równowagi na każdy węzeł przegubowy, rozwiązywanych eliminacją Gaussa z częściowym wyborem elementu podstawowego — i na niczym więcej. Zanim zaufasz podanej liczbie, odtwórz kratownicę obliczoną ręcznie."},"independent_validation":false,"benchmarks":[]},

<script>
/* trussframe — a planar truss sketcher on tools.petrov.re/ui/v1, level 3.
 *
 *   1. the model      pure. solveTruss(state) knows nothing about a screen.
 *   2. the interface  one DiagramUI.app({…}) declaration, layout 'studio'.
 *   3. the record     Diagram.init({state, record, python, handoff}).
 *
 * No <style>, no CSS, no colour or spacing literal, no h1, no export button.
 * The file touches the document in four places and every one of them is the
 * tool's OWN DRAWING or the honest-degradation path, never framework furniture:
 *   - document.title, only when diagram-ui.js is absent;
 *   - one DOMContentLoaded listener, to boot;
 *   - getComputedStyle, to read the theme tokens the canvas draws with;
 *   - the stage canvas: tabIndex, aria-label, touch-action, cursor,
 *     getBoundingClientRect and six pointer/key listeners bound with
 *     DiagramUI.on — the framework has no interaction primitive for a drawing
 *     that IS the workspace (see the notes shipped with this file), and
 *     one canvas-to-PNG call, so the drawing reaches the PDF report.
 * It constructs no element, sets no markup and appends nothing: grep this file
 * for the three element-building calls and the count is zero.
 */
(function () {
  'use strict';

  /* ============================================================= 1. the model
     Everything is SI: metres for geometry, newtons for force. Tension is
     positive. The state is the permalink, so its shape is a promise. */

  /* support codes: 'free' | 'pin' (2 reactions) | 'rx' | 'ry' (1 reaction) */
  function reactionsOf(nodes) {
    var out = [];
    for (var j = 0; j < nodes.length; j++) {
      var s = nodes[j].s || 'free';
      if (s === 'pin') { out.push({ node: j, dir: 0 }); out.push({ node: j, dir: 1 }); }
      else if (s === 'rx') { out.push({ node: j, dir: 0 }); }
      else if (s === 'ry') { out.push({ node: j, dir: 1 }); }
    }
    return out;
  }

  /* Gaussian elimination with partial pivoting. Returns null on a singular
     matrix — which for a truss means a geometrically unstable frame, not an
     arithmetic accident. The Python export runs this same loop, in this same
     order, so the two agree to the last bit. */
  function gauss(A, b) {
    var n = b.length, i, c, r, k;
    var M = [];
    for (i = 0; i < n; i++) { M.push(A[i].slice()); M[i].push(b[i]); }
    for (c = 0; c < n; c++) {
      var p = c;
      for (r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      if (Math.abs(M[p][c]) < 1e-9) return null;
      if (p !== c) { var tmp = M[c]; M[c] = M[p]; M[p] = tmp; }
      var pv = M[c][c];
      for (r = c + 1; r < n; r++) {
        var f = M[r][c] / pv;
        if (f === 0) continue;
        for (k = c; k <= n; k++) M[r][k] -= f * M[c][k];
      }
    }
    var x = [];
    for (i = 0; i < n; i++) x.push(0);
    for (c = n - 1; c >= 0; c--) {
      var s = M[c][n];
      for (k = c + 1; k < n; k++) s -= M[c][k] * x[k];
      x[c] = s / M[c][c];
    }
    return x;
  }

  /* pure: no document, no globals written, every displayed quantity returned */
  function solveTruss(st) {
    var nodes = st.nodes || [], mem = st.members || [];
    var n = nodes.length, m = mem.length, i, j, k;

    var len = [], ux = [], uy = [], geomBad = 0, total = 0;
    for (k = 0; k < m; k++) {
      var a = mem[k].a, b = mem[k].b, l = 0, dx = 0, dy = 0;
      if (a >= 0 && a < n && b >= 0 && b < n && a !== b) {
        dx = nodes[b].x - nodes[a].x;
        dy = nodes[b].y - nodes[a].y;
        l = Math.sqrt(dx * dx + dy * dy);
      }
      if (!(l > 1e-9)) geomBad += 1;
      len.push(l); total += l;
      ux.push(l > 1e-9 ? dx / l : 0);
      uy.push(l > 1e-9 ? dy / l : 0);
    }

    var reac = reactionsOf(nodes);
    var r = reac.length, unknowns = m + r, eqs = 2 * n;
    var balance = unknowns - eqs;

    var lone = 0;
    var deg = [];
    for (j = 0; j < n; j++) deg.push(0);
    for (k = 0; k < m; k++) {
      if (mem[k].a >= 0 && mem[k].a < n) deg[mem[k].a] += 1;
      if (mem[k].b >= 0 && mem[k].b < n) deg[mem[k].b] += 1;
    }
    for (j = 0; j < n; j++) if (deg[j] === 0) lone += 1;

    var out = {
      n: n, m: m, r: r, balance: balance, geomBad: geomBad, lone: lone,
      len: len, ux: ux, uy: uy, reac: reac, total: total,
      force: null, react: null, solved: false, why: 'empty',
      maxT: null, maxC: null, resid: null, zero: null, loadSum: null
    };

    var lx = 0, ly = 0;
    for (j = 0; j < n; j++) { lx += nodes[j].fx || 0; ly += nodes[j].fy || 0; }
    out.loadSum = Math.sqrt(lx * lx + ly * ly);

    if (n === 0 || m === 0) { out.why = 'empty'; return out; }
    if (geomBad) { out.why = 'geometry'; return out; }
    if (balance < 0) { out.why = 'mechanism'; return out; }
    if (balance > 0) { out.why = 'indeterminate'; return out; }

    var A = [], rhs = [];
    for (i = 0; i < eqs; i++) {
      var row = [];
      for (k = 0; k < unknowns; k++) row.push(0);
      A.push(row); rhs.push(0);
    }
    for (k = 0; k < m; k++) {
      var ja = mem[k].a, jb = mem[k].b;
      A[2 * ja][k] += ux[k];      A[2 * ja + 1][k] += uy[k];
      A[2 * jb][k] += -ux[k];     A[2 * jb + 1][k] += -uy[k];
    }
    for (i = 0; i < r; i++) A[2 * reac[i].node + reac[i].dir][m + i] += 1;
    for (j = 0; j < n; j++) {
      rhs[2 * j] = -(nodes[j].fx || 0);
      rhs[2 * j + 1] = -(nodes[j].fy || 0);
    }

    var x = gauss(A, rhs);
    if (!x) { out.why = 'singular'; return out; }

    var force = x.slice(0, m), react = x.slice(m);
    var resid = 0;
    for (i = 0; i < eqs; i++) {
      var acc = 0;
      for (k = 0; k < unknowns; k++) acc += A[i][k] * x[k];
      var e = Math.abs(acc - rhs[i]);
      if (e > resid) resid = e;
    }
    var scale = Math.max(1, out.loadSum);
    var maxT = 0, maxC = 0, zero = 0;
    for (k = 0; k < m; k++) {
      if (force[k] > maxT) maxT = force[k];
      if (-force[k] > maxC) maxC = -force[k];
      if (Math.abs(force[k]) < 1e-6 * scale) zero += 1;
    }
    out.force = force; out.react = react; out.solved = true; out.why = 'ok';
    out.maxT = maxT; out.maxC = maxC; out.resid = resid; out.zero = zero;
    return out;
  }

  var DEFAULTS = {
    /* a four-panel Warren truss, 12 m span, 2 m deep, 10 kN at each top joint */
    nodes: [
      { x: 0,    y: 0, s: 'pin',  fx: 0, fy: 0 },
      { x: 3,    y: 0, s: 'free', fx: 0, fy: 0 },
      { x: 6,    y: 0, s: 'free', fx: 0, fy: 0 },
      { x: 9,    y: 0, s: 'free', fx: 0, fy: 0 },
      { x: 12,   y: 0, s: 'ry',   fx: 0, fy: 0 },
      { x: 1.5,  y: 2, s: 'free', fx: 0, fy: -10000 },
      { x: 4.5,  y: 2, s: 'free', fx: 0, fy: -10000 },
      { x: 7.5,  y: 2, s: 'free', fx: 0, fy: -10000 },
      { x: 10.5, y: 2, s: 'free', fx: 0, fy: -10000 }
    ],
    members: [
      { a: 0, b: 1 }, { a: 1, b: 2 }, { a: 2, b: 3 }, { a: 3, b: 4 },
      { a: 5, b: 6 }, { a: 6, b: 7 }, { a: 7, b: 8 },
      { a: 0, b: 5 }, { a: 5, b: 1 }, { a: 1, b: 6 }, { a: 6, b: 2 },
      { a: 2, b: 7 }, { a: 7, b: 3 }, { a: 3, b: 8 }, { a: 8, b: 4 }
    ],
    snap: 0.5
  };

  var state = JSON.parse(JSON.stringify(DEFAULTS));
  var last = null;

  /* ========================================================= 2. the interface */

  function T(en, uk, de, nl, fr, es, pl) { return { en: en, uk: uk, de: de, nl: nl, fr: fr, es: es, pl: pl }; }

  var ui = null, stage = null;
  function L(o) { return DiagramUI.pick(o, ui ? ui.lang : DiagramUI.lang()); }
  function F(v, p) { return DiagramUI.fmt(v, { precision: p }); }

  /* view state: the cursor, not the model. Deliberately NOT in `state`, so the
     permalink carries the truss and not where somebody last clicked. */
  var view = { mode: 'select', sel: null, pending: null, win: null, drag: null,
               grid: true, labels: true, map: null, size: null, cv: null };

  var SUPPORTS = {
    free: T('Free', 'Вільний', 'Frei', 'Vrij', 'Libre', 'Libre','Swobodny'),
    pin:  T('Pin', 'Шарнір', 'Festlager', 'Scharnier', 'Articulation', 'Apoyo fijo','Podpora stała'),
    ry:   T('Roller, vertical reaction', 'Каток, вертикальна реакція', 'Rollenlager, vertikale Reaktion',
            'Roloplegging, verticale reactie', 'Appui à rouleau, réaction verticale', 'Apoyo móvil, reacción vertical','Podpora przesuwna, reakcja pionowa'),

      'Un mecanismo: hay menos incógnitas que ecuaciones de equilibrio, este sistema se mueve. No puede darse ningún esfuerzo.','Mechanizm: niewiadomych jest mniej niż równań równowagi, więc układ jest geometrycznie zmienny. Nie można podać żadnej siły.');
    if (res.why === 'indeterminate') return T(
      'Statically indeterminate: there are more unknowns than equilibrium equations. Statics alone cannot give the forces — that needs member stiffness, which this tool does not model.',
      'Статично невизначувана система: невідомих більше, ніж рівнянь рівноваги. Самої статики недостатньо — потрібна жорсткість стрижнів, якої цей інструмент не моделює.',
      'Statisch unbestimmt: es gibt mehr Unbekannte als Gleichgewichtsbedingungen. Die Statik allein liefert die Kräfte nicht — dafür braucht es Stabsteifigkeiten, die dieses Werkzeug nicht abbildet.',
      'Statisch onbepaald: er zijn meer onbekenden dan evenwichtsvergelijkingen. Statica alleen geeft de krachten niet — daarvoor is staafstijfheid nodig, die deze tool niet modelleert.',
      'Hyperstatique : il y a plus d’inconnues que d’équations d’équilibre. La statique seule ne donne pas les efforts — il faudrait la rigidité des barres, que cet outil ne modélise pas.',
      'Hiperestático: hay más incógnitas que ecuaciones de equilibrio. La estática sola no da los esfuerzos — haría falta la rigidez de las barras, que esta herramienta no modela.','Układ statycznie niewyznaczalny: niewiadomych jest więcej niż równań równowagi. Sama statyka nie wyznacza sił — potrzebna jest sztywność prętów, której to narzędzie nie modeluje.');
    if (res.why === 'singular') return T(
      'The count works out but the frame is geometrically unstable: the equilibrium equations are not independent. Check for collinear members at a support or an unbraced panel.',
      'Підрахунок сходиться, але система геометрично змінна: рівняння рівноваги лінійно залежні. Перевірте колінеарні стрижні біля опори або незакріплену панель.',
      'Die Abzählung geht auf, aber das System ist geometrisch instabil: die Gleichgewichtsbedingungen sind nicht unabhängig. Prüfen Sie kollineare Stäbe am Lager oder ein unausgesteiftes Feld.',
      'Het telgetal klopt maar het vakwerk is geometrisch onstabiel: de evenwichtsvergelijkingen zijn niet onafhankelijk. Controleer collineaire staven bij een oplegging of een onverstijfd veld.',
      'Le compte est bon mais le système est géométriquement instable : les équations d’équilibre ne sont pas indépendantes. Vérifiez des barres colinéaires sur un appui ou un panneau non contreventé.',
      'El recuento cuadra pero el sistema es geométricamente inestable: las ecuaciones de equilibrio no son independientes. Revise barras colineales en un apoyo o un panel sin arriostrar.','Bilans się zgadza, ale układ jest geometrycznie niestateczny: równania równowagi nie są niezależne. Sprawdź współliniowe pręty przy podporze albo nieusztywnione pole.');
    return T('Statically determinate and solved by joint equilibrium.',
             'Статично визначувана; розв’язано з рівноваги вузлів.',
             'Statisch bestimmt und aus dem Knotengleichgewicht gelöst.',
             'Statisch bepaald en opgelost uit het knoopevenwicht.',
             'Isostatique, résolu par l’équilibre des nœuds.',
             'Isostático, resuelto por el equilibrio de nudos.','Statycznie wyznaczalny i rozwiązany z równowagi węzłów.');
  }

  function buildResults(res) {
    var tiles = [], tables = [], notes = [], k;
    var okTone = res.solved ? 'ok' : (res.why === 'indeterminate' ? 'warn' : 'bad');

    tiles.push({ label: T('Largest tension', 'Найбільший розтяг', 'Größte Zugkraft', 'Grootste trekkracht', 'Traction maximale', 'Tracción máxima','Największa siła rozciągająca'),
                 value: res.solved ? res.maxT : null, hint: 'N', precision: 0, tone: res.solved ? 'ok' : null, learn: 'sign' });
    tiles.push({ label: T('Largest compression', 'Найбільший стиск', 'Größte Druckkraft', 'Grootste drukkracht', 'Compression maximale', 'Compresión máxima','Największa siła ściskająca'),
                 value: res.solved ? res.maxC : null, hint: 'N', precision: 0, tone: res.solved ? 'warn' : null, learn: 'sign' });
    tiles.push({ label: T('Total member length', 'Сумарна довжина стрижнів', 'Gesamtstablänge', 'Totale staaflengte', 'Longueur totale des barres', 'Longitud total de barras','Łączna długość prętów'),
                 value: res.total, hint: 'm', precision: 3 });
    tiles.push({ label: T('Determinacy, m + r − 2n', 'Визначуваність, m + r − 2n', 'Abzählkriterium, m + r − 2n', 'Telgetal, m + r − 2n', 'Compte, m + r − 2n', 'Recuento, m + r − 2n','Wyznaczalność, m + r − 2n'),
                 value: res.balance, precision: 0, tone: okTone, learn: 'determinacy', headline: false });
    var sm = selMember();
    if (sm >= 0) {
      tiles.push({ label: T('Selected member', 'Вибраний стрижень', 'Gewählter Stab', 'Gekozen staaf', 'Barre sélectionnée', 'Barra seleccionada','Wybrany pręt'),
                   value: res.solved ? res.force[sm] : null, hint: 'N', precision: 0, headline: false, learn: 'sign' });
    }

    if (res.m > 0) {
      var rows = [];
      for (k = 0; k < res.m; k++) {
        var mm = state.members[k];
        var f = res.solved ? res.force[k] : null;
        var stateWord = f == null ? '—'
          : (Math.abs(f) < 1e-6 * Math.max(1, res.loadSum)
              ? T('zero', 'нуль', 'null', 'nul', 'nul', 'cero','zero')
              : (f > 0 ? T('tension', 'розтяг', 'Zug', 'trek', 'traction', 'tracción','rozciąganie')
                       : T('compression', 'стиск', 'Druck', 'druk', 'compression', 'compresión','ściskanie')));
        rows.push({
          chosen: k === sm,
          cells: [String(k + 1), String(mm.a + 1) + ' – ' + String(mm.b + 1),
                  { value: res.len[k], precision: 3 },
                  { value: f, precision: 0, tone: f == null ? null : (f > 0 ? 'ok' : (f < 0 ? 'warn' : null)) },
                  { text: stateWord }]
        });
      }
      tables.push({
        title: T('Axial force in every member', 'Поздовжня сила в кожному стрижні', 'Normalkraft in jedem Stab',
                 'Staafkracht in elke staaf', 'Effort normal dans chaque barre', 'Esfuerzo axil en cada barra','Siła osiowa w każdym pręcie'),
        sticky: true, maxHeight: 320,
        head: [{ label: '#', num: true },
               T('Joints', 'Вузли', 'Knoten', 'Knopen', 'Nœuds', 'Nudos','Węzły'),
               { label: T('Length (m)', 'Довжина (м)', 'Länge (m)', 'Lengte (m)', 'Longueur (m)', 'Longitud (m)','Długość (m)'), num: true },
               { label: T('Axial force (N)', 'Поздовжня сила (Н)', 'Normalkraft (N)', 'Staafkracht (N)', 'Effort normal (N)', 'Esfuerzo axil (N)','Siła osiowa (N)'), num: true },
               T('State', 'Стан', 'Zustand', 'Toestand', 'État', 'Estado','Stan')],
        rows: rows
      });
    }

    if (res.r > 0) {
      var rr = [], seen = {};
      for (k = 0; k < res.reac.length; k++) {
        var j = res.reac[k].node;
        if (seen[j] != null) continue;
        seen[j] = 1;
        var rx = null, ry = null;
        for (var q = 0; q < res.reac.length; q++) {
          if (res.reac[q].node !== j) continue;
          if (res.reac[q].dir === 0) rx = res.solved ? res.react[q] : null;
          else ry = res.solved ? res.react[q] : null;
        }
        rr.push({ chosen: selNode() === j,
                  cells: [String(j + 1), L(SUPPORTS[state.nodes[j].s] || SUPPORTS.free),
                          rx == null ? '—' : { value: rx, precision: 0 },
                          ry == null ? '—' : { value: ry, precision: 0 }] });
      }
      tables.push({
        title: T('Support reactions', 'Опорні реакції', 'Auflagerreaktionen', 'Oplegreacties', 'Réactions d’appui', 'Reacciones en los apoyos','Reakcje podporowe'),
        head: [{ label: T('Joint', 'Вузол', 'Knoten', 'Knoop', 'Nœud', 'Nudo','Węzeł'), num: true },
               T('Support', 'Опора', 'Lager', 'Oplegging', 'Appui', 'Apoyo','Podpora'),
               { label: T('Horizontal (N)', 'Горизонтальна (Н)', 'Horizontal (N)', 'Horizontaal (N)', 'Horizontale (N)', 'Horizontal (N)','Pozioma (N)'), num: true },
               { label: T('Vertical (N)', 'Вертикальна (Н)', 'Vertikal (N)', 'Verticaal (N)', 'Verticale (N)', 'Vertical (N)','Pionowa (N)'), num: true }],
        rows: rr
      });
    }

    notes.push(T(
      'Joints ' + res.n + ', members ' + res.m + ', reaction components ' + res.r + '. The count m + r − 2n is ' + res.balance + '.',
      'Вузлів ' + res.n + ', стрижнів ' + res.m + ', складових реакцій ' + res.r + '. Число m + r − 2n дорівнює ' + res.balance + '.',
      'Knoten ' + res.n + ', Stäbe ' + res.m + ', Auflagerkomponenten ' + res.r + '. Der Abzählwert m + r − 2n ist ' + res.balance + '.',
      'Knopen ' + res.n + ', staven ' + res.m + ', reactiecomponenten ' + res.r + '. Het telgetal m + r − 2n is ' + res.balance + '.',
      'Nœuds ' + res.n + ', barres ' + res.m + ', composantes de réaction ' + res.r + '. Le compte m + r − 2n vaut ' + res.balance + '.',
      'Nudos ' + res.n + ', barras ' + res.m + ', componentes de reacción ' + res.r + '. El recuento m + r − 2n es ' + res.balance + '.','Węzłów ' + res.n + ', prętów ' + res.m + ', składowych reakcji ' + res.r + '. Wartość m + r − 2n wynosi ' + res.balance + '.'));
    if (res.solved && res.zero > 0) {
      notes.push(T(
        res.zero + ' member(s) carry no force in this load case. A zero-force member is not useless: it braces the frame and it carries load in another case.',
        res.zero + ' стрижнів не несуть зусилля в цьому завантаженні. Нульовий стрижень не зайвий: він розкріплює систему й працює в іншому завантаженні.',
        res.zero + ' Stäbe sind in diesem Lastfall kraftfrei. Ein Nullstab ist nicht überflüssig: er stabilisiert das System und trägt in einem anderen Lastfall.',
        res.zero + ' staven zijn in dit belastinggeval krachtvrij. Een nulstaaf is niet nutteloos: hij verstijft het vakwerk en draagt in een ander geval.',
        res.zero + ' barre(s) ne reprennent aucun effort dans ce cas de charge. Une barre à effort nul n’est pas inutile : elle contrevente le système et travaille dans un autre cas.',
        res.zero + ' barra(s) no reciben esfuerzo en este caso de carga. Una barra de fuerza nula no es inútil: arriostra el sistema y trabaja en otro caso.',res.zero + ' prętów nie przenosi siły w tym przypadku obciążenia. Pręt zerowy nie jest bezużyteczny: usztywnia układ i przenosi siłę w innym przypadku.'));
    }
    if (res.solved) {
      notes.push(T(
        'Largest equilibrium residual over all joints: ' + F(res.resid, 6) + ' N. It is a check on the arithmetic, not on the model.',
        'Найбільша нев’язка рівноваги по всіх вузлах: ' + F(res.resid, 6) + ' Н. Це перевірка арифметики, а не моделі.',
        'Größter Gleichgewichtsrest über alle Knoten: ' + F(res.resid, 6) + ' N. Das prüft die Arithmetik, nicht das Modell.',
        'Grootste evenwichtsrest over alle knopen: ' + F(res.resid, 6) + ' N. Dit toetst het rekenwerk, niet het model.',
        'Plus grand résidu d’équilibre sur tous les nœuds : ' + F(res.resid, 6) + ' N. Cela contrôle le calcul, pas le modèle.',
        'Mayor residuo de equilibrio en todos los nudos: ' + F(res.resid, 6) + ' N. Comprueba la aritmética, no el modelo.','Największa niezgodność równowagi ze wszystkich węzłów: ' + F(res.resid, 6) + ' N. To sprawdzenie arytmetyki, nie modelu.'));
    }
    if (res.lone > 0) {
      notes.push(T(
        res.lone + ' joint(s) are connected to no member at all.',
        res.lone + ' вузлів не з’єднані з жодним стрижнем.',
        res.lone + ' Knoten sind an keinen Stab angeschlossen.',
        res.lone + ' knopen zijn met geen enkele staaf verbonden.',
        res.lone + ' nœud(s) ne sont reliés à aucune barre.',
        res.lone + ' nudo(s) no están unidos a ninguna barra.',res.lone + ' węzłów nie jest połączonych z żadnym prętem.'));
    }

    return {
      verdict: { tone: okTone, text: whyText(res) },
      tiles: tiles, tables: tables, notes: notes
    };
  }

  /* ------------------------------------------------------------- boot
     The hard gate stops the INTERFACE, never the data layer: `Diagram.init`
     runs on both paths, so the shared bar, the permalink, the status badge and
     the limitations modal survive the loss of diagram-ui.js — and so does
     window.__diagramReady, which nothing else sets. AUTHORING.md §13's skeleton
     returns out of boot() before Diagram.init when the framework is missing;
     that shape fails check.js run with diagram-ui.js blocked. */
  function boot() {
    var haveUI = !!(window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1');
    if (haveUI) buildInterface();
    else document.title = 'diagram-ui.js v1 is required';
    initData();
  }

      history: {

      notices: [{

                'Лише рівновага, для ідеальної шарнірної ферми з навантаженнями у вузлах. Немає матеріалу, перерізу, жорсткості, перевірки стійкості та нормативної перевірки — це навчальний результат, а не проєкт.',

      learn: {

          body: T('Draw a truss: place joints on the grid, connect them with members, put a pin and a roller under it and hang loads on the joints. The tool writes two equilibrium equations for every joint and solves them for the axial force in each member. Pick the Joint tool and click on the drawing to start.',

                     'Knopenmethode', 'Méthode des nœuds', 'Método de los nudos','Metoda równowagi węzłów'),
            body: T('Every pin joint is in equilibrium, so the horizontal and the vertical components of everything meeting there sum to zero. That is two equations per joint. With n joints there are 2n equations and m + r unknowns — the member forces and the reaction components. This tool assembles all of them at once and solves the system, which is the same arithmetic as walking joint by joint, only without needing a joint with two unknowns to start from.',
                    'Кожен шарнірний вузол перебуває в рівновазі, тож горизонтальні й вертикальні складові всього, що в ньому сходиться, дають нуль. Це два рівняння на вузол. Для n вузлів маємо 2n рівнянь і m + r невідомих — зусилля в стрижнях і складові реакцій. Інструмент збирає їх усі одразу й розв’язує систему; це та сама арифметика, що й обхід вузол за вузлом, лише без потреби починати з вузла з двома невідомими.',
                    'Jeder Gelenkknoten ist im Gleichgewicht, also summieren sich die waagerechten und die senkrechten Anteile aller dort zusammenlaufenden Kräfte zu null. Das sind zwei Gleichungen je Knoten. Bei n Knoten stehen 2n Gleichungen m + r Unbekannten gegenüber — den Stabkräften und den Auflagerkomponenten. Das Werkzeug stellt alle auf einmal auf und löst das System; dieselbe Rechnung wie Knoten für Knoten, nur ohne einen Startknoten mit zwei Unbekannten zu brauchen.',
                    'Elke scharnierknoop is in evenwicht, dus de horizontale en de verticale componenten van alles wat daar samenkomt sommeren tot nul. Dat zijn twee vergelijkingen per knoop. Bij n knopen staan 2n vergelijkingen tegenover m + r onbekenden — de staafkrachten en de reactiecomponenten. De tool stelt ze allemaal tegelijk op en lost het stelsel op; dezelfde rekensom als knoop voor knoop, maar zonder een startknoop met twee onbekenden nodig te hebben.',
                    'Chaque nœud articulé est en équilibre : les composantes horizontales et verticales de tout ce qui s’y rejoint s’annulent. Cela fait deux équations par nœud. Avec n nœuds, 2n équations font face à m + r inconnues — les efforts des barres et les composantes de réaction. L’outil les assemble d’un coup et résout le système ; c’est le même calcul que de progresser nœud par nœud, sans avoir besoin d’un nœud de départ à deux inconnues.',
                    'Cada nudo articulado está en equilibrio, de modo que las componentes horizontal y vertical de todo lo que allí concurre suman cero. Son dos ecuaciones por nudo. Con n nudos hay 2n ecuaciones frente a m + r incógnitas — los esfuerzos de las barras y las componentes de reacción. La herramienta las reúne todas a la vez y resuelve el sistema; la misma aritmética que ir nudo a nudo, sin necesitar un nudo inicial con dos incógnitas.','Każdy węzeł przegubowy jest w równowadze, więc pozioma i pionowa składowa wszystkiego, co się w nim zbiega, sumuje się do zera. To dwa równania na węzeł. Przy n węzłach mamy 2n równań i m + r niewiadomych — siły w prętach i składowe reakcji. To narzędzie zestawia je wszystkie naraz i rozwiązuje układ, co jest tą samą arytmetyką co przechodzenie węzeł po węźle, tylko bez potrzeby węzła z dwiema niewiadomymi na start.')
          },
          determinacy: {
            title: T('Statical determinacy', 'Статична визначуваність', 'Statische Bestimmtheit',
                     'Statische bepaaldheid', 'Isostaticité', 'Isostaticidad','Wyznaczalność statyczna'),
            body: T('Compare m + r with 2n. Less, and the frame is a mechanism: it moves and no set of forces holds it. More, and it is statically indeterminate: equilibrium alone does not pick one answer out of the many that satisfy it, and you need stiffness. Equal, and the frame is statically determinate — but the count is necessary, not sufficient: a frame can count correctly and still be geometrically unstable, which this tool reports separately.',
                    'Порівняйте m + r із 2n. Менше — система механізм: вона рухається, і жоден набір зусиль її не втримає. Більше — система статично невизначувана: сама рівновага не обирає один розв’язок із багатьох, потрібна жорсткість. Рівність — система статично визначувана; але підрахунок є необхідною, а не достатньою умовою: система може сходитися за числом і залишатися геометрично змінною, про що інструмент повідомляє окремо.',
                    'Vergleichen Sie m + r mit 2n. Weniger, und das System ist eine kinematische Kette: es bewegt sich, keine Kräftegruppe hält es. Mehr, und es ist statisch unbestimmt: das Gleichgewicht allein wählt keine der vielen zulässigen Lösungen aus, dafür braucht es Steifigkeiten. Gleich, und das System ist statisch bestimmt — die Abzählung ist aber notwendig, nicht hinreichend: ein System kann aufgehen und trotzdem geometrisch instabil sein, was das Werkzeug getrennt meldet.',
                    'Vergelijk m + r met 2n. Minder, en het vakwerk is een mechanisme: het beweegt en geen krachtenspel houdt het tegen. Meer, en het is statisch onbepaald: evenwicht alleen kiest niet één antwoord uit de vele die eraan voldoen, daarvoor is stijfheid nodig. Gelijk, en het vakwerk is statisch bepaald — maar het telgetal is noodzakelijk, niet voldoende: een vakwerk kan kloppen en toch geometrisch onstabiel zijn, wat de tool apart meldt.',
                    'Comparez m + r à 2n. Moins, et le système est un mécanisme : il bouge et aucun jeu d’efforts ne le retient. Plus, et il est hyperstatique : l’équilibre seul ne choisit pas une solution parmi celles qui le satisfont, il faut la rigidité. Égal, et le système est isostatique — mais le compte est nécessaire, non suffisant : un système peut être juste au compte et rester géométriquement instable, ce que l’outil signale à part.',
                    'Compare m + r con 2n. Menos, y el sistema es un mecanismo: se mueve y ningún juego de esfuerzos lo sujeta. Más, y es hiperestático: el equilibrio solo no elige una respuesta entre las muchas que lo satisfacen, hace falta la rigidez. Igual, y el sistema es isostático — pero el recuento es necesario, no suficiente: un sistema puede cuadrar y seguir siendo geométricamente inestable, lo que la herramienta señala aparte.','Porównaj m + r z 2n. Mniej — układ jest mechanizmem: porusza się i żaden zestaw sił go nie utrzyma. Więcej — jest statycznie niewyznaczalny: sama równowaga nie wybiera jednej odpowiedzi spośród wielu, które ją spełniają, potrzebna jest sztywność. Równo — układ jest statycznie wyznaczalny, ale bilans jest warunkiem koniecznym, nie wystarczającym: układ może się zgadzać liczbowo, a mimo to być geometrycznie niestateczny, co to narzędzie zgłasza osobno.')
          },
          supports: {
            title: T('Supports', 'Опори', 'Auflager', 'Opleggingen', 'Appuis', 'Apoyos','Podpory'),
            body: T('A pin holds a joint in both directions and contributes two unknown reaction components. A roller holds it in one direction only and contributes one. The usual arrangement for a simply supported truss is one pin and one roller, three components in all — exactly what plane equilibrium of the whole frame can determine.',
                    'Шарнір утримує вузол у двох напрямках і додає дві невідомі складові реакції. Каток утримує лише в одному напрямку й додає одну. Звичайна схема розрізної ферми — один шарнір і один каток, разом три складові, — рівно стільки, скільки визначає рівновага всієї системи на площині.',
                    'Ein Festlager hält den Knoten in beiden Richtungen und liefert zwei unbekannte Reaktionskomponenten. Ein Rollenlager hält nur in einer Richtung und liefert eine. Die übliche Anordnung eines Einfeldfachwerks ist ein Fest- und ein Rollenlager, zusammen drei Komponenten — genau so viele, wie das ebene Gleichgewicht des Gesamtsystems bestimmen kann.',
                    'Een scharnieroplegging houdt de knoop in beide richtingen vast en levert twee onbekende reactiecomponenten. Een roloplegging houdt maar in één richting vast en levert er één. De gebruikelijke opzet van een vrij opgelegd vakwerk is één scharnier en één rol, samen drie componenten — precies wat het vlakke evenwicht van het geheel kan bepalen.',
                    'Une articulation bloque le nœud dans les deux directions et apporte deux composantes de réaction inconnues. Un appui à rouleau ne bloque qu’une direction et en apporte une. La disposition habituelle d’un treillis sur deux appuis est une articulation et un rouleau, trois composantes en tout — exactement ce que l’équilibre plan de l’ensemble peut déterminer.',
                    'Un apoyo fijo sujeta el nudo en ambas direcciones y aporta dos componentes de reacción incógnitas. Un apoyo móvil lo sujeta en una sola dirección y aporta una. La disposición habitual de una celosía biapoyada es un apoyo fijo y uno móvil, tres componentes en total — exactamente lo que el equilibrio plano del conjunto puede determinar.','Podpora stała utrzymuje węzeł w obu kierunkach i wnosi dwie niewiadome składowe reakcji. Podpora przesuwna utrzymuje go tylko w jednym kierunku i wnosi jedną. Zwykły układ kratownicy swobodnie podpartej to jedna podpora stała i jedna przesuwna, razem trzy składowe — dokładnie tyle, ile może wyznaczyć równowaga płaska całego układu.')
          },
          sign: {
            title: T('Sign convention', 'Правило знаків', 'Vorzeichenregel', 'Tekenafspraak', 'Convention de signe', 'Convenio de signos','Konwencja znaków'),
            body: T('Tension is positive, compression is negative. A positive member force pulls its two joints towards each other. The record keeps the signed value; the tile called "largest compression" reports the magnitude of the most negative force, so it reads as a positive number.',
                    'Розтяг — додатний, стиск — від’ємний. Додатне зусилля в стрижні притягує його вузли один до одного. У записі зберігається значення зі знаком; плитка «найбільший стиск» показує модуль найбільш від’ємного зусилля, тобто додатне число.',
                    'Zug ist positiv, Druck ist negativ. Eine positive Stabkraft zieht die beiden Knoten zueinander. Der Rechenbeleg hält den vorzeichenbehafteten Wert; die Kachel „größte Druckkraft“ nennt den Betrag der negativsten Kraft und liest sich daher als positive Zahl.',
                    'Trek is positief, druk is negatief. Een positieve staafkracht trekt de twee knopen naar elkaar toe. Het rekenrapport houdt de waarde met teken; de tegel “grootste drukkracht” geeft de grootte van de meest negatieve kracht en leest dus als een positief getal.',
                    'La traction est positive, la compression négative. Un effort de barre positif rapproche ses deux nœuds. Le relevé conserve la valeur signée ; la tuile « compression maximale » donne la valeur absolue de l’effort le plus négatif et se lit donc comme un nombre positif.',
                    'La tracción es positiva, la compresión negativa. Un esfuerzo de barra positivo acerca sus dos nudos. El registro conserva el valor con signo; el mosaico “compresión máxima” da el módulo del esfuerzo más negativo y por eso se lee como número positivo.','Rozciąganie jest dodatnie, ściskanie ujemne. Dodatnia siła w pręcie ściąga jego dwa węzły ku sobie. Zapis obliczeń zachowuje wartość ze znakiem; kafelek „największa siła ściskająca” podaje wartość bezwzględną najbardziej ujemnej siły, więc czyta się go jako liczbę dodatnią.')
          },
          drawing: {
            title: T('Drawing and editing', 'Креслення та редагування', 'Zeichnen und Bearbeiten',
                     'Tekenen en bewerken', 'Dessiner et modifier', 'Dibujar y editar','Rysowanie i edycja'),
            body: T('Four tools: Select moves and picks, Joint places a joint where you click, Member connects the two joints you click in turn, Erase removes what you click. Everything snaps to the grid spacing you set. Drag a joint to move it, press the arrow keys to nudge the selected one, press Delete to remove it. Every edit is one undo step, and the tables under the drawing edit the same model from the keyboard.',
                    'Чотири інструменти: «Вибір» переміщує й обирає, «Вузол» ставить вузол там, де ви клацнули, «Стрижень» з’єднує два послідовно вибрані вузли, «Стерти» вилучає те, на що ви клацнули. Усе прив’язується до заданого кроку сітки. Перетягніть вузол, щоб зсунути його, стрілки зсувають вибраний вузол, Delete його вилучає. Кожна правка — один крок скасування, а таблиці під кресленням редагують ту саму модель із клавіатури.',
                    'Vier Werkzeuge: Auswählen verschiebt und wählt, Knoten setzt einen Knoten an die Klickstelle, Stab verbindet die zwei nacheinander angeklickten Knoten, Löschen entfernt das Angeklickte. Alles rastet auf dem eingestellten Raster ein. Ziehen Sie einen Knoten zum Verschieben, die Pfeiltasten verschieben den gewählten, Entf löscht ihn. Jede Änderung ist ein Rückgängig-Schritt, und die Tabellen unter der Zeichnung bearbeiten dasselbe Modell über die Tastatur.',
                    'Vier gereedschappen: Selecteren verplaatst en kiest, Knoop plaatst een knoop waar u klikt, Staaf verbindt de twee knopen die u na elkaar aanklikt, Wissen verwijdert wat u aanklikt. Alles klikt vast op de ingestelde rasterstap. Sleep een knoop om die te verplaatsen, de pijltoetsen verschuiven de gekozen knoop, Delete verwijdert hem. Elke bewerking is één ongedaan-stap, en de tabellen onder de tekening bewerken hetzelfde model met het toetsenbord.',
                    'Quatre outils : Sélection déplace et choisit, Nœud pose un nœud à l’endroit cliqué, Barre relie les deux nœuds cliqués successivement, Effacer supprime ce que vous cliquez. Tout s’aligne sur le pas de grille choisi. Faites glisser un nœud pour le déplacer, les flèches décalent celui qui est sélectionné, Suppr le supprime. Chaque modification est une étape d’annulation, et les tableaux sous le dessin modifient le même modèle au clavier.',
                    'Cuatro herramientas: Seleccionar mueve y elige, Nudo coloca un nudo donde haga clic, Barra une los dos nudos que pulse sucesivamente, Borrar elimina lo que pulse. Todo se ajusta al paso de retícula elegido. Arrastre un nudo para moverlo, las flechas desplazan el seleccionado, Supr lo elimina. Cada edición es un paso de deshacer, y las tablas bajo el dibujo editan el mismo modelo con el teclado.','Cztery narzędzia: Wybór przesuwa i zaznacza, Węzeł stawia węzeł w miejscu kliknięcia, Pręt łączy dwa węzły klikane po kolei, Usuwanie usuwa to, co klikniesz. Wszystko przyciąga się do ustawionego rozstawu siatki. Przeciągnij węzeł, aby go przesunąć, naciśnij strzałki, aby przesunąć wybrany, naciśnij Delete, aby go usunąć. Każda zmiana to jeden krok cofania, a tabele pod rysunkiem edytują ten sam model z klawiatury.')
          }
        },

  /* ========================================================= 3. the record */
  function initData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'trussframe',
        file: 'trussframe.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) {
            Object.assign(state, o || {});
            if (!Array.isArray(state.nodes)) state.nodes = [];
            if (!Array.isArray(state.members)) state.members = [];
            select(null); view.pending = null; fitView();
            if (ui) { ui.sync(); ui.run(); } else { last = solveTruss(state); }
          }
        },
        record: function () {
          if (!last || last.n === 0) return null;
          var k, reacNode = [], reacX = [], reacY = [], seen = {};
          for (k = 0; k < last.reac.length; k++) {
            var j = last.reac[k].node;
            if (seen[j] != null) continue;
            seen[j] = 1;
            var rx = null, ry = null;
            for (var q = 0; q < last.reac.length; q++) {
              if (last.reac[q].node !== j) continue;
              if (last.reac[q].dir === 0) rx = last.solved ? last.react[q] : null;
              else ry = last.solved ? last.react[q] : null;
            }
            reacNode.push(j); reacX.push(rx); reacY.push(ry);
          }
          var forces = [];
          for (k = 0; k < last.m; k++) forces.push(last.solved ? last.force[k] : null);
          var warnings = [];
          if (!last.solved) warnings.push('not solved: ' + last.why +
            ' — no member force or reaction is given (m + r - 2n = ' + last.balance + ')');
          if (last.lone > 0) warnings.push(last.lone + ' joint(s) connected to no member');
          if (last.solved && last.resid > 1e-6 * Math.max(1, last.loadSum)) {
            warnings.push('equilibrium residual ' + last.resid + ' N is larger than expected for this load level');
          }
          return {
            inputs: {
              nodes: JSON.parse(JSON.stringify(state.nodes)),
              members: JSON.parse(JSON.stringify(state.members))
            },
            outputs: {
              n_joints: last.n,
              n_members: last.m,
              n_reaction_components: last.r,
              determinacy_count: last.balance,
              solved: last.solved ? 1 : 0,
              member_length: last.len,
              member_force: forces,
              reaction_joint: reacNode,
              reaction_x: reacX,
              reaction_y: reacY,
              max_tension: last.solved ? last.maxT : null,
              max_compression: last.solved ? last.maxC : null,
              total_member_length: last.total,
              zero_force_members: last.solved ? last.zero : null,
              equilibrium_residual: last.solved ? last.resid : null
            },
            units: {
              nodes: 'x, y in m; fx, fy in N; s is a support code (free, pin, rx, ry)',
              members: 'a, b are zero-based joint indices',
              n_joints: '1', n_members: '1', n_reaction_components: '1',
              determinacy_count: '1', solved: '1',
              member_length: 'm', member_force: 'N (tension positive)',
              reaction_joint: '1 (zero-based joint index)',
              reaction_x: 'N', reaction_y: 'N',
              max_tension: 'N', max_compression: 'N (magnitude of the most negative member force)',
              total_member_length: 'm', zero_force_members: '1', equilibrium_residual: 'N'
            },
            model: {
              equations: [
                'for each member k between joints a and b: u_k = (r_b - r_a) / |r_b - r_a|',
                'joint equilibrium at j: sum_k s_jk N_k u_k + R_j + P_j = 0, s_jk = +1 at a, -1 at b',
                'assembled: A x = b with 2n rows and m + r unknowns x = (N, R)',
                'solved by Gaussian elimination with partial pivoting when m + r = 2n',
                'determinacy count = m + r - 2n'
              ],
              ranges: [
                'ideal pin-jointed planar truss, straight weightless members, loads applied at joints only',
                'linear statics, small displacements, first order',
                'solved only for m + r - 2n = 0 and a non-singular equilibrium matrix'
              ],
              notes: [
                'prototype: no independent validation and no benchmark artifact',
                'tension positive; max_compression is reported as a positive magnitude',
                'no material, no section, no stiffness, no buckling check, no code check'
              ]
            },
            warnings: warnings
          };
        },
        python: function () {
          if (!last || last.n === 0) {
            return { unsupported: T('There is nothing drawn to export yet.', 'Поки немає чого експортувати.',
                                    'Es ist noch nichts gezeichnet, was exportiert werden könnte.',
                                    'Er is nog niets getekend om te exporteren.',
                                    'Il n’y a encore rien de dessiné à exporter.',
                                    'Todavía no hay nada dibujado que exportar.','Nie narysowano jeszcze nic do eksportu.') };
          }
          return {
            code: PY_SOURCE,
            requires: [],
            basis: { kind: 'reproduce',
                     note: 'the same equilibrium assembly and the same Gaussian elimination, in the same order as the page',
                     deviation: 'none observed' },
            selftest: { tolerance: 1e-9 }
          };
        },
        handoff: {
          provides: ['L'], accepts: [],
          build: function () {
            if (!last || last.m === 0) return null;
            return { quantities: { L: { value: last.total, unit: 'm' } } };
          }
        },

        /* §6.5: the drawing is the tool's primary content, so it is part of the
           report. A data: URL from the tool's own canvas — the report fetches
           nothing — placed as a section above the record dump. */
        report: {
          sections: function () {
            var cv = view.cv, url = null;
            if (!cv) return [];
            try { url = cv.toDataURL('image/png'); } catch (e) { return []; }
            if (!url || url.indexOf('data:image') !== 0) return [];
            return [{
              title: L(T('The truss as drawn', 'Ферма, як накреслено', 'Das Fachwerk wie gezeichnet',
                         'Het vakwerk zoals getekend', 'Le treillis tel que dessiné', 'La celosía tal como se dibujó','Kratownica w narysowanej postaci')),
              image: { src: url, width: '100%',
                       caption: L(T('Members coloured by tension and compression; line weight follows the magnitude. Forces in N.',
                                    'Стрижні пофарбовано за розтягом і стиском; товщина лінії відповідає модулю. Зусилля в Н.',
                                    'Stäbe nach Zug und Druck eingefärbt; Strichstärke nach Betrag. Kräfte in N.',
                                    'Staven gekleurd naar trek en druk; lijndikte naar grootte. Krachten in N.',
                                    'Barres colorées selon traction et compression ; épaisseur selon l’intensité. Efforts en N.',
                                    'Barras coloreadas según tracción y compresión; grosor según la magnitud. Esfuerzos en N.','Pręty kolorowane według rozciągania i ściskania; grubość linii odpowiada wartości. Siły w N.')),
                       alt: L(T('Scale drawing of the truss.', 'Масштабне креслення ферми.', 'Maßstäbliche Zeichnung des Fachwerks.',
                                'Schaaltekening van het vakwerk.', 'Dessin à l’échelle du treillis.', 'Dibujo a escala de la celosía.','Rysunek kratownicy w skali.')) }
            }];
          }
        }
      });
    }
  }

  /* the tool's own model, ported verbatim to a bare python3 */
  var PY_SOURCE = [
    'def _reactions(nodes):',
    '    out = []',
    '    for j, nd in enumerate(nodes):',
    '        s = nd.get("s", "free")',
    '        if s == "pin":',
    '            out.append((j, 0))',
    '            out.append((j, 1))',
    '        elif s == "rx":',
    '            out.append((j, 0))',
    '        elif s == "ry":',
    '            out.append((j, 1))',
    '    return out',
    '',
    '',
    'def _gauss(A, b):',
    '    """Gaussian elimination with partial pivoting; None on a singular matrix."""',
    '    n = len(b)',
    '    M = [list(A[i]) + [b[i]] for i in range(n)]',
    '    for c in range(n):',
    '        p = c',
    '        for r in range(c + 1, n):',
    '            if abs(M[r][c]) > abs(M[p][c]):',
    '                p = r',
    '        if abs(M[p][c]) < 1e-9:',
    '            return None',
    '        if p != c:',
    '            M[c], M[p] = M[p], M[c]',
    '        pv = M[c][c]',
    '        for r in range(c + 1, n):',
    '            f = M[r][c] / pv',
    '            if f == 0.0:',
    '                continue',
    '            for k in range(c, n + 1):',
    '                M[r][k] -= f * M[c][k]',
    '    x = [0.0] * n',
    '    for c in range(n - 1, -1, -1):',
    '        s = M[c][n]',
    '        for k in range(c + 1, n):',
    '            s -= M[c][k] * x[k]',
    '        x[c] = s / M[c][c]',
    '    return x',
    '',
    '',
    'def solve_truss(nodes, members):',
    '    n = len(nodes)',
    '    m = len(members)',
    '    length = []',
    '    ux = []',
    '    uy = []',
    '    geom_bad = 0',
    '    total = 0.0',
    '    for mm in members:',
    '        a = mm["a"]',
    '        b = mm["b"]',
    '        l = 0.0',
    '        dx = 0.0',
    '        dy = 0.0',
    '        if 0 <= a < n and 0 <= b < n and a != b:',
    '            dx = nodes[b]["x"] - nodes[a]["x"]',
    '            dy = nodes[b]["y"] - nodes[a]["y"]',
    '            l = math.sqrt(dx * dx + dy * dy)',
    '        if not (l > 1e-9):',
    '            geom_bad += 1',
    '        length.append(l)',
    '        total += l',
    '        ux.append(dx / l if l > 1e-9 else 0.0)',
    '        uy.append(dy / l if l > 1e-9 else 0.0)',
    '',
    '    reac = _reactions(nodes)',
    '    r = len(reac)',
    '    unknowns = m + r',
    '    eqs = 2 * n',
    '    balance = unknowns - eqs',
    '',
    '    deg = [0] * n',
    '    for mm in members:',
    '        if 0 <= mm["a"] < n:',
    '            deg[mm["a"]] += 1',
    '        if 0 <= mm["b"] < n:',
    '            deg[mm["b"]] += 1',
    '    lone = sum(1 for d in deg if d == 0)',
    '',
    '    lx = sum(nd.get("fx", 0.0) for nd in nodes)',
    '    ly = sum(nd.get("fy", 0.0) for nd in nodes)',
    '    load_sum = math.sqrt(lx * lx + ly * ly)',
    '',
    '    out = {',
    '        "n": n, "m": m, "r": r, "balance": balance, "lone": lone,',
    '        "len": length, "total": total, "reac": reac, "load_sum": load_sum,',
    '        "force": None, "react": None, "solved": False, "why": "empty",',
    '        "maxT": None, "maxC": None, "resid": None, "zero": None,',
    '    }',
    '    if n == 0 or m == 0:',
    '        return out',
    '    if geom_bad:',
    '        out["why"] = "geometry"',
    '        return out',
    '    if balance < 0:',
    '        out["why"] = "mechanism"',
    '        return out',
    '    if balance > 0:',
    '        out["why"] = "indeterminate"',
    '        return out',
    '',
    '    A = [[0.0] * unknowns for _ in range(eqs)]',
    '    rhs = [0.0] * eqs',
    '    for k, mm in enumerate(members):',
    '        ja = mm["a"]',
    '        jb = mm["b"]',
    '        A[2 * ja][k] += ux[k]',
    '        A[2 * ja + 1][k] += uy[k]',
    '        A[2 * jb][k] += -ux[k]',
    '        A[2 * jb + 1][k] += -uy[k]',
    '    for i, rc in enumerate(reac):',
    '        A[2 * rc[0] + rc[1]][m + i] += 1.0',
    '    for j, nd in enumerate(nodes):',
    '        rhs[2 * j] = -nd.get("fx", 0.0)',
    '        rhs[2 * j + 1] = -nd.get("fy", 0.0)',
    '',
    '    x = _gauss(A, rhs)',
    '    if x is None:',
    '        out["why"] = "singular"',
    '        return out',
    '',
    '    force = x[:m]',
    '    react = x[m:]',
    '    resid = 0.0',
    '    for i in range(eqs):',
    '        acc = 0.0',
    '        for k in range(unknowns):',
    '            acc += A[i][k] * x[k]',
    '        e = abs(acc - rhs[i])',
    '        if e > resid:',
    '            resid = e',
    '    scale = max(1.0, load_sum)',
    '    maxT = 0.0',
    '    maxC = 0.0',
    '    zero = 0',
    '    for f in force:',
    '        if f > maxT:',
    '            maxT = f',
    '        if -f > maxC:',
    '            maxC = -f',
    '        if abs(f) < 1e-6 * scale:',
    '            zero += 1',
    '    out.update({"force": force, "react": react, "solved": True, "why": "ok",',
    '                "maxT": maxT, "maxC": maxC, "resid": resid, "zero": zero})',
    '    return out',
    '',
    '',
    'def compute():',
    '    """Return exactly the outputs the tool recorded, under the same names."""',
    '    res = solve_truss(NODES, MEMBERS)',
    '    seen = set()',
    '    reac_joint = []',
    '    reac_x = []',
    '    reac_y = []',
    '    for j, _d in res["reac"]:',
    '        if j in seen:',
    '            continue',
    '        seen.add(j)',
    '        rx = None',
    '        ry = None',
    '        for q, (jq, dq) in enumerate(res["reac"]):',
    '            if jq != j:',
    '                continue',
    '            if dq == 0:',
    '                rx = res["react"][q] if res["solved"] else None',
    '            else:',
    '                ry = res["react"][q] if res["solved"] else None',
    '        reac_joint.append(j)',
    '        reac_x.append(rx)',
    '        reac_y.append(ry)',
    '    forces = [(res["force"][k] if res["solved"] else None) for k in range(res["m"])]',
    '    return {',
    '        "n_joints": res["n"],',
    '        "n_members": res["m"],',
    '        "n_reaction_components": res["r"],',
    '        "determinacy_count": res["balance"],',
    '        "solved": 1 if res["solved"] else 0,',
    '        "member_length": res["len"],',
    '        "member_force": forces,',
    '        "reaction_joint": reac_joint,',
    '        "reaction_x": reac_x,',
    '        "reaction_y": reac_y,',
    '        "max_tension": res["maxT"] if res["solved"] else None,',
    '        "max_compression": res["maxC"] if res["solved"] else None,',
    '        "total_member_length": res["total"],',
    '        "zero_force_members": res["zero"] if res["solved"] else None,',
    '        "equilibrium_residual": res["resid"] if res["solved"] else None,',
    '    }'
  ].join('\n');

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
