  "description": {
    "en": "Define a laser beam by its waist, its divergence or measured diameters (ISO 11146 hyperbola fit gives w0, z0 and M²), place thin lenses, cylindrical lenses, curved mirrors at an angle, plates and apertures along the axis, and see w(z), R(z) and the Gouy phase for x and y, the waist after every element, the Rayleigh ranges and clipping at each aperture. The mode-matching solver finds two-lens telescopes from a list of focal lengths that turn your beam into a target waist and ranks them by alignment tolerance; the expander list compares Keplerian and Galilean telescopes. Fibre coupling gives the overlap efficiency with a fibre mode including lateral, angular and axial misalignment; the cavity mode gives g1·g2 stability, the eigenmode, free spectral range and transverse mode spacing.",
    "uk": "Задайте пучок перетяжкою, розбіжністю або виміряними діаметрами (апроксимація гіперболою за ISO 11146 дає w0, z0 і M²), розставте вздовж осі тонкі та циліндричні лінзи, похилі сферичні дзеркала, пластини й діафрагми — і побачите w(z), R(z) та фазу Гуї для x і y, перетяжку після кожного елемента, довжини Релея й обрізання на кожній апертурі. Розв’язувач узгодження мод підбирає з переліку фокусних відстаней двохлінзові телескопи, що перетворюють ваш пучок на цільову перетяжку, і впорядковує їх за допуском юстування; перелік розширювачів порівнює телескопи Кеплера й Галілея. Введення у волокно дає ефективність перекриття з модою волокна з урахуванням поперечного, кутового й осьового зміщення; резонатор — стійкість g1·g2, власну моду, вільний спектральний інтервал і відстань між поперечними модами.",
    "de": "Definieren Sie den Strahl über Taille, Divergenz oder gemessene Durchmesser (der Hyperbel-Fit nach ISO 11146 liefert w0, z0 und M²), setzen Sie dünne Linsen, Zylinderlinsen, schräg gestellte Hohlspiegel, Platten und Blenden entlang der Achse und sehen Sie w(z), R(z) und die Gouy-Phase für x und y, die Taille nach jedem Element, die Rayleigh-Längen und die Abschattung an jeder Apertur. Der Modenanpassungs-Löser findet aus einer Brennweitenliste Zwei-Linsen-Teleskope, die Ihren Strahl in eine Zieltaille überführen, und ordnet sie nach Justagetoleranz; die Aufweiter-Liste vergleicht Kepler- und Galilei-Teleskope. Die Faserkopplung liefert den Überlappwirkungsgrad mit der Fasermode einschließlich lateralem, Winkel- und axialem Versatz; der Resonator die g1·g2-Stabilität, die Eigenmode, den freien Spektralbereich und den Transversalmodenabstand.",

    "fr": "Définissez le faisceau par son col, sa divergence ou des diamètres mesurés (l’ajustement hyperbolique ISO 11146 donne w0, z0 et M²), placez lentilles minces, lentilles cylindriques, miroirs concaves inclinés, lames et diaphragmes le long de l’axe, et voyez w(z), R(z) et la phase de Gouy en x et y, le col après chaque élément, les longueurs de Rayleigh et la troncature à chaque ouverture. Le solveur d’adaptation de mode trouve, dans une liste de focales, les télescopes à deux lentilles qui transforment votre faisceau en un col cible et les classe selon la tolérance d’alignement ; la liste des élargisseurs compare télescopes de Kepler et de Galilée. Le couplage dans une fibre donne le rendement de recouvrement avec le mode de la fibre, désalignements latéral, angulaire et axial compris ; la cavité donne la stabilité g1·g2, le mode propre, l’intervalle spectral libre et l’écart des modes transverses.",
    "es": "Defina el haz por su cintura, su divergencia o diámetros medidos (el ajuste hiperbólico ISO 11146 da w0, z0 y M²), coloque lentes delgadas, lentes cilíndricas, espejos cóncavos inclinados, láminas y diafragmas a lo largo del eje y vea w(z), R(z) y la fase de Gouy en x e y, la cintura tras cada elemento, las longitudes de Rayleigh y el recorte en cada apertura. El solucionador de acoplamiento de modos busca en una lista de focales telescopios de dos lentes que convierten su haz en una cintura objetivo y los ordena por tolerancia de alineación; la lista de expansores compara telescopios de Kepler y de Galileo. El acoplo a fibra da la eficiencia de solapamiento con el modo de la fibra, incluidos desalineamientos lateral, angular y axial; la cavidad da la estabilidad g1·g2, el modo propio, el rango espectral libre y la separación de modos transversales.",

  "limitations": {
    "en": "Paraxial scalar Gaussian beam optics (ABCD law). Real beams are treated as embedded Gaussians of quality M² (Siegman); higher-order mode structure, partial coherence and twisted or general astigmatic beams are not modelled — x and y are independent (simple astigmatism). Lenses are thin and aberration-free, mirrors are unfolded into lenses (f = R/2) with the cosθ astigmatism of oblique incidence; apertures are checked for clipping but do not change the beam afterwards (no diffraction rings). Results lose accuracy for divergence half-angles above ≈ 0.25 rad (NA > 0.25). Fibre coupling is the overlap of fundamental Gaussian modes, without Fresnel loss; for M² > 1 it is an upper bound. The cavity is an empty two-mirror resonator. Stock focal lengths (Thorlabs Ø 25.4 mm N-BK7 singlets) are catalogue values at 587.6 nm used as thin lenses: thickness, principal planes and dispersion are ignored. Focal lengths are those in the medium where the element sits.",
    "uk": "Параксіальна скалярна оптика гаусових пучків (закон ABCD). Реальні пучки розглядаються як вкладені гаусові пучки з якістю M² (Зігмен); структура вищих мод, часткова когерентність і закручені чи загальноастигматичні пучки не моделюються — x та y незалежні (простий астигматизм). Лінзи тонкі й без аберацій, дзеркала розгортаються в лінзи (f = R/2) з астигматизмом cosθ похилого падіння; апертури перевіряються на обрізання, але далі пучок не змінюють (без дифракційних кілець). Точність падає при півкуті розбіжності понад ≈ 0,25 рад (NA > 0,25). Введення у волокно — перекриття основних гаусових мод, без френелівських втрат; для M² > 1 це верхня межа. Резонатор — порожній двозеркальний. Складські фокусні відстані (сингліти Thorlabs Ø 25,4 мм з N-BK7) — каталожні значення на 587,6 нм, ужиті як тонкі лінзи: товщина, головні площини й дисперсія не враховуються. Фокусні відстані задаються для середовища, де стоїть елемент.",
    "de": "Paraxiale skalare Gaußstrahloptik (ABCD-Gesetz). Reale Strahlen werden als eingebettete Gaußstrahlen der Qualität M² behandelt (Siegman); Struktur höherer Moden, partielle Kohärenz sowie verdrillte oder allgemein astigmatische Strahlen werden nicht modelliert — x und y sind unabhängig (einfacher Astigmatismus). Linsen sind dünn und aberrationsfrei, Spiegel werden zu Linsen entfaltet (f = R/2) mit dem cosθ-Astigmatismus schräger Inzidenz; Aperturen werden auf Abschattung geprüft, ändern den Strahl danach aber nicht (keine Beugungsringe). Ab Divergenz-Halbwinkeln über ≈ 0,25 rad (NA > 0,25) sinkt die Genauigkeit. Die Faserkopplung ist der Überlapp von Gaußschen Grundmoden ohne Fresnel-Verlust; für M² > 1 eine obere Schranke. Der Resonator ist ein leerer Zwei-Spiegel-Resonator. Lager-Brennweiten (Thorlabs-Einzellinsen Ø 25,4 mm aus N-BK7) sind Katalogwerte bei 587,6 nm, als dünne Linsen verwendet: Dicke, Hauptebenen und Dispersion bleiben unberücksichtigt. Brennweiten gelten im Medium, in dem das Element sitzt.",
    "nl": "Paraxiale scalaire optica van Gaussische bundels (ABCD-wet). Echte bundels worden behandeld als ingebedde Gaussische bundels met kwaliteit M² (Siegman); structuur van hogere modes, partiële coherentie en getordeerde of algemeen astigmatische bundels worden niet gemodelleerd — x en y zijn onafhankelijk (eenvoudig astigmatisme). Lenzen zijn dun en aberratievrij, spiegels worden ontvouwen tot lenzen (f = R/2) met het cosθ-astigmatisme van schuine inval; apertures worden op afsnijden gecontroleerd maar veranderen de bundel daarna niet (geen buigingsringen). Bij halve divergentiehoeken boven ≈ 0,25 rad (NA > 0,25) neemt de nauwkeurigheid af. Vezelkoppeling is de overlap van Gaussische grondmodes zonder Fresnelverlies; voor M² > 1 een bovengrens. De resonator is een lege resonator met twee spiegels. Voorraadbrandpuntsafstanden (Thorlabs-singlets Ø 25,4 mm van N-BK7) zijn catalogus­waarden bij 587,6 nm, gebruikt als dunne lenzen: dikte, hoofdvlakken en dispersie worden genegeerd. Brandpuntsafstanden gelden in het medium waarin het element staat.",
    "fr": "Optique paraxiale scalaire des faisceaux gaussiens (loi ABCD). Les faisceaux réels sont traités comme des gaussiens enchâssés de qualité M² (Siegman) ; la structure des modes d’ordre supérieur, la cohérence partielle et les faisceaux torsadés ou à astigmatisme général ne sont pas modélisés — x et y sont indépendants (astigmatisme simple). Les lentilles sont minces et sans aberration, les miroirs sont dépliés en lentilles (f = R/2) avec l’astigmatisme en cosθ de l’incidence oblique ; les ouvertures sont vérifiées pour la troncature mais ne modifient pas le faisceau ensuite (pas d’anneaux de diffraction). La précision baisse au-delà d’un demi-angle de divergence d’environ 0,25 rad (ON > 0,25). Le couplage dans une fibre est le recouvrement de modes gaussiens fondamentaux, sans pertes de Fresnel ; pour M² > 1 c’est une borne supérieure. La cavité est un résonateur vide à deux miroirs. Les focales du catalogue (singulets Thorlabs Ø 25,4 mm en N-BK7) sont des valeurs à 587,6 nm utilisées comme lentilles minces : épaisseur, plans principaux et dispersion sont ignorés. Les focales sont celles dans le milieu où se trouve l’élément.",
    "es": "Óptica paraxial escalar de haces gaussianos (ley ABCD). Los haces reales se tratan como gaussianos embebidos de calidad M² (Siegman); no se modelan la estructura de modos de orden superior, la coherencia parcial ni los haces torcidos o con astigmatismo general — x e y son independientes (astigmatismo simple). Las lentes son delgadas y sin aberraciones, los espejos se despliegan en lentes (f = R/2) con el astigmatismo en cosθ de la incidencia oblicua; las aperturas se comprueban por recorte pero no modifican el haz después (sin anillos de difracción). La precisión baja con semiángulos de divergencia superiores a ≈ 0,25 rad (NA > 0,25). El acoplo a fibra es el solapamiento de modos gaussianos fundamentales, sin pérdidas de Fresnel; para M² > 1 es una cota superior. La cavidad es un resonador vacío de dos espejos. Las focales de catálogo (lentes simples Thorlabs Ø 25,4 mm de N-BK7) son valores a 587,6 nm usados como lentes delgadas: se ignoran el espesor, los planos principales y la dispersión. Las focales son las del medio donde está el elemento.",
    "pl": "Przyosiowa skalarna optyka wiązek gaussowskich (prawo ABCD). Rzeczywiste wiązki traktowane są jako osadzone wiązki gaussowskie o jakości M² (Siegman); struktura modów wyższych rzędów, częściowa koherencja oraz wiązki skręcone lub o astygmatyzmie ogólnym nie są modelowane — x i y są niezależne (astygmatyzm prosty). Soczewki są cienkie i bez aberracji, zwierciadła są rozwijane w soczewki (f = R/2) z astygmatyzmem cosθ padania ukośnego; przesłony sprawdzane są pod kątem obcięcia, ale dalej nie zmieniają wiązki (bez pierścieni dyfrakcyjnych). Dokładność spada przy półkącie rozbieżności powyżej ≈ 0,25 rad (NA > 0,25). Sprzęganie do światłowodu to nakładanie podstawowych modów gaussowskich, bez strat Fresnela; dla M² > 1 to ograniczenie górne. Rezonator jest pustym rezonatorem dwuzwierciadlanym. Ogniskowe katalogowe (soczewki pojedyncze Thorlabs Ø 25,4 mm z N-BK7) to wartości dla 587,6 nm traktowane jak cienkie soczewki: grubość, płaszczyzny główne i dyspersja są pomijane. Ogniskowe dotyczą ośrodka, w którym stoi element."

          "uk": "55 випадки проти незалежної реалізації на Python: w(z) і радіус хвильового фронту в 21 площині на вісь для 15 схем (вільний простір, тонкі лінзи на шести відстанях, кристалічна пластина, похиле сферичне дзеркало, астигматичний діод із циліндричною лінзою, телескопи Кеплера й Галілея, середовище з n = 1,333) з фізичним q і матрицями меж; фокусування за Self (1983); введення у волокно проти чисельного інтеграла перекриття (без зсуву, поперечний зсув, нахил, розфокусування, невідповідність розміру); апроксимації ISO 11146-1; шість резонаторів проти власної моди матриці обходу; повні множини рішень узгодження мод для двох задач і твердження кожного прикладу.",

          "nl": "55 gevallen tegen een onafhankelijke Python-implementatie: w(z) en golffrontstraal in 21 vlakken per as voor 15 opstellingen (vrije ruimte, dunne lenzen bij zes voorwerpsafstanden, een kristalplaat, een schuine holle spiegel, een astigmatische diode met cilinderlens, Kepler- en Galilei-telescopen, een medium met n = 1,333) met de fysische q en grensvlakmatrices; focussering volgens Self (1983); vezelkoppeling tegen een numerieke overlapintegraal (uitgelijnd, lateraal, kanteling, defocus, grootteverschil); ISO 11146-1-fits; zes resonatoren tegen de eigenmode van de rondgangsmatrix; de volledige oplossingsverzamelingen van twee modematchingproblemen en de bewering van elk voorbeeld.",

        head: [T('Type', 'Тип', 'Typ', 'Type', 'Type', 'Tipo', 'Typ'), 'f₁', 'f₂', '×', T('Length', 'Довжина', 'Länge', 'Lengte', 'Longueur', 'Longitud', 'Długość')],
        rows: last.exp.map(function (e) { return { cells: [e.kind === 'kepler' ? 'Kepler' : T('Galileo', 'Галілей', 'Galilei', 'Galilei', 'Galilée', 'Galileo', 'Galileusz'), e.l1, e.l2, { value: e.M, precision: 2 }, { text: F(e.L * 1000, 0) + ' mm', num: true }] }; }) });
      notes.push(T('η, lens 1 / lens 2 +1 mm: mode-matching efficiency left after moving that lens 1 mm downstream — a direct measure of how critical the alignment is. Focal lengths are thin-lens values from the chosen list.', 'η, лінза 1 / лінза 2 +1 мм: ефективність узгодження після зсуву цієї лінзи на 1 мм уперед — пряма міра критичності юстування. Фокусні відстані — тонколінзові значення з вибраного переліку.', 'η, Linse 1 / Linse 2 +1 mm: Anpassungswirkungsgrad nach Verschieben dieser Linse um 1 mm stromab — ein direktes Maß, wie kritisch die Justage ist. Brennweiten sind Dünnlinsenwerte aus der gewählten Liste.', 'η, lens 1 / lens 2 +1 mm: matchingrendement na 1 mm verschuiven van die lens stroomafwaarts — een directe maat voor hoe kritisch de uitlijning is. Brandpuntsafstanden zijn dunnelenswaarden uit de gekozen lijst.', 'η, lentille 1 / lentille 2 +1 mm : rendement d’adaptation après un déplacement de 1 mm de cette lentille vers l’aval — mesure directe de la criticité de l’alignement. Les focales sont des valeurs de lentilles minces de la liste choisie.', 'η, lente 1 / lente 2 +1 mm: eficiencia de acoplamiento tras mover esa lente 1 mm aguas abajo — medida directa de lo crítico de la alineación. Las focales son valores de lente delgada de la lista elegida.', 'η, soczewka 1 / soczewka 2 +1 mm: sprawność dopasowania po przesunięciu tej soczewki o 1 mm dalej — bezpośrednia miara krytyczności justowania. Ogniskowe to wartości cienkich soczewek z wybranej listy.'));
    }
    if (!verdict && last.mode === 'propagate') {
      verdict = { tone: 'ok', text: T('Final waist ' + L(out.x.w0) + ' at z = ' + F(out.x.z0 * 1000, 2) + ' mm; Rayleigh range ' + L(out.x.zR) + '.', 'Кінцева перетяжка ' + L(out.x.w0) + ' при z = ' + F(out.x.z0 * 1000, 2) + ' мм; довжина Релея ' + L(out.x.zR) + '.', 'Letzte Taille ' + L(out.x.w0) + ' bei z = ' + F(out.x.z0 * 1000, 2) + ' mm; Rayleigh-Länge ' + L(out.x.zR) + '.', 'Laatste taille ' + L(out.x.w0) + ' bij z = ' + F(out.x.z0 * 1000, 2) + ' mm; Rayleigh-lengte ' + L(out.x.zR) + '.', 'Dernier col ' + L(out.x.w0) + ' à z = ' + F(out.x.z0 * 1000, 2) + ' mm ; longueur de Rayleigh ' + L(out.x.zR) + '.', 'Última cintura ' + L(out.x.w0) + ' en z = ' + F(out.x.z0 * 1000, 2) + ' mm; longitud de Rayleigh ' + L(out.x.zR) + '.', 'Końcowe przewężenie ' + L(out.x.w0) + ' przy z = ' + F(out.x.z0 * 1000, 2) + ' mm; długość Rayleigha ' + L(out.x.zR) + '.') };
    }
    notes.push(UNIT_NOTE);
    return { verdict: verdict, tiles: tiles, tables: tables, notes: notes };
  }

  function cavityPayload(c) {
    var lang = (ui && ui.lang) || 'en';
    var tiles = [
      { label: 'g₁ · g₂', value: c.G, precision: 4, tone: c.stable ? (c.G > 0.95 || c.G < 0.05 ? 'warn' : 'ok') : 'bad', learn: 'stability' },
      { label: T('Waist radius', 'Радіус перетяжки', 'Taillenradius', 'Tailleradius', 'Rayon du col', 'Radio de la cintura', 'Promień przewężenia'), value: c.stable ? lenParts(c.w0).v : null, hint: c.stable ? lenParts(c.w0).u : '', precision: 3 },
      { label: T('Spot on mirror 1 / 2', 'Пляма на дзеркалі 1 / 2', 'Fleck auf Spiegel 1 / 2', 'Vlek op spiegel 1 / 2', 'Tache sur miroir 1 / 2', 'Mancha en espejo 1 / 2', 'Plamka na zwierciadle 1 / 2'), value: c.stable ? lenParts(c.w1).v : null, hint: c.stable ? lenParts(c.w1).u + ' / ' + L(c.w2) : '', precision: 3 },
      { label: T('Free spectral range', 'Вільний спектральний інтервал', 'Freier Spektralbereich', 'Vrij spectraal bereik', 'Intervalle spectral libre', 'Rango espectral libre', 'Przedział dyspersji swobodnej'), value: c.FSR / 1e6, hint: 'MHz', precision: 2, headline: false },
      { label: T('Transverse mode spacing', 'Відстань між поперечними модами', 'Transversalmodenabstand', 'Transversale modeafstand', 'Écart des modes transverses', 'Separación de modos transversales', 'Odstęp modów poprzecznych'), value: c.stable ? c.dnuT / 1e6 : null, hint: 'MHz', precision: 2, headline: false, learn: 'gouy' },
      { label: T('Waist from mirror 1', 'Перетяжка від дзеркала 1', 'Taille ab Spiegel 1', 'Taille vanaf spiegel 1', 'Col depuis le miroir 1', 'Cintura desde el espejo 1', 'Przewężenie od zwierciadła 1'), value: c.stable ? c.z1 * 1000 : null, hint: 'mm', precision: 2, headline: false }
    ];
    return {
      verdict: c.stable ? { tone: c.G > 0.95 || c.G < 0.05 ? 'warn' : 'ok', text: c.G > 0.95 || c.G < 0.05
          ? T('Stable, but close to the edge (g₁g₂ = ' + F(c.G, 3) + '): small length or curvature errors change the mode a lot.', 'Стійкий, але близько до межі (g₁g₂ = ' + F(c.G, 3) + '): малі похибки довжини чи кривини сильно змінюють моду.', 'Stabil, aber nahe der Grenze (g₁g₂ = ' + F(c.G, 3) + '): kleine Längen- oder Krümmungsfehler ändern die Mode stark.', 'Stabiel, maar dicht bij de grens (g₁g₂ = ' + F(c.G, 3) + '): kleine lengte- of krommingsfouten veranderen de mode sterk.', 'Stable, mais proche de la limite (g₁g₂ = ' + F(c.G, 3) + ') : de petites erreurs de longueur ou de courbure changent beaucoup le mode.', 'Estable, pero cerca del límite (g₁g₂ = ' + F(c.G, 3) + '): pequeños errores de longitud o curvatura cambian mucho el modo.', 'Stabilny, ale blisko granicy (g₁g₂ = ' + F(c.G, 3) + '): małe błędy długości lub krzywizny silnie zmieniają mod.')
          : T('Stable resonator (0 < g₁g₂ = ' + F(c.G, 3) + ' < 1).', 'Стійкий резонатор (0 < g₁g₂ = ' + F(c.G, 3) + ' < 1).', 'Stabiler Resonator (0 < g₁g₂ = ' + F(c.G, 3) + ' < 1).', 'Stabiele resonator (0 < g₁g₂ = ' + F(c.G, 3) + ' < 1).', 'Résonateur stable (0 < g₁g₂ = ' + F(c.G, 3) + ' < 1).', 'Resonador estable (0 < g₁g₂ = ' + F(c.G, 3) + ' < 1).', 'Rezonator stabilny (0 < g₁g₂ = ' + F(c.G, 3) + ' < 1).') }
        : { tone: 'bad', text: T('Unstable: g₁g₂ = ' + F(c.G, 3) + ' is outside 0…1, no Gaussian eigenmode exists.', 'Нестійкий: g₁g₂ = ' + F(c.G, 3) + ' поза 0…1, гаусової власної моди не існує.', 'Instabil: g₁g₂ = ' + F(c.G, 3) + ' liegt außerhalb 0…1, es gibt keine gaußsche Eigenmode.', 'Instabiel: g₁g₂ = ' + F(c.G, 3) + ' ligt buiten 0…1, er bestaat geen Gaussische eigenmode.', 'Instable : g₁g₂ = ' + F(c.G, 3) + ' hors de 0…1, aucun mode propre gaussien n’existe.', 'Inestable: g₁g₂ = ' + F(c.G, 3) + ' fuera de 0…1, no existe modo propio gaussiano.', 'Niestabilny: g₁g₂ = ' + F(c.G, 3) + ' poza 0…1, nie istnieje gaussowski mod własny.') },
      tiles: tiles,
      notes: [T('g = 1 − L/R (concave R > 0, flat R = ∞). C confocal, P plane-parallel, S concentric. The cavity is empty; the medium index only scales λ and the free spectral range.', 'g = 1 − L/R (угнуте R > 0, плоске R = ∞). C — конфокальний, P — плоскопаралельний, S — концентричний. Резонатор порожній; показник заломлення середовища лише масштабує λ та вільний спектральний інтервал.', 'g = 1 − L/R (konkav R > 0, plan R = ∞). C konfokal, P planparallel, S konzentrisch. Der Resonator ist leer; der Brechungsindex skaliert nur λ und den freien Spektralbereich.', 'g = 1 − L/R (hol R > 0, vlak R = ∞). C confocaal, P vlakparallel, S concentrisch. De resonator is leeg; de brekingsindex schaalt alleen λ en het vrije spectrale bereik.', 'g = 1 − L/R (concave R > 0, plan R = ∞). C confocale, P plan-parallèle, S concentrique. La cavité est vide ; l’indice ne fait qu’échelonner λ et l’intervalle spectral libre.', 'g = 1 − L/R (cóncavo R > 0, plano R = ∞). C confocal, P plano-paralelo, S concéntrico. La cavidad está vacía; el índice solo escala λ y el rango espectral libre.', 'g = 1 − L/R (wklęsłe R > 0, płaskie R = ∞). C — konfokalny, P — płasko-równoległy, S — koncentryczny. Wnęka jest pusta; współczynnik załamania skaluje tylko λ i przedział dyspersji swobodnej.')]
    };
  }

      body: T('It follows a laser beam along its axis with the complex beam parameter q: through every lens, mirror and plate it tells you how wide the beam is, where its waists are and how long they stay small. Start with a preset, then edit the source and the element list; the mode selector adds mode matching, fibre coupling and cavity design.', 'Інструмент веде лазерний пучок уздовж осі за допомогою комплексного параметра q: крізь кожну лінзу, дзеркало й пластину він показує ширину пучка, положення перетяжок і як довго вони лишаються малими. Почніть із прикладу, потім змініть джерело та перелік елементів; перемикач режимів додає узгодження мод, введення у волокно і розрахунок резонатора.', 'Es verfolgt einen Laserstrahl entlang der Achse mit dem komplexen Strahlparameter q: durch jede Linse, jeden Spiegel und jede Platte zeigt es, wie breit der Strahl ist, wo seine Taillen liegen und wie lange sie klein bleiben. Beginnen Sie mit einem Beispiel und ändern Sie dann Quelle und Elementliste; der Moduswähler ergänzt Modenanpassung, Faserkopplung und Resonatorentwurf.', 'Het volgt een laserbundel langs de as met de complexe bundelparameter q: door elke lens, spiegel en plaat laat het zien hoe breed de bundel is, waar de tailles liggen en hoe lang ze klein blijven. Begin met een voorbeeld en pas dan bron en elementenlijst aan; de moduskeuze voegt modematching, vezelkoppeling en resonatorontwerp toe.', 'Il suit un faisceau laser le long de son axe avec le paramètre complexe q : à travers chaque lentille, miroir et lame, il indique la largeur du faisceau, la position de ses cols et la distance sur laquelle ils restent petits. Partez d’un exemple, puis modifiez la source et la liste d’éléments ; le sélecteur de mode ajoute l’adaptation de mode, le couplage dans une fibre et la conception de cavité.', 'Sigue un haz láser a lo largo de su eje con el parámetro complejo q: a través de cada lente, espejo y lámina indica lo ancho que es el haz, dónde están sus cinturas y cuánto tiempo permanecen pequeñas. Empiece con un ejemplo y luego edite la fuente y la lista de elementos; el selector de modo añade acoplamiento de modos, acoplo a fibra y diseño de cavidad.', 'Śledzi wiązkę laserową wzdłuż osi za pomocą zespolonego parametru q: przez każdą soczewkę, zwierciadło i płytkę pokazuje szerokość wiązki, położenie przewężeń i jak długo pozostają małe. Zacznij od przykładu, potem zmień źródło i listę elementów; przełącznik trybów dodaje dopasowanie modów, sprzęganie do światłowodu i projekt rezonatora.') },
    topics: {
      waist: { title: T('Waist and beam radius', 'Перетяжка й радіус пучка', 'Taille und Strahlradius', 'Taille en bundelstraal', 'Col et rayon du faisceau', 'Cintura y radio del haz', 'Przewężenie i promień wiązki'),
        body: T('w is the 1/e² intensity radius (for M² > 1 the second-moment radius of ISO 11146). The waist w₀ is where the wavefront is flat; around it w(z) = w₀√(1 + (z/z_R)²). A lens does not change w at its plane, only the curvature — so the new waist appears downstream.', 'w — радіус за рівнем інтенсивності 1/e² (для M² > 1 — радіус другого моменту за ISO 11146). Перетяжка w₀ — місце, де хвильовий фронт плаский; навколо неї w(z) = w₀√(1 + (z/z_R)²). Лінза не змінює w у своїй площині, лише кривину — тому нова перетяжка з’являється далі.', 'w ist der 1/e²-Intensitätsradius (für M² > 1 der Radius zweiter Momente nach ISO 11146). Die Taille w₀ ist dort, wo die Wellenfront eben ist; um sie gilt w(z) = w₀√(1 + (z/z_R)²). Eine Linse ändert w in ihrer Ebene nicht, nur die Krümmung — daher erscheint die neue Taille weiter stromab.', 'w is de straal bij 1/e² van de intensiteit (voor M² > 1 de tweede-momentstraal van ISO 11146). De taille w₀ is waar het golffront vlak is; daaromheen geldt w(z) = w₀√(1 + (z/z_R)²). Een lens verandert w in haar vlak niet, alleen de kromming — dus de nieuwe taille verschijnt verderop.', 'w est le rayon à 1/e² de l’intensité (pour M² > 1, le rayon du second moment de l’ISO 11146). Le col w₀ est l’endroit où le front d’onde est plan ; autour, w(z) = w₀√(1 + (z/z_R)²). Une lentille ne change pas w dans son plan, seulement la courbure — le nouveau col apparaît donc plus loin.', 'w es el radio a 1/e² de intensidad (para M² > 1, el radio de segundo momento de ISO 11146). La cintura w₀ es donde el frente de onda es plano; a su alrededor w(z) = w₀√(1 + (z/z_R)²). Una lente no cambia w en su plano, solo la curvatura — por eso la nueva cintura aparece más adelante.', 'w to promień przy natężeniu 1/e² (dla M² > 1 promień drugiego momentu wg ISO 11146). Przewężenie w₀ to miejsce, gdzie czoło fali jest płaskie; wokół niego w(z) = w₀√(1 + (z/z_R)²). Soczewka nie zmienia w w swojej płaszczyźnie, tylko krzywiznę — dlatego nowe przewężenie pojawia się dalej.') },
      rayleigh: { title: T('Rayleigh range', 'Довжина Релея', 'Rayleigh-Länge', 'Rayleigh-lengte', 'Longueur de Rayleigh', 'Longitud de Rayleigh', 'Długość Rayleigha'),
        body: T('z_R = π n w₀²/(M² λ): the distance over which the beam area doubles. Depth of focus is about 2 z_R. Because it grows with w₀², halving the spot quarters the depth of focus.', 'z_R = π n w₀²/(M² λ): відстань, на якій площа перерізу пучка подвоюється. Глибина фокуса ≈ 2 z_R. Оскільки вона зростає як w₀², зменшення плями вдвічі зменшує глибину фокуса вчетверо.', 'z_R = π n w₀²/(M² λ): die Strecke, auf der sich die Strahlfläche verdoppelt. Die Schärfentiefe beträgt etwa 2 z_R. Da sie mit w₀² wächst, viertelt ein halbierter Fleck die Schärfentiefe.', 'z_R = π n w₀²/(M² λ): de afstand waarover het bundeloppervlak verdubbelt. De scherptediepte is ongeveer 2 z_R. Omdat die met w₀² groeit, geeft een halve vlek een kwart scherptediepte.', 'z_R = π n w₀²/(M² λ) : la distance sur laquelle l’aire du faisceau double. La profondeur de champ vaut environ 2 z_R. Comme elle croît en w₀², diviser le spot par deux divise la profondeur de champ par quatre.', 'z_R = π n w₀²/(M² λ): la distancia en la que el área del haz se duplica. La profundidad de foco es unos 2 z_R. Como crece con w₀², reducir el punto a la mitad reduce la profundidad de foco a la cuarta parte.', 'z_R = π n w₀²/(M² λ): odległość, na której pole przekroju wiązki się podwaja. Głębia ostrości wynosi około 2 z_R. Ponieważ rośnie jak w₀², zmniejszenie plamki o połowę zmniejsza głębię ostrości czterokrotnie.') },
      m2: { title: T('Beam quality M²', 'Якість пучка M²', 'Strahlqualität M²', 'Bundelkwaliteit M²', 'Qualité de faisceau M²', 'Calidad de haz M²', 'Jakość wiązki M²'),
        body: T('M² compares a real beam with a perfect TEM00 Gaussian of the same waist: it diverges M² times faster. Through any lens the real beam behaves like a Gaussian of wavelength M²λ (Siegman’s embedded Gaussian), so the focused spot is M² times larger.', 'M² порівнює реальний пучок з ідеальним гаусовим TEM00 тієї ж перетяжки: він розходиться в M² разів швидше. Крізь будь-яку лінзу реальний пучок поводиться як гаусів із довжиною хвилі M²λ (вкладений гаусів пучок Зігмена), тож сфокусована пляма в M² разів більша.', 'M² vergleicht einen realen Strahl mit einem idealen TEM00-Gaußstrahl gleicher Taille: er divergiert M²-mal schneller. Durch jede Linse verhält sich der reale Strahl wie ein Gaußstrahl der Wellenlänge M²λ (Siegmans eingebetteter Gaußstrahl), daher ist der Fokus M²-mal größer.', 'M² vergelijkt een echte bundel met een ideale TEM00-Gaussische bundel met dezelfde taille: hij divergeert M² keer sneller. Door elke lens gedraagt de echte bundel zich als een Gaussische bundel met golflengte M²λ (de ingebedde Gaussische bundel van Siegman), dus de focus is M² keer groter.', 'M² compare un faisceau réel à un gaussien TEM00 parfait de même col : il diverge M² fois plus vite. À travers toute lentille, le faisceau réel se comporte comme un gaussien de longueur d’onde M²λ (gaussien enchâssé de Siegman), d’où un foyer M² fois plus grand.', 'M² compara un haz real con un gaussiano TEM00 perfecto de la misma cintura: diverge M² veces más rápido. A través de cualquier lente el haz real se comporta como un gaussiano de longitud de onda M²λ (gaussiano embebido de Siegman), así que el foco es M² veces mayor.', 'M² porównuje rzeczywistą wiązkę z idealną wiązką gaussowską TEM00 o tym samym przewężeniu: rozbiega się M² razy szybciej. Przez każdą soczewkę rzeczywista wiązka zachowuje się jak gaussowska o długości fali M²λ (osadzona wiązka gaussowska Siegmana), więc plamka ogniskowa jest M² razy większa.') },
      gouy: { title: T('Gouy phase', 'Фаза Гуї', 'Gouy-Phase', 'Gouy-fase', 'Phase de Gouy', 'Fase de Gouy', 'Faza Gouy’a'),
        body: T('Passing through a focus, a Gaussian beam picks up an extra π of phase compared with a plane wave: ψ = arctan(z/z_R). In a cavity the round-trip Gouy phase sets the spacing of the transverse modes.', 'Проходячи крізь фокус, гаусів пучок набирає додаткову фазу π порівняно з плоскою хвилею: ψ = arctan(z/z_R). У резонаторі фаза Гуї за повний обхід визначає відстань між поперечними модами.', 'Beim Durchgang durch einen Fokus sammelt ein Gaußstrahl gegenüber einer ebenen Welle zusätzlich π Phase: ψ = arctan(z/z_R). Im Resonator bestimmt die Gouy-Phase eines Umlaufs den Abstand der Transversalmoden.', 'Bij het passeren van een focus krijgt een Gaussische bundel een extra fase π ten opzichte van een vlakke golf: ψ = arctan(z/z_R). In een resonator bepaalt de Gouy-fase per rondgang de afstand van de transversale modes.', 'En traversant un foyer, un faisceau gaussien accumule une phase supplémentaire de π par rapport à une onde plane : ψ = arctan(z/z_R). Dans une cavité, la phase de Gouy d’un aller-retour fixe l’écart des modes transverses.', 'Al atravesar un foco, un haz gaussiano acumula una fase extra de π respecto a una onda plana: ψ = arctan(z/z_R). En una cavidad la fase de Gouy de ida y vuelta fija la separación de los modos transversales.', 'Przechodząc przez ognisko, wiązka gaussowska nabiera dodatkowej fazy π względem fali płaskiej: ψ = arctan(z/z_R). We wnęce faza Gouy’a na obieg wyznacza odstęp modów poprzecznych.') },
      selffocus: { title: T('Focusing by a lens (Self 1983)', 'Фокусування лінзою (Self 1983)', 'Fokussierung durch eine Linse (Self 1983)', 'Focussering door een lens (Self 1983)', 'Focalisation par une lentille (Self 1983)', 'Enfoque con una lente (Self 1983)', 'Ogniskowanie soczewką (Self 1983)'),
        body: T('A Gaussian waist is not imaged like a point: 1/(s + z_R²/(s − f)) + 1/s″ = 1/f, i.e. s″ − f = f²(s − f)/((s − f)² + z_R²). The new waist lies between the focal plane and the geometric image: on the focal plane when z_R ≫ |s − f| (collimated input), close to the geometric image when z_R ≪ |s − f|; its distance from the focal plane is largest, f²/(2z_R), when z_R = |s − f|. The far-field estimate w ≈ M²λf/(πw_lens) is the limit of a collimated beam. In a medium of index n, λ becomes λ/n.', 'Гаусова перетяжка відображається не як точка: 1/(s + z_R²/(s − f)) + 1/s″ = 1/f, тобто s″ − f = f²(s − f)/((s − f)² + z_R²). Нова перетяжка лежить між фокальною площиною та геометричним зображенням: у фокальній площині, коли z_R ≫ |s − f| (колімований пучок), поблизу геометричного зображення, коли z_R ≪ |s − f|; найдалі від фокальної площини, на f²/(2z_R), вона при z_R = |s − f|. Оцінка дальнього поля w ≈ M²λf/(πw_лінзи) — границя для колімованого пучка. У середовищі з показником n замість λ береться λ/n.', 'Eine Gaußtaille wird nicht wie ein Punkt abgebildet: 1/(s + z_R²/(s − f)) + 1/s″ = 1/f, also s″ − f = f²(s − f)/((s − f)² + z_R²). Die neue Taille liegt zwischen Brennebene und geometrischem Bild: in der Brennebene, wenn z_R ≫ |s − f| (kollimierter Strahl), nahe dem geometrischen Bild, wenn z_R ≪ |s − f|; am weitesten von der Brennebene entfernt, um f²/(2z_R), ist sie bei z_R = |s − f|. Die Fernfeldschätzung w ≈ M²λf/(πw_Linse) ist der Grenzfall eines kollimierten Strahls. In einem Medium mit Brechungsindex n tritt λ/n an die Stelle von λ.', 'Een Gaussische taille wordt niet als een punt afgebeeld: 1/(s + z_R²/(s − f)) + 1/s″ = 1/f, dus s″ − f = f²(s − f)/((s − f)² + z_R²). De nieuwe taille ligt tussen het brandvlak en het geometrische beeld: in het brandvlak als z_R ≫ |s − f| (gecollimeerde bundel), dicht bij het geometrische beeld als z_R ≪ |s − f|; het verst van het brandvlak, f²/(2z_R), ligt ze bij z_R = |s − f|. De verreveldschatting w ≈ M²λf/(πw_lens) is de limiet voor een gecollimeerde bundel. In een medium met brekingsindex n wordt λ vervangen door λ/n.', 'Un col gaussien ne s’image pas comme un point : 1/(s + z_R²/(s − f)) + 1/s″ = 1/f, soit s″ − f = f²(s − f)/((s − f)² + z_R²). Le nouveau col se trouve entre le plan focal et l’image géométrique : dans le plan focal si z_R ≫ |s − f| (faisceau collimaté), près de l’image géométrique si z_R ≪ |s − f| ; il s’écarte le plus du plan focal, de f²/(2z_R), pour z_R = |s − f|. L’estimation en champ lointain w ≈ M²λf/(πw_lentille) est la limite d’un faisceau collimaté. Dans un milieu d’indice n, λ devient λ/n.', 'Una cintura gaussiana no se forma como la imagen de un punto: 1/(s + z_R²/(s − f)) + 1/s″ = 1/f, es decir, s″ − f = f²(s − f)/((s − f)² + z_R²). La nueva cintura queda entre el plano focal y la imagen geométrica: en el plano focal si z_R ≫ |s − f| (haz colimado), cerca de la imagen geométrica si z_R ≪ |s − f|; se aleja más del plano focal, f²/(2z_R), cuando z_R = |s − f|. La estimación de campo lejano w ≈ M²λf/(πw_lente) es el límite de un haz colimado. En un medio de índice n, λ pasa a ser λ/n.', 'Przewężenie gaussowskie nie jest odwzorowywane jak punkt: 1/(s + z_R²/(s − f)) + 1/s″ = 1/f, czyli s″ − f = f²(s − f)/((s − f)² + z_R²). Nowe przewężenie leży między płaszczyzną ogniskową a obrazem geometrycznym: w płaszczyźnie ogniskowej, gdy z_R ≫ |s − f| (wiązka skolimowana), blisko obrazu geometrycznego, gdy z_R ≪ |s − f|; najdalej od płaszczyzny ogniskowej, o f²/(2z_R), jest przy z_R = |s − f|. Oszacowanie pola dalekiego w ≈ M²λf/(πw_soczewki) to granica dla wiązki skolimowanej. W ośrodku o współczynniku n zamiast λ bierze się λ/n.') },
      modematch: { title: T('Mode matching', 'Узгодження мод', 'Modenanpassung', 'Modematching', 'Adaptation de mode', 'Acoplamiento de modos', 'Dopasowanie modów'),
        body: T('To feed a cavity, fibre or crystal, the beam must arrive with the right waist size at the right place. One lens can do it only for special distances; two lenses usually can, often in several ways, if the focal lengths and the free length allow. The solver searches all pairs from the chosen focal-length list and ranks the exact solutions by how much efficiency survives a 1 mm error of either lens, then by the shorter path.', 'Щоб ввести пучок у резонатор, волокно чи кристал, він має прийти з потрібною перетяжкою в потрібне місце. Одна лінза може це лише за певних відстаней; дві зазвичай можуть, часто кількома способами, якщо дозволяють фокусні відстані й вільна довжина. Розв’язувач перебирає всі пари з вибраного переліку фокусних відстаней і впорядковує точні рішення за тим, скільки ефективності лишається при похибці 1 мм будь-якої з лінз, а далі — за коротшим шляхом.', 'Um einen Resonator, eine Faser oder einen Kristall zu speisen, muss der Strahl mit der richtigen Taille am richtigen Ort ankommen. Eine Linse schafft das nur bei bestimmten Abständen; zwei Linsen meist schon, oft auf mehrere Arten, wenn Brennweiten und freie Länge es zulassen. Der Löser prüft alle Paare der gewählten Brennweitenliste und ordnet die exakten Lösungen danach, wie viel Wirkungsgrad bei 1 mm Fehler einer der beiden Linsen bleibt, dann nach kürzerem Weg.', 'Om een resonator, vezel of kristal te voeden moet de bundel met de juiste taille op de juiste plek aankomen. Eén lens lukt dat alleen bij bepaalde afstanden; twee lenzen meestal wel, vaak op meerdere manieren, als de brandpuntsafstanden en de vrije lengte het toelaten. De oplosser probeert alle paren uit de gekozen lijst en rangschikt de exacte oplossingen naar het rendement dat overblijft bij 1 mm fout van een van beide lenzen, daarna naar de kortere weg.', 'Pour injecter une cavité, une fibre ou un cristal, le faisceau doit arriver avec le bon col au bon endroit. Une lentille n’y parvient qu’à certaines distances ; deux lentilles le peuvent en général, souvent de plusieurs façons, si les focales et la longueur libre le permettent. Le solveur essaie toutes les paires de la liste choisie et classe les solutions exactes selon le rendement conservé pour une erreur de 1 mm de l’une ou l’autre lentille, puis par trajet plus court.', 'Para alimentar una cavidad, fibra o cristal, el haz debe llegar con la cintura correcta al lugar correcto. Una lente lo logra solo a ciertas distancias; dos lentes normalmente sí, a menudo de varias formas, si las focales y la longitud libre lo permiten. El solucionador prueba todos los pares de la lista elegida y ordena las soluciones exactas por la eficiencia que queda con un error de 1 mm de cualquiera de las dos lentes y después por el trayecto más corto.', 'Aby zasilić rezonator, światłowód lub kryształ, wiązka musi dotrzeć z właściwym przewężeniem we właściwe miejsce. Jedna soczewka potrafi to tylko przy określonych odległościach; dwie zwykle tak, często na kilka sposobów, jeśli pozwalają na to ogniskowe i wolna długość. Solwer sprawdza wszystkie pary z wybranej listy i porządkuje dokładne rozwiązania według sprawności pozostałej przy błędzie 1 mm dowolnej z soczewek, a potem według krótszej drogi.') },
      overlap: { title: T('Overlap efficiency', 'Ефективність перекриття', 'Überlappwirkungsgrad', 'Overlaprendement', 'Rendement de recouvrement', 'Eficiencia de solapamiento', 'Sprawność nakładania'),
        body: T('The power coupled into a mode is |∫E₁E₂*|² normalised. For two Gaussians on one plane η = 4/((w₁/w₂ + w₂/w₁)² + (πw₁w₂/λ)²(1/R₁ − 1/R₂)²); a lateral offset d adds exp(−2d²/(w₁² + w₂²)). Size mismatch is forgiving, offset is not.', 'Потужність, що потрапляє в моду, — нормований |∫E₁E₂*|². Для двох гаусових пучків в одній площині η = 4/((w₁/w₂ + w₂/w₁)² + (πw₁w₂/λ)²(1/R₁ − 1/R₂)²); поперечний зсув d додає множник exp(−2d²/(w₁² + w₂²)). Невідповідність розміру прощається, зсув — ні.', 'Die in eine Mode gekoppelte Leistung ist das normierte |∫E₁E₂*|². Für zwei Gaußstrahlen in einer Ebene gilt η = 4/((w₁/w₂ + w₂/w₁)² + (πw₁w₂/λ)²(1/R₁ − 1/R₂)²); ein lateraler Versatz d fügt exp(−2d²/(w₁² + w₂²)) hinzu. Größenfehler verzeihen viel, Versatz nicht.', 'Het in een mode gekoppelde vermogen is de genormeerde |∫E₁E₂*|². Voor twee Gaussische bundels in één vlak geldt η = 4/((w₁/w₂ + w₂/w₁)² + (πw₁w₂/λ)²(1/R₁ − 1/R₂)²); een laterale verschuiving d voegt exp(−2d²/(w₁² + w₂²)) toe. Grootteverschil is vergeeflijk, verschuiving niet.', 'La puissance couplée dans un mode est le |∫E₁E₂*|² normalisé. Pour deux gaussiens dans un même plan, η = 4/((w₁/w₂ + w₂/w₁)² + (πw₁w₂/λ)²(1/R₁ − 1/R₂)²) ; un décalage latéral d ajoute exp(−2d²/(w₁² + w₂²)). L’écart de taille pardonne, le décalage non.', 'La potencia acoplada a un modo es el |∫E₁E₂*|² normalizado. Para dos gaussianos en un mismo plano η = 4/((w₁/w₂ + w₂/w₁)² + (πw₁w₂/λ)²(1/R₁ − 1/R₂)²); un desplazamiento lateral d añade exp(−2d²/(w₁² + w₂²)). La diferencia de tamaño perdona, el desplazamiento no.', 'Moc sprzężona do modu to unormowane |∫E₁E₂*|². Dla dwóch wiązek gaussowskich w jednej płaszczyźnie η = 4/((w₁/w₂ + w₂/w₁)² + (πw₁w₂/λ)²(1/R₁ − 1/R₂)²); przesunięcie poprzeczne d dodaje exp(−2d²/(w₁² + w₂²)). Niedopasowanie rozmiaru jest wyrozumiałe, przesunięcie — nie.') },
      iso: { title: T('ISO 11146 beam measurement', 'Вимірювання пучка за ISO 11146', 'Strahlvermessung nach ISO 11146', 'Bundelmeting volgens ISO 11146', 'Mesure de faisceau selon l’ISO 11146', 'Medición de haz según ISO 11146', 'Pomiar wiązki wg ISO 11146'),
        body: T('Measure second-moment (D4σ) diameters at ten or more planes, half within one Rayleigh range of the waist and half beyond two, and fit d²(z) = a + bz + cz². The fit gives the waist, its position and M² = π w₀ θ/λ. A single knife-edge or 1/e² width is not the ISO diameter for non-Gaussian profiles.', 'Виміряйте діаметри за другими моментами (D4σ) щонайменше в десяти площинах — половину в межах однієї довжини Релея від перетяжки, половину далі двох — і апроксимуйте d²(z) = a + bz + cz². Апроксимація дає перетяжку, її положення та M² = π w₀ θ/λ. Ширина за ножем чи на рівні 1/e² не є діаметром ISO для негаусових профілів.', 'Messen Sie Durchmesser zweiter Momente (D4σ) in mindestens zehn Ebenen, die Hälfte innerhalb einer Rayleigh-Länge um die Taille und die Hälfte jenseits von zwei, und passen Sie d²(z) = a + bz + cz² an. Der Fit liefert Taille, Lage und M² = π w₀ θ/λ. Eine Messerschneiden- oder 1/e²-Breite ist für nicht-gaußförmige Profile nicht der ISO-Durchmesser.', 'Meet tweede-momentdiameters (D4σ) in tien of meer vlakken, de helft binnen één Rayleigh-lengte van de taille en de helft voorbij twee, en fit d²(z) = a + bz + cz². De fit geeft de taille, haar positie en M² = π w₀ θ/λ. Een mesrand- of 1/e²-breedte is voor niet-Gaussische profielen niet de ISO-diameter.', 'Mesurez des diamètres au second moment (D4σ) en dix plans ou plus, la moitié à moins d’une longueur de Rayleigh du col et la moitié au-delà de deux, puis ajustez d²(z) = a + bz + cz². L’ajustement donne le col, sa position et M² = π w₀ θ/λ. Une largeur au couteau ou à 1/e² n’est pas le diamètre ISO pour un profil non gaussien.', 'Mida diámetros de segundo momento (D4σ) en diez o más planos, la mitad dentro de una longitud de Rayleigh de la cintura y la mitad más allá de dos, y ajuste d²(z) = a + bz + cz². El ajuste da la cintura, su posición y M² = π w₀ θ/λ. Un ancho de cuchilla o a 1/e² no es el diámetro ISO para perfiles no gaussianos.', 'Zmierz średnice drugiego momentu (D4σ) w co najmniej dziesięciu płaszczyznach — połowę w obrębie jednej długości Rayleigha od przewężenia, połowę dalej niż dwie — i dopasuj d²(z) = a + bz + cz². Dopasowanie daje przewężenie, jego położenie i M² = π w₀ θ/λ. Szerokość metodą ostrza lub przy 1/e² nie jest średnicą ISO dla profili niegaussowskich.') },
      stability: { title: T('Resonator stability', 'Стійкість резонатора', 'Resonatorstabilität', 'Resonatorstabiliteit', 'Stabilité du résonateur', 'Estabilidad del resonador', 'Stabilność rezonatora'),
        body: T('With g = 1 − L/R for each mirror, a Gaussian mode repeats itself after a round trip only if 0 < g₁g₂ < 1 (shaded). Near the edges (plane-parallel, concentric) the mode size on the mirrors diverges and the cavity becomes hypersensitive to length and tilt.', 'Для g = 1 − L/R кожного дзеркала гаусова мода відтворюється після обходу лише при 0 < g₁g₂ < 1 (заштрихована область). Біля меж (плоскопаралельний, концентричний) розмір моди на дзеркалах необмежено зростає, а резонатор стає надчутливим до довжини й нахилу.', 'Mit g = 1 − L/R je Spiegel reproduziert sich eine Gaußmode nach einem Umlauf nur für 0 < g₁g₂ < 1 (schattiert). An den Rändern (planparallel, konzentrisch) wächst die Modengröße auf den Spiegeln über alle Grenzen, und der Resonator wird überempfindlich gegen Länge und Verkippung.', 'Met g = 1 − L/R per spiegel herhaalt een Gaussische mode zich na een rondgang alleen als 0 < g₁g₂ < 1 (gearceerd). Bij de randen (vlakparallel, concentrisch) groeit de modegrootte op de spiegels onbeperkt en wordt de resonator overgevoelig voor lengte en kanteling.', 'Avec g = 1 − L/R pour chaque miroir, un mode gaussien ne se reproduit après un aller-retour que si 0 < g₁g₂ < 1 (zone grisée). Près des bords (plan-parallèle, concentrique), la taille du mode sur les miroirs diverge et la cavité devient hypersensible à la longueur et à l’inclinaison.', 'Con g = 1 − L/R para cada espejo, un modo gaussiano se reproduce tras una ida y vuelta solo si 0 < g₁g₂ < 1 (sombreado). Cerca de los bordes (plano-paralelo, concéntrico) el tamaño del modo en los espejos diverge y la cavidad se vuelve hipersensible a la longitud y la inclinación.', 'Przy g = 1 − L/R dla każdego zwierciadła mod gaussowski odtwarza się po obiegu tylko dla 0 < g₁g₂ < 1 (obszar zacieniowany). Przy granicach (płasko-równoległy, koncentryczny) rozmiar modu na zwierciadłach rośnie bez ograniczeń, a wnęka staje się nadwrażliwa na długość i pochylenie.') },
      astig: { title: T('Astigmatism x / y', 'Астигматизм x / y', 'Astigmatismus x / y', 'Astigmatisme x / y', 'Astigmatisme x / y', 'Astigmatismo x / y', 'Astygmatyzm x / y'),
        body: T('x is the plane of a folded path (tangential), y is perpendicular (sagittal). A curved mirror hit at angle θ focuses with f·cosθ in x and f/cosθ in y; a cylindrical lens acts on one axis only. Diode lasers start astigmatic: give x and y their own waists.', 'x — площина згину ходу променів (меридіональна), y — перпендикулярна (сагітальна). Сферичне дзеркало під кутом θ фокусує з f·cosθ по x і f/cosθ по y; циліндрична лінза діє лише вздовж однієї осі. Діодні лазери астигматичні від початку: задайте x та y окремі перетяжки.', 'x ist die Ebene eines gefalteten Strahlengangs (tangential), y senkrecht dazu (sagittal). Ein unter θ getroffener Hohlspiegel fokussiert mit f·cosθ in x und f/cosθ in y; eine Zylinderlinse wirkt nur auf eine Achse. Diodenlaser sind von Haus aus astigmatisch: geben Sie x und y eigene Taillen.', 'x is het vlak van een gevouwen pad (tangentiaal), y staat er loodrecht op (sagittaal). Een holle spiegel onder hoek θ focusseert met f·cosθ in x en f/cosθ in y; een cilinderlens werkt op één as. Diodelasers zijn van nature astigmatisch: geef x en y elk een eigen taille.', 'x est le plan d’un trajet replié (tangentiel), y lui est perpendiculaire (sagittal). Un miroir concave attaqué sous l’angle θ focalise avec f·cosθ en x et f/cosθ en y ; une lentille cylindrique n’agit que sur un axe. Les diodes laser sont astigmates d’origine : donnez à x et y leurs propres cols.', 'x es el plano de un trayecto plegado (tangencial), y es perpendicular (sagital). Un espejo cóncavo iluminado con ángulo θ enfoca con f·cosθ en x y f/cosθ en y; una lente cilíndrica actúa en un solo eje. Los diodos láser son astigmáticos de origen: dé a x e y su propia cintura.', 'x to płaszczyzna załamanego biegu wiązki (południkowa), y — prostopadła (strzałkowa). Zwierciadło wklęsłe oświetlone pod kątem θ ogniskuje z f·cosθ w x i f/cosθ w y; soczewka cylindryczna działa tylko w jednej osi. Lasery diodowe są astygmatyczne z natury: nadaj x i y osobne przewężenia.') },
      elements: { title: T('Elements along the axis', 'Елементи вздовж осі', 'Elemente entlang der Achse', 'Elementen langs de as', 'Éléments le long de l’axe', 'Elementos a lo largo del eje', 'Elementy wzdłuż osi'),
        body: T('Each row is a thin element at position z (mm). f is the focal length (negative = diverging; for a curved mirror f = R/2). A plate of thickness t and index n moves the following waist by t(1 − 1/n). Ø is the clear aperture: if less than 99 % of the power passes, the row turns red. f is the focal length the element has in the medium it sits in: a collimated beam focuses a distance f behind it. A glass lens rated for air has a longer f in water — enter the in-medium value.', 'Кожен рядок — тонкий елемент у положенні z (мм). f — фокусна відстань (від’ємна — розсіювальна; для сферичного дзеркала f = R/2). Пластина товщиною t з показником n зсуває наступну перетяжку на t(1 − 1/n). Ø — світловий діаметр: якщо проходить менше 99 % потужності, рядок стає червоним. f — фокусна відстань елемента в тому середовищі, де він стоїть: колімований пучок фокусується на відстані f за ним. Скляна лінза з паспортною f для повітря у воді має довшу f — уводьте значення для середовища.', 'Jede Zeile ist ein dünnes Element an der Lage z (mm). f ist die Brennweite (negativ = zerstreuend; für einen Hohlspiegel f = R/2). Eine Platte der Dicke t mit Index n verschiebt die folgende Taille um t(1 − 1/n). Ø ist die freie Öffnung: passieren weniger als 99 % der Leistung, wird die Zeile rot. f ist die Brennweite des Elements in dem Medium, in dem es sitzt: ein kollimierter Strahl fokussiert im Abstand f dahinter. Eine Glaslinse mit Luft-Brennweite hat in Wasser ein längeres f — geben Sie den Wert im Medium ein.', 'Elke rij is een dun element op positie z (mm). f is de brandpuntsafstand (negatief = verstrooiend; voor een holle spiegel f = R/2). Een plaat van dikte t en index n verschuift de volgende taille met t(1 − 1/n). Ø is de vrije opening: gaat minder dan 99 % van het vermogen door, dan kleurt de rij rood. f is de brandpuntsafstand van het element in het medium waarin het staat: een gecollimeerde bundel focust op afstand f erachter. Een glazen lens met een f voor lucht heeft in water een langere f — vul de waarde in het medium in.', 'Chaque ligne est un élément mince à la position z (mm). f est la focale (négative = divergente ; pour un miroir sphérique f = R/2). Une lame d’épaisseur t et d’indice n décale le col suivant de t(1 − 1/n). Ø est l’ouverture utile : si moins de 99 % de la puissance passe, la ligne devient rouge. f est la focale de l’élément dans le milieu où il se trouve : un faisceau collimaté focalise à la distance f derrière lui. Une lentille de verre spécifiée dans l’air a une focale plus longue dans l’eau — saisissez la valeur dans le milieu.', 'Cada fila es un elemento delgado en la posición z (mm). f es la focal (negativa = divergente; para un espejo esférico f = R/2). Una lámina de espesor t e índice n desplaza la cintura siguiente t(1 − 1/n). Ø es la apertura libre: si pasa menos del 99 % de la potencia, la fila se vuelve roja. f es la focal del elemento en el medio donde está: un haz colimado enfoca a la distancia f detrás de él. Una lente de vidrio especificada en aire tiene una f más larga en agua: introduzca el valor en el medio.', 'Każdy wiersz to cienki element w położeniu z (mm). f to ogniskowa (ujemna = rozpraszająca; dla zwierciadła sferycznego f = R/2). Płytka o grubości t i współczynniku n przesuwa następne przewężenie o t(1 − 1/n). Ø to apertura czynna: jeśli przechodzi mniej niż 99 % mocy, wiersz zmienia kolor na czerwony. f to ogniskowa elementu w ośrodku, w którym stoi: wiązka skolimowana skupia się w odległości f za nim. Szklana soczewka o ogniskowej podanej dla powietrza ma w wodzie dłuższą f — wpisz wartość dla ośrodka.') }

      render: function (box, ctx) {
        if (!window.OptCore || !OptCore.ui || !OptCore.ui.projectBar) return;
        if (bar) { try { bar.destroy(); } catch (e) {} }
        bar = OptCore.ui.projectBar({ mount: box, toolId: 'gaussbeam', lang: function () { return ctx.app.lang; }, onUse: useModule });
      },
      actions: [{ label: T('Save beam to project', 'Зберегти пучок у проєкт', 'Strahl im Projekt speichern', 'Bundel in project opslaan', 'Enregistrer le faisceau dans le projet', 'Guardar el haz en el proyecto', 'Zapisz wiązkę w projekcie'), run: saveToProject }, { label: UMSG.restore, variant: 'ghost', run: restoreOwn }] });

    ui.examples(PRESETS.map(function (p) { return { id: p.id, label: p.label, note: p.note, apply: applyPreset(p) }; }));

    ui.stage({ key: 'main',
      caption: T('Beam radius along the axis (x solid, y dashed)', 'Радіус пучка вздовж осі (x — суцільна, y — штрихова)', 'Strahlradius entlang der Achse (x durchgezogen, y gestrichelt)', 'Bundelstraal langs de as (x doorgetrokken, y gestippeld)', 'Rayon du faisceau le long de l’axe (x trait plein, y pointillé)', 'Radio del haz a lo largo del eje (x continuo, y discontinuo)', 'Promień wiązki wzdłuż osi (x ciągła, y przerywana)'),
      minHeight: 300,
      a11y: function () {
        if (!last || last.err) return '';
        var lang = lg();
        if (last.mode === 'cavity') {
          var g1 = F(last.cav.g1, 3), g2 = F(last.cav.g2, 3), st = last.cav.stable;
          return T('Stability diagram: g₁ = ' + g1 + ', g₂ = ' + g2 + ', ' + (st ? 'stable' : 'unstable') + '.', 'Діаграма стійкості: g₁ = ' + g1 + ', g₂ = ' + g2 + ', ' + (st ? 'стійкий' : 'нестійкий') + '.',
            'Stabilitätsdiagramm: g₁ = ' + g1 + ', g₂ = ' + g2 + ', ' + (st ? 'stabil' : 'instabil') + '.', 'Stabiliteitsdiagram: g₁ = ' + g1 + ', g₂ = ' + g2 + ', ' + (st ? 'stabiel' : 'instabiel') + '.',
            'Diagramme de stabilité : g₁ = ' + g1 + ', g₂ = ' + g2 + ', ' + (st ? 'stable' : 'instable') + '.', 'Diagrama de estabilidad: g₁ = ' + g1 + ', g₂ = ' + g2 + ', ' + (st ? 'estable' : 'inestable') + '.',
            'Wykres stabilności: g₁ = ' + g1 + ', g₂ = ' + g2 + ', ' + (st ? 'stabilny' : 'niestabilny') + '.')[lang];
        }
        var a = L(last.out.x.w0), b = F(last.out.x.z0 * 1000, 1);
        return T('Beam radius along z. Final waist ' + a + ' at ' + b + ' mm.', 'Радіус пучка вздовж z. Кінцева перетяжка ' + a + ' при ' + b + ' мм.', 'Strahlradius entlang z. Letzte Taille ' + a + ' bei ' + b + ' mm.',
          'Bundelstraal langs z. Laatste taille ' + a + ' bij ' + b + ' mm.', 'Rayon du faisceau le long de z. Dernier col ' + a + ' à ' + b + ' mm.', 'Radio del haz a lo largo de z. Última cintura ' + a + ' en ' + b + ' mm.',
          'Promień wiązki wzdłuż z. Ostatnie przewężenie ' + a + ' przy ' + b + ' mm.')[lang];
      },
      render: function (size, st) { draw(st.canvas(), size.w, size.h, size.density === 'coarse', tokens()); }
    });
    ui.ready();
    window.__gaussbeam = { ui: ui, state: state, sanitize: sanitize, fromProject: fromProject, useModule: useModule, restoreOwn: restoreOwn, openCase: openCase, caseFromFile: caseFromFile, saveToProject: saveToProject, projectPayload: projectPayload, get bar() { return bar; }, get last() { return last; }, solve: solve, csv: csvText, svg: function () { var c = svgContext(1200, 600); draw(c, 1200, 600, false, PRINT_TK); return c.toString(); }, presets: PRESETS.map(function (p) { return p.id; }) };
  }

  function installData() {
    if (!window.Diagram) return;
    Diagram.init({
      id: 'gaussbeam', file: 'gaussbeam.html',
      state: {
        serialize: function () { return state; },
        deserialize: function (o) {                    /* share link: same validation as a file (review R-7, R-9) */
          var v = sanitize(o || {});
          if (v.bad.length) { var msg = UMSG.refused[lg()] + v.bad.join('; '); if (ui) ui.notify(msg, { kind: 'bad' }); else if (Diagram.notify) Diagram.notify(msg, 'err'); return; }
          applyState(v.st); if (G) last = solve(state); if (ui) { ui.sync(); ui.run(); }
        }
      },
      record: function () {
        if (!last || last.err) return null;
        var inputs = { mode: state.mode, lambda_nm: state.lambda_nm, n0: state.n0, source: state.src, w0x_m: last.B.x.w0, z0x_m: last.B.x.z0, M2x: last.B.x.M2, w0y_m: last.B.y.w0, z0y_m: last.B.y.z0, M2y: last.B.y.M2 };
        var outputs = {}, units = { lambda_nm: 'nm', w0x_m: 'm', z0x_m: 'm', w0y_m: 'm', z0y_m: 'm' };
        if (last.mode === 'cavity') {
          var c = last.cav; Object.assign(inputs, { R1_m: state.R1flat ? 'inf' : state.R1_mm / 1000, R2_m: state.R2flat ? 'inf' : state.R2_mm / 1000, L_m: state.L_mm / 1000, n: state.cn });
          Object.assign(outputs, { g1: c.g1, g2: c.g2, g1g2: c.G, stable: c.stable, w0_m: c.w0, w1_m: c.w1, w2_m: c.w2, z_waist_from_M1_m: c.z1, FSR_Hz: c.FSR, transverse_spacing_Hz: c.dnuT });
          Object.assign(units, { R1_m: 'm', R2_m: 'm', L_m: 'm', w0_m: 'm', w1_m: 'm', w2_m: 'm', z_waist_from_M1_m: 'm', FSR_Hz: 'Hz', transverse_spacing_Hz: 'Hz' });
        } else {
          inputs.elements = JSON.stringify(state.elements);
          var o = last.out;
          Object.assign(outputs, { final_waist_x_m: o.x.w0, final_waist_x_z_m: o.x.z0, final_zR_x_m: o.x.zR, final_div_full_x_rad: 2 * o.x.theta, final_waist_y_m: o.y.w0, final_waist_y_z_m: o.y.z0 });
          Object.assign(units, { final_waist_x_m: 'm', final_waist_x_z_m: 'm', final_zR_x_m: 'm', final_div_full_x_rad: 'rad', final_waist_y_m: 'm', final_waist_y_z_m: 'm' });
          if (last.fib) Object.assign(outputs, { coupling_eta: last.fib.eta, coupling_eta_aligned: last.fib.eta0, offset_1dB_m: last.fib.d1dB, tilt_1dB_rad: last.fib.t1dB });
          if (last.match) outputs.match_solutions = JSON.stringify(last.match.map(function (m) { return { f1: m.f1, z1: m.x1, f2: m.f2, z2: m.x2, eta_lens1_plus1mm: m.eta1mmL1, eta_lens2_plus1mm: m.eta1mm }; }));
          if (last.match) outputs.match_solutions_total = last.matchTotal;
          if (last.B.fit && last.B.fit.ok) Object.assign(outputs, { fit_M2: last.B.fit.M2, fit_iso_plan_ok: last.B.fit.isoOk });
        }
        return {
          inputs: inputs, outputs: outputs, units: units,
          model: { equations: ['1/q = n/R - i M2 lambda/(pi w^2) (reduced q = q/n)', "q' = (A q + B)/(C q + D)", 'zR = pi n w0^2/(M2 lambda)', 'eta = |int E1 E2*|^2 / (int|E1|^2 int|E2|^2)', 'g = 1 - L/R, stable 0 < g1 g2 < 1'],
                   ranges: ['paraxial (divergence half-angle < 0.25 rad)', 'thin aberration-free elements, simple astigmatism'],
                   notes: ['Siegman, Lasers (1986); Kogelnik & Li, Appl. Opt. 5 (1966) 1550; Self, Appl. Opt. 22 (1983) 658; ISO 11146-1'] },
          warnings: (last.prop ? last.prop.warnings.map(function (w) { return w.code + (w.id ? ' ' + w.id : ''); }) : []).concat(last.warn)
        };
      }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
