path","Траєкторія продовження","Fortsetzungspfad","Voortzettingspad","Chemin de continuation","Trayectoria de continuación","Ścieżka kontynuacji"],"factor":["factor","множник","Faktor","factor","facteur","factor","mnożnik"],"max free DOF":["max free DOF","макс. вільна СС","max. freier FG","max. vrije VG","DDL libre max.","GDL libre máx.","maks. swobodny DOF"],"PCG it.":["PCG it.","іт. PCG","PCG-Iter.","PCG-it.","it. PCG","it. PCG","iter. PCG"],"residual":["residual","нев’язка","Residuum","residu","résidu","residuo","residuum"],"Member envelope at target":["Member envelope at target","Огинаюча елементів при цілі","Stabhüllkurve am Ziel","Staafomhullende bij doel","Enveloppe des barres à la cible","Envolvente de barras en objetivo","Obwiednia prętów dla celu"],"Reactions and spring forces":["Reactions and spring forces","Реакції та сили пружин","Reaktionen und Federkräfte","Reacties en veerkrachten","Réactions et forces de ressort","Reacciones y fuerzas de resortes","Reakcje i siły sprężyn"],"Member envelope in active set":["Member envelope in active set","Огинаюча елементів в активному наборі","Stabhüllkurve im aktiven Satz","Staafomhullende in actieve set","Enveloppe des barres dans le jeu actif","Envolvente de barras en conjunto activo","Obwiednia prętów w aktywnym zestawie"],"Analysis scope":["Analysis scope","Область аналізу","Analyseumfang","Analysebereik","Domaine d’analyse","Alcance del análisis","Zakres analizy"],"Linear static + P–Δ second-order + modal + eigenvalue buckling planar frame FEM":["Linear static + P–Δ second-order + modal + eigenvalue buckling planar frame FEM","МКЕ плоских рам: лінійна статика + P–Δ II порядку + модальний аналіз + власна стійкість","FEM ebener Rahmen: linear statisch + P–Δ II. Ordnung + modal + Eigenwertknicken","FEM van vlakke raamwerken: lineair statisch + P–Δ tweede orde + modaal + eigenwaarde-knik","EF de portiques plans : statique linéaire + P–Δ second ordre + modal + flambement aux valeurs propres","FEM de pórticos planos: estática lineal + P–Δ de segundo orden + modal + pandeo por autovalores","MES ram płaskich: statyka liniowa + P–Δ II rzędu + modalna + wyboczenie własne"],"Linear static, initial-stress P–Δ continuation, undamped modal analysis and linear eigenvalue buckling are implemented. Static and modal analyses support member end-moment releases. Corotational large-displacement/material-nonlinear analysis remains outside this tool.":["Linear static, initial-stress P–Δ continuation, undamped modal analysis and linear eigenvalue buckling are implemented. Static and modal analyses support member end-moment releases. Corotational large-displacement/material-nonlinear analysis remains outside this tool.","Реалізовано лінійну статику, P–Δ з початковою геометричною жорсткістю, недемпфований модальний аналіз і лінійну власну стійкість. Статика й модальний режим підтримують шарнірні звільнення кінцевого моменту. Коротаційний розрахунок великих переміщень і матеріальна нелінійність не входять до цієї тулзи.","Implementiert sind lineare Statik, P–Δ-Fortsetzung mit Anfangsspannungssteifigkeit, ungedämpfte Modalanalyse und lineares Eigenwertknicken. Statik und Modal unterstützen Endmomentfreigaben. Korotationale Großverformungs- und Materialnichtlinearität gehören nicht zu diesem Werkzeug.","Lineaire statica, initial-stress P–Δ-voortzetting, ongedempte modale analyse en lineaire eigenwaarde-knik zijn geïmplementeerd. Statica en modaal ondersteunen eindmomentvrijgaven. Corotationele grote-verplaatsings- en materiaalnietlineariteit vallen buiten deze tool.","La statique linéaire, la continuation P–Δ par rigidité géométrique initiale, l’analyse modale non amortie et le flambement linéaire aux valeurs propres sont implémentés. La statique et le modal acceptent les libérations de moment d’extrémité. Les grandes transformations corotationnelles et la non-linéarité matériau sont hors périmètre.","Se implementan la estática lineal, la continuación P–Δ por rigidez geométrica inicial, el análisis modal no amortiguado y el pandeo lineal por autovalores. Estática y modal admiten liberaciones de momento en extremos. El análisis corrotacional de grandes desplazamientos y la no linealidad material quedan fuera de la herramienta.","Zaimplementowano statykę liniową, kontynuację P–Δ ze sztywnością geometryczną od stanu wstępnego, analizę modalną bez tłumienia i liniowe wyboczenie własne. Statyka i modalna obsługują zwolnienia momentów końcowych. Korotacyjna analiza dużych przemieszczeń i nieliniowość materiałowa są poza zakresem."],"3 DOF per node. Linear static and modal analyses support member end-moment releases; static uses sparse CSR + PCG; P–Δ continuation solves (K − λKg)u = λF from the selected static pre-stress state; modal uses consistent mass; buckling solves Kφ = λKgφ.":["3 DOF per node. Linear static and modal analyses support member end-moment releases; static uses sparse CSR + PCG; P–Δ continuation solves (K − λKg)u = λF from the selected static pre-stress state; modal uses consistent mass; buckling solves Kφ = λKgφ.","3 СС на вузол. Статика й модальний аналіз підтримують шарніри кінцевого моменту; статика використовує CSR + PCG; P–Δ розв’язує (K − λKg)u = λF з вибраного статичного стану; модальний режим — узгоджену масу; стійкість — Kφ = λKgφ.","3 FG je Knoten. Statik und Modal unterstützen Endmomentfreigaben; Statik nutzt CSR + PCG; P–Δ löst (K − λKg)u = λF aus dem gewählten statischen Vorspannungszustand; Modal nutzt konsistente Masse; Knicken löst Kφ = λKgφ.","3 VG per knoop. Statica en modaal ondersteunen eindmomentvrijgaven; statica gebruikt CSR + PCG; P–Δ lost (K − λKg)u = λF op vanuit de gekozen statische voorspanning; modaal gebruikt consistente massa; knik lost Kφ = λKgφ op.","3 DDL par nœud. Statique et modal acceptent les libérations de moment ; statique en CSR + PCG ; P–Δ résout (K − λKg)u = λF depuis la précontrainte statique choisie ; modal avec masse cohérente ; flambement Kφ = λKgφ.","3 GDL por nodo. Estática y modal admiten liberaciones de momento; estática usa CSR + PCG; P–Δ resuelve (K − λKg)u = λF desde el estado estático seleccionado; modal usa masa consistente; pandeo resuelve Kφ = λKgφ.","3 DOF na węzeł. Statyka i modalna obsługują zwolnienia momentów; statyka używa CSR + PCG; P–Δ rozwiązuje (K − λKg)u = λF ze wskazanego stanu statycznego; modalna używa masy spójnej; wyboczenie rozwiązuje Kφ = λKgφ."],"Drag nodes; add nodes on empty grid; in Add member mode click two nodes.":["Drag nodes; add nodes on empty grid; in Add member mode click two nodes.","Prетягуйте вузли; додавайте вузли на порожній сітці; у режимі «Додати елемент» клацніть два вузли.","Knoten ziehen; Knoten im leeren Raster hinzufügen; im Modus „Stab hinzufügen“ zwei Knoten anklicken.","Sleep knopen; voeg knopen toe op het lege raster; klik in modus „Staaf toevoegen“ op twee knopen.","Déplacez les nœuds ; ajoutez-en sur la grille vide ; en mode « Ajouter une barre », cliquez deux nœuds.","Arrastre nodos; añada nodos en la rejilla vacía; en modo «Añadir barra» haga clic en dos nodos.","Przeciągaj węzły; dodawaj je na pustej siatce; w trybie „Dodaj pręt” kliknij dwa węzły."],"2D Frame / FEM Workbench":["2D Frame / FEM Workbench","2D рама / FEM-майстерня","2D-Rahmen / FEM-Workbench","2D-raamwerk / FEM-werkbank","Portique 2D / atelier EF","Pórtico 2D / banco FEM","Rama 2D / stanowisko MES"],"Build a planar beam-column model, assign stiffness and mass, define supports and loads, then choose the analysis you need. The same geometry drives linear static, initial-stress P–Δ continuation, undamped modal analysis and linear eigenvalue buckling. Start with geometry and restraints; then assign sections and loads; finally select the analysis mode and inspect the stage and result tables.":["Build a planar beam-column model, assign stiffness and mass, define supports and loads, then choose the analysis you need. The same geometry drives linear static, initial-stress P–Δ continuation, undamped modal analysis and linear eigenvalue buckling. Start with geometry and restraints; then assign sections and loads; finally select the analysis mode and inspect the stage and result tables.","Побудуйте плоску балково-стійкову модель, задайте жорсткість і масу, опори та навантаження, а потім виберіть потрібний аналіз. Та сама геометрія використовується для лінійної статики, P–Δ, недемпфованого модального аналізу та лінійної власної стійкості. Почніть з геометрії й закріплень, далі задайте перерізи та навантаження, потім виберіть режим і перевірте сцену та таблиці результатів.","Erstellen Sie ein ebenes Balken-Stützen-Modell, weisen Sie Steifigkeit und Masse zu, definieren Sie Lager und Lasten und wählen Sie dann die Analyse. Dieselbe Geometrie wird für lineare Statik, P–Δ, ungedämpfte Modalanalyse und lineares Eigenwertknicken verwendet. Beginnen Sie mit Geometrie und Lagerung, danach Querschnitte und Lasten, anschließend Analyseart und Ergebnisse.","Bouw een vlak balk-kolommodel, geef stijfheid en massa op, definieer opleggingen en belastingen en kies daarna de analyse. Dezelfde geometrie wordt gebruikt voor lineaire statica, P–Δ, ongedempte modale analyse en lineaire eigenwaarde-knik. Begin met geometrie en randvoorwaarden, daarna doorsneden en lasten, en kies tenslotte de analyse en controleer scène en tabellen.","Construisez un modèle plan poutre-poteau, attribuez rigidité et masse, définissez appuis et charges, puis choisissez l’analyse. La même géométrie sert à la statique linéaire, au P–Δ, au modal non amorti et au flambement linéaire aux valeurs propres. Commencez par géométrie et appuis, puis sections et charges, enfin le mode d’analyse et les résultats.","Construya un modelo plano viga-columna, asigne rigidez y masa, defina apoyos y cargas y después elija el análisis. La misma geometría sirve para estática lineal, P–Δ, modal no amortiguado y pandeo lineal por autovalores. Empiece por geometría y restricciones, luego secciones y cargas, y finalmente el modo de análisis y los resultados.","Zbuduj płaski model belkowo-słupowy, przypisz sztywność i masę, zdefiniuj podpory i obciążenia, a następnie wybierz analizę. Ta sama geometria służy do statyki liniowej, P–Δ, analizy modalnej bez tłumienia i liniowego wyboczenia własnego. Zacznij od geometrii i więzów, potem przekroje i obciążenia, na końcu tryb analizy i wyniki."],"A reliable modelling sequence":["A reliable modelling sequence","Надійна послідовність моделювання","Zuverlässige Modellierreihenfolge","Betrouwbare modelleervolgorde","Séquence de modélisation fiable","Secuencia de modelado fiable","Niezawodna kolejność modelowania"],"Use this order: geometry → restraints/springs → section properties → load cases and loads → combinations → analysis mode → results. Most failed models are not solver failures; they are mechanisms, missing section properties, missing mass in modal analysis, or a reference load state that contains no compression for buckling.":["Use this order: geometry → restraints/springs → section properties → load cases and loads → combinations → analysis mode → results. Most failed models are not solver failures; they are mechanisms, missing section properties, missing mass in modal analysis, or a reference load state that contains no compression for buckling.","Дотримуйтеся порядку: геометрія → закріплення/пружини → властивості перерізів → випадки та навантаження → комбінації → режим аналізу → результати. Більшість невдалих моделей — це не збій розв’язувача, а механізм, відсутні властивості перерізу, маса для модального аналізу або стискання в опорному стані для стійкості.","Reihenfolge: Geometrie → Lager/Federn → Querschnittseigenschaften → Lastfälle und Lasten → Kombinationen → Analyseart → Ergebnisse. Die meisten Fehler sind keine Solverfehler, sondern Mechanismen, fehlende Querschnittswerte, fehlende Masse im Modalmodell oder fehlende Druckkraft im Knick-Referenzzustand.","Volgorde: geometrie → randvoorwaarden/veren → doorsnede-eigenschappen → belastingsgevallen en lasten → combinaties → analysetype → resultaten. De meeste mislukte modellen zijn geen solverfouten maar mechanismen, ontbrekende doorsnedegegevens, ontbrekende massa of een referentietoestand zonder druk voor knik.","Ordre recommandé : géométrie → appuis/ressorts → propriétés de section → cas et charges → combinaisons → type d’analyse → résultats. La plupart des échecs viennent d’un mécanisme, de propriétés manquantes, d’une masse absente en modal ou d’un état de référence sans compression pour le flambement.","Orden: geometría → restricciones/resortes → propiedades de sección → casos y cargas → combinaciones → análisis → resultados. La mayoría de los fallos son mecanismos, propiedades faltantes, masa ausente en modal o un estado de referencia sin compresión para pandeo.","Kolejność: geometria → więzy/sprężyny → właściwości przekroju → przypadki i obciążenia → kombinacje → tryb analizy → wyniki. Większość błędów to mechanizmy, brak danych przekroju, brak masy w analizie modalnej albo brak ściskania w stanie odniesienia wyboczenia."],"Start from a preset when learning":["Start from a preset when learning","Починайте з пресету","Mit einem Preset beginnen","Begin met een preset","Commencer par un préréglage","Empiece con un preajuste","Zacznij od presetu"],"The Examples panel contains solved teaching models, not hidden templates. Load one, then inspect and edit the same nodes, members, sections and loads you would create yourself. Presets cover beams, frames, thermal restraint, springs, load combinations, member point loads, nodal mass, P–Δ continuation, modal analysis and buckling.":["The Examples panel contains solved teaching models, not hidden templates. Load one, then inspect and edit the same nodes, members, sections and loads you would create yourself. Presets cover beams, frames, thermal restraint, springs, load combinations, member point loads, nodal mass, P–Δ continuation, modal analysis and buckling.","Панель прикладів містить розв’язані навчальні моделі, а не приховані шаблони. Завантажте приклад і редагуйте ті самі вузли, елементи, перерізи та навантаження, які створювали б вручну. Пресети охоплюють балки, рами, температурне закріплення, пружини, комбінації, зосереджені сили, вузлову масу, P–Δ, модальний аналіз і стійкість.","Die Beispiele sind gelöste Lernmodelle, keine versteckten Vorlagen. Laden Sie eines und bearbeiten Sie dieselben Knoten, Stäbe, Querschnitte und Lasten wie in einem eigenen Modell. Presets decken Balken, Rahmen, Temperaturzwang, Federn, Lastkombinationen, Stab-Einzellasten, Knotenmasse, P–Δ, Modal- und Knickanalyse ab.","De voorbeelden zijn opgeloste leermodellen, geen verborgen sjablonen. Laad er één en bewerk dezelfde knopen, staven, doorsneden en lasten als in een eigen model. Presets behandelen balken, raamwerken, thermische opsluiting, veren, combinaties, puntlasten, knoopmassa, P–Δ, modaal en knik.","Les exemples sont des modèles pédagogiques résolus, pas des modèles cachés. Chargez-en un puis modifiez les mêmes nœuds, barres, sections et charges que dans votre propre modèle. Ils couvrent poutres, portiques, blocage thermique, ressorts, combinaisons, charges ponctuelles, masse nodale, P–Δ, modal et flambement.","Los ejemplos son modelos didácticos resueltos, no plantillas ocultas. Cargue uno y edite los mismos nodos, barras, secciones y cargas que crearía manualmente. Cubren vigas, pórticos, restricción térmica, resortes, combinaciones, cargas puntuales, masa nodal, P–Δ, modal y pandeo.","Przykłady to rozwiązane modele dydaktyczne, nie ukryte szablony. Wczytaj jeden i edytuj te same węzły, pręty, przekroje i obciążenia, które tworzysz samodzielnie. Presety obejmują belki, ramy, skrępowanie termiczne, sprężyny, kombinacje, siły skupione, masę węzłową, P–Δ, analizę modalną i wyboczenie."],"Choose the analysis model":["Choose the analysis model","Виберіть модель аналізу","Analysemodell wählen","Kies het analysemodel","Choisir le modèle d’analyse","Elija el modelo de análisis","Wybierz model analizy"],"Linear static solves K u = F. Second order uses an initial-stress geometric stiffness and proportional continuation, (K − λKg)u = λF. Modal solves Kφ = ω²Mφ with consistent member mass and optional nodal mass. Buckling solves Kφ = λKgφ using the selected static load set as the reference pre-stress state.":["Linear static solves K u = F. Second order uses an initial-stress geometric stiffness and proportional continuation, (K − λKg)u = λF. Modal solves Kφ = ω²Mφ with consistent member mass and optional nodal mass. Buckling solves Kφ = λKgφ using the selected static load set as the reference pre-stress state.","Лінійна статика розв’язує K u = F. Другий порядок використовує геометричну жорсткість від початкових сил і пропорційне продовження: (K − λKg)u = λF. Модальний режим розв’язує Kφ = ω²Mφ з узгодженою масою елементів та необов’язковою вузловою масою. Стійкість розв’язує Kφ = λKgφ для вибраного статичного стану.","Linear statisch: K u = F. Theorie II. Ordnung nutzt geometrische Anfangsspannungssteifigkeit und proportionale Fortsetzung: (K − λKg)u = λF. Modal: Kφ = ω²Mφ mit konsistenter Stabmasse und optionaler Knotenmasse. Knicken: Kφ = λKgφ aus dem gewählten statischen Vorspannungszustand.","Lineaire statica lost K u = F op. Tweede orde gebruikt geometrische stijfheid uit de initiële spanning en proportionele voortzetting: (K − λKg)u = λF. Modaal lost Kφ = ω²Mφ op met consistente staafmassa en optionele knoopmassa. Knik lost Kφ = λKgφ op vanuit de geselecteerde statische voorspanning.","La statique linéaire résout K u = F. Le second ordre utilise la rigidité géométrique de l’état initial et une continuation proportionnelle : (K − λKg)u = λF. Le modal résout Kφ = ω²Mφ avec masse cohérente et masse nodale optionnelle. Le flambement résout Kφ = λKgφ depuis l’état statique choisi.","La estática lineal resuelve K u = F. El segundo orden usa rigidez geométrica del estado inicial y continuación proporcional: (K − λKg)u = λF. Modal resuelve Kφ = ω²Mφ con masa consistente y masa nodal opcional. Pandeo resuelve Kφ = λKgφ desde el estado estático seleccionado.","Statyka liniowa rozwiązuje K u = F. II rząd używa sztywności geometrycznej od stanu początkowego i kontynuacji proporcjonalnej: (K − λKg)u = λF. Modalna rozwiązuje Kφ = ω²Mφ z masą spójną i opcjonalną masą węzłową. Wyboczenie rozwiązuje Kφ = λKgφ ze wskazanego stanu statycznego."],"Geometry and direct manipulation":["Geometry and direct manipulation","Геометрія та пряме редагування","Geometrie und direkte Bearbeitung","Geometrie en directe bewerking","Géométrie et manipulation directe","Geometría y manipulación directa","Geometria i bezpośrednia edycja"],"Nodes carry three planar degrees of freedom: ux, uy and rz. Members are prismatic Euler–Bernoulli beam-column elements between two nodes. Add nodes on the snap grid, connect them with members, and drag nodes in Select mode. Dragging changes geometry only; the framework commits and recomputes after the move.":["Nodes carry three planar degrees of freedom: ux, uy and rz. Members are prismatic Euler–Bernoulli beam-column elements between two nodes. Add nodes on the snap grid, connect them with members, and drag nodes in Select mode. Dragging changes geometry only; the framework commits and recomputes after the move.","Вузол має три плоскі ступені свободи: ux, uy та rz. Елементи — призматичні балки-стійки Ейлера—Бернуллі між двома вузлами. Додавайте вузли на сітці, з’єднуйте їх елементами та перетягуйте в режимі вибору. Перетягування змінює лише геометрію; після завершення виконується перерахунок.","Jeder Knoten hat drei ebene Freiheitsgrade: ux, uy und rz. Stäbe sind prismatische Euler-Bernoulli-Balken-Stützen zwischen zwei Knoten. Knoten im Fangraster setzen, verbinden und im Auswahlmodus ziehen. Beim Ziehen ändert sich nur die Geometrie; nach dem Loslassen wird neu gerechnet.","Elke knoop heeft drie vlakke vrijheidsgraden: ux, uy en rz. Staven zijn prismatische Euler–Bernoulli balk-kolomelementen tussen twee knopen. Voeg knopen toe op het raster, verbind ze en sleep ze in selectiemodus. Na het slepen wordt de geometrie vastgelegd en opnieuw berekend.","Chaque nœud possède trois DDL plans : ux, uy et rz. Les barres sont des éléments prismatiques Euler–Bernoulli entre deux nœuds. Ajoutez des nœuds sur la grille, reliez-les et déplacez-les en mode sélection. Le calcul est relancé après le déplacement.","Cada nodo tiene tres GDL planos: ux, uy y rz. Las barras son elementos prismáticos Euler–Bernoulli entre dos nodos. Añada nodos en la rejilla, conéctelos y arrástrelos en modo selección. Al terminar el movimiento se actualiza la geometría y se recalcula.","Każdy węzeł ma trzy płaskie stopnie swobody: ux, uy i rz. Pręty są pryzmatycznymi elementami Eulera–Bernoulliego między dwoma węzłami. Dodawaj węzły na siatce, łącz je prętami i przeciągaj w trybie wyboru. Po przesunięciu model jest przeliczany."],"Restraints and springs":["Restraints and springs","Закріплення та пружини","Lager und Federn","Randvoorwaarden en veren","Appuis et ressorts","Restricciones y resortes","Więzy i sprężyny"],"Fix X, Y or Rz to suppress a nodal degree of freedom. Translational and rotational springs add kx, ky and kr directly to the global stiffness. A stable model needs enough restraint to remove rigid-body mechanisms, but springs may provide that restraint instead of fixed DOFs.":["Fix X, Y or Rz to suppress a nodal degree of freedom. Translational and rotational springs add kx, ky and kr directly to the global stiffness. A stable model needs enough restraint to remove rigid-body mechanisms, but springs may provide that restraint instead of fixed DOFs.","Закріпіть X, Y або Rz, щоб вилучити відповідний ступінь свободи. Поступальні та крутильні пружини додають kx, ky і kr безпосередньо до глобальної жорсткості. Стабільна модель потребує усунення жорсткотільних механізмів; це можуть забезпечити й пружини.","X, Y oder Rz sperren den jeweiligen Knotenfreiheitsgrad. Translations- und Drehfedern addieren kx, ky und kr direkt zur globalen Steifigkeit. Ein stabiles Modell braucht genügend Lagerung gegen Starrkörpermechanismen; Federn können diese Lagerwirkung übernehmen.","Fixeer X, Y of Rz om een knoopvrijheidsgraad te onderdrukken. Translatie- en rotatieveren voegen kx, ky en kr rechtstreeks toe aan de globale stijfheid. Een stabiel model moet starre-lichaamsmechanismen uitsluiten; veren kunnen die randvoorwaarde leveren.","Bloquez X, Y ou Rz pour supprimer un DDL nodal. Les ressorts de translation et de rotation ajoutent kx, ky et kr directement à la rigidité globale. Le modèle doit éliminer les mécanismes de corps rigide ; des ressorts peuvent assurer cette fonction.","Fije X, Y o Rz para eliminar un GDL nodal. Los resortes traslacionales y rotacionales añaden kx, ky y kr directamente a la rigidez global. El modelo debe eliminar mecanismos de cuerpo rígido; los resortes pueden proporcionar esa restricción.","Zablokuj X, Y lub Rz, aby usunąć odpowiedni stopień swobody. Sprężyny translacyjne i obrotowe dodają kx, ky i kr bezpośrednio do sztywności globalnej. Model musi eliminować mechanizmy bryły sztywnej; mogą to zapewnić również sprężyny."],"Section properties":["Section properties","Властивості перерізу","Querschnittseigenschaften","Doorsnede-eigenschappen","Propriétés de section","Propiedades de sección","Właściwości przekroju"],"E, A and I define elastic stiffness. α is used for uniform member temperature change. μ is member mass per unit length and is required for member-mass modal analysis. These are arbitrary user-entered properties: the tool does not select a catalogue section or perform a code check.":["E, A and I define elastic stiffness. α is used for uniform member temperature change. μ is member mass per unit length and is required for member-mass modal analysis. These are arbitrary user-entered properties: the tool does not select a catalogue section or perform a code check.","E, A та I задають пружну жорсткість. α використовується для рівномірної зміни температури елемента. μ — маса на одиницю довжини для модального аналізу. Усі властивості задає користувач; тулза не підбирає каталожний профіль і не виконує нормативну перевірку.","E, A und I bestimmen die elastische Steifigkeit. α gilt für gleichmäßige Temperaturänderung, μ ist die Stabmasse je Länge für die Modalanalyse. Die Werte werden frei eingegeben; das Werkzeug wählt keinen Katalogquerschnitt und führt keinen Normnachweis.","E, A en I bepalen de elastische stijfheid. α wordt gebruikt voor uniforme temperatuurverandering; μ is massa per lengte voor modale analyse. De gebruiker voert deze eigenschappen zelf in; de tool kiest geen catalogusprofiel en voert geen normtoets uit.","E, A et I définissent la rigidité élastique. α sert à une variation uniforme de température ; μ est la masse linéique utilisée en modal. Ces propriétés sont saisies librement : l’outil ne choisit pas un profil catalogue et ne réalise pas de vérification normative.","E, A e I definen la rigidez elástica. α se usa para cambio uniforme de temperatura; μ es la masa lineal para análisis modal. Son propiedades introducidas por el usuario: la herramienta no selecciona perfiles de catálogo ni hace comprobaciones normativas.","E, A i I definiują sztywność sprężystą. α służy do równomiernej zmiany temperatury, a μ jest masą na jednostkę długości dla analizy modalnej. Dane podaje użytkownik; narzędzie nie dobiera profilu katalogowego ani nie wykonuje sprawdzeń normowych."],"Loads and reference states":["Loads and reference states","Навантаження та опорні стани","Lasten und Referenzzustände","Belastingen en referentietoestanden","Charges et états de référence","Cargas y estados de referencia","Obciążenia i stany odniesienia"],"Nodal loads act at nodes. Member loads currently support full-member uniform loads in global X/Y, uniform ΔT and arbitrary member point forces. Buckling and second-order analysis first solve the selected load case or combination; its member axial forces define the geometric-stiffness reference state.":["Nodal loads act at nodes. Member loads currently support full-member uniform loads in global X/Y, uniform ΔT and arbitrary member point forces. Buckling and second-order analysis first solve the selected load case or combination; its member axial forces define the geometric-stiffness reference state.","Вузлові навантаження діють у вузлах. Для елементів підтримуються рівномірні навантаження по всій довжині в глобальних X/Y, рівномірне ΔT та довільні зосереджені сили. Для P–Δ і стійкості спочатку розв’язується вибраний випадок або комбінація; його осьові сили задають опорний стан геометричної жорсткості.","Knotenlasten greifen an Knoten an. Stablasten umfassen Gleichlasten über den ganzen Stab in global X/Y, gleichmäßiges ΔT und beliebige Stab-Einzellasten. Für P–Δ und Knicken wird zuerst der gewählte Lastfall bzw. die Kombination gelöst; die Normalkräfte definieren den Referenzzustand der geometrischen Steifigkeit.","Knooplasten werken op knopen. Staaflasten ondersteunen uniforme belasting over de hele staaf in globale X/Y, uniforme ΔT en willekeurige puntkrachten. Voor P–Δ en knik wordt eerst het gekozen belastingsgeval of de combinatie opgelost; de normaalkrachten bepalen de referentietoestand voor geometrische stijfheid.","Les charges nodales agissent aux nœuds. Les charges de barre comprennent des charges uniformes sur toute la barre en X/Y globaux, un ΔT uniforme et des forces ponctuelles arbitraires. Pour P–Δ et flambement, le cas ou la combinaison choisi est d’abord résolu ; ses efforts axiaux définissent la rigidité géométrique de référence.","Las cargas nodales actúan en nodos. Las cargas de barra admiten carga uniforme en toda la barra en X/Y globales, ΔT uniforme y fuerzas puntuales arbitrarias. Para P–Δ y pandeo se resuelve primero el caso o combinación seleccionado; sus axiles definen el estado de referencia de rigidez geométrica.","Obciążenia węzłowe działają w węzłach. Obciążenia prętów obejmują równomierne obciążenia na całej długości w globalnych X/Y, równomierne ΔT i dowolne siły skupione. Dla P–Δ i wyboczenia najpierw rozwiązywany jest wskazany przypadek lub kombinacja; siły osiowe definiują stan odniesienia sztywności geometrycznej."],"Combinations are linear superpositions of solved base cases. Write formulas such as 1.35*G + 1.5*Q. The parser accepts case IDs, signs, decimal coefficients and scientific notation. Combinations are valid reference states for second-order and buckling analysis.":["Combinations are linear superpositions of solved base cases. Write formulas such as 1.35*G + 1.5*Q. The parser accepts case IDs, signs, decimal coefficients and scientific notation. Combinations are valid reference states for second-order and buckling analysis.","Комбінації — це лінійна суперпозиція розв’язаних базових випадків. Формула може мати вигляд 1.35*G + 1.5*Q. Парсер приймає ID випадків, знаки, десяткові коефіцієнти та науковий запис. Комбінації можна використовувати як опорні стани для P–Δ і стійкості.","Kombinationen sind lineare Überlagerungen gelöster Grundlastfälle, z. B. 1.35*G + 1.5*Q. Der Parser akzeptiert Lastfall-IDs, Vorzeichen, Dezimalfaktoren und wissenschaftliche Schreibweise. Kombinationen können als Referenz für II. Ordnung und Knicken dienen.","Combinaties zijn lineaire superposities van opgeloste basisgevallen, bijvoorbeeld 1.35*G + 1.5*Q. De parser accepteert geval-ID’s, tekens, decimale factoren en wetenschappelijke notatie. Combinaties zijn geldige referentietoestanden voor tweede orde en knik.","Les combinaisons sont des superpositions linéaires de cas de base résolus, par exemple 1.35*G + 1.5*Q. Le parseur accepte identifiants, signes, coefficients décimaux et notation scientifique. Elles peuvent servir d’état de référence au second ordre et au flambement.","Las combinaciones son superposiciones lineales de casos base resueltos, por ejemplo 1.35*G + 1.5*Q. El analizador acepta IDs, signos, coeficientes decimales y notación científica. Pueden usarse como estados de referencia para segundo orden y pandeo.","Kombinacje są liniowymi superpozycjami rozwiązanych przypadków bazowych, np. 1.35*G + 1.5*Q. Parser przyjmuje identyfikatory, znaki, współczynniki dziesiętne i notację naukową. Kombinacje mogą być stanami odniesienia dla II rzędu i wyboczenia."],"Initial-stress P–Δ continuation":["Initial-stress P–Δ continuation","Kontynuacja P–Δ ze stanem początkowym","P–Δ-Fortsetzung mit Anfangsspannung","Initial-stress P–Δ-voortzetting","Continuation P–Δ par état initial","Continuación P–Δ con estado inicial","Kontynuacja P–Δ ze stanem początkowym"],"This mode scales the selected reference load state by λ and solves a tangent system at successive load factors. It captures the classical initial-stress P–Δ amplification while the tangent remains positive definite. It is not a corotational large-displacement Newton solution and does not trace post-buckling equilibrium.":["This mode scales the selected reference load state by λ and solves a tangent system at successive load factors. It captures the classical initial-stress P–Δ amplification while the tangent remains positive definite. It is not a corotational large-displacement Newton solution and does not trace post-buckling equilibrium.","Режим масштабує вибраний опорний стан на λ і послідовно розв’язує дотичну систему. Він відтворює класичне підсилення P–Δ, поки дотична матриця додатно визначена. Це не коротаційний Newton-розрахунок великих переміщень і не трасування посткритичної рівноваги.","Der Modus skaliert den Referenzlastzustand mit λ und löst die Tangentialgleichung in aufeinanderfolgenden Laststufen. Er erfasst die klassische P–Δ-Verstärkung, solange die Tangente positiv definit bleibt. Es ist keine korotationale Großverformungs-Newtonanalyse und verfolgt keine Nachbeulgleichgewichte.","Deze modus schaalt de referentietoestand met λ en lost het tangentsysteem op in opeenvolgende belastingstappen. Hij beschrijft klassieke P–Δ-versterking zolang de tangent positief definiet blijft. Het is geen corotationele Newton-oplossing voor grote verplaatsingen en volgt geen post-knikevenwicht.","Ce mode multiplie l’état de référence par λ et résout le système tangent à des niveaux de charge successifs. Il reproduit l’amplification P–Δ classique tant que la tangente reste définie positive. Ce n’est ni une résolution Newton corotationnelle à grandes transformations ni un suivi post-flambement.","Este modo escala el estado de referencia por λ y resuelve el sistema tangente en niveles sucesivos de carga. Captura la amplificación P–Δ clásica mientras la tangente sea definida positiva. No es una solución Newton corrotacional de grandes desplazamientos ni sigue equilibrio poscrítico.","Tryb skaluje stan odniesienia przez λ i rozwiązuje układ styczny w kolejnych poziomach obciążenia. Odtwarza klasyczne wzmocnienie P–Δ, dopóki macierz styczna jest dodatnio określona. Nie jest to korotacyjna analiza Newtona dużych przemieszczeń ani śledzenie równowagi pokrytycznej."],"Undamped modal analysis":["Undamped modal analysis","Недемпфований модальний аналіз","Ungedämpfte Modalanalyse","Ongedempte modale analyse","Analyse modale non amortie","Análisis modal no amortiguado","Analiza modalna bez tłumienia"],"Natural frequencies come from Kφ = ω²Mφ. Member μ builds a consistent beam mass matrix; nodal mass and rotary inertia may be added at nodes. Mode shapes are generalized-mass normalized. For each mode the tool reports global X/Y participation Γ = φᵀMr and effective modal mass M* = Γ², with percentages relative to the active free translational mass in that direction. No damping, forcing, response spectrum or transient integration is included.":["Natural frequencies come from Kφ = ω²Mφ. Member μ builds a consistent beam mass matrix; nodal mass and rotary inertia may be added at nodes. Mode shapes are generalized-mass normalized. For each mode the tool reports global X/Y participation Γ = φᵀMr and effective modal mass M* = Γ², with percentages relative to the active free translational mass in that direction. No damping, forcing, response spectrum or transient integration is included.","Власні частоти визначаються з Kφ = ω²Mφ. μ формує узгоджену матрицю маси елемента; у вузлах можна додати масу та крутильну інерцію. Форми нормуються за узагальненою масою. Для кожної форми показуються участь X/Y Γ = φᵀMr та ефективна модальна маса M* = Γ² у відсотках від активної вільної поступальної маси. Демпфування, вимушені коливання, спектри й часовий інтеграл не реалізовані.","Eigenfrequenzen folgen aus Kφ = ω²Mφ. μ erzeugt die konsistente Stabmassenmatrix; Knotenmasse und Drehträgheit können ergänzt werden. Eigenformen sind auf generalisierte Masse normiert. Für jede Mode werden X/Y-Beteiligung Γ = φᵀMr und effektive Modalmassen M* = Γ² bezogen auf die aktive freie Translationsmasse angegeben. Keine Dämpfung, Erregung, Antwortspektren oder Zeitintegration.","Eigenfrequenties volgen uit Kφ = ω²Mφ. μ bouwt de consistente staafmassamatrix; knoopmassa en rotatietraagheid kunnen worden toegevoegd. Modale vormen zijn op gegeneraliseerde massa genormaliseerd. Per modus worden X/Y-participatie Γ = φᵀMr en effectieve modale massa M* = Γ² gegeven ten opzichte van de actieve vrije translatiemassa. Geen demping, forcing, responsspectrum of tijdintegratie.","Les fréquences propres proviennent de Kφ = ω²Mφ. μ construit la masse cohérente de la barre ; masse et inertie nodales peuvent être ajoutées. Les modes sont normalisés en masse généralisée. Pour chaque mode, l’outil donne la participation X/Y Γ = φᵀMr et la masse modale effective M* = Γ² rapportée à la masse translationnelle libre active. Pas d’amortissement, forçage, spectre ni intégration temporelle.","Las frecuencias naturales salen de Kφ = ω²Mφ. μ construye la masa consistente de la barra; pueden añadirse masa e inercia nodales. Las formas se normalizan por masa generalizada. Para cada modo se informa participación X/Y Γ = φᵀMr y masa modal efectiva M* = Γ² respecto a la masa traslacional libre activa. No incluye amortiguamiento, excitación, espectro ni integración transitoria.","Częstotliwości własne wynikają z Kφ = ω²Mφ. μ buduje spójną macierz masy pręta; można dodać masę i bezwładność węzłową. Postacie są normalizowane względem masy uogólnionej. Dla każdej postaci podawany jest udział X/Y Γ = φᵀMr i efektywna masa modalna M* = Γ² względem aktywnej swobodnej masy translacyjnej. Brak tłumienia, wymuszenia, spektrum i całkowania w czasie."],"Linear eigenvalue buckling":["Linear eigenvalue buckling","Лінійна власна стійкість","Lineares Eigenwertknicken","Lineaire eigenwaarde-knik","Flambement linéaire aux valeurs propres","Pandeo lineal por autovalores","Liniowe wyboczenie własne"],"The selected static load set supplies member axial forces. Compressive force creates the destabilizing geometric stiffness; the eigenvalue λ is the proportional multiplier on that reference load state. The result is an ideal bifurcation factor, not an imperfection-sensitive design resistance.":["The selected static load set supplies member axial forces. Compressive force creates the destabilizing geometric stiffness; the eigenvalue λ is the proportional multiplier on that reference load state. The result is an ideal bifurcation factor, not an imperfection-sensitive design resistance.","Вибраний статичний набір навантажень задає осьові сили. Стискання створює дестабілізуючу геометричну жорсткість; λ — пропорційний множник цього опорного стану. Результат є ідеальним біфуркаційним множником, а не розрахунковою несучою здатністю з урахуванням недосконалостей.","Der gewählte statische Lastsatz liefert die Normalkräfte. Druck erzeugt die destabilisierende geometrische Steifigkeit; λ ist der proportionale Multiplikator des Referenzzustands. Das Ergebnis ist ein idealer Verzweigungsfaktor, keine imperfektionsabhängige Bemessungstragfähigkeit.","De geselecteerde statische belastingsset levert de normaalkrachten. Druk veroorzaakt destabiliserende geometrische stijfheid; λ is de proportionele factor op die referentietoestand. Het resultaat is een ideale bifurcatiefactor, geen ontwerpweerstand inclusief imperfecties.","Le jeu de charges statique sélectionné fournit les efforts axiaux. La compression produit la rigidité géométrique déstabilisante ; λ multiplie proportionnellement l’état de référence. Le résultat est un facteur de bifurcation idéal, pas une résistance de calcul sensible aux imperfections.","El conjunto de carga estático seleccionado aporta los axiles. La compresión crea la rigidez geométrica desestabilizadora; λ es el multiplicador proporcional del estado de referencia. El resultado es un factor de bifurcación ideal, no una resistencia de diseño con imperfecciones.","Wybrany statyczny zestaw obciążeń dostarcza sił osiowych. Ściskanie tworzy destabilizującą sztywność geometryczną; λ jest proporcjonalnym mnożnikiem stanu odniesienia. Wynik to idealny mnożnik bifurkacyjny, a nie nośność projektowa uwzględniająca imperfekcje."],"Read the results in context":["Read the results in context","Інтерпретуйте результати в контексті","Ergebnisse im Kontext lesen","Lees resultaten in context","Lire les résultats dans leur contexte","Interprete los resultados en contexto","Czytaj wyniki w kontekście"],"The stage is a pre/postprocessor view; numeric tables are the calculation record. Static results report reactions, displacements and N/V/M envelopes. Second-order adds the continuation path and P–Δ amplification. Modal reports frequencies and periods. Buckling reports positive load factors and eigenmodes. Always interpret these within the stated model limitations.":["The stage is a pre/postprocessor view; numeric tables are the calculation record. Static results report reactions, displacements and N/V/M envelopes. Second-order adds the continuation path and P–Δ amplification. Modal reports frequencies and periods. Buckling reports positive load factors and eigenmodes. Always interpret these within the stated model limitations.","Сцена — це пре-/постпроцесорне представлення; числові таблиці є розрахунковим записом. Статика показує реакції, переміщення та огинаючі N/V/M. Другий порядок додає траєкторію та підсилення P–Δ. Модальний режим — частоти й періоди. Стійкість — додатні множники та форми. Інтерпретуйте все в межах заявлених обмежень моделі.","Die Bühne ist die Prä-/Postprozessoransicht; die Zahlentabellen bilden den Berechnungsdatensatz. Statik zeigt Reaktionen, Verschiebungen und N/V/M-Hüllwerte. II. Ordnung ergänzt Lastpfad und P–Δ-Verstärkung. Modal zeigt Frequenzen und Perioden. Knicken liefert positive Lastfaktoren und Eigenformen. Immer innerhalb der Modellgrenzen interpretieren.","De scène is de pre/postprocessorweergave; numerieke tabellen zijn het rekenrecord. Statica geeft reacties, verplaatsingen en N/V/M-omhullenden. Tweede orde voegt het pad en P–Δ-versterking toe. Modaal geeft frequenties en perioden. Knik geeft positieve factoren en eigenvormen. Interpreteer alles binnen de modelbeperkingen.","La scène est la vue pré/postprocesseur ; les tableaux numériques constituent l’enregistrement de calcul. La statique donne réactions, déplacements et enveloppes N/V/M. Le second ordre ajoute le chemin et l’amplification P–Δ. Le modal donne fréquences et périodes. Le flambement donne facteurs positifs et modes. Toujours interpréter dans les limites du modèle.","La escena es la vista de pre/postproceso; las tablas numéricas son el registro de cálculo. Estática informa reacciones, desplazamientos y envolventes N/V/M. Segundo orden añade trayectoria y amplificación P–Δ. Modal da frecuencias y períodos. Pandeo da factores positivos y modos. Interprete siempre dentro de las limitaciones del modelo.","Widok sceny jest pre/postprocesorem; tabele liczbowe stanowią zapis obliczeń. Statyka podaje reakcje, przemieszczenia i obwiednie N/V/M. II rząd dodaje ścieżkę i wzmocnienie P–Δ. Modalna podaje częstotliwości i okresy. Wyboczenie podaje dodatnie mnożniki i postacie. Wyniki należy interpretować w granicach modelu."],"Beams":["Beams","Балки","Balken","Balken","Poutres","Vigas","Belki"],"Frames":["Frames","Рами","Rahmen","Raamwerken","Portiques","Pórticos","Ramy"],"Thermal":["Thermal","Температура","Thermik","Thermisch","Thermique","Térmico","Termiczne"],"Stability":["Stability","Стійкість","Stabilität","Stabiliteit","Stabilité","Estabilidad","Stateczność"],"Dynamics":["Dynamics","Динаміка","Dynamik","Dynamica","Dynamique","Dinámica","Dynamika"],"Teaching":["Teaching","Навчальні","Lernen","Leren","Apprentissage","Didácticos","Nauka"],"Simply supported beam · UDL":["Simply supported beam · UDL","Шарнірно-оперта балка · UDL","Einfach gelagerter Balken · Gleichlast","Vrij opgelegde balk · UDL","Poutre simplement appuyée · charge uniforme","Viga simplemente apoyada · UDL","Belka swobodnie podparta · UDL"],"Portal frame · horizontal load":["Portal frame · horizontal load","Портальна рама · горизонтальна сила","Portalrahmen · Horizontallast","Portaalraam · horizontale belasting","Portique · charge horizontale","Pórtico · carga horizontal","Rama portalowa · obciążenie poziome"],"Restrained heated bar":["Restrained heated bar","Закріплений нагрітий стрижень","Gehinderter erwärmter Stab","Ingesloten verwarmde staaf","Barre chauffée empêchée","Barra calentada restringida","Skrępowany ogrzany pręt"],"Column · P–Δ continuation":["Column · P–Δ continuation","Стійка · P–Δ","Stütze · P–Δ-Fortsetzung","Kolom · P–Δ-voortzetting","Poteau · continuation P–Δ","Columna · continuación P–Δ","Słup · kontynuacja P–Δ"],"Cantilever · modal":["Cantilever · modal","Консоль · модальний аналіз","Kragarm · modal","Uitkraging · modaal","Console · modal","Voladizo · modal","Wspornik · modalna"],"Pinned column · buckling":["Pinned column · buckling","Шарнірна стійка · стійкість","Gelenkstütze · Knicken","Scharnierkolom · knik","Poteau articulé · flambement","Columna articulada · pandeo","Słup przegubowy · wyboczenie"],"Beam · central point load":["Beam · central point load","Балка · центральна зосереджена сила","Balken · mittige Einzellast","Balk · centrale puntlast","Poutre · charge ponctuelle centrale","Viga · carga puntual central","Belka · siła skupiona w środku"],"Axial bar · ground spring":["Axial bar · ground spring","Осьовий стрижень · пружина до основи","Zugstab · Bodenfeder","Axiale staaf · grondveer","Barre axiale · ressort au sol","Barra axial · resorte al suelo","Pręt osiowy · sprężyna do podłoża"],"Beam · G/Q combination":["Beam · G/Q combination","Балка · комбінація G/Q","Balken · G/Q-Kombination","Balk · G/Q-combinatie","Poutre · combinaison G/Q","Viga · combinación G/Q","Belka · kombinacja G/Q"],"Axial SDOF · nodal mass":["Axial SDOF · nodal mass","Осьова SDOF · вузлова маса","Axiales SDOF · Knotenmasse","Axiale SDOF · knoopmassa","SDOF axial · masse nodale","SDOF axial · masa nodal","Osiowy SDOF · masa węzłowa"],"Case · ":["Case · ","Випадок · ","Lastfall · ","Geval · ","Cas · ","Caso · ","Przypadek · "],"Combination · ":["Combination · ","Комбінація · ","Kombination · ","Combinatie · ","Combinaison · ","Combinación · ","Kombinacja · "],"Mode ":["Mode ","Форма ","Mode ","Modus ","Mode ","Modo ","Postać "],"Modal solution":["Modal solution","Модальний розв’язок","Modallösung","Modale oplossing","Solution modale","Solución modal","Rozwiązanie modalne"],"Eigenvalue buckling":["Eigenvalue buckling","Власна стійкість","Eigenwertknicken","Eigenwaarde-knik","Flambement aux valeurs propres","Pandeo por autovalores","Wyboczenie własne"],"Second-order":["Second-order","Другий порядок","II. Ordnung","Tweede orde","Second ordre","Segundo orden","II rząd"],"Solved":["Solved","Розв’язано","Gelöst","Opgelost","Résolu","Resuelto","Rozwiązano"],"Analysis scope details":["Linear static, initial-stress P–Δ continuation, undamped modal analysis and linear eigenvalue buckling are implemented. Static, P–Δ, modal and buckling analyses support member end-moment releases. Stability modes use independent internal hinge rotations. Corotational large-displacement/material-nonlinear analysis remains outside this tool.","Лінійна статика, initial-stress P–Δ, недемпфований модальний аналіз і лінійна власна стійкість реалізовані. Статика, P–Δ, модальний аналіз і стійкість підтримують кінцеві шарніри елементів. Режими стійкості використовують незалежні внутрішні обертання шарнірів. Коротаційний розрахунок великих переміщень і матеріальна нелінійність не входять до цієї тулзи.","Lineare Statik, initial-stress P–Δ, ungedämpfte Modalanalyse und lineares Eigenwertknicken sind implementiert. Statik, P–Δ, Modal- und Knickanalyse unterstützen Stabendgelenke. Stabilitätsmodi verwenden unabhängige interne Gelenkrotationen. Korotationale Großverformungs- und materialnichtlineare Analyse gehören nicht zu diesem Werkzeug.","Lineaire statica, initial-stress P–Δ, ongedempte modale analyse en lineaire eigenwaarde-knik zijn geïmplementeerd. Statica, P–Δ, modaal en knik ondersteunen eindscharnieren. Stabiliteitsmodi gebruiken onafhankelijke interne scharnierrotaties. Corotationele grote-verplaatsings- en materiaalnietlineaire analyse vallen buiten deze tool.","La statique linéaire, le P–Δ par état initial, le modal non amorti et le flambement linéaire aux valeurs propres sont implémentés. Statique, P–Δ, modal et flambement acceptent les rotules d’extrémité. Les modes de stabilité utilisent des rotations internes de rotule indépendantes. Les grandes déformations corotationnelles et la non-linéarité matériau sont hors périmètre.","Están implementados la estática lineal, P–Δ por estado inicial, modal no amortiguado y pandeo lineal por autovalores. Estática, P–Δ, modal y pandeo admiten rótulas de extremo. Los modos de estabilidad usan rotaciones internas de rótula independientes. El análisis corrotacional de grandes desplazamientos y la no linealidad material quedan fuera de esta herramienta.","Zaimplementowano statykę liniową, initial-stress P–Δ, analizę modalną bez tłumienia i liniowe wyboczenie własne. Statyka, P–Δ, modalna i wyboczenie obsługują przeguby końcowe. Tryby stateczności używają niezależnych wewnętrznych obrotów przegubów. Analiza korotacyjna dużych przemieszczeń i nieliniowość materiałowa są poza zakresem narzędzia."],"Modal solved detail":["Undamped free-vibration eigenproblem Kφ = λMφ solved by sparse inverse subspace iteration and Rayleigh–Ritz projection.","Розв’язано задачу вільних недемпфованих коливань Kφ = λMφ розрідженою оберненою підпросторовою ітерацією з проєкцією Релея—Рітца.","Das ungedämpfte Eigenproblem Kφ = λMφ wurde mit dünnbesetzter inverser Unterraumiteration und Rayleigh–Ritz-Projektion gelöst.","Het ongedempte eigenprobleem Kφ = λMφ is opgelost met ijle inverse subruimte-iteratie en Rayleigh–Ritz-projectie.","Le problème propre non amorti Kφ = λMφ est résolu par itération inverse de sous-espace creuse et projection de Rayleigh–Ritz.","El problema propio no amortiguado Kφ = λMφ se resolvió mediante iteración inversa dispersa de subespacios y proyección Rayleigh–Ritz.","Niedampowane zagadnienie własne Kφ = λMφ rozwiązano rzadką odwrotną iteracją podprzestrzeni z projekcją Rayleigha–Ritza."],"Physical mass hint":["Σ μL + nodal translational masses","Σ μL + вузлові поступальні маси","Σ μL + translatorische Knotenmassen","Σ μL + translationele knoopmassa’s","Σ μL + masses nodales translationnelles","Σ μL + masas nodales traslacionales","Σ μL + translacyjne masy węzłowe"],"Modal normalization note":["Modes are generalized-mass normalized: Γ = φᵀMr and M* = Γ². Effective-mass percentages use the active free translational mass in global X/Y; restrained and rotational DOFs are excluded. The displayed shape amplitude is arbitrary.","Форми нормовані за узагальненою масою: Γ = φᵀMr і M* = Γ². Відсотки ефективної маси використовують активну вільну поступальну масу в глобальних X/Y; закріплені та обертальні ступені свободи виключено. Амплітуда показаної форми довільна.","Die Moden sind auf generalisierte Masse normiert: Γ = φᵀMr und M* = Γ². Effektivmassen-Prozente beziehen sich auf die aktive freie Translationsmasse in global X/Y; gesperrte und rotatorische Freiheitsgrade sind ausgeschlossen. Die dargestellte Amplitude ist beliebig.","Modi zijn genormaliseerd op gegeneraliseerde massa: Γ = φᵀMr en M* = Γ². Percentages effectieve massa gebruiken de actieve vrije translatiemassa in globale X/Y; geblokkeerde en rotatie-DOF’s zijn uitgesloten. De getoonde amplitude is willekeurig.","Les modes sont normalisés par la masse généralisée : Γ = φᵀMr et M* = Γ². Les pourcentages de masse effective utilisent la masse translationnelle libre active en X/Y globaux ; les DDL bloqués et rotationnels sont exclus. L’amplitude affichée est arbitraire.","Los modos están normalizados por masa generalizada: Γ = φᵀMr y M* = Γ². Los porcentajes de masa efectiva usan la masa traslacional libre activa en X/Y globales; se excluyen GDL restringidos y rotacionales. La amplitud mostrada es arbitraria.","Postacie są normalizowane masą uogólnioną: Γ = φᵀMr i M* = Γ². Procenty masy efektywnej odnoszą się do aktywnej swobodnej masy translacyjnej w globalnych X/Y; pomija się zablokowane i obrotowe DOF. Amplituda wyświetlanej postaci jest umowna."],"Buckling solved prefix":["Linearized buckling factors scale the selected reference load set ","Лінеаризовані множники стійкості масштабують вибраний опорний набір навантажень ","Linearisierte Knickfaktoren skalieren den gewählten Referenzlastsatz ","Gelineariseerde knikfactoren schalen de gekozen referentiebelastingsset ","Les facteurs de flambement linéarisés multiplient le jeu de charges de référence sélectionné ","Los factores de pandeo linealizados escalan el conjunto de carga de referencia seleccionado ","Zlinearyzowane mnożniki wyboczenia skalują wybrany referencyjny zestaw obciążeń "],"Buckling solved suffix":[". Kφ = λKgφ uses the static axial-force field.",". Kφ = λKgφ використовує статичне поле осьових сил.",". Kφ = λKgφ verwendet das statische Normalkraftfeld.",". Kφ = λKgφ gebruikt het statische normaalkrachtveld.",". Kφ = λKgφ utilise le champ statique des efforts axiaux.",". Kφ = λKgφ usa el campo estático de fuerzas axiales.",". Kφ = λKgφ wykorzystuje statyczne pole sił osiowych."],"Buckling interpretation note":["The eigenvector amplitude is arbitrary. A factor multiplies the entire selected reference load case/combination, including thermal loads. This is linear eigenvalue buckling, not a second-order equilibrium path or imperfection analysis.","Амплітуда власного вектора довільна. Множник масштабує весь вибраний опорний випадок/комбінацію, включно з температурними навантаженнями. Це лінійна власна стійкість, а не траєкторія рівноваги другого порядку чи аналіз недосконалостей.","Die Eigenvektoramplitude ist beliebig. Ein Faktor skaliert den gesamten gewählten Referenzlastfall bzw. die Kombination einschließlich Temperaturlasten. Dies ist lineares Eigenwertknicken, kein Gleichgewichtspfad II. Ordnung und keine Imperfektionsanalyse.","De eigenvectoramplitude is willekeurig. Een factor schaalt de volledige gekozen referentielast of combinatie, inclusief thermische belastingen. Dit is lineaire eigenwaarde-knik, geen tweede-orde-evenwichtspad of imperfectieanalyse.","L’amplitude du vecteur propre est arbitraire. Le facteur multiplie tout le cas/combinaison de référence, charges thermiques comprises. Il s’agit d’un flambement linéaire aux valeurs propres, pas d’un chemin d’équilibre du second ordre ni d’une analyse d’imperfections.","La amplitud del autovector es arbitraria. El factor escala todo el caso/combinación de referencia, incluidas las cargas térmicas. Es pandeo lineal por autovalores, no una trayectoria de equilibrio de segundo orden ni un análisis de imperfecciones.","Amplituda wektora własnego jest umowna. Mnożnik skaluje cały wybrany referencyjny przypadek/kombinację, łącznie z obciążeniami termicznymi. To liniowe wyboczenie własne, a nie ścieżka równowagi II rzędu ani analiza imperfekcji."],"Second-order solved prefix":["Initial-stress P–Δ continuation solved (K − λKg)u = λF through ","Розв’язано initial-stress P–Δ (K − λKg)u = λF через ","Initial-stress P–Δ (K − λKg)u = λF wurde über ","Initial-stress P–Δ (K − λKg)u = λF is opgelost via ","Le P–Δ par état initial (K − λKg)u = λF est résolu en ","P–Δ por estado inicial (K − λKg)u = λF se resolvió mediante ","Initial-stress P–Δ (K − λKg)u = λF rozwiązano przez "],"proportional load steps":[" proportional load steps."," пропорційних кроків навантаження."," proportionale Lastschritte."," proportionele belastingsstappen."," pas de charge proportionnels."," pasos de carga proporcionales."," proporcjonalnych kroków obciążenia."],"Second-order interpretation note":["This is an initial-stress P–Δ continuation with proportional loading, not a corotational large-displacement Newton solution. Member axial forces defining Kg are taken from the selected first-order reference result and scale with λ.","Це initial-stress P–Δ з пропорційним навантаженням, а не коротаційний Newton-розрахунок великих переміщень. Осьові сили елементів, що визначають Kg, беруться з вибраного першопорядкового результату та масштабуються з λ.","Dies ist eine initial-stress P–Δ-Fortsetzung mit proportionaler Belastung, keine korotationale Newton-Lösung für große Verschiebungen. Die Stabnormalkräfte für Kg stammen aus dem gewählten Ergebnis erster Ordnung und skalieren mit λ.","Dit is initial-stress P–Δ met proportionele belasting, geen corotationele Newton-oplossing voor grote verplaatsingen. De normaalkrachten voor Kg komen uit het gekozen eerste-orde-resultaat en schalen met λ.","Il s’agit d’un P–Δ par état initial avec chargement proportionnel, pas d’une solution Newton corotationnelle en grandes déformations. Les efforts axiaux définissant Kg viennent du résultat du premier ordre sélectionné et sont multipliés par λ.","Es P–Δ por estado inicial con carga proporcional, no una solución Newton corrotacional de grandes desplazamientos. Los axiles que definen Kg proceden del resultado de primer orden seleccionado y escalan con λ.","Jest to initial-stress P–Δ z obciążeniem proporcjonalnym, a nie korotacyjne rozwiązanie Newtona dla dużych przemieszczeń. Siły osiowe definiujące Kg pochodzą z wybranego wyniku I rzędu i skalują się z λ."],"Static solved detail":["Linear static equilibrium and compatibility satisfied within the sparse-solver residual.","Лінійну статичну рівновагу та сумісність виконано в межах нев’язки розрідженого розв’язувача.","Lineares statisches Gleichgewicht und Verträglichkeit sind innerhalb des Residuums des dünnbesetzten Lösers erfüllt.","Lineair statisch evenwicht en compatibiliteit zijn voldaan binnen het residu van de ijle oplosser.","L’équilibre statique linéaire et la compatibilité sont satisfaits dans la limite du résidu du solveur creux.","El equilibrio estático lineal y la compatibilidad se satisfacen dentro del residuo del solucionador disperso.","Liniowa równowaga statyczna i zgodność są spełnione w granicach residuum rozwiązania rzadkiego."],"superposition":["superposition","суперпозиція","Superposition","superpositie","superposition","superposición","superpozycja"],"relative residual ":["relative residual ","відносна нев’язка ","relatives Residuum ","relatief residu ","résidu relatif ","residuo relativo ","residuum względne "],"Combination assembled from solved base cases":["Combination assembled from solved base cases","Комбінацію зібрано з розв’язаних базових випадків","Kombination aus gelösten Grundlastfällen zusammengesetzt","Combinatie samengesteld uit opgeloste basisgevallen","Combinaison assemblée à partir des cas de base résolus","Combinación ensamblada a partir de casos base resueltos","Kombinacja złożona z rozwiązanych przypadków bazowych"],"Solver footer":["3 physical DOF per node plus internal hinge rotations where released. Static uses sparse CSR + PCG; P–Δ continuation solves (K − λKg)u = λF from the selected static pre-stress state; modal uses consistent mass; buckling solves Kφ = λKgφ.","3 фізичні ступені свободи на вузол плюс внутрішні обертання шарнірів у звільнених кінцях. Статика: розріджений CSR + PCG; P–Δ: (K − λKg)u = λF з вибраного попередньо напруженого статичного стану; модальний режим: узгоджена маса; стійкість: Kφ = λKgφ.","3 physische Freiheitsgrade je Knoten plus interne Gelenkrotationen an freigegebenen Enden. Statik: dünnbesetztes CSR + PCG; P–Δ: (K − λKg)u = λF aus dem gewählten statischen Vorspannungszustand; Modal: konsistente Masse; Knicken: Kφ = λKgφ.","3 fysieke DOF per knoop plus interne scharnierrotaties aan vrijgegeven uiteinden. Statica: ijle CSR + PCG; P–Δ: (K − λKg)u = λF vanuit de gekozen statische voorspanning; modaal: consistente massa; knik: Kφ = λKgφ.","3 DDL physiques par nœud plus rotations internes de rotule aux extrémités libérées. Statique : CSR creux + PCG ; P–Δ : (K − λKg)u = λF à partir de la précontrainte statique sélectionnée ; modal : masse cohérente ; flambement : Kφ = λKgφ.","3 GDL físicos por nodo más rotaciones internas de rótula en extremos liberados. Estática: CSR disperso + PCG; P–Δ: (K − λKg)u = λF desde el estado estático pretensado seleccionado; modal: masa consistente; pandeo: Kφ = λKgφ.","3 fizyczne DOF na węzeł plus wewnętrzne obroty przegubów na zwolnionych końcach. Statyka: rzadkie CSR + PCG; P–Δ: (K − λKg)u = λF z wybranego statycznego stanu wstępnego; modalna: masa spójna; wyboczenie: Kφ = λKgφ."],"Drawing interaction help":["2D frame drawing. Enter or Space cycles selection, arrows move selected nodes by the snap step, Delete removes the selection.","Креслення 2D рами. Enter або Space циклічно змінює вибір, стрілки переміщують вибрані вузли на крок прив’язки, Delete видаляє вибір.","2D-Rahmenzeichnung. Enter oder Leertaste wechselt die Auswahl, Pfeiltasten verschieben ausgewählte Knoten um den Fangschritt, Entf löscht die Auswahl.","2D-raamwerktekening. Enter of spatie wisselt de selectie, pijltjes verplaatsen geselecteerde knopen met de snapstap, Delete verwijdert de selectie.","Dessin du portique 2D. Entrée ou Espace parcourt la sélection, les flèches déplacent les nœuds sélectionnés du   var loads=last&&last.ok&&(last.kind==='static'||last.kind==='buckling'||last.kind==='secondorder')?effectiveLoads():{nodes:{},members:{},points:[]};var lm=0;Object.keys(loads.nodes).forEach(function(k){var z=loads.nodes[k];lm=Math.max(lm,Math.sqrt(z.Fx*z.Fx+z.Fy*z.Fy));});loads.points.forEach(function(p){lm=Math.max(lm,Math.sqrt(p.Px*p.Px+p.Py*p.Py));});lm=lm||1;

  loads.points.forEach(function(p){var e=memberById(state,p.member);if(!e)return;var a=nodeById(state,e.a),b=nodeById(state,e.b);if(!a||!b)return;var x=a.x+(b.x-a.x)*p.xi,y=a.y+(b.y-a.y)*p.xi,mag=Math.sqrt(p.Px*p.Px+p.Py*p.Py);if(mag>1e-9){ctx.strokeStyle=DiagramUI.series(5);drawArrow(ctx,m.X(x)-p.Px/mag*30,m.Y(y)+p.Py/mag*30,m.X(x),m.Y(y),7);}});

function resultPayload(){
  if(!last||!last.ok)return {verdict:{tone:'bad',title:L("Model not solved"),text:(last&&last.errors||['No result']).join(' · ')},notes:last&&last.warnings||[]};
  if(last.kind==='modal'){
    var idx=Math.max(0,Math.min(last.modes.length-1,state.modeIndex-1)),mo=last.modes[idx],mp=mo.participation||{},rows=last.modes.map(function(q){var z=q.participation||{};return {cells:[q.index,{value:q.frequency_hz,precision:5},{value:q.period_s,precision:6},{value:z.gamma_x||0,precision:4},{value:100*(z.effective_mass_ratio_x||0),precision:2},{value:z.gamma_y||0,precision:4},{value:100*(z.effective_mass_ratio_y||0),precision:2}]};});
    return {verdict:{tone:'ok',title:S('Modal solution')+' · '+last.modes.length+' '+S('Mode').toLowerCase(),text:S('Modal solved detail')},tiles:[
      {label:L("Selected mode"),value:String(mo.index)},
      {label:L("Frequency"),value:mo.frequency_hz,unit:'Hz',precision:5,learn:'modal'},
      {label:L("Period"),value:mo.period_s,unit:'s',precision:6},
      {label:L("Eff. mass X"),value:100*(mp.effective_mass_ratio_x||0),unit:'%',precision:2,learn:'modal'},
      {label:L("Eff. mass Y"),value:100*(mp.effective_mass_ratio_y||0),unit:'%',precision:2,learn:'modal'},
      {label:L("Physical mass"),value:last.physicalMass,unit:'kg',precision:3,hint:S('Physical mass hint')}
    ],tables:[{title:L("Natural frequencies & participation"),head:[{label:L("Mode")},{label:'f',num:true},{label:'T',num:true},{label:'Γx',num:true},{label:'M*x',num:true},{label:'Γy',num:true},{label:'M*y',num:true}],rows:rows,units:['','Hz','s','','%','','%']}],notes:(last.warnings||[]).concat([S('Modal normalization note')])};
  }
  if(last.kind==='buckling'){
    var bx=Math.max(0,Math.min(last.modes.length-1,state.modeIndex-1)),bo=last.modes[bx],brows=last.modes.map(function(q){return {cells:[q.index,{value:q.factor,precision:6},{value:q.scaled_max_compression_N/1000,precision:3},{value:q.mu,precision:8}]};});
    return {verdict:{tone:'ok',title:S('Eigenvalue buckling')+' · '+S('factor')+' '+DiagramUI.fmt(last.modes[0].factor,{precision:5}),text:S('Buckling solved prefix')+last.activeKey+S('Buckling solved suffix')},tiles:[
      {label:L("Selected mode"),value:String(bo.index)},
      {label:L("Load factor"),value:bo.factor,precision:6},
      {label:L("Critical factor"),value:last.modes[0].factor,precision:6,learn:'buckling'},
      {label:L("Reference max compression"),value:last.maxReferenceCompression/1000,unit:'kN',precision:3},
      {label:L("Scaled max compression"),value:bo.scaled_max_compression_N/1000,unit:'kN',precision:3},
      {label:L("Subspace iteration"),value:String(last.iterations)+' it.',hint:last.converged?'eigenvalue convergence reached':'iteration limit reached; refine/check spectrum'}
    ],tables:[{title:L("Buckling factors"),head:[{label:L("Mode")},{label:L("Load factor"),num:true},{label:L("scaled max comp."),num:true},{label:'μ = 1/λ',num:true}],rows:brows,units:['','','kN','']}],notes:(last.warnings||[]).concat([S('Buckling interpretation note')])};
  }
  if(last.kind==='secondorder'){
    var so=last.summary,sr=last.active,prows=last.path.map(function(q){return {cells:[{value:q.factor,precision:5},{value:q.max_free_dof_abs*1000,precision:4},q.iterations,{value:q.residual,precision:3}]};});
    var smrows=[];last.geoms.forEach(function(g){var rr=sr.members[g.m.id],sm=sampleMember(g,rr,50),mn=0,mv=0,mmx=0;sm.forEach(function(p){mn=Math.max(mn,Math.abs(p.N));mv=Math.max(mv,Math.abs(p.V));mmx=Math.max(mmx,Math.abs(p.M));});smrows.push({cells:[g.m.id,g.m.section,{value:g.L,precision:3},{value:mn/1000,precision:2},{value:mv/1000,precision:2},{value:mmx/1000,precision:2}]});});
    return {verdict:{tone:'ok',title:S('Second-order')+' · '+last.activeKey+' × '+DiagramUI.fmt(last.loadFactor,{precision:4}),text:S('Second-order solved prefix')+last.path.length+S('proportional load steps')},tiles:[
      {label:L("Target load factor"),value:last.loadFactor,precision:5},{label:L("Max translation"),value:so.max_translation_m*1000,unit:'mm',precision:3},{label:L("Linear-at-target translation"),value:last.linearAtTarget.max_translation_m*1000,unit:'mm',precision:3},{label:L("P–Δ amplification"),value:last.amplification,precision:5,learn:'secondorder'},{label:'Max |M|',value:so.max_abs_M_Nm/1000,unit:'kN·m',precision:2},{label:L("Reference max compression"),value:last.maxReferenceCompression/1000,unit:'kN',precision:3}
    ],tables:[{title:L("Continuation path"),head:[{label:L("factor"),num:true},{label:L("max free DOF"),num:true},{label:L("PCG it."),num:true},{label:L("residual"),num:true}],rows:prows,units:['','mm','','']},{title:L("Member envelope at target"),head:[{label:L("Member")},{label:L("Section")},{label:'L',num:true},{label:'max |N|',num:true},{label:'max |V|',num:true},{label:'max |M|',num:true}],rows:smrows,units:['','','m','kN','kN','kN·m']}],notes:(last.warnings||[]).concat([S('Second-order interpretation note')])};
  }
  var s=last.summary,res=last.active;
  var rrows=[];state.nodes.forEach(function(n,i){var rx=n.fixX?res.R[3*i]:0,ry=n.fixY?res.R[3*i+1]:0,rm=n.fixR?res.R[3*i+2]:0,sx=n.kx?(-n.kx*res.u[3*i]):0,sy=n.ky?(-n.ky*res.u[3*i+1]):0,sm=n.kr?(-n.kr*res.u[3*i+2]):0;if(Math.max(Math.abs(rx),Math.abs(ry),Math.abs(rm),Math.abs(sx),Math.abs(sy),Math.abs(sm))>1e-9)rrows.push({cells:[n.id,{value:rx+sx,precision:1},{value:ry+sy,precision:1},{value:rm+sm,precision:1}]});});
  var mrows=[];last.geoms.forEach(function(g){var rr=res.members[g.m.id],sm=sampleMember(g,rr,50),mn=0,mv=0,mm=0;sm.forEach(function(p){mn=Math.max(mn,Math.abs(p.N));mv=Math.max(mv,Math.abs(p.V));mm=Math.max(mm,Math.abs(p.M));});mrows.push({cells:[g.m.id,g.m.section,{value:g.L,precision:3},{value:mn/1000,precision:2},{value:mv/1000,precision:2},{value:mm/1000,precision:2}]});});
  return {verdict:{tone:'ok',title:S('Solved')+' · '+last.activeKey,text:S('Static solved detail')},tiles:[
    {label:L("Max translation"),value:s.max_translation_m*1000,unit:'mm',precision:3,learn:'results'},
    {label:L("Max rotation"),value:s.max_rotation_rad*1000,unit:'mrad',precision:3},
    {label:'Max |N|',value:s.max_abs_N_N/1000,unit:'kN',precision:2},
    {label:'Max |V|',value:s.max_abs_V_N/1000,unit:'kN',precision:2},
    {label:'Max |M|',value:s.max_abs_M_Nm/1000,unit:'kN·m',precision:2},
    {label:L("Sparse solve"),value:res.combined?S('superposition'):String(res.iterations)+' it.',hint:res.combined?S('Combination assembled from solved base cases'):S('relative residual ')+DiagramUI.fmt(res.residual||0,{precision:2})}
  ],tables:[
    {title:L("Reactions and spring forces"),head:[{label:L("Node")},{label:'Rx',num:true},{label:'Ry',num:true},{label:'Mz',num:true}],rows:rrows,units:['','N','N','N·m']},
    {title:L("Member envelope in active set"),head:[{label:L("Member")},{label:L("Section")},{label:'L',num:true},{label:'max |N|',num:true},{label:'max |V|',num:true},{label:'max |M|',num:true}],rows:mrows,units:['','','m','kN','kN','kN·m']}
  ],notes:last.warnings};
}

    learn:{
      version:1,
      intro:{title:L("2D Frame / FEM Workbench"),body:L("Build a planar beam-column model, assign stiffness and mass, define supports and loads, then choose the analysis you need. The same geometry drives linear static, initial-stress P–Δ continuation, undamped modal analysis and linear eigenvalue buckling. Start with geometry and restraints; then assign sections and loads; finally select the analysis mode and inspect the stage and result tables.")},
      topics:{
        workflow:{title:L("A reliable modelling sequence"),body:L("Use this order: geometry → restraints/springs → section properties → load cases and loads → combinations → analysis mode → results. Most failed models are not solver failures; they are mechanisms, missing section properties, missing mass in modal analysis, or a reference load state that contains no compression for buckling.")},
        presets:{title:L("Start from a preset when learning"),body:L("The Examples panel contains solved teaching models, not hidden templates. Load one, then inspect and edit the same nodes, members, sections and loads you would create yourself. Presets cover beams, frames, thermal restraint, springs, load combinations, member point loads, nodal mass, P–Δ continuation, modal analysis and buckling.")},
        analysis:{title:L("Choose the analysis model"),body:L("Linear static solves K u = F. Second order uses an initial-stress geometric stiffness and proportional continuation, (K − λKg)u = λF. Modal solves Kφ = ω²Mφ with consistent member mass and optional nodal mass. Buckling solves Kφ = λKgφ using the selected static load set as the reference pre-stress state.")},
        geometry:{title:L("Geometry and direct manipulation"),body:L("Nodes carry three planar degrees of freedom: ux, uy and rz. Members are prismatic Euler–Bernoulli beam-column elements between two nodes. Add nodes on the snap grid, connect them with members, and drag nodes in Select mode. Dragging changes geometry only; the framework commits and recomputes after the move.")},
        restraints:{title:L("Restraints and springs"),body:L("Fix X, Y or Rz to suppress a nodal degree of freedom. Translational and rotational springs add kx, ky and kr directly to the global stiffness. A stable model needs enough restraint to remove rigid-body mechanisms, but springs may provide that restraint instead of fixed DOFs.")},
        sections:{title:L("Section properties"),body:L("E, A and I define elastic stiffness. α is used for uniform member temperature change. μ is member mass per unit length and is required for member-mass modal analysis. These are arbitrary user-entered properties: the tool does not select a catalogue section or perform a code check.")},
        loads:{title:L("Loads and reference states"),body:L("Nodal loads act at nodes. Member loads currently support full-member uniform loads in global X/Y, uniform ΔT and arbitrary member point forces. Buckling and second-order analysis first solve the selected load case or combination; its member axial forces define the geometric-stiffness reference state.")},
        combinations:{title:L("Load combinations"),body:L("Combinations are linear superpositions of solved base cases. Write formulas such as 1.35*G + 1.5*Q. The parser accepts case IDs, signs, decimal coefficients and scientific notation. Combinations are valid reference states for second-order and buckling analysis.")},

        modal:{title:L("Undamped modal analysis"),body:L("Natural frequencies come from Kφ = ω²Mφ. Member μ builds a consistent beam mass matrix; nodal mass and rotary inertia may be added at nodes. Mode shapes are generalized-mass normalized. For each mode the tool reports global X/Y participation Γ = φᵀMr and effective modal mass M* = Γ², with percentages relative to the active free translational mass in that direction. No damping, forcing, response spectrum or transient integration is included.")},
        buckling:{title:L("Linear eigenvalue buckling"),body:L("The selected static load set supplies member axial forces. Compressive force creates the destabilizing geometric stiffness; the eigenvalue λ is the proportional multiplier on that reference load state. The result is an ideal bifurcation factor, not an imperfection-sensitive design resistance.")},
