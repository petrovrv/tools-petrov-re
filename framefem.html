  "summary": {
    "en": "Build planar beam-column frames and run linear static, initial-stress P–Δ second-order, undamped modal or eigenvalue-buckling FEM: supports, springs, loads and combinations, reactions, deflections, N/V/M diagrams, natural frequencies, mode shapes and critical load factors.",
    "uk": "Моделюйте плоскі стрижневі рами й виконуйте лінійний статичний, P–Δ другого порядку, недемпфований модальний або власний розрахунок втрати стійкості: опори, пружини, навантаження, реакції, переміщення, N/V/M, власні частоти, форми та критичні множники навантаження.",
    "de": "Ebene Stabrahmen modellieren und linear-statisch, mit initialer Spannungssteifigkeit nach Theorie II. Ordnung, ungedämpft modal oder per Eigenwert-Knickanalyse berechnen: Lager, Federn, Lasten, Reaktionen, Verformungen, N/V/M, Eigenfrequenzen, Eigenformen und kritische Lastfaktoren.",
    "nl": "Modelleer vlakke staafraamwerken en voer lineair-statische, initial-stress P–Δ tweede-orde, ongedempte modale of eigenwaarde-knikanalyse uit: opleggingen, veren, lasten, reacties, vervormingen, N/V/M, eigenfrequenties, vormen en kritieke belastingsfactoren.",
    "fr": "Modélisez des portiques plans en statique linéaire, second ordre P–Δ par contrainte initiale, modal non amorti ou flambement linéaire aux valeurs propres : appuis, ressorts, charges, réactions, déplacements, N/V/M, fréquences, modes et facteurs critiques de charge.",
    "es": "Modele pórticos planos y ejecute FEM estático lineal, segundo orden P–Δ por tensión inicial, modal no amortiguado o pandeo lineal por autovalores: apoyos, resortes, cargas, reacciones, desplazamientos, N/V/M, frecuencias, modos y factores críticos de carga.",
    "pl": "Modeluj płaskie ramy prętowe i wykonuj liniową statykę, analizę II rzędu P–Δ ze sztywnością od naprężeń wstępnych, analizę modalną lub liniową analizę wyboczeniową MES: podpory, sprężyny, obciążenia, reakcje, przemieszczenia, N/V/M, częstotliwości, postacie i krytyczne mnożniki obciążenia."

  "description": {
    "en": "A browser finite-element pre/postprocessor for planar Euler–Bernoulli frames. Linear static analysis assembles a sparse global stiffness matrix, solves base load cases with diagonally preconditioned conjugate gradients, superposes combinations and recovers reactions, displacements and N/V/M diagrams. Initial-stress P–Δ continuation solves (K−λKg)u=λF along proportional load steps using the selected static result as the reference axial-force field. Modal analysis solves Kφ=λMφ with a consistent mass matrix. Linear eigenvalue buckling uses the selected static result as the pre-stress state, assembles signed geometric stiffness from member axial forces and solves Kφ=λKgφ for proportional load factors. Geometry editing, state, report and export use the shared framework.",
    "uk": "Браузерний скінченно-елементний пре-/постпроцесор для плоских рам Ейлера—Бернуллі. Лінійна статика збирає розріджену матрицю жорсткості, розв’язує базові випадки PCG, суперпонує комбінації та відновлює реакції, переміщення й N/V/M. Другий порядок P–Δ розв’язує (K−λKg)u=λF кроками пропорційного навантаження з осьових сил вибраного статичного стану. Модальний режим додає узгоджену матрицю мас елемента з погонної та вузлової маси/інерції й розв’язує Kφ=λMφ методом обернених підпросторових ітерацій із проєкцією Релея—Рітца. Лінійна власна стійкість використовує вибраний статичний результат як попередньо напружений стан, збирає знакову геометричну жорсткість із поздовжніх сил і розв’язує Kφ=λKgφ.",
    "de": "Browser-FE-Prä-/Postprozessor für ebene Euler-Bernoulli-Rahmen. Die lineare Statik assembliert eine dünnbesetzte Steifigkeitsmatrix, löst Grundlastfälle mit vorkonditionierten konjugierten Gradienten, überlagert Kombinationen und gewinnt Reaktionen, Verschiebungen und N/V/M zurück. Die P–Δ-Fortsetzung löst (K−λKg)u=λF in proportionalen Lastschritten aus dem gewählten statischen Axialkraftzustand. Modal wird eine konsistente Rahmen-Massenmatrix aus Stabmasse je Länge sowie optionalen Knotenmasse/-trägheit ergänzt und Kφ=λMφ per inverser Unterraumiteration mit Rayleigh–Ritz-Projektion gelöst. Die lineare Eigenwert-Knickanalyse nutzt den gewählten statischen Lastzustand als Vorspannung, assembliert die vorzeichenbehaftete geometrische Steifigkeit aus den Normalkräften und löst Kφ=λKgφ.",
    "nl": "Browser-FE-pre/postprocessor voor vlakke Euler–Bernoulli-raamwerken. Lineaire statica assembleert een ijle stijfheidsmatrix, lost basislastgevallen op met voorgeconditioneerde geconjugeerde gradiënten, superponeert combinaties en herleidt reacties, verplaatsingen en N/V/M. P–Δ tweede orde lost (K−λKg)u=λF op in proportionele belastingsstappen vanuit het gekozen statische normaalkrachtveld. Modaal wordt een consistente raammassamatrix toegevoegd uit massa per lengte plus optionele knoopmassa/-traagheid en wordt Kφ=λMφ opgelost met inverse subruimte-iteratie en Rayleigh–Ritz-projectie. Lineaire eigenwaarde-knik gebruikt het gekozen statische resultaat als voorspanning, assembleert getekende geometrische stijfheid uit normaalkrachten en lost Kφ=λKgφ op.",
    "fr": "Pré/postprocesseur EF navigateur pour portiques plans d’Euler–Bernoulli. La statique linéaire assemble une matrice de rigidité creuse, résout les cas de base par gradients conjugués préconditionnés, superpose les combinaisons et restitue réactions, déplacements et N/V/M. Le second ordre P–Δ résout (K−λKg)u=λF par pas de charge proportionnels à partir des efforts axiaux statiques sélectionnés. Le modal ajoute la matrice de masse cohérente issue de la masse linéique et des masses/inerties nodales optionnelles, puis résout Kφ=λMφ par itération inverse de sous-espace et projection de Rayleigh–Ritz. Le flambement linéaire aux valeurs propres prend le résultat statique sélectionné comme précontrainte, assemble la rigidité géométrique signée des efforts axiaux et résout Kφ=λKgφ.",
    "es": "Pre/postprocesador FEM en navegador para pórticos planos Euler–Bernoulli. La estática lineal ensambla una matriz de rigidez dispersa, resuelve casos base con gradiente conjugado precondicionado, superpone combinaciones y recupera reacciones, desplazamientos y N/V/M. El segundo orden P–Δ resuelve (K−λKg)u=λF por pasos de carga proporcionales desde el campo axial estático seleccionado. El modal añade la matriz de masa consistente a partir de masa lineal y masas/inercias nodales opcionales y resuelve Kφ=λMφ mediante iteración inversa de subespacios y proyección Rayleigh–Ritz. El pandeo lineal por autovalores usa el resultado estático seleccionado como estado pretensado, ensambla la rigidez geométrica con signo a partir de fuerzas axiales y resuelve Kφ=λKgφ.",
    "pl": "Przeglądarkowy pre-/postprocesor MES dla płaskich ram Eulera–Bernoulliego. Statyka liniowa składa rzadką macierz sztywności, rozwiązuje przypadki bazowe metodą PCG, superponuje kombinacje i odzyskuje reakcje, przemieszczenia oraz N/V/M. Analiza II rzędu P–Δ rozwiązuje (K−λKg)u=λF krokami proporcjonalnego obciążenia z wybranego statycznego pola sił osiowych. Analiza modalna dodaje spójną macierz masy z masy liniowej oraz opcjonalnych mas/bezwładności węzłowych i rozwiązuje Kφ=λMφ odwrotną iteracją podprzestrzeni z projekcją Rayleigha–Ritza. Liniowa analiza wyboczeniowa przyjmuje wybrany wynik statyczny jako stan wstępnego naprężenia, składa znakowaną sztywność geometryczną z sił osiowych i rozwiązuje Kφ=λKgφ."
  },

  "limitations": {
    "en": "Planar prismatic Euler–Bernoulli frame elements, small displacement, linear elasticity. Static, initial-stress P–Δ, undamped modal and linear eigenvalue-buckling analyses support local end-moment releases (hinges); stability analyses represent each released end by an independent internal rotational DOF; no shear deformation, member offsets, plasticity/material nonlinearity, moving/partial distributed loads, section stress recovery or code checks. Second-order: initial-stress P–Δ only with proportional loading and Kg scaled from the selected first-order axial-force field; no corotational updated geometry, P–δ axial-strain update, imperfections or material nonlinearity. Buckling: linear eigenvalue analysis only; geometric stiffness uses average member axial force from the selected static reference result, so nonuniform axial force should be represented by member subdivision; no imperfections, initial crookedness, plasticity, load-path tracing or post-buckling. Modal: undamped free vibration only; member end releases are represented by independent internal rotational DOFs so their consistent-mass inertia is retained; no damping, forcing, response spectrum, transient response or prestress/geometric stiffness. Translational participation factors and effective modal masses are reported for global X/Y base-acceleration influence vectors; rotational participation is not reported. Member mass per length is uniform and uses the consistent frame mass matrix; optional nodal translational mass and rotary inertia are point quantities. The iterative solvers require a stable adequately constrained stiffness system.",
    "uk": "Плоскі призматичні елементи Ейлера—Бернуллі, малі переміщення, лінійна пружність. Статика, initial-stress P–Δ, недемпфований модальний аналіз і лінійна власна стійкість підтримують шарнірні звільнення кінцевого моменту; в аналізах стійкості кожен звільнений кінець має незалежний внутрішній обертальний ступінь свободи. Без зсувної деформації, ексцентриситетів елементів, пластичності/матеріальної нелінійності, рухомих або часткових розподілених навантажень, відновлення напружень і нормативних перевірок. Другий порядок: лише initial-stress P–Δ з пропорційним навантаженням і Kg з вибраного поля осьових сил першого порядку; без коротаційного оновлення геометрії, P–δ, недосконалостей і матеріальної нелінійності. Стійкість: лише лінійна власна задача; Kg використовує середню осьову силу елемента, тому нерівномірну силу слід моделювати поділом елементів; без недосконалостей, простеження шляху та посткритичної рівноваги. Модальний режим: лише вільні недемпфовані коливання; кінцеві шарніри мають незалежні внутрішні обертальні ступені свободи зі збереженням узгодженої маси; без демпфування, вимушення, спектрів, транзієнтів і геометричної жорсткості. Показуються поступальні коефіцієнти участі та ефективні модальні маси для глобальних X/Y; обертальна участь не показується.",
    "de": "Ebene prismatische Euler–Bernoulli-Elemente, kleine Verschiebungen und lineare Elastizität. Statik, initial-stress P–Δ, ungedämpfte Modalanalyse und lineare Eigenwert-Knickanalyse unterstützen Endmomentfreigaben; in den Stabilitätsanalysen wird jedes freigegebene Ende durch einen unabhängigen internen Rotationsfreiheitsgrad dargestellt. Keine Schubverformung, Stabversätze, Plastizität/Materialnichtlinearität, Wander- oder Teilstreckenlasten, Spannungsrückrechnung oder Normnachweise. II. Ordnung: nur initial-stress P–Δ mit proportionaler Belastung und Kg aus dem gewählten Normalkraftfeld erster Ordnung; keine korotationale Geometrieaktualisierung, kein P–δ, keine Imperfektionen oder Materialnichtlinearität. Knicken: nur lineare Eigenwertanalyse; Kg verwendet die mittlere Stabnormalkraft, daher nichtuniforme Normalkraft durch Stabteilung abbilden; keine Imperfektionen, Lastpfad- oder Nachbeulanalyse. Modal: nur ungedämpfte freie Schwingung; Endgelenke besitzen unabhängige interne Rotationsfreiheitsgrade mit erhaltener konsistenter Massenwirkung; keine Dämpfung, Erregung, Antwortspektren, Zeitintegration oder geometrische Steifigkeit. Translationsbezogene Partizipationsfaktoren und effektive Modalmassen werden für globale X/Y angegeben; keine rotatorische Partizipation.",
    "nl": "Vlakke prismatische Euler–Bernoulli-elementen, kleine verplaatsingen en lineaire elasticiteit. Statica, initial-stress P–Δ, ongedempte modale analyse en lineaire eigenwaarde-knik ondersteunen eindmomentvrijgaven; in stabiliteitsanalyses wordt elk vrijgegeven uiteinde weergegeven door een onafhankelijke interne rotatie-DOF. Geen afschuifvervorming, staaf-offsets, plasticiteit/materiaalnietlineariteit, bewegende of gedeeltelijke verdeelde belastingen, spanningsherleiding of normtoets. Tweede orde: alleen initial-stress P–Δ met proportionele belasting en Kg uit het gekozen eerste-orde normaalkrachtveld; geen corotationele geometrie-update, P–δ, imperfecties of materiaalnietlineariteit. Knik: alleen lineaire eigenwaarde-analyse; Kg gebruikt de gemiddelde staafnormaalkracht, dus niet-uniforme axiale kracht via staafdeling modelleren; geen imperfecties, lastpad of post-knik. Modaal: alleen ongedempte vrije trilling; eindscharnieren hebben onafhankelijke interne rotatie-DOF’s met behoud van consistente massa; geen demping, forcing, responsspectrum, transiënt of geometrische stijfheid. Translatieparticipatie en effectieve modale massa worden voor globale X/Y gegeven; geen rotatieparticipatie.",
    "fr": "Éléments plans prismatiques d’Euler–Bernoulli, petits déplacements et élasticité linéaire. La statique, le P–Δ par état de contrainte initial, le modal non amorti et le flambement linéaire aux valeurs propres acceptent les libérations de moment d’extrémité ; dans les analyses de stabilité, chaque extrémité libérée est représentée par un degré de liberté de rotation interne indépendant. Pas de déformation de cisaillement, excentrements de barre, plasticité/non-linéarité matériau, charges mobiles ou réparties partielles, restitution des contraintes ni vérification normative. Second ordre : uniquement P–Δ par état initial avec chargement proportionnel et Kg issu des efforts axiaux du premier ordre ; pas de mise à jour corotationnelle, P–δ, imperfections ou non-linéarité matériau. Flambement : valeurs propres linéaires seulement ; Kg utilise l’effort axial moyen de chaque barre, donc subdiviser pour un effort non uniforme ; pas d’imperfections, chemin de charge ni post-flambement. Modal : vibration libre non amortie seulement ; les rotules d’extrémité utilisent des DDL de rotation internes indépendants en conservant l’inertie de masse cohérente ; pas d’amortissement, forçage, spectre, transitoire ou rigidité géométrique. Participation translationnelle et masses modales effectives fournies en X/Y globaux ; pas de participation rotationnelle.",
    "es": "Elementos planos prismáticos Euler–Bernoulli, pequeños desplazamientos y elasticidad lineal. La estática, el P–Δ por estado de tensión inicial, el modal no amortiguado y el pandeo lineal por autovalores admiten liberaciones de momento en extremos; en los análisis de estabilidad cada extremo liberado se representa mediante un GDL rotacional interno independiente. Sin deformación por cortante, offsets de barra, plasticidad/no linealidad material, cargas móviles o distribuidas parciales, recuperación de tensiones ni comprobación normativa. Segundo orden: solo P–Δ por estado inicial con carga proporcional y Kg del campo axial de primer orden; sin actualización corrotacional, P–δ, imperfecciones o no linealidad material. Pandeo: solo autovalores lineales; Kg usa el axil medio de cada barra, por lo que un axil no uniforme debe modelarse subdividiendo; sin imperfecciones, trayectoria de carga ni pospandeo. Modal: solo vibración libre no amortiguada; las rótulas de extremo usan GDL rotacionales internos independientes conservando la inercia de masa consistente; sin amortiguamiento, excitación, espectro, transitorio ni rigidez geométrica. Se informan participación traslacional y masas modales efectivas en X/Y globales; no participación rotacional.",
    "pl": "Płaskie pryzmatyczne elementy Eulera–Bernoulliego, małe przemieszczenia i liniowa sprężystość. Statyka, initial-stress P–Δ, analiza modalna bez tłumienia i liniowe wyboczenie własne obsługują zwolnienia momentów końcowych; w analizach stateczności każdy zwolniony koniec ma niezależny wewnętrzny obrotowy stopień swobody. Brak odkształceń ścinania, mimośrodów prętów, plastyczności/nieliniowości materiałowej, obciążeń ruchomych lub częściowych rozłożonych, odzyskiwania naprężeń i sprawdzeń normowych. II rząd: tylko initial-stress P–Δ z obciążeniem proporcjonalnym i Kg z wybranego pola sił osiowych I rzędu; bez korotacyjnej aktualizacji geometrii, P–δ, imperfekcji i nieliniowości materiałowej. Wyboczenie: tylko liniowa analiza własna; Kg używa średniej siły osiowej pręta, więc niejednorodną siłę należy modelować przez podział pręta; bez imperfekcji, śledzenia ścieżki i postkrytycznej równowagi. Modalna: tylko swobodne drgania bez tłumienia; zwolnienia końcowe mają niezależne wewnętrzne obrotowe DOF z zachowaniem spójnej bezwładności masy; bez tłumienia, wymuszenia, spektrum, transjentów i sztywności geometrycznej. Podawane są translacyjne współczynniki udziału i efektywne masy modalne dla globalnych X/Y; bez udziału obrotowego."
  },

  "validation": {
    "basis": {
      "en": "41 benchmark cases total: 32 execute the exact MODEL block extracted from framefem.html without UI/DOM — 17 static, six modal, five buckling and four P–Δ cases. Nine further regressions execute generated standard-library Python exports. Release-aware P–Δ and buckling cases use independent internal hinge rotations and compare with closed-form tangent-stiffness and Euler-column references. Published analytical equations are cross-checked against MIT OCW, Harvey Mudd College, University of Maryland and UIUC sources; this is independent reference validation, not an independent software/code audit.",
      "uk": "Усього 41 контрольний випадок: 32 виконують точний блок MODEL без UI/DOM — 17 статичних, 6 модальних, 5 для втрати стійкості та 4 для P–Δ. Ще 9 регресій виконують згенерований Python зі стандартною бібліотекою. P–Δ і втрата стійкості з кінцевими шарнірами використовують незалежні внутрішні обертальні ступені свободи та звіряються з аналітичними формулами дотичної жорсткості й колони Ейлера. Опубліковані рівняння звірено з MIT OCW, Harvey Mudd College, University of Maryland та UIUC; це незалежна перевірка за зовнішніми еталонами, а не аудит коду сторонньою організацією.",
      "de": "Insgesamt 41 Benchmarkfälle: 32 führen den exakten MODEL-Block ohne UI/DOM aus — 17 statische, sechs modale, fünf Knick- und vier P–Δ-Fälle. Neun weitere Regressionen führen die erzeugten Standardbibliothek-Python-Exporte aus. P–Δ und Knicken mit Endgelenken verwenden unabhängige interne Rotationsfreiheitsgrade und werden gegen geschlossene Tangentialsteifigkeits- und Euler-Stützenreferenzen geprüft. Veröffentlichte Gleichungen werden mit Quellen von MIT OCW, Harvey Mudd College, University of Maryland und UIUC gegengeprüft; dies ist eine unabhängige Referenzvalidierung, kein unabhängiges Software-/Code-Audit.",
      "nl": "In totaal 41 benchmarkgevallen: 32 voeren exact het MODEL-blok uit zonder UI/DOM — 17 statische, zes modale, vijf knik- en vier P–Δ-gevallen. Negen extra regressies voeren de gegenereerde Python-export met alleen de standaardbibliotheek uit. P–Δ en knik met eindscharnieren gebruiken onafhankelijke interne rotatievrijheidsgraden en worden vergeleken met gesloten referenties voor tangentiële stijfheid en Euler-knik. Gepubliceerde vergelijkingen zijn gekruist met MIT OCW, Harvey Mudd College, University of Maryland en UIUC; dit is onafhankelijke referentievalidatie, geen onafhankelijke software-/code-audit.",
      "fr": "41 cas de référence au total : 32 exécutent exactement le bloc MODEL sans UI/DOM — 17 statiques, six modaux, cinq de flambement et quatre P–Δ. Neuf régressions supplémentaires exécutent les exports Python générés avec la seule bibliothèque standard. Les cas P–Δ et de flambement avec articulations d’extrémité utilisent des rotations internes indépendantes et sont comparés à des références analytiques fermées de rigidité tangente et de colonne d’Euler. Les équations publiées sont recoupées avec MIT OCW, Harvey Mudd College, University of Maryland et UIUC ; il s’agit d’une validation indépendante par références externes, et non d’un audit indépendant du logiciel/code.",
      "es": "41 casos de referencia en total: 32 ejecutan exactamente el bloque MODEL sin UI/DOM — 17 estáticos, seis modales, cinco de pandeo y cuatro P–Δ. Nueve regresiones adicionales ejecutan las exportaciones Python generadas solo con la biblioteca estándar. Los casos P–Δ y de pandeo con articulaciones de extremo usan rotaciones internas independientes y se comparan con referencias analíticas cerradas de rigidez tangente y columna de Euler. Las ecuaciones publicadas se contrastan con MIT OCW, Harvey Mudd College, University of Maryland y UIUC; esto es validación independiente mediante referencias externas, no una auditoría independiente del software/código.",
      "pl": "Łącznie 41 przypadków benchmarkowych: 32 uruchamiają dokładny blok MODEL bez UI/DOM — 17 statycznych, sześć modalnych, pięć wyboczeniowych i cztery P–Δ. Dziewięć dodatkowych regresji uruchamia generowane eksporty Python oparte wyłącznie na bibliotece standardowej. Przypadki P–Δ i wyboczenia ze zwolnieniami końcowymi używają niezależnych wewnętrznych obrotowych stopni swobody i są porównywane z zamkniętymi odniesieniami analitycznymi sztywności stycznej oraz kolumny Eulera. Opublikowane równania zestawiono ze źródłami MIT OCW, Harvey Mudd College, University of Maryland i UIUC; jest to niezależna walidacja względem zewnętrznych odniesień, a nie niezależny audyt oprogramowania/kodu."
    },
    "independent_validation": true,
    "benchmarks": [
