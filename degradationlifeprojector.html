   separate dose limit), concrete (carbonation k·√t fit or 1-D Fick chloride ingress), elastomer

var DL_VERSION = '2026-10-03.dl-2';
var DL_R = 8.314462618;            /* J/(mol·K) */
var DL_K0 = 273.15;
var DL_YEAR_S = 31557600;          /* 365.25 d */
var DL_TEMP_TOL = 0.5;             /* K, elastomer curve vs service */
var DL_COMP_TOL = 0.5;             /* percentage points */
var DL_MODES = ['cable', 'concrete', 'elastomer'];
var DL_CONCRETE = ['carbonation', 'chloride'];
var DL_STATUS = ['confirmed', 'rejected', 'unknown', 'not_applicable'];
var DL_DOSE = ['separate', 'not_applicable'];
var DL_DIRECTION = ['decreasing', 'increasing'];
var DL_DECISION = ['pending', 'approved', 'rejected'];

function dlNum(v) { return typeof v === 'number' && isFinite(v) ? v : null; }
function dlText(v) { return v === null || v === undefined ? '' : String(v).trim(); }
function dlNorm(v) { return dlText(v).toLowerCase().replace(/\s+/g, ' '); }

/* ---- error function to double precision: series below 1, continued fraction above ---- */
function dlErfc(x) {
  if (x < 0) return 2 - dlErfc(-x);
  if (x < 1) {
    var sum = x, term = x, x2 = x * x;
    for (var n = 1; n < 200; n++) { term *= -x2 / n; var add = term / (2 * n + 1); sum += add; if (Math.abs(add) < 1e-17 * Math.abs(sum)) break; }
    return 1 - 2 / Math.sqrt(Math.PI) * sum;
  }
  /* Lentz (converges in < 500 terms for x ≥ 1): erfc(x) = exp(-x²)/√π · 1/(x + (1/2)/(x + 1/(x + (3/2)/(x + …)))) */
  var tiny = 1e-300, f = x, C = x, D = 0;
  for (var k = 1; k < 500; k++) {
    var a = k / 2; D = x + a * D; if (D === 0) D = tiny; C = x + a / C; if (C === 0) C = tiny; D = 1 / D; var delta = C * D; f *= delta;
    if (Math.abs(delta - 1) < 1e-16) break;
  }
  return Math.exp(-x * x) / Math.sqrt(Math.PI) / f;
}
/* inverse of erfc on (0, 2): bisection bracket, then Newton */
function dlErfcInv(y) {
  if (!(y > 0 && y < 2)) return null;
  var lo = -6, hi = 6;
  for (var i = 0; i < 60; i++) { var mid = (lo + hi) / 2; if (dlErfc(mid) > y) lo = mid; else hi = mid; }
  var z = (lo + hi) / 2;
  for (var j = 0; j < 4; j++) { var g = dlErfc(z) - y, d = -2 / Math.sqrt(Math.PI) * Math.exp(-z * z); if (d === 0) break; z -= g / d; }
  return z;
}

function dlRequired(s) {

    var a = ['current_age_years', 'service_temp_C', 'service_temp_low_C', 'service_temp_high_C', 'reference_temp_C', 'reference_life_years', 'activation_energy_kJ_mol', 'calibration_min_C', 'calibration_max_C', 'eab_criterion_pct'];

    if (s.dose_mode === 'separate') a = a.concat(['qualified_dose_kGy', 'accumulated_dose_kGy', 'dose_rate_kGy_per_year']);

ою окремою межею дози. Бетон: глибина = k·√t або дифузія Фіка з erfc. Ущільнення: інтерполяція в логарифмі часу кривої, виміряної за умов експлуатації. Діапазон сценаріїв походить із нижніх і верхніх вхідних значень.","learnTryTitle":"Спробуйте: прискорене випробування","learnTry":"Відкрийте приклад «Ущільнення, лише прискорений тест». Крива досягає критерію 50 % приблизно через 1.3 року за 120 °C. Перш ніж читати далі: чи прослужить ущільнення в експлуатації за 50 °C 1.3 року, чи довше, і наскільки?","learnExplainTitle":"Чому інструмент відмовляє","learnExplain":"Перерахунок за Арреніусом від 120 °C до 50 °C потребує енергії активації, дійсної для цього компаунду в усьому цьому діапазоні. Еластомери часто змінюють механізм між температурою випробування та експлуатації (окиснення, обмежене дифузією, за високої температури, інша Ea нижче точки перегину), а випробування в сухому повітрі не містить впливу озону. Похибка такої екстраполяції невідома ні за величиною, ні за знаком, тому інструмент не видає числа.","learnFixTitle":"Виправлення: докази за умов експлуатації","learnFix":"Відкрийте «Ущільнення, крива за умов експлуатації»: контрольні ущільнення того самого компаунду, вилучені з того самого середовища за 50 °C. Тепер критерій лежить між двома виміряними точками, й інструмент інтерполює. Зміна температури кривої більш ніж на 0.5 K знову блокує результат.","learnBoundaryTitle":"Результат моделі та рішення","learnBoundary":"Прогноз є модельним часом до критерію. Поле рішення фіксує висновок інженера; схвалення прив’язане до вхідних даних і стає застарілим після будь-якої зміни.","noForecast":"прогнозу немає","legendCentral":"центральний: середній шар, центральна D","legendLower":"нижній: мінімальний шар, висока D","legendUpper":"верхній: максимальний шар, низька D"},"de":{"title":"Degradations-Lebensdauerprognose","subtitle":"Zeit bis zu einem Degradationskriterium für Kabelisolierung, Betondeckung oder eine Elastomerdichtung, ausschließlich aus materialspezifisch o","curveEnv":"Ambiente de la curva de envejecimiento","sealServiceTemp":"Temperatura de servicio de la junta","curveTemp":"Temperatura de la curva de envejecimiento","compression":"Compresión en servicio","curveCompression":"Compresión de la curva de envejecimiento","propertyName":"Propiedad medida","propertyUnit":"Unidad de la propiedad","direction":"Sentido de la propiedad","decreasing":"Disminuye con el envejecimiento","increasing":"Aumenta con el envejecimiento","criterionValue":"Valor del criterio","currentProperty":"Valor actual de la propiedad","currentPropertyBlank":"Valor actual (vacío = no medido)","curvePoints":"Puntos de la curva de envejecimiento","ageAtTest":"Edad, a","property":"Propiedad","evidence":"Evidencia por parámetro","evidenceNote":"Cada parámetro del modelo necesita un valor, una fuente confirmada con fecha o versión y el intervalo en el que esa fuente lo declara válido.","parameter":"Parámetro","source":"Fuente","dateVersion":"Fecha / versión","status":"Estado","validMin":"Válido desde","validMax":"Válido hasta","sourceDate":"Fuente · fecha","validRange":"Intervalo de validez","check":"Comprobación","evOk":"completo","confirmed":"confirmado","rejected":"rechazado","unknown":"desconocido","na":"no aplicable","yes":"sí","no":"no","decision":"Regla de revisión y decisión","reviewFraction":"Fracción del escenario inferior para revisión","reviewMax":"Plazo máx. a la próxima revisión de evidencia","reviewPolicy":"Regla de revisión","decisionStatus":"Decisión de ingeniería","decisionReason":"Motivo de la decisión","decPending":"pendiente","decApproved":"aprobada para estas entradas","decRejected":"rechazada","decStale":"aprobación caducada: datos cambiados después","decNoReason":"una aprobación sin motivo no se registra","decisionBasis":"La aprobación está vinculada a la huella de las entradas; cualquier cambio de entrada la deja caducada.","run":"Calcular","results":"Pronóstico","remaining":"Tiempo hasta el criterio, central","scenarioRange":"Ra delo admitido.","a_identify_material":"Identificar el material o compuesto.","a_obtain_qualification_relation":"Obtener la relación de cualificación validada y su referencia para este compuesto.","a_correct_inputs":"Corregir las entradas incoherentes.","a_extend_calibration":"Ampliar la calibración a las temperaturas de servicio o medir el estado directamente.","a_validate_dose_treatment":"Validar el tratamiento separado de la dosis para este compuesto o incluir la dosis en la relación de cualificación.","a_assess_cracks":"Evaluar las fisuras y su efecto en el transporte.","a_survey_exposure":"Inspeccionar la exposición actual.","a_measure_carbonation_depth":"Medir de nuevo la profundidad carbonatada.","a_measure_chloride_profile":"Extraer testigos y medir perfil de cloruros.","a_test_in_service_conditions":"Obtener una curva de envejecimiento del mismo compuesto en el ambiente, la temperatura y la compresión de servicio.","a_extend_ageing_test":"Prolongar el ensayo de envejecimiento hasta que se cruce el criterio.","a_complete_evidence":"Completar la evidencia: valor, fuente confirmada con fecha, intervalo de validez.","a_engineering_review_now":"El criterio se alcanza hoy: revisión de ingeniería inmediata.","a_measure_cable_condition":"Medir el estado del cable (EAB en una muestra o módulo por indentación).","a_measure_seal_property":"Medir la propiedad de la junta en el compuesto instalado.","a_review_before_horizon":"Revisar la evidencia en un plazo de","i_thermal_life_service_years":"Vida térmica a la temperatura de servicio","i_thermal_life_high_years":"Vida térmica, escenario alto","i_thermal_life_low_years":"Vida térmica, escenario bajo","i_thermal_remaining_years":"Vida térmica restante","i_dose_remaining_years":"Tiempo restante hasta la dosis cualificada","i_limiting_mechanism":"Mecanismo limitante","i_acceleration_factor":"Relación vida en servicio / de referencia","i_carbonation_coefficient_mm_per_sqrt_year":"Coeficiente de carbonatación k","i_k_min":"Menor k puntual","i_k_max":"Mayor k puntual","i_rms_residual_mm":"Residuo RMS del ajuste","i_depth_now_mm":"Profundidad ajustada hoy","i_criterion_age_years":"Edad en el criterio, central","i_criterion_age_low_years":"Edad en el criterio, escenario inferior","i_criterion_age_high_years":"Edad en el criterio, escenario superior","i_latest_measurement_age_years":"Edad en la última medición","i_concentration_ratio":"(Ccrit − C0)/(Cs − C0)","i_erfc_inverse":"erfc⁻¹ de esa relación","i_chloride_at_min_cover_now_pct":"Cloruros en el recubrimiento mínimo hoy","i_bracket_ids":"Puntos de curva que acotan el criterio","i_curve_points_used":"Puntos de curva usados","exCable":"Cable de control, trazado caliente","exCableNote":"XLPE con una relación de Arrhenius validada, tres escenarios de temperatura y un límite de dosis separado; el límite de dosis es determinante.","exCableNoQual":"Cable sin expediente de cualificación","exCableNoQualNote":"Mismo trazado, compuesto no identificado y sin relación de cualificación: el número queda bloqueado y el plan enumera lo que hay que obtener.","exCarb":"Carbonatación del hormigón (típico)","exCarbNote":"Tres inspecciones de profundidad, recubrimiento de 20–30 mm: el rango de escenarios muestra el efecto de la dispersión del recubrimiento.","exChloride":"Penetración de cloruros en hormigón","exChlorideNote":"Pila en zona de salpicaduras con escenarios ajustados de cloruros superficiales y difusividad; Fick 1D con condición de contorno constante.","exSealAcc":"Junta, solo ensayo acelerado (problema)","exSealAccNote":"Un ensayo a 120 °C en aire seco para una junta a 50 °C expuesta al ozono: sin pronóstico; se enumeran las condiciones de exposición que faltan.","exSealSvc":"Junta, curva en condiciones de servicio","exSealSvcNote":"Juntas de vigilancia retiradas del mismo servicio: el criterio está entre dos puntos medidos.","learnIntroTitle":"Tiempo hasta un criterio, modelo a modelo","learnIntro":"Cada material tiene su propio modelo y su propia aplicabilidad. La herramienta da un número solo cuando cada parámetro tiene una fuente y está dentro de su intervalo de validez declarado y se cumplen las condiciones del modelo.","learnDataTitle":"Primero la evidencia","learnData":"Elegir un parámetro en el panel de evidencia. Un valor sin fuente confirmada y fecha, o fuera del intervalo que cubre su fuente, bloquea el pronóstico y aparece en el plan.","learnModelTitle":"Tres modelos","learnModel":"Cable: la vida escala con exp(Ea/RT) dentro del intervalo de calibración, con un límite de dosis separado opcional. Hormigón: profundidad = k·√t o difusión de Fick con erfc. Junta: interpolación en tiempo logarítmico de una curva medida en las condiciones de servicio. El rango de escenarios procede de las entradas bajas y altas.","learnTryTitle":"Prueba: un ensayo acelerado","learnTry":"Abrir el ejemplo «Junta, solo ensayo acelerado». La curva alcanza el criterio del 50 % tras unos 1.3 años a 120 °C. Antes de seguir leyendo: ¿la junta en servicio a 50 °C dura 1.3 años, o más, y cuánto más?","learnExplainTitle":"Por qué la herramienta se niega","learnExplain":"Un desplazamiento de Arrhenius de 120 °C a 50 °C necesita una energía de activación válida para este compuesto en todo ese rango. Los elastómeros cambian a menudo de mecanismo entre la temperatura de ensayo y la de servicio (oxidación limitada por difusión a alta temperatura, otra Ea por debajo de un punto de inflexión), y el ataque por ozono no existe en un ensayo en aire seco. El error de tal extrapolación es desconocido en magnitud y signo, por lo que la herramienta no da ningún número.","learnFixTitle":"Solución: evidencia en condición de servicio","learnFix":"Abrir «Junta, curva en condiciones de servicio»: juntas de vigilancia del mismo compuesto, retiradas del mismo ambiente a 50 °C. El criterio está ahora entre dos puntos medidos y la herramienta interpola. Cambiar la temperatura de la curva en más de 0.5 K vuelve a bloquear el resultado.","learnBoundary var PY_CORE = "import math, json\nDL_VERSION = '2026-10-03.dl-2'\nDL_R = 8.314462618\nDL_K0 = 273.15\nDL_YEAR_S = 31557600\nDL_TEMP_TOL = 0.5\nDL_COMP_TOL = 0.5\nDL_MODES = ['cable', 'concrete', 'elastomer']\nDL_CONCRETE = ['carbonation', 'chloride']\n\ndef dl_num(v):\n    return v if isinstance(v, (int, float)) and not isinstance(v, bool) and math.isfinite(v) else None\n\ndef dl_text(v):\n    return '' if v is None else str(v).strip()\n\ndef dl_norm(v):\n    return ' '.join(dl_text(v).lower().split())\n\ndef dl_erfc_inv(y):\n    if not (0 < y < 2): return None\n    lo, hi = -6.0, 6.0\n    for _ in range(60):\n        mid = (lo + hi) / 2\n        if math.erfc(mid) > y: lo = mid\n        else: hi = mid\n    z = (lo + hi) / 2\n    for _ in range(4):\n        d = -2 / math.sqrt(math.pi) * math.exp(-z * z)\n        if d == 0: break\n        z -= (math.erfc(z) - y) / d\n    return z\n\ndef dl_required(s):\n    m = s.get('mode')\n    if m == 'cable':\n        a = ['current_age_years', 'service_temp_C', 'service_temp_low_C', 'service_temp_high_C', 'reference_temp_C', 'reference_life_years', 'activation_energy_kJ_mol', 'calibration_min_C', 'calibration_max_C', 'eab_criterion_pct']\n        if s.get('current_eab_pct') is not None: a.append('current_eab_pct')\n        if s.get('dose_mode') == 'separate': a += ['qualified_dose_kGy', 'accumulated_dose_kGy', 'dose_rate_kGy_per_year']\n        return a\n    if m == 'concrete':\n        if s.get('concrete_model') == 'carbonation': return ['current_age_years', 'cover_mean_mm', 'cover_min_mm', 'cover_max_mm', 'rh_pct', 'co2_ppm', 'compressive_strength_MPa']\n        if s.get('concrete_model') == 'chloride': return ['current_age_years', 'cover_mean_mm', 'cover_min_mm', 'cover_max_mm', 'chloride_surface_pct', 'chloride_initial_pct', 'chloride_critical_pct', 'diffusivity_m2_s', 'diffusivity_low_m2_s', 'diffusivity_high_m2_s']\n        return []\n    if m == 'elastomer':\n        c = ['current_age_years', 'seal_service_temp_C', 'curve_temp_C', 'service_compression_pct', 'curve_compression_pct', 'criterion_value']\n        if s.get('current_property_value') is not None: c.append('current_property_value')\n        return c\n    return []\n\ndef dl_param_gap(s, k):\n    v = dl_num(s.get(k)); evs = s.get('evidence') if isinstance(s.get('evidence'), dict) else {}\n    ev = evs.get(k)\n    if v is None: return 'missing:' + k\n    if not isinstance(ev, dict) or ev.get('status') != 'confirmed' or not dl_text(ev.get('source')) or not dl_text(ev.get('date_version')): return 'evidence:' + k\n    lo = dl_num(ev.get('valid_min')); hi = dl_num(ev.get('valid_max'))\n    if lo is None or hi is None or lo > hi or v < lo or v > hi: return 'range:' + k\n    return None\n\ndef dl_evidence_gaps(s):\n    return [g for g in (dl_param_gap(s, k) for k in dl_required(s)) if g]\n\ndef dl_ok(s, k):\n    return dl_param_gap(s, k) is None\n\ndef dl_arrhenius(life, ea, t, tref):\n    return life * math.exp(ea * 1000 / DL_R * (1 / (t + DL_K0) - 1 / (tref + DL_K0)))\n\ndef dl_cable(s, r):\n    g = dl_evidence_gaps(s); N = lambda k: dl_num(s.get(k))\n    lo, sv, hi, ref, cmin, cmax = N('service_temp_low_C'), N('service_temp_C'), N('service_temp_high_C'), N('reference_temp_C'), N('calibration_min_C'), N('calibration_max_C')\n    life, ea, age = N('reference_life_years'), N('activation_energy_kJ_mol'), N('current_age_years')\n    if not dl_text(s.get('cable_material')): g.append('material_missing')\n    if not dl_text(s.get('qualification_ref')): g.append('qualification_reference_missing')\n    if s.get('qualification_relation_validated') is not True: g.append('qualification_relation_not_validated')\n    if lo is not None and sv is not None and hi is not None and not (lo <= sv <= hi): g.append('temperature_scenario_order')\n    temps = [lo, sv, hi, ref]\n    if cmin is not None and cmax is not None and not cmin < cmax: g.append('calibration_interval_invalid')\n    elif cmin is not None and cmax is not None and any(t is not None and
