<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMR knowledge-base changes</title><style>
:root{--bg:#f6f8fb;--panel:#fff;--ink:#151a22;--muted:#5c6675;--line:#e2e7ee;--accent:#3763e6;--good:#16794a;--warn:#9a6200;--bad:#b42318}@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#9aa7b4;--line:#30363d;--accent:#79a2ff;--good:#6ee7a0;--warn:#ffd166;--bad:#ff8b8b}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:26px 18px 70px}header{display:flex;gap:15px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}h1{margin:0 0 5px;font-size:clamp(24px,4vw,36px)}a{color:var(--accent)}.langs{display:flex;gap:5px;flex-wrap:wrap}.langs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 9px;cursor:pointer}.langs button.on{background:var(--accent);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin:18px 0}.stat,.run{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px}.stat b{display:block;font-size:23px}.muted{color:var(--muted)}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:11px}code{font-size:12px}</style><script src="site-disclaimer.js?v=df5c42ab0abf" defer></script><!-- §21 ONE PATH TO PAPER, on a site page that is not a tool.
     UI_FRAMEWORK_SPEC.md §21.7 item 1: six site pages carried no print sheet at
     all, because §21 is a framework contract and the framework was not on them.
     File -> Print gave the browser default — no A4 page box, no running header,
     no source URL, no date, and the language switcher printed as buttons. This
     page is one a reader prints on purpose, so it gets the same sheet every
     tool gets, from the same code: DiagramUI.printStyles() installs the page
     box, the white paper, the chrome suppression, the running header (this
     page's own h1 · the name of the host that served it, plus the localised
     words "Screen
     printout") and the attributed running footer, in all six site languages.
     Nothing else about this page changes: no DiagramUI.app(), no shared bar, no
     Ctrl+P interception — this page has no calculation record to print, so §21.1
     says its keyboard must be left alone, and it is. -->
<style>
/* §21.2: the framework hides the chrome the FRAMEWORK created; which of this
   page's own regions reach paper is this page's decision. A language switcher
   and a site nav are controls, not content: on paper they are a row of dead
   buttons. Everything else on the page is the document. */
@media print{ #langs, #nav, #back, .langs { display:none !important } }
</style>
<script src="diagram-ui.js?v=40a9a6f97a05" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  try { if (window.DiagramUI && DiagramUI.printStyles) DiagramUI.printStyles(); } catch (e) {}
});
</script>
</head><body><div class="wrap"><header><div><h1 id="h"></h1><div class="muted" id="sub"></div></div><div><div class="langs" id="langs"></div><p><a id="back" href="smrselector.html">← SMR selector</a></p></div></header><div id="content"></div></div><script>
const L=['en','uk','de','nl','fr','es'];const X={en:{h:'SMR knowledge-base updates',sub:'Server-side source monitoring, reconciliation and publication status.',reg:'Registered sources',chk:'Checked last run',chg:'Changed sources',pend:'Pending review',err:'Source errors',cat:'Catalog designs found',total:'Reactor records',auto:'Auto-applied facts',know:'Canonical knowledge date',last:'Last run',runs:'Recent update runs',none:'No cron run has been recorded yet.',back:'SMR selector'},uk:{h:'Оновлення бази знань SMR',sub:'Серверний моніторинг джерел, звірка та стан публікації.',reg:'Зареєстровано джерел',chk:'Перевірено за останній запуск',chg:'Змінених джерел',pend:'Очікують перевірки',err:'Помилки джерел',cat:'Знайдено проєктів у каталозі',total:'Записів реакторів',auto:'Автоматично застосовано',know:'Дата канонічних знань',last:'Останній запуск',runs:'Останні запуски',none:'Запуск cron ще не зафіксовано.',back:'Підбір SMR'},de:{h:'Aktualisierungen der SMR-Wissensbasis',sub:'Serverseitige Quellenüberwachung, Abgleich und Veröffentlichungsstatus.',reg:'Registrierte Quellen',chk:'Im letzten Lauf geprüft',chg:'Geänderte Quellen',pend:'Zur Prüfung',err:'Quellfehler',cat:'Katalogentwürfe gefunden',total:'Reaktordatensätze',auto:'Automatisch übernommen',know:'Kanonischer Wissensstand',last:'Letzter Lauf',runs:'Letzte Aktualisierungsläufe',none:'Noch kein Cron-Lauf aufgezeichnet.',back:'SMR-Auswahl'},nl:{h:'Updates van de SMR-kennisbank',sub:'Server-side bronbewaking, reconciliatie en publicatiestatus.',reg:'Geregistreerde bronnen',chk:'Gecontroleerd laatste run',chg:'Gewijzigde bronnen',pend:'Wacht op review',err:'Bronfouten',cat:'Catalogusontwerpen gevonden',total:'Reactorrecords',auto:'Automatisch toegepast',know:'Canonieke kennisdatum',last:'Laatste run',runs:'Recente updateruns',none:'Er is nog geen cron-run geregistreerd.',back:'SMR-selector'},fr:{h:'Mises à jour de la base SMR',sub:'Surveillance serveur des sources, rapprochement et état de publication.',reg:'Sources function lang(){const q=new URLSearchParams(location.search).get('lang');if(L.includes(q))return q;const s=localStorage.getItem('diagram_lang');if(L.includes(s))return s;return 'en'}let l=lang();function t(k){return (X[l]||X.en)[k]||k}function esc(s){return String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setLang(x){l=x;localStorage.setItem('diagram_lang',x);history.replaceState(null,'','?lang='+x);render()}
async function render(){document.documentElement.lang=l;document.querySelector('#h').textContent=t('h');document.querySelector('#sub').textContent=t('sub');document.querySelector('#back').textContent='← '+t('back');document.querySelector('#back').href='smrselector.html?lang='+l;document.querySelector('#langs').innerHTML=L.map(x=>`<button class="${x===l?'on':''}" onclick="setLang('${x}')">${x.toUpperCase()}</button>`).join('');let s={},g={runs:[]};try{s=await (await fetch('smr-update-status.json',{cache:'no-store'})).json()}catch(e){}try{g=await (await fetch('smr-change-log.json',{cache:'no-store'})).json()}catch(e){}const stats=[[t('reg'),s.sources_registered],[t('chk'),s.sources_checked],[t('chg'),s.sources_changed],[t('pend'),s.pending_review],[t('err'),(s.source_errors||[]).length],[t('cat'),(s.catalog||{}).found||0],[t('total'),s.reactors_total||0],[t('auto'),(s.auto_applied||[]).length],[t('know'),s.knowledge_date],[t('last'),s.generated]];let h='<div class="grid">'+stats.map(x=>`<div class="stat"><span class="muted">${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('')+'</div><h2>'+esc(t('runs'))+'</h2>';if(!(g.runs||[]).length)h+='<p class="muted">'+esc(t('none'))+'</p>';else h+='<div class="table"><table><thead><tr><th>UTC</th><th>mode</th><th>checked</th><th>changed</th><th>errors</th><th>review</th><th>auto</th><th>catalog +</th><th>total</th></tr></thead><tbody>'+g.runs.map(r=>`<tr><td>${esc(r.at)}</td><td>${esc(r.mode)}</td><td>${esc(r.checked)}</td><td>${esc(r.changed_sources)}</td><td>${esc(r.errors)}</td><td>${esc(r.pending_review)}</td><td>${esc((r.auto_applied||[]).length)}</td><td>${esc((r.catalog||{}).added||0)}</td><td>${esc(r.reactors_total||'')}</td></tr>`).join('')+'</tbody></table></div>';document.querySelector('#content').innerHTML=h}render();</script></body></html>
