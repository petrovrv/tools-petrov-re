              'Ділянка середовища з боку робочої зони за закритим клапаном зберігає тиск або температуру, доки в ній не зафіксовано відкриту точку скидання чи дренажу.',
              'Ein Mediumabschnitt auf der Arbeitsseite eines geschlossenen Ventils behält Druck oder Temperatur, bis dort eine offene Entlüftung oder Entleerung erfasst ist.',
              'Een mediumsectie aan de werkzijde van een dichte afsluiter houdt druk of temperatuur tot in die sectie een open ontluchting of aftap is vastgelegd.',
              'Un tronçon de fluide côté zone de travail d’une vanne fermée garde sa pression ou sa température tant qu’aucun évent ou purge ouvert n’y est enregistré.',
              'Un tramo de fluido en el lado de la zona de trabajo de una válvula cerrada conserva su presión o temperatura hasta que conste un venteo o drenaje abierto en ese tramo.',
              'Odcinek czynnika po stronie strefy pracy za zamkniętym zaworem zachowuje ciśnienie lub temperaturę, dopóki nie zapisano w nim otwartego odpowietrzenia lub spustu.') },
    'LOTO-R-005': { basis: { kind: 'national', source: 'OSHA 29 CFR 1910.147, definition of energy isolating device', jurisdiction: 'US', version: NCHK },
      text: T('Push buttons, selector switches, interlocks and other control-circuit devices are not energy-isolating devices; the tool never lets them break a route.',
              'Кнопки, перемикачі режимів, блокування та інші пристрої кіл керування не є пристроями ізоляції енергії; інструмент не дозволяє їм розривати маршрут.',
              'Taster, Wahlschalter, Verriegelungen und andere Steuerstromgeräte sind keine Energie-Trenneinrichtungen; das Werkzeug lässt sie keinen Weg unterbrechen.',
              'Drukknoppen, keuzeschakelaars, vergrendelingen en andere stuurstroomelementen zijn geen energiescheiders; de tool laat ze geen route onderbreken.',
              'Boutons, sélecteurs, verrouillages et autres organes de circuit de commande ne sont pas des dispositifs d’isolement ; l’outil ne leur permet jamais de couper un chemin.',
              'Pulsadores, selectores, enclavamientos y otros dispositivos de mando no son dispositivos de aislamiento; la herramienta nunca les deja cortar una ruta.',
              'Przyciski, przełączniki wyboru, blokady i inne urządzenia obwodów sterowania nie są urządzeniami odłączającymi; narzędzie nie pozwala im przerwać drogi.') },
    'LOTO-R-006': { basis: { kind: 'heuristic', source: 'tool convention: leak-by and reverse flow are not excluded', jurisdiction: 'universal', version: 'r1' },
      text: T('A non-return valve is treated as conducting: it is not an isolation point.',
              'Зворотний клапан вважається провідним: це не точка ізоляції.',
              'Ein Rückschlagventil gilt als durchlässig: es ist keine Trennstelle.',
              'Een terugslagklep geldt als doorlatend: het is geen scheidingspunt.',
              'Un clapet anti-retour est considéré passant : ce n’est pas un point d’isolement.',
              'Una válvula antirretorno se considera conductora: no es un punto de aislamiento.',
              'Zawór zwrotny traktuje się jako przepuszczający: nie jest punktem odłączenia.') },
    'LOTO-R-007': { basis: { kind: 'guidance', source: 'HSE HSG253, The safe isolation of plant and equipment', jurisdiction: 'GB', version: NCHK },
      text: T('An isolation point that breaks a route is secured against re-energisation by a lock.',
              'Точку ізоляції, що розриває маршрут, захищено від повторного ввімкнення замком.',
              'Eine Trennstelle, die einen Weg unterbricht, ist mit einem Schloss gegen Wiedereinschalten gesichert.',
              'Een scheidingspunt dat een route onderbreekt, is met een slot tegen herinschakelen beveiligd.',
              'Un point d’isolement qui coupe un chemin est protégé contre la remise sous énergie par un cadenas.',
              'Un punto de aislamiento que corta una ruta se asegura contra la reenergización con un candado.',
              'Punkt odłączenia przerywający drogę jest zabezpieczony kłódką przed ponownym załączeniem.') },
    'LOTO-R-008': { basis: { kind: 'guidance', source: 'HSE HSG253, The safe isolation of plant and equipment', jurisdiction: 'GB', version: NCHK },
      text: T('An isolation point that breaks a route carries a tag that identifies the isolation.',
              'Точка ізоляції, що розриває маршрут, має бирку з ідентифікацією ізоляції.',
              'Eine Trennstelle, die einen Weg unterbricht, trägt ein Schild, das die Freischaltung ausweist.',
              'Een scheidingspunt dat een route onderbreekt, draagt een label dat de scheiding identificeert.',
              'Un point d’isolement qui coupe un chemin porte une étiquette identifiant la consignation.',
              'Un punto de aislamiento que corta una ruta lleva una etiqueta que identifica el aislamiento.',
              'Punkt odłączenia przerywający drogę ma zawieszkę identyfikującą odłączenie.') },
    'LOTO-R-009': { basis: { kind: 'national', source: 'OSHA 29 CFR 1910.147(d)(6), verification of isolation', jurisdiction: 'US', version: NCHK },
      text: T('An isolation or dissipation counts as complete only after zero energy at the source it controls has been verified.',
              'Ізоляція чи скидання енергії вважається завершеним лише після перевірки нульової енергії джерела, яке вони контролюють.',
              'Eine Freischaltung oder Entladung gilt erst als vollständig, wenn die Energiefreiheit der zugehörigen Quelle festgestellt ist.',
              'Een scheiding of ontlading telt pas als volledig nadat nul energie bij de bijbehorende bron is geverifieerd.',
              'Un isolement ou une dissipation n’est complet qu’après vérification de l’absence d’énergie à la source concernée.',
              'Un aislamiento o disipación solo cuenta como completo tras verificar energía cero en la fuente que controla.',
              'Odłączenie lub rozładowanie jest kompletne dopiero po sprawdzeniu braku energii w źródle, które kontroluje.') },
    'LOTO-R-010': { basis: { kind: 'heuristic', source: 'tool table: dissipation methods per energy form', jurisdiction: 'universal', version: 'r1' },
      text: T('A dissipation method counts only when it suits the energy form of the store (for example: lowering does not relieve pressure).',
              'Спосіб скидання зараховується лише тоді, коли він відповідає виду енергії накопичувача (наприклад, опускання не знімає тиск).',
              'Eine Entlademethode zählt nur, wenn sie zur Energieform des Speichers passt (Absenken baut z. B. keinen Druck ab).',
              'Een ontlaadmethode telt alleen als ze past bij de energievorm van de buffer (laten zakken neemt bijvoorbeeld geen druk weg).',
              'Une méthode de dissipation ne compte que si elle convient à la forme d’énergie du stockage (descendre ne supprime pas une pression).',
              'Un método de disipación solo cuenta si corresponde a la forma de energía (bajar una carga no alivia una presión).',
              'Metoda rozładowania liczy się tylko wtedy, gdy pasuje do postaci energii magazynu (opuszczenie nie usuwa ciśnienia).') },
    'LOTO-R-011': { basis: { kind: 'heuristic', source: 'tool table: verification methods per energy form', jurisdiction: 'universal', version: 'r1' },
      text: T('A verification method counts only when it suits the energy form (for example: a pressure gauge does not prove an electrical circuit dead).',
              'Спосіб перевірки зараховується лише тоді, коли він відповідає виду енергії (манометр не доводить відсутність напруги).',
              'Eine Prüfmethode zählt nur, wenn sie zur Energieform passt (ein Manometer beweist keine Spannungsfreiheit).',
              'Een verificatiemethode telt alleen als ze past bij de energievorm (een manometer bewijst geen spanningsloosheid).',
              'Une méthode de vérification ne compte que si elle convient à la forme d’énergie (un manomètre ne prouve pas l’absence de tension).',
              'Un método de verificación solo cuenta si corresponde a la forma de energía (un manómetro no prueba la ausencia de tensión).',
              'Metoda weryfikacji liczy się tylko wtedy, gdy pasuje do postaci energii (manometr nie dowodzi braku napięcia).') },
    'LOTO-R-012': { basis: { kind: 'heuristic', source: 'tool model completeness check', jurisdiction: 'universal', version: 'r1' },
      text: T('Without a work zone in the scheme no route can be assessed: insufficient data, review required.',
              'Без робочої зони на схемі маршрути оцінити неможливо: недостатньо даних, потрібен перегляд.',
              'Ohne Arbeitsbereich im Schema ist kein Weg bewertbar: Daten unzureichend, Prüfung erforderlich.',
              'Zonder werkzone in het schema is geen route te beoordelen: onvoldoende gegevens, beoordeling nodig.',
              'Sans zone de travail dans le schéma, aucun chemin n’est évaluable : données insuffisantes, revue requise.',
              'Sin zona de trabajo en el esquema no se puede evaluar ninguna ruta: datos insuficientes, revisión necesaria.',
              'Bez strefy pracy na schemacie nie można ocenić żadnej drogi: dane niewystarczające, wymagany przegląd.') },
    'LOTO-R-013': { basis: { kind: 'heuristic', source: 'tool model completeness check', jurisdiction: 'universal', version: 'r1' },
      text: T('A scheme with no energy source or store is not evidence of zero energy: insufficient data, review required.',
              'Схема без джерел і накопичувачів енергії не доводить відсутність енергії: недостатньо даних, потрібен перегляд.',
              'Ein Schema ohne Energiequelle oder Speicher belegt keine Energiefreiheit: Daten unzureichend, Prüfung erforderlich.',
              'Een schema zonder energiebron of buffer bewijst geen energieloosheid: onvoldoende gegevens, beoordeling nodig.',
              'Un schéma sans source ni stockage ne prouve pas l’absence d’énergie : données insuffisantes, revue requise.',
              'Un esquema sin fuentes ni acumuladores no prueba la ausencia de energía: datos insuficientes, revisión necesaria.',
              'Schemat bez źródeł i magazynów energii nie dowodzi braku energii: dane niewystarczające, wymagany przegląd.') },
    'LOTO-R-014': { basis: { kind: 'heuristic', source: 'tool model completeness check', jurisdiction: 'universal', version: 'r1' },
      text: T('A source with no connection to the work zone is reported for confirmation, since a missing line would hide a route.',
              'Джерело без з’єднання з робочою зоною виноситься на підтвердження, бо пропущена лінія приховала б маршрут.',
              'Eine Quelle ohne Verbindung zum Arbeitsbereich wird zur Bestätigung gemeldet, da eine fehlende Leitung einen Weg verbergen würde.',
              'Een bron zonder verbinding met de werkzone wordt ter bevestiging gemeld, want een ontbrekende leiding zou een route verbergen.',
              'Une source sans liaison avec la zone de travail est signalée pour confirmation, car une ligne oubliée masquerait un chemin.',
              'Una fuente sin conexión con la zona de trabajo se señala para confirmar, porque una línea omitida ocultaría una ruta.',
              'Źródło bez połączenia ze strefą pracy jest zgłaszane do potwierdzenia, bo brakująca linia ukryłaby drogę.') },
    'LOTO-R-015': { basis: { kind: 'heuristic', source: 'tool model consistency check', jurisdiction: 'universal', version: 'r1' },
      text: T('Only equipment converts one energy form into another; a different form on a line at any other node is reported as a modelling question.',
              'Лише обладнання перетворює один вид енергії на інший; інший вид енергії на лінії біля іншого вузла виноситься як питання моделювання.',
              'Nur Maschinen wandeln Energieformen um; eine abweichende Form an einem anderen Knoten wird als Modellfrage gemeldet.',
              'Alleen machines zetten energievormen om; een afwijkende vorm bij een ander knooppunt wordt als modelvraag gemeld.',
              'Seul un équipement convertit une forme d’énergie en une autre ; une forme différente sur une ligne à un autre nœud est signalée comme question de modélisation.',
              'Solo un equipo convierte una forma de energía en otra; una forma distinta en otro nudo se señala como duda de modelado.',
              'Tylko urządzenie przetwarza jedną postać energii w inną; inna postać na linii przy innym węźle jest zgłaszana jako pytanie modelowe.') },
    'LOTO-R-016': { basis: { kind: 'heuristic', source: 'tool search limit', jurisdiction: 'universal', version: 'r1' },
      text: T('When the number of routes exceeds the search limit the assessment is incomplete: insufficient data, review required.',
              'Якщо кількість маршрутів перевищує межу пошуку, оцінка неповна: недостатньо даних, потрібен перегляд.',
              'Übersteigt die Zahl der Wege das Suchlimit, ist die Bewertung unvollständig: Daten unzureichend, Prüfung erforderlich.',
              'Als het aantal routes de zoeklimiet overschrijdt, is de beoordeling onvolledig: onvoldoende gegevens, beoordeling nodig.',
              'Si le nombre de chemins dépasse la limite de recherche, l’évaluation est incomplète : données insuffisantes, revue requise.',
              'Si el número de rutas supera el límite de búsqueda, la evaluación es incompleta: datos insuficientes, revisión necesaria.',
              'Gdy liczba dróg przekracza limit wyszukiwania, ocena jest niepełna: dane niewystarczające, wymagany przegląd.') },
    'LOTO-R-017': { basis: { kind: 'company', source: 'site LOTO procedure (user reference)', jurisdiction: 'site', version: 'user-defined' },
      text: T('Each isolation point that breaks a route has a responsible role assigned.',
              'Кожній точці ізоляції, що розриває маршрут, призначено відповідальну роль.',
              'Jeder Trennstelle, die einen Weg unterbricht, ist eine verantwortliche Rolle zugewiesen.',
              'Aan elk scheidingspunt dat een route onderbreekt, is een verantwoordelijke rol toegewezen.',
              'Chaque point d’isolement qui coupe un chemin a un rôle responsable attribué.',
              'Cada punto de aislamiento que corta una ruta tiene asignado un rol responsable.',
              'Każdy punkt odłączenia przerywający drogę ma przypisaną odpowiedzialną rolę.') },
    'LOTO-R-018': { basis: { kind: 'physical', source: MODEL_SRC, jurisdiction: 'universal', version: 'r1' },
      text: T('A line marked as bidirectional carries energy both ways, so back-feed routes are searched in both directions.',
              'Лінія, позначена як двонапрямна, передає енергію в обидва боки, тому зворотні живлення шукаються в обох напрямках.',
              'Eine als beidseitig markierte Leitung überträgt Energie in beide Richtungen; Rückspeisewege werden in beiden Richtungen gesucht.',
              'Een als tweerichtings gemarkeerde leiding voert energie beide kanten op; terugvoedingsroutes worden in beide richtingen gezocht.',
              'Une ligne marquée bidirectionnelle transmet l’énergie dans les deux sens ; les réalimentations sont recherchées dans les deux sens.',
              'Una línea marcada como bidireccional transmite energía en ambos sentidos; las realimentaciones se buscan en ambos sentidos.',
              'Linia oznaczona jako dwukierunkowa przenosi energię w obie strony, więc drogi zasilania zwrotnego są szukane w obu kierunkach.') },
    'LOTO-R-019': { basis: { kind: 'national', source: 'OSHA 29 CFR 1910.147(d), application of control', jurisdiction: 'US', version: NCHK },
      text: T('The register lists actions in the order isolate, lock and tag, dissipate stored energy, verify.',
              'Реєстр перелічує дії в порядку: ізолювати, замкнути й позначити, скинути накопичену енергію, перевірити.',
              'Das Register führt die Schritte in der Reihenfolge Trennen, Schließen und Kennzeichnen, Entladen, Prüfen.',
              'Het register zet de stappen in de volgorde scheiden, sluiten en labelen, ontladen, verifiëren.',
              'Le registre ordonne les actions : isoler, cadenasser et étiqueter, dissiper, vérifier.',
              'El registro ordena las acciones: aislar, bloquear y etiquetar, disipar, verificar.',
              'Rejestr porządkuje czynności: odłączyć, zablokować i oznaczyć, rozładować, sprawdzić.') },
    'LOTO-R-020': { basis: { kind: 'guidance', source: 'EN 50110-1, operation of electrical installations: verify absence of operating voltage', jurisdiction: 'CENELEC', version: NCHK },
      text: T('Where electrical energy reaches the work zone on a route, or the work is electrical, the electrical source is verified by a test for dead; a try-start proves absence of motion, not absence of voltage.',
              'Якщо маршрутом до робочої зони надходить електрична енергія або роботи електротехнічні, електричне джерело перевіряють на відсутність напруги; пробний пуск доводить відсутність руху, а не напруги.',
              'Erreicht elektrische Energie auf einem Weg den Arbeitsbereich oder ist die Arbeit elektrisch, wird die elektrische Quelle durch Feststellen der Spannungsfreiheit geprüft; ein Startversuch belegt Stillstand, keine Spannungsfreiheit.',
              'Bereikt elektrische energie via een route de werkzone, of is het werk elektrotechnisch, dan wordt de elektrische bron op spanningsloosheid gecontroleerd; een startpoging toont stilstand aan, geen spanningsloosheid.',
              'Si de l’énergie électrique atteint la zone par un chemin, ou si les travaux sont électriques, la source électrique se vérifie par une VAT ; un essai de démarrage prouve l’absence de mouvement, pas l’absence de tension.',
              'Si la energía eléctrica llega a la zona por una ruta, o el trabajo es eléctrico, la fuente eléctrica se verifica comprobando la ausencia de tensión; un intento de arranque demuestra ausencia de movimiento, no de tensión.',
              'Gdy energia elektryczna dociera drogą do strefy pracy albo prace są elektryczne, źródło elektryczne sprawdza się próbą braku napięcia; próba uruchomienia dowodzi braku ruchu, a nie braku napięcia.') }
  };
  RULES['LOTO-R-021'] = { basis: { kind: 'heuristic', source: 'tool input validation', jurisdiction: 'universal', version: 'r1' },
    text: T('Objects or lines that cannot be read (unknown type or endpoint, no energy form, beyond 40 objects or 80 lines) are discarded and the plan is marked insufficient data, review required.',
            'Об’єкти чи лінії, які неможливо прочитати (невідомий тип чи кінець, немає виду енергії, понад 40 об’єктів або 80 ліній), відкидаються, а план позначається як «недостатньо даних, потрібен перегляд».',
            'Nicht lesbare Objekte oder Leitungen (unbekannter Typ oder Endpunkt, keine Energieform, mehr als 40 Objekte oder 80 Leitungen) werden verworfen; der Plan gilt dann als „Daten unzureichend, Prüfung erforderlich“.',
            'Onleesbare objecten of leidingen (onbekend type of eindpunt, geen energievorm, meer dan 40 objecten of 80 leidingen) worden verworpen en het plan krijgt „onvoldoende gegevens, beoordeling nodig”.',
            'Les objets ou lignes illisibles (type ou extrémité inconnus, pas de forme d’énergie, plus de 40 objets ou 80 lignes) sont écartés et le plan est marqué « données insuffisantes, revue requise ».',
            'Los objetos o líneas ilegibles (tipo o extremo desconocido, sin forma de energía, más de 40 objetos u 80 líneas) se descartan y el plan se marca «datos insuficientes, revisión necesaria».',
            'Nieczytelne obiekty lub linie (nieznany typ lub koniec, brak postaci energii, ponad 40 obiektów lub 80 linii) są odrzucane, a plan oznacza się jako „dane niewystarczające, wymagany przegląd”.') };

  /* =============================================================== 4. model */
  var COUNT_STEPS = 200000, MAX_ROUTES = 400, MAX_NODES = 40, MAX_EDGES = 80;
  function kindOf(n) { return KINDS[n && n.k] || null; }
  function clsOf(n) { var k = kindOf(n); return k ? k.c : ''; }
  function energyOf(n) {
    var k = kindOf(n); if (!k) return '';
    if (k.eSel && k.eSel.indexOf(n.e) >= 0) return n.e;
    return k.e || '';
  }
  function isOrigin(n) { var c = clsOf(n); return c === 'src' || c === 'store'; }
  function isolating(n) { var k = kindOf(n); return !!(k && k.c === 'dev' && k.iso && k.iso.indexOf(n.p) >= 0); }
  function canIsolate(n, e) { var k = kindOf(n); return !!(k && k.c === 'dev' && k.can && k.can.indexOf(e) >= 0); }
  function verified(n) { var e = energyOf(n); return !!(n.vd && n.vm && (VER_FOR[e] || []).indexOf(n.vm) >= 0); }
  /* A try-start proves absence of motion, not absence of voltage: on a route whose
     last line into the work zone is electrical it does not verify (LOTO-R-020). */
  function lastForm(r) { return r.edges[r.edges.length - 1].e; }
  function routeVerified(o, r, task) {
    if (!verified(o)) return false;
    if (o.vm === 'trystart' && energyOf(o) === 'elec' && (task === 'elec' || lastForm(r) === 'elec')) return false;
    return true;
  }
  function dissipated(n) { var e = energyOf(n); return !!(n.dd && n.dm && (DISS_FOR[e] || []).indexOf(n.dm) >= 0); }

  /* Keep a scheme structurally sound: unknown kinds, duplicate ids and edges
     to missing nodes are dropped; every value is coerced to its declared type. */
  function normalize(sc) {
    var out = { title: '', task: 'mech', nodes: [], edges: [] };
    sc = sc || {};
    out.title = String(sc.title == null ? '' : sc.title).slice(0, 120);
    out.task = TASK_ORDER.indexOf(sc.task) >= 0 ? sc.task : 'mech';
    var seen = {}, dn = 0, de = 0;
    (Array.isArray(sc.nodes) ? sc.nodes : []).forEach(function (n) {
      if (!n || !KINDS[n.k] || out.nodes.length >= MAX_NODES) { dn++; return; }
      var id = String(n.i || '').replace(/[^\w.-]/g, '').slice(0, 24);
      if (!id || seen[id]) { dn++; return; }
      seen[id] = 1;
      var k = KINDS[n.k];
      var m = { i: id, k: n.k, t: String(n.t == null ? id : n.t).slice(0, 24),
        x: Math.round(+n.x || 0), y: Math.round(+n.y || 0) };
      if (k.eSel) m.e = k.eSel.indexOf(n.e) >= 0 ? n.e : k.e;
      if (k.pos && k.pos.length) m.p = k.pos.indexOf(n.p) >= 0 ? n.p : k.p0;
      if (k.c === 'dev' && !k.nrv) { m.l = n.l ? 1 : 0; m.g = n.g ? 1 : 0; }
      if (k.c !== 'junc' && k.c !== 'equip') m.o = ROLE_ORDER.indexOf(n.o) >= 0 ? n.o : '';
      if (k.c === 'src' || k.c === 'store') { m.vm = VER[n.vm] ? n.vm : ''; m.vd = n.vd ? 1 : 0; }
      if (k.c === 'store') { m.dm = DISS[n.dm] ? n.dm : ''; m.dd = n.dd ? 1 : 0; }
      out.nodes.push(m);
    });
    var eseen = {};
    (Array.isArray(sc.edges) ? sc.edges : []).forEach(function (e) {
      if (!e || !seen[e.a] || !seen[e.b] || e.a === e.b || !ENERGY[e.e] || out.edges.length >= MAX_EDGES) { de++; return; }
      var id = String(e.i || ('e' + out.edges.length)).replace(/[^\w.-]/g, '').slice(0, 24);
      if (!id || eseen[id]) id = 'e' + out.edges.length + '_' + Math.floor(Math.random() * 1e6);
      eseen[id] = 1;
      out.edges.push({ i: id, a: e.a, b: e.b, e: e.e, d: e.d ? 1 : 0 });
    });
    var pd = sc.dropped || {};
    dn += +pd.nodes || 0; de += +pd.edges || 0;
    if (dn || de) out.dropped = { nodes: dn, edges: de };
    return out;
  }

  function tagOf(byId, id) { return byId[id] ? byId[id].t : id; }

  /* The analysis. Pure: scheme in, findings/routes/register out. `l` only
     selects the language of the prose it builds. */
  function analyze(scIn, l) {
    l = l || curLang();
    var sc = normalize(scIn);
    var byId = {}, adj = {};
    sc.nodes.forEach(function (n) { byId[n.i] = n; adj[n.i] = []; });
    sc.edges.forEach(function (e) {
      adj[e.a].push({ to: e.b, edge: e, rev: false });
      if (e.d) adj[e.b].push({ to: e.a, edge: e, rev: true });
    });
    var findings = [];
    function add(f) { findings.push(f); }
    var tg = function (id) { return tagOf(byId, id); };
    var en = function (e) { return pk(ENERGY[e], l); };
    var wz = sc.nodes.filter(function (n) { return clsOf(n) === 'wz'; });
    var origins = sc.nodes.filter(isOrigin);
    var insufficient = false;
    if (!wz.length) { insufficient = true; add({ id: 'nowz', rules: ['LOTO-R-012'], sev: 'insufficient', title: pk(M.fNoWzT, l), detail: pk(M.fNoWzD, l) }); }
    if (sc.dropped) { insufficient = true; add({ id: 'input', rules: ['LOTO-R-021'], sev: 'insufficient', title: fill(pk(M.fInT, l), { n: nf(sc.dropped.nodes, l), m: nf(sc.dropped.edges, l) }), detail: fill(pk(M.fInD, l), { n: nf(MAX_NODES, l), m: nf(MAX_EDGES, l) }) }); }
    if (!origins.length) { insufficient = true; add({ id: 'nosrc', rules: ['LOTO-R-013'], sev: 'insufficient', title: pk(M.fNoSrcT, l), detail: pk(M.fNoSrcD, l) }); }

    /* -- route enumeration: every simple path origin -> work zone -- */
    var routes = [], limited = false, totalRoutes = 0, steps = 0, capped = false;
    origins.forEach(function (o) {
      if (capped) return;
      var pathN = [o.i], pathE = [], onPath = {}; onPath[o.i] = 1;
      (function dfs(cur) {
        if (capped) return;
        var list = adj[cur];
        for (var i = 0; i < list.length; i++) {
          var s = list[i];
          if (onPath[s.to]) continue;
          pathN.push(s.to); pathE.push(s.edge); onPath[s.to] = 1;
          if (clsOf(byId[s.to]) === 'wz') {
            totalRoutes++;
            if (routes.length >= MAX_ROUTES) { limited = true; }
            else routes.push({ origin: o.i, nodes: pathN.slice(), edges: pathE.slice(), back: pathE.some(function (x, j) { return x.a !== pathN[j]; }) });
          } else dfs(s.to);
          pathN.pop(); pathE.pop(); delete onPath[s.to];
          if (++steps > COUNT_STEPS) { capped = true; return; }
        }
      })(o.i);
    });
    if (limited) { insufficient = true; add({ id: 'limit', rules: ['LOTO-R-016'], sev: 'insufficient', title: fill(pk(capped ? M.fLimCT : M.fLimT, l), { k: nf(MAX_ROUTES, l), t: nf(totalRoutes, l) }), detail: pk(M.fLimD, l) }); }
    routes.forEach(function (r, i) { r.id = 'P' + (i + 1); r.text = r.nodes.map(tg).join(' → '); });

    /* -- per-device notes gathered across routes -- */
    var ctlOn = {}, nrvOn = {}, misOn = {};
    var breaksBy = {};           /* device id -> routes it breaks */
    routes.forEach(function (r) {
      var o = byId[r.origin], oe = energyOf(o);
      r.energy = oe;
      r.breaks = [];
      for (var j = 1; j < r.nodes.length - 1; j++) {
        var n = byId[r.nodes[j]], k = kindOf(n), et = r.edges[j - 1].e;
        if (k.c !== 'dev') continue;
        if (k.ctl) { (ctlOn[n.i] = ctlOn[n.i] || []).push(r.id); continue; }
        if (k.nrv) { (nrvOn[n.i] = nrvOn[n.i] || []).push(r.id); continue; }
        if (!isolating(n)) continue;
        if (canIsolate(n, et)) {
          r.breaks.push({ kind: 'dev', node: n.i });
          (breaksBy[n.i] = breaksBy[n.i] || []).push(r);
        } else {
          var key = n.i + '|' + et;
          (misOn[key] = misOn[key] || { d: n.i, e: et, rs: [] }).rs.push(r.id);
        }
      }
      if (clsOf(o) === 'store' && dissipated(o)) r.breaks.push({ kind: 'diss', node: o.i });
    });

    /* -- completeness of each breaking element -- */
    function missingFor(b, r) {
      var miss = [], o = byId[r.origin];
      if (b.kind === 'dev') {
        var d = byId[b.node];
        if (!d.l) miss.push({ rule: 'LOTO-R-007', text: fill(pk(M.needLock, l), { d: d.t }) });
        if (!d.g) miss.push({ rule: 'LOTO-R-008', text: fill(pk(M.needTag, l), { d: d.t }) });
        if (!d.o) miss.push({ rule: 'LOTO-R-017', text: fill(pk(M.needRole, l), { d: d.t }) });
      }
      if (!verified(o)) miss.push({ rule: 'LOTO-R-009', text: fill(pk(M.needVer, l), { s: o.t }) });
      else if (!routeVerified(o, r, sc.task)) miss.push({ rule: 'LOTO-R-020', text: fill(pk(M.needVer, l), { s: o.t }) });
      return miss;
    }
    routes.forEach(function (r) {
      var o = byId[r.origin];
      if (!r.breaks.length) {
        r.status = 'open';
        if (clsOf(o) === 'store') {
          var ms = (DISS_FOR[r.energy] || []).map(function (m) { return pk(DISS[m], l); }).join(', ');
          add({ id: 'store:' + r.id, rules: ['LOTO-R-003', 'LOTO-R-001'], sev: 'fail', route: r.id,
            title: fill(pk(M.fStoreT, l), { r: r.id, path: r.text }),
            detail: fill(pk(M.fStoreD, l), { r: r.id, s: o.t, e: en(r.energy) }),
            action: r === routes.filter(function (x) { return x.origin === o.i && !x.breaks.length; })[0] ? fill(pk(M.fStoreA, l), { s: o.t, m: ms }) : '' });
        } else {
          var cands = [];
          for (var j = 1; j < r.nodes.length - 1; j++) {
            var n = byId[r.nodes[j]];
            if (canIsolate(n, r.edges[j - 1].e) && cands.indexOf(n.t) < 0) cands.push(n.t);
          }
          add({ id: 'open:' + r.id, rules: r.back ? ['LOTO-R-001', 'LOTO-R-018'] : ['LOTO-R-001'], sev: 'fail', route: r.id,
            title: fill(pk(M.fOpenT, l), { r: r.id, path: r.text }),
            detail: pk(M.fOpenD, l),
            action: cands.length ? fill(pk(M.fOpenC, l), { r: r.id, c: cands.join(', ') }) : fill(pk(M.fOpenN, l), { r: r.id, e: en(r.edges[r.edges.length - 1].e) }) });
        }
        return;
      }
      var best = null;
      r.breaks.forEach(function (b) {
        var m = missingFor(b, r);
        b.missing = m;
        if (!best || m.length < best.missing.length) best = b;
      });
      if (!best.missing.length) { r.status = 'sec'; r.securedBy = best.node; return; }
      r.status = 'unsec';
      var all = [], rules = [];
      r.breaks.forEach(function (b) {
        b.missing.forEach(function (x) {
          if (all.indexOf(x.text) < 0) all.push(x.text);
          if (rules.indexOf(x.rule) < 0) rules.push(x.rule);
        });
      });
      add({ id: 'unsec:' + r.id, rules: rules, sev: 'attention', route: r.id,
        title: fill(pk(M.fUnsecT, l), { r: r.id, path: r.text }),
        detail: fill(pk(M.fUnsecD, l), { r: r.id, list: all.join('; ') }) });
    });

    /* -- planned isolation points -- */
    var planned = Object.keys(breaksBy).map(function (id) { return byId[id]; });
    planned.sort(function (a, b) { return ENERGY_ORDER.indexOf(devEnergy(a)) - ENERGY_ORDER.indexOf(devEnergy(b)) || cmp(a.t, b.t); });
    function devEnergy(d) { var rs = breaksBy[d.i] || []; return rs.length ? rs[0].edges[rs[0].nodes.indexOf(d.i) - 1].e : ''; }
    function devComplete(d) {
      if (!d.l || !d.g || !d.o) return false;
      return breaksBy[d.i].every(function (r) { return routeVerified(byId[r.origin], r, sc.task); });
    }
    planned.forEach(function (d) {
      d._complete = devComplete(d);
      if (d._complete) return;
      var rs = breaksBy[d.i];
      if (rs.every(function (r) { return r.status === 'sec' && r.securedBy !== d.i; })) {
        var miss = missingFor({ kind: 'dev', node: d.i }, rs[0]).map(function (x) { return x.text; });
        add({ id: 'red:' + d.i, rules: ['LOTO-R-007'], sev: 'info',
          title: fill(pk(M.fRedT, l), { d: d.t, rs: rs.map(function (r) { return r.id; }).join(', ') }),
          detail: miss.join('; ') });
      }
    });
    var openSupplyOrigins = {};
    routes.forEach(function (r) { if (r.status === 'open' && clsOf(byId[r.origin]) === 'src') openSupplyOrigins[r.origin] = 1; });

    /* -- trapped fluid sections (R-004) -- */
    var sections = [];
    wz.forEach(function (w) {
      Object.keys(FLUID).forEach(function (fe) {
        var seen = {}, stack = [w.i], boundary = [], bleeds = [], members = [];
        seen[w.i] = 1;
        var fedDirect = false;
        while (stack.length) {
          var cur = stack.pop();
          members.push(cur);
          sc.edges.forEach(function (e) {
            if (e.e !== fe) return;
            var other = e.a === cur ? e.b : (e.b === cur ? e.a : null);
            if (!other || seen[other]) return;
            var on = byId[other];
            seen[other] = 1;
            if (isolating(on) && canIsolate(on, fe)) { boundary.push(other); return; }
            if (clsOf(on) === 'bleed') { bleeds.push(other); members.push(other); return; }
            if (clsOf(on) === 'src') fedDirect = true;
            stack.push(other);
          });
        }
        if (!boundary.length || fedDirect) return;
        var openBleed = bleeds.filter(function (b) { return byId[b].p === 'open'; });
        var sec = { id: 'SEC' + (sections.length + 1), wz: w.i, energy: fe, boundary: boundary, bleeds: bleeds,
          open: openBleed.length > 0, members: members };
        sections.push(sec);
        if (!sec.open) {
          var btxt = boundary.map(tg).join(', ');
          var via = routes.filter(function (r) { return r.nodes[r.nodes.length - 1] === w.i && r.nodes.some(function (x) { return boundary.indexOf(x) >= 0; }); });
          add({ id: 'trap:' + sec.id, rules: ['LOTO-R-004'], sev: 'fail', route: via.length ? via[0].id : undefined,
            title: fill(pk(M.fTrapT, l), { e: en(fe), b: btxt, w: w.t }),
            detail: fill(pk(M.fTrapD, l), { sec: sec.id }) + (via.length ? ' ' + via.map(function (r) { return r.id + ': ' + r.text; }).join('; ') + '.' : ''),
            action: bleeds.length ? fill(pk(M.fTrapA, l), { x: bleeds.map(tg).join(', ') }) : fill(pk(M.fTrapN, l), { sec: sec.id }) });
        }
      });
    });

    /* -- device notes -- */
    Object.keys(ctlOn).forEach(function (id) {
      var rs = uniq(ctlOn[id]).join(', ');
      var relied = routes.some(function (r) { return ctlOn[id].indexOf(r.id) >= 0 && r.status !== 'sec'; });
      add({ id: 'ctl:' + id, rules: ['LOTO-R-005'], sev: relied ? 'attention' : 'info', title: fill(pk(M.fCtlT, l), { d: tg(id), rs: rs }), detail: fill(pk(M.fCtlD, l), { d: tg(id), rs: rs }) });
    });
    Object.keys(nrvOn).forEach(function (id) {
      add({ id: 'nrv:' + id, rules: ['LOTO-R-006'], sev: 'info', title: fill(pk(M.fNrvT, l), { d: tg(id), rs: uniq(nrvOn[id]).join(', ') }), detail: '' });
    });
    Object.keys(misOn).forEach(function (key) {
      var m = misOn[key], d = byId[m.d], k = kindOf(d);
      add({ id: 'mis:' + key, rules: ['LOTO-R-002'], sev: 'attention',
        title: fill(pk(M.fMisT, l), { d: d.t, e: en(m.e), rs: uniq(m.rs).join(', ') }),
        detail: fill(pk(M.fMisD, l), { d: d.t, k: pk(k.label, l), list: k.can.map(en).join(', ') }) });
    });

    /* -- stores, verification -- */
    var reach = {};
    routes.forEach(function (r) { reach[r.origin] = 1; });
    var storesNeeding = [], verNeeded = [], r20 = [];
    var noRoute = !routes.length && wz.length > 0 && origins.length > 0;
    if (noRoute) insufficient = true;
    origins.forEach(function (o) {
      var e = energyOf(o);
      if (!reach[o.i]) {
        add({ id: 'uncon:' + o.i, rules: ['LOTO-R-014'], sev: noRoute ? 'insufficient' : 'info', title: fill(pk(M.fUnconT, l), { s: o.t }), detail: fill(pk(M.fUnconD, l), { s: o.t }) });
        return;
      }
      verNeeded.push(o);
      if (o.vm && (VER_FOR[e] || []).indexOf(o.vm) < 0) {
        add({ id: 'vm:' + o.i, rules: ['LOTO-R-011'], sev: 'attention', title: fill(pk(M.fVmT, l), { s: o.t, e: en(e) }),
          detail: fill(pk(M.fMethD, l), { s: o.t, m: pk(VER[o.vm], l), list: VER_FOR[e].map(function (x) { return pk(VER[x], l); }).join(', ') }) });
      }
      var r20routes = routes.filter(function (r) { return r.origin === o.i && verified(o) && !routeVerified(o, r, sc.task); });
      if (r20routes.length) {
        r20.push(o.i);
        var rsT = r20routes.map(function (r) { return r.id; }).join(', ');
        add({ id: 'r20:' + o.i, rules: ['LOTO-R-020'], sev: 'attention', title: fill(pk(M.fR20T, l), { s: o.t }),
          detail: sc.task === 'elec' ? fill(pk(M.fR20D, l), { s: o.t }) : fill(pk(M.fR20E, l), { s: o.t, rs: rsT }) });
      }
      if (clsOf(o) === 'store') {
        var needs = routes.some(function (r) { return r.origin === o.i && !r.breaks.some(function (b) { return b.kind === 'dev'; }); });
        if (needs) storesNeeding.push(o);
        if (o.dm && (DISS_FOR[e] || []).indexOf(o.dm) < 0) {
          add({ id: 'dm:' + o.i, rules: ['LOTO-R-010'], sev: 'attention', title: fill(pk(M.fDmT, l), { s: o.t, e: en(e) }),
            detail: fill(pk(M.fMethD, l), { s: o.t, m: pk(DISS[o.dm], l), list: DISS_FOR[e].map(function (x) { return pk(DISS[x], l); }).join(', ') }) });
        }
      }
    });

    /* -- mixed energy forms at a non-converting node (R-015) -- */
    sc.nodes.forEach(function (n) {
      var c = clsOf(n);
      if (c === 'equip' || c === 'wz') return;
      var forms = [];
      if (isOrigin(n)) forms.push(energyOf(n));
      sc.edges.forEach(function (e) { if ((e.a === n.i || e.b === n.i) && forms.indexOf(e.e) < 0) forms.push(e.e); });
      if (forms.length > 1) add({ id: 'mix:' + n.i, rules: ['LOTO-R-015'], sev: 'info', title: fill(pk(M.fMixT, l), { n: n.t, list: forms.map(en).join(', ') }), detail: fill(pk(M.fMixD, l), { n: n.t }) });
    });

    /* -- register, in the order isolate / lock+tag / dissipate / verify (R-019) -- */
    var reg = [];
    function row(phase, node, action, role, done, energy) {
      reg.push({ n: reg.length + 1, phase: phase, node: node ? node.i : '', item: node ? node.t : '', energy: energy || '',
        action: action, role: role || '', done: !!done });
    }
    planned.forEach(function (d) { row('iso', d, fill(pk(RS.setTo, l), { p: pk(POS[d.p], l) }), d.o, true, devEnergy(d)); });
    planned.forEach(function (d) { row('lock', d, pk(RS.lockTag, l), d.o, d.l && d.g, devEnergy(d)); });
    storesNeeding.forEach(function (o) { row('diss', o, o.dm ? pk(DISS[o.dm], l) : pk(RS.noMethod, l), o.o, dissipated(o), energyOf(o)); });
    sections.forEach(function (s) {
      if (s.bleeds.length) s.bleeds.forEach(function (b) { row('diss', byId[b], fill(pk(RS.openX, l), { x: byId[b].t }), byId[b].o, byId[b].p === 'open', s.energy); });
      else reg.push({ n: reg.length + 1, phase: 'diss', node: '', item: s.id, energy: s.energy, action: fill(pk(RS.noBleed, l), { sec: s.id }), role: '', done: false });
    });
    verNeeded.forEach(function (o) { row('ver', o, o.vm ? pk(VER[o.vm], l) : pk(RS.noMethod, l), o.o, verified(o) && r20.indexOf(o.i) < 0, energyOf(o)); });

    var dissRows = reg.filter(function (x) { return x.phase === 'diss'; });
    var verRows = reg.filter(function (x) { return x.phase === 'ver'; });
    var unresolved = findings.filter(function (f) { return f.sev !== 'info'; }).length;
    var counts = {
      routes: totalRoutes, routesAssessed: routes.length, routesCountIsLowerBound: capped,
      open: routes.filter(function (r) { return r.status === 'open'; }).length,
      unsec: routes.filter(function (r) { return r.status === 'unsec'; }).length,
      sec: routes.filter(function (r) { return r.status === 'sec'; }).length,
      isoRequired: planned.length + Object.keys(openSupplyOrigins).length,
      isoPlanned: planned.length,
      isoComplete: planned.filter(function (d) { return d._complete; }).length,
      dissRequired: dissRows.length, dissDone: dissRows.filter(function (x) { return x.done; }).length,
      verRequired: verRows.length, verDone: verRows.filter(function (x) { return x.done; }).length,
      sources: origins.filter(function (o) { return clsOf(o) === 'src'; }).length,
      stores: origins.filter(function (o) { return clsOf(o) === 'store'; }).length,
      unresolved: unresolved
    };
    var status = insufficient ? 'insufficient' : (unresolved ? 'unresolved' : 'clear');
    var sevOrder = { insufficient: 0, fail: 1, attention: 2, info: 3 };
    findings.sort(function (a, b) { return sevOrder[a.sev] - sevOrder[b.sev]; });
    return { scheme: sc, byId: byId, routes: routes, findings: findings, register: reg, sections: sections,
      planned: planned.map(function (d) { return d.i; }), complete: planned.filter(function (d) { return d._complete; }).map(function (d) { return d.i; }),
      counts: counts, status: status };
  }
  function uniq(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); }
  function cmp(a, b) { return a < b ? -1 : (a > b ? 1 : 0); }

  /* ============================================================= 5. presets */
  function N(i, k, x, y, o) { var n = { i: i, k: k, t: i, x: x, y: y }; for (var q in (o || {})) n[q] = o[q]; return n; }
  function E(a, b, e, d) { return { i: a + '-' + b, a: a, b: b, e: e, d: d ? 1 : 0 }; }
  var PRESETS = {
    pump: { label: T('Centrifugal pump: motor, suction and discharge pressure', 'Відцентровий насос: двигун, тиск на всмоктуванні й нагнітанні', 'Kreiselpumpe: Motor, Saug- und Förderdruck', 'Centrifugaalpomp: motor, zuig- en persdruk', 'Pompe centrifuge : moteur, pression aspiration et refoulement', 'Bomba centrífuga: motor, presión de aspiración e impulsión', 'Pompa wirowa: silnik, ciśnienie ssania i tłoczenia'),
      build: function () { return { title: 'P-201', task: 'mech', nodes: [
        N('E1', 'src.elec', 40, 60, { o: 'el', vm: 'trystart', vd: 0 }),
        N('Q1', 'iso.switch', 180, 60, { p: 'disc', l: 1, g: 1, o: 'el' }),
        N('M1', 'equip', 320, 60),
        N('F1', 'store.rot', 320, 180, { o: 'mf', dm: 'wait', dd: 1, vm: 'restraint', vd: 1 }),
        N('S1', 'src.press', 40, 300, { o: 'op', vm: 'zerop', vd: 0 }),
        N('V1', 'iso.valve', 180, 300, { p: 'closed', l: 1, g: 0, o: 'op' }),
        N('WZ', 'wz', 460, 300, { o: 'sv' }),
        N('D1', 'bleed', 460, 420, { p: 'closed', o: 'op' }),
        N('S2', 'src.press', 740, 300, { o: 'op', vm: 'zerop', vd: 0 }),
        N('NR1', 'iso.check', 600, 220),
        N('V2', 'iso.valve', 600, 360, { p: 'open', o: 'op' })
      ], edges: [
        E('E1', 'Q1', 'elec'), E('Q1', 'M1', 'elec'), E('M1', 'WZ', 'mech'), E('F1', 'WZ', 'mech'),
        E('S1', 'V1', 'press'), E('V1', 'WZ', 'press'), E('WZ', 'D1', 'press'),
        E('S2', 'NR1', 'press'), E('NR1', 'WZ', 'press', 1), E('S2', 'V2', 'press'), E('V2', 'WZ', 'press')
      ] }; } },
    press: { label: T('Hydraulic press: raised ram and accumulator', 'Гідравлічний прес: піднятий повзун і акумулятор', 'Hydraulische Presse: angehobener Stößel und Speicher', 'Hydraulische pers: geheven stempel en accumulator', 'Presse hydraulique : coulisseau levé et accumulateur', 'Prensa hidráulica: carro elevado y acumulador', 'Prasa hydrauliczna: podniesiony suwak i akumulator'),
      build: function () { return { title: 'PR-12', task: 'mech', nodes: [
        N('E1', 'src.elec', 40, 60, { o: 'el', vm: 'dead', vd: 1 }),
        N('Q1', 'iso.switch', 180, 60, { p: 'off', l: 1, g: 1, o: 'el' }),
        N('HPU', 'equip', 320, 60),
        N('V1', 'iso.valve', 460, 60, { p: 'closed', l: 1, g: 1, o: 'mf' }),
        N('ACC', 'store.acc', 320, 200, { o: 'mf', dm: 'lower', dd: 1, vm: 'zerop', vd: 1 }),
        N('RAM', 'store.grav', 600, 320, { o: 'mf', dm: '', vm: 'restraint', vd: 0 }),
        N('BK1', 'iso.mech', 600, 200, { p: 'free', o: 'mf' }),
        N('ES1', 'iso.control', 460, 200, { p: 'stop' }),
        N('WZ', 'wz', 740, 200, { o: 'sv' })
      ], edges: [
        E('E1', 'Q1', 'elec'), E('Q1', 'HPU', 'elec'), E('HPU', 'V1', 'hyd'), E('V1', 'WZ', 'hyd'),
        E('ACC', 'ES1', 'hyd'), E('ES1', 'WZ', 'hyd'), E('RAM', 'BK1', 'grav'), E('BK1', 'WZ', 'grav')
      ] }; } },

      build: function () { return { title: 'XV-7', task: 'mech', nodes: [

  /* ============================================================ 6. exchange
     tools.petrov.re/safety-exchange/v1. This tool writes kind
     loto.isolation-register and reads kind ptw.isolation-request. */
  var EX_SCHEMA = 'tools.petrov.re/safety-exchange/v1';
  var EX_OUT = 'loto.isolation-register', EX_IN = 'ptw.isolation-request';
  var EX_KEY = 'tools.petrov.re/safety-exchange/';
  var EN_ALIAS = { electrical: 'elec', pressure: 'press', vacuum: 'press', hydraulic: 'hyd', pneumatic: 'pneu',
    thermal: 'therm', heat: 'therm', cold: 'therm', gravity: 'grav', rotation: 'mech', inertia: 'mech',
    spring: 'spring', chemical: 'chem' };
  var SRC_FOR = { elec: 'src.elec', press: 'src.press', hyd: 'src.hyd', pneu: 'src.pneu', therm: 'src.therm',
    grav: 'store.grav', mech: 'store.rot', spring: 'store.spring', chem: 'store.chem' };

  /* Contract B (loto.isolation-register): items {id,label,type:'step'|'device',
     status: planned|applied|verified|removed, blocking, origin_status, step?, energy?, role?}. */
  function buildExchange(scIn, stamp) {
    var an = analyze(scIn, 'en'), sc = an.scheme;
    var items = an.register.map(function (r) {
      var st = r.done ? (r.phase === 'ver' ? 'verified' : 'applied') : 'planned';
      return { id: 'reg-' + r.n + '-' + (r.node || r.item), label: r.item + ' — ' + r.action, type: 'step',
        status: st, blocking: !r.done, origin_status: r.done ? 'done' : 'open',
        step: String(r.n), phase: r.phase, node: r.node, energy: r.energy, role: r.role };
    });
    an.planned.forEach(function (id) {
      var d = an.byId[id], complete = an.complete.indexOf(id) >= 0;
      var st = complete ? 'verified' : ((d.l || d.g) ? 'applied' : 'planned');
      var rs = an.routes.filter(function (r) { return r.breaks.some(function (b) { return b.node === id; }); });
      var e = rs.length ? rs[0].edges[rs[0].nodes.indexOf(id) - 1].e : '';
      items.push({ id: 'iso-' + id, label: d.t, type: 'device', status: st, blocking: !complete,
        origin_status: complete ? 'complete' : 'incomplete', energy: e, role: d.o || '',
        kind: d.k, position: d.p, locked: !!d.l, tagged: !!d.g });
    });
    return {
      schema: EX_SCHEMA, kind: EX_OUT,
      source: { id: 'isolationplanner', file: 'isolationplanner.html', revision: MANIFEST_REV },
      created_at: stamp || new Date().toISOString(),
      items: items,
      notes: { work: sc.title, task: sc.task, plan_status: an.status, open_energy_paths: an.counts.open,
        unsecured_routes: an.counts.unsec, open_routes: an.routes.filter(function (r) { return r.status === 'open'; }).map(function (r) { return r.text; }),
        verification_done: an.counts.verDone + '/' + an.counts.verRequired,
        disclaimer: 'Structural check of a modelled scheme; not a permit and not a statement of zero energy.' }
    };
  }

  /* Contract C (ptw.isolation-request) plus the permitworkstudio r1 shape:
     an item without `type` but with equipment/zone creates the work zone once;
     a control id starting with EL- creates one electrical source.
     Returns {ok, scheme, applied:[{id,label,what}], ignored:[{id,label,why}], error} */
  function applyRequest(doc, scIn) {
    var res = { ok: false, scheme: null, applied: [], ignored: [], error: '' };
    if (!doc || typeof doc !== 'object') { res.error = 'format'; return res; }
    if (doc.schema !== EX_SCHEMA) { res.error = 'schema'; return res; }
    if (doc.kind !== EX_IN) { res.error = 'kind'; return res; }
    if (!Array.isArray(doc.items)) { res.error = 'format'; return res; }
    var sc = normalize(scIn);
    var used = {}; sc.nodes.forEach(function (n) { used[n.i] = 1; });
    var maxY = sc.nodes.reduce(function (m, n) { return Math.max(m, n.y); }, 0);
    var col = 0, wzDone = false, elDone = false;
    function lab(v, fb) { return v == null ? fb : String(typeof v === 'object' ? pk(v) : v); }
    function place(it, id, label, kind, nidBase) {
      if (sc.nodes.length >= MAX_NODES) { res.ignored.push({ id: id, label: label, why: 'full' }); return false; }
      var nid = ('R' + nidBase).replace(/[^\w.-]/g, '').slice(0, 20);
      if (used[nid]) { res.ignored.push({ id: id, label: label, why: 'dup' }); return true; }
      used[nid] = 1;
      sc.nodes.push({ i: nid, k: kind, t: label.slice(0, 24) || nid, x: 40 + 140 * (col % 5), y: maxY + 140 + 120 * Math.floor(col / 5) });
      col++;
      res.applied.push({ id: id, label: label, what: kind });
      return true;
    }
    doc.items.forEach(function (it) {
      var id = it && it.id != null ? String(it.id) : '';
      var label = it ? lab(it.label, id) : '';
      if (!it || !id) { res.ignored.push({ id: id, label: label, why: 'noid' }); return; }
      var type = String(it.type || '').toLowerCase().replace(/[-\s]/g, '_');
      var ctl = String(it.control || '');
      if (type === 'work_zone' || type === 'equipment') { place(it, id, label, 'wz', id); wzDone = true; return; }
      if (type === 'energy_source') {
        var e = String(it.energy || '').toLowerCase();
        e = ENERGY[e] ? e : EN_ALIAS[e];
        if (!e) { res.ignored.push({ id: id, label: label, why: 'energy' }); return; }
        place(it, id, label, SRC_FOR[e], id);
        if (e === 'elec') elDone = true;
        return;
      }
      if (type === 'control') { res.ignored.push({ id: id, label: label, why: 'control' }); return; }
      if (type) { res.ignored.push({ id: id, label: label, why: 'type' }); return; }
      /* no type: permitworkstudio r1 control items */
      var where = it.equipment || it.zone;
      if (!wzDone && where) {
        var wl = lab(it.equipment, '') || lab(it.zone, '');
        wzDone = true;
        place(it, id, wl, 'wz', 'WZ-' + wl);
        return;
      }
      if (/^EL-/i.test(ctl)) {
        if (elDone) { res.ignored.push({ id: id, label: label, why: 'covered' }); return; }
        elDone = true;
        var el = (lab(it.equipment, '') || 'EL') + ' ' + pk(ENERGY.elec, 'en');
        place(it, id, el, 'src.elec', 'EL-' + (lab(it.equipment, '') || 'SRC'));
        return;
      }
      res.ignored.push({ id: id, label: label, why: ctl ? 'control' : 'type' });
    });
    var nt = doc.notes || {};
    var work = typeof nt.work === 'string' && nt.work ? nt.work : (typeof nt.permit_type === 'string' ? nt.permit_type : '');
    if (work && !sc.title) sc.title = work.slice(0, 120);
    res.scheme = normalize(sc);
    res.ok = true;
    return res;
  }

  /* ============================================================ 7. self-test */
  function S(nodes, edges, extra) { var s = { title: 't', task: 'mech', nodes: nodes, edges: edges }; for (var k in (extra || {})) s[k] = extra[k]; return s; }
  var OKV = { l: 1, g: 1, o: 'ap' };
  function dev(i, k, p, o) { var n = N(i, k, 100, 100, { p: p }); var src = o === undefined ? OKV : o; for (var q in src) n[q] = src[q]; return n; }
  function srcN(i, k, vm, vd, extra) { var n = N(i, k, 0, 0, { o: 'op', vm: vm, vd: vd }); for (var q in (extra || {})) n[q] = extra[q]; return n; }
  function has(an, rule, sev) { return an.findings.some(function (f) { return f.rules.indexOf(rule) >= 0 && (!sev || f.sev === sev); }); }
  function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  async function selfTests() {

    a = analyze(S([srcN('S', 'src.elec', 'dead', 1), dev('Q', 'iso.switch', 'on'), WZ], [E('S', 'Q', 'elec'), E('Q', 'W', 'elec')]), 'en');
    t('T02', 'LOTO-R-001', 'negative', 'switch left on does not break the path', [a.counts.open, a.findings[0].action.indexOf('Q') >= 0], [1, true]);
    a = analyze(S([srcN('S', 'src.press', 'zerop', 1), srcN('S2', 'src.pneu', 'zerop', 1), WZ], [E('S', 'W', 'press'), E('S2', 'W', 'pneu')]), 'en');
    t('T03', 'LOTO-R-001', 'positive', 'two sources, two open paths, two required points', [a.counts.open, a.counts.isoRequired], [2, 2]);

    /* R-002 */
    a = analyze(S([srcN('S', 'src.elec', 'dead', 1), dev('V', 'iso.valve', 'closed'), WZ], [E('S', 'V', 'elec'), E('V', 'W', 'elec')]), 'en');
    t('T04', 'LOTO-R-002', 'negative', 'closed valve on an electrical line: path stays open', [a.counts.open, has(a, 'LOTO-R-002')], [1, true]);
    a = analyze(S([srcN('S', 'src.press', 'zerop', 1), dev('Q', 'iso.switch', 'off'), WZ], [E('S', 'Q', 'press'), E('Q', 'W', 'press')]), 'en');
    t('T05', 'LOTO-R-002', 'negative', 'open switch on a pressure line: path stays open', [a.counts.open, has(a, 'LOTO-R-002')], [1, true]);
    a = analyze(S([srcN('S', 'src.elec', 'dead', 1), dev('B', 'iso.mech', 'blocked'), WZ], [E('S', 'B', 'elec'), E('B', 'W', 'elec')]), 'en');
    t('T06', 'LOTO-R-002', 'negative', 'mechanical block on an electrical line: path stays open', a.counts.open, 1);
    a = analyze(S([srcN('S', 'src.pneu', 'zerop', 1), dev('C', 'iso.plug', 'unplug'), WZ], [E('S', 'C', 'pneu'), E('C', 'W', 'pneu')]), 'en');

    /* R-003 */

    a = analyze(S([srcN('S', 'src.press', 'zerop', 1), dev('V', 'iso.valve', 'closed'), st('', 0, 'zerop', 1), WZ, N('D', 'bleed', 0, 0, { p: 'open' })],

    t('T08', 'LOTO-R-003', 'positive', 'closed valve upstream does not dissipate a receiver', [has(a, 'LOTO-R-003', 'fail'), a.counts.dissRequired - a.counts.dissDone], [true, 1]);
    a = analyze(S([srcN('S', 'src.press', 'zerop', 1), dev('V', 'iso.valve', 'closed'), st('vent', 1, 'zerop', 1), WZ, N('D', 'bleed', 0, 0, { p: 'open' })],
      [E('S', 'V', 'press'), E('V', 'A', 'press'), E('A', 'W', 'press'), E('W', 'D', 'press')]), 'en');
    t('T09', 'LOTO-R-003', 'negative', 'vented and verified receiver: no finding', [a.status, a.counts.sec], ['clear', 2]);
    a = analyze(S([N('F', 'store.rot', 0, 0, { o: 'mf', dm: '', vm: 'restraint', vd: 0 }), srcN('E', 'src.elec', 'dead', 1), dev('Q', 'iso.switch', 'disc'), N('M', 'equip', 0, 0), WZ],
      [E('E', 'Q', 'elec'), E('Q', 'M', 'elec'), E('M', 'W', 'mech'), E('F', 'W', 'mech')]), 'en');
    t('T10', 'LOTO-R-003', 'positive', 'motor isolated, rotating mass still a source', [a.counts.open, has(a, 'LOTO-R-003')], [1, true]);

    var trap = function (bleed) {

    /* R-005 */
    a = analyze(S([srcN('S', 'src.hyd', 'zerop', 1), dev('ES', 'iso.control', 'stop'), WZ], [E('S', 'ES', 'hyd'), E('ES', 'W', 'hyd')]), 'en');
    t('T18', 'LOTO-R-005', 'negative', 'stop button in stop position does not break the path', [a.counts.open, has(a, 'LOTO-R-005')], [1, true]);

    /* R-006 */
    a = analyze(S([srcN('S', 'src.press', 'zerop', 1), N('NR', 'iso.check', 0, 0), WZ], [E('S', 'NR', 'press'), E('NR', 'W', 'press')]), 'en');
    t('T19', 'LOTO-R-006', 'negative', 'non-return valve does not break the path', [a.counts.open, has(a, 'LOTO-R-006', 'info')], [1, true]);

    var one = function (o, vd) { return analyze(S([srcN('S', 'src.press', 'zerop', vd), dev('V', 'iso.valve', 'closed', o), WZ, N('D', 'bleed', 0, 0, { p: 'open' })], [E('S', 'V', 'press'), E('V', 'W', 'press'), E('W', 'D', 'press')]), 'en'); };
    a = one({ l: 0, g: 1, o: 'ap' }, 1);

    t('T25', 'LOTO-R-001', 'positive', 'clear plan still lists the route and the point', [a.routes.length, a.planned], [1, ['V']]);

    /* R-010 / R-011 */
    a = analyze(S([N('A', 'store.acc', 0, 0, { o: 'mf', dm: 'lower', dd: 1, vm: 'zerop', vd: 1 }), WZ], [E('A', 'W', 'hyd')]), 'en');

    mNote1: T('The scheme is a directed graph. Every simple path from a source or store to a work zone is a route; a route is broken only by a device in an isolating position that suits the energy form of the incoming line, or by a completed dissipation of the store it starts from.', 'Схема — орієнтований граф. Кожен простий шлях від джерела чи накопичувача до робочої зони є маршрутом; маршрут розриває лише пристрій в ізолювальному положенні, придатний для виду енергії вхідної лінії, або завершене скидання енергії накопичувача, з якого він починається.', 'Das Schema ist ein gerichteter Graph. Jeder einfache Pfad von einer Quelle oder einem Speicher zu einem Arbeitsbereich ist ein Weg; unterbrochen wird er nur durch ein Gerät in Trennstellung, das zur Energieform der ankommenden Leitung passt, oder durch die abgeschlossene Entladung des Ausgangsspeichers.', 'Het schema is een gerichte graaf. Elk enkelvoudig pad van een bron of buffer naar een werkzone is een route; die wordt alleen onderbroken door een element in scheidende stand dat past bij de energievorm van de inkomende leiding, of door een afgeronde ontlading van de beginbuffer.', 'Le schéma est un graphe orienté. Tout chemin simple d’une source ou d’un stockage vers une zone de travail est un chemin évalué ; il n’est coupé que par un organe en position d’isolement adapté à la forme d’énergie de la ligne entrante, ou par la dissipation achevée du stockage de départ.', 'El esquema es un grafo dirigido. Cada camino simple de una fuente o acumulador a una zona de trabajo es una ruta; solo la corta un dispositivo en posición de aislamiento adecuado a la forma de energía de la línea entrante, o la disipación completada del acumulador de origen.', 'Schemat jest grafem skierowanym. Każda prosta ścieżka od źródła lub magazynu do strefy pracy jest drogą; przerywa ją tylko urządzenie w pozycji odłączenia pasujące do postaci energii linii wejściowej albo zakończone rozładowanie magazynu, z którego wychodzi.'),
    mNote2: T('A broken route counts as secured when one breaking element is complete: locked, tagged, with a responsible role, and with zero energy verified at the route origin by a method suited to its energy form.', 'Розірваний маршрут вважається захищеним, коли один із розривних елементів завершений: замкнений, позначений, з відповідальною роллю і з перевіреною нульовою енергією на початку маршруту придатним способом.', 'Ein unterbrochener Weg gilt als gesichert, wenn ein trennendes Element vollständig ist: abgeschlossen, gekennzeichnet, mit verantwortlicher Rolle und mit festgestellter Energiefreiheit am Wegursprung durch eine passende Methode.', 'Een onderbroken route geldt als beveiligd als één onderbrekend element volledig is: afgesloten, gelabeld, met verantwoordelijke rol en met geverifieerde nul energie aan het begin van de route via een passende methode.', 'Un chemin coupé est sécurisé quand un élément de coupure est complet : cadenassé, étiqueté, avec un rôle responsable et une absence d’énergie vérifiée à l’origine par une méthode adaptée.', 'Una ruta cortada cuenta como asegurada cuando un elemento de corte está completo: con candado, etiqueta, rol responsable y energía cero verificada en el origen con un método adecuado.', 'Przerwana droga jest zabezpieczona, gdy jeden element przerywający jest kompletny: zablokowany, oznaczony, z odpowiedzialną rolą i ze sprawdzonym brakiem energii u początku drogi odpowiednią metodą.'),
    mNote3: T('Fluid sections: from each work zone the tool follows lines of one fluid energy form up to the closed valves; a section bounded by a closed valve needs an open bleed point inside it.', 'Ділянки середовища: від кожної робочої зони інструмент іде лініями одного виду енергії середовища до закритих клапанів; ділянка, обмежена закритим клапаном, потребує відкритої точки скидання всередині.', 'Mediumabschnitte: vom Arbeitsbereich aus folgt das Werkzeug den Leitungen einer Mediumenergieform bis zu den geschlossenen Ventilen; ein so begrenzter Abschnitt braucht eine offene Entlüftung.', 'Mediumsecties: vanaf elke werkzone volgt de tool leidingen van één mediumenergievorm tot de dichte afsluiters; een zo begrensde sectie heeft een open aftap nodig.', 'Tronçons de fluide : depuis chaque zone, l’outil suit les lignes d’une forme d’énergie fluide jusqu’aux vannes fermées ; un tronçon ainsi borné exige une purge ouverte.', 'Tramos de fluido: desde cada zona la herramienta sigue las líneas de una forma de energía de fluido hasta las válvulas cerradas; un tramo así limitado necesita un drenaje abierto.', 'Odcinki czynnika: od każdej strefy pracy narzędzie idzie liniami jednej postaci energii czynnika do zamkniętych zaworów; tak ograniczony odcinek wymaga otwartego spustu.'),
    mNote4: T('Route search is limited to {k} routes and the scheme to {n} objects; beyond that the result is marked insufficient.', 'Пошук обмежено {k} маршрутами, схему — {n} об’єктами; понад це результат позначається як недостатній.', 'Die Wegsuche ist auf {k} Wege und das Schema auf {n} Objekte begrenzt; darüber gilt das Ergebnis als unzureichend.', 'Routezoeken is beperkt tot {k} routes en het schema tot {n} objecten; daarboven is het resultaat onvoldoende.', 'La recherche est limitée à {k} chemins et le schéma à {n} objets ; au-delà, le résultat est marqué insuffisant.', 'La búsqueda se limita a {k} rutas y el esquema a {n} objetos; por encima el resultado se marca insuficiente.', 'Wyszukiwanie ograniczono do {k} dróg, a schemat do {n} obiektów; powyżej wynik oznacza się jako niewystarczający.'),
    lTopic1: T('Isolation is not dissipation', 'Ізоляція — не скидання енергії', 'Trennen ist nicht Entladen', 'Scheiden is geen ontladen', 'Isoler n’est pas dissiper', 'Aislar no es disipar', 'Odłączenie to nie rozładowanie'),
    lBody1: T('A closed valve stops new fluid arriving; the pressure already between the valve and the work stays there. A switched-off motor stops being driven; its rotor keeps turning until it stands still. The tool therefore treats every store as a source of its own until its dissipation is recorded.', 'Закритий клапан зупиняє надходження нового середовища, але тиск між клапаном і місцем робіт лишається. Вимкнений двигун більше не приводиться, але ротор обертається до зупинки. Тому кожен накопичувач вважається окремим джерелом, доки скидання не зафіксовано.', 'Ein geschlossenes Ventil hält neues Medium fern; der Druck zwischen Ventil und Arbeitsstelle bleibt. Ein abgeschalteter Motor dreht weiter, bis er steht. Deshalb gilt jeder Speicher als eigene Quelle, bis seine Entladung erfasst ist.', 'Een dichte afsluiter houdt nieuw medium tegen; de druk tussen afsluiter en werkplek blijft. Een uitgeschakelde motor draait door tot stilstand. Daarom telt elke buffer als eigen bron tot de ontlading is vastgelegd.', 'Une vanne fermée arrête l’arrivée de fluide ; la pression entre la vanne et le poste reste. Un moteur coupé continue de tourner jusqu’à l’arrêt. Chaque stockage reste donc une source tant que sa dissipation n’est pas enregistrée.', 'Una válvula cerrada detiene la llegada de fluido; la presión entre la válvula y el trabajo permanece. Un motor desconectado sigue girando hasta pararse. Por eso cada acumulador cuenta como fuente hasta registrar su disipación.', 'Zamknięty zawór zatrzymuje dopływ czynnika, ale ciśnienie między zaworem a miejscem pracy pozostaje. Wyłączony silnik obraca się aż do zatrzymania. Dlatego każdy magazyn jest osobnym źródłem, dopóki nie zapisano rozładowania.'),
    lTopic2: T('Back-feed and bidirectional lines', 'Зворотне живлення та двонапрямні лінії', 'Rückspeisung und beidseitige Leitungen', 'Terugvoeding en tweerichtingsleidingen', 'Réalimentation et lignes bidirectionnelles', 'Realimentación y líneas bidireccionales', 'Zasilanie zwrotne i linie dwukierunkowe'),
    lBody2: T('Mark a line as “both ways” where energy can flow against the normal direction: a standby generator on a shared busbar, a second header, a bypass. Routes are then searched in both directions along that line.', 'Позначайте лінію «в обидва боки», якщо енергія може йти проти звичайного напрямку: резервний генератор на спільній шині, другий колектор, байпас. Тоді маршрути шукаються в обох напрямках.', 'Eine Leitung als „beide Richtungen“ markieren, wo Energie gegen die Normalrichtung fließen kann: Notstromaggregat an gemeinsamer Schiene, zweiter Sammler, Bypass.', 'Markeer een leiding als ‘beide richtingen’ waar energie tegen de normale richting kan stromen: noodaggregaat op een gedeelde rail, tweede verdeelstuk, bypass.', 'Marquer une ligne « deux sens » là où l’énergie peut circuler à contresens : groupe de secours sur un jeu de barres commun, second collecteur, by-pass.', 'Marque una línea como «ambos sentidos» donde la energía pueda fluir al revés: grupo electrógeno en un embarrado común, segundo colector, bypass.', 'Oznacz linię jako „oba kierunki”, gdy energia może płynąć pod prąd: agregat na wspólnej szynie, drugi kolektor, obejście.'),
    lTopic3: T('Where the rules come from', 'Звідки правила', 'Woher die Regeln stammen', 'Waar de regels vandaan komen', 'D’où viennent les règles', 'De dónde vienen las reglas', 'Skąd pochodzą zasady'),
    lBody3: T('Each rule carries one basis: physical (the graph itself), guidance, national regulation, site rule or heuristic, with its source. The tool does not replace the site LOTO procedure; where that procedure asks for more, it governs.', 'Кожне правило має одну підставу: фізичну (сам граф), настанову, національну норму, правило підприємства чи евристику, з джерелом. Інструмент не замінює процедуру LOTO підприємства; якщо вона вимагає більшого, діє вона.', 'Jede Regel hat genau eine Grundlage: physikalisch (der Graph), Leitfaden, nationale Vorschrift, Betriebsregel oder Heuristik, mit Quelle. Das Werkzeug ersetzt kein betriebliches LOTO-Verfahren; verlangt dieses mehr, gilt es.', 'Elke regel heeft één grondslag: fysisch (de graaf), richtlijn, nationale regelgeving, bedrijfsregel of heuristiek, met bron. De tool vervangt de LOTO-procedure van de locatie niet; vraagt die meer, dan geldt die.', 'Chaque règle a un seul fondement : physique (le graphe), guide, réglementation nationale, règle du site ou heuristique, avec sa source. L’outil ne remplace pas la procédure LOTO du site ; si elle exige davantage, elle prévaut.', 'Cada regla tiene un único fundamento: física (el grafo), guía, norma nacional, regla del centro o heurística, con su fuente. La herramienta no sustituye el procedimiento LOTO del centro; si este exige más, prevalece.', 'Każda zasada ma jedną podstawę: fizyczną (sam graf), wytyczne, przepis krajowy, zasadę zakładową lub heurystykę, ze źródłem. Narzędzie nie zastępuje zakładowej procedury LOTO; jeśli wymaga ona więcej, obowiązuje ona.'),
    lIntroT: T('What this tool does', 'Що робить цей інструмент', 'Was dieses Werkzeug tut', 'Wat deze tool doet', 'Ce que fait cet outil', 'Qué hace esta herramienta', 'Co robi to narzędzie'),
    lIntroB: T('Draw the plant as sources, stores, devices and a work zone. The tool lists every route by which energy can reach the work zone and what is still missing to secure each one.', 'Накресліть установку як джерела, накопичувачі, пристрої та робочу зону. Інструмент перелічить усі маршрути енергії до робочої зони і те, чого бракує для їх захисту.', 'Anlage als Quellen, Speicher, Geräte und Arbeitsbereich zeichnen. Das Werkzeug listet jeden Energieweg zum Arbeitsbereich und was zur Sicherung fehlt.', 'Teken de installatie als bronnen, buffers, elementen en een werkzone. De tool somt elke energieroute naar de werkzone op en wat nog ontbreekt.', 'Dessiner l’installation en sources, stockages, organes et zone de travail. L’outil liste chaque chemin d’énergie vers la zone et ce qui manque pour le sécuriser.', 'Dibuje la instalación como fuentes, acumuladores, dispositivos y zona de trabajo. La herramienta lista cada ruta de energía hacia la zona y lo que falta para asegurarla.', 'Narysuj instalację jako źródła, magazyny, urządzenia i strefę pracy. Narzędzie wymieni każdą drogę energii do strefy i to, czego brakuje do jej zabezpieczenia.')
  };

  function benchScheme(inp) {
    var notes = [], nodes = [], edges = [];

      var n = { i: o.id, t: o.id, x: (i % 8) * 140, y: Math.floor(i / 8) * 120 };
      switch (o.type) {
        case 'source': n.k = BX.src[o.energy]; break;
        case 'store':
          n.k = BX.store[o.kind];
          if (n.k === 'store.recv') n.e = BX.energy[o.energy];
          else if (n.k && BX.energy[o.energy] !== KINDS[n.k].e) notes.push(o.id + ': store energy ' + o.energy + ' differs from kind ' + o.kind);
          break;
        case 'isolating_device': {
          var dv = BX.dev[o.device];
          if (dv) { n.k = dv[0]; n.p = o.position === 'isolating' ? dv[1] : dv[2]; }
          n.l = o.locked ? 1 : 0; n.g = o.tagged ? 1 : 0;
          break;
        }
        case 'control_device': n.k = 'iso.control'; n.p = o.position === 'off' ? 'stop' : 'run'; break;
        case 'non_return_valve': n.k = 'iso.check'; break;
        case 'bleed_point': n.k = 'bleed'; n.p = o.position === 'open' ? 'open' : 'closed'; break;
        case 'equipment': n.k = 'equip'; break;
        case 'junction': n.k = 'junc'; break;
        case 'work_zone': n.k = 'wz'; break;
      }
      if (!n.k) notes.push(o.id + ': no counterpart for ' + o.type + (o.device || o.kind || o.energy ? ' ' + (o.device || o.kind || o.energy) : ''));
      if (o.role) { n.o = BX.role[o.role] || 'ap'; if (!BX.role[o.role]) notes.push(o.id + ': role "' + o.role + '" read as an assigned role'); }
      if (o.verification) { n.vm = BX.ver[o.verification] || ''; n.vd = 1; if (!n.vm) notes.push(o.id + ': no counterpart for verification ' + o.verification); }
      if (o.dissipation) { n.dm = BX.diss[o.dissipation] || ''; n.dd = 1; if (!n.dm) notes.push(o.id + ': no counterpart for dissipation ' + o.dissipation); }

    });
