ook–White, published for 10":"do równania Colebrooka–White’a, opublikowanym dla 10","unknown sweep case kind:":"nieznany rodzaj przypadku analizy parametrycznej:","unrecognised hydraulic-network state payload":"nierozpoznane dane stanu sieci hydraulicznej","v2 build: the steady-state solve recorded above is the v1 tool’s solver unchanged — same residual assembly, same central-difference Jacobian, same dense Gauss-Jordan with partial pivoting, same damped Newton line search. What this build adds is repeated solves (pump/system curve, N-1 screen, Monte-Carlo, load profile) on the shared compute runtime diagram-compute.classic.js.":"Wersja v2: obliczenie stanu ustalonego zapisane powyżej to niezmieniony solver narzędzia v1 — to samo składanie residuów, ta sama macierz Jacobiego z różnic centralnych, to samo gęste rozwiązanie Gaussa–Jordana z częściowym wyborem elementu głównego, to samo tłumione przeszukiwanie liniowe metody Newtona. Ta wersja dodaje wielokrotne obliczenia (charakterystyka pompy / instalacji, analiza N-1, Monte Carlo, profil obciążenia) we współdzielonym środowisku obliczeniowym diagram-compute.classic.js.","worst relative difference":"najgorsza względna różnica","· design":"· plan","— THE ACCURACY BOUND IS VOID FOR AT LEAST ONE TALLY":"— OSZACOWANIE DOKŁADNOŚCI NIE OBOWIĄZUJE DLA CO NAJMNIEJ JEDNEGO ZLICZENIA","↖ Select":"↖ Zaznaczanie","━ Elevation":"━ Rzędna","━ Pipe":"━ Rura","▶ Pump":"▶ Pompa","◇ Valve":"◇ Zawór","● Node":"● Węzeł","Steady solve:":"Obliczenie stanu ustalonego:","backend:":"wykonanie:","idle":"bezczynne","repeatable":"powtarzalny","solved":"obliczono","free":"swobodny","pipe":"rura","pump":"pompa","valve":"zawór","hx":"wymiennik","━ System":"━ Instalacja","━ HGL":"━ Linia ciśnień","Hydraulic Network Solver (v2)":"Obliczanie sieci hydraulicznych (v2)","Pump and motor efficiency are not modelled, so this is not shaft or electrical energy.":"Sprawność pompy i silnika nie jest modelowana, więc nie jest to energia na wale ani energia elektryczna.","HGL m":"Linia ciśnień m","HGL":"Linia ciśnień","p P5 kPa(g)":"p P5 kPa (nadc.)"};
const siteLang=()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q&&String(q).slice(0,2).toLowerCase()==='pl')return'pl'}catch(e){}try{if(localStorage.getItem('diagram_site_lang')==='pl'||localStorage.getItem('diagram_lang')==='pl')return'pl'}catch(e){}return String(window.__diagramLang||'').slice(0,2).toLowerCase()};
if(siteLang()!=='pl')return;
document.documentElement.lang='pl';
const attrs=['placeholder','title','aria-label','alt'];
function tr(s){if(s==null)return s;const x=String(s);if(Object.prototype.hasOwnProperty.call(PL,x))return PL[x];const a=x.match(/^\s*/)[0],b=x.match(/\s*$/)[0],t=x.trim();if(Object.prototype.hasOwnProperty.call(PL,t))return a+PL[t]+b;const pz=t&&window.__hnPatterns?window.__hnPatterns.translate('pl',t,PL):null;if(pz!=null)return a+pz+b;const lw=window.DiagramUI&&DiagramUI.current&&typeof DiagramUI.current.t==='function'?DiagramUI.current.t('learn'):null;if(lw&&t.indexOf(lw+': ')===0){const k=t.slice(lw.length+2);if(Object.prototype.hasOwnProperty.call(PL,k))return a+lw+': '+PL[k]+b}return x}
function node(n){if(!n)return;if(n.nodeType===3){const p=n.parentElement;if(p&&!/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(p.tagName)){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}return}if(n.nodeType!==1)return;if(/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(n.tagName))return;for(const a of attrs)if(n.hasAttribute(a)){const v=n.getAttribute(a),w=tr(v);if(w!==v)n.setAttribute(a,w)}if(n.tagName==='INPUT'&&/^(button|submit|reset)$/i.test(n.type||'')){const v=n.value,w=tr(v);if(w!==v)n.value=w}const tw=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let q;while(q=tw.nextNode())node(q);for(const e of n.querySelectorAll('*'))for(const a of attrs)if(e.hasAttribute(a)){const v=e.getAttribute(a),w=tr(v);if(w!==v)e.setAttribute(a,w)}}
const run=()=>{node(document.body);const tt=document.querySelector('title');if(tt)node(tt)};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')node(m.target);else if(m.type==='attributes'){const el=m.target,v=el.getAttribute(m.attributeName),w=tr(v);if(v!=null&&w!==v)el.setAttribute(m.attributeName,w)}else for(const n of m.addedNodes)node(n)}}).observe(document.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:attrs});
})();

ssic.js nodig: zijn \"","Type":"Type","Velocity limit":"Snelheidsgrens","What this tool does":"Wat dit gereedschap doet","a Worker case was checked against the same case solved on the main thread before any sweep was offered":"een Worker-geval werd getoetst aan hetzelfde geval opgelost op de hoofdthread, voordat er enige sweep werd aangeboden","and 5·10":"en 5·10","arithmetic, and that rule is what governs on a platform whose libm rounds differently.":"berekening, en die regel is wat bepalend is op een platform waarvan de libm anders afrondt.","at opening limit:":"bij openingsgrens:","cancelled by the user":"geannuleerd door de gebruiker","cancelling…":"annuleren…","central-difference Jacobian, the damped line search and the linear solve are all the":"centrale-verschil-Jacobiaan, de gedempte lijnzoekactie en de lineaire oplossing zijn allemaal de","delete,backspace":"delete,backspace","diagram-compute.classic.js is absent, so the sweep ran as one blocking main-thread loop, exactly as v1 did":"diagram-compute.classic.js ontbreekt, dus liep de sweep als één blokkerende lus op de hoofdthread, net zoals v1 deed","explicit approximation":"expliciete benadering","gate then bounds the result at roughly 1e-7 relative.":"drempel begrenst het resultaat dan tot ongeveer 1e-7 relatief.","halts at a scaled residual of 2e-9, worth about 1e-7 relative) rather than by the":"stopt bij een geschaald residu van 2e-9, ongeveer 1e-7 relatief) in plaats van door de","laminar friction":"laminaire wrijving","main thread":"hoofdthread","no Worker pool could be created (":"kon geen Worker-pool aanmaken (","no result":"geen resultaat","no runtime; one blocking main-thread loop":"geen runtime; één blokkerende lus op de hoofdthread","no sweep has run yet; the interactive solve is always on the main thread":"er is nog geen sweep uitgevoerd; de interactieve berekening staat altijd op de hoofdthread","no sweep run":"geen sweep uitgevoerd","nodes,":"knopen,","none (diagram-compute.classic.js absent)":"geen (diagram-compute.classic.js ontbreekt)","none: every recorded output reproduces bit for bit on this platform. What could":"geen: elke opgetekende uitvoer reproduceert bit voor bit op dit platform. Wat zou","nothing is imported and nothing is substituted. The residual assembly, the":"er wordt niets geïmporteerd en niets vervangen. De residu-opbouw, de","operating point":"werkpunt","path taken here is the path the page took.":"hier gevolgde pad is het pad dat de pagina volgde.","preliminary assessment":"voorlopige beoordeling","still separate the two is a C library whose exp/log/pow round differently in the last":"de twee nog scheiden, is een C-bibliotheek waarvan exp/log/pow in de laatste","technical exploration":"technische verkenning","the Worker case failed:":"het Worker-geval mislukte:","the Worker path did not reproduce the main-thread solve (":"het Worker-traject reproduceerde de oplossing van de hoofdthread niet (","the Worker path failed during this sweep (":"het Worker-traject mislukte tijdens deze sweep (","the network on the canvas is not solvable, so no comparison was possible":"het net op het canvas is niet oplosbaar, dus was geen vergelijking mogelijk","the shared runtime failed to start (":"de gedeelde runtime kon niet starten (","the shared runtime is loaded; sweeps run on the main thread":"de gedeelde runtime is geladen; sweeps lopen op de hoofdthread","this browser exposes no Worker; sweeps run on the main thread":"deze browser biedt geen Worker aan; sweeps lopen op de hoofdthread","to Colebrook–White, published for 10":"t.o.v. Colebrook–White, gepubliceerd voor 10","unknown sweep case kind:":"onbekend type sweepgeval:","worst relative difference":"slechtste relatieve verschil","· design":"· ontwerp","— THE ACCURACY BOUND IS VOID FOR AT LEAST ONE TALLY":"— DE NAUWKEURIGHEIDSGRENS IS ONGELDIG VOOR MINSTENS ÉÉN TELLING","; over that box it differs from the Colebrook root by up to about 3% in f, and by more outside it. The 2000<Re<4000 blend is a numerical bridge, not a resolved transition model. Pipes running outside the published box are listed as a warning after each solve.":"; binnen dat bereik wijkt het tot ongeveer 3% af van de Colebrook-wortel in f, en daarbuiten meer. De menging 2000<Re<4000 is een numerieke brug, geen opgeloste overgangsmodel. Leidingen die buiten het gepubliceerde bereik lopen, worden na elke berekening als waarschuwing vermeld.","A coil":"Een batterij","A fixed-pressure node fixes gauge pressure; its elevation is still part of total head. A demand node removes flow from the network. Negative demand injects flow. Closed circulating systems need one arbitrary pressure reference node.":"Een vast-druk-knoop legt de manometrische druk vast; de hoogteligging blijft deel van de totale opvoerhoogte. Een vraagknoop onttrekt debiet aan het net. Negatieve vraag injecteert debiet. Gesloten circulatiesystemen hebben één willekeurige drukreferentieknoop nodig.","A fixed-pressure node prescribes gauge pressure instead of solving it; its elevation still counts towards total head, and the solver reports the boundary exchange needed to hold that pressure. Every connected component of the drawing needs at least one, and a closed circulating loop needs one arbitrary reference node — without it the pressure level is undetermined and the Jacobian is singular.":"Een vast-druk-knoop schrijft de manometrische druk voor in plaats van deze op te lossen; de hoogteligging telt nog steeds mee in de totale opvoerhoogte, en de solver rapporteert de randuitwisseling die nodig is om die druk te handhaven. Elk verbonden onderdeel van de tekening heeft er minstens één nodig, en een gesloten circulatielus heeft één willekeurige referentieknoop nodig — zonder deze is het drukniveau onbepaald en is de Jacobiaan singulier.","A hydraulic resistance only: Δp = Δp_design (Q/Q_design)^n, with n typically 2 for a fully turbulent coil. No thermal model, no capacity, no fouling.":"Uitsluitend een hydraulische weerstand: Δp = Δp_design (Q/Q_design)^n, met n doorgaans 2 voor een volledig turbulente batterij. Geen thermisch model, geen capaciteit, geen vervuiling.","A node is a junction with an elevation. Its demand is the flow taken out of the network there, in m³/h, positive out and negative in; demand is scaled by the global partial-load factor. A node that is not fixed has its pressure solved.":"Een knoop is een verbindingspunt met een hoogteligging. De vraag ervan is het debiet dat daar aan het net onttrokken wordt, in m³/u, positief naar buiten en negatief naar binnen; de vraag wordt geschaald met de globale deellastfactor. Een knoop die niet vast is, krijgt zijn druk opgelost.","A quadratic H(Q) through the shutoff head and one rated point, H = H0 s² − a q|q|, with the speed s the local speed times the global pump-speed factor, by the affinity law. Rated head must be below shutoff head. Reverse flow and operation past zero-head runout are extrapolations of that parabola and are warned, not modelled.":"Een kwadratische H(Q) door de nulopvoerhoogte en één nominaal punt, H = H0 s² − a q|q|, waarbij de snelheid s de lokale snelheid maal de globale pompsnelheidsfactor is, volgens de gelijkvormigheidswet. De nominale opvoerhoogte moet lager zijn dan de nulopvoerhoogte. Omgekeerde stroom en werking voorbij het nulopvoerhoogtepunt zijn extrapolaties van die parabool en worden gewaarschuwd, niet gemodelleerd.","A sweep solves the same network many times. The N-1 screen closes each pipe and valve in turn and reports the lowest pressure and the highest velocity that follow. The Monte-Carlo samples pipe roughness (lognormal) and nodal demand (normal) on a Latin hypercube with rank correlation and reports P5/P50/P95 quantiles. The load profile runs 24 h or 8760 h of demand multipliers and integrates hydraulic pump energy. Sweeps go to same-origin Workers only when that is measurably cheaper than the round trip; the steady solve itself always stays on the main thread.":"Een sweep berekent hetzelfde net vele malen. De N-1-screening sluit om beurten elke leiding en klep en rapporteert de laagste druk en de hoogste snelheid die daaruit volgen. De Monte-Carlo-methode bemonstert leidingruwheid (lognormaal) en knoopvraag (normaal) op een Latin-hypercube met rangcorrelatie en rapporteert P5/P50/P95-kwantielen. Het belastingsprofiel doorloopt 24 u of 8760 u aan vraagmultiplicatoren en integreert hydraulische pompenergie. Sweeps gaan alleen naar Workers van dezelfde oorsprong wanneer dat meetbaar goedkoper is dan de heen-en-terugreis; de stationaire berekening zelf blijft altijd op de hoofdthread.","Affinity law H ~ n^2 for the two-point quadratic pump curve.":"Gelijkvormigheidswet H ~ n^2 voor de kwadratische tweepuntspompcurve.","All edge flows and all free-node heads are solved simultaneously by a damped Newton method on the scaled residuals, with a central-difference numerical Jacobian and a dense Gauss–Jordan solve with partial pivoting. It stops at a scaled residual of 2e-9 or at 60 iterations, and says which. The two residuals reported beside the iteration count are the physical ones: the largest nodal continuity error in m³/h and the largest edge energy error in metres.":"Alle randdebieten en alle vrije-knoophoogtes worden gelijktijdig opgelost met een gedempte Newton-methode op de geschaalde residuen, met een numerieke Jacobiaan via centrale differenties en een dichte Gauss–Jordan-oplossing met partiële spilkeuze. Er wordt gestopt bij een geschaald residu van 2e-9 of bij 60 iteraties, en er wordt aangegeven welke. De twee residuen die naast het iteratieaantal gerapporteerd worden, zijn de fysieke: de grootste knoopcontinuïteitsfout in m³/u en de grootste randenergiefout in meter.","An iterative heuristic that closes the valves carrying more than their target flow until each is within about 2 % of it, at the current partial load. Rated Kv values are never modified — only the opening. Coupled or infeasible targets are reported rather than forced.":"Een iteratieve heuristiek die de kleppen die meer dan hun streefdebiet voeren, sluit tot elk binnen ongeveer 2% daarvan zit, bij de huidige deellast. Nominale Kv-waarden worden nooit gewijzigd — alleen de opening. Gekoppelde of onhaalbare doelen worden gerapporteerd in plaats van geforceerd.","Analysis controls":"Analysebedieningen","At least one fixed-pressure node is required in every connected component.":"Minstens één vast-druk-knoop is vereist in elk verbonden onderdeel.","Auto-balance":"Autobalancering","Auto-balance valves":"Kleppen autobalanceren","B control valve":"Regelklep B","B supply":"Aanvoer B","Balance target @100% load":"Balanceerdoel @100% belasting","Branch A":"Tak A","Branch B":"Tak B","A supply":"Aanvoer A","Click start node, then end node to add a heat exchanger.":"Klik op de startknoop, daarna op de eindknoop om een warmtewisselaar toe te voegen.","C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156 — used only to quantify the Swamee-Jain scatter.":"C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156 — alleen gebruikt om de Swamee-Jain-spreiding te kwantificeren.","Click start node, then end node to add a pipe.":"Klik op de startknoop, daarna op de eindknoop om een leiding toe te voegen.","Click start node, then end node to add a valve.":"Klik op de startknoop, daarna op de eindknoop om een klep toe te voegen.","Click suction node, then discharge node to add a pump.":"Klik op de zuigknoop, daarna op de persknoop om een pomp toe te voegen.","Could not sweep the system curve over a usable range.":"Kon de systeemcurve niet doorlopen over een bruikbaar bereik.","Darcy–Weisbach with the Swamee–Jain explicit friction factor above Re = 4000, 64/Re below Re = 2000 and a smoothstep blend between them. Diameter and roughness are entered in millimetres, length in metres. ΣK collects the bends, tees and fittings on the run; junction and fitting losses have to be entered here because the solver has no geometry to infer them from.":"Darcy–Weisbach met de expliciete Swamee–Jain-wrijvingsfactor boven Re = 4000, 64/Re onder Re = 2000 en een vloeiende menging daartussen. Diameter en ruwheid worden in millimeter ingevoerd, lengte in meter. ΣK verzamelt de bochten, T-stukken en fittingen op het traject; verbindings- en fittingverliezen moeten hier ingevoerd worden omdat de solver geen geometrie heeft om ze uit af te leiden.","Darcy–Weisbach; Swamee–Jain turbulent friction, 64/Re laminar, smooth interpolation through transition; minor-loss K included. Swamee–Jain is an":"Darcy–Weisbach; Swamee–Jain turbulente wrijving, 64/Re laminair, vloeiende interpolatie door de overgang; kleine-verlies-K inbegrepen. Swamee–Jain is een","Delete the selected element":"Verwijder het geselecteerde element","Demand (+ out)":"Vraag (+ uit)","Demand is scaled by the global partial-load factor. Negative demand is injection. A fixed-pressure node reports the boundary exchange required to maintain its pressure.":"Vraag wordt geschaald met de globale deellastfactor. Negatieve vraag is injectie. Een vast-druk-knoop rapporteert de randuitwisseling die nodig is om zijn druk te handhaven.","Demand rank corr.":"Vraagrangcorrelatie","Demand sd (normal)":"Vraag sd (normaal)","Demand ×":"Vraag ×","Density and kinematic viscosity are constants for the whole network. The partial-load factor scales every nodal demand, so a network whose demands are all zero is insensitive to it. The global pump-speed factor scales every pump on top of its own local speed.":"Dichtheid en kinematische viscositeit zijn constanten voor het hele net. De deellastfactor schaalt elke knoopvraag, dus een net waarvan alle vragen nul zijn, is er ongevoelig voor. De globale pompsnelheidsfactor schaalt elke pomp bovenop zijn eigen lokale snelheid.","District-heating loop":"Stadsverwarmingslus","Draw and solve arbitrary hydraulic networks with pipes, pumps, valves and heat exchangers. Steady-state flows, pressures, pump/system curves, hydraulic grade line, balancing and partial-load analysis.":"Teken en bereken willekeurige hydraulische netten met leidingen, pompen, kleppen en warmtewisselaars. Stationaire debieten, drukken, pomp-/systeemcurves, hydraulische gradiëntlijn, balancering en deellastanalyse.","Draw or load a network, then press Solve network.":"Teken of laad een net, druk dan op Net oplossen.","Drawing the network":"Het net tekenen","Each edge ID must start with a letter and contain only letters, digits, _ . : - (max 64 characters).":"Elke rand-ID moet met een letter beginnen en mag alleen letters, cijfers, _ . : - bevatten (max. 64 tekens).","Each node ID must start with a letter and contain only letters, digits, _ . : - (max 64 characters).":"Elke knoop-ID moet met een letter beginnen en mag alleen letters, cijfers, _ . : - bevatten (max. 64 tekens).","Edge energy:  h_a + z_a - h_b - z_b + H_pump(q) - h_loss(q) = 0":"Randenergie: h_a + z_a - h_b - z_b + H_pump(q) - h_loss(q) = 0","Ensemble sweeps":"Ensemble-sweeps","Every network needs at least one fixed-pressure node per connected component; a closed circuit needs one arbitrary reference.":"Elk net heeft minstens één vast-druk-knoop per verbonden onderdeel nodig; een gesloten circuit heeft één willekeurige referentie nodig.","Every node in this network has zero demand, and the profile multiplier scales nodal demands only — so every hour below is the same operating point. Give at least one node a demand to make the profile mean anything.":"Elke knoop in dit net heeft nulvraag, en de profielmultiplicator schaalt alleen knoopvragen — dus elk uur hieronder is hetzelfde werkpunt. Geef minstens één knoop een vraag om het profiel betekenis te geven.","Fixed gauge pressure boundary":"Vaste manometrische-drukrand","Flow [m³/h]":"Debiet [m³/u]","Flow-following loop coordinate":"Debiet-volgende luscoördinaat","Fluid and load":"Vloeistof en belasting","Fluid density":"Vloeistofdichtheid","Fluid density must be a positive finite number.":"Vloeistofdichtheid moet een positief eindig getal zijn.","For every free node the solver enforces continuity. For every edge it enforces the steady Bernoulli equation using pressure head + elevation, pump head and signed component loss. Unknown edge flows and free-node pressure heads are solved simultaneously with a damped Newton method.":"Voor elke vrije knoop dwingt de solver continuïteit af. Voor elke rand dwingt hij de stationaire Bernoulli-vergelijking af met drukhoogte + hoogteligging, pompopvoerhoogte en getekend componentverlies. Onbekende randdebieten en vrije-knoopdrukhoogtes worden gelijktijdig opgelost met een gedempte Newton-methode.","Friction: f = 64/Re for Re <= 2000; Swamee-Jain f = 0.25 / [log10(eps/(3.7 D) + 5.74/Re^0.9)]^2 for Re >= 4000; smoothstep blend between":"Wrijving: f = 64/Re voor Re <= 2000; Swamee-Jain f = 0.25 / [log10(eps/(3.7 D) + 5.74/Re^0.9)]^2 voor Re >= 4000; vloeiende menging daartussen","Gauge pressure":"Manometrische druk","Global pump-speed factor":"Globale pompsnelheidsfactor","Global pump-speed factor must be between 40 and 120%.":"Globale pompsnelheidsfactor moet tussen 40 en 120% liggen.","H. Cross, Analysis of Flow in Networks of Conduits or Conductors, Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936) — loop-correction method.":"H. Cross, Analysis of Flow in Networks of Conduits or Conductors, Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936) — luscorrectiemethode.","HGL excludes velocity head. Junction and fitting losses must be entered through K.":"HGL sluit snelheidshoogte uit. Verbindings- en fittingverliezen moeten via K ingevoerd worden.","HX design point":"WW-ontwerppunt","Hagen-Poiseuille laminar closed form f = 64/Re — derived, used to grade the laminar branch.":"Laminaire gesloten vorm van Hagen-Poiseuille f = 64/Re — afgeleid, gebruikt om de laminaire tak te beoordelen.","Head / elevation [m]":"Hoogte / hoogteligging [m]","Head [m]":"Hoogte [m]","Head at rated flow":"Opvoerhoogte bij nominaal debiet","Heat exchanger":"Warmtewisselaar","Heat exchanger:":"Warmtewisselaar:","Heat exchanger:  h_loss = (dp_design / (rho g)) (q / q_design)^n":"Warmtewisselaar: h_loss = (dp_design / (rho g)) (q / q_design)^n","Heat exchangers":"Warmtewisselaars","Heat-exchanger exponent n between 1 and 3":"Warmtewisselaarexponent n tussen 1 en 3","Hourly demand multipliers (24 values, comma separated)":"Uurlijkse vraagmultiplicatoren (24 waarden, komma-gescheiden)","How it is solved, and how well":"Hoe het opgelost wordt, en hoe goed","Hrated":"Hrated","Hydraulic grade line":"Hydraulische gradiëntlijn","Hydraulic grade line of the selected pump loop.":"Hydraulische gradiëntlijn van de geselecteerde pomplus.","Hydraulic internal checks failed":"Interne hydraulische controles mislukt","Hydraulic network drawing canvas":"Tekencanvas hydraulisch net","Hydraulic pump energy ρgQH integrated over the period:":"Hydraulische pompenergie ρgQH geïntegreerd over de periode:","IEC 60534-2-1 / metric Kv definition: Q[m3/h] = Kv sqrt(dp[bar]/SG).":"IEC 60534-2-1 / metrische Kv-definitie: Q[m3/u] = Kv sqrt(dp[bar]/SG).","Imported global pump-speed factor must be between 40 and 120%.":"Geïmporteerde globale pompsnelheidsfactor moet tussen 40 en 120% liggen.","Imported partial-load factor must be between 0 and 150%.":"Geïmporteerde deellastfactor moet tussen 0 en 150% liggen.","Initial residual is not finite. Check component data.":"Initieel residu is niet eindig. Controleer componentgegevens.","Inside diameter":"Binnendiameter","It draws a hydraulic network — nodes joined by pipes, pumps, valves and heat exchangers — and solves the steady flows and pressures in it. Load the example, or place nodes and join them, give at least one node a fixed pressure, then press Solve network. Nothing is computed until you do: this is a run tool, and the result is marked stale the moment you change anything.":"Het tekent een hydraulisch net — knopen verbonden door leidingen, pompen, kleppen en warmtewisselaars — en berekent de stationaire debieten en drukken erin. Laad het voorbeeld, of plaats knopen en verbind ze, geef minstens één knoop een vaste druk, druk dan op Net oplossen. Er wordt niets berekend totdat u dat doet: dit is een runtool, en het resultaat wordt als verouderd gemarkeerd zodra u iets wijzigt.","Kinematic viscosity must be a positive finite number.":"Kinematische viscositeit moet een positief eindig getal zijn.","Kv at 100%":"Kv bij 100%","Kv design relation":"Kv-ontwerprelatie","Linear Kv":"Lineaire Kv","Load profile":"Belastingsprofiel","Load profile: every node in this network has zero demand and the profile multiplier scales nodal demands only, so every hour is the same operating point and the energy figure is one point multiplied by the number of hours.":"Belastingsprofiel: elke knoop in dit net heeft nulvraag en de profielmultiplicator schaalt alleen knoopvragen, dus elk uur is hetzelfde werkpunt en het energiecijfer is één punt vermenigvuldigd met het aantal uren.","Loads three same-origin scripts beside the page — site-disclaimer.js, diagram-common.js and diagram-compute.classic.js (the classic build of the shared compute runtime). Nothing else is fetched, no third-party host is contacted, and nothing about the network the user draws is transmitted anywhere: every sweep runs in this browser, on the main thread or in same-origin Blob Workers created from diagram-compute.classic.js.":"Laadt drie scripts van dezelfde oorsprong naast de pagina — site-disclaimer.js, diagram-common.js en diagram-compute.classic.js (de klassieke build van de gedeelde reken-runtime). Er wordt verder niets opgehaald, geen enkele derde host wordt gecontacteerd, en niets over het net dat de gebruiker tekent wordt ergens naartoe verzonden: elke sweep draait in deze browser, op de hoofdthread of in Blob Workers van dezelfde oorsprong die uit diagram-compute.classic.js aangemaakt zijn.","Loss [m]":"Verlies [m]","Lowest p kPa(g)":"Laagste p kPa(m)","Main return":"Hoofdretour","Main supply":"Hoofdaanvoer","Max continuity residual":"Max. continuïteitsresidu","Max energy residual":"Max. energieresidu","Monte-Carlo samples":"Monte-Carlo-samples","Monte-Carlo seed":"Monte-Carlo-seed","N-1 screen":"N-1-screening","Network drawing:":"Nettekening:","Network files":"Netbestanden","Network loaded":"Net geladen","No HGL generated.":"Geen HGL gegenereerd.","No continuous flow-following return path; showing a topological fallback path.":"Geen doorlopend debiet-volgend retourpad; een topologisch terugvalpad wordt getoond.","No return path from pump discharge to suction. HGL needs a loop/path excluding the pump.":"Geen retourpad van pompuitgang naar pompingang. HGL heeft een lus/pad nodig zonder de pomp.","Nodes":"Knopen","Nothing to sample. Give the roughness a sigma above 0 (the network needs pipes), or the demands an sd above 0 on a network that has non-zero demands.":"Nema wat te bemonsteren. Geef de ruwheid een sigma boven 0 (het net heeft leidingen nodig), of de vragen een sd boven 0 op een net met niet-nul vragen.","Open a hydraulic-network JSON file":"Open een JSON-bestand van een hydraulisch net","Open network JSON…":"Netwerk-JSON openen…","Outcome":"Uitkomst","Over limit":"Boven limiet","P.K. Swamee & A.K. Jain, Explicit equations for pipe-flow problems, ASCE J. Hydraulics Div. 102(5) (1976) 657-664 — f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, stated for 1e-6 <= eps/D <= 1e-2 and 5e3 <= Re <= 1e8.":"P.K. Swamee & A.K. Jain, Explicit equations for pipe-flow problems, ASCE J. Hydraulics Div. 102(5) (1976) 657-664 — f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, opgegeven voor 1e-6 <= eps/D <= 1e-2 en 5e3 <= Re <= 1e8.","Partial load 0 to 150 %, global pump speed 40 to 120 %":"Deellast 0 tot 150%, globale pompsnelheid 40 tot 120%","Partial-load factor must be between 0 and 150%.":"Deellastfactor moet tussen 0 en 150% liggen.","Pipe":"Leiding","Pipe:":"Leiding:","Pipe:  h_loss = (f L/D + K) v^2 / (2 g),  v = q/A,  Re = v D / nu":"Leiding: h_loss = (f L/D + K) v^2 / (2 g), v = q/A, Re = v D / nu","Pipes":"Leidingen","Plant return":"Retour installatie","Pointer":"Aanwijzer","Positive edge flow follows its arrow.":"Positieve randdebiet volgt zijn pijl.","Pressure kPa(g)":"Druk kPa(m)","Properties":"Eigenschappen","Pump":"Pomp","Pump / system curve":"Pomp-/systeemcurve","Pump / system curve — select a pump, then press Pump / system curve.":"Pomp-/systeemcurve — selecteer een pomp, druk dan op Pomp-/systeemcurve.","Pump H m":"Pomp opvoerhoogte m","Pump [m]":"Pomp [m]","Pump and system curve":"Pomp- en systeemcurve","Pump discharge":"Pompuitgang","Pump kW (hydraulic)":"Pomp kW (hydraulisch)","Pump rated head must be below shutoff head; reverse flow and beyond-runout operation are extrapolations and are warned":"Nominale pompopvoerhoogte moet lager zijn dan de nulopvoerhoogte; omgekeerde stroom en werking voorbij het nulpunt zijn extrapolaties en worden gewaarschuwd","Pump, two branches, coil and control valve — the shipped example":"Pomp, twee takken, batterij en regelklep — het meegeleverde voorbeeld","Pump/system curve":"Pomp-/systeemcurve","Pump:":"Pomp:","Pump:  H = H0 s^2 - a q|q|,  a = (H0 - H_rated)/q_rated^2,  s = local speed x global speed factor":"Pomp: H = H0 s^2 - a q|q|, a = (H0 - H_rated)/q_rated^2, s = lokale snelheid x globale snelheidsfactor","Pumps":"Pompen","Results":"Resultaten","Return header":"Retourheader","Roughness rank corr.":"Ruwheidsrangcorrelatie","Roughness σ (lognormal)":"Ruwheid σ (lognormaal)","Run an N-1 screen, a Monte-Carlo or a load profile. Each one solves the network many times; the pump / system curve above is now the same kind of sweep.":"Voer een N-1-screening, een Monte-Carlo of een belastingsprofiel uit. Elk daarvan berekent het net vele malen; de pomp-/systeemcurve hierboven is nu hetzelfde soort sweep.","Save network JSON":"Netwerk-JSON opslaan","Save network JSON writes the drawing, the components and the fluid as a versioned document; Open network JSON reads one back, validating every field before it touches the canvas. This is the network, not the calculation: the shared bar below carries the calculation record as JSON, CSV, a PDF report and a python script, and Copy link puts the whole network in a permalink.":"«Netwerk-JSON opslaan» schrijft de tekening, de componenten en de vloeistof als een geversioneerd document weg; «Netwerk-JSON openen» leest er een terug in, waarbij elk veld gevalideerd wordt voordat het canvas aangeraakt wordt. Dit is het net, niet de berekening: de gedeelde balk hieronder draagt de berekeningsrecord als JSON, CSV, een PDF-rapport en een python-script, en «Link kopiëren» plaatst het hele net in een permalink.","Select a node or a component on the drawing to edit it.":"Selecteer een knoop of component op de tekening om deze te bewerken.","Select a pump first":"Selecteer eerst een pomp","Select moves and selects. Node places a node on empty canvas. Pipe, Pump, Valve and Heat exchanger each need two clicks: the start node, then the end node. The arrow drawn on a component is its positive direction — a negative solved flow means the fluid runs the other way. Delete removes the selected element, and every edit can be undone from the header.":"«Selecteren» verplaatst en selecteert. «Knoop» plaatst een knoop op leeg canvas. Leiding, Pomp, Klep en Warmtewisselaar hebben elk twee klikken nodig: de startknoop, dan de eindknoop. De op een component getekende pijl is zijn positieve richting — een negatief opgelost debiet betekent dat de vloeistof de andere kant op stroomt. «Verwijderen» verwijdert het geselecteerde element, en elke bewerking kan ongedaan gemaakt worden vanuit de header.","Selected:":"Geselecteerd:","Set target flow on at least one valve":"Stel een streefdebiet in op minstens één klep","Shutoff head H₀":"Nulopvoerhoogte H₀","Solve failed":"Berekening mislukt","Solved in":"Opgelost in","Solved simultaneously for all edge flows and free-node heads by a damped Newton method with a numerical Jacobian":"Gelijktijdig opgelost voor alle randdebieten en vrije-knoophoogtes met een gedempte Newton-methode met een numerieke Jacobiaan","Solver diverged. Check component data.":"Solver divergeerde. Controleer componentgegevens.","Speed m/s":"Snelheid m/s","Static Δp a−b kPa":"Statische Δp a−b kPa","Steady state, incompressible, single phase; constant density and viscosity":"Stationair, onsamendrukbaar, eenfasig; constante dichtheid en viscositeit","Steady-state incompressible networks · ensemble sweeps on the shared compute runtime":"Stationaire onsamendrukbare netten · ensemble-sweeps op de gedeelde reken-runtime","Steady-state, incompressible and single-phase. Fluid properties are constant. Heat exchangers are hydraulic resistances only. Pump curves use shutoff head plus one rated point; reverse flow and operation beyond zero-head runout are extrapolations and are warned. Automatic balancing is an iterative valve-opening heuristic and cannot guarantee coupled or infeasible targets. In meshed networks the HGL plot shows one representative flow-following return path (or a labelled topological fallback), not every path; HGL excludes velocity head. Junction/fitting losses must be entered through K. The dense browser solver refuses models above 600 nonlinear unknowns. No water hammer, NPSH/cavitation, efficiency map or transient control model is included.":"Stationair, onsamendrukbaar en eenfasig. Vloeistofeigenschappen zijn constant. Warmtewisselaars zijn uitsluitend hydraulische weerstanden. Pompcurves gebruiken de nulopvoerhoogte plus één nominaal punt; omgekeerde stroom en werking voorbij het nulpunt zijn extrapolaties en worden gewaarschuwd. Automatische balancering is een iteratieve klepopeningsheuristiek en kan gekoppelde of onhaalbare doelen niet garanderen. In vermaasde netten toont de HGL-plot één representatief debiet-volgend retourpad (of een gelabeld topologisch terugvalpad), niet elk pad; HGL sluit snelheidshoogte uit. Verbindings-/fittingverliezen moeten via K ingevoerd worden. De dichte browsersolver weigert modellen boven 600 niet-lineaire onbekenden. Geen waterslag, NPSH/cavitatie, rendementskaart of transiënt regelmodel inbegrepen.","Supply header":"Aanvoerheader","Swamee-Jain is published for 1e-6 <= eps/D <= 1e-2 and 5e3 <= Re <= 1e8; it differs from the Colebrook root by up to about 3 % over that range":"Swamee-Jain is gepubliceerd voor 1e-6 <= eps/D <= 1e-2 en 5e3 <= Re <= 1e8; het wijkt over dat bereik tot ongeveer 3% af van de Colebrook-wortel","System curve requires positive solved flow through the selected pump.":"Systeemcurve vereist een positief opgelost debiet door de geselecteerde pomp.","The N-1 screen closes pipes and valves one at a time; this network has neither.":"De N-1-screening sluit leidingen en kleppen één voor één; dit net heeft geen van beide.","The ensemble sweep results also recorded here — pump/system curve, N-1 screen, Monte-Carlo quantiles, load-profile energy — are NOT reproduced: each is tens to thousands of further solves, and the Monte-Carlo additionally rests on the shared runtime’s Latin-hypercube design, its rank-correlation transform and its DDSketch quantile tallies, none of which this single file carries.":"De hier ook opgetekende ensemble-sweepresultaten — pomp-/systeemcurve, N-1-screening, Monte-Carlo-kwantielen, belastingsprofielenergie — worden NIET gereproduceerd: elk is tientallen tot duizenden bijkomende berekeningen, en de Monte-Carlo steunt bovendien op het Latin-hypercube-ontwerp, de rangcorrelatietransformatie en de DDSketch-kwantieltellingen van de gedeelde runtime, waarvan dit ene bestand niets meedraagt.","The head along one return path from the pump discharge back to its suction, drawn against the elevation profile. In a meshed network there are many such paths; the plot shows one flow-following path, or a labelled topological fallback when no continuous flow-following path exists. It excludes velocity head.":"De hoogte langs één retourpad van de pompuitgang terug naar zijn ingang, uitgezet tegen het hoogteligginsprofiel. In een vermaasd net zijn er vele zulke paden; de plot toont één debiet-volgend pad, of een gelabeld topologisch terugvalpad wanneer er geen doorlopend debiet-volgend pad bestaat. Snelheidshoogte is uitgesloten.","The hourly profile needs exactly 24 finite, non-negative multipliers.":"Het uurlijkse profiel heeft precies 24 eindige, niet-negatieve multiplicatoren nodig.","The load profile reports pump energy; this network has no pump.":"Het belastingsprofiel rapporteert pompenergie; dit net heeft geen pomp.","The metric Kv relation, dp[bar] = SG (q[m³/h] / Kv_eff)². Kv_eff is Kv × opening for a linear characteristic and Kv × 50^(opening−1) for equal percentage. The balance target is the flow the auto-balance heuristic tries to reach at 100 % load by closing the valve; rated Kv is never changed.":"De metrische Kv-relatie, dp[bar] = SG (q[m³/u] / Kv_eff)². Kv_eff is Kv × opening voor een lineaire karakteristiek en Kv × 50^(opening−1) voor rechtdoorprocentueel. Het balanceerdoel is het debiet dat de autobalanceerheuristiek probeert te bereiken bij 100% belasting door de klep te sluiten; nominale Kv wordt nooit gewijzigd.","The network changed while the sweep was running. Solve it again, then redraw the curve.":"Het net is gewijzigd terwijl de sweep liep. Los het opnieuw op, teken dan de curve opnieuw.","The shared interface layer (diagram-ui.js) did not load. Every input, the solver, the drawing, the sweeps and every export still work; the page falls back to one plain column.":"De gedeelde interfacelaag (diagram-ui.js) is niet geladen. Elke invoer, de solver, de tekening, de sweeps en elke export werken nog steeds; de pagina valt terug op één eenvoudige kolom.","Topological fallback path coordinate":"Topologische terugvalpadcoördinaat","Unsupported hydraulic-network schema version":"Niet-ondersteunde schemaversie van hydraulisch net","Valve":"Klep","Valve opening 0.1 % to 100 %":"Klepopening 0,1% tot 100%","Valve:":"Klep:","Valve:  dp[bar] = SG (q[m3/h] / Kv_eff)^2,  Kv_eff = Kv * o (linear) or Kv * 50^(o-1) (equal percentage), o = opening/100":"Klep: dp[bar] = SG (q[m3/u] / Kv_eff)^2, Kv_eff = Kv * o (lineair) of Kv * 50^(o-1) (rechtdoorprocentueel), o = opening/100","Valves":"Kleppen","With a pump selected, the network is re-solved 33 times with that pump forced to a series of flows. The system curve is the head the network demands at each flow; the pump curve is what the pump delivers; they cross at the operating point. Every point is solved cold, so the curve does not depend on the order the points were computed in.":"Met een geselecteerde pomp wordt het net 33 keer opnieuw opgelost, waarbij die pomp op een reeks debieten geforceerd wordt. De systeemcurve is de hoogte die het net vraagt bij elk debiet; de pompcurve is wat de pomp levert; ze kruisen bij het werkpunt. Elk punt wordt koud opgelost, dus de curve hangt niet af van de volgorde waarin de punten berekend werden.","at node":"bij knoop","diagram-compute.classic.js did not load; sweeps run on the main thread and the Monte-Carlo sweep is unavailable because its Latin-hypercube design and quantile tallies live in the runtime":"diagram-compute.classic.js is niet geladen; sweeps draaien op de hoofdthread en de Monte-Carlo-sweep is niet beschikbaar omdat het Latin-hypercube-ontwerp en de kwantieltellingen in de runtime leven","every case was evaluated in index order on one thread, with no shared warm start":"elk geval werd geëvalueerd in indexvolgorde op één thread, zonder gedeelde warme start","hL signed m":"hL getekend m","iterations; scaled residual":"iteraties; geschaald residu","kPa (gauge)":"kPa (manometrisch)","kW (hydraulic)":"kW (hydraulisch)","kWh (hydraulic, rho g Q H; no pump or motor efficiency)":"kWh (hydraulisch, rho g Q H; geen pomp- of motorrendement)","metric Kv relation, with optional opening law.":"metrische Kv-relatie, met optionele openingswet.","p [kPa g]":"p [kPa m]","pump affinity scaling":"gelijkvormigheidsschaling van de pomp","pump discharge":"pompuitgang","pump rated point":"nominaal pomppunt","pump suction":"pompingang","quadratic H(Q) from shutoff head and one rated point, scaled by affinity law speed².":"kwadratische H(Q) vanuit de nulopvoerhoogte en één nominaal punt, geschaald met de gelijkvormigheidswet snelheid².","select a pump":"selecteer een pomp","selected pump loop":"geselecteerde pomplus","signed reverse passive loss":"getekend omgekeerd passief verlies","the complete steady-state network solve of this page for the network currently on the canvas: the same continuity and energy equations, the same pipe/valve/heat-exchanger/pump component laws, and the same damped Newton iteration on scaled residuals. Charts, auto-balancing and the HGL path search are not part of the export.":"de volledige stationaire netberekening van deze pagina voor het net dat momenteel op het canvas staat: dezelfde continuïteits- en energievergelijkingen, dezelfde leiding-/klep-/warmtewisselaar-/pompcomponentwetten, en dezelfde gedempte Newton-iteratie op geschaalde residuen. Grafieken, autobalancering en de HGL-padzoekopdracht maken geen deel uit van de export.","unrecognised hydraulic-network state payload":"onherkende toestandsgegevens van hydraulisch net","v2 build: the steady-state solve recorded above is the v1 tool’s solver unchanged — same residual assembly, same central-difference Jacobian, same dense Gauss-Jordan with partial pivoting, same damped Newton line search. What this build adds is repeated solves (pump/system curve, N-1 screen, Monte-Carlo, load profile) on the shared compute runtime diagram-compute.classic.js.":"v2-build: de hierboven opgetekende stationaire berekening is de ongewijzigde solver van de v1-tool — dezelfde residu-assemblage, dezelfde Jacobiaan via centrale differenties, dezelfde dichte Gauss-Jordan met partiële spilkeuze, dezelfde gedempte Newton-lijnzoekactie. Wat deze build toevoegt, zijn herhaalde berekeningen (pomp-/systeemcurve, N-1-screening, Monte-Carlo, belastingsprofiel) op de gedeelde reken-runtime diagram-compute.classic.js.","↖ Select":"↖ Selecteren","━ Elevation":"━ Hoogteligging","━ Pipe":"━ Leiding","▶ Pump":"▶ Pomp","◇ Valve":"◇ Klep","● Node":"● Knoop","Hydraulic Network Solver":"Hydraulisch netwerkberekenaar","Draw an arbitrary network of pipes, nodes, pumps, valves and heat exchangers and solve the steady-state flows and pressures.":"Teken een willekeurig netwerk van leidingen, knopen, pompen, kleppen en warmtewisselaars en bereken stationaire debieten en drukken.","Draw an arbitrary network of pipes, nodes, pumps, valves and heat exchangers and solve the steady-state flows and pressures. Includes Darcy–Weisbach pipe losses, pump and system curves, hydraulic grade line, valve balancing, partial-load scaling, and JSON/CSV import-export.":"Teken een willekeurig netwerk van leidingen, knopen, pompen, kleppen en warmtewisselaars en bereken stationaire debieten en drukken. Met Darcy–Weisbach, pomp- en systeemcurve, hydraulische gradiëntlijn, klepbalancering, deellastschaling en JSON/CSV-import en -export.","Steady solve:":"Stationaire berekening:","backend:":"backend:","idle":"inactief","repeatable":"herhaalbaar","solved":"opgelost","free":"vrij","pipe":"leiding","pump":"pomp","valve":"klep","hx":"warmtewisselaar","━ System":"━ Systeem","━ HGL":"━ Gradiëntlijn","Hydraulic Network Solver (v2)":"Hydraulisch netwerkberekenaar (v2)","Pump and motor efficiency are not modelled, so this is not shaft or electrical energy.":"Pomp- en motorrendement worden niet gemodelleerd, dus dit is geen as- of elektrische energie.","HGL m":"HGL m","HGL":"HGL","p P5 kPa(g)":"p P5 kPa(m)"};
const siteLang=()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q&&String(q).slice(0,2).toLowerCase()==='nl')return'nl'}catch(e){}try{if(localStorage.getItem('diagram_site_lang')==='nl'||localStorage.getItem('diagram_lang')==='nl')return'nl'}catch(e){}return String(window.__diagramLang||'').slice(0,2).toLowerCase()};
if(siteLang()!=='nl')return;
document.documentElement.lang='nl';
const attrs=['placeholder','title','aria-label','alt'];
function tr(s){if(s==null)return s;const x=String(s);if(Object.prototype.hasOwnProperty.call(NL,x))return NL[x];const a=x.match(/^\s*/)[0],b=x.match(/\s*$/)[0],t=x.trim();if(Object.prototype.hasOwnProperty.call(NL,t))return a+NL[t]+b;const pz=t&&window.__hnPatterns?window.__hnPatterns.translate('nl',t,NL):null;if(pz!=null)return a+pz+b;const lw=window.DiagramUI&&DiagramUI.current&&typeof DiagramUI.current.t==='function'?DiagramUI.current.t('learn'):null;if(lw&&t.indexOf(lw+': ')===0){const k=t.slice(lw.length+2);if(Object.prototype.hasOwnProperty.call(NL,k))return a+lw+': '+NL[k]+b}return x}
function node(n){if(!n)return;if(n.nodeType===3){const p=n.parentElement;if(p&&!/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(p.tagName)){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}return}if(n.nodeType!==1)return;if(/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(n.tagName))return;for(const a of attrs)if(n.hasAttribute(a)){const v=n.getAttribute(a),w=tr(v);if(w!==v)n.setAttribute(a,w)}if(n.tagName==='INPUT'&&/^(button|submit|reset)$/i.test(n.type||'')){const v=n.value,w=tr(v);if(w!==v)n.value=w}const tw=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let q;while(q=tw.nextNode())node(q);for(const e of n.querySelectorAll('*'))for(const a of attrs)if(e.hasAttribute(a)){const v=e.getAttribute(a),w=tr(v);if(w!==v)e.setAttribute(a,w)}}
const run=()=>{node(document.body);const tt=document.querySelector('title');if(tt)node(tt)};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')node(m.target);else if(m.type==='attributes'){const el=m.target,v=el.getAttribute(m.attributeName),w=tr(v);if(v!=null&&w!==v)el.setAttribute(m.attributeName,w)}else for(const n of m.addedNodes)node(n)}}).observe(document.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:attrs});
})();
</script>

<script id="german-domain-overlay">
