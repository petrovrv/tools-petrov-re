main thread":"es wurde noch kein Sweep ausgeführt; die interaktive Berechnung läuft immer im Hauptthread","no sweep run":"kein Sweep ausgeführt","nodes,":"Knoten,","none (diagram-compute.classic.js absent)":"keine (diagram-compute.classic.js fehlt)","none: every recorded output reproduces bit for bit on this platform. What could":"keine: jede aufgezeichnete Ausgabe reproduziert bitgenau auf dieser Plattform. Was könnte","nothing is imported and nothing is substituted. The residual assembly, the":"nichts wird importiert und nichts ersetzt. Der Residuenaufbau, die","operating point":"Betriebspunkt","path taken here is the path the page took.":"hier eingeschlagene Pfad ist der Pfad, den die Seite genommen hat.","preliminary assessment":"vorläufige Einschätzung","still separate the two is a C library whose exp/log/pow round differently in the last":"die beiden noch trennt, ist eine C-Bibliothek, deren exp/log/pow in der letzten","technical exploration":"technische Erkundung","the Worker case failed:":"der Worker-Fall ist fehlgeschlagen:","the Worker path did not reproduce the main-thread solve (":"der Worker-Pfad reproduzierte die Hauptthread-Lösung nicht (","the Worker path failed during this sweep (":"der Worker-Pfad ist während dieses Sweeps fehlgeschlagen (","the network on the canvas is not solvable, so no comparison was possible":"das Netz auf der Zeichenfläche ist nicht lösbar, daher war kein Vergleich möglich","the shared runtime failed to start (":"die gemeinsame Laufzeitumgebung konnte nicht starten (","the shared runtime is loaded; sweeps run on the main thread":"die gemeinsame Laufzeitumgebung ist geladen; Sweeps laufen auf dem Hauptthread","this browser exposes no Worker; sweeps run on the main thread":"dieser Browser stellt keinen Worker bereit; Sweeps laufen auf dem Hauptthread","to Colebrook–White, published for 10":"zu Colebrook–White, veröffentlicht für 10","unknown sweep case kind:":"unbekannte Sweep-Fallart:","worst relative difference":"schlechtester relativer Unterschied","· design":"· Auslegung","— THE ACCURACY BOUND IS VOID FOR AT LEAST ONE TALLY":"— DIE GENAUIGKEITSSCHRANKE IST FÜR MINDESTENS EINE AUSWERTUNG UNGÜLTIG","; over that box it differs from the Colebrook root by up to about 3% in f, and by more outside it. The 2000<Re<4000 blend is a numerical bridge, not a resolved transition model. Pipes running outside the published box are listed as a warning after each solve.":"; innerhalb dieses Bereichs weicht es um bis zu etwa 3% in f von der Colebrook-Wurzel ab, außerhalb mehr. Die Überblendung 2000<Re<4000 ist eine numerische Brücke, kein aufgelöstes Übergangsmodell. Rohre außerhalb des veröffentlichten Bereichs werden nach jeder Berechnung als Warnung aufgeführt.","A coil":"Ein Register","A fixed-pressure node fixes gauge pressure; its elevation is still part of total head. A demand node removes flow from the network. Negative demand injects flow. Closed circulating systems need one arbitrary pressure reference node.":"Ein Knoten mit festem Druck legt den Manometerdruck fest; seine Höhenlage bleibt Teil der Gesamtförderhöhe. Ein Bedarfsknoten entnimmt dem Netz einen Volumenstrom. Negativer Bedarf speist einen Volumenstrom ein. Geschlossene Umwälzsysteme benötigen einen beliebigen Druckreferenzknoten.","A fixed-pressure node prescribes gauge pressure instead of solving it; its elevation still counts towards total head, and the solver reports the boundary exchange needed to hold that pressure. Every connected component of the drawing needs at least one, and a closed circulating loop needs one arbitrary reference node — without it the pressure level is undetermined and the Jacobian is singular.":"Ein Knoten mit festem Druck schreibt den Manometerdruck vor, statt ihn zu berechnen; seine Höhenlage zählt weiterhin zur Gesamtförderhöhe, und der Löser meldet den Randaustausch, der zum Halten dieses Drucks nötig ist. Jede verbundene Komponente der Zeichnung braucht mindestens einen, und ein geschlossener Umwälzkreis braucht einen beliebigen Referenzknoten — ohne ihn ist das Druckniveau unbestimmt und die Jacobi-Matrix singulär.","A hydraulic resistance only: Δp = Δp_design (Q/Q_design)^n, with n typically 2 for a fully turbulent coil. No thermal model, no capacity, no fouling.":"Nur ein hydraulischer Widerstand: Δp = Δp_design (Q/Q_design)^n, mit n typischerweise 2 für ein vollturbulentes Register. Kein thermisches Modell, keine Leistung, keine Verschmutzung.","A node is a junction with an elevation. Its demand is the flow taken out of the network there, in m³/h, positive out and negative in; demand is scaled by the global partial-load factor. A node that is not fixed has its pressure solved.":"Ein Knoten ist eine Verbindungsstelle mit einer Höhenlage. Sein Bedarf ist der dort dem Netz entnommene Volumenstrom, in m³/h, positiv nach außen und negativ nach innen; der Bedarf wird mit dem globalen Teillastfaktor skaliert. Bei einem nicht festen Knoten wird der Druck berechnet.","A quadratic H(Q) through the shutoff head and one rated point, H = H0 s² − a q|q|, with the speed s the local speed times the global pump-speed factor, by the affinity law. Rated head must be below shutoff head. Reverse flow and operation past zero-head runout are extrapolations of that parabola and are warned, not modelled.":"Eine quadratische H(Q) durch die Nullförderhöhe und einen Nennpunkt, H = H0 s² − a q|q|, wobei die Drehzahl s die lokale Drehzahl mal dem globalen Pumpendrehzahlfaktor ist, nach dem Affinitätsgesetz. Die Nennförderhöhe muss unter der Nullförderhöhe liegen. Rückwärtsströmung und Betrieb jenseits des Nullförderhöhenpunkts sind Extrapolationen dieser Parabel und werden gewarnt, nicht modelliert.","A sweep solves the same network many times. The N-1 screen closes each pipe and valve in turn and reports the lowest pressure and the highest velocity that follow. The Monte-Carlo samples pipe roughness (lognormal) and nodal demand (normal) on a Latin hypercube with rank correlation and reports P5/P50/P95 quantiles. The load profile runs 24 h or 8760 h of demand multipliers and integrates hydraulic pump energy. Sweeps go to same-origin Workers only when that is measurably cheaper than the round trip; the steady solve itself always stays on the main thread.":"Ein Sweep berechnet dasselbe Netz viele Male. Die N-1-Prüfung schließt nacheinander jedes Rohr und Ventil und meldet den niedrigsten Druck und die höchste Geschwindigkeit, die sich daraus ergeben. Die Monte-Carlo-Methode samplet Rohrrauheit (lognormal) und Knotenbedarf (normal) auf einem Latin Hypercube mit Rangkorrelation und meldet P5/P50/P95-Quantile. Das Lastprofil durchläuft 24 h oder 8760 h Bedarfsmultiplikatoren und integriert die hydraulische Pumpenenergie. Sweeps gehen nur dann an Workers gleichen Ursprungs, wenn das messbar günstiger ist als der Hin- und Rückweg; die stationäre Berechnung selbst bleibt immer im Hauptthread.","Affinity law H ~ n^2 for the two-point quadratic pump curve.":"Affinitätsgesetz H ~ n^2 für die quadratische Zweipunkt-Pumpenkennlinie.","All edge flows and all free-node heads are solved simultaneously by a damped Newton method on the scaled residuals, with a central-difference numerical Jacobian and a dense Gauss–Jordan solve with partial pivoting. It stops at a scaled residual of 2e-9 or at 60 iterations, and says which. The two residuals reported beside the iteration count are the physical ones: the largest nodal continuity error in m³/h and the largest edge energy error in metres.":"Alle Kantenvolumenströme und alle freien Knotenhöhen werden gleichzeitig mit einem gedämpften Newton-Verfahren auf den skalierten Residuen gelöst, mit einer numerischen Jacobi-Matrix durch zentrale Differenzen und einer dichten Gauß-Jordan-Lösung mit partieller Pivotisierung. Gestoppt wird bei einem skalierten Residuum von 2e-9 oder bei 60 Iterationen, mit Angabe, welches zutrifft. Die beiden neben der Iterationszahl gemeldeten Residuen sind die physikalischen: der größte Knoten-Kontinuitätsfehler in m³/h und der größte Kanten-Energiefehler in Metern.","An iterative heuristic that closes the valves carrying more than their target flow until each is within about 2 % of it, at the current partial load. Rated Kv values are never modified — only the opening. Coupled or infeasible targets are reported rather than forced.":"Eine iterative Heuristik, die die Ventile, die mehr als ihren Zielvolumenstrom führen, so weit schließt, bis jedes innerhalb von etwa 2% davon liegt, bei der aktuellen Teillast. Nennwerte für Kv werden nie geändert — nur die Öffnung. Gekoppelte oder unerreichbare Ziele werden gemeldet, statt erzwungen.","Analysis controls":"Analysesteuerung","At least one fixed-pressure node is required in every connected component.":"Mindestens ein Knoten mit festem Druck ist in jeder verbundenen Komponente erforderlich.","Auto-balance":"Autoabgleich","Auto-balance valves":"Ventile automatisch abgleichen","B control valve":"Regelventil B","B supply":"Vorlauf B","Balance target @100% load":"Abgleichziel @100% Last","Branch A":"Zweig A","Branch B":"Zweig B","A supply":"Vorlauf A","Click start node, then end node to add a heat exchanger.":"Klicken Sie auf den Startknoten, dann auf den Endknoten, um einen Wärmetauscher hinzuzufügen.","C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156 — used only to quantify the Swamee-Jain scatter.":"C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156 — nur zur Quantifizierung der Swamee-Jain-Streuung verwendet.","Click start node, then end node to add a pipe.":"Klicken Sie auf den Startknoten, dann auf den Endknoten, um ein Rohr hinzuzufügen.","Click start node, then end node to add a valve.":"Klicken Sie auf den Startknoten, dann auf den Endknoten, um ein Ventil hinzuzufügen.","Click suction node, then discharge node to add a pump.":"Klicken Sie auf den Saugknoten, dann auf den Druckknoten, um eine Pumpe hinzuzufügen.","Could not sweep the system curve over a usable range.":"Anlagenkennlinie konnte nicht über einen brauchbaren Bereich durchlaufen werden.","Darcy–Weisbach with the Swamee–Jain explicit friction factor above Re = 4000, 64/Re below Re = 2000 and a smoothstep blend between them. Diameter and roughness are entered in millimetres, length in metres. ΣK collects the bends, tees and fittings on the run; junction and fitting losses have to be entered here because the solver has no geometry to infer them from.":"Darcy–Weisbach mit dem expliziten Swamee–Jain-Reibungsfaktor oberhalb Re = 4000, 64/Re unterhalb Re = 2000 und einer sanften Überblendung dazwischen. Durchmesser und Rauheit werden in Millimetern eingegeben, Länge in Metern. ΣK erfasst die Bögen, T-Stücke und Formteile auf der Strecke; Verbindungs- und Formteilverluste müssen hier eingegeben werden, da der Löser keine Geometrie hat, aus der er sie ableiten könnte.","Darcy–Weisbach; Swamee–Jain turbulent friction, 64/Re laminar, smooth interpolation through transition; minor-loss K included. Swamee–Jain is an":"Darcy–Weisbach; Swamee–Jain turbulente Reibung, 64/Re laminar, glatte Interpolation durch den Übergang; Einzelverlust-K eingeschlossen. Swamee–Jain ist eine","Delete the selected element":"Ausgewähltes Element löschen","Demand (+ out)":"Bedarf (+ aus)","Demand is scaled by the global partial-load factor. Negative demand is injection. A fixed-pressure node reports the boundary exchange required to maintain its pressure.":"Bedarf wird mit dem globalen Teillastfaktor skaliert. Negativer Bedarf ist Einspeisung. Ein Knoten mit festem Druck meldet den Randaustausch, der zum Halten seines Drucks nötig ist.","Demand rank corr.":"Bedarf-Rangkorrelation","Demand sd (normal)":"Bedarf sd (normal)","Demand ×":"Bedarf ×","Density and kinematic viscosity are constants for the whole network. The partial-load factor scales every nodal demand, so a network whose demands are all zero is insensitive to it. The global pump-speed factor scales every pump on top of its own local speed.":"Dichte und kinematische Viskosität sind Konstanten für das gesamte Netz. Der Teillastfaktor skaliert jeden Knotenbedarf, sodass ein Netz, dessen Bedarfswerte alle null sind, davon unbeeinflusst bleibt. Der globale Pumpendrehzahlfaktor skaliert jede Pumpe zusätzlich zu ihrer eigenen lokalen Drehzahl.","District-heating loop":"Fernwärmekreis","Draw and solve arbitrary hydraulic networks with pipes, pumps, valves and heat exchangers. Steady-state flows, pressures, pump/system curves, hydraulic grade line, balancing and partial-load analysis.":"Beliebige hydraulische Netze mit Rohren, Pumpen, Ventilen und Wärmetauschern zeichnen und berechnen. Stationäre Volumenströme, Drücke, Pumpen-/Anlagenkennlinien, hydraulische Gradlinie, Abgleich und Teillastanalyse.","Draw or load a network, then press Solve network.":"Zeichnen oder laden Sie ein Netz, drücken Sie dann Netz berechnen.","Drawing the network":"Das Netz zeichnen","Each edge ID must start with a letter and contain only letters, digits, _ . : - (max 64 characters).":"Jede Kanten-ID muss mit einem Buchstaben beginnen und darf nur Buchstaben, Ziffern, _ . : - enthalten (max. 64 Zeichen).","Each node ID must start with a letter and contain only letters, digits, _ . : - (max 64 characters).":"Jede Knoten-ID muss mit einem Buchstaben beginnen und darf nur Buchstaben, Ziffern, _ . : - enthalten (max. 64 Zeichen).","Edge energy:  h_a + z_a - h_b - z_b + H_pump(q) - h_loss(q) = 0":"Kantenenergie: h_a + z_a - h_b - z_b + H_pump(q) - h_loss(q) = 0","Ensemble sweeps":"Ensemble-Sweeps","Every network needs at least one fixed-pressure node per connected component; a closed circuit needs one arbitrary reference.":"Jedes Netz benötigt mindestens einen Knoten mit festem Druck pro verbundener Komponente; ein geschlossener Kreis benötigt eine beliebige Referenz.","Every node in this network has zero demand, and the profile multiplier scales nodal demands only — so every hour below is the same operating point. Give at least one node a demand to make the profile mean anything.":"Jeder Knoten in diesem Netz hat Bedarf null, und der Profilmultiplikator skaliert nur Knotenbedarfe — daher ist jede Stunde unten derselbe Betriebspunkt. Geben Sie mindestens einem Knoten einen Bedarf, damit das Profil aussagekräftig wird.","Fixed gauge pressure boundary":"Feste Manometerdruck-Randbedingung","Flow [m³/h]":"Volumenstrom [m³/h]","Flow-following loop coordinate":"Volumenstromfolgende Schleifenkoordinate","Fluid and load":"Fluid und Last","Fluid density":"Fluiddichte","Fluid density must be a positive finite number.":"Fluiddichte muss eine positive endliche Zahl sein.","For every free node the solver enforces continuity. For every edge it enforces the steady Bernoulli equation using pressure head + elevation, pump head and signed component loss. Unknown edge flows and free-node pressure heads are solved simultaneously with a damped Newton method.":"Für jeden freien Knoten erzwingt der Löser Kontinuität. Für jede Kante erzwingt er die stationäre Bernoulli-Gleichung mit Druckhöhe + Höhenlage, Pumpenförderhöhe und vorzeichenbehaftetem Komponentenverlust. Unbekannte Kantenvolumenströme und freie Knotendruckhöhen werden gleichzeitig mit einem gedämpften Newton-Verfahren gelöst.","Friction: f = 64/Re for Re <= 2000; Swamee-Jain f = 0.25 / [log10(eps/(3.7 D) + 5.74/Re^0.9)]^2 for Re >= 4000; smoothstep blend between":"Reibung: f = 64/Re für Re <= 2000; Swamee-Jain f = 0.25 / [log10(eps/(3.7 D) + 5.74/Re^0.9)]^2 für Re >= 4000; sanfte Überblendung dazwischen","Gauge pressure":"Manometerdruck","Global pump-speed factor":"Globaler Pumpendrehzahlfaktor","Global pump-speed factor must be between 40 and 120%.":"Globaler Pumpendrehzahlfaktor muss zwischen 40 und 120% liegen.","H. Cross, Analysis of Flow in Networks of Conduits or Conductors, Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936) — loop-correction method.":"H. Cross, Analysis of Flow in Networks of Conduits or Conductors, Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936) — Schleifenkorrekturmethode.","HGL excludes velocity head. Junction and fitting losses must be entered through K.":"HGL schließt Geschwindigkeitshöhe aus. Verbindungs- und Formteilverluste müssen über K eingegeben werden.","HX design point":"WT-Auslegungspunkt","Hagen-Poiseuille laminar closed form f = 64/Re — derived, used to grade the laminar branch.":"Laminare geschlossene Form von Hagen-Poiseuille f = 64/Re — abgeleitet, zur Bewertung des laminaren Zweigs verwendet.","Head / elevation [m]":"Höhe / Höhenlage [m]","Head [m]":"Höhe [m]","Head at rated flow":"Förderhöhe beim Nennvolumenstrom","Heat exchanger":"Wärmetauscher","Heat exchanger:":"Wärmetauscher:","Heat exchanger:  h_loss = (dp_design / (rho g)) (q / q_design)^n":"Wärmetauscher: h_loss = (dp_design / (rho g)) (q / q_design)^n","Heat exchangers":"Wärmetauscher","Heat-exchanger exponent n between 1 and 3":"Wärmetauscherexponent n zwischen 1 und 3","Hourly demand multipliers (24 values, comma separated)":"Stündliche Bedarfsmultiplikatoren (24 Werte, kommagetrennt)","How it is solved, and how well":"Wie es berechnet wird, und wie gut","Hrated":"Hrated","Hydraulic grade line":"Hydraulische Gradlinie","Hydraulic grade line of the selected pump loop.":"Hydraulische Gradlinie des ausgewählten Pumpenkreises.","Hydraulic internal checks failed":"Interne hydraulische Prüfungen fehlgeschlagen","Hydraulic network drawing canvas":"Zeichenfläche hydraulisches Netz","Hydraulic pump energy ρgQH integrated over the period:":"Hydraulische Pumpenenergie ρgQH über den Zeitraum integriert:","IEC 60534-2-1 / metric Kv definition: Q[m3/h] = Kv sqrt(dp[bar]/SG).":"IEC 60534-2-1 / metrische Kv-Definition: Q[m3/h] = Kv sqrt(dp[bar]/SG).","Imported global pump-speed factor must be between 40 and 120%.":"Importierter globaler Pumpendrehzahlfaktor muss zwischen 40 und 120% liegen.","Imported partial-load factor must be between 0 and 150%.":"Importierter Teillastfaktor muss zwischen 0 und 150% liegen.","Initial residual is not finite. Check component data.":"Anfangsresiduum ist nicht endlich. Komponentendaten prüfen.","Inside diameter":"Innendurchmesser","It draws a hydraulic network — nodes joined by pipes, pumps, valves and heat exchangers — and solves the steady flows and pressures in it. Load the example, or place nodes and join them, give at least one node a fixed pressure, then press Solve network. Nothing is computed until you do: this is a run tool, and the result is marked stale the moment you change anything.":"Es zeichnet ein hydraulisches Netz — Knoten, die durch Rohre, Pumpen, Ventile und Wärmetauscher verbunden sind — und berechnet die stationären Volumenströme und Drücke darin. Laden Sie das Beispiel, oder platzieren Sie Knoten und verbinden Sie sie, geben Sie mindestens einem Knoten einen festen Druck, drücken Sie dann Netz berechnen. Nichts wird berechnet, bis Sie das tun: Dies ist ein Ausführungswerkzeug, und das Ergebnis wird als veraltet markiert, sobald Sie etwas ändern.","Kinematic viscosity must be a positive finite number.":"Kinematische Viskosität muss eine positive endliche Zahl sein.","Kv at 100%":"Kv bei 100%","Kv design relation":"Kv-Auslegungsbeziehung","Linear Kv":"Lineare Kv","Load profile":"Lastprofil","Load profile: every node in this network has zero demand and the profile multiplier scales nodal demands only, so every hour is the same operating point and the energy figure is one point multiplied by the number of hours.":"Lastprofil: jeder Knoten in diesem Netz hat Bedarf null, und der Profilmultiplikator skaliert nur Knotenbedarfe, sodass jede Stunde derselbe Betriebspunkt ist und der Energiewert ein Punkt multipliziert mit der Anzahl der Stunden ist.","Loads three same-origin scripts beside the page — site-disclaimer.js, diagram-common.js and diagram-compute.classic.js (the classic build of the shared compute runtime). Nothing else is fetched, no third-party host is contacted, and nothing about the network the user draws is transmitted anywhere: every sweep runs in this browser, on the main thread or in same-origin Blob Workers created from diagram-compute.classic.js.":"Lädt drei Skripte gleichen Ursprungs neben der Seite — site-disclaimer.js, diagram-common.js und diagram-compute.classic.js (die klassische Build der gemeinsamen Rechen-Laufzeitumgebung). Nichts anderes wird abgerufen, kein Drittanbieter-Host wird kontaktiert, und nichts über das vom Benutzer gezeichnete Netz wird irgendwohin übertragen: jeder Sweep läuft in diesem Browser, im Hauptthread oder in Blob Workers gleichen Ursprungs, die aus diagram-compute.classic.js erstellt wurden.","Loss [m]":"Verlust [m]","Lowest p kPa(g)":"Niedrigster p kPa(Ü)","Main return":"Hauptrücklauf","Main supply":"Hauptvorlauf","Max continuity residual":"Max. Kontinuitätsresiduum","Max energy residual":"Max. Energieresiduum","Monte-Carlo samples":"Monte-Carlo-Samples","Monte-Carlo seed":"Monte-Carlo-Seed","N-1 screen":"N-1-Prüfung","Network drawing:":"Netzzeichnung:","Network files":"Netzdateien","Network loaded":"Netz geladen","No HGL generated.":"Keine HGL erzeugt.","No continuous flow-following return path; showing a topological fallback path.":"Kein durchgehender volumenstromfolgender Rücklaufpfad; ein topologischer Ausweichpfad wird angezeigt.","No return path from pump discharge to suction. HGL needs a loop/path excluding the pump.":"Kein Rücklaufpfad vom Pumpenauslass zum Pumpeneinlass. HGL benötigt eine Schleife/einen Pfad ohne die Pumpe.","Nodes":"Knoten","Nothing to sample. Give the roughness a sigma above 0 (the network needs pipes), or the demands an sd above 0 on a network that has non-zero demands.":"Nichts zu samplen. Geben Sie der Rauheit ein Sigma über 0 (das Netz benötigt Rohre), oder den Bedarfswerten ein sd über 0 bei einem Netz mit von Null verschiedenen Bedarfswerten.","Open a hydraulic-network JSON file":"Eine JSON-Datei eines hydraulischen Netzes öffnen","Open network JSON…":"Netz-JSON öffnen…","Outcome":"Ergebnis","Over limit":"Über Grenzwert","P.K. Swamee & A.K. Jain, Explicit equations for pipe-flow problems, ASCE J. Hydraulics Div. 102(5) (1976) 657-664 — f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, stated for 1e-6 <= eps/D <= 1e-2 and 5e3 <= Re <= 1e8.":"P.K. Swamee & A.K. Jain, Explicit equations for pipe-flow problems, ASCE J. Hydraulics Div. 102(5) (1976) 657-664 — f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, angegeben für 1e-6 <= eps/D <= 1e-2 und 5e3 <= Re <= 1e8.","Partial load 0 to 150 %, global pump speed 40 to 120 %":"Teillast 0 bis 150%, globale Pumpendrehzahl 40 bis 120%","Partial-load factor must be between 0 and 150%.":"Teillastfaktor muss zwischen 0 und 150% liegen.","Pipe":"Rohr","Pipe:":"Rohr:","Pipe:  h_loss = (f L/D + K) v^2 / (2 g),  v = q/A,  Re = v D / nu":"Rohr: h_loss = (f L/D + K) v^2 / (2 g), v = q/A, Re = v D / nu","Pipes":"Rohre","Plant return":"Anlagenrücklauf","Pointer":"Zeiger","Positive edge flow follows its arrow.":"Positiver Kantenvolumenstrom folgt seinem Pfeil.","Pressure kPa(g)":"Druck kPa(Ü)","Properties":"Eigenschaften","Pump":"Pumpe","Pump / system curve":"Pumpen-/Anlagenkennlinie","Pump / system curve — select a pump, then press Pump / system curve.":"Pumpen-/Anlagenkennlinie — wählen Sie eine Pumpe, drücken Sie dann Pumpen-/Anlagenkennlinie.","Pump H m":"Pumpe Förderhöhe m","Pump [m]":"Pumpe [m]","Pump and system curve":"Pumpen- und Anlagenkennlinie","Pump discharge":"Pumpenauslass","Pump kW (hydraulic)":"Pumpe kW (hydraulisch)","Pump rated head must be below shutoff head; reverse flow and beyond-runout operation are extrapolations and are warned":"Nennförderhöhe der Pumpe muss unter der Nullförderhöhe liegen; Rückwärtsströmung und Betrieb jenseits des Nullpunkts sind Extrapolationen und werden gewarnt","Pump, two branches, coil and control valve — the shipped example":"Pumpe, zwei Zweige, Register und Regelventil — das mitgelieferte Beispiel","Pump/system curve":"Pumpen-/Anlagenkennlinie","Pump:":"Pumpe:","Pump:  H = H0 s^2 - a q|q|,  a = (H0 - H_rated)/q_rated^2,  s = local speed x global speed factor":"Pumpe: H = H0 s^2 - a q|q|, a = (H0 - H_rated)/q_rated^2, s = lokale Drehzahl x globaler Drehzahlfaktor","Pumps":"Pumpen","Results":"Ergebnisse","Return header":"Rücklaufsammler","Roughness rank corr.":"Rauheit-Rangkorrelation","Roughness σ (lognormal)":"Rauheit σ (lognormal)","Run an N-1 screen, a Monte-Carlo or a load profile. Each one solves the network many times; the pump / system curve above is now the same kind of sweep.":"Führen Sie eine N-1-Prüfung, eine Monte-Carlo-Methode oder ein Lastprofil aus. Jede davon berechnet das Netz viele Male; die Pumpen-/Anlagenkennlinie oben ist jetzt dieselbe Art von Sweep.","Save network JSON":"Netz-JSON speichern","Save network JSON writes the drawing, the components and the fluid as a versioned document; Open network JSON reads one back, validating every field before it touches the canvas. This is the network, not the calculation: the shared bar below carries the calculation record as JSON, CSV, a PDF report and a python script, and Copy link puts the whole network in a permalink.":"«Netz-JSON speichern» schreibt die Zeichnung, die Komponenten und das Fluid als versioniertes Dokument; «Netz-JSON öffnen» liest eines zurück und validiert jedes Feld, bevor es die Zeichenfläche berührt. Dies ist das Netz, nicht die Berechnung: die gemeinsame Leiste unten trägt den Berechnungsdatensatz als JSON, CSV, einen PDF-Bericht und ein Python-Skript, und «Link kopieren» legt das gesamte Netz in einen Permalink.","Select a node or a component on the drawing to edit it.":"Wählen Sie einen Knoten oder eine Komponente in der Zeichnung, um sie zu bearbeiten.","Select a pump first":"Wählen Sie zuerst eine Pumpe","Select moves and selects. Node places a node on empty canvas. Pipe, Pump, Valve and Heat exchanger each need two clicks: the start node, then the end node. The arrow drawn on a component is its positive direction — a negative solved flow means the fluid runs the other way. Delete removes the selected element, and every edit can be undone from the header.":"«Auswählen» verschiebt und wählt aus. «Knoten» platziert einen Knoten auf leerer Zeichenfläche. Rohr, Pumpe, Ventil und Wärmetauscher benötigen jeweils zwei Klicks: den Startknoten, dann den Endknoten. Der auf eine Komponente gezeichnete Pfeil ist ihre positive Richtung — ein negativer berechneter Volumenstrom bedeutet, dass das Fluid in die andere Richtung fließt. «Löschen» entfernt das ausgewählte Element, und jede Bearbeitung kann über die Kopfzeile rückgängig gemacht werden.","Selected:":"Ausgewählt:","Set target flow on at least one valve":"Zielvolumenstrom für mindestens ein Ventil festlegen","Shutoff head H₀":"Nullförderhöhe H₀","Solve failed":"Berechnung fehlgeschlagen","Solved in":"Berechnet in","Solved simultaneously for all edge flows and free-node heads by a damped Newton method with a numerical Jacobian":"Gleichzeitig gelöst für alle Kantenvolumenströme und freien Knotenhöhen mit einem gedämpften Newton-Verfahren mit numerischer Jacobi-Matrix","Solver diverged. Check component data.":"Löser divergierte. Komponentendaten prüfen.","Speed m/s":"Geschwindigkeit m/s","Static Δp a−b kPa":"Statischer Δp a−b kPa","Steady state, incompressible, single phase; constant density and viscosity":"Stationär, inkompressibel, einphasig; konstante Dichte und Viskosität","Steady-state incompressible networks · ensemble sweeps on the shared compute runtime":"Stationäre inkompressible Netze · Ensemble-Sweeps auf der gemeinsamen Rechen-Laufzeitumgebung","Steady-state, incompressible and single-phase. Fluid properties are constant. Heat exchangers are hydraulic resistances only. Pump curves use shutoff head plus one rated point; reverse flow and operation beyond zero-head runout are extrapolations and are warned. Automatic balancing is an iterative valve-opening heuristic and cannot guarantee coupled or infeasible targets. In meshed networks the HGL plot shows one representative flow-following return path (or a labelled topological fallback), not every path; HGL excludes velocity head. Junction/fitting losses must be entered through K. The dense browser solver refuses models above 600 nonlinear unknowns. No water hammer, NPSH/cavitation, efficiency map or transient control model is included.":"Stationär, inkompressibel und einphasig. Fluideigenschaften sind konstant. Wärmetauscher sind ausschließlich hydraulische Widerstände. Pumpenkennlinien verwenden die Nullförderhöhe plus einen Nennpunkt; Rückwärtsströmung und Betrieb jenseits des Nullpunkts sind Extrapolationen und werden gewarnt. Automatischer Abgleich ist eine iterative Ventilöffnungsheuristik und kann gekoppelte oder unerreichbare Ziele nicht garantieren. In vermaschten Netzen zeigt der HGL-Plot einen repräsentativen volumenstromfolgenden Rücklaufpfad (oder einen gekennzeichneten topologischen Ausweichpfad), nicht jeden Pfad; HGL schließt Geschwindigkeitshöhe aus. Verbindungs-/Formteilverluste müssen über K eingegeben werden. Der dichte Browser-Löser lehnt Modelle über 600 nichtlineare Unbekannte ab. Kein Wasserschlag, NPSH/Kavitation, Wirkungsgradkennfeld oder transientes Regelmodell enthalten.","Supply header":"Vorlaufsammler","Swamee-Jain is published for 1e-6 <= eps/D <= 1e-2 and 5e3 <= Re <= 1e8; it differs from the Colebrook root by up to about 3 % over that range":"Swamee-Jain ist veröffentlicht für 1e-6 <= eps/D <= 1e-2 und 5e3 <= Re <= 1e8; es weicht über diesen Bereich um bis zu etwa 3% von der Colebrook-Wurzel ab","System curve requires positive solved flow through the selected pump.":"Anlagenkennlinie erfordert einen positiven berechneten Volumenstrom durch die ausgewählte Pumpe.","The N-1 screen closes pipes and valves one at a time; this network has neither.":"Die N-1-Prüfung schließt Rohre und Ventile nacheinander; dieses Netz hat keines von beiden.","The ensemble sweep results also recorded here — pump/system curve, N-1 screen, Monte-Carlo quantiles, load-profile energy — are NOT reproduced: each is tens to thousands of further solves, and the Monte-Carlo additionally rests on the shared runtime’s Latin-hypercube design, its rank-correlation transform and its DDSketch quantile tallies, none of which this single file carries.":"Die hier ebenfalls aufgezeichneten Ensemble-Sweep-Ergebnisse — Pumpen-/Anlagenkennlinie, N-1-Prüfung, Monte-Carlo-Quantile, Lastprofilenergie — werden NICHT reproduziert: jedes davon sind Dutzende bis Tausende weiterer Berechnungen, und Monte-Carlo stützt sich zusätzlich auf das Latin-Hypercube-Design, die Rangkorrelationstransformation und die DDSketch-Quantilzählungen der gemeinsamen Laufzeitumgebung, von denen diese einzelne Datei nichts trägt.","The head along one return path from the pump discharge back to its suction, drawn against the elevation profile. In a meshed network there are many such paths; the plot shows one flow-following path, or a labelled topological fallback when no continuous flow-following path exists. It excludes velocity head.":"Die Höhe entlang eines Rücklaufpfads vom Pumpenauslass zurück zu ihrem Einlass, gegen das Höhenlagenprofil aufgetragen. In einem vermaschten Netz gibt es viele solcher Pfade; der Plot zeigt einen volumenstromfolgenden Pfad, oder einen gekennzeichneten topologischen Ausweichpfad, wenn kein durchgehender volumenstromfolgender Pfad existiert. Geschwindigkeitshöhe ist ausgeschlossen.","The hourly profile needs exactly 24 finite, non-negative multipliers.":"Das Stundenprofil benötigt genau 24 endliche, nicht negative Multiplikatoren.","The load profile reports pump energy; this network has no pump.":"Das Lastprofil meldet Pumpenenergie; dieses Netz hat keine Pumpe.","The metric Kv relation, dp[bar] = SG (q[m³/h] / Kv_eff)². Kv_eff is Kv × opening for a linear characteristic and Kv × 50^(opening−1) for equal percentage. The balance target is the flow the auto-balance heuristic tries to reach at 100 % load by closing the valve; rated Kv is never changed.":"Die metrische Kv-Beziehung, dp[bar] = SG (q[m³/h] / Kv_eff)². Kv_eff ist Kv × Öffnung für eine lineare Charakteristik und Kv × 50^(Öffnung−1) für gleichprozentig. Das Abgleichziel ist der Volumenstrom, den die Autoabgleich-Heuristik bei 100% Last durch Schließen des Ventils zu erreichen versucht; der Nennwert Kv wird nie geändert.","The network changed while the sweep was running. Solve it again, then redraw the curve.":"Das Netz hat sich während des laufenden Sweeps geändert. Berechnen Sie es erneut, zeichnen Sie dann die Kennlinie neu.","The shared interface layer (diagram-ui.js) did not load. Every input, the solver, the drawing, the sweeps and every export still work; the page falls back to one plain column.":"Die gemeinsame Interface-Ebene (diagram-ui.js) wurde nicht geladen. Jede Eingabe, der Löser, die Zeichnung, die Sweeps und jeder Export funktionieren weiterhin; die Seite fällt auf eine einfache Spalte zurück.","Topological fallback path coordinate":"Topologische Ausweichpfad-Koordinate","Unsupported hydraulic-network schema version":"Nicht unterstützte Schemaversion des hydraulischen Netzes","Valve":"Ventil","Valve opening 0.1 % to 100 %":"Ventilöffnung 0,1% bis 100%","Valve:":"Ventil:","Valve:  dp[bar] = SG (q[m3/h] / Kv_eff)^2,  Kv_eff = Kv * o (linear) or Kv * 50^(o-1) (equal percentage), o = opening/100":"Ventil: dp[bar] = SG (q[m3/h] / Kv_eff)^2, Kv_eff = Kv * o (linear) oder Kv * 50^(o-1) (gleichprozentig), o = Öffnung/100","Valves":"Ventile","With a pump selected, the network is re-solved 33 times with that pump forced to a series of flows. The system curve is the head the network demands at each flow; the pump curve is what the pump delivers; they cross at the operating point. Every point is solved cold, so the curve does not depend on the order the points were computed in.":"Bei ausgewählter Pumpe wird das Netz 33 Mal neu berechnet, wobei diese Pumpe auf eine Reihe von Volumenströmen gezwungen wird. Die Anlagenkennlinie ist die Höhe, die das Netz bei jedem Volumenstrom verlangt; die Pumpenkennlinie ist das, was die Pumpe liefert; sie kreuzen sich am Betriebspunkt. Jeder Punkt wird kalt berechnet, sodass die Kennlinie nicht von der Reihenfolge abhängt, in der die Punkte berechnet wurden.","at node":"bei Knoten","diagram-compute.classic.js did not load; sweeps run on the main thread and the Monte-Carlo sweep is unavailable because its Latin-hypercube design and quantile tallies live in the runtime":"diagram-compute.classic.js wurde nicht geladen; Sweeps laufen im Hauptthread, und der Monte-Carlo-Sweep ist nicht verfügbar, da sein Latin-Hypercube-Design und seine Quantilzählungen in der Laufzeitumgebung leben","every case was evaluated in index order on one thread, with no shared warm start":"jeder Fall wurde in Indexreihenfolge auf einem Thread ausgewertet, ohne gemeinsamen Warmstart","hL signed m":"hL vorzeichenbehaftet m","iterations; scaled residual":"Iterationen; skaliertes Residuum","kPa (gauge)":"kPa (Überdruck)","kW (hydraulic)":"kW (hydraulisch)","kWh (hydraulic, rho g Q H; no pump or motor efficiency)":"kWh (hydraulisch, rho g Q H; kein Pumpen- oder Motorwirkungsgrad)","metric Kv relation, with optional opening law.":"metrische Kv-Beziehung, mit optionalem Öffnungsgesetz.","p [kPa g]":"p [kPa Ü]","pump affinity scaling":"Pumpenaffinitätsskalierung","pump discharge":"Pumpenauslass","pump rated point":"Pumpennennpunkt","pump suction":"Pumpeneinlass","quadratic H(Q) from shutoff head and one rated point, scaled by affinity law speed².":"quadratische H(Q) aus der Nullförderhöhe und einem Nennpunkt, skaliert mit dem Affinitätsgesetz Drehzahl².","select a pump":"eine Pumpe auswählen","selected pump loop":"ausgewählter Pumpenkreis","signed reverse passive loss":"vorzeichenbehafteter umgekehrter passiver Verlust","the complete steady-state network solve of this page for the network currently on the canvas: the same continuity and energy equations, the same pipe/valve/heat-exchanger/pump component laws, and the same damped Newton iteration on scaled residuals. Charts, auto-balancing and the HGL path search are not part of the export.":"die vollständige stationäre Netzberechnung dieser Seite für das aktuell auf der Zeichenfläche befindliche Netz: dieselben Kontinuitäts- und Energiegleichungen, dieselben Rohr-/Ventil-/Wärmetauscher-/Pumpenkomponentengesetze und dieselbe gedämpfte Newton-Iteration auf skalierten Residuen. Diagramme, Autoabgleich und die HGL-Pfadsuche sind nicht Teil des Exports.","unrecognised hydraulic-network state payload":"nicht erkannte Zustandsdaten des hydraulischen Netzes","v2 build: the steady-state solve recorded above is the v1 tool’s solver unchanged — same residual assembly, same central-difference Jacobian, same dense Gauss-Jordan with partial pivoting, same damped Newton line search. What this build adds is repeated solves (pump/system curve, N-1 screen, Monte-Carlo, load profile) on the shared compute runtime diagram-compute.classic.js.":"v2-Build: die oben aufgezeichnete stationäre Berechnung ist der unveränderte Löser des v1-Tools — dieselbe Residuenassemblierung, dieselbe Jacobi-Matrix durch zentrale Differenzen, dasselbe dichte Gauß-Jordan-Verfahren mit partieller Pivotisierung, dieselbe gedämpfte Newton-Liniensuche. Was dieser Build hinzufügt, sind wiederholte Berechnungen (Pumpen-/Anlagenkennlinie, N-1-Prüfung, Monte-Carlo, Lastprofil) auf der gemeinsamen Rechen-Laufzeitumgebung diagram-compute.classic.js.","↖ Select":"↖ Auswählen","━ Elevation":"━ Höhenlage","━ Pipe":"━ Rohr","▶ Pump":"▶ Pumpe","◇ Valve":"◇ Ventil","● Node":"● Knoten","Hydraulic Network Solver":"Hydraulischer Netzberechner","Draw an arbitrary network of pipes, nodes, pumps, valves and heat exchangers and solve the steady-state flows and pressures.":"Beliebige Netze aus Rohren, Knoten, Pumpen, Ventilen und Wärmetauschern zeichnen und stationäre Volumenströme und Drücke berechnen.","Draw an arbitrary network of pipes, nodes, pumps, valves and heat exchangers and solve the steady-state flows and pressures. Includes Darcy–Weisbach pipe losses, pump and system curves, hydraulic grade line, valve balancing, partial-load scaling, and JSON/CSV import-export.":"Beliebige Netze aus Rohren, Knoten, Pumpen, Ventilen und Wärmetauschern zeichnen und stationäre Volumenströme und Drücke berechnen. Mit Darcy–Weisbach, Pumpen- und Anlagenkennlinie, hydraulischer Gradlinie, Ventilabgleich, Teillastskalierung sowie JSON/CSV-Import und -Export.","Steady solve:":"Stationäre Berechnung:","backend:":"Backend:","idle":"untätig","repeatable":"wiederholbar","solved":"gelöst","free":"frei","pipe":"Rohr","pump":"Pumpe","valve":"Ventil","hx":"Wärmetauscher","━ System":"━ Anlage","━ HGL":"━ Gradlinie","Hydraulic Network Solver (v2)":"Hydraulischer Netzberechner (v2)","Pump and motor efficiency are not modelled, so this is not shaft or electrical energy.":"Pumpen- und Motorwirkungsgrad werden nicht modelliert; dies ist also keine Wellen- oder elektrische Energie.","HGL m":"HGL m","HGL":"HGL","p P5 kPa(g)":"p P5 kPa(Ü)"};

document.documentElement.lang='de';
const attrs=['placeholder','title','aria-label','alt'];
function tr(s){if(s==null)return s;const x=String(s);if(Object.prototype.hasOwnProperty.call(DE,x))return DE[x];const a=x.match(/^\s*/)[0],b=x.match(/\s*$/)[0],t=x.trim();if(Object.prototype.hasOwnProperty.call(DE,t))return a+DE[t]+b;const pz=t&&window.__hnPatterns?window.__hnPatterns.translate('de',t,DE):null;if(pz!=null)return a+pz+b;const lw=window.DiagramUI&&DiagramUI.current&&typeof DiagramUI.current.t==='function'?DiagramUI.current.t('learn'):null;if(lw&&t.indexOf(lw+': ')===0){const k=t.slice(lw.length+2);if(Object.prototype.hasOwnProperty.call(DE,k))return a+lw+': '+DE[k]+b}return x}
function node(n){if(!n)return;if(n.nodeType===3){const p=n.parentElement;if(p&&!/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(p.tagName)){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}return}if(n.nodeType!==1)return;if(/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(n.tagName))return;for(const a of attrs)if(n.hasAttribute(a)){const v=n.getAttribute(a),w=tr(v);if(w!==v)n.setAttribute(a,w)}if(n.tagName==='INPUT'&&/^(button|submit|reset)$/i.test(n.type||'')){const v=n.value,w=tr(v);if(w!==v)n.value=w}const tw=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let q;while(q=tw.nextNode())node(q);for(const e of n.querySelectorAll('*'))for(const a of attrs)if(e.hasAttribute(a)){const v=e.getAttribute(a),w=tr(v);if(w!==v)e.setAttribute(a,w)}}
const run=()=>{node(document.body);const tt=document.querySelector('title');if(tt)node(tt)};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')node(m.target);else if(m.type==='attributes'){const el=m.target,v=el.getAttribute(m.attributeName),w=tr(v);if(v!=null&&w!==v)el.setAttribute(m.attributeName,w)}else for(const n of m.addedNodes)node(n)}}).observe(document.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:attrs});
})();
</script>
