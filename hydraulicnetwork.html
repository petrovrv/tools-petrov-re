/h]":"Limite [m³/h]","Boundary conditions":"Conditions aux limites","Cancel sweep":"Annuler le balayage","Click empty canvas to add a node.":"Cliquez sur un espace vide du canevas pour ajouter un nœud.","Component":"Composant","Component closed":"Composant fermé","Component results":"Résultats des composants","Components":"Composants","Delete":"Supprimer","Delete selected":"Supprimer la sélection","Demand [m³/h]":"Demande [m³/h]","Demand m³/h":"Demande m³/h","Design flow":"Débit de conception","Design Δp":"Δp de conception","Direction:":"Sens :","Drag nodes. Select an element to edit it.":"Faites glisser les nœuds. Sélectionnez un élément pour le modifier.","Draw":"Dessiner","Edge":"Arête","Edge results":"Résultats des arêtes","Elevation":"Altitude","Elevation m":"Altitude m","Ensemble sweep results":"Résultats des balayages d'ensemble","Equal percentage (R=50)":"Pourcentage égal (R=50)","Equations":"Équations","Exponent n":"Exposant n","Fixed-pressure boundary":"Limite à pression fixe","Fixed-pressure node:  h = p / (rho g)":"Nœud à pression fixe : h = p / (rho g)","Flow m³/h":"Débit m³/h","Highest v m/s":"v maximale m/s","Hour":"Heure","Ignored":"Ignoré","Invalid network file":"Fichier réseau non valide","Jacobian is singular":"Le jacobien est singulier","Kinematic viscosity":"Viscosité cinématique","Length":"Longueur","Load profile cancelled.":"Profil de charge annulé.","Load profile failed:":"Échec du profil de charge :","Local speed":"Vitesse locale","Minor-loss ΣK":"Perte singulière ΣK","Model limits":"Limites du modèle","Monte-Carlo":"Monte-Carlo","Monte-Carlo cancelled.":"Monte-Carlo annulé.","Monte-Carlo failed:":"Échec de Monte-Carlo :","N-1 screen cancelled.":"Dépistage N-1 annulé.","N-1 screen failed:":"Échec du dépistage N-1 :","NETWORK =":"NETWORK =","Name":"Nom","Network editor":"Éditeur de réseau","Network file":"Fichier réseau","Network file is too large (5 MB limit).":"Le fichier réseau est trop volumineux (limite de 5 Mo).","Network file is too large for this editor (max 1000 nodes / 3000 components).":"Le fichier réseau est trop volumineux pour cet éditeur (max 1000 nœuds / 3000 composants).","Newton iterations":"Itérations de Newton","Newton line search failed.":"Échec de la recherche linéaire de Newton.","No curve generated.":"Aucune courbe générée.","Node":"Nœud","Node continuity (free nodes):  SUM_in q - SUM_out q - demand * load_factor = 0":"Continuité nodale (nœuds libres) : SUM_in q - SUM_out q - demand * load_factor = 0","Node results":"Résultats des nœuds","Nodes and edges must be arrays.":"Les nœuds et les arêtes doivent être des tableaux.","None":"Aucun","Not solved":"Non résolu","Not solved.":"Non résolu.","Nothing to cancel; this sweep cannot be interrupted without the shared runtime.":"Rien à annuler ; ce balayage ne peut pas être interrompu sans le moteur partagé.","Opening":"Ouverture","Opening characteristic":"Caractéristique d'ouverture","Partial-load demand factor":"Facteur de demande en charge partielle","Profile length":"Longueur du profil","Qrated":"Qrated","Rated flow":"Débit nominal","Received":"Reçu","Roughness":"Rugosité","Scaled residual":"Résidu mis à l'échelle","Seasonal swing (8760 h only)":"Variation saisonnière (8760 h uniquement)","Shared compute runtime: starting…":"Moteur de calcul partagé : démarrage…","Solve network":"Résoudre le réseau","Solve the network first.":"Résolvez d'abord le réseau.","Solver failed:":"Échec du solveur :","Sweep cancelled.":"Balayage annulé.","THE ACCURACY BOUND IS VOID FOR AT LEAST ONE TALLY.":"LA BORNE DE PRÉCISION EST NULLE POUR AU MOINS UN RELEVÉ.","The Monte-Carlo sweep needs diagram-compute.classic.js — its Latin-hypercube design, its rank-correlation transform and its mergeable quantile tallies are the runtime’s, and this build will not swap in a different sampler and present it as the same experiment.":"Le balayage Monte-Carlo nécessite diagram-compute.classic.js — son plan d'hypercube latin, sa transformation de corrélation de rang et ses relevés de quantiles fusionnables appartiennent au moteur, et cette build ne substituera pas un autre échantillonneur en le présentant comme la même expérience.","This sweep needs diagram-compute.classic.js: its \"":"Ce balayage nécessite diagram-compute.classic.js : son \"","Type":"Type","Velocity limit":"Limite de vitesse","What this tool does":"Ce que fait cet outil","a Worker case was checked against the same case solved on the main thread before any sweep was offered":"un cas Worker a été vérifié par rapport au même cas résolu sur le thread principal avant même qu'un balayage ne soit proposé","and 5·10":"et 5·10","arithmetic, and that rule is what governs on a platform whose libm rounds differently.":"calcul, et c'est cette règle qui prévaut sur une plateforme dont la libm arrondit différemment.","at opening limit:":"à la limite d'ouverture :","cancelled by the user":"annulé par l'utilisateur","cancelling…":"annulation…","central-difference Jacobian, the damped line search and the linear solve are all the":"jacobien aux différences centrées, la recherche linéaire amortie et la résolution linéaire sont tous les","delete,backspace":"suppr,retour arrière","diagram-compute.classic.js is absent, so the sweep ran as one blocking main-thread loop, exactly as v1 did":"diagram-compute.classic.js est absent, le balayage s'est donc exécuté comme une seule boucle bloquante sur le thread principal, exactement comme le faisait v1","explicit approximation":"approximation explicite","gate then bounds the result at roughly 1e-7 relative.":"seuil borne alors le résultat à environ 1e-7 relatif.","halts at a scaled residual of 2e-9, worth about 1e-7 relative) rather than by the":"s'arrête à un résidu mis à l'échelle de 2e-9, soit environ 1e-7 relatif) plutôt que par le","laminar friction":"frottement laminaire","main thread":"thread principal","no Worker pool could be created (":"aucun pool de Workers n'a pu être créé (","no result":"aucun résultat","no runtime; one blocking main-thread loop":"pas de moteur ; une boucle bloquante sur le thread principal","no sweep has run yet; the interactive solve is always on the main thread":"aucun balayage n'a encore été exécuté ; la résolution interactive est toujours sur le thread principal","no sweep run":"aucun balayage exécuté","nodes,":"nœuds,","none (diagram-compute.classic.js absent)":"aucun (diagram-compute.classic.js absent)","none: every recorded output reproduces bit for bit on this platform. What could":"aucun : chaque sortie enregistrée se reproduit bit à bit sur cette plateforme. Ce qui pourrait","nothing is imported and nothing is substituted. The residual assembly, the":"rien n'est importé et rien n'est substitué. L'assemblage du résidu, le","operating point":"point de fonctionnement","path taken here is the path the page took.":"chemin emprunté ici est le chemin qu'a suivi la page.","preliminary assessment":"évaluation préliminaire","still separate the two is a C library whose exp/log/pow round differently in the last":"sépare encore les deux est une bibliothèque C dont exp/log/pow arrondissent différemment sur le dernier","technical exploration":"exploration technique","the Worker case failed:":"le cas Worker a échoué :","the Worker path did not reproduce the main-thread solve (":"le trajet Worker n'a pas reproduit la résolution du thread principal (","the Worker path failed during this sweep (":"le trajet Worker a échoué pendant ce balayage (","the network on the canvas is not solvable, so no comparison was possible":"le réseau sur le canevas n'est pas soluble, aucune comparaison n'était donc possible","the shared runtime failed to start (":"le moteur partagé n'a pas pu démarrer (","the shared runtime is loaded; sweeps run on the main thread":"le moteur partagé est chargé ; les balayages s'exécutent sur le thread principal","this browser exposes no Worker; sweeps run on the main thread":"ce navigateur n'expose aucun Worker ; les balayages s'exécutent sur le thread principal","to Colebrook–White, published for 10":"à Colebrook–White, publiée pour 10","unknown sweep case kind:":"type de cas de balayage inconnu :","worst relative difference":"pire écart relatif","· design":"· conception","— THE ACCURACY BOUND IS VOID FOR AT LEAST ONE TALLY":"— LA BORNE DE PRÉCISION EST NULLE POUR AU MOINS UN RELEVÉ","; over that box it differs from the Colebrook root by up to about 3% in f, and by more outside it. The 2000<Re<4000 blend is a numerical bridge, not a resolved transition model. Pipes running outside the published box are listed as a warning after each solve.":" ; dans cette plage, cela diffère de la racine de Colebrook jusqu'à environ 3% sur f, et davantage en dehors. Le mélange 2000<Re<4000 est un pont numérique, pas un modèle de transition résolu. Les conduites sortant de la plage publiée sont listées comme avertissement après chaque résolution.","A coil":"Une batterie","A fixed-pressure node fixes gauge pressure; its elevation is still part of total head. A demand node removes flow from the network. Negative demand injects flow. Closed circulating systems need one arbitrary pressure reference node.":"Un nœud à pression fixe impose la pression relative ; son altitude fait toujours partie de la hauteur totale. Un nœud de demande retire du débit au réseau. Une demande négative injecte du débit. Les systèmes en circuit fermé ont besoin d'un nœud de référence de pression arbitraire.","A fixed-pressure node prescribes gauge pressure instead of solving it; its elevation still counts towards total head, and the solver reports the boundary exchange needed to hold that pressure. Every connected component of the drawing needs at least one, and a closed circulating loop needs one arbitrary reference node — without it the pressure level is undetermined and the Jacobian is singular.":"Un nœud à pression fixe impose la pression relative au lieu de la calculer ; son altitude compte toujours dans la hauteur totale, et le solveur indique l'échange aux limites nécessaire pour maintenir cette pression. Chaque composante connexe du dessin en a besoin d'au moins un, et une boucle de circulation fermée a besoin d'un nœud de référence arbitraire — sans lui, le niveau de pression est indéterminé et le jacobien est singulier.","A hydraulic resistance only: Δp = Δp_design (Q/Q_design)^n, with n typically 2 for a fully turbulent coil. No thermal model, no capacity, no fouling.":"Uniquement une résistance hydraulique : Δp = Δp_design (Q/Q_design)^n, avec n typiquement 2 pour une batterie pleinement turbulente. Aucun modèle thermique, aucune puissance, aucun encrassement.","A node is a junction with an elevation. Its demand is the flow taken out of the network there, in m³/h, positive out and negative in; demand is scaled by the global partial-load factor. A node that is not fixed has its pressure solved.":"Un nœud est une jonction avec une altitude. Sa demande est le débit prélevé au réseau à cet endroit, en m³/h, positif vers l'extérieur et négatif vers l'intérieur ; la demande est mise à l'échelle par le facteur de charge partielle global. Un nœud non fixe voit sa pression calculée.","A quadratic H(Q) through the shutoff head and one rated point, H = H0 s² − a q|q|, with the speed s the local speed times the global pump-speed factor, by the affinity law. Rated head must be below shutoff head. Reverse flow and operation past zero-head runout are extrapolations of that parabola and are warned, not modelled.":"Une H(Q) quadratique passant par la hauteur à débit nul et un point nominal, H = H0 s² − a q|q|, où la vitesse s est la vitesse locale multipliée par le facteur de vitesse global de la pompe, selon la loi de similitude. La hauteur nominale doit être inférieure à la hauteur à débit nul. Le débit inverse et le fonctionnement au-delà du point à hauteur nulle sont des extrapolations de cette parabole et sont signalés par un avertissement, non modélisés.","A sweep solves the same network many times. The N-1 screen closes each pipe and valve in turn and reports the lowest pressure and the highest velocity that follow. The Monte-Carlo samples pipe roughness (lognormal) and nodal demand (normal) on a Latin hypercube with rank correlation and reports P5/P50/P95 quantiles. The load profile runs 24 h or 8760 h of demand multipliers and integrates hydraulic pump energy. Sweeps go to same-origin Workers only when that is measurably cheaper than the round trip; the steady solve itself always stays on the main thread.":"Un balayage résout le même réseau de nombreuses fois. L'analyse N-1 ferme tour à tour chaque conduite et vanne et indique la pression la plus basse et la vitesse la plus élevée qui en résultent. Monte-Carlo échantillonne la rugosité des conduites (lognormale) et la demande nodale (normale) sur un hypercube latin avec corrélation de rang et indique les quantiles P5/P50/P95. Le profil de charge exécute 24 h ou 8760 h de multiplicateurs de demande et intègre l'énergie hydraulique de la pompe. Les balayages ne vont vers des Workers de même origine que lorsque c'est mesurablement plus économique que l'aller-retour ; la résolution stationnaire elle-même reste toujours sur le thread principal.","Affinity law H ~ n^2 for the two-point quadratic pump curve.":"Loi de similitude H ~ n^2 pour la courbe de pompe quadratique à deux points.","All edge flows and all free-node heads are solved simultaneously by a damped Newton method on the scaled residuals, with a central-difference numerical Jacobian and a dense Gauss–Jordan solve with partial pivoting. It stops at a scaled residual of 2e-9 or at 60 iterations, and says which. The two residuals reported beside the iteration count are the physical ones: the largest nodal continuity error in m³/h and the largest edge energy error in metres.":"Tous les débits des arêtes et toutes les hauteurs des nœuds libres sont résolus simultanément par une méthode de Newton amortie sur les résidus mis à l'échelle, avec un jacobien numérique par différences centrées et une résolution de Gauss–Jordan dense à pivotage partiel. L'arrêt se fait à un résidu mis à l'échelle de 2e-9 ou à 60 itérations, en indiquant lequel. Les deux résidus indiqués à côté du nombre d'itérations sont les résidus physiques : l'erreur de continuité nodale la plus grande en m³/h et l'erreur d'énergie d'arête la plus grande en mètres.","An iterative heuristic that closes the valves carrying more than their target flow until each is within about 2 % of it, at the current partial load. Rated Kv values are never modified — only the opening. Coupled or infeasible targets are reported rather than forced.":"Une heuristique itérative qui ferme les vannes transportant plus que leur débit cible jusqu'à ce que chacune soit à environ 2% de celui-ci, à la charge partielle actuelle. Les valeurs nominales de Kv ne sont jamais modifiées — seule l'ouverture l'est. Les cibles couplées ou infaisables sont signalées plutôt que forcées.","Analysis controls":"Commandes d'analyse","At least one fixed-pressure node is required in every connected component.":"Au moins un nœud à pression fixe est requis dans chaque composante connexe.","Auto-balance":"Équilibrage automatique","Auto-balance valves":"Équilibrer automatiquement les vannes","B control valve":"Vanne de régulation B","B supply":"Alimentation B","Balance target @100% load":"Cible d'équilibrage @100% de charge","Branch A":"Branche A","Branch B":"Branche B","A supply":"Alimentation A","Click start node, then end node to add a heat exchanger.":"Cliquez sur le nœud de départ, puis sur le nœud d'arrivée pour ajouter un échangeur.","C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156 — used only to quantify the Swamee-Jain scatter.":"C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156 — utilisé uniquement pour quantifier la dispersion de Swamee-Jain.","Click start node, then end node to add a pipe.":"Cliquez sur le nœud de départ, puis sur le nœud d'arrivée pour ajouter une conduite.","Click start node, then end node to add a valve.":"Cliquez sur le nœud de départ, puis sur le nœud d'arrivée pour ajouter une vanne.","Click suction node, then discharge node to add a pump.":"Cliquez sur le nœud d'aspiration, puis sur le nœud de refoulement pour ajouter une pompe.","Could not sweep the system curve over a usable range.":"Impossible de balayer la courbe du réseau sur une plage utilisable.","Darcy–Weisbach with the Swamee–Jain explicit friction factor above Re = 4000, 64/Re below Re = 2000 and a smoothstep blend between them. Diameter and roughness are entered in millimetres, length in metres. ΣK collects the bends, tees and fittings on the run; junction and fitting losses have to be entered here because the solver has no geometry to infer them from.":"Darcy–Weisbach avec le facteur de frottement explicite de Swamee–Jain au-dessus de Re = 4000, 64/Re en dessous de Re = 2000 et un mélange progressif entre les deux. Le diamètre et la rugosité sont saisis en millimètres, la longueur en mètres. ΣK regroupe les coudes, tés et raccords du tronçon ; les pertes de jonction et de raccord doivent être saisies ici car le solveur n'a aucune géométrie pour les déduire.","Darcy–Weisbach; Swamee–Jain turbulent friction, 64/Re laminar, smooth interpolation through transition; minor-loss K included. Swamee–Jain is an":"Darcy–Weisbach ; frottement turbulent de Swamee–Jain, 64/Re laminaire, interpolation lisse à travers la transition ; K de perte mineure inclus. Swamee–Jain est une","Delete the selected element":"Supprimer l'élément sélectionné","Demand (+ out)":"Demande (+ sortant)","Demand is scaled by the global partial-load factor. Negative demand is injection. A fixed-pressure node reports the boundary exchange required to maintain its pressure.":"La demande est mise à l'échelle par le facteur de charge partielle global. Une demande négative est une injection. Un nœud à pression fixe indique l'échange aux limites nécessaire pour maintenir sa pression.","Demand rank corr.":"Corrélation de rang de la demande","Demand sd (normal)":"Demande éc.-type (normale)","Demand ×":"Demande ×","Density and kinematic viscosity are constants for the whole network. The partial-load factor scales every nodal demand, so a network whose demands are all zero is insensitive to it. The global pump-speed factor scales every pump on top of its own local speed.":"La masse volumique et la viscosité cinématique sont des constantes pour tout le réseau. Le facteur de charge partielle met à l'échelle chaque demande nodale, donc un réseau dont toutes les demandes sont nulles y est insensible. Le facteur de vitesse global de la pompe met à l'échelle chaque pompe en plus de sa propre vitesse locale.","District-heating loop":"Boucle de chauffage urbain","Draw and solve arbitrary hydraulic networks with pipes, pumps, valves and heat exchangers. Steady-state flows, pressures, pump/system curves, hydraulic grade line, balancing and partial-load analysis.":"Dessinez et calculez des réseaux hydrauliques arbitraires avec conduites, pompes, vannes et échangeurs. Débits et pressions en régime permanent, courbes pompe/réseau, ligne piézométrique, équilibrage et analyse de charge partielle.","Draw or load a network, then press Solve network.":"Dessinez ou chargez un réseau, puis appuyez sur Résoudre le réseau.","Drawing the network":"Dessiner le réseau","Each edge ID must start with a letter and contain only letters, digits, _ . : - (max 64 characters).":"Chaque ID d'arête doit commencer par une lettre et ne contenir que des lettres, chiffres, _ . : - (64 caractères max).","Each node ID must start with a letter and contain only letters, digits, _ . : - (max 64 characters).":"Chaque ID de nœud doit commencer par une lettre et ne contenir que des lettres, chiffres, _ . : - (64 caractères max).","Edge energy:  h_a + z_a - h_b - z_b + H_pump(q) - h_loss(q) = 0":"Énergie de l'arête : h_a + z_a - h_b - z_b + H_pump(q) - h_loss(q) = 0","Ensemble sweeps":"Balayages d'ensemble","Every network needs at least one fixed-pressure node per connected component; a closed circuit needs one arbitrary reference.":"Chaque réseau a besoin d'au moins un nœud à pression fixe par composante connexe ; un circuit fermé a besoin d'une référence arbitraire.","Every node in this network has zero demand, and the profile multiplier scales nodal demands only — so every hour below is the same operating point. Give at least one node a demand to make the profile mean anything.":"Chaque nœud de ce réseau a une demande nulle, et le multiplicateur de profil ne met à l'échelle que les demandes nodales — chaque heure ci-dessous correspond donc au même point de fonctionnement. Donnez une demande à au moins un nœud pour donner un sens au profil.","Fixed gauge pressure boundary":"Limite à pression relative fixe","Flow [m³/h]":"Débit [m³/h]","Flow-following loop coordinate":"Coordonnée de boucle suivant le débit","Fluid and load":"Fluide et charge","Fluid density":"Masse volumique du fluide","Fluid density must be a positive finite number.":"La masse volumique du fluide doit être un nombre fini positif.","For every free node the solver enforces continuity. For every edge it enforces the steady Bernoulli equation using pressure head + elevation, pump head and signed component loss. Unknown edge flows and free-node pressure heads are solved simultaneously with a damped Newton method.":"Pour chaque nœud libre, le solveur impose la continuité. Pour chaque arête, il impose l'équation de Bernoulli stationnaire avec hauteur de pression + altitude, hauteur de pompe et perte signée du composant. Les débits d'arête inconnus et les hauteurs de pression des nœuds libres sont résolus simultanément par une méthode de Newton amortie.","Friction: f = 64/Re for Re <= 2000; Swamee-Jain f = 0.25 / [log10(eps/(3.7 D) + 5.74/Re^0.9)]^2 for Re >= 4000; smoothstep blend between":"Frottement : f = 64/Re pour Re <= 2000 ; Swamee-Jain f = 0.25 / [log10(eps/(3.7 D) + 5.74/Re^0.9)]^2 pour Re >= 4000 ; mélange progressif entre les deux","Gauge pressure":"Pression relative","Global pump-speed factor":"Facteur de vitesse global de la pompe","Global pump-speed factor must be between 40 and 120%.":"Le facteur de vitesse global de la pompe doit être compris entre 40 et 120%.","H. Cross, Analysis of Flow in Networks of Conduits or Conductors, Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936) — loop-correction method.":"H. Cross, Analysis of Flow in Networks of Conduits or Conductors, Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936) — méthode de correction de boucle.","HGL excludes velocity head. Junction and fitting losses must be entered through K.":"La ligne piézométrique exclut la hauteur cinétique. Les pertes de jonction et de raccord doivent être saisies via K.","HX design point":"Point de conception de l'échangeur","Hagen-Poiseuille laminar closed form f = 64/Re — derived, used to grade the laminar branch.":"Forme fermée laminaire de Hagen-Poiseuille f = 64/Re — dérivée, utilisée pour évaluer la branche laminaire.","Head / elevation [m]":"Hauteur / altitude [m]","Head [m]":"Hauteur [m]","Head at rated flow":"Hauteur au débit nominal","Heat exchanger":"Échangeur de chaleur","Heat exchanger:":"Échangeur :","Heat exchanger:  h_loss = (dp_design / (rho g)) (q / q_design)^n":"Échangeur : h_loss = (dp_design / (rho g)) (q / q_design)^n","Heat exchangers":"Échangeurs","Heat-exchanger exponent n between 1 and 3":"Exposant n de l'échangeur entre 1 et 3","Hourly demand multipliers (24 values, comma separated)":"Multiplicateurs horaires de demande (24 valeurs, séparées par des virgules)","How it is solved, and how well":"Comment c'est résolu, et avec quelle précision","Hrated":"Hrated","Hydraulic grade line":"Ligne piézométrique","Hydraulic grade line of the selected pump loop.":"Ligne piézométrique de la boucle de pompe sélectionnée.","Hydraulic internal checks failed":"Échec des contrôles internes hydrauliques","Hydraulic network drawing canvas":"Canevas de dessin du réseau hydraulique","Hydraulic pump energy ρgQH integrated over the period:":"Énergie hydraulique de la pompe ρgQH intégrée sur la période :","IEC 60534-2-1 / metric Kv definition: Q[m3/h] = Kv sqrt(dp[bar]/SG).":"CEI 60534-2-1 / définition métrique du Kv : Q[m3/h] = Kv sqrt(dp[bar]/SG).","Imported global pump-speed factor must be between 40 and 120%.":"Le facteur de vitesse global de la pompe importé doit être compris entre 40 et 120%.","Imported partial-load factor must be between 0 and 150%.":"Le facteur de charge partielle importé doit être compris entre 0 et 150%.","Initial residual is not finite. Check component data.":"Le résidu initial n'est pas fini. Vérifiez les données des composants.","Inside diameter":"Diamètre intérieur","It draws a hydraulic network — nodes joined by pipes, pumps, valves and heat exchangers — and solves the steady flows and pressures in it. Load the example, or place nodes and join them, give at least one node a fixed pressure, then press Solve network. Nothing is computed until you do: this is a run tool, and the result is marked stale the moment you change anything.":"Il dessine un réseau hydraulique — des nœuds reliés par des conduites, pompes, vannes et échangeurs — et résout les débits et pressions stationnaires qui y règnent. Chargez l'exemple, ou placez des nœuds et reliez-les, donnez à au moins un nœud une pression fixe, puis appuyez sur Résoudre le réseau. Rien n'est calculé tant que vous ne le faites pas : c'est un outil d'exécution, et le résultat est marqué comme obsolète dès que vous modifiez quoi que ce soit.","Kinematic viscosity must be a positive finite number.":"La viscosité cinématique doit être un nombre fini positif.","Kv at 100%":"Kv à 100%","Kv design relation":"Relation de conception Kv","Linear Kv":"Kv linéaire","Load profile":"Profil de charge","Load profile: every node in this network has zero demand and the profile multiplier scales nodal demands only, so every hour is the same operating point and the energy figure is one point multiplied by the number of hours.":"Profil de charge : chaque nœud de ce réseau a une demande nulle et le multiplicateur de profil ne met à l'échelle que les demandes nodales, donc chaque heure correspond au même point de fonctionnement et le chiffre d'énergie est un point multiplié par le nombre d'heures.","Loads three same-origin scripts beside the page — site-disclaimer.js, diagram-common.js and diagram-compute.classic.js (the classic build of the shared compute runtime). Nothing else is fetched, no third-party host is contacted, and nothing about the network the user draws is transmitted anywhere: every sweep runs in this browser, on the main thread or in same-origin Blob Workers created from diagram-compute.classic.js.":"Charge trois scripts de même origine à côté de la page — site-disclaimer.js, diagram-common.js et diagram-compute.classic.js (la version classique du moteur de calcul partagé). Rien d'autre n'est récupéré, aucun hôte tiers n'est contacté, et rien concernant le réseau dessiné par l'utilisateur n'est transmis où que ce soit : chaque balayage s'exécute dans ce navigateur, sur le thread principal ou dans des Workers Blob de même origine créés à partir de diagram-compute.classic.js.","Loss [m]":"Perte [m]","Lowest p kPa(g)":"p le plus bas kPa(r)","Main return":"Retour principal","Main supply":"Alimentation principale","Max continuity residual":"Résidu de continuité max.","Max energy residual":"Résidu d'énergie max.","Monte-Carlo samples":"Échantillons Monte-Carlo","Monte-Carlo seed":"Graine Monte-Carlo","N-1 screen":"Analyse N-1","Network drawing:":"Dessin du réseau :","Network files":"Fichiers réseau","Network loaded":"Réseau chargé","No HGL generated.":"Aucune ligne piézométrique générée.","No continuous flow-following return path; showing a topological fallback path.":"Aucun chemin de retour continu suivant le débit ; affichage d'un chemin de secours topologique.","No return path from pump discharge to suction. HGL needs a loop/path excluding the pump.":"Aucun chemin de retour du refoulement de la pompe vers l'aspiration. La ligne piézométrique a besoin d'une boucle/d'un chemin excluant la pompe.","Nodes":"Nœuds","Nothing to sample. Give the roughness a sigma above 0 (the network needs pipes), or the demands an sd above 0 on a network that has non-zero demands.":"Rien à échantillonner. Donnez à la rugosité un sigma supérieur à 0 (le réseau a besoin de conduites), ou aux demandes un écart-type supérieur à 0 sur un réseau dont les demandes sont non nulles.","Open a hydraulic-network JSON file":"Ouvrir un fichier JSON de réseau hydraulique","Open network JSON…":"Ouvrir le JSON du réseau…","Outcome":"Résultat","Over limit":"Au-delà de la limite","P.K. Swamee & A.K. Jain, Explicit equations for pipe-flow problems, ASCE J. Hydraulics Div. 102(5) (1976) 657-664 — f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, stated for 1e-6 <= eps/D <= 1e-2 and 5e3 <= Re <= 1e8.":"P.K. Swamee & A.K. Jain, Explicit equations for pipe-flow problems, ASCE J. Hydraulics Div. 102(5) (1976) 657-664 — f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, indiqué pour 1e-6 <= eps/D <= 1e-2 et 5e3 <= Re <= 1e8.","Partial load 0 to 150 %, global pump speed 40 to 120 %":"Charge partielle 0 à 150%, vitesse globale de la pompe 40 à 120%","Partial-load factor must be between 0 and 150%.":"Le facteur de charge partielle doit être compris entre 0 et 150%.","Pipe":"Conduite","Pipe:":"Conduite :","Pipe:  h_loss = (f L/D + K) v^2 / (2 g),  v = q/A,  Re = v D / nu":"Conduite : h_loss = (f L/D + K) v^2 / (2 g), v = q/A, Re = v D / nu","Pipes":"Conduites","Plant return":"Retour installation","Pointer":"Pointeur","Positive edge flow follows its arrow.":"Un débit d'arête positif suit sa flèche.","Pressure kPa(g)":"Pression kPa(r)","Properties":"Propriétés","Pump":"Pompe","Pump / system curve":"Courbe pompe/réseau","Pump / system curve — select a pump, then press Pump / system curve.":"Courbe pompe/réseau — sélectionnez une pompe, puis appuyez sur Courbe pompe/réseau.","Pump H m":"Hauteur pompe m","Pump [m]":"Pompe [m]","Pump and system curve":"Courbe pompe et réseau","Pump discharge":"Refoulement de la pompe","Pump kW (hydraulic)":"Pompe kW (hydraulique)","Pump rated head must be below shutoff head; reverse flow and beyond-runout operation are extrapolations and are warned":"La hauteur nominale de la pompe doit être inférieure à la hauteur à débit nul ; le débit inverse et le fonctionnement au-delà du point nul sont des extrapolations et sont signalés","Pump, two branches, coil and control valve — the shipped example":"Pompe, deux branches, batterie et vanne de régulation — l'exemple fourni","Pump/system curve":"Courbe pompe/réseau","Pump:":"Pompe :","Pump:  H = H0 s^2 - a q|q|,  a = (H0 - H_rated)/q_rated^2,  s = local speed x global speed factor":"Pompe : H = H0 s^2 - a q|q|, a = (H0 - H_rated)/q_rated^2, s = vitesse locale x facteur de vitesse global","Pumps":"Pompes","Results":"Résultats","Return header":"Collecteur de retour","Roughness rank corr.":"Corrélation de rang de la rugosité","Roughness σ (lognormal)":"Rugosité σ (lognormale)","Run an N-1 screen, a Monte-Carlo or a load profile. Each one solves the network many times; the pump / system curve above is now the same kind of sweep.":"Exécutez une analyse N-1, un Monte-Carlo ou un profil de charge. Chacun résout le réseau de nombreuses fois ; la courbe pompe/réseau ci-dessus est désormais le même type de balayage.","Save network JSON":"Enregistrer le JSON du réseau","Save network JSON writes the drawing, the components and the fluid as a versioned document; Open network JSON reads one back, validating every field before it touches the canvas. This is the network, not the calculation: the shared bar below carries the calculation record as JSON, CSV, a PDF report and a python script, and Copy link puts the whole network in a permalink.":"«Enregistrer le JSON du réseau» écrit le dessin, les composants et le fluide sous forme de document versionné ; «Ouvrir le JSON du réseau» en relit un, en validant chaque champ avant qu'il ne touche le canevas. C'est le réseau, pas le calcul : la barre partagée ci-dessous porte l'enregistrement du calcul sous forme de JSON, CSV, un rapport PDF et un script python, et «Copier le lien» place tout le réseau dans un lien permanent.","Select a node or a component on the drawing to edit it.":"Sélectionnez un nœud ou un composant sur le dessin pour le modifier.","Select a pump first":"Sélectionnez d'abord une pompe","Select moves and selects. Node places a node on empty canvas. Pipe, Pump, Valve and Heat exchanger each need two clicks: the start node, then the end node. The arrow drawn on a component is its positive direction — a negative solved flow means the fluid runs the other way. Delete removes the selected element, and every edit can be undone from the header.":"«Sélectionner» déplace et sélectionne. «Nœud» place un nœud sur un canevas vide. Conduite, Pompe, Vanne et Échangeur nécessitent chacun deux clics : le nœud de départ, puis le nœud d'arrivée. La flèche dessinée sur un composant est sa direction positive — un débit calculé négatif signifie que le fluide circule dans l'autre sens. «Supprimer» retire l'élément sélectionné, et chaque modification peut être annulée depuis l'en-tête.","Selected:":"Sélectionné :","Set target flow on at least one valve":"Définissez un débit cible sur au moins une vanne","Shutoff head H₀":"Hauteur à débit nul H₀","Solve failed":"Échec de la résolution","Solved in":"Résolu en","Solved simultaneously for all edge flows and free-node heads by a damped Newton method with a numerical Jacobian":"Résolu simultanément pour tous les débits d'arête et les hauteurs des nœuds libres par une méthode de Newton amortie avec un jacobien numérique","Solver diverged. Check component data.":"Le solveur a divergé. Vérifiez les données des composants.","Speed m/s":"Vitesse m/s","Static Δp a−b kPa":"Δp statique a−b kPa","Steady state, incompressible, single phase; constant density and viscosity":"Régime permanent, incompressible, monophasique ; masse volumique et viscosité constantes","Steady-state incompressible networks · ensemble sweeps on the shared compute runtime":"Réseaux stationnaires incompressibles · balayages d'ensemble sur le moteur de calcul partagé","Steady-state, incompressible and single-phase. Fluid properties are constant. Heat exchangers are hydraulic resistances only. Pump curves use shutoff head plus one rated point; reverse flow and operation beyond zero-head runout are extrapolations and are warned. Automatic balancing is an iterative valve-opening heuristic and cannot guarantee coupled or infeasible targets. In meshed networks the HGL plot shows one representative flow-following return path (or a labelled topological fallback), not every path; HGL excludes velocity head. Junction/fitting losses must be entered through K. The dense browser solver refuses models above 600 nonlinear unknowns. No water hammer, NPSH/cavitation, efficiency map or transient control model is included.":"Régime permanent, incompressible et monophasique. Les propriétés du fluide sont constantes. Les échangeurs sont uniquement des résistances hydrauliques. Les courbes de pompe utilisent la hauteur à débit nul plus un point nominal ; le débit inverse et le fonctionnement au-delà du point nul sont des extrapolations et sont signalés. L'équilibrage automatique est une heuristique itérative d'ouverture de vanne et ne peut garantir des cibles couplées ou infaisables. Dans les réseaux maillés, le tracé de la ligne piézométrique montre un chemin de retour représentatif suivant le débit (ou un chemin de secours topologique étiqueté), pas tous les chemins ; la ligne piézométrique exclut la hauteur cinétique. Les pertes de jonction/raccord doivent être saisies via K. Le solveur dense du navigateur refuse les modèles au-delà de 600 inconnues non linéaires. Aucun coup de bélier, NPSH/cavitation, courbe de rendement ou modèle de régulation transitoire n'est inclus.","Supply header":"Collecteur d'alimentation","Swamee-Jain is published for 1e-6 <= eps/D <= 1e-2 and 5e3 <= Re <= 1e8; it differs from the Colebrook root by up to about 3 % over that range":"Swamee-Jain est publié pour 1e-6 <= eps/D <= 1e-2 et 5e3 <= Re <= 1e8 ; il diffère de la racine de Colebrook jusqu'à environ 3% sur cette plage","System curve requires positive solved flow through the selected pump.":"La courbe du réseau nécessite un débit calculé positif à travers la pompe sélectionnée.","The N-1 screen closes pipes and valves one at a time; this network has neither.":"L'analyse N-1 ferme les conduites et les vannes une à la fois ; ce réseau n'a ni l'un ni l'autre.","The ensemble sweep results also recorded here — pump/system curve, N-1 screen, Monte-Carlo quantiles, load-profile energy — are NOT reproduced: each is tens to thousands of further solves, and the Monte-Carlo additionally rests on the shared runtime’s Latin-hypercube design, its rank-correlation transform and its DDSketch quantile tallies, none of which this single file carries.":"Les résultats de balayage d'ensemble également enregistrés ici — courbe pompe/réseau, analyse N-1, quantiles Monte-Carlo, énergie du profil de charge — ne sont PAS reproduits : chacun représente des dizaines à des milliers de résolutions supplémentaires, et Monte-Carlo repose en outre sur le plan d'hypercube latin du moteur partagé, sa transformation de corrélation de rang et ses relevés de quantiles DDSketch, dont ce seul fichier ne porte rien.","The head along one return path from the pump discharge back to its suction, drawn against the elevation profile. In a meshed network there are many such paths; the plot shows one flow-following path, or a labelled topological fallback when no continuous flow-following path exists. It excludes velocity head.":"La hauteur le long d'un chemin de retour du refoulement de la pompe vers son aspiration, tracée par rapport au profil d'altitude. Dans un réseau maillé, il existe de nombreux chemins de ce type ; le tracé montre un chemin suivant le débit, ou un chemin de secours topologique étiqueté lorsqu'aucun chemin continu suivant le débit n'existe. La hauteur cinétique est exclue.","The hourly profile needs exactly 24 finite, non-negative multipliers.":"Le profil horaire nécessite exactement 24 multiplicateurs finis et non négatifs.","The load profile reports pump energy; this network has no pump.":"Le profil de charge indique l'énergie de la pompe ; ce réseau n'a pas de pompe.","The metric Kv relation, dp[bar] = SG (q[m³/h] / Kv_eff)². Kv_eff is Kv × opening for a linear characteristic and Kv × 50^(opening−1) for equal percentage. The balance target is the flow the auto-balance heuristic tries to reach at 100 % load by closing the valve; rated Kv is never changed.":"La relation métrique de Kv, dp[bar] = SG (q[m³/h] / Kv_eff)². Kv_eff est Kv × ouverture pour une caractéristique linéaire et Kv × 50^(ouverture−1) pour un pourcentage égal. La cible d'équilibrage est le débit que l'heuristique d'équilibrage automatique tente d'atteindre à 100% de charge en fermant la vanne ; le Kv nominal n'est jamais modifié.","The network changed while the sweep was running. Solve it again, then redraw the curve.":"Le réseau a changé pendant l'exécution du balayage. Résolvez-le à nouveau, puis retracez la courbe.","The shared interface layer (diagram-ui.js) did not load. Every input, the solver, the drawing, the sweeps and every export still work; the page falls back to one plain column.":"La couche d'interface partagée (diagram-ui.js) ne s'est pas chargée. Chaque entrée, le solveur, le dessin, les balayages et chaque export fonctionnent toujours ; la page revient à une seule colonne simple.","Topological fallback path coordinate":"Coordonnée du chemin de secours topologique","Unsupported hydraulic-network schema version":"Version de schéma de réseau hydraulique non prise en charge","Valve":"Vanne","Valve opening 0.1 % to 100 %":"Ouverture de vanne 0,1% à 100%","Valve:":"Vanne :","Valve:  dp[bar] = SG (q[m3/h] / Kv_eff)^2,  Kv_eff = Kv * o (linear) or Kv * 50^(o-1) (equal percentage), o = opening/100":"Vanne : dp[bar] = SG (q[m3/h] / Kv_eff)^2, Kv_eff = Kv * o (linéaire) ou Kv * 50^(o-1) (pourcentage égal), o = ouverture/100","Valves":"Vannes","With a pump selected, the network is re-solved 33 times with that pump forced to a series of flows. The system curve is the head the network demands at each flow; the pump curve is what the pump delivers; they cross at the operating point. Every point is solved cold, so the curve does not depend on the order the points were computed in.":"Avec une pompe sélectionnée, le réseau est résolu à nouveau 33 fois avec cette pompe forcée à une série de débits. La courbe du réseau est la hauteur que le réseau exige à chaque débit ; la courbe de la pompe est ce que la pompe fournit ; elles se croisent au point de fonctionnement. Chaque point est résolu à froid, donc la courbe ne dépend pas de l'ordre dans lequel les points ont été calculés.","at node":"au nœud","diagram-compute.classic.js did not load; sweeps run on the main thread and the Monte-Carlo sweep is unavailable because its Latin-hypercube design and quantile tallies live in the runtime":"diagram-compute.classic.js ne s'est pas chargé ; les balayages s'exécutent sur le thread principal et le balayage Monte-Carlo est indisponible car son plan d'hypercube latin et ses relevés de quantiles vivent dans le moteur","every case was evaluated in index order on one thread, with no shared warm start":"chaque cas a été évalué dans l'ordre des indices sur un seul thread, sans démarrage à chaud partagé","hL signed m":"hL signé m","iterations; scaled residual":"itérations ; résidu mis à l'échelle","kPa (gauge)":"kPa (relatif)","kW (hydraulic)":"kW (hydraulique)","kWh (hydraulic, rho g Q H; no pump or motor efficiency)":"kWh (hydraulique, rho g Q H ; aucun rendement de pompe ou de moteur)","metric Kv relation, with optional opening law.":"relation métrique de Kv, avec loi d'ouverture optionnelle.","p [kPa g]":"p [kPa r]","pump affinity scaling":"mise à l'échelle par similitude de la pompe","pump discharge":"refoulement de la pompe","pump rated point":"point nominal de la pompe","pump suction":"aspiration de la pompe","quadratic H(Q) from shutoff head and one rated point, scaled by affinity law speed².":"H(Q) quadratique à partir de la hauteur à débit nul et d'un point nominal, mise à l'échelle par la loi de similitude vitesse².","select a pump":"sélectionner une pompe","selected pump loop":"boucle de pompe sélectionnée","signed reverse passive loss":"perte passive inverse signée","the complete steady-state network solve of this page for the network currently on the canvas: the same continuity and energy equations, the same pipe/valve/heat-exchanger/pump component laws, and the same damped Newton iteration on scaled residuals. Charts, auto-balancing and the HGL path search are not part of the export.":"la résolution complète en régime permanent du réseau de cette page pour le réseau actuellement sur le canevas : les mêmes équations de continuité et d'énergie, les mêmes lois de composants conduite/vanne/échangeur/pompe, et la même itération de Newton amortie sur les résidus mis à l'échelle. Les graphiques, l'équilibrage automatique et la recherche de chemin de la ligne piézométrique ne font pas partie de l'export.","unrecognised hydraulic-network state payload":"données d'état de réseau hydraulique non reconnues","v2 build: the steady-state solve recorded above is the v1 tool’s solver unchanged — same residual assembly, same central-difference Jacobian, same dense Gauss-Jordan with partial pivoting, same damped Newton line search. What this build adds is repeated solves (pump/system curve, N-1 screen, Monte-Carlo, load profile) on the shared compute runtime diagram-compute.classic.js.":"version v2 : la résolution en régime permanent enregistrée ci-dessus est le solveur inchangé de l'outil v1 — même assemblage de résidus, même jacobien par différences centrées, même méthode de Gauss-Jordan dense à pivotage partiel, même recherche linéaire de Newton amortie. Ce que cette version ajoute, ce sont des résolutions répétées (courbe pompe/réseau, analyse N-1, Monte-Carlo, profil de charge) sur le moteur de calcul partagé diagram-compute.classic.js.","↖ Select":"↖ Sélectionner","━ Elevation":"━ Altitude","━ Pipe":"━ Conduite","▶ Pump":"▶ Pompe","◇ Valve":"◇ Vanne","● Node":"● Nœud","Hydraulic Network Solver":"Solveur de réseau hydraulique","Draw an arbitrary network of pipes, nodes, pumps, valves and heat exchangers and solve the steady-state flows and pressures.":"Dessinez un réseau arbitraire de conduites, nœuds, pompes, vannes et échangeurs puis calculez les débits et pressions en régime permanent.","Draw an arbitrary network of pipes, nodes, pumps, valves and heat exchangers and solve the steady-state flows and pressures. Includes Darcy–Weisbach pipe losses, pump and system curves, hydraulic grade line, valve balancing, partial-load scaling, and JSON/CSV import-export.":"Dessinez un réseau arbitraire de conduites, nœuds, pompes, vannes et échangeurs puis calculez les débits et pressions en régime permanent. Inclut Darcy–Weisbach, courbes pompe/réseau, ligne piézométrique, équilibrage des vannes, charge partielle et import-export JSON/CSV.","Steady solve:":"Calcul stationnaire :","backend:":"backend :","idle":"inactif","repeatable":"reproductible","solved":"résolu","free":"libre","pipe":"conduite","pump":"pompe","valve":"vanne","hx":"échangeur","━ System":"━ Réseau","━ HGL":"━ Ligne piézométrique","Hydraulic Network Solver (v2)":"Solveur de réseau hydraulique (v2)","Pump and motor efficiency are not modelled, so this is not shaft or electrical energy.":"Les rendements de la pompe et du moteur ne sont pas modélisés : ce n’est donc ni l’énergie à l’arbre ni l’énergie électrique.","HGL m":"HGL m","HGL":"HGL","p P5 kPa(g)":"p P5 kPa(r)"};
const siteLang=()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q&&String(q).slice(0,2).toLowerCase()==='fr')return'fr'}catch(e){}try{if(localStorage.getItem('diagram_site_lang')==='fr'||localStorage.getItem('diagram_lang')==='fr')return'fr'}catch(e){}return String(window.__diagramLang||'').slice(0,2).toLowerCase()};

function tr(s){if(s==null)return s;const x=String(s);if(Object.prototype.hasOwnProperty.call(FR,x))return FR[x];const a=x.match(/^\s*/)[0],b=x.match(/\s*$/)[0],t=x.trim();if(Object.prototype.hasOwnProperty.call(FR,t))return a+FR[t]+b;const pz=t&&window.__hnPatterns?window.__hnPatterns.translate('fr',t,FR):null;if(pz!=null)return a+pz+b;const lw=window.DiagramUI&&DiagramUI.current&&typeof DiagramUI.current.t==='function'?DiagramUI.current.t('learn'):null;if(lw&&t.indexOf(lw+': ')===0){const k=t.slice(lw.length+2);if(Object.prototype.hasOwnProperty.call(FR,k))return a+lw+': '+FR[k]+b}return x}
function node(n){if(!n)return;if(n.nodeType===3){const p=n.parentElement;if(p&&!/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(p.tagName)){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}return}if(n.nodeType!==1)return;if(/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(n.tagName))return;for(const a of attrs)if(n.hasAttribute(a)){const v=n.getAttribute(a),w=tr(v);if(w!==v)n.setAttribute(a,w)}if(n.tagName==='INPUT'&&/^(button|submit|reset)$/i.test(n.type||'')){const v=n.value,w=tr(v);if(w!==v)n.value=w}const tw=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let q;while(q=tw.nextNode())node(q);for(const e of n.querySelectorAll('*'))for(const a of attrs)if(e.hasAttribute(a)){const v=e.getAttribute(a),w=tr(v);if(w!==v)e.setAttribute(a,w)}}
const run=()=>{node(document.body);const tt=document.querySelector('title');if(tt)node(tt)};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')node(m.target);else if(m.type==='attributes'){const el=m.target,v=el.getAttribute(m.attributeName),w=tr(v);if(v!=null&&w!==v)el.setAttribute(m.attributeName,w)}else for(const n of m.addedNodes)node(n)}}).observe(document.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:attrs});
})();
