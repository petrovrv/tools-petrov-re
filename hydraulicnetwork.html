<script type="application/json" id="diagram-tool-manifest">{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision":"2026-10-16.hydraulicnetwork-4","id":"hydraulicnetwork","file":"hydraulicnetwork.html","listed":true,"category":"control","order":27,"title":{"en":"Hydraulic Network Solver","uk":"Розрахунок гідравлічних мереж","de":"Hydraulischer Netzberechner","nl":"Hydraulisch netwerkberekenaar","fr":"Solveur de réseau hydraulique","es":"Solucionador de redes hidráulicas","pl":"Solver sieci hydraulicznej"},"summary":{"en":"Draw an arbitrary network of pipes, nodes, pumps, valves and heat exchangers and solve the steady-state flows and pressures.","uk":"Намалюйте довільну мережу з труб, вузлів, насосів, клапанів і теплообмінників та розрахуйте усталені витрати й тиски.","de":"Beliebige Netze aus Rohren, Knoten, Pumpen, Ventilen und Wärmetauschern zeichnen und stationäre Volumenströme und Drücke berechnen.","nl":"Teken een willekeurig netwerk van leidingen, knopen, pompen, kleppen en warmtewisselaars en bereken stationaire debieten en drukken.","fr":"Dessinez un réseau arbitraire de conduites, nœuds, pompes, vannes et échangeurs puis calculez les débits et pressions en régime permanent.","es":"Dibuje una red arbitraria de tuberías, nodos, bombas, válvulas e intercambiadores y calcule caudales y presiones en régimen estacionario.","pl":"Narysuj dowolną sieć rur, węzłów, pomp, zaworów i wymienników ciepła, a następnie rozwiąż równania dotyczące ustalonych przepływów i ciśnień."},"description":{"en":"Draw an arbitrary network of pipes, nodes, pumps, valves and heat exchangers and solve the steady-state flows and pressures. Includes Darcy–Weisbach pipe losses, pump and system curves, hydraulic grade line, valve balancing, partial-load scaling, and JSON/CSV import-export.","uk":"Намалюйте довільну мережу з труб, вузлів, насосів, клапанів і теплообмінників та розрахуйте усталені витрати й тиски. Є втрати Darcy–Weisbach, криві насоса й системи, гідравлічна лінія, балансування клапанів, часткове навантаження та імпорт-експорт JSON/CSV.","de":"Beliebige Netze aus Rohren, Knoten, Pumpen, Ventilen und Wärmetauschern zeichnen und stationäre Volumenströme und Drücke berechnen. Mit Darcy–Weisbach, Pumpen- und Anlagenkennlinie, hydraulischer Gradlinie, Ventilabgleich, Teillastskalierung sowie JSON/CSV-Import und -Export.","nl":"Teken een willekeurig netwerk van leidingen, knopen, pompen, kleppen en warmtewisselaars en bereken stationaire debieten en drukken. Met Darcy–Weisbach, pomp- en systeemcurve, hydraulische gradiëntlijn, klepbalancering, deellastschaling en JSON/CSV-import en -export.","fr":"Dessinez un réseau arbitraire de conduites, nœuds, pompes, vannes et échangeurs puis calculez les débits et pressions en régime permanent. Inclut Darcy–Weisbach, courbes pompe/réseau, ligne piézométrique, équilibrage des vannes, charge partielle et import-export JSON/CSV.","es":"Dibuje una red arbitraria de tuberías, nodos, bombas, válvulas e intercambiadores y calcule caudales y presiones en régimen estacionario. Incluye Darcy–Weisbach, curvas de bomba y sistema, línea piezométrica, equilibrado de válvulas, carga parcial e importación/exportación JSON/CSV.","pl":"Narysuj dowolną sieć rur, węzłów, pomp, zaworów i wymienników ciepła oraz oblicz ustalone przepływy i ciśnienia. Obejmuje to straty Darcy'ego-Weisbacha w rurach, krzywe pomp i układów, niwelety hydrauliczne, równoważenie zaworów, skalowanie obciążenia częściowego oraz import i eksport plików JSON/CSV."},"status":"benchmarked","independent_validation":false,"limitations":{"en":"Steady-state, incompressible, single-phase hydraulic network model. Fluid density and kinematic viscosity are constant user inputs. Pipes use Darcy–Weisbach with laminar and Swamee–Jain friction correlations; junction, fitting and equipment losses not represented explicitly must be entered through the minor-loss K value. Heat exchangers contribute hydraulic pressure drop only; heat duty and temperature propagation are not modelled. Pump curves are fitted from shutoff head and one rated point; efficiency, shaft power, NPSH/cavitation, check-valve or four-quadrant behaviour, and automatic pump sequencing are not modelled. Reverse-flow and runout pump operation are extrapolations outside the fitted operating range. Valve laws are idealized linear or equal-percentage characteristics, not manufacturer curves. Partial load scales nodal demands and valve balance targets; it does not infer a thermal control strategy. For the system-curve sweep, nodal demands are rescaled with swept pump flow. HGL excludes velocity head. The dense Newton solver is intended for engineering schematics of moderate size, not utility-scale networks. Water hammer and other transient effects are not modelled. Automatic valve balancing is an iterative heuristic on valve opening; coupled or infeasible flow targets may stop at travel limits or fail to converge and are reported rather than guaranteed. In meshed networks the HGL plot shows one representative flow-following return path for the selected pump, with a clearly labelled topological fallback if no continuous flow-directed return path exists; it is not a plot of every branch. The browser dense Newton solver refuses models above 600 nonlinear unknowns. Swamee–Jain is an explicit approximation to Colebrook–White, published for 1e-6 ≤ ε/D ≤ 1e-2 and 5e3 ≤ Re ≤ 1e8; over that range it differs from the Colebrook root by up to about 3 % in the friction factor, and by more outside it. The 2000<Re<4000 blend is a numerical bridge, not a resolved transition model; pipes running outside the published range are listed as a warning after each solve. Valve openings below 0.1 % are refused rather than clamped, because the Kv model is not defined there. Additions in this build: the steady-state solver is unchanged, so the numbers of a single solve are the v1 numbers. The added sweeps are new and carry no benchmark of any kind. Every sweep case is solved cold — no warm start from a neighbouring case — so results do not depend on how the cases were distributed over workers; that also means the sweeps are slower per case than a warm-started march would be. The N-1 screen removes one component at a time and reports the contingency as infeasible, with the reason, when the reduced network isolates a node or leaves a component without a pressure boundary; it does not model isolation valves, check valves or operator response. The Monte-Carlo samples one lognormal multiplier per pipe roughness and one normal multiplier per non-zero nodal demand, with a user-set rank correlation inside each group and none between the groups; those distributions are user assumptions, not measured data, and the quantiles are DDSketch estimates with a stated relative-accuracy bound rather than exact order statistics. The load profile scales nodal demands by a user-supplied 24-hour multiplier list (optionally modulated by a seasonal cosine over 8760 h) and reports hydraulic pump energy rho*g*Q*H integrated over the period: pump and motor efficiency are not modelled, so this is not shaft or electrical energy. Sweeps run in Workers when the browser provides them and on the main thread otherwise; the tool states which backend computed the result.","uk":"Стаціонарна однофазна модель мережі для нестисливої рідини. Густина та кінематична в’язкість задаються користувачем як сталі. Для труб використано Darcy–Weisbach із ламінарною та Swamee–Jain кореляціями тертя; втрати у вузлах, фасонних частинах та обладнанні, не подані окремими елементами, треба задавати через коефіцієнт місцевих втрат K. Теплообмінники враховують лише гідравлічний перепад тиску; теплова потужність і поширення температури не моделюються. Криву насоса апроксимовано за напором при нульовій витраті та однією номінальною точкою; ККД, потужність на валу, NPSH/кавітація, зворотний клапан або чотириквадрантна характеристика та автоматичне каскадування насосів не моделюються. Робота насоса зі зворотним потоком і за межами вибігу є екстраполяцією поза діапазоном апроксимації. Закони клапанів — ідеалізовані лінійний або рівнопроцентний, а не характеристики виробника. Часткове навантаження масштабує вузлові витрати та цілі балансування клапанів, але не визначає теплову стратегію регулювання. Під час побудови характеристики системи вузлові витрати масштабуються разом із перебраною витратою насоса. HGL не містить швидкісного напору. Щільний Newton-розв’язувач призначений для інженерних схем помірного розміру, а не для мереж комунального масштабу. Гідроудар та інші перехідні процеси не моделюються. Автоматичне балансування клапанів є ітераційною евристикою за ступенем відкриття; взаємопов’язані або недосяжні цільові витрати можуть упертися в межі ходу чи не зійтися, про що повідомляється без гарантії результату. У сітчастих мережах графік HGL показує один репрезентативний зворотний шлях за фактичним напрямком потоку для вибраного насоса; якщо безперервного такого шляху немає, явно позначається топологічний запасний шлях. Це не графік усіх гілок. Браузерний щільний Newton-розв’язувач відмовляється розв’язувати моделі з понад 600 нелінійними невідомими. Swamee–Jain — явна апроксимація Colebrook–White, опублікована для 1e-6 ≤ ε/D ≤ 1e-2 та 5e3 ≤ Re ≤ 1e8; у цьому діапазоні коефіцієнт тертя відрізняється від кореня Colebrook приблизно до 3 %, а поза ним — більше. Перехід 2000<Re<4000 є числовим містком, а не розв’язаною моделлю переходу; труби поза опублікованим діапазоном перелічуються у попередженні після кожного розрахунку. Відкриття клапана нижче 0,1 % відхиляється, а не обрізається, бо модель Kv там не визначена. Доповнення цієї збірки: розв'язувач усталеного режиму не змінено, тож числа одиничного розрахунку — це числа v1. Додані свипи є новими й не мають жодного бенчмарку. Кожен випадок свипу розв'язується «з холодного старту» — без теплого старту від сусіднього випадку, — тому результати не залежать від розподілу випадків по воркерах; водночас це робить кожен випадок повільнішим, ніж теплий марш. Екран N-1 вилучає по одному компоненту й повідомляє про непрацездатність із зазначенням причини, коли скорочена мережа ізолює вузол або залишає компоненту без граничного тиску; запірна арматура, зворотні клапани та дії оператора не моделюються. Монте-Карло розігрує один логнормальний множник на шорсткість кожної труби та один нормальний множник на кожну ненульову вузлову витрату, з рангово-кореляційним зв'язком усередині кожної групи (задає користувач) і без кореляції між групами; ці розподіли — припущення користувача, а не виміряні дані, а квантилі є оцінками DDSketch із заявленою відносною похибкою, а не точними порядковими статистиками. Профіль навантаження масштабує вузлові витрати заданим користувачем списком із 24 множників (за потреби модульованим сезонним косинусом на 8760 год) і подає гідравлічну енергію насоса rho*g*Q*H за період: ККД насоса й двигуна не моделюються, тож це не енергія на валу й не електрична енергія. Свипи виконуються у воркерах, якщо браузер їх надає, інакше в головному потоці; тул повідомляє, який бекенд порахував результат.","de":"Stationäres, inkompressibles, einphasiges hydraulisches Netzmodell. Dichte und kinematische Viskosität sind konstante Benutzereingaben. Rohrleitungen werden mit Darcy–Weisbach sowie laminarer und Swamee–Jain-Reibung berechnet; Verluste an Abzweigen, Formstücken und Geräten, die nicht als eigene Elemente abgebildet sind, müssen über den Einzelverlustbeiwert K eingegeben werden. Wärmetauscher liefern nur den hydraulischen Druckverlust; Wärmeleistung und Temperaturfortpflanzung werden nicht modelliert. Pumpenkennlinien werden aus der Sperrhöhe und einem Nennpunkt angepasst; Wirkungsgrad, Wellenleistung, NPSH/Kavitation, Rückschlagventil- bzw. Vierquadrantenverhalten und automatische Pumpenstaffelung werden nicht modelliert. Rückströmung und Auslaufbetrieb der Pumpe sind Extrapolationen außerhalb des angepassten Bereichs. Ventilkennlinien sind idealisierte lineare oder gleichprozentige Gesetze, keine Herstellerkennlinien. Teillast skaliert Knotenentnahmen und Ventil-Abgleichsziele, leitet jedoch keine thermische Regelstrategie ab. Beim Anlagenkennlinien-Sweep werden Knotenentnahmen mit dem variierten Pumpenvolumenstrom skaliert. Die HGL enthält keine Geschwindigkeitshöhe. Der dichte Newton-Löser ist für technische Schemata mittlerer Größe vorgesehen, nicht für Versorgungsnetze. Druckstoß und andere instationäre Vorgänge werden nicht modelliert. Der automatische Ventilabgleich ist ein iteratives heuristisches Verfahren über die Ventilöffnung; gekoppelte oder unerreichbare Sollvolumenströme können an Stellgrenzen enden oder nicht konvergieren und werden dann gemeldet, nicht garantiert. In vermaschten Netzen zeigt die HGL-Darstellung einen repräsentativen, der tatsächlichen Strömungsrichtung folgenden Rückweg der gewählten Pumpe; existiert kein durchgehender strömungsgerichteter Rückweg, wird ein topologischer Ersatzweg eindeutig gekennzeichnet. Sie stellt nicht alle Zweige dar. Der dichte Newton-Löser im Browser verweigert Modelle mit mehr als 600 nichtlinearen Unbekannten. Swamee–Jain ist eine explizite Näherung an Colebrook–White, veröffentlicht für 1e-6 ≤ ε/D ≤ 1e-2 und 5e3 ≤ Re ≤ 1e8; in diesem Bereich weicht der Reibungsbeiwert um bis zu etwa 3 % von der Colebrook-Wurzel ab, außerhalb stärker. Der Übergang 2000<Re<4000 ist eine numerische Brücke, kein aufgelöstes Transitionsmodell; Rohre außerhalb des veröffentlichten Bereichs werden nach jeder Berechnung als Warnung aufgelistet. Ventilöffnungen unter 0,1 % werden abgelehnt statt begrenzt, da das Kv-Modell dort nicht definiert ist. Ergänzungen in diesem Build: Der stationäre Löser ist unverändert, die Zahlen einer Einzelberechnung sind also die v1-Zahlen. Die neuen Sweeps sind neu und haben überhaupt keinen Benchmark. Jeder Sweep-Fall wird kalt gelöst — kein Warmstart aus einem Nachbarfall —, damit die Ergebnisse nicht davon abhängen, wie die Fälle auf Worker verteilt wurden; das macht jeden Fall zugleich langsamer als ein warm gestarteter Durchlauf. Das N-1-Screening entfernt jeweils ein Bauteil und meldet die Störung mit Begründung als nicht rechenbar, wenn das reduzierte Netz einen Knoten isoliert oder eine Komponente ohne Druckrandbedingung zurücklässt; Absperr- und Rückschlagarmaturen sowie Bedienereingriffe werden nicht modelliert. Das Monte-Carlo zieht je Rohrrauheit einen lognormalen und je von Null verschiedenem Knotenbedarf einen normalen Multiplikator, mit benutzerdefinierter Rangkorrelation innerhalb jeder Gruppe und keiner zwischen den Gruppen; diese Verteilungen sind Annahmen des Nutzers, keine Messdaten, und die Quantile sind DDSketch-Schätzungen mit angegebener relativer Genauigkeitsschranke, keine exakten Ordnungsstatistiken. Das Lastprofil skaliert die Knotenbedarfe mit einer vom Nutzer angegebenen 24-Stunden-Multiplikatorliste (über 8760 h optional durch einen saisonalen Kosinus moduliert) und meldet die hydraulische Pumpenenergie rho*g*Q*H über den Zeitraum: Pumpen- und Motorwirkungsgrad werden nicht modelliert, es ist also weder Wellen- noch elektrische Energie. Sweeps laufen in Workern, wenn der Browser sie bereitstellt, sonst im Hauptthread; das Werkzeug nennt das tatsächlich verwendete Backend.","nl":"Stationair, incompressibel, éénfasig hydraulisch netwerkmodel. Dichtheid en kinematische viscositeit zijn constante gebruikersinvoer. Leidingen worden berekend met Darcy–Weisbach en laminaire/Swamee–Jain-wrijvingscorrelaties; verliezen in aftakkingen, hulpstukken en apparatuur die niet als afzonderlijk element zijn gemodelleerd moeten via de lokale-verliescoëfficiënt K worden ingevoerd. Warmtewisselaars leveren alleen hydraulisch drukverlies; thermisch vermogen en temperatuurvoortplanting worden niet gemodelleerd. Pompcurven worden aangepast uit de opvoerhoogte bij nuldebiet en één nominaal punt; rendement, asvermogen, NPSH/cavitatie, terugslagklep- of vierkwadrantgedrag en automatische pompcascadering worden niet gemodelleerd. Omgekeerde stroming en uitloopbedrijf van de pomp zijn extrapolaties buiten het aangepaste bereik. Klepkarakteristieken zijn geïdealiseerde lineaire of equiprocentuele wetten, geen fabrikantcurven. Deellast schaalt knoopdebieten en doelen voor klepbalancering, maar leidt geen thermische regelstrategie af. Bij de systeemcurve-sweep worden knoopdebieten meegeschaald met het gevarieerde pompdebiet. De HGL bevat geen snelheidshoogte. De dichte Newton-oplosser is bedoeld voor technische schema’s van beperkte omvang, niet voor nutsnetwerken. Waterslag en andere transiënte effecten worden niet gemodelleerd. Automatische klepbalancering is een iteratieve heuristiek op de klepopening; gekoppelde of onhaalbare debietdoelen kunnen op de slaggrens eindigen of niet convergeren en worden dan gemeld, niet gegarandeerd. In vermaasde netwerken toont de HGL-grafiek één representatief retourpad dat de werkelijke stromingsrichting van de geselecteerde pomp volgt; als geen doorlopend stromingsgericht retourpad bestaat, wordt een topologisch terugvalpad duidelijk gemarkeerd. Het is geen weergave van alle takken. De dichte Newton-oplosser in de browser weigert modellen met meer dan 600 niet-lineaire onbekenden. Swamee–Jain is een expliciete benadering van Colebrook–White, gepubliceerd voor 1e-6 ≤ ε/D ≤ 1e-2 en 5e3 ≤ Re ≤ 1e8; binnen dat bereik wijkt de wrijvingsfactor tot ongeveer 3 % af van de Colebrook-wortel, daarbuiten meer. De overgang 2000<Re<4000 is een numerieke brug, geen opgelost transitiemodel; leidingen buiten het gepubliceerde bereik worden na elke berekening als waarschuwing vermeld. Klepstanden onder 0,1 % worden geweigerd in plaats van afgekapt, omdat het Kv-model daar niet gedefinieerd is. Toevoegingen in deze build: de stationaire oplosser is ongewijzigd, dus de getallen van één berekening zijn de v1-getallen. De toegevoegde sweeps zijn nieuw en hebben geen enkele benchmark. Elk sweep-geval wordt koud opgelost — geen warme start vanuit een naburig geval — zodat de resultaten niet afhangen van de verdeling van de gevallen over workers; daardoor is elk geval ook trager dan een warm gestarte mars. De N-1-screening verwijdert telkens één component en meldt de storing met reden als onberekenbaar wanneer het gereduceerde net een knoop isoleert of een component zonder drukrandvoorwaarde achterlaat; afsluiters, terugslagkleppen en bedienershandelingen worden niet gemodelleerd. De Monte-Carlo trekt één lognormale vermenigvuldiger per leidingruwheid en één normale per knooppuntvraag ongelijk aan nul, met een door de gebruiker ingestelde rangcorrelatie binnen elke groep en geen tussen de groepen; die verdelingen zijn aannames van de gebruiker, geen meetgegevens, en de kwantielen zijn DDSketch-schattingen met een opgegeven relatieve nauwkeurigheidsgrens, geen exacte ordestatistieken. Het belastingprofiel schaalt de knooppuntvraag met een door de gebruiker opgegeven lijst van 24 vermenigvuldigers (over 8760 u optioneel gemoduleerd met een seizoenscosinus) en rapporteert de hydraulische pompenergie rho*g*Q*H over de periode: pomp- en motorrendement worden niet gemodelleerd, dus dit is geen as- of elektrische energie. Sweeps draaien in workers als de browser die biedt en anders op de hoofdthread; het gereedschap vermeldt welke backend het resultaat berekend heeft.","fr":"Modèle hydraulique de réseau stationnaire, incompressible et monophasique. La masse volumique et la viscosité cinématique sont des entrées utilisateur constantes. Les conduites utilisent Darcy–Weisbach avec les corrélations de frottement laminaire et Swamee–Jain ; les pertes aux jonctions, raccords et équipements non représentés explicitement doivent être saisies via le coefficient de perte singulière K. Les échangeurs de chaleur n’apportent qu’une perte de charge hydraulique ; la puissance thermique et la propagation de température ne sont pas modélisées. Les courbes de pompe sont ajustées à partir de la hauteur à débit nul et d’un point nominal ; rendement, puissance à l’arbre, NPSH/cavitation, comportement de clapet ou à quatre quadrants et séquencement automatique des pompes ne sont pas modélisés. Le fonctionnement en débit inverse ou au-delà du débit de fuite est une extrapolation hors du domaine ajusté. Les lois de vannes sont des caractéristiques idéalisées linéaires ou égal-pourcentage, pas des courbes constructeur. La charge partielle met à l’échelle les soutirages nodaux et les objectifs d’équilibrage des vannes, sans déduire de stratégie de régulation thermique. Pour le balayage de la courbe système, les soutirages nodaux sont mis à l’échelle avec le débit de pompe balayé. La HGL exclut la hauteur de vitesse. Le solveur Newton à matrice dense vise des schémas d’ingénierie de taille modérée, pas les réseaux de distribution à grande échelle. Les coups de bélier et autres transitoires ne sont pas modélisés. L’équilibrage automatique des vannes est une heuristique itérative agissant sur l’ouverture; des débits cibles couplés ou irréalisables peuvent atteindre les limites de course ou ne pas converger, ce qui est signalé sans garantie de résultat. Dans un réseau maillé, le tracé HGL montre un seul trajet de retour représentatif suivant le sens d’écoulement réel pour la pompe sélectionnée; s’il n’existe pas de trajet continu dans le sens de l’écoulement, un trajet topologique de repli est explicitement indiqué. Il ne représente pas toutes les branches. Le solveur Newton dense du navigateur refuse les modèles dépassant 600 inconnues non linéaires. Swamee–Jain est une approximation explicite de Colebrook–White, publiée pour 1e-6 ≤ ε/D ≤ 1e-2 et 5e3 ≤ Re ≤ 1e8 ; sur ce domaine le coefficient de frottement s’écarte de la racine de Colebrook jusqu’à environ 3 %, et davantage en dehors. Le raccord 2000<Re<4000 est un pont numérique, pas un modèle de transition résolu ; les conduites hors du domaine publié sont listées en avertissement après chaque calcul. Les ouvertures de vanne inférieures à 0,1 % sont refusées plutôt que bornées, car le modèle Kv n’y est pas défini. Ajouts de ce build : le solveur permanent est inchangé, donc les nombres d'un calcul unique sont ceux de la v1. Les balayages ajoutés sont nouveaux et ne disposent d'aucun banc d'essai. Chaque cas de balayage est résolu à froid — sans démarrage à chaud depuis un cas voisin —, de sorte que les résultats ne dépendent pas de la répartition des cas sur les workers ; cela rend aussi chaque cas plus lent qu'une marche démarrée à chaud. Le criblage N-1 retire un composant à la fois et signale la contingence comme infaisable, avec la raison, lorsque le réseau réduit isole un nœud ou laisse une composante sans condition de pression ; vannes d'isolement, clapets anti-retour et actions d'exploitation ne sont pas modélisés. Le Monte-Carlo tire un multiplicateur lognormal par rugosité de conduite et un multiplicateur normal par demande nodale non nulle, avec une corrélation de rangs choisie par l'utilisateur à l'intérieur de chaque groupe et nulle entre les groupes ; ces lois sont des hypothèses de l'utilisateur, pas des mesures, et les quantiles sont des estimations DDSketch assorties d'une borne d'exactitude relative annoncée, non des statistiques d'ordre exactes. Le profil de charge met à l'échelle les demandes nodales par une liste de 24 multiplicateurs fournie par l'utilisateur (éventuellement modulée par un cosinus saisonnier sur 8760 h) et rapporte l'énergie hydraulique de pompage rho*g*Q*H intégrée sur la période : les rendements de pompe et de moteur ne sont pas modélisés, ce n'est donc ni une énergie à l'arbre ni une énergie électrique. Les balayages tournent dans des workers lorsque le navigateur en fournit, sinon sur le fil principal ; l'outil indique quel backend a calculé le résultat.","es":"Modelo hidráulico de red estacionario, incompresible y monofásico. La densidad y la viscosidad cinemática son entradas constantes del usuario. Las tuberías usan Darcy–Weisbach con correlaciones de fricción laminar y Swamee–Jain; las pérdidas en uniones, accesorios y equipos no representados explícitamente deben introducirse mediante el coeficiente de pérdida local K. Los intercambiadores de calor aportan únicamente pérdida de carga hidráulica; no se modelan la potencia térmica ni la propagación de temperatura. Las curvas de bomba se ajustan a partir de la altura a caudal nulo y un punto nominal; no se modelan el rendimiento, la potencia de eje, NPSH/cavitación, el comportamiento de válvula de retención o de cuatro cuadrantes ni la secuenciación automática de bombas. El funcionamiento con flujo inverso o más allá del caudal de escape es una extrapolación fuera del intervalo ajustado. Las leyes de válvula son características idealizadas lineales o isoporcentuales, no curvas de fabricante. La carga parcial escala las demandas nodales y los objetivos de equilibrado de válvulas, pero no deduce una estrategia térmica de control. En el barrido de la curva del sistema, las demandas nodales se reescalan con el caudal de bomba barrido. La HGL excluye la altura de velocidad. El solucionador Newton de matriz densa está pensado para esquemas de ingeniería de tamaño moderado, no para redes de servicios públicos. No se modelan el golpe de ariete ni otros efectos transitorios. El equilibrado automático de válvulas es una heurística iterativa sobre la apertura; los objetivos de caudal acoplados o inviables pueden alcanzar los límites de carrera o no converger y, en ese caso, se notifican sin garantizar el resultado. En redes malladas, la gráfica HGL muestra un único recorrido de retorno representativo que sigue el sentido real del flujo para la bomba seleccionada; si no existe un retorno continuo en el sentido del flujo, se indica claramente una ruta topológica alternativa. No representa todas las ramas. El solucionador Newton denso del navegador rechaza modelos con más de 600 incógnitas no lineales. Swamee–Jain es una aproximación explícita a Colebrook–White, publicada para 1e-6 ≤ ε/D ≤ 1e-2 y 5e3 ≤ Re ≤ 1e8; en ese rango el factor de fricción se desvía de la raíz de Colebrook hasta un 3 % aproximadamente, y más fuera de él. El puente 2000<Re<4000 es numérico, no un modelo de transición resuelto; las tuberías fuera del rango publicado se listan como advertencia tras cada cálculo. Las aperturas de válvula por debajo del 0,1 % se rechazan en lugar de recortarse, porque el modelo Kv no está definido allí. Añadidos de este build: el solucionador estacionario no ha cambiado, por lo que los números de un cálculo único son los de la v1. Los barridos añadidos son nuevos y no cuentan con ninguna referencia contrastada. Cada caso del barrido se resuelve en frío — sin arranque en caliente desde un caso vecino —, de modo que los resultados no dependen de cómo se repartieron los casos entre workers; eso también hace cada caso más lento que una marcha arrancada en caliente. El cribado N-1 retira un componente cada vez e informa la contingencia como inviable, con el motivo, cuando la red reducida aísla un nodo o deja una componente sin condición de contorno de presión; no se modelan válvulas de aislamiento, antirretorno ni la actuación del operador. El Monte-Carlo sortea un multiplicador lognormal por rugosidad de tubería y uno normal por cada demanda nodal no nula, con una correlación de rangos fijada por el usuario dentro de cada grupo y nula entre grupos; esas distribuciones son hipótesis del usuario, no datos medidos, y los cuantiles son estimaciones DDSketch con una cota de exactitud relativa declarada, no estadísticos de orden exactos. El perfil de carga escala las demandas nodales con una lista de 24 multiplicadores dada por el usuario (opcionalmente modulada por un coseno estacional en 8760 h) e informa la energía hidráulica de bombeo rho*g*Q*H integrada en el periodo: no se modelan los rendimientos de bomba y motor, así que no es energía en el eje ni eléctrica. Los barridos se ejecutan en workers cuando el navegador los ofrece y, si no, en el hilo principal; la herramienta indica qué backend calculó el resultado.","pl":"Model sieci hydraulicznej w stanie ustalonym, nieściśliwej, jednofazowej. Gęstość cieczy i lepkość kinematyczna są stałymi danymi wejściowymi użytkownika. Rurociągi wykorzystują równania Darcy'ego-Weisbacha z korelacjami tarcia laminarnego i Swamee-Jaina; straty na złączach, armaturze i sprzęcie, które nie są wyraźnie przedstawione, należy wprowadzić poprzez wartość K dla strat drobnych. Wymienniki ciepła przyczyniają się jedynie do spadku ciśnienia hydraulicznego; obciążenie cieplne i propagacja temperatury nie są modelowane. Charakterystyki pomp są dopasowywane od wysokości podnoszenia i jednego punktu znamionowego; sprawność, moc na wale, NPSH/kawitacja, działanie zaworu zwrotnego lub zachowanie czterech kwadrantów oraz automatyczne sekwencjonowanie pomp nie są modelowane. Praca pompy z przepływem wstecznym i wybiegiem są ekstrapolacjami poza dopasowanym zakresem roboczym. Prawa zaworów to wyidealizowane charakterystyki liniowe lub stałoprocentowe, a nie krzywe producenta. Częściowe obciążenie skaluje zapotrzebowanie węzłowe i cele równowagi zaworów; nie sugeruje strategii kontroli termicznej. W przypadku przesunięcia krzywej układu, zapotrzebowanie węzłowe jest przeskalowane z uwzględnieniem przesuniętego przepływu pompy. HGL nie uwzględnia wysokości podnoszenia. Gęsty solver Newtona jest przeznaczony do schematów inżynieryjnych o umiarkowanej wielkości, a nie do sieci o skali użyteczności publicznej. Uderzenie wodne i inne efekty przejściowe nie są modelowane. Automatyczne równoważenie zaworów jest iteracyjną heurystyką otwierania zaworów; sprzężone lub niewykonalne cele przepływu mogą zatrzymać się na granicach ruchu lub nie zbiegać się i są zgłaszane, a nie gwarantowane. W sieciach siatkowych wykres HGL pokazuje jedną reprezentatywną ścieżkę powrotną podążającą za przepływem dla wybranej pompy, z wyraźnie oznaczonym topologicznym powrotem, jeśli nie istnieje ciągła ścieżka powrotna skierowana ku przepływowi; nie jest to wykres każdej gałęzi. Przeglądarka gęstego solvera Newtona odrzuca modele powyżej 600 nieliniowych niewiadomych. Swamee–Jain jest jawnym przybliżeniem Colebrooka–White'a, opublikowanym dla 1e-6 ≤ ε/D ≤ 1e-2 i 5e3 ≤ Re ≤ 1e8; W tym zakresie różni się od pierwiastka Colebrooka nawet o około 3% w zakresie współczynnika tarcia, a jeszcze bardziej poza nim. Mieszanka 2000<Re<4000 jest mostem numerycznym, a nie rozwiązanym modelem przejściowym; rury biegnące poza opublikowanym zakresem są wyświetlane jako ostrzeżenie po każdym rozwiązaniu. Otwarcia zaworów poniżej 0,1% są odrzucane, a nie zaciskane, ponieważ model Kv nie jest tam zdefiniowany. Dodatki w tej kompilacji: solver stanu ustalonego pozostaje niezmieniony, więc liczby pojedynczego rozwiązania są liczbami v1. Dodane przemiatanie jest nowe i nie zawiera żadnego punktu odniesienia. Każdy przypadek przemiatania jest rozwiązywany na zimno — bez ciepłego startu z sąsiedniego przypadku — więc wyniki nie zależą od tego, jak przypadki zostały rozłożone na pracowników; oznacza to również, że przemiatanie jest wolniejsze w każdym przypadku niż marsz z ciepłym startem. Ekran N-1 usuwa jeden komponent na raz i raportuje ewentualność jako niewykonalną, z powodem, gdy zredukowana sieć izoluje węzeł lub pozostawia komponent bez granicy ciśnienia; nie modeluje zaworów odcinających, zaworów zwrotnych ani reakcji operatora. Metoda Monte Carlo pobiera jeden mnożnik logarytmiczno-normalny na chropowatość rury i jeden mnożnik normalny na niezerowe zapotrzebowanie węzłowe, z korelacją rang ustawioną przez użytkownika w każdej grupie i żadną między grupami; te rozkłady są założeniami użytkownika, a nie danymi pomiarowymi, a kwantyle są oszacowaniami DDSketch z określoną granicą dokładności względnej, a nie dokładnymi statystykami rzędu. Profil obciążenia skaluje zapotrzebowanie węzłowe za pomocą dostarczonej przez użytkownika 24-godzinnej listy mnożników (opcjonalnie modulowanej przez cosinus sezonowy w ciągu 8760 h) i raportuje energię pompy hydraulicznej rho*g*Q*H zintegrowaną w okresie: sprawność pompy i silnika nie jest modelowana, więc nie jest to energia wału ani energia elektryczna. Przeciągnięcia są wykonywane w procesach roboczych, gdy przeglądarka je udostępnia, a w przeciwnym razie w wątku głównym; narzędzie określa, który moduł obliczył wynik."},"intended_use":["education","technical exploration","preliminary assessment"],"catalog_languages":["en","uk","de","nl","fr","es","pl"],"tool_languages":["en","pl","nl","de","fr","es","uk"],"dependencies":["diagram-common.js","diagram-compute.classic.js"],"network_access":{"mode":"same-origin-data","note":"Loads three same-origin scripts beside the page — site-disclaimer.js, diagram-common.js and diagram-compute.classic.js (the classic build of the shared compute runtime). Nothing else is fetched, no third-party host is contacted, and nothing about the network the user draws is transmitted anywhere: every sweep runs in this browser, on the main thread or in same-origin Blob Workers created from diagram-compute.classic.js."},"validation":{"basis":{"en":"49 cases with 1747 checks pass on this build: stored network documents for single, series and parallel pipes, pumps, Kv valves, heat exchangers, loops, three seeded random meshes (stored), a Swamee-Jain grid, monotone throttling and import and solve refusals, run through the page's own file import. The reference is an independent python solver written by a second agent from a method specification without access to the page code, cross-checked by a second solver and by closed forms. The heat-exchanger, pump-curve and transition-blend models are checked for faithful implementation of the stated model, not against an external standard. The harness is the author's own; no external party has reviewed it.","uk":"49 випадків із 1747 перевірками проходять на цій збірці: збережені документи мереж для одиночних, послідовних і паралельних труб, насосів, клапанів Kv, теплообмінників, контурів, трьох випадкових мереж із зерном (збережених), сітки Swamee-Jain, монотонного дроселювання та відмов під час імпорту й розрахунку, подані через власний імпорт файлів сторінки. Еталон — незалежний розв'язувач на python, написаний іншим агентом за специфікацією методу без доступу до коду сторінки й перевірений другим розв'язувачем та замкненими формулами. Моделі теплообмінника, кривої насоса й перехідного згладжування перевірено на точність реалізації заявленої моделі, а не за зовнішнім стандартом. Набір тестів авторський; зовнішнього рецензування не було.","de":"49 Fälle mit 1747 Prüfungen bestehen auf diesem Build: gespeicherte Netzdokumente für Einzel-, Reihen- und Parallelrohre, Pumpen, Kv-Ventile, Wärmeübertrager, Maschen, drei gespeicherte Zufallsnetze, ein Swamee-Jain-Raster, monotone Drosselung sowie Abweisungen bei Import und Lösung, eingelesen über den eigenen Dateiimport der Seite. Die Referenz ist ein unabhängiger Python-Löser, den ein zweiter Agent aus einer Methodenspezifikation ohne Zugriff auf den Seitencode geschrieben hat, gegengeprüft mit einem zweiten Löser und geschlossenen Formen. Wärmeübertrager-, Pumpenkennlinien- und Übergangsmodell werden auf getreue Umsetzung des angegebenen Modells geprüft, nicht gegen eine externe Norm. Das Prüfgerüst stammt vom Autor; eine externe Prüfung fand nicht statt.","nl":"49 gevallen met 1747 controles slagen op deze build: opgeslagen netwerkdocumenten voor enkele, serie- en parallelle leidingen, pompen, Kv-kleppen, warmtewisselaars, lussen, drie opgeslagen willekeurige netten, een Swamee-Jain-raster, monotoon smoren en weigeringen bij import en oplossen, ingelezen via de eigen bestandsimport van de pagina. De referentie is een onafhankelijke python-oplosser die een tweede agent schreef uit een methodespecificatie zonder toegang tot de paginacode, gecontroleerd met een tweede oplosser en gesloten vormen. De modellen voor warmtewisselaar, pompkromme en overgangszone worden gecontroleerd op getrouwe uitvoering van het opgegeven model, niet tegen een externe norm. Het testharnas is van de auteur; er was geen externe review.","fr":"49 cas et 1747 vérifications passent sur cette version : documents de réseau enregistrés pour conduites simples, en série et en parallèle, pompes, vannes Kv, échangeurs, boucles, trois réseaux aléatoires enregistrés, une grille Swamee-Jain, un étranglement monotone et des refus à l'import et au calcul, chargés par l'import de fichiers de la page. La référence est un solveur python indépendant, écrit par un second agent à partir d'une spécification de méthode sans accès au code de la page, recoupé par un second solveur et par des formes fermées. Les modèles d'échangeur, de courbe de pompe et de transition sont vérifiés pour la fidélité au modèle déclaré, pas contre une norme externe. Le banc d'essai est celui de l'auteur ; aucune revue externe n'a eu lieu.","es":"49 casos con 1747 comprobaciones pasan en esta versión: documentos de red guardados para tuberías simples, en serie y en paralelo, bombas, válvulas Kv, intercambiadores, mallas, tres redes aleatorias guardadas, una malla Swamee-Jain, estrangulamiento monótono y rechazos en la importación y el cálculo, cargados con la importación de archivos de la propia página. La referencia es un solucionador python independiente, escrito por un segundo agente a partir de una especificación del método sin acceso al código de la página y contrastado con un segundo solucionador y con formas cerradas. Los modelos de intercambiador, curva de bomba y transición se comprueban por fidelidad al modelo declarado, no frente a una norma externa. El banco de pruebas es del autor; no hubo revisión externa.","pl":"49 przypadków z 1747 sprawdzeniami przechodzi na tej wersji: zapisane dokumenty sieci dla pojedynczych, szeregowych i równoległych rur, pomp, zaworów Kv, wymienników, pętli, trzech zapisanych sieci losowych, siatki Swamee-Jain, monotonicznego dławienia oraz odrzuceń przy imporcie i obliczeniu, wczytane przez własny import plików strony. Wzorcem jest niezależny solwer python napisany przez drugiego agenta na podstawie specyfikacji metody, bez dostępu do kodu strony, sprawdzony drugim solwerem i wzorami zamkniętymi. Modele wymiennika, krzywej pompy i strefy przejściowej są sprawdzane pod kątem wiernej realizacji podanego modelu, nie względem normy zewnętrznej. Zestaw testów jest autorski; zewnętrznej recenzji nie było."},"independent_validation":false,"benchmarks":[{"id":"hydraulicnetwork-stored-inputs-2026-10-16","reference":"Independent python reference written by a second agent from a method specification and the case files only, without access to the page code: a node-head Newton solver posed as a convex minimisation with exact per-component inversion, cross-checked by a Todini-Pilati global-gradient solver (agreement 1e-10 relative or better) and by closed forms or scalar roots on 17 simple layouts (1e-12 or better). Corrections and specification changes are recorded in the reference file. Every case input is stored in benchmarks/hydraulicnetwork.reference.json.","citations":["H. Cross, Analysis of Flow in Networks of Conduits or Conductors, Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936) — loop-correction method.","P.K. Swamee & A.K. Jain, Explicit equations for pipe-flow problems, ASCE J. Hydraulics Div. 102(5) (1976) 657-664 — f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, stated for 1e-6 <= eps/D <= 1e-2 and 5e3 <= Re <= 1e8.","C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156 — used only to quantify the Swamee-Jain scatter.","Hagen-Poiseuille laminar closed form f = 64/Re — derived, used to grade the laminar branch.","IEC 60534-2-1 / metric Kv definition: Q[m3/h] = Kv sqrt(dp[bar]/SG).","Affinity law H ~ n^2 for the two-point quadratic pump curve."],"cases":49,"passed":49,"tolerance":{"en":"Pass if |page - reference| <= max(1e-6 x |reference|, a small absolute floor per quantity), widened per key to twice the first-order error the page's convergence gate (scaled residual 2e-9) c  * solvers applies to this matrix — the Jacobian is a nonsymmetric indefinite saddle system on an
 * arbitrary graph, so solveConjugateGradient is out at any size, and GridEngine/multigrid need a

 * the runtime is the thing this tool already did badly: solving the same network many times. The

   const kind=key.slice(0,cut),id=key.slice(cut+1),v=Number(prm[key]);
   if(!Number.isFinite(v))continue;
   if(kind==='eps'){const e=em.get(id);if(e)e.eps=e.eps*v}
   else if(kind==='dem'){const n=nm.get(id);if(n)n.demand=n.demand*v}
  }
  const sol=hnSolveNet(net,P.fluid,{});
  const p={},q={};
  for(const n of net.nodes)p[n.id]=sol.node[n.id].p;
  for(const e of net.edges)q[e.id]=sol.edge[e.id].q;
  return{p,q,iter:sol.iter,residual:sol.residual};
 }
 if(P.kind==='profile'){
  const m=Number(prm.mult);
  const sol=hnSolveNet(P.net,P.fluid,{loadMultiplier:m});
  let W=0,minP=Infinity,maxV=0;
  for(const e of P.net.edges){const r=sol.edge[e.id];
   if(e.type==='pump')W+=P.fluid.rho*G*r.q*r.pump;
   if(Number.isFinite(r.vel)&&r.vel>maxV)maxV=r.vel}
  for(const n of P.net.nodes){const kPa=sol.node[n.id].p/1000;if(kPa<minP)minP=kPa}
  return{hour:Number(prm.hour),mult:m,powerW:W,minP,maxV,iter:sol.iter};
 }
 throw Error('unknown sweep case kind: '+P.kind);
}

/* ---- the Worker preamble: the tool's own solver, not a copy of it ----
   Every function here is emitted from the live object with toString(), so a Worker case runs the
   same characters the main thread runs. The three things the solver is NOT pure of get a Worker-side
   definition instead: G, `state` (a bare holder) and getFluid() (reads the case fluid, nothing
   else). MIGRATION_MAP §7 named exactly those. */
function hnWorkerPreamble(){
 const fns=[hnNodeIndex,nodeById,frictionFactor,valveKvEff,valveOpeningForKv,edgePhysics,
  boundaryFlowScale,connectedComponentsData,validateNetworkData,validateNetwork,buildProblem,
  normInf,solveLinear,solveNetwork,collectWarnings,hnSolveNet,hnCloneNet,hnEvaluateCase];
 return['const G='+G+';',
  'const state={nodes:[],edges:[],sol:null};',
  'let __hnFluid=null;',
  'function getFluid(){return{rho:__hnFluid.rho,nu:__hnFluid.nu,load:__hnFluid.load,speed:__hnFluid.speed}}',
  'let _hnNodeIdx=null,_hnNodeIdxSrc=null,_hnNodeIdxLen=-1;',
  'const clamp='+clamp.toString()+';',
  'const finite='+finite.toString()+';'
 ].concat(fns.map(f=>f.toString())).join('\n');
}

/* ---- start-up: runtime, ensemble, Worker pool, and a parity check that is run, not claimed ---- */
async function hnComputeInit(){
 const DC=(typeof window!=='undefined')?window.DiagramCompute:null;
 if(!DC||typeof DC.ComputeRuntime!=='function'){
  HN_COMPUTE.backendReason='diagram-compute.classic.js did not load; sweeps run on the main thread and the Monte-Carlo sweep is unavailable because its Latin-hypercube design and quantile tallies live in the runtime';
  hnSetBackend('cpu');hnRenderComputeStatus();return;
 }
 try{
  HN_COMPUTE.version=DC.VERSION||null;
  /* benchmark:false — the backend choice here is not a cost question. A sweep is many independent
     whole solves; Workers win whenever they exist, and calibrating for that would only spend the
     user's first second measuring something already known. */
  const rt=await DC.ComputeRuntime.create({benchmark:false});
  const source=DC.createEnsembleWorkerSource(function(c,ctx){return hnEvaluateCase(c,ctx.params)},{preamble:hnWorkerPreamble()});
  const eng=rt.createEnsembleEngine({prefix:'hydraulicnetwork-v2'});
  eng.registerEnsemble('sweep',{
   evaluate:(c,ctx)=>hnEvaluateCase(c,ctx.params),
   source,poolKey:'hydraulicnetwork-v2:sweep',
   determinism:'repeatable',
   design:{method:'list',cases:[{}]},
   metadata:{tool:'hydraulicnetwork-v2'}
  });
  HN_COMPUTE.runtime=rt;HN_COMPUTE.engine=eng;HN_COMPUTE.available=true;
  HN_COMPUTE.backendReason='the shared runtime is loaded; sweeps run on the main thread';
  if(rt.capabilities&&rt.capabilities.cpu&&rt.capabilities.cpu.workerAvailable){
   try{
    const pool=await rt.createWorkerPool('hydraulicnetwork-v2:sweep',{source,type:'classic',name:'hydraulicnetwork-v2:sweep'});
    await pool.init();
    HN_COMPUTE.workers=pool.workers.length;HN_COMPUTE.pool=true;
    const parity=await hnParityCheck();
    HN_COMPUTE.parity=parity;
    if(parity.ok){hnSetBackend('workers:'+HN_COMPUTE.workers);HN_COMPUTE.backendReason='a Worker case was checked against the same case solved on the main thread before any sweep was offered';}
    else{HN_COMPUTE.pool=false;hnSetBackend('cpu');HN_COMPUTE.backendReason='the Worker path did not reproduce the main-thread solve ('+parity.reason+'), so sweeps stay on the main thread';}
   }catch(e){
    HN_COMPUTE.pool=false;hnSetBackend('cpu');
    HN_COMPUTE.backendReason='no Worker pool could be created ('+String(e&&e.message||e)+'); sweeps run on the main thread';
   }
  }else{
   hnSetBackend('cpu');HN_COMPUTE.backendReason='this browser exposes no Worker; sweeps run on the main thread';
  }
 }catch(e){
  HN_COMPUTE.available=false;HN_COMPUTE.engine=null;hnSetBackend('cpu');
  HN_COMPUTE.backendReason='the shared runtime failed to start ('+String(e&&e.message||e)+'); sweeps run on the main thread and the Monte-Carlo sweep is unavailable';
 }
 hnRenderComputeStatus();
}
/* Solve the current network once in a Worker and once here, and compare. This is what lets the tool
   say "workers:N" as a fact. It also warms the pool, so the first sweep does not pay for it. */
async function hnParityCheck(){
 try{
  if(validateNetwork())return{ok:false,reason:'the network on the canvas is not solvable, so no comparison was possible'};
  const params={kind:'mc',net:hnNetSnapshot(),fluid:getFluid()};
  const tm=hnNow();const mine=hnEvaluateCase({index:0,parameters:{}},params);const coldMs=hnNow()-tm;
  const tw=hnNow();
  const out=await HN_COMPUTE.engine.run('sweep',{design:{method:'list',cases:[{}]},params,keepResults:true,backend:'workers',randomDomain:'hydraulicnetwork-v2:parity'});
  /* What one Worker round trip costs over and above the arithmetic. Both solves here are cold, so
     this is an over-estimate of the overhead, which is the safe direction: it only ever makes the
     size rule below more conservative about leaving the main thread. */
  HN_COMPUTE.rttMs=Math.max(0,(hnNow()-tw)-coldMs);
  const r=out.result.results[0];
  if(!r||!r.ok)return{ok:false,reason:'the Worker case failed: '+((r&&r.error)||'no result')};
  let worst=0,worstKey=null;
  for(const group of ['p','q'])for(const id in mine[group]){
   const a=mine[group][id],b=r.value[group][id];
   if(a!==b){const s=Math.max(Math.abs(a),Math.abs(b),1e-300),rel=Math.abs(a-b)/s;if(rel>worst){worst=rel;worstKey=group+':'+id}}
  }
  return{ok:worst===0,worst,worstKey,reason:worst===0?'bit-identical':('worst relative difference '+worst.toExponential(2)+' at '+worstKey)};
 }catch(e){return{ok:false,reason:String(e&&e.message||e)}}
}

/* ---- running a sweep ---- */
function hnSetBackend(b){HN_COMPUTE.backend=b;try{window.__diagramComputeBackend=b}catch(e){}}
function hnSweepBusy(on,label){
 HN_COMPUTE.busy=!!on;HN_COMPUTE.label=label||'';
 const c=actBtn('cancelSweepBtn');if(c)c.disabled=!on;
 for(const id of['curveBtn','n1Btn','mcBtn','profileBtn','balanceBtn']){const b=actBtn(id);if(b)b.disabled=!!on}
 if(!on)hnSweepProgress('',0,'idle');
}
function hnSweepProgress(label,f,text){
 const bar=qs('#sweepProgressBar'),t=qs('#sweepProgressText');
 if(bar)bar.style.width=(Math.max(0,Math.min(1,f||0))*100).toFixed(1)+'%';
 if(t)t.textContent=text!==undefined?text:`${label} · ${(Math.max(0,Math.min(1,f||0))*100).toFixed(0)}%`;
}
function hnDesignCount(d){
 if(d.method==='list')return d.cases.length;
 if(d.method==='grid')return Object.keys(d.sweep).reduce((n,k)=>n*d.sweep[k].length,1);
 if(d.method==='leave-one-out')return d.items.length+(d.baseline===false?0:1);
 return Math.max(1,Number(d.count)||1);
}
/* What one case of this network costs on this machine, measured rather than guessed. Reset whenever
   the network changes (hnClearSweeps), so the estimate always belongs to what is on the canvas. */
function hnCaseCostMs(){
 if(Number.isFinite(HN_COMPUTE.caseMs))return HN_COMPUTE.caseMs;
 try{
  const params={kind:'mc',net:hnNetSnapshot(),fluid:getFluid()};
  let best=Infinity;
  for(let i=0;i<2;i++){const t0=hnNow();hnEvaluateCase({index:0,parameters:{}},params);best=Math.min(best,hnNow()-t0)}
  HN_COMPUTE.caseMs=best;
 }catch(e){HN_COMPUTE.caseMs=1}
 return HN_COMPUTE.caseMs;
}
/* MIGRATION_MAP §7 is blunt about this: a Worker round trip costs hundreds of microseconds and a
   hydraulic solve costs milliseconds, so a SMALL sweep is a single calculation wearing a costume and
   sending it to a Worker makes it slower. The rule below is therefore measured, not assumed: run the
   sweep where it is cheaper, and say which it was. */
function hnPickBackend(cases){
 if(!HN_COMPUTE.pool)return{backend:'cpu',why:HN_COMPUTE.backendReason};
 const est=cases*hnCaseCostMs(),floor=Math.max(200,6*(HN_COMPUTE.rttMs||10));
 if(est<floor)return{backend:'cpu',why:`${cases} cases at a measured ${hnCaseCostMs().toFixed(2)} ms each is about ${est.toFixed(0)} ms of arithmetic, below the ${floor.toFixed(0)} ms at which a Worker round trip pays for itself on this machine, so it ran on the main thread`};
 return{backend:'workers',why:`${cases} cases at a measured ${hnCaseCostMs().toFixed(2)} ms each is about ${(est/1000).toFixed(1)} s of arithmetic, so it went to the Worker pool with progress and cancel`};
}
async function hnRunSweep(kind,design,params,label,opts){
 opts=opts||{};
 if(HN_COMPUTE.busy)throw Error('A sweep is already running.');
 hnSweepBusy(true,label);hnSweepProgress(label,0);
 const t0=hnNow();
 try{
  if(!HN_COMPUTE.engine)return hnRunInline(kind,design,params,t0);
  const pick=hnPickBackend(hnDesignCount(design));
  const ac=new AbortController();HN_COMPUTE.abort=ac;
  const payload={design,params,seed:opts.seed??0,randomDomain:'hydraulicnetwork-v2:'+kind,
   keepResults:true,signal:ac.signal,onProgress:f=>hnSweepProgress(label,f)};
  /* On the main thread the ensemble yields between chunks; size the chunk so the page never stalls
     for much more than a frame's worth of solves. */
  const cpuChunk=Math.max(1,Math.min(64,Math.round(50/Math.max(.05,hnCaseCostMs()))));
  let out,why=pick.why;
  try{out=await HN_COMPUTE.engine.run('sweep',pick.backend==='workers'?{...payload,backend:'workers'}:{...payload,backend:'cpu',chunkSize:cpuChunk})}
  catch(e){
   if(hnIsAbort(e)||pick.backend!=='workers')throw e;
   HN_COMPUTE.pool=false;
   why='the Worker path failed during this sweep ('+String(e&&e.message||e)+'), so it fell back to the main thread';
   HN_COMPUTE.backendReason=why;hnSetBackend('cpu');hnRenderComputeStatus();
   out=await HN_COMPUTE.engine.run('sweep',{...payload,backend:'cpu',chunkSize:cpuChunk});
  }
  HN_COMPUTE.backendReason=why;
  const r=out.result;
  const b=out.compute.backend==='workers'?('workers:'+(r.workers||HN_COMPUTE.workers)):String(out.compute.backend);
  hnSetBackend(b);hnRenderComputeStatus();
  return{results:r.results,cases:r.cases,completed:r.completed,failed:r.failed,failures:r.failures||[],
   backend:b,backendWhy:why,elapsedMs:r.elapsedMs,determinism:r.determinism,determinismBasis:r.determinismBasis,
   designSignature:r.designSignature||null,engine:'diagram-compute '+(HN_COMPUTE.version||'?')};
 }finally{HN_COMPUTE.abort=null;hnSweepBusy(false)}
}
/* No runtime: the designs this tool can enumerate itself still run, in one blocking loop, exactly as
   v1's curve did. The Latin hypercube and the quantile sketches are NOT reimplemented here — a
   different sampler is a different experiment, and presenting it as the same one is the thing
   AGENTS.md 2 forbids. */
function hnEnumerateDesign(d){
 if(d.method==='list')return d.cases.map(c=>({...c}));
 if(d.method==='grid'){let out=[{}];for(const nm of Object.keys(d.sweep)){const nx=[];for(const base of out)for(const v of d.sweep[nm])nx.push({...base,[nm]:v});out=nx}return out}
 if(d.method==='leave-one-out'){const out=[];
  if(d.baseline!==false)out.push({[d.parameter]:d.baselineValue===undefined?null:d.baselineValue,caseKind:'baseline'});
  for(const it of d.items)out.push({[d.parameter]:it,caseKind:'variant'});return out}
 throw Error('This sweep needs diagram-compute.classic.js: its "'+d.method+'" design (and, for the Monte-Carlo, its quantile tallies) live in the shared runtime, and this build will not substitute a different sampler and call it the same experiment.');
}
function hnRunInline(kind,design,params,t0){
 const cases=hnEnumerateDesign(design),results=[];let failed=0;
 for(let i=0;i<cases.length;i++){
  try{results.push({index:i,ok:true,parameters:cases[i],value:hnEvaluateCase({index:i,parameters:cases[i]},params)})}
  catch(e){failed++;results.push({index:i,ok:false,parameters:cases[i],error:String(e&&e.message||e)})}
 }
 hnSetBackend('cpu');hnRenderComputeStatus();
 return{results,cases:cases.length,completed:cases.length-failed,failed,failures:[],
  backend:'cpu',elapsedMs:hnNow()-t0,determinism:'repeatable',
  determinismBasis:'every case was evaluated in index order on one thread, with no shared warm start',
  backendWhy:'diagram-compute.classic.js is absent, so the sweep ran as one blocking main-thread loop, exactly as v1 did',
  designSignature:null,engine:'none (diagram-compute.classic.js absent)'};
}
function hnCancelSweep(){if(HN_COMPUTE.abort){HN_COMPUTE.abort.abort('cancelled by the user');hnSweepProgress('',0,'cancelling…')}else toast('Nothing to cancel; this sweep cannot be interrupted without the shared runtime.','warn')}

/* ---- N-1 contingency screen ---- */
async function runN1(){
 if(HN_COMPUTE.busy){toast('A sweep is already running.','warn');return}
 let spec;
 try{
  const err=validateNetwork();if(err)throw Error(err);
  const net=hnNetSnapshot(),fluid=getFluid();
  const items=net.edges.filter(e=>e.type==='pipe'||e.type==='valve').map(e=>e.id);
  if(!items.length)throw Error('The N-1 screen closes pipes and valves one at a time; this network has neither.');
  const vLimit=Math.max(0.01,Number(A.vLimit)||3);
  spec={design:{method:'leave-one-out',items,parameter:'excluded',baseline:true,baselineValue:null},
        params:{kind:'n1',net,fluid,vLimit},vLimit,items,net};
 }catch(e){hnSweepMessage('N-1 screen failed: '+e.message,'err');return}
 try{
  const run=await hnRunSweep('n1',spec.design,spec.params,'N-1 screen');
  const rows=[];let baseline=null,worst=null,infeasible=0,violating=0;
  for(const r of run.results){
   if(!r.ok){rows.push({excluded:String(r.parameters&&r.parameters.excluded),ok:false,reason:r.error});infeasible++;continue}
   const v=r.value;
   if(v.excluded===null){baseline=v;continue}
   rows.push(v);
   if(!v.ok){infeasible++;continue}
   if(v.viol.length)violating++;
   if(!worst||v.minP<worst.minP)worst=v;
  }
  state.sweeps.n1={vLimit:spec.vLimit,baseline,rows,worst,infeasible,violating,run};
  hnRenderSweeps();
 }catch(e){hnSweepMessage(hnIsAbort(e)?'N-1 screen cancelled.':'N-1 screen failed: '+e.message,hnIsAbort(e)?'warn':'err')}
}

/* ---- Monte-Carlo over roughness and demands ---- */
async function runMonteCarlo(){
 if(HN_COMPUTE.busy){toast('A sweep is already running.','warn');return}
 const DC=(typeof window!=='undefined')?window.DiagramCompute:null;
 let spec;
 try{
  const err=validateNetwork();if(err)throw Error(err);
  if(!DC||!HN_COMPUTE.engine)throw Error('The Monte-Carlo sweep needs diagram-compute.classic.js — its Latin-hypercube design, its rank-correlation transform and its mergeable quantile tallies are the runtime’s, and this build will not swap in a different sampler and present it as the same experiment.');
  const net=hnNetSnapshot(),fluid=getFluid();
  const sigma=Math.max(0,Number(A.mcEpsSigma)||0),sd=Math.max(0,Number(A.mcDemSd)||0);
  const rhoE=clamp(Number(A.mcEpsRho)||0,0,.95),rhoD=clamp(Number(A.mcDemRho)||0,0,.95);
  const count=Math.max(20,Math.min(20000,Math.round(Number(A.mcSamples)||400)));
  const seed=Math.round(Number(A.mcSeed)||0);
  const parameters={},group=[];
  if(sigma>0)for(const e of net.edges)if(e.type==='pipe'){parameters['eps:'+e.id]={kind:'lognormal',median:1,sigma};group.push('eps')}
  if(sd>0)for(const n of net.nodes)if(n.demand!==0){parameters['dem:'+n.id]={kind:'normal',mean:1,sd};group.push('dem')}
  const names=Object.keys(parameters);
  if(!names.length)throw Error('Nothing to sample. Give the roughness a sigma above 0 (the network needs pipes), or the demands an sd above 0 on a network that has non-zero demands.');
  let correlation=null;
  if(names.length>1&&(rhoE>0||rhoD>0)){
   const M=names.map((_,i)=>names.map((__,j)=>i===j?1:(group[i]===group[j]?(group[i]==='eps'?rhoE:rhoD):0)));
   correlation={method:'iman-conover',target:'spearman',matrix:M};
  }
  spec={design:{method:'lhs',count,seed,parameters,correlation},params:{kind:'mc',net,fluid},
        count,seed,sigma,sd,rhoE,rhoD,net,names};
 }catch(e){hnSweepMessage('Monte-Carlo failed: '+e.message,'err');return}
 try{
  const run=await hnRunSweep('mc',spec.design,spec.params,'Monte-Carlo',{seed:spec.seed});
  /* Explicit tally ranges. The defaults span [1e-9, 1e12] and gauge pressures in Pa do sit inside
     that, but relying on it silently is how a quantile ends up outside its own guarantee. */
  const skP={},skQ={};
  for(const n of spec.net.nodes)skP[n.id]=DC.createQuantileSketch({relativeAccuracy:.005,minValue:1,maxValue:1e8,tailKeep:512});
  for(const e of spec.net.edges)skQ[e.id]=DC.createQuantileSketch({relativeAccuracy:.005,minValue:1e-9,maxValue:1e3,tailKeep:512});
  let used=0;
  for(const r of run.results){
   if(!r.ok||!r.value)continue;used++;
   for(const id in r.value.p)if(skP[id])skP[id].add(r.value.p[id]);
   for(const id in r.value.q)if(skQ[id])skQ[id].add(r.value.q[id]);
  }
  const probs=[.05,.5,.95];
  const nodes=spec.net.nodes.map(n=>({id:n.id,name:n.name||n.id,s:skP[n.id].summary({probabilities:probs})}));
  const edges=spec.net.edges.map(e=>({id:e.id,name:e.name||e.id,type:e.type,s:skQ[e.id].summary({probabilities:probs})}));
  const boundHolds=nodes.every(x=>x.s.boundHolds)&&edges.every(x=>x.s.boundHolds);
  state.sweeps.mc={count:spec.count,used,seed:spec.seed,sigma:spec.sigma,sd:spec.sd,rhoE:spec.rhoE,rhoD:spec.rhoD,
   parameters:spec.names,nodes,edges,probs,boundHolds,
   diagnostics:(()=>{try{return DC.createSamplingDesign(spec.design).diagnostics()}catch(e){return null}})(),run};
  hnRenderSweeps();
 }catch(e){hnSweepMessage(hnIsAbort(e)?'Monte-Carlo cancelled.':'Monte-Carlo failed: '+e.message,hnIsAbort(e)?'warn':'err')}
}

/* ---- demand profile over 24 h or 8760 h ---- */
async function runLoadProfile(){
 if(HN_COMPUTE.busy){toast('A sweep is already running.','warn');return}
 let spec;
 try{
  const err=validateNetwork();if(err)throw Error(err);
  const net=hnNetSnapshot(),fluid=getFluid();
  if(!net.edges.some(e=>e.type==='pump'))throw Error('The load profile reports pump energy; this network has no pump.');
  const hours=Number(A.profileHours)===8760?8760:24;
  const daily=String(A.profileDaily).split(/[,;\s]+/).filter(x=>x!=='').map(Number);
  if(daily.length!==24||daily.some(v=>!Number.isFinite(v)||v<0))throw Error('The hourly profile needs exactly 24 finite, non-negative multipliers.');
  const season=clamp(Number(A.profileSeason)||0,0,.9);
  const cases=[];
  for(let h=0;h<hours;h++){
   const m=hours===8760?daily[h%24]*(1+season*Math.cos(2*Math.PI*Math.floor(h/24)/365)):daily[h%24];
   cases.push({hour:h,mult:m});
  }
  /* The multiplier scales nodal demands and nothing else. On a network whose demands are all zero
     — the shipped example is one — every hour is the same hour, and saying so is better than
     printing 8760 identical rows and letting the reader assume they mean something. */
  const flat=!net.nodes.some(n=>n.demand!==0);
  spec={design:{method:'list',cases},params:{kind:'profile',net,fluid},hours,daily,season,net,flat};
 }catch(e){hnSweepMessage('Load profile failed: '+e.message,'err');return}
 try{
  const run=await hnRunSweep('profile',spec.design,spec.params,`Load profile (${spec.hours} h)`);
  let energyWh=0,peakW=0,peakHour=null,minP=Infinity,minPHour=null,maxV=0,solved=0;
  const vLimit=Math.max(.01,Number(A.vLimit)||3);let overV=0;
  const series=[];
  for(const r of run.results){
   if(!r.ok||!r.value)continue;solved++;
   const v=r.value;energyWh+=v.powerW;
   if(v.powerW>peakW){peakW=v.powerW;peakHour=v.hour}
   if(v.minP<minP){minP=v.minP;minPHour=v.hour}
   if(v.maxV>maxV)maxV=v.maxV;
   if(v.maxV>vLimit)overV++;
   if(spec.hours===24)series.push(v);
  }
  state.sweeps.profile={hours:spec.hours,season:spec.season,daily:spec.daily,vLimit,solved,flat:spec.flat,
   energy_kWh:energyWh/1000,peak_kW:peakW/1000,mean_kW:solved?energyWh/solved/1000:0,
   peakHour,minP,minPHour,maxV,overV,series,run};
  hnRenderSweeps();
 }catch(e){hnSweepMessage(hnIsAbort(e)?'Load profile cancelled.':'Load profile failed: '+e.message,hnIsAbort(e)?'warn':'err')}
}

/* ---- reporting ---- */
function hnSweepMessage(msg,cls){const c=qs('#sweepResults');if(c)c.innerHTML=`<div class="status ${cls==='err'?'err':cls==='warn'?'warn':'ok'}">${esc(msg)}</div>`}
function hnRenderComputeStatus(){
 const el=qs('#computeStatus');if(!el)return;
 const parity=HN_COMPUTE.parity;
 el.className='status '+(HN_COMPUTE.available?(HN_COMPUTE.pool?'ok':'warn'):'warn');
 el.innerHTML=`Steady solve: <b>main thread</b> (unchanged from v1). Last runtime computation: <b>${esc(HN_COMPUTE.backend)}</b>`
  +(HN_COMPUTE.version?` · diagram-compute ${esc(HN_COMPUTE.version)}`:'')
  +`<br><span class="tiny">${esc(HN_COMPUTE.backendReason)}`
  +(parity&&parity.ok?`; one Worker case was checked against the same case solved here and came back identical`:parity?`; parity check: ${esc(parity.reason)}`:'')
  +(HN_COMPUTE.pool?` · ${HN_COMPUTE.workers} worker(s) ready; a sweep goes to them only when it is worth more than a round trip (${Number.isFinite(HN_COMPUTE.rttMs)?HN_COMPUTE.rttMs.toFixed(1):'?'} ms measured)`:'')
  +`</span>`;

   +`<table><thead><tr><th>Component</th><th>Type</th><th>Q P5 m³/h</th><th>Q P50</th><th>Q P95</th></tr></thead><tbody>${erows}</tbody></table>`);

   +(P.flat?`<div class="status warn">Every node in this network has zero demand, and the profile multiplier scales nodal demands only — so every hour below is the same operating point. Give at least one node a demand to make the profile mean anything.</div>`:'')

/* ---- small DOM helper (the tool's own `el` builds SVG nodes) ---- */
function dom(tag,attrs,kids){
 const n=document.createElement(tag);
 if(attrs)for(const k of Object.keys(attrs)){
  const v=attrs[k];
  if(v==null)continue;
  if(k==='text')n.textContent=v;else if(k==='html')n.innerHTML=v;
  else if(k==='class')n.className=v;else n.setAttribute(k,v);
 }
 (kids||[]).forEach(c=>{if(c)n.appendChild(c)});
 return n;
}
function actBtn(id){return document.querySelector('[data-action="'+id+'"]')||qs('#'+id)}

const TOOL_HINTS={
 select:'Drag nodes. Select an element to edit it.',
 node:'Click empty canvas to add a node.',
 pipe:'Click start node, then end node to add a pipe.',
 pump:'Click suction node, then discharge node to add a pump.',
 valve:'Click start node, then end node to add a valve.',
 hx:'Click start node, then end node to add a heat exchanger.'};

/* ---- status surfaces that used to be hand-placed <div>s ---- */
let solveStatus={text:'At least one fixed-pressure node is required in every connected component.',tone:''};

function setBadge(t){const b=qs('#residualBadge');if(b)b.textContent=t}

/* ---- undo/redo (spec 8.3: a direct-manipulation stage must register history).
   diagram-ui.js pushes AFTER a field has written its value, which makes the
   first undo a no-op; the tool therefore gates the automatic push off and pushes
   before every mutation itself. The gate belongs upstream. */
let histOn=false;
function histPush(){
 if(!ui||!ui.history)return;
 histOn=true;
 try{ui.history.push()}finally{histOn=false}
}
function histCapture(){
 return JSON.stringify({nodes:state.nodes,edges:state.edges,sel:state.selected,
  seqN:state.seqN,seqE:state.seqE,A:A});
}
function histRestore(snap){
 let o=null;try{o=JSON.parse(snap)}catch(e){return}
 state.nodes=o.nodes;state.edges=o.edges;state.selected=o.sel;
 state.seqN=o.seqN;state.seqE=o.seqE;
 Object.keys(o.A||{}).forEach(k=>{A[k]=o.A[k]});
 state.pendingNode=null;state.drag=null;

}

/* The two analysis factors are applied exactly as entered or imported (the

/* ---- results ---- */
function uiStale(){if(ui&&ui.state_==='ready')ui.setState('stale')}
function runSolve(){if(ui)ui.run();else{solveAndShow();fbResults()}}

function resultsData(){
 const sol=state.sol;
 const tone=solveStatus.tone==='err'?'bad':(solveStatus.tone==='warn'?'warn':(solveStatus.tone==='ok'?'ok':null));
 const d={verdict:{tone:tone,text:solveStatus.text},tiles:[],tables:[]};
 d.tiles.push(
  {label:'Newton iterations',value:sol?sol.iter:null,precision:0,learn:'solver'},
  {label:'Scaled residual',value:sol?sol.residual.toExponential(2):null,learn:'solver'},
  {label:'Max continuity residual',value:sol?sol.maxContinuity.toExponential(2):null,hint:'m³/h'},
  {label:'Max energy residual',value:sol?sol.maxEnergy.toExponential(2):null,hint:'m'},
  {label:'Nodes',value:state.nodes.length,precision:0,headline:false},
  {label:'Components',value:state.edges.length,precision:0,headline:false});
 if(!sol)return d;
 const fl=getFluid();
 d.tables.push({
  title:'Node results',
  head:['Node','Elevation m','Demand m³/h','Pressure kPa(g)','HGL m','Boundary +in m³/h'],
  rows:state.nodes.map(n=>{const r=sol.node[n.id];
   return [n.name||n.id,fmt(n.z,2),fmt(n.demand*fl.load,2),fmt(r.p/1000,2),fmt(r.hgl,3),
    n.fixed?fmt(r.boundary*3600,3):'—']})
 },{
  title:'Edge results',
  head:['Edge','Type','Flow m³/h','Static Δp a−b kPa','hL signed m','Pump H m','Speed m/s','Re'],
  rows:state.edges.map(e=>{const r=sol.edge[e.id];
   return [e.name||e.id,e.type,fmt(r.q*3600,3),fmt(r.dpNodes/1000,2),
    e.type==='pump'?'—':fmt(r.loss,3),e.type==='pump'?fmt(r.pump,3):'—',
    fmt(r.vel,2),Number.isFinite(r.Re)?fmt(r.Re,0):'—']})
 });
 return d;
}

/* ---- stage ---- */
function stageA11y(){
 const s=state.sol;
 return 'Network drawing: '+state.nodes.length+' nodes, '+state.edges.length+' components. '
  +(s?('Solved in '+s.iter+' iterations; scaled residual '+s.residual.toExponential(2)+'.')
     :'Not solved.')

}
let fitArmed=false;
function fitView(){
 /* Fit the drawing to the stage. The stage calls fit() once on construction; the
    first call is skipped so the page opens on the same 1000x620 framing the
    unported page used, and Fit stays a deliberate action. */
 if(!fitArmed||!svg)return;
 if(!state.nodes.length){svg.setAttribute('viewBox','0 0 1000 620');return}
 let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 for(const n of state.nodes){
  x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y);
 }
 const pad=60;
 x0-=pad;y0-=pad;x1+=pad;y1+=pad;
 const w=Math.max(120,x1-x0),h=Math.max(120,y1-y0);
 svg.setAttribute('viewBox',x0+' '+y0+' '+w+' '+h);
}
function buildStage(host,app){
 stage=app.stage({minHeight:340,caption:'Positive edge flow follows its arrow.',
  a11y:stageA11y,fit:fitView,render:function(){}});
 stage.node.insertBefore(dom('div',{class:'hn-head'},[
  dom('span',{id:'canvasStatus',text:'Network editor'}),
  dom('span',{id:'residualBadge',text:'Not solved'})]),stage.body);
 svg=document.createElementNS(SVG_NS,'svg');
 svg.setAttribute('id','canvas');
 svg.setAttribute('viewBox','0 0 1000 620');
 svg.setAttribute('preserveAspectRatio','xMidYMid meet');
 svg.setAttribute('aria-label','Hydraulic network drawing canvas');
 stage.body.appendChild(svg);
 const leg=dom('div',{class:'hn-legend'});
 [['pipe','Pipe'],['pump','Pump'],['valve','Valve'],['hx','Heat exchanger']].forEach(p=>{
  leg.appendChild(dom('span',{},[dom('i',{class:'hn-sw '+p[0]}),document.createTextNode(p[1])]));
 });
 leg.appendChild(dom('span',{},[dom('span',{id:'toolHint',text:TOOL_HINTS.select})]));
 stage.node.insertBefore(leg,stage.node.querySelector('.dgu-stage-cap'));
 bindCanvas();
 setTimeout(function(){fitArmed=true},0);
}
function bindCanvas(){
 svg.addEventListener('pointerdown',ev=>{
  if(ev.target===svg&&state.tool==='node'){const p=svgPoint(ev);addNode(p.x,p.y)}
  else if(ev.target===svg&&state.tool==='select'){state.selected=null;render();renderProps()}
 });
 svg.addEventListener('pointermove',ev=>{
  if(!state.drag)return;
  if(!state.drag.moved){state.drag.moved=1;histPush()}
  const p=svgPoint(ev);const n=nodeById(state.drag.id);
  if(n){n.x=clamp(p.x,25,975);n.y=clamp(p.y,25,595);render()}
 });
 svg.addEventListener('pointerup',finishDrag);
 svg.addEventListener('pointercancel',finishDrag);
 svg.addEventListener('pointerleave',finishDrag);
}

  id:'hydraulicnetwork',mount:'#app',layout:'studio',compute:'run',

   {keys:'delete,backspace',label:'Delete the selected element',run:function(){deleteSelected()}},

   /* deferred by one turn: diagram-ui.js clears the result of a run tool after an

/* diagram-ui.js renders a toggle as <span class="dgu-toggle"><input type=checkbox>>,
   points the field label at the span (which is not a labelable element) and leaves
   the checkbox with no accessible name and an 18 px hit target, under the 44 px
   minimum of spec 4.5. Repaired here for this page; the repair belongs upstream. */
function patchFields(app){
 (app.panels||[]).forEach(p=>(p.fields||[]).forEach(f=>{
  if(!f.box)return;
  const name=typeof f.def.label==='function'?f.def.label():f.def.label;
  f.box.setAttribute('aria-label',DiagramUI.pick(name,app.lang));
  const fwd=e=>{if(e.target!==f.box&&!e.target.closest('button'))f.box.click()};
  const c=f.control;
  if(c&&!c._hnTap){c._hnTap=1;c.style.cursor='pointer';c.addEventListener('click',fwd)}
  const lab=f.node&&f.node.querySelector('label.dgu-flabel');
  if(lab&&!lab._hnTap){lab._hnTap=1;lab.style.cursor='pointer';lab.addEventListener('click',fwd)}
 }));
}

/* ---- degrade honestly: no diagram-ui.js, one plain column, same model,
        same fields, same exports (spec 3, rule 10) ---- */
let fbMode=false,fbRes=null;
function fbLabel(f){return typeof f.label==='function'?f.label():(f.label||'')}
function fbControl(f,host){
 const type=f.type||'number';
 if(type==='note'){
  const p=dom('div',{class:'tiny muted',text:fbLabel(f)});p.dataset.fb='1';f._fb=p;host.appendChild(p);return;
 }
 const wrap=dom('label',{},[dom('span',{text:fbLabel(f)+(f.unit?' ['+f.unit+']':'')})]);
 let c;
 if(type==='select'||type==='segmented'){
  c=dom('select');
  (typeof f.options==='function'?f.options():(f.options||[])).forEach(o=>{
   c.appendChild(dom('option',{value:o[0],text:o[1]}));
  });
 }else if(type==='toggle'){c=dom('input',{type:'checkbox'})}
 else if(type==='text'){c=dom('input',{type:'text'})}
 else{c=dom('input',{type:type==='range'?'range':'number'});
  if(f.min!=null)c.min=f.min;if(f.max!=null)c.max=f.max;if(f.step!=null)c.step=f.step}
 f._fb=c;
 const read=()=>type==='toggle'?c.checked:(type==='select'||type==='segmented'||type==='text')?c.value:
   (c.value===''?null:parseFloat(c.value));
 const commit=()=>{const v=read();if(f.set)f.set(v,A);else if(f.key)DGSet(A,f.key,v);fbSync()};
 c.addEventListener('change',commit);
 wrap.appendChild(c);host.appendChild(wrap);
}
function DGSet(o,k,v){o[k]=v}
function fbSync(){
 if(!fbMode)return;
 PANELS.forEach(p=>(p.fields||[]).forEach(f=>{
  const c=f._fb;if(!c)return;
  const vis=typeof f.visible==='function'?f.visible({state:A}):true;
  const box=c.closest('label')||c;
  box.hidden=!vis;
  if(!vis)return;
  const v=f.get?f.get(A,{state:A}):(f.key?A[f.key]:null);
  if(c.type==='checkbox')c.checked=!!v;
  else if(c.tagName==='DIV')return;
  else if(document.activeElement!==c)c.value=(v==null?'':v);
  if(typeof f.disabled==='function')c.disabled=!!f.disabled({state:A});
 }));
 const sa=qs('#fbSelAct');if(sa)sa.hidden=!state.selected;
 setHint();
}
