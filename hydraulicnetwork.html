 this editor (max 1000 nodes / 3000 components).":"El archivo de red es demasiado grande para este editor (máx. 1000 nodos / 3000 componentes).","Newton iterations":"Iteraciones de Newton","Newton line search failed.":"Error en la búsqueda de línea de Newton.","No curve generated.":"No se generó ninguna curva.","Node":"Nodo","Node continuity (free nodes):  SUM_in q - SUM_out q - demand * load_factor = 0":"Continuidad nodal (nodos libres): SUM_in q - SUM_out q - demand * load_factor = 0","Node results":"Resultados del nodo","Nodes and edges must be arrays.":"Los nodos y las aristas deben ser arrays.","None":"Ninguno","Not solved":"No resuelto","Not solved.":"No resuelto.","Nothing to cancel; this sweep cannot be interrupted without the shared runtime.":"Nada que cancelar; este barrido no se puede interrumpir sin el entorno de ejecución compartido.","Opening":"Apertura","Opening characteristic":"Característica de apertura","Partial-load demand factor":"Factor de demanda en carga parcial","Profile length":"Longitud del perfil","Qrated":"Qrated","Rated flow":"Caudal nominal","Received":"Recibido","Roughness":"Rugosidad","Scaled residual":"Residuo escalado","Seasonal swing (8760 h only)":"Variación estacional (solo 8760 h)","Shared compute runtime: starting…":"Entorno de cálculo compartido: iniciando…","Solve network":"Resolver red","Solve the network first.":"Resuelva primero la red.","Solver failed:":"Error del solucionador:","Sweep cancelled.":"Barrido cancelado.","THE ACCURACY BOUND IS VOID FOR AT LEAST ONE TALLY.":"LA COTA DE PRECISIÓN ES NULA PARA AL MENOS UN RECUENTO.","The Monte-Carlo sweep needs diagram-compute.classic.js — its Latin-hypercube design, its rank-correlation transform and its mergeable quantile tallies are the runtime’s, and this build will not swap in a different sampler and present it as the same experiment.":"El barrido Monte Carlo necesita diagram-compute.classic.js — su diseño de hipercubo latino, su transformación de correlación de rango y sus recuentos de cuantiles combinables pertenecen al entorno de ejecución, y esta compilación no sustituirá un muestreador distinto presentándolo como el mismo experimento.","This sweep needs diagram-compute.classic.js: its \"":"Este barrido necesita diagram-compute.classic.js: su \"","Type":"Tipo","Velocity limit":"Límite de velocidad","What this tool does":"Qué hace esta herramienta","a Worker case was checked against the same case solved on the main thread before any sweep was offered":"se comprobó un caso de Worker frente al mismo caso resuelto en el hilo principal antes de que se ofreciera ningún barrido","and 5·10":"y 5·10","arithmetic, and that rule is what governs on a platform whose libm rounds differently.":"aritmética, y esa regla es la que rige en una plataforma cuya libm redondea de forma distinta.","at opening limit:":"en el límite de apertura:","cancelled by the user":"cancelado por el usuario","cancelling…":"cancelando…","central-difference Jacobian, the damped line search and the linear solve are all the":"jacobiano de diferencias centradas, la búsqueda de línea amortiguada y la resolución lineal son todos el","delete,backspace":"supr,retroceso","diagram-compute.classic.js is absent, so the sweep ran as one blocking main-thread loop, exactly as v1 did":"diagram-compute.classic.js está ausente, por lo que el barrido se ejecutó como un único bucle bloqueante en el hilo principal, exactamente como hacía v1","explicit approximation":"aproximación explícita","gate then bounds the result at roughly 1e-7 relative.":"umbral limita entonces el resultado a aproximadamente 1e-7 relativo.","halts at a scaled residual of 2e-9, worth about 1e-7 relative) rather than by the":"se detiene en un residuo escalado de 2e-9, equivalente a unos 1e-7 relativo) en lugar de por el","laminar friction":"fricción laminar","main thread":"hilo principal","no Worker pool could be created (":"no se pudo crear ningún grupo de Workers (","no result":"sin resultado","no runtime; one blocking main-thread loop":"sin entorno de ejecución; un bucle bloqueante en el hilo principal","no sweep has run yet; the interactive solve is always on the main thread":"todavía no se ha ejecutado ningún barrido; la resolución interactiva está siempre en el hilo principal","no sweep run":"ningún barrido ejecutado","nodes,":"nodos,","none (diagram-compute.classic.js absent)":"ninguno (diagram-compute.classic.js ausente)","none: every recorded output reproduces bit for bit on this platform. What could":"ninguna: cada salida registrada se reproduce bit a bit en esta plataforma. Lo que podría","nothing is imported and nothing is substituted. The residual assembly, the":"no se importa nada y no se sustituye nada. El ensamblaje del residuo, el","operating point":"punto de funcionamiento","path taken here is the path the page took.":"camino seguido aquí es el camino que siguió la página.","preliminary assessment":"evaluación preliminar","still separate the two is a C library whose exp/log/pow round differently in the last":"sigue separando a ambos es una biblioteca C cuyas exp/log/pow redondean de forma distinta en el último","technical exploration":"exploración técnica","the Worker case failed:":"el caso de Worker falló:","the Worker path did not reproduce the main-thread solve (":"la ruta de Worker no reprodujo la resolución del hilo principal (","the Worker path failed during this sweep (":"la ruta de Worker falló durante este barrido (","the network on the canvas is not solvable, so no comparison was possible":"la red del lienzo no es resoluble, por lo que no fue posible ninguna comparación","the shared runtime failed to start (":"el entorno compartido no pudo iniciarse (","the shared runtime is loaded; sweeps run on the main thread":"el entorno compartido está cargado; los barridos se ejecutan en el hilo principal","this browser exposes no Worker; sweeps run on the main thread":"este navegador no expone ningún Worker; los barridos se ejecutan en el hilo principal","to Colebrook–White, published for 10":"respecto a Colebrook–White, publicada para 10","unknown sweep case kind:":"tipo de caso de barrido desconocido:","worst relative difference":"peor diferencia relativa","· design":"· diseño","— THE ACCURACY BOUND IS VOID FOR AT LEAST ONE TALLY":"— LA COTA DE PRECISIÓN ES NULA PARA AL MENOS UN RECUENTO","; over that box it differs from the Colebrook root by up to about 3% in f, and by more outside it. The 2000<Re<4000 blend is a numerical bridge, not a resolved transition model. Pipes running outside the published box are listed as a warning after each solve.":"; dentro de ese rango difiere de la raíz de Colebrook hasta en aproximadamente un 3% en f, y más fuera de él. La mezcla 2000<Re<4000 es un puente numérico, no un modelo de transición resuelto. Las tuberías que quedan fuera del rango publicado se listan como advertencia después de cada resolución.","A coil":"Una batería","A fixed-pressure node fixes gauge pressure; its elevation is still part of total head. A demand node removes flow from the network. Negative demand injects flow. Closed circulating systems need one arbitrary pressure reference node.":"Un nodo de presión fija establece la presión manométrica; su cota sigue formando parte de la altura total. Un nodo de demanda extrae caudal de la red. Una demanda negativa inyecta caudal. Los sistemas de circulación cerrados necesitan un nodo de referencia de presión arbitrario.","A fixed-pressure node prescribes gauge pressure instead of solving it; its elevation still counts towards total head, and the solver reports the boundary exchange needed to hold that pressure. Every connected component of the drawing needs at least one, and a closed circulating loop needs one arbitrary reference node — without it the pressure level is undetermined and the Jacobian is singular.":"Un nodo de presión fija prescribe la presión manométrica en lugar de calcularla; su cota sigue contando en la altura total, y el solucionador informa del intercambio de contorno necesario para mantener esa presión. Cada componente conexo del dibujo necesita al menos uno, y un bucle de circulación cerrado necesita un nodo de referencia arbitrario — sin él, el nivel de presión queda indeterminado y el jacobiano es singular.","A hydraulic resistance only: Δp = Δp_design (Q/Q_design)^n, with n typically 2 for a fully turbulent coil. No thermal model, no capacity, no fouling.":"Únicamente una resistencia hidráulica: Δp = Δp_design (Q/Q_design)^n, con n típicamente 2 para una batería totalmente turbulenta. Sin modelo térmico, sin potencia, sin ensuciamiento.","A node is a junction with an elevation. Its demand is the flow taken out of the network there, in m³/h, positive out and negative in; demand is scaled by the global partial-load factor. A node that is not fixed has its pressure solved.":"Un nodo es una unión con una cota. Su demanda es el caudal extraído de la red en ese punto, en m³/h, positivo hacia fuera y negativo hacia dentro; la demanda se escala mediante el factor de carga parcial global. A un nodo que no es fijo se le calcula la presión.","A quadratic H(Q) through the shutoff head and one rated point, H = H0 s² − a q|q|, with the speed s the local speed times the global pump-speed factor, by the affinity law. Rated head must be below shutoff head. Reverse flow and operation past zero-head runout are extrapolations of that parabola and are warned, not modelled.":"Una H(Q) cuadrática que pasa por la altura a caudal nulo y un punto nominal, H = H0 s² − a q|q|, donde la velocidad s es la velocidad local multiplicada por el factor de velocidad global de la bomba, según la ley de semejanza. La altura nominal debe ser inferior a la altura a caudal nulo. El caudal inverso y el funcionamiento más allá del punto de altura nula son extrapolaciones de esa parábola y se advierten, no se modelan.","A sweep solves the same network many times. The N-1 screen closes each pipe and valve in turn and reports the lowest pressure and the highest velocity that follow. The Monte-Carlo samples pipe roughness (lognormal) and nodal demand (normal) on a Latin hypercube with rank correlation and reports P5/P50/P95 quantiles. The load profile runs 24 h or 8760 h of demand multipliers and integrates hydraulic pump energy. Sweeps go to same-origin Workers only when that is measurably cheaper than the round trip; the steady solve itself always stays on the main thread.":"Un barrido resuelve la misma red muchas veces. El análisis N-1 cierra por turnos cada tubería y válvula e indica la presión más baja y la velocidad más alta resultantes. Monte-Carlo muestrea la rugosidad de tubería (lognormal) y la demanda nodal (normal) en un hipercubo latino con correlación de rango e indica los cuantiles P5/P50/P95. El perfil de carga ejecuta 24 h u 8760 h de multiplicadores de demanda e integra la energía hidráulica de la bomba. Los barridos van a Workers del mismo origen solo cuando eso es medible más barato que el viaje de ida y vuelta; la resolución estacionaria en sí siempre permanece en el hilo principal.","Affinity law H ~ n^2 for the two-point quadratic pump curve.":"Ley de semejanza H ~ n^2 para la curva de bomba cuadrática de dos puntos.","All edge flows and all free-node heads are solved simultaneously by a damped Newton method on the scaled residuals, with a central-difference numerical Jacobian and a dense Gauss–Jordan solve with partial pivoting. It stops at a scaled residual of 2e-9 or at 60 iterations, and says which. The two residuals reported beside the iteration count are the physical ones: the largest nodal continuity error in m³/h and the largest edge energy error in metres.":"Todos los caudales de las aristas y todas las alturas de los nodos libres se resuelven simultáneamente mediante un método de Newton amortiguado sobre los residuos escalados, con un jacobiano numérico por diferencias centrales y una resolución de Gauss–Jordan densa con pivoteo parcial. Se detiene en un residuo escalado de 2e-9 o en 60 iteraciones, indicando cuál. Los dos residuos indicados junto al número de iteraciones son los físicos: el mayor error de continuidad nodal en m³/h y el mayor error de energía de arista en metros.","An iterative heuristic that closes the valves carrying more than their target flow until each is within about 2 % of it, at the current partial load. Rated Kv values are never modified — only the opening. Coupled or infeasible targets are reported rather than forced.":"Una heurística iterativa que cierra las válvulas que transportan más de su caudal objetivo hasta que cada una queda dentro de aproximadamente un 2% de él, a la carga parcial actual. Los valores nominales de Kv nunca se modifican — solo la apertura. Los objetivos acoplados o inviables se notifican en lugar de forzarse.","Analysis controls":"Controles de análisis","At least one fixed-pressure node is required in every connected component.":"Se requiere al menos un nodo de presión fija en cada componente conexo.","Auto-balance":"Autoequilibrado","Auto-balance valves":"Autoequilibrar válvulas","B control valve":"Válvula de control B","B supply":"Suministro B","Balance target @100% load":"Objetivo de equilibrado @100% de carga","Branch A":"Rama A","Branch B":"Rama B","A supply":"Suministro A","Click start node, then end node to add a heat exchanger.":"Haga clic en el nodo de inicio y luego en el nodo final para añadir un intercambiador.","C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156 — used only to quantify the Swamee-Jain scatter.":"C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156 — usado únicamente para cuantificar la dispersión de Swamee-Jain.","Click start node, then end node to add a pipe.":"Haga clic en el nodo de inicio y luego en el nodo final para añadir una tubería.","Click start node, then end node to add a valve.":"Haga clic en el nodo de inicio y luego en el nodo final para añadir una válvula.","Click suction node, then discharge node to add a pump.":"Haga clic en el nodo de aspiración y luego en el nodo de descarga para añadir una bomba.","Could not sweep the system curve over a usable range.":"No se pudo barrer la curva del sistema en un rango utilizable.","Darcy–Weisbach with the Swamee–Jain explicit friction factor above Re = 4000, 64/Re below Re = 2000 and a smoothstep blend between them. Diameter and roughness are entered in millimetres, length in metres. ΣK collects the bends, tees and fittings on the run; junction and fitting losses have to be entered here because the solver has no geometry to infer them from.":"Darcy–Weisbach con el factor de fricción explícito de Swamee–Jain por encima de Re = 4000, 64/Re por debajo de Re = 2000 y una mezcla suave entre ambos. El diámetro y la rugosidad se introducen en milímetros, la longitud en metros. ΣK agrupa los codos, tes y accesorios del tramo; las pérdidas de unión y de accesorios deben introducirse aquí porque el solucionador no tiene geometría de la que deducirlas.","Darcy–Weisbach; Swamee–Jain turbulent friction, 64/Re laminar, smooth interpolation through transition; minor-loss K included. Swamee–Jain is an":"Darcy–Weisbach; fricción turbulenta de Swamee–Jain, 64/Re laminar, interpolación suave a través de la transición; K de pérdida menor incluida. Swamee–Jain es una","Delete the selected element":"Eliminar el elemento seleccionado","Demand (+ out)":"Demanda (+ salida)","Demand is scaled by the global partial-load factor. Negative demand is injection. A fixed-pressure node reports the boundary exchange required to maintain its pressure.":"La demanda se escala mediante el factor de carga parcial global. Una demanda negativa es una inyección. Un nodo de presión fija informa del intercambio de contorno necesario para mantener su presión.","Demand rank corr.":"Correlación de rango de la demanda","Demand sd (normal)":"Demanda de (normal)","Demand ×":"Demanda ×","Density and kinematic viscosity are constants for the whole network. The partial-load factor scales every nodal demand, so a network whose demands are all zero is insensitive to it. The global pump-speed factor scales every pump on top of its own local speed.":"La densidad y la viscosidad cinemática son constantes para toda la red. El factor de carga parcial escala cada demanda nodal, por lo que una red cuyas demandas son todas nulas es insensible a él. El factor de velocidad global de la bomba escala cada bomba además de su propia velocidad local.","District-heating loop":"Bucle de calefacción urbana","Draw and solve arbitrary hydraulic networks with pipes, pumps, valves and heat exchangers. Steady-state flows, pressures, pump/system curves, hydraulic grade line, balancing and partial-load analysis.":"Dibuje y calcule redes hidráulicas arbitrarias con tuberías, bombas, válvulas e intercambiadores. Caudales y presiones en régimen estacionario, curvas de bomba/sistema, línea piezométrica, equilibrado y análisis de carga parcial.","Draw or load a network, then press Solve network.":"Dibuje o cargue una red, luego pulse Resolver red.","Drawing the network":"Dibujar la red","Each edge ID must start with a letter and contain only letters, digits, _ . : - (max 64 characters).":"Cada ID de arista debe empezar con una letra y contener solo letras, dígitos, _ . : - (máx. 64 caracteres).","Each node ID must start with a letter and contain only letters, digits, _ . : - (max 64 characters).":"Cada ID de nodo debe empezar con una letra y contener solo letras, dígitos, _ . : - (máx. 64 caracteres).","Edge energy:  h_a + z_a - h_b - z_b + H_pump(q) - h_loss(q) = 0":"Energía de la arista: h_a + z_a - h_b - z_b + H_pump(q) - h_loss(q) = 0","Ensemble sweeps":"Barridos de conjunto","Every network needs at least one fixed-pressure node per connected component; a closed circuit needs one arbitrary reference.":"Cada red necesita al menos un nodo de presión fija por componente conexo; un circuito cerrado necesita una referencia arbitraria.","Every node in this network has zero demand, and the profile multiplier scales nodal demands only — so every hour below is the same operating point. Give at least one node a demand to make the profile mean anything.":"Todos los nodos de esta red tienen demanda cero, y el multiplicador de perfil solo escala las demandas nodales — por lo que cada hora de abajo corresponde al mismo punto de funcionamiento. Asigne demanda a al menos un nodo para que el perfil tenga sentido.","Fixed gauge pressure boundary":"Contorno de presión manométrica fija","Flow [m³/h]":"Caudal [m³/h]","Flow-following loop coordinate":"Coordenada de bucle que sigue el caudal","Fluid and load":"Fluido y carga","Fluid density":"Densidad del fluido","Fluid density must be a positive finite number.":"La densidad del fluido debe ser un número finito positivo.","For every free node the solver enforces continuity. For every edge it enforces the steady Bernoulli equation using pressure head + elevation, pump head and signed component loss. Unknown edge flows and free-node pressure heads are solved simultaneously with a damped Newton method.":"Para cada nodo libre, el solucionador impone la continuidad. Para cada arista, impone la ecuación de Bernoulli estacionaria con altura de presión + cota, altura de bomba y pérdida con signo del componente. Los caudales de arista desconocidos y las alturas de presión de los nodos libres se resuelven simultáneamente mediante un método de Newton amortiguado.","Friction: f = 64/Re for Re <= 2000; Swamee-Jain f = 0.25 / [log10(eps/(3.7 D) + 5.74/Re^0.9)]^2 for Re >= 4000; smoothstep blend between":"Fricción: f = 64/Re para Re <= 2000; Swamee-Jain f = 0.25 / [log10(eps/(3.7 D) + 5.74/Re^0.9)]^2 para Re >= 4000; mezcla suave entre ambos","Gauge pressure":"Presión manométrica","Global pump-speed factor":"Factor de velocidad global de la bomba","Global pump-speed factor must be between 40 and 120%.":"El factor de velocidad global de la bomba debe estar entre 40 y 120%.","H. Cross, Analysis of Flow in Networks of Conduits or Conductors, Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936) — loop-correction method.":"H. Cross, Analysis of Flow in Networks of Conduits or Conductors, Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936) — método de corrección de bucle.","HGL excludes velocity head. Junction and fitting losses must be entered through K.":"La línea piezométrica excluye la altura de velocidad. Las pérdidas de unión y de accesorios deben introducirse mediante K.","HX design point":"Punto de diseño del intercambiador","Hagen-Poiseuille laminar closed form f = 64/Re — derived, used to grade the laminar branch.":"Forma cerrada laminar de Hagen-Poiseuille f = 64/Re — derivada, usada para evaluar la rama laminar.","Head / elevation [m]":"Altura / cota [m]","Head [m]":"Altura [m]","Head at rated flow":"Altura al caudal nominal","Heat exchanger":"Intercambiador de calor","Heat exchanger:":"Intercambiador:","Heat exchanger:  h_loss = (dp_design / (rho g)) (q / q_design)^n":"Intercambiador: h_loss = (dp_design / (rho g)) (q / q_design)^n","Heat exchangers":"Intercambiadores","Heat-exchanger exponent n between 1 and 3":"Exponente n del intercambiador entre 1 y 3","Hourly demand multipliers (24 values, comma separated)":"Multiplicadores horarios de demanda (24 valores, separados por comas)","How it is solved, and how well":"Cómo se resuelve, y con qué precisión","Hrated":"Hrated","Hydraulic grade line":"Línea piezométrica","Hydraulic grade line of the selected pump loop.":"Línea piezométrica del bucle de bomba seleccionado.","Hydraulic internal checks failed":"Fallo en las comprobaciones internas hidráulicas","Hydraulic network drawing canvas":"Lienzo de dibujo de la red hidráulica","Hydraulic pump energy ρgQH integrated over the period:":"Energía hidráulica de la bomba ρgQH integrada en el período:","IEC 60534-2-1 / metric Kv definition: Q[m3/h] = Kv sqrt(dp[bar]/SG).":"IEC 60534-2-1 / definición métrica de Kv: Q[m3/h] = Kv sqrt(dp[bar]/SG).","Imported global pump-speed factor must be between 40 and 120%.":"El factor de velocidad global de la bomba importado debe estar entre 40 y 120%.","Imported partial-load factor must be between 0 and 150%.":"El factor de carga parcial importado debe estar entre 0 y 150%.","Initial residual is not finite. Check component data.":"El residuo inicial no es finito. Compruebe los datos de los componentes.","Inside diameter":"Diámetro interior","It draws a hydraulic network — nodes joined by pipes, pumps, valves and heat exchangers — and solves the steady flows and pressures in it. Load the example, or place nodes and join them, give at least one node a fixed pressure, then press Solve network. Nothing is computed until you do: this is a run tool, and the result is marked stale the moment you change anything.":"Dibuja una red hidráulica — nodos unidos por tuberías, bombas, válvulas e intercambiadores — y resuelve los caudales y presiones estacionarios en ella. Cargue el ejemplo, o coloque nodos y únalos, dé a al menos un nodo una presión fija, luego pulse Resolver red. Nada se calcula hasta que lo haga: esta es una herramienta de ejecución, y el resultado se marca como obsoleto en cuanto cambia algo.","Kinematic viscosity must be a positive finite number.":"La viscosidad cinemática debe ser un número finito positivo.","Kv at 100%":"Kv al 100%","Kv design relation":"Relación de diseño Kv","Linear Kv":"Kv lineal","Load profile":"Perfil de carga","Load profile: every node in this network has zero demand and the profile multiplier scales nodal demands only, so every hour is the same operating point and the energy figure is one point multiplied by the number of hours.":"Perfil de carga: todos los nodos de esta red tienen demanda cero y el multiplicador de perfil solo escala las demandas nodales, por lo que cada hora es el mismo punto de funcionamiento y la cifra de energía es un punto multiplicado por el número de horas.","Loads three same-origin scripts beside the page — site-disclaimer.js, diagram-common.js and diagram-compute.classic.js (the classic build of the shared compute runtime). Nothing else is fetched, no third-party host is contacted, and nothing about the network the user draws is transmitted anywhere: every sweep runs in this browser, on the main thread or in same-origin Blob Workers created from diagram-compute.classic.js.":"Carga tres scripts del mismo origen junto a la página — site-disclaimer.js, diagram-common.js y diagram-compute.classic.js (la compilación clásica del motor de cálculo compartido). No se obtiene nada más, no se contacta ningún host de terceros, y nada sobre la red que el usuario dibuja se transmite a ningún sitio: cada barrido se ejecuta en este navegador, en el hilo principal o en Workers Blob del mismo origen creados a partir de diagram-compute.classic.js.","Loss [m]":"Pérdida [m]","Lowest p kPa(g)":"p más baja kPa(m)","Main return":"Retorno principal","Main supply":"Suministro principal","Max continuity residual":"Residuo de continuidad máx.","Max energy residual":"Residuo de energía máx.","Monte-Carlo samples":"Muestras de Monte-Carlo","Monte-Carlo seed":"Semilla de Monte-Carlo","N-1 screen":"Análisis N-1","Network drawing:":"Dibujo de la red:","Network files":"Archivos de red","Network loaded":"Red cargada","No HGL generated.":"No se generó ninguna línea piezométrica.","No continuous flow-following return path; showing a topological fallback path.":"No hay una ruta de retorno continua que siga el caudal; se muestra una ruta de reserva topológica.","No return path from pump discharge to suction. HGL needs a loop/path excluding the pump.":"No hay una ruta de retorno de la descarga de la bomba a la aspiración. La línea piezométrica necesita un bucle/ruta que excluya la bomba.","Nodes":"Nodos","Nothing to sample. Give the roughness a sigma above 0 (the network needs pipes), or the demands an sd above 0 on a network that has non-zero demands.":"Nada que muestrear. Asigne a la rugosidad una sigma superior a 0 (la red necesita tuberías), o a las demandas una de superior a 0 en una red con demandas no nulas.","Open a hydraulic-network JSON file":"Abrir un archivo JSON de red hidráulica","Open network JSON…":"Abrir JSON de red…","Outcome":"Resultado","Over limit":"Por encima del límite","P.K. Swamee & A.K. Jain, Explicit equations for pipe-flow problems, ASCE J. Hydraulics Div. 102(5) (1976) 657-664 — f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, stated for 1e-6 <= eps/D <= 1e-2 and 5e3 <= Re <= 1e8.":"P.K. Swamee & A.K. Jain, Explicit equations for pipe-flow problems, ASCE J. Hydraulics Div. 102(5) (1976) 657-664 — f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, indicado para 1e-6 <= eps/D <= 1e-2 y 5e3 <= Re <= 1e8.","Partial load 0 to 150 %, global pump speed 40 to 120 %":"Carga parcial 0 a 150%, velocidad global de la bomba 40 a 120%","Partial-load factor must be between 0 and 150%.":"El factor de carga parcial debe estar entre 0 y 150%.","Pipe":"Tubería","Pipe:":"Tubería:","Pipe:  h_loss = (f L/D + K) v^2 / (2 g),  v = q/A,  Re = v D / nu":"Tubería: h_loss = (f L/D + K) v^2 / (2 g), v = q/A, Re = v D / nu","Pipes":"Tuberías","Plant return":"Retorno de planta","Pointer":"Puntero","Positive edge flow follows its arrow.":"El caudal positivo de la arista sigue su flecha.","Pressure kPa(g)":"Presión kPa(m)","Properties":"Propiedades","Pump":"Bomba","Pump / system curve":"Curva de bomba/sistema","Pump / system curve — select a pump, then press Pump / system curve.":"Curva de bomba/sistema — seleccione una bomba, luego pulse Curva de bomba/sistema.","Pump H m":"Altura bomba m","Pump [m]":"Bomba [m]","Pump and system curve":"Curva de bomba y sistema","Pump discharge":"Descarga de la bomba","Pump kW (hydraulic)":"Bomba kW (hidráulica)","Pump rated head must be below shutoff head; reverse flow and beyond-runout operation are extrapolations and are warned":"La altura nominal de la bomba debe ser inferior a la altura a caudal nulo; el caudal inverso y el funcionamiento más allá del punto nulo son extrapolaciones y se advierten","Pump, two branches, coil and control valve — the shipped example":"Bomba, dos ramas, batería y válvula de control — el ejemplo incluido","Pump/system curve":"Curva de bomba/sistema","Pump:":"Bomba:","Pump:  H = H0 s^2 - a q|q|,  a = (H0 - H_rated)/q_rated^2,  s = local speed x global speed factor":"Bomba: H = H0 s^2 - a q|q|, a = (H0 - H_rated)/q_rated^2, s = velocidad local x factor de velocidad global","Pumps":"Bombas","Results":"Resultados","Return header":"Colector de retorno","Roughness rank corr.":"Correlación de rango de la rugosidad","Roughness σ (lognormal)":"Rugosidad σ (lognormal)","Run an N-1 screen, a Monte-Carlo or a load profile. Each one solves the network many times; the pump / system curve above is now the same kind of sweep.":"Ejecute un análisis N-1, un Monte-Carlo o un perfil de carga. Cada uno resuelve la red muchas veces; la curva de bomba/sistema anterior es ahora el mismo tipo de barrido.","Save network JSON":"Guardar JSON de red","Save network JSON writes the drawing, the components and the fluid as a versioned document; Open network JSON reads one back, validating every field before it touches the canvas. This is the network, not the calculation: the shared bar below carries the calculation record as JSON, CSV, a PDF report and a python script, and Copy link puts the whole network in a permalink.":"«Guardar JSON de red» escribe el dibujo, los componentes y el fluido como un documento versionado; «Abrir JSON de red» vuelve a leer uno, validando cada campo antes de que toque el lienzo. Esto es la red, no el cálculo: la barra compartida de abajo lleva el registro de cálculo como JSON, CSV, un informe PDF y un script de python, y «Copiar enlace» pone toda la red en un enlace permanente.","Select a node or a component on the drawing to edit it.":"Seleccione un nodo o un componente en el dibujo para editarlo.","Select a pump first":"Seleccione primero una bomba","Select moves and selects. Node places a node on empty canvas. Pipe, Pump, Valve and Heat exchanger each need two clicks: the start node, then the end node. The arrow drawn on a component is its positive direction — a negative solved flow means the fluid runs the other way. Delete removes the selected element, and every edit can be undone from the header.":"«Seleccionar» mueve y selecciona. «Nodo» coloca un nodo en el lienzo vacío. Tubería, Bomba, Válvula e Intercambiador necesitan cada uno dos clics: el nodo de inicio, luego el nodo final. La flecha dibujada en un componente es su dirección positiva — un caudal calculado negativo significa que el fluido circula en sentido contrario. «Eliminar» quita el elemento seleccionado, y cada edición puede deshacerse desde el encabezado.","Selected:":"Seleccionado:","Set target flow on at least one valve":"Establezca un caudal objetivo en al menos una válvula","Shutoff head H₀":"Altura a caudal nulo H₀","Solve failed":"Fallo en la resolución","Solved in":"Resuelto en","Solved simultaneously for all edge flows and free-node heads by a damped Newton method with a numerical Jacobian":"Resuelto simultáneamente para todos los caudales de arista y las alturas de nodos libres mediante un método de Newton amortiguado con un jacobiano numérico","Solver diverged. Check component data.":"El solucionador divergió. Compruebe los datos de los componentes.","Speed m/s":"Velocidad m/s","Static Δp a−b kPa":"Δp estática a−b kPa","Steady state, incompressible, single phase; constant density and viscosity":"Régimen estacionario, incompresible, monofásico; densidad y viscosidad constantes","Steady-state incompressible networks · ensemble sweeps on the shared compute runtime":"Redes estacionarias incompresibles · barridos de conjunto en el motor de cálculo compartido","Steady-state, incompressible and single-phase. Fluid properties are constant. Heat exchangers are hydraulic resistances only. Pump curves use shutoff head plus one rated point; reverse flow and operation beyond zero-head runout are extrapolations and are warned. Automatic balancing is an iterative valve-opening heuristic and cannot guarantee coupled or infeasible targets. In meshed networks the HGL plot shows one representative flow-following return path (or a labelled topological fallback), not every path; HGL excludes velocity head. Junction/fitting losses must be entered through K. The dense browser solver refuses models above 600 nonlinear unknowns. No water hammer, NPSH/cavitation, efficiency map or transient control model is included.":"Régimen estacionario, incompresible y monofásico. Las propiedades del fluido son constantes. Los intercambiadores son únicamente resistencias hidráulicas. Las curvas de bomba usan la altura a caudal nulo más un punto nominal; el caudal inverso y el funcionamiento más allá del punto nulo son extrapolaciones y se advierten. El equilibrado automático es una heurística iterativa de apertura de válvula y no puede garantizar objetivos acoplados o inviables. En redes malladas, el gráfico de la línea piezométrica muestra una ruta de retorno representativa que sigue el caudal (o una ruta de reserva topológica etiquetada), no todas las rutas; la línea piezométrica excluye la altura de velocidad. Las pérdidas de unión/accesorios deben introducirse mediante K. El solucionador denso del navegador rechaza modelos con más de 600 incógnitas no lineales. No se incluye golpe de ariete, NPSH/cavitación, mapa de rendimiento ni modelo de control transitorio.","Supply header":"Colector de suministro","Swamee-Jain is published for 1e-6 <= eps/D <= 1e-2 and 5e3 <= Re <= 1e8; it differs from the Colebrook root by up to about 3 % over that range":"Swamee-Jain está publicado para 1e-6 <= eps/D <= 1e-2 y 5e3 <= Re <= 1e8; difiere de la raíz de Colebrook hasta en aproximadamente un 3% en ese rango","System curve requires positive solved flow through the selected pump.":"La curva del sistema requiere un caudal calculado positivo a través de la bomba seleccionada.","The N-1 screen closes pipes and valves one at a time; this network has neither.":"El análisis N-1 cierra tuberías y válvulas de una en una; esta red no tiene ninguna.","The ensemble sweep results also recorded here — pump/system curve, N-1 screen, Monte-Carlo quantiles, load-profile energy — are NOT reproduced: each is tens to thousands of further solves, and the Monte-Carlo additionally rests on the shared runtime’s Latin-hypercube design, its rank-correlation transform and its DDSketch quantile tallies, none of which this single file carries.":"Los resultados de barrido de conjunto también registrados aquí — curva de bomba/sistema, análisis N-1, cuantiles de Monte-Carlo, energía del perfil de carga — NO se reproducen: cada uno representa desde decenas hasta miles de resoluciones adicionales, y Monte-Carlo además se apoya en el diseño de hipercubo latino del motor compartido, su transformación de correlación de rango y sus recuentos de cuantiles DDSketch, de los que este único archivo no lleva nada.","The head along one return path from the pump discharge back to its suction, drawn against the elevation profile. In a meshed network there are many such paths; the plot shows one flow-following path, or a labelled topological fallback when no continuous flow-following path exists. It excludes velocity head.":"La altura a lo largo de una ruta de retorno desde la descarga de la bomba hasta su aspiración, trazada frente al perfil de cota. En una red mallada hay muchas rutas de este tipo; el gráfico muestra una ruta que sigue el caudal, o una ruta de reserva topológica etiquetada cuando no existe ninguna ruta continua que siga el caudal. Excluye la altura de velocidad.","The hourly profile needs exactly 24 finite, non-negative multipliers.":"El perfil horario necesita exactamente 24 multiplicadores finitos y no negativos.","The load profile reports pump energy; this network has no pump.":"El perfil de carga informa de la energía de la bomba; esta red no tiene bomba.","The metric Kv relation, dp[bar] = SG (q[m³/h] / Kv_eff)². Kv_eff is Kv × opening for a linear characteristic and Kv × 50^(opening−1) for equal percentage. The balance target is the flow the auto-balance heuristic tries to reach at 100 % load by closing the valve; rated Kv is never changed.":"La relación métrica de Kv, dp[bar] = SG (q[m³/h] / Kv_eff)². Kv_eff es Kv × apertura para una característica lineal y Kv × 50^(apertura−1) para porcentaje igual. El objetivo de equilibrado es el caudal que la heurística de autoequilibrado intenta alcanzar al 100% de carga cerrando la válvula; el Kv nominal nunca se cambia.","The network changed while the sweep was running. Solve it again, then redraw the curve.":"La red cambió mientras se ejecutaba el barrido. Resuélvala de nuevo y luego vuelva a trazar la curva.","The shared interface layer (diagram-ui.js) did not load. Every input, the solver, the drawing, the sweeps and every export still work; the page falls back to one plain column.":"La capa de interfaz compartida (diagram-ui.js) no se cargó. Cada entrada, el solucionador, el dibujo, los barridos y cada exportación siguen funcionando; la página vuelve a una única columna simple.","Topological fallback path coordinate":"Coordenada de la ruta de reserva topológica","Unsupported hydraulic-network schema version":"Versión de esquema de red hidráulica no admitida","Valve":"Válvula","Valve opening 0.1 % to 100 %":"Apertura de válvula 0,1% a 100%","Valve:":"Válvula:","Valve:  dp[bar] = SG (q[m3/h] / Kv_eff)^2,  Kv_eff = Kv * o (linear) or Kv * 50^(o-1) (equal percentage), o = opening/100":"Válvula: dp[bar] = SG (q[m3/h] / Kv_eff)^2, Kv_eff = Kv * o (lineal) o Kv * 50^(o-1) (porcentaje igual), o = apertura/100","Valves":"Válvulas","With a pump selected, the network is re-solved 33 times with that pump forced to a series of flows. The system curve is the head the network demands at each flow; the pump curve is what the pump delivers; they cross at the operating point. Every point is solved cold, so the curve does not depend on the order the points were computed in.":"Con una bomba seleccionada, la red se vuelve a resolver 33 veces con esa bomba forzada a una serie de caudales. La curva del sistema es la altura que la red exige en cada caudal; la curva de la bomba es lo que la bomba entrega; se cruzan en el punto de funcionamiento. Cada punto se resuelve en frío, por lo que la curva no depende del orden en que se calcularon los puntos.","at node":"en el nodo","diagram-compute.classic.js did not load; sweeps run on the main thread and the Monte-Carlo sweep is unavailable because its Latin-hypercube design and quantile tallies live in the runtime":"diagram-compute.classic.js no se cargó; los barridos se ejecutan en el hilo principal y el barrido Monte-Carlo no está disponible porque su diseño de hipercubo latino y sus recuentos de cuantiles viven en el motor","every case was evaluated in index order on one thread, with no shared warm start":"cada caso se evaluó en orden de índice en un solo hilo, sin arranque en caliente compartido","hL signed m":"hL con signo m","iterations; scaled residual":"iteraciones; residuo escalado","kPa (gauge)":"kPa (manométrico)","kW (hydraulic)":"kW (hidráulica)","kWh (hydraulic, rho g Q H; no pump or motor efficiency)":"kWh (hidráulica, rho g Q H; sin rendimiento de bomba ni motor)","metric Kv relation, with optional opening law.":"relación métrica de Kv, con ley de apertura opcional.","p [kPa g]":"p [kPa m]","pump affinity scaling":"escalado por semejanza de la bomba","pump discharge":"descarga de la bomba","pump rated point":"punto nominal de la bomba","pump suction":"aspiración de la bomba","quadratic H(Q) from shutoff head and one rated point, scaled by affinity law speed².":"H(Q) cuadrática a partir de la altura a caudal nulo y un punto nominal, escalada por la ley de semejanza velocidad².","select a pump":"seleccione una bomba","selected pump loop":"bucle de bomba seleccionado","signed reverse passive loss":"pérdida pasiva inversa con signo","the complete steady-state network solve of this page for the network currently on the canvas: the same continuity and energy equations, the same pipe/valve/heat-exchanger/pump component laws, and the same damped Newton iteration on scaled residuals. Charts, auto-balancing and the HGL path search are not part of the export.":"la resolución completa en régimen estacionario de la red de esta página para la red actualmente en el lienzo: las mismas ecuaciones de continuidad y energía, las mismas leyes de componentes tubería/válvula/intercambiador/bomba, y la misma iteración de Newton amortiguada sobre residuos escalados. Los gráficos, el autoequilibrado y la búsqueda de ruta de la línea piezométrica no forman parte de la exportación.","unrecognised hydraulic-network state payload":"datos de estado de red hidráulica no reconocidos","v2 build: the steady-state solve recorded above is the v1 tool’s solver unchanged — same residual assembly, same central-difference Jacobian, same dense Gauss-Jordan with partial pivoting, same damped Newton line search. What this build adds is repeated solves (pump/system curve, N-1 screen, Monte-Carlo, load profile) on the shared compute runtime diagram-compute.classic.js.":"compilación v2: la resolución en régimen estacionario registrada arriba es el solucionador sin cambios de la herramienta v1 — el mismo ensamblaje de residuos, el mismo jacobiano por diferencias centrales, el mismo método de Gauss-Jordan denso con pivoteo parcial, la misma búsqueda lineal de Newton amortiguada. Lo que esta compilación añade son resoluciones repetidas (curva de bomba/sistema, análisis N-1, Monte-Carlo, perfil de carga) en el motor de cálculo compartido diagram-compute.classic.js.","↖ Select":"↖ Seleccionar","━ Elevation":"━ Cota","━ Pipe":"━ Tubería","▶ Pump":"▶ Bomba","◇ Valve":"◇ Válvula","● Node":"● Nodo","Hydraulic Network Solver":"Solucionador de redes hidráulicas","Draw an arbitrary network of pipes, nodes, pumps, valves and heat exchangers and solve the steady-state flows and pressures.":"Dibuje una red arbitraria de tuberías, nodos, bombas, válvulas e intercambiadores y calcule caudales y presiones en régimen estacionario.","Draw an arbitrary network of pipes, nodes, pumps, valves and heat exchangers and solve the steady-state flows and pressures. Includes Darcy–Weisbach pipe losses, pump and system curves, hydraulic grade line, valve balancing, partial-load scaling, and JSON/CSV import-export.":"Dibuje una red arbitraria de tuberías, nodos, bombas, válvulas e intercambiadores y calcule caudales y presiones en régimen estacionario. Incluye Darcy–Weisbach, curvas de bomba y sistema, línea piezométrica, equilibrado de válvulas, carga parcial e importación/exportación JSON/CSV.","Steady solve:":"Cálculo estacionario:","backend:":"backend:","idle":"inactivo","repeatable":"repetible","solved":"resuelto","free":"libre","pipe":"tubería","pump":"bomba","valve":"válvula","hx":"intercambiador","━ System":"━ Sistema","━ HGL":"━ Línea piezométrica","Hydraulic Network Solver (v2)":"Solucionador de redes hidráulicas (v2)","Pump and motor efficiency are not modelled, so this is not shaft or electrical energy.":"No se modelan los rendimientos de bomba y motor, así que no es energía en el eje ni energía eléctrica.","HGL m":"HGL m","HGL":"HGL","p P5 kPa(g)":"p P5 kPa(m)"};
const siteLang=()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q&&String(q).slice(0,2).toLowerCase()==='es')return'es'}catch(e){}try{if(localStorage.getItem('diagram_site_lang')==='es'||localStorage.getItem('diagram_lang')==='es')return'es'}catch(e){}return String(window.__diagramLang||'').slice(0,2).toLowerCase()};

const attrs=['placeholder','title','aria-label','alt'];
function tr(s){if(s==null)return s;const x=String(s);if(Object.prototype.hasOwnProperty.call(ES,x))return ES[x];const a=x.match(/^\s*/)[0],b=x.match(/\s*$/)[0],t=x.trim();if(Object.prototype.hasOwnProperty.call(ES,t))return a+ES[t]+b;const pz=t&&window.__hnPatterns?window.__hnPatterns.translate('es',t,ES):null;if(pz!=null)return a+pz+b;const lw=window.DiagramUI&&DiagramUI.current&&typeof DiagramUI.current.t==='function'?DiagramUI.current.t('learn'):null;if(lw&&t.indexOf(lw+': ')===0){const k=t.slice(lw.length+2);if(Object.prototype.hasOwnProperty.call(ES,k))return a+lw+': '+ES[k]+b}return x}
function node(n){if(!n)return;if(n.nodeType===3){const p=n.parentElement;if(p&&!/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(p.tagName)){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}return}if(n.nodeType!==1)return;if(/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(n.tagName))return;for(const a of attrs)if(n.hasAttribute(a)){const v=n.getAttribute(a),w=tr(v);if(w!==v)n.setAttribute(a,w)}if(n.tagName==='INPUT'&&/^(button|submit|reset)$/i.test(n.type||'')){const v=n.value,w=tr(v);if(w!==v)n.value=w}const tw=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let q;while(q=tw.nextNode())node(q);for(const e of n.querySelectorAll('*'))for(const a of attrs)if(e.hasAttribute(a)){const v=e.getAttribute(a),w=tr(v);if(w!==v)e.setAttribute(a,w)}}
const run=()=>{node(document.body);const tt=document.querySelector('title');if(tt)node(tt)};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')node(m.target);else if(m.type==='attributes'){const el=m.target,v=el.getAttribute(m.attributeName),w=tr(v);if(v!=null&&w!==v)el.setAttribute(m.attributeName,w)}else for(const n of m.addedNodes)node(n)}}).observe(document.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:attrs});
})();
