алежать середовищу виконання, і ця збірка не підмінить інший семплер, представивши це тим самим експериментом.","This sweep needs diagram-compute.classic.js: its \"":"Ця розгортка потребує diagram-compute.classic.js: її \"","Type":"Тип","Velocity limit":"Ліміт швидкості","What this tool does":"Що робить цей інструмент","a Worker case was checked against the same case solved on the main thread before any sweep was offered":"випадок Worker було звірено з тим самим випадком, розрахованим в основному потоці, перш ніж було запропоновано будь-яку розгортку","and 5·10":"та 5·10","arithmetic, and that rule is what governs on a platform whose libm rounds differently.":"арифметика, і саме це правило керує на платформі, чия libm округлює інакше.","at opening limit:":"на межі відкриття:","cancelled by the user":"скасовано користувачем","cancelling…":"скасування…","central-difference Jacobian, the damped line search and the linear solve are all the":"якобіан центральних різниць, демпфований лінійний пошук і лінійний розв'язок — усі є","delete,backspace":"видалити,backspace","diagram-compute.classic.js is absent, so the sweep ran as one blocking main-thread loop, exactly as v1 did":"diagram-compute.classic.js відсутній, тому розгортка виконувалася як один блокувальний цикл в основному потоці, точно як у v1","explicit approximation":"явна апроксимація","gate then bounds the result at roughly 1e-7 relative.":"поріг тоді обмежує результат приблизно 1e-7 відносно.","halts at a scaled residual of 2e-9, worth about 1e-7 relative) rather than by the":"зупиняється при масштабованому залишку 2e-9, що становить приблизно 1e-7 відносно) а не через","laminar friction":"ламінарне тертя","main thread":"основний потік","no Worker pool could be created (":"не вдалося створити пул Worker (","no result":"немає результату","no runtime; one blocking main-thread loop":"немає середовища виконання; один блокувальний цикл в основному потоці","no sweep has run yet; the interactive solve is always on the main thread":"розгортку ще не виконано; інтерактивний розрахунок завжди в основному потоці","no sweep run":"розгортку не виконано","nodes,":"вузлів,","none (diagram-compute.classic.js absent)":"немає (diagram-compute.classic.js відсутній)","none: every recorded output reproduces bit for bit on this platform. What could":"немає: кожен записаний результат відтворюється біт у біт на цій платформі. Що могло б","nothing is imported and nothing is substituted. The residual assembly, the":"нічого не імпортується і нічого не підміняється. Складання залишку,","operating point":"робоча точка","path taken here is the path the page took.":"шлях, пройдений тут, — це шлях, який пройшла сторінка.","preliminary assessment":"попередня оцінка","still separate the two is a C library whose exp/log/pow round differently in the last":"усе ще розділяють ці два — це бібліотека C, чиї exp/log/pow округлюють інакше в останньому","technical exploration":"технічне дослідження","the Worker case failed:":"випадок Worker не вдався:","the Worker path did not reproduce the main-thread solve (":"шлях Worker не відтворив розрахунок основного потоку (","the Worker path failed during this sweep (":"шлях Worker не вдався під час цієї розгортки (","the network on the canvas is not solvable, so no comparison was possible":"мережа на полотні нерозв'язна, тому порівняння було неможливим","the shared runtime failed to start (":"спільне середовище виконання не запустилося (","the shared runtime is loaded; sweeps run on the main thread":"спільне середовище виконання завантажено; розгортки виконуються в основному потоці","this browser exposes no Worker; sweeps run on the main thread":"цей браузер не надає Worker; розгортки виконуються в основному потоці","to Colebrook–White, published for 10":"до Colebrook–White, опубліковано для 10","unknown sweep case kind:":"невідомий тип випадку розгортки:","worst relative difference":"найгірша відносна різниця","· design":"· розрахунок","— THE ACCURACY BOUND IS VOID FOR AT LEAST ONE TALLY":"— МЕЖА ТОЧНОСТІ НЕДІЙСНА ПРИНАЙМНІ ДЛЯ ОДНОГО ПІДСУМКУ","; over that box it differs from the Colebrook root by up to about 3% in f, and by more outside it. The 2000<Re<4000 blend is a numerical bridge, not a resolved transition model. Pipes running outside the published box are listed as a warning after each solve.":"; у межах цього діапазону відрізняється від кореня рівняння Colebrook не більш як приблизно на 3% за f, а поза його межами — більше. Змішування 2000<Re<4000 є числовим містком, а не розв'язаною моделлю перехідного режиму. Труби, що виходять за межі опублікованого діапазону, перелічуються як попередження після кожного розрахунку.","A coil":"Калорифер A","A fixed-pressure node fixes gauge pressure; its elevation is still part of total head. A demand node removes flow from the network. Negative demand injects flow. Closed circulating systems need one arbitrary pressure reference node.":"Вузол з фіксованим тиском фіксує надлишковий тиск; його висота все одно є частиною повного напору. Вузол навантаження вилучає витрату з мережі. Від'ємне навантаження нагнітає витрату. Закритим циркуляційним системам потрібен один довільний опорний вузол тиску.","A fixed-pressure node prescribes gauge pressure instead of solving it; its elevation still counts towards total head, and the solver reports the boundary exchange needed to hold that pressure. Every connected component of the drawing needs at least one, and a closed circulating loop needs one arbitrary reference node — without it the pressure level is undetermined and the Jacobian is singular.":"Вузол з фіксованим тиском задає надлишковий тиск замість того, щоб його розраховувати; його висота все одно враховується в повному напорі, а розв'язувач звітує про граничний обмін, потрібний для утримання цього тиску. Кожній зв'язній частині креслення потрібен принаймні один такий вузол, а закритому циркуляційному контуру потрібен один довільний опорний вузол — без нього рівень тиску не визначений, а якобіан вироджений.","A hydraulic resistance only: Δp = Δp_design (Q/Q_design)^n, with n typically 2 for a fully turbulent coil. No thermal model, no capacity, no fouling.":"Лише гідравлічний опір: Δp = Δp_design (Q/Q_design)^n, де n зазвичай 2 для повністю турбулентного калорифера. Без теплової моделі, без потужності, без забруднення.","A node is a junction with an elevation. Its demand is the flow taken out of the network there, in m³/h, positive out and negative in; demand is scaled by the global partial-load factor. A node that is not fixed has its pressure solved.":"Вузол — це з'єднання з висотою. Його навантаження — це витрата, вилучена з мережі в цьому місці, в м³/год, додатна назовні й від'ємна всередину; навантаження масштабується глобальним коефіцієнтом часткового навантаження. Для вузла, що не є фіксованим, тиск розраховується.","A quadratic H(Q) through the shutoff head and one rated point, H = H0 s² − a q|q|, with the speed s the local speed times the global pump-speed factor, by the affinity law. Rated head must be below shutoff head. Reverse flow and operation past zero-head runout are extrapolations of that parabola and are warned, not modelled.":"Квадратична H(Q) через напір при нульовій витраті й одну номінальну точку, H = H0 s² − a q|q|, де швидкість s — це локальна швидкість, помножена на глобальний коефіцієнт швидкості насоса, за законом подібності. Номінальний напір має бути нижчим за напір при нульовій витраті. Зворотна витрата та робота за межею нульового напору є екстраполяціями цієї параболи й позначаються попередженням, а не моделюються.","A sweep solves the same network many times. The N-1 screen closes each pipe and valve in turn and reports the lowest pressure and the highest velocity that follow. The Monte-Carlo samples pipe roughness (lognormal) and nodal demand (normal) on a Latin hypercube with rank correlation and reports P5/P50/P95 quantiles. The load profile runs 24 h or 8760 h of demand multipliers and integrates hydraulic pump energy. Sweeps go to same-origin Workers only when that is measurably cheaper than the round trip; the steady solve itself always stays on the main thread.":"Розгортка розраховує ту саму мережу багато разів. Скринінг N-1 по черзі закриває кожну трубу та клапан і звітує про найнижчий тиск і найвищу швидкість, що з цього випливають. Монте-Карло семплює шорсткість труб (логнормальний розподіл) і вузлове навантаження (нормальний розподіл) на латинському гіперкубі з ранговою кореляцією та звітує про квантилі P5/P50/P95. Профіль навантаження проходить 24 год або 8760 год множників навантаження та інтегрує гідравлічну енергію насоса. Розгортки передаються у Workers того самого джерела лише коли це вимірно дешевше за передачу туди й назад; сам усталений розрахунок завжди лишається в основному потоці.","Affinity law H ~ n^2 for the two-point quadratic pump curve.":"Закон подібності H ~ n^2 для квадратичної двоточкової кривої насоса.","All edge flows and all free-node heads are solved simultaneously by a damped Newton method on the scaled residuals, with a central-difference numerical Jacobian and a dense Gauss–Jordan solve with partial pivoting. It stops at a scaled residual of 2e-9 or at 60 iterations, and says which. The two residuals reported beside the iteration count are the physical ones: the largest nodal continuity error in m³/h and the largest edge energy error in metres.":"Усі витрати на ребрах і всі напори вільних вузлів розраховуються одночасно демпфованим методом Ньютона за масштабованими залишками, з чисельним якобіаном центральних різниць і щільним розв'язком Гаусса–Жордана з частковим вибором головного елемента. Зупинка відбувається при масштабованому залишку 2e-9 або на 60-й ітерації, із зазначенням, що саме спрацювало. Два залишки, наведені поряд з кількістю ітерацій, є фізичними: найбільша похибка вузлової безперервності в м³/год і найбільша похибка енергії ребра в метрах.","An iterative heuristic that closes the valves carrying more than their target flow until each is within about 2 % of it, at the current partial load. Rated Kv values are never modified — only the opening. Coupled or infeasible targets are reported rather than forced.":"Ітеративна евристика, яка закриває заслінки клапанів, що пропускають більше за свою цільову витрату, доки кожна не опиниться в межах приблизно 2% від неї, при поточному частковому навантаженні. Номінальні значення Kv ніколи не змінюються — лише відкриття. Пов'язані або недосяжні цілі повідомляються, а не форсуються.","Analysis controls":"Керування аналізом","At least one fixed-pressure node is required in every connected component.":"У кожній зв'язній частині потрібен принаймні один вузол з фіксованим тиском.","Auto-balance":"Автобалансування","Auto-balance valves":"Автобалансування клапанів","B control valve":"Регулювальний клапан B","B supply":"Подача B","Balance target @100% load":"Ціль балансування @100% навантаження","Branch A":"Гілка A","Branch B":"Гілка B","A supply":"Подача A","Click start node, then end node to add a heat exchanger.":"Клацніть на початковому вузлі, потім на кінцевому, щоб додати теплообмінник.","C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156 — used only to quantify the Swamee-Jain scatter.":"C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156 — використовується лише для кількісної оцінки розкиду Swamee-Jain.","Click start node, then end node to add a pipe.":"Клацніть на початковому вузлі, потім на кінцевому, щоб додати трубу.","Click start node, then end node to add a valve.":"Клацніть на початковому вузлі, потім на кінцевому, щоб додати клапан.","Click suction node, then discharge node to add a pump.":"Клацніть на вузлі всмоктування, потім на вузлі нагнітання, щоб додати насос.","Could not sweep the system curve over a usable range.":"Не вдалося розгорнути криву мережі у придатному діапазоні.","Darcy–Weisbach with the Swamee–Jain explicit friction factor above Re = 4000, 64/Re below Re = 2000 and a smoothstep blend between them. Diameter and roughness are entered in millimetres, length in metres. ΣK collects the bends, tees and fittings on the run; junction and fitting losses have to be entered here because the solver has no geometry to infer them from.":"Дарсі–Вейсбах з явним коефіцієнтом тертя Swamee–Jain при Re вище 4000, 64/Re нижче Re 2000 і плавним змішуванням між ними. Діаметр і шорсткість вводяться в міліметрах, довжина в метрах. ΣK збирає коліна, трійники та фасонні частини на ділянці; втрати у з'єднаннях і фасонних частинах слід вводити тут, оскільки розв'язувач не має геометрії, з якої можна було б їх вивести.","Darcy–Weisbach; Swamee–Jain turbulent friction, 64/Re laminar, smooth interpolation through transition; minor-loss K included. Swamee–Jain is an":"Дарсі–Вейсбах; турбулентне тертя Swamee–Jain, 64/Re ламінарне, плавна інтерполяція через перехідний режим; місцевий опір K включено. Swamee–Jain — це","Delete the selected element":"Видалити вибраний елемент","Demand (+ out)":"Навантаження (+ назовні)","Demand is scaled by the global partial-load factor. Negative demand is injection. A fixed-pressure node reports the boundary exchange required to maintain its pressure.":"Навантаження масштабується глобальним коефіцієнтом часткового навантаження. Від'ємне навантаження — це нагнітання. Вузол з фіксованим тиском звітує про граничний обмін, потрібний для утримання свого тиску.","Demand rank corr.":"Рангова кореляція навантаження","Demand sd (normal)":"Ст.відх. навантаження (нормальний розподіл)","Demand ×":"Навантаження ×","Density and kinematic viscosity are constants for the whole network. The partial-load factor scales every nodal demand, so a network whose demands are all zero is insensitive to it. The global pump-speed factor scales every pump on top of its own local speed.":"Густина та кінематична в'язкість є сталими для всієї мережі. Коефіцієнт часткового навантаження масштабує кожне вузлове навантаження, тож мережа, у якій усі навантаження нульові, нечутлива до нього. Глобальний коефіцієнт швидкості насоса масштабує кожен насос додатково до його власної локальної швидкості.","District-heating loop":"Контур теплопостачання","Draw and solve arbitrary hydraulic networks with pipes, pumps, valves and heat exchangers. Steady-state flows, pressures, pump/system curves, hydraulic grade line, balancing and partial-load analysis.":"Малюйте та розраховуйте довільні гідравлічні мережі з трубами, насосами, клапанами та теплообмінниками. Усталені витрати, тиски, криві насоса/мережі, гідравлічна лінія, балансування та аналіз часткового навантаження.","Draw or load a network, then press Solve network.":"Намалюйте або завантажте мережу, потім натисніть «Розрахувати мережу».","Drawing the network":"Малювання мережі","Each edge ID must start with a letter and contain only letters, digits, _ . : - (max 64 characters).":"Кожен ID ребра має починатися з літери й містити лише літери, цифри, _ . : - (макс. 64 символи).","Each node ID must start with a letter and contain only letters, digits, _ . : - (max 64 characters).":"Кожен ID вузла має починатися з літери й містити лише літери, цифри, _ . : - (макс. 64 символи).","Edge energy:  h_a + z_a - h_b - z_b + H_pump(q) - h_loss(q) = 0":"Енергія ребра: h_a + z_a - h_b - z_b + H_pump(q) - h_loss(q) = 0","Ensemble sweeps":"Ансамблеві розгортки","Every network needs at least one fixed-pressure node per connected component; a closed circuit needs one arbitrary reference.":"Кожній мережі потрібен принаймні один вузол з фіксованим тиском на кожну зв'язну частину; закритому контуру потрібна одна довільна опорна точка.","Every node in this network has zero demand, and the profile multiplier scales nodal demands only — so every hour below is the same operating point. Give at least one node a demand to make the profile mean anything.":"Кожен вузол цієї мережі має нульове навантаження, а множник профілю масштабує лише вузлові навантаження — тож кожна година нижче відповідає тій самій робочій точці. Задайте навантаження хоча б для одного вузла, щоб профіль мав сенс.","Fixed gauge pressure boundary":"Межа з фіксованим надлишковим тиском","Flow [m³/h]":"Витрата [м³/год]","Flow-following loop coordinate":"Координата контуру, що слідує за витратою","Fluid and load":"Рідина та навантаження","Fluid density":"Густина рідини","Fluid density must be a positive finite number.":"Густина рідини має бути додатним скінченним числом.","For every free node the solver enforces continuity. For every edge it enforces the steady Bernoulli equation using pressure head + elevation, pump head and signed component loss. Unknown edge flows and free-node pressure heads are solved simultaneously with a damped Newton method.":"Для кожного вільного вузла розв'язувач забезпечує безперервність. Для кожного ребра він забезпечує усталене рівняння Бернуллі з напором тиску + висотою, напором насоса та знаковою втратою компонента. Невідомі витрати на ребрах і напори тиску вільних вузлів розраховуються одночасно демпфованим методом Ньютона.","Friction: f = 64/Re for Re <= 2000; Swamee-Jain f = 0.25 / [log10(eps/(3.7 D) + 5.74/Re^0.9)]^2 for Re >= 4000; smoothstep blend between":"Тертя: f = 64/Re для Re <= 2000; Swamee-Jain f = 0.25 / [log10(eps/(3.7 D) + 5.74/Re^0.9)]^2 для Re >= 4000; плавне змішування між ними","Gauge pressure":"Надлишковий тиск","Global pump-speed factor":"Глобальний коефіцієнт швидкості насоса","Global pump-speed factor must be between 40 and 120%.":"Глобальний коефіцієнт швидкості насоса має бути в межах 40–120%.","H. Cross, Analysis of Flow in Networks of Conduits or Conductors, Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936) — loop-correction method.":"H. Cross, Analysis of Flow in Networks of Conduits or Conductors, Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936) — метод контурної корекції.","HGL excludes velocity head. Junction and fitting losses must be entered through K.":"Гідравлічна лінія не враховує швидкісний напір. Втрати у з'єднаннях і фасонних частинах слід вводити через K.","HX design point":"Розрахункова точка теплообмінника","Hagen-Poiseuille laminar closed form f = 64/Re — derived, used to grade the laminar branch.":"Аналітична ламінарна форма Hagen-Poiseuille f = 64/Re — виведена, використовується для оцінки ламінарної гілки.","Head / elevation [m]":"Напір / висота [м]","Head [m]":"Напір [м]","Head at rated flow":"Напір при номінальній витраті","Heat exchanger":"Теплообмінник","Heat exchanger:":"Теплообмінник:","Heat exchanger:  h_loss = (dp_design / (rho g)) (q / q_design)^n":"Теплообмінник: h_loss = (dp_design / (rho g)) (q / q_design)^n","Heat exchangers":"Теплообмінники","Heat-exchanger exponent n between 1 and 3":"Показник степеня теплообмінника n у межах 1–3","Hourly demand multipliers (24 values, comma separated)":"Погодинні множники навантаження (24 значення через кому)","How it is solved, and how well":"Як це розраховується, і наскільки точно","Hrated":"Hrated","Hydraulic grade line":"Гідравлічна лінія","Hydraulic grade line of the selected pump loop.":"Гідравлічна лінія вибраного контуру насоса.","Hydraulic internal checks failed":"Внутрішні гідравлічні перевірки не пройдені","Hydraulic network drawing canvas":"Полотно креслення гідравлічної мережі","Hydraulic pump energy ρgQH integrated over the period:":"Гідравлічна енергія насоса ρgQH, інтегрована за період:","IEC 60534-2-1 / metric Kv definition: Q[m3/h] = Kv sqrt(dp[bar]/SG).":"IEC 60534-2-1 / метричне визначення Kv: Q[м3/год] = Kv sqrt(dp[бар]/SG).","Imported global pump-speed factor must be between 40 and 120%.":"Імпортований глобальний коефіцієнт швидкості насоса має бути в межах 40–120%.","Imported partial-load factor must be between 0 and 150%.":"Імпортований коефіцієнт часткового навантаження має бути в межах 0–150%.","Initial residual is not finite. Check component data.":"Початковий залишок не є скінченним. Перевірте дані компонентів.","Inside diameter":"Внутрішній діаметр","It draws a hydraulic network — nodes joined by pipes, pumps, valves and heat exchangers — and solves the steady flows and pressures in it. Load the example, or place nodes and join them, give at least one node a fixed pressure, then press Solve network. Nothing is computed until you do: this is a run tool, and the result is marked stale the moment you change anything.":"Він малює гідравлічну мережу — вузли, з'єднані трубами, насосами, клапанами та теплообмінниками — і розраховує усталені витрати й тиски в ній. Завантажте приклад або розмістіть вузли та з'єднайте їх, задайте фіксований тиск принаймні для одного вузла, потім натисніть «Розрахувати мережу». Нічого не обчислюється, поки ви цього не зробите: це інструмент запуску, і результат позначається застарілим, щойно ви щось змінюєте.","Kinematic viscosity must be a positive finite number.":"Кінематична в'язкість має бути додатним скінченним числом.","Kv at 100%":"Kv при 100%","Kv design relation":"Розрахункове співвідношення Kv","Linear Kv":"Лінійна Kv","Load profile":"Профіль навантаження","Load profile: every node in this network has zero demand and the profile multiplier scales nodal demands only, so every hour is the same operating point and the energy figure is one point multiplied by the number of hours.":"Профіль навантаження: кожен вузол цієї мережі має нульове навантаження, а множник профілю масштабує лише вузлові навантаження, тож кожна година відповідає тій самій робочій точці, а показник енергії — це одна точка, помножена на кількість годин.","Loads three same-origin scripts beside the page — site-disclaimer.js, diagram-common.js and diagram-compute.classic.js (the classic build of the shared compute runtime). Nothing else is fetched, no third-party host is contacted, and nothing about the network the user draws is transmitted anywhere: every sweep runs in this browser, on the main thread or in same-origin Blob Workers created from diagram-compute.classic.js.":"Завантажує три скрипти з того самого джерела, що й сторінка, — site-disclaimer.js, diagram-common.js і diagram-compute.classic.js (класична збірка спільного середовища обчислень). Більше нічого не завантажується, жоден сторонній хост не опитується, і жодні дані про намальовану користувачем мережу нікуди не передаються: кожна розгортка виконується в цьому браузері, в основному потоці або у Blob Workers того самого джерела, створених з diagram-compute.classic.js.","Loss [m]":"Втрата [м]","Lowest p kPa(g)":"Найнижчий p кПа(н)","Main return":"Головне повернення","Main supply":"Головна подача","Max continuity residual":"Макс. залишок безперервності","Max energy residual":"Макс. залишок енергії","Monte-Carlo samples":"Семпли Монте-Карло","Monte-Carlo seed":"Насіння Монте-Карло","N-1 screen":"Скринінг N-1","Network drawing:":"Креслення мережі:","Network files":"Файли мережі","Network loaded":"Мережу завантажено","No HGL generated.":"Гідравлічну лінію не згенеровано.","No continuous flow-following return path; showing a topological fallback path.":"Немає безперервного шляху повернення, що слідує за витратою; показано резервний шлях за топологією.","No return path from pump discharge to suction. HGL needs a loop/path excluding the pump.":"Немає шляху повернення від нагнітання насоса до всмоктування. Гідравлічній лінії потрібен контур/шлях без насоса.","Nodes":"Вузли","Nothing to sample. Give the roughness a sigma above 0 (the network needs pipes), or the demands an sd above 0 on a network that has non-zero demands.":"Нема чого семплювати. Задайте шорсткості σ більше 0 (мережі потрібні труби), або навантаженням ст.відх. більше 0 у мережі з ненульовими навантаженнями.","Open a hydraulic-network JSON file":"Відкрити JSON-файл гідравлічної мережі","Open network JSON…":"Відкрити JSON мережі…","Outcome":"Результат","Over limit":"Понад ліміт","P.K. Swamee & A.K. Jain, Explicit equations for pipe-flow problems, ASCE J. Hydraulics Div. 102(5) (1976) 657-664 — f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, stated for 1e-6 <= eps/D <= 1e-2 and 5e3 <= Re <= 1e8.":"P.K. Swamee & A.K. Jain, Explicit equations for pipe-flow problems, ASCE J. Hydraulics Div. 102(5) (1976) 657-664 — f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, визначено для 1e-6 <= eps/D <= 1e-2 та 5e3 <= Re <= 1e8.","Partial load 0 to 150 %, global pump speed 40 to 120 %":"Часткове навантаження 0–150%, глобальна швидкість насоса 40–120%","Partial-load factor must be between 0 and 150%.":"Коефіцієнт часткового навантаження має бути в межах 0–150%.","Pipe":"Труба","Pipe:":"Труба:","Pipe:  h_loss = (f L/D + K) v^2 / (2 g),  v = q/A,  Re = v D / nu":"Труба: h_loss = (f L/D + K) v^2 / (2 g), v = q/A, Re = v D / nu","Pipes":"Труби","Plant return":"Повернення установки","Pointer":"Вказівник","Positive edge flow follows its arrow.":"Додатна витрата на ребрі слідує за його стрілкою.","Pressure kPa(g)":"Тиск кПа(н)","Properties":"Властивості","Pump":"Насос","Pump / system curve":"Крива насоса/мережі","Pump / system curve — select a pump, then press Pump / system curve.":"Крива насоса/мережі — виберіть насос, потім натисніть «Крива насоса/мережі».","Pump H m":"Напір насоса, м","Pump [m]":"Насос [м]","Pump and system curve":"Крива насоса та мережі","Pump discharge":"Нагнітання насоса","Pump kW (hydraulic)":"Насос, кВт (гідравлічна)","Pump rated head must be below shutoff head; reverse flow and beyond-runout operation are extrapolations and are warned":"Номінальний напір насоса має бути нижчим за напір при нульовій витраті; зворотна витрата та робота за межею нульової точки є екстраполяціями та позначаються попередженням","Pump, two branches, coil and control valve — the shipped example":"Насос, дві гілки, калорифер і регулювальний клапан — вбудований приклад","Pump/system curve":"Крива насоса/мережі","Pump:":"Насос:","Pump:  H = H0 s^2 - a q|q|,  a = (H0 - H_rated)/q_rated^2,  s = local speed x global speed factor":"Насос: H = H0 s^2 - a q|q|, a = (H0 - H_rated)/q_rated^2, s = локальна швидкість x глобальний коефіцієнт швидкості","Pumps":"Насоси","Results":"Результати","Return header":"Колектор повернення","Roughness rank corr.":"Рангова кореляція шорсткості","Roughness σ (lognormal)":"Шорсткість σ (логнормальний розподіл)","Run an N-1 screen, a Monte-Carlo or a load profile. Each one solves the network many times; the pump / system curve above is now the same kind of sweep.":"Виконайте скринінг N-1, Монте-Карло або профіль навантаження. Кожен з них розраховує мережу багато разів; крива насоса/мережі вище тепер — розгортка того самого типу.","Save network JSON":"Зберегти JSON мережі","Save network JSON writes the drawing, the components and the fluid as a versioned document; Open network JSON reads one back, validating every field before it touches the canvas. This is the network, not the calculation: the shared bar below carries the calculation record as JSON, CSV, a PDF report and a python script, and Copy link puts the whole network in a permalink.":"«Зберегти JSON мережі» записує креслення, компоненти та рідину як документ з версією; «Відкрити JSON мережі» зчитує його назад, перевіряючи кожне поле перед тим, як воно потрапить на полотно. Це мережа, а не розрахунок: спільна панель нижче несе запис розрахунку як JSON, CSV, PDF-звіт і python-скрипт, а «Копіювати посилання» вміщує всю мережу в постійне посилання.","Select a node or a component on the drawing to edit it.":"Виберіть вузол або компонент на кресленні, щоб редагувати його.","Select a pump first":"Спершу виберіть насос","Select moves and selects. Node places a node on empty canvas. Pipe, Pump, Valve and Heat exchanger each need two clicks: the start node, then the end node. The arrow drawn on a component is its positive direction — a negative solved flow means the fluid runs the other way. Delete removes the selected element, and every edit can be undone from the header.":"«Вибрати» переміщує та вибирає. «Вузол» розміщує вузол на порожньому полотні. Труба, Насос, Клапан і Теплообмінник кожен потребують двох клацань: початковий вузол, потім кінцевий. Стрілка, намальована на компоненті, — це його додатний напрям — від'ємна розрахована витрата означає, що рідина тече в інший бік. «Видалити» прибирає вибраний елемент, і кожну зміну можна скасувати із заголовка.","Selected:":"Вибрано:","Set target flow on at least one valve":"Задайте цільову витрату принаймні для одного клапана","Shutoff head H₀":"Напір при нульовій витраті H₀","Solve failed":"Розрахунок не вдався","Solved in":"Розраховано за","Solved simultaneously for all edge flows and free-node heads by a damped Newton method with a numerical Jacobian":"Розраховано одночасно для всіх витрат на ребрах і напорів вільних вузлів демпфованим методом Ньютона з чисельним якобіаном","Solver diverged. Check component data.":"Розв'язувач розійшовся. Перевірте дані компонентів.","Speed m/s":"Швидкість, м/с","Static Δp a−b kPa":"Статичний Δp a−b, кПа","Steady state, incompressible, single phase; constant density and viscosity":"Усталений режим, нестисливе, однофазне; стала густина та в'язкість","Steady-state incompressible networks · ensemble sweeps on the shared compute runtime":"Мережі усталеної нестисливої течії · ансамблеві розгортки у спільному середовищі обчислень","Steady-state, incompressible and single-phase. Fluid properties are constant. Heat exchangers are hydraulic resistances only. Pump curves use shutoff head plus one rated point; reverse flow and operation beyond zero-head runout are extrapolations and are warned. Automatic balancing is an iterative valve-opening heuristic and cannot guarantee coupled or infeasible targets. In meshed networks the HGL plot shows one representative flow-following return path (or a labelled topological fallback), not every path; HGL excludes velocity head. Junction/fitting losses must be entered through K. The dense browser solver refuses models above 600 nonlinear unknowns. No water hammer, NPSH/cavitation, efficiency map or transient control model is included.":"Усталений режим, нестисливе та однофазне. Властивості рідини сталі. Теплообмінники є лише гідравлічними опорами. Криві насоса використовують напір при нульовій витраті плюс одну номінальну точку; зворотна витрата та робота за межею нульової точки є екстраполяціями й позначаються попередженням. Автоматичне балансування — це ітеративна евристика відкриття клапана, яка не може гарантувати пов'язані або недосяжні цілі. У кільцевих мережах графік гідравлічної лінії показує один репрезентативний шлях повернення, що слідує за витратою (або позначений резервний шлях за топологією), а не кожен шлях; гідравлічна лінія не враховує швидкісний напір. Втрати у з'єднаннях/фасонних частинах слід вводити через K. Щільний розв'язувач у браузері відмовляє в моделях понад 600 нелінійних невідомих. Гідравлічний удар, NPSH/кавітація, карта ККД чи модель перехідного керування не включені.","Supply header":"Колектор подачі","Swamee-Jain is published for 1e-6 <= eps/D <= 1e-2 and 5e3 <= Re <= 1e8; it differs from the Colebrook root by up to about 3 % over that range":"Swamee-Jain опубліковано для 1e-6 <= eps/D <= 1e-2 та 5e3 <= Re <= 1e8; у цьому діапазоні відрізняється від кореня рівняння Colebrook не більш як приблизно на 3%","System curve requires positive solved flow through the selected pump.":"Крива мережі потребує додатної розрахованої витрати через вибраний насос.","The N-1 screen closes pipes and valves one at a time; this network has neither.":"Скринінг N-1 закриває труби та клапани по одному; ця мережа не має ані того, ані іншого.","The ensemble sweep results also recorded here — pump/system curve, N-1 screen, Monte-Carlo quantiles, load-profile energy — are NOT reproduced: each is tens to thousands of further solves, and the Monte-Carlo additionally rests on the shared runtime’s Latin-hypercube design, its rank-correlation transform and its DDSketch quantile tallies, none of which this single file carries.":"Результати ансамблевих розгорток, також записані тут, — крива насоса/мережі, скринінг N-1, квантилі Монте-Карло, енергія профілю навантаження — НЕ відтворюються: кожна з них — це десятки чи тисячі додаткових розрахунків, а Монте-Карло додатково спирається на латинський гіперкуб спільного середовища виконання, його перетворення рангової кореляції та його квантильні підсумки DDSketch, жодного з яких цей окремий файл не містить.","The head along one return path from the pump discharge back to its suction, drawn against the elevation profile. In a meshed network there are many such paths; the plot shows one flow-following path, or a labelled topological fallback when no continuous flow-following path exists. It excludes velocity head.":"Напір уздовж одного шляху повернення від нагнітання насоса назад до його всмоктування, побудований відносно профілю висоти. У кільцевій мережі таких шляхів багато; графік показує один шлях, що слідує за витратою, або позначений резервний шлях за топологією, коли безперервного шляху, що слідує за витратою, не існує. Швидкісний напір не враховується.","The hourly profile needs exactly 24 finite, non-negative multipliers.":"Погодинний профіль потребує рівно 24 скінченних невід'ємних множники.","The load profile reports pump energy; this network has no pump.":"Профіль навантаження звітує про енергію насоса; ця мережа не має насоса.","The metric Kv relation, dp[bar] = SG (q[m³/h] / Kv_eff)². Kv_eff is Kv × opening for a linear characteristic and Kv × 50^(opening−1) for equal percentage. The balance target is the flow the auto-balance heuristic tries to reach at 100 % load by closing the valve; rated Kv is never changed.":"Метричне співвідношення Kv, dp[бар] = SG (q[м³/год] / Kv_eff)². Kv_eff — це Kv × відкриття для лінійної характеристики та Kv × 50^(відкриття−1) для рівнопроцентної. Ціль балансування — це витрата, якої евристика автобалансування намагається досягти при навантаженні 100% шляхом закриття клапана; номінальне Kv ніколи не змінюється.","The network changed while the sweep was running. Solve it again, then redraw the curve.":"Мережа змінилася під час виконання розгортки. Розрахуйте її знову, потім перебудуйте криву.","The shared interface layer (diagram-ui.js) did not load. Every input, the solver, the drawing, the sweeps and every export still work; the page falls back to one plain column.":"Спільний рівень інтерфейсу (diagram-ui.js) не завантажився. Кожне поле вводу, розв'язувач, креслення, розгортки та кожен експорт усе ще працюють; сторінка переходить у режим однієї звичайної колонки.","Topological fallback path coordinate":"Координата резервного шляху за топологією","Unsupported hydraulic-network schema version":"Непідтримувана версія схеми гідравлічної мережі","Valve":"Клапан","Valve opening 0.1 % to 100 %":"Відкриття клапана 0,1% до 100%","Valve:":"Клапан:","Valve:  dp[bar] = SG (q[m3/h] / Kv_eff)^2,  Kv_eff = Kv * o (linear) or Kv * 50^(o-1) (equal percentage), o = opening/100":"Клапан: dp[бар] = SG (q[м3/год] / Kv_eff)^2, Kv_eff = Kv * o (лінійна) або Kv * 50^(o-1) (рівнопроцентна), o = відкриття/100","Valves":"Клапани","With a pump selected, the network is re-solved 33 times with that pump forced to a series of flows. The system curve is the head the network demands at each flow; the pump curve is what the pump delivers; they cross at the operating point. Every point is solved cold, so the curve does not depend on the order the points were computed in.":"З вибраним насосом мережа розраховується заново 33 рази, коли цей насос примусово встановлюється на серію витрат. Крива мережі — це напір, якого мережа вимагає при кожній витраті; крива насоса — це те, що насос забезпечує; вони перетинаються в робочій точці. Кожна точка розраховується «з нуля», тож крива не залежить від порядку, в якому точки обчислювалися.","at node":"у вузлі","diagram-compute.classic.js did not load; sweeps run on the main thread and the Monte-Carlo sweep is unavailable because its Latin-hypercube design and quantile tallies live in the runtime":"diagram-compute.classic.js не завантажився; розгортки виконуються в основному потоці, а розгортка Монте-Карло недоступна, оскільки її латинський гіперкуб і квантильні підсумки живуть у середовищі виконання","every case was evaluated in index order on one thread, with no shared warm start":"кожен випадок обчислювався в порядку індексів в одному потоці, без спільного «теплого старту»","hL signed m":"hL знаково, м","iterations; scaled residual":"ітерацій; масштабований залишок","kPa (gauge)":"кПа (надлишковий)","kW (hydraulic)":"кВт (гідравлічна)","kWh (hydraulic, rho g Q H; no pump or motor efficiency)":"кВт·год (гідравлічна, rho g Q H; без ККД насоса чи двигуна)","metric Kv relation, with optional opening law.":"метричне співвідношення Kv, з додатковим законом відкриття.","p [kPa g]":"p [кПа н]","pump affinity scaling":"масштабування насоса за законом подібності","pump discharge":"нагнітання насоса","pump rated point":"номінальна точка насоса","pump suction":"всмоктування насоса","quadratic H(Q) from shutoff head and one rated point, scaled by affinity law speed².":"квадратична H(Q) від напору при нульовій витраті й однієї номінальної точки, масштабована законом подібності швидкість².","select a pump":"виберіть насос","selected pump loop":"вибраний контур насоса","signed reverse passive loss":"знакова зворотна пасивна втрата","the complete steady-state network solve of this page for the network currently on the canvas: the same continuity and energy equations, the same pipe/valve/heat-exchanger/pump component laws, and the same damped Newton iteration on scaled residuals. Charts, auto-balancing and the HGL path search are not part of the export.":"повний усталений розрахунок мережі цієї сторінки для мережі, що зараз на полотні: ті самі рівняння безперервності й енергії, ті самі закони компонентів труба/клапан/теплообмінник/насос, і та сама демпфована ітерація Ньютона за масштабованими залишками. Графіки, автобалансування та пошук шляху гідравлічної лінії не є частиною експорту.","unrecognised hydraulic-network state payload":"нерозпізнані дані стану гідравлічної мережі","v2 build: the steady-state solve recorded above is the v1 tool’s solver unchanged — same residual assembly, same central-difference Jacobian, same dense Gauss-Jordan with partial pivoting, same damped Newton line search. What this build adds is repeated solves (pump/system curve, N-1 screen, Monte-Carlo, load profile) on the shared compute runtime diagram-compute.classic.js.":"збірка v2: усталений розрахунок, записаний вище, — це незмінний розв'язувач інструмента v1 — те саме складання залишку, той самий якобіан центральних різниць, той самий щільний Гаусс-Жордан із частковим вибором головного елемента, той самий демпфований лінійний пошук Ньютона. Ця збірка додає повторювані розрахунки (крива насоса/мережі, скринінг N-1, Монте-Карло, профіль навантаження) у спільному середовищі обчислень diagram-compute.classic.js.","↖ Select":"↖ Вибрати","━ Elevation":"━ Висота","━ Pipe":"━ Труба","▶ Pump":"▶ Насос","◇ Valve":"◇ Клапан","● Node":"● Вузол","Hydraulic Network Solver":"Розрахунок гідравлічних мереж","Draw an arbitrary network of pipes, nodes, pumps, valves and heat exchangers and solve the steady-state flows and pressures.":"Намалюйте довільну мережу з труб, вузлів, насосів, клапанів і теплообмінників та розрахуйте усталені витрати й тиски.","Draw an arbitrary network of pipes, nodes, pumps, valves and heat exchangers and solve the steady-state flows and pressures. Includes Darcy–Weisbach pipe losses, pump and system curves, hydraulic grade line, valve balancing, partial-load scaling, and JSON/CSV import-export.":"Намалюйте довільну мережу з труб, вузлів, насосів, клапанів і теплообмінників та розрахуйте усталені витрати й тиски. Є втрати Darcy–Weisbach, криві насоса й системи, гідравлічна лінія, балансування клапанів, часткове навантаження та імпорт-експорт JSON/CSV.","Steady solve:":"Усталений розрахунок:","backend:":"бекенд:","idle":"очікування","repeatable":"відтворюваний","solved":"розраховано","free":"вільний","pipe":"труба","pump":"насос","valve":"клапан","hx":"теплообмінник","━ System":"━ Мережа","━ HGL":"━ Гідравлічна лінія","Hydraulic Network Solver (v2)":"Розрахунок гідравлічних мереж (v2)","Pump and motor efficiency are not modelled, so this is not shaft or electrical energy.":"ККД насоса й двигуна не моделюється, тож це не енергія на валу і не електрична енергія.","HGL m":"HGL м","HGL":"HGL","p P5 kPa(g)":"p P5 кПа(н)"};
const siteLang=()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q&&String(q).slice(0,2).toLowerCase()==='uk')return'uk'}catch(e){}try{if(localStorage.getItem('diagram_site_lang')==='uk'||localStorage.getItem('diagram_lang')==='uk')return'uk'}catch(e){}return String(window.__diagramLang||'').slice(0,2).toLowerCase()};
if(siteLang()!=='uk')return;
document.documentElement.lang='uk';
const attrs=['placeholder','title','aria-label','alt'];
function tr(s){if(s==null)return s;const x=String(s);if(Object.prototype.hasOwnProperty.call(UK,x))return UK[x];const a=x.match(/^\s*/)[0],b=x.match(/\s*$/)[0],t=x.trim();if(Object.prototype.hasOwnProperty.call(UK,t))return a+UK[t]+b;const pz=t&&window.__hnPatterns?window.__hnPatterns.translate('uk',t,UK):null;if(pz!=null)return a+pz+b;const lw=window.DiagramUI&&DiagramUI.current&&typeof DiagramUI.current.t==='function'?DiagramUI.current.t('learn'):null;if(lw&&t.indexOf(lw+': ')===0){const k=t.slice(lw.length+2);if(Object.prototype.hasOwnProperty.call(UK,k))return a+lw+': '+UK[k]+b}return x}
function node(n){if(!n)return;if(n.nodeType===3){const p=n.parentElement;if(p&&!/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(p.tagName)){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}return}if(n.nodeType!==1)return;if(/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(n.tagName))return;for(const a of attrs)if(n.hasAttribute(a)){const v=n.getAttribute(a),w=tr(v);if(w!==v)n.setAttribute(a,w)}if(n.tagName==='INPUT'&&/^(button|submit|reset)$/i.test(n.type||'')){const v=n.value,w=tr(v);if(w!==v)n.value=w}const tw=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let q;while(q=tw.nextNode())node(q);for(const e of n.querySelectorAll('*'))for(const a of attrs)if(e.hasAttribute(a)){const v=e.getAttribute(a),w=tr(v);if(w!==v)e.setAttribute(a,w)}}
const run=()=>{node(document.body);const tt=document.querySelector('title');if(tt)node(tt)};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')node(m.target);else if(m.type==='attributes'){const el=m.target,v=el.getAttribute(m.attributeName),w=tr(v);if(v!=null&&w!==v)el.setAttribute(m.attributeName,w)}else for(const n of m.addedNodes)node(n)}}).observe(document.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:attrs});
})();
</script>
