/* =================== framework v2 (diagram-common.js) =================== */
function dgcNetDoc(){
  return{schema:SCHEMA,
    fluid:{rho:Number(A.rho),nu:Number(A.nu)},
    analysis:{loadFactor:Number(A.loadFactor),speedFactor:Number(A.speedFactor)},
    nodes:state.nodes,edges:state.edges};
}
function dgcApplyDoc(doc){
  const c=normalizeImport(doc);
  state.nodes=c.nodes;state.edges=c.edges;
  A.rho=c.fluid.rho;A.nu=c.fluid.nu;
  A.loadFactor=c.loadFactor;A.speedFactor=c.speedFactor;
  updateAnalysisOutputs();
  state.seqN=1+Math.max(0,...state.nodes.map(n=>parseInt(String(n.id).match(/\d+$/)?.[0]||0)));
  state.seqE=1+Math.max(0,...state.edges.map(e=>parseInt(String(e.id).match(/\d+$/)?.[0]||0)));
  state.selected=null;invalidate();renderProps();
}
function dgcSerialize(){const d=dgcNetDoc();return{v:2,net:d,sel:state.selected}}
function dgcDeserialize(st){
  if(!st||typeof st!=='object'||!st.net)throw Error('unrecognised hydraulic-network state payload');
  dgcApplyDoc(st.net);
  if(st.sel&&st.sel.kind)state.selected=st.sel;
  renderProps();runSolve();
}
function dgcUnknowns(){return state.edges.length+state.nodes.filter(n=>!n.fixed).length}
function dgcRecord(){
  if(!state.sol)return null;
  const fl=getFluid(),sol=state.sol,inputs={},outputs={},units={};
  inputs.fluid_density=fl.rho;units.fluid_density='kg/m3';
  inputs.kinematic_viscosity=fl.nu;units.kinematic_viscosity='m2/s';
  inputs.partial_load_factor=fl.load;units.partial_load_factor='-';
  inputs.pump_speed_factor=fl.speed;units.pump_speed_factor='-';
  inputs.nodes=state.nodes.length;units.nodes='-';
  inputs.fixed_pressure_nodes=state.nodes.filter(n=>n.fixed).length;units.fixed_pressure_nodes='-';
  inputs.components=state.edges.length;units.components='-';
  inputs.nonlinear_unknowns=dgcUnknowns();units.nonlinear_unknowns='-';
  for(const n of state.nodes){
    inputs['node_'+n.id+'_elevation']=n.z;units['node_'+n.id+'_elevation']='m';
    inputs['node_'+n.id+'_demand']=n.demand;units['node_'+n.id+'_demand']='m3/h';
    if(n.fixed){inputs['node_'+n.id+'_fixed_pressure']=n.p;units['node_'+n.id+'_fixed_pressure']='kPa (gauge)';}
  }
  for(const e of state.edges){
    inputs['component_'+e.id+'_type']=e.type;units['component_'+e.id+'_type']='';
    if(e.type==='pipe'){inputs['component_'+e.id+'_length']=e.L;units['component_'+e.id+'_length']='m';
      inputs['component_'+e.id+'_diameter']=e.D;units['component_'+e.id+'_diameter']='mm';
      inputs['component_'+e.id+'_roughness']=e.eps;units['component_'+e.id+'_roughness']='mm';
      inputs['component_'+e.id+'_minor_K']=e.K;units['component_'+e.id+'_minor_K']='-';}
    if(e.type==='pump'){inputs['component_'+e.id+'_shutoff_head']=e.H0;units['component_'+e.id+'_shutoff_head']='m';
      inputs['component_'+e.id+'_rated_flow']=e.Qrated;units['component_'+e.id+'_rated_flow']='m3/h';
      inputs['component_'+e.id+'_rated_head']=e.Hrated;units['component_'+e.id+'_rated_head']='m';
      inputs['component_'+e.id+'_speed']=e.speed;units['component_'+e.id+'_speed']='%';}
    if(e.type==='valve'){inputs['component_'+e.id+'_Kv']=e.Kv;units['component_'+e.id+'_Kv']='m3/h/sqrt(bar)';
      inputs['component_'+e.id+'_opening']=e.opening;units['component_'+e.id+'_opening']='%';
      inputs['component_'+e.id+'_law']=e.law;units['component_'+e.id+'_law']='';}
    if(e.type==='hx'){inputs['component_'+e.id+'_design_flow']=e.Qdesign;units['component_'+e.id+'_design_flow']='m3/h';
      inputs['component_'+e.id+'_design_dp']=e.dpDesign;units['component_'+e.id+'_design_dp']='kPa';
      inputs['component_'+e.id+'_exponent']=e.n;units['component_'+e.id+'_exponent']='-';}
  }
  for(const e of state.edges){
    const r=sol.edge[e.id];
    outputs['flow_'+e.id]=r.q*3600;units['flow_'+e.id]='m3/h';
    outputs['head_loss_'+e.id]=e.type==='pump'?null:r.loss;units['head_loss_'+e.id]='m';
    if(e.type==='pump'){outputs['pump_head_'+e.id]=r.pump;units['pump_head_'+e.id]='m';}
  }
  for(const n of state.nodes){
    const r=sol.node[n.id];
    outputs['pressure_'+n.id]=r.p/1000;units['pressure_'+n.id]='kPa (gauge)';
    outputs['hgl_'+n.id]=r.hgl;units['hgl_'+n.id]='m';
  }
  const w=sol.warnings.slice();
  hnRecordSweeps(inputs,outputs,units,w);
  w.unshift(sol.capped
    ?`Stopped at the ${sol.iter}-iteration cap without reaching the 2e-9 scaled-residual target (reached ${sol.residual.toExponential(2)}); treat the result as unconverged.`
    :`Converged in ${sol.iter} damped Newton iterations to a scaled residual of ${sol.residual.toExponential(2)}.`);
  w.push(`Max nodal continuity residual ${sol.maxContinuity.toExponential(2)} m3/h; max edge energy residual ${sol.maxEnergy.toExponential(2)} m.`);
  return{inputs,outputs,units,
    model:{equations:[
      'Node continuity (free nodes):  SUM_in q - SUM_out q - demand * load_factor = 0',
      'Edge energy:  h_a + z_a - h_b - z_b + H_pump(q) - h_loss(q) = 0',
      'Fixed-pressure node:  h = p / (rho g)',
      'Pipe:  h_loss = (f L/D + K) v^2 / (2 g),  v = q/A,  Re = v D / nu',
      'Friction: f = 64/Re for Re <= 2000; Swamee-Jain f = 0.25 / [log10(eps/(3.7 D) + 5.74/Re^0.9)]^2 for Re >= 4000; smoothstep blend between',
      'Valve:  dp[bar] = SG (q[m3/h] / Kv_eff)^2,  Kv_eff = Kv * o (linear) or Kv * 50^(o-1) (equal percentage), o = opening/100',
      'Heat exchanger:  h_loss = (dp_design / (rho g)) (q / q_design)^n',
      'Pump:  H = H0 s^2 - a q|q|,  a = (H0 - H_rated)/q_rated^2,  s = local speed x global speed factor',
      'Solved simultaneously for all edge flows and free-node heads by a damped Newton method with a numerical Jacobian'],
      ranges:[
        'Steady state, incompressible, single phase; constant density and viscosity',
        'Swamee-Jain is published for 1e-6 <= eps/D <= 1e-2 and 5e3 <= Re <= 1e8; it differs from the Colebrook root by up to about 3 % over that range',
        '2000 < Re < 4000 is a numerical blend, not a resolved transition model',
        'Valve opening 0.1 % to 100 %',
        'Heat-exchanger exponent n between 1 and 3',
        'Pump rated head must be below shutoff head; reverse flow and beyond-runout operation are extrapolations and are warned',
        'Partial load 0 to 150 %, global pump speed 40 to 120 %',
        'At most 600 nonlinear unknowns (components + free nodes)'],
      notes:[
        'Every network needs at least one fixed-pressure node per connected component; a closed circuit needs one arbitrary reference.',
        'HGL excludes velocity head. Junction and fitting losses must be entered through K.'].concat(hnRecordNotes())},
    warnings:w};
}
/* v2: two extra model notes. The first is always present — a reader of an exported PDF is entitled
   to know that this is the parallel build. The second appears only once a sweep has run and names
   the backend that computed it. Neither touches a number. */
function hnRecordNotes(){
  const out=['v2 build: the steady-state solve recorded above is the v1 tool’s solver unchanged — same residual assembly, same central-difference Jacobian, same dense Gauss-Jordan with partial pivoting, same damped Newton line search. What this build adds is repeated solves (pump/system curve, N-1 screen, Monte-Carlo, load profile) on the shared compute runtime diagram-compute.classic.js.'];
  if(hnHasSweep())out.push(`Ensemble sweeps in this record were computed by ${HN_COMPUTE.backend} (${HN_COMPUTE.engine?'diagram-compute '+(HN_COMPUTE.version||'?'):'no runtime; one blocking main-thread loop'}). Every sweep case is solved cold, without a warm start from a neighbouring case, so the result does not depend on how the cases were distributed.`);
  return out;
}
function hnHasSweep(){const S=state.sweeps;return !!(S&&(S.curve||S.n1||S.mc||S.profile))}
function hnSteadyOutputKeys(){
  const k=[];
  for(const e of state.edges){k.push('flow_'+e.id);k.push('head_loss_'+e.id);if(e.type==='pump')k.push('pump_head_'+e.id)}
  for(const n of state.nodes){k.push('pressure_'+n.id);k.push('hgl_'+n.id)}
  return k;
}
/* v2: the sweep results, in the record rather than in a second export path (AGENTS.md 2.1). Nothing
   is added while state.sweeps is empty, so a page that has only been solved records exactly what v1
   recorded, key for key. */
function hnRecordSweeps(inputs,outputs,units,w){
  const S=state.sweeps;if(!S)return;
  const put=(o,k,v,u)=>{o[k]=v;units[k]=u===undefined?'-':u};
  const tag=(name,r)=>w.push(`${name}: ${r.completed} of ${r.cases} cases solved (${r.failed} failed), backend ${r.backend} (${r.backendWhy||''}), ${(r.elapsedMs/1000).toFixed(2)} s, determinism ${r.determinism} — ${r.determinismBasis}.`);
  if(S.curve){
    put(inputs,'curve_pump',S.curve.pump,'');
    put(inputs,'curve_points_requested',HN_CURVE_STEPS+1);
    put(outputs,'curve_points_usable',S.curve.points.length);
    put(outputs,'curve_flow_max',S.curve.qmax,'m3/h');
    for(const pt of S.curve.points){
      put(outputs,'curve_'+pt.k+'_flow',pt.q,'m3/h');
      put(outputs,'curve_'+pt.k+'_system_head',pt.sys,'m');
      put(outputs,'curve_'+pt.k+'_pump_head',pt.pump,'m');
    }
    tag('Pump/system curve',S.curve.run);
  }
  if(S.n1){
    put(inputs,'n1_velocity_limit',S.n1.vLimit,'m/s');
    put(outputs,'n1_contingencies',S.n1.rows.length);
    put(outputs,'n1_not_solvable',S.n1.infeasible);
    put(outputs,'n1_over_velocity_limit',S.n1.violating);
    if(S.n1.baseline){
      put(outputs,'n1_intact_min_pressure',S.n1.baseline.minP,'kPa (gauge)');
      put(outputs,'n1_intact_min_pressure_node',S.n1.baseline.minNode,'');
      put(outputs,'n1_intact_max_velocity',S.n1.baseline.maxV,'m/s');
    }
    if(S.n1.worst){
      put(outputs,'n1_worst_component',S.n1.worst.excluded,'');
      put(outputs,'n1_worst_min_pressure',S.n1.worst.minP,'kPa (gauge)');
      put(outputs,'n1_worst_min_pressure_node',S.n1.worst.minNode,'');
    }
    for(const r of S.n1.rows){
      if(r.ok){
        put(outputs,'n1_'+r.excluded+'_min_pressure',r.minP,'kPa (gauge)');
        put(outputs,'n1_'+r.excluded+'_max_velocity',r.maxV,'m/s');
        put(outputs,'n1_'+r.excluded+'_over_limit',r.viol.length);
      }else put(outputs,'n1_'+r.excluded+'_outcome',r.reason,'');
    }
    tag('N-1 screen',S.n1.run);
  }
  if(S.mc){
    put(inputs,'mc_samples_requested',S.mc.count);
    put(inputs,'mc_seed',S.mc.seed);
    put(inputs,'mc_roughness_lognormal_sigma',S.mc.sigma);
    put(inputs,'mc_demand_normal_sd',S.mc.sd);
    put(inputs,'mc_roughness_rank_correlation',S.mc.rhoE);
    put(inputs,'mc_demand_rank_correlation',S.mc.rhoD);
    put(inputs,'mc_sampled_inputs',S.mc.parameters.length);
    put(outputs,'mc_samples_solved',S.mc.used);
    put(outputs,'mc_quantile_bound_holds',S.mc.boundHolds?1:0);
    for(const n of S.mc.nodes){
      put(outputs,'mc_pressure_'+n.id+'_p05',n.s.quantiles['0.05']/1000,'kPa (gauge)');
      put(outputs,'mc_pressure_'+n.id+'_p50',n.s.quantiles['0.5']/1000,'kPa (gauge)');
      put(outputs,'mc_pressure_'+n.id+'_p95',n.s.quantiles['0.95']/1000,'kPa (gauge)');
    }
    for(const e of S.mc.edges){
      put(outputs,'mc_flow_'+e.id+'_p05',e.s.quantiles['0.05']*3600,'m3/h');
      put(outputs,'mc_flow_'+e.id+'_p50',e.s.quantiles['0.5']*3600,'m3/h');
      put(outputs,'mc_flow_'+e.id+'_p95',e.s.quantiles['0.95']*3600,'m3/h');
    }
    w.push(`Monte-Carlo quantiles are DDSketch estimates, not exact order statistics: ${S.mc.nodes.length?S.mc.nodes[0].s.errorBound:''}${S.mc.boundHolds?'':' THE ACCURACY BOUND IS VOID FOR AT LEAST ONE TALLY.'}`);
    tag('Monte-Carlo',S.mc.run);
  }
  if(S.profile){
    const P=S.profile;
    put(inputs,'profile_hours',P.hours,'h');
    put(inputs,'profile_seasonal_swing',P.season);
    put(inputs,'profile_daily_multipliers',P.daily.join(' '),'');
    put(outputs,'profile_hours_solved',P.solved,'h');
    put(outputs,'profile_pump_energy',P.energy_kWh,'kWh (hydraulic, rho g Q H; no pump or motor efficiency)');
    put(outputs,'profile_peak_pump_power',P.peak_kW,'kW (hydraulic)');
    put(outputs,'profile_peak_hour',P.peakHour,'h');
    put(outputs,'profile_mean_pump_power',P.mean_kW,'kW (hydraulic)');
    put(outputs,'profile_min_pressure',P.minP,'kPa (gauge)');
    put(outputs,'profile_min_pressure_hour',P.minPHour,'h');
    put(outputs,'profile_max_velocity',P.maxV,'m/s');
    put(outputs,'profile_hours_over_velocity_limit',P.overV,'h');
    if(P.flat)w.push('Load profile: every node in this network has zero demand and the profile multiplier scales nodal demands only, so every hour is the same operating point and the energy figure is one point multiplied by the number of hours.');
    tag('Load profile',P.run);
  }
}

function dgcReportText(ctx){
 const lang=String(ctx&&((ctx.domainLang)||(ctx.lang))||'en').slice(0,2).toLowerCase();
 return DGC_REPORT_TEXT[lang]||DGC_REPORT_TEXT.en;
}
/* Composite evidence strings need the document locale because toFixed() would
   put an English decimal point beside localized report tables. Four-digit
   identifiers and years remain ungrouped; grouping starts at five digits. */
function dgcReportNumber(value,ctx,digits){
 const n=Number(value);if(!Number.isFinite(n))return'—';
 const lang=String(ctx&&((ctx.domainLang)||(ctx.lang))||'en').slice(0,2).toLowerCase();
 const dgcReportLocales={nl:'nl-BE',de:'de-DE',fr:'fr-BE',es:'es-ES',uk:'uk-UA',pl:'pl-PL',en:'en-GB'};
 return n.toLocaleString(dgcReportLocales[lang]||'en-GB',{
  useGrouping:Math.abs(n)>=1e4,maximumFractionDigits:digits==null?2:digits
 });
}
function dgcReportScientific(value,ctx){
 const n=Number(value);if(!Number.isFinite(n)||n===0)return dgcReportNumber(n,ctx,2);
 const parts=n.toExponential(2).split('e'),sup={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
 return dgcReportNumber(Number(parts[0]),ctx,2)+' × 10'+parts[1].split('').map(x=>sup[x]||x).join('');
}
function dgcReportProfile(rec,ctx){
 const t=dgcReportText(ctx),inputs=rec.inputs||{},outputs=rec.outputs||{},units=rec.units||{};
 const finite=v=>typeof v==='number'&&Number.isFinite(v);
 /* Note templates carry {n}, {c} and {h} so each language keeps its own word
    order instead of being forced into the English one. */
 const fill=(s,map)=>String(s).replace(/\{([a-z])\}/g,(m,k)=>map[k]==null?m:map[k]);

 /* Component identity comes from the record rather than from live state, so a
    report printed from a restored permalink names what the record holds. */
 const ids=[];
 for(const key of Object.keys(inputs)){
  const m=key.match(/^component_(.+)_type$/);if(m&&!ids.includes(m[1]))ids.push(m[1]);
 }
 const type=id=>inputs['component_'+id+'_type'];
 const pumpIds=ids.filter(id=>type(id)==='pump');

 const resultRows=[];
 const row=(label,value,unit,note)=>{
  if(!finite(value))return;
  const r={label,value};if(unit)r.unit=unit;if(note)r.note=note;resultRows.push(r);
 };

 /* rho g Q H at the solved operating point. This is the tool's own load-profile
    quantity, evaluated at one point instead of integrated over a period, so the
    two figures stay comparable when both are printed. */
 let pumpPowerW=0;
 const rho=inputs.fluid_density;
 for(const id of pumpIds){
  const q=outputs['flow_'+id],h=outputs['pump_head_'+id];
  if(finite(q)&&finite(h)&&finite(rho))pumpPowerW+=Math.abs(q/3600*h)*rho*9.80665;
 }
 if(pumpPowerW>0)row(t.results.pumpPower,pumpPowerW/1000,'kW',t.notes.pumpPower);

 const nodePressures=Object.keys(outputs).filter(k=>/^pressure_/.test(k)).map(k=>outputs[k]).filter(finite);
 if(nodePressures.length>1)row(t.results.pressureSpan,Math.max(...nodePressures)-Math.min(...nodePressures),'kPa',t.notes.pressureSpan);

 /* Convergence evidence is carried in the record as prose, because that is what
    the record has always exported; it is parsed back rather than recomputed. */
 const convergenceText=(rec.warnings||[]).find(x=>/^(Converged|Stopped at)/.test(String(x)))||'';
 const iterationMatch=convergenceText.match(/(?:Converged in|Stopped at the)\s+(\d+)/i);
 const residualMatch=convergenceText.match(/(?:scaled residual of|reached)\s+([0-9]+(?:\.[0-9]+)?(?:e[+\-]?[0-9]+)?)/i);
 const iterations=iterationMatch?Number(iterationMatch[1]):null,residual=residualMatch?Number(residualMatch[1]):null;

 /* --- ensemble sweeps: the aggregate figures only. The per-case, per-node and
    per-component values stay in the calculation record, where the JSON, CSV and
    Python exports read them; printing all of them would bury the summary. */
 row(t.results.curvePoints,outputs.curve_points_usable,'-');
 row(t.results.curveFlowMax,outputs.curve_flow_max,'m3/h');
 row(t.results.n1Screened,outputs.n1_contingencies,'-',t.notes.perComponentInRecord);
 row(t.results.n1IntactMinPressure,outputs.n1_intact_min_pressure,'kPa (gauge)',
     outputs.n1_intact_min_pressure_node?fill(t.notes.atNode,{n:outputs.n1_intact_min_pressure_node}):'');
 row(t.results.n1IntactMaxVelocity,outputs.n1_intact_max_velocity,'m/s');
 row(t.results.n1WorstMinPressure,outputs.n1_worst_min_pressure,'kPa (gauge)',
     outputs.n1_worst_component?fill(t.notes.worstCase,{c:outputs.n1_worst_component,n:outputs.n1_worst_min_pressure_node||'—'}):'');
 row(t.results.mcSamples,outputs.mc_samples_solved,'-',t.notes.mcSamples);
 row(t.results.profileHours,outputs.profile_hours_solved,'h');
 row(t.results.profileEnergy,outputs.profile_pump_energy,'kWh',t.notes.profileEnergy);
 row(t.results.profilePeakPower,outputs.profile_peak_pump_power,'kW',
     finite(outputs.profile_peak_hour)?fill(t.notes.atHour,{h:dgcReportNumber(outputs.profile_peak_hour,ctx,0)}):'');
 row(t.results.profileMeanPower,outputs.profile_mean_pump_power,'kW');
 row(t.results.profileMinPressure,outputs.profile_min_pressure,'kPa (gauge)',
     finite(outputs.profile_min_pressure_hour)?fill(t.notes.atHour,{h:dgcReportNumber(outputs.profile_min_pressure_hour,ctx,0)}):'');
 row(t.results.profileMaxVelocity,outputs.profile_max_velocity,'m/s');
 /* The velocity limit the profile was compared against is not in the record —
    only the N-1 screen records its limit — so this is a value, not a check. */
 row(t.results.profileHoursOverLimit,outputs.profile_hours_over_velocity_limit,'h');

 /* Solver effort is a diagnostic, so it sits at the foot of the table and not
    among the headline tiles. */
 if(finite(iterations))row(t.results.iterations,iterations,'-');

 const checks=[];
 if(finite(residual))checks.push({
  status:!/^(Stopped at)/.test(convergenceText)&&residual<=2e-9?'pass':'fail',
  title:t.checks.convergenceTitle,detail:t.checks.convergenceDetail,
  actual:t.checks.residualActual+': '+dgcReportScientific(residual,ctx),
  criterion:t.checks.residualCriterion,basis:'Tool stopping rule'
 });

 /* H = H0 s^2 - a q|q| reaches zero head at q = s sqrt(H0/a); beyond it the
    fitted curve is an extrapolation, which is what the tool itself warns about. */
 let minimumRunoutReserve=Infinity;
 for(const id of pumpIds){
  const h0=inputs['component_'+id+'_shutoff_head'],hr=inputs['component_'+id+'_rated_head'],qr=inputs['component_'+id+'_rated_flow'];
  const local=inputs['component_'+id+'_speed']/100,global=inputs.pump_speed_factor,q=Math.abs(outputs['flow_'+id]);
  if(!(finite(h0)&&finite(hr)&&finite(qr)&&finite(local)&&finite(global)&&finite(q)&&h0>hr&&qr>0))continue;
  const runout=Math.sqrt(h0*Math.pow(local*global,2)/((h0-hr)/Math.pow(qr/3600,2)))*3600;
  if(runout>0)minimumRunoutReserve=Math.min(minimumRunoutReserve,(runout-q)/runout*100);
 }
 if(Number.isFinite(minimumRunoutReserve))checks.push({
  status:minimumRunoutReserve>=0?'pass':'attention',title:t.checks.pumpDomainTitle,
  detail:t.checks.pumpDomainDetail,
  actual:t.checks.pumpReserveActual+': '+dgcReportNumber(minimumRunoutReserve,ctx,1)+' %',
  criterion:t.checks.pumpReserveCriterion,basis:'Two-point quadratic pump model'
 });

 const reverseCount=ids.filter(id=>finite(outputs['flow_'+id])&&outputs['flow_'+id]<0).length;
 checks.push({status:reverseCount===0?'pass':'attention',title:t.checks.reverseTitle,
  detail:t.checks.reverseDetail,actual:t.checks.reverseActual+': '+dgcReportNumber(reverseCount,ctx,0),
  criterion:t.checks.reverseCriterion,basis:'Declared positive component direction'});

 if(finite(outputs.n1_contingencies)&&finite(outputs.n1_not_solvable))checks.push({
  status:outputs.n1_not_solvable===0?'pass':'attention',title:t.checks.n1FeasibleTitle,
  detail:t.checks.n1FeasibleDetail,
  actual:t.checks.n1FeasibleActual+': '+dgcReportNumber(outputs.n1_not_solvable,ctx,0),
  criterion:fill(t.checks.n1FeasibleCriterion,{t:dgcReportNumber(outputs.n1_contingencies,ctx,0)}),
  basis:'N-1 screen; single component removed'});

 if(finite(outputs.n1_over_velocity_limit)&&finite(inputs.n1_velocity_limit))checks.push({
  status:outputs.n1_over_velocity_limit===0?'pass':'attention',title:t.checks.n1VelocityTitle,
  detail:t.checks.n1VelocityDetail,
  actual:t.checks.n1VelocityActual+': '+dgcReportNumber(outputs.n1_over_velocity_limit,ctx,0),
  criterion:fill(t.checks.n1VelocityCriterion,{v:dgcReportNumber(inputs.n1_velocity_limit,ctx,2)}),
  basis:'Velocity limit set by the user'});

 const mcBoundText=(rec.warnings||[]).find(x=>/^Monte-Carlo quantiles are DDSketch/.test(String(x)));
 if(finite(outputs.mc_quantile_bound_holds))checks.push({
  status:outputs.mc_quantile_bound_holds===1?'pass':'fail',title:t.checks.mcBoundTitle,

function dgcHandoff(){

  const sel=state.selected?.kind==='edge'?edgeById(state.selected.id):null;
  if(sel&&sel.type==='pipe'){
    q.D={value:sel.D/1000,unit:'m'};
    q.L={value:sel.L,unit:'m'};
    if(state.sol){const r=state.sol.edge[sel.id];
      q.Vdot={value:Math.abs(r.q),unit:'m3/s'};
      if(Number.isFinite(r.Re))q.Re={value:r.Re,unit:'-'};
      if(Number.isFinite(r.f))q.f_darcy={value:r.f,unit:'-'};

function dgcApplyHandoff(payload){
  const q=(payload&&payload.quantities)||{},accepted=[],ignored=[];
  const sel=state.selected?.kind==='edge'?edgeById(state.selected.id):null;
  for(const k of Object.keys(q)){
    const v=q[k]&&q[k].value;
    if(typeof v!=='number'||!isFinite(v)){ignored.push(k);continue}
    if(k==='rho'&&v>0){A.rho=v;accepted.push(k)}
    else if(k==='D'&&v>0&&sel&&sel.type==='pipe'){sel.D=v*1000;accepted.push(k)}
    else if(k==='L'&&v>0&&sel&&sel.type==='pipe'){sel.L=v;accepted.push(k)}
    else ignored.push(k);
  }
  if(accepted.length){invalidate();renderProps();
    toast('Received '+accepted.join(', ')+(ignored.length?'; ignored '+ignored.join(', '):'')+'. Press Solve network.');}
  else if(ignored.length)toast('Ignored '+ignored.join(', ')+': nothing in this payload maps onto the current selection.','warn');

function dgcPyLit(v,ind){

  if(typeof v==='boolean')return v?'True':'False';

  if(Array.isArray(v))return '[\n'+v.map(x=>ind+'  '+dgcPyLit(x,ind+'  ')).join(',\n')+'\n'+ind+']';
  return '{\n'+Object.keys(v).map(k=>ind+'  '+JSON.stringify(k)+': '+dgcPyLit(v[k],ind+'  ')).join(',\n')+'\n'+ind+'}';

function dgcPythonCode(){

      edges:doc.edges.map(e=>{const o={id:e.id,name:e.name,type:e.type,a:e.a,b:e.b};
        if(e.type==='pipe')Object.assign(o,{L:e.L,D:e.D,eps:e.eps,K:e.K});
        if(e.type==='pump')Object.assign(o,{H0:e.H0,Qrated:e.Qrated,Hrated:e.Hrated,speed:e.speed});
        if(e.type==='valve')Object.assign(o,{Kv:e.Kv,opening:e.opening,law:e.law});
        if(e.type==='hx')Object.assign(o,{Qdesign:e.Qdesign,dpDesign:e.dpDesign,n:e.n});
        return o}),
      fluid:{rho:doc.fluid.rho,nu:doc.fluid.nu,load:Number(A.loadFactor)/100,speed:Number(A.speedFactor)/100}},'')
  +`


NODES = {n["id"]: n for n in NETWORK["nodes"]}
EDGES = NETWORK["edges"]
FLUID = NETWORK["fluid"]
FREE = [n for n in NETWORK["nodes"] if not n["fixed"]]
FI = {n["id"]: k for k, n in enumerate(FREE)}
NE, NF = len(EDGES), len(FREE)


def darcy_f(Re, rel):
    """64/Re laminar, Swamee-Jain turbulent, smoothstep blend over 2000..4000."""
    if not Re > 0:
        return 0.0
    if Re <= 2000:
        return 64.0 / Re
    turb = 0.25 / math.log10(rel / 3.7 + 5.74 / Re ** 0.9) ** 2
    if Re >= 4000:
        return turb
    lam = 64.0 / Re
    t = (Re - 2000.0) / 2000.0
    s = t * t * (3 - 2 * t)
    return lam * (1 - s) + turb * s


def kv_eff(e):
    o = min(1.0, max(0.001, e["opening"] / 100.0))
    return e["Kv"] * (50.0 ** (o - 1) if e.get("law") == "equal" else o)


def edge_physics(e, q):
    """Returns (signed head loss [m], pump head [m], velocity [m/s], Re, f)."""
    aq = abs(q)
    sg = FLUID["rho"] / 1000.0
    loss = 0.0
    pump = 0.0
    vel = float("nan")
    Re = float("nan")
    f = float("nan")
    if e["type"] == "pipe":
        D = e["D"] / 1000.0
        A = math.pi * D * D / 4
        vel = aq / A
        Re = vel * D / FLUID["nu"]
        f = darcy_f(Re, e["eps"] / 1000.0 / D)
        loss = (f * e["L"] / D + e["K"]) * vel * vel / (2 * G)
    elif e["type"] == "valve":
        loss = 1e5 * sg * (aq * 3600.0 / kv_eff(e)) ** 2 / (FLUID["rho"] * G)
    elif e["type"] == "hx":
        loss = (e["dpDesign"] * 1000.0 / (FLUID["rho"] * G)) * (aq / (e["Qdesign"] / 3600.0)) ** e["n"]
    elif e["type"] == "pump":
        qr = e["Qrated"] / 3600.0
        a = (e["H0"] - e["Hrated"]) / (qr * qr)
        s = e["speed"] / 100.0 * FLUID["speed"]
        pump = e["H0"] * s * s - a * q * abs(q)
    return (0.0 if q == 0 else math.copysign(loss, q)), pump, vel, Re, f


def fixed_head(n):
    return n["p"] * 1000.0 / (FLUID["rho"] * G)


def _scales():
    qs_ = [abs(n["demand"]) * FLUID["load"] / 3600.0 for n in NETWORK["nodes"]]
    qs_ += [abs(e["Qrated"] / 3600.0 * e["speed"] / 100.0 * FLUID["speed"]) for e in EDGES if e["type"] == "pump"]
    q_scale = max([1e-5] + qs_)
    hs = [abs(fixed_head(n)) for n in NETWORK["nodes"] if n["fixed"]]
    hs += [abs(n["z"]) for n in NETWORK["nodes"]]
    hs += [abs(e["H0"] * (e["speed"] / 100.0 * FLUID["speed"]) ** 2) for e in EDGES if e["type"] == "pump"]
    return q_scale, max([5.0] + hs)


def residual(v, q_scale, h_scale):
    r = [0.0] * (NF + NE)
    for k, n in enumerate(FREE):
        bal = -n["demand"] * FLUID["load"] / 3600.0
        for i, e in enumerate(EDGES):
            if e["b"] == n["id"]:
                bal += v[i] * q_scale
            if e["a"] == n["id"]:
                bal -= v[i] * q_scale
        r[k] = bal / q_scale
    for i, e in enumerate(EDGES):
        a, b = NODES[e["a"]], NODES[e["b"]]
        ha = fixed_head(a) if a["fixed"] else v[NE + FI[a["id"]]] * h_scale
        hb = fixed_head(b) if b["fixed"] else v[NE + FI[b["id"]]] * h_scale
        loss, pump, _, _, _ = edge_physics(e, v[i] * q_scale)
        r[NF + i] = (ha + a["z"] - hb - b["z"] + pump - loss) / h_scale
    return r


def solve_linear(A, b):
    """Gauss-Jordan with partial pivoting — the page's own solveLinear(), ported.

    The page does not call a library for this either: it eliminates on the augmented
    matrix in place, picks the pivot by largest magnitude in the column, rejects a
    pivot below 1e-12 as singular and skips a multiplier below 1e-18. Keeping that
    routine rather than substituting a LAPACK LU is what makes this script the page's
    computation and not merely an equivalent one."""
    n = len(b)
    M = [list(A[i]) + [b[i]] for i in range(n)]
    for k in range(n):
        p = k
        for i in range(k + 1, n):
            if abs(M[i][k]) > abs(M[p][k]):
                p = i
        if not math.isfinite(M[p][k]) or abs(M[p][k]) < 1e-12:
            raise RuntimeError('Jacobian is singular')
        M[k], M[p] = M[p], M[k]
        d = M[k][k]
        for j in range(k, n + 1):
            M[k][j] /= d
        for i in range(n):
            if i == k:
                continue
            f = M[i][k]
            if abs(f) < 1e-18:
                continue
            for j in range(k, n + 1):
                M[i][j] -= f*M[k][j]
    return [M[i][n] for i in range(n)]

def compute():
    """Damped Newton on the scaled residuals, identical formulation to the page."""
    q_scale, h_scale = _scales()
    n = NE + NF
    x = [0.0] * n
    for i, e in enumerate(EDGES):
        g = max(1e-8, e["Qrated"] / 3600.0 * e["speed"] / 100.0 * FLUID["speed"] * 0.6) if e["type"] == "pump" else q_scale * 0.2
        x[i] = g / q_scale
    fixed_nodes = [nd for nd in NETWORK["nodes"] if nd["fixed"]]
    avg = sum(fixed_head(nd) for nd in fixed_nodes) / len(fixed_nodes) if fixed_nodes else 0.0
    for k in range(NF):
        x[NE + k] = avg / h_scale
    r = residual(x, q_scale, h_scale)
    norm = max(abs(t) for t in r)
    it = 0
    while it < 60 and norm > 2e-9:
        J = [[0.0]*n for _ in range(n)]
        for j in range(n):
            step = 2e-6 * max(1.0, abs(x[j]))
            xp = list(x)
            xm = list(x)
            xp[j] += step
            xm[j] -= step
            rp = residual(xp, q_scale, h_scale)
            rm = residual(xm, q_scale, h_scale)
            for i in range(n):
                J[i][j] = (rp[i] - rm[i]) / (2 * step)
        dx = solve_linear(J, [-t for t in r])
        alpha, best, bx, br = 1.0, float("inf"), None, None
        for _ in range(16):
            xt = [x[i] + alpha * dx[i] for i in range(n)]
            rt = residual(xt, q_scale, h_scale)
            nt = max(abs(t) for t in rt)
            if nt < best:
                best, bx, br = nt, xt, rt
            if nt < norm * 0.985 or nt < 1e-10:
                break
            alpha *= 0.5
        x, r, norm = bx, br, best
        it += 1
    if norm > 2e-6:
        raise RuntimeError("no convergence, scaled residual %.3g" % norm)

    head = {}
    for nd in NETWORK["nodes"]:
        head[nd["id"]] = fixed_head(nd) if nd["fixed"] else x[NE + FI[nd["id"]]] * h_scale

    out = {}
    q = {}
    for i, e in enumerate(EDGES):
        q[e["id"]] = x[i] * q_scale
    # a passive edge between two prescribed boundaries at exactly equal HGL
    # carries no flow; the page snaps that analytically solvable case
    for e in EDGES:
        if e["type"] == "pump":
            continue
        a, b = NODES[e["a"]], NODES[e["b"]]
        if a["fixed"] and b["fixed"] and abs((head[a["id"]] + a["z"]) - (head[b["id"]] + b["z"])) < 1e-12:
            q[e["id"]] = 0.0
    for e in EDGES:
        loss, pump, _, _, _ = edge_physics(e, q[e["id"]])
        out["flow_" + e["id"]] = q[e["id"]] * 3600.0
        out["head_loss_" + e["id"]] = None if e["type"] == "pump" else loss
        if e["type"] == "pump":
            out["pump_head_" + e["id"]] = pump
    for nd in NETWORK["nodes"]:
        out["pressure_" + nd["id"]] = head[nd["id"]] * FLUID["rho"] * G / 1000.0
        out["hgl_" + nd["id"]] = head[nd["id"]] + nd["z"]
    out["_iterations"] = it
    out["_scaled_residual"] = norm
    return out
`;
}

    basis:{kind:'reproduce',

<script id="hydraulicnetwork-message-patterns">
/* Message patterns for the six language overlays below (same layer as ductnetwork.html). An overlay
   translates a text node only when its whole text equals a dictionary key; the page builds its
   messages, warnings, status line and sweep notes from templates, so those carry ids, numbers and
   names the dictionary cannot hold. Each entry is an English template ({x} copied verbatim, {x:t}
   must translate, {x:n} translates when it can, {x:p} gets the language's phrase substitutions) and
   its translations. A text that is several sentences built from different templates (the status
   line followed by warnings) is matched sentence by sentence; a placeholder never spans a sentence
   boundary (". " before a capital), and a sentence matched at the start of a longer text must not end
   inside a number or word, so "2.70e-12." is never cut after "2.". Ids, numbers and units are copied exactly

 Rauheit und ΣK dürfen nicht negativ sein.","fr":"Conduite {id} : la rugosité et ΣK ne peuvent pas être négatives.","es":"Tubería {id}: la rugosidad y ΣK no pueden ser negativas.","uk":"Труба {id}: шорсткість і ΣK не можуть бути від’ємними."},{"en":"Valve {id}: Kv must be positive.","pl":"Zawór {id}: Kv musi być dodatnie.","nl":"Klep {id}: Kv moet positief zijn.","de":"Ventil {id}: Kv muss positiv sein.","fr":"Vanne {id} : Kv doit être positif.","es":"Válvula {id}: Kv debe ser positivo.","uk":"Клапан {id}: Kv має бути додатним."},{"en":"Valve {id}: opening must be between 0.1% and 100%. The Kv model is only defined down to 0.1%; a shut branch must be removed, not set to a smaller opening.","pl":"Zawór {id}: stopień otwarcia musi wynosić od 0,1% do 100%. Model Kv jest określony tylko do 0,1%; zamkniętą gałąź trzeba usunąć, a nie ustawiać mniejszego otwarcia.","nl":"Klep {id}: opening moet tussen 0,1% en 100% liggen. Het Kv-model is alleen gedefinieerd tot 0,1%; een gesloten tak moet worden verwijderd, niet op een kleinere opening worden gezet.","de":"Ventil {id}: Öffnung muss zwischen 0,1% und 100% liegen. Das Kv-Modell ist nur bis 0,1% definiert; ein geschlossener Zweig muss entfernt und nicht auf eine kleinere Öffnung gesetzt werden.","fr":"Vanne {id} : l’ouverture doit être comprise entre 0,1% et 100%. Le modèle Kv n’est défini que jusqu’à 0,1% ; une branche fermée doit être supprimée, pas réglée sur une ouverture plus petite.","es":"Válvula {id}: la apertura debe estar entre 0,1% y 100%. El modelo Kv solo está definido hasta 0,1%; una rama cerrada debe eliminarse, no ajustarse a una apertura menor.","uk":"Клапан {id}: відкриття має бути в межах від 0,1% до 100%. Модель Kv визначена лише до 0,1%; закриту гілку слід видалити, а не задавати меншим відкриттям."},{"en":"Valve {id}: balance target cannot be negative.","pl":"Zawór {id}: przepływ docelowy równoważenia nie może być ujemny.","nl":"Klep {id}: balanceerdoel mag niet negatief zijn.","de":"Ventil {id}: Abgleic   for(let i=0;i<c.names.length;i++){let x=m[i+1];const k=c.kinds[i];
   if(k==='t'){const y=tr(x);if(y==null)return null;x=y}
   else if(k==='n'){const y=tr(x);if(y!=null)x=y}
   else if(k==='p'){const ph=PHRASES[lang]||{};for(const e of Object.keys(ph))x=x.split(e).join(ph[e])}
   v[c.names[i]]=x}
  return tpl.replace(/\{(\w+)\}/g,(a,n)=>own(v,n)?v[n]:a)};
 const one=t=>{
  if(own(dict,t))return dict[t];
  for(const c of C){const m=c.whole.exec(t);if(m){const r=fill(c,m);if(r!=null)return r}}
  for(const c of C){if(!c.prefix)continue;const m=c.prefix.exec(t);if(!m)continue;
   const rest=t.slice(m[0].length),sp=rest.match(/^\s*/)[0];if(!rest.slice(sp.length))continue;
   const a=fill(c,m);if(a==null)continue;const b=tr(rest.slice(sp.length));if(b!=null)return a+sp+b}
  for(const k of keysFor(dict)){if(!t.startsWith(k))continue;const rest=t.slice(k.length),sp=rest.match(/^\s*/)[0];
   if(!/[.:;!?)]$/.test(k)&&!/^[\s;·,(]/.test(rest))continue;
   if(!rest.slice(sp.length))continue;const b=tr(rest.slice(sp.length));if(b!=null)return dict[k]+sp+b}
  return null};
 const tr=t=>{if(memo.has(t))return memo.get(t);memo.set(t,null);const r=one(t);memo.set(t,r);return r};
 return tr(String(text));
}
window.__hnPatterns={translate,count:P.length};
})();
</script>
<script id="polish-domain-overlay">
(()=>{
'use strict';
const PL={"\" design (and, for the Monte-Carlo, its quantile tallies) live in the shared runtime, and this build will not substitute a different sampler and call it the same experiment.":"” (a dla metody Monte Carlo także zliczenia kwantyli) znajduje się we współdzielonym środowisku wykonawczym, a ta wersja nie podstawi innego generatora próbek pod nazwą tego samego eksperymentu.","(unchanged from v1). Last runtime computation:":"(bez zmian względem v1). Ostatnie obliczenie w środowisku wykonawczym:","), so it fell back to the main thread":"), więc obliczenia wróciły do wątku głównego","), so sweeps stay on the main thread":"), więc analizy parametryczne pozostają w wątku głównym","); sweeps run on the main thread":"); analizy parametryczne działają w wątku głównym","); sweeps run on the main thread and the Monte-Carlo sweep is unavailable":"); analizy parametryczne działają w wątku głównym, a analiza Monte Carlo jest niedostępna","2000 < Re < 4000 is a numerical blend, not a resolved transition model":"2000 < Re < 4000 to numeryczne przejście, a nie model strefy przejściowej","24 h — one day":"24 h — jedna doba","8760 h — one year":"8760 h — jeden rok",": nothing in this payload maps onto the current selection.":": nic w tych danych nie odpowiada bieżącemu zaznaczeniu.","; ignored":"; pominięto","; one Worker case was checked against the same case solved here and came back identical":"; jeden przypadek z wątku roboczego porównano z tym samym przypadkiem obliczonym tutaj i wynik był identyczny","; over that box it differs from the Colebrook root by up to about 3% in f, and by more outside it. The 2000<Re<4000 blend is a numerical bridge, not a resolved transition model. Pipes running outside the published box are listed as a warning after each solve.":"; w tym zakresie różni się od pierwiastka równania Colebrooka o maksymalnie około 3% wartości f, a poza nim o więcej. Przejście dla 2000<Re<4000 jest pomostem numerycznym, a nie modelem strefy przejściowej. Rury pracujące poza opublikowanym zakresem są wymieniane w ostrzeżeniu po każdym obliczeniu.","A coil":"Wężownica A","A fixed-pressure node fixes gauge pressure; its elevation is still part of total head. A demand node removes flow from the network. Negative demand injects flow. Closed circulating systems need one arbitrary pressure reference node.":"Węzeł o zadanym ciśnieniu ustala nadciśnienie; jego rzędna nadal wchodzi do wysokości całkowitej. Węzeł z zapotrzebowaniem odbiera przepływ z sieci. Ujemne zapotrzebowanie oznacza zasilanie. Zamknięte obiegi wymagają jednego dowolnego węzła odniesienia ciśnienia.","A fixed-pressure node prescribes gauge pressure instead of solving it; its elevation still counts towards total head, and the solver reports the boundary exchange needed to hold that pressure. Every connected component of the drawing needs at least one, and a closed circulating loop needs one arbitrary reference node — without it the pressure level is undetermined and the Jacobian is singular.":"Węzeł o zadanym ciśnieniu narzuca nadciśnienie zamiast je obliczać; jego rzędna nadal wchodzi do wysokości całkowitej, a solver podaje przepływ wymiany na granicy potrzebny do utrzymania tego ciśnienia. Każda spójna część rysunku wymaga co najmniej jednego takiego węzła, a zamknięty obieg wymaga jednego dowolnego węzła odniesienia — bez niego poziom ciśnienia jest nieokreślony, a macierz Jacobiego jest osobliwa.","A hydraulic resistance only: Δp = Δp_design (Q/Q_design)^n, with n typically 2 for a fully turbulent coil. No thermal model, no capacity, no fouling.":"Wyłącznie opór hydrauliczny: Δp = Δp_design (Q/Q_design)^n, gdzie n wynosi zwykle 2 dla wężownicy z przepływem w pełni turbulentnym. Brak modelu cieplnego, mocy i zanieczyszczenia powierzchni.","A node is a junction with an elevation. Its demand is the flow taken out of the network there, in m³/h, positive out and negative in; demand is scaled by the global partial-load factor. A node that is not fixed has its pressure solved.":"Węzeł to połączenie o określonej rzędnej. Jego zapotrzebowanie to przepływ odbierany z sieci w tym miejscu, w m³/h, dodatni dla odbioru i ujemny dla zasilania; zapotrzebowanie jest skalowane globalnym współczynnikiem obciążenia częściowego. W węźle bez zadanego ciśnienia ciśnienie jest obliczane.","A quadratic H(Q) through the shutoff head and one rated point, H = H0 s² − a q|q|, with the speed s the local speed times the global pump-speed factor, by the affinity law. Rated head must be below shutoff head. Reverse flow and operation past zero-head runout are extrapolations of that parabola and are warned, not modelled.":"Kwadratowa charakterystyka H(Q) przechodząca przez wysokość podnoszenia przy zerowym przepływie i jeden punkt znamionowy, H = H0 s² − a q|q|, gdzie prędkość względna s to prędkość lokalna pomnożona przez globalny współczynnik prędkości pomp, zgodnie z prawami podobieństwa. Znamionowa wysokość podnoszenia musi być niższa od wysokości przy zerowym przepływie. Przepływ wsteczny i praca za punktem zerowej wysokości podnoszenia są ekstrapolacją tej paraboli i są sygnalizowane ostrzeżeniem, a nie modelowane.","A supply":"Zasilanie A","A sweep is already running.":"Analiza parametryczna już trwa.","A sweep solves the same network many times. The N-1 screen closes each pipe and valve in turn and reports the lowest pressure and the highest velocity that follow. The Monte-Carlo samples pipe roughness (lognormal) and nodal demand (normal) on a Latin hypercube with rank correlation and reports P5/P50/P95 quantiles. The load profile runs 24 h or 8760 h of demand multipliers and integrates hydraulic pump energy. Sweeps go to same-origin Workers only when that is measurably cheaper than the round trip; the steady solve itself always stays on the main thread.":"Analiza parametryczna oblicza tę samą sieć wielokrotnie. Analiza N-1 zamyka kolejno każdą rurę i każdy zawór i podaje najniższe ciśnienie oraz najwyższą prędkość, jakie z tego wynikają. Analiza Monte Carlo losuje chropowatość rur (rozkład logarytmiczno-normalny) i zapotrzebowanie węzłów (rozkład normalny) metodą hipersześcianu łacińskiego z korelacją rang i podaje kwantyle P5/P50/P95. Profil obciążenia przelicza 24 h lub 8760 h mnożników zapotrzebowania i całkuje energię hydrauliczną pomp. Analizy trafiają do wątków roboczych z tego samego źródła tylko wtedy, gdy jest to mierzalnie tańsze niż przesłanie danych tam i z powrotem; samo obliczenie stanu ustalonego zawsze pozostaje w wątku głównym.","Add at least one component.":"Dodaj co najmniej jeden element.","Add at least two nodes.":"Dodaj co najmniej dwa węzły.","Affinity law H ~ n^2 for the two-point quadratic pump curve.":"Prawa podobieństwa H ~ n^2 dla dwupunktowej kwadratowej charakterystyki pompy.","All edge flows and all free-node heads are solved simultaneously by a damped Newton method on the scaled residuals, with a central-difference numerical Jacobian and a dense Gauss–Jordan solve with partial pivoting. It stops at a scaled residual of 2e-9 or at 60 iterations, and says which. The two residuals reported beside the iteration count are the physical ones: the largest nodal continuity error in m³/h and the largest edge energy error in metres.":"Wszystkie przepływy w elementach i wszystkie wysokości ciśnienia w węzłach swobodnych są obliczane jednocześnie tłumioną metodą Newtona na skalowanych residuach, z numeryczną macierzą Jacobiego z różnic centralnych i gęstym rozwiązaniem Gaussa–Jordana z częściowym wyborem elementu głównego. Obliczenie kończy się przy skalowanym residuum 2e-9 albo po 60 iteracjach i podaje, który warunek zadziałał. Dwa residua podawane obok liczby iteracji są fizyczne: największy błąd ciągłości w węźle w m³/h i największy błąd bilansu energii w elemencie w metrach.","An iterative heuristic that closes the valves carrying more than their target flow until each is within about 2 % of it, at the current partial load. Rated Kv values are never modified — only the opening. Coupled or infeasible targets are reported rather than forced.":"Iteracyjna heurystyka, która przymyka zawory z przepływem większym od docelowego, aż każdy z nich znajdzie się w granicach około 2% tej wartości, przy bieżącym obciążeniu częściowym. Znamionowe wartości Kv nigdy nie są zmieniane — tylko stopień otwarcia. Wartości docelowe sprzężone lub nieosiągalne są zgłaszane, a nie wymuszane.","Analysis controls":"Parametry analizy","At least one fixed-pressure node is required in every connected component.":"Każda spójna część sieci wymaga co najmniej jednego węzła o zadanym ciśnieniu.","At most 600 nonlinear unknowns (components + free nodes)":"Maksymalnie 600 niewiadomych nieliniowych (elementy + węzły swobodne)","Auto-balance":"Automatyczne równoważenie","Auto-balance valves":"Automatyczne równoważenie zaworów","B control valve":"Zawór regulacyjny B","B supply":"Zasilanie B","Balance target @100% load":"Przepływ docelowy równoważenia przy 100% obciążenia","Balancing failed:":"Równoważenie nie powiodło się:","Balancing is not meaningful at 0% load":"Równoważenie nie ma sensu przy obciążeniu 0%","Boundary +in m³/h":"Dopływ z granicy m³/h","Boundary [m³/h]":"Przepływ na granicy [m³/h]","Boundary conditions":"Warunki brzegowe","Branch A":"Odgałęzienie A","Branch B":"Odgałęzienie B","C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156 — used only to quantify the Swamee-Jain scatter.":"C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156 — użyte wyłącznie do ilościowej oceny rozrzutu wzoru Swamee–Jaina.","Cancel sweep":"Anuluj analizę parametryczną","Click empty canvas to add a node.":"Kliknij pusty obszar rysunku, aby dodać węzeł.","Click start node, then end node to add a heat exchanger.":"Kliknij węzeł początkowy, a następnie węzeł końcowy, aby dodać wymiennik ciepła.","Click start node, then end node to add a pipe.":"Kliknij węzeł początkowy, a następnie węzeł końcowy, aby dodać rurę.","Click start node, then end node to add a valve.":"Kliknij węzeł początkowy, a następnie węzeł końcowy, aby dodać zawór.","Click suction node, then discharge node to add a pump.":"Kliknij węzeł po stronie ssawnej, a następnie po stronie tłocznej, aby dodać pompę.","Component":"Element","Component closed":"Zamknięty element","Component results":"Wyniki elementów","Components":"Elementy","Could not sweep the system curve over a usable range.":"Nie udało się wyznaczyć charakterystyki instalacji w użytecznym zakresie.","Darcy–Weisbach with the Swamee–Jain explicit friction factor above Re = 4000, 64/Re below Re = 2000 and a smoothstep blend between them. Diameter and roughness are entered in millimetres, length in metres. ΣK collects the bends, tees and fittings on the run; junction and fitting losses have to be entered here because the solver has no geometry to infer them from.":"Darcy–Weisbach ze współczynnikiem tarcia według jawnego wzoru Swamee–Jaina powyżej Re = 4000, 64/Re poniżej Re = 2000 i przejściem smoothstep między nimi. Średnicę i chropowatość podaje się w milimetrach, długość w metrach. ΣK zbiera łuki, trójniki i kształtki na odcinku; straty miejscowe na połączeniach i kształtkach trzeba podać tutaj, ponieważ solver nie zna geometrii, z której mógłby je wyznaczyć.","Darcy–Weisbach; Swamee–Jain turbulent friction, 64/Re laminar, smooth interpolation through transition; minor-loss K included. Swamee–Jain is an":"Darcy–Weisbach; tarcie turbulentne według Swamee–Jaina, laminarne 64/Re, płynne przejście w strefie przejściowej; uwzględnione straty miejscowe K. Wzór Swamee–Jaina to","Delete":"Usuń","Delete selected":"Usuń zaznaczony","Delete the selected element":"Usuń zaznaczony element","Demand (+ out)":"Zapotrzebowanie (+ odbiór)","Demand [m³/h]":"Zapotrzebowanie [m³/h]","Demand is scaled by the global partial-load factor. Negative demand is injection. A fixed-pressure node reports the boundary exchange required to maintain its pressure.":"Zapotrzebowanie jest skalowane globalnym współczynnikiem obciążenia częściowego. Ujemne zapotrzebowanie oznacza zasilanie. Węzeł o zadanym ciśnieniu podaje przepływ wymiany na granicy potrzebny do utrzymania jego ciśnienia.","Demand m³/h":"Zapotrzebowanie m³/h","Demand rank corr.":"Korelacja rang zapotrzebowania","Demand sd (normal)":"Odchylenie standardowe zapotrzebowania (rozkład normalny)","Demand ×":"Zapotrzebowanie ×","Density and kinematic viscosity are constants for the whole network. The partial-load factor scales every nodal demand, so a network whose demands are all zero is insensitive to it. The global pump-speed factor scales every pump on top of its own local speed.":"Gęstość i lepkość kinematyczna są stałe w całej sieci. Współczynnik obciążenia częściowego skaluje każde zapotrzebowanie węzłowe, więc sieć, w której wszystkie zapotrzebowania są zerowe, jest na niego niewrażliwa. Globalny współczynnik prędkości pomp skaluje każdą pompę dodatkowo względem jej własnej prędkości lokalnej.","Design flow":"Przepływ obliczeniowy","Design Δp":"Obliczeniowe Δp","Direction:":"Kierunek:","District-heating loop":"Obieg sieci ciepłowniczej","Drag nodes. Select an element to edit it.":"Przeciągaj węzły. Zaznacz element, aby go edytować.","Draw":"Rysowanie","Draw an arbitrary network of pipes, nodes, pumps, valves and heat exchangers and solve the steady-state flows and pressures.":"Narysuj dowolną sieć rur, węzłów, pomp, zaworów i wymienników ciepła i oblicz przepływy oraz ciśnienia w stanie ustalonym.","Draw an arbitrary network of pipes, nodes, pumps, valves and heat exchangers and solve the steady-state flows and pressures. Includes Darcy–Weisbach pipe losses, pump and system curves, hydraulic grade line, valve balancing, partial-load scaling, and JSON/CSV import-export.":"Narysuj dowolną sieć rur, węzłów, pomp, zaworów i wymienników ciepła i oblicz przepływy oraz ciśnienia w stanie ustalonym. Obejmuje straty w rurach według Darcy’ego–Weisbacha, charakterystyki pomp i instalacji, linię ciśnień, równoważenie zaworów, skalowanie obciążenia częściowego oraz import i eksport JSON/CSV.","Draw and solve arbitrary hydraulic networks with pipes, pumps, valves and heat exchangers. Steady-state flows, pressures, pump/system curves, hydraulic grade line, balancing and partial-load analysis.":"Rysuj i obliczaj dowolne sieci hydrauliczne z rurami, pompami, zaworami i wymiennikami ciepła. Przepływy i ciśnienia w stanie ustalonym, charakterystyki pomp i instalacji, linia ciśnień, równoważenie i analiza obciążenia częściowego.","Draw or load a network, then press Solve network.":"Narysuj lub wczytaj sieć, a następnie naciśnij Oblicz sieć.","Drawing the network":"Rysowanie sieci","Each edge ID must start with a letter and contain only letters, digits, _ . : - (max 64 characters).":"Każdy identyfikator elementu musi zaczynać się od litery i zawierać wyłącznie litery, cyfry, _ . : - (maks. 64 znaki).","Each node ID must start with a letter and contain only letters, digits, _ . : - (max 64 characters).":"Każdy identyfikator węzła musi zaczynać się od litery i zawierać wyłącznie litery, cyfry, _ . : - (maks. 64 znaki).","Edge":"Element","Edge energy:  h_a + z_a - h_b - z_b + H_pump(q) - h_loss(q) = 0":"Bilans energii elementu:  h_a + z_a - h_b - z_b + H_pump(q) - h_loss(q) = 0","Edge results":"Wyniki elementów","Elevation":"Rzędna","Elevation m":"Rzędna m","Ensemble sweep results":"Wyniki analiz parametrycznych","Ensemble sweeps":"Analizy parametryczne","Equal percentage (R=50)":"Stałoprocentowa (R=50)","Equations":"Równania","Every network needs at least one fixed-pressure node per connected component; a closed circuit needs one arbitrary reference.":"Każda sieć wymaga co najmniej jednego węzła o zadanym ciśnieniu w każdej spójnej części; obieg zamknięty wymaga jednego dowolnego węzła odniesienia.","Every node in this network has zero demand, and the profile multiplier scales nodal demands only — so every hour below is the same operating point. Give at least one node a demand to make the profile mean anything.":"Każdy węzeł tej sieci ma zerowe zapotrzebowanie, a mnożnik profilu skaluje wyłącznie zapotrzebowanie węzłowe — więc każda godzina poniżej to ten sam punkt pracy. Nadaj zapotrzebowanie co najmniej jednemu węzłowi, aby profil miał znaczenie.","Exponent n":"Wykładnik n","Fixed gauge pressure boundary":"Węzeł brzegowy o zadanym nadciśnieniu","Fixed-pressure boundary":"Węzeł o zadanym ciśnieniu","Fixed-pressure node:  h = p / (rho g)":"Węzeł o zadanym ciśnieniu:  h = p / (rho g)","Flow [m³/h]":"Przepływ [m³/h]","Flow m³/h":"Przepływ m³/h","Flow-following loop coordinate":"Współrzędna pętli wzdłuż przepływu","Fluid and load":"Ciecz i obciążenie","Fluid density":"Gęstość cieczy","Fluid density must be a positive finite number.":"Gęstość cieczy musi być dodatnią liczbą skończoną.","For every free node the solver enforces continuity. For every edge it enforces the steady Bernoulli equation using pressure head + elevation, pump head and signed component loss. Unknown edge flows and free-node pressure heads are solved simultaneously with a damped Newton method.":"W każdym węźle swobodnym solver wymusza ciągłość. Dla każdego elementu wymusza ustalone równanie Bernoulliego z wysokością ciśnienia + rzędną, wysokością podnoszenia pompy i stratą elementu ze znakiem. Nieznane przepływy w elementach i wysokości ciśnienia w węzłach swobodnych są obliczane jednocześnie tłumioną metodą Newtona.","Friction: f = 64/Re for Re <= 2000; Swamee-Jain f = 0.25 / [log10(eps/(3.7 D) + 5.74/Re^0.9)]^2 for Re >= 4000; smoothstep blend between":"Tarcie: f = 64/Re dla Re <= 2000; Swamee–Jain f = 0.25 / [log10(eps/(3.7 D) + 5.74/Re^0.9)]^2 dla Re >= 4000; przejście smoothstep pomiędzy","Gauge pressure":"Nadciśnienie","Global pump-speed factor":"Globalny współczynnik prędkości pomp","Global pump-speed factor must be between 40 and 120%.":"Globalny współczynnik prędkości pomp musi wynosić od 40 do 120%.","H. Cross, Analysis of Flow in Networks of Conduits or Conductors, Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936) — loop-correction method.":"H. Cross, Analysis of Flow in Networks of Conduits or Conductors, Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936) — metoda poprawek obwodowych.","HGL excludes velocity head. Junction and fitting losses must be entered through K.":"Linia ciśnień nie uwzględnia wysokości prędkości. Straty miejscowe na połączeniach i kształtkach trzeba podać przez K.","HX design point":"Punkt obliczeniowy wymiennika","Hagen-Poiseuille laminar closed form f = 64/Re — derived, used to grade the laminar branch.":"Rozwiązanie Hagena–Poiseuille’a dla przepływu laminarnego f = 64/Re — wyprowadzone, użyte do oceny gałęzi laminarnej.","Head / elevation [m]":"Wysokość / rzędna [m]","Head [m]":"Wysokość podnoszenia [m]","Head at rated flow":"Wysokość podnoszenia przy przepływie znamionowym","Heat exchanger":"Wymiennik ciepła","Heat exchanger:":"Wymiennik ciepła:","Heat exchanger:  h_loss = (dp_design / (rho g)) (q / q_design)^n":"Wymiennik ciepła: h_loss = (dp_design / (rho g)) (q / q_design)^n","Heat exchangers":"Wymienniki ciepła","Heat-exchanger exponent n between 1 and 3":"Wykładnik wymiennika ciepła n od 1 do 3","Highest v m/s":"Największa v m/s","Hour":"Godzina","Hourly demand multipliers (24 values, comma separated)":"Godzinowe mnożniki zapotrzebowania (24 wartości rozdzielone przecinkami)","How it is solved, and how well":"Jak przebiega obliczenie i z jaką dokładnością","Hrated":"Hrated","Hydraulic Network Solver":"Obliczanie sieci hydraulicznych","Hydraulic grade line":"Linia ciśnień","Hydraulic grade line of the selected pump loop.":"Linia ciśnień w wybranym obiegu pompy.","Hydraulic internal checks failed":"Wewnętrzne testy obliczeń hydraulicznych nie powiodły się","Hydraulic network drawing canvas":"Obszar rysunku sieci hydraulicznej","Hydraulic pump energy ρgQH integrated over the period:":"Hydrauliczna energia pomp ρgQH scałkowana w okresie:","IEC 60534-2-1 / metric Kv definition: Q[m3/h] = Kv sqrt(dp[bar]/SG).":"IEC 60534-2-1 / definicja metryczna Kv: Q[m3/h] = Kv sqrt(dp[bar]/SG).","Ignored":"Pominięto","Imported global pump-speed factor must be between 40 and 120%.":"Importowany globalny współczynnik prędkości pomp musi wynosić od 40 do 120%.","Imported partial-load factor must be between 0 and 150%.":"Importowany współczynnik obciążenia częściowego musi wynosić od 0 do 150%.","Initial residual is not finite. Check component data.":"Początkowe residuum nie jest skończone. Sprawdź dane elementów.","Inside diameter":"Średnica wewnętrzna","Invalid network file":"Nieprawidłowy plik sieci","It draws a hydraulic network — nodes joined by pipes, pumps, valves and heat exchangers — and solves the steady flows and pressures in it. Load the example, or place nodes and join them, give at least one node a fixed pressure, then press Solve network. Nothing is computed until you do: this is a run tool, and the result is marked stale the moment you change anything.":"Narzędzie rysuje sieć hydrauliczną — węzły połączone rurami, pompami, zaworami i wymiennikami ciepła — i oblicza w niej przepływy oraz ciśnienia w stanie ustalonym. Wczytaj przykład albo umieść węzły i połącz je, nadaj co najmniej jednemu węzłowi zadane ciśnienie, a następnie naciśnij Oblicz sieć. Nic nie jest obliczane, dopóki tego nie zrobisz: obliczenie uruchamia się przyciskiem, a wynik jest oznaczany jako nieaktualny przy każdej zmianie.","Jacobian is singular":"macierz Jacobiego jest osobliwa","Kinematic viscosity":"Lepkość kinematyczna","Kinematic viscosity must be a positive finite number.":"Lepkość kinematyczna musi być dodatnią liczbą skończoną.","Kv at 100%":"Kv przy 100%","Kv design relation":"Zależność obliczeniowa Kv","Length":"Długość","Linear Kv":"Liniowa","Load profile":"Profil obciążenia","Load profile cancelled.":"Anulowano profil obciążenia.","Load profile failed:":"Profil obciążenia nie powiódł się:","Load profile: every node in this network has zero demand and the profile multiplier scales nodal demands only, so every hour is the same operating point and the energy figure is one point multiplied by the number of hours.":"Profil obciążenia: każdy węzeł tej sieci ma zerowe zapotrzebowanie, a mnożnik profilu skaluje wyłącznie zapotrzebowanie węzłowe, więc każda godzina to ten sam punkt pracy, a energia to jeden punkt pomnożony przez liczbę godzin.","Loads three same-origin scripts beside the page — site-disclaimer.js, diagram-common.js and diagram-compute.classic.js (the classic build of the shared compute runtime). Nothing else is fetched, no third-party host is contacted, and nothing about the network the user draws is transmitted anywhere: every sweep runs in this browser, on the main thread or in same-origin Blob Workers created from diagram-compute.classic.js.":"Wczytuje trzy skrypty z tego samego źródła co strona — site-disclaimer.js, diagram-common.js i diagram-compute.classic.js (klasyczna wersja współdzielonego środowiska obliczeniowego). Nic innego nie jest pobierane, żaden zewnętrzny serwer nie jest kontaktowany i żadne dane o rysowanej sieci nie są nigdzie przesyłane: każda analiza parametryczna działa w tej przeglądarce, w wątku głównym albo w wątkach roboczych Blob z tego samego źródła utworzonych z diagram-compute.classic.js.","Local speed":"Prędkość lokalna","Loss [m]":"Strata [m]","Lowest p kPa(g)":"Najniższe nadciśnienie kPa","Main return":"Powrót główny","Main supply":"Zasilanie główne","Max continuity residual":"Maks. residuum ciągłości","Max energy residual":"Maks. residuum energii","Minor-loss ΣK":"ΣK strat miejscowych","Model limits":"Ograniczenia modelu","Monte-Carlo":"Monte Carlo","Monte-Carlo cancelled.":"Anulowano analizę Monte Carlo.","Monte-Carlo failed:":"Analiza Monte Carlo nie powiodła się:","Monte-Carlo samples":"Liczba próbek Monte Carlo","Monte-Carlo seed":"Ziarno generatora Monte Carlo","N-1 screen":"Analiza N-1","N-1 screen cancelled.":"Anulowano analizę N-1.","N-1 screen failed:":"Analiza N-1 nie powiodła się:","NETWORK =":"NETWORK =","Name":"Nazwa","Network drawing:":"Rysunek sieci:","Network editor":"Edytor sieci","Network file":"Plik sieci","Network file is too large (5 MB limit).":"Plik sieci jest za duży (limit 5 MB).","Network file is too large for this editor (max 1000 nodes / 3000 components).":"Plik sieci jest za duży dla tego edytora (maks. 1000 węzłów / 3000 elementów).","Network files":"Pliki sieci","Network loaded":"Sieć wczytana","Newton iterations":"Iteracje Newtona","Newton line search failed.":"Przeszukiwanie liniowe metody Newtona nie powiodło się.","No HGL generated.":"Nie wyznaczono linii ciśnień.","No continuous flow-following return path; showing a topological fallback path.":"Brak ciągłej ścieżki powrotnej zgodnej z kierunkiem przepływu; pokazano zastępczą ścieżkę topologiczną.","No curve generated.":"Nie wyznaczono charakterystyki.","No return path from pump discharge to suction. HGL needs a loop/path excluding the pump.":"Brak ścieżki powrotnej od tłoczenia pompy do ssania. Linia ciśnień wymaga pętli/ścieżki z pominięciem pompy.","Node":"Węzeł","Node continuity (free nodes):  SUM_in q - SUM_out q - demand * load_factor = 0":"Ciągłość w węźle (węzły swobodne):  SUM_in q - SUM_out q - demand * load_factor = 0","Node results":"Wyniki węzłów","Nodes":"Węzły","Nodes and edges must be arrays.":"Węzły i elementy muszą być tablicami.","None":"Brak","Not solved":"Nie obliczono","Not solved.":"Nie obliczono.","Nothing to cancel; this sweep cannot be interrupted without the shared runtime.":"Nie ma czego anulować; tej analizy nie można przerwać bez współdzielonego środowiska wykonawczego.","Nothing to sample. Give the roughness a sigma above 0 (the network needs pipes), or the demands an sd above 0 on a network that has non-zero demands.":"Brak danych do losowania. Nadaj chropowatości sigmę większą od 0 (sieć musi mieć rury) albo zapotrzebowaniom odchylenie standardowe większe od 0 w sieci z niezerowym zapotrzebowaniem.","Open a hydraulic-network JSON file":"Otwórz plik JSON sieci hydraulicznej","Open network JSON…":"Otwórz plik JSON sieci…","Opening":"Stopień otwarcia","Opening characteristic":"Charakterystyka zaworu","Outcome":"Wynik","Over limit":"Ponad limitem","P.K. Swamee & A.K. Jain, Explicit equations for pipe-flow problems, ASCE J. Hydraulics Div. 102(5) (1976) 657-664 — f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, stated for 1e-6 <= eps/D <= 1e-2 and 5e3 <= Re <= 1e8.":"P.K. Swamee i A.K. Jain, Explicit equations for pipe-flow problems, ASCE J. Hydraulics Div. 102(5) (1976) 657-664 — f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, podane dla 1e-6 <= eps/D <= 1e-2 i 5e3 <= Re <= 1e8.","Partial load 0 to 150 %, global pump speed 40 to 120 %":"Obciążenie częściowe od 0 do 150 %, globalna prędkość pomp od 40 do 120 %","Partial-load demand factor":"Współczynnik obciążenia częściowego","Partial-load factor must be between 0 and 150%.":"Współczynnik obciążenia częściowego musi wynosić od 0 do 150%.","Pipe":"Rura","Pipe:":"Rura:","Pipe:  h_loss = (f L/D + K) v^2 / (2 g),  v = q/A,  Re = v D / nu":"Rura: h_loss = (f L/D + K) v^2 / (2 g), v = q/A, Re = v D / nu","Pipes":"Rury","Plant return":"Powrót do źródła","Pointer":"Zaznaczanie","Positive edge flow follows its arrow.":"Dodatni przepływ w elemencie ma kierunek strzałki.","Pressure kPa(g)":"Nadciśnienie kPa","Profile length":"Długość profilu","Properties":"Właściwości","Pump":"Pompa","Pump / system curve":"Charakterystyka pompy / instalacji","Pump / system curve — select a pump, then press Pump / system curve.":"Charakterystyka pompy / instalacji — wybierz pompę, a następnie naciśnij Charakterystyka pompy / instalacji.","Pump H m":"Wysokość podnoszenia pompy m","Pump [m]":"Pompa [m]","Pump and system curve":"Charakterystyki pompy i instalacji","Pump discharge":"Tłoczenie pompy","Pump kW (hydraulic)":"Moc pompy kW (hydrauliczna)","Pump rated head must be below shutoff head; reverse flow and beyond-runout operation are extrapolations and are warned":"Znamionowa wysokość podnoszenia pompy musi być niższa od wysokości przy zerowym przepływie; przepływ wsteczny i praca za punktem zerowej wysokości podnoszenia są ekstrapolacją i są sygnalizowane ostrzeżeniem","Pump, two branches, coil and control valve — the shipped example":"Pompa, dwa odgałęzienia, wężownica i zawór regulacyjny — przykład dołączony do narzędzia","Pump/system curve":"Charakterystyka pompy / instalacji","Pump:":"Pompa:","Pump:  H = H0 s^2 - a q|q|,  a = (H0 - H_rated)/q_rated^2,  s = local speed x global speed factor":"Pompa:  H = H0 s^2 - a q|q|,  a = (H0 - H_rated)/q_rated^2,  s = prędkość lokalna x globalny współczynnik prędkości","Pumps":"Pompy","Qrated":"Qrated","Rated flow":"Przepływ znamionowy","Received":"Przyjęto","Results":"Wyniki","Return header":"Kolektor powrotny","Roughness":"Chropowatość","Roughness rank corr.":"Korelacja rang chropowatości","Roughness σ (lognormal)":"Chropowatość σ (rozkład logarytmiczno-normalny)","Run an N-1 screen, a Monte-Carlo or a load profile. Each one solves the network many times; the pump / system curve above is now the same kind of sweep.":"Uruchom analizę N-1, analizę Monte Carlo albo profil obciążenia. Każda z nich oblicza sieć wielokrotnie; charakterystyka pompy / instalacji powyżej jest teraz analizą parametryczną tego samego rodzaju.","Save network JSON":"Zapisz sieć jako JSON","Save network JSON writes the drawing, the components and the fluid as a versioned document; Open network JSON reads one back, validating every field before it touches the canvas. This is the network, not the calculation: the shared bar below carries the calculation record as JSON, CSV, a PDF report and a python script, and Copy link puts the whole network in a permalink.":"Zapisz sieć jako JSON zapisuje rysunek, elementy i ciecz jako wersjonowany dokument; Otwórz plik JSON sieci wczytuje go z powrotem, sprawdzając każde pole, zanim cokolwiek trafi na obszar rysunku. To jest sieć, a nie obliczenie: wspólny pasek poniżej zawiera zapis obliczenia jako JSON, CSV, raport PDF i skrypt Pythona, a Kopiuj link umieszcza całą sieć w stałym odnośniku.","Scaled residual":"Skalowane residuum","Seasonal swing (8760 h only)":"Wahanie sezonowe (tylko 8760 h)","Select a node or a component on the drawing to edit it.":"Zaznacz węzeł lub element na rysunku, aby go edytować.","Select a pump first":"Najpierw wybierz pompę","Select moves and selects. Node places a node on empty canvas. Pipe, Pump, Valve and Heat exchanger each need two clicks: the start node, then the end node. The arrow drawn on a component is its positive direction — a negative solved flow means the fluid runs the other way. Delete removes the selected element, and every edit can be undone from the header.":"Zaznaczanie przesuwa i zaznacza. Węzeł umieszcza węzeł na pustym obszarze rysunku. Rura, Pompa, Zawór i Wymiennik ciepła wymagają dwóch kliknięć: węzła początkowego, a potem końcowego. Strzałka narysowana na elemencie wskazuje jego dodatni kierunek — ujemny obliczony przepływ oznacza, że ciecz płynie w przeciwną stronę. Usuń usuwa zaznaczony element, a każdą zmianę można cofnąć z nagłówka.","Selected:":"Zaznaczono:","Set target flow on at least one valve":"Ustaw przepływ docelowy na co najmniej jednym zaworze","Shared compute runtime: starting…":"Współdzielone środowisko obliczeniowe: uruchamianie…","Shutoff head H₀":"Wysokość podnoszenia przy zerowym przepływie H₀","Solve failed":"Obliczenie nie powiodło się","Solve network":"Oblicz sieć","Solve the network first.":"Najpierw oblicz sieć.","Solved in":"Obliczono w","Solved simultaneously for all edge flows and free-node heads by a damped Newton method with a numerical Jacobian":"Obliczane jednocześnie dla wszystkich przepływów w elementach i wysokości ciśnienia w węzłach swobodnych tłumioną metodą Newtona z numeryczną macierzą Jacobiego","Solver diverged. Check component data.":"Obliczenie jest rozbieżne. Sprawdź dane elementów.","Solver failed:":"Obliczenie nie powiodło się:","Speed m/s":"Prędkość m/s","Static Δp a−b kPa":"Statyczne Δp a−b kPa","Steady state, incompressible, single phase; constant density and viscosity":"Stan ustalony, nieściśliwy, jednofazowy; stała gęstość i lepkość","Steady-state incompressible networks · ensemble sweeps on the shared compute runtime":"Sieci nieściśliwe w stanie ustalonym · analizy parametryczne we współdzielonym środowisku obliczeniowym","Steady-state, incompressible and single-phase. Fluid properties are constant. Heat exchangers are hydraulic resistances only. Pump curves use shutoff head plus one rated point; reverse flow and operation beyond zero-head runout are extrapolations and are warned. Automatic balancing is an iterative valve-opening heuristic and cannot guarantee coupled or infeasible targets. In meshed networks the HGL plot shows one representative flow-following return path (or a labelled topological fallback), not every path; HGL excludes velocity head. Junction/fitting losses must be entered through K. The dense browser solver refuses models above 600 nonlinear unknowns. No water hammer, NPSH/cavitation, efficiency map or transient control model is included.":"Stan ustalony, przepływ nieściśliwy i jednofazowy. Właściwości cieczy są stałe. Wymienniki ciepła są wyłącznie oporami hydraulicznymi. Charakterystyki pomp opierają się na wysokości podnoszenia przy zerowym przepływie i jednym punkcie znamionowym; przepływ wsteczny i praca za punktem zerowej wysokości podnoszenia są ekstrapolacją i są sygnalizowane ostrzeżeniem. Automatyczne równoważenie to iteracyjna heurystyka nastawy zaworów i nie gwarantuje osiągnięcia wartości docelowych sprzężonych lub nieosiągalnych. W sieciach pierścieniowych wykres linii ciśnień pokazuje jedną reprezentatywną ścieżkę powrotną zgodną z przepływem (albo oznaczoną ścieżkę zastępczą), a nie każdą ścieżkę; linia ciśnień nie uwzględnia wysokości prędkości. Straty miejscowe na połączeniach i kształtkach trzeba podać przez K. Gęsty solver w przeglądarce odrzuca modele powyżej 600 niewiadomych nieliniowych. Model nie obejmuje uderzenia hydraulicznego, NPSH/kawitacji, map sprawności ani dynamiki regulacji.","Supply header":"Kolektor zasilający","Swamee-Jain is published for 1e-6 <= eps/D <= 1e-2 and 5e3 <= Re <= 1e8; it differs from the Colebrook root by up to about 3 % over that range":"Wzór Swamee–Jaina opublikowano dla 1e-6 <= eps/D <= 1e-2 i 5e3 <= Re <= 1e8; w tym zakresie różni się od pierwiastka równania Colebrooka o maksymalnie około 3 %","Sweep cancelled.":"Anulowano analizę parametryczną.","System curve requires positive solved flow through the selected pump.":"Charakterystyka instalacji wymaga dodatniego obliczonego przepływu przez wybraną pompę.","THE ACCURACY BOUND IS VOID FOR AT LEAST ONE TALLY.":"OSZACOWANIE DOKŁADNOŚCI NIE OBOWIĄZUJE DLA CO NAJMNIEJ JEDNEGO ZLICZENIA.","The Monte-Carlo sweep needs diagram-compute.classic.js — its Latin-hypercube design, its rank-correlation transform and its mergeable quantile tallies are the runtime’s, and this build will not swap in a different sampler and present it as the same experiment.":"Analiza Monte Carlo wymaga diagram-compute.classic.js — jej plan hipersześcianu łacińskiego, transformacja korelacji rang i scalalne zliczenia kwantyli należą do środowiska wykonawczego, a ta wersja nie podstawi innego generatora próbek i nie przedstawi go jako tego samego eksperymentu.","The N-1 screen closes pipes and valves one at a time; this network has neither.":"Analiza N-1 zamyka kolejno rury i zawory; w tej sieci nie ma ani rur, ani zaworów.","The ensemble sweep results also recorded here — pump/system curve, N-1 screen, Monte-Carlo quantiles, load-profile energy — are NOT reproduced: each is tens to thousands of further solves, and the Monte-Carlo additionally rests on the shared runtime’s Latin-hypercube design, its rank-correlation transform and its DDSketch quantile tallies, none of which this single file carries.":"Wyniki analiz parametrycznych również zapisane tutaj — charakterystyka pompy / instalacji, analiza N-1, kwantyle Monte Carlo, energia profilu obciążenia — NIE są odtwarzane: każda z nich to od kilkudziesięciu do tysięcy dalszych obliczeń, a Monte Carlo opiera się dodatkowo na planie hipersześcianu łacińskiego, transformacji korelacji rang i zliczeniach kwantyli DDSketch ze współdzielonego środowiska wykonawczego, których ten pojedynczy plik nie zawiera.","The head along one return path from the pump discharge back to its suction, drawn against the elevation profile. In a meshed network there are many such paths; the plot shows one flow-following path, or a labelled topological fallback when no continuous flow-following path exists. It excludes velocity head.":"Wysokość wzdłuż jednej ścieżki powrotnej od tłoczenia pompy z powrotem do jej ssania, na tle profilu rzędnych. W sieci pierścieniowej takich ścieżek jest wiele; wykres pokazuje jedną ścieżkę zgodną z przepływem albo oznaczoną zastępczą ścieżkę topologiczną, gdy ciągła ścieżka zgodna z przepływem nie istnieje. Nie uwzględnia wysokości prędkości.","The hourly profile needs exactly 24 finite, non-negative multipliers.":"Profil godzinowy wymaga dokładnie 24 skończonych, nieujemnych mnożników.","The load profile reports pump energy; this network has no pump.":"Profil obciążenia podaje energię pomp; w tej sieci nie ma pompy.","The metric Kv relation, dp[bar] = SG (q[m³/h] / Kv_eff)². Kv_eff is Kv × opening for a linear characteristic and Kv × 50^(opening−1) for equal percentage. The balance target is the flow the auto-balance heuristic tries to reach at 100 % load by closing the valve; rated Kv is never changed.":"Metryczna zależność Kv, dp[bar] = SG (q[m³/h] / Kv_eff)². Kv_eff to Kv × stopień otwarcia dla charakterystyki liniowej i Kv × 50^(otwarcie−1) dla stałoprocentowej. Przepływ docelowy równoważenia to przepływ, który heurystyka automatycznego równoważenia próbuje osiągnąć przy 100 % obciążenia przez przymknięcie zaworu; znamionowe Kv nigdy się nie zmienia.","The network changed while the sweep was running. Solve it again, then redraw the curve.":"Sieć zmieniła się w trakcie analizy parametrycznej. Oblicz ją ponownie, a następnie narysuj charakterystykę od nowa.","The shared interface layer (diagram-ui.js) did not load. Every input, the solver, the drawing, the sweeps and every export still work; the page falls back to one plain column.":"Wspólna warstwa interfejsu (diagram-ui.js) nie wczytała się. Wszystkie dane wejściowe, solver, rysunek, analizy parametryczne i każdy eksport nadal działają; strona przechodzi na jedną prostą kolumnę.","This sweep needs diagram-compute.classic.js: its \"":"Ta analiza parametryczna wymaga diagram-compute.classic.js: jej plan „","Topological fallback path coordinate":"Współrzędna zastępczej ścieżki topologicznej","Type":"Typ","Unsupported hydraulic-network schema version":"Nieobsługiwana wersja schematu sieci hydraulicznej","Valve":"Zawór","Valve opening 0.1 % to 100 %":"Stopień otwarcia zaworu od 0,1 % do 100 %","Valve:":"Zawór:","Valve:  dp[bar] = SG (q[m3/h] / Kv_eff)^2,  Kv_eff = Kv * o (linear) or Kv * 50^(o-1) (equal percentage), o = opening/100":"Zawór:  dp[bar] = SG (q[m3/h] / Kv_eff)^2,  Kv_eff = Kv * o (liniowa) lub Kv * 50^(o-1) (stałoprocentowa), o = otwarcie/100","Valves":"Zawory","Velocity limit":"Limit prędkości","What this tool does":"Co robi to narzędzie","With a pump selected, the network is re-solved 33 times with that pump forced to a series of flows. The system curve is the head the network demands at each flow; the pump curve is what the pump delivers; they cross at the operating point. Every point is solved cold, so the curve does not depend on the order the points were computed in.":"Po wybraniu pompy sieć jest obliczana 33 razy z przepływem przez tę pompę wymuszonym na kolejnych wartościach. Charakterystyka instalacji to wysokość, jakiej sieć wymaga przy każdym przepływie; charakterystyka pompy to wysokość, jaką daje pompa; przecinają się w punkcie pracy. Każdy punkt jest obliczany od zera, więc charakterystyka nie zależy od kolejności obliczania punktów.","a Worker case was checked against the same case solved on the main thread before any sweep was offered":"jeden przypadek z wątku roboczego porównano z tym samym przypadkiem obliczonym w wątku głównym, zanim udostępniono jakąkolwiek analizę parametryczną","and 5·10":"i 5·10","arithmetic, and that rule is what governs on a platform whose libm rounds differently.":"arytmetyki, i to ta reguła decyduje na platformie, której libm zaokrągla inaczej.","at node":"w węźle","at opening limit:":"przy granicy otwarcia:","cancelled by the user":"anulowane przez użytkownika","cancelling…":"anulowanie…","central-difference Jacobian, the damped line search and the linear solve are all the":"macierz Jacobiego z różnic centralnych, tłumione przeszukiwanie liniowe i rozwiązanie układu liniowego są wszystkie","delete,backspace":"Delete, Backspace","diagram-compute.classic.js did not load; sweeps run on the main thread and the Monte-Carlo sweep is unavailable because its Latin-hypercube design and quantile tallies live in the runtime":"diagram-compute.classic.js nie wczytał się; analizy parametryczne działają w wątku głównym, a analiza Monte Carlo jest niedostępna, ponieważ jej plan hipersześcianu łacińskiego i zliczenia kwantyli należą do środowiska wykonawczego","diagram-compute.classic.js is absent, so the sweep ran as one blocking main-thread loop, exactly as v1 did":"brak diagram-compute.classic.js, więc analiza parametryczna wykonała się jako jedna blokująca pętla w wątku głównym, dokładnie jak w v1","every case was evaluated in index order on one thread, with no shared warm start":"każdy przypadek obliczono w kolejności indeksów w jednym wątku, bez wspólnego startu z poprzedniego rozwiązania","explicit approximation":"jawne przybliżenie","gate then bounds the result at roughly 1e-7 relative.":"kryterium zatrzymania ogranicza wtedy wynik do około 1e-7 względnie.","hL signed m":"hL ze znakiem m","halts at a scaled residual of 2e-9, worth about 1e-7 relative) rather than by the":"zatrzymuje się przy skalowanym residuum 2e-9, odpowiadającym około 1e-7 względnie), a nie przez","iterations; scaled residual":"iteracji; skalowane residuum","kPa (gauge)":"kPa (nadciśnienie)","kW (hydraulic)":"kW (hydrauliczna)","kWh (hydraulic, rho g Q H; no pump or motor efficiency)":"kWh (hydrauliczna, rho g Q H; bez sprawności pompy i silnika)","laminar friction":"tarcie laminarne","main thread":"wątek główny","metric Kv relation, with optional opening law.":"metryczna zależność Kv z opcjonalną charakterystyką otwarcia.","no Worker pool could be created (":"nie udało się utworzyć puli wątków roboczych (","no result":"brak wyniku","no runtime; one blocking main-thread loop":"brak środowiska wykonawczego; jedna blokująca pętla w wątku głównym","no sweep has run yet; the interactive solve is always on the main thread":"nie wykonano jeszcze analizy parametrycznej; obliczenie interaktywne zawsze odbywa się w wątku głównym","no sweep run":"brak analizy parametrycznej","nodes,":"węzłów,","none (diagram-compute.classic.js absent)":"brak (nie ma diagram-compute.classic.js)","none: every recorded output reproduces bit for bit on this platform. What could":"brak: każdy zapisany wynik odtwarza się bit po bicie na tej platformie. To, co mogłoby","nothing is imported and nothing is substituted. The residual assembly, the":"niczego się nie importuje ani nie podstawia. Składanie residuów,","operating point":"punkt pracy","p [kPa g]":"p [kPa, nadciśnienie]","path taken here is the path the page took.":"ścieżka obliczeń jest tu tą samą, którą przeszła strona.","preliminary assessment":"wstępna ocena","pump affinity scaling":"skalowanie pompy według praw podobieństwa","pump discharge":"tłoczenie pompy","pump rated point":"punkt znamionowy pompy","pump suction":"ssanie pompy","quadratic H(Q) from shutoff head and one rated point, scaled by affinity law speed².":"kwadratowa charakterystyka H(Q) z wysokości podnoszenia przy zerowym przepływie i jednego punktu znamionowego, skalowana
