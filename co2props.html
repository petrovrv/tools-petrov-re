    "en": "Pure CO₂ only: impurities such as N₂, O₂, H₂O or Ar, which shift the critical point and the two-phase envelope, are not modelled. EOS validity is limited to 216.592–2000 K and pressures up to 800 MPa. No solid phase: states below the triple point or above the melting line are refused. A (p,T) input exactly on the saturation line is ambiguous; use a saturation, p–h or p–s input instead. Transport properties near the critical point are less accurate (a few percent). Not a substitute for REFPROP or certified property data.", "uk": "Лише чистий CO₂: домішки, такі як N₂, O₂, H₂O або Ar, які зміщують критичну точку та межу двофазної області, не моделюються. Чинність EOS обмежена діапазоном 216.592–2000 K і тисками до 800 MPa. Тверда фаза відсутня: стани нижче потрійної точки або вище лінії плавлення відхиляються. Вхідні дані (p,T) точно на лінії насичення є неоднозначними; натомість використовуйте вхідні дані насичення, p–h або p–s. Транспортні властивості поблизу критичної точки менш точні (похибка кілька відсотків). Не є заміною REFPROP або сертифікованих даних про властивості.", "de": "Nur reines CO₂: Verunreinigungen wie N₂, O₂, H₂O oder Ar, die den kritischen Punkt und das Zweiphasengebiet verschieben, werden nicht modelliert. Der Gültigkeitsbereich der EOS ist auf 216.592–2000 K und Drücke bis 800 MPa begrenzt. Keine feste Phase: Zustände unterhalb des Tripelpunkts oder oberhalb der Schmelzlinie werden abgelehnt. Eine (p,T)-Eingabe genau auf der Sättigungslinie ist mehrdeutig; verwenden Sie stattdessen eine Sättigungs-, p–h- oder p–s-Eingabe. Transporteigenschaften in der Nähe des kritischen Punkts sind weniger genau (einige Prozent). Kein Ersatz für REFPROP oder zertifizierte Stoffdaten.", "nl": "Alleen zuivere CO₂: onzuiverheden zoals N₂, O₂, H₂O of Ar, die het kritieke punt en het tweefasengebied verschuiven, worden niet gemodelleerd. De geldigheid van de EOS is beperkt tot 216.592–2000 K en drukken tot 800 MPa. Geen vaste fase: toestanden onder het tripelpunt of boven de smeltlijn worden geweigerd. Een (p,T)-invoer precies op de verzadigingslijn is dubbelzinnig; gebruik in plaats daarvan een verzadigings-, p–h- of p–s-invoer. Transporteigenschappen nabij het kritieke punt zijn minder nauwkeurig (enkele procenten). Geen vervanging voor REFPROP of gecertificeerde stofeigenschappen.", "fr": "CO₂ pur uniquement : les impuretés telles que N₂, O₂, H₂O ou Ar, qui déplacent le point critique et l'enveloppe diphasique, ne sont pas modélisées. La validité de l'EOS est limitée à 216.592–2000 K et à des pressions jusqu'à 800 MPa. Pas de phase solide : les états situés sous le point triple ou au-delà de la ligne de fusion sont refusés. Une entrée (p,T) exactement sur la ligne de saturation est ambiguë ; utilisez plutôt une entrée de saturation, p–h ou p–s. Les propriétés de transport près du point critique sont moins précises (quelques pour cent). Ne remplace pas REFPROP ni des données de propriétés certifiées.", "es": "Solo CO₂ puro: las impurezas como N₂, O₂, H₂O o Ar, que desplazan el punto crítico y la envolvente bifásica, no se modelan. La validez de la EOS está limitada a 216.592–2000 K y presiones de hasta 800 MPa. Sin fase sólida: se rechazan los estados por debajo del punto triple o por encima de la línea de fusión. Una entrada (p,T) exactamente sobre la línea de saturación es ambigua; utilice en su lugar una entrada de saturación, p–h o p–s. Las propiedades de transporte cerca del punto crítico son menos precisas (unos pocos por ciento). No sustituye a REFPROP ni a datos de propiedades certificados.", "pl": "Wyłącznie czysty CO₂: zanieczyszczenia, takie jak N₂, O₂, H₂O lub Ar, które przesuwają punkt krytyczny i obszar dwufazowy, nie są modelowane. Zakres ważności EOS jest ograniczony do 216.592–2000 K i ciśnień do 800 MPa. Brak fazy stałej: stany poniżej punktu potrójnego lub powyżej linii topnienia są odrzucane. Dane wejściowe (p,T) dokładnie na linii nasycenia są niejednoznaczne; zamiast tego użyj danych wejściow <script>
(function () {
  'use strict';

  /* ============================================================ 1. the model */
  function coreLib() { return (window.CCUS || {}).core || null; }

  var DEFAULTS = {level: 'simple', mode: 'pT', p: 110e5, T: 303.15, h: 300e3, sk: 1.40};

  function solve(s) {
    s = s || {};
    var mode = s.mode, core = coreLib(), r;
    var fail = function (msg) { return {ok: false, mode: mode, err: msg}; };
    var need = {pT: ['p', 'T'], ph: ['p', 'h'], ps: ['p', 'sk'], satT: ['T'], satP: ['p']}[mode];
    var names = {p: 'pressure', T: 'temperature', h: 'enthalpy', sk: 'entropy'};
    if (!core) return fail('ccus-core.js did not load');
    if (!need) return fail('Unknown mode: ' + mode);
    try {
      for (var i = 0; i < need.length; i++) {
        var v = s[need[i]];
        if (typeof v !== 'number' || !isFinite(v)) return fail('Enter a finite value for ' + names[need[i]]);
      }
      var c = core.consts;
      if (mode === 'satT') {
        if (s.T < c.Tt) return fail('Temperature is below the triple point 216.592 K');
        if (s.T > c.Tc) return fail('Temperature is above the critical temperature 304.1282 K: no saturation');
      } else if (mode === 'satP') {
        if (s.p < c.pt) return fail('Pressure is below the triple-point pressure 5.180 bar');
        if (s.p > c.pc) return fail('Pressure is above the critical pressure 73.773 bar: no saturation');
      }
    } catch (e0) {
      return fail('Invalid input: ' + (e0 && e0.message ? e0.message : String(e0)));
    }
    try {
      if (mode === 'pT') r = core.props(s.p, s.T);
      else if (mode === 'ph') r = core.flashPH(s.p, s.h);
      else if (mode === 'ps') r = core.flashPS(s.p, s.sk * 1000);
      else if (mode === 'satT') r = core.sat(s.T);
      else r = core.satP(s.p);
    } catch (e) {
      return fail('Out of range: ' + (e && e.message ? e.message : String(e)));
    }
    var isSat = mode === 'satT' || mode === 'satP';
    var rho = r ? (isSat ? r.rhoL : r.rho) : NaN;
    if (typeof rho !== 'number' || !isFinite(rho)) return fail('Out of range: no valid density for this state');
    return {ok: true, kind: isSat ? 'sat' : 'state', mode: mode, r: r};
  }

  function sig(v, n) {
    if (n === undefined || n === null) n = 5;
    v = +v;
    if (v === 0 || !isFinite(v)) return 2;
    var d = n - 1 - Math.floor(Math.log(Math.abs(v)) / Math.LN10 + 1e-12);
    if (d < 0) d = 0;
    if (d > 8) d = 8;
    return d;
  }
  function sigv(v, n) {
    if (n === undefined || n === null) n = 5;
    v = +v;
    if (!isFinite(v)) return NaN;
    if (v === 0) return 0;
    n = Math.max(1, Math.min(21, Math.round(n)));
    return Number(v.toPrecision(n));
  }
  var SAT_CACHE = null;
  function satCurve() {
    if (SAT_CACHE) return SAT_CACHE;
    var core = coreLib();
    if (!core) return [];
    var c = core.consts, Tmax = c.Tc - 0.02, pts = [], last = null, i, u, T, r;
    for (i = 0; i < 60; i++) {
      u = i / 59;
      T = c.Tt + (Tmax - c.Tt) * (1 - (1 - u) * (1 - u));
      try { r = core.sat(T); } catch (e) { continue; }
      if (!r || !isFinite(r.p)) continue;
      last = { T: T, p: r.p, hL: r.hL, hV: r.hV, sL: r.sL, sV: r.sV, rhoL: r.rhoL, rhoV: r.rhoV };
      pts.push(last);
    }
    if (last) {
      var hc = (last.hL + last.hV) / 2, sc = (last.sL + last.sV) / 2, rc = (last.rhoL + last.rhoV) / 2;
      pts.push({ T: c.Tc, p: c.pc, hL: hc, hV: hc, sL: sc, sV: sc, rhoL: rc, rhoV: rc });
      SAT_CACHE = pts;
    }
    return pts;
  }

  var state = JSON.parse(JSON.stringify(DEFAULTS));
  var last = null;

  /* ======================================================== 2. the interface */
  function T(en, uk, de, nl, fr, es, pl) { return { en: en, uk: uk, de: de, nl: nl, fr: fr, es: es, pl: pl }; }

  var stage = null;
  function LEGEND_ITEMS() {
    return [
      { label: T('Saturation curve','Крива насичення','Sättigungskurve','Verzadigingslijn','Courbe de saturation','Curva de saturación','Krzywa nasycenia'), series: 0 },
      { label: T('State','Стан','Zustand','Toestand','État','Estado','Stan'), series: 1 }
    ];
  }
  function adoptStage(app) {
    stage = app.stages[0] || null;
    if (stage) stage.legend({ items: LEGEND_ITEMS() });
  }

  var ui = null;

  function computeView(s) {
    last = solve(s);
    if (stage) stage.schedule();
    var R = last;
    if (!R || !R.ok) {
      var e = String((R && R.err) || 'Error');
      return { verdict: { tone: 'bad', text: T(e, e, e, e, e, e, e) }, tiles: [], notes: [] };
    }
    var r = R.r, full = s.level === 'full', tiles = [], meters = [], tables = [], notes = [];
    var PC = 73.773e5, TC = 304.1282, verdict;
    function fin(v) { return typeof v === 'number' && isFinite(v); }
    function sc(v, f) { return fin(v) ? v * f : null; }
    function off(v, d) { return fin(v) ? v + d : null; }
    function tile(label, v, unit, learn) {
      if (!fin(v)) return;
      tiles.push({ label: label, value: sigv(v, 5), hint: unit, precision: sig(v, 5), tone: null, learn: learn, headline: false });
    }
    function cell(v) { return fin(v) ? { value: sigv(v, 5), precision: sig(v, 5) } : { value: null, precision: 0 }; }
    function row(label, a, b) { tables[0].rows.push({ cells: [label, cell(a), cell(b)] }); }
    if (R.kind === 'sat') {
      verdict = { tone: 'ok', text: T('Saturated liquid–vapour equilibrium', 'Насичена рівновага рідина–пара',
        'Gesättigtes Flüssig-Dampf-Gleichgewicht', 'Verzadigd vloeistof-damp-evenwicht', 'Équilibre liquide–vapeur saturé',
        'Equilibrio líquido–vapor saturado', 'Równowaga nasycona ciecz–para') };
      tile('psat · saturation pressure', sc(r.p, 1e-5), 'bar', 'saturation');
      tile('Tsat · saturation temperature', off(r.T, -273.15), '°C', 'saturation');
      tile('rhoL · liquid density', r.rhoL, 'kg/m³', 'density');
      tile('rhoV · vapour density', r.rhoV, 'kg/m³', 'density');
      tile('hL · liquid enthalpy', sc(r.hL, 1e-3), 'kJ/kg', 'enthalpy');
      tile('hV · vapour enthalpy', sc(r.hV, 1e-3), 'kJ/kg', 'enthalpy');
      tile('dh · enthalpy of vaporisation', sc(r.dh, 1e-3), 'kJ/kg', 'saturation');
      if (full) {
        tile('sL · liquid entropy', sc(r.sL, 1e-3), 'kJ/(kg·K)', 'entropy');
        tile('sV · vapour entropy', sc(r.sV, 1e-3), 'kJ/(kg·K)', 'entropy');
        tile('muL · liquid viscosity', sc(r.muL, 1e6), 'µPa·s', 'transport');
        tile('muV · vapour viscosity', sc(r.muV, 1e6), 'µPa·s', 'transport');
        tile('kL · liquid thermal conductivity', sc(r.kL, 1e3), 'mW/(m·K)', 'transport');
        tile('kV · vapour thermal conductivity', sc(r.kV, 1e3), 'mW/(m·K)', 'transport');
        tables.push({ title: T('Saturated liquid and vapour', 'Насичена рідина і пара', 'Gesättigte Flüssigkeit und Dampf',

          head: ['', { label: 'liquid', num: true }, { label: 'vapour', num: true }], rows: [] });
        row('rho [kg/m³]', r.rhoL, r.rhoV);
        row('h [kJ/kg]', sc(r.hL, 1e-3), sc(r.hV, 1e-3));
        row('s [kJ/(kg·K)]', sc(r.sL, 1e-3), sc(r.sV, 1e-3));
        row('cp [kJ/(kg·K)]', sc(r.cpL, 1e-3), sc(r.cpV, 1e-3));
        row('w [m/s]', r.wL, r.wV);
        row('mu [µPa·s]', sc(r.muL, 1e6), sc(r.muV, 1e6));

      var P = {
        'gas': ['Gas', 'Газ', 'Gas', 'Gas', 'Gaz', 'Gas', 'Gaz'],

      var txt = (P[r.phase] || [r.phase, r.phase, r.phase, r.phase, r.phase, r.phase, r.phase]).slice(0);
      var dense = [' (dense phase)', ' (щільна фаза)', ' (dichte Phase)', ' (dichte fase)', ' (phase dense)', ' (fase densa)', ' (faza gęsta)'];

        ' – proche du point critique', ' – cerca del punto crítico', ' – blisko punktu krytycznego'];
      var near = fin(r.T) && fin(r.p) && Math.abs(r.T - TC) < 3 && Math.abs(r.p - PC) < 5e5, i;
      var isDense = r.p > PC && r.rho > 467.6;

      tile('rho · density', r.rho, 'kg/m³', 'density');
      tile('h · enthalpy', sc(r.h, 1e-3), 'kJ/kg', 'enthalpy');
      tile('s · entropy', sc(r.s, 1e-3), 'kJ/(kg·K)', 'entropy');
      tile('cp · heat capacity', sc(r.cp, 1e-3), 'kJ/(kg·K)', 'cp');
      tile('w · speed of sound', r.w, 'm/s', 'sound');
      tile('mu · viscosity', sc(r.mu, 1e6), 'µPa·s', 'transport');
      tile('k · thermal conductivity', sc(r.k, 1e3), 'mW/(m·K)', 'transport');
      if (full) {
        tile('Z · compressibility', r.Z, '–', 'density');
        tile('JT · Joule–Thomson', sc(r.JT, 1e5), 'K/bar', 'jt');
        tile('cv · isochoric heat capacity', sc(r.cv, 1e-3), 'kJ/(kg·K)', 'cp');
        tile('Pr · Prandtl', r.Pr, '–', 'transport');
        if (r.x != null) tile('x · quality', r.x, '–', 'phase');
        tile('T · temperature', off(r.T, -273.15), '°C', 'phase');
        tile('p · pressure', sc(r.p, 1e-5), 'bar', 'phase');
      }
      meters.push({ label: T('Distance from critical point', 'Відстань до критичної точки', 'Abstand zum kritischen Punkt',
        'Afstand tot kritisch punt', 'Distance au point critique', 'Distancia al punto crítico', 'Odległość od punktu krytycznego'),
        ratio: Math.min(1.2, r.p / PC), text: DiagramUI.fmt(r.p / 1e5, { precision: 2 }) + ' / 73.77 bar' });
      if (r.phase === 'two-phase') notes.push(T('Transport properties not defined in two-phase region', 'Транспортні властивості не визначені у двофазній області',
        'Transporteigenschaften im Zweiphasengebiet nicht definiert', 'Transporteigenschappen niet gedefinieerd in tweefasengebied',
        'Propriétés de transport non définies en diphasique', 'Propiedades de transporte no definidas en zona bifásica',
        'Właściwości transportowe nieokreślone w obszarze dwufazowym'));
    }
    if (r.satApprox) notes.push(T('Near-critical saturation approximated', 'Насичення поблизу критичної точки наближене',
      'Sättigung nahe kritischem Punkt angenähert', 'Verzadiging nabij kritisch punt benaderd', 'Saturation proche du critique approchée',
      'Saturación cercana al crítico aproximada', 'Nasycenie blisko punktu krytycznego przybliżone'));
    return { verdict: verdict, tiles: tiles, meters: meters, tables: tables, notes: notes };
  }

  function degrade() {

    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1');

    var p = document.createElement('p');
    p.textContent = 'The interactive interface could not load. The export, the calculation record '
                  + 'and the limitations are still available from the bar at the bottom of the page.';
    host.appendChild(h);
    host.appendChild(p);
    last = solve(state);
  }

      a11y: function () {

      },
      render: function (size, st) {
        var ctx = st.canvas(), w = size.w, h = size.h, coarse = size.density === 'coarse';
        var cs = getComputedStyle(document.documentElement);
        var muted = cs.getPropertyValue('--muted').trim() || '#888';

        var xMin = 0, xMax = 650, pMin = 5, pMax = 300;

        ctx.save(); ctx.beginPath(); ctx.rect(L, TOP, pw, ph); ctx.clip();
        if (PC >= pMin && PC <= pMax) {

        }

          ctx.fillStyle = c1; ctx.strokeStyle = c1; ctx.lineWidth = 1.5;
          if (isSat) {
            ctx.setLineDash([4, 3]); ctx.beginPath();
            ctx.moveTo(X(r.hL / 1000), Y(pb)); ctx.lineTo(X(r.hV / 1000), Y(pb)); ctx.stroke(); ctx.setLineDash([]);
            ctx.beginPath(); ctx.arc(X(r.hL / 1000), Y(pb), 5, 0, 2 * Math.PI); ctx.fill();
            ctx.beginPath(); ctx.arc(X(r.hV / 1000), Y(pb), 5, 0, 2 * Math.PI); ctx.fill();
          } else if (isFinite(r.h) && pb > 0) {
            ctx.beginPath(); ctx.arc(X(r.h / 1000), Y(pb), 5, 0, 2 * Math.PI); ctx.fill();
          }
        }
        ctx.restore();
        if (cp) {
          var cx = X((cp.hL + cp.hV) / 2000), cy = Y(cp.p / 1e5);
          if (cx >= L && cx <= L + pw && cy >= TOP && cy <= TOP + ph) {
            ctx.fillStyle = DiagramUI.series(0); ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, 2 * Math.PI); ctx.fill();
            ctx.fillStyle = muted; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillText('CP', cx + 5, cy - 3);
          }
        }
      }
    });
    adoptStage(ui);

    ui.ready();
    window.__co2props = { ui: ui, state: state, solve: solve, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function buildRecord() {
    if (!last) return null;
    var U = {p: 'Pa', psat: 'Pa', T: 'K', Tsat: 'K', rho: 'kg/m3', rhoL: 'kg/m3', rhoV: 'kg/m3',
      h: 'J/kg', hL: 'J/kg', hV: 'J/kg', dh: 'J/kg', s: 'J/(kg K)', sk: 'kJ/(kg K)', cp: 'J/(kg K)',
      w: 'm/s', mu: 'Pa s', k: 'W/(m K)', Z: '-', phase: '-', mode: '-'};
    var m = state.mode, r = last.r, inputs = {mode: m}, outputs = {}, units = {}, warnings = [], keys, i, key;
    if (m !== 'satT') inputs.p = state.p;
    if (m === 'pT' || m === 'satT') inputs.T = state.T;
    if (m === 'ph') inputs.h = state.h;
    if (m === 'ps') inputs.sk = state.sk;
    if (last.ok && last.kind === 'state') {
      keys = ['rho', 'h', 's', 'cp', 'w', 'mu', 'k', 'Z', 'phase', 'T', 'p'];
      for (i = 0; i < keys.length; i++) outputs[keys[i]] = r[keys[i]];
    } else if (last.ok && last.kind === 'sat') {
      outputs.psat = r.p;
      outputs.Tsat = r.T;
      keys = ['rhoL', 'rhoV', 'hL', 'hV', 'dh'];
      for (i = 0; i < keys.length; i++) outputs[keys[i]] = r[keys[i]];
    }
    for (key in inputs) if (inputs.hasOwnProperty(key)) units[key] = U[key];
    for (key in outputs) if (outputs.hasOwnProperty(key)) units[key] = U[key];
    if (!last.ok) {
      warnings.push(last.err);
    } else if (r && Math.abs(r.T - 304.1282) < 3 && Math.abs(r.p - 7.3773e6) < 5e5) {
      warnings.push('near the critical point: properties change steeply');
    }
    return {
      inputs: inputs,
      outputs: outputs,
      units: units,
      model: {
        equations: ['Span-Wagner 1996 Helmholtz EOS for CO2', 'viscosity Laesecke-Muzny 2017', 'thermal conductivity Huber 2016'],
        ranges: ['216.592-1100 K, up to 800 MPa, pure CO2'],
        notes: ['reference state IIR: h=200 kJ/kg, s=1 kJ/(kg K) for saturated liquid at 0 C']
      },
      warnings: warnings
    };
  }
  var HANDOFF = {
    provides: ['p', 'T', 'rho'],
    accepts: ['p', 'T'],
    build: function () {
      if (!last || !last.ok) return null;
      var r = last.r;
      var rho = last.kind === 'sat' ? r.rhoL : r.rho;
      return {
        quantities: {
          p: { value: r.p, unit: 'Pa' },
          T: { value: r.T, unit: 'K' },
          rho: { value: rho, unit: 'kg/m3' }
        },
        sets: {
          co2state: [
            { p: { value: r.p, unit: 'Pa' } },
            { T: { value: r.T, unit: 'K' } },
            { rho: { value: rho, unit: 'kg/m3' } }
          ]
        }
      };
    },
    apply: function (payload) {
      var q = (payload && payload.quantities) || {};
      var num = function (x) { var v = x && x.value; return (typeof v === 'number' && isFinite(v)) ? v : null; };
      var p = num(q.p), T = num(q.T);
      if (p !== null) state.p = p;
      if (T !== null) state.T = T;
      if (p !== null && T !== null) state.mode = 'pT';
      else if (T !== null && state.mode === 'satP') state.mode = 'satT';
      else if (p !== null && state.mode === 'satT') state.mode = 'satP';
      last = solve(state);
      if (ui) { ui.sync(); ui.run(); }
    }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'co2props',
        file: 'co2props.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
