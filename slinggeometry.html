  "title": {"en":"Lifting and sling geometry","uk":"Геометрія підйому та зусилля у стропах","de":"Anschlaggeometrie und Strangkräfte","nl":"Hijsgeometrie en strengkrachten","fr":"Géométrie d’élingage et efforts dans les brins","es":"Geometría de eslingado y fuerzas en los ramales","pl":"Geometria podnoszenia i siły w cięgnach"},
  "summary": {"en":"Enter load mass, centre of gravity, lifting points and hook: get the tension in each sling leg, leg angles, the settled tilt and utilisation against the WLL you enter.","uk":"Введіть масу вантажу, центр ваги, точки строповки та гак: отримайте натяг кожної гілки, кути, нахил у рівновазі та використання WLL, яке ви задали.","de":"Masse, Schwerpunkt, Anschlagpunkte und Haken eingeben: Zugkraft je Strang, Neigungswinkel, Schräglage im Gleichgewicht und Auslastung der eingegebenen WLL.","nl":"Voer massa, zwaartepunt, hijspunten en haak in: trekkracht per streng, hoeken, scheefstand in evenwicht en benutting van de ingevoerde WLL.","fr":"Saisissez masse, centre de gravité, points d’accrochage et crochet : tension de chaque brin, angles, inclinaison à l’équilibre et taux d’utilisation de la CMU saisie.","es":"Introduzca masa, centro de gravedad, puntos de izado y gancho: tensión de cada ramal, ángulos, inclinación en equilibrio y utilización de la CMU introducida.","pl":"Podaj masę, środek ciężkości, punkty zawiesia i hak: siła w każdym cięgnie, kąty, przechył w równowadze i wykorzystanie wprowadzonego DOR."},
  "description": {"en":"Static equilibrium of statically determinate rigging in one vertical plane: a two-leg sling with any lifting-point and centre-of-gravity layout, and a symmetric four-leg sling with a declared number of load-bearing legs. The load is allowed to rotate until its centre of gravity hangs under the hook. Leg tensions are compared with working load limits the user enters; an angle rule pack flags steep legs. Configurations that equilibrium cannot resolve are refused with the reason.","uk":"Статична рівновага статично визначених схем строповки в одній вертикальній площині: двогілковий строп з довільним розташуванням точок і центра ваги та симетричний чотиригілковий строп із заданою кількістю несучих гілок. Вантаж повертається, доки центр ваги не стане під гаком. Натяги порівнюються з WLL, введеними користувачем; пакет правил щодо кутів позначає круті гілки. Конфігурації, які рівновага не визначає, відхиляються з поясненням.","de":"Statisches Gleichgewicht statisch bestimmter Anschlagmittel in einer vertikalen Ebene: Zweistranggehänge mit beliebiger Lage von Anschlagpunkten und Schwerpunkt sowie symmetrisches Vierstranggehänge mit festgelegter Zahl tragender Stränge. Die Last dreht sich, bis der Schwerpunkt unter dem Haken hängt. Strangkräfte werden mit vom Nutzer eingegebenen WLL verglichen; ein Winkelregelpaket markiert steile Stränge. Nicht bestimmbare Konfigurationen werden mit Begründung abgelehnt.","nl":"Statisch evenwicht van statisch bepaalde aanslagmiddelen in één verticaal vlak: een tweesprong met willekeurige hijspunten en zwaartepunt, en een symmetrische viersprong met een opgegeven aantal dragende strengen. De last draait tot het zwaartepunt onder de haak hangt. Strengkrachten worden vergeleken met door de gebruiker ingevoerde WLL; een hoekregelpakket markeert steile strengen. Configuraties die het evenwicht niet bepaalt, worden met reden geweigerd.","fr":"Équilibre statique d’élingages isostatiques dans un plan vertical : élingue à deux brins avec points et centre de gravité quelconques, et élingue symétrique à quatre brins avec un nombre déclaré de brins porteurs. La charge pivote jusqu’à ce que son centre de gravité soit sous le crochet. Les tensions sont comparées aux CMU saisies ; un jeu de règles d’angle signale les brins trop ouverts. Les configurations que l’équilibre ne détermine pas sont refusées avec leur motif.","es":"Equilibrio estático de eslingados isostáticos en un plano vertical: eslinga de dos ramales con puntos y centro de gravedad cualesquiera, y eslinga simétrica de cuatro ramales con un número declarado de ramales portantes. La carga gira hasta que su centro de gravedad cuelga bajo el gancho. Las tensiones se comparan con las CMU introducidas; un paquete de reglas de ángulo señala ramales empinados. Las configuraciones que el equilibrio no determina se rechazan con su motivo.","pl":"Równowaga statyczna statycznie wyznaczalnych zawiesi w jednej płaszczyźnie pionowej: zawiesie dwucięgnowe z dowolnym układem punktów i środka ciężkości oraz symetryczne zawiesie czterocięgnowe z zadeklarowaną liczbą cięgien nośnych. Ładunek obraca się, aż środek ciężkości zawiśnie pod hakiem. Siły porównuje się z wprowadzonym DOR; pakiet reguł kątowych oznacza strome cięgna. Konfiguracje, których równowaga nie wyznacza, są odrzucane z podaniem przyczyny."},

  "limitations": {"en":"Rigid load, weightless inextensible legs, one vertical plane (four-leg case: symmetric plan, centre of gravity on the axis). No local stresses in lugs or beams, no sling stretch, no contact or bending over edges, no mode factors for choke or basket hitches. WLL values are the user's; manufacturer data govern. Not an engineered lift plan for critical lifts.","uk":"Жорсткий вантаж, невагомі нерозтяжні гілки, одна вертикальна площина (чотиригілковий випадок: симетричний план, центр ваги на осі). Без локальних напружень у проушинах і балках, без розтягу стропів, контакту чи перегину через кромки, без коефіцієнтів способу обв’язки. WLL задає користувач; вирішальні дані виробника. Не замінює проєкт робіт для критичних підйомів.","de":"Starre Last, gewichtslose undehnbare Stränge, eine vertikale Ebene (Vierstrangfall: symmetrischer Grundriss, Schwerpunkt auf der Achse). Keine örtlichen Spannungen in Ösen oder Trägern, keine Dehnung, kein Kontakt oder Umlenken über Kanten, keine Faktoren für Schnür- oder Hängegang. WLL stammen vom Nutzer; maßgebend sind Herstellerangaben. Kein Hubplan für kritische Hübe.","nl":"Stijve last, gewichtloze onrekbare strengen, één verticaal vlak (viersprong: symmetrisch grondvlak, zwaartepunt op de as). Geen lokale spanningen in ogen of balken, geen rek, geen contact of ombuiging over randen, geen factoren voor snoer- of mandsteek. WLL komen van de gebruiker; fabrikantgegevens zijn bepalend. Geen hijsplan voor kritische hijsen.","fr":"Charge rigide, brins sans poids et inextensibles, un plan vertical (quatre brins : plan symétrique, centre de gravité sur l’axe). Pas de contraintes locales dans les anneaux ou poutres, pas d’allongement, pas de contact ni de pliage sur arêtes, pas de coefficients de mode d’élingage. Les CMU sont celles de l’utilisateur ; les données du fabricant prévalent. Ne remplace pas un plan de levage pour levages critiques.","es":"Carga rígida, ramales sin peso e inextensibles, un plano vertical (cuatro ramales: planta simétrica, centro de gravedad en el eje). Sin tensiones locales en orejetas o vigas, sin alargamiento, sin contacto ni doblado sobre aristas, sin factores de modo de amarre. Las CMU son del usuario; prevalecen los datos del fabricante. No sustituye un plan de izado para izados críticos.","pl":"Sztywny ładunek, nieważkie nierozciągliwe cięgna, jedna płaszczyzna pionowa (cztery cięgna: symetryczny rzut, środek ciężkości na osi). Bez naprężeń lokalnych w uchach i belkach, bez wydłużenia, bez kontaktu i zginania na krawędziach, bez współczynników sposobu obwiązania. DOR podaje użytkownik; decydują dane producenta. Nie zastępuje planu podnoszenia dla podnoszeń krytycznych."},

  "validation": {"basis":{"en":"Author's self-tests only: closed-form symmetric and offset-CG cases, and 300 seeded random geometries compared with an independent Lami's-theorem solver. No independent validation.","uk":"Лише власні тести автора: аналітичні симетричні випадки та випадки зі зміщеним центром ваги, 300 випадкових геометрій порівняно з незалежним розв’язувачем за теоремою Ламі. Незалежної валідації немає.","de":"Nur Selbsttests des Autors: geschlossene symmetrische Fälle und Fälle mit versetztem Schwerpunkt sowie 300 Zufallsgeometrien gegen einen unabhängigen Löser nach dem Satz von Lami. Keine unabhängige Validierung.","nl":"Alleen eigen tests van de auteur: gesloten symmetrische gevallen en gevallen met verschoven zwaartepunt, plus 300 willekeurige geometrieën tegen een onafhankelijke oplosser volgens de stelling van Lami. Geen onafhankelijke validatie.","fr":"Autotests de l’auteur uniquement : cas analytiques symétriques et à centre de gravité décalé, et 300 géométries aléatoires comparées à un solveur indépendant par le théorème de Lami. Aucune validation indépendante.","es":"Solo autopruebas del autor: casos analíticos simétricos y con centro de gravedad desplazado, y 300 geometrías aleatorias comparadas con un solucionador independiente por el teorema de Lami. Sin validación independiente.","pl":"Tylko testy własne autora: analityczne przypadki symetryczne i z przesuniętym środkiem ciężkości oraz 300 losowych geometrii porównanych z niezależnym rozwiązaniem z twierdzenia Lamiego. Brak niezależnej walidacji."},"independent_validation":false,"benchmarks":[{"id": "slinggeometry-independent-reference-2026-09-16", "reference": "Planar two-leg sling cases (symmetric at 10/30/44.9/45.1/59.9/60.1 deg, offset CG with hook above CG and with hook off the CG line, coordinate and leg-length geometry, dynamic factor and g scaling, overloads of sling/shackle/hook, missing WLL, zero-load and slack legs, flip-over and degenerate geometry, invalid inputs), symmetric four-leg cases with n = 2 and n = 4 effective legs plus four-leg refusals, and 30 seeded random two-leg geometries. Numbers are recomputed by ref.py: the rigid load with taut legs is turned about the hook until the CG is below it, and tensions are taken from moment balance about the opposite lifting point (cross-checked with a 2x2 force solve), not from Lami/Cramer as the tool describes.", "citations": ["Rigid-body statics: three-force concurrency, force and moment equilibrium of a load hung from two inextensible legs (ref.py)", "HOIST Magazine, 'Sling geometry and forces', https://www.hoistmagazine.com/analysis/sling-geometry-and-forces/ (read 2026-09-16): 0-45 and 45-60 deg rating ranges; rigid four-leg load effectively two-leg; load tilts until horizontal components balance", "Spec specs/07.md, acceptance criteria and 'Модель, правила и проверки'; specs/00-common.md 0.5 (insufficient data)"], "cases": 78, "passed": 78, "tolerance": "Numbers: relative 1e-9 (absolute 1e-9 where the reference is 0; force residual |sum F|/W <= 1e-9 absolute). Every quantity is closed-form trigonometry and a 2x2 linear solve with no iteration, so any difference above floating-point rounding (~1e-13 here) is a model difference; 1e-9 is also the closure criterion the tool states. Angle limits (45/60 deg) are user inputs in every case and boundary cases sit 0.1 deg either side, so no rounding ambiguity. Categorical and boolean checks are exact.", "run_at": "2026-09-16T11:25:46.126Z", "artifact": "benchmarks/slinggeometry.json"}]},

<script>
/* Lifting & sling geometry — tools.petrov.re safety series, tool 7.
 * Part 1: the model. Pure functions, no DOM, no screen strings.
 * Only + - * / sqrt are used on the path to tensions and residuals, so the
 * Python port reproduces those numbers bit for bit; angles use atan2. */
(function () {
  'use strict';

  var TOL = 1e-9;              /* relative tolerance: geometry degeneracy and equilibrium closure */
  var TILT_REPORT_DEG = 0.1;   /* display resolution of the settled tilt */
  var RAD = 180 / Math.PI;
  var OUT_KEYS = ['status', 'refusal', 'design_load', 'leg_tensions', 'leg_mass_equivalent',
    'leg_angles_from_vertical', 'included_angle', 'leg_lengths', 'tilt', 'hook_x', 'hook_y',
    'max_tension', 'utilizations', 'hook_utilization', 'max_utilization',
    'equilibrium_residual', 'geometry_warnings', 'findings'];
  var TWO_KEYS = ['cg_x', 'cg_y', 'p1_x', 'p1_y', 'p2_x', 'p2_y'];
  var FOUR_KEYS = ['q_a', 'q_b', 'q_ex', 'q_ey', 'q_cgz'];
  var WLL_KEYS = ['wll_1', 'wll_2', 'shk_1', 'shk_2', 'hook_wll'];

  /* Rule register. Kinds are never mixed within one rule. */
  var RULES = {
    'SLG-V-001': { kind: 'physical', source: 'input validity of the static model', jurisdiction: 'universal', version: 'n/a' },
    'SLG-P-001': { kind: 'physical', source: 'static equilibrium, sum of forces = 0', jurisdiction: 'universal', version: 'n/a' },
    'SLG-P-002': { kind: 'physical', source: 'free suspension: CG settles under the hook', jurisdiction: 'universal', version: 'n/a' },
    'SLG-P-003': { kind: 'physical', source: 'tension-only members (slings cannot push)', jurisdiction: 'universal', version: 'n/a' },
    'SLG-P-004': { kind: 'physical', source: 'determinacy of the equilibrium equations', jurisdiction: 'universal', version: 'n/a' },
    'SLG-G-001': { kind: 'guidance', source: 'EN 13414-1, EN 818-4, EN 1492-1: 0-45° rating range', jurisdiction: 'EU (EN), editable rule pack', version: 'edition: confirm current' },
    'SLG-G-002': { kind: 'guidance', source: 'EN 13414-1, EN 818-4, EN 1492-1: upper end of 45-60° range', jurisdiction: 'EU (EN), editable rule pack', version: 'edition: confirm current' },
    'SLG-C-001': { kind: 'guidance', source: 'WLL as marked by the manufacturer (user input)', jurisdiction: 'manufacturer data', version: 'as marked' },
    'SLG-C-002': { kind: 'guidance', source: 'sling marking required by EN 13414-1 / EN 1492-1', jurisdiction: 'manufacturer data', version: 'as marked' },
    'SLG-C-003': { kind: 'guidance', source: 'shackle WLL marking (manufacturer)', jurisdiction: 'manufacturer data', version: 'as marked' },
    'SLG-C-004': { kind: 'guidance', source: 'hook and master link WLL (manufacturer)', jurisdiction: 'manufacturer data', version: 'as marked' },
    'SLG-H-001': { kind: 'heuristic', source: 'rigging practice: CG above attachment points', jurisdiction: 'none', version: 'tool r1' },
    'SLG-M-001': { kind: 'heuristic', source: 'model choice: effective legs of a 4-leg sling', jurisdiction: 'none', version: 'tool r1' },
    'SLG-F-001': { kind: 'heuristic', source: 'dynamic factor is a user input', jurisdiction: 'none', version: 'tool r1' },
    'SLG-PR-001': { kind: 'guidance', source: 'ISO 12480-1, safe use of cranes', jurisdiction: 'international', version: 'edition: confirm current' }
  };

  function num(v) { return typeof v === 'number' && isFinite(v); }
  function wllOf(v) { return (num(v) && v > 0) ? v : null; }
  function add(r, rule, status, leg, value) {
    r.findings.push({ rule: rule, status: status, leg: leg == null ? null : leg, value: value == null ? null : value });
  }
  function blank() {
    return { status: 'refused', refusal: null, design_load: null, leg_tensions: [], leg_mass_equivalent: [],
      leg_angles_from_vertical: [], included_angle: null, leg_lengths: [], tilt: null, hook_x: null, hook_y: null,
      max_tension: null, utilizations: [], hook_utilization: null, max_utilization: null,
      equilibrium_residual: { force: null, moment: null }, geometry_warnings: [], findings: [], draw: null };
  }

  function validate(s) {
    if (!(num(s.mass) && s.mass > 0)) return 'mass';
    if (!(num(s.g) && s.g > 0)) return 'g';
    if (!(num(s.phi) && s.phi >= 1)) return 'phi';
    var i, keys = s.config === '4leg' ? FOUR_KEYS : TWO_KEYS;
    for (i = 0; i < keys.length; i++) if (!num(s[keys[i]])) return 'coords';
    if (s.config === '4leg') {
      if (!(s.q_neff === 2 || s.q_neff === 4)) return 'coords';
      if (s.geom === 'lengths') { if (!(num(s.q_len) && s.q_len > 0)) return 'lengths'; }
      else if (!num(s.q_h)) return 'coords';
    } else if (s.geom === 'lengths') {
      if (!(num(s.len_1) && s.len_1 > 0 && num(s.len_2) && s.len_2 > 0)) return 'lengths';
    } else if (!(num(s.hook_x) && num(s.hook_y))) return 'coords';
    for (i = 0; i < WLL_KEYS.length; i++) {
      var v = s[WLL_KEYS[i]];
      if (v != null && !(num(v) && v >= 0)) return 'wll';
    }
    if (!(num(s.ang_warn) && num(s.ang_max) && s.ang_warn > 0 && s.ang_max >= s.ang_warn && s.ang_max < 90)) return 'limits';
    return null;
  }

  function refuse(r, code) {
    r.status = 'refused';
    r.refusal = code;
    add(r, 'SLG-P-004', 'fail', null, null);
    return false;
  }

  function angleFindings(s, r, leg, beta) {
    if (beta > s.ang_max) add(r, 'SLG-G-002', 'fail', leg, beta);
    else if (beta > s.ang_warn) add(r, 'SLG-G-001', 'attention', leg, beta);
  }

  function solve2(s, r, W) {
    var p1x = s.p1_x, p1y = s.p1_y, p2x = s.p2_x, p2y = s.p2_y, hx, hy;
    var ex = p2x - p1x, ey = p2y - p1y;
    var span = Math.sqrt(ex * ex + ey * ey);
    var scale = Math.max(Math.abs(p1x), Math.abs(p1y), Math.abs(p2x), Math.abs(p2y), Math.abs(s.cg_x), Math.abs(s.cg_y));
    if (!(span > TOL * scale) || span === 0) return refuse(r, 'coincident');
    if (s.geom === 'lengths') {
      var r1 = s.len_1, r2 = s.len_2;
      if (span > r1 + r2 || span < Math.abs(r1 - r2)) return refuse(r, 'no-intersection');
      var a = (r1 * r1 - r2 * r2 + span * span) / (2 * span);
      var hh = r1 * r1 - a * a;
      var h = hh > 0 ? Math.sqrt(hh) : 0;
      var bx = p1x + a * ex / span, by = p1y + a * ey / span;
      var nx = -ey / span, ny = ex / span;
      var ax1 = bx + h * nx, ay1 = by + h * ny, ax2 = bx - h * nx, ay2 = by - h * ny;
      if (ay2 > ay1) { hx = ax2; hy = ay2; } else { hx = ax1; hy = ay1; }
    } else { hx = s.hook_x; hy = s.hook_y; }
    r.hook_x = hx; r.hook_y = hy;
    var d1x = hx - p1x, d1y = hy - p1y, d2x = hx - p2x, d2y = hy - p2y;
    var L1 = Math.sqrt(d1x * d1x + d1y * d1y), L2 = Math.sqrt(d2x * d2x + d2y * d2y);
    var ref = Math.max(L1, L2, span);
    r.leg_lengths = [L1, L2];
    if (L1 <= TOL * ref || L2 <= TOL * ref) return refuse(r, 'hook-at-point');
    var cross = d1x * d2y - d1y * d2x;
    if (Math.abs(cross) <= TOL * L1 * L2) return refuse(r, 'collinear');
    var gx = s.cg_x - hx, gy = s.cg_y - hy;
    var gd = Math.sqrt(gx * gx + gy * gy);
    if (gd <= TOL * ref) return refuse(r, 'cg-at-hook');
    var c = -gy / gd, sn = -gx / gd;
    var tilt = Math.atan2(sn, c) * RAD;
    if (Math.abs(tilt) > 90) return refuse(r, 'overturn');
    var q1x = hx + (c * (p1x - hx) - sn * (p1y - hy)), q1y = hy + (sn * (p1x - hx) + c * (p1y - hy));
    var q2x = hx + (c * (p2x - hx) - sn * (p2y - hy)), q2y = hy + (sn * (p2x - hx) + c * (p2y - hy));
    var gqx = hx + (c * gx - sn * gy), gqy = hy + (sn * gx + c * gy);
    var u1x = (hx - q1x) / L1, u1y = (hy - q1y) / L1, u2x = (hx - q2x) / L2, u2y = (hy - q2y) / L2;
    var det = u1x * u2y - u1y * u2x;
    var T1 = -W * u2x / det, T2 = W * u1x / det;
    var tolT = TOL * W;
    r.draw = { c: c, s: sn, hx: hx, hy: hy };
    if (T1 < -tolT && T2 < -tolT) return refuse(r, 'no-equilibrium');
    if (T1 < -tolT || T2 < -tolT) {
      var slackLeg = T1 < -tolT ? 1 : 2;
      r.status = 'slack';
      r.leg_tensions = slackLeg === 1 ? [0, W] : [W, 0];
      r.leg_angles_from_vertical = slackLeg === 1 ? [null, 0] : [0, null];
      r.equilibrium_residual = { force: Math.abs(W - W) / W, moment: 0 };
      r.draw = null;
      add(r, 'SLG-P-003', 'fail', slackLeg, null);
      return true;
    }
    var fx = T1 * u1x + T2 * u2x, fy = T1 * u1y + T2 * u2y - W;
    var fres = Math.sqrt(fx * fx + fy * fy) / W;
    var mres = Math.abs(gqx - hx) / gd;
    if (!(fres <= TOL) || !(mres <= TOL)) return refuse(r, 'residual');
    r.status = 'solved';
    r.leg_tensions = [T1, T2];
    r.tilt = tilt;
    r.equilibrium_residual = { force: fres, moment: mres };
    var b1 = Math.atan2(Math.abs(u1x), u1y) * RAD, b2 = Math.atan2(Math.abs(u2x), u2y) * RAD;
    r.leg_angles_from_vertical = [b1, b2];
    r.included_angle = Math.atan2(Math.abs(u1x * u2y - u1y * u2x), u1x * u2x + u1y * u2y) * RAD;
    add(r, 'SLG-P-001', 'pass', null, fres);
    if (Math.abs(tilt) >= TILT_REPORT_DEG) add(r, 'SLG-P-002', 'attention', null, tilt);

    noticeB: ['Leg forces of a rigid load on weightless slings, compared with the WLL values you type in. Manufacturer data and a lift plan by a competent person decide whether the lift goes ahead.', 'Зусилля в гілках для жорсткого вантажу на невагомих стропах, порівняні з введеними WLL. Чи виконувати підйом, вирішують дані виробника та план компетентної особи.', 'Strangkräfte einer starren Last an gewichtslosen Anschlagmitteln, verglichen mit Ihren WLL-Eingaben. Ob gehoben wird, entscheiden Herstellerangaben und ein Hubplan einer befähigten Person.', 'Strengkrachten van een stijve last aan gewichtloze strengen, vergeleken met de WLL die u invoert. Of er gehesen wordt, bepalen fabrikantgegevens en een hijsplan van een deskundige.', 'Efforts dans les brins pour une charge rigide sur élingues sans poids, comparés aux CMU saisies. La décision de lever relève des données fabricant et d’un plan de levage établi par une personne compétente.', 'Fuerzas en ramales de una carga rígida con eslingas sin peso, comparadas con las CMU introducidas. La decisión de izar corresponde a los datos del fabricante y a un plan de izado de una persona competente.', 'Siły w cięgnach sztywnego ładunku na nieważkich zawiesiach, porównane z wpisanym DOR. O podnoszeniu decydują dane producenta i plan osoby kompetentnej.'],

    learnB: ['It lets the load turn until its centre of gravity hangs under the hook, then solves ΣF = 0 for the leg tensions and checks them against the WLL you enter. Drag a point on the sketch and watch the tensions and angles follow.', 'Вантаж повертається, доки центр ваги не стане під гаком; далі розв’язується ΣF = 0 і натяги порівнюються з введеним WLL. Перетягніть точку на ескізі — натяги й кути зміняться.', 'Die Last dreht sich, bis der Schwerpunkt unter dem Haken hängt; dann wird ΣF = 0 für die Strangkräfte gelöst und gegen Ihre WLL geprüft. Ziehen Sie einen Punkt in der Skizze.', 'De last draait tot het zwaartepunt onder de haak hangt; daarna wordt ΣF = 0 opgelost en getoetst aan uw WLL. Sleep een punt in de schets.', 'La charge pivote jusqu’à ce que son CdG soit sous le crochet, puis ΣF = 0 donne les tensions, comparées à vos CMU. Déplacez un point du croquis pour voir l’effet.', 'La carga gira hasta que su CdG cuelga bajo el gancho; luego ΣF = 0 da las tensiones, comparadas con sus CMU. Arrastre un punto del croquis.', 'Ładunek obraca się, aż środek ciężkości zawiśnie pod hakiem; potem ΣF = 0 daje siły porównywane z DOR. Przeciągnij punkt na szkicu.'],

    lAngB: ['β is measured from the vertical; the included angle is between the two legs, 2β for a symmetric pair. For a symmetric two-leg sling T = W / (2 cos β): 58 % of W per leg at β = 30°, 71 % at 45°, 100 % at 60°.', 'β відраховують від вертикалі; кут між гілками дорівнює 2β для симетричної пари. Для симетричного стропа T = W / (2 cos β): 58 % W при β = 30°, 71 % при 45°, 100 % при 60°.', 'β wird zur Senkrechten gemessen; der Spreizwinkel liegt zwischen beiden Strängen, 2β bei symmetrischem Paar. Symmetrisch gilt T = W / (2 cos β): 58 % von W bei 30°, 71 % bei 45°, 100 % bei 60°.', 'β wordt t.o.v. de verticaal gemeten; de tophoek ligt tussen beide strengen, 2β bij een symmetrisch paar. Symmetrisch: T = W / (2 cos β): 58 % van W bij 30°, 71 % bij 45°, 100 % bij 60°.', 'β se mesure depuis la verticale ; l’angle au sommet est entre les deux brins, 2β pour une paire symétrique. En symétrique T = W / (2 cos β) : 58 % de W à 30°, 71 % à 45°, 100 % à 60°.', 'β se mide desde la vertical; el ángulo entre ramales es 2β en un par simétrico. Simétrico: T = W / (2 cos β): 58 % de W a 30°, 71 % a 45°, 100 % a 60°.', 'β mierzy się od pionu; kąt rozwarcia to kąt między cięgnami, 2β dla pary symetrycznej. Symetrycznie T = W / (2 cos β): 58 % W przy 30°, 71 % przy 45°, 100 % przy 60°.'],
    lSetT: ['Settled position', 'Положення рівноваги', 'Gleichgewichtslage', 'Evenwichtsstand', 'Position d’équilibre', 'Posición de equilibrio', 'Położenie równowagi'],
    lSetB: ['A load hanging from one hook turns until its centre of gravity is on the vertical through the hook. If the hook is entered off that line, the sketch shows the entered position dashed and the settled one solid, and the tensions belong to the solid one.', 'Вантаж на одному гаку повертається, доки ЦВ не опиниться на вертикалі через гак. Якщо гак введено поза нею, введене положення показано пунктиром, рівноважне — суцільною лінією; натяги належать до останнього.', 'Eine Last an einem Haken dreht sich, bis der Schwerpunkt auf der Senkrechten durch den Haken liegt. Liegt der Haken daneben, zeigt die Skizze die Eingabe gestrichelt und die Gleichgewichtslage durchgezogen; die Kräfte gehören zu dieser.', 'Een last aan één haak draait tot het zwaartepunt op de verticaal door de haak ligt. Staat de haak ernaast, dan toont de schets de invoer gestreept en de evenwichtsstand doorgetrokken; de krachten horen bij die laatste.', 'Une charge suspendue à un crochet pivote jusqu’à ce que son CdG soit sur la verticale du crochet. Sinon, le croquis montre la saisie en pointillé et l’équilibre en trait plein ; les tensions correspondent au trait plein.', 'Una carga colgada de un gancho gira hasta que su CdG queda en la vertical del gancho. Si no, el croquis muestra la entrada en trazos y el equilibrio en línea continua; las tensiones corresponden a esta.', 'Ładunek na jednym haku obraca się, aż środek ciężkości znajdzie się w pionie haka. W przeciwnym razie szkic pokazuje dane linią przerywaną, a równowagę ciągłą; siły dotyczą tej drugiej.'],
    lWllT: ['WLL comparison', 'Порівняння з WLL', 'Vergleich mit der WLL', 'Vergelijking met de WLL', 'Comparaison à la CMU', 'Comparación con la CMU', 'Porównanie z DOR'],
    lWllB: ['Enter the WLL of one leg in straight vertical pull, as marked on the sling, and of the shackle; the smaller governs. A multi-leg rating from a chart already contains an angle factor and must not be entered here. No choke or basket factors are applied.', 'Введіть WLL однієї гілки при вертикальному прямому тязі за маркуванням стропа та WLL скоби; визначає менше. Номінал багатогілкового стропа з таблиці вже містить кутовий коефіцієнт і тут не вводиться. Коефіцієнти обв’язки не застосовуються.', 'Geben Sie die WLL eines Strangs im geraden senkrechten Zug laut Kennzeichnung und die des Schäkels ein; der kleinere Wert gilt. Eine Mehrstrang-Tragfähigkeit aus einer Tabelle enthält bereits den Winkelfaktor und gehört nicht hierher. Schnür- oder Hängegangfaktoren werden nicht angewandt.', 'Voer de WLL van één streng in rechte verticale trek in, zoals gemarkeerd, en die van de sluiting; de kleinste is maatgevend. Een meersprongwaarde uit een tabel bevat al een hoekfactor en hoort hier niet. Snoer- of mandfactoren worden niet toegepast.', 'Saisissez la CMU d’un brin en traction verticale directe, selon le marquage, et celle de la manille ; la plus faible gouverne. Une CMU multibrins tirée d’un tableau inclut déjà l’angle et ne doit pas être saisie ici. Aucun coefficient de mode d’élingage n’est appliqué.', 'Introduzca la CMU de un ramal en tiro vertical directo según el marcado y la del grillete; manda la menor. Una CMU de varios ramales de una tabla ya incluye el ángulo y no se introduce aquí. No se aplican factores de estrangulado ni de cesta.', 'Wpisz DOR jednego cięgna przy prostym pionowym ciągnięciu, zgodnie z oznakowaniem, oraz DOR szekli; decyduje mniejszy. DOR zawiesia wielocięgnowego z tabeli zawiera już współczynnik kąta i nie należy go tu wpisywać. Współczynników sposobu obwiązania nie stosuje się.'],
    lNeffT: ['Four-leg slings', 'Чотиригілкові стропи', 'Vierstranggehänge', 'Viersprongen', 'Élingues à quatre brins', 'Eslingas de cuatro ramales', 'Zawiesia czterocięgnowe'],
    lNeffB: ['Four legs on a rigid load are one more than equilibrium can resolve, so small length differences decide the sharing. The tool therefore asks how many legs you assume to carry the load and refuses an offset centre of gravity.', 'Чотири гілки на жорсткому вантажі — на одну більше, ніж визначає рівновага, тож розподіл залежить від малих різниць довжин. Тому інструмент просить задати кількість несучих гілок і відхиляє зміщений ЦВ.', 'Vier Stränge an einer starren Last sind einer mehr, als das Gleichgewicht bestimmt; kleine Längenunterschiede entscheiden die Aufteilung. Daher fragt das Werkzeug nach der Zahl tragender Stränge und lehnt einen versetzten Schwerpunkt ab.', 'Vier strengen aan een stijve last zijn er één meer dan het evenwicht bepaalt; kleine lengteverschillen beslissen de verdeling. Daarom vraagt de tool hoeveel strengen dragen en weigert een verschoven zwaartepunt.', 'Quatre brins sur une charge rigide dépassent d’un ce que l’équilibre détermine ; de petits écarts de longueur décident du partage. L’outil demande donc le nombre de brins porteurs et refuse un CdG excentré.', 'Cuatro ramales sobre una carga rígida son uno más de lo que el equilibrio determina; pequeñas diferencias de longitud deciden el reparto. Por eso la herramienta pide cuántos ramales cargan y rechaza un CdG desplazado.', 'Cztery cięgna na sztywnym ładunku to o jedno więcej, niż wyznacza równowaga; o podziale decydują małe różnice długości. Dlatego narzędzie pyta o liczbę cięgien nośnych i odrzuca przesunięty środek ciężkości.'],
    footer: ['W = m·g·φ; T₁·u₁ + T₂·u₂ = (0, W); β = atan2(|uₓ|, u_y); four legs: T = W / (n·cos β). Rigid load, weightless inextensible legs, one vertical plane.', 'W = m·g·φ; T₁·u₁ + T₂·u₂ = (0, W); β = atan2(|uₓ|, u_y); чотири гілки: T = W / (n·cos β). Жорсткий вантаж, невагомі нерозтяжні гілки, одна площина.', 'W = m·g·φ; T₁·u₁ + T₂·u₂ = (0, W); β = atan2(|uₓ|, u_y); vier Stränge: T = W / (n·cos β). Starre Last, gewichtslose undehnbare Stränge, eine Ebene.', 'W = m·g·φ; T₁·u₁ + T₂·u₂ = (0, W); β = atan2(|uₓ|, u_y); vier strengen: T = W / (n·cos β). Stijve last, gewichtloze onrekbare strengen, één vlak.', 'W = m·g·φ ; T₁·u₁ + T₂·u₂ = (0, W) ; β = atan2(|uₓ|, u_y) ; quatre brins : T = W / (n·cos β). Charge rigide, brins sans poids inextensibles, un plan.', 'W = m·g·φ; T₁·u₁ + T₂·u₂ = (0, W); β = atan2(|uₓ|, u_y); cuatro ramales: T = W / (n·cos β). Carga rígida, ramales sin peso inextensibles, un plano.', 'W = m·g·φ; T₁·u₁ + T₂·u₂ = (0, W); β = atan2(|uₓ|, u_y); cztery cięgna: T = W / (n·cos β). Sztywny ładunek, nieważkie nierozciągliwe cięgna, jedna płaszczyzna.'],

    rpMethodN1: ['Equilibrium is closed to a relative residual of 1·10⁻⁹; a case that does not close, or whose equations do not determine the tensions, is refused instead of being given numbers.', 'Рівновагу замикають до відносної нев’язки 1·10⁻⁹; випадок, що не замикається або не визначає натягів, відхиляється без чисел.', 'Das Gleichgewicht wird bis auf ein relatives Residuum von 1·10⁻⁹ geschlossen; ein Fall, der nicht schließt oder die Kräfte nicht bestimmt, wird ohne Zahlen abgelehnt.', 'Het evenwicht wordt gesloten tot een relatief residu van 1·10⁻⁹; een geval dat niet sluit of de krachten niet bepaalt, wordt zonder getallen geweigerd.', 'L’équilibre est fermé à un résidu relatif de 1·10⁻⁹ ; un cas qui ne se ferme pas ou ne détermine pas les tensions est refusé sans chiffres.', 'El equilibrio se cierra con un residuo relativo de 1·10⁻⁹; un caso que no cierra o no determina las tensiones se rechaza sin cifras.', 'Równowagę domyka się do względnego residuum 1·10⁻⁹; przypadek, który się nie domyka lub nie wyznacza sił, jest odrzucany bez liczb.'],
