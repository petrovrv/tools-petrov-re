али","learnData":"Для кожного матеріалу зони навпроти активної зони задано ділянку, мідь і нікель (для 50.61a також манган, фосфор, клас виробу та, для листа або поковки, прилеглі шви), RT_NDT до опромінення та флюенс на межі плакування з основним металом, разом із джерелом і статусом його хімічного складу.","learnModelTitle":"Два шляхи","learnModel":"50.61 додає до RT_NDT(U) зсув від флюенсу, визначений через хімічний коефіцієнт, і запас та порівнює результат із 270 або 300 °F. 50.61a додає ΔT₃₀ за своєю кореляцією, оцінює кожен прилеглий лист або поковку також за флюенсу його шва та порівнює значення RT_MAX з таблицею 1 залежно від товщини стінки. Критерії одного шляху ніколи не застосовуються до іншого. Рядок може мати власну щільність потоку у своєму місці, а точка нагляду — потік і температуру своєї капсули; інакше застосовуються значення установки.","learnTryTitle":"Спроба","learnTry":"Відкрийте приклад «узагальнений хімічний склад шва» і виконайте скринінг. Перш ніж читати далі: чи вирішує справу значення, нижче за критерій?","learnExplainTitle":"Пояснення","learnExplain":"Узагальнене значення міді дає RT_PTS 323,2 °F. Значення, нижче за 300 °F, також не вирішило б справу: непідтверджений хімічний склад не дозволяє отримати позитивний результат скринінгу.","learnFixTitle":"Виправлення","learnFix":"Із сертифікатом плавки (Cu 0,20 %) RT_PTS становить 297,3 °F: у межах критерію із запасом 2,7 °F, який інструмент позначає як малий.","learnBoundaryTitle":"Де закінчується результат","learnBoundary":"Інструмент виконує скринінг; ліцензування він не здійснює. Для позитивного скринінгу потрібні підтверджений хімічний склад, зафіксована редакція регуляторного документа та, для 50.61a, підтвердження всіх контрольних умов. Затвердження лишається окремим рішенням.","reportTitle":"Окрихчення RPV та PTS-скринінг","modelVersion":"Версія моделі","eqNote_5061":"Символи: RT_NDT(U) — референтна температура до опромінення; σ_U, σ_Δ — стандартні відхилення RT_NDT(U) та зсуву; CF — хімічний коефіцієнт; f — флюенс в одиницях 10¹⁹ n/cm²; W, B — шов, основний метал; S — достовірні дані зразків-свідків.","eqNote_5061a":"Символи: ΔT₃₀ — зсув температури Шарпі за 30 ft-lb; MD, CRP — складові матричного пошкодження та мідевмісних преципітатів; A, B — коефіцієнти за класом виробу; T_C — температура в холодній нитці, °F; φt_e — ефективний флюенс; Cu_e — ефективний вміст міді; RT_MAX-X — максимальна референтна температура ділянки X. r — залишок точки нагляду; σ — стандартне відхилення таблиці 5; m, se(m) — нахил r від log₁₀ флюенсу за найменшими квадратами та його стандартна похибка; r* — нормований залишок.","modelText":"Температури в °F, флюенс у n/cm² (E > 1 MeV), вміст у масових відсотках; хімічний коефіцієнт інтерполюється лінійно за міддю й нікелем між значеннями таблиці.","boundaryText":"Інструмент не дає ліцензійних висновків і не замінює аналізу для конкретного енергоблока; затвердження є окремим рішенням, прив'язаним до вхідних даних.","scopeText":"Допоміжний засіб скринінгу за 10 CFR 50.61 і 50.61a; не є ліцензійним висновком. Вбудовані приклади синтетичні.","adjacent":"Прилеглі шви (ID)","atFluenceOf":"при флюенсі","rg143":"Поковки, виготовлені за RG 1.43","b_adjacent_invalid":"ID прилеглого шва не відповідає жодному рядку шва.","g_adjacency_unknown":"Прилеглі шви цього листа або поковки не зафіксовано; рівн. 1 і рівн. 4 можуть занижувати RT_MAX-AW або RT_MAX-CW.","g_rg143_unknown":"Виготовлення поковок за RG 1.43 не встановлено; застосовано суворіший критерій.","a_record_adjacency":"зафіксуйте шви, до яких прилягає цей лист або поковка","a_establish_rg143_fabrication":"встановіть, чи виготовлено поковки за RG 1.43","ref5061":"10 CFR 50.61(c), таблиці 1 і 2","ref5061a":"10 CFR 50.61a, рівн. 1–7, таблиця 1","refRG":"Настанова NRC RG 1.99, ред. 2","survData":"Дані нагляду, флюенс:ΔT₃₀[:потік капсули[:T_C капсули]] (н/см²:°F:н/см²/с:°F; …)","flawPanel":"Дефекти зони опромінення (таблиці 2 і 3)","weldLength":"Довжина обстежених швів","weldFlaws":"Дефекти швів, глибина по товщині (in)","plateArea":"Площа обстежених листів і поковок","plateFlaws":"Дефекти листів і поковок, глибина по товщині (in)","survTable":"Дані нагляду проти кореляції (50.61a (f)(6))","survResult":"Тести середнього, нахилу й викидів","flawTable":"Густина дефектів на 1 000 in шва або 1 000 in² основного металу","flawBand":"Поверхня й діапазон розміру","flawDensity":"Густина / межа (кількість)","surf_weld":"шов","surf_plate":"лист або поковка","noFlaws":"Немає дефектів понад 0,075 in","survMean":"середній залишок","surv_insufficient":"менше трьох точок при трьох флюенсах: кореляцію застосовано без перевірки","surv_consistent":"узгоджено","surv_inconsistent":"не узгоджено","surv_unknown":"тест викидів не визначено для понад 15 точок","b_surveillance_data_invalid":"Дані нагляду не є точками флюенс:ΔT₃₀ з необов’язковими потоком і T_C капсули, з додатними флюенсом і потоком.","b_flaw_data_invalid":"Дані про дефекти недійсні: довжина й площа мають бути додатними, розміри дефектів — невід’ємними числами, а дефекти потребують своєї довжини чи площі.","w_flaw_sizes_as_entered":"Розміри дефектів прийнято як введені — уже скориговані на похибку НК і обмежені об’ємом контролю за 50.61a (e). Тріщини під наплавленням у поковках не вводяться.","rowFlux":"Щільність потоку в цьому місці (порожньо = потік установки)","w_recorded_rejection_kept":"Записане відхилення цього критерію збережено: введені дані самі по собі не скасовують відомостей, записаних поза інструментом. Змініть записаний статус, якщо він більше не чинний."},"de":{"title":"RPV-Versprödung & PTS-Screening","subtitle":"Screening des kernnahen Bereichs des Reaktordruckbehälters auf druckbeaufschlagten Thermoschock nach 10 CFR 50.61 oder 50.61a, beide Pfade getrennt gehalten","pathPanel":"Pfad und Profil","item":"Behälter oder Studie","pathLabel":"Screening-Pfad","path_5061":"10 CFR 50.61 (RT_PTS)","path_5061a":"10 CFR 50.61a (RT_MAX-X)","profile":"Regulatorische Quelle","edition":"Ausgabe"," ening-Ergebnis.","b_path_invalid":"Wählen Sie einen Screening-Pfad.","b_duplicate_id":"Dieselbe ID wird zweimal verwendet.","b_no_components":"Es ist kein Werkstoff des kernnahen Bereichs eingegeben.","b_role_invalid":"Die Region ist nicht festgelegt.","b_rt_ndt_invalid":"RT_NDT(U) fehlt.","b_fluence_invalid":"Die Fluenz fehlt, ist negativ oder für 50.61a null.","b_chemistry_invalid":"Der Kupfer-, Nickel-, Mangan- oder Phosphorgehalt fehlt oder ist negativ.","b_sigma_invalid":"σ_U fehlt oder ist negativ.","b_cf_invalid":"Der Chemiefaktor aus den Daten der Einhängeproben fehlt.","b_chemistry_out_of_table":"Kupfer oder Nickel liegt außerhalb der Tabellen 1 und 2 (Cu 0–0,40 %, Ni 0–1,20 %).","b_class_invalid":"Die Produktklasse fehlt oder passt nicht zur Region.","b_tc_invalid":"T_C fehlt.","b_flux_invalid":"Der Fluss muss positiv sein (Anlagenfluss und, falls angegeben, Fluss einer Zeile).","b_wall_out_of_range":"Die Wanddicke fehlt oder liegt über 11,5 in, außerhalb von Tabelle 1 von 50.61a.","g_composition_unconfirmed":"Die chemische Zusammensetzung dieses Werkstoffs ist nicht bestätigt.","g_surveillance_not_credible":"Der Chemiefaktor aus den Daten der Einhängeproben wird verwendet, ihre Glaubwürdigkeit ist jedoch nicht bestätigt.","g_underclad_cracks_unknown":"Unterplattierungsrisse sind nicht geklärt; das strengere Kriterium wird angewendet.","g_applicability_unknown":"Die Anwendbarkeit von 50.61a ist nicht nachgewiesen.","g_applicability_failed":"50.61a ist auf diesen Behälter nicht anwendbar.","g_flaw_tables_unknown":"Der Fehlervergleich mit den Tabellen 2 und 3 ist nicht geklärt.","g_flaw_tables_failed":"Die Fehler überschreiten die Tabellen 2 und 3: Eine TWCF-Analyse ist erforderlich.","g_axial_flaw_unknown":"Die Prüfung auf axiale Fehler an der Plattierungsgrenzfläche ist nicht geklärt.","g_axial_flaw_failed":"Ein axialer Fehler an der Plattierungsgrenzfläche erfordert eine TWCF-Analyse.","g_iwb_examination_unknown":"Das Prüfergebnis nach IWB-3510-1 ist nicht geklärt.","g_iwb_examination_failed":"Ein Fehler überschreitet IWB-3510-1: Eine TWCF-Analyse ist erforderlich.","g_surveillance_unknown":"Die Konsistenzprüfung der Daten der Einhängeproben ist nicht geklärt.","g_surveillance_failed":"Die Daten der Einhängeproben weichen von der Korrelation ab: Angepasste ΔT₃₀-Werte sind erforderlich.","g_profile_missing":"Die regulatorische Quelle oder Ausgabe ist nicht erfasst.","g_data_source_missing":"Die Quelle der Anlagendaten oder ihre Revision fehlt.","g_data_unconfirmed":"Der Status der Anlagendaten ist unbekannt.","w_tc_outside_basis":"T_C liegt außerhalb von 525–590 °F, dem Bereich, auf dem die Korrelation beruht.","w_estimated_data":"Die Anlagendaten sind als geschätzt markiert.","w_small_margin":"Der Abstand zum Kriterium liegt unter 10 °F.","w_no_licensing_conclusion":"Nur Screening-Hilfsmittel: Es wird keine genehmigungsrechtliche Schlussfolgerung gezogen.","w_restored_values":"Gespeicherte Werte wurden beim Laden ersetzt: ","a_select_path":"den Screening-Pfad wählen","a_correct_input":"die Eingaben korrigieren","a_add_component":"die Werkstoffe des kernnahen Bereichs hinzufügen","a_obtain_chemistry":"die chemische Zusammensetzung aus den Schmelzenzeugnissen beschaffen","a_use_surveillance_or_other_basis":"Daten der Einhängeproben oder eine andere Grundlage verwenden","a_use_other_basis":"eine andere Screening-Grundlage verwenden","a_assess_surveillance_credibility":"die Glaubwürdigkeit der Daten der Einhängeproben bewerten","a_establish_underclad_cracking":"klären, ob Unterplattierungsrisse vorhanden sind","a_establish_applicability":"die Anwendbarkeit von 50.61a nachweisen","a_complete_flaw_evaluation":"die Fehlerbewertung abschließen","a_twcf_analysis":"eine TWCF-Analyse durchführen","a_complete_examination":"die Prüfung abschließen","a_assess_surveillance_data":"die Konsistenzprüfung der Daten der Einhängeproben durchführen","a_adjust_for_surveillance":"ΔT₃₀ an die Daten der Einhängeproben anpassen","a_record_regulatory_profile":"die regulatorische Quelle und Ausgabe erfassen","a_record_data_source":"die Quelle der Anlagendaten und ihre Revision erfassen","a_confirm_data":"die Anlagendaten bestätigen","a_flux_reduction_or_analysis":"eine Flussabsenkung oder eine anlagenspezifische Analyse in Betracht ziehen","exControl":"Blech vor der Bestrahlung (Kontrolle)","exControlNote":"Fluenz 0: keine Verschiebung; RT_PTS = RT_NDT(U) = 10 °F gegenüber 270 °F.","exTypical":"Rundschweißnaht nach 60 Jahren (typisch)","exTypicalNote":"Cu 0,20 %, Ni 1,00 %, Fluenz 3 × 10¹⁹ n/cm²: CF 223 °F, ΔRT_NDT 287,8 °F, RT_PTS 297,3 °F gegenüber 300 °F, ein Abstand von 2,7 °F.","exSurv":"Dieselbe Schweißnaht mit glaubwürdigen Daten der Einhängeproben","exSurvNote":"Ein glaubwürdiger CF von 190 °F aus den Einhängeproben halbiert σ_Δ: RT_PTS 233,3 °F gegenüber 300 °F.","ex61a":"Kernnaher Bereich nach 80 Jahren, alternative Regel","ex61aNote":"Wand 8,5 in, T_C 550 °F: RT_MAX-AW 199,6 °F (Kriterium 269 °F), RT_MAX-PL 128,3 °F (356 °F), ihre Summe 327,9 °F (538 °F), RT_MAX-CW 192,1 °F (312 °F).","exProblem":"Chemische Zusammensetzung der Schweißnaht nicht geklärt (Problem)","exProblemNote":"Chemische Zusammensetzung der Schweißnaht unbestätigt und Fehlervergleich offen: kein positives Screening.","exTry":"Versuch: generische chemische Zusammensetzung der Schweißnaht","exTryNote":"Generischer Cu-Gehalt 0,25 % ohne Schmelzenzeugnis: RT_PTS 323,2 °F überschreitet 300 °F, und die chemische Zusammensetzung ist unbestätigt.","exFix":"Lösung: chemische Zusammensetzung aus dem Schmelzenzeugnis","exFixNote":"Schmelzenzeugnis Cu 0,20 %: RT_PTS 297,3 °F, um 2,7 °F innerhalb von 300 °F, mit bestätigter chemischer Zusammensetzung.","learnIntroTitle":"Welche Frage das Werkzeug beantwortet","learnIntro":"Wie sich der Screening-Abstand des kernnahen Bereichs eines Reaktordruckbehälters mit der Fluenz ändert, nach dem vom Benutzer gewählten Pfad: 10 CFR 50.61 oder die alternative Regel 50.61a.","learnDataTitle":"Werkstoffe","learnData":"Jeder Werkstoff des kernnahen Bereichs hat seine Region, Kupfer und Nickel (bei 50.61a auch Mangan, Phosphor, Produktklasse und, bei einem Blech oder Schmiedeteil, die angrenzenden Schweißnähte), RT_NDT im unbestrahlten Zustand und die Fluenz an der Grenzfläche Plattierung/Grundwerkstoff, mit Quelle und Status seiner chemischen Zusammensetzung.","learnModelTitle":"Zwei Pfade","learnModel":"50.61 addiert zu RT_NDT(U) eine Fluenzverschiebung aus dem Chemiefaktor und einen Zuschlag und vergleicht mit 270 oder 300 °F. 50.61a addiert ΔT₃₀ aus seiner Korrelation, bewertet jedes angrenzende Blech oder Schmiedeteil zusätzlich bei der Fluenz seiner Schweißnaht und vergleicht die RT_MAX-Werte nach Wanddicke mit Tabelle 1. Die Kriterien eines Pfads werden nie auf den anderen angewendet. Eine Zeile kann den Fluss an ihrer Stelle tragen und ein Überwachungspunkt Fluss und Temperatur seiner Kapsel; sonst gelten die Anlagenwerte.","learnTryTitle":"Versuch","learnTry":"Öffnen Sie das Beispiel „generische chemische Zusammensetzung der Schweißnaht“ und führen Sie das Screening aus. Bevor Sie weiterlesen: Ist die Sache mit einem Wert unter dem Kriterium entschieden?","learnExplainTitle":"Erklärung","learnExplain":"Der generische Kupferwert ergibt RT_PTS 323,2 °F. Auch ein Wert unter 300 °F würde die Sache nicht entscheiden: Eine unbestätigte chemische Zusammensetzung verhindert ein positives Screening-Ergebnis.","learnFixTitle":"Korrektur","learnFix":"Mit dem Schmelzenzeugnis (Cu 0,20 %) beträgt RT_PTS 297,3 °F: um 2,7 °F innerhalb des Kriteriums, was das Werkzeug als kleinen Abstand kennzeichnet.","learnBoundaryTitle":"Wo das Ergebnis endet","learnBoundary":"Das Werkzeug führt ein Screening durch; eine Genehmigung erteilt es nicht. Ein positives Screening erfordert eine bestätigte chemische Zusammensetzung, eine erfasste regulatorische Ausgabe und bei 50.61a die Bestätigung aller Voraussetzungen. Die Freigabe bleibt eine eigene Entscheidung.","reportTitle":"RPV-Versprödung und PTS-Screening","modelVersion":"Modellversion","eqNote_5061":"Symbole: RT_NDT(U) — Referenztemperatur im unbestrahlten Zustand; σ_U, σ_Δ — Standardabweichungen von RT_NDT(U) und der Verschiebung; CF — Chemiefaktor; f — Fluenz in 10¹⁹ n/cm²; W, B — Schweißgut, Grundwerkstoff; S — glaubwürdige Daten der Einhängeproben.","eqNote_5061a":"Symbole: ΔT₃₀ — Verschiebung der Charpy-Temperatur bei 30 ft-lb; MD, CRP — Terme für Matrixschädigung und kupferreiche Ausscheidungen; A, B — Koeffizienten je Produktklasse; T_C — Temperatur im kalten Strang, °F; φt_e — effektive Fluenz; Cu_e — effektiver Kupfergehalt; RT_MAX-X — maximale Referenztemperatur der Region X. r — Residuum eines Überwachungspunkts; σ — Standardabweichung aus Tabelle 5; m, se(m) — Steigung von r über log₁₀ der Fluenz nach kleinsten Quadraten und ihr Standardfehler; r* — normiertes Residuum.","modelText":"Temperaturen in °F, Fluenz in n/cm² (E > 1 MeV), Gehalte in Massenprozent; der Chemiefaktor wird zwischen den Tabelleneinträgen linear in Kupfer und Nickel interpoliert.","boundaryText":"Das Werkzeug liefert keine genehmigungsrechtliche Schlussfolgerung und ersetzt keine anlagenspezifische Analyse; die Freigabe ist eine eigene, an die Eingaben gebundene Entscheidung.","scopeText":"Screening-Hilfsmittel für 10 CFR 50.61 und 50.61a ohne genehmigungsrechtliche Schlussfolgerung. Die eingebauten Beispiele sind synthetisch.","adjacent":"Angrenzende Schweißnähte (IDs)","atFluenceOf":"bei der Fluenz von","rg143":"Nach RG 1.43 gefertigte Schmiedeteile","b_adjacent_invalid":"Eine ID einer angrenzenden Schweißnaht bezeichnet keine Schweißnahtzeile.","g_adjacency_unknown":"Die angrenzenden Schweißnähte dieses Blechs oder Schmiedeteils sind nicht erfasst; Gl. 1 und Gl. 4 können RT_MAX-AW oder RT_MAX-CW unterschätzen.","g_rg143_unknown":"Die Fertigung der Schmiedeteile nach RG 1.43 ist nicht geklärt; das strengere Kriterium wird angewendet.","a_record_adjacency":"die Schweißnähte erfassen, an die dieses Blech oder
