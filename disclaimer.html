</head><body><div class="wrap"><header><div><h1 id="title"></h1><p class="lead" id="intro"></p><p class="ref" id="reference"></p></div><div><nav id="langs"></nav><p><a class="navlink" id="home" href="index.html"></a> <a class="navlink" id="registry" href="validation.html"></a></p></div></header><article id="content"></article><footer><span id="sitename"></span> · <a href="index.html">Tools</a></footer></div><script>const D={"langs":["en","uk","de","nl","fr","es","pl"],"ui":{"heading":{"en":"Engineering calculation disclaimer","uk":"Застереження щодо інженерних розрахунків","de":"Hinweis zu technischen Berechnungen","nl":"Disclaimer voor technische berekeningen","fr":"Avertissement relatif aux calculs d’ingénierie","es":"Aviso sobre cálculos de ingeniería"},"intro":{"en":"Reference text governing the use of all calculators and visual models on this site.","uk":"Довідковий текст, що регулює використання всіх калькуляторів і візуальних моделей сайту.","de":"Referenztext für die Nutzung aller Rechner und visuellen Modelle dieser Website.","nl":"Referentietekst voor het gebruik van alle rekenmodules en visuele modellen op deze site.","fr":"Texte de référence régissant l’utilisation de tous les calculateurs et modèles visuels du site.","es":"Texto de referencia que rige el uso de todas las calculadoras y modelos visuales del sitio."},"home":{"en":"Tools","uk":"Інструменти","de":"Werkzeuge","nl":"Hulpmiddelen","fr":"Outils","es":"Herramientas"},"language":{"en":"Language","uk":"Мова","de":"Sprache","nl":"Taal","fr":"Langue","es":"Idioma"},"reference":{"en":"The English text is the reference version. Translations are provided for accessibility.","uk":"Англійський текст є еталонною версією. Переклади надано для доступності.","de":"Der englische Text ist die Referenzfassung. Übersetzungen dienen der Zugänglichkeit.","nl":"De Engelse tekst is de referentieversie. Vertalingen zijn bedoeld voor toegankelijkheid.","fr":"Le texte anglais est la version de référence. Les traductions sont fournies pour l’accessibilité.","es":"El texto inglés es la versión de referencia. Las traducciones se facilitan por accesibilidad."}},"sections":{"en":[["Status and intended use","The calculators, diagrams, simulations and other tools on {site} are experimental engineering models intended for education, technical exploration and preliminary assessment. Unless expressly stated otherwise, they have not been independently verified, validated, certified, accredited or approved by a regulatory authority, standards body, notified body or other independent organisation."],["Possibility of errors","The tools may contain errors or omissions in equations, correlations, physical assumptions, boundary conditions, source data, material properties, unit conversions, numerical methods, software implementation, documentation or translations. A result that appears plausible is not necessarily correct."],["Independent engineering verification","The tools do not constitute engineering, safety, regulatory, legal or other professional advice. Before relying on a result, independently verify all input values, units, assumptions, boundary conditions, model applicability, equations, coefficients and outputs against applicable legislation, codes, standards, authoritative data and review by suitably qualified persons."],["Safety-critical applications","Do not use these tools as the sole basis for decisions involving nuclear or radiation safety, fire safety, smoke control, evacuation, structural integrity, pressure equipment, electrical protection, hazardous substances, life-support systems, environmental or regulatory compliance, equipment selection, construction, commissioning, operation or control. Such applications require documented design controls and independent verification."],["External data and standards","Some tools use third-party data, correlations, catalogues, climatology, standards or services. Their accuracy, completeness, availability and continued applicability are not guaranteed. A reference to a standard or source does not demonstrate that the tool fully implements or complies with it."],["Network access and data sources","Every tool is a single static page that computes in your browser; nothing you enter is transmitted, stored or logged, and the site contains no analytics or tracking. One tool is an exception: the wall and envelope thermal calculator contacts external services when it loads, to estimate your approximate location from your IP address (ipwho.is, with ipapi.co as a fallback) and to download place names and a year of reanalysis climate data (Open-Meteo). Your IP address is therefore visible to those providers, who are outside the control of this site. No other tool makes any network request. Where other tools name external data, that data is built into the page: FENDL-3.2c (IAEA), the Particle Data Group summary tables, IAPWS-IF97, NASA POWER climatology, ASHRAE Fundamentals, EN 673, NBN S 21-208-1 and manufacturer catalogue data. Those sources belong to their respective owners and are used here for education and preliminary assessment."],["No warranty and limitation of liability","The website and its tools are provided “as is” and “as available”. To the maximum extent permitted by applicable law, no warranty is given regarding accuracy, completeness, reliability, availability, fitness for a particular purpose or freedom from errors, and the website owner and contributors shall not be liable for losses arising from use of or reliance on the tools. Nothing here excludes liability or statutory rights that cannot lawfully be excluded or limited."],["Versions and reproducibility","Models, equations, datasets and software may change without notice. Results from different versions may differ. For any documented assessment, record the tool name, input data, calculation date and displayed revision or version."],["Reporting suspected errors","When reporting a suspected error, include the tool name, complete input data, expected result, observed result, browser and calculation date so that the issue can be reproduced."],["Terms of use","The tools are free to use, and the results you obtain with them are yours to use as you see fit. They remain the work of their author: please ask before republishing a tool, hosting a copy of it, or embedding it in a course, product or publication. The third-party data and standards referred to above are not covered by this permission and remain subject to the terms of their own owners."]],"uk":[["Статус і призначення","Калькулятори, діаграми, симуляції та інші інструменти {site} є експериментальними інженерними моделями для навчання, технічного дослідження та попередньої оцінки. Якщо для конкретного інструмента прямо не зазначено інше, вони не пройшли незалежної перевірки, верифікації, валідації, сертифікації, акредитації чи погодження регулятором, органом стандартизації, нотифікованим або іншим незалежним органом."],["Можливість помилок","Інструменти можуть містити помилки або пропуски в рівняннях, кореляціях, фізичних припущеннях, граничних умовах, вихідних даних, властивостях матеріалів, перетворенні одиниць, числових методах, програмній реалізації, документації чи перекладах. Правдоподібний результат не обов’язково є правильним."],["Незалежна інженерна перевірка","Інструменти не є інженерною, безпековою, нормативною, юридичною чи іншою професійною консультацією. Перед використанням результату незалежно перевірте всі вхідні дані, одиниці, припущення, граничні умови, застосовність моделі, рівняння, коефіцієнти й результати за чинним законодавством, нормами, стандартами, авторитетними даними та перевіркою кваліфікованих фахівців."],["Застосування, пов’язані з безпекою","Не використовуйте ці інструменти як єдину основу для рішень щодо ядерної чи радіаційної безпеки, пожежної безпеки, димовидалення, евакуації, міцності конструкцій, обладнання під тиском, електричного захисту, небезпечних речовин, систем життєзабезпечення, екологічної чи нормативної відповідності, вибору обладнання, будівництва, введення в експлуатацію, експлуатації або керування. Такі застосування потребують документованого контролю проєктування й незалежної перевірки."],["Зовнішні дані та стандарти","Деякі інструменти використовують сторонні дані, кореляції, каталоги, кліматологію, стандарти або сервіси. Їх точність, повнота, доступність і подальша застосовність не гарантуються. Посилання на стандарт або джерело не доводить повної реалізації чи відповідності цьому джерелу."],["Мережеві запити та джерела даних","Кожен інструмент — це одна статична сторінка, що рахує у вашому браузері; введені вами дані нікуди не передаються, не зберігаються і не журналюються, аналітики та стеження на сайті немає. Один інструмент є винятком: тепловий розрахунок стін і огороджень під час завантаження звертається до зовнішніх сервісів, щоб оцінити ваше приблизне місцезнаходження за IP-адресою (ipwho.is, із запасним ipapi.co) і завантажити назви місць та рік даних реаналізу клімату (Open-Meteo). Отже, ваша IP-адреса видима цим постачальникам, які не підконтрольні цьому сайту. Жоден інший інструмент мережевих запитів не робить. Там, де інші інструменти називають зовнішні дані, ці дані вбудовані у сторінку: FENDL-3.2c (МАГАТЕ), зведені таблиці Particle Data Group, IAPWS-IF97, кліматологія NASA POWER, ASHRAE Fundamentals, EN 673, NBN S 21-208-1 та каталожні дані виробників. Ці джерела належать їхнім власникам і використані тут для навчання та попередньої оцінки."],["Відсутність гарантій та обмеження відповідальності","Сайт та його інструменти надаються «як є» і «за наявності». У максимально дозволеному законом обсязі не надається гарантій точності, повноти, надійності, доступності, придатності для певної мети чи відсутності помилок; власник сайту та учасники не відповідають за збитки, спричинені використанням або довірою до інструментів. Це положення не виключає відповідальності чи законних прав, які не можуть бути правомірно виключені або обмежені."],["Версії та відтворюваність","Моделі, рівняння, набори даних і програмне забезпечення можуть змінюватися без повідомлення. Результати різних версій можуть відрізнятися. Для документованої оцінки запишіть назву інструмента, вхідні дані, дату розрахунку та показану редакцію або версію."],["Повідомлення про ймовірні помилки","У повідомленні про ймовірну помилку вкажіть назву інструмента, повні вхідні дані, очікуваний і отриманий результат, браузер та дату розрахунку, щоб проблему можна було відтворити."],["Умови використання","Інструментами можна користуватися вільно, а отримані результати належать вам і використовуються на ваш розсуд. Самі інструменти залишаються працею їхнього автора: перед передруком інструмента, розміщенням його копії або вбудовуванням у курс, продукт чи публікацію, будь ласка, запитайте. Сторонні дані та стандарти, згадані вище, цим дозволом не охоплюються і залишаються предметом умов їхніх власників."]],"de":[["Status und bestimmungsgemäße Nutzung","Die Rechner, Diagramme, Simulationen und sonstigen Werkzeuge auf {site} sind experimentelle Ingenieurmodelle für Ausbildung, technische Untersuchung und Vorabschätzung. Sofern bei einem Werkzeug nicht ausdrücklich anders angegeben, wurden sie nicht unabhängig verifiziert, validiert, zertifiziert, akkreditiert oder durch eine Aufsichtsbehörde, Normungsorganisation, benannte Stelle oder andere unabhängige Organisation genehmigt."],["Fehlermöglichkeit","Die Werkzeuge können Fehler oder Auslassungen in Gleichungen, Korrelationen, physikalischen Annahmen, Randbedingungen, Quelldaten, Stoffwerten, Einheitenumrechnungen, numerischen Verfahren, Softwareimplementierung, Dokumentation oder Übersetzungen enthalten. Ein plausibles Ergebnis ist nicht notwendigerweise richtig."],["Unabhängige technische Prüfung","Die Werkzeuge stellen keine technische, sicherheitstechnische, regulatorische, rechtliche oder sonstige professionelle Beratung dar. Vor jeder Verwendung sind Eingaben, Einheiten, Annahmen, Randbedingungen, Modellanwendbarkeit, Gleichungen, Koeffizienten und Ergebnisse anhand geltender Gesetze, Regeln, Normen, maßgeblicher Daten und durch entsprechend qualifizierte Personen unabhängig zu prüfen."],["Sicherheitsrelevante Anwendungen","Diese Werkzeuge dürfen nicht als alleinige Entscheidungsgrundlage für nukleare oder radiologische Sicherheit, Brandschutz, Rauchableitung, Evakuierung, Tragwerksintegrität, Druckgeräte, elektrischen Schutz, Gefahrstoffe, Lebenserhaltung, Umwelt- oder Regelkonformität, Geräteauswahl, Bau, Inbetriebnahme, Betrieb oder Steuerung dienen. Solche Anwendungen erfordern dokumentierte Auslegungskontrollen und unabhängige Prüfung."],["Externe Daten und Normen","Einige Werkzeuge verwenden Daten, Korrelationen, Kataloge, Klimatologie, Normen oder Dienste Dritter. Genauigkeit, Vollständigkeit, Verfügbarkeit und fortdauernde Anwendbarkeit sind nicht gewährleistet. Die Nennung einer Norm oder Quelle belegt keine vollständige Umsetzung oder Konformität."],["Netzwerkzugriffe und Datenquellen","Jedes Werkzeug ist eine einzelne statische Seite, die in Ihrem Browser rechnet; Ihre Eingaben werden nicht übertragen, nicht gespeichert und nicht protokolliert, und die Website enthält weder Analyse- noch Tracking-Dienste. Ein Werkzeug bildet die Ausnahme: Der Wand- und Bauteilrechner ruft beim Laden externe Dienste auf, um Ihren ungefähren Standort anhand der IP-Adresse zu schätzen (ipwho.is, ersatzweise ipapi.co) und um Ortsnamen sowie ein Jahr Reanalyse-Klimadaten zu laden (Open-Meteo). Ihre IP-Adresse ist diesen Anbietern daher bekannt; sie unterliegen nicht der Kontrolle dieser Website. Kein anderes Werkzeug stellt Netzwerkanfragen. Wo andere Werkzeuge externe Daten nennen, sind diese in die Seite eingebettet: FENDL-3.2c (IAEO), die Übersichtstabellen der Particle Data Group, IAPWS-IF97, NASA-POWER-Klimatologie, ASHRAE Fundamentals, EN 673, NBN S 21-208-1 sowie Katalogdaten von Herstellern. Diese Quellen gehören ihren jeweiligen Inhabern und werden hier für Lehre und Vorbemessung verwendet."],["Keine Gewährleistung und Haftungsbegrenzung","Website und Werkzeuge werden „wie besehen“ und „wie verfügbar“ bereitgestellt. Soweit gesetzlich zulässig, wird keine Gewähr für Genauigkeit, Vollständigkeit, Zuverlässigkeit, Verfügbarkeit, Eignung für einen bestimmten Zweck oder Fehlerfreiheit übernommen; Websitebetreiber und Mitwirkende haften nicht für Schäden aus Nutzung oder Vertrauen auf die Werkzeuge. Unberührt bleiben Haftung und gesetzliche Rechte, die nicht wirksam ausgeschlossen oder begrenzt werden können."],["Versionen und Reproduzierbarkeit","Modelle, Gleichungen, Datensätze und Software können ohne Ankündigung geändert werden. Ergebnisse verschiedener Versionen können abweichen. Für dokumentierte Bewertungen sind Werkzeugname, Eingaben, Berechnungsdatum und angezeigte Revision oder Version festzuhalten."],["Meldung vermuteter Fehler","Eine Fehlermeldung sollte Werkzeugname, vollständige Eingaben, erwartetes und beobachtetes Ergebnis, Browser und Berechnungsdatum enthalten, damit der Fehler reproduziert werden kann."],["Nutzungsbedingungen","Die Werkzeuge dürfen frei genutzt werden, und die damit erzielten Ergebnisse gehören Ihnen zur freien Verwendung. Die Werkzeuge selbst bleiben das Werk ihres Autors: Bitte fragen Sie an, bevor Sie ein Werkzeug weiterveröffentlichen, eine Kopie davon betreiben oder es in einen Kurs, ein Produkt oder eine Veröffentlichung einbetten. Die oben genannten Daten und Normen Dritter sind von dieser Erlaubnis nicht erfasst und unterliegen weiterhin den Bedingungen ihrer Inhaber."]],"nl":[["Status en bedoeld gebruik","De rekenmodules, diagrammen, simulaties en andere hulpmiddelen op {site} zijn experimentele technische modellen voor onderwijs, technische verkenning en voorlopige beoordeling. Tenzij bij een hulpmiddel uitdrukkelijk anders staat vermeld, zijn ze niet onafhankelijk geverifieerd, gevalideerd, gecertificeerd, geaccrediteerd of goedgekeurd door een toezichthouder, normalisatie-instelling, aangemelde instantie of andere onafhankelijke organisatie."],["Mogelijke fouten","De hulpmiddelen kunnen fouten of weglatingen bevatten in vergelijkingen, correlaties, fysische aannames, randvoorwaarden, brongegevens, materiaaleigenschappen, eenheidsconversies, numerieke methoden, software-implementatie, documentatie of vertalingen. Een aannemelijk resultaat is niet noodzakelijk correct."],["Onafhankelijke technische verificatie","De hulpmiddelen vormen geen technisch, veiligheidskundig, regelgevend, juridisch of ander professioneel advies. Verifieer vóór gebruik alle invoer, eenheden, aannames, randvoorwaarden, toepasbaarheid van het model, vergelijkingen, coëfficiënten en resultaten aan de hand van toepasselijke wetgeving, codes, normen, gezaghebbende gegevens en beoordeling door voldoende gekwalificeerde personen."],["Veiligheidskritische toepassingen","Gebruik deze hulpmiddelen niet als enige basis voor beslissingen over nucleaire of stralingsveiligheid, brandveiligheid, rookbeheersing, evacuatie, constructieve integriteit, drukapparatuur, elektrische beveiliging, gevaarlijke stoffen, levensondersteuning, milieu- of regelconformiteit, apparatuurkeuze, bouw, inbedrijfstelling, bedrijfsvoering of besturing. Dergelijke toepassingen vereisen gedocumenteerde ontwerpbeheersing en onafhankelijke verificatie."],["Externe gegevens en normen","Sommige hulpmiddelen gebruiken gegevens, correlaties, catalogi, klimatologie, normen of diensten van derden. Nauwkeurigheid, volledigheid, beschikbaarheid en blijvende toepasbaarheid zijn niet gegarandeerd. Een verwijzing naar een norm of bron toont niet aan dat deze volledig is geïmplementeerd of nageleefd."],["Netwerktoegang en gegevensbronnen","Elke tool is één statische pagina die in uw browser rekent; wat u invoert wordt niet verzonden, niet opgeslagen en niet gelogd, en de site bevat geen analyse of tracking. Eén tool vormt de uitzondering: de wand- en schilconstructiecalculator benadert bij het laden externe diensten om uw locatie bij benadering te schatten op basis van uw IP-adres (ipwho.is, met ipapi.co als terugval) en om plaatsnamen en een jaar reanalyse-klimaatgegevens op te halen (Open-Meteo). Uw IP-adres is daardoor zichtbaar voor die aanbieders, die buiten de controle van deze site vallen. Geen enkele andere tool doet netwerkverzoeken. Waar andere tools externe gegevens noemen, zitten die gegevens in de pagina zelf: FENDL-3.2c (IAEA), de overzichtstabellen van de Particle Data Group, IAPWS-IF97, NASA POWER-klimatologie, ASHRAE Fundamentals, EN 673, NBN S 21-208-1 en catalogusgegevens van fabrikanten. Die bronnen behoren toe aan hun eigenaars en worden hier gebruikt voor onderwijs en voorlopige beoordeling."],["Geen garantie en beperking van aansprakelijkheid","De website en hulpmiddelen worden aangeboden “zoals ze zijn” en “zoals beschikbaar”. Voor zover wettelijk toegestaan wordt geen garantie gegeven voor nauwkeurigheid, volledigheid, betrouwbaarheid, beschikbaarheid, geschiktheid voor een bepaald doel of foutloosheid; de website-eigenaar en medewerkers zijn niet aansprakelijk voor verliezen door gebruik van of vertrouwen op de hulpmiddelen. Dit laat aansprakelijkheid en wettelijke rechten die niet rechtsgeldig kunnen worden uitgesloten of beperkt onverlet."],["Versies en reproduceerbaarheid","Modellen, vergelijkingen, datasets en software kunnen zonder kennisgeving wijzigen. Resultaten van verschillende versies kunnen afwijken. Noteer voor een gedocumenteerde beoordeling de naam van het hulpmiddel, invoergegevens, berekeningsdatum en weergegeven revisie of versie."],["Vermoede fouten melden","Vermeld bij een vermoede fout de naam van het hulpmiddel, volledige invoer, verwacht en waargenomen resultaat, browser en berekeningsdatum zodat het probleem reproduceerbaar is."],["Gebruiksvoorwaarden","De tools mogen vrij worden gebruikt, en de resultaten die u ermee verkrijgt zijn van u en mag u naar eigen inzicht gebruiken. De tools zelf blijven het werk van hun auteur: vraag het even voordat l’exploitation ou la commande. Ces applications exigent une maîtrise de conception documentée et une vérification indépendante."],["Données externes et normes","Certains outils utilisent des données, corrélations, catalogues, climatologies, normes ou services tiers. Leur exactitude, exhaustivité, disponibilité et applicabilité durable ne sont pas garanties. La référence à une norme ou source ne démontre ni son implémentation complète ni la conformité."],["Accès réseau et sources de données","Chaque outil est une page statique unique qui calcule dans votre navigateur ; ce que vous saisissez n’est ni transmis, ni conservé, ni journalisé, et le site ne contient aucun dispositif de mesure d’audience ou de suivi. Un outil fait exception : le calcul thermique des parois contacte des services externes à son chargement, pour estimer votre position approximative à partir de votre adresse IP (ipwho.is, avec ipapi.co en secours) et pour télécharger des noms de lieux et une année de réanalyse climatique (Open-Meteo). Votre adresse IP est donc visible de ces fournisseurs, qui échappent au contrôle de ce site. Aucun autre outil n’effectue de requête réseau. Lorsque d’autres outils citent des données externes, ces données sont intégrées à la page : FENDL-3.2c (AIEA), les tables de synthèse du Particle Data Group, IAPWS-IF97, la climatologie NASA POWER, ASHRAE Fundamentals, EN 673, NBN S 21-208-1 et des données de catalogue de fabricants. Ces sources appartiennent à leurs détenteurs respectifs et sont utilisées ici à des fins pédagogiques et de prédimensionnement."],["Absence de garantie et limitation de responsabilité","Le site et ses outils sont fournis « en l’état » et « selon disponibilité ». Dans toute la mesure permise par la loi, aucune garantie n’est donnée quant à l’exactitude, l’exhaustivité, la fiabilité, la disponibilité, l’adéquation à un usage particulier ou l’absence d’erreurs; le propriétaire du site et les contributeurs ne répondent pas des pertes résultant de l’utilisation des outils ou de la confiance qui leur est accordée. Rien n’exclut une responsabilité ou des droits légaux qui ne peuvent être légalement exclus ou limités."],["Versions et reproductibilité","Les modèles, équations, jeux de données et logiciels peuvent changer sans préavis. Les résultats de versions différentes peuvent diverger. Pour toute évaluation documentée, consignez le nom de l’outil, les entrées, la date du calcul et la révision ou version affichée."],["Signalement d’erreurs présumées","Tout signalement doit indiquer le nom de l’outil, les entrées complètes, le résultat attendu, le résultat observé, le navigateur et la date du calcul afin de permettre la reproduction."],["Conditions d’utilisation","Les outils sont libres d’utilisation, et les résultats que vous obtenez avec eux vous appartiennent et sont utilisables comme bon vous semble. Les outils eux-mêmes restent l’œuvre de leur auteur : merci de demander avant de republier un outil, d’en héberger une copie ou de l’intégrer à un cours, un produit ou une publication. Les données et normes de tiers mentionnées ci-dessus ne sont pas couvertes par cette autorisation et demeurent soumises aux conditions de leurs propres détenteurs."]],"es":[["Estado y uso previsto","Las calculadoras, diagramas, simulaciones y demás herramientas de {site} son modelos de ingeniería experimentales destinados a enseñanza, exploración técnica y evaluación preliminar. Salvo indicación expresa en una herramienta, no han sido verificados, validados, certificados, acreditados ni aprobados de forma independiente por una autoridad reguladora, organismo de normalización, organismo notificado u otra entidad independiente."],["Posibilidad de errores","Las herramientas pueden contener errores u omisiones en ecuaciones, correlaciones, supuestos físicos, condiciones de contorno, datos fuente, propiedades de materiales, conversiones de unidades, métodos numéricos, implementación de software, documentación o traducciones. Un resultado plausible no es necesariamente correcto."],["Verificación de ingeniería independiente","Las herramientas no constituyen asesoramiento de ingeniería, seguridad, regulación, jurídico ni profesional. Antes de utilizar un resultado, verifique independientemente entradas, unidades, supuestos, condiciones de contorno, aplicabilidad del modelo, ecuaciones, coeficientes y salidas frente a legislación, códigos, normas, datos autorizados y revisión por personas debidamente cualificadas."],["Aplicaciones críticas para la seguridad","No utilice estas herramientas como única base para decisiones sobre seguridad nuclear o radiológica, incendios, control de humos, evacuación, integridad estructural, equipos a presión, protección eléctrica, sustancias peligrosas, soporte vital, cumplimiento ambiental o regulatorio, selección de equipos, construcción, puesta en servicio, operación o control. Estas aplicaciones requieren controles de diseño documentados y verificación independiente."],["Datos externos y normas","Algunas herramientas utilizan datos, correlaciones, catálogos, climatología, normas o servicios de terceros. No se garantizan su exactitud, integridad, disponibilidad ni aplicabilidad continuada. La referencia a una norma o fuente no demuestra implementación completa ni cumplimiento."],["Acceso a la red y fuentes de datos","Cada herramienta es una única página estática que calcula en su navegador; lo que introduce no se transmite, ni se almacena, ni se registra, y el sitio no contiene analítica ni seguimiento. Una herramienta es la excepción: el cálculo térmico de muros y cerramientos contacta con servicios externos al cargarse, para estimar su ubicación aproximada a partir de su dirección IP (ipwho.is, con ipapi.co como alternativa) y para descargar nombres de lugares y un año de reanálisis climático (Open-Meteo). Su dirección IP queda por tanto visible para esos proveedores, que están fuera del control de este sitio. Ninguna otra herramienta realiza peticiones de red. Cuando otras herramientas citan datos externos, esos datos están incorporados en la página: FENDL-3.2c (OIEA), las tablas resumen del Particle Data Group, IAPWS-IF97, la climatología de NASA POWER, ASHRAE Fundamentals, EN 673, NBN S 21-208-1 y datos de catálogo de fabricantes. Esas fuentes pertenecen a sus respectivos titulares y se emplean aquí con fines docentes y de evaluación preliminar."],["Sin garantía y limitación de responsabilidad","El sitio y sus herramientas se proporcionan “tal cual” y “según disponibilidad”. En la máxima medida permitida por la ley, no se garantiza exactitud, integridad, fiabilidad, disponibilidad, idoneidad para un fin concreto ni ausencia de errores; el propietario y los colaboradores no responderán de pérdidas derivadas del uso o confianza en las herramientas. Nada excluye responsabilidades o derechos legales que no puedan excluirse o limitarse lícitamente."],["Versiones y reproducibilidad","Los modelos, ecuaciones, conjuntos de datos y software pueden cambiar sin aviso. Los resultados de versiones distintas pueden diferir. Para una evaluación documentada, registre nombre de la herramienta, entradas, fecha de cálculo y revisión o versión mostrada."],["Comunicación de posibles errores","Al comunicar un posible error, incluya nombre de la herramienta, entradas completas, resultado esperado, resultado observado, navegador y fecha del cálculo para permitir su reproducción."],["Condiciones de uso","Las herramientas son de uso libre, y los resultados que obtenga con ellas son suyos y puede emplearlos como considere oportuno. Las herramientas en sí siguen siendo obra de su autor: pregunte antes de republicar una herramienta, alojar una copia de ella o incrustarla en un curso, producto o publicación. Los datos y normas de terceros mencionados más arriba no quedan cubiertos por este permiso y siguen sujetos a las condiciones de sus respectivos titulares."]]}};const q=new URLSearchParams(location.search);function lsGet(){try{return window.localStorage.getItem('diagram_site_lang')||localStorage.getItem('diagram_lang')}catch(e){return null}}function lsSet(v){try{window.localStorage.setItem('diagram_site_lang',v);window.localStorage.setItem('diagram_lang',v)}catch(e){}}function lang(){const x=(q.get('lang')||lsGet()||navigator.language||'en').slice(0,2).toLowerCase();return D.langs.includes(x)?x:'en'}/* This page's inline script runs while the document is parsing — before the

const SITE_LOCAL={en:'this site',uk:'цей сайт',de:'diese Website',nl:'deze site',fr:'ce site',es:'este sitio'};

 try{if(/^https?:$/.test(location.protocol)&&location.host)return location.host}catch(e){}
 return '';
}

function render(l){document.documentElement.lang=l;{const sn=document.getElementById('sitename');if(sn)sn.textContent=siteLabel(l);}document.getElementById('title').textContent=D.ui.heading[l]||D.ui.heading.en;document.getElementById('intro').textContent=D.ui.intro[l]||D.ui.intro.en;document.getElementById('reference').textContent=D.ui.reference[l]||D.ui.reference.en;document.getElementById('home').textContent=D.ui.home[l]||D.ui.home.en;document.getElementById('registry').textContent=({en:'Validation register',uk:'Реєстр валідації',de:'Validierungsregister',nl:'Validatieregister',fr:'Registre de validation',es:'Registro de validación',pl:'Rejestr walidacji'}[l]||'Validation register');document.getElementById('content').innerHTML=(D.sections[l]||D.sections.en).map(x=>`<section><h2>${withSite(x[0],l)}</h2><p>${withSite(x[1],l)}</p></section>`).join('');document.querySelectorAll('#langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l))}const n={en:'English',uk:'Українська',de:'Deutsch',nl:'Nederlands',fr:'Français',es:'Español',pl:'Polski'};D.langs.forEach(l=>{const b=document.createElement('button');b.textContent=n[l];b.dataset.l=l;b.onclick=()=>{lsSet(l);history.replaceState(null,'','?lang='+l);render(l)};document.getElementById('langs').appendChild(b)});render(lang());</script><script>(()=>{const S=['en','uk','de','nl','fr','es','pl'];let l=window.__diagramLang||'en';function u(a){try{const x=new URL(a.getAttribute('href'),location.href);if(x.origin===location.origin&&/\.(?:html|php)$/.test(x.pathname)){x.searchParams.set('lang',l);a.setAttribute('href',x.pathname.split('/').pop()+x.search)}}catch(e){}}document.querySelectorAll('a[href]').forEach(u);})();</script>
