 "summary": {
  "en": "Transport and overview hub for one project package: open, export or clear it, see what every tool wrote, and resolve every cross-reference against the register that owns the identifier.",
  "uk": "Вузол перенесення та огляду одного пакета проєкту: відкриття, експорт і очищення, огляд записів кожного інструмента та звірка кожного перехресного посилання з реєстром, якому належить ідентифікатор.",
  "de": "Transport- und Übersichtsknoten für ein Projektpaket: öffnen, exportieren, löschen, sehen, was jedes Werkzeug geschrieben hat, und jeden Querverweis gegen das Register auflösen, dem die Kennung gehört.",
  "nl": "Transport- en overzichtspunt voor één projectpakket: openen, exporteren of wissen, zien wat elke tool schreef, en elke kruisverwijzing oplossen tegen het register dat de identificatie bezit.",
  "fr": "Point de transport et de vue d’ensemble d’un dossier de projet : ouvrir, exporter ou effacer, voir ce que chaque outil a écrit et résoudre chaque référence croisée dans le registre qui détient l’identifiant.",
  "es": "Punto de transporte y vista general de un paquete de proyecto: abrirlo, exportarlo o borrarlo, ver qué escribió cada herramienta y resolver cada referencia cruzada contra el registro que posee el identificador.",
  "pl": "Węzeł transportu i przeglądu jednego pakietu projektu: otwarcie, eksport lub wyczyszczenie, podgląd zapisów każdego narzędzia oraz rozwiązanie każdego odsyłacza względem rejestru, który posiada identyfikator."
 },
 "description": {
  "en": "Opens a project file into browser storage after showing a difference against what is stored, exports the stored package, clears storage on confirmation and creates an empty envelope when storage holds none. It lists every section with its item count, writer, provenance and flags, draws the lifecycle strip and the workflow graph with the nodes lit whose sections exist, and audits identifiers: dangling cross-references, duplicate ids inside a register, orphan flags, sections with no provenance entry, provenance written by a tool that does not own the path, and calculations attached to a system or work package that does not exist. It ends with the sections missing for the stage in the package. It writes none of the registers it audits and gives no score; every figure is a count. Attach to project, in the shared toolbar, files the audit record under calculations.projectworkspace and raises the package revision. It pins the package as a baseline at a moment the user names and states, per section and per item, which identifier was added or removed and which field changed, with the value before and the value after; two exported files compare against each other with nothing in browser storage.",
  "uk": "Відкриває файл проєкту у сховищі браузера, показавши різницю щодо збереженого; експортує збережений пакет; очищає сховище з підтвердженням; створює порожній конверт, коли сховище порожнє. Перелічує кожну секцію з кількістю елементів, інструментом-автором, походженням і позначками, будує смугу життєвого циклу та граф робочого процесу з підсвіченими вузлами наявних секцій і перевіряє ідентифікатори: висячі перехресні посилання, дублікати ідентифікаторів у реєстрі, позначки без цілі, секції без запису походження, походження, записане інструментом, який не володіє шляхом, і розрахунки, прив’язані до неіснуючої системи чи робочого пакета. Завершується переліком секцій, яких бракує для стадії пакета. Воно не записує жодного з реєстрів, які перевіряє, і не дає оцінки: кожна цифра — це кількість. «Додати до проєкту» на спільній панелі записує запис перевірки до calculations.projectworkspace і підвищує ревізію пакета. Вона закріплює пакет як базу порівняння в названий користувачем момент і повідомляє за секціями та елементами, який ідентифікатор додано чи вилучено і яке поле змінилося, зі значенням до і після; два експортовані файли порівнюються між собою навіть за порожнього сховища браузера.",
  "de": "Öffnet eine Projektdatei im Browserspeicher, nachdem der Unterschied zum Gespeicherten gezeigt wurde, exportiert das gespeicherte Paket, löscht den Speicher nach Bestätigung und legt einen leeren Umschlag an, wenn der Speicher keinen enthält. Listet jeden Abschnitt mit Elementanzahl, schreibendem Werkzeug, Herkunft und Markierungen, zeichnet das Lebenszyklusband und den Workflow-Graphen mit den Knoten vorhandener Abschnitte und prüft Kennungen: ins Leere zeigende Querverweise, doppelte Kennungen in einem Register, Markierungen ohne Ziel, Abschnitte ohne Herkunftseintrag, Herkunft von einem Werkzeug, dem der Pfad nicht gehört, und Berechnungen an einem System oder Arbeitspaket, das es nicht gibt. Am Ende stehen die für die Stufe des Pakets fehlenden Abschnitte. Es schreibt keines der geprüften Register und vergibt keine Punktzahl; jede Zahl ist eine Anzahl. „Dem Projekt anhängen“ in der gemeinsamen Leiste legt den Prüfsatz unter calculations.projectworkspace ab und erhöht die Paketrevision. Sie heftet das Paket zu einem vom Benutzer benannten Zeitpunkt als Vergleichsbasis an und nennt je Abschnitt und je Element, welche Kennung neu ist oder entfiel und welches Feld sich änderte, mit Wert vorher und Wert nachher; zwei exportierte Dateien vergleichen sich auch ohne Browserspeicher gegeneinander.",
  "nl": "Opent een projectbestand in de browseropslag nadat het verschil met het opgeslagen pakket is getoond, exporteert het opgeslagen pakket, wist de opslag na bevestiging en maakt een lege envelop wanneer de opslag er geen bevat. Somt elke sectie op met aantal items, schrijvende tool, herkomst en markeringen, tekent de levenscyclusbalk en de workflowgraaf met de knopen van aanwezige secties opgelicht, en controleert identificaties: kruisverwijzingen die nergens uitkomen, dubbele identificaties binnen een register, markeringen zonder doel, secties zonder herkomstregel, herkomst geschreven door een tool die het pad niet bezit, en berekeningen gekoppeld aan een systeem of werkpakket dat niet bestaat. Het sluit af met de secties die voor de fase van het pakket ontbreken. Het schrijft geen van de gecontroleerde registers en geeft geen score; elk getal is een aantal. ‘Aan project koppelen’ in de gedeelde balk legt het controleverslag vast onder calculations.projectworkspace en verhoogt de pakketrevisie. Zij zet het pakket op een door de gebruiker benoemd moment vast als vergelijkingsbasis en noemt per sectie en per item welke identificatie is toegevoegd of verwijderd en welk veld is gewijzigd, met de waarde vóór en na; twee geëxporteerde bestanden vergelijken zich zonder browseropslag tegen elkaar.",
  "fr": "Ouvre un fichier de projet dans le stockage du navigateur après avoir montré l’écart avec ce qui est stocké, exporte le dossier stocké, efface le stockage après confirmation et crée une enveloppe vide lorsque le stockage n’en contient aucune. Il liste chaque section avec son nombre d’éléments, l’outil rédacteur, la provenance et les signalements, trace la bande de cycle de vie et le graphe de flux de travail avec les nœuds des sections présentes allumés, et audite les identifiants : références croisées sans cible, identifiants en double dans un registre, signalements orphelins, sections sans ligne de provenance, provenance écrite par un outil qui ne détient pas le chemin, et calculs rattachés à un système ou à un lot qui n’existe pas. Il termine par les sections manquantes pour l’étape du dossier. Il n’écrit aucun des registres qu’il audite et ne donne aucune note ; chaque chiffre est un décompte. « Joindre au projet », dans la barre partagée, dépose l’enregistrement d’audit sous calculations.projectworkspace et incrémente la révision du dossier. Elle épingle le dossier comme référence à un moment que l’utilisateur nomme et indique, par section et par élément, quel identifiant a été ajouté ou retiré et quel champ a changé, avec la valeur avant et après ; deux fichiers exportés se comparent l’un à l’autre sans rien dans le stockage du navigateur.",
  "es": "Abre un archivo de proyecto en el almacenamiento del navegador tras mostrar la diferencia con lo almacenado, exporta el paquete almacenado, borra el almacenamiento con confirmación y crea un sobre vacío cuando el almacenamiento no contiene ninguno. Enumera cada sección con su recuento de elementos, la herramienta que la escribió, la procedencia y las marcas, dibuja la banda de ciclo de vida y el grafo de flujo de trabajo con los nodos de las secciones presentes encendidos, y audita identificadores: referencias cruzadas sin destino, identificadores duplicados dentro de un registro, marcas huérfanas, secciones sin línea de procedencia, procedencia escrita por una herramienta que no posee la ruta y cálculos adjuntos a un sistema o paquete de trabajo que no existe. Termina con las secciones que faltan para la etapa del paquete. No escribe ninguno de los registros que audita ni da puntuación; cada cifra es un recuento. «Adjuntar al proyecto», en la barra compartida, deposita el registro de auditoría en calculations.projectworkspace y sube la revisión del paquete. Fija el paquete como línea base en un momento que el usuario nombra e indica, por sección y por elemento, qué identificador se añadió o retiró y qué campo cambió, con el valor antes y después; dos archivos exportados se comparan entre sí sin nada en el almacenamiento del navegador.",
  "pl": "Otwiera plik projektu w pamięci przeglądarki po pokazaniu różnicy wobec tego, co jest zapisane, eksportuje zapisany pakiet, czyści pamięć po potwierdzeniu i tworzy pustą kopertę, gdy pamięć jest pusta. Wypisuje każdą sekcję z liczbą pozycji, narzędziem zapisującym, pochodzeniem i oznaczeniami, rysuje pasmo cyklu życia oraz graf przepływu pracy z podświetlonymi węzłami obecnych sekcji i kontroluje identyfikatory: odsyłacze prowadzące donikąd, powtórzone identyfikatory w rejestrze, oznaczenia bez celu, sekcje bez wpisu pochodzenia, pochodzenie zapisane przez narzędzie, które nie jest właścicielem ścieżki, oraz obliczenia dowiązane do nieistniejącego systemu lub pakietu roboczego. Kończy listą sekcji brakujących dla etapu pakietu. Nie zapisuje żadnego z kontrolowanych rejestrów i nie wystawia oceny; każda liczba jest liczebnością. „Dołącz do projektu” na wspólnym pasku zapisuje protokół kontroli w calculations.projectworkspace i podnosi rewizję pakietu. Przypina pakiet jako bazę odniesienia w chwili nazwanej przez użytkownika i podaje według sekcji i pozycji, który identyfikator dodano lub usunięto i które pole się zmieniło, z wartością przed i po; dwa wyeksportowane pliki porównują się ze sobą przy pustej pamięci przeglądarki."
 },

 "limitations": {
  "en": "The audit checks identities and cross-references only; it does not judge whether a requirement, a datasheet value or a bid evaluation is technically right. References resolve by exact, case-sensitive string equality of identifiers, so AHU-01 and ahu-01 are different; a near match is shown as a hint and never as a resolution. Only the fields of the tool’s own reference map are resolved; a field outside it, including free-text names and tool-internal keys, is not checked. The reference map for the thirteen registers added in 2026-09 follows the field names of TZ-engineering-workflow §2; a register whose writer spells a field differently is reported as holding no reference in that field until the map is updated. The next-steps list compares the sections present with a fixed stage table; it cannot know that a project has no control or electrical scope, so those registers are listed as conditional. The workflow graph and the lifecycle strip come from the catalogue and workflow-map.json; with no network an embedded snapshot is used and labelled with its revision. A file containing a duplicate JSON key is parsed with the last value winning (RFC 8259 §4), and the duplicate cannot be reported. Browser storage holds one package and one pinned baseline per browser origin; opening a second project replaces the package after confirmation, nothing merges two packages, and a replacement leaves the baseline exactly as it was pinned. A demonstration package is audited inside the page only and is never written to browser storage, so it can be the subject of a comparison and can never be pinned as a baseline. The baseline is the copy one user pinned in one browser; the page cannot know whether those bytes are the revision that was issued to anybody, so the label the user typed is the whole statement of what the pin stands for. Where one register holds one identifier twice, the per-section counts compare the first entry carrying that identifier while the item list compares occurrence with occurrence, so the two figures can differ on that section. A field comparison states that two values differ and not why: a number is compared as JSON writes it, so a quantity the writing tool rounded differently reads as a change that carries no engineering content. Strings are compared code unit by code unit, with no Unicode normalisation and no trimming, so one character written in two normal forms, and a value that gained a trailing space, both read as changes. An entry with no usable identifier is matched by its ordinal among the entries of its own array that have none, so inserting one such entry reads as a change of every later one. A value longer than 120 characters is shown clipped with the true length of both sides, so the page states that two long values differ and not where inside them. The storage quota of a browser origin cannot be read, so the size stated before pinning is the size of what is about to be written and carries no promise that the store will accept it.",
  "uk": "Перевірка охоплює лише ідентифікатори та перехресні посилання; вона не судить, чи вимога, значення в опитувальному листі або оцінка пропозиції технічно правильні. Посилання звіряються точною відповідністю рядків з урахуванням регістру, тож AHU-01 і ahu-01 — різні; близький збіг показано як підказку, а не як розв’язання. Звіряються лише поля власної карти посилань інструмента; поле поза нею, зокрема вільний текст і внутрішні ключі інструментів, не перевіряється. Карта посилань для тринадцяти реєстрів, доданих у вересні 2026, відповідає іменам полів TZ-engineering-workflow §2; реєстр, автор якого називає поле інакше, показано як такий, що не містить посилання в цьому полі, доки карту не оновлять. Перелік наступних кроків порівнює наявні секції з фіксованою таблицею стадій; він не може знати, що проєкт не має обсягу АСК чи електрики, тому ці реєстри позначено як умовні. Граф робочого процесу та смуга життєвого циклу беруться з каталогу і workflow-map.json; без мережі використано вбудований знімок із зазначенням його ревізії. Файл із дубльованим ключем JSON розбирається так, що перемагає останнє значення (RFC 8259 §4), і дублікат неможливо показати. Сховище браузера містить один пакет і одну закріплену базу порівняння на джерело; відкриття другого проєкту заміняє пакет після підтвердження, жодне злиття двох пакетів не виконується, а заміна залишає базу точно такою, якою її закріпили. Демонстраційний пакет перевіряється лише на сторінці й ніколи не записується до сховища браузера, тож він може бути предметом порівняння і його не можна закріпити як базу. База порівняння — копія, яку один користувач закріпив в одному браузері; сторінка не може знати, чи ці байти є ревізією, виданою комусь, тож підпис, який набрав користувач, і є цілим твердженням про те, що означає закріплення. Якщо реєстр містить один ідентифікатор двічі, посекційні кількості порівнюють перший запис із цим ідентифікатором, а перелік елементів порівнює входження з входженням, тож дві цифри для цієї секції можуть різнитися. Порівняння поля повідомляє, що два значення різні, а не чому: число порівнюють у тому вигляді, в якому його записує JSON, тож величина, округлена інструментом інакше, читається як зміна без інженерного змісту. Рядки порівнюють за кодовими одиницями, без нормалізації Unicode й без обрізання пробілів, тож один символ у двох нормальних формах і значення, що отримало кінцевий пробіл, обидва читаються як зміни. Запис без придатного ідентифікатора звіряють за його порядковим номером серед записів свого масиву, які теж його не мають, тож вставляння одного такого запису читається як зміна кожного наступного. Значення, довше за 120 символів, показано скороченим із справжньою довжиною обох боків, тож сторінка повідомляє, що два довгі значення різні, а не де саме в них. Квоту сховища джерела прочитати неможливо, тож розмір, названий перед закріпленням, — це розмір того, що буде записано, і він не обіцяє, що сховище це прийме.",
  "de": "Die Prüfung betrifft nur Kennungen und Querverweise; sie beurteilt nicht, ob eine Anforderung, ein Datenblattwert oder eine Angebotsbewertung technisch richtig ist. Verweise werden durch exakte, groß- und kleinschreibungsabhängige Zeichenkettengleichheit aufgelöst, also sind AHU-01 und ahu-01 verschieden; ein ähnlicher Treffer erscheint als Hinweis, nie als Auflösung. Aufgelöst werden nur die Felder der eigenen Verweiskarte des Werkzeugs; ein Feld außerhalb davon, auch Freitextnamen und werkzeuginterne Schlüssel, wird nicht geprüft. Die Verweiskarte für die dreizehn im September 2026 ergänzten Register folgt den Feldnamen von TZ-engineering-workflow §2; ein Register, dessen Schreiber ein Feld anders benennt, gilt als ohne Verweis in diesem Feld, bis die Karte nachgeführt ist. Die Liste der nächsten Schritte vergleicht die vorhandenen Abschnitte mit einer festen Stufentabelle; sie kann nicht wissen, dass ein Projekt keinen Leittechnik- oder Elektroumfang hat, daher stehen diese Register als bedingt. Workflow-Graph und Lebenszyklusband stammen aus dem Katalog und aus workflow-map.json; ohne Netz wird eine eingebettete Momentaufnahme verwendet und mit ihrer Revision benannt. Eine Datei mit doppeltem JSON-Schlüssel wird so gelesen, dass der letzte Wert gewinnt (RFC 8259 §4); das Duplikat kann nicht gemeldet werden. Der Browserspeicher hält ein Paket und eine angeheftete Vergleichsbasis je Origin; das Öffnen eines zweiten Projekts ersetzt das Paket nach Bestätigung, nichts führt zwei Pakete zusammen, und ein Ersetzen lässt die Vergleichsbasis genau so, wie sie angeheftet wurde. Ein Demonstrationspaket wird nur in der Seite geprüft und nie in den Browserspeicher geschrieben; es kann daher Gegenstand eines Vergleichs sein und niemals als Vergleichsbasis angeheftet werden. Die Vergleichsbasis ist die Kopie, die ein Benutzer in einem Browser angeheftet hat; die Seite kann nicht wissen, ob diese Bytes die Revision sind, die irgendjemandem ausgegeben wurde, daher ist die vom Benutzer eingegebene Bezeichnung die gesamte Aussage darüber, wofür die Anheftung steht. Hält ein Register eine Kennung zweimal, vergleichen die Abschnittszahlen den ersten Eintrag mit dieser Kennung, während die Elementliste Vorkommen mit Vorkommen vergleicht, sodass die beiden Zahlen in diesem Abschnitt abweichen können. Ein Feldvergleich sagt, dass zwei Werte sich unterscheiden, und nicht warum: eine Zahl wird so verglichen, wie JSON sie schreibt, sodass eine vom schreibenden Werkzeug anders gerundete Größe als Änderung ohne technischen Inhalt erscheint. Zeichenketten werden Codeeinheit für Codeeinheit verglichen, ohne Unicode-Normalisierung und ohne Beschneiden, sodass ein Zeichen in zwei Normalformen und ein Wert mit neuem Leerzeichen am Ende beide als Änderungen erscheinen. Ein Eintrag ohne brauchbare Kennung wird über seine Ordnungszahl unter den Einträgen seines eigenen Arrays ohne Kennung zugeordnet, sodass das Einfügen eines solchen Eintrags als Änderung jedes späteren erscheint. Ein Wert über 120 Zeichen wird gekürzt gezeigt, mit der wahren Länge beider Seiten, sodass die Seite sagt, dass zwei lange Werte sich unterscheiden, und nicht wo darin. Das Speicherkontingent eines Origins ist nicht lesbar, daher ist die vor dem Anheften genannte Größe die Größe des zu Schreibenden und kein Versprechen, dass der Speicher sie annimmt.",
  "nl": "De controle betreft alleen identificaties en kruisverwijzingen; zij beoordeelt niet of een eis, een databladwaarde of een aanbiedingsbeoordeling technisch juist is. Verwijzingen worden opgelost door exacte, hoofdlettergevoelige tekenreeksgelijkheid, dus AHU-01 en ahu-01 zijn verschillend; een bijna-treffer verschijnt als hint, nooit als oplossing. Alleen de velden van de eigen verwijzingskaart van de tool worden opgelost; een veld daarbuiten, inclusief vrije tekst en tool-interne sleutels, wordt niet gecontroleerd. De verwijzingskaart voor de dertien in september 2026 toegevoegde registers volgt de veldnamen van TZ-engineering-workflow §2; een register waarvan de schrijver een veld anders noemt, geldt als zonder verwijzing in dat veld totdat de kaart is bijgewerkt. De lijst met volgende stappen vergelijkt de aanwezige secties met een vaste fasetabel; zij kan niet weten dat een project geen regeltechnische of elektrische scope heeft, dus die registers staan als voorwaardelijk. De workflowgraaf en de levenscyclusbalk komen uit de catalogus en workflow-map.json; zonder netwerk wordt een ingebouwde momentopname gebruikt, met vermelding van haar revisie. Een bestand met een dubbele JSON-sleutel wordt zo gelezen dat de laatste waarde wint (RFC 8259 §4); het duplicaat kan niet worden gemeld. De browseropslag bevat één pakket en één vastgezette vergelijkingsbasis per origin; het openen van een tweede project vervangt het pakket na bevestiging, niets voegt twee pakketten samen, en een vervanging laat de vergelijkingsbasis precies zoals zij is vastgezet. Een demonstratiepakket wordt alleen in de pagina gecontroleerd en nooit naar de browseropslag geschreven; het kan dus onderwerp van een vergelijking zijn en nooit als vergelijkingsbasis worden vastgezet. De vergelijkingsbasis is de kopie die één gebruiker in één browser heeft vastgezet; de pagina kan niet weten of die bytes de revisie zijn die aan iemand is uitgegeven, dus de aanduiding die de gebruiker typte is de hele uitspraak over waar de vastzetting voor staat. Houdt één register één identificatie tweemaal, dan vergelijken de sectieaantallen de eerste vermelding met die identificatie terwijl de itemlijst voorkomen met voorkomen vergelijkt, zodat de twee getallen in die sectie kunnen verschillen. Een veldvergelijking zegt dat twee waarden verschillen en niet waarom: een getal wordt vergeleken zoals JSON het schrijft, zodat een grootheid die de schrijvende tool anders afrondde leest als een wijziging zonder technische inhoud. Tekenreeksen worden code-eenheid voor code-eenheid vergeleken, zonder Unicode-normalisatie en zonder trimmen, zodat één teken in twee normaalvormen en een waarde met een extra spatie aan het eind beide als wijzigingen lezen. Een vermelding zonder bruikbare identificatie wordt gekoppeld op haar rangnummer onder de vermeldingen van haar eigen array zonder identificatie, zodat het inzetten van zo’n vermelding leest als een wijziging van elke latere. Een waarde langer dan 120 tekens wordt afgekapt getoond met de werkelijke lengte van beide zijden, zodat de pagina zegt dat twee lange waarden verschillen en niet waar daarin. Het opslagquotum van een origin is niet leesbaar, dus de omvang die vóór het vastzetten wordt genoemd is de omvang van wat geschreven gaat worden en belooft niet dat de opslag die aanneemt.",
  "fr": "L’audit ne porte que sur les identifiants et les références croisées ; il ne juge pas si une exigence, une valeur de fiche technique ou une évaluation d’offre est techniquement correcte. Les références se résolvent par égalité exacte des chaînes, sensible à la casse, donc AHU-01 et ahu-01 diffèrent ; une correspondance approchante est affichée comme indice, jamais comme résolution. Seuls les champs de la carte de références de l’outil sont résolus ; un champ hors de cette carte, y compris les noms en texte libre et les clés internes d’un outil, n’est pas vérifié. La carte de références des treize registres ajoutés en septembre 2026 suit les noms de champs de TZ-engineering-workflow §2 ; un registre dont l’outil rédacteur nomme un champ autrement est signalé sans référence dans ce champ jusqu’à mise à jour de la carte. La liste des étapes suivantes compare les sections présentes à une table d’étapes fixe ; elle ne peut pas savoir qu’un projet n’a pas de périmètre contrôle-commande ou électrique, donc ces registres sont donnés comme conditionnels. Le graphe de flux de travail et la bande de cycle de vie proviennent du catalogue et de workflow-map.json ; hors réseau, un instantané intégré est utilisé et porte sa révision. Un fichier contenant une clé JSON en double est analysé en retenant la dernière valeur (RFC 8259 §4) ; le doublon ne peut pas être signalé. Le stockage du navigateur contient un dossier et une référence épinglée par origine ; ouvrir un second projet remplace le dossier après confirmation, rien ne fusionne deux dossiers, et un remplacement laisse la référence exactement telle qu’elle a été épinglée. Un dossier de démonstration est audité dans la page uniquement et n’est jamais écrit dans le stockage du navigateur : il peut être le sujet d’une comparaison et ne peut jamais être épinglé comme référence. La référence est la copie qu’un utilisateur a épinglée dans un navigateur ; la page ne peut savoir si ces octets sont la révision émise à quiconque, de sorte que le libellé saisi par l’utilisateur est tout l’énoncé de ce que l’épinglage représente. Lorsqu’un registre porte deux fois un même identifiant, les décomptes par section comparent la première entrée portant cet identifiant tandis que la liste des éléments compare occurrence par occurrence : les deux chiffres peuvent donc différer sur cette section. Une comparaison de champ dit que deux valeurs diffèrent et non pourquoi : un nombre est comparé tel que JSON l’écrit, de sorte qu’une grandeur arrondie autrement par l’outil rédacteur se lit comme une modification sans contenu technique. Les chaînes sont comparées unité de code par unité de code, sans normalisation Unicode et sans rognage : un même caractère écrit sous deux formes normales, et une valeur ayant gagné une espace finale, se lisent tous deux comme des modifications. Une entrée sans identifiant utilisable est appariée par son rang parmi les entrées sans identifiant de son propre tableau, de sorte qu’insérer une telle entrée se lit comme une modification de toutes les suivantes. Une valeur de plus de 120 caractères est affichée tronquée avec la longueur vraie des deux côtés : la page dit que deux valeurs longues diffèrent et non où à l’intérieur. Le quota de stockage d’une origine n’est pas lisible : la taille annoncée avant l’épinglage est celle de ce qui va être écrit et ne promet pas que le stockage l’acceptera.",
  "es": "La auditoría abarca solo identificadores y referencias cruzadas; no juzga si un requisito, un valor de hoja de datos o una evaluación de oferta es técnicamente correcto. Las referencias se resuelven por igualdad exacta de cadenas, sensible a mayúsculas, de modo que AHU-01 y ahu-01 son distintos; una coincidencia aproximada se muestra como pista, nunca como resolución. Solo se resuelven los campos del mapa de referencias propio de la herramienta; un campo fuera de él, incluidos nombres en texto libre y claves internas, no se comprueba. El mapa de referencias de los trece registros añadidos en septiembre de 2026 sigue los nombres de campo de TZ-engineering-workflow §2; un registro cuyo escritor nombra un campo de otro modo se informa como sin referencia en ese campo hasta que se actualice el mapa. La lista de pasos siguientes compara las secciones presentes con una tabla de etapas fija; no puede saber que un proyecto no tiene alcance de control ni eléctrico, de modo que esos registros figuran como condicionales. El grafo de flujo de trabajo y la banda de ciclo de vida proceden del catálogo y de workflow-map.json; sin red se usa una instantánea incorporada, rotulada con su revisión. Un archivo con una clave JSON duplicada se analiza reteniendo el último valor (RFC 8259 §4); el duplicado no puede informarse. El almacenamiento del navegador guarda un paquete y una línea base fijada por origen; abrir un segundo proyecto sustituye el paquete tras confirmación, nada fusiona dos paquetes, y una sustitución deja la línea base exactamente como se fijó. Un paquete de demostración se audita solo dentro de la página y nunca se escribe en el almacenamiento del navegador, así que puede ser el sujeto de una comparación y nunca puede fijarse como línea base. La línea base es la copia que un usuario fijó en un navegador; la página no puede saber si esos bytes son la revisión que se emitió a alguien, así que la etiqueta que escribió el usuario es todo el enunciado de lo que representa la fijación. Cuando un registro lleva dos veces un mismo identificador, los recuentos por sección comparan la primera entrada con ese identificador mientras que la lista de elementos compara aparición con aparición, de modo que las dos cifras pueden diferir en esa sección. Una comparación de campo dice que dos valores difieren y no por qué: un número se compara tal como JSON lo escribe, así que una magnitud que la herramienta redactora redondeó de otro modo se lee como un cambio sin contenido técnico. Las cadenas se comparan unidad de código por unidad de código, sin normalización Unicode y sin recorte, así que un mismo carácter escrito en dos formas normales, y un valor que ganó un espacio final, se leen ambos como cambios. Una entrada sin identificador utilizable se empareja por su ordinal entre las entradas sin identificador de su propio arreglo, así que insertar una de ellas se lee como un cambio de todas las posteriores. Un valor de más de 120 caracteres se muestra recortado con la longitud verdadera de ambos lados, así que la página dice que dos valores largos difieren y no dónde dentro de ellos. La cuota de almacenamiento de un origen no se puede leer, así que el tamaño indicado antes de fijar es el de lo que se va a escribir y no promete que el almacén lo acepte.",
  "pl": "Kontrola obejmuje wyłącznie identyfikatory i odsyłacze; nie ocenia, czy wymaganie, wartość w karcie danych lub ocena oferty są technicznie poprawne. Odsyłacze rozwiązywane są przez dokładną, rozróżniającą wielkość liter równość łańcuchów, więc AHU-01 i ahu-01 są różne; bliskie dopasowanie pokazywane jest jako podpowiedź, nigdy jako rozwiązanie. Rozwiązywane są wyłącznie pola własnej mapy odsyłaczy narzędzia; pole spoza niej, w tym nazwy w wolnym tekście i klucze wewnętrzne narzędzi, nie jest sprawdzane. Mapa odsyłaczy dla trzynastu rejestrów dodanych we wrześniu 2026 odwzorowuje nazwy pól z TZ-engineering-workflow §2; rejestr, którego narzędzie zapisujące nazywa pole inaczej, wykazywany jest jako pozbawiony odsyłacza w tym polu, dopóki mapa nie zostanie zaktualizowana. Lista kolejnych kroków porównuje obecne sekcje ze stałą tabelą etapów; nie może wiedzieć, że projekt nie obejmuje zakresu AKPiA ani elektrycznego, więc te rejestry podane są jako warunkowe. Graf przepływu pracy i pasmo cyklu życia pochodzą z katalogu oraz z workflow-map.json; bez sieci używana jest wbudowana migawka opisana swoją rewizją. Plik z powtórzonym kluczem JSON jest wczytywany tak, że wygrywa ostatnia wartość (RFC 8259 §4), a duplikatu nie da się zgłosić. Pamięć przeglądarki przechowuje jeden pakiet i jedną przypiętą bazę odniesienia na origin; otwarcie drugiego projektu zastępuje pakiet po potwierdzeniu, scalanie dwóch pakietów nie następuje, a zastąpienie pozostawia bazę dokładnie taką, jaką przypięto. Pakiet demonstracyjny jest kontrolowany wyłącznie na stronie i nigdy nie jest zapisywany w pamięci przeglądarki, więc może być przedmiotem porównania, a nigdy nie da się go przypiąć jako bazy. Baza odniesienia to kopia, którą jeden użytkownik przypiął w jednej przeglądarce; strona nie może wiedzieć, czy te bajty są rewizją wydaną komukolwiek, więc opis wpisany przez użytkownika jest całym stwierdzeniem tego, co przypięcie oznacza. Gdy rejestr zawiera jeden identyfikator dwa razy, liczby na sekcję porównują pierwszy wpis z tym identyfikatorem, a lista pozycji porównuje wystąpienie z wystąpieniem, więc obie liczby w tej sekcji mogą się różnić. Porównanie pola mówi, że dwie wartości się różnią, a nie dlaczego: liczbę porównuje się w postaci, w jakiej zapisuje ją JSON, więc wielkość zaokrąglona inaczej przez narzędzie zapisujące czyta się jako zmiana bez treści inżynierskiej. Łańcuchy porównywane są jednostka kodu po jednostce kodu, bez normalizacji Unicode i bez obcinania, więc jeden znak zapisany w dwóch postaciach normalnych oraz wartość, która zyskała spację na końcu, czytają się jako zmiany. Wpis bez użytecznego identyfikatora dopasowywany jest przez swój numer porządkowy wśród wpisów własnej tablicy, które też go nie mają, więc wstawienie takiego wpisu czyta się jako zmiana każdego późniejszego. Wartość dłuższa niż 120 znaków pokazywana jest skrócona wraz z prawdziwą długością obu stron, więc strona mówi, że dwie długie wartości się różnią, a nie gdzie w ich wnętrzu. Kwoty pamięci dla origin nie da się odczytać, więc rozmiar podany przed przypięciem jest rozmiarem tego, co ma być zapisane, i nie obiecuje, że pamięć to przyjmie."
 },

var TOOL_ID = 'projectworkspace';
var TOOL_FILE = 'projectworkspace.html';
/* Read from the manifest rather than repeated here: the benchmark artifact and
   every provenance entry this page's Attach writes carry this string, and a
   second copy of it goes stale the moment the manifest revision moves. */
var MANIFEST_REV = (function () {
  try {
    var el = document.getElementById('diagram-tool-manifest');
    var r = el && JSON.parse(el.textContent).manifest_revision;
    if (typeof r === 'string' && r) return r;
  } catch (e) {}
  return '2026-09-26.projectworkspace-6';
})();

function clone(o) { return JSON.parse(JSON.stringify(o)); }
var DEFAULTS = { v: 1, subject: 'storage', preset_id: null, baseline: 'none',
                 view: { graph_scope: 'package', severity_min: 'info', section_filter: '',
                         diff_detail: 'leaves', tab: 'overview' } };
var state = clone(DEFAULTS);

/* Everything below is runtime, never the permalink: the package itself must
   not enter a URL (TZ-project-package §1, AGENTS §2.5). */
var RT = {
  peek: null, peekTried: false, storageOk: true,
  inspected: null,           /* {doc, raw, bytes, at, ignored[]} after Inspect */
  changedElsewhere: false,
  preview: null,             /* transportDiff() result */
  previewAudit: null,
  confirmTick: false,
  map: null, mapSource: 'snapshot', titleSource: 'snapshot',
  message: '', messageTone: '',
  lastAudit: null, lastSubject: null, cacheKey: '', tick: 0,
  /* §3.6 — the pinned baseline. The header is read at boot; the document key is
     read and parsed only when a comparison is asked for (§7.2). */
  base: { header: null, headerBad: false, tried: false, absent: true, readThrew: false,
          doc: null, raw: null, bytes: null, parseError: '', loaded: false },
  baseFile: null,             /* {doc, raw, name, bom, error, bytes, key} */
  baseChanged: false,         /* another tab wrote one of the two baseline keys */
  baseFromLink: false,        /* a permalink asked for `baseline: pinned` */
  pinRefused: null,        /* {d, p} after PRO-R-078, until the next pin */
  lastPair: null, pairKey: ''
};
var ui = null, stageBox = null, fileBox = null;

function LANG() { return (ui && ui.lang) || (document.documentElement.lang || 'en').toLowerCase().split('-')[0]; }
function tx(o, lang) { var l = lang || LANG(); if (!o) return ''; if (typeof o === 'string') return o; return o[l] || o.en || ''; }
function narrow() { try { return !!(window.matchMedia && window.matchMedia('(max-width: 768px)').matches); } catch (e) { return false; } }

function PKG_OK() { return !!(window.DiagramProject && window.DiagramProject.api === 'tools.petrov.re/project-package/v1'); }
function PKt(k, vars) { return PKG_OK() ? DiagramProject.t(k, LANG(), vars || {}) : k; }
function secLabel(p) {
  if (p.indexOf('calculations.') === 0) return (PKG_OK() ? DiagramProject.sectionLabel('calculations', LANG()) : 'calculations') + ' · ' + p.slice(13);
  return PKG_OK() ? DiagramProject.sectionLabel(p, LANG()) : p;
}
function kindLabel(k) { return PKG_OK() ? DiagramProject.kindLabel(k, LANG()) : k; }
function toolTitle(id) { return RT.map ? toolLabel(RT.map, id, LANG()) : id; }
function sevWord(s) {
  return tx(s === 'blocker' ? UI.sevBlocker : s === 'major' ? UI.sevMajor : s === 'minor' ? UI.sevMinor : UI.sevInfo);
}
function verdictWord(v) {
  return tx(v === 'defective' ? UI.vDef : v === 'findings' ? UI.vFind : v === 'envelope_only' ? UI.vEnv
          : v === 'notes' ? UI.vNotes : v === 'consistent' ? UI.vCons : UI.vNo);
}
function verdictTone(v) {
  return v === 'defective' ? 'bad' : v === 'findings' ? 'bad' : v === 'notes' ? 'warn'
       : v === 'envelope_only' ? 'warn' : v === 'consistent' ? 'ok' : null;
}

/* ------------------------------------------------------- storage, read-only */
function rawStored() {
  try { return window.localStorage.getItem(STORAGE_KEY); } catch (e) { return undefined; }
}
function storageUsable() {
  if (!PKG_OK()) return false;
  var ok = true;
  try { ok = DiagramProject.storageOk(); } catch (e) { ok = false; }
  if (!ok) return false;
  return rawStored() !== undefined;
}
function refreshPeek() {
  RT.storageOk = storageUsable();
  try { RT.peek = PKG_OK() ? DiagramProject.peek() : null; } catch (e) { RT.peek = null; }
  RT.peekTried = true;
}

/* ------------------------------------------------------------- the subject */
function currentSubject() {
  if (state.subject === 'file' && RT.preview && RT.preview.ok) {
    return { kind: 'file', doc: RT.preview.incoming, label: tx(UI.sFile) };
  }
  if (state.subject === 'preset' && state.preset_id && PRESET_DOCS[state.preset_id]) {
    return { kind: 'preset', doc: PRESET_DOCS[state.preset_id], label: tx(UI.sPreset) + ' — ' + state.preset_id };
  }
  if (RT.inspected) return { kind: 'storage', doc: RT.inspected.doc, label: tx(UI.sStorage) };
  return { kind: 'none', doc: null, label: tx(UI.sStorage) };
}
function auditOf(subj) {
  var key = subj.kind + '|' + (state.preset_id || '') + '|' + RT.tick;
  if (RT.cacheKey === key && RT.lastAudit) return RT.lastAudit;
  RT.lastAudit = subj.doc ? audit(subj.doc) : null;
  RT.cacheKey = key;
  return RT.lastAudit;
}

/* --------------------------------------------------------- the workflow map */
function setMap(raw, source, titleSource) {
  RT.map = normaliseMap(raw, source);
  RT.mapSource = source;
  if (titleSource) RT.titleSource = titleSource;
  if (ui) { ui.sync(); ui.run(); }
}
function loadMap() {
  setMap(MAP_SNAPSHOT, 'snapshot', 'snapshot');
  if (!window.fetch || location.protocol === 'file:') return;
  fetch('workflow-map.json', { credentials: 'same-origin', cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) { if (isObj(j) && isObj(j.tools)) { var t = RT.titleSource; setMap(mergeTitles(j, MAP_SNAPSHOT), 'map file', t); } })
    .catch(function () {});
  fetch('catalog.php', { credentials: 'same-origin', cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) { applyCatalogue(j); })
    .catch(function () {});
}
function mergeTitles(live, snap) {
  var out = { revision: live.revision, stages: live.stages, stage_labels: live.stage_labels, entries: live.entries, tools: {} };
  Object.keys(live.tools).forEach(function (id) {
    var t = live.tools[id], s = (snap.tools && snap.tools[id]) || null;
    var c = { entry: t.entry, lifecycle: t.lifecycle, outputsTo: t.outputsTo, carries: t.carries,
              offer: t.offer, offer_reason: t.offer_reason };
    c.title = t.title || (s && s.title) || null;
    out.tools[id] = c;
  });

function doClear() {
  refreshPeek();
  if (!RT.storageOk) return;
  var raw = rawStored();
  if (raw === null || raw === undefined) return;
  var p = parsePackageText(raw), doc = p.ok ? p.doc : null;
  var a = doc ? audit(doc) : null;
  var ticked = false;
  ui.dialog({
    title: UI.bClear,
    body: function (box) {
      var p1 = document.createElement('p');
      p1.textContent = (doc ? (projectName(doc) || '—') : '—') + ' · '
        + (doc && doc.package_id ? doc.package_id : '—') + ' · '
        + tx(UI.hPkgRev) + ' ' + (doc && isInt(doc.package_revision) ? doc.package_revision : '—') + ' · '
        + tx(UI.kItems) + ' ' + (a ? a.items_total : 0) + ' · ' + raw.length + ' B';
      box.appendChild(p1);
      /* §3.6.4 — the pinned bytes can be the only copy of the issued revision in
         this browser, so Clear says in one line that it leaves them alone. */
      var p2 = document.createElement('p');
      p2.textContent = tx(UB.clearKeeps);
      box.appendChild(p2);
      var lab = document.createElement('label');
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.addEventListener('change', function () { ticked = cb.checked; });
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(' ' + tx(UI.fClearOk)));
      box.appendChild(lab);
    },
    actions: [
      { id: 'exp', label: UI.bExportFirst, run: function () { doExport(); } },
      { id: 'go', label: UI.bClear, variant: 'primary', run: function () {
          if (!ticked) { say(UI.fClearOk, 'bad'); return; }
          try { DiagramProject.clear(); } catch (e) {}
          refreshPeek();
          RT.inspected = null; RT.changedElsewhere = false; bump();
          say(RT.peek === null
            ? tx(T('Storage cleared.','Сховище очищено.','Speicher gelöscht.','Opslag gewist.','Stockage effacé.','Almacenamiento borrado.','Pamięć wyczyszczona.'))
            : tx(T('Storage was not cleared.','Сховище не очищено.','Der Speicher wurde nicht gelöscht.','De opslag is niet gewist.','Le stockage n’a pas été effacé.','El almacenamiento no se borró.','Pamięć nie została wyczyszczona.')),
            RT.peek === null ? 'ok' : 'bad');
        } },
      { id: 'no', label: UI.bCancel, run: function () {} }

  });
}
function openFileText(text) {
  refreshPeek();
  var raw = rawStored();
  var avail = RT.storageOk && raw !== undefined;
  var d = transportDiff(text, avail ? raw : null, avail);
  RT.preview = d;
  RT.previewAudit = d.ok ? audit(d.incoming) : null;
  RT.confirmTick = false;
  state.subject = d.ok ? 'file' : state.subject;
  if (narrow()) state.view.tab = 'transport';
  bump();
  say(d.rule + ' · ' + tx(RULE_TITLE[d.rule]) + (d.ok ? '' : (' — ' + d.error)), d.ok ? 'info' : 'bad');
}
function doDiscard() {
  RT.preview = null; RT.previewAudit = null; RT.confirmTick = false;
  state.subject = 'storage'; bump();
  if (ui) { ui.sync(); ui.run(); }
}
function replaceReady() {
  var p = RT.preview;
  if (!p || !p.ok) return false;
  if (p.replace === 'hidden' || p.replace === 'disabled') return false;
  if (p.replace === 'confirm' && !RT.confirmTick) return false;
  return true;
}
function doReplace() {
  var p = RT.preview;
  if (!replaceReady()) return;
  DiagramProject.importFile(p.text, { store: true }).then(function (res) {
    /* The runtime resolves {error:"schema"} without writing storage; that is a
       refusal, not the storage fault PRO-R-069 names (§5.2, §4.7 step 6). */
    if (res && res.error) {
      say(res.error === 'schema'
        ? ('PRO-R-001 \u00b7 ' + tx(RULE_TITLE['PRO-R-001']) + ' \u2014 ' + String(p.refused_schema))
        : tx(T('The file could not be read.','Файл не вдалося прочитати.','Die Datei konnte nicht gelesen werden.','Het bestand kon niet worden gelezen.','Le fichier n\u2019a pas pu \u00eatre lu.','No se pudo leer el archivo.','Nie uda\u0142o si\u0119 odczyta\u0107 pliku.')),
        'bad');
      return;
    }
    refreshPeek();
    var back = rawStored();
    var bp = back == null ? null : parsePackageText(back);
    if (!bp || !bp.ok || canon(bp.doc) !== canon(p.incoming)) {
      say('PRO-R-069 · ' + tx(RULE_TITLE['PRO-R-069']) + ' — ' + tx(UI.bExportFirst), 'bad');
      return;
    }
    RT.preview = null; RT.previewAudit = null; RT.confirmTick = false;
    doInspect();
    say(tx(T('Stored: ','Збережено: ','Gespeichert: ','Opgeslagen: ','Stocké : ','Almacenado: ','Zapisano: '))
      + (projectName(bp.doc) || bp.doc.package_id) + ' · ' + tx(UI.hPkgRev) + ' ' + bp.doc.package_revision, 'ok');
  }, function () {
    say('PRO-R-069 · ' + tx(RULE_TITLE['PRO-R-069']), 'bad');
  });
}

function storageLine() {
  if (!PKG_OK()) return '—';
  if (!RT.storageOk) return PKt('storageOff');
  if (!RT.peek) return PKt('none');
  var m = RT.peek;
  var id = isStr(m.package_id) ? m.package_id.slice(0, 8) : '—';
  return PKt('available', { project: m.project || '—', rev: m.revision, when: utcStamp(m.updated_at) })
       + ' · ' + id + (RT.inspected ? (' · ' + RT.inspected.bytes + ' B') : '');
}
function transportLine() {
  var p = RT.preview;
  if (!p) return '';
  if (!p.ok) return 'PRO-R-060 · ' + tx(RULE_TITLE['PRO-R-060']) + ' — ' + p.error;
  var bits = [p.rule + ' · ' + tx(RULE_TITLE[p.rule])];
  bits.push(tx(UI.sFile) + ': ' + (p.incoming_name || '—') + ' · ' + (p.incoming_id || '—')
    + ' · ' + tx(UI.hPkgRev) + ' ' + p.incoming_rev);
  if (p.stored) bits.push(tx(UI.sStorage) + ': ' + (p.stored_name || '—') + ' · ' + (p.stored_id || '—')
    + ' · ' + tx(UI.hPkgRev) + ' ' + p.stored_rev);
  if (p.bom) bits.push(tx(T('A byte order mark was stripped from the file.','З файла вилучено позначку порядку байтів.',
    'Eine Byte-Order-Marke wurde aus der Datei entfernt.','Een byte order mark is uit het bestand verwijderd.',
    'Une marque d’ordre des octets a été retirée du fichier.','Se eliminó una marca de orden de bytes del archivo.',
    'Z pliku usunięto znacznik kolejności bajtów.')));
  if (p.refused) bits.push(tx(T('The file is refused: its schema is ','Файл відхилено: його схема ','Die Datei wird abgelehnt: ihr Schema ist ','Het bestand is geweigerd: het schema is ','Le fichier est refus\u00e9 : son sch\u00e9ma est ','El archivo se rechaza: su esquema es ','Plik odrzucono: jego schemat to '))
    + (p.refused_schema === null ? tx(T('absent','відсутня','nicht vorhanden','afwezig','absent','ausente','brak')) : String(p.refused_schema))
    + tx(T('. Replace stays disabled.','. Заміну вимкнено.','. Ersetzen bleibt deaktiviert.','. Vervangen blijft uitgeschakeld.','. Le remplacement reste d\u00e9sactiv\u00e9.','. Reemplazar permanece desactivado.','. Zast\u0105pienie pozostaje wy\u0142\u0105czone.')));
  if (RT.previewAudit) bits.push(tx(UI.tFindings) + ': ' + RT.previewAudit.findings_blocker + ' / '
    + RT.previewAudit.findings_major + ' / ' + RT.previewAudit.findings_minor + ' / ' + RT.previewAudit.findings_info);
  return bits.join('  —  ');
}

function textPanel(def) {
  return {
    id: def.id, slot: 'inputs', title: def.title, actionsAlign: 'end', actions: def.actions,
    collapsible: def.collapsible || false, collapsed: def.collapsed || false,
    fields: def.fields || [],
    render: function (box, ctx, panel) {
      var p = document.createElement('p');
      p.className = 'dgu-hint';
      p.style.overflowWrap = 'anywhere';
      panel.__line = p;
      box.appendChild(p);
      p.textContent = def.text();
      if (def.drop) {
        box.addEventListener('dragover', function (e) { e.preventDefault(); });
        box.addEventListener('drop', function (e) {
          e.preventDefault();
          var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
          if (!f || !window.FileReader) return;
          var fr = new FileReader();
          var nm = f.name || '';
          fr.onload = function () {
            if (def.dropBaseline) openBaselineFileText(String(fr.result), nm);
            else openFileText(String(fr.result));
          };
          fr.readAsText(f);
        });
      }
    },
    sync: function (box, ctx, panel) { if (panel.__line) panel.__line.textContent = def.text(); }
  };
}

}

/* ======================================================= 3. the data layer */
var RLANG = '';
function rtx(o) { return tx(o, RLANG || LANG()); }

function buildRecord() {
  var subj = currentSubject(), a = auditOf(subj);
  var doc = subj.doc;
  var bytes = subj.kind === 'storage' && RT.inspected ? RT.inspected.bytes
            : (doc ? JSON.stringify(doc).length : 0);
  var out = {
    verdict: a ? a.verdict : 'no_package',
    paths_present: a ? a.paths_present : 0,
    items_total: a ? a.items_total : 0,
    calc_keys: a ? a.calc_keys : 0,
    findings_blocker: a ? a.findings_blocker : 0,
    findings_major: a ? a.findings_major : 0,
    findings_minor: a ? a.findings_minor : 0,
    findings_info: a ? a.findings_info : 0,
    refs_checked: a ? a.refs_checked : 0,
    refs_resolved: a ? a.refs_resolved : 0,
    refs_unset: a ? a.refs_unset : 0,
    flags_total: a ? a.flags_total : 0,
    flags_resolved: a ? a.flags_resolved : 0,
    flags_orphan: a ? a.flags_orphan : 0,
    next_required: a ? a.next_required : 0,
    next_conditional: a ? a.next_conditional : 0,
    per_rule: a ? a.per_rule : {},
    sections: a ? a.sections.map(function (s) {
      return { path: s.path, present: s.present, items: s.items, owner: s.owner, prov_tool: s.prov_tool,
               prov_tool_revision: s.prov_tool_revision, prov_written_at: s.prov_written_at,
               prov_revision: s.prov_revision, flags: s.flags, flags_orphan: s.flags_orphan };
    }) : [],
    findings: a ? a.findings.map(function (f) {
      return { rule: f.rule, severity: f.severity, path: f.path, index: f.index, field: f.field,
               value: f.value, target: f.target };
    }) : [],
    next_steps: a ? a.next_steps.slice() : [],
    transport: RT.preview ? {
      rule: RT.preview.rule, replace: RT.preview.replace,
      incoming_id: RT.preview.incoming_id || '', incoming_revision: RT.preview.incoming_rev,
      stored_id: RT.preview.stored_id || '', stored_revision: RT.preview.stored_rev,
      diff: RT.preview.diff.slice()
    } : null,
    unknown_top_level_keys: a ? a.unknown_keys.slice() : [],
    /* §3.5 — §4.11's result. No cap on the rows: the record carries every leaf
       change and the full id lists whatever the screen and the sheet print. */
    baseline: baselineRecord()
  };
  var G = RT.map ? graphModel(RT.map, a, state.view.graph_scope) : null;
  if (G) { out.graph_nodes = G.nodes; out.graph_lit = G.lit; out.graph_edges_by_carries = G.edges_by_carries;
           if (G.offers_known) out.graph_edges_offered = G.edges_offered; }
  return {
    inputs: {
      subject: subj.kind, preset_id: state.preset_id || '',
      severity_min: state.view.severity_min, section_filter: state.view.section_filter,
      graph_scope: state.view.graph_scope,
      baseline: state.baseline, diff_detail: state.view.diff_detail,
      schema: doc && isStr(doc.schema) ? doc.schema : '',
      package_id: doc && isStr(doc.package_id) ? doc.package_id : '',
      package_revision: doc && isInt(doc.package_revision) ? doc.package_revision : null,
      document_bytes: bytes,
      workflow_map_revision: RT.map ? RT.map.revision : '',
      workflow_map_source: RT.mapSource
    },
    outputs: out,
    units: {},
    model: {
      equations: [],
      ranges: ['identifier resolution by exact, case-sensitive string equality',
               'counts only; no arithmetic model and no score'],
      notes: ['consistency audit of tools.petrov.re/project-package/v1 as TZ-project-package and TZ-engineering-workflow define it',
              'this page writes none of the registers it audits; Attach to project files this record under calculations.projectworkspace'],
      references: ['_docs/TZ-project-package.md', 'TZ-engineering-workflow.md',
                   'RFC 8259 (2017) §4, §8.1', 'RFC 3339 (2002) §5.1, §5.6', 'RFC 9562 (2024) §5.4']
    },
    warnings: a ? a.findings.filter(function (f) { return f.severity === 'blocker' || f.severity === 'major'; })
                   .slice(0, 50).map(function (f) { return f.rule + ' ' + f.where; }) : []
  };
}

/* §3.5 the record block, §13.5 the graded keys. `null` only where there is no
   subject to compare; a relation that ran no comparison keeps its rule. */
function baselineRecord() {
  var pair = currentPair();
  if (!pair) return null;
  return {
    rule: pair.rule, source: pair.source, label: pair.label, pinned_at: pair.pinned_at,
    package_id: pair.package_id, package_revision: pair.package_revision, bytes: pair.bytes,
    compared: pair.compared, extra_rules: pairExtraRules(pair),
    sections_changed: pair.sections_changed, items_added: pair.items_added,
    items_removed: pair.items_removed, items_changed: pair.items_changed,
    leaf_changes: pair.leaf_changes,
    sections: pair.sections.map(function (r) {
      return { path: r.path, reordered: r.reordered, ids_added: r.ids_added.slice(), ids_removed: r.ids_removed.slice(),
               ids_changed: r.ids_changed.slice(), unkeyed_added: r.unkeyed_added,
               unkeyed_removed: r.unkeyed_removed, unkeyed_changed: r.unkeyed_changed,
               items_added: r.items_added, items_removed: r.items_removed, items_changed: r.items_changed,
               leaf_changes: r.leaf_changes };
    }),
    leaves: pair.leaves.map(function (r) {
      return { section: r.section, item: r.item, path: r.path, change: r.change,
               before: r.before, after: r.after,
               before_length: r.before_length, after_length: r.after_length, clipped: r.clipped };
    })
  };
}

/* §11 — the report block, first in `sections` so the engine prints it after the
   checks cards and ahead of appendix A. It is the one place the item and the leaf
   level are printed in full; appendix E stays a count per section. */
function changesBlock(pair) {
  if (!pair) return null;
  var v = {
    label: pair.label || '\u2014',
    b: pair.package_revision == null ? '\u2014' : pair.package_revision,
    s: pair.subject_package_revision == null ? '\u2014' : pair.subject_package_revision,
    bn: pair.baseline_project || '\u2014', sn: projectName(RT.lastSubject && RT.lastSubject.doc) || '\u2014',
    bid: pair.package_id || '\u2014', sid: pair.subject_package_id || '\u2014',
    err: pair.parse_error || '\u2014'
  };
  var head = pair.rule + ' \u00b7 ' + rtx(BASE_SENT[pair.rule](v)) + ' ' + rtx(BASE_ACT[pair.rule]);
  if (!pair.compared) return { title: rtx(UB.tChanges), text: head };
  var counts = countLine(pair, RLANG || 'en');
  if (!pair.sections.length) return { title: rtx(UB.tChanges), text: head + ' ' + rtx(UB.eSame) };
  var blocks = [{
    title: rtx(UB.tChanges), text: head + ' ' + counts,
    head: [rtx(UI.hSection), rtx(UB.hAddedIds), rtx(UB.hRemovedIds), rtx(UB.hChangedIds), rtx(UB.hUnkeyed), rtx(UB.hLeafChg)],
    rows: pair.sections.map(function (r) {
      return [sectionCellLabel(r.path) + (r.reordered ? ' \u00b7 \u21c5' : ''), r.ids_added.join(', ') || '\u2014', r.ids_removed.join(', ') || '\u2014',
              r.ids_changed.join(', ') || '\u2014',
              '+' + r.unkeyed_added + ' \u2212' + r.unkeyed_removed + ' \u0394' + r.unkeyed_changed,
              String(r.leaf_changes)];
    })
  }];
  if (pair.leaves.length) {
    var shown = pair.leaves.slice(0, CAP_REPORT), foot = [];
    if (pair.leaves.length > CAP_REPORT) foot.push(rtx(baseCapReport(CAP_REPORT, pair.leaves.length)));
    /* the note column is printed only where a row carries one: a column of
       dashes states nothing the reader cannot see from the two values */
    var anyNote = shown.some(function (r) { return !!leafReason(r, RLANG || 'en'); });
    blocks.push({
      title: rtx(UB.tLeaves),
      head: [rtx(UB.hLeaf), rtx(UB.hChange), rtx(UB.hBefore), rtx(UB.hAfter)].concat(anyNote ? [rtx(UB.hNote)] : []),
      rows: shown.map(function (r) {
        var row = [r.path, changeWord(r.change, RLANG || 'en'),
                   leafCell(r.before, r.before_type), leafCell(r.after, r.after_type)];
        if (anyNote) row.push(leafReason(r, RLANG || 'en') || '\u2014');
        return row;
      }),
      notes: foot
    });
  }
  return blocks;
}

function reportProfile(rec, ctx) {
  RLANG = (ctx && (ctx.domainLang || ctx.lang)) || '';
  var subj = currentSubject(), a = auditOf(subj), doc = subj.doc;
  var o = rec.outputs;
  var strip = RT.map ? lifecycleStrip(RT.map, a) : [];
  var G = RT.map ? graphModel(RT.map, a, state.view.graph_scope) : null;
  var figs = [];
  if (G) {
    /* The dash sentence is printed only when a withheld edge is on the sheet;
       with none drawn it described something the reader could not find. */
    var gLabels = graphLabelsFit(G);
    var f1 = ctx.figure(graphSvg(G, RT.map, RLANG || 'en'), {
      caption: rtx(UI.tGraph) + ' \u2014 ' + rtx(stagesLine(G.stages_used, G.stages_total))
             + (gLabels ? '' : ' ' + rtx(UI.gDots))
             + (G.edges_withheld ? ' ' + rtx(OFFER_DASH) : ''),
      alt: rtx(UI.kNodes) + ' ' + G.nodes + ', ' + rtx(UI.kLit) + ' ' + G.lit
         + (G.offers_known ? ', ' + rtx(UI.kOffer) + ' ' + G.edges_offered : '') });
    if (f1) figs.push(f1);
    var f2 = ctx.figure(stripSvg(strip, RT.map, RLANG || 'en'), {
      caption: rtx(UI.tStrip), alt: strip.map(function (r) { return r.stage + ' ' + r.written + '/' + r.total; }).join(', ') });
    if (f2) figs.push(f2);
  }
  var checks = [];
  AUDIT_RULES.forEach(function (r) {
    var n = o.per_rule[r] || 0;
    if (!n) return;
    var sev = RULE_SEV[r];
    var first = (a ? a.findings.filter(function (f) { return f.rule === r; }).slice(0, 3) : []);
    checks.push({
      status: sev === 'blocker' ? 'fail' : sev === 'major' ? 'attention' : 'info',
      title: rtx(RULE_TITLE[r]) + ' (' + r + ')',
      actual: String(n), criterion: '0', basis: RULE_BASIS[r] || 'author method',
      detail: first.map(function (f) { return f.where + (f.value === null ? '' : ' = ' + String(f.value)); }).join('; ')
    });
  });

  /* A head row over no data row prints as a grid of column names and nothing
     else; the sentence that replaces it carries the same information. */
  var appendices = [];
  var cpair = currentPair();
  var cblocks = changesBlock(cpair);
  if (cblocks) [].concat(cblocks).forEach(function (bk) { appendices.push(bk); });
  appendices.push(a ? {
    title: rtx(UI.tSections),
    head: [rtx(UI.hSection), rtx(UI.hPresent), rtx(UI.hItems), rtx(UI.hWriter), rtx(UI.hProvTool), rtx(UI.hProvRev), rtx(UI.hWritten), rtx(UI.hPkgRev), rtx(UI.hFlags)],
    rows: a.sections.map(function (s) {
      return [secLabel(s.path), s.present ? rtx(UI.yes) : rtx(UI.no), String(s.items),
              s.owner ? toolTitle(s.owner) : '—', s.prov_tool || '—', s.prov_tool_revision || '—',
              s.prov_written_at || '—', s.prov_revision == null ? '—' : String(s.prov_revision),
              String(s.flags) + (s.flags_orphan ? ' (' + s.flags_orphan + ')' : '')];
    })
  } : { title: rtx(UI.tSections), text: rtx(UI.eNoDoc) });
  var fall = a ? a.findings : [], fshow = fall.slice(0, 400);
  appendices.push(fshow.length ? {
    title: rtx(UI.tFindings),
    head: [rtx(UI.hRule), rtx(UI.hSeverity), rtx(UI.hWhere), rtx(UI.hValue), rtx(UI.hTarget)],
    rows: fshow.map(function (f) {
      return [f.rule, sevWord(f.severity), f.where || '—', f.value === null ? '—' : String(f.value), f.target || '—'];
    }),
    notes: fall.length > 400 ? [String(fall.length - 400) + ' …'] : []
  } : { title: rtx(UI.tFindings), text: rtx(a ? UI.eClean : UI.eNoFind) });
  if (a && a.flag_rows.length) appendices.push({
    title: rtx(UI.tFlags),
    head: [rtx(UI.hKind), rtx(UI.hTargetId), rtx(UI.hFlagWord), rtx(UI.hStatus), rtx(UI.hRaisedBy), rtx(UI.hRaisedAt)],
    rows: a.flag_rows.map(function (r) {
      var f = isObj(r.raw) ? r.raw : {};
      return [r.kind ? kindLabel(r.kind) : String(f.target_kind == null ? '—' : f.target_kind),
              String(f.target_id == null ? '—' : f.target_id), String(f.flag == null ? '—' : f.flag),
              r.state, String(f.raised_by == null ? '—' : f.raised_by), String(f.raised_at == null ? '—' : f.raised_at)];
    })
  });
  if (a && a.next_steps.length) appendices.push({
    title: rtx(UI.tNext),
    head: [rtx(UI.hStage), rtx(UI.hSection), rtx(UI.hKindStep), rtx(UI.hWriter)],
    rows: a.next_steps.map(function (s) {
      return [s.stage || '—', s.path, s.kind === 'identity' ? rtx(UI.identity) : s.kind === 'required' ? rtx(UI.required) : rtx(UI.conditional), toolTitle(s.writer)];
    })

function installData() {
  if (!window.Diagram) return;
  Diagram.init({
    id: TOOL_ID,
    file: TOOL_FILE,
    state: {
      /* §3.1 — the two fields added in 2026-09-26.1 lengthen the encoded state
         from 163 to 211 characters at the default, and the report engine prints
         the address itself on page one only at 200 characters or fewer
         (diagram-common PERMA_INLINE_MAX). Each of the two is therefore left out
         of the payload while it holds its default value, which puts the default
         state back at 163 characters; a state that carries either of them
         round-trips it, and a payload without them decodes to the default. */
      serialize: function () {
        var o = clone(state);
        if (o.baseline === DEFAULTS.baseline) delete o.baseline;
        if (o.view && o.view.diff_detail === DEFAULTS.view.diff_detail) delete o.view.diff_detail;
        return o;
      },
      deserialize: function (o) {
        if (!isObj(o)) return;
        if (o.v !== undefined && o.v !== 1) say(T('The permalink carries another state version; the defaults are used.',
          'Постійне посилання має іншу версію стану; використано типові значення.',
          'Der Permalink trägt eine andere Zustandsversion; es gelten die Vorgaben.',
          'De permalink draagt een andere toestandsversie; de standaardwaarden worden gebruikt.',
          'Le permalien porte une autre version d’état ; les valeurs par défaut sont utilisées.',
          'El enlace permanente lleva otra versión de estado; se usan los valores por defecto.',
          'Odnośnik trwały niesie inną wersję stanu; użyto wartości domyślnych.'));
        if (o.v === 1) {
          if (o.subject === 'storage' || o.subject === 'preset') state.subject = o.subject;
          else if (o.subject === 'file') {
            state.subject = 'storage';
            say(T('A file under preview is not carried in a permalink; the stored package is shown.',
              'Файл у попередньому перегляді не переноситься постійним посиланням; показано збережений пакет.',

              'Een bestand in voorbeeld wordt niet in een permalink meegedragen; het opgeslagen pakket wordt getoond.',
              'Un fichier en aperçu n’est pas porté par un permalien ; le dossier stocké est affiché.',
              'Un archivo en vista previa no viaja en un enlace permanente; se muestra el paquete almacenado.',
              'Plik w podglądzie nie jest przenoszony odnośnikiem trwałym; pokazano zapisany pakiet.'));
          }
          if (o.preset_id === null || (isStr(o.preset_id) && PRESET_DOCS[o.preset_id])) state.preset_id = o.preset_id || null;
          else if (o.preset_id !== undefined) say(T('That demonstration package is not on this page.',
            'Такого демонстраційного пакета на цій сторінці немає.','Dieses Demonstrationspaket gibt es auf dieser Seite nicht.',
            'Dat demonstratiepakket staat niet op deze pagina.','Ce dossier de démonstration n’existe pas sur cette page.',
            'Ese paquete de demostración no está en esta página.','Tego pakietu demonstracyjnego nie ma na tej stronie.'));
          /* §3.1 — `baseline: file` is never restored, because the file is not in
             the URL; `pinned` decodes as it stands and raises PRO-R-079 when this
             browser holds no baseline. No label and no document byte is in a URL. */
          if (o.baseline === 'none' || o.baseline === 'pinned') {
            state.baseline = o.baseline;
            RT.baseFromLink = (o.baseline === 'pinned');
          } else if (o.baseline === 'file') {
            state.baseline = 'none';
            say(T('A baseline file is not carried in a permalink; no baseline is compared.',
              'Файл бази не переноситься постійним посиланням; порівняння з базою не виконується.',
              'Eine Vergleichsdatei wird nicht im Permalink geführt; es wird keine Basis verglichen.',
              'Een vergelijkingsbestand wordt niet in een permalink meegedragen; er wordt geen basis vergeleken.',
              'Un fichier de référence n’est pas porté par un permalien ; aucune référence n’est comparée.',
              'Un archivo de línea base no viaja en un enlace permanente; no se compara ninguna base.',
              'Plik bazy nie jest przenoszony odnośnikiem trwałym; nie porównuje się żadnej bazy.'));
          }
          if (isObj(o.view)) {
            if (o.view.graph_scope === 'package' || o.view.graph_scope === 'all') state.view.graph_scope = o.view.graph_scope;
            if (SEVERITY.indexOf(o.view.severity_min) >= 0) state.view.severity_min = o.view.severity_min;
            if (isStr(o.view.section_filter)) state.view.section_filter = o.view.section_filter;
            if (['summary', 'items', 'leaves'].indexOf(o.view.diff_detail) >= 0) state.view.diff_detail = o.view.diff_detail;

             + 'no arithmetic model for a script to reproduce, and the audited document is the exported package file itself.' };
