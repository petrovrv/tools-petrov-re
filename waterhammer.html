sité de la conduite doit être positive ou nulle.","es":"La rugosidad de la tubería no puede ser negativa.","pl":"Chropowatość rury nie może być ujemna."},{"en":"Viscoelastic wall thickness must be positive.","uk":"Товщина в’язкопружної стінки має бути додатною.","de":"Die viskoelastische Wanddicke muss positiv sein.","nl":"De visco-elastische wanddikte moet positief zijn.","fr":"L’épaisseur de paroi viscoélastique doit être positive.","es":"El espesor de pared viscoelástica debe ser positivo.","pl":"Grubość ścianki lepkosprężystej musi być dodatnia."},{"en":"Viscoelastic wall thickness must be smaller than the inside diameter.","uk":"Товщина в’язкопружної стінки має бути меншою за внутрішній діаметр.","de":"Die viskoelastische Wanddicke muss kleiner als der Innendurchmesser sein.","nl":"De visco-elastische wanddikte moet kleiner zijn dan de binnendiameter.","fr":"L’épaisseur de paroi viscoélastique doit être inférieure au diamètre intérieur.","es":"El espesor de pared viscoelástica debe ser menor que el diámetro interior.","pl":"Grubość ścianki lepkosprężystej musi być mniejsza od średnicy wewnętrznej."},{"en":"Viscoelastic constraint coefficient α must be in (0,2.5].","uk":"Коефіцієнт закріплення в’язкопружної стінки α має бути в (0,2.5].","de":"Der viskoelastische Einspannkoeffizient α muss in (0,2.5] liegen.","nl":"De visco-elastische inklemmingscoëfficiënt α moet in (0,2.5] liggen.","fr":"Le coefficient d’ancrage viscoélastique α doit être dans (0,2.5].","es":"El coeficiente de sujeción viscoelástico α debe estar en (0,2.5].","pl":"Współczynnik utwierdzenia lepkosprężystego α musi należeć do (0,2.5]."},{"en":"Pipe segments must be between 16 and 220.","uk":"Кількість сегментів труби має бути від 16 до 220.","de":"Die Rohrsegmente müssen zwischen 16 und 220 liegen.","nl":"Het aantal leidingsegmenten moet tussen 16 en 220 liggen.","fr":"Le nombre de segments doit être compris entre 16 et 220.","es":"Los segmentos de tubería deben estar entre 16 y 220.","pl":"Liczba odcinków rury musi wynosić od 16 do 220."},{"en":"Unknown pump transient model.","uk":"Невідома перехідна модель насоса.","de":"Unbekanntes transientes Pumpenmodell.","nl":"Onbekend transiënt pompmodel.","fr":"Modèle transitoire de pompe inconnu.","es":"Modelo transitorio de bomba desconocido.","pl":"Nieznany model nieustalony pompy."},{"en":"Pump reference flow and head must be positive.","uk":"Номінальні витрата й напір насоса мають бути додатними.","de":"Nennvolumenstrom und Nennförderhöhe der Pumpe müssen positiv sein.","nl":"Referentiedebiet en -opvoerhoogte van de pomp moeten positief zijn.","fr":"Le débit et la hauteur de référence de la pompe doivent être positifs.","es":"El caudal y la altura de referencia de la bomba deben ser positivos.","pl":"Znamionowe natężenie przepływu i wysokość podnoszenia pompy muszą być dodatnie."},{"en":"Pump shutoff head must be non-negative.","uk":"Напір насоса при нульовій витраті не може бути від’ємним.","de":"Die Nullförderhöhe der Pumpe darf nicht negativ sein.","nl":"De nuldebiet-opvoerhoogte van de pomp mag niet negatief zijn.","fr":"La hauteur à débit nul de la pompe doit être positive ou nulle.","es":"La altura a caudal nulo de la bomba no puede ser negativa.","pl":"Wysokość podnoszenia przy zerowym przepływie nie może być ujemna."},{"en":"Pump shutoff head should not be below reference head for this quadratic model.","uk":"Для цієї квадратичної моделі напір при нульовій витраті не повинен бути нижчим за номінальний.","de":"Für dieses quadratische Modell darf die Nullförderhöhe nicht unter der Nennförderhöhe liegen.","nl":"Voor dit kwadratische model mag de nuldebiet-opvoerhoogte niet onder de referentiehoogte liggen.","fr":"Pour ce modèle quadratique, la hauteur à débit nul ne doit pas être inférieure à la hauteur de référence.","es":"En este modelo cuadrático la altura a caudal nulo no debe ser inferior a la de referencia.","pl":"W tym modelu kwadratowym wysokość podnoszenia przy zerowym przepływie nie powinna być niższa od znamionowej."},{"en":"Final valve opening must be 0–100%.","uk":"Кінцеве відкриття клапана має бути 0–100%.","de":"Die Endöffnung des Ventils muss 0–100% betragen.","nl":"De eindopening van de klep moet 0–100% zijn.","fr":"L’ouverture finale de la vanne doit être de 0–100%.","es":"La apertura final de la válvula debe ser 0–100%.","pl":"Końcowe otwarcie zaworu musi wynosić 0–100%."},{"en":"Valve-event start time must be non-negative.","uk":"Час початку події клапана не може бути від’ємним.","de":"Die Startzeit des Ventilereignisses darf nicht negativ sein.","nl":"De starttijd van de klepgebeurtenis mag niet negatief zijn.","fr":"L’instant de début de la manœuvre doit être positif ou nul.","es":"El instante de inicio de la maniobra no puede ser negativo.","pl":"Czas początku manewru zaworu nie może być ujemny."},{"en":"Valve closure time must be non-negative.","uk":"Час закриття клапана не може бути від’ємним.","de":"Die Ventilschließzeit darf nicht negativ sein.","nl":"De sluitingstijd van de klep mag niet negatief zijn.","fr":"Le temps de fermeture de la vanne doit être positif ou nul.","es":"El tiempo de cierre de la válvula no puede ser negativo.","pl":"Czas zamykania zaworu nie może być ujemny."},{"en":"Unknown valve travel law.","uk":"Невідомий закон ходу клапана.","de":"Unbekanntes Ventilhubgesetz.","nl":"Onbekende klepslagwet.","fr":"Loi de course de vanne inconnue.","es":"Ley de carrera de válvula desconocida.","pl":"Nieznane prawo ruchu zaworu."},{"en":"Valve power exponent must be positive.","uk":"Показник степеневого закону клапана має бути додатним.","de":"Der Exponent des Ventil-Potenzgesetzes muss positiv sein.","nl":"De exponent van de klepmachtswet moet positief zijn.","fr":"L’exposant de la loi puissance de la vanne doit être positif.","es":"El exponente de la ley potencial de la válvula debe ser positivo.","pl":"Wykładnik potęgowego prawa zamykania musi być dodatni."},{"en":"Pump trip requires the pump to be initially in service.","uk":"Відключення насоса вимагає, щоб насос спочатку працював.","de":"Ein Pumpenausfall setzt eine anfangs laufende Pumpe voraus.","nl":"Pompuitval vereist dat de pomp aanvankelijk in bedrijf is.","fr":"L’arrêt de pompe suppose une pompe initialement en service.","es":"El disparo de bomba requiere que la bomba esté inicialmente en servicio.","pl":"Wyłączenie pompy wymaga, aby pompa początkowo pracowała."},{"en":"Pump trip time must be non-negative.","uk":"Час відключення насоса не може бути від’ємним.","de":"Der Pumpenausfallzeitpunkt darf nicht negativ sein.","nl":"Het tijdstip van pompuitval mag niet negatief zijn.","fr":"L’instant d’arrêt de la pompe doit être positif ou nul.","es":"El instante de disparo de la bomba no puede ser negativo.","pl":"Czas wyłączenia pompy nie może być ujemny."},{"en":"Pump coast-down time constant must be positive in quadratic mode.","uk":"Стала часу вибігу насоса має бути додатною в квадратичному режимі.","de":"Die Auslaufzeitkonstante der Pumpe muss im quadratischen Modus positiv sein.","nl":"De uitlooptijdconstante van de pomp moet positief zijn in kwadratische modus.","fr":"La constante de ralentissement de la pompe doit être positive en mode quadratique.","es":"La constante de desaceleración de la bomba debe ser positiva en modo cuadrático.","pl":"Stała czasowa wybiegu pompy musi być dodatnia w trybie kwadratowym."},{"en":"Unknown dynamic check-valve trigger.","uk":"Невідомий тригер динамічного зворотного клапана.","de":"Unbekannter Auslöser des dynamischen Rückschlagventils.","nl":"Onbekende trigger van de dynamische terugslagklep.","fr":"Déclencheur de clapet dynamique inconnu.","es":"Disparador de válvula de retención dinámica desconocido.","pl":"Nieznany wyzwalacz dynamicznego zaworu zwrotnego."},{"en":"Trip-triggered check-valve closure requires a pump-trip event.","uk":"Закриття зворотного клапана за відключенням насоса вимагає події відключення насоса.","de":"Ein durch Pumpenausfall ausgelöster Rückschlagventilschluss erfordert ein Pumpenausfall-Ereignis.","nl":"Sluiting van de terugslagklep bij pompuitval vereist een pompuitvalgebeurtenis.","fr":"La fermeture du clapet déclenchée par l’arrêt de pompe nécessite un arrêt de pompe.","es":"El cierre de la válvula de retención por disparo requiere un evento de disparo de bomba.","pl":"Zamknięcie zaworu zwrotnego wyzwalane wyłączeniem pompy wymaga zdarzenia wyłączenia pompy."},{"en":"Flow-reversal-triggered dynamic check closure with a pump in service requires Suter 4Q pump data; the quadratic pump model cannot represent the reverse flow that causes slam.","uk":"Динамічне закриття зворотного клапана за реверсом потоку при працюючому насосі вимагає даних Suter 4Q; квадратична модель насоса не відтворює зворотний потік, що спричиняє удар.","de":"Ein durch Strömungsumkehr ausgelöster dynamischer Rückschlagventilschluss bei laufender Pumpe erfordert Suter-4Q-Daten; das quadratische Pumpenmodell kann den Rückfluss, der den Schlag verursacht, nicht abbilden.","nl":"Dynamische sluiting van de terugslagklep bij stromingsomkering met een pomp in bedrijf vereist Suter-4Q-gegevens; het kwadratische pompmodel kan de terugstroming die de klap veroorzaakt niet weergeven.","fr":"La fermeture dynamique du clapet déclenchée par inversion d’écoulement avec une pompe en service nécessite des données Suter 4Q ; le modèle quadratique ne représente pas l’écoulement inverse qui cause le claquement.","es":"El cierre dinámico por inversión de flujo con una bomba en servicio requiere datos Suter 4Q; el modelo cuadrático de bomba no representa el flujo inverso que causa el golpe.","pl":"Dynamiczne zamknięcie zaworu zwrotnego wyzwalane odwróceniem przepływu przy pracującej pompie wymaga danych Suter 4Q; kwadratowy model pompy nie odwzorowuje przepływu wstecznego powodującego uderzenie."},{"en":"Check-valve delay must be non-negative.","uk":"Затримка зворотного клапана не може бути від’ємною.","de":"Die Verzögerung des Rückschlagventils darf nicht negativ sein.","nl":"De vertraging van de terugslagklep mag niet negatief zijn.","fr":"Le retard du clapet doit être positif ou nul.","es":"El retardo de la válvula de retención no puede ser negativo.","pl":"Opóźnienie zaworu zwrotnego nie może być ujemne."},{"en":"Check-valve closure time must be positive.","uk":"Час закриття зворотного клапана має бути додатним.","de":"Die Schließzeit des Rückschlagventils muss positiv sein.","nl":"De sluitingstijd van de terugslagklep moet positief zijn.","fr":"Le temps de fermeture du clapet doit être positif.","es":"El tiempo de cierre de la válvula de retención debe ser positivo.","pl":"Czas zamykania zaworu zwrotnego musi być dodatni."},{"en":"Unknown check-valve travel law.","uk":"Невідомий закон ходу зворотного клапана.","de":"Unbekanntes Hubgesetz des Rückschlagventils.","nl":"Onbekende slagwet van de terugslagklep.","fr":"Loi de course du clapet inconnue.","es":"Ley de carrera de la válvula de retención desconocida.","pl":"Nieznane prawo ruchu zaworu zwrotnego."},{"en":"Open check-valve head loss must be non-negative.","uk":"Втрата напору відкритого зворотного клапана не може бути від’ємною.","de":"Der Druckhöhenverlust des offenen Rückschlagventils darf nicht negativ sein.","nl":"Het drukhoogteverlies van de open terugslagklep mag niet negatief zijn.","fr":"La perte de charge du clapet ouvert doit être positive ou nulle.","es":"La pérdida de carga de la válvula de retención abierta no puede ser negativa.","pl":"Strata wysokości ciśnienia otwartego zaworu zwrotnego nie może być ujemna."},{"en":"Unknown check-valve model.","uk":"Невідома модель зворотного клапана.","de":"Unbekanntes Rückschlagventilmodell.","nl":"Onbekend terugslagklepmodel.","fr":"Modèle de clapet inconnu.","es":"Modelo de válvula de retención desconocido.","pl":"Nieznany model zaworu zwrotnego."},{"en":"Use auto, none, ideal or dynamic.","uk":"Використовуйте auto, none, ideal або dynamic.","de":"Verwenden Sie auto, none, ideal oder dynamic.","nl":"Gebruik auto, none, ideal of dynamic.","fr":"Utilisez auto, none, ideal ou dynamic.","es":"Use auto, none, ideal o dynamic.","pl":"Użyj auto, none, ideal lub dynamic."},{"en":"Surge-vessel location must lie inside the pipe.","uk":"Розташування зрівнювального резервуара має бути всередині труби.","de":"Die Lage des Windkessels muss innerhalb des Rohres liegen.","nl":"De positie van de windketel moet binnen de leiding liggen.","fr":"La position du réservoir anti-bélier doit être à l’intérieur de la conduite.","es":"La posición del calderín debe estar dentro de la tubería.","pl":"Położenie zbiornika powietrznego musi leżeć wewnątrz rury."},{"en":"Surge-vessel total volume must be positive.","uk":"Повний об’єм зрівнювального резервуара має бути додатним.","de":"Das Gesamtvolumen des Windkessels muss positiv sein.","nl":"Het totale volume van de windketel moet positief zijn.","fr":"Le volume total du réservoir anti-bélier doit être positif.","es":"El volumen total del calderín debe ser positivo.","pl":"Całkowita objętość zbiornika powietrznego musi być dodatnia."},{"en":"Initial surge-vessel gas fraction must be between 2% and 98%.","uk":"Початкова частка газу в зрівнювальному резервуарі має бути між 2% і 98%.","de":"Der anfängliche Gasanteil des Windkessels muss zwischen 2% und 98% liegen.","nl":"De initiële gasfractie van de windketel moet tussen 2% en 98% liggen.","fr":"La fraction de gaz initiale du réservoir anti-bélier doit être comprise entre 2% et 98%.","es":"La fracción inicial de gas del calderín debe estar entre 2% y 98%.","pl":"Początkowy udział gazu w zbiorniku powietrznym musi wynosić od 2% do 98%."},{"en":"Polytropic exponent must be 1.00–1.67.","uk":"Показник політропи має бути 1.00–1.67.","de":"Der Polytropenexponent muss 1.00–1.67 betragen.","nl":"De polytrope exponent moet 1.00–1.67 zijn.","fr":"L’exposant polytropique doit être compris entre 1.00 et 1.67.","es":"El exponente politrópico debe ser 1.00–1.67.","pl":"Wykładnik politropy musi wynosić 1.00–1.67."},{"en":"Surge-vessel connection length and ΣK must be non-negative.","uk":"Довжина приєднання зрівнювального резервуара та ΣK не можуть бути від’ємними.","de":"Anschlusslänge und ΣK des Windkessels dürfen nicht negativ sein.","nl":"Aansluitlengte en ΣK van de windketel mogen niet negatief zijn.","fr":"La longueur de raccordement du réservoir anti-bélier et ΣK doivent être positives ou nulles.","es":"La longitud de conexión del calderín y ΣK no pueden ser negativas.","pl":"Długość przyłącza zbiornika powietrznego i ΣK nie mogą być ujemne."},{"en":"Surge-vessel connection diameter must be positive.","uk":"Діаметр приєднання зрівнювального резервуара має бути додатним.","de":"Der Anschlussdurchmesser des Windkessels muss positiv sein.","nl":"De aansluitdiameter van de windketel moet positief zijn.","fr":"Le diamètre de raccordement du réservoir anti-bélier doit être positif.","es":"El diámetro de conexión del calderín debe ser positivo.","pl":"Średnica przyłącza zbiornika powietrznego musi być dodatnia."},{"en":"Air-valve location must lie inside the pipe.","uk":"Розташування повітряного клапана має бути всередині труби.","de":"Die Lage des Be-/Entlüftungsventils muss innerhalb des Rohres liegen.","nl":"De positie van de be-/ontluchter moet binnen de leiding liggen.","fr":"La position de la ventouse doit être à l’intérieur de la conduite.","es":"La posición de la ventosa debe estar dentro de la tubería.","pl":"Położenie zaworu napowietrzającego musi leżeć wewnątrz rury."},{"en":"Unknown air-valve model.","uk":"Невідома модель повітряного клапана.","de":"Unbekanntes Be-/Entlüftungsventilmodell.","nl":"Onbekend model be-/ontluchter.","fr":"Modèle de ventouse inconnu.","es":"Modelo de ventosa desconocido.","pl":"Nieznany model zaworu napowietrzającego."},{"en":"At least one finite air-valve orifice must be positive.","uk":"Принаймні один отвір скінченного повітряного клапана має бути додатним.","de":"Mindestens eine Öffnung des endlichen Be-/Entlüftungsventils muss positiv sein.","nl":"Minstens één opening van de eindige be-/ontluchter moet positief zijn.","fr":"Au moins un orifice de la ventouse finie doit être positif.","es":"Al menos un orificio de la ventosa finita debe ser positivo.","pl":"Co najmniej jeden otwór skończonego zaworu napowietrzającego musi być dodatni."},{"en":"Finite air-valve inlet and outlet diameters must both be positive.","uk":"Діаметри впуску й випуску скінченного повітряного клапана мають бути додатними.","de":"Einlass- und Auslassdurchmesser des endlichen Be-/Entlüftungsventils müssen beide positiv sein.","nl":"In- en uitlaatdiameter van de eindige be-/ontluchter moeten beide positief zijn.","fr":"Les diamètres d’entrée et de sortie de la ventouse finie doivent tous deux être positifs.","es":"Los diámetros de entrada y salida de la ventosa finita deben ser ambos positivos.","pl":"Średnice wlotu i wylotu skończonego zaworu napowietrzającego muszą być dodatnie."},{"en":"Air-valve discharge coefficient must be in (0,1].","uk":"Коефіцієнт витрати повітряного клапана має бути в (0,1].","de":"Der Ausflusskoeffizient des Be-/Entlüftungsventils muss in (0,1] liegen.","nl":"De afvoercoëfficiënt van de be-/ontluchter moet in (0,1] liggen.","fr":"Le coefficient de débit de la ventouse doit être dans (0,1].","es":"El coeficiente de descarga de la ventosa debe estar en (0,1].","pl":"Współczynnik wypływu zaworu napowietrzającego musi należeć do (0,1]."},{"en":"Air temperature must be between −50 and 100 °C.","uk":"Температура повітря має бути між −50 і 100 °C.","de":"Die Lufttemperatur muss zwischen −50 und 100 °C liegen.","nl":"De luchttemperatuur moet tussen −50 en 100 °C liggen.","fr":"La température de l’air doit être comprise entre −50 et 100 °C.","es":"La temperatura del aire debe estar entre −50 y 100 °C.","pl":"Temperatura powietrza musi wynosić od −50 do 100 °C."},{"en":"Duration must be at least one MOC step ({dt} s).","uk":"Тривалість має бути не меншою за один крок MOC ({dt} s).","de":"Die Dauer muss mindestens einen MOC-Schritt betragen ({dt} s).","nl":"De duur moet minstens één MOC-stap zijn ({dt} s).","fr":"La durée doit valoir au moins un pas MOC ({dt} s).","es":"La duración debe ser al menos un paso MOC ({dt} s).","pl":"Czas trwania musi obejmować co najmniej jeden krok MOC ({dt} s)."},{"en":"Run would require {n} steps.","uk":"Розрахунок потребував би {n} кроків.","de":"Der Lauf würde {n} Schritte erfordern.","nl":"De berekening zou {n} stappen vergen.","fr":"Le calcul nécessiterait {n} pas.","es":"El cálculo requeriría {n} pasos.","pl":"Obliczenie wymagałoby {n} kroków."},{"en":"Reduce duration or segment count.","uk":"Зменште тривалість або кількість сегментів.","de":"Dauer oder Segmentzahl verringern.","nl":"Verkort de duur of verminder het aantal segmenten.","fr":"Réduisez la durée ou le nombre de segments.","es":"Reduzca la duración o el número de segmentos.","pl":"Skróć czas trwania lub zmniejsz liczbę odcinków."},{"en":"Boundary equation became non-finite.","uk":"Граничне рівняння стало нескінченним.","de":"Die Randgleichung wurde nicht endlich.","nl":"De randvergelijking werd niet-eindig.","fr":"L’équation de bord est devenue non finie.","es":"La ecuación de contorno dejó de ser finita.","pl":"Równanie brzegowe przestało być skończone."},{"en":"Boundary equation has no continuous bracketed root near Q={q} m³/s (best residual {r} m).","uk":"Граничне рівняння не має неперервного обмеженого кореня поблизу Q={q} m³/s (найкраща нев’язка {r} m).","de":"Die Randgleichung hat keine stetige eingeschlossene Wurzel nahe Q={q} m³/s (bestes Residuum {r} m).","nl":"De randvergelijking heeft geen continue ingesloten wortel nabij Q={q} m³/s (beste residu {r} m).","fr":"L’équation de bord n’a pas de racine continue encadrée près de Q={q} m³/s (meilleur résidu {r} m).","es":"La ecuación de contorno no tiene raíz continua acotada cerca de Q={q} m³/s (mejor residuo {r} m).","pl":"Równanie brzegowe nie ma ciągłego pierwiastka w przedziale w pobliżu Q={q} m³/s (najlepsze residuum {r} m)."},{"en":"Initial operating point is inconsistent: only {h} m head remains across the outlet valve.","uk":"Початкова робоча точка неузгоджена: на вихідному клапані залишається лише {h} m напору.","de":"Der Anfangsbetriebspunkt ist inkonsistent: Am Auslassventil verbleiben nur {h} m Druckhöhe.","nl":"Het initiële werkpunt is inconsistent: over de uitlaatklep blijft slechts {h} m drukhoogte over.","fr":"Le point de fonctionnement initial est incohérent : il ne reste que {h} m de charge sur la vanne aval.","es":"El punto de operación inicial es incoherente: solo quedan {h} m de carga en la válvula de salida.","pl":"Początkowy punkt pracy jest niespójny: na zaworze wylotowym pozostaje tylko {h} m wysokości ciśnienia."},{"en":"Increase source/pump head, lower tailwater head or reduce Q₀.","uk":"Збільште напір джерела/насоса, знизьте напір нижнього б’єфа або зменште Q₀.","de":"Quellen-/Pumpenhöhe erhöhen, Unterwasserhöhe senken oder Q₀ verringern.","nl":"Verhoog de bron-/pomphoogte, verlaag de benedenwaterhoogte of verlaag Q₀.","fr":"Augmentez la charge de la source/pompe, abaissez la charge aval ou réduisez Q₀.","es":"Aumente la carga de la fuente/bomba, baje la carga aguas abajo o reduzca Q₀.","pl":"Zwiększ wysokość ciśnienia zasilania/pompy, obniż poziom wody dolnej lub zmniejsz Q₀."},{"en":"Vardy–Brown turbulent weighting requires initial Reynolds number between 2,000 and 1e8; current Re₀={re}.","uk":"Турбулентна вагова функція Vardy–Brown вимагає початкового числа Рейнольдса від 2,000 до 1e8; поточне Re₀={re}.","de":"Die turbulente Vardy–Brown-Gewichtung erfordert eine Anfangs-Reynoldszahl zwischen 2,000 und 1e8; aktuell Re₀={re}.","nl":"De turbulente Vardy–Brown-weging vereist een initieel Reynoldsgetal tussen 2,000 en 1e8; huidig Re₀={re}.","fr":"La pondération turbulente de Vardy–Brown exige un Reynolds initial entre 2,000 et 1e8 ; Re₀ actuel={re}.","es":"La ponderación turbulenta de Vardy–Brown requiere un Reynolds inicial entre 2,000 y 1e8; Re₀ actual={re}.","pl":"Turbulentna funkcja wagowa Vardy–Browna wymaga początkowej liczby Reynoldsa od 2,000 do 1e8; obecnie Re₀={re}."},{"en":"Smooth-wall Vardy–Brown is outside the guarded wall regime: Colebrook roughness share {p}% ({w:t}).","uk":"Vardy–Brown для гладкої стінки поза контрольованим режимом стінки: частка шорсткості Колбрука {p}% ({w}).","de":"Glattwandiges Vardy–Brown liegt außerhalb des abgesicherten Wandregimes: Colebrook-Rauheitsanteil {p}% ({w}).","nl":"Gladwandig Vardy–Brown valt buiten het bewaakte wandregime: Colebrook-ruwheidsaandeel {p}% ({w}).","fr":"Vardy–Brown en paroi lisse est hors du régime de paroi surveillé : part de rugosité de Colebrook {p}% ({w}).","es":"Vardy–Brown de pared lisa está fuera del régimen de pared vigilado: fracción de rugosidad de Colebrook {p}% ({w}).","pl":"Vardy–Brown dla ścianki gładkiej jest poza kontrolowanym reżimem ścianki: udział chropowatości Colebrooka {p}% ({w})."},{"en":"A corrected transitionally-rough 2007 kernel is not installed; use quasi-steady Darcy–Weisbach, or the fully-rough mode only when roughness dominance reaches 90%.","uk":"Виправлене ядро 2007 для перехідно-шорсткого режиму не встановлено; використовуйте квазістаціонарне Darcy–Weisbach або повністю шорсткий режим лише при домінуванні шорсткості від 90%.","de":"Ein korrigierter übergangsrauer Kernel von 2007 ist nicht installiert; quasi-stationäres Darcy–Weisbach verwenden oder den vollrauen Modus nur bei mindestens 90% Rauheitsdominanz.","nl":"Een gecorrigeerde overgangsruwe kernel uit 2007 is niet geïnstalleerd; gebruik quasi-stationair Darcy–Weisbach, of de volledig ruwe modus alleen bij ten minste 90% ruwheidsdominantie.","fr":"Un noyau 2007 corrigé pour le régime transitoirement rugueux n’est pas installé ; utilisez Darcy–Weisbach quasi stationnaire, ou le mode entièrement rugueux seulement si la rugosité domine à 90%.","es":"No hay instalado un núcleo 2007 corregido para el régimen transicionalmente rugoso; use Darcy–Weisbach cuasiestacionario, o el modo totalmente rugoso solo si la rugosidad domina al 90%.","pl":"Poprawione jądro 2007 dla reżimu przejściowo chropowatego nie jest zainstalowane; użyj quasi-ustalonego Darcy–Weisbacha albo trybu pełnej chropowatości tylko przy dominacji chropowatości od 90%."},{"en":"Fully-rough Vardy–Brown weighting requires turbulent initial Re between 4,000 and 1e8; current Re₀={re}.","uk":"Вагова функція Vardy–Brown для повністю шорсткої стінки вимагає турбулентного початкового Re від 4,000 до 1e8; поточне Re₀={re}.","de":"Die vollraue Vardy–Brown-Gewichtung erfordert ein turbulentes Anfangs-Re zwischen 4,000 und 1e8; aktuell Re₀={re}.","nl":"De volledig ruwe Vardy–Brown-weging vereist een turbulent initieel Re tussen 4,000 en 1e8; huidig Re₀={re}.","fr":"La pondération Vardy–Brown entièrement rugueuse exige un Re initial turbulent entre 4,000 et 1e8 ; Re₀ actuel={re}.","es":"La ponderación Vardy–Brown totalmente rugosa requiere un Re inicial turbulento entre 4,000 y 1e8; Re₀ actual={re}.","pl":"Funkcja wagowa Vardy–Browna dla pełnej chropowatości wymaga turbulentnej początkowej liczby Re od 4,000 do 1e8; obecnie Re₀={re}."},{"en":"Fully-rough Vardy–Brown coefficients are documented for 1e−6≤ε/D≤1e−2; current ε/D={x}.","uk":"Коефіцієнти Vardy–Brown для повністю шорсткої стінки задокументовані для 1e−6≤ε/D≤1e−2; поточне ε/D={x}.","de":"Die vollrauen Vardy–Brown-Koeffizienten sind für 1e−6≤ε/D≤1e−2 dokumentiert; aktuell ε/D={x}.","nl":"De volledig ruwe Vardy–Brown-coëfficiënten zijn gedocumenteerd voor 1e−6≤ε/D≤1e−2; huidig ε/D={x}.","fr":"Les coefficients Vardy–Brown entièrement rugueux sont documentés pour 1e−6≤ε/D≤1e−2 ; ε/D actuel={x}.","es":"Los coeficientes Vardy–Brown totalmente rugosos están documentados para 1e−6≤ε/D≤1e−2; ε/D actual={x}.","pl":"Współczynniki Vardy–Browna dla pełnej chropowatości są udokumentowane dla 1e−6≤ε/D≤1e−2; obecnie ε/D={x}."},{"en":"Fully-rough Vardy–Brown is outside the guarded asymptotic regime: Colebrook roughness share {p}% and χ={x}.","uk":"Vardy–Brown для повністю шорсткої стінки поза контрольованим асимптотичним режимом: частка шорсткості Колбрука {p}% і χ={x}.","de":"Vollraues Vardy–Brown liegt außerhalb des abgesicherten asymptotischen Regimes: Colebrook-Rauheitsanteil {p}% und χ={x}.","nl":"Volledig ruw Vardy–Brown valt buiten het bewaakte asymptotische regime: Colebrook-ruwheidsaandeel {p}% en χ={x}.","fr":"Vardy–Brown entièrement rugueux est hors du régime asymptotique surveillé : part de rugosité de Colebrook {p}% et χ={x}.","es":"Vardy–Brown totalmente rugoso está fuera del régimen asintótico vigilado: fracción de rugosidad de Colebrook {p}% y χ={x}.","pl":"Vardy–Brown dla pełnej chropowatości jest poza kontrolowanym reżimem asymptotycznym: udział chropowatości Colebrooka {p}% i χ={x}."},{"en":"The wall-regime guard requires ≥90% roughness-term dominance; transitionally rough unsteady weighting is intentionally not approximated.","uk":"Контроль режиму стінки вимагає домінування члена шорсткості ≥90%; нестаціонарна вагова функція для перехідно-шорсткого режиму навмисно не наближується.","de":"Die Wandregime-Prüfung verlangt ≥90% Dominanz des Rauheitsterms; eine instationäre Gewichtung für den Übergangsbereich wird bewusst nicht angenähert.","nl":"De wandregimecontrole vereist ≥90% dominantie van de ruwheidsterm; onstationaire weging voor het overgangsruwe regime wordt bewust niet benaderd.","fr":"Le contrôle du régime de paroi exige une dominance ≥90% du terme de rugosité ; la pondération instationnaire en régime transitoirement rugueux n’est volontairement pas approchée.","es":"El control del régimen de pared exige una dominancia ≥90% del término de rugosidad; la ponderación no estacionaria transicionalmente rugosa no se aproxima a propósito.","pl":"Kontrola reżimu ścianki wymaga dominacji członu chropowatości ≥90%; niestacjonarna funkcja wagowa dla reżimu przejściowo chropowatego celowo nie jest przybliżana."},{"en":"Zielke laminar weighting requires initial Reynolds number at or below 2,000; current Re₀={re}.","uk":"Ламінарна вагова функція Zielke вимагає початкового числа Рейнольдса не більше 2,000; поточне Re₀={re}.","de":"Die laminare Zielke-Gewichtung erfordert eine Anfangs-Reynoldszahl von höchstens 2,000; aktuell Re₀={re}.","nl":"De laminaire Zielke-weging vereist een initieel Reynoldsgetal van ten hoogste 2,000; huidig Re₀={re}.","fr":"La pondération laminaire de Zielke exige un Reynolds initial inférieur ou égal à 2,000 ; Re₀ actuel={re}.","es":"La ponderación laminar de Zielke requiere un Reynolds inicial de 2,000 como máximo; Re₀ actual={re}.","pl":"Laminarna funkcja wagowa Zielkego wymaga początkowej liczby Reynoldsa nie większej niż 2,000; obecnie Re₀={re}."},{"en":"Universal Zielke↔Vardy–Brown weighting requires initial Reynolds number between 0 and 1e8; current Re₀={re}.","uk":"Універсальна вагова функція Zielke↔Vardy–Brown вимагає початкового числа Рейнольдса від 0 до 1e8; поточне Re₀={re}.","de":"Die universelle Zielke↔Vardy–Brown-Gewichtung erfordert eine Anfangs-Reynoldszahl zwischen 0 und 1e8; aktuell Re₀={re}.","nl":"De universele Zielke↔Vardy–Brown-weging vereist een initieel Reynoldsgetal tussen 0 en 1e8; huidig Re₀={re}.","fr":"La pondération universelle Zielke↔Vardy–Brown exige un Reynolds initial entre 0 et 1e8 ; Re₀ actuel={re}.","es":"La ponderación universal Zielke↔Vardy–Brown requiere un Reynolds inicial entre 0 y 1e8; Re₀ actual={re}.","pl":"Uniwersalna funkcja wagowa Zielke↔Vardy–Brown wymaga początkowej liczby Reynoldsa od 0 do 1e8; obecnie Re₀={re}."},{"en":"Universal mode uses a smooth-wall turbulent branch, but the initial Colebrook roughness share is {p}% ({w:t}).","uk":"Універсальний режим використовує турбулентну гілку для гладкої стінки, але початкова частка шорсткості Колбрука {p}% ({w}).","de":"Der universelle Modus nutzt einen glattwandigen turbulenten Zweig, der anfängliche Colebrook-Rauheitsanteil beträgt aber {p}% ({w}).","nl":"De universele modus gebruikt een gladwandige turbulente tak, maar het initiële Colebrook-ruwheidsaandeel is {p}% ({w}).","fr":"Le mode universel utilise une branche turbulente en paroi lisse, mais la part de rugosité de Colebrook initiale est {p}% ({w}).","es":"El modo universal usa una rama turbulenta de pared lisa, pero la fracción inicial de rugosidad de Colebrook es {p}% ({w}).","pl":"Tryb uniwersalny używa gałęzi turbulentnej dla ścianki gładkiej, ale początkowy udział chropowatości Colebrooka wynosi {p}% ({w})."},{"en":"Use quasi-steady Darcy–Weisbach until a corrected transitionally-rough weighting implementation is available.","uk":"Використовуйте квазістаціонарне Darcy–Weisbach, доки не буде виправленої реалізації для перехідно-шорсткого режиму.","de":"Quasi-stationäres Darcy–Weisbach verwenden, bis eine korrigierte Gewichtung für den übergangsrauen Bereich verfügbar ist.","nl":"Gebruik quasi-stationair Darcy–Weisbach tot een gecorrigeerde implementatie voor het overgangsruwe regime beschikbaar is.","fr":"Utilisez Darcy–Weisbach quasi stationnaire jusqu’à ce qu’une pondération corrigée pour le régime transitoirement rugueux soit disponible.","es":"Use Darcy–Weisbach cuasiestacionario hasta que haya una ponderación corregida para el régimen transicionalmente rugoso.","pl":"Używaj quasi-ustalonego Darcy–Weisbacha, dopóki nie będzie poprawionej implementacji dla reżimu przejściowo chropowatego."},{"en":"Initial operating point reaches vapor pressure at elevation-profile vertex x={x} m (p_abs={p} kPa).","uk":"Початкова робоча точка досягає тиску насиченої пари у вершині профілю висот x={x} m (p_abs={p} kPa).","de":"Der Anfangsbetriebspunkt erreicht den Dampfdruck am Höhenprofil-Stützpunkt x={x} m (p_abs={p} kPa).","nl":"Het initiële werkpunt bereikt de dampdruk in hoogteprofielpunt x={x} m (p_abs={p} kPa).","fr":"Le point de fonctionnement initial atteint la pression de vapeur au sommet du profil x={x} m (p_abs={p} kPa).","es":"El punto de operación inicial alcanza la presión de vapor en el vértice del perfil x={x} m (p_abs={p} kPa).","pl":"Początkowy punkt pracy osiąga ciśnienie parowania w wierzchołku profilu x={x} m (p_abs={p} kPa)."},{"en":"Initial operating point reaches vapor pressure at x={x} m (p_abs={p} kPa).","uk":"Початкова робоча точка досягає тиску насиченої пари при x={x} m (p_abs={p} kPa).","de":"Der Anfangsbetriebspunkt erreicht den Dampfdruck bei x={x} m (p_abs={p} kPa).","nl":"Het initiële werkpunt bereikt de dampdruk bij x={x} m (p_abs={p} kPa).","fr":"Le point de fonctionnement initial atteint la pression de vapeur à x={x} m (p_abs={p} kPa).","es":"El punto de operación inicial alcanza la presión de vapor en x={x} m (p_abs={p} kPa).","pl":"Początkowy punkt pracy osiąga ciśnienie parowania przy x={x} m (p_abs={p} kPa)."},{"en":"Choose a physically single-phase initial state before starting the transient.","uk":"Перед запуском перехідного процесу оберіть фізично однофазний початковий стан.","de":"Vor dem Start des Transienten einen physikalisch einphasigen Anfangszustand wählen.","nl":"Kies een fysisch eenfasige begintoestand voordat u de transiënt start.","fr":"Choisissez un état initial physiquement monophasique avant de lancer le transitoire.","es":"Elija un estado inicial físicamente monofásico antes de iniciar el transitorio.","pl":"Przed uruchomieniem stanu nieustalonego wybierz fizycznie jednofazowy stan początkowy."},{"en":"Surge vessel and air valve resolve to the same grid node.","uk":"Зрівнювальний резервуар і повітряний клапан потрапляють в один вузол сітки.","de":"Windkessel und Be-/Entlüftungsventil fallen auf denselben Gitterknoten.","nl":"Windketel en be-/ontluchter vallen op dezelfde roosterknoop.","fr":"Le réservoir anti-bélier et la ventouse tombent sur le même nœud.","es":"El calderín y la ventosa caen en el mismo nodo de la malla.","pl":"Zbiornik powietrzny i zawór napowietrzający trafiają do tego samego węzła siatki."},{"en":"Move one device or increase segment count.","uk":"Перемістіть один пристрій або збільште кількість сегментів.","de":"Ein Gerät verschieben oder die Segmentzahl erhöhen.","nl":"Verplaats één apparaat of verhoog het aantal segmenten.","fr":"Déplacez un dispositif ou augmentez le nombre de segments.","es":"Mueva un dispositivo o aumente el número de segmentos.","pl":"Przesuń jedno urządzenie lub zwiększ liczbę odcinków."},{"en":"The initial state is below atmospheric pressure at the enabled air valve; the entered Q₀ is inconsistent with an open vacuum breaker.","uk":"Початковий стан нижчий за атмосферний тиск на ввімкненому повітряному клапані; введене Q₀ несумісне з відкритим вакуумним клапаном.","de":"Der Anfangszustand liegt am aktivierten Be-/Entlüftungsventil unter Atmosphärendruck; das eingegebene Q₀ ist mit einem offenen Belüfter unvereinbar.","nl":"De begintoestand ligt bij de ingeschakelde be-/ontluchter onder de atmosferische druk; de ingevoerde Q₀ is onverenigbaar met een open beluchter.","fr":"L’état initial est sous la pression atmosphérique à la ventouse activée ; le Q₀ saisi est incompatible avec un casse-vide ouvert.","es":"El estado inicial está por debajo de la presión atmosférica en la ventosa activada; el Q₀ introducido es incompatible con un rompedor de vacío abierto.","pl":"Stan początkowy jest poniżej ciśnienia atmosferycznego w włączonym zaworze napowietrzającym; podane Q₀ jest niezgodne z otwartym zaworem napowietrzającym."},{"en":"Initial absolute pressure at the surge vessel is at or below vapor pressure.","uk":"Початковий абсолютний тиск у зрівнювальному резервуарі не вищий за тиск насиченої пари.","de":"Der anfängliche Absolutdruck am Windkessel liegt auf oder unter dem Dampfdruck.","nl":"De initiële absolute druk bij de windketel ligt op of onder de dampdruk.","fr":"La pression absolue initiale au réservoir anti-bélier est inférieure ou égale à la pression de vapeur.","es":"La presión absoluta inicial en el calderín es igual o inferior a la presión de vapor.","pl":"Początkowe ciśnienie bezwzględne w zbiorniku powietrznym jest równe ciśnieniu parowania lub niższe."},{"en":"Reverse flow through the in-service pump begins at t={t} s (Q={q} m³/s).","uk":"Зворотний потік через працюючий насос починається при t={t} s (Q={q} m³/s).","de":"Rückfluss durch die laufende Pumpe beginnt bei t={t} s (Q={q} m³/s).","nl":"Terugstroming door de draaiende pomp begint bij t={t} s (Q={q} m³/s).","fr":"L’écoulement inverse à travers la pompe en service commence à t={t} s (Q={q} m³/s).","es":"El flujo inverso a través de la bomba en servicio comienza en t={t} s (Q={q} m³/s).","pl":"Przepływ wsteczny przez pracującą pompę zaczyna się przy t={t} s (Q={q} m³/s)."},{"en":"Quadratic pump mode is valid only for forward flow; use a check valve or Suter 4Q mode.","uk":"Квадратичний режим насоса чинний лише для прямого потоку; використовуйте зворотний клапан або режим Suter 4Q.","de":"Der quadratische Pumpenmodus gilt nur für Vorwärtsströmung; ein Rückschlagventil oder den Suter-4Q-Modus verwenden.","nl":"De kwadratische pompmodus geldt alleen voor voorwaartse stroming; gebruik een terugslagklep of de Suter-4Q-modus.","fr":"Le mode de pompe quadratique ne vaut qu’en écoulement direct ; utilisez un clapet ou le mode Suter 4Q.","es":"El modo cuadrático de bomba solo vale para flujo directo; use una válvula de retención o el modo Suter 4Q.","pl":"Kwadratowy tryb pompy obowiązuje tylko dla przepływu w przód; użyj zaworu zwrotnego lub trybu Suter 4Q."},{"en":"Suter rotor equation became non-finite at t={t} s.","uk":"Рівняння ротора Suter стало нескінченним при t={t} s.","de":"Die Suter-Rotorgleichung wurde bei t={t} s nicht endlich.","nl":"De Suter-rotorvergelijking werd niet-eindig bij t={t} s.","fr":"L’équation du rotor de Suter est devenue non finie à t={t} s.","es":"La ecuación del rotor de Suter dejó de ser finita en t={t} s.","pl":"Równanie wirnika Sutera przestało być skończone przy t={t} s."},{"en":"Suter rotor/pump coupling did not converge at t={t} s.","uk":"Зв’язок ротора/насоса Suter не збігся при t={t} s.","de":"Die Suter-Rotor/Pumpen-Kopplung konvergierte bei t={t} s nicht.","nl":"De Suter-koppeling rotor/pomp convergeerde niet bij t={t} s.","fr":"Le couplage rotor/pompe de Suter n’a pas convergé à t={t} s.","es":"El acoplamiento rotor/bomba de Suter no convergió en t={t} s.","pl":"Sprzężenie wirnik/pompa Sutera nie zbiegło się przy t={t} s."},{"en":"Surge-vessel/connection state has no physical root at t={t} s; vessel capacity, precharge or branch restriction limit reached.","uk":"Стан зрівнювального резервуара/приєднання не має фізичного кореня при t={t} s; досягнуто межі місткості, тиску заповнення або обмеження гілки.","de":"Der Zustand Windkessel/Anschluss hat bei t={t} s keine physikalische Wurzel; Grenze von Kapazität, Vorfülldruck oder Zweigdrosselung erreicht.","nl":"De toestand windketel/aansluiting heeft bij t={t} s geen fysische wortel; grens van capaciteit, voordruk of takvernauwing bereikt.","fr":"L’état réservoir anti-bélier/raccordement n’a pas de racine physique à t={t} s ; limite de capacité, de précharge ou de restriction de branche atteinte.","es":"El estado calderín/conexión no tiene raíz física en t={t} s; se alcanzó el límite de capacidad, precarga o restricción de la rama.","pl":"Stan zbiornik powietrzny/przyłącze nie ma fizycznego pierwiastka przy t={t} s; osiągnięto granicę pojemności, ciśnienia wstępnego lub dławienia gałęzi."},{"en":"Surge-vessel gas pressure reached vapor pressure at t={t} s; simultaneous surge-vessel/DVCM cavitation is not represented.","uk":"Тиск газу в зрівнювальному резервуарі досяг тиску насиченої пари при t={t} s; одночасна кавітація резервуар/DVCM не відтворюється.","de":"Der Gasdruck im Windkessel erreichte bei t={t} s den Dampfdruck; gleichzeitige Windkessel-/DVCM-Kavitation wird nicht abgebildet.","nl":"De gasdruk in de windketel bereikte de dampdruk bij t={t} s; gelijktijdige windketel/DVCM-cavitatie wordt niet weergegeven.","fr":"La pression du gaz du réservoir anti-bélier a atteint la pression de vapeur à t={t} s ; la cavitation simultanée réservoir/DVCM n’est pas représentée.","es":"La presión del gas del calderín alcanzó la presión de vapor en t={t} s; la cavitación simultánea calderín/DVCM no se representa.","pl":"Ciśnienie gazu w zbiorniku powietrznym osiągnęło ciśnienie parowania przy t={t} s; jednoczesna kawitacja zbiornik/DVCM nie jest odwzorowana."},{"en":"Invalid elevation row: {row}","uk":"Некоректний рядок профілю висот: {row}","de":"Ungültige Höhenprofil-Zeile: {row}","nl":"Ongeldige regel hoogteprofiel: {row}","fr":"Ligne de profil altimétrique invalide : {row}","es":"Fila de perfil de cotas no válida: {row}","pl":"Nieprawidłowy wiersz profilu rzędnych: {row}"},{"en":"Elevation chainage {x} m lies outside 0…L.","uk":"Пікетаж профілю {x} m лежить поза 0…L.","de":"Die Stationierung {x} m liegt außerhalb von 0…L.","nl":"De kettingmaat {x} m ligt buiten 0…L.","fr":"Le chaînage {x} m est hors de 0…L.","es":"La progresiva {x} m está fuera de 0…L.","pl":"Kilometraż {x} m leży poza 0…L."},{"en":"Elevation profile needs at least two unique x,z points.","uk":"Профіль висот потребує щонайменше двох унікальних точок x,z.","de":"Das Höhenprofil braucht mindestens zwei eindeutige x,z-Punkte.","nl":"Het hoogteprofiel heeft minstens twee unieke x,z-punten nodig.","fr":"Le profil altimétrique nécessite au moins deux points x,z distincts.","es":"El perfil de cotas necesita al menos dos puntos x,z únicos.","pl":"Profil rzędnych wymaga co najmniej dwóch różnych punktów x,z."},{"en":"Elevation profile must include endpoints at x=0 and x=L.","uk":"Профіль висот має містити кінцеві точки x=0 і x=L.","de":"Das Höhenprofil muss Endpunkte bei x=0 und x=L enthalten.","nl":"Het hoogteprofiel moet eindpunten bij x=0 en x=L bevatten.","fr":"Le profil altimétrique doit inclure les extrémités x=0 et x=L.","es":"El perfil de cotas debe incluir los extremos x=0 y x=L.","pl":"Profil rzędnych musi zawierać punkty końcowe x=0 i x=L."},{"en":"Suter table is not loaded.","uk":"Таблицю Suter не завантажено.","de":"Die Suter-Tabelle ist nicht geladen.","nl":"De Suter-tabel is niet geladen.","fr":"La table de Suter n’est pas chargée.","es":"La tabla de Suter no está cargada.","pl":"Tablica Sutera nie jest wczytana."},{"en":"Invalid Suter row: {row}","uk":"Некоректний рядок Suter: {row}","de":"Ungültige Suter-Zeile: {row}","nl":"Ongeldige Suter-regel: {row}","fr":"Ligne de Suter invalide : {row}","es":"Fila de Suter no válida: {row}","pl":"Nieprawidłowy wiersz Sutera: {row}"},{"en":"Suter table needs at least 8 unique angular points covering 0…360°.","uk":"Таблиця Suter потребує щонайменше 8 унікальних кутових точок у межах 0…360°.","de":"Die Suter-Tabelle braucht mindestens 8 eindeutige Winkelpunkte über 0…360°.","nl":"De Suter-tabel heeft minstens 8 unieke hoekpunten over 0…360° nodig.","fr":"La table de Suter nécessite au moins 8 points angulaires distincts couvrant 0…360°.","es":"La tabla de Suter necesita al menos 8 puntos angulares únicos en 0…360°.","pl":"Tablica Sutera wymaga co najmniej 8 różnych punktów kątowych w zakresie 0…360°."},{"en":"Suter table has an angular gap of {g}°; complete four-quadrant coverage is required.","uk":"Таблиця Suter має кутовий проміжок {g}°; потрібне повне чотириквадрантне покриття.","de":"Die Suter-Tabelle hat eine Winkellücke von {g}°; vollständige Vier-Quadranten-Abdeckung ist erforderlich.","nl":"De Suter-tabel heeft een hoekafstand van {g}°; volledige vierkwadrantendekking is vereist.","fr":"La table de Suter présente un écart angulaire de {g}° ; une couverture complète des quatre quadrants est requise.","es":"La tabla de Suter tiene un salto angular de {g}°; se requiere cobertura completa de los cuatro cuadrantes.","pl":"Tablica Sutera ma lukę kątową {g}°; wymagane jest pełne pokrycie czterech ćwiartek."},{"en":"Invalid viscoelastic creep row: {row}","uk":"Некоректний рядок повзучості: {row}","de":"Ungültige Kriech-Zeile: {row}","nl":"Ongeldige kruipregel: {row}","fr":"Ligne de fluage invalide : {row}","es":"Fila de fluencia no válida: {row}","pl":"Nieprawidłowy wiersz pełzania: {row}"},{"en":"Every Kelvin–Voigt retardation time τ must be positive.","uk":"Кожен час запізнення Kelvin–Voigt τ має бути додатним.","de":"Jede Kelvin–Voigt-Retardationszeit τ muss positiv sein.","nl":"Elke Kelvin–Voigt-retardatietijd τ moet positief zijn.","fr":"Chaque temps de retard de Kelvin–Voigt τ doit être positif.","es":"Cada tiempo de retardo de Kelvin–Voigt τ debe ser positivo.","pl":"Każdy czas opóźnienia Kelvina–Voigta τ musi być dodatni."},{"en":"Retarded compliance Jₖ must be non-negative.","uk":"Запізніла податливість Jₖ не може бути від’ємною.","de":"Die retardierte Nachgiebigkeit Jₖ darf nicht negativ sein.","nl":"De vertraagde compliantie Jₖ mag niet negatief zijn.","fr":"La complaisance retardée Jₖ doit être positive ou nulle.","es":"La flexibilidad retardada Jₖ no puede ser negativa.","pl":"Opóźniona podatność Jₖ nie może być ujemna."},{"en":"Viscoelastic wall needs at least one τ,Jₖ row.","uk":"В’язкопружна стінка потребує щонайменше одного рядка τ,Jₖ.","de":"Die viskoelastische Wand braucht mindestens eine τ,Jₖ-Zeile.","nl":"De visco-elastische wand heeft minstens één τ,Jₖ-regel nodig.","fr":"La paroi viscoélastique nécessite au moins une ligne τ,Jₖ.","es":"La pared viscoelástica necesita al menos una fila τ,Jₖ.","pl":"Ścianka lepkosprężysta wymaga co najmniej jednego wiersza τ,Jₖ."},{"en":"Viscoelastic wall is limited to 12 Kelvin–Voigt elements.","uk":"В’язкопружна стінка обмежена 12 елементами Kelvin–Voigt.","de":"Die viskoelastische Wand ist auf 12 Kelvin–Voigt-Elemente begrenzt.","nl":"De visco-elastische wand is beperkt tot 12 Kelvin–Voigt-elementen.","fr":"La paroi viscoélastique est limitée à 12 éléments de Kelvin–Voigt.","es":"La pared viscoelástica está limitada a 12 elementos de Kelvin–Voigt.","pl":"Ścianka lepkosprężysta jest ograniczona do 12 elementów Kelvina–Voigta."},{"en":"Duplicate Kelvin–Voigt retardation time τ={x} s.","uk":"Повторний час запізнення Kelvin–Voigt τ={x} s.","de":"Doppelte Kelvin–Voigt-Retardationszeit τ={x} s.","nl":"Dubbele Kelvin–Voigt-retardatietijd τ={x} s.","fr":"Temps de retard de Kelvin–Voigt en double τ={x} s.","es":"Tiempo de retardo de Kelvin–Voigt duplicado τ={x} s.","pl":"Powtórzony czas opóźnienia Kelvina–Voigta τ={x} s."},{"en":"Finite air-valve pocket equation has no physical root at t={t} s; enlarge the valve, refine the grid, or use a moving-interface model.","uk":"Рівняння порожнини скінченного повітряного клапана не має фізичного кореня при t={t} s; збільште клапан, згустіть сітку або використайте модель із рухомою межею.","de":"Die Polstergleichung des endlichen Be-/Entlüftungsventils hat bei t={t} s keine physikalische Wurzel; Ventil vergrößern, Gitter verfeinern oder ein Modell mit bewegter Grenzfläche verwenden.","nl":"De zakvergelijking van de eindige be-/ontluchter heeft bij t={t} s geen fysische wortel; vergroot de klep, verfijn het rooster of gebruik een model met bewegend grensvlak.","fr":"L’équation de poche de la ventouse finie n’a pas de racine physique à t={t} s ; agrandissez la ventouse, affinez la grille ou utilisez un modèle à interface mobile.","es":"La ecuación de la bolsa de la ventosa finita no tiene raíz física en t={t} s; agrande la ventosa, refine la malla o use un modelo de interfaz móvil.","pl":"Równanie poduszki skończonego zaworu napowietrzającego nie ma fizycznego pierwiastka przy t={t} s; powiększ zawór, zagęść siatkę lub użyj modelu z ruchomą granicą."},{"en":"Finite air-valve gas state became non-physical at t={t} s.","uk":"Стан газу скінченного повітряного клапана став нефізичним при t={t} s.","de":"Der Gaszustand des endlichen Be-/Entlüftungsventils wurde bei t={t} s unphysikalisch.","nl":"De gastoestand van de eindige be-/ontluchter werd onfysisch bij t={t} s.","fr":"L’état du gaz de la ventouse finie est devenu non physique à t={t} s.","es":"El estado del gas de la ventosa finita dejó de ser físico en t={t} s.","pl":"Stan gazu skończonego zaworu napowietrzającego stał się niefizyczny przy t={t} s."},{"en":"Finite air-valve node reached vapor pressure at t={t} s; a mixed air-vapor cavity is not represented.","uk":"Вузол скінченного повітряного клапана досяг тиску насиченої пари при t={t} s; змішана повітряно-парова порожнина не відтворюється.","de":"Der Knoten des endlichen Be-/Entlüftungsventils erreichte bei t={t} s den Dampfdruck; ein gemischter Luft-Dampf-Hohlraum wird nicht abgebildet.","nl":"De knoop van de eindige be-/ontluchter bereikte de dampdruk bij t={t} s; een gemengde lucht-dampholte wordt niet weergegeven.","fr":"Le nœud de la ventouse finie a atteint la pression de vapeur à t={t} s ; une cavité mixte air-vapeur n’est pas représentée.","es":"El nodo de la ventosa finita alcanzó la presión de vapor en t={t} s; no se representa una cavidad mixta aire-vapor.","pl":"Węzeł skończonego zaworu napowietrzającego osiągnął ciśnienie parowania przy t={t} s; mieszana kawerna powietrzno-parowa nie jest odwzorowana."},{"en":"Increase inlet capacity or use a dedicated mixed-cavity model.","uk":"Збільште пропускну здатність впуску або використайте окрему модель змішаної порожнини.","de":"Einlasskapazität erhöhen oder ein eigenes Modell für Mischhohlräume verwenden.","nl":"Verhoog de inlaatcapaciteit of gebruik een speciaal model voor gemengde holtes.","fr":"Augmentez la capacité d’admission ou utilisez un modèle dédié de cavité mixte.","es":"Aumente la capacidad de entrada o use un modelo específico de cavidad mixta.","pl":"Zwiększ przepustowość wlotu lub użyj dedykowanego modelu kawerny mieszanej."},{"en":"FSI eigenvector construction became singular.","uk":"Побудова власних векторів FSI стала виродженою.","de":"Die FSI-Eigenvektorkonstruktion wurde singulär.","nl":"De FSI-eigenvectorconstructie werd singulier.","fr":"La construction des vecteurs propres FSI est devenue singulière.","es":"La construcción de vectores propios FSI se volvió singular.","pl":"Konstrukcja wektorów własnych FSI stała się osobliwa."},{"en":"FSI characteristic matrix is singular.","uk":"Характеристична матриця FSI вироджена.","de":"Die FSI-Charakteristikenmatrix ist singulär.","nl":"De FSI-karakteristiekenmatrix is singulier.","fr":"La matrice caractéristique FSI est singulière.","es":"La matriz característica FSI es singular.","pl":"Macierz charakterystyczna FSI jest osobliwa."},{"en":"FSI material and geometry values must be positive.","uk":"Матеріальні та геометричні величини FSI мають бути додатними.","de":"FSI-Werkstoff- und Geometriewerte müssen positiv sein.","nl":"FSI-materiaal- en geometriewaarden moeten positief zijn.","fr":"Les valeurs de matériau et de géométrie FSI doivent être positives.","es":"Los valores de material y geometría FSI deben ser positivos.","pl":"Wartości materiałowe i geometryczne FSI muszą być dodatnie."},{"en":"FSI Poisson ratio must be in [0,0.5).","uk":"Коефіцієнт Пуассона FSI має бути в [0,0.5).","de":"Die FSI-Querkontraktionszahl muss in [0,0.5) liegen.","nl":"De FSI-Poissonverhouding moet in [0,0.5) liggen.","fr":"Le coefficient de Poisson FSI doit être dans [0,0.5).","es":"El coeficiente de Poisson FSI debe estar en [0,0.5).","pl":"Współczynnik Poissona FSI musi należeć do [0,0.5)."},{"en":"FSI wave-speed calculation is non-physical.","uk":"Розрахунок швидкостей хвиль FSI нефізичний.","de":"Die FSI-Wellengeschwindigkeitsberechnung ist unphysikalisch.","nl":"De FSI-golfsnelheidsberekening is onfysisch.","fr":"Le calcul des célérités FSI est non physique.","es":"El cálculo de celeridades FSI no es físico.","pl":"Obliczenie prędkości fal FSI jest niefizyczne."},{"en":"Invalid FSI support row: {row}","uk":"Некоректний рядок опори FSI: {row}","de":"Ungültige FSI-Lagerzeile: {row}","nl":"Ongeldige FSI-steunregel: {row}","fr":"Ligne d’appui FSI invalide : {row}","es":"Fila de apoyo FSI no válida: {row}","pl":"Nieprawidłowy wiersz podpory FSI: {row}"},{"en":"Intermediate FSI support chainage {x} m must lie strictly inside 0…L.","uk":"Пікетаж проміжної опори FSI {x} m має лежати строго всередині 0…L.","de":"Die Stationierung des FSI-Zwischenlagers {x} m muss echt innerhalb von 0…L liegen.","nl":"De kettingmaat van de FSI-tussensteun {x} m moet strikt binnen 0…L liggen.","fr":"Le chaînage de l’appui intermédiaire FSI {x} m doit être strictement dans 0…L.","es":"La progresiva del apoyo intermedio FSI {x} m debe estar estrictamente dentro de 0…L.","pl":"Kilometraż pośredniej podpory FSI {x} m musi leżeć ściśle wewnątrz 0…L."},{"en":"Intermediate FSI support stiffness must be non-negative.","uk":"Жорсткість проміжної опори FSI не може бути від’ємною.","de":"Die Steifigkeit des FSI-Zwischenlagers darf nicht negativ sein.","nl":"De stijfheid van de FSI-tussensteun mag niet negatief zijn.","fr":"La raideur de l’appui intermédiaire FSI doit être positive ou nulle.","es":"La rigidez del apoyo intermedio FSI no puede ser negativa.","pl":"Sztywność pośredniej podpory FSI nie może być ujemna."},{"en":"Intermediate FSI supports at {a} m and {b} m snap to the same MOC node {j}.","uk":"Проміжні опори FSI при {a} m і {b} m потрапляють в один вузол MOC {j}.","de":"Die FSI-Zwischenlager bei {a} m und {b} m fallen auf denselben MOC-Knoten {j}.","nl":"De FSI-tussensteunen bij {a} m en {b} m vallen op dezelfde MOC-knoop {j}.","fr":"Les appuis intermédiaires FSI à {a} m et {b} m tombent sur le même nœud MOC {j}.","es":"Los apoyos intermedios FSI en {a} m y {b} m caen en el mismo nodo MOC {j}.","pl":"Pośrednie podpory FSI przy {a} m i {b} m trafiają do tego samego węzła MOC {j}."},{"en":"FSI mode requires positive L, D, density, Q₀ and duration.","uk":"Режим FSI вимагає додатних L, D, густини, Q₀ і тривалості.","de":"Der FSI-Modus erfordert positive L, D, Dichte, Q₀ und Dauer.","nl":"De FSI-modus vereist positieve L, D, dichtheid, Q₀ en duur.","fr":"Le mode FSI exige L, D, masse volumique, Q₀ et durée positifs.","es":"El modo FSI requiere L, D, densidad, Q₀ y duración positivos.","pl":"Tryb FSI wymaga dodatnich L, D, gęstości, Q₀ i czasu trwania."},{"en":"Axial FSI + pipe-wall viscoelasticity is not coupled in the current FSI branch; turn one of them off.","uk":"Осьова FSI + в’язкопружність стінки не поєднані в поточній гілці FSI; вимкніть одне з них.","de":"Axiale FSI + Rohrwand-Viskoelastizität sind im aktuellen FSI-Zweig nicht gekoppelt; eines davon ausschalten.","nl":"Axiale FSI + visco-elasticiteit van de buiswand zijn in de huidige FSI-tak niet gekoppeld; schakel er één uit.","fr":"FSI axiale + viscoélasticité de paroi ne sont pas couplées dans la branche FSI actuelle ; désactivez l’une des deux.","es":"FSI axial + viscoelasticidad de pared no están acopladas en la rama FSI actual; desactive una de ellas.","pl":"Osiowa FSI i lepkosprężystość ścianki nie są sprzężone w obecnej gałęzi FSI; wyłącz jedną z nich."},{"en":"The current axial FSI branch supports a reservoir–pipe–valve system only; turn the pump off.","uk":"Поточна гілка осьової FSI підтримує лише систему резервуар–труба–клапан; вимкніть насос.","de":"Der aktuelle axiale FSI-Zweig unterstützt nur ein System Behälter–Rohr–Ventil; Pumpe ausschalten.","nl":"De huidige axiale FSI-tak ondersteunt alleen een systeem reservoir–leiding–klep; schakel de pomp uit.","fr":"La branche FSI axiale actuelle ne gère qu’un système réservoir–conduite–vanne ; désactivez la pompe.","es":"La rama FSI axial actual solo admite un sistema depósito–tubería–válvula; desactive la bomba.","pl":"Obecna gałąź osiowej FSI obsługuje tylko układ zbiornik–rura–zawór; wyłącz pompę."},{"en":"The current axial FSI branch does not couple check valves, surge vessels or air valves.","uk":"Поточна гілка осьової FSI не поєднується зі зворотними клапанами, зрівнювальними резервуарами чи повітряними клапанами.","de":"Der aktuelle axiale FSI-Zweig koppelt keine Rückschlagventile, Windkessel oder Be-/Entlüftungsventile.","nl":"De huidige axiale FSI-tak koppelt geen terugslagkleppen, windketels of be-/ontluchters.","fr":"La branche FSI axiale actuelle ne couple ni clapets, ni réservoirs anti-bélier, ni ventouses.","es":"La rama FSI axial actual no acopla válvula for(const p of P){
 if(!/\{\w+(?::t)?\}/.test(p.en)){for(const l of LANGS)if(p[l]!=null)exact[l].set(p.en,p[l]);continue}
 const names=[],kinds=[];let src='',last=0,m,lit=0;const r=/\{(\w+)(?::(t))?\}/g;
 while((m=r.exec(p.en))){const s=p.en.slice(last,m.index);lit+=s.length;src+=esc(s)+'((?:(?!\\. | · )[\\s\\S])+?)';names.push(m[1]);kinds.push(m[2]||'');last=r.lastIndex}
 const tail=p.en.slice(last);lit+=tail.length;src+=esc(tail);
 C.push({p,names,kinds,lit,re:new RegExp('^'+src+'$')})}
C.sort((a,b)=>b.lit-a.lit);
function translate(lang,text,lookup){
 if(!exact[lang]||text==null)return null;
 const memo=new Map();
 const fill=(c,m)=>{if(c.p[lang]==null)return null;const v={};for(let i=0;i<c.names.length;i++){let x=m[i+1];if(c.kinds[i]==='t'){const y=tr(x);if(y==null)return null;x=y}v[c.names[i]]=x}
  return c.p[lang].replace(/\{(\w+)\}/g,(a,n)=>own(v,n)?v[n]:a)};
 const unit=t=>{const d=lookup?lookup(t):null;if(d!=null&&d!==t)return d;if(exact[lang].has(t))return exact[lang].get(t);
  for(const c of C){const m=c.re.exec(t);if(m){const r=fill(c,m);if(r!=null)return r}}return null};
 const sentence=s=>{const u=unit(s);if(u!=null)return u;if(/[^.]\\.$/.test(s)){const v=unit(s.slice(0,-1));if(v!=null)return v+'.'}if(!s.includes(' · '))return null;
  const dot=/\.$/.test(s)?'.':'',body=dot?s.slice(0,-1):s;let any=false;
  const segs=body.split(' · ').map(g=>{const y=unit(g);if(y!=null){any=true;return y}return g});
  return any?segs.join(' · ')+dot:null};
 const one=t=>{const sents=t.split(/(?<=\.)\s+(?=\S)/);if(sents.length<2)return sentence(t);
  const u=unit(t);if(u!=null)return u;let any=false;
  const out=sents.map(s=>{const y=sentence(s);if(y!=null){any=true;return y}return s});return any?out.join(' '):null};
 const tr=t=>{if(memo.has(t))return memo.get(t);memo.set(t,null);const r=one(t);memo.set(t,r);return r};
 const src=String(text);if(made[lang].has(src))return null;
 const res=tr(src);if(res!=null&&res!==src){if(made[lang].size>20000)made[lang].clear();made[lang].add(res)}return res;
}
window.__whPatterns={translate,count:P.length};
})();
</script>
<script id="waterhammer-runtime-i18n">
/* Revision 2026-10-16: for uk, de, nl, fr and es, text nodes and the four translatable attributes
   that the page writes at run time are passed through the pattern layer (dictionary first). The
   Polish overlay below calls the same layer from its own tr(). Form fields and code blocks are skipped. */
(()=>{'use strict';
 const attrs=['placeholder','title','aria-label','alt'];
 const active=()=>typeof currentLang==='string'&&typeof I18N_LANGS!=='undefined'&&I18N_LANGS.includes(currentLang)&&!!window.__whPatterns;
 const look=s=>{const row=UI18N[s],i=I18N_LANGS.indexOf(currentLang);return row&&i>=0&&row[i]?row[i]:null};
 const trx=v=>{if(v==null)return v;const t=String(v).trim();if(!t||!/[A-Za-z]{2}/.test(t))return v;const y=window.__whPatterns.translate(currentLang,t,look);return y!=null&&y!==t?String(v).replace(t,y):v};
 const skip=el=>!el||/^(SCRIPT|STYLE|NOSCRIPT|TEXTAREA|INPUT|SELECT|CODE|PRE)$/i.test(el.tagName)||!!el.closest('[contenteditable="true"]');
 function node(n){if(!n||!active())return;
  if(n.nodeType===3){if(!skip(n.parentElement)){const v=trx(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}return}
  if(n.nodeType!==1||skip(n))return;
  for(const a of attrs)if(n.hasAttribute(a)){const v=n.getAttribute(a),w=trx(v);if(w!==v)n.setAttribute(a,w)}
  const tw=document.createTreeWalker(n,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let q;
  while((q=tw.nextNode())){if(q.nodeType===3){if(!skip(q.parentElement)){const v=trx(q.nodeValue);if(v!==q.nodeValue)q.nodeValue=v}}
   else for(const a of attrs)if(q.hasAttribute(a)){const v=q.getAttribute(a),w=trx(v);if(w!==v)q.setAttribute(a,w)}}}
 window.__whRuntimeTr=s=>active()?trx(s):s;
 const start=()=>{node(document.body);new MutationObserver(ms=>{if(!active())return;for(const m of ms){if(m.type==='characterData')node(m.target);
  else if(m.type==='attributes'){const el=m.target,v=el.getAttribute(m.attributeName),w=trx(v);if(v!=null&&w!==v)el.setAttribute(m.attributeName,w)}
  else for(const x of m.addedNodes)node(x)}}).observe(document.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:attrs})};
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>

de falls; experiments commonly require unsteady friction and/or pipe-wall viscoelasticity for the observed damping.":"Prawie stałe tarcie Darcy'ego ma charakter rozpraszający, ale często wykazuje powolne tłumienie po spadku amplitudy przepływu; do zaobserwowania tłumienia eksperymenty zwykle wymagają niestacjonarnego tarcia i/lub lepkosprężystości ścianki rury.","Frequency-dependent unsteady friction is active and should attenuate pressure oscillations more strongly than quasi-steady friction within its validity range.":"Częstotliwościowo zależne niestacjonarne tarcie jest aktywne i powinno tłumić oscylacje ciśnienia silniej niż tarcie quasi-stacjonarne w zakresie swojej ważności.","Pipe-wall viscoelasticity is active; retarded strain adds physical attenuation and dispersion in addition to hydraulic friction.":"Lepkosprężystość ścianek rur jest aktywna; opóźnione odkształcenie powoduje tłumienie fizyczne i dyspersję, oprócz tarcia hydraulicznego.","Running…":"Działanie…","Solved":"Rozwiązany","Solved axial FSI":"Rozwiązany osiowy FSI","Presets change inputs only. Press":"Ustawienia wstępne zmieniają tylko dane wejściowe. Naciśnij","to solve.":"rozwiązać.","Elevation profile: chainage x [m], elevation z [m]":"Profil wysokościowy: pikietaż x [m], wysokość z [m]","Load profile CSV":"Załaduj profil CSV","Clear profile":"Wyczyść profil","Profile mode requires points at x=0 and x=L.":"Tryb profilu wymaga punktów x=0 i x=L.","DVCM weighting ψ":"Ważenie DVCM ψ","ψ=0.55 follows the published reference implementation; values nearer 1 add numerical damping and can suppress oscillation.":"ψ=0,55 jest zgodne z opublikowaną implementacją referencyjną; wartości bliższe 1 dodają tłumienie numeryczne i mogą tłumić oscylacje.","Quasi-steady friction. Real pressure-wave attenuation may be slow with this model; the pressure-history panel reports an observed cycle-by-cycle damping diagnostic.":"Tarcie quasi-stacjonarne. Rzeczywiste tłumienie fal ciśnienia może być powolne w tym modelu;
