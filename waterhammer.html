g)]","Druck [bar(g)]","druk [bar(g)]","pression [bar(g)]","presión [bar(g)]"],"head [m]":["напір [m]","Höhe [m]","opvoerhoogte [m]","charge [m]","carga [m]"],"command / speed [%]":["команда / швидкість [%]","Befehl / Drehzahl [%]","commando / snelheid [%]","commande / vitesse [%]","mando / velocidad [%]"],"pipe axial velocity [m/s]":["осьова швидкість труби [m/s]","axiale Rohrgeschwindigkeit [m/s]","axiale leidingsnelheid [m/s]","vitesse axiale de conduite [m/s]","velocidad axial de tubería [m/s]"],"Scope":["Обсяг","Umfang","Scope","Périmètre","Alcance"],"Limitations":["Обмеження","Einschränkungen","Beperkingen","Limites","Limitaciones"],"Detailed equations and literature references below use English technical notation.":["Детальні рівняння та літературні посилання нижче залишено в англійській технічній нотації.","Die detaillierten Gleichungen und Literaturangaben unten verwenden englische technische Notation.","De gedetailleerde vergelijkingen en literatuurverwijzingen hieronder gebruiken Engelse technische notatie.","Les équations détaillées et références bibliographiques ci-dessous utilisent la notation technique anglaise.","Las ecuaciones detalladas y referencias bibliográficas siguientes usan notación técnica inglesa."],"Damping diagnostic":["Діагностика затухання","Dämpfungsdiagnose","Dempingsdiagnose","Diagnostic d’amortissement","Diagnóstico de amortiguamiento"],"Current FSI branch is frictionless: persistent oscillations are expected unless the end-support dashpot dissipates energy. Characteristic interpolation can add numerical damping, but it is not physical friction.":["Поточна FSI-гілка без тертя: стійкі коливання очікувані, якщо демпфер кінцевої опори не розсіює енергію. Інтерполяція характеристик може додати чисельне затухання, але це не фізичне тертя.","Der aktuelle FSI-Zweig ist reibungsfrei: anhaltende Schwingungen sind zu erwarten, sofern der Dämpfer der Endlagerung keine Energie dissipiert. Charakteristikeninterpolation kann numerische Dämpfung erzeugen, ist aber keine physikalische Reibung.","De huidige FSI-tak is wrijvingsloos: blijvende oscillaties zijn te verwachten tenzij de demper van de eindsteun energie dissipeert. Karakteristiekeninterpolatie kan numerieke demping toevoegen, maar dat is geen fysieke wrijving.","La branche FSI actuelle est sans frottement : des oscillations persistantes sont attendues sauf si l’amortisseur du support terminal dissipe de l’énergie. L’interpolation des caractéristiques peut ajouter un amortissement numérique, mais ce n’est pas un frottement physique.","La rama FSI actual no tiene fricción: se esperan oscilaciones persistentes salvo que el amortiguador del apoyo final disipe energía. La interpolación de características puede añadir amortiguamiento numérico, pero no es fricción física."],"Run longer to quantify damping: fewer than two complete 4L/a pressure-wave cycles are available after the event.":["Запустіть довший розрахунок для оцінки затухання: після події доступно менше двох повних циклів хвилі 4L/a.","Länger rechnen, um die Dämpfung zu quantifizieren: Nach dem Ereignis sind weniger als zwei vollständige 4L/a-Druckwellenzyklen verfügbar.","Reken langer om de demping te kwantificeren: na de gebeurtenis zijn minder dan twee volledige 4L/a-drukgolfcycli beschikbaar.","Prolongez le calcul pour quantifier l’amortissement : moins de deux cycles complets 4L/a sont disponibles après l’événement.","Ejecute más tiempo para cuantificar el amortiguamiento: hay menos de dos ciclos completos 4L/a después del evento."],"Quasi-steady Darcy friction is dissipative but often gives slow attenuation after the flow amplitude falls; experiments commonly require unsteady friction and/or pipe-wall viscoelasticity for the observed damping.":["Квазістаціонарне тертя Darcy розсіює енергію, але після зменшення амплітуди витрати часто дає повільне затухання; для експериментально спостережуваного демпфування часто потрібні нестаціонарне тертя та/або в’язкопружність стінки.","Quasistationäre Darcy-Reibung dissipiert Energie, liefert nach Abnahme der Strömungsamplitude aber oft nur langsame Dämpfung; für die experimentell beobachtete Dämpfung sind häufig instationäre Reibung und/oder Rohrwand-Viscoelastizität erforderlich.","Quasi-stationaire Darcy-wrijving dissipeert energie maar geeft vaak trage demping zodra de debietamplitude afneemt; voor experimenteel waargenomen demping zijn vaak onstationaire wrijving en/of wandvisco-elasticiteit nodig.","Le frottement Darcy quasi stationnaire est dissipatif mais donne souvent un amortissement lent lorsque l’amplitude du débit diminue ; les expériences exigent souvent un frottement instationnaire et/ou la viscoélasticité de paroi pour reproduire l’amortissement observé.","La fricción Darcy cuasiestacionaria disipa energía, pero suele dar una atenuación lenta cuando cae la amplitud del caudal; los experimentos suelen requerir fricción no estacionaria y/o viscoelasticidad de pared para reproducir el amortiguamiento observado."],"Frequency-dependent unsteady friction is active and should attenuate pressure oscillations more strongly than quasi-steady friction within its validity range.":["Активне частотно-залежне нестаціонарне тертя; у межах області застосовності воно має гасити коливання тиску сильніше за квазістаціонарне тертя.","Frequenzabhängige instationäre Reibung ist aktiv und sollte Druckschwingungen im Gültigkeitsbereich stärker dämpfen als quasistationäre Reibung.","Frequentieafhankelijke onstationaire wrijving is actief en hoort drukoscillaties binnen het geldigheidsgebied sterker te dempen dan quasi-stationaire wrijving.","Le frottement instationnaire dépendant de la fréquence est actif et doit amortir les oscillations plus fortement que le frottement quasi stationnaire dans son domaine de validité.","La fricción no estacionaria dependiente de la frecuencia está activa y debe amortiguar las oscilaciones más que la fricción cuasiestacionaria dentro de su rango de validez."],"Pipe-wall viscoelasticity is active; retarded strain adds physical attenuation and dispersion in addition to hydraulic friction.":["Активна в’язкопружність стінки; запізніла деформація додає фізичне затухання та дисперсію до гідравлічного тертя.","Rohrwand-Viscoelastizität ist aktiv; verzögerte Dehnung erzeugt zusätzlich zur hydraulischen Reibung physikalische Dämpfung und Dispersion.","Wandvisco-elasticiteit is actief; vertraagde rek voegt fysieke demping en dispersie toe naast hydraulische wrijving.","La viscoélasticité de paroi est active ; la déformation retardée ajoute amortissement physique et dispersion au frottement hydraulique.","La viscoelasticidad de pared está activa; la deformación retardada añade amortiguamiento físico y dispersión además de la fricción hidráulica."],"Running…":["Виконується…","Läuft…","Bezig…","Calcul en cours…","Ejecutando…"],"Solved ":["Розраховано: ","Gelöst: ","Berekend: ","Calculé : ","Calculado: "],"Solved axial FSI":["Розраховано осьову FSI","Axiale FSI gelöst","Axiale FSI berekend","FSI axiale calculée","FSI axial calculada"],"Presets change inputs only. Press":["Пресети лише змінюють вхідні дані. Натисніть","Voreinstellungen ändern nur Eingaben. Klicken Sie","Presets wijzigen alleen invoer. Druk op","Les préréglages modifient uniquement les entrées. Appuyez sur","Los preajustes solo cambian entradas. Pulse"],"to solve.":["для розрахунку.","zum Rechnen.","om te berekenen.","pour calculer.","para calcular."],"Elevation profile: chainage x [m], elevation z [m]":["Профіль висот: пікетаж x [m], відмітка z [m]","Höhenprofil: Stationierung x [m], Höhe z [m]","Hoogteprofiel: kettingage x [m], hoogte z [m]","Profil altimétrique : chaînage x [m], altitude z [m]","Perfil de elevación: progresiva x [m], cota z [m]"],"Load profile CSV":["Завантажити CSV профілю","Profil-CSV laden","Profiel-CSV laden","Charger CSV du profil","Cargar CSV del perfil"],"Clear profile":["Очистити профіль","Profil löschen","Profiel wissen","Effacer le profil","Borrar perfil"],"Profile mode requires points at x=0 and x=L.":["Режим профілю вимагає точок x=0 та x=L.","Profilmodus erfordert Punkte bei x=0 und x=L.","Profielmodus vereist punten op x=0 en x=L.","Le mode profil exige des points à x=0 et x=L.","El modo perfil requiere puntos en x=0 y x=L."],"DVCM weighting ψ":["Ваговий коефіцієнт DVCM ψ","DVCM-Gewichtung ψ","DVCM-weging ψ","Pondération DVCM ψ","Ponderación DVCM ψ"],"ψ=0.55 follows the published reference implementation; values nearer 1 add numerical damping and can suppress oscillation.":["ψ=0.55 відповідає опублікованій еталонній реалізації; значення ближче до 1 додають чисельне затухання й можуть пригнічувати коливання.","ψ=0,55 folgt der publizierten Referenzimplementierung; Werte näher 1 erhöhen die numerische Dämpfung und können Schwingungen unterdrücken.","ψ=0,55 volgt de gepubliceerde referentie-implementatie; waarden dichter bij 1 voegen numerieke demping toe en kunnen oscillaties onderdrukken.","ψ=0,55 suit l’implémentation de référence publiée ; des valeurs proches de 1 ajoutent un amortissement numérique et peuvent supprimer des oscillations.","ψ=0,55 sigue la implementación de referencia publicada; valores próximos a 1 añaden amortiguamiento numérico y pueden suprimir oscilaciones."],"Quasi-steady friction. Real pressure-wave attenuation may be slow with this model; the pressure-history panel reports an observed cycle-by-cycle damping diagnostic.":["Квазістаціонарне тертя. У цій моделі реальне затухання хвилі тиску може бути повільним; панель історії тиску показує діагностику затухання за циклами.","Quasistationäre Reibung. Die reale Druckwellendämpfung kann mit diesem Modell langsam sein; der Druckverlauf zeigt eine zyklusweise Dämpfungsdiagnose.","Quasi-stationaire wrijving. Werkelijke drukgolfdemping kan met dit model traag zijn; de drukhistorie toont een dempingsdiagnose per cyclus.","Frottement quasi stationnaire. L’atténuation réelle des ondes peut être lente avec ce modèle ; l’historique de pression affiche un diagnostic d’amortissement cycle par cycle.","Fricción cuasiestacionaria. La atenuación real de la onda puede ser lenta con este modelo; el historial de presión muestra un diagnóstico de amortiguamiento ciclo a ciclo."],"Colebrook wall-regime diagnostic will appear here.":["Тут з’явиться діагностика режиму стінки Colebrook.","Colebrook-Wandregime-Diagnose erscheint hier.","Colebrook-wandregimediagnose verschijnt hier.","Le diagnostic du régime de paroi Colebrook apparaîtra ici.","El diagnóstico del régimen de pared Colebrook aparecerá aquí."],"Retarded creep spectrum: τ [s], Jₖ [10⁻⁹ Pa⁻¹]":["Спектр запізнілої повзучості: τ [s], Jₖ [10⁻⁹ Pa⁻¹]","Verzögertes Kriechspektrum: τ [s], Jₖ [10⁻⁹ Pa⁻¹]","Vertraagd kruipspectrum: τ [s], Jₖ [10⁻⁹ Pa⁻¹]","Spectre de fluage retardé : τ [s], Jₖ [10⁻⁹ Pa⁻¹]","Espectro de fluencia retardada: τ [s], Jₖ [10⁻⁹ Pa⁻¹]"],"Viscoelastic wall off. a₀ is the instantaneous elastic wave speed.":["В’язкопружна стінка вимкнена. a₀ — миттєва пружна швидкість хвилі.","Viskoelastische Wand aus. a₀ ist die momentane elastische Wellengeschwindigkeit.","Visco-elastische wand uit. a₀ is de onmiddellijke elastische golfsnelheid.","Paroi viscoélastique désactivée. a₀ est la célérité élastique instantanée.","Pared viscoelástica desactivada. a₀ es la velocidad de onda elástica instantánea."],"FSI wall thickness e":["Товщина стінки FSI e","FSI-Wanddicke e","FSI-wanddikte e","Épaisseur de paroi FSI e","Espesor de pared FSI e"],"Pipe Poisson ratio νₚ":["Коефіцієнт Пуассона труби νₚ","Poissonzahl des Rohrs νₚ","Poissonfactor van de buis νₚ","Coefficient de Poisson de la conduite νₚ","Coeficiente de Poisson de la tubería νₚ"],"Intermediate supports: chainage x [m], stiffness kₛ [MN/m]":["Проміжні опори: пікетаж x [m], жорсткість kₛ [MN/m]","Zwischenlager: Stationierung x [m], Steifigkeit kₛ [MN/m]","Tussensteunen: kettingage x [m], stijfheid kₛ [MN/m]","Supports intermédiaires : chaînage x [m], raideur kₛ [MN/m]","Apoyos intermedios: progresiva x [m], rigidez kₛ [MN/m]"]," iciënt C","Coefficient de débit C","Coeficiente de descarga C"],"Ideal mode clamps the node to atmospheric pressure whenever the unconstrained solution goes sub-atmospheric.":["Ідеальний режим фіксує вузол на атмосферному тиску, коли необмежений розв’язок стає нижчим за атмосферний.","Der Idealmodus begrenzt den Knoten auf Atmosphärendruck, sobald die unbeschränkte Lösung unteratmosphärisch wird.","Ideale modus klemt de knoop op atmosferische druk zodra de onbeperkte oplossing onder atmosferisch komt.","Le mode idéal bloque le nœud à la pression atmosphérique lorsque la solution libre devient sous-atmosphérique.","El modo ideal fija el nodo a presión atmosférica cuando la solución no restringida cae por debajo de la atmosférica."],"Method of Characteristics uses Δt = Δx/a, so Courant number = 1. Long runs are down-sampled only for display; extrema use every solver step.":["Метод характеристик використовує Δt = Δx/a, тому Courant=1. Довгі розрахунки проріджуються лише для відображення; екстремуми використовують кожен крок solver-а.","Das Charakteristikenverfahren verwendet Δt=Δx/a, also Courant=1. Lange Läufe werden nur für die Anzeige ausgedünnt; Extrema nutzen jeden Solver-Schritt.","De methode der karakteristieken gebruikt Δt=Δx/a, dus Courant=1. Lange runs worden alleen voor weergave uitgedund; extrema gebruiken elke solverstap.","La méthode des caractéristiques utilise Δt=Δx/a, donc Courant=1. Les longs calculs sont sous-échantillonnés seulement pour l’affichage ; les extrêmes utilisent chaque pas.","El método de características usa Δt=Δx/a, por lo que Courant=1. Los cálculos largos se submuestrean solo para mostrar; los extremos usan cada paso."],"Analytic invariants, literature reproduction and published experimental cross-checks. Experimental rows are INFO/WARN rather than release gates because raw measurement traces and the exact recorded valve Cv trajectory are not bundled. These remain self-tests;":["Інваріанти, відтворення літературних випадків і опубліко t J détermine la vitesse du rotor.","El modo cuadrático se limita al flujo directo. Suter usa exactamente θ = atan2(α,v), v = Q/Q*, α = n/n*, H/H* = Wh(θ)(α²+v²), M/M* = Wm(θ)(α²+v²). Tras el disparo, el par motor es cero y J determina la velocidad del rotor."],"Pump trip, 4Q Suter and check-valve slam":["Trip насоса, Suter 4Q і удар зворотного клапана","Pumpentrip, Suter 4Q und Rückschlagventilschlag","Pompuitval, Suter 4Q en terugslagklepslag","Arrêt pompe, Suter 4Q et claquement du clapet","Disparo de bomba, Suter 4Q y golpe de válvula de retención"],"ρaV₀ reference":["еталон ρaV₀","Referenz ρaV₀","referentie ρaV₀","référence ρaV₀","referencia ρaV₀"],"is false.":["= false.","ist false.","is false.","est false.","es false."]};

function loaderRow(id,fileLabel,clearLabel,statusId,onText,onClear){
 return {id:'f-'+id+'-tools',type:'custom',label:'',render:box=>{
  const row=mk('div','wh-row');
  const fi=document.createElement('input');fi.type='file';fi.accept='.csv,.txt,text/csv,text/plain';fi.hidden=true;fi.id=id+'File';
  fi.setAttribute('aria-label',tr(fileLabel));fi.tabIndex=-1;
  const b1=btn('dgu-btn',tr(fileLabel));
  b1.addEventListener('click',()=>fi.click());
  fi.addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
   try{onText(await f.text(),f.name)}catch(err){setStatus('Could not read file: '+err.message,'err')}finally{e.target.value=''}});
  const b2=btn('dgu-btn',tr(clearLabel));
  b2.addEventListener('click',onClear);
  row.appendChild(b1);row.appendChild(b2);row.appendChild(fi);
  box.appendChild(row);
  if(statusId)box.appendChild(aux(statusId,'dgu-hint'));
 }};
}

function introNode(){
 const b=mk('div','dgu-empty');
 b.appendChild(mk('h3',null,DiagramUI.pick(LEARN.intro.title,currentLang)));
 b.appendChild(mk('p',null,String(LEARN.intro.body())));

function resultsData(){
 const c=result?result.c:cfg(),A=Math.PI*c.D*c.D/4,V=c.Q0/A,aRef=(result&&result.fsi&&result.fsi.lambda1)||c.a;
 const jouk=c.rho*aRef*V/1e5, rt=2*c.L/aRef;
 const tiles=[
  {label:L('Initial velocity'),value:finite(V)?V:null,unit:'m/s',precision:2,hint:'Q₀/A',headline:false},
  {label:L('Full-stop Joukowsky'),value:finite(jouk)?jouk:null,unit:'bar',precision:1,hint:L('ρaV₀ reference'),learn:'joukowsky',headline:false},
  {label:L('Round trip'),value:finite(rt)?rt:null,unit:'s',precision:2,hint:'2L/a',learn:'roundtrip',headline:false}
 ];
 if(!result){
  tiles.push({label:L('Global maximum'),value:null,unit:'bar',hint:L('gauge pressure')});
  tiles.push({label:L('Global minimum'),value:null,unit:'bar',hint:L('gauge pressure')});
  tiles.push({label:L('Cavitation check'),value:null,learn:'cavitation',
   hint:`${c.cavModel==='dvcm'?'DVCM · ':''}Pvap ${fmt(c.pvap/1000,2)} kPa abs`});
  return {tiles,nodes:[introNode(),aux('status','wh-status')],
   notes:[()=>tr('Presets change inputs only. Press')+' '+tr('Run transient')+' '+tr('to solve.')]};
 }
 const r=result,thresholdContinuation=r.c.cavModel==='threshold'&&r.firstCavitation;
 tiles.push({label:L('Global maximum'),value:r.globalMax.p,unit:'bar',precision:2,
  hint:`x ${fmt(r.x[r.globalMax.j],0)} m · t ${fmt(r.globalMax.t,3)} s${thresholdContinuation&&r.globalMax.t>=r.firstCavitation.t?' · post-threshold':''}`});
 tiles.push({label:L('Global minimum'),value:r.globalMin.p,unit:'bar',precision:2,
  hint:`x ${fmt(r.x[r.globalMin.j],0)} m · t ${fmt(r.globalMin.t,3)} s${thresholdContinuation&&r.globalMin.t>=r.firstCavitation.t?' · post-threshold':''}`});
 const cav=!!r.firstCavitation;
 if(r.c.cavModel==='dvcm'&&cav)tiles.push({label:L('Cavitation check'),value:'DVCM',tone:'warn',learn:'cavitation',
   hint:`Vmax ${fmt(r.maxCavity.V,5)} m³ · Vcav/Vreach ${fmt(r.maxVoidFraction.alpha*100,2)}%`});
 else tiles.push({label:L('Cavitation check'),value:cav?'REACHED':'clear',tone:cav?'bad':'ok',learn:'cavitation',

const STAGES={};
function capNode(title,sub,subId){
 const d=mk('div','dgu-stage-cap');
 d.appendChild(mk('b',null,tr(title)));
 d.appendChild(mk('span','wh-sub','·'));

function probeBar(){
 const bar=mk('div','wh-bar');
 const lab=mk('label',null,tr('Probe location'));lab.setAttribute('for','probe');
 let p=AUX.probe;
 if(!p){p=AUX.probe=document.createElement('input');p.type='range';p.id='probe';p.min=0;p.max=100;p.step=1;p.value=75;
  p.addEventListener('input',()=>{drawScheme();drawHistory();drawFSI();updateDampingNote();
   $('#probeOut').textContent=result?`${fmt(100*probeIndex()/result.c.N,0)}% L`:$('#probe').value+'% L'})}
 p.setAttribute('aria-label',tr('Probe location'));
 bar.appendChild(lab);bar.appendChild(p);bar.appendChild(aux('probeOut','wh-out','75% L','output'));

function playBar(){
 const bar=mk('div','wh-bar');
 let b=AUX.playBtn;
 if(!b){b=AUX.playBtn=btn('dgu-btn',tr('▶ Play'));b.id='playBtn';b.addEventListener('click',togglePlay)}
 b.setAttribute('aria-label',b.textContent);
 let st=AUX.stepBtn;
 if(!st){st=AUX.stepBtn=btn('dgu-btn',tr('+1 frame'));st.id='stepBtn';
  st.addEventListener('click',()=>{if(!result)return;stopPlay();frameIndex=(frameIndex+1)%result.frames.length;drawAll()})}
 st.textContent=tr('+1 frame');st.setAttribute('aria-label',st.textContent);
 let sl=AUX.timeSlider;
 if(!sl){sl=AUX.timeSlider=document.createElement('input');sl.type='range';sl.id='timeSlider';sl.min=0;sl.max=0;sl.value=0;sl.step=1;
  sl.addEventListener('input',e=>{if(!result)return;stopPlay();frameIndex=Number(e.target.value);drawAll()})}

/* the tool draws into its own canvas, so the stage's measured height is applied to
   it explicitly — a percentage height has nothing to resolve against otherwise. */
function sized(id,hFine,hCoarse,fn){return size=>{const c=cv(id);c.style.height=(size.density==='coarse'?hCoarse:hFine)+'px';fn()}}
function chartStage(app,id,title,sub,drawFn,subId){
 const s=app.stage({render:sized(id,280,250,drawFn)});
 s.body.appendChild(cv(id));
 s.node.appendChild(capNode(title,sub,subId));
 STAGES[id]=s;
 return s;
}
function buildStage(host,app){
 const s1=app.stage({render:sized('scheme',188,188,drawScheme),
  a11y:()=>result?`${tr('System schematic')}. ${tr('Global maximum')} ${fmt(result.globalMax.p,2)} bar · ${tr('Global minimum')} ${fmt(result.globalMin.p,2)} bar.`:''});
 s1.body.appendChild(cv('scheme'));
 s1.node.appendChild(capNode('System schematic','current pressure along pipe'));
 s1.node.appendChild(probeBar());
 STAGES.scheme=s1;
 /* Voxel CFD pattern: the solver controls belong to the central stage region,
    immediately under the schematic. stageActions() keeps them in normal flow
    with the stage instead of letting the run-mode primary action float across
    another calculator column. Below md the framework's own sticky Run remains;
    #runBtn is hidden there by the existing mobile rule. */
 app.stageActions({id:'solver-controls',learn:'numerics',actions:[
  {id:'runBtn',label:L('Run transient'),variant:'primary',run:()=>app.run()}
 ]});
 const s2=app.stage({render:sized('heat',330,270,drawHeat),
  a11y:()=>result?`${tr('x–t pressure map')}. ${result.frames.length} frames · ${fmt(result.Tsim,3)} s.`:''});
 s2.body.appendChild(cv('heat'));
 s2.node.appendChild(capNode('x–t pressure map','gauge pressure [bar] · horizontal = pipe position · vertical = time'));
 s2.node.appendChild(playBar());
 STAGES.heat=s2;
 /* the four (five with FSI) auxiliary charts are pictures too: they stay in the
    stage column under the x-t map, where the old main column had them. */
 chartStage(app,'hgl','Hydraulic grade line','animated H(x,t)',()=>drawHGL());
 const hs=chartStage(app,'history','Pressure history at probe','—',()=>drawHistory(),'historySub');
 hs.node.appendChild(aux('dampingNote','dgu-hint'));
 chartStage(app,'envelope','Maximum / minimum envelope','all solver steps, not display samples',()=>drawEnvelope());
 chartStage(app,'events','Event traces','valve opening · pump speed · check valve',()=>drawEvents());
 const f=chartStage(app,'fsiChart','Axial pipe response','pipe axial velocity at probe',()=>drawFSI(),'fsiPlotSub');
 f.node.id='fsiPlotPanel';
 if(!result||!result.fsi)f.node.style.display='none';
}

function dgcPyScope(){
  const c=result?result.c:cfg();
  const out=[];
  if(c.fsiOn)out.push('axial fluid–structure interaction');
  if(c.veOn)out.push('viscoelastic pipe wall');
  if(c.surgeOn)out.push('surge vessel');
  if(c.airOn)out.push('air/vacuum valve');

function dgcApply(payload){
  const q=(payload&&payload.quantities)||{},accepted=[],ignored=[];
  const put=(id,v)=>{if(!CASE_SET.has(id))return false;S[id]=v;return true};
  for(const k of Object.keys(q)){

    clearStaleSolution();updateMetrics();drawAll();

  }

def colebrook(Re, rel):
    """Colebrook-White friction factor, Newton iteration to machine precision."""
    if Re <= 0:
        return float("nan")
    if Re < 2000:
        return 64.0 / Re
    rel = max(0.0, rel)
    f0 = 0.25 / math.log10(rel / 3.7 + 5.74 / Re ** 0.9) ** 2
    a, b = rel / 3.7, 2.51 / Re
    x = 1.0 / math.sqrt(f0)
    for _ in range(60):
        y = a + b * x
        F = x + 2 * math.log10(y)
        d = 1 + 2 / math.log(10) * b / y
        x -= F / d
    return 1.0 / (x * x)


def darcy_f(Re, rel):
    """f = 64/Re below Re 2000, Colebrook above Re 4000, smoothstep bridge between."""
    if Re <= 0:
        return 0.0
    if Re < 2000:
        return 64.0 / Re
    turb = colebrook(Re, rel)
    if Re >= 4000:
        return turb
    lam = 64.0 / Re
    t = (Re - 2000.0) / 2000.0
    s = t * t * (3 - 2 * t)
    return lam * (1 - s) + turb * s


def elevation(x):
    prof = INPUTS["elevation_profile"]

        if x <= prof[0][0]:
            return prof[0][1]
        if x >= prof[-1][0]:
            return prof[-1][1]
        for i in range(1, len(prof)):
            if x <= prof[i][0]:
                x0, z0 = prof[i - 1]
                x1, z1 = prof[i]
                return z0 + (z1 - z0) * (x - x0) / (x1 - x0)

    return INPUTS["start_elevation"] + (INPUTS["end_elevation"] - INPUTS["start_elevation"]) * x / L

    x = [j * dx for j in range(N + 1)]
    z = [elevation(xi) for xi in x]

    Q0 = INPUTS["initial_flow"]
    V0 = Q0 / A
    Re0 = V0 * D / nu
    f0 = darcy_f(Re0, rel)
    hf = f0 * L / D * V0 * V0 / (2 * G)
    hup = INPUTS["reservoir_head"] + pump_head(Q0, 1.0)
    d_valve = hup - hf - INPUTS["tailwater_head"]
    if not d_valve > 1e-6:
        raise ValueError("initial operating point is inconsistent")
    kval = Q0 / math.sqrt(d_valve)

    H = [hup - hf * j / N for j in range(N + 1)]
    Q = [Q0] * (N + 1)

    gmax = (-1e300, 0, 0.0)
    gmin = (1e300, 0, 0.0)
    pmin = [1e300] * (N + 1)
    pmax = [-1e300] * (N + 1)
    cav = [None]

    def extrema(t):
        # A steady plateau makes the global extremum degenerate, so the value is
        # tracked exactly while the reported time/node is the FIRST attainment to
        # within 1e-12 relative -- the same tie rule the page uses.
        nonlocal gmax, gmin
        for j in range(N + 1):
            p = _pressure_from_head(rho, H[j], z[j])
            if p < pmin[j]:
                pmin[j] = p
            if p > pmax[j]:
                pmax[j] = p
            if p < gmin[0] - 1e-12 * max(1.0, abs(gmin[0])):
                gmin = (p, j, t)
            elif p < gmin[0]:
                gmin = (p, gmin[1], gmin[2])
            if p > gmax[0] + 1e-12 * max(1.0, abs(gmax[0])):
                gmax = (p, j, t)
            elif p > gmax[0]:
                gmax = (p, gmax[1], gmax[2])
            if INPUTS["atmospheric_pressure"] + p * 1e5 <= INPUTS["vapour_pressure"] and cav[0] is None:
                cav[0] = (t, x[j])

    extrema(0.0)
    for step in range(1, steps + 1):
        t = step * dt
        Cp = [0.0] * (N + 1)
        Cm = [0.0] * (N + 1)
        for j in range(1, N + 1):
            q = Q[j - 1]
            R = darcy_f(abs(q) / A * D / nu, rel) * dx / (2 * G * D * A * A)
            Cp[j] = H[j - 1] + B * q - R * q * abs(q)
        for j in range(0, N):
            q = Q[j + 1]
            R = darcy_f(abs(q) / A * D / nu, rel) * dx / (2 * G * D * A * A)
            Cm[j] = H[j + 1] - B * q + R * q * abs(q)

        Hn = [0.0] * (N + 1)
        Qn = [0.0] * (N + 1)
        s = pump_speed(t)
        q0 = _source_flow(Cm[0], B, s)
        if INPUTS["check_valve_mode"] == "ideal" and q0 < 0:
            Qn[0], Hn[0] = 0.0, Cm[0]
        else:
            Qn[0], Hn[0] = q0, Cm[0] + B * q0
        for j in range(1, N):
            Hn[j] = (Cp[j] + Cm[j]) / 2
            Qn[j] = (Cp[j] - Cm[j]) / (2 * B)
        alpha = valve_opening(t)
        if alpha < 1e-6:
            Qn[N], Hn[N] = 0.0, Cp[N]
        else:
            qv = _valve_flow(Cp[N], B, kval * alpha)
            Qn[N], Hn[N] = qv, Cp[N] - B * qv
        H, Q = Hn, Qn
        extrema(t)

    return {
        "initial_velocity": V0,
        "reynolds_initial": Re0,
        "darcy_f_initial": f0,
        "steady_friction_head": hf,
        "valve_discharge_coefficient": kval,
        "joukowsky_pressure_rise": rho * a * V0 / 1e5,
        "round_trip_time": 2 * L / a,
        "dx": dx,
        "dt": dt,
        "steps": steps,
        "simulated_duration": steps * dt,
        "max_pressure": gmax[0],
        "max_pressure_x": x[gmax[1]],
        "max_pressure_time": gmax[2],
        "min_pressure": gmin[0],
        "min_pressure_x": x[gmin[1]],
        "min_pressure_time": gmin[2],
        "cavitation_reached": cav[0] is not None,
        "first_cavitation_time": cav[0][0] if cav[0] else None,
        "first_cavitation_x": cav[0][1] if cav[0] else None,
        "max_cavity_volume": None,
        "max_cavity_reach_ratio": None,
        "max_unsteady_friction_head": None,
    }
`;
}
function dgcPython(){
  if(!result){toast('Run a transient before exporting the python script.');return null}
  const missing=dgcPyScope();
  if(missing.length){
    const m='Python export covers the quasi-steady single-pipe MOC core only; this case also uses: '+missing.join(', ')+'. Export refused rather than emit a script that reproduces a different model.';
    setStatus(m,'warn');toast(m);return null;
  }
  const cav=result.firstCavitation?' The run reached vapour pressure with the threshold model, which flags but does not alter the solution; the exported script reproduces the same unmodified elastic-column result.':'';
  return{
    code:'G = 9.80665\n\n\n'+dgcPythonCode(),
    requires:[],
    scope:'the quasi-steady-friction method-of-characteristics core of this page: uniform elastic pipe on a Courant-1 grid, constant-head reservoir with an optional quadratic pump and ideal check valve, linear or piecewise-linear elevation, and a downstream orifice valve discharging to a tailwater reservoir. It does NOT reproduce unsteady-friction convolution, DVCM column separation, the surge vessel, the air/vacuum valve, the viscoelastic wall, the four-quadrant Suter pump, the dynamic check valve or the axial FSI branch; the export button refuses those configurations.'+cav,
    selftest:{tolerance:1e-9,
      note:'the script integrates the same MOC on the same grid, so agreement to 1e-9 relative is expected; a larger deviation means the export no longer matches the page'}
  };
}
function dgcInit(){
  if(!window.Diagram)return;
  window.Diagram.init({
    id:'waterhammer',file:'waterhammer.html',
    state:{serialize:dgcSerialize,deserialize:dgcDeserialize},
    record:dgcRecord,
    python:dgcPython,
    handoff:{provides:['D','L','rho','Vdot','Re','f_darcy','dp','p'],
             accepts:['D','L','rho','Vdot'],
             build:dgcHandoff,apply:dgcApply},
    report:{profile:dgcReportProfile,sections:dgcSections}
  });
}

а за реверсом потоку не відбулося в межах змодельованої тривалості.","de":"Die Rückschlagventil-Auslösung durch Strömungsumkehr trat in der simulierten Dauer nicht ein.","nl":"De activering van de terugslagklep door stromingsomkering trad niet op binnen de gesimuleerde duur.","fr":"Le déclenchement du clapet par inversion d’écoulement ne s’est pas produit dans la durée simulée.","es":"El disparo de la válvula de retención por inversión de flujo no ocurrió en la duración simulada.","pl":"Zadziałanie zaworu zwrotnego przy odwróceniu przepływu nie nastąpiło w symulowanym czasie."},{"en":"Finite air pocket reached {p}% of one MOC reach volume; the concentrated-pocket approximation is becoming grid-dependent.","uk":"Скінченна повітряна порожнина досягла {p}% об’єму ділянки MOC; наближення зосередженої порожнини стає залежним від сітки.","de":"Das endliche Lufpolster erreichte {p}% eines MOC-Abschnittsvolumens; die Näherung des konzentrierten Polsters wird gitterabhängig.","nl":"De eindige luchtzak bereikte {p}% van één MOC-segmentvolume; de benadering met een geconcentreerde zak wordt roosterafhankelijk.","fr":"La poche d’air finie a atteint {p}% du volume d’un tronçon MOC ; l’approximation de poche concentrée devient dépendante de la grille.","es":"La bolsa de aire finita alcanzó {p}% del volumen de un tramo MOC; la aproximación de bolsa concentrada empieza a depender de la malla.","pl":"Skończona poduszka powietrzna osiągnęła {p}% objętości odcinka MOC; przybliżenie skupionej poduszki zaczyna zależeć od siatki."},{"en":"Finite air pocket exceeded one MOC reach volume; use a moving-interface/extended-pocket model for quantitative results.","uk":"Скінченна повітряна порожнина перевищила об’єм ділянки MOC; для кількісних результатів використовуйте модель із рухомою межею/протяжною порожниною.","de":"Das endliche Luftpolster überschritt ein MOC-Abschnittsvolumen; für quantitative Ergebnisse ein Modell mit bewegter Grenzfläche/ausgedehntem Polster verwenden.","nl":"De eindige luchtzak overschreed één MOC-segmentvolume; gebruik voor kwantitatieve resultaten een model met bewegend grensvlak/uitgestrekte zak.","fr":"La poche d’air finie a dépassé le volume d’un tronçon MOC ; utilisez un modèle à interface mobile/poche étendue pour des résultats quantitatifs.","es":"La bolsa de aire finita superó el volumen de un tramo MOC; use un modelo de interfaz móvil/bolsa extendida para resultados cuantitativos.","pl":"Skończona poduszka powietrzna przekroczyła objętość odcinka MOC; do wyników ilościowych użyj modelu z ruchomą granicą/rozciągłą poduszką."},{"en":"Vardy–Brown exponential fit starts below its documented dimensionless-time range: Δτ/2={x}.","uk":"Експоненційна апроксимація Vardy–Brown починається нижче документованого діапазону безрозмірного часу: Δτ/2={x}.","de":"Die exponentielle Vardy–Brown-Anpassung beginnt unterhalb ihres dokumentierten dimensionslosen Zeitbereichs: Δτ/2={x}.","nl":"De exponentiële Vardy–Brown-fit begint onder zijn gedocumenteerde dimensieloze tijdbereik: Δτ/2={x}.","fr":"L’ajustement exponentiel de Vardy–Brown commence sous sa plage documentée de temps adimensionnel : Δτ/2={x}.","es":"El ajuste exponencial de Vardy–Brown comienza por debajo de su rango documentado de tiempo adimensional: Δτ/2={x}.","pl":"Wykładnicze przybliżenie Vardy–Browna zaczyna się poniżej udokumentowanego zakresu czasu bezwymiarowego: Δτ/2={x}."},{"en":"Vardy–Brown dimensionless time step Δτ={x} exceeds the fitted short-time range.","uk":"Безрозмірний крок часу Vardy–Brown Δτ={x} перевищує апроксимований короткочасовий діапазон.","de":"Der dimensionslose Vardy–Brown-Zeitschritt Δτ={x} überschreitet den angepassten Kurzzeitbereich.","nl":"De dimensieloze Vardy–Brown-tijdstap Δτ={x} overschrijdt het gefitte korte-tijdbereik.","fr":"Le pas de temps adimensionnel de Vardy–Brown Δτ={x} dépasse la plage ajustée aux temps courts.","es":"El paso de tiempo adimensional de Vardy–Brown Δτ={x} excede el rango ajustado de tiempos cortos.","pl":"Bezwymiarowy krok czasowy Vardy–Browna Δτ={x} przekracza dopasowany zakres krótkich czasów."},{"en":"Flow reversal occurred while Vardy–Brown coefficients remained frozen at the initial Reynolds number; verify unsteady-friction applicability through the reversal.","uk":"Відбувся реверс потоку, поки коефіцієнти Vardy–Brown залишалися зафіксованими при початковому числі Рейнольдса; перевірте застосовність нестаціонарного тертя під час реверсу.","de":"Strömungsumkehr trat auf, während die Vardy–Brown-Koeffizienten auf der Anfangs-Reynoldszahl eingefroren blieben; Anwendbarkeit der instationären Reibung über die Umkehr prüfen.","nl":"Stromingsomkering trad op terwijl de Vardy–Brown-coëfficiënten op het initiële Reynoldsgetal bevroren bleven; controleer de toepasbaarheid van onstationaire wrijving tijdens de omkering.","fr":"Une inversion d’écoulement s’est produite alors que les coefficients de Vardy–Brown restaient figés au nombre de Reynolds initial ; vérifiez la validité du frottement instationnaire pendant l’inversion.","es":"Se produjo inversión de flujo mientras los coeficientes de Vardy–Brown seguían fijados al número de Reynolds inicial; verifique la aplicabilidad de la fricción no estacionaria durante la inversión.","pl":"Nastąpiło odwrócenie przepływu, gdy współczynniki Vardy–Browna pozostawały zamrożone przy początkowej liczbie Reynoldsa; sprawdź stosowalność tarcia niestacjonarnego podczas odwrócenia."},{"en":"Fully-rough Vardy–Brown exponential fit starts below its documented dimensionless-time range: Δτ/2={x}.","uk":"Експоненційна апроксимація Vardy–Brown для повністю шорсткої стінки починається нижче документованого діапазону безрозмірного часу: Δτ/2={x}.","de":"Die exponentielle Vardy–Brown-Anpassung für vollrau beginnt unterhalb ihres dokumentierten dimensionslosen Zeitbereichs: Δτ/2={x}.","nl":"De exponentiële Vardy–Brown-fit voor volledig ruw begint onder zijn gedocumenteerde dimensieloze tijdbereik: Δτ/2={x}.","fr":"L’ajustement exponentiel de Vardy–Brown entièrement rugueux commence sous sa plage documentée de temps adimensionnel : Δτ/2={x}.","es":"El ajuste exponencial de Vardy–Brown totalmente rugoso comienza por debajo de su rango documentado de tiempo adimensional: Δτ/2={x}.","pl":"Wykładnicze przybliżenie Vardy–Browna dla ścianki w pełni chropowatej zaczyna się poniżej udokumentowanego zakresu czasu bezwymiarowego: Δτ/2={x}."},{"en":"Fully-rough Vardy–Brown dimensionless time step Δτ={x} exceeds the fitted short-time range.","uk":"Безрозмірний крок часу Vardy–Brown для повністю шорсткої стінки Δτ={x} перевищує апроксимований короткочасовий діапазон.","de":"Der dimensionslose Zeitschritt des vollrauen Vardy–Brown-Modells Δτ={x} überschreitet den angepassten Kurzzeitbereich.","nl":"De dimensieloze tijdstap van het volledig ruwe Vardy–Brown-model Δτ={x} overschrijdt het gefitte korte-tijdbereik.","fr":"Le pas de temps adimensionnel de Vardy–Brown entièrement rugueux Δτ={x} dépasse la plage ajustée aux temps courts.","es":"El paso de tiempo adimensional de Vardy–Brown totalmente rugoso Δτ={x} excede el rango ajustado de tiempos cortos.","pl":"Bezwymiarowy krok czasowy Vardy–Browna dla ścianki w pełni chropowatej Δτ={x} przekracza dopasowany zakres krótkich czasów."},{"en":"Fully-rough applicability diagnostic χ={x} (>0.10): the viscous Colebrook term is not yet negligible relative to the roughness term, so the fully-rough asymptote may be premature.","uk":"Діагностика застосовності повністю шорсткого режиму χ={x} (>0.10): в’язкий член Колбрука ще не малий порівняно з членом шорсткості, тому повністю шорстка асимптота може бути передчасною.","de":"Anwendbarkeitsdiagnose vollrau χ={x} (>0.10): Der viskose Colebrook-Term ist gegenüber dem Rauheitsterm noch nicht vernachlässigbar, die vollraue Asymptote kann verfrüht sein.","nl":"Toepasbaarheidsdiagnose volledig ruw χ={x} (>0.10): de viskeuze Colebrook-term is nog niet verwaarloosbaar t.o.v. de ruwheidsterm, dus de volledig ruwe asymptoot kan voorbarig zijn.","fr":"Diagnostic de validité entièrement rugueux χ={x} (>0.10) : le terme visqueux de Colebrook n’est pas encore négligeable devant le terme de rugosité, l’asymptote entièrement rugueuse peut être prématurée.","es":"Diagnóstico de aplicabilidad totalmente rugoso χ={x} (>0.10): el término viscoso de Colebrook aún no es despreciable frente al de rugosidad, así que la asíntota totalmente rugosa puede ser prematura.","pl":"Diagnostyka stosowalności ścianki w pełni chropowatej χ={x} (>0.10): człon lepkościowy Colebrooka nie jest jeszcze pomijalny względem członu chropowatości, więc asymptota pełnej chropowatości może być przedwczesna."},{"en":"Flow reversal occurred while fully-rough Vardy–Brown coefficients remained frozen at the initial Reynolds number and roughness state; verify applicability through the reversal.","uk":"Відбувся реверс потоку, поки коефіцієнти Vardy–Brown для повністю шорсткої стінки залишалися зафіксованими при початкових числі Рейнольдса та шорсткості; перевірте застосовність під час реверсу.","de":"Strömungsumkehr trat auf, während die vollrauen Vardy–Brown-Koeffizienten auf Anfangs-Reynoldszahl und Rauheitszustand eingefroren blieben; Anwendbarkeit über die Umkehr prüfen.","nl":"Stromingsomkering trad op terwijl de volledig ruwe Vardy–Brown-coëfficiënten bevroren bleven op het initiële Reynoldsgetal en de ruwheidstoestand; controleer de toepasbaarheid tijdens de omkering.","fr":"Une inversion d’écoulement s’est produite alors que les coefficients de Vardy–Brown entièrement rugueux restaient figés au Reynolds et à la rugosité initiaux ; vérifiez la validité pendant l’inversion.","es":"Se produjo inversión de flujo mientras los coeficientes de Vardy–Brown totalmente rugosos seguían fijados al Reynolds y la rugosidad iniciales; verifique la aplicabilidad durante la inversión.","pl":"Nastąpiło odwrócenie przepływu, gdy współczynniki Vardy–Browna dla pełnej chropowatości pozostawały zamrożone przy początkowej liczbie Reynoldsa i chropowatości; sprawdź stosowalność podczas odwrócenia."},{"en":"Zielke weighting is being used near the laminar-transition boundary (Re₀={re}); transition to turbulence is not represented.","uk":"Вагова функція Zielke використовується поблизу межі ламінарного переходу (Re₀={re}); перехід до турбулентності не відтворюється.","de":"Die Zielke-Gewichtung wird nahe der laminaren Übergangsgrenze verwendet (Re₀={re}); der Übergang zur Turbulenz wird nicht abgebildet.","nl":"De Zielke-weging wordt gebruikt nabij de laminaire overgangsgrens (Re₀={re}); de overgang naar turbulentie wordt niet weergegeven.","fr":"La pondération de Zielke est utilisée près de la limite de transition laminaire (Re₀={re}) ; la transition vers la turbulence n’est pas représentée.","es":"La ponderación de Zielke se usa cerca del límite de transición laminar (Re₀={re}); la transición a turbulencia no se representa.","pl":"Funkcja wagowa Zielkego jest używana blisko granicy przejścia laminarnego (Re₀={re}); przejście do turbulencji nie jest odwzorowane."},{"en":"Universal weighting uses Δτ={x}; the published quantitative fit comparison focused on roughly 1e−9≤τ≤1e−3.","uk":"Універсальна вагова функція використовує Δτ={x}; опубліковане кількісне порівняння апроксимації охоплювало приблизно 1e−9≤τ≤1e−3.","de":"Die universelle Gewichtung verwendet Δτ={x}; der veröffentlichte quantitative Anpassungsvergleich deckte etwa 1e−9≤τ≤1e−3 ab.","nl":"De universele weging gebruikt Δτ={x}; de gepubliceerde kwantitatieve fitvergelijking besloeg ongeveer 1e−9≤τ≤1e−3.","fr":"La pondération universelle utilise Δτ={x} ; la comparaison quantitative publiée portait sur environ 1e−9≤τ≤1e−3.","es":"La ponderación universal usa Δτ={x}; la comparación cuantitativa publicada abarcó aproximadamente 1e−9≤τ≤1e−3.","pl":"Uniwersalna funkcja wagowa używa Δτ={x}; opublikowane porównanie ilościowe dopasowania obejmowało około 1e−9≤τ≤1e−3."},{"en":"Universal weighting reached Re={re}, above the published quantitative comparison range up to Re=1e7.","uk":"Універсальна вагова функція досягла Re={re}, вище опублікованого діапазону кількісного порівняння до Re=1e7.","de":"Die universelle Gewichtung erreichte Re={re}, oberhalb des veröffentlichten quantitativen Vergleichsbereichs bis Re=1e7.","nl":"De universele weging bereikte Re={re}, boven het gepubliceerde kwantitatieve vergelijkingsbereik tot Re=1e7.","fr":"La pondération universelle a atteint Re={re}, au-delà de la plage de comparaison quantitative publiée jusqu’à Re=1e7.","es":"La ponderación universal alcanzó Re={re}, por encima del rango de comparación cuantitativa publicado hasta Re=1e7.","pl":"Uniwersalna funkcja wagowa osiągnęła Re={re}, powyżej opublikowanego zakresu porównania ilościowego do Re=1e7."},{"en":"DVCM cavity/reach-volume ratio reached {p}% at x={x} m; classical DVCM is not recommended above a 10% cavity/reach-volume ratio.","uk":"Відношення порожнина/об’єм ділянки DVCM досягло {p}% при x={x} m; класична DVCM не рекомендується понад 10%.","de":"Das DVCM-Verhältnis Hohlraum/Abschnittsvolumen erreichte {p}% bei x={x} m; klassisches DVCM wird oberhalb von 10% nicht empfohlen.","nl":"De DVCM-verhouding holte/segmentvolume bereikte {p}% bij x={x} m; klassiek DVCM wordt boven 10% niet aanbevolen.","fr":"Le rapport cavité/volume de tronçon DVCM a atteint {p}% à x={x} m ; le DVCM classique n’est pas recommandé au-delà de 10%.","es":"La relación cavidad/volumen de tramo DVCM alcanzó {p}% en x={x} m; el DVCM clásico no se recomienda por encima del 10%.","pl":"Stosunek objętości kawerny do objętości odcinka DVCM osiągnął {p}% przy x={x} m; klasyczny DVCM nie jest zalecany powyżej 10%."},{"en":"Finite air-valve mass-balance residual is {m} kg ({p}% of admitted mass); refine the grid or review pocket-collapse resolution.","uk":"Нев’язка балансу маси скінченного повітряного клапана {m} kg ({p}% впущеної маси); згустіть сітку або перевірте розділення замикання порожнини.","de":"Massenbilanz-Residuum des endlichen Be-/Entlüftungsventils {m} kg ({p}% der eingelassenen Masse); Gitter verfeinern oder Auflösung des Polsterkollapses prüfen.","nl":"Massabalansresidu van de eindige be-/ontluchter {m} kg ({p}% van de toegelaten massa); verfijn het rooster of controleer de resolutie van het instorten van de zak.","fr":"Résidu du bilan de masse de la ventouse finie {m} kg ({p}% de la masse admise) ; affinez la grille ou vérifiez la résolution de l’effondrement de la poche.","es":"Residuo del balance de masa de la ventosa finita {m} kg ({p}% de la masa admitida); refine la malla o revise la resolución del colapso de la bolsa.","pl":"Residuum bilansu masy skończonego zaworu napowietrzającego {m} kg ({p}% wpuszczonej masy); zagęść siatkę lub sprawdź rozdzielczość zaniku poduszki."},{"en":"Retarded wall strain reached {e}; the linear small-strain Kelvin–Voigt assumption should be reviewed.","uk":"Запізніла деформація стінки досягла {e}; слід перевірити припущення лінійної малої деформації Kelvin–Voigt.","de":"Die verzögerte Wanddehnung erreichte {e}; die lineare Kelvin–Voigt-Annahme kleiner Dehnungen sollte geprüft werden.","nl":"De vertraagde wandrek bereikte {e}; de lineaire Kelvin–Voigt-aanname van kleine rek moet worden nagekeken.","fr":"La déformation retardée de la paroi a atteint {e} ; l’hypothèse linéaire de Kelvin–Voigt en petites déformations doit être revue.","es":"La deformación retardada de la pared alcanzó {e}; debe revisarse la hipótesis lineal de Kelvin–Voigt de pequeñas deformaciones.","pl":"Opóźnione odkształcenie ścianki osiągnęło {e}; należy sprawdzić liniowe założenie Kelvina–Voigta o małych odkształceniach."},{"en":"Suter table maximum angular gap is {g}°; dense data are preferable near sign changes and transitions.","uk":"Максимальний кутовий проміжок таблиці Suter {g}°; поблизу змін знака й переходів бажані щільніші дані.","de":"Die größte Winkellücke der Suter-Tabelle beträgt {g}°; nahe Vorzeichenwechseln und Übergängen sind dichtere Daten vorzuziehen.","nl":"De grootste hoekafstand van de Suter-tabel is {g}°; dichtere gegevens zijn wenselijk bij tekenwisselingen en overgangen.","fr":"L’écart angulaire maximal de la table de Suter est {g}° ; des données plus denses sont préférables près des changements de signe et des transitions.","es":"El salto angular máximo de la tabla de Suter es {g}°; conviene tener datos más densos cerca de cambios de signo y transiciones.","pl":"Maksymalna luka kątowa tablicy Sutera wynosi {g}°; w pobliżu zmian znaku i przejść lepsze są gęstsze dane."},{"en":"Suter/reference mismatch: at α=v=1 the table gives H/H*={x} instead of about 1.","uk":"Невідповідність Suter/номіналу: при α=v=1 таблиця дає H/H*={x} замість приблизно 1.","de":"Abweichung Suter/Nennpunkt: Bei α=v=1 liefert die Tabelle H/H*={x} statt etwa 1.","nl":"Afwijking Suter/referentie: bij α=v=1 geeft de tabel H/H*={x} in plaats van ongeveer 1.","fr":"Écart Suter/référence : à α=v=1 la table donne H/H*={x} au lieu d’environ 1.","es":"Discrepancia Suter/referencia: con α=v=1 la tabla da H/H*={x} en lugar de aproximadamente 1.","pl":"Niezgodność Suter/punkt znamionowy: przy α=v=1 tablica daje H/H*={x} zamiast około 1."},{"en":"Suter/reference mismatch: at α=v=1 the table gives M/M*={x} instead of about 1.","uk":"Невідповідність Suter/номіналу: при α=v=1 таблиця дає M/M*={x} замість приблизно 1.","de":"Abweichung Suter/Nennpunkt: Bei α=v=1 liefert die Tabelle M/M*={x} statt etwa 1.","nl":"Afwijking Suter/referentie: bij α=v=1 geeft de tabel M/M*={x} in plaats van ongeveer 1.","fr":"Écart Suter/référence : à α=v=1 la table donne M/M*={x} au lieu d’environ 1.","es":"Discrepancia Suter/referencia: con α=v=1 la tabla da M/M*={x} en lugar de aproximadamente 1.","pl":"Niezgodność Suter/punkt znamionowy: przy α=v=1 tablica daje M/M*={x} zamiast około 1."},{"en":"Rotor speed reached {p}% of reference speed; verify that the supplied 4Q data and inertia remain applicable.","uk":"Швидкість ротора досягла {p}% номінальної; перевірте, що задані дані 4Q та інерція залишаються застосовними.","de":"Die Rotordrehzahl erreichte {p}% der Nenndrehzahl; prüfen, ob die 4Q-Daten und die Trägheit anwendbar bleiben.","nl":"Het rotortoerental bereikte {p}% van het referentietoerental; controleer of de 4Q-gegevens en traagheid toepasbaar blijven.","fr":"La vitesse du rotor a atteint {p}% de la vitesse de référence ; vérifiez que les données 4Q et l’inertie restent applicables.","es":"La velocidad del rotor alcanzó {p}% de la velocidad de referencia; verifique que los datos 4Q y la inercia sigan siendo aplicables.","pl":"Prędkość wirnika osiągnęła {p}% prędkości znamionowej; sprawdź, czy podane dane 4Q i bezwładność pozostają stosowalne."},{"en":"FSI wall e/D={x} is relatively thick for the thin-wall four-equation model.","uk":"Стінка FSI e/D={x} відносно товста для тонкостінної чотирирівняльної моделі.","de":"Die FSI-Wand e/D={x} ist für das dünnwandige Vier-Gleichungs-Modell relativ dick.","nl":"De FSI-wand e/D={x} is relatief dik voor het dunwandige vier-vergelijkingenmodel.","fr":"La paroi FSI e/D={x} est relativement épaisse pour le modèle à quatre équations en paroi mince.","es":"La pared FSI e/D={x} es relativamente gruesa para el modelo de cuatro ecuaciones de pared delgada.","pl":"Ścianka FSI e/D={x} jest stosunkowo gruba dla czterorównaniowego modelu cienkościennego."},{"en":"The linear FSI solution crossed the vapor-pressure threshold; FSI–cavitation coupling is not solved, so post-threshold values are mathematical continuation only.","uk":"Лінійний розв’язок FSI перетнув поріг тиску насиченої пари; зв’язок FSI–кавітація не розв’язується, тому значення після порогу є лише математичним продовженням.","de":"Die lineare FSI-Lösung unterschritt die Dampfdruckschwelle; die FSI–Kavitations-Kopplung wird nicht gelöst, Werte nach der Schwelle sind nur mathematische Fortsetzung.","nl":"De lineaire FSI-oplossing passeerde de dampdrukdrempel; FSI–cavitatiekoppeling wordt niet opgelost, dus waarden na de drempel zijn slechts wiskundige voortzetting.","fr":"La solution FSI linéaire a franchi le seuil de pression de vapeur ; le couplage FSI–cavitation n’est pas résolu, les valeurs au-delà du seuil ne sont qu’une continuation mathématique.","es":"La solución FSI lineal cruzó el umbral de presión de vapor; el acoplamiento FSI–cavitación no se resuelve, así que los valores posteriores son solo continuación matemática.","pl":"Liniowe rozwiązanie FSI przekroczyło próg ciśnienia parowania; sprzężenie FSI–kawitacja nie jest rozwiązywane, więc wartości po progu są tylko matematycznym przedłużeniem."},{"en":"Slow FSI wave family: linear characteristic interpolation (Courant {c}) is predicted to damp the fundamental mode (wavelength 4L) by {p}% over the run (limit 1%); increase N or shorten the duration.","uk":"Повільна сім’я хвиль FSI: лінійна інтерполяція характеристик (Courant {c}) за прогнозом згасить основну моду (довжина хвилі 4L) на {p}% за розрахунок (межа 1%); збільште N або скоротіть тривалість.","de":"Langsame FSI-Wellenfamilie: Die lineare Charakteristiken-Interpolation (Courant {c}) dämpft die Grundmode (Wellenlänge 4L) voraussichtlich um {p}% über den Lauf (Grenze 1%); N erhöhen oder Dauer verkürzen.","nl":"Langzame FSI-golffamilie: lineaire karakteristiekeninterpolatie (Courant {c}) dempt de grondmode (golflengte 4L) naar verwachting met {p}% over de berekening (grens 1%); verhoog N of verkort de duur.","fr":"Famille d’ondes FSI lente : l’interpolation linéaire des caractéristiques (Courant {c}) devrait amortir le mode fondamental (longueur d’onde 4L) de {p}% sur le calcul (limite 1%) ; augmentez N ou réduisez la durée.","es":"Familia de ondas FSI lenta: la interpolación lineal de características (Courant {c}) amortiguaría el modo fundamental (longitud de onda 4L) un {p}% durante el cálculo (límite 1%); aumente N o acorte la duración.","pl":"Wolna rodzina fal FSI: liniowa interpolacja charakterystyk (Courant {c}) według prognozy wytłumi mod podstawowy (długość fali 4L) o {p}% w trakcie obliczenia (limit 1%); zwiększ N lub skróć czas trwania."},{"en":"The dynamic end-support mode has m=k=c=0 and is therefore mechanically identical to the free massless valve.","uk":"Режим динамічної кінцевої опори має m=k=c=0 і тому механічно тотожний вільному безмасовому клапану.","de":"Der dynamische Endlagermodus hat m=k=c=0 und ist daher mechanisch identisch mit dem freien masselosen Ventil.","nl":"De dynamische eindsteunmodus heeft m=k=c=0 en is daarom mechanisch identiek aan de vrije massaloze klep.","fr":"Le mode d’appui d’extrémité dynamique a m=k=c=0 et est donc mécaniquement identique à la vanne libre sans masse.","es":"El modo de apoyo de extremo dinámico tiene m=k=c=0 y es por tanto mecánicamente idéntico a la válvula libre sin masa.","pl":"Tryb dynamicznej podpory końcowej ma m=k=c=0, więc mechanicznie jest identyczny ze swobodnym bezmasowym zaworem."},{"en":"{k} must be finite.","uk":"{k} має бути скінченним.","de":"{k} muss endlich sein.","nl":"{k} moet eindig zijn.","fr":"{k} doit être fini.","es":"{k} debe ser finito.","pl":"{k} musi być liczbą skończoną."},{"en":"{k} must be positive.","uk":"{k} має бути додатним.","de":"{k} muss positiv sein.","nl":"{k} moet positief zijn.","fr":"{k} doit être positif.","es":"{k} debe ser positivo.","pl":"{k} musi być dodatnie."},{"en":"{k} must be finite in FSI mode.","uk":"{k} має бути скінченним у режимі FSI.","de":"{k} muss im FSI-Modus endlich sein.","nl":"{k} moet eindig zijn in FSI-modus.","fr":"{k} doit être fini en mode FSI.","es":"{k} debe ser finito en modo FSI.","pl":"{k} musi być liczbą skończoną w trybie FSI."},{"en":"{k} must be positive in Suter 4Q mode.","uk":"{k} має бути додатним у режимі Suter 4Q.","de":"{k} muss im Suter-4Q-Modus positiv sein.","nl":"{k} moet positief zijn in Suter-4Q-modus.","fr":"{k} doit être positif en mode Suter 4Q.","es":"{k} debe ser positivo en modo Suter 4Q.","pl":"{k} musi być dodatnie w trybie Suter 4Q."},{"en":"For this atmospheric-reservoir model, vapor pressure must be below atmospheric pressure.","uk":"Для цієї моделі з
