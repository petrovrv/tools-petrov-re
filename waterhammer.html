lecenie wyłączenia pompy","Calculated zero / reverse flow":"Obliczony przepływ zerowy / odwrotny","Delay after trigger":"Opóźnienie po wyzwoleniu","Open ΔH at Q₀":"Otwórz ΔH przy Q₀","Polytropic exponent γ":"Wykładnik politropowy γ","Connection length Lc":"Długość połączenia Lc","Connection diameter Dc":"Średnica przyłącza Dc","Connection minor-loss ΣK":"Połączenie o małej stracie ΣK","Lc=0 and ΣK=0 reproduces a direct vessel connection. The branch uses the main liquid properties and roughness.":"Lc=0 i ΣK=0 odtwarzają bezpośrednie połączenie naczynia. Odgałęzienie wykorzystuje główne właściwości cieczy i jej chropowatość.","Discharge coefficient C":"Współczynnik rozładowania C","Ideal mode clamps the node to atmospheric pressure whenever the unconstrained solution goes sub-atmospheric.":"Tryb idealny zaciska węzeł do ciśnienia atmosferycznego, gdy rozwiązanie bez ograniczeń staje się podciśnieniowe.","Method of Characteristics uses Δt = Δx/a, so Courant number = 1. Long runs are down-sampled only for display; extrema use every solver step.":"Metoda charakterystyk wykorzystuje Δt = Δx/a, więc liczba Couranta = 1. Długie przebiegi są próbkowane w dół tylko w celu wyświetlenia; ekstrema są wykorzystywane w każdym kroku rozwiązania.","Analytic invariants, literature reproduction and published experimental cross-checks. Experimental rows are INFO/WARN rather than release gates because raw measurement traces and the exact recorded valve Cv trajectory are not bundled. These remain self-tests;":"zaworu nie są ze sobą powiązane. Pozostają one autotestami;","gauge pressure [bar] · horizontal = pipe position · vertical = time":"ciśnienie manometryczne [bar] · poziomo = położenie rury · pionowo = czas","animated H(x,t)":"animowany H(x,t)","single-phase continuation":"kontynuacja jednofazowa","dark pixels = DVCM vapor cavity":"ciemne piksele = komora parowa DVCM","post-vapor-threshold continuation":"kontynuacja po progu parowania","Frequency-dependent unsteady friction is active; its memory term adds dissipation beyond the quasi-steady term. Short probe windows can be phase-sensitive, so assess decay over several 4L/a cycles.":"Zależne od częstotliwości tarcie niestacjonarne jest aktywne; jego okres pamięci dodaje rozproszenie poza okres quasi-stacjonarny. Krótkie okna sondy mogą być wrażliwe na fazę, dlatego należy oceniać zanik w ciągu kilku cykli 4L/a.","over":"nad","post-event cycles":"cykle powydarzeniowe","total":"całkowity","/cycle":"/cykl","M*>0 is the shaft torque absorbed by the pump at the reference pumping point; Wm carries the torque sign in other quadrants.":"M*>0 to moment obrotowy wału absorbowany przez pompę w punkcie odniesienia pompowania; Wm przenosi znak momentu obrotowego w pozostałych kwadrantach.","Quadratic mode is restricted to forward flow. Suter mode uses the exact convention θ = atan2(α,v), v = Q/Q*, α = n/n*, H/H* = Wh(θ)(α²+v²), M/M* = Wm(θ)(α²+v²). After trip, driver torque is zero and J determines rotor speed.":"a.","Pump trip, 4Q Suter and check-valve slam":"Awaria pompy, zawór 4Q i zamknięcie zaworu zwrotnego","ρaV₀ reference":"odniesienie ρaV₀","is false.":"jest fałszem."};
Object.assign(PL,{"The elastic liquid-column equations are integrated on a uniform x–t grid with Courant number one. The quasi-steady Darcy–Weisbach term is evaluated from the local flow at each characteristic foot: f=64/Re below Re=2000, iterative Colebrook–White above Re=4000, and a smooth numerical bridge over Re=2000…4000 (not a resolved transition-flow model).":"Równania sprężystego słupa cieczy są całkowane na jednorodnej siatce x–t z liczbą Couranta równą jeden. Quasi-ustalony człon Darcy’ego–Weisbacha jest wyznaczany z lokalnego przepływu w każdej stopie charakterystyki: f=64/Re dla Re<2000, iteracyjne równanie Colebrooka–White’a dla Re>4000 oraz gładkie przejście numeryczne w zakresie Re=2000…4000 (nie jest to rozwiązany model przepływu przejściowego).","Four convolution modes are available. Zielke uses a 26-term laminar weighting approximation and is restricted to initial Re≤2000. Frozen smooth-wall Vardy–Brown uses a 16-term turbulent weighting function based on the initial Re. Universal Zielke↔Vardy–Brown follows Urbanowicz, Zarzycki & Kudźma (2012): it retains 26 recursive history states while updating decay coefficients from the current local Reynolds number, avoiding a memory reset across Re=2320; its turbulent branch remains smooth-wall. ":"Dostępne są cztery tryby splotowe. Model Zielkego wykorzystuje 26-składnikowe przybliżenie funkcji wagowej dla przepływu laminarnego i jest ograniczony do początkowego Re≤2000. Zamrożony model Vardy’ego–Browna dla gładkiej ścianki wykorzystuje 16-składnikową turbulentną funkcję wagową opartą na początkowym Re. Uniwersalny model Zielke↔Vardy–Brown według Urbanowicza, Zarzyckiego i Kudźmy (2012) zachowuje 26 rekurencyjnych stanów historii, aktualizując współczynniki zaniku na podstawie bieżącej lokalnej liczby Reynoldsa, bez zerowania pamięci przy przejściu przez Re=2320; jego gałąź turbulentna nadal dotyczy gładkiej ścianki. ",", represented by the same 16 recursive exponentials and frozen at the initial state. This last mode is the fully-rough asymptote, not a general transitionally-rough wall model. Revision .22 introduced a Colebrook–White wall-regime guard: it compares the roughness and viscous terms in the Colebrook equation, reports their share and χ, and blocks smooth/fully-rough asymptotic kernels when the initial state is clearly mismatched. The 10/90% dominance thresholds are transparent sandbox guardrails, not code requirements.":", reprezentowany przez te same 16 rekurencyjnych funkcji wykładniczych i zamrożony w stanie początkowym. Ten ostatni tryb jest asymptotą całkowicie szorstkiej ścianki, a nie ogólnym modelem ścianki w obszarze przejściowej szorstkości. Rewizja .22 wprowadziła kontrolę reżimu ścianki Colebrooka–White’a: porównuje ona składnik szorstkości i lepkości w równaniu Colebrooka, podaje ich udział oraz χ i blokuje asymptotyczne jądra gładkie/całkowicie szorstkie, gdy stan początkowy jest wyraźnie niezgodny. Progi dominacji 10/90% są jawnymi ograniczeniami diagnostycznymi sandboxa, a nie wymaganiami normowymi.","The optional wall model follows the generalized Kelvin–Voigt retarded-strain formulation used by Covas et al. (2005). The entered elastic wave speed a₀ represents the instantaneous elastic compliance J₀. Each user row adds one retarded creep element Jₖ,τₖ; the solver stores its strain history at every MOC node and analytically advances the exponential memory over each time step. The resulting continuity equation is affine in the new head, so the same factor K=1+λᵥₑ is applied to interior nodes, boundaries and point devices.":"Opcjonalny model ścianki stosuje uogólnione sformułowanie Kelvina–Voigta z odkształceniem opóźnionym, używane przez Covasa i in. (2005). Wprowadzona sprężysta prędkość fali a₀ reprezentuje chwilową podatność sprężystą J₀. Każdy wiersz użytkownika dodaje jeden element pełzania opóźnionego Jₖ,τₖ; solver przechowuje historię jego odkształcenia w każdym węźle MOC i analitycznie aktualizuje pamięć wykładniczą w każdym kroku czasu. Wynikowe równanie ciągłości jest afiniczne względem nowej wysokości hydraulicznej, dlatego ten sam współczynnik K=1+λᵥₑ stosuje się do węzłów wewnętrznych, warunków brzegowych i urządzeń punktowych.","The creep table is retarded compliance only: do not enter J₀ again. Parameters are material, temperature, age and installation dependent and normally require test/calibration data.":"Tabela pełzania zawiera wyłącznie podatność opóźnioną: nie należy ponownie wprowadzać J₀. Parametry zależą od materiału, temperatury, wieku i sposobu montażu i zwykle wymagają danych z prób lub kalibracji.","The optional FSI branch uses the linear four-equation model of Tijsseling (2003): fluid pressure/velocity are coupled to axial pipe stress/velocity through Poisson contraction and junction conditions. The coupled wave families travel at ±λ₁ and ±λ₃. The upstream reservoir is structurally anchored. The downstream valve may be fixed, free and massless, or attached to an axial mass–spring–dashpot. A closed moving valve enforces V−uₚ=0; finite opening uses the same relative velocity in the orifice relation.":"Opcjonalna gałąź FSI wykorzystuje liniowy czterorównaniowy model Tijsselinga (2003): ciśnienie/prędkość cieczy są sprzężone z osiowym naprężeniem/prędkością rury przez efekt Poissona i warunki na połączeniach. Sprzężone rodziny fal propagują się z prędkościami ±λ₁ i ±λ₃. Zbiornik górny jest konstrukcyjnie zakotwiony. Zawór dolny może być zamocowany, swobodny i bezmasowy albo połączony z osiowym układem masa–sprężyna–tłumik. Zamknięty poruszający się zawór wymusza V−uₚ=0; dla skończonego otwarcia ta sama prędkość względna jest używana w zależności kryzy.","Intermediate supports follow the massless elastic-support balance used by Zanganeh, Keramat & Tijsseling (2026): fluid pressure and velocity and pipe axial velocity are continuous, while axial stress jumps according to (σ":"Podpory pośrednie wykorzystują bilans bezmasowej podpory sprężystej według Zanganeha, Keramata i Tijsselinga (2026): ciśnienie i prędkość cieczy oraz osiowa prędkość rury są ciągłe, natomiast naprężenie osiowe zmienia się skokowo zgodnie z (σ","x. End-support motion is integrated with Newmark average acceleration, following the dynamic-valve treatment of Henclik (2014/2018). Support displacement is measured from the initial prestressed equilibrium.":"x. Ruch podpory końcowej jest całkowany metodą Newmarka ze średnim przyspieszeniem, zgodnie z ujęciem dynamicznego zaworu Henclika (2014/2018). Przemieszczenie podpory jest mierzone od początkowego, wstępnie naprężonego położenia równowagi.","The FSI branch remains deliberately narrow: straight horizontal thin-wall pipe, linear elasticity, frictionless fluid/structure equations, no pump, DVCM, air valve, surge vessel, check valve or simultaneous viscoelastic wall. Intermediate supports are massless axial springs; gaps, dry friction, nonlinear supports, bending, elbows and junctions are outside this revision. Conventional characteristic interpolation is used for the slower wave family, so mesh convergence remains a release gate. Delft":"Zakres gałęzi FSI pozostaje celowo ograniczony: prosta pozioma rura cienkościenna, sprężystość liniowa, równania ciecz/konstrukcja bez tarcia, bez pompy, DVCM, zaworu napowietrzającego, zbiornika przeciwuderzeniowego, zaworu zwrotnego ani jednoczesnej lepkosprężystości ścianki. Podpory pośrednie są bezmasowymi sprężynami osiowymi; luzy, tarcie suche, podpory nieliniowe, zginanie, kolana i rozgałęzienia są poza zakresem tej rewizji. Dla wolniejszej rodziny fal używana jest klasyczna interpolacja charakterystyk, dlatego zbieżność względem siatki pozostaje warunkiem wydania. Delft","Hydraulic head H is solved along pipe chainage. Gauge pressure is p=ρg(H−z), so a local high point can control vapor-pressure margin even when the end pressures are acceptable. Profile mode linearly interpolates user x,z points onto the MOC grid; x is chainage along the modelled pipe length L.":"Wysokość hydrauliczna H jest rozwiązywana wzdłuż kilometrażu rury. Ciśnienie manometryczne wynosi p=ρg(H−z), dlatego lokalny punkt wysoki może decydować o zapasie do ciśnienia parowania nawet wtedy, gdy ciśnienia na końcach są dopuszczalne. Tryb profilu liniowo interpoluje podane przez użytkownika punkty x,z na siatkę MOC; x jest odległością wzdłuż modelowanej długości rury L.","The outlet valve is an ideal orifice. Its coefficient is inferred from the initial operating point, then multiplied by the commanded opening. Linear, smooth-cosine and power-law closure are available. Closing faster than the wave round-trip time produces a response approaching the Joukowsky limit.":"Zawór wylotowy jest modelowany jako idealna kryza. Jego współczynnik jest wyznaczany z początkowego punktu pracy, a następnie mnożony przez zadane otwarcie. Dostępne są prawa zamykania liniowe, gładkie kosinusowe i potęgowe. Zamknięcie szybsze niż czas przejścia fali tam i z powrotem prowadzi do odpowiedzi zbliżającej się do granicy Żukowskiego.",")/τ] and reverse pump flow is rejected. In Suter mode, user-supplied periodic Wh(θ), Wm(θ) data define all four flow/speed quadrants with θ = atan2(α,v), v=Q/Q* and α=n/n*. After trip the driver torque is set to zero and J·dω/dt = −M":")/τ], a przepływ wsteczny przez pompę jest odrzucany. W trybie Sutera podane przez użytkownika okresowe dane Wh(θ), Wm(θ) definiują wszystkie cztery ćwiartki przepływ/prędkość, gdzie θ = atan2(α,v), v=Q/Q* i α=n/n*. Po wyłączeniu moment napędowy jest ustawiany na zero, a J·dω/dt = −M","is integrated with a trapezoidal predictor/corrector coupled to the MOC pump boundary. The dynamic check valve keeps a prescribed travel after its trigger. The trigger may be the pump-trip command or the calculated flow crossing through zero; flow-triggered slam with an in-service pump requires Suter 4Q data so the pre-closure reverse flow is represented. Disc inertia and hydrodynamic torque are not solved.":"jest całkowane metodą trapezową predictor/corrector sprzężoną z warunkiem brzegowym pompy MOC. Dynamiczny zawór zwrotny po zadziałaniu realizuje zadany przebieg zamykania. Wyzwalaczem może być polecenie wyłączenia pompy albo obliczone przejście przepływu przez zero; uderzenie wyzwalane przepływem przy pracującej pompie wymaga danych Sutera 4Q, aby odwzorować przepływ wsteczny przed zamknięciem. Bezwładność grzybka/tarczy i moment hydrodynamiczny nie są rozwiązywane.","The surge vessel is a lumped gas cushion with pV":"Zbiornik przeciwuderzeniowy jest skupioną poduszką gazową z pV","= const. An optional connection branch solves its flow inertia together with quasi-steady Darcy/local loss; Lc=0 and ΣK=0 reduces to direct nodal continuity. Ideal air-valve mode is an atmospheric pressure clamp. Finite mode uses separate inlet/outlet orifices with compressible choking and a lumped isothermal ideal-gas pocket; the liquid-flow imbalance changes pocket volume while orifice mass flow changes the air mass.":"= const. Opcjonalna gałąź przyłączeniowa rozwiązuje bezwładność przepływu wraz z quasi-ustalonymi stratami Darcy’ego i miejscowymi; Lc=0 i ΣK=0 sprowadza model do bezpośredniej ciągłości węzłowej. Idealny tryb zaworu powietrznego jest ogranicznikiem do ciśnienia atmosferycznego. Tryb skończony wykorzystuje oddzielne kryzy wlotową/wylotową z dławieniem ściśliwym oraz skupioną izotermiczną kieszeń gazu doskonałego; niezbilansowanie przepływu cieczy zmienia objętość kieszeni, a masowy przepływ przez kryzę zmienia masę powietrza.","When DVCM is selected, a node that reaches vapor pressure is held at P":"Po wybraniu DVCM węzeł, który osiąga ciśnienie parowania, jest utrzymywany na P","while separate upstream/downstream characteristic flows grow or collapse a discrete vapor cavity using dV":"podczas gdy oddzielne przepływy charakterystyczne od strony górnej i dolnej powiększają lub zapadają dyskretną kawernę parową zgodnie z dV",". Cavities are fixed to MOC grid nodes and do not alter wave speed. ψ weights the current imbalance against the value two MOC steps earlier; the general sandbox default is ψ=0.55, while the Bergant literature benchmark uses its published ψ=1.0. A mesh-dependent nodal cavity/reach-volume ratio is reported and warns above 10%; it is a numerical DVCM diagnostic, not a physical distributed void fraction.":". Kawerny są przypisane do węzłów siatki MOC i nie zmieniają prędkości fali. ψ waży bieżące niezbilansowanie względem wartości sprzed dwóch kroków MOC; ogólna wartość domyślna sandboxa wynosi ψ=0,55, natomiast benchmark literaturowy Berganta używa opublikowanej wartości ψ=1,0. Podawany jest zależny od siatki stosunek objętości kawerny węzłowej do objętości odcinka, z ostrzeżeniem powyżej 10%; jest to numeryczna diagnostyka DVCM, a nie fizyczny rozłożony udział pustki.","The built-in suite checks exact MOC invariants, the Joukowsky jump and wave travel time, exact Colebrook–White turbulent friction, Zielke and Vardy–Brown weighting/recurrence, a published Adelaide laminar Zielke analytical case, Suter normalization, compressible air-orifice flow, coupled air-pocket mass balance, generalized Kelvin–Voigt retarded-strain recurrence/steady invariance, and literal transcription of the Covas et al. four-element PE creep spectrum. Its literature case reproduces the cl":"Wbudowany zestaw sprawdza dokładne niezmienniki MOC, skok Żukowskiego i czas przejścia fali, dokładne turbulentne tarcie Colebrooka–White’a, funkcje wagowe/rekurencję Zielkego i Vardy’ego–Browna, opublikowany analityczny laminarny przypadek Zielkego z Adelaide, normalizację Sutera, ściśliwy przepływ przez kryzę powietrzną, sprzężony bilans masy kieszeni powietrznej, rekurencję i niezmienność ustaloną uogólnionego opóźnionego odkształcenia Kelvina–Voigta oraz dosłowną transkrypcję czteroelementowego widma pełzania PE Covasa i in. Przypadek literaturowy odtwarza cl","=22 m, 9 ms downstream valve closure and ψ=1.0. The published classical-DVCM maxima are 102.7 m at 0.176 s for N=32 and 102.5 m at 0.178 s for N=128; the measured maximum is 95.6 m. Because the recorded valve/Cv trace is not embedded, this tool uses a smooth-cosine 9 ms closure as a documented surrogate. Sources: Bergant et al. (2007), TU/e CASA report 0729, for the classical-DVCM comparison; Vardy & Brown (1995) for the smooth-pipe transient-friction framework; Vardy & Brown (2004), Journal of Hydraulic Research, for the fully rough asymptote; Covas et al. (2005) for the viscoelastic wall; Tijsseling (2003) for the four-equation FSI model.":"=22 m, zamknięcie zaworu dolnego w 9 ms i ψ=1,0. Opublikowane maksima klasycznego DVCM wynoszą 102,7 m przy 0,176 s dla N=32 oraz 102,5 m przy 0,178 s dla N=128; zmierzone maksimum wynosi 95,6 m. Ponieważ zarejestrowany przebieg zaworu/Cv nie jest wbudowany, narzędzie wykorzystuje gładkie kosinusowe zamknięcie 9 ms jako udokumentowany surogat. Źródła: Bergant i in. (2007), raport TU/e CASA 0729 dla porównania klasycznego DVCM; Vardy i Brown (1995) dla modelu tarcia nieustalonego w gładkiej rurze; Vardy i Brown (2004), Journal of Hydraulic Research, dla asymptoty całkowicie szorstkiej; Covas i in. (2005) dla ścianki lepkosprężystej; Tijsseling (2003) dla czterorównaniowego modelu FSI."});
const siteLang=()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q&&String(q).slice(0,2).toLowerCase()==='pl')return'pl'}catch(e){}try{if(localStorage.getItem('diagram_site_lang')==='pl'||localStorage.getItem('diagram_lang')==='pl')return'pl'}catch(e){}return String(window.__diagramLang||'').slice(0,2).toLowerCase()};
if(siteLang()!=='pl')return;
document.documentElement.lang='pl';
const attrs=['placeholder','title','aria-label','alt'];
function tr(s){if(s==null)return s;const x=String(s);if(Object.prototype.hasOwnProperty.call(PL,x))return PL[x];const a=x.match(/^\s*/)[0],b=x.match(/\s*$/)[0],t=x.trim();if(Object.prototype.hasOwnProperty.call(PL,t))return a+PL[t]+b;const pz=t&&window.__whPatterns?window.__whPatterns.translate('pl',t,k=>Object.prototype.hasOwnProperty.call(PL,k)?PL[k]:null):null;if(pz!=null)return a+pz+b;return x}window.__plTr=tr;
function node(n){if(!n)return;if(n.nodeType===3){const p=n.parentElement;if(p&&!/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(p.tagName)){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}return}if(n.nodeType!==1)return;if(/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(n.tagName))return;for(const a of attrs)if(n.hasAttribute(a)){const v=n.getAttribute(a),w=tr(v);if(w!==v)n.setAttribute(a,w)}if(n.tagName==='INPUT'&&/^(button|submit|reset)$/i.test(n.type||'')){const v=n.value,w=tr(v);if(w!==v)n.value=w}const tw=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let q;while(q=tw.nextNode())node(q);for(const e of n.querySelectorAll('*'))for(const a of attrs)if(e.hasAttribute(a)){const v=e.getAttribute(a),w=tr(v);if(w!==v)e.setAttribute(a,w)}}
const run=()=>node(document.body);
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')node(m.target);else if(m.type==='attributes'){const el=m.target,v=el.getAttribute(m.attributeName),w=tr(v);if(v!=null&&w!==v)el.setAttribute(m.attributeName,w)}else for(const n of m.addedNodes)node(n)}}).observe(document.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:attrs});
})();
