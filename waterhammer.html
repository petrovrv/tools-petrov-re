  "description": {
    "en": "One-dimensional water-hammer sandbox using the Method of Characteristics for a uniform elastic pipe with either linear end elevations or a user-supplied piecewise-linear elevation profile. Configure a reservoir, pump curve, downstream valve, pump coast-down and check-valve closure. Optional point models add a gas-cushion surge vessel with optional connecting-branch inertia/losses and either an ideal atmospheric vacuum breaker or a finite-orifice air/vacuum valve with a lumped isothermal air pocket; a classical DVCM can represent vaporous column separation. The pump can use either the simple forward-flow quadratic model or user-supplied four-quadrant Suter Wh/Wm data with rotor inertia. Friction can be quasi-steady Darcy–Weisbach, Zielke frequency-dependent laminar friction, the continuous universal Zielke↔Vardy–Brown model with coefficients updated from the current local Reynolds number, or the efficient frozen-Re Vardy–Brown smooth-pipe turbulent convolution model. Results include an animated system schematic, x–t pressure heatmap, hydraulic grade line, pressure history at a selectable location, and maximum/minimum pressure envelope. A separate fully-rough Vardy–Brown mode uses the rough-wall asymptotic weighting coefficients from the current relative roughness and the initial Reynolds number. Optional linear pipe-wall viscoelasticity uses a user-supplied generalized Kelvin–Voigt creep spectrum; the entered a₀ is the instantaneous elastic wave speed and retarded strain is coupled consistently to all MOC boundaries and point devices. An optional axial four-equation FSI branch couples fluid pressure/velocity to pipe axial stress/velocity through Poisson and junction coupling; coupled wave speeds are computed from K, E, e, νp, ρ and ρs, with either a fixed or a free massless downstream valve boundary. FSI phase 2 adds a dynamic downstream valve support with optional lumped mass, axial spring and dashpot, plus any number of massless elastic intermediate axial supports entered by chainage and stiffness. The check-valve model defaults to Automatic: an ideal non-return valve when a pump is in service and none on a reservoir-only line.",
    "uk": "Одновимірний sandbox гідроудару на основі методу характеристик для однорідної пружної труби з лінійними кінцевими відмітками або заданим користувачем кусково-лінійним профілем висот. Налаштуйте резервуар, характеристику насоса, кінцевий клапан, вибіг насоса та закриття зворотного клапана. Додаткові точкові моделі додають газовий surge vessel з опційною інерцією/втратами приєднувальної гілки та або ідеальний атмосферний vacuum breaker, або повітряно-вакуумний клапан зі скінченними отворами й зосередженою ізотермічною повітряною кишенею; класична DVCM може моделювати парове розділення стовпа. Насос може використовувати просту квадратичну модель прямого потоку або задані користувачем чотириквадрантні дані Suter Wh/Wm з інерцією ротора. Тертя може бути квазістаціонарним Darcy–Weisbach, частотно-залежним ламінарним Zielke, безперервною універсальною моделлю Zielke↔Vardy–Brown з коефіцієнтами за поточним локальним числом Reynolds або ефективною турбулентною моделлю Vardy–Brown для гладкої труби з коефіцієнтами, зафіксованими за початковим Reynolds. Результати містять анімовану схему, x–t карту тиску, HGL, історію тиску у вибраній точці та огинаючу максимумів/мінімумів. Окремий режим Vardy–Brown для повністю шорсткої течії використовує асимптотичні коефіцієнти вагової функції шорсткої стінки за поточною відносною шорсткістю та початковим числом Reynolds. Опційна лінійна в’язкопружність стінки труби використовує заданий користувачем узагальнений спектр повзучості Kelvin–Voigt; введена a₀ є миттєвою пружною швидкістю хвилі, а запізніла деформація узгоджено зв’язана з усіма MOC-межами та точковими пристроями. Опційна осьова чотирирівняннева гілка FSI зв’язує тиск/швидкість рідини з осьовими напруженням/швидкістю труби через Poisson- та junction-зв’язок; зв’язані швидкості хвиль обчислюються з K, E, e, νp, ρ і ρs, а нижня межа може бути закріпленим або вільним безмасовим клапаном. FSI phase 2 додає динамічну опору кінцевого клапана з опційною зосередженою масою, осьовою пружиною та демпфером, а також довільну кількість безмасових пружних проміжних осьових опор, заданих пікетажем і жорсткістю. Типова модель зворотного клапана — «Автоматично»: ідеальний незворотний клапан, коли насос працює, і без клапана на лінії лише з резервуаром.",
    "de": "Eindimensionale Druckstoß-Sandbox mit dem Charakteristikenverfahren für ein gleichförmiges elastisches Rohr mit linearen Endhöhen oder einem benutzerdefinierten stückweise linearen Höhenprofil. Reservoir, Pumpenkennlinie, Endventil, Pumpenauslauf und Rückschlagventilschluss sind einstellbar. Optionale Punktmodelle ergänzen einen Gaspolster-Druckbehälter mit optionaler Trägheit/Verlusten der Anschlussleitung sowie wahlweise einen idealen atmosphärischen Vakuumbrecher oder ein Be-/Entlüftungsventil mit endlichen Öffnungen und konzentriertem isothermem Luftpolster; ein klassisches DVCM kann dampfbedingte Flüssigkeitssäulentrennung abbilden. Die Pumpe kann entweder das einfache quadratische Vorwärtsströmungsmodell oder benutzerdefinierte Vierquadranten-Suter-Daten Wh/Wm mit Rotorträgheit verwenden. Die Reibung kann quasistationär nach Darcy–Weisbach, frequenzabhängig nach Zielke für laminare Strömung, mit dem kontinuierlichen universellen Zielke↔Vardy–Brown-Modell mit Koeffizienten aus der aktuellen lokalen Reynolds-Zahl oder mit dem effizienten turbulenten Vardy–Brown-Modell für glatte Rohre bei eingefrorener Anfangs-Reynolds-Zahl gerechnet werden. Ausgaben sind animiertes Schema, x–t-Druckkarte, hydraulische Gradlinie, Druckverlauf an einem wählbaren Ort und Max/Min-Hüllkurve. Ein eigener Vardy–Brown-Modus für vollraue Strömung verwendet die asymptotischen Rauwand-Koeffizienten der Gewichtungsfunktion aus relativer Rauheit und anfänglicher Reynolds-Zahl. Optional kann eine lineare Rohrwand-Viscoelastizität mit einem benutzerdefinierten verallgemeinerten Kelvin–Voigt-Kriechspektrum berücksichtigt werden; a₀ ist dabei die momentane elastische Wellengeschwindigkeit und die verzögerte Dehnung ist konsistent an alle MOC-Randbedingungen und Punktmodelle gekoppelt. Ein optionaler axialer Viergleichungs-FSI-Zweig koppelt Flüssigkeitsdruck/-geschwindigkeit über Poisson- und Knoten-Kopplung an axiale Rohrspannung/-geschwindigkeit; die gekoppelten Wellengeschwindigkeiten werden aus K, E, e, νp, ρ und ρs berechnet, mit wahlweise festem oder freiem masselosem Ventil am Rohrende. FSI Phase 2 ergänzt eine dynamische Endventil-Lagerung mit optionaler konzentrierter Masse, axialer Feder und Dämpfer sowie beliebig viele masselose elastische axiale Zwischenlager, angegeben durch Stationierung und Steifigkeit. Das Rückschlagventilmodell ist standardmäßig „Automatisch“: ideales Rückschlagventil bei laufender Pumpe, keines bei einer reinen Behälterleitung.",
    "nl": "Eendimensionale waterslag-sandbox met de methode der karakteristieken voor een uniforme elastische leiding met lineaire eindhoogten of een door de gebruiker opgegeven stukgewijs lineair hoogteprofiel. Stel reservoir, pompcurve, eindklep, pompuitloop en sluiting van een terugslagklep in. Optionele puntmodellen voegen een gasgevuld expansievat met optionele traagheid/verliezen van de aansluitleiding toe en naar keuze een ideale atmosferische vacuümbreker of een lucht/vacuümklep met eindige openingen en een geconcentreerde isotherme luchtzak; een klassiek DVCM kan dampgedreven kolomscheiding modelleren. De pomp kan het eenvoudige kwadratische voorwaartse-stroommodel gebruiken of door de gebruiker aangeleverde vierkwadrant-Suter-gegevens Wh/Wm met rotortraagheid. Wrijving kan quasi-stationair Darcy–Weisbach zijn, frequentieafhankelijk volgens Zielke voor laminaire stroming, het continue universele Zielke↔Vardy–Brown-model met coëfficiënten uit het actuele lokale Reynoldsgetal, of het efficiënte turbulente Vardy–Brown-model voor gladde buizen met bevroren initieel Reynoldsgetal. Uitvoer omvat een geanimeerd schema, x–t-drukkaart, hydraulische gradiëntlijn, drukhistorie op een gekozen locatie en max/min-omhullende. Een afzonderlijke Vardy–Brown-modus voor volledig ruwe stroming gebruikt de asymptotische ruwe-wandcoëfficiënten van de wegingsfunctie uit relatieve ruwheid en het initiële Reynoldsgetal. Optioneel kan lineaire visco-elasticiteit van de buiswand worden gemodelleerd met een door de gebruiker opgegeven gegeneraliseerd Kelvin–Voigt-kruipspectrum; de ingevoerde a₀ is de onmiddellijke elastische golfsnelheid en de vertraagde rek is consistent gekoppeld aan alle MOC-randen en puntmodellen. Een optionele axiale FSI-tak met vier vergelijkingen koppelt vloeistofdruk/-snelheid via Poisson- en knooppuntkoppeling aan axiale buisspanning/-snelheid; de gekoppelde golfsnelheden worden berekend uit K, E, e, νp, ρ en ρs, met een vast of vrij massaloos eindventiel. FSI fase 2 voegt een dynamische eindklepsteun toe met optionele geconcentreerde massa, axiale veer en demper, plus een willekeurig aantal massaloze elastische axiale tussensteunen opgegeven met kettingage en stijfheid. Het terugslagklepmodel staat standaard op ‘Automatisch’: een ideale terugslagklep wanneer een pomp in bedrijf is en geen bij een leiding met alleen een reservoir.",
    "fr": "Banc d’essai unidimensionnel de coup de bélier utilisant la méthode des caractéristiques pour une conduite élastique uniforme, avec altitudes terminales linéaires ou profil altimétrique linéaire par morceaux fourni par l’utilisateur. Réglez réservoir, courbe de pompe, vanne aval, ralentissement de pompe et fermeture du clapet. Des modèles ponctuels optionnels ajoutent un réservoir anti-bélier à coussin de gaz avec inertie/pertes optionnelles de la conduite de raccordement et, au choix, un casse-vide atmosphérique idéal ou une soupape air/vide à orifices finis avec poche d’air isotherme concentrée ; un DVCM classique peut représenter la séparation de colonne par vaporisation. La pompe peut utiliser soit le modèle quadratique simple à débit direct, soit des données Suter quatre quadrants Wh/Wm fournies par l’utilisateur avec inertie du rotor. Le frottement peut être quasi stationnaire Darcy–Weisbach, fréquentiel selon Zielke en régime laminaire, utiliser le modèle universel continu Zielke↔Vardy–Brown dont les coefficients suivent le Reynolds local courant, ou le modèle turbulent efficace Vardy–Brown pour conduite lisse avec Reynolds initial figé. Les résultats comprennent schéma animé, carte de pression x–t, ligne piézométrique, historique de pression en un point choisi et enveloppe max/min. Un mode Vardy–Brown distinct pour l’écoulement pleinement rugueux utilise les coefficients asymptotiques de paroi rugueuse de la fonction de pondération à partir de la rugosité relative et du Reynolds initial. Une viscoélasticité linéaire optionnelle de la paroi utilise un spectre de fluage Kelvin–Voigt généralisé fourni par l’utilisateur ; a₀ est la célérité élastique instantanée et la déformation retardée est couplée de façon cohérente à toutes les conditions aux limites MOC et aux modèles ponctuels. Une branche FSI axiale optionnelle à quatre équations couple pression/vitesse du liquide à contrainte/vitesse axiales de la conduite par couplages de Poisson et de jonction ; les célérités couplées sont calculées à partir de K, E, e, νp, ρ et ρs, avec une vanne aval fixe ou libre et sans masse. La phase 2 FSI ajoute un support dynamique de vanne aval avec masse concentrée, ressort axial et amortisseur optionnels, ainsi qu’un nombre quelconque de supports axiaux intermédiaires élastiques sans masse définis par chaînage et raideur. Le modèle de clapet est « Automatique » par défaut : clapet anti-retour idéal lorsqu’une pompe est en service, aucun sur une ligne alimentée par un seul réservoir.",
    "es": "Banco unidimensional de golpe de ariete mediante el método de las características para una tubería elástica uniforme, con cotas extremas lineales o un perfil de elevación lineal por tramos proporcionado por el usuario. Configure depósito, curva de bomba, válvula aguas abajo, desaceleración de la bomba y cierre de la válvula de retención. Modelos puntuales opcionales añaden un depósito antiariete con cojín de gas e inercia/pérdidas opcionales de la conexión y, a elección, un rompevacío atmosférico ideal o una válvula de aire/vacío con orificios finitos y una bolsa de aire isotérmica concentrada; un DVCM clásico puede representar la separación de columna por vaporización. La bomba puede usar el modelo cuadrático simple de flujo directo o datos Suter de cuatro cuadrantes Wh/Wm proporcionados por el usuario con inercia del rotor. La fricción puede ser Darcy–Weisbach cuasiestacionaria, dependiente de la frecuencia según Zielke para flujo laminar, usar el modelo universal continuo Zielke↔Vardy–Brown cuyos coeficientes siguen el Reynolds local actual, o el modelo turbulento eficiente Vardy–Brown para tubería lisa con Reynolds inicial congelado. Los resultados incluyen esquema animado, mapa x–t de presión, línea piezométrica, historial de presión en una ubicación seleccionable y envolvente máxima/mínima. Un modo Vardy–Brown separado para flujo completamente rugoso usa los coeficientes asintóticos de pared rugosa de la función de ponderación a partir de la rugosidad relativa y del Reynolds inicial. La viscoelasticidad lineal opcional de la pared usa un espectro de fluencia Kelvin–Voigt generalizado suministrado por el usuario; a₀ es la velocidad de onda elástica instantánea y la deformación retardada se acopla de forma coherente a todos los contornos MOC y modelos puntuales. Una rama FSI axial opcional de cuatro ecuaciones acopla presión/velocidad del líquido con tensión/velocidad axiales de la tubería mediante acoplamiento de Poisson y de unión; las velocidades de onda acopladas se calculan a partir de K, E, e, νp, ρ y ρs, con una válvula aguas abajo fija o libre y sin masa. La fase 2 de FSI añade un apoyo dinámico de la válvula aguas abajo con masa concentrada, resorte axial y amortiguador opcionales, además de cualquier número de apoyos axiales intermedios elásticos sin masa definidos por progresiva y rigidez. El modelo de válvula de retención es «Automático» por defecto: válvula antirretorno ideal cuando hay una bomba en servicio y ninguna en una línea solo con depósito.",
    "pl": "Jednowymiarowy model uderzenia hydraulicznego z wykorzystaniem metody charakterystyk dla jednorodnej rury sprężystej o liniowych rzędnych końcowych lub dostarczonym przez użytkownika, odcinkowo-liniowym profilu wysokości. Skonfiguruj zbiornik, krzywą pompy, zawór wylotowy, wybieg pompy i zamknięcie zaworu zwrotnego. Opcjonalne modele punktowe dodają zbiornik wyrównawczy z poduszką gazową z opcjonalną bezwładnością/stratami odgałęzienia łączącego oraz idealny przerywacz próżni atmosferycznej lub zawór powietrzno-próżniowy o skończonym otworze z izotermiczną kieszenią powietrzną; klasyczny model DVCM może reprezentować separację kolumny parowej. Pompa może wykorzystywać prosty model kwadratowy przepływu do przodu lub dostarczone przez użytkownika dane Sutera Wh/Wm z bezwładnością wirnika. Tarcie może być quasi-stacjonarnym modelem Darcy'ego-Weisbacha, tarciem laminarnym Zielkego zależnym od częstotliwości, ciągłym uniwersalnym modelem Zielkego↔Vardy'ego-Browna ze współczynnikami aktualizowanymi na podstawie bieżącej lokalnej liczby Reynoldsa lub efektywnym modelem turbulentnego splotu rur gładkich Vardy'ego-Browna z zamrożoną metodą Re. Wyniki obejmują animowany schemat układu, mapę cieplną ciśnienia x–t, linię niwelety hydraulicznej, historię ciśnienia w wybranym miejscu oraz obwiednię ciśnienia maksymalnego/minimalnego. Oddzielny, w pełni zgrubny tryb Vardy'ego-Browna wykorzystuje asymptotyczne współczynniki ważenia ścianki szorstkiej z bieżącej względnej chropowatości i początkowej liczby Reynoldsa. Opcjonalna liniowa lepkosprężystość ścianki rury wykorzystuje dostarczone przez użytkownika uogólnione widmo pełzania Kelvina-Voigta; wprowadzone a₀ to chwilowa prędkość fali sprężystej, a odkształcenie opóźnione jest spójnie sprzężone ze wszystkimi granicami MOC i urządzeniami punktowymi. Opcjonalna, osiowa, czterorównaniowa gałąź FSI łączy ciśnienie/prędkość cieczy z naprężeniem/prędkością osiową rurociągu poprzez rozkład Poissona i sprzężenie złączy; sprzężone prędkości fal obliczane są na podstawie K, E, e, νp, ρ i ρs, z ustaloną lub swobodną, ​​bezmasową granicą zaworu po stronie wylotowej. Faza 2 FSI dodaje dynamiczne podparcie zaworu po stronie wylotowej z opcjonalną masą skupioną, sprężyną osiową i tłumikiem drgań, a także dowolną liczbę bezmasowych, elastycznych, pośrednich podparć osiowych, wprowadzanych przez łańcuch i sztywność. Domyślny model zaworu zwrotnego to „Automatyczny”: idealny zawór zwrotny, gdy pompa pracuje, i brak zaworu w linii zasilanej tylko ze zbiornika."

  "limitations": {
    "en": "One-dimensional single-pipe model with constant liquid density and wave speed. The pipe is hydraulically uniform; elevation may be linear or piecewise-linear along chainage, but branches, multiple pipes and distributed leakage are not included. Darcy friction may be quasi-steady or use frequency-dependent weighting functions. Zielke mode uses a 26-term laminar weighting approximation and is restricted to initial Re≤2000. Universal mode follows Urbanowicz–Zarzycki–Kudźma (2012): the same 26 history states are retained while the weighting coefficients are updated from the current local Reynolds number, using Recr=2320 and a smooth-pipe Vardy–Brown-convergent branch above Recr. Frozen Vardy–Brown mode uses smooth-pipe turbulent coefficients fixed at the initial Reynolds number for Re>2000; the quasi-steady Darcy term still uses the entered roughness. Universal mode is a continuous weighting-function model, not a resolved model of intermittent laminar–turbulent transition physics; A separate fully-rough Vardy–Brown mode uses A*=0.0103√Re(ε/D)^0.39 and B*=0.352Re(ε/D)^0.41 for 10⁻⁶≤ε/D≤10⁻² with coefficients frozen at the initial state; transitionally rough unsteady weighting is not modelled; a Colebrook–White term-dominance guard flags this gap and blocks clearly mismatched smooth/fully-rough asymptotic kernels. Pump behaviour can use a simple quadratic forward-flow head curve with prescribed exponential coast-down, in which reverse flow through an in-service pump is rejected, or user-supplied four-quadrant Suter Wh/Wm data. In Suter mode a combined pump/motor rotor inertia is integrated after trip with zero driver torque; shaft friction, motor/generator electrical dynamics, and torsional shaft dynamics are not modelled. Suter accuracy is entirely dependent on the supplied reference values and complete four-quadrant table. The dynamic check valve uses a user-prescribed closure travel that can be triggered either by pump trip or by the calculated zero/reversal of flow; the latter requires Suter 4Q pump data when a pump is in service. Disc inertia and hydrodynamic torque are not solved, so the closing trajectory remains prescribed after the trigger. The downstream valve is an ideal orifice calibrated to the initial operating point. The surge vessel is a lumped polytropic gas-cushion model; an optional single connecting branch adds liquid inertia plus quasi-steady Darcy/local losses, but gas dissolution, thermal stratification and vessel/branch geometry beyond this 1D lumped representation are not solved. The air/vacuum device can be an ideal atmospheric pressure clamp or a finite-orifice model with separate inlet/outlet diameters, compressible choked/subcritical air flow and a lumped isothermal ideal-gas pocket. The finite model does not track a moving air-water interface, valve float/disc dynamics, heat transfer, moisture, or distributed air; large pocket volumes relative to one MOC reach are warned and mixed air-vapor cavities at the same node are not solved. Vaporous column separation can be represented with the optional classical DVCM, which concentrates vapor cavities at grid nodes, assumes unchanged wave speed, and can produce mesh-dependent or spurious pressure spikes at cavity collapse; a mesh-dependent nodal cavity/reach-volume diagnostic warns above 10%, where classical DVCM is not recommended; the alternative threshold-only mode does not solve cavities. Dissolved gas is not solved; fluid–structure interaction is available only in the separate restricted axial FSI branch described below. Atmospheric and vapor pressures are user inputs. Use measured wave speed and manufacturer transient data for design work.  Optional pipe-wall viscoelasticity is a small-strain linear generalized Kelvin–Voigt model with uniform wall thickness and constraint coefficient; a₀ must already represent instantaneous elastic compliance J₀, while the entered Jk,τk describe only retarded creep. Creep parameters are not inferred from material name and must be measured or calibrated; nonlinear/temperature/age-dependent viscoelasticity, changing geometry remains outside the viscoelastic branch. The separate axial FSI branch follows the linear elastic four-equation model for a straight, horizontal, thin-walled uniform pipe. It includes distributed Poisson coupling and downstream junction coupling, but the current FSI branch is frictionless and excludes pumps, check valves, surge vessels, air valves, DVCM/cavitation coupling and simultaneous viscoelastic-wall coupling. Conventional characteristic interpolation is used for the slower FSI wave family and introduces mesh-dependent numerical damping/dispersion; the built-in suite therefore includes a mesh-convergence gate. Delft Benchmark A is a numerical benchmark without experimental data. End-support dynamics use Newmark average acceleration; intermediate supports are massless axial springs and create an axial-stress jump while keeping fluid pressure/velocity and pipe axial velocity continuous. Support motion is small-displacement and one-dimensional; gaps, Coulomb friction, nonlinear stiffness, support mass at intermediate locations, bending, elbows and T-junctions are not yet solved. When a DVCM cavity collapses, the node restarts single-phase from both characteristics; if that head lies below vapour pressure, the node is held at vapour pressure and a new cavity starts from zero volume.",
    "uk": "Одновимірна модель однієї труби зі сталою густиною рідини та швидкістю хвилі. Труба гідравлічно однорідна; висотний профіль може бути лінійним або кусково-лінійним уздовж пікетажу, але розгалуження, кілька труб і розподілені витоки не враховано. Тертя Darcy може бути квазістаціонарним або використовувати частотно-залежні вагові функції. Режим Zielke використовує 26-членну апроксимацію ламінарної вагової функції та обмежений початковим Re≤2000. Універсальний режим відповідає Urbanowicz–Zarzycki–Kudźma (2012): ті самі 26 станів історії зберігаються, а коефіцієнти вагової функції оновлюються за поточним локальним Reynolds; використовується Recr=2320 і вище Recr — гілка, що збігається до Vardy–Brown для гладкої труби. Режим Vardy–Brown використовує турбулентні коефіцієнти гладкої труби, зафіксовані за початковим Re>2000; квазістаціонарна частина Darcy все одно враховує введену шорсткість. Універсальний режим є безперервною моделлю вагової функції, а не моделлю переміжної фізики ламінарно-турбулентного переходу; Окремий повністю шорсткий режим Vardy–Brown використовує A*=0.0103√Re(ε/D)^0.39 та B*=0.352Re(ε/D)^0.41 для 10⁻⁶≤ε/D≤10⁻² з коефіцієнтами, зафіксованими за початковим станом; нестаціонарне тертя перехідно-шорстких стінок не моделюється; діагностика домінування членів Colebrook–White позначає цю прогалину та блокує явно невідповідні гладкі/повністю шорсткі асимптотичні ядра. Насос може використовувати просту квадратичну характеристику прямого потоку із заданим експоненційним вибігом, де зворотний потік через насос у роботі відхиляється, або задані користувачем чотириквадрантні дані Suter Wh/Wm. У режимі Suter після trip інтегрується сумарна інерція ротора насоса/двигуна за нульового приводного моменту; тертя вала, електрична динаміка двигуна/генератора та крутильна динаміка вала не моделюються. Точність Suter повністю залежить від заданих опорних величин і повної чотириквадрантної таблиці. Динамічний зворотний клапан використовує заданий користувачем хід закриття, який може запускатися trip насоса або розрахованим переходом витрати через нуль/у зворотний напрям; для другого режиму при працюючому насосі потрібні Suter 4Q дані. Інерція диска та гідродинамічний момент не розв’язуються, тому траєкторія закриття після trigger залишається заданою. Кінцевий клапан — ідеальний отвір, калібрований за початковою робочою точкою. Surge vessel — зосереджена політропна модель газової подушки; опційна одна приєднувальна гілка враховує інерцію рідини та квазістаціонарні Darcy/місцеві втрати, але розчинення газу, теплова стратифікація та детальна геометрія бака/гілки не розв’язуються. Повітряно-вакуумний пристрій може бути ідеальним затискачем до атмосферного тиску або моделлю зі скінченними окремими впускним/випускним отворами, стисливим дозвуковим/критичним потоком повітря та зосередженою ізотермічною кишенею ідеального газу. Скінченна модель не відстежує рухому межу вода–повітря, динаміку поплавка/диска, теплообмін, вологу чи розподілене повітря; великі об’єми відносно одного MOC-відрізка позначаються, а змішана повітряно-парова порожнина в одному вузлі не розв’язується. Парове розділення стовпа можна моделювати опційною класичною DVCM, яка зосереджує парові порожнини у вузлах сітки, не змінює швидкість хвилі та може давати залежні від сітки або штучні піки тиску під час схлопування; сітково-залежний контроль відношення об’єму вузлової парової порожнини до об’єму MOC-відрізка попереджає вище 10%, де класичну DVCM застосовувати не рекомендується; це чисельний діагностичний показник, а не фізична локальна частка порожнин; альтернативний режим лише порога не розв’язує порожнини. Розчинений газ не моделюється; взаємодія рідина–конструкція доступна лише в окремій обмеженій осьовій гілці FSI, описаній нижче. Для проєктування потрібні виміряна швидкість хвилі та transient-дані виробників.  Опційна в’язкопружність стінки — це лінійна малодеформаційна узагальнена модель Kelvin–Voigt зі сталою товщиною стінки та коефіцієнтом закріплення; a₀ має вже враховувати миттєву пружну податливість J₀, а введені Jk,τk описують лише запізнілу повзучість. Параметри повзучості не визначаються автоматично за назвою матеріалу й мають бути виміряні або відкалібровані; нелінійна, температурна та вікова в’язкопружність і зміна геометрії залишаються поза в’язкопружною гілкою. Окрема осьова гілка FSI використовує лінійно-пружну чотирирівнянневу модель для прямої горизонтальної однорідної тонкостінної труби. Вона враховує розподілений Poisson-зв’язок і junction-зв’язок на нижній межі, але у поточна гілка FSI не враховує тертя та не підтримує насоси, зворотні клапани, surge vessel, повітряні клапани, зв’язування DVCM/кавітації або одночасну в’язкопружність стінки. Для повільнішої FSI-хвилі використовується інтерполяція характеристик, що дає залежні від сітки чисельні демпфування/дисперсію; тому вбудований suite містить mesh-convergence gate. Delft Benchmark A є чисельним тестом без експериментальних даних. Динаміка кінцевої опори інтегрується методом Newmark із середнім прискоренням; проміжні опори є безмасовими осьовими пружинами, що створюють стрибок осьового напруження при неперервних тиску/швидкості рідини та осьовій швидкості труби. Рух опор малий і одновимірний; зазори, кулонівське тертя, нелінійна жорсткість, маса проміжних опор, згин, коліна та T-відгалуження ще не розв’язуються. Коли порожнина DVCM замикається, вузол переходить до однофазного розв’язку з обох характеристик; якщо цей напір нижчий за тиск насиченої пари, вузол утримується на тиску пари й нова порожнина починається з нульового об’єму.",
    "de": "Eindimensionales Einrohrmodell mit konstanter Flüssigkeitsdichte und Wellengeschwindigkeit. Das Rohr ist hydraulisch gleichförmig; die Höhenlage kann entlang der Stationierung linear oder stückweise linear sein, Verzweigungen, mehrere Leitungen und verteilte Leckage sind jedoch nicht enthalten. Darcy-Reibung kann quasistationär oder mit frequenzabhängigen Gewichtungsfunktionen gerechnet werden. Der Zielke-Modus verwendet eine 26-gliedrige Näherung der laminaren Gewichtungsfunktion und ist auf anfängliches Re≤2000 beschränkt. Der universelle Modus folgt Urbanowicz–Zarzycki–Kudźma (2012): dieselben 26 Historienzustände bleiben erhalten, während die Gewichtungskoeffizienten aus der aktuellen lokalen Reynolds-Zahl mit Recr=2320 aktualisiert werden; oberhalb Recr wird ein gegen Vardy–Brown für glatte Rohre konvergierender Zweig verwendet. Der eingefrorene Vardy–Brown-Modus verwendet Turbulenzkoeffizienten für glatte Rohre bei der Anfangs-Reynolds-Zahl Re>2000; der quasistationäre Darcy-Anteil berücksichtigt weiterhin die eingegebene Rauheit. Der universelle Modus ist eine kontinuierliche Gewichtungsfunktion und kein aufgelöstes Modell intermittierender laminar-turbulenter Übergangsphysik; Ein eigener vollrauer Vardy–Brown-Modus verwendet A*=0.0103√Re(ε/D)^0.39 und B*=0.352Re(ε/D)^0.41 für 10⁻⁶≤ε/D≤10⁻² mit auf dem Anfangszustand eingefrorenen Koeffizienten; instationäre Gewichtung im Übergangs-Rauheitsbereich wird nicht modelliert; eine Colebrook–White-Dominanzdiagnose kennzeichnet diese Lücke und sperrt klar unpassende glatte bzw. vollraue asymptotische Kerne. Die Pumpe kann eine einfache quadratische Vorwärtsströmungskennlinie mit vorgegebenem exponentiellem Auslauf verwenden, bei der Rückströmung durch die laufende Pumpe abgewiesen wird, oder benutzerdefinierte Vierquadranten-Suter-Daten Wh/Wm. Im Suter-Modus wird nach dem Trip die kombinierte Rotorträgheit von Pumpe und Motor bei null Antriebsmoment integriert; Wellenreibung, elektrische Motor/Generator-Dynamik und Torsionsdynamik der Welle werden nicht modelliert. Die Genauigkeit hängt vollständig von den angegebenen Bezugsgrößen und der vollständigen Vierquadrantentabelle ab. Das dynamische Rückschlagventil verwendet einen vorgegebenen Schließweg, der entweder durch Pumpentrip oder durch den berechneten Nulldurchgang bzw. die Umkehr der Strömung ausgelöst werden kann; bei laufender Pumpe erfordert letzteres Suter-4Q-Daten. Klappenträgheit und hydrodynamisches Drehmoment werden nicht gelöst, daher bleibt die Schließtrajektorie nach dem Auslöser vorgegeben. Das Endventil ist eine ideale Blende, auf den Anfangsbetriebspunkt kalibriert. Der Druckbehälter ist ein konzentriertes polytropes Gaspolstermodell; eine optionale einzelne Anschlussleitung berücksichtigt Flüssigkeitsträgheit sowie quasistationäre Darcy-/Einzelverluste, nicht jedoch Gaslösung, thermische Schichtung oder detaillierte Behälter-/Leitungsgeometrie. Das Be-/Entlüftungsgerät kann als ideale Atmosphärendruckbegrenzung oder mit endlichen getrennten Ein-/Auslassöffnungen, kompressibler unterkritischer/abgeschnürter Luftströmung und konzentriertem isothermem Idealgaspolster gerechnet werden. Das endliche Modell verfolgt keine bewegte Luft-Wasser-Grenze, Schwimmer-/Klappendynamik, Wärmeübertragung, Feuchte oder verteilte Luft; große Luftvolumina relativ zu einer MOC-Zelle werden gewarnt und gemischte Luft-Dampf-Hohlräume am selben Knoten nicht gelöst. Dampfbedingte Säulentrennung kann optional mit dem klassischen DVCM abgebildet werden; dabei werden Dampfhohlräume an Gitterknoten konzentriert, die Wellengeschwindigkeit bleibt unverändert und beim Kollaps können netzabhängige oder künstliche Druckspitzen entstehen. Eine netzabhängige Prüfung des Verhältnisses von Knoten-Kavitätsvolumen zu MOC-Zellvolumen warnt oberhalb 10 %, wo das klassische DVCM nicht empfohlen wird; dies ist eine numerische Diagnose und kein physikalischer lokaler Hohlraumanteil. Der alternative reine Schwellenmodus löst keine Hohlräume. Gelöstes Gas wird nicht modelliert; Fluid-Struktur-Kopplung ist nur im separaten, eingeschränkten axialen FSI-Zweig verfügbar, der unten beschrieben ist. Für Auslegung sind gemessene Wellengeschwindigkeit und Hersteller-Transientendaten erforderlich.  Die optionale Rohrwand-Viscoelastizität ist ein lineares Kleinverformungsmodell nach verallgemeinertem Kelvin–Voigt mit gleichförmiger Wanddicke und Zwangskoeffizient; a₀ muss die momentane elastische Nachgiebigkeit J₀ bereits enthalten, während Jk,τk nur die verzögerte Kriechantwort beschreiben. Kriechparameter werden nicht aus dem Werkstoffnamen abgeleitet, sondern müssen gemessen oder kalibriert werden; nichtlineare, temperatur- oder alterungsabhängige Viscoelastizität und Geometrieänderungen bleiben außerhalb des viskoelastischen Zweigs. Der separate axiale FSI-Zweig folgt dem linear-elastischen Viergleichungsmodell für ein gerades, horizontales, gleichförmiges dünnwandiges Rohr. Er enthält verteilte Poisson-Kopplung und Knoten-Kopplung am Rohrende; Der aktuelle FSI-Zweig ist jedoch reibungsfrei und schließt Pumpen, Rückschlagventile, Druckbehälter, Be-/Entlüftungsventile, DVCM/Kavitationskopplung und gleichzeitige viskoelastische Wandkopplung aus. Für die langsamere FSI-Wellenfamilie wird Charakteristikeninterpolation verwendet, die netzabhängige numerische Dämpfung/Dispersion erzeugt; die Prüfsuite enthält deshalb einen Netzkonvergenz-Gate. Delft Benchmark A ist ein numerischer Benchmark ohne Versuchsdaten. Die Dynamik der Endlagerung wird mit Newmark-Mittelbeschleunigung integriert; Zwischenlager sind masselose axiale Federn, die einen Sprung der axialen Rohrspannung bei stetigem Flüssigkeitsdruck/-geschwindigkeit und stetiger axialer Rohrgeschwindigkeit erzeugen. Kleine eindimensionale Bewegungen werden vorausgesetzt; Spiel, Coulomb-Reibung, nichtlineare Steifigkeit, Zwischenlagermassen, Biegung, Bögen und T-Stücke werden noch nicht gelöst. Kollabiert ein DVCM-Hohlraum, startet der Knoten einphasig aus beiden Charakteristiken neu; liegt diese Druckhöhe unter dem Dampfdruck, wird der Knoten auf Dampfdruck gehalten und ein neuer Hohlraum beginnt mit dem Volumen null.",
    "nl": "Eendimensionaal model van één leiding met constante vloeistofdichtheid en golfsnelheid. De leiding is hydraulisch uniform; de hoogte kan langs de kettingage lineair of stukgewijs lineair zijn, maar vertakkingen, meerdere leidingen en verdeelde lekkage zijn niet opgenomen. Darcy-wrijving kan quasi-stationair zijn of frequentieafhankelijke wegingsfuncties gebruiken. De Zielke-modus gebruikt een 26-term benadering van de laminaire wegingsfunctie en is beperkt tot een initieel Re≤2000. De universele modus volgt Urbanowicz–Zarzycki–Kudźma (2012): dezelfde 26 historiestaten blijven behouden terwijl de wegingscoëfficiënten worden bijgewerkt met het actuele lokale Reynoldsgetal, met Recr=2320 en boven Recr een tak die naar Vardy–Brown voor gladde buizen convergeert. De bevroren Vardy–Brown-modus gebruikt turbulente coëfficiënten voor gladde buizen bij het initiële Re>2000; de quasi-stationaire Darcy-term gebruikt nog steeds de ingevoerde ruwheid. De universele modus is een continue wegingsfunctie, geen opgelost model van intermitterende laminaire-turbulente overgangsfysica; Een afzonderlijke volledig-ruwe Vardy–Brown-modus gebruikt A*=0.0103√Re(ε/D)^0.39 en B*=0.352Re(ε/D)^0.41 voor 10⁻⁶≤ε/D≤10⁻² met coëfficiënten bevroren op de begintoestand; onstationaire weging in het overgangsruwheidsgebied wordt niet gemodelleerd; een Colebrook–White-dominantiediagnose markeert deze leemte en blokkeert duidelijk verkeerd toegepaste gladde/volledig-ruwe asymptotische kernels. De pomp kan een eenvoudig kwadratisch voorwaarts-stroommodel met voorgeschreven exponentiële uitloop gebruiken, waarbij terugstroming door een draaiende pomp wordt geweigerd, of door de gebruiker aangeleverde vierkwadrant-Suter-gegevens Wh/Wm. In Suter-modus wordt na trip de gecombineerde rotortraagheid van pomp en motor geïntegreerd bij nul aandrijfkoppel; aswrijving, elektrische motor/generatordynamica en torsiedynamica van de as worden niet gemodelleerd. De nauwkeurigheid hangt volledig af van de opgegeven referentiewaarden en de volledige vierkwadranttabel. De dynamische terugslagklep gebruikt een voorgeschreven sluitbeweging die kan worden gestart door pompuitval of door de berekende nuldoorgang/omkering van de stroming; bij een draaiende pomp vereist die laatste modus Suter-4Q-data. Klepinertie en hydrodynamisch koppel worden niet opgelost, zodat het sluittraject na de trigger voorgeschreven blijft. De eindklep is een ideale opening die op het begintoestandspunt wordt gekalibreerd. Het expansievat is een lumped polytroop gasmodel; een optionele enkele aansluitleiding omvat vloeistoftraagheid en quasi-stationaire Darcy-/lokale verliezen, maar geen gasoplossing, thermische stratificatie of gedetailleerde vat-/leidinggeometrie. De lucht/vacuümvoorziening kan een ideale atmosferische drukbegrenzing zijn of een model met eindige afzonderlijke in-/uitlaatopeningen, samendrukbare subkritische/gesmoorde luchtstroming en een geconcentreerde isotherme ideale-gaszak. Het eindige model volgt geen bewegend lucht-watergrensvlak, vlotter-/klepdynamiek, warmteoverdracht, vocht of verdeelde lucht; grote luchtvolumes ten opzichte van één MOC-cel worden gewaarschuwd en gemengde lucht-dampcaviteiten op dezelfde knoop worden niet opgelost. Dampgedreven kolomscheiding kan optioneel met het klassieke DVCM worden gemodelleerd; dampcaviteiten worden op rasterknopen geconcentreerd, de golfsnelheid blijft onveranderd en bij caviteitsinstorting kunnen rasterafhankelijke of kunstmatige drukpieken ontstaan. Een rasterafhankelijke controle van de verhouding tussen knoopholtevolume en MOC-celvolume waarschuwt boven 10%, waar het klassieke DVCM niet wordt aanbevolen; dit is een numerieke diagnose en geen fysieke lokale holtefractie. De alternatieve drempelmodus lost geen caviteiten op. Opgelost gas wordt niet gemodelleerd; vloeistof-constructie-interactie is alleen beschikbaar in de afzonderlijke beperkte axiale FSI-tak die hieronder wordt beschreven. Gebruik gemeten golfsnelheid en transiëntgegevens van fabrikanten voor ontwerpwerk.  De optionele wandvisco-elasticiteit is een lineair gegeneraliseerd Kelvin–Voigt-model voor kleine rek met uniforme wanddikte en constraintcoëfficiënt; a₀ moet de onmiddellijke elastische compliantie J₀ al bevatten, terwijl Jk,τk alleen de vertraagde kruip beschrijven. Kruipparameters worden niet uit een materiaalnaam afgeleid en moeten worden gemeten of gekalibreerd; niet-lineaire, temperatuur- of verouderingsafhankelijke visco-elasticiteit en geometrieverandering blijven buiten de visco-elastische tak. De afzonderlijke axiale FSI-tak volgt het lineair-elastische viervergelijkingenmodel voor een rechte, horizontale, uniforme dunwandige buis. Hij omvat verdeelde Poisson-koppeling en knooppuntkoppeling aan het einde; revisie .27 is echter wrijvingsloos en sluit pompen, terugslagkleppen, expansievaten, lucht/vacuümkleppen, DVCM/cavitatiekoppeling en gelijktijdige visco-elastische wandkoppeling uit. Voor de langzamere FSI-golffamilie wordt karakteristiekeninterpolatie gebruikt, met rasterafhankelijke numerieke demping/dispersie; daarom bevat de ingebouwde suite een rasterconvergentie-gate. Delft Benchmark A is een numerieke benchmark zonder experimentele gegevens. De dynamica van de eindsteun wordt geïntegreerd met Newmark gemiddelde versnelling; tussensteunen zijn massaloze axiale veren die een sprong in axiale buisspanning veroorzaken terwijl vloeistofdruk/-snelheid en axiale buissnelheid continu blijven. Kleine eendimensionale verplaatsingen worden verondersteld; speling, Coulombwrijving, niet-lineaire stijfheid, massa van tussensteunen, buiging, bochten en T-stukken worden nog niet opgelost. Wanneer een DVCM-holte implodeert, start de knoop eenfasig opnieuw uit beide karakteristieken; ligt die drukhoogte onder de dampdruk, dan blijft de knoop op dampdruk en begint een nieuwe holte bij volume nul.",
    "fr": "Modèle unidimensionnel d’une conduite unique, avec masse volumique et célérité constantes. La conduite est hydrauliquement uniforme ; l’altitude peut être linéaire ou linéaire par morceaux le long du chaînage, mais les branches, conduites multiples et fuites réparties ne sont pas incluses. Le frottement de Darcy peut être quasi stationnaire ou utiliser des fonctions de pondération dépendant de la fréquence. Le mode Zielke utilise une approximation à 26 termes de la fonction de pondération laminaire et est limité à Re initial≤2000. Le mode universel suit Urbanowicz–Zarzycki–Kudźma (2012) : les mêmes 26 états de mémoire sont conservés tandis que les coefficients de pondération sont mis à jour à partir du Reynolds local courant, avec Recr=2320 et, au-dessus, une branche convergeant vers Vardy–Brown pour conduite lisse. Le mode Vardy–Brown figé emploie les coefficients turbulents de conduite lisse au Re initial>2000 ; le terme Darcy quasi stationnaire conserve la rugosité saisie. Le mode universel est une fonction de pondération continue, non un modèle résolu de la physique intermittente de transition laminaire–turbulente ; Un mode Vardy–Brown pleinement rugueux distinct utilise A*=0.0103√Re(ε/D)^0.39 et B*=0.352Re(ε/D)^0.41 pour 10⁻⁶≤ε/D≤10⁻², avec des coefficients figés à l’état initial ; la pondération instationnaire dans le domaine de rugosité de transition n’est pas modélisée ; un diagnostic de dominance des termes de Colebrook–White signale cette lacune et bloque les noyaux asymptotiques lisse/pleinement rugueux manifestement inadaptés. La pompe peut utiliser une courbe quadratique simple en débit direct avec ralentissement exponentiel imposé, où le débit inverse à travers une pompe en service est rejeté, ou des données Suter quatre quadrants Wh/Wm fournies par l’utilisateur. En mode Suter, l’inertie combinée du rotor pompe/moteur est intégrée après le déclenchement avec un couple moteur nul ; frottement d’arbre, dynamique électrique moteur/génératrice et dynamique torsionnelle de l’arbre ne sont pas modélisés. La précision dépend entièrement des valeurs de référence et de la table quatre quadrants fournies. Le clapet dynamique suit une course de fermeture prescrite qui peut être déclenchée par l’arrêt de pompe ou par le passage calculé du débit par zéro / son inversion ; avec une pompe en service, ce second mode exige des données Suter 4Q. L’inertie du disque et le couple hydrodynamique ne sont pas résolus : la trajectoire de fermeture reste donc prescrite après le déclenchement. La vanne aval est un orifice idéal calibré au point initial. Le réservoir anti-bélier est un modèle concentré à coussin de gaz polytropique ; une conduite de raccordement unique optionnelle ajoute l’inertie du liquide et les pertes Darcy/singulières quasi stationnaires, sans dissolution du gaz, stratification thermique ni géométrie détaillée du réservoir/de la branche. Le dispositif air/vide peut être une limitation idéale à la pression atmosphérique ou un modèle à orifices d’admission/évacuation finis séparés, avec écoulement d’air compressible subcritique/étranglé et poche d’air isotherme concentrée de gaz parfait. Le modèle fini ne suit pas une interface air-eau mobile, la dynamique du flotteur/disque, les transferts thermiques, l’humidité ni l’air distribué ; les grands volumes par rapport à une maille MOC sont signalés et une cavité mixte air-vapeur au même nœud n’est pas résolue. La séparation de colonne par vaporisation peut être représentée en option par le DVCM classique, qui concentre les cavités aux nœuds du maillage, conserve la célérité et peut produire des pics de pression dépendant du maillage ou artificiels lors de l’effondrement des cavités ; un diagnostic dépendant du maillage du rapport entre volume de cavité nodale et volume de maille MOC avertit au-delà de 10 %, domaine où le DVCM classique n’est pas recommandé ; il s’agit d’un indicateur numérique et non d’un taux de vide local physique ; le mode alternatif à simple seuil ne résout pas les cavités. Le gaz dissous n’est pas modélisé ; l’interaction fluide-structure n’est disponible que dans la branche FSI axiale séparée et limitée décrite ci-dessous. Pour le dimensionnement, utiliser une célérité mesurée et les données transitoires des fabricants.  La viscoélasticité optionnelle de paroi est un modèle Kelvin–Voigt généralisé linéaire à petites déformations, avec épaisseur uniforme et coefficient de contrainte ; a₀ doit déjà inclure la compliance élastique instantanée J₀, tandis que Jk,τk décrivent uniquement le fluage retardé. Les paramètres de fluage ne sont pas déduits du nom du matériau et doivent être mesurés ou calibrés ; la viscoélasticité non linéaire, dépendante de la température ou du vieillissement et la géométrie variable restent hors de la branche viscoélastique. La branche FSI axiale séparée suit le modèle linéaire élastique à quatre équations pour une conduite droite, horizontale, uniforme et à paroi mince. Elle inclut le couplage distribué de Poisson et le couplage de jonction en aval ; toutefois la branche FSI actuelle est sans frottement et exclut pompe, clapet, réservoir anti-bélier, soupape air/vide, couplage DVCM/cavitation et viscoélasticité simultanée de la paroi. L’interpolation des caractéristiques est utilisée pour la famille d’ondes FSI la plus lente et introduit amortissement/dispersion numériques dépendant du maillage ; la suite intégrée comporte donc un test de convergence de maillage. Delft Benchmark A est un benchmark numérique sans données expérimentales. La dynamique du support aval est intégrée par Newmark à accélération moyenne ; les supports intermédiaires sont des ressorts axiaux sans masse qui produisent un saut de contrainte axiale tout en conservant la continuité de la pression/vitesse du fluide et de la vitesse axiale de la conduite. Les déplacements sont petits et unidimensionnels ; jeux, frottement de Coulomb, raideur non linéaire, masse des supports intermédiaires, flexion, coudes et tés ne sont pas encore résolus. Lorsqu’une cavité DVCM se referme, le nœud repart en monophasique à partir des deux caractéristiques ; si cette charge est inférieure à la pression de vapeur, le nœud est maintenu à la pression de vapeur et une nouvelle cavité part d’un volume nul.",
    "es": "Modelo unidimensional de una sola tubería con densidad del líquido y velocidad de onda constantes. La tubería es hidráulicamente uniforme; la elevación puede ser lineal o lineal por tramos a lo largo de la progresiva, pero no se incluyen ramales, múltiples tuberías ni fugas distribuidas. La fricción de Darcy puede ser cuasiestacionaria o usar funciones de ponderación dependientes de la frecuencia. Zielke usa una aproximación de 26 términos de la ponderación laminar y se limita a Re inicial≤2000. El modo universal sigue Urbanowicz–Zarzycki–Kudźma (2012): conserva los mismos 26 estados de historia mientras actualiza los coeficientes con el Reynolds local actual, usando Recr=2320 y por encima una rama que converge a Vardy–Brown para tubería lisa. El modo Vardy–Brown congelado usa para Re>2000 coeficientes turbulentos de tubería lisa fijados en el Reynolds inicial; el término Darcy cuasiestacionario sigue usando la rugosidad introducida. El modo universal es una función de ponderación continua, no un modelo resuelto de la física intermitente de transición laminar–turbulenta; Un modo Vardy–Brown completamente rugoso separado usa A*=0.0103√Re(ε/D)^0.39 y B*=0.352Re(ε/D)^0.41 para 10⁻⁶≤ε/D≤10⁻², con coeficientes congelados en el estado inicial; no se modela la ponderación no estacionaria en el régimen transicionalmente rugoso; un diagnóstico de dominancia de términos de Colebrook–White señala esta laguna y bloque núcleos asintóticos liso/completamente rugoso claramente incompatibles. La bomba puede usar una curva cuadrática simple de flujo directo con desaceleración exponencial prescrita, donde se rechaza el flujo inverso a través de una bomba en servicio, o datos Suter de cuatro cuadrantes Wh/Wm proporcionados por el usuario. En modo Suter, después del disparo se integra la inercia combinada del rotor bomba/motor con par motor nulo; no se modelan la fricción del eje, la dinámica eléctrica motor/generador ni la dinámica torsional del eje. La precisión depende por completo de los valores de referencia y de la tabla completa de cuatro cuadrantes suministrada. La válvula de retención dinámica usa una carrera de cierre prescrita que puede activarse por el disparo de la bomba o por el cruce calculado del caudal por cero / su inversión; con una bomba en servicio, este segundo modo requiere datos Suter 4Q. No se resuelven la inercia del disco ni el par hidrodinámico, por lo que la trayectoria de cierre sigue siendo prescrita tras el disparo. La válvula aguas abajo es un orificio ideal calibrado en el punto inicial. El depósito antiariete es un modelo concentrado politrópico de cojín de gas; una conexión única opcional añade inercia del líquido y pérdidas Darcy/locales cuasiestacionarias, sin disolución de gas, estratificación térmica ni geometría detallada del depósito/ramal. El dispositivo de aire/vacío puede ser una limitación ideal a presión atmosférica o un modelo con orificios finitos separados de admisión/expulsión, flujo de aire compresible subcrítico/estrangulado y una bolsa concentrada isotérmica de gas ideal. El modelo finito no sigue una interfaz móvil aire-agua, dinámica de flotador/disco, transferencia de calor, humedad ni aire distribuido; se advierten volúmenes grandes respecto a una celda MOC y no se resuelve una cavidad mixta aire-vapor en el mismo nodo. La separación de columna por vaporización puede representarse opcionalmente con el DVCM clásico, que concentra las cavidades en nodos de la malla, mantiene la velocidad de onda y puede producir picos de presión dependientes de la malla o espurios al colapsar las cavidades; un diagnóstico dependiente de la malla de la relación entre volumen de cavidad nodal y volumen de celda MOC advierte por encima del 10%, donde no se recomienda el DVCM clásico; es un indicador numérico y no una fracción de vacío local física; el modo alternativo de solo umbral no resuelve cavidades. No se modela el gas disuelto; la interacción fluido-estructura solo está disponible en la rama FSI axial separada y limitada descrita a continuación. Para diseño use velocidad de onda medida y datos transitorios del fabricante.  La viscoelasticidad opcional de la pared es un modelo Kelvin–Voigt generalizado lineal de pequeña deformación con espesor uniforme y coeficiente de restricción; a₀ debe incluir ya la compliancia elástica instantánea J₀, mientras Jk,τk describen solo la fluencia retardada. Los parámetros de fluencia no se infieren del nombre del material y deben medirse o calibrarse; la viscoelasticidad no lineal, dependiente de temperatura o envejecimiento y la geometría variable quedan fuera de la rama viscoelástica. La rama FSI axial separada sigue el modelo elástico lineal de cuatro ecuaciones para una tubería recta, horizontal, uniforme y de pared delgada. Incluye acoplamiento distribuido de Poisson y acoplamiento de unión aguas abajo; sin embargo, la rama FSI actual no incluye fricción y excluye bomba, válvula de retención, depósito antiariete, válvula de aire/vacío, acoplamiento DVCM/cavitación y viscoelasticidad simultánea de pared. Se usa interpolación de características para la familia de onda FSI más lenta, introduciendo amortiguamiento/dispersión numéricos dependientes de la malla; por ello la suite integrada incluye una prueba de convergencia de malla. Delft Benchmark A es un benchmark numérico sin datos experimentales. La dinámica del apoyo extremo se integra con Newmark de aceleración media; los apoyos intermedios son resortes axiales sin masa que producen un salto de tensión axial manteniendo continuas la presión/velocidad del fluido y la velocidad axial de la tubería. Se asumen desplazamientos pequeños y unidimensionales; holguras, fricción de Coulomb, rigidez no lineal, masa de apoyos intermedios, flexión, codos y uniones en T aún no se resuelven. Cuando una cavidad DVCM colapsa, el nodo se reinicia en régimen monofásico a partir de ambas características; si esa altura queda por debajo de la presión de vapor, el nodo se mantiene a presión de vapor y una nueva cavidad parte de volumen cero.",
    "pl": "Jednowymiarowy model pojedynczej rury o stałej gęstości cieczy i prędkości fali. Rura jest hydraulicznie jednorodna; wysokość może być liniowa lub fragmentarycznie liniowa wzdłuż pikietażu, ale nie uwzględniono rozgałęzień, wielu rur i rozproszonego wycieku. Tarcie Darcy'ego może być quasi-stacjonarne lub wykorzystywać funkcje wagowe zależne od częstotliwości. Tryb Zielkego wykorzystuje 26-wyrazowe przybliżenie laminarne ważenia i jest ograniczony do początkowego Re ≤ 2000. Tryb uniwersalny jest zgodny z Urbanowicz-Zarzycki-Kudźma (2012): te same 26 stanów historii jest zachowywanych, podczas gdy współczynniki wagowe są aktualizowane na podstawie bieżącej lokalnej liczby Reynoldsa, przy użyciu Recr = 2320 i gładkiej gałęzi Vardy-Browna zbieżnej powyżej Recr. Zamrożony tryb Vardy-Browna wykorzystuje współczynniki turbulencji gładkiej rury ustalone na początkowej liczbie Reynoldsa dla Re > 2000; quasi-stacjonarny wyraz Darcy'ego nadal wykorzystuje wprowadzoną chropowatość. Tryb uniwersalny to model ciągłej funkcji wagowej, a nie rozwiązany model fizyki okresowego przejścia laminarno-turbulentnego. Odrębny, w pełni zgrubny tryb Vardy’ego–Browna wykorzystuje A*=0,0103√Re(ε/D)^0,39 i B*=0,352Re(ε/D)^0,41 dla 10⁻⁶≤ε/D≤10⁻² ze współczynnikami zamrożonymi w stanie początkowym; niestabilne, zgrubne ważenie przejściowe nie jest modelowane; zabezpieczenie dominacji terminów Colebrooka–White’a sygnalizuje tę lukę i blokuje wyraźnie niedopasowane, gładkie/w pełni zgrubne jądra asymptotyczne. Zachowanie pompy może wykorzystywać prostą, kwadratową krzywą wysokości przepływu z zadanym wykładniczym wybiegiem, w której odrzucany jest przepływ wsteczny przez pompę w trakcie pracy, lub dostarczone przez użytkownika dane Sutera Wh/Wm z czterech kwadrantów. W trybie Sutera połączona bezwładność wirnika pompy/silnika jest całkowana po zadziałaniu przy zerowym momencie obrotowym napędu; tarcie wału, dynamika elektryczna silnika/generatora i dynamika wału skrętnego nie są modelowane. Dokładność Sutera jest całkowicie zależna od dostarczonych wartości odniesienia i kompletnej tabeli czterech kwadrantów. Dynamiczny zawór zwrotny wykorzystuje zadany przez użytkownika skok zamknięcia, który może zostać wyzwolony albo przez zadziałanie pompy, albo przez obliczone zero/odwrócenie przepływu; to drugie wymaga danych pompy Sutera 4Q podczas pracy pompy. Bezwładność tarczy i moment hydrodynamiczny nie są rozwiązywane, więc trajektoria zamknięcia pozostaje określona po zadziałaniu. Zawór wylotowy to idealna kryza skalibrowana do początkowego punktu pracy. Naczynie wyrównawcze jest skupionym politropowym modelem poduszki gazowej; opcjonalna pojedyncza gałąź łącząca dodaje bezwładność cieczy oraz quasi-stacjonarne straty Darcy'ego/lokalne, ale rozpuszczanie gazu, rozwarstwienie termiczne i geometria naczynia/gałęzi poza tą jednowymiarową, skupioną reprezentacją nie są rozwiązywane. Urządzenie powietrzno-próżniowe może być zaciskiem ciśnienia atmosferycznego lub modelem o skończonych otworach z oddzielnymi średnicami wlotu/wylotu, ściśliwym, dławionym/podkrytycznym przepływem powietrza i skupioną izotermiczną kieszenią gazu doskonałego. Model skończony nie śledzi ruchomej granicy faz powietrze-woda, dynamiki pływaka/dysku zaworu, wymiany ciepła, wilgoci ani rozproszonego powietrza; duże objętości kieszeni w stosunku do jednego zasięgu MOC są ostrzegane, a mieszane przestrzenie powietrzno-parowe w tym samym węźle nie są rozwiązywane. Separację kolumn parowych można przedstawić za pomocą opcjonalnego klasycznego DVCM, który koncentruje przestrzenie parowe w węzłach siatki, zakłada niezmienioną prędkość fali i może generować zależne od siatki lub przypadkowe skoki ciśnienia w momencie zapadnięcia się wnęki; zależna od siatki diagnostyka objętości wnęki/zasięgu węzłowego ostrzega o przekroczeniu 10%, gdzie klasyczny DVCM nie jest zalecany; alternatywny tryb oparty wyłącznie na progu nie rozwiązuje problemu wnęk. Rozpuszczony gaz nie jest rozwiązywany; interakcja płynu ze strukturą jest dostępna tylko w oddzielnej, ograniczonej, osiowej gałęzi FSI opisanej poniżej. Ciśnienie atmosferyczne i ciśnienie pary są danymi wejściowymi użytkownika. Do projektowania należy wykorzystać zmierzone prędkości fal i dane przejściowe producenta. Opcjonalna lepkosprężystość ścianek rury to liniowy, uogólniony model Kelvina-Voigta o małych odkształceniach i jednorodnej grubości ścianek oraz współczynniku ograniczenia; a₀ musi już reprezentować natychmiastową podatność sprężystą J₀, podczas gdy wprowadzone Jk,τk opisują jedynie opóźnione pełzanie. Parametry pełzania nie są wywnioskowane z nazwy materiału i muszą być zmierzone lub skalibrowane; nieliniowa/zależna od temperatury/wieku lepkosprężystość, zmieniająca się geometria, pozostaje poza gałęzią lepkosprężystą. Oddzielna osiowa gałąź FSI jest zgodna z czterorównaniowym, liniowym modelem sprężystości dla prostej, poziomej, cienkościennej, jednorodnej rury. Obejmuje ona rozproszone sprzężenie Poissona i sprzężenie złączy za rurą, ale obecna gałąź FSI jest beztarciowa i nie obejmuje pomp, zaworów zwrotnych, zbiorników wyrównawczych, zaworów odpowietrzających, sprzężenia DVCM/kawitacyjnego oraz jednoczesnego sprzężenia lepkosprężystego ze ściankami. Konwencjonalna interpolacja charakterystyczna jest stosowana dla wolniejszej rodziny fal FSI i wprowadza zależne od siatki numeryczne tłumienie/dyspersję; wbudowany pakiet zawiera zatem bramkę zbieżności siatki. Delft Benchmark A to numeryczny benchmark bez danych eksperymentalnych. Dynamika podpór końcowych wykorzystuje średnie przyspieszenie Newmarka; podpory pośrednie to bezmasowe sprężyny osiowe, które generują skok naprężenia osiowego, utrzymując jednocześnie stałe ciśnienie/prędkość płynu i prędkość osiową rury. Ruch podpór charakteryzuje się niewielkim przemieszczeniem i jest jednowymiarowy; szczeliny, tarcie Coulomba, sztywność nieliniowa, masa podporowa w położeniach pośrednich, zginanie, kolanka i połączenia typu T nie zostały jeszcze rozwiązane. Gdy kawerna DVCM zanika, węzeł wraca do rozwiązania jednofazowego z obu charakterystyk; jeśli ta wysokość ciśnienia leży poniżej ciśnienia parowania, węzeł pozostaje na ciśnieniu parowania, a nowa kawerna zaczyna się od zerowej objętości."

<template id="wh-docs"><details open><summary>Method of Characteristics</summary><p>The elastic liquid-column equations are integrated on a uniform x–t grid with Courant number one. The quasi-steady Darcy–Weisbach term is evaluated from the local flow at each characteristic foot: f=64/Re below Re=2000, iterative Colebrook–White above Re=4000, and a smooth numerical bridge over Re=2000…4000 (not a resolved transition-flow model).</p><div class="eq">C⁺ = H + BQ − RQ|Q| − Jᵤ<br>C⁻ = H − BQ + RQ|Q| + Jᵤ<br>B = a/(gA)</div></details><details><summary>Unsteady friction</summary><p>Four convolution modes are available. Zielke uses a 26-term laminar weighting approximation and is restricted to initial Re≤2000. Frozen smooth-wall Vardy–Brown uses a 16-term turbulent weighting function based on the initial Re. Universal Zielke↔Vardy–Brown follows Urbanowicz, Zarzycki &amp; Kudźma (2012): it retains 26 recursive history states while updating decay coefficients from the current local Reynolds number, avoiding a memory reset across Re=2320; its turbulent branch remains smooth-wall. Fully-rough Vardy–Brown uses W(τ)=A*exp(−B*τ)/√τ with A*=0.0103√Re(ε/D)<sup>0.39</sup> and B*=0.352Re(ε/D)<sup>0.41</sup>, represented by the same 16 recursive exponentials and frozen at the initial state. This last mode is the fully-rough asymptote, not a general transitionally-rough wall model. Revision .22 introduced a Colebrook–White wall-regime guard: it compares the roughness and viscous terms in the Colebrook equation, reports their share and χ, and blocks smooth/fully-rough asymptotic kernels when the initial state is clearly mismatched. The 10/90% dominance thresholds are transparent sandbox guardrails, not published regime boundaries. Vardy &amp; Brown (2007) provide a Colebrook-consistent general weighting formulation, but its 2009 erratum must be resolved before those transitionally-rough coefficients are encoded here. Experimental separation of damping mechanisms by Ferràs et al. (2016) found unsteady friction to be the most relevant damping mechanism in their anchored straight-copper rig, while pipe-wall viscoelasticity dominated their PE rig; this is why quasi-steady Darcy friction alone can visibly under-predict attenuation.</p></details><details><summary>Pipe-wall viscoelasticity</summary><p>The optional wall model follows the generalized Kelvin–Voigt retarded-strain formulation used by Covas et al. (2005). The entered elastic wave speed a₀ represents the instantaneous elastic compliance J₀. Each user row adds one retarded creep element Jₖ,τₖ; the solver stores its strain history at every MOC node and analytically advances the exponential memory over each time step. The resulting continuity equation is affine in the new head, so the same factor K=1+λᵥₑ is applied to interior nodes, reservoirs/pumps, valves, DVCM cavities, surge-vessel branches and air/vacuum nodes rather than being treated as an empirical damping term.</p><div class="eq">J(t) = J₀ + Σ Jₖ[1 − exp(−t/τₖ)]<br>F = αDρg(H−H₀)/(2e)<br>∂εᵣₖ/∂t = (Jₖ/τₖ)F − εᵣₖ/τₖ<br>K·H ± BQ = C± − dᵥₑ</div><p>The creep table is retarded compliance only: do not enter J₀ again. Parameters are material, temperature, age and installation dependent and normally require test/calibration data.</p></details><details><summary>Axial fluid–structure interaction</summary><p>The optional FSI branch uses the linear four-equation model of Tijsseling (2003): fluid pressure/velocity are coupled to axial pipe stress/velocity through Poisson contraction and junction conditions. The coupled wave families travel at ±λ₁ and ±λ₃. The upstream reservoir is structurally anchored. The downstream valve may be fixed, free and massless, or attached to an axial mass–spring–dashpot. A closed moving valve enforces V−uₚ=0; finite opening uses the same relative velocity in the orifice relation.</p><div class="eq">c_f² = [ρ/K + (1−νₚ²)·2ρR/(Ee)]⁻¹<br>c_s² = E/ρₛ<br>λ⁴ − γ²λ² + c_f²c_s² = 0<br>A_f P − A_s σ = m ẍ + c ẋ + kx</div><p>Intermediate supports follow the massless elastic-support balance used by Zanganeh, Keramat &amp; Tijsseling (2026): fluid pressure and velocity and pipe axial velocity are continuous, while axial stress jumps according to (σ<sub>R</sub>−σ<sub>L</sub>)A<sub>s</sub>=k<sub>s</sub>x. End-support motion is integrated with Newmark average acceleration, following the dynamic-valve treatment of Henclik (2014/2018). Support displacement is measured from the initial prestressed equilibrium.</p><p>The FSI branch remains deliberately narrow: straight horizontal thin-wall pipe, linear elasticity, frictionless fluid/structure equations, no pump, DVCM, air valve, surge vessel, check valve or simultaneous viscoelastic wall. Intermediate supports are massless axial springs; gaps, dry friction, nonlinear supports, bending, elbows and junctions are outside this revision. Conventional characteristic interpolation is used for the slower wave family, so mesh convergence remains a release gate. Delft Benchmark A is numerical rather than experimental validation.</p></details><details><summary>Elevation profile</summary><p>Hydraulic head H is solved along pipe chainage. Gauge pressure is p=ρg(H−z), so a local high point can control vapor-pressure margin even when the end pressures are acceptable. Profile mode linearly interpolates user x,z points onto the MOC grid; x is chainage along the modelled pipe length L.</p></details>
        <details><summary>What the valve event means</summary><p>The outlet valve is an ideal orifice. Its coefficient is inferred from the initial operating point, then multiplied by the commanded opening. Linear, smooth-cosine and power-law closure are available. Closing faster than the wave round-trip time produces a response approaching the Joukowsky limit.</p></details>
        <details><summary>Pump trip, 4Q Suter and check-valve slam</summary><p>In quadratic mode, speed after trip follows n = exp[−(t−t<sub>trip</sub>)/τ] and reverse pump flow is rejected. In Suter mode, user-supplied periodic Wh(θ), Wm(θ) data define all four flow/speed quadrants with θ = atan2(α,v), v=Q/Q* and α=n/n*. After trip the driver torque is set to zero and J·dω/dt = −M<sub>hyd</sub> is integrated with a trapezoidal predictor/corrector coupled to the MOC pump boundary. The dynamic check valve keeps a prescribed travel after its trigger. The trigger may be the pump-trip command or the calculated flow crossing through zero; flow-triggered slam with an in-service pump requires Suter 4Q data so the pre-closure reverse flow is represented. Disc inertia and hydrodynamic torque are not solved.</p><p>Check-valve model Automatic, the default, applies an ideal non-return valve when a pump is in service and no check valve on a reservoir-only line. Saved cases and links that name a check-valve model keep it; a state without that field loads as Automatic.</p></details>
        <details><summary>Surge vessel and air valve</summary><p>The surge vessel is a lumped gas cushion with pV<sup>γ</sup> = const. An optional connection branch solves its flow inertia together with quasi-steady Darcy/local loss; Lc=0 and ΣK=0 reduces to direct nodal continuity. Ideal air-valve mode is an atmospheric pressure clamp. Finite mode uses separate inlet/outlet orifices with compressible choking and a lumped isothermal ideal-gas pocket; the liquid-flow imbalance changes pocket volume while orifice mass flow changes the air mass.</p></details>
        <details><summary>Column separation / DVCM</summary><p>When DVCM is selected, a node that reaches vapor pressure is held at P<sub>vap</sub> while separate upstream/downstream characteristic flows grow or collapse a discrete vapor cavity using dV<sub>cav</sub>/dt = Q<sub>out</sub> − Q<sub>in</sub>. Cavities are fixed to MOC grid nodes and do not alter wave speed. ψ weights the current imbalance against the value two MOC steps earlier; the general sandbox default is ψ=0.55, while the Bergant literature benchmark uses its published ψ=1.0. A mesh-dependent nodal cavity/reach-volume ratio is reported and warns above 10%; it is a numerical DVCM diagnostic, not a physical distributed void fraction.</p><p>When the cavity volume computed at a node is not positive, the cavity collapses and the node restarts single-phase from both characteristics, H = (C⁺ + C⁻)/2 and Q = (C⁺ − C⁻)/(2B). If that head is below the vapour head, the node is held at vapour pressure instead, its flows follow from each characteristic and a new cavity starts from zero volume (Bergant, Simpson & Tijsseling 2006).</p></details>
        <details><summary>Verification basis</summary><p>The built-in suite checks exact MOC invariants, the Joukowsky jump and wave travel time, exact Colebrook–White turbulent friction, Zielke and Vardy–Brown weighting/recurrence, a published Adelaide laminar Zielke analytical case, Suter normalization, compressible air-orifice flow, coupled air-pocket mass balance, generalized Kelvin–Voigt retarded-strain recurrence/steady invariance, and literal transcription of the Covas et al. four-element PE creep spectrum. Its literature case reproduces the classical DVCM Adelaide/Bergant low-velocity test: L=37.2 m, D=22.1 mm, a=1319 m/s, V₀=0.30 m/s, H<sub>T2</sub>=22 m, 9 ms downstream valve closure and ψ=1.0. The published classical-DVCM maxima are 102.7 m at 0.176 s for N=32 and 102.5 m at 0.178 s for N=128; the measured maximum is 95.6 m. Because the recorded valve/Cv trace is not embedded, this tool uses a smooth-cosine 9 ms closure as a documented surrogate. Sources: Bergant et al. (2007), TU/e CASA report 0729, for the classical-DVCM comparison; Vardy & Brown (1995) for the smooth-pipe transient-friction framework; Vardy & Brown (2004), Journal of Sound and Vibration 270, 233–257, for the fully-rough turbulent weighting asymptote; Urbanowicz & Zarzycki (2012) for the 26-term Zielke approximation; Urbanowicz, Zarzycki & Kudźma (2012), Journal of Theoretical and Applied Mechanics 50(4), 889–902, for the continuous universal laminar–turbulent weighting procedure; Bergant et al. (2006), IAHR Paper 109, for recursive convolution; Walters, Dahl & Rogers (2020), DOI 10.1115/PVP2020-21069, for four-quadrant/Suter definitions; Covas et al. (2005), Journal of Hydraulic Research 43(1), 56–70, for the generalized Kelvin–Voigt pipe-wall transient formulation and PE creep-spectrum calibration basis. Tijsseling (2003), Journal of Fluids and Structures 18(2), 179–196, supplies the axial four-equation FSI equations, coupled wave-speed relations, free-valve boundary conditions and Delft Hydraulics Benchmark A used by the current FSI branch. Zanganeh, Keramat &amp; Tijsseling (2026), Journal of Fluids and Structures 140, 104466, supplies the elastic valve/intermediate-support balance equations used in FSI phase 2; Henclik (2014, 2018) supplies the moving mass–spring–dashpot valve-boundary formulation and Newmark coupling basis.</p></details>

h H–Q + voorgeschreven uitloop","H–Q quadratique + ralentissement imposé","H–Q cuadrática + desaceleración prescrita"],"Suter 4Q Wh/Wm + rotor inertia":["Suter 4Q Wh/Wm + інерція ротора","Suter 4Q Wh/Wm + Rotorträgheit","Suter 4Q Wh/Wm + rotortraagheid","Suter 4Q Wh/Wm + inertie rotor","Suter 4Q Wh/Wm + inercia del rotor"],"Events":["Події","Ereignisse","Gebeurtenissen","Événements","Eventos"],"Downstream valve":["Кінцевий клапан","Auslaufventil","Benedenstroomse klep","Vanne aval","Válvula aguas abajo"],"Close downstream valve":["Закрити кінцевий клапан","Auslaufventil schließen","Benedenstroomse klep sluiten","Fermer la vanne aval","Cerrar válvula aguas abajo"],"Closure time":["Час закриття","Schließzeit","Sluitingstijd","Temps de fermeture","Tiempo de cierre"],"Final opening":["Кінцеве відкриття","Endöffnung","Eindopening","Ouverture finale","Apertura final"],"Travel law":["Закон ходу","Stellgesetz","Bewegingswet","Loi de course","Ley de recorrido"],"Linear":["Лінійний","Linear","Lineair","Linéaire","Lineal"],"Smooth cosine":["Плавний косинус","Glatter Kosinus","Gladde cosinus","Cosinus lissé","Coseno suave"],"Pump trip / coast-down":["Trip насоса / вибіг","Pumpentrip / Auslauf","Pompuitval / uitloop","Arrêt pompe / ralentissement","Disparo de bomba / desaceleración"],"Trip pump":["Trip насоса","Pumpe trippen","Pomp uitschakelen","Arrêter la pompe","Disparar bomba"],"Check valve at pump discharge":["Зворотний клапан на нагнітанні","Rückschlagventil am Pumpenauslass","Terugslagklep aan pompuitlaat","Clapet au refoulement pompe","Válvula de retención en descarga"],"Model":["Модель","Modell","Model","Modèle","Modelo"],"None":["Немає","Keine","Geen","Aucun","Ninguno"],"Ideal non-return":["Ідеальний незворотний","Ideales Rückschlagventil","Ideale terugslag","Anti-retour idéal","Antirretorno ideal"],"Automatic (ideal with a pump, none without)":["Автоматично (ідеальний з насосом, без насоса — немає)","Automatisch (ideal mit Pumpe, ohne Pumpe keines)","Automatisch (ideaal met pomp, zonder pomp geen)","Automatique (idéal avec pompe, aucun sans pompe)","Automático (ideal con bomba, ninguno sin bomba)"],"Check-valve model Automatic, the default, applies an ideal non-return valve when a pump is in service and no check valve on a reservoir-only line. Saved cases and links that name a check-valve model keep it; a state without that field loads as Automatic.":["Модель зворотного клапана «Автоматично» (типова) застосовує ідеальний незворотний клапан, коли насос працює, і не застосовує клапана на лінії лише з резервуаром. Збережені випадки й посилання, що задають модель клапана, зберігають її; стан без цього поля завантажується як «Автоматично».","Das Rückschlagventilmodell „Automatisch“ (Voreinstellung) setzt bei laufender Pumpe ein ideales Rückschlagventil und bei einer reinen Behälterleitung kein Rückschlagventil. Gespeicherte Fälle und Links, die ein Rückschlagventilmodell angeben, behalten es; ein Zustand ohne dieses Feld wird als „Automatisch“ geladen.","Het terugslagklepmodel ‘Automatisch’ (standaard) gebruikt een ideale terugslagklep wanneer een pomp in bedrijf is en geen terugslagklep bij een leiding met alleen een reservoir. Opgeslagen cases en links die een terugslagklepmodel noemen, behouden dat; een toestand zonder dit veld wordt als ‘Automatisch’ geladen.","Le modèle de clapet « Automatique » (par défaut) applique un clapet anti-retour idéal lorsqu’une pompe est en service et aucun clapet sur une ligne alimentée par un seul réservoir. Les cas enregistrés et les liens qui nomment un modèle de clapet le conservent ; un état sans ce champ est chargé en « Automatique ».","El modelo de válvula de retención «Automático» (predeterminado) aplica una válvula antirretorno ideal cuando hay una bomba en servicio y ninguna válvula en una línea solo con depósito. Los casos guardados y los enlaces que indican un modelo de válvula lo conservan; un estado sin ese campo se carga como «Automático»."],"When the cavity volume computed at a node is not positive, the cavity collapses and the node restarts single-phase from both characteristics, H = (C⁺ + C⁻)/2 and Q = (C⁺ − C⁻)/(2B). If that head is below the vapour head, the node is held at vapour pressure instead, its flows follow from each characteristic and a new cavity starts from zero volume (Bergant, Simpson & Tijsseling 2006).":["Якщо обчислений об’єм порожнини у вузлі не додатний, порожнина замикається, і вузол переходить до однофазного розв’язку з обох характеристик, H = (C⁺ + C⁻)/2 і Q = (C⁺ − C⁻)/(2B). Якщо цей напір нижчий за напір насиченої пари, вузол натомість утримується на тиску пари, витрати визначаються з кожної характеристики, а нова порожнина починається з нульового об’єму (Bergant, Simpson & Tijsseling 2006).","Ist das an einem Knoten berechnete Hohlraumvolumen nicht positiv, kollabiert der Hohlraum und der Knoten startet einphasig aus beiden Charakteristiken neu, H = (C⁺ + C⁻)/2 und Q = (C⁺ − C⁻)/(2B). Liegt diese Druckhöhe unter der Dampfdruckhöhe, wird der Knoten stattdessen auf Dampfdruck gehalten, seine Durchflüsse folgen aus jeder Charakteristik und ein neuer Hohlraum beginnt mit dem Volumen null (Bergant, Simpson & Tijsseling 2006).","Als het in een knoop berekende holtevolume niet positief is, implodeert de holte en start de knoop eenfasig opnieuw uit beide karakteristieken, H = (C⁺ + C⁻)/2 en Q = (C⁺ − C⁻)/(2B). Ligt die drukhoogte onder de dampdrukhoogte, dan blijft de knoop in plaats daarvan op dampdruk, volgen de debieten uit elke karakteristiek en begint een nieuwe holte bij volume nul (Bergant, Simpson & Tijsseling 2006).","Lorsque le volume de cavité calculé en un nœud n’est pas positif, la cavité se referme et le nœud repart en monophasique à partir des deux caractéristiques, H = (C⁺ + C⁻)/2 et Q = (C⁺ − C⁻)/(2B). Si cette charge est inférieure à la charge de vapeur, le nœud est maintenu à la pression de vapeur, ses débits découlent de chaque caractéristique et une nouvelle cavité part d’un volume nul (Bergant, Simpson & Tijsseling 2006).","Cuando el volumen de cavidad calculado en un nodo no es positivo, la cavidad colapsa y el nodo se reinicia en régimen monofásico a partir de ambas características, H = (C⁺ + C⁻)/2 y Q = (C⁺ − C⁻)/(2B). Si esa altura queda por debajo de la altura de vapor, el nodo se mantiene en cambio a presión de vapor, sus caudales salen de cada característica y una nueva cavidad parte de volumen cero (Bergant, Simpson & Tijsseling 2006)."],"Unknown check-valve model. Use auto, none, ideal or dynamic.":["Невідома модель зворотного клапана. Використовуйте auto, none, ideal або dynamic.","Unbekanntes Rückschlagventilmodell. Verwenden Sie auto, none, ideal oder dynamic.","Onbekend terugslagklepmodel. Gebruik auto, none, ideal of dynamic.","Modèle de clapet inconnu. Utilisez auto, none, ideal ou dynamic.","Modelo de válvula de retención desconocido. Use auto, none, ideal o dynamic."],"Dynamic prescribed travel":["Динамічний заданий хід","Dynamischer vorgegebener Hub","Dynamisch voorgeschreven traject","Course dynamique imposée","Recorrido dinámico prescrito"],"Protection devices":["Захисні пристрої","Schutzeinrichtungen","Beveiligingen","Dispositifs de protection","Dispositivos de protección"],"Gas-cushion surge vessel":["Surge vessel з газовою подушкою","Druckbehälter mit Gaspolster","Expansievat met gaskussen","Réservoir anti-bélier à coussin de gaz","Depósito antiariete con cojín de gas"],"Enable surge vessel":["Увімкнути surge vessel","Druckbehälter aktivieren","Expansievat inschakelen","Activer le réservoir anti-bélier","Activar depósito antiariete"],"Location":["Положення","Position","Locatie","Position","Ubicación"],"Total volume":["Повний об’єм","Gesamtvolumen","Totaal volume","Volume total","Volumen total"],"Initial gas":["Початковий газ","Anfangsgasanteil","Initieel gas","Gaz initial","Gas inicial"],"Air / vacuum valve":["Повітряний / вакуумний клапан","Be-/Entlüftungsventil","Lucht/vacuümklep","Soupape air/vide","Válvula aire/vacío"],"Enable air / vacuu
