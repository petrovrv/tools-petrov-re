    methodNote1: T('Vertical sum: every component is a length along the fall line; the sum is measured from the working surface down. No constant is added that is not shown as a component.', 'Вертикальна сума: кожна складова — довжина вздовж лінії падіння; суму відраховано від робочої поверхні вниз. Жодної сталої поза показаними складовими.', 'Senkrechte Summe: jeder Anteil ist eine Länge entlang der Falllinie, gemessen von der Arbeitsfläche nach unten. Keine Konstante außer den gezeigten Anteilen.', 'Verticale som: elke component is een lengte langs de vallijn, gemeten vanaf het werkvlak omlaag. Geen constante buiten de getoonde componenten.', 'Somme verticale : chaque composante est une longueur le long de la ligne de chute, mesurée depuis le plan de travail. Aucune constante hors composantes affichées.', 'Suma vertical: cada componente es una longitud a lo largo de la línea de caída, medida desde la superficie de trabajo. Ninguna constante fuera de los componentes mostrados.', 'Suma pionowa: każda składowa to długość wzdłuż linii spadania, liczona od powierzchni roboczej w dół. Brak stałych poza pokazanymi składowymi.'),
    methodNote2: T('The full connector length is used as if the anchor stood over the fall line; with an offset anchor the pendulum bottom reaches this depth under the anchor, so the offset is reported as a separate swing item.', 'Повну довжину сполучного засобу враховано так, ніби анкер над лінією падіння; при зміщеному анкері нижня точка маятника досягає цієї глибини під анкером, тому зміщення показано окремим пунктом.', 'Die volle Länge wird angesetzt, als stünde der Anschlagpunkt über der Falllinie; bei Versatz erreicht der Pendeltiefpunkt diese Tiefe unter dem Anschlagpunkt, daher steht der Versatz als eigener Pendelpunkt.', 'De volle lengte wordt gebruikt alsof het ankerpunt boven de vallijn staat; bij verzet bereikt het laagste slingerpunt die diepte onder het anker, dus het verzet staat apart als slingerpunt.', 'La longueur complète est prise comme si l’ancrage était au-dessus de la ligne de chute ; avec un décalage, le bas du pendule atteint cette profondeur sous l’ancrage, d’où un point pendulaire séparé.', 'Se usa la longitud completa como si el anclaje estuviera sobre la línea de caída; con desplazamiento, el punto bajo del péndulo alcanza esa profundidad bajo el anclaje, por eso se informa aparte.', 'Pełną długość przyjęto tak, jakby kotwa była nad linią spadania; przy przesunięciu najniższy punkt wahadła osiąga tę głębokość pod kotwą, dlatego przesunięcie podano osobno.'),
    methodNote3: T('Restraint: the D-ring moves on a circle of the lanyard length about the anchor; at standing height its horizontal reach is √(L² − (hA − hD)²).', 'Утримання: D-кільце рухається по колу радіусом довжини стропа навколо анкера; на висоті стояння горизонтальна досяжність √(L² − (hA − hD)²).', 'Rückhaltung: die Öse bewegt sich auf einem Kreis mit der Seillänge um den Anschlagpunkt; in Standhöhe beträgt die waagerechte Reichweite √(L² − (hA − hD)²).', 'Begrenzing: de D-ring beweegt op een cirkel met de lijnlengte om het anker; op stahoogte is het horizontale bereik √(L² − (hA − hD)²).', 'Retenue : l’anneau décrit un cercle de rayon égal à la longe autour de l’ancrage ; debout, la portée horizontale vaut √(L² − (hA − hD)²).', 'Retención: la anilla se mueve en un círculo de radio igual al cabo alrededor del anclaje; de pie, el alcance horizontal es √(L² − (hA − hD)²).', 'Ograniczenie: klamra D porusza się po okręgu o promieniu długości linki wokół kotwy; na wysokości stania zasięg poziomy to √(L² − (hA − hD)²).'),
    methodNote4: T('Guardrail: top-rail height is compared with the rule-pack value only; strength, toe board and openings are outside the model.', 'Огородження: з пакетом правил порівнюється лише висота верхнього поручня; міцність, бортова дошка та прорізи поза моделлю.', 'Seitenschutz: nur die Handlaufhöhe wird mit dem Regelpaket verglichen; Festigkeit, Bordbrett und Öffnungen liegen außerhalb des Modells.', 'Leuning: alleen de hoogte van de bovenregel wordt met het regelpakket vergeleken; sterkte, kantplank en openingen vallen buiten het model.', 'Garde-corps : seule la hauteur de lisse est comparée au jeu de règles ; résistance, plinthe et ouvertures sont hors modèle.', 'Barandilla: solo la altura del pasamanos se compara con el paquete de reglas; resistencia, rodapié y huecos quedan fuera del modelo.', 'Balustrada: z pakietem reguł porównywana jest tylko wysokość poręczy; wytrzymałość, krawężnik i prześwity są poza modelem.')

  };
  var RULE_IDS = Object.keys(RULES);

  /* ============================================================ the model
     Pure. Input: a flat object with the record keys below, lengths in metres.
     Output: {o: record outputs, F: findings}.
     The python export ports this function line by line. */
  var EPS = 1e-9;
  /* lengths that may be negative: everything else is a non-negative length */
  var SIGNED = ['anchor_offset', 'anchor_height'];
  function isNum(v) { return typeof v === 'number' && isFinite(v); }

  var INPUT_KEYS = {
    common: ['mode'],
    guardrail: ['rail_height', 'rail_min_height'],
    restraint: ['edge_distance', 'anchor_offset', 'anchor_height', 'connector_length', 'dring_height', 'body_allowance'],
    arrest: ['connector', 'working_height', 'edge_distance', 'anchor_offset', 'anchor_height', 'obstacle_present',
      'obstacle_depth', 'obstacle_near', 'obstacle_far', 'connector_length', 'absorber_extension', 'max_free_fall',
      'srl_arrest_distance', 'dring_height', 'dring_shift', 'body_width', 'deployment_allowance', 'safety_margin']
  };
  function inputsFor(s) {
    var out = { mode: s.mode };
    (INPUT_KEYS[s.mode] || []).forEach(function (k) {
      var v = s[k];
      if (k === 'obstacle_present') v = !!v;
      else if (k === 'connector') v = v === 'srl' ? 'srl' : 'lanyard';
      else if (!isNum(v)) v = null;
      out[k] = v;
    });
    if (s.mode === 'arrest') {
      /* only the manufacturer datum of the chosen connector is an input */
      if (out.connector === 'srl') { delete out.absorber_extension; delete out.max_free_fall; }
      else delete out.srl_arrest_distance;
      if (!out.obstacle_present) { delete out.obstacle_depth; delete out.obstacle_near; delete out.obstacle_far; }
    }

  var OUT_KEYS = {
    guardrail: ['system_mode', 'rail_reserve'],
    restraint: ['system_mode', 'reach_horizontal', 'edge_reserve', 'work_position_distance'],
    arrest: ['system_mode', 'connector', 'required_clearance', 'available_clearance', 'margin', 'swing_warning',
      'free_fall', 'c_free_fall', 'c_absorber', 'c_geometric_drop', 'c_arrest_distance', 'c_dring_shift',
      'c_deployment', 'c_safety_margin', 'swing_offset', 'swing_angle', 'swing_drop', 'obstacle_in_path',
      'fall_band', 'work_position_distance', 'rescue_required']

  function evaluate(s) {
    var F = [];
    var o = {};
    var mode = s.mode;
    var complete = true;
    (OUT_KEYS[mode] || OUT_KEYS.guardrail).forEach(function (k) { o[k] = null; });

    function add(rule, status, data) { F.push({ rule: rule, status: status, data: data || {} }); }

      add(rule, 'pass', { v: s[key] });

    }

      add('WAH-G-001', 'info', { collective: true });

        add('WAH-R-001', o.rail_reserve >= 0 ? 'pass' : 'fail', { h: s.rail_height, m: s.rail_min_height, r: o.rail_reserve });

    } else if (mode === 'restraint') {
      add('WAH-G-001', 'info', { collective: false });

          add('WAH-P-009', 'pass', { L: Lr, d: d0r });
          var rh = Math.sqrt(Math.max(0, Lr * Lr - d0r * d0r));
          o.reach_horizontal = rh;
          o.edge_reserve = -(s.anchor_offset + rh + s.body_allowance);
          add('WAH-P-010', o.edge_reserve >= 0 ? 'pass' : 'fail', { r: Math.abs(o.edge_reserve) });
          var hw = Math.abs(s.edge_distance + s.anchor_offset);
          o.work_position_distance = hw;
          if (hw <= rh + EPS) add('WAH-P-012', 'pass', { dw: hw, L: rh });
          else { add('WAH-P-012', 'insufficient', { dw: hw, L: rh }); complete = false; }
        }
      }
    } else {
      mode = 'arrest';
      o.system_mode = 'arrest';
      add('WAH-G-001', 'info', { collective: false });
      var srl = s.connector === 'srl';
      o.connector = srl ? 'srl' : 'lanyard';
      var base = needAll(['working_height', 'edge_distance', 'anchor_offset', 'anchor_height',
        'dring_height', 'dring_shift', 'deployment_allowance', 'safety_margin', 'body_width']);
      /* the lanyard length is a clearance term; the SRL line length only bounds the reach */
      var hasL = true;
      if (!srl) { if (!needAll(['connector_length'])) base = false; }
      else if (s.connector_length == null) hasL = false;
      else if (!needAll(['connector_length'])) base = false;
      var man = srl ? needMan('srl_arrest_distance', 'WAH-M-002') : needMan('absorber_extension', 'WAH-M-001');
      var obsOk = true;
      if (s.obstacle_present) obsOk = needAll(['obstacle_depth', 'obstacle_near', 'obstacle_far']);
      var CR = null, geomOk = false;
      if (base) {
        var dx = Math.abs(s.anchor_offset);
        var d0 = s.anchor_height - s.dring_height;
        var L = s.connector_length;
        o.swing_offset = dx;
        geomOk = true;
        if (hasL) {
          if (L < Math.abs(d0) - EPS) {
            add('WAH-P-009', 'insufficient', { L: L, d: d0 });
            complete = false; geomOk = false;
          } else add('WAH-P-009', 'pass', { L: L, d: d0 });
        }
        if (srl && d0 < 0) {
          add('WAH-M-004', 'insufficient', { d: -d0 });
          complete = false; geomOk = false;
        }
        if (!srl && d0 < 0) add('WAH-M-005', 'attention', { d: -d0 });
        if (geomOk) {
          var r0 = Math.sqrt(dx * dx + d0 * d0);
          var hx = s.edge_distance + s.anchor_offset;
          var dw = Math.sqrt(hx * hx + d0 * d0);
          o.work_position_distance = dw;
          if (!hasL) add('WAH-P-008', 'attention', { r: r0, nolen: true });
          else {
            add('WAH-P-008', L + EPS >= r0 ? 'pass' : 'attention', { r: r0, L: L });
            /* a worker who cannot stand at the declared position while attached
               describes a set-up that does not exist: nothing further is computed */
            if (dw <= L + EPS) add('WAH-P-012', 'pass', { dw: dw, L: L });
            else { add('WAH-P-012', 'insufficient', { dw: dw, L: L }); complete = false; geomOk = false; }
          }
        }
        if (geomOk) {
          var Lt, first;
          if (!srl) {
            var ff = L - d0;
            o.free_fall = ff;
            o.c_free_fall = ff;
            add('WAH-P-001', 'info', { L: L, d: d0, ff: ff });
            if (!isNum(s.max_free_fall)) add('WAH-M-003', 'attention', { ff: ff });
            else add('WAH-M-003', ff <= s.max_free_fall + EPS ? 'pass' : 'fail', { ff: ff, max: s.max_free_fall });
            Lt = L;
            first = ff;
            if (man) o.c_absorber = s.absorber_extension;
          } else {
            Lt = r0;
            first = r0 - d0;
            o.c_geometric_drop = first;
            if (man) o.c_arrest_distance = s.srl_arrest_distance;
          }
          o.c_dring_shift = s.dring_shift;
          o.c_deployment = s.deployment_allowance;
          o.c_safety_margin = s.safety_margin;
          var sn = Lt > EPS ? Math.min(1, dx / Lt) : 0;
          o.swing_angle = Math.asin(sn) * 180 / Math.PI;
          o.swing_drop = Lt - Math.sqrt(Math.max(0, Lt * Lt - dx * dx));
          o.swing_warning = dx > EPS;
          if (o.swing_warning) {
            add('WAH-P-006', 'attention', { dx: dx, ang: o.swing_angle, drop: o.swing_drop });
            add('WAH-P-007', s.anchor_offset < 0 ? 'attention' : 'info', { out: s.anchor_offset > 0 });
          } else add('WAH-P-006', 'pass', {});
          if (man) {
            var second = srl ? s.srl_arrest_distance : s.absorber_extension;
            CR = first + second + s.dring_shift + s.deployment_allowance + s.safety_margin;
            o.required_clearance = CR;
            add(srl ? 'WAH-P-003' : 'WAH-P-002', 'info', { sum: CR });
          }
        }
        var CA = null;
        if (obsOk) {
          var band = Math.max(s.body_width, s.anchor_offset > 0 ? s.anchor_offset + s.body_width / 2 : 0);
          o.fall_band = band;
          var hit = false, obsValid = true;
          if (s.obstacle_present) {
            if (s.obstacle_far <= s.obstacle_near) { add('WAH-I-001', 'insufficient', { key: 'obstacle_far' }); complete = false; obsValid = false; }
            if (s.obstacle_depth < 0 || s.obstacle_depth > s.working_height) { add('WAH-I-001', 'insufficient', { key: 'obstacle_depth' }); complete = false; obsValid = false; }
            if (obsValid) hit = s.obstacle_near < band && s.obstacle_far > 0;
          }
          if (obsValid) {
            o.obstacle_in_path = hit;
            CA = hit ? Math.min(s.working_height, s.obstacle_depth) : s.working_height;
            o.available_clearance = CA;
            add('WAH-P-004', 'info', { hit: hit, w: band, d: CA, h: s.working_height });
          }
        }
        if (CR !== null && CA !== null) {
          o.margin = CA - CR;
          add('WAH-P-005', o.margin >= 0 ? 'pass' : 'fail', { r: Math.abs(o.margin) });
        }
      }
      o.rescue_required = true;
      add('WAH-G-002', 'attention', {});
    }
    var nf_ = 0, nr = 0, ni = 0;
    F.forEach(function (f) {
      if (f.status === 'fail') nf_ += 1;
      else if (f.status === 'attention') nr += 1;
      else if (f.status === 'insufficient') ni += 1;
    });
    o.status = !complete ? 'incomplete' : (nf_ > 0 ? 'finding' : 'clear');
    o.findings_open = nf_;
    o.review_items = nr;
    o.missing_inputs = ni;
    o.data_complete = complete;
    o.findings = F.map(function (f) { return { rule: f.rule, status: f.status }; });
    return { o: o, F: F };
  }

  /* one card of the comparison: the same evaluate(), reduced */
  function summarize(inp) {

      system_mode: r.system_mode, status: r.status,
      required_clearance: r.required_clearance === undefined ? null : r.required_clearance,
      available_clearance: r.available_clearance === undefined ? null : r.available_clearance,
      margin: r.margin === undefined ? null : r.margin,
      swing_warning: r.swing_warning === undefined ? null : r.swing_warning,
      edge_reserve: r.edge_reserve === undefined ? null : r.edge_reserve,
      rail_reserve: r.rail_reserve === undefined ? null : r.rail_reserve
    };
  }

    var o = r.o;
    var cfg = inp.comparison_configs || [];
    o.comparison = cfg.map(function (c) { return summarize(c); });
    return r;
  }

  var M = {

    row(S.dring_shift, o.c_dring_shift, S.bUser);

  function el(tag, attrs, kids) {

    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'onclick') n.addEventListener('click', attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });

  }
  function findingsNode(F, l) {

      var r = RULES[f.rule];
      ul.appendChild(el('li', { class: TONE[f.status] }, [

  var CFG_IDS = ['A', 'B', 'C', 'D'];

    if (sm.system_mode === 'restraint') return [P(S.tEdgeReserve, l), isNum(sm.edge_reserve) ? nm(sm.edge_reserve, l) : '—'];
    return [P(S.tRailReserve, l), isNum(sm.rail_reserve) ? nm(sm.rail_reserve, l) : '—'];

  function compareNode(o, l) {

    if (!cfg.length) { box.appendChild(el('p', { class: 'wah-msg', text: P(S.cmpEmpty, l) })); return box; }
    var cur = JSON.stringify(inputsFor(state));

        rows.push(el('div', { class: 'v', text: (isNum(sm.required_clearance) ? nm(sm.required_clearance, l) : '—') + ' / ' + (isNum(sm.available_clearance) ? nm(sm.available_clearance, l) : '—') }));
        rows.push(el('div', { class: 'k', text: P(S.tSwing, l) + ': ' + (sm.swing_warning == null ? '—' : P(sm.swing_warning ? S.yes : S.no, l)) }));

  var legendSig = '';

    if (!stage) return;

  function clampN(v, lo, hi) { return Math.round(Math.min(hi, Math.max(lo, v)) * 1000) / 1000; }
  function sceneObjects(s) {
    if (!last) recompute();
    var g = geomOf(s, last), list = [
      { id: 'worker', x: -g.e, y: g.hD * 0.6 },
      { id: 'edge', x: 0, y: 0 }
    ];
    if (s.mode !== 'guardrail') list.push({ id: 'anchor', x: g.a, y: g.hA });
    else list.push({ id: 'rail', x: -0.05, y: isNum(s.rail_height) ? s.rail_height : 0 });
    if (g.obs) list.push({ id: 'obstacle', x: (s.obstacle_near + s.obstacle_far) / 2, y: -s.obstacle_depth });
    return list;
  }
  function moveObject(obj, p) {
    var s = state;
    if (obj.id === 'worker') s.edge_distance = clampN(-p.x, 0, 30);
    else if (obj.id === 'anchor') { s.anchor_offset = clampN(p.x, -20, 20); s.anchor_height = clampN(p.y, -2, 20); }
    else if (obj.id === 'rail') s.rail_height = clampN(p.y, 0, 3);
    else if (obj.id === 'obstacle') {
      var w = s.obstacle_far - s.obstacle_near;
      var near = clampN(p.x - w / 2, 0, 30);
      s.obstacle_near = near; s.obstacle_far = clampN(near + w, 0, 40);
      s.obstacle_depth = clampN(-p.y, 0, isNum(s.working_height) ? s.working_height : 100);
    } else if (obj.id === 'edge') {
      /* the edge is the frame origin: moving it re-references everything
         that stays put in the building (worker, anchor, obstacle) */
      var dx = p.x;
      if (!isFinite(dx) || Math.abs(dx) < 1e-9) return;
      var ne = clampN(s.edge_distance + dx, 0, 30);
      dx = ne - s.edge_distance;
      s.edge_distance = ne;
      if (isNum(s.anchor_offset)) s.anchor_offset = clampN(s.anchor_offset - dx, -20, 20);
      if (isNum(s.obstacle_near)) { s.obstacle_near = clampN(s.obstacle_near - dx, 0, 30); s.obstacle_far = clampN(s.obstacle_far - dx, 0, 40); }
      if (frozenWin) { frozenWin = { x0: frozenWin.x0 - dx, x1: frozenWin.x1 - dx, y0: frozenWin.y0, y1: frozenWin.y1 }; }
    }
    recompute();
  }

  var LEARN = {

      body: T('It draws one side elevation of a work edge and evaluates the protection you choose: guardrail, restraint or fall arrest. For fall arrest every clearance component is listed, summed and compared with the depth below the edge.', 'Будує боковий розріз краю та оцінює обраний захист: огородження, утримання або зупинку падіння. Для зупинки падіння кожну складову простору показано, підсумовано й порівняно з глибиною під краєм.', 'Es zeichnet eine Seitenansicht der Absturzkante und bewertet den gewählten Schutz: Seitenschutz, Rückhaltung oder Auffangen. Beim Auffangen wird jeder Anteil des Freiraums gelistet, summiert und mit der Tiefe unter der Kante verglichen.', 'Het tekent een zijaanzicht van de valrand en beoordeelt de gekozen bescherming: leuning, begrenzing of valstop. Bij valstop wordt elke component van de vrije ruimte getoond, opgeteld en met de diepte onder de rand vergeleken.', 'Il trace une élévation du bord et évalue la protection choisie : garde-corps, retenue ou arrêt des chutes. En arrêt des chutes, chaque composante du tirant d’air est listée, additionnée et comparée à la profondeur sous le bord.', 'Dibuja un alzado del borde y evalúa la protección elegida: barandilla, retención o anticaídas. En anticaídas cada componente del espacio libre se lista, se suma y se compara con la profundidad bajo el borde.', 'Rysuje widok boczny krawędzi i ocenia wybraną ochronę: balustradę, ograniczenie lub powstrzymywanie spadania. Dla powstrzymywania każda składowa przestrzeni jest pokazana, zsumowana i porównana z głębokością pod krawędzią.')

        body: T('A guardrail protects everyone at the edge without depending on a worker’s actions. Restraint keeps one person from reaching the edge. Fall arrest lets the fall start and stops it. The tool analyses any of the three without forbidding the personal systems.', 'Огородження захищає всіх біля краю незалежно від дій працівника. Утримання не дає одній людині дістатися краю. Зупинка падіння дозволяє падінню початися й зупиняє його. Інструмент аналізує всі три варіанти й не забороняє особисті системи.', 'Seitenschutz schützt alle an der Kante, unabhängig vom Verhalten. Rückhaltung hält eine Person von der Kante fern. Auffangen lässt den Sturz beginnen und stoppt ihn. Das Werkzeug analysiert alle drei, ohne persönliche Systeme zu verbieten.', 'Een leuning beschermt iedereen aan de rand, los van wat de werknemer doet. Begrenzing houdt één persoon weg van de rand. Valstop laat de val beginnen en stopt hem. De tool analyseert alle drie zonder persoonlijke systemen te verbieden.', 'Le garde-corps protège chacun au bord sans dépendre de ses gestes. La retenue empêche une personne d’atteindre le bord. L’arrêt des chutes laisse la chute commencer puis l’arrête. L’outil analyse les trois sans interdire les systèmes individuels.', 'La barandilla protege a todos en el borde sin depender de sus actos. La retención impide a una persona llegar al borde. El anticaídas deja empezar la caída y la detiene. La herramienta analiza los tres sin prohibir los sistemas individuales.', 'Balustrada chroni wszystkich przy krawędzi niezależnie od działań pracownika. Ograniczenie nie pozwala jednej osobie dojść do krawędzi. Powstrzymywanie pozwala upadkowi się zacząć i go zatrzymuje. Narzędzie analizuje wszystkie trzy, nie zakazując systemów indywidualnych.')

        body: T('Lanyard: free fall (length minus anchor height above the D-ring) + absorber extension + D-ring shift + deployment allowance + safety margin, measured down from the working surface. The absorber extension must come from the product instructions; without it the sum stays incomplete.', 'Строп: вільне падіння (довжина мінус висота анкера над D-кільцем) + розкриття амортизатора + зсув D-кільця + запас на розгортання + запас безпеки, від робочої поверхні вниз. Розкриття береться з інструкції; без нього сума неповна.', 'Verbindungsmittel: freier Fall (Länge minus Anschlaghöhe über der Öse) + Aufreißlänge + Ösenverschiebung + Auslösezuschlag + Sicherheitsabstand, von der Arbeitsfläche nach unten. Die Aufreißlänge stammt aus der Gebrauchsanleitung; ohne sie bleibt die Summe unvollständig.', 'Vanglijn: vrije val (lengte min ankerhoogte boven de D-ring) + uitscheurlengte + D-ringverschuiving + ontplooiingstoeslag + veiligheidsmarge, vanaf het werkvlak omlaag. De uitscheurlengte komt uit de gebruiksaanwijzing; zonder die blijft de som onvolledig.', 'Longe : chute libre (longueur moins hauteur d’ancrage au-dessus de l’anneau) + allongement de l’absorbeur + glissement + marge de déploiement + marge de sécurité, depuis le plan de travail. L’allongement vient de la notice ; sans lui la somme reste incomplète.', 'Cabo: caída libre (longitud menos altura del anclaje sobre la anilla) + elongación + desplazamiento de la anilla + holgura + margen, desde la superficie de trabajo. La elongación sale de las instrucciones; sin ella la suma queda incompleta.', 'Linka: swobodny spadek (długość minus wysokość kotwy nad klamrą) + wydłużenie amortyzatora + przesunięcie klamry + naddatek + margines, od powierzchni roboczej w dół. Wydłużenie pochodzi z instrukcji; bez niego suma jest niepełna.')

        body: T('Same 2 m lanyard, D-ring at 1.5 m. Anchor 2.0 m above the surface: free fall 2.0 − 0.5 = 1.5 m, sum 4.55 m. Anchor at foot level: free fall 2.0 + 1.5 = 3.5 m, sum 6.55 m, and the lanyard now runs over the edge. The tour loads both cases and puts them into the comparison.', 'Той самий строп 2 м, D-кільце на 1,5 м. Анкер на 2,0 м: вільне падіння 2,0 − 0,5 = 1,5 м, сума 4,55 м. Анкер на рівні ступнів: 2,0 + 1,5 = 3,5 м, сума 6,55 м, і строп проходить через край. Тур завантажує обидва випадки в порівняння.', 'Gleiches 2-m-Verbindungsmittel, Öse auf 1,5 m. Anschlag 2,0 m über der Fläche: freier Fall 2,0 − 0,5 = 1,5 m, Summe 4,55 m. Anschlag auf Fußhöhe: 2,0 + 1,5 = 3,5 m, Summe 6,55 m, und das Seil läuft über die Kante. Die Tour lädt beide Fälle in den Vergleich.', 'Dezelfde vanglijn van 2 m, D-ring op 1,5 m. Anker 2,0 m boven het vlak: vrije val 2,0 − 0,5 = 1,5 m, som 4,55 m. Anker op voethoogte: 2,0 + 1,5 = 3,5 m, som 6,55 m, en de lijn loopt over de rand. De rondleiding laadt beide gevallen in de vergelijking.', 'Même longe de 2 m, anneau à 1,5 m. Ancrage à 2,0 m : chute libre 2,0 − 0,5 = 1,5 m, somme 4,55 m. Ancrage au niveau des pieds : 2,0 + 1,5 = 3,5 m, somme 6,55 m, et la longe passe sur l’arête. La visite charge les deux cas dans la comparaison.', 'Mismo cabo de 2 m, anilla a 1,5 m. Anclaje a 2,0 m: caída libre 2,0 − 0,5 = 1,5 m, suma 4,55 m. Anclaje a nivel de pies: 2,0 + 1,5 = 3,5 m, suma 6,55 m, y el cabo pasa por la arista. El recorrido carga ambos casos en la comparación.', 'Ta sama linka 2 m, klamra na 1,5 m. Kotwa 2,0 m nad powierzchnią: spadek 2,0 − 0,5 = 1,5 m, suma 4,55 m. Kotwa na poziomie stóp: 2,0 + 1,5 = 3,5 m, suma 6,55 m, a linka pracuje na krawędzi. Prezentacja wczytuje oba przypadki do porównania.')

        body: T('When the anchor is not above the fall line, the arrested body swings toward the anchor’s vertical. The angle is asin(offset / length) and the pendulum drop is length − √(length² − offset²). A set-back anchor swings the body into the structure face; that is reported separately from the vertical sum.', 'Якщо анкер не над лінією падіння, тіло після зупинки розгойдується до вертикалі анкера. Кут = asin(зміщення / довжина), перепад = довжина − √(довжина² − зміщення²). Анкер углибині кидає тіло на стіну; це показано окремо від вертикальної суми.', 'Steht der Anschlagpunkt nicht über der Falllinie, pendelt der Körper zur Senkrechten des Anschlagpunkts. Winkel = asin(Versatz / Länge), Absenkung = Länge − √(Länge² − Versatz²). Ein zurückgesetzter Anschlag schwingt den Körper gegen das Bauwerk; das steht getrennt von der senkrechten Summe.', 'Staat het anker niet boven de vallijn, dan slingert het lichaam naar de verticaal van het anker. Hoek = asin(verzet / lengte), daling = lengte − √(lengte² − verzet²). Een teruggezet anker slingert het lichaam tegen de gevel; dat staat los van de verticale som.', 'Si l’ancrage n’est pas à l’aplomb de la ligne de chute, le corps oscille vers la verticale de l’ancrage. Angle = asin(décalage / longueur), descente = longueur − √(longueur² − décalage²). Un ancrage en retrait projette le corps contre la façade ; c’est signalé hors somme verticale.', 'Si el anclaje no está sobre la línea de caída, el cuerpo oscila hacia la vertical del anclaje. Ángulo = asin(desplazamiento / longitud), descenso = longitud − √(longitud² − desplazamiento²). Un anclaje retrasado lleva el cuerpo contra la fachada; se informa aparte de la suma vertical.', 'Gdy kotwa nie jest nad linią spadania, ciało po zatrzymaniu wychyla się ku pionowi kotwy. Kąt = asin(przesunięcie / długość), obniżenie = długość − √(długość² − przesunięcie²). Kotwa cofnięta w głąb rzuca ciało na ścianę; podano to osobno od sumy pionowej.')

    ['working_height', 'edge_distance', 'anchor_offset', 'anchor_height', 'obstacle_present', 'obstacle_depth', 'obstacle_near', 'obstacle_far'].forEach(function (k) { inRow(k, groupG); });
    ['absorber_extension', 'max_free_fall', 'srl_arrest_distance', 'rail_min_height'].forEach(function (k) { inRow(k, groupS); });
    var appendices = [];
    if (o.comparison && o.comparison.length) {
      appendices.push({
        title: P(S.pCompare, l),
        head: [P(S.cmpConfig, l), P(S.sys, l), P(S.cmpKey, l), P(S.tStatus, l)],
        cols: '22mm 1fr 1.2fr 1.4fr',
        rows: o.comparison.map(function (sm, i) {
          var kf = keyFigure(sm, l);
          return [CFG_IDS[i], P(MODE_LABEL[sm.system_mode], l), kf[0] + ': ' + kf[1], statusMark(sm.status) + ' ' + P(statusText(sm.status), l)];
        })

    }
    var f = fig(ctx);
    var notes = [P(S.methodNote1, l), P(S.methodNote2, l)];
    var sym = P(S.symbols, l);
    if (mode === 'restraint') notes = [P(S.methodNote3, l)];
    if (mode === 'guardrail') notes = [P(S.methodNote4, l)];

    return {
      title: P(S.reportTitle, l),
      executive: { text: exec, results: tiles },
      assumptions: assumptions,
      system: null,
      results: results,
      checks: checks,
      risks: [], actions: [], decisions: [],
      figures: f ? [f] : [],
      method: { equations: EQUATIONS[mode] || [], ranges: [], notes: notes,
        references: ['EN 363, EN 365, EN 795, EN 355, EN 360 (system and product concepts; editions not confirmed)', 'ISO 45001:2018, 8.1.2', 'Directive 2009/104/EC, Annex II, section 4', 'EN 13374 (guardrail values belong in the rule pack)'] },

  /* ---------------------------------------------------------- python */
  var PY_MODEL = [
    'EPS = 1e-9',
    "SIGNED = ['anchor_offset', 'anchor_height']",
    '',
    'OUT_KEYS = {',
    "    'guardrail': ['system_mode', 'rail_reserve'],",
    "    'restraint': ['system_mode', 'reach_horizontal', 'edge_reserve', 'work_position_distance'],",
    "    'arrest': ['system_mode', 'connector', 'required_clearance', 'available_clearance', 'margin', 'swing_warning',",
    "               'free_fall', 'c_free_fall', 'c_absorber', 'c_geometric_drop', 'c_arrest_distance', 'c_dring_shift',",
    "               'c_deployment', 'c_safety_margin', 'swing_offset', 'swing_angle', 'swing_drop', 'obstacle_in_path',",
    "               'fall_band', 'work_position_distance', 'rescue_required'],",
    '}',
    '',
    '',
    'def _num(v):',
    '    return isinstance(v, (int, float)) and not isinstance(v, bool) and math.isfinite(v)',
    '',
    '',
    'def evaluate(s):',
    '    """Port of the page\'s evaluate(): same terms, same order."""',
    '    F = []',
    "    mode = s.get('mode')",
    "    o = {k: None for k in OUT_KEYS.get(mode, OUT_KEYS['guardrail'])}",
    "    o['system_mode'] = mode",
    '    st = {"complete": True}',
    '',
    '    def add(rule, status):',
    "        F.append({'rule': rule, 'status': status})",
    '',
    '    def bad(k):',
    "        return (not _num(s.get(k))) or (k not in SIGNED and s[k] < 0)",
    '',
    '    def need_all(keys):',
    '        ok = True',
    '        for k in keys:',
    '            if bad(k):',
    "                add('WAH-I-001', 'insufficient')",
    '                st["complete"] = False',
    '                ok = False',
    '        return ok',
    '',
    '    def need_man(key, rule):',
    '        if bad(key):',
    "            add(rule, 'insufficient')",
    '            st["complete"] = False',
    '            return False',
    "        add(rule, 'pass')",
    '        return True',
    '',
    "    if mode == 'guardrail':",
    "        add('WAH-G-001', 'info')",
    "        if need_all(['rail_height', 'rail_min_height']):",
    "            o['rail_reserve'] = s['rail_height'] - s['rail_min_height']",
    "            add('WAH-R-001', 'pass' if o['rail_reserve'] >= 0 else 'fail')",
    "    elif mode == 'restraint':",
    "        add('WAH-G-001', 'info')",
    "        if need_all(['edge_distance', 'anchor_offset', 'anchor_height', 'connector_length', 'dring_height', 'body_allowance']):",
    "            d0 = s['anchor_height'] - s['dring_height']",
    "            L = s['connector_length']",
    '            if L < abs(d0) - EPS:',
    "                add('WAH-P-009', 'insufficient')",
    '                st["complete"] = False',
    '            else:',
    "                add('WAH-P-009', 'pass')",
    '                rh = math.sqrt(max(0, L * L - d0 * d0))',
    "                o['reach_horizontal'] = rh",
    "                o['edge_reserve'] = -(s['anchor_offset'] + rh + s['body_allowance'])",
    "                add('WAH-P-010', 'pass' if o['edge_reserve'] >= 0 else 'fail')",
    "                hw = abs(s['edge_distance'] + s['anchor_offset'])",
    "                o['work_position_distance'] = hw",
    '                if hw <= rh + EPS:',
    "                    add('WAH-P-012', 'pass')",
    '                else:',
    "                    add('WAH-P-012', 'insufficient')",
    '                    st["complete"] = False',
    '    else:',
    "        mode = 'arrest'",
    "        o['system_mode'] = 'arrest'",
    "        add('WAH-G-001', 'info')",
    "        srl = s.get('connector') == 'srl'",
    "        o['connector'] = 'srl' if srl else 'lanyard'",
    "        base = need_all(['working_height', 'edge_distance', 'anchor_offset', 'anchor_height',",
    "                         'dring_height', 'dring_shift', 'deployment_allowance', 'safety_margin', 'body_width'])",
    '        has_l = True',
    '        if not srl:',
    "            if not need_all(['connector_length']):",
    '                base = False',
    "        elif s.get('connector_length') is None:",
    '            has_l = False',
    "        elif not need_all(['connector_length']):",
    '            base = False',
    "        man = need_man('srl_arrest_distance', 'WAH-M-002') if srl else need_man('absorber_extension', 'WAH-M-001')",
    '        obs_ok = True',
    "        if s.get('obstacle_present'):",
    "            obs_ok = need_all(['obstacle_depth', 'obstacle_near', 'obstacle_far'])",
    '        CR = None',
    '        if base:',
    "            dx = abs(s['anchor_offset'])",
    "            d0 = s['anchor_height'] - s['dring_height']",
    "            L = s.get('connector_length')",
    "            o['swing_offset'] = dx",
    '            geom_ok = True',
    '            if has_l:',
    '                if L < abs(d0) - EPS:',
    "                    add('WAH-P-009', 'insufficient')",
    '                    st["complete"] = False',
    '                    geom_ok = False',
    '                else:',
    "                    add('WAH-P-009', 'pass')",
    '            if srl and d0 < 0:',
    "                add('WAH-M-004', 'insufficient')",
    '                st["complete"] = False',
    '                geom_ok = False',
    '            if (not srl) and d0 < 0:',
    "                add('WAH-M-005', 'attention')",
    '            if geom_ok:',
    '                r0 = math.sqrt(dx * dx + d0 * d0)',
    "                hx = s['edge_distance'] + s['anchor_offset']",
    '                dw = math.sqrt(hx * hx + d0 * d0)',
    "                o['work_position_distance'] = dw",
    '                if not has_l:',
    "                    add('WAH-P-008', 'attention')",
    '                else:',
    "                    add('WAH-P-008', 'pass' if L + EPS >= r0 else 'attention')",
    '                    if dw <= L + EPS:',
    "                        add('WAH-P-012', 'pass')",
    '                    else:',
    "                        add('WAH-P-012', 'insufficient')",
    '                        st["complete"] = False',
    '                        geom_ok = False',
    '            if geom_ok:',
    '                if not srl:',
    '                    ff = L - d0',
    "                    o['free_fall'] = ff",
    "                    o['c_free_fall'] = ff",
    "                    add('WAH-P-001', 'info')",
    "                    if not _num(s.get('max_free_fall')):",
    "                        add('WAH-M-003', 'attention')",
    '                    else:',
    "                        add('WAH-M-003', 'pass' if ff <= s['max_free_fall'] + EPS else 'fail')",
    '                    Lt = L',
    '                    first = ff',
    '                    if man:',
    "                        o['c_absorber'] = s['absorber_extension']",
    '                else:',
    '                    Lt = r0',
    '                    first = r0 - d0',
    "                    o['c_geometric_drop'] = first",
    '                    if man:',
    "                        o['c_arrest_distance'] = s['srl_arrest_distance']",
    "                o['c_dring_shift'] = s['dring_shift']",
    "                o['c_deployment'] = s['deployment_allowance']",
    "                o['c_safety_margin'] = s['safety_margin']",
    '                sn = min(1, dx / Lt) if Lt > EPS else 0',
    "                o['swing_angle'] = math.asin(sn) * 180 / math.pi",
    "                o['swing_drop'] = Lt - math.sqrt(max(0, Lt * Lt - dx * dx))",
    "                o['swing_warning'] = dx > EPS",
    "                if o['swing_warning']:",
    "                    add('WAH-P-006', 'attention')",
    "                    add('WAH-P-007', 'attention' if s['anchor_offset'] < 0 else 'info')",
    '                else:',
    "                    add('WAH-P-006', 'pass')",
    '                if man:',
    "                    second = s['srl_arrest_distance'] if srl else s['absorber_extension']",
    "                    CR = first + second + s['dring_shift'] + s['deployment_allowance'] + s['safety_margin']",
    "                    o['required_clearance'] = CR",
    "                    add('WAH-P-003' if srl else 'WAH-P-002', 'info')",
    '            CA = None',
    '            if obs_ok:',
    "                band = max(s['body_width'], s['anchor_offset'] + s['body_width'] / 2 if s['anchor_offset'] > 0 else 0)",
    "                o['fall_band'] = band",
    '                hit = False',
    '                obs_valid = True',
    "                if s.get('obstacle_present'):",
    "                    if s['obstacle_far'] <= s['obstacle_near']:",
    "                        add('WAH-I-001', 'insufficient')",
    '                        st["complete"] = False',
    '                        obs_valid = False',
    "                    if s['obstacle_depth'] < 0 or s['obstacle_depth'] > s['working_height']:",
    "                        add('WAH-I-001', 'insufficient')",
    '                        st["complete"] = False',
    '                        obs_valid = False',
    '                    if obs_valid:',
    "                        hit = s['obstacle_near'] < band and s['obstacle_far'] > 0",
    '                if obs_valid:',
    "                    o['obstacle_in_path'] = hit",
    "                    CA = min(s['working_height'], s['obstacle_depth']) if hit else s['working_height']",
    "                    o['available_clearance'] = CA",
    "                    add('WAH-P-004', 'info')",
    '            if CR is not None and CA is not None:',
    "                o['margin'] = CA - CR",
    "                add('WAH-P-005', 'pass' if o['margin'] >= 0 else 'fail')",
    "        o['rescue_required'] = True",
    "        add('WAH-G-002', 'attention')",
    "    nf = sum(1 for f in F if f['status'] == 'fail')",
    "    nr = sum(1 for f in F if f['status'] == 'attention')",
    "    ni = sum(1 for f in F if f['status'] == 'insufficient')",
    "    o['status'] = 'incomplete' if not st['complete'] else ('finding' if nf > 0 else 'clear')",
    "    o['findings_open'] = nf",
    "    o['review_items'] = nr",
    "    o['missing_inputs'] = ni",
    "    o['data_complete'] = st['complete']",
    "    o['findings'] = F",
    '    return o',
    '',
    '',
    'def summarize(inp):',
    '    r = evaluate(inp)',
    "    return {k: r.get(k) for k in ['system_mode', 'status', 'required_clearance', 'available_clearance',",
    "                                  'margin', 'swing_warning', 'edge_reserve', 'rail_reserve']}",
    '',
    '',
    'def compute():',
    '    """Evaluate the recorded inputs and every stored comparison configuration."""',
    '    o = evaluate(INPUTS)',
    "    o['comparison'] = [summarize(c) for c in INPUTS.get('comparison_configs', [])]",
    '    return o'
  ].join('\n');

  function pythonSpec() {
    if (!last) recompute();
    return {
      code: PY_MODEL,
      requires: [],
      scope: 'the complete geometric model of the page (evaluate, comparison summaries); localized sentences are not exported',
      basis: { kind: 'reproduce', note: 'evaluate() is ported term by term from the page, in the same order of operations; findings are exported as rule id and status', deviation: 'none expected beyond the last digit of asin() between two libm implementations' },
      selftest: { tolerance: 1e-12, note: 'same IEEE-754 operations in the same order; asin() may differ by one unit in the last place between JavaScript and C libm' }
    };
  }

  /* ---------------------------------------------------------- exchange */
  var EXCHANGE_KEY = 'tools.petrov.re/safety-exchange/wah.controls';
  function manifestRev() { try { return Diagram.manifest().manifest_revision; } catch (e) { return '2026-09-16.workatheight.b2'; } }
  /* Exchange item contract v1: status ok|open|insufficient|na, blocking,
     origin_status (the native word), note. Mapping: no-finding->ok,
     finding|incomplete->open (blocking), review->open (non-blocking),
     required (rescue)->open (blocking, note), declared->na. */
  var CONTRACT = {
    'no-finding': { status: 'ok', blocking: false },
    'finding': { status: 'open', blocking: true },
    'incomplete': { status: 'open', blocking: true },
    'review': { status: 'open', blocking: false },
    'required': { status: 'open', blocking: true },
    'declared': { status: 'na', blocking: false }
  };
  function exItem(id, label, origin, extra) {
    var c = CONTRACT[origin] || { status: 'insufficient', blocking: true };
    var it = { id: id, label: label, status: c.status, blocking: c.blocking, origin_status: origin };
    Object.keys(extra || {}).forEach(function (k) { it[k] = extra[k]; });
    return it;
  }
  /* native origin word of a reserve item; shared by the export and the benchmark adapter */
  function reserveOrigin(v, o) { return (!isNum(v) || !o.data_complete) ? 'incomplete' : (v >= 0 ? 'no-finding' : 'finding'); }
  function buildExchange() {
    var r = recompute(), o = r.o;
    var items = [];
    function rs(v) { return reserveOrigin(v, o); }
    items.push(exItem('wah-system', S.sys, 'declared', { value: o.system_mode, note: MODE_LABEL[o.system_mode] }));
    if (o.system_mode === 'arrest') {
      items.push(exItem('wah-connector', S.connector, 'declared', { value: o.connector, note: CONN_LABEL[o.connector] }));
      items.push(exItem('wah-clearance', S.tReserve, rs(o.margin),
        { value: { required_m: o.required_clearance, available_m: o.available_clearance, reserve_m: o.margin },
          note: isNum(o.margin) ? TJ(S.tReserve, { en: nm(o.margin, 'en'), uk: nm(o.margin, 'uk'), de: nm(o.margin, 'de'), nl: nm(o.margin, 'nl'), fr: nm(o.margin, 'fr'), es: nm(o.margin, 'es'), pl: nm(o.margin, 'pl') }) : S.stIncomplete }));
      items.push(exItem('wah-swing', S.tSwing, o.swing_warning == null ? 'incomplete' : (o.swing_warning ? 'review' : 'no-finding'),
        { value: { offset_m: o.swing_offset, angle_deg: o.swing_angle, drop_m: o.swing_drop } }));
      items.push(exItem('wah-rescue', S.rescue, 'required', { value: true, rule: 'WAH-G-002', note: M['WAH-G-002|attention'] }));
    } else if (o.system_mode === 'restraint') {
      items.push(exItem('wah-restraint', S.tEdgeReserve, rs(o.edge_reserve), { value: { reach_m: o.reach_horizontal, reserve_m: o.edge_reserve } }));
    } else {
      items.push(exItem('wah-guardrail', S.tRailReserve, rs(o.rail_reserve), { value: { reserve_m: o.rail_reserve } }));
    }
    var SMAP = { fail: 'finding', attention: 'review', insufficient: 'incomplete' };
    r.F.forEach(function (f, i) {
      if (!SMAP[f.status] || f.rule === 'WAH-G-002') return;
      items.push(exItem('wah-f-' + f.rule + '-' + i, RULES[f.rule].name, SMAP[f.status], { rule: f.rule, note: findingText(f),
        basis: { kind: RULES[f.rule].kind, source: RULES[f.rule].source, jurisdiction: RULES[f.rule].jurisdiction, version: RULES[f.rule].version } }));
    });
    return {
      schema: 'tools.petrov.re/safety-exchange/v1', kind: 'wah.controls',
      source: { id: 'workatheight', file: 'workatheight.html', revision: manifestRev() },
      created_at: new Date().toISOString(),
      items: items,
      notes: { overall_status: o.status, units: 'm', scope: 'one vertical plane; rigid geometry; manufacturer values as entered', inputs: inputsFor(state) }
    };
  }
  function downloadExchange() {
    var doc = buildExchange();
    var txt = JSON.stringify(doc, null, 1);
    if (window.Diagram && Diagram.export && Diagram.export.download) Diagram.export.download('workatheight-wah.controls-' + doc.created_at.replace(/[:.]/g, '-') + '.json', 'application/json', txt);
    return doc;
  }
  function publishExchange(storage) {
    var st = storage;
    try { if (!st) st = window.localStorage; st.setItem(EXCHANGE_KEY, JSON.stringify(buildExchange())); }
    catch (e) { if (ui) ui.notify(P(S.exFail, lang()), { kind: 'warn' }); return false; }
    if (ui) ui.notify(P(S.exDone, lang()), { kind: 'ok' });
    return true;
  }

  function installData() {
    if (!window.Diagram) return;
    Diagram.init({
      id: 'workatheight', file: 'workatheight.html',
      state: {
        serialize: function () { return state; },
        deserialize: function (obj) {
          if (!obj || typeof obj !== 'object') return;
          var src = clone(obj);
          Object.keys(state).forEach(function (k) { if (k in src) state[k] = src[k]; });
          recompute();
          if (ui) { ui.sync(); ui.run(); }
        }
      },
      record: function () { if (!state || !state.mode) return null; return buildRecord(); },
      python: pythonSpec,
      report: { profile: reportProfile },
      handoff: { provides: [], accepts: [] }
    });
    if (Diagram.watchLang) Diagram.watchLang(function () { legendSig = ''; });
  }

  /* ============================================================ benchmark adapter
     Maps each case of the independent reference corpus (sidecar
     benchmarks/workatheight.reference.json, fetched on call, sha256-checked) onto this tool's own inputs, runs the
     same evaluate()/buildExchange mapping the interface uses, and returns the
     benchmark artifact. Nothing in the reference is substituted: an input the
     corpus does not give is passed as missing. */
  var BENCH_KEYS = ['connector', 'working_height', 'edge_distance', 'anchor_offset', 'anchor_height', 'obstacle_present',
    'obstacle_depth', 'obstacle_near', 'obstacle_far', 'connector_length', 'absorber_extension', 'max_free_fall',
    'srl_arrest_distance', 'dring_height', 'dring_shift', 'body_width', 'deployment_allowance', 'safety_margin',
    'body_allowance', 'rail_height', 'rail_min_height'];
  function benchInputs(ri) {
    var s = { mode: null }, notes = [];
    BENCH_KEYS.forEach(function (k) { s[k] = null; });
    function g(k) { return ri[k] === undefined ? null : ri[k]; }
    if (ri.mode === 'fall_arrest') {
      s.mode = 'arrest';
      s.connector = ri.system === 'srl' ? 'srl' : 'lanyard';
      s.working_height = g('working_height_m');
      s.edge_distance = 0;
      notes.push('worker at the edge: edge_distance = 0; anchor_offset_m -> anchor_offset (sign: + outboard)');
      s.anchor_offset = ri.anchor_offset_m === undefined ? 0 : ri.anchor_offset_m;
      s.anchor_height = g('anchor_height_m');
      s.dring_height = g('dring_height_m');
      s.connector_length = g('connector_length_m');
      if (s.connector === 'srl' && ri.connector_length_m === undefined) notes.push('SRL maximum working line length not given by the corpus: passed as missing (the tool then leaves the reach unchecked)');
      s.absorber_extension = g('absorber_extension_m');
      s.srl_arrest_distance = g('srl_arrest_distance_m');
      s.max_free_fall = g('freefall_limit_m');
      s.dring_shift = g('dring_shift_m');
      s.deployment_allowance = g('worker_allowance_m');
      notes.push('worker_allowance_m (U) -> deployment_allowance, the tool\'s additive user allowance');
      s.safety_margin = g('margin_m');
      s.body_width = g('body_envelope_m');
      var ob = ri.obstacle;
      if (ob) {
        s.obstacle_present = true;
        s.obstacle_depth = (isNum(ri.working_height_m) && isNum(ob.top_height_m)) ? ri.working_height_m - ob.top_height_m : null;
        s.obstacle_near = ob.x_from_m; s.obstacle_far = ob.x_to_m;
        notes.push('obstacle top height above the lower level -> obstacle depth below the surface = H - top');
      } else s.obstacle_present = false;
    } else if (ri.mode === 'restraint') {
      s.mode = 'restraint';
      s.anchor_offset = isNum(ri.anchor_setback_m) ? -ri.anchor_setback_m : null;
      s.edge_distance = ri.anchor_setback_m;
      notes.push('anchor_setback_m -> anchor_offset = -setback; the corpus gives no work position, so the worker is placed at the anchor (edge_distance = setback); no check depends on it');
      s.anchor_height = g('anchor_height_m');
      s.dring_height = g('dring_height_m');
      s.connector_length = g('connector_length_m');
      s.body_allowance = g('body_allowance_m');
    } else if (ri.mode === 'guardrail') {
      s.mode = 'guardrail';
      s.rail_height = g('rail_height_m');
      s.rail_min_height = g('rule_min_rail_height_m');
    }
    notes.push('system_mode: tool word "arrest" is reported as "fall_arrest"');
    return { s: s, notes: notes };
  }
  function benchGot(name, r) {
    var o = r.o, F = r.F;
    function has(rule, st) { return F.some(function (f) { return f.rule === rule && (!st || f.status === st); }); }
    switch (name) {
      case 'system_mode': return o.system_mode === 'arrest' ? 'fall_arrest' : o.system_mode;
      case 'required_clearance_m': return o.required_clearance === undefined ? null : o.required_clearance;
      case 'available_clearance_m': return o.available_clearance === undefined ? null : o.available_clearance;
      case 'reserve_m': return o.margin === undefined ? null : o.margin;
      case 'free_fall_m': return o.free_fall === undefined ? null : o.free_fall;
      case 'clearance_ok': return CONTRACT[reserveOrigin(o.margin, o)].status === 'ok';
      case 'rescue_required': return o.rescue_required === true;
      case 'collective_suggested': return F.some(function (f) { return f.rule === 'WAH-G-001' && f.data && f.data.collective === false; });
      case 'has_required_clearance': return isNum(o.required_clearance);
      case 'swing_warning': return o.swing_warning;
      case 'swing_angle_deg': return o.swing_angle;
      case 'swing_drop_m': return o.swing_drop;
      case 'offset_m': return o.swing_offset;
      case 'restraint_reach_m': return o.reach_horizontal === undefined ? null : o.reach_horizontal;
