<script>
(function () {
'use strict';
/* Replacement Equivalence Evaluator — calculation core (pure functions, no DOM).
   Each critical characteristic of the original and the replacement is compared by a stated rule, with
   source, version and confidence on both sides; an unknown never becomes a match, and the same part
   number proves nothing on its own. Commercial-grade dedication adds an acceptance method per critical row. */
var EQ_VERSION = '2026-10-09.eq-3';
var EQ_MODES = ['equivalence', 'dedication'];
var EQ_COMPARISON = ['exact_text', 'range_cover', 'not_below', 'not_above', 'within_tolerance', 'manual'];
var EQ_DISPOSITION = ['confirmed', 'mismatch', 'unknown', 'not_applicable'];
var EQ_CONFIDENCE = ['high', 'medium', 'low', 'unknown'];
var EQ_METHOD = ['tests_inspections', 'survey', 'source_verification', 'supplier_record'];
var EQ_DIMENSION = ['function', 'performance', 'mechanical_interface', 'electrical_interface', 'dimensions', 'material', 'environment', 'qualification', 'fail_safe', 'maintenance', 'software', 'other'];
var EQ_METHOD_COMBINE = ['survey', 'supplier_record'];
var EQ_YNU = ['yes', 'no', 'unknown'];
var EQ_DECISION = ['pending', 'approved', 'rejected'];

function eqNum(v) { return typeof v === 'number' && isFinite(v) ? v : null; }
function eqText(v) { return v === null || v === undefined ? '' : String(v).trim(); }
function eqNorm(v) { return eqText(v).toLowerCase().replace(/\s+/g, ' '); }

/* comparison of one characteristic: {result: match|mismatch|null, gap, margin, margin_low, margin_high} */
function eqCompare(r) {
  var c = r.comparison, out = { result: null, gap: null, margin: null, margin_low: null, margin_high: null };
  if (c === 'manual') {
    if (r.disposition === 'confirmed') out.result = 'match'; else if (r.disposition === 'mismatch') out.result = 'mismatch'; else out.gap = 'disposition_missing';
    return out;
  }
  if (c === 'exact_text') {
    if (!eqText(r.original_text) || !eqText(r.replacement_text)) out.gap = 'value_missing';
    else out.result = eqNorm(r.original_text) === eqNorm(r.replacement_text) ? 'match' : 'mismatch';
    return out;
  }
  if (EQ_COMPARISON.indexOf(c) < 0) { out.gap = 'comparison_unsupported'; return out; }
  var keys = c === 'range_cover' ? ['original_min', 'original_max', 'replacement_min', 'replacement_max'] : c === 'within_tolerance' ? ['original_value', 'replacement_value', 'tolerance'] : ['original_value', 'replacement_value'];
  if (keys.some(function (k) { return eqNum(r[k]) === null; })) { out.gap = 'value_missing'; return out; }
  if (!eqText(r.original_unit) || !eqText(r.replacement_unit)) { out.gap = 'unit_missing'; return out; }
  if (eqNorm(r.original_unit) !== eqNorm(r.replacement_unit)) { out.gap = 'unit_mismatch'; return out; }
  if (c === 'range_cover') {
    if (r.original_min > r.original_max || r.replacement_min > r.replacement_max) { out.gap = 'range_invalid'; return out; }
    out.margin_low = r.original_min - r.replacement_min; out.margin_high = r.replacement_max - r.original_max; out.margin = Math.min(out.margin_low, out.margin_high);
  } else if (c === 'within_tolerance') {
    if (r.tolerance < 0) { out.gap = 'tolerance_invalid'; return out; }
    out.margin = r.tolerance - Math.abs(r.replacement_value - r.original_value);
  } else if (c === 'not_below') out.margin = r.replacement_value - r.original_value;
  else out.margin = r.original_value - r.replacement_value;
  out.result = out.margin >= 0 ? 'match' : 'mismatch';
  return out;
}
function eqRow(r, i, s) {
  var id = eqText(r.id) || ('row-' + (i + 1)), crit = r.critical !== false;
  var o = { id: id, name: eqText(r.name), dimension: EQ_DIMENSION.indexOf(r.dimension) >= 0 ? r.dimension : 'other', critical: crit, comparison: EQ_COMPARISON.indexOf(r.comparison) >= 0 ? r.comparison : null,
    status: 'unknown', margin: null, margin_low: null, margin_high: null, low_confidence: false, gaps: [] };
  if (r.disposition === 'not_applicable') { if (eqText(r.na_reason)) { o.status = 'not_applicable'; } else o.gaps.push('na_reason_missing'); return o; }
  var c = eqCompare(r);
  o.margin = c.margin; o.margin_low = c.margin_low; o.margin_high = c.margin_high;
  if (c.gap) o.gaps.push(c.gap);
  ['original', 'replacement'].forEach(function (side) {
    if (!eqText(r[side + '_source'])) o.gaps.push(side + '_source_missing');
    if (!eqText(r[side + '_version'])) o.gaps.push(side + '_version_missing');
    var cf = r[side + '_confidence'];
    if (EQ_CONFIDENCE.indexOf(cf) < 0 || cf === 'unknown') o.gaps.push(side + '_confidence_unknown');
    else if (cf === 'low') o.low_confidence = true;
  });
  if (s.mode === 'dedication' && crit) {
    /* distinct accepted methods; GL 89-02: a survey or a performance record is combined with another method */
    var m = [r.acceptance_method, r.acceptance_method_2].filter(function (x, k, a) { return EQ_METHOD.indexOf(x) >= 0 && a.indexOf(x) === k; });
    if (!m.length) o.gaps.push('acceptance_method_missing');
    else if (m.length === 1 && EQ_METHOD_COMBINE.indexOf(m[0]) >= 0) o.gaps.push('method_combination_missing');
  }
  o.status = c.result === 'mismatch' ? 'mismatch' : o.gaps.length ? 'unknown' : 'confirmed';
  return o;
}

var EQ_ROW_ACTION = { value_missing: 'complete_comparison_data', unit_missing: 'complete_comparison_data', unit_mismatch: 'convert_to_common_unit', range_invalid: 'complete_comparison_data',
  tolerance_invalid: 'complete_comparison_data', comparison_unsupported: 'complete_comparison_data', disposition_missing: 'engineering_disposition', na_reason_missing: 'justify_not_applicable',
  acceptance_method_missing: 'define_acceptance_method', method_combination_missing: 'add_acceptance_method' };
function eqAnalyse(s) {
  var mode = EQ_MODES.indexOf(s.mode) >= 0 ? s.mode : null, rows = Array.isArray(s.rows) ? s.rows : [];
  var r = { model_version: EQ_VERSION, mode: mode, outcome: 'open', criterion_state: 'unknown', moc_required: false, same_part_number: false, regulatory_scope: 'none',
    rows: [], counts: { rows: 0, confirmed: 0, mismatch: 0, unknown: 0, not_applicable: 0 }, critical_counts: { rows: 0, confirmed: 0, mismatch: 0, unknown: 0, not_applicable: 0 },
    global_gaps: [], warnings: [], actions: [] };
  var reg = !!(eqText(s.jurisdiction) && eqText(s.edition) && eqText(s.regulatory_source));
  r.regulatory_scope = reg ? 'profile_recorded' : 'none';
  if (mode === null) r.global_gaps.push('mode_unsupported');
  if (!eqText(s.intended_function)) r.global_gaps.push('intended_function_missing');
  if (!eqText(s.original_ref)) r.global_gaps.push('original_ref_missing');
  if (!eqText(s.replacement_ref)) r.global_gaps.push('replacement_ref_missing');
  if (mode === 'dedication' && !eqText(s.safety_function)) r.global_gaps.push('safety_function_missing');
  r.rows = rows.map(function (x, i) { return eqRow(x, i, { mode: mode }); });
  r.rows.forEach(function (x) { r.counts.rows++; r.counts[x.status]++; if (x.critical) { r.critical_counts.rows++; r.critical_counts[x.status]++; } });
  var cc = r.critical_counts, applicableCrit = cc.rows - cc.not_applicable;
  if (applicableCrit === 0) r.global_gaps.push('no_critical_characteristics');
  r.same_part_number = !!eqText(s.original_part_no) && eqNorm(s.original_part_no) === eqNorm(s.replacement_part_no);
  r.moc_required = r.counts.mismatch > 0;
  if (cc.mismatch) r.outcome = 'not_equivalent';
  else if (cc.unknown || r.global_gaps.length) r.outcome = 'open';
  else if (r.counts.mismatch || r.counts.unknown) r.outcome = 'equivalent_with_conditions';
  else if (r.same_part_number && s.like_for_like_claim === 'yes') r.outcome = 'like_for_like';
  else r.outcome = 'equivalent';
  r.criterion_state = r.outcome === 'not_equivalent' ? 'not_met' : r.outcome === 'open' ? 'unknown' : 'met';

AnalogNote":"Alternativer Messumformer: Gussgehäuse durch technische Bewertung bestätigt; 0,4 kg schwerer, eine nichtkritische Abweichung für MOC.","exSensor":"Sensor mit anderer Qualifikation (typisch)","exSensorNote":"Gleicher Messbereich und gleiches Gewinde, qualifizierte Umgebungstemperatur 55 °C gegenüber 70 °C beim Original: kritische Nichtübereinstimmung.","exSeal":"Dichtungswerkstoff unbekannt (Problem)","exSealNote":"Neuer Dichtungssatz: Der Werkstoff für boriertes Wasser ist nicht angegeben, daher bleibt die Äquivalenz offen.","exCgd":"Handelsübliches Relais (Qualifizierung)","exCgdNote":"Handelsübliches Relais für eine sicherheitsrelevante Auslösung: Methoden für drei Merkmale gewählt, die Begutachtung der Kontaktbelastbarkeit noch ohne zweite Methode; Erdbebenfestigkeit unbekannt.","exTry":"Versuch: gleiche Größe, andere Dichtung","exTryNote":"DN50 PN40 und Durchmesser stimmen überein; Betriebstemperatur prüfen.","exFix":"Korrektur: Dichtung für den Betrieb ausgelegt","exFixNote":"Graphitgefüllte Spiraldichtung, ausgelegt für 450 °C.","learnIntroTitle":"Eignung nachweisen, Merkmal für Merkmal","learnIntro":"Ein Ersatz ist nur dann äquivalent, wenn jedes kritische Merkmal nach einer angegebenen Regel verglichen ist und beide Werte eine Quelle haben. Unbekanntes bleibt unbekannt; dieselbe Teilenummer beweist für sich allein nichts.","learnDataTitle":"Zeilen, Regeln und Quellen","learnData":"Jede Zeile benennt ein Merkmal, kennzeichnet es als kritisch oder nicht und wählt eine Regel: gleicher Text, Bereichsabdeckung, nicht darunter, nicht darüber, innerhalb der Toleranz oder technische Einstufung. Beide Seiten brauchen Quelle, Revisionsstand und Vertrauensgrad.","learnModelTitle":"Ergebnis","learnModel":"Eine kritische Nichtübereinstimmung ergibt „nicht äquivalent“. Eine kritische Lücke oder fehlende Identifikation ergibt „offen“. Nichtkritische Abweichungen ergeben „äquivalent mit Auflagen“ und ein MOC. Gleichwertigkeit 1:1 erfordert dieselbe Teilenummer, den Anspruch und keine Abweichung. Die Qualifizierung handelsüblicher Komponenten fügt je kritischer Zeile eine Abnahmemethode hinzu.","learnTryTitle":"Versuch: Die Dichtung passt","learnTry":"Öffnen Sie „Versuch: gleiche Größe, andere Dichtung“. Größe DN50 PN40 und Außendurchmesser stimmen genau überein. Bevor Sie weiterlesen: Kann die PTFE-Mantel-Dichtung die Spiraldichtung in dieser Leitung ersetzen?","learnExplainTitle":"Die verborgene Unverträglichkeit","learnExplain":"Die Dampfleitung arbeitet bei 280 °C. Die Originaldichtung ist für 450 °C ausgelegt, die PTFE-Mantel-Dichtung für 260 °C: 190 °C unter dem Original und 20 °C unter der Betriebstemperatur. Gleiche Größe, falscher Einsatzbereich: Die kritische Zeile scheitert, das Ergebnis ist „nicht äquivalent“.","learnFixTitle":"Korrektur: den Einsatzbereich vergleichen","learnFix":"Öffnen Sie „Korrektur: Dichtung für den Betrieb ausgelegt“: eine graphitgefüllte Spiraldichtung, ausgelegt für 450 °C. Jede Zeile ist bestätigt, das Ergebnis ist „äquivalent“.","learnBoundaryTitle":"Ergebnis und Entscheidung","learnBoundary":"Das Ergebnis ist ein technischer Vergleich. Eine regulatorische Schlussfolgerung erfordert das benannte Profil und dessen Nachweise; die Freigabe bleibt beim verantwortlichen Ingenieur und veraltet nach jeder Eingabeänderung.","reportTitle":"Nachweis der Ersatzäquivalenz","modelVersion":"Modellversion","eqNote":"x_o Wert Original, x_r Wert Ersatz, δ Toleranz, m Reserve; ein Merkmal stimmt überein, wenn m ≥ 0.","modelText":"Ein unbekannter Wert, eine unbekannte Einheit oder Quelle hält die Zeile offen; der Vergleich der Einheiten erfolgt als Text, ohne Umrechnung. Die Qualifizierung handelsüblicher Komponenten erfordert für jedes kritische Merkmal eine Abnahmemethode.","boundaryText":"Ergebnis, Freigabe und Einsatzfreigabe sind getrennt. Eine regulatorische Schlussfolgerung erfordert das benannte Profil und dessen Nachweise; das Werkzeug erfasst das Profil und gibt kein Urteil ab.","scopeText":"V onformiteitsverklaring.","exControl":"Exacte vervanging (controlegeval)","exControlNote":"Zelfde meetomvormermodel, nieuwere revisie: vijf kenmerken bevestigd met gegevensbladen; gelijkwaardige 1-op-1-vervanging.","exAnalog":"Alternatief met ander materiaal","exAnalogNote":"Alternatieve meetomvormer: gietbehuizing bevestigd door technische evaluatie; 0,4 kg zwaarder, een niet-kritieke afwijking voor MOC.","exSensor":"Sensor met andere kwalificatie (typisch)","exSensorNote":"Zelfde bereik en schroefdraad, gekwalificeerde omgevingstemperatuur 55 °C tegenover 70 °C bij het origineel: kritieke niet-overeenstemming.","exSeal":"Afdichtingsmateriaal onbekend (probleem)","exSealNote":"Nieuwe afdichtingsset: het materiaal voor boorhoudend water is niet vermeld, dus de equivalentie blijft onbeslist.","exCgd":"Commercieel relais (kwalificatie)","exCgdNote":"Commercieel relais voor een veiligheidsgerelateerde uitschakeling: methoden gekozen voor drie kenmerken, de audit van de contactbelastbaarheid nog zonder tweede methode; seismische bestendigheid onbekend.","exTry":"Probeer: zelfde maat, andere pakking","exTryNote":"DN50 PN40 en diameter komen overeen; controleer de bedrijfstemperatuur.","exFix":"Correctie: pakking voor de bedrijfscondities","exFixNote":"Grafietgevulde spiraalgewonden pakking, geschikt tot 450 °C.","learnIntroTitle":"Toon geschiktheid aan, kenmerk voor kenmerk","learnIntro":"Een vervanging is alleen gelijkwaardig als elk kritiek kenmerk volgens een vermelde regel is vergeleken en beide waarden een bron hebben. Onbekend blijft onbekend; hetzelfde onderdeelnummer bewijst op zich niets.","learnDataTitle":"Rijen, regels en bronnen","learnData":"Elke rij noemt een kenmerk, markeert het als kritiek of niet en kiest een regel: zelfde tekst, bereikdekking, niet lager, niet hoger, binnen tolerantie of een technische beoordeling. Beide zijden hebben een bron, een revisie en een betrouwbaarheid nodig.","learnModelTitle":"Uitkomst","learnModel":"Een kritieke niet-overeenstemming geeft ‘niet gelijkwaardig’. Een kritieke leemte of ontbrekende identificatie geeft ‘onbeslist’. Niet-kritieke afwijkingen geven ‘gelijkwaardig onder voorwaarden’ en een MOC. Een gelijkwaardige 1-op-1-vervanging vereist hetzelfde onderdeelnummer, de claim en geen afwijking. Kwalificatie van commerciële componenten voegt per kritieke rij een acceptatiemethode toe.","learnTryTitle":"Probeer: de pakking past","learnTry":"Open ‘Probeer: zelfde maat, andere pakking’. Maat DN50 PN40 en de buitendiameter komen exact overeen. Voordat u verder leest: kan de PTFE-mantelpakking de spiraalgewonden pakking in deze leiding vervangen?","learnExplainTitle":"De verborgen onverenigbaarheid","learnExplain":"De stoomleiding werkt op 280 °C. De originele pakking is geschikt tot 450 °C, de PTFE-mantelpakking tot 260 °C: 190 °C onder het origineel en 20 °C onder de bedrijfstemperatuur. Zelfde maat, verkeerd toepassingsbereik: de kritieke rij faalt en het resultaat is ‘niet gelijkwaardig’.","learnFixTitle":"Correctie: vergelijk het toepassingsbereik","learnFix":"Open ‘Correctie: pakking voor de bedrijfscondities’: een grafietgevulde spiraalgewonden pakking, geschikt tot 450 °C. Elke rij is bevestigd en het resultaat is ‘gelijkwaardig’.","learnBoundaryTitle":"Resultaat en beslissing","learnBoundary":"De uitkomst is een technische vergelijking. Een regelgevende conclusie vereist het benoemde profiel en het bijbehorende bewijs; de goedkeuring blijft bij de verantwoordelijke ingenieur en verloopt na elke wijziging van de invoer.","reportTitle":"Verslag van vervangingsequivalentie","modelVersion":"Modelversie","eqNote":"x_o waarde origineel, x_r waarde vervanging, δ tolerantie, m marge; een kenmerk komt overeen als m ≥ 0.","modelText":"Een onbekende waarde, eenheid of bron houdt de rij onbeslist; eenheden worden als tekst vergeleken en nooit omgerekend. Kwalificatie van commerciële componenten vereist een acceptatiemethode voor elk kritiek kenmerk.","boundaryText":"Uitkomst, goedkeuring en vrijgave zijn gescheiden. Een regelgevende conclusie vereist het benoemde profiel en het bijbehorende bewijs; het instrument legt het profiel vast en geeft geen oordeel.","scopeText":"Vergelijking van een originele component en de vervanging ervan op kritieke kenmerken, met bewijs aan beide zijden, en kwalificatie van een commerciële component voor een veiligheidsfunctie. Het instrument kwalificeert geen componenten, rekent geen eenheden om en vervangt de goedkeuring van de verantwoordelijke ingenieur niet.","acceptanceMethod2":"Tweede acceptatiemethode","g_method_combination_missing":"audit of prestatiehistorie zonder tweede methode","a_add_acceptance_method":"Combineer de audit of prestatiehistorie met een tweede acceptatiemethode (GL 89-02)."},"fr":{"title":"Évaluateur d’équivalence de remplacement","subtitle":"Est-il démontré que le remplacement convient à la place de l’original ? Caractéristique par caractéristique, avec des sources des deux côtés ; dédicace d’articles de qualité commerciale en mode distinct","identification":"Article et remplacement","modeLabel":"Mode d’évaluation","modeEquivalence":"Équivalence","modeDedication":"Dédicace d’articles de qualité commerciale","item":"Article / repère","intendedFunction":"Fonction prévue","safetyFunction":"Fonction de sûreté","originalRef":"Original : description et révision","originalPn":"Référence de l’original","replacementRef":"Remplacement : description et révision","replacementPn":"Référence du remplacement","likeForLikeClaim":"Remplacement à l’identique revendiqué","syntheticCase":"Cas pédagogique synthétique","regProfile":"Profil réglementaire","regNote":"Indiquez la juridiction, l’édition et la source pour enregistrer un profil. Sans profil, le résultat n’est qu’une comparaison d’ingénierie ; l’outil ne rend jamais de verdict réglementaire.","jurisdiction":"Juridiction","edition":"Édition / révision","regSource":"Document source","regScope":"Périmètre réglementaire","regNone":"aucun profil","regReco ifié.","gg_replacement_ref_missing":"Article de remplacement non identifié.","gg_safety_function_missing":"La dédicace exige la fonction de sûreté assurée par l’article.","gg_no_critical_characteristics":"Aucune caractéristique critique applicable n’est définie.","w_no_regulatory_profile":"Aucun profil réglementaire : le résultat n’est qu’une comparaison d’ingénierie.","w_same_part_number_not_sufficient":"Les références sont identiques, ce qui à lui seul ne démontre pas l’équivalence.","w_like_for_like_claim_unsupported":"Le remplacement à l’identique est revendiqué, mais la comparaison ne le démontre pas.","w_low_confidence_evidence":"Certaines caractéristiques confirmées reposent sur des preuves de faible niveau de confiance.","w_duplicate_row_ids":"Deux caractéristiques partagent le même ID.","w_approval_contradiction":"Une approbation est enregistrée alors que le critère technique n’est pas satisfait.","w_restored_values":"Restauré : valeurs remplacées ou ôtées — ","a_select_mode":"Choisir un mode pris en charge.","a_complete_identification":"Identifier les deux articles et la fonction prévue.","a_define_safety_function":"Indiquer la fonction de sûreté (dédicace).","a_define_critical_characteristics":"Définir les caractéristiques critiques pour cette application.","a_requalify":"Qualifier le remplacement pour le domaine de qualification d’origine ou lancer une modification.","a_raise_moc":"Écart critique : lancer une modification (MOC, gestion des modifications) ou choisir un autre remplacement.","a_disposition_condition":"Traiter l’écart non critique via MOC.","a_complete_comparison_data":"Compléter les données de comparaison.","a_convert_to_common_unit":"Convertir les deux valeurs en une même unité.","a_engineering_disposition":"Consigner l’avis d’ingénierie avec sa justification.","a_justify_not_applicable":"Indiquer pourquoi la caractéristique ne s’applique pas.","a_define_acceptance_method":"Choisir la méthode d’acceptation pour cette caractéristique critique.","a_obtain_evidence":"Obtenir la source, la révision et le niveau de confiance des données.","a_confirm_low_confidence_evidence":"Confirmer les données de faible niveau de confiance par essai ou document.","a_open_moc":"Ouvrir la modification via MOC pour les écarts enregistrés.","a_record_regulatory_profile":"Enregistrer le profil réglementaire avant toute déclaration de conformité.","exControl":"Remplacement exact (cas témoin)","exControlNote":"Même modèle de transmetteur, révision plus récente : cinq caractéristiques confirmées par fiches techniques ; remplacement à l’identique.","exAnalog":"Produit analogue, autre matériau","exAnalogNote":"Transmetteur alternatif : corps moulé confirmé par évaluation d’ingénierie ; 0,4 kg plus lourd, écart non critique à traiter via MOC.","exSensor":"Capteur d’une autre qualification (typique)","exSensorNote":"Même plage et même filetage, température ambiante qualifiée 55 °C contre 70 °C pour l’original : discordance critique.","exSeal":"Matériau d’étanchéité inconnu (problème)","exSealNote":"Nouveau jeu de joints : le matériau pour l’eau borée n’est pas indiqué, l’équivalence reste donc ouverte.","exCgd":"Relais de qualité commerciale (dédicace)","exCgdNote":"Relais commercial pour un déclenchement lié à la sûreté : méthodes choisies pour trois caractéristiques, l’évaluation du pouvoir de coupure des contacts encore sans deuxième méthode ; tenue sismique inconnue.","exTry":"Essai : même taille, autre joint","exTryNote":"DN50 PN40 et diamètre concordent ; vérifier la température de service.","exFix":"Correction : joint adapté au service","exFixNote":"Joint spiralé à garniture graphite, admissible jusqu’à 450 °C.","learnIntroTitle":"Prouver l’aptitude de chaque caractéristique","learnIntro":"Un remplacement n’est équivalent que si chaque caractéristique critique est comparée selon une règle énoncée et si les deux valeurs ont une source. L’inconnu reste inconnu ; une référence identique ne prouve rien à elle seule.","learnDataTitle":"Lignes, règles et sources","learnData":"Chaque ligne nomme une caractéristique, la marque critique ou non et choisit une règle : même texte, couverture de plage, non inférieur, non supérieur, dans la tolérance ou avis d’ingénierie. Les deux côtés exigent une source, une révision et un niveau de confiance.","learnModelTitle":"Conclusion","learnModel":"Une discordance critique donne « non équivalent ». Une lacune critique ou une identification manquante donne « ouvert ». Des écarts non critiques donnent « équivalent sous conditions » et un MOC. Le remplacement à l’identique exige la même référence, la revendication et aucun écart. La dédicace ajoute une méthode d’acceptation par ligne critique.","learnTryTitle":"Essai : le joint s’adapte","learnTry":"Ouvrez « Essai : même taille, autre joint ». La taille DN50 PN40 et le diamètre extérieur concordent exactement. Avant de poursuivre : le joint à enveloppe PTFE peut-il remplacer le joint spiralé sur cette ligne ?","learnExplainTitle":"L’incompatibilité cachée","learnExplain":"La ligne vapeur fonctionne à 280 °C. Le joint d’origine est admissible jusqu’à 450 °C, le joint à enveloppe PTFE jusqu’à 260 °C : 190 °C sous l’original et 20 °C sous la température de service. Même taille, mauvais domaine d’emploi : la ligne critique échoue et le résultat est « non équivalent ».","learnFixTitle":"Correction : comparer le domaine d’emploi","learnFix":"Ouvrez « Correction : joint adapté au service » : un joint spiralé à garniture graphite, admissible jusqu’à 450 °C. Chaque ligne est confirmée et le résultat est « équivalent ».","learnBoundaryTitle":"Résultat et décision","learnBoundary":"Le résultat est une comparaison d’ingénierie. Une conclusion réglementaire exige le profil désigné et ses preuves ; l’approbation reste du ressort de l’ingénieur responsable et devient périmée après toute modification des données d’entrée.","reportTitle":"Fiche d’équivalence de remplacement","modelVersion":"Version du modèle","eqNote":"x_o valeur de l’original, x_r valeur du remplacement, δ tolérance, m marge ; une caractéristique concorde si m ≥ 0.","modelText":"Une valeur, une unité ou une source inconnue maintient la ligne ouverte ; les unités sont comparées comme du texte et jamais converties. La dédicace d’articles de qualité commerciale exige une méthode d’acceptation pour chaque caractéristique critique.","boundaryText":"Résultat, approbation et libération sont distincts. Une conclusion réglementaire exige le profil désigné et ses preuves ; l’outil enregistre le profil et ne rend aucun verdict.","scopeText":"Comparaison d’un article d’origine et de son remplacement selon les caractéristiques critiques, avec des preuves des deux côtés, et dédicace d’un article de qualité commerciale pour une fonction de sûreté. L’outil ne qualifie pas les articles, ne convertit pas les unités et ne remplace pas l’approbation de l’ingénieur responsable.","acceptanceMethod2":"Deuxième méthode d’acceptation","g_method_combination_missing":"évaluation ou historique de performance sans deuxième méthode","a_add_acceptance_method":"Combinez l’évaluation du fournisseur ou l’historique de performance avec une deuxième méthode d’acceptation (GL 89-02)."},"es":{"title":"Evaluador de equivalencia de sustitución","subtitle":"¿Está demostrado que el sustituto encaja en el lugar del original? Característica por característica, con fuentes en ambos lados; dedicación de grado comercial como modo aparte","identification":"Elemento y sustituto","modeLabel":"Modo","modeEquivalence":"Equivalencia","modeDedication":"Dedicación de grado comercial","item":"Elemento / identificador","intendedFunction":"Función prevista","safetyFunction":"Función de seguridad","originalRef":"Original: descripción y revisión","originalPn":"Número de pieza del original","replacementRef":"Sustituto: descripción y revisión","replacementPn":"Número de pieza del sustituto","likeForLikeClaim":"Sustitución idéntica declarada","syntheticCase":"Caso didáctico sintético","regProfile":"Perfil regulatorio","regNote":"Indique la jurisdicción, la edición y la fuente para registrar un perfil. Sin él, el resultado es solo una comparación de ingeniería; la herramienta nunca emite un veredicto regulatorio.","jurisdiction":"Jurisdicción","edition":"Edición / revisión","regSource":"Documento fuente","regScope":"Alcance regulatorio","regNone":"sin perfil","regRecorded":"perfil registrado","matrix":"Características críticas","editRowTitle":"Característica seleccionada","editRow":"Fila seleccionada","addRow":"Añadir fila","id":"ID","characteristic":"Característica","critical":"crítica","dimension":"Categoría","comparisonRule":"Regla de comparación","cmpExact":"mismo texto / clase","cmpRange":"el rango del sustituto cubre el original","cmpNotBelow":"sustituto no inferior al original","cmpNotAbove":"sustituto no superior al original","cmpTol":"igual dentro de la tolerancia","cmpManual":"dictamen de ingeniería","originalValue":"Valor del original","replacementValue":"Valor del sustituto","originalMin":"Mínimo del original","originalMax":"Máximo del original","replacementMin":"Mínimo del sustituto","replacementMax":"Máximo del sustituto","tolerance":"Tolerancia (±)","originalUnit":"Unidad del original","replacementUnit":"Unidad del sustituto","disposition":"Dictamen","dispConfirmed":"confirmado","dispMismatch":"discrepancia","naReason":"Motivo de no aplicabilidad","acceptanceMethod":"Método de aceptación (dedicación)","methodNone":"no elegido","methodTests":"pruebas e inspecciones especiales","methodSurvey":"auditoría de grado comercial","methodSource":"verificación en origen","methodRecord":"historial de desempeño del proveedor","method_tests_inspections":"pruebas e inspecciones especiales","method_survey":"auditoría de grado comercial","method_source_verification":"verificación en origen","method_supplier_record":"historial de desempeño del proveedor","originalSource":"Original: documento fuente","originalVersion":"Original: revisión / fecha"
