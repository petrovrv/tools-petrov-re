  "title": {"en":"MEP Maintenance Strategy (RCM)","uk":"Стратегія ТО інженерних систем (RCM)","de":"TGA-Instandhaltungsstrategie (RCM)","nl":"Onderhoudsstrategie installaties (RCM)","fr":"Stratégie de maintenance CVC-plomberie-électricité (RCM)","es":"Estrategia de mantenimiento de instalaciones (RCM)","pl":"Strategia utrzymania instalacji budynkowych (RCM)"},
  "summary": {"en":"Reliability-centred maintenance for building services: per failure mode the RCM decision diagram picks condition monitoring, scheduled replacement, a failure-finding test, run-to-failure or redesign, with the interval and the reason.","uk":"Технічне обслуговування, орієнтоване на надійність, для інженерних систем будівель: для кожного виду відмови діаграма RCM обирає контроль стану, планову заміну, тест виявлення відмови, експлуатацію до відмови або зміну проєкту — з інтервалом і обґрунтуванням.","de":"Zuverlässigkeitsorientierte Instandhaltung für die Gebäudetechnik: je Ausfallart wählt das RCM-Entscheidungsdiagramm Zustandsüberwachung, planmäßigen Austausch, Funktionsprüfung, Betrieb bis zum Ausfall oder konstruktive Änderung, mit Intervall und Begründung.","nl":"Betrouwbaarheidsgericht onderhoud voor gebouwinstallaties: per faalwijze kiest het RCM-beslisschema toestandsbewaking, geplande vervanging, een faalzoektest, draaien tot falen of herontwerp, met interval en motivering.","fr":"Maintenance basée sur la fiabilité pour les équipements techniques du bâtiment : pour chaque mode de défaillance, le logigramme RCM choisit surveillance conditionnelle, remplacement programmé, test de détection, fonctionnement jusqu’à défaillance ou reconception, avec l’intervalle et la justification.","es":"Mantenimiento centrado en la fiabilidad para instalaciones de edificios: por cada modo de fallo el diagrama RCM elige vigilancia de condición, sustitución programada, prueba de búsqueda de fallos, operación hasta el fallo o rediseño, con el intervalo y la justificación.","pl":"Utrzymanie ukierunkowane na niezawodność dla instalacji budynkowych: dla każdego rodzaju uszkodzenia diagram RCM wybiera monitorowanie stanu, planową wymianę, test wykrywania uszkodzeń, eksploatację do awarii lub zmianę projektu — z interwałem i uzasadnieniem."},
  "description": {"en":"Follows the RCM decision logic of SAE JA1011/JA1012 (Moubray, RCM II): consequences first (hidden, safety/environment, operational, non-operational), then on-condition tasks with interval (P–F − response)/2, scheduled restoration or discard for wear-out (Weibull age replacement, safe life), failure-finding tests for hidden functions with FFI = 2·U·MTBF, and the default action. The P–F chart shows whether an inspection interval catches the defect in time; the proof-test chart shows how a standby that is never tested slides towards unavailability. Statutory tests are retained whatever the economics. Reads asset classes from MEP Asset Criticality when you press Use, and writes a task list per asset into the shared site register for the planner.","uk":"Застосовує логіку рішень RCM за SAE JA1011/JA1012 (Moubray, RCM II): спершу наслідки (приховані, безпека/довкілля, експлуатаційні, неексплуатаційні), далі завдання за станом з інтервалом (P–F − реагування)/2, планове відновлення чи заміна для зносу (вейбуллівська заміна за віком, безпечний ресурс), тести виявлення відмов для прихованих функцій з FFI = 2·U·MTBF і дія за замовчуванням. Діаграма P–F показує, чи встигає інтервал огляду виявити дефект; діаграма перевірок — як резерв без перевірок сповзає до неготовності. Нормативні перевірки зберігаються незалежно від економіки. Класи активів береться з «Критичності активів» після натискання «Використати»; перелік завдань записується в спільний реєстр для планувальника.","de":"Folgt der RCM-Entscheidungslogik nach SAE JA1011/JA1012 (Moubray, RCM II): zuerst die Folgen (verdeckt, Sicherheit/Umwelt, betrieblich, nicht betrieblich), dann zustandsorientierte Maßnahmen mit Intervall (P–F − Reaktion)/2, planmäßige Instandsetzung oder Austausch bei Verschleiß (Weibull-Altersersatz, sichere Lebensdauer), Funktionsprüfungen verdeckter Funktionen mit FFI = 2·U·MTBF und die Standardmaßnahme. Das P–F-Diagramm zeigt, ob ein Prüfintervall den Schaden rechtzeitig erkennt; das Prüfdiagramm zeigt, wie eine nie geprüfte Reserve in die Nichtverfügbarkeit rutscht. Gesetzliche Prüfungen bleiben unabhängig von der Wirtschaftlichkeit. Übernimmt Anlagenklassen aus der Kritikalitätsbewertung auf Knopfdruck und schreibt je Anlage eine Maßnahmenliste in das gemeinsame Register.","nl":"Volgt de RCM-beslislogica van SAE JA1011/JA1012 (Moubray, RCM II): eerst de gevolgen (verborgen, veiligheid/milieu, operationeel, niet-operationeel), dan toestandstaken met interval (P–F − reactietijd)/2, gepland herstel of vervanging bij slijtage (Weibull-leeftijdsvervanging, veilige levensduur), faalzoektests voor verborgen functies met FFI = 2·U·MTBF en de standaardactie. De P–F-grafiek toont of een inspectie-interval het defect op tijd vindt; de testgrafiek toont hoe een nooit geteste reserve naar onbeschikbaarheid glijdt. Wettelijke tests blijven, ongeacht de economie. Neemt installatieklassen over uit de kritikaliteitstool met Gebruiken en schrijft per installatie een takenlijst in het gedeelde register.","fr":"Applique la logique de décision RCM de la SAE JA1011/JA1012 (Moubray, RCM II) : d’abord les conséquences (cachées, sécurité/environnement, opérationnelles, non opérationnelles), puis les tâches conditionnelles d’intervalle (P–F − délai de réaction)/2, la remise en état ou le remplacement programmé pour l’usure (remplacement à l’âge de Weibull, vie sûre), les tests de détection des fonctions cachées avec FFI = 2·U·MTBF et l’action par défaut. Le graphique P–F montre si un intervalle d’inspection attrape le défaut à temps ; le graphique d’essais montre comment un secours jamais testé glisse vers l’indisponibilité. Les essais réglementaires sont conservés quelle que soit l’économie. Reprend les classes de criticité sur « Utiliser » et écrit une liste de tâches par équipement dans le registre partagé.","es":"Sigue la lógica de decisión RCM de SAE JA1011/JA1012 (Moubray, RCM II): primero las consecuencias (ocultas, seguridad/medio ambiente, operativas, no operativas), luego tareas según condición con intervalo (P–F − respuesta)/2, restauración o sustitución programada para el desgaste (sustitución por edad de Weibull, vida segura), pruebas de búsqueda de fallos para funciones ocultas con FFI = 2·U·MTBF y la acción por defecto. El gráfico P–F muestra si un intervalo de inspección detecta el defecto a tiempo; el gráfico de pruebas muestra cómo una reserva nunca probada se desliza hacia la indisponibilidad. Las pruebas normativas se mantienen sea cual sea la economía. Toma las clases de criticidad al pulsar Usar y escribe una lista de tareas por equipo en el registro compartido.","pl":"Stosuje logikę decyzyjną RCM wg SAE JA1011/JA1012 (Moubray, RCM II): najpierw skutki (ukryte, bezpieczeństwo/środowisko, eksploatacyjne, nieeksploatacyjne), potem zadania według stanu z interwałem (P–F − czas reakcji)/2, planowa regeneracja lub wymiana przy zużyciu (wymiana według wieku Weibulla, bezpieczny resurs), testy wykrywania uszkodzeń funkcji ukrytych z FFI = 2·U·MTBF i działanie domyślne. Wykres P–F pokazuje, czy interwał inspekcji wykrywa uszkodzenie na czas; wykres testów pokazuje, jak nigdy niesprawdzana rezerwa osuwa się w niegotowość. Badania ustawowe pozostają niezależnie od ekonomii. Pobiera klasy krytyczności po naciśnięciu Użyj i zapisuje listę zadań dla każdego urządzenia we wspólnym rejestrze."},

  "limitations": {"en":"A planning aid, not a substitute for manufacturer instructions and national regulations. Reliability numbers (P–F intervals, MTBF, Weibull shape) and costs in the presets and the class library are ranges from public guides or learning assumptions, never manufacturer or field data: replace them with your own records. Exponential failures are assumed for hidden functions; FFI = 2·U·MTBF is the small-U approximation (the exact value is shown beside it). One failure mode at a time; common-cause and multiple-failure probabilities are not modelled. Statutory tasks are an EU baseline; national rules may be stricter.","uk":"Допоміжний інструмент планування, не замінює інструкцій виробника і національних норм. Показники надійності (P–F, MTBF, параметр Вейбулла) і витрати в пресетах та бібліотеці класів — діапазони з відкритих посібників або навчальні припущення, а не дані виробника чи експлуатації: замініть їх власними даними. Для прихованих функцій прийнято експоненційний розподіл відмов; FFI = 2·U·MTBF — наближення для малого U (точне значення показано поруч). Один вид відмови за раз; спільні причини і кратні відмови не моделюються. Нормативні завдання — базовий рівень ЄС; національні норми можуть бути суворішими.","de":"Eine Planungshilfe, kein Ersatz für Herstellervorgaben und nationale Vorschriften. Zuverlässigkeitswerte (P–F, MTBF, Weibull-Form) und Kosten in Beispielen und Klassenbibliothek sind Bandbreiten aus öffentlichen Leitfäden oder Lernannahmen, nie Hersteller- oder Felddaten: ersetzen Sie sie durch eigene Aufzeichnungen. Für verdeckte Funktionen werden exponentielle Ausfälle angenommen; FFI = 2·U·MTBF ist die Näherung für kleines U (der exakte Wert steht daneben). Eine Ausfallart je Rechnung; gemeinsame Ursachen und Mehrfachausfälle werden nicht modelliert. Gesetzliche Maßnahmen sind ein EU-Mindeststand; nationale Vorschriften können strenger sein.","nl":"Een planningshulpmiddel, geen vervanging voor fabrieksvoorschriften en nationale regelgeving. Betrouwbaarheidswaarden (P–F, MTBF, Weibull-vorm) en kosten in de voorbeelden en de klassenbibliotheek zijn bandbreedtes uit openbare gidsen of leeraannames, nooit fabrikant- of praktijkdata: vervang ze door uw eigen gegevens. Voor verborgen functies worden exponentiële storingen aangenomen; FFI = 2·U·MTBF is de benadering voor kleine U (de exacte waarde staat ernaast). Eén faalwijze tegelijk; gemeenschappelijke oorzaken en meervoudige storingen worden niet gemodelleerd. Wettelijke taken zijn een EU-basisniveau; nationale regels kunnen strenger zijn.","fr":"Une aide à la planification, qui ne remplace ni les instructions du fabricant ni la réglementation nationale. Les valeurs de fiabilité (P–F, MTBF, forme de Weibull) et les coûts des exemples et de la bibliothèque sont des plages issues de guides publics ou des hypothèses pédagogiques, jamais des données de fabricant ou de terrain : remplacez-les par vos propres relevés. Les défaillances des fonctions cachées sont supposées exponentielles ; FFI = 2·U·MTBF est l’approximation pour U petit (la valeur exacte est affichée à côté). Un mode de défaillance à la fois ; causes communes et défaillances multiples non modélisées. Les tâches réglementaires sont un socle UE ; les règles nationales peuvent être plus strictes.","es":"Una ayuda a la planificación; no sustituye las instrucciones del fabricante ni la normativa nacional. Los valores de fiabilidad (P–F, MTBF, forma de Weibull) y los costes de los ejemplos y de la biblioteca son rangos de guías públicas o supuestos didácticos, nunca datos de fabricante ni de campo: sustitúyalos por sus propios registros. Para funciones ocultas se suponen fallos exponenciales; FFI = 2·U·MTBF es la aproximación para U pequeño (el valor exacto se muestra al lado). Un modo de fallo cada vez; no se modelan causas comunes ni fallos múltiples. Las tareas normativas son un mínimo de la UE; las normas nacionales pueden ser más estrictas.","pl":"Narzędzie wspomagające planowanie, nie zastępuje instrukcji producenta ani przepisów krajowych. Wskaźniki niezawodności (P–F, MTBF, kształt Weibulla) i koszty w przykładach i bibliotece klas to zakresy z publicznych poradników lub założenia szkoleniowe, nigdy dane producenta ani eksploatacyjne: zastąp je własnymi danymi. Dla funkcji ukrytych przyjęto wykładniczy rozkład uszkodzeń; FFI = 2·U·MTBF to przybliżenie dla małego U (wartość dokładna obok). Jeden rodzaj uszkodzenia naraz; przyczyny wspólne i uszkodzenia wielokrotne nie są modelowane. Zadania ustawowe to minimum UE; przepisy krajowe mogą być surowsze."},

  "validation": {"basis":{"en":"Benchmarked in the browser against an independent standard-library Python reference written from the published method (SAE JA1011/JA1012 and Moubray RCM II decision logic, FFI = 2·U·MTBF with Newton-inverted exact unavailability, numerically phase-averaged catch probability, Weibull age replacement after Barlow–Proschan): the seven presets, two variants and a 136-case sweep through every branch of the decision diagram; driver bench-src/run_mepstrategy.mjs. Engine unit tests in _mep/strat/test.mjs.","uk":"Перевірено в браузері порівнянням із незалежною еталонною реалізацією на Python (лише стандартна бібліотека), написаною за опублікованим методом: логіка рішень SAE JA1011/JA1012 і Moubray RCM II, FFI = 2·U·MTBF з точною неготовністю (метод Ньютона), чисельно усереднена ймовірність виявлення, заміна за віком Вейбулла (Barlow–Proschan): сім пресетів, два варіанти і 136 випадків, що проходять усі гілки діаграми; драйвер bench-src/run_mepstrategy.mjs.","de":"Im Browser gegen eine unabhängige Python-Referenz (nur Standardbibliothek) nach der veröffentlichten Methode geprüft: SAE JA1011/JA1012- und Moubray-RCM-II-Entscheidungslogik, FFI = 2·U·MTBF mit exakter Nichtverfügbarkeit (Newton), numerisch über die Phase gemittelte Erkennungschance, Weibull-Altersersatz nach Barlow–Proschan: die sieben Beispiele, zwei Varianten und 136 Fälle durch alle Zweige des Diagramms; Treiber bench-src/run_mepstrategy.mjs.","nl":"In de browser getoetst aan een onafhankelijke Python-referentie (alleen standaardbibliotheek) volgens de gepubliceerde methode: SAE JA1011/JA1012- en Moubray-RCM-II-beslislogica, FFI = 2·U·MTBF met exacte onbeschikbaarheid (Newton), numeriek over de fase gemiddelde vangkans, Weibull-leeftijdsvervanging volgens Barlow–Proschan: de zeven voorbeelden, twee varianten en 136 gevallen door alle takken van het schema; driver bench-src/run_mepstrategy.mjs.","fr":"Validé dans le navigateur contre une référence Python indépendante (bibliothèque standard seule) écrite d’après la méthode publiée : logique RCM SAE JA1011/JA1012 et Moubray RCM II, FFI = 2·U·MTBF avec indisponibilité exacte (Newton), probabilité de détection moyennée numériquement sur la phase, remplacement à l’âge de Weibull selon Barlow–Proschan : les sept exemples, deux variantes et 136 cas couvrant toutes les branches du logigramme ; pilote bench-src/run_mepstrategy.mjs.","es":"Validado en el navegador frente a una referencia independiente en Python (solo biblioteca estándar) escrita según el método publicado: lógica RCM de SAE JA1011/JA1012 y Moubray RCM II, FFI = 2·U·MTBF con indisponibilidad exacta (Newton), probabilidad de detección promediada numéricamente sobre la fase, sustitución por edad de Weibull según Barlow–Proschan: los siete ejemplos, dos variantes y 136 casos por todas las ramas del diagrama; controlador bench-src/run_mepstrategy.mjs.","pl":"Sprawdzone w przeglądarce względem niezależnej implementacji w Pythonie (tylko biblioteka standardowa) napisanej według opublikowanej metody: logika decyzyjna SAE JA1011/JA1012 i Moubray RCM II, FFI = 2·U·MTBF z dokładną niegotowością (metoda Newtona), numerycznie uśredniona po fazie szansa wykrycia, wymiana według wieku Weibulla wg Barlowa–Proschana: siedem przykładów, dwa warianty i 136 przypadków przez wszystkie gałęzie diagramu; sterownik bench-src/run_mepstrategy.mjs."},"independent_validation":false,"benchmarks":[{"id":"mepstrategy-rcm-python-ref","reference":"bench-src/ref/gen_mepstrategy.py — independent standard-library Python implementation of the published RCM method, not ported from the tool code","citations":["SAE JA1011 (2009) Evaluation Criteria for RCM Processes","SAE JA1012 (2011) A Guide to the RCM Standard","Moubray J. (1997) Reliability-centred Maintenance, 2nd ed.","Barlow R.E., Proschan F. (1965) Mathematical Theory of Reliability","NASA (2008) RCM Guide for Facilities and Collateral Equipment"],"cases": 150, "passed": 150,"tolerance":"decision, compulsory flag and practical interval exact; FFI rel 1e-9; exact FFI rel 1e-6; catch probability abs 1e-3; unavailability rel 1e-9; annual costs rel 2e-3; optimal replacement age rel 2e-2","run_at": "2026-11-07T09:55:21Z","artifact":"benchmarks/mepstrategy.json"}]},

      'Логіка рішень RCM за SAE JA1011/JA1012 і Moubray (RCM II, 1997); посібник NASA RCM для будівель (2008). Інтервал за станом = (P–F × частка методу − реагування) / 2, округлено вниз до практичного; імовірність виявлення з n вимірами в корисному вікні та ймовірністю d на вимір, усереднена за фазою. Інтервал тесту FFI = 2·U·MTBF; точна середня неготовність Ū(T) = 1 − (M/T)(1 − e^(−T/M)). Заміна за віком: розподіл Вейбулла, витрати C(T) = [Cp·R(T) + Cf·F(T)] / ∫R, мінімізовано (Barlow–Proschan); для зносу з наслідками для безпеки — безпечний ресурс, де F(T) = U. Допоміжний інструмент планування, не замінює інструкцій виробника і національних норм.',

  var LEARN = {
    intro: { title: T('What this tool does', 'Що робить цей інструмент', 'Was dieses Werkzeug tut', 'Wat deze tool doet', 'Ce que fait cet outil', 'Qué hace esta herramienta', 'Co robi to narzędzie'),
      body: T('Pick an asset and one of its failure modes (or load a preset). The RCM decision diagram asks the standard questions in order and lights the path: is the failure hidden, does it hurt people or the environment, does it hurt operations; then is a condition task, a scheduled replacement or a failure-finding test feasible and worth doing. The answer is a task with an interval and a reason. Move the inspection interval and the response time and watch the P–F chart tell you whether the defect is caught in time.',
        'Оберіть актив і один із його видів відмови (або завантажте пресет). Діаграма RCM ставить стандартні запитання по черзі й підсвічує шлях: чи прихована відмова, чи шкодить людям або довкіллю, чи шкодить експлуатації; потім — чи здійсненні й доцільні завдання за станом, планова заміна або тест виявлення відмови. Відповідь — завдання з інтервалом і обґрунтуванням. Змінюйте інтервал огляду та час реагування й дивіться на діаграмі P–F, чи встигаєте виявити дефект.',
        'Wählen Sie eine Anlage und eine ihrer Ausfallarten (oder laden Sie ein Beispiel). Das RCM-Diagramm stellt die Standardfragen der Reihe nach und hebt den Pfad hervor: ist der Ausfall verdeckt, schadet er Menschen oder Umwelt, schadet er dem Betrieb; dann ist eine Zustandsmaßnahme, ein planmäßiger Austausch oder eine Funktionsprüfung machbar und lohnend. Die Antwort ist eine Maßnahme mit Intervall und Begründung. Verschieben Sie Prüfintervall und Reaktionszeit und sehen Sie im P–F-Diagramm, ob der Schaden rechtzeitig erkannt wird.',
        'Kies een installatie en een van haar faalwijzen (of laad een voorbeeld). Het RCM-schema stelt de standaardvragen op volgorde en verlicht het pad: is het falen verborgen, raakt het mensen of milieu, raakt het de bedrijfsvoering; dan is een toestandstaak, een geplande vervanging of een faalzoektest haalbaar en zinvol. Het antwoord is een taak met interval en motivering. Verschuif het inspectie-interval en de reactietijd en zie in de P–F-grafiek of het defect op tijd wordt gevonden.',
        'Choisissez un équipement et un de ses modes de défaillance (ou chargez un exemple). Le logigramme RCM pose les questions standard dans l’ordre et éclaire le chemin : la panne est-elle cachée, blesse-t-elle ou nuit-elle à l’environnement, nuit-elle à l’exploitation ; puis une tâche conditionnelle, un remplacement programmé ou un test de détection est-il faisable et rentable. La réponse est une tâche avec intervalle et justification. Déplacez l’intervalle d’inspection et le délai de réaction et regardez sur le graphique P–F si le défaut est attrapé à temps.',
        'Elija un equipo y uno de sus modos de fallo (o cargue un ejemplo). El diagrama RCM hace las preguntas estándar en orden e ilumina el camino: ¿el fallo es oculto?, ¿daña a personas o al medio ambiente?, ¿daña la operación?; luego, ¿es factible y rentable una tarea según condición, una sustitución programada o una prueba de búsqueda de fallos? La respuesta es una tarea con intervalo y justificación. Mueva el intervalo de inspección y el tiempo de respuesta y vea en el gráfico P–F si el defecto se detecta a tiempo.',
        'Wybierz urządzenie i jeden z jego rodzajów uszkodzeń (albo wczytaj przykład). Diagram RCM zadaje standardowe pytania po kolei i podświetla ścieżkę: czy uszkodzenie jest ukryte, czy szkodzi ludziom lub środowisku, czy szkodzi eksploatacji; potem czy zadanie według stanu, planowa wymiana lub test wykrywania uszkodzeń są wykonalne i opłacalne. Odpowiedzią jest zadanie z interwałem i uzasadnieniem. Zmieniaj interwał inspekcji i czas reakcji i patrz na wykresie P–F, czy uszkodzenie zostaje wykryte na czas.') },
    rcm: { title: T('RCM decision logic', 'Логіка рішень RCM', 'RCM-Entscheidungslogik', 'RCM-beslislogica', 'Logique de décision RCM', 'Lógica de decisión RCM', 'Logika decyzyjna RCM'),
      body: T('Reliability-centred maintenance (SAE JA1011) decides per failure mode, not per machine. It looks at consequences first, then tries the tasks in a fixed order: on-condition, scheduled restoration or discard, failure finding. The first task that is technically feasible AND worth doing wins. If none is, the default action depends on the consequence: redesign for safety, run to failure otherwise.',
        'ТО, орієнтоване на надійність (SAE JA1011), вирішує для кожного виду відмови, а не для машини загалом. Спершу дивиться на наслідки, потім пробує завдання в сталому порядку: за станом, планове відновлення або заміна, виявлення відмови. Перемагає перше завдання, яке технічно здійсненне І доцільне. Якщо такого немає, дія за замовчуванням залежить від наслідків: зміна проєкту для безпеки, інакше — до відмови.',
        'Zuverlässigkeitsorientierte Instandhaltung (SAE JA1011) entscheidet je Ausfallart, nicht je Maschine. Sie betrachtet zuerst die Folgen und probiert dann die Maßnahmen in fester Reihenfolge: zustandsorientiert, planmäßige Instandsetzung oder Austausch, Funktionsprüfung. Die erste technisch machbare UND lohnende Maßnahme gewinnt. Gibt es keine, hängt die Standardmaßnahme von der Folge ab: Änderung bei Sicherheit, sonst Betrieb bis Ausfall.',
        'Betrouwbaarheidsgericht onderhoud (SAE JA1011) beslist per faalwijze, niet per machine. Het kijkt eerst naar de gevolgen en probeert dan de taken in vaste volgorde: toestandsafhankelijk, gepland herstel of vervanging, faalzoeken. De eerste taak die technisch haalbaar EN zinvol is, wint. Is er geen, dan hangt de standaardactie af van het gevolg: herontwerp bij veiligheid, anders draaien tot falen.',
        'La maintenance basée sur la fiabilité (SAE JA1011) décide par mode de défaillance, pas par machine. Elle regarde d’abord les conséquences, puis essaie les tâches dans un ordre fixe : conditionnelle, remise en état ou remplacement programmé, détection. La première tâche techniquement faisable ET rentable l’emporte. Sinon, l’action par défaut dépend de la conséquence : reconception pour la sécurité, sinon fonctionnement jusqu’à défaillance.',
        'El mantenimiento centrado en la fiabilidad (SAE JA1011) decide por modo de fallo, no por máquina. Mira primero las consecuencias y luego prueba las tareas en orden fijo: según condición, restauración o sustitución programada, búsqueda de fallos. Gana la primera tarea técnicamente factible Y rentable. Si no hay ninguna, la acción por defecto depende de la consecuencia: rediseño para seguridad; si no, operar hasta el fallo.',
        'Utrzymanie ukierunkowane na niezawodność (SAE JA1011) decyduje dla każdego rodzaju uszkodzenia, nie dla całej maszyny. Najpierw patrzy na skutki, potem próbuje zadań w stałej kolejności: według stanu, planowa regeneracja lub wymiana, wykrywanie uszkodzeń. Wygrywa pierwsze zadanie technicznie wykonalne I opłacalne. Jeśli żadnego nie ma, działanie domyślne zależy od skutku: zmiana projektu przy bezpieczeństwie, w innym razie eksploatacja do awarii.') },
    pf: { title: T('P–F interval', 'Інтервал P–F', 'P–F-Intervall', 'P–F-interval', 'Intervalle P–F', 'Intervalo P–F', 'Interwał P–F'),
      body: T('P is the moment a defect becomes detectable, F the moment the function is lost. A technique sees only part of that window (it detects later than P). Inspect at least twice inside the usable window minus the response time: interval = (P–F usable − response) / 2. Longer intervals leave a gap in which a defect starts and fails between two readings.',
        'P — момент, коли дефект стає помітним, F — момент втрати функції. Метод бачить лише частину цього вікна (він виявляє пізніше за P). Оглядайте щонайменше двічі в межах корисного вікна мінус час реагування: інтервал = (корисний P–F − реагування) / 2. Довші інтервали залишають проміжок, у якому дефект виникає й доходить до відмови між двома вимірами.',
        'P ist der Zeitpunkt, ab dem ein Schaden erkennbar ist, F der Funktionsverlust. Ein Verfahren sieht nur einen Teil dieses Fensters (es erkennt später als P). Prüfen Sie mindestens zweimal im nutzbaren Fenster abzüglich der Reaktionszeit: Intervall = (nutzbares P–F − Reaktion) / 2. Längere Intervalle lassen eine Lücke, in der ein Schaden zwischen zwei Messungen entsteht und ausfällt.',
        'P is het moment waarop een defect zichtbaar wordt, F het moment van functieverlies. Een techniek ziet maar een deel van dat venster (ze detecteert later dan P). Inspecteer minstens twee keer binnen het bruikbare venster min de reactietijd: interval = (bruikbare P–F − reactie) / 2. Langere intervallen laten een gat waarin een defect tussen twee metingen ontstaat en faalt.',
        'P est le moment où le défaut devient détectable, F celui où la fonction est perdue. Une technique ne voit qu’une partie de cette fenêtre (elle détecte après P). Inspectez au moins deux fois dans la fenêtre utile moins le délai de réaction : intervalle = (P–F utile − réaction) / 2. Des intervalles plus longs laissent un trou où un défaut naît et défaille entre deux mesures.',
        'P es el momento en que un defecto se vuelve detectable y F el de la pérdida de función. Una técnica solo ve parte de esa ventana (detecta después de P). Inspeccione al menos dos veces dentro de la ventana útil menos el tiempo de respuesta: intervalo = (P–F útil − respuesta) / 2. Intervalos más largos dejan un hueco en el que un defecto nace y falla entre dos lecturas.',
        'P to chwila, od której uszkodzenie jest wykrywalne, F — utrata funkcji. Metoda widzi tylko część tego okna (wykrywa później niż P). Sprawdzaj co najmniej dwa razy w użytecznym oknie pomniejszonym o czas reakcji: interwał = (użyteczny P–F − reakcja) / 2. Dłuższe interwały zostawiają lukę, w której uszkodzenie powstaje i doprowadza do awarii między dwoma pomiarami.') },
    hidden: { title: T('Hidden functions and FFI', 'Приховані функції та FFI', 'Verdeckte Funktionen und FFI', 'Verborgen functies en FFI', 'Fonctions cachées et FFI', 'Funciones ocultas y FFI', 'Funkcje ukryte i FFI'),
      body: T('A standby pump, a sprinkler pump, a generator or a UPS battery does nothing until it is needed, so its failure is invisible. Only a test finds it. For random failures the mean unavailability between tests is about T / (2·MTBF), so the test interval for a tolerable unavailability U is FFI = 2·U·MTBF (Moubray). U comes from the criticality class (A 0.5 %, B 2 %, C 5 %, editable).',
        'Резервний насос, спринклерний насос, генератор або батарея ДБЖ нічого не роблять, доки не знадобляться, тож їхня відмова невидима. Знайти її може лише тест. Для випадкових відмов середня неготовність між тестами приблизно T / (2·MTBF), тож інтервал тесту для допустимої неготовності U дорівнює FFI = 2·U·MTBF (Moubray). U береться з класу критичності (A 0,5 %, B 2 %, C 5 %, можна змінити).',
        'Eine Reservepumpe, eine Sprinklerpumpe, ein Generator oder eine USV-Batterie tun nichts, bis sie gebraucht werden — ihr Ausfall ist unsichtbar. Nur eine Prüfung findet ihn. Bei Zufallsausfällen ist die mittlere Nichtverfügbarkeit zwischen Prüfungen etwa T / (2·MTBF); das Prüfintervall für ein tragbares U ist FFI = 2·U·MTBF (Moubray). U folgt aus der Kritikalitätsklasse (A 0,5 %, B 2 %, C 5 %, änderbar).',
        'Een reservepomp, sprinklerpomp, generator of UPS-batterij doet niets tot hij nodig is, dus zijn falen is onzichtbaar. Alleen een test vindt het. Bij willekeurige storingen is de gemiddelde onbeschikbaarheid tussen tests ongeveer T / (2·MTBF), dus het testinterval voor een aanvaardbare U is FFI = 2·U·MTBF (Moubray). U volgt uit de kritikaliteitsklasse (A 0,5 %, B 2 %, C 5 %, aanpasbaar).',
        'Une pompe de secours, une pompe sprinkler, un groupe électrogène ou une batterie d’onduleur ne font rien tant qu’on n’en a pas besoin : leur panne est invisible. Seul un essai la révèle. Pour des pannes aléatoires, l’indisponibilité moyenne entre essais vaut environ T / (2·MTBF), d’où l’intervalle FFI = 2·U·MTBF pour une indisponibilité tolérable U (Moubray). U vient de la classe de criticité (A 0,5 %, B 2 %, C 5 %, modifiable).',
        'Una bomba de reserva, una bomba de rociadores, un grupo electrógeno o una batería de SAI no hacen nada hasta que se necesitan, así que su fallo es invisible. Solo una prueba lo encuentra. Con fallos aleatorios la indisponibilidad media entre pruebas es aproximadamente T / (2·MTBF), así que el intervalo para una indisponibilidad tolerable U es FFI = 2·U·MTBF (Moubray). U sale de la clase de criticidad (A 0,5 %, B 2 %, C 5 %, editable).',
        'Pompa rezerwowa, pompa tryskaczowa, agregat lub bateria UPS nic nie robią, dopóki nie są potrzebne, więc ich uszkodzenie jest niewidoczne. Wykrywa je tylko test. Przy uszkodzeniach losowych średnia niegotowość między testami wynosi około T / (2·MTBF), więc interwał testów dla dopuszczalnej niegotowości U to FFI = 2·U·MTBF (Moubray). U wynika z klasy krytyczności (A 0,5 %, B 2 %, C 5 %, do zmiany).') },
    rtf: { title: T('Run to failure is a decision', 'Експлуатація до відмови — це рішення', 'Betrieb bis Ausfall ist eine Entscheidung', 'Draaien tot falen is een beslissing', 'Le fonctionnement jusqu’à défaillance est une décision', 'Operar hasta el fallo es una decisión', 'Eksploatacja do awarii to decyzja'),
      body: T('When a failure is evident, harmless to people and cheap, any preventive task costs more than the failures it avoids. RCM then chooses run-to-failure on purpose, with a spare or a call-out agreement ready. That is different from neglect: the decision, its reason and its review date are written down.',
        'Коли відмова помітна, безпечна для людей і дешева, будь-яке профілактичне завдання коштує більше, ніж відмови, яким воно запобігає. Тоді RCM свідомо обирає експлуатацію до відмови із запчастиною чи договором виклику напоготові. Це не недбалість: рішення, його причина і дата перегляду записані.',
        'Ist ein Ausfall erkennbar, für Menschen harmlos und billig, kostet jede vorbeugende Maßnahme mehr als die vermiedenen Ausfälle. RCM wählt dann bewusst Betrieb bis Ausfall, mit Ersatzteil oder Rufbereitschaft. Das ist keine Vernachlässigung: Entscheidung, Grund und Überprüfungsdatum sind dokumentiert.',
        'Als een storing merkbaar, ongevaarlijk voor mensen en goedkoop is, kost elke preventieve taak meer dan de storingen die ze vermijdt. RCM kiest dan bewust voor draaien tot falen, met een reserveonderdeel of afroepcontract paraat. Dat is geen verwaarlozing: de beslissing, de reden en de herzieningsdatum staan op papier.',
        'Quand une panne est visible, sans danger pour les personnes et peu coûteuse, toute tâche préventive coûte plus que les pannes évitées. La RCM choisit alors délibérément le fonctionnement jusqu’à défaillance, avec une pièce ou un contrat d’intervention prêt. Ce n’est pas de la négligence : la décision, sa raison et sa date de révision sont écrites.',
        'Cuando un fallo es evidente, inocuo para las personas y barato, cualquier tarea preventiva cuesta más que los fallos que evita. RCM elige entonces a propósito operar hasta el fallo, con un repuesto o un contrato de asistencia preparado. No es descuido: la decisión, su motivo y su fecha de revisión quedan escritos.',
        'Gdy uszkodzenie jest widoczne, nieszkodliwe dla ludzi i tanie, każde zadanie zapobiegawcze kosztuje więcej niż awarie, którym zapobiega. RCM świadomie wybiera wtedy eksploatację do awarii, z częścią zamienną lub umową serwisową w gotowości. To nie zaniedbanie: decyzja, jej powód i data przeglądu są zapisane.') },
    redesign: { title: T('When redesign is compulsory', 'Коли зміна проєкту обов’язкова', 'Wann eine Änderung zwingend ist', 'Wanneer herontwerp verplicht is', 'Quand la reconception est obligatoire', 'Cuándo es obligatorio el rediseño', 'Kiedy zmiana projektu jest obowiązkowa'),
      body: T('If a failure mode can hurt people and no maintenance task brings the risk down to a tolerable level, the plant itself has to change: IR windows or wireless sensors so a technique can reach the joint, a second protective device, an interlock. The tool flags it; the engineering is yours.',
        'Якщо вид відмови може травмувати людей і жодне завдання ТО не знижує ризик до прийнятного рівня, змінювати треба саме обладнання: ІЧ-вікна чи бездротові датчики, щоб метод дістав до контакту, другий захисний пристрій, блокування. Інструмент це позначає; інженерне рішення — за вами.',
        'Kann eine Ausfallart Menschen verletzen und senkt keine Maßnahme das Risiko auf ein tragbares Maß, muss die Anlage selbst geändert werden: IR-Fenster oder Funksensoren, damit ein Verfahren die Verbindung erreicht, eine zweite Schutzeinrichtung, eine Verriegelung. Das Werkzeug markiert es; die Technik liegt bei Ihnen.',
        'Als een faalwijze mensen kan verwonden en geen taak het risico tot een aanvaardbaar niveau brengt, moet de installatie zelf veranderen: IR-vensters of draadloze sensoren zodat een techniek de verbinding bereikt, een tweede beveiliging, een vergrendeling. De tool markeert het; de techniek is aan u.',
        'Si un mode peut blesser et qu’aucune tâche ne ramène le risque à un niveau tolérable, c’est l’installation qui doit changer : hublots IR ou capteurs sans fil pour que la technique atteigne la connexion, un second dispositif de protection, un verrouillage. L’outil le signale ; l’ingénierie vous revient.',
        'Si un modo de fallo puede herir a personas y ninguna tarea reduce el riesgo a un nivel tolerable, hay que cambiar la instalación: ventanas IR o sensores inalámbricos para que una técnica llegue a la unión, un segundo dispositivo de protección, un enclavamiento. La herramienta lo señala; la ingeniería es suya.',
        'Jeśli rodzaj uszkodzenia może zranić ludzi, a żadne zadanie nie obniża ryzyka do akceptowalnego poziomu, trzeba zmienić samą instalację: okna IR lub czujniki bezprzewodowe, by metoda sięgnęła złącza, drugie zabezpieczenie, blokadę. Narzędzie to sygnalizuje; rozwiązanie inżynierskie należy do Ciebie.') },
    statutory: { title: T('Statutory tasks', 'Нормативні завдання', 'Gesetzliche Maßnahmen', 'Wettelijke taken', 'Tâches réglementaires', 'Tareas normativas', 'Zadania ustawowe'),
      body: T('Some tests are required by law or standard whatever RCM says: F-gas leak checks (Reg. (EU) 2024/573), sprinkler pump start tests (EN 12845), emergency lighting tests (EN 50172), legionella temperature checks (HSE HSG274). They stay in the plan with their legal basis. When a statutory test is more frequent than the RCM interval and proves the same hidden function, it governs.',
        'Деякі перевірки вимагає закон або стандарт незалежно від RCM: перевірки на витоки F-газів (Регламент (ЄС) 2024/573), пробні пуски спринклерних насосів (EN 12845), перевірки аварійного освітлення (EN 50172), контроль температури щодо легіонели (HSE HSG274). Вони лишаються в плані з правовою підставою. Якщо нормативна перевірка частіша за інтервал RCM і доводить ту саму приховану функцію, вона визначальна.',
        'Manche Prüfungen verlangt Gesetz oder Norm, was auch immer RCM sagt: F-Gas-Dichtheitskontrollen (VO (EU) 2024/573), Probeläufe von Sprinklerpumpen (EN 12845), Prüfungen der Sicherheitsbeleuchtung (EN 50172), Legionellen-Temperaturkontrollen (HSE HSG274). Sie bleiben mit ihrer Rechtsgrundlage im Plan. Ist eine gesetzliche Prüfung häufiger als das RCM-Intervall und weist dieselbe verdeckte Funktion nach, ist sie maßgebend.',
        'Sommige tests zijn wettelijk of normatief verplicht, wat RCM ook zegt: F-gassen-lekcontroles (Verordening (EU) 2024/573), starttests van sprinklerpompen (EN 12845), tests van noodverlichting (EN 50172), legionella-temperatuurcontroles (HSE HSG274). Ze blijven met hun wettelijke grondslag in het plan. Is een wettelijke test frequenter dan het RCM-interval en bewijst hij dezelfde verborgen functie, dan is hij bepalend.',
        'Certains essais sont imposés par la loi ou la norme quoi que dise la RCM : contrôles d’étanchéité F-gaz (Règl. (UE) 2024/573), essais de démarrage des pompes sprinkler (EN 12845), essais de l’éclairage de sécurité (EN 50172), contrôles de température légionelles (HSE HSG274). Ils restent au plan avec leur fondement. Quand un essai réglementaire est plus fréquent que l’intervalle RCM et prouve la même fonction cachée, il prévaut.',
        'Algunas pruebas las exige la ley o la norma diga lo que diga RCM: controles de fugas de gases F (Reglamento (UE) 2024/573), pruebas de arranque de bombas de rociadores (EN 12845), pruebas del alumbrado de emergencia (EN 50172), controles de temperatura frente a legionela (HSE HSG274). Se quedan en el plan con su base legal. Si una prueba normativa es más frecuente que el intervalo RCM y demuestra la misma función oculta, prevalece.',
        'Niektóre badania wymaga prawo lub norma bez względu na RCM: kontrole szczelności F-gazów (Rozp. (UE) 2024/573), próby rozruchu pomp tryskaczowych (EN 12845), badania oświetlenia awaryjnego (EN 50172), kontrole temperatury pod kątem legionelli (HSE HSG274). Pozostają w planie z podstawą prawną. Jeśli badanie ustawowe jest częstsze niż interwał RCM i potwierdza tę samą funkcję ukrytą, jest rozstrzygające.') },
    criticality: { title: T('Criticality class', 'Клас критичності', 'Kritikalitätsklasse', 'Kritikaliteitsklasse', 'Classe de criticité', 'Clase de criticidad', 'Klasa krytyczności'),
      body: T('A, B or C from MEP Asset Criticality when the register has its results and you press Use; otherwise set it here. The class sets the default tolerable unavailability of hidden functions and the response time, and decides the default action when no task pays (class A: consider a redesign; C: run to failure). Safety never depends on the class.',
        'A, B або C з «Критичності активів», якщо в реєстрі є її результати і ви натиснули «Використати»; інакше задайте тут. Клас визначає типову допустиму неготовність прихованих функцій і час реагування, а також дію за замовчуванням, коли жодне завдання не окупається (клас A: розглянути зміну проєкту; C: до відмови). Безпека ніколи не залежить від класу.',
        'A, B oder C aus der Kritikalitätsbewertung, wenn das Register deren Ergebnisse hat und Sie Verwenden drücken; sonst hier setzen. Die Klasse bestimmt das tragbare U verdeckter Funktionen und die Reaktionszeit sowie die Standardmaßnahme, wenn sich nichts lohnt (A: Änderung prüfen; C: bis Ausfall). Sicherheit hängt nie von der Klasse ab.',
        'A, B of C uit de kritikaliteitstool als het register haar resultaten bevat en u op Gebruiken drukt; anders hier instellen. De klasse bepaalt de standaard aanvaardbare onbeschikbaarheid van verborgen functies en de reactietijd, en de standaardactie als geen taak loont (A: herontwerp overwegen; C: tot falen). Veiligheid hangt nooit van de klasse af.',
        'A, B ou C issue de la criticité des équipements quand le registre contient ses résultats et que vous cliquez sur Utiliser ; sinon réglez-la ici. La classe fixe l’indisponibilité tolérable par défaut des fonctions cachées et le délai de réaction, et l’action par défaut quand aucune tâche n’est rentable (A : envisager une reconception ; C : jusqu’à défaillance). La sécurité ne dépend jamais de la classe.',
        'A, B o C de la criticidad de equipos cuando el registro tiene sus resultados y pulsa Usar; si no, fíjela aquí. La clase fija la indisponibilidad tolerable por defecto de funciones ocultas y el tiempo de respuesta, y la acción por defecto cuando ninguna tarea compensa (A: considerar rediseño; C: hasta el fallo). La seguridad nunca depende de la clase.',
        'A, B lub C z oceny krytyczności, gdy rejestr zawiera jej wyniki i naciśniesz Użyj; w innym razie ustaw tutaj. Klasa wyznacza domyślną dopuszczalną niegotowość funkcji ukrytych i czas reakcji oraz działanie domyślne, gdy żadne zadanie się nie opłaca (A: rozważ zmianę projektu; C: do awarii). Bezpieczeństwo nigdy nie zależy od klasy.') },
    agereplace: { title: T('Scheduled replacement', 'Планова заміна', 'Planmäßiger Austausch', 'Geplande vervanging', 'Remplacement programmé', 'Sustitución programada', 'Planowa wymiana'),
      body: T('Replacing by age only helps when the failure rate rises with age (wear-out) and a planned replacement is much cheaper than a failure. The tool minimises the long-run cost per year over the replacement age with a Weibull life. Random failures never benefit: replacing a part that is as good as new buys nothing.',
        'Заміна за віком допомагає лише тоді, коли інтенсивність відмов зростає з віком (знос), а планова заміна значно дешевша за відмову. Інструмент мінімізує довгострокові витрати на рік за віком заміни з розподілом Вейбулла. Випадковим відмовам це не допомагає: заміна деталі, яка «як нова», нічого не дає.',
        'Austausch nach Alter hilft nur, wenn die Ausfallrate mit dem Alter steigt (Verschleiß) und ein geplanter Austausch viel billiger ist als ein Ausfall. Das Werkzeug minimiert die Kosten pro Jahr über dem Austauschalter mit einer Weibull-Lebensdauer. Zufallsausfällen hilft das nie: ein Teil zu tauschen, das so gut wie neu ist, bringt nichts.',
        'Vervangen op leeftijd helpt alleen als de faalkans met de leeftijd stijgt (slijtage) en een geplande vervanging veel goedkoper is dan een storing. De tool minimaliseert de kosten per jaar over de vervangingsleeftijd met een Weibull-levensduur. Willekeurige storingen hebben er nooit baat bij: een onderdeel vervangen dat zo goed als nieuw is, levert niets op.',
        'Remplacer à l’âge n’aide que si le taux de panne croît avec l’âge (usure) et si un remplacement planifié coûte bien moins qu’une panne. L’outil minimise le coût annuel selon l’âge de remplacement avec une loi de Weibull. Les pannes aléatoires n’en profitent jamais : remplacer une pièce aussi bonne que neuve n’apporte rien.',
        'Sustituir por edad solo ayuda si la tasa de fallos crece con la edad (desgaste) y una sustitución planificada es mucho más barata que un fallo. La herramienta minimiza el coste anual según la edad de sustitución con una vida de Weibull. Los fallos aleatorios nunca se benefician: cambiar una pieza tan buena como nueva no aporta nada.',
        'Wymiana według wieku pomaga tylko wtedy, gdy intensywność uszkodzeń rośnie z wiekiem (zużycie), a planowa wymiana jest dużo tańsza niż awaria. Narzędzie minimalizuje długookresowy koszt roczny w funkcji wieku wymiany przy rozkładzie Weibulla. Uszkodzeniom losowym to nie pomaga: wymiana części, która jest jak nowa, nic nie daje.') }

  function num0() { for (var i = 0; i < arguments.length; i++) if (typeof arguments[i] === 'number' && isFinite(arguments[i])) return arguments[i]; return null; }
  function applyPreset(t, p) {

    return rows;
  }
  function exportCsv() {
    var rows = taskRows();
    var text = C && C.csv ? C.csv(rows, M.CSV_COLS) : M.CSV_COLS.join(',') + '\r\n';
    download('mepstrategy-tasks-' + lang() + '.csv', text, 'text/csv');
  }
  function saveToRegister() {
    if (!bar || !C) return;
    var doc = bar.getDoc();
    if (!doc.assets || !doc.assets.length) { flash = S.emptyReg; ui.run(); return; }
    siteCache = null;
    var pl = M.plan(doc, critResults, { lib: C });
    var results = {};
    Object.keys(pl.results).forEach(function (id) { results[id] = Object.assign({}, pl.results[id], { tasks: pl.tasks.filter(function (t) { return t.asset_id === id; }) }); });
    var next = C.register.withModule(doc, 'mepstrategy', { state: clone(state), results: results, summary: pl.summary, tasks: pl.tasks, engine: 'MEPStrat ' + M.VERSION });
    bar.setDoc(next);
    var o = {}; LANGS.forEach(function (x) { o[x] = tr(S.saved, x) + pl.tasks.length + ' ' + tr(S.tasksWord, x); });
    flash = o; siteCache = null; ui.sync(); ui.run();
  }
  function loadDemo() {
    if (!bar || !C || !C.presetSite) return;
    var site = C.presetSite('office_12'); if (!site) return;
    bar.setDoc(site); siteCache = null; flash = null; ui.sync(); ui.run();
  }
  function onUse(k, mod) {
    if (k !== 'mepcriticality') { flash = S.otherModule; ui.run(); return; }
    critResults = (mod && mod.results) || {}; critDate = mod && mod.updatedAt ? String(mod.updatedAt).slice(0, 10) : '';
    if (critResults[state.asset_id] && critResults[state.asset_id]['class']) {
      state.cls = critResults[state.asset_id]['class'];
      state.response_days = M.RESPONSE_DAYS[state.cls]; state.u_tol_pct = M.U_TOL[state.cls] * 100;
    }
    siteCache = null; flash = null; ui.sync(); ui.run();
  }
  function onRegChange() { siteCache = null; if (ui) { ui.sync(); ui.run(); } }

  /* ---------------------------------------------------------- interface */
  function boot() {
    M = window.MEPStrat || null; C = window.MEPCore || null;
    if (M) { M.PRESETS.forEach(function (p) { PRESET_BY_ID[p.id] = p; }); applyPreset(state, PRESET_BY_ID.chiller_pf); }
    if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1' && M) buildInterface();
    else degrade();
    installData();
  }
  function degrade() {
    document.title = 'diagram-ui.js v1 and mep-strategy.js are required';
    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1'); h.textContent = 'MEP Maintenance Strategy (RCM)';
    var p = document.createElement('p'); p.textContent = 'The interactive interface could not load. The calculation record and the limitations are still available from the bar at the bottom of the page.';
    host.appendChild(h); host.appendChild(p);
    if (M) last = solve(state);
  }
  function rangeDays(v) { return DiagramUI.fmt(v, { precision: 0 }) + ' ' + tr(S.days); }
  function isHiddenCase(ctx) { var s = ctx && ctx.state || state; return !s.evident; }
  function buildInterface() {
    ui = DiagramUI.app({
      id: 'mepstrategy', mount: '#app', layout: 'calculator', compute: 'live',
      state: state, subtitle: S.subtitle,
      notices: [{ id: 'genre', tone: 'warn', sticky: true, title: S.genreTitle, text: S.genreText }],
      learn: {
        version: 1, intro: LEARN.intro,
        topics: { rcm: LEARN.rcm, pf: LEARN.pf, hidden: LEARN.hidden, rtf: LEARN.rtf, redesign: LEARN.redesign, statutory: LEARN.statutory, criticality: LEARN.criticality, agereplace: LEARN.agereplace },
        tour: [
          { topic: 'criticality', focus: '[data-dgu-field="f-cls"]' },
          { topic: 'rcm', focus: '.dgu-stage' },
          { topic: 'pf', focus: '[data-dgu-field="f-insp"]' },
          { topic: 'hidden', focus: '[data-dgu-field="f-u"]' },
          { topic: 'rtf', focus: '.dgu-r-results' },
          { topic: 'statutory', focus: '.dgu-r-results' }
        ]
      },
      panels: [{
        id: 'asset', slot: 'inputs', title: S.pAsset,
        fields: [
          { id: 'f-regasset', key: 'reg_asset', type: 'select', label: S.fAsset, options: assetOptions, visible: function () { var d = regDoc(); return !!(d && d.assets && d.assets.length); } },
          { id: 'f-class', key: 'class_id', type: 'select', label: S.fClass, options: classOptions },
          { id: 'f-fm', key: 'fm_key', type: 'select', label: S.fFm, options: fmOptions },
          { id: 'f-tag', key: 'asset_id', type: 'text', label: S.fTag },
          { id: 'f-cls', key: 'cls', type: 'segmented', label: S.fCls, learn: 'criticality', options: [['A', 'A'], ['B', 'B'], ['C', 'C']] }
        ]
      }, {
        id: 'fm', slot: 'inputs', title: S.pFm,
        fields: [
          { id: 'f-evident', key: 'evident', type: 'toggle', label: S.fEvident, learn: 'hidden' },
          { id: 'f-safety', key: 'safety', type: 'toggle', label: S.fSafety, learn: 'redesign' },
          { id: 'f-pattern', key: 'pattern', type: 'select', label: S.fPattern, learn: 'agereplace',
            options: [{ value: 'wearout', label: S.patWear }, { value: 'random', label: S.patRandom }, { value: 'infant', label: S.patInfant }, { value: 'hidden', label: S.patHidden }] },
          { id: 'f-pf', key: 'pf_days', type: 'number', unit: 'd', label: S.fPf, min: 0, max: 3650, step: 1, learn: 'pf' },
          { id: 'f-mtbf', key: 'mtbf_y', type: 'number', unit: 'y', label: S.fMtbf, min: 0.05, max: 200, step: 0.1, precision: 2, required: true },
          { id: 'f-tech', key: 'tech', type: 'select', label: S.fTech, options: techOptions },
          { id: 'f-access', key: 'access', type: 'toggle', label: S.fAccess, visible: function (c) { return !!c.state.tech; } },
          { id: 'f-frac', key: 'pf_fraction', type: 'number', label: S.fFrac, min: 0.05, max: 1, step: 0.05, precision: 2, visible: function (c) { return !!c.state.tech; } },
          { id: 'f-costread', key: 'cost_read', type: 'number', unit: 'EUR', label: S.fCostRead, min: 0, max: 100000, step: 5, visible: function (c) { return !!c.state.tech; } }
        ]
      }, {
        id: 'timing', slot: 'inputs', title: S.pTiming,
        fields: [
          { id: 'f-insp', key: 'insp_days', type: 'range', editable: true, min: 1, max: 730, step: 1, format: rangeDays,
            label: function (c) { return isHiddenCase(c) ? S.fInspFF : S.fInsp; }, learn: 'pf' },
          { id: 'f-resp', key: 'response_days', type: 'range', editable: true, min: 0, max: 120, step: 1, format: rangeDays, label: S.fResp, learn: 'pf' },
          { id: 'f-phase', key: 'phase_pct', type: 'range', min: 0, max: 100, step: 1, label: S.fPhase, format: function (v) { return DiagramUI.fmt(v, { precision: 0 }) + ' %'; }, visible: function (c) { return !!c.state.evident && c.state.pf_days > 0; } },
          { id: 'f-pd', key: 'p_detect_pct', type: 'number', unit: '%', label: S.fPd, min: 10, max: 100, step: 1 },
          { id: 'f-u', key: 'u_tol_pct', type: 'number', unit: '%', label: S.fU, min: 0.01, max: 20, step: 0.1, precision: 2, learn: 'hidden' }
        ]
      }, {
        id: 'costs', slot: 'inputs', title: S.pCosts, collapsible: true, collapsed: true,
        fields: [
          { id: 'f-corr', key: 'corrective_eur', type: 'number', unit: 'EUR', label: S.fCorr, min: 0, max: 1e8, step: 50 },
          { id: 'f-plan', key: 'planned_eur', type: 'number', unit: 'EUR', label: S.fPlan, min: 0, max: 1e8, step: 50 },
          { id: 'f-down', key: 'downtime_eur_h', type: 'number', unit: 'EUR/h', label: S.fDown, min: 0, max: 1e7, step: 50 },
          { id: 'f-mttr', key: 'mttr_h', type: 'number', unit: 'h', label: S.fMttr, min: 0, max: 10000, step: 1 },
          { id: 'f-beta', key: 'beta', type: 'number', label: S.fBeta, min: 1, max: 8, step: 0.1, precision: 1, learn: 'agereplace' }
        ]
      }, {
        id: 'current', slot: 'inputs', title: S.pCurrent, collapsible: true, collapsed: true,
        fields: [
          { id: 'f-curkind', key: 'current_kind', type: 'select', label: S.fCurKind, options: [{ value: 'none', label: S.curNone }, { value: 'time', label: S.curTime }, { value: 'ff', label: S.curFF }] },
          { id: 'f-curdays', key: 'current_days', type: 'number', unit: 'd', label: S.fCurDays, min: 1, max: 3650, step: 1, visible: function (c) { return c.state.current_kind !== 'none'; } },
          { id: 'f-since', key: 'since_test_y', type: 'number', unit: 'y', label: S.fSince, min: 0, max: 50, step: 0.5, precision: 1, visible: function (c) { return !c.state.evident; } },
          { id: 'f-ffmin', key: 'ff_min_days', type: 'number', unit: 'd', label: S.fFfMin, min: 1, max: 730, step: 1, precision: 0, visible: function (c) { return !c.state.evident; } }
        ]
      }, {
        id: 'register', slot: 'inputs', title: S.pReg, collapsible: true, collapsed: false,
        render: function (boxEl, ctx) {
          if (!C || !C.ui || !C.ui.registerBar) return;
          var prev = bar ? bar.getDoc() : null;
          bar = C.ui.registerBar({ mount: boxEl, toolId: 'mepstrategy', doc: prev || undefined, lang: function () { return ctx.app.lang; },
            onUse: onUse, onChange: onRegChange });
          /* the bar's hidden file input has no name, which DiagramUI.check() counts (core request logged) */
          var fi = boxEl.querySelector('.mep-register-bar input[type=file]');

        },
        actionsAlign: 'end',

          { id: 'a-demo', label: S.aDemo, variant: 'ghost', run: loadDemo },
          { id: 'a-save', label: S.aSave, run: saveToRegister },
          { id: 'a-csv', label: S.aCsv, variant: 'ghost', run: exportCsv }
        ]
      }],
      footer: S.footer,
      on: {
        compute: function (s) { return compute(s); },
        change: function (key) {
          if (key === 'class_id' && C && C.CLASSES && C.CLASSES[state.class_id]) { applyLibFm(state, state.class_id, null, state.reg_asset ? currentAsset(state) : null); ui.sync(); }
          else if (key === 'fm_key') {
            if (String(state.fm_key).indexOf('preset:') === 0) applyPreset(state, PRESET_BY_ID[state.fm_key.slice(7)]);
            else if (C) applyLibFm(state, state.class_id, state.fm_key, state.reg_asset ? currentAsset(state) : null);
            ui.sync();
          } else if (key === 'reg_asset') {
            var a = state.reg_asset ? currentAsset(state) : null;
            if (a && C && C.CLASSES[a['class']]) { state.asset_id = a.id; applyLibFm(state, a['class'], null, a); ui.sync(); }
            else if (a) { state.asset_id = a.id; ui.sync(); }
          } else if (key === 'tech') { techParams(state); ui.sync(); }
          else if (key === 'cls') { state.response_days = M.RESPONSE_DAYS[state.cls]; state.u_tol_pct = M.U_TOL[state.cls] * 100; ui.sync(); }
          if (key !== 'insp_days' && key !== 'phase_pct') flash = null;
        }
      }
    });

    ui.examples(M.PRESETS.map(function (p) {
      return { id: p.id, label: p.label, note: p.aha, apply: function (t) { applyPreset(t, p); flash = null; } };
    }), { as: 'select' });
    ui.panel({ id: 'io', slot: 'inputs', actionsAlign: 'end', actions: [ui.resetAction()] });

    ui.stage({ key: 'rcm', caption: S.stageRcm, minHeight: 470, a11y: a11yRcm, render: drawRcm });
    ui.stage({ key: 'timing', caption: S.stageTiming, minHeight: 380, a11y: a11yTiming, render: drawTiming });
    ui.transport({ key: 'tp', frames: 120, frame: 120, fps: 30, slot: 'dock',
      label: function (i, n) { var pf = state.pf_days || 0; var t = Math.round((i / n) * pf * 1.08); return tr(sub(S.animLabel, t)); },
      on: { frame: function (i, tp) { animT = i / (tp && tp.frames || 120); if (ui.byKey.timing) ui.byKey.timing.schedule(); } } });
    ui.ready();
    localiseSpeeds();
    window.__mepstrategy = { S: S, ui: ui, state: state, solve: solve, engine: M, last: function () { return last; }, bar: function () { return bar; } };
  }

  function record() {
    if (!last) return null;
    var d = last.d;
    return {
      inputs: { asset_id: state.asset_id, class_id: state.class_id, failure_mode: state.fm_key, criticality_class: state.cls,
        evident: state.evident, safety_or_environment: state.safety, pattern: state.pattern, pf_days: state.pf_days, mtbf_y: state.mtbf_y,
        technique: state.tech || null, technique_access: state.access, pf_fraction: state.pf_fraction, cost_per_reading_eur: state.cost_read,
        response_days: state.response_days, u_tol: state.u_tol_pct / 100, p_detect: state.p_detect_pct / 100, weibull_beta: state.beta,
        corrective_eur: state.corrective_eur, planned_eur: state.planned_eur, downtime_eur_h: state.downtime_eur_h, mttr_h: state.mttr_h,
        inspection_interval_days: state.insp_days, current_practice: state.current_kind, current_interval_days: state.current_days, years_since_proof: state.since_test_y },
      outputs: { strategy: d.kind, compulsory: d.compulsory, consequence: d.consequence, interval_days: d.interval_days, interval_calc_days: d.interval_calc_days,
        decision_path: d.path.map(function (p) { return p.node + ':' + p.answer; }).join(' '),
        p_catch_planned: d.cbm.p_catch != null ? d.cbm.p_catch : null, p_catch_at_user_interval: last.catch_user != null ? last.catch_user : null,
        ffi_days: d.ff.ffi_days != null ? d.ff.ffi_days : null, ffi_exact_days: d.ff.ffi_exact_days != null ? d.ff.ffi_exact_days : null,
        unavailability_at_user_interval: last.u_user != null ? last.u_user : null, p_failed_now: d.ff.p_failed_now != null ? d.ff.p_failed_now : null,
        cost_per_year_eur: d.cost_y, rtf_cost_per_year_eur: d.rtf_cost_y, task_en: d.task.en, reasons: d.reasons.join(' ') },
      units: { pf_days: 'd', mtbf_y: 'y', response_days: 'd', u_tol: '1', p_detect: '1', pf_fraction: '1', weibull_beta: '1', cost_per_reading_eur: 'EUR',
        corrective_eur: 'EUR', planned_eur: 'EUR', downtime_eur_h: 'EUR/h', mttr_h: 'h', inspection_interval_days: 'd', current_interval_days: 'd', years_since_proof: 'y',
        interval_days: 'd', interval_calc_days: 'd', p_catch_planned: '1', p_catch_at_user_interval: '1', ffi_days: 'd', ffi_exact_days: 'd',
        unavailability_at_user_interval: '1', p_failed_now: '1', cost_per_year_eur: 'EUR/y', rtf_cost_per_year_eur: 'EUR/y',
        asset_id: 'text', class_id: 'text', failure_mode: 'text', criticality_class: 'text', evident: 'bool', safety_or_environment: 'bool', pattern: 'text',
        technique: 'text', technique_access: 'bool', current_practice: 'text', strategy: 'text', compulsory: 'bool', consequence: 'text', decision_path: 'text', task_en: 'text', reasons: 'text' },
      model: { equations: ['I_cbm = (PF * f_tech - R) / 2 (rounded down to a practical interval)', 'P_catch = (r/I)(1-(1-d)^(k+1)) + ((I-r)/I)(1-(1-d)^k), W = PF*f - R, k = floor(W/I), r = W - kI',
        'FFI = 2 U MTBF; U_exact(T) = 1 - (M/T)(1 - exp(-T/M))', 'C(T) = [Cp R(T) + Cf F(T)] / integral_0^T R(t) dt (Weibull)'],
        ranges: ['one failure mode at a time', 'exponential failures for hidden functions'],
        notes: ['RCM decision logic after SAE JA1011/JA1012 and Moubray RCM II', 'reliability and cost numbers are learning assumptions unless the class library cites a source', 'text/bool units are labels, not quantities'] },
      warnings: d.warnings.concat(d.kind === 'redesign' && d.compulsory ? ['redesign compulsory: safety consequence without an effective task'] : [])
    };
  }
  function installData() {
    if (!window.Diagram) return;
    Diagram.init({
      id: 'mepstrategy', file: 'mepstrategy.html',
      state: { serialize: function () { return state; },
        deserialize: function (o) { Object.assign(state, o || {}); if (ui) { ui.sync(); ui.run(); } else if (M) last = solve(state); } },
      record: record
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
