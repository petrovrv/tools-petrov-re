    n: ['460 kg/m² gives Rw 57,9 dB by the mass law, but with 180 kg/m² walls rigidly joined R′w is 53,4 and DnT,w 54,6 dB: 64 % of the sound goes around the wall and DA 53,1 misses the class C target 54 — flanking, not the wall, limits you.', '460 кг/м² дають Rw 57,9 дБ за законом мас, але з жорстко з’єднаними стінами 180 кг/м² R′w = 53,4, DnT,w = 54,6 дБ: 64 % звуку обходить стіну, DA 53,1 не досягає цілі класу C 54 — обмежує бокова передача, а не стіна.', '460 kg/m² ergeben nach dem Massegesetz Rw 57,9 dB, mit starr angeschlossenen 180-kg/m²-Wänden aber nur R′w 53,4 und DnT,w 54,6 dB: 64 % des Schalls gehen um die Wand herum, DA 53,1 verfehlt das Klasse-C-Ziel 54 — die Flanken begrenzen, nicht die Wand.', '460 kg/m² geeft Rw 57,9 dB volgens de massawet, maar met stijf verbonden wanden van 180 kg/m² is R′w 53,4 en DnT,w 54,6 dB: 64 % van het geluid gaat rond de wand en DA 53,1 haalt het klasse C-doel 54 niet — de flanken beperken, niet de wand.', '460 kg/m² donnent Rw 57,9 dB par la loi de masse, mais avec des parois de 180 kg/m² liées rigidement R′w vaut 53,4 et DnT,w 54,6 dB : 64 % du son contourne le mur et DA 53,1 manque l’objectif 54 de la classe C — ce sont les flancs qui limitent, pas le mur.', '460 kg/m² dan Rw 57,9 dB por la ley de masa, pero con muros de 180 kg/m² unidos rígidamente R′w es 53,4 y DnT,w 54,6 dB: el 64 % del sonido rodea el muro y DA 53,1 no alcanza el objetivo 54 de la clase C — limitan los flancos, no el muro.', '460 kg/m² daje Rw 57,9 dB wg prawa masy, ale ze sztywno połączonymi ścianami 180 kg/m² R′w = 53,4, DnT,w = 54,6 dB: 64 % dźwięku omija ścianę, a DA 53,1 nie osiąga celu klasy C 54 — ogranicza przenoszenie boczne, nie ściana.'] },

    l: ['Same wall, flanking walls on flexible interlayers', 'Та сама стіна, бокові стіни на пружних прокладках', 'Gleiche Wand, Flankenwände auf elastischen Zwischenlagen', 'Zelfde wand, flankerende wanden op elastische tussenlagen', 'Même mur, parois latérales sur interposition élastique', 'Mismo muro, laterales sobre intercalados elásticos', 'Ta sama ściana, ściany boczne na przekładkach elastycznych'],
    n: ['Elastic joints in the vertical junctions on both sides of the party wall cut the two light walls there (E.3.4, Fig. E.5) and raise R′w from 53,4 to 56,1 dB — about 60 % of the 4,5 dB lost to flanking — and DA 55,6 now meets class C, without touching the separating wall. Strips only at the top and bottom of these side walls would not change their path past the party wall.', 'Пружні шви у вертикальних вузлах з обох боків міжквартирної стіни розрізають там дві легкі стіни (E.3.4, рис. E.5) і піднімають R′w з 53,4 до 56,1 дБ — близько 60 % із 4,5 дБ, втрачених на боковій передачі, — і DA 55,6 тепер відповідає класу C, без зміни самої стіни. Смуги лише зверху й знизу цих бокових стін не змінили б їхній шлях повз міжквартирну стіну.', 'Elastische Fugen in den vertikalen Stößen beiderseits der Wohnungstrennwand trennen dort die zwei leichten Wände (E.3.4, Bild E.5) und heben R′w von 53,4 auf 56,1 dB — etwa 60 % der 4,5 dB Flankenverlust — und DA 55,6 erfüllt nun Klasse C, ohne die Trennwand zu ändern. Streifen nur oben und unten an diesen Flankenwänden würden ihren Weg an der Trennwand vorbei nicht ändern.', 'Elastische voegen in de verticale knopen aan weerszijden van de woningscheidende wand onderbreken daar de twee lichte wanden (E.3.4, fig. E.5) en brengen R′w van 53,4 naar 56,1 dB — ongeveer 60 % van de 4,5 dB flankverlies — en DA 55,6 haalt nu klasse C, zonder aan de scheidingswand te raken. Stroken alleen boven en onder deze flankerende wanden zouden hun weg langs de scheidingswand niet veranderen.', 'Des joints élastiques dans les jonctions verticales des deux côtés du mur mitoyen y coupent les deux parois légères (E.3.4, fig. E.5) et portent R′w de 53,4 à 56,1 dB — environ 60 % des 4,5 dB perdus par les flancs — et DA 55,6 atteint la classe C sans toucher au mur séparatif. Des bandes seulement en haut et en bas de ces parois latérales ne changeraient pas leur voie le long du mur mitoyen.', 'Juntas elásticas en las uniones verticales a ambos lados de la medianera cortan allí los dos muros ligeros (E.3.4, fig. E.5) y suben R′w de 53,4 a 56,1 dB — cerca del 60 % de los 4,5 dB perdidos por flancos — y DA 55,6 cumple ya la clase C sin tocar el muro separador. Bandas solo arriba y abajo de estos muros laterales no cambiarían su camino junto a la medianera.', 'Szczeliny elastyczne w pionowych złączach po obu stronach ściany międzymieszkaniowej przecinają tam dwie lekkie ściany (E.3.4, rys. E.5) i podnoszą R′w z 53,4 do 56,1 dB — ok. 60 % z 4,5 dB straconych na bokach — i DA 55,6 spełnia teraz klasę C bez zmiany samej ściany. Paski tylko u góry i u dołu tych ścian bocznych nie zmieniłyby ich drogi obok ściany międzymieszkaniowej.'] },
  { id: 'heavier', s: P1S,
    l: ['Heavier wall or better flanking? (what-if table)', 'Важча стіна чи кращі бокові елементи? (таблиця «а що як»)', 'Schwerere Wand oder bessere Flanken? (Was-wäre-wenn)', 'Zwaardere wand of betere flanken? (wat-als-tabel)', 'Mur plus lourd ou meilleurs flancs ? (tableau « et si »)', '¿Muro más pesado o mejores flancos? (tabla «y si»)', 'Cięższa ściana czy lepsze boki? (tabela „co jeśli”)'],
    n: ['Doubling the wall to 920 kg/m² adds 11,3 dB to its Rw but only +8,0 dB to DnT,w; flexible joints at the dominant flanking wall give +1,7 dB and a dry lining on it +1,2 dB — with the sound spread over four edges no single fix is enough: treat the weakest path, then the next one shows up.', 'Подвоєння стіни до 920 кг/м² додає 11,3 дБ до її Rw, але лише +8,0 дБ до DnT,w; пружні вузли біля домінантної бокової стіни дають +1,7 дБ, сухе облицювання на ній — +1,2 дБ: коли звук розподілений по чотирьох краях, одного заходу замало — усуньте найслабший шлях, і проявиться наступний.', 'Die Wand auf 920 kg/m² zu verdoppeln bringt 11,3 dB auf Rw, aber nur +8,0 dB auf DnT,w; elastische Stöße an der dominanten Flanke bringen +1,7 dB, eine Vorsatzschale darauf +1,2 dB — bei vier beteiligten Rändern reicht keine Einzelmaßnahme: den schwächsten Weg beheben, dann zeigt sich der nächste.', 'De wand verdubbelen tot 920 kg/m² geeft 11,3 dB meer Rw maar slechts +8,0 dB DnT,w; elastische knopen aan de dominante flank geven +1,7 dB en een voorzetwand erop +1,2 dB — met het geluid verdeeld over vier randen volstaat één ingreep niet: pak de zwakste weg aan, dan verschijnt de volgende.', 'Doubler le mur à 920 kg/m² ajoute 11,3 dB à son Rw mais seulement +8,0 dB au DnT,w ; des jonctions élastiques à la paroi latérale dominante donnent +1,7 dB et un doublage +1,2 dB — avec le son réparti sur quatre bords, aucune mesure seule ne suffit : traitez la voie la plus faible, la suivante apparaît.', 'Duplicar el muro a 920 kg/m² añade 11,3 dB a su Rw pero solo +8,0 dB al DnT,w; uniones elásticas en el flanco dominante dan +1,7 dB y un trasdosado en él +1,2 dB — con el sonido repartido en cuatro bordes ninguna medida sola basta: trate el camino más débil y aparecerá el siguiente.', 'Podwojenie ściany do 920 kg/m² daje +11,3 dB do Rw, ale tylko +8,0 dB do DnT,w; złącza elastyczne przy dominującej ścianie bocznej dają +1,7 dB, okładzina na niej +1,2 dB — gdy dźwięk rozkłada się na cztery krawędzie, jeden środek nie wystarcza: usuń najsłabszą drogę, a pokaże się następna.'] },
  { id: 'small', s: Object.assign({}, P1S, { V: 25 }),
    l: ['Small bedroom behind the same wall (V 25 m³)', 'Мала спальня за тією самою стіною (V 25 м³)', 'Kleines Schlafzimmer hinter derselben Wand (V 25 m³)', 'Kleine slaapkamer achter dezelfde wand (V 25 m³)', 'Petite chambre derrière le même mur (V 25 m³)', 'Dormitorio pequeño tras el mismo muro (V 25 m³)', 'Mała sypialnia za tą samą ścianą (V 25 m³)'],
    n: ['Same construction, half the volume: 10 lg(0,32·25/12) = −1,8 dB instead of +1,3 dB, so DnT,w drops by 3,0 dB to 51,6 — the same wall gives a lower DnT,w in the small room.', 'Та сама конструкція, удвічі менший об’єм: 10 lg(0,32·25/12) = −1,8 дБ замість +1,3 дБ, тож DnT,w падає на 3,0 дБ до 51,6 — та сама стіна дає менше DnT,w у малій кімнаті.', 'Gleiche Konstruktion, halbes Volumen: 10 lg(0,32·25/12) = −1,8 dB statt +1,3 dB, DnT,w fällt um 3,0 dB auf 51,6 — dieselbe Wand ergibt im kleinen Raum ein kleineres DnT,w.', 'Zelfde constructie, half volume: 10 lg(0,32·25/12) = −1,8 dB i.p.v. +1,3 dB, dus DnT,w daalt 3,0 dB tot 51,6 — dezelfde wand geeft in de kleine ruimte een lagere DnT,w.', 'Même construction, moitié du volume : 10 lg(0,32·25/12) = −1,8 dB au lieu de +1,3 dB, DnT,w baisse de 3,0 dB à 51,6 — le même mur donne un DnT,w plus faible dans le petit local.', 'Misma construcción, la mitad de volumen: 10 lg(0,32·25/12) = −1,8 dB en vez de +1,3 dB, DnT,w baja 3,0 dB hasta 51,6 — el mismo muro da menos DnT,w en el recinto pequeño.', 'Ta sama konstrukcja, połowa kubatury: 10 lg(0,32·25/12) = −1,8 dB zamiast +1,3 dB, więc DnT,w spada o 3,0 dB do 51,6 — ta sama ściana daje mniejsze DnT,w w małym pokoju.'] },
  { id: 'ctr', s: P2S,
    l: ['Bass-heavy neighbour noise: DnT,w + Ctr', 'Шум сусіда з басами: DnT,w + Ctr', 'Basslastiger Nachbarlärm: DnT,w + Ctr', 'Basrijk burengeluid: DnT,w + Ctr', 'Bruit de voisinage grave : DnT,w + Ctr', 'Ruido vecinal con graves: DnT,w + Ctr', 'Hałas sąsiada z basami: DnT,w + Ctr'],
    n: ['For music or traffic-like noise the spectrum term Ctr counts: the heavy wall has Ctr −7 dB (B.12: 16 − 9 lg 460 = −8,0, limited to −7), the building −6,9 dB, so DnT,w 57,4 becomes 50,4 dB.', 'Для музики чи шуму типу транспортного важить спектральний член Ctr: у важкої стіни Ctr −7 дБ (B.12: 16 − 9 lg 460 = −8,0, обмежено до −7), у будівлі −6,9 дБ, тож DnT,w 57,4 стає 50,4 дБ.', 'Bei Musik oder verkehrsähnlichem Lärm zählt der Spektrum-Anpassungswert Ctr: die schwere Wand hat Ctr −7 dB (B.12: 16 − 9 lg 460 = −8,0, begrenzt auf −7), das Gebäude −6,9 dB, aus DnT,w 57,4 werden 50,4 dB.', 'Voor muziek of verkeersachtig geluid telt de spectrumterm Ctr: de zware wand heeft Ctr −7 dB (B.12: 16 − 9 lg 460 = −8,0, begrensd tot −7), het gebouw −6,9 dB, dus DnT,w 57,4 wordt 50,4 dB.', 'Pour de la musique ou un bruit de type trafic, le terme Ctr compte : le mur lourd a Ctr −7 dB (B.12 : 16 − 9 lg 460 = −8,0, limité à −7), le bâtiment −6,9 dB, DnT,w 57,4 devient 50,4 dB.', 'Para música o ruido tipo tráfico cuenta el término Ctr: el muro pesado tiene Ctr −7 dB (B.12: 16 − 9 lg 460 = −8,0, limitado a −7), el edificio −6,9 dB, así DnT,w 57,4 pasa a 50,4 dB.', 'Dla muzyki lub hałasu typu drogowego liczy się Ctr: ciężka ściana ma Ctr −7 dB (B.12: 16 − 9 lg 460 = −8,0, ograniczone do −7), budynek −6,9 dB, więc DnT,w 57,4 staje się 50,4 dB.'] },
  { id: 'l14', s: Object.assign({ elem: 'floor', S: 20, V: 50, sSrc: 'mass', sM: 484, sSt: 'lab', sSdR: 10.6, tDA: 0, tRA: 0 }, edgeSt(1, 'rigid_T', 219, 4), edgeSt(2, 'rigid_T', 219, 5), edgeSt(3, 'rigid_cross', 360, 4), edgeSt(4, 'rigid_cross', 360, 5)),
    l: ['Norm example: floor with floating screed (EN ISO 12354-1 L.1.4)', 'Приклад норми: перекриття з плаваючою стяжкою (EN ISO 12354-1 L.1.4)', 'Normbeispiel: Decke mit schwimmendem Estrich (EN ISO 12354-1 L.1.4)', 'Normvoorbeeld: vloer met zwevende dekvloer (EN ISO 12354-1 L.1.4)', 'Exemple de la norme : plancher avec chape flottante (EN ISO 12354-1 L.1.4)', 'Ejemplo de la norma: forjado con solado flotante (EN ISO 12354-1 L.1.4)', 'Przykład z normy: strop z jastrychem pływającym (EN ISO 12354-1 L.1.4)'],
    n: ['The worked example of the norm (Table L.10): 484 kg/m² slab + floating floor ΔRw 10,6 dB, two façade walls 219 kg/m² (T) and two inner walls 360 kg/m² (cross). R′w = 57,0 dB as printed; the floating floor lifts the direct path to 69,3 dB, so 94 % of the sound now goes through the walls.', 'Розрахунковий приклад норми (табл. L.10): плита 484 кг/м² + плаваюча підлога ΔRw 10,6 дБ, дві фасадні стіни 219 кг/м² (T) і дві внутрішні 360 кг/м² (хрест). R′w = 57,0 дБ, як у нормі; плаваюча підлога піднімає прямий шлях до 69,3 дБ, тож 94 % звуку тепер іде через стіни.', 'Das Rechenbeispiel der Norm (Tab. L.10): 484-kg/m²-Decke + schwimmender Estrich ΔRw 10,6 dB, zwei Fassadenwände 219 kg/m² (T) und zwei Innenwände 360 kg/m² (Kreuz). R′w = 57,0 dB wie gedruckt; der Estrich hebt den Direktweg auf 69,3 dB, 94 % des Schalls gehen nun über die Wände.', 'Het rekenvoorbeeld van de norm (tab. L.10): vloerplaat 484 kg/m² + zwevende vloer ΔRw 10,6 dB, twee gevelwanden 219 kg/m² (T) en twee binnenwanden 360 kg/m² (kruis). R′w = 57,0 dB zoals gedrukt; de zwevende vloer tilt de directe weg naar 69,3 dB, zodat 94 % van het geluid nu via de wanden gaat.', 'L’exemple de la norme (tab. L.10) : dalle 484 kg/m² + chape flottante ΔRw 10,6 dB, deux murs de façade 219 kg/m² (T) et deux murs intérieurs 360 kg/m² (croix). R′w = 57,0 dB comme imprimé ; la chape porte la voie directe à 69,3 dB, 94 % du son passe désormais par les murs.', 'El ejemplo de la norma (tab. L.10): losa de 484 kg/m² + suelo flotante ΔRw 10,6 dB, dos muros de fachada de 219 kg/m² (T) y dos interiores de 360 kg/m² (cruz). R′w = 57,0 dB como está impreso; el suelo flotante eleva el camino directo a 69,3 dB, así el 94 % del sonido pasa ahora por los muros.', 'Przykład obliczeniowy normy (tab. L.10): płyta 484 kg/m² + podłoga pływająca ΔRw 10,6 dB, dwie ściany fasadowe 219 kg/m² (T) i dwie wewnętrzne 360 kg/m² (krzyż). R′w = 57,0 dB jak w druku; podłoga pływająca podnosi drogę bezpośrednią do 69,3 dB, więc 94 % dźwięku idzie teraz przez ściany.'] },
  { id: 'ceiling', s: Object.assign({ elem: 'wall', S: 12, V: 50, sSrc: 'lab', sM: 25, sRw: 53, sC: -4, sCtr: -11, tDA: 0, tRA: 0 },
      edgeSt(1, 'dnf', 400, 4.6, { Dnf: 47, DnfC: -2, DnfCtr: -6, llab: 4.5 }), edgeSt(2, 'lightweight', 400, 4.6), edgeSt(3, 'lightweight', 400, 2.6), edgeSt(4, 'lightweight', 400, 2.6)),
    l: ['Stud wall stopping at a continuous suspended ceiling', 'Каркасна стіна до суцільної підвісної стелі', 'Ständerwand bis an eine durchlaufende Unterdecke', 'Metal-stud wand tot tegen een doorlopend verlaagd plafond', 'Cloison s’arrêtant sous un faux plafond continu', 'Tabique que termina en un falso techo continuo', 'Ścianka szkieletowa do ciągłego sufitu podwieszonego'],
    n: ['A stud wall with Rw 53 dB that stops at a continuous suspended ceiling (Dn,f,w 47 dB, Formula (21)), on a continuous slab between 400 kg/m² masonry side walls: 58 % of the sound crosses over the ceiling void and DnT,w is only 46,6 dB. Closing the plenum (Dn,f,w 70 dB) gives 50,3 dB — then the slab and walls running on past the stud wall (E.3.5, K24) limit it. Close the plenum before buying a better wall.', 'Каркасна стіна з Rw 53 дБ, що закінчується під суцільною підвісною стелею (Dn,f,w 47 дБ, формула (21)), на суцільній плиті між мурованими боковими стінами 400 кг/м²: 58 % звуку проходить над стелею, і DnT,w лише 46,6 дБ. Перекритий простір над стіною (Dn,f,w 70 дБ) дає 50,3 дБ — далі обмежують плита й стіни, що тягнуться повз каркасну стіну (E.3.5, K24). Спершу перекрийте простір над стіною, а не купуйте кращу стіну.', 'Eine Ständerwand mit Rw 53 dB, die an einer durchlaufenden Unterdecke endet (Dn,f,w 47 dB, Formel (21)), auf durchlaufender Decke zwischen 400-kg/m²-Mauerwerkswänden: 58 % des Schalls gehen über den Deckenhohlraum, DnT,w nur 46,6 dB. Mit geschottetem Hohlraum (Dn,f,w 70 dB) werden es 50,3 dB — dann begrenzen Decke und Wände, die an der Ständerwand vorbeilaufen (E.3.5, K24). Erst den Hohlraum schotten, dann eine bessere Wand kaufen.', 'Een metal-studwand met Rw 53 dB die stopt tegen een doorlopend verlaagd plafond (Dn,f,w 47 dB, formule (21)), op een doorlopende vloerplaat tussen gemetselde zijwanden van 400 kg/m²: 58 % van het geluid gaat over de plafondruimte en DnT,w is maar 46,6 dB. Met afgesloten plenum (Dn,f,w 70 dB) wordt het 50,3 dB — dan beperken de vloer en de wanden die langs de studwand doorlopen (E.3.5, K24). Sluit eerst het plenum af voor u een betere wand koopt.', 'Une cloison Rw 53 dB qui s’arrête sous un faux plafond continu (Dn,f,w 47 dB, formule (21)), sur une dalle continue entre des murs latéraux maçonnés de 400 kg/m² : 58 % du son passe par le plénum et DnT,w n’est que de 46,6 dB. Plénum fermé (Dn,f,w 70 dB) : 50,3 dB — ensuite la dalle et les murs qui longent la cloison (E.3.5, K24) limitent. Fermez le plénum avant d’acheter une meilleure cloison.', 'Un tabique de Rw 53 dB que acaba en un falso techo continuo (Dn,f,w 47 dB, fórmula (21)), sobre un forjado continuo entre muros laterales de fábrica de 400 kg/m²: el 58 % del sonido pasa por el plenum y DnT,w es solo 46,6 dB. Con el plenum cerrado (Dn,f,w 70 dB) da 50,3 dB — luego limitan el forjado y los muros que siguen junto al tabique (E.3.5, K24). Cierre el plenum antes de comprar un tabique mejor.', 'Ścianka o Rw 53 dB kończąca się pod ciągłym sufitem podwieszonym (Dn,f,w 47 dB, wzór (21)), na ciągłym stropie między murowanymi ścianami bocznymi 400 kg/m²: 58 % dźwięku przechodzi nad sufitem, a DnT,w wynosi tylko 46,6 dB. Po zamknięciu przestrzeni nad ścianką (Dn,f,w 70 dB) jest 50,3 dB — dalej ograniczają strop i ściany biegnące obok ścianki (E.3.5, K24). Najpierw zamknij przestrzeń nad ścianką, potem kupuj lepszą ściankę.'] },
  { id: 'ra50', s: Object.assign({ elem: 'wall', S: 12, V: 50, sSrc: 'bands', sM: 50, sBands: '17 20 25 36 40 44 48 52 55 58 60 62 64 65 66 66 64 65 68 71 73', tDA: 58, tRA: 55 },
      edgeSt(1, 'lightweight', 480, 4.6, LIN50), edgeSt(2, 'lightweight', 480, 4.6, LIN50), edgeSt(3, 'lightweight', 300, 2.6, LIN50), edgeSt(4, 'lightweight', 300, 2.6, LIN50)),
    l: ['Light double wall, class B: DA passes, RA,50 fails', 'Легка подвійна стіна, клас B: DA проходить, RA,50 — ні', 'Leichte Doppelwand, Klasse B: DA erfüllt, RA,50 nicht', 'Lichte dubbele wand, klasse B: DA voldoet, RA,50 niet', 'Double paroi légère, classe B : DA passe, RA,50 échoue', 'Muro doble ligero, clase B: DA cumple, RA,50 no', 'Lekka ściana podwójna, klasa B: DA spełnia, RA,50 nie'],
    n: ['An illustrative 50 kg/m² double stud wall rated from its spectrum (EN ISO 717-1): Rw 61 dB, C −2, but C50-3150 −10 dB because of the weak 50–80 Hz bands. The masonry walls run on past it (E.3.5, K24) and carry dry linings on both sides — without them DA would be only 48,6. With them DA 58,4 meets class B (58), but the element RA,50 = 51 dB misses the 55 required by NBN S 01-400-1 — the Belgian norm also checks the bass.', 'Ілюстративна подвійна каркасна стіна 50 кг/м², оцінена за спектром (EN ISO 717-1): Rw 61 дБ, C −2, але C50-3150 −10 дБ через слабкі смуги 50–80 Гц. Муровані стіни тягнуться повз неї (E.3.5, K24) і мають сухе облицювання з обох боків — без нього DA був би лише 48,6. З ним DA 58,4 відповідає класу B (58), а RA,50 елемента = 51 дБ не досягає 55 за NBN S 01-400-1 — бельгійська норма перевіряє й баси.', 'Eine beispielhafte 50-kg/m²-Doppelständerwand, aus ihrem Spektrum bewertet (EN ISO 717-1): Rw 61 dB, C −2, aber C50-3150 −10 dB wegen der schwachen Bänder 50–80 Hz. Die Mauerwerkswände laufen an ihr vorbei (E.3.5, K24) und tragen beidseitig Vorsatzschalen — ohne sie wäre DA nur 48,6. Mit ihnen erfüllt DA 58,4 Klasse B (58), das Bauteil-RA,50 = 51 dB verfehlt aber die nach NBN S 01-400-1 geforderten 55 — die belgische Norm prüft auch den Bass.', 'Een illustratieve dubbele metal-studwand van 50 kg/m², beoordeeld uit zijn spectrum (EN ISO 717-1): Rw 61 dB, C −2, maar C50-3150 −10 dB door de zwakke banden 50–80 Hz. De gemetselde wanden lopen erlangs door (E.3.5, K24) en hebben aan beide zijden een voorzetwand — zonder die zou DA maar 48,6 zijn. Met die wanden haalt DA 58,4 klasse B (58), maar de element-RA,50 = 51 dB haalt de 55 van NBN S 01-400-1 niet — de Belgische norm toetst ook de bas.', 'Une double cloison illustrative de 50 kg/m² évaluée à partir de son spectre (EN ISO 717-1) : Rw 61 dB, C −2, mais C50-3150 −10 dB à cause des bandes faibles 50–80 Hz. Les murs maçonnés la longent (E.3.5, K24) et portent un doublage sur les deux faces — sans
