    add(T('M · total net anode mass','M · загальна маса анодів нетто','M · gesamte Netto-Anodenmasse','M · totale netto anodemassa','M · masse nette totale d\'anodes','M · masa neta total de ánodos','M · całkowita masa netto anod'), r.M, 'kg', 'mass');
    add(T('Icm · mean current demand','Icm · середня потреба в струмі','Icm · mittlerer Strombedarf','Icm · gemiddelde stroombehoefte','Icm · demande de courant moyenne','Icm · demanda media de corriente','Icm · średnie zapotrzebowanie na prąd'), r.Icm, 'A', 'demand');
    add(T('Icf · final current demand','Icf · кінцева потреба в струмі','Icf · End-Strombedarf','Icf · eindstroombehoefte','Icf · demande de courant finale','Icf · demanda final de corriente','Icf · końcowe zapotrzebowanie na prąd'), r.Icf, 'A', 'demand');
    add(T('s · anode spacing','s · відстань між анодами','s · Anodenabstand','s · anodeafstand','s · espacement des anodes','s · separación entre ánodos','s · rozstaw anod'), r.spacing, 'm', 'spacing', false, r.spacing > 300 ? 'warn' : null);
    if (full) {
      add(T('Ac · coated surface area','Ac · площа покритої поверхні','Ac · beschichtete Oberfläche','Ac · gecoat oppervlak','Ac · surface revêtue','Ac · superficie revestida','Ac · powierzchnia powlekana'), r.Ac, 'm²', 'geometry');
      add(T('fcm · mean coating breakdown factor','fcm · середній коефіцієнт руйнування покриття','fcm · mittlerer Beschichtungsabbaufaktor','fcm · gemiddelde coatingdegradatiefactor','fcm · facteur moyen de dégradation du revêtement','fcm · factor medio de degradación del revestimiento','fcm · średni współczynnik degradacji powłoki'), r.fcm, '–', 'coating');
      add(T('fcf · final coating breakdown factor','fcf · кінцевий коефіцієнт руйнування покриття','fcf · End-Beschichtungsabbaufaktor','fcf · eind-coatingdegradatiefactor','fcf · facteur final de dégradation du revêtement','fcf · factor final de degradación del revestimiento','fcf · końcowy współczynnik degradacji powłoki'), r.fcf, '–', 'coating');
      add(T('Ra · anode resistance','Ra · опір анода','Ra · Anodenwiderstand','Ra · anodeweerstand','Ra · résistance d\'anode','Ra · resistencia del ánodo','Ra · rezystancja anody'), r.Raf, 'Ω', 'resistance');
      add(T('Ia · anode output','Ia · струм віддачі анода','Ia · Anodenstromabgabe','Ia · anodestroomafgifte','Ia · débit de l\'anode','Ia · corriente de salida del ánodo','Ia · prąd wyjściowy anody'), r.Iaf, 'A', 'potential');
      add(T('Nm · anodes by mass','Nm · анодів за масою','Nm · Anoden nach Masse','Nm · anodes op basis van massa','Nm · anodes selon la masse','Nm · ánodos por masa','Nm · anody wg masy'), r.Nm, '', 'mass');
      add(T('Nc · anodes by current','Nc · анодів за струмом','Nc · Anoden nach Strom','Nc · anodes op basis van stroom','Nc · anodes selon le courant','Nc · ánodos por corriente','Nc · anody wg prądu'), r.Nc, '', 'resistance');
    }
    if (fin(r.Icf) && fin(n) && fin(r.Iaf) && n * r.Iaf > 0) {
      var ratio = Math.min(1.5, r.Icf / (n * r.Iaf));
      meters.push({ label: T('Current capacity utilisation Icf / (N·Ia)','Використання струмової здатності Icf / (N·Ia)','Auslastung der Stromkapazität Icf / (N·Ia)','Benutting stroomcapaciteit Icf / (N·Ia)','Utilisation de la capacité de courant Icf / (N·Ia)','Utilización de la capacidad de corriente Icf / (N·Ia)','Wykorzystanie zdolności prądowej Icf / (N·Ia)'), ratio: ratio, text: DiagramUI.fmt(ratio, { precision: 3 }), tone: ratio > 1 ? 'bad' : (ratio > 0.9 ? 'warn' : 'ok') });
    }
    if (r.warnings) for (i = 0; i < r.warnings.length; i++) { w = r.warnings[i]; notes.push(trW(w)); }
    return { verdict: verdict, tiles: tiles, meters: meters, tables: tables, notes: notes };
  }

  function degrade() {
    document.title = 'diagram-ui.js v1 is required';
    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1');
    h.textContent = 'Pipeline cathodic protection';
    var p = document.createElement('p');
    p.textContent = 'The interactive interface could not load. The export, the calculation record '
                  + 'and the limitations are still available from the bar at the bottom of the page.';
    host.appendChild(h);
    host.appendChild(p);
    last = solve(state);
  }

  function boot() {
    if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1') buildInterface();
    else degrade();
    installData();
  }

  function buildInterface() {
    ui = DiagramUI.app({
      id: 'cathodic_protection',
      mount: '#app',
      layout: 'calculator',
      compute: 'live',
      state: state,
      defaults: DEFAULTS,
      learn: {
        version: 1,
        intro: { title: T('Bracelet anode design (DNV-RP-F103 / DNV-RP-B401)', 'Розрахунок браслетних анодів (DNV-RP-F103 / DNV-RP-B401)', 'Armbandanoden-Auslegung (DNV-RP-F103 / DNV-RP-B401)', 'Ontwerp armbandanodes (DNV-RP-F103 / DNV-RP-B401)', 'Dimensionnement des anodes bracelets (DNV-RP-F103 / DNV-RP-B401)', 'Diseño de ánodos brazalete (DNV-RP-F103 / DNV-RP-B401)', 'Projekt anod bransoletowych (DNV-RP-F103 / DNV-RP-B401)'),
          body: T('A coated pipeline is protected by sacrificial bracelet anodes that corrode instead of the steel. The design has two checks: enough anode mass to supply the mean current for the whole life, and enough anodes to deliver the final current at the end of life; the larger count governs. This is a preliminary sizing; attenuation and field joints are checked separately.',
            'Трубопровід із покриттям захищають протекторні браслетні аноди, які кородують замість сталі. Розрахунок має дві перевірки: достатня маса анодів, щоб забезпечити середній струм протягом усього терміну, і достатня кількість анодів, щоб віддати кінцевий струм наприкінці терміну; визначає більша кількість. Це попередній розрахунок; затухання та монтажні стики перевіряють окремо.',
            'Eine beschichtete Rohrleitung wird durch Opfer-Armbandanoden geschützt, die anstelle des Stahls korrodieren. Die Auslegung hat zwei Nachweise: genug Anodenmasse für den mittleren Strom über die gesamte Lebensdauer und genug Anoden für den Endstrom am Lebensende; die größere Anzahl ist maßgebend. Dies ist eine Vorbemessung; Potenzialabfall und Feldschweißnähte werden gesondert geprüft.',
            'Een gecoate pijpleiding wordt beschermd door opofferingsarmbandanodes die in plaats van het staal corroderen. Het ontwerp kent twee toetsen: genoeg anodemassa voor de gemiddelde stroom over de hele levensduur en genoeg anodes voor de eindstroom aan het einde van de levensduur; het grootste aantal is bepalend. Dit is een voorontwerp; potentiaalverzwakking en veldlassen worden apart getoetst.',
            'Un pipeline revêtu est protégé par des anodes bracelets sacrificielles qui se corrodent à la place de l’acier. Le dimensionnement comporte deux vérifications : assez de masse d’anode pour fournir le courant moyen pendant toute la durée de vie, et assez d’anodes pour débiter le courant final en fin de vie ; le plus grand nombre l’emporte. Il s’agit d’un prédimensionnement ; l’atténuation et les joints de chantier se vérifient à part.',
            'Una tubería revestida se protege con ánodos de sacrificio tipo brazalete que se corroen en lugar del acero. El diseño tiene dos comprobaciones: masa de ánodo suficiente para suministrar la corriente media durante toda la vida y ánodos suficientes para entregar la corriente final al final de la vida; gobierna el número mayor. Es un dimensionamiento preliminar; la atenuación y las juntas de campo se comprueban aparte.',
            'Powlekany rurociąg chronią protektorowe anody bransoletowe, które korodują zamiast stali. Projekt obejmuje dwa sprawdzenia: wystarczająca masa anod, by dostarczać prąd średni przez cały okres eksploatacji, oraz wystarczająca liczba anod, by oddać prąd końcowy na końcu okresu; decyduje większa liczba. To wymiarowanie wstępne; tłumienie potencjału i złącza montażowe sprawdza się osobno.') },
        topics: {
          governing: { title: T('Mass or current: which governs', 'Маса чи струм: що визначає', 'Masse oder Strom: was maßgebend ist', 'Massa of stroom: wat bepalend is', 'Masse ou courant : qui dimensionne', 'Masa o corriente: qué gobierna', 'Masa czy prąd: co decyduje'),
            body: T('N = max(Nm, Nc): Nm = M/m_a anodes carry enough material, Nc = Icf/Ia anodes deliver enough final current. With the low breakdown of modern 3LPE coatings, current usually governs in sediment; mass takes over for long lives, small anodes or low-resistivity seawater. Simple uses default coating, capacity and potentials; Full shows all of them and the intermediate results.',
              'N = max(Nm, Nc): Nm = M/m_a анодів містять достатньо матеріалу, Nc = Icf/Ia анодів віддають достатній кінцевий струм. За малого руйнування сучасних покриттів 3LPE у донних відкладах зазвичай визначає струм; маса стає визначальною для довгих термінів, малих анодів або морської води з низьким опором. Простий рівень бере типові покриття, ємність і потенціали; повний показує їх усі та проміжні результати.',
              'N = max(Nm, Nc): Nm = M/m_a Anoden enthalten genug Material, Nc = Icf/Ia Anoden liefern genug Endstrom. Bei dem geringen Abbau moderner 3LPE-Beschichtungen ist im Sediment meist der Strom maßgebend; die Masse übernimmt bei langer Lebensdauer, kleinen Anoden oder niederohmigem Meerwasser. Einfach nutzt Standardwerte für Beschichtung, Kapazität und Potenziale; Vollständig zeigt sie alle samt Zwischenergebnissen.',
              'N = max(Nm, Nc): Nm = M/m_a anodes bevatten genoeg materiaal, Nc = Icf/Ia anodes leveren genoeg eindstroom. Bij de geringe degradatie van moderne 3LPE-coatings is in sediment meestal de stroom bepalend; de massa neemt het over bij lange levensduur, kleine anodes of zeewater met lage resistiviteit. Eenvoudig gebruikt standaardwaarden voor coating, capaciteit en potentialen; Volledig toont ze allemaal met de tussenresultaten.',
              'N = max(Nm, Nc) : Nm = M/m_a anodes contiennent assez de matière, Nc = Icf/Ia anodes débitent assez de courant final. Avec la faible dégradation des revêtements 3LPE modernes, c’est souvent le courant qui dimensionne dans les sédiments ; la masse prend le relais pour les longues durées de vie, les petites anodes ou l’eau de mer peu résistive. Simple utilise des valeurs types de revêtement, capacité et potentiels ; Complet les affiche toutes avec les résultats intermédiaires.',
              'N = max(Nm, Nc): Nm = M/m_a ánodos contienen material suficiente, Nc = Icf/Ia ánodos entregan corriente final suficiente. Con la baja degradación de los revestimientos 3LPE modernos, en sedimento suele gobernar la corriente; la masa toma el relevo con vidas largas, ánodos pequeños o agua de mar de baja resistividad. Simple usa valores típicos de revestimiento, capacidad y potenciales; Completo los muestra todos con los resultados intermedios.',
              'N = max(Nm, Nc): Nm = M/m_a anod zawiera dość materiału, Nc = Icf/Ia anod oddaje dość prądu końcowego. Przy małej degradacji nowoczesnych powłok 3LPE w osadach zwykle decyduje prąd; masa przejmuje rolę przy długim okresie eksploatacji, małych anodach lub wodzie morskiej o niskiej rezystywności. Prosty używa typowych wartości powłoki, pojemności i potencjałów; Pełny pokazuje je wszystkie wraz z wynikami pośrednimi.') },
          geometry: { title: T('Pipe surface area', 'Площа поверхні труби', 'Rohroberfläche', 'Buisoppervlak', 'Surface de la conduite', 'Superficie de la tubería', 'Powierzchnia rury'),
            body: T('The protected area is Ac = π·D·L of the outer coated surface, so current demand and anode mass scale directly with diameter and length. A 12" line of 10 km has about 10 200 m². Use the outside diameter including any concrete weight coating only if the anodes sit on it; risers, valves and bare items need their own allowance.',
              'Захищувана площа Ac = π·D·L — це зовнішня поверхня з покриттям, тому потреба в струмі та маса анодів прямо пропорційні діаметру й довжині. Лінія 12" завдовжки 10 км має близько 10 200 м². Бетонне обважнення враховуйте в діаметрі лише тоді, коли аноди встановлено на ньому; райзери, засувки та непокриті елементи потребують окремого запасу.',
              'Die geschützte Fläche ist Ac = π·D·L der äußeren beschichteten Oberfläche, Strombedarf und Anodenmasse wachsen also direkt mit Durchmesser und Länge. Eine 12"-Leitung von 10 km hat rund 10 200 m². Einen Betonmantel nur einrechnen, wenn die Anoden darauf sitzen; Steigleitungen, Armaturen und blanke Teile brauchen einen eigenen Zuschlag.',
              'Het beschermde oppervlak is Ac = π·D·L van het gecoate buitenoppervlak, dus stroombehoefte en anodemassa schalen direct met diameter en lengte. Een 12" leiding van 10 km heeft circa 10 200 m². Neem een betonmantel alleen mee als de anodes erop zitten; risers, afsluiters en blanke onderdelen vragen een eigen toeslag.',
              'La surface protégée est Ac = π·D·L de la surface extérieure revêtue : la demande de courant et la masse d’anodes croissent donc directement avec le diamètre et la longueur. Une conduite 12" de 10 km fait environ 10 200 m². N’incluez un lestage béton que si les anodes y sont posées ; risers, vannes et pièces nues demandent leur propre marge.',
              'El área protegida es Ac = π·D·L de la superficie exterior revestida, así que la demanda de corriente y la masa de ánodos crecen directamente con el diámetro y la longitud. Una tubería de 12" y 10 km tiene unos 10 200 m². Incluya un lastre de hormigón solo si los ánodos van sobre él; risers, válvulas y piezas desnudas necesitan su propio margen.',
              'Chroniona powierzchnia Ac = π·D·L to zewnętrzna powierzchnia z powłoką, więc zapotrzebowanie prądu i masa anod rosną wprost z średnicą i długością. Rurociąg 12" o długości 10 km ma ok. 10 200 m². Obciążenie betonowe uwzględniaj tylko, gdy anody są na nim osadzone; pionowe odcinki, zawory i elementy bez powłoki wymagają osobnego zapasu.') },
          density: { title: T('Design current density', 'Проєктна густина струму', 'Auslegungsstromdichte', 'Ontwerpstroomdichtheid', 'Densité de courant de calcul', 'Densidad de corriente de diseño', 'Projektowa gęstość prądu'),
            body: T('ic is the current a bare steel surface needs to reach the protective potential. DNV-RP-F103 and ISO 15589-2 give values by temperature and burial; buried lines need less than lines exposed to seawater. Typical values are 0.05 A/m² buried and 0.07 to 0.13 A/m² exposed; the final value is often higher than the mean because calcareous deposits must be rebuilt after storms.',
              'ic — струм, потрібний голій сталевій поверхні, щоб досягти захисного потенціалу. DNV-RP-F103 та ISO 15589-2 задають значення залежно від температури та заглиблення; заглибленим лініям потрібно менше, ніж відкритим у морській воді. Типові значення — 0,05 А/м² для заглиблених і 0,07–0,13 А/м² для відкритих; кінцеве значення часто вище за середнє, бо карбонатні відкладення треба відновлювати після штормів.',
              'ic ist der Strom, den eine blanke Stahlfläche zum Erreichen des Schutzpotenzials braucht. DNV-RP-F103 und ISO 15589-2 geben Werte nach Temperatur und Eingrabung an; eingegrabene Leitungen brauchen weniger als frei im Meerwasser liegende. Typisch sind 0,05 A/m² eingegraben und 0,07 bis 0,13 A/m² frei; der Endwert liegt oft über dem Mittelwert, weil Kalkschichten nach Stürmen neu aufgebaut werden müssen.',
              'ic is de stroom die een blank staaloppervlak nodig heeft om het beschermingspotentiaal te bereiken. DNV-RP-F103 en ISO 15589-2 geven waarden per temperatuur en ingraving; ingegraven leidingen hebben minder nodig dan leidingen vrij in zeewater. Typisch is 0,05 A/m² ingegraven en 0,07 tot 0,13 A/m² vrij; de eindwaarde is vaak hoger dan het gemiddelde omdat kalkafzettingen na stormen opnieuw moeten worden gevormd.',
              'ic est le courant dont une surface d’acier nu a besoin pour atteindre le potentiel de protection. DNV-RP-F103 et ISO 15589-2 donnent des valeurs selon la température et l’ensouillage ; une conduite ensouillée en demande moins qu’une conduite exposée à l’eau de mer. Valeurs types : 0,05 A/m² ensouillée et 0,07 à 0,13 A/m² exposée ; la valeur finale dépasse souvent la moyenne car les dépôts calcaires doivent se reformer après les tempêtes.',
              'ic es la corriente que necesita una superficie de acero desnudo para alcanzar el potencial de protección. DNV-RP-F103 e ISO 15589-2 dan valores según la temperatura y el enterramiento; las tuberías enterradas necesitan menos que las expuestas al agua de mar. Valores típicos: 0,05 A/m² enterrada y 0,07 a 0,13 A/m² expuesta; el valor final suele superar al medio porque los depósitos calcáreos deben rehacerse tras los temporales.',
              'ic to prąd potrzebny gołej powierzchni stali do osiągnięcia potencjału ochrony. DNV-RP-F103 i ISO 15589-2 podają wartości zależne od temperatury i zakopania; rurociągi zakopane potrzebują mniej niż odsłonięte w wodzie morskiej. Typowo 0,05 A/m² dla zakopanych i 0,07–0,13 A/m² dla odsłoniętych; wartość końcowa bywa wyższa od średniej, bo osady wapienne trzeba odbudować po sztormach.') },
          coating: { title: T('Coating breakdown with time', 'Руйнування покриття з часом', 'Beschichtungsabbau über die Zeit', 'Coatingdegradatie in de tijd', 'Dégradation du revêtement dans le temps', 'Degradación del revestimiento con el tiempo', 'Degradacja powłoki w czasie'),
            body: T('Only the coating defects draw current: fc = a + b·t. The mean factor fcm = a + 0.5·b·tf sizes the mass, the final factor fcf = a + b·tf sizes the end-of-life current. Because fc grows with time, the anode mass grows faster than the design life: 3LPE (a = 0.001, b = 0.0003) gives fcf 0.0085 at 25 years, FBE (a = 0.03, b = 0.003) gives 0.105. A final factor above 0.3 points to a poor coating.',
              'Струм споживають лише дефекти покриття: fc = a + b·t. Середній коефіцієнт fcm = a + 0,5·b·tf визначає масу, кінцевий fcf = a + b·tf — струм наприкінці терміну. Оскільки fc зростає з часом, маса анодів зростає швидше за проєктний термін: 3LPE (a = 0,001, b = 0,0003) дає fcf 0,0085 за 25 років, FBE (a = 0,03, b = 0,003) — 0,105. Кінцевий коефіцієнт понад 0,3 свідчить про погане покриття.',
              'Nur die Fehlstellen der Beschichtung ziehen Strom: fc = a + b·t. Der mittlere Faktor fcm = a + 0,5·b·tf bestimmt die Masse, der Endfaktor fcf = a + b·tf den Strom am Lebensende. Da fc mit der Zeit wächst, steigt die Anodenmasse schneller als die Lebensdauer: 3LPE (a = 0,001, b = 0,0003) ergibt fcf 0,0085 nach 25 Jahren, FBE (a = 0,03, b = 0,003) 0,105. Ein Endfaktor über 0,3 deutet auf eine schlechte Beschichtung.',
              'Alleen de coatingdefecten trekken stroom: fc = a + b·t. De gemiddelde factor fcm = a + 0,5·b·tf bepaalt de massa, de eindfactor fcf = a + b·tf de stroom aan het einde van de levensduur. Omdat fc met de tijd groeit, stijgt de anodemassa sneller dan de levensduur: 3LPE (a = 0,001, b = 0,0003) geeft fcf 0,0085 na 25 jaar, FBE (a = 0,03, b = 0,003) 0,105. Een eindfactor boven 0,3 wijst op een slechte coating.',
              'Seuls les défauts du revêtement consomment du courant : fc = a + b·t. Le facteur moyen fcm = a + 0,5·b·tf dimensionne la masse, le facteur final fcf = a + b·tf le courant de fin de vie. Comme fc croît avec le temps, la masse d’anodes augmente plus vite que la durée de vie : le 3LPE (a = 0,001, b = 0,0003) donne fcf 0,0085 à 25 ans, le FBE (a = 0,03, b = 0,003) donne 0,105. Un facteur final supérieur à 0,3 indique un revêtement médiocre.',
              'Solo los defectos del revestimiento consumen corriente: fc = a + b·t. El factor medio fcm = a + 0,5·b·tf dimensiona la masa y el final fcf = a + b·tf la corriente al final de la vida. Como fc crece con el tiempo, la masa de ánodos crece más deprisa que la vida de diseño: 3LPE (a = 0,001, b = 0,0003) da fcf 0,0085 a 25 años, FBE (a = 0,03, b = 0,003) da 0,105. Un factor final superior a 0,3 indica un revestimiento deficiente.',
              'Prąd pobierają tylko defekty powłoki: fc = a + b·t. Średni współczynnik fcm = a + 0,5·b·tf wyznacza masę, końcowy fcf = a + b·tf prąd na końcu okresu eksploatacji. Ponieważ fc rośnie z czasem, masa anod rośnie szybciej niż okres projektowy: 3LPE (a = 0,001, b = 0,0003) daje fcf 0,0085 po 25 latach, FBE (a = 0,03, b = 0,003) daje 0,105. Współczynnik końcowy powyżej 0,3 wskazuje na słabą powłokę.') },
          demand: { title: T('Current demand', 'Потреба в струмі', 'Strombedarf', 'Stroombehoefte', 'Demande de courant', 'Demanda de corriente', 'Zapotrzebowanie prądu'),
            body: T('Current demand I = Ac·fc·ic: area times coating breakdown factor times bare-steel current density. The mean demand Icm sets how much anode material is consumed; the final demand Icf, with the largest breakdown, sets how many anodes must work in parallel. For a well-coated 10 km 12" line the demand is only a few amperes.',
              'Потреба в струмі I = Ac·fc·ic: площа, помножена на коефіцієнт руйнування покриття та густину струму для голої сталі. Середня потреба Icm визначає витрату анодного матеріалу; кінцева потреба Icf за найбільшого руйнування визначає, скільки анодів має працювати паралельно. Для добре ізольованої лінії 12" довжиною 10 км потреба становить лише кілька амперів.',
              'Strombedarf I = Ac·fc·ic: Fläche mal Beschichtungsabbaufaktor mal Stromdichte für blanken Stahl. Der mittlere Bedarf Icm bestimmt den Verbrauch an Anodenmaterial; der Endbedarf Icf mit dem größten Abbau bestimmt, wie viele Anoden parallel arbeiten müssen. Für eine gut beschichtete 12"-Leitung von 10 km sind es nur wenige Ampere.',
              'Stroombehoefte I = Ac·fc·ic: oppervlak maal coatingdegradatiefactor maal stroomdichtheid van blank staal. De gemiddelde behoefte Icm bepaalt het verbruik van anodemateriaal; de eindbehoefte Icf, met de grootste degradatie, bepaalt hoeveel anodes parallel moeten werken. Voor een goed gecoate 12" leiding van 10 km is dat maar enkele ampère.',
              'Demande de courant I = Ac·fc·ic : surface × facteur de dégradation du revêtement × densité de courant de l’acier nu. La demande moyenne Icm fixe la consommation de matériau anodique ; la demande finale Icf, avec la plus forte dégradation, fixe le nombre d’anodes qui doivent travailler en parallèle. Pour une conduite 12" de 10 km bien revêtue, elle ne fait que quelques ampères.',
              'Demanda de corriente I = Ac·fc·ic: área por factor de degradación del revestimiento por densidad de corriente del acero desnudo. La demanda media Icm fija el consumo de material anódico; la demanda final Icf, con la mayor degradación, fija cuántos ánodos deben trabajar en paralelo. Para una tubería de 12" y 10 km bien revestida es de solo unos pocos amperios.',
              'Zapotrzebowanie prądu I = Ac·fc·ic: powierzchnia razy współczynnik degradacji powłoki razy gęstość prądu dla gołej stali. Średnie zapotrzebowanie Icm wyznacza zużycie materiału anodowego; końcowe Icf, przy największej degradacji, wyznacza, ile anod musi pracować równolegle. Dla dobrze powleczonego rurociągu 12" o długości 10 km to zaledwie kilka amperów.') },
          mass: { title: T('Anode mass', 'Маса анодів', 'Anodenmasse', 'Anodemassa', 'Masse anodique', 'Masa anódica', 'Masa anod'),
            body: T('Net anode mass M = Icm·tf·8760/(u·ε): the charge delivered over the life divided by the usable capacity. Nm = M divided by the net mass of one anode, rounded up. Pitfall: use the net alloy mass, not the gross mass with the steel insert, and remember that M grows faster than tf because the mean breakdown factor also grows.',
              'Маса анодів нетто M = Icm·tf·8760/(u·ε): заряд, відданий за термін служби, поділений на корисну ємність. Nm = M, поділена на масу нетто одного анода, з округленням угору. Пастка: беріть масу сплаву нетто, а не брутто зі сталевою вставкою, і пам’ятайте, що M зростає швидше за tf, бо середній коефіцієнт руйнування теж зростає.',
              'Netto-Anodenmasse M = Icm·tf·8760/(u·ε): die über die Lebensdauer abgegebene Ladung geteilt durch die nutzbare Kapazität. Nm = M geteilt durch die Nettomasse einer Anode, aufgerundet. Falle: die Netto-Legierungsmasse nehmen, nicht die Bruttomasse mit Stahlkern, und beachten, dass M schneller als tf wächst, weil auch der mittlere Abbaufaktor steigt.',
              'Netto anodemassa M = Icm·tf·8760/(u·ε): de over de levensduur geleverde lading gedeeld door de bruikbare capaciteit. Nm = M gedeeld door de nettomassa van één anode, naar boven afgerond. Valkuil: gebruik de netto legeringsmassa, niet de brutomassa met stalen kern, en bedenk dat M sneller groeit dan tf omdat ook de gemiddelde degradatiefactor stijgt.',
              'Masse nette d’anodes M = Icm·tf·8760/(u·ε) : la charge délivrée sur la durée de vie divisée par la capacité utilisable. Nm = M divisée par la masse nette d’une anode, arrondie au supérieur. Piège : prendre la masse nette d’alliage, pas la masse brute avec l’insert en acier, et se rappeler que M croît plus vite que tf, car le facteur moyen de dégradation augmente aussi.',
              'Masa neta de ánodos M = Icm·tf·8760/(u·ε): la carga entregada durante la vida dividida por la capacidad aprovechable. Nm = M dividida por la masa neta de un ánodo, redondeada hacia arriba. Trampa: use la masa neta de aleación, no la bruta con el alma de acero, y recuerde que M crece más deprisa que tf porque el factor medio de degradación también aumenta.',
              'Masa netto anod M = Icm·tf·8760/(u·ε): ładunek oddany w okresie eksploatacji podzielony przez pojemność użyteczną. Nm = M podzielona przez masę netto jednej anody, zaokrąglona w górę. Pułapka: bierz masę netto stopu, a nie brutto z rdzeniem stalowym, i pamiętaj, że M rośnie szybciej niż tf, bo rośnie też średni współczynnik degradacji.') },
          capacity: { title: T('Capacity and utilisation', 'Ємність і використання', 'Kapazität und Ausnutzung', 'Capaciteit en benutting', 'Capacité et utilisation', 'Capacidad y utilización', 'Pojemność i wykorzystanie'),
            body: T('ε is the charge one kilogram of alloy delivers: about 2000 A·h/kg for Al-Zn-In in seawater (DNV-RP-B401), less in hot sediment, and about 780 A·h/kg for zinc. The utilisation factor u is the share consumed before the anode stops working; 0.80 is usual for bracelet anodes. Choosing zinc instead of aluminium multiplies the mass by about 2.6.',
              'ε — заряд, який віддає один кілограм сплаву: близько 2000 А·год/кг для Al-Zn-In у морській воді (DNV-RP-B401), менше в гарячих донних відкладах, і близько 780 А·год/кг для цинку. Коефіцієнт використання u — частка, витрачена до того, як анод перестає працювати; для браслетних анодів зазвичай 0,80. Цинк замість алюмінію збільшує масу приблизно в 2,6 раза.',
              'ε ist die Ladung, die ein Kilogramm Legierung abgibt: etwa 2000 A·h/kg für Al-Zn-In in Meerwasser (DNV-RP-B401), weniger in heißem Sediment, und etwa 780 A·h/kg für Zink. Der Ausnutzungsfaktor u ist der Anteil, der verbraucht wird, bevor die Anode versagt; 0,80 ist für Armbandanoden üblich. Zink statt Aluminium erhöht die Masse etwa um das 2,6-Fache.',
              'ε is de lading die één kilogram legering levert: circa 2000 A·h/kg voor Al-Zn-In in zeewater (DNV-RP-B401), minder in heet sediment, en circa 780 A·h/kg voor zink. De benuttingsfactor u is het deel dat verbruikt wordt voordat de anode ophoudt te werken; 0,80 is gangbaar voor armbandanodes. Zink in plaats van aluminium maakt de massa ongeveer 2,6 keer zo groot.',
              'ε est la charge fournie par un kilogramme d’alliage : environ 2000 A·h/kg pour l’Al-Zn-In en eau de mer (DNV-RP-B401), moins dans les sédiments chauds, et environ 780 A·h/kg pour le zinc. Le facteur d’utilisation u est la part consommée avant que l’anode cesse de fonctionner ; 0,80 est courant pour les anodes bracelets. Le zinc au lieu de l’aluminium multiplie la masse par environ 2,6.',
              'ε es la carga que entrega un kilogramo de aleación: unos 2000 A·h/kg para Al-Zn-In en agua de mar (DNV-RP-B401), menos en sedimento caliente, y unos 780 A·h/kg para el zinc. El factor de utilización u es la fracción consumida antes de que el ánodo deje de funcionar; 0,80 es habitual en ánodos brazalete. El zinc en lugar de aluminio multiplica la masa por unas 2,6 veces.',
              'ε to ładunek oddawany przez kilogram stopu: ok. 2000 A·h/kg dla Al-Zn-In w wodzie morskiej (DNV-RP-B401), mniej w gorących osadach, i ok. 780 A·h/kg dla cynku. Współczynnik wykorzystania u to część zużyta, zanim anoda przestanie działać; dla anod bransoletowych zwykle 0,80. Cynk zamiast aluminium zwiększa masę ok. 2,6 raza.') },
          potential: { title: T('Driving voltage', 'Рушійна напруга', 'Treibspannung', 'Drijvende spanning', 'Tension motrice', 'Tensión impulsora', 'Napięcie napędowe'),
            body: T('The anode pushes current through the electrolyte with ΔE = Ec − Ea, the design protective potential of the steel minus the closed-circuit potential of the anode. With Ec = −0.80 V and Ea = −1.05 V (Ag/AgCl/seawater, Al-Zn-In) ΔE is only 0.25 V, so every ohm of anode resistance matters. Zinc (about −1.03 V) gives slightly less.',
              'Анод проштовхує струм через електроліт напругою ΔE = Ec − Ea — проєктний захисний потенціал сталі мінус робочий потенціал анода. За Ec = −0,80 В та Ea = −1,05 В (Ag/AgCl/морська вода, Al-Zn-In) ΔE становить лише 0,25 В, тож кожен ом опору анода важливий. Цинк (близько −1,03 В) дає трохи менше.',
              'Die Anode treibt den Strom mit ΔE = Ec − Ea durch den Elektrolyten: Schutzpotenzial des Stahls minus Arbeitspotenzial der Anode. Mit Ec = −0,80 V und Ea = −1,05 V (Ag/AgCl/Meerwasser, Al-Zn-In) beträgt ΔE nur 0,25 V, daher zählt jedes Ohm Anodenwiderstand. Zink (etwa −1,03 V) liefert etwas weniger.',
              'De anode drijft de stroom door de elektrolyt met ΔE = Ec − Ea: het beschermingspotentiaal van het staal min het werkpotentiaal van de anode. Met Ec = −0,80 V en Ea = −1,05 V (Ag/AgCl/zeewater, Al-Zn-In) is ΔE maar 0,25 V, dus elke ohm anodeweerstand telt. Zink (circa −1,03 V) geeft iets minder.',
              'L’anode pousse le courant dans l’électrolyte avec ΔE = Ec − Ea, le potentiel de protection de l’acier moins le potentiel en circuit fermé de l’anode. Avec Ec = −0,80 V et Ea = −1,05 V (Ag/AgCl/eau de mer, Al-Zn-In), ΔE ne vaut que 0,25 V : chaque ohm de résistance d’anode compte. Le zinc (environ −1,03 V) donne un peu moins.',
              'El ánodo impulsa la corriente por el electrolito con ΔE = Ec − Ea, el potencial de protección del acero menos el potencial en circuito cerrado del ánodo. Con Ec = −0,80 V y Ea = −1,05 V (Ag/AgCl/agua de mar, Al-Zn-In) ΔE es solo 0,25 V, así que cada ohmio de resistencia del ánodo cuenta. El zinc (unos −1,03 V) da algo menos.',
              'Anoda przepycha prąd przez elektrolit napięciem ΔE = Ec − Ea: projektowy potencjał ochrony stali minus potencjał roboczy anody. Przy Ec = −0,80 V i Ea = −1,05 V (Ag/AgCl/woda morska, Al-Zn-In) ΔE wynosi tylko 0,25 V, więc liczy się każdy om rezystancji anody. Cynk (ok. −1,03 V) daje nieco mniej.') },
          resistivity: { title: T('Environment resistivity', 'Питомий опір середовища', 'Spezifischer Widerstand der Umgebung', 'Resistiviteit van de omgeving', 'Résistivité du milieu', 'Resistividad del entorno', 'Rezystywność środowiska'),
            body: T('Seawater has about 0.3 Ω·m, seabed sediment about 1.3 Ω·m (DNV-RP-F103 uses roughly four times the seawater value), clay and onshore soils 5 Ω·m and more. Anode resistance is proportional to ρ, so a fourfold resistivity cuts the output of each anode to a quarter while the anode mass stays the same.',
              'Морська вода має близько 0,3 Ом·м, донні відклади — близько 1,3 Ом·м (DNV-RP-F103 бере приблизно вчетверо більше за морську воду), глина й ґрунти на суші — 5 Ом·м і більше. Опір анода пропорційний ρ, тож учетверо більший питомий опір знижує віддачу кожного анода до чверті, а маса анодів лишається тією самою.',
              'Meerwasser hat etwa 0,3 Ω·m, Meeresbodensediment etwa 1,3 Ω·m (DNV-RP-F103 setzt rund das Vierfache des Meerwassers an), Ton und Böden an Land 5 Ω·m und mehr. Der Anodenwiderstand ist proportional zu ρ, ein vierfacher spezifischer Widerstand senkt also den Strom jeder Anode auf ein Viertel, während die Anodenmasse gleich bleibt.',
              'Zeewater heeft circa 0,3 Ω·m, zeebodemsediment circa 1,3 Ω·m (DNV-RP-F103 rekent met ongeveer vier keer de zeewaterwaarde), klei en bodems op land 5 Ω·m en meer. De anodeweerstand is evenredig met ρ, dus een vier keer hogere resistiviteit verlaagt de afgifte van elke anode tot een kwart terwijl de anodemassa gelijk blijft.',
              'L’eau de mer fait environ 0,3 Ω·m, les sédiments du fond environ 1,3 Ω·m (DNV-RP-F103 retient à peu près quatre fois la valeur de l’eau de mer), l’argile et les sols à terre 5 Ω·m et plus. La résistance d’anode est proportionnelle à ρ : une résistivité quatre fois plus grande réduit le débit de chaque anode au quart, alors que la masse d’anodes ne change pas.',
              'El agua de mar tiene unos 0,3 Ω·m, el sedimento del fondo unos 1,3 Ω·m (DNV-RP-F103 toma aproximadamente cuatro veces el valor del agua de mar), la arcilla y los suelos en tierra 5 Ω·m o más. La resistencia del ánodo es proporcional a ρ, así que una resistividad cuatro veces mayor reduce la salida de cada ánodo a la cuarta parte mientras la masa de ánodos no cambia.',
              'Woda morska ma ok. 0,3 Ω·m, osady dna ok. 1,3 Ω·m (DNV-RP-F103 przyjmuje mniej więcej czterokrotność wartości dla wody morskiej), glina i grunty lądowe 5 Ω·m i więcej. Rezystancja anody jest proporcjonalna do ρ, więc czterokrotnie większa rezystywność obniża wydajność każdej anody do jednej czwartej, a masa anod się nie zmienia.') },
          resistance: { title: T('Anode resistance and output', 'Опір і струмовіддача анода', 'Anodenwiderstand und -strom', 'Anodeweerstand en -afgifte', 'Résistance et débit de l’anode', 'Resistencia y salida del ánodo', 'Rezystancja i wydajność anody'),
            body: T('For a bracelet anode the McCoy formula Ra = 0.315·ρ/√A uses the exposed anode area A; the output is Ia = (Ec − Ea)/Ra and Nc = Icf/Ia anodes are needed. A larger exposed area lowers Ra only with the square root. Pitfall: the tool keeps the same area at end of life, while a consumed anode is smaller and has a higher resistance.',
              'Для браслетного анода формула McCoy Ra = 0,315·ρ/√A використовує відкриту площу анода A; струмовіддача Ia = (Ec − Ea)/Ra, і потрібно Nc = Icf/Ia анодів. Більша відкрита площа знижує Ra лише пропорційно кореню. Пастка: інструмент лишає ту саму площу наприкінці терміну, а спрацьований анод менший і має більший опір.',
              'Für eine Armbandanode nutzt die McCoy-Formel Ra = 0,315·ρ/√A die freie Anodenfläche A; der Anodenstrom ist Ia = (Ec − Ea)/Ra, nötig sind Nc = Icf/Ia Anoden. Eine größere freie Fläche senkt Ra nur mit der Quadratwurzel. Falle: Das Werkzeug behält am Lebensende dieselbe Fläche bei, eine verbrauchte Anode ist aber kleiner und hat einen höheren Widerstand.',
              'Voor een armbandanode gebruikt de McCoy-formule Ra = 0,315·ρ/√A het vrije anodeoppervlak A; de afgifte is Ia = (Ec − Ea)/Ra en er zijn Nc = Icf/Ia anodes nodig. Een groter vrij oppervlak verlaagt Ra alleen met de vierkantswortel. Valkuil: de tool houdt aan het einde van de levensduur hetzelfde oppervlak aan, terwijl een verbruikte anode kleiner is en een hogere weerstand heeft.',
              'Pour une anode bracelet, la formule de McCoy Ra = 0,315·ρ/√A utilise la surface exposée A ; le débit est Ia = (Ec − Ea)/Ra et il faut Nc = Icf/Ia anodes. Une surface exposée plus grande ne réduit Ra qu’en racine carrée. Piège : l’outil garde la même surface en fin de vie, alors qu’une anode consommée est plus petite et plus résistante.',
              'Para un ánodo brazalete, la fórmula de McCoy Ra = 0,315·ρ/√A usa el área expuesta A; la salida es Ia = (Ec − Ea)/Ra y se necesitan Nc = Icf/Ia ánodos. Un área expuesta mayor reduce Ra solo con la raíz cuadrada. Trampa: la herramienta mantiene la misma área al final de la vida, mientras que un ánodo consumido es menor y tiene más resistencia.',
              'Dla anody bransoletowej wzór McCoya Ra = 0,315·ρ/√A wykorzystuje odsłoniętą powierzchnię anody A; wydajność to Ia = (Ec − Ea)/Ra, a potrzeba Nc = Icf/Ia anod. Większa powierzchnia obniża Ra tylko z pierwiastkiem kwadratowym. Pułapka: narzędzie przyjmuje tę samą powierzchnię na końcu okresu, a zużyta anoda jest mniejsza i ma większą rezystancję.') },
          spacing: { title: T('Anode spacing', 'Відстань між анодами', 'Anodenabstand', 'Anodeafstand', 'Espacement des anodes', 'Separación entre ánodos', 'Rozstaw anod'),
            body: T('Spacing s = L/N. DNV-RP-F103 recommends bracelet anodes at no more than about 300 m, so that the potential between anodes does not attenuate and a lost anode does not leave a long gap. On well-coated or short lines the calculated count is often far below this, and the spacing rule then sets the number of anodes (L/300 m, rounded up).',
              'Відстань s = L/N. DNV-RP-F103 рекомендує ставити браслетні аноди не рідше ніж приблизно через 300 м, щоб потенціал між анодами не затухав і втрата одного анода не залишала довгої прогалини. На добре ізольованих або коротких лініях розрахункова кількість часто набагато менша, і тоді кількість анодів визначає правило відстані (L/300 м з округленням угору).',
              'Abstand s = L/N. DNV-RP-F103 empfiehlt Armbandanoden in höchstens etwa 300 m Abstand, damit das Potenzial zwischen den Anoden nicht abfällt und eine verlorene Anode keine lange Lücke hinterlässt. Bei gut beschichteten oder kurzen Leitungen liegt die berechnete Anzahl oft weit darunter, dann bestimmt die Abstandsregel die Anodenzahl (L/300 m, aufgerundet).',
              'Afstand s = L/N. DNV-RP-F103 beveelt armbandanodes aan op hooguit circa 300 m, zodat het potentiaal tussen de anodes niet wegzakt en een verloren anode geen lang gat achterlaat. Bij goed gecoate of korte leidingen ligt het berekende aantal vaak ver daaronder en bepaalt de afstandsregel het aantal anodes (L/300 m, naar boven afgerond).',
              'Espacement s = L/N. DNV-RP-F103 recommande des anodes bracelets tous les 300 m environ au plus, pour que le potentiel ne s’atténue pas entre les anodes et qu’une anode perdue ne laisse pas une longue lacune. Sur les conduites bien revêtues ou courtes, le nombre calculé est souvent bien inférieur, et c’est alors la règle d’espacement qui fixe le nombre d’anodes (L/300 m, arrondi au supérieur).',
              'Separación s = L/N. DNV-RP-F103 recomienda ánodos brazalete cada 300 m como máximo, aproximadamente, para que el potencial no se atenúe entre ánodos y un ánodo perdido no deje un hueco largo. En tuberías bien revestidas o cortas el número calculado suele quedar muy por debajo, y entonces la regla de separación fija el número de ánodos (L/300 m, redondeado hacia arriba).',
              'Rozstaw s = L/N. DNV-RP-F103 zaleca anody bransoletowe co najwyżej co ok. 300 m, aby potencjał między anodami nie zanikał, a utrata jednej anody nie zostawiała długiej luki. Na dobrze powleczonych lub krótkich rurociągach obliczona liczba jest często znacznie mniejsza i wtedy liczbę anod wyznacza reguła rozstawu (L/300 m, w górę).') }
        },

    function curveData() {
      if (!last || !last.ok) return null;
      var s = {}, k, tf, r, a = [], b = [], m = 1, i;
      for (k in state) if (state.hasOwnProperty(k)) s[k] = state[k];
      for (tf = 5; tf <= 50; tf++) {
        s.tf = tf; r = solve(s);
        if (r && r.ok) { a.push({ x: tf, y: r.Nm }); b.push({ x: tf, y: r.Nc }); m = Math.max(m, r.Nm, r.Nc); }
      }
      m = Math.max(m, last.Nm, last.Nc);
      return { series: [a, b], xMax: 50, yMax: 1.15 * m, xCur: state.tf, cur: [last.Nm, last.Nc] };
    }

          'Grafiek van het benodigde aantal anodes versus de ontwerplevensduur van 5 tot 50 jaar; bij de huidige levensduur van {0} jaar zijn {1} anodes nodig ({2} op massa, {3} op stroom).',
          'Graphique du nombre d’anodes requis en fonction de la durée de vie de 5 à 50 ans ; pour la durée de vie actuelle de {0} ans, {1} anodes sont nécessaires ({2} par la masse, {3} par le courant).',
          'Gráfico del número de ánodos necesarios frente a la vida de diseño de 5 a 50 años; con la vida de diseño actual de {0} años se necesitan {1} ánodos ({2} por masa, {3} por corriente).',
          'Wykres wymaganej liczby anod w funkcji okresu projektowego od 5 do 50 lat; przy obecnym okresie {0} lat potrzeba {1} anod ({2} wg masy, {3} wg prądu).'), [state.tf, last.N, last.Nm, last.Nc]))
          : LG(T('Chart of the required number of anodes versus design life; no valid result.', 'Графік потрібної кількості анодів залежно від проєктного терміну; коректного результату немає.', 'Diagramm der erforderlichen Anodenzahl über der Auslegungsdauer; kein gültiges Ergebnis.', 'Grafiek van het benodigde aantal anodes versus de ontwerplevensduur; geen geldig resultaat.', 'Graphique du nombre d’anodes requis en fonction de la durée de vie ; aucun résultat valide.', 'Gráfico del número de ánodos necesarios frente a la vida de diseño; no hay resultado válido.', 'Wykres wymaganej liczby anod w funkcji okresu projektowego; brak poprawnego wyniku.'));
      },
      render: function (size, st) {
        var c = st.canvas(), g = c.getContext ? c.getContext('2d') : c, W = size.w, H = size.h;
        var cs = getComputedStyle(document.documentElement), muted = cs.getPropertyValue('--muted').trim() || '#888', line = cs.getPropertyValue('--line').trim() || '#ccc', font = cs.getPropertyValue('--font').trim() || 'sans-serif';
        g.clearRect(0, 0, W, H);
        var d = curveData(); if (!d) return;
        var coarse = size.density === 'coarse', L = coarse ? 46 : 58, R = 14, TOP = 12, B = coarse ? 36 : 44, pw = W - L - R, ph = H - TOP - B, i, j, p, v, s;
        function X(x) { return L + x / d.xMax * pw; }
        function Y(y) { return TOP + ph - y / d.yMax * ph; }
        function tv(t) { return typeof t === 'object' ? t.value : t; }
        g.strokeStyle = line; g.lineWidth = 1; g.beginPath(); g.moveTo(L, TOP); g.lineTo(L, TOP + ph); g.lineTo(L + pw, TOP + ph); g.stroke();
        g.fillStyle = muted; g.font = (coarse ? 10 : 11) + 'px ' + font;
        var xt = DiagramUI.ticks(0, d.xMax, pw, size.density), yt = DiagramUI.ticks(0, d.yMax, ph, size.density);
        g.textAlign = 'center'; g.textBaseline = 'top';
        for (i = 0; i < xt.length; i++) { v = tv(xt[i]); p = X(v); g.beginPath(); g.moveTo(p, TOP + ph); g.lineTo(p, TOP + ph + 4); g.stroke(); g.fillText(DiagramUI.fmt(v, { precision: 0 }), p, TOP + ph + 6); }
        g.textAlign = 'right'; g.textBaseline = 'middle';
        for (i = 0; i < yt.length; i++) { v = tv(yt[i]); p = Y(v); g.beginPath(); g.moveTo(L - 4, p); g.lineTo(L, p); g.stroke(); g.fillText(DiagramUI.fmt(v, { precision: 0 }), L - 6, p); }
        g.textAlign = 'center'; g.textBaseline = 'bottom'; g.fillText(LG(T('design life, yr', 'проєктний термін, років', 'Auslegungsdauer, a', 'ontwerplevensduur, jaar', 'durée de vie, ans', 'vida de diseño, años', 'okres projektowy, lata')), L + pw / 2, H - 2);
        g.save(); g.translate(12, TOP + ph / 2); g.rotate(-Math.PI / 2); g.textBaseline = 'middle'; g.fillText(LG(T('anodes', 'аноди', 'Anoden', 'anodes', 'anodes', 'ánodos', 'anody')), 0, 0); g.restore();
        g.save(); g.beginPath(); g.rect(L, TOP, pw, ph); g.clip();
        g.setLineDash([4, 4]); g.strokeStyle = muted; g.beginPath(); g.moveTo(X(d.xCur), TOP); g.lineTo(X(d.xCur), TOP + ph); g.stroke(); g.setLineDash([]);
        for (j = 0; j < d.series.length; j++) {
          s = d.series[j]; if (!s.length) continue;
          g.strokeStyle = DiagramUI.series(j); g.lineWidth = 2; g.beginPath();
          for (i = 0; i < s.length; i++) { if (i) g.lineTo(X(s[i].x), Y(s[i].y)); else g.moveTo(X(s[i].x), Y(s[i].y)); }
          g.stroke();
          g.fillStyle = DiagramUI.series(j); g.beginPath(); g.arc(X(d.xCur), Y(d.cur[j]), coarse ? 3.5 : 4, 0, 2 * Math.PI); g.fill();
        }
        g.restore();
      }
    });
    adoptStage(ui);

    ui.ready();
    window['__cathodic_protection'] = { ui: ui, state: state, solve: solve, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function buildRecord(){
    if (!last) { return null; }
    var IN_KEYS = ['D','Lp','tf','icm','icf','a','b','eps','u','Ec','Ea','rho','anodeMass','anodeArea','level'];
    var IN_UNITS = { D:'m', Lp:'m', tf:'yr', icm:'A/m2', icf:'A/m2', eps:'A.h/kg', Ec:'V', Ea:'V', rho:'ohm.m', anodeMass:'kg', anodeArea:'m2' };
    var OUT = [['Ac','m2'],['fcm','-'],['fcf','-'],['Icm','A'],['Icf','A'],['M','kg'],['Nm','-'],['Nc','-'],['N','-'],['governing','-'],['spacing','m'],['Raf','ohm'],['Iaf','A']];
    var inputs = {}, outputs = {}, units = {}, warnings, i, k;
    for (i = 0; i < IN_KEYS.length; i++) {
      k = IN_KEYS[i];
      inputs[k] = state[k]; units[k] = IN_UNITS.hasOwnProperty(k) ? IN_UNITS[k] : '-';
    }
    if (last.ok) {
      for (i = 0; i < OUT.length; i++) { outputs[OUT[i][0]] = last[OUT[i][0]]; units[OUT[i][0]] = OUT[i][1]; }
      warnings = last.warnings ? last.warnings.slice() : [];
    } else {
      warnings = [last.error];
    }
    return {
      inputs: inputs,
      outputs: outputs,
      units: units,
      model: {
        equations: ['Ac = pi D Lp', 'fcm = a + 0.5 b tf; fcf = a + b tf', 'Icm = Ac fcm icm; Icf = Ac fcf icf', 'M = Icm tf 8760 / (u eps)', 'Ra = 0.315 rho / sqrt(A) (McCoy); Ia = (Ec - Ea)/Ra', 'N = max(ceil(M/m_a), ceil(Icf/Ia))'],
        ranges: ['coated pipeline, galvanic bracelet anodes, DNV-RP-F103 / ISO 15589-2'],
        notes: ['potential attenuation and field joint coating not checked']
      },
      warnings: warnings
    };
  }
  var HANDOFF = {
    provides: ['D'],
    accepts: ['D'],
    build: function(){
      if (!last || !last.ok) { return null; }
      return { quantities: { D: { value: state.D, unit:'m' } } };
    },
    apply: function(payload){
      var q = (payload && payload.quantities) || {};
      var v = q.D ? Number(q.D.value) : NaN;
      if (isFinite(v) && v > 0) { state.D = v; }
      last = solve(state);
      if (ui) { ui.sync(); ui.run(); }
    }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'cathodic_protection',
        file: 'cathodic_protection.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
