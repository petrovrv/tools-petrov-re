{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision":"2026-08-31.2-i18n-pl","id":"xenon","file":"xenon.html","listed":true,"category":"nuclear-eng","order":4,"title":{"en":"Xenon-135 Transient","uk":"Перехідний процес ксенону-135","de":"Xenon-135-Transiente","nl":"Xenon-135-transiënt","fr":"Transitoire du xénon-135","es":"Transitorio del xenón-135","pl":"Przebieg ksenonu-135"},"summary":{"en":"Coupled iodine-135 / xenon-135 dynamics after shutdown. Xenon overshoots as I-135 keeps decaying while burnup stops — the “xenon pit” that can lock out restart (reactor dead time).","uk":"Пов’язана динаміка йоду-135 / ксенону-135 після зупинки. Ксенон перевищує рівновагу, поки йод-135 продовжує розпадатися, а вигоряння припиняється — «ксенонова яма», що може заблокувати перезапуск (мертвий час реактора).","de":"Gekoppelte Iod-135-/Xenon-135-Dynamik nach der Abschaltung. Xenon schwingt über, während Iod-135 weiter zerfällt und der Abbrand stoppt — die „Xenon-Grube“, die den Wiederanlauf sperren kann (Reaktor-Totzeit).","nl":"Gekoppelde jodium-135-/xenon-135-dynamiek na uitschakeling. Xenon schiet door terwijl jodium-135 blijft vervallen en het opbranden stopt — de “xenonput” die het opnieuw opstarten kan blokkeren (dode tijd van de reactor).","fr":"Dynamique couplée iode-135 / xénon-135 après l’arrêt.","es":"Dinámica acoplada yodo-135 / xenón-135 tras la parada.","pl":"Pokazuje przebieg I-135/Xe-135 po wyłączeniu reaktora, szczyt ujemnej reaktywności ksenonowej i wynikający z niego czas blokady ponownego rozruchu."},"description":{"en":"Coupled iodine-135 / xenon-135 dynamics after shutdown. Xenon overshoots as I-135 keeps decaying while burnup stops — the “xenon pit” that can lock out restart (reactor dead time).","uk":"Пов’язана динаміка йоду-135 / ксенону-135 після зупинки. Ксенон перевищує рівновагу, поки йод-135 продовжує розпадатися, а вигоряння припиняється — «ксенонова яма», що може заблокувати перезапуск (мертвий час реактора).","de":"Gekoppelte Iod-135-/Xenon-135-Dynamik nach der Abschaltung. Xenon schwingt über, während Iod-135 weiter zerfällt und der Abbrand stoppt — die „Xenon-Grube“, die den Wiederanlauf sperren kann (Reaktor-Totzeit).","nl":"Gekoppelde jodium-135-/xenon-135-dynamiek na uitschakeling. Xenon schiet door terwijl jodium-135 blijft vervallen en het opbranden stopt — de “xenonput” die het opnieuw opstarten kan blokkeren (dode tijd van de reactor).","fr":"Dynamique couplée iode-135 / xénon-135 après l’arrêt. Le xénon dépasse son équilibre tandis que l’iode-135 continue de se désintégrer et que la consommation cesse — le « puits xénon » qui peut empêcher le redémarrage (temps mort du réacteur).","es":"Dinámica acoplada yodo-135 / xenón-135 tras la parada. El xenón sobrepasa su equilibrio mientras el yodo-135 sigue desintegrándose y cesa el quemado — el «pozo de xenón» que puede impedir el rearranque (tiempo muerto del reactor).","pl":"Interaktywny model skupiony dynamiki jodu-135 i ksenonu-135 po natychmiastowym wyłączeniu reaktora. Zmieniając strumień neutronów przed wyłączeniem oraz dostępny zapas reaktywności można śledzić równowagową i maksymalną wartość reaktywności ksenonowej, czas do maksimum oraz okno martwego czasu."},"status":"benchmarked","independent_validation":false,"validation":{"basis":{"en":"38 benchmark cases driven through the page DOM: the equilibrium iodine and xenon inventories, the post-shutdown transient, the peak time and worth and the dead-time window are compared with an independent python solution of the same coupled I-135/Xe-135 balance (closed form plus a stiff numerical integration of the differential equations) and with published xenon-peak values. The harness is the author's own; no external party has reviewed it.","uk":"38 контрольних випадків, проведених через DOM сторінки: рівноважні запаси йоду та ксенону, перехідний процес після зупинки, час і величина піку та вікно йодної ями порівняно з незалежним розв'язком того самого зв'язаного балансу I-135/Xe-135 у python (замкнена форма плюс чисельне інтегрування жорсткої системи) та з опублікованими значеннями ксенонового піку. Випробувальний стенд належить авторові; сторонньої перевірки не проводилося.","de":"38 Prüffälle über das Seiten-DOM: die Gleichgewichtsinventare von Iod und Xenon, der Verlauf nach der Abschaltung, Zeitpunkt und Höhe des Maximums sowie das Totzeitfenster werden mit einer unabhängigen python-Lösung derselben gekoppelten I-135/Xe-135-Bilanz (geschlossene Form plus steife numerische Integration) und mit veröffentlichten Xenon-Spitzenwerten verglichen. Der Prüfstand stammt vom Autor selbst; eine Prüfung durch Dritte fand nicht statt.","nl":"38 testgevallen via de DOM van de pagina: de evenwichtsvoorraden jodium en xenon, het verloop na afschakeling, het tijdstip en de hoogte van de piek en het dodetijdvenster worden vergeleken met een onafhankelijke python-oplossing van dezelfde gekoppelde I-135/Xe-135-balans (gesloten vorm plus stijve numerieke integratie) en met gepubliceerde xenonpiekwaarden. De testbank is van de auteur zelf; er is geen review door derden.","fr":"38 cas de test pilotés via le DOM de la page : les inventaires d'équilibre d'iode et de xénon, le transitoire après arrêt, l'instant et l'amplitude du pic et la fenêtre de temps mort sont comparés à une solution python indépendante du même bilan couplé I-135/Xe-135 (forme close et intégration numérique raide) ainsi qu'à des valeurs de pic xénon publiées. Le banc d'essai est celui de l'auteur ; aucune revue externe n'a eu lieu.","es":"38 casos de prueba ejecutados a través del DOM de la página: los inventarios de equilibrio de yodo y xenón, el transitorio tras la parada, el instante y la magnitud del pico y la ventana de tiempo muerto se comparan con una solución independiente en python del mismo balance acoplado I-135/Xe-135 (forma cerrada e integración numérica rígida) y con valores publicados del pico de xenón. El banco de pruebas es del propio autor; no ha habido revisión externa.","pl":"38 przypadków testowych przeprowadzonych na stronie DOM: stany równowagi jodu i ksenonu, stan przejściowy po wyłączeniu, czas szczytowy i wartość szczytowa oraz okno czasu martwego porównano z niezależnym rozwiązaniem w Pythonie tego samego sprzężonego bilansu I-135/Xe-135 (forma zamknięta plus sztywne całkowanie numeryczne równań różniczkowych) oraz z opublikowanymi wartościami szczytowymi ksenonu. Zestaw testowy jest własnością autora; nie był recenzowany przez żadną stronę zewnętrzną."},"independent_validation":false,"benchmarks":[{"id":"iodine-xenon-closed-form","reference":"Own python solution of the coupled I-135/Xe-135 equations after shutdown using the constants read out of the tool (lambda_I 2.926e-5 1/s, lambda_Xe 2.106e-5 1/s, gamma_I 0.0639, gamma_Xe 0.00237, sigma_a^Xe 2.65e-18 cm2, Sigma_f 0.0616 1/cm, nu 2.43).  Two structurally different routes: (1) the closed-form two-exponential solution with the peak located by brentq on dX/dt and the dead-time edges by brentq on |rho|-margin; (2) a direct numerical integration (scipy solve_ivp, LSODA, rtol 1e-12) with the peak located by bounded minimisation of the dense output.  The two routes agree to 1.2e-7 in peak time and 1.8e-12 in peak reactivity. Fresh 2026-08-31 revalidation parses the constants from this HTML and independently recomputes all 38 accepted cases in Python; 38/38 passed.","citations":["J.R. Lamarsh and A.J. Baratta, \"Introduction to Nuclear Engineering\", 3rd ed., Sec. 8.4 \"Fission product poisoning\" - I-135/Xe-135 balance equations, equilibrium xenon and the post-shutdown xenon peak.","J.J. Duderstadt and L.J. Hamilton, \"Nuclear Reactor Analysis\", Wiley (1976), Sec. 15-2 (xenon poisoning, dead time).","US DOE Fundamentals Handbook, Nuclear Physics and Reactor Theory (DOE-HDBK-1019/2-93), Module 3 - xenon-135 peak ~10-11 h after shutdown and the xenon dead time."],"cases":38,"passed":38,"tolerance":"reactivities 0.5 pcm (the tool prints integer pcm); peak time 0.0064 h and dead time 0.0128 h (2 printed decimals plus the 5 s RK4 grid on which the tool locates them).","run_at":"2026-10-04T11:44:39Z","artifact":"benchmarks/xenon.json"}]},"limitations":{"en":"Lumped iodine–xenon inventory with fixed or simplified parameters; spatial xenon oscillations, detailed depletion and thermal-hydraulic feedback are excluded. The reactor is assumed to run at a constant flux until an instantaneous shutdown to zero flux, so the post-shutdown behaviour is the closed-form two-exponential solution; the peak and the dead-time edges are solved on that expression and are therefore not limited to the 72 h window that is plotted, but a dead time that runs past it is only labelled, not drawn. With a zero reactivity margin the dead time is unbounded, because the xenon worth decays towards zero without ever reaching it.","uk":"Зосереджена модель запасу йоду–ксенону зі сталими або спрощеними параметрами; просторові коливання ксенону, детальне вигоряння та теплогідравлічні зворотні зв’язки не враховано. Припускається робота за сталого потоку до миттєвої зупинки з нульовим потоком, тож поведінка після зупинки — це замкнений двоекспоненційний розв’язок; пік і межі мертвого часу знаходяться саме з цього виразу й тому не обмежені показаним 72-годинним вікном, але мертвий час, що виходить за нього, лише позначається підписом, а не малюється. За нульового запасу реактивності мертвий час необмежений, бо вага ксенону прямує до нуля, ніколи його не досягаючи.","de":"Punktförmiges Iod-Xenon-Inventar mit festen oder vereinfachten Parametern; räumliche Xenonschwingungen, detaillierter Abbrand und thermohydraulische Rückkopplung fehlen. Angenommen wird konstanter Fluss bis zur sofortigen Abschaltung auf null, sodass das Verhalten nach der Abschaltung die geschlossene Zwei-Exponential-Lösung ist; Maximum und Totzeitgrenzen werden aus diesem Ausdruck bestimmt und sind daher nicht auf das dargestellte 72-h-Fenster begrenzt — eine darüber hinausreichende Totzeit wird jedoch nur beschriftet, nicht gezeichnet. Bei null Reaktivitätsreserve ist die Totzeit unbegrenzt, da der Xenonwert gegen null strebt, ohne ihn zu erreichen.","nl":"Geconcentreerd jodium-xenonmodel met vaste of vereenvoudigde parameters; ruimtelijke xenonoscillaties, gedetailleerde opbrand en thermohydraulische terugkoppeling ontbreken. Aangenomen wordt een constante flux tot een ogenblikkelijke uitschakeling naar nul, zodat het gedrag na uitschakeling de gesloten twee-exponentiële oplossing is; de piek en de randen van de dode tijd worden uit die uitdrukking opgelost en zijn dus niet beperkt tot het getoonde venster van 72 h, maar een dode tijd die daarbuiten valt wordt alleen benoemd, niet getekend. Bij een nulmarge is de dode tijd onbegrensd, omdat de xenonwaarde naar nul daalt zonder die te bereiken.","fr":"Inventaire iode–xénon global à paramètres fixes ou simplifiés; oscillations spatiales du xénon, épuisement détaillé et rétroactions thermohydrauliques exclus. On suppose un flux constant jusqu’à un arrêt instantané à flux nul, de sorte que le comportement après l’arrêt est la solution fermée à deux exponentielles; le pic et les bornes du temps mort sont résolus sur cette expression et ne sont donc pas limités à la fenêtre de 72 h tracée, mais un temps mort qui la dépasse est seulement signalé, non tracé. Avec une marge de réactivité nulle, le temps mort est non borné, car le poids du xénon tend vers zéro sans jamais l’atteindre.","es":"Inventario concentrado yodo–xenón con parámetros fijos o simplificados; excluye oscilaciones espaciales, agotamiento detallado y realimentación termohidráulica. Se supone flujo constante hasta una parada instantánea a flujo nulo, por lo que el comportamiento posterior es la solución cerrada de dos exponenciales; el pico y los bordes del tiempo muerto se resuelven sobre esa expresión y no están limitados a la ventana de 72 h representada, aunque un tiempo muerto que la supere solo se indica, no se dibuja. Con margen de reactividad nulo el tiempo muerto no está acotado, porque el peso del xenón decae hacia cero sin alcanzarlo.","pl":"Skupiony model zapasu jodu i ksenonu ze stałymi lub uproszczonymi parametrami; nie obejmuje przestrzennych oscylacji ksenonu, szczegółowego wypalania ani sprzężeń cieplno-hydraulicznych. Zakłada stały strumień przed natychmiastowym wyłączeniem do zera."},"intended_use":["education","technical exploration","preliminary assessment"],"catalog_languages":["en","uk","de","nl","fr","es","pl"],"tool_languages":["en","uk","de","nl","fr","es","pl"],"dependencies":[],"network_access":{"mode":"none"},"report":{"pdf":true,"source_attribution":true},"python_export":{"supported":true,"requires":[]},"handoff":{"provides":["rho_reac"],"accepts":[]},"state_codec":{"permalink":true,"record":"tools.petrov.re/calculation-record/v1"},"ui":{"framework":"tools.petrov.re/ui/v1","level":3}}
</script>

<script>
(function(){
  "use strict";
  // ---- constants (SI-ish, cm, s) ----
  var lambdaI = 2.926e-5;   // s^-1
  var lambdaX = 2.106e-5;   // s^-1
  var gammaI  = 0.0639;
  var gammaX  = 0.00237;
  var sigmaaX = 2.65e-18;   // cm^2
  var Sigmaf  = 0.0616;     // cm^-1
  var nu      = 2.43;

  var HR = 3600;
  var T_END = 72*HR;
  var DT = 5;               // s, RK4 step
  var N  = Math.floor(T_END/DT);

  /* the two sliders, unchanged: min / max / step of the controls this page has
     always shipped.  PHI0 is the value the browser actually gives the slider on
     load — the markup said 13.477, but with min 11 and step 0.01 the range
     control snaps it to 13.48, and 13.48 is therefore the deployed default. */
  var PHI_MIN=11, PHI_MAX=14, PHI_STEP=0.01, PHI0=13.48;
  var MAR_MIN=0, MAR_MAX=8000, MAR_STEP=50, MAR0=3000;

  var DEFAULTS = { phi: PHI0, margin: MAR0, view: 'rho' };
  var state = { phi: DEFAULTS.phi, margin: DEFAULTS.margin, view: DEFAULTS.view };
  var ui = null, stage = null, bareRender = null, legendHost = null;

  // ---- simulation ----
  // After shutdown phi = 0, so the I/Xe system decouples and is solved in closed form:
  //   I(t) = Ieq e^{-lI t}
  //   X(t) = (Xeq + K) e^{-lX t} - K e^{-lI t},   K = lI Ieq/(lI - lX)
  // Everything below (curve, peak, dead-time edges) comes from that expression, so no
  // result is limited to a time grid or to the 72 h window that is plotted.
  var rhoOf=function(x){ return -sigmaaX*x/(nu*Sigmaf)*1e5; };   // pcm (negative)
  function solution(phi0){
    var Ieq = gammaI*Sigmaf*phi0/lambdaI;
    var Xeq = (gammaX+gammaI)*Sigmaf*phi0/(lambdaX+sigmaaX*phi0);
    var K = lambdaI*Ieq/(lambdaI-lambdaX);
    var A = Xeq + K;
    // dX/dt = 0  =>  t = ln[(lI Ieq + lX K)/(lX A)]/(lI - lX); t <= 0 means the xenon
    // decays monotonically from equilibrium (no peak) - the low-flux regime.
    var tp = Math.log((lambdaI*Ieq + lambdaX*K)/(lambdaX*A))/(lambdaI-lambdaX);
    return {Ieq:Ieq, Xeq:Xeq, A:A, K:K, tPeak: tp>0 ? tp : 0,
            X:function(t){ return A*Math.exp(-lambdaX*t) - K*Math.exp(-lambdaI*t); }};
  }
  function simulate(phi0){
    var sol = solution(phi0);
    var xs=new Float64Array(N+1), rs=new Float64Array(N+1), cs=new Float64Array(N+1);
    for(var k=0;k<=N;k++){
      var X = sol.X(k*DT);
      xs[k]=k*DT/HR; cs[k]=X/sol.Xeq; rs[k]=rhoOf(X);
    }
    var Xpk = sol.X(sol.tPeak);
    return {xs:xs,rs:rs,cs:cs,Xeq:sol.Xeq,Ieq:sol.Ieq,sol:sol,
            rhoEq:rhoOf(sol.Xeq), peakRho:rhoOf(Xpk), peakRhoAbs:Math.abs(rhoOf(Xpk)),
            tPeak:sol.tPeak/HR, peakConc:Xpk/sol.Xeq};
  }

  // Dead time: the window in which |rho_Xe(t)| exceeds the available margin.  The edges
  // are the roots of X(t) = Xm solved on the closed-form solution, NOT the first/last
  // point of a 72 h grid: the recovery can easily fall outside that window and reporting
  // the horizon as if it were the answer under-states a restart lockout.
  function deadTime(sim,margin){
    var sol=sim.sol;
    var tPk=sol.tPeak;
    if(!(margin>0)){
      // |rho| > 0 for all t: the reactor never formally clears the (zero) margin
      return {t0:0, t1:Infinity, dur:Infinity, unbounded:true};
    }
    var Xm = margin*nu*Sigmaf/(sigmaaX*1e5);
    if(sol.X(tPk) <= Xm) return null;
    var f=function(t){ return sol.X(t)-Xm; };
    var bis=function(a,b){ var fa=f(a);
      for(var i=0;i<200 && (b-a)>1e-6;i++){
        var m=0.5*(a+b), fm=f(m);
        if((fm<0)===(fa<0)){ a=m; fa=fm; } else { b=m; }
      }
      return 0.5*(a+b); };
    var t0 = sol.Xeq>Xm ? 0 : bis(0,tPk);
    // X(t) <= A e^{-lX t}, so the solution of A e^{-lX t} = Xm brackets the upper root
    var tHi = Math.log(sol.A/Xm)/lambdaX;
    if(!(tHi>tPk)) tHi = tPk + HR;
    var t1 = bis(tPk, tHi);
    return {t0:t0/HR, t1:t1/HR, dur:(t1-t0)/HR, unbounded:false};
  }

  /* the one impure step the old draw() did inline: read the controls, run the
     model.  Now it takes the state object instead of the DOM, and nothing else
     in the model touches the document. */
  function solveAll(s){
    var phi0=Math.pow(10, parseFloat(s.phi));
    var margin=parseFloat(s.margin);
    var sim=simulate(phi0);
    return {phi0:phi0, margin:margin, sim:sim, dt:deadTime(sim,margin)};
  }
  var LAST=null;

  var I18N={
    en:{

    if(o==null) return '';

    l=l||curLang();
    return o[l]!=null?o[l]:(o.en!=null?o.en:'');
  }

  function KP(key){ var o={}; SITE_LANGS.forEach(function(l){ o[l]=plain((I18N[l]||I18N.en)[key]); }); return o; }
  function plain(html){
    var d=document.createElement('div'); d.innerHTML=String(html==null?'':html);
    return (d.textContent||'').replace(/\s+/g,' ').trim();
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function t(key,vars){
    var d=I18N[curLang()]||I18N.en;
    var s=(d[key]!=null)?d[key]:((I18N.en[key]!=null)?I18N.en[key]:key);
    if(vars){ s=s.replace(/\{(\w+)\}/g,function(m,k){return (vars[k]!=null)?vars[k]:m;}); }

     always been en-US grouped, in every language, and the port does not get to

  function fmt(x,d){ if(!isFinite(x)) return '–';
    return x.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
  function fmtPhi(p){ // scientific
    var e=Math.floor(Math.log10(p)); var m=p/Math.pow(10,e);
    return m.toFixed(2)+'e'+e;
  }
  function fmtSci(x,d){
    if(!isFinite(x)||x===0) return fmt(x,d==null?2:d);

  /* ------------------------------------------------------------------ drawing */
  /* Every number, every line and every annotation is the one the page has always
     drawn.  What changed is that the size comes from the stage (UI spec §10)
     instead of cssW*0.52, the colours come from the token layer instead of six
     hard-coded hex values, and below md the tick count drops. */
  function drawPlot(ctx,W,H,density,c,view,lang){
    var sim=c.sim, dt=c.dt, margin=c.margin;
    var coarse = density==='coarse';
    var ink=cssVar('--ink','#0f172a'), muted=cssVar('--muted','#64748b'),
        grid=cssVar('--line','#e2e8f0'), accent=cssVar('--accent','#2563eb'),
        eqcol=cssVar('--ok','#0891b2'), warncol=cssVar('--bad','#dc2626'),
        font=cssVar('--font','system-ui,sans-serif'),
        mono=cssVar('--font-mono','ui-monospace,Menlo,monospace'),
        fsSmall=cssVar('--fs-small','12px'), fsMicro=cssVar('--fs-micro','11px');

    ctx.clearRect(0,0,W,H);

    /* below md the rotated y-axis title and the tick labels collide inside a
       46px gutter, so the title goes horizontal above the plot instead — the
       "reduce the annotations, never the label size" rule of UI spec §10. */
    var padL = coarse?46:64, padR = coarse?14:64, padT = coarse?28:18, padB = coarse?36:42;
    var plotW=W-padL-padR, plotH=H-padT-padB;
    if(plotW<10||plotH<10) return;
    var xMax=72;

    var isRho = (view==='rho');
    var yMax, yMin, yLabel, series;
    if(isRho){
      // reactivity: plot magnitude in pcm (0 at top going down negative). Use |rho|.
      yMax = Math.max(sim.peakRhoAbs*1.15, margin*1.15, 100);
      yMin = 0;
      yLabel=t('yLabelRho');
      series=sim.rs;
    } else {
      yMax = Math.max(sim.peakConc*1.15, 1.15);
      yMin = 0;
      yLabel=t('yLabelConc');
      series=sim.cs;
    }

    function X2px(h){return padL + h/xMax*plotW;}
    function Y2px(v){return padT + (1-(v-yMin)/(yMax-yMin))*plotH;}

    // dead-time shading (only in rho view); the window may run past the plotted horizon
    if(isRho && dt){
      var sh0=Math.min(dt.t0,xMax), sh1=Math.min(dt.t1,xMax);
      ctx.save(); ctx.globalAlpha=0.10; ctx.fillStyle=warncol;
      ctx.fillRect(X2px(sh0),padT, X2px(sh1)-X2px(sh0), plotH);
      ctx.restore();
    }

    // grid
    ctx.strokeStyle=grid; ctx.lineWidth=1;
    ctx.fillStyle=muted;
    ctx.font='400 '+fsSmall+' '+mono;
    ctx.textAlign='right'; ctx.textBaseline='middle';
    var yTicks = coarse?4:6;
    for(var i=0;i<=yTicks;i++){
      var v=yMin+(yMax-yMin)*i/yTicks;
      var py=Y2px(v);
      ctx.beginPath();ctx.moveTo(padL,py);ctx.lineTo(padL+plotW,py);ctx.stroke();
      ctx.fillText(isRho?fmt(v,0):fmt(v,2), padL-8, py);
    }
    ctx.textAlign='center'; ctx.textBaseline='top';
    var xStep = coarse?24:12;
    for(var xh=0;xh<=xMax;xh+=xStep){
      var px=X2px(xh);
      ctx.strokeStyle=grid;
      ctx.beginPath();ctx.moveTo(px,padT);ctx.lineTo(px,padT+plotH);ctx.stroke();
      ctx.fillStyle=muted;
      ctx.fillText(xh, px, padT+plotH+8);
    }

    // axis titles
    ctx.fillStyle=ink;
    ctx.font='400 '+fsSmall+' '+font;
    ctx.textAlign='center';ctx.textBaseline='alphabetic';
    ctx.fillText(t('xAxis'), padL+plotW/2, H-6);
    if(coarse){
      ctx.textAlign='left';ctx.textBaseline='alphabetic';
      ctx.fillText(yLabel,2,12);
    } else {
      ctx.save();
      ctx.translate(16,padT+plotH/2);ctx.rotate(-Math.PI/2);
      ctx.textAlign='center';
      ctx.fillText(yLabel,0,0);
      ctx.restore();
    }

    // equilibrium reference line
    var eqVal = isRho ? Math.abs(sim.rhoEq) : 1;
    ctx.strokeStyle=eqcol; ctx.lineWidth=1.5;
    ctx.setLineDash([5,4]);
    ctx.beginPath();ctx.moveTo(padL,Y2px(eqVal));ctx.lineTo(padL+plotW,Y2px(eqVal));ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=eqcol;ctx.font='400 '+fsMicro+' '+mono;
    ctx.textAlign='left';ctx.textBaseline='bottom';
    ctx.fillText(t('annEquilibrium'), padL+6, Y2px(eqVal)-3);

    // margin line (rho view)
    if(isRho){
      ctx.strokeStyle=warncol; ctx.lineWidth=1.5; ctx.setLineDash([6,4]);
      var my=Y2px(margin);
      ctx.beginPath();ctx.moveTo(padL,my);ctx.lineTo(padL+plotW,my);ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle=warncol;ctx.textAlign='right';ctx.textBaseline='bottom';
      ctx.fillText(t('annMargin'), padL+plotW-4, my-3);
    }

    // curve + fill
    ctx.beginPath();
    for(var k=0;k<series.length;k++){
      var vv = isRho ? Math.abs(series[k]) : series[k];
      var px2=X2px(sim.xs[k]), py2=Y2px(vv);
      if(k===0)ctx.moveTo(px2,py2);else ctx.lineTo(px2,py2);
    }
    // fill down to baseline
    ctx.lineTo(X2px(xMax),Y2px(yMin));
    ctx.lineTo(X2px(0),Y2px(yMin));
    ctx.closePath();
    ctx.save(); ctx.globalAlpha=0.10; ctx.fillStyle=accent; ctx.fill(); ctx.restore();

    ctx.beginPath();
    for(var k2=0;k2<series.length;k2++){
      var vv2 = isRho ? Math.abs(series[k2]) : series[k2];
      var px3=X2px(sim.xs[k2]), py3=Y2px(vv2);
      if(k2===0)ctx.moveTo(px3,py3);else ctx.lineTo(px3,py3);
    }
    ctx.strokeStyle=accent;ctx.lineWidth=2;ctx.lineJoin='round';ctx.stroke();

    // peak marker
    var pkVal = isRho ? sim.peakRhoAbs : sim.peakConc;
    var pkX=X2px(sim.tPeak), pkY=Y2px(pkVal);
    ctx.fillStyle=warncol;
    ctx.beginPath();ctx.arc(pkX,pkY,4,0,2*Math.PI);ctx.fill();
    ctx.strokeStyle=warncol;ctx.lineWidth=1;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(pkX,pkY);ctx.lineTo(pkX,padT+plotH);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=ink;ctx.font='400 '+fsMicro+' '+mono;
    ctx.textAlign='center';ctx.textBaseline='bottom';
    var lab = t('peakLabel',{val:(isRho?fmt(sim.peakRho,0)+' pcm':fmt(sim.peakConc,2)+'×'), t:fmt(sim.tPeak,1)});
    var half = coarse?55:70;
    ctx.fillText(lab, Math.min(Math.max(pkX,padL+half),padL+plotW-half), pkY-8);
  }

  function legendHTML(view){
    var isRho = view==='rho';
    var out=[];
    function leg(colour,cls,txt){
      out.push('<span><span class="xe-sw '+cls+'" style="background:'+colour+'"></span>'+txt+'</span>');
    }
    leg('var(--accent)','',isRho?t('legRhoWorth'):t('legConc'));
    leg('var(--ok)','',t('legEquilibrium'));
    leg('var(--bad)','dot',t('legPeak'));
    if(isRho){
      leg('var(--bad)','',t('legMargin'));
      leg('var(--bad)','wash',t('legDead'));
    }
    return out.join('');
  }

  /* ------------------------------------------------------------------ results */
  function deadText(c){
    if(!c.dt) return {value:t('noDeadTime'), unit:null, hint:null};
    if(c.dt.unbounded) return {value:t('deadUnbounded'), unit:null, hint:null};
    return {value:fmt(c.dt.dur,2), unit:'h',
            hint:(c.dt.t1>T_END/HR)?t('deadBeyond'):null};
  }
  function computeResults(s){
    LAST = solveAll(s);
    var c=LAST, sim=c.sim, dd=deadText(c);
    if(stage) stage.schedule();
    var tone = !c.dt ? 'ok' : (c.dt.unbounded ? 'warn' : 'bad');
    var verdictText = !c.dt ? pick(S.okRestart) : (c.dt.unbounded ? xT('wZero') : xT('wDead'));
    var rows=[
      [pick(S.rIeq), fmtSci(sim.Ieq,3)+' 1/cm³'],
      [pick(S.rXeq), fmtSci(sim.Xeq,3)+' 1/cm³'],
      [pick(S.rRatio), fmt(sim.peakConc,3)+' ×'],
      [pick(S.rT0), c.dt ? fmt(c.dt.t0,2)+' h' : pick(S.dash)],
      [pick(S.rT1), (c.dt && isFinite(c.dt.t1)) ? fmt(c.dt.t1,2)+' h' : pick(S.dash)]
    ];
    return {
      verdict:{ tone:tone, text:verdictText },
      tiles:[
        { label:KP('roEq'),  value:fmt(sim.rhoEq,0),  unit:'pcm', learn:'equilibrium' },
        { label:KP('roPk'),  value:fmt(sim.peakRho,0),unit:'pcm', learn:'peak',
          tone: c.dt && !c.dt.unbounded ? 'bad' : null },
        { label:KP('roTpk'), value:fmt(sim.tPeak,2),  unit:'h',   learn:'peak', headline:false },
        { label:KP('roDead'),value:dd.value, unit:dd.unit, hint:dd.hint, learn:'deadtime',
          tone: tone==='ok' ? 'ok' : (tone==='warn'?'warn':'bad') }
      ],
      tables:[{ title:S.tabTitle, head:[S.tabQty,S.tabVal], rows:rows }]
    };
  }
  function a11yText(){
    if(!LAST) return '';
    return fill(pick(S.a11y),{p:fmt(LAST.sim.peakRho,0),t:fmt(LAST.sim.tPeak,2),
      e:fmt(LAST.sim.rhoEq,0)});
  }

  /* ------------------------------------------------------------- shell wiring */
  /* UPSTREAM: App.reset() and App.example() replace app.state with a fresh
     object, orphaning the one this file holds — the object serialize(), record()
     and the handoff write through. Adopt the values instead and point the app
     back at the original object. */
  function adopt(fresh,app){
    Object.keys(fresh).forEach(function(k){ state[k]=fresh[k]; });
    app.state = state;
    return state;
  }
  /* UPSTREAM: Field.prototype.commit sets the "clamped" note and clearError()
     wipes it three lines later, so a clamped value is written back but never
     announced (spec §6, UI_AUDIT S-9). Announce it on the one surface the site
     has. Capture phase, because the framework's own handler runs first. */
  function announceClamp(app,sel,lo,hi,tpl,dp){
    var el=app.regions.inputs.querySelector(sel);
    if(!el) return;
    var said=null;
    el.addEventListener('change',function(){
      var raw=parseFloat(el.value);
      if(!isFinite(raw)||(raw>=lo&&raw<=hi)){ said=null; return; }
      if(raw===said) return;
      said=raw;
      app.notify(fill(pick(tpl,app.lang),
        {v:raw, c:Math.min(hi,Math.max(lo,raw)).toFixed(dp)}),{kind:'warn'});
    },true);
  }
  /* UPSTREAM: Field.prototype.buildControl writes step onto a number input and
     min only when minDisplay is given, so a field declaring min/max loses the
     browser's own range semantics — spinner bounds, the mobile keypad hint and
     :invalid styling. The old range controls had all of that natively. */
  function nativeRange(app,sel,lo,hi){
    var el=app.regions.inputs.querySelector(sel);
    if(el){ el.min=String(lo); el.max=String(hi); }
  }
  /* UPSTREAM: Field.prototype.syncControl refuses to write into a focused
     control, so after a clamped or unparsable entry the box keeps showing a
     number the tool did not use (the beam_diagrams defect, UI_AUDIT S-9). */
  function settleOnBlur(app,sel){
    var el=app.regions.inputs.querySelector(sel);
    if(!el) return;
    el.addEventListener('blur',function(){
      var field=null;
      app.panels.forEach(function(p){
        (p.fields||[]).forEach(function(f){ if(f.control===el) field=f; });
      });
      if(field) field.clearError();
      app.sync(); app.run();
    });
  }

  function buildInputs(app){
    app.examples([
      { label:S.exFull, note:S.exFullN, state:{phi:PHI0, margin:MAR0, view:state.view},
        apply:function(f,a){ adopt(f,a); } },
      { label:S.exHigh, note:S.exHighN, state:{phi:14, margin:MAR0, view:state.view},
        apply:function(f,a){ adopt(f,a); } },
      { label:S.exLow,  note:S.exLowN,  state:{phi:12, margin:250, view:state.view},
        apply:function(f,a){ adopt(f,a); } },
      { label:S.exZero, note:S.exZeroN, state:{phi:PHI0, margin:0, view:state.view},
        apply:function(f,a){ adopt(f,a); } }
    ]);
    app.panel({
      slot:'inputs', id:'flux', title:S.pFlux, learn:'flux',
      fields:[
        { id:'f-phi', key:'phi', type:'number', unit:'log₁₀',
          min:PHI_MIN, max:PHI_MAX, step:PHI_STEP, required:true,
          label:KP('phiLabel'), hint:S.fluxHint, learn:'flux',
          validate:function(v){ return (typeof v==='number'&&isFinite(v))?true:pick(S.badNum); } },
        { id:'f-phi-r', key:'phi', type:'range', unit:'log₁₀',
          min:PHI_MIN, max:PHI_MAX, step:PHI_STEP, label:KP('phiLabel') },
        { id:'f-phi0', type:'readonly', unit:'n/cm²/s', label:S.fluxValue, learn:'flux',
          get:function(st){ return fmtPhi(Math.pow(10,parseFloat(st.phi))); } }
      ]
    });
    app.panel({
      slot:'inputs', id:'restart', title:S.pRestart, learn:'margin',
      fields:[
        { id:'f-margin', key:'margin', type:'number', unit:'pcm',
          min:MAR_MIN, max:MAR_MAX, step:MAR_STEP, required:true,
          label:KP('marginLabel'), hint:S.marginHint, learn:'margin',
          validate:function(v){ return (typeof v==='number'&&isFinite(v))?true:pick(S.badNum); } },
        { id:'f-margin-r', key:'margin', type:'range', unit:'pcm',
          min:MAR_MIN, max:MAR_MAX, step:MAR_STEP, label:KP('marginLabel') }
      ]
    });
    /* no panel title: the field label is already "Display", exactly as the
       page has always shown it, and two headings for one control is noise */
    app.panel({
      slot:'inputs', id:'display',
      fields:[
        { id:'f-view', key:'view', type:'segmented', label:KP('displayLabel'), learn:'display',
          options:[['rho',KP('toggleRho')],['conc',KP('toggleConc')]] }
      ]
    });
    announceClamp(app,'#f-phi-c',PHI_MIN,PHI_MAX,S.clampPhi,2);
    announceClamp(app,'#f-margin-c',MAR_MIN,MAR_MAX,S.clampMar,0);
    nativeRange(app,'#f-phi-c',PHI_MIN,PHI_MAX);
    nativeRange(app,'#f-margin-c',MAR_MIN,MAR_MAX);
    settleOnBlur(app,'#f-phi-c');
    settleOnBlur(app,'#f-margin-c');
    app.panel({
      slot:'inputs', id:'dgu-reset-row',
      render:function(box){
        var row=document.createElement('div');
        row.className='dgu-panel-actions';
        row.appendChild(app.actionButton(app.resetAction()));
        box.appendChild(row);
      }
    });
  }

  function buildStage(app){
    stage = app.stage({
      minHeight: 300,
      caption: S.stageCap,
      a11y: a11yText,
      /* The page used to size the canvas as cssW*0.52, which leaves ~185px of
         plot at 390px — the audit's S-13 collision. Keep that proportion where
         it reads well and clamp it at both ends, so the drawing never gets
         shorter than 280px or taller than 460px whatever the column does. */
      resize: function(size,st){
        var want=Math.round(Math.min(460,Math.max(280,size.w*0.52)));
        if(st.body.style.minHeight!==want+'px') st.body.style.minHeight=want+'px';
      },
      render: function(size,st){
        var c = LAST || solveAll(state);
        drawPlot(st.canvas(), size.w, size.h, size.density, c, state.view, app.lang);
        if(legendHost) legendHost.innerHTML = legendHTML(state.view);
      }
    });
    legendHost=document.createElement('div');
    legendHost.className='xe-legend';
    legendHost.innerHTML=legendHTML(state.view);
    /* above the caption, which names the sign convention for the whole stage */
    var cap=stage.node.querySelector('.dgu-stage-cap');
    if(cap) stage.node.insertBefore(legendHost,cap); else stage.node.appendChild(legendHost);
    stage.node.setAttribute('data-learn-topic','pit');
  }

  function buildFooter(host,app){
    var d=document.createElement('details');
    d.innerHTML='<summary>'+esc(pick(S.footSum,app.lang))+'</summary>'+
      '<p>'+(I18N[app.lang]||I18N.en).note+'</p>';
    host.appendChild(d);
  }

  /* --------------------------------------------------------------------- boot */
  function detectLang(){
    if(I18N[window.__diagramLang]) return window.__diagramLang;
    try{ var q=new URLSearchParams(location.search).get('lang');
      if(q&&I18N[String(q).slice(0,2).toLowerCase()]) return String(q).slice(0,2).toLowerCase(); }catch(e){}
    try{ var x=localStorage.getItem('diagram_lang'); if(I18N[x]) return x; }catch(e){}
    var langs=navigator.languages||[navigator.language||'en'];
    for(var i=0;i<langs.length;i++){
      var p=String(langs[i]).toLowerCase().split('-')[0];
      if(I18N[p]) return p;
    }
    return 'en';
  }

  function boot(){
    LANG=detectLang();
    document.title=(I18N[LANG]||I18N.en).title;
    if(!window.DiagramUI || window.DiagramUI.api!=='tools.petrov.re/ui/v1'){ bootBare(); dgcInit(); return; }
    try{ bootUI(); }
    catch(e){
      /* the shell threw — a framework regression or a stale cached copy. Fall
         back to the page's own controls rather than leaving a blank div, and
         register the data layer either way. */
      try{ if(ui){ ui.destroy(); ui=null; stage=null; legendHost=null; } }catch(e2){}
      bootBare();
    }
    dgcInit();
  }

  function bootUI(){
    ui = window.DiagramUI.app({
      id:'xenon', mount:'#app', layout:'calculator', compute:'live',
      lang:LANG, state:state, defaults:DEFAULTS, history:false,
      title:K('title'), subtitle:KP('subtitle'),
      learn:learnData(),
      regions:{
        inputs:function(host,app){ buildInputs(app); },
        stage: function(host,app){ buildStage(app); }
      },
      /* the footer option, not the footer region: only the option adds the
         .dgu-footer styling the placement law expects for model notes */
      footer:function(host,app){ buildFooter(host,app); },
      on:{
        compute: computeResults,
        lang: function(code){ LANG=code; document.title=(I18N[code]||I18N.en).title; },
        reset: function(fresh,app){ adopt(fresh,app); }
      }
    });
    /* the canvas colours come from the token layer, so the plot is redrawn when
       the resolved theme changes; the page used to watch the media query. */
    window.DiagramUI.theme.watch(function(){ if(stage) stage.schedule(); });
    ui.ready();
  }

  /* diagram-ui.js is missing (blocked, 404 or an old cache): the physics, the
     record, the permalink, the report and the exports all still work, so run
     them and say plainly which part is not there. */
  function bootBare(){
    var box=document.getElementById('app')||document.body;
    var l=I18N[LANG]||I18N.en;
    box.className='xe-bare';
    box.innerHTML='';
    var h1=document.createElement('h1'); h1.textContent=l.title; box.appendChild(h1);
    var sub=document.createElement('p'); sub.textContent=plain(l.subtitle); box.appendChild(sub);
    var msg=document.createElement('p'); msg.textContent=pick(S.bare,LANG); box.appendChild(msg);

    /* the language control is framework furniture on the ported page; with the
       framework gone the tool offers its own, so no language is lost. */
    var lb=document.createElement('div'); lb.className='xe-langbar'; box.appendChild(lb);
    SITE_LANGS.forEach(function(code){
      var b=document.createElement('button'); b.type='button'; b.lang=code;
      b.textContent=code==='uk'?'Українська':window.DiagramUI&&window.DiagramUI.langNames?
        window.DiagramUI.langNames[code]:code;
      b.textContent={en:'English',uk:'Українська',de:'Deutsch',nl:'Nederlands',
                     fr:'Français',es:'Español'}[code];
      b.addEventListener('click',function(){
        LANG=code; document.documentElement.lang=code;
        try{ localStorage.setItem('diagram_lang',code); }catch(e){}
        if(window.Diagram&&window.Diagram.setLang) window.Diagram.setLang(code);
        bootBare();
      });
      lb.appendChild(b);
    });

    function slider(id,labelText,min,max,step,val){

'GAMMA_I = 0.0639      # I-135 fission yield\n'+
'GAMMA_X = 0.00237     # direct Xe-135 fission yield\n'+

def rho_of(x):
    """Reactivity worth of a xenon number density, pcm (negative)."""
    return -SIGMA_A_XE * x / (NU * SIGMA_F) * 1e5


def solution(phi0):
    """Closed-form I/Xe solution after an instantaneous shutdown from flux phi0."""
    i_eq = GAMMA_I * SIGMA_F * phi0 / LAMBDA_I
    x_eq = (GAMMA_X + GAMMA_I) * SIGMA_F * phi0 / (LAMBDA_X + SIGMA_A_XE * phi0)
    k = LAMBDA_I * i_eq / (LAMBDA_I - LAMBDA_X)
    a = x_eq + k
    tp = math.log((LAMBDA_I * i_eq + LAMBDA_X * k) / (LAMBDA_X * a)) / (LAMBDA_I - LAMBDA_X)
    return {"Ieq": i_eq, "Xeq": x_eq, "A": a, "K": k, "tPeak": tp if tp > 0 else 0.0,
            "X": lambda t: a * math.exp(-LAMBDA_X * t) - k * math.exp(-LAMBDA_I * t)}


def dead_time(sol, margin_pcm):
    """Window in which the xenon worth exceeds the available margin, in hours."""
    t_pk = sol["tPeak"]
    if not (margin_pcm > 0):
        return {"t0": 0.0, "t1": float("inf"), "dur": float("inf"), "unbounded": True}
    x_m = margin_pcm * NU * SIGMA_F / (SIGMA_A_XE * 1e5)
    if sol["X"](t_pk) <= x_m:
        return None

    def f(t):
        return sol["X"](t) - x_m

    def bis(a, b):
        fa = f(a)
        i = 0
        while i < 200 and (b - a) > 1e-6:
            m = 0.5 * (a + b)
            fm = f(m)
            if (fm < 0) == (fa < 0):
                a, fa = m, fm
            else:
                b = m
            i += 1
        return 0.5 * (a + b)

    t0 = 0.0 if sol["Xeq"] > x_m else bis(0.0, t_pk)
    t_hi = math.log(sol["A"] / x_m) / LAMBDA_X
    if not (t_hi > t_pk):
        t_hi = t_pk + HOUR
    t1 = bis(t_pk, t_hi)
    return {"t0": t0 / HOUR, "t1": t1 / HOUR, "dur": (t1 - t0) / HOUR, "unbounded": False}


def compute():
    sol = solution(FLUX_BEFORE_SHUTDOWN)
    x_pk = sol["X"](sol["tPeak"])
    dt = dead_time(sol, AVAILABLE_MARGIN)
    return {"iodine_equilibrium": sol["Ieq"],
            "xenon_equilibrium": sol["Xeq"],
            "rho_equilibrium": rho_of(sol["Xeq"]),
            "rho_peak": rho_of(x_pk),
            "time_to_peak": sol["tPeak"] / HOUR,
            "peak_concentration_ratio": x_pk / sol["Xeq"],
            "dead_time_start": dt["t0"] if dt else None,
            "dead_time_end": dt["t1"] if dt else None,
            "dead_time_duration": dt["dur"] if dt else None}`;
