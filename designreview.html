 for(i=0;i<DOMAINS.length;i++){
   d=DOMAINS[i];v=s[d.id+'Status'];exp=expectation(s.profile,d.id);

   rule('D_'+d.id+'_NA_NO_REASON',v==='na_no_reason','warning',d.id,'naWithoutReason',BASES.quality,d.aff);
   if(exp==='R'){
     rule('D_'+d.id+'_UNKNOWN',v==='unknown','warning',d.id,'requiredUnknown',BASES.method,d.aff);
     rule('D_'+d.id+'_TBD',v==='tbd','warning',d.id,'requiredTbd',BASES.method,d.aff);
     rule('D_'+d.id+'_INCOMPLETE',v==='incomplete','warning',d.id,'requiredIncomplete',BASES.method,d.aff);
     if(v==='na_reason'){
       var ex=exceptionFor(s,d.id);

     rule('D_'+d.id+'_CONDITIONAL_TBD',v==='tbd','warning',d.id,'conditionalTbd',BASES.method,d.aff);
   }
   rule('D_'+d.id+'_ACCEPTED',v==='accepted','open',d.id,'acceptedOpen',BASES.quality,d.aff);
 }

 rule('R_SCOPE_MISSING',!clean(s.reviewScope),'warning','objectives','scopeMissing',BASES.nasa,['review']);
 rule('R_DECISION_MISSING',!clean(s.decisionSought),'warning','decisions','decisionMissing',BASES.nasa,['review']);

 rule('R_MATERIAL_PARTIAL',s.reviewMaterial==='partial','warning','objectives','materialPartial',BASES.nasa,['review']);

 rule('R_REQ_STATUS_CONFLICT',s.requirementsBaseline==='baseline'&&(s.requirementsStatus==='unknown'||s.requirementsStatus==='tbd'),'warning','requirements','baselineStatusConflict',BASES.method,['review']);

 rule('R_FROZEN_EQUIPMENT_PROVISIONAL_INPUTS',(s.equipmentSelection==='frozen')&&(s.designInputs==='provisional'||s.designInputs==='unknown'||s.designInputs==='na'),'blocker','designBasis','frozenEquipmentProvisionalInputs',BASES.method,['review','design','analysis','test']);

var FT={
 domainExplicitBlocker:{m:T('{domain} is marked as a known blocker.','{domain}: позначено як відомий блокер.','{domain} ist als bekannter Blocker markiert.','{domain} is als bekende blokkade gemarkeerd.','{domain} est marqué comme blocage connu.','{domain} está marcado como bloqueo conocido.','{domain} oznaczono jako znaną blokadę.'),r:T('A review cannot credibly close while an explicitly blocking evidence item remains unresolved.','Рев’ю не може бути змістовно закрито, доки явний блокер не усунено.','Eine Prüfung kann nicht belastbar abgeschlossen werden, solange ein expliziter Blocker offen ist.','Een review kan niet geloofwaardig sluiten zolang een expliciete blokkade openstaat.','La revue ne peut se conclure de façon crédible tant qu’un blocage explicite demeure.','La revisión no puede cerrarse de forma creíble mientras quede un bloqueo explícito.','Przeglądu nie można wiarygodnie zamknąć, gdy pozostaje jawna blokada.'),a:T('Resolve it or formally redefine the review scope before the review.','Усунути блокер або формально змінити обсяг рев’ю.','Blocker lösen oder Prüfumfang formell neu festlegen.','Los de blokkade op of herdefinieer formeel de reviewscope.','Résoudre le blocage ou redéfinir formellement le périmètre.','Resolverlo o redefinir formalmente el alcance.','Usunąć blokadę albo formalnie zmienić zakres przeglądu.')},
 naWithoutReason:{m:T('{domain} is marked N/A without a recorded reason.','{domain}: N/A без записаної причини.','{domain} ist N/A ohne dokumentierte Begründung.','{domain} is n.v.t. zonder vastgelegde reden.','{domain} est N/A sans raison consignée.','{domain} es N/A sin motivo registrado.','{domain} oznaczono N/D bez zapisanego powodu.'),r:T('Unjustified exclusion is indistinguishable from an omitted requirement or evidence class.','Необґрунтоване виключення неможливо відрізнити від пропущеної вимоги або класу доказів.','Ein unbegründeter Ausschluss ist nicht von einer Auslassung zu unterscheiden.','Een uitsluiting zonder reden is niet te onderscheiden van een omissie.','Une exclusion non justifiée ne se distingue pas d’un oubli.','Una exclusión sin justificación no se distingue de una omisión.','Wyłączenia bez uzasadnienia nie da się odróżnić od pominięcia.'),a:T('Record why the domain does not apply to this review.','Записати, чому область не застосовується до цього рев’ю.','Begründung für Nichtanwendbarkeit dokumentieren.','Leg vast waarom het domein niet van toepassing is.','Consigner pourquoi le domaine ne s’applique pas.','Registrar por qué el dominio no aplica.','Zapisać, dlaczego obszar nie ma zastosowania.')},
 requiredUnknown:{m:T('{domain} is expected for this profile but its evidence state is unknown.','{domain}: для цього профілю очікується, але стан доказів невідомий.','{domain} wird für dieses Profil erwartet, der Nachweisstatus ist jedoch unbekannt.','{domain} wordt voor dit profiel verwacht, maar de bewijsstatus is onbekend.','{domain} est attendu pour ce profil, mais l’état des preuves est inconnu.','{domain} se espera para este perfil, pero se desconoce el estado de la evidencia.','{domain} jest oczekiwany dla tego profilu, lecz stan dowodów jest nieznany.'),r:T('Unknown evidence is a review uncertainty, not evidence of readiness.','Невідомий стан доказів — це невизначеність рев’ю, а не доказ готовності.','Unbekannter Nachweisstatus ist Unsicherheit, kein Bereitschaftsnachweis.','Onbekend bewijs is onzekerheid, geen bewijs van gereedheid.','Un état inconnu est une incertitude, pas une preuve de préparation.','Un estado desconocido es incertidumbre, no evidencia de preparación.','Nieznany stan to niepewność, nie dowód gotowości.'),a:T('Identify the evidence owner and establish the current state.','Визначити власника доказу та встановити поточний стан.','Nachweisverantwortlichen bestimmen und Status klären.','Bepaal de eigenaar en stel de actuele status vast.','Identifier le responsable et établir l’état actuel.','Identificar al responsable y establecer el estado actual.','Wskazać właściciela dowodu i ustalić stan.')},
 requiredTbd:{m:T('{domain} remains TBD for a profile that already expects evidence.','{domain}: лишається TBD для профілю, де доказ уже очікується.','{domain} bleibt TBD, obwohl dieses Profil bereits Nachweise erwartet.','{domain} blijft TBD terwijl dit profiel al bewijs verwacht.','{domain} reste à définir alors que ce profil attend déjà des preuves.','{domain} sigue por definir aunque este perfil ya exige evidencia.','{domain} pozostaje do ustalenia, choć profil oczekuje już dowodów.'),r:T('TBD is a known open definition, not an unknown state; it still needs disposition before relying on it.','TBD — це відоме відкрите визначення, а не невідомий стан; його все одно слід закрити.','TBD ist eine bekannte offene Festlegung; sie muss vor Nutzung geklärt werden.','TBD is een bekende open definitie en moet worden afgehandeld vóór erop te steunen.','À définir est un point ouvert connu qui doit être traité avant usage.','Por definir es un punto abierto conocido que debe resolverse antes de apoyarse en él.','Do ustalenia to znany otwarty punkt, który trzeba rozstrzygnąć przed wykorzystaniem.'),a:T('Assign a disposition and due point appropriate to the review decision.','Призначити рішення та строк, сумісні з рішенням рев’ю.','Festlegung und Termin passend zur Prüfentscheidung zuweisen.','Wijs een afhandeling en datum toe passend bij de reviewbeslissing.','Attribuer une disposition et une échéance compatibles avec la décision.','Asignar disposición y fecha acordes con la decisión.','Przypisać sposób zamknięcia i termin odpowiedni do decyzji przeglądu.')},
 requiredIncomplete:{m:T('{domain} is incomplete for this review profile.','{domain}: неповно для цього профілю рев’ю.','{domain} ist für dieses Prüfprofil unvollständig.','{domain} is onvolledig voor dit reviewprofiel.','{domain} est incomplet pour ce profil de revue.','{domain} está incompleto para este perfil de revisión.','{domain} jest niekompletny dla tego profilu.'),r:T('Incomplete evidence may be acceptable only if the missing part is understood and does not undermine the review decision.','Неповний доказ допустимий лише коли відсутня частина зрозуміла і не підриває рішення рев’ю.','Unvollständige Nachweise sind nur akzeptabel, wenn die Lücke verstanden ist und die Prüfentscheidung nicht untergräbt.','Onvolledig bewijs is alleen aanvaardbaar als de lacune bekend is en de reviewbeslissing niet ondermijnt.','Une preuve incomplète n’est acceptable que si la lacune est comprise et ne compromet pas la décision.','La evidencia incompleta solo es aceptable si se entiende la brecha y no compromete la decisión.','Niepełny dowód jest dopuszczalny tylko, gdy luka jest zrozumiana i nie podważa decyzji.'),a:T('Define the missing evidence and decide whether it is blocking or an accepted open item.','Визначити відсутній доказ і вирішити, чи це блокер, чи прийнятий відкритий пункт.','Fehlenden Nachweis benennen und als Blocker oder akzeptierten offenen Punkt einstufen.','Benoem het ontbrekende bewijs en bepaal of het blokkeert of geaccepteerd open blijft.','Définir la preuve manquante et décider si elle bloque ou reste ouverte de façon acceptée.','Definir la evidencia faltante y decidir si bloquea o queda abierta de forma aceptada.','Określić brakujący dowód i zdecydować, czy blokuje, czy pozostaje zaakceptowanym punktem otwartym.')},
 acceptedOpen:{m:T('{domain} contains an accepted open item.','{domain}: містить прийнятий відкритий пункт.','{domain} enthält einen akzeptierten offenen Punkt.','{domain} bevat een geaccepteerd open punt.','{domain} contient un point ouvert accepté.','{domain} contiene un punto abierto aceptado.','{domain} zawiera zaakceptowany otwarty punkt.'),r:T('Accepted open items are compatible with readiness only when their impact and closure path are explicit.','Прийняті відкриті пункти сумісні з готовністю лише коли їхній вплив і шлях закриття явні.','Akzeptierte offene Punkte sind nur bei klarem Einfluss und Abschlussweg mit Bereitschaft vereinbar.','Geaccepteerde open punten passen alleen bij gereedheid als impact en afsluitpad expliciet zijn.','Ils sont compatibles avec la préparation seulement si leur impact et leur clôture sont explicites.','Son compatibles con la preparación solo si su impacto y cierre son explícitos.','Są zgodne z gotowością tylko wtedy, gdy ich wpływ i sposób zamknięcia są jawne.'),a:T('Keep the owner, due point and non-blocking rationale visible in the review record.','Зберігати власника, строк і обґрунтування неблокуючого статусу у записі рев’ю.','Verantwortlichen, Termin und Nicht-Blocker-Begründung im Prüfprotokoll halten.','Houd eigenaar, datum en niet-blokkerende reden zichtbaar in het reviewrecord.','Conserver responsable, échéance et justification non bloquante dans le dossier.','Mantener responsable, fecha y justificación no bloqueante en el registro.','Utrzymać właściciela, termin i uzasadnienie braku blokady w zapisie przeglądu.')}

special('interfaceRowAccepted','A non-blocking interface remains open under an explicit acceptance/disposition.','Неблокуючий інтерфейс лишається відкритим за явним погодженням/disposition.','Eine nicht blockierende Schnittstelle bleibt mit expliziter Akzeptanz/Disposition offen.','Een niet-blokkerende interface blijft open met expliciete acceptatie/afhandeling.','Une interface non bloquante reste ouverte avec acceptation/disposition explicite.','Una interfaz no bloqueante permanece abierta con aceptación/disposición explícita.','Nieblo­kujący interfejs pozostaje otwarty z jawną akceptacją/rozstrzygnięciem.');
special('interfaceOwnerMissing','An open interface has no recorded owner.','Відкритий інтерфейс не має записаного власника.','Eine offene Schnittstelle hat keinen dokumentierten Verantwortlichen.','Een open interface heeft geen vastgelegde eigenaar.','Une interface ouverte n’a pas de responsable consigné.','Una interfaz abierta no tiene responsable registrado.','Otwarty interfejs nie ma zapisanego właściciela.');
special('interfaceDueMissing','An open interface has no closure point/date.','Відкритий інтерфейс не має строку/точки закриття.','Eine offene Schnittstelle hat keinen Abschlusszeitpunkt.','Een open interface heeft geen sluitingsdatum/-punt.','Une interface ouverte n’a pas d’échéance de clôture.','Una interfaz abierta no tiene fecha/punto de cierre.','Otwarty interfejs nie ma terminu/punktu zamknięcia.');
special('interfaceClosureMissing','An interface is marked closed without closure evidence/reference.','Інтерфейс позначено closed без доказу/посилання на закриття.','Eine Schnittstelle ist ohne Abschlussnachweis/-referenz als geschlossen markiert.','Een interface staat op gesloten zonder sluitingsbewijs/-referentie.','Une interface est marquée close sans preuve/référence de clôture.','Una interfaz está cerrada sin evidencia/referencia de cierre.','Interfejs oznaczono jako zamknięty bez dowodu/odniesienia zamknięcia.');
special('actionRegisterEmpty','Previous actions are open/accepted but no individual action record is provided.','Попередні дії відкриті/прийняті, але немає поелементних записів.','Frühere Maßnahmen sind offen/akzeptiert, aber keine Einzelmaßnahmen sind erfasst.','Eerdere acties zijn open/geaccepteerd maar niet individueel vastgelegd.','Des actions précédentes sont ouvertes/acceptées sans enregistrement individuel.','Hay acciones previas abiertas/aceptadas sin registros individuales.','Poprzednie działania są otwarte/zaakceptowane, ale brak zapisów pozycji.');
special('actionDuplicateId','The previous-action register contains a duplicate identifier.','Реєстр попередніх дій містить дубльований ідентифікатор.','Das Maßnahmenregister enthält eine doppelte Kennung.','Het actieregister bevat een dubbele identificatie.','Le registre des actions contient un identifiant en double.','El registro de acciones contiene un identificador duplicado.','Rejestr działań zawiera zduplikowany identyfikator.');
special('actionOpenCurrentScope','An open entry in the previous-action register is marked as affecting this review.','Відкритий запис у реєстрі попередніх дій позначено як такий, що впливає на це рев’ю.','Ein offener Eintrag im Register früherer Maßnahmen ist als für diese Prüfung relevant markiert.','Een openstaande regel in het register van eerdere acties is als relevant voor deze review gemarkeerd.','Une entrée ouverte du registre des actions précédentes est marquée comme concernant cette revue.','Una entrada abierta del registro de acciones previas está marcada como relevante para esta revisión.','Otwarty wpis w rejestrze wcześniejszych działań jest oznaczony jako istotny dla tego przeglądu.');
special('actionAcceptedCurrentScope','A previous action is called accepted-open but still affects the current review scope.','Попередню дію названо accepted-open, але вона все ще впливає на поточний обсяг.','Eine frühere Maßnahme gilt als akzeptiert offen, betrifft aber weiter den aktuellen Umfang.','Een eerdere actie is geaccepteerd-open maar raakt nog steeds de huidige scope.','Une action antérieure est acceptée ouverte mais affecte encore le périmètre actuel.','Una acción anterior está aceptada abierta pero aún afecta el alcance actual.','Poprzednie działanie jest zaakceptowane jako otwarte, lecz nadal wpływa na obecny zakres.');
special('actionOpenNonCurrent','A previous action remains open but is declared not to affect the current decision.','Попередня дія лишається відкритою, але заявлено, що вона не впливає на поточне рішення.','Eine frühere Maßnahme bleibt offen, soll aber die aktuelle Entscheidung nicht beeinflussen.','Een eerdere actie staat nog open maar beïnvloedt volgens opgave de huidige beslissing niet.','Une action antérieure reste ouverte mais est déclarée sans effet sur la décision actuelle.','Una acción anterior sigue abierta pero se declara sin impacto en la decisión actual.','Poprzednie działanie pozostaje otwarte, lecz zadeklarowano brak wpływu na obecną decyzję.');
special('actionAcceptedNonCurrent','A non-blocking previous action remains open under explicit acceptance.','Неблокуюча попередня дія лишається відкритою за явним погодженням.','Eine nicht blockierende frühere Maßnahme bleibt mit expliziter Akzeptanz offen.','Een niet-blokkerende eerdere actie blijft open met expliciete acceptatie.','Une action antérieure non bloquante reste ouverte avec acceptation explicite.','Una acción anterior no bloqueante permanece abierta con aceptación explícita.','Nieblo­kujące poprzednie działanie pozostaje otwarte z jawną akceptacją.');
special('actionOwnerMissing','An open previous action has no recorded owner.','Відкрита попередня дія не має записаного власника.','Eine offene frühere Maßnahme hat keinen dokumentierten Verantwortlichen.','Een open eerdere actie heeft geen vastgelegde eigenaar.','Une action antérieure ouverte n’a pas de responsable consigné.','Una acción previa abierta no tiene responsable registrado.','Otwarte poprzednie działanie nie ma zapisanego właściciela.');
special('actionDueMissing','An open previous action has no due point/date.','Відкрита попередня дія не має строку/точки закриття.','Eine offene frühere Maßnahme hat keinen Fälligkeitspunkt.','Een open eerdere actie heeft geen sluitingsdatum/-punt.','Une action antérieure ouverte n’a pas d’échéance.','Una acción previa abierta no tiene fecha/punto de cierre.','Otwarte poprzednie działanie nie ma terminu/punktu zamknięcia.');
special('actionClosureMissing','A previous action is marked closed without closure evidence/reference.','Попередню дію позначено closed без доказу/посилання на закриття.','Eine frühere Maßnahme ist ohne Abschlussnachweis/-referenz als geschlossen markiert.','Een eerdere actie staat op gesloten zonder sluitingsbewijs/-referentie.','Une action antérieure est marquée close sans preuve/référence de clôture.','Una acción previa está cerrada sin evidencia/referencia de cierre.','Poprzednie działanie oznaczono jako zamknięte bez dowodu/odniesienia zamknięcia.');
function findingText(x){var z=FT[x.key]||FT.requiredUnknown,dom=tx(domainLabel(x.domain));return {message:fmt(z.m,{domain:dom}),rationale:z.r?fmt(z.r,{domain:dom}):'',action:fmt(z.a,{domain:dom})};}
function conclusionLabel(c){return c==='ready'?UI.ready:(c==='ready_open'?UI.readyOpen:UI.notReady);}
function severityLabel(s){return s==='blocker'?T('Blocker','Блокер','Blocker','Blokkade','Blocage','Bloqueo','Blokada'):(s==='warning'?T('Attention','Увага','Achtung','Aandacht','Attention','Atención','Uwaga'):T('Accepted open','Прийнято відкритим','Akzeptiert offen','Geaccepteerd open','Ouvert accepté','Abierto aceptado','Zaakceptowane otwarte'));}

var state=clone(DEFAULTS),last=null,stage=null,ui=null;
function profileOptions(){return Object.keys(PROFILES).map(function(k){return {value:k,label:PROFILES[k].label};});}
function domainFields(ids){return ids.map(function(id){return {id:'f-'+id,key:id+'Status',type:'select',label:DOMAIN_MAP[id].label,options:STATUS_OPTIONS,required:true,learn:'evidenceStates'};});}
function domainOptions(){return DOMAINS.map(function(d){return {value:d.id,label:d.label};});}
function buildInterface(){
 ui=DiagramUI.app({
  id:'designreview',mount:'#app',layout:'calculator',compute:'live',state:state,defaults:DEFAULTS,subtitle:UI.subtitle,
  notices:[{id:'method',tone:'info',sticky:true,title:T('Readiness, not compliance','Готовність, не compliance','Bereitschaft, nicht Konformität','Gereedheid, geen compliance','Préparation, pas conformité','Preparación, no conformidad','Gotowość, nie zgodność'),text:T('Start with the quick gate. Use Pack audit when the review package exists: then evidence, interfaces, previous actions and changes since the package cut-off are checked as concrete records, not only as self-declared statuses.','Почніть із quick gate. Коли пакет рев’ю існує, використовуйте Pack audit: тоді докази, інтерфейси, попередні дії та зміни після cut-off перевіряються як конкретні записи, а не лише як самооцінка.','Mit dem Quick Gate beginnen. Sobald ein Prüfpaket existiert, Pack Audit verwenden: Nachweise, Schnittstellen, frühere Maßnahmen und Änderungen seit dem Stichtag werden dann als konkrete Datensätze geprüft.','Begin met de quick gate. Gebruik Pack audit zodra het reviewpakket bestaat: bewijs, interfaces, eerdere acties en wijzigingen sinds de cut-off worden dan als concrete records getoetst.','Commencer par le quick gate. Dès que le dossier existe, utiliser Pack audit : preuves, interfaces, actions antérieures et changements depuis le cut-off sont alors contrôlés comme enregistrements concrets.','Empiece con el quick gate. Cuando exista el paquete, use Pack audit: evidencias, interfaces, acciones anteriores y cambios desde el corte se comprueban como registros concretos.','Zacząć od quick gate. Gdy istnieje pakiet przeglądowy, użyć Pack audit: dowody, interfejsy, wcześniejsze działania i zmiany od cut-off są wtedy sprawdzane jako konkretne rekordy.')}],
  learn:{version:2,intro:{title:UI.introTitle,body:UI.introBody},topics:{
   evidenceStates:{title:T('Evidence states','Стани доказів','Nachweiszustände','Bewijsstatussen','États de preuve','Estados de evidencia','Stany dowodów'),body:T('Unknown means the state is not known; TBD is a known definition gap; Accepted open requires understood impact and closure path. For a domain required by the selected profile, N/A is not accepted merely because “a reason exists”: Pack audit requires an explicit project exception record.','Unknown означає, що стан невідомий; TBD — відома прогалина визначення; Accepted open потребує зрозумілого впливу й шляху закриття. Для області, обов’язкової профілем, N/A потребує явного project exception record.','Unknown bedeutet unbekannten Zustand; TBD eine bekannte Definitionslücke; Accepted open setzt verstandene Wirkung und Abschlussweg voraus. Für einen erforderlichen Bereich braucht N/A im Pack Audit einen expliziten Projektausnahmevermerk.','Unknown betekent onbekende status; TBD een bekende definitielacune; Accepted open vereist bekende impact en sluitingspad. Voor een verplicht domein vereist N/A in Pack audit een expliciete projectuitzondering.','Unknown = état inconnu ; TBD = lacune connue ; Accepted open exige impact et voie de clôture compris. Pour un domaine requis, N/A exige une dérogation projet explicite dans Pack audit.','Unknown = estado desconocido; TBD = brecha conocida; Accepted open exige impacto y cierre entendidos. Para un dominio requerido, N/A exige una excepción explícita del proyecto en Pack audit.','Unknown oznacza stan nieznany; TBD znaną lukę; Accepted open wymaga znanego wpływu i drogi zamknięcia. Dla obszaru wymaganego N/D wymaga jawnego wyjątku projektowego w Pack audit.')},
   profiles:{title:T('Profile-specific evidence','Профільна застосовність доказів','Profilspezifische Nachweise','Profielspecifiek bewijs','Preuves propres au profil','Evidencia específica del perfil','Dowody właściwe profilowi'),body:T('Profiles are not treated as one linear maturity ladder. Each profile has an explicit required / conditional / optional / normally-N/A domain matrix.','Профілі не трактуються як одна лінійна шкала зрілості. Кожен має явну матрицю required / conditional / optional / normally-N/A.','Profile werden nicht als lineare Reifeleiter behandelt. Jedes Profil besitzt eine explizite Matrix required / conditional / optional / normally-N/A.','Profielen zijn geen lineaire volwassenheidsladder. Elk profiel heeft een expliciete matrix required / conditional / optional / normally-N/A.','Les profils ne forment pas une échelle linéaire : chacun possède une matrice required / conditional / optional / normally-N/A.','Los perfiles no forman una escala lineal: cada uno tiene una matriz required / conditional / optional / normally-N/A.','Profile nie są liniową drabiną dojrzałości; każdy ma jawną macierz required / conditional / optional / normally-N/A.')},
   registers:{title:T('Pack audit registers','Реєстри Pack audit','Pack-Audit-Register','Pack-auditregisters','Registres du Pack audit','Registros de Pack audit','Rejestry Pack audit'),body:T('Itemise what reviewers will actually see: evidence revision and configuration, open interfaces, previous actions, and project-specific N/A exceptions. This lets the tool propagate a concrete problem into dependent decisions.','Вкажіть те, що реально побачать reviewer-и: revision і конфігурацію доказів, відкриті інтерфейси, попередні дії та N/A exceptions. Це дає змогу поширити конкретну проблему на залежні рішення.','Erfassen Sie, was Prüfer tatsächlich sehen: Revision/Konfiguration der Nachweise, offene Schnittstellen, frühere Maßnahmen und N/A-Ausnahmen. So kann ein konkretes Problem in abhängige Entscheidungen propagiert werden.','Leg vast wat reviewers werkelijk zien: revisie/configuratie van bewijs, open interfaces, eerdere acties en N/A-uitzonderingen. Zo kan een concreet probleem naar afhankelijke beslissingen doorwerken.','Détailler ce que les reviewers verront : révision/configuration des preuves, interfaces ouvertes, actions antérieures et exceptions N/A. Un problème concret peut ainsi se propager aux décisions dépendantes.','Detalle lo que verán los revisores: revisión/configuración de evidencias, interfaces abiertas, acciones previas y excepciones N/A. Así un problema concreto se propaga a decisiones dependientes.','Wskazać to, co naprawdę zobaczą reviewerzy: rewizję/konfigurację dowodów, otwarte interfejsy, wcześniejsze działania i wyjątki N/D. Pozwala to propagować problem do zależnych decyzji.')},
   map:{title:T('Dependency / consequence map','Мапа залежностей і наслідків','Abhängigkeits-/Folgenkarte','Afhankelijkheids-/gevolgenkaart','Carte dépendances / conséquences','Mapa de dependencias / consecuencias','Mapa zależności / konsekwencji'),body:T('The left side shows active blockers/warnings, the middle their evidence domain, and the right the downstream deliverables/decisions they can invalidate.','Ліворуч активні blocker/warning, посередині їхня область доказів, праворуч downstream deliverables/рішення, які вони можуть знецінити.','Links stehen aktive Blocker/Warnungen, in der Mitte ihr Nachweisbereich, rechts die nachgelagerten Lieferobjekte/Entscheidungen.','Links staan actieve blokkades/waarschuwingen, in het midden het bewijsdomein en rechts de downstream deliverables/beslissingen.','À gauche les blocages/alertes, au centre leur domaine de preuve, à droite les livrables/décisions aval.','A la izquierda bloqueos/alertas, en el centro el dominio de evidencia y a la derecha entregables/decisiones posteriores.','Po lewej aktywne blokady/ostrzeżenia, w środku obszar dowodowy, po prawej zależne produkty/decyzje.')}

  footer:T('Method basis: ISO/IEC/IEEE 15288:2023; ISO 10006:2017; NASA Systems Engineering Handbook Rev. 2 and public technical-review guidance. Profile applicability and inference rules are this tool’s screening methodology, not universal review-gate requirements.','Методична основа: ISO/IEC/IEEE 15288:2023; ISO 10006:2017; NASA Systems Engineering Handbook Rev. 2. Матриця застосовності та правила — screening-методика цієї тулзи, а не універсальні вимоги до review gates.','Methodische Basis: ISO/IEC/IEEE 15288:2023; ISO 10006:2017; NASA Systems Engineering Handbook Rev. 2. Profilmatrix und Regeln sind Screeningmethodik dieses Werkzeugs, keine universellen Gate-Anforderungen.','Methodische basis: ISO/IEC/IEEE 15288:2023; ISO 10006:2017; NASA Systems Engineering Handbook Rev. 2. Profielmatrix en regels zijn screeningmethodiek van deze tool, geen universele gate-eisen.','Base méthodologique : ISO/IEC/IEEE 15288:2023 ; ISO 10006:2017 ; NASA Systems Engineering Handbook Rev. 2. Matrice et règles relèvent de la méthode de l’outil, pas d’exigences universelles de gate.','Base metodológica: ISO/IEC/IEEE 15288:2023; ISO 10006:2017; NASA Systems Engineering Handbook Rev. 2. Matriz y reglas son metodología de la herramienta, no requisitos universales de gate.','Podstawa: ISO/IEC/IEEE 15288:2023; ISO 10006:2017; NASA Systems Engineering Handbook Rev. 2. Macierz i reguły są metodą narzędzia, nie uniwersalnymi wymaganiami gate.'),

or met de opgegeven reviewbeslissing en scope.','Poursuivre avec la décision et le périmètre indiqués.','Proceder con la decisión y alcance indicados.','Kontynuować z podaną decyzją i zakresem.')));

-based only to the extent that the registers are populated. It still does not inspect document contents.','Pack audit є evidence-based лише настільки, наскільки заповнені реєстри. Вміст документів він не читає.','Pack Audit ist nur insoweit nachweisbasiert, wie die Register gefüllt sind; Dokumentinhalte werden nicht gelesen.','Pack audit is alleen evidence-based voor zover de registers zijn gevuld; documentinhoud wordt niet gelezen.','Pack audit n’est fondé sur les preuves que dans la mesure où les registres sont renseignés ; le contenu des documents n’est pas lu.','Pack audit se basa en evidencias solo en la medida en que se rellenen los registros; no lee el contenido documental.','Pack audit jest oparty na dowodach tylko w zakresie wypełnionych rejestrów; nie czyta treści dokumentów.') ]};

  {id:'problem-critical-interface',group:T('Show me a problem','Показати проблему','Problem zeigen','Toon mij een probleem','Montrez-moi un problème','Muéstrame un problema','Pokaż problem'),label:T('Detailed design — unresolved cooling-water interface','Detailed design — невирішений cooling-water interface','Detaildesign — ungeklärte Kühlwasser-Schnittstelle','Detailontwerp — onopgeloste koelwaterinterface','Conception détaillée — interface eau de refroidissement non résolue','Diseño detallado — interfaz de agua de refrigeración sin resolver','Projekt szczegółowy — nierozstrzygnięty interfejs wody chłodzącej'),note:T('The package looks mature, but cooling-water temperature/pressure remain open and feed calculations, drawings and vendor selection. Expected finding: Not ready; one interface blocks several downstream decisions.','Пакет виглядає зрілим, але температура/тиск cooling water лишаються відкритими та живлять розрахунки, креслення й vendor selection. Очікуваний висновок: Not ready; один interface блокує кілька downstream рішень.','Das Paket wirkt reif, doch Kühlwassertemperatur und -druck sind offen und speisen Berechnungen, Zeichnungen und Lieferantenauswahl. Erwartung: Not ready; eine Schnittstelle blockiert mehrere Folgeentscheidungen.','Het pakket lijkt volwassen, maar koelwatertemperatuur en -druk zijn nog open en voeden berekeningen, tekeningen en leverancierskeuze. Verwacht: Not ready; één interface blokkeert meerdere downstreambeslissingen.','Le dossier paraît mûr, mais température et pression d’eau de refroidissement restent ouvertes et alimentent calculs, plans et choix fournisseur. Résultat attendu : Not ready ; une interface bloque plusieurs décisions aval.','El paquete parece maduro, pero temperatura y presión del agua de refrigeración siguen abiertas y alimentan cálculos, planos y selección de proveedor. Resultado esperado: Not ready; una interfaz bloquea varias decisiones posteriores.','Pakiet wygląda dojrzale, lecz temperatura i ciśnienie wody ctando el alcance actual. Resultado esperado: Not ready; el delta de configuración y la acción heredada bloquean la puerta de forma independiente.','Pakiet site był zamrożony; potem zmienił się rysunek dostępu/podestu, a wcześniejsze działanie bezpieczeństwa nadal wpływa na bieżący zakres. Oczekiwane: Not ready; delta konfiguracji i odziedziczone działanie niezależnie blokują gate.'),apply:function(t){var s=readyState('presite');s.projectRef='SITE-READY-01';s.reviewScope='Release installation package to site and commissioning team';s.decisionSought='Authorize site installation and commissioning preparation';s.previousReviewRef='DR-90';s.previousActionsState='open_impact';s.previousActionsStatus='present';s.actionItems=[{id:'A-SAF-12',status:'open',impact:'current_scope',owner:'Site design lead',due:'Before mobilization',closure:''}];var e=s.evidenceItems.find(function(x){return x.domain==='drawings';});if(e){e.id='EV-ACCESS-DWG';e.revision='D';e.delta='changed_unreviewed';e.review='unreviewed';}Object.assign(t,s);}}

/* ---- §2.3 decisions: the register this tool writes AND reads ----
   Rows are derived from the review itself, with ids derived through the one
   shared scheme (DiagramProject.deriveId), so the same review produces the same
   ids on every run and a second save refreshes rather than accumulates. */
function drVerdict(c){ return c==='ready'?'vSupported':(c==='ready_open'?'vConditional':'vNotSupported'); }
function drStatusLabel(st){ return st==='supported'?drT('stSupported'):st==='conditional'?drT('stConditional'):st==='not_supported'?drT('stNotSupported'):st==='accepted_open'?drT('stAcceptedOpen'):String(st||''); }
function drDecisionRows(s,a){
 if(!PKG_OK()) return [];
 var rows=[],seek=clean(s.decisionSought),prof=tx((PROFILES[s.profile]&&PROFILES[s.profile].label)||{en:s.profile});
 if(seek){
  var id=DiagramProject.deriveId('DEC',(clean(s.projectRef)?clean(s.projectRef)+' ':'')+seek);
  if(id) rows.push({id:id,label:seek,
   statement:drT('stmtSought',{profile:prof,verdict:drT(drVerdict(a.conclusion))}),
   status:a.conclusion==='ready'?'supported':(a.conclusion==='ready_open'?'conditional':'not_supported'),
   review_profile:String(s.profile||''),evidence_basis:a.blockers.map(function(x){return x.id;})});
 }
 (a.accepted||[]).forEach(function(x){
  var aid=DiagramProject.deriveId('DEC',x.id);
  if(!aid) return;
  rows.push({id:aid,label:tx(domainLabel(x.domain)),statement:findingText(x).message,
             status:'accepted_open',review_profile:String(s.profile||''),evidence_basis:[x.id]});
 });
 return rows;
}
/* Replace by id, at the original position, so a second save of the same review
   refreshes rather than accumulates and an earlier review's rows survive. Every
   row in `review_decisions` is this tool's own: the key-union that used to
   preserve another tool's fields, and the re-read that used to merge onto another
   writer, both came out when the register was split — `save()` now refuses a
   patch naming `definition_decisions` outright, and a guard that can no longer
   fire is one more thing the next reader has to reason about. */
function drDecisionsMerge(existing,mine){
 var out=(Array.isArray(existing)?existing:[]).map(function(r){return clone(r);}),idx={},added=[],updated=[];
 out.forEach(function(r,i){ var k=String((r&&r.id)||''); if(k&&idx[k]===undefined) idx[k]=i; });
 (mine||[]).forEach(function(m){
  var k=String(m.id||''); if(!k) return;
  if(idx[k]===undefined){ idx[k]=out.length; out.push(clone(m)); added.push(k); }
  else { out[idx[k]]=clone(m); updated.push(k); }
 });
 return {rows:out,added:added,updated:updated};
}

/* ---- §6 of the changeimpact report: the three buckets ----
   mine (my kind, id found) / my orphan (my kind, id missing) / not mine
   (someone else's kind — or a kind that is not in the contract list at all,
   which is shown with its raw value and never guessed at). */
var DR_MY_KINDS=['review_decision'];
/* §6.2 — save() validates flags, importFile() deliberately does not, so a loaded
   file can carry a string, a number, null, an array or an object with none of the
   seven fields. Every field access on a flag is guarded, and a malformed entry is
   shown as raw content rather than a guessed kind and word. */
function isFlagObject(f){ return !!f&&typeof f==='object'&&!Array.isArray(f); }
function drRawFlagText(f){ try{ var t=JSON.stringify(f); return t===undefined?String(f):t; }catch(e){ return String(f); } }
/* §6.2 — ids here are derived from names, so a flag is matched against the MERGED
   local-union-package id view: the rows this review generates plus the rows the
   loaded package carries. Matching either alone calls a flag orphaned that the
   other half can plainly resolve. */
function drFlagBuckets(flags,rows){
 var ids={},mine={},orphan=[],foreign=[];
 (rows||[]).forEach(function(r){ if(r&&r.id) ids[String(r.id)]=true; });
 (Array.isArray(flags)?flags:[]).forEach(function(f){
  if(!isFlagObject(f)){ foreign.push(f); return; }
  if(DR_MY_KINDS.indexOf(String(f.target_kind||''))<0){ foreign.push(f); return; }
  var id=String(f.target_id||'');
  if(ids[id]){ (mine[id]=mine[id]||[]).push(f); } else orphan.push(f);
 });
 return {mine:mine,orphan:orphan,foreign:foreign,ids:ids};
}

/* ---- reading the real registers ----
   `requirementsBaseline`, `requirementsTrace`, `interfaceImpact` and
   `vendorDrawing` are hand-entered readiness answers about registers this tool
   now actually receives. Exactly one of them is a fact the register can answer:
   traceability is "does every requirement carry a verification activity", which
   is requirements[] joined to verification_evidence[].requirement_id. The other
   three ask for a STATE (baselined / impact class / drawing review status) that
   the register does not carry, so they are shown beside the answer and left to
   the user rather than rounded into evidence the package never provided. */
function drTrace(p){
 var reqs=Array.isArray(p&&p.requirements)?p.requirements:null;
 if(!reqs||!reqs.length) return null;
 var ev=Array.isArray(p&&p.verification_evidence)?p.verification_evidence:[];
 var covered={};
 ev.forEach(function(e){ var r=String((e&&e.requirement_id)||''); if(r) covered[r]=true; });
 var n=0; reqs.forEach(function(r){ if(covered[String((r&&r.id)||'')]) n++; });
 return {n:n,m:reqs.length,value:n===0?'none':(n===reqs.length?'complete':'partial')};
}
function drObservations(p,s){
 var out=[];
 function row(section,list,answer){ if(!Array.isArray(list)) return;
  out.push({section:section,n:list.length,answer:answer,
            text:drT('obsRow',{register:drSectionLabels([section]),n:list.length,answer:answer})}); }
 row('requirements',p&&p.requirements,String(s.requirementsBaseline||''));
 row('interfaces',p&&p.interfaces,String(s.interfaceImpact||''));
 row('vendor_documents',p&&p.vendor_documents,String(s.vendorDrawing||''));
 row('deliverables',p&&p.deliverables,String(s.drawingsStatus||''));
 row('commissioning_evidence',p&&p.commissioning_evidence,String(s.testEvidenceStatus||''));
 return out;
}
function drSystemNameOnly(p){
 var pk=(p&&p.structure&&Array.isArray(p.structure.packages))?p.structure.packages:[];
 return pk.filter(function(x){ return x&&!clean(x.system_id)&&clean(x.system_name); })
          .map(function(x){ return (clean(x.name)||clean(x.id)||'—')+' -> '+clean(x.system_name); });
}

/* ---- applying the package (§3.1 explicit, §3.4 conflicts shown) ---- */
var drPkg=null,drPkgDecisions=[],drBasis=[],drFlags=[];
function drApply(p,target){
 var t=target||state,applied=[],unmapped=[],replaced=[],notes=[],conflicts=[];
 if(!p) return {applied:applied,unmapped:unmapped,replaced:replaced,notes:notes,conflicts:conflicts};
 var pr=p.project;
 if(pr){
  var ref=clean(pr.reference)||clean(pr.name);
  if(ref){ if(clean(t.projectRef)&&clean(t.projectRef)!==ref) replaced.push(PKt('sec_project')+': '+clean(t.projectRef)+' -> '+ref);
