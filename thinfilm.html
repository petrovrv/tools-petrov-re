    "en": "Reflectance, transmittance and absorptance of optical coatings versus wavelength and angle, s and p, with measured data of real coating materials: AR coatings, mirrors, edge and band-pass filters, metal mirrors, polarising cubes; colour, field inside the stack, thickness refinement and tolerances.",

  "description": {
    "en": "Build a coating layer by layer (physical thickness or quarter waves at a design wavelength) from measured thin-film materials — MgF₂, SiO₂, Al₂O₃, HfO₂, Si₃N₄, Ta₂O₅, Nb₂O₅, TiO₂, ZnS, Ag, Al, Au, Cr — on catalogue glasses and crystals, or start from a template: single layer, broadband λ/4–λ/2–λ/4 AR, (HL)ᴺH mirror, long- and short-pass edge filters, Fabry–Pérot band-pass, metal mirror, MacNeille polarising cube. See R, T and A against wavelength (linear or 1 − R on a log scale) and against angle, for s, p or their average, with the uncoated rear surface of the plate included incoherently or not. The tool gives the colour of the reflected light under D65 (luminous reflectance and L*a*b*), the standing-wave field |E|² inside the stack, a damped least-squares refinement of the thicknesses towards a target band, and a Monte Carlo of thickness errors with the 5–95 % band of the spectrum.",
    "uk": "Складайте покриття шар за шаром (фізична товщина або чверті хвилі на розрахунковій довжині хвилі) з виміряних плівкових матеріалів — MgF₂, SiO₂, Al₂O₃, HfO₂, Si₃N₄, Ta₂O₅, Nb₂O₅, TiO₂, ZnS, Ag, Al, Au, Cr — на каталожному склі й кристалах або почніть із шаблону: один шар, широкосмугове просвітлення λ/4–λ/2–λ/4, дзеркало (HL)ᴺH, довгохвильовий і короткохвильовий крайові фільтри, смуговий фільтр Фабрі — Перо, металеве дзеркало, поляризаційний куб MacNeille. Бачите R, T і A залежно від довжини хвилі (лінійно або 1 − R у логарифмічній шкалі) і від кута, для s, p або середнього, з некогерентним урахуванням непокритої задньої поверхні пластини чи без нього. Інструмент дає колір відбитого світла під D65 (світловий коефіцієнт відбиття й L*a*b*), поле стоячої хвилі |E|² у стопі, уточнення товщин методом згасаючих найменших квадратів до цільової смуги та Монте-Карло похибок товщин зі смугою спектра 5–95 %.",
    "de": "Bauen Sie eine Beschichtung Schicht für Schicht auf (physikalische Dicke oder Viertelwellen bei einer Entwurfswellenlänge) aus gemessenen Dünnschichtmaterialien — MgF₂, SiO₂, Al₂O₃, HfO₂, Si₃N₄, Ta₂O₅, Nb₂O₅, TiO₂, ZnS, Ag, Al, Au, Cr — auf Katalog-Gläsern und -Kristallen, oder beginnen Sie mit einer Vorlage: Einzelschicht, Breitband-AR λ/4–λ/2–λ/4, Spiegel (HL)ᴺH, Lang- und Kurzpass-Kantenfilter, Fabry–Pérot-Bandpass, Metallspiegel, MacNeille-Polarisationswürfel. R, T und A erscheinen über der Wellenlänge (linear oder 1 − R logarithmisch) und über dem Winkel, für s, p oder ihr Mittel, mit oder ohne inkohärent berücksichtigte unbeschichtete Rückseite. Das Werkzeug liefert die Farbe des reflektierten Lichts unter D65 (Lichtreflexionsgrad und L*a*b*), das Stehwellenfeld |E|² im Stapel, eine Dickenverfeinerung nach gedämpften kleinsten Quadraten auf ein Zielband und eine Monte-Carlo-Analyse von Dickenfehlern mit dem 5–95-%-Band des Spektrums.",
    "nl": "Bouw een coating laag voor laag op (fysieke dikte of kwartgolven bij een ontwerpgolflengte) uit gemeten dunnefilmmaterialen — MgF₂, SiO₂, Al₂O₃, HfO₂, Si₃N₄, Ta₂O₅, Nb₂O₅, TiO₂, ZnS, Ag, Al, Au, Cr — op catalogusglazen en -kristallen, of begin met een sjabloon: enkele laag, breedband-AR λ/4–λ/2–λ/4, spiegel (HL)ᴺH, lang- en kortdoorlaat-kantfilters, Fabry–Pérot-banddoorlaat, metaalspiegel, MacNeille-polariserende kubus. U ziet R, T en A tegen de golflengte (lineair of 1 − R logaritmisch) en tegen de hoek, voor s, p of hun gemiddelde, met of zonder incoherent meegenomen onbehandelde achterzijde. De tool geeft de kleur van het gereflecteerde licht onder D65 (lichtreflectie en L*a*b*), het staandegolfveld |E|² in de stapel, een verfijning van de diktes met gedempte kleinste kwadraten naar een doelband en een Monte-Carlo van diktefouten met de 5–95 %-band van het spectrum.",
    "fr": "Construisez un traitement couche par couche (épaisseur physique ou quarts d’onde à une longueur d’onde de conception) à partir de matériaux en couches minces mesurés — MgF₂, SiO₂, Al₂O₃, HfO₂, Si₃N₄, Ta₂O₅, Nb₂O₅, TiO₂, ZnS, Ag, Al, Au, Cr — sur verres et cristaux de catalogue, ou partez d’un modèle : monocouche, antireflet large bande λ/4–λ/2–λ/4, miroir (HL)ᴺH, filtres à front passe-haut et passe-bas, passe-bande Fabry–Pérot, miroir métallique, cube polariseur de MacNeille. R, T et A s’affichent selon la longueur d’onde (linéaire ou 1 − R en échelle log) et selon l’angle, en s, p ou en moyenne, avec ou sans la face arrière nue prise en compte de façon incohérente. L’outil donne la couleur de la lumière réfléchie sous D65 (réflexion lumineuse et L*a*b*), le champ d’ondes stationnaires |E|² dans l’empilement, un affinage des épaisseurs par moindres carrés amortis vers une bande cible et un Monte-Carlo des erreurs d’épaisseur avec la bande 5–95 % du spectre.",
    "es": "Construya un recubrimiento capa a capa (espesor físico o cuartos de onda a una longitud de onda de diseño) con materiales de capa delgada medidos — MgF₂, SiO₂, Al₂O₃, HfO₂, Si₃N₄, Ta₂O₅, Nb₂O₅, TiO₂, ZnS, Ag, Al, Au, Cr — sobre vidrios y cristales de catálogo, o parta de una plantilla: monocapa, antirreflejante de banda ancha λ/4–λ/2–λ/4, espejo (HL)ᴺH, filtros de borde pasa largas y pasa cortas, pasabanda Fabry–Pérot, espejo metálico, cubo polarizador MacNeille. Verá R, T y A frente a la longitud de onda (lineal o 1 − R en escala logarítmica) y frente al ángulo, en s, p o su media, con o sin la cara posterior sin tratar incluida de forma incoherente. La herramienta da el color de la luz reflejada bajo D65 (reflectancia luminosa y L*a*b*), el campo de onda estacionaria |E|² en la pila, un refinamiento de espesores por mínimos cuadrados amortiguados hacia una banda objetivo y un Monte Carlo de errores de espesor con la banda 5–95 % del espectro.",
    "pl": "Zbuduj powłokę warstwa po warstwie (grubość fizyczna lub ćwierćfale przy projektowej długości fali) z mierzonych materiałów cienkowarstwowych — MgF₂, SiO₂, Al₂O₃, HfO₂, Si₃N₄, Ta₂O₅, Nb₂O₅, TiO₂, ZnS, Ag, Al, Au, Cr — na katalogowych szkłach i kryształach albo zacznij od szablonu: jedna warstwa, szerokopasmowa AR λ/4–λ/2–λ/4, zwierciadło (HL)ᴺH, filtry krawędziowe długo- i krótkofalowe, filtr pasmowy Fabry’ego–Pérota, lustro metaliczne, kostka polaryzacyjna MacNeille’a. R, T i A widać w funkcji długości fali (liniowo lub 1 − R w skali logarytmicznej) i kąta, dla s, p lub ich średniej, z niekoherentnie uwzględnioną niepokrytą tylną powierzchnią płytki lub bez niej. Narzędzie podaje barwę światła odbitego w D65 (współczynnik odbicia światła i L*a*b*), pole fali stojącej |E|² w stosie, dopracowanie grubości metodą tłumionych najmniejszych kwadratów do pasma docelowego i analizę Monte Carlo błędów grubości z pasmem widma 5–95 %."

  "limitations": {
    "en": "Flat, homogeneous, isotropic layers with sharp interfaces (characteristic-matrix method); no roughness, inhomogeneity, birefringence, scattering or stress. Film data are published measurements of one deposition process each — your coater’s indices may differ by several hundredths. Outside the tabulated range of a material the edge value is held constant (a warning names the material). The substrate is non-absorbing; its rear surface is uncoated and added incoherently. The incident medium must be transparent. Colour uses CIE 1931 2° and D65 at 5 nm. Refinement is local (nearest good design), and the Monte Carlo varies thickness only.",
    "uk": "Плоскі, однорідні, ізотропні шари з різкими межами (метод характеристичних матриць); без шорсткості, неоднорідності, двозаломлення, розсіяння й напружень. Дані плівок — опубліковані виміри одного процесу нанесення кожен; показники вашої установки можуть відрізнятися на кілька сотих. Поза табличним діапазоном матеріалу утримується крайове значення (попередження називає матеріал). Підкладка не поглинає; її задня поверхня непокрита й додається некогерентно. Середовище падіння має бути прозорим. Колір — CIE 1931 2° і D65 із кроком 5 нм. Уточнення локальне (найближчий добрий проєкт), Монте-Карло змінює лише товщини.",
    "de": "Ebene, homogene, isotrope Schichten mit scharfen Grenzflächen (Methode der charakteristischen Matrix); keine Rauheit, Inhomogenität, Doppelbrechung, Streuung oder Spannung. Die Schichtdaten sind veröffentlichte Messungen je eines Abscheideprozesses — die Indizes Ihrer Anlage können um einige Hundertstel abweichen. Außerhalb des tabellierten Bereichs eines Materials wird der Randwert konstant gehalten (eine Warnung nennt das Material). Das Substrat absorbiert nicht; seine Rückseite ist unbeschichtet und wird inkohärent addiert. Das Einfallsmedium muss transparent sein. Farbe nach CIE 1931 2° und D65 in 5-nm-Schritten. Die Verfeinerung ist lokal (nächster guter Entwurf), die Monte-Carlo-Analyse variiert nur Dicken.",
    "nl": "Vlakke, homogene, isotrope lagen met scherpe grensvlakken (karakteristieke-matrixmethode); geen ruwheid, inhomogeniteit, dubbelbreking, verstrooiing of spanning. Laaggegevens zijn gepubliceerde metingen van telkens één depositieproces — de indices van uw installatie kunnen enkele honderdsten afwijken. Buiten het getabelleerde bereik van een materiaal wordt de randwaarde constant gehouden (een waarschuwing noemt het materiaal). Het substraat absorbeert niet; de achterzijde is onbehandeld en wordt incoherent opgeteld. Het invalsmedium moet transparant zijn. Kleur volgens CIE 1931 2° en D65 in stappen van 5 nm. De verfijning is lokaal (dichtstbijzijnd goed ontwerp), de Monte-Carlo varieert alleen diktes.",
    "fr": "Couches planes, homogènes, isotropes à interfaces nettes (méthode des matrices caractéristiques) ; ni rugosité, ni inhomogénéité, ni biréfringence, ni diffusion, ni contraintes. Les données de couches sont des mesures publiées d’un seul procédé de dépôt chacune — les indices de votre bâti peuvent différer de quelques centièmes. Hors de la plage tabulée d’un matériau, la valeur au bord est maintenue (un avertissement nomme le matériau). Le substrat n’absorbe pas ; sa face arrière est nue et ajoutée de façon incohérente. Le milieu d’incidence doit être transparent. Couleur selon CIE 1931 2° et D65 au pas de 5 nm. L’affinage est local (solution voisine) et le Monte-Carlo ne fait varier que les épaisseurs.",
    "es": "Capas planas, homogéneas e isótropas con interfaces nítidas (método de la matriz característica); sin rugosidad, inhomogeneidad, birrefringencia, dispersión ni tensiones. Los datos de capas son medidas publicadas de un solo proceso de depósito cada una: los índices de su equipo pueden diferir en varias centésimas. Fuera del intervalo tabulado de un material se mantiene el valor del borde (un aviso nombra el material). El sustrato no absorbe; su cara posterior está sin tratar y se suma de forma incoherente. El medio de incidencia debe ser transparente. Color según CIE 1931 2° y D65 cada 5 nm. El refinamiento es local (el buen diseño más cercano) y el Monte Carlo solo varía espesores.",
    "pl": "Płaskie, jednorodne, izotropowe warstwy o ostrych granicach (metoda macierzy charakterystycznych); bez chropowatości, niejednorodności, dwójłomności, rozpraszania i naprężeń. Dane warstw to opublikowane pomiary jednego procesu nanoszenia każde — współczynniki z Twojej napylarki mogą różnić się o kilka setnych. Poza tabelarycznym zakresem materiału przyjmuje się wartość brzegową (ostrzeżenie podaje materiał). Podłoże nie pochłania; jego tylna powierzchnia jest niepokryta i dodawana niekoherentnie. Ośrodek padania musi być przezroczysty. Barwa według CIE 1931 2° i D65 co 5 nm. Dopracowanie jest lokalne (najbliższy dobry projekt), a Monte Carlo zmienia tylko grubości."
  },

    "benchmarks": [
      {
        "id": "thinfilm-method-2026-11-13",
        "reference": {
          "en": "45 cases against an independent Python reference (recursive Airy summation of Fresnel coefficients with N = n + ik, every spectrum also checked against the tmm package of S. J. Byrnes): closed forms (Fresnel at three angles, Brewster, total internal reflection, quarter- and half-wave layers, quarter-wave stacks, opaque Ag, Al, Au); eleven spectra with the published material data in s and p — single-layer and three-layer AR, a 21-layer laser mirror at 0° and 45°, protected silver, a thin chromium plate and a semi-transparent gold film, a MacNeille cube, a five-material stack at 60°, a soap film; colour from the CIE tables; the field |E|² inside two stacks; and the claim of every preset.",
          "uk": "45 випадків проти незалежної реалізації на Python (рекурсивне підсумовування Ейрі коефіцієнтів Френеля з N = n + ik, кожен спектр додатково звірено з пакетом tmm С. Дж. Бернса): замкнені формули (Френель під трьома кутами, Брюстер, повне внутрішнє відбиття, чверть- і півхвильові шари, чвертьхвильові стопи, непрозорі Ag, Al, Au); одинадцять спектрів з опублікованими даними матеріалів для s і p — одношарове й тришарове просвітлення, 21-шарове лазерне дзеркало під 0° і 45°, захищене срібло, тонка хромова пластина й напівпрозора плівка золота, куб MacNeille, стопа з п’яти матеріалів під 60°, мильна плівка; колір за таблицями CIE; поле |E|² у двох стопах; і твердження кожного прикладу.",
          "de": "45 Fälle gegen eine unabhängige Python-Implementierung (rekursive Airy-Summation der Fresnel-Koeffizienten mit N = n + ik, jedes Spektrum zusätzlich gegen das Paket tmm von S. J. Byrnes geprüft): geschlossene Formeln (Fresnel bei drei Winkeln, Brewster, Totalreflexion, Viertel- und Halbwellenschichten, Viertelwellenstapel, opakes Ag, Al, Au); elf Spektren mit den veröffentlichten Materialdaten in s und p — Ein- und Dreischicht-AR, ein 21-schichtiger Laserspiegel bei 0° und 45°, geschütztes Silber, eine dünne Chromplatte und ein halbdurchlässiger Goldfilm, ein MacNeille-Würfel, ein Stapel aus fünf Materialien bei 60°, eine Seifenhaut; Farbe aus den CIE-Tabellen; das Feld |E|² in zwei Stapeln; und die Aussage jedes Beispiels.",

    var verdict = { tone: 'ok', text: T('At ' + Fm(s.lambda0, 1) + ' nm: ' + RT[0] + pct(R0) + ', ' + RT[1] + pct(T0) + '. Reflected light looks like the swatch in the plot.', 'На ' + Fm(s.lambda0, 1) + ' нм: ' + RT[0] + pct(R0) + ', ' + RT[1] + pct(T0) + '. Відбите світло має колір зразка на графіку.', 'Bei ' + Fm(s.lambda0, 1) + ' nm: ' + RT[0] + pct(R0) + ', ' + RT[1] + pct(T0) + '. Das reflektierte Licht hat die Farbe des Felds im Diagramm.', 'Bij ' + Fm(s.lambda0, 1) + ' nm: ' + RT[0] + pct(R0) + ', ' + RT[1] + pct(T0) + '. Het gereflecteerde licht heeft de kleur van het vlakje in de grafiek.', 'À ' + Fm(s.lambda0, 1) + ' nm : ' + RT[0] + pct(R0) + ', ' + RT[1] + pct(T0) + '. La lumière réfléchie a la couleur de la pastille du tracé.', 'A ' + Fm(s.lambda0, 1) + ' nm: ' + RT[0] + pct(R0) + ', ' + RT[1] + pct(T0) + '. La luz reflejada tiene el color de la muestra del gráfico.', 'Przy ' + Fm(s.lambda0, 1) + ' nm: ' + RT[0] + pct(R0) + ', ' + RT[1] + pct(T0) + '. Światło odbite ma barwę próbki na wykresie.') };
    return sigTiles({ verdict: verdict, tiles: tiles, tables: tables, notes: notes });
  }
  function lab3(a, mid, b) { var o = {}; Object.keys(a).forEach(function (k) { o[k] = a[k] + mid + b[k]; }); return o; }

  /* ============================================================ 9. learn */
  var LEARN = {
    version: 1,
    intro: { title: T('What this tool does', 'Що робить цей інструмент', 'Was dieses Werkzeug tut', 'Wat deze tool doet', 'Ce que fait cet outil', 'Qué hace esta herramienta', 'Co robi to narzędzie'),
      body: T('It computes how much light a stack of thin layers reflects, transmits and absorbs, at every wavelength and angle, for s and p polarisation, with measured optical constants of real coating materials. Start from an example or a design (single layer, broadband AR, mirror, edge or band-pass filter, metal mirror, polarising cube), then change layers, angle and substrate and watch the spectrum, the colour and the field inside the coating.', 'Інструмент обчислює, скільки світла стопа тонких шарів відбиває, пропускає й поглинає на кожній довжині хвилі та під кожним кутом, для s- і p-поляризації, з виміряними оптичними сталими реальних плівкових матеріалів. Почніть із прикладу чи шаблону (один шар, широкосмугове просвітлення, дзеркало, крайовий або смуговий фільтр, металеве дзеркало, поляризаційний куб), потім змінюйте шари, кут і підкладку й стежте за спектром, кольором і полем усередині покриття.', 'Es berechnet, wie viel Licht ein Stapel dünner Schichten bei jeder Wellenlänge und jedem Winkel reflektiert, durchlässt und absorbiert, für s- und p-Polarisation, mit gemessenen optischen Konstanten realer Beschichtungsmaterialien. Beginnen Sie mit einem Beispiel oder Entwurf (Einzelschicht, Breitband-AR, Spiegel, Kanten- oder Bandpassfilter, Metallspiegel, Polarisationswürfel) und ändern Sie dann Schichten, Winkel und Substrat — Spektrum, Farbe und Feld in der Schicht folgen sofort.', 'Het berekent hoeveel licht een stapel dunne lagen reflecteert, doorlaat en absorbeert bij elke golflengte en hoek, voor s- en p-polarisatie, met gemeten optische constanten van echte coatingmaterialen. Begin met een voorbeeld of ontwerp (enkele laag, breedband-AR, spiegel, kant- of banddoorlaatfilter, metaalspiegel, polariserende kubus) en wijzig dan lagen, hoek en substraat — spectrum, kleur en veld in de coating volgen direct.', 'Il calcule la part de lumière qu’un empilement de couches minces réfléchit, transmet et absorbe à chaque longueur d’onde et chaque angle, en polarisation s et p, avec les constantes optiques mesurées de vrais matériaux de traitement. Partez d’un exemple ou d’un modèle (monocouche, antireflet large bande, miroir, filtre à front ou passe-bande, miroir métallique, cube polariseur), puis modifiez couches, angle et substrat : spectre, couleur et champ dans le traitement suivent aussitôt.', 'Calcula cuánta luz refleja, transmite y absorbe una pila de capas delgadas en cada longitud de onda y ángulo, para polarización s y p, con constantes ópticas medidas de materiales de recubrimiento reales. Empiece con un ejemplo o un diseño (monocapa, antirreflejante de banda ancha, espejo, filtro de borde o pasabanda, espejo metálico, cubo polarizador) y cambie capas, ángulo y sustrato: el espectro, el color y el campo dentro del recubrimiento se actualizan al instante.', 'Oblicza, ile światła stos cienkich warstw odbija, przepuszcza i pochłania dla każdej długości fali i kąta, dla polaryzacji s i p, z mierzonymi stałymi optycznymi rzeczywistych materiałów powłokowych. Zacznij od przykładu lub szablonu (jedna warstwa, szerokopasmowa AR, zwierciadło, filtr krawędziowy lub pasmowy, lustro metaliczne, kostka polaryzacyjna), potem zmieniaj warstwy, kąt i podłoże i obserwuj widmo, barwę i pole wewnątrz powłoki.') },
    topics: {
      tmm: { title: T('Characteristic matrix', 'Характеристична матриця', 'Charakteristische Matrix', 'Karakteristieke matrix', 'Matrice caractéristique', 'Matriz característica', 'Macierz charakterystyczna'),
        body: T('Each layer is a 2 × 2 matrix [[cos δ, i sin δ/η], [iη sin δ, cos δ]] with phase thickness δ = 2πNd cosθ/λ and tilted admittance η = N cosθ (s) or N/cosθ (p), N = n − ik. Multiplying the matrices gives the admittance Y of the whole stack and r = (η₀ − Y)/(η₀ + Y). This is exact for flat, homogeneous layers with sharp interfaces (Macleod, ch. 2).', 'Кожен шар — це матриця 2 × 2 [[cos δ, i sin δ/η], [iη sin δ, cos δ]] з фазовою товщиною δ = 2πNd cosθ/λ і нахиленим адмітансом η = N cosθ (s) або N/cosθ (p), N = n − ik. Добуток матриць дає адмітанс Y усієї стопи й r = (η₀ − Y)/(η₀ + Y). Це точно для плоских однорідних шарів із різкими межами (Macleod, розд. 2).', 'Jede Schicht ist eine 2 × 2-Matrix [[cos δ, i sin δ/η], [iη sin δ, cos δ]] mit Phasendicke δ = 2πNd cosθ/λ und geneigter Admittanz η = N cosθ (s) bzw. N/cosθ (p), N = n − ik. Das Produkt der Matrizen liefert die Admittanz Y des Stapels und r = (η₀ − Y)/(η₀ + Y). Exakt für ebene, homogene Schichten mit scharfen Grenzflächen (Macleod, Kap. 2).', 'Elke laag is een 2 × 2-matrix [[cos δ, i sin δ/η], [iη sin δ, cos δ]] met fasedikte δ = 2πNd cosθ/λ en gekantelde admittantie η = N cosθ (s) of N/cosθ (p), N = n − ik. Het product van de matrices geeft de admittantie Y van de stapel en r = (η₀ − Y)/(η₀ + Y). Exact voor vlakke, homogene lagen met scherpe grensvlakken (Macleod, hfst. 2).', 'Chaque couche est une matrice 2 × 2 [[cos δ, i sin δ/η], [iη sin δ, cos δ]] d’épaisseur de phase δ = 2πNd cosθ/λ et d’admittance inclinée η = N cosθ (s) ou N/cosθ (p), N = n − ik. Le produit des matrices donne l’admittance Y de l’empilement et r = (η₀ − Y)/(η₀ + Y). C’est exact pour des couches planes, homogènes, à interfaces nettes (Macleod, ch. 2).', 'Cada capa es una matriz 2 × 2 [[cos δ, i sen δ/η], [iη sen δ, cos δ]] con espesor de fase δ = 2πNd cosθ/λ y admitancia inclinada η = N cosθ (s) o N/cosθ (p), N = n − ik. El producto de las matrices da la admitancia Y de la pila y r = (η₀ − Y)/(η₀ + Y). Es exacto para capas planas y homogéneas con interfaces nítidas (Macleod, cap. 2).', 'Każda warstwa to macierz 2 × 2 [[cos δ, i sin δ/η], [iη sin δ, cos δ]] o grubości fazowej δ = 2πNd cosθ/λ i pochylonej admitancji η = N cosθ (s) lub N/cosθ (p), N = n − ik. Iloczyn macierzy daje admitancję Y całego stosu i r = (η₀ − Y)/(η₀ + Y). Wynik jest dokładny dla płaskich, jednorodnych warstw o ostrych granicach (Macleod, rozdz. 2).') },
      qw: { title: T('Quarter waves (QWOT)', 'Чверть хвилі (QWOT)', 'Viertelwellen (QWOT)', 'Kwartgolven (QWOT)', 'Quarts d’onde (QWOT)', 'Cuartos de onda (QWOT)', 'Ćwierćfale (QWOT)'),
        body: T('A layer of optical thickness nd = λ₀/4 (one QWOT) turns the reflections from its two faces half a wave apart at λ₀; two QWOT (a half wave) is “absent” at λ₀. Thickness in QWOT is the coater’s language: d = QWOT · λ₀/(4n).', 'Шар оптичної товщини nd = λ₀/4 (одна QWOT) зсуває відбиття від двох його меж на пів хвилі на λ₀; дві QWOT (пів хвилі) на λ₀ ніби «відсутні». Товщина в QWOT — мова технологів: d = QWOT · λ₀/(4n).', 'Eine Schicht der optischen Dicke nd = λ₀/4 (eine QWOT) verschiebt die Reflexe ihrer beiden Flächen bei λ₀ um eine halbe Welle; zwei QWOT (Halbwelle) sind bei λ₀ „abwesend“. QWOT ist die Sprache der Beschichter: d = QWOT · λ₀/(4n).', 'Een laag met optische dikte nd = λ₀/4 (één QWOT) zet de reflecties van haar twee vlakken bij λ₀ een halve golf uit elkaar; twee QWOT (halve golf) is bij λ₀ „afwezig”. QWOT is de taal van de coater: d = QWOT · λ₀/(4n).', 'Une couche d’épaisseur optique nd = λ₀/4 (un QWOT) décale d’une demi-onde à λ₀ les réflexions de ses deux faces ; deux QWOT (demi-onde) sont « absents » à λ₀. Le QWOT est la langue du traiteur : d = QWOT · λ₀/(4n).', 'Una capa de espesor óptico nd = λ₀/4 (un QWOT) desfasa media onda en λ₀ las reflexiones de sus dos caras; dos QWOT (media onda) están «ausentes» en λ₀. El QWOT es el idioma del recubridor: d = QWOT · λ₀/(4n).', 'Warstwa o grubości optycznej nd = λ₀/4 (jedna QWOT) przesuwa odbicia od swoich dwóch powierzchni o pół fali przy λ₀; dwie QWOT (półfala) są przy λ₀ „nieobecne”. QWOT to język technologa: d = QWOT · λ₀/(4n).') },
      ar: { title: T('Antireflection', 'Просвітлення', 'Entspiegelung', 'Antireflectie', 'Antireflet', 'Antirreflejante', 'Antyrefleks'),
        body: T('A single quarter-wave layer leaves R = ((n₀n_s − n₁²)/(n₀n_s + n₁²))², zero only if n₁ = √(n₀n_s). Two layers (V-coat) reach zero at one wavelength; three or more (λ/4–λ/2–λ/4 and beyond) flatten R over the visible.', 'Один чвертьхвильовий шар залишає R = ((n₀n_s − n₁²)/(n₀n_s + n₁²))², нуль лише при n₁ = √(n₀n_s). Два шари (V-покриття) дають нуль на одній довжині хвилі; три й більше (λ/4–λ/2–λ/4 тощо) вирівнюють R у видимій області.', 'Eine Viertelwellenschicht lässt R = ((n₀n_s − n₁²)/(n₀n_s + n₁²))², null nur bei n₁ = √(n₀n_s). Zwei Schichten (V-Beschichtung) erreichen null bei einer Wellenlänge; drei und mehr (λ/4–λ/2–λ/4 usw.) machen R im Sichtbaren flach.', 'Eén kwartgolflaag laat R = ((n₀n_s − n₁²)/(n₀n_s + n₁²))², nul alleen als n₁ = √(n₀n_s). Twee lagen (V-coating) halen nul bij één golflengte; drie of meer (λ/4–λ/2–λ/4 enz.) maken R vlak over het zichtbare.', 'Une couche quart d’onde laisse R = ((n₀n_s − n₁²)/(n₀n_s + n₁²))², nul seulement si n₁ = √(n₀n_s). Deux couches (traitement en V) atteignent zéro à une longueur d’onde ; trois ou plus (λ/4–λ/2–λ/4, etc.) aplanissent R sur le visible.', 'Una capa de cuarto de onda deja R = ((n₀n_s − n₁²)/(n₀n_s + n₁²))², cero solo si n₁ = √(n₀n_s). Dos capas (en V) llegan a cero en una longitud de onda; tres o más (λ/4–λ/2–λ/4, etc.) aplanan R en el visible.', 'Jedna warstwa ćwierćfalowa zostawia R = ((n₀n_s − n₁²)/(n₀n_s + n₁²))², zero tylko gdy n₁ = √(n₀n_s). Dwie warstwy (powłoka V) dają zero przy jednej długości fali; trzy i więcej (λ/4–λ/2–λ/4 itd.) spłaszczają R w zakresie widzialnym.') },
      hr: { title: T('Dielectric mirrors', 'Діелектричні дзеркала', 'Dielektrische Spiegel', 'Diëlektrische spiegels', 'Miroirs diélectriques', 'Espejos dieléctricos', 'Zwierciadła dielektryczne'),
        body: T('Alternating high and low quarter waves (HL)ᴺH add all reflections in phase: R = ((1 − Y)/(1 + Y))² with Y = (n_H/n_L)²ᴺ n_H²/n_s. The high-reflection band has the width Δg = (4/π) arcsin((n_H − n_L)/(n_H + n_L)) in g = λ₀/λ; outside it the stack is a poor mirror. Losses are quoted in ppm (1 − R).', 'Чергування високих і низьких чвертьхвильових шарів (HL)ᴺH складає всі відбиття у фазі: R = ((1 − Y)/(1 + Y))², Y = (n_H/n_L)²ᴺ n_H²/n_s. Ширина смуги високого відбиття Δg = (4/π) arcsin((n_H − n_L)/(n_H + n_L)) у g = λ₀/λ; поза нею стопа — погане дзеркало. Втрати подають у ppm (1 − R).', 'Abwechselnd hoch- und niedrigbrechende Viertelwellen (HL)ᴺH addieren alle Reflexe phasengleich: R = ((1 − Y)/(1 + Y))² mit Y = (n_H/n_L)²ᴺ n_H²/n_s. Das Reflexionsband hat die Breite Δg = (4/π) arcsin((n_H − n_L)/(n_H + n_L)) in g = λ₀/λ; außerhalb ist der Stapel ein schlechter Spiegel. Verluste werden in ppm (1 − R) angegeben.', 'Afwisselend hoog- en laagbrekende kwartgolven (HL)ᴺH tellen alle reflecties in fase op: R = ((1 − Y)/(1 + Y))² met Y = (n_H/n_L)²ᴺ n_H²/n_s. De reflectieband is Δg = (4/π) arcsin((n_H − n_L)/(n_H + n_L)) breed in g = λ₀/λ; daarbuiten is de stapel een slechte spiegel. Verliezen worden in ppm (1 − R) opgegeven.', 'Des quarts d’onde haut et bas indice alternés (HL)ᴺH additionnent toutes les réflexions en phase : R = ((1 − Y)/(1 + Y))² avec Y = (n_H/n_L)²ᴺ n_H²/n_s. La bande réfléchissante a la largeur Δg = (4/π) arcsin((n_H − n_L)/(n_H + n_L)) en g = λ₀/λ ; hors de cette bande l’empilement est un piètre miroir. Les pertes se donnent en ppm (1 − R).', 'Cuartos de onda alternos de alto y bajo índice (HL)ᴺH suman todas las reflexiones en fase: R = ((1 − Y)/(1 + Y))² con Y = (n_H/n_L)²ᴺ n_H²/n_s. La banda reflectante mide Δg = (4/π) arcsen((n_H − n_L)/(n_H + n_L)) en g = λ₀/λ; fuera de ella la pila es un mal espejo. Las pérdidas se dan en ppm (1 − R).', 'Naprzemienne ćwierćfale o wysokim i niskim współczynniku (HL)ᴺH sumują wszystkie odbicia w fazie: R = ((1 − Y)/(1 + Y))², Y = (n_H/n_L)²ᴺ n_H²/n_s. Pasmo wysokiego odbicia ma szerokość Δg = (4/π) arcsin((n_H − n_L)/(n_H + n_L)) w g = λ₀/λ; poza nim stos jest słabym lustrem. Straty podaje się w ppm (1 − R).') },
      angle: { title: T('Angle of incidence', 'Кут падіння', 'Einfallswinkel', 'Invalshoek', 'Angle d’incidence', 'Ángulo de incidencia', 'Kąt padania'),
        body: T('Tilting a coating shortens its phase thicknesses by cosθ inside each layer, so every feature moves to shorter wavelengths (blue shift), and s and p split because their admittances differ. Edge filters, dichroics and band-passes must be designed for their angle of use.', 'Нахил покриття зменшує фазові товщини на cosθ у кожному шарі, тому всі особливості спектра зсуваються до коротших хвиль (синій зсув), а s і p розходяться, бо їхні адмітанси різні. Крайові, дихроїчні й смугові фільтри проєктують під робочий кут.', 'Kippen verkürzt die Phasendicken um cosθ in jeder Schicht, sodass alle Merkmale zu kürzeren Wellenlängen wandern (Blauverschiebung), und s und p trennen sich, weil ihre Admittanzen verschieden sind. Kantenfilter, Dichroiten und Bandpässe sind für ihren Einsatzwinkel auszulegen.', 'Kantelen verkort de fasediktes met cosθ in elke laag, zodat alle kenmerken naar kortere golflengten schuiven (blauwverschuiving), en s en p splitsen omdat hun admittanties verschillen. Kantfilters, dichroïsche spiegels en banddoorlaatfilters ontwerp je voor hun gebruikshoek.', 'Incliner un traitement réduit les épaisseurs de phase d’un facteur cosθ dans chaque couche : tout le spectre glisse vers le bleu, et s et p se séparent car leurs admittances diffèrent. Filtres à front, dichroïques et passe-bandes se conçoivent pour leur angle d’usage.', 'Inclinar un recubrimiento acorta las fases en cosθ dentro de cada capa, de modo que todo el espectro se desplaza al azul, y s y p se separan porque sus admitancias difieren. Los filtros de borde, dicroicos y pasabanda se diseñan para su ángulo de uso.', 'Pochylenie powłoki skraca grubości fazowe o cosθ w każdej warstwie, więc całe widmo przesuwa się ku krótszym falom (przesunięcie ku niebieskiemu), a s i p rozchodzą się, bo ich admitancje są różne. Filtry krawędziowe, dichroiki i filtry pasmowe projektuje się na kąt pracy.') },
      polar: { title: T('s and p polarisation, Brewster', 'Поляризація s і p, Брюстер', 's- und p-Polarisation, Brewster', 's- en p-polarisatie, Brewster', 'Polarisations s et p, Brewster', 'Polarización s y p, Brewster', 'Polaryzacja s i p, Brewster'),
        body: T('s has the electric field perpendicular to the plane of incidence, p parallel to it. At Brewster’s angle tanθ_B = n₂/n₁ a bare surface reflects no p light. A MacNeille cube places H/L interfaces at their Brewster angle inside glass: p passes, s meets a quarter-wave mirror.', 's має електричне поле, перпендикулярне до площини падіння, p — паралельне їй. Під кутом Брюстера tgθ_B = n₂/n₁ непокрита поверхня не відбиває p-світла. Куб MacNeille ставить межі H/L під їхній кут Брюстера всередині скла: p проходить, s натрапляє на чвертьхвильове дзеркало.', 'Bei s steht das elektrische Feld senkrecht zur Einfallsebene, bei p parallel dazu. Unter dem Brewster-Winkel tanθ_B = n₂/n₁ reflektiert eine unbeschichtete Fläche kein p-Licht. Ein MacNeille-Würfel legt die H/L-Grenzflächen im Glas unter ihren Brewster-Winkel: p geht durch, s trifft auf einen Viertelwellenspiegel.', 'Bij s staat het elektrische veld loodrecht op het invalsvlak, bij p evenwijdig. Onder de brewsterhoek tanθ_B = n₂/n₁ reflecteert een onbehandeld vlak geen p-licht. Een MacNeille-kubus zet de H/L-grensvlakken in glas onder hun brewsterhoek: p gaat door, s ziet een kwartgolfspiegel.', 'En s le champ électrique est perpendiculaire au plan d’incidence, en p il lui est parallèle. À l’angle de Brewster tanθ_B = n₂/n₁ une surface nue ne réfléchit pas la lumière p. Un cube de MacNeille place les interfaces H/L à leur angle de Brewster dans le verre : p passe, s rencontre un miroir quart d’onde.', 'En s el campo eléctrico es perpendicular al plano de incidencia, en p paralelo a él. En el ángulo de Brewster tanθ_B = n₂/n₁ una superficie desnuda no refleja luz p. Un cubo MacNeille coloca las interfaces H/L en su ángulo de Brewster dentro del vidrio: p pasa, s encuentra un espejo de cuarto de onda.', 'W polaryzacji s pole elektryczne jest prostopadłe do płaszczyzny padania, w p — równoległe. Pod kątem Brewstera tgθ_B = n₂/n₁ goła powierzchnia nie odbija światła p. Kostka MacNeille’a ustawia granice H/L w szkle pod ich kątem Brewstera: p przechodzi, s trafia na zwierciadło ćwierćfalowe.') },
      metals: { title: T('Metals and absorption', 'Метали й поглинання', 'Metalle und Absorption', 'Metalen en absorptie', 'Métaux et absorption', 'Metales y absorción', 'Metale i absorpcja'),
        body: T('Metals have a large k: light dies within tens of nanometres and what is not reflected is absorbed (A = 1 − R − T). Silver is the best visible/NIR reflector but tarnishes, aluminium covers the UV but has an absorption band near 800 nm, gold is excellent beyond 650 nm. A dielectric overcoat protects the metal and shifts R slightly.', 'Метали мають великий k: світло згасає за десятки нанометрів, і все, що не відбилося, поглинається (A = 1 − R − T). Срібло — найкращий відбивач у видимій і ближній ІЧ області, але тьмяніє; алюміній охоплює УФ, але має смугу поглинання біля 800 нм; золото чудове понад 650 нм. Діелектричний захисний шар береже метал і трохи змінює R.', 'Metalle haben ein großes k: Licht erlischt nach einigen zehn Nanometern, und was nicht reflektiert wird, wird absorbiert (A = 1 − R − T). Silber reflektiert im Sichtbaren/NIR am besten, läuft aber an; Aluminium deckt das UV ab, hat aber ein Absorptionsband bei 800 nm; Gold ist über 650 nm ausgezeichnet. Eine dielektrische Schutzschicht schützt das Metall und verändert R leicht.', 'Metalen hebben een grote k: licht dooft binnen enkele tientallen nanometers uit en wat niet wordt gereflecteerd, wordt geabsorbeerd (A = 1 − R − T). Zilver reflecteert het best in zichtbaar/NIR maar dofft; aluminium dekt het UV maar heeft een absorptieband rond 800 nm; goud is uitstekend boven 650 nm. Een diëlektrische beschermlaag beschermt het metaal en verandert R iets.', 'Les métaux ont un k élevé : la lumière s’éteint en quelques dizaines de nanomètres et ce qui n’est pas réfléchi est absorbé (A = 1 − R − T). L’argent est le meilleur réflecteur visible/proche IR mais se ternit, l’aluminium couvre l’UV mais a une bande d’absorption vers 800 nm, l’or excelle au-delà de 650 nm. Une surcouche diélectrique protège le métal et modifie un peu R.', 'Los metales tienen un k grande: la luz se extingue en decenas de nanómetros y lo que no se refleja se absorbe (A = 1 − R − T). La plata es el mejor reflector visible/IR cercano pero se oscurece; el aluminio cubre el UV pero tiene una banda de absorción cerca de 800 nm; el oro es excelente por encima de 650 nm. Una capa dieléctrica protege el metal y cambia algo R.', 'Metale mają duże k: światło gaśnie na kilkudziesięciu nanometrach, a to, co się nie odbije, jest pochłaniane (A = 1 − R − T). Srebro najlepiej odbija w zakresie widzialnym i bliskiej podczerwieni, ale matowieje; aluminium obejmuje UV, lecz ma pasmo absorpcji przy 800 nm; złoto jest znakomite powyżej 650 nm. Dielektryczna warstwa ochronna chroni metal i nieco zmienia R.') },
      colour: { title: T('Colour of a coating', 'Колір покриття', 'Farbe einer Beschichtung', 'Kleur van een coating', 'Couleur d’un traitement', 'Color de un recubrimiento', 'Barwa powłoki'),
        body: T('The reflected spectrum under daylight D65 is weighted with the CIE 1931 colour-matching functions (official CIE tables, 5 nm): Y is the luminous reflectance, L*a*b* the colour as coaters specify it. The swatch in the plot is brightened so that faint residual colours of AR coatings stay visible.', 'Спектр відбиття під денним світлом D65 зважено функціями узгодження кольорів CIE 1931 (офіційні таблиці CIE, крок 5 нм): Y — світловий коефіцієнт відбиття, L*a*b* — колір, як його задають технологи. Зразок на графіку висвітлено, щоб слабкі залишкові кольори просвітлення було видно.', 'Das reflektierte Spektrum unter Tageslicht D65 wird mit den CIE-1931-Normspektralwerten gewichtet (offizielle CIE-Tabellen, 5 nm): Y ist der Lichtreflexionsgrad, L*a*b* die Farbe, wie Beschichter sie spezifizieren. Das Farbfeld im Diagramm ist aufgehellt, damit schwache Restfarben von AR-Schichten sichtbar bleiben.', 'Het gereflecteerde spectrum onder daglicht D65 wordt gewogen met de CIE 1931-kleurafstemmingsfuncties (officiële CIE-tabellen, 5 nm): Y is de lichtreflectie, L*a*b* de kleur zoals coaters die specificeren. Het kleurvlakje in de grafiek is opgehelderd zodat zwakke restkleuren van AR-coatings zichtbaar blijven.', 'Le spectre réfléchi sous l’illuminant D65 est pondéré par les fonctions colorimétriques CIE 1931 (tables officielles CIE, pas de 5 nm) : Y est la réflexion lumineuse, L*a*b* la couleur telle que la spécifient les traiteurs. La pastille du tracé est éclaircie pour que les faibles couleurs résiduelles d’un antireflet restent visibles.', 'El espectro reflejado bajo luz de día D65 se pondera con las funciones de igualación CIE 1931 (tablas oficiales de la CIE, 5 nm): Y es la reflectancia luminosa, L*a*b* el color como lo especifican los recubridores. La muestra del gráfico se aclara para que los colores residuales débiles de un antirreflejante sigan visibles.', 'Widmo odbite w świetle dziennym D65 jest ważone funkcjami dopasowania barw CIE 1931 (oficjalne tablice CIE, krok 5 nm): Y to współczynnik odbicia światła, L*a*b* to barwa, w jakiej technolodzy ją specyfikują. Próbka na wykresie jest rozjaśniona, aby słabe barwy szczątkowe powłok AR były widoczne.') },
      field: { title: T('Field inside the coating', 'Поле всередині покриття', 'Feld in der Beschichtung', 'Veld in de coating', 'Champ dans le traitement', 'Campo dentro del recubrimiento', 'Pole wewnątrz powłoki'),
        body: T('|E|² relative to the incident wave shows standing waves in the stack. Laser damage starts where |E|² peaks, preferably not at an interface or in the high-index (more absorbing) material — a reason for non-quarter-wave outer layers in high-power mirrors.', '|E|² відносно падаючої хвилі показує стоячі хвилі в стопі. Лазерне пошкодження починається там, де |E|² найбільше, — краще, щоб це було не на межі й не у високозаломлювальному (більш поглинальному) матеріалі; тому в потужних дзеркалах зовнішні шари роблять не чвертьхвильовими.', '|E|² relativ zur einfallenden Welle zeigt die stehenden Wellen im Stapel. Laserschäden beginnen dort, wo |E|² am größten ist — möglichst nicht an einer Grenzfläche oder im hochbrechenden (stärker absorbierenden) Material; deshalb haben Hochleistungsspiegel Außenschichten abweichend von λ/4.', '|E|² ten opzichte van de invallende golf toont staande golven in de stapel. Laserschade begint waar |E|² piekt, liefst niet op een grensvlak of in het hoogbrekende (sterker absorberende) materiaal — daarom hebben hoogvermogenspiegels buitenlagen die afwijken van λ/4.', '|E|² rapporté à l’onde incidente montre les ondes stationnaires dans l’empilement. L’endommagement laser naît là où |E|² culmine, de préférence ni à une interface ni dans le matériau haut indice (plus absorbant) — d’où des couches externes non quart d’onde dans les miroirs de puissance.', '|E|² respecto a la onda incidente muestra las ondas estacionarias en la pila. El daño láser empieza donde |E|² es máximo, mejor que no sea en una interfaz ni en el material de alto índice (más absorbente); por eso los espejos de alta potencia tienen capas externas distintas de λ/4.', '|E|² względem fali padającej pokazuje fale stojące w stosie. Uszkodzenie laserowe zaczyna się tam, gdzie |E|² jest największe — najlepiej nie na granicy ani w materiale o wysokim współczynniku (silniej pochłaniającym); stąd w lustrach dużej mocy warstwy zewnętrzne inne niż λ/4.') },
      refine: { title: T('Refinement', 'Уточнення', 'Verfeinerung', 'Verfijning', 'Affinage', 'Refinamiento', 'Dopracowanie'),
        body: T('Damped least squares (Levenberg–Marquardt) changes the physical thicknesses of all layers to bring R or T close to the target over the band you set. It finds the nearest good design, not the global best: start from a sensible design and the right materials.', 'Метод згасаючих найменших квадратів (Левенберга — Марквардта) змінює фізичні товщини всіх шарів, щоб наблизити R або T до цілі в заданій смузі. Він знаходить найближчий добрий проєкт, а не глобально найкращий: починайте з розумного проєкту й правильних матеріалів.', 'Gedämpfte kleinste Quadrate (Levenberg–Marquardt) ändern die physikalischen Dicken aller Schichten, um R oder T im gewählten Band dem Ziel anzunähern. Gefunden wird der nächste gute Entwurf, nicht der global beste: von einem sinnvollen Entwurf und den richtigen Materialien ausgehen.', 'Gedempte kleinste kwadraten (Levenberg–Marquardt) wijzigen de fysieke diktes van alle lagen om R of T over de gekozen band dicht bij het doel te brengen. Het vindt het dichtstbijzijnde goede ontwerp, niet het globaal beste: begin met een zinnig ontwerp en de juiste materialen.', 'Les moindres carrés amortis (Levenberg–Marquardt) modifient les épaisseurs physiques de toutes les couches pour approcher R ou T de la cible sur la bande choisie. On obtient la solution voisine, pas l’optimum global : partez d’une conception sensée et des bons matériaux.', 'Los mínimos cuadrados amortiguados (Levenberg–Marquardt) cambian los espesores físicos de todas las capas para acercar R o T al objetivo en la banda elegida. Encuentran el buen diseño más cercano, no el óptimo global: parta de un diseño razonable y de los materiales adecuados.', 'Tłumione najmniejsze kwadraty (Levenberg–Marquardt) zmieniają grubości fizyczne wszystkich warstw, aby zbliżyć R lub T do celu w wybranym paśmie. Znajdują najbliższy dobry projekt, nie globalnie najlepszy: zacznij od rozsądnego projektu i właściwych materiałów.') },
      mc: { title: T('Thickness errors', 'Похибки товщин', 'Dickenfehler', 'Diktefouten', 'Erreurs d’épaisseur', 'Errores de espesor', 'Błędy grubości'),
        body: T('Real coaters hit each thickness to about 0.5–2 %. The Monte Carlo view draws many coatings with independent normal errors and shows the 5–95 % band of R: a design whose band stays inside your specification is producible.', 'Реальні установки витримують кожну товщину з точністю близько 0,5–2 %. Вигляд Монте-Карло генерує багато покриттів із незалежними нормальними похибками й показує смугу R від 5 % до 95 %: проєкт, смуга якого лишається в межах вимог, можна виготовити.', 'Reale Anlagen treffen jede Dicke auf etwa 0,5–2 %. Die Monte-Carlo-Ansicht erzeugt viele Beschichtungen mit unabhängigen normalverteilten Fehlern und zeigt das 5–95-%-Band von R: Ein Entwurf, dessen Band in der Spezifikation bleibt, ist fertigbar.', 'Echte coaters halen elke dikte op ongeveer 0,5–2 %. De Monte-Carloweergave trekt veel coatings met onafhankelijke normale fouten en toont de 5–95 %-band van R: een ontwerp waarvan de band binnen de specificatie blijft, is maakbaar.', 'Les bâtis réels tiennent chaque épaisseur à environ 0,5–2 %. La vue Monte-Carlo tire de nombreux traitements avec des erreurs normales indépendantes et montre la bande 5–95 % de R : une conception dont la bande reste dans la spécification est fabricable.', 'Las cámaras reales aciertan cada espesor con un 0,5–2 % aproximadamente. La vista Monte Carlo genera muchos recubrimientos con errores normales independientes y muestra la banda 5–95 % de R: un diseño cuya banda queda dentro de la especificación es fabricable.', 'Rzeczywiste napylarki trafiają w każdą grubość z dokładnością ok. 0,5–2 %. Widok Monte Carlo losuje wiele powłok z niezależnymi błędami normalnymi i pokazuje pasmo R od 5 do 95 %: projekt, którego pasmo mieści się w specyfikacji, da się wykonać.') },
      backside: { title: T('Rear surface', 'Задня поверхня', 'Rückseite', 'Achterzijde', 'Face arrière', 'Cara posterior', 'Tylna powierzchnia'),
        body: T('A window has two faces. The substrate (millimetres) is much thicker than the coherence length of ordinary light, so the rear reflection adds in intensity, not amplitude: R = R₁ + T₁²R₂/(1 − R₁′R₂). Bare N-BK7 therefore reflects 8 %, not 4 %. Switch it off to see one surface, as coaters quote it.', 'Вікно має дві поверхні. Підкладка (міліметри) значно товща за довжину когерентності звичайного світла, тому відбиття від задньої поверхні додається за інтенсивністю, а не амплітудою: R = R₁ + T₁²R₂/(1 − R₁′R₂). Тож непокрите N-BK7 відбиває 8 %, а не 4 %. Вимкніть, щоб бачити одну поверхню, як її подають технологи.', 'Ein Fenster hat zwei Flächen. Das Substrat (Millimeter) ist viel dicker als die Kohärenzlänge gewöhnlichen Lichts, daher addiert sich der Rückseitenreflex in der Intensität, nicht in der Amplitude: R = R₁ + T₁²R₂/(1 − R₁′R₂). Unbeschichtetes N-BK7 reflektiert deshalb 8 %, nicht 4 %. Ausschalten zeigt eine Fläche, wie Beschichter sie angeben.', 'Een venster heeft twee vlakken. Het substraat (millimeters) is veel dikker dan de coherentielengte van gewoon licht, dus de reflectie van de achterzijde telt op in intensiteit, niet in amplitude: R = R₁ + T₁²R₂/(1 − R₁′R₂). Onbehandeld N-BK7 reflecteert daarom 8 %, niet 4 %. Zet het uit om één vlak te zien, zoals coaters het opgeven.', 'Une fenêtre a deux faces. Le substrat (millimètres) est bien plus épais que la longueur de cohérence de la lumière ordinaire : la réflexion arrière s’ajoute en intensité, non en amplitude : R = R₁ + T₁²R₂/(1 − R₁′R₂). Le N-BK7 nu réfléchit donc 8 %, pas 4 %. Désactivez-la pour voir une seule face, comme l’indiquent les traiteurs.', 'Una ventana tiene dos caras. El sustrato (milímetros) es mucho más grueso que la longitud de coherencia de la luz ordinaria, así que la reflexión posterior se suma en intensidad, no en amplitud: R = R₁ + T₁²R₂/(1 − R₁′R₂). Por eso el N-BK7 desnudo refleja el 8 %, no el 4 %. Desactívela para ver una sola cara, como la indican los recubridores.', 'Okno ma dwie powierzchnie. Podłoże (milimetry) jest znacznie grubsze od drogi koherencji zwykłego światła, więc odbicie od tyłu dodaje się w natężeniu, nie w amplitudzie: R = R₁ + T₁²R₂/(1 − R₁′R₂). Gołe N-BK7 odbija więc 8 %, nie 4 %. Wyłącz, aby zobaczyć jedną powierzchnię, tak jak podają ją technolodzy.') },
      data: { title: T('Material data', 'Дані матеріалів', 'Materialdaten', 'Materiaalgegevens', 'Données des matériaux', 'Datos de materiales', 'Dane materiałowe'),
        body: T('Coating materials are measured films from the refractiveindex.info database (CC0; source paper and deposition method in the table), substrates are catalogue glasses and crystals. Film indices depend on the process — evaporated, sputtered or ALD layers of the same oxide differ by several hundredths; use “Custom n, k” for your own measured values.', 'Плівкові матеріали — виміряні плівки з бази refractiveindex.info (CC0; джерело й метод нанесення в таблиці), підкладки — каталожне скло й кристали. Показники плівок залежать від процесу: напилені, розпилені чи ALD-шари того самого оксиду відрізняються на кілька сотих; для власних вимірів використовуйте «Власні n, k».', 'Beschichtungsmaterialien sind gemessene Schichten aus der Datenbank refractiveindex.info (CC0; Quelle und Abscheideverfahren in der Tabelle), Substrate sind Katalog-Gläser und -Kristalle. Schichtindizes hängen vom Prozess ab — aufgedampfte, gesputterte oder ALD-Schichten desselben Oxids unterscheiden sich um einige Hundertstel; für eigene Messwerte „Eigene n, k“ nutzen.', 'Coatingmaterialen zijn gemeten lagen uit de database refractiveindex.info (CC0; bron en depositiemethode in de tabel), substraten zijn catalogusglazen en -kristallen. Laagindices hangen af van het proces — opgedampte, gesputterde of ALD-lagen van hetzelfde oxide verschillen enkele honderdsten; gebruik „Eigen n, k” voor eigen meetwaarden.', 'Les matériaux de traitement sont des couches mesurées de la base refractiveindex.info (CC0 ; source et procédé de dépôt dans le tableau), les substrats sont des verres et cristaux de catalogue. L’indice d’une couche dépend du procédé — couches évaporées, pulvérisées ou ALD d’un même oxyde diffèrent de quelques centièmes ; utilisez « n, k personnalisés » pour vos propres mesures.', 'Los materiales de recubrimiento son capas medidas de la base refractiveindex.info (CC0; fuente y método de depósito en la tabla); los sustratos son vidrios y cristales de catálogo. El índice de una capa depende del proceso: capas evaporadas, pulverizadas o ALD del mismo óxido difieren en varias centésimas; use «n, k propios» para sus medidas.', 'Materiały powłokowe to zmierzone warstwy z bazy refractiveindex.info (CC0; źródło i metoda nanoszenia w tabeli), podłoża to katalogowe szkła i kryształy. Współczynnik warstwy zależy od procesu — warstwy naparowane, rozpylane lub ALD tego samego tlenku różnią się o kilka setnych; dla własnych pomiarów użyj „Własne n, k”.') }
    },
    tour: [

      { id: 'stack', slot: 'stage', title: T('Coating', 'Покриття', 'Beschichtung', 'Coating', 'Traitement', 'Recubrimiento', 'Powłoka'), learn: 'tmm', fields: [
        { id: 'f-inc', key: 'incident', type: 'select', options: INC_OPTS, label: T('Incident medium', 'Середовище падіння', 'Einfallsmedium', 'Invalsmedium', 'Milieu d’incidence', 'Medio de incidencia', 'Ośrodek padania') },
