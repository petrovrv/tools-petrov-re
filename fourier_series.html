/* ============================ Waveform target functions ============================ */
// All defined on x in [0, 2π), period 2π, unit amplitude reference.
function targetValue(type, x, duty){
  const t = ((x % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  switch(type){
    case "square":   return t < Math.PI ? 1 : -1;
    case "sawtooth": return t < Math.PI ? (t/Math.PI) : (t/Math.PI - 2); // rises -1..1, sawtooth (odd)
    case "triangle": { // peak +1 at x=pi/2 style; use standard: 1 - 4|...|
      // triangle: value = (2/pi)*asin(sin(x)) -> ranges -1..1, matches 8/pi^2 series
      return (2/Math.PI)*Math.asin(Math.sin(x));
    }
    case "pulse": {   // 1 for first fraction D of period, else 0  (mean = D)
      return (t < 2*Math.PI*duty) ? 1 : 0;
    }
    case "halfsine": return Math.sin(x) > 0 ? Math.sin(x) : 0;
  }
  return 0;
}

/* ============================ Fourier coefficients ============================ */
// Returns {a0, harmonics:[{n,a,b,amp,phase}]}  for n=1..N
function coefficients(type, N, duty){
  let a0 = 0; // this is the mean value (a0/2 in some texts); we store the DC term directly as mean
  const H = [];
  for(let n=1;n<=N;n++){
    let a=0, b=0;
    switch(type){
      case "square":
        a=0; b = (n%2===1) ? 4/(n*Math.PI) : 0; a0=0; break;
      case "sawtooth":
        a=0; b = 2*Math.pow(-1,n+1)/(n*Math.PI); a0=0; break;
      case "triangle":
        a=0;
        if(n%2===1){ b = 8*Math.pow(-1,(n-1)/2)/(Math.PI*Math.PI*n*n); } else b=0;
        a0=0; break;
      case "pulse": {
        const D=duty;
        a0 = D; // DC (mean) = a0/2
        a = Math.sin(2*Math.PI*n*D)/(n*Math.PI);
        b = (1-Math.cos(2*Math.PI*n*D))/(n*Math.PI);
        break;
      }
      case "halfsine": {
        a0 = 1/Math.PI;
        if(n===1){ a=0; b=0.5; }
        else if(n%2===0){ a = -(2/Math.PI)/(n*n-1); b=0; } // cos(nx) terms for even n
        else { a=0; b=0; }
        break;
      }
    }
    const amp = Math.hypot(a,b);
    // reconstruction term a*cos + b*sin = amp*sin(nx + phase) with phase=atan2(a,b)
    const phase = Math.atan2(a,b);
    H.push({n, a, b, amp, phase});
  }
  return {a0, harmonics:H};
}

function reconstruct(coef, x){
  let s = coef.a0;
  for(const h of coef.harmonics){ s += h.a*Math.cos(h.n*x) + h.b*Math.sin(h.n*x); }
  return s;
}

/* ============================ Manual harmonics ============================ */
/* amplitude/phase -> a,b with term = amp*sin(n x + phase)
   sin(nx+phase)=cos(phase)sin(nx)+sin(phase)cos(nx) -> b=amp*cos(phase), a=amp*sin(phase)
   Unchanged arithmetic; it reads the list out of the state object now instead of
   a module-level global, so that solve() is a pure function of the state. */
function manualCoef(list){
  const H=[];
  for(const m of (list||[])){
    const ph = m.phase*Math.PI/180;
    const a = m.amp*Math.sin(ph);
    const b = m.amp*Math.cos(ph);
    H.push({n:m.n, a, b, amp:Math.abs(m.amp), phase:Math.atan2(a,b)});
  }
  H.sort((p,q)=>p.n-q.n);
  return {a0:0, harmonics:H};
}

/* ============================ Model, once, purely ============================ */
/* solve(state) returns every quantity the page shows, including the sampled
   curves the CSV exports. No DOM, no globals written. */
function solve(s){
  const coef = s.mode==="preset" ? coefficients(s.wave, s.N, s.duty) : manualCoef(s.manual);
  const P=s.periods, xMax=2*Math.PI*P;
  const xs=[], targ=[], sum=[];
  for(let i=0;i<=SAMPLES;i++){
    const x=xMax*i/SAMPLES; xs.push(x);
    targ.push(s.mode==="preset"?targetValue(s.wave,x,s.duty):null);
    sum.push(reconstruct(coef,x));
  }
  return {coef, xs, targ, sum, xMax};
}
function recompute(s){
  last = solve(s);
  lastSamples = last.xs.map((x,i)=>({x, target:last.targ[i], sum:last.sum[i]}));
  return last;
}
function currentCoef(){ return last ? last.coef : solve(S()).coef; }

/* ============================ Canvas drawing ============================ */
function tok(name, fb){
  const v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fb;
}
function chartFont(){ return "400 " + tok("--fs-small","12px") + " " + tok("--font","sans-serif"); }

/* the reconstruction plot: the same geometry, sized by the stage */
function drawMain(size, st){
  const ctx=st.canvas(), w=size.w, h=size.h;
  const s=S(), r=last||solve(s);
  ctx.clearRect(0,0,w,h);
  const coarse = size.density==="coarse";
  const pad={l:coarse?36:44, r:14, t:14, b:26};
  const px=pad.l, pw=w-pad.l-pad.r, py=pad.t, ph=h-pad.t-pad.b;
  const P=s.periods, xMax=r.xMax;
  const muted=tok("--muted","#5b6675"), line=tok("--line","#e2e7ee");
  const accent=tok("--accent","#3763e6"), target=tok("--bad","#a5261f");

  const xs=r.xs, targ=r.targ, sum=r.sum;
  let yMin=Infinity,yMax=-Infinity;
  const consider=v=>{ if(v!==null&&isFinite(v)){yMin=Math.min(yMin,v);yMax=Math.max(yMax,v);} };
  targ.forEach(consider); sum.forEach(consider);
  if(!isFinite(yMin)){yMin=-1;yMax=1;}
  const span=(yMax-yMin)||2; yMin-=span*0.12; yMax+=span*0.12;
  const X=x=>px+pw*(x/xMax);
  const Y=y=>py+ph*(1-(y-yMin)/(yMax-yMin));

  ctx.strokeStyle=line; ctx.lineWidth=1; ctx.fillStyle=muted; ctx.font=chartFont();
  const gstep = coarse && P>1 ? 2 : 1;                 /* section 10: coarser ticks below md */
  for(let g=0;g<=P*2;g++){
    const x=g*Math.PI;
    ctx.beginPath(); ctx.moveTo(X(x),py); ctx.lineTo(X(x),py+ph); ctx.stroke();
    if(g%gstep===0){
      ctx.textAlign="center";
      ctx.fillText(g===0?"0":(g===1?"π":g+"π"), X(x), py+ph+16);
    }
  }
  ctx.strokeStyle=line; ctx.beginPath(); ctx.moveTo(px,Y(0)); ctx.lineTo(px+pw,Y(0)); ctx.stroke();
  ctx.textAlign="right";
  const yticks=5;
  for(let i=0;i<=yticks;i++){
    const yv=yMin+(yMax-yMin)*i/yticks, yy=Y(yv);
    ctx.save(); ctx.globalAlpha=.5;
    ctx.strokeStyle=line; ctx.beginPath(); ctx.moveTo(px,yy); ctx.lineTo(px+pw,yy); ctx.stroke();
    ctx.restore();
    ctx.fillStyle=muted; ctx.fillText(yv.toFixed(2), px-6, yy+3);
  }

  if(s.showHarm){
    ctx.save(); ctx.lineWidth=1; ctx.globalAlpha=.45; ctx.strokeStyle=muted;
    r.coef.harmonics.forEach(hn=>{
      if(hn.amp<1e-6) return;
      ctx.beginPath();
      for(let i=0;i<=SAMPLES;i++){
        const x=xs[i], y=hn.a*Math.cos(hn.n*x)+hn.b*Math.sin(hn.n*x);
        const xx=X(x),yy=Y(y); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);
      }
      ctx.stroke();
    });
    ctx.restore();
  }
  if(s.mode==="preset"){
    ctx.strokeStyle=target; ctx.lineWidth=1.8; ctx.setLineDash([6,4]);
    ctx.beginPath();
    for(let i=0;i<=SAMPLES;i++){ const xx=X(xs[i]),yy=Y(targ[i]); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); }
    ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.strokeStyle=accent; ctx.lineWidth=2.2;
  ctx.beginPath();
  for(let i=0;i<=SAMPLES;i++){ const xx=X(xs[i]),yy=Y(sum[i]); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); }
  ctx.stroke();
  /* the sampled curves stay reachable where they always were */
  if(st.cv){ st.cv.id="mainChart"; st.cv._exportSamples=lastSamples; }
}

function drawSpectrum(size, st){
  const ctx=st.canvas(), w=size.w, h=size.h;
  const coef=(last||solve(S())).coef;
  ctx.clearRect(0,0,w,h);
  const coarse = size.density==="coarse";
  const pad={l:coarse?36:44, r:14, t:12, b:24};
  const px=pad.l, pw=w-pad.l-pad.r, py=pad.t, ph=h-pad.t-pad.b;
  const H=coef.harmonics, nBars=H.length;
  const muted=tok("--muted","#5b6675"), line=tok("--line","#e2e7ee"), accent=tok("--accent","#3763e6");
  let aMax=0; H.forEach(hn=>aMax=Math.max(aMax,hn.amp)); if(aMax<=0)aMax=1;
  const bw=pw/Math.max(nBars,1);
  ctx.strokeStyle=line; ctx.beginPath(); ctx.moveTo(px,py+ph); ctx.lineTo(px+pw,py+ph); ctx.stroke();
  ctx.fillStyle=muted; ctx.font=chartFont(); ctx.textAlign="right";
  for(let i=0;i<=4;i++){
    const v=aMax*i/4, yy=py+ph*(1-i/4);
    ctx.save(); ctx.globalAlpha=.5;
    ctx.strokeStyle=line; ctx.beginPath(); ctx.moveTo(px,yy); ctx.lineTo(px+pw,yy); ctx.stroke();
    ctx.restore();
    ctx.fillStyle=muted; ctx.fillText(v.toFixed(2),px-6,yy+3);
  }
  const labelEvery = nBars<=40 ? 1 : 0;
  H.forEach((hn,i)=>{
    const bh=ph*(hn.amp/aMax);
    const x=px+i*bw+bw*0.15, bwi=bw*0.7;
    ctx.fillStyle=accent;
    ctx.fillRect(x, py+ph-bh, bwi, bh);
    if(labelEvery && (!coarse || i%2===0)){
      ctx.fillStyle=muted; ctx.textAlign="center"; ctx.fillText(hn.n, x+bwi/2, py+ph+14);
    }
  });
  if(st.cv) st.cv.id="specChart";
}

/* ============================ Results ============================ */
/* The three entries, and when each of them applies. Same strings, same colours,
   same conditions as the hand-built row this replaced. */
function legendItems(){
  const d=D(), s=S();
  return [
    {label:d.legTarget, color:"var(--bad)",    dash:true, visible:s.mode==="preset"},
    {label:d.legSum,    color:"var(--accent)"},
    {label:d.legHarm,   color:"var(--muted)",  visible:!!s.showHarm}
  ];
}
/* spec 7.3: the slot above the stage caption, which is exactly where this tool
   had injected its own row. The framework owns the markup and the styling now. */
function attachLegend(){
  legendNode = (mainStage && mainStage.legend) ? mainStage.legend({items:legendItems()}) : null;
}
function renderLegend(){
  if(legendNode){ legendNode.update(legendItems()); return; }
  /* no framework: the fallback shell draws the same three entries itself */
  if(!legendBox) return;
  legendBox.textContent="";
  legendItems().forEach((it,i)=>{
    if(it.visible===false) return;
    const w=document.createElement("span");
    w.appendChild(fbEl("i",["t","s","h"][i]));
    w.appendChild(fbEl("span",null,it.label));
    legendBox.appendChild(w);
  });
}

/* The printed values are the ones this page has always printed: n as an integer,
   a/b/amplitude at toFixed(4), phase at toFixed(1), frequency as the same n.
   They are passed as {text} so the framework formats nothing. */
function coefRows(coef){
  return coef.harmonics.map(hn=>[
    String(hn.n),
    {text:hn.a.toFixed(4),                     num:true},
    {text:hn.b.toFixed(4),                     num:true},
    {text:hn.amp.toFixed(4),                   num:true},
    {text:(hn.phase*180/Math.PI).toFixed(1),   num:true},
    {text:String(hn.n),                        num:true}
  ]);
}
function renderCoefTable(coef){
  if(!coefBox) return;
  const d=D();
  const head=[d.thN,{label:d.thA,num:true},{label:d.thB,num:true},{label:d.thAmp,num:true},
              {label:d.thPhase,num:true},{label:d.thFreq,num:true}];
  coefBox.textContent="";
  if(ui && ui.table){
    /* spec 7.2. This is the capability the port declared LOST: the header row
       used to stick inside a 300 px .table-scroll, which spec 5 removed. With
       no maxHeight the framework pins the header to the PAGE under the app
       header once it has measured that the table fits, so at N = 100 the
       headers stay put with no panel-internal scrollbar. It also owns the
       "wider than the screen" hint. */
    const box=ui.table({head:head, rows:coefRows(coef), sticky:true});
    const t=box.querySelector("table"); if(t) t.id="coefTable";
    coefBox.appendChild(box);
    return;
  }
  /* no framework: the same table, plainly, styled by the .fs-fb sheet */
  const tb=fbEl("table"); tb.id="coefTable";
  const htr=fbEl("tr"), body=fbEl("tbody");
  head.forEach(h=>{ htr.appendChild(fbEl("th",null,h.label!=null?h.label:h)); });
  tb.appendChild(fbEl("thead")).appendChild(htr);
  coefRows(coef).forEach(cells=>{
    const tr=fbEl("tr");
    cells.forEach(c=>{ tr.appendChild(fbEl("td",null,c.text!=null?c.text:c)); });
    body.appendChild(tr);
  });
  tb.appendChild(body);
  coefBox.appendChild(tb);
}

function syncCsvBtn(){
  if(csvAction && csvAction._node) csvAction._node.disabled = !last;
}

function computeResult(s){
  recompute(s);
  if(mainStage) mainStage.schedule();
  if(specStage) specStage.schedule();
  renderCoefTable(last.coef);
  renderLegend();
  syncCsvBtn();

  const d=D(), coef=last.coef;
  let best=null;
  coef.harmonics.forEach(hn=>{ if(!best || hn.amp>best.amp) best=hn; });
  const notes=[];
  if(s.mode==="preset"&&(s.wave==="square"||s.wave==="sawtooth"||s.wave==="pulse")) notes.push(d.rec.gibbs);
  if(s.mode==="manual") notes.push(d.rec.manual);

  return {
    tiles:[
      {label:X.dcT, value:coef.a0, precision:4, learn:"coeffs"},
      {label:X.nT, value:coef.harmonics.length, precision:0, learn:"harmonics"},
      {label:X.peakT, value:best?best.amp:null, precision:4, learn:"spectrum",
       hint: best ? (d.thN+" = "+best.n) : null},
      {label:X.peakPhT, value:best?best.phase*180/Math.PI:null, precision:1, hint:"°", headline:false},
      {label:K("lPeriods"), value:s.periods, precision:0, headline:false, learn:"periods"},
      {label:K("lWave"), value: s.mode==="preset" ? (d.waves[s.wave]||s.wave) : d.optManual,
       headline:false, learn:"waveform"}
    ],
    notes:notes
  };
}

/* ============================ Export: CSV (dependency-free) ============================ */
function csvCell(v){ const t=String(v==null?"":v); return /[",\n;]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; }
function buildCSV(){
  const d=D(), s=S(), coef=currentCoef(), rows=[];
  rows.push([d.pdfTitle]);
  rows.push([d.pdfWave, s.mode==="preset"?d.waves[s.wave]:"manual"]);
  rows.push([d.pdfN, s.N]);
  if(s.wave==="pulse" && s.mode==="preset") rows.push([d.lDuty, r4(s.duty)]);
  rows.push(["DC (a0)", r4(coef.a0)]);
  rows.push(["source",(window.Diagram&&Diagram.site?Diagram.site.sourceRef():'https://tools.petrov.re/fourier_series.html')]);
  rows.push([]);
  rows.push([d.thN,d.thA,d.thB,d.thAmp,d.thPhase,d.thFreq]);
  coef.harmonics.forEach(hn=>rows.push([hn.n, r4(hn.a), r4(hn.b), r4(hn.amp), r1(hn.phase*180/Math.PI), hn.n]));
  rows.push([]);
  rows.push(["x (rad)","target","partial_sum"]);
  (lastSamples||[]).forEach(sm=>rows.push([r4(sm.x), sm.target===null?"":r4(sm.target), r4(sm.sum)]));
  return rows.map(r=>r.map(csvCell).join(",")).join("\r\n")+"\r\n";
}
function exportCsv(){
  if(!last) return;
  const csv=buildCSV();
  if(window.Diagram){ window.Diagram.export.download("fourier_series.csv","text/csv",csv); return; }
  const b=new Blob([csv],{type:"text/csv;charset=utf-8"}), u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download="fourier_series.csv"; a.style.display="none";
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(u); a.remove();},1500);
}

function r4(v){ return Math.round(v*1e4)/1e4; }
function r1(v){ return Math.round(v*10)/10; }

function manualChanged(){

function renderManual(box){
  manualBox=document.createElement("div");
  box.appendChild(manualBox);
  buildManual();
}
function buildManual(){
  if(!manualBox) return;
  const d=D(), s=S();
  manualBox.textContent="";
  manualRows=[];
  const head=document.createElement("div"); head.className="fs-mhead";
  [d.thN, d.thAmp, d.thPhase, ""].forEach(h=>{ const sp=document.createElement("span"); sp.textContent=h; head.appendChild(sp); });
  manualBox.appendChild(head);
  const list=document.createElement("div"); list.className="fs-manual"; list.id="manualList";
  if(!s.manual.length){
    const e=document.createElement("div"); e.className="fs-empty"; e.textContent=pick6(X.noneH);
    list.appendChild(e);
  }
  s.manual.forEach((m,i)=>{
    const row=document.createElement("div"); row.className="fs-mrow";
    const n=mInput(m.n,1,d.thN), a=mInput(m.amp,0.05,d.thAmp), p=mInput(m.phase,5,d.thPhase);
    n.min="1";
    /* the ids and data-attributes the benchmark harness and any user script have
       always driven this page through are kept exactly as they were */
    [[n,"n"],[a,"amp"],[p,"phase"]].forEach(pair=>{ pair[0].dataset.i=String(i); pair[0].dataset.k=pair[1]; });
    n.addEventListener("input", ()=>{ S().manual[i].n=Math.max(1,Math.round(+n.value||1)); manualChanged(); });
    a.addEventListener("input", ()=>{ S().manual[i].amp=(+a.value||0); manualChanged(); });
    p.addEventListener("input", ()=>{ S().manual[i].phase=(+p.value||0); manualChanged(); });
    const del=document.createElement("button");
    del.type="button"; del.className="dgu-btn danger icon"; del.textContent="✕";
    del.setAttribute("aria-label", pick6(X.delH)+" "+m.n);
    del.dataset.del=String(i);
    del.addEventListener("click", ()=>{ S().manual.splice(i,1); buildManual(); manualChanged(); });
    row.appendChild(n); row.appendChild(a); row.appendChild(p); row.appendChild(del);
    list.appendChild(row);
    manualRows.push({n:n,amp:a,phase:p});
  });
  manualBox.appendChild(list);
  const add=document.createElement("button");
  add.type="button"; add.className="dgu-btn"; add.id="addHarm";
  add.textContent="+ "+d.addHarmT;
  add.addEventListener("click", ()=>{
    const list2=S().manual;
    const nextN=(list2.length?Math.max.apply(null,list2.map(m=>m.n))+1:1);
    list2.push({n:nextN,amp:0.5,phase:0});
    buildManual(); manualChanged();
  });
  manualBox.appendChild(add);
}
function syncManual(){
  const s=S();
  if(!manualBox) return;
  if(manualRows.length!==s.manual.length){ buildManual(); return; }
  s.manual.forEach((m,i)=>{
    const r=manualRows[i];
    if(document.activeElement!==r.n) r.n.value=String(m.n);
    if(document.activeElement!==r.amp) r.amp.value=String(m.amp);
    if(document.activeElement!==r.phase) r.phase.value=String(m.phase);
  });
}

function buildFooter(host, app){
  const l=app.lang, d=I18N[l]||I18N.en;
  const det=document.createElement("details");
  det.className="fs-foot";
  const sum=document.createElement("summary");

    items.forEach(s=>{ const li=document.createElement("li"); li.textContent=s; ul.appendChild(li); });
    det.appendChild(ul);
  };
  block(X.eqHdr, ["f_N(x) = a0 + SUM_{n=1..N} [ a_n·cos(n·x) + b_n·sin(n·x) ]",
                  "amp_n = sqrt(a_n^2 + b_n^2);  phase_n = atan2(a_n, b_n)",
                  EQ_WAVE[S().wave]]);

/* ============================ Boot ============================ */
function capMain(){
  const o={}; SIX.forEach(l=>{ const d=I18N[l]||I18N.en; o[l]=d.hRecon+" — "+d.gibbsTag; }); return o;
}
function boot(){
  document.title = mtitle(curLang());
  if(!window.DiagramUI || DiagramUI.api!=="tools.petrov.re/ui/v1"){
    /* Degrade honestly: the data layer first, so the shared bar stands whatever
       happens next, then the same fields, the same maths, the same charts, the
       same table and the same CSV — without the framework. */
    dgcInit();
    bootFallback();
    return;
  }
  DiagramUI.app({
    id:"fourier_series",
    mount:"#app",
    layout:"calculator",
    compute:"live",
    state:state,
    defaults:DEFAULTS,
    subtitle:K("appSub"),
    learn:LEARN(),
    panels:[{id:"controls", slot:"inputs", title:K("hControls"), learn:"series",
             fields:FIELDS(), sync:syncPanel}],
    footer:buildFooter,
    on:{
      compute:computeResult,
      lang:function(l){ document.title=mtitle(l); },
      /* Built exactly once. Spec 3.1: App.rebuild() journals every panel and
         stage created imperatively here and replays them onto the new shell, so
         the old "re-create the furniture from on.ready on every language change"
         workaround is deleted rather than carried forward. */
      ready:function(app){
        if(built) return;
        built=true;
        ui=app;
        /* reset: inputs footer, secondary weight, per the placement law.
           Declared as an actions row (spec 5) instead of a hand-built one. */
        app.panel({slot:"inputs", id:"fs-reset",
                   actions:[app.resetAction()], actionsAlign:"end"});

        mainStage=app.stage({
          minHeight:300, caption:capMain(), render:drawMain,
          a11y:function(){
            if(!last) return "";
            return pick6(X.a11yMain).replace("%n", last.coef.harmonics.length).replace("%p", S().periods);
          }
        });
        attachLegend();

        specStage=app.stage({
          minHeight:240, caption:K("hSpectrum"), render:drawSpectrum,
          a11y:function(){
            if(!last) return "";
            let m=0; last.coef.harmonics.forEach(h=>{ if(h.amp>m)m=h.amp; });
            return pick6(X.a11ySpec).replace("%n", last.coef.harmonics.length)
                                    .replace("%a", m.toFixed(4));
          }
        });

        csvAction={id:"csv", label:K("csvName"), run:exportCsv};
        app.panel({slot:"dock", id:"fs-coef", title:K("hTable"), learn:"coeffs",
                   note:X.csvNote, actions:[csvAction], sync:syncCsvBtn,
                   render:function(box){ coefBox=box; }});

        repairToggle(app);
        legacyIds(app);
        app.sync(); app.run();
      },
      /* Spec 3.1 again: "rebuild() does not hand a tool back its objects", and
         a stage legend is a decoration on a replayed stage. This is the
         supported place to re-point both. coefBox and csvAction._node re-point
         themselves, because the replay calls the same panel definition. */
      rebuild:function(app){
        ui=app;
        mainStage=(app.stages||[])[0]||null;
        specStage=(app.stages||[])[1]||null;
        attachLegend();
        repairToggle(app);
        legacyIds(app);
        if(last){ renderCoefTable(last.coef); renderLegend(); syncCsvBtn(); }
        if(mainStage) mainStage.schedule();
        if(specStage) specStage.schedule();
      }
    }
  });
  ui = DiagramUI.current;
  ui.ready();
  dgcInit();
  window.__fourier={buildCSV:buildCSV, solve:solve, get state(){return S();}, get ui(){return ui;}};
}

/* Framework repair, local: diagram-ui.js renders a toggle as
   <span class="dgu-toggle"><input type="checkbox"></span> and points the field's
   <label for=...> at the span, which is not a labelable element. The checkbox
   therefore has no accessible name and no hit target but its own 18 px box.
   Belongs upstream. */
/* The page has always been drivable through #mode, #wave, #duty, #N, #Nnum,
   #periods, #showHarm, #manualList and #coefTable — that is how the 16 benchmark
   cases are driven and how a user script would drive it. The framework names its
   own controls, so the old names are put back on them here, labels included. */
function legacyIds(app){
  [["f-mode","mode"],["f-wave","wave"],["f-duty","duty"],["f-periods","periods"],["f-N","N"]]
    .forEach(pair=>{
      const f=app.node.querySelector('[data-dgu-field="'+pair[0]+'"]');
      if(!f) return;
      const c=f.querySelector("select,input");
      if(!c) return;
      if(pair[0]!=="f-N") c.id=pair[1];
      const lab=f.querySelector(".dgu-flabel");
      if(lab) lab.setAttribute("for", c.id);
    });
}
function repairToggle(app){
  const f=app.node.querySelector('[data-dgu-field="f-showHarm"]');
  if(!f) return;
  const box=f.querySelector('input[type=checkbox]'), lab=f.querySelector(".dgu-flabel");
  if(!box||!lab) return;
  box.id="showHarm";
  lab.setAttribute("for", box.id);
  box.setAttribute("aria-label", pick6(K("lShowHarm")));
}

/* ---- the fallback renderer: no diagram-ui.js, same tool ---- */
let fb=null, fbCv1=null, fbCv2=null;
function fbEl(tag, cls, txt){
  const n=document.createElement(tag);
  if(cls) n.className=cls;
  if(txt!=null) n.textContent=txt;
  return n;
}
function fbShim(cv){ return { cv:cv, canvas:function(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=cv.clientWidth||600, h=+cv.dataset.h;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  cv.style.height=h+"px";
  const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); return ctx;
}}; }
function fbSize(cv){
  return {w:cv.clientWidth||600, h:+cv.dataset.h, dpr:Math.min(window.devicePixelRatio||1,2),
          density: window.innerWidth<768 ? "coarse" : "fine"};
}
function fbLabel(parent, text){ const l=fbEl("label",null,text); parent.appendChild(l); return l; }
function bootFallback(){
  const d=D(), l=curLang();
  const root=document.getElementById("app")||document.body;
  root.className="fs-fb";
  root.textContent="";
  document.documentElement.lang=l;
  root.appendChild(fbEl("h1",null,mtitle(l)));
  root.appendChild(fbEl("div",null,d.appSub));

  const c=fbEl("div","box"); c.appendChild(fbEl("h2",null,d.hControls));
  fbLabel(c, d.lMode);
  const mode=fbEl("select"); mode.id="mode";
  [["preset",d.optPreset],["manual",d.optManual]].forEach(o=>{
    const op=fbEl("option",null,o[1]); op.value=o[0]; mode.appendChild(op); });
  mode.value=state.mode;
  mode.addEventListener("change",()=>{ state.mode=mode.value; fbUpdate(); });
  c.appendChild(mode);

  const waveL=fbLabel(c, d.lWave);
  const wave=fbEl("select"); wave.id="wave";
  ["square","sawtooth","triangle","pulse","halfsine"].forEach(w=>{
    const op=fbEl("option",null,d.waves[w]); op.value=w; wave.appendChild(op); });
  wave.value=state.wave;
  wave.addEventListener("change",()=>{ state.wave=wave.value; fbUpdate(); });
  c.appendChild(wave);

  const dutyL=fbLabel(c, d.lDuty+": "+Math.round(state.duty*100)+"%");
  const duty=fbEl("input"); duty.type="range"; duty.id="duty";
  duty.min="5"; duty.max="95"; duty.step="1"; duty.value=String(Math.round(state.duty*100));
  duty.setAttribute("aria-label", d.lDuty);
  duty.addEventListener("input",()=>{ state.duty=+duty.value/100;
    dutyL.textContent=d.lDuty+": "+duty.value+"%"; fbUpdate(); });
  c.appendChild(duty);

  const formL=fbLabel(c, pick6(X.formT));
  formulaBox=fbEl("div","fs-formula"); c.appendChild(formulaBox);

  const manL=fbLabel(c, d.lManualHint);
  const manHost=fbEl("div"); c.appendChild(manHost);
  renderManual(manHost);

  fbLabel(c, d.lN);
  const nHost=fbEl("div"); c.appendChild(nHost);
  renderN(nHost, null, null);

  fbLabel(c, d.lPeriods);
  const per=fbEl("select"); per.id="periods";
  [1,2].forEach(v=>{ const op=fbEl("option",null,String(v)); op.value=String(v); per.appendChild(op); });
  per.value=String(state.periods);
  per.addEventListener("change",()=>{ state.periods=+per.value; fbUpdate(); });
  c.appendChild(per);

  const chkWrap=fbEl("div");
  const chk=fbEl("input"); chk.type="checkbox"; chk.id="showHarm"; chk.checked=!!state.showHarm;
  const chkL=fbEl("label",null,d.lShowHarm); chkL.htmlFor="showHarm"; chkL.style.display="inline";
  chk.addEventListener("change",()=>{ state.showHarm=chk.checked; fbUpdate(); });

const EQ_WAVE = {
  square:"square wave: a_n = 0; b_n = 4/(n·pi) for odd n, 0 for even n; a0 = 0",
  sawtooth:"sawtooth: a_n = 0; b_n = 2·(-1)^(n+1)/(n·pi); a0 = 0",
  triangle:"triangle: a_n = 0; b_n = 8·(-1)^((n-1)/2)/(pi^2·n^2) for odd n, 0 for even n; a0 = 0",
  pulse:"pulse of duty D: a0 = D; a_n = sin(2·pi·n·D)/(n·pi); b_n = (1 - cos(2·pi·n·D))/(n·pi)",
  halfsine:"half-wave rectified sine: a0 = 1/pi; b_1 = 1/2; a_n = -(2/pi)/(n^2 - 1) for even n; 0 otherwise"
};

function dgcSerialize(){
  const s=S();
  return {v:1,mode:s.mode,wave:s.wave,N:s.N,duty:s.duty,periods:s.periods,
          showHarm:s.showHarm,lang:curLang(),
          manual:s.manual.map(m=>({n:m.n,amp:m.amp,phase:m.phase}))};
}
function dgcDeserialize(st){
  if(!st||typeof st!=="object")throw new Error("unrecognised state payload");
  if(st.mode!=="preset"&&st.mode!=="manual")throw new Error("unknown mode");
  if(st.mode==="preset"&&!I18N.en.waves[st.wave])throw new Error("unknown waveform");
  const s=S();
  s.mode=st.mode;
  if(st.wave)s.wave=st.wave;
  if(isFinite(st.duty))s.duty=+st.duty;
  if(isFinite(st.N))s.N=Math.max(1,Math.min(100,Math.round(+st.N)));
  if(isFinite(st.periods))s.periods=+st.periods;
  s.showHarm=!!st.showHarm;
  if(Array.isArray(st.manual)&&st.manual.length)
    s.manual=st.manual.map(m=>({n:Math.max(1,Math.round(+m.n||1)),amp:+m.amp||0,phase:+m.phase||0}));
  if(ui){
    if(st.lang&&I18N[st.lang]&&st.lang!==ui.lang) ui.setLang(st.lang);
    ui.sync(); ui.run();
  } else if(fb){
    fbSync();
  }
}
function dgcRecord(){
  const coef=currentCoef(); if(!coef)return null;
  const d=D(), s=S();
  const inputs={mode:s.mode,waveform:s.mode==="preset"?s.wave:"manual",
    N_harmonics:s.mode==="preset"?s.N:coef.harmonics.length,
    duty_cycle:s.duty,periods_shown:s.periods,
    manual_harmonics:s.manual.map(m=>({n:m.n,amp:m.amp,phase:m.phase}))};
  const units={mode:"",waveform:"",N_harmonics:"-",duty_cycle:"-",periods_shown:"-",
    manual_harmonics:"n, amplitude, phase in deg",a0_DC:"-",harmonics_N:"-"};
  const outputs={a0_DC:coef.a0,harmonics_N:coef.harmonics.length};
  coef.harmonics.forEach(hn=>{
    outputs["a_"+hn.n]=hn.a; outputs["b_"+hn.n]=hn.b; outputs["amp_"+hn.n]=hn.amp;
    outputs["phase_"+hn.n+"_deg"]=hn.phase*180/Math.PI;
    units["a_"+hn.n]="-"; units["b_"+hn.n]="-"; units["amp_"+hn.n]="-"; units["phase_"+hn.n+"_deg"]="deg";
  });
  const eqs=["f_N(x) = a0 + SUM_{n=1..N} [ a_n·cos(n·x) + b_n·sin(n·x) ]",
    "amp_n = sqrt(a_n^2 + b_n^2);  phase_n = atan2(a_n, b_n), so a_n·cos(n·x)+b_n·sin(n·x) = amp_n·sin(n·x + phase_n)"];
  if(s.mode==="preset")eqs.push(EQ_WAVE[s.wave]);
  else eqs.push("manual harmonic of amplitude A and phase phi: a_n = A·sin(phi), b_n = A·cos(phi)");
  const w=[];
  if(s.mode==="preset"&&(s.wave==="square"||s.wave==="sawtooth"||s.wave==="pulse"))w.push(d.rec.gibbs);
  if(s.mode==="manual")w.push(d.rec.manual);
  return {inputs:inputs,outputs:outputs,units:units,

const PY_FOURIER = `MANUAL = INPUTS["manual_harmonics"]


def coefficients(mode, wave, n_harm, duty, manual):
    """Exact closed-form Fourier coefficients of the ideal waveform.

    Returns (a0, harmonics) where a0 is the mean value and each harmonic is
    {"n":.., "a":.., "b":.., "amp":.., "phase":..} with phase in radians.
    """
    harmonics = []
    a0 = 0.0
    if mode == "manual":
        for m in manual:
            ph = float(m["phase"]) * math.pi / 180.0
            amp = float(m["amp"])
            a = amp * math.sin(ph)
            b = amp * math.cos(ph)
            harmonics.append({"n": int(m["n"]), "a": a, "b": b,
                              "amp": abs(amp), "phase": math.atan2(a, b)})
        harmonics.sort(key=lambda h: h["n"])
        return 0.0, harmonics
    for n in range(1, int(n_harm) + 1):
        a = 0.0
        b = 0.0
        if wave == "square":
            b = 4.0 / (n * math.pi) if n % 2 == 1 else 0.0
        elif wave == "sawtooth":
            b = 2.0 * ((-1.0) ** (n + 1)) / (n * math.pi)
        elif wave == "triangle":
            if n % 2 == 1:
                b = 8.0 * ((-1.0) ** ((n - 1) // 2)) / (math.pi * math.pi * n * n)
        elif wave == "pulse":
            a0 = duty
            a = math.sin(2.0 * math.pi * n * duty) / (n * math.pi)
            b = (1.0 - math.cos(2.0 * math.pi * n * duty)) / (n * math.pi)
        elif wave == "halfsine":
            a0 = 1.0 / math.pi
            if n == 1:
                b = 0.5
            elif n % 2 == 0:
                a = -(2.0 / math.pi) / (n * n - 1.0)
        harmonics.append({"n": n, "a": a, "b": b,
                          "amp": math.hypot(a, b), "phase": math.atan2(a, b)})
    return a0, harmonics


def partial_sum(x, a0, harmonics):
    """Value of the truncated Fourier series at x (radians)."""
    s = a0
    for h in harmonics:
        s += h["a"] * math.cos(h["n"] * x) + h["b"] * math.sin(h["n"] * x)
    return s


def target(x, wave, duty):
    """The ideal waveform the series approximates (period 2*pi, amplitude 1)."""
    t = math.fmod(math.fmod(x, 2.0 * math.pi) + 2.0 * math.pi, 2.0 * math.pi)
    if wave == "square":
        return 1.0 if t < math.pi else -1.0
    if wave == "sawtooth":
        return t / math.pi if t < math.pi else t / math.pi - 2.0
    if wave == "triangle":
        return (2.0 / math.pi) * math.asin(math.sin(x))
    if wave == "pulse":
        return 1.0 if t < 2.0 * math.pi * duty else 0.0
    if wave == "halfsine":
        return math.sin(x) if math.sin(x) > 0.0 else 0.0
    return 0.0


def compute():
    a0, harmonics = coefficients(MODE, WAVEFORM, N_HARMONICS, DUTY_CYCLE, MANUAL)
    out = {"a0_DC": a0, "harmonics_N": len(harmonics)}
    for h in harmonics:
        n = h["n"]
        out["a_%d" % n] = h["a"]
        out["b_%d" % n] = h["b"]
        out["amp_%d" % n] = h["amp"]
        out["phase_%d_deg" % n] = h["phase"] * 180.0 / math.pi
    return out`;
function dgcPython(){
  if(!currentCoef())return null;
