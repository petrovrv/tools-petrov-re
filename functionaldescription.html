 "summary": {
  "en": "Control narrative of one system: operating modes, GRAFCET/SFC sequences, control loops, interlocks and alarms, checked for unreachable steps, dead ends, non-deterministic transitions, unknown tags and setpoints outside the instrument range.",
  "uk": "Опис керування однієї системи: режими, послідовності GRAFCET/SFC, контури регулювання, блокування та сигналізація з перевіркою недосяжних кроків, глухих кутів, недетермінованих переходів, невідомих тегів і уставок поза діапазоном.",
  "de": "Funktionsbeschreibung einer Anlage: Betriebsarten, GRAFCET/SFC-Abläufe, Regelkreise, Verriegelungen und Alarme, geprüft auf unerreichbare Schritte, Sackgassen, nichtdeterministische Transitionen, unbekannte Tags und Sollwerte außerhalb des Messbereichs.",
  "nl": "Besturingsbeschrijving van één systeem: bedrijfsmodi, GRAFCET/SFC-sequenties, regelkringen, vergrendelingen en alarmen, getoetst op onbereikbare stappen, doodlopende stappen, niet-deterministische transities, onbekende tags en setpoints buiten het meetbereik.",
  "fr": "Description fonctionnelle d’un système : modes de marche, séquences GRAFCET/SFC, boucles de régulation, verrouillages et alarmes, contrôlés pour étapes non atteignables, impasses, transitions non déterministes, repères inconnus et consignes hors étendue de mesure.",
  "es": "Descripción de control de un sistema: modos de operación, secuencias GRAFCET/SFC, lazos de control, enclavamientos y alarmas, comprobados por pasos no alcanzables, callejones sin salida, transiciones no deterministas, TAG desconocidos y consignas fuera del rango.",
  "pl": "Opis sterowania jednego układu: tryby pracy, sekwencje GRAFCET/SFC, obwody regulacji, blokady i alarmy, sprawdzone pod kątem kroków nieosiągalnych, ślepych kroków, przejść niedeterministycznych, nieznanych tagów i nastaw poza zakresem pomiarowym."
 },
 "description": {
  "en": "A controls engineer writes the narrative for one system and 71 rules check its structure: a step nothing reaches or nothing leaves, two transitions from one step whose conditions can both be true without a priority (IEC 61131-3:2003 2.6.5, Table 46), a transition condition that names a tag the I/O list does not have or that reads an output (IEC 60848:2013 4.3.3), an action writing an input, a timed qualifier with no duration, a mode with no exit and no fault response, an emergency mode that is not the highest priority, a setpoint or alarm limit outside the instrument range, alarm limits out of order, an alarm without a priority (IEC 62682:2022 10.5.4). Reachability is a fixpoint over the step graph; an overlap is decided by enumerating the sample points of both conditions, exactly up to 65 536 assignments per pair, and the first assignment that makes both true is reported as the witness. The page draws the sequence chart and the mode diagram from the same model, reads the project package — project identity, systems and packages, the I/O register and the flags raised on it — and writes the control-function register that causeeffect, iolist and functionaltest read. Values are stored in SI and shown in the unit you pick. The Python export carries the parser, both reachability fixpoints, the overlap enumeration and the span positions, and self-tests them against what the page displayed.",
  "uk": "Інженер із КВПіА пише опис керування однієї системи, а 71 правило перевіряє його структуру: крок, якого ніщо не досягає або з якого немає переходу; два переходи з одного кроку, умови яких можуть бути істинними водночас без пріоритету (IEC 61131-3:2003 2.6.5, таблиця 46); умова переходу з тегом, якого немає у списку В/В, або така, що читає вихід (IEC 60848:2013 4.3.3); дія, що пише у вхід; часовий кваліфікатор без тривалості; режим, який неможливо залишити, та без реакції на відмову; аварійний режим без найвищого пріоритету; уставка або поріг сигналізації поза діапазоном; порушений порядок порогів; сигнал без пріоритету (IEC 62682:2022 10.5.4). Досяжність — нерухома точка на графі кроків; перекриття вирішується перебором точок вибірки обох умов, точно до 65 536 присвоєнь на пару, а перше присвоєння, що робить обидві істинними, подається як свідок. Сторінка будує схему послідовності й діаграму режимів із тієї самої моделі, читає пакет проєкту — ідентифікацію проєкту, системи й пакети, реєстр В/В і позначки на ньому — і пише реєстр функцій керування, який читають causeeffect, iolist і functionaltest. Значення зберігаються в SI та показуються в обраній одиниці. Експорт Python містить парсер, обидві нерухомі точки досяжності, перебір перекриттів і положення в діапазоні та самотестується проти показаного сторінкою.",
  "de": "Ein MSR-Ingenieur schreibt die Funktionsbeschreibung einer Anlage, und 71 Regeln prüfen ihre Struktur: ein Schritt, den nichts erreicht oder den nichts verlässt; zwei Transitionen aus einem Schritt, deren Bedingungen ohne Priorität beide wahr sein können (IEC 61131-3:2003 2.6.5, Tabelle 46); eine Transitionsbedingung mit einem Tag, den die E/A-Liste nicht kennt, oder die einen Ausgang liest (IEC 60848:2013 4.3.3); eine Aktion, die auf einen Eingang schreibt; ein Zeitqualifier ohne Dauer; eine Betriebsart ohne Austritt und ohne Störungsreaktion; eine Notfall-Betriebsart ohne höchste Priorität; ein Sollwert oder eine Alarmgrenze außerhalb des Messbereichs; Alarmgrenzen in falscher Reihenfolge; ein Alarm ohne Priorität (IEC 62682:2022 10.5.4). Die Erreichbarkeit ist ein Fixpunkt über dem Schrittgraphen; eine Überschneidung wird durch Aufzählen der Stützstellen beider Bedingungen entschieden, exakt bis 65 536 Belegungen je Paar, und die erste Belegung, die beide wahr macht, wird als Zeuge ausgewiesen. Die Seite zeichnet Ablauf- und Betriebsartendiagramm aus demselben Modell, liest das Projektpaket — Projektidentität, Systeme und Pakete, das E/A-Register und die darauf gesetzten Markierungen — und schreibt das Register der Steuerungsfunktionen, das causeeffect, iolist und functionaltest lesen. Werte werden in SI gespeichert und in der gewählten Einheit gezeigt. Der Python-Export trägt Parser, beide Erreichbarkeits-Fixpunkte, die Überschneidungsaufzählung und die Bereichslagen und prüft sie gegen das Angezeigte.",
  "nl": "Een besturingsingenieur schrijft de beschrijving van één systeem en 71 regels toetsen de structuur: een stap die niets bereikt of die niets verlaat; twee transities uit één stap waarvan de voorwaarden zonder prioriteit allebei waar kunnen zijn (IEC 61131-3:2003 2.6.5, tabel 46); een transitievoorwaarde met een tag die niet in de I/O-lijst staat of die een uitgang leest (IEC 60848:2013 4.3.3); een actie die naar een ingang schrijft; een tijdkwalificator zonder duur; een modus zonder overgang en zonder storingsreactie; een noodmodus zonder hoogste prioriteit; een setpoint of alarmgrens buiten het meetbereik; alarmgrenzen in verkeerde volgorde; een alarm zonder prioriteit (IEC 62682:2022 10.5.4). Bereikbaarheid is een vastpunt over de stappengraaf; een overlap wordt beslist door de steunpunten van beide voorwaarden op te sommen, exact tot 65 536 toekenningen per paar, en de eerste toekenning die beide waar maakt wordt als bewijs gemeld. De pagina tekent sequentieschema en modusdiagram uit hetzelfde model, leest het projectpakket — projectidentiteit, systemen en pakketten, het I/O-register en de markeringen daarop — en schrijft het register van besturingsfuncties dat causeeffect, iolist en functionaltest lezen. Waarden staan in SI en worden getoond in de gekozen eenheid. De Python-export bevat de parser, beide bereikbaarheidsvastpunten, de overlapopsomming en de bereikposities, en toetst ze aan wat de pagina toonde.",
  "fr": "Un ingénieur contrôle-commande rédige la description d’un système et 71 règles en contrôlent la structure : une étape que rien n’atteint ou que rien ne quitte ; deux transitions d’une même étape dont les réceptivités peuvent être vraies ensemble sans priorité (IEC 61131-3:2003 2.6.5, tableau 46) ; une réceptivité citant un repère absent de la liste d’E/S ou lisant une sortie (IEC 60848:2013 4.3.3) ; une action écrivant sur une entrée ; un qualificateur temporisé sans durée ; un mode impossible à quitter et sans réponse au défaut ; un mode d’urgence non prioritaire ; une consigne ou un seuil d’alarme hors étendue de mesure ; des seuils dans le désordre ; une alarme sans priorité (IEC 62682:2022 10.5.4). L’atteignabilité est un point fixe sur le graphe des étapes ; un recouvrement est tranché en énumérant les points d’échantillonnage des deux réceptivités, exactement jusqu’à 65 536 affectations par paire, et la première affectation rendant les deux vraies est donnée comme témoin. La page trace le diagramme de séquence et celui des modes depuis le même modèle, lit le dossier de projet — identité du projet, systèmes et lots, registre d’E/S et signalements portés sur lui — et écrit le registre des fonctions de contrôle que lisent causeeffect, iolist et functionaltest. Les valeurs sont en SI et affichées dans l’unité choisie. L’export Python porte l’analyseur, les deux points fixes d’atteignabilité, l’énumération des recouvrements et les positions dans l’étendue, et les vérifie contre l’affichage.",
  "es": "Un ingeniero de control redacta la descripción de un sistema y 71 reglas comprueban su estructura: un paso que nada alcanza o del que nada sale; dos transiciones de un mismo paso cuyas condiciones pueden ser ciertas a la vez sin prioridad (IEC 61131-3:2003 2.6.5, tabla 46); una condición que nombra un TAG ausente de la lista de E/S o que lee una salida (IEC 60848:2013 4.3.3); una acción que escribe en una entrada; un cualificador temporizado sin duración; un modo que no se puede abandonar y sin respuesta ante fallo; un modo de emergencia sin la prioridad más alta; una consigna o límite de alarma fuera del rango; límites en orden incorrecto; una alarma sin prioridad (IEC 62682:2022 10.5.4). La alcanzabilidad es un punto fijo sobre el grafo de pasos; un solape se resuelve enumerando los puntos de muestreo de ambas condiciones, exactamente hasta 65 536 asignaciones por par, y la primera asignación que hace ciertas ambas se informa como testigo. La página dibuja el diagrama de secuencia y el de modos desde el mismo modelo, lee el paquete de proyecto — identidad del proyecto, sistemas y paquetes, el registro de E/S y las marcas puestas sobre él — y escribe el registro de funciones de control que leen causeeffect, iolist y functionaltest. Los valores se guardan en SI y se muestran en la unidad elegida. La exportación Python lleva el analizador, ambos puntos fijos de alcanzabilidad, la enumeración de solapes y las posiciones en el rango, y los contrasta con lo mostrado.",
  "pl": "Inżynier automatyk pisze opis sterowania jednego układu, a 71 reguł sprawdza jego strukturę: krok, do którego nic nie prowadzi albo z którego nic nie wychodzi; dwa przejścia z jednego kroku, których warunki mogą być prawdziwe jednocześnie bez priorytetu (IEC 61131-3:2003 2.6.5, tablica 46); warunek przejścia z tagiem spoza listy we/wy albo czytający wyjście (IEC 60848:2013 4.3.3); akcja zapisująca wejście; kwalifikator czasowy bez czasu trwania; tryb, którego nie da się opuścić, i bez reakcji na awarię; tryb awaryjny bez najwyższego priorytetu; nastawa lub próg alarmu poza zakresem pomiarowym; progi w złej kolejności; alarm bez priorytetu (IEC 62682:2022 10.5.4). Osiągalność to punkt stały na grafie kroków; nakładanie rozstrzyga się przez wyliczenie punktów próbkowania obu warunków, dokładnie do 65 536 przypisań na parę, a pierwsze przypisanie czyniące oba prawdziwymi podawane jest jako świadek. Strona rysuje schemat sekwencji i diagram trybów z tego samego modelu, czyta pakiet projektu — tożsamość projektu, układy i pakiety, rejestr we/wy oraz postawione na nim oznaczenia — i zapisuje rejestr funkcji sterowania, który czytają causeeffect, iolist i functionaltest. Wartości są zapisywane w SI i pokazywane w wybranej jednostce. Eksport Python zawiera parser, oba punkty stałe osiągalności, przegląd nakładania i pozycje w zakresie oraz sprawdza je względem tego, co pokazała strona."
 },
 "status": "benchmarked",
 "independent_validation": false,
 "limitations": {
  "en": "Structural analysis only: nothing is simulated — no timing, no scan cycle, no plant response — and reachability ignores transition conditions, so a synchronising transition counts as fireable once every preceding step is reachable. Conditions use a restricted boolean grammar: one tag or step time compared with a constant, NOT/AND/OR, rising and falling edge; no arithmetic, no function blocks, no counters, no comparison of two variables. Overlap detection is exact up to 65 536 variable assignments per pair and treats tags as independent, so a pair the plant physics excludes can still be reported, and beyond the cap the pair is left undetermined. Divergences follow IEC 61131-3 SFC semantics; macro-steps, enclosing steps, forcing orders and partial grafcets of IEC 60848 are not modelled. Interlocks and permissives are references only — their logic, voting and reset belong to the cause & effect matrix. Alarm checks cover priority, limits against the instrument range, limit ordering and units; rationalisation, priority distribution, rates, shelving and suppression are out of scope. Tag names are checked against a conventional ISA-5.1 pattern, not against the ISA-5.1-2024 letter table. Values are stored in SI and converted only through the unit list of the specification. One functional description per session. This is not a safety assessment: no SIL, no IEC 61511 or IEC 62061 claim, no verification of a safety function.",
  "uk": "Лише структурний аналіз: нічого не моделюється — ні часу, ні циклу опитування, ні реакції установки, — а досяжність ігнорує умови переходів, тож синхронізуючий перехід вважається можливим, щойно досяжні всі попередні кроки. Умови використовують обмежену булеву граматику: один тег або час кроку в порівнянні з константою, NOT/AND/OR, передній і задній фронт; без арифметики, функціональних блоків, лічильників і порівняння двох змінних. Виявлення перекриттів точне до 65 536 присвоєнь на пару і вважає теги незалежними, тож пара, неможлива фізично, все одно може бути показана, а понад межу пара лишається невизначеною. Розгалуження — за семантикою SFC IEC 61131-3; макрокроки, охоплюючі кроки, накази примусу та часткові графсети IEC 60848 не моделюються. Блокування й дозволи — лише посилання: їхня логіка, голосування та скидання належать матриці причин і наслідків. Перевірки сигналізації охоплюють пріоритет, пороги щодо діапазону, порядок порогів і одиниці; раціоналізація, розподіл пріоритетів, частота, відкладання та придушення — поза межами. Назви тегів перевіряються за звичним шаблоном ISA-5.1, а не за таблицею літер ISA-5.1-2024. Значення зберігаються в SI і перетворюються лише за переліком одиниць специфікації. Один функціональний опис за сеанс. Це не оцінювання безпеки: без SIL, без тверджень щодо IEC 61511 чи IEC 62061, без верифікації функції безпеки.",
  "de": "Nur Strukturprüfung: nichts wird simuliert — keine Zeiten, kein Zyklus, keine Anlagenreaktion —, und die Erreichbarkeit ignoriert Transitionsbedingungen, sodass eine synchronisierende Transition als schaltbar gilt, sobald alle Vorschritte erreichbar sind. Bedingungen nutzen eine eingeschränkte boolesche Grammatik: ein Tag oder eine Schrittzeit im Vergleich mit einer Konstanten, NOT/AND/OR, steigende und fallende Flanke; keine Arithmetik, keine Funktionsbausteine, keine Zähler, kein Vergleich zweier Variablen. Die Überschneidungserkennung ist bis 65 536 Belegungen je Paar exakt und behandelt Tags als unabhängig, sodass ein physikalisch ausgeschlossenes Paar gemeldet werden kann; oberhalb der Grenze bleibt das Paar unbestimmt. Divergenzen folgen der SFC-Semantik der IEC 61131-3; Makroschritte, einschließende Schritte, Zwangssteuerbefehle und Teil-GRAFCETs der IEC 60848 werden nicht modelliert. Verriegelungen und Freigaben sind nur Verweise — ihre Logik, Auswahlschaltung und Rücksetzung gehören zur Ursache-Wirkungs-Matrix. Alarmprüfungen umfassen Priorität, Grenzen gegen den Messbereich, Grenzenreihenfolge und Einheiten; Rationalisierung, Prioritätsverteilung, Raten, Shelving und Unterdrückung liegen außerhalb. Tag-Namen werden gegen ein übliches ISA-5.1-Muster geprüft, nicht gegen die Buchstabentabelle der ISA-5.1-2024. Werte werden in SI gespeichert und nur über die Einheitenliste der Spezifikation umgerechnet. Eine Funktionsbeschreibung je Sitzung. Dies ist keine Sicherheitsbetrachtung: kein SIL, keine Aussage nach IEC 61511 oder IEC 62061, keine Verifikation einer Sicherheitsfunktion.",
  "nl": "Alleen structuuranalyse: er wordt niets gesimuleerd — geen tijd, geen scancyclus, geen procesreactie — en bereikbaarheid negeert transitievoorwaarden, dus een synchroniserende transitie telt als schakelbaar zodra alle voorafgaande stappen bereikbaar zijn. Voorwaarden gebruiken een beperkte booleaanse grammatica: één tag of staptijd vergeleken met een constante, NOT/AND/OR, stijgende en dalende flank; geen rekenkunde, geen functieblokken, geen tellers, geen vergelijking van twee variabelen. Overlapdetectie is exact tot 65 536 toekenningen per paar en behandelt tags als onafhankelijk, dus een paar dat de fysica uitsluit kan toch worden gemeld; boven de limiet blijft het paar onbepaald. Divergenties volgen de SFC-semantiek van IEC 61131-3; macrostappen, omsluitende stappen, forceeropdrachten en deel-grafcets van IEC 60848 worden niet gemodelleerd. Vergrendelingen en vrijgaven zijn alleen verwijzingen — hun logica, stemming en reset horen bij de oorzaak-gevolgmatrix. Alarmcontroles dekken prioriteit, grenzen tegen het meetbereik, volgorde van grenzen en eenheden; rationalisatie, prioriteitsverdeling, alarmfrequentie, shelving en onderdrukking vallen erbuiten. Tagnamen worden getoetst aan een gangbaar ISA-5.1-patroon, niet aan de lettertabel van ISA-5.1-2024. Waarden staan in SI en worden alleen via de eenhedenlijst van de specificatie omgerekend. Eén functionele beschrijving per sessie. Dit is geen veiligheidsbeoordeling: geen SIL, geen claim volgens IEC 61511 of IEC 62061, geen verificatie van een veiligheidsfunctie.",
  "fr": "Analyse structurelle seulement : rien n’est simulé — ni temps, ni cycle d’automate, ni réponse du procédé — et l’atteignabilité ignore les réceptivités, si bien qu’une transition de synchronisation compte comme franchissable dès que toutes les étapes amont sont atteignables. Les conditions suivent une grammaire booléenne restreinte : un repère ou un temps d’étape comparé à une constante, NOT/AND/OR, front montant et descendant ; pas d’arithmétique, pas de blocs fonctionnels, pas de compteurs, pas de comparaison entre deux variables. La détection de recouvrement est exacte jusqu’à 65 536 affectations par paire et traite les repères comme indépendants, donc une paire exclue par la physique peut être signalée ; au-delà de la limite, la paire reste indéterminée. Les divergences suivent la sémantique SFC de l’IEC 61131-3 ; macro-étapes, étapes encapsulantes, ordres de forçage et grafcets partiels de l’IEC 60848 ne sont pas modélisés. Verrouillages et permissifs ne sont que des références — leur logique, leur vote et leur réarmement appartiennent à la matrice causes-effets. Les contrôles d’alarme couvrent la priorité, les seuils face à l’étendue de mesure, l’ordre des seuils et les unités ; rationalisation, distribution des priorités, taux, mise en attente et suppression sont hors périmètre. Les repères sont contrôlés sur un format ISA-5.1 usuel, non sur la table des lettres de l’ISA-5.1-2024. Les valeurs sont stockées en SI et converties seulement par la liste d’unités de la spécification. Une description fonctionnelle par session. Ce n’est pas une analyse de sécurité : aucun SIL, aucune revendication IEC 61511 ou IEC 62061, aucune vérification de fonction de sécurité.",
  "es": "Solo análisis estructural: no se simula nada — ni tiempos, ni ciclo de scan, ni respuesta de la planta — y la alcanzabilidad ignora las condiciones de transición, de modo que una transición de sincronización cuenta como disparable en cuanto todos los pasos previos son alcanzables. Las condiciones usan una gramática booleana restringida: un TAG o tiempo de paso comparado con una constante, NOT/AND/OR, flanco de subida y de bajada; sin aritmética, sin bloques de función, sin contadores, sin comparar dos variables. La detección de solapes es exacta hasta 65 536 asignaciones por par y trata los TAG como independientes, así que un par que la física excluye puede informarse igualmente; por encima del límite el par queda indeterminado. Las divergencias siguen la semántica SFC de IEC 61131-3; macropasos, pasos envolventes, órdenes de forzado y grafcets parciales de IEC 60848 no se modelan. Enclavamientos y permisivos son solo referencias: su lógica, votación y rearme pertenecen a la matriz causa-efecto. Las comprobaciones de alarma cubren prioridad, límites frente al rango, orden de límites y unidades; racionalización, distribución de prioridades, tasas, aplazamiento y supresión quedan fuera. Los TAG se comprueban contra un patrón ISA-5.1 habitual, no contra la tabla de letras de ISA-5.1-2024. Los valores se guardan en SI y se convierten solo mediante la lista de unidades de la especificación. Una descripción funcional por sesión. No es una evaluación de seguridad: sin SIL, sin declaración según IEC 61511 o IEC 62061, sin verificación de una función de seguridad.",
  "pl": "Tylko analiza strukturalna: nic nie jest symulowane — ani czas, ani cykl sterownika, ani reakcja instalacji — a osiągalność pomija warunki przejść, więc przejście synchronizujące liczy się jako zdolne do zadziałania, gdy osiągalne są wszystkie kroki poprzedzające. Warunki korzystają z ograniczonej gramatyki logicznej: jeden tag lub czas kroku porównany ze stałą, NOT/AND/OR, zbocze narastające i opadające; bez arytmetyki, bloków funkcyjnych, liczników i porównywania dwóch zmiennych. Wykrywanie nakładania jest dokładne do 65 536 przypisań na parę i traktuje tagi jako niezależne, więc para wykluczona fizycznie również może zostać zgłoszona, a powyżej limitu para pozostaje nierozstrzygnięta. Rozgałęzienia zgodne z semantyką SFC IEC 61131-3; makrokroki, kroki obejmujące, rozkazy wymuszania i grafcety częściowe IEC 60848 nie są modelowane. Blokady i zezwolenia to tylko odwołania — ich logika, głosowanie i kasowanie należą do macierzy przyczyn i skutków. Sprawdzenia alarmów obejmują priorytet, progi względem zakresu pomiarowego, kolejność progów i jednostki; racjonalizacja, rozkład priorytetów, częstości, odkładanie i tłumienie są poza zakresem. Nazwy tagów sprawdzane są wobec zwyczajowego wzorca ISA-5.1, nie wobec tablicy liter ISA-5.1-2024. Wartości są zapisywane w SI i przeliczane wyłącznie według wykazu jednostek ze specyfikacji. Jeden opis funkcjonalny na sesję. To nie jest ocena bezpieczeństwa: bez SIL, bez deklaracji wg IEC 61511 lub IEC 62061, bez weryfikacji funkcji bezpieczeństwa."
 },

   "de": "Der unabhängig verfasste Korpus benchmarks/functionaldescription.reference.json — 106 Fälle, 1187 Prüfungen, von einem separaten Agenten aus der öffentlichen Spezifikation und den zitierten Normen ohne Zugriff auf diesen Code geschrieben — wird von window.__dgcBenchmark() gegen diesen Build neu ausgewertet: 106 Fälle und 1187 Prüfungen stimmen überein. Fünf Abweichungen des ersten Laufs hat ein unabhängiger Schiedsrichter am 23.09.2026 entschieden, zwei gegen diese Seite (die Bedingung von FUN-R-023 unter einem FUN-R-006-Blocker; FUN-R-090 und FUN-R-093 an einem Tag, der die Bezeichnergrammatik verfehlt) und drei gegen den Korpus (die Liste erreichbarer Schritte bei doppelter Schritt-ID; der FUN-R-093-Befund an einem Tag in einer Bedingung, die geparst wird und erst danach die Einheitenprüfung verfehlt, samt ihrer Anzahl). Dieselbe Entscheidung ergänzte vier Paketfälle: load_io, open_fd, apply_project und die Reihenfolge des geschriebenen Registers. Ein zweiter Schiedsdurchgang am 23.09.2026 ergänzte zwölf Fälle, jeder belegt durch einen Mutanten dieser Engine, den die bisherigen 94 Fälle nicht vom ausgelieferten Code unterscheiden konnten: der Alarmtyp DEV, der Zweig mit leerem Eintritt in der Saat der Modus-Erreichbarkeit, die Zweige Richtung und Einheit der E/A-Konfliktregel, die Einheiten für Druck und Füllstand, ein Schlüsselwort als Tag, die Grenzwertordnung bei Gleichheit, vier Vergleichsoperatoren samt den zwei Flankenbedingungen und der Schrittzeit-Stützstelle bei null, ein Bus-Tag mit gelesener statt abgeleiteter Richtung, ein Übergang mit leerem Ziel, eine Sequenz aus einem Schritt, ein E/A-Bereich mit gleichen Grenzen und der Ablehnungsgrund für einen fehlerhaften Code. Die vier durchgerechneten Beispiele der Spezifikation liefern auf dieser Seite die angegebenen Befunde, Anzahlen, Ergebnisse, Erreichbarkeitslisten, Überschneidungszeugen und Bereichslagen. Zitierte Abschnitte: IEC 60848:2013 3.1.1, 3.1.11, 3.1.13–3.1.15, 4.3.2, 4.3.3, 4.4; IEC    "nl": "Het onafhankelijk opgestelde corpus benchmarks/functionaldescription.reference.json — 106 gevallen, 1187 controles, geschreven door een aparte agent vanuit de openbare specificatie en de genoemde normen zonder toegang tot deze code — wordt door window.__dgcBenchmark() opnieuw tegen deze build beoordeeld: 106 gevallen en 1187 controles komen overeen. Vijf verschillen uit de eerste run zijn op 23-09-2026 door een onafhankelijke arbiter beslecht, twee tegen deze pagina (de voorwaarde van FUN-R-023 onder een FUN-R-006-blokkade; FUN-R-090 en FUN-R-093 op een tag die de identifiergrammatica niet haalt) en drie tegen het corpus (de lijst bereikbare stappen bij een dubbele stap-id; de FUN-R-093-bevinding op een tag in een voorwaarde die wel ontleedt en pas daarna de eenheidscontrole mist, met de bijbehorende telling). Dezelfde arbitrage voegde vier pakketgevallen toe: load_io, open_fd, apply_project en de volgorde van het geschreven register. Een tweede arbitrageronde op 23-09-2026 voegde twaalf gevallen toe, elk aangetoond met een mutant van deze engine die de eerdere 94 gevallen niet van de geleverde code konden onderscheiden: het alarmtype DEV, de tak met lege ingang in de startverzameling van de modusbereikbaarheid, de takken richting en eenheid van de I/O-conflictregel, de eenheden voor druk en niveau, een sleutelwoord als tag, de grenswaardevolgorde bij gelijkheid, vier vergelijkingsoperatoren met de twee flankvoorwaarden en het staptijdsteunpunt op nul, een bustag met gelezen in plaats van afgeleide richting, een overgang met een lege bestemming, een reeks van één stap, een I/O-bereik met gelijke grenzen en de weigeringsreden voor een onjuiste code. De vier uitgewerkte voorbeelden uit de specificatie geven op deze pagina de vermelde bevindingen, aantallen, oordelen, bereikbaarheidslijsten, overlapbewijzen en bereikposities. Genoemde clausules: IEC 60848:2013 3.1.1, 3.1.11, 3.1.13–3.1.15, 4.3.2, 4.3.3, 4.4; IEC 61131-3:2003 2.6.2, 2.6.4.4, 2.6.5 en tabel 46,    "fr": "Le corpus rédigé indépendamment benchmarks/functionaldescription.reference.json — 106 cas, 1187 vérifications, écrit par un agent distinct à partir de la spécification publique et des normes citées sans accès à ce code — est réévalué par window.__dgcBenchmark() sur cette version : 106 cas et 1187 vérifications concordent. Cinq désaccords du premier passage ont été tranchés par un arbitre indépendant le 23/09/2026, deux contre cette page (la condition de FUN-R-023 sous un bloqueur FUN-R-006 ; FUN-R-090 et FUN-R-093 sur un tag qui échoue à la grammaire des identifiants) et trois contre le corpus (la liste des étapes atteignables lorsqu’un identifiant d’étape est dupliqué ; le constat FUN-R-093 sur un tag cité dans une condition qui s’analyse puis échoue au contrôle d’unité, avec son compte). Le même arbitrage a ajouté quatre cas de paquet : load_io, open_fd, apply_project et l’ordre du registre écrit. Un second passage d’arbitrage le 23/09/2026 a ajouté douze cas, chacun démontré par un mutant de ce moteur que les 94 cas précédents ne distinguaient pas du code livré : le type d’alarme DEV, la branche à entrée vide dans l’amorce d’atteignabilité des modes, les branches sens et unité de la règle de conflit avec l’E/S, les unités de pression et de niveau, un mot-clé employé comme tag, l’ordre des seuils d’alarme à égalité, quatre opérateurs de comparaison avec les deux contraintes de front et le point d’échantillonnage du temps d’étape à zéro, un tag de bus dont le sens est lu et non déduit, une transition à destination vide, une séquence d’une seule étape, une étendue d’E/S à bornes égales et le motif de refus d’un code mal formé. Les quatre exemples détaillés de la spécification reproduisent sur cette page les constats, comptes, verdicts, listes d’atteignabilité, témoins de recouvrement et positions dans l’étendue annoncés. Clauses citées : IEC 60848:2013 3.1.1, 3.1.11, 3.1.13–3.1.15, 4.3.2, 4.3.3, 4.4 ; IEC 61131-3:2003 2.6.2, 2.6.4.4, 2.6.5 et tableau 46, I    "es": "El corpus redactado de forma independiente benchmarks/functionaldescription.reference.json — 106 casos, 1187 comprobaciones, escrito por un agente aparte a partir de la especificación pública y de las normas citadas sin acceso a este código — se reevalúa con window.__dgcBenchmark() sobre esta compilación: coinciden 106 casos y 1187 comprobaciones. Cinco discrepancias de la primera pasada las resolvió un árbitro independiente el 23-09-2026: dos en contra de esta página (la condición de FUN-R-023 bajo un bloqueador FUN-R-006; FUN-R-090 y FUN-R-093 sobre un tag que incumple la gramática de identificadores) y tres en contra del corpus (la lista de pasos alcanzables con un identificador de paso duplicado; el hallazgo FUN-R-093 sobre un tag citado en una condición que sí se analiza y solo después incumple la comprobación de unidades, con su recuento). El mismo arbitraje añadió cuatro casos de paquete: load_io, open_fd, apply_project y el orden del registro escrito. Una segunda pasada de arbitraje el 23-09-2026 añadió doce casos, cada uno demostrado con un mutante de este motor que los 94 casos anteriores no distinguían del código entregado: el tipo de alarma DEV, la rama de entrada vacía en la semilla de alcanzabilidad de modos, las ramas de sentido y unidad de la regla de conflicto con la E/S, las unidades de presión y de nivel, una palabra clave usada como tag, el orden de los límites de alarma en igualdad, cuatro operadores de comparación con las dos restricciones de flanco y el punto de muestreo del tiempo de paso en cero, un tag de bus cuyo sentido se lee y no se deduce, una transición con destino vacío, una secuencia de un solo paso, un rango de E/S con límites iguales y el motivo de rechazo de un código mal formado. Los cuatro ejemplos resueltos de la especificación reproducen en esta página los hallazgos, recuentos, veredictos, listas de alcanzabilidad, testigos de solape y posiciones en el rango indicados. Cláusulas citadas: IEC 60848:2013 3.1.1, 3.1.11    "pl": "Niezależnie opracowany korpus benchmarks/functionaldescription.reference.json — 106 przypadków, 1187 sprawdzeń, napisany przez osobnego agenta na podstawie publicznej specyfikacji i przywołanych norm bez dostępu do tego kodu — jest ponownie oceniany przez window.__dgcBenchmark() na tej kompilacji: zgadza się 106 przypadków i 1187 sprawdzeń. Pięć rozbieżności z pierwszego przebiegu rozstrzygnął niezależny arbiter 23.09.2026: dwie przeciw tej stronie (warunek FUN-R-023 pod blokadą FUN-R-006; FUN-R-090 i FUN-R-093 na tagu, który łamie gramatykę identyfikatorów) i trzy przeciw korpusowi (lista osiągalnych kroków przy zduplikowanym identyfikatorze kroku; ustalenie FUN-R-093 na tagu w warunku, który parsuje się i dopiero potem nie przechodzi kontroli jednostek, wraz z jego liczbą). To samo rozstrzygnięcie dodało cztery przypadki pakietu: load_io, open_fd, apply_project oraz kolejność zapisanego rejestru. Druga tura rozstrzygnięcia 23.09.2026 dodała dwanaście przypadków, każdy wykazany mutantem tego silnika, którego wcześniejsze 94 przypadki nie odróżniały od dostarczanego kodu: typ alarmu DEV, gałąź pustego wejścia w zarodku osiągalności trybów, gałęzie kierunku i jednostki reguły konfliktu z we/wy, jednostki dla ciśnienia i poziomu, słowo kluczowe użyte jako tag, porządek progów alarmowych przy równości, cztery operatory porównania wraz z dwoma warunkami zbocza i punktem próbkowania czasu kroku w zerze, tag magistrali o kierunku odczytanym, a nie wyprowadzonym, przejście z pustym celem, sekwencję z jednego kroku, zakres we/wy o równych granicach oraz powód odmowy dla błędnego kodu. Cztery rozpisane przykłady specyfikacji odtwarzają na tej stronie podane ustalenia, liczby, werdykty, listy osiągalności, świadków nakładania i pozycje w zakresie. Przywołane punkty: IEC 60848:2013 3.1.1, 3.1.11, 3.1.13–3.1.15, 4.3.2, 4.3.3, 4.4; IEC 61131-3:2003 2.6.2, 2.6.4.4, 2.6.5 i tablica 46, IEC 61131-3:2013 6.7.2–6.7.5 według tytułów punktów; IEC 62682:2022 oraz ANSI/ISA-5.1- .fd-figsel { margin-bottom: 8px; }
.fd-conflict { border-left: 3px solid var(--warn, #b26a00); padding-left: 8px; margin: 6px 0; }
.fd-conflict-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.fd-flag { color: var(--warn, #b26a00); }

/* The header row puts the return link, the h1 and the subtitle on one flex
   line. At 390 px that leaves the h1 74-91 px, narrower than the longest word
   of the title in en, nl, pl and uk (106-167 px), and the browser breaks
   inside the word. Letting the title take its own line gives it 235-279 px.
   This belongs in diagram-ui.js for every tool; it is here until it is there. */
@media (max-width: 640px) {
  .dgu-head-l { flex-wrap: wrap; }
  .dgu-head-l .dgu-title { flex: 1 1 100%; }
}

/* Row lists. ui.js gives every column an absolute track floor, so a 13-column
   list needs 981-1269 px against the 596 px the calculator stage column has at
   1440. The list carries that width itself and scrolls inside the panel:
   min-content on the header and the rows is the sum of the floors and the gaps,
   identical in both because the floors are lengths, so the columns stay in line
   while they scroll together. Below the framework's md breakpoint each row is a
   stacked card with no columns at all, and print gets the whole width. */
@media (min-width: 768px) {
  .dgu-list { overflow-x: auto; scrollbar-width: thin; scrollbar-color: var(--muted) transparent; }
  .dgu-list-h, .dgu-list-rows, .dgu-list-row { min-width: min-content; }
  /* A classic scrollbar rather than the overlay one, so a list that is 528 px
     wider than its column says so without being touched first. */
  .dgu-list::-webkit-scrollbar { height: 10px; }
  .dgu-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }
  .dgu-list::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  .dgu-list-add, .dgu-list-empty { position: sticky; left: 0; }
}
@media print {
  .dgu-list { overflow: visible; }
}

function ruleTitle(id, l) { return own(RULES, id) ? L(RULES[id].title, l) : id; }
function ruleBasis(id, l) {
 if (!own(RULES, id)) return '';
 return str(RULES[id].basis).split('@am').join(L(S.am, l)).split('@titles').join(L(S.titleOnly, l));
}

  body: T('You write the control narrative of one system — modes, sequences, loops, interlocks, alarms — and the page checks its structure: steps nothing reaches, steps nothing leaves, two transitions that can clear at once, tags that do not exist or point the wrong way, setpoints and alarm limits outside the instrument range, modes with no way out and no fault response. It draws the sequence chart and the mode diagram from the same model and writes the result into the project package.',
   'Ви пишете опис керування однієї системи — режими, послідовності, контури, блокування, сигналізацію — а сторінка перевіряє структуру: кроки, яких ніщо не досягає, кроки без вихідного переходу, два переходи, що спрацьовують одночасно, неіснуючі або хибно спрямовані теги, уставки й пороги сигналізації поза діапазоном, режими, які неможливо залишити, та без реакції на відмову. З тієї самої моделі будуються схема послідовності й діаграма режимів, а результат пишеться до пакета проєкту.',

  footer: T('Reachability is a fixpoint over the step graph; an overlap is found by enumerating the sample points of the two conditions (at most 65 536 combinations). Stored SI: K, Pa, m3/s, kg/s, m, s, fraction. Standards: IEC 60848:2013, IEC 61131-3:2013 (wording from the 2003 edition), IEC 62682:2022, ANSI/ISA-5.1-2024.',
   'Досяжність — нерухома точка на графі кроків; перекриття шукається перебором точок вибірки двох умов (не більше 65 536 комбінацій). Зберігається в SI: K, Па, м3/с, кг/с, м, с, частка. Стандарти: IEC 60848:2013, IEC 61131-3:2013 (формулювання за виданням 2003), IEC 62682:2022, ANSI/ISA-5.1-2024.',
   'Die Erreichbarkeit ist ein Fixpunkt über dem Schrittgraphen; eine Überschneidung wird durch Aufzählen der Stützstellen beider Bedingungen gefunden (höchstens 65 536 Kombinationen). Gespeichert in SI: K, Pa, m3/s, kg/s, m, s, Anteil. Normen: IEC 60848:2013, IEC 61131-3:2013 (Wortlaut aus der Ausgabe 2003), IEC 62682:2022, ANSI/ISA-5.1-2024.',

   i += 2\n            continue\n        if c in \"<>=\":\n            out.append({\"t\": \"op\", \"v\": c, \"pos\": i})\n            i += 1\n            continue\n        m = re.match(r\"[A-Za-z][A-Za-z0-9_-]*\", s[i:])\n        if m:\n            word = m.group(0).upper()\n            start = i\n            i += len(m.group(0))\n            sf = re.match(r\"\\.([XxTt])(?![A-Za-z0-9_])\", s[i:])\n            if sf:\n                out.append({\"t\": \"step\", \"v\": word, \"f\": sf.group(1).upper(), \"pos\": start})\n                i += 2\n                continue\n            out.append({\"t\": \"kw\" if word in KEYWORDS else \"id\", \"v\": word, \"pos\": start})\n            continue\n        m = re.match(r\"-?[0-9]+(\\.[0-9]+)?([eE][+-]?[0-9]+)?\", s[i:])\n        if m:\n            out.append({\"t\": \"num\", \"v\": float(m.group(0)), \"pos\": i})\n            i += len(m.group(0))\n            j = i\n            while j < len(s) and s[j] in \" \\t\":\n                j += 1\n            for u in UNIT_TOKENS:\n                nxt = s[j + len(u)] if j + len(u) < len(s) else \"\"\n                if s[j:j + len(u)] == u and not re.match(r\"[A-Za-z0-9_]\", nxt):\n                    out.append({\"t\": \"unit\", \"v\": u, \"pos\": j})\n                    i = j + len(u)\n                    break\n            continue\n        return out, {\"pos\": i, \"code\": \"char\"}\n    return out, None\n\n\nclass _ParseError(Exception):\n    pass\n\n\ndef parse_condition(src):\n    toks, err = tokenize(src)\n    if err:\n        return None, err\n    st = {\"p\": 0}\n\n    def peek():\n        return toks[st[\"p\"]] if st[\"p\"] < len(toks) else None\n\n    def is_kw(t, w):\n        return t is not None and t[\"t\"] == \"kw\" and t[\"v\"] == w\n\n    def fail(code):\n        raise _ParseError(code)\n\n    def expr():\n        a = [and_expr()]\n        while is_kw(peek(), \"OR\"):\n            st[\"p\"] += 1\n            a.append(and_expr())\n        return a[0] if len(a) == 1 else {\"k\": \"or\", \"a\": a}\n\n    def and_expr():\n        a = [unary()]\n        while is_kw(peek(), \"AND\"):\n            st[\"p\"] += 1\n            a.append(unary())\n        return a[0] if len(a) == 1 else {\"k\": \"and\", \"a\": a}\n\n    def unary():\n        if is_kw(peek(), \"NOT\"):\n            st[\"p\"] += 1\n            return {\"k\": \"not\", \"e\": unary()}\n        return primary()\n\n    def compare_tail(operand, tok):\n        op = peek()\n        if op is None or op[\"t\"] != \"op\":\n            return None\n        st[\"p\"] += 1\n        n = peek()\n        if n is None or n[\"t\"] != \"num\":\n            fail(\"number\")\n        st[\"p\"] += 1\n        node = {\"k\": \"cmp\", \"op\": op[\"v\"], \"operand\": operand, \"num\": n[\"v\"], \"unit\": None, \"pos\": tok[\"pos\"]}\n        if peek() is not None and peek()[\"t\"] == \"unit\":\n            node[\"unit\"] = peek()[\"v\"]\n            st[\"p\"] += 1\n        return node\n\n    def primary():\n        t = peek()\n        if t is None:\n            fail(\"end\")\n        if t[\"t\"] == \"(\":\n            st[\"p\"] += 1\n            e = expr()\n            if peek() is None or peek()[\"t\"] != \")\":\n                fail(\"paren\")\n            st[\"p\"] += 1\n            return e\n        if is_kw(t, \"TRUE\"):\n            st[\"p\"] += 1\n            return {\"k\": \"const\", \"v\": True}\n        if is_kw(t, \"FALSE\"):\n            st[\"p\"] += 1\n            return {\"k\": \"const\", \"v\": False}\n        if is_kw(t, \"RE\") or is_kw(t, \"FE\"):\n            st[\"p\"] += 1\n            if peek() is None or peek()[\"t\"] != \"(\":\n                fail(\"paren_open\")\n            st[\"p\"] += 1\n            idt = peek()\n            if idt is None or idt[\"t\"] != \"id\":\n                fail(\"ident\")\n            st[\"p\"] += 1\n            if peek() is None or peek()[\"t\"] != \")\":\n                fail(\"paren\")\n            st[\"p\"] += 1\n            return {\"k\": \"edge\", \"f\": t[\"v\"], \"name\": idt[\"v\"]}\n        if t[\"t\"] == \"id\":\n            st[\"p\"] += 1\n            c1 = compare_tail({\"kind\": \"tag\", \"name\": t[\"v\"]}, t)\n            return c1 if c1 is not None else {\"k\": \"ref\", \"kind\": \"tag\", \"name\": t[\"v\"]}\n        if t[\"t\"] == \"step\":\n            st[\"p\"] += 1\n            if t[\"f\"] == \"T\":\n                c2 = compare_tail({\"kind\": \"steptime\", \"name\": t[\"v\"]}, t)\n                if c2 is None:\n                    fail(\"steptime\")\n                return c2\n            if peek() is not None and peek()[\"t\"] == \"op\":\n                fail(\"stepflag\")\n            return {\"k\": \"ref\", \"kind\": \"stepflag\", \"name\": t[\"v\"]}\n        fail(\"unexpected\")\n\n    try:\n        if not toks:\n            return None, {\"code\": \"empty\"}\n        ast = expr()\n        if st[\"p\"] < len(toks):\n            fail(\"unexpected\")\n        return ast, None\n    except _ParseError as e:\n        return None, {\"code\": str(e)}\n\n\ndef ast_refs(ast):\n    r = {\"tags\": [], \"steps\": [], \"units\": []}\n\n    def add(a, x):\n        if x not in a:\n            a.append(x)\n\n    def walk(n):\n        k = n[\"k\"]\n        if k in (\"or\", \"and\"):\n            for x in n[\"a\"]:\n                walk(x)\n        elif k == \"not\":\n            walk(n[\"e\"])\n        elif k == \"edge\":\n            add(r[\"tags\"], n[\"name\"])\n        elif k == \"ref\":\n            add(r[\"tags\"] if n[\"kind\"] == \"tag\" else r[\"steps\"], n[\"name\"])\n        elif k == \"cmp\":\n            add(r[\"tags\"] if n[\"operand\"][\"kind\"] == \"tag\" else r[\"steps\"], n[\"operand\"][\"name\"])\n            if n[\"unit\"]:\n                r[\"units\"].append(n)\n    walk(ast)\n    return r\n\n\n# ---------------------------------------------------------------- 4.3 satisfiability\ndef var_name(n):\n    if n[\"k\"] == \"cmp\":\n        return n[\"operand\"][\"name\"] + \". x in n[\"a\"])\n    if k == \"not\":\n        return not eval_ast(n[\"e\"], A, V)\n    if k == \"const\":\n        return n[\"v\"]\n    if k == \"edge\":\n        return A[var_name(n)] is True\n    if k == \"ref\":\n        nm = var_name(n)\n        return (A[nm] != 0) if V[nm][\"numeric\"] else (A[nm] is True)\n    if k == \"cmp\":\n        x, y, op = A[var_name(n)], cmp_value(n), n[\"op\"]\n        return {\"<\": x < y, \"<=\": x <= y, \">\": x > y, \">=\": x >= y, \"=\": x == y, \"<>\": x != y}[op]\n    return False\n\n\ndef satisfy(asts):\n    V, names, edges = collect_vars(asts)\n    domains = []\n    N = 1\n    b = 0\n    for k in names:\n        v = V[k]\n        if v[\"numeric\"]:\n            domains.append(sample_points(v))\n            N *= 2 * len(v[\"th\"]) + 1\n        else:\n            domains.append([False, True])\n            b += 1\n    N *= 2 ** b\n    if N > ENUM_CAP:\n        return \"undetermined\", None\n    cons = []\n    for f, x in edges:\n        re_, fe_ = \"RE(\" + x + \")\", \"FE(\" + x + \")\"\n        cons.append((re_ if re_ in V else None, fe_ if fe_ in V else None,\n                     x if (x in V and not V[x][\"numeric\"]) else None))\n\n    def ok(A):\n        for re_, fe_, x in cons:\n            if re_ and fe_ and A[re_] is True and A[fe_] is True:\n                return False\n            if x and re_ and A[re_] is True and A[x] is not True:\n                return False\n            if x and fe_ and A[fe_] is True and A[x] is not False:\n                return False\n        return True\n\n    if any(len(dm) == 0 for dm in domains):\n        return \"unsat\", None\n    idx = [0] * len(names)\n    while True:\n        A = {names[q]: domains[q][idx[q]] for q in range(len(names))}\n        if ok(A) and all(eval_ast(a, A, V) for a in asts):\n            return \"sat\", A\n        pos = len(names) - 1\n        while pos >= 0:\n            idx[pos] += 1\n            if idx[pos] < len(domains[pos]):\n                break\n            idx[pos] = 0\n            pos -= 1\n        if pos < 0:\n            return \"unsat\", None\n\n\n# ---------------------------------------------------------------- 4.1 tag lookup\ndef dir_of_signal(sig, direction):\n    if sig in (\"DI\", \"AI\"):\n        return \"in\"\n    if sig in (\"DO\", \"AO\"):\n        return \"out\"\n    if sig == \"soft\":\n        return \"internal\"\n    if sig == \"bus\":\n        return direction if direction in (\"in\", \"out\") else \"unknown\"\n    return \"unknown\"\n\n\ndef norm_state(s):\n    s = d(s)\n    tags = []\n    for t in (s.get(\"tags\") if isinstance(s.get(\"tags\"), list) else []):\n        t = d(t)\n        tags.append({\"tag\": nid(t.get(\"tag\")), \"signal\": canon(t.get(\"signal\"), SIGNALS),\n                     \"direction\": _trim(t.get(\"direction\")).lower() if t.get(\"direction\") is not None else \"\",\n                     \"unit\": _s(t.get(\"unit\")), \"range_min\": num_or_null(t.get(\"range_min\")),\n                     \"range_max\": num_or_null(t.get(\"range_max\"))})\n    io = s.get(\"io\")\n    points = []\n    if isinstance(io, dict):\n        for p in (io.get(\"points\") if isinstance(io.get(\"points\"), list) else []):\n            p = d(p)\n            points.append({\"tag\": nid(p.get(\"tag\")), \"signal\": canon(p.get(\"signal\"), IO_SIGNALS),\n                           \"direction\": _trim(p.get(\"direction\")).lower() if p.get(\"direction\") is not None else \"\",\n                           \"unit\": _s(p.get(\"unit\")), \"range_min\": num_or_null(p.get(\"range_min\")),\n                           \"range_max\": num_or_null(p.get(\"range_max\"))})\n    modes = []\n    for m in (s.get(\"modes\") if isinstance(s.get(\"modes\"), list) else []):\n        m = d(m)\n        fr = m.get(\"fault_response\")\n        modes.append({\"id\": nid(m.get(\"id\")), \"initial\": m.get(\"initial\") is True,\n                      \"global_entry\": m.get(\"global_entry\") is True, \"entry\": _s(m.get( pute():\n    st = norm_state(INPUTS)\n    known, attr, rng, unit_of = tag_context(st)\n    F = []\n\n    def add(rule, target, tag=None):\n        F.append(rule + \"|\" + target + \"|\" + (\"\" if tag is None else tag))\n\n    mode_ids = set(m[\"id\"] for m in st[\"modes\"])\n\n    def condition(src, owner, mode=False, steps=None, unknown_rule=\"FUN-R-016\"):\n        \"\"\"Returns the AST when the condition carries no blocker, else None.\"\"\"\n        if _trim(src) == \"\":\n            return None\n        ast, err = parse_condition(src)\n        if err:\n            add(\"FUN-R-003\", owner)\n            return None\n        R = ast_refs(ast)\n        if mode and R[\"steps\"]:\n            add(\"FUN-R-003\", owner)\n            return None\n        for n in R[\"units\"]:\n            op_si = None\n            if n[\"operand\"][\"kind\"] == \"steptime\":\n                op_si = \"s\"\n            elif n[\"operand\"][\"name\"] in known:\n                a = attr(n[\"operand\"][\"name\"])\n                op_si = a[\"unit\"] if a else None\n            if op_si is not None and UNIT_DEF[n[\"unit\"]][0] != op_si:\n                add(\"FUN-R-003\", owner)\n                return None\n        if steps is not None and any(x not in steps for x in R[\"steps\"]):\n            return \"badstep\"\n        for tag in R[\"tags\"]:\n            if tag not in known:\n                add(unknown_rule, owner, tag)\n        return ast\n\n    # modes\n    M = set(m[\"id\"] for m in st[\"modes\"] if m[\"initial\"] or (m[\"global_entry\"] and _trim(m[\"entry\"]) != \"\"))\n    grew = True\n    while grew:\n        grew = False\n        for m in st[\"modes\"]:\n            if m[\"id\"] not in M:\n                continue\n            tos = [e[\"to\"] for e in m[\"exits\"]]\n            if m[\"fault_response\"] and m[\"fault_response\"][\"target\"] != \"\":\n                tos.append(m[\"fault_response\"][\"target\"])\n            for t in tos:\n                if t in mode_ids and
