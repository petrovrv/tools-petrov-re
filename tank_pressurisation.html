/* The acceptance range of one quantity in the state s. loOpen marks a bound the
   value has to exceed rather than meet. */
function hoRange(k,s){
 if(k==='p')return {lo:s.p0,hi:HO_P_MAX,loOpen:true};
 if(k==='T')return {lo:HO_T_MIN,hi:HO_T_MAX,loOpen:false};
 if(k==='A')return {lo:HO_A_MIN,hi:HO_A_MAX,loOpen:false};
 return null;
}
function hoOk(k,v,s){
 var r=hoRange(k,s);
 if(!r||typeof v!=='number'||!isFinite(v))return false;
 return (r.loOpen?v>r.lo:v>=r.lo)&&v<=r.hi;
}
/* SI digits, no thousands separator: the payload is SI and the sentence says
   which unit it is in. */
function hoNum(v){
 if(v===0)return '0';
 var a=Math.abs(v);
 if(a<1e-4||a>=1e9)return v.toExponential(3);
 return String(Math.round(v*1e6)/1e6);
}
function hoRefusalMap(k,v,s){
 var r=hoRange(k,s),u=HO_UNIT[k]||'',m=r.loOpen?HO_MSG.above:HO_MSG.span,out={};
 Object.keys(m).forEach(function(l){
  out[l]=m[l].replace(/%q/g,k).replace(/%v/g,hoNum(v)).replace(/%r/g,HO_ROLE[k][l])
             .replace(/%a/g,hoNum(r.lo)).replace(/%b/g,hoNum(r.hi)).replace(/%u/g,u);
 });
 return out;
}
function hoRefusal(k,v,s){var o=hoRefusalMap(k,v,s),l=dgcLang();return o[l]||o.en;}
/* The typed field is validated against the same range, so the page does not
   hold one behaviour for typing and another for a handoff. */
function hoTypedCheck(k,v,s){return hoOk(k,v,s)?true:hoRefusalMap(k,v,s);}
function hoSay(msg){try{if(window.Diagram&&Diagram.notify)Diagram.notify(msg,'warn');}catch(e){}}

/* Shared transient-tool chart.
   Replaces the single-extent drawStage used by the Pipe/Vessel Transients family.
   Series carrying different units get their own axis, so a curve is never
   flattened by an unrelated quantity sharing its scale.

   spec = { x:{label,unit}, series:[{x:[],y:[],label,unit}] }
   Series are grouped by unit; the first group takes the left axis, the second
   the right. A third distinct unit would have nowhere to go, so the plotter
   reports it to the caller instead of drawing it silently on the wrong scale. */
function dgcPlot(ctx, w, h, spec, opt) {
  opt = opt || {};
  var density = opt.density || 'fine';
  var css = opt.css || {};
  var muted = css.muted || '#6b7280', line = css.line || '#d6dae0',
      text = css.text || '#1f2430', font = css.font || 'sans-serif',
      bg = css.bg || null;
  var coarse = density === 'coarse';
  var fs = opt.fontScale || 1;
  var f1 = Math.round(11 * fs), f2 = Math.round(12 * fs);

  var groups = [], skipped = [];
  (spec.series || []).forEach(function (s) {
    if (!s || !s.x || !s.y || !s.x.length) return;
    var u = s.unit == null ? '' : String(s.unit);
    var g = null;
    for (var i = 0; i < groups.length; i++) if (groups[i].unit === u) { g = groups[i]; break; }
    if (!g) {
      if (groups.length >= 2) { skipped.push(s.label || u); return; }
      g = { unit: u, series: [] }; groups.push(g);
    }
    g.series.push(s);
  });
  if (!groups.length) return { drawn: 0, skipped: skipped };

  // Extents per axis group, and the shared x extent.
  var xs = [];
  groups.forEach(function (g) {
    var lo = Infinity, hi = -Infinity;
    g.series.forEach(function (s) {
      s.x.forEach(function (v) { if (isFinite(v)) xs.push(v); });
      s.y.forEach(function (v) { if (isFinite(v)) { if (v < lo) lo = v; if (v > hi) hi = v; } });
    });
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    if (hi === lo) { var d = Math.max(1e-9, Math.abs(lo) * 0.05); lo -= d; hi += d; }
    else { var pad = (hi - lo) * 0.06; lo -= pad; hi += pad; }
    g.lo = lo; g.hi = hi;
  });
  if (!xs.length) return { drawn: 0, skipped: skipped };
  var xmin = Math.min.apply(null, xs), xmax = Math.max.apply(null, xs);
  if (xmax === xmin) xmax = xmin + 1;

  var hasRight = groups.length > 1;
  var padL = (coarse ? 52 : 64) * fs, padR = (hasRight ? (coarse ? 52 : 64) : 16) * fs;
  var padT = 12 * fs, padB = (44 + (spec.series.length > 1 ? 16 : 0)) * fs;
  var W = w - padL - padR, H = h - padT - padB;
  if (W <= 20 || H <= 20) return { drawn: 0, skipped: skipped };

  if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h); } else ctx.clearRect(0, 0, w, h);

  var X = function (v) { return padL + W * (v - xmin) / (xmax - xmin); };
  var Yof = function (g) { return function (v) { return padT + H - H * (v - g.lo) / (g.hi - g.lo); }; };

  var tick = opt.ticks || function (lo, hi) {
    var n = 5, out = [], step = (hi - lo) / n;
    var mag = Math.pow(10, Math.floor(Math.log(step) / Math.LN10)), norm = step / mag;
    step = (norm >= 5 ? 5 : norm >= 2 ? 2 : 1) * mag;
    for (var v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(v);
    return out;
  };
  var fmt = opt.fmt || function (v) {
    var a = Math.abs(v);
    if (a !== 0 && (a < 1e-3 || a >= 1e5)) return v.toExponential(1);
    return String(Math.round(v * 1000) / 1000);
  };

  // Grid, drawn first so the curves sit on top of it.
  ctx.strokeStyle = line; ctx.lineWidth = 1;
  ctx.globalAlpha = 0.45;
  tick(groups[0].lo, groups[0].hi).forEach(function (v) {
    var y = Yof(groups[0])(v);
    if (y < padT - 0.5 || y > padT + H + 0.5) return;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + W, y); ctx.stroke();
  });
  tick(xmin, xmax).forEach(function (v) {
    var x = X(v);
    if (x < padL - 0.5 || x > padL + W + 0.5) return;
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + H); ctx.stroke();
  });
  ctx.globalAlpha = 1;

  // Frame.
  ctx.strokeStyle = muted; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + H); ctx.lineTo(padL + W, padT + H); ctx.stroke();
  if (hasRight) { ctx.beginPath(); ctx.moveTo(padL + W, padT); ctx.lineTo(padL + W, padT + H); ctx.stroke(); }

  ctx.font = '400 ' + f1 + 'px ' + font;
  ctx.fillStyle = muted;

  // Left axis.
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  tick(groups[0].lo, groups[0].hi).forEach(function (v) {
    var y = Yof(groups[0])(v);
    if (y < padT - 0.5 || y > padT + H + 0.5) return;
    ctx.beginPath(); ctx.moveTo(padL - 4, y); ctx.lineTo(padL, y); ctx.stroke();
    ctx.fillText(fmt(v), padL - 7, y);
  });
  // Right axis.
  if (hasRight) {
    ctx.textAlign = 'left';
    tick(groups[1].lo, groups[1].hi).forEach(function (v) {
      var y = Yof(groups[1])(v);
      if (y < padT - 0.5 || y > padT + H + 0.5) return;
      ctx.beginPath(); ctx.moveTo(padL + W, y); ctx.lineTo(padL + W + 4, y); ctx.stroke();
      ctx.fillText(fmt(v), padL + W + 7, y);
    });
  }
  // X axis.
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  tick(xmin, xmax).forEach(function (v) {
    var x = X(v);
    if (x < padL - 0.5 || x > padL + W + 0.5) return;
    ctx.beginPath(); ctx.moveTo(x, padT + H); ctx.lineTo(x, padT + H + 4); ctx.stroke();
    ctx.fillText(fmt(v), x, padT + H + 7);
  });

  // Axis titles carry the unit, so a reader never has to guess the scale.
  ctx.fillStyle = text; ctx.font = '500 ' + f2 + 'px ' + font;
  var xTitle = (spec.x && spec.x.label ? spec.x.label : '') + (spec.x && spec.x.unit ? ', ' + spec.x.unit : '');
  if (xTitle) { ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText(xTitle, padL + W / 2, h - (spec.series.length > 1 ? 20 * fs : 5 * fs)); }
  function axisTitle(g, right) {
    var t = (g.series.length === 1 && g.series[0].label ? g.series[0].label : (g.title || '')) + (g.unit ? ', ' + g.unit : '');
    if (!t) return;
    // Both titles are rotated so their glyphs fall inside the canvas: after the
    // rotation a 'top' baseline places them toward the plot, either way.
    ctx.save(); ctx.translate(right ? w - 3 * fs : 13 * fs, padT + H / 2);
    ctx.rotate(right ? Math.PI / 2 : -Math.PI / 2);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(t, 0, 0); ctx.restore();
  }
  axisTitle(groups[0], false); if (hasRight) axisTitle(groups[1], true);

  // Curves.
  var colors = opt.colors || ['#1f6feb', '#d1651a', '#2f9e44', '#9333ea', '#0891b2'];
  var idx = 0, legend = [];
  groups.forEach(function (g, gi) {
    var Y = Yof(g);
    g.series.forEach(function (s) {
      var col = s.color || colors[idx % colors.length];
      legend.push({ label: s.label || '', unit: g.unit, color: col, dash: gi === 1 });
      ctx.strokeStyle = col; ctx.lineWidth = 2 * fs; ctx.lineJoin = 'round';
      ctx.setLineDash(gi === 1 ? [6 * fs, 4 * fs] : []);
      ctx.beginPath(); var began = false;
      for (var i = 0; i < s.x.length; i++) {
        var xv = s.x[i], yv = s.y[i];
        if (!isFinite(xv) || !isFinite(yv)) { began = false; continue; }
        var px = X(xv), py = Y(yv);
        if (!began) { ctx.moveTo(px, py); began = true; } else ctx.lineTo(px, py);
      }
      ctx.stroke(); ctx.setLineDash([]);
      idx++;
    });
  });

  // Legend, only when more than one curve is on the plot.
  if (legend.length > 1) {
    ctx.font = '400 ' + f1 + 'px ' + font; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    var items = legend.map(function (l) { return { l: l, w: ctx.measureText(l.label + (l.unit ? ', ' + l.unit : '')).width + 26 * fs }; });
    var total = items.reduce(function (a, b) { return a + b.w; }, 0);
    var cx = padL + Math.max(0, (W - total) / 2), cy = h - 6 * fs;
    items.forEach(function (it) {
      ctx.strokeStyle = it.l.color; ctx.lineWidth = 2 * fs;
      ctx.setLineDash(it.l.dash ? [6 * fs, 4 * fs] : []);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + 18 * fs, cy); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = text; ctx.fillText(it.l.label + (it.l.unit ? ', ' + it.l.unit : ''), cx + 22 * fs, cy);
      cx += it.w;
    });
  }
  return { drawn: idx, skipped: skipped };
}

function dgcLang(){try{return (window.Diagram&&Diagram.lang&&Diagram.lang())||'en';}catch(e){return 'en';}}
function dgcRt(k){var l=dgcLang();return (DGC_RT[l]&&DGC_RT[l][k])||DGC_RT.en[k]||k;}
var DGC_LOC={en:'en-GB',uk:'uk-UA',de:'de-DE',nl:'nl-BE',fr:'fr-BE',es:'es-ES',pl:'pl-PL'};
function dgcNum(v,d){if(!isFinite(v))return '—';
 try{return Number(v).toLocaleString(DGC_LOC[dgcLang()]||'en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});}
 catch(e){return Number(v).toFixed(d);}}

/* Verification computed live from the current state.
   The reference for elapsed time is a quadrature of dt = dm/mdot(m) over the
   same mass interval. It shares the model's equations but not its time march,
   so it tests the integration independently of the RK4 stepper. */
function dgcMassDomainTime(s,m0,m1){
  // Adaptive Simpson on dt/dm = 1/mdot(m), integrated in the substituted
  // variable v = sqrt(mEq - m), where mEq is the mass at which the tank would
  // reach the supply pressure exactly.
  //
  // mdot vanishes as sqrt(mEq - m) there, so 1/mdot has an integrable
  // inverse-square-root singularity at mEq. The substitution m = mEq - v^2
  // gives dm = -2v dv and turns the integrand into 2v/mdot, which is bounded
  // and smooth. This used to be handled by simply stopping 1e-9 of the mass
  // span short of the end, which silently subtracted the whole last sliver of
  // the fill from the reference — 6.5e-6 s on the shipped default, which was
  // larger than the march error the reference is there to measure once the
  // march stopped taking its step from the window.
  var mEq=(s.pSupply*s.V/s.R-m0*(s.T0-s.gamma*s.TSupply))/(s.gamma*s.TSupply);
  var g=function(v){var m=mEq-v*v;
    var st=tankState(s,m,m0);
    var q=gasOrifice(s.pSupply,s.TSupply,st.p,s.Cd,s.A,s.gamma,s.R).mdot;
    return q>0?2*v/q:0;};
  var f=g;
  var simpson=function(a,b,fa,fm,fb){return (b-a)*(fa+4*fm+fb)/6;};
  var rec=function(a,b,fa,fm,fb,whole,depth){
    var lm=(a+(a+b)/2)/2, rm=((a+b)/2+b)/2, flm=f(lm), frm=f(rm);
    var left=simpson(a,(a+b)/2,fa,flm,fm), right=simpson((a+b)/2,b,fm,frm,fb);
    if(depth<=0||Math.abs(left+right-whole)<=1e-13*Math.abs(left+right)+1e-15)
      return left+right+(left+right-whole)/15;
    return rec(a,(a+b)/2,fa,flm,fm,left,depth-1)+rec((a+b)/2,b,fm,frm,fb,right,depth-1);
  };
  if(!(m1>m0))return 0;
  if(!(mEq>m1))return 0;
  // v runs DOWN from sqrt(mEq-m0) to sqrt(mEq-m1); integrate over the ordered
  // interval and the sign works out as an elapsed time.
  var va=Math.sqrt(mEq-m1), vb=Math.sqrt(mEq-m0);
  var fa=f(va),fb=f(vb),fm=f((va+vb)/2);
  return rec(va,vb,fa,fm,fb,simpson(va,vb,fa,fm,fb),40);
}
/* The shipped solve() fixes its partition at tEnd/900. This repeats the same
   march on n sub-steps so the terminal time can be watched under refinement. */
/* Re-runs the same march at a different step fraction, for the refinement check. */
function dgcSolveSteps(s,frac){return marchTank(s,frac,false);}
/* Returns one row per case: what was measured, what it was measured against,
   the relative difference and the verdict. No case reports a verdict it cannot
   show the numbers for. */
function dgcVerify(s){
  var out=[],base=dgcSolveSteps(s,STEP_FRAC);
  var st=tankState(s,base.m,base.m0);

  // 1. State-equation closure: recompute p from the terminal mass and temperature.
  var pClosed=base.m*s.R*st.T/s.V;
  var relP=st.p!==0?Math.abs(pClosed-st.p)/Math.abs(st.p):0;
  out.push({id:'state-equation-closure',key:'ckClosure',
    graded:true,
    got:pClosed,ref:st.p,rel:relP,tol:1e-12,unit:'Pa',dp:6,
    pass:relP<=1e-12});

  // 2. Equalisation inside the requested window.
  var pStop=s.pSupply*0.99999, reached=st.p>=pStop;
  out.push({id:'pressure-equalisation',key:'ckEq',
    got:st.p,ref:pStop,rel:null,unit:'Pa',dp:0,
    pass:reached,graded:false,status:reached?'pass':'attention',
    word:reached?'rYes':'rNo'});

  // 3. Orifice regime at the terminal state.
  var r=st.p/s.pSupply, rc=Math.pow(2/(s.gamma+1),s.gamma/(s.gamma-1));
  out.push({id:'terminal-orifice-regime',key:'ckChoke',
    got:r,ref:rc,rel:null,unit:'-',dp:4,pass:true,graded:false,status:'info',
    word:r<=rc?'rChoked':'rSub'});

  // 4. Terminal time against the mass-domain quadrature over the same mass
  //    interval the march covered.
  //    The acceptance band is NOT taken from the solver's own partition. It used
  //    to be one step, tEnd/900 — a band proportional to the very quantity that
  //    caused the error, so no step size could ever fail it, which is how a
  //    window-dependent fill time survived this check for so long. The band is
  //    the model's own physical fidelity instead: the ideal-gas closure this
  //    model rests on is about 0.64 % wrong in density at a 20 bar supply
  //    (Z = 0.9936 for air at 293.15 K, Lemmon et al. 2000), so a discretisation
  //    error is only defensible while it stays an order of magnitude inside
  //    that. Hence 1e-3 relative, with a 1e-6 s floor for degenerate windows.
  var tolAbs=null;
  var mRef=base.m, tRef=null, dT=null, okT=true;
  if(mRef>base.m0){
    tRef=dgcMassDomainTime(s,base.m0,mRef);
    dT=Math.abs(base.t-tRef);
    tolAbs=Math.max(1e-3*Math.abs(tRef),1e-6);
    okT=dT<=tolAbs;
  }
  out.push({id:'terminal-time-vs-mass-domain-integral',key:'ckRef',
    graded:true,
    got:base.t,ref:tRef,abs:dT,rel:(tRef&&base.t?dT/base.t:null),
    tol:tolAbs,unit:'s',dp:6,
    pass:okT,status:okT?'pass':'attention'});

  // 5. Step-fraction convergence. The step is a fraction of the remaining-fill
  //    timescale, so refinement means halving that FRACTION — there is no window
  //    partition left to refine. The fill time is a property of the vessel, the
  //    orifice and the two gas states, so tightening a purely numerical knob
  //    must not move it: the band is 1e-6 relative, the same criterion and the
  //    same reasoning as the published window-invariance case, and like it, it
  //    is derived from a property the physics demands exactly rather than from
  //    any step size.
  var r2=dgcSolveSteps(s,STEP_FRAC/2), r4=dgcSolveSteps(s,STEP_FRAC/4);
  var spread=Math.max(Math.abs(base.t-r4.t),Math.abs(r2.t-r4.t));
  var tolC=Math.max(1e-6*Math.abs(r4.t),1e-9);
  var okC=spread<=tolC;
  out.push({id:'step-refinement-convergence',key:'ckConv',
    graded:true,
    got:spread,ref:tolC,abs:spread,rel:(r4.t?spread/r4.t:null),tol:tolC,unit:'s',dp:9,
    pass:okC,status:okC?'pass':'attention',
    extra:{tBase:base.t,tHalf:r2.t,tQuarter:r4.t,reference:tRef,frac:STEP_FRAC}});
  return out;
}

/* The report is a separate document without the tool's stylesheet, so the
   figure is drawn into its own canvas at print resolution rather than scraped
   off the screen. Without this the engine falls back to the on-screen stage,
   which carries no caption and no axis titles. */
function dgcFigureCanvas(w,h,scale){
  var c=document.createElement('canvas');
  c.width=Math.round(w*scale); c.height=Math.round(h*scale);
  var ctx=c.getContext('2d'); ctx.scale(scale,scale);
  return {canvas:c,ctx:ctx};
}
function dgcPlotSpec(){
  if(!last||!last.series||last.series.length<2)return null;
  return {x:{label:dgcLabel('time'),unit:'s'},
    series:[{x:last.series[0].x,y:last.series[0].y,label:dgcLabel('pressure'),unit:'bar',color:'#1f6feb'},
            {x:last.series[1].x,y:last.series[1].y,label:dgcLabel('temperature'),unit:'K',color:'#d1651a'}]};
}
var DGC_AXIS={
 time:{en:'Time',uk:'Час',de:'Zeit',nl:'Tijd',fr:'Temps',es:'Tiempo',pl:'Czas'},
 pressure:{en:'Tank pressure',uk:'Тиск у резервуарі',de:'Behälterdruck',nl:'Tankdruk',fr:'Pression du réservoir',es:'Presión del tanque',pl:'Ciśnienie zbiornika'},
 temperature:{en:'Tank temperature',uk:'Температура в резервуарі',de:'Behältertemperatur',nl:'Tanktemperatuur',fr:'Température du réservoir',es:'Temperatura del tanque',pl:'Temperatura zbiornika'}
};
function dgcLabel(k){var l=dgcLang();return (DGC_AXIS[k]&&(DGC_AXIS[k][l]||DGC_AXIS[k].en))||k;}
function dgcReportFigure(ctx){
  var spec=dgcPlotSpec(); if(!spec)return null;
  var f=dgcFigureCanvas(720,300,2);
  dgcPlot(f.ctx,720,300,spec,{css:{bg:'#ffffff',muted:'#5a6570',line:'#c9d0d8',text:'#17202a',
    font:'-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif'},fontScale:1});
  return ctx.figure(f.canvas,{caption:dgcRt('figCap'),alt:dgcRt('figCap')});
}
function dgcReportProfile(rec,ctx){
  if(!rec||!last)return null;
  var i=rec.inputs||{}, o=rec.outputs||{}, u=rec.units||{};
  var row=function(label,value,unit,note){return {label:label,value:value,unit:unit||'',note:note||''};};
  var txt=function(label,text){return {label:label,text:text};};
  var n=dgcNum;

  var reached=o.p_final>=i.pSupply*0.99999;
  var summary=dgcRt('summary')
    .replace('{V}',n(i.V,3)).replace('{ps}',n(i.pSupply/1e5,2)).replace('{Ts}',n(i.TSupply-273.15,1))
    .replace('{A}',n(i.A*1e6,2)).replace('{Cd}',n(i.Cd,2))
    .replace('{pf}',n(o.p_final/1e5,3)).replace('{Tf}',n(o.T_final-273.15,1))
    .replace('{t}',n(o.elapsed,2)).replace('{m}',n(o.m_admitted,3));

  /* Values are shown in the units an engineer reads them in. The record keeps SI. */
  var tiles=[
    row(dgcLabel('pressure'),n(o.p_final/1e5,3),'bar'),
    row(dgcLabel('temperature'),n(o.T_final-273.15,1),'°C',n(o.T_final,2)+' K'),
    row(ctx.label('rho_final',u.rho_final||'kg/m3'),n(o.rho_final,3),'kg/m³'),
    row(dgcRt('rAdm'),n(o.m_admitted,3),'kg'),
    row(ctx.label('mdot_peak',u.mdot_peak||'kg/s'),n(o.mdot_peak,4),'kg/s'),
    row(ctx.label('elapsed',u.elapsed||'s'),n(o.elapsed,2),'s')
  ];
  /* How long the orifice stays choked, read off the computed history: the
     inlet flow is fixed by the supply state alone until p/p_supply rises past
     the critical ratio, so this is the part of the fill that does not care
     about tank pressure. */
  var rc0=Math.pow(2/(i.gamma+1),i.gamma/(i.gamma-1)), tChoke=null;
  if(last.series&&last.series[0]){
    var xs=last.series[0].x, ys=last.series[0].y;
    for(var k=0;k<ys.length;k++){
      if(ys[k]*1e5/i.pSupply>rc0){tChoke=xs[k];break;}
    }
    if(tChoke===null)tChoke=o.elapsed;
  }
  var m0=i.p0*i.V/(i.R*i.T0);
  var results=tiles.concat([
    row(ctx.label('p0',u.p0),n(i.p0/1e5,3),'bar'),
    row(ctx.label('T0',u.T0),n(i.T0-273.15,2),'°C'),
    row(dgcRt('rRise'),n(o.T_final-i.T0,1),'K'),
    row(dgcRt('rMass0'),n(m0,3),'kg',dgcRt('rMassEnd')+': '+n(m0+o.m_admitted,3)+' kg'),
    row(dgcRt('rMean'),o.elapsed>0?n(o.m_admitted/o.elapsed,4):'—','kg/s'),
    row(dgcRt('rChokeT'),tChoke===null?'—':n(tChoke,2),'s',
        o.elapsed>0&&tChoke!==null?n(100*tChoke/o.elapsed,1)+' % '+dgcRt('rOfFill'):'')
  ]);

  var v=dgcVerify(state);
  var checks=v.map(function(c){
    var st=c.status||(c.pass?'pass':'attention');
    var actual,criterion;
    if(c.key==='ckClosure'){actual='|Δp| / p = '+Number(c.rel).toExponential(2);criterion='≤ 1·10⁻¹²';}
    else if(c.key==='ckEq'){actual=n(c.got/1e5,3)+' bar ('+dgcRt(c.word)+')';criterion='p ≥ 0,99999 · p_supply = '+n(c.ref/1e5,3)+' bar';}
    else if(c.key==='ckChoke'){actual='p/p_supply = '+n(c.got,4)+' ('+dgcRt(c.word)+')';criterion='r_crit = '+n(c.ref,4);}
    else if(c.key==='ckRef'){actual='|Δt| = '+n(c.abs,4)+' s';criterion='≤ 0,1 % (ideal-gas closure limit) = '+n(c.tol,4)+' s';}
    else {actual='|Δt| = '+n(c.got,6)+' s';criterion='≤ '+n(c.ref,6)+' s';}
    var note='';
    if(c.key==='ckRef'&&c.ref!=null)note='t = '+n(c.got,6)+' s; reference '+n(c.ref,6)+' s';
    if(c.key==='ckConv'&&c.extra)note='step '+c.extra.frac+'τ: '+n(c.extra.tBase,6)+' s · '+(c.extra.frac/2)+'τ: '+n(c.extra.tHalf,6)+' s · '+(c.extra.frac/4)+'τ: '+n(c.extra.tQuarter,6)+' s · reference '+n(c.extra.reference,6)+' s';
    return {status:st,title:dgcRt(c.key),actual:actual,criterion:criterion,
            basis:dgcRt(c.key+'B'),detail:note};
  });
  (rec.warnings||[]).forEach(function(w){checks.push({status:'attention',title:dgcRt('ckEq'),detail:w});});

  var decisions=[
    row(dgcRt('flowSupply'),n(i.pSupply/1e5,2)+' bar / '+n(i.TSupply-273.15,1)+' °C','',dgcRt('rSupplyWhy')),
    row('A · Cd',n(i.A*1e6,2)+' mm² · '+n(i.Cd,2),'',dgcRt('flowOrifice')),
    row('γ · R',n(i.gamma,3)+' · '+n(i.R,2)+' J/(kg·K)','',dgcRt('rGasWhy'))
  ];

  var groupTank='1 · '+dgcRt('flowTank'), groupSup='2 · '+dgcRt('flowSupply');
  var inputs=[
    {label:ctx.label('V',u.V),value:n(i.V,3),unit:'m³',group:groupTank},
    {label:ctx.label('p0',u.p0),value:n(i.p0/1e5,3),unit:'bar',group:groupTank},
    {label:ctx.label('T0',u.T0),value:n(i.T0-273.15,2),unit:'°C',group:groupTank},
    {label:ctx.label('pSupply',u.pSupply),value:n(i.pSupply/1e5,3),unit:'bar',group:groupSup},
    {label:dgcRt('rTsup'),value:n(i.TSupply-273.15,2),unit:'°C',group:groupSup},
    {label:ctx.label('A',u.A),value:n(i.A*1e6,3),unit:'mm²',group:groupSup},
    {label:ctx.label('Cd',u.Cd),value:n(i.Cd,3),unit:'-',group:groupSup},
    {label:ctx.label('gamma',u.gamma),value:n(i.gamma,3),unit:'-',group:groupSup},
    {label:ctx.label('R',u.R),value:n(i.R,2),unit:'J/(kg·K)',group:groupSup},
    {label:ctx.label('tEnd',u.tEnd),value:n(i.tEnd,2),unit:'s',group:groupSup}
  ];

  return {
    title:dgcRt('title'),
    executive:{text:[summary],results:tiles,
      conclusion:reached?dgcRt('concEq'):dgcRt('concCut')},
    system:{text:dgcRt('system'),
      flow:[{label:dgcRt('flowSupply'),detail:n(i.pSupply/1e5,2)+' bar / '+n(i.TSupply-273.15,1)+' °C'},
            {label:dgcRt('flowOrifice'),detail:n(i.A*1e6,2)+' mm² · Cd '+n(i.Cd,2)},
            {label:dgcRt('flowTank'),detail:n(i.V,3)+' m³'}]},
    results:results,
    decisions:decisions,
    checks:checks,
    figures:[dgcReportFigure(ctx)].filter(Boolean),
    risks:[{status:'attention',title:dgcRt('riskRealT'),detail:dgcRt('riskReal')},
           {status:'attention',title:dgcRt('riskWallT'),detail:dgcRt('riskWall')}],
    method:{
      equations:['dm/dt = ṁ_in','d(m c_v T)/dt = ṁ_in c_p T_supply','p = m R T / V',
        'ṁ = C_d A p_u √(γ/(R T_u)) (2/(γ+1))^((γ+1)/(2(γ−1)))   for p/p_u ≤ (2/(γ+1))^(γ/(γ−1))',
        'ṁ = C_d A p_u √(2γ/(R T_u (γ−1)) · [r^(2/γ) − r^((γ+1)/γ)])   otherwise, r = p/p_u'],
      ranges:['ideal gas','rigid adiabatic well-mixed tank','fixed large-source supply state'],
      notes:[dgcRt('mNote')]
    },
    inputs:inputs
  };
}

/* Rebuilds the IN-PAGE SELF-CHECK subset of the published record. These checks
   re-evaluate the tool's own relations inside the tool, so they test
   implementation faithfulness and nothing more; site rule S5 excludes them from
   counting as independent reference checks, and they are carried in
   benchmarks/tank_pressurisation.json labelled basis:"self-check". The published artifact as a whole is NOT produced
   here — it comes from the independent Python second implementation in
   out/gen_tank_pressurisation.py, which derives the physics from first principles,
   drives this page over Playwright and grades it. */
function dgcBenchmark(scenarios){
  var list=scenarios||DGC_BENCH_CASES, cases=[], total=0, passed=0;
  list.forEach(function(sc){
    var v=dgcVerify(sc.s);
    var cmp=v.map(function(c){
      if(c.graded){total++; if(c.pass)passed++;}
      return {check:c.id,
        got:(c.got===undefined?null:c.got),
        ref:(c.ref===undefined?null:c.ref),
        abs:(c.abs===undefined?null:c.abs),
        rel:(c.rel===undefined?null:c.rel),
        tol:(c.tol===undefined?null:c.tol),
        unit:c.unit,extra:c.extra||null,
        graded:!!c.graded,
        status:c.status||(c.pass?'pass':'fail'),ok:c.graded?!!c.pass:null};
    });
    cases.push({id:sc.id,note:sc.note,inputs:sc.s,cmp:cmp,
      pass:cmp.every(function(x){return !x.graded||x.ok;})});
  });
  var rev='';
  try{rev=JSON.parse(document.getElementById('diagram-tool-manifest').textContent).manifest_revision;}catch(e){}
  var d0=cases[0].cmp.filter(function(x){return x.check==='terminal-time-vs-mass-domain-integral';})[0];
  var r0=cases[0].cmp.filter(function(x){return x.check==='step-refinement-convergence';})[0];
  var ex=function(x,n){return x==null?'—':Number(x).toExponential(n);};
  return {
    schema:'tools.petrov.re/benchmark/v1',
    tool:'tank-pressurisation',file:'tank_pressurisation.html',manifest_revision:rev,
    subset:'in-page self-checks only',
    reference:'SELF-CHECK SUBSET. Quadrature of the mass-domain relation dt = dm/mdot(m) over the same mass interval as the time march, plus the state-equation closure p = m R T / V and the orifice choking criterion, all re-evaluated inside the page from the tool\'s own relations. This establishes implementation faithfulness only; the independent reference for this tool is the Python second implementation described in benchmarks/tank_pressurisation.json.',
    reference_citations:['Closure and orifice relations as implemented in tank_pressurisation.html. Shares those relations with the tool, so it is a self-check and not an independent reference.'],
    reference_provenance:'recomputed in page (self-check)',
    tolerance:'State-equation closure to floating-point precision (1e-12 relative). Terminal time must agree with the mass-domain reference to 1e-3 relative — a band fixed by the model\'s own physical fidelity (the ideal-gas closure is about 0.64 % wrong in density at a 20 bar supply), NOT by the solver\'s own step, which is what the superseded tEnd/900 band did and why it could never fail. Halving and quartering the step fraction must move the terminal time by less than 1e-6 relative. Observed on the shipped default: gap '+ex(d0&&d0.abs,3)+' s against a band of '+ex(d0&&d0.tol,3)+' s, with a step-fraction spread of '+ex(r0&&r0.got,3)+' s.',
    run_at:new Date().toISOString().replace(/\.\d+Z$/,'Z'),
    total:total,passed:passed,failed:total-passed,flagged:0,page_errors:[],
    grading:'total counts checks with an acceptance criterion. Pressure equalisation and orifice regime report the state of the solved case and carry no criterion, so they are recorded with their status and excluded from the count.',
    cases:cases,
    not_benchmarked:[
      'Real-gas properties; the state relation is ideal-gas throughout.',
      'Vessel-wall heat capacity and wall heat transfer.',
      'Supply-line inventory, regulator dynamics and mixing stratification.',
      'Browser/Python parity, which needs a Python runtime and is not re-run in the page.'],
    notes:[
      'Each case runs the shipped solver and the self-check reference inside the page. Inputs, measured value, reference value and tolerance are recorded per check, so any verdict can be reproduced by calling window.__dgcBenchmark() on the tool.',
      'The march step is a fixed fraction of the remaining-fill timescale (m_stop - m)/mdot, not a partition of the simulated window, so the computed fill time does not depend on tEnd. The terminal event is located by bisection on a mass rate that vanishes at equalisation.',
      'The mass-domain reference integrates in v = sqrt(m_eq - m), which makes the integrand bounded at the equalised end; it no longer truncates the last 1e-9 of the mass span.']
  };
}

function buildLearn(){return {version:1,autostart:false,intro:{title:T("Learn this model","Як користуватися моделлю","Modell verstehen","Model leren","Comprendre le modèle","Aprender el modelo","Poznaj model"),body:T("Start with an Example, then change one input at a time. Watch which result moves, which regime is active, and whether the model limitation still fits your case.","Почніть із прикладу, потім змінюйте по одному параметру. Стежте, який результат змінюється, який режим активний і чи відповідають обмеження моделі вашому випадку.","Beginnen Sie mit einem Beispiel und ändern Sie dann jeweils nur eine Eingabe. Beobachten Sie Ergebnis, aktives Regime und Modellgrenze.","Begin met een voorbeeld en wijzig daarna één invoer tegelijk. Bekijk welk resultaat verandert, welk regime actief is en of de modelgrens nog past.","Commencez par un exemple puis modifiez une entrée à la fois. Observez le résultat, le régime actif et la limite du modèle.","Empiece con un ejemplo y cambie una entrada cada vez. Observe qué resultado cambia, qué régimen está activo y si el límite del modelo sigue siendo válido.","Zacznij od przykładu, potem zmieniaj po jednym parametrze. Obserwuj wynik, aktywny reżim i to, czy granice modelu nadal pasują do przypadku.")},topics:{'t1':{title:T("Initial state / inputs","Початковий стан / вхідні дані","Anfangszustand / Eingaben","Begintoestand / invoer","État initial / entrées","Estado inicial / entradas","Stan początkowy / dane"),body:T("These values establish the inventory and starting thermodynamic or hydraulic state.","Ці значення задають запас і початковий термодинамічний або гідравлічний стан.","Diese Werte legen Inventar und thermodynamischen bzw. hydraulischen Anfangszustand fest.","Deze waarden bepalen inventaris en thermodynamische of hydraulische begintoestand.","Ces valeurs fixent l’inventaire et l’état thermodynamique ou hydraulique initial.","Estos valores fijan el inventario y el estado termodinámico o hidráulico inicial.","Te wartości ans flash, remplissage/vidange ou stockage/déstockage. Elles changent la branche de calcul.","Vigile cambios como choked/subcrítico, flashing/sin flashing, llenado/vaciado o packing/depacking. Cambian la rama gobernante del cálculo.","Obserwuj przejścia krytyczny/podkrytyczny, flashing/brak flashingu, napełnianie/opróżnianie lub packing/depacking. Zmieniają one gałąź równań.")},'t4':{title:T("Model boundary","Межа моделі","Modellgrenze","Modelgrens","Limite du modèle","Límite del modelo","Granica modelu"),body:T("Use the stated limitation as part of the result. A numerically converged answer outside the model assumptions is not a validated design answer.","Сприймайте зазначене обмеження як частину результату. Чисельно збіжна відповідь поза припущеннями моделі не є валідованою проєктною відповіддю.","Die angegebene Einschränkung gehört zum Ergebnis. Eine numerisch konvergierte Lösung außerhalb der Modellannahmen ist keine validierte Auslegungsantwort.","De vermelde beperking hoort bij het resultaat. Een numeriek geconvergeerd antwoord buiten de modelaannames is geen gevalideerd ontwerpantwoord.","La limitation déclarée fait partie du résultat. Une solution convergée hors des hypothèses du modèle n’est pas une réponse de conception validée.","La limitación declarada forma parte del resultado. Una solución convergida fuera de las hipótesis no es una respuesta de diseño validada.","Podane ograniczenie jest częścią wyniku. Numerycznie zbieżna odpowiedź poza założeniami modelu nie jest zwalidowaną odpowiedzią projektową.")}},tour:[{topic:'t1',focus:'[data-dgu-panel=\"dgu-examples\"]'},{topic:'t2',focus:'[data-dgu-panel=\"tank\"]'},{topic:'t3',focus:'[data-dgu-panel=\"supply\"]'},{topic:'t4',focus:'[data-dgu-panel=\"gas\"]'}]};}

function gasOrifice(pu,Tu,pd,Cd,A,gamma,R){
 if(!(pu>pd&&Tu>0&&A>0&&Cd>0))return {mdot:0,choked:false,G:0,r:pd/Math.max(pu,1)};
 var r=Math.max(0,Math.min(1,pd/pu));
 var rc=Math.pow(2/(gamma+1),gamma/(gamma-1));
 var G;
 if(r<=rc){G=pu*Math.sqrt(gamma/(R*Tu))*Math.pow(2/(gamma+1),(gamma+1)/(2*(gamma-1)));return {mdot:Cd*A*G,choked:true,G:G,r:r};}
 var z=Math.max(0,Math.pow(r,2/gamma)-Math.pow(r,(gamma+1)/gamma));
 G=pu*Math.sqrt(2*gamma/(R*Tu*(gamma-1))*z);return {mdot:Cd*A*G,choked:false,G:G,r:r};
}

function tankState(s,m,m0){var T=(m0*s.T0+s.gamma*(m-m0)*s.TSupply)/m;return {T:T,p:m*s.R*T/s.V};}
function tankRate(s,m,m0){var st=tankState(s,m,m0);return gasOrifice(s.pSupply,s.TSupply,st.p,s.Cd,s.A,s.gamma,s.R).mdot;}
function rk4Mass(s,m,m0,dt){var k1=tankRate(s,m,m0),k2=tankRate(s,m+.5*dt*k1,m0),k3=tankRate(s,m+.5*dt*k2,m0),k4=tankRate(s,m+dt*k3,m0);return m+dt*(k1+2*k2+2*k3+k4)/6;}
/* ---- time march ---------------------------------------------------------
   The step is taken from the TRANSIENT, not from the display window.

     tau = (m_stop - m) / mdot(m)

   is how long the rest of the fill would still take at the current inlet flow,
   so resolving a fixed fraction STEP_FRAC of tau makes the accuracy of the
   march a property of the vessel and the orifice alone. It used to be
   tEnd/900, which tied the resolution to how long the user chose to watch: a
   generous window coarsened the step until the whole subsonic approach to
   equalisation fell inside one step, and because the mass rate is
   convex-decreasing there the stage average overestimated it and the reported
   fill time came out short — by up to 7 % at the widest windows, silently and
   always in the non-conservative direction.

   tau -> 0 at equalisation (mdot vanishes as sqrt(m_stop - m)), so STEP_FLOOR
   keeps the step from collapsing to zero; the terminal event is then crossed
   and located exactly by bisection.

   tEnd enters the step only through a min(), which can REFINE the step so a
   short window still draws a smooth curve, but can never coarsen it. The
   computed answer is therefore no longer a function of tEnd: across windows
   from 1.02x to 185000x the fill, the reported fill time now moves by about
   1e-8 relative, against 4.7e-2 before. */
var STEP_FRAC=0.025, STEP_FLOOR=1e-9, PLOT_POINTS=900, STEP_GUARD=40000;

function marchTank(s,frac,collect){
  var m0=s.p0*s.V/(s.R*s.T0),m=m0,t=0,n=0,peak=0,lastq=0;
  var pStop=s.pSupply*0.99999;
  var mStop=(pStop*s.V/s.R-m0*(s.T0-s.gamma*s.TSupply))/(s.gamma*s.TSupply);
  var q0=tankRate(s,m0,m0);
  var tauFill=(q0>0&&mStop>m0)?(mStop-m0)/q0:Math.max(s.tEnd,1e-5);
  var x=[],pp=[],TT=[];
  while(t<s.tEnd&&n<STEP_GUARD){
    var st=tankState(s,m,m0);
    var q=gasOrifice(s.pSupply,s.TSupply,st.p,s.Cd,s.A,s.gamma,s.R);
    lastq=q.mdot; if(lastq>peak)peak=lastq;
    if(collect){x.push(t);pp.push(st.p/1e5);TT.push(st.T);}
    if(st.p>=pStop||lastq<=0)break;
    var dt=(lastq>0&&mStop>m)?frac*(mStop-m)/lastq:tauFill;
    if(!(dt>0)||!isFinite(dt))dt=tauFill;
    dt=Math.max(dt,STEP_FLOOR*tauFill);   /* never collapses to zero */
    dt=Math.min(dt,s.tEnd/PLOT_POINTS);   /* plot resolution: refines only */
    dt=Math.min(dt,s.tEnd-t);
    if(!(dt>0))break;
    var mn=rk4Mass(s,m,m0,dt);
    if(!(mn>m))break;
    if(mn>=mStop){
      var lo=0,hi=dt;
      for(var j=0;j<60;j++){var mid=(lo+hi)/2;if(rk4Mass(s,m,m0,mid)>=mStop)hi=mid;else lo=mid;}
      m=mStop;t+=hi;n++;break;
    }
    m=mn;t+=dt;n++;
  }
  var stf=tankState(s,m,m0);
  var qf=gasOrifice(s.pSupply,s.TSupply,stf.p,s.Cd,s.A,s.gamma,s.R);
  lastq=qf.mdot; if(lastq>peak)peak=lastq;
  if(collect){x.push(t);pp.push(stf.p/1e5);TT.push(stf.T);}
  return {m:m,m0:m0,t:t,p:stf.p,T:stf.T,mdot:lastq,peak:peak,steps:n,x:x,pp:pp,TT:TT};
}

function solve(s){
  var r=marchTank(s,STEP_FRAC,true);
  return {p:r.p,T:r.T,rho:r.m/s.V,mdot:r.mdot,peak:r.peak,admitted:r.m-r.m0,time:r.t,steps:r.steps,
    series:[{x:r.x,y:r.pp},{x:r.x,y:r.TT}],a11y:'Tank pressurisation history.',
    warnings:(s.pSupply<=s.p0?['Supply pressure is not above initial tank pressure.']:[]),
    notes:[r.t>=s.tEnd?'Simulation reached the user time limit before pressure equalisation.':'Tank pressure approached supply pressure.']};
}

 python:function(){return {code:"\ndef gas_orifice(pu, Tu, pd, Cd, A, gamma, R):\n    if not (pu > pd and Tu > 0 and A > 0 and Cd > 0):\n        return 0.0, False, 0.0\n    r=max(0.0,min(1.0,pd/pu)); rc=(2/(gamma+1))**(gamma/(gamma-1))\n    if r <= rc:\n        G=pu*math.sqrt(gamma/(R*Tu))*(2/(gamma+1))**((gamma+1)/(2*(gamma-1)))\n        return Cd*A*G, True, G\n    z=max(0.0,r**(2/gamma)-r**((gamma+1)/gamma))\n    G=pu*math.sqrt(2*gamma/(R*Tu*(gamma-1))*z)\n    return Cd*A*G, False, G\n\n# The march step comes from the transient, not from the display window tEnd:\n# tau = (m_stop - m)/mdot is the time the rest of the fill would still take at\n# the current inlet flow, and the step resolves a fixed fraction of it. tEnd\n# enters only through a min() that can refine the step for plotting but never\n# coarsen it, so the computed answer does not depend on the window length.\nSTEP_FRAC = 0.025\nSTEP_FLOOR = 1e-9\nPLOT_POINTS = 900\nSTEP_GUARD = 40000\n\ndef compute():\n    V=INPUTS['V']; p0=INPUTS['p0']; T0=INPUTS['T0']; ps=INPUTS['pSupply']; Ts=INPUTS['TSupply']; A=INPUTS['A']; Cd=INPUTS['Cd']; gamma=INPUTS['gamma']; R=INPUTS['R']; tEnd=INPUTS['tEnd']\n    m0=p0*V/(R*T0); m=m0; t=0.0; peak=0.0; q=0.0; n=0\n    p_stop=ps*.99999\n    m_stop=(p_stop*V/R-m0*(T0-gamma*Ts))/(gamma*Ts)\n    def tank_state(mass):\n        temp=(m0*T0+gamma*(mass-m0)*Ts)/mass\n        return temp, mass*R*temp/V\n    def mass_rate(mass):\n        _,p=tank_state(mass)\n        return gas_orifice(ps,Ts,p,Cd,A,gamma,R)[0]\n    def rk4_mass(mass,dt):\n        k1=mass_rate(mass); k2=mass_rate(mass+0.5*dt*k1); k3=mass_rate(mass+0.5*dt*k2); k4=mass_rate(mass+dt*k3)\n        return mass+dt*(k1+2*k2+2*k3+k4)/6.0\n    q0=mass_rate(m0)\n    tau_fill=(m_stop-m0)/q0 if (q0>0 and m_stop>m0) else max(tEnd,1e-5)\n    while t<tEnd and n<STEP_GUARD:\n        T,p=tank_state(m); q,_,_=gas_orifice(ps,Ts,p,Cd,A,gamma,R); peak=max(peak,q)\n        if p>=p_stop or q<=0: break\n        dt=STEP_FRAC*(m_stop-m)/q if (q>0 and m_stop>m) else tau_fill\n        if not (dt>0) or dt!=dt or dt==float('inf'): dt=tau_fill\n        dt=max(dt,STEP_FLOOR*tau_fill)\n        dt=min(dt,tEnd/PLOT_POINTS)\n        dt=min(dt,tEnd-t)\n        if not (dt>0): break\n        m_next=rk4_mass(m,dt)\n        if not (m_next>m): break\n        if m_next>=m_stop:\n            lo=0.0; hi=dt\n            for _ in range(60):\n                mid=0.5*(lo+hi)\n                if rk4_mass(m,mid)>=m_stop: hi=mid\n                else: lo=mid\n            m=m_stop; t+=hi; n+=1; break\n        m=m_next; t+=dt; n+=1\n    T,p=tank_state(m); q,_,_=gas_orifice(ps,Ts,p,Cd,A,gamma,R); peak=max(peak,q)\n    return {'p_final':p,'T_final':T,'rho_final':m/V,'m_admitted':m-m0,'mdot_final':q,'mdot_peak':peak,'elapsed':t}\n",requires:[],basis:{kind:'reproduce',note:'Standard-library port of the same equations used by the browser tool.'},selftest:{tolerance:1e-12,note:'Browser and exported Python evaluate the same equations, the same transient-sized step rule, RK4 stage order and terminal-event bisection; tolerance only covers floating-point implementation differences.'}};},
