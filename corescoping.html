{"schema": "tools.petrov.re/tool-manifest/v2", "manifest_revision": "2026-09-26.1", "id": "corescoping", "file": "corescoping.html", "listed": true, "category": "nuclear-eng", "order": 10, "title": {"en": "Reactor Core Scoping Studio", "uk": "Студія оцінки активної зони", "de": "Reaktorkern-Auslegungsstudio", "nl": "Reactorkern-verkenningsstudio", "fr": "Studio de dimensionnement de cœur", "es": "Estudio de dimensionado de núcleo", "pl": "Studio doboru rdzenia reaktora"}, "summary": {"en": "Size a bare cylindrical core of thirteen reactor lines, read its k-effective, cycle length, discharge burnup, feedback coefficients and fuel cost from lattice data computed with OpenMC and ENDF/B-VIII.0.", "uk": "Задайте розміри голої циліндричної зони для тринадцяти типів реакторів і отримайте k-ефективний, тривалість кампанії, вигоряння, коефіцієнти зворотного зв'язку та вартість палива за даними решіток, порахованими в OpenMC з ENDF/B-VIII.0.", "de": "Einen nackten Zylinderkern aus dreizehn Reaktorlinien auslegen und k-effektiv, Zykluslänge, Entladeabbrand, Rückkopplungskoeffizienten und Brennstoffkosten aus Gitterdaten lesen, die mit OpenMC und ENDF/B-VIII.0 gerechnet wurden.", "nl": "Bepaal de maat van een kale cilindrische kern voor dertien reactorlijnen en lees k-effectief, cycluslengte, ontlaadopbrand, terugkoppelcoëfficiënten en brandstofkosten af uit roostergegevens berekend met OpenMC en ENDF/B-VIII.0.", "fr": "Dimensionner un cœur cylindrique nu pour treize filières et lire k-effectif, longueur de cycle, épuisement de décharge, coefficients de contre-réaction et coût du combustible à partir de données de réseau calculées avec OpenMC et ENDF/B-VIII.0.", "es": "Dimensione un núcleo cilíndrico desnudo de trece líneas de reactor y lea k-efectivo, duración del ciclo, quemado de descarga, coeficientes de realimentación y coste del combustible a partir de datos de red calculados con OpenMC y ENDF/B-VIII.0.", "pl": "Dobierz wymiary nagiego rdzenia cylindrycznego dla trzynastu linii reaktorów i odczytaj k-efektywne, długość cyklu, wypalenie, współczynniki sprzężeń oraz koszt paliwa z danych siatkowych obliczonych w OpenMC z ENDF/B-VIII.0."}, "description": {"en": "The tool carries a lattice library computed for this site with OpenMC 0.15.3 and ENDF/B-VIII.0: for each of thirteen reactor lines — PWR, VVER-1000, BWR, CANDU, RBMK, Magnox, AGR, prismatic HTGR with TRISO fuel, sodium fast reactor on metal and on MOX fuel, lead fast reactor and two molten-salt lines — the cell of that line was depleted at its own specific power, and branch cases were run for fuel temperature, coolant density or void fraction, moderator temperature and soluble boron. Each case also carries two-group constants, so leakage is the two-group eigenvalue for the buckling of the cylinder rather than a single migration area. On that library the page solves the core you draw: criticality, the reactivity history through an n-batch cycle, the discharge burnup, the power defect between zero power and full power, the Doppler, coolant, void, moderator and boron coefficients with their sign, the plutonium and uranium-233 built up along the way, and the fuel-cycle cost in euros.", "uk": "Інструмент містить бібліотеку решіток, пораховану для цього сайту в OpenMC 0.15.3 з ENDF/B-VIII.0: для кожного з тринадцяти типів реакторів — PWR, ВВЕР-1000, BWR, CANDU, РБМК, Magnox, AGR, призматичний ВТГР з паливом TRISO, натрієвий швидкий реактор на металевому та на МОКС-паливі, свинцевий швидкий реактор і дві лінії рідкосольових — комірку цього типу випалено за його власної питомої потужності, а також пораховано ветви за температурою палива, густиною чи паровмістом теплоносія, температурою сповільнювача та розчинним бором. Кожен випадок несе двогрупові константи, тож витік — це двогруповий власний розв'язок для геометричного параметра циліндра, а не одна довжина міграції. На цій бібліотеці сторінка розв'язує задану зону: критичність, хід реактивності впродовж n-партійної кампанії, вигоряння при вивантаженні, потужнісний ефект від нуля до повної потужності, коефіцієнти Доплера, теплоносія, паровмісту, сповільнювача та бору зі знаком, накопичення плутонію й урану-233 і вартість паливного циклу в євро.", "de": "Das Werkzeug trägt eine für diese Seite mit OpenMC 0.15.3 und ENDF/B-VIII.0 gerechnete Gitterbibliothek: Für jede von dreizehn Reaktorlinien — DWR, WWER-1000, SWR, CANDU, RBMK, Magnox, AGR, prismatischer HTR mit TRISO-Brennstoff, natriumgekühlter schneller Reaktor mit Metall- und mit MOX-Brennstoff, bleigekühlter schneller Reaktor und zwei Flüssigsalzlinien — wurde die Zelle dieser Linie bei ihrer eigenen spezifischen Leistung abgebrannt, dazu Zweigfälle für Brennstofftemperatur, Kühlmitteldichte oder Dampfanteil, Moderatortemperatur und Borsäure. Jeder Fall trägt Zweigruppenkonstanten, sodass die Leckage der Zweigruppen-Eigenwert für die Flusswölbung des Zylinders ist und nicht eine einzelne Migrationsfläche. Auf dieser Bibliothek löst die Seite den gezeichneten Kern: Kritikalität, Reaktivitätsverlauf über einen n-Chargen-Zyklus, Entladeabbrand, Leistungsdefekt von null bis Volllast, Doppler-, Kühlmittel-, Dampfblasen-, Moderator- und Borkoeffizienten mit Vorzeichen, aufgebautes Plutonium und Uran-233 sowie die Brennstoffkreislaufkosten in Euro.", "nl": "Het gereedschap draagt een roosterbibliotheek die voor deze site is berekend met OpenMC 0.15.3 en ENDF/B-VIII.0: voor elk van dertien reactorlijnen — PWR, VVER-1000, BWR, CANDU, RBMK, Magnox, AGR, prismatische HTGR met TRISO-brandstof, natriumgekoelde snelle reactor op metaal- en op MOX-brandstof, loodgekoelde snelle reactor en twee gesmoltenzoutlijnen — is de cel van die lijn opgebrand bij het eigen specifieke vermogen, met takberekeningen voor brandstoftemperatuur, koelmiddeldichtheid of stoomfractie, moderatortemperatuur en opgelost boor. Elk geval draagt tweegroepsconstanten, zodat het lek de tweegroeps-eigenwaarde voor de buiging van de cilinder is en niet één migratieoppervlak. Op die bibliotheek lost de pagina de getekende kern op: kritikaliteit, het reactiviteitsverloop over een n-batchcyclus, de ontlaadopbrand, het vermogensdefect van nul tot vol vermogen, de Doppler-, koelmiddel-, stoom-, moderator- en boorcoëfficiënten met hun teken, het opgebouwde plutonium en uranium-233, en de splijtstofcycluskosten in euro.", "fr": "L’outil embarque une bibliothèque de réseaux calculée pour ce site avec OpenMC 0.15.3 et ENDF/B-VIII.0 : pour chacune des treize filières — REP, VVER-1000, REB, CANDU, RBMK, Magnox, AGR, HTR prismatique à combustible TRISO, réacteur rapide au sodium à combustible métallique et MOX, réacteur rapide au plomb et deux filières à sels fondus — la cellule de la filière a été irradiée à sa propre puissance spécifique, avec des cas de branche pour la température du combustible, la densité ou le taux de vide du caloporteur, la température du modérateur et le bore soluble. Chaque cas porte des constantes à deux groupes, de sorte que la fuite est la valeur propre à deux groupes pour le laplacien du cylindre et non une seule aire de migration. Sur cette bibliothèque, la page résout le cœur dessiné : criticité, historique de réactivité sur un cycle à n lots, épuisement de décharge, défaut de puissance de zéro à pleine puissance, coefficients Doppler, caloporteur, vide, modérateur et bore avec leur signe, plutonium et uranium-233 accumulés, et coût du cycle du combustible en euros.", "es": "La herramienta incorpora una biblioteca de redes calculada para este sitio con OpenMC 0.15.3 y ENDF/B-VIII.0: para cada una de las trece líneas — PWR, VVER-1000, BWR, CANDU, RBMK, Magnox, AGR, HTGR prismático con combustible TRISO, reactor rápido de sodio con combustible metálico y con MOX, reactor rápido de plomo y dos líneas de sales fundidas — se quemó la celda de esa línea a su propia potencia específica, con casos de rama para temperatura del combustible, densidad o fracción de vacío del refrigerante, temperatura del moderador y boro soluble. Cada caso lleva constantes de dos grupos, de modo que la fuga es el autovalor de dos grupos para el laplaciano del cilindro y no una única área de migración. Sobre esa biblioteca la página resuelve el núcleo dibujado: criticidad, historia de reactividad a lo largo de un ciclo de n lotes, quemado de descarga, defecto de potencia entre potencia cero y plena potencia, coeficientes Doppler, de refrigerante, de vacío, de moderador y de boro con su signo, plutonio y uranio-233 acumulados, y coste del ciclo del combustible en euros.", "pl": "Narzędzie zawiera bibliotekę siatek obliczoną dla tej witryny w OpenMC 0.15.3 z ENDF/B-VIII.0: dla każdej z trzynastu linii reaktorów — PWR, WWER-1000, BWR, CANDU, RBMK, Magnox, AGR, pryzmatyczny HTGR z paliwem TRISO, prędki reaktor sodowy na paliwie metalicznym i MOX, prędki reaktor ołowiowy oraz dwie linie na stopionych solach — komórkę danej linii wypalono przy jej własnej mocy właściwej, wraz z przypadkami gałęziowymi dla temperatury paliwa, gęstości lub udziału pary w chłodziwie, temperatury moderatora i boru rozpuszczonego. Każdy przypadek niesie stałe dwugrupowe, więc ucieczka jest dwugrupową wartością własną dla laplasjanu walca, a nie pojedynczym polem migracji. Na tej bibliotece strona rozwiązuje narysowany rdzeń: krytyczność, przebieg reaktywności w cyklu n-partyjnym, wypalenie przy wyładunku, defekt mocy od zera do pełnej mocy, współczynniki Dopplera, chłodziwa, pary, moderatora i boru wraz ze znakiem, narosły pluton i uran-233 oraz koszt cyklu paliwowego w euro."}, "status": "prototype", "independent_validation": false, "validation": {"basis": {"en": "The lattice library is the author's own OpenMC 0.15.3 / ENDF/B-VIII.0 calculation, reviewed by no third party and set against no integral benchmark. The published artifact grades only the model layer this page adds on top of that library — the two-group leakage eigenvalue, the batch discharge solver, the branch interpolation, the water table and the fuel-cycle cost — so the tool stays at prototype and the evidence stays readable. The double heterogeneity of the TRISO fuel is carried by a reactivity-equivalent physical transformation calibrated against the explicit particle lattice: the homogenised model reads 350 pcm low at 8 % and 590 pcm low at 15.5 % enrichment.", "uk": "Бібліотека решіток — власний розрахунок автора в OpenMC 0.15.3 з ENDF/B-VIII.0: сторонньої перевірки не було, з інтегральним еталоном її не звіряли. Опублікований артефакт оцінює лише модельний шар, який ця сторінка надбудовує над бібліотекою, — двогруповий власний розв'язок витоку, розв'язувач вигоряння за партіями, інтерполяцію гілок, таблицю води та вартість паливного циклу, — тож інструмент лишається прототипом, а свідчення лишаються доступними. Подвійну гетерогенність палива TRISO передано еквівалентним за реактивністю перетворенням, відкаліброваним за явною решіткою частинок: гомогенізована модель занижує на 350 pcm за 8 % і на 590 pcm за 15,5 % збагачення.", "de": "Die Gitterbibliothek ist die eigene OpenMC-0.15.3-/ENDF/B-VIII.0-Rechnung des Autors: von Dritten ungeprüft und gegen kein integrales Benchmark gestellt. Das veröffentlichte Artefakt bewertet nur die Modellschicht, die diese Seite darüber legt — den Zweigruppen-Leckage-Eigenwert, den Chargen-Abbrandlöser, die Zweiginterpolation, die Wassertafel und die Brennstoffkreislaufkosten —, daher bleibt das Werkzeug auf Prototyp und der Beleg bleibt lesbar. Die doppelte Heterogenität des TRISO-Brennstoffs trägt eine reaktivitätsäquivalente physikalische Transformation, kalibriert am expliziten Partikelgitter: Das homogenisierte Modell liegt bei 8 % um 350 pcm und bei 15,5 % um 590 pcm zu niedrig.", "nl": "De roosterbibliotheek is de eigen OpenMC 0.15.3 / ENDF/B-VIII.0-berekening van de auteur: niet door derden beoordeeld en tegen geen integrale benchmark gelegd. Het gepubliceerde artefact beoordeelt alleen de modellaag die deze pagina erbovenop legt — de tweegroeps-lekeigenwaarde, de chargeopbrandoplosser, de takinterpolatie, de watertabel en de splijtstofcycluskosten — dus het gereedschap blijft op prototype en het bewijs blijft leesbaar. De dubbele heterogeniteit van de TRISO-brandstof wordt gedragen door een reactiviteitsequivalente fysische transformatie, geijkt op het expliciete deeltjesrooster: het gehomogeniseerde model ligt 350 pcm laag bij 8 % en 590 pcm laag bij 15,5 % verrijking.", "fr": "La bibliothèque de réseaux est le calcul propre de l’auteur avec OpenMC 0.15.3 et ENDF/B-VIII.0 : aucun tiers ne l’a revue et elle n’a été confrontée à aucun banc d’essai intégral. L’artefact publié ne note que la couche de modèle que cette page ajoute par-dessus — la valeur propre de fuite à deux groupes, le solveur d’épuisement par lots, l’interpolation des branches, la table de l’eau et le coût du cycle du combustible —, l’outil reste donc au stade prototype et les preuves restent lisibles. La double hétérogénéité du combustible TRISO est portée par une transformation physique équivalente en réactivité, calée sur le réseau de particules explicite : le modèle homogénéisé est bas de 350 pcm à 8 % et de 590 pcm à 15,5 % d’enrichissement.", "es": "La biblioteca de redes es el cálculo propio del autor con OpenMC 0.15.3 y ENDF/B-VIII.0: ningún tercero la ha revisado y no se ha contrastado con ningún banco integral. El artefacto publicado califica solo la capa de modelo que esta página añade encima —el autovalor de fuga a dos grupos, el solucionador de quemado por lotes, la interpolación de ramas, la tabla del agua y el coste del ciclo del combustible—, de modo que la herramienta permanece en prototipo y la evidencia queda legible. La doble heterogeneidad del combustible TRISO se traslada mediante una transformación física equivalente en reactividad, calibrada frente a la red explícita de partículas: el modelo homogeneizado queda 350 pcm bajo al 8 % y 590 pcm bajo al 15,5 % de enriquecimiento.", "pl": "Biblioteka siatek to własne obliczenie autora w OpenMC 0.15.3 z ENDF/B-VIII.0: bez recenzji zewnętrznej i bez porównania z benchmarkiem całkowym. Opublikowany artefakt ocenia tylko warstwę modelu, którą ta strona nadbudowuje — dwugrupową wartość własną ucieczki, solver wypalenia wsadowego, interpolację gałęzi, tablicę wody i koszt cyklu paliwowego — więc narzędzie pozostaje prototypem, a dowody pozostają czytelne. Podwójną heterogeniczność paliwa TRISO oddaje przekształcenie równoważne reaktywnościowo, skalibrowane względem jawnej siatki cząstek: model zhomogenizowany zaniża o 350 pcm przy 8 % i o 590 pcm przy 15,5 % wzbogacenia."}, "independent_validation": false, "benchmarks": [{"id": "model-layer-against-published-references", "reference": "Published references (WNA separative work, the linear reactivity model of Driscoll et al., IAPWS-IF97 water density) and independent recomputation of the page’s own relations; the lattice library itself is not benchmarked.", "citations": ["World Nuclear Association, \"Uranium Enrichment\": one kilogram of 5 % enriched uranium takes 7.9 SWU at 0.25 % tails and 8.9 SWU at 0.20 % tails.", "M. J. Driscoll, T. J. Downar, E. E. Pilat, \"The Linear Reactivity Model for Nuclear Fuel Management\", ANS (1990): n-batch discharge burnup 2n/(n+1) times the single-batch value.", "IAPWS-IF97, evaluated with the iapws 1.5.5 Python package, for the water density tables.", "F. N. Fritsch, R. E. Carlson, \"Monotone Piecewise Cubic Interpolation\", SIAM J. Numer. Anal. 17 (1980) 238-246."], "cases": 81, "passed": 81, "tolerance": "Per check, stated in the artifact: 1e-9 relative where the reference is the same equation solved another way, 2e-4 where the page reads a tabulated curve between knots, 0.6 % against the published separative work, 0.3 % against IAPWS-IF97, 1 % against the explicit TRISO lattice.", "run_at": "2026-09-26T12:19:08.100Z", "artifact": "benchmarks/corescoping.json"}]}, "limitations": {"en": "Bare cylinder with a reflector entered as a size saving, not modelled: no control rods, no burnable poison, no fuel shuffling and no spatial power shape beyond the cosine-Bessel peaking factor. The lattice library is a single cell per reactor line at fixed pitch and fixed geometry, so changing enrichment moves the fuel but never the lattice; the enrichment axis is interpolated between the computed cases and never continued beyond them: outside that range the result is computed at the nearest computed case and the page says so. Feedback is interpolated from branch cases at two burnup points, so a coefficient at high burnup is an extrapolation of that pair. Statistical uncertainty of the depleted k-infinity is a few hundred pcm per point; the two-group leakage model overestimates reactivity for cores whose size approaches the migration length. The HTGR line uses a reactivity-equivalent homogenisation of its TRISO particles. The burnup axis is read the same way: the batch solve may look 60 % past the last computed point, on the linear continuation of the curve's last segment, and the page states what fraction of the cycle sits there. The two molten-salt lines are modelled as batch cores: the salt carries its fission products to the end of the cycle, so their reactivity falls as in any batch reactor, and the online feed and processing these reactors are run with are absent. Fuel costs cover the fuel cycle in euros only and carry no capital, operating or waste charge.", "uk": "Голий циліндр, відбивач задається як еквівалентний приріст розміру й не моделюється: немає органів регулювання, вигоряючого поглинача, перестановок палива й просторового поля потужності поза коефіцієнтом нерівномірності косинус-Бесселя. Бібліотека решіток — одна комірка на тип реактора зі сталим кроком і сталою геометрією, тож зміна збагачення змінює паливо, але не решітку; вісь збагачення інтерполюється між порахованими випадками й ніколи не продовжується за них: поза цим діапазоном результат рахується в найближчому порахованому випадку, і сторінка це пише. Зворотний зв'язок інтерполюється за ветвями у двох точках вигоряння, тож коефіцієнт за великого вигоряння є екстраполяцією цієї пари. Статистична похибка k-нескінченного випаленого палива — кілька сотень pcm на точку; двогрупова модель витоку завищує реактивність для зон, розмір яких наближається до довжини міграції. Для ВТГР застосовано еквівалентну за реактивністю гомогенізацію частинок TRISO. Вісь вигоряння читається так само: розв'язувач партій може вийти на 60 % за останню пораховану точку, на лінійне продовження останньої ділянки кривої, і сторінка вказує, яка частка кампанії там опинилася. Дві розплавно-сольові лінії змодельовано як партійні зони: сіль несе свої продукти поділу до кінця кампанії, тож реактивність падає, як у будь-якому партійному реакторі, а безперервного підживлення й переробки, з якими ці реактори працюють, тут немає. Вартість палива охоплює лише паливний цикл у євро й не містить капітальних, експлуатаційних і поводження з відходами витрат.", "de": "Nackter Zylinder, der Reflektor wird als Größenersparnis eingegeben und nicht modelliert: keine Steuerstäbe, kein abbrennbares Gift, kein Umsetzen des Brennstoffs und keine räumliche Leistungsform jenseits des Kosinus-Bessel-Formfaktors. Die Gitterbibliothek ist eine Zelle je Reaktorlinie mit festem Stababstand und fester Geometrie, sodass eine Anreicherungsänderung den Brennstoff bewegt, nie das Gitter; die Anreicherungsachse wird zwischen den gerechneten Fällen interpoliert und nie darüber hinaus fortgesetzt: außerhalb dieses Bereichs wird am nächsten gerechneten Fall gerechnet, und die Seite sagt das. Die Rückkopplung wird aus Zweigfällen an zwei Abbrandpunkten interpoliert, ein Koeffizient bei hohem Abbrand ist also eine Extrapolation dieses Paares. Die statistische Unsicherheit des abgebrannten k-unendlich beträgt einige hundert pcm je Punkt; das Zweigruppen-Leckagemodell überschätzt die Reaktivität für Kerne, deren Größe an die Migrationslänge heranreicht. Die HTR-Linie nutzt eine reaktivitätsäquivalente Homogenisierung ihrer TRISO-Partikel. Die Abbrandachse wird ebenso gelesen: Der Chargenlöser darf 60 % über den letzten gerechneten Punkt hinausgehen, auf der linearen Fortsetzung des letzten Kurvenabschnitts, und die Seite nennt den Anteil des Zyklus, der dort liegt. Die beiden Salzschmelze-Linien sind als Chargenkerne modelliert: Das Salz trägt seine Spaltprodukte bis zum Zyklusende, die Reaktivität fällt also wie in jedem Chargenreaktor, und die laufende Zufuhr und Aufbereitung, mit denen diese Reaktoren betrieben werden, fehlen. Die Brennstoffkosten decken nur den Brennstoffkreislauf in Euro und enthalten keine Kapital-, Betriebs- oder Entsorgungskosten.", "nl": "Kale cilinder met de reflector als maatbesparing ingevoerd en niet gemodelleerd: geen regelstaven, geen opbrandbaar gif, geen splijtstofverplaatsing en geen ruimtelijke vermogensvorm buiten de cosinus-Besselpiekfactor. De roosterbibliotheek is één cel per reactorlijn bij vaste steek en vaste geometrie, dus verrijking verandert de brandstof maar nooit het rooster; de verrijkingsas wordt tussen de gerekende gevallen geïnterpoleerd en er nooit buiten voortgezet: daarbuiten rekent de pagina in het dichtstbijzijnde gerekende geval en zegt dat. Terugkoppeling wordt geïnterpoleerd uit takgevallen op twee opbrandpunten, dus een coëfficiënt bij hoge opbrand is een extrapolatie van dat paar. De statistische onzekerheid van de opgebrande k-oneindig is enkele honderden pcm per punt; het tweegroepslekmodel overschat de reactiviteit voor kernen waarvan de maat de migratielengte nadert. De HTGR-lijn gebruikt een reactiviteitsequivalente homogenisatie van haar TRISO-deeltjes. De opbrandas wordt op dezelfde manier gelezen: de chargeoplosser mag 60 % voorbij het laatste berekende punt kijken, op de lineaire voortzetting van het laatste segment van de kromme, en de pagina noemt welk deel van de cyclus daar ligt. De twee gesmoltenzoutlijnen zijn als chargekernen gemodelleerd: het zout draagt zijn splijtingsproducten tot het eind van de cyclus, dus de reactiviteit daalt zoals in elke chargereactor, en de continue toevoer en opwerking waarmee deze reactoren draaien ontbreken. De brandstofkosten dekken alleen de splijtstofcyclus in euro en bevatten geen kapitaal-, bedrijfs- of afvalkosten.", "fr": "Cylindre nu, le réflecteur étant saisi comme une économie de taille et non modélisé : pas de barres de commande, pas de poison consommable, pas de permutation du combustible et pas de forme spatiale de puissance au-delà du facteur de pic cosinus-Bessel. La bibliothèque de réseaux est une cellule par filière, à pas et géométrie fixes : changer l’enrichissement change le combustible, jamais le réseau ; l’axe d’enrichissement est interpolé entre les cas calculés et jamais prolongé au-delà : hors de cette plage le résultat est calculé au cas calculé le plus proche, et la page l’indique. La contre-réaction est interpolée à partir de cas de branche à deux points d’épuisement ; un coefficient à fort épuisement est donc une extrapolation de ce couple. L’incertitude statistique du k-infini irradié est de quelques centaines de pcm par point ; le modèle de fuite à deux groupes surestime la réactivité des cœurs dont la taille approche la longueur de migration. La filière HTR utilise une homogénéisation équivalente en réactivité de ses particules TRISO. L’axe d’épuisement se lit de la même façon : le solveur par lots peut aller 60 % au-delà du dernier point calculé, sur le prolongement linéaire du dernier segment de la courbe, et la page indique quelle part du cycle s’y trouve. Les deux filières à sels fondus sont modélisées comme des cœurs par lots : le sel garde ses produits de fission jusqu’à la fin du cycle, la réactivité chute donc comme dans tout réacteur par lots, et l’appoint et le retraitement en ligne avec lesquels ces réacteurs fonctionnent sont absents. Les coûts du combustible couvrent le seul cycle du combustible en euros, sans charge de capital, d’exploitation ni de déchets.", "es": "Cilindro desnudo con el reflector introducido como ahorro de tamaño y no modelado: sin barras de control, sin veneno consumible, sin reubicación de combustible y sin forma espacial de potencia más allá del factor de pico coseno-Bessel. La biblioteca de redes es una celda por línea de reactor con paso y geometría fijos, de modo que cambiar el enriquecimiento cambia el combustible pero nunca la red; el eje de enriquecimiento se interpola entre los casos calculados y nunca se prolonga más allá: fuera de ese rango el resultado se calcula en el caso calculado más próximo, y la página lo indica. La realimentación se interpola a partir de casos de rama en dos puntos de quemado, por lo que un coeficiente a alto quemado es una extrapolación de ese par. La incertidumbre estadística del k-infinito quemado es de unos cientos de pcm por punto; el modelo de fuga de dos grupos sobrestima la reactividad de núcleos cuyo tamaño se acerca a la longitud de migración. La línea HTGR emplea una homogeneización equivalente en reactividad de sus partículas TRISO. El eje de quemado se lee igual: el solucionador por lotes puede ir un 60 % más allá del último punto calculado, sobre la prolongación lineal del último tramo de la curva, y la página indica qué parte del ciclo queda allí. Las dos líneas de sales fundidas se modelan como núcleos por lotes: la sal conserva sus productos de fisión hasta el final del ciclo, así que la reactividad cae como en cualquier reactor por lotes, y faltan la alimentación y el reprocesado en línea con los que estos reactores operan. Los costes de combustible cubren solo el ciclo del combustible en euros, sin cargos de capital, operación ni residuos.", "pl": "Nagi walec, reflektor wprowadzany jako oszczędność wymiaru i niemodelowany: bez prętów regulacyjnych, bez trucizny wypalalnej, bez przestawiania paliwa i bez przestrzennego rozkładu mocy poza współczynnikiem szczytowym cosinus-Bessel. Biblioteka siatek to jedna komórka na linię reaktora przy stałym skoku i stałej geometrii, więc zmiana wzbogacenia zmienia paliwo, lecz nigdy siatki; oś wzbogacenia jest interpolowana między obliczonymi przypadkami i nigdy poza nie przedłużana: poza tym zakresem wynik liczony jest w najbliższym policzonym przypadku, a strona to podaje. Sprzężenia interpolowane są z przypadków gałęziowych w dwóch punktach wypalenia, więc współczynnik przy wysokim wypaleniu jest ekstrapolacją tej pary. Niepewność statystyczna wypalonego k-nieskończonego wynosi kilkaset pcm na punkt; dwugrupowy model ucieczki zawyża reaktywność rdzeni, których wymiar zbliża się do długości migracji. Linia HTGR korzysta z homogenizacji cząstek TRISO równoważnej reaktywnościowo. Oś wypalenia czytana jest tak samo: solver wsadowy może wyjść 60 % poza ostatni policzony punkt, po liniowym przedłużeniu ostatniego odcinka krzywej, a strona podaje, jaka część cyklu tam leży. Obie linie soli stopionych modelowane są jako rdzenie wsadowe: sól niesie swoje produkty rozszczepienia do końca cyklu, więc reaktywność spada jak w każdym reaktorze wsadowym, a ciągłego zasilania i przerobu, z którymi te reaktory pracują, tu nie ma. Koszty paliwa obejmują wyłącznie cykl paliwowy w euro i nie zawierają kosztów kapitałowych, eksploatacyjnych ani gospodarki odpadami."}, "intended_use": ["education", "technical exploration", "preliminary assessment"], "catalog_languages": ["en", "uk", "de", "nl", "fr", "es", "pl"], "tool_languages": ["en", "uk", "de", "nl", "fr", "es", "pl"], "dependencies": [], "network_access": {"mode": "none"}, "report": {"pdf": true, "source_attribution": true}, "python_export": {"supported": true, "requires": []}, "handoff": {"provides": ["rho_reac", "T", "Q"], "accepts": ["T", "Q"]}, "state_codec": {"permalink": true, "record": "tools.petrov.re/calculation-record/v1"}, "ui": {"framework": "tools.petrov.re/ui/v1", "level": 3}}
</script>

/* ----------------------------------------------------------------- drawing
 * Four canvases: the core with its shielding and a person for scale, the
 * reactivity history, the power defect with the feedback coefficients, and the
 * modelled lattice cell.  All of it is 2-D canvas: no library, no network.
 */
function tok(name, fallback) {
  try {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name);
    return (v && v.trim()) || fallback;
  } catch (e) { return fallback; }
}
function palette() {
  return {
    fg: tok('--dgu-fg', '#1d1d1b'),
    mut: tok('--dgu-fg-muted', '#6b6b66'),
    line: tok('--dgu-border', '#d8d8d2'),
    bg: tok('--dgu-bg-elevated', '#ffffff'),
    acc: tok('--dgu-accent', '#a4642a'),
    ok: tok('--dgu-ok', '#2e7d5b'),
    warn: tok('--dgu-warn', '#b07a12'),
    bad: tok('--dgu-bad', '#b3452f'),
    ser: ['#4477aa', '#cc6677', '#228833', '#aa7733', '#8855aa', '#66aabb']
  };
}
/* The framework hands a stage a ready 2-D context (already scaled for the
   device pixel ratio); a canvas the tool makes itself needs the same setup. */
function ctx2d(cv, w, h) {
  var d = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w * d); cv.height = Math.round(h * d);
  var c = cv.getContext('2d');
  c.setTransform(d, 0, 0, d, 0, 0);
  return c;
}

/* ---------------------------------------------------------- chart helper */
function niceStep(range, target) {
  var raw = range / Math.max(target, 1), p = Math.pow(10, Math.floor(Math.log10(raw)));
  var n = raw / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}
function Axes(c, w, h, opts) {
  var P = palette();
  var m = { l: opts.ml || 56, r: opts.mr || 14, t: opts.mt || 16, b: opts.mb || 34 };
  var x0 = m.l, y0 = h - m.b, x1 = w - m.r, y1 = m.t;
  var self = {
    P: P, x0: x0, y0: y0, x1: x1, y1: y1,
    sx: function (v) { return x0 + (v - opts.xmin) / (opts.xmax - opts.xmin) * (x1 - x0); },
    sy: function (v) { return y0 - (v - opts.ymin) / (opts.ymax - opts.ymin) * (y0 - y1); }
  };
  c.save();
  c.strokeStyle = P.line; c.fillStyle = P.mut;
  c.lineWidth = 1; c.font = '11px system-ui, sans-serif';
  var sx = niceStep(opts.xmax - opts.xmin, opts.nx || 6);
  var sy = niceStep(opts.ymax - opts.ymin, opts.ny || 5);
  var v, px;
  c.textAlign = 'center'; c.textBaseline = 'top';
  for (v = Math.ceil(opts.xmin / sx) * sx; v <= opts.xmax + 1e-9; v += sx) {
    px = self.sx(v);
    c.globalAlpha = 0.35; c.beginPath(); c.moveTo(px, y0); c.lineTo(px, y1); c.stroke(); c.globalAlpha = 1;
    c.fillText(fmtNum(v, sx), px, y0 + 6);
  }
  c.textAlign = 'right'; c.textBaseline = 'middle';
  for (v = Math.ceil(opts.ymin / sy) * sy; v <= opts.ymax + 1e-9; v += sy) {
    var py = self.sy(v);
    c.globalAlpha = 0.35; c.beginPath(); c.moveTo(x0, py); c.lineTo(x1, py); c.stroke(); c.globalAlpha = 1;
    c.fillText(fmtNum(v, sy), x0 - 6, py);
  }
  c.strokeStyle = P.line; c.globalAlpha = 1;
  c.beginPath(); c.moveTo(x0, y1); c.lineTo(x0, y0); c.lineTo(x1, y0); c.stroke();
  if (opts.xlabel) { c.textAlign = 'center'; c.textBaseline = 'bottom'; c.fillText(opts.xlabel, (x0 + x1) / 2, h - 2); }
  if (opts.ylabel) {
    c.save(); c.translate(11, (y0 + y1) / 2); c.rotate(-Math.PI / 2);
    c.textAlign = 'center'; c.textBaseline = 'top'; c.fillText(opts.ylabel, 0, 0); c.restore();
  }
  c.restore();
  return self;
}
function fmtNum(v, step) {
  var d = Math.max(0, -Math.floor(Math.log10(step)) + (step < 1 ? 0 : 0));
  if (Math.abs(v) >= 1e4) return v.toExponential(1);
  return v.toFixed(Math.min(d, 4));
}
function line(c, ax, pts, colour, width, dash) {
  c.save();
  c.strokeStyle = colour; c.lineWidth = width || 2;
  if (dash) c.setLineDash(dash);
  c.beginPath();
  var started = false;
  pts.forEach(function (p) {
    var x = ax.sx(p[0]), y = ax.sy(p[1]);
    if (!isFinite(x) || !isFinite(y)) return;
    if (!started) { c.moveTo(x, y); started = true; } else c.lineTo(x, y);
  });
  c.stroke(); c.restore();
}

/* ------------------------------------------------------------- core view */
/* The core as it stands in its building: a CANDU calandria is a cylinder lying
 * on its side with horizontal channels, an RBMK or a PWR stands upright. The
 * body is always drawn with its channels along the local x axis and the picture
 * is turned a quarter turn for the upright lines, so one routine serves both. */
function drawCore(c, w, h, res, st, lang) {
  var P = palette();
  c.clearRect(0, 0, w, h);
  if (!res) return;
  var view = (typeof CELLVIEW !== 'undefined' && CELLVIEW[st.entry]) || { axis: 'v' };
  var horiz = view.axis === 'h';
  var R = st.R, H = st.H, refl = st.refl, sh = res.shieldThickness;
  var person = 175.26;
  var across = 2 * (R + refl + sh), along = H + 2 * (refl + sh);
  var totalW = (horiz ? along : across) + 130;
  var totalH = Math.max(horiz ? across : along, person) + 44;
  var s = Math.min((w - 24) / totalW, (h - 34) / totalH);
  var cx = w / 2 - 22, cy = h / 2;
  function cylinder(rad, half, fill, stroke, alpha) {
    var rr = rad * s, hh = half * s, ey = Math.max(rr * 0.28, 3);
    c.save();
    c.translate(cx, cy);
    if (!horiz) c.rotate(-Math.PI / 2);
    c.globalAlpha = alpha == null ? 1 : alpha;
    c.fillStyle = fill; c.strokeStyle = stroke || P.line; c.lineWidth = 1;
    c.beginPath();
    c.moveTo(-hh, -rr); c.lineTo(hh, -rr);
    c.ellipse(hh, 0, ey, rr, 0, -Math.PI / 2, Math.PI / 2);
    c.lineTo(-hh, rr);
    c.ellipse(-hh, 0, ey, rr, 0, Math.PI / 2, -Math.PI / 2, true);
    c.closePath(); c.fill(); c.stroke();
    /* the near face, a shade lighter */
    c.beginPath(); c.ellipse(hh, 0, ey, rr, 0, 0, 2 * Math.PI);
    c.fillStyle = fill; c.globalAlpha = (alpha == null ? 1 : alpha) * 0.85; c.fill(); c.stroke();
    c.restore();
  }
  cylinder(R + refl + sh, H / 2 + refl + sh, P.mut, P.line, 0.18);
  if (refl > 0) cylinder(R + refl, H / 2 + refl, P.ser[2], P.line, 0.35);
  cylinder(R, H / 2, P.ser[0], P.fg, 0.9);
  /* the direction the fuel runs in */
  c.save();
  c.translate(cx, cy);
  if (!horiz) c.rotate(-Math.PI / 2);
  c.strokeStyle = P.fg; c.globalAlpha = 0.22; c.lineWidth = 0.9;
  [-0.62, -0.3, 0.3, 0.62].forEach(function (f) {
    var y = f * R * s;
    c.beginPath(); c.moveTo(-H / 2 * s, y); c.lineTo(H / 2 * s, y); c.stroke();
  });
  c.restore();
  /* a person, upright whichever way the core lies */
  var outAcross = (R + refl + sh) * s, outAlong = (H / 2 + refl + sh) * s;
  var px = cx + (horiz ? outAlong : outAcross) + 14;
  var base = cy + (horiz ? outAcross : outAlong);
  c.save(); c.fillStyle = P.bad;
  var bodyH = person * 0.8 * s, headR = person * 0.1 * s;
  c.fillRect(px, base - bodyH, Math.max(person * 0.1 * s, 2), bodyH);
  c.beginPath(); c.arc(px + Math.max(person * 0.05 * s, 1), base - bodyH - headR, headR, 0, 2 * Math.PI); c.fill();
  c.restore();
  /* dimensions, on the sides the picture leaves free */
  c.save();
  c.fillStyle = P.mut; c.font = '11px system-ui, sans-serif';
  var axial = (horiz ? 'L ' : 'H ') + H.toFixed(0) + ' cm', diam = 'D ' + (2 * R).toFixed(0) + ' cm';
  if (horiz) {
    c.textAlign = 'center'; c.textBaseline = 'top';
    c.fillText(axial, cx, cy + R * s + Math.max(R * s * 0.28, 3) + 4);
    c.textAlign = 'right'; c.textBaseline = 'middle';
    c.fillText(diam, cx - H / 2 * s - 6, cy);
  } else {
    /* above the top face: inside it the text sat on the core itself */
    c.textAlign = 'center'; c.textBaseline = 'bottom';
    c.fillText(diam, cx, cy - H / 2 * s - Math.max(R * s * 0.28, 3) - 5);
    c.textAlign = 'right'; c.textBaseline = 'middle';
    c.fillText(axial, cx - R * s - 6, cy);
  }
  c.restore();
}

function drawCycle(c, w, h, res, st, lang, S) {
  var P = palette();
  c.clearRect(0, 0, w, h);
  if (!res) return;
  var pts = res.curve.map(function (p) { return [st.xaxis === 'days' ? p.days : p.B, p.keff]; });
  var kinf = res.curve.map(function (p) { return [st.xaxis === 'days' ? p.days : p.B, p.kinf]; });
  var xmax = pts[pts.length - 1][0] || 1;
  var ymin = Math.min(0.85, Math.min.apply(null, pts.map(function (p) { return p[1]; })) - 0.02);
  var ymax = Math.max.apply(null, kinf.map(function (p) { return p[1]; })) + 0.03;
  var ax = Axes(c, w, h, {
    xmin: 0, xmax: xmax, ymin: ymin, ymax: ymax,
    xlabel: pick(st.xaxis === 'days' ? S.axDays : S.axBurnup, lang), ylabel: 'k'
  });
  line(c, ax, kinf, P.mut, 1.5, [5, 4]);
  line(c, ax, pts, P.ser[0], 2.2);
  /* criticality line */
  c.save(); c.strokeStyle = P.bad; c.lineWidth = 1; c.setLineDash([3, 3]);
  c.beginPath(); c.moveTo(ax.x0, ax.sy(1)); c.lineTo(ax.x1, ax.sy(1)); c.stroke(); c.restore();
  /* batch marks */
  var Bd = res.dischargeBurnup, n = res.batches;
  c.save(); c.fillStyle = P.acc;
  for (var i = 1; i <= n; i++) {
    var b = Bd * i / n, x = st.xaxis === 'days' ? b * 1000 / Math.max(res.specificPower, 1e-9) : b;
    if (x > xmax) continue;
    var y = ax.sy(kAtX(res, b));
    c.beginPath(); c.arc(ax.sx(x), y, 3.5, 0, 2 * Math.PI); c.fill();
  }
  c.restore();
  /* discharge marker */
  var xd = st.xaxis === 'days' ? Bd * 1000 / Math.max(res.specificPower, 1e-9) : Bd;
  if (xd <= xmax) {
    c.save(); c.strokeStyle = P.acc; c.lineWidth = 1.2; c.setLineDash([2, 3]);
    c.beginPath(); c.moveTo(ax.sx(xd), ax.y0); c.lineTo(ax.sx(xd), ax.y1); c.stroke(); c.restore();
  }
}
function kAtX(res, B) {
  var cur = res.curve, i;
  for (i = 1; i < cur.length; i++) if (cur[i].B >= B) {
    var f = (B - cur[i - 1].B) / (cur[i].B - cur[i - 1].B);
    return cur[i - 1].keff + f * (cur[i].keff - cur[i - 1].keff);
  }
  return cur[cur.length - 1].keff;
}

/* ------------------------------------------- power defect and coefficients */
function drawPower(c, w, h, res, curve, lang, S) {
  var P = palette();
  c.clearRect(0, 0, w, h);
  if (!res || !curve || !curve.length) return;
  /* Wide: the power curve on the left, the coefficient column on the right.
   * Narrow: the column goes under the curve, because at 342 px a three-column
   * row printed its label over its own value. */
  var stacked = w < 640;
  var chartW = stacked ? w : Math.max(240, w - Math.max(240, Math.min(390, w * 0.44)) - 10);
  var chartH = stacked ? Math.max(150, h * 0.56) : h;
  var pts = curve.map(function (p) { return [100 * p.p, p.rho]; });
  var ys = pts.map(function (p) { return p[1]; });
  var ymin = Math.min.apply(null, ys), ymax = Math.max.apply(null, ys);
  var pad = Math.max((ymax - ymin) * 0.12, 50);
  var ax = Axes(c, chartW, chartH, {
    xmin: 0, xmax: 120, ymin: ymin - pad, ymax: ymax + pad,
    xlabel: pick(S.axPower, lang), ylabel: 'pcm', mr: 8
  });
  line(c, ax, pts, P.ser[1], 2.2);
  c.save(); c.strokeStyle = P.line; c.setLineDash([3, 3]);
  c.beginPath(); c.moveTo(ax.sx(100), ax.y0); c.lineTo(ax.sx(100), ax.y1); c.stroke();
  c.restore();

  /* The bars carry the reactivity a step of each parameter is worth, not the
   * coefficient itself: a pcm/K and a pcm/ppm have no common bar length, while
   * the pcm that one step of each is worth is one scale and one comparison.
   * The coefficient per unit is what the result tiles carry. */
  var items = [], co = res.coef;
  function add(key, label, unit, step, stepLabel) {
    if (co[key] === undefined || co[key] === null || !isFinite(co[key])) return;
    items.push({ label: pick(label, lang).replace(/\s*\([^()]*\)\s*$/, ''),
                 v: co[key], unit: unit, step: step, stepLabel: stepLabel });
  }
  add('doppler', S.cDoppler, 'pcm/K', 100, '100 K');
  add('coolantT', S.cCoolant, 'pcm/K', 10, '10 K');
  add('moderatorT', S.cModerator, 'pcm/K', 10, '10 K');
  add('voidCoef', S.cVoid, 'pcm/%', 1, '1 %');
  add('coolantDensity', S.cCoolDens, 'pcm/%', 1, '1 %');
  add('saltDensity', S.cSalt, 'pcm/%', 1, '1 %');
  add('boron', S.cBoron, 'pcm/ppm', 100, '100 ppm');
  add('ingress', S.fIngress, 'pcm/(mg/cm³)', 1, '1 mg/cm³');
  if (!items.length) return;

  c.save();
  if (stacked) c.translate(8, chartH);
  else c.translate(chartW + 8, 0);
  drawWorth(c, items, stacked ? w - 16 : w - chartW - 16, stacked ? h - chartH : h, P, lang, S);
  c.restore();
}

/* One signed bar per axis, all on the same pcm scale, drawn in the local
   coordinates of whichever block the caller placed. */
function drawWorth(c, items, wid, hgt, P, lang, S) {
  var worst = 1e-9;
  items.forEach(function (it) {
    it.worth = it.v * it.step;
    worst = Math.max(worst, Math.abs(it.worth));
  });
  var labW = Math.min(142, wid * 0.36), valW = Math.min(132, wid * 0.38);
  var zero = labW + (wid - labW - valW) * 0.5;
  var span = (wid - labW - valW) * 0.46;
  var rowH = Math.min(28, Math.max(14, (hgt - 26) / items.length));
  var y00 = Math.max(20, (hgt - items.length * rowH) / 2);
  c.save();
  c.font = '11px system-ui, sans-serif'; c.textBaseline = 'middle';
  c.fillStyle = P.mut; c.textAlign = 'left';
  c.fillText(pick(S.cWorth, lang), 0, y00 - 13);
  c.strokeStyle = P.line; c.lineWidth = 1;
  c.beginPath(); c.moveTo(zero, y00); c.lineTo(zero, y00 + items.length * rowH); c.stroke();
  items.forEach(function (it, i) {
    var y = y00 + i * rowH + rowH / 2;
    var len = Math.max((Math.abs(it.worth) / worst) * span, 1.5);
    c.fillStyle = P.mut; c.textAlign = 'right';
    c.fillText(clipText(c, it.label, labW - 8), labW - 8, y);
    c.fillStyle = it.worth < 0 ? P.ok : P.bad;
    c.fillRect(it.worth < 0 ? zero - len : zero, y - 4, len, 8);
    c.textAlign = 'right'; c.fillStyle = P.fg;
    c.fillText(clipText(c, fmtSig(it.worth, 3) + ' pcm / ' + it.stepLabel, valW), wid, y);
  });
  c.restore();
}
function clipText(c, s, maxW) {
  if (c.measureText(s).width <= maxW) return s;
  var out = s;
  while (out.length > 3 && c.measureText(out + '…').width > maxW) out = out.slice(0, -1);
  return out + '…';
}
function fmtSig(v, n) {
  if (!isFinite(v)) return '—';
  if (v === 0) return '0';
  var a = Math.abs(v);
  var d = a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 2 : 3;
  return v.toFixed(d);
}

/* ------------------------------------------------------- lattice cell view */
var CELL_COLOURS = {
  fuel: ['#b3452f', 0.85], clad: ['#7a7a7a', 0.8], gap: ['#cfcfcf', 0.6],
  cool: ['#4477aa', 0.45], mod: ['#2e7d5b', 0.25], mod2: ['#2e7d5b', 0.45],
  struct: ['#8a6d3b', 0.6]
};
/* Where the cut is taken. The body is drawn with its channels along the local
 * x axis and the cut disc across them; the vertical-channel case is the same
 * picture turned a quarter turn, so both come from one routine. */
function drawPlaneInset(c, x, y, w, h, axis, P) {
  /* the body runs along the box's long side once the rotation is applied */
  var along = axis === 'v' ? h : w, across = axis === 'v' ? w : h;
  var L = along * 0.80, R = Math.min(across * 0.30, L * 0.26), cap = L * 0.10;
  c.save();
  c.translate(x + w / 2, y + h / 2);
  if (axis === 'v') c.rotate(-Math.PI / 2);
  c.lineWidth = 1;
  /* body: a cylinder seen from the side, caps as half ellipses */
  c.beginPath();
  c.moveTo(-L / 2, -R); c.lineTo(L / 2, -R);
  c.ellipse(L / 2, 0, cap, R, 0, -Math.PI / 2, Math.PI / 2);
  c.lineTo(-L / 2, R);
  c.ellipse(-L / 2, 0, cap, R, 0, Math.PI / 2, -Math.PI / 2, true);
  c.closePath();
  c.fillStyle = P.mut; c.globalAlpha = 0.10; c.fill();
  c.globalAlpha = 1; c.strokeStyle = P.line; c.stroke();
  /* the channels */
  c.strokeStyle = P.mut; c.globalAlpha = 0.55; c.lineWidth = 0.8;
  [-0.55, 0, 0.55].forEach(function (f) {
    c.beginPath(); c.moveTo(-L / 2, f * R); c.lineTo(L / 2, f * R); c.stroke();
  });
  c.globalAlpha = 1;
  /* the plane the section is taken in, across them */
  var xc = L * 0.16;
  c.beginPath(); c.ellipse(xc, 0, cap, R, 0, 0, 2 * Math.PI);
  c.fillStyle = P.ok; c.globalAlpha = 0.30; c.fill();
  c.globalAlpha = 1; c.strokeStyle = P.ok; c.lineWidth = 1.2; c.stroke();
  /* the direction the section is looked at from */
  c.beginPath();
  c.moveTo(xc + cap + 3, 0); c.lineTo(xc + cap + 13, 0); c.stroke();
  c.beginPath();
  c.moveTo(xc + cap + 13, 0); c.lineTo(xc + cap + 8, -3.2); c.lineTo(xc + cap + 8, 3.2);
  c.closePath(); c.fillStyle = P.ok; c.fill();
  c.restore();
}

/* The modelled cell: the section itself, where its plane is taken, and what
 * each colour in it is made of. */
function drawCell(c, w, h, key, lang, S) {
  var P = palette(), spec = CELLS[key], view = (typeof CELLVIEW !== 'undefined' && CELLVIEW[key]) || null;
  c.clearRect(0, 0, w, h);
  if (!spec) return;
  var wide = w >= 470;
  var colW = wide ? Math.min(190, Math.max(130, w * 0.26)) : 0;
  var insetW = wide ? colW - 10 : Math.min(96, w * 0.28);
  var insetH = insetW * 0.62;
  /* legend rows: only the materials this cell actually contains */
  var kinds = [], seen = {};
  function want(k) { if (k && !seen[k]) { seen[k] = 1; kinds.push(k); } }
  (spec.rings || []).forEach(function (r) { (r.radii || spec.pin || []).forEach(function (l) { want(l[1]); }); });
  if (spec.centre) spec.centre.forEach(function (l) { want(l[1]); });
  if (spec.corners) want(spec.corners[1]);
  (spec.extra || []).forEach(function (e) { want(e[1]); });
  want(spec.bg);
  var ROLE = { fuel: 'mFuel', gap: 'mGap', clad: 'mClad', cool: 'mCool',
               mod: 'mMod', mod2: 'mMod2', struct: 'mStruct' };
  /* the legend reads outward from the fuel, whatever order the drawing found
     the materials in */
  var ORDER = ['fuel', 'gap', 'clad', 'cool', 'mod', 'mod2', 'struct'];
  kinds.sort(function (a1, b1) {
    var i = ORDER.indexOf(a1), j = ORDER.indexOf(b1);
    return (i < 0 ? 99 : i) - (j < 0 ? 99 : j);
  });
  /* One row per material: the graphite sleeve and the graphite column of an
     RBMK channel are the same substance in two places, and two rows reading
     "C" would say it twice. */
  var legend = [], said = {};
  kinds.forEach(function (k) {
    var name = S && S[ROLE[k]] ? pick(S[ROLE[k]], lang) : k;
    var mat = view && view.mat && view.mat[k];
    var text = mat ? name + ' — ' + mat : name;
    /* only the two graphite regions of one cell collapse into one row: a
       coolant and a moderator that are both D2O are two different things. */
    var group = (k === 'mod' || k === 'mod2') ? 'moderator' : k;
    var id = group + '|' + (mat || name);
    var dup = said[id];
    said[id] = 1;
    if (!dup) legend.push({ kind: k, text: text });
  });
  var legendRows = wide ? 0 : Math.ceil(legend.length / 2);
  var legendH = wide ? 0 : legendRows * 15 + 6;

  /* the section, in the space left over */
  var areaW = w - colW, top = 34, bottom = legendH + 6;
  var size = Math.max(60, Math.min(areaW - 20, h - top - bottom));
  var pitch = spec.pitch, s = size / pitch;
  var cx = areaW / 2, cy = top + (h - top - bottom) / 2;
  function px(v) { return cx + v * s; }
  function py(v) { return cy - v * s; }
  function paint(kind) {
    var col = CELL_COLOURS[kind] || ['#888', 0.5];
    c.fillStyle = col[0]; c.globalAlpha = col[1];
  }
  c.save();
  c.beginPath();
  if (spec.shape === 'hex') {
    for (var i = 0; i < 6; i++) {
      var a = Math.PI / 6 + i * Math.PI / 3, r = pitch / Math.sqrt(3);
      var X = px(r * Math.cos(a)), Y = py(r * Math.sin(a));
      if (i === 0) c.moveTo(X, Y); else c.lineTo(X, Y);
    }
    c.closePath();
  } else {
    c.rect(px(-pitch / 2), py(pitch / 2), pitch * s, pitch * s);
  }
  paint(spec.bg); c.fill();
  c.globalAlpha = 1; c.strokeStyle = P.line; c.lineWidth = 1; c.stroke();
  c.clip();
  (spec.extra || []).forEach(function (e) {
    c.beginPath(); c.arc(cx, cy, e[0] * s, 0, 2 * Math.PI); paint(e[1]); c.fill();
    c.globalAlpha = 1; c.strokeStyle = P.line; c.stroke();
  });
  if (spec.corners) {
    var rr = spec.corners[0] * s, half = pitch / 2;
    [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(function (q) {
      c.beginPath(); c.arc(px(q[0] * half), py(q[1] * half), rr, 0, 2 * Math.PI);
      paint(spec.corners[1]); c.fill(); c.globalAlpha = 1;
    });
  }
  if (spec.centre) {
    spec.centre.slice().reverse().forEach(function (l) {
      c.beginPath(); c.arc(cx, cy, l[0] * s, 0, 2 * Math.PI); paint(l[1]); c.fill(); c.globalAlpha = 1;
    });
  }
  (spec.rings || []).forEach(function (ring) {
    var radii = ring.radii || spec.pin || [];
    for (var i = 0; i < ring.n; i++) {
      var ph = (ring.phase || 0) * Math.PI / 180;
      var ang = ring.n === 1 ? 0 : ph + 2 * Math.PI * i / ring.n;
      var x = ring.r * Math.cos(ang), y = ring.r * Math.sin(ang);
      radii.slice().reverse().forEach(function (l) {
        c.beginPath(); c.arc(px(x), py(y), l[0] * s, 0, 2 * Math.PI);
        paint(l[1]); c.fill(); c.globalAlpha = 1;
        c.strokeStyle = P.line; c.lineWidth = 0.6; c.stroke();
      });
    }
  });
  c.restore();

  /* what it is and where the plane is taken */
  c.save();
  c.fillStyle = P.mut; c.font = '11px system-ui, sans-serif';
  c.textAlign = 'left'; c.textBaseline = 'top';
  c.fillText((spec.shape === 'hex' ? 'hex ' : '') + 'pitch ' + pitch.toFixed(pitch < 10 ? 3 : 2) + ' cm', 8, 6);
  if (view && S) {
    var u = pick(S[view.unit] || S.uPin, lang);
    var line = fillU(pick(view.axis === 'h' ? S.sPlaneH : S.sPlaneV, lang), u);
    c.fillText(clipText(c, line, Math.max(80, (wide ? w - colW : w - insetW - 12) - 16)), 8, 21);
  }
  /* the inset, top right */
  if (view) drawPlaneInset(c, w - insetW - 8, wide ? 26 : 4, insetW, insetH, view.axis, P);
  /* the one cell whose drawing is not the geometry that was computed */
  if (key === 'htgr' && S && wide && h >= 230) drawTriso(c, 10, h - 92, 82, 82, lang, S, P);
  /* the legend */
  c.font = '11px system-ui, sans-serif'; c.textBaseline = 'middle';
  if (wide) {
    var ly = 26 + insetH + 16;
    legend.forEach(function (it, i) {
      var y = ly + i * 16;
      if (y > h - 8) return;
      var col = CELL_COLOURS[it.kind] || ['#888', 0.5];
      c.fillStyle = col[0]; c.globalAlpha = Math.max(col[1], 0.55);
      c.fillRect(w - colW + 4, y - 5, 12, 10);
      c.globalAlpha = 1; c.strokeStyle = P.line; c.lineWidth = 0.6;
      c.strokeRect(w - colW + 4, y - 5, 12, 10);
      c.fillStyle = P.mut; c.textAlign = 'left';
      c.fillText(clipText(c, it.text, colW - 26), w - colW + 22, y);
    });
  } else {
    var colw = (w - 16) / 2;
    legend.forEach(function (it, i) {
      var cxx = 8 + (i % 2) * colw, y = h - legendH + 8 + Math.floor(i / 2) * 15;
      var col = CELL_COLOURS[it.kind] || ['#888', 0.5];
      c.fillStyle = col[0]; c.globalAlpha = Math.max(col[1], 0.55);
      c.fillRect(cxx, y - 5, 11, 9);
      c.globalAlpha = 1; c.strokeStyle = P.line; c.lineWidth = 0.6;
      c.strokeRect(cxx, y - 5, 11, 9);
      c.fillStyle = P.mut; c.textAlign = 'left';
      c.fillText(clipText(c, it.text, colw - 22), cxx + 16, y);
    });
  }
  c.restore();
}
function fillU(s, u) { return String(s).replace(/\{u\}/g, u); }

/* The TRISO particle behind the HTGR compact, drawn to scale among itself and
 * labelled with the radius the homogenisation replaced it by: the section above
 * shows the homogenised compact, and this says what is inside it. */
function drawTriso(c, x, y, w, h, lang, S, P) {
  var R = [0.02125, 0.03125, 0.03475, 0.03825, 0.04225];
  var COL = ['#b3452f', '#6b6b6b', '#3f3f3f', '#8a6d3b', '#3f3f3f'];
  var cx = x + w / 2, cy = y + h / 2 - 6, s = (Math.min(w, h) / 2 - 12) / R[R.length - 1];
  c.save();
  for (var i = R.length - 1; i >= 0; i--) {
    c.beginPath(); c.arc(cx, cy, R[i] * s, 0, 2 * Math.PI);
    c.fillStyle = COL[i]; c.globalAlpha = i === 0 ? 0.9 : 0.55 - i * 0.05; c.fill();
    c.globalAlpha = 1; c.strokeStyle = P.line; c.lineWidth = 0.6; c.stroke();
  }
  c.fillStyle = P.mut; c.font = '10px system-ui, sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'top';
  c.fillText(pick(S.sTriso, lang), cx, y + h - 14);
  c.fillText('Ø ' + (2 * R[R.length - 1] * 1e4).toFixed(0) + ' µm', cx, y + h - 3);
  c.restore();
}

function drawIso(c, w, h, res, lib, st, lang, S) {
  var P = palette();
  c.clearRect(0, 0, w, h);
  if (!res) return;
  var ent = lib.entries[st.entry];
  var names = ['U235', 'Pu239', 'Pu240', 'Pu241', 'U233', 'Pa233'];
  var series = [], maxY = 1e-6;
  var xmax = res.curve[res.curve.length - 1].B;
  names.forEach(function (n, idx) {
    var pts = [];
    for (var i = 0; i < res.curve.length; i++) {
      var B = res.curve[i].B;
      var v = CoreScope.nominalAt(ent, st.e, B).iso[n];
      if (v === undefined) return;
      pts.push([B, v * 100]);
      if (v * 100 > maxY) maxY = v * 100;
    }
    var top = 0;
    pts.forEach(function (q) { if (q[1] > top) top = q[1]; });
    /* a nuclide the chain carries but this fuel never makes (U233 in a uranium
       lattice) drew a flat line on the axis and still took a legend row */
    if (top < 0.02) return;
    series.push({ name: n, pts: pts, colour: P.ser[idx % P.ser.length] });
  });
  if (!series.length) return;
  var ax = Axes(c, w, h, { xmin: 0, xmax: xmax, ymin: 0, ymax: maxY * 1.1,
                           xlabel: pick(S.axBurnup, lang), ylabel: pick(S.axIso, lang) });
  series.forEach(function (s) { line(c, ax, s.pts, s.colour, 1.8); });
  c.save(); c.font = '11px system-ui, sans-serif'; c.textBaseline = 'middle';
  series.forEach(function (s, i) {
    var y = ax.y1 + 10 + i * 14;
    c.fillStyle = s.colour; c.fillRect(ax.x1 - 78, y - 1.5, 12, 3);
    c.fillStyle = P.mut; c.textAlign = 'left'; c.fillText(s.name, ax.x1 - 62, y);
  });
  c.restore();
}

/* ------------------------------------------------------------------- state */
var LIB = JSON.parse(document.getElementById('corescoping-library').textContent);
var LANG = 'en';
var LAST = null, WARN = [], LASTINP = null;
var stageCore = null, stageCycle = null, stagePower = null, stageCell = null, stageIso = null;
var APP = null, bareRender = null;

function entryDefaults(key) {
  var d = ENTRY[key], ent = LIB.entries[key];
  return {
    entry: key, e: d.e, R: d.R, H: d.H, refl: d.refl, sh: 182.88, n: d.n,
    power: 1.0, boron: 0, vd: null, tf: null, tc: null, tm: null, cf: 1, ing: 0,
    xaxis: 'burnup', oc: 0,
    u3o8: 60, conv: 55, swu: 150, fab: ent ? ent.fab : 300, tails: 0.25,
    pu: 0, th: 60, cap: 0.92, disc: 0.08, life: 60
  };
}
var state = entryDefaults('pwr');
var DEFAULTS = entryDefaults('pwr');
(function () {
  /* same rule as applyEntry, for the state the page opens with */
  var ent = LIB.entries[state.entry], have = (ent && ent.have) || [];
  if (have.length === 1) { state.e = have[0]; DEFAULTS.e = have[0]; }
  else if (have.length > 1) {
    state.e = DEFAULTS.e = Math.min(Math.max(state.e, have[0]), have[have.length - 1]);
  }
})();

function inputs() {
  return {
    entry: state.entry, enrich: Number(state.e),
    radius: Number(state.R), height: Number(state.H),
    reflector: Number(state.refl), shield: Number(state.sh),
    batches: Number(state.n), power: Number(state.power),
    boron: Number(state.boron) || 0,
    TfOverride: state.tf === null || state.tf === '' ? null : Number(state.tf),
    TcOverride: state.tc === null || state.tc === '' ? null : Number(state.tc),
    TmOverride: state.tm === null || state.tm === '' ? null : Number(state.tm),
    voidOverride: state.vd === null || state.vd === '' ? null : Number(state.vd),
    coolFrac: Number(state.cf), ingress: Number(state.ing), outOfCore: Number(state.oc) || 0,
    capacity: Number(state.cap), discount: Number(state.disc), lifetime: Number(state.life),
    costs: { u3o8: Number(state.u3o8), conv: Number(state.conv), swu: Number(state.swu),
             fab: Number(state.fab), tails: Number(state.tails), feed_assay: 0.711,
             conv_loss: 0.5, pu: Number(state.pu), th: Number(state.th), haleu: 19.75 }
  };
}

function compute() {
  var ent = LIB.entries[state.entry];
  WARN = [];
  if (!ent || !ent.cases || !ent.cases.length) { LAST = null; return null; }
  var inp = inputs();
  var have = ent.have || [];
  /* The answer is computed at an enrichment the library holds or brackets;
     outside that range it is computed at the nearest computed point. */
  if (have.length === 1) {
    if (Math.abs(inp.enrich - have[0]) > 1e-9) { inp.enrich = have[0]; WARN.push('wSingle'); }
  } else if (have.length > 1) {
    if (inp.enrich < have[0] - 1e-9) { inp.enrich = have[0]; WARN.push('wClamp'); }
    else if (inp.enrich > have[have.length - 1] + 1e-9) {
      inp.enrich = have[have.length - 1]; WARN.push('wClamp');
    }
  }
  LAST = CoreScope.run(LIB, inp);
  LASTINP = inp;          /* the inputs the answer on screen was computed from */
  if (!LAST) return null;
  LAST.powerCurve = CoreScope.powerCurve(LIB, inp, LAST.cycleBurnup * LAST.batches * 0.5);
  if (LAST.keff0 < 1) WARN.push('wSub');
  var lim = ent.bu_limit || 100;
  if (LAST.dischargeBurnup > lim) WARN.push('wBurnup');
  if (LAST.burnupUnbounded) WARN.push('wUnbound');
  else if (LAST.burnupBeyond > 0) WARN.push('wBeyond');
  if (Math.min(inp.radius, inp.height / 2) < 2.5 * LAST.M) WARN.push('wSmall');
  return LAST;
}

/* The worth of losing the coolant altogether, stated so it can be weighed:
   in pcm while the cell stays near critical, and as k itself once it does not,
   because (k-1)/k at k = 0.4 is a number no one reads as a reactivity. */
function fullLoss(co, lang) {
  var k = co.kVoidFull !== undefined ? co.kVoidFull : co.kCoolantVoided;
  var pcm = co.voidFull !== undefined ? co.voidFull : co.coolantVoided;
  if (pcm === undefined || pcm === null || !isFinite(pcm)) return null;
  var what = pick(co.voidFull !== undefined ? S.cVoid : S.cCoolDens, lang) + ' 100 %: ';
  if (k !== undefined && k < 0.9) return what + 'k = ' + num(k, 3, lang);
  return what + num(pcm, 0, lang) + ' pcm';
}

/* One place where a warning becomes text, so a record cannot carry the
   placeholder that the screen has already filled. */
function warnText(w, lang) {
  var t = pick(S[w], lang);
  if (w === 'wBurnup') {
    t = fill(t, { lim: num(((LIB.entries[state.entry] || {}).bu_limit) || 100, 0, lang) });
  }
  if (w === 'wClamp' && LAST) t = fill(t, { e: num(LAST.enrich, 3, lang) });
  if (w === 'wBeyond' && LAST && LAST.dischargeBurnup > 0) {
    t = fill(t, { p: num(100 * LAST.burnupBeyond / LAST.dischargeBurnup, 0, lang) });
  }
  return t;
}

/* -------------------------------------------------------------- formatting */
function loc(lang) {
  return { en: 'en-GB', uk: 'uk-UA', de: 'de-DE', nl: 'nl-NL', fr: 'fr-FR', es: 'es-ES', pl: 'pl-PL' }[lang] || 'en-GB';
}
function num(v, d, lang) {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  try { return Number(v).toLocaleString(loc(lang || LANG), { minimumFractionDigits: d, maximumFractionDigits: d }); }
  catch (e) { return Number(v).toFixed(d); }
}

function fill(s, vals) {
  return String(s).replace(/\{(\w+)\}/g, function (m, k) { return vals[k] === undefined ? m : String(vals[k]); });
}

/* one-sigma statistical uncertainty a coefficient inherits from the branch runs */
function unc(co, key, d) {
  var u = co.unc && co.unc[key];
  return (u && isFinite(u)) ? '± ' + num(u, d, LANG) + ' (1σ)' : null;
}

function results() {
  if (!LAST) {
    var e2 = LIB.entries[state.entry];
    if (!e2 || !e2.cases || !e2.cases.length) {
      return { verdict: { tone: 'warn', text: pick(S.wNoData, LANG) }, tiles: [] };
    }
    return null;
  }
  var r = LAST, lang = LANG;
  var verdict = null;
  if (WARN.indexOf('wSingle') >= 0) verdict = { tone: 'warn', text: warnText('wSingle', lang) };
  else if (WARN.indexOf('wSub') >= 0) verdict = { tone: 'bad', text: warnText('wSub', lang) };
  else if (WARN.indexOf('wUnbound') >= 0) verdict = { tone: 'warn', text: warnText('wUnbound', lang) };
  else if (WARN.indexOf('wBeyond') >= 0) verdict = { tone: 'warn', text: warnText('wBeyond', lang) };
  else if (WARN.indexOf('wBurnup') >= 0) verdict = { tone: 'warn', text: warnText('wBurnup', lang) };
  else if (WARN.indexOf('wSmall') >= 0) verdict = { tone: 'warn', text: pick(S.wSmall, lang) };
  else if (WARN.indexOf('wClamp') >= 0) verdict = { tone: 'warn', text: warnText('wClamp', lang) };
  var co = r.coef;
  var voidC = co.voidCoef !== undefined ? co.voidCoef : co.coolantDensity;
  var voidLabel = co.voidCoef !== undefined ? S.cVoid : S.cCoolDens;
  return {
    verdict: verdict,
    tiles: [
      { label: S.rKeff, value: r.keff0, precision: 4,
        tone: r.keff0 < 1 ? 'bad' : (r.keff0 > 1.35 ? 'warn' : null),
        hint: pick(S.rKinf, lang) + ' ' + num(r.kinf0, 4, lang) + ' ± ' + num(r.sigma * 1e5, 0, lang) + ' pcm' },
      { label: S.rCycle, value: r.cycleDays, unit: 'd', precision: 0,
        hint: num(r.cycleYears, 2, lang) + ' a · ' + pick(S.rResidence, lang) + ' ' + num(r.residenceDays, 0, lang) + ' d' },
      { label: S.rBurnup, value: r.dischargeBurnup, unit: 'MWd/kg', precision: 1,
        hint: pick(S.rPeak, lang) + ' ' + num(r.peakBurnup, 1, lang) + ' MWd/kg' },
      { label: S.rPower, value: r.powerMWt, unit: 'MW', precision: 1,
        hint: num(r.powerMWe, 1, lang) + ' MWe · ' + num(r.pdens, 1, lang) + ' W/cm³' },
      { label: S.rLcoe, value: r.fuelLcoe, unit: 'EUR/MWh', precision: 2,
        hint: pick(S.rFuelCost, lang) + ' ' + num(r.costs.sum / 1e6, 2, lang) + ' M€', headline: false },
      { label: S.cDoppler, value: co.doppler, unit: 'pcm/K', precision: 2,
        tone: co.doppler > 0 ? 'bad' : null, headline: false,
        hint: unc(co, 'doppler', 2) },
      { label: voidLabel, value: voidC, unit: 'pcm/%',
        precision: 1, tone: voidC > 0 ? 'bad' : null, headline: false,
        hint: [unc(co, co.voidCoef !== undefined ? 'voidCoef' : 'coolantDensity', 1), fullLoss(co, lang)]
              .filter(Boolean).join(' · ') },
      { label: S.rLeak, value: 100 * r.leakage, unit: '%', precision: 2, headline: false,
        hint: pick(S.rM, lang) + ' ' + num(r.M, 1, lang) + ' cm' },
      { label: S.rCritR,
        value: r.criticalRadius === null || r.criticalRadius === undefined ? null : r.criticalRadius,
        text: (r.criticalRadius === null || r.criticalRadius === undefined) ? '—' : undefined,
        unit: 'cm', precision: 0, headline: false,
        hint: (r.criticalRadius === null || r.criticalRadius === undefined)
              ? pick(S.rCritRNone, lang)
              : [fill(pick(S.rCritRHint, lang),

/* The Python export template.  It carries the resolved lattice tables for the
   state on screen and re-implements the same model in the same order. */
var PY_TEMPLATE = `#!/usr/bin/env python3
# -*- coding: utf-8 -*-
"""Reactor Core Scoping Studio — exported calculation.

Source:      https://tools.petrov.re/corescoping.html
Permalink:   __PERMALINK__
Build:       __STAMP__
Lattice data: __LIB__

What this script is
-------------------
The page computes with a lattice library: k-infinity and two-group constants
computed with OpenMC and ENDF/B-VIII.0 for the cell of the selected reactor
line, depleted at its own specific power, plus branch cases for fuel
temperature, coolant density or void, moderator temperature and soluble boron.
This file carries that library slice for the reactor line and enrichment on
screen — already interpolated in enrichment — and re-implements the rest of the
model: the two-group leakage eigenvalue, the feedback interpolation, the batch
discharge-burnup solver, the feedback coefficients and the fuel-cycle cost.

Equations
---------
  geometric buckling   B^2 = (2.405/(R+d))^2 + (pi/(H+2d))^2
  two-group k          k(B^2) = largest eigenvalue of A^-1 F, with
                       A = diag(Sa_g + Sout_g + D_g B^2) - Sin, F = chi (x) nuSf
  leakage              k_eff = k_inf(B) * k2(B^2)/k2(0)
  batch model          mean over i=1..n of rho(B_d i/n) = 0
  fuel cost            feed / conversion / SWU / fabrication, discounted

Validity
--------
Bare cylinder, no control rods, no burnable poison, no fuel shuffling. The
burnup axis is the range the library was depleted over; beyond it the curve is
continued linearly. Standard library only: python3 file.py runs it.
"""
import json
import math
import sys

MODEL = json.loads(r'''__PAYLOAD__''')
INPUTS = json.loads(r'''__INPUTS__''')
DISPLAYED = json.loads(r'''__DISPLAYED__''')

HOURS_PER_YEAR = 365.25 * 24
SHIELD_RHO = 4.0
PEAKING = 1.57 * 1.55


def clamp(v, a, b):
    return a if v < a else (b if v > b else v)


def eval_curve(xs, ys, x):
    """Piecewise-linear with linear extrapolation from the end pair."""
    n = len(xs)
    if n == 1:
        return ys[0]
    if x <= xs[0]:
        return ys[0] + (ys[1] - ys[0]) * (x - xs[0]) / (xs[1] - xs[0])
    for i in range(1, n):
        if x <= xs[i]:
            f = (x - xs[i - 1]) / (xs[i] - xs[i - 1])
            return ys[i - 1] + f * (ys[i] - ys[i - 1])
    return ys[n - 1] + (ys[n - 1] - ys[n - 2]) * (x - xs[n - 1]) / (xs[n - 1] - xs[n - 2])


def _pchip_derivs(xs, ys):
    n = len(xs)
    h = [xs[i + 1] - xs[i] for i in range(n - 1)]
    s = [(ys[i + 1] - ys[i]) / h[i] for i in range(n - 1)]
    d = [0.0] * n
    if n == 2:
        return [s[0], s[0]]
    for i in range(1, n - 1):
        if s[i - 1] * s[i] <= 0:
            d[i] = 0.0
        else:
            w1 = 2 * h[i] + h[i - 1]
            w2 = h[i] + 2 * h[i - 1]
            d[i] = (w1 + w2) / (w1 / s[i - 1] + w2 / s[i])
    d[0] = ((2 * h[0] + h[1]) * s[0] - h[0] * s[1]) / (h[0] + h[1])
    if d[0] * s[0] <= 0:
        d[0] = 0.0
    elif s[0] * s[1] <= 0 and abs(d[0]) > abs(3 * s[0]):
        d[0] = 3 * s[0]
    e = n - 1
    d[e] = ((2 * h[e - 1] + h[e - 2]) * s[e - 1] - h[e - 1] * s[e - 2]) / (h[e - 1] + h[e - 2])
    if d[e] * s[e - 1] <= 0:
        d[e] = 0.0
    elif s[e - 1] * s[e - 2] <= 0 and abs(d[e]) > abs(3 * s[e - 1]):
        d[e] = 3 * s[e - 1]
    return d


def lagrange(pts, x):
    """Monotone cubic (Fritsch-Carlson) interpolation of the branch samples,
    continued linearly with the end derivative outside the sample span."""
    n = len(pts)
    if n == 1:
        return pts[0][1]
    xs = [p[0] for p in pts]
    ys = [p[1] for p in pts]
    d = _pchip_derivs(xs, ys)
    if x <= xs[0]:
        return ys[0] + d[0] * (x - xs[0])
    if x >= xs[n - 1]:
        return ys[n - 1] + d[n - 1] * (x - xs[n - 1])
    for i in range(1, n):
        if x <= xs[i]:
            h = xs[i] - xs[i - 1]
            t = (x - xs[i - 1]) / h
            t2 = t * t
            t3 = t2 * t
            return ((2 * t3 - 3 * t2 + 1) * ys[i - 1] + (t3 - 2 * t2 + t) * h * d[i - 1]
                    + (-2 * t3 + 3 * t2) * ys[i] + (t3 - t2) * h * d[i])
    return ys[n - 1]


def k2(g, b2):
    """Two-group k for buckling b2; group 1 is fast."""
    D1, D2, Sa1, Sa2, S12, S21, nSf1, nSf2, chi1 = g
    chi2 = 1.0 - chi1
    A11 = Sa1 + S12 + D1 * b2
    A12 = -S21
    A21 = -S12
    A22 = Sa2 + S21 + D2 * b2
    det = A11 * A22 - A12 * A21
    if det <= 0:
        return 0.0
    i11, i12 = A22 / det, -A12 / det
    i21, i22 = -A21 / det, A11 / det
    m11 = i11 * chi1 * nSf1 + i12 * chi2 * nSf1
    m22 = i21 * chi1 * nSf2 + i22 * chi2 * nSf2
    return m11 + m22


def migration_area(g):
    D1, D2, Sa1, Sa2, S12 = g[0], g[1], g[2], g[3], g[4]
    return D1 / (Sa1 + S12) + (D2 / Sa2 if Sa2 > 0 else 0.0)


def nominal_at(B):
    c = MODEL["curve"]
    k = eval_curve(c["bu"], c["k"], B)
    g = [eval_curve(c["bu"], [row[j] for row in c["g2"]], B) for j in range(9)]
    return k, g


def axis_delta(tag, ax, x):
    pts = ax["pts"]
    xx = math.sqrt(max(x, 1.0)) if ax["coord"] == "sqrt" else x
    samples = sorted(((math.sqrt(p[0]) if ax["coord"] == "sqrt" else p[0], p[1], p[2]) for p in pts),
                     key=lambda s: s[0])
    nom = MODEL["tags"][tag]["nom"]
    dk = lagrange([(s[0], s[1]) for s in samples], xx) - nom["k"]
    dg = [lagrange([(s[0], s[2][j]) for s in samples], xx) - nom["g2"][j] for j in range(9)]
    return dk, dg


def feedback(B, phys):
    """Per-axis blend of the fresh and depleted branch sets; an axis that was
    only run fresh keeps its fresh value instead of fading to zero."""
    per = {"BOL": {}, "MOL": {}}
    bu = {}
    for tag in ("BOL", "MOL"):
        t = MODEL["tags"].get(tag)
        if not t:
            per[tag] = None
            continue
        bu[tag] = t["bu"]
        nom = t["nom"]
        for ax in t["axes"]:
            x = phys.get(ax["id"])
            if x is None or len(ax["pts"]) < 2:
                continue
            dk, dg = axis_delta(tag, ax, x)
            per[tag][ax["id"]] = (dk, dg)
        bor = t.get("boron")
        if bor and phys.get("boron"):
            dkb = bor["k"] - nom["k"]
            dgb = [bor["g2"][j] - nom["g2"][j] for j in range(9)]
            w = bor.get("warm")
            if w and phys.get("Tc") is not None:
                dkw = w["k"] - w["mk"]
                fT = (phys["Tc"] - bor["Tc_nom"]) / (w["Tc"] - bor["Tc_nom"])
                dkb = dkb + fT * (dkw - dkb)
            s = phys["boron"] / 1000.0
            per[tag]["boron"] = (s * dkb, [s * v for v in dgb])
    if per["BOL"] is None:
        return 0.0, [0.0] * 9
    fB = clamp(B / max(bu.get("MOL", 1e-6), 1e-6), 0.0, 1.0) if per["MOL"] is not None else 0.0
    dk = 0.0
    dg = [0.0] * 9
    for key, (a, b) in per["BOL"].items():
        m = per["MOL"].get(key) if per["MOL"] is not None else None
        w = fB if m else 0.0
        dk += a + ((m[0] - a) * w if m else 0.0)
        for j in range(9):
            dg[j] += b[j] + ((m[1][j] - b[j]) * w if m else 0.0)
    return dk, dg


def buckling():
    R = INPUTS["radius"] + INPUTS["reflector"]
    H = INPUTS["height"] + 2 * INPUTS["reflector"]
    return (2.405 / R) ** 2 + (math.pi / H) ** 2


def critical_radius(phys, B):
    """Radius at which this core is exactly critical on fresh fuel, keeping the
    height-to-diameter ratio of the core on the page."""
    hd = INPUTS["height"] / (2.0 * INPUTS["radius"])

    def k(R):
        Rr = R + INPUTS["reflector"]
        Hh = 2.0 * R * hd + 2 * INPUTS["reflector"]
        b2 = (2.405 / Rr) ** 2 + (math.pi / Hh) ** 2
        return keff(B, phys, b2)[0]

    lo, hi = 10.0, 4000.0
    if not k(hi) > 1:
        return None
    if k(lo) > 1:
        return lo
    for _ in range(50):
        m = 0.5 * (lo + hi)
        if k(m) > 1:
            hi = m
        else:
            lo = m
    return 0.5 * (lo + hi)


def keff(B, phys, b2):
    k, g = nominal_at(B)
    dk, dg = feedback(B, phys)
    g = [g[j] + dg[j] for j in range(9)]
    kinf = k + dk
    r = k2(g, b2) / max(k2(g, 0.0), 1e-9)
    return kinf * r, kinf, g, r


# How far past the last computed burnup point the batch solve may look; the
# curve there is the linear continuation of its last computed segment.
BEYOND = 1.6


def batch_burnup(phys, b2, n, bmax):
    def rho(B):
        k = keff(B, phys, b2)[0]
        return (k - 1) / k
    if n <= 1:
        f = lambda B: keff(B, phys, b2)[0] - 1
        if f(0.0) <= 0:
            return 0.0
        hi = bmax * BEYOND
        if f(hi) > 0:
            return hi
        lo = 0.0
        for _ in range(60):
            mid = 0.5 * (lo + hi)
            if f(mid) > 0:
                lo = mid
            else:
                hi = mid
        return 0.5 * (lo + hi)
    mean = lambda Bd: sum(rho(Bd * i / n) for i in range(1, n + 1)) / n
    lo, hi = 0.0, bmax * BEYOND
    if mean(hi) > 0:
        return hi
    if mean(1e-6) < 0:
        return 0.0
    for _ in range(60):
        mid = 0.5 * (lo + hi)
        if mean(mid) > 0:
            lo = mid
        else:
            hi = mid
    return 0.5 * (lo + hi)


def vx(x):
    xn = x / 100.0
    return (1 - 2 * xn) * math.log((1 - xn) / xn)


def fuel_cost(mt_hm):
    c = INPUTS["costs"]
    kg = mt_hm * 1000.0
    out = {"feed": 0.0, "conv": 0.0, "swu": 0.0, "fab": kg * c["fab"], "pu": 0.0, "th": 0.0,
           "feedMass": None}
    if MODEL["axis"] == "pu":
        out["pu"] = kg * (INPUTS["enrich"] / 100.0) * 1000.0 * c["pu"]
    else:
        if MODEL["axis"] == "u235hm":
            prod = kg * (INPUTS["enrich"] / 100.0) / (c["haleu"] / 100.0)
            enr = c["haleu"]
            out["th"] = (kg - prod) * c["th"]
        else:
            prod = kg
            enr = INPUTS["enrich"]
        if enr > c["tails"]:
            ff = (enr - c["tails"]) / (c["feed_assay"] - c["tails"])
            sf = vx(enr) - vx(c["tails"]) - ff * (vx(c["feed_assay"]) - vx(c["tails"]))
            uf6 = ff * prod
            feed_mass = uf6 / ((100.0 - c["conv_loss"]) / 100.0)
            out["swu"] = sf * prod * c["swu"]
            out["conv"] = uf6 * c["conv"]
            out["feed"] = feed_mass * c["u3o8"] * 2.2046 / 0.847981
            out["feedMass"] = feed_mass
        else:
            out["feed"] = prod * c["u3o8"] * 2.2046 / 0.847981
            out["feedMass"] = prod
    out["sum"] = out["feed"] + out["conv"] + out["swu"] + out["fab"] + out["pu"] + out["th"]
    return out


def lcoe(initial, reload_cost, cycle_years, mwh_per_year, rate, lifetime):
    npv_f, npv_e = initial, 0.0
    for y in range(0, lifetime + 1):
        n = 0 if y == 0 else (int(y / cycle_years) - int((y - 1) / cycle_years))
        npv_f += n * reload_cost / (1 + rate) ** y
        npv_e += mwh_per_year / (1 + rate) ** y
    return npv_f / npv_e if npv_e > 0 else 0.0


def coefficients(phys, b2, B):
    def k_at(**mod):
        p = dict(phys)
        p.update(mod)
        return keff(B, p, b2)[0]

    def rho(k):
        return (k - 1) / k

    out = {}
    present = set()
    for ax in MODEL["tags"]["BOL"]["axes"]:
        if len(ax["pts"]) >= 2:
            present.add(ax["id"])
    dT = 25.0
    k0 = k_at()
    out["doppler"] = 1e5 * (rho(k_at(Tf=phys["Tf"] + dT)) - rho(k_at(Tf=phys["Tf"] - dT))) / (2 * dT)
    if phys.get("Tc") is not None and "Tc" in present:
        out["coolantT"] = 1e5 * (rho(k_at(Tc=phys["Tc"] + dT)) - rho(k_at(Tc=phys["Tc"] - dT))) / (2 * dT)
    if phys.get("Tm") is not None and "Tm" in present:
        out["moderatorT"] = 1e5 * (rho(k_at(Tm=phys["Tm"] + dT)) - rho(k_at(Tm=phys["Tm"] - dT))) / (2 * dT)
    if phys.get("void") is not None and "void" in present:
        hi, lo = clamp(phys["void"] + 5, 0, 100), clamp(phys["void"] - 5, 0, 100)
        out["voidCoef"] = 1e5 * (rho(k_at(void=hi)) - rho(k_at(void=lo))) / (hi - lo)
        out["voidFull"] = 1e5 * (rho(k_at(void=100.0)) - rho(k0))
    if phys.get("cool") is not None and "cool" in present:
        # per cent of the nominal coolant density, not per unit fraction\n        out["coolantDensity"] = 1e5 * (rho(k_at(cool=phys["cool"] - 0.1)) - rho(k_at(cool=phys["cool"] + 0.1))) / 0.2 / 100
        out["coolantVoided"] = 1e5 * (rho(k_at(cool=0.0)) - rho(k0))
    if phys.get("fs") is not None and "fs" in present:
        out["saltDensity"] = 1e5 * (rho(k_at(fs=phys["fs"] - 0.02)) - rho(k_at(fs=phys["fs"] + 0.02))) / 0.04 / 100
    if "ingress" in present:
        d1 = 0.002
        out["ingress"] = 1e5 * (rho(k_at(ingress=(phys.get("ingress") or 0) + d1)) - rho(k0)) / (d1 * 1000)
    if MODEL["tags"]["BOL"].get("boron"):
        out["boron"] = 1e5 * (rho(k_at(boron=(phys.get("boron") or 0) + 100)) - rho(k0)) / 100.0
    return out


def compute():
    phys = dict(MODEL["phys"])
    b2 = buckling()
    bmax = MODEL["bmax"]
    n = max(1, int(round(INPUTS["batches"])))
    Bd = batch_burnup(phys, b2, n, bmax)
    Bc = Bd / n
    volume = math.pi * INPUTS["radius"] ** 2 * INPUTS["height"]
    pdens = MODEL["pdens"] * INPUTS["power"]
    power_mwt = volume * pdens / 1e6
    oc = max(0.0, min(0.8, INPUTS.get("outOfCore") or 0.0))
    mt_hm = volume * MODEL["hm"] / 1e6 / (1 - oc)
    spw = MODEL["spw"] * INPUTS["power"] * (1 - oc)
    cycle_days = Bc * 1000.0 / spw if spw > 0 else 0.0

    k_eoc = keff(Bd, phys, b2)[0]
    excess = sum(((lambda k: (k - 1) / k)(keff(i * Bc, phys, b2)[0]) for i in range(n))) / n
    co = coefficients(phys, b2, Bc * 0.5 * n)
    costs = fuel_cost(mt_hm)
    mwh = power_mwt * MODEL["eta"] * INPUTS["capacity"] * HOURS_PER_YEAR
    lifetime = max(1, int(math.floor(math.ceil(INPUTS["lifetime"] / max(cycle_years, 1e-3)) * max(cycle_years, 1e-3))))
    fuel_lcoe = lcoe(costs["sum"], costs["sum"] / n, cycle_years, mwh, INPUTS["discount"], lifetime) if cycle_years > 0 else 0.0
    th = INPUTS["shield"]
    shield_vol = (math.pi * ((INPUTS["radius"] + th) ** 2 - INPUTS["radius"] ** 2) * INPUTS["height"]
                  + 2 * math.pi * (INPUTS["radius"] + th) ** 2 * th)
    out = {
        "k_eff_boc": k_boc, "k_inf_boc": kinf_boc, "leakage_fraction": 1 - pnl,
        "migration_length_cm": math.sqrt(migration_area(g_boc)),

        "burnup_beyond_computed_curve_MWd_per_kg": max(0.0, Bd - bmax),
        "burnup_computed_to_MWd_per_kg": bmax,
        "thermal_power_MW": power_mwt, "electric_power_MW": power_mwt * MODEL["eta"],
        "heavy_metal_t": mt_hm, "fissile_t": mt_hm * INPUTS["enrich"] / 100.0,
        "specific_power_W_per_g": spw,
        "excess_reactivity_pcm": 1e5 * excess,
        "reactivity_swing": (1 - 1 / k_boc) - (1 - 1 / k_eoc),
        "fuel_cost_first_core_EUR": costs["sum"], "fuel_lcoe_EUR_per_MWh": fuel_lcoe,
        "shield_mass_t": shield_vol * SHIELD_RHO / 1e6,
        "doppler_pcm_per_K": co["doppler"],
    }
    crit = critical_radius(phys, 0.0)
    if crit is not None:
        out["critical_radius_cm"] = crit
    if "coolantT" in co:
        out["coolant_temperature_pcm_per_K"] = co["coolantT"]
    if "moderatorT" in co:
        out["moderator_temperature_pcm_per_K"] = co["moderatorT"]
    if "voidCoef" in co:
        out["void_pcm_per_percent"] = co["voidCoef"]
        out["void_full_pcm"] = co["voidFull"]
    if "coolantDensity" in co:
        out["coolant_loss_pcm_per_percent_lost"] = co["coolantDensity"]
        out["coolant_voided_pcm"] = co["coolantVoided"]
    if "saltDensity" in co:

        out["mining_intensity_gU_per_MWh"] = costs["feedMass"] * 1000.0 / (mwh * cycle_years * n)

def selftest(values, tol=2e-5):
    bad = []
    checked = 0
    for key, ref in DISPLAYED.items():
        if key not in values or not isinstance(ref, (int, float)):
            continue
        got = values[key]
        checked += 1
        scale = max(abs(ref), 1e-9)
        if abs(got - ref) / scale > tol:
            bad.append("%s: %.10g vs %.10g" % (key, got, ref))
    if bad:
        raise AssertionError("self-test failed for %d of %d values:\\n  " % (len(bad), checked)
                             + "\\n  ".join(bad))
    return checked

    interpolation: 'internal_property',
    unit_closure: 'internal_property',
    htgr_rpt: 'recorded_calculation',
    one_group_comparison: 'diagnostic'

  (function () {
