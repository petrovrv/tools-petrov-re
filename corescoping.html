    var got = CoreScope.lcoe(initial, reload, 1, mwh, rate, life);
    var npvF = initial, npvE = 0, y;
    for (y = 1; y <= life; y++) npvF += reload / Math.pow(1 + rate, y);
    for (y = 0; y <= life; y++) npvE += mwh / Math.pow(1 + rate, y);
    finish({
      id: 'lcoe_series/annual_reload', family: 'lcoe_series', graded: true,
      inputs: { initial: initial, reload: reload, cycle_years: 1, generation_MWh_per_year: mwh,
                discount_rate: rate, lifetime_years: life },
      checks: [chk('levelised fuel cost', got, npvF / npvE, 1e-12, 'EUR/MWh')]
    });
  })();

  /* 6. the water table against IAPWS-IF97 ---------------------------------- */
  (function () {
    var REF = {
      '15.5': [[320, 0.99604], [380, 0.96052], [420, 0.92812], [470, 0.87837], [520, 0.81602],
               [555, 0.76104], [575, 0.72266]],
      '6.9': [[320, 0.99238], [380, 0.95654], [420, 0.92350], [470, 0.87232], [520, 0.80702],
              [555, 0.74749]],
      '11.0': [[320, 0.99413], [380, 0.95845], [420, 0.92572], [470, 0.87524], [520, 0.81141],
               [555, 0.75421], [575, 0.71329]]
    };
    Object.keys(REF).forEach(function (p) {
      var checks = [];
      REF[p].forEach(function (row) {
        checks.push(chk('rho(' + row[0] + ' K)', CoreScope.waterRho(Number(p), row[0]), row[1], 2e-3, 'g/cm3'));
      });
      finish({
        id: 'water_iapws/' + p + 'MPa', family: 'water_iapws', graded: true, ref_source: 'recorded',
        inputs: { pressure_MPa: Number(p), temperatures_K: REF[p].map(function (r) { return r[0]; }) },
        checks: checks
      });
    });
  })();

  /* 7. the branch interpolation reproduces its samples --------------------- */
  (function () {
    var ent = null, key = null;
    Object.keys(LIB.entries).forEach(function (k2k) {
      if (!ent && LIB.entries[k2k].cases && LIB.entries[k2k].cases.length) { ent = LIB.entries[k2k]; key = k2k; }
    });
    if (!ent) return;
    var g = ent.cases[0].br.BOL.s.nom.g2;
    /* nodes are reproduced exactly and a monotone sample stays monotone */
    var pts = [[0, 1.30], [58, 1.15], [100, 0.58]], i, worstNode = 0, overshoot = 0, prev = Infinity;
    for (i = 0; i < pts.length; i++) {
      worstNode = Math.max(worstNode, Math.abs(CoreScope.interp(pts, pts[i][0]) - pts[i][1]));
    }
    for (i = 0; i <= 200; i++) {
      var x = 100 * i / 200, y = CoreScope.interp(pts, x);
      if (y > 1.30 + 1e-12 || y < 0.58 - 1e-12) overshoot = Math.max(overshoot, 1);
      if (y > prev + 1e-12) overshoot = Math.max(overshoot, 1);
      prev = y;
    }
    finish({
      id: 'interpolation/nodes_and_monotonicity', family: 'interpolation', graded: true,
      inputs: { samples: pts, probe_points: 201 },
      checks: [chk('largest node error', worstNode, 0, 1e-12),
               chk('monotonicity violations', overshoot, 0, 1e-12)]
    });
  })();

  /* 8. the HTGR homogenisation against the explicit TRISO lattice ---------- */
  [[8.0, 1.29846, 1.29496, 0.0023, 0.0016], [15.5, 1.35780, 1.35193, 0.0026, 0.0014]].forEach(function (r) {
    finish({
      id: 'htgr_rpt/e=' + r[0], family: 'htgr_rpt', graded: true, ref_source: 'recorded',
      inputs: { enrichment_percent: r[0], rpt_radius_cm: 0.475, packing_fraction: 0.35,
                explicit_sigma: r[3], homogenised_sigma: r[4] },
      checks: [chk('k-infinity of the homogenised cell', r[2], r[1], 0.01)]

  function eDefault(ent, e) {

    if (!have.length) return Number(e);

      var d = entryDefaults(key);

        entry: key, enrich: eDefault(ent, d.e),
        radius: Number(d.R), height: Number(d.H), reflector: Number(d.refl), shield: Number(d.sh),
        batches: Number(d.n), power: 1, boron: 0,

        coolFrac: 1, ingress: 0, outOfCore: Number(d.oc) || 0,
        capacity: Number(d.cap), discount: Number(d.disc), lifetime: Number(d.life),
        costs: { u3o8: d.u3o8, conv: d.conv, swu: d.swu, fab: d.fab, tails: d.tails,
                 feed_assay: 0.711, conv_loss: 0.5, pu: d.pu, th: d.th, haleu: 19.75 }
      };
      var r = CoreScope.run(LIB, inp);
      if (!r || !isFinite(r.cycleDays) || r.cycleDays <= 0) return;
      finish({
        id: 'unit_closure/' + key, family: 'unit_closure', graded: true,
        inputs: { entry: key, enrichment_percent: inp.enrich, radius_cm: inp.radius,
                  height_cm: inp.height, batches: inp.batches,
                  heavy_metal_t: r.mtHM, thermal_power_MW: r.powerMWt,
                  cycle_burnup_MWd_per_kg: r.cycleBurnup },
        checks: [
          chk('cycle length from mass and power', r.cycleDays,
              r.cycleBurnup * r.mtHM * 1000 / r.powerMWt, 1e-4, 'd'),
          chk('k-effective as k-infinity times non-leakage', r.keff0, r.kinf0 * r.pnl, 1e-12)
        ]
      });
    });
  })();

  /* 9. diagnostics: leakage against the one-group form (no criterion) ------ */
  Object.keys(LIB.entries).forEach(function (key) {
    var ent = LIB.entries[key];
    if (!ent.cases || !ent.cases.length) return;
    var g = ent.cases[0].br.BOL.s.nom.g2, B2 = 1e-4;
    var two = CoreScope.k2(g, B2) / CoreScope.k2(g, 0);

      id: 'one_group_comparison/' + key, family: 'one_group_comparison', graded: false,
      status: 'info', ref_kind: 'diagnostic',

      checks: [{ check: 'non-leakage, two-group', got: two, ref: one, tol: null,
                 rel: Math.abs(two - one) / one, note: 'the single migration area is the small-buckling limit of the two-group form; the spread is what the two-group treatment adds' }],
      pass: null

  });

  return cases;
}

                        : fill(P('wBurnup'), { lim: num(buLim, 0, lang) }) });
  checks.push({ status: co.doppler < 0 ? 'pass' : 'fail', title: P('chkDoppler'),
                actual: num(co.doppler, 2, lang) + ' ± ' + num((co.unc && co.unc.doppler) || 0, 2, lang) + ' pcm/K',
                criterion: '< 0 pcm/K' });
  var vc = co.voidCoef !== undefined ? co.voidCoef : co.coolantDensity;
  if (vc !== undefined) {
    checks.push({ status: vc < 0 ? 'pass' : 'attention',
                  title: P('chkVoidSign'), actual: num(vc, 1, lang) + ' pcm/%', criterion: '< 0 pcm/%' });
  }

  /* figures: the cell is the system drawing, the rest are results */
  var fCell = ctx.figure(figure(function (c, w, h) { drawCell(c, w, h, state.entry, lang, S); }, 520, 300),
                         { caption: P('sCell') });
  var fCore = ctx.figure(figure(function (c, w, h) { drawCore(c, w, h, r, state, lang); }, 640, 320),
                         { caption: P('sCore') });
  var fCycle = ctx.figure(figure(function (c, w, h) { drawCycle(c, w, h, r, state, lang, S); }, 640, 330),
                          { caption: P('sCycle') });
  var fPower = ctx.figure(figure(function (c, w, h) { drawPower(c, w, h, r, r.powerCurve, lang, S); }, 700, 300),
                          { caption: P('sPower') });
  var fIso = ctx.figure(figure(function (c, w, h) {
                            drawIso(c, w, h, r, LIB, { entry: state.entry, e: r.enrich }, lang, S);
                          }, 640, 300), { caption: P('sIso') });
  [fCore, fCycle, fPower, fIso].forEach(function (f) { if (f) figs.push(f); });

  var inp = rec.inputs, g = function (k) { return pick(S[k], lang); };
  var inputs = [
    { label: g('fRadius'), value: inp.core_radius_cm, unit: 'cm', group: g('gGeom') },
    { label: g('fHeight'), value: inp.core_height_cm, unit: 'cm', group: g('gGeom') },
    { label: g('fRefl'), value: inp.reflector_saving_cm, unit: 'cm', group: g('gGeom') },
    { label: g('fShield'), value: inp.shield_thickness_cm, unit: 'cm', group: g('gGeom') },
    { label: g('fEntry'), text: pick(ENTRY_NAME[state.entry], lang), group: g('gFuel') },
    { label: pick(AXIS_LABEL[(ent && ent.axis) || 'u235'], lang), value: inp.enrichment_percent, unit: '%', group: g('gFuel') },
    { label: g('fBatches'), value: inp.fuel_batches, group: g('gFuel') },
    { label: g('fRating'), value: inp.power_rating, group: g('gOps') },
    { label: g('fTf'), value: inp.fuel_temperature_K, unit: 'K', group: g('gOps') }
  ];
  if (inp.coolant_temperature_K != null) inputs.push({ label: g('fTc'), value: inp.coolant_temperature_K, unit: 'K', group: g('gOps') });
  if (inp.moderator_temperature_K != null) inputs.push({ label: g('fTm'), value: inp.moderator_temperature_K, unit: 'K', group: g('gOps') });
  if (inp.void_fraction_percent != null) inputs.push({ label: g('fVoid'), value: inp.void_fraction_percent, unit: '%', group: g('gOps') });
  if (inp.soluble_boron_ppm) inputs.push({ label: g('fBoron'), value: inp.soluble_boron_ppm, unit: 'ppm', group: g('gOps') });
  inputs.push({ label: g('eU3O8'), value: inp.uranium_price_EUR_per_lb_U3O8, unit: 'EUR/lb', group: g('gPrice') });
  inputs.push({ label: g('eConv'), value: inp.conversion_EUR_per_kg, unit: 'EUR/kg', group: g('gPrice') });
  inputs.push({ label: g('eSwu'), value: inp.swu_EUR, unit: 'EUR', group: g('gPrice') });
  inputs.push({ label: g('eFab'), value: inp.fabrication_EUR_per_kg, unit: 'EUR/kg', group: g('gPrice') });
  inputs.push({ label: g('eTails'), value: inp.tails_assay_percent, unit: '%', group: g('gPrice') });
  inputs.push({ label: g('eCap'), value: inp.capacity_factor, group: g('gPrice') });
  inputs.push({ label: g('eDisc'), value: inp.discount_rate, group: g('gPrice') });
  inputs.push({ label: g('eLife'), value: inp.plant_life_years, unit: 'a', group: g('gPrice') });

  return {
    title: pick(S.title, lang),
    executive: {
      text: [fill(pick(S.repExec, lang), {
                line: pick(ENTRY_NAME[rin.entry], lang), d: num(2 * rin.radius, 0, lang),
                h: num(rin.height, 0, lang), e: num(r.enrich, 3, lang),
                axis: pick(AXIS_LABEL[(ent && ent.axis) || 'u235'], lang),
                n: r.batches }),
             pick(S.repExec2, lang)],
      results: [
        { label: P('rKeff'), text: num(r.keff0, 4, lang) },
        row(P('rCycle'), r.cycleDays, 'd'),
        row(P('rBurnup'), r.dischargeBurnup, 'MWd/kg'),
        row(P('rPower'), r.powerMWt, 'MW'),
        row(P('rLcoe'), r.fuelLcoe, 'EUR/MWh'),
        row(P('cDoppler'), co.doppler, 'pcm/K')
      ]
    },
    system: { text: [pick(S.repSystem, lang)], figure: fCell },
    results: rows,
    checks: checks,
    figures: figs,
    method: {
      equations: [
        'B^2 = (2.405/(R+d))^2 + (pi/(H+2d))^2',
        'k(B^2): two-group eigenvalue of A^-1 F, A = diag(Sa_g + Sout_g + D_g B^2) - Sin, F = chi (x) nuSf',
        'k_eff(B) = k_inf(B) * k(B^2)/k(0)',
        'n batches: mean over i = 1..n of rho(B_d i/n) = 0',
        'fuel cost: feed + conversion + SWU + fabrication, discounted over the plant life'
      ],
      ranges: [
        pick(S.chkCover, lang) + ': ' + (have.length ? have.join(', ') + ' %' : '—'),
        pick(S.rBurnup, lang) + ': 0 – ' + num(r.bmax, 0, lang) + ' MWd/kg'
      ],
      notes: REC[lang] ? REC[lang].nt : REC.en.nt,
      references: [
        'P. K. Romano et al., "OpenMC: A state-of-the-art Monte Carlo code for research and development", Ann. Nucl. Energy 82 (2015) 90-97.',
        'D. A. Brown et al., "ENDF/B-VIII.0: The 8th Major Release of the Nuclear Reaction Data Library", Nucl. Data Sheets 148 (2018) 1-142.',
        'K. S. Kim, "Specification for the VERA Depletion Benchmark Suite", CASL-U-2015-1014-000 (ORNL/TM-2016/53) - the depletion chain used here.',
        'Y. Kim, M. S. Yang et al., "Reactivity-equivalent physical transformation for elimination of double-heterogeneity", Trans. Am. Nucl. Soc. (2005) - the HTGR homogenisation.',
        'F. N. Fritsch, R. E. Carlson, "Monotone Piecewise Cubic Interpolation", SIAM J. Numer. Anal. 17 (1980) 238-246 - the branch interpolation.',
        'M. J. Driscoll, T. J. Downar, E. E. Pilat, "The Linear Reactivity Model for Nuclear Fuel Management", ANS (1990) - the batch model.'
      ]
    },
    inputs: inputs
  };
}

/* ------------------------------------------------------------------ init */
function dgcInit() {
  if (!window.Diagram || !Diagram.init) return;
  Diagram.init({
    id: 'corescoping', file: 'corescoping.html', title: pick(S.title, LANG),
    state: { serialize: dgcSerialize, deserialize: dgcDeserialize },
    record: dgcRecord,
    python: dgcPython,
    handoff: { provides: ['rho_reac', 'T', 'Q'], accepts: ['T', 'Q'],
               build: handoffBuild, apply: handoffApply },
    report: { profile: reportProfile }
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
window.__corescoping = { state: state, run: function () { return compute(); },
                         get last() { return LAST; }, lib: LIB, core: CoreScope,
                         python: dgcPython, record: dgcRecord, results: function () { return results(); } };

</script>
</body>
