        "reference": {
          "en": "38 buildings solved on the page against an independent Python implementation of the published method: the six presets, eight variants of the apartment block (flush share, heat pump, prices, temperatures, greywater, occupancy, days) and fourteen further cases (small office with waterless urinals that never pay back, 1-litre urinals, kept timed cisterns, a school without urinals, hotel baths, long showers, kitchen fill, greywater deficit and old WCs, industrial, hospital, retail, restaurant, zero investment), seven run-2 cases (a worse product at no cost, free waterless urinals at a loss, a row with 0 pieces, one class split over two rows, a single timed bowl, no measure, free greywater at a loss), three round-4 inventory cases (mixed shower heads, an office with two urinal types, a school without urinals — the conversion of the fixture inventory into rows is checked) — consistency with the method plus 14 external anchors worked by hand (EU Ecolabel 2013/641/EU flush volumes and criterion 1, UK WSR 1999 urinal cisterns, heat of water, one office case, the mixed inventories), 14/14 pass.",
          "uk": "38 будівель, розрахованих на сторінці, порівняно з незалежною реалізацією опублікованого методу на Python: шість прикладів, вісім варіантів житлового будинку (частка повних зливів, тепловий насос, ціни, температури, сіра вода, заповненість, дні) і ще чотирнадцять випадків (малий офіс із безводними пісуарами, що не окупаються, пісуари на 1 л, залишені бачки з таймером, школа без пісуарів, ванни в готелі, довгий душ, наповнення на кухні, нестача сірої води і старі унітази, промисловість, лікарня, торгівля, ресторан, нульові інвестиції), сім випадків другого раунду (гірший виріб без витрат, безкоштовні безводні пісуари зі збитком, рядок із 0 шт., клас у двох рядках, один пісуар із таймером, без заходів, безкоштовна сіра вода зі збитком), три випадки четвертого раунду з переліком приладів (змішані душові лійки, офіс із пісуарами двох типів, школа без пісуарів — перевіряється перетворення переліку приладів на рядки) — узгодженість із методом плюс 14 зовнішніх опорних значень, обчислених вручну (об’єми змиву і критерій 1 EU Ecolabel 2013/641/EU, бачки пісуарів UK WSR 1999, теплоємність води, один офісний приклад, змішані переліки приладів), 14/14 пройдено.",
          "de": "38 auf der Seite berechnete Gebäude gegen eine unabhängige Python-Umsetzung der veröffentlichten Methode: die sechs Beispiele, acht Varianten des Wohnblocks (Vollspülanteil, Wärmepumpe, Preise, Temperaturen, Grauwasser, Belegung, Tage) und vierzehn weitere Fälle (kleines Büro mit wasserlosen Urinalen ohne Amortisation, 1-Liter-Urinale, belassene Zeitspülkästen, Schule ohne Urinale, Hotelwannen, lange Duschen, Küchenfüllmenge, Grauwasser-Defizit und alte WCs, Industrie, Krankenhaus, Handel, Restaurant, Investition null), sieben Fälle aus Runde 2 (schlechteres Produkt ohne Kosten, kostenlose wasserlose Urinale mit Verlust, Zeile mit 0 Stück, eine Klasse in zwei Zeilen, ein einzelnes Zeitspülbecken, keine Maßnahme, kostenloses Grauwasser mit Verlust), drei Fälle aus Runde 4 mit Objektbestand (gemischte Brausen, Büro mit zwei Urinaltypen, Schule ohne Urinale — geprüft wird die Umwandlung des Objektbestands in Zeilen) — Konsistenz mit der Methode plus 14 von Hand gerechnete externe Ankerwerte (Spülmengen und Kriterium 1 EU Ecolabel 2013/641/EU, Urinalspülkästen UK WSR 1999, Wärme des Wassers, ein Bürofall, gemischte Objektbestände), 14/14 bestanden.",
          "nl": "38 gebouwen berekend op de pagina tegen een onafhankelijke Python-implementatie van de gepubliceerde methode: de zes voorbeelden, acht varianten van het appartementsgebouw (aandeel volle spoelingen, warmtepomp, prijzen, temperaturen, grijswater, bezetting, dagen) en veertien andere gevallen (klein kantoor met waterloze urinoirs die zich nooit terugverdienen, urinoirs van 1 liter, behouden getimede reservoirs, school zonder urinoirs, hotelbaden, lange douches, keukenvulling, grijswatertekort en oude toiletten, industrie, ziekenhuis, winkel, restaurant, investering nul), zeven gevallen uit ronde 2 (slechter product zonder kosten, gratis waterloze urinoirs met verlies, rij met 0 stuks, één klasse over twee rijen, één getimed urinoir, geen maatregel, gratis grijswater met verlies), drie gevallen uit ronde 4 met een toestelinventaris (gemengde douchekoppen, kantoor met twee soorten urinoirs, school zonder urinoirs — de omzetting van de inventaris naar rijen wordt gecontroleerd) — consistentie met de methode plus 14 met de hand berekende externe ankers (spoelvolumes en criterium 1 EU Ecolabel 2013/641/EU, urinoirreservoirs UK WSR 1999, warmte van water, één kantoorgeval, gemengde inventarissen), 14/14 geslaagd.",
          "fr": "38 bâtiments calculés sur la page face à une implémentation Python indépendante de la méthode publiée : les six exemples, huit variantes de l’immeuble de logements (part de chasses pleines, PAC, prix, températures, eaux grises, occupation, jours) et quatorze autres cas (petit bureau avec urinoirs sans eau jamais rentables, urinoirs 1 litre, réservoirs temporisés conservés, école sans urinoirs, baignoires d’hôtel, douches longues, remplissage d’évier, déficit d’eaux grises et anciens WC, industrie, hôpital, commerce, restaurant, investissement nul), sept cas du deuxième tour (produit moins bon sans coût, urinoirs sans eau gratuits à perte, ligne à 0 pièce, classe sur deux lignes, un seul urinoir temporisé, aucune mesure, eaux grises gratuites à perte), trois cas du quatrième tour avec inventaire d’appareils (pommes de douche mixtes, bureau avec deux types d’urinoirs, école sans urinoirs — la conversion de l’inventaire en lignes est vérifiée) — cohérence avec la méthode plus 14 ancres externes calculées à la main (volumes de chasse et critère 1 EU Ecolabel 2013/641/EU, réservoirs d’urinoirs UK WSR 1999, chaleur de l’eau, un cas de bureau, inventaires mixtes), 14/14 réussies.",

  'f.lines.h': T7('Uses = per person and operating day for the whole building; several rows of one class share these uses by their number of pieces (a row with 0 pieces uses no water). The count also drives the investment, the running costs and timed urinal cisterns.', 'Використання — на особу за робочу добу для всієї будівлі; кілька рядків одного класу ділять ці використання пропорційно кількості штук (рядок із 0 шт. не споживає воду). Кількість також визначає інвестиції, експлуатаційні витрати та бачки пісуарів з таймером.', 'Nutzungen = je Person und Betriebstag für das ganze Gebäude; mehrere Zeilen einer Klasse teilen sich diese Nutzungen nach ihrer Stückzahl (eine Zeile mit 0 Stück verbraucht kein Wasser). Die Anzahl bestimmt außerdem Investition, Betriebskosten und zeitgesteuerte Urinalspülkästen.', 'Gebruik = per persoon en bedrijfsdag voor het hele gebouw; meerdere rijen van één klasse verdelen dit gebruik volgens hun aantal stuks (een rij met 0 stuks verbruikt geen water). Het aantal bepaalt ook de investering, de exploitatiekosten en getimede urinoirreservoirs.', 'Usages = par personne et jour d’exploitation pour tout le bâtiment ; plusieurs lignes d’une même classe se partagent ces usages selon leur nombre de pièces (une ligne à 0 pièce ne consomme pas d’eau). Le nombre fixe aussi l’investissement, les coûts d’exploitation et les réservoirs d’urinoirs temporisés.', 'Usos = por persona y día de uso para todo el edificio; varias filas de una misma clase se reparten estos usos según su número de unidades (una fila con 0 unidades no consume agua). El número también fija la inversión, los costes de explotación y las cisternas temporizadas de urinario.', 'Użycia = na osobę i dzień użytkowania dla całego budynku; kilka wierszy jednej klasy dzieli te użycia według liczby sztuk (wiersz z 0 szt. nie zużywa wody). Liczba wpływa też na nakład, koszty eksploatacji i spłuczki pisuarowe z zegarem.'),

  'n.gw': T7('Greywater: yield %y m³/a, flushing demand %d m³/a, used %u m³/a (%c % of the flushing); payback %p.', 'Сіра вода: вихід %y м³/рік, потреба на змив %d м³/рік, використано %u м³/рік (%c % змиву); окупність %p.', 'Grauwasser: Ertrag %y m³/a, Spülbedarf %d m³/a, genutzt %u m³/a (%c % der Spülung); Amortisation %p.', 'Grijswater: opbrengst %y m³/jaar, spoelvraag %d m³/jaar, gebruikt %u m³/jaar (%c % van de spoeling); terugverdientijd %p.', 'Eaux grises : production %y m³/an, besoin de chasse %d m³/an, utilisé %u m³/an (%c % des chasses) ; retour %p.', 'Aguas grises: producción %y m³/año, demanda de descarga %d m³/año, usada %u m³/año (%c % de las descargas); retorno %p.', 'Woda szara: uzysk %y m³/rok, zapotrzebowanie na spłukiwanie %d m³/rok, wykorzystano %u m³/rok (%c % spłukiwania); zwrot %p.'),
  'n.handoff': T7('After the measures: %h L/day of hot water (→ plbdhw) and %f L/day of flushing water still from the mains (→ plbrainwater).', 'Після заходів: %h л/добу гарячої води (→ plbdhw) і %f л/добу води на змив із водопроводу (→ plbrainwater).', 'Nach den Maßnahmen: %h L/Tag Warmwasser (→ plbdhw) und %f L/Tag Spülwasser weiterhin aus dem Netz (→ plbrainwater).', 'Na de maatregelen: %h L/dag warm water (→ plbdhw) en %f L/dag spoelwater nog uit het net (→ plbrainwater).', 'Après les mesures : %h L/jour d’eau chaude (→ plbdhw) et %f L/jour d’eau de chasse encore du réseau (→ plbrainwater).', 'Tras las medidas: %h L/día de agua caliente (→ plbdhw) y %f L/día de agua de descarga aún de la red (→ plbrainwater).', 'Po działaniach: %h L/dobę ciepłej wody (→ plbdhw) i %f L/dobę wody do spłukiwania nadal z sieci (→ plbrainwater).'),
  'fl.timed_urinal': T7('Uncontrolled timed urinal cisterns flush every hour of the year (%v m³/a), also at night, at weekends and in holidays — a presence or door control is usually the cheapest saving in the building.', 'Некеровані бачки пісуарів з таймером зливають щогодини весь рік (%v м³/рік), і вночі, і у вихідні, і на канікулах, — датчик присутності чи дверей зазвичай найдешевша економія в будівлі.', 'Ungesteuerte zeitgesteuerte Urinalspülkästen spülen jede Stunde des Jahres (%v m³/a), auch nachts, am Wochenende und in den Ferien — eine Präsenz- oder Türsteuerung ist meist die billigste Einsparung im Gebäude.', 'Ongestuurde getimede urinoirreservoirs spoelen elk uur van het jaar (%v m³/jaar), ook ’s nachts, in het weekend en in de vakanties — een aanwezigheids- of deursturing is meestal de goedkoopste besparing in het gebouw.', 'Les réservoirs d’urinoirs temporisés sans commande chassent chaque heure de l’année (%v m³/an), aussi la nuit, le week-end et pendant les vacances — une commande par présence ou par porte est souvent l’économie la moins chère du bâtiment.', 'Las cisternas temporizadas de urinario sin control descargan cada hora del año (%v m³/año), también de noche, los fines de semana y en vacaciones: un control por presencia o por puerta suele ser el ahorro más barato del edificio.', 'Niesterowane spłuczki pisuarowe z zegarem spłukują co godzinę przez cały rok (%v m³/rok), także w nocy, w weekendy i w wakacje — czujnik obecności lub drzwi to zwykle najtańsza oszczędność w budynku.'),
  'fl.no_payback': T7('%c: the measure saves no money at these prices (the new product uses as much or more water and energy, or its running cost exceeds the saving) — it never pays back, even without investment.', '%c: за цих цін захід не дає економії (новий виріб споживає стільки ж або більше води й енергії, або його експлуатаційні витрати перевищують економію) — він ніколи не окупиться, навіть без інвестицій.', '%c: Die Maßnahme spart bei diesen Preisen kein Geld (das neue Produkt braucht gleich viel oder mehr Wasser und Energie, oder seine Betriebskosten übersteigen die Einsparung) — sie amortisiert sich nie, auch ohne Investition.', '%c: de maatregel bespaart bij deze prijzen geen geld (het nieuwe product verbruikt evenveel of meer water en energie, of de exploitatiekost is hoger dan de besparing) — hij verdient zich nooit terug, ook zonder investering.', '%c : la mesure n’économise rien à ces prix (le nouveau produit consomme autant ou plus d’eau et d’énergie, ou son coût d’exploitation dépasse l’économie) — elle n’est jamais rentable, même sans investissement.', '%c: con estos precios la medida no ahorra dinero (el producto nuevo gasta igual o más agua y energía, o su coste de explotación supera el ahorro); nunca se amortiza, ni siquiera sin inversión.', '%c: przy tych cenach działanie nic nie oszczędza (nowy produkt zużywa tyle samo lub więcej wody i energii albo koszt eksploatacji przewyższa oszczędność) — nigdy się nie zwróci, nawet bez nakładu.'),
  'fl.no_payback_total': T7('The selected measures together save no money at these prices — no total payback.', 'Вибрані заходи разом не дають економії за цих цін — загальної окупності немає.', 'Die gewählten Maßnahmen sparen zusammen bei diesen Preisen kein Geld — keine Gesamtamortisation.', 'De gekozen maatregelen samen besparen bij deze prijzen geen geld — geen totale terugverdientijd.', 'Ensemble, les mesures choisies n’économisent rien à ces prix — pas de temps de retour global.', 'Las medidas elegidas juntas no ahorran dinero con estos precios: no hay retorno total.', 'Wybrane działania łącznie nic nie oszczędzają przy tych cenach — brak łącznego okresu zwrotu.'),
  'fl.no_fixtures': T7('%c: the rows of this class have 0 pieces, so they use no water — enter the number of fixtures.', '%c: у рядках цього класу 0 шт., тому вони не споживають воду — введіть кількість приладів.', '%c: Die Zeilen dieser Klasse haben 0 Stück und verbrauchen daher kein Wasser — Anzahl der Objekte eingeben.', '%c: de rijen van deze klasse hebben 0 stuks en verbruiken dus geen water — vul het aantal toestellen in.', '%c : les lignes de cette classe ont 0 pièce et ne consomment donc pas d’eau — saisissez le nombre d’appareils.', '%c: las filas de esta clase tienen 0 unidades y por tanto no consumen agua; introduzca el número de aparatos.', '%c: wiersze tej klasy mają 0 szt., więc nie zużywają wody — wpisz liczbę przyborów.'),
  'fl.greywater_surplus': T7('More greywater is treated than the WCs and urinals can use (%s m³/a surplus) — the efficient WCs already took most of the demand; consider collecting from fewer rooms or using it for laundry/irrigation.', 'Очищається більше сірої води, ніж можуть використати унітази й пісуари (надлишок %s м³/рік), — ефективні унітази вже забрали більшу частину потреби; збирайте воду з меншої кількості приміщень або використовуйте її для прання чи поливу.', 'Es wird mehr Grauwasser aufbereitet, als WCs und Urinale nutzen können (%s m³/a Überschuss) — die Spar-WCs haben den Bedarf schon größtenteils genommen; aus weniger Räumen sammeln oder für Wäsche/Bewässerung nutzen.', 'Er wordt meer grijswater gezuiverd dan toiletten en urinoirs kunnen gebruiken (%s m³/jaar overschot) — de zuinige toiletten namen het grootste deel van de vraag al weg; vang op uit minder ruimten of gebruik het voor de was of beregening.', 'On traite plus d’eaux grises que les WC et urinoirs n’en utilisent (%s m³/an d’excédent) — les WC économes ont déjà pris l’essentiel du besoin ; collecter moins de locaux ou l’utiliser pour le linge ou l’arrosage.', 'Se trata más agua gris de la que pueden usar inodoros y urinarios (excedente %s m³/año): los inodoros eficientes ya se llevaron casi toda la demanda; recoja de menos locales o úsela para lavado o riego.', 'Oczyszcza się więcej wody szarej, niż zużyją WC i pisuary (nadwyżka %s m³/rok) — oszczędne WC już zabrały większość zapotrzebowania; zbieraj z mniejszej liczby pomieszczeń albo użyj jej do prania lub podlewania.'),
  'fl.greywater_no_payback': T7('Greywater: the running cost and electricity exceed the water saved — no payback.', 'Сіра вода: експлуатаційні витрати й електроенергія перевищують зекономлену воду — окупності немає.', 'Grauwasser: Betriebskosten und Strom übersteigen das eingesparte Wasser — keine Amortisation.', 'Grijswater: exploitatiekost en elektriciteit zijn hoger dan het bespaarde water — geen terugverdientijd.', 'Eaux grises : coût d’exploitation et électricité dépassent l’eau économisée — pas de retour.', 'Aguas grises: el coste de explotación y la electricidad superan el agua ahorrada; sin retorno.', 'Woda szara: koszty eksploatacji i energii przewyższają zaoszczędzoną wodę — brak zwrotu.'),
  'fl.greywater_no_demand': T7('Greywater has nothing to supply: there are no WCs or urinals using water.', 'Сірій воді немає кого постачати: немає унітазів чи пісуарів, що використовують воду.', 'Grauwasser hat keinen Abnehmer: keine wasserverbrauchenden WCs oder Urinale.', 'Grijswater heeft geen afnemer: er zijn geen toiletten of urinoirs die water gebruiken.', 'Les eaux grises n’ont rien à alimenter : aucun WC ni urinoir utilisant de l’eau.', 'Las aguas grises no tienen a quién abastecer: no hay inodoros ni urinarios que usen agua.', 'Woda szara nie ma odbiorcy: brak WC i pisuarów zużywających wodę.'),
  'fl.shower_below_6': T7('A shower below 6 l/min is often felt as too weak; people then shower longer and complain.', 'Душ із витратою менше 6 л/хв часто здається заслабким; люди миються довше й скаржаться.', 'Eine Dusche unter 6 l/min wird oft als zu schwach empfunden; man duscht dann länger und beschwert sich.', 'Een douche onder 6 l/min voelt vaak te zwak; mensen douchen dan langer en klagen.', 'Une douche sous 6 l/min est souvent jugée trop faible ; on se douche alors plus longtemps et on se plaint.', 'Una ducha por debajo de 6 l/min suele parecer demasiado débil; la gente se ducha más tiempo y se queja.', 'Natrysk poniżej 6 l/min często wydaje się za słaby; ludzie myją się dłużej i narzekają.'),
  'v.ok': T7('%p % less mains water: %b → %a litres per person and day; %e EUR/a saved for %c EUR (payback %y).', 'На %p % менше водопровідної води: %b → %a л на особу за добу; економія %e EUR/рік за %c EUR (окупність %y).', '%p % weniger Trinkwasser: %b → %a Liter je Person und Tag; %e EUR/a gespart für %c EUR (Amortisation %y).', '%p % minder leidingwater: %b → %a liter per persoon per dag; %e EUR/jaar bespaard voor %c EUR (terugverdientijd %y).', '%p % d’eau du réseau en moins : %b → %a litres par personne et par jour ; %e EUR/an économisés pour %c EUR (retour %y).', '%p % menos agua de red: %b → %a litros por persona y día; %e EUR/año ahorrados por %c EUR (retorno %y).', 'O %p % mniej wody wodociągowej: %b → %a litrów na osobę na dobę; %e EUR/rok oszczędności za %c EUR (zwrot %y).'),
  'v.none': T7('No measure selected yet: pick an efficient product in the “After” column.', 'Захід ще не вибрано: виберіть ефективний виріб у стовпці «Після».', 'Noch keine Maßnahme gewählt: wählen Sie ein effizientes Produkt in der Spalte „Nachher“.', 'Nog geen maatregel gekozen: kies een zuinig product in de kolom “Na”.', 'Aucune mesure choisie : choisissez un produit efficace dans la colonne « Après ».', 'Aún no hay medidas: elija un producto eficiente en la columna «Después».', 'Nie wybrano jeszcze działania: wybierz efektywny produkt w kolumnie „Po”.'),
  'v.neg': T7('The measures cost more per year than they save (%e EUR/a) — check the running costs.', 'Заходи щороку коштують більше, ніж заощаджують (%e EUR/рік), — перевірте експлуатаційні витрати.', 'Die Maßnahmen kosten jährlich mehr, als sie sparen (%e EUR/a) — Betriebskosten prüfen.', 'De maatregelen kosten per jaar meer dan ze besparen (%e EUR/jaar) — controleer de exploitatiekosten.', 'Les mesures coûtent plus par an qu’elles n’économisent (%e EUR/an) — vérifiez les coûts d’exploitation.', 'Las medidas cuestan al año más de lo que ahorran (%e EUR/año): revise los costes de explotación.', 'Działania kosztują rocznie więcej, niż oszczędzają (%e EUR/rok) — sprawdź koszty eksploatacji.'),

function S(k, subs) { var s = pick(tx(k)); if (subs) Object.keys(subs).sort(function (a, b) { return b.length - a.length; }).forEach(function (p) { s = s.split('%' + p).join(subs[p]); }); return s; }
function fmt(v, p) {
  var c = core();

}

}

    flush: { title: T7('Flush volumes and urinals', 'Об’єми зливу і пісуари', 'Spülmengen und Urinale', 'Spoelvolumes en urinoirs', 'Volumes de chasse et urinoirs', 'Volúmenes de descarga y urinarios', 'Objętości spłukiwania i pisuary'),
      body: T7('A dual-flush WC is counted as one full and three reduced flushes (EU Ecolabel 2013/641/EU): 4/2 l gives 2.5 l per use against 9 l for an old cistern. An uncontrolled timed urinal cistern flushes on its own every hour of the year — up to 7.5 l/h per bowl (UK Water Fittings Regulations) — even in an empty building. Waterless urinals use no water, but their cartridges and cleaning cost money every year.',

    flow: { title: T7('Taps and showers', 'Змішувачі та душі', 'Armaturen und Duschen', 'Kranen en douches', 'Robinets et douches', 'Grifos y duchas', 'Baterie i natryski'),
      body: T7('For a tap or a shower the volume per use is a fixed fill (a pot, a basin of water) plus flow × duration. An aerator halves the flow of a basin tap for a few euros; a 6 l/min shower head halves a 12 l/min shower. Sensor and push-button fittings also shorten the duration. Where the volume is needed (filling a kettle) a lower flow saves nothing — that is the kitchen “fill” part.',

        'Bij een kraan of douche is het volume per gebruik een vaste vulling (een pot, een wasbak water) plus debiet × duur. Een perlator halveert voor enkele euro’s het debiet van een wastafelkraan; een douchekop van 6 l/min halveert een douche van 12 l/min. Sensor- en drukknopkranen verkorten ook de duur. Waar een volume nodig is (waterkoker vullen), bespaart een lager debiet niets — dat is het “vul”-deel in de keuken.',
        'Pour un robinet ou une douche, le volume par usage est un remplissage fixe (une casserole, un lavabo d’eau) plus débit × durée. Un mousseur divise par deux le débit d’un lavabo pour quelques euros ; une pomme de 6 l/min divise par deux une douche de 12 l/min. Les robinets à détection et temporisés raccourcissent aussi la durée. Là où il faut un volume (remplir une bouilloire), un débit réduit n’économise rien — c’est la part « remplissage » de l’évier.',

        'Dla baterii lub natrysku objętość na użycie to stałe napełnienie (garnek, umywalka wody) plus przepływ × czas. Perlator za kilka euro zmniejsza o połowę przepływ baterii umywalkowej; słuchawka 6 l/min zmniejsza o połowę natrysk 12 l/min. Baterie sensorowe i czasowe skracają też czas. Gdzie potrzebna jest objętość (napełnienie czajnika), mniejszy przepływ nic nie daje — to część „napełnienia” w kuchni.') },
    energy: { title: T7('Hot water is the hidden saving', 'Гаряча вода — прихована економія', 'Warmwasser ist die versteckte Einsparung', 'Warm water is de verborgen besparing', 'L’eau chaude, l’économie cachée', 'El agua caliente, el ahorro oculto', 'Ciepła woda — ukryta oszczędność'),
      body: T7('Every litre of shower or basin water is partly hot. Heating one m³ by 50 K needs 1.163 × 50 ≈ 58 kWh; with a 0.85 efficient boiler about 68 kWh of gas — at 0.10 EUR/kWh some 7 EUR, the same order as the price of the water itself. So a low-flow shower head saves twice: water and energy, and CO₂ (0.202 kg/kWh for natural gas, IPCC 2006). Only the energy of the drawn water is counted; circulation losses stay (see plbcirc).',
        'Кожен літр води з душу чи умивальника частково гарячий. Нагрівання 1 м³ на 50 K потребує 1,163 × 50 ≈ 58 кВт·год; із котлом з ККД 0,85 — близько 68 кВт·год газу, за 0,10 EUR/кВт·год приблизно 7 EUR, того ж порядку, що й ціна самої води. Тож економна лійка заощаджує двічі: воду й енергію, а також CO₂ (0,202 кг/кВт·год для природного газу, IPCC 2006). Враховано лише енергію відібраної води; втрати циркуляції лишаються (див. plbcirc).',
        'Jeder Liter Dusch- oder Waschtischwasser ist teilweise warm. 1 m³ um 50 K zu erwärmen braucht 1,163 × 50 ≈ 58 kWh; mit einem Kessel mit 0,85 Nutzungsgrad rund 68 kWh Gas — bei 0,10 EUR/kWh etwa 7 EUR, dieselbe Größenordnung wie der Wasserpreis selbst. Eine Sparbrause spart also doppelt: Wasser und Energie, dazu CO₂ (0,202 kg/kWh für Erdgas, IPCC 2006). Gezählt wird nur die Energie des gezapften Wassers; Zirkulationsverluste bleiben (siehe plbcirc).',
        'Elke liter douche- of wastafelwater is deels warm. 1 m³ 50 K opwarmen vraagt 1,163 × 50 ≈ 58 kWh; met een ketel van 0,85 rendement zo’n 68 kWh gas — bij 0,10 EUR/kWh ongeveer 7 EUR, dezelfde grootteorde als de waterprijs zelf. Een spaardouchekop bespaart dus dubbel: water en energie, en CO₂ (0,202 kg/kWh voor aardgas, IPCC 2006). Alleen de energie van het getapte water telt; circulatieverliezen blijven (zie plbcirc).',
        'Chaque litre d’eau de douche ou de lavabo est en partie chaud. Chauffer 1 m³ de 50 K demande 1,163 × 50 ≈ 58 kWh ; avec une chaudière de rendement 0,85, environ 68 kWh de gaz — à 0,10 EUR/kWh quelque 7 EUR, le même ordre que le prix de l’eau elle-même. Une pomme économe économise donc deux fois : l’eau et l’énergie, et le CO₂ (0,202 kg/kWh pour le gaz naturel, GIEC 2006). Seule l’énergie de l’eau puisée est comptée ; les pertes de bouclage restent (voir plbcirc).',
        'Cada litro de agua de ducha o lavabo es en parte caliente. Calentar 1 m³ en 50 K requiere 1,163 × 50 ≈ 58 kWh; con una caldera de rendimiento 0,85, unos 68 kWh de gas: a 0,10 EUR/kWh unos 7 EUR, del mismo orden que el precio del agua. Un rociador eficiente ahorra dos veces: agua y energía, y CO₂ (0,202 kg/kWh para gas natural, IPCC 2006). Solo se cuenta la energía del agua consumida; las pérdidas de recirculación permanecen (véase plbcirc).',
        'Każdy litr wody z natrysku lub umywalki jest częściowo ciepły. Podgrzanie 1 m³ o 50 K wymaga 1,163 × 50 ≈ 58 kWh; z kotłem o sprawności 0,85 około 68 kWh gazu — przy 0,10 EUR/kWh ok. 7 EUR, tyle samo co cena samej wody. Oszczędna słuchawka oszczędza więc podwójnie: wodę i energię, a także CO₂ (0,202 kg/kWh dla gazu ziemnego, IPCC 2006). Liczona jest tylko energia pobranej wody; straty cyrkulacji pozostają (zob. plbcirc).') },
    payback: { title: T7('Payback and ranking', 'Окупність і рейтинг', 'Amortisation und Reihenfolge', 'Terugverdientijd en rangschikking', 'Temps de retour et classement', 'Retorno y orden', 'Okres zwrotu i ranking'),
      body: T7('Simple payback = investment / yearly saving, with the saving = water × integral price + energy × price − change of running cost. It ignores interest and price rises, so read it as an order of magnitude: months, a few years, or never. Measures are ranked by payback — do the cheap ones first. Replacing whole WCs saves much water but costs the most per m³.',
        'Простий термін окупності = інвестиції / річна економія, де економія = вода × повна ціна + енергія × ціна − зміна експлуатаційних витрат. Він не враховує відсотки й зростання цін, тож читайте його як порядок величини: місяці, кілька років або ніколи. Заходи впорядковано за окупністю — спершу робіть дешеві. Заміна цілих унітазів заощаджує багато води, але найдорожча за м³.',
        'Einfache Amortisation = Investition / jährliche Einsparung, mit Einsparung = Wasser × Gesamtpreis + Energie × Preis − Änderung der Betriebskosten. Zinsen und Preissteigerungen fehlen, also als Größenordnung lesen: Monate, einige Jahre oder nie. Die Maßnahmen sind nach Amortisation gereiht — die billigen zuerst. Der Tausch ganzer WCs spart viel Wasser, kostet aber je m³ am meisten.',
        'Eenvoudige terugverdientijd = investering / jaarlijkse besparing, met besparing = water × integrale prijs + energie × prijs − wijziging van de exploitatiekost. Rente en prijsstijgingen zitten er niet in, dus lees het als grootteorde: maanden, enkele jaren of nooit. De maatregelen staan gerangschikt volgens terugverdientijd — doe eerst de goedkope. Hele toiletten vervangen bespaart veel water, maar kost het meest per m³.',
        'Temps de retour simple = investissement / économie annuelle, avec économie = eau × prix intégral + énergie × prix − variation du coût d’exploitation. Il ignore intérêts et hausses de prix : lisez-le comme un ordre de grandeur — des mois, quelques années ou jamais. Les mesures sont classées par temps de retour — commencez par les moins chères. Remplacer des WC entiers économise beaucoup d’eau mais coûte le plus par m³.',
        'Retorno simple = inversión / ahorro anual, con ahorro = agua × precio integral + energía × precio − cambio del coste de explotación. Ignora intereses y subidas de precios: léalo como orden de magnitud, meses, pocos años o nunca. Las medidas se ordenan por retorno: haga primero las baratas. Sustituir inodoros completos ahorra mucha agua pero es lo más caro por m³.',
        'Prosty okres zwrotu = nakład / roczna oszczędność, gdzie oszczędność = woda × cena łączna + energia × cena − zmiana kosztów eksploatacji. Pomija odsetki i wzrost cen, więc czytaj go jako rząd wielkości: miesiące, kilka lat albo nigdy. Działania są uszeregowane wg okresu zwrotu — najpierw tanie. Wymiana całych WC oszczędza dużo wody, ale kosztuje najwięcej za m³.') },
    greywater: { title: T7('Greywater for flushing', 'Сіра вода для змиву', 'Grauwasser für die Spülung', 'Grijswater voor de spoeling', 'Eaux grises pour les chasses', 'Aguas grises para las descargas', 'Woda szara do spłukiwania'),
      body: T7('Lightly used water from showers, baths and basins can be treated and used again to flush WCs and urinals (EN 16941-2 covers the design). It can only replace what the flushing needs: after efficient WCs that demand is small, and the rest of the treated water goes to the sewer. Treatment needs electricity and maintenance every year. Do the fixture measures first, then size greywater — or rainwater (plbrainwater) — on the remaining demand.',
        'Слабко забруднену воду з душів, ванн і умивальників можна очистити й знову використати для змиву унітазів і пісуарів (проєктування — EN 16941-2). Вона замінює лише потребу на змив: після ефективних унітазів ця потреба мала, а решта очищеної води йде в каналізацію. Очищення щороку потребує електроенергії й обслуговування. Спершу заходи з приладами, потім розрахунок сірої — або дощової (plbrainwater) — води на залишкову потребу.',
        'Leicht verschmutztes Wasser aus Duschen, Wannen und Waschtischen kann aufbereitet und für die WC- und Urinalspülung wiederverwendet werden (Planung nach EN 16941-2). Es ersetzt nur den Spülbedarf: Nach Spar-WCs ist dieser klein, der Rest des aufbereiteten Wassers geht in den Kanal. Die Aufbereitung braucht jedes Jahr Strom und Wartung. Erst die Objektmaßnahmen, dann Grauwasser — oder Regenwasser (plbrainwater) — auf den Restbedarf auslegen.',
        'Licht vervuild water van douches, baden en wastafels kan gezuiverd en opnieuw gebruikt worden om toiletten en urinoirs te spoelen (ontwerp volgens EN 16941-2). Het vervangt alleen de spoelvraag: na zuinige toiletten is die klein en gaat de rest van het gezuiverde water naar de riolering. Zuivering vraagt elk jaar elektriciteit en onderhoud. Eerst de toestelmaatregelen, dan grijswater — of hemelwater (plbrainwater) — dimensioneren op de resterende vraag.',
        'Les eaux peu chargées des douches, baignoires et lavabos peuvent être traitées et réutilisées pour les chasses des WC et urinoirs (conception selon EN 16941-2). Elles ne remplacent que le besoin de chasse : après des WC économes il est faible, et le reste de l’eau traitée part à l’égout. Le traitement demande chaque année électricité et maintenance. D’abord les mesures sur les appareils, ensuite dimensionner les eaux grises — ou pluviales (plbrainwater) — sur le besoin restant.',
        'El agua poco sucia de duchas, bañeras y lavabos puede tratarse y reutilizarse en las descargas de inodoros y urinarios (diseño según EN 16941-2). Solo sustituye la demanda de descarga: tras inodoros eficientes es pequeña y el resto del agua tratada va al saneamiento. El tratamiento necesita cada año electricidad y mantenimiento. Primero las medidas en los aparatos, después dimensione las aguas grises —o pluviales (plbrainwater)— para la demanda restante.',
        'Lekko zanieczyszczoną wodę z natrysków, wanien i umywalek można oczyścić i ponownie użyć do spłukiwania WC i pisuarów (projekt wg EN 16941-2). Zastępuje ona tylko zapotrzebowanie na spłukiwanie: po oszczędnych WC jest ono małe, a reszta oczyszczonej wody trafia do kanalizacji. Oczyszczanie co roku wymaga energii i serwisu. Najpierw działania na przyborach, potem dobór wody szarej — lub deszczowej (plbrainwater) — na pozostałe zapotrzebowanie.') },
    schemes: { title: T7('Certification and regulations', 'Сертифікація та норми', 'Zertifizierung und Vorschriften', 'Certificering en regelgeving', 'Certification et réglementation', 'Certificación y normativa', 'Certyfikacja i przepisy'),

        'Systeme wie BREEAM (Wat 01) oder LEED vergleichen die Liter je Person und Tag mit einer eigenen Basis und vergeben Punkte für die Senkung; der Prozentsatz hier bezieht sich auf Ihre „Vorher“-Produkte — nutzen Sie ihn als Beleg in der Planung, nicht als Punkteanspruch. Produktlabels (EU Ecolabel, Unified Water Label) liefern zertifizierte Durchflüsse und Spülmengen — für „Nachher“ verwenden. Regionale Vorschriften (z. B. die flämische GSV Hemelwater zur Regenwassernutzung) können Pflichten ergänzen.',
        'Systemen zoals BREEAM (Wat 01) of LEED vergelijken de liter per persoon per dag met een eigen referentie en kennen punten toe voor de vermindering; het percentage hier is t.o.v. uw eigen “Vóór”-producten — gebruik het als onderbouwing in het ontwerp, niet als puntenclaim. Productlabels (EU Ecolabel, Unified Water Label) geven gecertificeerde debieten en spoelvolumes — gebruik ze in “Na”. Gewestelijke regels (bv. de Vlaamse GSV Hemelwater voor hergebruik van hemelwater) kunnen verplichtingen toevoegen.',
        'Des référentiels comme BREEAM (Wat 01) ou LEED comparent les litres par personne et par jour à leur propre référence et attribuent des crédits pour la réduction ; le pourcentage ici est relatif à vos produits « Avant » — utilisez-le comme argument de conception, pas comme demande de crédits. Les labels produits (EU Ecolabel, Unified Water Label) donnent des débits et volumes certifiés — à utiliser dans « Après ». Les règles régionales (p. ex. le GSV Hemelwater flamand sur la réutilisation de l’eau de pluie) peuvent ajouter des obligations.',
        'Sistemas como BREEAM (Wat 01) o LEED comparan los litros por persona y día con su propia referencia y otorgan créditos por la reducción; el porcentaje aquí es respecto a sus productos «Antes», así que úselo como argumento de diseño, no como solicitud de créditos. Las etiquetas de producto (EU Ecolabel, Unified Water Label) dan caudales y volúmenes certificados: úselos en «Después». Las reglas regionales (p. ej. el GSV Hemelwater flamenco sobre agua de lluvia) pueden añadir obligaciones.',
        'Systemy takie jak BREEAM (Wat 01) czy LEED porównują litry na osobę na dobę z własną bazą i przyznają punkty za redukcję; procent tutaj odnosi się do Twoich produktów „Przed”, więc traktuj go jako argument projektowy, a nie wniosek o punkty. Oznaczenia produktów (EU Ecolabel, Unified Water Label) podają certyfikowane przepływy i objętości spłukiwania — używaj ich w „Po”. Przepisy regionalne (np. flamandzkie GSV Hemelwater dot. wody deszczowej) mogą dodawać obowiązki.') }
