        return { ok: false, err: 'Enter a finite value for ' + name };
      }

    var full = s.level === 'full';
    if (full && !isFiniteNumber(s.C)) {
      return { ok: false, err: 'Enter a finite value for C-factor' };

      mg: s.mg,

      rhog: s.rhog,
      rhol: s.rhol,
      D: s.D,
      C: full ? s.C : null,
      solids: full ? s.solids === true : false

  function computeView(s) {
    last = solve(s);
    if (stage) stage.schedule();
    var R = last;
    if (!R || !R.ok) { var e = String((R && R.err) || 'Error'); return { verdict: { tone: 'bad', text: trW(e) }, tiles: [], notes: [] }; }
    var full = s.level === 'full', tiles = [], meters = [], tables = [], notes = [];
    function fin(v) { return typeof v === 'number' && isFinite(v); }
    function tile(label, v, unit, learn, head) { if (!fin(v)) return; tiles.push({ label: label, value: sigv(v, 5), hint: unit, precision: sig(v, 5), tone: null, learn: learn, headline: !!head }); }
    var warns = R.warnings || [], i, w;
    var verdict;
    if (R.ratio > 1) {
      verdict = { tone: 'bad', text: T('Mixture velocity exceeds the erosional velocity', 'Швидкість суміші перевищує ерозійну швидкість', 'Gemischgeschwindigkeit überschreitet die Erosionsgeschwindigkeit', 'Mengselsnelheid overschrijdt de erosiesnelheid', 'La vitesse du mélange dépasse la vitesse d\'érosion', 'La velocidad de la mezcla supera la velocidad erosiva', 'Prędkość mieszaniny przekracza prędkość erozyjną') };
    } else if (warns.length) {
      verdict = { tone: 'warn', text: T('Below the erosional velocity, check the warnings', 'Нижче ерозійної швидкості, перевірте попередження', 'Unterhalb der Erosionsgeschwindigkeit, Warnungen prüfen', 'Onder de erosiesnelheid, controleer de waarschuwingen', 'Sous la vitesse d\'érosion, vérifiez les avertissements', 'Por debajo de la velocidad erosiva, revise las advertencias', 'Poniżej prędkości erozyjnej, sprawdź ostrzeżenia') };
    } else {
      verdict = { tone: 'ok', text: T('Mixture velocity below the API RP 14E erosional velocity', 'Швидкість суміші нижче ерозійної швидкості за API RP 14E', 'Gemischgeschwindigkeit unterhalb der Erosionsgeschwindigkeit nach API RP 14E', 'Mengselsnelheid onder de erosiesnelheid volgens API RP 14E', 'Vitesse du mélange inférieure à la vitesse d\'érosion API RP 14E', 'Velocidad de la mezcla inferior a la velocidad erosiva de API RP 14E', 'Prędkość mieszaniny poniżej prędkości erozyjnej wg API RP 14E') };
    }
    tile(T('Vm · Mixture velocity', 'Vm · Швидкість суміші', 'Vm · Gemischgeschwindigkeit', 'Vm · Mengselsnelheid', 'Vm · Vitesse du mélange', 'Vm · Velocidad de la mezcla', 'Vm · Prędkość mieszaniny'), R.Vm, 'm/s', 'flow', true);
    tile(T('Ve · Erosional velocity', 'Ve · Ерозійна швидкість', 'Ve · Erosionsgeschwindigkeit', 'Ve · Erosiesnelheid', 'Ve · Vitesse d\'érosion', 'Ve · Velocidad erosiva', 'Ve · Prędkość erozyjna'), R.Ve, 'm/s', 'cfactor', true);
    tile(T('Vm/Ve · Velocity ratio', 'Vm/Ve · Відношення швидкостей', 'Vm/Ve · Geschwindigkeitsverhältnis', 'Vm/Ve · Snelheidsverhouding', 'Vm/Ve · Rapport des vitesses', 'Vm/Ve · Relación de velocidades', 'Vm/Ve · Stosunek prędkości'), R.ratio, '–', 'cfactor');
    tile(T('Dmin · Minimum inner diameter', 'Dmin · Мінімальний внутрішній діаметр', 'Dmin · Minimaler Innendurchmesser', 'Dmin · Minimale binnendiameter', 'Dmin · Diamètre intérieur minimal', 'Dmin · Diámetro interior mínimo', 'Dmin · Minimalna średnica wewnętrzna'), R.Dmin * 1000, 'mm', 'diameter');
    if (full) {
      tile(T('ρm · No-slip mixture density', 'ρm · Густина суміші без проковзування', 'ρm · Gemischdichte ohne Schlupf', 'ρm · Mengseldichtheid zonder slip', 'ρm · Masse volumique du mélange sans glissement', 'ρm · Densidad de la mezcla sin deslizamiento', 'ρm · Gęstość mieszaniny bez poślizgu'), R.rhom, 'kg/m³', 'density');
      tile(T('λ · No-slip liquid fraction', 'λ · Частка рідини без проковзування', 'λ · Flüssigkeitsanteil ohne Schlupf', 'λ · Vloeistoffractie zonder slip', 'λ · Fraction liquide sans glissement', 'λ · Fracción líquida sin deslizamiento', 'λ · Udział cieczy bez poślizgu'), R.lambda, '–', 'liquid');
      tile(T('Qm · Mixture volume rate', 'Qm · Об’ємна витрата суміші', 'Qm · Gemischvolumenstrom', 'Qm · Volumedebiet mengsel', 'Qm · Débit volumique du mélange', 'Qm · Caudal volumétrico de la mezcla', 'Qm · Strumień objętości mieszaniny'), R.Qm * 3600, 'm³/h', 'flow');
    }
    if (fin(R.ratio)) {
      meters.push({ label: T('Mixture / erosional velocity', 'Швидкість суміші / ерозійна', 'Gemisch- / Erosionsgeschwindigkeit', 'Mengsel- / erosiesnelheid', 'Vitesse du mélange / d\'érosion', 'Velocidad de mezcla / erosiva', 'Prędkość mieszaniny / erozyjna'), ratio: Math.min(1.2, R.ratio), text: DiagramUI.fmt(R.Vm, { precision: 3 }) + ' / ' + DiagramUI.fmt(R.Ve, { precision: 3 }) + ' m/s' });
    }
    for (i = 0; i < warns.length; i++) { w = String(warns[i]); notes.push(trW(w)); }
    notes.push(T(
      'API RP 14E, 5th ed. (1991, reaffirmed 2013), eq. 2.14, Ve = C/√ρm in field units; homogeneous no-slip mixture; not valid with sand (see DNV-RP-O501)',
      'API RP 14E, 5-те вид. (1991, підтверджено 2013), рівн. 2.14, Ve = C/√ρm у польових одиницях; гомогенна суміш без проковзування; не застосовується за наявності піску (див. DNV-RP-O501)',
      'API RP 14E, 5. Ausg. (1991, bestätigt 2013), Gl. 2.14, Ve = C/√ρm in Feldeinheiten; homogenes Gemisch ohne Schlupf; nicht gültig bei Sand (siehe DNV-RP-O501)',
      'API RP 14E, 5e ed. (1991, herbevestigd 2013), vgl. 2.14, Ve = C/√ρm in veldeenheden; homogeen mengsel zonder slip; niet geldig bij zand (zie DNV-RP-O501)',
      'API RP 14E, 5e éd. (1991, confirmée 2013), éq. 2.14, Ve = C/√ρm en unités de terrain ; mélange homogène sans glissement ; non valable en présence de sable (voir DNV-RP-O501)',
      'API RP 14E, 5.ª ed. (1991, reafirmada 2013), ec. 2.14, Ve = C/√ρm en unidades de campo; mezcla homogénea sin deslizamiento; no válida con arena (véase DNV-RP-O501)',
      'API RP 14E, wyd. 5 (1991, potwierdzone 2013), równ. 2.14, Ve = C/√ρm w jednostkach polowych; mieszanina jednorodna bez poślizgu; nie dotyczy przepływu z piaskiem (zob. DNV-RP-O501)'
    ));
    return { verdict: verdict, tiles: tiles, meters: meters, tables: tables, notes: notes };
  }

  function renderErosion(size, st) {
    var ctx = st.canvas(), w = size.w, h = size.h;
    ctx.clearRect(0, 0, w, h);
    if (!last || !last.ok) { return; }
    var cs = getComputedStyle(document.documentElement);
    var muted = (cs.getPropertyValue('--muted') || '').trim() || '#6b7280';
    var line = (cs.getPropertyValue('--line') || '').trim() || '#d1d5db';
    var font = (cs.getPropertyValue('--font') || '').trim() || 'sans-serif';
    var D = state.D, Dmin = last.Dmin, maxD = Math.max(D, Dmin);
    var rMax = Math.min(0.6 * w, h) / 2 - 30;
    if (!(maxD > 0) || !(rMax > 0)) { return; }
    var k = rMax / (maxD / 2), cx = 0.3 * w, cy = h / 2;
    var rD = (D / 2) * k, rM = (Dmin / 2) * k;
    ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(cx - rMax - 10, cy); ctx.lineTo(cx + rMax + 10, cy);
    ctx.moveTo(cx, cy - rMax - 10); ctx.lineTo(cx, cy + rMax + 10); ctx.stroke();
    if (rD > 0) {
      ctx.beginPath(); ctx.arc(cx, cy, rD, 0, 2 * Math.PI);
      ctx.globalAlpha = 0.25; ctx.fillStyle = DiagramUI.series(0); ctx.fill();
      ctx.globalAlpha = 1; ctx.strokeStyle = DiagramUI.series(0); ctx.lineWidth = 2; ctx.stroke();
    }
    if (rM > 0) {
      ctx.beginPath(); ctx.arc(cx, cy, rM, 0, 2 * Math.PI);
      ctx.setLineDash([6, 4]); ctx.strokeStyle = DiagramUI.series(1); ctx.lineWidth = 2; ctx.stroke();
      ctx.setLineDash([]);
    }
    var f = DiagramUI.fmt, lines = [
      'D = ' + f(D * 1000, { precision: 1 }) + ' mm',
      'Dmin = ' + f(Dmin * 1000, { precision: 1 }) + ' mm',
      'Vm = ' + f(last.Vm, { precision: 3 }) + ' m/s',
      'Ve = ' + f(last.Ve, { precision: 3 }) + ' m/s',
      'Vm/Ve = ' + f(last.ratio, { precision: 3 })
    ];
    ctx.font = '12px ' + font; ctx.fillStyle = muted;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    var lh = 18, y0 = cy - ((lines.length - 1) * lh) / 2;
    for (var i = 0; i < lines.length; i++) { ctx.fillText(lines[i], 0.62 * w, y0 + i * lh); }
  }

  function degrade() {
    document.title = 'diagram-ui.js v1 is required';
    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1');
    h.textContent = 'Erosional velocity';
    var p = document.createElement('p');
    p.textContent = 'The interactive interface could not load. The export, the calculation record '
                  + 'and the limitations are still available from the bar at the bottom of the page.';
    host.appendChild(h);
    host.appendChild(p);
    last = solve(state);
  }

    installData();
  }

          liquid: {
