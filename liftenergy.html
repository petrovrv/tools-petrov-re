  "title": {"en":"Lift Energy & Efficiency Class","uk":"Енергоспоживання та клас ефективності ліфта","de":"Aufzug: Energiebedarf und Effizienzklasse","nl":"Liftenergie en efficiëntieklasse","fr":"Énergie et classe d’efficacité d’un ascenseur","es":"Energía y clase de eficiencia del ascensor","pl":"Energia i klasa efektywności dźwigu"},
  "summary": {"en":"Daily and annual energy of one lift by the ISO 25745-2:2015 method — running plus idle and standby — with VDI 4707 classes, cost, CO₂ and a waterfall of what helps: regenerative drive, deep standby, LED car light.","uk":"Добове й річне енергоспоживання ліфта за методом ISO 25745-2:2015 — рух плюс простій і режим очікування — з класами VDI 4707, вартістю, CO₂ і каскадом заходів: рекуперативний привід, глибокий режим очікування, LED-освітлення кабіни.","de":"Tages- und Jahresenergiebedarf eines Aufzugs nach dem Verfahren der ISO 25745-2:2015 — Fahrt plus Stillstand und Standby — mit Klassen nach VDI 4707, Kosten, CO₂ und einem Wasserfall der Maßnahmen: Rückspeisung, Tiefschlaf-Standby, LED-Kabinenlicht.","nl":"Dag- en jaarenergie van één lift volgens de methode van ISO 25745-2:2015 — rijden plus stilstand en stand-by — met klassen volgens VDI 4707, kosten, CO₂ en een watervaldiagram van wat helpt: terugleverende aandrijving, diepe stand-by, LED-kooiverlichting.","fr":"Énergie journalière et annuelle d’un ascenseur selon la méthode ISO 25745-2:2015 — marche plus arrêt et veille — avec les classes VDI 4707, le coût, le CO₂ et une cascade des leviers : variateur régénératif, veille profonde, éclairage LED de cabine.","es":"Energía diaria y anual de un ascensor según el método ISO 25745-2:2015 — marcha más reposo y espera — con clases VDI 4707, coste, CO₂ y una cascada de medidas: accionamiento regenerativo, espera profunda, iluminación LED de cabina.","pl":"Dobowe i roczne zużycie energii dźwigu metodą ISO 25745-2:2015 — jazda oraz postój i czuwanie — z klasami VDI 4707, kosztem, CO₂ i kaskadą działań: napęd z odzyskiem energii, głębokie czuwanie, oświetlenie LED kabiny."},
  "description": {"en":"Describe one lift (rated load, speed, travel, stops, drive, door times), choose its usage category or trips per day (or take them from the lift simulator), and enter the reference-cycle energy and idle/standby powers if measured. The tool applies ISO 25745-2:2015 Tables 1–4 and Formulae (1)–(17), and shows the ISO energy class (Table 7) and the VDI 4707 energy classes, annual kWh, cost and CO₂, the split running/standing, energy against usage, and a waterfall of improvement levers.","uk":"Опишіть ліфт (вантажопідйомність, швидкість, висоту підйому, зупинки, привід, час дверей), виберіть категорію використання або кількість поїздок на добу (чи візьміть їх із симулятора ліфтів) і введіть енергію еталонного циклу та потужності простою й очікування, якщо вони виміряні. Інструмент застосовує таблиці 1–4 і формули (1)–(17) ISO 25745-2:2015 і показує клас енергоефективності ISO (табл. 7) та класи VDI 4707, річні кВт·год, вартість і CO₂, частку руху й стоянки, енергію залежно від використання та каскад заходів.","de":"Beschreiben Sie einen Aufzug (Nennlast, Geschwindigkeit, Förderhöhe, Haltestellen, Antrieb, Türzeiten), wählen Sie die Nutzungskategorie oder die Fahrten pro Tag (oder übernehmen Sie sie aus dem Aufzugsimulator) und geben Sie Referenzfahrt-Energie und Stillstands-/Standby-Leistung ein, falls gemessen. Das Werkzeug wendet die Tabellen 1–4 und Formeln (1)–(17) der ISO 25745-2:2015 an und zeigt die ISO-Energieeffizienzklasse (Tabelle 7) und VDI-4707-Klassen, Jahres-kWh, Kosten und CO₂, den Anteil Fahrt/Stillstand, Energie über der Nutzung und einen Wasserfall der Maßnahmen.","nl":"Beschrijf één lift (nominale last, snelheid, hefhoogte, stopplaatsen, aandrijving, deurtijden), kies de gebruikscategorie of het aantal ritten per dag (of neem ze over uit de liftsimulator) en voer de energie van de referentiecyclus en het stilstand- en stand-byvermogen in als ze gemeten zijn. De tool past tabel 1–4 en formules (1)–(17) van ISO 25745-2:2015 toe en toont de ISO-energieklasse (tabel 7) en de VDI 4707-klassen, jaarlijkse kWh, kosten en CO₂, het aandeel rijden/stilstaan, energie tegen gebruik en een waterval van verbetermaatregelen.","fr":"Décrivez un ascenseur (charge nominale, vitesse, course, niveaux desservis, entraînement, temps de portes), choisissez la catégorie d’utilisation ou le nombre de trajets par jour (ou reprenez-les du simulateur d’ascenseurs), et saisissez l’énergie du cycle de référence et les puissances à l’arrêt et en veille si elles sont mesurées. L’outil applique les tableaux 1–4 et les formules (1)–(17) de l’ISO 25745-2:2015, et affiche la classe énergétique ISO (tableau 7) et les classes VDI 4707, les kWh annuels, le coût et le CO₂, la part marche/arrêt, l’énergie selon l’utilisation et une cascade des leviers d’amélioration.","es":"Describa un ascensor (carga nominal, velocidad, recorrido, paradas, accionamiento, tiempos de puertas), elija la categoría de uso o los viajes por día (o tómelos del simulador de ascensores) e introduzca la energía del ciclo de referencia y las potencias en reposo y en espera si están medidas. La herramienta aplica las tablas 1–4 y las fórmulas (1)–(17) de la ISO 25745-2:2015, y muestra la clase energética ISO (tabla 7) y las clases VDI 4707, los kWh anuales, el coste y el CO₂, el reparto marcha/parada, la energía según el uso y una cascada de medidas de mejora.","pl":"Opisz dźwig (udźwig, prędkość, wysokość podnoszenia, przystanki, napęd, czasy drzwi), wybierz kategorię użytkowania lub liczbę jazd na dobę (albo przejmij je z symulatora dźwigów) i wpisz energię cyklu odniesienia oraz moc w postoju i czuwaniu, jeśli zostały zmierzone. Narzędzie stosuje tablice 1–4 i wzory (1)–(17) ISO 25745-2:2015 oraz pokazuje klasę efektywności ISO (tablica 7) i klasy VDI 4707, roczne kWh, koszt i CO₂, udział jazdy i postoju, energię w funkcji użytkowania i kaskadę działań usprawniających."},

  "limitations": {"en":"One lift at a time; no group dispatching effect (excluded by ISO 25745-2:2015). The average car load, the load factor and the idle/standby time ratios follow ISO 25745-2:2015 Table 3, Formulae (6)–(11) and Table 4 for all six usage categories. For hydraulic lifts k_L uses the ISO/DIS sign (1 + c·%Q): the 2015 print of Formulae (9)–(11) shows 1 − c·%Q, which is taken as a misprint. Two standby levels (after 5 and after 30 minutes); without a separate 30-minute power the 5-minute power is used for both, as the Note to 5.3.4 allows. Classes follow VDI 4707 Blatt 1 (2009) as reprinted in public sources (the December 2007 draft is offered as a legacy option); the ISO 25745-2:2015 class (Table 7) is shown as well. Typical running energies, idle/standby powers of the example buildings and the lever savings are learning assumptions — enter measured values (ISO 25745-1) for any real decision.","uk":"Один ліфт за раз; без впливу групового керування (виключено в ISO 25745-2:2015). Середнє завантаження кабіни, коефіцієнт навантаження й частки часу простою та очікування — за ISO 25745-2:2015, табл. 3, формули (6)–(11) і табл. 4, для всіх шести категорій. Для гідравлічних ліфтів k_L береться зі знаком ISO/DIS (1 + c·%Q): у друці 2015 р. формули (9)–(11) мають 1 − c·%Q, що вважаємо друкарською помилкою. Два рівні очікування (після 5 і після 30 хв); без окремої потужності після 30 хв для обох береться потужність після 5 хв, як дозволяє примітка до 5.3.4. Класи — за VDI 4707 Blatt 1 (2009) у публічних передруках (проєкт грудня 2007 р. — як застарілий варіант); клас за ISO 25745-2:2015 (табл. 7) також показано. Типова енергія руху, потужності простою/очікування прикладів і ефект заходів — навчальні припущення; для реальних рішень вводьте виміряні значення (ISO 25745-1).","de":"Ein Aufzug zur Zeit; kein Einfluss der Gruppensteuerung (in ISO 25745-2:2015 ausgeschlossen). Mittlere Kabinenlast, Lastfaktor und Zeitanteile Stillstand/Standby nach ISO 25745-2:2015 Tabelle 3, Formeln (6)–(11) und Tabelle 4 für alle sechs Nutzungskategorien. Für Hydraulikaufzüge nutzt k_L das Vorzeichen der ISO/DIS (1 + c·%Q): der Druck 2015 der Formeln (9)–(11) zeigt 1 − c·%Q, was als Druckfehler gewertet wird. Zwei Standby-Stufen (nach 5 und nach 30 Minuten); ohne eigene 30-Minuten-Leistung gilt die 5-Minuten-Leistung für beide, wie die Anmerkung zu 5.3.4 erlaubt. Klassen nach VDI 4707 Blatt 1 (2009) laut öffentlichen Nachdrucken (der Entwurf vom Dezember 2007 als Altoption); die Klasse nach ISO 25745-2:2015 (Tabelle 7) wird ebenfalls gezeigt. Typische Fahrenergien, Stillstands-/Standby-Leistungen der Beispielgebäude und die Einsparungen der Maßnahmen sind Lernannahmen — für echte Entscheidungen Messwerte (ISO 25745-1) eingeben.","nl":"Eén lift tegelijk; geen effect van groepsbesturing (uitgesloten in ISO 25745-2:2015). De gemiddelde kooibelasting, de belastingsfactor en de tijdsaandelen rust/stand-by volgen ISO 25745-2:2015 tabel 3, formules (6)–(11) en tabel 4 voor alle zes gebruikscategorieën. Voor hydraulische liften gebruikt k_L het teken van de ISO/DIS (1 + c·%Q): de druk van 2015 van formules (9)–(11) toont 1 − c·%Q, wat als drukfout wordt beschouwd. Twee stand-byniveaus (na 5 en na 30 minuten); zonder apart 30-minutenvermogen geldt het 5-minutenvermogen voor beide, zoals de opmerking bij 5.3.4 toelaat. Klassen volgens VDI 4707 Blatt 1 (2009) zoals openbaar overgenomen (het ontwerp van december 2007 als verouderde optie); de klasse volgens ISO 25745-2:2015 (tabel 7) wordt ook getoond. Typische rijenergie, stilstand-/stand-byvermogen van de voorbeeldgebouwen en de besparing van maatregelen zijn leeraannames — voer voor echte beslissingen gemeten waarden in (ISO 25745-1).","fr":"Un ascenseur à la fois ; pas d’effet de la gestion de batterie (exclu par l’ISO 25745-2:2015). La charge moyenne de cabine, le facteur de charge et les ratios de temps arrêt/veille suivent l’ISO 25745-2:2015, tableau 3, formules (6)–(11) et tableau 4, pour les six catégories d’utilisation. Pour les ascenseurs hydrauliques, k_L prend le signe de l’ISO/DIS (1 + c·%Q) : l’impression 2015 des formules (9)–(11) porte 1 − c·%Q, considéré comme une coquille. Deux niveaux de veille (après 5 et après 30 minutes) ; sans puissance distincte à 30 minutes, la puissance à 5 minutes sert aux deux, comme le permet la note de 5.3.4. Classes selon la VDI 4707 Blatt 1 (2009) d’après des reproductions publiques (le projet de décembre 2007 reste une option ancienne) ; la classe ISO 25745-2:2015 (tableau 7) est aussi affichée. Les énergies de marche typiques, les puissances arrêt/veille des bâtiments d’exemple et les gains des leviers sont des hypothèses pédagogiques — saisissez des valeurs mesurées (ISO 25745-1) pour toute décision réelle.","es":"Un ascensor cada vez; sin efecto del control de grupo (excluido por la ISO 25745-2:2015). La carga media de cabina, el factor de carga y las proporciones de tiempo en reposo/espera siguen la ISO 25745-2:2015, tabla 3, fórmulas (6)–(11) y tabla 4, para las seis categorías de uso. En ascensores hidráulicos k_L usa el signo de la ISO/DIS (1 + c·%Q): la edición impresa de 2015 de las fórmulas (9)–(11) muestra 1 − c·%Q, que se considera una errata. Dos niveles de espera (tras 5 y tras 30 minutos); sin potencia propia a 30 minutos se usa la de 5 minutos para ambos, como permite la nota de 5.3.4. Clases según la VDI 4707 Blatt 1 (2009) en reproducciones públicas (el borrador de diciembre de 2007 queda como opción heredada); también se muestra la clase ISO 25745-2:2015 (tabla 7). Las energías de marcha típicas, las potencias en reposo/espera de los edificios de ejemplo y los ahorros de las medidas son supuestos didácticos — introduzca valores medidos (ISO 25745-1) para cualquier decisión real.","pl":"Jeden dźwig naraz; bez wpływu sterowania grupowego (wyłączonego w ISO 25745-2:2015). Średnie obciążenie kabiny, współczynnik obciążenia i udziały czasu postoju/czuwania według ISO 25745-2:2015, tablica 3, wzory (6)–(11) i tablica 4, dla wszystkich sześciu kategorii. Dla dźwigów hydraulicznych k_L ma znak z ISO/DIS (1 + c·%Q): w druku 2015 wzory (9)–(11) mają 1 − c·%Q, co uznajemy za błąd drukarski. Dwa poziomy czuwania (po 5 i po 30 minutach); bez osobnej mocy po 30 minutach dla obu przyjmuje się moc po 5 minutach, jak dopuszcza uwaga do 5.3.4. Klasy według VDI 4707 Blatt 1 (2009) z publicznych przedruków (projekt z grudnia 2007 jako opcja archiwalna); pokazujemy też klasę wg ISO 25745-2:2015 (tablica 7). Typowe energie jazdy, moce postoju/czuwania budynków przykładowych i efekty działań to założenia dydaktyczne — przy rzeczywistych decyzjach wpisz wartości zmierzone (ISO 25745-1)."},

  "validation": {"basis": {"en": "ISO 25745-2:2015 (licensed text): Tables 1–4, Formulae (1)–(18), energy class by Table 7; VDI 4707-1:2009 classes (the 2007 draft as a legacy option). Reproduces the ISO 25745-2:2015 Annex B example (class B), both worked examples of Barney & Lorente (with their ISO/DIS car load), the 2009 overall-class table for 630 kg and 1 m/s, two certificates issued under VDI 4707-1:2009 and the worked example of the 2007 draft (16.05 mWh/(kg·m), class F).", "uk": "ISO 25745-2:2015 (ліцензований текст): табл. 1–4, формули (1)–(18), клас за табл. 7; класи за VDI 4707-1:2009 (проєкт 2007 р. — як застарілий варіант). Відтворює приклад з додатка B ISO 25745-2:2015 (клас B), обидва приклади Barney & Lorente (з їхнім завантаженням за ISO/DIS), таблицю загальних класів 2009 р. для 630 кг і 1 м/с, два сертифікати за VDI 4707-1:2009 і приклад проєкту 2007 р. (16,05 мВт·год/(кг·м), клас F).", "de": "ISO 25745-2:2015 (lizenzierter Text): Tabellen 1–4, Formeln (1)–(18), Klasse nach Tabelle 7; Klassen nach VDI 4707-1:2009 (Entwurf 2007 als Altoption). Bildet das Beispiel aus Anhang B der ISO 25745-2:2015 (Klasse B), beide Rechenbeispiele von Barney & Lorente (mit ihrer ISO/DIS-Kabinenlast), die Gesamtklassentabelle 2009 für 630 kg und 1 m/s, zwei Zertifikate nach VDI 4707-1:2009 und das Beispiel des Entwurfs 2007 nach (16,05 mWh/(kg·m), Klasse F).", "nl": "ISO 25745-2:2015 (gelicentieerde tekst): tabel 1–4, formules (1)–(18), klasse volgens tabel 7; klassen volgens VDI 4707-1:2009 (ontwerp 2007 als verouderde optie). Reproduceert het voorbeeld uit bijlage B van ISO 25745-2:2015 (klasse B), beide rekenvoorbeelden van Barney & Lorente (met hun ISO/DIS-kooibelasting), de totaalklassentabel van 2009 voor 630 kg en 1 m/s, twee certificaten volgens VDI 4707-1:2009 en het voorbeeld van het ontwerp van 2007 (16,05 mWh/(kg·m), klasse F).", "fr": "ISO 25745-2:2015 (texte sous licence) : tableaux 1–4, formules (1)–(18), classe selon le tableau 7 ; classes selon la VDI 4707-1:2009 (projet 2007 en option ancienne). Reproduit l’exemple de l’annexe B de l’ISO 25745-2:2015 (classe B), les deux exemples de Barney & Lorente (avec leur charge ISO/DIS), le tableau des classes globales 2009 pour 630 kg et 1 m/s, deux certificats établis selon la VDI 4707-1:2009 et l’exemple du projet 2007 (16,05 mWh/(kg·m), classe F).", "es": "ISO 25745-2:2015 (texto con licencia): tablas 1–4, fórmulas (1)–(18), clase según la tabla 7; clases según la VDI 4707-1:2009 (borrador 2007 como opción heredada). Reproduce el ejemplo del anexo B de la ISO 25745-2:2015 (clase B), los dos ejemplos de Barney & Lorente (con su carga ISO/DIS), la tabla de clases globales de 2009 para 630 kg y 1 m/s, dos certificados emitidos según la VDI 4707-1:2009 y el ejemplo del borrador de 2007 (16,05 mWh/(kg·m), clase F).", "pl": "ISO 25745-2:2015 (tekst licencjonowany): tablice 1–4, wzory (1)–(18), klasa wg tablicy 7; klasy według VDI 4707-1:2009 (projekt 2007 jako opcja archiwalna). Odtwarza przykład z załącznika B ISO 25745-2:2015 (klasa B), oba przykłady Barney & Lorente (z ich obciążeniem wg ISO/DIS), tablicę klas łącznych 2009 dla 630 kg i 1 m/s, dwa certyfikaty wg VDI 4707-1:2009 i przykład projektu z 2007 (16,05 mWh/(kg·m), klasa F)."}, "independent_validation": false, "benchmarks": [{"id": "liftenergy-method-2026-11-06-r3", "reference": {"en": "44 cases computed on the page against an independent Python implementation: the published worked examples (Barney & Lorente 1–2 also recomputed with their rounded inputs, the VDI 2007 draft example), two certificates issued under VDI 4707-1:2009 (printed classes and kWh/a), VDI 2009 usage categories 1–5, the ISO 25745-2:2015 Annex B example (class B), ISO usage categories 1–6, traction 30 %, a separate 30-minute standby power, the ISO Table 7 class of every case, five rated loads, 2/3/4 stops, all drives and counterbalances, known trips 40–4,000/day, short-cycle method, overridden tables, the saturation flag and zero standing power.", "uk": "44 випадки, обчислених на сторінці, проти незалежної реалізації на Python: опубліковані приклади (Barney & Lorente 1–2 також перераховано з їхніми округленими вхідними даними, приклад проєкту VDI 2007), два сертифікати за VDI 4707-1:2009 (надруковані класи й кВт·год/рік), категорії VDI 2009 1–5, приклад з додатка B ISO 25745-2:2015 (клас B), категорії ISO 1–6, тягову лебідку з противагою 30 %, окрему потужність очікування після 30 хв, клас ISO за табл. 7 у кожному випадку, п’ять значень вантажопідйомності, 2/3/4 зупинки, усі приводи й противаги, відомі поїздки 40–4 000 на добу, метод короткого циклу, замінені таблиці, прапорець насичення й нульова потужність стоянки.", "de": "44 auf der Seite gerechnete Fälle gegen eine unabhängige Python-Implementierung: die veröffentlichten Rechenbeispiele (Barney & Lorente 1–2 auch mit ihren gerundeten Eingaben nachgerechnet, Beispiel des VDI-Entwurfs 2007), zwei Zertifikate nach VDI 4707-1:2009 (gedruckte Klassen und kWh/a), VDI-2009-Nutzungskategorien 1–5, das Beispiel aus Anhang B der ISO 25745-2:2015 (Klasse B), ISO-Nutzungskategorien 1–6, Treibscheibe mit 30 % Ausgleich, eine eigene 30-Minuten-Standby-Leistung, die ISO-Klasse nach Tabelle 7 in jedem Fall, fünf Nennlasten, 2/3/4 Haltestellen, alle Antriebe und Gewichtsausgleiche, bekannte Fahrten 40–4 000/Tag, Kurzzyklusverfahren, überschriebene Tabellen, die Überlastungsmarke und Stillstandsleistung null.", "nl": "44 op de pagina berekende gevallen tegen een onafhankelijke Python-implementatie: de gepubliceerde rekenvoorbeelden (Barney & Lorente 1–2 ook herberekend met hun afgeronde invoer, het voorbeeld van het VDI-ontwerp 2007), twee certificaten volgens VDI 4707-1:2009 (gedrukte klassen en kWh/jaar), VDI-2009-gebruikscategorieën 1–5, het voorbeeld uit bijlage B van ISO 25745-2:2015 (klasse B), ISO-gebruikscategorieën 1–6, tractie met 30 % tegenwicht, een apart stand-byvermogen na 30 minuten, de ISO-klasse volgens tabel 7 in elk geval, vijf nominale lasten, 2/3   'n.simlegacy': ['The simulator result has no counts for the arrival window, so trips per hour come from the whole run divided by the window and are too high (by about 15–27 % in our checks). Run the lift waiting time simulator again and save its result.', 'Результат симулятора не містить лічильників для вікна прибуття, тому поїздки за годину пораховано як увесь прогін, поділений на вікно, — вони завищені (у наших перевірках приблизно на 15–27 %). Запустіть симулятор часу очікування ще раз і збережіть результат.', 'Das Simulatorergebnis enthält keine Zählung für das Ankunftsfenster; die Fahrten pro Stunde stammen aus dem ganzen Lauf geteilt durch das Fenster und sind zu hoch (in unseren Prüfungen um etwa 15–27 %). Den Wartezeit-Simulator erneut laufen lassen und das Ergebnis speichern.', 'Het simulatorresultaat bevat geen tellingen voor het aankomstvenster, dus de ritten per uur komen uit de hele run gedeeld door het venster en zijn te hoog (in onze controles ongeveer 15–27 %). Laat de wachttijdsimulator opnieuw lopen en sla het resultaat op.', 'Le résultat du simulateur ne contient pas de comptage pour la fenêtre d’arrivée : les trajets par heure viennent de toute la simulation divisée par la fenêtre et sont trop élevés (d’environ 15–27 % dans nos contrôles). Relancez le simulateur de temps d’attente et enregistrez son résultat.', 'El resultado del simulador no tiene recuentos para la ventana de llegadas, así que los viajes por hora salen de toda la simulación dividida por la ventana y son demasiado altos (un 15–27 % en nuestras pruebas). Vuelva a ejecutar el simulador de tiempo de espera y guarde su resultado.', 'Wynik symulatora nie zawiera zliczeń dla okna przybyć, więc jazdy na godzinę pochodzą z całego przebiegu podzielonego przez okno i są zawyżone (w naszych sprawdzeniach o ok. 15–27 %). Uruchom ponownie symulator czasu oczekiwania i zapisz wynik.'],

  'n.erc': ['The reference-cycle energy is a typical value for the drive, not a measurement. Enter E_rc measured per ISO 25745-1 to make the result about your lift.', 'Енергія еталонного циклу — типове значення для приводу, а не вимір. Введіть E_rc, виміряну за ISO 25745-1, щоб результат стосувався саме вашого ліфта.', 'Die Referenzfahrt-Energie ist ein typischer Wert für den Antrieb, keine Messung. Geben Sie E_rc nach ISO 25745-1 gemessen ein, damit das Ergebnis Ihren Aufzug beschreibt.', 'De energie van de referentiecyclus is een typische waarde voor de aandrijving, geen meting. Voer E_rc in, gemeten volgens ISO 25745-1, zodat het resultaat over uw lift gaat.', 'L’énergie du cycle de référence est une valeur typique de l’entraînement, pas une mesure. Saisissez E_rc mesurée selon l’ISO 25745-1 pour que le résultat concerne votre ascenseur.', 'La energía del ciclo de referencia es un valor típico del accionamiento, no una medida. Introduzca E_rc medida según ISO 25745-1 para que el resultado sea de su ascensor.', 'Energia cyklu odniesienia to wartość typowa dla napędu, a nie pomiar. Wpisz E_rc zmierzoną wg ISO 25745-1, aby wynik dotyczył Twojego dźwigu.'],
  'n.sat': ['The trips do not fit into 24 hours with this trip time: the lift would be saturated. Check the trips per day.', 'Поїздки не вміщуються в 24 години за такого часу поїздки: ліфт був би перевантажений. Перевірте кількість поїздок.', 'Die Fahrten passen bei dieser Fahrzeit nicht in 24 Stunden: der Aufzug wäre überlastet. Fahrten pro Tag prüfen.', 'De ritten passen bij deze rittijd niet in 24 uur: de lift zou verzadigd zijn. Controleer de ritten per dag.', 'Les trajets ne tiennent pas en 24 heures avec cette durée : l’ascenseur serait saturé. Vérifiez les trajets par jour.', 'Los viajes no caben en 24 horas con este tiempo: el ascensor estaría saturado. Revise los viajes por día.', 'Jazdy nie mieszczą się w 24 godzinach przy tym czasie jazdy: dźwig byłby przeciążony. Sprawdź liczbę jazd.'],
  'n.short': ['The short cycle gives a negative start/stop energy — check E_sc and s_sc.', 'Короткий цикл дає від’ємну енергію пуску/зупинки — перевірте E_sc і s_sc.', 'Der Kurzzyklus ergibt eine negative Anfahr-/Halteenergie — E_sc und s_sc prüfen.', 'De korte cyclus geeft een negatieve start/stop-energie — controleer E_sc en s_sc.', 'Le cycle court donne une énergie de démarrage/arrêt négative — vérifiez E_sc et s_sc.', 'El ciclo corto da una energía de arranque/parada negativa — revise E_sc y s_sc.', 'Krótki cykl daje ujemną energię rozruchu/zatrzymania — sprawdź E_sc i s_sc.'],
  'n.nosim': ['No simulator results in the scenario yet. Run the lift waiting time simulator on the same building and save its results.', 'У сценарії ще немає результатів симулятора. Запустіть симулятор очікування ліфта для тієї ж будівлі та збережіть результати.', 'Im Szenario sind noch keine Simulatorergebnisse. Den Wartezeitsimulator für dasselbe Gebäude laufen lassen und die Ergebnisse speichern.', 'Er zijn nog geen simulatorresultaten in het scenario. Draai de wachttijdsimulator op hetzelfde gebouw en sla de resultaten op.', 'Pas encore de résultats du simulateur dans le scénario. Lancez le simulateur d’attente sur le même bâtiment et enregistrez ses résultats.', 'Aún no hay resultados del simulador en el escenario. Ejecute el simulador de espera para el mismo edificio y guarde sus resultados.', 'W scenariuszu nie ma jeszcze wyników symulatora. Uruchom symulator czasu oczekiwania dla tego samego budynku i zapisz wyniki.'],

  'n.nostore': ['This browser does not allow storage; use the JSON export instead.', 'Цей браузер не дозволяє зберігання; скористайтеся експортом JSON.', 'Dieser Browser erlaubt keine Speicherung; bitte den JSON-Export nutzen.', 'Deze browser staat geen opslag toe; gebruik de JSON-export.', 'Ce navigateur n’autorise pas le stockage ; utilisez l’export JSON.', 'Este navegador no permite almacenamiento; use la exportación JSON.', 'Ta przeglądarka nie pozwala na zapis; użyj eksportu JSON.'],
  'footer': ['ISO 25745-2:2015: E_d = E_rd + E_nr; E_rd = k_L · n_d · E_rav / 2 (5); E_rav = E_rc · s_av / s_rc (4) or 2·E_rm·s_av + 2·E_ssc (1)–(3); s_av = p_av · s_rc (Table 2). Non-running: E_nr = (24 − n_d·t_av/3600) · (P_id·R_id + P_st5·R_st5 + P_st30·R_st30) (15), t_av = s_av/v + v/a + a/j + t_d (13). Annual E_y = E_d · d_op. VDI 4707-1:2009 Eq. 1 (default; draft 2007 as legacy): specific demand = (e_travel·Q·s + P_st·t_st)/(s·Q) with s = v · travel hours of the category. Sources: ISO 25745-1:2012, ISO 25745-2:2015, Barney G., Lorente A.: Simplified energy calculations for lifts based on ISO/DIS 25745-2, 3rd Symposium on Lift and Escalator Technologies, 2013; VDI 4707 Blatt 1 (2009) as reprinted in Zukunft Bau, Energiekennwerte von Personenaufzügen (2015), Tables 3, 5–7; VDI 4707 draft, December 2007 (legacy).',
    'ISO 25745-2:2015: E_d = E_rd + E_nr; E_rd = k_L · n_d · E_rav / 2 (5); E_rav = E_rc · s_av / s_rc (4) або 2·E_rm·s_av + 2·E_ssc (1)–(3); s_av = p_av · s_rc (табл. 2). Стоянка: E_nr = (24 − n_d·t_av/3600) · (P_id·R_id + P_st5·R_st5 + P_st30·R_st30) (15), t_av = s_av/v + v/a + a/j + t_d (13). Річна E_y = E_d · d_op. VDI 4707-1:2009, рівн. 1 (типово; проєкт 2007 — застарілий варіант): питома потреба = (e_travel·Q·s + P_st·t_st)/(s·Q), s = v · години руху категорії. Джерела: ISO 25745-1:2012, ISO 25745-2:2015, Barney G., Lorente A., 3rd Symposium on Lift and Escalator Technologies, 2013; VDI 4707 Blatt 1 (2009) за передруком Zukunft Bau, Energiekennwerte von Personenaufzügen (2015), табл. 3, 5–7; проєкт VDI 4707, грудень 2007 (застарілий).',
    'ISO 25745-2:2015: E_d = E_rd + E_nr; E_rd = k_L · n_d · E_rav / 2 (5); E_rav = E_rc · s_av / s_rc (4) oder 2·E_rm·s_av + 2·E_ssc (1)–(3); s_av = p_av · s_rc (Tabelle 2). Stillstand: E_nr = (24 − n_d·t_av/3600) · (P_id·R_id + P_st5·R_st5 + P_st30·R_st30) (15), t_av = s_av/v + v/a + a/j + t_d (13). Jahr: E_y = E_d · d_op. VDI 4707-1:2009, Gl. 1 (Standard; Entwurf 2007 als Altoption): spezifischer Bedarf = (e_Fahrt·Q·s + P_st·t_st)/(s·Q), s = v · Fahrstunden der Kategorie. Quellen: ISO 25745-1:2012, ISO 25745-2:2015, Barney G., Lorente A., 3rd Symposium on Lift and Escalator Technologies, 2013; VDI 4707 Blatt 1 (2009) nach dem Nachdruck in Zukunft Bau, Energiekennwerte von Personenaufzügen (2015), Tabellen 3, 5–7; VDI 4707 Entwurf, Dezember 2007 (Altoption).',
    'ISO 25745-2:2015: E_d = E_rd + E_nr; E_rd = k_L · n_d · E_rav / 2 (5); E_rav = E_rc · s_av / s_rc (4) of 2·E_rm·s_av + 2·E_ssc (1)–(3); s_av = p_av · s_rc (tabel 2). Stilstand: E_nr = (24 − n_d·t_av/3600) · (P_id·R_id + P_st5·R_st5 + P_st30·R_st30) (15), t_av = s_av/v + v/a + a/j + t_d (13). Jaar: E_y = E_d · d_op. VDI 4707-1:2009, vgl. 1 (standaard; ontwerp 2007 als verouderde optie): specifieke vraag = (e_rit·Q·s + P_st·t_st)/(s·Q), s = v · rijuren van de categorie. Bronnen: ISO 25745-1:2012, ISO 25745-2:2015, Barney G., Lorente A., 3rd Symposium on Lift and Escalator Technologies, 2013; VDI 4707 Blatt 1 (2009) volgens de overname in Zukunft Bau, Energiekennwerte von Personenaufzügen (2015), tabellen 3, 5–7; VDI 4707-ontwerp, december 2007 (verouderd).',
    'ISO 25745-2:2015 : E_d = E_rd + E_nr ; E_rd = k_L · n_d · E_rav / 2 (5) ; E_rav = E_rc · s_av / s_rc (4) ou 2·E_rm·s_av + 2·E_ssc (1)–(3) ; s_av = p_av · s_rc (tableau 2). Arrêt : E_nr = (24 − n_d·t_av/3600) · (P_id·R_id + P_st5·R_st5 + P_st30·R_st30) (15), t_av = s_av/v + v/a + a/j + t_d (13). Annuel : E_y = E_d · d_op. VDI 4707-1:2009, éq. 1 (par défaut ; projet 2007 en option ancienne) : besoin spécifique = (e_marche·Q·s + P_st·t_st)/(s·Q), s = v · heures de marche de la catégorie. Sources : ISO 25745-1:2012, ISO 25745-2:2015, Barney G., Lorente A., 3rd Symposium on Lift and Escalator Technologies, 2013  ; VDI 4707 Blatt 1 (2009) d’après la reproduction dans Zukunft Bau, Energiekennwerte von Personenaufzügen (2015), tableaux 3, 5–7 ; projet VDI 4707, décembre 2007 (ancien).',
    'ISO 25745-2:2015: E_d = E_rd + E_nr; E_rd = k_L · n_d · E_rav / 2 (5); E_rav = E_rc · s_av / s_rc (4) o 2·E_rm·s_av + 2·E_ssc (1)–(3); s_av = p_av · s_rc (tabla 2). Parada: E_nr = (24 − n_d·t_av/3600) · (P_id·R_id + P_st5·R_st5 + P_st30·R_st30) (15), t_av = s_av/v + v/a + a/j + t_d (13). Anual: E_y = E_d · d_op. VDI 4707-1:2009, ec. 1 (por defecto; borrador 2007 como opción heredada): demanda específica = (e_marcha·Q·s + P_st·t_st)/(s·Q), s = v · horas de marcha de la categoría. Fuentes: ISO 25745-1:2012, ISO 25745-2:2015, Barney G., Lorente A., 3rd Symposium on Lift and Escalator Technologies, 2013; VDI 4707 Blatt 1 (2009) según la reproducción en Zukunft Bau, Energiekennwerte von Personenaufzügen (2015), tablas 3, 5–7; borrador VDI 4707, diciembre de 2007 (heredado).',
    'ISO 25745-2:2015: E_d = E_rd + E_nr; E_rd = k_L · n_d · E_rav / 2 (5); E_rav = E_rc · s_av / s_rc (4) lub 2·E_rm·s_av + 2·E_ssc (1)–(3); s_av = p_av · s_rc (tablica 2). Postój: E_nr = (24 − n_d·t_av/3600) · (P_id·R_id + P_st5·R_st5 + P_st30·R_st30) (15), t_av = s_av/v + v/a + a/j + t_d (13). Rocznie: E_y = E_d · d_op. VDI 4707-1:2009, równ. 1 (domyślnie; projekt 2007 jako opcja archiwalna): zapotrzebowanie jednostkowe = (e_jazdy·Q·s + P_st·t_st)/(s·Q), s = v · godziny jazdy kategorii. Źródła: ISO 25745-1:2012, ISO 25745-2:2015, Barney G., Lorente A., 3rd Symposium on Lift and Escalator Technologies, 2013; VDI 4707 Blatt 1 (2009) według przedruku w Zukunft Bau, Energiekennwerte von Personenaufzügen (2015), tablice 3, 5–7; projekt VDI 4707, grudzień 2007 (archiwalny).']
};

var PL = {
  barney_office: [['Busy office lift (published example)', 'Завантажений офісний ліфт (опублікований приклад)', 'Stark genutzter Büroaufzug (veröffentlichtes Beispiel)', 'Druk gebruikte kantoorlift (gepubliceerd voorbeeld)', 'Ascenseur de bureau très utilisé (exemple publié)', 'Ascensor de oficina muy usado (ejemplo publicado)', 'Mocno używany dźwig biurowy (przykład opublikowany)'],
    ['1600 kg, 2.5 m/s, 1,500 trips a day, measured E_rc 170 Wh (Barney & Lorente 2013, ISO/DIS s_av 33 %; with the 2015 car load 5 % — the paper’s DIS 7 % gives 41.7 kWh). Aha: running is about 90 % of the 43 kWh a day — the drive matters, standby hardly.', '1600 кг, 2,5 м/с, 1 500 поїздок на добу, виміряна E_rc 170 Вт·год (Barney & Lorente 2013, s_av за ISO/DIS 33 %; із завантаженням 5 % за 2015 р. — 7 % за DIS у статті дають 41,7 кВт·год). Ага: рух — близько 90 % із 43 кВт·год на добу; важить привід, а не очікування.', '1600 kg, 2,5 m/s, 1 500 Fahrten am Tag, gemessene E_rc 170 Wh (Barney & Lorente 2013, ISO/DIS s_av 33 %; mit der Kabinenlast 5 % von 2015 — die 7 % der DIS im Aufsatz ergeben 41,7 kWh). Aha: rund 90 % der 43 kWh am Tag sind Fahrt — der Antrieb zählt, der Standby kaum.', '1600 kg, 2,5 m/s, 1 500 ritten per dag, gemeten E_rc 170 Wh (Barney & Lorente 2013, ISO/DIS s_av 33 %; met de kooibelasting 5 % van 2015 — de 7 % van de DIS in het artikel geeft 41,7 kWh). Aha: rijden is ongeveer 90 % van de 43 kWh per dag — de aandrijving telt, stand-by nauwelijks.', '1600 kg, 2,5 m/s, 1 500 trajets par jour, E_rc mesurée 170 Wh (Barney & Lorente 2013, s_av ISO/DIS 33 % ; avec la charge 5 % de 2015 — les 7 % de la DIS de l’article donnent 41,7 kWh). Aha : la marche fait environ 90 % des 43 kWh par jour — c’est l’entraînement qui compte, pas la veille.', '1600 kg, 2,5 m/s, 1 500 viajes al día, E_rc medida 170 Wh (Barney & Lorente 2013, s_av ISO/DIS 33 %; con la carga 5 % de 2015 — el 7 % de la DIS del artículo da 41,7 kWh). Ajá: la marcha es cerca del 90 % de los 43 kWh diarios — importa el accionamiento, apenas la espera.', '1600 kg, 2,5 m/s, 1 500 jazd na dobę, zmierzona E_rc 170 Wh (Barney & Lorente 2013, s_av wg ISO/DIS 33 %; z obciążeniem 5 % wg 2015 — 7 % wg DIS z artykułu daje 41,7 kWh). Aha: jazda to ok. 90 % z 43 kWh na dobę — liczy się napęd, czuwanie prawie wcale.']],
  barney_hydraulic: [['Little-used hydraulic lift (published example)', 'Мало використовуваний гідравлічний ліфт (опублікований приклад)', 'Wenig genutzter Hydraulikaufzug (veröffentlichtes Beispiel)', 'Weinig gebruikte hydraulische lift (gepubliceerd voorbeeld)', 'Ascenseur hydraulique peu utilisé (exemple publié)', 'Ascensor hidráulico poco usado (ejemplo publicado)', 'Mało używany dźwig hydrauliczny (przykład opublikowany)'],
    ['500 kg, 0.6 m/s, 30 trips a day, measured E_rc 91 Wh (Barney & Lorente 2013). Aha: standing still uses more than moving — about 0.8 against 0.6 kWh a day.', '500 кг, 0,6 м/с, 30 поїздок на добу, виміряна E_rc 91 Вт·год (Barney & Lorente 2013). Ага: стоянка споживає більше, ніж рух, — близько 0,8 проти 0,6 кВт·год на добу.', '500 kg, 0,6 m/s, 30 Fahrten am Tag, gemessene E_rc 91 Wh (Barney & Lorente 2013). Aha: Stillstehen braucht mehr als Fahren — etwa 0,8 gegen 0,6 kWh am Tag.', '500 kg, 0,6 m/s, 30 ritten per dag, gemeten E_rc 91 Wh (Barney & Lorente 2013). Aha: stilstaan kost meer dan rijden — ongeveer 0,8 tegen 0,6 kWh per dag.', '500 kg, 0,6 m/s, 30 trajets par jour, E_rc mesurée 91 Wh (Barney & Lorente 2013). Aha : rester à l’arrêt consomme plus que rouler — environ 0,8 contre 0,6 kWh par jour.', '500 kg, 0,6 m/s, 30 viajes al día, E_rc medida 91 Wh (Barney & Lorente 2013). Ajá: estar parado consume más que moverse — unos 0,8 frente a 0,6 kWh al día.', '500 kg, 0,6 m/s, 30 jazd na dobę, zmierzona E_rc 91 Wh (Barney & Lorente 2013). Aha: postój zużywa więcej niż jazda — ok. 0,8 wobec 0,6 kWh na dobę.']],
  residential10: [['Block of flats, one lift', 'Житловий будинок, один ліфт', 'Wohnhaus, ein Aufzug', 'Appartementengebouw, één lift', 'Immeuble d’habitation, un ascenseur', 'Edificio de viviendas, un ascensor', 'Budynek mieszkalny, jeden dźwig'],
    ['630 kg, 1 m/s, 11 stops, category 2; idle/standby powers are learning assumptions. Aha: about 80 % of the energy is spent standing still — a deep standby saves more than a regenerative drive would.', '630 кг, 1 м/с, 11 зупинок, категорія 2; потужності простою/очікування — навчальні припущення. Ага: близько 80 % енергії йде на стоянку — глибоке очікування заощаджує більше, ніж рекуперативний привід.', '630 kg, 1 m/s, 11 Haltestellen, Kategorie 2; Stillstands-/Standby-Leistung sind Lernannahmen. Aha: rund 80 % der Energie fallen im Stillstand an — ein tiefer Standby spart mehr als eine Rückspeisung.', '630 kg, 1 m/s, 11 stopplaatsen, categorie 2; stilstand- en stand-byvermogen zijn leeraannames. Aha: ongeveer 80 % van de energie gaat op aan stilstaan — een diepe stand-by bespaart meer dan teruglevering.', '630 kg, 1 m/s, 11 niveaux, catégorie 2 ; puissances arrêt/veille : hypothèses pédagogiques. Aha : environ 80 % de l’énergie est consommée à l’arrêt — une veille profonde économise plus qu’un variateur régénératif.', '630 kg, 1 m/s, 11 paradas, categoría 2; potencias en reposo/espera: supuestos didácticos. Ajá: cerca del 80 % de la energía se gasta parado — una espera profunda ahorra más que un accionamiento regenerativo.', '630 kg, 1 m/s, 11 przystanków, kategoria 2; moce postoju/czuwania to założenia dydaktyczne. Aha: ok. 80 % energii zużywa postój — głębokie czuwanie oszczędza więcej niż odzysk energii.']],
  residential10_2: [['Same flats, two lifts', 'Ті самі квартири, два ліфти', 'Dieselben Wohnungen, zwei Aufzüge', 'Dezelfde woningen, twee liften', 'Mêmes logements, deux ascenseurs', 'Mismas viviendas, dos ascensores', 'Te same mieszkania, dwa dźwigi'],
    ['Each lift does half the trips (category 1) but stands all day. Aha: the building’s lift energy rises by about three quarters, not by nothing — compare the "all identical lifts" tile with the one-lift preset.', 'Кожен ліфт робить половину поїздок (категорія 1), але стоїть цілий день. Ага: енергія ліфтів будинку зростає приблизно на три чверті, а не лишається тією самою — порівняйте плитку «усі однакові ліфти» з прикладом з одним ліфтом.', 'Jeder Aufzug macht die Hälfte der Fahrten (Kategorie 1), steht aber den ganzen Tag. Aha: der Aufzugsenergiebedarf des Hauses steigt um etwa drei Viertel, nicht um nichts — Kachel „alle gleichen Aufzüge“ mit dem Ein-Aufzug-Beispiel vergleichen.', 'Elke lift doet de helft van de ritten (categorie 1) maar staat de hele dag. Aha: de liftenergie van het gebouw stijgt met ongeveer driekwart, niet met niets — vergelijk de tegel "alle gelijke liften" met het voorbeeld met één lift.', 'Chaque ascenseur fait la moitié des trajets (catégorie 1) mais reste en place toute la journée. Aha : l’énergie des ascenseurs de l’immeuble augmente d’environ trois quarts, et non de rien — comparez la tuile « tous les ascenseurs identiques » avec l’exemple à un ascenseur.', 'Cada ascensor hace la mitad de los viajes (categoría 1) pero está parado todo el día. Ajá: la energía de ascensores del edificio sube cerca de tres cuartos, no nada — compare la ficha «todos los ascensores iguales» con el ejemplo de un ascensor.', 'Każdy dźwig wykonuje połowę jazd (kategoria 1), ale stoi cały dzień. Aha: energia dźwigów budynku rośnie o ok. trzy czwarte, a nie wcale — porównaj kafelek „wszystkie jednakowe dźwigi” z przykładem z jednym dźwigiem.']],
  office15: [['Office tower car, high usage', 'Ліфт офісної вежі, висока інтенсивність', 'Büroturm-Aufzug, hohe Nutzung', 'Lift van een kantoortoren, hoog gebruik', 'Cabine de tour de bureaux, forte utilisation', 'Cabina de torre de oficinas, uso alto', 'Dźwig biurowca, duże użytkowanie'],
    ['1275 kg, 2.5 m/s, 17 stops, category 4, gearless without regeneration. Aha: a regenerative drive is the largest lever here, ahead of deep standby and LED light.', '1275 кг, 2,5 м/с, 17 зупинок, категорія 4, безредукторний без рекуперації. Ага: рекуперативний привід тут — найбільший захід, попереду глибокого очікування й LED.', '1275 kg, 2,5 m/s, 17 Haltestellen, Kategorie 4, getriebelos ohne Rückspeisung. Aha: die Rückspeisung ist hier die größte Maßnahme, vor tiefem Standby und LED-Licht.', '1275 kg, 2,5 m/s, 17 stopplaatsen, categorie 4, tandwielloos zonder teruglevering. Aha: teruglevering is hier de grootste maatregel, vóór diepe stand-by en LED-licht.', '1275 kg, 2,5 m/s, 17 niveaux, catégorie 4, sans réducteur ni régénération. Aha : le variateur régénératif est ici le plus grand levier, devant la veille profonde et la LED.', '1275 kg, 2,5 m/s, 17 paradas, categoría 4, sin reductor ni regeneración. Ajá: aquí el accionamiento regenerativo es la mayor medida, por delante de la espera profunda y la LED.', '1275 kg, 2,5 m/s, 17 przystanków, kategoria 4, bezprzekładniowy bez odzysku. Aha: odzysk energii jest tu największym działaniem, przed głębokim czuwaniem i LED.']],
  hospital8: [['Hospital bed lift', 'Лікарняний ліжковий ліфт', 'Krankenhaus-Bettenaufzug', 'Beddenlift ziekenhuis', 'Monte-lit d’hôpital', 'Montacamas de hospital', 'Dźwig szpitalny łóżkowy'],
    ['2500 kg, 1.6 m/s, slow doors, category 4. Aha: an empty big car is what you pay for — the average load is only 2.2 % of rated load, and each trip costs about 1.7 times the office car’s.', '2500 кг, 1,6 м/с, повільні двері, категорія 4. Ага: платите за велику порожню кабіну — середнє завантаження лише 2,2 % від номіналу, а кожна поїздка коштує приблизно в 1,7 раза більше, ніж в офісному ліфті.', '2500 kg, 1,6 m/s, langsame Türen, Kategorie 4. Aha: bezahlt wird die große leere Kabine — die mittlere Last ist nur 2,2 % der Nennlast, jede Fahrt kostet etwa das 1,7-Fache des Büroaufzugs.', '2500 kg, 1,6 m/s, trage deuren, categorie 4. Aha: u betaalt voor een grote lege kooi — de gemiddelde last is maar 2,2 % van de nominale last, en elke rit kost ongeveer 1,7 keer die van de kantoorlift.', '2500 kg, 1,6 m/s, portes lentes, catégorie 4. Aha : on paie une grande cabine vide — la charge moyenne n’est que de 2,2 % de la nominale, et chaque trajet coûte environ 1,7 fois celui de la cabine de bureau.', '2500 kg, 1,6 m/s, puertas lentas, categoría 4. Ajá: se paga una cabina grande vacía — la carga media es solo el 2,2 % de la nominal y cada viaje cuesta unas 1,7 veces el de la cabina de oficina.', '2500 kg, 1,6 m/s, wolne drzwi, kategoria 4. Aha: płaci się za dużą pustą kabinę — średnie obciążenie to tylko 2,2 % udźwigu, a każda jazda kosztuje ok. 1,7 raza więcej niż w dźwigu biurowym.']],
  hotel20: [['Hotel, modern regenerative lift', 'Готель, сучасний ліфт з рекуперацією', 'Hotel, moderner Aufzug mit Rückspeisung', 'Hotel, moderne terugleverende lift', 'Hôtel, ascenseur moderne régénératif', 'Hotel, ascensor moderno regenerativo', 'Hotel, nowoczesny dźwig z odzyskiem'],
    ['1275 kg, 2.5 m/s, 21 stops, 365 days, already regenerative. Aha: only standby and lighting are left to improve — about a tenth of the energy.', '1275 кг, 2,5 м/с, 21 зупинка, 365 днів, уже з рекуперацією. Ага: покращити можна лише очікування й освітлення — приблизно десяту частину енергії.', '1275 kg, 2,5 m/s, 21 Haltestellen, 365 Tage, bereits mit Rückspeisung. Aha: verbessern lassen sich nur noch Standby und Licht — etwa ein Zehntel der Energie.', '1275 kg, 2,5 m/s, 21 stopplaatsen, 365 dagen, al terugleverend. Aha: alleen stand-by en verlichting zijn nog te verbeteren — ongeveer een tiende van de energie.', '1275 kg, 2,5 m/s, 21 niveaux, 365 jours, déjà régénératif. Aha : il ne reste que la veille et l’éclairage à améliorer — environ un dixième de l’énergie.', '1275 kg, 2,5 m/s, 21 paradas, 365 días, ya regenerativo. Ajá: solo quedan por mejorar la espera y la iluminación — cerca de una décima parte de la energía.', '1275 kg, 2,5 m/s, 21 przystanków, 365 dni, już z odzyskiem. Aha: do poprawy zostaje tylko czuwanie i oświetlenie — ok. jedna dziesiąta energii.']],
  vdi_example: [['VDI 4707 worked example (draft 2007)', 'Розрахунковий приклад VDI 4707 (проєкт 2007)', 'Rechenbeispiel der VDI 4707 (Entwurf 2007)', 'Rekenvoorbeeld VDI 4707 (ontwerp 2007)', 'Exemple de calcul VDI 4707 (projet 2007)', 'Ejemplo de cálculo VDI 4707 (borrador 2007)', 'Przykład obliczeniowy VDI 4707 (projekt 2007)'],
    ['320 kg hydraulic, 0.63 m/s, 110 W standby, 8.93 mWh/(kg·m): 16.05 mWh/(kg·m), class F as in the guideline. Aha: set 750 trips a day and the same lift falls to G — busier categories have stricter limits.', 'Гідравлічний 320 кг, 0,63 м/с, очікування 110 Вт, 8,93 мВт·год/(кг·м): 16,05 мВт·год/(кг·м), клас F, як у настанові. Ага: задайте 750 поїздок на добу — той самий ліфт падає до G, бо інтенсивніші категорії мають суворіші межі.', 'Hydraulik 320 kg, 0,63 m/s, 110 W Standby, 8,93 mWh/(kg·m): 16,05 mWh/(kg·m), Klasse F wie in der Richtlinie. Aha: bei 750 Fahrten am Tag fällt derselbe Aufzug auf G — intensivere Kategorien haben strengere Grenzen.', 'Hydraulisch 320 kg, 0,63 m/s, 110 W stand-by, 8,93 mWh/(kg·m): 16,05 mWh/(kg·m), klasse F zoals in de richtlijn. Aha: stel 750 ritten per dag in en dezelfde lift zakt naar G — drukkere categorieën hebben strengere grenzen.', 'Hydraulique 320 kg, 0,63 m/s, veille 110 W, 8,93 mWh/(kg·m) : 16,05 mWh/(kg·m), classe F comme dans la directive. Aha : à 750 trajets par jour le même ascenseur tombe en G — les catégories plus intenses ont des limites plus sévères.', 'Hidráulico 320 kg, 0,63 m/s, espera 110 W, 8,93 mWh/(kg·m): 16,05 mWh/(kg·m), clase F como en la directriz. Ajá: con 750 viajes al día el mismo ascensor baja a G — las categorías más intensas tienen límites más estrictos.', 'Hydrauliczny 320 kg, 0,63 m/s, czuwanie 110 W, 8,93 mWh/(kg·m): 16,05 mWh/(kg·m), klasa F jak w wytycznej. Aha: ustaw 750 jazd na dobę, a ten sam dźwig spada do G — intensywniejsze kategorie mają ostrzejsze granice.']]

var LEARN = {
  version: 1,
  intro: { title: T7(['What this tool does', 'Що робить цей інструмент', 'Was dieses Werkzeug tut', 'Wat deze tool doet', 'Ce que fait cet outil', 'Qué hace esta herramienta', 'Co robi to narzędzie']),
    body: T7(['It estimates how much electricity one lift uses in a day and a year by the method of ISO 25745-2: the energy of its trips plus the energy it draws while standing (idle, then standby). Pick an example or describe your lift, choose how much it is used, and see which improvement actually pays.', 'Оцінює, скільки електроенергії ліфт споживає за добу й рік за методом ISO 25745-2: енергія поїздок плюс енергія під час стоянки (простій, потім очікування). Виберіть приклад або опишіть свій ліфт, задайте інтенсивність і подивіться, який захід справді окупається.', 'Es schätzt nach dem Verfahren der ISO 25745-2:2015, wie viel Strom ein Aufzug am Tag und im Jahr braucht: die Energie seiner Fahrten plus die Energie im Stillstand (Leerlauf, dann Standby). Wählen Sie ein Beispiel oder beschreiben Sie Ihren Aufzug, legen Sie die Nutzung fest und sehen Sie, welche Maßnahme sich lohnt.', 'Het schat volgens de methode van ISO 25745-2:2015 hoeveel elektriciteit één lift per dag en per jaar gebruikt: de energie van de ritten plus wat hij trekt terwijl hij stilstaat (rust, dan stand-by). Kies een voorbeeld of beschrijf uw lift, kies hoe intensief hij gebruikt wordt en zie welke maatregel echt loont.', 'Il estime l’électricité consommée par un ascenseur par jour et par an selon la méthode ISO 25745-2:2015 : l’énergie des trajets plus celle consommée à l’arrêt (attente, puis veille). Choisissez un exemple ou décrivez votre ascenseur, fixez son utilisation et voyez quelle amélioration paie vraiment.', 'Estima cuánta electricidad usa un ascensor al día y al año según el método ISO 25745-2: la energía de sus viajes más la que consume parado (reposo y luego espera). Elija un ejemplo o describa su ascensor, fije su uso y vea qué mejora compensa de verdad.', 'Szacuje, ile energii elektrycznej zużywa dźwig na dobę i na rok metodą ISO 25745-2: energię jazd oraz energię pobieraną w czasie postoju (bezczynność, potem czuwanie). Wybierz przykład lub opisz swój dźwig, określ intensywność użytkowania i zobacz, które działanie naprawdę się opłaca.']) },
  topics: {
    usage: { title: tx('q.cat'), body: T7(['ISO 25745-2:2015 sorts lifts by trips per day into six categories: 50, 125, 300, 750, 1,500 and 2,500 trips. The category also selects the average travel distance, the average car load and the time shares of idle and standby. If you know the real number of trips (trip counter, simulation) enter it instead.', 'ISO 25745-2:2015 поділяє ліфти за кількістю поїздок на добу на шість категорій: 50, 125, 300, 750, 1 500 і 2 500. Категорія визначає також середню відстань поїздки, середнє завантаження та частки часу простою й очікування. Якщо відома реальна кількість поїздок (лічильник, симуляція), введіть її.', 'ISO 25745-2:2015 ordnet Aufzüge nach Fahrten pro Tag sechs Kategorien zu: 50, 125, 300, 750, 1 500 und 2 500 Fahrten. Die Kategorie bestimmt auch den mittleren Fahrweg, die mittlere Kabinenlast und die Zeitanteile von Leerlauf und Standby. Kennen Sie die echte Fahrtenzahl (Zähler, Simulation), geben Sie diese ein.', 'ISO 25745-2:2015 deelt liften op ritten per dag in zes categorieën in: 50, 125, 300, 750, 1 500 en 2 500 ritten. De categorie bepaalt ook de gemiddelde ritafstand, de gemiddelde kooibelasting en de tijdsaandelen van rust en stand-by. Kent u het echte aantal ritten (teller, simulatie), voer dat dan in.', 'L’ISO 25745-2:2015 classe les ascenseurs selon les trajets par jour en six catégories : 50, 125, 300, 750, 1 500 et 2 500. La catégorie fixe aussi la distance moyenne, la charge moyenne et les parts de temps à l’arrêt et en veille. Si vous connaissez le vrai nombre de trajets (compteur, simulation), saisissez-le.', 'La ISO 25745-2:2015 clasifica los ascensores por viajes al día en seis categorías: 50, 125, 300, 750, 1 500 y 2 500. La categoría fija también la distancia media, la carga media y las fracciones de tiempo en reposo y espera. Si conoce el número real de viajes (contador, simulación), introdúzcalo.', 'ISO 25745-2:2015 dzieli dźwigi według liczby jazd na dobę na sześć kategorii: 50, 125, 300, 750, 1 500 i 2 500. Kategoria wyznacza też średnią drogę jazdy, średnie obciążenie kabiny i udziały czasu bezczynności i czuwania. Jeśli znasz rzeczywistą liczbę jazd (licznik, symulacja), wpisz ją.']) },
    refcycle: { title: tx('q.erc'), body: T7(['The energy measured (ISO 25745-1) when the empty car travels from one end of the shaft to the other and back, doors included. Every trip of the day is scaled from it by the average travel distance and the load factor. It is the single most important number: without it the result rests on a typical value for the drive.', 'Енергія, виміряна (ISO 25745-1), коли порожня кабіна їде від одного кінця шахти до іншого й назад разом із роботою дверей. Кожна поїздка дня масштабується від неї через середню відстань і коефіцієнт навантаження. Це найважливіше число: без нього результат спирається на типове значення для приводу.', 'Die Energie, gemessen nach ISO 25745-1, wenn die leere Kabine von einem Schachtende zum anderen und zurück fährt, Türbewegungen eingeschlossen. Jede Fahrt des Tages wird über mittleren Fahrweg und Lastfaktor daraus skaliert. Die wichtigste Zahl überhaupt: ohne sie beruht das Ergebnis auf einem typischen Wert.', 'De energie, gemeten volgens ISO 25745-1, wanneer de lege kooi van het ene einde van de schacht naar het andere en terug rijdt, deuren inbegrepen. Elke rit van de dag wordt daaruit geschaald met de gemiddelde ritafstand en de belastingsfactor. Het belangrijkste getal: zonder meting steunt het resultaat op een typische waarde.', 'L’énergie mesurée (ISO 25745-1) quand la cabine vide va d’un bout de la gaine à l’autre et revient, portes comprises. Chaque trajet de la journée en est déduit via la distance moyenne et le facteur de charge. C’est le chiffre le plus important : sans lui, le résultat repose sur une valeur typique.', 'La energía medida (ISO 25745-1) cuando la cabina vacía va de un extremo del hueco al otro y vuelve, puertas incluidas. Cada viaje del día se escala a partir de ella con la distancia media y el factor de carga. Es la cifra más importante: sin ella el resultado se apoya en un valor típico.', 'Energia zmierzona (ISO 25745-1), gdy pusta kabina jedzie z jednego końca szybu na drugi i z powrotem, łącznie z pracą drzwi. Każda jazda w ciągu doby jest z niej skalowana średnią drogą i współczynnikiem obciążenia. To najważniejsza liczba: bez pomiaru wynik opiera się na wartości typowej.']) },
    kl: { title: tx('q.kl'), body: T7(['Corrects the empty-car measurement for the passengers a lift really carries — on average only a few per cent of rated load. In a traction lift with a 50 % counterweight a light car is out of balance, so passengers slightly reduce the energy (k_L < 1); in a hydraulic lift every kilogram is lifted, so k_L > 1.', 'Поправляє вимір із порожньою кабіною на реальних пасажирів — у середньому лише кілька відсотків вантажопідйомності. У тяговому ліфті з противагою 50 % легка кабіна розбалансована, тож пасажири трохи зменшують енергію (k_L < 1); у гідравлічному кожен кілограм піднімається, тому k_L > 1.', 'Korrigiert die Leerfahrt-Messung auf die tatsächlich beförderten Personen — im Mittel nur wenige Prozent der Nennlast. Beim Treibscheibenaufzug mit 50 % Ausgleich ist die leichte Kabine unausgeglichen, Fahrgäste senken den Bedarf etwas (k_L < 1); beim Hydraulikaufzug wird jedes Kilogramm gehoben (k_L > 1).', 'Corrigeert de meting met lege kooi voor de passagiers die de lift echt vervoert — gemiddeld maar enkele procenten van de nominale last. Bij een tractielift met 50 % contragewicht is een lichte kooi uit balans, dus passagiers verlagen de energie iets (k_L < 1); bij een hydraulische lift wordt elke kilo gehesen (k_L > 1).', 'Corrige la mesure à vide pour les passagers réellement transportés — en moyenne quelques pour cent de la charge nominale. Dans un ascenseur à adhérence équilibré à 50 %, une cabine légère est déséquilibrée, les passagers réduisent un peu l’énergie (k_L < 1) ; en hydraulique, chaque kilo est levé (k_L > 1).', 'Corrige la medición en vacío por los pasajeros que realmente lleva — de media solo un pequeño porcentaje de la carga nominal. En un ascensor de adherencia con contrapeso al 50 % la cabina ligera está desequilibrada, y los pasajeros reducen algo la energía (k_L < 1); en uno hidráulico se eleva cada kilo (k_L > 1).', 'Koryguje pomiar pustej kabiny o pasażerów, których dźwig naprawdę wozi — średnio tylko kilka procent udźwigu. W dźwigu ciernym z przeciwwagą 50 % lekka kabina jest niewyważona, więc pasażerowie nieco zmniejszają zużycie (k_L < 1); w dźwigu hydraulicznym podnoszony jest każdy kilogram (k_L > 1).']) },
    pav: { title: tx('q.pav'), body: T7(['Most trips are much shorter than the full travel. ISO 25745-2:2015 Table 2 gives the average as a percentage of travel: 100 % with 2 stops, 67 % with 3, and with more stops 49 % falling to 32 % as usage grows (more short interfloor trips).', 'Більшість поїздок значно коротші за повну висоту. ISO 25745-2:2015, табл. 2 дає середню відстань у відсотках висоти: 100 % при 2 зупинках, 67 % при 3, а при більшій кількості — від 49 % до 32 % зі зростанням інтенсивності (більше коротких міжповерхових поїздок).', 'Die meisten Fahrten sind viel kürzer als die ganze Förderhöhe. ISO 25745-2:2015 Tabelle 2 gibt den Mittelwert in Prozent: 100 % bei 2 Haltestellen, 67 % bei 3, bei mehr Haltestellen 49 % fallend auf 32 % mit steigender Nutzung (mehr kurze Zwischenfahrten).', 'De meeste ritten zijn veel korter dan de volle hefhoogte. ISO 25745-2:2015 tabel 2 geeft het gemiddelde als percentage: 100 % bij 2 stopplaatsen, 67 % bij 3, en bij meer stopplaatsen 49 % dalend tot 32 % bij intensiever gebruik (meer korte tussenritten).', 'La plupart des trajets sont bien plus courts que la course totale. Le tableau 2 de l’ISO 25745-2:2015 donne la moyenne en pourcentage : 100 % avec 2 niveaux, 67 % avec 3, et au-delà 49 % descendant à 32 % quand l’usage croît (plus de courts trajets entre étages).', 'La mayoría de los viajes son mucho más cortos que el recorrido total. La tabla 2 de la ISO 25745-2:2015 da la media en porcentaje: 100 % con 2 paradas, 67 % con 3 y, con más paradas, del 49 % al 32 % según crece el uso (más viajes cortos entre plantas).', 'Większość jazd jest dużo krótsza niż pełna wysokość. Tablica 2 ISO 25745-2:2015 podaje średnią w procentach: 100 % przy 2 przystankach, 67 % przy 3, a przy większej liczbie od 49 % do 32 % wraz ze wzrostem użytkowania (więcej krótkich jazd międzypiętrowych).']) },
    standing: { title: T7(['Idle and standby', 'Простій і очікування', 'Leerlauf und Standby', 'Rust en stand-by', 'Arrêt et veille', 'Reposo y espera', 'Bezczynność i czuwanie']), body: T7(['A lift stands still for most of the day. Right after a trip it is idle (controller, lighting, displays, door operator powered); after about five minutes without calls it may fall to a lower standby power. In little-used lifts this standing energy is larger than the energy of all the trips together.', 'Більшу частину доби ліфт стоїть. Одразу після поїздки він у простої (живляться контролер, освітлення, табло, привід дверей); приблизно після п’яти хвилин без викликів може перейти на нижчу потужність очікування. У мало використовуваних ліфтах ця енергія стоянки більша за енергію всіх поїздок разом.', 'Ein Aufzug steht die meiste Zeit des Tages. Direkt nach einer Fahrt ist er im Leerlauf (Steuerung, Licht, Anzeigen, Türantrieb versorgt); nach etwa fünf Minuten ohne Ruf kann er in einen sparsameren Standby fallen. Bei wenig genutzten Aufzügen ist diese Stillstandsenergie größer als die aller Fahrten zusammen.', 'Een lift staat het grootste deel van de dag stil. Direct na een rit is hij in rust (besturing, verlichting, displays, deuraandrijving gevoed); na ongeveer vijf minuten zonder oproep kan hij naar een lager stand-byvermogen gaan. Bij weinig gebruikte liften is deze stilstandsenergie groter dan die van alle ritten samen.', 'Un ascenseur est à l’arrêt la majeure partie du temps. Juste après un trajet, il est en attente (contrôleur, éclairage, affichages, opérateur de porte alimentés) ; après environ cinq minutes sans appel, il peut passer à une veille plus sobre. Pour un ascenseur peu utilisé, cette énergie à l’arrêt dépasse celle de tous les trajets réunis.', 'Un ascensor está parado la mayor parte del día. Justo tras un viaje está en reposo (control, iluminación, pantallas y operador de puertas alimentados); tras unos cinco minutos sin llamadas puede pasar a una potencia de espera menor. En ascensores poco usados esta energía en parada supera la de todos los viajes juntos.', 'Dźwig przez większość doby stoi. Zaraz po jeździe jest w bezczynności (zasilane sterowanie, oświetlenie, wyświetlacze, napęd drzwi); po ok. pięciu minutach bez wezwań może przejść na mniejszą moc czuwania. W mało używanych dźwigach ta energia postoju jest większa niż energia wszystkich jazd razem.']) },
    classes: { title: tx('t.class'), body: T7(['VDI 4707 grades a lift A–G three ways: standby power (A ≤ 50 W … G > 1,600 W), travel energy per kg of rated load and metre (empty reference trip), and an overall specific demand that combines both over a typical day of its usage category. The default is VDI 4707 Blatt 1 (March 2009): travel A ≤ 0.56 … F ≤ 4.20 mWh/(kg·m), five usage categories from 0.2 to 6 hours of travel a day, and overall limits built for the lift’s own rated load and speed. The December 2007 draft (travel A ≤ 0.8 …) can be chosen as a legacy option; ISO 25745-2:2015 Table 7 grades the daily energy itself against limits built from its running levels (Table 5) and idle/standby levels (Table 6); that class is listed in the parameter table.', 'VDI 4707 оцінює ліфт за шкалою A–G трьома способами: потужність очікування (A ≤ 50 Вт … G > 1 600 Вт), енергія руху на кг вантажопідйомності й метр (порожній еталонний рейс) і загальна питома потреба, що поєднує обидві на типовий день категорії використання. За замовчуванням — VDI 4707 Blatt 1 (березень 2009): рух A ≤ 0,56 … F ≤ 4,20 мВт·год/(кг·м), п’ять категорій використання від 0,2 до 6 годин руху на добу й загальні межі, розраховані для вантажопідйомності та швидкості саме цього ліфта. Проєкт грудня 2007 р. (рух A ≤ 0,8 …) можна вибрати як застарілий варіант; ISO 25745-2:2015, табл. 7, оцінює саму добову енергію за межами з рівнів руху (табл. 5) і простою/очікування (табл. 6); цей клас наведено в таблиці параметрів.', 'VDI 4707 bewertet einen Aufzug dreifach von A bis G: Standby-Leistung (A ≤ 50 W … G > 1 600 W), Fahrenergie je kg Nennlast und Meter (leere Referenzfahrt) und ein spezifischer Gesamtbedarf, der beides über einen typischen Tag der Nutzungskategorie verbindet. Standard ist VDI 4707 Blatt 1 (März 2009): Fahrt A ≤ 0,56 … F ≤ 4,20 mWh/(kg·m), fünf Nutzungskategorien von 0,2 bis 6 Fahrstunden pro Tag und Gesamtgrenzen für Nennlast und Geschwindigkeit genau dieses Aufzugs. Der Entwurf vom Dezember 2007 (Fahrt A ≤ 0,8 …) ist als Altoption wählbar; ISO 25745-2:2015 Tabelle 7 bewertet den Tagesverbrauch selbst gegen Grenzen aus den Fahrstufen (Tabelle 5) und Stillstands-/Standby-Stufen (Tabelle 6); diese Klasse steht in der Parametertabelle.', 'VDI 4707 beoordeelt een lift op drie manieren van A tot G: stand-byvermogen (A ≤ 50 W … G > 1 600 W), rijenergie per kg nominale last en meter (lege referentierit) en een totale specifieke vraag die beide combineert over een typische dag van de gebruikscategorie. Standaard geldt VDI 4707 Blatt 1 (maart 2009): rijden A ≤ 0,56 … F ≤ 4,20 mWh/(kg·m), vijf gebruikscategorieën van 0,2 tot 6 rijuren per dag en totaalgrenzen voor de nominale last en snelheid van juist deze lift. Het ontwerp van december 2007 (rijden A ≤ 0,8 …) is als verouderde optie te kiezen; ISO 25745-2:2015 tabel 7 toetst het dagverbruik zelf aan grenzen uit de rijniveaus (tabel 5) en rust-/stand-byniveaus (tabel 6); die klasse staat in de parametertabel.', 'La VDI 4707 classe un ascenseur de A à G de trois façons : puissance de veille (A ≤ 50 W … G > 1 600 W), énergie de marche par kg de charge nominale et par mètre (trajet de référence à vide), et un besoin spécifique global combinant les deux sur une journée type de la catégorie. Par défaut : VDI 4707 Blatt 1 (mars 2009) — marche A ≤ 0,56 … F ≤ 4,20 mWh/(kg·m), cinq catégories d’utilisation de 0,2 à 6 heures de marche par jour, et des limites globales calculées pour la charge et la vitesse de cet ascenseur. Le projet de décembre 2007 (marche A ≤ 0,8 …) reste disponible comme option ancienne ; le tableau 7 de l’ISO 25745-2:2015 classe l’énergie journalière elle-même selon des limites tirées des niveaux de marche (tableau 5) et d’arrêt/veille (tableau 6) ; cette classe figure dans le tableau des paramètres.', 'La VDI 4707 califica un ascensor de A a G de tres maneras: potencia en espera (A ≤ 50 W … G > 1 600 W), energía de marcha por kg de carga nominal y metro (viaje de referencia en vacío) y una demanda específica global que combina ambas en un día típico de su categoría de uso. Por defecto se usa la VDI 4707 Blatt 1 (marzo de 2009): marcha A ≤ 0,56 … F ≤ 4,20 mWh/(kg·m), cinco categorías de uso de 0,2 a 6 horas de marcha al día y límites globales calculados para la carga y la velocidad de este ascensor. El borrador de diciembre de 2007 (marcha A ≤ 0,8 …) puede elegirse como opción heredada; la tabla 7 de la ISO 25745-2:2015 califica la propia energía diaria con límites a partir de los niveles de marcha (tabla 5) y de reposo/espera (tabla 6); esa clase figura en la tabla de parámetros.', 'VDI 4707 ocenia dźwig w skali A–G na trzy sposoby: moc czuwania (A ≤ 50 W … G > 1 600 W), energia jazdy na kg udźwigu i metr (pusta jazda odniesienia) oraz łączne zapotrzebowanie jednostkowe w typowym dniu kategorii użytkowania. Domyślnie VDI 4707 Blatt 1 (marzec 2009): jazda A ≤ 0,56 … F ≤ 4,20 mWh/(kg·m), pięć kategorii użytkowania od 0,2 do 6 godzin jazdy na dobę i wartości graniczne łączne liczone dla udźwigu i prędkości tego dźwigu. Projekt z grudnia 2007 (jazda A ≤ 0,8 …) można wybrać jako opcję archiwalną; ISO 25745-2:2015, tablica 7, ocenia samą energię dobową wobec granic z poziomów jazdy (tablica 5) i postoju/czuwania (tablica 6); ta klasa jest w tabeli parametrów.']) },
    levers: { title: tx('p.lev'), body: T7(['Three common measures, applied one after another so they do not double count: a regenerative drive returns braking energy to the building (traction lifts only); a deep standby switches off light, displays and drive after a few minutes; LED car lighting lowers the idle (and, if the light stays on, standby) power. Their sizes here are learning assumptions — the chart shows which one matters for this lift, not a guaranteed saving.', 'Три поширені заходи, застосовані послідовно, щоб не рахувати двічі: рекуперативний привід повертає енергію гальмування в мережу будівлі (лише тягові ліфти); глибоке очікування за кілька хвилин вимикає світло, табло й привід; LED-освітлення кабіни знижує потужність простою (і очікування, якщо світло горить). Їхні величини тут — навчальні припущення: діаграма показує, що важливо для цього ліфта, а не гарантовану економію.', 'Drei übliche Maßnahmen, nacheinander angewandt, damit nichts doppelt zählt: die Rückspeisung gibt Bremsenergie ins Gebäudenetz zurück (nur Treibscheibenaufzüge); ein tiefer Standby schaltet nach einigen Minuten Licht, Anzeigen und Antrieb ab; LED-Kabinenlicht senkt die Leerlauf- (und, wenn das Licht anbleibt, die Standby-)Leistung. Ihre Größen sind Lernannahmen — das Diagramm zeigt, was bei diesem Aufzug zählt, keine garantierte Einsparung.', 'Drie gangbare maatregelen, na elkaar toegepast zodat niets dubbel telt: een terugleverende aandrijving geeft remenergie terug aan het gebouw (alleen tractieliften); een diepe stand-by schakelt na enkele minuten licht, displays en aandrijving uit; LED-kooiverlichting verlaagt het rustvermogen (en, als het licht aanblijft, het stand-byvermogen). De groottes zijn leeraannames — de grafiek toont wat voor deze lift telt, geen gegarandeerde besparing.', 'Trois mesures courantes, appliquées l’une après l’autre pour ne rien compter deux fois : un variateur régénératif renvoie l’énergie de freinage au bâtiment (ascenseurs à adhérence seulement) ; une veille profonde coupe éclairage, affichages et variateur après quelques minutes ; l’éclairage LED réduit la puissance à l’arrêt (et en veille si la lumière reste allumée). Leurs ampleurs sont des hypothèses pédagogiques — le graphique montre ce qui compte pour cet ascenseur, pas un gain garanti.', 'Tres medidas habituales, aplicadas una tras otra para no contar dos veces: el accionamiento regenerativo devuelve la energía de frenado al edificio (solo ascensores de adherencia); la espera profunda apaga luz, pantallas y accionamiento tras unos minutos; la iluminación LED reduce la potencia en reposo (y en espera si la luz sigue encendida). Sus tamaños son supuestos didácticos — el gráfico muestra qué importa en este ascensor, no un ahorro garantizado.', 'Trzy typowe działania stosowane kolejno, aby nic nie liczyć podwójnie: napęd z odzyskiem oddaje energię hamowania do sieci budynku (tylko dźwigi cierne); głębokie czuwanie po kilku minutach wyłącza światło, wyświetlacze i napęd; oświetlenie LED kabiny obniża moc postoju (i czuwania, jeśli światło się pali). Ich wielkości to założenia dydaktyczne — wykres pokazuje, co jest ważne dla tego dźwigu, a nie gwarantowaną oszczędność.']) },
    simtrips: { title: tx('a.sim'), body: T7(['The lift waiting time simulator counts the trips and kilometres each car makes in the simulated period. This page turns them into trips per car per day (via the equivalent hours you set) and into the average travel distance, replacing the category tables with numbers from your own building.', 'Симулятор очікування ліфта рахує поїздки й кілометри кожної кабіни за змодельований період. Ця сторінка перетворює їх на поїздки на ліфт на добу (через задані еквівалентні години) і на середню відстань поїздки, замінюючи таблиці категорій числами з вашої будівлі.', 'Der Wartezeitsimulator zählt Fahrten und Kilometer jeder Kabine im simulierten Zeitraum. Diese Seite macht daraus Fahrten je Aufzug und Tag (über die eingestellten Äquivalenzstunden) und den mittleren Fahrweg — Zahlen aus Ihrem Gebäude statt der Kategorietabellen.', 'De wachttijdsimulator telt de ritten en kilometers van elke kooi in de gesimuleerde periode. Deze pagina maakt daar ritten per lift per dag van (via de ingestelde equivalente uren) en de gemiddelde ritafstand — getallen uit uw eigen gebouw in plaats van de categorietabellen.', 'Le simulateur d’attente compte les trajets et kilomètres de chaque cabine sur la période simulée. Cette page en tire des trajets par ascenseur et par jour (via les heures équivalentes choisies) et la distance moyenne, à la place des tableaux de catégories.', 'El simulador de espera cuenta los viajes y kilómetros de cada cabina en el periodo simulado. Esta página los convierte en viajes por ascensor y día (con las horas equivalentes que fije) y en la distancia media, en lugar de las tablas de categorías.', 'Symulator czasu oczekiwania liczy jazdy i kilometry każdej kabiny w symulowanym okresie. Ta strona zamienia je na jazdy na dźwig na dobę (przez ustawione godziny równoważne) i średnią drogę jazdy — liczby z Twojego budynku zamiast tablic kategorii.']) }

  nd_mode: 'category', cat: 3, nd: 300, days: 260, vdi_edition: '2009',
  erc_mode: 'typical', e_spr: 0.55, Erc: 50, Esc: 0, ssc: 0, Pid: 300, Pst: 150, on_st30: false, Pst30: 100, light_in_standby: true,
  ovr: false, pav: 49, pctQ: 4.5, Rid: 0.36,

};

function calcInput(s) {
  return { Q: s.Q, v: s.v, a: s.a, j: s.j, travel_m: s.travel_m, stops: s.stops, td: s.td, drive: s.drive, balance: s.balance,
    nd_mode: s.nd_mode, cat: s.cat, nd: s.nd, days: s.days, vdi_edition: s.vdi_edition, erc_mode: s.erc_mode, e_spr: s.e_spr, Erc: s.Erc,
    Esc: s.erc_mode === 'measured' && s.Esc > 0 && s.ssc > 0 ? s.Esc : null, ssc: s.erc_mode === 'measured' && s.Esc > 0 && s.ssc > 0 ? s.ssc : null,
    Pid: s.Pid, Pst: s.Pst, Pst30: s.on_st30 ? s.Pst30 : null, light_in_standby: !!s.light_in_standby,
    pav: s.ovr ? s.pav : null, pctQ: s.ovr ? s.pctQ : null, Rid: s.ovr ? s.Rid : null, price: s.price, co2: s.co2 };
}
function leverOpts(s) { return { regen_share: s.regen_share, standby_sleep_W: s.standby_sleep_W, light_old_W: s.light_old_W, light_new_W: s.light_new_W,
  on: { regen: !!s.on_regen, standby: !!s.on_standby, led: !!s.on_led } }; }
function solve() {
  if (!E) return null;
  var r = E.calc(calcInput(state)); lastErr = r.ok ? null : r.error; if (!r.ok) return null;
  var lv = E.levers(calcInput(state), leverOpts(state));
  return { r: r, lv: lv, n: Math.max(1, Math.round(state.n_cars || 1)) };
}
var RANGE = { Q: [100, 10000], v: [0.15, 12], a: [0.1, 2], j: [0.1, 3], travel_m: [2, 600], stops: [2, 150], td: [0, 60], n_cars: [1, 60],
  nd: [1, 20000], days: [1, 366], equiv_hours: [0.5, 24], e_spr: [0.05, 30], Erc: [0.1, 100000], Esc: [0, 100000], ssc: [0, 600],
  Pid: [0, 5000], Pst: [0, 5000], Pst30: [0, 5000], pav: [1, 100], pctQ: [0, 100], Rid: [0, 1], regen_share: [0, 0.9], standby_sleep_W: [0, 2000],
  light_old_W: [0, 1000], light_new_W: [0, 1000], price: [0, 5], co2: [0, 2], cat: [1, 6] };
function sanitize(o) {
  var x = JSON.parse(JSON.stringify(DEFAULTS));
  if (o && typeof o === 'object') Object.keys(DEFAULTS).forEach(function (k) {
    var v = o[k], d = DEFAULTS[k];
    if (typeof d === 'number' && typeof v === 'number' && isFinite(v)) x[k] = v;
    else if (typeof d === 'boolean' && typeof v === 'boolean') x[k] = v;
    else if (typeof d === 'string' && typeof v === 'string' && v.length < 80) x[k] = v;
  });
  /* CR-26: numbers from ?s= or a stored module are clamped to the field ranges */
  Object.keys(RANGE).forEach(function (k) { x[k] = Math.min(RANGE[k][1], Math.max(RANGE[k][0], Number(x[k]))); });
  ['stops', 'n_cars', 'nd', 'days'].forEach(function (k) { x[k] = Math.round(x[k]); });
  if (['2009', '2007'].indexOf(x.vdi_edition) < 0) x.vdi_edition = '2009';
  if (E && E.DRIVES[x.drive] && ((E.DRIVES[x.drive].traction ? ['50', '40', '30'] : ['0', '35', '70']).indexOf(String(x.balance)) < 0)) x.balance = E.DRIVES[x.drive].traction ? '50' : '0';
  if (!E || !E.DRIVES[x.drive]) x.drive = 'gearless';
  if (['category', 'trips'].indexOf(x.nd_mode) < 0) x.nd_mode = 'category';
  if (['typical', 'measured'].indexOf(x.erc_mode) < 0) x.erc_mode = 'typical';
  if (['waterfall', 'curve', 'classes'].indexOf(x.view) < 0) x.view = 'waterfall';
  x.cat = Math.min(6, Math.max(1, Math.round(x.cat)));
  return x;
}
function applyPreset(t, id) {

  var keep = { view: t.view, price: t.price, co2: t.co2, equiv_hours: t.equiv_hours };
  var nx = JSON.parse(JSON.stringify(DEFAULTS));
  Object.keys(x).forEach(function (k) { if (k in nx && x[k] != null) nx[k] = x[k]; });
  if (x.pav != null || x.pctQ != null || x.Rid != null) {
    nx.ovr = true;
    var tb = E.calc(Object.assign({}, x, { pav: null, pctQ: null, Rid: null }));
    nx.pav = x.pav != null ? x.pav : tb.pav; nx.pctQ = x.pctQ != null ? x.pctQ : tb.pctQ; nx.Rid = x.Rid != null ? x.Rid : tb.Rid;
  }
  if (x.balance == null) nx.balance = E.DRIVES[nx.drive].traction ? '50' : '0';
  if (x.n_cars == null) nx.n_cars = 1;
  Object.assign(nx, keep); nx.origin = 'preset:' + id;
  Object.keys(t).forEach(function (k) { delete t[k]; }); Object.assign(t, nx);
  var core = E.PRESETS[id].core;
  if (core && CORE && CORE.preset) { scen = CORE.preset(core); t.sel = (scen.groups[0].id) + '|' + (scen.groups[0].cars[0].id); showScenario(); }
}

/* ---- scenario ---- */
function selOptions() {
  if (!scen || !scen.groups) return [{ value: '', label: '—' }];
  var o = [];
  scen.groups.forEach(function (g) { (g.cars || []).forEach(function (c) { o.push({ value: g.id + '|' + c.id, label: (g.name || g.id) + ' · ' + c.id + ' · ' + c.rated_load_kg + ' kg · ' + fmt(c.speed, 1) + ' m/s' }); }); });
  return o.length ? o : [{ value: '', label: '—' }];
}
function takeLift() {
  if (!scen) return;
  var p = String(state.sel || '').split('|'), f = E.fromDoc(scen, p[0], p[1]); if (!f) return;
  ['Q', 'v', 'a', 'j', 'travel_m', 'stops', 'td', 'days', 'n_cars'].forEach(function (k) { if (f[k] != null) state[k] = f[k]; });

}
function useSim() {
  var s = scen && E.fromSim(scen, { equiv_hours: state.equiv_hours });
  if (!s) { msg = 'n.nosim'; return false; }
  takeLift();
  state.nd_mode = 'trips'; state.nd = s.nd; simBasis = s.basis;
  if (s.sav_m != null && state.travel_m > 0) { state.ovr = true; var tb = E.calc(Object.assign(calcInput(state), { pav: null, pctQ: null, Rid: null }));
    state.pav = Math.round(Math.min(100, 100 * s.sav_m / state.travel_m) * 10) / 10; state.pctQ = tb.pctQ; state.Rid = tb.Rid; }
  state.origin = 'simulator'; msg = null; return true;
}
function moduleDoc() {
  var d = scen || (CORE ? CORE.scenario.empty() : null); if (!d || !CORE) return d;
  var st = JSON.parse(JSON.stringify(state)); delete st.view;
  var res = last ? { per_lift: { Ed_Wh: last.r.Ed, Ey_kWh: last.r.Ey, Erd_Wh: last.r.Erd, Enr_Wh: last.r.Enr, share_running: last.r.share_running, per_trip_Wh: last.r.per_trip_Wh, usage_category: last.r.cat, trips_per_day: last.r.nd },

    vdi4707: { edition: last.r.vdi.edition, usage_category: last.r.vdi.cat, standby: last.r.vdi.cls_standby, travel: last.r.vdi.cls_travel, overall: last.r.vdi.cls_total, specific_mWh_kg_m: last.r.vdi.e_spec, nominal_kWh_year: last.r.vdi.year_kWh },
    levers: last.lv.steps.map(function (s) { return { id: s.id, Ey_kWh: s.Ey, delta_kWh: s.delta, applicable: s.applicable }; }) } : {};
  var sum = last ? { kWh_year_per_lift: Math.round(last.r.Ey), vdi_class: last.r.vdi.cls_total, vdi_edition: last.r.vdi.edition } : {};
  return CORE.scenario.withModule(d, TOOL, { state: st, results: res, summary: sum });
}
function saveScenario() {
  if (!CORE) return;
  var d = moduleDoc(); var r = CORE.scenario.save(d);
  scen = d; msg = r && r.ok ? 'n.saved' : 'n.nostore'; showScenario();

function showScenario() { if (bar && scen) { try { bar.setDoc(scen, { save: false }); } catch (e) { /* invalid: bar keeps its own */ } } }
function mountBar() {
  if (!barBox || !CORE || !CORE.ui) return;
  if (bar && barBox.contains(bar.element)) { try { bar.refresh(scen || undefined); } catch (e) { bar.refresh(); } return; }

  bar = CORE.ui.scenarioBar({ mount: barBox, toolId: TOOL, lang: curLang, doc: scen || undefined, getDoc: moduleDoc, syncTabs: true,

      else { var o = selOptions(); state.sel = o[0].value; takeLift(); } if (ui) { ui.sync(); ui.run(); } } });
  if (!scen && bar) scen = bar.getDoc();
  if (bar && bar.element) Array.prototype.forEach.call(bar.element.querySelectorAll('input[type=file]'), function (f) { if (!f.getAttribute('aria-label')) f.setAttribute('aria-label', S('a.json')); });
}

function csvRows() {
  if (!last) return [];
  var r = last.r, rows = [];
  function add(sec, key, val, unit, src) { rows.push({ section: sec, quantity: key, value: val, unit: unit, source: src }); }
  add('input', 'rated_load', state.Q, 'kg', 'user'); add('input', 'speed', state.v, 'm/s', 'user'); add('input', 'travel', state.travel_m, 'm', 'user');
  add('input', 'stops', state.stops, '', 'user'); add('input', 'drive', state.drive, '', 'user'); add('input', 'counterbalance', state.balance, '%', 'user');
