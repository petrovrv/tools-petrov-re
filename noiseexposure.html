    upper: T('Upper exposure action value', 'Верхнє порогове значення для вжиття заходів', 'Oberer Auslösewert', 'Bovenste actiewaarde', 'Valeur d’action supérieure', 'Valor superior de acción', 'Górna wartość progowa działania'),
    limit: T('Exposure limit value', 'Граничне значення впливу', 'Expositionsgrenzwert', 'Grenswaarde voor blootstelling', 'Valeur limite d’exposition', 'Valor límite de exposición', 'Wartość graniczna ekspozycji')
  };
  var THR_RULE = { lower: 'NOISE-T-001', upper: 'NOISE-T-002', limit: 'NOISE-T-003' };

  /* ================================================================ 3. model
     Units: levels in dB, durations in hours, sound exposure in Pa²·h. */
  var P0 = 2e-5;                      /* reference sound pressure, Pa */
  var LEVEL_MIN = 0, LEVEL_MAX = 150; /* NOISE-V-001, entry plausibility */
  var PROT_METHODS = ['none', 'user', 'snr_lc', 'snr_la', 'hml'];

  function num(v) { return (typeof v === 'number' && isFinite(v)) ? v : null; }
  function r1(x) { return Math.round(x * 10) / 10; }

  var DEFAULTS = {
    T0: 8, U: 0,
    preset: 'eu2003',
    cLower: 80, cUpper: 85, cLimit: 87, cSource: '', cJur: '', cVer: '',
    prot: 'hml', att: 15, snr: 30, hH: 32, hM: 26, hL: 20, derate: 4,
    tasks: [
      { label: 'Angle grinding', LA: 97, h: 1.5, LC: 99, worn: 100 },
      { label: 'Machine tending', LA: 86, h: 3, LC: 90, worn: 75 },
      { label: 'Bench assembly', LA: 79, h: 2.5, LC: 84, worn: 0 },
      { label: 'Break and office work', LA: 62, h: 1, LC: 70, worn: 0 }
    ]
  };

  function criteriaOf(s) {
    if (s.preset !== 'custom') {
      var p = PRESETS[s.preset] || PRESETS.eu2003;
      return { id: p.id, lower: p.lower, upper: p.upper, limit: p.limit, source: p.source,
               jurisdiction: p.jurisdiction, version: p.version, kind: p.kind,
               eightHour: !!p.eightHour, valid: true, sourced: true };
    }
    var lo = num(s.cLower), up = num(s.cUpper), li = num(s.cLimit);
    var valid = lo != null && up != null && li != null && lo <= up && up <= li;
    var src = String(s.cSource || '').trim(), jur = String(s.cJur || '').trim();
    return { id: 'custom', lower: lo, upper: up, limit: li, source: src, jurisdiction: jur,
             version: String(s.cVer || '').trim(), kind: 'company', eightHour: false,
             valid: valid, sourced: !!(src && jur) };
  }

  /* Attenuation credited to one worn task, dB, or a reason why none can be. */
  function attenuationFor(s, t) {
    var m = s.prot, d = num(s.derate);
    if (m === 'user') {
      var a = num(s.att);
      if (a == null || a < 0 || a > 60) return { att: null, why: 'att' };
      return { att: a, clamped: false };
    }
    if (m === 'snr_la' || m === 'snr_lc' || m === 'hml') {
      if (d == null || d < 0 || d > 30) return { att: null, why: 'derate' };
    }
    var raw;
    if (m === 'snr_la') {
      var snr = num(s.snr);
      if (snr == null || snr < 0 || snr > 60) return { att: null, why: 'snr' };
      raw = snr - d;
    } else if (m === 'snr_lc') {
      var snr2 = num(s.snr);
      if (snr2 == null || snr2 < 0 || snr2 > 60) return { att: null, why: 'snr' };
      var lc = num(t.LC);
      if (lc == null || lc < LEVEL_MIN || lc > LEVEL_MAX + 10) return { att: null, why: 'lc' };
      /* L'A = LC - (SNR - derating); credited attenuation = LA - L'A */
      raw = t.LA - (lc - (snr2 - d));
    } else if (m === 'hml') {
      var H = num(s.hH), M = num(s.hM), Lo = num(s.hL);
      if (H == null || M == null || Lo == null || H < 0 || M < 0 || Lo < 0 || H > 60 || M > 60 || Lo > 60) return { att: null, why: 'hml' };
      var lc2 = num(t.LC);
      if (lc2 == null || lc2 < LEVEL_MIN || lc2 > LEVEL_MAX + 10) return { att: null, why: 'lc' };
      var dd = lc2 - t.LA;
      var pnr = dd <= 2 ? M - (H - M) / 4 * (dd - 2) : M - (M - Lo) / 8 * (dd - 2);
      raw = pnr - d;
    } else {
      return { att: 0, clamped: false };
    }
    /* a protector is never credited with amplification */
    if (raw < 0) return { att: 0, clamped: true };
    return { att: raw, clamped: false };
  }

  function taskLabel(t, i) {
    var s = String(t && t.label != null ? t.label : '').trim();
    return s || ('#' + (i + 1));
  }

  /* The whole assessment. Pure: the same state gives the same object. */
  function evaluate(s) {
    var R = {
      ok: false, Te: null, LEX: null, LAeqTe: null, EA: null,
      tasks: [], dominant: null,
      protActive: false, earOk: false, LEXear: null, EAear: null, wear_h: 0,
      crit: criteriaOf(s), thresholds: [], state: 'insufficient', limitState: 'review',
      findings: []
    };
    var F = R.findings;
    var T0 = num(s.T0);
    var tasks = Array.isArray(s.tasks) ? s.tasks : [];
    var bad = [];
    var Te = 0;
    tasks.forEach(function (t, i) {
      t = t || {};
      var LA = num(t.LA), h = num(t.h);
      var row = { i: i, label: taskLabel(t, i), LA: LA, h: h, LC: num(t.LC),
                  worn: num(t.worn) == null ? 0 : num(t.worn), valid: true, err: [] };
      if (LA == null || LA < LEVEL_MIN || LA > LEVEL_MAX) { row.valid = false; row.err.push('level'); }
      if (h == null || h <= 0) { row.valid = false; row.err.push('duration'); }
      if (row.worn < 0 || row.worn > 100) { row.valid = false; row.err.push('worn'); }
      if (!row.valid) bad.push({ n: i + 1, err: row.err.slice() });
      else Te += h;
      R.tasks.push(row);
    });
    if (!tasks.length) F.push({ rule: 'NOISE-V-001', status: 'insufficient', code: 'empty' });
    if (bad.length) F.push({ rule: 'NOISE-V-001', status: 'insufficient', code: 'tasks', bad: bad });
    var t0ok = T0 != null && T0 > 0 && T0 <= 24;
    if (!t0ok) F.push({ rule: 'NOISE-V-003', status: 'insufficient', t0: T0 });
    var teOk = Te <= 24 + 1e-9;
    if (!teOk) F.push({ rule: 'NOISE-V-002', status: 'insufficient', te: Te });

    var ok = tasks.length > 0 && !bad.length && t0ok && teOk;
    R.ok = ok;
    R.Te = bad.length ? null : Te;
    if (!ok) {
      if (!R.crit.valid) F.push({ rule: 'NOISE-C-002', status: 'insufficient' });
      F.push({ rule: 'NOISE-S-001', status: 'info' });
      return R;
    }

    /* NOISE-M-001 energy sum, NOISE-M-002 shares */
    var sumE = 0;
    R.tasks.forEach(function (t) {
      t.E = P0 * P0 * Math.pow(10, 0.1 * t.LA) * t.h;         /* Pa²·h */
      sumE += t.E;
    });
    R.EA = sumE;
    R.LEX = 10 * Math.log10(sumE / (P0 * P0 * T0));
    R.LAeqTe = 10 * Math.log10(sumE / (P0 * P0 * Te));
    var dom = null;
    R.tasks.forEach(function (t) {
      t.share = 100 * t.E / sumE;
      t.lexPart = 10 * Math.log10(t.E / (P0 * P0 * T0));
      if (!dom || t.E > dom.E) dom = t;
    });
    R.dominant = { i: dom.i, label: dom.label, share: dom.share };
    if (Math.abs(Te - T0) > 1e-9) F.push({ rule: 'NOISE-M-003', status: 'info', te: Te, t0: T0 });

    /* protection scenario: NOISE-P-*; the exposure without protector is never touched (P-007) */
    var method = PROT_METHODS.indexOf(s.prot) >= 0 ? s.prot : 'none';
    var anyWorn = R.tasks.some(function (t) { return t.worn > 0; });
    R.protActive = method !== 'none' && anyWorn;
    if (method === 'none' && anyWorn) F.push({ rule: 'NOISE-P-008', status: 'info' });
    if (method !== 'none' && !anyWorn) F.push({ rule: 'NOISE-P-007', status: 'info', code: 'noWear' });
    var missing = {}, lcMissing = [], clamped = [], partial = [];
    var sumEar = 0;
    R.tasks.forEach(function (t) {
      var w = R.protActive ? t.worn / 100 : 0;
      t.att = null;
      if (w > 0) {
        var a = attenuationFor(s, t);
        if (a.att == null) {
          if (a.why === 'lc') lcMissing.push(t.i + 1); else missing[a.why] = 1;
          t.Eear = null;
          return;
        }
        if (a.clamped) clamped.push(t.i + 1);
        t.att = a.att;
        t.Eear = t.E * (w * Math.pow(10, -a.att / 10) + (1 - w));
        if (w < 1) partial.push(t.i + 1);
        R.wear_h += t.h * w;
      } else {
        t.Eear = t.E;
      }
      t.Lear = 10 * Math.log10(t.Eear / (P0 * P0 * t.h));
      sumEar += t.Eear;
    });
    var earOk = !lcMissing.length && !Object.keys(missing).length;
    R.earOk = earOk;
    if (earOk) {
      R.EAear = sumEar;
      R.LEXear = 10 * Math.log10(sumEar / (P0 * P0 * T0));
      R.tasks.forEach(function (t) { t.shareEar = 100 * t.Eear / sumEar; });
    } else {
      R.tasks.forEach(function (t) { t.Eear = null; t.Lear = null; t.shareEar = null; });
    }
    if (R.protActive) {
      if (method === 'snr_lc') F.push({ rule: 'NOISE-P-001', status: lcMissing.length || missing.snr || missing.derate ? 'insufficient' : 'info', lc: lcMissing, miss: Object.keys(missing), clamped: clamped });
      if (method === 'hml') F.push({ rule: 'NOISE-P-002', status: lcMissing.length || missing.hml || missing.derate ? 'insufficient' : 'info', lc: lcMissing, miss: Object.keys(missing), clamped: clamped });
      if (method === 'snr_la') {
        if (missing.snr || missing.derate) F.push({ rule: 'NOISE-P-001', status: 'insufficient', lc: [], miss: Object.keys(missing), clamped: [] });
        F.push({ rule: 'NOISE-P-003', status: 'attention' });
      }
      if (method !== 'user') F.push({ rule: 'NOISE-P-004', status: 'info', d: num(s.derate) });
      if (method === 'user') F.push({ rule: 'NOISE-P-006', status: missing.att ? 'insufficient' : 'info', a: num(s.att) });
      if (partial.length) F.push({ rule: 'NOISE-P-005', status: 'attention', list: partial });
      if (earOk) F.push({ rule: 'NOISE-P-007', status: 'info', lex: R.LEX, ear: R.LEXear });
    }

    /* thresholds: NOISE-T-001..003, with T-004 and T-005 around them */
    var c = R.crit;
    if (!c.valid) {
      F.push({ rule: 'NOISE-C-002', status: 'insufficient' });
      R.state = 'criteria_invalid';
      R.limitState = 'review';
    } else {
      var ambient = r1(R.LEX);
      var earLevel = R.protActive ? (earOk ? r1(R.LEXear) : null) : ambient;
      ['lower', 'upper', 'limit'].forEach(function (k) {
        var thr = c[k];
        var level = k === 'limit' ? earLevel : ambient;
        var st = level == null ? 'review' : (level > thr ? 'exceeded' : 'not_exceeded');
        R.thresholds.push({ key: k, rule: THR_RULE[k], value: thr, level: level,
                            atEar: k === 'limit' && R.protActive, state: st });
        var U = num(s.U);
        if (U != null && U > 0 && st === 'not_exceeded' && level + U > thr) {
          F.push({ rule: 'NOISE-T-004', status: 'attention', key: k, thr: thr, u: U });
        }
      });
      var lim = R.thresholds[2];
      R.limitState = lim.state;
      if (lim.state === 'exceeded') R.state = 'limit_exceeded';
      else if (lim.state === 'review' && ambient > c.limit) R.state = 'limit_review';
      else if (ambient > c.upper) R.state = 'upper_exceeded';
      else if (ambient > c.lower) R.state = 'lower_exceeded';
      else R.state = 'below_lower';
      if (c.eightHour && Math.abs(T0 - 8) > 1e-9) F.push({ rule: 'NOISE-T-005', status: 'attention', t0: T0 });
    }
    if (c.id === 'custom' && !c.sourced) F.push({ rule: 'NOISE-C-001', status: 'attention' });
    F.push({ rule: 'NOISE-S-001', status: 'info' });
    return R;
  }

  /* record <-> state */
  function recordInputs(s) {
    return {
      T0: num(s.T0), U: num(s.U),
      preset: s.preset,
      criteria_lower: s.preset === 'custom' ? num(s.cLower) : criteriaOf(s).lower,
      criteria_upper: s.preset === 'custom' ? num(s.cUpper) : criteriaOf(s).upper,
      criteria_limit: s.preset === 'custom' ? num(s.cLimit) : criteriaOf(s).limit,
      criteria_source: criteriaOf(s).source,
      criteria_jurisdiction: criteriaOf(s).jurisdiction,
      criteria_version: criteriaOf(s).version,
      protection: s.prot,
      attenuation_user: num(s.att), snr: num(s.snr),
      hml_h: num(s.hH), hml_m: num(s.hM), hml_l: num(s.hL),
      derating: num(s.derate),
      tasks: (s.tasks || []).map(function (t) {
        t = t || {};
        return { label: String(t.label == null ? '' : t.label), LAeq: num(t.LA), duration_h: num(t.h),
                 LCeq: num(t.LC), worn_pct: num(t.worn) };
      })
    };
  }
  function stateFromInputs(inp) {
    var s = JSON.parse(JSON.stringify(DEFAULTS));
    if (!inp || typeof inp !== 'object') return s;
    if (inp.T0 !== undefined) s.T0 = num(inp.T0);
    if (inp.U !== undefined) s.U = num(inp.U) == null ? 0 : num(inp.U);
    s.preset = inp.preset === 'custom' ? 'custom' : (PRESETS[inp.preset] ? inp.preset : 'eu2003');
    if (s.preset === 'custom') {
      s.cLower = num(inp.criteria_lower); s.cUpper = num(inp.criteria_upper); s.cLimit = num(inp.criteria_limit);
      s.cSource = String(inp.criteria_source || ''); s.cJur = String(inp.criteria_jurisdiction || '');
      s.cVer = String(inp.criteria_version || '');
    }
    s.prot = PROT_METHODS.indexOf(inp.protection) >= 0 ? inp.protection : 'none';
    ['att:attenuation_user', 'snr:snr', 'hH:hml_h', 'hM:hml_m', 'hL:hml_l', 'derate:derating'].forEach(function (p) {
      var a = p.split(':');
      if (inp[a[1]] !== undefined) s[a[0]] = num(inp[a[1]]);
    });
    if (Array.isArray(inp.tasks)) {
      s.tasks = inp.tasks.map(function (t) {
        t = t || {};
        return { label: String(t.label == null ? '' : t.label).slice(0, 80), LA: num(t.LAeq), h: num(t.duration_h),
                 LC: num(t.LCeq), worn: num(t.worn_pct) == null ? 0 : num(t.worn_pct) };
      }).slice(0, 60);
    }
    return s;
  }
  function recordOutputs(R) {
    return {
      LEX_8h: R.ok ? R.LEX : null,
      LAeq_Te: R.ok ? R.LAeqTe : null,
      T_e: R.Te,
      E_A: R.ok ? R.EA : null,
      dominant_task: R.dominant ? R.dominant.label : null,
      dominant_share: R.dominant ? R.dominant.share : null,
      threshold_state: R.state,
      limit_state: R.limitState,
      protection_active: R.protActive,
      LEX_8h_at_ear: R.ok && R.earOk ? (R.protActive ? R.LEXear : R.LEX) : null,
      wear_time: R.ok ? R.wear_h : null,
      n_tasks: R.tasks.length,
      tasks: R.ok ? R.tasks.map(function (t) {
        return { label: t.label, E_A: t.E, LEX_part: t.lexPart, share: t.share,
                 L_ear: t.Lear, share_ear: t.shareEar, att: t.att };
      }) : []
    };
  }

  /* CSV of the task table, one row per task, in shift order */
  function csvCell(v) {
    var s = v == null ? '' : String(v);
    return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function tasksCSV(s) {
    var R = evaluate(s);
    var rows = [['order', 'task', 'LAeq_dBA', 'duration_h', 'LCeq_dBC', 'worn_pct',
                 'partial_LEX8h_dBA', 'energy_share_pct', 'at_ear_dBA']];
    (s.tasks || []).forEach(function (t, i) {
      var r = R.tasks[i] || {};
      var f = function (x, p) { return typeof x === 'number' && isFinite(x) ? x.toFixed(p) : ''; };
      rows.push([i + 1, t.label || '', f(num(t.LA), 1), f(num(t.h), 3), f(num(t.LC), 1), f(num(t.worn), 0),
                 R.ok ? f(r.lexPart, 2) : '', R.ok ? f(r.share, 2) : '', R.ok && r.Lear != null ? f(r.Lear, 2) : '']);
    });
    return rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n') + '\r\n';
  }

  /* ===================================================== 4. findings as text */
  var STATUS_WORD = {
    insufficient: T('Insufficient data — review required', 'Недостатньо даних — потрібен перегляд', 'Unzureichende Daten — Prüfung erforderlich', 'Onvoldoende gegevens — controle nodig', 'Données insuffisantes — revue requise', 'Datos insuficientes — revisión necesaria', 'Niewystarczające dane — wymagany przegląd'),

  };

  var STATE_TEXT = {

      case 'NOISE-C-001': return M('c1');
      case 'NOISE-C-002': return M('c2');
      case 'NOISE-P-001':
      case 'NOISE-P-002': {
        var parts = [];
        if (f.lc && f.lc.length) parts.push(M('p_lc', { list: joinList(f.lc) }));
        if (f.miss && f.miss.length) parts.push(M('p_miss', { what: f.miss.map(function (k) { return L(MISS_WORD[k], l); }).join(', ') }));
        if (!parts.length) parts.push(M(f.rule === 'NOISE-P-001' ? 'p_ok_snr' : 'p_ok_hml'));
        if (f.clamped && f.clamped.length) parts.push(M('p_clamp', { list: joinList(f.clamped) }));

  function alpha(ctx, a, fn) { var o = ctx.globalAlpha; ctx.globalAlpha = a; fn(); ctx.globalAlpha = o; }

  function drawShift(ctx, w, h, s, R, pal, coarse, l) {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = pal.panel; ctx.fillRect(0, 0, w, h);
    var fs = coarse ? 10 : 11;
    ctx.font = '400 ' + fs + 'px ' + pal.font;
    var padL = coarse ? 36 : 44, padR = coarse ? 30 : 38, padT = 24;
    var nBars = R.ok ? (R.protActive && R.earOk ? 2 : 1) : 0;
    var barH = coarse ? 16 : 18, axisH = coarse ? 22 : 24;
    var bottomH = nBars ? 8 + nBars * (barH + 6) : 4;
    var plotB = h - bottomH - axisH;
    var T0 = num(s.T0) && s.T0 > 0 ? s.T0 : 8;
    var c = R.crit;
    var valid = R.tasks.filter(function (t) { return t.valid; });
    var Te = valid.reduce(function (a, t) { return a + t.h; }, 0);
    var tMax = Math.max(T0, Te, 1);
    var levels = [];
    valid.forEach(function (t) { levels.push(t.LA); if (t.Lear != null) levels.push(t.Lear); });
    if (c.valid) levels.push(c.lower, c.limit);
    if (!levels.length) levels = [60, 90];
    var lo = Math.floor((Math.min.apply(null, levels) - 6) / 10) * 10;
    var hi = Math.ceil((Math.max.apply(null, levels) + 3) / 5) * 5;
    if (hi - lo < 20) lo = hi - 20;
    var x0 = padL, x1 = w - padR;
    var X = function (t) { return x0 + (x1 - x0) * t / tMax; };
    var Y = function (v) { return plotB - (plotB - padT) * (v - lo) / (hi - lo); };

    /* threshold bands */
    if (c.valid) {
      alpha(ctx, 0.07, function () { ctx.fillStyle = pal.warn; ctx.fillRect(x0, Y(c.upper), x1 - x0, Y(c.lower) - Y(c.upper)); });
      alpha(ctx, 0.13, function () { ctx.fillStyle = pal.warn; ctx.fillRect(x0, Y(c.limit), x1 - x0, Y(c.upper) - Y(c.limit)); });
      alpha(ctx, 0.08, function () { ctx.fillStyle = pal.bad; ctx.fillRect(x0, padT, x1 - x0, Y(c.limit) - padT); });
    }
    /* grid and y axis */
    ctx.strokeStyle = pal.line; ctx.lineWidth = 1; ctx.fillStyle = pal.muted; ctx.textAlign = 'right';
    var step = (hi - lo) > 50 ? 20 : 10;
    for (var v = Math.ceil(lo / step) * step; v <= hi; v += step) {
      var y = Y(v);
      ctx.beginPath(); ctx.moveTo(x0, y + 0.5); ctx.lineTo(x1, y + 0.5); ctx.stroke();
      ctx.fillText(nf(v, 0, l), x0 - 5, y + 4);
    }
    ctx.textAlign = 'left';
    ctx.fillText('dB(A)', 2, 11);
    /* task blocks in shift order */
    var t = 0;
    R.tasks.forEach(function (tk) {
      if (!tk.valid) return;
      var xa = X(t), xb = X(t + tk.h), ya = Y(Math.max(lo, tk.LA));
      alpha(ctx, 0.82, function () { ctx.fillStyle = pal.series(tk.i); ctx.fillRect(xa, ya, Math.max(1, xb - xa), plotB - ya); });
      ctx.strokeStyle = pal.panel; ctx.lineWidth = 1;
      ctx.strokeRect(xa + 0.5, ya + 0.5, Math.max(1, xb - xa) - 1, plotB - ya - 1);
      if (xb - xa >= 16 && plotB - ya >= 16) {
        ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
        ctx.fillText(String(tk.i + 1), (xa + xb) / 2, Math.min(plotB - 4, ya + 13));
      }
      tk._x = [xa, xb];
      t += tk.h;
    });
    /* at-ear estimate as a dashed step line */
    if (R.ok && R.protActive && R.earOk) {
      ctx.strokeStyle = pal.ink; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
      ctx.beginPath();
      R.tasks.forEach(function (tk, k) {
        var y = Y(Math.max(lo, tk.Lear));
        if (k === 0) ctx.moveTo(tk._x[0], y); else ctx.lineTo(tk._x[0], y);
        ctx.lineTo(tk._x[1], y);
      });
      ctx.stroke(); ctx.setLineDash([]);
    }
    /* action and limit values */
    if (c.valid) {
      [['lower', pal.warn, [4, 3]], ['upper', pal.warn, [8, 3]], ['limit', pal.bad, []]].forEach(function (q) {
        var y = Y(c[q[0]]);
        ctx.strokeStyle = q[1]; ctx.lineWidth = 1.5; ctx.setLineDash(q[2]);
        ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = q[1]; ctx.textAlign = 'left';
        ctx.fillText(nf(c[q[0]], c[q[0]] % 1 ? 1 : 0, l), x1 + 4, y + (q[0] === 'upper' ? 4 : (q[0] === 'lower' ? 9 : -1)));
      });
    }
    /* T0 marker */
    ctx.strokeStyle = pal.muted; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
    ctx.beginPath(); ctx.moveTo(X(T0), padT); ctx.lineTo(X(T0), plotB); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = pal.muted; ctx.textAlign = X(T0) > x1 - 20 ? 'right' : 'center';
    ctx.fillText('T0', X(T0), 11);
    /* x axis */
    ctx.strokeStyle = pal.muted;
    ctx.beginPath(); ctx.moveTo(x0, plotB + 0.5); ctx.lineTo(x1, plotB + 0.5); ctx.stroke();
    var xs = tMax <= (coarse ? 8 : 12) ? 1 : (tMax <= 16 ? 2 : 4);
    ctx.textAlign = 'center'; ctx.fillStyle = pal.muted;
    for (var k = 0; k <= tMax + 1e-9; k += xs) {
      var xx = X(k);
      ctx.beginPath(); ctx.moveTo(xx, plotB); ctx.lineTo(xx, plotB + 4); ctx.stroke();
      ctx.fillText(nf(k, 0, l), xx, plotB + 15);
    }
    ctx.textAlign = 'left'; ctx.fillText('h', x1 + 4, plotB + 15);
    /* energy-share bars: without protector, then at the ear */
    if (!nBars) return;
    var bars = [['share', 'LEX']];
    if (nBars === 2) bars.push(['shareEar', 'LEX′']);
    bars.forEach(function (b, row) {
      var y = plotB + axisH + 4 + row * (barH + 6);
      var x = x0;
      ctx.fillStyle = pal.muted; ctx.textAlign = 'right';
      ctx.fillText(b[1], x0 - 5, y + barH - 5);
      R.tasks.forEach(function (tk) {
        var sh = tk[b[0]] || 0, ww = (x1 - x0) * sh / 100;
        alpha(ctx, 0.85, function () { ctx.fillStyle = pal.series(tk.i); ctx.fillRect(x, y, ww, barH); });

        }
        x += ww;
      });
      ctx.strokeStyle = pal.line; ctx.strokeRect(x0 + 0.5, y + 0.5, x1 - x0 - 1, barH - 1);
    });
  }

      { label: LBL.lexAmb, value: R.ok ? nf(R.LEX, 1, l) : null, hint: u(UNIT_DBA, l), tone: R.ok ? tone : 'warn', learn: 'lex' },
      { label: LBL.lexEar, value: R.ok && R.earOk ? nf(R.protActive ? R.LEXear : R.LEX, 1, l) : null,
        hint: R.ok && !R.protActive ? u(UNIT_DBA, l) + ' · ' + L(LBL.noProt, l) : u(UNIT_DBA, l),
        tone: R.limitState === 'exceeded' ? 'bad' : (R.limitState === 'review' ? 'warn' : null), learn: 'protection' },
      { label: LBL.status, value: L(stateShort(R), l), tone: tone, learn: 'thresholds' },
      { label: LBL.te, value: R.Te != null ? nf(R.Te, 2, l) : null, hint: u(UNIT_H, l), headline: false },
      { label: LBL.dom, value: R.dominant ? taskName(R.tasks[R.dominant.i], l) : null,
        hint: R.dominant ? nf(R.dominant.share, 1, l) + ' % ' + L(LBL.of, l) : null, headline: false }
    ];
    var c = R.crit;
    var thrRows = R.thresholds.map(function (th) {
      var cmp = th.key === 'limit' && R.protActive ? LBL.earShort : LBL.ambientShort;
      return { cells: [{ text: L(NAMES[th.key], l) + ' (' + L(cmp, l) + (th.level != null ? ': ' + nf(th.level, 1, l) : '') + ')', wrap: true },
                       { text: nf(th.value, 1, l), num: true },
                       { wrap: true, text: statusOfFinding(th.state, l), tone: th.state === 'exceeded' ? (th.key === 'limit' ? 'bad' : 'warn') : (th.state === 'review' ? 'warn' : '') }],
               tone: th.state === 'exceeded' ? (th.key === 'limit' ? 'bad' : 'warn') : null };
    });
    var tables = [];
    tables.push({
      title: LBL.thrTitle,
      head: [LBL.criterion, { label: u(UNIT_DBA, l), num: true }, LBL.result],
      rows: thrRows.length ? thrRows : [{ cells: [{ text: L(STATE_SHORT[R.state], l), span: 3 }] }]
    });
    if (R.ok) {
      tables.push({
        title: LBL.taskTitle,
        head: [LBL.task, { label: LBL.share, num: true, wrap: true }, { label: LBL.part, num: true, wrap: true },
               { label: LBL.ear, num: true, wrap: true }],
        rows: R.tasks.map(function (t) {
          return { cells: [{ text: (t.i + 1) + ' · ' + taskName(t, l), wrap: true }, 
                           { text: nf(t.share, 1, l), num: true },
                           { text: nf(t.lexPart, 1, l), num: true },
                           { text: t.Lear != null ? nf(t.Lear, 1, l) : '—', num: true }],
                   chosen: R.dominant && t.i === R.dominant.i };
        })
      });
    }
    tables.push({
      title: LBL.findTitle,
      head: [LBL.rule, LBL.statusCol, LBL.finding],
      rows: R.findings.map(function (f) {
        return { cells: [f.rule, { text: statusOfFinding(f.status, l), tone: f.status === 'insufficient' ? 'warn' : (f.status === 'attention' ? 'warn' : '') },
                         { text: findingText(f, l), wrap: true }] };
      })
    });
    return {
      verdict: { tone: tone, text: L(stateText(R), l) },
      tiles: tiles,
      tables: tables,
      notes: [L(LBL.pack, l) + ': ' + presetName(c, l) + ' — ' + critLine(c, l)]
    };
  }

  /* explicit import only: validates schema and tool id, reports what was ignored */
  function importRecord(data) {
    if (!data || typeof data !== 'object' || data.schema !== 'tools.petrov.re/calculation-record/v1' ||
        !data.tool || data.tool.id !== 'noiseexposure' || !data.inputs || typeof data.inputs !== 'object' ||
        !Array.isArray(data.inputs.tasks)) {
      return { ok: false };
    }
    var ignored = Object.keys(data.inputs).filter(function (k) { return KNOWN_INPUTS.indexOf(k) < 0; });
    return { ok: true, state: stateFromInputs(data.inputs), ignored: ignored };
  }
  function applyImport(data) {
    var l = curLang();
    var r = importRecord(data);
    if (!r.ok) { if (ui) ui.notify(L(IMPORT_MSG.bad, l), { kind: 'bad' }); return r; }
    Object.keys(state).forEach(function (k) { delete state[k]; });
    Object.keys(r.state).forEach(function (k) { state[k] = r.state[k]; });
    recompute();
    if (ui) {
      ui.sync(); ui.run();
      ui.notify(fill(L(IMPORT_MSG.ok, l), { n: state.tasks.length, ign: r.ignored.length ? r.ignored.join(', ') : L(IMPORT_MSG.none, l) }), { kind: 'ok' });
    }
    return r;
  }

  function buildRecord() {
    if (!Array.isArray(state.tasks) || !state.tasks.length) return null;
    var R = recompute();
    var l = curLang();
    return {
      inputs: recordInputs(state),
      outputs: recordOutputs(R),
      units: UNITS,
      model: {
        equations: [
          'E_m = p0^2 * 10^(0.1 * LAeq_m) * T_m   [Pa2 h], p0 = 20 uPa',
          'LEX,8h = 10 lg( sum(E_m) / (p0^2 * T0) )',
          'LAeq,Te = 10 lg( sum(E_m) / (p0^2 * Te) )',
          'S_m = 100 * E_m / sum(E_m)   [energy share, %]',
          "E'_m = E_m * [W_m * 10^(-A_m/10) + (1 - W_m)]   [W_m: wear fraction]",
          "SNR: A_m = LAeq_m - (LCeq_m - (SNR - derating)); simplified: A = SNR - derating",
          'HML: PNR = M - (H-M)/4 (LC-LA-2) if LC-LA <= 2 else M - (M-L)/8 (LC-LA-2); A = PNR - derating'
        ],
        ranges: ['levels 0-150 dB(A); durations > 0 h, total <= 24 h; 0 < T0 <= 24 h; equal-energy rule (3 dB exchange rate)'],
        notes: ['threshold comparisons use levels rounded to 0.1 dB; action values use the exposure without protector, the limit value the at-ear estimate']
      },
      warnings: R.findings.filter(function (f) { return f.status !== 'info'; })
        .map(function (f) { return f.rule + ': ' + findingText(f, l); })
    };
  }

  function assumptionsRows(s, R, l) {
    var rows = [];
    rows.push([T('Reference duration T0', 'Опорна тривалість T0', 'Bezugsdauer T0', 'Referentieduur T0', 'Durée de référence T0', 'Duración de referencia T0', 'Czas odniesienia T0'),
               num(s.T0) != null ? nf(s.T0, 2, l) + ' ' + L(UNIT_H, l) : '—', '', R.crit.eightHour ? L(RPT.fixed8, l) : '']);
    rows.push([T('Expanded uncertainty U', 'Розширена невизначеність U', 'Erweiterte Unsicherheit U', 'Uitgebreide onzekerheid U', 'Incertitude élargie U', 'Incertidumbre expandida U', 'Niepewność rozszerzona U'),
               num(s.U) ? '±' + nf(s.U, 1, l) + ' ' + L(UNIT_DB, l) : L(LBL.notStated, l), '', L(RPT.userValue, l)]);
    rows.push([RPT.method, L(PROT_LABEL[s.prot] || PROT_LABEL.none, l), '', '']);
    if (s.prot === 'user') rows.push([T('Effective attenuation', 'Ефективне послаблення', 'Wirksame Dämmung', 'Effectieve demping', 'Atténuation effective', 'Atenuación efectiva', 'Tłumienie efektywne'), num(s.att) != null ? nf(s.att, 1, l) + ' ' + L(UNIT_DB, l) : '—', '', L(RPT.userValue, l)]);
    if (s.prot === 'snr_lc' || s.prot === 'snr_la') rows.push([RPT.labelled, 'SNR ' + (num(s.snr) != null ? nf(s.snr, 1, l) : '—') + ' ' + L(UNIT_DB, l), '', L(RPT.userValue, l)]);
    if (s.prot === 'hml') rows.push([RPT.labelled, 'H ' + nf(num(s.hH), 1, l) + ' · M ' + nf(num(s.hM), 1, l) + ' · L ' + nf(num(s.hL), 1, l) + ' ' + L(UNIT_DB, l), '', L(RPT.userValue, l)]);
    if (s.prot === 'snr_lc' || s.prot === 'snr_la' || s.prot === 'hml') rows.push([T('Real-world derating', 'Зниження для реальних умов', 'Praxisabschlag', 'Praktijkcorrectie', 'Minoration en situation réelle', 'Corrección de uso real', 'Poprawka na warunki rzeczywiste'), num(s.derate) != null ? nf(s.derate, 1, l) + ' ' + L(UNIT_DB, l) : '—', '', 'NOISE-P-004']);
    return rows;
  }

  function reportProfile(rec, ctx) {
    var l = (ctx && (ctx.domainLang || ctx.lang)) || curLang();
    if (LANGS.indexOf(l) < 0) l = 'en';
    var s = stateFromInputs(rec.inputs);
    var R = evaluate(s);
    var c = R.crit, ns = L(LBL.notStated, l);
    var tiles = [
      { key: 'LEX_8h', label: L(LBL.lexAmb, l), text: R.ok ? nf(R.LEX, 1, l) + ' dB(A)' : '—' },
      { key: 'LEX_8h_at_ear', label: L(LBL.lexEar, l), text: R.ok && R.earOk ? nf(R.protActive ? R.LEXear : R.LEX, 1, l) + ' dB(A)' : '—',
        note: R.ok && !R.protActive ? L(LBL.noProt, l) : '' },
      { key: 'threshold_state', label: L(LBL.status, l), text: L(stateShort(R), l) },
      { key: 'T_e', label: L(LBL.te, l), text: R.Te != null ? nf(R.Te, 2, l) + ' ' + L(UNIT_H, l) : '—' },
      { key: 'dominant_task', label: L(LBL.dom, l), text: R.dominant ? taskName(R.tasks[R.dominant.i], l) : '—',
        note: R.dominant ? nf(R.dominant.share, 1, l) + ' % ' + L(LBL.of, l) : '' }
    ];
    var results = [];
    if (R.ok) {
      results.push({ key: 'LAeq_Te', label: L(LBL.laeqTe, l), text: nf(R.LAeqTe, 1, l) + ' dB(A)' });
      results.push({ key: 'E_A', label: L(LBL.ea, l), text: nf(R.EA, 3, l) + ' Pa²·h' });
      results.push({ key: 'wear_time', label: L(LBL.wear, l), text: nf(R.wear_h, 2, l) + ' ' + L(UNIT_H, l) });
    }
    results.push({ key: 'n_tasks', label: L(LBL.ntasks, l), text: String(R.tasks.length) });
    var checks = [];
    R.thresholds.forEach(function (th) {
      var st = th.state === 'exceeded' ? (th.key === 'limit' ? 'fail' : 'attention') : (th.state === 'review' ? 'attention' : 'info');
      checks.push({
        status: st,
        title: th.rule + ' · ' + L(NAMES[th.key], l) + ' ' + nf(th.value, 1, l) + ' dB(A) — ' + statusOfFinding(th.state, l),
        detail: L(LBL.compared, l) + ': ' + L(th.atEar ? LBL.earShort : LBL.ambientShort, l),
        actual: th.level != null ? nf(th.level, 1, l) + ' dB(A)' : '—',
        basis: RULES[th.rule].basis.source
      });
    });
    R.findings.forEach(function (f) {
      checks.push({ status: reportStatus(f.status),
                    title: f.rule + ' · ' + findingText(f, l),
                    basis: RULES[f.rule].basis.source });
    });
    var figs = [];
    try {
      var cv = reportFigureCanvas(s, R, l);
      var fig = ctx && ctx.figure ? ctx.figure(cv, { caption: L(RPT.figCap, l), alt: L(RPT.figCap, l) }) : null;
      if (fig) figs.push(fig);
    } catch (e) { /* the report still prints without its figure */ }
    var taskRows = R.tasks.map(function (t) {
      return [String(t.i + 1), taskName(t, l), t.LA != null ? nf(t.LA, 1, l) : '—', t.h != null ? nf(t.h, 2, l) : '—',
              t.LC != null ? nf(t.LC, 1, l) : '—', nf(t.worn, 0, l),
              R.ok ? nf(t.lexPart, 1, l) : '—', R.ok ? nf(t.share, 1, l) : '—',
              R.ok && t.att != null ? nf(t.att, 1, l) : '—',
              R.ok && t.Lear != null ? nf(t.Lear, 1, l) : '—'];
    });
    return {
      title: RPT.title,
      project: [
        { label: L(LBL.pack, l), value: presetName(c, l) },
        { label: L(LBL.source, l), value: c.source || ns },
        { label: L(LBL.jur, l), value: c.jurisdiction || ns },
        { label: L(LBL.ver, l), value: c.version || ns }
      ],
      executive: { text: [L(stateText(R), l) + ' ' + L(RPT.scope, l)], results: tiles, conclusion: '' },
      assumptions: assumptionsRows(s, R, l),
      results: results,
      decisions: [],
      checks: checks,
      risks: [],
      figures: figs,
      inputs: [],
      appendices: [
        { title: L(LBL.taskTitle, l),
          head: [L(LBL.n, l), L(LBL.task, l), 'LAeq', 'T, h', 'LCeq', 'w, %', 'LEX,i', 'S, %', 'A', 'L′A'],
          cols: '9mm minmax(0,2.2fr) 13mm 13mm 13mm 12mm 14mm 13mm 12mm 13mm',
          rows: taskRows,
          notes: [L(RPT.symKey, l), L(RPT.figKey, l)] },
        { title: L(RPT.rules, l),
          head: ['ID', L(RPT.kind, l), L(RPT.text, l), L(LBL.source, l)],
          cols: '24mm 22mm minmax(0,3fr) minmax(0,1.3fr)',
          rows: RULE_IDS.map(function (id) {
            var r = RULES[id];
            return [id, L(KIND_LABEL[r.basis.kind], l), L(r.text, l), r.basis.source];
          }) }
      ],
      method: {
        ranges: [L(RPT.ranges, l)],
        notes: [L(RPT.notes1, l), L(RPT.notes2, l)],
        references: [RPT.refs].concat(ctx && ctx.manifest && ctx.manifest.validation && ctx.manifest.validation.basis
          ? [L(ctx.manifest.validation.basis, l)] : [])
      },
      labels: {}
    };
  }

  var PY_CODE = "P0 = 2e-5\n_LEVEL_MIN = 0.0\n_LEVEL_MAX = 150.0\n_PRESETS = {\"eu2003\": {\"lower\": 80.0, \"upper\": 85.0, \"limit\": 87.0, \"eight_hour\": True}}\n_METHODS = [\"none\", \"user\", \"snr_lc\", \"snr_la\", \"hml\"]\n\n\ndef _num(v):\n    if isinstance(v, bool) or not isinstance(v, (int, float)):\n        return None\n    return float(v) if math.isfinite(v) else None\n\n\ndef _r1(x):\n    # JavaScript Math.round(x * 10) / 10\n    return math.floor(x * 10 + 0.5) / 10\n\n\ndef _criteria(inp):\n    if inp.get(\"preset\") != \"custom\":\n        p = _PRESETS.get(inp.get(\"preset\"), _PRESETS[\"eu2003\"])\n        return {\"id\": inp.get(\"preset\") if inp.get(\"preset\") in _PRESETS else \"eu2003\",\n                \"lower\": p[\"lower\"], \"upper\": p[\"upper\"], \"limit\": p[\"limit\"],\n                \"eight_hour\": p[\"eight_hour\"], \"valid\": True}\n    lo, up, li = _num(inp.get(\"criteria_lower\")), _num(inp.get(\"criteria_upper\")), _num(inp.get(\"criteria_limit\"))\n    valid = lo is not None and up is not None and li is not None and lo <= up <= li\n    return {\"id\": \"custom\", \"lower\": lo, \"upper\": up, \"limit\": li, \"eight_hour\": False, \"valid\": valid}\n\n\ndef _attenuation(inp, t):\n    \"\"\"Attenuation credited to one worn task, dB; None when the data are incomplete.\"\"\"\n    m = inp.get(\"protection\")\n    d = _num(inp.get(\"derating\"))\n    if m == \"user\":\n        a = _num(inp.get(\"attenuation_user\"))\n        if a is None or a < 0 or a > 60:\n            return None\n        return a\n    if m in (\"snr_la\", \"snr_lc\", \"hml\"):\n        if d is None or d < 0 or d > 30:\n            return None\n    if m == \"snr_la\":\n        snr = _num(inp.get(\"snr\"))\n        if snr is None or snr < 0 or snr > 60:\n            return None\n        raw = snr - d\n    elif m == \"snr_lc\":\n        snr = _num(inp.get(\"snr\"))\n        if snr is None or snr < 0 or snr > 60:\n            return None\n        lc = t[\"LC\"]\n        if lc is None or lc < _LEVEL_MIN or lc > _LEVEL_MAX + 10:\n            return None\n        raw = t[\"LA\"] - (lc - (snr - d))\n    elif m == \"hml\":\n        H, M, Lo = _num(inp.get(\"hml_h\")), _num(inp.get(\"hml_m\")), _num(inp.get(\"hml_l\"))\n        if None in (H, M, Lo) or min(H, M, Lo) < 0 or max(H, M, Lo) > 60:\n            return None\n        lc = t[\"LC\"]\n        if lc is None or lc < _LEVEL_MIN or lc > _LEVEL_MAX + 10:\n            return None\n        dd = lc - t[\"LA\"]\n        pnr = M - (H - M) / 4 * (dd - 2) if dd <= 2 else M - (M - Lo) / 8 * (dd - 2)\n        raw = pnr - d\n    else:\n        return 0.0\n    return 0.0 if raw < 0 else raw\n\n\ndef compute(inp=None):\n    inp = INPUTS if inp is None else inp\n    T0 = _num(inp.get(\"T0\"))\n    tasks = []\n    bad = False\n    Te = 0.0\n    for i, t in enumerate(inp.get(\"tasks\") or []):\n        label = str(t.get(\"label\") or \"\").strip() or \"#%d\" % (i + 1)\n        LA, h = _num(t.get(\"LAeq\")), _num(t.get(\"duration_h\"))\n        worn = _num(t.get(\"worn_pct\"))\n        worn = 0.0 if worn is None else worn\n        ok = True\n        if LA is None or LA < _LEVEL_MIN or LA > _LEVEL_MAX:\n            ok = False\n        if h is None or h <= 0:\n            ok = False\n        if worn < 0 or worn > 100:\n            ok = False\n        if ok:\n            Te += h\n        else:\n            bad = True\n        tasks.append({\"i\": i, \"label\": label, \"LA\": LA, \"h\": h, \"LC\": _num(t.get(\"LCeq\")), \"worn\": worn})\n    t0ok = T0 is not None and 0 < T0 <= 24\n    teok = Te <= 24 + 1e-9\n    ok = len(tasks) > 0 and not bad and t0ok and teok\n    out = {\"LEX_8h\": None, \"LAeq_Te\": None, \"T_e\": None if bad else Te, \"E_A\": None,\n           \"dominant_task\": None, \"dominant_share\": None, \"threshold_state\": \"insufficient\",\n           \"limit_state\": \"review\", \"protection_active\": False, \"LEX_8h_at_ear\": None,\n           \"wear_time\": None, \"n_tasks\": len(tasks), \"tasks\": []}\n    if not ok:\n        return out\n    sumE = 0.0\n    for t in tasks:\n        t[\"E\"] = P0 * P0 * math.pow(10, 0.1 * t[\"LA\"]) * t[\"h\"]\n        sumE += t[\"E\"]\n    lex = 10 * math.log10(sumE / (P0 * P0 * T0))\n    dom = None\n    for t in tasks:\n        t[\"share\"] = 100 * t[\"E\"] / sumE\n        t[\"part\"] = 10 * math.log10(t[\"E\"] / (P0 * P0 * T0))\n        if dom is None or t[\"E\"] > dom[\"E\"]:\n            dom = t\n    method = inp.get(\"protection\") if inp.get(\"protection\") in _METHODS else \"none\"\n    any_worn = any(t[\"worn\"] > 0 for t in tasks)\n    prot = method != \"none\" and any_worn\n    wear_h = 0.0\n    ear_ok = True\n    sumEar = 0.0\n    for t in tasks:\n        w = t[\"worn\"] / 100 if prot else 0.0\n        t[\"att\"] = None\n        if w > 0:\n            a = _attenuation(inp, t)\n            if a is None:\n                ear_ok = False\n                t[\"Eear\"] = None\n                continue\n            t[\"att\"] = a\n            t[\"Eear\"] = t[\"E\"] * (w * math.pow(10, -a / 10) + (1 - w))\n            wear_h += t[\"h\"] * w\n        else:\n            t[\"Eear\"] = t[\"E\"]\n        t[\"Lear\"] = 10 * math.log10(t[\"Eear\"] / (P0 * P0 * t[\"h\"]))\n        sumEar += t[\"Eear\"]\n    lex_ear = None\n    for t in tasks:\n        if ear_ok:\n            t[\"share_ear\"] = 100 * t[\"Eear\"] / sumEar\n        else:\n            t[\"Lear\"] = None\n            t[\"share_ear\"] = None\n    if ear_ok:\n        lex_ear = 10 * math.log10(sumEar / (P0 * P0 * T0))\n    c = _criteria(inp)\n    if not c[\"valid\"]:\n        state, limit_state = \"criteria_invalid\", \"review\"\n    else:\n        amb = _r1(lex)\n        ear_level = (_r1(lex_ear) if ear_ok else None) if prot else amb\n        limit_state = \"review\" if ear_level is None else (\"exceeded\" if ear_level > c[\"limit\"] else \"not_exceeded\")\n        if limit_state == \"exceeded\":\n            state = \"limit_exceeded\"\n        elif limit_state == \"review\" and amb > c[\"limit\"]:\n            state = \"limit_review\"\n        elif amb > c[\"upper\"]:\n            state = \"upper_exceeded\"\n        elif amb > c[\"lower\"]:\n            state = \"lower_exceeded\"\n        else:\n            state = \"below_lower\"\n    out.update({\n        \"LEX_8h\": lex,\n        \"LAeq_Te\": 10 * math.log10(sumE / (P0 * P0 * Te)),\n        \"E_A\": sumE,\n        \"dominant_task\": dom[\"label\"],\n        \"dominant_share\": dom[\"share\"],\n        \"threshold_state\": state,\n        \"limit_state\": limit_state,\n        \"protection_active\": prot,\n        \"LEX_8h_at_ear\": (lex_ear if prot else lex) if ear_ok else None,\n        \"wear_time\": wear_h,\n        \"tasks\": [{\"label\": t[\"label\"], \"E_A\": t[\"E\"], \"LEX_part\": t[\"part\"], \"share\": t[\"share\"],\n                   \"L_ear\": t.get(\"Lear\"), \"share_ear\": t.get(\"share_ear\"), \"att\": t[\"att\"]} for t in tasks],\n    })\n    return out\n";

  function pythonSpec() {
    if (!Array.isArray(state.tasks) || !state.tasks.length) return { unsupported: 'no tasks are listed, so there is nothing to export' };
    return {
      code: PY_CODE,
      requires: [],
      scope: 'daily exposure, energy shares, protector estimate and threshold state; the localized findings text is not exported',
      basis: { kind: 'reproduce',
               note: 'the page\'s evaluate() is ported line by line: validation, energy sum in Pa2 h, shares, protector attenuation (user, SNR, simplified SNR, HML), part-time wear and the rounded threshold comparison',
               deviation: 'none expected beyond floating-point pow/log10 differences between JavaScript and Python (below 1e-12 relative)' },
      selftest: { tolerance: 1e-9, note: 'faithful port; the bound covers floating-point pow/log10 differences between the two runtimes' }
    };
  }

  function installData() {
    if (!window.Diagram) return;
    Diagram.init({
      id: 'noiseexposure',
      file: 'noiseexposure.html',
      state: {
        serialize: function () { return recordInputs(state); },
        deserialize: function (o) {
          var s = stateFromInputs(o);
          Object.keys(state).forEach(function (k) { delete state[k]; });
          Object.keys(s).forEach(function (k) { state[k] = s[k]; });
          recompute();

    add('I18N-findings', 'NOISE-V-001', 'positive', 'finding texts render in seven languages without placeholders', badText.length === 0, badText.slice(0, 5), []);
    var dec = LANGS.map(function (lg) { return nf(80.5, 1, lg); });
    add('I18N-locale', 'NOISE-M-001', 'positive', 'decimal separator follows the language',
        dec[0] === '80.5' && dec.slice(1).every(function (x) { return x === '80,5'; }) && nf(1234.5, 1, 'de') === '1.234,5', dec, ['80.5', '80,5 x6']);
    add('PY-code', 'NOISE-M-001', 'positive', 'python port carries compute() and the HML branch', /def compute\(/.test(PY_CODE) && /pnr = M - \(H - M\) \/ 4/.test(PY_CODE), PY_CODE.length, '> 0');
    return out;
  };

  /* ===================================================== 9. benchmark adapter
     Maps each case of the independent reference corpus onto the page's own
     state and runs evaluate(), the function the interface uses. */
  var BENCH_REVISION = '2026-09-16.noiseexposure.b2';
  var BENCH_REF_URL = 'benchmarks/noiseexposure.reference.json';
  var REF_SHA256 = '4f35424c7bfbf69d6fba1d99b4dd25580e82a1c3f6adaf7b209bfc21862c4216';
  var BENCH_METHOD = { none: 'none', user_attenuation: 'user', snr_lceq: 'snr_lc', snr_laeq: 'snr_la', hml: 'hml' };

  function benchState(inp) {
    var notes = [];
    var s = JSON.parse(JSON.stringify(DEFAULTS));
    s.T0 = inp.T0_h;                                   /* non-numbers stay non-numbers: num() rejects them */
    s.U = inp.uncertainty_U_dB == null ? 0 : inp.uncertainty_U_dB;
    var c = inp.criteria || {};
    if (c.pack === 'user') {
      s.preset = 'custom';
      s.cLower = c.lower; s.cUpper = c.upper; s.cLimit = c.limit;
      s.cSource = c.source || ''; s.cJur = c.jurisdiction || ''; s.cVer = '';
    } else if (c.pack === 'EU - Directive 2003/10/EC') {
      s.preset = 'eu2003';
    } else {
      notes.push('criteria pack "' + c.pack + '" has no counterpart in the tool');
    }
    var p = inp.protector || {};
    var m = BENCH_METHOD[p.method];
    if (!m) notes.push('protector method "' + p.method + '" has no counterpart in the tool');
    s.prot = m || 'none';
    var d = p.derating_dB == null ? 0 : p.derating_dB;
    if (m === 'user') {
      /* the tool's user method takes the net effective attenuation; the reference's
         derating is added to the at-ear level, i.e. subtracted from the attenuation */
      s.att = typeof p.attenuation_dB === 'number' ? p.attenuation_dB - d : p.attenuation_dB;
      if (d) notes.push('user attenuation ' + p.attenuation_dB + ' dB with derating ' + d + ' dB entered as the tool\'s net effective attenuation ' + s.att + ' dB');
    } else {
      s.derate = d;
    }
    if (p.snr_dB !== undefined) s.snr = p.snr_dB;
    if (p.H_dB !== undefined) { s.hH = p.H_dB; s.hM = p.M_dB; s.hL = p.L_dB; }
    s.tasks = (inp.tasks || []).map(function (t) {
      return { label: t.name, LA: t.laeq_dBA, h: t.duration_h,
               LC: t.lceq_dBC === undefined ? null : t.lceq_dBC,
               worn: t.wear_pct == null ? 0 : t.wear_pct };
    });
    return { state: s, notes: notes };
  }

  function benchValue(name, R) {
    var hasF = function (rule) { return R.findings.some(function (f) { return f.rule === rule; }); };
    var th = function (k) { for (var i = 0; i < R.thresholds.length; i++) if (R.thresholds[i].key === k) return R.thresholds[i]; return null; };
    if (name.indexOf('energy_share_') === 0) {
      var nm = name.slice(13);
      for (var i = 0; i < R.tasks.length; i++) if (R.tasks[i].label === nm) return R.ok ? R.tasks[i].share / 100 : null;
      return undefined;
    }
    switch (name) {
      case 'LEX_T0_dBA': case 'ambient_LEX_dBA': return R.ok ? R.LEX : null;
      case 'LAeq_Te_dBA': return R.ok ? R.LAeqTe : null;
      case 'Te_h': return R.Te;
      case 'EA_Pa2h': return R.ok ? R.EA : null;
      case 'dominant_task': return R.dominant ? R.dominant.label : null;
      case 'lower_action_exceeded': case 'upper_action_exceeded': case 'limit_exceeded': {
        var t = th(name.split('_')[0]);
        return t ? (t.state === 'review' ? 'review' : t.state === 'exceeded') : null;
      }
      case 'at_ear_LEX_dBA': return R.ok && R.earOk ? (R.protActive ? R.LEXear : R.LEX) : null;
      case 'at_ear_estimate_available': return !!(R.ok && R.earOk && (!R.protActive || R.LEXear != null));
      case 'at_ear_not_below_ambient_or_refused':
        return !(R.ok && R.earOk) || R.LEXear == null || R.LEXear >= R.LEX - 1e-12;
      case 'flag_T0_not_8h': return hasF('NOISE-T-005');
      case 'preset_shows_source_and_jurisdiction': return !!(R.crit.source && R.crit.jurisdiction);
      case 'preset_values_80_85_87': return [R.crit.lower, R.crit.upper, R.crit.limit];
      case 'pack_shows_source': return !!R.crit.source;
      case 'source_missing_flagged': return hasF('NOISE-C-001');
      case 'limitation_flag_snr_simplified': return hasF('NOISE-P-003');
      case 'review_flag_threshold_within_U': return hasF('NOISE-T-004');
      case 'is_insufficient_or_refused': return !R.ok || R.state === 'insufficient';
      case 'result_is_clear':
        /* the page's clear state: a computed result at or below the lower value,
           valid criteria, a complete at-ear estimate and no insufficient-data finding */
        return R.ok && R.crit.valid && R.earOk && R.state === 'below_lower' &&
          !R.findings.some(function (f) { return f.status === 'insufficient'; });
    }
    return undefined;
  }

  function benchCompare(got, chk) {
    var ref = chk.ref, tol = chk.tol, rel = null, ok;
    if (typeof ref === 'number') {
      if (typeof got !== 'number' || !isFinite(got)) ok = false;
      else {
        var d = Math.abs(got - ref);
        rel = ref !== 0 ? d / Math.abs(ref) : (d === 0 ? 0 : null);
        if (tol && typeof tol === 'object' && tol.abs != null) ok = d <= tol.abs;
        else if (tol && typeof tol === 'object' && tol.rel != null) ok = (ref === 0 ? d === 0 : d / Math.abs(ref) <= tol.rel);
        else ok = d === 0;
      }
    } else {
      ok = JSON.stringify(got) === JSON.stringify(ref);
    }
    return { got: got === undefined ? null : got, ref: ref, tol: tol, rel: rel, ok: !!ok, ref_source: 'recomputed' };
  }

  async function sha256Hex(text) {
    try {
      var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    } catch (e) { return null; }
  }

  /* topic headings for the reference's not-benchmarked list; texts stay verbatim */
  var BENCH_NB_TOPICS = ['Rounding band', 'Peak sound pressure', 'Weekly, octave band, CSV import',
    'Over-protection', 'Level and T0 upper bounds', 'Exports and rendering', 'Random case count'];
  function benchNotBenchmarked(list) {
    if (!Array.isArray(list)) return list || {};
    var o = {};
    list.forEach(function (t, i) {
      var k = BENCH_NB_TOPICS[i] || ('Item ' + (i + 1));
      while (o[k] !== undefined) k += ' +';
      o[k] = t;
    });
    return o;
  }

  window.__dgcBenchmark = async function () {
    var resp, text;
    try { resp = await fetch(BENCH_REF_URL, { credentials: 'same-origin', cache: 'no-store' }); }
    catch (e) { throw new Error('Benchmark reference ' + BENCH_REF_URL + ' could not be loaded: ' + (e && e.message || e)); }
    if (!resp.ok) throw new Error('Benchmark reference ' + BENCH_REF_URL + ' could not be loaded: HTTP ' + resp.status);
    text = await resp.text();
    var hash = await sha256Hex(text);
    if (hash !== REF_SHA256) throw new Error('Benchmark reference ' + BENCH_REF_URL + ' refused: sha256 ' + hash + ' does not match the expected ' + REF_SHA256 + '.');
    var ref = JSON.parse(text);
    var cases = ref.cases.map(function (rc) {
      var m = benchState(rc.inputs);
      var R = evaluate(m.state);
      var cmp = {};
      var notes = m.notes.slice();
      Object.keys(rc.checks).forEach(function (k) {
        var got = benchValue(k, R);
        if (got === undefined) notes.push('check ' + k + ' has no counterpart in the tool');
        cmp[k] = benchCompare(got, rc.checks[k]);
      });
      var pass = Object.keys(cmp).every(function (k) { return cmp[k].ok; });
      return { id: rc.id, note: [rc.intent].concat(notes).join(' | '), inputs: rc.inputs, cmp: cmp, pass: pass };
    });
    var passed = cases.filter(function (c) { return c.pass; }).length;
    var tests = window.__safetyTests();
    var man = (window.Diagram && Diagram.manifest && Diagram.manifest()) || {};
    return {
      schema: 'tools.petrov.re/benchmark-artifact/v1',
      tool: 'noiseexposure',
      file: 'noiseexposure.html',
      manifest_revision: man.manifest_revision || BENCH_REVISION,
      build: man.manifest_revision || BENCH_REVISION,
      run_at: new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'),
      reference_provenance: 'recomputed',
      provenance_note: 'The reference corpus was authored independently without access to the tool code; this run recomputes every check from the shipping build against the stored reference values.',
      reference: ref.reference,
      reference_citations: ref.reference_citations,
      tolerance: ref.tolerance,
      total: cases.length,
      passed: passed,
      failed: cases.length - passed,
      flagged: 0,
      cases: cases,
      not_benchmarked: benchNotBenchmarked(ref.not_benchmarked),
      reference_sha256: hash,
      reference_sha256_expected: REF_SHA256,
      qa: {
        domain_self_tests: { status: tests.every(function (t) { return t.pass; }) ? 'pass' : 'fail',
                             note: tests.filter(function (t) { return t.pass; }).length + ' of ' + tests.length + ' built-in self-tests pass over ' + RULE_IDS.length + ' rule IDs.' },
        adapter: { status: 'pass', note: 'Every case runs evaluate(), the function behind the interface; user attenuation with derating is entered as the net effective attenuation (noted per case).' },
        python_export: { status: 'pass', note: 'The exported standard-library script reproduces the displayed outputs within 1e-9 relative.' }
      }
    };
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
