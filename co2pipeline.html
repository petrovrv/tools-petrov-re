function LEARN_A1(){
  return {
    intro:{
      title:T(
        "CO2 pipeline sizing",
        "Підбір діаметра CO2-трубопроводу",
        "Dimensionierung von CO2-Pipelines",
        "Dimensionering van CO2-pijpleidingen",
        "Dimensionnement des pipelines de CO2",
        "Dimensionamiento de tuberías de CO2",
        "Dobór średnicy rurociągu CO2"
      ),
      body:T(
        "This tool screens pipeline sizes from NPS 6 to NPS 48 and adds booster stations wherever the pressure falls below the minimum. It then checks the phase margin and selects the size with the lowest levelised transport cost (EUR/t).",
        "Інструмент перевіряє розміри NPS 6–48, додає дожимні станції, де тиск падає нижче мінімуму, перевіряє фазовий запас і обирає розмір з найнижчою нормованою вартістю транспортування (EUR/t).",
        "Das Tool prüft NPS 6–48, ergänzt Druckerhöhungsstationen bei Unterschreitung des Mindestdrucks, prüft den Phasenabstand und wählt die Größe mit den niedrigsten Transportgestehungskosten (EUR/t).",
        "De tool screent NPS 6–48, voegt boosterstations toe waar de druk onder het minimum zakt, controleert de fasemarge en kiest de maat met de laagste genivelleerde transportkosten (EUR/t).",
        "L'outil évalue les diamètres NPS 6 à 48, ajoute des stations de recompression lorsque la pression passe sous le minimum, vérifie la marge de phase et retient le diamètre au coût de transport actualisé le plus bas (EUR/t).",
        "La herramienta evalúa tamaños NPS 6–48, añade estaciones de refuerzo donde la presión cae por debajo del mínimo, comprueba el margen de fase y elige el tamaño con el menor coste nivelado de transporte (EUR/t).",
        "Narzędzie analizuje średnice NPS 6–48, dodaje stacje podnoszenia ciśnienia tam, gdzie ciśnienie spada poniżej minimum, sprawdza zapas fazowy i wybiera średnicę o najniższym uśrednionym koszcie transportu (EUR/t)."
      )
    },
    densephase:{
      title:T(
        "Dense phase vs gas phase",
        "Щільна фаза чи газова фаза",
        "Dichtphase vs. Gasphase",
        "Dichte fase versus gasfase",
        "Phase dense ou phase gazeuse",
        "Fase densa frente a fase gaseosa",
        "Faza gęsta a faza gazowa"
      ),
      body:T(
        "CO2 can be transported in gas phase at low pressure or in dense phase (liquid or supercritical) above its critical pressure; the critical point is 31.0 °C and 73.8 bar. Dense phase is preferred for large flows because its high density allows smaller pipelines and lower pressure losses per tonne transported.",
        "CO2 транспортують у газовій фазі або в щільній фазі вище критичної точки (31,0 °C, 73,8 бар), яка є кращою для великих потоків завдяки високій густині.",
        "CO2 wird in der Gasphase oder in der Dichtphase oberhalb des kritischen Punkts (31,0 °C, 73,8 bar) transportiert, die sich wegen ihrer hohen Dichte für große Mengen eignet.",
        "CO2 wordt vervoerd in gasfase of in dichte fase boven het kritieke punt (31,0 °C, 73,8 bar), die door de hoge dichtheid de voorkeur heeft bij grote debieten.",
        "Le CO2 est transporté en phase gazeuse ou en phase dense au-delà du point critique (31,0 °C, 73,8 bar), privilégiée pour les grands débits grâce à sa forte densité.",
        "El CO2 se transporta en fase gaseosa o en fase densa por encima del punto crítico (31,0 °C, 73,8 bar), preferida para grandes caudales por su alta densidad.",
        "CO2 transportuje się w fazie gazowej lub w fazie gęstej powyżej punktu krytycznego (31,0 °C, 73,8 bar), preferowanej przy dużych przepływach ze względu na wysoką gęstość."
      )
    }
  };
}

var LEARN = LEARN_A1();
(function (x) { for (var k in x) LEARN[k] = x[k]; })({
friction: { title: T("Friction & elevation losses","Втрати на тертя та підйом","Reibungs- und Höhenverluste","Wrijvings- en hoogteverliezen","Pertes par frottement et dénivelé","Pérdidas por fricción y elevación","Straty tarcia i wzniesienia"), body: T("Darcy-Weisbach dp = f·(L/D)·ρv²/2 with Colebrook friction factor (roughness 45 µm), plus hydrostatic head ρg·dz. Dense CO2 (~900 kg/m³): a 100 m rise costs ≈ 9 bar. The route is marched segment by segment using real-gas properties.","Дарсі-Вейсбах dp = f·(L/D)·ρv²/2, f за Колбруком (шорсткість 45 µm), плюс гідростатика ρg·dz. Щільний CO2 ~900 kg/m³: підйом 100 m ≈ 9 bar. Розрахунок по сегментах з реальними властивостями газу.","Darcy-Weisbach dp = f·(L/D)·ρv²/2, f nach Colebrook (Rauheit 45 µm), plus hydrostatischer Anteil ρg·dz. Dichtes CO2 ~900 kg/m³: 100 m Anstieg ≈ 9 bar. Segmentweise Berechnung mit Realgaseigenschaften.","Darcy-Weisbach dp = f·(L/D)·ρv²/2, f volgens Colebrook (ruwheid 45 µm), plus hydrostatische term ρg·dz. Dicht CO2 ~900 kg/m³: 100 m stijging ≈ 9 bar. Berekening per segment met reëlegaseigenschappen.","Darcy-Weisbach dp = f·(L/D)·ρv²/2, f de Colebrook (rugosité 45 µm), plus charge hydrostatique ρg·dz. CO2 dense ~900 kg/m³ : 100 m de montée ≈ 9 bar. Calcul par segments avec propriétés de gaz réel.","Darcy-Weisbach dp = f·(L/D)·ρv²/2, f de Colebrook (rugosidad 45 µm), más carga hidrostática ρg·dz. CO2 denso ~900 kg/m³: subir 100 m ≈ 9 bar. Cálculo por segmentos con propiedades de gas real.","Darcy-Weisbach dp = f·(L/D)·ρv²/2, f wg Colebrooka (chropowatość 45 µm), plus człon hydrostatyczny ρg·dz. Gęsty CO2 ~900 kg/m³: wzniesienie 100 m ≈ 9 bar. Obliczenia odcinkami z właściwościami gazu rzeczywistego.") },
boosters: { title: T("Booster stations","Бустерні станції","Druckerhöhungsstationen","Boosterstations","Stations de recompression","Estaciones de refuerzo","Stacje podnoszenia ciśnienia"), body: T("Boosters are placed wherever pressure falls below p_min (90 bar dense phase, 20 bar gas phase) and re-pressurise flow to inlet pressure. Dense phase uses pumps, gas phase intercooled compressors. Offshore sites only if allowed; maximum five stations.","Бустер ставиться, де тиск падає нижче p_min (90 bar щільна фаза, 20 bar газ), і відновлює тиск до вхідного. Насос для щільної фази, компресор з проміжним охолодженням для газу. Офшор лише за дозволу; максимум 5.","Booster dort, wo p unter p_min fällt (90 bar dicht, 20 bar gasförmig); Wiederverdichtung auf Eintrittsdruck. Pumpe für dichte Phase, zwischengekühlter Verdichter für Gas. Offshore nur wenn erlaubt; max. 5.","Booster waar p onder p_min daalt (90 bar dicht, 20 bar gas); herstel tot inlaatdruk. Pomp voor dichte fase, compressor met tussenkoeling voor gas. Offshore alleen indien toegestaan; max. 5.","Booster placé où p passe sous p_min (90 bar dense, 20 bar gaz) ; recompression jusqu'à la pression d'entrée. Pompe en phase dense, compresseur à refroidissement intermédiaire en gaz. Offshore seulement si autorisé ; max. 5.","Booster donde p cae bajo p_min (90 bar denso, 20 bar gas); represuriza hasta la presión de entrada. Bomba en fase densa, compresor con interenfriamiento en gas. Offshore solo si se permite; máx. 5.","Booster tam, gdzie p spada poniżej p_min (90 bar faza gęsta, 20 bar gaz); przywraca ciśnienie wlotowe. Pompa dla fazy gęstej, sprężarka z chłodzeniem międzystopniowym dla gazu. Offshore tylko jeśli dozwolone; maks. 5.") },
phase: { title: T("Phase margin", "Фазовий запас", "Phasenabstand", "Fasemarge", "Marge de phase", "Margen de fase", "Margines fazowy"), body: T("Phase margin is checked along the route. Dense: p - psat(T) >= 10 bar, or supercritical (31.0 °C, 73.8 bar). Gas: psat(T) - p >= 5 bar. Smallest margin is reported; violating sizes are rejected.", "Запас перевіряється вздовж траси. Щільна фаза: p - psat(T) >= 10 бар або надкритичний стан (31,0 °C, 73,8 бар). Газ: psat(T) - p >= 5 бар. Показується найменший запас; невідповідні розміри відхиляються.", "Abstand wird entlang der Trasse geprüft. Dichtphase: p - psat(T) >= 10 bar oder überkritisch (31,0 °C, 73,8 bar). Gas: psat(T) - p >= 5 bar. Kleinster Abstand wird angezeigt; unzulässige Größen werden verworfen.", "Marge wordt langs het tracé gecontroleerd. Dichte fase: p - psat(T) >= 10 bar of superkritisch (31,0 °C, 73,8 bar). Gas: psat(T) - p >= 5 bar. Kleinste marge wordt gemeld; ongeldige maten worden afgewezen.", "Marge vérifiée le long du tracé. Phase dense : p - psat(T) >= 10 bar ou supercritique (31,0 °C, 73,8 bar). Gaz : psat(T) - p >= 5 bar. Marge minimale affichée ; tailles non conformes rejetées.", "Margen comprobado a lo largo del trazado. Fase densa: p - psat(T) >= 10 bar o supercrítico (31,0 °C, 73,8 bar). Gas: psat(T) - p >= 5 bar. Se informa el margen mínimo; los tamaños que no cumplen se rechazan.", "Margines sprawdzany wzdłuż trasy. Faza gęsta: p - psat(T) >= 10 bar lub stan nadkrytyczny (31,0 °C, 73,8 bar). Gaz: psat(T) - p >= 5 bar. Podawany jest najmniejszy margines; niespełniające średnice są odrzucane.") },
thermal: { title: T("Thermal model", "Теплова модель", "Thermisches Modell", "Thermisch model", "Modèle thermique", "Modelo térmico", "Model termiczny"), body: T("Ground heat exchange uses U (default 2 W/m²K, outer surface) toward ground temperature Tg (10 °C). Real-gas enthalpy includes Joule-Thomson cooling; 'isothermal' option available. Buried lines approach Tg within tens of km; colder dense CO2 is denser.", "Теплообмін з ґрунтом через U (типово 2 Вт/м²К, зовнішня поверхня) до температури ґрунту Tg (10 °C). Ентальпія реального газу враховує охолодження Джоуля-Томсона; є опція 'isothermal'. Підземні лінії наближаються до Tg за десятки км; холодніший щільний CO2 щільніший.", "Wärmeaustausch mit dem Boden über U (Standard 2 W/m²K, Außenfläche) zur Bodentemperatur Tg (10 °C). Realgas-Enthalpie berücksichtigt Joule-Thomson-Abkühlung; Option 'isothermal'. Erdverlegte Leitungen nähern sich Tg innerhalb einiger zehn km; kälteres dichtes CO2 ist dichter.", "Warmte-uitwisseling met de bodem via U (standaard 2 W/m²K, buitenoppervlak) naar bodemtemperatuur Tg (10 °C). Reëel-gasenthalpie omvat Joule-Thomson-koeling; optie 'isothermal'. Ondergrondse leidingen naderen Tg binnen tientallen km; kouder dicht CO2 is dichter.", "Échange thermique avec le sol via U (2 W/m²K par défaut, surface extérieure) vers la température du sol Tg (10 °C). L'enthalpie gaz réel inclut le refroidissement Joule-Thomson ; option 'isothermal'. Les conduites enterrées approchent Tg en quelques dizaines de km ; le CO2 dense plus froid est plus dense.", "Intercambio térmico con el suelo mediante U (2 W/m²K por defecto, superficie exterior) hacia la temperatura del suelo Tg (10 °C). La entalpía de gas real incluye el enfriamiento Joule-Thomson; opción 'isothermal'. Las líneas enterradas se acercan a Tg en decenas de km; el CO2 denso más frío es más denso.", "Wymiana ciepła z gruntem przez U (domyślnie 2 W/m²K, powierzchnia zewnętrzna) do temperatury gruntu Tg (10 °C). Entalpia gazu rzeczywistego uwzględnia chłodzenie Joule'a-Thomsona; opcja 'isothermal'. Rurociągi podziemne zbliżają się do Tg w ciągu dziesiątek km; zimniejszy gęsty CO2 jest gęstszy.") },
wall: { title: T("Wall thickness (Barlow)","Товщина стінки (Барлоу)","Wanddicke (Barlow)","Wanddikte (Barlow)","Épaisseur de paroi (Barlow)","Espesor de pared (Barlow)","Grubość ścianki (Barlow)"), body: T("Barlow (ASME B31.4/B31.8): t = MAOP·OD/(2·F·SMYS·Ew) + CA. Design factor F = 0.72 onshore, 0.77 offshore. API 5L X52–X70 (SMYS 359–483 MPa); corrosion allowance default 1 mm. Inner diameter ID = OD − 2t feeds hydraulics.","Барлоу (ASME B31.4/B31.8): t = MAOP·OD/(2·F·SMYS·Ew) + CA. F = 0,72 на суші, 0,77 на морі. API 5L X52–X70 (SMYS 359–483 МПа); CA 1 мм. ID = OD − 2t для гідравліки.","Barlow (ASME B31.4/B31.8): t = MAOP·OD/(2·F·SMYS·Ew) + CA. F = 0,72 an Land, 0,77 offshore. API 5L X52–X70 (SMYS 359–483 MPa); CA 1 mm. ID = OD − 2t für Hydraulik.","Barlow (ASME B31.4/B31.8): t = MAOP·OD/(2·F·SMYS·Ew) + CA. F = 0,72 op land, 0,77 offshore. API 5L X52–X70 (SMYS 359–483 MPa); CA 1 mm. ID = OD − 2t voor hydraulica.","Barlow (ASME B31.4/B31.8) : t = MAOP·OD/(2·F·SMYS·Ew) + CA. F = 0,72 à terre, 0,77 en mer. API 5L X52–X70 (SMYS 359–483 MPa) ; CA 1 mm. ID = OD − 2t pour l'hydraulique.","Barlow (ASME B31.4/B31.8): t = MAOP·OD/(2·F·SMYS·Ew) + CA. F = 0,72 en tierra, 0,77 costa afuera. API 5L X52–X70 (SMYS 359–483 MPa); CA 1 mm. ID = OD − 2t para hidráulica.","Barlow (ASME B31.4/B31.8): t = MAOP·OD/(2·F·SMYS·Ew) + CA. F = 0,72 na lądzie, 0,77 na morzu. API 5L X52–X70 (SMYS 359–483 MPa); CA 1 mm. ID = OD − 2t do hydrauliki.") },
cost: { title: T("Levelized cost of transport (LCOT)","Нормована вартість транспортування (LCOT)","Spezifische Transportkosten (LCOT)","Genivelleerde transportkosten (LCOT)","Coût actualisé du transport (LCOT)","Coste nivelado de transporte (LCOT)","Uśredniony koszt transportu (LCOT)"), body: T("LCOT (EUR/t) = (CAPEX·CRF + OPEX + electricity)/annual tonnes. Pipe L·(250+55·NPS) EUR, ×1.7 offshore; boosters 2500 EUR/kW, 0.65 scaling exponent. OPEX 1% (1.5% offshore) of pipe plus 4% of boosters. 8% discount, 25 years, EUR 2025; screening accuracy.","LCOT (EUR/т) = (CAPEX·CRF + OPEX + електроенергія)/річні тонни. Труба L·(250+55·NPS) EUR, ×1,7 на морі; бустери 2500 EUR/кВт, показник 0,65. OPEX 1% (1,5% на морі) труби + 4% бустерів. 8%, 25 р., EUR 2025; оціночна точність.","LCOT (EUR/t) = (CAPEX·CRF + OPEX + Strom)/Jahrestonnen. Rohr L·(250+55·NPS) EUR, ×1,7 offshore; Booster 2500 EUR/kW, Exponent 0,65. OPEX 1 % (1,5 % offshore) Rohr + 4 % Booster. 8 %, 25 J., EUR 2025; Screening-Genauigkeit.","LCOT (EUR/t) = (CAPEX·CRF + OPEX + elektriciteit)/jaartonnen. Leiding L·(250+55·NPS) EUR, ×1,7 offshore; boosters 2500 EUR/kW, exponent 0,65. OPEX 1% (1,5% offshore) leiding + 4% boosters. 8%, 25 jaar, EUR 2025; screeningnauwkeurigheid.","LCOT (EUR/t) = (CAPEX·CRF + OPEX + électricité)/tonnes annuelles. Conduite L·(250+55·NPS) EUR, ×1,7 en mer ; surpresseurs 2500 EUR/kW, exposant 0,65. OPEX 1 % (1,5 % en mer) conduite + 4 % surpresseurs. 8 %, 25 ans, EUR 2025 ; précision d'avant-projet.","LCOT (EUR/t) = (CAPEX·CRF + OPEX + electricidad)/toneladas anuales. Tubería L·(250+55·NPS) EUR, ×1,7 costa afuera; impulsores 2500 EUR/kW, exponente 0,65. OPEX 1% (1,5% costa afuera) tubería + 4% impulsores. 8%, 25 años, EUR 2025; precisión de estimación preliminar.","LCOT (EUR/t) = (CAPEX·CRF + OPEX + energia)/roczne tony. Rurociąg L·(250+55·NPS) EUR, ×1,7 na morzu; boostery 2500 EUR/kW, wykładnik 0,65. OPEX 1% (1,5% na morzu) rurociągu + 4% boosterów. 8%, 25 lat, EUR 2025; dokładność szacunkowa.") },
sizing: { title: T("Pipe sizing","Підбір діаметра","Rohrdimensionierung","Leidingdimensionering","Dimensionnement","Dimensionamiento","Dobór średnicy"), body: T("NPS 6-48 screened coarsely, best refined. Rejected if wall too thick, too many boosters, phase margin violated. Lowest LCOT wins: small pipe = cheap steel, big dp, boosters; large pipe = costly steel. Full level can force size. Velocity 1-3 m/s.","NPS 6-48: грубий відбір, потім уточнення найкращого. Відхилення: надто товста стінка, забагато бустерів, порушено фазовий запас. Перемагає мінімальний LCOT. Розмір можна задати на повному рівні. Швидкість 1-3 м/с.","NPS 6-48 grob geprüft, Bester verfeinert. Verworfen bei zu dicker Wand, zu vielen Boostern oder verletzter Phasenmarge. Minimale LCOT gewinnt. Größe in Stufe Voll festlegbar. Geschwindigkeit 1-3 m/s.","NPS 6-48 grof gescreend, beste verfijnd. Afgewezen bij te dikke wand, te veel boosters of geschonden fasemarge. Laagste LCOT wint. Maat te forceren op volledig niveau. Snelheid 1-3 m/s.","NPS 6-48 criblés grossièrement, le meilleur affiné. Rejet si paroi trop épaisse, trop de boosters ou marge de phase violée. Le LCOT minimal l'emporte. Taille imposable en niveau complet. Vitesse 1-3 m/s.","NPS 6-48 con cribado grueso, el mejor refinado. Rechazo si pared muy gruesa, demasiados boosters o margen de fase violado. Gana el LCOT mínimo. Tamaño forzable en nivel completo. Velocidad 1-3 m/s.","NPS 6-48: wstępna selekcja, najlepszy dopracowany. Odrzucenie przy zbyt grubej ściance, zbyt wielu boosterach lub naruszonym marginesie fazowym. Wygrywa minimalny LCOT. Średnicę można wymusić na poziomie pełnym. Prędkość 1-3 m/s.") },
linepack: { title: T("Linepack","Запас у трубопроводі","Leitungsinhalt","Linepack","Stock en conduite","Empaque de línea","Zapas w rurociągu"), body: T("Mass of CO2 held in the line, summed as rho·area·dx in kg. Dense phase holds several times more than gas, buffering capture flow swings. Matters for blowdown. Outlet pressure and temperature are passed to the storage stage.","Маса CO2 у трубі (сума rho·A·dx, кг). Щільна фаза вміщує в рази більше, ніж газ, і згладжує коливання потоку. Важливо для продувки. Тиск і температура на виході передаються до етапу зберігання.","CO2-Masse in der Leitung (Summe rho·A·dx, kg). Dichte Phase speichert ein Mehrfaches von Gas und puffert Schwankungen. Wichtig für Druckentlastung. Austrittsdruck und -temperatur gehen an die Speicherstufe.","CO2-massa in de leiding (som rho·A·dx, kg). Dichte fase bevat meermaals meer dan gas en buffert schommelingen. Belangrijk voor afblazen. Uitlaatdruk en -temperatuur gaan naar de opslagstap.","Masse de CO2 dans la conduite (somme rho·A·dx, kg). La phase dense en contient plusieurs fois plus que le gaz et amortit les variations. Important pour la décompression. P et T de sortie passent au stockage.","Masa de CO2 en la línea (suma rho·A·dx, kg). La fase densa contiene varias veces más que el gas y amortigua fluctuaciones. Importa para la despresurización. P y T de salida pasan al almacenamiento.","Masa CO2 w rurociągu (suma rho·A·dx, kg). Faza gęsta mieści kilka razy więcej niż gaz i buforuje wahania. Ważne przy zrzucie ciśnienia. Ciśnienie i temperatura wylotu trafiają do etapu składowania.") }
});

function STAGE_RENDER(size, st, r) {

  var cs = getComputedStyle(document.documentElement);
  function cv(n, f) { var v = cs.getPropertyValue(n); v = v && v.trim(); return v || f; }
  var muted = cv('--muted', '#888'), line = cv('--line', '#ddd'), font = cv('--font', 'sans-serif');
  var L = 52, R = 48, Tp = 12, B = 30, pw = w - L - R, ph = h - Tp - B;
  if (pw < 10 || ph < 10) return;
  var pr = r.profile, n = pr.x.length, i, X = [], P = [], TC = [], S = [];
  for (i = 0; i < n; i++) {
    X.push(pr.x[i] / 1000); P.push(pr.p[i] / 1e5); TC.push(pr.T[i] - 273.15);
    var s = pr.psat ? pr.psat[i] : NaN;
    S.push(isFinite(s) && s > 0 ? s / 1e5 : NaN);
  }
  function mm(arrs) {
    var lo = Infinity, hi = -Infinity, a, j, k;
    for (k = 0; k < arrs.length; k++) for (a = arrs[k], j = 0; j < a.length; j++)
      if (isFinite(a[j])) { if (a[j] < lo) lo = a[j]; if (a[j] > hi) hi = a[j]; }
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    var d = (hi - lo) || Math.abs(hi) || 1;
    return [lo - 0.08 * d, hi + 0.08 * d];
  }
  var x0 = X[0], x1 = X[n - 1] > x0 ? X[n - 1] : x0 + 1;
  var pr2 = mm([P, S]), pLo = 0, pHi = pr2[1] > 0 ? pr2[1] : 1;
  var tr = mm([TC]), tLo = tr[0], tHi = tr[1];
  function sx(v) { return L + (v - x0) / (x1 - x0) * pw; }
  function sp(v) { return Tp + ph - (v - pLo) / (pHi - pLo) * ph; }
  function stt(v) { return Tp + ph - (v - tLo) / (tHi - tLo) * ph; }
  ctx.font = '11px ' + font; ctx.lineWidth = 1; ctx.strokeStyle = line; ctx.fillStyle = muted;
  var xt = DiagramUI.ticks(x0, x1, pw, 1), yt = DiagramUI.ticks(pLo, pHi, ph, 1), v, px;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (i = 0; i < xt.length; i++) {
    v = xt[i]; if (v < x0 || v > x1) continue; px = Math.round(sx(v)) + 0.5;
    ctx.beginPath(); ctx.moveTo(px, Tp); ctx.lineTo(px, Tp + ph); ctx.stroke();
    ctx.fillText(DiagramUI.fmt(v, { precision: 0 }), px, Tp + ph + 4);
  }
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (i = 0; i < yt.length; i++) {
    v = yt[i]; if (v < pLo || v > pHi) continue; px = Math.round(sp(v)) + 0.5;
    ctx.beginPath(); ctx.moveTo(L, px); ctx.lineTo(L + pw, px); ctx.stroke();
    ctx.fillText(DiagramUI.fmt(v, { precision: 0 }), L - 6, px);
  }
  ctx.textAlign = 'left';
  for (i = 0; i < 4; i++) {
    v = tLo + (tHi - tLo) * i / 3;
    ctx.fillText(DiagramUI.fmt(v, { precision: (tHi - tLo) < 4 ? 1 : 0 }), L + pw + 6, stt(v));
  }
  ctx.strokeRect(L + 0.5, Tp + 0.5, pw, ph);

  ctx.textAlign = 'center'; ctx.fillText('bar', 0, 0); ctx.restore();
  ctx.textAlign = 'right'; ctx.fillText('°C', w - 4, Tp + 6);
  ctx.textBaseline = 'top'; ctx.fillText('km', w - 4, Tp + ph + 4);
  ctx.save(); ctx.beginPath(); ctx.rect(L, Tp, pw, ph); ctx.clip();
  function plot(arr, sy, col, lw, dash) {
    var pen = false;
    ctx.beginPath(); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.setLineDash(dash || []);
    for (var j = 0; j < n; j++) {
      if (!isFinite(arr[j])) { pen = false; continue; }
      if (pen) ctx.lineTo(sx(X[j]), sy(arr[j])); else ctx.moveTo(sx(X[j]), sy(arr[j]));
      pen = true;
    }
    ctx.stroke();
  }
  plot(S, sp, DiagramUI.series(2), 1.5, [5, 4]);
  plot(TC, stt, DiagramUI.series(1), 1.5);
  plot(P, sp, DiagramUI.series(0), 2);
  var bs = r.boosters || [];
  ctx.strokeStyle = muted; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
  for (i = 0; i < bs.length; i++) {
    px = Math.round(sx(bs[i].x / 1000)) + 0.5;
    ctx.beginPath(); ctx.moveTo(px, Tp); ctx.lineTo(px, Tp + ph); ctx.stroke();
  }
  ctx.restore();
}
var LEGEND = function () {
  return [
    { label: T('Pressure', 'Тиск', 'Druck', 'Druk', 'Pression', 'Presión', 'Ciśnienie'), series: 0 },
    { label: T('Temperature', 'Температура', 'Temperatur', 'Temperatuur', 'Température', 'Temperatura', 'Temperatura'), series: 1 },
    { label: T('Saturation pressure', 'Тиск насичення', 'Sättigungsdruck', 'Verzadigingsdruk', 'Pression de saturation', 'Presión de saturación', 'Ciśnienie nasycenia'), series: 2, dash: true }
  ];
};


  function adoptStage(app) { stage = app.stages[0] || null; if (stage) stage.legend({ items: LEGEND() }); }

  function degrade() {
    document.title = 'diagram-ui.js v1 is required';
    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1'); h.textContent = 'CO2 pipeline sizing';
    var p = document.createElement('p');
    p.textContent = 'The interactive interface could not load. The export, the calculation record and the limitations are still available from the bar at the bottom of the page.';
    host.appendChild(h); host.appendChild(p);
    if (window.CCUS && CCUS.pipe) run(state);
  }

  function boot() {
    if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1' && window.CCUS && CCUS.pipe && CCUS.core) buildInterface();
    else degrade();
    installData();
  }

  function buildInterface() {
    ui = DiagramUI.app({
      id: 'co2pipeline', mount: '#app', layout: 'calculator', compute: 'live',
      state: state, defaults: DEFAULTS,
      subtitle: MAN.summary,
      notices: [{ id: 'genre', tone: 'warn',
        title: T('What this number is', 'Що це за число', 'Was diese Zahl ist', 'Wat dit getal is', 'Ce que représente ce nombre', 'Qué es este número', 'Czym jest ta liczba'),
        text: MAN.limitations }],
      learn: {
        version: 1,
        intro: LEARN.intro,
        topics: (function () { var o = {}, k; for (k in LEARN) if (k !== 'intro') o[k] = LEARN[k]; return o; })(),
        tour: TOUR
      },
      panels: PANELS(),
      footer: MAN.description,
      on: {
        rebuild: adoptStage,
        compute: function (s) { run(s); if (stage) stage.schedule(); return COMPUTE(s, last); }
      }
    });
    ui.panel({ id: 'io', slot: 'inputs', actionsAlign: 'end', actions: [
      ui.importAction({
        label: T('Open a saved case…','Відкрити збережений випадок…','Gespeicherten Fall öffnen…','Opgeslagen geval openen…','Ouvrir un cas enregistré…','Abrir un caso guardado…','Otwórz zapisany przypadek…'),
        accept: '.json,application/json', as: 'json',
        run: function (data) {
          var src = (data && data.inputs) || data || {};
          Object.keys(DEFAULTS).forEach(function (k) { if (src[k] !== undefined && src[k] !== null && typeof src[k] === typeof DEFAULTS[k]) state[k] = src[k]; });
          ui.sync(); ui.run();
        }
      }),
      ui.resetAction()
    ]});
    ui.examples(EXAMPLES());
    ui.stage({
      caption: T('Pressure and temperature along the route','Тиск і температура вздовж траси','Druck und Temperatur entlang der Trasse','Druk en temperatuur langs het tracé','Pression et température le long du tracé','Presión y temperatura a lo largo del trazado','Ciśnienie i temperatura wzdłuż trasy'),
      minHeight: 260,
      a11y: function () {
        if (!last || !last.ok) return '';
        return 'Pressure falls from ' + DiagramUI.fmt(state.p_in / 1e5, { precision: 0 }) + ' to ' +
          DiagramUI.fmt(last.p_out / 1e5, { precision: 0 }) + ' bar over ' + DiagramUI.fmt(last.L / 1000, { precision: 0 }) +
          ' km with ' + (last.boosters || []).length + ' booster stations.';
      },
      render: function (size, st) { STAGE_RENDER(size, st, last && last.ok ? last : null); }
    });
    adoptStage(ui);
    ui.ready();
    window.__co2pipeline = { ui: ui, state: state, run: run, toInp: toInp };
  }

  function q(v, u) { return { value: v, unit: u }; }
  function installData() {
    if (!window.Diagram) return;
    Diagram.init({
      id: 'co2pipeline', file: 'co2pipeline.html',
      state: {
        serialize: function () { return state; },
        deserialize: function (o) { Object.assign(state, o || {}); if (window.CCUS && CCUS.pipe) run(state); if (ui) { ui.sync(); ui.run(); } }
      },
      record: function () {
        if (!last || !last.ok) return null;
        var inp = toInp(state);
        return {
          inputs: inp,
          outputs: { nps: last.nps, OD: last.OD, t: last.t, ID: last.ID, dp: last.dp, Q: last.Q, p_out: last.p_out, T_out: last.T_out,
            vmax: last.vmax, boosters: (last.boosters || []).length, linepack: last.linepack, phaseMin: last.phaseMin,
            capex: last.capex, lcot: last.lcot },
          units: { mdot: 'kg/s', L: 'm', p_in: 'Pa', T_in: 'K', Tg: 'K', z1: 'm', p_min: 'Pa', MAOP: 'Pa', U: 'W/m2K', CA: 'm', eps: 'm',
            nps: 'in', OD: 'm', t: 'm', ID: 'm', dp: 'Pa', Q: 'W', p_out: 'Pa', T_out: 'K', vmax: 'm/s', boosters: '-',
            linepack: 'kg', phaseMin: 'Pa', capex: 'EUR', lcot: 'EUR/t' },
          model: {
            equations: ['dp/dx = f rho v^2 / (2 ID) + rho g dz/dx (Darcy-Weisbach, Colebrook)',
              'dh = -(U pi OD (T - Tg) / mdot) dx - g dz (real-gas enthalpy, Span-Wagner)',
              't = MAOP OD / (2 F SMYS Ew) + CA (ASME B31.4/B31.8)',
              'LCOT = (CAPEX CRF + OPEX + electricity) / annual tonnes'],
            ranges: ['dense phase p - psat >= 10 bar, gas phase psat - p >= 5 bar; NPS 6-48'],
            notes: ['screening cost correlations (EUR 2025); not independently validated']
          },
          warnings: last.warnings || []
        };
      },
      handoff: {
        provides: ['mdot', 'p', 'T', 'D', 'L', 'dp', 'Q'],
        accepts: ['mdot', 'p', 'T'],
        build: function () {
          if (!last || !last.ok) return null;
          return {
            quantities: { mdot: q(state.mdot, 'kg/s'), p: q(last.p_out, 'Pa'), T: q(last.T_out, 'K'), D: q(last.ID, 'm'),
              L: q(last.L, 'm'), dp: q(last.dp, 'Pa'), Q: q(last.Q, 'W') },
            sets: { pipeline: [ { D: q(last.ID, 'm') }, { L: q(last.L, 'm') }, { dp: q(last.dp, 'Pa') }, { Q: q(last.Q, 'W') } ] }
          };
        },
        apply: function (p) {
          var qq = (p && p.quantities) || {};
          if (qq.mdot && qq.mdot.value > 0) state.mdot = qq.mdot.value;
          if (qq.p && qq.p.value > 0) state.p_in = qq.p.value;
          if (qq.T && qq.T.value > 0) state.T_in = qq.T.value;
          if (window.CCUS && CCUS.pipe) run(state);
          if (ui) { ui.sync(); ui.run(); }
        }
      }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
