<script>
(function () {
'use strict';
/* Safety Improvement Prioritiser — calculation core (pure functions, no DOM).
   Exact enumeration of measure portfolios under a budget, a schedule limit, mandatory measures, prerequisites and
   mutual exclusions; CDF and LERF reductions with low / nominal / high values combined per effect group (shared
   effects are never summed implicitly); Pareto set over cost, schedule, residual CDF and residual LERF; sensitivity
   of the ranking and a greedy ratio ranking for comparison. The selection stays an engineering decision. */
var SI_VERSION = '2026-10-09.si-3';
var SI_SAMPLES = 2000, SI_SEED = 20261009;
var SI_MAX = 12;
var SI_STATUS = ['confirmed', 'estimated', 'unknown'];
var SI_RULES = ['unknown', 'max_credit', 'additive_capped'];
var SI_METRICS = ['cdf', 'lerf'];
var SI_DECISION = ['pending', 'approved', 'rejected'];
var SI_REASONS = ['mandatory_missing', 'requires_missing', 'excluded_pair', 'over_budget', 'over_schedule'];

function siNum(v) { return typeof v === 'number' && isFinite(v) ? v : null; }
function siText(v) { return v === null || v === undefined ? '' : String(v).trim(); }

lle et LERF résiduelle.","learnDataTitle":"Mesures et référence","learnData":"Chaque mesure a un coût, une durée, des prérequis et des exclusions, ainsi que ΔCDF et ΔLERF en valeurs basse, moyenne et haute issues du modèle PRA, avec source et statut. La CDF et la LERF de référence proviennent de la même révision du modèle PRA.","learnModelTitle":"Effets partagés","learnModel":"Les mesures qui agissent sur la même séquence PRA portent le même groupe d'effet. Leurs réductions ne s'additionnent pas : la règle indique si le plus grand crédit individuel compte ou la somme jusqu'à un plafond ; sans règle, la combinaison reste inconnue jusqu'à la requantification du modèle PRA.","learnTryTitle":"À tester","learnTry":"Ouvrez l'exemple « À tester : les deux mesures créditées en totalité » et relevez la CDF résiduelle de M1+M2 par rapport à la cible.","learnExplainTitle":"Ce qui n'a pas fonctionné","learnExplain":"Les deux mesures réduisent la même séquence. Saisies dans des groupes séparés, leurs réductions s'additionnent comme si elles supprimaient deux contributions différentes, et le risque résiduel est sous-estimé.","learnFixTitle":"Correction","learnFix":"Placez les deux mesures dans le groupe SEQ-A et réglez la règle sur le plus grand crédit individuel (exemple « Corrigé ») : la CDF résiduelle de M1+M2 devient 1,6×10⁻⁵ et manque la cible ; une valeur PRA requantifiée peut remplacer la règle.","learnBoundaryTitle":"Modèle et décision","learnBoundary":"Calcul, cible et approbation sont distincts : l'ensemble de Pareto restreint le choix, les conséquences hors PRA restent dans la comparaison sous forme de texte, et l'approbation est liée aux données pour lesquelles elle a été donnée.","eqNote":"Symboles : S — portefeuille ; C, T — son coût et son délai ; c_i — coût ; B — budget ; d_i — durée ; R_i — prérequis de la mesure i ; F_i — fin au plus tôt ; T_max — délai limite ; X — CDF ou LERF ; x_i — réduction due à la mesure i ; δ_g — crédit du groupe d'effet g : celui de son var PY_CORE = "import math, json, re\nSI_VERSION = '2026-10-09.si-3'\nSI_SAMPLES = 2000\nSI_SEED = 20261009\nSI_MAX = 12\nSI_RULES = ['unknown', 'max_credit', 'additive_capped']\nSI_METRICS = ['cdf', 'lerf']\nSI_REASONS = ['mandatory_missing', 'requires_missing', 'excluded_pair', 'over_budget', 'over_schedule']\n\ndef si_num(v):\n    return v if isinstance(v, (int, float)) and not isinstance(v, bool) and math.isfinite(v) else None\n\ndef si_text(v):\n    return '' if v is None else (('true' if v else 'false') if isinstance(v, bool) else str(v)).strip()\n\ndef si_ids(v):\n    a = []\n    for w in re.split(r'[;,\\s]+', si_text(v)):\n        if w and w not in a: a.append(w)\n    return a\n\ndef si_key(ids): return '+'.join(ids) if ids else '∅'\n\ndef si_rng(seed):\n    # mulberry32, bit-identical to the page\n    st = [seed & 0xffffffff]\n    def nxt():\n        a = (st[0] + 0x6D2B79F5) & 0xffffffff; st[0] = a\n        t = ((a ^ (a >> 15)) * (a | 1)) & 0xffffffff\n        t = ((t + (((t ^ (t >> 7)) * (t | 61)) & 0xffffffff)) & 0xffffffff) ^ t\n        return ((t ^ (t >> 14)) & 0xffffffff) / 4294967296\n    return nxt\n\ndef si_draw(t, q):\n    # two-piece uniform on [low, nom] and [nom, high] with mean nom\n    lo, no, hi = t\n    if hi == lo: return lo\n    p = (hi - no) / (hi - lo)\n    return lo + (no - lo) * (q / p) if q < p else no + (hi - no) * ((q - p) / (1 - p))\n\ndef si_annuity(L, pct):\n    r = pct / 100\n    return L if r == 0 else (1 - math.pow(1 + r, -L)) / r\n\ndef si_benefit_factor(L, pct, tau):\n    # annuity over the life left after implementation (tau years), discounted to now\n    return math.pow(1 + pct / 100, -tau) * si_annuity(max(L - tau, 0), pct)\n\ndef si_triple(m, k):\n    a, b, c = si_num(m.get(k + '_low')), si_num(m.get(k + '_nom')), si_num(m.get(k + '_high'))\n    return None if a is None or b is None or c is None else [a, b, c]\n\nSI_ACTION = {'duplicate_id': 'correct_input', 'no_measures': 'add_measures', 'budget_invalid': 'correct_input', 'schedule_invalid': 'correct_input',\n  'baseline_cdf_invalid': 'record_baseline', 'baseline_lerf_invalid': 'record_baseline', 'cost_invalid': 'correct_input', 'duration_invalid': 'correct_input',\n  'effect_range_invalid': 'correct_input', 'correlation_invalid': 'correct_input', 'benefit_input_invalid': 'correct_input', 'reference_invalid': 'correct_input', 'dependency_cycle': 'resolve_cycle', 'overlap_invalid': 'correct_input',\n  'duplicate_overlap': 'correct_input', 'cap_invalid': 'set_cap', 'basis_source_missing': 'record_basis_source', 'basis_unconfirmed': 'confirm_basis',\n  'effect_unknown': 'quantify_effect', 'effect_unconfirmed': 'confirm_effect', 'measure_source_missing': 'record_measure_source', 'overlap_unknown': 'model_overlap',\n  'selection_missing': 'select_portfolio', 'selection_infeasible': 'select_portfolio'}\n\ndef si_actions(r):\n    a = []; seen = set()\n    def add(x, item=None):\n        k = (x, item or '')\n        if k not in seen: seen.add(k); a.append({'action': x, 'item': item or None})\n    for b in r['blocking_reasons']: add(SI_ACTION[b['code']], b['id'])\n    for g in r['gaps']: add(SI_ACTION[g['code']], g['id'])\n    for c in r['checks']:\n        if c['state'] == 'not_met': add('revise_portfolio', c['check'])\n    return a\n\ndef si_analyse(s):\n    r = {'model_version': SI_VERSION, 'calculation_status': 'blocked', 'blocking_reasons': [], 'subsets': 0, 'feasible_count': 0, 'rejected_by_reason': {},\n         'portfolios': [], 'pareto': [], 'best_cdf': None, 'best_cdf_low': None, 'best_cdf_high': None, 'greedy': None, 'annuity_factor': None, 'best_net_benefit': None,\n         'selected': None, 'sampling': None, 'benefit_check': None, 'checks': [], 'criterion_state': 'unknown',\n         'gaps': [], 'warnings': [], 'actions': []}\n    bad = lambda c, i=None: r['blocking_reasons'].append({'code': c, 'id': i})\n    gap = lambda c, i=None: r['gaps'].append({'code': c, 'id': i})\n    warn = lambda c, i=None: r['warnings'].append({'code': c, 'id': i})\n    ms = []; seen = set()\n    for i, x in enumerate(s.get('measures') if isinstance(s.get('measures'), list) else []):\n        mid = si_text(x.get('id')) or 'M-%d' % (i + 1)\n        if mid in seen: bad('duplicate_id', mid); continue\n        seen.add(mid); y = dict(x); y['id'] = mid; ms.append(y)\n    if not ms: bad('no_measures')\n    budget, max_sch, b_c, b_l = si_num(s.get('budget')), si_num(s.get('max_schedule')), si_num(s.get('baseline_cdf')), si_num(s.get('baseline_lerf'))\n    if budget is None or budget < 0: bad('budget_invalid')\n    if s.get('max_schedule') is not None and (max_sch is None or max_sch < 0): bad('schedule_invalid')\n    if b_c is None or b_c < 0: bad('baseline_cdf_invalid')\n    if b_l is None or b_l < 0: bad('baseline_lerf_invalid')\n    corr = 0 if 'effect_correlation' not in s else si_num(s.get('effect_correlation'))\n    if corr is None or corr < 0 or corr > 1: bad('correlation_invalid')\n    life, rate, c_cd, c_le = si_num(s.get('remaining_life')), si_num(s.get('discount_rate')), si_num(s.get('consequence_cdf')), si_num(s.get('consequence_lerf'))\n    if (life is not None and life <= 0) or (rate is not None and (rate < 0 or rate > 20)) or (c_cd is not None and c_cd < 0) or (c_le is not None and c_le < 0): bad('benefit_input_invalid')\n    idx = {m['id']: i for i, m in enumerate(ms)}\n    for m in ms:\n        if si_num(m.get('cost')) is None or m['cost'] < 0 or (m.get('cost_high') is not None and not (si_num(m.get('cost_high')) is not None and m['cost_high'] >= m['cost'])): bad('cost_invalid', m['id'])\n        if si_num(m.get('duration')) is None or m['duration'] < 0 or (m.get('duration_high') is not None and not (si_num(m.get('duration_high')) is not None and m['duration_high'] >= m['duration'])): bad('duration_invalid', m['id'])\n        for k in SI_METRICS:\n            t = si_triple(m, k)\n            if t and not (t[0] <= t[1] <= t[2]): bad('effect_range_invalid', m['id'])\n        m['_req'] = si_ids(m.get('r
