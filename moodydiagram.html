'fl.helium.note': 'HTGR/GFR. La baja densidad obliga a ir a 50–80 m/s, y por eso el bombeo se come puntos porcentuales de la potencia térmica.',
'fl.co2.note': 'AGR (~40 bar) y ciclos Brayton supercríticos (200 bar y más). En el punto crítico, 31 °C / 73,8 bar, las propiedades cambian de golpe.',
'fl.sodium.note': 'Reactores rápidos de sodio. ν ≈ 2,7·10⁻⁷ m²/s: en términos de Reynolds el sodio es más fluido que el agua, y el punto se mete de lleno en el régimen turbulento rugoso.',
'fl.lead.note': 'Reactores rápidos refrigerados por plomo. ρ ≈ 10 500 kg/m³: la pérdida de carga es enorme incluso a velocidades bajas.',
'fl.lbe.note': 'SVBR y los reactores de los submarinos de la clase Alfa. Eutéctico 44,5% Pb / 55,5% Bi, punto de fusión 125 °C.',
'fl.flibe.note': 'Reactores de sales fundidas. A 600 °C la viscosidad dinámica es unas ocho veces la del agua y la cinemática unas cuatro: a diferencia de los metales líquidos, la sal es espesa. Punto de fusión 459 °C: la congelación en el circuito es el primer problema, no el décimo.',
'fl.solarsalt.note': 'Almacenamiento térmico en centrales solares y circuitos secundarios. Por encima de ~590 °C los nitratos se descomponen.',
'fl.uf6.note': 'Cascadas de enriquecimiento. M = 352 g/mol: un gas con la viscosidad cinemática de un líquido. A presión atmosférica no existe fase líquida alguna: sólo sublimación.',
'fl.hfo.note': 'El caso laminar clásico. Sin calentarlo a 100–130 °C no hay manera de bombearlo.',
'fl.natgas.note': 'A las presiones de transporte de 55–75 bar el factor de compresibilidad Z baja a 0,85: el gas ideal se equivoca en un 15%.',
'fl.syrup.note': 'Newtoniano, pero la viscosidad cae varios órdenes de magnitud al calentarlo. Un caso laminar excelente.',
'fl.honey.note': 'La dispersión entre variedades y lotes es de varias veces. Calcularlo al uno por ciento no tiene sentido.',
'fl.ketchup.note': 'Tiene esfuerzo umbral: por debajo de una pérdida de carga mínima no fluye en absoluto, en lugar de fluir despacio.',
'fl.chocolate.note': 'Casson dedujo su ecuación en 1959 para suspensiones de pigmentos en aceite —tintas de imprenta—; su aplicación al chocolate vino después. Pero fue como método chocolatero como cuajó: hasta el año 2000 era el método oficial de la IOCCC.',
'fl.concrete.note': 'El hormigón en una tubería no fluye como un líquido. Avanza como un tapón, y toda la cizalla se concentra en una capa de pasta de cemento de 1–3 mm junto a la pared. Es la reología de esa capa la que fija la pérdida de carga, no la reología del seno ni la rugosidad de la pared.',
'fl.scc.note': 'El esfuerzo umbral es un orden de magnitud menor que el de una masa corriente: se extiende solo, pero la viscosidad sigue siendo alta. El deslizamiento en la pared no desaparece por ello.',
'fl.mud.note': 'El fluido de Bingham clásico de la industria petrolera: con él se validó el modelo de Metzner–Reed. Aquí el esfuerzo umbral resulta útil: mantiene el detritus en suspensión cuando se detiene la circulación.',

// ---- fluid sources ------------------------------------------------------
'fl.water.src': 'Tabla de líquido saturado de IAPWS-95 más una corrección de presión en forma cerrada para agua comprimida (cúbica tipo Tait en p − p_s, ajustada a IAPWS-95 en cada temperatura de la tabla). Contrastada con CoolProp/IAPWS-95 en todo el rango de la herramienta (0–350 °C, p_s–300 bar): Δρ ≤ 0,17%, Δμ ≤ 0,21%, Δν ≤ 0,22%. Banda declarada: ρ y μ ±0,5% (±1% por encima de 300 °C).',
'fl.steam.src': 'ρ — gas ideal con corrección del segundo coeficiente del virial ajustada a IAPWS; μ — ajuste lineal a tablas (±2%).',
'fl.air.src': 'ρ — ecuación del virial Z = 1 + B(T)n + C(T)n², coeficientes ajustados a la ecuación de estado del aire de Lemmon et al. (2000) entre −50 y 800 °C y 0 a 300 bar; μ — Sutherland generalizado A·T^k/(T+S) para el gas diluido (los clásicos k = 1,5, S = 110,4 K se quedan un 4% bajos ya a 800 °C) más un término de densidad. Contrastado con CoolProp: Δρ ≤ 0,9%, Δμ ≤ 0,95%, Δν ≤ 0,6% en todo ese rango.',
'fl.helium.src': 'μ ~ T^0,7 (±3%); ρ — gas ideal, Z ≈ 1,03 a 70 bar.',
'fl.co2.src': 'ρ — Peng–Robinson con selección de raíz por fugacidad contra la curva de saturación de Wagner; μ — Fenghour–Wakeham–Vesovic.',
'fl.sodium.src': 'Manual del sodio de Fink–Leibowitz / OECD-NEA.',
'fl.lead.src': 'OECD-NEA Handbook on Lead and Lead-Bismuth Eutectic (2015), correlaciones de Sobolev.',
'fl.lbe.src': 'OECD-NEA Handbook on Lead and Lead-Bismuth Eutectic (2015).',
'fl.flibe.src': 'Correlación de Cantor; concuerda con la correlación de referencia IUPAC/NIST (2019) dentro del 2% a 600 °C. La dispersión bibliográfica de la viscosidad del FLiBe llega al ±30%.',
'fl.solarsalt.src': 'Correlaciones estándar para la mezcla 60% NaNO₃ / 40% KNO₃.',
'fl.uf6.src': 'GAT-280 (DeWitt, Uranium Hexafluoride: A Survey): curva de sublimación log₁₀P[mmHg] = 10,648 − 2559,5/T, curva de vaporización 6,99464 − 1126,288/(t+221,963), ρ del líquido y η del gas de la misma fuente. Punto triple 64,05 °C / 1,517 bar, punto crítico 230,2 °C / 46,1 bar.',
'fl.crude.src': 'Crudo típico de ~32° API; las propiedades dependen mucho del yacimiento.',
'fl.diesel.src': 'Gasóleo de verano, valores típicos (ν = 2,0–4,5 cSt a 40 °C según EN 590).',
'fl.gasoline.src': 'Valores típicos de gasolina de automoción.',
'fl.hfo.src': 'Fuelóleo pesado, 380 cSt a 50 °C, extrapolado por Walther (ASTM D341).',
'fl.propane.src': 'Líquido saturado; presión de saturación por Antoine.',
'fl.butane.src': 'Líquido saturado; presión de saturación por Antoine.',
'fl.natgas.src': 'Composición dominada por metano; Z por la correlación de Papay (Standing–Katz), viscosidad por Lee–Gonzalez–Eakin.',
'fl.vegoil.src': 'Girasol/colza; ν = 65 cSt a 20 °C.',
'fl.milk.src': 'Leche entera, 3,5% de materia grasa.',
'fl.syrup.src': 'Disolución de sacarosa al 70% en peso, viscosidades de la NBS Circular 440 (Swindells et al.).',
'fl.honey.src': 'Miel de flores con ~17% de humedad; dependencia de Arrhenius, Ea ≈ 90 kJ/mol.',
'fl.beer.src': 'Próxima al agua con una corrección por extracto.',
'fl.ketchup.src': 'Herschel–Bulkley: τ₀ ≈ 32 Pa, K ≈ 18 Pa·sⁿ, n ≈ 0,28 (kétchup de tomate).',
'fl.mayo.src': 'Herschel–Bulkley: τ₀ ≈ 90 Pa, K ≈ 25 Pa·sⁿ, n ≈ 0,35 (muy dependiente de la receta).',
'fl.yogurt.src': 'Herschel–Bulkley: τ₀ ≈ 20 Pa, K ≈ 6 Pa·sⁿ, n ≈ 0,35 (yogur batido).',
'fl.chocolate.src': 'Modelo de Casson: τ₀ ≈ 12 Pa, μ_C ≈ 2,0 Pa·s.',
'fl.concrete.src': 'Bingham: τ₀ ≈ 800 Pa, viscosidad plástica ≈ 40 Pa·s (masa de asiento alto). Pérdida de carga según el modelo tribológico de Kaplan; las constantes de la capa de lubricación están calibradas con medidas en DN125 (~0,14 bar/m).',
'fl.scc.src': 'Bingham: τ₀ ≈ 50 Pa, viscosidad plástica ≈ 25 Pa·s; tribología según Feys y Kaplan.',
'fl.mud.src': 'Lodo bentonítico de 1200 kg/m³: τ₀ ≈ 8 Pa, viscosidad plástica ≈ 15 cP (el rango publicado para lodos sin densificar es de 1–20 cP).',
'fl.applesauce.src': 'Ley potencial: K ≈ 6 Pa·sⁿ, n ≈ 0,35 (puré de manzana).',

// ---- material notes -----------------------------------------------------
'mat.drawn.note': 'En la práctica es hidráulicamente liso en casi todo el rango de Re. La velocidad de envejecimiento se toma la de los metales no férreos: el tubo estirado suele ser de cobre o aluminio; para acero al carbono estirado use la fila de acero comercial.',
'mat.steel.note': 'El material de referencia del diagrama clásico. Envejece de forma apreciable: es aquí donde el deslizador de edad hace su verdadero trabajo.',
'mat.stainless.note': 'En agua prácticamente no envejece: el deslizador de edad casi no cambia nada.',
'mat.electropol.note': 'El límite de tubería lisa. La rugosidad no afecta a nada: el punto se apoya en la envolvente inferior.',
'mat.titanium.note': 'El titanio comercialmente puro está limitado a unos 350 °C por la captación de gases (ASME B31.3 corta las tensiones admisibles en 316 °C). Hidráulicamente indistinguible del inoxidable. Se elige por resistencia a la corrosión, no por lisura.',
'mat.inconel.note': 'Hidráulicamente igual que el inoxidable. La razón de ser de la aleación es la compatibilidad con el fluido y la resistencia térmica.',
'mat.ductile.note': 'La rugosidad la fija el revestimiento, no el metal. A cambio, el revestimiento apenas envejece.',
'mat.riveted.note': 'La entrada más rugosa del ábaco original de Moody de 1944.',
'mat.hdpe.note': 'Liso pero flexible: el diámetro interior real tras la ovalización importa más que la rugosidad.',
'mat.glass.note': 'La referencia práctica de pared lisa. Nikuradse, en contra de lo que suele creerse, trabajó con tubos estirados de latón recubiertos de arena y no con vidrio, pero la envolvente inferior del diagrama es precisamente el límite de tubería lisa.',
'mat.woodstave.note': 'Una entrada del ábaco original de Moody. Las tuberías forzadas de madera dieron servicio a la hidroelectricidad hasta mediados del siglo XX, y aún queda alguna en pie.',
'mat.corr_ss.note': 'La resistencia la crea la forma de la corruga, no la rugosidad de la pared. La ε equivalente es una magnitud de ajuste sin significado físico como rugosidad.',
'mat.corr_pe.note': 'Lo mismo otra vez: esto es forma, no rugosidad.',
'mat.scale.note': 'En una tubería incrustada el agua ya no toca el metal: el acero y la fundición se vuelven hidráulicamente indistinguibles. El efecto dominante no es la rugosidad, sino la pérdida de diámetro interior.',
'mat.tubercle.note': 'El estado clásico de las conducciones viejas de acero y fundición: tubérculos de varios milímetros de altura.',
'mat.biofilm.note': 'Agua de refrigeración, agua de mar, condensadores.',

// ---- incompatibility ----------------------------------------------------
'inc.0': 'El UF₆ seco forma una película pasivante de fluoruro sobre el acero al carbono, y los cilindros de transporte 30B, 48X y 48Y se fabrican de acero al carbono según ANSI N14.1. La condición es la sequedad: cualquier resto de humedad da HF, y entonces el acero se arruina deprisa. En las propias cascadas se emplean níquel, Monel y PTFE.',
'inc.1': 'Con UF₆ no se usan fundición ni tubería revestida o galvanizada: el cinc reacciona, y los revestimientos y el grafito de la fundición retienen humedad. Los materiales estándar son níquel, Monel, cobre, aluminio y PTFE.',
'inc.2': 'El UF₆ destruye estos materiales o reacciona con la humedad residual que contienen. Las cascadas usan PTFE, níquel y Monel.',
'inc.3': 'Los fundidos de fluoruros exigen Hastelloy N: la aleación se desarrolló en ORNL precisamente para los reactores de sales fundidas. El inoxidable no sobrevive en FLiBe.',
'inc.4': 'El plomo líquido disuelve el níquel y el cromo del acero. Hacen falta aceros con control de oxígeno o formadores de alúmina (ODS/FeCrAl).',
'inc.5': 'El LBE disuelve los componentes del acero. Se requiere control de oxígeno y aceros resistentes.',
'inc.6': 'El inoxidable funciona en plomo sólo con la concentración de oxígeno mantenida en una ventana estrecha y por debajo de ~500 °C.',
'inc.7': 'Lo mismo: el inoxidable sobrevive en LBE únicamente bajo control de oxígeno.',
'inc.8': 'El sodio es incompatible con el cobre y el aluminio a temperaturas de servicio.',
'inc.9': 'El nitrato fundido destruye el aluminio y el cobre.',
'inc.10': 'El hormigón fresco es abrasivo: las tuberías de impulsión se hacen de acero antidesgaste de pared gruesa, y de acero templado en los codos. Las tuberías de pared fina y las blandas se perforan en uno o dos trabajos.',
'inc.11': 'El desgaste abrasivo de la pared en una tubería de hormigón es rápido, sobre todo en los codos. El espesor de pared se controla por ultrasonidos: es una cuestión de vida útil, no de hidráulica.',
'inc.12': 'La misma abrasividad: hace falta acero antidesgaste.',
'inc.13': 'Los aromáticos del crudo hinchan y reblandecen el PVC: la resistencia cae y la geometría se deforma. Los productos petrolíferos exigen acero o PVDF.',
'inc.14': 'La gasolina hincha y reblandece el PVC hasta que pierde su capacidad portante. Hace falta acero o un fluoropolímero.',
'inc.15': 'El HDPE es el material estándar de los depósitos de combustible, pero la gasolina difunde a través de él de forma apreciable. En servicio de combustibles se usa HDPE fluorado en superficie o con capa barrera, no el corriente.',
'inc.16': 'El PVC y el PEX no están previstos para gasóleo.',

// ---- fluid-specific warnings -------------------------------------------
'fw.water.boil': 'A {t} °C y {p} bar el agua hierve (p sat = {ps} bar). El flujo es bifásico: el diagrama de Moody no es aplicable.',
'fw.water.frozen': 'El agua está congelada.',
'fw.water.nearCrit': 'Cerca del punto crítico (374 °C): las propiedades cambian bruscamente, y la compresibilidad del agua líquida ya es apreciable aquí.',
'fn.water.press': 'A {t} °C y {p} bar el agua es líquido comprimido (subenfriado): las propiedades del líquido saturado se corrigen por presión, lo que aumenta la densidad un {dr}% respecto a la línea de saturación.',
'fw.water.range': 'La temperatura {t} °C está fuera del rango validado del modelo de propiedades del agua (0–350 °C); los valores se extrapolan desde el punto de tabla más cercano.',
'fw.steam.cond': 'A {t} °C el vapor condensa por encima de {p} bar.',
'fw.steam.hi': 'Por encima de 60 bar el desarrollo del virial truncado para el vapor es inservible: cerca del punto crítico el error llega a decenas de por ciento. Se requiere IAPWS-IF97.',
'fw.steam.mid': 'Por encima de 25 bar la corrección del virial pierde precisión: la discrepancia frente a IF97 es del orden del 3–5%.',
'fn.air.real': 'A {p} bar el aire es apreciablemente no ideal: el factor de compresibilidad es Z = {z}. La densidad y la viscosidad proceden del modelo de gas real ajustado y la banda declarada se amplía a ±2%.',
'fw.air.range': 'Fuera del rango validado del modelo de propiedades del aire (−50…800 °C, hasta 300 bar) el ajuste se extrapola y la incertidumbre deja de estar acotada en ±2%.',
'fw.co2.nearCrit': 'Zona cercana al punto crítico: aquí Peng–Robinson se equivoca en decenas de por ciento, y muy cerca del punto crítico la discrepancia pasa a ser de varias veces. Para trabajo de diseño hace falta Span–Wagner (REFPROP/CoolProp). El punto se muestra, pero no es de fiar.',
'fw.co2.dense': 'Fase densa (ρ = {rho} kg/m³): aquí Peng–Robinson sobrestima la densidad en un 5–10%, y la viscosidad de Fenghour amplifica ese error a través de su término ~ρ⁸ — hasta un 20% en viscosidad. Se muestran densidad y viscosidad, pero el diseño exige Span–Wagner.',
'fw.co2.satLine': 'Cerca de la línea de saturación (p sat = {ps} bar a {t} °C): un pequeño cambio de presión lanza el fluido de gas a líquido y la densidad varía varias veces.',
'fw.sodium.frozen': 'El sodio se ha solidificado (punto de fusión 98 °C).',
'fw.sodium.boil': 'Quedan menos de 35 °C hasta el punto de ebullición del sodio (883 °C a 1 bar).',
'fw.lead.frozen': 'El plomo se ha solidificado (punto de fusión 327 °C).',
'fw.lead.hot': 'Por encima de ~500 °C el plomo disuelve los aceros corrientes: hacen falta control de oxígeno o aceros formadores de alúmina.',
'fw.lbe.frozen': 'El LBE se ha solidificado (punto de fusión 125 °C). La congelación en el circuito es un escenario de fallo bien conocido.',
'fw.flibe.frozen': 'El FLiBe se ha solidificado (punto de fusión 459 °C). Para un reactor de sales fundidas esto es el fallo del circuito primario.',
'fw.flibe.near': 'Quedan menos de 40 °C de margen hasta la solidificación.',
'fw.salt.frozen': 'La sal se ha solidificado (punto de fusión ≈ 220 °C).',
'fw.salt.decomp': 'Por encima de 590 °C los nitratos empiezan a descomponerse térmicamente.',
'fw.uf6.solid': 'A {t} °C el UF₆ es sólido por encima de {p} bar. Por debajo del punto triple (64,05 °C) no existe fase líquida: sólo sublimación.',
'fw.uf6.liquid': 'El UF₆ líquido sólo existe por encima del punto triple y bajo presión: no se encuentra en las cascadas, únicamente durante el transporte y el llenado de cilindros.',
'fw.uf6.reacts': 'El UF₆ reacciona violentamente con la humedad dando HF y UO₂F₂. Son compatibles el níquel, el Monel, el cobre y el aluminio con pasivación por fluoruro.',
'fw.uf6.crit': 'Por encima del punto crítico de 230,2 °C no existe UF₆ líquido a ninguna presión: el fluido es supercrítico.',
'fw.hfo.cold': 'Por debajo de ~60 °C el fuelóleo pesado apenas fluye: la viscosidad rebasa lo que se puede bombear.',
'fw.propane.boil': 'El propano hierve: la presión de saturación a {t} °C es de {p} bar. La línea debe mantenerse por encima de esa presión.',
'fw.butane.boil': 'El butano hierve: la presión de saturación a {t} °C es de {p} bar.',
'fw.choc.solid': 'Por debajo de ~32 °C la masa de chocolate cuaja.',
'fw.concrete.slip': 'Deslizamiento en la pared: calcular esto a partir de la reología del seno y del diagrama de Moody es un error de raíz. El punto del ábaco es sólo orientativo; la pérdida de carga se calcula con el modelo tribológico de la capa de lubricación.',
'fw.concrete.time': 'La variable que manda no es la temperatura, sino el tiempo transcurrido desde el amasado. En 60–90 minutos la masa pierde trabajabilidad, τ₀ sube varias veces y la línea se atasca. La edad de una tubería se mide en años; la del hormigón, en minutos.',
'fw.concrete.hot': 'Con calor el fraguado se acelera y la ventana de puesta en obra se reduce a la mitad.',
'fw.scc.slip': 'Deslizamiento en la pared: la pérdida de carga la fija la capa de lubricación, no la reología del seno. El diagrama de Moody no es aplicable.',

'fl.helium.note': 'HTGR/GFR. Мала густина змушує йти на 50–80 м/с, через що перекачування з\'їдає відсотки теплової потужності.',
'fl.co2.note': 'AGR (~40 бар) і надкритичні цикли Брайтона (200+ бар). У критичній точці, 31 °C / 73.8 бар, властивості змінюються стрибком.',
'fl.sodium.note': 'Швидкі натрієві реактори. ν ≈ 2.7·10⁻⁷ м²/с — у рейнольдсовому вимірі натрій рідший за воду, і точка йде глибоко в автомодельну область.',
'fl.lead.note': 'Швидкі реактори зі свинцевим теплоносієм. ρ ≈ 10 500 кг/м³ — перепад тиску величезний навіть за малих швидкостей.',
'fl.lbe.note': 'SVBR і реактори підводних човнів проєкту 705 (клас «Альфа»). Евтектика 44.5% Pb / 55.5% Bi, температура плавлення 125 °C.',
'fl.flibe.note': 'Реактори на розплавах солей. За 600 °C динамічна в\'язкість приблизно у вісім разів більша за воду, а кінематична — приблизно вчетверо: на відміну від рідких металів, сіль в\'язка. Температура плавлення 459 °C — замерзання в контурі тут перша проблема, а не десята.',
'fl.solarsalt.note': 'Теплове акумулювання на сонячних станціях і другі контури. Вище ~590 °C нітрати розкладаються.',
'fl.uf6.note': 'Каскади збагачення. M = 352 г/моль — газ із кінематичною в\'язкістю рідини. За атмосферного тиску рідкої фази не існує взагалі: лише сублімація.',
'fl.hfo.note': 'Класичний ламінарний випадок. Без підігріву до 100–130 °C його взагалі не перекачати.',
'fl.natgas.note': 'За магістральних тисків 55–75 бар коефіцієнт стисливості Z падає до 0.85 — ідеальний газ помиляється на 15%.',
'fl.syrup.note': 'Ньютонівський, але під час нагрівання в\'язкість падає на порядки. Чудовий ламінарний випадок.',
'fl.honey.note': 'Розкид між сортами й партіями — у кілька разів. Рахувати це до відсотка не має сенсу.',
'fl.ketchup.note': 'Має границю текучості: нижче за порогове значення перепаду тиску він не тече взагалі, а не тече повільно.',
'fl.chocolate.note': 'Кассон вивів своє рівняння 1959 року для суспензій пігментів в олії — для друкарських фарб; до шоколаду його застосували пізніше. Але закріпилося воно саме як шоколадний метод: до 2000 року це був офіційний метод IOCCC.',
'fl.concrete.note': 'Бетон у трубі не тече як рідина. Він рухається як пробка, і весь зсув зосереджений у шарі цементного тіста завтовшки 1–3 мм біля стінки. Перепад тиску задає реологія саме цього шару — не об\'ємна реологія і не шорсткість стінки.',
'fl.scc.note': 'Границя текучості на порядок нижча, ніж у звичайної суміші, — вона розтікається сама, але в\'язкість лишається високою. Пристінне ковзання нікуди не дівається.',
'fl.mud.note': 'Класичне бінгамівське середовище нафтової галузі — саме на ньому обкатали модель Метцнера–Ріда. Границя текучості тут корисна: вона утримує шлам у завислому стані, коли циркуляцію зупинено.',

'fl.water.src': 'Таблиця насиченої рідини за IAPWS-95 плюс замкнена поправка на тиск для стисненої води (кубічна залежність типу Тета від p − p_s, підігнана до IAPWS-95 на кожній температурі таблиці). Перевірено за CoolProp/IAPWS-95 на всій області інструмента (0–350 °C, p_s–300 бар): Δρ ≤ 0.17%, Δμ ≤ 0.21%, Δν ≤ 0.22%. Заявлена смуга: ρ і μ ±0.5% (±1% вище 300 °C).',
'fl.steam.src': 'ρ — ідеальний газ із поправкою на другий віріальний коефіцієнт, підігнаною під IAPWS; μ — лінійна апроксимація таблиць (±2%).',
'fl.air.src': 'ρ — віріальне рівняння Z = 1 + B(T)n + C(T)n², коефіцієнти підігнано до рівняння стану повітря Lemmon та ін. (2000) на −50…800 °C і 0…300 бар; μ — узагальнений Сазерленд A·T^k/(T+S) для розрідженого газу (класичні k = 1.5, S = 110.4 K занижують на 4% уже при 800 °C) плюс член за густиною. Перевірено за CoolProp: Δρ ≤ 0.9%, Δμ ≤ 0.95%, Δν ≤ 0.6% на всій області.',

'fl.co2.src': 'ρ — Пенг–Робінсон із вибором кореня за летючістю відносно кривої насичення Вагнера; μ — Фенгур–Вейкхем–Весович.',

'mat.drawn.note': 'Фактично гідравлічно гладка на більшій частині діапазону Re. Швидкість старіння взято як для кольорових металів — тягнуті труби зазвичай мідні або алюмінієві; для тягнутої вуглецевої сталі беріть рядок сталі звичайної якості.',
'mat.steel.note': 'Еталонний матеріал класичної діаграми. Помітно старіє — саме тут повзунок віку робить справжню роботу.',
'mat.stainless.note': 'У воді практично не старіє — повзунок віку майже нічого не змінює.',
'mat.electropol.note': 'Межа гладкої труби. Шорсткість не впливає ні на що — точка лежить на нижній обвідній.',
'mat.titanium.note': 'Технічно чистий титан обмежений приблизно 350 °C через газонасичення (ASME B31.3 припиняє допустимі напруження на 316 °C). Гідравлічно не відрізняється від нержавіючої сталі. Його обирають за корозійну стійкість, а не за гладкість.',
'mat.inconel.note': 'Гідравлічно те саме, що й нержавіюча сталь. Сенс сплаву — сумісність із середовищем і жаростійкість.',
'mat.ductile.note': 'Шорсткість задає покриття, а не метал. Натомість покриття майже не старіє.',
'mat.riveted.note': 'Найшорсткіший пункт оригінального графіка Муді 1944 року.',
'mat.hdpe.note': 'Гладкий, але податливий: реальний внутрішній діаметр після овалізації важить більше за шорсткість.',
'mat.glass.note': 'Практичний еталон гладкої стінки. Нікурадзе, всупереч поширеній думці, працював із тягнутими латунними трубами, обклеєними піском, а не зі склом — але нижня обвідна діаграми і є саме межею гладкої труби.',
'mat.woodstave.note': 'Пункт з оригінального графіка Муді. Дерев\'яні напірні водоводи служили гідроенергетиці до середини XX століття, і кілька з них досі стоять.',
'mat.corr_ss.note': 'Опір створює форма гофри, а не шорсткість стінки. Еквівалентне ε — підгінна величина, яка не має фізичного сенсу шорсткості.',
'mat.corr_pe.note': 'Те саме: це форма, а не шорсткість.',
'mat.scale.note': 'У зарослій трубі вода вже не торкається металу: сталь і чавун стають гідравлічно нерозрізненними. Головний ефект — не шорсткість, а втрата внутрішнього діаметра.',
'mat.tubercle.note': 'Класичний стан старих сталевих і чавунних магістралей: горби заввишки в міліметри.',
'mat.biofilm.note': 'Оборотна вода, морська вода, конденсатори.',

// ---- incompatibility ----------------------------------------------------
'inc.0': 'Сухий UF₆ утворює на вуглецевій сталі пасивувальну фторидну плівку, і транспортні контейнери 30B, 48X та 48Y виготовляють з вуглецевої сталі за ANSI N14.1. Умова — сухість: сліди вологи дають HF, і тоді сталь руйнується швидко. У самих каскадах застосовують нікель, Monel і PTFE.',
'inc.1': 'Чавун, футеровані та оцинковані труби для UF₆ не застосовують: цинк реагує, а футерування і графіт у чавуні утримують вологу. Стандартні матеріали — нікель, Monel, мідь, алюміній і PTFE.',

'w.compressHigh': 'Перепад {pct}% от входного давления. Газ расширяется по длине, скорость растёт — одной точкой на диаграмме Муди задача уже не описывается. Нужна изотермическая формула сжимаемого течения.',

'w.knHead': 'Kn = {kn} (средняя длина пробега {lambda} мкм при диаметре {d} мм). ',
'w.knFree': 'Свободномолекулярный режим: столкновений между молекулами практически нет, понятия вязкости и коэффициента трения теряют смысл. Именно в этом режиме работают поры разделительного барьера газодиффузионного обогащения — там перенос идёт по Кнудсену и подчиняется закону Грэма, а не гидравлике.',
'w.knTrans': 'Переходный режим между сплошной средой и свободномолекулярной. Уравнения Навье–Стокса здесь уже не работают ни с какими граничными условиями, диаграмма Муди неприменима.',
'w.knSlip': 'Режим скольжения: сплошная среда ещё описывает течение, но газ уже проскальзывает по стенке, и обычное условие прилипания нарушается. Расход выше, чем даёт диаграмма Муди; поправка на скольжение обязательна.',
'w.knOk': 'Kn = {kn} — сплошная среда в силе',
'w.vMax': '{v} м/с выше проектного предела {lim} м/с — {why}. Разогнать поток, чтобы уменьшить трубу, здесь нельзя.',
'w.cip': '{v} м/с ниже 1.5 м/с — при безразборной мойке не обеспечивается турбулентный режим, труба не отмывается.',
'w.form': 'У гофрированной трубы сопротивление создаёт форма, а не шероховатость стенки. Эквивалентная ε — подгоночный параметр, и корреляция Колбрука тут работает лишь приближённо.',
'w.crit': 'Критическая зона Re ≈ {lo}–{hi}: устойчивой корреляции не существует, поток может скакать между ламинарным и турбулентным. Расчётного значения здесь нет ни у кого — точка показана условно.',
'w.nofit': 'При таком показателе течения корреляция Додж–Метцнера не имеет корня — расчётного коэффициента трения не существует. Раньше в этом случае возвращалось правдоподобное число; теперь отказ показывается явно.',
'w.epsRange': 'Относительная шероховатость ε/D = {e} выходит за диапазон, на котором построен Колбрук (до ~0.05). Значение получено экстраполяцией и завышает надёжность — при такой шероховатости труба уже ближе к гофре, чем к трубе.',
'w.noflowSpeed': 'Заданная скорость недостижима.',
'w.yieldNote': 'Предел текучести {tau0} Па: чтобы среда вообще стронулась, нужен градиент не менее {grad} Па/м, то есть {bar} бар на {len} м — независимо от расхода.',
'w.plug': 'Напряжение на стенке едва превышает предел текучести: в центре трубы движется неразрушенная пробка, профиль скорости почти поршневой.',
'w.nonNewt': 'Неньютоновская среда: обобщённый Рейнольдс Метцнера–Рида, турбулентная ветка по Доджу–Метцнеру (гладкая труба). Шероховатость в этой ветке не учитывается — общепринятой корреляции для шероховатых труб с неньютоновскими средами нет.',
'w.normalFlow': 'Расход задан при нормальных условиях: {q} нм³/ч = {act} м³/ч по факту при {t} °C и {p} бар',
'w.slipNote': 'Смазочный слой: dP/L = (4/D)·({a}·v + {b}) = {grad} бар/м. Объёмная реология в этот результат не входит вовсе.',
'w.slipMinor': 'Местные сопротивления при перекачке бетона считают эквивалентной длиной: колено 90° ≈ 3 м прямой трубы, гибкий рукав ≈ 3× своей длины.',
'w.depositNote': 'Слой {th} мм с двух сторон: проходной диаметр {d0} → {d} мм',
'w.matTemp': '{mat}: рабочая температура {t} °C выше предела {max} °C. Материал здесь неприменим независимо от гидравлики.',
'w.foodMat': 'Для пищевой среды нужна санитарная поверхность: полированная нержавейка, ПТФЭ, ПВДФ или стекло. Обычная сталь и пластики не отмываются при безразборной мойке.',

'fl.helium.note': 'ВТГР/ГБР. Низкая плотность заставляет держать 50–80 м/с, из-за чего прокачка съедает проценты тепловой мощности.',
'fl.co2.note': 'AGR (~40 бар) и сверхкритические циклы Брайтона (200+ бар). У критической точки 31 °C / 73.8 бар свойства меняются скачком.',
'fl.sodium.note': 'БН. ν ≈ 2.7·10⁻⁷ м²/с — по Рейнольдсу натрий «жиже» воды, точка уходит глубоко в автомодельную зону.',
'fl.lead.note': 'РБЕЦ/БРЕСТ. ρ ≈ 10 500 кг/м³ — перепад давления огромен даже на малых скоростях.',
'fl.lbe.note': 'СВБР, реакторы подлодок пр. 705. Эвтектика 44.5% Pb / 55.5% Bi, t пл. 125 °C.',
'fl.flibe.note': 'ЖСР. Динамическая вязкость при 600 °C примерно в восемь раз выше воды, кинематическая — вчетверо: в отличие от жидких металлов, соль «густая». Точка плавления 459 °C: замерзание в контуре — первая проблема, а не десятая.',
'fl.solarsalt.note': 'Аккумуляция тепла СЭС и вторые контуры. Выше ~590 °C нитраты разлагаются.',
'fl.uf6.note': 'Разделительные каскады. M = 352 г/моль — газ с кинематической вязкостью как у жидкости. При атмосферном давлении жидкой фазы не существует вовсе: только сублимация.',
'fl.hfo.note': 'Классический ламинарный случай. Без подогрева до 100–130 °C не перекачивается вообще.',
'fl.natgas.note': 'На магистральных давлениях 55–75 бар коэффициент сжимаемости Z падает до 0.85 — идеальный газ ошибается на 15%.',
'fl.syrup.note': 'Ньютоновский, но вязкость падает в сотни раз при нагреве. Отличный ламинарный случай.',
'fl.honey.note': 'Разброс между сортами и партиями — в разы. Считать его с точностью до процента бессмысленно.',
'fl.ketchup.note': 'Есть предел текучести: ниже порогового перепада давления не течёт вообще, а не «течёт медленно».',
'fl.chocolate.note': 'Кассон вывел своё уравнение в 1959 году для суспензий пигмента в масле — типографских красок; к шоколаду его применили позже. Но именно как метод для шоколада он и закрепился: до 2000 года это был официальный метод ИКА.',
'fl.concrete.note': 'Бетон в трубе не течёт как жидкость. Он движется пробкой, а весь сдвиг сосредоточен в слое цементного теста толщиной 1–3 мм у стенки. Перепад задаёт реология этого слоя — не объёмная реология и не шероховатость стенки.',
'fl.scc.note': 'Предел текучести на порядок ниже обычной смеси — растекается сам, но вязкость остаётся высокой. Скольжение у стенки никуда не девается.',
'fl.mud.note': 'Классическая бингамовская среда нефтянки — на ней модель Метцнера–Рида и обкатывали. Предел текучести здесь полезен: он удерживает шлам во взвеси при остановке циркуляции.',
'fl.water.src': 'Таблица насыщенной жидкости по IAPWS-95 плюс замкнутая поправка на давление для сжатой воды (кубическая зависимость типа Тейта от p − p_s, подогнана к IAPWS-95 на каждой температуре таблицы). Проверено по CoolProp/IAPWS-95 на всей области (0–350 °C, p_s–300 бар): Δρ ≤ 0.17%, Δμ ≤ 0.21%, Δν ≤ 0.22%. Заявленная полоса: ρ и μ ±0.5% (±1% выше 300 °C)',
'fl.steam.src': 'μ — линейная аппроксимация таблиц (±2%); ρ — идеальный газ с поправкой',
'fl.air.src': 'ρ — вириальное уравнение Z = 1 + B(T)n + C(T)n², коэффициенты подогнаны к уравнению состояния воздуха Lemmon et al. (2000) на −50…800 °C и 0…300 бар; μ — обобщённый Сазерленд A·T^k/(T+S) для разреженного газа (классические k = 1.5, S = 110.4 K занижают на 4% уже при 800 °C) плюс плотностный член. Проверено по CoolProp: Δρ ≤ 0.9%, Δμ ≤ 0.95%, Δν ≤ 0.6% на всей области',
'fl.helium.src': 'μ ~ T^0.7 (±3%); ρ — идеальный газ, Z≈1.03 при 70 бар',
'fl.co2.src': 'ρ — уравнение Пенга–Робинсона; μ — μ0(T) + избыточный член по плотности',
'fl.sodium.src': 'Фингс–Лейбовиц / справочник ОЭСР-АЯЭ по натрию',
'fl.lead.src': 'Справочник ОЭСР-АЯЭ по свинцу и СВЭ (2015), корреляции Соболева',
'fl.lbe.src': 'Справочник ОЭСР-АЯЭ по свинцу и СВЭ (2015)',
'fl.flibe.src': 'Корреляция Кантора; по вязкости FLiBe в литературе разброс до ±30%',
'fl.solarsalt.src': 'Стандартные корреляции для смеси 60% NaNO₃ / 40% KNO₃',
'fl.uf6.src': 'GAT-280 (DeWitt, Uranium Hexafluoride: A Survey): кривая сублимации log₁₀P[мм рт.ст.] = 10.648 − 2559.5/T, кривая испарения 6.99464 − 1126.288/(t+221.963), ρ жидкости и η газа по тому же источнику. Тройная точка 64.05 °C / 1.517 бар, критическая 230.2 °C / 46.1 бар',
'fl.crude.src': 'Типичная нефть ~32° API; свойства сильно зависят от месторождения',
'fl.diesel.src': 'ДТ летнее, типовые значения (ν = 2.0–4.5 сСт при 40 °C по EN 590)',

'fl.hfo.src': 'Тяжёлое топливо 380 сСт при 50 °C, экстраполяция по Вальтеру (ASTM D341)',
'fl.propane.src': 'Насыщенная жидкость; давление насыщения по Антуану',
'fl.butane.src': 'Насыщенная жидкость; давление насыщения по Антуану',
'fl.natgas.src': 'Метан-доминирующий состав; Z по корреляции Папая (Стэндинг–Кац), вязкость по Ли–Гонсалесу–Икину. Прежняя оценка вязкости не зависела от плотности и занижала её на 57% при 300 бар',

'mat.drawn.note': 'Практически гидравлически гладкая на большей части диапазона Re. Скорость старения взята как у цветных металлов — тянутые трубки это обычно медь или алюминий; для тянутой углеродистой стали берите строку «сталь коммерческая».',
'mat.steel.note': 'Опорный материал классической диаграммы. Стареет заметно — здесь ползунок возраста работает во всю силу.',
'mat.stainless.note': 'В воде практически не стареет — ползунок возраста почти ничего не меняет.',
'mat.electropol.note': 'Предел гладкой трубы. Шероховатость не влияет ни на что — точка лежит на нижней огибающей.',
'mat.titanium.note': 'Технически чистый титан ограничен примерно 350 °C по газонасыщению (ASME B31.3 обрывает допускаемые напряжения на 316 °C). Гидравлически неотличим от нержавейки. Берут его за коррозионную стойкость, не за гладкость.',
'mat.inconel.note': 'Гидравлически то же, что нержавейка. Смысл сплава — совместимость со средой и жаропрочность.',
'mat.ductile.note': 'Шероховатость задаёт футеровка, а не металл. Зато футеровка почти не стареет.',
'mat.riveted.note': 'Самая грубая позиция на оригинальном чарте Муди 1944 года.',
'mat.hdpe.note': 'Гладкий, но податливый: реальный внутренний диаметр после овализации важнее шероховатости.',
'mat.glass.note': 'Практический эталон гладкой стенки. Никурадзе, вопреки расхожему представлению, работал на тянутых латунных трубах с наклеенным песком, а не на стекле — но нижняя огибающая диаграммы это именно предел гладкой трубы.',
'mat.woodstave.note': 'Позиция с оригинального чарта Муди. Деревянные напорные водоводы ГЭС работали до середины XX века, отдельные стоят до сих пор.',
'mat.corr_ss.note': 'Сопротивление создаёт форма гофра, а не шероховатость стенки. Эквивалентная ε — подгоночная величина, физического смысла шероховатости у неё нет.',
'mat.corr_pe.note': 'То же самое: это не шероховатость, а форма.',
'mat.scale.note': 'В заросшей трубе вода металла уже не касается: сталь и чугун становятся гидравлически неразличимы. Главный эффект — не шероховатость, а потеря диаметра.',
'mat.tubercle.note': 'Классика старых стальных и чугунных водоводов: бугры высотой в миллиметры.',
'mat.biofilm.note': 'Оборотная вода, морская вода, конденсаторы.',
'inc.0': 'Сухой UF₆ образует на углеродистой стали пассивирующую фторидную плёнку, и транспортные контейнеры 30B, 48X и 48Y делают именно из углеродистой стали по ANSI N14.1. Условие — сухость: следы влаги дают HF, и тогда сталь разрушается быстро. В самих каскадах применяют никель, монель и ПТФЭ.',
'inc.1': 'Чугун, футерованные и оцинкованные трубы для UF₆ не применяют: цинк реагирует, футеровка и графит в чугуне удерживают влагу. Штатные материалы — никель, монель, медь, алюминий и ПТФЭ.',
'inc.2': 'UF₆ разрушает эти материалы или реагирует со следами влаги в них. В каскадах применяют ПТФЭ, никель и монель.',
'inc.3': 'Фторидные расплавы требуют хастеллоя N — сплав был разработан в ORNL именно под ЖСР. Нержавейка в FLiBe не служит.',
'inc.4': 'Жидкий свинец растворяет никель и хром из стали. Нужны стали с контролем кислорода или алюминийсодержащие (ODS/FeCrAl).',
'inc.5': 'СВЭ растворяет компоненты стали. Нужен кислородный контроль и стойкие стали.',
'inc.6': 'Нержавейка в свинце работает только при поддержании концентрации кислорода в узком окне и ниже ~500 °C.',
'inc.7': 'То же: нержавейка в СВЭ живёт только под кислородным контролем.',
'inc.8': 'Натрий несовместим с медью и алюминием при рабочих температурах.',
'inc.9': 'Расплав нитратов разрушает алюминий и медь.',
'inc.10': 'Бетонная смесь абразивна: подающие линии делают из износостойкой стали с толстой стенкой, на изгибах — из закалённой. Тонкостенные и мягкие трубы истираются за один-два объекта.',
'inc.11': 'Абразивный износ стенки на бетоноводе идёт быстро, особенно на отводах. Толщину стенки контролируют ультразвуком — это ресурсный, а не гидравлический вопрос.',
'inc.12': 'Та же абразивность: нужна износостойкая сталь.',
'inc.13': 'Ароматика в нефти набухает и размягчает ПВХ — падает прочность, ведёт геометрию. Для нефтепродуктов нужна сталь или ПВДФ.',
'inc.14': 'Бензин набухает и размягчает ПВХ до потери несущей способности. Нужна сталь или фторполимер.',
'inc.15': 'ПНД — штатный материал топливных ёмкостей, но бензин сквозь него заметно диффундирует. Для топлива применяют ПНД со фторированием поверхности или барьерным слоем, а не обычный.',
'inc.16': 'ПВХ и PEX не предназначены для дизельного топлива.',
'fw.water.boil': 'При {t} °C и {p} бар вода вскипает (p насыщ. = {ps} бар). Течение двухфазное — диаграмма Муди неприменима.',
'fw.water.frozen': 'Вода замёрзла.',
'fw.water.nearCrit': 'Приближение к критической точке (374 °C): свойства меняются резко, а сжимаемость жидкой воды здесь уже заметна.',
'fn.water.press': 'При {t} °C и {p} бар вода — сжатая (недогретая) жидкость: свойства насыщенной жидкости скорректированы на давление, что повышает плотность на {dr}% относительно линии насыщения.',
'fw.water.range': 'Температура {t} °C вне проверенного диапазона модели свойств воды (0–350 °C); значения экстраполированы от ближайшей точки таблицы.',
'fw.steam.cond': 'При {t} °C пар конденсируется выше {p} бар.',
'fw.steam.hi': 'Выше 60 бар усечённое вириальное разложение для пара непригодно: у критической точки ошибка достигает десятков процентов. Нужен IAPWS-IF97.',
'fw.steam.mid': 'Выше 25 бар вириальная поправка теряет точность — расхождение с IF97 порядка 3–5%.',
'fn.air.real': 'При {p} бар воздух заметно неидеален: коэффициент сжимаемости Z = {z}. Плотность и вязкость берутся из подогнанной модели реального газа, заявленная полоса расширяется до ±2%.',
'fw.air.range': 'Вне проверенного диапазона модели свойств воздуха (−50…800 °C, до 300 бар) подгонка экстраполируется, и неопределённость уже не ограничена ±2%.',
'fw.co2.nearCrit': 'Околокритическая область: Пенг–Робинсон здесь ошибается на десятки процентов, и вблизи самой критической точки расхождение доходит до кратного. Для проектных расчётов нужен Спан–Вагнер (REFPROP/CoolProp). Точка показана, но верить ей нельзя.',
'fw.co2.dense': 'Плотная фаза (ρ = {rho} кг/м³): Пенг–Робинсон здесь завышает плотность на 5–10%, а вязкость по Фенгуру усиливает эту ошибку через член ~ρ⁸ — по вязкости расхождение до 20%. Плотность и вязкость показаны, но для проектных расчётов нужен Спан–Вагнер.',
'fw.co2.satLine': 'Рядом с линией насыщения (p насыщ. = {ps} бар при {t} °C): малое изменение давления перебрасывает среду между газом и жидкостью, плотность меняется в разы.',
'fw.sodium.frozen': 'Натрий затвердел (t пл. = 98 °C).',
'fw.sodium.boil': 'До кипения натрия (883 °C при 1 бар) остаётся менее 35 °C.',
'fw.lead.frozen': 'Свинец затвердел (t пл. = 327 °C).',
'fw.lead.hot': 'Выше ~500 °C свинец растворяет обычные стали — нужен контроль кислорода или алюминийсодержащие стали.',
'fw.lbe.frozen': 'СВЭ затвердела (t пл. = 125 °C). Замерзание в контуре — известный сценарий отказа.',
'fw.flibe.frozen': 'FLiBe затвердела (t пл. = 459 °C). Для ЖСР это главный отказ по контуру.',
'fw.flibe.near': 'Менее 40 °C запаса до затвердевания.',
'fw.salt.frozen': 'Соль затвердела (t пл. ≈ 220 °C).',
'fw.salt.decomp': 'Выше 590 °C начинается термическое разложение нитратов.',
'fw.uf6.solid': 'При {t} °C UF₆ твёрдый выше {p} бар. Жидкой фазы ниже тройной точки (64.05 °C) не существует — только сублимация.',
'fw.uf6.liquid': 'Жидкий UF₆ существует только выше тройной точки и под давлением — в каскадах не встречается, только при транспортировке и заполнении контейнеров.',
'fw.uf6.reacts': 'UF₆ бурно реагирует с влагой с образованием HF и UO₂F₂. Совместимы никель, монель, медь и алюминий с фторидной пассивацией.',
'fw.uf6.crit': 'Выше критической точки 230.2 °C жидкого UF₆ не существует ни при каком давлении — среда сверхкритическая.',
'fw.hfo.cold': 'Ниже ~60 °C мазут практически не течёт: вязкость выходит за пределы прокачиваемости.',
'fw.propane.boil': 'Пропан вскипает: давление насыщения при {t} °C равно {p} бар. Нужно держать линию выше этого давления.',
'fw.butane.boil': 'Бутан вскипает: давление насыщения при {t} °C равно {p} бар.',
'fw.choc.solid': 'Ниже ~32 °C шоколадная масса застывает.',
'fw.concrete.slip': 'Пристенное скольжение: расчёт по объёмной реологии и по диаграмме Муди здесь принципиально неверен. Точка на чарте показана условно, перепад считается по трибологической модели смазочного слоя.',
'fw.concrete.time': 'Главная переменная — не температура, а время с момента затворения. За 60–90 минут смесь теряет подвижность, τ₀ вырастает в разы, и линия встаёт. У трубы возраст в годах, у бетона — в минутах.',
'fw.concrete.hot': 'В жару схватывание ускоряется, запас времени на укладку сокращается вдвое.',
'fw.scc.slip': 'Пристенное скольжение: перепад задаёт смазочный слой, а не объёмная реология. Диаграмма Муди неприменима.',
'pre.0.name': 'Воздух: 1 бар против 10 бар',
'pre.0.hint': 'Поменяйте давление с 1 на 10 бар при той же скорости — точка уедет вправо почти на декаду, режим сменится.',
'pre.1.name': 'Мазут: зима против лета',
'pre.1.hint': 'Ведите температуру от 60 к 150 °C: течение перескакивает из ламинарного в турбулентное, и материал трубы внезапно начинает иметь значение.',
'pre.2.name': 'Свинец в быстром реакторе',
'pre.2.hint': 'ν ниже, чем у воды: Re за миллион, точка глубоко в автомодельной зоне. Здесь шероховатость решает всё, а разогнать поток нельзя — эрозия.',
'pre.3.name': 'UF₆ в каскаде',
'pre.3.hint': 'Понижайте давление: на десятках паскалей число Кнудсена выводит задачу за пределы сплошной среды, и диаграмма Муди перестаёт работать в принципе.',
'pre.4.name': 'Молоко в санитарной трубе',
'pre.4.hint': 'Предел гладкой трубы: шероховатости фактически нет, точка лежит на нижней огибающей.',
'pre.5.name': 'Кетчуп: предел текучести',
'pre.5.hint': 'Здесь есть порог: ниже определённого перепада среда не течёт вообще. Не «медленно» — вообще.',
'pre.6.name': 'Старая стальная магистраль',
'pre.6.hint': 'Ползунок возраста двигает точку и тянет за собой призрак «новой трубы» — видно, сколько стоило старение.',
'pre.7.name': 'Накипь съедает диаметр',
'pre.7.hint': 'Крутите толщину слоя: перепад растёт не столько от шероховатости, сколько от потери диаметра — эффект D⁻⁵.',
'pre.8.name': 'Бетон: пробка и смазочный слой',
'pre.8.hint': 'Самый крайний случай во всём списке: бетон движется пробкой, сдвиг идёт в слое цементного теста 1–3 мм у стенки. Перепад считает трибология этого слоя, шероховатость трубы не участвует вообще. Точка на диаграмме показана условно — и именно поэтому она здесь и стоит.',

'rep.disclaimer': 'Отчёт сформирован интерактивным учебным инструментом. Корреляции свойств и заявленные погрешности перечислены в разделе «Откуда числа». Собственная погрешность корреляции Колбрука ±15% в полосу не включена и добавляется сверху. Перед применением в проекте сверьтесь с первоисточниками.',

'foot.calcT': 'Расчёт.',
'foot.calc': 'Коэффициент трения — уравнение Колбрука–Уайта, решается итеративно до машинной точности; ламинарная ветка точная (f = 64/Re); режим определяется по шероховатостному числу Рейнольдса k⁺ = (ε/D)·Re·√(f/8). Критическая зона смешивается по локальным значениям при том же Re, поэтому ньютоновская и неньютоновская ветки при n = 1 совпадают в точности. Неньютоновские среды — обобщённый Рейнольдс Метцнера–Рида с точным ламинарным решением Хершеля–Балкли или Кассона, турбулентная ветка по Доджу–Метцнеру; там, где у корреляции нет корня, показывается отказ, а не правдоподобная подстановка. Бетонные смеси считаются по трибологической модели Каплана для пристенного смазочного слоя: ни объёмная реология, ни шероховатость в перепад не входят.',
'foot.propT': 'Свойства сред.',
'foot.prop': 'Вода и пар — линия насыщения по IAPWS (зависимость свойств жидкой воды от давления не моделируется, выше 250 °C и 150 бар это до 9%). Натрий — Фингс–Лейбовиц; свинец и СВЭ — справочник ОЭСР-АЯЭ 2015; FLiBe — корреляция Кантора, согласуется со справочной корреляцией IUPAC 2019 в пределах 2% при 600 °C. CO₂ — Пенг–Робинсон с выбором корня по фугитивности относительно линии насыщения Вагнера, вязкость по Фенгуру–Уэйкхему–Весовичу; в плотной фазе и у критической точки погрешность помечается прямо в интерфейсе. UF₆ — GAT-280. Природный газ — Z по Папаю, вязкость по Ли–Гонсалесу–Икину. Сахарный сироп — NBS Circular 440.',
'foot.limT': 'Чего инструмент не делает.',
'foot.lim': 'Погрешность самой корреляции Колбрука ±15% в полосу неопределённости не входит и добавляется сверху. Скорость зарастания трубы α — по Колбруку и Уайту свойство воды, а не металла: разброс по классификации Ламонта тридцатикратный, поэтому агрессивность задаётся отдельным полем, а для неводных сред механизм отключён. Инструмент показывает и собственные границы применимости: сжимаемость, число Маха, число Кнудсена с различением режимов скольжения, переходного и свободномолекулярного, фазовые переходы, выход за область Колбрука по ε/D, эрозионные и санитарные пределы скорости.',
'foot.final': 'Для проектных расчётов сверяйтесь с первоисточниками — особенно по околокритическому и плотному CO₂, воздуху и газам выше 100 бар, пищевым и бетонным смесям, где разброс между партиями шире любой модели.',
};

acano wiarygodną liczbę; teraz awaria jest wyraźnie widoczna.","w.epsRange":"Względna chropowatość ε/D = {e} wykracza poza zakres, na którym opierał się Colebrook (do ~0,05). Wartość ta pochodzi z ekstrapolacji i zawyża swoją własną wiarygodność — przy tej chropowatości rura jest bliższa karbowaniu niż rurze.","w.noflowSpeed":"Podana prędkość jest nieosiągalna.","w.yieldNote":"Granica plastyczności {tau0} Pa: aby w ogóle wprawić materiał w ruch, potrzebny jest gradient co najmniej {grad} Pa/m, czyli {bar} bar na {len} m — niezależnie od natężenia przepływu.","w.plug":"Naprężenie ścinające ściany nieznacznie przekracza granicę plastyczności: nieścinany korek przesuwa się w dół środka rury, a profil prędkości jest niemal taki sam jak w przypadku korka.","w.nonNewt":"Płyn nienewtonowski: uogólniona liczba Reynoldsa Metznera–Reeda, turbulentna gałąź od Dodge’a–Metznera (gładka rura). Chropowatość nie jest uwzględniona w tej gałęzi — nie istnieje powszechnie akceptowana korelacja między szorstkimi rurami a płynami nienewtonowskimi.","w.normalFlow":"Przepływ podany w warunkach normalnych: {q} Nm³/h = {act} m³/h rzeczywisty przy {t} °C i {p} bar","w.slipNote":"Warstwa smarna: dP/L = (4/D)·({a}·v + {b}) = {grad} bar/m. Reologia objętościowa w ogóle nie ma wpływu na ten wynik.","w.slipMinor":"Niewielkie straty powstałe w wyniku pompowania betonu traktowane są jako długość równoważna: kolano 90° ≈ 3 m prostej rury, wąż elastyczny ≈ 3-krotność jego własnej długości.","w.depositNote":"Warstwa {th} mm po obu stronach: otwór {d0} → {d} mm","w.matTemp":"{mat}: temperatura robocza {t} °C przekracza limit {max} °C. Materiał nie nadaje się do zastosowania w tym przypadku, niezależnie od hydrauliki.","w.foodMat":"Płyn spożywczy wymaga higienicznej powierzchni: polerowanej stali nierdzewnej, PTFE, PVDF lub szkła. Zwykłej stali i tworzyw sztucznych nie da się czyścić na miejscu.","g.Обычные среды":"Typowe płyny","g.Ядерные теплоносители":"Chłodziwa jądrowe","g.Нефть и углеводороды":"Ropa naftowa i węglowodory","g.Пищевые среды":"Płyny spożywcze","g.Неньютоновские среды":"Płyny nienewtonowskie","g.Металлы":"Metale","g.Пластики":"Tworzywa sztuczne","g.Минеральные":"Minerał","g.Гофрированные":"Falisty","g.Отложения":"Depozyty","ph.liquid":"płyn","ph.gas":"gaz","ph.solid":"solidny","ph.gasOverSolid":"gaz (nad fazą stałą)","ph.supercritical":"nadkrytyczny","ph.liquidMetal":"ciekły metal","ph.moltenSalt":"stopiona sól","ph.viscoplastic":"lepkoplastyczny","ph.pseudoplastic":"pseudoplastyczny","ph.binghamPlug":"Wtyczka Binghama","ph.bingham":"Bingham","fl.water.name":"Woda","fl.steam.name":"Para","fl.air.name":"Powietrze","fl.helium.name":"Hel","fl.co2.name":"Dwutlenek węgla","fl.sodium.name":"Sód","fl.lead.name":"Ołów","fl.lbe.name":"Ołów-bizmut (LBE)","fl.flibe.name":"FLiBe (Li₂BeF₄)","fl.solarsalt.name":"Sól azotanowa (60/40)","fl.uf6.name":"Sześciofluorek uranu","fl.crude.name":"Ropa naftowa (średnia)","fl.diesel.name":"Olej napędowy","fl.gasoline.name":"Benzyna","fl.hfo.name":"Ciężki olej opałowy (IFO-380)","fl.propane.name":"Propan (skroplony)","fl.butane.name":"n-butan (skroplony)","fl.natgas.name":"Gaz ziemny","fl.vegoil.name":"Olej roślinny","fl.milk.name":"Mleko","fl.syrup.name":"Syrop cukrowy 70 °Bx","fl.honey.name":"Miód","fl.beer.name":"Piwo / sok","fl.ketchup.name":"Ketchup","fl.mayo.name":"Majonez","fl.yogurt.name":"Jogurt","fl.chocolate.name":"Czekolada (roztopiona)","fl.concrete.name":"Świeży beton","fl.scc.name":"Beton samozagęszczalny","fl.mud.name":"Płuczka wiertnicza","fl.applesauce.name":"Puree owocowe","fl.helium.note":"HTGR/GFR. Niska gęstość wymusza 50–80 m/s, dlatego pompowanie pochłania punkty procentowe mocy cieplnej.","fl.co2.note":"AGR (~40 bar) i nadkrytyczne cykle Braytona (200+ bar). W punkcie krytycznym, 31°C / 73,8 bar, właściwości zmieniają się gwałtownie.","fl.sodium.note":"Szybkie reaktory sodowe. ν ≈ 2,7·10⁻⁷ m²/s — w przeliczeniu na Reynoldsa sód jest rzadszy niż woda, a punkt ten przebiega głęboko w obszarze w pełni chropowatim.","fl.lead.note":"Reaktory prędkie chłodzone ołowiem. ρ ≈ 10 500 kg/m³ — spadek ciśnienia jest ogromny nawet przy niskich prędkościach.","fl.lbe.note":"SVBR i reaktory okrętów podwodnych klasy Alfa. Eutektyka 44,5% Pb / 55,5% Bi, temperatura topnienia 125 °C.","fl.flibe.note":"Reaktory na stopione sole. W temperaturze 600°C lepkość dynamiczna jest około ośmiokrotnie wyższa niż wody, a lepkość kinematyczna około czterokrotnie wyższa: w przeciwieństwie do ciekłych metali, sól jest gęsta. Temperatura topnienia 459°C — zamarzanie w pętli to pierwszy problem, a nie dziesiąty.","fl.solarsalt.note":"Magazynowanie ciepła w elektrowniach słonecznych i obiegach wtórnych. Powyżej ~590°C azotany ulegają rozkładowi.","fl.uf6.note":"Kaskady wzbogacania. M = 352 g/mol — gaz o lepkości kinematycznej cieczy. Przy ciśnieniu atmosferycznym faza ciekła w ogóle nie istnieje: występuje jedynie sublimacja.","fl.hfo.note":"Klasyczny przypadek laminarny. Bez podgrzania do 100–130°C nie da się w ogóle pompować.","fl.natgas.note":"Przy ciśnieniu przesyłowym wynoszącym 55–75 bar współczynnik ściśliwości Z spada do 0,85 — idealny gaz różni się o 15%.","fl.syrup.note":"Newtonowskie, ale lepkość spada o rzędy wielkości po ogrzaniu. Doskonały przypadek laminarny.","fl.honey.note":"Różnica między odmianami i partiami jest kilkukrotna. Obliczanie jej w procentach jest bezcelowe.","fl.ketchup.note":"Posiada granicę plastyczności: poniżej progowego spadku ciśnienia nie płynie wcale, zamiast płynąć powoli.","fl.chocolate.note":"Casson opracował swoje równanie w 1959 roku dla zawiesin pigmentów w oleju – farbach drukarskich; później zastosowano je do czekolady. Jednak to właśnie metoda czekoladowa przyjęła się: do 2000 roku była to oficjalna metoda IOCCC.","fl.concrete.note":"Beton w rurze nie płynie jak ciecz. Porusza się jak korek, a całe ścinanie koncentruje się w 1–3-milimetrowej warstwie zaczynu cementowego na ściance. Reologia tej warstwy decyduje o spadku ciśnienia – nie reologia objętościowa ani chropowatość ścianki.","fl.scc.note":"Granica plastyczności jest o rząd wielkości niższa niż w przypadku zwykłej mieszanki – mieszanka rozprowadza się samoistnie, ale lepkość pozostaje wysoka. Poślizg na ściance nie przemieszcza się.","fl.mud.note":"Klasyczny płyn Binghama z przemysłu naftowego – model Metznera-Reeda – sprawdził się na nim. Granica plastyczności jest tu przydatna: utrzymuje ona zwierciny w zawiesinie po zatrzymaniu cyrkulacji.","fl.water.src":"Tabela cieczy nasyconych z IAPWS-95 plus korekta ciśnienia sprężonej cieczy w formie zamkniętej (sześcienny układ Taita w p − p_s, dopasowany do IAPWS-95 dla każdej temperatury tabeli). Sprawdzona w porównaniu z CoolProp/IAPWS-95 w całym zakresie pomiarowym tego narzędzia (0–350°C, p_s–300 bar): Δρ ≤ 0,17%, Δμ ≤ 0,21%, Δν ≤ 0,22%. Deklarowane pasmo: ρ i μ ±0,5% (±1% powyżej 300°C).","fl.steam.src":"ρ — gaz doskonały z drugą poprawką wirialną dopasowaną do IAPWS; μ — dopasowanie liniowe do tablic (±2%).","fl.air.src":"ρ — równanie wirialne Z = 1 + B(T)n + C(T)n², współczynniki dopasowane do równania stanu powietrza Lemmona i in. (2000) w zakresie −50…800 °C i 0…300 bar; μ — uogólnione równanie Sutherlanda A·T^k/(T+S) dla gazu rozcieńczonego (klasyczne k = 1,5, S = 110,4 K ma wartość niższą o 4% w 800 °C) plus składnik nadmiaru gęstości. Sprawdzono w odniesieniu do CoolProp: Δρ ≤ 0,9%, Δμ ≤ 0,95%, Δν ≤ 0,6% w całym tym zakresie.","fl.helium.src":"μ ~ T^0,7 (±3%); ρ — gaz doskonały, Z ≈ 1,03 przy 70 barach.","fl.co2.src":"ρ — Peng–Robinson z selekcją pierwiastków przez lotność względem krzywej nasycenia Wagnera; μ — Fenghour–Wakeham–Vesovic.","fl.sodium.src":"Podręcznik Finka–Leibowitza / OECD-NEA dotyczący sodu.","fl.lead.src":"Podręcznik OECD-NEA na temat ołowiu i eutektyki ołowiowo-bizmutowej (2015), korelacje Sobolewa.","fl.lbe.src":"Podręcznik OECD-NEA na temat ołowiu i eutektyki ołowiowo-bizmutowej (2015).","fl.flibe.src":"Korelacja Cantora; zgodna z korelacją referencyjną IUPAC/NIST (2019) z dokładnością do 2% w temperaturze 600°C. Rozrzut danych literaturowych dotyczących lepkości FLiBe sięga ±30%.","fl.solarsalt.src":"Standardowe korelacje dla mieszaniny 60% NaNO₃ / 40% KNO₃.","fl.uf6.src":"GAT-280 (DeWitt, Sześciofluorek uranu: Przegląd): krzywa sublimacji log₁₀P[mmHg] = 10,648 − 2559,5/T, krzywa parowania 6,99464 − 1126,288/(t+221,963), ciecz ρ i gaz η z tego samego źródła. Punkt potrójny 64,05 °C / 1,517 bara, punkt krytyczny 230,2 °C / 46,1 bara.","fl.crude.src":"Typowa ropa naftowa o zawartości API wynoszącej ~32°; jej właściwości w dużym stopniu zależą od złoża.","fl.diesel.src":"Letni olej napędowy, wartości typowe (ν = 2,0–4,5 cSt przy 40°C zgodnie z EN 590).","fl.gasoline.src":"Wartości typowe dla benzyny samochodowej.","fl.hfo.src":"Ciężki olej opałowy, 380 cSt w temp. 50 °C, ekstrapolacja Walther (ASTM D341).","fl.propane.src":"Ciecz nasycona; ciśnienie nasycenia według Antoine'a.","fl.butane.src":"Ciecz nasycona; ciśnienie nasycenia według Antoine'a.","fl.natgas.src":"Skład zdominowany przez metan; Z obliczono na podstawie korelacji Papaya (Standing–Katz), lepkość na podstawie Lee–Gonzaleza–Eakina.","fl.vegoil.src":"Słonecznik/rzepak; ν = 65 cSt w temp. 20 °C.","fl.milk.src":"Mleko pełne, 3,5% tłuszczu.","fl.syrup.src":"70% roztwór sacharozy, lepkości podane w Okólniku NBS 440 (Swindells i in.).","fl.honey.src":"Miód kwiatowy, wilgotność ~17%; zależność Arrheniusa, Ea ≈ 90 kJ/mol.","fl.beer.src":"Blisko wody, z poprawką na ekstrakt.","fl.ketchup.src":"Herschel – Bulkley: τ₀ ≈ 32 Pa, K ≈ 18 Pa·sⁿ, n ≈ 0,28 (ketchup pomidorowy).","fl.mayo.src":"Herschel – Bulkley: τ₀ ≈ 90 Pa, K ≈ 25 Pa·sⁿ, n ≈ 0,35 (wysoce zależne od receptury).","fl.yogurt.src":"Herschel – Bulkley: τ₀ ≈ 20 Pa, K ≈ 6 Pa·sⁿ, n ≈ 0,35 (jogurt mieszany).","fl.chocolate.src":"Model Cassona: τ₀ ≈ 12 Pa, μ_C ≈ 2,0 Pa·s.","fl.concrete.src":"Bingham: τ₀ ≈ 800 Pa, lepkość plastyczna ≈ 40 Pa·s (mieszanka o dużej gęstości). Spadek ciśnienia z modelu tribologicznego Kaplana; stałe warstwy smarnej są skalibrowane do pomiarów DN125 (~0,14 bar/m).","fl.scc.src":"Bingham: τ₀ ≈ 50 Pa, lepkość plastyczna ≈ 25 Pa·s; tribologia według Feysa i Kaplana.","fl.mud.src":"Płuczka bentonitowa o ciśnieniu 1200 kg/m³: τ₀ ≈ 8 Pa, lepkość plastyczna ≈ 15 cP (opublikowany zakres dla nieobciążonych płuczek wynosi 1–20 cP).","fl.applesauce.src":"Prawo potęgowe: K ≈ 6 Pa·sⁿ, n ≈ 0,35 (przecier jabłkowy).","fl.lead.vmax":"erozja-korozja stali w strumieniu metali ciężkich (w literaturze dotyczącej chłodziw ołowiowych podawana jest wartość około 2 m/s dla zwykłych stali)","fl.lbe.vmax":"erozja-korozja stali (limit projektowy SVBR)","mat.drawn.name":"Rury ciągnione (stal/miedź/aluminium)","mat.steel.name":"Stal komercyjna (spawana)","mat.spiral.name":"Stal spawana spiralnie","mat.stainless.name":"Stal nierdzewna","mat.sanitary.name":"Stal nierdzewna sanitarna, Ra 0,8","mat.electropol.name":"Stal nierdzewna elektropolerowana, Ra 0,4","mat.galv.name":"Stal ocynkowana","mat.copper.name":"Miedź","mat.alu.name":"Aluminium","mat.titanium.name":"Tytan","mat.inconel.name":"Inconel / Hastelloy / Monel","mat.castiron.name":"Lane żelazo","mat.ductile.name":"Żeliwo sferoidalne, wyłożone zaprawą cementową","mat.riveted.name":"Stal nitowana (historyczna)","mat.pvc.name":"PCV","mat.hdpe.name":"HDPE (PE100)","mat.pp.name":"Polipropylen","mat.pex.name":"Polietylen usieciowany (PEX)","mat.pvdf.name":"PVDF","mat.ptfe.name":"PTFE (wyściółka)","mat.grp.name":"Tworzywo sztuczne wzmocnione włóknem szklanym (GRP)","mat.glass.name":"Szkło","mat.concrete.name":"Beton","mat.asbestos.name":"Cement azbestowy","mat.woodstave.name":"Fajka z klepek drewnianych","mat.corr_ss.name":"Falista stal nierdzewna","mat.corr_pe.name":"Tektura falista HDPE (drenaż)","mat.scale.name":"Kamień węglanowy","mat.tubercle.name":"Gruźlica","mat.biofilm.name":"Biofouling","mat.drawn.note":"Skutecznie wygładza hydraulicznie w większości zakresu Re. Szybkość starzenia jest przyjmowana jak dla metali nieżelaznych — rury ciągnione są zazwyczaj miedziane lub aluminiowe; w przypadku ciągnionej stali węglowej należy stosować stal komercyjną.","mat.steel.note":"Materiał referencyjny klasycznego diagramu. Starzeje się zauważalnie — to właśnie tutaj suwak wieku wykonuje swoją prawdziwą pracę.","mat.stainless.note":"Praktycznie nie starzeje się w wodzie — suwak wieku prawie nic nie zmienia.","mat.electropol.note":"Granica gładkiej rury. Chropowatość nie ma żadnego wpływu – punkt znajduje się na dolnej obwiedni.","mat.titanium.note":"Komercyjnie czysty tytan jest ograniczony do temperatury około 350°C przez gazowanie (norma ASME B31.3 ogranicza dopuszczalne naprężenia do 316°C). Pod względem hydraulicznym nie różni się od stali nierdzewnej. Jest wybierany ze względu na odporność na korozję, a nie gładkość.","mat.inconel.note":"Pod względem hydraulicznym jest taki sam jak stal nierdzewna. Cechą charakterystyczną tego stopu jest kompatybilność z płynami i odporność na ciepło.","mat.ductile.note":"To podszewka, a nie metal, decyduje o chropowatości. W zamian podszewka prawie się nie starzeje.","mat.riveted.note":"Najtrudniejszy wpis na oryginalnej liście Moody’s z 1944 r.","mat.hdpe.note":"Gładkie, ale podatne: rzeczywista średnica wewnętrzna po owalizacji ma większe znaczenie niż chropowatość.","mat.glass.note":"Praktyczny punkt odniesienia dla gładkiej ściany. Nikuradse, wbrew powszechnemu przekonaniu, pracował z ciągnionymi rurami mosiężnymi pokrytymi piaskiem, a nie szkłem – ale dolna granica na wykresie to dokładnie granica dla rur gładkich.","mat.woodstave.note":"Wpis z oryginalnego wykresu Moody's. Drewniane rurociągi doprowadzające wodę służyły do ​​zasilania elektrowni wodnych do połowy XX wieku, a kilka z nich nadal stoi.","mat.corr_ss.note":"Opór wynika z kształtu fali, a nie z chropowatości ścianki. Równoważnik ε jest wielkością pasującą, niemającą fizycznego znaczenia jako chropowatość.","mat.corr_pe.note":"To ponownie efekt kształtu, a nie chropowatości.","mat.scale.note":"W zanieczyszczonej rurze woda nie styka się już z metalem: stal i żeliwo stają się nieodróżnialne hydraulicznie. Dominującym efektem nie jest chropowatość, lecz utrata średnicy.","mat.tubercle.note":"Klasyczny stan starych stalowych i żeliwnych sieci wodociągowych: guzki o wysokości milimetrów.","mat.biofilm.note":"Woda chłodząca, woda morska, skraplacze.","inc.0":"Suchy UF₆ tworzy pasywującą warstwę fluorku na stali węglowej, a cylindry transportowe 30B, 48X i 48Y są wykonane ze stali węglowej zgodnej z normą ANSI N14.1. Warunkiem jest suchość: śladowe ilości wilgoci uwalniają HF, co powoduje szybkie pękanie stali. W samych kaskadach stosuje się nikiel, monel i PTFE.","inc.1":"Do UF₆ nie stosuje się żeliwa ani rur wykładanych lub ocynkowanych: cynk wchodzi w reakcję, a wykładziny i grafit w żeliwie zatrzymują wilgoć. Standardowymi materiałami są nikiel, monel, miedź, aluminium i PTFE.","inc.2":"UF₆ niszczy te materiały lub reaguje ze śladowymi ilościami wilgoci. W kaskadach stosuje się PTFE, nikiel i monel.","inc.3":"Stopy fluorkowe wymagają stopu Hastelloy N — został on opracowany w ORNL specjalnie do reaktorów z solami stopionymi. Stal nierdzewna nie jest odporna na działanie FLiBe.","inc.4":"Ciekły ołów rozpuszcza nikiel i chrom w stali. Wymagane są stale z kontrolowaną zawartością tlenu lub stale wytwarzające tlenek glinu (ODS/FeCrAl).","inc.5":"LBE rozpuszcza składniki stali. Wymagana jest kontrola tlenu i stal odporna.","inc.6":"Wyroby ze stali nierdzewnej wykonane są wyłącznie z ołowiu, a stężenie tlenu utrzymuje się w wąskim przedziale i poniżej ~500 °C.","inc.7":"To samo: stal nierdzewna przetrwa w LBE tylko pod kontrolą tlenu.","inc.8":"Sód jest niezgodny z miedzią i aluminium w temperaturach roboczych.","inc.9":"Stopiony azotan niszczy aluminium i miedź.","inc.10":"Świeży beton jest ścierny: przewody tłoczne wykonane są z grubościennej stali odpornej na zużycie, a kolana z hartowanej stali. Cienkościenne i miękkie rury ulegają zużyciu w jednym lub dwóch etapach.","inc.11":"Ścieralne zużycie ścianek rurociągów betonowych jest szybkie, szczególnie na zakrętach. Grubość ścianek jest monitorowana ultradźwiękowo – to kwestia trwałości, a nie hydrauliki.","inc.12":"Ta sama ścieralność: wymagana jest stal odporna na zużycie.","inc.13":"Aromaty w surowej surówce powodują pęcznienie i zmiękczenie PVC — spada wytrzymałość, a geometria ulega zniekształceniu. Produkty naftowe wymagają stali lub PVDF.","inc.14":"Benzyna pęcznieje i zmiękcza PVC, aż traci swoją nośność. Wymagana jest stal lub fluoropolimer.","inc.15":"HDPE to standardowy materiał na zbiorniki paliwa, ale benzyna w znacznym stopniu przez niego dyfunduje. W serwisach paliwowych stosuje się HDPE z powierzchniowo fluorowaną warstwą lub warstwą barierową, a nie zwykły.","inc.16":"PVC i PEX nie są przeznaczone do oleju napędowego.","fw.water.boil":"W temperaturze {t} °C i {p} bar woda wrze (p nasycenia = {ps} bar). Przepływ jest dwufazowy — diagram Moody’ego nie ma tu zastosowania.","fw.water.frozen":"Woda jest zamarznięta.","fw.water.nearCrit":"Zbliżając się do punktu krytycznego (374 °C) właściwości zmieniają się gwałtownie i już tutaj zauważalna jest ściśliwość ciekłej wody.","fn.water.press":"W temperaturze {t} °C i ciśnieniu {p} bar woda jest sprężoną (przechłodzoną) cieczą: właściwości cieczy nasyconej są korygowane o ciśnienie, które zwiększa gęstość o {dr}% w stosunku do linii nasycenia.","fw.water.range":"Temperatura {t} °C znajduje się poza sprawdzonym zakresem modelu właściwości wody (0–350 °C); wartości ekstrapolowano z najbliższego punktu tabeli.","fw.steam.cond":"W temperaturze {t} °C para skrapla się przy ciśnieniu powyżej {p} bar.","fw.steam.hi":"Powyżej 60 barów obcięty współczynnik rozszerzalności wirialnej pary jest bezużyteczny: w pobliżu punktu krytycznego błąd sięga kilkudziesięciu procent. Wymagany jest standard IAPWS-IF97.","fw.steam.mid":"Powyżej 25 barów korekcja wirialna traci na dokładności — rozbieżność w stosunku do IF97 wynosi rzędu 3–5%.","fn.air.real":"Przy ciśnieniu {p} bar powietrze jest mierzalnie nieidealne: współczynnik ściśliwości wynosi Z = {z}. Gęstość i lepkość pochodzą z dopasowanego modelu gazu rzeczywistego, a deklarowany zakres rozszerza się do ±2%.","fw.air.range":"Poza sprawdzonym zakresem modelu właściwości powietrza (−50…800 °C, do 300 bar) dopasowanie jest ekstrapolowane, a niepewność właściwości nie jest już ograniczona do ±2%.","fw.co2.nearCrit":"Obszar bliski krytycznemu: Peng-Robinson myli się tu o dziesiątki procent, a tuż przy punkcie krytycznym rozbieżność staje się wielokrotnością. Do prac projektowych potrzebne są algorytmy Span-Wagner (REFPROP/CoolProp). Punkt jest pokazany, ale nie można mu ufać.","fw.co2.dense":"Faza gęsta (ρ = {rho} kg/m³): Peng–Robinson przeszacowuje tutaj gęstość o 5–10%, a lepkość Fenghoura wzmacnia ten błąd poprzez swój składnik ~ρ⁸ — aż do 20% lepkości. Gęstość i lepkość są pokazane, ale prace projektowe wymagają zastosowania równania Spana–Wagnera.","fw.co2.satLine":"Blisko linii nasycenia (p nasycenia = {ps} bar przy {t} °C): niewielka zmiana ciśnienia powoduje, że płyn przechodzi pomiędzy gazem i cieczą, a gęstość zmienia się kilkukrotnie.","fw.sodium.frozen":"Sód uległ zestaleniu (temperatura topnienia 98 °C).","fw.sodium.boil":"Do temperatury wrzenia sodu (883 °C przy ciśnieniu 1 bar) pozostaje mniej niż 35 °C.","fw.lead.frozen":"Ołów uległ zestaleniu (temperatura topnienia 327 °C).","fw.lead.hot":"Powyżej ~500 °C ołów rozpuszcza zwykłe stale — wymagane jest stosowanie stali z kontrolą tlenu lub tworzących tlenek glinu.","fw.lbe.frozen":"LBE uległo zestaleniu (temperatura topnienia 125°C). Zamrożenie w pętli to dobrze znany scenariusz awarii.","fw.flibe.frozen":"FLiBe uległ zestaleniu (temperatura topnienia 459°C). W przypadku reaktora z solą stopioną jest to awaria pętli głównej.","fw.flibe.near":"Temperatura graniczna do zestalenia poniżej 40 °C.","fw.salt.frozen":"Sól uległa zestaleniu (temperatura topnienia ≈ 220 °C).","fw.salt.decomp":"Powyżej 590 °C azotany zaczynają się rozkładać termicznie.","fw.uf6.solid":"W temperaturze {t} °C UF₆ jest ciałem stałym powyżej {p} bar. Poniżej punktu potrójnego (64,05 °C) nie występuje faza ciekła — występuje jedynie sublimacja.","fw.uf6.liquid":"Ciekły UF₆ występuje jedynie powyżej punktu potrójnego i pod ciśnieniem — nie występuje w kaskadach, jedynie w czasie transportu i napełniania cylindrów.","fw.uf6.reacts":"UF₆ reaguje gwałtownie z wilgocią, tworząc HF i UO₂F₂. Nikiel, monel, miedź i aluminium z pasywacją fluorkową są kompatybilne.","fw.uf6.crit":"Powyżej punktu krytycznego 230,2 °C ciekły UF₆ nie występuje pod żadnym ciśnieniem — ciecz ta jest w stanie nadkrytycznym.","fw.hfo.cold":"Poniżej ~60 °C ciężki olej opałowy ledwo płynie: jego lepkość jest tak duża, że ​​nie można go pompować.","fw.propane.boil":"Propan wrze: ciśnienie nasycenia w temperaturze {t} °C wynosi {p} bar. Linia musi być utrzymywana powyżej tego ciśnienia.","fw.butane.boil":"Butan wrze: ciśnienie nasycenia w temperaturze {t} °C wynosi {p} bar.","fw.choc.solid":"W temperaturze poniżej ~32 °C masa czekoladowa tężeje.","fw.concrete.slip":"Poślizg przyścienny: obliczanie go na podstawie reologii objętościowej i diagramu Moody'ego jest zasadniczo błędne. Punkt na wykresie ma charakter orientacyjny; spadek ciśnienia oblicza się na podstawie modelu tribologicznego warstwy smarnej.","fw.concrete.time":"Zmienną decydującą nie jest temperatura, ale czas od wymieszania. Po 60–90 minutach mieszanka traci urabialność, τ₀ wzrasta kilkukrotnie, a linia się zatrzymuje. Wiek rury mierzy się w latach, a betonu w minutach.","fw.concrete.hot":"W czasie upałów przyspiesza się ustawianie i otwieranie połówek okna.","fw.scc.slip":"Poślizg przyścienny: warstwa smaru, a nie reologia objętości, decyduje o spadku ciśnienia. Diagram Moody'ego nie ma tu zastosowania.","pre.0.name":"Powietrze: 1 bar w porównaniu do 10 barów","pre.0.hint":"Zmień ciśnienie od 1 do 10 barów przy tej samej prędkości — punkt przesunie się o prawie dziesięć lat w prawo, a reżim ulegnie zmianie.","pre.1.name":"Ciężki olej opałowy: zima kontra lato","pre.1.hint":"Zwiększ temperaturę z 60 do 150 °C: przepływ zmienia się z laminarnego na turbulentny, a materiał rury nagle zaczyna mieć znaczenie.","pre.2.name":"Ołów w reaktorze prędkim","pre.2.hint":"ν jest niższe niż wody: Re przekracza milion, a punkt znajduje się głęboko w obszarze o pełnej chropowatości. Chropowatość decyduje tu o wszystkim i nie da się przyspieszyć przepływu – erozja.","pre.3.name":"UF₆ w kaskadzie","pre.3.hint":"Obniżmy ciśnienie: przy dziesiątkach paskali liczba Knudsena eliminuje problem z mechaniki ośrodków ciągłych, a diagram Moody'ego przestaje w zasadzie działać.","pre.4.name":"Mleko w rurkach sanitarnych","pre.4.hint":"Granica gładkiej rury: w zasadzie nie ma żadnej chropowatości, a punkt leży na dolnej obwiedni.","pre.5.name":"Keczup: granica plastyczności","pre.5.hint":"Istnieje pewien próg: poniżej pewnego spadku ciśnienia płyn w ogóle nie płynie. Nie wolno – wcale.","pre.6.name":"Stary stalowy przewód główny","pre.6.hint":"Suwak wieku przesuwa punkt i ciągnie za sobą widmo nowej rury — można zobaczyć, jaki jest koszt starzenia.","pre.7.name":"Skala zjada nudę","pre.7.hint":"Zwiększ grubość warstwy: kropla rośnie mniej z powodu chropowatości niż z powodu utraconej średnicy — jest to efekt D⁻⁵.","pre.8.name":"Beton: warstwa korka i smaru","pre.8.hint":"Najbardziej ekstremalny przypadek na całej liście: beton porusza się jak kołek, a ścinanie następuje w warstwie zaczynu cementowego o grubości 1–3 mm na ścianie. Trybologia tej warstwy decyduje o spadku ciśnienia; chropowatość rury nie odgrywa żadnej roli. Punkt na diagramie ma charakter orientacyjny — i właśnie dlatego się tu znajduje.","rep.title":"Obliczenia hydrauliki rurowej","rep.subtitle":"Diagram Moody'ego — raport obliczeniowy","rep.generated":"Wygenerowano","rep.inputs":"Dane wejściowe","rep.results":"Wyniki","rep.chart":"Punkt operacyjny na diagramie Moody'ego","rep.disclaimer":"Niniejszy raport został wygenerowany przez interaktywne narzędzie edukacyjne. Korelacje właściwości i ich deklarowane niepewności są wymienione w sekcji „Skąd pochodzą liczby”. Niepewność własna korelacji Colebrooka wynosząca ±15% nie jest uwzględniona w przedziale i należy ją dodać. Przed wykorzystaniem do projektu należy zweryfikować dane ze źródłami pierwotnymi.","rep.noWarn":"W tej sprawie nie wydano żadnych ostrzeżeń.","rep.page":"Strona","foot.calcT":"Obliczenie.","foot.calc":"Współczynnik tarcia pochodzi z równania Colebrooka-White'a, rozwiązywanego iteracyjnie z precyzją maszyny; gałąź laminarna jest dokładna (f = 64/Re); zakres jest zgodny z liczbą Reynoldsa chropowatości k⁺ = (ε/D)·Re·√(f/8). Strefa krytyczna jest mieszana z wartości lokalnych przy tym samym Re, więc gałęzie newtonowskie i nienewtonowskie pokrywają się dokładnie przy n = 1. Płyny nienewtonowskie wykorzystują uogólnioną liczbę Reynoldsa Metznera-Reeda z dokładnym rozwiązaniem laminarnym Herschela-Bulkleya lub Cassona oraz turbulentną gałąź Dodge'a-Metznera; tam, gdzie korelacja nie ma pierwiastka, pokazano odmowę zamiast prawdopodobnego substytutu. Mieszanki betonowe są obliczane z tribologicznego modelu Kaplana warstwy smarującej ścianki: ani reologia objętościowa, ani chropowatość nie wpływają na spadek ciśnienia.","foot.propT":"Właściwości płynów.","foot.prop":"Woda i para — linia nasycenia według IAPWS (zależność od ciśnienia ciekłej wody nie jest modelowana; powyżej 250°C i 150 barów wynosi do 9%). Sód — Fink–Leibowitz; ołów i LBE — podręcznik OECD-NEA 2015; FLiBe — korelacja Cantora, zgodna z korelacją referencyjną IUPAC 2019 z dokładnością do 2% przy 600°C. CO₂ — Peng–Robinson z selekcją pierwiastków przez lotność względem krzywej nasycenia Wagnera, lepkość według Fenghoura–Wakehama–Vesovica; w fazie gęstej i w pobliżu punktu krytycznego błąd jest oflagowany w samym interfejsie. UF₆ — GAT-280. Gaz ziemny — Z według Papay, lepkość według Lee–Gonzaleza–Eakina. Syrop cukrowy — okólnik NBS 440.","foot.limT":"Czego narzędzie nie robi.","foot.lim":"Sama niepewność ±15% korelacji Colebrooka nie jest częścią pasma i należy ją dodać. Szybkość zanieczyszczania się rury, α, jest według Colebrooka i White'a właściwością wody, a nie metalu: klasyfikacja Lamonta obejmuje czynnik trzydziesty, dlatego agresywność jest odrębną dziedziną, a mechanizm ten jest wyłączony dla płynów niewodnych. Narzędzie wskazuje również własne granice stosowalności: ściśliwość, liczbę Macha, liczbę Knudsena z poślizgiem, wyróżnione reżimy przejściowe i wolnocząsteczkowe, przejścia fazowe, odejście od zakresu Colebrooka ε/D oraz granice prędkości erozji i sanitarnej.","foot.final":"W przypadku prac projektowych należy dokonać kontroli pod kątem źródeł pierwotnych — zwłaszcza w przypadku bliskiego krytycznemu i gęstego CO₂, powietrza i gazów o ciśnieniu powyżej 100 barów, a także mieszanek spożywczych i betonowych, w przypadku których rozrzut między partiami jest większy niż w jakimkolwiek modelu."};

const I18N = (function(){
// ---------------------------------------------------------------------------
//  Рантайм локализации.
//  Каталоги LANG_xx подставляются сборщиком; здесь только разрешение ключей.
// ---------------------------------------------------------------------------
'use strict';

const LANGS = [
  { code: 'en', name: 'English' },
  { code: 'nl', name: 'Nederlands' },
  { code: 'fr', name: 'Français' },
  { code: 'de', name: 'Deutsch' },
  { code: 'es', name: 'Español' },
  { code: 'uk', name: 'Українська' },
  { code: 'ru', name: 'Русский' },
  { code: 'pl', name: 'Polski' },
];

// Локали для форматирования чисел и дат
const LOCALE = { en: 'en-GB', nl: 'nl-NL', fr: 'fr-FR', de: 'de-DE',
                 es: 'es-ES', uk: 'uk-UA', ru: 'ru-RU', pl: 'pl-PL' };

const CATALOGS = { en: LANG_en, nl: LANG_nl, fr: LANG_fr, de: LANG_de,
                   es: LANG_es, uk: LANG_uk, ru: LANG_ru, pl: LANG_pl };

let LANG = 'en';

function setLang(code) {
  if (CATALOGS[code]) LANG = code;
  return LANG;
}
function getLang() { return LANG; }
function locale() { return LOCALE[LANG] || 'en-GB'; }

// Определение языка при первом открытии: ?lang= в адресе, затем язык браузера.
function detectLang() {
  try {
    const q = new URLSearchParams(location.search).get('lang');
    if (q && CATALOGS[q]) return q;
    const h = (location.hash || '').replace('#', '');
    if (CATALOGS[h]) return h;
  } catch (e) { /* file:// без search — не страшно */ }
  try { const x = localStorage.getItem('diagram_site_lang') || localStorage.getItem('diagram_lang'); if (x && CATALOGS[x]) return x; } catch (e) {}
  if (window.__diagramLang && CATALOGS[window.__diagramLang]) return window.__diagramLang;
  const nav = (typeof navigator !== 'undefined' && navigator.languages) || [];
  for (const l of nav) {
    const two = String(l).slice(0, 2).toLowerCase();
    if (CATALOGS[two]) return two;
    if (two === 'ua') return 'uk';          // частая ошибка в коде языка
  }
  return 'en';
}

// Разрешение ключа. Значения параметров, которые сами являются ключами
// каталога, разворачиваются рекурсивно — так подставляются, например,
// названия материалов внутрь предупреждения о температуре.
function t(key, params) {
  if (key == null) return '';
  const cat = CATALOGS[LANG] || CATALOGS.en;
  let s = cat[key];
  if (s === undefined) s = CATALOGS.en[key];
  if (s === undefined) return key;          // видно сразу, что ключ забыт
  if (!params) return s;
  return s.replace(/\{(\w+)\}/g, (m, name) => {
    const v = params[name];
    if (v === undefined) return m;
    if (typeof v === 'string' && (cat[v] !== undefined || CATALOGS.en[v] !== undefined)) {
      return t(v);
    }
    return v;
  });
}
// Есть ли такой ключ вообще (для необязательных примечаний)
function has(key) {
  return (CATALOGS[LANG] && CATALOGS[LANG][key] !== undefined)
      || CATALOGS.en[key] !== undefined;
}
// Разрешение объекта {k, p} — так устроены предупреждения и заметки
function tm(o) {
  if (o == null) return '';
  if (typeof o === 'string') return o;
  return t(o.k, o.p);
}


return { LANGS, LOCALE, CATALOGS, setLang, getLang, locale, detectLang, t, has, tm };
})();
const PHYSICS = (function(){
// ---------------------------------------------------------------------------
// Гидравлическое ядро: Колбрук–Уайт, Дарси–Вейсбах, режимы, неньютоновские среды
// Все величины в СИ, если не оговорено. Диаметр D в метрах, eps в метрах.
// ---------------------------------------------------------------------------

'use strict';

const RE_LAM = 2300;      // верх ламинарной ветки
const RE_TURB = 4000;     // низ развитой турбулентности

// Колбрук получен на eps/D <= ~0.05. Выше — экстраполяция, а при eps/D -> 3.7
// у функции полюс (аргумент логарифма обращается в ноль). Это надо ловить.
const COLEBROOK_EPS_MAX = 0.05;

// --- Колбрук–Уайт -----------------------------------------------------------
// 1/sqrt(f) = -2 log10( (eps/D)/3.7 + 2.51/(Re sqrt(f)) )
// Стартуем с явной аппроксимации Сергидеса, затем уточняем Ньютоном по x=1/sqrt(f).
function colebrook(Re, relEps) {
  if (!(Re > 0) || !(relEps >= 0)) return NaN;
  if (relEps > 0.5) return NaN;            // за полюсом смысла нет
  const A = -2 * Math.log10(relEps / 3.7 + 12 / Re);
  const B = -2 * Math.log10(relEps / 3.7 + 2.51 * A / Re);
  const C = -2 * Math.log10(relEps / 3.7 + 2.51 * B / Re);
  let x = A - Math.pow(B - A, 2) / (C - 2 * B + A);      // Сергидес: x = 1/sqrt(f)
  if (!isFinite(x) || x <= 0) x = A;

  // Уточнение: g(x) = x + 2 log10( relEps/3.7 + 2.51 x / Re ) = 0
  for (let i = 0; i < 40; i++) {
    const u = relEps / 3.7 + 2.51 * x / Re;
    const g = x + 2 * Math.log10(u);
    const dg = 1 + (2 / Math.LN10) * (2.51 / Re) / u;
    const step = g / dg;
    x -= step;
    if (Math.abs(step) < 1e-13) break;
  }
  return 1 / (x * x);
}

// Полностью шероховатый предел (von Karman) — f не зависит от Re
function fullyRoughF(relEps) {
  const x = -2 * Math.log10(relEps / 3.7);
  return 1 / (x * x);
}

// --- Коэффициент трения с учётом режима ------------------------------------
// Возвращает {f, regime, uncertain}
function frictionFactor(Re, relEps) {
  if (!(Re > 0)) return { f: NaN, regime: 'none', uncertain: true };
  if (Re < RE_LAM) {
    return { f: 64 / Re, regime: 'laminar', uncertain: false };
  }
  if (Re < RE_TURB) {
    // Критическая зона: устойчивой корреляции нет. Смешиваем ЛОКАЛЬНЫЕ значения
    // при том же Re — ламинарное и турбулентное, — а не хорду между краями зоны.
    // Так же устроена неньютоновская ветка, и при n = 1 обе теперь совпадают.
    const t = (Re - RE_LAM) / (RE_TURB - RE_LAM);
    const f = (64 / Re) * (1 - t) + colebrook(Re, relEps) * t;
    return { f, regime: 'critical', uncertain: true };
  }
  const f = colebrook(Re, relEps);
  // Классификация по шероховатостному числу Рейнольдса k+ = (eps/D)·Re·sqrt(f/8)
  const kPlus = relEps * Re * Math.sqrt(f / 8);
  let regime = 'transitional';
  if (kPlus < 5) regime = 'smooth';
  else if (kPlus > 70) regime = 'rough';
  return { f, regime, kPlus, uncertain: false };
}

// --- Неньютоновские среды ---------------------------------------------------
// Степенной закон: tau = K * gamma^n
// Обобщённый Рейнольдс Метцнера–Рида
function reMetznerReed(rho, v, D, K, n) {
  const Kp = K * Math.pow((3 * n + 1) / (4 * n), n);
  return rho * Math.pow(v, 2 - n) * Math.pow(D, n) / (Math.pow(8, n - 1) * Kp);
}

// Додж–Метцнер (в форме Фаннинга), решаем итеративно
// Возвращает NaN, если корня нет или итерация не сошлась. Раньше здесь молча

function dodgeMetzner(ReMR, n) {
  if (!(ReMR > 0) || !(n > 0)) return NaN;
  let fF = 0.079 * Math.pow(ReMR, -0.25);            // старт: гладкая труба
  if (!(fF > 0) || !isFinite(fF)) fF = 0.005;

  for (let i = 0; i < 500; i++) {

              - 0.4 / Math.pow(n, 1.2);
    if (!(rhs > 0)) return NaN;
    const fNew = 1 / (rhs * rhs);
    if (!isFinite(fNew) || fNew <= 0) return NaN;
    const done = Math.abs(fNew - fF) < 1e-14 * Math.max(fF, 1e-12);

    if (done) { ok = true; break; }

  // Независимая проверка невязки — итерация могла «сойтись» на ложной точке
  const res = 1 / Math.sqrt(fF)
            - (4.0 / Math.pow(n, 0.75)) * Math.log10(ReMR * Math.pow(fF, 1 - n / 2))
            + 0.4 / Math.pow(n, 1.2);
  return Math.abs(res) < 1e-6 ? fF : NaN;
