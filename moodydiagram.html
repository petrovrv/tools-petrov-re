<script type="application/json" id="diagram-tool-manifest">{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision":"2026-10-16.moodydiagram-bench-rerun-1","id":"moodydiagram","file":"moodydiagram.html","listed":true,"category":"thermo","order":13,"title":{"en":"Moody Diagram & Pipe Friction","uk":"Діаграма Муді та тертя в трубах","de":"Moody-Diagramm & Rohrreibung","nl":"Moody-diagram & leidingwrijving","fr":"Diagramme de Moody & frottement en conduite","es":"Diagrama de Moody y fricción en tuberías","pl":"Diagram Moody'ego i tarcie rurowe"},"summary":{"en":"Interactive Moody diagram for internal pipe flow. Set Reynolds number and relative roughness to identify the flow regime and obtain the Darcy friction factor for pressure-loss calculations.","uk":"Інтерактивна діаграма Муді для течії в трубах. Задайте число Рейнольдса та відносну шорсткість, щоб визначити режим течії й коефіцієнт тертя Дарсі для розрахунку втрат тиску.","de":"Interaktives Moody-Diagramm für Rohrströmungen. Reynolds-Zahl und relative Rauheit vorgeben, um Strömungsbereich und Darcy-Reibungsbeiwert für Druckverlustberechnungen zu bestimmen.","nl":"Interactief Moody-diagram voor stroming in leidingen. Stel het Reynoldsgetal en de relatieve ruwheid in om het stromingsregime en de Darcy-wrijvingsfactor voor drukverliesberekeningen te bepalen.","fr":"Diagramme de Moody interactif pour les écoulements en conduite.","es":"Diagrama de Moody interactivo para flujo interno en tuberías.","pl":"Interaktywny diagram Moody'ego dla przepływu wewnątrz rurociągu. Ustaw liczbę Reynoldsa i chropowatość względną, aby zidentyfikować reżim przepływu i uzyskać współczynnik tarcia Darcy'ego do obliczeń strat ciśnienia."},"description":{"en":"Interactive Moody diagram for internal pipe flow. Set Reynolds number and relative roughness to identify the flow regime and obtain the Darcy friction factor for pressure-loss calculations.","uk":"Інтерактивна діаграма Муді для течії в трубах. Задайте число Рейнольдса та відносну шорсткість, щоб визначити режим течії й коефіцієнт тертя Дарсі для розрахунку втрат тиску.","de":"Interaktives Moody-Diagramm für Rohrströmungen. Reynolds-Zahl und relative Rauheit vorgeben, um Strömungsbereich und Darcy-Reibungsbeiwert für Druckverlustberechnungen zu bestimmen.","nl":"Interactief Moody-diagram voor stroming in leidingen. Stel het Reynoldsgetal en de relatieve ruwheid in om het stromingsregime en de Darcy-wrijvingsfactor voor drukverliesberekeningen te bepalen.","fr":"Diagramme de Moody interactif pour les écoulements en conduite. Définissez le nombre de Reynolds et la rugosité relative afin d’identifier le régime d’écoulement et le coefficient de frottement de Darcy pour le calcul des pertes de charge.","es":"Diagrama de Moody interactivo para flujo interno en tuberías. Defina el número de Reynolds y la rugosidad relativa para identificar el régimen de flujo y obtener el factor de fricción de Darcy para calcular pérdidas de presión.","pl":"Interaktywny diagram Moody'ego dla przepływu wewnątrz rurociągu. Ustaw liczbę Reynoldsa i chropowatość względną, aby zidentyfikować reżim przepływu i uzyskać współczynnik tarcia Darcy'ego do obliczeń strat ciśnienia."},"status":"benchmarked","independent_validation":false,"validation":{"basis":{"en":"145 benchmark cases driven through the page DOM: the Colebrook-White friction factor, the laminar and fully rough limits, the Darcy-Weisbach head loss, the minor and elevation terms and the Reynolds number are compared with an independent python implementation of the same standard correlations solved to machine precision, and with published verification values. The harness is the author's own; no external party has reviewed it.","uk":"145 контрольних випадків, проведених через DOM сторінки: коефіцієнт тертя Колбрука-Уайта, ламінарна та повністю шорстка границі, втрати за Дарсі-Вейсбахом, місцеві опори й геометричний член та число Рейнольдса порівняно з незалежною реалізацією тих самих стандартних кореляцій у python, розв'язаних до машинної точності, а також з опублікованими перевірочними значеннями. Випробувальний стенд належить авторові; сторонньої перевірки не проводилося.","de":"145 Prüffälle über das Seiten-DOM: der Colebrook-White-Reibungsbeiwert, die laminare und die vollrauhe Grenze, der Druckverlust nach Darcy-Weisbach, die Einzelwiderstands- und Höhenanteile sowie die Reynolds-Zahl werden mit einer unabhängigen python-Implementierung derselben Standardkorrelationen verglichen, bis auf Maschinengenauigkeit gelöst, sowie mit veröffentlichten Prüfwerten. Der Prüfstand stammt vom Autor selbst; eine Prüfung durch Dritte fand nicht statt.","nl":"145 testgevallen via de DOM van de pagina: de Colebrook-White-wrijvingsfactor, de laminaire en volledig ruwe limiet, het Darcy-Weisbach-drukverlies, de plaatselijke en hoogtetermen en het Reynoldsgetal worden vergeleken met een onafhankelijke python-implementatie van dezelfde standaardcorrelaties, opgelost tot machineprecisie, en met gepubliceerde verificatiewaarden. De testbank is van de auteur zelf; er is geen review door derden.","fr":"145 cas de test pilotés via le DOM de la page : le coefficient de frottement de Colebrook-White, les limites laminaire et pleinement rugueuse, la perte de charge de Darcy-Weisbach, les termes singuliers et de dénivelé et le nombre de Reynolds sont comparés à une implémentation python indépendante des mêmes corrélations normalisées, résolues à la précision machine, ainsi qu'à des valeurs de vérification publiées. Le banc d'essai est celui de l'auteur ; aucune revue externe n'a eu lieu.","es":"145 casos de prueba ejecutados a través del DOM de la página: el factor de fricción de Colebrook-White, los límites laminar y completamente rugoso, la pérdida de carga de Darcy-Weisbach, los términos locales y de desnivel y el número de Reynolds se comparan con una implementación independiente en python de las mismas correlaciones estándar, resueltas hasta la precisión de máquina, y con valores de verificación publicados. El banco de pruebas es del propio autor; no ha habido revisión externa.","pl":"145 przypadków testowych przeprowadzonych na stronie DOM: współczynnik tarcia Colebrooka-White'a, granice laminarne i całkowicie zgrubne, strata Darcy'ego-Weisbacha, człony minorowe i elewacji oraz liczba Reynoldsa porównano z niezależną implementacją w Pythonie tych samych standardowych korelacji rozwiązanych z precyzją maszynową oraz z opublikowanymi wartościami weryfikacyjnymi. Zestaw testowy został przygotowany przez autora; nie był recenzowany przez żadną zewnętrzną firmę."},"independent_validation":false,"benchmarks":[{"id":"colebrook-darcy-weisbach-independent","reference":"Colebrook-White solved to machine precision with scipy.optimize.brentq (cross-checked against an independent fixed-point iteration, mutual agreement 5.7e-16); Darcy-Weisbach in closed form; Prandtl smooth-pipe and von Karman fully-rough laws as limiting references; CoolProp (IAPWS-95 for water, Lemmon et al. air EOS) for every fluid property, including the properties fed into the hydraulic reference cases.","citations":["C.F. Colebrook, \"Turbulent flow in pipes, with particular reference to the transition region between the smooth and rough pipe laws\", J. Inst. Civ. Eng. 11 (1939) 133-156.","L.F. Moody, \"Friction factors for pipe flow\", Trans. ASME 66 (1944) 671-684.","IAPWS R6-95(2018) formulation for the thermodynamic properties of ordinary water substance, and IAPWS R12-08 for viscosity, as implemented in CoolProp 6.x.","W.H. McAdams / L. Prandtl smooth-pipe law 1/sqrt(f) = 2 log10(Re sqrt(f)) - 0.8 and the von Karman fully-rough law 1/sqrt(f) = -2 log10((eps/D)/3.7).","S.E. Haaland, J. Fluids Eng. 105 (1983) 89-90; P.K. Swamee & A.K. Jain, J. Hydraul. Div. ASCE 102 (1976) 657-664 - used only as discriminators."],"cases":145,"passed":145,"tolerance":"Friction factor: |dev| <= 5.05e-5 absolute (the tool prints 4 decimals). Re, rho, Q, power: 1e-3..5e-3 relative (4 significant digits printed; nu is printed to 3). Heads: 5.05e-3 m absolute (2 decimals). Pressure drops: 5.05e-4 bar absolute (3 decimals). Water properties vs CoolProp: 1% on rho / 2% on nu (the tool now declares +-0.5%, so the criterion is deliberately no tighter than twice the declared band). Air properties vs CoolProp: 1% on rho below 100 bar and 2% at or above it, matching the tool's own declared figure, with 1 percentage point added for nu because it is printed to only 3 significant digits.","run_at":"2026-10-16T09:37:01Z","artifact":"benchmarks/moodydiagram.json"}]},"limitations":{"en":"Assumes steady, fully developed, single-phase Newtonian flow in a straight conduit of constant cross-section; entrance lengths, fittings beyond the lumped sum-K term, non-circular ducts, compressible and multiphase flow require separate treatment. The friction factor is Colebrook-White (its own experimental scatter of about +-15% is not included in the displayed uncertainty band); between Re = 2300 and 4000 the tool shows a linear blend of 64/Re and Colebrook, which is a smooth interpolation, not a measurement. Liquid-water properties are the IAPWS-95 saturated-liquid table with a closed-form compressed-liquid pressure correction, validated against CoolProp/IAPWS-95 over 0-350 C and up to 300 bar to within 0.17% on density and 0.22% on kinematic viscosity; air uses a virial real-gas density and a generalised Sutherland viscosity with a density term, validated against CoolProp over -50 to 800 C and up to 300 bar to within 0.9% on density and 0.95% on viscosity. Outside those ranges, and for every other fluid in the list, the property models are correlations of varying quality - the per-fluid source note and the uncertainty band shown with each result state which one is in use. Roughness values are nominal catalogue figures and the ageing model is an empirical Colebrook-White growth law, both of which dominate the real-world error budget.","uk":"Передбачається усталений, повністю розвинений однофазний ньютонівський потік у прямому каналі сталого перерізу; довжини входу, місцеві опори понад сумарний коефіцієнт sum-K, некруглі канали, стислива та багатофазна течія потребують окремого розгляду. Коефіцієнт тертя — за Колбруком–Уайтом (власний експериментальний розкид кореляції близько ±15% не входить до показаної смуги невизначеності); між Re = 2300 і 4000 інструмент показує лінійну суміш 64/Re і Колбрука — це гладка інтерполяція, а не вимірювання. Властивості рідкої води — таблиця насиченої рідини IAPWS-95 із замкненою поправкою на тиск для стисненої води, перевірена за CoolProp/IAPWS-95 в діапазоні 0–350 °C і до 300 бар з похибкою до 0,17% за густиною і 0,22% за кінематичною в’язкістю; для повітря використано віріальну густину реального газу й узагальнену формулу Сазерленда з членом за густиною, перевірені за CoolProp від −50 до 800 °C і до 300 бар з похибкою до 0,9% за густиною і 0,95% за в’язкістю. Поза цими межами та для всіх інших середовищ зі списку моделі властивостей є кореляціями різної якості — джерело для кожного середовища та смуга невизначеності показані разом із результатом. Значення шорсткості — номінальні каталожні, а модель заростання — емпіричний закон Колбрука–Уайта; саме вони визначають основну частину реальної похибки.","de":"Vorausgesetzt wird stationäre, voll ausgebildete, einphasige newtonsche Strömung in einer geraden Leitung mit konstantem Querschnitt; Einlauflängen, Einbauten über den pauschalen Sum-K-Term hinaus, nichtkreisförmige Kanäle, kompressible und mehrphasige Strömung erfordern eine gesonderte Behandlung. Der Reibungsbeiwert folgt Colebrook-White (dessen eigene Messstreuung von etwa ±15% ist im angezeigten Unsicherheitsband nicht enthalten); zwischen Re = 2300 und 4000 zeigt das Werkzeug eine lineare Überblendung von 64/Re und Colebrook - eine glatte Interpolation, keine Messung. Die Stoffwerte flüssigen Wassers stammen aus der IAPWS-95-Tabelle der gesättigten Flüssigkeit mit einer geschlossenen Druckkorrektur für verdichtetes Wasser, gegen CoolProp/IAPWS-95 von 0 bis 350 °C und bis 300 bar auf 0,17% in der Dichte und 0,22% in der kinematischen Viskosität geprüft; Luft nutzt eine virielle Realgasdichte und einen verallgemeinerten Sutherland-Ansatz mit Dichteterm, gegen CoolProp von −50 bis 800 °C und bis 300 bar auf 0,9% in der Dichte und 0,95% in der Viskosität geprüft. Außerhalb dieser Bereiche und für alle übrigen Fluide der Liste sind die Stoffwertmodelle Korrelationen unterschiedlicher Güte - die fluidspezifische Quellenangabe und das mit jedem Ergebnis gezeigte Unsicherheitsband nennen die jeweils verwendete. Rauheitswerte sind nominelle Katalogangaben und das Alterungsmodell ist ein empirisches Colebrook-White-Wachstumsgesetz; beide dominieren das reale Fehlerbudget.","nl":"Veronderstelt stationaire, volledig ontwikkelde, eenfasige Newtoniaanse stroming in een rechte leiding met constante doorsnede; aanlooplengtes, hulpstukken buiten de samengevoegde sum-K-term, niet-ronde kanalen, samendrukbare en meerfasige stroming vragen een aparte behandeling. De wrijvingsfactor volgt Colebrook-White (de eigen meetspreiding van circa ±15% zit niet in de getoonde onzekerheidsband); tussen Re = 2300 en 4000 toont het instrument een lineaire menging van 64/Re en Colebrook - een gladde interpolatie, geen meting. De eigenschappen van vloeibaar water komen uit de IAPWS-95-tabel voor verzadigde vloeistof met een gesloten drukcorrectie voor samengeperst water, getoetst aan CoolProp/IAPWS-95 van 0 tot 350 °C en tot 300 bar op 0,17% in dichtheid en 0,22% in kinematische viscositeit; lucht gebruikt een viriale reëel-gasdichtheid en een veralgemeende Sutherland-viscositeit met dichtheidsterm, getoetst aan CoolProp van −50 tot 800 °C en tot 300 bar op 0,9% in dichtheid en 0,95% in viscositeit. Buiten die bereiken en voor alle andere vloeistoffen in de lijst zijn de eigenschapsmodellen correlaties van wisselende kwaliteit - de bronvermelding per medium en de onzekerheidsband bij elk resultaat geven aan welke wordt gebruikt. Ruwheidswaarden zijn nominale catalogusgetallen en het verouderingsmodel is een empirische Colebrook-White-groeiwet; die twee bepalen het grootste deel van de werkelijke foutmarge.","fr":"Suppose un écoulement newtonien monophasique, permanent et pleinement développé dans une conduite droite de section constante ; les longueurs d'entrée, les singularités au-delà du terme global sum-K, les conduits non circulaires, les écoulements compressibles et multiphasiques exigent un traitement séparé. Le coefficient de frottement suit Colebrook-White (sa propre dispersion expérimentale d'environ ±15 % n'est pas incluse dans la fourchette d'incertitude affichée) ; entre Re = 2300 et 4000, l'outil affiche un mélange linéaire de 64/Re et de Colebrook, c'est-à-dire une interpolation lisse et non une mesure. Les propriétés de l'eau liquide proviennent de la table du liquide saturé IAPWS-95 complétée par une correction de pression en forme close pour l'eau comprimée, vérifiée face à CoolProp/IAPWS-95 de 0 à 350 °C et jusqu'à 300 bar à 0,17 % près sur la masse volumique et 0,22 % sur la viscosité cinématique ; l'air utilise une masse volumique de gaz réel du viriel et une viscosité de Sutherland généralisée avec terme de densité, vérifiées face à CoolProp de −50 à 800 °C et jusqu'à 300 bar à 0,9 % près sur la masse volumique et 0,95 % sur la viscosité. Hors de ces domaines, et pour tous les autres fluides de la liste, les modèles de propriétés sont des corrélations de qualité variable : la note de source propre à chaque fluide et la fourchette affichée avec chaque résultat indiquent celle qui est employée. Les rugosités sont des valeurs nominales de catalogue et le modèle de vieillissement est une loi de croissance empirique de Colebrook-White ; ce sont eux qui dominent le budget d'erreur réel.","es":"Supone flujo newtoniano monofásico, estacionario y plenamente desarrollado en un conducto recto de sección constante; las longitudes de entrada, los accesorios más allá del término global sum-K, los conductos no circulares y el flujo compresible o multifásico requieren tratamiento aparte. El factor de fricción sigue a Colebrook-White (su propia dispersión experimental de aproximadamente ±15% no está incluida en la banda de incertidumbre mostrada); entre Re = 2300 y 4000 la herramienta muestra una mezcla lineal de 64/Re y Colebrook, es decir una interpolación suave y no una medición. Las propiedades del agua líquida proceden de la tabla de líquido saturado IAPWS-95 con una corrección de presión en forma cerrada para agua comprimida, contrastada con CoolProp/IAPWS-95 entre 0 y 350 °C y hasta 300 bar con un error máximo del 0,17% en densidad y del 0,22% en viscosidad cinemática; el aire emplea una densidad de gas real del virial y una viscosidad de Sutherland generalizada con término de densidad, contrastadas con CoolProp entre −50 y 800 °C y hasta 300 bar con un error máximo del 0,9% en densidad y del 0,95% en viscosidad. Fuera de esos rangos, y para el resto de fluidos de la lista, los modelos de propiedades son correlaciones de calidad variable: la nota de origen de cada fluido y la banda de incertidumbre mostrada con cada resultado indican cuál se está usando. Los valores de rugosidad son cifras nominales de catálogo y el modelo de envejecimiento es una ley de crecimiento empírica de Colebrook-White; ambos dominan el presupuesto de error real.","pl":"Zakłada ustalony, w pełni rozwinięty, jednofazowy przepływ Newtona w prostym przewodzie o stałym przekroju poprzecznym; długości wejściowe, kształtki poza skupionym członem sumy-K, kanały niekołowe, przepływ ściśliwy i wielofazowy wymagają oddzielnego traktowania. Współczynnik tarcia to Colebrook-White (jego własny rozrzut eksperymentalny wynoszący około +-15% nie jest uwzględniony w wyświetlanym paśmie niepewności); pomiędzy Re = 2300 i 4000 narzędzie pokazuje liniową mieszankę 64/Re i Colebrooka, która jest gładką interpolacją, a nie pomiarem. Właściwości ciecz-woda to tabela nasyconej cieczy IAPWS-95 z zamkniętą korektą ciśnienia sprężonej cieczy, walidowana względem CoolProp/IAPWS-95 w zakresie 0-350 C i do 300 barów z dokładnością do 0,17% gęstości i 0,22% lepkości kinematycznej; Air wykorzystuje wirialną gęstość gazu rzeczywistego i uogólnioną lepkość Sutherlanda z członem gęstości, walidowaną względem CoolProp w zakresie od -50 do 800°C i do 300 barów z dokładnością do 0,9% gęstości i 0,95% lepkości. Poza tymi zakresami, a także dla każdego innego płynu z listy, modele właściwości są korelacjami o różnej jakości – informacja o źródle dla każdego płynu i pasmo niepewności wyświetlane przy każdym wyniku wskazują, który z nich jest używany. Wartości chropowatości są nominalnymi wartościami katalogowymi, a model starzenia jest empirycznym prawem wzrostu Colebrooka-White'a, które dominują w rzeczywistym budżecie błędów."},"intended_use":["education","technical exploration","preliminary assessment"],"catalog_languages":["en","uk","de","nl","fr","es","pl"],"tool_languages":["en","uk","de","nl","fr","es","pl","ru"],"dependencies":[],"network_access":{"mode":"none"},"report":{"pdf":true,"source_attribution":true},"python_export":{"supported":true,"requires":[],"reason":"The exported script reproduces the hydraulics of the state shown (Reynolds number, Colebrook-White friction factor, Darcy-Weisbach and minor losses, elevation, pump power, uncertainty band) from the fluid properties and roughness recorded at export time; the fluid-property database itself, the non-Newtonian models and the wall-slip model are not exported."},"handoff":{"provides":["T","p","rho","Vdot","mdot","D","L","dp","Re","f_darcy"],"accepts":["T","p","Vdot"]},"state_codec":{"permalink":true,"record":"tools.petrov.re/calculation-record/v1"},"ui":{"framework":"tools.petrov.re/ui/v1","level":3}}</script>

  border:1px solid var(--line);border-radius:var(--radius-sm)}
.dgu-app .dgu-field.custom select:hover{border-color:var(--accent)}
@media(max-width:768px){.dgu-app.dgu-app .dgu-field.custom select{min-height:var(--tap)}}

/* Below md the header packs the return link, the title and the subtitle into one
   flex row, and the subtitle squeezes the h1 into a three-line column. */
@media(max-width:768px){
  .dgu-app.dgu-app .dgu-head-l{flex-wrap:wrap}
  .dgu-app.dgu-app .dgu-title{flex:1 0 100%}
  .dgu-app.dgu-app .dgu-sub{flex:1 0 100%}
}

/* ---- the stage: the Moody chart ------------------------------------------ */
/* UI_FRAMEWORK_SPEC.md 10: the drawing is built at the measured pixel size, so
   every tick label, curve label and annotation is physically --fs-small
   whatever the viewport.  Below the width at which the log-log field stops
   being readable the stage scrolls sideways instead of shrinking the type. */
.moody-chart{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.moody-chart>svg{display:block}
.grid{stroke:var(--line);stroke-width:.5}
.grid-major{stroke:var(--line);stroke-width:1}
.frame{fill:none;stroke:var(--muted);stroke-width:1}
.ax{fill:var(--muted);font-size:var(--fs-small);text-anchor:middle;font-variant-numeric:tabular-nums}
.ax.ar{text-anchor:end}
.axtitle{fill:var(--ink);font-size:var(--fs-label);font-weight:650}
.rough{fill:none;stroke-width:1.6}
.smooth{fill:none;stroke:var(--ink);stroke-width:1.8}
.laminar{fill:none;stroke:var(--ok);stroke-width:2.2}
.fullrough{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4}
.critzone{fill:var(--warn);opacity:.12}
.zonelab{fill:var(--muted);font-size:var(--fs-micro)}
.curvelab{font-size:var(--fs-micro);font-weight:650}
.curvelab.lam{fill:var(--ok)} .curvelab.sm{fill:var(--ink)} .curvelab.fr{fill:var(--muted);font-weight:500}
.epslab{font-size:var(--fs-micro);font-variant-numeric:tabular-nums}
.epshdr{fill:var(--muted);font-size:var(--fs-small);font-weight:650}
.pt{fill:var(--accent)}
.pt-ring{fill:none;stroke:var(--panel);stroke-width:3}
.ptlab{fill:var(--ink);font-size:var(--fs-label);font-weight:650;font-variant-numeric:tabular-nums;
  paint-order:stroke;stroke:var(--panel);stroke-width:3.5}
.ptlab.sub{font-size:var(--fs-small);font-weight:500;fill:var(--muted)}
.errbar{stroke:var(--accent);stroke-width:6;opacity:.28;stroke-linecap:round}
.ghost{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:.55}
.agelink{stroke:var(--accent);stroke-width:1.2;stroke-dasharray:3 3;opacity:.55}
.ghostlab{fill:var(--muted);font-size:var(--fs-micro)}
.scat{fill:var(--ink);opacity:.8;stroke:var(--panel);stroke-width:1.5}
.scatlab{fill:var(--muted);font-size:var(--fs-micro);paint-order:stroke;stroke:var(--panel);stroke-width:3}
.leader{stroke:var(--muted);stroke-width:.7;opacity:.7}
.offchart{fill:var(--bad);font-size:var(--fs-label);font-weight:650;
  paint-order:stroke;stroke:var(--panel);stroke-width:3.5}
.offmark{stroke:var(--bad);stroke-width:2.5;fill:none;stroke-linecap:round}
.classicbox{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3;opacity:.55}
.classiclab{fill:var(--muted);font-size:var(--fs-micro);font-weight:650;opacity:.8}

/* ---- rich result blocks -------------------------------------------------- */
/* These four classes are emitted by lossTable(), sourcesBlock() and render(),
   and the print sheet reuses the same markup, so they keep their names.  On
   screen they are styled to match .dgu-table and .dgu-hint exactly. */
.dgu-r-results .tbl{width:100%;border-collapse:collapse;font-size:var(--fs-label)}
.dgu-r-results .tbl td,.dgu-r-results .tbl th{padding:var(--sp-1) var(--sp-2);
  border-bottom:1px solid var(--line);text-align:left}
.dgu-r-results .tbl td:last-child,.dgu-r-results .tbl th:last-child{text-align:right;
  font-variant-numeric:tabular-nums}
.dgu-r-results .tbl tr.sum td{font-weight:650}
.dgu-r-results .tbl.small{font-size:var(--fs-micro)}
.dgu-r-results .tbl.small td,.dgu-r-results .tbl.small th{padding:var(--sp-1);text-align:right}
.dgu-r-results .tbl.small td:first-child,.dgu-r-results .tbl.small th:first-child{text-align:left}
.dgu-r-results .tbl-wrap{overflow-x:auto;min-width:0}

.dgu-r-results .band{padding:var(--sp-3);border-radius:var(--radius-sm);
  background:var(--weak);border:1px solid var(--line)}
.dgu-r-results .band-t{font:650 var(--fs-micro)/1.4 var(--font);text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted)}
.dgu-r-results .band-v{margin:2px 0;color:var(--accent)}
.dgu-r-results .band-d{font-size:var(--fs-small);color:var(--muted);line-height:1.45}

.dgu-r-results .alert{padding:var(--sp-2) var(--sp-3);border-radius:var(--radius-sm);
  font-size:var(--fs-small);line-height:1.45;background:var(--panel-2);
  border:1px solid var(--line);border-left:3px solid var(--muted);color:var(--ink)}
.dgu-r-results .alert b{display:block;font:650 var(--fs-micro)/1.4 var(--font);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;color:var(--muted)}
.dgu-r-results .alert.critical{border-left-color:var(--bad);background:var(--bad-bg)}
.dgu-r-results .alert.critical b{color:var(--bad)}
.dgu-r-results .alert.warning{border-left-color:var(--warn);background:var(--warn-bg)}
.dgu-r-results .alert.warning b{color:var(--warn)}

.dgu-r-results .notes{margin:0;padding-left:var(--sp-5);font-size:var(--fs-small);
  color:var(--muted);line-height:1.5}
.dgu-r-results .notes li{margin:var(--sp-1) 0}
.dgu-r-results .src{font-size:var(--fs-small);color:var(--muted);line-height:1.5}
.dgu-r-results .src>div{margin:var(--sp-1) 0}
.dgu-r-results .src b{color:var(--ink)}
.dgu-r-results .fnote{color:var(--muted)}
.dgu-r-results .sect{font:650 var(--fs-section)/1.4 var(--font);text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);margin:var(--sp-2) 0 0}
.dgu-r-results .reqsub{font-size:var(--fs-small);color:var(--muted);line-height:1.5}
.dgu-r-results sup{font-size:.75em}

/* The result labels carry mathematical symbols whose case is meaningful — f, ρ,
   ν, k⁺ — and text-transform:uppercase renders them F, Ρ, Ν, K, which read as
   different quantities.  Weight, size, colour and letter-spacing stay the
   framework's; only the case transform is dropped.  Upstream this argues for a
   tile flag rather than an unconditional transform. */
.dgu-app .dgu-r-results .dgu-tile-l,
.dgu-app .dgu-r-strip .dgu-strip-l{text-transform:none}

/* ---- print — §21: the framework owns the sheet ---------------------------

   ~30 rules of .rep-* typography for it, 1 388 bytes of @media print, and a
   position:fixed #dgc-attrib block stamping Diagram.report.attribution() on
   every page by hand. The comment above it said "the shared bar's Report is a
   different, shorter artefact and does not carry the chart. Deleting this sheet
   would be a capability loss." That was true, and the answer was to stop it
   being true: the chart, the loss table and the uncertainty band are now
   sections of the record's own report (dgcSections), so the record IS the
   sheet. Everything here is deleted, including the attribution block — the
   framework now prints the same string as a running footer, and adds the page
   number this one could not.

'mat.drawn.note': 'Effectively hydraulically smooth over most of the Re range. The ageing rate is taken as that of non-ferrous metals — drawn tubing is usually copper or aluminium; for drawn carbon steel use the commercial steel row.',
'mat.steel.note': 'The reference material of the classic diagram. It ages noticeably — this is where the age slider does its real work.',
'mat.stainless.note': 'Practically does not age in water — the age slider changes almost nothing.',
'mat.electropol.note': 'The smooth-pipe limit. Roughness affects nothing at all — the point sits on the lower envelope.',
'mat.titanium.note': 'Commercially pure titanium is limited to about 350 °C by gas pickup (ASME B31.3 stops allowable stresses at 316 °C). Hydraulically indistinguishable from stainless. It is chosen for corrosion resistance, not smoothness.',
'mat.inconel.note': 'Hydraulically the same as stainless. The point of the alloy is fluid compatibility and heat resistance.',
'mat.ductile.note': 'The lining sets the roughness, not the metal. In exchange, the lining barely ages.',
'mat.riveted.note': 'The roughest entry on Moody\'s original 1944 chart.',
'mat.hdpe.note': 'Smooth but compliant: the real inner diameter after ovalisation matters more than the roughness.',
'mat.glass.note': 'The practical benchmark for a smooth wall. Nikuradse, contrary to common belief, worked with drawn brass pipes coated with sand rather than with glass — but the lower envelope of the diagram is precisely the smooth-pipe limit.',
'mat.woodstave.note': 'An entry from Moody\'s original chart. Wooden penstocks served hydropower into the mid-twentieth century, and a few still stand.',
'mat.corr_ss.note': 'The resistance is created by the shape of the corrugation, not by wall roughness. The equivalent ε is a fitting quantity with no physical meaning as a roughness.',
'mat.corr_pe.note': 'The same again: this is shape, not roughness.',
'mat.scale.note': 'In a fouled pipe the water no longer touches the metal: steel and cast iron become hydraulically indistinguishable. The dominant effect is not roughness but loss of bore.',
'mat.tubercle.note': 'The classic condition of old steel and cast-iron mains: tubercles millimetres high.',
'mat.biofilm.note': 'Cooling water, seawater, condensers.',

// ---- incompatibility ----------------------------------------------------
'inc.0': 'Dry UF₆ forms a passivating fluoride film on carbon steel, and the 30B, 48X and 48Y transport cylinders are made of carbon steel to ANSI N14.1. The condition is dryness: traces of moisture give HF, and then the steel fails fast. In the cascades themselves nickel, Monel and PTFE are used.',
'inc.1': 'Cast iron and lined or galvanised pipe are not used for UF₆: zinc reacts, and linings and the graphite in cast iron hold moisture. The standard materials are nickel, Monel, copper, aluminium and PTFE.',
'inc.2': 'UF₆ destroys these materials or reacts with traces of moisture in them. Cascades use PTFE, nickel and Monel.',
'inc.3': 'Fluoride melts require Hastelloy N — the alloy was developed at ORNL specifically for molten salt reactors. Stainless does not survive in FLiBe.',
'inc.4': 'Liquid lead dissolves nickel and chromium out of steel. Oxygen-controlled or alumina-forming steels (ODS/FeCrAl) are required.',
'inc.5': 'LBE dissolves the constituents of steel. Oxygen control and resistant steels are required.',
'inc.6': 'Stainless works in lead only with the oxygen concentration held in a narrow window and below ~500 °C.',
'inc.7': 'The same: stainless survives in LBE only under oxygen control.',
'inc.8': 'Sodium is incompatible with copper and aluminium at operating temperatures.',
'inc.9': 'Molten nitrate destroys aluminium and copper.',
'inc.10': 'Fresh concrete is abrasive: delivery lines are made of thick-walled wear-resistant steel, and hardened steel on the bends. Thin-walled and soft pipes wear through in one or two jobs.',
'inc.11': 'Abrasive wall wear in a concrete line is fast, especially on bends. Wall thickness is monitored ultrasonically — a service-life question, not a hydraulic one.',
'inc.12': 'The same abrasiveness: wear-resistant steel is required.',
'inc.13': 'Aromatics in crude swell and soften PVC — strength drops and the geometry distorts. Petroleum products need steel or PVDF.',
'inc.14': 'Petrol swells and softens PVC until it loses its load-bearing capacity. Steel or a fluoropolymer is required.',
'inc.15': 'HDPE is the standard material for fuel tanks, but petrol diffuses through it appreciably. Fuel service uses surface-fluorinated or barrier-layer HDPE, not plain.',
'inc.16': 'PVC and PEX are not intended for diesel fuel.',

'foot.calc': 'The friction factor comes from the Colebrook–White equation, solved iteratively to machine precision; the laminar branch is exact (f = 64/Re); the regime follows the roughness Reynolds number k⁺ = (ε/D)·Re·√(f/8). The critical zone is blended from local values at the same Re, so the Newtonian and non-Newtonian branches agree exactly at n = 1. Non-Newtonian fluids use the generalised Metzner–Reed Reynolds number with the exact laminar solution of Herschel–Bulkley or Casson, and the Dodge–Metzner turbulent branch; where the correlation has no root, a refusal is shown rather than a plausible substitute. Concrete mixes are computed from the Kaplan tribological model of the wall lubrication layer: neither bulk rheology nor roughness enters the pressure drop.',
'foot.propT': 'Fluid properties.',
'foot.prop': 'Water and steam — saturation line per IAPWS (the pressure dependence of liquid water is not modelled; above 250 °C and 150 bar that is up to 9%). Sodium — Fink–Leibowitz; lead and LBE — OECD-NEA handbook 2015; FLiBe — Cantor correlation, agreeing with the IUPAC 2019 reference correlation to within 2% at 600 °C. CO₂ — Peng–Robinson with root selection by fugacity against the Wagner saturation curve, viscosity by Fenghour–Wakeham–Vesovic; in the dense phase and near the critical point the error is flagged in the interface itself. UF₆ — GAT-280. Natural gas — Z by Papay, viscosity by Lee–Gonzalez–Eakin. Sugar syrup — NBS Circular 440.',
'foot.limT': 'What the tool does not do.',
'foot.lim': 'The ±15% uncertainty of the Colebrook correlation itself is not part of the band and must be added on top. The rate at which a pipe fouls, α, is by Colebrook and White a property of the water rather than the metal: Lamont\'s classification spans a factor of thirty, which is why aggressiveness is a separate field and the mechanism is switched off for non-aqueous fluids. The tool also shows its own limits of applicability: compressibility, Mach number, Knudsen number with slip, transitional and free-molecular regimes distinguished, phase transitions, departure from the Colebrook ε/D range, and erosion and sanitary velocity limits.',
'foot.final': 'For design work, check against primary sources — especially for near-critical and dense CO₂, for air and gases above 100 bar, and for food and concrete mixes, where the spread between batches is wider than any model.',

'fl.helium.note': 'HTGR/GFR. De lage dichtheid dwingt tot 50–80 m/s, en daarom vreet het rondpompen procentpunten van het thermisch vermogen op.',
'fl.co2.note': 'AGR (~40 bar) en superkritische Brayton-kringlopen (200+ bar). Bij het kritieke punt, 31 °C / 73.8 bar, veranderen de eigenschappen abrupt.',
'fl.sodium.note': 'Snelle natriumreactoren. ν ≈ 2.7·10⁻⁷ m²/s — in Reynolds-termen is natrium dunner dan water, en het punt loopt diep het volledig ruwe gebied in.',
'fl.lead.note': 'Loodgekoelde snelle reactoren. ρ ≈ 10 500 kg/m³ — de drukval is enorm, zelfs bij lage snelheden.',
'fl.lbe.note': 'SVBR en de reactoren van de onderzeeboten van de Alfa-klasse. Eutecticum 44.5% Pb / 55.5% Bi, smeltpunt 125 °C.',
'fl.flibe.note': 'Gesmoltenzoutreactoren. Bij 600 °C is de dynamische viscositeit ongeveer acht keer die van water en de kinematische ongeveer vier keer: anders dan de vloeibare metalen is het zout dik. Smeltpunt 459 °C — bevriezen in het circuit is het eerste probleem, niet het tiende.',
'fl.solarsalt.note': 'Warmteopslag in zonnecentrales en secundaire circuits. Boven ~590 °C ontleden de nitraten.',
'fl.uf6.note': 'Verrijkingscascades. M = 352 g/mol — een gas met de kinematische viscositeit van een vloeistof. Bij atmosferische druk bestaat er helemaal geen vloeibare fase: alleen sublimatie.',
'fl.hfo.note': 'Het klassieke laminaire geval. Zonder verwarming tot 100–130 °C is het helemaal niet te verpompen.',
'fl.natgas.note': 'Bij transportdrukken van 55–75 bar zakt de compressibiliteitsfactor Z naar 0.85 — het ideale gas zit er 15% naast.',
'fl.syrup.note': 'Newtons, maar de viscositeit daalt bij verwarming ordes van grootte. Een uitstekend laminair voorbeeld.',
'fl.honey.note': 'De spreiding tussen soorten en partijen is een veelvoud. Het op de procent uitrekenen is zinloos.',
'fl.ketchup.note': 'Het heeft een vloeigrens: onder een drempeldrukval stroomt het helemaal niet, in plaats van langzaam.',
'fl.chocolate.note': 'Casson leidde zijn vergelijking in 1959 af voor pigmentsuspensies in olie — drukinkten; pas later werd ze op chocolade toegepast. Maar het is als chocolademethode dat ze is blijven hangen: tot 2000 was dit de officiële IOCCC-methode.',
'fl.concrete.note': 'Beton in een leiding stroomt niet als een vloeistof. Het beweegt als een plug, en alle afschuiving is geconcentreerd in een laag cementpasta van 1–3 mm tegen de wand. De reologie van die laag bepaalt de drukval — niet de bulkreologie en niet de wandruwheid.',
'fl.scc.note': 'De vloeigrens ligt een orde van grootte lager dan bij een gewone specie — het vloeit vanzelf uit, maar de viscositeit blijft hoog. De wandslip gaat er niet van weg.',
'fl.mud.note': 'Het klassieke Bingham-medium van de olie-industrie — het model van Metzner–Reed is erop beproefd. De vloeigrens is hier nuttig: hij houdt boorgruis in suspensie zodra de circulatie stilvalt.',

'fl.water.src': 'Tabel voor verzadigde vloeistof uit IAPWS-95 plus een gesloten drukcorrectie voor samengeperst water (Tait-achtige derdegraadsterm in p − p_s, per tabeltemperatuur op IAPWS-95 gefit). Getoetst aan CoolProp/IAPWS-95 over het hele bereik van dit instrument (0–350 °C, p_s–300 bar): Δρ ≤ 0.17%, Δμ ≤ 0.21%, Δν ≤ 0.22%. Opgegeven band: ρ en μ ±0.5% (±1% boven 300 °C).',
'fl.steam.src': 'ρ — ideaal gas met een tweede-viriaalcorrectie gefit op IAPWS; μ — lineaire fit op tabellen (±2%).',
'fl.air.src': 'ρ — viriaalvergelijking Z = 1 + B(T)n + C(T)n², coëfficiënten gefit op de luchttoestandsvergelijking van Lemmon e.a. (2000) over −50…800 °C en 0…300 bar; μ — veralgemeende Sutherland A·T^k/(T+S) voor het verdunde gas (de klassieke k = 1,5, S = 110,4 K zit bij 800 °C 4% te laag) plus een dichtheidsterm. Getoetst aan CoolProp: Δρ ≤ 0,9%, Δμ ≤ 0,95%, Δν ≤ 0,6% over dat hele bereik.',
'fl.helium.src': 'μ ~ T^0.7 (±3%); ρ — ideaal gas, Z ≈ 1.03 bij 70 bar.',
'fl.co2.src': 'ρ — Peng–Robinson met wortelkeuze op fugaciteit tegen de verzadigingskromme van Wagner; μ — Fenghour–Wakeham–Vesovic.',
'fl.sodium.src': 'Fink–Leibowitz / OECD-NEA natriumhandboek.',

'fl.uf6.src': 'GAT-280 (DeWitt, Uranium Hexafluoride: A Survey): sublimatiekromme log₁₀P[mmHg] = 10.648 − 2559.5/T, verdampingskromme 6.99464 − 1126.288/(t+221.963), vloeibare ρ en gasvormige η uit dezelfde bron. Tripelpunt 64.05 °C / 1.517 bar, kritiek punt 230.2 °C / 46.1 bar.',

'mat.drawn.note': 'Over vrijwel het hele Re-bereik feitelijk hydraulisch glad. Als verouderingssnelheid is die van non-ferrometalen genomen — getrokken buis is meestal koper of aluminium; gebruik voor getrokken koolstofstaal de regel handelsstaal.',
'mat.steel.note': 'Het referentiemateriaal van het klassieke diagram. Het veroudert merkbaar — hier doet de leeftijdsregelaar zijn eigenlijke werk.',
'mat.stainless.note': 'Veroudert in water praktisch niet — de leeftijdsregelaar verandert vrijwel niets.',
'mat.electropol.note': 'De limiet van de gladde leiding. De ruwheid heeft nergens invloed op — het punt ligt op de onderste omhullende.',
'mat.titanium.note': 'Commercieel zuiver titaan is door gasopname begrensd tot ongeveer 350 °C (ASME B31.3 stopt met toelaatbare spanningen bij 316 °C). Hydraulisch niet te onderscheiden van roestvast staal. Het wordt gekozen om zijn corrosiebestendigheid, niet om zijn gladheid.',
'mat.inconel.note': 'Hydraulisch hetzelfde als roestvast staal. Het punt van de legering is mediumverdraagzaamheid en hittebestendigheid.',
'mat.ductile.note': 'De bekleding bepaalt de ruwheid, niet het metaal. Daar staat tegenover dat de bekleding nauwelijks veroudert.',
'mat.riveted.note': 'De ruwste vermelding op de oorspronkelijke grafiek van Moody uit 1944.',
'mat.hdpe.note': 'Glad maar meegevend: de werkelijke binnendiameter na ovalisatie telt zwaarder dan de ruwheid.',
'mat.glass.note': 'De praktische maatstaf voor een gladde wand. Nikuradse werkte, anders dan vaak wordt gedacht, met getrokken messing buizen die met zand waren beplakt en niet met glas — maar de onderste omhullende van het diagram is juist de limiet van de gladde leiding.',
'mat.woodstave.note': 'Een vermelding van de oorspronkelijke grafiek van Moody. Houten drukleidingen dienden de waterkracht tot in het midden van de twintigste eeuw, en enkele staan er nog.',
'mat.corr_ss.note': 'De weerstand wordt veroorzaakt door de vorm van de golving, niet door de wandruwheid. De equivalente ε is een fitgrootheid zonder fysische betekenis als ruwheid.',

'reg.slip.d': 'Le matériau se déplace en bouchon ; tout le cisaillement est concentré dans une couche de lubrification à la paroi. Ni la rhéologie de masse ni la rugosité de la conduite n\'interviennent dans la perte de charge — c\'est la tribologie de cette couche qui la fixe. Le point sur le diagramme n\'est qu\'indicatif.',

'w.compressHigh': 'La perte représente {pct} % de la pression d\'entrée. Le gaz se détend le long de la conduite et accélère — un point unique sur le diagramme de Moody ne décrit plus le problème. L\'équation d\'écoulement compressible isotherme est nécessaire.',
'w.compressMid': 'La perte représente {pct} % de la pression d\'entrée — à la limite de l\'approximation incompressible.',
'w.mach': 'Nombre de Mach {ma} : la compressibilité est déjà significative{choke}.',
'w.machChoke': ', proche du blocage sonique',
'w.machNote': 'Nombre de Mach {ma} (vitesse du son {c} m/s)',
'w.knHead': 'Kn = {kn} (libre parcours moyen {lambda} µm pour un diamètre de {d} mm). ',
'w.knFree': 'Régime moléculaire libre : les molécules ne se heurtent pratiquement jamais entre elles, et les notions de viscosité et de coefficient de frottement perdent leur sens. C\'est exactement le régime qui règne dans les pores d\'une barrière de diffusion gazeuse — le transport y suit Knudsen et la loi de Graham, non l\'hydraulique.',
'w.knTrans': 'Régime de transition entre milieu continu et écoulement moléculaire libre. Les équations de Navier–Stokes ne fonctionnent plus ici, quelle que soit la condition aux limites ; le diagramme de Moody ne s\'applique pas.',
'w.knSlip': 'Régime de glissement : le milieu continu décrit encore l\'écoulement, mais le gaz glisse déjà le long de la paroi et la condition d\'adhérence habituelle tombe en défaut. Le débit est supérieur à celui que donne le diagramme de Moody ; une correction de glissement est obligatoire.',
'w.knOk': 'Kn = {kn} — le milieu continu reste valable',
'w.vMax': '{v} m/s dépasse la limite de conception de {lim} m/s — {why}. Accélérer l\'écoulement pour réduire le diamètre n\'est pas une option ici.',
'w.cip': '{v} m/s est en dessous de 1.5 m/s — le nettoyage en place (NEP) n\'atteindra pas le régime turbulent et la conduite ne sera pas rincée.',
'w.form': 'Dans une conduite annelée, la résistance est créée par la forme et non par la rugosité de la paroi. L\'ε équivalent est un paramètre d\'ajustement, et la corrélation de Colebrook ne fonctionne ici qu\'approximativement.',
'w.crit': 'Zone critique Re ≈ {lo}–{hi} : aucune corrélation fiable n\'existe et l\'écoulement peut basculer entre laminaire et turbulent. Personne n\'a de valeur calculée ici — le point n\'est qu\'indicatif.',
'w.nofit': 'Pour cet indice d\'écoulement, la corrélation de Dodge–Metzner n\'a pas de racine : il n\'existe donc aucun coefficient de frottement. Auparavant un nombre plausible était renvoyé dans ce cas ; désormais l\'échec est affiché explicitement.',
'w.epsRange': 'La rugosité relative ε/D = {e} sort du domaine sur lequel Colebrook a été construit (jusqu\'à ~0.05). La valeur provient d\'une extrapolation et surestime sa propre fiabilité — à cette rugosité, la conduite tient davantage de l\'annelure que du tube.',
'w.noflowSpeed': 'La vitesse spécifiée est inatteignable.',
'w.yieldNote': 'Seuil d\'écoulement {tau0} Pa : pour mettre le matériau en mouvement il faut un gradient d\'au moins {grad} Pa/m, soit {bar} bar sur {len} m — indépendamment du débit.',
'w.plug': 'La contrainte de cisaillement à la paroi dépasse à peine le seuil d\'écoulement : un bouchon non cisaillé se déplace au centre de la conduite et le profil de vitesse est quasi plat.',
'w.nonNewt': 'Fluide non newtonien : nombre de Reynolds généralisé de Metzner–Reed, branche turbulente de Dodge–Metzner (conduite lisse). La rugosité n\'est pas prise en compte dans cette branche — il n\'existe pas de corrélation généralement admise pour les conduites rugueuses avec des fluides non newtoniens.',
'w.normalFlow': 'Débit donné aux conditions normales : {q} Nm³/h = {act} m³/h réels à {t} °C et {p} bar',
'w.slipNote': 'Couche de lubrification : dP/L = (4/D)·({a}·v + {b}) = {grad} bar/m. La rhéologie de masse n\'intervient pas du tout dans ce résultat.',
'w.slipMinor': 'Les pertes singulières dans le pompage du béton se traitent en longueur équivalente : un coude à 90° ≈ 3 m de conduite droite, un flexible ≈ 3× sa propre longueur.',
'w.depositNote': 'Une couche de {th} mm des deux côtés : diamètre intérieur {d0} → {d} mm',
'w.matTemp': '{mat} : une température de service de {t} °C dépasse la limite de {max} °C. Le matériau est inapplicable ici, quelle que soit l\'hydraulique.',
'w.foodMat': 'Un fluide alimentaire exige une surface sanitaire : inox poli, PTFE, PVDF ou verre. L\'acier ordinaire et les plastiques ne se nettoient pas en place.',

// ---- notes sur les fluides ----------------------------------------------
'fl.helium.note': 'HTGR/GFR. La faible masse volumique impose 50–80 m/s, ce qui explique que le pompage consomme des points de pourcentage de la puissance thermique.',
'fl.co2.note': 'AGR (~40 bar) et cycles de Brayton supercritiques (200+ bar). Au point critique, 31 °C / 73.8 bar, les propriétés changent brutalement.',
'fl.sodium.note': 'Réacteurs à neutrons rapides au sodium. ν ≈ 2.7·10⁻⁷ m²/s — en termes de Reynolds, le sodium est plus fluide que l\'eau, et le point s\'enfonce profondément dans le régime turbulent rugueux.',
'fl.lead.note': 'Réacteurs à neutrons rapides refroidis au plomb. ρ ≈ 10 500 kg/m³ — la perte de charge est énorme, même à faible vitesse.',
'fl.lbe.note': 'SVBR et réacteurs des sous-marins de la classe Alfa. Eutectique 44.5 % Pb / 55.5 % Bi, point de fusion 125 °C.',
'fl.flibe.note': 'Réacteurs à sels fondus. À 600 °C la viscosité dynamique vaut environ huit fois celle de l\'eau et la viscosité cinématique environ quatre fois : contrairement aux métaux liquides, le sel est épais. Point de fusion 459 °C — le gel dans la boucle est le premier problème, pas le dixième.',
'fl.solarsalt.note': 'Stockage thermique des centrales solaires et boucles secondaires. Au-delà de ~590 °C les nitrates se décomposent.',
'fl.uf6.note': 'Cascades d\'enrichissement. M = 352 g/mol — un gaz doté de la viscosité cinématique d\'un liquide. À la pression atmosphérique il n\'existe aucune phase liquide : uniquement la sublimation.',
'fl.hfo.note': 'Le cas laminaire classique. Sans chauffage à 100–130 °C, il est tout simplement impompable.',
'fl.natgas.note': 'Aux pressions de transport de 55–75 bar, le facteur de compressibilité Z tombe à 0.85 — le gaz parfait se trompe de 15 %.',
'fl.syrup.note': 'Newtonien, mais la viscosité chute de plusieurs ordres de grandeur au chauffage. Un excellent cas laminaire.',
'fl.honey.note': 'La dispersion entre variétés et entre lots est d\'un facteur plusieurs. Le calculer au pour-cent près n\'a aucun sens.',
'fl.ketchup.note': 'Il possède un seuil d\'écoulement : en deçà d\'une perte de charge seuil il ne s\'écoule pas du tout, plutôt que de s\'écouler lentement.',
'fl.chocolate.note': 'Casson a établi son équation en 1959 pour des suspensions de pigments dans l\'huile — des encres d\'imprimerie ; son application au chocolat est venue plus tard. Mais c\'est comme méthode chocolatière qu\'elle est restée : jusqu\'en 2000, c\'était la méthode officielle de l\'IOCCC.',
'fl.concrete.note': 'Le béton dans une conduite ne s\'écoule pas comme un liquide. Il se déplace en bouchon, et tout le cisaillement se concentre dans une couche de 1–3 mm de pâte de ciment à la paroi. C\'est la rhéologie de cette couche qui fixe la perte de charge — ni la rhéologie de masse, ni la rugosité de la paroi.',
'fl.scc.note': 'Le seuil d\'écoulement est d\'un ordre de grandeur inférieur à celui d\'un mélange ordinaire — il s\'étale de lui-même, mais la viscosité reste élevée. Le glissement à la paroi, lui, ne disparaît pas.',
'fl.mud.note': 'Le fluide de Bingham classique de l\'industrie pétrolière — le modèle de Metzner–Reed y a fait ses preuves. Le seuil d\'écoulement est utile ici : il maintient les déblais en suspension quand la circulation s\'arrête.',

'fl.water.src': 'Table du liquide saturé IAPWS-95 complétée par une correction de pression en forme close pour l\'eau comprimée (cubique de type Tait en p − p_s, ajustée sur IAPWS-95 à chaque température de la table). Vérifiée face à CoolProp/IAPWS-95 sur tout le domaine de l\'outil (0–350 °C, p_s–300 bar) : Δρ ≤ 0,17 %, Δμ ≤ 0,21 %, Δν ≤ 0,22 %. Fourchette annoncée : ρ et μ ±0,5 % (±1 % au-dessus de 300 °C).',
'fl.steam.src': 'ρ — gaz parfait avec correction du second coefficient du viriel calée sur IAPWS ; μ — ajustement linéaire des tables (±2 %).',
'fl.air.src': 'ρ — équation du viriel Z = 1 + B(T)n + C(T)n², coefficients ajustés sur l\'équation d\'état de l\'air de Lemmon et al. (2000) entre −50 et 800 °C et 0 à 300 bar ; μ — Sutherland généralisé A·T^k/(T+S) pour le gaz dilué (les valeurs classiques k = 1,5, S = 110,4 K sous-estiment de 4 % dès 800 °C) plus un terme de densité. Vérifié face à CoolProp : Δρ ≤ 0,9 %, Δμ ≤ 0,95 %, Δν ≤ 0,6 % sur tout ce domaine.',
'fl.helium.src': 'μ ~ T^0.7 (±3 %) ; ρ — gaz parfait, Z ≈ 1.03 à 70 bar.',
'fl.co2.src': 'ρ — Peng–Robinson avec sélection de la racine par fugacité contre la courbe de saturation de Wagner ; μ — Fenghour–Wakeham–Vesovic.',
'fl.sodium.src': 'Manuel du sodium Fink–Leibowitz / OECD-NEA.',
'fl.lead.src': 'OECD-NEA Handbook on Lead and Lead-Bismuth Eutectic (2015), corrélations de Sobolev.',
'fl.lbe.src': 'OECD-NEA Handbook on Lead and Lead-Bismuth Eutectic (2015).',
'fl.flibe.src': 'Corrélation de Cantor ; concorde à 2 % près avec la corrélation de référence IUPAC/NIST (2019) à 600 °C. La dispersion de la littérature sur la viscosité du FLiBe atteint ±30 %.',
'fl.solarsalt.src': 'Corrélations standard pour le mélange 60 % NaNO₃ / 40 % KNO₃.',
'fl.uf6.src': 'GAT-280 (DeWitt, Uranium Hexafluoride: A Survey) : courbe de sublimation log₁₀P[mmHg] = 10.648 − 2559.5/T, courbe de vaporisation 6.99464 − 1126.288/(t+221.963), ρ du liquide et η du gaz de la même source. Point triple 64.05 °C / 1.517 bar, point critique 230.2 °C / 46.1 bar.',
'fl.crude.src': 'Brut typique ~32° API ; les propriétés dépendent fortement du gisement.',
'fl.diesel.src': 'Gazole d\'été, valeurs typiques (ν = 2.0–4.5 cSt à 40 °C selon EN 590).',
'fl.gasoline.src': 'Valeurs typiques pour l\'essence automobile.',
'fl.hfo.src': 'Fioul lourd, 380 cSt à 50 °C, extrapolé par Walther (ASTM D341).',
'fl.propane.src': 'Liquide saturé ; pression de saturation par Antoine.',
'fl.butane.src': 'Liquide saturé ; pression de saturation par Antoine.',
'fl.natgas.src': 'Composition à dominante méthane ; Z par la corrélation de Papay (Standing–Katz), viscosité par Lee–Gonzalez–Eakin.',
'fl.vegoil.src': 'Tournesol/colza ; ν = 65 cSt à 20 °C.',
'fl.milk.src': 'Lait entier, 3.5 % de matière grasse.',
'fl.syrup.src': 'Solution de saccharose à 70 % en masse, viscosités d\'après NBS Circular 440 (Swindells et al.).',
'fl.honey.src': 'Miel toutes fleurs ~17 % d\'humidité ; dépendance d\'Arrhenius, Ea ≈ 90 kJ/mol.',
'fl.beer.src': 'Proche de l\'eau, avec une correction pour l\'extrait.',
'fl.ketchup.src': 'Herschel–Bulkley : τ₀ ≈ 32 Pa, K ≈ 18 Pa·sⁿ, n ≈ 0.28 (ketchup de tomate).',
'fl.mayo.src': 'Herschel–Bulkley : τ₀ ≈ 90 Pa, K ≈ 25 Pa·sⁿ, n ≈ 0.35 (très dépendant de la recette).',
'fl.yogurt.src': 'Herschel–Bulkley : τ₀ ≈ 20 Pa, K ≈ 6 Pa·sⁿ, n ≈ 0.35 (yaourt brassé).',
'fl.chocolate.src': 'Modèle de Casson : τ₀ ≈ 12 Pa, μ_C ≈ 2.0 Pa·s.',
'fl.concrete.src': 'Bingham : τ₀ ≈ 800 Pa, viscosité plastique ≈ 40 Pa·s (mélange à fort affaissement). Perte de charge issue du modèle tribologique de Kaplan ; les constantes de la couche de lubrification sont calées sur des mesures en DN125 (~0.14 bar/m).',
'fl.scc.src': 'Bingham : τ₀ ≈ 50 Pa, viscosité plastique ≈ 25 Pa·s ; tribologie d\'après Feys et Kaplan.',
'fl.mud.src': 'Boue bentonitique à 1200 kg/m³ : τ₀ ≈ 8 Pa, viscosité plastique ≈ 15 cP (la plage publiée pour les boues non alourdies va de 1 à 20 cP).',
'fl.applesauce.src': 'Loi de puissance : K ≈ 6 Pa·sⁿ, n ≈ 0.35 (purée de pommes).',

// ---- notes sur les matériaux --------------------------------------------
'mat.drawn.note': 'Pratiquement hydrauliquement lisse sur l\'essentiel de la plage de Re. La vitesse de vieillissement retenue est celle des métaux non ferreux — un tube étiré est en général en cuivre ou en aluminium ; pour l\'acier au carbone étiré, prenez la ligne « acier du commerce ».',
'mat.steel.note': 'Le matériau de référence du diagramme classique. Il vieillit sensiblement — c\'est là que le curseur d\'âge fait vraiment son travail.',
'mat.stainless.note': 'Ne vieillit pratiquement pas dans l\'eau — le curseur d\'âge ne change presque rien.',
'mat.electropol.note': 'La limite du tube lisse. La rugosité n\'influe sur rien du tout — le point se pose sur l\'enveloppe inférieure.',
'mat.titanium.note': 'Le titane commercialement pur est limité à environ 350 °C par la reprise de gaz (ASME B31.3 arrête les contraintes admissibles à 316 °C). Hydrauliquement indiscernable de l\'inox. On le choisit pour sa tenue à la corrosion, pas pour son lissé.',
'mat.inconel.note': 'Hydrauliquement identique à l\'inox. L\'intérêt de l\'alliage est la compatibilité avec le fluide et la tenue en température.',
'mat.ductile.note': 'C\'est le revêtement qui fixe la rugosité, pas le métal. En contrepartie, le revêtement ne vieillit quasiment pas.',
'mat.riveted.note': 'L\'entrée la plus rugueuse de l\'abaque original de Moody, en 1944.',
'mat.hdpe.note': 'Lisse mais souple : le diamètre intérieur réel après ovalisation compte davantage que la rugosité.',
'mat.glass.note': 'La référence pratique de la paroi lisse. Nikuradse, contrairement à une idée reçue, travaillait sur des tubes de laiton étiré revêtus de sable, et non sur du verre — mais l\'enveloppe inférieure du diagramme est précisément la limite du tube lisse.',
'mat.woodstave.note': 'Une entrée de l\'abaque original de Moody. Les conduites forcées en bois ont servi l\'hydroélectricité jusqu\'au milieu du XXᵉ siècle, et quelques-unes tiennent encore.',
'mat.corr_ss.note': 'La résistance est créée par la forme de l\'annelure, non par la rugosité de la paroi. L\'ε équivalent est une grandeur d\'ajustement, sans signification physique en tant que rugosité.',
'mat.corr_pe.note': 'Même chose ici : c\'est de la forme, pas de la rugosité.',
'mat.scale.note': 'Dans une conduite entartrée, l\'eau ne touche plus le métal : acier et fonte deviennent hydrauliquement indiscernables. L\'effet dominant n\'est pas la rugosité, mais la perte de diamètre intérieur.',
'mat.tubercle.note': 'L\'état classique des vieilles conduites d\'adduction en acier et en fonte : des tubercules de plusieurs millimètres de haut.',
'mat.biofilm.note': 'Eau de refroidissement, eau de mer, condenseurs.',

// ---- incompatibilités ---------------------------------------------------
'inc.0': 'L\'UF₆ sec forme un film de fluorure passivant sur l\'acier au carbone, et les conteneurs de transport 30B, 48X et 48Y sont en acier au carbone selon ANSI N14.1. La condition, c\'est la siccité : des traces d\'humidité donnent du HF, et l\'acier lâche alors très vite. Dans les cascades elles-mêmes on emploie le nickel, le Monel et le PTFE.',
'inc.1': 'La fonte et les conduites revêtues ou galvanisées ne sont pas utilisées pour l\'UF₆ : le zinc réagit, et les revêtements comme le graphite de la fonte retiennent l\'humidité. Les matériaux standard sont le nickel, le Monel, le cuivre, l\'aluminium et le PTFE.',
'inc.2': 'L\'UF₆ détruit ces matériaux ou réagit avec les traces d\'humidité qu\'ils contiennent. Les cascades utilisent le PTFE, le nickel et le Monel.',
'inc.3': 'Les sels fluorés exigent l\'Hastelloy N — l\'alliage a été développé à l\'ORNL spécifiquement pour les réacteurs à sels fondus. L\'inox ne survit pas dans le FLiBe.',
'inc.4': 'Le plomb liquide dissout le nickel et le chrome de l\'acier. Des aciers à contrôle de l\'oxygène ou formant de l\'alumine (ODS/FeCrAl) sont nécessaires.',
'inc.5': 'Le LBE dissout les constituants de l\'acier. Un contrôle de l\'oxygène et des aciers résistants sont nécessaires.',
'inc.6': 'L\'inox ne tient dans le plomb qu\'avec une teneur en oxygène maintenue dans une fenêtre étroite et en dessous de ~500 °C.',
'inc.7': 'Idem : l\'inox ne survit dans le LBE que sous contrôle de l\'oxygène.',
'inc.8': 'Le sodium est incompatible avec le cuivre et l\'aluminium aux températures de service.',
'inc.9': 'Le nitrate fondu détruit l\'aluminium et le cuivre.',
'inc.10': 'Le béton frais est abrasif : les conduites de refoulement sont en acier résistant à l\'usure à forte épaisseur, et en acier trempé dans les coudes. Les tubes minces et souples s\'usent de part en part en un ou deux chantiers.',
'inc.11': 'L\'usure abrasive de la paroi dans une conduite à béton est rapide, surtout dans les coudes. L\'épaisseur se contrôle aux ultrasons — c\'est une question de durée de vie, pas d\'hydraulique.',
'inc.12': 'La même abrasivité : il faut de l\'acier résistant à l\'usure.',
'inc.13': 'Les aromatiques du brut gonflent et ramollissent le PVC — la résistance chute et la géométrie se déforme. Les produits pétroliers exigent de l\'acier ou du PVDF.',
'inc.14': 'L\'essence gonfle et ramollit le PVC jusqu\'à lui faire perdre sa tenue mécanique. De l\'acier ou un fluoropolymère est nécessaire.',
'inc.15': 'Le HDPE est le matériau standard des réservoirs de carburant, mais l\'essence y diffuse sensiblement. Le service carburant emploie du HDPE fluoré en surface ou à couche barrière, pas du HDPE nu.',
'inc.16': 'Le PVC et le PEX ne sont pas prévus pour le gazole.',

'w.nofit': 'Bei diesem Fließindex hat die Korrelation nach Dodge–Metzner keine Wurzel, es existiert also kein Reibungsbeiwert. Früher wurde in diesem Fall eine plausible Zahl ausgegeben; jetzt wird das Scheitern ausdrücklich angezeigt.',
'w.epsRange': 'Die relative Rauheit ε/D = {e} liegt außerhalb des Bereichs, für den Colebrook aufgestellt wurde (bis etwa 0,05). Der Wert stammt aus einer Extrapolation und stellt seine eigene Zuverlässigkeit zu hoch dar — bei dieser Rauheit ähnelt das Rohr eher einer Wellung als einem Rohr.',
'w.noflowSpeed': 'Die vorgegebene Geschwindigkeit ist nicht erreichbar.',
'w.yieldNote': 'Fließgrenze {tau0} Pa: Damit sich das Material überhaupt bewegt, ist ein Gradient von mindestens {grad} Pa/m nötig, also {bar} bar über {len} m — unabhängig vom Volumenstrom.',
'w.plug': 'Die Wandschubspannung übersteigt die Fließgrenze nur knapp: Ein ungescherter Pfropfen bewegt sich durch die Rohrmitte, und das Geschwindigkeitsprofil ist nahezu pfropfenförmig.',
'w.nonNewt': 'Nicht-newtonsches Medium: verallgemeinerte Reynolds-Zahl nach Metzner–Reed, turbulenter Ast nach Dodge–Metzner (glattes Rohr). Die Rauheit wird in diesem Ast nicht berücksichtigt — für raue Rohre mit nicht-newtonschen Medien gibt es keine allgemein anerkannte Korrelation.',
'w.normalFlow': 'Volumenstrom im Normzustand angegeben: {q} Nm³/h = {act} m³/h Betriebszustand bei {t} °C und {p} bar',
'w.slipNote': 'Schmierschicht: dP/L = (4/D)·({a}·v + {b}) = {grad} bar/m. Die Rheologie des Kerns geht in dieses Ergebnis überhaupt nicht ein.',
'w.slipMinor': 'Einzelverluste beim Betonpumpen werden als äquivalente Länge behandelt: ein 90°-Bogen ≈ 3 m gerades Rohr, ein Schlauch ≈ das 3-Fache seiner eigenen Länge.',
'w.depositNote': 'Eine Schicht von {th} mm auf beiden Seiten: Innendurchmesser {d0} → {d} mm',
'w.matTemp': '{mat}: Eine Betriebstemperatur von {t} °C liegt über der Grenze von {max} °C. Der Werkstoff ist hier unabhängig von der Hydraulik nicht einsetzbar.',
'w.foodMat': 'Ein lebensmitteltaugliches Medium braucht eine hygienische Oberfläche: polierter Edelstahl, PTFE, PVDF oder Glas. Gewöhnlicher Stahl und Kunststoffe lassen sich nicht im eingebauten Zustand reinigen.',

'fl.helium.note': 'HTGR/GFR. Die geringe Dichte erzwingt 50–80 m/s, weshalb das Umwälzen Prozentpunkte der thermischen Leistung frisst.',
'fl.co2.note': 'AGR (~40 bar) und überkritische Brayton-Kreisläufe (200+ bar). Am kritischen Punkt, 31 °C / 73,8 bar, ändern sich die Stoffwerte sprunghaft.',
'fl.sodium.note': 'Natriumgekühlte schnelle Reaktoren. ν ≈ 2,7·10⁻⁷ m²/s — in Reynolds-Größen ist Natrium dünner als Wasser, und der Punkt wandert tief in den hydraulisch rauen Bereich.',
'fl.lead.note': 'Bleigekühlte schnelle Reaktoren. ρ ≈ 10 500 kg/m³ — der Druckverlust ist selbst bei kleinen Geschwindigkeiten gewaltig.',
'fl.lbe.note': 'SVBR und die Reaktoren der U-Boote der Alfa-Klasse. Eutektikum 44,5 % Pb / 55,5 % Bi, Schmelzpunkt 125 °C.',
'fl.flibe.note': 'Salzschmelzenreaktoren. Bei 600 °C ist die dynamische Viskosität etwa achtmal und die kinematische etwa viermal so groß wie die von Wasser: Anders als die Flüssigmetalle ist das Salz zäh. Schmelzpunkt 459 °C — das Einfrieren im Kreislauf ist das erste Problem, nicht das zehnte.',
'fl.solarsalt.note': 'Wärmespeicher in Solarkraftwerken und Sekundärkreisläufe. Oberhalb von etwa 590 °C zersetzen sich die Nitrate.',
'fl.uf6.note': 'Anreicherungskaskaden. M = 352 g/mol — ein Gas mit der kinematischen Viskosität einer Flüssigkeit. Bei Atmosphärendruck existiert überhaupt keine flüssige Phase: nur Sublimation.',
'fl.hfo.note': 'Der klassische laminare Fall. Ohne Erwärmung auf 100–130 °C lässt es sich gar nicht fördern.',
'fl.natgas.note': 'Bei Ferngasdrücken von 55–75 bar sinkt der Realgasfaktor Z auf 0,85 — das ideale Gas liegt um 15 % daneben.',
'fl.syrup.note': 'Newtonsch, doch die Viskosität fällt beim Erwärmen um Größenordnungen. Ein hervorragender laminarer Fall.',
'fl.honey.note': 'Die Streuung zwischen Sorten und Chargen beträgt ein Mehrfaches. Eine Berechnung auf das Prozent genau ist sinnlos.',
'fl.ketchup.note': 'Er hat eine Fließgrenze: Unterhalb eines Schwellendruckverlusts fließt er gar nicht, statt langsam zu fließen.',
'fl.chocolate.note': 'Casson leitete seine Gleichung 1959 für Pigmentsuspensionen in Öl her — Druckfarben; auf Schokolade wurde sie erst später angewandt. Durchgesetzt hat sie sich aber als Schokoladenmethode: Bis 2000 war das die offizielle IOCCC-Methode.',
'fl.concrete.note': 'Beton im Rohr fließt nicht wie eine Flüssigkeit. Er bewegt sich als Pfropfen, und die gesamte Scherung konzentriert sich auf eine 1–3 mm dünne Zementleimschicht an der Wand. Die Rheologie dieser Schicht bestimmt den Druckverlust — nicht die Rheologie des Kerns und nicht die Wandrauheit.',
'fl.scc.note': 'Die Fließgrenze liegt eine Größenordnung unter der einer gewöhnlichen Mischung — er breitet sich von selbst aus, doch die Viskosität bleibt hoch. Das Wandgleiten verschwindet nicht.',
'fl.mud.note': 'Das klassische Bingham-Medium der Ölindustrie — an ihr wurde das Modell nach Metzner–Reed erprobt. Die Fließgrenze ist hier nützlich: Sie hält das Bohrklein in der Schwebe, wenn die Zirkulation stoppt.',

'fl.water.src': 'Tabelle der gesättigten Flüssigkeit nach IAPWS-95 zuzüglich einer geschlossenen Druckkorrektur für verdichtetes Wasser (Tait-artige Kubik in p − p_s, an jeder Tabellentemperatur an IAPWS-95 angepasst). Gegen CoolProp/IAPWS-95 im gesamten Bereich des Werkzeugs geprüft (0–350 °C, p_s–300 bar): Δρ ≤ 0,17 %, Δμ ≤ 0,21 %, Δν ≤ 0,22 %. Angegebenes Band: ρ und μ ±0,5 % (±1 % oberhalb 300 °C).',
'fl.steam.src': 'ρ — ideales Gas mit einer an IAPWS angepassten zweiten Virialkorrektur; μ — lineare Anpassung an Tabellenwerte (±2 %).',
'fl.air.src': 'ρ — Virialgleichung Z = 1 + B(T)n + C(T)n², Koeffizienten an die Luft-Zustandsgleichung von Lemmon et al. (2000) über −50…800 °C und 0…300 bar angepasst; μ — verallgemeinerter Sutherland-Ansatz A·T^k/(T+S) für das verdünnte Gas (die klassischen k = 1,5, S = 110,4 K liegen bei 800 °C 4 % zu niedrig) zuzüglich eines Dichteterms. Gegen CoolProp geprüft: Δρ ≤ 0,9 %, Δμ ≤ 0,95 %, Δν ≤ 0,6 % im gesamten Bereich.',
'fl.helium.src': 'μ ~ T^0,7 (±3 %); ρ — ideales Gas, Z ≈ 1,03 bei 70 bar.',
'fl.co2.src': 'ρ — Peng–Robinson mit Wurzelauswahl über die Fugazität gegen die Wagner-Sättigungskurve; μ — Fenghour–Wakeham–Vesovic.',
'fl.sodium.src': 'Fink–Leibowitz / OECD-NEA-Natriumhandbuch.',
'fl.lead.src': 'OECD-NEA Handbook on Lead and Lead-Bismuth Eutectic (2015), Korrelationen nach Sobolev.',
'fl.lbe.src': 'OECD-NEA Handbook on Lead and Lead-Bismuth Eutectic (2015).',
'fl.flibe.src': 'Korrelation nach Cantor; stimmt bei 600 °C bis auf 2 % mit der IUPAC/NIST-Referenzkorrelation (2019) überein. Die Streuung der FLiBe-Viskosität in der Literatur erreicht ±30 %.',
'fl.solarsalt.src': 'Standardkorrelationen für die Mischung 60 % NaNO₃ / 40 % KNO₃.',
'fl.uf6.src': 'GAT-280 (DeWitt, Uranium Hexafluoride: A Survey): Sublimationskurve log₁₀P[mmHg] = 10,648 − 2559,5/T, Verdampfungskurve 6,99464 − 1126,288/(t+221,963), flüssiges ρ und gasförmiges η aus derselben Quelle. Tripelpunkt 64,05 °C / 1,517 bar, kritischer Punkt 230,2 °C / 46,1 bar.',
'fl.crude.src': 'Typisches Rohöl mit ~32° API; die Stoffwerte hängen stark von der Lagerstätte ab.',
'fl.diesel.src': 'Sommerdiesel, typische Werte (ν = 2,0–4,5 cSt bei 40 °C nach EN 590).',
'fl.gasoline.src': 'Typische Werte für Ottokraftstoff.',
'fl.hfo.src': 'Schweröl, 380 cSt bei 50 °C, extrapoliert nach Walther (ASTM D341).',
'fl.propane.src': 'Gesättigte Flüssigkeit; Sättigungsdruck nach Antoine.',
'fl.butane.src': 'Gesättigte Flüssigkeit; Sättigungsdruck nach Antoine.',
'fl.natgas.src': 'Methandominierte Zusammensetzung; Z nach der Korrelation von Papay (Standing–Katz), Viskosität nach Lee–Gonzalez–Eakin.',
'fl.vegoil.src': 'Sonnenblumen-/Rapsöl; ν = 65 cSt bei 20 °C.',
'fl.milk.src': 'Vollmilch, 3,5 % Fett.',
'fl.syrup.src': '70 Gew.-% Saccharoselösung, Viskositäten nach NBS Circular 440 (Swindells et al.).',
'fl.honey.src': 'Blütenhonig mit ~17 % Wassergehalt; Arrhenius-Abhängigkeit, Ea ≈ 90 kJ/mol.',
'fl.beer.src': 'Nahe an Wasser, mit einer Korrektur für den Extraktgehalt.',
'fl.ketchup.src': 'Herschel–Bulkley: τ₀ ≈ 32 Pa, K ≈ 18 Pa·sⁿ, n ≈ 0,28 (Tomatenketchup).',
'fl.mayo.src': 'Herschel–Bulkley: τ₀ ≈ 90 Pa, K ≈ 25 Pa·sⁿ, n ≈ 0,35 (stark rezepturabhängig).',
'fl.yogurt.src': 'Herschel–Bulkley: τ₀ ≈ 20 Pa, K ≈ 6 Pa·sⁿ, n ≈ 0,35 (Rührjoghurt).',
'fl.chocolate.src': 'Casson-Modell: τ₀ ≈ 12 Pa, μ_C ≈ 2,0 Pa·s.',
'fl.concrete.src': 'Bingham: τ₀ ≈ 800 Pa, plastische Viskosität ≈ 40 Pa·s (Mischung mit großem Ausbreitmaß). Druckverlust aus dem tribologischen Modell nach Kaplan; die Konstanten der Schmierschicht sind an DN125-Messungen kalibriert (~0,14 bar/m).',
'fl.scc.src': 'Bingham: τ₀ ≈ 50 Pa, plastische Viskosität ≈ 25 Pa·s; Tribologie nach Feys und Kaplan.',
'fl.mud.src': 'Bentonitspülung mit 1200 kg/m³: τ₀ ≈ 8 Pa, plastische Viskosität ≈ 15 cP (der veröffentlichte Bereich für unbeschwerte Spülungen liegt bei 1–20 cP).',
'fl.applesauce.src': 'Potenzgesetz: K ≈ 6 Pa·sⁿ, n ≈ 0,35 (Apfelpüree).',

// ---- material notes -----------------------------------------------------
'mat.drawn.note': 'Über den größten Teil des Re-Bereichs praktisch hydraulisch glatt. Als Alterungsrate wird die von Nichteisenmetallen angesetzt — gezogene Rohre sind meist aus Kupfer oder Aluminium; für gezogenen Kohlenstoffstahl ist die Zeile „handelsüblicher Stahl“ zu verwenden.',
'mat.steel.note': 'Der Bezugswerkstoff des klassischen Diagramms. Er altert merklich — hier leistet der Altersregler seine eigentliche Arbeit.',
'mat.stainless.note': 'Altert in Wasser praktisch nicht — der Altersregler ändert fast nichts.',
'mat.electropol.note': 'Die Grenze des glatten Rohrs. Die Rauheit wirkt sich überhaupt nicht aus — der Punkt liegt auf der unteren Einhüllenden.',
'mat.titanium.note': 'Reintitan ist durch Gasaufnahme auf etwa 350 °C begrenzt (ASME B31.3 führt zulässige Spannungen nur bis 316 °C). Hydraulisch nicht von Edelstahl zu unterscheiden. Es wird wegen der Korrosionsbeständigkeit gewählt, nicht wegen der Glätte.',
'mat.inconel.note': 'Hydraulisch dasselbe wie Edelstahl. Der Sinn der Legierung liegt in der Medienbeständigkeit und der Warmfestigkeit.',
'mat.ductile.note': 'Die Auskleidung bestimmt die Rauheit, nicht das Metall. Dafür altert die Auskleidung kaum.',
'mat.riveted.note': 'Der raueste Eintrag auf Moodys Originaldiagramm von 1944.',
'mat.hdpe.note': 'Glatt, aber nachgiebig: Der tatsächliche Innendurchmesser nach dem Ovalwerden zählt mehr als die Rauheit.',
'mat.glass.note': 'Der praktische Maßstab für eine glatte Wand. Nikuradse arbeitete entgegen der verbreiteten Ansicht mit gezogenen Messingrohren, die mit Sand beschichtet waren, und nicht mit Glas — die untere Einhüllende des Diagramms ist aber genau die Grenze des glatten Rohrs.',
'mat.woodstave.note': 'Ein Eintrag aus Moodys Originaldiagramm. Hölzerne Druckrohrleitungen dienten der Wasserkraft bis in die Mitte des 20. Jahrhunderts, und einige stehen noch.',
'mat.corr_ss.note': 'Der Widerstand entsteht durch die Form der Wellung, nicht durch die Wandrauheit. Das äquivalente ε ist eine Anpassungsgröße ohne physikalische Bedeutung als Rauheit.',
'mat.corr_pe.note': 'Dasselbe noch einmal: Das ist Form, nicht Rauheit.',
'mat.scale.note': 'In einem verkrusteten Rohr berührt das Wasser das Metall nicht mehr: Stahl und Grauguss werden hydraulisch ununterscheidbar. Maßgeblich ist nicht die Rauheit, sondern der Verlust an Innendurchmesser.',
'mat.tubercle.note': 'Der klassische Zustand alter Haupt- und Versorgungsleitungen aus Stahl und Grauguss: millimeterhohe Tuberkel.',
'mat.biofilm.note': 'Kühlwasser, Meerwasser, Kondensatoren.',

// ---- incompatibility ----------------------------------------------------
'inc.0': 'Trockenes UF₆ bildet auf Kohlenstoffstahl einen passivierenden Fluoridfilm, und die Transportbehälter 30B, 48X und 48Y bestehen nach ANSI N14.1 aus Kohlenstoffstahl. Bedingung ist Trockenheit: Feuchtigkeitsspuren ergeben HF, und dann versagt der Stahl schnell. In den Kaskaden selbst werden Nickel, Monel und PTFE eingesetzt.',
'inc.1': 'Grauguss sowie ausgekleidete oder verzinkte Rohre werden für UF₆ nicht verwendet: Zink reagiert, und Auskleidungen wie auch der Graphit im Grauguss halten Feuchtigkeit fest. Die Standardwerkstoffe sind Nickel, Monel, Kupfer, Aluminium und PTFE.',
'inc.2': 'UF₆ zerstört diese Werkstoffe oder reagiert mit den Feuchtigkeitsspuren in ihnen. In Kaskaden werden PTFE, Nickel und Monel verwendet.',
'inc.3': 'Fluoridschmelzen erfordern Hastelloy N — die Legierung wurde am ORNL eigens für Salzschmelzenreaktoren entwickelt. Edelstahl überlebt in FLiBe nicht.',
'inc.4': 'Flüssiges Blei löst Nickel und Chrom aus dem Stahl heraus. Erforderlich sind sauerstoffkontrollierte oder aluminiumoxidbildende Stähle (ODS/FeCrAl).',
'inc.5': 'LBE löst die Legierungsbestandteile des Stahls heraus. Erforderlich sind Sauerstoffkontrolle und beständige Stähle.',
'inc.6': 'Edelstahl funktioniert in Blei nur, wenn die Sauerstoffkonzentration in einem engen Fenster gehalten wird und die Temperatur unter etwa 500 °C bleibt.',
'inc.7': 'Dasselbe: Edelstahl überlebt in LBE nur unter Sauerstoffkontrolle.',
'inc.8': 'Natrium ist bei Betriebstemperaturen mit Kupfer und Aluminium unverträglich.',
'inc.9': 'Nitratschmelze zerstört Aluminium und Kupfer.',
'inc.10': 'Frischbeton ist abrasiv: Förderleitungen bestehen aus dickwandigem verschleißfestem Stahl, an den Bögen aus gehärtetem Stahl. Dünnwandige und weiche Rohre sind nach ein bis zwei Einsätzen durchgescheuert.',
'inc.11': 'Der abrasive Wandverschleiß in einer Betonleitung geht schnell, besonders an den Bögen. Die Wanddicke wird per Ultraschall überwacht — eine Frage der Lebensdauer, nicht der Hydraulik.',
'inc.12': 'Dieselbe Abrasivität: verschleißfester Stahl ist erforderlich.',
'inc.13': 'Aromaten im Rohöl lassen PVC quellen und weich werden — die Festigkeit sinkt, und die Geometrie verzieht sich. Für Mineralölprodukte braucht es Stahl oder PVDF.',
'inc.14': 'Ottokraftstoff lässt PVC so weit quellen und weich werden, dass es seine Tragfähigkeit verliert. Erforderlich sind Stahl oder ein Fluorpolymer.',
'inc.15': 'HDPE ist der Standardwerkstoff für Kraftstofftanks, doch Ottokraftstoff diffundiert merklich hindurch. Im Kraftstoffeinsatz wird oberflächenfluoriertes HDPE oder solches mit Sperrschicht verwendet, kein reines.',
'inc.16': 'PVC und PEX sind nicht für Dieselkraftstoff vorgesehen.',

// ---- fluid-specific warnings -------------------------------------------
'fw.water.boil': 'Bei {t} °C und {p} bar siedet das Wasser (p sat = {ps} bar). Die Strömung ist zweiphasig — das Moody-Diagramm ist nicht anwendbar.',
'fw.water.frozen': 'Das Wasser ist gefroren.',
'fw.water.nearCrit': 'Annäherung an den kritischen Punkt (374 °C): Die Stoffwerte ändern sich stark, und die Kompressibilität von flüssigem Wasser ist hier bereits spürbar.',
'fn.water.press': 'Bei {t} °C und {p} bar liegt verdichtetes (unterkühltes) Wasser vor: Die Stoffwerte der gesättigten Flüssigkeit werden auf den Druck korrigiert, was die Dichte gegenüber der Siedelinie um {dr} % erhöht.',
'fw.water.range': 'Die Temperatur {t} °C liegt außerhalb des validierten Bereichs des Wasser-Stoffwertmodells (0–350 °C); die Werte werden vom nächstgelegenen Tabellenpunkt extrapoliert.',
'fw.steam.cond': 'Bei {t} °C kondensiert der Dampf oberhalb von {p} bar.',
'fw.steam.hi': 'Oberhalb von 60 bar ist die abgebrochene Virialentwicklung für Dampf unbrauchbar: Nahe dem kritischen Punkt erreicht der Fehler zehner Prozent. Erforderlich ist IAPWS-IF97.',
'fw.steam.mid': 'Oberhalb von 25 bar verliert die Virialkorrektur an Genauigkeit — die Abweichung gegenüber IF97 liegt in der Größenordnung von 3–5 %.',
'fn.air.real': 'Bei {p} bar ist Luft messbar nicht ideal: Der Realgasfaktor beträgt Z = {z}. Dichte und Viskosität stammen aus dem angepassten Realgasmodell, das angegebene Band weitet sich auf ±2 %.',
'fw.air.range': 'Außerhalb des validierten Bereichs des Luft-Stoffwertmodells (−50…800 °C, bis 300 bar) wird die Anpassung extrapoliert und die Unsicherheit ist nicht mehr auf ±2 % begrenzt.',
'fw.co2.nearCrit': 'Nahkritischer Bereich: Peng–Robinson liegt hier um zehner Prozent daneben, und ganz nahe am kritischen Punkt wird die Abweichung zu einem Vielfachen. Für Auslegungsarbeit braucht es Span–Wagner (REFPROP/CoolProp). Der Punkt wird angezeigt, ist aber nicht belastbar.',
'fw.co2.dense': 'Dichte Phase (ρ = {rho} kg/m³): Peng–Robinson überschätzt die Dichte hier um 5–10 %, und die Viskosität nach Fenghour verstärkt diesen Fehler über ihren ~ρ⁸-Term — bis zu 20 % in der Viskosität. Dichte und Viskosität werden angezeigt, für Auslegungsarbeit braucht es aber Span–Wagner.',
