    if (p < ps) warn.push({ lvl: 'critical', k: 'fw.water.boil', p: { t: t.toFixed(0), p: (p / 1e5).toFixed(2), ps: (ps / 1e5).toFixed(2) } });
    if (t < 0) warn.push({ lvl: 'critical', k: 'fw.water.frozen' });
    if (t > 320) warn.push({ lvl: 'warning', k: 'fw.water.nearCrit' });
    // Свойства сжатой жидкой воды: таблица на линии насыщения (IAPWS-95)
    // с замкнутой поправкой на давление, см. W_KRHO / W_KMU выше.
    const rho = lerp(t, W_T, W_RHO) * wPressCorr(t, p, W_KRHO);
    const mu  = lerpLog(t, W_T, W_MU) * wPressCorr(t, p, W_KMU);
    let unc = 0.005;
    const dpc = (p - pSatWater(t)) / 1e5;
    if (dpc > 5) {
      notes.push({ k: 'fn.water.press', p: { t: t.toFixed(0), p: (p / 1e5).toFixed(0),
        dr: ((wPressCorr(t, p, W_KRHO) - 1) * 100).toFixed(2) } });
    }
    if (t > 300) unc = 0.01;                     // окрестность критической точки
    if (t < 0 || t > 350) {
      unc = 0.05;
      warn.push({ lvl: 'warning', k: 'fw.water.range', p: { t: t.toFixed(0) } });
    }
    return { rho, mu, phase: 'ph.liquid', warn, note: notes, unc };
  },
},
{
  id: 'steam', group: 'Обычные среды', tag: 'gas', gas: true, M: 0.018015,
  tMin: 100, tMax: 600, defT: 300, defP: 10e5, unc: 0.05,
  props(t, p) {
    const warn = [];
    const Tk = K(t);
    if (p > pSatWater(t) && t < 374) warn.push({ lvl: 'critical', k: 'fw.steam.cond', p: { t: t.toFixed(0), p: (pSatWater(t) / 1e5).toFixed(2) } });
    // Второй вириальный коэффициент водяного пара, подогнан по IAPWS
    // (Z = 0.975 при 300 °C/10 бар, 0.920 при 500 °C/100 бар). Прежняя
    // самодельная поправка брала лишь пятую часть реального отклонения.
    const B = -Math.exp(-12.309 + 1885.8 / Tk);       // м³/моль
    const Z = Math.max(0.5, 1 + B * p / (R_UNIV * Tk));
    let unc = 0.03;
    if (p > 60e5) {
      unc = 0.20;
      warn.push({ lvl: 'critical', k: 'fw.steam.hi' });
    } else if (p > 25e5) {
      unc = 0.08;
      warn.push({ lvl: 'warning', k: 'fw.steam.mid' });
    }
    return { rho: idealRho(p, Tk, 0.018015, Z), mu: 8.04e-6 + 4.07e-8 * t,
             phase: 'ph.gas', warn, unc };
  },
},
{
  id: 'air', group: 'Обычные среды', tag: 'gas', gas: true, M: 0.028966,
  tMin: -50, tMax: 800, defT: 20, defP: 7e5, unc: 0.02,
  props(t, p) {
    const Tk = K(t);
    const warn = [], notes = [];
    const pb = p / 1e5;
    // Плотность: вириальное уравнение Z = 1 + B(T)*n + C(T)*n^2 по молярной
    // плотности n; коэффициенты подогнаны по уравнению состояния воздуха
    // (Lemmon et al., 2000) на всей области -50...800 C / 0...300 бар.
    // Прежняя двухчленная подгонка по p была откалибрована только при 20 C и
    // давала +3.3 процента по плотности при 500 C и 100 бар.
    const th = 273.15 / Tk;
    const Bv = (35.25245531375889 + -25.971737652427656 * th + -25.78119220198285 * th * th + 1.300779063452333 * Math.pow(th, 4)) * 1e-6;
    const Cv = (1069.8283339883385 + 433.56256111400745 * th + 332.3070794182485 * Math.pow(th, 3)) * 1e-12;
    const Mair = 0.028966;
    let rho = idealRho(p, Tk, Mair, 1), Z = 1;
    for (let i = 0; i < 6; i++) {                 // Z зависит от плотности
      const nm = rho / Mair;
      Z = Math.max(0.3, 1 + Bv * nm + Cv * nm * nm);
      rho = idealRho(p, Tk, Mair, Z);
    }
    // Вязкость: разреженный газ A*T^k/(T+S) (обобщённый Сазерленд; обычная
    // формула с k=1.5, S=110.4 занижает вязкость на 4 процента уже при 800 C)
    // плюс избыточный член по плотности. По CoolProp |dmu| <= 0.95 процента.
    const mu0 = 8.509283836262034e-07 * Math.pow(Tk, 1.579239043995058) / (Tk + 75.01632190006579);
    const mu = mu0 + 1.516686367490203e-08 * rho + 1.6376974362570233e-11 * rho * rho + 7.867993114367287e-14 * rho * rho * rho;
    let unc = 0.01;
    if (pb >= 100) {                              // не строгое «>»: 100 бар тоже
      unc = 0.02;
      notes.push({ k: 'fn.air.real', p: { p: pb.toFixed(0), z: Z.toFixed(3) } });
    }
    if (t < -50 || t > 800 || pb > 300) {
      unc = 0.05;
      warn.push({ lvl: 'warning', k: 'fw.air.range' });
    }
    return { rho, mu, phase: 'ph.gas', warn, note: notes, unc };
  },
},

{
  id: 'uf6', group: 'Ядерные теплоносители', tag: 'both', gas: true, M: 0.352019,
  tMin: 20, tMax: 225, defT: 90, defP: 2e5, unc: 0.08,
  knudsen: true,
  props(t, p) {
    const Tk = K(t), warn = [];
    const pTriple = 1.517e5, tTriple = 64.05;
    // давление сублимации над твёрдым UF6
    const pSub = 133.322 * Math.pow(10, 10.648 - 2559.5 / Tk);
    // Давление насыщения над жидкостью — форма Оливера/Гризара из GAT-280.
    // Прежняя двухточечная подгонка занижала его на 21% при 113 °C и на 44%
    // у критической точки, из-за чего целый клин по давлению ошибочно
    // помечался жидкостью (ошибка плотности до 57 раз).
    const pVap = 133.322 * Math.pow(10, 6.99464 - 1126.288 / (t + 221.963));
    let phase, rho, mu;
    if (t < tTriple) {
      if (p > pSub) {
        warn.push({ lvl: 'critical', k: 'fw.uf6.solid', p: { t: t.toFixed(1), p: (pSub / 1e5).toFixed(3) } });
      }
      if (p > pSub) {
        // Это твёрдая фаза. Раньше сюда всё равно отдавалась плотность
        // идеального газа — правдоподобное, но бессмысленное число.
        phase = 'ph.solid';
        rho = 5090;
        mu = NaN;
      } else {
        phase = 'ph.gasOverSolid';
        rho = idealRho(p, Tk, 0.352019);
        mu = 6.163e-8 * Math.pow(Tk, 0.999);
      }
    } else if (p > pVap) {
      phase = 'ph.liquid';
      // GAT-280 уравнение 5: квадратичная зависимость, прежняя линейная
      // завышала плотность на 8% при 200 °C и на 20% при 250 °C.
      const dt = t - 64.052;
      rho = (3.630 - 5.805e-3 * dt - 1.36e-5 * dt * dt) * 1000;
      mu = 5.84e-6 * Math.exp(1728 / Tk);
      warn.push({ lvl: 'warning', k: 'fw.uf6.liquid' });
    } else {
      phase = 'ph.gas';
      const Z = Math.max(0.75, 1 - 0.03 * (p / 1e5) * Math.pow(350 / Tk, 3));
      rho = idealRho(p, Tk, 0.352019, Z);
      // GAT-280 уравнение 18. Прежняя оценка занижала вязкость на 22–26%,
      // а она входит в число Кнудсена напрямую — то есть ровно в то,
      // ради чего этот флюид здесь и стоит.
      mu = 6.163e-8 * Math.pow(Tk, 0.999);
    }
    if (t > 230.2) warn.push({ lvl: 'warning', k: 'fw.uf6.crit' });
    warn.push({ lvl: 'warning', k: 'fw.uf6.reacts' });
    return { rho, mu, phase, warn, unc: 0.10 };
  },
},

{
  id: 'natgas', group: 'Нефть и углеводороды', tag: 'gas', gas: true, M: 0.0170,
  tMin: -20, tMax: 80, defT: 10, defP: 55e5, unc: 0.06,
  props(t, p) {
    const Tk = K(t);
    // приведённые параметры для типового газа
    const Tpc = 190.6, Ppc = 46.0e5;
    const Tr = Tk / Tpc, Pr = p / Ppc;
    // корреляция Папая
    const Z = Math.max(0.5, 1 - 3.52 * Pr / Math.pow(10, 0.9813 * Tr)
                            + 0.274 * Pr * Pr / Math.pow(10, 0.8157 * Tr));
    const rho = idealRho(p, Tk, 0.0170, Z);
    // Ли–Гонсалес–Икин: T в градусах Ренкина, плотность в г/см³
    const Tr_R = Tk * 1.8, Mg = 17.0;
    const Kc = (9.4 + 0.02 * Mg) * Math.pow(Tr_R, 1.5) / (209 + 19 * Mg + Tr_R);
    const Xc = 3.5 + 986 / Tr_R + 0.01 * Mg;
    const Yc = 2.4 - 0.2 * Xc;
    const mu = Kc * Math.exp(Xc * Math.pow(rho / 1000, Yc)) * 1e-7;
    return { rho, mu, phase: 'ph.gas', warn: [], unc: 0.06, extra: { Z } };
  },
},

    res = frictionFactor(Re, relEps);
  }
  const f = res.f;

  // --- потери ---
  // Для сред с пристенным скольжением (бетонные смеси) перепад задаёт не
  // объёмная реология и не шероховатость, а смазочный слой цементного теста
  // у стенки: dP/L = (4/D)·(a·v + b) — трибологическая модель Каплана.
  let slipDp = null;
  if (pr.slip) {
    slipDp = st.L * (4 / D) * (pr.slip.a * v + pr.slip.b);
    notes.push({ k: 'w.slipNote', p: { a: pr.slip.a.toFixed(0), b: pr.slip.b.toFixed(0),
      grad: fmt((4 / D) * (pr.slip.a * v + pr.slip.b) / 1e5, 3) } });
    notes.push({ k: 'w.slipMinor' });
  }
  let hMaj, hMin, hF;
  if (slipDp != null) {
    // Местные сопротивления у бетоноводов учитывают эквивалентной длиной,
    // а не коэффициентами ΣK, поэтому отдельной составляющей здесь нет.
    hMaj = slipDp / (pr.rho * st.g); hMin = 0; hF = hMaj;
  } else {
    hMaj = f * (st.L / D) * v * v / (2 * st.g);
    hMin = st.sumK * v * v / (2 * st.g);
    hF = hMaj + hMin;
  }
  const dpFric = slipDp != null ? slipDp : pr.rho * st.g * hF;
  const dpElev = pr.rho * st.g * st.dz;
  const dpTot = dpFric + dpElev;
  const power = Q * dpTot / st.eta;

  // --- полоса неопределённости ---
  // Складываем разброс шероховатости и погрешность свойств среды.
  const band = (() => {
    if (pr.slip) {                        // разброс трибологии слоя ещё шире
      return { lo: dpFric / 1.6, hi: dpFric * 1.6 };
    }
    if (pr.rheo) {                        // для неньютоновских правит реология
      const s = 1 + (pr.unc || 0.3);
      return { lo: dpFric / s, hi: dpFric * s };
    }
    const vals = [];
    for (const e of [wall.epsLo, wall.eps, wall.epsHi]) {
      for (const mMul of [1 - (pr.unc || 0.02), 1, 1 + (pr.unc || 0.02)]) {
        const ReX = pr.rho * v * D / (pr.mu * mMul);
        const fX = frictionFactor(ReX, e / D).f;
        vals.push(pr.rho * st.g * (fX * (st.L / D) + st.sumK) * v * v / (2 * st.g));
      }
    }
    return { lo: Math.min(...vals), hi: Math.max(...vals) };
  })();

  // --- проверки применимости ---
  if (fl.gas && isFinite(dpFric)) {
    const frac = dpFric / st.p;
    if (frac > 0.10) warn.push({ lvl: 'critical', srcK: 'w.src.compress', k: 'w.compressHigh', p: { pct: (frac * 100).toFixed(0) } });
    else if (frac > 0.05) warn.push({ lvl: 'warning', srcK: 'w.src.compress', k: 'w.compressMid', p: { pct: (frac * 100).toFixed(0) } });
    const gam = fl.id === 'helium' ? 1.667 : (fl.id === 'uf6' ? 1.07 : 1.4);
    const c = Math.sqrt(gam * R_UNIV * (st.t + 273.15) / fl.M);
    const Ma = v / c;
    notes.push({ k: 'w.machNote', p: { ma: Ma.toFixed(3), c: fmt(c, 3) } });
    if (Ma > 0.3) warn.push({ lvl: Ma > 0.7 ? 'critical' : 'warning', srcK: 'w.src.compress', k: 'w.mach', p: { ma: Ma.toFixed(2), choke: Ma > 0.7 ? t('w.machChoke') : '' } });
    // Кнудсен
    const kn = knudsen(pr.mu, st.p, st.t + 273.15, fl.M, D);
    if (kn.Kn > 1e-3) {
      const lam = (kn.lambda * 1e6).toFixed(1);
      const head = t('w.knHead', { kn: kn.Kn.toExponential(2), lambda: lam, d: (D * 1000).toFixed(1) });
      const tail = kn.Kn > 10 ? 'w.knFree' : (kn.Kn > 0.1 ? 'w.knTrans' : 'w.knSlip');
      warn.push({ lvl: kn.Kn > 0.1 ? 'critical' : 'warning', srcK: 'w.src.knudsen',
                  text: head + t(tail) });
    }
    else notes.push({ k: 'w.knOk', p: { kn: kn.Kn.toExponential(2) } });
  }
  if (fl.vMax && v > fl.vMax) warn.push({ lvl: 'critical', srcK: 'w.src.velocity', k: 'w.vMax', p: { v: v.toFixed(2), lim: fl.vMax, why: 'fl.' + fl.id + '.vmax' } });
  if (fl.food && v < 1.5 && v > 0) warn.push({ lvl: 'warning', srcK: 'w.src.sanitary', k: 'w.cip', p: { v: v.toFixed(2) } });
  if (mat.form) warn.push({ lvl: 'warning', srcK: 'w.src.material', k: 'w.form' });
  if (res.regime === 'critical') warn.push({ lvl: 'warning', srcK: 'w.src.regime', k: 'w.crit', p: { lo: Math.round(res.ReCrit || 2300), hi: Math.round(res.ReCritHi || 4000) } });
  if (res.regime === 'nofit') warn.push({ lvl: 'critical', srcK: 'w.src.rheology', k: 'w.nofit' });
  if (!res.uncertain && relEps > 0.05 && !pr.rheo) warn.push({ lvl: 'warning', srcK: 'w.src.roughness', k: 'w.epsRange', p: { e: relEps.toFixed(3) } });
  if (res.regime === 'noflow') warn.push({ lvl: 'critical', srcK: 'w.src.rheology', k: 'w.noflowSpeed' });
  if (res.note) notes.push(res.note);
  if (pr.rheo) {
    const tau0 = pr.rheo.tau0 || 0;
    if (tau0 > 0) {
      const dpdlMin = 4 * tau0 / D;
      notes.push({ k: 'w.yieldNote', p: { tau0: tau0.toFixed(1), grad: fmt(dpdlMin),
        bar: fmt(dpdlMin * st.L / 1e5, 3), len: st.L } });
      if (res.tauW && res.tauW < tau0 * 1.15) warn.push({ lvl: 'warning', srcK: 'w.src.rheology', k: 'w.plug' });
    }
    warn.push({ lvl: 'warning', srcK: 'w.src.rheology', k: 'w.nonNewt' });
  }

  return { st, fl, mat, pr, wall, D, D0, A, Q, v, Re, f, res, nn, relEps,
           hMaj, hMin, hF, dpFric, dpElev, dpTot, power, band, warn, notes };
}

// Обратный расчёт: подобрать диаметр под заданный перепад
function reverseSolve() {
  const fl = FLUID_BY_ID[S.fluid], mat = MATERIAL_BY_ID[S.mat];
  const pr = fl.props(S.t, S.p);
  const target = S.targetDp * 1e5;
  if (S.flowMode !== 'Q') return { err: t('res.revErrMode') };
  // Пересчёт нм³/ч в фактические — раньше он здесь отсутствовал, из-за чего
  // газ подбирался по нормальному расходу и диаметр выходил в разы больше.
  let Qm3s = S.Q / 3600;
  if (S.normalFlow && fl.gas) {
    Qm3s = (S.Q / 3600) * (101325 * fl.M / (R_UNIV * 273.15)) / pr.rho;
  }

  const dpOf = (Dtry) => {
    const w = effectiveWall(mat, Dtry, S.age, S.thick, S.aggr, AQUEOUS.has(fl.id));
    const D = w.D, A = Math.PI * D * D / 4, v = Qm3s / A;
    // Пристенное скольжение считается по той же модели, что и в прямом
    // расчёте, иначе ответ противоречил бы таблице под ним.
    if (pr.slip) {
      return S.L * (4 / D) * (pr.slip.a * v + pr.slip.b) + pr.rho * S.g * S.dz;
    }
    let f;
    if (pr.rheo) {
      const r = frictionNonNewtonian(pr.rho, v, D, pr.rheo);
      f = r.f; if (!isFinite(f)) return Infinity;
    } else {
      f = frictionFactor(pr.rho * v * D / pr.mu, w.eps / D).f;
      if (!isFinite(f)) return Infinity;
    }
    return pr.rho * S.g * ((f * (S.L / D) + S.sumK) * v * v / (2 * S.g) + S.dz);
  };
  const r = solveDiameter(target, dpOf);
  if (!isFinite(r.D)) {
    return { err: r.reason === 'too-small'
      ? t('res.revErrSmall') : t('res.revErrLarge') };
  }
  // ближайший больший стандартный DN
  const dnList = Object.keys(DN).map(Number).sort((a, b) => a - b);
  const need = r.D * 1000;
  const pick = dnList.find(d => DN[d] >= need) || dnList[dnList.length - 1];
  return { D: r.D, dn: pick, dpAtDn: dpOf(DN[pick] / 1000) };
}

// ---------------------------------------------------------------------------
//  ДИАГРАММА
// ---------------------------------------------------------------------------
const CH = { w: 940, h: 580, ml: 74, mr: 128, mt: 26, mb: 58 };
// Классические границы диаграммы Муди
const RE_MIN0 = 600, RE_MAX0 = 1e8, F_MIN0 = 0.007, F_MAX0 = 0.12;
// Фактические границы: расширяются, чтобы точка пользователя всегда была видна.
// Ограничены, иначе вязкие среды сплющили бы классическую часть в полоску.
let RE_MIN = RE_MIN0, RE_MAX = RE_MAX0, F_MIN = F_MIN0, F_MAX = F_MAX0;

function setBounds(R) {
  RE_MIN = RE_MIN0; RE_MAX = RE_MAX0; F_MIN = F_MIN0; F_MAX = F_MAX0;
  if (!R || !isFinite(R.Re) || !isFinite(R.f) || R.Re <= 0 || R.f <= 0) return;
  if (R.Re < RE_MIN) RE_MIN = Math.max(1, Math.pow(10, Math.floor(Math.log10(R.Re / 2))));
  if (R.Re > RE_MAX) RE_MAX = Math.min(1e9, Math.pow(10, Math.ceil(Math.log10(R.Re * 2))));
  if (R.f > F_MAX) F_MAX = Math.min(50, Math.pow(10, Math.ceil(Math.log10(R.f * 1.4))));
  if (R.f < F_MIN) F_MIN = Math.max(1e-3, Math.pow(10, Math.floor(Math.log10(R.f / 1.2))));
}
const px = (Re) => CH.ml + (Math.log10(Re) - Math.log10(RE_MIN)) /
                   (Math.log10(RE_MAX) - Math.log10(RE_MIN)) * (CH.w - CH.ml - CH.mr);
const py = (f) => CH.mt + (Math.log10(F_MAX) - Math.log10(f)) /
                  (Math.log10(F_MAX) - Math.log10(F_MIN)) * (CH.h - CH.mt - CH.mb);

const EPS_CURVES = [5e-2, 3e-2, 2e-2, 1e-2, 6e-3, 4e-3, 2e-3, 1e-3, 6e-4, 4e-4,
                    2e-4, 1e-4, 5e-5, 2e-5, 1e-5, 5e-6, 1e-6];
// Порядковая одноцветная шкала для ε/D. Направление на тёмной поверхности
// инвертировано: там «больше» = светлее. Обе шкалы прошли проверку валидатором
// (монотонность L, зазор ΔL >= 0.06, светлый край отделён от фона).
const BLUE_LIGHT = ['#86b6ef', '#5598e7', '#2a78d6', '#1c5cab', '#104281'];
const BLUE_DARK  = ['#184f95', '#256abf', '#3987e5', '#6da7ec', '#9ec5f4'];
const isDark = () => {
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
};
const blueFor = (i, n) => {
  const R = isDark() ? BLUE_DARK : BLUE_LIGHT;
  return R[Math.min(R.length - 1, Math.round(i / Math.max(n - 1, 1) * (R.length - 1)))];
};

// Прямоугольники уже нарисованных подписей — чтобы разводка точек их обходила
let labelBoxes = [];
const reserveLabel = (x, y, text, anchor = 'start', cw = 5.4, h = 12) => {
  const w = text.length * cw;
  const x0 = anchor === 'middle' ? x - w / 2 : (anchor === 'end' ? x - w : x);
  labelBoxes.push({ x0, x1: x0 + w, y0: y - h, y1: y + 4 });
};

function drawChart(R) {
  setBounds(R);
  labelBoxes = [];
  // The curve labels are placed before the operating point is drawn, so the
  // point's own label box is reserved first; anything that would land on the
  // marker is dropped instead of overprinting it.
  if (R && isFinite(R.Re) && isFinite(R.f)
      && R.Re >= RE_MIN && R.Re <= RE_MAX && R.f >= F_MIN && R.f <= F_MAX) {
    const ux0 = px(R.Re), uy0 = py(R.f);
    labelBoxes.push({ x0: ux0 - 22, x1: ux0 + 132, y0: uy0 - 26, y1: uy0 + 14 });
  }
  const clashes = (x, y, text, anchor = 'start', cw = 5.4, h = 12) => {
    const w = text.length * cw;
    const x0 = anchor === 'middle' ? x - w / 2 : (anchor === 'end' ? x - w : x);
    const b = { x0: x0, x1: x0 + w, y0: y - h, y1: y + 4 };
    return labelBoxes.some(p => !(b.x1 < p.x0 - 3 || b.x0 > p.x1 + 3 || b.y1 < p.y0 || b.y0 > p.y1));
  };
  const g = [];
  const X0 = CH.ml, X1 = CH.w - CH.mr, Y0 = CH.mt, Y1 = CH.h - CH.mb;
  const extended = RE_MIN < RE_MIN0 || F_MAX > F_MAX0 || RE_MAX > RE_MAX0 || F_MIN < F_MIN0;

  // --- сетка по X ---
  for (let d = Math.floor(Math.log10(RE_MIN)); d <= Math.ceil(Math.log10(RE_MAX)); d++) {
    for (let m = 1; m < 10; m++) {
      const Re = m * Math.pow(10, d);
      if (Re < RE_MIN || Re > RE_MAX) continue;
      const x = px(Re);
      g.push(`<line x1="${x}" y1="${Y0}" x2="${x}" y2="${Y1}" class="${m === 1 ? 'grid-major' : 'grid'}"/>`);
      if (m === 1) g.push(`<text x="${x}" y="${Y1 + 20}" class="ax">10<tspan dy="-6" font-size="10">${d}</tspan></text>`);
    }
  }
  // --- сетка по Y: 1,2,3,5 в каждой декаде ---
  for (let d = Math.floor(Math.log10(F_MIN)); d <= Math.ceil(Math.log10(F_MAX)); d++) {
    for (const m of [1, 1.5, 2, 3, 5, 7]) {
      const ft = m * Math.pow(10, d);
      if (ft < F_MIN || ft > F_MAX) continue;
      const y = py(ft);
      g.push(`<line x1="${X0}" y1="${y}" x2="${X1}" y2="${y}" class="${m === 1 ? 'grid-major' : 'grid'}"/>`);
      const lab = ft >= 1 ? String(+ft.toFixed(1)) : ft.toFixed(Math.max(0, -d + (m === 1 ? 0 : 1)));
      g.push(`<text x="${X0 - 9}" y="${y + 4}" class="ax ar">${lab}</text>`);
    }
  }
  if (extended) {
    // очертить классическую область, чтобы было видно, насколько мы из неё вышли
    const bx = px(Math.max(RE_MIN0, RE_MIN)), bx2 = px(Math.min(RE_MAX0, RE_MAX));
    const by = py(Math.min(F_MAX0, F_MAX)), by2 = py(Math.max(F_MIN0, F_MIN));
    g.push(`<rect x="${bx}" y="${by}" width="${bx2 - bx}" height="${by2 - by}" class="classicbox"/>`);
    g.push(`<text x="${bx + 5}" y="${by - 5}" class="classiclab">${t('ch.classic')}</text>`);
  }

  // --- критическая зона ---
  g.push(`<rect x="${px(RE_LAM)}" y="${Y0}" width="${px(RE_TURB) - px(RE_LAM)}" height="${Y1 - Y0}" class="critzone"/>`);
  g.push(`<text x="${(px(RE_LAM) + px(RE_TURB)) / 2}" y="${Y0 + 14}" class="zonelab" text-anchor="middle">${t('ch.crit')}</text>`);

  // --- ламинарная ветка ---
  {
    const pts = [];
    for (let Re = RE_MIN; Re <= RE_LAM; Re *= 1.03) {
      const f = 64 / Re;
      if (f > F_MAX || f < F_MIN) continue;
      pts.push(`${px(Re)},${py(f)}`);
    }
    if (64 / RE_LAM <= F_MAX && 64 / RE_LAM >= F_MIN) pts.push(`${px(RE_LAM)},${py(64 / RE_LAM)}`);
    if (pts.length > 1) g.push(`<polyline points="${pts.join(' ')}" class="laminar"/>`);
    const labRe = Math.max(RE_MIN * 1.4, 900);
    if (64 / labRe <= F_MAX) {
      const lt = t('ch.laminar');
      if (!clashes(px(labRe), py(64 / labRe) - 9, lt)) {
        g.push(`<text x="${px(labRe)}" y="${py(64 / labRe) - 9}" class="curvelab lam">${lt}</text>`);
        reserveLabel(px(labRe), py(64 / labRe) - 9, lt);
      }
    }
  }

  // --- семейство кривых шероховатости ---
  const usedY = [];                       // занятые позиции подписей, чтобы не наезжали
  const SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
  const supr = (s) => s.split('').map(c => SUP[c] || c).join('');
  const reEnd = Math.min(RE_MAX, RE_MAX0);
  EPS_CURVES.forEach((e, i) => {
    const col = blueFor(EPS_CURVES.length - 1 - i, EPS_CURVES.length);
    const pts = [];
    for (let lg = Math.log10(RE_TURB); lg <= Math.log10(RE_MAX) + 1e-9; lg += 0.02) {
      const Re = Math.pow(10, lg), f = colebrook(Re, e);
      if (f > F_MAX || f < F_MIN) continue;
      pts.push(`${px(Re)},${py(f)}`);
    }
    if (pts.length < 2) return;
    g.push(`<polyline points="${pts.join(' ')}" class="rough" stroke="${col}"/>`);
    const fEnd = colebrook(reEnd, e);
    if (fEnd < F_MIN || fEnd > F_MAX) return;
    const y = py(fEnd);
    if (usedY.some(u => Math.abs(u - y) < (CH.labgap || 9.5))) return;   // подпись бы наехала — пропускаем
    usedY.push(y);
    const txt = e >= 1e-3 ? String(e) : (() => {
      const [m, ex] = e.toExponential(0).split('e');
      return `${m}·10${supr(ex.replace('+', ''))}`;
    })();
    g.push(`<text x="${px(reEnd) + 6}" y="${y + 3.5}" class="epslab" fill="${col}">${txt}</text>`);
  });
  g.push(`<text x="${px(reEnd) + 6}" y="${Y0 + 2}" class="epshdr">ε/D</text>`);

  // --- гладкая труба ---
  {
    const pts = [];
    for (let lg = Math.log10(RE_TURB); lg <= Math.log10(RE_MAX) + 1e-9; lg += 0.02) {
      const Re = Math.pow(10, lg), f = colebrook(Re, 0);
      if (f < F_MIN || f > F_MAX) continue;
      pts.push(`${px(Re)},${py(f)}`);
    }
    if (pts.length > 1) g.push(`<polyline points="${pts.join(' ')}" class="smooth"/>`);
    const lRe = Math.min(1.5e6, RE_MAX / 4), lf = colebrook(lRe, 0);
    if (lf >= F_MIN && lf <= F_MAX) {
      const st2 = t('ch.smooth');
      if (!clashes(px(lRe), py(lf) + 16, st2, 'middle')) {
        g.push(`<text x="${px(lRe)}" y="${py(lf) + 16}" class="curvelab sm" text-anchor="middle">${st2}</text>`);
        reserveLabel(px(lRe), py(lf) + 16, st2, 'middle');
      }
    }
  }

  // --- граница автомодельности: k+ = 70 ---
  {
    const pts = [];
    for (const e of EPS_CURVES) {
      const fr = fullyRoughF(e);
      const Re = 70 / (e * Math.sqrt(fr / 8));
      if (Re < RE_TURB || Re > RE_MAX) continue;
      pts.push(`${px(Re)},${py(colebrook(Re, e))}`);
    }
    if (pts.length > 1) {
      g.push(`<polyline points="${pts.join(' ')}" class="fullrough"/>`);
      const mid = pts[Math.floor(pts.length / 2)].split(',');
      if (!extended) {
        const ft = t('ch.fullyRough');
        if (!clashes(+mid[0] + 8, +mid[1] - 8, ft)) {
          g.push(`<text x="${+mid[0] + 8}" y="${+mid[1] - 8}" class="curvelab fr">${ft}</text>`);
          reserveLabel(+mid[0] + 8, +mid[1] - 8, ft);
        }
      }
    }
  }

  // --- режим «все среды сразу» ---
  // Подпись собственной точки резервируем заранее, иначе разводка про неё не знает.
  if (S.showAll) {
    const reserved = [];
    if (R && isFinite(R.Re) && isFinite(R.f) && R.Re >= RE_MIN && R.Re <= RE_MAX
        && R.f >= F_MIN && R.f <= F_MAX) {
      const ux = px(R.Re), uy = py(R.f);
      reserved.push({ x0: ux - 20, x1: ux + 130, y0: uy - 24, y1: uy + 12 });
    }
    g.push(...scatterAll(R, reserved.concat(labelBoxes)));
  }

  // --- точка пользователя ---
  if (R && isFinite(R.Re) && isFinite(R.f)) {
    const inRange = R.Re >= RE_MIN && R.Re <= RE_MAX && R.f >= F_MIN && R.f <= F_MAX;
    if (inRange) {
      const x = px(R.Re), y = py(R.f);
      // призрак «новой трубы» при включённом старении
      if (S.age > 0 && !R.mat.deposit && R.mat.aging > 0) {
        const g0 = evaluate({ age: 0 });
        if (isFinite(g0.Re) && isFinite(g0.f)) {
          const x0 = px(g0.Re), y0 = py(g0.f);
          g.push(`<line x1="${x0}" y1="${y0}" x2="${x}" y2="${y}" class="agelink"/>`);
          g.push(`<circle cx="${x0}" cy="${y0}" r="4.5" class="ghost"/>`);
          g.push(`<text x="${x0}" y="${y0 + 18}" class="ghostlab" text-anchor="middle">${t('ch.new')}</text>`);
        }
      }
      // полоса неопределённости по шероховатости
      if (!R.pr.rheo && R.res.regime !== 'laminar') {
        const fLo = frictionFactor(R.Re, R.wall.epsLo / R.D).f;
        const fHi = frictionFactor(R.Re, R.wall.epsHi / R.D).f;
        if (isFinite(fLo) && isFinite(fHi) && fHi > fLo) {
          g.push(`<line x1="${x}" y1="${py(Math.min(fHi, F_MAX))}" x2="${x}" y2="${py(Math.max(fLo, F_MIN))}" class="errbar"/>`);
        }
      }
      g.push(`<circle cx="${x}" cy="${y}" r="8.5" class="pt-ring"/>`);
      g.push(`<circle cx="${x}" cy="${y}" r="5.5" class="pt"/>`);
      const lx = x > X1 - 150 ? x - 12 : x + 12;
      const anc = x > X1 - 150 ? 'end' : 'start';
      g.push(`<text x="${lx}" y="${y - 12}" class="ptlab" text-anchor="${anc}">f = ${nf(R.f, 4)}</text>`);
      g.push(`<text x="${lx}" y="${y - 0}" class="ptlab sub" text-anchor="${anc}">Re = ${fmt(R.Re, 3)}</text>`);
    } else {
      // стрелка к краю в сторону точки — куда именно она ушла
      const cx = Math.min(Math.max(px(R.Re), X0 + 12), X1 - 12);
      const cy = Math.min(Math.max(py(R.f), Y0 + 12), Y1 - 12);
      g.push(`<path d="M ${cx} ${cy} m -9 -9 l 18 18 m 0 -18 l -18 18" class="offmark"/>`);
      g.push(`<text x="${(X0 + X1) / 2}" y="${Y0 + 30}" class="offchart" text-anchor="middle">${t('ch.offchart', { re: fmt(R.Re, 3), f: fmt(R.f, 3) })}</text>`);
    }
  }

  // --- рамка и подписи осей ---
  g.push(`<rect x="${X0}" y="${Y0}" width="${X1 - X0}" height="${Y1 - Y0}" class="frame"/>`);
  g.push(`<text x="${(X0 + X1) / 2}" y="${CH.h - 14}" class="axtitle" text-anchor="middle">${t('ch.xaxis')}</text>`);
  g.push(`<text transform="translate(20 ${(Y0 + Y1) / 2}) rotate(-90)" class="axtitle" text-anchor="middle">${t('ch.yaxis')}</text>`);

  return `<svg viewBox="0 0 ${CH.w} ${CH.h}" id="chart" role="img" aria-label="${t('app.title')}">${g.join('')}</svg>`;
}

// Россыпь всех сред при текущей скорости и трубе.
// Точки почти всегда ложатся на одну кривую ε/D (труба-то одна), поэтому
// различаются они по горизонтали — по Re. Подписи разводим с выносками,
// иначе они схлопываются в нечитаемую кашу.
function scatterAll(R, reserved = []) {
  const v = R ? R.v : 2;
  const items = [];
  for (const fl of FLUIDS) {
    const pr = fl.props(fl.defT, fl.defP);
    if (pr.warn.some(w => w.lvl === 'critical')) continue;
    let Re, f;
    if (pr.rheo) {
      const nn = frictionNonNewtonian(pr.rho, v, R.D, pr.rheo);
      Re = nn.ReMR; f = nn.f;
    } else {
      Re = pr.rho * v * R.D / pr.mu;
      f = frictionFactor(Re, R.relEps).f;
    }
    if (!isFinite(Re) || !isFinite(f)) continue;
    if (Re < RE_MIN || Re > RE_MAX || f < F_MIN || f > F_MAX) continue;
    items.push({ name: fname(fl.id), x: px(Re), y: py(f) });
  }
  items.sort((a, b) => a.x - b.x);

  const placed = reserved.slice();          // занятые прямоугольники подписей
  const CHW = 5.4, H = 11.5;                // ширина символа и высота строки, px
  const OFFS = [-13, -25, -37, -49, -61, -73, 15, 27, 39, 51, 63, 75];
  const out = [];
  const X1 = CH.w - CH.mr;

  for (const it of items) {
    const w = it.name.length * CHW;
    let put = null;
    for (const dy of OFFS) {
      // при выносе влево/вправо держим подпись внутри поля
      let lx = it.x, anchor = 'middle';
      if (lx - w / 2 < CH.ml + 2) { lx = CH.ml + 2; anchor = 'start'; }
      else if (lx + w / 2 > X1 - 2) { lx = X1 - 2; anchor = 'end'; }
      const x0 = anchor === 'middle' ? lx - w / 2 : (anchor === 'start' ? lx : lx - w);
      const box = { x0, x1: x0 + w, y0: it.y + dy - H / 2, y1: it.y + dy + H / 2 };
      if (box.y0 < CH.mt || box.y1 > CH.h - CH.mb) continue;
      const clash = placed.some(p => !(box.x1 < p.x0 - 3 || box.x0 > p.x1 + 3 ||
                                       box.y1 < p.y0 || box.y0 > p.y1));
      if (!clash) { placed.push(box); put = { lx, anchor, dy }; break; }
    }
    out.push(`<circle cx="${it.x}" cy="${it.y}" r="3.5" class="scat"><title>${it.name}</title></circle>`);
    if (!put) continue;                     // места не нашлось — оставляем только точку
    const ly = it.y + put.dy;
    out.push(`<line x1="${it.x}" y1="${it.y}" x2="${put.lx}" y2="${ly + (put.dy < 0 ? 3 : -3)}" class="leader"/>`);
    out.push(`<text x="${put.lx}" y="${ly + 3}" class="scatlab" text-anchor="${put.anchor}">${it.name}</text>`);
  }
  return out;
}

function sourcesBlock(R) {

    ${has(mk + '.note') ? `<div class="fnote"><b>${mname(R.mat.id)}:</b> ${t(mk + '.note')}</div>` : ''}

const REGIME_KEY = ['laminar','critical','smooth','transitional','rough',
  'turbulent-nn','noflow','nofit','none','slip'];


// ---------------------------------------------------------------------------
//  <input type=range> sanitises the value it is given: it clamps to the bounds
//  and snaps to the step.  Three fields used to be sliders, so a permalink
//  written before the port carries values that were sanitised that way; the
//  same sanitisation is applied here so those links still land on the same
//  number.  Measured against the unported page, not assumed.
// ---------------------------------------------------------------------------
function snapRange(v, min, max, step) {
  if (!isFinite(v)) return min;
  let x = Math.min(Math.max(v, min), max);
  if (step > 0) {
    const dec = (String(step).split('.')[1] || '').length;
    x = +(min + Math.round((x - min) / step) * step).toFixed(dec);
    x = Math.min(Math.max(x, min), max);
  }
  return x;
}

/* §21: buildReport() lived here. It built a second, unpaginated A4 document
   into #report, stamped its own Diagram.report.attribution() into a
   position:fixed #dgc-attrib block and called window.print() on the live page.
   Everything it carried that the record did not — the chart, the loss table and
   the uncertainty band — is now a section of the record's own report
   (dgcSections above), so the second document, its 1 388 bytes of @media print
   rules, its #report host and its hand-rolled per-page attribution are all
   gone. One path: Diagram.report(). */
// пресеты — самые говорящие сценарии
const PRESETS = [
  { s: { fluid: 'air', t: 20, p: 1e5, mat: 'steel', dn: 100, flowMode: 'v', v: 15, age: 0 } },
  { s: { fluid: 'hfo', t: 60, p: 8e5, mat: 'steel', dn: 150, flowMode: 'v', v: 1.5, age: 0 } },
  { s: { fluid: 'lead', t: 450, p: 3e5, mat: 'inconel', dn: 300, flowMode: 'v', v: 1.8, age: 0 } },
  { s: { fluid: 'uf6', t: 70, p: 3000, mat: 'inconel', dn: 25, flowMode: 'v', v: 30, age: 0 } },
  { s: { fluid: 'milk', t: 4, p: 3e5, mat: 'electropol', dn: 50, flowMode: 'v', v: 2.0, age: 0 } },
  { s: { fluid: 'ketchup', t: 20, p: 6e5, mat: 'electropol', dn: 50, flowMode: 'v', v: 0.4, age: 0 } },
  { s: { fluid: 'water', t: 10, p: 6e5, mat: 'steel', dn: 300, flowMode: 'v', v: 1.5, age: 30 } },
  { s: { fluid: 'water', t: 60, p: 4e5, mat: 'scale', dn: 50, flowMode: 'Q', Q: 15, age: 0, thick: 2.5 } },
  { s: { fluid: 'concrete', t: 20, p: 60e5, mat: 'steel', dn: 125, flowMode: 'v', v: 0.5, L: 60, age: 0 } },
];
/* ===========================================================================
 *  THE SCREEN — tools.petrov.re/ui/v1
 *
 *  The maths above is untouched: evaluate(), reverseSolve(), frictionFactor(),
 *  the fluid and material databases, drawChart() and buildReport() are the same
 *  functions they were before the port.  What changed is that the page no longer
 *  owns a header, a layout, a language select, a theme button or a set of colour
 *  tokens; it declares fields, results, a stage and learn topics, and the shared
 *  framework renders them in the same place it renders every other tool.
 * =========================================================================== */

/* SI unit symbols are international in this tool — the results have always
   printed "bar", "m/s" and "m³/h" in every language (see UNIT above) — so the
   unit slot beside each field uses the same symbols. */
const U = { bar: UNIT.bar, mm: UNIT.mm, m: UNIT.m, ms: UNIT.ms, m3h: UNIT.m3h,
            pct: '%', degC: '°C', gu: 'm/s²', rho: 'kg/m³', nu: 'm²/s' };

/* Several labels ship with their unit appended ("Pressure, bar").  The unit has
   its own slot now (UI_FRAMEWORK_SPEC.md 6), so the tail is removed — and only
   when the tail really is one of the units this tool prints, in any of its seven
   languages, so no label is ever truncated by accident. */
const UNIT_TAIL = /,\s*(bar|бар|mm|мм|kg\/m³|кг\/м³|m²\/s|м²\/с|m³\/h|м³\/год|м³\/ч|m\/s|м\/с|m|м|%)\s*$/;
const lbl = (key) => t(key).replace(UNIT_TAIL, '');

/* fmt() returns "1.23·10<sup>-6</sup>" for very small and very large numbers.
   A result tile renders text, not markup, so the exponent is written with the
   real superscript characters — the same digits, the same number. */
const SUPCH = { '-': '⁻', '+': '', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴',
                '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
function fmtTxt(x, d) {
  return String(fmt(x, d)).replace(/<sup>(-?\d+)<\/sup>/g,
    (m, e) => e.split('').map(c => (SUPCH[c] !== undefined ? SUPCH[c] : c)).join(''));
}
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function nodeOf(html, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.innerHTML = html;
  return d;
}

/* ---- the drawing is built at the measured size (UI_FRAMEWORK_SPEC.md 10) ----
   drawChart() reads CH for its geometry, so the stage lends it the pixel size it
   measured and gives it straight back.  The A4 report keeps the classic
   940 x 580 field, byte for byte as before. */
function withChart(w, h, mr, fn) {
  const keep = { w: CH.w, h: CH.h, mr: CH.mr, labgap: CH.labgap };
  CH.w = w; CH.h = h; CH.mr = mr;
  /* the ε/D labels are 11 px tall wherever the chart is drawn, so the gap that
     decides whether the next one is dropped is 12 physical px.  The A4 sheet is
     still drawn at the classic 940 x 580 and keeps the original 9.5, so the
     printed artefact does not move. */
  CH.labgap = (w === 940 && h === 580) ? 9.5 : 12;
  try { return fn(); } finally { CH.w = keep.w; CH.h = keep.h; CH.mr = keep.mr; CH.labgap = keep.labgap; }
}

/* ---- state helpers -------------------------------------------------------- */

/* the declared defaults: exactly the state the page has always started from,
   including the values readUI() used to copy out of the markup */
function freshState() {
  return {

  };

/* Choosing a fluid has always reset the temperature and the pressure to that
   fluid's own defaults; the arithmetic is the markup's, kept to the digit. */
function applyFluidDefaults(s) {
  const f = FLUID_BY_ID[s.fluid];
  s.t = snapRange(f.defT, f.tMin, f.tMax, 1);
  s.p = +(f.defP / 1e5).toFixed(2) * 1e5;
}

let LAST = null;          /* { R, rv } of the last computed state */
let DRAWSEQ = 0;          /* bumped on every compute, so the stage knows */
let ui = null;
let stage = null;

function computeAll() {
  let R = evaluate();
  let rv = null;
  if (S.mode === 'reverse') {
    rv = reverseSolve();
    if (!rv.err) R = evaluate({ useDN: false, dCustom: rv.D });
  }
  LAST = { R: R, rv: rv };
  DRAWSEQ += 1;
  return LAST;
}

/* ---- results -------------------------------------------------------------- */

const TONE_OF = { noflow: 'bad', nofit: 'bad', none: 'bad', critical: 'warn', slip: 'warn' };

function buildResults() {
  const R = LAST.R, rv = LAST.rv;
  const rk = R.pr.slip ? 'slip' : (REGIME_KEY.includes(R.res.regime) ? R.res.regime : 'none');
  const nu = R.pr.mu / R.pr.rho;
  const tiles = [], nodes = [];

  /* the inverse task answers with a diameter; it leads, so the phone strip
     carries it */
  if (S.mode === 'reverse') {
    if (rv.err) {
      nodes.push(nodeOf('<div class="alert critical"><b>' + esc(t('ui.reverse')) + '</b>' + rv.err + '</div>'));
    } else {
      tiles.push({ label: t('res.reqD'), value: nf(rv.D * 1000, 1), unit: U.mm, tone: 'ok' });
      nodes.push(nodeOf('<p class="reqsub">' + t('res.reqDsub', {
        dn: rv.dn, id: DN[rv.dn], dp: nf(rv.dpAtDn / 1e5, 3),
        target: S.targetDp, solved: nf(rv.D * 1000, 1)
      }) + '</p>'));
    }
  }

  /* the six figures the tool has always shown, in the order it showed them */
  tiles.push(
    { label: t('res.Re'), value: fmtTxt(R.Re, 4), hint: R.pr.rheo ? t('res.ReGen') : null },
    { label: t('res.f'), value: R.f ? nf(R.f, 4) : '—', hint: R.pr.slip ? t('res.fSlip') : null, learn: 'friction' },
    { label: t('res.v'), value: nf(R.v, 2), unit: U.ms },
    { label: t('res.Q'), value: fmtTxt(R.Q * 3600, 3), unit: U.m3h, headline: false },
    { label: lbl('res.rho'), value: fmtTxt(R.pr.rho, 4), unit: U.rho, hint: t(R.pr.phase), headline: false, learn: 'properties' },
    { label: lbl('res.nu'), value: R.pr.rheo ? '—' : fmtTxt(nu, 3), unit: R.pr.rheo ? null : U.nu,
      hint: R.pr.rheo ? t('res.nuNone') : t('res.nuHint'), headline: false, learn: 'properties' }
  );
  if (R.res.kPlus != null) {
    tiles.push({ label: 'k⁺', headline: false, learn: 'friction',
      value: R.res.kPlus < 0.01 ? R.res.kPlus.toExponential(1) : nf(R.res.kPlus, 1) });
  }

  /* --- losses, exactly the table the print sheet uses --- */
  nodes.push(nodeOf('<h3 class="sect">' + esc(t('res.losses')) + '</h3>'
    + '<div class="tbl-wrap">' + lossTable(R) + '</div>'));

  /* --- the honest band --- */
  nodes.push(nodeOf('<div class="band"><div class="band-t">' + esc(t('res.bandTitle')) + '</div>'
    + '<div class="band-v dgu-tile-v">' + nf(R.band.lo / 1e5, 3) + ' — ' + nf(R.band.hi / 1e5, 3) + ' ' + UNIT.bar + '</div>'
    + '<div class="band-d">' + (R.pr.slip ? t('res.bandSlip') : t('res.bandDesc', {
      mat: mname(R.mat.id), lo: R.mat.range[0], hi: R.mat.range[1],
      age: (S.age > 0 && R.mat.aging && AQUEOUS.has(R.fl.id)) ? t('res.bandAge', { years: S.age }) : '',
      unc: ((R.pr.unc || 0) * 100).toFixed(0)
    })) + '</div></div>'));

  /* --- warnings, criticals first --- */
  const order = { critical: 0, warning: 1 };
  const ws = R.warn.slice().sort((a, b) => (order[a.lvl] ?? 2) - (order[b.lvl] ?? 2));
  if (ws.length) {
    nodes.push(nodeOf('<h3 class="sect">' + esc(t('res.warnings')) + '</h3>' + ws.map(w =>
      '<div class="alert ' + w.lvl + '"><b>' + (w.lvl === 'critical' ? '✕' : '!') + ' '
      + (w.srcK ? esc(t(w.srcK)) : '') + '</b>' + (w.text || tm(w)) + '</div>').join('')));
  }
  if (R.notes.length) {
    nodes.push(nodeOf('<h3 class="sect">' + esc(t('res.notes')) + '</h3><ul class="notes">'
      + R.notes.map(n => '<li>' + tm(n) + '</li>').join('') + '</ul>'));
  }
  nodes.push(nodeOf('<h3 class="sect">' + esc(t('res.sources')) + '</h3>' + sourcesBlock(R)));

  if (S.showTable) {
    nodes.push(nodeOf('<h3 class="sect">' + esc(t('res.tableTitle')) + '</h3>'
      + '<div class="tbl-wrap"><table class="tbl small"><tr><th>ε/D</th>'
      + [1e4, 1e5, 1e6, 1e7, 1e8].map(r => '<th>Re=10<sup>' + Math.log10(r) + '</sup></th>').join('') + '</tr>'
      + EPS_CURVES.filter((_, i) => i % 2 === 0).map(e => '<tr><td>' + e + '</td>'
        + [1e4, 1e5, 1e6, 1e7, 1e8].map(r => '<td>' + nf(colebrook(r, e), 4) + '</td>').join('') + '</tr>').join('')
      + '</table></div>'));
  }

  return {
    verdict: { tone: TONE_OF[rk] || 'ok', text: t('reg.' + rk) + ' — ' + t('reg.' + rk + '.d') },
    tiles: tiles,
    nodes: nodes
  };
}

/* the two subtotal rows of the loss table carry their weight, as they always
   have; the framework's table has no row class, which is what this replaces */
function markSumRows() {
  if (!ui || !ui.regions || !ui.regions.results) return;
  const want = [t('res.headTotal'), t('res.dpTotal')];
  ui.regions.results.querySelectorAll('.tbl tr').forEach(tr => {
    const c = tr.firstElementChild;
    if (c && want.indexOf(c.textContent.trim()) >= 0) tr.classList.add('sum');
  });
}

/* ---- fields --------------------------------------------------------------- */

function groupedSelect(list, valueOf, labelOf, getState) {
  return function (box, ctx, field) {
    const sel = document.createElement('select');
    const groups = {};
    for (const it of list) (groups[it.group] ||= []).push(it);
    sel.innerHTML = Object.keys(groups).map(g =>
      '<optgroup label="' + esc(t('g.' + g)) + '">' + groups[g].map(it =>
        '<option value="' + esc(valueOf(it)) + '">' + esc(labelOf(it)) + '</option>').join('')
      + '</optgroup>').join('');
    sel.value = getState(ctx.state);
    sel.setAttribute('aria-label', pickLabel(field.def.label));
    sel.addEventListener('change', () => field.commit(sel.value, true));
    box.appendChild(sel);
    field.__sel = sel;
  };
}
function pickLabel(l) { return typeof l === 'function' ? l() : String(l == null ? '' : l); }
/* A type:'custom' field owns its control, so the framework's syncControl leaves
   it alone; the panel puts the grouped selects back in step after a permalink,
   an example or a reset. */
function syncCustom(panel) {
  (panel.fields || []).forEach(f => {
    if (f.__sel) { const v = f.readState(); if (f.__sel.value !== String(v)) f.__sel.value = v; }
  });
}

function panelDefs() {
  const isGas = s => !!FLUID_BY_ID[s.fluid].gas;
  const aqueous = s => AQUEOUS.has(s.fluid);
  const deposit = s => !!MATERIAL_BY_ID[s.mat].deposit;

  return [{
    id: 'p-fluid', slot: 'inputs', title: () => t('ui.fluidSection'), learn: 'fluid',
    fields: [
      { id: 'f-fluid', key: 'fluid', type: 'custom', learn: 'fluid',
        label: () => t('ui.fluid') + ' ' + t('ui.fluidNonNewt'),
        render: groupedSelect(FLUIDS, f => f.id,
          f => fname(f.id) + (f.nonNewtonian ? ' ⁕' : ''), s => s.fluid),
        set: (v, s) => { s.fluid = v; applyFluidDefaults(s); } },
      { id: 'f-rheo', type: 'note', label: () => t('ui.rheoFlag'),
        visible: c => !!FLUID_BY_ID[c.state.fluid].nonNewtonian },
      { id: 'f-t', key: 't', type: 'range', label: () => t('ui.temp'), unit: U.degC,
        min: -273, max: 2000, step: 1, precision: 0, learn: 'properties',
        set: (v, s) => { const f = FLUID_BY_ID[s.fluid]; s.t = snapRange(v, f.tMin, f.tMax, 1); } },
      { id: 'f-p', key: 'p', type: 'number', label: () => lbl('ui.press'), unit: U.bar,
        step: 0.1, minDisplay: 0.0001, learn: 'pressure',
        get: s => s.p / 1e5, set: (v, s) => { s.p = v * 1e5; } }
    ],
    sync: (box, ctx, panel) => {
      syncCustom(panel);

/* ---- examples ------------------------------------------------------------- */
/* The nine scenarios, with the sentence that used to appear in a box above the
   chart after clicking one; as the example's own note it is readable before the
   click as well. */
function applyPreset(i) {
  const p = PRESETS[i];
  for (const k of Object.keys(p.s)) {
    const val = p.s[k];
    if (k === 'p') S.p = +(+(val / 1e5).toFixed(4)) * 1e5;
    else if (k === 't') { const f = FLUID_BY_ID[p.s.fluid]; S.t = snapRange(val, f.tMin, f.tMax, 1); }
    else if (k === 'flowMode') { /* handled below, as the markup did */ }
    else if (k === 'age') S.age = snapRange(val, 0, 60, 1);
    else if (k === 'thick') S.thick = snapRange(val, 0, 12, 0.1);
    else if (k in S) S[k] = val;
  }
  S.flowMode = p.s.flowMode || 'Q';
  S.useDN = true;
}
/* The old page put the scenario's sentence in a box above the chart once the
   button was pressed.  The button now carries a one-line summary built from the
   scenario itself, and pressing it still shows the sentence — through the shared
   notification surface, which is the framework's one place for that. */
function presetSummary(i) {
  const q = PRESETS[i].s, bits = [fname(q.fluid), mname(q.mat)];
  if (q.dn) bits.push('DN' + q.dn);
  bits.push(q.flowMode === 'v' ? nf(q.v, q.v < 1 ? 2 : 1) + ' ' + U.ms
                               : nf(q.Q, 0) + ' ' + U.m3h);
  bits.push(nf(q.t, 0) + ' ' + U.degC + ' / ' + nf(q.p / 1e5, q.p < 1e5 ? 3 : 0) + ' ' + U.bar);
  if (q.age) bits.push(q.age + ' a');
  if (q.thick) bits.push(nf(q.thick, 1) + ' ' + U.mm);
  return bits.join(' · ');
}
function exampleList() {
  return PRESETS.map((p, i) => ({
    label: () => t('pre.' + i + '.name'),
    note: () => presetSummary(i),
    apply: (s, app) => {
      applyPreset(i);
      if (app) { app.state = S; app.notify(t('pre.' + i + '.hint'), { kind: 'ok' }); }
    }
  }));
}

/* ---- the stage ------------------------------------------------------------ */

let stageFit = false;      /* false: labels physical, the field scrolls sideways */
function buildStage(app) {
  let drawnKey = '';
  const st = app.stage({
    caption: () => t('rep.chart'),
    minHeight: 320,
    a11y: () => {
      if (!LAST) return '';
      const R = LAST.R;
      const rk = R.pr.slip ? 'slip' : (REGIME_KEY.includes(R.res.regime) ? R.res.regime : 'none');
      return t('rep.chart') + '. ' + t('res.Re') + ' ' + fmtTxt(R.Re, 4) + ', '
        + t('res.f') + ' ' + (isFinite(R.f) ? nf(R.f, 4) : '—') + '. ' + t('reg.' + rk) + '.';
    },
    render: (size, st) => {
      /* A Moody chart is a five-decade log-log field with labelled curves; below
         the width at which its labels stop being physical it scrolls sideways
         rather than shrinking the type to four pixels, which is what the old
         width:100% SVG did on a phone. */
      const W = stageFit ? Math.max(Math.round(size.w), 300)
                         : Math.max(Math.round(size.w), 560);
      const H = Math.round(W * 580 / 940);
      const mr = W >= 800 ? 128 : 84;
      const key = W + '|' + DRAWSEQ + '|' + getLang() + '|' + stageFit
        + '|' + (DiagramUI.theme ? DiagramUI.theme.get() : '');
      if (key === drawnKey && st.body.firstChild) return;
      drawnKey = key;
      const svg = withChart(W, H, mr, () => drawChart(LAST ? LAST.R : null));
      const wrap = document.createElement('div');
      wrap.className = 'moody-chart';
      wrap.innerHTML = svg;
      const s = wrap.firstElementChild;
      if (s) { s.style.width = W + 'px'; s.style.height = H + 'px'; s.dataset.moodyMr = String(mr); }
      st.body.textContent = '';
      st.body.appendChild(wrap);bindMoodyDrag(st);
    }
  });
  /* UI_FRAMEWORK_SPEC.md 10: a stage that does not fit exposes Fit in its
     corner.  Fit trades the physical label size for the whole field at once —
     the choice the old page made silently, and always, on every screen. */
  st.addTool({
    icon: '⤢', title: () => app.t('fit'),
    run: () => { stageFit = !stageFit; st.schedule(); }
  });
  return st;
}


/* Dragging the operating point edits the real diameter/velocity inputs. The
   inverse uses the same friction law as evaluate(); the marker is therefore a
   control of the model, not a cosmetic overlay. Non-Newtonian/slip regimes are
   intentionally read-only because a single (Re,f) point does not uniquely
   identify their independent inputs. */
function bindMoodyDrag(st){
  const body=st.body;if(!body||body.__moodyDragBound)return;body.__moodyDragBound=true;let dragging=false;
  const svgNow=()=>body.querySelector('svg#chart');
  const pointClient=()=>{const svg=svgNow();if(!svg||!LAST||!LAST.R)return null;const R=LAST.R;if(!isFinite(R.Re)||!isFinite(R.f))return null;const vb=svg.viewBox.baseVal,rr=svg.getBoundingClientRect(),mr=+(svg.dataset.moodyMr||128);const x=CH.ml+(Math.log10(R.Re)-Math.log10(RE_MIN))/(Math.log10(RE_MAX)-Math.log10(RE_MIN))*(vb.width-CH.ml-mr),y=CH.mt+(Math.log10(F_MAX)-Math.log10(R.f))/(Math.log10(F_MAX)-Math.log10(F_MIN))*(vb.height-CH.mt-CH.mb);return{x:rr.left+x/vb.width*rr.width,y:rr.top+y/vb.height*rr.height};};
  const editable=()=>LAST&&LAST.R&&!LAST.R.pr.rheo&&!LAST.R.pr.slip;
  const target=e=>{const svg=svgNow();if(!svg)return null;const vb=svg.viewBox.baseVal,rr=svg.getBoundingClientRect(),mr=+(svg.dataset.moodyMr||128),xx=(e.clientX-rr.left)/rr.width*vb.width,yy=(e.clientY-rr.top)/rr.height*vb.height,x0=CH.ml,x1=vb.width-mr,y0=CH.mt,y1=vb.height-CH.mb;if(xx<x0||xx>x1||yy<y0||yy>y1)return null;const lr=Math.log10(RE_MIN)+(xx-x0)/(x1-x0)*(Math.log10(RE_MAX)-Math.log10(RE_MIN)),lf=Math.log10(F_MAX)-(yy-y0)/(y1-y0)*(Math.log10(F_MAX)-Math.log10(F_MIN));return{Re:10**lr,f:10**lf};};
  const apply=e=>{const q=target(e),R=LAST&&LAST.R;if(!q||!R||!editable())return;let D=R.D;
    if(q.Re>RE_LAM&&R.wall.eps>0){let lo=1e-9,hi=.25;const fs=frictionFactor(q.Re,lo).f,fr=frictionFactor(q.Re,hi).f;if(q.f<=fs)lo=1e-9;else if(q.f>=fr)lo=hi;else{for(let i=0;i<42;i++){const m=Math.sqrt(lo*hi),fm=frictionFactor(q.Re,m).f;if(fm<q.f)lo=m;else hi=m;}lo=Math.sqrt(lo*hi);}D=Math.max(.001,Math.min(10,R.wall.eps/Math.max(lo,1e-9)));}
    const mat=MATERIAL_BY_ID[S.mat],D0=mat.deposit?D+2*(S.thick||mat.defThick||1)*1e-3:D,vel=q.Re*R.pr.mu/(R.pr.rho*Math.max(D,1e-6));S.useDN=false;S.dCustom=Math.max(.001,Math.min(10,D0));S.flowMode='v';S.v=Math.max(1e-5,Math.min(500,vel));ui.sync();ui.run();};
  body.addEventListener('pointerdown',e=>{if(e.button!==0||!editable())return;const p=pointClient();if(!p||Math.hypot(e.clientX-p.x,e.clientY-p.y)>16)return;dragging=true;body.setPointerCapture?.(e.pointerId);body.style.cursor='grabbing';e.preventDefault();});
  body.addEventListener('pointermove',e=>{if(dragging){apply(e);e.preventDefault();return;}const p=editable()?pointClient():null;body.style.cursor=p&&Math.hypot(e.clientX-p.x,e.clientY-p.y)<16?'grab':'';});
  const up=e=>{if(!dragging)return;dragging=false;try{body.releasePointerCapture?.(e.pointerId)}catch(_e){}body.style.cursor='';};body.addEventListener('pointerup',up);body.addEventListener('pointercancel',up);
}

/* the shared chrome lives in <body>, or in the app's own dock below md; a
   rebuild removes the app node, so the chrome is parked first */
function rebuildKeepingChrome(a) {
  const kept = ['dgc-bar', 'eng-disc-badge', 'dgc-menu', 'dgc-notes']
    .map(id => document.getElementById(id)).filter(Boolean);
  const docked = document.documentElement.getAttribute('data-dgu-chrome') === 'flow';
  kept.forEach(n => document.body.appendChild(n));
  a.rebuild();
  const live = DiagramUI.current;
  const dock = (docked && live && live.node) ? live.node.querySelector('.dgu-chromedock') : null;
  if (dock) { kept.forEach(n => dock.appendChild(n)); dock.hidden = false; }
  try { DiagramUI.measure(); } catch (e) { /* measurement is advisory */ }
}

function switchLangState(code) {
  setLang(code); S.lang = code;
  document.documentElement.lang = code;
  document.title = t('app.title');
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', code);
    history.replaceState(null, '', u);
  } catch (e) { /* file:// — the address is left alone */ }
  if (SITE6.indexOf(code) >= 0) {
    try { localStorage.setItem('diagram_site_lang', code); localStorage.setItem('diagram_lang', code); } catch (e) { /* private mode */ }
    try { if (window.Diagram) Diagram.setLang(code); } catch (e) { /* chrome only */ }
  }
}

function patchLanguage(app) {
  const proto = Object.getPrototypeOf(app);
  if (!proto.__moodyLang) {
    proto.__moodyLang = true;
    proto.setLang = function (l) {
      if (TOOL_LANGS.indexOf(l) < 0) return this.lang;
      switchLangState(l);
      this.lang = l;
      rebuildKeepingChrome(this);
      return l;
    };
  }
  const sels = app.head ? app.head.querySelectorAll('select') : [];
  for (let i = 0; i < sels.length; i++) {
    const sel = sels[i];
    let isLang = sel.options.length > 0;
    for (let j = 0; j < sel.options.length; j++) {
      if (SITE6.indexOf(sel.options[j].value) < 0) isLang = false;
    }
    if (!isLang) continue;
    for (let j = 0; j < sel.options.length; j++) sel.options[j].text = LANG_NATIVE7[sel.options[j].value];
    if (!sel.querySelector('option[value="ru"]')) {
      const o = document.createElement('option');
      o.value = 'ru'; o.text = LANG_NATIVE7.ru;
      sel.appendChild(o);
    }
    sel.value = getLang();
  }
}

/* the one re-render entry point the data layer calls: a permalink arriving, a
   handoff payload being applied, a state being pushed in from outside */
function refresh(langChanged) {
  if (!ui) { if (FB) fbMount(); return; }
  if (langChanged) { rebuildKeepingChrome(ui); return; }
  ui.sync(); ui.run();
}

function buildApp() {
  ui = DiagramUI.app({
    id: 'moodydiagram', mount: '#app',
    layout: 'calculator', compute: 'live',
    lang: getLang(),
    state: S, defaults: freshState,
    units: false, history: false,
    strings: frameworkStrings(),
    title: () => t('app.title'),
    subtitle: () => t('app.tagline'),
    learn: learnDef(),
    panels: panelDefs(),
    footer: buildFooter,
    on: {
      compute: () => {
        computeAll();
        if (stage) stage.schedule();
        const out = buildResults();
        setTimeout(markSumRows, 0);
        return out;
      },
      reset: (s, a) => {
        const lang = S.lang;
        Object.keys(S).forEach(k => { delete S[k]; });
        Object.assign(S, freshState());
        S.lang = lang;
        if (a) a.state = S;
      },
      ready: (a) => {
        if (a.__moodyBuilt) return;
        a.__moodyBuilt = true;
        patchLanguage(a);
        a.examples(exampleList());
        /* the placement law: Reset in the inputs footer, secondary weight */
        a.panel({
          slot: 'inputs', id: 'p-reset',
          render: (box) => {
            const row = document.createElement('div');
            row.className = 'dgu-panel-actions';
            row.appendChild(a.actionButton(a.resetAction()));
            box.appendChild(row);
          }
        });
        stage = buildStage(a);
        a.sync(); a.run();
      }
    }
  });
  ui.ready();
}

let FB = null;
function fbSet(key, v) { S[key] = v; fbRefresh(); }

function fbField(f, host) {
  const ctx = { state: S };
  if (f.visible && !f.visible(ctx)) return;
  const wrap = document.createElement('div');
  wrap.className = 'fb-f';
  const id = f.id + '-fb';
  const text = pickLabel(f.label);
  if (f.type === 'note') { wrap.className = 'fb-hint'; wrap.textContent = text; host.appendChild(wrap); return; }
  const lab = document.createElement('label');
  lab.setAttribute('for', id); lab.textContent = text;
  if (f.unit) lab.textContent += ' (' + f.unit + ')';
  wrap.appendChild(lab);
  const read = () => (f.get ? f.get(S) : S[f.key]);
  const write = (v) => { if (f.set) f.set(v, S); else S[f.key] = v; fbRefresh(); };
  let ctl;
  if (f.type === 'custom') {
    const box = document.createElement('div');
    f.render(box, ctx, { commit: v => write(v), def: f });
    ctl = box.firstElementChild;
  } else if (f.type === 'select') {
    ctl = document.createElement('select');
    (f.options()).forEach(o => {
      const op = document.createElement('option');
      op.value = o[0]; op.text = o[1]; ctl.appendChild(op);
    });
    ctl.value = read();
    ctl.addEventListener('change', () => {
      const opts = f.options();
      let m = ctl.value;
      for (const o of opts) if (String(o[0]) === ctl.value) m = o[0];
      write(m);
    });
  } else if (f.type === 'toggle') {
    ctl = document.createElement('input'); ctl.type = 'checkbox'; ctl.checked = !!read();
    ctl.addEventListener('change', () => write(ctl.checked));
  } else {
    ctl = document.createElement('input');
    ctl.type = f.type === 'range' ? 'range' : 'number';
    if (f.step != null) ctl.step = f.step;
    if (f.type === 'range') { ctl.min = f.min; ctl.max = f.max; }
    if (f.id === 'f-t') { const fl = FLUID_BY_ID[S.fluid]; ctl.min = fl.tMin; ctl.max = fl.tMax; }
    if (f.minDisplay != null) ctl.min = f.minDisplay;
    const val = read();
    ctl.value = f.precision != null ? (+val).toFixed(f.precision) : String(val);
    ctl.addEventListener('change', () => write(parseFloat(ctl.value)));
    if (f.type === 'range') ctl.addEventListener('input', () => write(parseFloat(ctl.value)));
  }
  if (ctl) {
    ctl.id = id;
    if (f.disabled && f.disabled(ctx)) ctl.disabled = true;
    wrap.appendChild(ctl);
  }
  host.appendChild(wrap);
}

function boot() {
  /* readUI() used to copy the markup's default bore into the state on the first
     pass; the state carries it itself now, so a permalink made on the first
     screen is the same object it always was */
  if (S.dCustom == null) S.dCustom = 0.1;
  const initial = detectLang();
  setLang(initial); S.lang = initial;
  document.documentElement.lang = initial;
  document.title = t('app.title');
  if (!window.DiagramUI || DiagramUI.api !== 'tools.petrov.re/ui/v1') {
    /* Degrade honestly: the same fields, the same maths, the same chart, the
       same results, the same permalink and the same exports — no framework.
       The data layer goes first, so the shared bar stands even if the fallback
       renderer itself were to fail. */
    dgcInit();
    fbMount();
    window.__moodydiagram = { ui: null, state: () => S, compute: computeAll };
    return;
  }
  buildApp();
  dgcInit();
  window.__moodydiagram = { ui: ui, state: () => S, compute: computeAll };
}

    dp_friction: 'Pa', dp_elevation: 'Pa', dp_total: 'Pa', pump_power: 'W',
    dp_band_lo: 'Pa', dp_band_hi: 'Pa'
  };
  const outputs = {
    velocity: R.v, volumetric_flow: R.Q, mass_flow: R.Q * R.pr.rho,
    Reynolds: R.Re, friction_factor: R.f, regime: R.res.regime,
    relative_roughness: R.relEps, kinematic_viscosity: nu,
    head_major: R.hMaj, head_minor: R.hMin, head_total: R.hF,
    dp_friction: R.dpFric, dp_elevation: R.dpElev, dp_total: R.dpTot,
    pump_power: R.power, dp_band_lo: R.band.lo, dp_band_hi: R.band.hi
  };
  const eqs = [
    'Re = rho v D / mu',
    'Colebrook-White: 1/sqrt(f) = -2 log10( (eps/D)/3.7 + 2.51/(Re sqrt(f)) ), solved by Serghides + Newton refinement',
    'laminar branch Re < 2300: f = 64/Re; 2300 <= Re < 4000: linear blend of the local laminar and Colebrook values',
    'roughness Reynolds number k+ = (eps/D) Re sqrt(f/8): smooth k+ < 5, fully rough k+ > 70',
    'Darcy-Weisbach: h_major = f (L/D) v^2/(2 g);  h_minor = SUM K v^2/(2 g)',
    'dp_friction = rho g (h_major + h_minor);  dp_elevation = rho g dz;  dp_total = dp_friction + dp_elevation',
    'hydraulic power = Q dp_total / eta'
  ];
  if (R.pr.rheo) eqs.push('non-Newtonian power law: Metzner-Reed Re_MR = rho v^(2-n) D^n / (8^(n-1) K ((3n+1)/(4n))^n), friction from Dodge-Metzner');
  if (R.pr.slip) eqs.push('wall-slip (pumped concrete), Kaplan tribology: dp/L = (4/D)(a v + b)');
  const d = I18N_REC[getLang()] || I18N_REC.en;
  const warn = R.warn.map(w => (w.lvl === 'critical' ? '! ' : '') + stripTags(w.text || tm(w)));
  return {
    inputs: inputs, outputs: outputs, units: units,
    model: { equations: eqs, ranges: d.rg, notes: d.nt.concat(R.notes.map(n => stripTags(tm(n)))) },
    warnings: warn
  };
}
function stripTags(s) { return String(s == null ? '' : s).replace(/<[^>]*>/g, ''); }
/* The record stores the flow regime as the word the classifier uses. Printed
   straight, a Dutch document read "smooth". The engine translates a value when
   the profile hands it the map; the classifier's own words are the keys. */
const REGIME = {
  laminar:{en:"laminar",uk:"ламінарний",de:"laminar",nl:"laminair",fr:"laminaire",es:"laminar",pl:"laminarny"},
  critical:{en:"critical zone",uk:"критична зона",de:"kritischer Bereich",nl:"kritieke zone",fr:"zone critique",es:"zona crítica",pl:"strefa krytyczna"},
  smooth:{en:"hydraulically smooth",uk:"гідравлічно гладкий",de:"hydraulisch glatt",nl:"hydraulisch glad",fr:"hydrauliquement lisse",es:"hidráulicamente liso",pl:"hydraulicznie gładki"},
  transitional:{en:"transitional",uk:"перехідний",de:"Übergangsbereich",nl:"overgangsgebied",fr:"transitoire",es:"transitorio",pl:"przejściowy"},
  rough:{en:"fully rough",uk:"цілком шорсткий",de:"vollrau",nl:"volledig ruw",fr:"pleinement rugueux",es:"completamente rugoso",pl:"w pełni szorstki"},
  noflow:{en:"no flow",uk:"немає потоку",de:"kein Durchfluss",nl:"geen stroming",fr:"pas d'écoulement",es:"sin flujo",pl:"brak przepływu"},
  nofit:{en:"outside the fitted range",uk:"поза діапазоном апроксимації",de:"außerhalb des Anpassungsbereichs",nl:"buiten het aangepaste bereik",fr:"hors de la plage ajustée",es:"fuera del rango ajustado",pl:"poza dopasowanym zakresem"}
};
function dgcReportProfile(rec, ctx) {
  const own = { values: { regime: REGIME } };
  /* The document said no acceptance criterion had been supplied. There is one:
     the friction factor is only as good as the law it came from, and between
     Re 2000 and 4000 no law is fitted. The title and the regime word come from
     the report's own vocabulary, so no text is added to this tool. */
  const R = dgcEval();
  if (R && isFinite(R.Re)) {
    const rg = R.res && R.res.regime;
    const bad = !!(R.res && R.res.uncertain) || rg === 'critical' || rg === 'nofit';
    own.checks = [{
      status: bad ? 'attention' : 'pass',
      title: ctx.label('regime'),
      actual: 'Re = ' + ctx.value(R.Re, '-') + ' \u00b7 ' + ctx.value(REGIME[rg] || rg, '-'),
      criterion: 'Re < 2000 \u00b7 Hagen\u2013Poiseuille; 2000\u20134000 \u00b7 \u2014; Re > 4000 \u00b7 Colebrook\u2013White',
      basis: 'Colebrook (1939); Moody (1944)'
    }];
  }
  return own;
}
function dgcSections() {
  const R = dgcEval();
  /* The Reynolds number, the friction factor, the velocity, the flow and the
     density are record outputs and are printed in the results table. Repeated
     here they came out at a second rounding -- 66.960 against 66958 -- and in
     the record's ASCII units. */
  /* §21 ONE PATH TO PAPER. This tool used to build a second A4 document of its
     own (#report + buildReport() + window.print()) whose whole reason to exist
     was that it "carries the chart, the full loss table, the band, every
     warning and every source" — things the record's report did not have. The
     answer was to give the record those things, not to keep a second document:
     the warnings and the notes were already in the record, and the three that
     were not are added below.
     The chart travels as INLINE SVG, not as a PNG, and that is deliberate:
     drawChart() already returns <svg> markup, diagram-common sanitises it, and
     an inline SVG lays out synchronously — so the report's pager measures it
     and breaks the page correctly. A data: URL <img> would not (see the note in
     heat_exchangers.html's dgcSections, and fastenergrades' clipped page 2). */
  const b = UNIT.bar, h = t('res.mHead');
  const loss = [[R.pr.slip ? t('res.majorSlip') : t('res.major'), nf(R.hMaj, 2) + ' ' + h]];
  if (!R.pr.slip) loss.push([t('res.minor', { k: S.sumK }), nf(R.hMin, 2) + ' ' + h]);
  loss.push([t('res.headTotal'), nf(R.hF, 2) + ' ' + h]);
  loss.push([t('res.dpFric'), nf(R.dpFric / 1e5, 3) + ' ' + b]);
  if (S.dz !== 0) loss.push([t('res.dpElev', { dz: (S.dz > 0 ? '+' : '') + S.dz }), nf(R.dpElev / 1e5, 3) + ' ' + b]);
  loss.push([t('res.dpTotal'), nf(R.dpTot / 1e5, 3) + ' ' + b]);
  loss.push([t('res.power', { eta: (S.eta * 100).toFixed(0) }), fmt(R.power / 1000, 3) + ' ' + UNIT.kW]);
  const bandTxt = t('res.bandTitle') + ': ' + nf(R.band.lo / 1e5, 3) + ' — ' + nf(R.band.hi / 1e5, 3) + ' ' + b
    + ' · ' + stripTags(R.pr.slip ? t('res.bandSlip') : t('res.bandDesc', {
        mat: mname(R.mat.id), lo: R.mat.range[0], hi: R.mat.range[1],
        age: (S.age > 0 && R.mat.aging && AQUEOUS.has(R.fl.id)) ? t('res.bandAge', { years: S.age }) : '',
        unc: ((R.pr.unc || 0) * 100).toFixed(0) }));
  /* Every row of `loss` is a record output printed in the results table; the
     uncertainty band under it is not, so the band travels with the chart. */
  void loss;
  return [{ title: t('rep.chart'), svg: { markup: drawChart(R), width: '150mm' }, notes: [bandTxt] },
          { title: t('res.sources'), text: stripTags(sourcesBlock(R)) }];
}
function fmtPlain(x) { return isFinite(x) ? (Math.abs(x) >= 1e6 || (x !== 0 && Math.abs(x) < 1e-3) ? x.toExponential(4) : String(+x.toPrecision(6))) : '—'; }

/* ---- cross-tool handoff (SI base units only, FRAMEWORK_V2_SPEC.md 1.5) ---- */
function dgcHandoffBuild() {
  const R = dgcEval();
  if (!R || !isFinite(R.dpTot)) return null;
  const q = {
    T: { value: S.t + 273.15, unit: 'K' },
    p: { value: S.p, unit: 'Pa' },
    rho: { value: R.pr.rho, unit: 'kg/m3' },
    Vdot: { value: R.Q, unit: 'm3/s' },
    mdot: { value: R.Q * R.pr.rho, unit: 'kg/s' },
    D: { value: R.D, unit: 'm' },
    L: { value: S.L, unit: 'm' },
    dp: { value: R.dpTot, unit: 'Pa' }
  };
  if (isFinite(R.Re)) q.Re = { value: R.Re, unit: '-' };
  if (isFinite(R.f)) q.f_darcy = { value: R.f, unit: '-' };
  return { quantities: q };
}
function dgcHandoffApply(payload) {
  const q = (payload && payload.quantities) || {};
  const accepted = [], ignored = [];
  const f = FLUID_BY_ID[S.fluid];
  if (q.T && isFinite(q.T.value)) {
    const c = q.T.value - 273.15;
    if (c >= f.tMin && c <= f.tMax) { S.t = snapRange(Math.round(c), f.tMin, f.tMax, 1); accepted.push('T'); }
    else { ignored.push('T'); Diagram.notify(tRec('hoTRange', { c: c.toFixed(1), lo: f.tMin, hi: f.tMax }), 'warn'); }
  }
  if (q.p && isFinite(q.p.value) && q.p.value > 0) {
    S.p = +(q.p.value / 1e5).toFixed(4) * 1e5; accepted.push('p');
  }
  if (q.Vdot && isFinite(q.Vdot.value) && q.Vdot.value > 0) {
    S.flowMode = 'Q'; S.normalFlow = false;
    S.Q = +(q.Vdot.value * 3600).toFixed(4); accepted.push('Vdot');
  }
  Object.keys(q).forEach(k => { if (['T', 'p', 'Vdot'].indexOf(k) < 0) ignored.push(k); });
  refresh(false);
  return { accepted: accepted, ignored: ignored };
}
function tRec(k, p) {
  const d = I18N_REC[getLang()] || I18N_REC.en;
  let s = d[k] || I18N_REC.en[k] || k;
  for (const kk in (p || {})) s = s.split('{' + kk + '}').join(p[kk]);
  return s;
}

/* ---- Python export: the hydraulics of the state shown ---- */
const PY_MOODY = `RE_LAM = 2300.0     # top of the laminar branch
RE_TURB = 4000.0    # bottom of fully developed turbulence


def colebrook(re, rel_eps):
    """Darcy friction factor from Colebrook-White (Serghides start, Newton refinement)."""
    if not (re > 0) or not (rel_eps >= 0) or rel_eps > 0.5:
        return float("nan")
    a = -2.0 * math.log10(rel_eps / 3.7 + 12.0 / re)
    b = -2.0 * math.log10(rel_eps / 3.7 + 2.51 * a / re)
    c = -2.0 * math.log10(rel_eps / 3.7 + 2.51 * b / re)
    try:
        x = a - (b - a) ** 2 / (c - 2.0 * b + a)
    except ZeroDivisionError:
        x = a
    if not math.isfinite(x) or x <= 0:
        x = a
    for _ in range(40):
        u = rel_eps / 3.7 + 2.51 * x / re
        g = x + 2.0 * math.log10(u)
        dg = 1.0 + (2.0 / math.log(10.0)) * (2.51 / re) / u
        step = g / dg
        x -= step
        if abs(step) < 1e-13:
            break
    return 1.0 / (x * x)


def friction_factor(re, rel_eps):
    """(f, regime) with the laminar / critical / turbulent branches of the page."""
    if not (re > 0):
        return float("nan"), "none"
    if re < RE_LAM:
        return 64.0 / re, "laminar"
    if re < RE_TURB:
        tt = (re - RE_LAM) / (RE_TURB - RE_LAM)
        return (64.0 / re) * (1.0 - tt) + colebrook(re, rel_eps) * tt, "critical"
    f = colebrook(re, rel_eps)
    k_plus = rel_eps * re * math.sqrt(f / 8.0)
    if k_plus < 5:
        regime = "smooth"
    elif k_plus > 70:
        regime = "rough"
    else:
        regime = "transitional"
    return f, regime


def hydraulics(rho, mu, d_in, eps, v, length, sum_k, dz, g, eta):
    """Reynolds number, friction factor, heads, pressure drops and pump power."""
    re = rho * v * d_in / mu
    rel_eps = eps / d_in
    f, regime = friction_factor(re, rel_eps)
    h_major = f * (length / d_in) * v * v / (2.0 * g)
    h_minor = sum_k * v * v / (2.0 * g)
    h_total = h_major + h_minor
    dp_fric = rho * g * h_total
    dp_elev = rho * g * dz
    return {"Reynolds": re, "relative_roughness": rel_eps, "friction_factor": f,
            "regime": regime, "head_major": h_major, "head_minor": h_minor,
            "head_total": h_total, "dp_friction": dp_fric, "dp_elevation": dp_elev,
            "dp_total": dp_fric + dp_elev}


def uncertainty_band(rho, mu, d_in, v, length, sum_k, g, eps_lo, eps, eps_hi, unc):
    """Pressure-drop band from the roughness range and the property uncertainty."""
    vals = []
    for e in (eps_lo, eps, eps_hi):
        for m_mul in (1.0 - unc, 1.0, 1.0 + unc):
            re_x = rho * v * d_in / (mu * m_mul)
            f_x = friction_factor(re_x, e / d_in)[0]
            vals.append(rho * g * (f_x * (length / d_in) + sum_k) * v * v / (2.0 * g))
    return min(vals), max(vals)


def compute():
    area = math.pi * DIAMETER_INNER * DIAMETER_INNER / 4.0
    if FLOW_MODE == "Q":
        q = FLOW_Q_M3H / 3600.0
        v = q / area
    else:
        v = FLOW_V_MS
        q = v * area
    out = hydraulics(DENSITY_RHO, VISCOSITY_MU, DIAMETER_INNER, ROUGHNESS_EPS, v,
                     LENGTH_L, SUM_K, ELEVATION_DZ, GRAVITY_G, PUMP_EFFICIENCY)
    out["velocity"] = v
    out["volumetric_flow"] = q
    out["mass_flow"] = q * DENSITY_RHO
    out["kinematic_viscosity"] = VISCOSITY_MU / DENSITY_RHO
    out["pump_power"] = q * out["dp_total"] / PUMP_EFFICIENCY
    lo, hi = uncertainty_band(DENSITY_RHO, VISCOSITY_MU, DIAMETER_INNER, v, LENGTH_L,
                              SUM_K, GRAVITY_G, ROUGHNESS_EPS_LO, ROUGHNESS_EPS,
                              ROUGHNESS_EPS_HI, PROPERTY_UNCERTAINTY)
    out["dp_band_lo"] = lo
    out["dp_band_hi"] = hi
    return out`;
function dgcPython() {
  const R = dgcEval();
  if (!R || !isFinite(R.dpTot)) return null;
  if (R.pr.rheo || R.pr.slip) return null;   // non-Newtonian / wall-slip models are not exported
  if (S.flowMode === 'Q' && S.normalFlow && R.fl.gas) return null;  // normal-m3 conversion uses the fluid database
  return {
    code: PY_MOODY, requires: [],
    scope: 'the hydraulic calculation of the state shown: Reynolds number, the Colebrook-White friction factor with the laminar/critical/turbulent branches, the Darcy-Weisbach and minor losses, the elevation term, the pump power and the uncertainty band. The fluid density and viscosity and the wall roughness are taken as constants exactly as this page computed them from its fluid and material database at the temperature and pressure shown; that database itself is NOT reproduced by this script',
    selftest: { tolerance: 1e-10,
      note: 'the script re-evaluates the same closed-form hydraulics in double precision from the recorded fluid properties' }
  };
}
function dgcInit() {
  if (!window.Diagram) return;
  window.Diagram.init({
    id: 'moodydiagram', file: 'moodydiagram.html',
    state: { serialize: dgcState, deserialize: dgcApplyState },
    record: dgcRecord,
    python: dgcPython,
    report: { profile: dgcReportProfile, sections: dgcSections },
    handoff: {
      provides: ['T', 'p', 'rho', 'Vdot', 'mdot', 'D', 'L', 'dp', 'Re', 'f_darcy'],
      accepts: ['T', 'p', 'Vdot'],
      build: dgcHandoffBuild, apply: dgcHandoffApply
    }
  });
}
