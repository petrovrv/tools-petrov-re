    formBody.appendChild(h('h3', { class: 'pw-h', text: (STEPS.indexOf(stepName) + 1) + '. ' + t(stepName[1], l) }));
    var box = h('div', { class: 'dgu-fields' });
    formBody.appendChild(box);
    if (curStep === 'work') {
      box.appendChild(selectField('type', t('f_type', l), Object.keys(EFF.types).map(function (k) { return [k, typeLabel(k, EFF, l)]; }), { structural: true }));
      var pk = EFF.packs.filter(function (p) { return p.id === EFF.typePack[state.type]; })[0] || EFF.packs[0];
      box.appendChild(h('p', { class: 'pw-p', text: fill(t('pack_note', l), { p: tx(pk.label, l), v: pk.version }) }));
      box.appendChild(textField('work.zone', t('f_zone', l)));
      box.appendChild(textField('work.equipment', t('f_equipment', l)));
      box.appendChild(textField('work.description', t('f_description', l), { area: true }));
      box.appendChild(textField('work.jsa', t('f_jsa', l)));
      box.appendChild(h('h4', { class: 'pw-sub', text: t('f_energy', l) }));
      var eg = h('div', { class: 'pw-grid' });
      var tyE = (EFF.types[state.type] || {}).energy || [];
      ENERGY.forEach(function (e) {
        if (!state.work.energy) state.work.energy = {};
        var id = 'pw-energy-' + e, fixed = tyE.indexOf(e) >= 0;
        var cb = h('input', { type: 'checkbox', id: id, disabled: fixed });
        cb.checked = fixed || state.work.energy[e] === true;
        cb.addEventListener('change', function () { if (cb.checked) state.work.energy[e] = true; else delete state.work.energy[e]; changed(false); });
        eg.appendChild(h('div', { class: 'pw-check' }, [cb, h('label', { for: id, text: t('en_' + e, l) + ' (' + e + ')' })]));
      });
      box.appendChild(eg);
    } else if (curStep === 'roles') {
      box.appendChild(h('p', { class: 'pw-p', text: t('roles_note', l) }));
      var grid = h('div', { class: 'pw-grid' });
      ty.roles.forEach(function (r) {
        var rd = EFF.roles[r];
        if (r !== 'worker' && !state.roles[r]) state.roles[r] = { who: '', ok: false };
        var card = h('div', { class: 'pw-card', 'data-pw-card': r }, [
          h('div', { class: 'pw-card-t', text: tx(rd.label, l) }),
          h('p', { class: 'pw-p', text: tx(rd.duty, l) }),
          r === 'worker' ? textField('workers', t('f_workers', l), { ph: 'W1, W2' }) : textField('roles.' + r + '.who', t('f_who', l), { ph: t('hint_codes', l) }),
          checkField(r === 'worker' ? 'workers_ok' : 'roles.' + r + '.ok', t('f_comp', l))
        ]);
        grid.appendChild(card);
      });
      box.appendChild(grid);
    } else if (curStep === 'controls') {
      ['pre', 'ongoing', 'close'].forEach(function (ph) {
        var list = ty.controls.filter(function (c) { return EFF.controls[c[0]] && EFF.controls[c[0]].phase === ph; });
        if (!list.length) return;
        box.appendChild(h('h4', { class: 'pw-sub', text: t('phase_' + ph, l) }));
        list.forEach(function (pair) {
          var c = EFF.controls[pair[0]];
          if (!state.controls[pair[0]]) state.controls[pair[0]] = { st: '', note: '' };
          box.appendChild(h('div', { class: 'pw-card', 'data-pw-card': pair[0] }, [
            h('div', { class: 'pw-card-h' }, [h('span', { class: 'pw-card-t', text: pair[0] + ' · ' + tx(c.label, l) }), h('span', { class: 'pw-tag', text: t(pair[1] === 'block' ? 'sev_block' : 'sev_advice', l) })]),
            c.evidence ? h('p', { class: 'pw-p', text: t('evidence', l) + ': ' + tx(c.evidence, l) }) : null,
            h('div', { class: 'pw-grid' }, [
              selectField('controls.' + pair[0] + '.st', t('status', l), [['', t('c_blank', l)], ['done', t('c_done', l)], ['open', t('c_open', l)], ['na', t('c_na', l)]]),
              textField('controls.' + pair[0] + '.note', t('f_note', l))
            ])
          ]));
        });
      });
    } else if (curStep === 'meas') {
      var ms = ty.measurements || [];
      if (!ms.length) box.appendChild(h('p', { class: 'pw-p', text: t('meas_none', l) }));
      else box.appendChild(h('p', { class: 'pw-p', text: t('meas_note', l) }));
      ms.forEach(function (mid) {
        var m = EFF.measurements[mid];
        if (!state.meas[mid]) state.meas[mid] = { value: null, pass: null, limit: null, window: null, time: '', by: '' };
        var p = 'meas.' + mid + '.';
        var unit = m.unit ? ' (' + m.unit + ')' : '';
        var cells = m.type === 'bool'
          ? [selectField(p + 'pass', t('f_result', l), [['', t('r_blank', l)], ['true', t('r_pass', l)], ['false', t('r_fail', l)]], { map: function (v) { return v === '' ? null : v === 'true'; } })]
          : [textField(p + 'value', t('f_value', l) + unit, { type: 'number', step: 'any' }),
             textField(p + 'limit', t(m.dir === 'min' ? 'f_limit_min' : 'f_limit_max', l) + unit, { type: 'number', step: 'any' })];
        cells = cells.concat([
          textField(p + 'time', t('f_time', l), { type: 'datetime-local' }),
          textField(p + 'by', t('f_by', l), { ph: t('hint_codes', l) }),
          textField(p + 'window', t('f_window', l), { type: 'number', step: '1' })
        ]);
        /* the bool select writes `pass`; findings for a missing result point at `value` */
        if (m.type === 'bool') cells[0].setAttribute('data-pw-alias', p + 'value');
        box.appendChild(h('div', { class: 'pw-card', 'data-pw-card': mid }, [
          h('div', { class: 'pw-card-t', text: tx(m.label, l) }), h('div', { class: 'pw-grid' }, cells)
        ]));
      });
    } else if (curStep === 'valid') {
      box.appendChild(selectField('stage', t('f_stage', l), STAGES.map(function (s) { return [s, stageLabel(s, l)]; }), { hint: t('stage_hint', l), structural: false }));
      var g = h('div', { class: 'pw-grid' });
      ['start', 'end', 'review'].forEach(function (k) { g.appendChild(textField('validity.' + k, t('f_' + k, l), { type: 'datetime-local' })); });
      g.appendChild(textField('validity.max_h', t('f_max_h', l), { type: 'number', step: 'any' }));
      g.appendChild(textField('validity.shift_end', t('f_shift_end', l), { type: 'datetime-local' }));
      g.appendChild(textField('validity.handover', t('f_handover', l), { ph: t('hint_codes', l) }));
      g.appendChild(textField('validity.suspended_at', t('f_suspended_at', l), { type: 'datetime-local' }));
      g.appendChild(textField('validity.revalidated_at', t('f_revalidated_at', l), { type: 'datetime-local' }));
      box.appendChild(g);
      box.appendChild(h('h4', { class: 'pw-sub', text: t('life_head', l) }));
      ['issued', 'briefed', 'handback', 'accepted'].forEach(function (k) { box.appendChild(checkField('life.' + k, t('l_' + k, l))); });
    } else if (curStep === 'review') {
      box.appendChild(checkField('life.ack', t('ack', l), 'pw-ack'));
      var doc = h('div', { class: 'pw-doc', id: 'pw-doc' });
      box.appendChild(doc);
      renderDoc(doc);
      box.appendChild(renderExchange());
    }
    decorate();
  }

  function decorate() {
    if (!formBody || !last) return;
    var l = curLang();
    var by = {};
    last.findings.forEach(function (f) { (by[f.field] = by[f.field] || []).push(f); });
    formBody.querySelectorAll('[data-pw-field]').forEach(function (el) {
      var list = (by[el.getAttribute('data-pw-field')] || []).concat(by[el.getAttribute('data-pw-alias')] || []);
      var msg = el.querySelector('.pw-msg');
      var ctl = el.querySelector('input,select,textarea');
      if (!msg) return;
      if (!list.length) { msg.hidden = true; msg.textContent = ''; if (ctl) ctl.removeAttribute('aria-invalid'); return; }
      var blk = list.some(function (f) { return f.sev === 'block'; });
      msg.hidden = false;
      msg.className = 'pw-msg ' + (blk ? 'bad' : 'warn');
      msg.textContent = list.map(function (f) { return (f.sev === 'block' ? '⛔ ' : '⚠ ') + findingTitle(f, l); }).join(' · ');
      if (ctl) { if (blk) ctl.setAttribute('aria-invalid', 'true'); else ctl.removeAttribute('aria-invalid'); }
    });
    formBody.querySelectorAll('[data-pw-card]').forEach(function (card) {
      var bad = card.querySelector('.pw-msg.bad:not([hidden])'), warn = card.querySelector('.pw-msg.warn:not([hidden])');
      card.classList.toggle('bad', !!bad);
      card.classList.toggle('warn', !bad && !!warn);
    });
    var doc = formBody.querySelector('#pw-doc');
    if (doc && curStep === 'review') renderDoc(doc);
  }

  function goStep(id, focusPath) {
    curStep = id;
    if (stepsDef) stepsDef.value = id;
    var st = ui && ui.byKey && ui.byKey.steps;
    if (st && st.sync) st.sync(id);
    renderForm();
    if (focusPath && formBody) {
      var el = null;
      formBody.querySelectorAll('[data-pw-field]').forEach(function (n) {
        if (!el && (n.getAttribute('data-pw-field') === focusPath || n.getAttribute('data-pw-alias') === focusPath)) el = n;
      });
      var ctl = el && el.querySelector('input,select,textarea,button');
      if (ctl) { ctl.focus(); if (ctl.scrollIntoView) ctl.scrollIntoView({ block: 'center' }); }
    } else if (formBody && formBody.parentNode && window.innerWidth < 769) {
      formBody.parentNode.scrollIntoView({ block: 'start' });
    }
  }
  function stepIndex() { for (var i = 0; i < STEPS.length; i++) if (STEPS[i][0] === curStep) return i; return 0; }

  function renderNav() {
    if (!navBody || !last) return;
    var l = curLang();
    clearNode(navBody);
    var list = h('div', { class: 'pw-secnav' });
    SECTIONS.concat(['exchange']).forEach(function (sec, i) {
      var c = last.sec[sec];
      var cnt = (c.block || c.advice) ? ('⛔ ' + c.block + ' · ⚠ ' + c.advice) : (c.req ? '✓' : '–');
      var b = h('button', { type: 'button', 'aria-label': fill(t('nav_aria', l), { s: t(SECT_LABEL[sec], l), b: c.block, a: c.advice }),
        onclick: function () { goStep(STEP_OF_SEC[sec]); } }, [
        h('span', { text: (i + 1) + ' ' + t(SECT_LABEL[sec], l) }), h('span', { class: 'pw-cnt', text: cnt })
      ]);
      list.appendChild(b);
    });
    navBody.appendChild(list);
  }

  function renderIO() {
    if (!ioBody) return;
    var l = curLang();
    clearNode(ioBody);
    if (restored) ioBody.appendChild(h('p', { class: 'pw-p', text: t('io_restored', l) }));
    ioBody.appendChild(h('p', { class: 'pw-p', text: t(storageOk ? 'io_draft' : 'io_nodraft', l) }));
  }

  function verdictOf(ev, P, l) {
    if (ev.block) return { tone: 'bad', text: '⛔ ' + fill(t('verdict_block', l), { n: ev.block }) };
    if (ev.advice) return { tone: 'warn', text: '⚠ ' + fill(t('verdict_adv', l), { n: ev.advice }) };
    if (!P.life.ack) return { tone: 'warn', text: '⚠ ' + t('verdict_ack', l) };
    return { tone: 'ok', text: '✓ ' + t('verdict_ok', l) };
  }
  function scopeText(ev, P, eff, l) {
    return fill(t('scope', l), { t: typeLabel(P.type, eff, l), s: stageLabel(P.stage, l), p: ev.pack, c: ev.checks });
  }
  function pct(v, l) { return num(v, l, 1) + ' %'; }

  function findingsNode(ev, l) {
    var box = h('div', { class: 'pw-find' });
    [['block', 'f_blocking', 'bad', '⛔'], ['advice', 'f_advisory', 'warn', '⚠']].forEach(function (g) {
      var list = ev.findings.filter(function (f) { return f.sev === g[0]; });
      box.appendChild(h('h3', { class: 'pw-sub', text: t(g[1], l) + ' (' + list.length + ')' }));
      if (!list.length) box.appendChild(h('p', { class: 'pw-p', text: t('f_none', l) }));
      list.forEach(function (f) {
        var r = RULES[f.rule];
        var fl = fieldLabel(f.field, EFF, l);
        box.appendChild(h('details', { class: g[2] }, [
          h('summary', {}, [h('b', { text: g[3] + ' ' + f.rule }), ' ' + tx(r.text, l) + ' — ' + fl]),
          h('dl', {}, [
            h('dt', { text: t('d_why', l) }), h('dd', { text: tx(r.why, l) }),
            h('dt', { text: t('d_ev', l) }), h('dd', { text: findingEvidence(f, l) }),
            h('dt', { text: t('d_field', l) }), h('dd', { text: fl }),
            h('dt', { text: t('d_basis', l) }), h('dd', { text: basisText(basisOf(f), l) })
          ]),
          button(t('goto', l), function () { goStep(STEP_OF_SEC[f.sec], f.field); }, 'ghost', t('goto', l) + ': ' + fl)
        ]));
      });
    });
    return box;
  }

  function counts(ev, P, eff) {
    var ty = eff.types[P.type];
    var ctrlTotal = ty ? ty.controls.length : 0;
    var ctrlOk = ty ? ty.controls.filter(function (c) { var a = P.controls[c[0]] || {}; return a.st === 'done' || (a.st === 'na' && filled(a.note)); }).length : 0;
    return {
      rolesOk: ev.roleRows.filter(function (r) { return r.status === 'ok'; }).length, rolesTotal: ev.roleRows.length,
      ctrlOk: ctrlOk, ctrlTotal: ctrlTotal,
      measOk: ev.measRows.filter(function (r) { return r.status === 'ok'; }).length, measTotal: ev.measRows.length,
      imports: Object.keys(P.imports || {}).reduce(function (a, k) { return a + ((P.imports[k].items || []).length); }, 0)
    };
  }

  function resultsPayload() {
    var l = curLang(), ev = last;
    var v = verdictOf(ev, state, l);
    return {
      verdict: v,
      tiles: [
        { label: t('t_complete', l), value: pct(ev.completeness, l), tone: ev.completeness >= 100 ? 'ok' : 'warn' },
        { label: t('t_block', l), value: String(ev.block), tone: ev.block ? 'bad' : 'ok' },
        { label: t('t_advice', l), value: String(ev.advice), tone: ev.advice ? 'warn' : 'ok' },
        { label: t('t_valid', l), value: t('v_' + ev.validity, l), tone: ev.validity === 'valid' ? 'ok' : (ev.validity === 'closed' ? null : 'warn'), headline: false }
      ],
      nodes: [findingsNode(ev, l)],
      notes: [scopeText(ev, state, EFF, l)]
    };
  }

  /* -- review document */
  function statusCell(list, l) {
    if (!list.length) return { cls: '', text: '✓' };
    var blk = list.some(function (f) { return f.sev === 'block'; });
    return { cls: blk ? 'bad' : 'warn', text: list.map(function (f) { return (f.sev === 'block' ? '⛔ ' : '⚠ ') + f.rule; }).join(', ') };
  }
  function roleTable(ev, P, eff, l) {
    return {
      head: [t('rm_role', l), t('rm_who', l), t('rm_comp', l), t('status', l)],
      rows: ev.roleRows.map(function (r) {
        var st = r.status === 'conflict' ? fill(t('rs_conflict', l), { r: r.conflicts.map(function (c) { return tx(eff.roles[c].label, l); }).join(', ') })
          : t('rs_' + r.status, l);
        if (r.status === 'ok' && r.conflicts.length) st = fill(t('rs_conflict', l), { r: r.conflicts.map(function (c) { return tx(eff.roles[c].label, l); }).join(', ') });
        else if (r.conflicts.length) st += '; ' + fill(t('rs_conflict', l), { r: r.conflicts.map(function (c) { return tx(eff.roles[c].label, l); }).join(', ') });
        return [tx(r.label, l), r.codes.length ? r.codes.join(', ').toUpperCase() : '—', r.codes.length ? t(r.competent ? 'yes' : 'no', l) : '—', st];
      })
    };
  }
  function measTable(ev, l) {
    return {
      head: [t('mt_meas', l), t('f_result', l), t('mt_limit', l), t('f_time', l) + ' · ' + t('f_by', l), t('mt_age', l), t('status', l)],
      rows: ev.measRows.map(function (r) {
        var res = r.type === 'bool' ? (r.pass === true ? t('r_pass', l) : r.pass === false ? t('r_fail', l) : '—') : (isNum(r.value) ? num(r.value, l) + ' ' + r.unit : '—');
        var lim = r.type === 'bool' ? '—' : (isNum(r.limit) ? (r.dir === 'min' ? '≥ ' : '≤ ') + num(r.limit, l) + ' ' + r.unit : '—');
        var age = (r.age == null ? '—' : num(r.age, l, 0)) + ' / ' + (isNum(r.window) ? num(r.window, l, 0) : '—');
        return [tx(r.label, l), res, lim, when(r.time) + ' · ' + (r.by ? r.by.toUpperCase() : '—'), age, t('ms_' + r.status, l)];
      })
    };
  }
  function ctrlStatusText(a, l) {
    var st = (a && a.st) || '';
    var base = st === 'done' ? t('c_done', l) : st === 'open' ? t('c_open', l) : st === 'na' ? t('c_na', l) : t('c_blank', l);
    return base + (a && filled(a.note) ? ' — ' + a.note : '');
  }
  function renderDoc(doc) {
    var l = curLang(), ev = last, P = state, ty = EFF.types[P.type];
    clearNode(doc);
    var by = {};
    ev.findings.forEach(function (f) { (by[f.field] = by[f.field] || []).push(f); });
    function prefixed(pre) { var out = []; Object.keys(by).forEach(function (k) { if (k === pre || k.indexOf(pre + '.') === 0) out = out.concat(by[k]); }); return out; }
    function section(key, rows, extra) {
      var c = ev.sec[key];
      var sec = h('section', {}, [h('h3', {}, [h('span', { text: t(SECT_LABEL[key], l) }), h('span', { class: 'pw-tag', text: (c.block || c.advice) ? '⛔ ' + c.block + ' · ⚠ ' + c.advice : '✓' })])]);
      if (rows && rows.length) {
        var dl = h('dl');
        rows.forEach(function (r) {
          var s = statusCell(r[2] || [], l);
          dl.appendChild(h('dt', { text: r[0] }));
          dl.appendChild(h('dd', { class: s.cls, text: (r[1] === '' || r[1] == null ? '—' : r[1]) + (s.cls ? '  ' + s.text : '') }));
        });
        sec.appendChild(dl);
      }
      (extra || []).forEach(function (n) { sec.appendChild(n); });
      doc.appendChild(sec);
    }
    section('work', [
      [t('f_type', l), typeLabel(P.type, EFF, l), by.type || []],
      [t('f_zone', l), P.work.zone, by['work.zone'] || []],
      [t('f_equipment', l), P.work.equipment, by['work.equipment'] || []],
      [t('f_description', l), P.work.description, by['work.description'] || []],
      [t('f_jsa', l), P.work.jsa, []]
    ]);
    var rt = roleTable(ev, P, EFF, l);
    section('roles', null, [ui.table({ title: t('rm_title', l), head: rt.head, rows: rt.rows })]);
    section('controls', (ty ? ty.controls : []).map(function (pair) {
      var c = EFF.controls[pair[0]];
      return [pair[0] + ' · ' + tx(c.label, l) + ' (' + t('phase_' + c.phase, l) + ')', ctrlStatusText(P.controls[pair[0]], l), prefixed('controls.' + pair[0])];
    }));
    if (ev.measRows.length) { var mt = measTable(ev, l); section('meas', null, [ui.table({ title: t('mt_title', l), head: mt.head, rows: mt.rows })]); }
    else section('meas', [[t('mt_meas', l), t('meas_none', l), []]]);
    section('validity', [
      [t('f_stage', l), stageLabel(P.stage, l), []],
      [t('f_start', l), when(P.validity.start), by['validity.start'] || []],
      [t('f_end', l), when(P.validity.end), by['validity.end'] || []],
      [t('f_review', l), when(P.validity.review), by['validity.review'] || []],
      [t('f_max_h', l), isNum(P.validity.max_h) ? num(P.validity.max_h, l) : '—', by['validity.max_h'] || []],
      [t('f_shift_end', l), when(P.validity.shift_end), []],
      [t('f_handover', l), P.validity.handover, by['validity.handover'] || []],
      [t('f_suspended_at', l), when(P.validity.suspended_at), by['validity.suspended_at'] || []],
      [t('f_revalidated_at', l), when(P.validity.revalidated_at), by['validity.revalidated_at'] || []],
      [t('t_valid', l), t('v_' + ev.validity, l), []]
    ]);
    section('life', ['issued', 'briefed', 'handback', 'accepted', 'ack'].map(function (k) {
      return [t(k === 'ack' ? 'ack_short' : 'l_' + k, l), t(P.life[k] ? 'yes' : 'no', l), by['life.' + k] || []];
    }));
    var impRows = [];
    Object.keys(P.imports || {}).forEach(function (k) {
      (P.imports[k].items || []).forEach(function (it) { impRows.push([k + ' · ' + it.id + ' · ' + tx(it.label, l), it.status + (it.origin_status && it.origin_status !== it.status ? ' (' + it.origin_status + ')' : '') + (it.blocking ? ' · ' + t('sev_block', l) : ''), by['imports.' + k + '.' + it.id] || []]); });
    });
    section('exchange', impRows.length ? impRows : [[t('sec_exchange', l), t('imp_none', l), []]]);
  }

  /* -- exchange panel */
  function logLine(text, bad) { exLog = { text: text, bad: !!bad }; }
  function stamp() { return new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z'); }
  function importExchange(data) {
    var l = curLang();
    var chk = checkExchange(data);
    if (!chk.ok) {
      logLine('⛔ PTW-R-050 · ' + fill(t('ex_refused', l), { r: t('rr_' + chk.reason, l) + (chk.kind ? ' (' + chk.kind + ')' : '') }), true);
      changed(true);
      return chk;
    }
    applyExchange(state, chk);
    var lines = [chk.items.length ? '✓ ' + fill(t('ex_applied', l), { k: chk.kind, s: chk.source.id, n: chk.items.length })
                                  : '⚠ ' + fill(t('ex_zero', l), { k: chk.kind, s: chk.source.id })];
    if (chk.unknown.length) lines.push('⚠ ' + fill(t('ex_unknown', l), { r: chk.unknown.map(function (u) { return u.id + ' “' + u.status + '” → ' + u.as; }).join('; ') }));
    if (chk.ignored.length) {
      lines.push('⚠ PTW-R-051 · ' + fill(t('ex_ignored', l), { n: chk.ignored.length, r: chk.ignored.map(function (g) { return '#' + (g.index + 1) + ' ' + t('ir_' + g.reason, l); }).join('; ') }));

  /* -- figure */
  function palette(light) {
    if (light) return { ink: '#12161d', muted: '#5b6675', line: '#c9d2dd', ok: '#1f6f34', warn: '#9a5a00', bad: '#a5261f', accent: '#3763e6', panel: '#ffffff', track: '#eef1f5' };
    var cs = getComputedStyle(document.documentElement);
    function v(n, d) { return (cs.getPropertyValue(n) || '').trim() || d; }
    return { ink: v('--ink', '#12161d'), muted: v('--muted', '#5b6675'), line: v('--line', '#e2e7ee'), ok: v('--ok', '#1f6f34'), warn: v('--warn', '#9a5a00'),
             bad: v('--bad', '#a5261f'), accent: v('--accent', '#3763e6'), panel: v('--panel', '#fff'), track: v('--panel-2', '#f3f5f8') };
  }
  function drawFigure(ctx, w, h, ev, P, pal) {
    ctx.clearRect(0, 0, w, h);
    if (!ev) return;
    var si = Math.max(0, STAGES.indexOf(P.stage));
    var padX = 16, n = STAGES.length;
    var r = Math.max(9, Math.min(15, (w - 2 * padX) / n / 3.2));
    var cy = 8 + r;
    var font = '600 ' + Math.round(r * 0.95) + 'px system-ui, sans-serif';
    ctx.lineWidth = 2;
    ctx.strokeStyle = pal.line;
    ctx.beginPath();
    ctx.moveTo(padX + (w - 2 * padX) * 0.5 / n, cy); ctx.lineTo(padX + (w - 2 * padX) * (n - 0.5) / n, cy); ctx.stroke();
    for (var i = 0; i < n; i++) {
      var cx = padX + (w - 2 * padX) * (i + 0.5) / n;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI);
      ctx.fillStyle = i === si ? pal.accent : pal.panel; ctx.fill();
      ctx.strokeStyle = i <= si ? pal.accent : pal.line; ctx.stroke();
      ctx.fillStyle = i === si ? '#ffffff' : (i < si ? pal.accent : pal.muted);
      ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(i + 1), cx, cy + 0.5);
    }
    var secs = SECTIONS.concat(['exchange']);
    var y0 = cy + r + 14, rowH = Math.max(16, (h - y0 - 6) / secs.length);
    var lab = 26, right = Math.min(120, w * 0.3);
    var x0 = padX + lab, x1 = w - padX - right;
    ctx.font = '600 ' + Math.round(Math.min(13, rowH * 0.55)) + 'px system-ui, sans-serif';
    secs.forEach(function (s, k) {
      var c = ev.sec[s], y = y0 + k * rowH, bh = Math.max(8, rowH * 0.5), by = y + (rowH - bh) / 2;
      ctx.fillStyle = pal.muted; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(String(k + 1), padX + 2, y + rowH / 2);
      ctx.fillStyle = pal.track; ctx.fillRect(x0, by, x1 - x0, bh);
      ctx.strokeStyle = pal.line; ctx.lineWidth = 1; ctx.strokeRect(x0 + 0.5, by + 0.5, x1 - x0 - 1, bh - 1);
      var col = c.block ? pal.bad : c.advice ? pal.warn : pal.ok;
      var txt;
      if (c.req) {
        var fr = c.sat / c.req;
        ctx.fillStyle = col; ctx.fillRect(x0, by, (x1 - x0) * fr, bh);
        txt = Math.round(fr * 100) + '%';
      } else txt = '–';
      ctx.fillStyle = pal.ink; ctx.textAlign = 'left';
      var marks = (c.block ? '⛔' + c.block + ' ' : '') + (c.advice ? '⚠' + c.advice : '') || (c.req ? '✓' : '');
      ctx.fillText(txt + '  ' + marks, x1 + 8, y + rowH / 2);
    });
  }
  function reportCanvas(ev, P) {

    var ctx = c.getContext('2d');
    ctx.scale(2, 2);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 800, 380);
    drawFigure(ctx, 800, 380, ev, P, palette(true));
    return c;
  }

    return d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate()) + 'T' + p(d.getUTCHours()) + ':' + p(d.getUTCMinutes());
  }
  var BENCH_ROLE_KEYS = { fire_watch: 'firewatch', gas_tester: 'gastester', attendant: 'attendant', rescue: 'rescue', isolation_authority: 'isoauth', inspector: 'inspector' };

  /* returns {P, notes[], chosen:{...}} */
  function benchPermit(inp, eff, corpus) {
    var notes = [], chosen = {};
    if (inp.permit == null && inp.permit_type == null) {
      notes.push('The case names no permit; the pack check runs beside the corpus case complete-general-acknowledged.');
      inp = { permit: 'complete general permit' };
    }
    if (inp.permit != null) {
      var m = /complete (\w+) permit/.exec(inp.permit);
      var tid = m ? m[1] : 'general';
      var baseCase = corpus.filter(function (c) { return c.id === 'complete-' + tid + '-acknowledged'; })[0];
      notes.push('"' + inp.permit + '" is built from the corpus case complete-' + tid + '-acknowledged.');
      var r = benchPermit(baseCase.inputs, eff, corpus);
      return { P: r.P, notes: notes.concat(r.notes), chosen: r.chosen };
    }
    if (inp.everything_else != null) {
      var B = blankPermit(); B.type = eff.types[inp.permit_type] ? inp.permit_type : 'general'; B.stage = inp.stage || 'prepare';
      notes.push('Blank permit from blankPermit(), type ' + B.type + ', stage ' + B.stage + '.');
      return { P: B, notes: notes, chosen: chosen };
    }
    var P = blankPermit();
    P.type = inp.permit_type; P.stage = inp.stage;
    var ty = eff.types[P.type];
    var w = inp.work || {};
    P.work.zone = w.zone || ''; P.work.equipment = w.equipment || ''; P.work.description = w.description || '';
    var R = inp.roles || {}, comp = R.competence_confirmed || {};
    P.roles.issuer = { who: R.issuer || '', ok: comp[R.issuer] === true };
    P.roles.holder = { who: R.holder || '', ok: comp[R.holder] === true };
    P.workers = (R.workers || []).join(', ');
    P.workers_ok = (R.workers || []).length > 0 && (R.workers || []).every(function (x) { return comp[x] === true; });
    Object.keys(BENCH_ROLE_KEYS).forEach(function (k) { if (k in R) P.roles[BENCH_ROLE_KEYS[k]] = { who: R[k] || '', ok: comp[R[k]] === true }; });
    ty.roles.forEach(function (r) {
      if (r === 'worker' || P.roles[r]) return;
      P.roles[r] = { who: 'Supplied ' + r, ok: true };
      notes.push('Profile role "' + r + '" has no counterpart in the case; supplied as a distinct, competent person ("all roles and competences confirmed").');
    });
    /* controls, from the case's sentence */
    var cs = String(inp.controls || '');
    ty.controls.forEach(function (pair) { P.controls[pair[0]] = { st: 'done', note: '' }; });
    function firstOf(phase) { return ty.controls.filter(function (p) { return eff.controls[p[0]].phase === phase && p[1] === 'block'; })[0][0]; }
    if (/EXCEPT exactly one prerequisite/.test(cs)) { chosen.control = firstOf('pre'); P.controls[chosen.control].st = ''; notes.push('Prerequisite left unconfirmed: ' + chosen.control + ' (first blocking prerequisite of the profile).'); }
    else if (/not applicable with an empty reason/.test(cs)) { chosen.control = firstOf('pre'); P.controls[chosen.control] = { st: 'na', note: '' }; notes.push('Marked not applicable: ' + chosen.control + '.'); }
    else if (/not applicable with reason '([^']*)'/.test(cs)) { chosen.control = firstOf('pre'); P.controls[chosen.control] = { st: 'na', note: /reason '([^']*)'/.exec(cs)[1] }; notes.push('Marked not applicable with the given reason: ' + chosen.control + '.'); }
    else if (/one ongoing control/.test(cs)) { chosen.control = firstOf('ongoing'); P.controls[chosen.control].st = ''; notes.push('Ongoing control left unconfirmed: ' + chosen.control + '.'); }
    else if (/except one close-out action/.test(cs)) { chosen.control = firstOf('close'); P.controls[chosen.control].st = ''; notes.push('Close-out action left unconfirmed: ' + chosen.control + '.'); }
    /* validity, suspension, shift */
    var V = inp.validity || {};
    P.validity.start = V.start || ''; P.validity.end = V.end || ''; P.validity.review = V.review_time || '';
    P.validity.max_h = isNum(V.site_max_duration_h) ? V.site_max_duration_h : null;
    if (inp.suspension) { P.validity.suspended_at = inp.suspension.suspended_at || ''; P.validity.revalidated_at = inp.suspension.revalidated_at || ''; }
    if ((inp.shift_changes || []).length) {
      var sc = inp.shift_changes[0];
      P.validity.shift_end = sc.time || '';
      P.validity.handover = sc.handover_recorded ? 'handover recorded' : '';
      notes.push('Shift change mapped to "shift end"; handover_recorded mapped to the incoming-holder field being filled.');
    }
    /* measurements */
    var gas = R.gas_tester || '';
    (inp.measurements || []).forEach(function (m) {
      var id = benchMeasId(m.kind);
      if (!id) { notes.push('Measurement kind "' + m.kind + '" has no counterpart in the profile.'); return; }
      var md = eff.measurements[id];
      if (m.limit_type && md.dir && m.limit_type !== md.dir) notes.push('Limit direction of ' + id + ' differs from the case.');
      P.meas[id] = md.type === 'bool'
        ? { value: null, pass: m.result === 'pass' ? true : m.result === 'fail' ? false : null, limit: null, window: isNum(m.site_validity_window_min) ? m.site_validity_window_min : null, time: m.time || '', by: m.performer || '' }
        : { value: isNum(m.value) ? m.value : null, pass: null, limit: isNum(m.site_limit) ? m.site_limit : null, window: isNum(m.site_validity_window_min) ? m.site_validity_window_min : null, time: m.time || '', by: m.performer || '' };
      chosen.meas = id;
    });
    (ty.measurements || []).forEach(function (id) {
      if (P.meas[id] || id === BENCH_TYPE_MEAS[P.type]) return;
      var md = eff.measurements[id];
      var by = md.gas && ty.roles.indexOf('gastester') >= 0 ? (gas || (P.roles.gastester || {}).who || '') : (R.holder || '');
      P.meas[id] = md.type === 'bool'
        ? { value: null, pass: true, limit: null, window: 60, time: minusMin(V.review_time, 5), by: by }
        : { value: 0, pass: null, limit: md.dir === 'min' ? -1 : 1, window: 60, time: minusMin(V.review_time, 5), by: by };
      notes.push('Profile measurement ' + id + ' is not represented in the case; supplied in valid form (5 min before review, 60 min window, within limit).');
    });
    /* lifecycle and acknowledgement */
    var L = inp.lifecycle || {};
    P.life.issued = L.issue_recorded_in_site_system === true;
    P.life.briefed = L.toolbox_briefing_recorded === true;
    P.life.handback = L.handback_recorded === true;
    P.life.accepted = L.handback_recorded === true;
    P.life.ack = inp.review_limits_acknowledged === true;
    if (P.stage === 'close') notes.push('handback_recorded sets both handback by the holder and acceptance by the issuer (HSG250 para 24 hand-back).');
    /* isolation register */
    if ((inp.isolation_register || []).length) {
      var doc = { schema: EX_SCHEMA, kind: 'loto.isolation-register', source: { id: 'isolationplanner', file: 'isolationplanner.html', revision: 'benchmark' }, created_at: '', items:
        inp.isolation_register.map(function (x, i) { return { id: 'bench-iso-' + (i + 1), label: x.label, type: x.type, status: x.status }; }) };
      applyExchange(P, checkExchange(doc));
    }
    return { P: P, notes: notes, chosen: chosen };
  }

  async function sha256Hex(text) {
    try {
      var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return (b < 16 ? '0' : '') + b.toString(16); }).join('');
    } catch (e) { return null; }
  }

  var BENCH_REF_URL = 'benchmarks/permitworkstudio.reference.json';
  var BENCH_REF_SHA256 = '3c5e18e0ca720ff352f7ae8b44bc5198d8339f22fcecdcf6d2b332ac3306fbe9';

  async function benchmarkArtifact() {
    var text, resp;
    try { resp = await fetch(BENCH_REF_URL, { credentials: 'same-origin', cache: 'no-store' }); }
    catch (e) { throw new Error('Benchmark reference ' + BENCH_REF_URL + ' could not be loaded: ' + (e && e.message || e)); }
    if (!resp.ok) throw new Error('Benchmark reference ' + BENCH_REF_URL + ' could not be loaded: HTTP ' + resp.status);
    text = await resp.text();
    var digest = await sha256Hex(text);
    if (digest !== BENCH_REF_SHA256) throw new Error('Benchmark reference ' + BENCH_REF_URL + ' refused: sha256 ' + digest + ' does not match the expected ' + BENCH_REF_SHA256 + '.');
    var ref = JSON.parse(text);
    var eff = CORE_EFF;
    var cases = ref.cases.map(function (c) {
      var inp = c.inputs;
      var built = benchPermit(inp, eff, ref.cases);
      var P = built.P, notes = built.notes.slice();
      var E = evaluate(P, mergePacks(P.packs));
      var extraRules = [], outcome = null, tick = null;
      if (inp.import_exchange) {
        var chk = checkExchange(inp.import_exchange);
        if (!chk.ok) { outcome = 'refused'; extraRules.push('PTW-R-050'); tick = false; }
        else {
          applyExchange(P, chk);
          outcome = chk.items.length ? 'applied' : 'applied-empty';
          if (chk.ignored.length) extraRules.push('PTW-R-051');
          tick = chk.items.length > 0;
          E = evaluate(P, mergePacks(P.packs));
        }
        notes.push('Import runs checkExchange/applyExchange; refusal and ignored items are reported in the import log under PTW-R-050 / PTW-R-051, which count as findings here.');
      }
      if (inp.load_profile_pack) {
        var lp = inp.load_profile_pack, txt;
        if (/duplicate|share id/.test(lp.note || '')) {
          txt = '{"schema":"' + lp.schema + '","id":"' + lp.id + '","controls":{"X-01":{"phase":"pre","label":["Check one"]},"X-01":{"phase":"pre","label":["Check two"]}},' +
                '"types":{"duptype":{"label":["Duplicate test"],"roles":["issuer","holder","worker"],"controls":[["X-01","block"]]}}}';
          notes.push('Pack text built with two control items under id X-01, otherwise valid.');
        } else txt = JSON.stringify({ schema: lp.schema, id: lp.id });
        var pt = parsePackText(txt);
        var errs = pt.errs.concat(pt.pack ? validatePack(pt.pack, eff) : []);
        outcome = errs.length ? 'refused' : 'added';
        if (errs.length) extraRules.push('PTW-R-060');
        notes.push('Pack check: ' + (errs.join('; ') || 'accepted') + '.');
      }
      var blockRules = E.findings.filter(function (f) { return f.sev === 'block'; }).map(function (f) { return f.rule; });
      var allRules = E.findings.map(function (f) { return f.rule; }).concat(extraRules);
      var verdict = verdictOf(E, P, 'en').tone === 'ok';
      var mrow = E.measRows.filter(function (r) { return r.id === built.chosen.meas; })[0];
      var cmp = {}, pass = true;
      Object.keys(c.checks).forEach(function (k) {
        var chkd = c.checks[k], rv = chkd.ref, got, ok, rel = null;
        if (k === 'blocking_items_count') { got = E.block; ok = got === rv; }
        else if (k === 'blocking_items_count_min') { got = E.block; ok = got >= rv; }
        else if (k === 'verdict_is_no_unresolved_finding') { got = verdict; ok = got === rv; }
        else if (k === 'blocking_items_contain_rule') { got = blockRules.indexOf(rv) >= 0 ? rv : 'absent (blocking: ' + (blockRules.join(', ') || 'none') + ')'; ok = got === rv; }
        else if (k === 'blocking_items_contain_any_rule') { var hit = rv.filter(function (x) { return blockRules.indexOf(x) >= 0; }); got = hit.length ? hit : 'absent (blocking: ' + (blockRules.join(', ') || 'none') + ')'; ok = hit.length > 0; if (ok) got = rv; }
        else if (k === 'findings_contain_rule') { got = allRules.indexOf(rv) >= 0 ? rv : 'absent (findings: ' + (allRules.join(', ') || 'none') + ')'; ok = got === rv; }
        else if (k === 'findings_exclude_rule') { var present = allRules.indexOf(rv) >= 0; got = present ? 'present: ' + rv : 'excluded: ' + rv; ok = !present; }
        else if (k === 'finding_field') {
          var rule = (Object.keys(c.checks).map(function (x) { return c.checks[x].ref; }).filter(function (x) { return typeof x === 'string' && /^PTW-R-/.test(x); })[0]);
          var want = rv === 'the unconfirmed control' ? 'controls.' + built.chosen.control + '.st' : rv;
          var fields = E.findings.filter(function (f) { return f.rule === rule; }).map(function (f) { return f.field; });
          got = fields.indexOf(want) >= 0 ? rv : 'fields of ' + rule + ': ' + (fields.join(', ') || 'none');
          ok = got === rv;
          if (rv === 'the unconfirmed control') notes.push('"the unconfirmed control" resolved to field ' + want + '.');
        }
        else if (k === 'measurement_age_min') { got = mrow ? mrow.age : null; ok = got === rv; }
        else if (k === 'validity_duration_h') {
          got = E.duration_h == null ? null : E.duration_h;
          if (got == null) ok = false;
          else if (chkd.tol && chkd.tol.rel != null) { rel = rv === 0 ? Math.abs(got) : Math.abs(got - rv) / Math.abs(rv); ok = rel <= chkd.tol.rel; }
          else { rel = rv === 0 ? null : Math.abs(got - rv) / Math.abs(rv); ok = Math.abs(got - rv) <= chkd.tol.abs; }
        }
        else if (/_flag_(PTW-R-\d+)$/.test(k)) { var rr = /_flag_(PTW-R-\d+)$/.exec(k)[1]; got = allRules.indexOf(rr) >= 0; ok = got === rv; }
        else if (k === 'import_outcome' || k === 'pack_outcome') { got = outcome; ok = got === rv; }
        else if (k === 'import_shows_success_tick') { got = tick; ok = got === rv; }
        else { got = null; ok = false; notes.push('Check ' + k + ' has no adapter mapping.'); }
        if (!ok && k === 'validity_duration_h' && got != null && Math.abs(got - rv) <= 5e-7) notes.push('Reference value ' + rv + ' is rounded to 6 decimals while its tolerance is rel ' + (chkd.tol && chkd.tol.rel) + '; the exact quotient is ' + got + '. Disputed and reported, not re-graded.');
        if (!ok) pass = false;
        cmp[k] = { got: got, ref: rv, tol: chkd.tol, rel: rel, ok: ok, ref_source: 'recomputed' };
      });
      var seenN = {};
      return { id: c.id, note: notes.filter(function (n) { if (seenN[n]) return false; seenN[n] = 1; return true; }).join(' '), inputs: inp, cmp: cmp, pass: pass };
    });
    var passed = cases.filter(function (c) { return c.pass; }).length;
    var st = 0; try { st = selfTests().filter(function (x) { return x.pass; }).length; } catch (e) {}
    return {
      schema: 'tools.petrov.re/benchmark-artifact/v1',
      tool: 'permitworkstudio',
      file: 'permitworkstudio.html',
      manifest_revision: MANIFEST_REV,
      build: MANIFEST_REV,
      run_at: new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'),
      reference_provenance: 'recomputed',
      provenance_note: 'The reference corpus was authored by another agent from HSE HSG250, the tool specification and its own time arithmetic without access to this code; this run recomputes every check from the shipping build.',
      reference: ref.reference,
      reference_citations: ref.reference_citations,
      tolerance: ref.tolerance,
      total: cases.length,
      passed: passed,
      failed: cases.length - passed,
      flagged: 0,
      cases: cases,
      not_benchmarked: (function () {
        var topics = ['Profile control identity', 'ISO 45001 competence clause', 'Electrical and height standards', 'Exchange alias mappings', 'Report, layout and storage', 'Time boundaries and SIMOPS', 'Completeness percentage'];
        var o = {};
        ref.not_benchmarked.forEach(function (t, i) { o[topics[i] || ('Further limitation ' + (i + 1))] = t; });
        o['Items supplied by the adapter'] = 'Profile items the corpus does not represent (specialist roles such as standby rescue, isolation authority and excavation inspector; measurements other than flammable gas, oxygen and the dead test) are supplied by the adapter in complete, valid form and say so in each case note.';
        return o;
      })(),
      reference_sha256: digest,
      qa: {
        domain_tests: { status: st ? 'pass' : 'not run', note: st + ' page self-tests (window.__safetyTests) passed in this run.' },
        adapter: { status: 'pass', note: 'Each case is mapped onto the permit model and evaluated with evaluate(), verdictOf(), checkExchange()/applyExchange() and parsePackText()/validatePack(), the functions the interface uses.' }
      }
    };
  }
  window.__dgcBenchmark = benchmarkArtifact;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
