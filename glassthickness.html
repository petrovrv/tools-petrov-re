  "title": {"en":"Glass Thickness for Wind, Snow & Climate Loads","uk":"Товщина скла під вітер, сніг і кліматичні навантаження","de":"Glasdicke für Wind-, Schnee- und Klimalasten","nl":"Glasdikte voor wind-, sneeuw- en klimaatbelasting","fr":"Épaisseur de verre — vent, neige et charges climatiques","es":"Espesor de vidrio para viento, nieve y cargas climáticas","pl":"Grubość szkła na wiatr, śnieg i obciążenia klimatyczne"},
  "summary": {"en":"Is this pane thick enough? Single, laminated, double or triple glazing on 4, 3 or 2 edges in a façade or a roof: stress (ULS) and deflection (SLS) under wind, snow, self-weight and the climatic pressure in the cavities, by NBN S 23-002-2:2020 — with the thinnest passing composition.","uk":"Чи досить товсте це скло? Одинарне, багатошарове, дво- чи трикамерне скління на 4, 3 або 2 опорах у фасаді чи даху: напруження (ULS) і прогин (SLS) від вітру, снігу, власної ваги та кліматичного тиску в камерах за NBN S 23-002-2:2020 — і найтонший склад, що проходить.","de":"Ist diese Scheibe dick genug? Einfach-, Verbund-, Zweifach- oder Dreifachglas, 4-, 3- oder 2-seitig gelagert, in Fassade oder Dach: Spannung (GZT) und Durchbiegung (GZG) unter Wind, Schnee, Eigengewicht und Klimalast im Scheibenzwischenraum nach NBN S 23-002-2:2020 — mit dem dünnsten Aufbau, der genügt.","nl":"Is deze ruit dik genoeg? Enkel, gelaagd, dubbel of drievoudig glas op 4, 3 of 2 zijden in een gevel of dak: spanning (UGT) en doorbuiging (BGT) onder wind, sneeuw, eigen gewicht en de klimaatdruk in de spouwen volgens NBN S 23-002-2:2020 — met de dunste samenstelling die voldoet.","fr":"Ce vitrage est-il assez épais ? Verre simple, feuilleté, double ou triple vitrage sur 4, 3 ou 2 appuis, en façade ou en toiture : contrainte (ELU) et flèche (ELS) sous vent, neige, poids propre et pression climatique dans les lames selon la NBN S 23-002-2:2020 — avec la composition la plus mince qui convient.","es":"¿Es este vidrio lo bastante grueso? Vidrio simple, laminado, doble o triple sobre 4, 3 o 2 apoyos en fachada o cubierta: tensión (ELU) y flecha (ELS) bajo viento, nieve, peso propio y presión climática en las cámaras según NBN S 23-002-2:2020 — con la composición más delgada que cumple.","pl":"Czy ta szyba jest wystarczająco gruba? Szkło pojedyncze, laminowane, zespolone dwu- lub trzyszybowe na 4, 3 lub 2 krawędziach w fasadzie lub dachu: naprężenie (SGN) i ugięcie (SGU) od wiatru, śniegu, ciężaru własnego i ciśnienia klimatycznego w komorach wg NBN S 23-002-2:2020 — z najcieńszym składem, który spełnia."},
  "description": {"en":"Enter the pane (width, height, supports on 4, 3 or 2 edges, tilt), the glazing (single, laminated, double or triple; ply thicknesses, interlayer, glass type of each pane, cavity widths) and the loads: the Belgian wind exposure class of NBN S 23-002-3 (or a site, a peak pressure or a net design pressure) with the façade zone, snow on roofs, the altitude difference between the glass plant and the site. The tool builds the load cases of NBN S 23-002-2:2020 §10 (façade wind suction and pressure with the cavity pressure as accompanying action and the winter anticyclone alone; the five roof combinations), shares external loads between the panes through the gas (§4.4–4.5), computes the isochoric pressures of §8.5 and checks every pane for stress against fg;d (kmod of the load duration) and deflection against §10.2, plus the first natural frequency (≥ 4 Hz). It names the governing case and pane, compares linear and non-linear plate theory and searches the thinnest passing composition of the same family.","uk":"Введіть скло (ширина, висота, опори на 4, 3 або 2 краях, нахил), скління (одинарне, багатошарове, дво- чи трикамерне; товщини шарів, плівка, тип скла кожного листа, ширини камер) і навантаження: бельгійський клас вітрової експозиції NBN S 23-002-3 (або майданчик, піковий тиск чи розрахунковий нетто-тиск) із зоною фасаду, сніг на даху, різницю висот між заводом і об’єктом. Інструмент будує випадки навантаження NBN S 23-002-2:2020 §10 (вітрове відсмоктування й тиск на фасаді з тиском у камері як супутньою дією та зимовий антициклон окремо; п’ять комбінацій для даху), розподіляє зовнішні навантаження між листами через газ (§4.4–4.5), обчислює ізохорний тиск §8.5 і перевіряє кожен лист на напруження проти fg;d (kmod за тривалістю) і прогин за §10.2, а також першу власну частоту (≥ 4 Гц). Він називає визначальний випадок і лист, порівнює лінійну й нелінійну теорію пластин і шукає найтонший склад тієї самої родини.","de":"Geben Sie die Scheibe (Breite, Höhe, 4-, 3- oder 2-seitige Lagerung, Neigung), die Verglasung (Einfach-, Verbund-, Zweifach- oder Dreifachglas; Einzelglasdicken, Folie, Glasart jeder Scheibe, SZR-Breiten) und die Lasten ein: die belgische Windexpositionsklasse nach NBN S 23-002-3 (oder Standort, Spitzendruck oder Netto-Bemessungsdruck) mit Fassadenzone, Schnee auf Dächern, Höhenunterschied zwischen Glaswerk und Einbauort. Das Werkzeug bildet die Lastfälle von NBN S 23-002-2:2020 §10 (Windsog und -druck an der Fassade mit dem Innendruck als Begleiteinwirkung und dem Winterhoch allein; die fünf Dachkombinationen), verteilt äußere Lasten über das Gas auf die Scheiben (§4.4–4.5), berechnet die isochoren Drücke nach §8.5 und prüft jede Scheibe auf Spannung gegen fg;d (kmod nach Lastdauer) und Durchbiegung nach §10.2 sowie die erste Eigenfrequenz (≥ 4 Hz). Es nennt maßgebenden Lastfall und Scheibe, vergleicht lineare und nichtlineare Plattentheorie und sucht den dünnsten Aufbau derselben Familie.","nl":"Voer de ruit in (breedte, hoogte, opleggingen op 4, 3 of 2 zijden, helling), de beglazing (enkel, gelaagd, dubbel of drievoudig; bladdiktes, folie, glassoort per ruit, spouwbreedtes) en de belastingen: de Belgische windblootstellingsklasse van NBN S 23-002-3 (of een bouwplaats, een piekdruk of een netto rekendruk) met de gevelzone, sneeuw op daken, het hoogteverschil tussen glasfabriek en bouwplaats. De tool stelt de belastingsgevallen van NBN S 23-002-2:2020 §10 op (windzuiging en winddruk op de gevel met de spouwdruk als begeleidende actie en de winteranticycloon alleen; de vijf dakcombinaties), verdeelt externe belastingen via het gas over de bladen (§4.4–4.5), berekent de isochore drukken van §8.5 en toetst elk blad op spanning tegen fg;d (kmod volgens belastingsduur) en doorbuiging volgens §10.2, plus de eerste eigenfrequentie (≥ 4 Hz). Ze noemt het maatgevende geval en blad, vergelijkt lineaire en niet-lineaire plaattheorie en zoekt de dunste samenstelling van dezelfde familie.","fr":"Saisissez le vitrage (largeur, hauteur, appuis sur 4, 3 ou 2 côtés, inclinaison), sa composition (simple, feuilleté, double ou triple ; épaisseurs des feuilles, intercalaire, type de verre de chaque composant, largeurs de lame) et les charges : la classe d’exposition au vent belge de la NBN S 23-002-3 (ou un site, une pression de pointe ou une pression nette de calcul) avec la zone de façade, la neige en toiture, la différence d’altitude entre l’usine et le chantier. L’outil établit les cas de charge de la NBN S 23-002-2:2020 §10 (dépression et pression du vent en façade avec la pression interne en accompagnement et l’anticyclone hivernal seul ; les cinq combinaisons de toiture), répartit les charges extérieures entre les verres par le gaz (§4.4–4.5), calcule les pressions isochores du §8.5 et vérifie chaque verre en contrainte face à fg;d (kmod selon la durée) et en flèche selon le §10.2, ainsi que la première fréquence propre (≥ 4 Hz). Il désigne le cas et le verre déterminants, compare la théorie linéaire et non linéaire des plaques et cherche la composition la plus mince de la même famille.","es":"Introduzca el vidrio (ancho, alto, apoyos en 4, 3 o 2 bordes, inclinación), el acristalamiento (simple, laminado, doble o triple; espesores de hoja, intercalario, tipo de vidrio de cada hoja, anchos de cámara) y las cargas: la clase belga de exposición al viento de NBN S 23-002-3 (o un emplazamiento, una presión pico o una presión neta de cálculo) con la zona de fachada, la nieve en cubiertas y la diferencia de altitud entre la fábrica y la obra. La herramienta construye los casos de carga de NBN S 23-002-2:2020 §10 (succión y presión de viento en fachada con la presión de cámara como acción concomitante y el anticiclón invernal solo; las cinco combinaciones de cubierta), reparte las cargas exteriores entre las hojas a través del gas (§4.4–4.5), calcula las presiones isócoras del §8.5 y comprueba cada hoja a tensión frente a fg;d (kmod según la duración) y a flecha según §10.2, además de la primera frecuencia propia (≥ 4 Hz). Indica el caso y la hoja determinantes, compara la teoría lineal y no lineal de placas y busca la composición más delgada de la misma familia.","pl":"Wprowadź szybę (szerokość, wysokość, podparcie na 4, 3 lub 2 krawędziach, nachylenie), oszklenie (pojedyncze, laminowane, dwu- lub trzyszybowe; grubości tafli, folia, rodzaj szkła każdej tafli, szerokości komór) i obciążenia: belgijską klasę ekspozycji na wiatr NBN S 23-002-3 (albo lokalizację, ciśnienie szczytowe lub obliczeniowe ciśnienie netto) ze strefą fasady, śnieg na dachu, różnicę wysokości między zakładem a budową. Narzędzie tworzy przypadki obciążeń NBN S 23-002-2:2020 §10 (ssanie i parcie wiatru na fasadzie z ciśnieniem w komorze jako oddziaływaniem towarzyszącym oraz sam wyż zimowy; pięć kombinacji dachowych), rozdziela obciążenia zewnętrzne między tafle przez gaz (§4.4–4.5), oblicza ciśnienia izochoryczne §8.5 i sprawdza każdą taflę na naprężenie względem fg;d (kmod wg czasu trwania) i ugięcie wg §10.2 oraz pierwszą częstotliwość własną (≥ 4 Hz). Wskazuje decydujący przypadek i taflę, porównuje liniową i nieliniową teorię płyt i szuka najcieńszego składu tej samej rodziny."},

  "limitations": {"en":"Rectangular panes under uniform load, continuously supported on 4, 3 or 2 edges; point-fixed, structural-silicone (VEC), curved and fire-resistant glass, balustrade and impact loads and the maintenance point load (Tab. 1, 1,5 kN) are not modelled. Isochoric pressures use the Belgian reference situations of §8.5.2 (cavity temperatures of Tab. 21 / 29; for a short side ≤ 0,5 m or other conditions use Annex A). Façade wind uses the net cp of NBN S 23-002-3; roof cp and snow are user inputs (defaults are learning assumptions).","uk":"Прямокутне скло під рівномірним навантаженням, неперервно оперте на 4, 3 або 2 краї; точкове кріплення, структурний силікон (VEC), гнуте й вогнестійке скло, навантаження на огородження й удар, а також точкове експлуатаційне навантаження (Tab. 1, 1,5 кН) не моделюються. Ізохорний тиск — за бельгійськими еталонними ситуаціями §8.5.2 (температури камер Tab. 21 / 29; для короткої сторони ≤ 0,5 м чи інших умов — Annex A). Вітер на фасаді — нетто-cp з NBN S 23-002-3; cp даху та сніг вводить користувач (типові значення — навчальні припущення).","de":"Rechteckige Scheiben unter Gleichlast, linienförmig 4-, 3- oder 2-seitig gelagert; punktgehaltenes, geklebtes (VEC), gebogenes und Brandschutzglas, Absturzsicherungs- und Stoßlasten sowie die Wartungs-Einzellast (Tab. 1, 1,5 kN) werden nicht abgebildet. Isochore Drücke nach den belgischen Referenzsituationen von §8.5.2 (SZR-Temperaturen Tab. 21 / 29; bei kurzer Seite ≤ 0,5 m oder anderen Bedingungen Anhang A verwenden). Fassadenwind mit Netto-cp nach NBN S 23-002-3; Dach-cp und Schnee gibt der Nutzer vor (Vorgaben sind Lernannahmen).","nl":"Rechthoekige ruiten onder gelijkmatige belasting, lijnvormig opgelegd op 4, 3 of 2 zijden; puntbevestigd, structureel verlijmd (VEC), gebogen en brandwerend glas, borstwering- en stootbelastingen en de puntlast voor onderhoud (Tab. 1, 1,5 kN) worden niet gemodelleerd. Isochore drukken volgens de Belgische referentiesituaties van §8.5.2 (spouwtemperaturen Tab. 21 / 29; bij een korte zijde ≤ 0,5 m of andere omstandigheden bijlage A gebruiken). Gevelwind met netto cp van NBN S 23-002-3; dak-cp en sneeuw geeft de gebruiker op (standaardwaarden zijn leeraannames).","fr":"Vitrages rectangulaires sous charge uniforme, appuyés en continu sur 4, 3 ou 2 côtés ; verre attaché, VEC, bombé et résistant au feu, charges de garde-corps et de choc et la charge ponctuelle d’entretien (Tab. 1, 1,5 kN) ne sont pas modélisés. Les pressions isochores suivent les situations de référence belges du §8.5.2 (températures de lame des Tab. 21 / 29 ; pour un petit côté ≤ 0,5 m ou d’autres conditions, utiliser l’annexe A). Le vent de façade utilise les cp nets de la NBN S 23-002-3 ; cp de toiture et neige sont saisis par l’utilisateur (valeurs par défaut = hypothèses pédagogiques).","es":"Vidrios rectangulares con carga uniforme, apoyados de forma continua en 4, 3 o 2 bordes; vidrio abotonado, sellado estructural (VEC), curvado y resistente al fuego, cargas de barandilla e impacto y la carga puntual de mantenimiento (Tab. 1, 1,5 kN) no se modelan. Las presiones isócoras siguen las situaciones de referencia belgas de §8.5.2 (temperaturas de cámara de Tab. 21 / 29; con lado corto ≤ 0,5 m u otras condiciones use el anexo A). El viento en fachada usa los cp netos de NBN S 23-002-3; cp de cubierta y nieve los introduce el usuario (valores por defecto = supuestos didácticos).","pl":"Prostokątne szyby pod obciążeniem równomiernym, podparte liniowo na 4, 3 lub 2 krawędziach; szkło mocowane punktowo, klejone strukturalnie (VEC), gięte i ogniochronne, obciążenia balustrad i uderzenia oraz skupione obciążenie konserwacyjne (Tab. 1, 1,5 kN) nie są modelowane. Ciśnienia izochoryczne wg belgijskich sytuacji odniesienia §8.5.2 (temperatury komór Tab. 21 / 29; przy krótszym boku ≤ 0,5 m lub innych warunkach użyj załącznika A). Wiatr na fasadzie z cp netto NBN S 23-002-3; cp dachu i śnieg podaje użytkownik (wartości domyślne to założenia dydaktyczne)."},

  'w.smallest_freq_basis': ['A thinner composition of the catalogue passes only with ω 0,65 of part 2 §5.5.2 for the frequency; with the design coupling (the basis of the part 3 / 5 tables) its n1 is below 4 Hz, so it is not proposed.', 'Тонший склад каталогу проходить лише з ω 0,65 частини 2 §5.5.2 для частоти; зі зв’язком за розрахунковим випадком (основа таблиць частин 3 / 5) його n1 нижче 4 Гц, тому він не пропонується.', 'Ein dünnerer Aufbau des Katalogs genügt nur mit ω 0,65 von Teil 2 §5.5.2 für die Frequenz; mit der Bemessungskopplung (Grundlage der Tabellen von Teil 3 / 5) liegt n1 unter 4 Hz, daher wird er nicht vorgeschlagen.', 'Een dunnere samenstelling uit de catalogus voldoet alleen met ω 0,65 van deel 2 §5.5.2 voor de frequentie; met de rekenkoppeling (basis van de tabellen van deel 3 / 5) ligt n1 onder 4 Hz, dus wordt ze niet voorgesteld.', 'Une composition plus mince du catalogue ne convient qu’avec ω 0,65 de la partie 2 §5.5.2 pour la fréquence ; avec le couplage de calcul (base des tableaux des parties 3 / 5) son n1 est inférieur à 4 Hz, elle n’est donc pas proposée.', 'Una composición más delgada del catálogo solo cumple con ω 0,65 de la parte 2 §5.5.2 para la frecuencia; con el acoplamiento de cálculo (base de las tablas de las partes 3 / 5) su n1 queda por debajo de 4 Hz, por eso no se propone.', 'Cieńszy skład z katalogu spełnia warunek częstotliwości tylko z ω 0,65 części 2 §5.5.2; ze sprzężeniem obliczeniowym (podstawa tablic części 3 / 5) jego n1 jest poniżej 4 Hz, więc nie jest proponowany.'],

  'w.part4_edges': ['Part 4 coupling is tabulated for 4 edges only — part 2 ω is used for 2 or 3 edges.', 'Зв’язок частини 4 табульовано лише для 4 країв — для 2 або 3 країв використано ω частини 2.', 'Die Kopplung nach Teil 4 ist nur für 4 Kanten tabelliert — bei 2 oder 3 Kanten gilt ω nach Teil 2.', 'De koppeling van deel 4 is enkel voor 4 zijden getabelleerd — bij 2 of 3 zijden wordt ω van deel 2 gebruikt.', 'Le couplage de la partie 4 n’est tabulé que pour 4 appuis — ω de la partie 2 est utilisé pour 2 ou 3 appuis.', 'El acoplamiento de la parte 4 solo está tabulado para 4 bordes; con 2 o 3 bordes se usa ω de la parte 2.', 'Sprzężenie części 4 jest stablicowane tylko dla 4 krawędzi — dla 2 lub 3 krawędzi użyto ω części 2.'],
  'w.roof_cp_assumed': ['Roof: the net pressure coefficients and the snow load are inputs — the defaults are learning assumptions; take cpe, cpi and s from NBN EN 1991-1-4 / -1-3 for your roof.', 'Дах: нетто-коефіцієнти тиску й сніг — вхідні дані; типові значення — навчальні припущення; візьміть cpe, cpi і s з NBN EN 1991-1-4 / -1-3.', 'Dach: Netto-Druckbeiwerte und Schneelast sind Eingaben — die Vorgaben sind Lernannahmen; cpe, cpi und s für Ihr Dach nach NBN EN 1991-1-4 / -1-3.', 'Dak: de netto drukcoëfficiënten en de sneeuwlast zijn invoer — de standaardwaarden zijn leeraannames; neem cpe, cpi en s uit NBN EN 1991-1-4 / -1-3.', 'Toiture : les coefficients de pression nets et la neige sont des données — les valeurs par défaut sont pédagogiques ; prenez cpe, cpi et s dans la NBN EN 1991-1-4 / -1-3.', 'Cubierta: los coeficientes netos y la nieve son datos de entrada; los valores por defecto son supuestos didácticos; tome cpe, cpi y s de NBN EN 1991-1-4 / -1-3.', 'Dach: współczynniki ciśnienia netto i śnieg to dane wejściowe — wartości domyślne są dydaktyczne; przyjmij cpe, cpi i s z NBN EN 1991-1-4 / -1-3.'],
  'w.freq_table_basis': ['With the design coupling of the laminate the first frequency would be below 4 Hz (the basis of the part 3 / 5 tables).', 'Зі зв’язком шарів за розрахунковим випадком перша частота була б нижче 4 Гц (основа таблиць частин 3 / 5).', 'Mit der Bemessungskopplung des Verbundglases läge die erste Eigenfrequenz unter 4 Hz (Grundlage der Tabellen von Teil 3 / 5).', 'Met de ontwerpkoppeling van het gelaagd glas zou de eerste frequentie onder 4 Hz liggen (basis van de tabellen van deel 3 / 5).', 'Avec le couplage de calcul du feuilleté, la première fréquence serait sous 4 Hz (base des tableaux des parties 3 / 5).', 'Con el acoplamiento de cálculo del laminado la primera frecuencia sería inferior a 4 Hz (base de las tablas de las partes 3 / 5).', 'Przy obliczeniowym sprzężeniu laminatu pierwsza częstotliwość byłaby poniżej 4 Hz (podstawa tablic części 3 / 5).'],
  'w.roughness_analysis': ['The site needs a roughness analysis (NBN S 23-002-3 Tab. 1 note).', 'Майданчик потребує аналізу шорсткості (примітка NBN S 23-002-3 Tab. 1).', 'Der Standort erfordert eine Rauigkeitsanalyse (Anmerkung zu NBN S 23-002-3 Tab. 1).', 'De bouwplaats vraagt een ruwheidsanalyse (opmerking bij NBN S 23-002-3 Tab. 1).', 'Le site demande une analyse de rugosité (note du Tab. 1 de la NBN S 23-002-3).', 'El emplazamiento requiere un análisis de rugosidad (nota de NBN S 23-002-3 Tab. 1).', 'Lokalizacja wymaga analizy chropowatości (uwaga do NBN S 23-002-3 Tab. 1).'],
  'w.site_off_table': ['The site is outside NBN S 23-002-3 Tab. 1: qp is estimated with EN 1991-1-4 (recommended terrain parameters).', 'Майданчик поза NBN S 23-002-3 Tab. 1: qp оцінено за EN 1991-1-4 (рекомендовані параметри місцевості).', 'Der Standort liegt außerhalb von NBN S 23-002-3 Tab. 1: qp nach EN 1991-1-4 (empfohlene Geländeparameter) geschätzt.', 'De bouwplaats valt buiten NBN S 23-002-3 Tab. 1: qp geschat met EN 1991-1-4 (aanbevolen terreinparameters).', 'Le site sort du Tab. 1 de la NBN S 23-002-3 : qp estimée par l’EN 1991-1-4 (paramètres de terrain recommandés).', 'El emplazamiento queda fuera de NBN S 23-002-3 Tab. 1: qp estimada con EN 1991-1-4 (parámetros de terreno recomendados).', 'Lokalizacja poza NBN S 23-002-3 Tab. 1: qp oszacowano wg EN 1991-1-4 (zalecane parametry terenu).'],
  'w.igu_net_outer': ['A given net wind pressure acts on the outer pane only (learning assumption); with a class or qp the internal pressure share acts on the inner pane as in Tab. 39.', 'Заданий нетто-тиск діє лише на зовнішній лист (навчальне припущення); з класом чи qp частка внутрішнього тиску діє на внутрішній лист як у Tab. 39.', 'Ein vorgegebener Netto-Winddruck wirkt nur auf die äußere Scheibe (Lernannahme); mit Klasse oder qp wirkt der Innendruckanteil wie in Tab. 39 auf die innere Scheibe.', 'Een opgegeven netto winddruk werkt enkel op het buitenblad (leeraanname); met een klasse of qp werkt het binnendrukaandeel op het binnenblad zoals in Tab. 39.', 'Une pression nette donnée agit sur le seul verre extérieur (hypothèse pédagogique) ; avec une classe ou qp, la part de pression intérieure agit sur le verre intérieur comme au Tab. 39.', 'Una presión neta dada actúa solo sobre la hoja exterior (supuesto didáctico); con clase o qp la parte de presión interior actúa sobre la hoja interior como en la Tab. 39.', 'Podane ciśnienie netto działa tylko na taflę zewnętrzną (założenie dydaktyczne); przy klasie lub qp udział ciśnienia wewnętrznego działa na taflę wewnętrzną jak w Tab. 39.'],
  'w.igu_small_annexA': ['Short side ≤ 0,5 m: §8.5.1 advises cavity temperatures by Annex A when the project differs from the reference situations.', 'Коротка сторона ≤ 0,5 м: §8.5.1 радить визначати температури камер за Annex A, якщо проєкт відрізняється від еталонних ситуацій.', 'Kurze Seite ≤ 0,5 m: §8.5.1 empfiehlt SZR-Temperaturen nach Anhang A, wenn das Projekt von den Referenzsituationen abweicht.', 'Korte zijde ≤ 0,5 m: §8.5.1 raadt spouwtemperaturen volgens bijlage A aan als het project afwijkt van de referentiesituaties.', 'Petit côté ≤ 0,5 m : le §8.5.1 conseille les températures de lame de l’annexe A si le projet s’écarte des situations de référence.', 'Lado corto ≤ 0,5 m: §8.5.1 aconseja temperaturas de cámara según el anexo A si el proyecto difiere de las situaciones de referencia.', 'Krótszy bok ≤ 0,5 m: §8.5.1 zaleca temperatury komór wg załącznika A, gdy projekt odbiega od sytuacji odniesienia.'],
  'w.igu_cavity_ref': ['The cavity differs from the reference of the P0 tables (16 mm double, 12 mm triple); the standard allows ± 10 % on pC0 — adjust the pC0 factor if needed.', 'Камера відрізняється від еталону таблиць P0 (16 мм для двох стекол, 12 мм для трьох); стандарт допускає ± 10 % для pC0 — за потреби змініть коефіцієнт до pC0.', 'Der SZR weicht von der Referenz der P0-Tabellen ab (16 mm zweifach, 12 mm dreifach); die Norm lässt ± 10 % auf pC0 zu — Faktor auf pC0 ggf. anpassen.', 'De spouw wijkt af van de referentie van de P0-tabellen (16 mm dubbel, 12 mm drievoudig); de norm laat ± 10 % op pC0 toe — pas zo nodig de factor op pC0 aan.', 'La lame diffère de la référence des tableaux P0 (16 mm double, 12 mm triple) ; la norme admet ± 10 % sur pC0 — ajustez le facteur sur pC0 au besoin.', 'La cámara difiere de la referencia de las tablas P0 (16 mm doble, 12 mm triple); la norma admite ± 10 % en pC0: ajuste el factor sobre pC0 si hace falta.', 'Komora różni się od odniesienia tablic P0 (16 mm dwuszybowa, 12 mm trzyszybowa); norma dopuszcza ± 10 % dla pC0 — w razie potrzeby zmień współczynnik dla pC0.'],

02-3:2020 §3.2 / Tab. 1–3; vidrio laminado parte 2 §4.3 o NBN S 23-002-4:2025 §5. Solo ayuda de proyecto.', 'Przypadki, kombinacje i kryteria: NBN S 23-002-2:2020 §7–§10; podział obciążeń i sprzężenie gazowe §4.4–4.5 (równ. (28)); ciśnienie izochoryczne §8.5 (Tab. 20–36); płyty §5 (nieliniowe k1 / k4, postać EN 16612 załącznik B); wiatr na fasadzie NBN S 23-002-3:2020 §3.2 / Tab. 1–3; szkło laminowane część 2 §4.3 lub NBN S 23-002-4:2025 §5. Tylko pomoc projektowa.']

    ['1,2 × 1,8 m, class 4: 6 mm passes in zone 1 (0,97) but fails in the edge zone 2 (1,12) — the corners of a façade carry more suction; 8 mm is needed there.', '1,2 × 1,8 м, клас 4: 6 мм проходить у зоні 1 (0,97), але не в крайовій зоні 2 (1,12) — кути фасаду мають більше відсмоктування; там потрібно 8 мм.', '1,2 × 1,8 m, Klasse 4: 6 mm genügt in Zone 1 (0,97), nicht aber im Randbereich Zone 2 (1,12) — Fassadenecken haben mehr Sog; dort sind 8 mm nötig.', '1,2 × 1,8 m, klasse 4: 6 mm voldoet in zone 1 (0,97) maar niet in randzone 2 (1,12) — gevelhoeken krijgen meer zuiging; daar is 8 mm nodig.', '1,2 × 1,8 m, classe 4 : 6 mm passe en zone 1 (0,97) mais pas en zone de rive 2 (1,12) — les angles de façade subissent plus de dépression ; il y faut 8 mm.', '1,2 × 1,8 m, clase 4: 6 mm cumple en la zona 1 (0,97) pero no en la zona de borde 2 (1,12): las esquinas reciben más succión; allí hacen falta 8 mm.', '1,2 × 1,8 m, klasa 4: 6 mm spełnia w strefie 1 (0,97), ale nie w strefie krawędziowej 2 (1,12) — narożniki fasady mają większe ssanie; tam trzeba 8 mm.']],
  'laminate-wind-snow': [['44.2 laminate in a roof', 'Триплекс 44.2 у даху', 'VSG 44.2 im Dach', 'Gelaagd 44.2 in een dak', 'Feuilleté 44.2 en toiture', 'Laminado 44.2 en cubierta', 'Laminat 44.2 w dachu'],
    ['Two 4 mm plies with 0,76 mm PVB: in a façade under wind (ω 0,2) the laminate counts as ≈ 6,2 mm, in a roof (ω 0 for every action, Tab. 5) as ≈ 5,0 mm — same glass, less stiffness under long loads.', 'Два шари по 4 мм із PVB 0,76 мм: на фасаді під вітром (ω 0,2) триплекс рахується як ≈ 6,2 мм, у даху (ω 0 для всіх дій, Tab. 5) — як ≈ 5,0 мм: те саме скло, менша жорсткість під тривалим навантаженням.', 'Zwei 4-mm-Scheiben mit 0,76 mm PVB: in der Fassade unter Wind (ω 0,2) zählt das VSG wie ≈ 6,2 mm, im Dach (ω 0 für alle Einwirkungen, Tab. 5) wie ≈ 5,0 mm — gleiches Glas, weniger Steifigkeit unter langen Lasten.', 'Twee bladen van 4 mm met 0,76 mm PVB: in een gevel onder wind (ω 0,2) telt het gelaagd glas als ≈ 6,2 mm, in een dak (ω 0 voor elke actie, Tab. 5) als ≈ 5,0 mm — hetzelfde glas, minder stijfheid onder lange belastingen.', 'Deux feuilles de 4 mm avec PVB 0,76 mm : en façade sous vent (ω 0,2) le feuilleté vaut ≈ 6,2 mm, en toiture (ω 0 pour toute action, Tab. 5) ≈ 5,0 mm — même verre, moins de rigidité sous charges longues.', 'Dos hojas de 4 mm con PVB de 0,76 mm: en fachada con viento (ω 0,2) el laminado equivale a ≈ 6,2 mm, en cubierta (ω 0 para toda acción, Tab. 5) a ≈ 5,0 mm: el mismo vidrio, menos rigidez con cargas largas.', 'Dwie tafle 4 mm z PVB 0,76 mm: w fasadzie pod wiatrem (ω 0,2) laminat liczy się jak ≈ 6,2 mm, w dachu (ω 0 dla wszystkich oddziaływań, Tab. 5) jak ≈ 5,0 mm — to samo szkło, mniejsza sztywność pod długimi obciążeniami.']],
  'small-igu-climate': [['Small IGU — the weather breaks it, not the wind', 'Малий склопакет — ламає погода, а не вітер', 'Kleines Isolierglas — das Wetter, nicht der Wind', 'Kleine isolerende beglazing — het weer, niet de wind', 'Petit vitrage isolant — le climat, pas le vent', 'Doble acristalamiento pequeño: el clima, no el viento', 'Mała szyba zespolona — pogoda, nie wiatr'],
    ['4-16-4, 0,40 × 0,50 m, ±300 m between plant and site: wind alone uses 16 % of the glass, the winter anticyclone with the altitude difference 95 % — small stiff units cannot breathe, the gas pressure stays in the glass.', '4-16-4, 0,40 × 0,50 м, ±300 м між заводом і об’єктом: сам вітер використовує 16 % скла, зимовий антициклон із різницею висот — 95 %: малі жорсткі склопакети не «дихають», тиск газу лишається в склі.', '4-16-4, 0,40 × 0,50 m, ±300 m zwischen Werk und Einbauort: Wind allein nutzt 16 % des Glases, das Winterhoch mit dem Höhenunterschied 95 % — kleine steife Einheiten können nicht atmen, der Gasdruck bleibt im Glas.', '4-16-4, 0,40 × 0,50 m, ±300 m tussen fabriek en bouwplaats: wind alleen benut 16 % van het glas, de winteranticycloon met het hoogteverschil 95 % — kleine stijve eenheden kunnen niet ademen, de gasdruk blijft in het glas.', '4-16-4, 0,40 × 0,50 m, ±300 m entre usine et chantier : le vent seul utilise 16 % du verre, l’anticyclone hivernal avec la différence d’altitude 95 % — les petits vitrages rigides ne respirent pas, la pression du gaz reste dans le verre.', '4-16-4, 0,40 × 0,50 m, ±300 m entre fábrica y obra: el viento solo usa el 16 % del vidrio, el anticiclón invernal con la diferencia de altitud el 95 %: las unidades pequeñas y rígidas no respiran, la presión del gas se queda en el vidrio.', '4-16-4, 0,40 × 0,50 m, ±300 m między zakładem a budową: sam wiatr wykorzystuje 16 % szkła, wyż zimowy z różnicą wysokości 95 % — małe sztywne zestawy nie „oddychają”, ciśnienie gazu zostaje w szkle.']],
  'large-linear': [['Large pane: linear theory overestimates', 'Велике скло: лінійна теорія завищує', 'Große Scheibe: lineare Theorie überschätzt', 'Grote ruit: lineaire theorie overschat', 'Grand vitrage : la théorie linéaire surestime', 'Vidrio grande: la teoría lineal sobrestima', 'Duża szyba: teoria liniowa zawyża'],
    ['2 × 3 m, 8 mm, class 4: linear plate theory gives a stress 1,78 × the non-linear value of NBN S 23-002-2 §5.2 — membrane action carries much of the load once the pane deflects more than its thickness.', '2 × 3 м, 8 мм, клас 4: лінійна теорія пластин дає напруження в 1,78 раза більше за нелінійне значення NBN S 23-002-2 §5.2 — мембранна дія несе багато навантаження, щойно прогин перевищує товщину.', '2 × 3 m, 8 mm, Klasse 4: lineare Plattentheorie ergibt das 1,78-Fache der nichtlinearen Spannung nach NBN S 23-002-2 §5.2 — die Membranwirkung trägt viel, sobald die Durchbiegung die Dicke übersteigt.', '2 × 3 m, 8 mm, klasse 4: lineaire plaattheorie geeft 1,78 × de niet-lineaire spanning van NBN S 23-002-2 §5.2 — membraanwerking draagt veel zodra de doorbuiging groter is dan de dikte.', '2 × 3 m, 8 mm, classe 4 : la théorie linéaire donne 1,78 × la contrainte non linéaire de la NBN S 23-002-2 §5.2 — l’effet de membrane porte beaucoup dès que la flèche dépasse l’épaisseur.', '2 × 3 m, 8 mm, clase 4: la teoría lineal da 1,78 × la tensión no lineal de NBN S 23-002-2 §5.2: el efecto membrana soporta mucho en cuanto la flecha supera el espesor.', '2 × 3 m, 8 mm, klasa 4: teoria liniowa daje 1,78 × naprężenie nieliniowe wg NBN S 23-002-2 §5.2 — efekt membranowy przenosi dużo, gdy ugięcie przekracza grubość.']],
  'toughened-narrow': [['Toughened: stronger, not stiffer', 'Загартоване: міцніше, але не жорсткіше', 'ESG: fester, nicht steifer', 'Gehard: sterker, niet stijver', 'Trempé : plus résistant, pas plus rigide', 'Templado: más resistente, no más rígido', 'Hartowane: mocniejsze, nie sztywniejsze'],
    ['0,5 × 2,0 m, class 6, edge zone: toughened 4 mm passes where annealed needs 5 mm (fg;d 81 vs 18,5 MPa). On a wider 0,8 × 1,2 m pane deflection governs and toughened still needs 5 mm instead of 6.', '0,5 × 2,0 м, клас 6, крайова зона: загартоване 4 мм проходить там, де відпаленому треба 5 мм (fg;d 81 проти 18,5 МПа). На ширшому склі 0,8 × 1,2 м визначає прогин, і загартованому все одно треба 5 мм замість 6.', '0,5 × 2,0 m, Klasse 6, Randzone: ESG 4 mm genügt, wo Float 5 mm braucht (fg;d 81 statt 18,5 MPa). Bei einer breiteren Scheibe 0,8 × 1,2 m maßgebend ist die Durchbiegung: ESG braucht 5 mm statt 6.', '0,5 × 2,0 m, klasse 6, randzone: gehard 4 mm voldoet waar gegloeid 5 mm nodig heeft (fg;d 81 tegen 18,5 MPa). Bij een bredere ruit 0,8 × 1,2 m is de doorbuiging maatgevend en vraagt gehard nog 5 mm in plaats van 6.', '0,5 × 2,0 m, classe 6, zone de rive : le trempé 4 mm passe là où le recuit demande 5 mm (fg;d 81 contre 18,5 MPa). Sur un vitrage plus large 0,8 × 1,2 m, la flèche gouverne et le trempé demande encore 5 mm au lieu de 6.', '0,5 × 2,0 m, clase 6, zona de borde: templado de 4 mm cumple donde el recocido necesita 5 mm (fg;d 81 frente a 18,5 MPa). En un vidrio más ancho de 0,8 × 1,2 m manda la flecha y el templado aún necesita 5 mm en lugar de 6.', '0,5 × 2,0 m, klasa 6, strefa krawędziowa: hartowane 4 mm spełnia tam, gdzie odprężone wymaga 5 mm (fg;d 81 wobec 18,5 MPa). Przy szerszej szybie 0,8 × 1,2 m decyduje ugięcie i hartowane nadal wymaga 5 mm zamiast 6.']],
  'roof-igu-snow': [['Roof IGU: snow governs', 'Склопакет у даху: визначає сніг', 'Dach-Isolierglas: Schnee maßgebend', 'Dakbeglazing: sneeuw maatgevend', 'Vitrage isolant de toiture : la neige gouverne', 'Doble acristalamiento en cubierta: manda la nieve', 'Szyba zespolona w dachu: decyduje śnieg'],
    ['6-16-44.2 at 10° from horizontal, sk 0,5 kN/m²: the snow combinations govern the outer pane (0,93) while the wind combination uses 0,53 — snow lasts weeks, so glass only has kmod 0,44 against 0,74 under wind.', '6-16-44.2 під кутом 10° до горизонту, sk 0,5 кН/м²: снігові комбінації визначають зовнішній лист (0,93), вітрова — 0,53: сніг лежить тижнями, тож у скла лише kmod 0,44 проти 0,74 під вітром.', '6-16-44.2 mit 10° Neigung, sk 0,5 kN/m²: die Schneekombinationen sind für die äußere Scheibe maßgebend (0,93), die Windkombination nutzt 0,53 — Schnee liegt Wochen, also hat Glas nur kmod 0,44 statt 0,74 unter Wind.', '6-16-44.2 onder 10° met de horizontale, sk 0,5 kN/m²: de sneeuwcombinaties zijn maatgevend voor het buitenblad (0,93), de windcombinatie benut 0,53 — sneeuw blijft weken liggen, dus heeft glas slechts kmod 0,44 tegen 0,74 onder wind.', '6-16-44.2 à 10° de l’horizontale, sk 0,5 kN/m² : les combinaisons de neige gouvernent le verre extérieur (0,93), la combinaison de vent n’utilise que 0,53 — la neige dure des semaines, le verre n’a alors que kmod 0,44 contre 0,74 sous vent.', '6-16-44.2 a 10° de la horizontal, sk 0,5 kN/m²: las combinaciones de nieve mandan en la hoja exterior (0,93) y la de viento usa 0,53: la nieve dura semanas, así que el vidrio solo tiene kmod 0,44 frente a 0,74 con viento.', '6-16-44.2 pod kątem 10° do poziomu, sk 0,5 kN/m²: kombinacje śniegowe decydują o tafli zewnętrznej (0,93), wiatrowa wykorzystuje 0,53 — śnieg leży tygodniami, więc szkło ma tylko kmod 0,44 zamiast 0,74 pod wiatrem.']],
  'triple-middle': [['Triple glazing: the middle pane', 'Склопакет з трьох стекол: середній лист', 'Dreifachglas: die mittlere Scheibe', 'Drievoudig glas: het middenblad', 'Triple vitrage : le verre central', 'Triple acristalamiento: la hoja central', 'Szyba trzyszybowa: tafla środkowa'],
    ['4-12-4-12-4, 1,2 × 1,5 m, class 4: the middle pane has no wind of its own, yet the two gas cushions pass it about a third of the wind (≈ 400 of 1 200 Pa); the climatic pressures of the two cavities instead nearly cancel on it and load the outer and inner panes.', '4-12-4-12-4, 1,2 × 1,5 м, клас 4: середній лист не має власного вітру, але дві газові подушки передають йому близько третини вітру (≈ 400 з 1 200 Па); кліматичні тиски двох камер на ньому майже взаємно гасяться й навантажують зовнішній і внутрішній листи.', '4-12-4-12-4, 1,2 × 1,5 m, Klasse 4: die mittlere Scheibe hat keinen eigenen Wind, doch die beiden Gaspolster geben ihr etwa ein Drittel davon weiter (≈ 400 von 1 200 Pa); die Klimadrücke beider SZR heben sich auf ihr dagegen fast auf und belasten die äußere und innere Scheibe.', '4-12-4-12-4, 1,2 × 1,5 m, klasse 4: het middenblad krijgt zelf geen wind, maar de twee gaskussens geven het ongeveer een derde ervan door (≈ 400 van 1 200 Pa); de klimaatdrukken van de twee spouwen heffen elkaar erop bijna op en belasten het buiten- en binnenblad.', '4-12-4-12-4, 1,2 × 1,5 m, classe 4 : le verre central ne reçoit pas de vent propre, mais les deux coussins de gaz lui en transmettent environ un tiers (≈ 400 sur 1 200 Pa) ; les pressions climatiques des deux lames s’y annulent presque et chargent les verres extérieur et intérieur.', '4-12-4-12-4, 1,2 × 1,5 m, clase 4: la hoja central no recibe viento propio, pero los dos colchones de gas le transmiten cerca de un tercio (≈ 400 de 1 200 Pa); las presiones climáticas de las dos cámaras casi se anulan en ella y cargan las hojas exterior e interior.', '4-12-4-12-4, 1,2 × 1,5 m, klasa 4: tafla środkowa nie ma własnego wiatru, ale dwie poduszki gazowe przekazują jej około jednej trzeciej (≈ 400 z 1 200 Pa); ciśnienia klimatyczne obu komór prawie się na niej znoszą i obciążają tafle zewnętrzną i wewnętrzną.']],
  'tall-2edges': [['Tall pane on two edges', 'Високе скло на двох опорах', 'Hohe Scheibe zweiseitig gelagert', 'Hoge ruit op twee zijden', 'Grand vitrage sur deux appuis', 'Vidrio alto sobre dos apoyos', 'Wysoka szyba na dwóch krawędziach'],
    ['0,6 × 3 m, 6 mm, held only at top and bottom: it spans 3 m like a plank, fails by stress and has a first natural frequency of 1,6 Hz (< 4 Hz of part 3); the same pane on 4 edges vibrates at ≈ 43 Hz and passes.', '0,6 × 3 м, 6 мм, оперте лише зверху й знизу: працює як дошка прольотом 3 м, не проходить за напруженням і має першу власну частоту 1,6 Гц (< 4 Гц частини 3); те саме скло на 4 опорах — ≈ 43 Гц і проходить.', '0,6 × 3 m, 6 mm, nur oben und unten gehalten: spannt 3 m wie ein Brett, versagt auf Spannung und hat eine erste Eigenfrequenz von 1,6 Hz (< 4 Hz nach Teil 3); dieselbe Scheibe 4-seitig gelagert schwingt mit ≈ 43 Hz und genügt.', '0,6 × 3 m, 6 mm, enkel boven en onder vastgehouden: overspant 3 m als een plank, faalt op spanning en heeft een eerste eigenfrequentie van 1,6 Hz (< 4 Hz van deel 3); dezelfde ruit op 4 zijden trilt op ≈ 43 Hz en voldoet.', '0,6 × 3 m, 6 mm, tenu seulement en haut et en bas : il franchit 3 m comme une planche, casse en contrainte et sa première fréquence propre vaut 1,6 Hz (< 4 Hz de la partie 3) ; le même vitrage sur 4 appuis vibre à ≈ 43 Hz et convient.', '0,6 × 3 m, 6 mm, sujeto solo arriba y abajo: salva 3 m como una tabla, falla a tensión y su primera frecuencia propia es 1,6 Hz (< 4 Hz de la parte 3); el mismo vidrio sobre 4 bordes vibra a ≈ 43 Hz y cumple.', '0,6 × 3 m, 6 mm, trzymana tylko u góry i u dołu: przęsło 3 m jak deska, nie spełnia na naprężenie, a pierwsza częstotliwość własna to 1,6 Hz (< 4 Hz części 3); ta sama szyba na 4 krawędziach drga z ≈ 43 Hz i spełnia.']]

  version: 1,
  intro: { title: T7(['What this tool does', 'Що робить цей інструмент', 'Was dieses Werkzeug tut', 'Wat deze tool doet', 'Ce que fait cet outil', 'Qué hace esta herramienta', 'Co robi to narzędzie']),
    body: T7(['Glass is brittle: it must stay below a design stress that depends on how long the load lasts, and it must not deflect too much. The Belgian standard NBN S 23-002-2 lists which loads to combine — wind, snow, self-weight and, in insulating glass, the pressure of the sealed gas when weather and altitude change. The tool applies them to each pane and finds the thinnest composition that passes.', 'Скло крихке: воно має лишатися нижче розрахункового напруження, яке залежить від тривалості навантаження, і не прогинатися надто сильно. Бельгійський стандарт NBN S 23-002-2 визначає, які навантаження поєднувати — вітер, сніг, власну вагу і, у склопакетах, тиск герметизованого газу при зміні погоди й висоти. Інструмент прикладає їх до кожного листа й знаходить найтонший склад, що проходить.', 'Glas ist spröde: Es muss unter einer Bemessungsspannung bleiben, die von der Lastdauer abhängt, und darf sich nicht zu stark durchbiegen. Die belgische Norm NBN S 23-002-2 legt fest, welche Lasten zu kombinieren sind — Wind, Schnee, Eigengewicht und beim Isolierglas der Druck des eingeschlossenen Gases bei Wetter- und Höhenänderung. Das Werkzeug wendet sie auf jede Scheibe an und findet den dünnsten ausreichenden Aufbau.', 'Glas is bros: het moet onder een rekenspanning blijven die afhangt van de duur van de belasting, en het mag niet te veel doorbuigen. De Belgische norm NBN S 23-002-2 bepaalt welke belastingen te combineren — wind, sneeuw, eigen gewicht en bij isolerend glas de druk van het ingesloten gas als weer en hoogte veranderen. De tool past ze op elk blad toe en vindt de dunste samenstelling die voldoet.', 'Le verre est fragile : il doit rester sous une contrainte de calcul qui dépend de la durée de la charge et ne pas trop fléchir. La norme belge NBN S 23-002-2 fixe les charges à combiner — vent, neige, poids propre et, pour le vitrage isolant, la pression du gaz scellé quand la météo et l’altitude changent. L’outil les applique à chaque verre et trouve la composition la plus mince qui convient.', 'El vidrio es frágil: debe quedar por debajo de una tensión de cálculo que depende de la duración de la carga y no debe flectar demasiado. La norma belga NBN S 23-002-2 define qué cargas combinar: viento, nieve, peso propio y, en el doble acristalamiento, la presión del gas sellado cuando cambian el tiempo y la altitud. La herramienta las aplica a cada hoja y busca la composición más delgada que cumple.', 'Szkło jest kruche: musi pozostać poniżej naprężenia obliczeniowego zależnego od czasu trwania obciążenia i nie może się zbyt mocno uginać. Belgijska norma NBN S 23-002-2 określa, które obciążenia łączyć — wiatr, śnieg, ciężar własny, a w szybach zespolonych ciśnienie zamkniętego gazu przy zmianach pogody i wysokości. Narzędzie przykłada je do każdej tafli i znajduje najcieńszy skład, który spełnia.']) },
  topics: {
    loads: { title: T7(['Load cases', 'Випадки навантаження', 'Lastfälle', 'Belastingsgevallen', 'Cas de charge', 'Casos de carga', 'Przypadki obciążeń']),
      body: T7(['Façade: wind suction and wind pressure (25-year wind, cprob² = 0,92, γQ 1,1 at ULS) with the cavity pressure as accompanying action, and the winter anticyclone alone. Roof: self-weight with wind, with snow, with both, wind uplift, the anticyclone with snow, and self-weight alone over 25 years. Each pane is checked in every case; a favourable variable action is left out pane by pane (§9.2).', 'Фасад: відсмоктування й тиск вітру (25-річний вітер, cprob² = 0,92, γQ 1,1 для ULS) з тиском у камері як супутньою дією та окремо зимовий антициклон. Дах: власна вага з вітром, зі снігом, з обома, підйом вітром, антициклон зі снігом і сама власна вага за 25 років. Кожен лист перевіряють у кожному випадку; сприятливу змінну дію відкидають для кожного листа окремо (§9.2).', 'Fassade: Windsog und Winddruck (25-jährlicher Wind, cprob² = 0,92, γQ 1,1 im GZT) mit dem Innendruck als Begleiteinwirkung sowie das Winterhoch allein. Dach: Eigengewicht mit Wind, mit Schnee, mit beiden, Windsog, Hoch mit Schnee und Eigengewicht allein über 25 Jahre. Jede Scheibe wird in jedem Fall geprüft; eine günstige veränderliche Einwirkung entfällt je Scheibe (§9.2).', 'Gevel: windzuiging en winddruk (25-jaarswind, cprob² = 0,92, γQ 1,1 in UGT) met de spouwdruk als begeleidende actie, en de winteranticycloon alleen. Dak: eigen gewicht met wind, met sneeuw, met beide, windzuiging, de anticycloon met sneeuw en eigen gewicht alleen over 25 jaar. Elk blad wordt in elk geval getoetst; een gunstige veranderlijke actie vervalt per blad (§9.2).', 'Façade : dépression et pression du vent (vent de 25 ans, cprob² = 0,92, γQ 1,1 à l’ELU) avec la pression interne en accompagnement, et l’anticyclone hivernal seul. Toiture : poids propre avec vent, avec neige, avec les deux, soulèvement, anticyclone avec neige et poids propre seul sur 25 ans. Chaque verre est vérifié dans chaque cas ; une action variable favorable est omise verre par verre (§9.2).', 'Fachada: succión y presión de viento (viento de 25 años, cprob² = 0,92, γQ 1,1 en ELU) con la presión de cámara como acción concomitante, y el anticiclón invernal solo. Cubierta: peso propio con viento, con nieve, con ambos, succión, el anticiclón con nieve y el peso propio solo durante 25 años. Cada hoja se comprueba en cada caso; una acción variable favorable se omite hoja por hoja (§9.2).', 'Fasada: ssanie i parcie wiatru (wiatr 25-letni, cprob² = 0,92, γQ 1,1 w SGN) z ciśnieniem w komorze jako oddziaływaniem towarzyszącym oraz sam wyż zimowy. Dach: ciężar własny z wiatrem, ze śniegiem, z oboma, ssanie, wyż ze śniegiem i sam ciężar własny przez 25 lat. Każdą taflę sprawdza się w każdym przypadku; korzystne oddziaływanie zmienne pomija się osobno dla każdej tafli (§9.2).']) },
    igu: { title: T7(['Insulating glass: gas coupling and climatic load', 'Склопакет: газовий зв’язок і кліматичне навантаження', 'Isolierglas: Gaskopplung und Klimalast', 'Isolerend glas: gaskoppeling en klimaatbelasting', 'Vitrage isolant : couplage gazeux et charge climatique', 'Doble acristalamiento: acoplamiento por gas y carga climática', 'Szyba zespolona: sprzężenie gazowe i obciążenie klimatyczne']),
      body: T7(['The sealed gas links the panes: wind on the outer pane compresses the cavity and pushes the inner pane too (NBN S 23-002-2 §4.4–4.5). When the weather or the altitude changes, the gas pressure P0 (§8.5: 0,34 kPa per kelvin, 0,012 kPa per metre, the air pressure itself) bulges both panes. A large soft pane relieves it by deflecting (φ → 0); a small stiff unit keeps it (φ → 1) — that is why small insulating units are governed by climate.', 'Герметизований газ зв’язує листи: вітер на зовнішньому листі стискає камеру й тисне також на внутрішній (NBN S 23-002-2 §4.4–4.5). Коли змінюються погода чи висота, тиск газу P0 (§8.5: 0,34 кПа на кельвін, 0,012 кПа на метр і сам атмосферний тиск) вигинає обидва листи. Велике м’яке скло знімає його прогином (φ → 0); малий жорсткий склопакет його зберігає (φ → 1) — тому для малих склопакетів визначальний клімат.', 'Das eingeschlossene Gas koppelt die Scheiben: Wind auf der äußeren Scheibe drückt den SZR zusammen und belastet auch die innere (NBN S 23-002-2 §4.4–4.5). Ändern sich Wetter oder Höhe, wölbt der Gasdruck P0 (§8.5: 0,34 kPa je Kelvin, 0,012 kPa je Meter, der Luftdruck selbst) beide Scheiben. Eine große weiche Scheibe baut ihn durch Durchbiegung ab (φ → 0), eine kleine steife Einheit behält ihn (φ → 1) — deshalb bestimmt bei kleinen Isoliergläsern das Klima.', 'Het ingesloten gas koppelt de bladen: wind op het buitenblad drukt de spouw samen en belast ook het binnenblad (NBN S 23-002-2 §4.4–4.5). Veranderen weer of hoogte, dan bolt de gasdruk P0 (§8.5: 0,34 kPa per kelvin, 0,012 kPa per meter, de luchtdruk zelf) beide bladen. Een grote soepele ruit baut hem af door door te buigen (φ → 0), een kleine stijve eenheid houdt hem vast (φ → 1) — daarom bepaalt bij kleine eenheden het klimaat.', 'Le gaz scellé relie les verres : le vent sur le verre extérieur comprime la lame et charge aussi le verre intérieur (NBN S 23-002-2 §4.4–4.5). Quand la météo ou l’altitude change, la pression du gaz P0 (§8.5 : 0,34 kPa par kelvin, 0,012 kPa par mètre, la pression atmosphérique elle-même) bombe les deux verres. Un grand vitrage souple la soulage en fléchissant (φ → 0) ; un petit vitrage rigide la garde (φ → 1) — c’est pourquoi le climat gouverne les petits vitrages isolants.', 'El gas sellado une las hojas: el viento sobre la exterior comprime la cámara y empuja también la interior (NBN S 23-002-2 §4.4–4.5). Cuando cambian el tiempo o la altitud, la presión del gas P0 (§8.5: 0,34 kPa por kelvin, 0,012 kPa por metro y la propia presión atmosférica) abomba ambas hojas. Un vidrio grande y flexible la alivia flectando (φ → 0); una unidad pequeña y rígida la conserva (φ → 1): por eso en las unidades pequeñas manda el clima.', 'Zamknięty gaz łączy tafle: wiatr na tafli zewnętrznej ściska komorę i obciąża także wewnętrzną (NBN S 23-002-2 §4.4–4.5). Gdy zmienia się pogoda lub wysokość, ciśnienie gazu P0 (§8.5: 0,34 kPa na kelwin, 0,012 kPa na metr, samo ciśnienie atmosferyczne) wybrzusza obie tafle. Duża wiotka szyba rozładowuje je ugięciem (φ → 0), mały sztywny zestaw je zatrzymuje (φ → 1) — dlatego w małych szybach zespolonych decyduje klimat.']) },
    resist: { title: T7(['Strength, duration and deflection', 'Міцність, тривалість і прогин', 'Festigkeit, Dauer und Durchbiegung', 'Sterkte, duur en doorbuiging', 'Résistance, durée et flèche', 'Resistencia, duración y flecha', 'Wytrzymałość, czas trwania i ugięcie']),

oute (fb;k − 45)/1,2. Flèche : d/125 en verre simple, 15·10⁻⁶·d² + 0,0025·d + 2,5 mm en vitrage isolant (§10.2), négligée sous 5 mm. Les grands vitrages sont vérifiés avec les coefficients de plaque non linéaires du §5.2 — l’effet de membrane les rend plus résistants que ne le dit la théorie linéaire.', 'Vidrio recocido: fg;d = kmod·45/1,8; kmod baja con la duración: viento 0,74, presión de cámara 0,635, nieve 0,44, peso propio 0,31 (Tab. 1). El vidrio pretensado añade (fb;k − 45)/1,2. Flecha: d/125 en vidrio simple, 15·10⁻⁶·d² + 0,0025·d + 2,5 mm en doble acristalamiento (§10.2), se desprecia por debajo de 5 mm. Los vidrios grandes se comprueban con los coeficientes de placa no lineales de §5.2: el efecto membrana los hace más resistentes de lo que dice la teoría lineal.', 'Szkło odprężone: fg;d = kmod·45/1,8; kmod maleje z czasem trwania — wiatr 0,74, ciśnienie w szybie zespolonej 0,635, śnieg 0,44, ciężar własny 0,31 (Tab. 1). Szkło sprężone dodaje (fb;k − 45)/1,2. Ugięcie: d/125 dla szkła pojedynczego, 15·10⁻⁶·d² + 0,0025·d + 2,5 mm dla szyby zespolonej (§10.2), poniżej 5 mm pomijane. Duże szyby sprawdza się nieliniowymi współczynnikami płyt §5.2 — efekt membranowy czyni je mocniejszymi, niż mówi teoria liniowa.']) }
