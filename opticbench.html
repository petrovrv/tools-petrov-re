  "description": {
    "en": "Build a set-up on a 25 mm breadboard in a top view and see it in a WebGL 3D view. Every ray carries its wavelength, power and polarisation; at each surface it splits into refracted and reflected parts by the Fresnel equations, with Sellmeier dispersion of real glasses, total internal reflection, gratings, polarisers, wave plates, Faraday rotators, polarising cubes and fibres with core and NA. Screens and power meters report power, RMS spot radius, centroid and the light paths with optical path lengths; the power table shows where every milliwatt ends. Twelve presets each make one surprising point and the page proves it with the tracer: lens orientation, Kepler vs Galileo, spatial filter, Michelson and Mach–Zehnder, prism vs grating dispersion, Brewster window, Malus, λ/4 isolator, fibre NA, parabolic vs spherical mirror. Export the parts list with Thorlabs numbers, CSV, PNG/SVG and the scene, and hand the beam to Gaussian Beam and Laser Safety.",
    "uk": "Складіть схему на макетній плиті з кроком 25 мм у вигляді згори й подивіться на неї в 3D (WebGL). Кожен промінь несе довжину хвилі, потужність і поляризацію; на кожній поверхні він ділиться на заломлену й відбиту частини за формулами Френеля, з дисперсією Зельмаєра реального скла, повним внутрішнім відбиттям, ґратками, поляризаторами, хвильовими пластинками, обертачами Фарадея, поляризаційними кубами й волокнами із серцевиною та NA. Екрани й вимірювачі потужності показують потужність, середньоквадратичний радіус плями, центроїд і шляхи світла з оптичними довжинами; таблиця потужності показує, куди йде кожен міліват. Дванадцять прикладів, кожен з одним несподіваним висновком, який сторінка доводить трасуванням: орієнтація лінзи, Кеплер проти Галілея, просторовий фільтр, Майкельсон і Мах — Цендер, дисперсія призми й ґратки, вікно Брюстера, Малюс, ізолятор λ/4, NA волокна, параболічне проти сферичного дзеркала. Експорт специфікації з номерами Thorlabs, CSV, PNG/SVG і сцени, передача пучка в «Гаусів пучок» і «Лазерну безпеку».",
    "de": "Bauen Sie einen Aufbau auf einem 25-mm-Lochraster in der Draufsicht und sehen Sie ihn in einer WebGL-3D-Ansicht. Jeder Strahl trägt Wellenlänge, Leistung und Polarisation; an jeder Fläche teilt er sich nach Fresnel in gebrochenen und reflektierten Anteil, mit Sellmeier-Dispersion echter Gläser, Totalreflexion, Gittern, Polarisatoren, Verzögerungsplatten, Faraday-Rotatoren, Polarisationswürfeln und Fasern mit Kern und NA. Schirme und Leistungsmesser melden Leistung, RMS-Fleckradius, Schwerpunkt und die Lichtwege mit optischen Weglängen; die Leistungstabelle zeigt, wo jedes Milliwatt endet. Zwölf Beispiele machen je eine überraschende Aussage, die die Seite mit dem Raytracer belegt: Linsenorientierung, Kepler vs. Galilei, Raumfilter, Michelson und Mach-Zehnder, Prismen- vs. Gitterdispersion, Brewster-Fenster, Malus, λ/4-Isolator, Faser-NA, Parabol- vs. Kugelspiegel. Export der Teileliste mit Thorlabs-Nummern, CSV, PNG/SVG und Szene; Übergabe des Strahls an Gaußstrahl und Lasersicherheit.",
    "nl": "Bouw een opstelling op een breadboard met raster 25 mm in bovenaanzicht en bekijk ze in een WebGL-3D-weergave. Elke straal draagt golflengte, vermogen en polarisatie; aan elk oppervlak splitst ze volgens Fresnel in een gebroken en een gereflecteerd deel, met Sellmeier-dispersie van echte glazen, totale interne reflectie, tralies, polarisatoren, golfplaten, Faraday-rotatoren, polariserende kubussen en vezels met kern en NA. Schermen en vermogensmeters geven vermogen, RMS-vlekstraal, zwaartepunt en de lichtpaden met optische weglengtes; de vermogenstabel toont waar elke milliwatt blijft. Twaalf voorbeelden maken elk één verrassend punt dat de pagina met de raytracer bewijst: lensoriëntatie, Kepler tegenover Galilei, ruimtelijk filter, Michelson en Mach-Zehnder, prisma- tegenover traliedispersie, brewstervenster, Malus, λ/4-isolator, vezel-NA, paraboolspiegel tegenover bolspiegel. Export van de onderdelenlijst met Thorlabs-nummers, CSV, PNG/SVG en de scène; doorgeven van de bundel aan Gaussische bundel en Laserveiligheid.",
    "fr": "Construisez un montage sur un breadboard au pas de 25 mm en vue de dessus et voyez-le en 3D (WebGL). Chaque rayon porte sa longueur d’onde, sa puissance et sa polarisation ; à chaque surface il se divise selon Fresnel en parties réfractée et réfléchie, avec la dispersion de Sellmeier de vrais verres, la réflexion totale interne, les réseaux, polariseurs, lames d’onde, rotateurs de Faraday, cubes polariseurs et fibres avec cœur et ON. Écrans et puissancemètres donnent la puissance, le rayon RMS de la tache, le barycentre et les chemins de la lumière avec leurs chemins optiques ; le tableau de puissance montre où finit chaque milliwatt. Douze exemples font chacun un constat surprenant que la page prouve par le tracé : orientation de la lentille, Kepler contre Galilée, filtre spatial, Michelson et Mach-Zehnder, dispersion prisme contre réseau, fenêtre de Brewster, Malus, isolateur λ/4, ON de fibre, miroir parabolique contre sphérique. Export de la nomenclature avec références Thorlabs, CSV, PNG/SVG et scène ; transmission du faisceau à Faisceau gaussien et Sécurité laser.",
    "es": "Monte un montaje sobre una placa perforada de 25 mm en vista superior y véalo en 3D (WebGL). Cada rayo lleva su longitud de onda, potencia y polarización; en cada superficie se divide según Fresnel en partes refractada y reflejada, con dispersión de Sellmeier de vidrios reales, reflexión total interna, redes, polarizadores, láminas de onda, rotadores de Faraday, cubos polarizadores y fibras con núcleo y NA. Pantallas y medidores dan potencia, radio RMS de la mancha, centroide y los caminos de la luz con sus caminos ópticos; la tabla de potencia muestra dónde acaba cada milivatio. Doce ejemplos plantean cada uno un hecho sorprendente que la página demuestra con el trazador: orientación de la lente, Kepler frente a Galileo, filtro espacial, Michelson y Mach-Zehnder, dispersión de prisma frente a red, ventana de Brewster, Malus, aislador λ/4, NA de fibra, espejo parabólico frente a esférico. Exportación de la lista de piezas con referencias Thorlabs, CSV, PNG/SVG y la escena; paso del haz a Haz gaussiano y Seguridad láser.",
    "pl": "Zbuduj układ na płycie z otworami co 25 mm w widoku z góry i obejrzyj go w 3D (WebGL). Każdy promień niesie długość fali, moc i polaryzację; na każdej powierzchni dzieli się wg Fresnela na część załamaną i odbitą, z dyspersją Sellmeiera prawdziwych szkieł, całkowitym wewnętrznym odbiciem, siatkami, polaryzatorami, płytkami falowymi, rotatorami Faradaya, kostkami polaryzacyjnymi i światłowodami z rdzeniem i NA. Ekrany i mierniki mocy podają moc, promień RMS plamki, środek ciężkości i drogi światła z drogami optycznymi; tabela mocy pokazuje, gdzie kończy się każdy miliwat. Dwanaście przykładów stawia po jednej zaskakującej tezie, którą strona dowodzi śledzeniem promieni: orientacja soczewki, Kepler kontra Galileusz, filtr przestrzenny, Michelson i Mach-Zehnder, dyspersja pryzmatu kontra siatki, okno Brewstera, Malus, izolator λ/4, NA światłowodu, zwierciadło paraboliczne kontra sferyczne. Eksport listy części z numerami Thorlabs, CSV, PNG/SVG i sceny; przekazanie wiązki do Wiązki gaussowskiej i Bezpieczeństwa laserowego."

  "limitations": {
    "en": "Geometric ray optics: interference, diffraction (Airy rings, beam waists), coherence and speckle are not modelled — ray powers add, optical path lengths are given for fringe estimates and Gaussian beam sizes belong to the Gaussian Beam tool. Grating order efficiencies are a learning model, not measured data; absorption inside glass, scatter and coating dispersion are not included unless a coating is given; fibres couple geometrically (core and NA), which suits multimode fibres, not single-mode ones. Stock lens data come from public catalogue pages and may change; check the vendor page before ordering.",
    "uk": "Геометрична оптика: інтерференція, дифракція (кільця Ейрі, перетяжки пучка), когерентність і спекл не моделюються — потужності променів додаються, оптичні довжини шляху подано для оцінки смуг, а розміри гаусових пучків — завдання інструмента «Гаусів пучок». Ефективності порядків ґратки — навчальна модель, а не виміряні дані; поглинання в склі, розсіяння й дисперсія покриттів не враховуються, якщо покриття не задано; волокна вводять світло геометрично (серцевина й NA), що годиться для багатомодових, а не одномодових волокон. Дані каталожних лінз узято з публічних сторінок каталогу, вони можуть змінюватися; перевіряйте сторінку постачальника перед замовленням.",
    "de": "Geometrische Strahlenoptik: Interferenz, Beugung (Airy-Ringe, Strahltaillen), Kohärenz und Speckle werden nicht modelliert — Strahlleistungen addieren sich, optische Weglängen dienen der Streifenabschätzung, Gaußsche Strahlgrößen gehören ins Werkzeug Gaußstrahl. Gitterwirkungsgrade der Ordnungen sind ein Lernmodell, keine Messdaten; Absorption im Glas, Streuung und Schichtdispersion fehlen, sofern keine Beschichtung angegeben ist; Fasern koppeln geometrisch (Kern und NA), passend für Multimode-, nicht für Singlemodefasern. Katalogdaten stammen von öffentlichen Seiten und können sich ändern; vor der Bestellung die Herstellerseite prüfen.",
    "nl": "Geometrische stralenoptica: interferentie, buiging (Airy-ringen, bundeltailles), coherentie en spikkels worden niet gemodelleerd — straalvermogens tellen op, optische weglengtes dienen voor franjeschattingen en Gaussische bundelgroottes horen bij de tool Gaussische bundel. Rendementen van tralieordes zijn een leermodel, geen meetgegevens; absorptie in glas, strooiing en laagdispersie ontbreken tenzij een coating is opgegeven; vezels koppelen geometrisch (kern en NA), geschikt voor multimode- en niet voor singlemodevezels. Catalogusgegevens komen van openbare pagina’s en kunnen wijzigen; controleer de pagina van de leverancier voor u bestelt.",
    "fr": "Optique géométrique : interférence, diffraction (anneaux d’Airy, cols de faisceau), cohérence et speckle ne sont pas modélisés — les puissances des rayons s’ajoutent, les chemins optiques servent à estimer les franges et les tailles de faisceaux gaussiens relèvent de l’outil Faisceau gaussien. Les rendements des ordres du réseau sont un modèle pédagogique, non des mesures ; l’absorption dans le verre, la diffusion et la dispersion des couches ne sont pas incluses sauf traitement donné ; les fibres couplent géométriquement (cœur et ON), ce qui convient aux fibres multimodes, pas monomodes. Les données catalogue viennent de pages publiques et peuvent changer ; vérifiez la page du fournisseur avant de commander.",
    "es": "Óptica geométrica: no se modelan interferencia, difracción (anillos de Airy, cinturas del haz), coherencia ni speckle — las potencias de los rayos se suman, los caminos ópticos sirven para estimar franjas y los tamaños de haces gaussianos corresponden a la herramienta Haz gaussiano. Las eficiencias de los órdenes de la red son un modelo didáctico, no datos medidos; no se incluyen absorción en el vidrio, difusión ni dispersión de capas salvo que se indique un recubrimiento; las fibras acoplan geométricamente (núcleo y NA), adecuado para fibras multimodo, no monomodo. Los datos de catálogo proceden de páginas públicas y pueden cambiar; compruebe la página del proveedor antes de pedir.",
    "pl": "Optyka geometryczna: interferencja, dyfrakcja (pierścienie Airy’ego, przewężenia wiązki), koherencja i plamkowanie nie są modelowane — moce promieni się sumują, drogi optyczne służą do szacowania prążków, a rozmiary wiązek gaussowskich należą do narzędzia Wiązka gaussowska. Sprawności rzędów siatki to model dydaktyczny, nie dane pomiarowe; absorpcja w szkle, rozpraszanie i dyspersja powłok nie są uwzględniane, chyba że podano powłokę; światłowody sprzęgają geometrycznie (rdzeń i NA), co pasuje do włókien wielomodowych, nie jednomodowych. Dane katalogowe pochodzą z publicznych stron i mogą się zmieniać; przed zamówieniem sprawdź stronę dostawcy."
  },

  var LEARN = {
    version: 1,
    intro: { title: T('What this tool does', 'Що робить цей інструмент', 'Was dieses Werkzeug tut', 'Wat deze tool doet', 'Ce que fait cet outil', 'Qué hace esta herramienta', 'Co robi to narzędzie'),
      body: T('It is an optical table in your browser. Put light sources, catalogue lenses, mirrors, splitters, prisms, gratings, polarisers and detectors on a breadboard and every ray is traced in 3D with the real glass dispersion, Fresnel reflection, polarisation and total internal reflection. Start with a preset: each one shows a surprising fact and says how to see it. Drag elements on the table, edit them in the inspector, look at the result in 3D, then take the parts list or hand the beam to the Gaussian-beam and laser-safety tools.', 'Це оптичний стіл у браузері. Поставте на макетну плиту джерела світла, каталожні лінзи, дзеркала, подільники, призми, ґратки, поляризатори й детектори — і кожен промінь трасується в 3D з реальною дисперсією скла, френелівським відбиттям, поляризацією та повним внутрішнім відбиттям. Почніть із прикладу: кожен показує несподіваний факт і пояснює, як його побачити. Перетягуйте елементи по столу, змінюйте їх в інспекторі, дивіться результат у 3D, потім заберіть специфікацію деталей або передайте пучок у інструменти гаусового пучка й лазерної безпеки.', 'Ein optischer Tisch im Browser. Stellen Sie Lichtquellen, Katalog-Linsen, Spiegel, Teiler, Prismen, Gitter, Polarisatoren und Detektoren auf ein Lochraster, und jeder Strahl wird in 3D mit echter Glasdispersion, Fresnel-Reflexion, Polarisation und Totalreflexion verfolgt. Beginnen Sie mit einem Beispiel: jedes zeigt eine überraschende Tatsache und wie man sie sieht. Elemente auf dem Tisch ziehen, im Inspektor bearbeiten, in 3D ansehen, dann die Teileliste mitnehmen oder den Strahl an die Werkzeuge Gaußstrahl und Lasersicherheit übergeben.', 'Een optische tafel in uw browser. Zet lichtbronnen, cataloguslenzen, spiegels, delers, prisma’s, tralies, polarisatoren en detectoren op een breadboard en elke straal wordt in 3D gevolgd met echte glasdispersie, Fresnelreflectie, polarisatie en totale interne reflectie. Begin met een voorbeeld: elk toont een verrassend feit en hoe u het ziet. Sleep elementen over de tafel, bewerk ze in de inspector, bekijk het resultaat in 3D en neem dan de onderdelenlijst mee of geef de bundel door aan de tools Gaussische bundel en laserveiligheid.', 'Une table optique dans votre navigateur. Posez sources, lentilles du catalogue, miroirs, séparateurs, prismes, réseaux, polariseurs et détecteurs sur un breadboard : chaque rayon est tracé en 3D avec la vraie dispersion du verre, la réflexion de Fresnel, la polarisation et la réflexion totale interne. Commencez par un exemple : chacun montre un fait surprenant et comment le voir. Déplacez les éléments sur la table, modifiez-les dans l’inspecteur, regardez en 3D, puis prenez la nomenclature ou passez le faisceau aux outils Faisceau gaussien et Sécurité laser.', 'Una mesa óptica en el navegador. Coloque fuentes, lentes de catálogo, espejos, divisores, prismas, redes, polarizadores y detectores sobre una placa perforada y cada rayo se traza en 3D con la dispersión real del vidrio, la reflexión de Fresnel, la polarización y la reflexión total interna. Empiece con un ejemplo: cada uno muestra un hecho sorprendente y cómo verlo. Arrastre elementos sobre la mesa, edítelos en el inspector, mire el resultado en 3D y luego llévese la lista de piezas o pase el haz a las herramientas de haz gaussiano y seguridad láser.', 'Stół optyczny w przeglądarce. Ustaw na płycie z otworami źródła światła, soczewki z katalogu, zwierciadła, dzielniki, pryzmaty, siatki, polaryzatory i detektory, a każdy promień jest śledzony w 3D z rzeczywistą dyspersją szkła, odbiciem Fresnela, polaryzacją i całkowitym wewnętrznym odbiciem. Zacznij od przykładu: każdy pokazuje zaskakujący fakt i mówi, jak go zobaczyć. Przeciągaj elementy po stole, edytuj je w inspektorze, oglądaj wynik w 3D, a potem weź listę części lub przekaż wiązkę do narzędzi wiązki gaussowskiej i bezpieczeństwa laserowego.') },
    topics: {
      table: { title: T('The table and editing', 'Стіл і редагування', 'Tisch und Bearbeitung', 'Tafel en bewerken', 'La table et l’édition', 'La mesa y la edición', 'Stół i edycja'),
        body: T('Grey dots are M6 holes on a 25 mm grid. Drag an element to move it (snap to half holes, 1 mm or free); arrow keys move the selection, Delete removes it. Rotation, height and every optical parameter are in the inspector. Light travels along each element’s own axis; a mirror at −45° folds a beam going right into a beam going up.', 'Сірі точки — отвори M6 із кроком 25 мм. Перетягніть елемент, щоб пересунути (прив’язка до пів-отвору, 1 мм або вільно); стрілки рухають вибране, Delete видаляє. Поворот, висота й усі оптичні параметри — в інспекторі. Світло йде вздовж власної осі елемента; дзеркало під −45° повертає пучок, що йде праворуч, угору.', 'Graue Punkte sind M6-Bohrungen im 25-mm-Raster. Element ziehen zum Verschieben (Raster halbe Bohrung, 1 mm oder frei); Pfeiltasten bewegen die Auswahl, Entf löscht sie. Drehung, Höhe und alle optischen Größen stehen im Inspektor. Licht läuft entlang der Elementachse; ein Spiegel unter −45° lenkt einen nach rechts laufenden Strahl nach oben.', 'Grijze punten zijn M6-gaten op een raster van 25 mm. Sleep een element om het te verplaatsen (raster halve gaten, 1 mm of vrij); pijltoetsen verplaatsen de selectie, Delete verwijdert ze. Rotatie, hoogte en alle optische grootheden staan in de inspector. Licht loopt langs de eigen as van het element; een spiegel onder −45° buigt een bundel naar rechts om naar boven.', 'Les points gris sont des trous M6 au pas de 25 mm. Faites glisser un élément pour le déplacer (accroche demi-trou, 1 mm ou libre) ; les flèches déplacent la sélection, Suppr la retire. Rotation, hauteur et tous les paramètres optiques sont dans l’inspecteur. La lumière suit l’axe propre de chaque élément ; un miroir à −45° renvoie vers le haut un faisceau qui va vers la droite.', 'Los puntos grises son agujeros M6 en una retícula de 25 mm. Arrastre un elemento para moverlo (ajuste a medio agujero, 1 mm o libre); las flechas mueven la selección y Supr la elimina. Giro, altura y todos los parámetros ópticos están en el inspector. La luz avanza por el eje propio de cada elemento; un espejo a −45° desvía hacia arriba un haz que va hacia la derecha.', 'Szare punkty to otwory M6 w siatce 25 mm. Przeciągnij element, aby go przesunąć (przyciąganie do pół otworu, 1 mm lub swobodnie); strzałki przesuwają zaznaczenie, Delete je usuwa. Obrót, wysokość i wszystkie parametry optyczne są w inspektorze. Światło biegnie wzdłuż własnej osi elementu; zwierciadło pod −45° kieruje wiązkę biegnącą w prawo w górę.') },
      rays: { title: T('What the rays mean', 'Що означають промені', 'Was die Strahlen bedeuten', 'Wat de stralen betekenen', 'Ce que signifient les rayons', 'Qué significan los rayos', 'Co oznaczają promienie'),
        body: T('Each line is a ray with its own wavelength (its colour; infrared and ultraviolet in false colour), power (its opacity) and polarisation. At every glass surface the ray splits by the Fresnel equations into a refracted and a reflected part; weak reflections are dropped unless “follow ghost reflections” is on. Rays add their powers: interference is not computed, the optical path length is reported for fringe estimates.', 'Кожна лінія — промінь із власною довжиною хвилі (колір; ІЧ та УФ — умовними кольорами), потужністю (непрозорість) і поляризацією. На кожній скляній поверхні промінь ділиться за формулами Френеля на заломлену й відбиту частини; слабкі відбиття відкидаються, якщо не ввімкнено «стежити за паразитними відбиттями». Потужності променів додаються: інтерференція не обчислюється, оптична довжина шляху подається для оцінки смуг.', 'Jede Linie ist ein Strahl mit eigener Wellenlänge (Farbe; IR und UV in Falschfarben), Leistung (Deckkraft) und Polarisation. An jeder Glasfläche teilt er sich nach Fresnel in einen gebrochenen und einen reflektierten Anteil; schwache Reflexe werden verworfen, außer „Geisterreflexe verfolgen“ ist an. Leistungen addieren sich: Interferenz wird nicht berechnet, die optische Weglänge wird für Streifenabschätzungen angegeben.', 'Elke lijn is een straal met eigen golflengte (kleur; IR en UV in valse kleuren), vermogen (dekking) en polarisatie. Aan elk glasoppervlak splitst de straal volgens Fresnel in een gebroken en een gereflecteerd deel; zwakke reflecties vallen weg, tenzij “spookreflecties volgen” aan staat. Vermogens tellen op: interferentie wordt niet berekend, de optische weglengte wordt gegeven voor franjeschattingen.', 'Chaque ligne est un rayon avec sa longueur d’onde (sa couleur ; IR et UV en fausses couleurs), sa puissance (son opacité) et sa polarisation. À chaque surface de verre, il se divise selon Fresnel en une partie réfractée et une partie réfléchie ; les réflexions faibles sont abandonnées sauf si « suivre les réflexions parasites » est activé. Les puissances s’ajoutent : l’interférence n’est pas calculée, le chemin optique est donné pour estimer les franges.', 'Cada línea es un rayo con su propia longitud de onda (su color; IR y UV en falso color), potencia (su opacidad) y polarización. En cada superficie de vidrio se divide según Fresnel en una parte refractada y otra reflejada; las reflexiones débiles se descartan salvo que «seguir reflexiones fantasma» esté activo. Las potencias se suman: no se calcula la interferencia; el camino óptico se da para estimar franjas.', 'Każda linia to promień o własnej długości fali (kolor; podczerwień i ultrafiolet w barwach umownych), mocy (krycie) i polaryzacji. Na każdej powierzchni szkła dzieli się wg Fresnela na część załamaną i odbitą; słabe odbicia są pomijane, chyba że włączono „śledź odbicia pasożytnicze”. Moce się sumują: interferencja nie jest liczona, droga optyczna jest podawana do szacowania prążków.') },
      detectors: { title: T('Screens, power meters, fibres', 'Екрани, вимірювачі потужності, волокна', 'Schirme, Leistungsmesser, Fasern', 'Schermen, vermogensmeters, vezels', 'Écrans, puissancemètres, fibres', 'Pantallas, medidores, fibras', 'Ekrany, mierniki mocy, światłowody'),
        body: T('A detector records every ray that hits it: total power, power-weighted RMS spot radius and centroid, mean wavelength and the paths the light took (with their optical path lengths — the Michelson preset uses this). A fibre counts only rays inside its core and inside its numerical aperture (geometric coupling, good for multimode fibres).', 'Детектор фіксує кожен промінь, що на нього падає: сумарну потужність, зважений за потужністю середньоквадратичний радіус плями й центроїд, середню довжину хвилі та шляхи світла (з оптичними довжинами — ними користується приклад Майкельсона). Волокно зараховує лише промені всередині серцевини й числової апертури (геометричне введення, придатне для багатомодових волокон).', 'Ein Detektor erfasst jeden auftreffenden Strahl: Gesamtleistung, leistungsgewichteter RMS-Fleckradius und Schwerpunkt, mittlere Wellenlänge und die Lichtwege (mit optischen Weglängen — das Michelson-Beispiel nutzt sie). Eine Faser zählt nur Strahlen innerhalb ihres Kerns und ihrer numerischen Apertur (geometrische Kopplung, gut für Multimodefasern).', 'Een detector registreert elke straal die hem raakt: totaal vermogen, vermogensgewogen RMS-vlekstraal en zwaartepunt, gemiddelde golflengte en de paden van het licht (met optische weglengtes — het Michelson-voorbeeld gebruikt die). Een vezel telt alleen stralen binnen haar kern en numerieke apertuur (geometrische koppeling, geschikt voor multimodevezels).', 'Un détecteur enregistre chaque rayon qui l’atteint : puissance totale, rayon RMS de la tache pondéré par la puissance et barycentre, longueur d’onde moyenne et chemins suivis (avec leurs chemins optiques — l’exemple de Michelson s’en sert). Une fibre ne compte que les rayons dans son cœur et dans son ouverture numérique (couplage géométrique, valable pour les fibres multimodes).', 'Un detector registra cada rayo que le llega: potencia total, radio RMS de la mancha ponderado por potencia y centroide, longitud de onda media y los caminos de la luz (con sus caminos ópticos — el ejemplo de Michelson los usa). Una fibra cuenta solo los rayos dentro de su núcleo y de su apertura numérica (acoplo geométrico, válido para fibras multimodo).', 'Detektor rejestruje każdy padający promień: moc całkowitą, ważony mocą promień RMS plamki i środek ciężkości, średnią długość fali i drogi światła (z drogami optycznymi — korzysta z nich przykład Michelsona). Światłowód liczy tylko promienie wewnątrz rdzenia i apertury numerycznej (sprzężenie geometryczne, dobre dla włókien wielomodowych).') },
      polarisation: { title: T('Polarisation', 'Поляризація', 'Polarisation', 'Polarisatie', 'Polarisation', 'Polarización', 'Polaryzacja'),
        body: T('Every ray carries a polarisation state, so polarisers follow Malus’s law, a polarising cube passes p (horizontal) and reflects s (vertical), wave plates turn linear light circular, and a Faraday rotator breaks the symmetry between forward and backward travel — the basis of optical isolators. Reflection at Brewster’s angle tan θ = n removes p completely.', 'Кожен промінь несе стан поляризації, тож поляризатори підкоряються закону Малюса, поляризаційний куб пропускає p (горизонтальну) і відбиває s (вертикальну), хвильові пластинки роблять лінійне світло коловим, а обертач Фарадея порушує симетрію руху вперед і назад — основа оптичних ізоляторів. Відбиття під кутом Брюстера tg θ = n повністю прибирає p.', 'Jeder Strahl trägt einen Polarisationszustand: Polarisatoren folgen dem Gesetz von Malus, ein Polarisationswürfel lässt p (horizontal) durch und reflektiert s (vertikal), Verzögerungsplatten machen lineares Licht zirkular, ein Faraday-Rotator bricht die Symmetrie zwischen Hin- und Rückweg — die Grundlage optischer Isolatoren. Reflexion unter dem Brewster-Winkel tan θ = n entfernt p vollständig.', 'Elke straal draagt een polarisatietoestand: polarisatoren volgen de wet van Malus, een polariserende kubus laat p (horizontaal) door en reflecteert s (verticaal), golfplaten maken lineair licht circulair en een Faraday-rotator breekt de symmetrie tussen heen en terug — de basis van optische isolatoren. Reflectie onder de brewsterhoek tan θ = n verwijdert p volledig.', 'Chaque rayon porte un état de polarisation : les polariseurs suivent la loi de Malus, un cube polariseur transmet p (horizontale) et réfléchit s (verticale), les lames d’onde rendent la lumière linéaire circulaire et un rotateur de Faraday brise la symétrie entre aller et retour — le principe des isolateurs optiques. À l’angle de Brewster tan θ = n, la réflexion supprime p entièrement.', 'Cada rayo lleva un estado de polarización: los polarizadores siguen la ley de Malus, un cubo polarizador deja pasar p (horizontal) y refleja s (vertical), las láminas de onda vuelven circular la luz lineal y un rotador de Faraday rompe la simetría entre ida y vuelta — la base de los aisladores ópticos. La reflexión al ángulo de Brewster tan θ = n elimina p por completo.', 'Każdy promień niesie stan polaryzacji: polaryzatory spełniają prawo Malusa, kostka polaryzacyjna przepuszcza p (poziomą) i odbija s (pionową), płytki falowe zamieniają światło liniowe w kołowe, a rotator Faradaya łamie symetrię biegu w przód i w tył — podstawa izolatorów optycznych. Odbicie pod kątem Brewstera tg θ = n całkowicie usuwa p.') },
      parts: { title: T('Catalogue parts and the parts list', 'Каталожні деталі та специфікація', 'Katalogteile und Teileliste', 'Catalogusonderdelen en onderdelenlijst', 'Pièces du catalogue et nomenclature', 'Piezas de catálogo y lista de piezas', 'Części katalogowe i lista części'),
        body: T('Lenses can be real Thorlabs parts (radii, thickness, glass and diameter from the public catalogue pages, read on the date shown in the parts list). The parts list counts optics with their part numbers and links, and adds generic mounts and posts without prices. Choose “custom” to type your own radii and glass.', 'Лінзи можуть бути реальними деталями Thorlabs (радіуси, товщина, скло й діаметр із публічних сторінок каталогу, прочитаних у дату, зазначену в специфікації). Специфікація рахує оптику з номерами деталей і посиланнями та додає типові оправи й стійки без цін. Оберіть «власна», щоб задати свої радіуси й скло.', 'Linsen können echte Thorlabs-Teile sein (Radien, Dicke, Glas und Durchmesser von den öffentlichen Katalogseiten, gelesen am in der Teileliste angegebenen Datum). Die Teileliste zählt Optiken mit Teilenummer und Link und ergänzt generische Halter und Stangen ohne Preise. „eigene“ wählen, um eigene Radien und Glas einzugeben.', 'Lenzen kunnen echte Thorlabs-onderdelen zijn (stralen, dikte, glas en diameter van de openbare catalogusbladen, gelezen op de datum in de onderdelenlijst). De lijst telt optiek met artikelnummer en link en voegt generieke houders en staven zonder prijzen toe. Kies “eigen” om zelf stralen en glas in te voeren.', 'Les lentilles peuvent être de vraies pièces Thorlabs (rayons, épaisseur, verre et diamètre des pages publiques du catalogue, lues à la date indiquée dans la nomenclature). La nomenclature compte les optiques avec référence et lien et ajoute des montures et tiges génériques sans prix. Choisissez « personnalisée » pour saisir vos rayons et votre verre.', 'Las lentes pueden ser piezas reales de Thorlabs (radios, espesor, vidrio y diámetro de las páginas públicas del catálogo, leídas en la fecha que muestra la lista). La lista cuenta la óptica con su referencia y enlace y añade monturas y postes genéricos sin precios. Elija «personalizada» para escribir sus radios y vidrio.', 'Soczewki mogą być prawdziwymi częściami Thorlabs (promienie, grubość, szkło i średnica z publicznych stron katalogu, odczytane w dniu podanym w liście części). Lista części liczy optykę z numerami i linkami oraz dodaje ogólne oprawy i słupki bez cen. Wybierz „własna”, aby wpisać własne promienie i szkło.') },
      handoff: { title: T('Hand-over to other optics tools', 'Передача в інші оптичні інструменти', 'Übergabe an andere Optik-Werkzeuge', 'Doorgeven aan andere optica-tools', 'Transmission aux autres outils d’optique', 'Paso a otras herramientas de óptica', 'Przekazanie do innych narzędzi optycznych'),
        body: T('“Save to project” stores the table, the first light source (power, wavelength, beam radius, divergence) and the lenses and mirrors met by the central ray with their distances along the beam. Gaussian Beam takes that list to compute the real beam size and waists; Laser Safety takes the source to compute MPE, the hazard distance and goggles. Everything stays in your browser.', '«Зберегти в проєкт» записує стіл, перше джерело світла (потужність, довжину хвилі, радіус пучка, розбіжність) і лінзи та дзеркала на шляху центрального променя з відстанями вздовж пучка. «Гаусів пучок» бере цей перелік, щоб обчислити реальний розмір пучка й перетяжки; «Лазерна безпека» бере джерело, щоб обчислити MPE, небезпечну відстань і окуляри. Усе лишається у вашому браузері.', '„Im Projekt speichern“ legt den Tisch, die erste Lichtquelle (Leistung, Wellenlänge, Strahlradius, Divergenz) und die vom Zentralstrahl getroffenen Linsen und Spiegel mit ihren Abständen entlang des Strahls ab. Gaußstrahl nutzt diese Liste für reale Strahlgröße und Taillen; Lasersicherheit nutzt die Quelle für MZB, Gefahrenabstand und Schutzbrille. Alles bleibt in Ihrem Browser.', '“Opslaan in project” bewaart de tafel, de eerste lichtbron (vermogen, golflengte, bundelstraal, divergentie) en de lenzen en spiegels die de centrale straal tegenkomt, met hun afstanden langs de bundel. Gaussische bundel gebruikt die lijst voor de echte bundelgrootte en tailles; Laserveiligheid gebruikt de bron voor MPE, gevarenafstand en bril. Alles blijft in uw browser.', '« Enregistrer dans le projet » conserve la table, la première source (puissance, longueur d’onde, rayon du faisceau, divergence) et les lentilles et miroirs rencontrés par le rayon central avec leurs distances le long du faisceau. Faisceau gaussien utilise cette liste pour la vraie taille du faisceau et les cols ; Sécurité laser utilise la source pour l’EMP, la distance de danger et les lunettes. Tout reste dans votre navigateur.', '«Guardar en el proyecto» almacena la mesa, la primera fuente (potencia, longitud de onda, radio del haz, divergencia) y las lentes y espejos que encuentra el rayo central con sus distancias a lo largo del haz. Haz gaussiano usa esa lista para el tamaño real del haz y las cinturas; Seguridad láser usa la fuente para la EMP, la distancia de riesgo y las gafas. Todo queda en su navegador.', '„Zapisz w projekcie” zapisuje stół, pierwsze źródło (moc, długość fali, promień wiązki, rozbieżność) oraz soczewki i zwierciadła napotkane przez promień centralny z odległościami wzdłuż wiązki. Wiązka gaussowska bierze tę listę, aby obliczyć rzeczywisty rozmiar wiązki i przewężenia; Bezpieczeństwo laserowe bierze źródło, aby obliczyć MPE, odległość zagrożenia i gogle. Wszystko zostaje w przeglądarce.') },
      view3d: { title: T('3D view', 'Вигляд 3D', '3D-Ansicht', '3D-weergave', 'Vue 3D', 'Vista 3D', 'Widok 3D'),
        body: T('The 3D view shows the same scene on a breadboard 75 mm below the beam. Drag to orbit, Shift-drag or right-drag to pan, wheel or +/− to zoom, arrow keys to orbit from the keyboard. Glass is translucent, mirrors silver, detectors dark; rays keep their colours and opacities.', 'Вигляд 3D показує ту саму сцену на макетній плиті на 75 мм нижче пучка. Тягніть, щоб обертати, Shift або права кнопка — зсув, коліщатко чи +/− — масштаб, стрілки — обертання з клавіатури. Скло напівпрозоре, дзеркала сріблясті, детектори темні; промені зберігають кольори й прозорість.', 'Die 3D-Ansicht zeigt dieselbe Szene auf einem Lochraster 75 mm unter dem Strahl. Ziehen zum Drehen, Umschalt- oder Rechtsziehen zum Verschieben, Mausrad oder +/− zum Zoomen, Pfeiltasten zum Drehen per Tastatur. Glas ist durchscheinend, Spiegel silbern, Detektoren dunkel; Strahlen behalten Farbe und Deckkraft.', 'De 3D-weergave toont dezelfde scène op een breadboard 75 mm onder de bundel. Slepen om te draaien, Shift- of rechtsslepen om te verschuiven, wiel of +/− om te zoomen, pijltoetsen om met het toetsenbord te draaien. Glas is doorschijnend, spiegels zilver, detectoren donker; stralen houden kleur en dekking.', 'La vue 3D montre la même scène sur un breadboard 75 mm sous le faisceau. Glissez pour tourner, Maj+glisser ou clic droit pour déplacer, molette ou +/− pour zoomer, flèches pour tourner au clavier. Le verre est translucide, les miroirs argentés, les détecteurs sombres ; les rayons gardent couleurs et opacités.', 'La vista 3D muestra la misma escena sobre una placa perforada 75 mm bajo el haz. Arrastre para girar, Mayús o botón derecho para desplazar, rueda o +/− para ampliar, flechas para girar con el teclado. El vidrio es translúcido, los espejos plateados, los detectores oscuros; los rayos conservan colores y opacidades.', 'Widok 3D pokazuje tę samą scenę na płycie z otworami 75 mm pod wiązką. Przeciągnij, aby obracać, Shift lub prawy przycisk — przesuwanie, kółko lub +/− — powiększenie, strzałki — obrót z klawiatury. Szkło jest półprzezroczyste, zwierciadła srebrne, detektory ciemne; promienie zachowują barwy i krycie.') }

    incoh: T('Ray powers add incoherently: interference fringes, diffraction rings and speckle are not modelled; the optical path length is shown for fringe estimates. Gratings split power by a learning model, not by measured efficiencies.', 'Потужності променів додаються некогерентно: інтерференційні смуги, дифракційні кільця й спекл не моделюються; оптична довжина шляху показана для оцінки смуг. Ґратки ділять потужність за навчальною моделлю, а не за виміряною ефективністю.', 'Strahlleistungen addieren sich inkohärent: Interferenzstreifen, Beugungsringe und Speckle werden nicht modelliert; die optische Weglänge wird für Streifenabschätzungen gezeigt. Gitter teilen die Leistung nach einem Lernmodell, nicht nach gemessenen Wirkungsgraden.', 'Straalvermogens tellen incoherent op: interferentiefranjes, buigingsringen en spikkels worden niet gemodelleerd; de optische weglengte wordt getoond voor franjeschattingen. Tralies verdelen het vermogen volgens een leermodel, niet volgens gemeten rendementen.', 'Les puissances des rayons s’ajoutent de façon incohérente : franges d’interférence, anneaux de diffraction et speckle ne sont pas modélisés ; le chemin optique est montré pour estimer les franges. Les réseaux répartissent la puissance selon un modèle pédagogique, pas selon des rendements mesurés.', 'Las potencias de los rayos se suman de forma incoherente: no se modelan franjas de interferencia, anillos de difracción ni speckle; el camino óptico se muestra para estimar franjas. Las redes reparten la potencia con un modelo didáctico, no con eficiencias medidas.', 'Moce promieni sumują się niekoherentnie: prążki interferencyjne, pierścienie dyfrakcyjne i plamkowanie nie są modelowane; droga optyczna jest podana do szacowania prążków. Siatki dzielą moc według modelu dydaktycznego, nie zmierzonych sprawności.')
