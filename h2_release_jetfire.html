  function computeView(s) {
    last = solve(s);
    if (stage) stage.schedule();
    if (!last || !last.ok) { var e = String((last && last.err) || 'Error'); var ew = trW(e); return { verdict: { tone: 'bad', text: ew.en === e ? trErr(e) : ew }, tiles: [], notes: [] }; }
    var r = last.r || {}, i;
    function fin(v) { return typeof v === 'number' && isFinite(v); }
    function cell(v) { return fin(v) ? { value: sigv(v, 4), precision: sig(v, 4) } : { value: null, precision: 0 }; }
    function tile(label, v, hint, learn, tone, headline) {
      var c = cell(v);
      return { label: label, value: c.value, hint: hint, precision: c.precision, tone: tone || null, learn: learn, headline: !!headline };
    }
    var q = r.qRecv, verdict;
    if (!fin(q)) {
      verdict = { tone: 'warn', text: T('Receiver flux unavailable', 'Потік на приймачі недоступний', 'Empfängerstrom nicht verfügbar', 'Ontvangerflux niet beschikbaar', 'Flux au récepteur indisponible', 'Flujo en el receptor no disponible', 'Strumień u odbiornika niedostępny') };
    } else if (q < 1.58) {
      verdict = { tone: 'ok', text: T('Receiver below 1.58 kW/m2 (public exposure limit)', 'Приймач нижче 1,58 кВт/м2 (межа для населення)', 'Empfänger unter 1,58 kW/m2 (Grenzwert Öffentlichkeit)', 'Ontvanger onder 1,58 kW/m2 (publieke blootstellingslimiet)', 'Récepteur sous 1,58 kW/m2 (limite d\'exposition du public)', 'Receptor por debajo de 1,58 kW/m2 (límite de exposición pública)', 'Odbiornik poniżej 1,58 kW/m2 (limit ekspozycji publicznej)') };
    } else if (q < 4.73) {
      verdict = { tone: 'warn', text: T('Above public limit, below 4.73 kW/m2 employee limit', 'Вище межі для населення, нижче 4,73 кВт/м2 (межа для працівників)', 'Über Grenzwert Öffentlichkeit, unter 4,73 kW/m2 (Grenzwert Beschäftigte)', 'Boven publieke limiet, onder 4,73 kW/m2 werknemerslimiet', 'Au-dessus de la limite publique, sous 4,73 kW/m2 (limite employés)', 'Por encima del límite público, por debajo de 4,73 kW/m2 (límite de empleados)', 'Powyżej limitu publicznego, poniżej 4,73 kW/m2 (limit dla pracowników)') };
    } else if (q < 9.5) {
      verdict = { tone: 'warn', text: T('Above employee limit (4.73 kW/m2)', 'Вище межі для працівників (4,73 кВт/м2)', 'Über Grenzwert Beschäftigte (4,73 kW/m2)', 'Boven werknemerslimiet (4,73 kW/m2)', 'Au-dessus de la limite employés (4,73 kW/m2)', 'Por encima del límite de empleados (4,73 kW/m2)', 'Powyżej limitu dla pracowników (4,73 kW/m2)') };
    } else {
      verdict = { tone: 'bad', text: T('Above 9.5 kW/m2: pain within seconds', 'Понад 9,5 кВт/м2: біль за лічені секунди', 'Über 9,5 kW/m2: Schmerz innerhalb von Sekunden', 'Boven 9,5 kW/m2: pijn binnen enkele seconden', 'Au-delà de 9,5 kW/m2 : douleur en quelques secondes', 'Más de 9,5 kW/m2: dolor en pocos segundos', 'Powyżej 9,5 kW/m2: ból w ciągu kilku sekund') };
    }
    var tiles = [
      tile(T('Heat flux at receiver', 'Тепловий потік на приймачі', 'Wärmestrom am Empfänger', 'Warmtestroom bij ontvanger', 'Flux thermique au récepteur', 'Flujo de calor en el receptor', 'Strumień ciepła u odbiornika'), q, 'kW/m2', 'flux', verdict.tone, true),
      tile(T('Flame length', 'Довжина полум\'я', 'Flammenlänge', 'Vlamlengte', 'Longueur de flamme', 'Longitud de llama', 'Długość płomienia'), r.Lf, 'm', 'flame', null, true),
      tile(T('Mass flow', 'Масова витрата', 'Massenstrom', 'Massadebiet', 'Débit massique', 'Caudal másico', 'Strumień masy'), r.mdot, 'kg/s', 'release'),
      tile(T('Radiant fraction', 'Радіаційна частка', 'Strahlungsanteil', 'Stralingsfractie', 'Fraction radiative', 'Fracción radiante', 'Udział promieniowania'), r.Xrad, '-', 'radiation')
    ];
    if (s && s.level === 'full') {
      tiles.push(tile(T('Flame width', 'Ширина полум\'я', 'Flammenbreite', 'Vlambreedte', 'Largeur de flamme', 'Anchura de llama', 'Szerokość płomienia'), r.Wf, 'm', 'flame'));
      tiles.push(tile(T('Radiant power', 'Потужність випромінювання', 'Strahlungsleistung', 'Stralingsvermogen', 'Puissance rayonnée', 'Potencia radiante', 'Moc promieniowania'), fin(r.Srad) ? r.Srad / 1e6 : null, 'MW', 'radiation'));
      tiles.push(tile(T('Notional nozzle diameter', 'Умовний діаметр сопла', 'Fiktiver Düsendurchmesser', 'Fictieve nozzlediameter', 'Diamètre de buse fictif', 'Diámetro de boquilla ficticio', 'Zastępcza średnica dyszy'), fin(r.deff) ? r.deff * 1000 : null, 'mm', 'notional'));
      tiles.push(tile(T('Notional velocity', 'Умовна швидкість', 'Fiktive Geschwindigkeit', 'Fictieve snelheid', 'Vitesse fictive', 'Velocidad ficticia', 'Prędkość zastępcza'), r.ueff, 'm/s', 'notional'));
    }
    var meters = [];
    if (fin(q)) {
      meters.push({ label: T('Receiver flux vs 4.73 kW/m2', 'Потік на приймачі відносно 4,73 кВт/м2', 'Empfängerstrom vs. 4,73 kW/m2', 'Ontvangerflux t.o.v. 4,73 kW/m2', 'Flux au récepteur vs 4,73 kW/m2', 'Flujo en receptor frente a 4,73 kW/m2', 'Strumień u odbiornika wobec 4,73 kW/m2'),
        ratio: Math.max(0, Math.min(1.2, q / 4.73)), text: DiagramUI.fmt(q, { precision: sig(q, 3) }) + ' / ' + DiagramUI.fmt(4.73, { precision: 2 }) + ' kW/m2' });
    }
    var zones = r.zones || [], rows = [];
    for (i = 0; i < zones.length; i++) {
      var z = zones[i];
      rows.push({ cells: [LP(trZone(z)), cell(z.q), cell(z.rFromSource), cell(z.xDownstream), cell(z.yLateral)] });
    }
    var tables = [{ title: T('Hazard distances', 'Небезпечні відстані', 'Gefährdungsabstände', 'Gevarenafstanden', 'Distances de danger', 'Distancias de peligro', 'Odległości zagrożenia'),
      head: ['', { label: 'kW/m2', num: true }, { label: 'r, m', num: true }, { label: 'x, m', num: true }, { label: 'y, m', num: true }], rows: rows }];
    var notes = [], ws = r.warnings || [];
    for (i = 0; i < ws.length; i++) { notes.push(trW(ws[i])); }
    notes.push(r.choked
      ? T('Choked (sonic) release', 'Критичний (звуковий) витік', 'Kritische (Schall-)Freisetzung', 'Gesmoorde (sonische) uitstroming', 'Rejet critique (sonique)', 'Liberación crítica (sónica)', 'Wypływ krytyczny (dźwiękowy)')
      : T('Subsonic release', 'Дозвуковий витік', 'Unterschall-Freisetzung', 'Subsonische uitstroming', 'Rejet subsonique', 'Liberación subsónica', 'Wypływ poddźwiękowy'));
    notes.push(T('Heat release on LHV basis (119.96 MJ/kg)', 'Тепловиділення за нижчою теплотою згоряння (119,96 МДж/кг)', 'Wärmefreisetzung bezogen auf Heizwert (119,96 MJ/kg)', 'Warmteafgifte op basis van onderste verbrandingswaarde (119,96 MJ/kg)', 'Dégagement de chaleur sur base PCI (119,96 MJ/kg)', 'Liberación de calor sobre PCI (119,96 MJ/kg)', 'Wydzielanie ciepła wg wartości opałowej (119,96 MJ/kg)'));
    if (r.norm) notes.push(trSrc(r.norm));
    return { verdict: verdict, tiles: tiles, meters: meters, tables: tables, notes: notes };
  }

  function degrade() {
    document.title = 'diagram-ui.js v1 is required';
    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1');

    host.appendChild(h);
    host.appendChild(p);
    last = solve(state);
  }

      minHeight: 280,
      a11y: function () {
        if (!last || !last.ok) return LP(T('No result', 'Немає результату', 'Kein Ergebnis', 'Geen resultaat', 'Pas de résultat', 'Sin resultado', 'Brak wyniku'));
        var r = last.r, zs = r.zones || [], i, x473 = null;
        for (i = 0; i < zs.length; i++) if (Math.abs(zs[i].q - 4.73) < 0.01) { x473 = zs[i].xDownstream; break; }
        var a = [DiagramUI.fmt(r.Lf, { precision: 3 }), DiagramUI.fmt(r.qRecv, { precision: 3 }), x473 == null ? '-' : DiagramUI.fmt(x473, { precision: 3 })];

      },
      render: function (size, st) {
        var c = st.canvas(), cs = getComputedStyle(document.documentElement);
        var muted = cs.getPropertyValue('--muted').trim() || '#888', line = cs.getPropertyValue('--line').trim() || '#ccc', font = cs.getPropertyValue('--font').trim() || 'sans-serif';
        c.clearRect(0, 0, size.w, size.h);
        if (!last || !last.ok) return;
        var r = last.r, zs = [], src = r.zones || [], xr = +state.xRecv_m || 0, yr = +state.yRecv_m || 0, i, z, t, tk;

        for (i = 0; i < src.length; i++) { z = src[i]; zs.push({ z: z, i: i }); x0 = Math.min(x0, z.xUpstream); x1 = Math.max(x1, z.xDownstream); ym = Math.max(ym, z.yLateral); }
        x0 -= 1; x1 += 1; ym += 1;
        var L = 46, R = 10, TP = 10, B = 34, pw = size.w - L - R, ph = size.h - TP - B;
        if (pw < 20 || ph < 20) return;
        var k = Math.min(pw / (x1 - x0), ph / (2 * ym)), ww = k * (x1 - x0), wh = k * 2 * ym;
        var ox = L + (pw - ww) / 2, oy = TP + (ph - wh) / 2;
        function X(v) { return ox + (v - x0) * k; }
        function Y(v) { return oy + (ym - v) * k; }
        c.font = '11px ' + font; c.lineWidth = 1; c.strokeStyle = line; c.fillStyle = muted;
        c.strokeRect(ox, oy, ww, wh);
        tk = DiagramUI.ticks(x0, x1, ww, size.density) || []; c.textAlign = 'center'; c.textBaseline = 'top';
        for (i = 0; i < tk.length; i++) { t = tk[i]; if (t < x0 || t > x1) continue; c.beginPath(); c.moveTo(X(t), oy + wh); c.lineTo(X(t), oy + wh + 4); c.stroke(); c.fillText(DiagramUI.fmt(t, { precision: 3 }), X(t), oy + wh + 6); }
        tk = DiagramUI.ticks(-ym, ym, wh, size.density) || []; c.textAlign = 'right'; c.textBaseline = 'middle';
        for (i = 0; i < tk.length; i++) { t = tk[i]; if (t < -ym || t > ym) continue; c.beginPath(); c.moveTo(ox - 4, Y(t)); c.lineTo(ox, Y(t)); c.stroke(); c.fillText(DiagramUI.fmt(t, { precision: 3 }), ox - 6, Y(t)); }

        c.save(); c.beginPath(); c.rect(ox, oy, ww, wh); c.clip();
        zs.sort(function (a, b) { return (b.z.xDownstream - b.z.xUpstream) * b.z.yLateral - (a.z.xDownstream - a.z.xUpstream) * a.z.yLateral; });
        c.lineWidth = 1.5; c.textAlign = 'left'; c.textBaseline = 'bottom';
        for (i = 0; i < zs.length; i++) {

        c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText('R', X(xr) + 7, Y(yr));

  /* ======================================================= 3. the data layer */
  function buildRecord() {
    if (!last) return null;
    var keys = ['p_bar', 'T0_C', 'pamb_bar', 'Tamb_C', 'dHole_mm', 'Cd', 'xRecv_m', 'yRecv_m'];
    var outKeys = ['mdot', 'choked', 'Lf', 'Wf', 'Xrad', 'Srad', 'Qtotal_LHV', 'qRecv', 'deff', 'ueff'];
    var inputs = {}, outputs = {}, notes = [], warnings, i, z, zones;
    var r = last.ok ? last.r : null;
    for (i = 0; i < keys.length; i++) inputs[keys[i]] = state[keys[i]];
    if (r) {
      for (i = 0; i < outKeys.length; i++) outputs[outKeys[i]] = r[outKeys[i]];
      zones = r.zones || [];
      for (i = 0; i < zones.length; i++) {
        z = zones[i];
        outputs['r_' + String(z.q).replace(/\./g, '_')] = z.rFromSource;
      }
      outputs.basis = 'LHV 119.96 MJ/kg';
      if (r.norm) notes.push(String(r.norm));
      warnings = r.warnings ? r.warnings.slice() : [];
    } else {
      warnings = [String(last.err)];
    }
    return {
      inputs: inputs,
      outputs: outputs,
      units: { p_bar: 'bar', T0_C: 'degC', pamb_bar: 'bar', Tamb_C: 'degC', dHole_mm: 'mm', Cd: '-', xRecv_m: 'm', yRecv_m: 'm' },
      model: {
        equations: [
          'Abel-Noble EOS p = rho R T / (1 - b rho), b = 7.691e-3 m3/kg; choked isentropic orifice flow',
          'Notional nozzle (Yuceil-Otugen / HyRAM)',
          'Flame length L* from Schefer et al. 2006 (Froude correlation)',
          'Radiant fraction Xrad = 9.45e-9 (tau_f a_p T_ad^4)^0.47 (Molina 2007)',
          'Weighted multi-point-source flux q = Srad tau / (4 pi r^2) (HyRAM)'
        ],
        ranges: ['p 1.1..1000 bar abs', 'T0 -60..150 degC', 'dHole 0.1..500 mm', 'Cd (0,1]'],
        notes: notes
      },
      warnings: warnings
    };
  }
  var HANDOFF = {
    provides: ['mdot', 'p', 'T'],
    accepts: ['p', 'T'],
    build: function () {
      if (!last || !last.ok) return null;
      var r = last.r;
      return {
        quantities: { mdot: { value: r.mdot, unit: 'kg/s' }, p: { value: state.p_bar * 1e5, unit: 'Pa' }, T: { value: state.T0_C + 273.15, unit: 'K' } },
        sets: { jetfire: [{ Lf: { value: r.Lf, unit: 'm' }, Srad: { value: r.Srad, unit: 'W' } }] }
      };
    },
    apply: function (payload) {
      var q = payload && payload.quantities, applied = false, p, T;
      if (!q) return false;
      function num(e) { var v = (e && typeof e === 'object') ? e.value : e; v = Number(v); return (e != null && isFinite(v)) ? v : NaN; }
      p = num(q.p);
      if (isFinite(p) && p > 1e5) { state.p_bar = p / 1e5; applied = true; }
      T = num(q.T);
      if (isFinite(T) && T >= 213 && T <= 423) { state.T0_C = T - 273.15; applied = true; }
      return applied;
    }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'h2_release_jetfire',
        file: 'h2_release_jetfire.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
