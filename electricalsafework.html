  "title": {"en":"Electrical Safe-Work Boundary Lab","uk":"Лабораторія безпечної підготовки електричних робіт","de":"Labor für die sichere Vorbereitung elektrischer Arbeiten","nl":"Lab voor veilige voorbereiding van elektrisch werk","fr":"Laboratoire de préparation sûre des travaux électriques","es":"Laboratorio de preparación segura de trabajos eléctricos","pl":"Laboratorium bezpiecznego przygotowania prac elektrycznych"},
  "summary": {"en":"Plans the preparation of electrical work: isolation, securing against reconnection and prove–test–prove verification, checked rule by rule against a selectable rule pack with AC/DC voltage bands.","uk":"Планує підготовку електричних робіт: відключення, захист від повторного ввімкнення та перевірку за схемою «прилад–тест–прилад», з перевіркою кожного правила за вибраним пакетом і діапазонами напруги для змінного та постійного струму.","de":"Plant die Vorbereitung elektrischer Arbeiten: Freischalten, Sichern gegen Wiedereinschalten und Prüfen nach dem Schema Prüfgerät–Messung–Prüfgerät, Regel für Regel gegen ein wählbares Regelpaket mit Spannungsbereichen für AC und DC.","nl":"Plant de voorbereiding van elektrisch werk: vrijschakelen, beveiligen tegen herinschakelen en controleren volgens instrument–meting–instrument, regel voor regel getoetst aan een kiesbaar regelpakket met spanningsbanden voor AC en DC.","fr":"Planifie la préparation des travaux électriques : séparation, condamnation contre la réalimentation et vérification appareil–mesure–appareil, contrôlées règle par règle selon un jeu de règles choisi, avec domaines de tension CA/CC.","es":"Planifica la preparación de trabajos eléctricos: aislamiento, bloqueo contra la reconexión y verificación instrumento–prueba–instrumento, comprobados regla a regla con un paquete de reglas elegido y bandas de tensión CA/CC.","pl":"Planuje przygotowanie prac elektrycznych: odłączenie, zabezpieczenie przed ponownym załączeniem i sprawdzenie według schematu przyrząd–pomiar–przyrząd, reguła po regule względem wybranego pakietu reguł z zakresami napięć AC/DC."},
  "description": {"en":"Enter the system (AC or DC, nominal voltage, earthing arrangement), the task, the environment and the isolation and test-instrument data, then build or edit the step sequence. Each rule carries an ID, a basis kind, a source, a jurisdiction and a version. The result lists missing steps, order conflicts, environment warnings and shock and arc-flash topics separately, and exports an electrical.sequence exchange file for the permit tool. Energized work is recorded as an exceptional path and never receives a positive outcome.","uk":"Введіть систему (змінний або постійний струм, номінальну напругу, тип заземлення), завдання, умови середовища, дані про відключення та вимірювальний прилад, потім сформуйте або відредагуйте послідовність кроків. Кожне правило має ідентифікатор, вид підстави, джерело, юрисдикцію та версію. Результат окремо показує пропущені кроки, порушення порядку, попередження щодо середовища, теми ураження струмом і електричної дуги та експортує файл обміну electrical.sequence для інструмента нарядів-допусків. Роботи під напругою фіксуються як виняткова процедура й ніколи не отримують позитивного результату.","de":"Geben Sie das System (AC oder DC, Nennspannung, Netzform), die Aufgabe, die Umgebung sowie die Daten zu Trennstelle und Prüfgerät ein und erstellen oder bearbeiten Sie dann die Schrittfolge. Jede Regel trägt eine ID, eine Art der Grundlage, eine Quelle, einen Geltungsbereich und eine Version. Das Ergebnis führt fehlende Schritte, Reihenfolgekonflikte, Umgebungswarnungen sowie Themen zu Körperdurchströmung und Störlichtbogen getrennt auf und exportiert eine Austauschdatei electrical.sequence für das Freigabewerkzeug. Arbeiten unter Spannung werden als Ausnahmeweg erfasst und erhalten nie ein positives Ergebnis.","nl":"Voer het systeem in (AC of DC, nominale spanning, stelsel), de taak, de omgeving en de gegevens over scheidingspunt en meetinstrument, en stel daarna de stappenreeks op of bewerk die. Elke regel heeft een ID, een soort grondslag, een bron, een rechtsgebied en een versie. Het resultaat toont ontbrekende stappen, volgordeconflicten, omgevingswaarschuwingen en onderwerpen over elektrocutie en vlamboog afzonderlijk, en exporteert een uitwisselingsbestand electrical.sequence voor de vergunningstool. Werken onder spanning wordt vastgelegd als uitzonderingsroute en krijgt nooit een positieve uitkomst.","fr":"Saisissez le système (CA ou CC, tension nominale, schéma des liaisons à la terre), la tâche, l’environnement ainsi que les données de séparation et d’appareil de mesure, puis construisez ou modifiez la séquence d’étapes. Chaque règle porte un identifiant, une nature de fondement, une source, un domaine d’application et une version. Le résultat distingue les étapes manquantes, les conflits d’ordre, les alertes d’environnement et les thèmes électrisation et arc électrique, et exporte un fichier d’échange electrical.sequence pour l’outil de permis. Le travail sous tension est enregistré comme voie exceptionnelle et ne reçoit jamais de résultat favorable.","es":"Introduzca el sistema (CA o CC, tensión nominal, esquema de conexión a tierra), la tarea, el entorno y los datos de aislamiento e instrumento de prueba, y después cree o edite la secuencia de pasos. Cada regla lleva un identificador, un tipo de fundamento, una fuente, un ámbito y una versión. El resultado separa los pasos que faltan, los conflictos de orden, las advertencias del entorno y los temas de choque eléctrico y arco eléctrico, y exporta un archivo de intercambio electrical.sequence para la herramienta de permisos. El trabajo en tensión se registra como vía excepcional y nunca recibe un resultado favorable.","pl":"Wprowadź system (AC lub DC, napięcie znamionowe, układ sieci), zadanie, środowisko oraz dane odłączenia i przyrządu pomiarowego, a następnie zbuduj lub zmień sekwencję kroków. Każda reguła ma identyfikator, rodzaj podstawy, źródło, zakres obowiązywania i wersję. Wynik osobno wskazuje brakujące kroki, konflikty kolejności, ostrzeżenia środowiskowe oraz tematy porażenia i łuku elektrycznego, a także eksportuje plik wymiany electrical.sequence dla narzędzia pozwoleń. Prace pod napięciem są rejestrowane jako ścieżka wyjątkowa i nigdy nie otrzymują pozytywnego wyniku."},

  "limitations": {"en":"Checks the completeness and order of a planned sequence only. It calculates no arc-flash incident energy and no approach distances, does not assess installation or wiring compliance, and does not replace the authorised-person procedure or a switching programme. Rule packs are summaries; the edition of each cited document is not pinned and must be confirmed. The US and site packs carry no voltage-band limits until the user enters them.","uk":"Перевіряє лише повноту й порядок запланованої послідовності. Не розраховує енергію електричної дуги та відстані наближення, не оцінює відповідність електроустановки чи проводки й не замінює процедуру уповноваженої особи або програму перемикань. Пакети правил є стислими викладами; редакцію кожного документа не зафіксовано, її слід підтвердити. Пакети США та об’єкта не містять меж діапазонів напруги, доки їх не введе користувач.","de":"Prüft nur Vollständigkeit und Reihenfolge einer geplanten Schrittfolge. Berechnet weder Störlichtbogenenergie noch Annäherungsabstände, bewertet nicht die Konformität von Anlage oder Verdrahtung und ersetzt weder das Verfahren der verantwortlichen Person noch ein Schaltprogramm. Regelpakete sind Zusammenfassungen; die Ausgabe jedes zitierten Dokuments ist nicht festgelegt und muss bestätigt werden. US- und Standortpaket enthalten keine Spannungsgrenzen, bis der Nutzer sie eingibt.","nl":"Toetst alleen volledigheid en volgorde van een geplande reeks. Berekent geen vlamboogenergie en geen naderingsafstanden, beoordeelt geen conformiteit van installatie of bedrading en vervangt de procedure van de bevoegde persoon of een schakelprogramma niet. Regelpakketten zijn samenvattingen; de uitgave van elk aangehaald document ligt niet vast en moet worden bevestigd. Het VS- en locatiepakket bevatten geen spanningsgrenzen totdat de gebruiker ze invoert.","fr":"Contrôle uniquement la complétude et l’ordre d’une séquence planifiée. Ne calcule ni énergie incidente d’arc ni distances d’approche, n’évalue pas la conformité de l’installation ou du câblage et ne remplace ni la procédure de la personne habilitée ni un programme de manœuvre. Les jeux de règles sont des résumés ; l’édition de chaque document cité n’est pas figée et doit être confirmée. Les jeux États-Unis et site ne contiennent aucune limite de domaine de tension tant que l’utilisateur ne les saisit pas.","es":"Comprueba solo la integridad y el orden de una secuencia planificada. No calcula energía incidente de arco ni distancias de aproximación, no evalúa la conformidad de la instalación o del cableado y no sustituye el procedimiento de la persona autorizada ni un programa de maniobras. Los paquetes de reglas son resúmenes; la edición de cada documento citado no está fijada y debe confirmarse. Los paquetes de EE. UU. y de instalación no contienen límites de banda de tensión hasta que el usuario los introduce.","pl":"Sprawdza wyłącznie kompletność i kolejność zaplanowanej sekwencji. Nie oblicza energii łuku ani odległości zbliżenia, nie ocenia zgodności instalacji ani okablowania i nie zastępuje procedury osoby upoważnionej ani programu łączeń. Pakiety reguł są streszczeniami; wydanie każdego cytowanego dokumentu nie jest ustalone i wymaga potwierdzenia. Pakiety USA i zakładowy nie zawierają granic zakresów napięć, dopóki użytkownik ich nie wprowadzi."},

  "validation": {"basis": {"en": "Independent reference corpus of 80 electrical safe-work plans (bench/electricalsafework, authored without access to the tool code, from 29 CFR 1910.333, HSE HSG85 and GS38, the EN 50110-1 clause 6.2 structure, IEC 61140 band limits and the spec acceptance criteria); window.__dgcBenchmark() recomputes every check from this build through the page's own rule engine. In-page rule tests (window.__safetyTests) cover every rule ID. This is the author's own harness against an independent corpus, not an independent validation; review by an electrical-safety specialist is outstanding.", "uk": "Незалежний еталонний корпус із 80 планів безпечних електричних робіт (bench/electricalsafework, складений без доступу до коду інструмента, за 29 CFR 1910.333, HSE HSG85 і GS38, структурою розділу 6.2 EN 50110-1, межами діапазонів IEC 61140 і критеріями приймання специфікації); window.__dgcBenchmark() перераховує кожну перевірку з цієї збірки власним рушієм правил сторінки. Вбудовані тести (window.__safetyTests) охоплюють кожне правило. Це власний стенд автора з незалежним корпусом, а не незалежна валідація; перевірку фахівцем з електробезпеки ще не проведено.", "de": "Unabhängiger Referenzkorpus aus 80 Plänen für sicheres elektrisches Arbeiten (bench/electricalsafework, ohne Zugriff auf den Werkzeugcode erstellt, nach 29 CFR 1910.333, HSE HSG85 und GS38, der Gliederung von EN 50110-1 Abschnitt 6.2, den Grenzen nach IEC 61140 und den Abnahmekriterien der Spezifikation); window.__dgcBenchmark() berechnet jede Prüfung aus diesem Build mit der eigenen Regelmaschine der Seite neu. Die Regeltests der Seite (window.__safetyTests) decken jede Regel-ID ab. Dies ist der eigene Prüfstand des Autors gegen einen unabhängigen Korpus, keine unabhängige Validierung; eine Prüfung durch eine Elektrosicherheitsfachkraft steht aus.", "nl": "Onafhankelijk referentiecorpus van 80 plannen voor veilig elektrisch werk (bench/electricalsafework, opgesteld zonder toegang tot de code, op basis van 29 CFR 1910.333, HSE HSG85 en GS38, de indeling van EN 50110-1 paragraaf 6.2, de grenzen van IEC 61140 en de acceptatiecriteria van de specificatie); window.__dgcBenchmark() herberekent elke toets uit deze build met de eigen regelmotor van de pagina. De regeltests in de pagina (window.__safetyTests) dekken elke regel-ID. Dit is de eigen testopstelling van de auteur tegen een onafhankelijk corpus, geen onafhankelijke validatie; beoordeling door een specialist elektrische veiligheid staat nog uit.", "fr": "Corpus de référence indépendant de 80 plans de travail électrique en sécurité (bench/electricalsafework, rédigé sans accès au code de l’outil, d’après 29 CFR 1910.333, HSE HSG85 et GS38, la structure de l’article 6.2 d’EN 50110-1, les limites de la CEI 61140 et les critères d’acceptation de la spécification) ; window.__dgcBenchmark() recalcule chaque contrôle à partir de cette version avec le moteur de règles de la page. Les tests de règles de la page (window.__safetyTests) couvrent chaque identifiant. Il s’agit du banc d’essai de l’auteur face à un corpus indépendant, et non d’une validation indépendante ; l’examen par un spécialiste de la sécurité électrique reste à faire.", "es": "Corpus de referencia independiente de 80 planes de trabajo eléctrico seguro (bench/electricalsafework, elaborado sin acceso al código de la herramienta, a partir de 29 CFR 1910.333, HSE HSG85 y GS38, la estructura del apartado 6.2 de EN 50110-1, los límites de CEI 61140 y los criterios de aceptación de la especificación); window.__dgcBenchmark() recalcula cada comprobación a partir de esta versión con el motor de reglas de la página. Las pruebas de reglas de la página (window.__safetyTests) cubren cada identificador. Es el banco de pruebas del propio autor frente a un corpus independiente, no una validación independiente; falta la revisión por un especialista en seguridad eléctrica.", "pl": "Niezależny korpus referencyjny 80 planów bezpiecznej pracy elektrycznej (bench/electricalsafework, opracowany bez dostępu do kodu narzędzia, na podstawie 29 CFR 1910.333, HSE HSG85 i GS38, struktury punktu 6.2 EN 50110-1, granic IEC 61140 i kryteriów odbioru specyfikacji); window.__dgcBenchmark() przelicza każde sprawdzenie z tej wersji własnym silnikiem reguł strony. Testy reguł na stronie (window.__safetyTests) obejmują każdy identyfikator reguły. To własne stanowisko testowe autora względem niezależnego korpusu, a nie niezależna walidacja; przegląd przez specjalistę ds. bezpieczeństwa elektrycznego nie został jeszcze wykonany."}, "independent_validation": false, "benchmarks": [{"id": "electricalsafework-independent-reference-2026-09-16", "reference": "Hand-built electrical safe-work plans (EU, US and site rule packs; LV AC/DC, ELV and HV; complete plans, each core step removed, wrong order, unsuitable instruments, environment flags, adjacent live parts, stored energy, backfeed, energized exceptional path, insufficient and malformed data) plus IEC band boundary cases and 12 seeded random voltages classified by an own threshold function (ref.py). Categorical expectations follow EN 50110-1:2023 clause 6.2 structure, HSE HSG85 and GS38, 29 CFR 1910.333, IEC 61140 band limits, or the spec's acceptance criteria.", "citations": ["29 CFR 1910.333 (eCFR current text, read 2026-09-16) https://www.ecfr.gov/current/title-29/subtitle-B/chapter-XVII/part-1910/subpart-S/subject-group-ECFR2ef4b2f3c5d9f9b/section-1910.333 - (a)(1), (b)(2)(ii)(B), (b)(2)(iii), (b)(2)(iv)(B)", "HSE HSG85 'Electricity at work: Safe working practices', 3rd ed. 2013, https://www.hse.gov.uk/pubnS/priced/hsg85.pdf - paras 23, 47, 48, 49, 52, 53, 55, 57, 59", "HSE GS38 'Electrical test equipment for use on low voltage electrical systems', 4th ed., https://www.hse.gov.uk/pubns/priced/gs38.pdf - paras 13, 17, 19, 20", "EN 50110-1:2023 clause 6.2 headings 6.2.2-6.2.6 (publisher sample ToC only; body text not read) https://cdn.standards.iteh.ai/samples/70639/d56b2cf915854d53975e552586             body: T('Disconnect, secure against reconnection, verify the absence of voltage, then earth and short-circuit where the pack requires it and protect against adjacent live parts. A test taken before the last switching step says nothing about the state after it.', 'Відключити, захистити від повторного ввімкнення, перевірити відсутність напруги, далі заземлити й закоротити, де цього вимагає пакет, і захиститися від сусідніх частин під напругою. Вимірювання до останнього перемикання нічого не каже про стан після нього.', 'Freischalten, gegen Wiedereinschalten sichern, Spannungsfreiheit feststellen, dann erden und kurzschließen, wo das Paket es verlangt, und gegen benachbarte aktive Teile schützen. Eine Messung vor dem letzten Schaltschritt sagt nichts über den Zustand danach.', 'Vrijschakelen, beveiligen tegen herinschakelen, spanningsloosheid vaststellen, daarna aarden en kortsluiten waar het pakket dat eist en afschermen tegen naburige actieve delen. Een meting vóór de laatste schakelstap zegt niets over de toestand erna.', 'Séparer, condamner, vérifier l’absence de tension, puis mettre à la terre et en court-circuit si le jeu l’exige et se protéger des parties actives voisines. Une mesure faite avant la dernière manœuvre ne dit rien de l’état qui suit.', 'Desconectar, bloquear contra la reconexión, verificar la ausencia de tensión, después poner a tierra y en cortocircuito si el paquete lo exige y protegerse de las partes activas próximas. Una prueba anterior a la última maniobra no dice nada del estado posterior.', 'Odłączyć, zabezpieczyć przed załączeniem, sprawdzić brak napięcia, następnie uziemić i zewrzeć, gdy pakiet tego wymaga, oraz osłonić sąsiednie części czynne. Pomiar przed ostatnim łączeniem nic nie mówi o stanie po nim.')

            body: T('Band limits differ by current type and by document. The EN pack uses 50 V AC r.m.s. and 120 V ripple-free DC for ELV and 1000 V AC and 1500 V DC for LV; the other packs take limits from the user.', 'Межі діапазонів залежать від роду струму й документа. Пакет EN використовує 50 В змінного (діюче) і 120 В постійного без пульсацій для ННН та 1000 В змінного і 1500 В постійного для НН; інші пакети беруть межі від користувача.', 'Die Grenzen hängen von Stromart und Dokument ab. Das EN-Paket verwendet 50 V AC (Effektivwert) und 120 V oberschwingungsfreie DC für Kleinspannung sowie 1000 V AC und 1500 V DC für Niederspannung; die anderen Pakete übernehmen Nutzerwerte.', 'Grenzen verschillen per stroomsoort en document. Het EN-pakket gebruikt 50 V AC (effectief) en 120 V rimpelvrije DC voor ZLS en 1000 V AC en 1500 V DC voor LS; de andere pakketten nemen grenzen van de gebruiker.', 'Les limites dépendent du courant et du document. Le jeu EN retient 50 V CA efficaces et 120 V CC lissé pour la TBT, 1000 V CA et 1500 V CC pour la BT ; les autres jeux prennent les limites de l’utilisateur.', 'Los límites dependen del tipo de corriente y del documento. El paquete EN usa 50 V CA eficaces y 120 V CC sin ondulación para MBT y 1000 V CA y 1500 V CC para BT; los demás paquetes toman los límites del usuario.', 'Granice zależą od rodzaju prądu i dokumentu. Pakiet EN stosuje 50 V AC (skuteczne) i 120 V DC bez tętnień dla ELV oraz 1000 V AC i 1500 V DC dla nn; pozostałe pakiety przyjmują granice od użytkownika.')

  function rowStatusText(r) { return s({ ok: 'stOk', order: 'stOrder', extra: 'stExtra', dup: 'stDup' }[r.status]); }
  function buildSequence() {
    var rec = recommendedSequence(state);
    if (!Array.isArray(state.steps)) state.steps = [];
    state.steps.splice.apply(state.steps, [0, state.steps.length].concat(rec));
    if (ui) { ui.sync(); ui.run(); }
  }

  /* ------------------------------------------------ state hygiene / I/O */
  var ENUMS = { pack: PACK_IDS, current: ['ac', 'dc', 'unk'], earthing: ['tn', 'tt', 'it', 'dcsys', 'unk'],
    mode: ['dead', 'near', 'live'], work: ['replace', 'connect', 'repair', 'inspect', 'test', 'clean'],
    device: ['cb', 'sd', 'fuse', 'plug', 'none'], instrument: ['vd2', 'hvd', 'mm', 'nc', 'none'], proving: ['unit', 'known', 'none'] };
  function sanitize(src) {
    var base = baseState(), clean = {}, ignored = [];
    Object.keys(src || {}).forEach(function (k) {
      var v = src[k], b = base[k];
      if (!(k in base)) { ignored.push(k); return; }
      if (ENUMS[k]) { if (ENUMS[k].indexOf(v) >= 0) clean[k] = v; else ignored.push(k); return; }
      if (k === 'voltage') { if (v === null || isNum(v)) clean[k] = v; else ignored.push(k); return; }
      if (k === 'cust') {
        if (!v || typeof v !== 'object') { ignored.push(k); return; }
        var c = {};
        ['elvAc', 'elvDc', 'lvAc', 'lvDc'].forEach(function (q) { c[q] = isNum(v[q]) ? v[q] : null; });
        clean[k] = c; return;
      }
      if (k === 'steps') {
        if (!Array.isArray(v)) { ignored.push(k); return; }
        clean[k] = v.filter(function (r) { return r && STEP_KEYS.indexOf(r.k) >= 0; }).slice(0, 24)
          .map(function (r) { return { k: r.k, ref: String(r.ref == null ? '' : r.ref).slice(0, 120), done: !!r.done }; });
        if (clean[k].length !== v.length) ignored.push('steps[invalid rows]');
        return;
      }
      if (typeof b === 'boolean') { if (typeof v === 'boolean') clean[k] = v; else ignored.push(k); return; }
      if (typeof b === 'string') { if (typeof v === 'string') clean[k] = v.slice(0, 200); else ignored.push(k); return; }
      ignored.push(k);
    });
    return { clean: clean, ignored: ignored };
  }
  function serialize() { return JSON.parse(JSON.stringify(state)); }
  function deserialize(o) {
    var r = sanitize(o || {}), b = baseState();
    Object.keys(b).forEach(function (k) { state[k] = k in r.clean ? r.clean[k] : b[k]; });
    last = evaluate(state);
    if (ui) { ui.sync(); ui.run(); }
  }

  var EX_SCHEMA = 'tools.petrov.re/safety-exchange/v1', EX_KIND = 'electrical.sequence';
  function manifestRev() {
    try { return (window.Diagram && Diagram.manifest && Diagram.manifest().manifest_revision) || ''; } catch (e) { return ''; }
  }
  function allLangs(fn) { var o = {}; LANGS.forEach(function (l) { o[l] = fn(l); }); return o; }
  /* Exchange item contract v1 (control kinds): status ok|open|insufficient|na,
     blocking, origin_status (native word), step as a plain string, step_id as key. */
  var EX_STEP_MAP = { done: ['ok', false], planned: ['open', true], 'order-conflict': ['open', true], missing: ['open', true] };
  var EX_FIND_MAP = { open: ['open', true], attention: ['open', false], 'data-missing': ['insufficient', true], exceptional: ['open', true] };
  function buildExchange(st, R) {
    var items = [];
    function stepItem(id, k, origin, ref, note) {
      var m = EX_STEP_MAP[origin];
      var it = { id: id, type: 'step', label: allLangs(function (l) { return stepName(k, l); }),
        status: m[0], blocking: m[1], origin_status: origin, step: stepName(k, 'en'), step_id: k,
        rule: STEP_RULE[k] || '', reference: ref };
      if (note) it.note = note;
      items.push(it);
    }
    R.rows.forEach(function (r) {
      var origin = r.status === 'order' ? 'order-conflict' : (r.done ? 'done' : 'planned');
      stepItem('seq-' + r.n + '-' + r.k, r.k, origin, r.ref,
        origin === 'order-conflict' ? allLangs(function (l) { return s('stOrder', l).replace(/^!\s*/, ''); }) : null);
    });
    R.missing.forEach(function (k) {
      stepItem('missing-' + k, k, 'missing', '', allLangs(function (l) { return s('argMissing', l); }));
    });
    R.findings.forEach(function (f) {
      if (f.status === 'pass' || f.status === 'info') return;
      var origin = { fail: 'open', insufficient: 'data-missing', attention: 'attention', exception: 'exceptional' }[f.status];
      var m = EX_FIND_MAP[origin];
      items.push({ id: 'finding-' + f.rule + (f.arg ? '-' + f.arg.replace(/[^a-z0-9]+/gi, '-') : ''), type: 'open-hazard', rule: f.rule,
        label: allLangs(function (l) { return L(RULE_TEXT[f.rule], l); }),
        note: allLangs(function (l) { return findingText(f, R, l); }),
        status: m[0], blocking: m[1], origin_status: origin, basis: basisFor(f.rule, R.pack) });
    });
    return {
      schema: EX_SCHEMA, kind: EX_KIND,
      source: { id: 'electricalsafework', file: 'electricalsafework.html', revision: manifestRev() },
      created_at: new Date().toISOString(),
      items: items,
      notes: { outcome: R.outcome, energized_exception_flag: R.energized, rule_pack: R.pack,
        voltage_band: R.cls.band, current_type: st.current, nominal_voltage_V: isNum(st.voltage) ? st.voltage : null,
        planning_mode: st.mode, missing_steps: R.missing.slice(), environment_warnings: R.env.slice() }
    };
  }
  function exportExchange() {
    if (!last) return null;

    try { localStorage.setItem('tools.petrov.re/safety-exchange/' + EX_KIND, txt); } catch (e) {}
    var name = 'electricalsafework-' + EX_KIND + '-' + doc.created_at.replace(/[:.]/g, '-') + '.json';
    if (window.Diagram && Diagram.export && Diagram.export.download) Diagram.export.download(name, 'application/json', txt);
    if (ui) ui.notify(s('exported'), { kind: 'ok' });
    return doc;
  }

        wet: state.wet, conductive_location: state.conductive, confined: state.confined, adjacent_live_parts: state.adjacent,
        stored_energy: state.stored, backfeed: state.backfeed, induced_voltage: state.induced,
        isolating_device: state.device, isolation_point: state.isoId, all_sources_isolated: state.allSources,
        test_instrument: state.instrument, instrument_rated: state.instRated, instrument_id: state.instId,
        proving_method: state.proving, all_conductors_tested: state.conductors,
        pack_limits: JSON.parse(JSON.stringify(R.cfg.th)), site_rule_revision: state.siteVer
      },
      outputs: outputsFor(R),
      units: { nominal_voltage: 'V' },

      warnings: R.findings.filter(function (f) { return f.status !== 'pass' && f.status !== 'info'; })
        .map(function (f) { return f.rule + ': ' + findingText(f, R, l); }),

  var RT = {
    title: T('Electrical safe-work preparation record', 'Протокол підготовки безпечних електричних робіт', 'Protokoll zur Vorbereitung sicherer elektrischer Arbeiten', 'Verslag voorbereiding veilig elektrisch werk', 'Fiche de préparation des travaux électriques en sécurité', 'Registro de preparación de trabajo eléctrico seguro', 'Protokół przygotowania bezpiecznych prac elektrycznych'),
    sequence: T('Planned safe-work sequence', 'Запланована послідовність', 'Geplante Schrittfolge', 'Geplande stappenreeks', 'Séquence prévue', 'Secuencia planificada', 'Zaplanowana sekwencja'),
    evidence: T('Verification evidence', 'Підтвердження перевірки', 'Nachweise der Prüfung', 'Bewijs van de controle', 'Preuves de vérification', 'Evidencias de verificación', 'Dowody sprawdzenia'),
    basis: T('Rule basis of the selected pack', 'Підстави правил вибраного пакета', 'Regelgrundlagen des gewählten Pakets', 'Grondslagen van het gekozen pakket', 'Fondements des règles du jeu choisi', 'Fundamentos del paquete elegido', 'Podstawy reguł wybranego pakietu'),
    rules: T('Rules', 'Правила', 'Regeln', 'Regels', 'Règles', 'Reglas', 'Reguły'),
    kind: T('Kind', 'Вид', 'Art', 'Soort', 'Nature', 'Tipo', 'Rodzaj'),
    source: T('Source', 'Джерело', 'Quelle', 'Bron', 'Source', 'Fuente', 'Źródło'),
    jur: T('Jurisdiction', 'Юрисдикція', 'Geltungsbereich', 'Rechtsgebied', 'Domaine d’application', 'Ámbito', 'Zakres obowiązywania'),

  function reportProfile(rec, ctx) {
    if (!last) return {};
    var l = ctx.domainLang || lang(), R = last, st = state;
    var yn = function (b) { return s(b ? 'yes' : 'no', l); };
    var optLabel = function (map, v) { return map[v] ? s(map[v], l) : String(v); };
    var devMap = { cb: 'dCb', sd: 'dSd', fuse: 'dFuse', plug: 'dPlug', none: 'dNone' };
    var instMap = { vd2: 'iVd2', hvd: 'iHvd', mm: 'iMm', nc: 'iNc', none: 'iNone' };
    var provMap = { unit: 'prUnit', known: 'prKnown', none: 'prNone' };
    var modeMap = { dead: 'mDead', near: 'mNear', live: 'mLive' };
    var workMap = { replace: 'wReplace', connect: 'wConnect', repair: 'wRepair', inspect: 'wInspect', test: 'wTest', clean: 'wClean' };
    var earthTxt = { tn: 'TN', tt: 'TT', it: 'IT' }[st.earthing] || optLabel({ dcsys: 'eDc', unk: 'unk' }, st.earthing);
    var volt = isNum(st.voltage) ? num(st.voltage, l, 0) + ' ' + s('volt', l) : s('unk', l);
    var envKeys = ['wet', 'conductive', 'confined', 'adjacent', 'stored', 'backfeed', 'induced'];

    var seqRows = R.rows.map(function (x) {
      var stt = x.status === 'order' ? '! ' + s('stOrder', l).replace(/^!\s*/, '') : (x.done ? '● ' + r('done', l) : '✓ ' + r('planned', l));
      return [String(x.n), stepName(x.k, l), stt, x.ref || '—', STEP_RULE[x.k] || '—'];
    }).concat(R.missing.map(function (k) { return ['—', stepName(k, l), '✗ ' + r('missing', l), '—', STEP_RULE[k]]; }));

    var usedRules = {};
    R.findings.forEach(function (f) { usedRules[f.rule] = true; });
    var groups = {}, order = [];
    Object.keys(usedRules).sort().forEach(function (id) {
      var b = basisParts(id, st, l), key = [b.kind, b.source, b.jur, b.ver].join('|');
      if (!groups[key]) { groups[key] = { ids: [], b: b }; order.push(key); }
      groups[key].ids.push(id.replace('ESW-R-', ''));
    });
    var basisRows = order.map(function (k) { var g = groups[k]; return ['ESW-R-' + g.ids.join(', '), g.b.kind, g.b.source, g.b.jur, g.b.ver]; });

    var byRule = {}, checks = [];
    R.findings.filter(function (f) { return f.status !== 'pass'; })
      .sort(function (a, b) { return SEVERITY[a.status] - SEVERITY[b.status]; })
      .forEach(function (f) {
        var status = { exception: 'fail', fail: 'fail', insufficient: 'attention', attention: 'attention', info: 'info' }[f.status];
        var a = argText(f, R, l), part = s(STATUS_KEY[f.status], l) + (a ? ': ' + a : '');
        if (byRule[f.rule]) { byRule[f.rule].detail += '; ' + part; return; }
        byRule[f.rule] = { status: status, title: f.rule + ' — ' + L(RULE_TEXT[f.rule], l), detail: part };
        checks.push(byRule[f.rule]);
      });
    var fig = reportFigure(ctx, l);
    var evidence = [
      [s('fIsoId', l), st.isoId || '—'], [s('fDevice', l), optLabel(devMap, st.device)],
      [s('fInst', l), optLabel(instMap, st.instrument)], [s('fInstId', l), st.instId || '—'],
      [s('fInstRated', l), yn(st.instRated)], [s('fProving', l), optLabel(provMap, st.proving)],
      [s('fConductors', l), yn(st.conductors)]
    ];
    if (st.backfeed) evidence.push([s('fAllSources', l), yn(st.allSources)]);
    var inputs = [
      { group: s('pSystem', l), label: s('fCurrent', l), text: curName(st.current, l) },
      { group: s('pSystem', l), label: s('fVoltage', l), text: volt },
      { group: s('pSystem', l), label: s('fEarthing', l), text: earthTxt },
      { group: s('pSystem', l), label: s('fSysNote', l), text: st.sysNote || '—' },
      { group: s('pTask', l), label: s('fWork', l), text: optLabel(workMap, st.work) }
    ];
    if (st.mode === 'near') inputs.push({ group: s('pTask', l), label: s('fNearOnly', l), text: yn(st.nearOnly) }, { group: s('pTask', l), label: s('fBoundary', l), text: st.boundary || '—' });
    if (st.mode === 'live') inputs.push({ group: s('pTask', l), label: s('fJustify', l), text: st.justify || '—' }, { group: s('pTask', l), label: s('fAuth', l), text: yn(st.authorised) });
    envKeys.forEach(function (k) { inputs.push({ group: s('pEnv', l), label: s('f' + k.charAt(0).toUpperCase() + k.slice(1), l), text: yn(st[k]) }); });
    if (st.pack === 'site') {
      [['sProveBefore', 'fSPB'], ['sProveAfter', 'fSPA'], ['sTag', 'fSTag'], ['sEarthLV', 'fSEarth']].forEach(function (p) {
        inputs.push({ group: s('pPack', l), label: s(p[1], l), text: yn(st[p[0]]) });
      });
      inputs.push({ group: s('pPack', l), label: s('fSiteVer', l), text: st.siteVer || '—' });
    }
    return {
      title: r('title', l),
      project: [
        { label: s('pSystem', l), text: curName(st.current, l) + ', ' + volt + ', ' + earthTxt },
        { label: s('pTask', l), text: optLabel(workMap, st.work) },
        { label: s('fMode', l), text: optLabel(modeMap, st.mode) },
        { label: s('pPack', l), text: packName(R.pack, l) }
      ],
      executive: {
        text: [s(VERDICT_KEY[R.outcome], l)],
        results: [
          { label: s('tOutcome', l), text: s(OUT_KEY[R.outcome], l) },
          { label: s('tBand', l), text: s(BAND_KEY[R.cls.band], l) + (st.current === 'ac' || st.current === 'dc' ? ' · ' + curName(st.current, l) : '') },
          { label: s('tMissing', l), text: String(R.missing.length) },
          { label: s('tOpen', l), text: String(R.openCount) }
        ],
        conclusion: ''
      },
      purpose: [], scope: [], intendedUse: [], assumptions: [],
      system: { text: [], flow: [] },
      results: [
        { label: r('limitsLbl', l), text: limitsFor(R.cfg, st.current, l) },
        { label: r('energized', l), text: yn(R.energized) }
      ],
      decisions: [],
      checks: checks.length ? checks : [{ status: 'pass', title: s('oClear', l), detail: r('passNote', l) }],
      risks: [], actions: [], questions: [],
      figures: fig ? [fig] : [],
      method: { equations: [], ranges: [], notes: [], references: [] },
      inputs: inputs,
      appendices: [
        { title: r('sequence', l), head: [s('thNo', l), s('cStep', l), s('thStatus', l), s('cRef', l), s('thRule', l)], rows: seqRows,
          cols: '12mm minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.2fr) 24mm' },
        { title: r('evidence', l), head: [r('item', l), r('value', l)], rows: evidence, cols: 'minmax(0,1.3fr) minmax(0,1fr)' },
        { title: s('tblTopics', l), head: [s('thHazard', l), s('thTopic', l)],
          rows: R.shock.map(function (k) { return [s('hShock', l), L(SHOCK_TOPICS[k], l)]; })
            .concat(R.arc.map(function (k) { return [s('hArc', l), L(ARC_TOPICS[k], l)]; })), cols: '34mm minmax(0,1fr)' },
        { title: r('basis', l), head: [r('rules', l), r('kind', l), r('source', l), r('jur', l), r('ver', l)], rows: basisRows,
          cols: 'minmax(0,1.1fr) 24mm minmax(0,1.6fr) minmax(0,.9fr) minmax(0,.9fr)' }
      ]
    };
  }

  function installData() {
    if (!window.Diagram) return;
    Diagram.init({

  /* ----------------------------------------------------------- self-tests */
  function mk(over) { var x = baseState(); Object.keys(over || {}).forEach(function (k) { x[k] = over[k]; }); return x; }
  function withSeq(over) { var x = mk(over); x.steps = recommendedSequence(x); return x; }
  function find(R, rule, status) { return R.findings.some(function (f) { return f.rule === rule && (!status || f.status === status); }); }
  function selfTests() {
    var out = [];
    function t(id, rule, kind, name, got, expected) {
      out.push({ id: id, rule: rule, kind: kind, name: name, pass: JSON.stringify(got) === JSON.stringify(expected), got: got, expected: expected });
    }
    var R;
    /* voltage bands, AC/DC explicit */
    [['ac', 50, 'elv'], ['ac', 50.01, 'lv'], ['dc', 120, 'elv'], ['dc', 120.5, 'lv'], ['ac', 110, 'lv'], ['dc', 110, 'elv'],
     ['ac', 1000, 'lv'], ['ac', 1000.1, 'hv'], ['dc', 1500, 'lv'], ['dc', 1500.1, 'hv'], ['dc', 1200, 'lv']].forEach(function (c, i) {
      t('T-BAND-' + (i + 1), 'ESW-R-027', 'boundary', 'EN pack: ' + c[1] + ' V ' + c[0] + ' is ' + c[2], classify(c[0], c[1], EU_TH).band, c[2]);
    });
    t('T-BAND-UNK-CUR', 'ESW-R-023', 'insufficient', 'unknown current type cannot be classified', classify('unk', 230, EU_TH).band, 'unknown');
    t('T-BAND-NO-TH', 'ESW-R-025', 'insufficient', 'missing pack limits cannot classify', classify('ac', 230, { elvAc: null, lvAc: null }).why, 'thresholds');
    t('T-BAND-BAD-TH', 'ESW-R-025', 'negative', 'LV limit below ELV limit is refused', classify('ac', 230, { elvAc: 60, lvAc: 50 }).band, 'unknown');

    /* complete de-energized plan */
    R = evaluate(baseState());
    t('T-CLEAR', 'ESW-R-005', 'positive', 'default plan has no unresolved finding', R.outcome, 'clear');
    t('T-CLEAR-CORE', 'ESW-R-001', 'acceptance', 'successful plan holds isolate, lock and test', ['isolate', 'lock', 'test_dead'].every(function (k) { return R.rows.some(function (r) { return r.k === k; }); }), true);
    t('T-CLEAR-SEC', 'ESW-R-003', 'positive', 'lock rule met in default plan', find(R, 'ESW-R-003', 'pass'), true);
    t('T-TAG', 'ESW-R-004', 'positive', 'tag rule met in default plan', find(R, 'ESW-R-004', 'pass'), true);
    t('T-PB', 'ESW-R-007', 'positive', 'prove-before met', find(R, 'ESW-R-007', 'pass'), true);
    t('T-EARTH-LV', 'ESW-R-010', 'positive', 'EN pack: LV without backfeed needs no earthing step', R.required.indexOf('earth'), -1);
    /* acceptance: every clear dead plan must contain the three core steps */
    var cores = 0, clears = 0;
    PRESETS.forEach(function (p) { var q = evaluate(p.state); if (q.outcome === 'clear' && p.state.mode === 'dead') { clears++; if (['isolate', 'lock', 'test_dead'].every(function (k) { return q.rows.some(function (r) { return r.k === k; }); })) cores++; } });
    t('T-ACC-CORE', 'ESW-R-005', 'acceptance', 'every clear preset holds isolate, secure and verify', cores === clears && clears > 0, true);

    /* missing verification: cannot complete */
    var x = baseState(); x.steps = x.steps.filter(function (r) { return r.k !== 'test_dead'; });
    R = evaluate(x);
    t('T-NOVERIFY', 'ESW-R-005', 'negative', 'plan without voltage test stays open', [R.outcome, R.missing.indexOf('test_dead') >= 0], ['open', true]);
    x = baseState(); x.steps = x.steps.filter(function (r) { return r.k !== 'lock'; });
    t('T-NOLOCK', 'ESW-R-003', 'negative', 'plan without lock stays open', evaluate(x).outcome, 'open');
    x = baseState(); x.steps = x.steps.filter(function (r) { return r.k !== 'isolate'; });
    t('T-NOISO', 'ESW-R-001', 'negative', 'plan without disconnection stays open', find(evaluate(x), 'ESW-R-001', 'fail'), true);
    t('T-NODEV', 'ESW-R-001', 'negative', 'no isolating device is an open finding', find(evaluate(mk({ device: 'none' })), 'ESW-R-001', 'fail'), true);
    x = baseState(); x.steps = x.steps.filter(function (r) { return r.k !== 'tag'; });
    t('T-NOTAG', 'ESW-R-004', 'negative', 'EN pack default requires a tag', evaluate(x).missing, ['tag']);

    /* prove before/after per pack */
    x = baseState(); x.steps = x.steps.filter(function (r) { return r.k !== 'prove_after'; });
    t('T-PA-EU', 'ESW-R-008', 'negative', 'EN pack requires prove-after', evaluate(x).missing, ['prove_after']);
    x.pack = 'site'; x.cust = { elvAc: 50, elvDc: 120, lvAc: 1000, lvDc: 1500 }; x.sProveAfter = false;
    t('T-PA-SITE', 'ESW-R-008', 'boundary', 'site pack with prove-after off does not require it', evaluate(x).missing, []);
    x.sProveAfter = true;
    t('T-PA-SITE-ON', 'ESW-R-008', 'negative', 'site pack with prove-after on requires it', evaluate(x).missing, ['prove_after']);
    x = baseState(); x.steps = x.steps.filter(function (r) { return r.k !== 'prove_before'; });
    t('T-PB-MISS', 'ESW-R-007', 'negative', 'missing prove-before is reported', evaluate(x).missing, ['prove_before']);
    t('T-PROVING', 'ESW-R-017', 'insufficient', 'unstated proving method is insufficient data', evaluate(mk({ proving: 'none' })).outcome, 'insufficient');

    /* order */
    R = evaluate(PRESETS.filter(function (p) { return p.id === 'order-error'; })[0].state);
    t('T-ORDER', 'ESW-R-013', 'negative', 'test before isolation is an order conflict', [find(R, 'ESW-R-013', 'fail'), R.outcome], [true, 'open']);
    t('T-ORDER-ROW', 'ESW-R-013', 'negative', 'the late isolation row is marked', R.rows.some(function (r) { return r.status === 'order'; }), true);
    x = baseState(); x.steps = [x.steps[1], x.steps[0]].concat(x.steps.slice(2));
    t('T-ORDER-LOCK', 'ESW-R-013', 'negative', 'lock before disconnection is an order conflict', find(evaluate(x), 'ESW-R-013', 'fail'), true);
    x = baseState(); x.steps.push({ k: 'prove_before', ref: '', done: false });
    t('T-ORDER-OK-DUP', 'ESW-R-013', 'boundary', 'a repeated late prove step does not break order', find(evaluate(x), 'ESW-R-013', 'pass'), true);
    x = baseState(); x.steps = x.steps.filter(function (r) { return r.k !== 'prove_after'; }); x.steps.splice(3, 0, { k: 'prove_after', ref: '', done: false });
    t('T-ORDER-PA', 'ESW-R-013', 'negative', 'prove-after placed before the test is a conflict', find(evaluate(x), 'ESW-R-013', 'fail'), true);

    /* stored energy */
    x = mk({ stored: true });
    t('T-STORED-REQ', 'ESW-R-012', 'negative', 'stored energy requires a discharge step', evaluate(x).missing, ['discharge']);
    x.steps = recommendedSequence(x);
    R = evaluate(x);
    t('T-STORED-OK', 'ESW-R-012', 'positive', 'recommended sequence discharges before the test', [R.missing, find(R, 'ESW-R-013', 'pass')], [[], true]);
    x.steps.push({ k: 'discharge', ref: '', done: false }); x.steps.splice(3, 1);
    t('T-STORED-ORDER', 'ESW-R-013', 'negative', 'discharge after the test is an order conflict', find(evaluate(x), 'ESW-R-013', 'fail'), true);
    t('T-STORED-ENV', 'ESW-R-034', 'positive', 'stored energy produces an environment warning', evaluate(x).env.indexOf('ESW-R-034') >= 0, true);

    /* earthing */
    x = withSeq({ backfeed: true, allSources: true });
    t('T-EARTH-BF', 'ESW-R-010', 'positive', 'backfeed makes earthing required', x.steps.some(function (r) { return r.k === 'earth'; }), true);
    t('T-BF-SRC', 'ESW-R-002', 'positive', 'all sources confirmed', find(evaluate(x), 'ESW-R-002', 'pass'), true);
    x.allSources = false;
    t('T-BF-SRC-NEG', 'ESW-R-002', 'negative', 'unconfirmed sources are open', find(evaluate(x), 'ESW-R-002', 'fail'), true);
    t('T-BF-ENV', 'ESW-R-035', 'positive', 'backfeed warning raised', evaluate(x).env.indexOf('ESW-R-035') >= 0, true);
    x = mk({ induced: true });
    t('T-EARTH-IND', 'ESW-R-010', 'negative', 'induced voltage without earthing step is missing', evaluate(x).missing, ['earth']);
    x = mk({ pack: 'site', cust: { elvAc: 50, elvDc: 120, lvAc: 1000, lvDc: 1500 }, sEarthLV: true });
    t('T-EARTH-SITE', 'ESW-R-010', 'boundary', 'site rule earths every LV job', evaluate(x).missing, ['earth']);
    x = withSeq({ voltage: 11000, instrument: 'hvd' });
    R = evaluate(x);
    t('T-HV', 'ESW-R-026', 'positive', '11 kV AC is HV with earthing required', [R.cls.band, R.required.indexOf('earth') >= 0, find(R, 'ESW-R-026', 'attention')], ['hv', true, true]);
    t('T-HV-OUT', 'ESW-R-010', 'positive', 'complete HV plan has no unresolved finding', R.outcome, 'clear');

    /* instrument */
    t('T-INST-HV', 'ESW-R-006', 'negative', 'LV detector on HV is refused', find(evaluate(withSeq({ voltage: 11000 })), 'ESW-R-006', 'fail'), true);
    t('T-INST-LVHV', 'ESW-R-006', 'negative', 'HV detector on LV is refused', find(evaluate(mk({ instrument: 'hvd' })), 'ESW-R-006', 'fail'), true);
    t('T-INST-NC', 'ESW-R-006', 'negative', 'non-contact indicator is refused', find(evaluate(mk({ instrument: 'nc' })), 'ESW-R-006', 'fail'), true);
    t('T-INST-NONE', 'ESW-R-006', 'negative', 'no instrument is refused', find(evaluate(mk({ instrument: 'none' })), 'ESW-R-006', 'fail'), true);
    t('T-INST-RATED', 'ESW-R-006', 'negative', 'unconfirmed rating is refused', find(evaluate(mk({ instRated: false })), 'ESW-R-006', 'fail'), true);
    R = evaluate(mk({ instrument: 'mm' }));
    t('T-INST-MM', 'ESW-R-006', 'boundary', 'multimeter is attention and does not open the plan', [find(R, 'ESW-R-006', 'attention'), R.outcome], [true, 'clear']);
    t('T-CONDUCTORS', 'ESW-R-009', 'negative', 'untested conductor combinations are open', find(evaluate(mk({ conductors: false })), 'ESW-R-009', 'fail'), true);
    t('T-ISOID', 'ESW-R-015', 'insufficient', 'missing isolation point id is insufficient data', evaluate(mk({ isoId: '' })).outcome, 'insufficient');
    R = evaluate(mk({ instId: '' }));
    t('T-INSTID', 'ESW-R-016', 'boundary', 'missing instrument id is attention only', [find(R, 'ESW-R-016', 'attention'), R.outcome], [true, 'clear']);

    /* data completeness */
    R = evaluate(PRESETS.filter(function (p) { return p.id === 'unknown-supply'; })[0].state);
    t('T-INSUFF', 'ESW-R-023', 'insufficient', 'unknown supply gives insufficient data', [R.outcome, find(R, 'ESW-R-023', 'insufficient'), find(R, 'ESW-R-024', 'insufficient')], ['insufficient', true, true]);
    t('T-VOLT-0', 'ESW-R-024', 'insufficient', 'zero voltage is not a nominal voltage', find(evaluate(mk({ voltage: 0 })), 'ESW-R-024', 'insufficient'), true);
    R = evaluate(PRESETS.filter(function (p) { return p.id === 'us-pack'; })[0].state);
    t('T-US-TH', 'ESW-R-025', 'insufficient', 'US pack without entered limits is insufficient', [R.outcome, find(R, 'ESW-R-025', 'insufficient')], ['insufficient', true]);
    x = mk({ pack: 'us', cust: { elvAc: 50, elvDc: 50, lvAc: 1000, lvDc: 1000 } }); x.steps = recommendedSequence(x);
    R = evaluate(x);
    t('T-US-OK', 'ESW-R-025', 'positive', 'US pack with user limits classifies', [R.cls.band, R.outcome], ['lv', 'clear']);
    R = evaluate(mk({ pack: 'xx' }));
