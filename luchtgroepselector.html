/* ==================================================================== */
{
  id: 'kast', title: 'Kast, opstelling en transport',
  intro: 'De klassen uit EN 1886 zijn de enige objectieve maat voor de bouwkwaliteit van de kast. Vraag ze expliciet op — zonder die eis levert elke fabrikant zijn eigen basisuitvoering en zijn de offertes onvergelijkbaar.',
  questions: [
    { id: 'cas_location', type: 'select', label: 'Opstellingsplaats', default: 'binnen',
      options: [{ v: 'binnen', l: 'Binnen — technische ruimte' }, { v: 'buiten', l: 'Buiten — weerbestendige uitvoering' }, { v: 'dak', l: 'Op het dak' }, { v: 'plafond', l: 'Opgehangen in het plafond' }],
      help: 'Buitenopstelling vraagt een dak, waterdichte doorvoeringen, vorstbeveiliging van alle waterzijdige delen en een aanzienlijk betere thermische kastklasse. Bij een dakopstelling: controleer de draagkracht en de toegang vóór de keuze.' },
    { id: 'cas_arrangement', type: 'select', label: 'Opbouw', default: 'naast',
      options: [{ v: 'naast', l: 'Toevoer en afvoer naast elkaar' }, { v: 'gestapeld', l: 'Gestapeld (boven elkaar)' }, { v: 'gescheiden', l: 'Twee gescheiden kasten' }],
      help: 'Gestapeld halveert de vloeroppervlakte maar verdubbelt de hoogte en bemoeilijkt het onderhoud van de bovenste secties. Gescheiden kasten zijn nodig als toevoer en afvoer fysiek uit elkaar moeten liggen — dan is twin-coil de enige terugwinoptie.' },
    { id: 'cas_class_d', type: 'select', label: 'Mechanische sterkte (EN 1886)', default: 'D1',
      options: [{ v: 'D1', l: 'D1 — hoogste' }, { v: 'D2', l: 'D2' }, { v: 'D3', l: 'D3' }],
      help: 'Bepaalt de doorbuiging van het paneel bij bedrijfsdruk. Bij hoge drukken of grote kasten is D1 nodig om te voorkomen dat panelen gaan werken en de lekdichtheid verliezen.' },
    { id: 'cas_class_l', type: 'select', label: 'Luchtlekkage van de kast (EN 1886)', default: 'L2',
      options: [{ v: 'L1', l: 'L1 — hoogste dichtheid' }, { v: 'L2', l: 'L2 — gebruikelijk' }, { v: 'L3', l: 'L3' }],
      help: 'Lekkage is verloren energie én, bij onderdruk, ongefilterde lucht die de kast binnenkomt. Bij hoge filterklassen, hygiënische toepassingen of drukcascades is L1 vereist.' },
    { id: 'cas_class_f', type: 'select', label: 'Filterbypasslekkage (EN 1886)', default: 'F9',
      options: [{ v: 'F9', l: 'F9 — hoogste' }, { v: 'F8', l: 'F8' }, { v: 'geen_eis', l: 'Geen eis' }] },
    { id: 'cas_class_t', type: 'select', label: 'Warmtedoorgang van het paneel (EN 1886)', default: 'T3',
      options: [{ v: 'T1', l: 'T1 — best isolerend' }, { v: 'T2', l: 'T2' }, { v: 'T3', l: 'T3 — standaard' }, { v: 'T4', l: 'T4' }],
      help: 'Bepaalt het warmteverlies en, samen met de thermische brug, het risico op condensatie aan de buitenzijde van de kast.' },
    { id: 'cas_class_tb', type: 'select', label: 'Thermische brug (EN 1886)', default: 'TB3',
      options: [{ v: 'TB1', l: 'TB1 — geen brug' }, { v: 'TB2', l: 'TB2' }, { v: 'TB3', l: 'TB3 — standaard' }, { v: 'TB4', l: 'TB4' }],
      help: 'Onderschat criterium. Bij een koude kast in een warme ruimte, of een buitenopstelling in de winter, slaat condens neer op de profielen en op de boutverbindingen als de brugklasse te laag is. Bij koeling met ontvochtiging is TB2 het praktische minimum.' },
    { id: 'cas_hygiene', type: 'select', label: 'Hygiëne-eis', default: 'geen',
      options: [{ v: 'geen', l: 'Geen bijzondere eis' }, { v: 'VDI6022', l: 'VDI 6022 / EN 16798-3' }, { v: 'DIN1946', l: 'DIN 1946-4 (zorg)' }, { v: 'voeding', l: 'Voedingsgeschikt / reinigbaar' }],
      help: 'Hygiënische uitvoering betekent gladde binnenzijden, geen open isolatie, geen dode zones, volledige afwatering van elke natte sectie en toegang tot elk oppervlak. Dat is een constructieprincipe, geen optie die je later toevoegt.' },
    { id: 'cas_corrosion', type: 'select', label: 'Corrosie-uitvoering', default: 'standaard',
      options: [{ v: 'standaard', l: 'Standaard verzinkt' }, { v: 'gecoat', l: 'Gecoat / gelakt' }, { v: 'kust', l: 'Kustuitvoering' }, { v: 'zwembad', l: 'Zwembad — chloorbestendig' }, { v: 'industrie', l: 'Industrieel agressief' }, { v: 'RVS', l: 'Roestvast staal' }],
      help: 'Vraag naar de uitvoering van de batterijlamellen en van de condensopvangbakken apart: dat zijn de delen die het eerst doorroesten, niet de mantel.' },
    { id: 'cas_face_w', type: 'number', label: 'Maximale kastbreedte', unit: 'm', help: 'Laat leeg om de breedte uit de frontsnelheid te laten volgen. Vul in als de technische ruimte een harde grens stelt.' },
    { id: 'cas_face_h', type: 'number', label: 'Maximale kasthoogte', unit: 'm', help: 'Denk aan de vrije hoogte onder leidingen en aan de ruimte boven de kast voor het uitnemen van componenten.' },
    { id: 'cas_max_l', type: 'number', label: 'Maximale lengte per transportsectie', unit: 'm', default: 2.4, help: 'Bepaalt in hoeveel delen de kast wordt geleverd. Elke koppeling is een potentieel lek: vraag hoe de koppelingen worden afgedicht en wie ze op de bouwplaats maakt.' },
    { id: 'cas_door_w', type: 'number', label: 'Kleinste doorgang op de aanvoerweg', unit: 'm', help: 'Deuropening, lift, trapgat of dakluik. Dit gegeven wordt structureel vergeten en is de meest voorkomende reden dat een kast op de bouwplaats moet worden gedemonteerd.' },
    { id: 'cas_service_side', type: 'select', label: 'Bedieningszijde', default: 'links',
      options: [{ v: 'links', l: 'Links (gezien in de stroomrichting)' }, { v: 'rechts', l: 'Rechts' }, { v: 'beide', l: 'Beide zijden' }],
      help: 'Bepaalt aan welke kant de inspectiedeuren komen. Wijzigen na productie kan niet.' },
    { id: 'cas_service_space', type: 'number', label: 'Beschikbare vrije ruimte aan de bedieningszijde', unit: 'm', default: 1.2, help: 'Minimaal de kastbreedte plus de uitneembare lengte van de langste component. Voor filters en wisselaars is dit vaak meer dan men denkt.' },
    { id: 'cas_floor_load', type: 'number', label: 'Toelaatbare vloerbelasting', unit: 'kg/m²', help: 'Vooral bij dakopstelling en bij renovatie relevant. Geef ook op of er een aparte draagconstructie voorzien is.' },
    { id: 'cas_vibration', type: 'select', label: 'Trillingsisolatie', default: 'intern',
      options: [{ v: 'intern', l: 'Inwendig, standaard' }, { v: 'veren', l: 'Veerelementen onder de kast' }, { v: 'rubber', l: 'Rubberelementen onder de kast' }, { v: 'geen', l: 'Geen' }],
      help: 'Bij opstelling boven verblijfsruimten of op een lichte dakconstructie bepaalt de trillingsisolatie of de installatie hoorbaar is. Flexibele verbindingen op alle kanaalaansluitingen en op de leidingen horen erbij.' },
    { id: 'cas_roof', type: 'radio', label: 'Weerbestendig dak en beschermkappen?', options: YESNO, default: 'ja', show: A => ['buiten', 'dak'].includes(A.cas_location), help: 'Inclusief regenbestendige buitenluchtinlaat met druppelvanger, beschermde uitblaas en vorstbestendige uitvoering van alle waterzijdige componenten.' }
  ]
},

  questions: [

      help: 'Dit is de vraag die de levensduur van de batterijen bepaalt. Aluminium lamellen zijn niet bestand tegen chloor, ammoniak, sterke zuren of alkaliën; koper niet tegen ammoniak en zwavelverbindingen. Vink aan wat de afvoerlucht bevat, niet alleen wat de toevoerlucht bevat — de afvoerzijde van de warmteterugwinning staat er permanent in.' },
    { id: 'cor_cleaning', type: 'select', label: 'Reinigingsregime van de kast', default: 'droog',

      help: 'Chloorhoudende reinigings- en desinfectiemiddelen veroorzaken spanningscorrosie in gewoon roestvast staal. Bij dat regime is 316L nodig, niet 304 — een verschil dat op de offerte klein lijkt en in de praktijk beslissend is.' },

      help: 'Explosieveiligheid kent twee onafhankelijke vragen: wat gaat er door de kast, en waar staat de kast. Een afzuiging van houtstof kan een zone in de luchtstroom hebben terwijl de opstellingsruimte zoneloos is — en omgekeerd.' },
    { id: 'atx_document', type: 'select', label: 'Is er een zoneringsplan of explosieveiligheidsdocument?', default: 'nog_bepalen', show: A => A.atx_relevant === 'ja',
      options: [{ v: 'ja', l: 'Ja — beschikbaar' }, { v: 'nog_bepalen', l: 'Nog op te maken' }, { v: 'nee', l: 'Nee' }],
      help: 'Zonder zoneringsdocument kan geen enkele fabrikant een conforme uitvoering aanbieden en kan niemand de conformiteit achteraf aantonen. Dit document is de verantwoordelijkheid van de werkgever of exploitant en hoort vóór de aanvraag te bestaan.' },
    { id: 'atx_zone_inside', type: 'select', label: 'Zone in de luchtstroom', default: 'geen', show: A => A.atx_relevant === 'ja',
      options: [{ v: 'geen', l: 'Geen zone' }, { v: 'z0', l: 'Zone 0 (gas, voortdurend)' }, { v: 'z1', l: 'Zone 1 (gas, incidenteel)' }, { v: 'z2', l: 'Zone 2 (gas, zelden en kortstondig)' }, { v: 'z20', l: 'Zone 20 (stof, voortdurend)' }, { v: 'z21', l: 'Zone 21 (stof, incidenteel)' }, { v: 'z22', l: 'Zone 22 (stof, zelden en kortstondig)' }],
      help: 'Bepaalt de apparaatcategorie van alles wat in de luchtstroom staat: waaier, motor, voelers, verwarmingselement en verlichting. Een zone binnenin sluit een elektrisch verwarmingselement en meestal ook warmteterugwinning met overdracht uit.' },
    { id: 'atx_zone_outside', type: 'select', label: 'Zone op de opstellingsplaats', default: 'geen', show: A => A.atx_relevant === 'ja',
      options: [{ v: 'geen', l: 'Geen zone' }, { v: 'z1', l: 'Zone 1' }, { v: 'z2', l: 'Zone 2' }, { v: 'z21', l: 'Zone 21' }, { v: 'z22', l: 'Zone 22' }],
      help: 'Bepaalt de uitvoering van de buitenkant: motoraansluitkast, werkschakelaar, bekabeling, regelkast. Vaak is de oplossing om de regelkast buiten de zone te plaatsen in plaats van hem in explosieveilige uitvoering te bestellen — dat is meestal goedkoper en altijd onderhoudsvriendelijker.' },
    { id: 'atx_substance', type: 'text', label: 'Stof of gas en de bepalende eigenschappen', show: A => A.atx_relevant === 'ja',
      help: 'Naam, onderste explosiegrens, en bij stof de minimale ontstekingstemperatuur van wolk én laag plus de Kst-waarde. Deze getallen bepalen de temperatuurklasse en de ontlastingsberekening; zonder die getallen wordt er gegokt.' },
    { id: 'atx_group', type: 'select', label: 'Explosiegroep', default: 'IIB', show: A => A.atx_relevant === 'ja',
      options: [{ v: 'IIA', l: 'IIA (gas)' }, { v: 'IIB', l: 'IIB (gas)' }, { v: 'IIC', l: 'IIC (gas — waterstof, acetyleen)' }, { v: 'IIIA', l: 'IIIA (brandbare vezels)' }, { v: 'IIIB', l: 'IIIB (niet-geleidend stof)' }, { v: 'IIIC', l: 'IIIC (geleidend stof)' }] },
    { id: 'atx_temp_class', type: 'select', label: 'Temperatuurklasse', default: 'T3', show: A => A.atx_relevant === 'ja',
      options: [{ v: 'T1', l: 'T1 (450 °C)' }, { v: 'T2', l: 'T2 (300 °C)' }, { v: 'T3', l: 'T3 (200 °C)' }, { v: 'T4', l: 'T4 (135 °C)' }, { v: 'T5', l: 'T5 (100 °C)' }, { v: 'T6', l: 'T6 (85 °C)' }],
      help: 'De maximale oppervlaktetemperatuur die het toestel mag bereiken, ook bij storing — denk aan een geblokkeerde waaier of een drooggelopen lager. Bij stof geldt bovendien de laagontstekingstemperatuur, die lager kan liggen dan de klasse doet vermoeden.' },
    { id: 'atx_fan', type: 'select', label: 'Uitvoering van de ventilator', default: 'standaard_fan', show: A => A.atx_relevant === 'ja',
      options: [{ v: 'standaard_fan', l: 'Standaarduitvoering' }, { v: 'vonkarm', l: 'Vonkarm volgens EN 14986' }, { v: 'buiten_zone', l: 'Ventilator buiten de zone geplaatst' }],
      help: 'Vonkarm betekent een gecontroleerde materiaalcombinatie tussen waaier, huis en inlaatring, plus voldoende spleetmaat en een geaarde as. Let op: een vonkarme waaier in een kunststof huis is niet vonkarm. De elegantste oplossing is vaak de ventilator buiten de zone brengen — bespreek dat vóór de selectie.' },
    { id: 'atx_antistatic', type: 'radio', label: 'Antistatische uitvoering van filters, afdichtingen en flexibele verbindingen?', options: YESNO, default: 'nee', show: A => A.atx_relevant === 'ja',
      help: 'Filtermedia en kunststof onderdelen laden statisch op en zijn dan zelf een ontstekingsbron. In een zone horen ze geleidend te zijn en doorverbonden met de aarding. Dit wordt bijna altijd vergeten omdat het filter als "passief" wordt gezien.' },
    { id: 'atx_earthing', type: 'radio', label: 'Equipotentiaalverbinding van alle geleidende delen?', options: YESNO, default: 'nee', show: A => A.atx_relevant === 'ja',
      help: 'Kast, kanalen, flexibele verbindingen, filterframes en de aspiratieleiding moeten doorverbonden en geaard zijn, met meetbare overgangsweerstand. Vraag dat op als opleveringspunt, niet als uitvoeringsdetail.' },
    { id: 'atx_decoupling', type: 'select', label: 'Explosieontkoppeling en drukontlasting in de aspiratie', default: 'nvt', show: A => A.atx_relevant === 'ja',
      options: [{ v: 'nvt', l: 'Niet van toepassing' }, { v: 'aanwezig', l: 'Aanwezig en berekend' }, { v: 'nog_bepalen', l: 'Nog te bepalen' }],
      help: 'Bij een stofafzuiging met filter of cycloon hoort ontlasting naar een veilige plaats en ontkoppeling zodat een explosie zich niet door de leiding voortplant naar de werkruimte. Dit staat los van de luchtgroep, maar de luchtbalans en de compensatielucht niet — geef beide samen op.' }
  ]
},
/* ==================================================================== */
{
  id: 'levering', title: 'Levering, hijsen en plaatsing',
  intro: 'Deze vragen gaan niet over de kast maar over de vraag of ze ooit op haar plaats komt. Ze worden bijna nooit gesteld bij de aanvraag en zijn de meest voorkomende reden dat een project vertraging oploopt of duurder wordt — nadat alles al besteld is. Een kast die niet geplaatst kan worden, is geen technisch probleem meer maar een bouwplaatsprobleem.',
  questions: [
    { id: 'lev_route', type: 'textarea', label: 'Aanvoerroute tot de eindpositie', help: 'Beschrijf de hele weg: straat, poort, binnenplaats, deuropeningen, gangen, trapgat, lift, dakluik. Meet de kleinste doorgang op, ga er niet van uit. Let ook op bochten: een sectie van 2,4 m gaat niet om een hoek van 1,5 m, ook al passen beide maten afzonderlijk.' },
    { id: 'lev_method', type: 'select', label: 'Wijze van plaatsen', default: 'kraan',
      options: [{ v: 'kraan', l: 'Mobiele kraan' }, { v: 'torenkraan', l: 'Torenkraan van de werf' }, { v: 'bouwlift', l: 'Bouwlift of goederenlift' }, { v: 'rollen', l: 'Rollen en vijzelen over de vloer' }, { v: 'handmatig', l: 'Handmatig, in delen' }, { v: 'onbekend', l: 'Nog niet bepaald' }],
      help: 'Bepaalt wie wat organiseert en wat het kost. Bij een torenkraan die nog op de werf staat is plaatsing bijna gratis; drie maanden later is dezelfde plaatsing een aparte kraandag met wegafsluiting. De volgorde van de werf is hier belangrijker dan de techniek.' },
    { id: 'lev_crane_space', type: 'select', label: 'Is er een opstelplaats voor de kraan?', default: 'onbekend',
      options: [{ v: 'ja', l: 'Ja, bevestigd' }, { v: 'krap', l: 'Krap — nog te onderzoeken' }, { v: 'nee', l: 'Nee' }, { v: 'onbekend', l: 'Nog niet nagegaan' }],
      help: 'Een mobiele kraan heeft vlakke, draagkrachtige ondergrond nodig voor de stempels, plus vrije ruimte eromheen. Kijk naar kelders en parkeerdekken onder het opstelvlak, naar rioolputten, naar bomen en naar bovengrondse leidingen. Dit is een vraag voor de aannemer, niet voor de fabrikant — maar u moet ze stellen.' },
    { id: 'lev_crane_radius', type: 'number', label: 'Benodigde vlucht (horizontale afstand kraan → eindpositie)', unit: 'm', show: A => ['kraan', 'torenkraan', 'onbekend'].includes(A.lev_method),
      help: 'Samen met het gewicht bepaalt de vlucht de kraanklasse, en die bepaalt de prijs. Het hijsvermogen daalt sterk met de afstand: dezelfde kraan die 8 ton hijst op 10 m, haalt op 30 m nog maar een fractie daarvan.' },
    { id: 'lev_crane_height', type: 'number', label: 'Hijshoogte tot het dakvlak', unit: 'm', show: A => ['kraan', 'torenkraan', 'onbekend'].includes(A.lev_method),
      help: 'Plus de hoogte van de collo zelf en van het hijsgereedschap. Vergeet niet dat er overheen gehesen moet worden, niet tot aan de rand.' },
    { id: 'lev_obstacles', type: 'textarea', label: 'Obstakels op de hijsbaan', help: 'Bovengrondse elektriciteitsleidingen, tramdraden, bomen, aangrenzende gebouwen, kraanoverzwaai boven openbaar domein of boven het buurperceel. Overzwaai buiten het eigen perceel vraagt toestemming en soms een verzekering.' },
    { id: 'lev_permit', type: 'select', label: 'Vergunning of wegafsluiting nodig voor de plaatsingsdag?', default: 'onbekend',
      options: [{ v: 'nee', l: 'Nee' }, { v: 'ja', l: 'Ja — aangevraagd' }, { v: 'ja_nog', l: 'Ja — nog aan te vragen' }, { v: 'onbekend', l: 'Nog niet nagegaan' }],
      help: 'Inname van de openbare weg, parkeerverbod, politietoelating. De aanvraagtermijn loopt in veel gemeenten op tot enkele weken en bepaalt dus mee de planning — niet de levertijd van de kast.' },
    { id: 'lev_lifting_points', type: 'radio', label: 'Hijsogen of hijsbalk meegeleverd, met hijsvoorschrift?', options: YESNO, default: 'ja',
      help: 'Vraag het hijsvoorschrift van de fabrikant op: aanslagpunten, toegestane hoek van de stroppen, zwaartepunt per sectie en of er een hijsbalk vereist is. Een kast die op de verkeerde punten wordt aangeslagen, vervormt en verliest haar lekdichtheidsklasse — onzichtbaar, tot de oplevering.' },
    { id: 'lev_section_weight_max', type: 'number', label: 'Maximaal toelaatbaar collogewicht', unit: 'kg',
      help: 'Volgt uit de kraan, de bouwlift of de vloer waarover gerold wordt. Geef de grens op, dan kan de fabrikant de opdeling in transportsecties daarop afstemmen in plaats van andersom.' },

    { id: 'lev_roof_structure', type: 'select', label: 'Type dakconstructie', default: 'onbekend', show: A => ['dak', 'buiten'].includes(A.cas_location),

      help: 'Bepaalt hoe de last verdeeld moet worden. Op een stalen dakplaat moet de kast altijd op de onderliggende liggers landen, nooit op het dek zelf; dat betekent dat de positie van de kast wordt bepaald door de constructie, niet door de kanaalaansluitingen.' },
    { id: 'lev_roof_confirmed', type: 'select', label: 'Is de draagkracht bevestigd door de constructeur?', default: 'nog_bepalen', show: A => ['dak', 'buiten'].includes(A.cas_location),

      help: 'De enige vraag in deze lijst met een echt veiligheidsrisico. Een stabiliteitsingenieur moet het bevestigen op basis van de werkelijke massa inclusief water, sneeuw en onderhoudslast — niet op basis van een catalogusgewicht. Bij renovatie is het oorspronkelijke ontwerp zelden op deze last berekend. Bestel niet vóór dit rond is.' },
    { id: 'lev_roof_area', type: 'number', label: 'Vrije dakoppervlakte op de beoogde plaats', unit: 'm²', show: A => ['dak', 'buiten'].includes(A.cas_location),
      help: 'De kast plus de vrije servicruimte rondom plus de ruimte om componenten uit te nemen. Reken op de kastafmeting plus ongeveer een kastbreedte aan de bedieningszijde.' },
    { id: 'lev_roof_occupied', type: 'textarea', label: 'Wat staat er al op het dak?', show: A => ['dak', 'buiten'].includes(A.cas_location),
      help: 'Andere units, koelmachines, dakramen, lichtstraten, zonnepanelen, valbeveiliging, rookluiken, antennes. Zonnepanelen zijn hier de nieuwe klassieker: het dak is vol, en verplaatsen kost meer dan de luchtgroep. Kijk ook naar schaduw en naar de afstand tot de uitblaas van bestaande installaties.' },
    { id: 'lev_base', type: 'select', label: 'Onderbouw', default: 'dakstoel', show: A => ['dak', 'buiten'].includes(A.cas_location),
      options: [{ v: 'dakstoel', l: 'Stalen dakstoel op de liggers' }, { v: 'sokkel', l: 'Betonsokkel' }, { v: 'tegels', l: 'Draagtegels / stelpoten' }, { v: 'nvt', l: 'Niet van toepassing' }],
      help: 'Ook: wie levert en wie plaatst ze? De onderbouw valt vaak tussen de aannemer, de dakdekker en de installateur in en blijkt dan door niemand geoffreerd. Voorzie voldoende hoogte boven het dakvlak voor waterafvoer, sneeuw en onderhoud onder de kast.' },
    { id: 'lev_roof_seal', type: 'select', label: 'Wie maakt en dicht de dakdoorvoeren af?', default: 'nog_bepalen', show: A => ['dak', 'buiten'].includes(A.cas_location),
      options: [{ v: 'dakdekker', l: 'Dakdekker' }, { v: 'installateur', l: 'Installateur' }, { v: 'aannemer', l: 'Hoofdaannemer' }, { v: 'nog_bepalen', l: 'Nog te bepalen' }],
      help: 'Kanaal-, leiding- en kabeldoorvoeren doorbreken de dakdichting en de dampremmende laag. Leg vast wie ze maakt, wie ze waterdicht afwerkt en hoe dat de dakgarantie beïnvloedt — die vervalt vaak wanneer een derde partij eraan werkt.' },
    { id: 'lev_wind', type: 'radio', label: 'Windverankering berekend en voorzien?', options: YESNO, default: 'nee', show: A => ['dak', 'buiten'].includes(A.cas_location),
      help: 'Een buitenkast is een groot vlak op een hoog punt. De verankering hoort berekend te worden op de plaatselijke windbelasting, en de krachten moeten in de constructie terechtkomen — niet in de dakbedekking.' },
    { id: 'lev_roof_access', type: 'select', label: 'Permanente toegang tot het dak en valbeveiliging', default: 'nog_bepalen', show: A => ['dak', 'buiten'].includes(A.cas_location),
      options: [{ v: 'ja', l: 'Vaste trap of ladder en collectieve beveiliging aanwezig' }, { v: 'deels', l: 'Deels — ankerpunten, persoonlijke beveiliging' }, { v: 'nee', l: 'Geen' }, { v: 'nog_bepalen', l: 'Nog te bepalen' }],
      help: 'Zonder veilige en gemakkelijke toegang worden filters niet vervangen en wordt onderhoud uitgesteld. Dit is geen formaliteit: het bepaalt of de installatie na drie jaar nog levert wat ze belooft. Vraag ook hoe zwaar materiaal naar boven komt.' },

    { id: 'lev_replacement', type: 'radio', label: 'Is vervanging van de grootste component later nog mogelijk?', options: YESNO, default: 'ja',

    { id: 'lev_storage', type: 'select', label: 'Tijdelijke opslag op de werf mogelijk?', default: 'onbekend',

      help: 'Kan de kast niet meteen geplaatst worden, dan moet ze droog en beveiligd staan. Een kast die weken in de regen staat, begint haar leven met vocht in de isolatie en corrosie in de batterijen. Bij "nee" moet de levering exact op de plaatsingsdag vallen, en dat maakt de planning strak.' },

    { id: 'sec_silencer_sup', type: 'radio', label: 'Geluiddemper toevoerzijde?', options: YESNO, default: 'ja', help: 'Reken erop dat een demper 0,9 tot 1,5 m kastlengte kost. Wie hem vergeet, ontdekt het pas na oplevering — en dan is er geen ruimte meer.' },

    { id: 'sec_inspection', type: 'radio', label: 'Inspectieramen en binnenverlichting?', options: YESNO, default: 'ja', help: 'Verplicht bij hygiënische uitvoering en in de praktijk de enige manier om vervuiling op te merken vóór ze een probleem is.' },
    { id: 'sec_measure', type: 'radio', label: 'Debietmeting in de ventilatorinlaat?', options: YESNO, default: 'ja', help: 'Maakt inregelen, bewaken en rapporteren mogelijk zonder losse meetapparatuur. Vraag naar de opgegeven meetnauwkeurigheid over het hele regelbereik, niet alleen bij nominaal debiet.' },
    { id: 'sec_fire_damper', type: 'radio', label: 'Brandkleppen in of aan de kast?', options: YESNO, default: 'nee', help: 'Positie, aansturing en terugmelding vastleggen. Vraag ook wie de brandkleppen periodiek test en hoe ze bereikbaar zijn.' },
    { id: 'sec_empty', type: 'number', label: 'Aantal lege secties', unit: 'st', default: 0, help: 'Voor toekomstige uitbreiding of voor stromingsstabilisatie vóór een batterij of meetsectie. Goedkoop nu, onmogelijk later.' },
    { id: 'sec_flex', type: 'radio', label: 'Flexibele kanaalaansluitingen meeleveren?', options: YESNO, default: 'ja', help: 'Voorkomt overdracht van trillingen naar het kanaalnet.' },
    { id: 'sec_siphon', type: 'radio', label: 'Sifons meeleveren en op maat berekend?', options: YESNO, default: 'ja', help: 'De sifonhoogte moet passen bij de druk op die plaats in de kast. Aan de zuigzijde is een te lage sifon de standaardoorzaak van water in de kast en van luchtaanzuiging via de afvoer. Vraag om berekende sifons, niet om standaardsifons.' }
  ]
},

/* =====================================================================
   MODULEREEKS EN REGELWERK — taalonafhankelijk
   De regels geven alleen een id, een niveau en de variabelen terug.
   Alle prozateksten staan in de taalbestanden, zodat één regel in zes
   talen hetzelfde gedrag houdt.
   ===================================================================== */

const CHAIN = (() => {
  const LEVEL = { blok: 3, waarschuwing: 2, advies: 1 };

  /* Modulefamilies → kleurslot (zie palet). De volgorde van de families
     volgt de volgorde in de kast, zodat naast elkaar liggende modules
     altijd twee gevalideerd onderscheidbare tinten krijgen. */
  const FAMILY = {
    kleppen: 'neutraal', mengsectie: 'neutraal', geluiddemper: 'neutraal',
    meetsectie: 'neutraal', lege_sectie: 'neutraal',
    voorfilter: 'filtratie', eindfilter: 'filtratie', koolstoffilter: 'filtratie', hepa: 'filtratie',
    plaat_kruis: 'terugwinning', plaat_tegenstroom: 'terugwinning', rotor_cond: 'terugwinning',
    rotor_sorptie: 'terugwinning', twincoil: 'terugwinning', warmtepijp: 'terugwinning',
    koeler: 'koeling',
    voorverwarmer: 'verwarming', verwarmer: 'verwarming', naverwarmer: 'verwarming',
    bevochtiger: 'bevochtiging',
    ventilator: 'ventilator'
  };

  function chain(A, calc) {
    const sup = [], ext = [];
    const wtw = A.wtw_type || 'plaat_tegenstroom';
    const wtwActive = A.wtw_needed !== 'nee' && wtw !== 'geen';
    const recirc = A.sec_mixing === 'ja';
    const dx = A.bat_cool_medium === 'dx' || A.bat_heat_medium === 'wp_condensor';
    const P = (key, side, spec) => ({ key, side, spec, family: FAMILY[key] || 'neutraal' });

    sup.push(P('kleppen', 'toevoer', 'buiten'));
    if (recirc) sup.push(P('mengsectie', 'toevoer'));
    if (A.flt_sup_pre && A.flt_sup_pre !== 'geen') sup.push(P('voorfilter', 'toevoer', A.flt_sup_pre));
    if (calc && calc.recovery && calc.recovery.preheatDeltaT > 0 && (A.wtw_frost || 'voorverwarming') === 'voorverwarming')
      sup.push(P('voorverwarmer', 'toevoer'));
    if (wtwActive) sup.push(P(wtw, 'toevoer', wtw));
    if (A.bat_cool_medium && A.bat_cool_medium !== 'geen' && A.air_cool !== 'nee')
      sup.push(P('koeler', 'toevoer', A.bat_cool_medium));
    if (A.air_heat !== 'nee' && A.bat_heat_medium !== 'geen')
      sup.push(P('verwarmer', 'toevoer', A.bat_heat_medium));
    if (A.air_humid && A.air_humid !== 'nee') sup.push(P('bevochtiger', 'toevoer', A.air_humid));
    sup.push(P('ventilator', 'toevoer', A.fan_type));
    if (A.air_reheat === 'ja') sup.push(P('naverwarmer', 'toevoer'));
    if (A.flt_sup_fin && A.flt_sup_fin !== 'geen') sup.push(P('eindfilter', 'toevoer', A.flt_sup_fin));
    if (A.flt_carbon === 'ja') sup.push(P('koolstoffilter', 'toevoer'));
    if (A.flt_hepa && A.flt_hepa !== 'nee') sup.push(P('hepa', 'toevoer', A.flt_hepa));
    if (A.sec_silencer_sup !== 'nee') sup.push(P('geluiddemper', 'toevoer'));
    if (A.sec_measure !== 'nee') sup.push(P('meetsectie', 'toevoer'));
    for (let i = 0; i < (parseInt(A.sec_empty) || 0); i++) sup.push(P('lege_sectie', 'toevoer'));

    if (A.flt_ext && A.flt_ext !== 'geen') ext.push(P('voorfilter', 'afvoer', A.flt_ext));
    if (wtwActive) ext.push(P(wtw, 'afvoer', wtw));
    if (A.bat_wp_integrated === 'wtw_wp') ext.push(P('koeler', 'afvoer', 'wp'));
    ext.push(P('ventilator', 'afvoer', A.fan_type));
    if (A.sec_silencer_ext !== 'nee') ext.push(P('geluiddemper', 'afvoer'));
    ext.push(P('kleppen', 'afvoer', 'uitblaas'));

    return { supply: sup, extract: ext, all: sup.concat(ext), dx, recirc, wtwActive, wtw };
  }

  /* =================================================================== */
  function checkRules(A, R) {
    const out = [];
    const n = x => parseFloat(String(x ?? '').replace(',', '.'));
    const add = (level, id, vars) => out.push({ level, id, vars: vars || {} });
    const prof = (R.profile && R.profile.flags) || {};
    const wtw = A.wtw_type || 'geen';
    const isRotor = String(wtw).startsWith('rotor');
    const isPlate = String(wtw).startsWith('plaat');
    const seq = A.ctl_sequences || [];

    /* 1 — overdracht en recirculatie */
    if (isRotor && (A.wtw_crosscontam === 'verboden' || prof.crossContam === 'verboden'))
      add('blok', 'rotor_verboden');
    if (isRotor && A.wtw_purge === 'nee') add('waarschuwing', 'rotor_geen_spoel');
    if (A.sec_mixing === 'ja' && prof.recirc === 'verboden') add('blok', 'recirc_verboden');
    if (A.sec_mixing === 'ja' && prof.recirc === 'beperkt') add('waarschuwing', 'recirc_beperkt');
    if (A.wtw_crosscontam === 'verboden' && wtw === 'twincoil')
      add('advies', 'twincoil_goed');

    /* 2 — energie en Ecodesign */
    if (R.recovery.active && R.recovery.erpMin && R.recovery.eta < R.recovery.erpMin)
      add('blok', 'erp_rendement', { eta: R.recovery.eta, min: R.recovery.erpMin });
    if (A.prj_epb === 'ja' && A.wtw_needed === 'nee') add('blok', 'epb_geen_wtw');
    if (R.fans.sfp > R.fans.sfpLimit)
      add('waarschuwing', 'sfp_te_hoog', { sfp: Math.round(R.fans.sfp), limit: Math.round(R.fans.sfpLimit) });
    if (R.geometry.faceVelocity > R.geometry.dropletLimit)
      add('waarschuwing', 'frontsnelheid', { v: R.geometry.faceVelocity.toFixed(2), limit: R.geometry.dropletLimit });
    if (R.geometry.faceVelocity < 1.2 && R.flow.supply > 0)
      add('advies', 'frontsnelheid_laag', { v: R.geometry.faceVelocity.toFixed(2) });

    /* 3 — vorst en winterbedrijf */
    if (R.recovery.frostRisk && A.wtw_frost === 'geen')
      add('blok', 'vorst_geen_beveiliging', { oda: A.cnd_oda_t_w, eha: R.recovery.exhaustOut.toFixed(1) });
    if (R.recovery.frostRisk && A.wtw_frost === 'debiet') add('waarschuwing', 'vorst_debiet');
    if (R.recovery.frostRisk && A.wtw_frost === 'voorverwarming')
      add('advies', 'vorst_voorverwarming', { dt: R.recovery.preheatDeltaT.toFixed(1), kw: R.coils.preheat.toFixed(1) });
    if (isPlate && A.wtw_condensate === 'nee') add('waarschuwing', 'condens_plaat');
    if (A.sec_damper_actuator === 'zonder' && ['water', 'glycol', 'stoom'].includes(A.bat_heat_medium) && n(A.cnd_oda_t_w) < 2)
      add('waarschuwing', 'klep_veerretour');

    /* 4 — vocht */
    if (A.air_dehum === 'ja' && ['koudwater', 'glycol_koud'].includes(A.bat_cool_medium) && n(A.bat_cool_tin) > 9)
      add('waarschuwing', 'koudwater_te_warm', { t: A.bat_cool_tin });
    if (R.coils.dehumidifying && A.air_reheat !== 'ja' && A.cnd_rh_control === 'volledig')
      add('waarschuwing', 'geen_naverwarming');
    if (['adiabatisch', 'hogedruk'].includes(A.air_humid)) add('advies', 'bevochtiging_hygiene');
    if (A.cnd_dewpoint_target !== undefined && A.cnd_dewpoint_target !== '' &&
      n(A.cnd_dewpoint_target) < -10 && !String(wtw).includes('sorptie') && A.air_dehum === 'ja')
      add('blok', 'adsorptie_nodig', { td: A.cnd_dewpoint_target });

    /* 5 — kast */
    if (['buiten', 'dak'].includes(A.cas_location) && ['T3', 'T4'].includes(A.cas_class_t))
      add('waarschuwing', 'kast_isolatie');
    if (['TB3', 'TB4'].includes(A.cas_class_tb) && (R.coils.dehumidifying || ['buiten', 'dak'].includes(A.cas_location)))
      add('waarschuwing', 'thermische_brug');
    if (A.cas_hygiene !== 'geen' && A.cas_class_l === 'L3') add('blok', 'hygiene_lekkage');
    if (A.cnd_coastal === 'ja' && ['standaard', 'gecoat'].includes(A.cas_corrosion))
      add('waarschuwing', 'kust_corrosie');
    if (A.prj_profile === 'zwembad' && !['zwembad', 'RVS'].includes(A.cas_corrosion))
      add('blok', 'zwembad_materiaal');
    if (R.geometry.maxSection > 0 && R.geometry.sections > 1)
      add('advies', 'transport_secties', { len: R.geometry.overallL.toFixed(1), max: R.geometry.maxSection, n: R.geometry.sections });
    if (A.cas_door_w && n(A.cas_door_w) > 0 && n(A.cas_door_w) < Math.min(R.geometry.sectionW, R.geometry.sectionH))
      add('blok', 'transport_doorgang', { w: R.geometry.sectionW.toFixed(2), h: R.geometry.sectionH.toFixed(2), door: A.cas_door_w });
    if (A.cas_floor_load && n(A.cas_floor_load) > 0 && R.geometry.footprint > 0) {
      const load = R.geometry.mass / R.geometry.footprint;
      if (load > n(A.cas_floor_load)) add('waarschuwing', 'vloerbelasting', { load: Math.round(load), max: A.cas_floor_load });
    }

    const opDakVoor = (a) => ['dak', 'buiten'].includes(a.cas_location);

    /* 5a — omgeving en inplanting */
    const bron = A.omg_sources || [];
    const CORR = ['C1', 'C2', 'C3', 'C4', 'C5', 'CX'];
    const corrIdx = CORR.indexOf(A.cor_atmosphere || 'C3');
    if (bron.includes('koeltoren')) add('blok', 'koeltoren_inlaat');
    if (n(A.omg_exhaust_dist) > 0 && n(A.omg_exhaust_dist) < 6)
      add('waarschuwing', 'kortsluiting_inlaat', { d: A.omg_exhaust_dist });
    if (!A.omg_exhaust_dist && !A.omg_intake_pos) add('advies', 'inlaat_onbepaald');
    if (A.omg_wind === 'ongunstig' && bron.length && !bron.includes('geen'))
      add('waarschuwing', 'benedenwinds');
    if (bron.includes('spoor')) add('waarschuwing', 'spoor_nabij', { d: A.omg_rail_dist || '—' });
    if (bron.includes('verkeer') && A.cnd_oda_class !== 'ODA3') add('advies', 'verkeer_oda');
    if ((bron.includes('keuken') || bron.includes('generator') || bron.includes('schoorsteen') ||
      bron.includes('zuivering') || bron.includes('afval')) && A.flt_carbon !== 'ja')
      add('advies', 'geurbron_zonder_gasfilter');
    if (A.omg_hv && A.omg_hv !== 'nee') add('waarschuwing', 'hoogspanning', { type: A.omg_hv });
    if (A.omg_airport === 'ja' && ['kraan', 'torenkraan', 'onbekend'].includes(A.lev_method))
      add('advies', 'luchthaven_kraanhoogte');
    if (A.omg_flood === 'ja' && !['dak', 'plafond'].includes(A.cas_location))
      add('waarschuwing', 'overstroming');
    if (A.omg_snow === 'ja') add('advies', 'sneeuw_roosters');
    if (opDakVoor(A) && A.omg_lightning === 'nee') add('advies', 'geen_bliksem');
    if (bron.includes('bouwwerf') && !A.omg_phasing) add('advies', 'bouwfase_filters');

    /* 5c — corrosie en materialen */
    const agg = A.cor_airstream || [];
    const heeft = (...k) => k.some(x => agg.includes(x));
    if (corrIdx >= 4 && ['verzinkt', 'aluzink'].includes(A.cor_casing_material))
      add('blok', 'mantel_te_licht', { cat: A.cor_atmosphere });
    if (corrIdx >= 3 && A.cor_coil_material === 'alu_cu')
      add('waarschuwing', 'batterij_onbeschermd', { cat: A.cor_atmosphere });
    if (heeft('chloor', 'ammoniak', 'zuren', 'alkali', 'chloriden') && A.cor_coil_material === 'alu_cu')
      add('blok', 'lamel_niet_bestand');
    if (heeft('ammoniak', 'h2s') && ['alu_cu', 'cu_cu', 'dipcoat'].includes(A.cor_coil_material))
      add('waarschuwing', 'koper_ammoniak');
    if ((A.cor_cleaning === 'desinfectie' || heeft('chloor', 'chloriden')) &&
      ['rvs304'].includes(A.cor_casing_material))
      add('waarschuwing', 'rvs304_chloride');
    if (corrIdx >= 3 && A.cor_fasteners !== 'a4') add('waarschuwing', 'bevestiging_a4', { cat: A.cor_atmosphere });
    if (A.cor_deicing === 'ja' && corrIdx < 3) add('advies', 'strooizout');
    if (heeft('condensaat', 'chloor', 'chloriden', 'vet') && A.cor_tray === 'verzinkt')
      add('waarschuwing', 'condensbak_verzinkt');
    if (heeft('stof_abrasief') && String(A.wtw_type || '').startsWith('rotor'))
      add('waarschuwing', 'abrasief_rotor');
    if (A.cnd_coastal === 'ja' && corrIdx < 3) add('waarschuwing', 'kust_categorie');

    /* 5d — explosieveiligheid */
    const zi = A.atx_zone_inside, zo = A.atx_zone_outside;
    const zoneBinnen = A.atx_relevant === 'ja' && zi && zi !== 'geen';
    const zoneBuiten = A.atx_relevant === 'ja' && zo && zo !== 'geen';
    if (A.nrm_atex === 'ja' && A.atx_relevant !== 'ja') add('waarschuwing', 'atex_inconsistent');
    if (A.atx_relevant === 'ja' && A.atx_document !== 'ja') add('blok', 'geen_zoneringsdocument');
    if (zoneBinnen && A.atx_fan === 'standaard_fan') add('blok', 'ventilator_niet_atex', { zone: zi });
    if (zoneBinnen && A.atx_antistatic !== 'ja') add('blok', 'filter_statisch');
    if ((zoneBinnen || zoneBuiten) && A.atx_earthing !== 'ja') add('waarschuwing', 'geen_equipotentiaal');
    if (zoneBinnen && A.bat_heat_medium === 'elektrisch') add('blok', 'elektrische_batterij_zone');
    if (zoneBinnen && String(A.wtw_type || '').startsWith('rotor')) add('waarschuwing', 'rotor_in_zone');
    if (zoneBinnen && !A.atx_substance) add('waarschuwing', 'stofgegevens_ontbreken');
    if (zoneBinnen && A.atx_decoupling === 'nog_bepalen') add('waarschuwing', 'geen_ontkoppeling');
    if (zi === 'z0' || zi === 'z20') add('waarschuwing', 'zone_0_20');

    /* 5b — levering, hijsen en plaatsing */
    const opDak = opDakVoor(A);
    if (opDak && A.lev_roof_confirmed !== 'ja')
      add('blok', 'dak_niet_bevestigd', { massa: R.geometry.mass, opp: R.geometry.footprint.toFixed(1) });
    if (['kraan', 'torenkraan'].includes(A.lev_method) && ['nee', 'onbekend'].includes(A.lev_crane_space))
      add('waarschuwing', 'geen_kraanplaats');
    if (A.lev_method === 'onbekend') add('waarschuwing', 'plaatsing_onbepaald');
    if (n(A.lev_section_weight_max) > 0 && R.geometry.sectionMass > n(A.lev_section_weight_max))
      add('blok', 'collo_te_zwaar', { collo: R.geometry.sectionMass, max: A.lev_section_weight_max });
    if (opDak && n(A.lev_roof_area) > 0 && R.geometry.areaNeeded > n(A.lev_roof_area))
      add('waarschuwing', 'dak_te_klein', { nodig: R.geometry.areaNeeded.toFixed(1), vrij: A.lev_roof_area });
    if (opDak && A.lev_roof_structure === 'houten' && R.geometry.mass > 800)
      add('waarschuwing', 'houten_dak');
    if (A.lev_lifting_points === 'nee') add('advies', 'geen_hijsogen');
    if (opDak && A.lev_wind === 'nee') add('waarschuwing', 'geen_windverankering');
    if (opDak && ['nee', 'nog_bepalen'].includes(A.lev_roof_access))
      add('waarschuwing', 'dak_geen_toegang');
    if (opDak && A.lev_roof_seal === 'nog_bepalen') add('advies', 'doorvoeren_onbepaald');
    if (['ja_nog', 'onbekend'].includes(A.lev_permit)) add('advies', 'vergunning_hijsdag');
    if (A.lev_storage === 'nee') add('advies', 'geen_opslag');
    if (A.lev_replacement === 'nee') add('advies', 'geen_vervangingsroute');
    if (!A.lev_route && (opDak || R.geometry.sections > 1)) add('advies', 'route_onbekend');

    /* 6 — koudemiddel en veiligheid */
    if (R.chainInfo.dx && ['R32', 'R454B', 'R1234ze'].includes(A.bat_cool_refr))
      add('waarschuwing', 'a2l', { refr: A.bat_cool_refr });
    if (R.chainInfo.dx && A.bat_cool_refr === 'R290') add('blok', 'a3');
    if (A.nrm_atex === 'ja') add('advies', 'atex_ventilator');

    /* 7 — filtratie */
    const order = ['geen', 'coarse', 'vetfilter', 'ePM10_50', 'ePM10_60', 'ePM10_70',
      'ePM2_5_50', 'ePM2_5_65', 'ePM1_50', 'ePM1_60', 'ePM1_70', 'ePM1_80'];
    if (A.cnd_oda_class === 'ODA3' && order.indexOf(A.flt_sup_fin) < order.indexOf('ePM1_70'))
      add('waarschuwing', 'filter_oda3');
    if (String(A.flt_sup_fin || '').startsWith('ePM1') && A.flt_sup_pre === 'geen')
      add('advies', 'geen_voorfilter');
    if (A.flt_hepa && A.flt_hepa !== 'nee' && A.cas_class_f === 'geen_eis') add('blok', 'hepa_bypass');
    if (A.flt_carbon === 'ja') add('advies', 'koolstof_contacttijd');

    /* 8 — regeling en oplevering */
    if (A.ctl_supplier === 'gemengd') add('advies', 'regeling_gemengd');
    if (!seq.includes('vorst') && ['water', 'glycol', 'stoom'].includes(A.bat_heat_medium))
      add('waarschuwing', 'geen_vorstsequentie');
    if (A.ctl_fire_mode === 'ja' && !seq.includes('brandstand')) add('waarschuwing', 'brandstand_inconsistent');
    if (A.com_balancing === 'nee') add('advies', 'geen_meetrapport');
    if (!(n(A.fan_esp_sup) > 0)) add('blok', 'geen_externe_druk');
    if (!(R.flow.supply > 0)) add('blok', 'geen_debiet');
    if (A.sec_siphon === 'nee' && (R.coils.dehumidifying || isPlate)) add('waarschuwing', 'geen_sifon');
    if (A.flw_variable && A.flw_variable !== 'nee' && n(A.flw_min_pct) < 30)
      add('waarschuwing', 'turndown', { pct: A.flw_min_pct });
    if (A.flw_balance !== 'gebalanceerd' && !seq.includes('drukcascade')) add('advies', 'drukcascade_bewaking');
    if (A.acu_room_limit && n(A.acu_room_limit) <= 32 && A.sec_silencer_sup === 'nee')
      add('waarschuwing', 'akoestiek_geen_demper', { db: A.acu_room_limit });
    if (A.acu_octave === 'nee') add('advies', 'geen_octaafband');

    /* 9 — profielaandachtspunt */
    if (R.profile) add('advies', 'profiel_note', { profiel: R.profile.id });

    const seen = new Set();
    return out.filter(r => (seen.has(r.id) ? false : seen.add(r.id)))
      .sort((a, b) => LEVEL[b.level] - LEVEL[a.level]);
  }

  /* =================================================================== */
  /* Onderbouwing per module — vars only, prozateksten in de taallaag    */
  function motivations(A, R) {
    const m = [];
    const put = (key, vars) => m.push({ key, vars: vars || {} });
    const f1 = x => (Number.isFinite(x) ? x.toFixed(1) : '—');
    const f2 = x => (Number.isFinite(x) ? x.toFixed(2) : '—');

    put('klep', { klasse: A.sec_damper_class, aandrijving: A.sec_damper_actuator });
    if (R.chainInfo.recirc) put('mengsectie', { pct: A.sec_mixing_pct || 0 });
    if (A.flt_sup_pre && A.flt_sup_pre !== 'geen')
      put('voorfilter', { klasse: A.flt_sup_pre, oda: A.cnd_oda_class });
    if (R.recovery.preheatDeltaT > 0 && (A.wtw_frost || 'voorverwarming') === 'voorverwarming')
      put('voorverwarmer', { oda: A.cnd_oda_t_w, dt: f1(R.recovery.preheatDeltaT), kw: f1(R.coils.preheat) });
    if (R.chainInfo.wtwActive)
      put('wtw', {
        type: R.chainInfo.wtw, overdracht: A.wtw_crosscontam || 'beperkt',
        eta: R.recovery.eta, etax: R.recovery.etaX || 0,
        erp: R.recovery.erpMin || '—', kwh: Math.round(R.energy.recoverySaving)
      });
    if (A.bat_cool_medium && A.bat_cool_medium !== 'geen' && A.air_cool !== 'nee')
      put(R.coils.dehumidifying ? 'koeler_nat' : 'koeler_droog', {
        kw: f1(R.coils.cooling), kws: f1(R.coils.coolSens), kwl: f1(R.coils.coolLat),
        cond: f1(R.coils.condensate), tin: A.bat_cool_tin, tout: A.bat_cool_tout,
        v: f2(R.geometry.faceVelocity)
      });
    if (A.air_heat !== 'nee' && A.bat_heat_medium !== 'geen')
      put('verwarmer', { kw: f1(R.coils.heating), tin: A.bat_heat_tin, tout: A.bat_heat_tout, medium: A.bat_heat_medium });
    if (A.air_humid && A.air_humid !== 'nee')
      put('bevochtiger', { rh: A.cnd_ida_rh_min, kg: f1(R.coils.humidWater), kw: f1(R.coils.humidPower), type: A.air_humid });
    put('ventilator', {
      type: A.fan_type, kw: f1(R.fans.powerTotal), sfp: Math.round(R.fans.sfp),
      dp: Math.round(R.fans.dpTotalSup), esp: Math.round(R.fans.espSup)
    });
    if (A.air_reheat === 'ja') put('naverwarmer', { kw: f1(R.coils.reheat) });
    if (A.flt_sup_fin && A.flt_sup_fin !== 'geen')
      put('eindfilter', { klasse: A.flt_sup_fin, dp: A.flt_dp_final || 200 });
    if (A.flt_hepa && A.flt_hepa !== 'nee') put('hepa', { klasse: A.flt_hepa });
    if (A.sec_silencer_sup !== 'nee' || A.sec_silencer_ext !== 'nee')
      put('demper', { db: A.acu_room_limit || '—' });
    put('kast', {
      opstelling: A.cas_location, d: A.cas_class_d, l: A.cas_class_l, f: A.cas_class_f,
      t: A.cas_class_t, tb: A.cas_class_tb, corrosie: A.cas_corrosion,
      w: f2(R.geometry.overallW), h: f2(R.geometry.overallH), len: f1(R.geometry.overallL),
      massa: R.geometry.mass
    });
    return m;
  }

  return { chain, checkRules, motivations, FAMILY, LEVEL };
})();

    condens_plaat: { t: 'Geen condensafvoer bij een plaatwisselaar', d: 'Aan de afvoerzijde van een plaatwisselaar condenseert in de winter een aanzienlijke hoeveelheid water. Zonder opvangbak met afschot en een correct berekende sifon loopt dat water in de kast.', r: '—' },
    klep_veerretour: { t: 'Kleppen zonder veerretour bij een waterbatterij', d: 'Valt de voeding weg terwijl het buiten vriest, dan blijven de buitenluchtkleppen open staan en bevriest de verwarmingsbatterij. Veerretour naar de gesloten stand is hier een veiligheidseis, geen comfortoptie.', r: '—' },

    koudwater_te_warm: { t: 'Koelwatertemperatuur te hoog om te ontvochtigen', d: 'Met een aanvoertemperatuur van {t} °C blijft de oppervlaktetemperatuur van de batterij boven het dauwpunt van de lucht en vindt er nauwelijks ontvochtiging plaats. Voor werkelijke ontvochtiging is 6–8 °C nodig. Dit is een keuze op systeemniveau: hogetemperatuurkoeling en diepe ontvochtiging gaan niet samen.', r: 'Psychrometrie — apparaatdauwpunt' },
    geen_naverwarming: { t: 'Volledige vochtregeling zonder naverwarming', d: 'Om te ontvochtigen moet de lucht onder het dauwpunt gekoeld worden; daarna is ze te koud om in te blazen. Zonder naverwarming is een RV-band niet te halen. Onderzoek of de naverwarming uit teruggewonnen condensorwarmte kan komen in plaats van uit de opwekking.', r: '—' },
    bevochtiging_hygiene: { t: 'Waterbehandeling bij adiabatische bevochtiging', d: 'Verdampings- en vernevelingssystemen vragen een beheersplan: waterkwaliteit, doorspoeling, drogloopregime bij stilstand en periodieke controle. Leg dat vast in de uitvraag en in het onderhoudscontract, samen met de verantwoordelijkheid ervoor.', r: 'VDI 6022; nationale legionellawetgeving' },
    adsorptie_nodig: { t: 'Adsorptiedroging vereist', d: 'Een dauwpunt van {td} °C is met koeldroging fysisch niet haalbaar. Onder ongeveer −10 °C is een adsorptiedroger met regeneratie de enige werkende oplossing; bij batterijproductie werkt die in een gesloten droge kring.', r: 'HIT 4A.16 — dryroom' },

    kast_isolatie: { t: 'Kastisolatie te licht voor buitenopstelling', d: 'Bij buitenopstelling geeft klasse T3 of T4 forse warmteverliezen en condensatie op de mantel. Vraag minimaal T2, en bij een koud klimaat T1.', r: 'EN 1886' },
    thermische_brug: { t: 'Thermische brugklasse te laag', d: 'Bij gekoelde of ontvochtigde lucht — en bij buitenopstelling in de winter — slaat condens neer op profielen, scharnieren en boutverbindingen wanneer de brugklasse te laag is. Vraag TB2 of beter. Dit is niet zichtbaar op de offerte en wél in het tweede bedrijfsjaar.', r: 'EN 1886' },
    hygiene_lekkage: { t: 'Hygiënische uitvoering met te lage lekdichtheid', d: 'Een hygiënische kast met lekkageklasse L3 is een tegenspraak: ongefilterde lucht komt via de lekken binnen en omzeilt daarmee de filtratie. Vraag L1.', r: 'EN 1886; VDI 6022' },
    kust_corrosie: { t: 'Kustligging zonder aangepaste corrosie-uitvoering', d: 'Zout aerosol tast onbehandeld aluminium en verzinkte plaat binnen enkele jaren aan, te beginnen bij de batterijlamellen en de condensbakken. Vraag een kustuitvoering en let daarbij expliciet op de lamellen, niet alleen op de mantel.', r: '—' },
    zwembad_materiaal: { t: 'Zwembadlucht vraagt een chloorbestendige uitvoering', d: 'Chlooramines tasten aluminium, verzinkt staal en veel coatings snel aan. Vraag een uitdrukkelijk voor zwembadlucht vrijgegeven uitvoering, inclusief de batterijen, de condensbakken en het bevestigingsmateriaal.', r: 'VDI 2089' },
    transport_secties: { t: 'Kast wordt in delen geleverd', d: 'De geraamde lengte van {len} m wordt bij een maximale sectielengte van {max} m geleverd in ongeveer {n} delen. Leg vast wie de koppelingen maakt en afdicht, en hoe de lekdichtheidsklasse na montage wordt aangetoond.', r: 'EN 1886' },
    transport_doorgang: { t: 'Kast past niet door de aanvoerweg', d: 'Eén transportsectie meet naar raming {w} × {h} m, terwijl de kleinste doorgang {door} m is. De kast moet verder worden opgedeeld of anders worden geconfigureerd — hoger en smaller, of in losse secties met montage ter plaatse. Los dit op vóór de bestelling, niet op de bouwplaats.', r: '—' },
    vloerbelasting: { t: 'Vloerbelasting mogelijk overschreden', d: 'De geraamde belasting is ongeveer {load} kg/m² tegenover een toelaatbare {max} kg/m². Voorzie een lastverdelende constructie of laat de draagkracht controleren.', r: '—' },

    koeltoren_inlaat: { t: 'Koeltoren in de omgeving van de buitenluchtinlaat', d: 'Een koeltoren of verdampingscondensor verspreidt waterdruppels die legionella kunnen bevatten. Dat is geen filterkwestie: aerosolen van die grootte passeren elk luchtfilter dat u redelijkerwijs plaatst. Verplaats de inlaat, of leg schriftelijk vast op welke afstand en in welke richting hij komt ten opzichte van de pluim. Dit is de goedkoopste ingreep van het hele project zolang het op papier gebeurt.', r: 'Nationale legionellawetgeving; EN 16798-3' },
    kortsluiting_inlaat: { t: 'Inlaat en uitblaas te dicht bij elkaar', d: 'Op {d} m zuigt de installatie een deel van haar eigen afvoerlucht terug aan. Het rendement van de warmteterugwinning lijkt dan uitstekend terwijl er in werkelijkheid te weinig verse lucht binnenkomt — en dat is precies wat u niet meet. Vergroot de afstand of blaas verticaal en ongehinderd naar boven uit.', r: 'EN 16798-3' },
    inlaat_onbepaald: { t: 'Plaats van de buitenluchtinlaat nog niet vastgelegd', d: 'De plaats van de inlaat bepaalt de luchtkwaliteit sterker dan de filterklasse. Leg hoogte, gevel en oriëntatie vast en toets ze aan de uitstootbronnen in de omgeving, vóór de kanaaltracés getekend worden.', r: 'EN 16798-3' },
    benedenwinds: { t: 'Inlaat benedenwinds van een uitstootbron', d: 'De overheersende wind draagt de aangevinkte bronnen het hele jaar naar de inlaat. Verplaats de inlaat naar de andere gevel of naar een hoger punt; dat werkt beter en is goedkoper dan een filterklasse hoger.', r: 'EN 16798-3' },
    spoor_nabij: { t: 'Spoorweg of tramlijn nabij ({d} m)', d: 'Twee onafhankelijke gevolgen. Remstof bestaat uit fijne ijzerdeeltjes en verhoogt de fijnstofbelasting op de inlaat aanzienlijk — reken op een zwaardere eindfiltratie. En trillingen komen via de constructie binnen; die worden niet opgelost door de luchtgroep maar door de opstelling, en ze bepalen soms of de kast op dat punt mag staan.', r: '—' },
    verkeer_oda: { t: 'Drukke verkeersader maar buitenluchtkwaliteit niet als ODA 3 opgegeven', d: 'Langs een drukke weg is ODA 3 realistisch. Herzie de klasse of onderbouw waarom ODA 2 volstaat; de filterkeuze hangt er rechtstreeks van af.', r: 'EN 16798-3' },
    geurbron_zonder_gasfilter: { t: 'Geur- of gasbron nabij zonder gasfasefiltratie', d: 'Deeltjesfilters houden geen gassen of geuren tegen. Overweeg gasfasefiltratie, of — beter en goedkoper — verplaats de inlaat weg van de bron. Vraag bij een koolstoffilter altijd naar de berekende standtijd bij de werkelijke concentratie.', r: 'EN 16798-3' },
    hoogspanning: { t: 'Hoogspanning in de nabijheid ({type})', d: 'Voor de plaatsing: een kraan mag niet binnen de veiligheidsafstand van een spanningvoerende lijn komen, en die afstand is groter dan de meeste mensen inschatten. Neem contact op met de netbeheerder vóór de hijsdag. Voor het bedrijf: geïnduceerde storing op voeler- en buskabels — vraag afgeschermde bekabeling en gescheiden kabelbanen.', r: 'Voorschriften netbeheerder; EMC' },
    luchthaven_kraanhoogte: { t: 'Kraanhoogte nabij een luchthaven', d: 'Binnen de hindernisvrije zones rond een luchthaven geldt een hoogtebeperking en soms een afzonderlijke toelating voor de kraan. De aanvraagtermijn daarvoor loopt op; ga dit na zodra de plaatsingsmethode bekend is.', r: 'Luchtvaartvoorschriften' },
    overstroming: { t: 'Opstelling in een overstromingsgevoelige zone', d: 'Bepaal de sokkelhoogte en de plaats van de elektrische aansluitingen op basis van het gekende waterpeil, of stel de kast hoger op. Motoren en regelkasten die één keer onder water hebben gestaan, worden vervangen, niet gedroogd.', r: '—' },
    sneeuw_roosters: { t: 'Sneeuwophoping of ijsval bij de buitenroosters', d: 'Dichtgesneeuwde buitenroosters leggen de installatie stil op het koudste moment van het jaar. Plaats de roosters ruim boven het dakvlak en houd rekening met verstuivende sneeuw, niet alleen met de sneeuwlaag. Bescherm ook tegen ijs dat van een hoger dakdeel valt.', r: '—' },
    geen_bliksem: { t: 'Buitenopgestelde kast niet in het bliksembeveiligingsconcept', d: 'Een metalen kast op het hoogste punt van het gebouw hoort opgenomen te zijn in de bliksembeveiliging en aangesloten op de equipotentiaalverbinding. Leg vast wie dat uitvoert — het valt vaak tussen de elektricien en de installateur in.', r: 'EN 62305' },
    bouwfase_filters: { t: 'Gebruik tijdens de bouwfase niet geregeld', d: 'Draait de installatie tijdens de afwerking, dan loopt de eerste filterset vol bouwstof en komt er vocht in het kanaalnet. Spreek af of er met bouwfilters wordt gedraaid, wie ze vervangt bij oplevering, en wie het kanaalnet dan controleert.', r: 'VDI 6022' },

    mantel_te_licht: { t: 'Manteluitvoering te licht voor corrosiviteitscategorie {cat}', d: 'Bij {cat} houdt verzinkt staal of aluzink het niet lang vol; de aantasting begint bij snijkanten, bevestigingen en de overgang naar de batterijen. Vraag een gecoate uitvoering of roestvast staal, en laat de fabrikant zijn systeem verantwoorden tegen deze categorie en tegen de gevraagde levensduur.', r: 'ISO 9223; ISO 12944' },
    batterij_onbeschermd: { t: 'Onbeschermde batterijen bij corrosiviteitscategorie {cat}', d: 'Aluminium lamellen op koperen buis zijn de standaarduitvoering en zijn bij {cat} niet voldoende. De lamellen zijn dun en hebben het grootste oppervlak: daar begint de schade, jaren voordat er aan de mantel iets te zien is. Vraag een e-coat of een gelijkwaardige bescherming, inclusief de contactzone tussen lamel en buis.', r: 'ISO 9223' },
    lamel_niet_bestand: { t: 'Lamelmateriaal niet bestand tegen de aangegeven stoffen', d: 'Aluminium wordt aangetast door chloor, ammoniak, sterke zuren en alkaliën, en door chloriden. Standaard aluminium lamellen op koperen buis zijn hier de verkeerde keuze. Kies een e-coat, een volledig roestvaste of een op de stof afgestemde uitvoering, en laat de fabrikant de materiaalcombinatie bevestigen tegen de opgegeven stoffen — niet tegen "industriële omgeving".', r: '—' },
    koper_ammoniak: { t: 'Koper in combinatie met ammoniak of zwavelverbindingen', d: 'Koper en koperlegeringen worden door ammoniak en door zwavelverbindingen aangetast; bij ammoniak treedt bovendien spanningscorrosie op in de buiswand. Bespreek een uitvoering in roestvast staal of een aangepaste legering, ook voor de aansluitingen en de soldeerverbindingen.', r: '—' },
    rvs304_chloride: { t: 'Roestvast staal 304 in een chloridenrijke omgeving', d: 'Chloorhoudende reinigings- en desinfectiemiddelen, zeezout en pekel veroorzaken put- en spanningscorrosie in 304. Vraag 316L. Het verschil is op de offerte klein en in het derde bedrijfsjaar beslissend.', r: '—' },
    bevestiging_a4: { t: 'Bevestigingsmateriaal te licht voor categorie {cat}', d: 'Bij {cat} en in elke chloorhoudende omgeving is A4 de ondergrens. Roestvaste panelen op verzinkte bouten geven bovendien contactcorrosie: de bout gaat eerst, en daarna komt de paneelverbinding los — met verlies van de lekdichtheidsklasse tot gevolg.', r: 'ISO 9223' },
    strooizout: { t: 'Strooizout zonder verhoogde corrosiviteitscategorie', d: 'Strooizoutnevel is chemisch hetzelfde probleem als zeezout en wordt structureel over het hoofd gezien, ook ver van de kust. Overweeg categorie C4 voor delen die de nevel opvangen, en let vooral op een inlaat op maaiveldniveau langs een gestrooide weg.', r: 'ISO 9223' },
    condensbak_verzinkt: { t: 'Verzinkte condensbak bij aanhoudend nat bedrijf', d: 'De condensbak staat permanent in water waarin alles oplost wat de lucht meebrengt. Verzinkte bakken zijn de meest voorkomende vroege schade in een luchtgroep. Vraag roestvast staal — 316L bij chloriden — en volledig afschot naar het aftappunt; een bak zonder afschot is een kweekbak, ongeacht het materiaal.', r: 'VDI 6022' },
    abrasief_rotor: { t: 'Roterende wisselaar bij abrasief stof', d: 'Minerale en metaalhoudende stofdeeltjes slijten de matrix en de afdichtingsborstels van een rotor, waardoor de overdracht toeneemt en het rendement daalt. Voorzie een zwaardere voorfiltratie aan de afvoerzijde, of kies een wisselaar die te reinigen is.', r: 'HIT 4A.9' },
    kust_categorie: { t: 'Kustligging maar corrosiviteit laag ingeschat', d: 'Binnen enkele kilometers van de kust is C4 en op de eerste lijn C5 realistisch. Verhoog de categorie of onderbouw de lagere inschatting; alle materiaalkeuzes op dit blad hangen ervan af.', r: 'ISO 9223' },

    atex_inconsistent: { t: 'ATEX aangeduid maar geen zone opgegeven', d: 'Bij de normen is ATEX aangevinkt, maar in dit blok staat geen explosiegevaar. Werk één van beide bij: zonder zone kan de fabrikant geen conforme uitvoering aanbieden, en met een zone is een standaarduitvoering niet toegelaten.', r: 'Richtlijn 1999/92/EG' },
    geen_zoneringsdocument: { t: 'Geen zoneringsplan of explosieveiligheidsdocument', d: 'Zonder zoneringsdocument kan geen enkele fabrikant een conforme uitvoering aanbieden en kan achteraf niemand de conformiteit aantonen. Dit document is de verantwoordelijkheid van de werkgever of exploitant en hoort te bestaan vóór de aanvraag vertrekt. Vraag het op — dit is geen formaliteit maar de grondslag van de hele uitvoering.', r: 'Richtlijn 1999/92/EG; EN 1127-1' },
    ventilator_niet_atex: { t: 'Standaardventilator in {zone}', d: 'In een zone in de luchtstroom moet de ventilator vonkarm zijn volgens EN 14986: een gecontroleerde materiaalcombinatie tussen waaier, huis en inlaatring, voldoende spleetmaat en een geaarde as. Let op — een vonkarme waaier in een gewoon huis is niet vonkarm. Overweeg ook de ventilator buiten de zone te plaatsen; dat is vaak eenvoudiger en altijd onderhoudsvriendelijker.', r: 'EN 14986; Richtlijn 2014/34/EU' },
    filter_statisch: { t: 'Geen antistatische uitvoering in een zone', d: 'Filtermedia, afdichtingen en flexibele verbindingen laden statisch op en worden dan zelf een ontstekingsbron. In een zone horen ze geleidend te zijn en doorverbonden met de aarding. Dit wordt bijna altijd vergeten omdat een filter als een passief onderdeel wordt gezien.', r: 'EN 1127-1' },
    geen_equipotentiaal: { t: 'Geen equipotentiaalverbinding gevraagd', d: 'Kast, kanalen, flexibele verbindingen, filterframes en de aspiratieleiding moeten doorverbonden en geaard zijn, met meetbare overgangsweerstand. Neem dit op als opleveringspunt met meetwaarden, niet als uitvoeringsdetail.', r: 'EN 1127-1; EN 60079-14' },
    elektrische_batterij_zone: { t: 'Elektrische verwarmingsbatterij in een zone', d: 'Een elektrisch element in een explosieve atmosfeer is een ontstekingsbron met een oppervlaktetemperatuur die bij storing niet te garanderen is. Kies een waterbatterij, of breng de verwarming buiten de zone.', r: 'Richtlijn 2014/34/EU' },
    rotor_in_zone: { t: 'Roterende wisselaar in een zone', d: 'Een rotor brengt bewegende delen, borstelafdichtingen en een aandrijving in de luchtstroom, plus overdracht tussen beide luchtstromen — dus verplaatsing van de explosieve atmosfeer naar de toevoerzijde. In een zone is dit zelden aanvaardbaar; een twin-coil houdt de media volledig gescheiden.', r: 'EN 1127-1' },
    stofgegevens_ontbreken: { t: 'Stof- of gasgegevens ontbreken', d: 'Zonder naam van de stof, onderste explosiegrens en — bij stof — de minimale ontstekingstemperatuur van wolk én laag en de Kst-waarde, kan de temperatuurklasse niet bepaald en de ontlasting niet berekend worden. Deze getallen komen uit het veiligheidsinformatieblad of uit een beproeving, niet uit een inschatting.', r: 'EN 1127-1' },
    geen_ontkoppeling: { t: 'Explosieontkoppeling nog niet bepaald', d: 'Bij een stofafzuiging met filter of cycloon hoort drukontlasting naar een veilige plaats en ontkoppeling zodat een explosie zich niet door de leiding voortplant naar de werkruimte. Dit staat los van de luchtgroep, maar de luchtbalans en de compensatielucht niet — geef beide samen op.', r: 'EN 14491; EN 15089' },
    zone_0_20: { t: 'Zone 0 of 20 in de luchtstroom', d: 'Een voortdurend aanwezige explosieve atmosfeer in de luchtstroom vraagt apparaatcategorie 1 en is voor een gewone luchtbehandelingskast in de praktijk geen werkbaar uitgangspunt. Onderzoek eerst of de zone te verkleinen is door de bron beter af te zuigen of te omkasten; dat is bijna altijd de goedkopere en veiligere weg.', r: 'Richtlijn 1999/92/EG' },

    dak_niet_bevestigd: { t: 'Draagkracht van het dak niet bevestigd', d: 'De kast weegt naar raming {massa} kg op ongeveer {opp} m² grondvlak, en dat is exclusief water in de batterijen, sneeuw en onderhoudslast. Laat een stabiliteitsingenieur dit schriftelijk bevestigen op basis van de werkelijke opgave van de fabrikant. Bij renovatie is het oorspronkelijke dakontwerp zelden op deze last berekend. Dit is de enige controle op dit blad met een reëel veiligheidsrisico — bestel niet vóór ze rond is.', r: 'Constructieve verificatie door de stabiliteitsingenieur' },
    geen_kraanplaats: { t: 'Opstelplaats voor de kraan niet vastgesteld', d: 'Een mobiele kraan heeft een vlakke, draagkrachtige ondergrond nodig voor haar stempels en vrije ruimte eromheen. Controleer wat er onder het opstelvlak ligt — kelder, parkeerdek, riolering — en of er bovengronds leidingen of bomen in de baan staan. Zonder opstelplaats is er geen plaatsingsdag, hoe goed de kast ook geselecteerd is.', r: '—' },
    plaatsing_onbepaald: { t: 'Wijze van plaatsen nog niet bepaald', d: 'Zolang niet vaststaat hoe de kast op haar plaats komt, is de opdeling in transportsecties een gok. Bepaal dit vóór de bestelling: de fabrikant kan de opdeling afstemmen op de kraan of de lift, maar niet nadat de kast gebouwd is.', r: '—' },
    collo_te_zwaar: { t: 'Zwaarste collo boven de opgegeven grens', d: 'Het zwaarste deel weegt naar raming {collo} kg tegenover een grens van {max} kg. Laat de fabrikant fijner opdelen, of voorzie zwaarder hijsmaterieel. Elke extra koppeling is wel een extra risico op lekkage — leg vast wie ze afdicht en hoe de lekdichtheidsklasse na montage wordt aangetoond.', r: '—' },
    dak_te_klein: { t: 'Te weinig vrije dakoppervlakte', d: 'Inclusief servicruimte is ongeveer {nodig} m² nodig, tegenover {vrij} m² beschikbaar. Zonder die ruimte kunnen filters en componenten niet uitgenomen worden en wordt onderhoud in de praktijk overgeslagen. Herzie de opstelling of de plaats voordat de maatvoering vastligt.', r: '—' },
    houten_dak: { t: 'Zware kast op een houten dakconstructie', d: 'Houten spanten vragen een zorgvuldige lastspreiding en zijn gevoelig voor puntlasten en voor trillingen van de ventilatoren. Laat de constructie doorrekenen inclusief de dynamische belasting, en voorzie een dakstoel die de last op de spanten brengt, niet op het dakbeschot.', r: '—' },
    geen_hijsogen: { t: 'Geen hijsogen of hijsvoorschrift gevraagd', d: 'Vraag het hijsvoorschrift van de fabrikant op: aanslagpunten, toegestane strophoek, zwaartepunt per sectie en of een hijsbalk vereist is. Een kast die verkeerd wordt aangeslagen, vervormt en verliest haar lekdichtheidsklasse — onzichtbaar, tot de oplevering.', r: 'EN 1886' },
    geen_windverankering: { t: 'Geen windverankering voorzien', d: 'Een buitenopgestelde kast is een groot vlak op een hoog punt. Laat de verankering berekenen op de plaatselijke windbelasting en zorg dat de krachten in de draagconstructie terechtkomen, niet in de dakbedekking.', r: 'EN 1991-1-4 (windbelasting)' },
    dak_geen_toegang: { t: 'Geen permanente toegang tot het dak', d: 'Zonder vaste trap of ladder en zonder collectieve valbeveiliging worden filters niet vervangen en wordt onderhoud uitgesteld. Dat bepaalt of de installatie na drie jaar nog levert wat is afgesproken. Regel ook hoe zwaar materiaal naar boven komt.', r: 'Arbeidsveiligheid — werken op hoogte' },
    doorvoeren_onbepaald: { t: 'Dakdoorvoeren zonder verantwoordelijke', d: 'Kanaal-, leiding- en kabeldoorvoeren doorbreken de dakdichting en de dampremmende laag. Leg vast wie ze maakt, wie ze waterdicht afwerkt en wat dat met de dakgarantie doet — die vervalt vaak zodra een derde partij aan de dichting werkt.', r: '—' },
    vergunning_hijsdag: { t: 'Vergunning voor de plaatsingsdag nog niet geregeld', d: 'Inname van de openbare weg, parkeerverbod of politietoelating hebben in veel gemeenten een aanvraagtermijn van enkele weken. Die termijn bepaalt de planning mee — vaak sterker dan de levertijd van de kast zelf.', r: 'Gemeentelijke voorschriften' },
    geen_opslag: { t: 'Geen tijdelijke opslag op de werf', d: 'Levering en plaatsing moeten dan op dezelfde dag vallen. Plan die dag met marge en leg vast wat er gebeurt bij vertraging: een kast die weken in de regen staat, begint haar leven met vocht in de isolatie en corrosie in de batterijen.', r: '—' },
    geen_vervangingsroute: { t: 'Componenten later niet vervangbaar', d: 'Over tien à vijftien jaar moeten wisselaar, batterij of ventilatormodule eruit kunnen. Vraag de fabrikant welke componenten uitneembaar zijn en langs welke zijde, en houd die route vrij. Wat nu een lege strook is, is later het verschil tussen vervangen en de hele kast slopen.', r: '—' },
    route_onbekend: { t: 'Aanvoerroute niet beschreven', d: 'Meet de hele weg op: poort, deuropeningen, gangen, bochten, lift, dakluik. Let vooral op bochten — een sectie van 2,4 m gaat niet om een hoek van 1,5 m, ook al passen beide maten afzonderlijk.', r: '—' },
    a2l: { t: 'Brandbaar koudemiddel ({refr}, groep A2L) in de kast', d: 'Vraag de fabrikant om de vullinghoeveelheid per circuit en om de bijbehorende minimale ruimtegrootte, lekdetectie en ventilatie van de opstellingsruimte. Deze eisen bepalen mede waar de kast mag staan en zijn achteraf zelden op te lossen.', r: 'EN 378; F-gasverordening (EU) 2024/573' },
    a3: { t: 'Propaan (A3) — sterk brandbaar', d: 'R290 vraagt een expliciete risicobeoordeling, strikte grenzen op de vulling, lekdetectie en meestal een aparte geventileerde technische ruimte of een buitenopstelling. Betrek dit vóór de plaatsbepaling, niet erna.', r: 'EN 378; IEC 60335-2-40' },

}

  const mixed = CALC.mixing(A, st, recovery, flow);
  const entryW = mixed.winter, entryS = mixed.summer;
  const coils = CALC.coils(A, st, flow, entryW, entryS, recovery);
  let chainInfo = CHAIN.chain(A, { recovery });
  const geometry = CALC.geometry(Object.assign({ __chain: chainInfo.all }, A), flow, coils, recovery);
  const fans = CALC.fans(A, flow, geometry, chainInfo.all);
  const energy = CALC.energy(A, flow, recovery, st, fans);
  const R = { profile, st, flow, recovery, mixed, coils, geometry, fans, energy, chainInfo };
  R.rules = CHAIN.checkRules(A, R);

        `<path ${s} d="M${x + 3} ${y + 3}L${x + w - 3} ${y + h - 3}M${x + w - 3} ${y + 3}L${x + 3} ${y + h - 3}"/>`;
    case 'rotor':
      return `<circle ${s} cx="${cx}" cy="${cy}" r="${Math.min(w, h) / 2 - 3}"/>` +
        `<path ${s} d="M${x + 4} ${cy}L${x + w - 4} ${cy}M${cx} ${y + 4}L${cx} ${y + h - 4}"/>`;
    case 'twin':
      return `<path ${s} d="M${x + 4} ${y + 4}L${x + 4} ${y + h - 4}M${x + w - 4} ${y + 4}L${x + w - 4} ${y + h - 4}M${x + 4} ${cy - 4}L${x + w - 4} ${cy - 4}M${x + 4} ${cy + 4}L${x + w - 4} ${cy + 4}"/>`;
    case 'damper': {
      let d = '';
      for (let i = 0; i < 3; i++) { const yy = y + 6 + i * ((h - 12) / 2); d += `M${x + 4} ${yy + 3}L${x + w - 4} ${yy - 3}`; }
      return `<path ${s} d="${d}"/>`;
    }
    case 'mix':
      return `<path ${s} d="M${x + 4} ${y + 5}L${x + w - 4} ${cy}M${x + 4} ${y + h - 5}L${x + w - 4} ${cy}M${x + w - 4} ${cy}L${x + w - 6} ${cy - 3}M${x + w - 4} ${cy}L${x + w - 6} ${cy + 3}"/>`;
    case 'humid':
      return `<path ${s} d="M${cx - 6} ${cy + 4}q0 -6 6 -12 6 6 6 12 0 5 -6 5 -6 0 -6 -5Z"/>`;
    case 'silencer': {
      let d = '';
      for (let i = 0; i < 4; i++) { const xx = x + 5 + i * ((w - 10) / 3.4); d += `M${xx} ${y + 4}L${xx} ${y + h - 4}`; }
      return `<path ${s} d="${d}"/>`;
    }
    case 'measure':
      return `<path ${s} d="M${x + 4} ${y + h - 5}L${x + w - 4} ${y + h - 5}M${x + 7} ${y + h - 5}L${x + 7} ${y + 6}M${x + 7} ${y + 6}L${x + w - 6} ${cy}"/>`;
    default:
      return `<rect x="${x + 4}" y="${y + 4}" width="${w - 8}" height="${h - 8}" rx="2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 3"/>`;
  }
}

function chunk(a, n) {
  const out = []; for (let i = 0; i < a.length; i += n) out.push(a.slice(i, i + n));
  return out.length ? out : [[]];
}

function diagramSVG(R, opts) {
  opts = opts || {};
  const compact = !!opts.compact;
  const BW = 96, BH = 66, GAP = 9, PADX = 12, HEADH = 20, SPECH = 15;
  const perRow = compact ? 999 : (opts.perRow || 6);
  const sides = [
    { label: tt('ui.diagramSupply'), items: R.chainInfo.supply },
    { label: tt('ui.diagramExtract'), items: R.chainInfo.extract }
  ];
  const lines = [];
  sides.forEach(s => chunk(s.items, perRow).forEach((items, i) =>
    lines.push({ label: i === 0 ? s.label : '', items, cont: i > 0 })));

  const maxN = Math.max(1, ...lines.map(l => l.items.length));
  const W = PADX * 2 + maxN * BW + (maxN - 1) * GAP + 26;
  const lineH = HEADH + BH + SPECH + 12;
  const H = lines.length * lineH + 8;
  const wAttr = compact ? `width="${W}" height="${H}"` : `width="100%"`;

  let svg = `<svg class="diagram" viewBox="0 0 ${W} ${H}" ${wAttr} role="img" aria-label="${esc(tt('ui.diagramTitle'))}">`;
  svg += `<defs><marker id="dgar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M0 0 L8 4 L0 8 z" fill="var(--dg-arrow)"/></marker></defs>`;

  lines.forEach((line, li) => {
    const yTop = li * lineH + 6;
    const yBox = yTop + HEADH;
    if (line.label) svg += `<text x="${PADX}" y="${yTop + 11}" class="dg-rowlabel">${esc(line.label)}</text>`;
    const startX = PADX + 14;
    const n = line.items.length;
    if (n) {
      svg += `<line x1="${PADX}" y1="${yBox + BH / 2}" x2="${startX - 5}" y2="${yBox + BH / 2}" class="dg-flow" marker-end="url(#dgar)"/>`;
      svg += `<line x1="${startX + n * (BW + GAP) - GAP}" y1="${yBox + BH / 2}" x2="${startX + n * (BW + GAP) - GAP + 9}" y2="${yBox + BH / 2}" class="dg-flow" marker-end="url(#dgar)"/>`;
    }
    line.items.forEach((m, i) => {
      const x = startX + i * (BW + GAP);
      svg += `<g class="dg-mod dg-${m.family}">`;
      svg += `<rect x="${x}" y="${yBox}" width="${BW}" height="${BH}" rx="6" class="dg-box"/>`;
      svg += `<rect x="${x}" y="${yBox}" width="${BW}" height="3.5" rx="1.75" class="dg-accent"/>`;
      svg += `<g class="dg-icon">${icon(MOD_ICON[m.key] || 'empty', x + BW / 2 - 16, yBox + 12, 32, 26)}</g>`;
      const lbl = modLabel(m.key);
      const cls = lbl.length > 13 ? 'dg-lab dg-lab-s' : 'dg-lab';
      svg += `<text x="${x + BW / 2}" y="${yBox + BH - 8}" class="${cls}">${esc(lbl.length > 20 ? lbl.slice(0, 19) + '…' : lbl)}</text>`;
      svg += `</g>`;
      const sp = m.spec === m.key ? '' : specLabel(m.spec);
      if (sp) svg += `<text x="${x + BW / 2}" y="${yBox + BH + 11}" class="dg-spec">${esc(sp)}</text>`;
    });
  });
  svg += `</svg>`;
  return svg;
}

function diagramLegend() {
  const fams = ['filtratie', 'terugwinning', 'koeling', 'verwarming', 'bevochtiging', 'ventilator', 'neutraal'];
  return `<ul class="dglegend">` + fams.map(f =>
    `<li><span class="sw" style="background:var(--dg-${f})"></span>${esc((L().fam || base().fam || {})[f] || f)}</li>`).join('') + `</ul>`;
}

/* =====================================================================
   Formulierweergave
   ===================================================================== */
function ruleText(r) {
  const pack = (L().rules || {})[r.id] || (base().rules || {})[r.id] || { t: r.id, d: '', r: '' };
  let vars = Object.assign({}, r.vars);
  if (r.id === 'profiel_note') {
    const p = PROFILES.find(x => x.id === r.vars.profiel);
    vars.note = p ? profText(p, 'note') : '';
    vars.basis = p ? profText(p, 'basis') : '—';
    return { title: `${pack.t}${p ? ` — ${profText(p, 'label')}` : ''}`, body: vars.note, ref: vars.basis };
  }
  return { title: fill(pack.t, vars), body: fill(pack.d, vars), ref: fill(pack.r, vars) };
}

function ruleHTML(r) {
  const x = ruleText(r);
  const lvl = { blok: tt('ui.levelBlok'), waarschuwing: tt('ui.levelWaarschuwing'), advies: tt('ui.levelAdvies') }[r.level];
  const sym = { blok: '■', waarschuwing: '▲', advies: '●' }[r.level];
  return `<div class="rule lv-${r.level}">
    <div class="rhead"><span class="badge" aria-hidden="true">${sym}</span><span class="lvl">${esc(lvl)}</span><h4>${esc(x.title)}</h4></div>
    <p>${esc(x.body)}</p>
    ${x.ref && x.ref !== '—' ? `<p class="ref">${esc(tt('ui.basis'))}: ${esc(x.ref)}</p>` : ''}
  </div>`;
}

/* =====================================================================
   Rapport
   ===================================================================== */
function answerRows() {
  const rows = [];
  SCHEMA.forEach((sec, si) => {
    const qs = sec.questions.filter(q => !q.show || q.show(App.A));
    const items = [];
    qs.forEach(q => {
      let v = App.A[q.id];
      if (q.type === 'checkbox') v = Array.isArray(v) && v.length ? v.map(x => {
        const o = (q.options || []).find(o => o.v === x); return o ? optLabel(q, o) : x;
      }).join('; ') : '';
      else if (q.type === 'profile') { const p = PROFILES.find(p => p.id === v); v = p ? profText(p, 'label') : ''; }
      else if (q.options) { const o = (q.options || []).find(o => o.v === v); v = o ? optLabel(q, o) : (v || ''); }
      if (App.hideEmpty && (v === undefined || v === null || v === '')) return;
      items.push({ label: qText(q, 'label'), value: (v === undefined || v === null || v === '') ? tt('ui.unanswered') : v, unit: q.unit || '' });
    });
    if (items.length) rows.push({ title: secTitle(sec, si), items });
  });
  return rows;
}

function renderReport() {
  const R = App.R, A = App.A;
  const counts = { blok: 0, waarschuwing: 0, advies: 0 };
  R.rules.forEach(r => counts[r.level]++);

    [tt('ui.kpiCool'), `${nf(R.coils.cooling, 1)} kW` + (R.coils.dehumidifying ? ` (${nf(R.coils.coolSens, 1)} + ${nf(R.coils.coolLat, 1)} kW)` : '')],
    R.coils.condensate > 0 ? [tt('ui.kpiCondensate'), `${nf(R.coils.condensate, 1)} kg/h`] : null,
    R.coils.humidWater > 0 ? [tt('ui.kpiHumid'), `${nf(R.coils.humidWater, 1)} kg/h`] : null,
    [tt('ui.kpiRecovery'), `${nf(R.recovery.eta)} %`],
    [tt('ui.kpiSaving'), `${nf(R.energy.recoverySaving)} kWh/a`],
    [tt('ui.kpiFanPower'), `${nf(R.fans.powerSup, 1)} + ${nf(R.fans.powerExt, 1)} = ${nf(R.fans.powerTotal, 1)} kW`],
    [tt('ui.kpiDp'), `${nf(R.fans.dpInternalSup)} + ${nf(R.fans.espSup)} = ${nf(R.fans.dpTotalSup)} Pa`],
    [tt('ui.kpiSfp'), `${nf(R.fans.sfpSup)} / ${nf(R.fans.sfpExt)} W/(m³/s)`],
    [tt('ui.sfpSystem'), `${nf(R.fans.sfpSystem)} W/(m³/s)`],
    [tt('ui.sfpInt'), `${nf(R.fans.sfpInt)} W/(m³/s)`],
    [tt('ui.kpiFace'), `${nf(R.geometry.faceVelocity, 2)} m/s`],
    [tt('ui.kpiSize'), `${nf(R.geometry.overallW, 2)} × ${nf(R.geometry.overallH, 2)} × ${nf(R.geometry.overallL, 1)} m`],
    [tt('ui.kpiMass'), `≈ ${nf(R.geometry.mass)} kg`],
    [tt('ui.kpiSectionMass'), `≈ ${nf(R.geometry.sectionMass)} kg (${nf(R.geometry.sections)} ×)`],
    [tt('ui.kpiArea'), `≈ ${nf(R.geometry.areaNeeded, 1)} m²`]
  ].filter(Boolean);

  const prof = R.profile ? profText(R.profile, 'label') : '—';

  return `<article class="report" id="report">
    <header class="rhead-main">
      <h2 class="rtitle">${esc(tt('ui.reportTitle'))}</h2>
      <table class="meta"><tbody>
        <tr><th>${esc(tt('ui.reportRef'))}</th><td>${esc(A.prj_name || '—')}${A.prj_ref ? ' · ' + esc(A.prj_ref) : ''}</td>
            <th>${esc(tt('ui.reportUnit'))}</th><td>${esc(A.prj_unit_tag || '—')}</td></tr>
        <tr><th>${esc(tt('ui.reportFor'))}</th><td>${esc(A.prj_client || '—')}</td>
            <th>${esc(tt('ui.reportDate'))}</th><td>${esc(A.prj_date || '—')}</td></tr>
        <tr><th>${esc(tt('ui.reportBy'))}</th><td>${esc(A.prj_author || '—')}</td>
            <th>${esc(qText(SCHEMA[0].questions.find(q => q.id === 'prj_profile'), 'label'))}</th><td>${esc(prof)}</td></tr>
      </tbody></table>
    </header>

    <section><h2>${esc(tt('ui.secSummary'))}</h2>
      <p>${esc(fill(tt('ui.checksCount'), counts))}</p>
      ${A.prj_process_desc ? `<p>${esc(A.prj_process_desc)}</p>` : ''}
      ${R.profile ? `<p class="profnote">${esc(profText(R.profile, 'note'))}</p>` : ''}
    </section>

    <section><h2>${esc(tt('ui.diagramTitle'))}</h2>

      </tbody></table>
    </section>

    <section class="break"><h2>${esc(tt('ui.secModules'))}</h2>
      <table class="grid wide"><thead><tr>
        <th>${esc(tt('ui.colModule'))}</th><th>${esc(tt('ui.colWhy'))}</th>
        <th>${esc(tt('ui.colDriver'))}</th><th>${esc(tt('ui.colNorm'))}</th></tr></thead>
        <tbody>${mots}</tbody></table>

    <section class="break"><h2>${esc(tt('ui.secChecks'))}</h2>

    <section class="break"><h2>${esc(tt('ui.secAll'))}</h2>
      ${answerRows().map(g => `<h3>${esc(g.title)}</h3>
        <table class="grid"><tbody>${g.items.map(i =>
    `<tr><th scope="row">${esc(i.label)}</th><td>${esc(i.value)}${i.unit ? ' ' + esc(i.unit) : ''}</td></tr>`).join('')}</tbody></table>`).join('')}
    </section>

    <section><h2>${esc(tt('ui.secDisclaimer'))}</h2><p class="disclaimer">${esc(tt('ui.disclaimer'))}</p></section>
