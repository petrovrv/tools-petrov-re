/* =====================================================================
   Weergave en gebeurtenissen
   ===================================================================== */
/* =====================================================================
   Weergave — op het gedeelde raamwerk tools.petrov.re/ui/v1

   The shell, the header, the sixteen wizard steps, the fields, the result
   tiles, the freshness states, learn mode, the language control and the theme
   belong to diagram-ui.js.  What is left here is what only this tool knows:
   the question schema, the casing schematic, the 93 checks and the report.
   ===================================================================== */

let steps = null;                    /* the wizard step list                        */
let stage = null;                    /* the casing schematic                        */
let langError = '';                  /* set when a language pack could not be read  */
let fileInput = null;                /* project-file picker, kept out of the shell  */
const REDRAW = Object.create(null);   /* custom fields that repaint themselves       */

/* The framework hands back a fresh state object after Reset, and a language change replaces the
   App instance, so nothing below holds on to either of them. */
function UI() { return window.DiagramUI ? DiagramUI.current : null; }

/* Framework repair, local to this file.  Below 768 px diagram-ui.js moves #dgc-bar and
   #eng-disc-badge into the shell's own .dgu-chromedock so they flow with the document instead of
   covering it.  App.destroy() then removes the whole shell on a language rebuild and takes the
   shared chrome with it, leaving the page with no toolbar.  The fix belongs upstream — destroy()
   should return the docked nodes to the body first — and until then every rebuild goes through
   here. */
function rebuildKeepingChrome(a) {
  const ids = ['dgc-bar', 'eng-disc-badge', 'dgc-menu', 'dgc-notes'];
  const kept = ids.map(id => document.getElementById(id)).filter(Boolean);
  const docked = document.documentElement.getAttribute('data-dgu-chrome') === 'flow';
  kept.forEach(n => document.body.appendChild(n));
  a.rebuild();
  const live = UI();
  const dock = (docked && live && live.node) ? live.node.querySelector('.dgu-chromedock') : null;
  if (dock) { kept.forEach(n => dock.appendChild(n)); dock.hidden = false; }
  try { DiagramUI.measure(); } catch (e) { }
}
function refresh() { const a = UI(); if (a) { a.sync(); a.run(); } }
/* The answer sheet is one object for the life of the page and is only ever mutated in place.
   Framework note, reported rather than patched: App.rebuild() builds a second App instance and
   copies its properties onto the first, so every Field and Panel keeps a reference to the
   instance it was constructed with, while App.reset() and App.example() assign a NEW object to
   `this.state` on the live instance only.  After a language change that leaves the fields reading
   a stale sheet — the state and the record update, the controls do not.  Upstream the fix is for
   reset()/example() to refill the existing state object instead of replacing it. */
function setAnswers(o) {
  const keep = App.A;
  if (o && o !== keep) {
    Object.keys(keep).forEach(k => { delete keep[k]; });
    Object.assign(keep, o);
  }
  const a = UI();
  if (a) a.state = keep;
  return keep;
}
function runRedraw() { for (const k in REDRAW) REDRAW[k](); }

/* the declared defaults, as `Leegmaken` always produced them */
function freshAnswers() {
  const keep = App.A;
  App.A = {};
  applyDefaults();
  const out = App.A;
  App.A = keep;
  return out;
}

/* ---- stapnavigatie --------------------------------------------------- */
function applyNav(id) {
  if (id === 'report') App.view = 'report';
  else { App.step = Math.max(0, Math.min(SCHEMA.length - 1, +id)); App.view = 'form'; }
}
function goStep(id) { applyNav(id); try { window.scrollTo(0, 0); } catch (e) { } refresh(); }
function syncSteps() {
  if (!steps) return;
  const want = App.view === 'report' ? 'report' : String(App.step);
  if (steps.value === want) return;
  steps.value = want;
  steps.items.forEach((it, i) => {
    const on = it.id === want;
    steps.buttons[i].setAttribute('aria-selected', String(on));
    if (on) steps.buttons[i].setAttribute('aria-current', 'step');
    else steps.buttons[i].removeAttribute('aria-current');
  });
  steps.select_.value = want;
}
/* the report replaces the form, exactly as it did before the port */
function applyViewRegions(app) {
  const rep = App.view === 'report';
  if (!app || !app.regions) return;
  if (app.regions.results) app.regions.results.hidden = rep;
  if (app.regions.stage) app.regions.stage.hidden = rep;
  if (app.regions.strip) app.regions.strip.hidden = rep || app.regions.strip.hidden;
}

/* ---- vragen → velden ------------------------------------------------- */
function optPairs(q) { return (q.options || []).map(o => [o.v, () => optLabel(q, o)]); }

/* An emptied number field stores `undefined`, which is what the form produced before the port and
   what the calculation, the record and the permalink expect; `null` would count as answered. */
function numberSet(id) {
  return (v, s) => {
    s[id] = (v === null || v === undefined || (typeof v === 'number' && !Number.isFinite(v))) ? undefined : v;
  };
}

function multiRender(q) {
  return function (box, ctx, field) {
    box.className = 'lgs-checks';
    const draw = () => {
      const arr = Array.isArray(App.A[q.id]) ? App.A[q.id] : [];
      box.textContent = '';
      (q.options || []).forEach(o => {
        const on = arr.indexOf(o.v) >= 0;
        const lab = document.createElement('label');
        lab.className = 'lgs-chk' + (on ? ' on' : '');
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.value = o.v; cb.checked = on;
        cb.setAttribute('aria-label', optLabel(q, o));
        cb.addEventListener('change', () => {
          const cur = Array.isArray(App.A[q.id]) ? App.A[q.id].slice() : [];
          const i = cur.indexOf(o.v);
          if (cb.checked && i < 0) cur.push(o.v);
          if (!cb.checked && i >= 0) cur.splice(i, 1);
          field.commit(cur, true);
        });
        const bx = document.createElement('span');
        bx.className = 'box';
        bx.textContent = '\u2713';
        bx.setAttribute('aria-hidden', 'true');
        const sp = document.createElement('span');
        sp.textContent = optLabel(q, o);
        lab.appendChild(cb); lab.appendChild(bx); lab.appendChild(sp);
        box.appendChild(lab);
      });
    };
    REDRAW['f_' + q.id] = draw;
    draw();
  };
}

function profileRender(q) {
  return function (box) {
    box.className = 'lgs-profiles';
    const draw = () => {
      const cur = App.A[q.id];
      box.textContent = '';
      PROFILE_GROUPS.forEach(g => {
        const wrap = document.createElement('div');
        const h = document.createElement('h4');
        h.textContent = (L().pgroup || {})[g.id] || g.label;
        wrap.appendChild(h);
        const grid = document.createElement('div');
        grid.className = 'lgs-pgrid';
        PROFILES.filter(p => p.group === g.id).forEach(p => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'lgs-pcard' + (cur === p.id ? ' on' : '');
          b.setAttribute('aria-pressed', String(cur === p.id));
          b.textContent = profText(p, 'label');
          b.addEventListener('click', () => { applyProfile(p.id); refresh(); });
          grid.appendChild(b);
        });
        wrap.appendChild(grid);
        box.appendChild(wrap);
      });
    };
    REDRAW['f_' + q.id] = draw;
    draw();
  };
}

function fieldOf(q, si) {
  const d = {
    id: 'f_' + q.id,
    key: q.id,
    label: () => qText(q, 'label'),
    visible: () => App.view === 'form' && App.step === si && (!q.show || q.show(App.A)),
    required: !!q.required
  };
  /* The sheet's own unit is also its display unit: these answers are quoted to a manufacturer in
     the units the standards use, so nothing is converted and no unit-system control appears. */
  if (q.unit) { d.unit = q.unit; d.display = q.unit; }
  if (qText(q, 'help')) d.learn = q.id;
  switch (q.type) {
    case 'date': d.type = 'text'; d.inputType = 'date'; break;
    case 'textarea': d.type = 'textarea'; d.rows = 3; break;
    case 'number':
      d.type = 'number';
      d.set = numberSet(q.id);
      if (q.step) d.step = q.step;
      if (q.default !== undefined) d.placeholder = String(q.default);
      break;
    case 'select': d.type = 'select'; d.options = () => optPairs(q); break;
    case 'radio': d.type = 'segmented'; d.options = () => optPairs(q); break;
    case 'checkbox': d.type = 'custom'; d.render = multiRender(q); break;
    case 'profile': d.type = 'custom'; d.render = profileRender(q); break;
    default: d.type = 'text';
  }
  return d;
}

/* ---- rapportweergave en stapknoppen als velden ----------------------- */
function reportRender() {
  return function (box) {
    box.className = 'report-host';

      hint: H(R.coils.dehumidifying ? nf(R.coils.coolLat, 1) + ' kW latent · ' + nf(R.coils.condensate, 1) + ' kg/h' : '') },
    { label: () => tt('ui.kpiRecovery'), value: V(nf(R.recovery.eta)), unit: '%', display: '%', headline: false,
      hint: H(R.recovery.active ? nf(R.energy.recoverySaving) + ' kWh/a' : '—') },

      hint: H(tt('ui.sfpSystem') + ' ' + nf(R.fans.sfpSystem) + ' · ' + nf(R.fans.powerTotal, 1) + ' kW') },
    { label: () => tt('ui.kpiFace'), value: V(nf(R.geometry.faceVelocity, 2)), unit: 'm/s', display: 'm/s', headline: false,

/* ---- framework repair, local to this file ----------------------------
   App.prototype.setLang refuses any language outside the site's six, so this tool's Russian —
   declared in tool_languages and shipped as luchtgroepselector-lang-ru.json — could not be
   chosen from the shared header.  The fix belongs upstream in diagram-ui.js: the gate should
   accept the manifest's tool_languages, not the site list.  Until then this patches the one
   prototype the page owns, and adds what the tool's own switcher used to do: fetch the language
   pack before re-rendering in it. */
function patchLanguage(app) {
  const proto = Object.getPrototypeOf(app);
  if (!proto.__lgsLang) {
    proto.__lgsLang = true;
    proto.setLang = function (l) {
      if (!LANGS[l]) return this.lang;
      const self = this;
      const done = () => {
        App.lang = l;
        self.lang = l;
        try { localStorage.setItem('diagram_site_lang', l); } catch (e) { }
        try {
          const u = new URL(location.href);
          u.searchParams.set('lang', l);
          history.replaceState(null, '', u);
        } catch (e) { }
        try { if (window.Diagram) window.Diagram.setLang(l); } catch (e) { }
        document.documentElement.lang = l;
        save();
        rebuildKeepingChrome(self);
      };
      if (LANGDATA.ready(l)) { langError = ''; done(); return l; }
      LANGDATA.ensure(l).then(() => { langError = ''; done(); },
        (err) => { langError = LANGDATA.errorText(l, err); done(); });
      return l;
    };
  }
  /* the switcher shows native names; diagram-ui.js has no entry for Russian */
  const sels = app.head ? app.head.querySelectorAll('select') : [];
  for (let s = 0; s < sels.length; s++) {
    const sel = sels[s];
    let all = sel.options.length > 0;
    for (let i = 0; i < sel.options.length; i++) if (!LANGS[sel.options[i].value]) all = false;
    if (!all) continue;
    for (let i = 0; i < sel.options.length; i++) sel.options[i].text = LANGS[sel.options[i].value].name;
    sel.value = App.lang;
  }
}

/* Language precedence: ?lang= -> localStorage.diagram_site_lang -> the language stored with
   the saved sheet -> browser -> nl. The site bootstrap in <head> resolves the first
   three of those into window.__diagramLang using the seven site languages; this tool
   now speaks all seven of those, plus Russian, so no site language falls back to
   English here anymore. */
function pickLang(stored) {
  const has = (c) => Object.prototype.hasOwnProperty.call(LANGS, c);
  let q = '';
  try { q = (new URLSearchParams(location.search).get('lang') || '').slice(0, 2).toLowerCase(); } catch (e) { }
  if (q) return has(q) ? q : 'en';
  let s = '';
  try { s = (localStorage.getItem('diagram_site_lang') || '').slice(0, 2).toLowerCase(); if (!s) s = (localStorage.getItem('diagram_lang') || '').slice(0, 2).toLowerCase(); } catch (e) { }
  if (s) return has(s) ? s : 'en';
  if (stored && has(stored)) return stored;
  try {
    for (const n of (navigator.languages || [navigator.language || ''])) {
      const c = String(n).slice(0, 2).toLowerCase();
      if (has(c)) return c;
    }
  } catch (e) { }
  return 'nl';
}

  const restored = load();

function boot() {
  if (!window.DiagramUI || DiagramUI.api !== 'tools.petrov.re/ui/v1') { bootBare(); return; }

  const restored = load();
  App.lang = pickLang(restored ? App.lang : '');
  applyDefaults();
  LANGDATA.prime(App.lang);

  /* The v2 data layer starts first and unconditionally, outside any then/catch: the shared bar,
     the permalink, the record, the Python export and the handoff must exist even when no language
     pack ever arrives.  Before the port Diagram.init() sat inside LANGDATA.ensureThen's success
     branch, so a single failed fetch cost the whole toolbar in five of six languages. */
  dgcInit();
  if (App.lang !== 'nl') LANGDATA.prime(App.lang);   /* a permalink may have chosen another one */

  fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'application/json,.json';
  fileInput.hidden = true;
  fileInput.id = 'fileinput';
  fileInput.addEventListener('change', (e) => { if (e.target.files[0]) importJSON(e.target.files[0]); });
  document.body.appendChild(fileInput);

  const app = DiagramUI.app({
    id: 'luchtgroepselector',
    mount: '#app',
    layout: 'wizard',
    compute: 'live',
    lang: App.lang,
    title: () => tt('ui.appTitle'),
    subtitle: () => tt('ui.appSubtitle'),
    state: App.A,
    defaults: freshAnswers,
    strings: frameworkStrings(),
    learn: buildLearn(),
    panels: buildPanels(),
    footer: buildFooter,
    on: {
      compute: function (s) {
        const R = compute();
        runRedraw();
        syncSteps();
        if (stage) stage.schedule();
        document.title = tt('ui.appTitle') + ' — ' + tt('ui.appSubtitle');
        save();
        return buildResults(R);
      },
      reset: function (s, a) { setAnswers(s); if (a) a.state = App.A; App.step = 0; App.view = 'form'; },
      state: function (st, a) { applyViewRegions(a); },
      ready: function (a) {
        if (a.__lgsBuilt) return;
        a.__lgsBuilt = true;
        patchLanguage(a);

        steps = a.steps({
          label: tt('ui.step'),
          items: SCHEMA.map((sec, i) => ({ id: String(i), label: () => secText(sec, 'title') }))
            .concat([{ id: 'report', label: () => tt('ui.report') }]),
          value: App.view === 'report' ? 'report' : String(App.step),
          onSelect: function (id) { applyNav(id); try { window.scrollTo(0, 0); } catch (e) { } refresh(); }
        });

        stage = buildStage(a);

        a.examples([{
          label: () => tt('ui.demo'),
          note: 'Kantoorgebouw Noord — fase 2 · LBK-01',
          apply: function () { demo(); }
        }]);

        a.sync();
        a.run();
      }
    }
  });

  document.documentElement.lang = App.lang;
  app.ready();

  /* If the pack was not already installed by the <head> prefetch, render again when it lands and
     say so plainly when it never does.  The tool keeps working from its inline Dutch base. */
  if (!LANGDATA.ready(App.lang)) {
    LANGDATA.ensure(App.lang).then(function () {
      const a = UI();
      if (a) rebuildKeepingChrome(a);
    }, function (err) {
      langError = LANGDATA.errorText(App.lang, err);
      const a = UI();
      if (a) { a.notify(langError, { kind: 'err' }); a.sync(); a.run(); }
    });
  }
}

/* ---- python export -------------------------------------------------------
   Reproduced: the psychrometrics, the air flow and balance, heat recovery with
   its frost limit and preheat, mixing, the coil duties with the sensible/latent
   split and condensate, humidification, face velocity, fan power, the three SFP
   definitions and the degree-day energy estimate.
   Not reproduced: the module chain that fixes the internal pressure drop, the
   casing dimensions and mass that follow from it, and the 93-rule check. The
   internal pressure drops are therefore carried into the script as given values
   and the header says so. */
const PY_KEYS = ['cnd_altitude', 'cnd_oda_t_w', 'cnd_oda_rh_w', 'cnd_oda_t_s', 'cnd_oda_rh_s',
  'cnd_ida_t_w', 'cnd_ida_rh_w', 'cnd_ida_t_s', 'cnd_ida_rh_s', 'cnd_ida_rh_min',
  'flw_basis', 'flw_persons', 'flw_q_person', 'flw_area', 'flw_q_area', 'flw_height',
  'flw_ach', 'flw_process_extract', 'flw_q_sens', 'flw_dt_supply', 'flw_supply_override',
  'flw_extract_override', 'flw_balance', 'flw_unbalance_pct', 'flw_min_pct', 'flw_hours',
  'wtw_type', 'wtw_needed', 'wtw_eta', 'wtw_eta_x', 'wtw_frost', 'wtw_frost_limit',
  'sec_mixing', 'sec_mixing_pct', 'air_heat', 'air_cool', 'air_dehum', 'air_humid',
  'air_reheat', 'air_t_reheat', 'air_t_sup_w', 'air_t_sup_s', 'air_rh_leave',
  'bat_face_vel_target', 'cas_face_w', 'cas_face_h', 'fan_esp_sup', 'fan_esp_ext',
  'fan_efficiency', 'com_degree_days'];
const PY_COVERS = ['supply_air_flow', 'extract_air_flow', 'unbalance', 'minimum_flow_at_turndown',
  'air_changes_per_hour', 'flow_per_person', 'outdoor_winter_t', 'outdoor_winter_w',
  'outdoor_winter_h', 'outdoor_summer_t', 'outdoor_summer_w', 'outdoor_summer_h',
  'indoor_winter_t', 'indoor_summer_t', 'recovery_efficiency', 'recovery_moisture_efficiency',
  'exhaust_leaving_temperature', 'frost_risk', 'required_preheat_dT', 'preheater_duty',
  'heating_coil_duty', 'cooling_coil_duty', 'cooling_sensible', 'cooling_latent',
  'sensible_heat_ratio', 'condensate', 'reheat_duty', 'humidifier_water',
  'humidifier_steam_power', 'face_area', 'face_velocity', 'total_pressure_supply',
  'total_pressure_extract', 'fan_power_supply', 'fan_power_extract', 'fan_power_total',
  'sfp_supply', 'sfp_extract', 'sfp_system', 'annual_heat_without_recovery',
  'annual_heat_with_recovery', 'annual_recovery_saving', 'annual_fan_energy'];

function dgcPython() {
  const R = App.R || compute();
  const A = {};
  PY_KEYS.forEach(k => { if (App.A[k] !== undefined && App.A[k] !== '') A[k] = App.A[k]; });
  const given = {
    dp_internal_supply: R.fans.dpInternalSup,
    dp_internal_extract: R.fans.dpInternalExt
  };
  const code =
`A = ${JSON.stringify(A, null, 4).replace(/"/g, "'")}
# taken as given from the module chain the tool assembled at export time — this
# script does NOT rebuild that chain
GIVEN = ${JSON.stringify(given, null, 4).replace(/"/g, "'")}

RA, CPA, CPV, HFG, P0 = 287.042, 1.006, 1.86, 2501.0, 101325.0
WTW_DEFAULT_ETA = {'plaat_kruis': 55, 'plaat_tegenstroom': 80, 'rotor_cond': 78,
                   'rotor_sorptie': 78, 'twincoil': 50, 'warmtepijp': 55, 'geen': 0}
WTW_MOISTURE = {'rotor_sorptie': True}


def num(k, d=0.0):
    v = A.get(k)
    if v is None or v == '':
        return d
    try:
        return float(str(v).replace(',', '.'))
    except ValueError:
        return d


def p_atm(alt):
    return P0 * (1 - 2.25577e-5 * alt) ** 5.2559


def p_ws(t):
    """ASHRAE Fundamentals ch.1 eq. (5) over ice, eq. (6) over liquid water."""
    T = t + 273.15
    if t < 0:
        ln = (-5674.5359 / T + 6.3925247 - 9.677843e-3 * T + 6.2215701e-7 * T * T
              + 2.0747825e-9 * T ** 3 - 9.484024e-13 * T ** 4 + 4.1635019 * math.log(T))
    else:
        ln = (-5800.2206 / T + 1.3914993 - 0.048640239 * T + 4.1764768e-5 * T * T
              - 1.4452093e-8 * T ** 3 + 6.5459673 * math.log(T))
    return math.exp(ln)


def w_from_rh(t, rh, p):
    pw = max(0.0, min(rh / 100.0, 1.0)) * p_ws(t)
    return 0.621945 * pw / max(p - pw, 1.0)


def rh_from_w(t, w, p):
    pw = p * w / (0.621945 + w)
    return max(0.0, min(100.0, 100.0 * pw / p_ws(t)))


def h_of(t, w):
    return CPA * t + w * (HFG + CPV * t)


def t_from_h(h, w):
    return (h - w * HFG) / (CPA + CPV * w)


def v_of(t, w, p):
    return RA * (t + 273.15) * (1 + 1.607858 * w) / p


def dew_point(w, p):
    pw = p * w / (0.621945 + w)
    if pw <= 0:
        return -100.0
    lo, hi = -80.0, 100.0
    for _ in range(80):
        mid = 0.5 * (lo + hi)
        if p_ws(mid) < pw:
            lo = mid
        else:
            hi = mid
    return 0.5 * (lo + hi)


def state(t, rh, p):
    w = w_from_rh(t, rh, p)
    return {'t': t, 'rh': rh, 'w': w, 'h': h_of(t, w), 'v': v_of(t, w, p)}


def state_w(t, w, p):
    return {'t': t, 'rh': rh_from_w(t, w, p), 'w': w, 'h': h_of(t, w), 'v': v_of(t, w, p)}


def mix(s1, m1, s2, m2, p):
    m = m1 + m2
    if m <= 0:
        return s1
    w = (s1['w'] * m1 + s2['w'] * m2) / m
    hh = (s1['h'] * m1 + s2['h'] * m2) / m
    return state_w(t_from_h(hh, w), w, p)


def compute():
    p = p_atm(num('cnd_altitude', 0))
    odaW = state(num('cnd_oda_t_w', -8), num('cnd_oda_rh_w', 90), p)
    odaS = state(num('cnd_oda_t_s', 30), num('cnd_oda_rh_s', 40), p)
    idaW = state(num('cnd_ida_t_w', 21), num('cnd_ida_rh_w', 35), p)
    idaS = state(num('cnd_ida_t_s', 25), num('cnd_ida_rh_s', 55), p)

    basis = A.get('flw_basis', 'personen')
    cand = {'personen': num('flw_persons') * num('flw_q_person', 36),
            'oppervlak': num('flw_area') * num('flw_q_area', 3.6)}
    vol = num('flw_volume') or num('flw_area') * num('flw_height', 3)
    cand['voud'] = vol * num('flw_ach')
    cand['proces'] = num('flw_process_extract')
    dT = num('flw_dt_supply', 8)
    cand['last'] = (num('flw_q_sens') / (1.2 * 1005 * dT)) * 3600 if dT > 0 else 0.0
    supply = round(num('flw_supply_override') or cand.get(basis, 0.0) or 0.0)
    bal = A.get('flw_balance', 'gebalanceerd')
    pct = num('flw_unbalance_pct', 0 if bal == 'gebalanceerd' else 10)
    extract = supply
    if bal == 'overdruk':
        extract = supply * (1 - pct / 100)
    if bal == 'onderdruk':
        extract = supply * (1 + pct / 100)
    extract = round(num('flw_extract_override') or extract)

    typ = A.get('wtw_type', 'plaat_tegenstroom')
    active = typ != 'geen' and A.get('wtw_needed') != 'nee'
    eta = num('wtw_eta', WTW_DEFAULT_ETA.get(typ, 0))
    moist = bool(WTW_MOISTURE.get(typ))
    etaX = num('wtw_eta_x', 65) if (active and moist) else 0.0
    if not active:
        supAfterW, supAfterS = odaW, odaS
        exhaust_out, frost, preheat_dt = None, False, 0.0
    else:
        e, ex = eta / 100.0, etaX / 100.0
        supAfterW = state_w(odaW['t'] + e * (idaW['t'] - odaW['t']),
                            odaW['w'] + ex * (idaW['w'] - odaW['w']), p)
        exhaust_out = idaW['t'] - e * (idaW['t'] - odaW['t'])
        limit = num('wtw_frost_limit', -12 if moist else -1)
        frost = exhaust_out < limit
        preheat_dt = 0.0
        if frost and e > 0:
            preheat_dt = max(0.0, (idaW['t'] - (idaW['t'] - limit) / e) - odaW['t'])
        if odaS['t'] > idaS['t']:
            supAfterS = state_w(odaS['t'] - e * (odaS['t'] - idaS['t']),
                                odaS['w'] - ex * (odaS['w'] - idaS['w']), p)
        else:
            supAfterS = odaS

    share = num('sec_mixing_pct', 0)
    if A.get('sec_mixing') == 'ja' and share > 0:
        f = share / 100.0
        entryW = mix(supAfterW, 1 - f, idaW, f, p)
        entryS = mix(supAfterS, 1 - f, idaS, f, p)
    else:
        entryW, entryS = supAfterW, supAfterS

    vSup = supply / 3600.0
    mW, mS = vSup / entryW['v'], vSup / entryS['v']
    preheat = 0.0
    if preheat_dt > 0 and (A.get('wtw_frost') or 'voorverwarming') == 'voorverwarming':
        preheat = (vSup / odaW['v']) * (CPA + CPV * odaW['w']) * preheat_dt
    tSupW = num('air_t_sup_w', 20)
    heating = 0.0 if A.get('air_heat') == 'nee' else \
        max(0.0, mW * (CPA + CPV * entryW['w']) * (tSupW - entryW['t']))
    heat_leave = state_w(tSupW, entryW['w'], p)
    tSupS = num('air_t_sup_s', 16)
    if A.get('air_cool') == 'nee':
        cooling = sens = lat = cond = 0.0
        shr = 1.0
        cool_leave = entryS
    else:
        w_sat = w_from_rh(tSupS, num('air_rh_leave', 92), p)
        w_leave = entryS['w']
        if A.get('air_dehum') == 'ja' or entryS['w'] > w_sat:
            w_leave = min(entryS['w'], w_sat)
        cool_leave = state_w(tSupS, w_leave, p)
        cooling = max(0.0, mS * (entryS['h'] - cool_leave['h']))
        sens = max(0.0, mS * (CPA + CPV * entryS['w']) * (entryS['t'] - cool_leave['t']))
        lat = max(0.0, cooling - sens)
        cond = max(0.0, mS * (entryS['w'] - w_leave) * 3600.0)
        shr = sens / cooling if cooling > 0 else 1.0
    t_reheat = num('air_t_reheat', 0)
    reheat = (mS * (CPA + CPV * cool_leave['w']) * (t_reheat - tSupS)
              if (A.get('air_reheat') == 'ja' and t_reheat > tSupS) else 0.0)
    if A.get('air_humid') and A.get('air_humid') != 'nee':
        w_target = w_from_rh(num('cnd_ida_t_w', 21), num('cnd_ida_rh_min', 35), p)
        hw = max(0.0, mW * (w_target - heat_leave['w']) * 3600.0)
        hp = max(0.0, mW * (w_target - heat_leave['w']) * HFG) if A.get('air_humid') == 'stoom' else 0.0
    else:
        hw = hp = 0.0

    vt = num('bat_face_vel_target', 2.2)
    area_t = (vSup / vt) if vt > 0 else 0.0
    wIn, hIn = num('cas_face_w'), num('cas_face_h')
    if wIn > 0 and hIn > 0:
        fW, fH = wIn, hIn
    else:
        ratio = num('cas_face_ratio', 1.4)
        fW = math.sqrt(area_t * ratio)
        fH = area_t / max(fW, 1e-6)
    face_area = fW * fH
    face_v = vSup / face_area if face_area > 0 else 0.0

    eta_f = num('fan_efficiency', 0.62)
    dpS = GIVEN['dp_internal_supply'] + num('fan_esp_sup', 250)
    dpE = GIVEN['dp_internal_extract'] + num('fan_esp_ext', 250)
    vExt = extract / 3600.0
    pS = vSup * dpS / eta_f / 1000.0
    pE = vExt * dpE / eta_f / 1000.0
    vRef = max(vSup, vExt)

    hours = num('flw_hours', num('com_hours', 3000))
    dd = num('com_degree_days', 2000)
    cap = vSup * 1.2 * 1.005
    op = min(1.0, hours / 8760.0)

    return {
        'supply_air_flow': supply, 'extract_air_flow': extract,
        'unbalance': supply - extract,
        'minimum_flow_at_turndown': round(supply * num('flw_min_pct', 100) / 100),
        'air_changes_per_hour': (supply / vol) if vol > 0 else None,
        'flow_per_person': (supply / num('flw_persons')) if num('flw_persons') > 0 else None,
        'outdoor_winter_t': odaW['t'], 'outdoor_winter_w': odaW['w'], 'outdoor_winter_h': odaW['h'],
        'outdoor_summer_t': odaS['t'], 'outdoor_summer_w': odaS['w'], 'outdoor_summer_h': odaS['h'],
        'indoor_winter_t': idaW['t'], 'indoor_summer_t': idaS['t'],
        'recovery_efficiency': eta, 'recovery_moisture_efficiency': etaX,
        'exhaust_leaving_temperature': exhaust_out,
        'frost_risk': 1 if frost else 0, 'required_preheat_dT': preheat_dt,
        'preheater_duty': preheat, 'heating_coil_duty': heating,
        'cooling_coil_duty': cooling, 'cooling_sensible': sens, 'cooling_latent': lat,
        'sensible_heat_ratio': shr, 'condensate': cond, 'reheat_duty': reheat,
        'humidifier_water': hw, 'humidifier_steam_power': hp,
        'face_area': face_area, 'face_velocity': face_v,
        'total_pressure_supply': dpS, 'total_pressure_extract': dpE,
        'fan_power_supply': pS, 'fan_power_extract': pE, 'fan_power_total': pS + pE,
        'sfp_supply': (pS * 1000 / vSup) if vSup > 0 else 0.0,
        'sfp_extract': (pE * 1000 / vExt) if vExt > 0 else 0.0,
        'sfp_system': ((pS + pE) * 1000 / vRef) if vRef > 0 else 0.0,
        'annual_heat_without_recovery': cap * dd * 24 * op,
        'annual_heat_with_recovery': cap * dd * 24 * op * (1 - eta / 100.0),
        'annual_recovery_saving': cap * dd * 24 * op * (eta / 100.0),
        'annual_fan_energy': (pS + pE) * hours,
    }`;
  return {
    code,
    requires: [],
    covers: PY_COVERS,
    scope: 'the psychrometrics, air flow and balance, heat recovery with frost limit and ' +
      'preheat, mixing, coil duties with the sensible/latent split and condensate, ' +
      'humidification, face velocity, fan power, the three SFP definitions and the ' +
      'degree-day energy estimate. The module chain that fixes the internal pressure ' +
      'drop is NOT rebuilt: its two pressure drops are carried in as given values.',
    selftest: { tolerance: 1e-9,
      note: 'the script re-evaluates the same closed-form equations, so agreement to 1e-9 relative is expected' }
  };
}

/* ---- cross-tool handoff (SI base units only, §1.5) ---------------------- */
function dgcHandoff() {
  const R = App.R || compute();
  const q = {};
  q.Vdot = { value: R.flow.supply / 3600, unit: 'm3/s' };
  q.T = { value: (R.coils.coolLeave ? R.coils.coolLeave.t : R.coils.tSupS) + 273.15, unit: 'K' };
  q.w = { value: R.coils.coolLeave ? R.coils.coolLeave.w : R.mixed.summer.w, unit: 'kg/kg' };
  q.mdot = { value: R.coils.mDotS, unit: 'kg/s' };
  q.Q = { value: R.coils.cooling * 1000, unit: 'W' };
  q.dp = { value: R.fans.dpTotalSup, unit: 'Pa' };
  return { quantities: q };
}
function dgcApply(payload) {
  const qs = (payload && payload.quantities) || {};
  const accepted = [], ignored = [];
  const setA = (k, v) => { App.A[k] = v; };
  if (qs.Vdot && isFinite(qs.Vdot.value)) {
    setA('flw_supply_override', Math.round(qs.Vdot.value * 3600));
    accepted.push('Vdot');
  }
  if (qs.T && isFinite(qs.T.value)) { setA('air_t_sup_s', qs.T.value - 273.15); accepted.push('T'); }
  if (qs.w && isFinite(qs.w.value)) {
    setA('air_w_leave_override', qs.w.value * 1000); accepted.push('w');
  }
  Object.keys(qs).forEach(k => { if (accepted.indexOf(k) < 0) ignored.push(k); });
  refresh();
  return { accepted, ignored };
}

function dgcInit() {
  if (!window.Diagram || window.__dgcStarted) return;
  window.__dgcStarted = true;
  try {
    window.Diagram.init({
      id: 'luchtgroepselector', file: 'luchtgroepselector.html',
      state: { serialize: dgcState, deserialize: dgcRestore },
      record: dgcRecord,
      /* The result is a chain of closed-form psychrometric and balance steps, so it can
         be reproduced honestly; the module catalogue it needs travels with the script. */
      python: dgcPython,
      handoff: {
        provides: ['Vdot', 'T', 'w', 'Q', 'dp', 'mdot'],
        accepts: ['Vdot', 'T', 'w'],
        build: dgcHandoff, apply: dgcApply
      }
    });
  } catch (e) { }
}
document.addEventListener('DOMContentLoaded', boot);
</script>
