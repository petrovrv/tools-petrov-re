<script type="application/json" id="diagram-tool-manifest">{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision":"2026-08-11.2","id":"luchtgroepselector","file":"luchtgroepselector.html","listed":true,"category":"hvac","order":31,"title":{"en":"Air Handling Unit Specification Aid","uk":"Помічник із завдання на припливно-витяжну установку","de":"Auslegungshilfe Lüftungsgerät (RLT)","nl":"Uitvraag luchtgroep — selectiehulp","fr":"Aide au cahier des charges d’une centrale de traitement d’air","es":"Guía de especificación de climatizadores (UTA)","pl":"Pomoc w specyfikacji centrali wentylacyjnej"},"summary":{"en":"A 216-question specification sheet for an air handling unit, backed by a live calculation.","uk":"Опитувальник із 216 питань для завдання на припливно-витяжну установку, підкріплений живим розрахунком.","de":"Ein Fragenkatalog mit 216 Positionen für die Ausschreibung eines RLT-Geräts, hinterlegt mit einer laufenden Berechnung.","nl":"Een uitvraag van 216 vragen voor een luchtbehandelingskast, onderbouwd met een meelopende berekening.","fr":"Un questionnaire de 216 points pour la spécification d’une centrale de traitement d’air, adossé à un calcul en direct.","es":"Un cuestionario de 216 puntos para especificar un climatizador, respaldado por un cálculo en vivo.","pl":"Kwestionariusz 216 punktów do specyfikacji centrali wentylacyjnej, wspierany bieżącym obliczeniem."},"description":{"en":"A 216-question specification sheet for an air handling unit, backed by a live calculation. Twenty-eight application profiles — from an office to an operating theatre, a swimming pool or a paint line — preset the defaults; psychrometrics after ASHRAE Fundamentals then size the airflow and balance, heat recovery with its frost limit and required preheat, heating and cooling coils with the sensible/latent split and condensate, humidification, face velocity, unit dimensions and mass, and SFP against the Ecodesign limit. Ninety-three rules separate what blocks a design from what merely warns or advises, each with the standard it comes from.","uk":"Опитувальник із 216 питань для завдання на припливно-витяжну установку, підкріплений живим розрахунком. Двадцять вісім профілів застосування — від офісу до операційної, басейну чи фарбувальної лінії — задають початкові значення; психрометрія за ASHRAE Fundamentals далі рахує витрати повітря й баланс, рекуперацію з межею обмерзання та потрібним підігрівом, повітронагрівачі й охолоджувачі з розділенням явної та прихованої теплоти й конденсатом, зволоження, фронтальну швидкість, габарити та масу установки, а також SFP проти межі Ecodesign. Дев’яносто три правила відділяють те, що блокує рішення, від того, що лише попереджає чи радить, і кожне має посилання на норму.","de":"Ein Fragenkatalog mit 216 Positionen für die Ausschreibung eines RLT-Geräts, hinterlegt mit einer laufenden Berechnung. Achtundzwanzig Anwendungsprofile — vom Büro über den OP und das Hallenbad bis zur Lackierstraße — setzen die Vorgabewerte; die Psychrometrie nach ASHRAE Fundamentals ermittelt anschließend Luftmengen und Bilanz, Wärmerückgewinnung mit Frostgrenze und erforderlicher Vorwärmung, Heiz- und Kühlregister mit Aufteilung in sensible und latente Last samt Kondensat, Befeuchtung, Anströmgeschwindigkeit, Gerätemaße und Masse sowie den SFP gegen den Ecodesign-Grenzwert. 93 Regeln trennen, was eine Lösung sperrt, von dem, was nur warnt oder empfiehlt — jeweils mit der Fundstelle in der Norm.","nl":"Een uitvraag van 216 vragen voor een luchtbehandelingskast, onderbouwd met een meelopende berekening. Achtentwintig toepassingsprofielen — van kantoor tot operatiekamer, zwembad of lakstraat — zetten de vertrekwaarden; psychrometrie volgens ASHRAE Fundamentals rekent vervolgens luchtdebiet en balans, warmteterugwinning met vorstgrens en benodigde voorverwarming, verwarmings- en koelbatterijen met de voelbaar/latent-verdeling en condensaat, bevochtiging, frontsnelheid, kastafmetingen en massa, en de SFP tegen de Ecodesign-grens. Drieënnegentig regels scheiden wat een ontwerp blokkeert van wat alleen waarschuwt of adviseert, elk met de norm waar de eis staat.","fr":"Un questionnaire de 216 points pour la spécification d’une centrale de traitement d’air, adossé à un calcul en direct. Vingt-huit profils d’application — du bureau au bloc opératoire, à la piscine ou à la ligne de peinture — fixent les valeurs de départ ; la psychrométrie d’après ASHRAE Fundamentals calcule ensuite les débits et l’équilibre, la récupération avec sa limite de givrage et le préchauffage nécessaire, les batteries chaude et froide avec la répartition sensible/latente et les condensats, l’humidification, la vitesse frontale, les dimensions et la masse de la centrale, et le SFP face à la limite Écoconception. Quatre-vingt-treize règles distinguent ce qui bloque une solution de ce qui se contente d’alerter ou de conseiller, chacune avec sa référence normative.","es":"Un cuestionario de 216 puntos para especificar un climatizador, respaldado por un cálculo en vivo. Veintiocho perfiles de aplicación — de la oficina al quirófano, la piscina o la línea de pintura — fijan los valores de partida; la psicrometría según ASHRAE Fundamentals calcula después los caudales y el balance, la recuperación de calor con su límite de escarcha y el precalentamiento necesario, las baterías de calor y frío con el reparto sensible/latente y el condensado, la humectación, la velocidad frontal, las dimensiones y la masa del equipo, y el SFP frente al límite de Ecodiseño. Noventa y tres reglas separan lo que bloquea una solución de lo que solo advierte o aconseja, cada una con la norma de la que procede.","pl":"Kwestionariusz 216 punktów do specyfikacji centrali wentylacyjnej, wspierany bieżącym obliczeniem. Dwadzieścia osiem profili zastosowań — od biura po salę operacyjną, basen lub linię lakierniczą — ustawia wartości początkowe; psychrometria według ASHRAE Fundamentals następnie wyznacza przepływy i bilans powietrza, odzysk ciepła z granicą oszronienia i wymaganym podgrzewem wstępnym, nagrzewnice i chłodnice z podziałem na obciążenie jawne i utajone oraz kondensat, nawilżanie, prędkość czołową, wymiary i masę centrali oraz SFP względem limitu Ecodesign. 93 reguły rozdzielają warunki blokujące projekt od ostrzeżeń i zaleceń; każda zawiera podstawę normatywną."},"status":"benchmarked","independent_validation":false,"limitations":{"en":"A specification aid, not a selection program. Module pressure drops, casing lengths and recovery efficiencies are single indicative values per component type, scaled from one nominal point by a face-velocity square law; fan power uses one lumped efficiency with no fan curve and no part-load behaviour, so the VAV minimum is captured but never costed. The coil is an enthalpy balance with the leaving state clipped to a fixed apparatus-line humidity rather than an NTU heat-exchanger model, filters are taken at mid-life pressure drop, frost is a fixed temperature threshold, annual energy is a degree-day estimate at design duty, and no acoustic calculation is performed at all. Guaranteed performance, octave-band sound data and final dimensions come from the manufacturer's certified selection software.","uk":"Це помічник для складання завдання, а не програма підбору. Втрати тиску в секціях, довжини модулів і ККД рекуперації — поодинокі орієнтовні значення для типу компонента, перераховані з однієї номінальної точки за квадратичним законом фронтальної швидкості; потужність вентиляторів рахується з єдиним усередненим ККД без аеродинамічної характеристики та без часткових навантажень, тож мінімум VAV фіксується, але не враховується в енергії. Батарея — це ентальпійний баланс із станом на виході, обрізаним за фіксованою вологістю лінії апарата, а не NTU-модель теплообмінника; фільтри беруться за середнім за строком службою опором, обмерзання — фіксований температурний поріг, річна енергія — оцінка за градусо-добами в розрахунковому режимі, а акустичний розрахунок не виконується взагалі. Гарантовані характеристики, октавні спектри шуму та остаточні габарити надає сертифікована програма підбору виробника.","de":"Eine Ausschreibungshilfe, kein Auswahlprogramm. Druckverluste je Modul, Baulängen und Rückgewinnungsgrade sind einzelne Richtwerte je Komponententyp, aus einem Nennpunkt über ein quadratisches Gesetz der Anströmgeschwindigkeit skaliert; die Ventilatorleistung rechnet mit einem einzigen zusammengefassten Wirkungsgrad, ohne Kennlinie und ohne Teillastverhalten, sodass das VAV-Minimum zwar erfasst, aber nie energetisch bewertet wird. Das Register ist eine Enthalpiebilanz, deren Austrittszustand auf eine feste Taupunktlinien-Feuchte begrenzt wird, und kein NTU-Wärmeübertragermodell; Filter werden mit dem mittleren Druckverlust angesetzt, Frost ist eine feste Temperaturschwelle, der Jahresbedarf eine Gradtagschätzung im Auslegungspunkt, und eine akustische Berechnung findet überhaupt nicht statt. Garantierte Leistungen, Oktavband-Schalldaten und endgültige Abmessungen kommen aus der zertifizierten Auswahlsoftware des Herstellers.","nl":"Een hulpmiddel voor de uitvraag, geen selectieprogramma. Drukvallen per module, kastlengtes en terugwinrendementen zijn enkele indicatieve waarden per componenttype, vanaf één nominaal punt geschaald met een kwadratische wet op de frontsnelheid; het ventilatorvermogen rekent met één samengevoegd rendement, zonder ventilatorkarakteristiek en zonder deellastgedrag, waardoor het VAV-minimum wel wordt vastgelegd maar nooit energetisch meetelt. De batterij is een enthalpiebalans waarvan de uittredetoestand wordt afgekapt op een vaste apparaatlijn-vochtigheid, geen NTU-warmtewisselaarmodel; filters worden op halve standtijd gerekend, vorst is een vaste temperatuurdrempel, de jaarenergie een graaddagenschatting bij ontwerpbelasting, en er wordt in het geheel geen akoestische berekening uitgevoerd. Gegarandeerde prestaties, octaafbandgegevens en definitieve maatvoering komen uit de gecertificeerde selectiesoftware van de fabrikant.","fr":"Une aide au cahier des charges, non un programme de sélection. Les pertes de charge par module, les longueurs de caisson et les rendements de récupération sont des valeurs indicatives uniques par type de composant, extrapolées d’un seul point nominal par une loi quadratique en vitesse frontale ; la puissance des ventilateurs repose sur un rendement global unique, sans courbe de ventilateur ni comportement à charge partielle, de sorte que le débit minimal VAV est renseigné mais jamais valorisé. La batterie est un bilan enthalpique dont l’état de sortie est écrêté à une humidité de droite d’appareil fixe, et non un modèle d’échangeur NTU ; les filtres sont pris à mi-encrassement, le givrage est un seuil de température fixe, l’énergie annuelle une estimation en degrés-jours au point de dimensionnement, et aucun calcul acoustique n’est effectué. Les performances garanties, les données acoustiques par bande d’octave et les dimensions définitives proviennent du logiciel de sélection certifié du fabricant.","es":"Una ayuda para redactar la especificación, no un programa de selección. Las pérdidas de carga por módulo, las longitudes de envolvente y los rendimientos de recuperación son valores indicativos únicos por tipo de componente, escalados desde un solo punto nominal mediante una ley cuadrática en la velocidad frontal; la potencia de los ventiladores emplea un rendimiento global único, sin curva de ventilador ni comportamiento a carga parcial, de modo que el caudal mínimo VAV se registra pero nunca se valora energéticamente. La batería es un balance entálpico cuyo estado de salida se recorta a una humedad de línea de aparato fija, y no un modelo de intercambiador NTU; los filtros se toman a media vida, la escarcha es un umbral de temperatura fijo, la energía anual una estimación por grados-día en el punto de diseño, y no se realiza ningún cálculo acústico. Las prestaciones garantizadas, los datos acústicos por banda de octava y las dimensiones definitivas proceden del software de selección certificado del fabricante.","pl":"Pomoc do przygotowania specyfikacji, a nie program doboru. Spadki ciśnienia modułów, długości sekcji i sprawności odzysku są pojedynczymi wartościami orientacyjnymi dla typu komponentu, przeskalowanymi z jednego punktu nominalnego według kwadratowej zależności od prędkości czołowej; moc wentylatorów wykorzystuje jedną sprawność zastępczą, bez charakterystyki wentylatora i bez zachowania przy częściowym obciążeniu, dlatego minimalny przepływ VAV jest rejestrowany, ale nie uwzględniany energetycznie. Model wężownicy jest bilansem entalpii, w którym stan wylotowy ogranicza stała wilgotność linii aparatu, a nie modelem wymiennika NTU; filtry przyjmowane są przy spadku ciśnienia odpowiadającym połowie okresu użytkowania, oszronienie jest stałym progiem temperatury, energia roczna jest szacunkiem stopniodniowym przy obciążeniu projektowym, a obliczeń akustycznych nie wykonuje się. Gwarantowane parametry, dane akustyczne w pasmach oktawowych i ostateczne wymiary pochodzą z certyfikowanego programu doboru producenta."},"intended_use":["education","technical exploration","preliminary assessment"],"catalog_languages":["en","uk","de","nl","fr","es","pl"],"tool_languages":["nl","fr","en","de","ru","uk","pl","es"],"dependencies":["luchtgroepselector-lang-en.json","luchtgroepselector-lang-de.json","luchtgroepselector-lang-fr.json","luchtgroepselector-lang-ru.json","luchtgroepselector-lang-uk.json","luchtgroepselector-lang-pl.json","luchtgroepselector-lang-es.json"],"network_access":{"mode":"same-origin-data","note":"Fetches only its own declared local language files luchtgroepselector-lang-<xx>.json from this site. No external service is contacted and nothing is transmitted."},"validation":{"basis":{"en":"9 of 9 benchmark cases pass. The live calculation is graded NUMERICALLY: 30 complete questionnaire states are driven through the form and every psychrometric state, air flow, recovery temperature, coil duty, condensate flow, face velocity, fan power and SFP is compared with an independent implementation of the ASHRAE Fundamentals ch. 1 formulation and closed-form energy and mass balances; the worst deviation over all quantities and all cases is 6e-16 relative, which is double-precision round-off. A second, structurally different reference — CoolProp 8.0 HAPropsSI (ASHRAE RP-1485 real fluid) — is computed alongside and differs from the declared constant-cp formulation by up to 0.5 % in humidity ratio and 3 % in cooling duty; that spread is reported as the inherent uncertainty of the declared model, never used to grade. The questionnaire itself is checked for DATA INTEGRITY, not physics: question and profile schema, the 93 rules against the catalogue in every language, and the five lazily loaded language packs against the inline Dutch base. The harness is the author's own; no external party has reviewed it.","uk":"9 з 9 випадків пройдено. Живий розрахунок оцінюється ЧИСЕЛЬНО: 30 повних станів опитувальника задаються через форму, і кожен психрометричний стан, витрата повітря, температура після рекуперації, потужність батарей, конденсат, фронтальна швидкість, потужність вентиляторів і SFP порівнюються з незалежною реалізацією формулювання ASHRAE Fundamentals гл. 1 та замкненими балансами енергії й маси; найгірше відхилення — 6e-16 відносних, тобто похибка подвійної точності. Друга, структурно інша еталонна модель — CoolProp 8.0 HAPropsSI (реальний газ за ASHRAE RP-1485) — відрізняється від оголошеного формулювання зі сталими теплоємностями до 0,5 % за вологовмістом і до 3 % за холодильною потужністю; це наводиться як власна невизначеність моделі, а не як помилка. Сам опитувальник перевіряється на ЦІЛІСНІСТЬ ДАНИХ, а не на фізику: схема питань і профілів, 93 правила проти каталогу всіма мовами та п'ять мовних пакетів проти нідерландської основи. Стенд авторський; сторонньої перевірки не було.","de":"9 von 9 Prüffällen bestanden. Die laufende Berechnung wird NUMERISCH geprüft: 30 vollständige Fragebogenzustände werden über das Formular gesetzt, und jeder psychrometrische Zustand, Volumenstrom, jede Temperatur nach der Rückgewinnung, Registerleistung, Kondensatmenge, Anströmgeschwindigkeit, Ventilatorleistung und SFP wird mit einer unabhängigen Umsetzung der ASHRAE-Fundamentals-Formulierung (Kap. 1) und geschlossenen Energie- und Massenbilanzen verglichen; die größte Abweichung beträgt 6e-16 relativ, also Rundung in doppelter Genauigkeit. Als zweite, strukturell andere Referenz wird CoolProp 8.0 HAPropsSI (Realgas nach ASHRAE RP-1485) mitgerechnet; sie weicht von der erklärten Formulierung mit konstanten Wärmekapazitäten um bis zu 0,5 % im Feuchtegehalt und 3 % in der Kühlleistung ab — das ist die modellimmanente Unsicherheit, kein Fehler. Der Fragebogen selbst wird auf DATENINTEGRITÄT geprüft, nicht auf Physik: Schema der Fragen und Profile, die 93 Regeln gegen den Katalog in allen Sprachen und die fünf Sprachpakete gegen die niederländische Basis. Der Prüfstand stammt vom Autor; eine Prüfung durch Dritte gab es nicht.","nl":"9 van 9 toetsgevallen geslaagd. De meelopende berekening wordt NUMERIEK getoetst: 30 volledige uitvraagtoestanden worden via het formulier ingevuld en elke psychrometrische toestand, luchtdebiet, temperatuur na terugwinning, batterijvermogen, condensaatstroom, frontsnelheid, ventilatorvermogen en SFP wordt vergeleken met een onafhankelijke implementatie van de ASHRAE Fundamentals hoofdstuk 1 en gesloten energie- en massabalansen; de grootste afwijking is 6e-16 relatief, oftewel afronding in dubbele precisie. Als tweede, structureel andere referentie loopt CoolProp 8.0 HAPropsSI (reëel gas volgens ASHRAE RP-1485) mee; die wijkt van de aangegeven formulering met constante soortelijke warmten af met maximaal 0,5 % in vochtgehalte en 3 % in koelvermogen — dat is de eigen onzekerheid van het model, geen fout. De uitvraag zelf wordt getoetst op GEGEVENSINTEGRITEIT en niet op fysica: het schema van vragen en profielen, de 93 regels tegen de catalogus in elke taal, en de vijf taalbestanden tegen de Nederlandse basis. De testbank is van de auteur; er was geen beoordeling door derden.","fr":"9 cas de référence sur 9 réussis. Le calcul en direct est contrôlé NUMÉRIQUEMENT : 30 états complets du questionnaire sont saisis dans le formulaire et chaque état psychrométrique, débit d'air, température après récupération, puissance de batterie, débit de condensats, vitesse frontale, puissance des ventilateurs et SFP est comparé à une implémentation indépendante de la formulation ASHRAE Fundamentals ch. 1 et à des bilans fermés d'énergie et de masse ; l'écart maximal est de 6e-16 relatif, soit l'arrondi en double précision. Une seconde référence, structurellement différente — CoolProp 8.0 HAPropsSI (fluide réel ASHRAE RP-1485) — est calculée en parallèle et s'écarte de la formulation à chaleurs massiques constantes annoncée de 0,5 % au plus en teneur en eau et de 3 % en puissance frigorifique ; cet écart est signalé comme l'incertitude propre du modèle, jamais utilisé pour sanctionner. Le questionnaire lui-même est contrôlé en INTÉGRITÉ DES DONNÉES et non en physique : schéma des questions et des profils, les 93 règles face au catalogue dans chaque langue, et les cinq paquets de langue face à la base néerlandaise. Le banc d'essai est celui de l'auteur ; aucun tiers ne l'a examiné.","es":"9 de 9 casos superados. El cálculo en vivo se contrasta NUMÉRICAMENTE: se introducen 30 estados completos del cuestionario en el formulario y cada estado psicrométrico, caudal de aire, temperatura tras la recuperación, potencia de batería, caudal de condensados, velocidad frontal, potencia de los ventiladores y SFP se compara con una implementación independiente de la formulación de ASHRAE Fundamentals cap. 1 y con balances cerrados de energía y masa; la desviación máxima es de 6e-16 relativa, es decir, redondeo en doble precisión. Como segunda referencia, estructuralmente distinta, se calcula CoolProp 8.0 HAPropsSI (fluido real ASHRAE RP-1485), que se aparta de la formulación declarada de calores específicos constantes hasta un 0,5 % en la humedad específica y un 3 % en la potencia frigorífica; ese margen se informa como incertidumbre propia del modelo y nunca se usa para suspender. El cuestionario en sí se comprueba en INTEGRIDAD DE DATOS y no en física: esquema de preguntas y perfiles, las 93 reglas frente al catálogo en cada idioma y los cinco paquetes de idioma frente a la base neerlandesa. El banco de pruebas es del autor; ningún tercero lo ha revisado.","pl":"9 z 9 przypadków benchmarkowych przechodzi pomyślnie. Obliczenie bieżące jest oceniane NUMERYCZNIE: przez formularz przeprowadzanych jest 30 pełnych stanów kwestionariusza, a każdy stan psychrometryczny, przepływ powietrza, temperatura po odzysku, moc wężownic, strumień kondensatu, prędkość czołowa, moc wentylatorów i SFP są porównywane z niezależną implementacją zależności z ASHRAE Fundamentals, rozdz. 1, oraz zamkniętych bilansów energii i masy; największa względna odchyłka dla wszystkich wielkości i przypadków wynosi 6e-16, czyli poziom zaokrągleń podwójnej precyzji. Drugi, strukturalnie odmienny wzorzec — CoolProp 8.0 HAPropsSI (ASHRAE RP-1485, model gazu rzeczywistego) — jest liczony równolegle i różni się od zadeklarowanego modelu ze stałym cp maksymalnie o 0,5% dla wilgotności właściwej i 3% dla mocy chłodniczej; ten rozrzut jest raportowany jako niepewność zadeklarowanego modelu i nie służy do oceny. Sam kwestionariusz jest sprawdzany pod kątem INTEGRALNOŚCI DANYCH, nie fizyki: schemat pytań i profili, 93 reguły względem katalogu w każdym języku oraz leniwie ładowane pakiety językowe względem bazowego języka niderlandzkiego wbudowanego w stronę. Harness testowy jest własny autora; nie był przeglądany przez niezależną stronę."},"independent_validation":false,"benchmarks":[{"id":"live-calculation-and-questionnaire-integrity","reference":"Two halves. NUMERIC: the live calculation behind the questionnaire is graded against an independent implementation of the ASHRAE Handbook Fundamentals (2017) chapter 1 psychrometric formulation and closed-form energy and mass balances (/root/bench/ref/lgs_model.py), and cross-checked against CoolProp 8.0 HAPropsSI (ASHRAE RP-1485 real-fluid humid air); the ASHRAE formulation is the grading reference because it is the one the tool states it implements, and the deviation of the real-fluid model from it is reported as the inherent uncertainty of that choice, never as a tool error. DATA INTEGRITY (this half is not a physics benchmark and is not presented as one): the schema of every question, profile and rule, the absence of any answer key the code reads but the sheet cannot set, and the completeness of the five lazily loaded language packs against the inline Dutch base.","citations":["ASHRAE Handbook - Fundamentals (2017), chapter 1 \"Psychrometrics\": saturation pressure eq. (5) over ice and eq. (6) over liquid water, humidity ratio eq. (20), specific volume eq. (26), enthalpy eq. (30) h = 1.006 t + W(2501 + 1.86 t), thermodynamic wet-bulb eq. (33), standard atmosphere eq. (3).","CoolProp 8.0.0, HAPropsSI humid-air property routines implementing ASHRAE RP-1485 (Herrmann, Kretzschmar & Gatley), used as the second, structurally different reference.","Closed-form balances written independently for this benchmark: dry-air mass flow m = V/v, coil duty Q = m (h_in - h_out), sensible duty Q_s = m (c_pa + c_pv W)(t_in - t_out), condensate = m (W_in - W_out), fan power P = V dp / eta, SFP = P/V.","Commission Regulation (EU) No 1253/2014 (Ecodesign for ventilation units), 2018 tier: the minimum thermal efficiency values the tool holds for regenerative (73 %) and recuperative (68 %) heat recovery."],"cases":9,"passed":9,"tolerance":"NUMERIC half: 2e-6 relative on every psychrometric and thermal quantity. The tool and the reference evaluate the same closed-form ASHRAE equations, so anything above double-precision round-off is a real disagreement; air flows are rounded to whole m3/h by the tool and are compared with an absolute tolerance of 0.5 m3/h for that reason, and the identities that define fan power and SFP are checked at 1e-9. The CoolProp crosscheck is reported, never used to grade: the constant-cp formulation the tool declares differs from the RP-1485 real-fluid model by up to 0.5 % in humidity ratio, 1.3 kJ/kg in enthalpy, 0.09 % in specific volume, 0.011 K in dew point, 0.082 K in wet-bulb temperature and 3 % in cooling duty over the benchmark grid, and that spread is the inherent uncertainty of the declared model rather than an error in it. DATA-INTEGRITY half: exact set equality and zero schema errors, no tolerance at all.","run_at":"2026-10-04T11:42:55.919Z","artifact":"benchmarks/luchtgroepselector.json"}]},"report":{"pdf":true,"source_attribution":true},"python_export":{"supported":true,"requires":[]},"handoff":{"provides":["Vdot","T","w","mdot","Q","dp"],"accepts":["Vdot","T","w"]},"state_codec":{"permalink":true,"record":"tools.petrov.re/calculation-record/v1"},"ui":{"framework":"tools.petrov.re/ui/v1","level":3}}</script>

<script>/* =====================================================================
   LUCHTGROEP-SELECTOR — rekenkern
   Psychrometrie (ASHRAE Fundamentals), luchtdebiet, batterijvermogens,
   warmteterugwinning, vorstgrens, condensaat, frontsnelheid, SFP,

   Alle uitkomsten zijn ONTWERPINDICATIES voor de uitvraag.
   De definitieve selectie gebeurt door de fabrikant met zijn eigen
   selectiesoftware en gecertificeerde prestatiegegevens.
   ===================================================================== */

const PSY = (() => {
  const RA = 287.042;          // J/(kg·K) droge lucht
  const CPA = 1.006;           // kJ/(kg·K)
  const CPV = 1.86;            // kJ/(kg·K)
  const HFG = 2501;            // kJ/kg
  const P0 = 101325;           // Pa op zeeniveau

  /* Barometerdruk op hoogte — ASHRAE (1) */
  function pAtm(alt = 0) { return P0 * Math.pow(1 - 2.25577e-5 * alt, 5.2559); }

  /* Verzadigingsdampdruk [Pa] — ASHRAE (5)/(6) */
  function pWs(t) {
    const T = t + 273.15;
    let ln;
    if (t < 0) {
      ln = -5674.5359 / T + 6.3925247 - 9.677843e-3 * T + 6.2215701e-7 * T * T
        + 2.0747825e-9 * T ** 3 - 9.484024e-13 * T ** 4 + 4.1635019 * Math.log(T);
    } else {
      ln = -5800.2206 / T + 1.3914993 - 0.048640239 * T + 4.1764768e-5 * T * T
        - 1.4452093e-8 * T ** 3 + 6.5459673 * Math.log(T);
    }
    return Math.exp(ln);
  }

  /* Vochtgehalte [kg/kg droge lucht] uit t en RV */
  function wFromRh(t, rh, p = P0) {
    const pw = Math.max(0, Math.min(rh / 100, 1)) * pWs(t);
    return 0.621945 * pw / Math.max(p - pw, 1);
  }

  /* RV [%] uit t en W */
  function rhFromW(t, w, p = P0) {
    const pw = p * w / (0.621945 + w);
    return Math.max(0, Math.min(100, 100 * pw / pWs(t)));
  }

  /* Enthalpie [kJ/kg droge lucht] */
  function h(t, w) { return CPA * t + w * (HFG + CPV * t); }

  /* Temperatuur uit enthalpie en W */
  function tFromH(hh, w) { return (hh - w * HFG) / (CPA + CPV * w); }

  /* Soortelijk volume [m³/kg droge lucht] */
  function v(t, w, p = P0) { return RA * (t + 273.15) * (1 + 1.607858 * w) / p; }

  /* Dichtheid van het vochtige mengsel [kg/m³] */
  function rho(t, w, p = P0) { return (1 + w) / v(t, w, p); }

  /* Dauwpunt [°C] — numerieke inversie van pWs */
  function dewPoint(t, w, p = P0) {
    const pw = p * w / (0.621945 + w);
    if (pw <= 0) return -100;
    let lo = -80, hi = 100;
    for (let i = 0; i < 80; i++) {
      const mid = (lo + hi) / 2;
      if (pWs(mid) < pw) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }

  /* Natteboltemperatuur [°C] — iteratief op de adiabatische verzadigingslijn */
  function wetBulb(t, w, p = P0) {
    let lo = -60, hi = t;
    for (let i = 0; i < 80; i++) {
      const wb = (lo + hi) / 2;
      const ws = wFromRh(wb, 100, p);
      const wCalc = ((HFG - 2.326 * wb) * ws - CPA * (t - wb)) /
        (HFG + CPV * t - 4.186 * wb);
      if (wCalc > w) hi = wb; else lo = wb;
    }
    return (lo + hi) / 2;
  }

  /* Volledige toestand vanuit t + RV */
  function state(t, rh, p = P0) {
    const w = wFromRh(t, rh, p);
    return { t, rh, w, h: h(t, w), v: v(t, w, p), rho: rho(t, w, p), td: dewPoint(t, w, p), twb: wetBulb(t, w, p), p };
  }

  /* Volledige toestand vanuit t + W */
  function stateW(t, w, p = P0) {
    return { t, rh: rhFromW(t, w, p), w, h: h(t, w), v: v(t, w, p), rho: rho(t, w, p), td: dewPoint(t, w, p), twb: wetBulb(t, w, p), p };
  }

  /* Menging van twee luchtstromen op massabasis */
  function mix(s1, m1, s2, m2, p = P0) {
    const m = m1 + m2;
    if (m <= 0) return s1;
    const w = (s1.w * m1 + s2.w * m2) / m;
    const hh = (s1.h * m1 + s2.h * m2) / m;
    return stateW(tFromH(hh, w), w, p);
  }

  return { pAtm, pWs, wFromRh, rhFromW, h, tFromH, v, rho, dewPoint, wetBulb, state, stateW, mix, CPA, CPV, HFG, P0 };
})();

/* =====================================================================
   Rekenkern op basis van de antwoorden
   ===================================================================== */

/* Four answer keys are read by this calculation but have no question in the sheet, so
   they can only arrive with an imported project file or a cross-tool handoff. They are
   listed here so that they are documented rather than hidden, and each has a stated
   fallback that is what the form itself produces:
     flw_volume            room volume [m3]      — falls back to floor area x height
     cas_face_ratio        casing width:height   — falls back to 1.4
     air_w_leave_override  coil leaving W [g/kg] — falls back to the apparatus-line clip
     com_hours             operating hours [h/a] — falls back to flw_hours, then 3000
   ADVANCED_KEYS is exported so a checker can assert that this list is complete. */
const ADVANCED_KEYS = ['flw_volume', 'cas_face_ratio', 'air_w_leave_override', 'com_hours'];

const CALC = (() => {
  const num = (x, d = 0) => {
    const n = typeof x === 'number' ? x : parseFloat(String(x ?? '').replace(',', '.'));
    return Number.isFinite(n) ? n : d;
  };
  const yes = (x) => x === true || x === 'ja' || x === 'yes';

  /* ---- 1. Luchtdebiet ------------------------------------------------ */
  function airflow(A) {
    const basis = A.flw_basis || 'personen';
    const out = { basis, candidates: {} };

    const persons = num(A.flw_persons);
    const qPerson = num(A.flw_q_person, 36);           // m³/h·pers
    out.candidates.personen = persons * qPerson;

    const area = num(A.flw_area);
    const qArea = num(A.flw_q_area, 3.6);              // m³/h·m²
    out.candidates.oppervlak = area * qArea;

    const vol = num(A.flw_volume) || area * num(A.flw_height, 3);
    const ach = num(A.flw_ach);
    out.candidates.voud = vol * ach;
    out.roomVolume = vol;

    out.candidates.proces = num(A.flw_process_extract);

    /* Thermische last → debiet: V = Q / (ρ·cp·ΔT) */
    const qSens = num(A.flw_q_sens);                    // W
    const dT = num(A.flw_dt_supply, 8);                 // K
    out.candidates.last = dT > 0 ? (qSens / (1.2 * 1005 * dT)) * 3600 : 0;

    let supply = num(A.flw_supply_override) || out.candidates[basis] || 0;
    out.supply = Math.round(supply);

    /* Balans */
    const bal = A.flw_balance || 'gebalanceerd';
    const pct = num(A.flw_unbalance_pct, bal === 'gebalanceerd' ? 0 : 10);
    let extract = out.supply;
    if (bal === 'overdruk') extract = out.supply * (1 - pct / 100);
    if (bal === 'onderdruk') extract = out.supply * (1 + pct / 100);
    out.extract = Math.round(num(A.flw_extract_override) || extract);
    out.balance = bal;
    out.unbalance = out.supply - out.extract;

    out.variable = A.flw_variable && A.flw_variable !== 'nee';
    out.minPct = num(A.flw_min_pct, 100);
    out.minFlow = Math.round(out.supply * out.minPct / 100);

    /* Ventilatievoud ter controle */
    out.achResult = vol > 0 ? out.supply / vol : null;
    out.perPerson = persons > 0 ? out.supply / persons : null;
    return out;
  }

  /* ---- 2. Ontwerptoestanden ----------------------------------------- */
  function states(A) {
    const p = PSY.pAtm(num(A.cnd_altitude, 0));
    return {
      p,
      odaW: PSY.state(num(A.cnd_oda_t_w, -8), num(A.cnd_oda_rh_w, 90), p),
      odaS: PSY.state(num(A.cnd_oda_t_s, 30), num(A.cnd_oda_rh_s, 40), p),
      idaW: PSY.state(num(A.cnd_ida_t_w, 21), num(A.cnd_ida_rh_w, 35), p),
      idaS: PSY.state(num(A.cnd_ida_t_s, 25), num(A.cnd_ida_rh_s, 55), p)
    };
  }

  /* ---- 3. Warmteterugwinning ---------------------------------------- */
  const WTW_DEFAULT_ETA = {
    plaat_kruis: 55, plaat_tegenstroom: 80, rotor_cond: 78,
    rotor_sorptie: 78, twincoil: 50, warmtepijp: 55, geen: 0
  };
  const WTW_MOISTURE = {           // vochtoverdracht ja/nee
    plaat_kruis: false, plaat_tegenstroom: false, rotor_cond: false,
    rotor_sorptie: true, twincoil: false, warmtepijp: false, geen: false
  };
  /* Ecodesign (EU) 1253/2014, trap 2018 — minimum temperatuurrendement */
  const ERP_MIN = { regeneratief: 73, recuperatief: 68 };
  const WTW_KIND = {
    plaat_kruis: 'recuperatief', plaat_tegenstroom: 'recuperatief',
    rotor_cond: 'regeneratief', rotor_sorptie: 'regeneratief',
    twincoil: 'recuperatief', warmtepijp: 'recuperatief', geen: null
  };

  function recovery(A, st, flow) {
    const type = A.wtw_type || 'plaat_tegenstroom';
    const r = { type, active: type !== 'geen' && A.wtw_needed !== 'nee' };
    r.kind = WTW_KIND[type];
    r.erpMin = r.kind ? ERP_MIN[r.kind] : null;
    r.eta = num(A.wtw_eta, WTW_DEFAULT_ETA[type] ?? 0);
    r.etaX = r.active && WTW_MOISTURE[type] ? num(A.wtw_eta_x, 65) : 0;
    r.moistureTransfer = WTW_MOISTURE[type];

    if (!r.active) {
      r.supAfterW = st.odaW; r.supAfterS = st.odaS;
      r.frostRisk = false; r.preheat = 0; r.exhaustOut = null;
      return r;
    }

    const e = r.eta / 100, ex = r.etaX / 100;

    /* Winter — toevoerzijde na WTW */
    const tW = st.odaW.t + e * (st.idaW.t - st.odaW.t);
    const wW = st.odaW.w + ex * (st.idaW.w - st.odaW.w);
    r.supAfterW = PSY.stateW(tW, wW, st.p);

    /* Winter — afvoerzijde verlaat de wisselaar (vorstcontrole) */
    const tEha = st.idaW.t - e * (st.idaW.t - st.odaW.t);
    r.exhaustOut = tEha;
    r.exhaustDew = st.idaW.td;
    /* Vorst ontstaat wanneer het afvoeroppervlak onder 0 °C zakt terwijl
       de afvoerlucht condenseert. Rotoren met vochtoverdracht zijn veel
       minder gevoelig; sorptierotoren praktisch ongevoelig. */
    const frostLimit = num(A.wtw_frost_limit, r.moistureTransfer ? -12 : -1);
    r.frostLimitT = frostLimit;
    r.frostRisk = tEha < frostLimit;

    /* Benodigde voorverwarming om de vorstgrens te halen */
    if (r.frostRisk && e > 0) {
      const odaMin = st.idaW.t - (st.idaW.t - frostLimit) / e;
      r.preheatDeltaT = Math.max(0, odaMin - st.odaW.t);
      r.odaMin = odaMin;
    } else { r.preheatDeltaT = 0; }

    /* Zomer — vrije koeling / bypass */
    const bypass = A.wtw_bypass !== 'nee';
    r.bypass = bypass;
    if (st.odaS.t > st.idaS.t) {
      const tS = st.odaS.t - e * (st.odaS.t - st.idaS.t);
      const wS = st.odaS.w - ex * (st.odaS.w - st.idaS.w);
      r.supAfterS = PSY.stateW(tS, wS, st.p);
      r.summerRecovery = true;
    } else {
      r.supAfterS = st.odaS;
      r.summerRecovery = false;
    }
    return r;
  }

  /* ---- 4. Menging (recirculatie) ------------------------------------ */
  function mixing(A, st, rec, flow) {
    const share = num(A.sec_mixing_pct, 0);
    const m = { share, active: A.sec_mixing === 'ja' && share > 0 };
    if (!m.active) { m.winter = rec.supAfterW; m.summer = rec.supAfterS; return m; }
    const f = share / 100;
    m.winter = PSY.mix(rec.supAfterW, 1 - f, st.idaW, f, st.p);
    m.summer = PSY.mix(rec.supAfterS, 1 - f, st.idaS, f, st.p);
    return m;
  }

  /* ---- 5. Batterijen ------------------------------------------------- */
  function coils(A, st, flow, entryW, entryS, rec) {
    const p = st.p;
    /* Massadebiet droge lucht [kg/s] bij toevoerdebiet */
    const vSup = flow.supply / 3600;                    // m³/s
    const mDotW = vSup / entryW.v;
    const mDotS = vSup / entryS.v;

    const c = { mDotW, mDotS, vSup };

    /* Voorverwarmer (vorstbeveiliging) */
    c.preheat = 0;
    if (rec.preheatDeltaT > 0 && (A.wtw_frost || 'voorverwarming') === 'voorverwarming') {
      const mOda = vSup / st.odaW.v;
      c.preheat = mOda * (PSY.CPA + PSY.CPV * st.odaW.w) * rec.preheatDeltaT;
    }

    /* Verwarmingsbatterij: entry → gewenste toevoertemperatuur winter */
    const tSupW = num(A.air_t_sup_w, 20);
    c.tSupW = tSupW;
    c.heating = A.air_heat === 'nee' ? 0 :
      Math.max(0, mDotW * (PSY.CPA + PSY.CPV * entryW.w) * (tSupW - entryW.t));
    c.heatEntry = entryW;
    c.heatLeave = PSY.stateW(tSupW, entryW.w, p);

    /* Koelbatterij: entry → gewenste toevoertoestand zomer */
    const tSupS = num(A.air_t_sup_s, 16);
    c.tSupS = tSupS;
    if (A.air_cool === 'nee') {
      c.cooling = 0; c.coolSens = 0; c.coolLat = 0; c.condensate = 0;
      c.coolEntry = entryS; c.coolLeave = entryS;
    } else {
      /* Verlatende toestand: gevraagde temperatuur, RV begrensd door
         verzadiging langs de apparaatlijn (praktisch 90…95 % RV) */
      const rhLeaveMax = num(A.air_rh_leave, 92);
      const wSatLeave = PSY.wFromRh(tSupS, rhLeaveMax, p);
      let wLeave = entryS.w;
      const needDehum = A.air_dehum === 'ja' || entryS.w > wSatLeave;
      if (needDehum) wLeave = Math.min(entryS.w, wSatLeave);
      if (A.air_w_leave_override) wLeave = num(A.air_w_leave_override) / 1000;

      const leave = PSY.stateW(tSupS, wLeave, p);
      c.coolEntry = entryS; c.coolLeave = leave;
      c.cooling = Math.max(0, mDotS * (entryS.h - leave.h));
      c.coolSens = Math.max(0, mDotS * (PSY.CPA + PSY.CPV * entryS.w) * (entryS.t - leave.t));
      c.coolLat = Math.max(0, c.cooling - c.coolSens);
      c.condensate = Math.max(0, mDotS * (entryS.w - wLeave) * 3600);   // kg/h
      c.shr = c.cooling > 0 ? c.coolSens / c.cooling : 1;
      c.dehumidifying = c.coolLat > 0.01;
    }

    /* Naverwarming na ontvochtiging */
    const tReheat = num(A.air_t_reheat, 0);
    c.reheat = (A.air_reheat === 'ja' && tReheat > c.tSupS)
      ? mDotS * (PSY.CPA + PSY.CPV * c.coolLeave.w) * (tReheat - c.tSupS) : 0;

    /* Bevochtiging */
    if (A.air_humid && A.air_humid !== 'nee') {
      const rhMin = num(A.cnd_ida_rh_min, 35);
      const wTarget = PSY.wFromRh(num(A.cnd_ida_t_w, 21), rhMin, p);
      const wIn = c.heatLeave.w;
      c.humidWater = Math.max(0, mDotW * (wTarget - wIn) * 3600);     // kg/h
      c.humidPower = A.air_humid === 'stoom'
        ? Math.max(0, mDotW * (wTarget - wIn) * PSY.HFG) : 0;         // kW
      c.humidTarget = wTarget;
    } else { c.humidWater = 0; c.humidPower = 0; }

    return c;
  }

  /* ---- 6. Frontsnelheid, afmetingen, massa --------------------------- */
  const MODULE_LENGTH = {           // indicatieve lengte [m]
    mengsectie: 0.5, voorfilter: 0.45, eindfilter: 0.6, koolstoffilter: 0.9,
    hepa: 0.4, plaat_kruis: null, plaat_tegenstroom: null, rotor_cond: 0.5,
    rotor_sorptie: 0.7, twincoil: 0.5, warmtepijp: 0.5, voorverwarmer: 0.3,
    verwarmer: 0.35, koeler: 0.6, naverwarmer: 0.35, bevochtiger: 1.1,
    ventilator: 1.1, geluiddemper: 1.0, lege_sectie: 0.4, meetsectie: 0.3,
    kleppen: 0.25
  };

  function geometry(A, flow, coilsRes, rec) {
    const g = {};
    const vTarget = num(A.bat_face_vel_target, 2.2);         // m/s
    const vSup = flow.supply / 3600;
    g.faceAreaTarget = vTarget > 0 ? vSup / vTarget : 0;

    /* Kastafmetingen: gebruikersinvoer heeft voorrang */
    const wIn = num(A.cas_face_w), hIn = num(A.cas_face_h);
    if (wIn > 0 && hIn > 0) { g.faceW = wIn; g.faceH = hIn; }
    else {
      const ratio = num(A.cas_face_ratio, 1.4);              // b:h
      g.faceW = Math.sqrt(g.faceAreaTarget * ratio);
      g.faceH = g.faceAreaTarget / Math.max(g.faceW, 1e-6);
    }
    g.faceArea = g.faceW * g.faceH;
    g.faceVelocity = g.faceArea > 0 ? vSup / g.faceArea : 0;
    g.faceVelocityExtract = g.faceArea > 0 ? (flow.extract / 3600) / g.faceArea : 0;

    /* Koelbatterij: dezelfde doorsnede tenzij apart opgegeven */
    g.coilFaceVelocity = g.faceVelocity;
    /* Grens voor druppelmeesleep bij natte koeling zonder druppelvanger */
    g.dropletLimit = coilsRes.dehumidifying ? 2.7 : 3.5;

    /* Lengte per luchtstroom; de kast is zo lang als de langste zijde */
    const chain = A.__chain || [];
    const lenOf = (items) => items.reduce((s, m) => {
      let L = MODULE_LENGTH[m.key];
      if (L === null || L === undefined)
        L = m.key.startsWith('plaat') ? Math.max(0.8, g.faceH * 1.1) : 0.4;
      return s + L;
    }, 0);
    const lenSup = lenOf(chain.filter(m => m.side === 'toevoer'));
    const lenExt = lenOf(chain.filter(m => m.side === 'afvoer'));
    g.lengthSupply = lenSup;
    g.lengthExtract = lenExt;
    g.length = Math.max(lenSup, lenExt);

    /* Opbouw: naast elkaar verdubbelt de breedte, gestapeld de hoogte */
    const arr = A.cas_arrangement || 'naast';
    g.arrangement = arr;
    const panels = 0.16;                     // mantel en tussenwand
    g.overallW = (arr === 'naast' ? g.faceW * 2 : g.faceW) + panels;
    g.overallH = (arr === 'gestapeld' ? g.faceH * 2 : g.faceH) + panels;
    g.overallL = g.length;
    /* Wat er werkelijk over de aanvoerweg moet: één dek, één transportsectie */
    g.sectionW = g.faceW + panels;
    g.sectionH = g.faceH + panels;
    g.footprint = g.overallW * g.overallL;

    /* Indicatieve massa: mantel + inbouwdelen */
    const skin = 2 * (g.overallW + g.overallH) * g.overallL;
    g.mass = Math.round(skin * 30 + g.faceArea * 2 * 240 + chain.length * 30);

    /* Transportcontrole */
    g.maxSection = num(A.cas_max_l, 0);
    g.sections = g.maxSection > 0 ? Math.ceil(g.overallL / g.maxSection) : 1;
    /* Zwaarste collo: bij een opbouw naast elkaar reist elk dek apart */
    const decks = arr === 'gescheiden' || arr === 'naast' ? 2 : 1;
    g.sectionMass = Math.round(g.mass / Math.max(1, g.sections * decks) * 1.15);
    /* Benodigde vloer- of dakoppervlakte inclusief servicruimte */
    g.serviceSpace = num(A.cas_service_space, 1.2);
    g.areaNeeded = (g.overallW + g.serviceSpace) * (g.overallL + 0.6);
    return g;
  }

  /* ---- 7. Drukval en SFP -------------------------------------------- */
  /* Beginwaarde van de drukval bij schoon filter respectievelijk schone
     sectie. Voor filters wordt de ontwerpwaarde genomen op het midden van
     de standtijd: begin + (eind − begin)/2. */
  const DP_INTERNAL = {             // indicatieve interne drukval [Pa]
    voorfilter: 80, eindfilter: 110, koolstoffilter: 180, hepa: 250,
    plaat_kruis: 180, plaat_tegenstroom: 240, rotor_cond: 130,
    rotor_sorptie: 160, twincoil: 130, warmtepijp: 140,
    voorverwarmer: 30, verwarmer: 35, koeler: 110, naverwarmer: 35,
    bevochtiger: 60, geluiddemper: 55, kleppen: 20, mengsectie: 25,
    meetsectie: 15, lege_sectie: 5, ventilator: 0
  };
  const IS_FILTER = k => /filter|hepa/.test(k);

  function fans(A, flow, geo, chain) {
    const f = {};
    const vSup = flow.supply / 3600, vExt = flow.extract / 3600;
    const k = geo.faceVelocity > 0 ? Math.pow(geo.faceVelocity / 2.2, 2) : 1;
    const scale = dp => dp * Math.min(Math.max(k, 0.4), 2.5);
    const dirty = num(A.flt_dp_final, 200);

    let dpSup = 0, dpExt = 0;
    chain.forEach(m => {
      let dp = scale(DP_INTERNAL[m.key] ?? 0);
      if (IS_FILTER(m.key)) dp = dp + Math.max(0, dirty - dp) / 2;   // halverwege de standtijd
      if (m.side === 'toevoer') dpSup += dp; else dpExt += dp;
    });
    f.dpInternalSup = Math.round(dpSup);
    f.dpInternalExt = Math.round(dpExt);

    f.espSup = num(A.fan_esp_sup, 250);
    f.espExt = num(A.fan_esp_ext, 250);
    f.dpTotalSup = f.dpInternalSup + f.espSup;
    f.dpTotalExt = f.dpInternalExt + f.espExt;

    const eta = num(A.fan_efficiency, 0.62);      // ventilator × motor × regeling
    f.eta = eta;
    f.powerSup = vSup * f.dpTotalSup / eta / 1000;    // kW
    f.powerExt = vExt * f.dpTotalExt / eta / 1000;
    f.powerTotal = f.powerSup + f.powerExt;

    /* Drie grootheden die vaak door elkaar worden gehaald:
       – sfpSup / sfpExt : per luchtstroom, de gangbare vergelijkingsmaat
       – sfpSystem       : beide ventilatoren op het grootste debiet
       – sfpInt          : alleen de interne drukval, de basis van Ecodesign */
    const vRef = Math.max(vSup, vExt);
    f.sfpSup = vSup > 0 ? f.powerSup * 1000 / vSup : 0;
    f.sfpExt = vExt > 0 ? f.powerExt * 1000 / vExt : 0;
    f.sfpSystem = vRef > 0 ? f.powerTotal * 1000 / vRef : 0;
    f.sfpInt = vRef > 0 ? (vSup * f.dpInternalSup / eta + vExt * f.dpInternalExt / eta) / vRef : 0;
    f.sfp = f.sfpSup;                                  // vergelijkingswaarde
    f.sfpLimit = num(A.fan_sfp_limit, 1500);
    f.sfpOk = f.sfpSup <= f.sfpLimit;
    return f;
  }

  /* ---- 8. Jaarlijkse energie-indicatie -------------------------------- */
  function energy(A, flow, rec, st, fansRes) {
    const hours = num(A.flw_hours, num(A.com_hours, 3000));
    const e = { hours };
    /* Graaddagenbenadering, gecorrigeerd voor de bedrijfstijd.
       De graaddagen gelden voor onafgebroken bedrijf; een installatie die
       3000 uur per jaar draait, ziet daar maar een deel van. Indicatief. */
    const dd = num(A.com_degree_days, 2000);          // K·d, basis 15/15
    const vSup = flow.supply / 3600;
    const capacity = vSup * 1.2 * 1.005;              // kW/K
    const opFraction = Math.min(1, hours / 8760);
    e.heatNoRecovery = capacity * dd * 24 * opFraction;   // kWh/a
    e.heatWithRecovery = e.heatNoRecovery * (1 - rec.eta / 100);
    e.recoverySaving = e.heatNoRecovery - e.heatWithRecovery;
    e.fanEnergy = fansRes.powerTotal * hours;         // kWh/a
    return e;
  }

  return { num, yes, airflow, states, recovery, mixing, coils, geometry, fans, energy, MODULE_LENGTH, DP_INTERNAL, WTW_DEFAULT_ETA, ERP_MIN, WTW_KIND, WTW_MOISTURE };
})();

  intro: 'Het debiet volgt uit de reden waarom er geventileerd wordt. Bepaal eerst die reden — personen, oppervlak, proces of thermische last — en reken dan. Een debiet dat op gevoel wordt gekozen, is de duurste fout in het hele traject.',
  questions: [
    { id: 'flw_basis', type: 'select', label: 'Waarop is het debiet gebaseerd?', default: 'personen',
      options: [{ v: 'personen', l: 'Aantal personen (hygiënisch)' }, { v: 'oppervlak', l: 'Vloeroppervlak' }, { v: 'voud', l: 'Ventilatievoud' }, { v: 'proces', l: 'Procesafzuiging / opgegeven debiet' }, { v: 'last', l: 'Thermische last (all-air)' }],
      help: 'Ventilatievoud is de zwakste basis: het zegt niets over de werkelijke belasting. Gebruik het alleen als het proces geen andere maatstaf geeft. Bij een all-air systeem is de thermische last maatgevend en is het hygiënische debiet slechts een ondergrens.' },
    { id: 'flw_persons', type: 'number', label: 'Aantal personen', unit: 'pers', show: A => A.flw_basis === 'personen', help: 'Ontwerpbezetting, niet de gemiddelde bezetting. Vraag ook naar de piekbezetting en of die gelijktijdig in alle zones optreedt.' },
    { id: 'flw_q_person', type: 'number', label: 'Debiet per persoon', unit: 'm³/h·pers', default: 36, show: A => A.flw_basis === 'personen',
      help: 'EN 16798-1 geeft, afhankelijk van categorie en gebouwemissie, ruwweg 22 tot 50 m³/h per persoon. Controleer welke waarde uw nationale regelgeving oplegt — die is bindend.' },
    { id: 'flw_area', type: 'number', label: 'Vloeroppervlak', unit: 'm²', show: A => ['oppervlak', 'voud'].includes(A.flw_basis) },
    { id: 'flw_q_area', type: 'number', label: 'Debiet per m²', unit: 'm³/h·m²', default: 3.6, show: A => A.flw_basis === 'oppervlak', help: 'Voor kantoren ligt dit rond 3,6 m³/h·m²; voor winkels en horeca fors hoger.' },
    { id: 'flw_height', type: 'number', label: 'Gemiddelde ruimtehoogte', unit: 'm', default: 3, show: A => A.flw_basis === 'voud' },
    { id: 'flw_ach', type: 'number', label: 'Ventilatievoud', unit: '1/h', show: A => A.flw_basis === 'voud', help: 'Bij cleanrooms en operatiekamers is dit wel de juiste maatstaf, omdat de eis daar op verdunning en hersteltijd is gebaseerd.' },
    { id: 'flw_process_extract', type: 'number', label: 'Opgegeven debiet', unit: 'm³/h', show: A => A.flw_basis === 'proces', help: 'Bij procesafzuiging: de som van alle afzuigpunten in de maatgevende bedrijfstoestand, niet de som van alle afzuigpunten die er staan.' },
    { id: 'flw_q_sens', type: 'number', label: 'Voelbare warmtelast', unit: 'W', show: A => A.flw_basis === 'last', help: 'Netto af te voeren voelbare last in de maatgevende toestand: personen, verlichting, apparatuur, zon en transmissie.' },
    { id: 'flw_dt_supply', type: 'number', label: 'Toegestaan temperatuurverschil toevoer', unit: 'K', default: 8, show: A => A.flw_basis === 'last', help: 'Begrensd door de inblaasconfiguratie en het tochtrisico. Meer verschil betekent minder debiet en dus een kleinere kast, maar vraagt een inblaassysteem dat het aankan.' },
    { id: 'flw_supply_override', type: 'number', label: 'Toevoerdebiet — handmatige waarde', unit: 'm³/h', help: 'Vul alleen in als u het berekende debiet wilt overschrijven, bijvoorbeeld omdat het uit een eerdere studie komt.' },
    { id: 'flw_extract_override', type: 'number', label: 'Afvoerdebiet — handmatige waarde', unit: 'm³/h', help: 'Alleen invullen als het afvoerdebiet losstaat van de gekozen balans.' },
    { id: 'flw_balance', type: 'select', label: 'Gewenste luchtbalans', default: 'gebalanceerd',
      options: [{ v: 'gebalanceerd', l: 'Gebalanceerd' }, { v: 'overdruk', l: 'Overdruk in de ruimte' }, { v: 'onderdruk', l: 'Onderdruk in de ruimte' }],
      help: 'De drukhiërarchie beschermt óf het product óf de omgeving. Schone processen staan op overdruk, vervuilende en gevaarlijke processen op onderdruk. Dit is een ontwerpbeslissing die je niet aan de inregelaar overlaat.' },
    { id: 'flw_unbalance_pct', type: 'number', label: 'Onbalans', unit: '%', default: 10, show: A => A.flw_balance !== 'gebalanceerd', help: 'Het debietverschil dat via kieren, sluizen en overstroomroosters moet weglopen. Zonder gedefinieerde overstroomweg wordt dit nooit gehaald.' },
    { id: 'flw_dp_room', type: 'number', label: 'Gevraagd drukverschil met de aangrenzende zone', unit: 'Pa', default: 15, show: A => A.flw_balance !== 'gebalanceerd', help: 'Praktisch bereik 5–20 Pa. Meer dan 25 Pa maakt deuren zwaar en sluizen onwerkbaar.' },
    { id: 'flw_variable', type: 'select', label: 'Variabel debiet?', default: 'nee',
      options: [{ v: 'nee', l: 'Nee — constant debiet' }, { v: 'co2', l: 'Vraaggestuurd op CO₂ of aanwezigheid' }, { v: 'vav', l: 'VAV — variabel per zone' }, { v: 'stappen', l: 'Vaste standen' }],
      help: 'Variabel debiet verlaagt het jaarverbruik sterk, maar stelt eisen aan de ventilatorregeling, aan de meetsecties en aan de stabiliteit van de drukhiërarchie bij deellast.' },
    { id: 'flw_min_pct', type: 'number', label: 'Minimumdebiet', unit: '% van nominaal', default: 40, show: A => A.flw_variable && A.flw_variable !== 'nee', help: 'Onder ongeveer 30 % worden luchtverdeling, warmteterugwinning en drukregeling instabiel. Controleer bij de fabrikant het gegarandeerde regelbereik.' },
    { id: 'flw_hours', type: 'number', label: 'Bedrijfsuren per jaar', unit: 'h', default: 3000, help: 'Bepaalt de terugverdientijd van een hoger rendement en van filters met een lagere drukval.' }
  ]
},
/* ==================================================================== */
{
  id: 'behandeling', title: 'Luchtbehandeling',
  intro: 'Welke bewerkingen moet de lucht ondergaan? Elke bewerking is een module, extra lengte, extra drukval en extra onderhoud. Vraag telkens: is dit werkelijk een eis, of een gewoonte?',
  questions: [
    { id: 'air_heat', type: 'radio', label: 'Verwarmen?', options: YESNO, default: 'ja', help: 'Bijna altijd ja, al was het maar om de toevoerlucht op ruimtetemperatuur te brengen na de warmteterugwinning.' },
    { id: 'air_cool', type: 'radio', label: 'Koelen?', options: YESNO, default: 'ja', help: 'Zonder koeling volgt de toevoertemperatuur in de zomer de buitentemperatuur. Bij een hygiënische installatie kan dat aanvaardbaar zijn; bij een all-air systeem niet.' },
    { id: 'air_dehum', type: 'radio', label: 'Ontvochtigen?', options: YESNO, default: 'nee', help: 'Ontvochtiging vraagt een lagere koelwatertemperatuur en meestal naverwarming. Dit is de belangrijkste kostendrijver aan de koelzijde.' },
    { id: 'air_humid', type: 'select', label: 'Bevochtigen?', default: 'nee',
      options: [{ v: 'nee', l: 'Nee' }, { v: 'stoom', l: 'Stoom (elektrisch of van het net)' }, { v: 'adiabatisch', l: 'Adiabatisch — verdampend' }, { v: 'hogedruk', l: 'Hogedruk verneveling' }],
      help: 'Stoom is isotherm, hygiënisch het eenvoudigst en energetisch het duurst. Adiabatische systemen koelen tegelijk en verbruiken veel minder, maar vragen een waterbehandelings- en beheersplan tegen legionella. Kies bewust — dit is geen detail van de uitvoering.' },
    { id: 'air_reheat', type: 'radio', label: 'Naverwarming na ontvochtiging?', options: YESNO, default: 'nee', show: A => A.air_dehum === 'ja' || A.cnd_rh_control === 'volledig',
      help: 'Wanneer diep gekoeld wordt om te ontvochtigen, is de lucht te koud om in te blazen. Zonder naverwarming is een strakke RV-regeling niet mogelijk. Onderzoek eerst of de naverwarming uit teruggewonnen warmte kan komen in plaats van uit de ketel.' },
    { id: 'air_t_reheat', type: 'number', label: 'Toevoertemperatuur na naverwarming', unit: '°C', default: 20, show: A => A.air_reheat === 'ja' },
    { id: 'air_t_sup_w', type: 'number', label: 'Gevraagde toevoertemperatuur winter', unit: '°C', default: 20, step: 0.5, help: 'Bij inblazen boven ruimteniveau daalt de ventilatie-efficiëntie sterk: warme lucht blijft aan het plafond hangen. Boven ongeveer 3 K boven ruimtetemperatuur is dat een reëel probleem.' },
    { id: 'air_t_sup_s', type: 'number', label: 'Gevraagde toevoertemperatuur zomer', unit: '°C', default: 16, step: 0.5, help: 'Ondergrens volgt uit het tochtrisico en uit het inblaassysteem. Onder 14 °C is condensatie op roosters en kanalen een aandachtspunt.' },
    { id: 'air_rh_leave', type: 'number', label: 'Maximale RV na de koelbatterij', unit: '%', default: 92, help: 'Lucht verlaat een natte batterij vrijwel verzadigd. Deze waarde bepaalt de berekende latente capaciteit; 90–95 % is realistisch.' },
    { id: 'air_ctrl_strategy', type: 'select', label: 'Regelstrategie van de toevoertemperatuur', default: 'cascade',
      options: [{ v: 'constant', l: 'Constante toevoertemperatuur' }, { v: 'ruimte', l: 'Op ruimtetemperatuur' }, { v: 'cascade', l: 'Cascade ruimte → toevoer' }, { v: 'dauwpunt', l: 'Dauwpuntregeling met naverwarming' }, { v: 'compensatie', l: 'Buitentemperatuurgecompenseerd' }],
      help: 'Bepaalt welke voelers waar zitten en hoeveel regelkringen de fabrikant moet leveren. Een dauwpuntregeling is de enige die een strakke RV-band haalt, maar verbruikt structureel meer.' }
  ]
},
/* ==================================================================== */
{
  id: 'wtw', title: 'Warmteterugwinning',
  intro: 'De module met de grootste energetische invloed en de meeste valkuilen. De hoofdvraag is niet "welk rendement", maar "mag er overdracht plaatsvinden tussen afvoer en toevoer" — het antwoord daarop sluit hele types uit.',
  questions: [
    { id: 'wtw_needed', type: 'radio', label: 'Warmteterugwinning toepassen?', options: YESNO, default: 'ja', help: 'Bij energieprestatieplichtige gebouwen is dit wettelijk verplicht. Alleen bij aantoonbaar gevaarlijke of sterk vervuilde afvoerlucht kan ervan worden afgeweken — en dan nog vaak met een twin-coil.' },
    { id: 'wtw_crosscontam', type: 'select', label: 'Is overdracht tussen afvoer- en toevoerlucht toelaatbaar?', default: 'beperkt',
      options: [{ v: 'verboden', l: 'Nee — volledige scheiding vereist' }, { v: 'beperkt', l: 'Beperkte lekkage toelaatbaar' }, { v: 'toegestaan', l: 'Toegestaan' }, { v: 'gewenst', l: 'Vochtoverdracht is juist gewenst' }],
      help: 'Dit is de scharniervraag. Volledige scheiding sluit roterende wisselaars uit en dwingt naar een plaatwisselaar met lekdichte uitvoering of naar een twin-coil. Bij keukens, laboratoria, zwembaden, zorg en de meeste processen is scheiding niet onderhandelbaar.' },
    { id: 'wtw_type', type: 'select', label: 'Type wisselaar', default: 'plaat_tegenstroom',
      options: [
        { v: 'plaat_tegenstroom', l: 'Platenwisselaar — tegenstroom' },
        { v: 'plaat_kruis', l: 'Platenwisselaar — kruisstroom' },
        { v: 'rotor_cond', l: 'Rotor — condensatie (zonder sorptielaag)' },
        { v: 'rotor_sorptie', l: 'Rotor — sorptie / enthalpie' },
        { v: 'twincoil', l: 'Twin-coil — gekoppelde batterijen' },
        { v: 'warmtepijp', l: 'Warmtepijp' },
        { v: 'geen', l: 'Geen warmteterugwinning' }],
      help: 'Tegenstroomplaten halen het hoogste voelbare rendement met volledige scheiding, maar zijn vorstgevoelig en groot. Rotoren zijn compact en hebben het minste vorstprobleem, maar dragen altijd iets over. Twin-coil heeft het laagste rendement maar scheidt volledig en laat toevoer en afvoer fysiek op afstand toe.' },
    { id: 'wtw_eta', type: 'number', label: 'Gevraagd temperatuurrendement', unit: '%', default: 80,
      help: 'Ecodesign (EU 1253/2014) eist sinds 2018 minimaal 73 % voor regeneratieve en 68 % voor recuperatieve systemen, gemeten bij gebalanceerd debiet en droge omstandigheden. Vraag om het rendement bij úw debiet, niet bij het nominale debiet van de wisselaar.' },
    { id: 'wtw_eta_x', type: 'number', label: 'Gevraagd vochtrendement', unit: '%', default: 65, show: A => ['rotor_sorptie'].includes(A.wtw_type), help: 'Alleen sorptierotoren dragen vocht over bij lage buitentemperaturen. Dat verlaagt de bevochtigingsbehoefte fors en elimineert het vorstprobleem vrijwel volledig.' },
    { id: 'wtw_bypass', type: 'radio', label: 'Bypass voor vrije koeling?', options: YESNO, default: 'ja', help: 'Zonder bypass verwarmt de wisselaar in de zomernacht de koele buitenlucht weer op en gaat gratis koeling verloren. Bij een rotor gebeurt dit via toerentalregeling, bij platen via een kleppenbypass.' },
    { id: 'wtw_frost', type: 'select', label: 'Vorstbeveiliging', default: 'voorverwarming',
      options: [{ v: 'voorverwarming', l: 'Voorverwarmingsbatterij' }, { v: 'bypass', l: 'Modulerende bypass' }, { v: 'toeren', l: 'Toerentalverlaging rotor' }, { v: 'debiet', l: 'Debietreductie toevoer' }, { v: 'geen', l: 'Niet nodig' }],
      help: 'Bij een tegenstroomplaat treedt ijsvorming al op rond −3 tot −5 °C buiten. Een modulerende bypass is energetisch het gunstigst maar verlaagt het rendement precies wanneer het het hardst nodig is; een voorverwarmer kost energie maar houdt het rendement op peil. Debietreductie is zelden aanvaardbaar bij een proces.' },
    { id: 'wtw_frost_limit', type: 'number', label: 'Vorstgrens afvoerzijde', unit: '°C', default: -1, show: A => A.wtw_needed !== 'nee', help: 'De temperatuur waarbij de afvoerzijde begint aan te vriezen. Voor droge afvoerlucht ligt die lager dan voor vochtige. Wordt gebruikt om de benodigde voorverwarming te bepalen.' },
    { id: 'wtw_leakage', type: 'select', label: 'Gevraagde lekdichtheid van de wisselaar', default: 'standaard',
      options: [{ v: 'standaard', l: 'Standaard fabrikantuitvoering' }, { v: 'en308', l: 'Aangetoond volgens EN 308 (OACF / EATR)' }, { v: 'lekvrij', l: 'Aantoonbaar lekvrij — dubbelwandig / gescheiden media' }],
      help: 'Vraag naar de gemeten overdrachtsverhouding (EATR) en de luchtverhouding (OACF), niet naar "praktisch lekvrij". Bij een rotor zonder spoelsector en zonder correcte drukverhouding kan de overdracht oplopen tot enkele procenten van het debiet.' },
    { id: 'wtw_purge', type: 'radio', label: 'Spoelsector op de rotor?', options: YESNO, default: 'ja', show: A => String(A.wtw_type || '').startsWith('rotor'), help: 'Een spoelsector verkleint de overdracht sterk, maar werkt alleen bij de juiste onderlinge drukverhouding: de toevoerventilator moet zuigen ten opzichte van de afvoer. Leg die drukvolgorde vast in de uitvraag.' },
    { id: 'wtw_condensate', type: 'radio', label: 'Condensafvoer aan de afvoerzijde voorzien?', options: YESNO, default: 'ja', show: A => String(A.wtw_type || '').startsWith('plaat'), help: 'Bij een plaatwisselaar condenseert de afvoerlucht in de winter. Zonder correcte opvang en sifon loopt dat water in de kast.' }
  ]
},
/* ==================================================================== */
{
  id: 'batterijen', title: 'Batterijen en energieopwekking',
  intro: 'Hier komt de warmtepomp binnen die u al kunt bepalen. Het verschil met een losstaande installatie is dat de temperatuurregimes van batterij en opwekker op elkaar moeten passen — anders haalt geen van beide zijn opgegeven prestatie.',
  questions: [
    { id: 'bat_heat_medium', type: 'select', label: 'Medium verwarmingsbatterij', default: 'water',
      options: [{ v: 'water', l: 'Water' }, { v: 'glycol', l: 'Water/glycol' }, { v: 'wp_condensor', l: 'Warmtepomp — condensor in de kast (DX)' }, { v: 'elektrisch', l: 'Elektrisch' }, { v: 'stoom', l: 'Stoom' }, { v: 'geen', l: 'Geen' }],
      help: 'Bij een warmtepomp als bron is het aanvoerregime laag; dan is de batterij fors groter dan bij een ketel. Een batterij die op 70/50 is geselecteerd, levert op 45/40 ruwweg de helft.' },
    { id: 'bat_heat_tin', type: 'number', label: 'Aanvoertemperatuur verwarming', unit: '°C', default: 45, show: A => ['water', 'glycol', 'stoom'].includes(A.bat_heat_medium), help: 'Geef het werkelijke ontwerpregime, niet het regime van de ketel bij vollast. Bij een warmtepomp is dit vaak 40–50 °C.' },
    { id: 'bat_heat_tout', type: 'number', label: 'Retourtemperatuur verwarming', unit: '°C', default: 40, show: A => ['water', 'glycol'].includes(A.bat_heat_medium), help: 'Een grote spreiding verlaagt het waterdebiet en verbetert het rendement van een warmtepomp; een kleine spreiding vraagt een grotere batterij.' },
    { id: 'bat_heat_glycol_pct', type: 'number', label: 'Glycolpercentage', unit: '%', default: 30, show: A => A.bat_heat_medium === 'glycol', help: 'Glycol verlaagt de warmteoverdracht en verhoogt de drukval. Bij 30 % is de capaciteitsderating ongeveer 5–8 %; laat de fabrikant met het werkelijke mengsel rekenen.' },
    { id: 'bat_cool_medium', type: 'select', label: 'Medium koelbatterij', default: 'koudwater',
      options: [{ v: 'koudwater', l: 'Koud water' }, { v: 'glycol_koud', l: 'Water/glycol' }, { v: 'dx', l: 'Directe expansie (DX)' }, { v: 'geen', l: 'Geen koeling' }],
      help: 'DX in de kast maakt de installatie compact maar bindt de luchtgroep aan één leverancier en brengt koudemiddel in het gebouw — met de bijbehorende verplichtingen.' },
    { id: 'bat_cool_tin', type: 'number', label: 'Aanvoertemperatuur koeling', unit: '°C', default: 7, show: A => ['koudwater', 'glycol_koud'].includes(A.bat_cool_medium), help: 'Voor ontvochtiging is 6–8 °C nodig. Wilt u met een hogetemperatuurkoelmachine of vrije koeling werken (12–18 °C), dan is diepe ontvochtiging niet meer mogelijk — dat is een systeemkeuze, geen batterijkeuze.' },
    { id: 'bat_cool_tout', type: 'number', label: 'Retourtemperatuur koeling', unit: '°C', default: 12, show: A => ['koudwater', 'glycol_koud'].includes(A.bat_cool_medium) },
    { id: 'bat_cool_refr', type: 'select', label: 'Koudemiddel', default: 'R32', show: A => A.bat_cool_medium === 'dx' || A.bat_heat_medium === 'wp_condensor',
      options: [{ v: 'R32', l: 'R32 (A2L)' }, { v: 'R454B', l: 'R-454B (A2L)' }, { v: 'R1234ze', l: 'R-1234ze (A2L)' }, { v: 'R290', l: 'R290 propaan (A3)' }, { v: 'R410A', l: 'R-410A (A1)' }, { v: 'R744', l: 'R-744 CO₂ (A1)' }],
      help: 'A2L en A3 zijn brandbaar. Dat brengt eisen mee uit EN 378 en de F-gasverordening: maximale vulling per ruimte, lekdetectie, ventilatie van de opstellingsruimte en soms een aparte technische ruimte. Vraag de fabrikant om de vullinghoeveelheid vóór u de opstellingsplaats vastlegt.' },
    { id: 'bat_wp_integrated', type: 'select', label: 'Geïntegreerde warmtepomp?', default: 'nee',
      options: [{ v: 'nee', l: 'Nee — externe opwekking' }, { v: 'reversibel', l: 'Ja — reversibel, verwarmen en koelen' }, { v: 'alleen_warmte', l: 'Ja — alleen verwarmen' }, { v: 'wtw_wp', l: 'Warmtepomp op de afvoerlucht' }],
      help: 'Een warmtepomp op de afvoerlucht werkt na de warmteterugwinning en haalt de restwarmte eruit. Dat is energetisch aantrekkelijk maar zet de wisselaar en de warmtepomp in serie op dezelfde bron — laat beide door één partij doorrekenen, anders telt iedereen dezelfde energie twee keer.' },
    { id: 'bat_defrost', type: 'select', label: 'Ontdooiing van de buitenbatterij', default: 'nvt', show: A => A.bat_wp_integrated !== 'nee',
      options: [{ v: 'nvt', l: 'Niet van toepassing' }, { v: 'omkeer', l: 'Cyclusomkering' }, { v: 'warm_gas', l: 'Heetgasontdooiing' }, { v: 'elektrisch', l: 'Elektrisch' }],
      help: 'Tijdens ontdooien levert de warmtepomp geen warmte en soms zelfs koude. Vraag hoe de toevoertemperatuur dan bewaakt wordt en of er een naverwarmer nodig is om de ruimte niet te laten wegzakken.' },
    { id: 'bat_face_vel_target', type: 'number', label: 'Streefwaarde frontsnelheid', unit: 'm/s', default: 2.2, step: 0.1,
      help: 'De belangrijkste dimensioneringsparameter van de hele kast. Rond 2,0–2,5 m/s ligt het optimum tussen kastafmeting en drukval. Boven 2,7 m/s over een natte koelbatterij worden waterdruppels meegesleept, ook mét druppelvanger.' },
    { id: 'bat_droplet', type: 'radio', label: 'Druppelvanger na de koelbatterij?', options: YESNO, default: 'ja', show: A => A.bat_cool_medium !== 'geen', help: 'Verplicht zodra de batterij ontvochtigt. Kost drukval, maar de alternatieven — nat kanaalwerk en microbiële groei — zijn erger.' },
    { id: 'bat_dp_max', type: 'number', label: 'Maximale waterzijdige drukval', unit: 'kPa', default: 30, help: 'Begrenst de pompenergie. Bij lage temperatuurregimes stijgt het waterdebiet en daarmee de drukval kwadratisch — geef de grens expliciet op.' },
    { id: 'bat_drain', type: 'radio', label: 'Batterijen volledig aftapbaar en doorspoelbaar?', options: YESNO, default: 'ja', help: 'Nodig bij vorstrisico en bij onderhoud. Vraag naar de positie van de aftap- en ontluchtingspunten, niet alleen naar de aanwezigheid ervan.' }
  ]
},
/* ==================================================================== */
{
  id: 'filters', title: 'Filtratie',
  intro: 'Filterklassen worden sinds ISO 16890 uitgedrukt in het rendement op een deeltjesfractie, niet meer in F- en G-klassen. Een oude F7 komt ruwweg overeen met ePM1 50–60 %, maar een-op-een omrekenen kan niet.',
  questions: [
    { id: 'flt_sup_pre', type: 'select', label: 'Voorfilter toevoer', options: FILTER_CLASSES, default: 'ePM10_60', help: 'Beschermt de wisselaar en het eindfilter. Zonder voorfilter vervuilt de warmteterugwinning en die is niet of nauwelijks te reinigen.' },
    { id: 'flt_sup_fin', type: 'select', label: 'Eindfilter toevoer', options: FILTER_CLASSES, default: 'ePM1_60', help: 'Bepaalt de geleverde luchtkwaliteit. EN 16798-3 koppelt dit aan de ODA-klasse en de gewenste binnenluchtklasse; bij ODA 2 en normale binnenlucht is ePM1 ≥ 50 % het gebruikelijke minimum.' },
    { id: 'flt_ext', type: 'select', label: 'Filter afvoerzijde', options: FILTER_CLASSES, default: 'ePM10_60', help: 'Beschermt de wisselaar tegen vervuiling vanuit de ruimte. Bij een keuken of een stoffig proces is dit de module die het snelst dichtloopt — vraag naar de toegankelijkheid.' },
    { id: 'flt_hepa', type: 'select', label: 'HEPA-filter', default: 'nee',

    { id: 'flt_carbon', type: 'radio', label: 'Gasfase- of koolstoffilter?', options: YESNO, default: 'nee', help: 'Voor geur, oplosmiddelen, uitlaatgassen of agressieve gassen. Werkt alleen bij voldoende contacttijd: een dunne koolstofmat is symboolbestrijding. Vraag naar de standtijd bij de werkelijke concentratie.' },
    { id: 'flt_depth', type: 'select', label: 'Filteruitvoering', default: 'zak',

      help: 'Zakkenfilters hebben meer standtijd en lagere drukval per m², compactfilters zijn korter. De keuze beïnvloedt de kastlengte en het onderhoudsbudget over de levensduur meer dan de aanschafprijs.' },
    { id: 'flt_dp_final', type: 'number', label: 'Eindstand drukval per filtertrap', unit: 'Pa', default: 200, help: 'De drukval waarbij het filter vervangen wordt. Deze waarde hoort in de ventilatorselectie, anders haalt de installatie het debiet niet meer op het eind van de standtijd.' },
    { id: 'flt_energy_class', type: 'select', label: 'Energieklasse van het filter', default: 'geen_eis',
      options: [{ v: 'geen_eis', l: 'Geen eis' }, { v: 'A+', l: 'Eurovent A+' }, { v: 'A', l: 'Eurovent A' }, { v: 'B', l: 'Eurovent B' }],
      help: 'Het filter is over de levensduur vaak de grootste post in het energieverbruik van de kast. Een klasse hoger verdient zich meestal binnen één standtijd terug.' },
    { id: 'flt_monitor', type: 'select', label: 'Bewaking van de filtervervuiling', default: 'transmitter',

      help: 'Een transmitter maakt vervanging op werkelijke vervuiling mogelijk in plaats van op kalender. Dat scheelt filters én energie en levert het bewijs voor de onderhoudsrapportage.' },
    { id: 'flt_access', type: 'select', label: 'Toegang voor filtervervanging', default: 'zijkant',
      options: [{ v: 'zijkant', l: 'Via inspectiedeur zijkant' }, { v: 'voorzijde', l: 'Via voorzijde' }, { v: 'boven', l: 'Van bovenaf' }],
      help: 'Praktische vraag met grote gevolgen: als er geen ruimte is om het filter uit te nemen, wordt het niet vervangen. Controleer de vrije ruimte naast de kast vóór de bestelling.' },
    { id: 'flt_bypass_class', type: 'select', label: 'Filterbypasslekkage', default: 'F9',
      options: [{ v: 'geen_eis', l: 'Geen eis' }, { v: 'F9', l: 'EN 1886 klasse F9' }, { v: 'F8', l: 'EN 1886 klasse F8' }],

  ]

{
  id: 'ventilatoren', title: 'Ventilatoren',
  intro: 'Zonder de externe drukval van het kanaalnet kan niemand een ventilator selecteren. Dit is het gegeven dat het vaakst ontbreekt in een aanvraag en de vaakste oorzaak van een installatie die zijn debiet niet haalt.',
  questions: [
    { id: 'fan_esp_sup', type: 'number', label: 'Externe drukval toevoerkanaal', unit: 'Pa', default: 250, required: true, help: 'Het volledige kanaalnet vanaf de kast tot en met de roosters, inclusief brandkleppen, regelkleppen en naregelaars. Bij twijfel: laat het doorrekenen. Een marge van 20 % op een gemeten waarde is verstandig; een marge op een geraden waarde is dat niet.' },
    { id: 'fan_esp_ext', type: 'number', label: 'Externe drukval afvoerkanaal', unit: 'Pa', default: 250, required: true, help: 'Idem voor de afvoerzijde, inclusief het buitenrooster en de uitblaas.' },

      help: 'Een ventilatorwand geeft redundantie, een vlakker rendementsverloop bij deellast en een korte kast, maar meer regelcomplexiteit. Riemaandrijving is vrijwel alleen nog zinvol bij zeer hoge drukken of bijzondere temperaturen.' },
    { id: 'fan_redundancy', type: 'select', label: 'Redundantie', default: 'geen',
      options: [{ v: 'geen', l: 'Geen' }, { v: 'n1', l: 'N+1 binnen de ventilatorwand' }, { v: 'dubbel', l: 'Volledig dubbele uitvoering' }],
      help: 'Vraag wat er moet gebeuren bij uitval: mag de installatie stilvallen, of moet er een gereduceerd debiet blijven? Voor een datacenter, een operatiekamer of een proceszone is dat een harde eis.' },
    { id: 'fan_control', type: 'select', label: 'Regeling van de ventilator', default: 'constant_debiet',
      options: [{ v: 'constant_debiet', l: 'Constant debiet' }, { v: 'constante_druk', l: 'Constante kanaaldruk' }, { v: 'co2', l: 'Op luchtkwaliteit (CO₂ / VOC)' }, { v: 'extern', l: 'Extern stuursignaal 0–10 V' }],

    { id: 'fan_sfp_limit', type: 'number', label: 'Maximaal specifiek ventilatorvermogen (SFP)', unit: 'W/(m³/s)', default: 1500, help: 'Let op welke van de drie definities uw bestek bedoelt. Per luchtstroom: het opgenomen vermogen van één ventilator gedeeld door zijn eigen debiet — dat is de waarde waarmee dit blad vergelijkt. Per systeem: beide ventilatoren samen gedeeld door het grootste debiet, dus grofweg het dubbele. SFPint uit de Ecodesign-verordening telt alleen de drukval binnen de kast, zonder kanaalnet. Een lage SFP komt vooral uit een ruime doorsnede en een ruim kanaalnet, niet uit een andere ventilator.' },
    { id: 'fan_power_supply', type: 'select', label: 'Voedingsspanning', default: '400_3_50',

    { id: 'fan_softstart', type: 'radio', label: 'Beperking van de aanloopstroom vereist?', options: YESNO, default: 'nee', help: 'Relevant bij een beperkte aansluitwaarde of bij een noodstroomgroep. EC-ventilatoren hebben doorgaans al een zachte aanloop.' }
