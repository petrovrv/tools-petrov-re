  "description": {
    "en": "Enter the zones of the building (floors, wings) with the number of people present at the same time and the share of women, choose the rule set and the options (urinals, accessible WC, washing taps, showers). Each zone gets the required WCs per sex, urinals, washbasins, taps and showers with the rule that set them; the step chart shows how each code grows with headcount, and the pooled comparison shows what separate sanitary cores cost. Apply writes the inventory into the shared plumbing project, where pipe sizing, drainage and water saving read it.",
    "uk": "Введіть зони будівлі (поверхи, крила) з кількістю людей, присутніх одночасно, і часткою жінок, виберіть набір правил і параметри (пісуари, доступний туалет, крани для миття, душі). Кожна зона отримує необхідну кількість унітазів для кожної статі, пісуарів, умивальників, кранів і душів разом із правилом, яке їх визначило; ступінчастий графік показує, як кожна норма зростає з кількістю людей, а порівняння з об'єднаним вузлом показує ціну окремих санвузлів. Кнопка «Застосувати» записує перелік у спільний проєкт, звідки його беруть розрахунок трубопроводів, каналізації та водозбереження.",

    "uk": "Лише мінімуми побутового забезпечення працівників: відвідувачі, учні, гості, пацієнти й глядачі підпадають під інші правила (BS 6465-1, будівельні норми, галузеві правила) і додаються вручну. Рядки британської таблиці понад 100 осіб, рядки ASR понад 250 працівників і облік доступного туалету понад норму — явні припущення. Відстані, розміри приміщень, приватність і сповивальні столи не перевіряються. Допоміжний засіб проєктування, не замінює норм, консультанта з охорони праці / лікаря з гігієни праці та місцевих органів влади.",

    "pl": "Tylko minima dla pracowników: odwiedzający, uczniowie, goście, pacjenci i widzowie podlegają innym zasadom (BS 6465-1, przepisy budowlane, przepisy branżowe) i są dodawani ręcznie. Wiersze brytyjskie powyżej 100 osób, wiersze ASR powyżej 250 pracowników i liczenie toalety dostępnej ponad normę to jawne założenia. Odległości, wielkość pomieszczeń, prywatność i przewijaki nie są sprawdzane. Pomoc projektowa, nie zastępuje przepisów, służby BHP / lekarza medycyny pracy ani władz lokalnych."

    "benchmarks": [
      {"id": "plbfixtures-method-2026-11-06", "reference": {"en": "90 projects, 184 zones counted on the page. Consistency with the published method (an own Python implementation, not ported from the page): 22 named cases (8 floors vs one pooled core, the urinal floor of 1 WC per 25 men, the same 100 people under three rule sets, sex split, washing taps and showers, rows beyond the tables, accessible WC, table boundaries) and 40 seeded random projects; plus 16 external anchors whose counts were typed in by hand from the cited table rows and reading examples (ASR A4.1 Table 2, Fig. 1 and No. 4 (6) shared rooms up to 9 employees; HSE L24 Tables 1 and 2; Belgian Codex 1 per 15) and 3 Apply cases (existing higher counts are kept, nothing is lowered or deleted, the minimum is stored as workplace_min); plus 5 input-rule cases (a fractional or out-of-range headcount or share of women makes the zone invalid with its error code; it is listed, not rounded and not counted). Round 4 (11 cases, 7 of them anchors): the ASR nine-employee shared-room rule is checked on the whole establishment (two cores of 8 → separate rooms in each), showers or washing requested under ASR or L24 mark the result incomplete with a warning, HSE L24 para 201 dirty-work washbasins (50 women → 5) and para 200 increments above 100 people.", "uk": "90 проєктів, 184 зон, порахованих на сторінці. Узгодженість з опублікованим методом (власна реалізація на Python, не перенесена зі сторінки): 22 іменованих випадків (8 поверхів проти одного спільного вузла, межа 1 унітаз на 25 чоловіків, ті самі 100 людей за трьома наборами правил, поділ за статтю, крани для миття й душі, рядки поза таблицями, доступний туалет, межі таблиць) і 40 псевдовипадкових проєктів; плюс 16 зовнішніх опорних випадків, значення яких введено вручну з наведених рядків таблиць і прикладів читання (ASR A4.1, табл. 2, рис. 1 і п. 4 (6) — спільні приміщення до 9 працівників; HSE L24, табл. 1 і 2; бельгійський Кодекс — 1 на 15) та 3 випадки застосування (більші наявні значення зберігаються, нічого не зменшується й не видаляється, мінімум записується як workplace_min); плюс 5 випадків правил введення (дробова або поза межами кількість людей чи частка жінок робить зону некоректною з кодом помилки; її показано у списку, не округлено й не враховано). Раунд 4 (11 випадків, з них 7 опорних): правило ASR про спільні приміщення до дев’яти працівників перевіряється для всього підприємства (два вузли по 8 → окремі приміщення в кожному), душі чи миття, запитані за ASR або L24, позначають результат як неповний із попередженням, умивальники HSE L24 п. 201 для брудної роботи (50 жінок → 5) і приріст за п. 200 понад 100 осіб.", "de": "90 Projekte, 184 auf der Seite gezählte Zonen. Übereinstimmung mit der veröffentlichten Methode (eigene Python-Umsetzung, nicht aus der Seite übernommen): 22 benannte Fälle (8 Geschosse gegen einen gemeinsamen Kern, Untergrenze 1 Toilette je 25 Männer, dieselben 100 Personen nach drei Regelwerken, Aufteilung nach Geschlecht, Waschplätze und Duschen, Zeilen jenseits der Tabellen, barrierefreie Toilette, Tabellengrenzen) und 40 Zufallsprojekte mit festem Startwert; dazu 16 externe Ankerfälle, deren Anzahlen von Hand aus den zitierten Tabellenzeilen und Ablesebeispielen übernommen wurden (ASR A4.1 Tabelle 2, Abb. 1 und Nr. 4 Abs. 6 gemeinsame Räume bis 9 Beschäftigte; HSE L24 Tabellen 1 und 2; belgischer Codex 1 je 15) sowie 3 Übernahme-Fälle (höhere vorhandene Anzahlen bleiben, nichts wird verringert oder gelöscht, das Minimum steht in workplace_min); dazu 5 Fälle zu Eingaberegeln (eine gebrochene oder außerhalb des Bereichs liegende Personenzahl oder ein solcher Frauenanteil macht die Zone mit ihrem Fehlercode ungültig; sie wird aufgeführt, nicht gerundet und nicht gezählt). Runde 4 (11 Fälle, davon 7 Anker): die ASR-Regel gemeinsamer Räume bis neun Beschäftigte wird für den ganzen Betrieb geprüft (zwei Kerne mit je 8 → getrennte Räume in jedem), unter ASR oder L24 angeforderte Duschen oder Waschplätze markieren das Ergebnis mit Warnung als unvollständig, Waschbecken nach HSE L24 Abs. 201 bei schmutzender Arbeit (50 Frauen → 5) und Zuschläge nach Abs. 200 über 100 Personen.", "nl": "90 projecten, 184 op de pagina getelde zones. Overeenstemming met de gepubliceerde methode (eigen Python-implementatie, niet overgenomen van de pagina): 22 benoemde gevallen (8 verdiepingen tegenover één gezamenlijke kern, de grens van 1 wc per 25 mannen, dezelfde 100 mensen volgens drie regelkaders, verdeling naar geslacht, waskranen en douches, rijen buiten de tabellen, toegankelijk toilet, tabelgrenzen) en 40 willekeurige projecten met vaste startwaarde; plus 16 externe ankergevallen waarvan de aantallen met de hand uit de geciteerde tabelrijen en leesvoorbeelden zijn overgenomen (ASR A4.1 tabel 2, afb. 1 en nr. 4 (6) gedeelde ruimten tot 9 werknemers; HSE L24 tabellen 1 en 2; Belgische Codex 1 per 15) en 3 toepassingsgevallen (hogere bestaande aantallen blijven, niets wordt verlaagd of gewist, het minimum staat in workplace_min); plus 5 gevallen voor invoerregels (een gebroken of buiten het bereik liggend aantal personen of aandeel vrouwen maakt de zone ongeldig met haar foutcode; ze wordt vermeld, niet afgerond en niet geteld). Ronde 4 (11 gevallen, waarvan 7 ankers): de ASR-regel voor gedeelde ruimten tot negen werknemers wordt voor de hele onderneming getoetst (twee kernen van 8 → gescheiden ruimten in elk), douches of wassen gevraagd onder ASR of L24 markeren het resultaat met een waarschuwing als onvolledig, wastafels volgens HSE L24 par. 201 bij vuil werk (50 vrouwen → 5) en toeslagen volgens par. 200 boven 100 personen.", "fr": "90 projets, 184 zones comptées sur la page. Cohérence avec la méthode publiée (implémentation Python propre, non reprise de la page) : 22 cas nommés (8 étages contre un noyau unique, le plancher de 1 WC pour 25 hommes, les mêmes 100 personnes selon trois référentiels, répartition par sexe, robinets de lavage et douches, lignes au-delà des tableaux, WC accessible, bornes des tableaux) et 40 projets aléatoires à graine fixe ; plus 16 points d’ancrage externes dont les nombres ont été saisis à la main depuis les lignes de tableau et exemples de lecture cités (ASR A4.1 tableau 2, fig. 1 et n° 4 (6) locaux communs jusqu’à 9 salariés ; HSE L24 tableaux 1 et 2 ; Code belge 1 pour 15) et 3 cas d’application (les nombres existants plus élevés sont conservés, rien n’est réduit ni supprimé, le minimum est enregistré dans workplace_min); plus 5 cas de règles de saisie (un effectif fractionnaire ou hors plage, ou une telle part de femmes, rend la zone invalide avec son code d’erreur ; elle est listée, ni arrondie ni comptée). Tour 4 (11 cas, dont 7 ancrages) : la règle ASR des locaux communs jusqu’à neuf salariés est vérifiée sur tout l’établissement (deux noyaux de 8 → locaux séparés dans chacun), des douches ou un lavage demandés sous ASR ou L24 marquent le résultat incomplet avec un avertissement, lavabos HSE L24 § 201 pour travail salissant (50 femmes → 5) et incréments du § 200 au-delà de 100 personnes.", "es": "90 proyectos, 184 zonas contadas en la página. Coherencia con el método publicado (implementación propia en Python, no copiada de la página): 22 casos con nombre (8 plantas frente a un núcleo único, el límite de 1 inodoro por cada 25 hombres, las mismas 100 personas según tres conjuntos de reglas, reparto por sexo, grifos de aseo y duchas, filas fuera de las tablas, aseo accesible, límites de tabla) y 40 proyectos aleatorios con semilla fija; más 16 anclajes externos cuyos números se introdujeron a mano a partir de las filas de tabla y ejemplos de lectura citados (ASR A4.1 tabla 2, fig. 1 y n.º 4 (6) locales compartidos hasta 9 trabajadores; HSE L24 tablas 1 y 2; Código belga 1 por 15) y 3 casos de aplicación (las cantidades existentes mayores se mantienen, no se reduce ni se borra nada, el mínimo se guarda en workplace_min); más 5 casos de reglas de entrada (un número de personas fraccionario o fuera de rango, o una proporción de mujeres así, invalida la zona con su código de error; se lista, no se redondea ni se cuenta). Ronda 4 (11 casos, 7 de ellos anclajes): la regla ASR de locales compartidos hasta nueve trabajadores se comprueba para todo el establecimiento (dos núcleos de 8 → locales separados en cada uno), las duchas o el aseo solicitados con ASR o L24 marcan el resultado como incompleto con un aviso, lavabos HSE L24 párr. 201 para trabajo sucio (50 mujeres → 5) e incrementos del párr. 200 por encima de 100 personas.", "pl": "90 projektów, 184 stref policzonych na stronie. Zgodność z opublikowaną metodą (własna implementacja w Pythonie, nieprzeniesiona ze strony): 22 nazwanych przypadków (8 kondygnacji wobec jednego wspólnego węzła, granica 1 miski na 25 mężczyzn, te same 100 osób według trzech przepisów, podział według płci, krany do mycia i natryski, wiersze poza tabelami, toaleta dostępna, granice tabel) i 40 losowych projektów ze stałym ziarnem; plus 16 zewnętrznych punktów kontrolnych, których liczby wpisano ręcznie z cytowanych wierszy tabel i przykładów odczytu (ASR A4.1 tabela 2, rys. 1 i nr 4 ust. 6 — wspólne pomieszczenia do 9 pracowników; HSE L24 tabele 1 i 2; belgijski Kodeks 1 na 15) oraz 3 przypadki zastosowania (wyższe istniejące liczby zostają, nic nie jest zmniejszane ani usuwane, minimum zapisano jako workplace_min); plus 5 przypadków reguł wprowadzania (ułamkowa lub spoza zakresu liczba osób albo taki udział kobiet unieważnia strefę z kodem błędu; jest ona wymieniona, nie zaokrąglana i nie liczona). Runda 4 (11 przypadków, w tym 7 kontrolnych): reguła ASR wspólnych pomieszczeń do dziewięciu pracowników jest sprawdzana dla całego zakładu (dwa węzły po 8 → oddzielne pomieszczenia w każdym), natryski lub mycie żądane przy ASR lub L24 oznaczają wynik jako niepełny z ostrzeżeniem, umywalki wg HSE L24 pkt 201 przy pracy brudzącej (50 kobiet → 5) i przyrosty wg pkt 200 powyżej 100 osób."}, "citations": ["Codex over het welzijn op het werk,   'f.asrshared': T7('Up to 9 employees: shared toilets (ASR A4.1 Nr. 4 (6))', 'До 9 працівників: спільні туалети (ASR A4.1 п. 4 (6))', 'Bis 9 Beschäftigte: gemeinsame Toiletten (ASR A4.1 Nr. 4 Abs. 6)', 'Tot 9 werknemers: gedeelde toiletten (ASR A4.1 nr. 4 (6))', 'Jusqu’à 9 salariés : toilettes communes (ASR A4.1 n° 4 (6))', 'Hasta 9 trabajadores: aseos compartidos (ASR A4.1 n.º 4 (6))', 'Do 9 pracowników: wspólne toalety (ASR A4.1 nr 4 ust. 6)'),
  'f.asrshared.h': T7('Allowed only if time-separated use by women and men is ensured, and only when the whole project (one establishment, all zones) has at most 9 persons.', 'Дозволено лише за умови розділеного в часі користування жінками й чоловіками і лише якщо в усьому проєкті (одне підприємство, усі зони) не більше 9 осіб.', 'Nur zulässig, wenn die zeitlich getrennte Nutzung durch Frauen und Männer sichergestellt ist, und nur wenn das ganze Projekt (ein Betrieb, alle Zonen) höchstens 9 Personen hat.', 'Alleen toegestaan als gescheiden gebruik in de tijd door vrouwen en mannen verzekerd is, en alleen als het hele project (één onderneming, alle zones) hoogstens 9 personen telt.', 'Admis seulement si l\'utilisation séparée dans le temps par les femmes et les hommes est assurée, et seulement si tout le projet (un établissement, toutes les zones) compte au plus 9 personnes.', 'Solo se permite si se garantiza el uso separado en el tiempo por mujeres y hombres, y solo si todo el proyecto (un establecimiento, todas las zonas) tiene como máximo 9 personas.', 'Dozwolone tylko przy zapewnionym rozdzielonym w czasie korzystaniu przez kobiety i mężczyzn i tylko wtedy, gdy cały projekt (jeden zakład, wszystkie strefy) ma najwyżej 9 osób.'),
  'nt.asr_shared_small': T7('ASR A4.1 Nr. 4 (6): up to nine employees one shared toilet set (Table 2 row for all persons), provided time-separated use is ensured.', 'ASR A4.1 п. 4 (6): до дев’яти працівників — один спільний комплект туалетів (рядок табл. 2 для всіх осіб) за умови розділеного в часі користування.', 'ASR A4.1 Nr. 4 Abs. 6: bis neun Beschäftigte ein gemeinsamer Toilettenbereich (Zeile der Tabelle 2 für alle Personen), sofern eine zeitlich getrennte Nutzung sichergestellt ist.', 'ASR A4.1 nr. 4 (6): tot negen werknemers één gedeelde toiletgroep (rij van tabel 2 voor alle personen), mits gescheiden gebruik in de tijd verzekerd is.', 'ASR A4.1 n° 4 (6) : jusqu’à neuf salariés, un seul ensemble de toilettes commun (ligne du tableau 2 pour toutes les personnes), si une utilisation séparée dans le temps est assurée.', 'ASR A4.1 n.º 4 (6): hasta nueve trabajadores, un único conjunto de aseos compartido (fila de la tabla 2 para todas las personas), si se garantiza un uso separado en el tiempo.', 'ASR A4.1 nr 4 ust. 6: do dziewięciu pracowników jeden wspólny zespół toalet (wiersz tabeli 2 dla wszystkich osób), o ile zapewniono rozdzielone w czasie korzystanie.'),
  'nt.asr_shared_over9': T7('More than nine persons in the establishment (all zones of the project together): ASR A4.1 Nr. 4 (6) does not apply, separate rooms for women and men are counted in every zone.', 'Понад дев’ять осіб на підприємстві (усі зони проєкту разом): ASR A4.1 п. 4 (6) не застосовується, у кожній зоні пораховано окремі приміщення для жінок і чоловіків.', 'Mehr als neun Beschäftigte im Betrieb (alle Zonen des Projekts zusammen): ASR A4.1 Nr. 4 Abs. 6 gilt nicht, in jeder Zone werden getrennte Räume für Frauen und Männer gezählt.', 'Meer dan negen personen in de onderneming (alle zones van het project samen): ASR A4.1 nr. 4 (6) geldt niet, in elke zone worden gescheiden ruimten voor vrouwen en mannen geteld.', 'Plus de neuf personnes dans l\'établissement (toutes les zones du projet ensemble) : l\'ASR A4.1 n° 4 (6) ne s\'applique pas, des locaux séparés femmes / hommes sont comptés dans chaque zone.', 'Más de nueve personas en el establecimiento (todas las zonas del proyecto juntas): no se aplica ASR A4.1 n.º 4 (6); en cada zona se cuentan locales separados para mujeres y hombres.', 'Więcej niż dziewięć osób w zakładzie (wszystkie strefy projektu razem): ASR A4.1 nr 4 ust. 6 nie ma zastosowania, w każdej strefie liczone są oddzielne pomieszczenia dla kobiet i mężczyzn.'),

  /* notes per rule */
  'nt.be_urinal_floor': T7('Belgium: urinals replace men\'s WCs only down to 1 WC per 25 men present.', 'Бельгія: пісуари замінюють чоловічі унітази лише до межі 1 унітаз на 25 присутніх чоловіків.', 'Belgien: Urinale ersetzen Herrentoiletten nur bis auf 1 Toilette je 25 anwesende Männer.', 'België: urinoirs vervangen herentoiletten slechts tot 1 wc per 25 aanwezige mannen.', 'Belgique : les urinoirs ne remplacent les WC hommes que jusqu\'à 1 WC pour 25 hommes présents.', 'Bélgica: los urinarios sustituyen inodoros de hombres solo hasta 1 inodoro por cada 25 hombres presentes.', 'Belgia: pisuary zastępują męskie miski tylko do granicy 1 miska na 25 obecnych mężczyzn.'),
  'nt.be_separation': T7('Belgium: men\'s and women\'s toilets fully separated; gender-neutral toilets only in addition, after consulting the occupational physician and the committee for prevention and protection.', 'Бельгія: чоловічі й жіночі туалети повністю розділені; універсальні туалети — лише додатково, після консультації з лікарем з гігієни праці та комітетом з профілактики і захисту.', 'Belgien: Herren- und Damentoiletten vollständig getrennt; genderneutrale Toiletten nur zusätzlich, nach Anhörung des Arbeitsmediziners und des Ausschusses für Gefahrenverhütung und Schutz.', 'België: heren- en damestoiletten volledig gescheiden; genderneutrale toiletten alleen extra, na raadpleging van de preventieadviseur-arbeidsarts en het CPBW.', 'Belgique : toilettes hommes et femmes entièrement séparées ; toilettes neutres seulement en sus, après consultation du conseiller en prévention-médecin du travail et du CPPT.', 'Bélgica: aseos de hombres y mujeres totalmente separados; aseos neutros solo adicionales, previa consulta al médico del trabajo y al comité de prevención y protección.', 'Belgia: toalety męskie i damskie całkowicie oddzielone; toalety neutralne płciowo tylko dodatkowo, po konsultacji z lekarzem medycyny pracy i komitetem ds. prewencji i ochrony.'),
  'nt.washing_per3': T7('Washing taps: 1 per 3 workers ending work at the same time — they follow the shift end, not the headcount.', 'Крани для миття: 1 на 3 працівників, що одночасно закінчують роботу, — вони залежать від кінця зміни, а не від чисельності.', 'Waschplätze: 1 je 3 gleichzeitig endende Beschäftigte — sie folgen dem Schichtende, nicht der Kopfzahl.', 'Waskranen: 1 per 3 werknemers die tegelijk stoppen — ze volgen het einde van de ploeg, niet het aantal personen.', 'Robinets de lavage : 1 pour 3 travailleurs finissant en même temps — ils suivent la fin de poste, pas l\'effectif.', 'Grifos de aseo: 1 por cada 3 trabajadores que terminan a la vez — siguen el fin de turno, no la plantilla.', 'Krany do mycia: 1 na 3 pracowników kończących pracę jednocześnie — zależą od końca zmiany, nie od liczby zatrudnionych.'),
  'nt.washing_per5': T7('1 tap per 5 workers only when the nature of the work justifies it and the committee for prevention and protection agrees.', '1 кран на 5 працівників лише тоді, коли це виправдано характером роботи і комітет з профілактики і захисту погоджується.', '1 Waschplatz je 5 Beschäftigte nur, wenn die Art der Arbeit es rechtfertigt und der Ausschuss zustimmt.', '1 kraan per 5 werknemers alleen als de aard van het werk het rechtvaardigt en het CPBW akkoord is.', '1 robinet pour 5 travailleurs seulement si la nature du travail le justifie et que le CPPT est d\'accord.', '1 grifo por cada 5 trabajadores solo si la naturaleza del trabajo lo justifica y el comité está de acuerdo.', '1 kran na 5 pracowników tylko wtedy, gdy uzasadnia to charakter pracy i komitet się zgadza.'),
  'nt.showers_per6': T7('Showers: 1 per group of 6 workers ending work at the same time (heat, soiling work, dangerous chemical or biological agents).', 'Душі: 1 на групу з 6 працівників, що одночасно закінчують роботу (спека, брудна робота, небезпечні хімічні чи біологічні агенти).', 'Duschen: 1 je Gruppe von 6 gleichzeitig endenden Beschäftigten (Hitze, schmutzende Arbeit, gefährliche chemische oder biologische Stoffe).', 'Douches: 1 per groep van 6 werknemers die tegelijk stoppen (hitte, bevuilend werk, gevaarlijke chemische of biologische agentia).', 'Douches : 1 par groupe de 6 travailleurs finissant ensemble (chaleur, travail salissant, agents chimiques ou biologiques dangereux).', 'Duchas: 1 por cada grupo de 6 trabajadores que terminan a la vez (calor, trabajo que ensucia, agentes químicos o biológicos peligrosos).', 'Natryski: 1 na grupę 6 pracowników kończących pracę jednocześnie (upał, praca brudząca, niebezpieczne czynniki chemiczne lub biologiczne).'),
  'nt.asr_urinal_recommended': T7('ASR: for a small male group one urinal in addition to the toilet is recommended (not counted).', 'ASR: для невеликої групи чоловіків рекомендовано один пісуар на додачу до унітаза (не враховано).', 'ASR: für eine kleine Männergruppe wird zusätzlich zur Toilette 1 Urinal empfohlen (nicht gezählt).', 'ASR: voor een kleine groep mannen wordt naast het toilet 1 urinoir aanbevolen (niet geteld).', 'ASR : pour un petit groupe d\'hommes, un urinoir en plus du WC est recommandé (non compté).', 'ASR: para un grupo pequeño de hombres se recomienda un urinario además del inodoro (no contado).', 'ASR: dla małej grupy mężczyzn zaleca się dodatkowo 1 pisuar oprócz miski (nie liczono).'),
  'nt.asr_beyond_250': T7('ASR above 250 persons: the table\'s "each further 30 / 90" row is applied — verify against the official text.', 'ASR понад 250 осіб: застосовано рядок таблиці «кожні наступні 30 / 90» — звірте з офіційним текстом.', 'ASR über 250 Personen: die Zeile „je weitere 30 / 90“ wird angewendet — mit dem amtlichen Text abgleichen.', 'ASR boven 250 personen: de rij "per volgende 30 / 90" wordt toegepast — controleer met de officiële tekst.', 'ASR au-delà de 250 personnes : la ligne « par tranche supplémentaire de 30 / 90 » est appliquée — à vérifier sur le texte officiel.', 'ASR por encima de 250 personas: se aplica la fila «por cada 30 / 90 adicionales» — verifíquelo con el texto oficial.', 'ASR powyżej 250 osób: zastosowano wiersz „za każde kolejne 30 / 90” — sprawdź z tekstem urzędowym.'),
  'nt.asr_high': T7('High simultaneity (breaks at fixed times) needs more places than the same headcount with spread-out breaks.', 'Висока одночасність (перерви у фіксований час) потребує більше місць, ніж та сама кількість людей з розосередженими перервами.', 'Hohe Gleichzeitigkeit (Pausen zu festen Zeiten) braucht mehr Plätze als dieselbe Kopfzahl mit verteilten Pausen.', 'Hoge gelijktijdigheid (pauzes op vaste tijden) vraagt meer plaatsen dan hetzelfde aantal met gespreide pauzes.', 'Une simultanéité élevée (pauses à heures fixes) demande plus de places que le même effectif aux pauses étalées.', 'La simultaneidad alta (pausas a horas fijas) necesita más plazas que la misma plantilla con pausas repartidas.', 'Wysoka jednoczesność (przerwy o stałych porach) wymaga więcej miejsc niż ta sama liczba osób z rozłożonymi przerwami.'),
  'nt.wash_not_in_method': T7('Incomplete result: the requested showers or washing places have no rule in this tool for the chosen rule set and are NOT included in the minimum — size them from its wash-room rules (ASR A4.1 Nr. 6, Tables 4, 5.1, 5.2; HSE L24: showers where the nature of the work requires them).', 'Неповний результат: для запитаних душів або місць для миття вибраний набір правил у цьому інструменті не має правила, тож їх НЕ включено до мінімуму — визначте їх за вимогами до умивалень (ASR A4.1 п. 6, табл. 4, 5.1, 5.2; HSE L24: душі, якщо цього вимагає характер роботи).', 'Unvollständiges Ergebnis: für die angeforderten Duschen oder Waschplätze enthält das Werkzeug zum gewählten Regelwerk keine Regel, sie sind NICHT in der Mindestanzahl enthalten — bemessen Sie sie nach den Waschraumregeln (ASR A4.1 Nr. 6, Tabellen 4, 5.1, 5.2; HSE L24: Duschen, wenn die Art der Arbeit sie erfordert).', 'Onvolledig resultaat: voor de gevraagde douches of wasplaatsen bevat de tool geen regel van het gekozen regelkader; ze zitten NIET in het minimum — bepaal ze met de regels voor wasruimten (ASR A4.1 nr. 6, tabellen 4, 5.1, 5.2; HSE L24: douches als de aard van het werk dat vraagt).', 'Résultat incomplet : pour les douches ou postes de lavage demandés, l\'outil n\'a pas de règle du référentiel choisi ; ils ne sont PAS inclus dans le minimum — dimensionnez-les selon les règles des salles d\'eau (ASR A4.1 n° 6, tableaux 4, 5.1, 5.2 ; HSE L24 : douches si la nature du travail l\'exige).', 'Resultado incompleto: para las duchas o puestos de aseo solicitados la herramienta no tiene regla del conjunto elegido; NO están incluidos en el mínimo — dimensiónelos con las reglas de lavabos colectivos (ASR A4.1 n.º 6, tablas 4, 5.1, 5.2; HSE L24: duchas si la naturaleza del trabajo lo exige).', 'Wynik niepełny: dla żądanych natrysków lub stanowisk do mycia narzędzie nie ma reguły wybranych przepisów, więc NIE są wliczone do minimum — dobierz je według zasad dla umywalni (ASR A4.1 nr 6, tabele 4, 5.1, 5.2; HSE L24: natryski, gdy wymaga tego charakter pracy).'),
  'nt.l24_dirty_basins': T7('L24 para 201 (dirty work, heavy soiling of face, hands and forearms): washbasins raised to 1 per 10 people up to 50, +1 per further 20 — per group, never below Table 1.', 'L24 п. 201 (брудна робота, сильне забруднення обличчя, рук і передпліч): умивальників збільшено до 1 на 10 осіб до 50, +1 на кожні наступні 20 — для кожної групи, не менше ніж за табл. 1.', 'L24 Abs. 201 (schmutzende Arbeit, starke Verschmutzung von Gesicht, Händen und Unterarmen): Waschbecken auf 1 je 10 Personen bis 50 erhöht, +1 je weitere 20 — je Gruppe, nie unter Tabelle 1.', 'L24 par. 201 (vuil werk, sterke bevuiling van gezicht, handen en onderarmen): wastafels verhoogd tot 1 per 10 personen tot 50, +1 per volgende 20 — per groep, nooit onder tabel 1.', 'L24 § 201 (travail salissant, forte salissure du visage, des mains et des avant-bras) : lavabos portés à 1 pour 10 personnes jusqu\'à 50, +1 par tranche de 20 en plus — par groupe, jamais sous le tableau 1.', 'L24 párr. 201 (trabajo sucio, gran suciedad en cara, manos y antebrazos): lavabos aumentados a 1 por cada 10 personas hasta 50, +1 por cada 20 adicionales — por grupo, nunca por debajo de la tabla 1.', 'L24 pkt 201 (praca brudząca, silne zabrudzenie twarzy, dłoni i przedramion): umywalki zwiększone do 1 na 10 osób do 50, +1 na każde kolejne 20 — dla każdej grupy, nigdy poniżej tabeli 1.'),
  'v.incomplete': T7('Incomplete: %x not computed for this rule set (%ids) — the counts above are not a complete minimum.', 'Неповно: %x не розраховано для цього набору правил (%ids) — наведені кількості не є повним мінімумом.', 'Unvollständig: %x für dieses Regelwerk nicht berechnet (%ids) — die Anzahlen oben sind keine vollständige Mindestausstattung.', 'Onvolledig: %x niet berekend voor dit regelkader (%ids) — de aantallen hierboven zijn geen volledig minimum.', 'Incomplet : %x non calculé(s) pour ce référentiel (%ids) — les nombres ci-dessus ne sont pas un minimum complet.', 'Incompleto: %x no calculado(s) para este conjunto de reglas (%ids) — las cantidades anteriores no son un mínimo completo.', 'Niepełne: %x nie obliczono dla tych przepisów (%ids) — powyższe liczby nie są pełnym minimum.'),
  'inc.showers': T7('showers', 'душі', 'Duschen', 'douches', 'douches', 'duchas', 'natryski'),
  'inc.washing': T7('washing places', 'місця для миття', 'Waschplätze', 'wasplaatsen', 'postes de lavage', 'puestos de aseo', 'stanowiska do mycia'),
  'f.dirty': T7('Dirty work (washing required)', 'Брудна робота (потрібне миття)', 'Schmutzende Arbeit (Waschen erforderlich)', 'Vuil werk (wassen vereist)', 'Travail salissant (lavage requis)', 'Trabajo sucio (aseo necesario)', 'Praca brudząca (wymagane mycie)'),
  'f.dirty.h': T7('HSE L24: heavy soiling of face, hands and forearms → more washbasins (para 201). ASR A4.1: wash rooms (Nr. 6) are not computed — the result is then marked incomplete.', 'HSE L24: сильне забруднення обличчя, рук і передпліч → більше умивальників (п. 201). ASR A4.1: умивальні (п. 6) не розраховуються — тоді результат позначено як неповний.', 'HSE L24: starke Verschmutzung von Gesicht, Händen und Unterarmen → mehr Waschbecken (Abs. 201). ASR A4.1: Waschräume (Nr. 6) werden nicht berechnet — das Ergebnis wird dann als unvollständig markiert.', 'HSE L24: sterke bevuiling van gezicht, handen en onderarmen → meer wastafels (par. 201). ASR A4.1: wasruimten (nr. 6) worden niet berekend — het resultaat wordt dan als onvolledig gemarkeerd.', 'HSE L24 : forte salissure du visage, des mains et des avant-bras → plus de lavabos (§ 201). ASR A4.1 : les salles d\'eau (n° 6) ne sont pas calculées — le résultat est alors marqué incomplet.', 'HSE L24: gran suciedad en cara, manos y antebrazos → más lavabos (párr. 201). ASR A4.1: los lavabos colectivos (n.º 6) no se calculan — el resultado se marca entonces como incompleto.', 'HSE L24: silne zabrudzenie twarzy, dłoni i przedramion → więcej umywalek (pkt 201). ASR A4.1: umywalnie (nr 6) nie są obliczane — wynik jest wtedy oznaczony jako niepełny.'),
  'b.l24.dirty': T7('HSE L24 para 201 dirty work: washbasins', 'HSE L24 п. 201, брудна робота: умивальники', 'HSE L24 Abs. 201 schmutzende Arbeit: Waschbecken', 'HSE L24 par. 201 vuil werk: wastafels', 'HSE L24 § 201 travail salissant : lavabos', 'HSE L24 párr. 201 trabajo sucio: lavabos', 'HSE L24 pkt 201 praca brudząca: umywalki'),
  'nt.l24_mixed_rooms': T7('L24 mixed use: each WC in a separate room with a door that can be locked from inside.', 'L24, спільне користування: кожен унітаз в окремому приміщенні з дверима, що зачиняються зсередини.', 'L24 gemeinsame Nutzung: jede Toilette in einem eigenen, von innen abschließbaren Raum.', 'L24 gemengd gebruik: elke wc in een aparte ruimte met een deur die van binnen afsluitbaar is.', 'L24 usage mixte : chaque WC dans un local séparé avec une porte verrouillable de l\'intérieur.', 'L24 uso mixto: cada inodoro en un cuarto separado con puerta que se cierra desde dentro.', 'L24 wspólne użytkowanie: każda miska w osobnym pomieszczeniu z drzwiami zamykanymi od wewnątrz.'),
  'nt.l24_beyond_100': T7('L24 para 200, above 100 people: +1 toilet and washbasin per further 25 (or fraction); men-only toilets +1 cubicle per further 50 men with at least as many additional urinals.', 'L24 п. 200, понад 100 осіб: +1 унітаз і умивальник на кожні наступні 25 (або їх частину); для суто чоловічих туалетів +1 кабіна на кожні наступні 50 чоловіків і щонайменше стільки ж додаткових пісуарів.', 'L24 Abs. 200, über 100 Personen: +1 Toilette und Waschbecken je weitere 25 (oder Teil davon); reine Männertoiletten +1 Kabine je weitere 50 Männer mit mindestens ebenso vielen zusätzlichen Urinalen.', 'L24 par. 200, boven 100 personen: +1 toilet en wastafel per volgende 25 (of deel daarvan); toiletten alleen voor mannen +1 cabine per volgende 50 mannen met minstens evenveel extra urinoirs.', 'L24 § 200, au-delà de 100 personnes : +1 WC et lavabo par tranche de 25 (ou fraction) ; toilettes réservées aux hommes +1 cabine par tranche de 50 hommes avec au moins autant d\'urinoirs supplémentaires.', 'L24 párr. 200, más de 100 personas: +1 inodoro y lavabo por cada 25 adicionales (o fracción); aseos solo de hombres +1 cabina por cada 50 hombres adicionales con al menos tantos urinarios adicionales.', 'L24 pkt 200, powyżej 100 osób: +1 miska ustępowa i umywalka na każde kolejne 25 (lub ich część); toalety tylko dla mężczyzn +1 kabina na każde kolejne 50 mężczyzn i co najmniej tyle samo dodatkowych pisuarów.'),
  'nt.accessible_extra': T7('One accessible WC per zone with WCs, counted in addition (Flanders: accessibility regulation 2009 for publicly accessible buildings; national rules elsewhere).', 'Один доступний туалет на зону з туалетами, рахується додатково (Фландрія: регламент доступності 2009 для публічно доступних будівель; деінде — національні правила).', 'Eine barrierefreie Toilette je Zone mit Toiletten, zusätzlich gezählt (Flandern: Zugänglichkeitsverordnung 2009 für öffentlich zugängliche Gebäude; anderswo nationale Regeln).', 'Eén toegankelijk toilet per zone met toiletten, extra geteld (Vlaanderen: verordening toegankelijkheid 2009 voor publiek toegankelijke gebouwen; elders nationale regels).', 'Un WC accessible par zone équipée de WC, compté en sus (Flandre : règlement accessibilité 2009 pour les bâtiments accessibles au public ; ailleurs règles nationales).', 'Un aseo accesible por zona con aseos, contado aparte (Flandes: reglamento de accesibilidad 2009 para edificios de acceso público; en otros lugares normas nacionales).', 'Jedna toaleta dostępna na strefę z toaletami, liczona dodatkowo (Flandria: rozporządzenie o dostępności 2009 dla budynków publicznie dostępnych; gdzie indziej przepisy krajowe).'),
  /* chart */

  'chart.x': T7('people in the group', 'людей у групі', 'Personen in der Gruppe', 'personen in de groep', 'personnes dans le groupe', 'personas en el grupo', 'osób w grupie'),

/* ---------- presets: each with one point to see ---------- */
var PL = {
  floors_vs_pool: [T7('Office, 8 floors × 75 staff', 'Офіс, 8 поверхів × 75 працівників', 'Büro, 8 Geschosse × 75 Beschäftigte', 'Kantoor, 8 verdiepingen × 75 medewerkers', 'Bureaux, 8 étages × 75 personnes', 'Oficina, 8 plantas × 75 empleados', 'Biuro, 8 kondygnacji × 75 pracowników'),
    T7('A toilet core on every floor needs 48 WC/urinal places; one pooled core for the same 600 people would need 41. Every floor and every sex rounds up on its own.', 'Санвузол на кожному поверсі потребує 48 місць; один спільний вузол для тих самих 600 людей — 41. Кожен поверх і кожна стать округлюються вгору окремо.', 'Ein Sanitärkern je Geschoss braucht 48 Plätze; ein gemeinsamer Kern für dieselben 600 Personen bräuchte 41. Jedes Geschoss und jedes Geschlecht rundet für sich auf.', 'Een sanitaire kern per verdieping vraagt 48 plaatsen; één gezamenlijke kern voor dezelfde 600 mensen zou er 41 vragen. Elke verdieping en elk geslacht rondt apart af.', 'Un bloc sanitaire par étage demande 48 places ; un noyau unique pour les mêmes 600 personnes en demanderait 41. Chaque étage et chaque sexe arrondit séparément.', 'Un núcleo de aseos en cada planta necesita 48 plazas; un núcleo único para las mismas 600 personas necesitaría 41. Cada planta y cada sexo redondea por separado.', 'Węzeł sanitarny na każdej kondygnacji wymaga 48 miejsc; jeden wspólny węzeł dla tych samych 600 osób — 41. Każda kondygnacja i każda płeć zaokrągla osobno.')],
  urinal_floor: [T7('600 staff, one core: the urinal floor', '600 працівників, один вузол: межа для пісуарів', '600 Beschäftigte, ein Kern: Untergrenze bei Urinalen', '600 medewerkers, één kern: de urinoirgrens', '600 personnes, un noyau : le plancher des urinoirs', '600 empleados, un núcleo: el límite de los urinarios', '600 pracowników, jeden węzeł: granica pisuarów'),
    T7('300 women need 20 WCs; 300 men need 20 places too, but only 12 must be WCs (1 per 25) — 8 can be urinals. Switch urinals off and the men\'s side needs 20 WCs.', '300 жінкам потрібно 20 унітазів; 300 чоловікам — теж 20 місць, але лише 12 мають бути унітазами (1 на 25) — 8 можуть бути пісуарами. Вимкніть пісуари — і чоловікам знадобиться 20 унітазів.', '300 Frauen brauchen 20 Toiletten; 300 Männer brauchen ebenfalls 20 Plätze, aber nur 12 müssen Toiletten sein (1 je 25) — 8 können Urinale sein. Ohne Urinale braucht die Herrenseite 20 Toiletten.', '300 vrouwen hebben 20 wc\'s nodig; 300 mannen ook 20 plaatsen, maar slechts 12 moeten wc zijn (1 per 25) — 8 mogen urinoirs zijn. Zet urinoirs uit en de herenkant vraagt 20 wc\'s.', '300 femmes demandent 20 WC ; 300 hommes aussi 20 places, mais 12 seulement doivent être des WC (1 pour 25) — 8 peuvent être des urinoirs. Sans urinoirs, le côté hommes demande 20 WC.', '300 mujeres necesitan 20 inodoros; 300 hombres también 20 plazas, pero solo 12 deben ser inodoros (1 por cada 25) — 8 pueden ser urinarios. Sin urinarios, el lado de hombres necesita 20 inodoros.', '300 kobiet potrzebuje 20 misek; 300 mężczyzn też 20 miejsc, ale tylko 12 musi być miskami (1 na 25) — 8 mogą być pisuarami. Wyłącz pisuary, a strona męska wymaga 20 misek.')],
  three_codes: [T7('Same 100 people, three rule sets', 'Ті самі 100 людей, три набори правил', 'Dieselben 100 Personen, drei Regelwerke', 'Dezelfde 100 mensen, drie regelkaders', 'Les mêmes 100 personnes, trois référentiels', 'Las mismas 100 personas, tres conjuntos de reglas', 'Te same 100 osób, trzy przepisy'),
    T7('50 women and 50 men: Belgium 8 places, ASR 6, HSE L24 separate rooms 8, L24 mixed lockable rooms 5. Switch the rule set and watch the steps in the chart.', '50 жінок і 50 чоловіків: Бельгія — 8 місць, ASR — 6, HSE L24 з окремими кімнатами — 8, L24 зі спільними кабінами — 5. Перемкніть набір правил і подивіться на сходинки на графіку.', '50 Frauen und 50 Männer: Belgien 8 Plätze, ASR 6, HSE L24 getrennt 8, L24 gemeinsame abschließbare Räume 5. Wechseln Sie das Regelwerk und beobachten Sie die Stufen im Diagramm.', '50 vrouwen en 50 mannen: België 8 plaatsen, ASR 6, HSE L24 gescheiden 8, L24 gemengde afsluitbare ruimten 5. Wissel het regelkader en bekijk de trappen in de grafiek.', '50 femmes et 50 hommes : Belgique 8 places, ASR 6, HSE L24 séparé 8, L24 locaux mixtes verrouillables 5. Changez de référentiel et regardez les marches du graphique.', '50 mujeres y 50 hombres: Bélgica 8 plazas, ASR 6, HSE L24 separados 8, L24 cuartos mixtos con cerrojo 5. Cambie el conjunto de reglas y mire los escalones del gráfico.', '50 kobiet i 50 mężczyzn: Belgia 8 miejsc, ASR 6, HSE L24 oddzielne 8, L24 wspólne zamykane kabiny 5. Przełącz przepisy i obserwuj schodki na wykresie.')],
  assembly_line: [T7('Assembly line vs office, 90 men each (ASR)', 'Конвеєр і офіс, по 90 чоловіків (ASR)', 'Montageband und Büro, je 90 Männer (ASR)', 'Lopende band en kantoor, elk 90 mannen (ASR)', 'Chaîne de montage et bureaux, 90 hommes chacun (ASR)', 'Cadena de montaje y oficina, 90 hombres cada una (ASR)', 'Linia montażowa i biuro, po 90 mężczyzn (ASR)'),
    T7('The ASR example: 90 men on an assembly line with fixed breaks need 9 places (3 toilets + 6 urinals); the same 90 men in an office with spread breaks need 6. Simultaneity, not headcount, sets the count.', 'Приклад ASR: 90 чоловікам на конвеєрі з фіксованими перервами потрібно 9 місць (3 унітази + 6 пісуарів); тим самим 90 чоловікам в офісі з розосередженими перервами — 6. Кількість визначає одночасність, а не чисельність.', 'Das ASR-Beispiel: 90 Männer am Montageband mit festen Pausen brauchen 9 Plätze (3 Toiletten + 6 Urinale); dieselben 90 Männer im Büro mit verteilten Pausen brauchen 6. Die Gleichzeitigkeit, nicht die Kopfzahl, bestimmt die Anzahl.', 'Het ASR-voorbeeld: 90 mannen aan een lopende band met vaste pauzes hebben 9 plaatsen nodig (3 toiletten + 6 urinoirs); dezelfde 90 mannen op kantoor met gespreide pauzes 6. Gelijktijdigheid, niet het aantal, bepaalt de telling.', 'L\'exemple de l\'ASR : 90 hommes sur une chaîne aux pauses fixes demandent 9 places (3 WC + 6 urinoirs) ; les mêmes 90 hommes au bureau aux pauses étalées en demandent 6. La simultanéité, pas l\'effectif, fait le compte.', 'El ejemplo de la ASR: 90 hombres en una cadena con pausas fijas necesitan 9 plazas (3 inodoros + 6 urinarios); los mismos 90 hombres en oficina con pausas repartidas necesitan 6. La simultaneidad, no la plantilla, fija el número.', 'Przykład z ASR: 90 mężczyzn na linii montażowej ze stałymi przerwami potrzebuje 9 miejsc (3 miski + 6 pisuarów); tych samych 90 mężczyzn w biurze z rozłożonymi przerwami — 6. O liczbie decyduje jednoczesność, nie liczba osób.')],

  });
  var maxY = 1; series.forEach(function (s) { s.pts.forEach(function (p) { if (p[1] > maxY) maxY = p[1]; }); });

  chartGeo = { L: L, pw: pw, maxN: maxN };
  ctx.font = '12px system-ui, sans-serif'; ctx.lineWidth = 1; ctx.strokeStyle = line; ctx.fillStyle = muted;

  });

    if (r.method === 'uk_l24' && o.uk_mode === 'mixed') pts.push([r.persons, r.positions, 'mixed']);

    pts.forEach(function (p) { ctx.beginPath(); ctx.fillStyle = COL[r.method]; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.arc(X(p[0]), Y(p[1]), 6, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
      ctx.fillStyle = ink; ctx.textAlign = 'left'; ctx.fillText(S('g.' + p[2]) + ' ' + fmt(p[0]) + ' → ' + fmt(p[1]), X(p[0]) + 9, Y(p[1]) - 8); });
  }

      body: T7('Belgium: men\'s places = ⌈men/15⌉, of which at least ⌈men/25⌉ must be WCs. ASR: at least one third of the men\'s places are toilets. L24 Table 2 lists WCs and urinals separately. Urinals save space and water, but the WC floor stays.',

        'Бельгійський Кодекс: якщо робота брудна — 1 кран для миття на 3 працівників, що одночасно закінчують роботу (1 на 5 за згодою комітету); при спеці, брудній роботі чи небезпечних речовинах — 1 душ на 6. У переліку вони рахуються як умивальники й душі, тож розрахунки каналізації та гарячої води їх бачать. Велика Британія (HSE L24 п. 201): брудна робота із сильним забрудненням збільшує кількість умивальників до 1 на 10 осіб до 50, +1 на кожні наступні 20. Умивальні за ASR A4.1 і душі за L24 не розраховуються: якщо їх запитано, результат позначається як неповний.',
        'Belgischer Codex: bei schmutzender Arbeit 1 Waschplatz je 3 gleichzeitig endende Beschäftigte (1 je 5 mit Zustimmung des Ausschusses); bei Hitze, schmutzender Arbeit oder Gefahrstoffen 1 Dusche je 6. Im Verzeichnis zählen sie als Waschbecken und Duschen, damit Entwässerung und Warmwasserbemessung sie sehen. Vereinigtes Königreich (HSE L24 Abs. 201): schmutzende Arbeit mit starker Verschmutzung erhöht die Waschbecken auf 1 je 10 bis 50 Personen, +1 je weitere 20. Waschräume nach ASR A4.1 und Duschen nach L24 werden nicht berechnet: werden sie angefordert, ist das Ergebnis als unvollständig markiert.',
        'Belgische Codex: bij bevuilend werk 1 waskraan per 3 werknemers die tegelijk stoppen (1 per 5 met akkoord van het comité); bij hitte, bevuilend werk of gevaarlijke stoffen 1 douche per 6. In de lijst tellen ze als wastafels en douches, zodat afvoer en warmwaterberekening ze zien. VK (HSE L24 par. 201): vuil werk met sterke bevuiling verhoogt de wastafels tot 1 per 10 tot 50 personen, +1 per volgende 20. Wasruimten volgens ASR A4.1 en douches volgens L24 worden niet berekend: als ze gevraagd zijn, wordt het resultaat als onvolledig gemarkeerd.',
        'Code belge : pour un travail salissant, 1 robinet de lavage pour 3 travailleurs finissant ensemble (1 pour 5 avec l\'accord du comité) ; chaleur, travail salissant ou agents dangereux : 1 douche pour 6. Dans l\'inventaire ils comptent comme lavabos et douches, pour que l\'évacuation et l\'eau chaude les voient. Royaume-Uni (HSE L24 § 201) : un travail très salissant porte les lavabos à 1 pour 10 jusqu\'à 50 personnes, +1 par tranche de 20 en plus. Les salles d\'eau ASR A4.1 et les douches L24 ne sont pas calculées : si elles sont demandées, le résultat est marqué incomplet.',
        'Código belga: si el trabajo ensucia, 1 grifo de aseo por cada 3 trabajadores que terminan a la vez (1 por cada 5 con acuerdo del comité); con calor, trabajo sucio o agentes peligrosos, 1 ducha por cada 6. En el inventario cuentan como lavabos y duchas, para que el saneamiento y el agua caliente los tengan en cuenta. Reino Unido (HSE L24 párr. 201): el trabajo muy sucio eleva los lavabos a 1 por cada 10 hasta 50 personas, +1 por cada 20 adicionales. Los lavabos colectivos de ASR A4.1 y las duchas de L24 no se calculan: si se solicitan, el resultado se marca como incompleto.',
        'Belgijski Kodeks: przy pracy brudzącej 1 kran do mycia na 3 pracowników kończących jednocześnie (1 na 5 za zgodą komitetu); przy upale, pracy brudzącej lub substancjach niebezpiecznych 1 natrysk na 6. W spisie liczą się jako umywalki i natryski, więc kanalizacja i ciepła woda je uwzględniają. Wielka Brytania (HSE L24 pkt 201): praca silnie brudząca zwiększa liczbę umywalek do 1 na 10 osób do 50, +1 na każde kolejne 20. Umywalnie wg ASR A4.1 i natryski wg L24 nie są obliczane: jeśli ich zażądano, wynik jest oznaczony jako niepełny.') },
    simultaneity: { title: T7('Simultaneity: fixed breaks need more places', 'Одночасність: фіксовані перерви потребують більше місць', 'Gleichzeitigkeit: feste Pausen brauchen mehr Plätze', 'Gelijktijdigheid: vaste pauzes vragen meer plaatsen', 'Simultanéité : des pauses fixes demandent plus de places', 'Simultaneidad: las pausas fijas necesitan más plazas', 'Jednoczesność: stałe przerwy wymagają więcej miejsc'),
      body: T7('ASR A4.1 has two columns: low simultaneity (breaks spread out, offices) and high (everyone at the same time — assembly lines, shift ends, schools). The table\'s own example: 90 men on an assembly line need 9 places, the same men in an office 6. Set it per zone.',
        'ASR A4.1 має дві колонки: низька одночасність (перерви розосереджені, офіси) і висока (усі одночасно — конвеєри, кінець зміни, школи). Приклад із самої таблиці: 90 чоловікам на конвеєрі потрібно 9 місць, тим самим чоловікам в офісі — 6. Задавайте для кожної зони.',
        'ASR A4.1 hat zwei Spalten: niedrige Gleichzeitigkeit (verteilte Pausen, Büros) und hohe (alle gleichzeitig — Montagebänder, Schichtende, Schulen). Das Beispiel der Tabelle: 90 Männer am Montageband brauchen 9 Plätze, dieselben Männer im Büro 6. Je Zone einstellen.',
        'ASR A4.1 heeft twee kolommen: lage gelijktijdigheid (gespreide pauzes, kantoren) en hoge (iedereen tegelijk — lopende banden, ploegwissel, scholen). Het voorbeeld van de tabel: 90 mannen aan een lopende band hebben 9 plaatsen nodig, dezelfde mannen op kantoor 6. Stel het per zone in.',
        'L\'ASR A4.1 a deux colonnes : simultanéité faible (pauses étalées, bureaux) et élevée (tous en même temps — chaînes, fins de poste, écoles). L\'exemple du tableau : 90 hommes sur une chaîne demandent 9 places, les mêmes au bureau 6. À régler par zone.',
        'La ASR A4.1 tiene dos columnas: simultaneidad baja (pausas repartidas, oficinas) y alta (todos a la vez — cadenas de montaje, fin de turno, escuelas). El ejemplo de la tabla: 90 hombres en una cadena necesitan 9 plazas, los mismos en una oficina 6. Ajústelo por zona.',
        'ASR A4.1 ma dwie kolumny: niska jednoczesność (rozłożone przerwy, biura) i wysoka (wszyscy naraz — linie montażowe, koniec zmiany, szkoły). Przykład z tabeli: 90 mężczyzn na linii montażowej potrzebuje 9 miejsc, ci sami w biurze — 6. Ustaw dla każdej strefy.') },
    accessible: { title: T7('Accessible WC', 'Доступний туалет', 'Barrierefreie Toilette', 'Toegankelijk toilet', 'WC accessible', 'Aseo accesible', 'Toaleta dostępna'),
      body: T7('Where toilets are provided in a publicly accessible building, Flanders requires an accessible one (regional accessibility regulation 2009); German workplaces with disabled employees follow ASR V3a.2. The tool adds one unisex accessible WC with its own basin per zone, in addition to the counts — a conservative assumption; your regulation may let it count towards the total.',
        'Якщо в публічно доступній будівлі є туалети, Фландрія вимагає доступного (регіональний регламент доступності 2009); німецькі робочі місця з працівниками з інвалідністю — за ASR V3a.2. Інструмент додає один універсальний доступний туалет із власним умивальником на зону понад норму — консервативне припущення; ваші правила можуть дозволяти зараховувати його до загальної кількості.',
        'Wo in einem öffentlich zugänglichen Gebäude Toiletten vorhanden sind, verlangt Flandern eine barrierefreie (regionale Zugänglichkeitsverordnung 2009); deutsche Arbeitsstätten mit Beschäftigten mit Behinderung folgen ASR V3a.2. Das Werkzeug fügt je Zone eine barrierefreie Unisex-Toilette mit eigenem Waschbecken zusätzlich hinzu — eine vorsichtige Annahme; Ihre Vorschrift kann die Anrechnung erlauben.',
        'Waar in een publiek toegankelijk gebouw toiletten zijn, eist Vlaanderen een toegankelijk toilet (gewestelijke verordening toegankelijkheid 2009); Duitse arbeidsplaatsen met werknemers met een handicap volgen ASR V3a.2. De tool voegt per zone één toegankelijk genderneutraal toilet met eigen wastafel extra toe — een voorzichtige aanname; uw regelgeving kan toelaten het mee te tellen.',
        'Là où un bâtiment accessible au public dispose de toilettes, la Flandre exige un WC accessible (règlement régional accessibilité 2009) ; les lieux de travail allemands avec salariés handicapés suivent l\'ASR V3a.2. L\'outil ajoute par zone un WC accessible mixte avec son lavabo, en sus des comptes — hypothèse prudente ; votre réglementation peut permettre de l\'inclure.',
        'Donde un edificio de acceso público tiene aseos, Flandes exige uno accesible (reglamento regional de accesibilidad 2009); los lugares de trabajo alemanes con trabajadores con discapacidad siguen la ASR V3a.2. La herramienta añade por zona un aseo accesible mixto con su lavabo, además de los recuentos — un supuesto prudente; su normativa puede permitir contarlo dentro del total.',
        'Gdzie w budynku publicznie dostępnym są toalety, Flandria wymaga toalety dostępnej (regionalne rozporządzenie o dostępności 2009); niemieckie miejsca pracy z pracownikami z niepełnosprawnością stosują ASR V3a.2. Narzędzie dodaje w każdej strefie jedną koedukacyjną toaletę dostępną z własną umywalką ponad normę — ostrożne założenie; twoje przepisy mogą pozwalać wliczyć ją do sumy.') },
    inventory: { title: T7('The inventory for the package', 'Перелік для пакета', 'Das Verzeichnis für das Paket', 'De lijst voor het pakket', 'L\'inventaire pour le lot', 'El inventario para el paquete', 'Spis dla pakietu'),
      body: T7('Apply writes WC, urinal, basin and shower counts into the zones of the shared plumbing project; kitchen sinks, cleaner sinks and other fixtures you entered elsewhere stay. A count already in the project is only raised to the workplace minimum, never lowered or deleted (hotel rooms, changing-room showers and extra urinals are design choices above the minimum); the minimum is kept per zone as workplace_min and the table shows in project / minimum / after Apply. Pipe sizing reads loading units, drainage reads discharge units and water saving reads uses per fixture from this inventory. Nothing changes in the project until you press Apply.',
        '«Застосувати» записує кількість унітазів, пісуарів, умивальників і душів у зони спільного проєкту; кухонні мийки, мийки для прибирання та інші прилади, введені деінде, лишаються. Значення, що вже є в проєкті, лише піднімається до мінімуму для робочих місць і ніколи не зменшується й не видаляється (готельні номери, душі в роздягальнях і додаткові пісуари — проєктні рішення понад мінімум); мінімум зберігається в кожній зоні як workplace_min, а таблиця показує «у проєкті / мінімум / після застосування». Розрахунок трубопроводів бере з цього переліку навантажувальні одиниці, каналізація — одиниці стоку, водозбереження — кількість використань приладів. Нічого в проєкті не змінюється, доки ви не натиснете «Застосувати».',
        'Übernehmen schreibt Toiletten-, Urinal-, Waschbecken- und Duschzahlen in die Zonen des gemeinsamen Sanitärprojekts; Küchenspülen, Ausgussbecken und andere anderswo eingegebene Objekte bleiben. Eine Anzahl im Projekt wird nur auf das Arbeitsstätten-Minimum angehoben, nie verringert oder gelöscht (Hotelzimmer, Duschen in Umkleiden und zusätzliche Urinale sind Planungsentscheidungen über dem Minimum); das Minimum bleibt je Zone in workplace_min, und die Tabelle zeigt „im Projekt / Minimum / nach Übernehmen“. Die Rohrbemessung liest Belastungswerte, die Entwässerung Anschlusswerte und das Wassersparen Nutzungen je Objekt aus diesem Verzeichnis. Nichts ändert sich im Projekt, bevor Sie Übernehmen drücken.',
        'Toepassen schrijft de aantallen wc\'s, urinoirs, wastafels en douches in de zones van het gedeelde sanitairproject; keukenspoelbakken, uitstortgootstenen en andere elders ingevoerde toestellen blijven. Een aantal dat al in het project staat, wordt alleen verhoogd tot het minimum voor werkplekken, nooit verlaagd of gewist (hotelkamers, douches in kleedruimten en extra urinoirs zijn ontwerpkeuzes boven het minimum); het minimum blijft per zone in workplace_min en de tabel toont ‘in project / minimum / na toepassen’. Leidingberekening leest belastingseenheden, afvoer leest afvoerwaarden en waterbesparing leest gebruik per toestel uit deze lijst. Niets verandert in het project tot u op Toepassen drukt.',
        'Appliquer écrit les nombres de WC, urinoirs, lavabos et douches dans les zones du projet sanitaire partagé ; éviers, vidoirs et autres appareils saisis ailleurs restent. Un nombre déjà présent dans le projet est seulement porté au minimum réglementaire, jamais réduit ni supprimé (chambres d’hôtel, douches de vestiaires et urinoirs supplémentaires sont des choix de conception au-delà du minimum) ; le minimum est conservé par zone dans workplace_min et le tableau montre « dans le projet / minimum / après Appliquer ». Le dimensionnement des tuyauteries lit les unités de charge, l\'évacuation les unités d\'écoulement et les économies d\'eau les usages par appareil dans cet inventaire. Rien ne change dans le projet avant d\'appuyer sur Appliquer.',
        'Aplicar escribe los números de inodoros, urinarios, lavabos y duchas en las zonas del proyecto compartido; fregaderos, vertederos y otros aparatos introducidos en otro lugar se mantienen. Una cantidad que ya está en el proyecto solo se eleva al mínimo laboral, nunca se reduce ni se borra (habitaciones de hotel, duchas de vestuarios y urinarios adicionales son decisiones de diseño por encima del mínimo); el mínimo se guarda por zona en workplace_min y la tabla muestra «en el proyecto / mínimo / tras aplicar». El dimensionado de tuberías lee unidades de carga, el saneamiento unidades de descarga y el ahorro de agua usos por aparato de este inventario. Nada cambia en el proyecto hasta que pulse Aplicar.',
        'Zastosuj zapisuje liczby misek, pisuarów, umywalek i natrysków w strefach wspólnego projektu; zlewy kuchenne, zlewy porządkowe i inne przybory wprowadzone gdzie indziej zostają. Liczba, która już jest w projekcie, jest tylko podnoszona do minimum dla miejsc pracy, nigdy nie zmniejszana ani usuwana (pokoje hotelowe, natryski w szatniach i dodatkowe pisuary to decyzje projektowe ponad minimum); minimum zostaje w każdej strefie jako workplace_min, a tabela pokazuje „w projekcie / minimum / po zastosowaniu”. Dobór rur czyta z tego spisu jednostki obciążenia, kanalizacja — równoważniki odpływu, a oszczędzanie wody — użycia przyborów. Nic w projekcie się nie zmienia, dopóki nie naciśniesz Zastosuj.') }
  },
  tour: [{ topic: 'rules', focus: '[data-dgu-field="f-zones"]' }, { topic: 'urinals', focus: '[data-dgu-field="f-urinals"]' }, { topic: 'rounding', focus: '.dgu-r-results' },

  /* shared demo buildings of the plumbing package (plumbing-core.js), when present */
  var PP = CORE && CORE.PRESET_PROJECTS;
  /* only the office: in the other demo buildings the zone persons are residents, guests or players, not staff */
  if (PP) ['office_8f'].forEach(function (k) {
    var src = PP[k]; if (!src) return;
    var get = function () { var d = typeof CORE.presetProject === 'function' ? CORE.presetProject(k) : src.doc; return d && Array.isArray(d.zones) ? sanitize({ doc: d }).doc : null; };
    try { if (!get()) return; } catch (e) { return; }
    var lab = src.label || k;
    list.push({ id: 'pkg_' + k, label: typeof lab === 'object' ? lab : T7(k, k, k, k, k, k, k), note: T7('The shared demo office of the plumbing package (the same building in all package tools). Apply writes its WC, urinal, basin and shower counts; kitchen and cleaner sinks stay.', 'Спільний демонстраційний офіс пакета (та сама будівля в усіх інструментах пакета). «Застосувати» записує кількість унітазів, пісуарів, умивальників і душів; кухонні мийки й мийки для прибирання лишаються.', 'Das gemeinsame Beispielbüro des Sanitärpakets (dasselbe Gebäude in allen Werkzeugen des Pakets). Übernehmen schreibt Toiletten, Urinale, Waschbecken und Duschen; Küchen- und Ausgussbecken bleiben.', 'Het gedeelde voorbeeldkantoor van het sanitairpakket (hetzelfde gebouw in alle tools van het pakket). Toepassen schrijft wc’s, urinoirs, wastafels en douches; keuken- en uitstortgootstenen blijven.', 'Le bureau de démonstration commun du lot sanitaire (le même bâtiment dans tous les outils du lot). Appliquer écrit WC, urinoirs, lavabos et douches ; éviers et vidoirs restent.', 'La oficina de demostración común del paquete (el mismo edificio en todas sus herramientas). Aplicar escribe inodoros, urinarios, lavabos y duchas; fregaderos y vertederos se mantienen.', 'Wspólne biuro przykładowe pakietu (ten sam budynek we wszystkich narzędziach pakietu). Zastosuj zapisuje miski, pisuary, umywalki i natryski; zlewy kuchenne i porządkowe zostają.'),
      apply: function (t) { t.doc = get(); t.sel = 0; t.origin = 'preset'; t.applied = false; } });
  });
  return list;
}

/* ---------- the shared project bar of plumbing-core.js (feature-detected) ---------- */

  if (!barBox || !hasBar()) return;
  var sig = curLang() + '|' + JSON.stringify([state.doc.project && state.doc.project.name, state.doc.zones.length, Object.keys(state.doc.modules || {})]);
  if (bar && sig === barSig && bar.element && barBox.contains(bar.element)) return;
  barSig = sig;
  if (bar && typeof bar.refresh === 'function') { try { bar.refresh(state.doc); return; } catch (e) { /* rebuild */ } }
  try { if (bar && bar.destroy) bar.destroy(); } catch (e) { /* gone */ }
  try {
    bar = CORE.ui.projectBar({ mount: barBox, toolId: TOOL, consumes: [], lang: curLang, syncTabs: false, doc: state.doc, getDoc: function () { return stamped(state.doc); },
      onChange: function (d) { var x = sanitize({ doc: d, sel: 0, origin: 'register' }); state.doc = x.doc; state.sel = 0; state.origin = 'register'; lastSaved = JSON.stringify(state.doc); if (ui) { ui.sync(); ui.run(); } } });
  } catch (e) { bar = null; }
  if (bar && bar.element) Array.prototype.forEach.call(bar.element.querySelectorAll('input[type=file]'), function (f) { if (!f.getAttribute('aria-label')) f.setAttribute('aria-label', S('a.import')); });
}

        { id: 'f-sim', type: 'segmented', label: tx('f.sim'), hint: tx('f.sim.h'), learn: 'simultaneity', options: opts('sim.', ['low', 'high']), visible: function () { return O().method === 'de_asr'; }, get: function () { return O().simultaneity; }, set: function (v) { O().simultaneity = v; } },
        { id: 'f-ukmode', type: 'segmented', label: tx('f.ukmode'), options: opts('uk.', ['separate', 'mixed']), visible: function () { return O().method === 'uk_l24'; }, get: function () { return O().uk_mode; }, set: function (v) { O().uk_mode = v; } },
        { id: 'f-asrshared', type: 'toggle', label: tx('f.asrshared'), hint: tx('f.asrshared.h'), learn: 'simultaneity', visible: function () { return O().method === 'de_asr'; }, get: function () { return !!O().asr_shared; }, set: function (v) { O().asr_shared = !!v; } },
        { id: 'f-urinals', type: 'toggle', label: tx('f.urinals'), learn: 'urinals', get: function () { return !!O().urinals; }, set: function (v) { O().urinals = !!v; } },
