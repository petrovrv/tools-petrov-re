var I18N = {
  subtitle: T7('Tasks to a 52/53-week calendar: peaks, windows, visits, statutory dates and the budget.',
    'Завдання — у 52/53-тижневий календар: піки, вікна, виїзди, обов’язкові дати й бюджет.',
    'Aufgaben in einen 52/53-Wochen-Kalender: Spitzen, Fenster, Einsätze, gesetzliche Termine und Budget.',
    'Taken naar een kalender van 52/53 weken: pieken, vensters, bezoeken, wettelijke data en budget.',
    'Des tâches au calendrier de 52/53 semaines : pics, fenêtres, interventions, échéances réglementaires et budget.',
    'De tareas a un calendario de 52/53 semanas: picos, ventanas, visitas, fechas reglamentarias y presupuesto.',
    'Zadania w 52/53-tygodniowy kalendarz: szczyty, okna, wizyty, terminy ustawowe i budżet.'),
  footer: T7('Each task gives round(N / interval in weeks), N = ISO weeks of the plan year (52 or 53), work orders per year on a fixed grid (anchor + k·interval; the anchor is the next due date, or chosen by the planner for undated routine tasks). A work order may move by at most floor(tolerance × interval) whole weeks (±10 % by default: quarterly ±1 week, annual ±5); statutory tests are never moved. Allowed weeks: heating season W40–W17 and cooling season W18–W39 by default (learning assumption), pre-season = 6 weeks before the season, shutdown and blackout weeks as entered. Week load per trade h = task hours + travel per visit; tasks of one asset (or location) and trade in one week share one visit. Levelling minimises Σ h² + 1000·overload² over trades and weeks (greedy placement of the most constrained series first, then single moves within the windows). Budget = hours × rate + travel + materials (% of labour unless given) + call-out fee per vendor visit. Planning aid, not a substitute for manufacturer instructions and national regulations.',
    'Кожне завдання дає round(N / інтервал у тижнях), N — кількість тижнів ISO у році плану (52 або 53), нарядів на рік на фіксованій сітці (опорна дата + k·інтервал; опорна дата — найближчий термін, а для завдань без дати її вибирає планувальник). Наряд можна зсунути щонайбільше на floor(допуск × інтервал) цілих тижнів (типово ±10 %: щоквартальний ±1 тиждень, щорічний ±5); обов’язкові перевірки не зсуваються ніколи. Дозволені тижні: типово опалювальний сезон Т40–Т17 і сезон охолодження Т18–Т39 (навчальне припущення), передсезонне вікно — 6 тижнів до сезону, тижні зупинки й заборони — як введено. Навантаження фаху за тиждень h = години завдань + час на виїзд; завдання одного обладнання (або місця) й фаху в одному тижні — один виїзд. Вирівнювання мінімізує Σ h² + 1000·перевантаження² за фахами й тижнями (жадібне розміщення найобмеженіших серій спочатку, потім окремі зсуви в межах вікон). Бюджет = години × ставка + дорога + матеріали (% від праці, якщо не задано) + плата за виклик підрядника. Допоміжний інструмент, не замінює інструкцій виробника й національних норм.',
    'Jede Aufgabe ergibt round(N / Intervall in Wochen), N = ISO-Wochen des Planjahres (52 oder 53), Aufträge pro Jahr auf einem festen Raster (Anker + k·Intervall; Anker ist der nächste Fälligkeitstermin, bei undatierten Routinen wählt ihn der Planer). Ein Auftrag darf sich höchstens um floor(Toleranz × Intervall) ganze Wochen verschieben (standardmäßig ±10 %: vierteljährlich ±1 Woche, jährlich ±5); gesetzliche Prüfungen nie. Zulässige Wochen: Heizperiode KW40–KW17 und Kühlperiode KW18–KW39 als Vorgabe (Lernannahme), Vorsaison = 6 Wochen vor Saisonbeginn, Stillstands- und Sperrwochen wie eingegeben. Wochenlast je Gewerk h = Aufgabenstunden + Anfahrt je Einsatz; Aufgaben einer Anlage (oder eines Orts) und eines Gewerks in einer Woche teilen einen Einsatz. Die Glättung minimiert Σ h² + 1000·Überlast² über Gewerke und Wochen (gierige Platzierung der am stärksten eingeschränkten Serien zuerst, dann Einzelverschiebungen in den Fenstern). Budget = Stunden × Satz + Anfahrt + Material (% der Arbeit, falls nicht angegeben) + Anfahrtspauschale je Fremdfirmeneinsatz. Planungshilfe, kein Ersatz für Herstellervorgaben und nationale Vorschriften.',
    'Elke taak geeft round(N / interval in weken), N = ISO-weken van het planjaar (52 of 53), werkorders per jaar op een vast raster (anker + k·interval; het anker is de volgende vervaldatum, of door de planner gekozen voor ongedateerde routines). Een werkorder mag hoogstens floor(tolerantie × interval) hele weken schuiven (standaard ±10 %: per kwartaal ±1 week, jaarlijks ±5); wettelijke keuringen nooit. Toegestane weken: stookseizoen W40–W17 en koelseizoen W18–W39 standaard (leeraanname), voorseizoen = 6 weken vóór het seizoen, stilstands- en blokkadeweken zoals ingevoerd. Weeklast per discipline h = taakuren + reistijd per bezoek; taken van één installatie (of locatie) en discipline in één week delen één bezoek. Afvlakken minimaliseert Σ h² + 1000·overbelasting² over disciplines en weken (gretige plaatsing van de meest beperkte reeksen eerst, dan losse verschuivingen binnen de vensters). Budget = uren × tarief + reistijd + materiaal (% van arbeid tenzij opgegeven) + voorrijkosten per bezoek van een externe partij. Planningshulpmiddel, geen vervanging van fabrieksvoorschriften en nationale regels.',
    'Chaque tâche donne round(N / intervalle en semaines), N = semaines ISO de l’année du plan (52 ou 53), ordres par an sur une grille fixe (ancre + k·intervalle ; l’ancre est la prochaine échéance, ou choisie par le planificateur pour les gammes non datées). Un ordre peut bouger d’au plus floor(tolérance × intervalle) semaines entières (±10 % par défaut : trimestriel ±1 semaine, annuel ±5) ; les contrôles réglementaires jamais. Semaines admises : saison de chauffe S40–S17 et saison de froid S18–S39 par défaut (hypothèse pédagogique), avant-saison = 6 semaines avant la saison, semaines d’arrêt et de gel telles que saisies. Charge hebdomadaire par métier h = heures des tâches + déplacement par intervention ; les tâches d’un même équipement (ou lieu) et métier dans la même semaine partagent une intervention. Le lissage minimise Σ h² + 1000·surcharge² sur métiers et semaines (placement glouton des séries les plus contraintes d’abord, puis déplacements unitaires dans les fenêtres). Budget = heures × taux + déplacements + fournitures (% de la main-d’œuvre sauf saisie) + frais de déplacement par intervention de prestataire. Aide à la planification, ne remplace ni les instructions du fabricant ni la réglementation nationale.',
    'Cada tarea da round(N / intervalo en semanas), N = semanas ISO del año del plan (52 o 53), órdenes por año sobre una rejilla fija (ancla + k·intervalo; el ancla es el próximo vencimiento, o la elige el planificador en rutinas sin fecha). Una orden puede moverse como mucho floor(tolerancia × intervalo) semanas enteras (±10 % por defecto: trimestral ±1 semana, anual ±5); las pruebas reglamentarias nunca. Semanas permitidas: temporada de calefacción S40–S17 y de refrigeración S18–S39 por defecto (supuesto didáctico), pretemporada = 6 semanas antes de la temporada, semanas de parada y de bloqueo según lo introducido. Carga semanal por oficio h = horas de tareas + desplazamiento por visita; las tareas de un equipo (o ubicación) y oficio en la misma semana comparten una visita. La nivelación minimiza Σ h² + 1000·sobrecarga² en oficios y semanas (colocación voraz de las series más restringidas primero, luego movimientos individuales dentro de las ventanas). Presupuesto = horas × tarifa + desplazamientos + materiales (% de la mano de obra salvo que se indique) + cargo por visita de proveedor. Ayuda de planificación, no sustituye las instrucciones del fabricante ni la normativa nacional.',
    'Każde zadanie daje round(N / interwał w tygodniach), N = liczba tygodni ISO roku planu (52 lub 53), zleceń rocznie na stałej siatce (kotwica + k·interwał; kotwica to najbliższy termin, a dla czynności bez daty wybiera ją planer). Zlecenie może się przesunąć najwyżej o floor(tolerancja × interwał) pełnych tygodni (domyślnie ±10 %: kwartalne ±1 tydzień, roczne ±5); próby ustawowe nigdy. Dozwolone tygodnie: domyślnie sezon grzewczy T40–T17 i chłodniczy T18–T39 (założenie dydaktyczne), przedsezon = 6 tygodni przed sezonem, tygodnie postoju i blokady jak wpisano. Obciążenie branży w tygodniu h = godziny zadań + dojazd na wizytę; zadania jednego urządzenia (lub miejsca) i branży w jednym tygodniu to jedna wizyta. Wygładzanie minimalizuje Σ h² + 1000·przeciążenie² po branżach i tygodniach (zachłanne rozmieszczenie najbardziej ograniczonych serii najpierw, potem pojedyncze przesunięcia w oknach). Budżet = godziny × stawka + dojazdy + materiały (% robocizny, jeśli nie podano) + opłata za wizytę firmy zewnętrznej. Pomoc w planowaniu, nie zastępuje instrukcji producenta i przepisów krajowych.'),
  'notice.t': T7('What this plan is', 'Що це за план', 'Was dieser Plan ist', 'Wat dit plan is', 'Ce qu’est ce plan', 'Qué es este plan', 'Czym jest ten plan'),
  'notice.b': T7('A weekly planning view of preventive work. Routine intervals and hours of the class library are learning assumptions; statutory tests follow an EU baseline (national rules may be stricter) and are never moved or dropped. Planning aid, not a substitute for manufacturer instructions and national regulations.',
    'Тижневий план попереджувальних робіт. Інтервали й трудомісткість регламентів з бібліотеки класів — навчальні припущення; обов’язкові перевірки відповідають базовому рівню ЄС (національні правила можуть бути суворішими) і ніколи не зсуваються й не вилучаються. Допоміжний інструмент, не замінює інструкцій виробника й національних норм.',
    'Eine Wochenansicht der vorbeugenden Arbeiten. Intervalle und Stunden der Klassenbibliothek sind Lernannahmen; gesetzliche Prüfungen folgen einem EU-Grundniveau (nationale Regeln können strenger sein) und werden nie verschoben oder gestrichen. Planungshilfe, kein Ersatz für Herstellervorgaben und nationale Vorschriften.',
    'Een weekoverzicht van preventief werk. Intervallen en uren uit de klassenbibliotheek zijn leeraannames; wettelijke keuringen volgen een EU-basisniveau (nationale regels kunnen strenger zijn) en worden nooit verschoven of geschrapt. Planningshulpmiddel, geen vervanging van fabrieksvoorschriften en nationale regels.',
    'Une vue hebdomadaire des travaux préventifs. Intervalles et heures de la bibliothèque de classes sont des hypothèses pédagogiques ; les contrôles réglementaires suivent une base UE (les règles nationales peuvent être plus strictes) et ne sont jamais déplacés ni supprimés. Aide à la planification, ne remplace ni les instructions du fabricant ni la réglementation nationale.',
    'Una vista semanal del trabajo preventivo. Los intervalos y horas de la biblioteca de clases son supuestos didácticos; las pruebas reglamentarias siguen una base UE (las normas nacionales pueden ser más estrictas) y nunca se mueven ni se eliminan. Ayuda de planificación, no sustituye las instrucciones del fabricante ni la normativa nacional.',
    'Tygodniowy widok prac zapobiegawczych. Interwały i pracochłonność z biblioteki klas to założenia dydaktyczne; próby ustawowe odpowiadają poziomowi bazowemu UE (przepisy krajowe mogą być surowsze) i nigdy nie są przesuwane ani usuwane. Pomoc w planowaniu, nie zastępuje instrukcji producenta i przepisów krajowych.'),

    T7('The office register with class routines: every quarterly round was set up from week 1, so weeks 1, 14, 27 and 40 carry the year’s inspections and HVAC is overloaded. The levelled plan does the same hours with a peak several times lower — the legal tests stay on their dates.', 'Реєстр офісу з регламентами класів: усі щоквартальні обходи налаштовано з тижня 1, тож тижні 1, 14, 27 і 40 несуть інспекції року і ОВіК перевантажений. Вирівняний план виконує ті самі години з піком у кілька разів нижчим — обов’язкові перевірки лишаються на своїх датах.', 'Das Büroregister mit Klassenroutinen: jede Quartalsrunde wurde ab KW 1 angelegt, also tragen KW 1, 14, 27 und 40 die Inspektionen des Jahres und HLK ist überlastet. Der geglättete Plan schafft dieselben Stunden mit einer um ein Mehrfaches niedrigeren Spitze — die gesetzlichen Prüfungen bleiben auf ihren Terminen.', 'Het kantoorregister met klasseroutines: elke kwartaalronde is vanaf week 1 ingesteld, dus weken 1, 14, 27 en 40 dragen de inspecties van het jaar en W-installaties zijn overbelast. Het afgevlakte plan doet dezelfde uren met een piek die meerdere keren lager is — de wettelijke keuringen blijven op hun datum.', 'Le registre de bureaux avec les gammes types : chaque tournée trimestrielle a été créée dès la semaine 1, donc les semaines 1, 14, 27 et 40 portent les inspections de l’année et le CVC déborde. Le plan lissé fait les mêmes heures avec une pointe plusieurs fois plus basse — les contrôles réglementaires restent à leur date.', 'El registro de oficinas con rutinas por clase: cada ronda trimestral se creó desde la semana 1, así que las semanas 1, 14, 27 y 40 cargan las inspecciones del año y climatización se sobrecarga. El plan nivelado hace las mismas horas con un pico varias veces menor — las pruebas reglamentarias siguen en su fecha.', 'Rejestr biurowca z czynnościami klas: każdy obchód kwartalny ustawiono od tygodnia 1, więc tygodnie 1, 14, 27 i 40 niosą przeglądy całego roku, a HVAC jest przeciążony. Plan wygładzony robi te same godziny przy kilkakrotnie niższym szczycie — próby ustawowe zostają w swoich terminach.')],
  grouping: [T7('Group visits: one trip per asset', 'Групування: один виїзд на обладнання', 'Einsätze bündeln: eine Anfahrt je Anlage', 'Bezoeken bundelen: één rit per installatie', 'Regrouper : un déplacement par équipement', 'Agrupar visitas: un viaje por equipo', 'Grupowanie: jeden dojazd na urządzenie'),
    T7('A remote building with 1.5 h travel per visit. Monthly, quarterly and annual work on the same unit nest into the same weeks, so about a third of the trips disappear. Switch “One visit per” to “task” to see what the separate trips cost.', 'Віддалена будівля, 1,5 год дороги на виїзд. Щомісячні, щоквартальні й щорічні роботи на одній установці потрапляють у ті самі тижні, тож приблизно третина поїздок зникає. Перемкніть «Один виїзд на» на «завдання», щоб побачити ціну окремих поїздок.', 'Ein entferntes Gebäude mit 1,5 h Anfahrt je Einsatz. Monats-, Quartals- und Jahresarbeiten an derselben Anlage fallen in dieselben Wochen, etwa ein Drittel der Fahrten entfällt. Stellen Sie „Ein Einsatz je“ auf „Aufgabe“, um die Einzelfahrten zu sehen.', 'Een afgelegen gebouw met 1,5 u reistijd per bezoek. Maand-, kwartaal- en jaarwerk aan dezelfde kast valt in dezelfde weken, zodat ongeveer een derde van de ritten verdwijnt. Zet “Eén bezoek per” op “taak” om de losse ritten te zien.', 'Un bâtiment éloigné, 1,5 h de déplacement par intervention. Les travaux mensuels, trimestriels et annuels d’une même unité tombent dans les mêmes semaines : environ un tiers des déplacements disparaît. Passez « Une intervention par » à « tâche » pour voir le coût des trajets séparés.', 'Un edificio remoto con 1,5 h de desplazamiento por visita. Los trabajos mensuales, trimestrales y anuales de la misma unidad caen en las mismas semanas, y desaparece cerca de un tercio de los viajes. Cambie “Una visita por” a “tarea” para ver el coste de los viajes separados.', 'Odległy budynek, 1,5 h dojazdu na wizytę. Prace miesięczne, kwartalne i roczne przy tej samej centrali trafiają w te same tygodnie, więc znika około jednej trzeciej dojazdów. Przełącz „Jedna wizyta na” na „zadanie”, aby zobaczyć koszt osobnych dojazdów.')],
  statutory_locked: [T7('Statutory tests cannot be moved', 'Обов’язкові перевірки не переносяться', 'Gesetzliche Prüfungen sind nicht verschiebbar', 'Wettelijke keuringen schuiven niet', 'Les contrôles réglementaires ne bougent pas', 'Las pruebas reglamentarias no se mueven', 'Prób ustawowych nie da się przesunąć'),
    T7('Life-safety systems of a hospital wing with fixed legal dates. The leveller moves every routine job away from week 10, but the annual full-duration test of 220 emergency luminaires alone exceeds the electricians’ week: that overload stays and is labelled statutory — book extra hands or a contractor.', 'Системи безпеки крила лікарні з фіксованими законними датами. Вирівнювання прибирає з тижня 10 усі планові роботи, але щорічний тест повної тривалості 220 аварійних світильників сам перевищує тиждень електриків: це перевантаження лишається і позначене як обов’язкове — залучіть людей або підрядника.', 'Sicherheitssysteme eines Krankenhausflügels mit festen gesetzlichen Terminen. Die Glättung schiebt jede Routinearbeit aus KW 10, aber der jährliche Volldauertest von 220 Notleuchten allein übersteigt die Elektrikerwoche: diese Überlast bleibt und ist als gesetzlich markiert — Personal ergänzen oder Fremdfirma beauftragen.', 'Veiligheidssystemen van een ziekenhuisvleugel met vaste wettelijke data. Het afvlakken haalt elk routinewerk uit week 10, maar de jaarlijkse volledige-duurtest van 220 noodarmaturen overschrijdt alleen al de elektriciensweek: die overbelasting blijft en is als wettelijk gemarkeerd — extra mensen of een aannemer inzetten.', 'Systèmes de sécurité d’une aile d’hôpital aux dates légales fixes. Le lissage sort de la semaine 10 tout travail courant, mais l’essai annuel d’autonomie de 220 blocs de secours dépasse à lui seul la semaine des électriciens : cette surcharge reste, marquée réglementaire — renforcez ou sous-traitez.', 'Sistemas de seguridad de un ala de hospital con fechas legales fijas. La nivelación saca de la semana 10 todo el trabajo rutinario, pero la prueba anual de autonomía completa de 220 luminarias de emergencia supera por sí sola la semana de los electricistas: esa sobrecarga se queda y se marca como reglamentaria — más personal o un contratista.', 'Systemy bezpieczeństwa skrzydła szpitala ze stałymi terminami prawnymi. Wygładzanie usuwa z tygodnia 10 wszystkie prace rutynowe, ale coroczny test pełnego czasu 220 opraw awaryjnych sam przekracza tydzień elektryków: to przeciążenie zostaje i jest oznaczone jako ustawowe — dołóż ludzi lub wykonawcę.')],
  chiller_winter: [T7('Chiller service in the heating season', 'Сервіс чилера — в опалювальний сезон', 'Kältemaschinenwartung in der Heizperiode', 'Koelmachineonderhoud in het stookseizoen', 'Entretien du groupe froid en saison de chauffe', 'Mantenimiento de la enfriadora en temporada de calefacción', 'Serwis agregatu w sezonie grzewczym'),
    T7('The chillers were commissioned in July, so their annual service falls in the cooling peak; the boiler’s falls in January. ±10 % tolerance (±5 weeks) cannot reach the off-season: the planner flags them. Tick “Re-baseline” and the anniversaries move once — chillers to winter, the boiler to May (late, flagged: the interval stretches once).', 'Чилери введено в експлуатацію в липні, тож їхній щорічний сервіс припадає на пік охолодження, а котла — на січень. Допуск ±10 % (±5 тижнів) не дотягується до міжсезоння: планувальник позначає їх. Увімкніть «Переносити дати» — річниці зсуваються одноразово: чилери на зиму, котел на травень (пізніше, з позначкою: інтервал одноразово подовжується).', 'Die Kältemaschinen wurden im Juli in Betrieb genommen, ihre Jahreswartung fällt in die Kühlspitze; die des Kessels in den Januar. ±10 % Toleranz (±5 Wochen) erreicht die Nebensaison nicht: der Planer markiert sie. „Termine neu festlegen“ anhaken — die Jahrestermine wandern einmal: Kältemaschinen in den Winter, der Kessel in den Mai (spät, markiert: das Intervall dehnt sich einmal).', 'De koelmachines zijn in juli opgeleverd, dus hun jaaronderhoud valt in de koelpiek; dat van de ketel in januari. ±10 % tolerantie (±5 weken) haalt het tussenseizoen niet: de planner markeert ze. Vink “opnieuw vastleggen” aan en de jaardata verschuiven eenmalig — koelmachines naar de winter, de ketel naar mei (te laat, gemarkeerd: het interval rekt eenmalig op).', 'Les groupes froids ont été mis en service en juillet : leur entretien annuel tombe au pic de froid ; celui de la chaudière en janvier. La tolérance de ±10 % (±5 semaines) n’atteint pas l’intersaison : le planificateur les signale. Cochez « Recaler » et les échéances bougent une fois — groupes froids en hiver, chaudière en mai (en retard, signalé : l’intervalle s’allonge une fois).', 'Las enfriadoras se pusieron en marcha en julio, así que su mantenimiento anual cae en el pico de frío; el de la caldera en enero. La tolerancia de ±10 % (±5 semanas) no llega a la temporada baja: el planificador las marca. Active “Reprogramar” y los aniversarios se mueven una vez — enfriadoras al invierno, caldera a mayo (tarde, marcada: el intervalo se alarga una vez).', 'Agregaty uruchomiono w lipcu, więc ich roczny serwis wypada w szczycie chłodzenia, a kotła — w styczniu. Tolerancja ±10 % (±5 tygodni) nie sięga poza sezon: planer je oznacza. Zaznacz „Przestawić terminy”, a rocznice przesuną się raz — agregaty na zimę, kocioł na maj (później, z oznaczeniem: interwał jednorazowo się wydłuża).')],
  shutdown: [T7('Shutdown work vs on-load thermography', 'Роботи на зупинці проти тепловізора під навантаженням', 'Stillstandsarbeit gegen Thermografie unter Last', 'Stilstandswerk tegenover thermografie onder last', 'Travaux d’arrêt contre thermographie en charge', 'Trabajo en parada frente a termografía en carga', 'Prace w postoju a termowizja pod obciążeniem'),
    T7('A production site with a two-week summer shutdown (W31–32) and no routine work over Christmas. Switchboard cleaning and torque checks need the shutdown; thermography needs current flowing — in a shutdown week it sees nothing. The planner puts each on the right side of the shutdown.', 'Виробничий об’єкт із двотижневою літньою зупинкою (Т31–32) і без планових робіт на Різдво. Очищення й протяжка щитів потребують зупинки; тепловізійний контроль потребує струму — у тиждень зупинки він нічого не побачить. Планувальник ставить кожне по правильний бік зупинки.', 'Ein Produktionsstandort mit zwei Wochen Sommerstillstand (KW 31–32) und ohne Routinearbeit über Weihnachten. Reinigung und Anzugskontrolle der Verteilungen brauchen den Stillstand; Thermografie braucht Stromfluss — in der Stillstandswoche sieht sie nichts. Der Planer legt beides auf die richtige Seite.', 'Een productielocatie met twee weken zomerstilstand (W31–32) en geen routinewerk rond Kerst. Reinigen en aanhalen van verdeelinrichtingen vraagt stilstand; thermografie vraagt stroom — in een stilstandsweek ziet ze niets. De planner zet elk aan de juiste kant van de stilstand.', 'Un site de production avec deux semaines d’arrêt estival (S31–32) et pas de travaux courants à Noël. Nettoyage et resserrage des tableaux exigent l’arrêt ; la thermographie exige du courant — en semaine d’arrêt elle ne voit rien. Le planificateur place chacun du bon côté de l’arrêt.', 'Una planta con dos semanas de parada en verano (S31–32) y sin rutinas en Navidad. La limpieza y el apriete de los cuadros requieren la parada; la termografía requiere corriente — en una semana de parada no ve nada. El planificador pone cada una en el lado correcto de la parada.', 'Zakład produkcyjny z dwutygodniowym postojem letnim (T31–32) i bez prac rutynowych w Boże Narodzenie. Czyszczenie i dokręcanie rozdzielnic wymaga postoju; termowizja wymaga płynącego prądu — w tygodniu postoju nic nie zobaczy. Planer stawia każde po właściwej stronie postoju.')]

var CORE_SITES = ['office_12', 'datacentre_8', 'hospital_wing_10', 'school_8'];
var CORE_SITE_NOTE = T7('Shared demo building of the MEP maintenance package: the baseline is built from the class routines and the statutory tasks. For the plan your RCM study gives, run the strategy tool on the same register and press Use.', 'Спільна демо-будівля пакета ТО: базовий план побудовано з регламентів класів і обов’язкових завдань. Для плану з вашого RCM-аналізу запустіть інструмент стратегії на тому ж реєстрі й натисніть «Використати».', 'Gemeinsames Demogebäude des Wartungspakets: der Grundplan entsteht aus Klassenroutinen und gesetzlichen Aufgaben. Für den Plan aus Ihrer RCM-Analyse das Strategiewerkzeug auf demselben Register ausführen und „Verwenden“ drücken.', 'Gedeeld demogebouw van het onderhoudspakket: het basisplan komt uit klasseroutines en wettelijke taken. Voor het plan uit uw RCM-analyse draait u de strategietool op hetzelfde register en kiest u Gebruiken.', 'Bâtiment de démonstration commun du paquet : le plan de base vient des gammes par classe et des tâches réglementaires. Pour le plan issu de votre étude RCM, lancez l’outil de stratégie sur le même registre puis Utiliser.', 'Edificio de demostración común del paquete: el plan base sale de las rutinas por clase y las tareas reglamentarias. Para el plan de su estudio RCM, ejecute la herramienta de estrategia sobre el mismo registro y pulse Usar.', 'Wspólny budynek demonstracyjny pakietu: plan bazowy powstaje z czynności klas i zadań ustawowych. Dla planu z Twojej analizy RCM uruchom narzędzie strategii na tym samym rejestrze i naciśnij Użyj.');
function coreSiteState(k) {
  if (!CORE || !PLAN) return null; var d = CORE.presetSite(k); if (!d) return null;
  var o = defaultOpts(); return { src: 'classes', preset: k, doc: d, tasks: PLAN.tasksFromClasses(d).map(rowOf), o: o, view: 'levelled', trade: 'all', week: 1, origin: 'preset' };
}
function examples() {
  var list = (PLAN ? PLAN.PRESET_IDS : []).filter(function (k) { return PL[k]; }).map(function (k) {
    return { id: k, label: PL[k][0], note: PL[k][1], apply: function (t) { var x = presetState(k); Object.keys(x).forEach(function (q) { t[q] = x[q]; }); t.week = k === 'statutory_locked' ? 10 : k === 'shutdown' ? 31 : k === 'chiller_winter' ? 28 : 1; note = ''; } };
  });
  CORE_SITES.forEach(function (k) {
    if (!CORE || !CORE.PRESET_SITES || !CORE.PRESET_SITES[k]) return;
    var meta = CORE.PRESET_SITES[k].meta || {};
    list.push({ id: k, label: meta.title || T7(k, k, k, k, k, k, k), note: CORE_SITE_NOTE, apply: function (t) { var x = coreSiteState(k); Object.keys(x).forEach(function (q) { t[q] = x[q]; }); note = ''; } });
  });
  return list;
}

  topics: {
    grid: { title: T7('The yearly grid and the tolerance', 'Річна сітка й допуск', 'Jahresraster und Toleranz', 'Het jaarraster en de tolerantie', 'La grille annuelle et la tolérance', 'La rejilla anual y la tolerancia', 'Siatka roczna i tolerancja'),
      body: T7('A quarterly task is four work orders 13 weeks apart, anchored at its next due date. Each order may slip a little — by default ±10 % of the interval, which is ±1 week for quarterly and ±5 weeks for annual, and nothing for monthly. Moving the whole grid is a once-only re-baseline, not levelling.',
        'Щоквартальне завдання — це чотири наряди з кроком 13 тижнів від найближчого терміну. Кожен наряд може трохи зсунутися — типово на ±10 % інтервалу: ±1 тиждень для щоквартальних, ±5 для щорічних і нуль для щомісячних. Зсув усієї сітки — одноразове перенесення дат, а не вирівнювання.',
        'Eine Quartalsaufgabe sind vier Aufträge im Abstand von 13 Wochen, verankert am nächsten Fälligkeitstermin. Jeder Auftrag darf etwas rutschen — standardmäßig ±10 % des Intervalls: ±1 Woche bei Quartals-, ±5 bei Jahresaufgaben, nichts bei Monatsaufgaben. Das ganze Raster zu verschieben ist eine einmalige Neufestlegung, keine Glättung.',
        'Een kwartaaltaak is vier werkorders met 13 weken ertussen, verankerd aan de volgende vervaldatum. Elke order mag iets schuiven — standaard ±10 % van het interval: ±1 week per kwartaal, ±5 per jaar, niets per maand. Het hele raster verschuiven is een eenmalige herplanning, geen afvlakken.',

        'Una tarea trimestral son cuatro órdenes separadas 13 semanas, ancladas en el próximo vencimiento. Cada orden puede deslizarse un poco — por defecto ±10 % del intervalo: ±1 semana en trimestral, ±5 en anual, nada en mensual. Mover toda la rejilla es una reprogramación única, no una nivelación.',
        'Zadanie kwartalne to cztery zlecenia co 13 tygodni, zakotwiczone w najbliższym terminie. Każde zlecenie może się nieco przesunąć — domyślnie o ±10 % interwału: ±1 tydzień dla kwartalnych, ±5 dla rocznych, wcale dla miesięcznych. Przesunięcie całej siatki to jednorazowe przestawienie terminów, nie wygładzanie.') },
    levelling: { title: T7('Levelling: same hours, lower peak', 'Вирівнювання: ті самі години, нижчий пік', 'Glättung: gleiche Stunden, niedrigere Spitze', 'Afvlakken: zelfde uren, lagere piek', 'Lissage : mêmes heures, pointe plus basse', 'Nivelación: mismas horas, pico menor', 'Wygładzanie: te same godziny, niższy szczyt'),
      body: T7('When every routine was created on the same day, all quarterly work lands in the same four weeks. For undated routines the planner chooses where each series starts, then nudges single orders inside their windows, so that no trade’s week is far above its average and none is above its in-house hours. The yearly hours do not change.',
        'Коли всі регламенти створено в один день, уся щоквартальна робота падає на ті самі чотири тижні. Для регламентів без дати планувальник обирає, де починається кожна серія, а потім зсуває окремі наряди в межах вікон, щоб жоден тиждень фаху не був набагато вищим за середній і не перевищував власних годин. Річні години не змінюються.',
        'Wurden alle Routinen am selben Tag angelegt, landet die Quartalsarbeit in denselben vier Wochen. Bei undatierten Routinen wählt der Planer den Start jeder Serie und schiebt dann einzelne Aufträge innerhalb ihrer Fenster, damit keine Gewerkewoche weit über dem Mittel und keine über den eigenen Stunden liegt. Die Jahresstunden ändern sich nicht.',
        'Als alle routines op dezelfde dag zijn aangemaakt, valt al het kwartaalwerk in dezelfde vier weken. Voor ongedateerde routines kiest de planner waar elke reeks start en schuift daarna losse orders binnen hun venster, zodat geen week van een discipline ver boven het gemiddelde of boven de eigen uren ligt. De jaaruren veranderen niet.',
        'Si toutes les gammes ont été créées le même jour, tout le trimestriel tombe dans les mêmes quatre semaines. Pour les gammes non datées, le planificateur choisit le départ de chaque série puis décale des ordres isolés dans leurs fenêtres, pour qu’aucune semaine d’un métier ne dépasse de loin la moyenne ni les heures internes. Les heures annuelles ne changent pas.',
        'Si todas las rutinas se crearon el mismo día, todo el trabajo trimestral cae en las mismas cuatro semanas. Para rutinas sin fecha el planificador elige dónde empieza cada serie y luego mueve órdenes sueltas dentro de sus ventanas, para que ninguna semana de un oficio quede muy por encima de la media ni de las horas propias. Las horas anuales no cambian.',
        'Gdy wszystkie czynności utworzono tego samego dnia, cała praca kwartalna trafia w te same cztery tygodnie. Dla czynności bez daty planer wybiera start każdej serii, a potem przesuwa pojedyncze zlecenia w ich oknach, by żaden tydzień branży nie był dużo powyżej średniej ani ponad własne godziny. Godziny roczne się nie zmieniają.') },
    grouping: { title: T7('Visits and travel time', 'Виїзди й час на дорогу', 'Einsätze und Anfahrtszeit', 'Bezoeken en reistijd', 'Interventions et déplacements', 'Visitas y desplazamientos', 'Wizyty i czas dojazdu'),
      body: T7('Every visit costs set-up and travel — permits, keys, tools, the drive. Tasks of the same asset (or location) and trade in the same week share one visit, so the leveller prefers to nest quarterly and annual work into a monthly round. The tile shows the travel hours saved compared with one trip per work order.',
        'Кожен виїзд коштує підготовки й дороги — допуски, ключі, інструмент, поїздка. Завдання одного обладнання (або місця) й фаху в одному тижні — це один виїзд, тому вирівнювання охоче вкладає щоквартальні й щорічні роботи в щомісячний обхід. Плитка показує зекономлені години дороги порівняно з окремою поїздкою на кожен наряд.',
        'Jeder Einsatz kostet Rüst- und Anfahrtszeit — Freigaben, Schlüssel, Werkzeug, Fahrt. Aufgaben derselben Anlage (oder desselben Orts) und desselben Gewerks in derselben Woche teilen einen Einsatz; die Glättung schachtelt daher Quartals- und Jahresarbeit in den Monatsrundgang. Die Kachel zeigt die gesparten Anfahrtsstunden gegenüber einer Fahrt je Auftrag.',
        'Elk bezoek kost voorbereiding en reistijd — vergunningen, sleutels, gereedschap, de rit. Taken van dezelfde installatie (of locatie) en discipline in dezelfde week delen één bezoek, dus het afvlakken nestelt kwartaal- en jaarwerk in de maandronde. De tegel toont de bespaarde reisuren tegenover één rit per werkorder.',
        'Chaque intervention coûte préparation et déplacement — permis, clés, outillage, trajet. Les tâches d’un même équipement (ou lieu) et métier dans la même semaine partagent une intervention : le lissage emboîte donc le trimestriel et l’annuel dans la tournée mensuelle. La tuile montre les heures de déplacement économisées face à un trajet par ordre.',
        'Cada visita cuesta preparación y desplazamiento — permisos, llaves, herramientas, el viaje. Las tareas de un mismo equipo (o ubicación) y oficio en la misma semana comparten una visita, por lo que la nivelación encaja el trabajo trimestral y anual en la ronda mensual. El indicador muestra las horas de viaje ahorradas frente a un viaje por orden.',
        'Każda wizyta kosztuje przygotowanie i dojazd — pozwolenia, klucze, narzędzia, droga. Zadania tego samego urządzenia (lub miejsca) i branży w tym samym tygodniu to jedna wizyta, więc wygładzanie wkłada prace kwartalne i roczne w obchód miesięczny. Kafelek pokazuje zaoszczędzone godziny dojazdu wobec osobnego dojazdu na każde zlecenie.') },
    statutory: { title: T7('Statutory tests stay put', 'Обов’язкові перевірки — на місці', 'Gesetzliche Prüfungen bleiben stehen', 'Wettelijke keuringen blijven staan', 'Les contrôles réglementaires restent en place', 'Las pruebas reglamentarias se quedan', 'Próby ustawowe zostają na miejscu'),
      body: T7('F-gas leak checks, legionella monitoring, sprinkler pump runs, emergency lighting and fire alarm tests, generator runs and EPBD inspections keep their dates: tolerance zero, never dropped by the leveller. Unknown dates are assumed due now and flagged. If a week is overloaded by statutory work alone, the answer is staffing, not shifting.',
        'Перевірки F-газів на витоки, контроль легіонели, пуски спринклерних насосів, тести аварійного освітлення й пожежної сигналізації, прогони генератора та інспекції EPBD зберігають свої дати: допуск нуль, вирівнювання їх ніколи не прибирає. Невідомі дати вважаються настанням терміну зараз і позначаються. Якщо тиждень перевантажений лише обов’язковими роботами, рішення — люди, а не перенесення.',
        'F-Gas-Dichtheitskontrollen, Legionellenüberwachung, Sprinklerpumpenläufe, Prüfungen von Notbeleuchtung und Brandmeldeanlage, Probeläufe des Aggregats und EPBD-Inspektionen behalten ihre Termine: Toleranz null, nie von der Glättung gestrichen. Unbekannte Termine gelten als jetzt fällig und werden markiert. Ist eine Woche allein durch gesetzliche Arbeit überlastet, hilft Personal, nicht Verschieben.',
        'F-gaslekcontroles, legionellabewaking, sprinklerpompproeven, tests van noodverlichting en brandmelding, proefdraaien van het aggregaat en EPBD-keuringen houden hun data: tolerantie nul, nooit geschrapt door het afvlakken. Onbekende data gelden als nu vervallen en worden gemarkeerd. Is een week alleen door wettelijk werk overbelast, dan helpt bezetting, niet schuiven.',
        'Contrôles d’étanchéité F-gaz, surveillance légionelle, essais des pompes sprinkler, de l’éclairage de sécurité et de l’alarme incendie, essais du groupe et inspections EPBD gardent leurs dates : tolérance nulle, jamais supprimés par le lissage. Les dates inconnues sont supposées échues et signalées. Si une semaine déborde à cause du seul réglementaire, la réponse est l’effectif, pas le déplacement.',
        'Los controles de fugas de gases fluorados, el control de legionela, los arranques de bombas de rociadores, las pruebas de alumbrado de emergencia y de alarma de incendios, las pruebas del grupo y las inspecciones EPBD conservan sus fechas: tolerancia cero, la nivelación nunca las elimina. Las fechas desconocidas se suponen vencidas y se marcan. Si una semana se sobrecarga solo por trabajo reglamentario, la respuesta es personal, no mover.',
        'Kontrole szczelności F-gazów, monitoring legionelli, rozruchy pomp tryskaczowych, próby oświetlenia awaryjnego i sygnalizacji pożaru, próby agregatu i kontrole EPBD zachowują terminy: tolerancja zero, wygładzanie nigdy ich nie usuwa. Nieznane terminy uznaje się za przypadające teraz i oznacza. Jeśli tydzień jest przeciążony wyłącznie pracami ustawowymi, rozwiązaniem są ludzie, nie przesuwanie.') },
    seasons: { title: T7('Seasons: service when the plant can stop', 'Сезони: сервіс, коли обладнання можна зупинити', 'Saisons: Wartung, wenn die Anlage stehen darf', 'Seizoenen: onderhoud wanneer de installatie mag stilstaan', 'Saisons : entretenir quand on peut arrêter', 'Temporadas: mantener cuando la planta puede parar', 'Sezony: serwis, gdy instalację można zatrzymać'),
      body: T7('A chiller’s annual service takes it off-line for a day or more, so it belongs in the heating season; a boiler’s in summer. Frost protection is tested before winter, cooling towers and chillers are started up before summer. Season weeks are learning assumptions for central and north-west Europe — set your own.',
        'Щорічний сервіс чилера виводить його з роботи на день і більше, тож йому місце в опалювальному сезоні; котла — влітку. Захист від замерзання перевіряють перед зимою, градирні й чилери запускають перед літом. Тижні сезонів — навчальні припущення для Центральної й Північно-Західної Європи; задайте власні.',
        'Die Jahreswartung einer Kältemaschine nimmt sie einen Tag oder länger vom Netz, sie gehört in die Heizperiode; die des Kessels in den Sommer. Frostschutz wird vor dem Winter geprüft, Kühltürme und Kältemaschinen vor dem Sommer in Betrieb genommen. Die Saisonwochen sind Lernannahmen für Mittel- und Nordwesteuropa — eigene eintragen.',
        'Het jaaronderhoud van een koelmachine haalt haar een dag of langer uit bedrijf, dus hoort het in het stookseizoen; dat van een ketel in de zomer. Vorstbeveiliging wordt vóór de winter getest, koeltorens en koelmachines vóór de zomer opgestart. De seizoensweken zijn leeraannames voor Midden- en Noordwest-Europa — vul uw eigen in.',
        'L’entretien annuel d’un groupe froid l’arrête un jour ou plus : il a sa place en saison de chauffe ; celui d’une chaudière en été. L’antigel se teste avant l’hiver, tours et groupes froids se remettent en route avant l’été. Les semaines de saison sont des hypothèses pédagogiques pour l’Europe centrale et du Nord-Ouest — saisissez les vôtres.',
        'El mantenimiento anual de una enfriadora la deja fuera de servicio un día o más, así que corresponde a la temporada de calefacción; el de la caldera, al verano. La protección antihielo se prueba antes del invierno; torres y enfriadoras se ponen en marcha antes del verano. Las semanas de temporada son supuestos didácticos para Europa central y noroccidental — ponga las suyas.',
        'Roczny serwis agregatu wyłącza go na dzień lub dłużej, więc jego miejsce jest w sezonie grzewczym; kotła — latem. Ochronę przeciwzamrożeniową sprawdza się przed zimą, chłodnie i agregaty uruchamia przed latem. Tygodnie sezonów to założenia dydaktyczne dla Europy Środkowej i Północno-Zachodniej — wpisz własne.') },
    shutdown: { title: T7('Shutdowns and blackout weeks', 'Зупинки й тижні без робіт', 'Stillstände und Sperrwochen', 'Stilstanden en blokkadeweken', 'Arrêts et semaines gelées', 'Paradas y semanas bloqueadas', 'Postoje i tygodnie blokady'),
      body: T7('Some work needs the plant dead (switchboard cleaning, torque checks, protection tests), some needs it alive (thermography only sees hot joints under load). Blackout weeks — holidays, peak trading, exams — get no routine work, but statutory tests still happen and are flagged so that someone is rostered.',
        'Частина робіт потребує знеструмленого обладнання (очищення щитів, протяжка, перевірка захистів), частина — працюючого (тепловізор бачить гарячі з’єднання лише під навантаженням). У тижні без робіт — свята, пікові продажі, іспити — планові роботи не ставляться, але обов’язкові перевірки відбуваються й позначаються, щоб хтось чергував.',
        'Manche Arbeit braucht die Anlage spannungsfrei (Reinigung, Anzugskontrolle, Schutzprüfung), manche unter Last (Thermografie sieht heiße Verbindungen nur mit Stromfluss). Sperrwochen — Feiertage, Hochsaison, Prüfungen — bekommen keine Routinearbeit, gesetzliche Prüfungen finden trotzdem statt und werden markiert, damit jemand eingeteilt ist.',
        'Sommig werk vraagt een spanningsloze installatie (reinigen, aanhalen, beveiligingstest), sommig een werkende (thermografie ziet hete verbindingen alleen onder last). Blokkadeweken — vakanties, piekverkoop, examens — krijgen geen routinewerk, maar wettelijke keuringen gaan door en worden gemarkeerd zodat iemand is ingeroosterd.',
        'Certains travaux exigent l’installation hors tension (nettoyage, resserrage, essais des protections), d’autres en service (la thermographie ne voit les points chauds qu’en charge). Les semaines gelées — congés, pics d’activité, examens — n’ont pas de travaux courants, mais les contrôles réglementaires ont lieu et sont signalés pour que quelqu’un soit d’astreinte.',
        'Algunos trabajos requieren la instalación sin tensión (limpieza, apriete, prueba de protecciones), otros en servicio (la termografía solo ve puntos calientes en carga). Las semanas bloqueadas — vacaciones, picos de venta, exámenes — no reciben rutinas, pero las pruebas reglamentarias se hacen igualmente y se marcan para asignar personal.',
        'Część prac wymaga instalacji bez napięcia (czyszczenie, dokręcanie, próby zabezpieczeń), część — pracującej (termowizja widzi gorące połączenia tylko pod obciążeniem). Tygodnie blokady — święta, szczyt sprzedaży, egzaminy — nie dostają prac rutynowych, ale próby ustawowe się odbywają i są oznaczane, by ktoś miał dyżur.') },
    capacity: { title: T7('In-house hours and overload', 'Власні години й перевантаження', 'Eigene Stunden und Überlast', 'Eigen uren en overbelasting', 'Heures internes et surcharge', 'Horas propias y sobrecarga', 'Własne godziny i przeciążenie'),
      body: T7('Enter the hours per week your own team can give each trade to planned work (leave empty for contracted trades). Red cells are weeks above that line; the conflicts list says whether levelling could help or whether the overload is statutory and needs extra hands.',
        'Введіть години на тиждень, які ваша команда може дати кожному фаху на планові роботи (порожньо — для фахів на підряді). Червоні клітинки — тижні понад цю межу; у конфліктах видно, чи допоможе вирівнювання, чи перевантаження обов’язкове й потрібні додаткові люди.',
        'Tragen Sie die Wochenstunden ein, die Ihr eigenes Team je Gewerk für geplante Arbeit hat (leer bei fremdvergebenen Gewerken). Rote Zellen sind Wochen darüber; die Konfliktliste sagt, ob Glätten hilft oder ob die Überlast gesetzlich ist und Personal braucht.',
        'Vul de uren per week in die uw eigen team per discipline aan gepland werk kan besteden (leeg voor uitbestede disciplines). Rode cellen zijn weken erboven; de conflictenlijst zegt of afvlakken helpt of dat de overbelasting wettelijk is en extra mensen vraagt.',
        'Saisissez les heures par semaine que votre équipe peut consacrer au préventif par métier (vide pour les métiers sous-traités). Les cellules rouges sont les semaines au-dessus ; la liste des conflits indique si le lissage peut aider ou si la surcharge est réglementaire et exige du renfort.',
        'Introduzca las horas semanales que su equipo puede dedicar al trabajo planificado por oficio (vacío para oficios subcontratados). Las celdas rojas son semanas por encima; la lista de conflictos indica si nivelar ayuda o si la sobrecarga es reglamentaria y necesita refuerzo.',
        'Wpisz godziny tygodniowo, które Twój zespół może dać każdej branży na prace planowe (puste dla branż zleconych). Czerwone komórki to tygodnie powyżej tej linii; lista konfliktów mówi, czy wygładzanie pomoże, czy przeciążenie jest ustawowe i trzeba dołożyć ludzi.') },
    conflicts: { title: T7('Reading the conflicts', 'Як читати конфлікти', 'Konflikte lesen', 'Conflicten lezen', 'Lire les conflits', 'Leer los conflictos', 'Jak czytać konflikty'),
      body: T7('Errors need a decision: a week over capacity, a dated task whose window it cannot reach, an overdue order. Warnings need data: a statutory test without a date, a multi-year inspection with no last date. Notes record what the planner did for you, such as a re-baselined anniversary.',
        'Помилки потребують рішення: тиждень понад можливості, завдання з датою, що не дотягується до свого вікна, прострочений наряд. Попередження потребують даних: обов’язкова перевірка без дати, багаторічна інспекція без останньої дати. Примітки фіксують, що планувальник зробив за вас, наприклад перенесену річницю.',
        'Fehler verlangen eine Entscheidung: eine Woche über Kapazität, eine datierte Aufgabe außerhalb ihres Fensters, ein überfälliger Auftrag. Warnungen verlangen Daten: eine gesetzliche Prüfung ohne Termin, eine mehrjährige Inspektion ohne letztes Datum. Hinweise halten fest, was der Planer getan hat, etwa einen neu festgelegten Jahrestermin.',
        'Fouten vragen een besluit: een week boven capaciteit, een gedateerde taak die haar venster niet haalt, een achterstallige order. Waarschuwingen vragen gegevens: een wettelijke keuring zonder datum, een meerjarige keuring zonder laatste datum. Opmerkingen leggen vast wat de planner voor u deed, zoals een herplande jaardatum.',
        'Les erreurs appellent une décision : semaine au-delà de la capacité, tâche datée hors de portée de sa fenêtre, ordre en retard. Les avertissements appellent des données : contrôle réglementaire sans date, inspection pluriannuelle sans dernière date. Les notes consignent ce que le planificateur a fait, comme une échéance recalée.',
        'Los errores exigen una decisión: semana por encima de la capacidad, tarea fechada que no alcanza su ventana, orden vencida. Los avisos exigen datos: prueba reglamentaria sin fecha, inspección plurianual sin última fecha. Las notas registran lo que hizo el planificador, como un aniversario reprogramado.',
        'Błędy wymagają decyzji: tydzień ponad zdolność, zadanie z datą poza zasięgiem okna, zaległe zlecenie. Ostrzeżenia wymagają danych: próba ustawowa bez daty, wieloletnia kontrola bez ostatniej daty. Uwagi zapisują, co planer zrobił za Ciebie, np. przestawioną rocznicę.') },
    budget: { title: T7('Budget and the CMMS export', 'Бюджет і експорт у CMMS', 'Budget und CMMS-Export', 'Budget en CMMS-export', 'Budget et export GMAO', 'Presupuesto y exportación al GMAO', 'Budżet i eksport do CMMS'),
      body: T7('Cost = hours × trade rate + travel + materials (a share of labour unless a task gives its own) + a call-out fee per vendor visit, spread by the month of each work order. The CMMS CSV lists every work order with planned week and date, due date, tolerance window, trade, hours and visit; cells that start with = + − @ are prefixed so a spreadsheet cannot run them.',
        'Вартість = години × ставка фаху + дорога + матеріали (частка від праці, якщо завдання не має власної суми) + плата за виклик підрядника, розподілена за місяцем кожного наряду. CSV для CMMS містить кожен наряд із запланованим тижнем і датою, терміном, вікном допуску, фахом, годинами й виїздом; клітинки, що починаються з = + − @, отримують префікс, щоб таблиця не виконала їх як формулу.',
        'Kosten = Stunden × Satz + Anfahrt + Material (Anteil an der Arbeit, sofern die Aufgabe keinen eigenen Betrag hat) + Anfahrtspauschale je Fremdfirmeneinsatz, verteilt nach dem Monat jedes Auftrags. Die CMMS-CSV listet jeden Auftrag mit geplanter Woche und Datum, Fälligkeit, Toleranzfenster, Gewerk, Stunden und Einsatz; Zellen, die mit = + − @ beginnen, erhalten ein Präfix, damit eine Tabellenkalkulation sie nicht ausführt.',
        'Kosten = uren × tarief + reistijd + materiaal (aandeel van arbeid tenzij de taak een eigen bedrag heeft) + voorrijkosten per bezoek van een externe partij, verdeeld naar de maand van elke werkorder. De CMMS-CSV bevat elke werkorder met geplande week en datum, vervaldatum, tolerantievenster, discipline, uren en bezoek; cellen die met = + − @ beginnen krijgen een voorvoegsel zodat een spreadsheet ze niet uitvoert.',
        'Coût = heures × taux + déplacements + fournitures (part de la main-d’œuvre sauf montant propre) + frais par intervention de prestataire, réparti selon le mois de chaque ordre. Le CSV GMAO liste chaque ordre avec semaine et date prévues, échéance, fenêtre de tolérance, métier, heures et intervention ; les cellules commençant par = + − @ sont préfixées pour qu’un tableur ne les exécute pas.',
        'Coste = horas × tarifa + desplazamientos + materiales (parte de la mano de obra salvo importe propio) + cargo por visita de proveedor, repartido por el mes de cada orden. El CSV para el GMAO lista cada orden con semana y fecha previstas, vencimiento, ventana de tolerancia, oficio, horas y visita; las celdas que empiezan por = + − @ llevan un prefijo para que una hoja de cálculo no las ejecute.',
        'Koszt = godziny × stawka + dojazdy + materiały (udział w robociźnie, chyba że zadanie ma własną kwotę) + opłata za wizytę firmy zewnętrznej, rozłożony według miesiąca każdego zlecenia. CSV dla CMMS zawiera każde zlecenie z planowanym tygodniem i datą, terminem, oknem tolerancji, branżą, godzinami i wizytą; komórki zaczynające się od = + − @ dostają prefiks, by arkusz ich nie wykonał.') }
  },
  tour: [{ topic: 'grid', focus: '[data-dgu-field="f-tasks"]' }, { topic: 'levelling', focus: '.dgu-stage' }, { topic: 'grouping', focus: '[data-dgu-field="f-group"]' },
         { topic: 'statutory' }, { topic: 'seasons', focus: '[data-dgu-field="f-heat-from"]' }, { topic: 'conflicts', focus: '.dgu-r-results' }, { topic: 'budget' }] };

/* ---- interface ---- */
var bar = null;
function buildInterface() {
  var hasBar = !!(CORE && CORE.ui && typeof CORE.ui.registerBar === 'function');
  var tradeOpts = function () { return TRADES.map(function (t) { return { value: t, label: tradeName(t) }; }); };
  var capFields = TRADES.map(function (t) {
    return { id: 'f-cap-' + t, key: 'o.cap.' + t, type: 'number', label: function () { return tradeName(t); }, unit: U('u.hw'), min: 0, max: 400, step: 1 };
  });
  var rateFields = TRADES.map(function (t) {
    return { id: 'f-rate-' + t, key: 'o.rate.' + t, type: 'number', label: function () { return S('f.rate') + ': ' + tradeName(t); }, unit: U('u.eurh'), min: 0, max: 1000, step: 5 };
  });
  ui = DiagramUI.app({
    id: TOOL, mount: '#app', layout: 'calculator', compute: 'live', state: state, defaults: DEFAULTS,
    subtitle: tx('subtitle'), learn: LEARN, footer: tx('footer'),
    notices: [{ id: 'genre', tone: 'warn', sticky: true, title: tx('notice.t'), text: tx('notice.b') }],
    panels: [
      { id: 'regbar', slot: 'inputs', visible: hasBar, render: hasBar ? function (box) {
          try { bar = CORE.ui.registerBar({ mount: box, toolId: TOOL, lang: curLang, getDoc: function () { return docWithPlan(); },
            onUse: function (k, mod, doc) { if (k === 'mepstrategy') { useStrategy(doc); } else { state.doc = doc; } if (ui) { ui.sync(); ui.run(); } },
            onChange: function (doc) { state.doc = doc; state.origin = 'register'; if (ui) { ui.sync(); ui.run(); } } }); } catch (e) { bar = null; }
        } : undefined },
      { id: 'source', slot: 'inputs', title: tx('p.source'), learn: 'grid', actions: [

          { id: 'f-group', key: 'o.group_by', type: 'segmented', label: tx('f.group'), options: [{ value: 'asset', label: tx('g.asset') }, { value: 'location', label: tx('g.location') }, { value: 'none', label: tx('g.none') }], learn: 'grouping' },
          { id: 'f-travel', key: 'o.travel_h', type: 'number', label: tx('f.travel'), unit: U('u.h'), min: 0, max: 24, step: 0.25, learn: 'grouping' },
          { id: 'f-rebase', key: 'o.rebaseline', type: 'toggle', label: tx('f.rebase'), hint: tx('f.rebase.h'), learn: 'seasons' } ] },

/* ---- record / report ---- */
function record() {
  if (!last) return null;
  var P = last.levelled;
  return {
    inputs: { site: clone(state.doc.site || {}), source: state.src, preset: state.preset, tasks: engineTasks(), settings: clone(state.o) },
    outputs: { metrics: clone(P.metrics), naive_metrics: clone(last.naive.metrics), budget: clone(P.budget), conflicts: clone(P.conflicts), weeks: P.weeks.map(function (w) { return { iso_week: w.iso_week, monday: w.monday, hours: w.hours, travel: w.travel, total: w.total, visits: w.visits }; }),
      occurrences: P.occurrences.map(function (o) { return { id: o.id, asset_id: o.asset_id, trade: o.trade, iso_week: o.iso_week, date: o.date, due: o.nominal_date, hours: o.hours, statutory: o.statutory, visit: o.visit }; }) },
    units: { hours: 'h', travel_h: 'h per visit', budget: 'EUR', capacity: 'h/week', interval_days: 'd', tolerance: 'fraction of interval' },
    model: { version: PLAN ? PLAN.version : null, equations: [S('footer')], ranges: [], notes: [S('notice.b')] },
    warnings: P.conflicts.filter(function (c) { return c.severity !== 'info'; }).slice(0, 50).map(conflictText)
  };
}
function reportProfile(rec, ctx) {
  var fig = null; try { fig = ctx.figure(reportCanvas(), { caption: S('chart.caption'), alt: a11yText() }); } catch (e) { fig = null; }
  var P = last.levelled;
  return { title: S('rep.title'),
    project: [{ label: S('f.year'), value: state.o.year }, { label: S('p.source'), text: state.src }],
    executive: { text: [compute.lastVerdict || ''], results: [{ label: S('t.peak'), value: P.metrics.peak_total }, { label: S('t.peakN'), value: last.naive.metrics.peak_total }, { label: S('t.hours'), value: P.metrics.hours_total }, { label: S('t.budget'), value: P.budget.total_eur }] },
    results: P.conflicts.filter(function (c) { return c.severity !== 'info'; }).slice(0, 30).map(function (c) { return { label: S('sev.' + c.severity), text: conflictText(c) }; }),
    figures: fig ? [fig] : [],
    method: { equations: [S('footer')], notes: [S('notice.b')], references: ['EN 13306:2017 Maintenance terminology', 'EN 13460:2009 Documentation for maintenance', 'US DOE FEMP O&M Best Practices Guide, Release 3.0 (2010), ch. 9', 'Regulation (EU) 2024/573; Directive (EU) 2024/1275; EN 12845; EN 50172; HSE L8 / HSG274'] } };
}
function degrade() {
  var h = document.createElement('h1'); h.textContent = 'MEP Maintenance Planner';
  var p = document.createElement('p'); p.textContent = 'The interactive interface could not load. The record and the export are still available from the bar at the bottom of the page.';
  var m = document.getElementById('app'); m.appendChild(h); m.appendChild(p);
  if (PLAN && state.tasks.length) last = solve();
}
function installData() {
  if (!window.Diagram) return;
  Diagram.init({ id: TOOL, file: 'mepplanner.html',
    state: { serialize: function () { return state; },
             deserialize: function (o) { var x = sanitize(o); Object.keys(state).forEach(function (k) { delete state[k]; }); Object.assign(state, x); if (ui) { ui.sync(); ui.run(); } else if (PLAN && state.tasks.length) last = solve(); } },
    record: record, report: { profile: reportProfile }, handoff: { provides: [], accepts: [] } });
}
/* boot: if this browser holds the user's register with strategy results, offer them through the bar (explicit Use); keep the example */
(function adoptSharedRegister() {
  if (!CORE || !CORE.register || typeof CORE.register.load !== 'function') return;
  if (/[?&](s|in)=/.test(location.search)) return;
  try { var d = CORE.register.load(); if (d && Array.isArray(d.assets) && d.assets.length) { state.doc = d; state.origin = 'register'; state.src = 'classes'; state.preset = null; state.tasks = PLAN ? PLAN.tasksFromClasses(d).map(rowOf) : []; } } catch (e) { /* storage blocked: the example stays */ }
})();
if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1') buildInterface(); else degrade();
installData();
});
