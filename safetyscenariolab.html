  "de": "Bedingungen und Barrieren für zehn illustrierte Arbeitsszenarien setzen, im Ablauf entscheiden und jeden Pfad von der Gefährdung bis zur blockierten, offenen oder prüfbedürftigen Folge verfolgen.",

 "description": {
  "en": "A generic engine for visual safety scenarios. Each scenario is a JSON description of scene objects, conditions, hazards, initiating events, barriers with dependencies, run decisions and consequences; the engine evaluates every pathway with three-valued logic and tells a blocked pathway apart from one with no hazard. The pack covers grinder sparks, hot work near combustibles, a mobile tower, tank entry with gas monitoring, gas cylinder storage, residual pressure behind an isolation, a suspended load, ladder footing, a cable in a wet area and noisy breaking work. Every barrier rule carries an id and a cited source; further scenarios can be imported as JSON. Replays and a scenario.outcomes exchange file for training tools are saved locally.",
  "uk": "Універсальний рушій візуальних сценаріїв безпеки. Кожен сценарій — опис у JSON: об’єкти сцени, умови, небезпеки, ініціюючі події, бар’єри із залежностями, рішення прогону та наслідки; рушій оцінює кожен шлях тризначною логікою й відрізняє заблокований шлях від шляху без небезпеки. Пакет охоплює іскри шліфмашини, вогневі роботи біля горючих матеріалів, пересувну вишку, вхід у резервуар із контролем газу, зберігання балонів, залишковий тиск за відключенням, вантаж на гаку, опору драбини, кабель у вологій зоні та гучні роботи з руйнування. Кожне правило бар’єра має ідентифікатор і джерело; нові сценарії імпортуються як JSON. Записи прогонів і файл обміну scenario.outcomes зберігаються локально.",
  "de": "Ein allgemeiner Modellkern für bildhafte Sicherheitsszenarien. Jedes Szenario ist eine JSON-Beschreibung aus Szenenobjekten, Bedingungen, Gefährdungen, auslösenden Ereignissen, Barrieren mit Abhängigkeiten, Entscheidungen und Folgen; der Kern bewertet jeden Pfad dreiwertig und unterscheidet einen blockierten Pfad von einem ohne Gefährdung. Das Paket umfasst Schleiffunken, Heißarbeit nahe Brennbarem, ein Fahrgerüst, eine Behälterbefahrung mit Gasüberwachung, ein Gasflaschenlager, Restdruck hinter einer Absperrung, eine schwebende Last, den Stand einer Anlegeleiter, ein Kabel im Nassbereich und laute Abbrucharbeit. Jede Barriereregel trägt eine Kennung und eine Quelle; weitere Szenarien lassen sich als JSON importieren. Ablaufdateien und eine Austauschdatei scenario.outcomes für Trainingswerkzeuge werden lokal gespeichert.",
  "nl": "Een generieke rekenkern voor visuele veiligheidsscenario’s. Elk scenario is een JSON-beschrijving van scène-objecten, omstandigheden, gevaren, initiërende gebeurtenissen, barrières met afhankelijkheden, keuzes en gevolgen; de kern beoordeelt elk pad met driewaardige logica en onderscheidt een geblokkeerd pad van een pad zonder gevaar. Het pakket omvat slijpvonken, heet werk bij brandbaar materiaal, een rolsteiger, tankbetreding met gasbewaking, gasflessenopslag, restdruk achter een afsluiting, een hangende last, de voet van een ladder, een kabel in een natte ruimte en lawaaierig breekwerk. Elke barrièreregel heeft een id en een bron; extra scenario’s zijn als JSON te importeren. Verloopbestanden en een uitwisselingsbestand scenario.outcomes voor trainingstools worden lokaal opgeslagen.",
  "fr": "Un moteur générique de scénarios de sécurité illustrés. Chaque scénario est une description JSON d’objets de scène, de conditions, de dangers, d’événements initiateurs, de barrières avec dépendances, de décisions et de conséquences ; le moteur évalue chaque chemin en logique à trois valeurs et distingue un chemin bloqué d’un chemin sans danger. Le paquet couvre les étincelles de meuleuse, le travail par points chauds près de combustibles, une tour roulante, l’entrée en cuve avec détection de gaz, le stockage de bouteilles, la pression résiduelle derrière une consignation, une charge suspendue, l’appui d’une échelle, un câble en zone humide et une démolition bruyante. Chaque règle de barrière porte un identifiant et une source ; d’autres scénarios s’importent en JSON. Les séquences et un fichier d’échange scenario.outcomes pour les outils de formation sont enregistrés localement.",
  "es": "Un motor genérico de escenarios de seguridad ilustrados. Cada escenario es una descripción JSON de objetos de escena, condiciones, peligros, sucesos iniciadores, barreras con dependencias, decisiones y consecuencias; el motor evalúa cada vía con lógica trivalente y distingue una vía bloqueada de una sin peligro. El paquete cubre chispas de amoladora, trabajo en caliente junto a combustibles, una torre móvil, entrada en tanque con detección de gas, almacén de botellas, presión residual tras un aislamiento, una carga suspendida, el apoyo de una escalera, un cable en zona mojada y una demolición ruidosa. Cada regla de barrera tiene un id y una fuente; pueden importarse más escenarios en JSON. Las repeticiones y un archivo de intercambio scenario.outcomes para herramientas de formación se guardan localmente.",
  "pl": "Uniwersalny silnik ilustrowanych scenariuszy bezpieczeństwa. Każdy scenariusz to opis JSON obiektów sceny, warunków, zagrożeń, zdarzeń inicjujących, barier z zależnościami, decyzji i skutków; silnik ocenia każdą ścieżkę w logice trójwartościowej i odróżnia ścieżkę zablokowaną od ścieżki bez zagrożenia. Pakiet obejmuje iskry ze szlifierki, prace pożarowo niebezpieczne przy materiałach palnych, rusztowanie jezdne, wejście do zbiornika z monitoringiem gazu, magazyn butli, ciśnienie resztkowe za odcięciem, ładunek zawieszony, oparcie drabiny, przewód w strefie mokrej i hałaśliwe wyburzanie. Każda reguła bariery ma identyfikator i źródło; kolejne scenariusze można importować jako JSON. Pliki przebiegu i plik wymiany scenario.outcomes dla narzędzi szkoleniowych są zapisywane lokalnie."
 },

 "limitations": {
  "en": "Educational causal model with no physical simulation: barriers act in series as all-or-nothing, with no probabilities, timing or degraded performance, and there is no random branch, so the seed input of the specification is not used. Each scenario models two to four pathways chosen for teaching and says nothing about hazards outside them or about other workplaces. Sources are cited per rule at document level without clause numbers and must be checked against the current edition and local rules; illustrative rules are marked as such. Pictograms are generic drawings, not ISO 7010 signs. The tool never authorises work or shows legal compliance. Situation pictures are AI-generated illustrations, not photographs of a real site.",
  "uk": "Навчальна причинна модель без фізичного моделювання: бар’єри діють послідовно за принципом «усе або нічого», без імовірностей, часу чи часткової ефективності; випадкових гілок немає, тож вхід «seed» зі специфікації не використовується. Кожен сценарій моделює два–чотири навчальні шляхи й нічого не каже про інші небезпеки чи інші робочі місця. Джерела наведено для кожного правила на рівні документа без номерів пунктів; їх слід звірити з чинною редакцією та місцевими правилами; ілюстративні правила позначено. Піктограми — узагальнені малюнки, не знаки ISO 7010. Інструмент не дозволяє робіт і не підтверджує відповідності законодавству. Зображення ситуацій створено моделлю ШІ, це не фотографії реальних об’єктів.",
  "de": "Lehrhaftes Kausalmodell ohne physikalische Simulation: Barrieren wirken in Reihe nach dem Alles-oder-nichts-Prinzip, ohne Wahrscheinlichkeiten, Zeitverlauf oder Teilwirksamkeit; es gibt keinen Zufallszweig, die Seed-Eingabe der Spezifikation bleibt ungenutzt. Jedes Szenario modelliert zwei bis vier Lehrpfade und sagt nichts über andere Gefährdungen oder andere Arbeitsplätze. Quellen sind je Regel auf Dokumentebene ohne Abschnittsnummern genannt und gegen die aktuelle Fassung und örtliche Regeln zu prüfen; veranschaulichende Regeln sind gekennzeichnet. Piktogramme sind allgemeine Zeichnungen, keine ISO-7010-Zeichen. Das Werkzeug gibt keine Arbeit frei und belegt keine Rechtskonformität. Die Situationsbilder sind KI-erzeugte Illustrationen, keine Fotos realer Standorte.",
  "nl": "Educatief oorzakelijk model zonder fysische simulatie: barrières werken in serie als alles-of-niets, zonder kansen, tijdsverloop of gedeeltelijke werking; er is geen toevalstak, dus de seed-invoer uit de specificatie wordt niet gebruikt. Elk scenario modelleert twee tot vier lespaden en zegt niets over andere gevaren of andere werkplekken. Bronnen zijn per regel op documentniveau vermeld zonder artikelnummers en moeten worden getoetst aan de actuele versie en lokale regels; illustratieve regels zijn gemarkeerd. Pictogrammen zijn algemene tekeningen, geen ISO 7010-tekens. De tool geeft geen werkvergunning en toont geen wettelijke naleving. De situatiebeelden zijn met AI gemaakte illustraties, geen foto’s van echte locaties.",
  "fr": "Modèle causal pédagogique sans simulation physique : les barrières agissent en série en tout ou rien, sans probabilités, chronologie ni efficacité partielle ; il n’y a pas de branche aléatoire, l’entrée « seed » de la spécification n’est donc pas utilisée. Chaque scénario modélise deux à quatre chemins pédagogiques et ne dit rien des autres dangers ni des autres lieux de travail. Les sources sont citées par règle au niveau du document, sans numéro d’article, et doivent être vérifiées selon l’édition en vigueur et les règles locales ; les règles illustratives sont signalées. Les pictogrammes sont des dessins génériques, pas des signaux ISO 7010. L’outil n’autorise aucun travail et ne démontre aucune conformité. Les images de situation sont des illustrations générées par IA, pas des photos de sites réels.",
  "es": "Modelo causal docente sin simulación física: las barreras actúan en serie de forma todo o nada, sin probabilidades, tiempos ni eficacia parcial; no hay ramas aleatorias, por lo que la entrada «seed» de la especificación no se usa. Cada escenario modela de dos a cuatro vías docentes y no dice nada de otros peligros ni de otros lugares de trabajo. Las fuentes se citan por regla a nivel de documento, sin números de apartado, y deben comprobarse con la edición vigente y las normas locales; las reglas ilustrativas se señalan. Los pictogramas son dibujos genéricos, no señales ISO 7010. La herramienta no autoriza trabajos ni acredita cumplimiento legal. Las imágenes de situación son ilustraciones generadas por IA, no fotografías de lugares reales.",
  "pl": "Dydaktyczny model przyczynowy bez symulacji fizycznej: bariery działają szeregowo na zasadzie wszystko albo nic, bez prawdopodobieństw, przebiegu w czasie ani częściowej skuteczności; nie ma gałęzi losowych, więc wejście „seed” ze specyfikacji nie jest używane. Każdy scenariusz modeluje od dwóch do czterech ścieżek dydaktycznych i nie mówi nic o innych zagrożeniach ani innych miejscach pracy. Źródła podano dla każdej reguły na poziomie dokumentu, bez numerów punktów; należy je sprawdzić z aktualnym wydaniem i przepisami lokalnymi; reguły poglądowe są oznaczone. Piktogramy są ogólnymi rysunkami, nie znakami ISO 7010. Narzędzie nie dopuszcza do pracy i nie wykazuje zgodności z prawem. Obrazy sytuacji to ilustracje wygenerowane przez SI, a nie zdjęcia rzeczywistych miejsc."
 },

   "en": "Benchmark tested against an independent reference corpus (78 cases: engine semantics, pack and replay refusals, built-in scenario properties, randomized packs), written without access to the code; this is the author’s own harness, not an independent validation. The engine is also checked by the page’s own self-test: engine rules on a synthetic scenario, a golden replay and full branch enumeration for every scenario, and a drawing check that each setup item changes the scene. Barrier rules cite guidance and legislation (NFPA 51B, OSHA 29 CFR 1910.147 and 1910.253, EN 1004-1, ISO 12480-1, EN 13414, EN 1492, HSE INDG455 and HSG107, IEC 60364-4-41 and 7-704, IEC 60529, EN 166, IEC 62841-2-3, EN 352, Directive 2003/10/EC) at document level; confined-space and part of the cylinder rules are illustrative.",
   "uk": "Перевірено за незалежним еталонним корпусом (78 випадків: семантика рушія, відхилення пакетів і записів, властивості вбудованих сценаріїв, випадкові пакети), складеним без доступу до коду; це власний стенд автора, а не незалежна валідація. Також рушій перевіряється власним самотестом сторінки: правила рушія на синтетичному сценарії, еталонний прогін і повний перебір гілок для кожного сценарію та перевірка, що кожен елемент налаштування змінює сцену. Правила бар’єрів посилаються на настанови й законодавство (NFPA 51B, OSHA 29 CFR 1910.147 і 1910.253, EN 1004-1, ISO 12480-1, EN 13414, EN 1492, HSE INDG455 і HSG107, IEC 60364-4-41 і 7-704, IEC 60529, EN 166, IEC 62841-2-3, EN 352, Директива 2003/10/EC) на рівні документа; правила для обмежених просторів і частина правил для балонів ілюстративні.",
   "de": "Gegen ein unabhängiges Referenzkorpus geprüft (78 Fälle: Kernsemantik, abgelehnte Pakete und Abläufe, Eigenschaften der mitgelieferten Szenarien, Zufallspakete), ohne Einblick in den Code erstellt; eigener Prüfstand des Autors, keine unabhängige Validierung. Zusätzlich wird der Modellkern durch den Selbsttest der Seite geprüft: Kernregeln an einem synthetischen Szenario, eine Referenzwiedergabe und vollständige Zweigaufzählung je Szenario sowie eine Zeichnungsprüfung, dass jedes Element der Ausgangslage die Szene ändert. Barriereregeln nennen Leitfäden und Rechtsvorschriften (NFPA 51B, OSHA 29 CFR 1910.147 und 1910.253, EN 1004-1, ISO 12480-1, EN 13414, EN 1492, HSE INDG455 und HSG107, IEC 60364-4-41 und 7-704, IEC 60529, EN 166, IEC 62841-2-3, EN 352, Richtlinie 2003/10/EG) auf Dokumentebene; die Regeln zu engen Räumen und ein Teil der Flaschenregeln sind veranschaulichend.",
   "nl": "Getoetst aan een onafhankelijk referentiecorpus (78 gevallen: kernsemantiek, geweigerde pakketten en verlopen, eigenschappen van de ingebouwde scenario’s, willekeurige pakketten), opgesteld zonder inzage in de code; eigen testopstelling van de auteur, geen onafhankelijke validatie. Daarnaast wordt de rekenkern gecontroleerd door de eigen zelftest van de pagina: kernregels op een synthetisch scenario, een referentieverloop en volledige takopsomming per scenario, en een tekencontrole dat elk opzet-element de scène verandert. Barrièreregels verwijzen naar richtlijnen en wetgeving (NFPA 51B, OSHA 29 CFR 1910.147 en 1910.253, EN 1004-1, ISO 12480-1, EN 13414, EN 1492, HSE INDG455 en HSG107, IEC 60364-4-41 en 7-704, IEC 60529, EN 166, IEC 62841-2-3, EN 352, Richtlijn 2003/10/EG) op documentniveau; de regels voor besloten ruimten en een deel van de flesregels zijn illustratief.",
   "fr": "Testé sur un corpus de référence indépendant (78 cas : sémantique du moteur, refus de paquets et de séquences, propriétés des scénarios intégrés, paquets aléatoires), rédigé sans accès au code ; banc d’essai de l’auteur, pas une validation indépendante. Le moteur est aussi contrôlé par l’autotest de la page : règles du moteur sur un scénario synthétique, rejeu de référence et énumération complète des branches pour chaque scénario, et contrôle que chaque élément de configuration modifie le dessin. Les règles de barrière citent guides et textes (NFPA 51B, OSHA 29 CFR 1910.147 et 1910.253, EN 1004-1, ISO 12480-1, EN 13414, EN 1492, HSE INDG455 et HSG107, IEC 60364-4-41 et 7-704, IEC 60529, EN 166, IEC 62841-2-3, EN 352, directive 2003/10/CE) au niveau du document ; les règles d’espace confiné et une partie des règles de bouteilles sont illustratives.",

.ssl-hot:hover{border-color:var(--accent)}
.ssl-hot.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--weak)}
.ssl-hot:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media(max-width:768px){.ssl-hot{width:36px;height:36px;margin:-18px 0 0 -18px}}
.ssl-flag{margin-bottom:var(--sp-2)}
.ssl-rule{font-family:var(--font-mono);font-size:var(--fs-micro)}
.ssl-phases{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--sp-3)}
.ssl-ph{padding:4px 10px;border:1px solid var(--line);border-radius:var(--radius-pill);font-size:var(--fs-small);color:var(--muted)}
.ssl-ph.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
.ssl-kicker{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:var(--sp-2) 0 var(--sp-1)}
.ssl-prompt{font-weight:600;margin:0 0 var(--sp-2)}
.ssl-opts{display:grid;gap:var(--sp-2)}
.ssl-opt{white-space:normal;text-align:left;justify-content:flex-start;padding:var(--sp-2) var(--sp-3);line-height:1.35;min-height:var(--tap)}
.ssl-row{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-3)}
.ssl-taken{margin:0;padding-left:1.3em;font-size:var(--fs-small)}
.ssl-taken li{margin-bottom:4px}
.ssl-insp-t{font-size:var(--fs-body);margin:0 0 4px}
.ssl-kv{display:grid;gap:2px;margin:var(--sp-2) 0;font-size:var(--fs-small)}
.ssl-k{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ssl-list{list-style:none;margin:0;padding:0;display:grid;gap:var(--sp-2)}
.ssl-li-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ssl-listbtn{white-space:normal;text-align:left;font-weight:600}
.ssl-listbtn.sel{border-color:var(--accent);background:var(--weak)}
.ssl-sym{font-size:var(--fs-small);font-weight:600}
.ssl-sym.ok{color:var(--ok)}.ssl-sym.bad{color:var(--bad)}.ssl-sym.warn,.ssl-sym.unknown{color:var(--warn)}
.ssl-trace{display:grid;gap:var(--sp-3);grid-template-columns:repeat(auto-fill,minmax(280px,1fr));margin:var(--sp-3) 0}
.ssl-card{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--radius-sm);padding:var(--sp-3);background:var(--panel-2);min-width:0}
.ssl-card.ok{border-left-color:var(--ok)}.ssl-card.bad{border-left-color:var(--bad)}.ssl-card.warn{border-left-color:var(--warn)}
.ssl-card-h{display:flex;gap:var(--sp-2);align-items:flex-start;margin-bottom:var(--sp-2)}
.ssl-badge{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;background:var(--line);color:var(--ink)}
.ssl-badge.ok{background:var(--ok);color:#fff}.ssl-badge.bad{background:var(--bad);color:#fff}.ssl-badge.warn{background:var(--warn);color:#fff}
.ssl-card-t{font-weight:650}
.ssl-card-o{font-size:var(--fs-small)}
.ssl-chain{margin:0;padding-left:1.3em;font-size:var(--fs-small);display:grid;gap:4px}
.ssl-chain li{overflow-wrap:anywhere}
.ssl-chain .ssl-k{display:block}
.ssl-id{margin-top:var(--sp-2);font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--muted);overflow-wrap:anywhere}
.ssl-msg{font-size:var(--fs-small);min-height:0}
.ssl-msg.ok{color:var(--ok)}.ssl-msg.bad{color:var(--bad)}
.ssl-photo{margin:0}
.ssl-photo img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:var(--radius-sm);background:var(--panel-2)}
.ssl-photo figcaption{margin-top:var(--sp-1)}
.ssl-photo-fb{padding:var(--sp-3);border:1px dashed var(--line);border-radius:var(--radius-sm);font-size:var(--fs-small);color:var(--muted)}
.ssl-sign{width:24px;height:24px;vertical-align:middle;margin-right:6px;flex:0 0 auto}
.ssl-sign-fb{font-family:var(--font-mono);font-size:var(--fs-micro);margin-right:6px;padding:1px 4px;border:1px solid var(--line);border-radius:4px}
</style>

    r_m1: T('Each pathway runs hazard → initiating event → barriers in their listed order → consequence. A barrier counts only when it is in place and every dependency it names holds; the first such barrier blocks the pathway.', 'Кожен шлях: небезпека → ініціююча подія → бар’єри в наведеному порядку → наслідок. Бар’єр враховується, лише якщо він наявний і всі його залежності виконано; перший такий бар’єр блокує шлях.', 'Jeder Pfad läuft Gefährdung → auslösendes Ereignis → Barrieren in der angegebenen Reihenfolge → Folge. Eine Barriere zählt nur, wenn sie vorhanden ist und jede genannte Abhängigkeit erfüllt ist; die erste solche Barriere blockiert den Pfad.', 'Elk pad loopt gevaar → initiërende gebeurtenis → barrières in de opgegeven volgorde → gevolg. Een barrière telt alleen als ze aanwezig is en aan elke genoemde afhankelijkheid is voldaan; de eerste zulke barrière blokkeert het pad.', 'Chaque chemin suit danger → événement initiateur → barrières dans l’ordre indiqué → conséquence. Une barrière ne compte que si elle est en place et que toutes ses dépendances tiennent ; la première de ce type bloque le chemin.', 'Cada vía sigue peligro → suceso iniciador → barreras en el orden indicado → consecuencia. Una barrera cuenta solo si está presente y se cumplen todas sus dependencias; la primera así bloquea la vía.', 'Każda ścieżka: zagrożenie → zdarzenie inicjujące → bariery w podanej kolejności → skutek. Bariera liczy się tylko wtedy, gdy jest zastosowana i spełnione są wszystkie jej zależności; pierwsza taka bariera blokuje ścieżkę.'),
    r_m2: T('Unknown inputs are carried with three-valued logic: where an unknown value could change the outcome, the pathway is marked for review.', 'Невідомі дані обробляються тризначною логікою: якщо невідоме значення може змінити результат, шлях позначається для перегляду.', 'Unbekannte Angaben laufen in dreiwertiger Logik mit: wo ein unbekannter Wert das Ergebnis ändern könnte, wird der Pfad zur Prüfung markiert.', 'Onbekende invoer wordt met driewaardige logica meegenomen: waar een onbekende waarde de uitkomst kan veranderen, wordt het pad gemarkeerd voor beoordeling.', 'Les données inconnues sont traitées en logique à trois valeurs : si une valeur inconnue peut changer l’issue, le chemin est marqué pour revue.', 'Los datos desconocidos se tratan con lógica trivalente: si un valor desconocido puede cambiar el resultado, la vía se marca para revisión.', 'Nieznane dane są przetwarzane w logice trójwartościowej: gdy nieznana wartość może zmienić wynik, ścieżka jest oznaczana do przeglądu.'),
    notice_t: T('What this lab shows', 'Що показує ця лабораторія', 'Was dieses Labor zeigt', 'Wat dit lab laat zien', 'Ce que montre ce laboratoire', 'Qué muestra este laboratorio', 'Co pokazuje to laboratorium'),
    notice: T('A teaching model of a few causal pathways per scenario. It does not simulate physics, does not authorise any work and does not show legal compliance; a pathway that is not listed is not assessed.', 'Навчальна модель кількох причинних шляхів на сценарій. Вона не моделює фізику, не дозволяє роботи й не підтверджує відповідності законодавству; ненаведений шлях не оцінюється.', 'Ein Lehrmodell weniger Kausalpfade je Szenario. Es simuliert keine Physik, gibt keine Arbeit frei und belegt keine Rechtskonformität; ein nicht aufgeführter Pfad wird nicht bewertet.', 'Een lesmodel van enkele oorzakelijke paden per scenario. Het simuleert geen fysica, geeft geen werkvergunning en toont geen wettelijke naleving; een niet genoemd pad wordt niet beoordeeld.', 'Un modèle pédagogique de quelques chemins causaux par scénario. Il ne simule pas la physique, n’autorise aucun travail et ne démontre aucune conformité ; un chemin non listé n’est pas évalué.', 'Un modelo docente de unas pocas vías causales por escenario. No simula la física, no autoriza trabajos ni acredita cumplimiento legal; una vía no listada no se evalúa.', 'Model dydaktyczny kilku ścieżek przyczynowych na scenariusz. Nie symuluje fizyki, nie dopuszcza do pracy i nie wykazuje zgodności z prawem; ścieżka niewymieniona nie jest oceniana.'),
    footer: T('Engine ssl-engine/1.0: hazard, initiating event, barriers in series with dependencies, consequence; three-valued logic for unknown inputs. Scenario content, rules and sources live in the embedded JSON pack.', 'Рушій ssl-engine/1.0: небезпека, ініціююча подія, послідовні бар’єри із залежностями, наслідок; тризначна логіка для невідомих даних. Зміст сценаріїв, правила й джерела — у вбудованому пакеті JSON.', 'Modellkern ssl-engine/1.0: Gefährdung, auslösendes Ereignis, Barrieren in Reihe mit Abhängigkeiten, Folge; dreiwertige Logik für unbekannte Angaben. Szenarien, Regeln und Quellen stehen im eingebetteten JSON-Paket.', 'Rekenkern ssl-engine/1.0: gevaar, initiërende gebeurtenis, barrières in serie met afhankelijkheden, gevolg; driewaardige logica voor onbekende invoer. Scenario’s, regels en bronnen staan in het ingebedde JSON-pakket.', 'Moteur ssl-engine/1.0 : danger, événement initiateur, barrières en série avec dépendances, conséquence ; logique à trois valeurs pour les inconnues. Scénarios, règles et sources figurent dans le paquet JSON intégré.', 'Motor ssl-engine/1.0: peligro, suceso iniciador, barreras en serie con dependencias, consecuencia; lógica trivalente para datos desconocidos. Escenarios, reglas y fuentes están en el paquete JSON integrado.', 'Silnik ssl-engine/1.0: zagrożenie, zdarzenie inicjujące, bariery szeregowo z zależnościami, skutek; logika trójwartościowa dla nieznanych danych. Scenariusze, reguły i źródła są w osadzonym pakiecie JSON.'),
    learn_t: T('How the lab works', 'Як працює лабораторія', 'So arbeitet das Labor', 'Zo werkt het lab', 'Fonctionnement du laboratoire', 'Cómo funciona el laboratorio', 'Jak działa laboratorium'),
    learn_b: T('Pick a scenario, set the conditions and the barriers, start the run and answer the situations. The causal trace shows for each pathway whether it is open, blocked by a named barrier, has no hazard, was not initiated or needs review.', 'Оберіть сценарій, задайте умови й бар’єри, почніть прогін і відповідайте на ситуації. Причинний слід показує для кожного шляху: відкритий, заблокований названим бар’єром, без небезпеки, не ініційований або потребує перегляду.', 'Szenario wählen, Bedingungen und Barrieren setzen, Ablauf starten und die Situationen beantworten. Die Kausalkette zeigt je Pfad: offen, durch eine genannte Barriere blockiert, ohne Gefährdung, nicht ausgelöst oder prüfbedürftig.', 'Kies een scenario, stel omstandigheden en barrières in, start het verloop en beantwoord de situaties. Het oorzakelijk verloop toont per pad: open, geblokkeerd door een genoemde barrière, zonder gevaar, niet geïnitieerd of te beoordelen.', 'Choisissez un scénario, réglez conditions et barrières, lancez le déroulement et répondez aux situations. La trace causale indique pour chaque chemin : ouvert, bloqué par une barrière nommée, sans danger, non amorcé ou à revoir.', 'Elija un escenario, fije condiciones y barreras, inicie la ejecución y responda a las situaciones. La traza causal indica para cada vía: abierta, bloqueada por una barrera concreta, sin peligro, no iniciada o por revisar.', 'Wybierz scenariusz, ustaw warunki i bariery, rozpocznij przebieg i odpowiadaj na sytuacje. Ślad przyczynowy pokazuje dla każdej ścieżki: otwarta, zablokowana przez wskazaną barierę, bez zagrożenia, niezainicjowana lub do przeglądu.'),
    lt_barrier: T('Barriers and dependencies', 'Бар’єри та залежності', 'Barrieren und Abhängigkeiten', 'Barrières en afhankelijkheden', 'Barrières et dépendances', 'Barreras y dependencias', 'Bariery i zależności'),
    lb_barrier: T('A barrier stops a pathway only when it is in place and what it relies on is also there: a fire watch without an extinguisher, or an attendant without communication, does not count.', 'Бар’єр зупиняє шлях, лише коли він наявний і є те, на що він спирається: спостерігач без вогнегасника чи черговий без зв’язку не враховуються.', 'Eine Barriere stoppt einen Pfad nur, wenn sie vorhanden ist und auch das da ist, worauf sie angewiesen ist: eine Brandwache ohne Feuerlöscher zählt nicht.', 'Een barrière stopt een pad alleen als ze aanwezig is en ook datgene waarop ze steunt: een brandwacht zonder blusser telt niet.', 'Une barrière n’arrête un chemin que si elle est en place et que ce dont elle dépend l’est aussi : un surveillant sans extincteur ne compte pas.', 'Una barrera detiene una vía solo si está presente y también aquello de lo que depende: un vigilante sin extintor no cuenta.', 'Bariera zatrzymuje ścieżkę tylko wtedy, gdy jest zastosowana i dostępne jest to, od czego zależy: obserwator bez gaśnicy się nie liczy.'),
    lt_review: T('Review required', 'Потрібен перегляд', 'Prüfung erforderlich', 'Beoordeling nodig', 'Revue nécessaire', 'Revisión necesaria', 'Wymagany przegląd'),
    lb_review: T('"Not known" and "Unverified" are never treated as safe. If the outcome depends on them, the pathway is shown as needing review.', '«Невідомо» й «Не перевірено» ніколи не вважаються безпечними. Якщо результат від них залежить, шлях позначається для перегляду.', '„Unbekannt“ und „Nicht geprüft“ gelten nie als sicher. Hängt das Ergebnis davon ab, wird der Pfad zur Prüfung markiert.', '"Onbekend" en "Niet geverifieerd" gelden nooit als veilig. Hangt de uitkomst ervan af, dan wordt het pad als te beoordelen getoond.', '« Inconnu » et « Non vérifiée » ne valent jamais « sûr ». Si l’issue en dépend, le chemin est marqué à revoir.', '«Desconocido» y «Sin verificar» nunca se tratan como seguros. Si el resultado depende de ellos, la vía queda por revisar.', '„Nieznane” i „Niezweryfikowana” nigdy nie są traktowane jako bezpieczne. Jeśli wynik od nich zależy, ścieżka wymaga przeglądu.'),
    lt_scene: T('Scene and list view', 'Сцена та список', 'Szene und Listenansicht', 'Scène en lijstweergave', 'Scène et vue en liste', 'Escena y vista de lista', 'Scena i widok listy'),
    lb_scene: T('Every numbered object in the drawing is also a row in the list of scene objects. The symbol beside a number reads: ✓ barrier holds, ✕ barrier fails or harmful event, ! hazard present, ? not known.', 'Кожен пронумерований об’єкт малюнка є й рядком у списку об’єктів. Символ біля номера: ✓ бар’єр спрацьовує, ✕ бар’єр не спрацьовує або шкідлива подія, ! небезпека наявна, ? невідомо.', 'Jedes nummerierte Objekt der Zeichnung ist auch eine Zeile der Objektliste. Das Zeichen neben der Nummer: ✓ Barriere wirkt, ✕ Barriere versagt oder schädliches Ereignis, ! Gefährdung vorhanden, ? unbekannt.', 'Elk genummerd object in de tekening is ook een rij in de objectenlijst. Het teken naast een nummer: ✓ barrière houdt stand, ✕ barrière faalt of schadelijke gebeurtenis, ! gevaar aanwezig, ? onbekend.', 'Chaque objet numéroté du dessin est aussi une ligne de la liste. Le symbole près du numéro : ✓ barrière tient, ✕ barrière échoue ou événement néfaste, ! danger présent, ? inconnu.', 'Cada objeto numerado del dibujo es también una fila de la lista. El símbolo junto al número: ✓ barrera funciona, ✕ barrera falla o suceso dañino, ! peligro presente, ? desconocido.', 'Każdy ponumerowany obiekt rysunku jest też wierszem listy obiektów. Symbol przy numerze: ✓ bariera działa, ✕ bariera zawodzi lub szkodliwe zdarzenie, ! zagrożenie występuje, ? nieznane.'),
    stage_cap: T('Illustrated scene: numbers mark the objects; symbols give their state', 'Ілюстрована сцена: номери позначають об’єкти, символи — їхній стан', 'Illustrierte Szene: Nummern kennzeichnen die Objekte, Zeichen ihren Zustand', 'Geïllustreerde scène: nummers markeren de objecten, tekens hun toestand', 'Scène illustrée : les numéros repèrent les objets, les symboles leur état', 'Escena ilustrada: los números marcan los objetos y los símbolos su estado', 'Scena ilustrowana: numery oznaczają obiekty, symbole ich stan'),
    sym_ok: T('barrier holds', 'бар’єр спрацьовує', 'Barriere wirkt', 'barrière houdt stand', 'barrière tient', 'barrera funciona', 'bariera działa'),
    sym_bad: T('barrier fails or harmful event', 'бар’єр не спрацьовує або шкідлива подія', 'Barriere versagt oder schädliches Ereignis', 'barrière faalt of schadelijke gebeurtenis', 'barrière échoue ou événement néfaste', 'barrera falla o suceso dañino', 'bariera zawodzi lub szkodliwe zdarzenie'),
    sym_warn: T('hazard present', 'небезпека наявна', 'Gefährdung vorhanden', 'gevaar aanwezig', 'danger présent', 'peligro presente', 'zagrożenie występuje'),
    sym_unknown: T('not known', 'невідомо', 'unbekannt', 'onbekend', 'inconnu', 'desconocido', 'nieznane'),
    sym_none: T('no state', 'без стану', 'ohne Zustand', 'zonder toestand', 'sans état', 'sin estado', 'bez stanu')
  };
  function t(k, l) { return tx(S[k], l); }

  /* ------------------------------------------------------------ the data */
  var BUILTIN = [], IMPORTED = [], PACK = null, PACK_ERRORS = [], BASE_ASSETS = { files: {}, signs: {} };
  function scenarios() { return BUILTIN.concat(IMPORTED); }
  function scenarioById(id) { return X.byId(scenarios(), id); }
  function isImported(id) { return !!X.byId(IMPORTED, id); }
  function errText(e, l) { return fill(t('e_' + e.code, l), { s: e.arg }); }

  function loadPack() {
    var node = document.getElementById('ssl-pack');
    try { PACK = JSON.parse(node.textContent); }
    catch (e) { PACK_ERRORS = [{ code: 'schema', arg: 'JSON' }]; return false; }
    BASE_ASSETS = X.mergeAssets(PACK && PACK.assets, null);
    var v = X.validatePack(PACK, X.PICT_NAMES, [], BASE_ASSETS);
    BUILTIN = v.ok;
    PACK_ERRORS = v.errors;
    return v.errors.length === 0 && BUILTIN.length > 0;
  }

  /* ------------------------------------------------------------ the state */
  function freshState(id) {
    var sc = scenarioById(id) || BUILTIN[0];
    return { scenario: sc ? sc.id : '', setup: sc ? X.initialSetup(sc) : {}, decisions: {}, phase: 'setup', step: 0, selected: null };
  }
  var state = { scenario: '', setup: {}, decisions: {}, phase: 'setup', step: 0, selected: null };
  var last = null;   /* {sc, E, upto} */

  function uptoFor(sc, st) {
    if (st.phase === 'setup') return 0;
    if (st.phase === 'run') return st.step;
    return (sc.decisions || []).length;
  }
  function compute() {
    var sc = scenarioById(state.scenario);
    if (!sc) { last = null; return null; }
    var upto = uptoFor(sc, state);
    last = { sc: sc, E: X.evaluate(sc, state.setup, state.decisions, upto), upto: upto };
    return last;
  }
  function saveDraft() {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ v: 1, state: state })); } catch (e) { /* storage unavailable */ }
  }
  function loadDraft() {
    var raw = null;
    try { raw = localStorage.getItem(DRAFT_KEY); } catch (e) { return null; }
    if (!raw) return null;
    try {
      var d = JSON.parse(raw);
      var s = d && d.state;
      if (!s || !X.byId(BUILTIN, s.scenario)) return null;
      return sanitizeState(s, X.byId(BUILTIN, s.scenario));
    } catch (e) { return null; }
  }
  function sanitizeState(s, sc) {
    var out = freshState(sc.id), ignored = [];
    Object.keys(s.setup || {}).forEach(function (k) {
      var c = X.byId(sc.conditions, k), b = X.byId(sc.barriers, k), v = s.setup[k];
      if (c && ['yes', 'no', 'unknown'].indexOf(v) >= 0) out.setup[k] = v;
      else if (b && ['in', 'out', 'unknown'].indexOf(v) >= 0) out.setup[k] = v;
      else ignored.push(k);
    });
    var n = 0;
    (sc.decisions || []).forEach(function (d) {
      var o = s.decisions && s.decisions[d.id];
      if (o == null) return;
      if (X.byId(d.options, o) && n === (sc.decisions.indexOf(d))) { out.decisions[d.id] = o; n += 1; }
      else ignored.push(d.id);
    });
    Object.keys(s.decisions || {}).forEach(function (k) { if (!X.byId(sc.decisions || [], k)) ignored.push(k); });
    out.phase = ['setup', 'run', 'debrief'].indexOf(s.phase) >= 0 ? s.phase : 'setup';
    out.step = out.phase === 'run' ? n : (out.phase === 'debrief' ? (sc.decisions || []).length : 0);
    if (out.phase === 'debrief' && n < (sc.decisions || []).length) { out.phase = 'run'; out.step = n; }
    if (out.phase === 'setup') out.decisions = {};
    out.selected = s.selected && X.byId(sc.scene.objects, s.selected) ? s.selected : null;
    out._ignored = ignored;
    return out;
  }
  function adopt(s) {
    Object.keys(state).forEach(function (k) { delete state[k]; });
    Object.keys(s).forEach(function (k) { if (k !== '_ignored') state[k] = s[k]; });
  }

  /* ------------------------------------------------------ text for states */
  function labelOf(sc, id, l) {
    var o = X.byId(sc.conditions, id) || X.byId(sc.barriers, id) || X.byId(sc.hazards, id) || X.byId(sc.events || [], id);
    return o ? tx(o.label, l) : id;
  }
  function kindOf(sc, id) {
    return X.byId(sc.conditions, id) ? 'condition' : X.byId(sc.barriers, id) ? 'barrier' : X.byId(sc.hazards, id) ? 'hazard' : 'event';
  }
  function setupWord(sc, id, v, l) {
    if (X.byId(sc.conditions, id)) return t(v === 'yes' ? 'o_yes' : v === 'no' ? 'o_no' : 'o_unk', l);
    return t(v === 'in' ? 'o_in' : v === 'out' ? 'o_out' : 'o_unv', l);
  }
  function triWord(v, l) { return t(v === true ? 'st_true' : v === false ? 'st_false' : 'st_unknown', l); }
  function depList(sc, b, l) {
    return b.depRefs.filter(function (r) { return r.value !== true; }).map(function (r) {
      var v = X.byId(sc.conditions, r.id) || X.byId(sc.events || [], r.id) ? triWord(r.value, l) : null;
      return labelOf(sc, r.id, l) + (v ? ' = ' + v : '');
    }).join('; ') || b.depRefs.map(function (r) { return labelOf(sc, r.id, l); }).join('; ');
  }
  function barrierText(sc, b, l) {
    var sym, word;
    if (!b.reached && b.eff === true) { sym = '○'; word = t('bs_notch', l); }
    else if (b.reason === 'holds') { sym = '✓'; word = t('bs_holds', l); }
    else if (b.reason === 'absent') { sym = '✕'; word = t('bs_absent', l); }
    else if (b.reason === 'dependency') { sym = '✕'; word = fill(t('bs_dep', l), { s: depList(sc, b, l) }); }
    else if (b.reason === 'unverified') { sym = '?'; word = t('bs_unv', l); }
    else { sym = '?'; word = fill(t('bs_depunk', l), { s: depList(sc, b, l) }); }
    if (!b.reached && b.eff !== true) word = word + ' · ' + t('bs_notch', l);
    return { sym: sym, label: labelOf(sc, b.id, l), word: word };
  }
  function outcomeText(sc, p, l) {
    switch (p.status) {
      case 'open': return t('out_open', l);
      case 'blocked': return fill(t('out_blocked', l), { s: labelOf(sc, p.blockedBy, l) });
      case 'no_hazard': return t('out_nohaz', l);
      case 'not_initiated': return t('out_noinit', l);
      default: return t('out_review', l);
    }
  }
  var OUT_SYM = { open: '✕', blocked: '✓', no_hazard: '–', not_initiated: '–', review: '?' };
  var OUT_TONE = { open: 'bad', blocked: 'ok', no_hazard: '', not_initiated: '', review: 'warn' };
  function hazardWord(v, l) { return t(v === true ? 'st_present' : v === false ? 'st_absent' : 'st_unknown', l); }
  function eventWord(v, l) { return t(v === true ? 'st_occurs' : v === false ? 'st_noocc' : 'st_unknown', l); }
  function consWord(c, l) { return t({ reached: 'cq_reached', prevented: 'cq_prevented', not_reached: 'cq_notreached', undetermined: 'cq_undet' }[c], l); }
  function pathNo(sc, p) { return 'P' + (sc.paths.indexOf(X.byId(sc.paths, p.id)) + 1); }
  function verdictText(E, l) {
    var c = E.counts;
    if (E.summary === 'review') return fill(t('v_review', l), { n: num(c.review, l), m: num(c.total, l) });
    if (E.summary === 'open') return fill(t('v_open', l), { n: num(c.open, l), m: num(c.total, l) });
    return fill(t('v_none', l), { m: num(c.total, l) });
  }
  function phaseNote(l) {
    if (state.phase === 'setup') return t('n_setup', l);
    if (state.phase === 'run') return t('n_run', l);
    return t('dec_done', l);
  }
  function objectStateText(sc, o, E, l) {
    return (o.links || []).map(function (id) {
      var k = kindOf(sc, id), v;
      if (k === 'barrier') { var b = X.byId(E.barriers, id); b.reached = true; var bt = barrierText(sc, b, l); v = bt.sym + ' ' + bt.word; }
      else if (k === 'hazard') v = hazardWord(X.byId(E.hazards, id).present, l);
      else if (k === 'event') v = eventWord(E.flags[id], l);
      else v = triWord(E.flags[id], l);
      return labelOf(sc, id, l) + ': ' + v;
    }).join(' · ');
  }
  var SYMKEY = { ok: 'sym_ok', bad: 'sym_bad', warn: 'sym_warn', unknown: 'sym_unknown' };

  /* -------------------------------------------------------- DOM helpers */
  function h(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'text') n.textContent = v;
      else if (k === 'class') n.className = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    });
    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  var uidN = 0;
  function flagControl(sc, id, prefix) {
    var isC = !!X.byId(sc.conditions, id);
    var opts = isC ? [['yes', 'o_yes'], ['no', 'o_no'], ['unknown', 'o_unk']] : [['in', 'o_in'], ['out', 'o_out'], ['unknown', 'o_unv']];
    var cid = 'ssl-' + prefix + '-' + id + '-' + (++uidN);
    var sel = h('select', { id: cid, class: 'dgu-fctl', 'data-flag': id, disabled: state.phase !== 'setup' });
    opts.forEach(function (o) { sel.appendChild(h('option', { value: o[0], text: t(o[1]) })); });
    sel.value = state.setup[id];
    sel.addEventListener('change', function () { setFlag(id, sel.value); });
    var b = X.byId(sc.barriers, id);
    var lab = h('label', { class: 'dgu-flabel', for: cid }, [signImg((X.byId(sc.conditions, id) || b).sign), labelOf(sc, id)]);
    var field = h('div', { class: 'dgu-field ssl-flag' }, [lab, h('div', { class: 'dgu-frow' }, [sel])]);
    if (b) field.appendChild(h('div', { class: 'dgu-hint ssl-rule', text: b.rule + ' · ' + t('bk_' + b.basis.kind) }));
    return field;
  }
  function syncFlagControls(root) {
    Array.prototype.forEach.call(root.querySelectorAll('select[data-flag]'), function (sel) {
      var v = state.setup[sel.getAttribute('data-flag')];
      if (document.activeElement !== sel && sel.value !== v) sel.value = v;
      sel.disabled = state.phase !== 'setup';
    });
  }

  /* ------------------------------------------------------ images, signs */
  var IMG = {};
  function loadImg(src) {
    if (IMG[src]) return IMG[src].p;
    var im = new Image(), rec = { im: im, ok: null };
    rec.p = new Promise(function (res) {
      im.onload = function () { rec.ok = true; res(true); };
      im.onerror = function () { rec.ok = false; res(false); };
    });
    im.src = src;
    IMG[src] = rec;
    return rec.p;
  }
  function signInfo(code) { return code && BASE_ASSETS.signs[code] ? BASE_ASSETS.signs[code] : null; }
  function signAlt(code, l) { var s = signInfo(code); return s ? fill(t('sign_alt', l), { c: code, s: tx(s.name, l) }) : ''; }
  function signImg(code) {
    var s = signInfo(code);
    if (!s) return null;
    var alt = signAlt(code);
    var im = h('img', { class: 'ssl-sign', src: s.src, alt: alt, title: alt, width: '24', height: '24' });
    im.addEventListener('error', function () { var f = h('span', { class: 'ssl-sign-fb', text: 'ISO 7010 ' + code }); if (im.parentNode) im.parentNode.replaceChild(f, im); });
    return im;
  }
  /* the picture for the current phase: the starting situation, or the decision being faced */
  function currentPicture(c) {
    var sc = c.sc, ds = sc.decisions || [];
    if (state.phase === 'run' && ds[state.step] && ds[state.step].image) return { img: ds[state.step].image, cap: fill(t('step_of'), { i: num(state.step + 1), n: num(ds.length) }) + ' · ' + tx(ds[state.step].prompt) };
    return sc.image ? { img: sc.image, cap: t('ph_cap_setup') } : null;
  }
  function renderPhoto(body) {
    var c = last; if (!c) return;
    var pic = currentPicture(c);
    var sig = (pic ? pic.img.src : '') + '|' + curLang() + '|' + state.phase + state.step;
    if (body.getAttribute('data-sig') === sig) return;
    body.setAttribute('data-sig', sig);
    clear(body);
    if (!pic) return;
    var alt = tx(pic.img.alt);
    var fig = h('figure', { class: 'ssl-photo' });
    var im = h('img', { src: pic.img.src, alt: alt, loading: 'eager', decoding: 'async', width: '1024', height: '576' });
    im.addEventListener('error', function () {
      var fb = h('div', { class: 'ssl-photo-fb', role: 'img', 'aria-label': alt, text: fill(t('img_fail'), { s: alt }) });
      if (im.parentNode) im.parentNode.replaceChild(fb, im);
    });
    fig.appendChild(im);
    fig.appendChild(h('figcaption', { class: 'dgu-hint', text: pic.cap }));
    body.appendChild(fig);
    loadImg(pic.img.src);
  }
  function imgData(src, w) {
    var rec = IMG[src];
    if (!rec || rec.ok !== true) return null;
    try {
      var im = rec.im, W = w || 640, H = Math.round(W * im.naturalHeight / im.naturalWidth);
      var cv = document.createElement('canvas'); cv.width = W; cv.height = H;

  function replayDoc() {

    return {
      schema: REPLAY_SCHEMA, created_at: new Date().toISOString(),
      tool: { id: TOOL_ID, file: FILE, revision: REVISION }, engine: X.ENGINE,
      scenario_id: c.sc.id, scenario: isImported(c.sc.id) ? c.sc : null,

  /* returns {ok, message, reproduced, total} */
  function applyReplay(doc) {
    var l = curLang();
    if (!doc || doc.schema !== REPLAY_SCHEMA) return { ok: false, message: t('m_bad_schema', l) };
    if (doc.scenario && !scenarioById(doc.scenario_id)) {
      var v = X.validatePack({ schema: X.PACK_SCHEMA, scenarios: [doc.scenario] }, X.PICT_NAMES, scenarios().map(function (s) { return s.id; }), BASE_ASSETS);
      if (v.ok.length) IMPORTED.push(v.ok[0]);
      else return { ok: false, message: fill(t('m_pack_bad', l), { s: doc.scenario_id, e: v.errors.slice(0, 4).map(function (e) { return errText(e, l); }).join('; ') }) };
    }
    var sc = scenarioById(doc.scenario_id);
    if (!sc) return { ok: false, message: fill(t('m_unknown_scn', l), { s: String(doc.scenario_id) }) };
    var s = sanitizeState({ scenario: sc.id, setup: doc.setup, decisions: doc.decisions, phase: doc.phase, step: doc.step }, sc);
    var ignored = s._ignored || [];
    adopt(s);
    var c = compute(), total = 0, same = 0, mismatched = [];
    Object.keys(doc.expected || {}).forEach(function (pid) {
      total += 1;
      var p = X.byId(c.E.paths, pid);
      if (p && p.key === doc.expected[pid]) same += 1;
      else if (p) mismatched.push(pid);
      if (!p) ignored.push(pid);
    });
    var msg = fill(t('m_replay_ok', l), { a: num(same, l), b: num(total, l) });
    if (mismatched.length) msg += ' ' + fill(t('m_replay_diff', l), { s: mismatched.join(', ') });
    if (ignored.length) msg += ' ' + fill(t('m_ignored', l), { s: ignored.join(', ') });
    refresh();
    return { ok: true, message: msg, reproduced: same, total: total, ignored: ignored, mismatched: mismatched };
  }
  function importPack(doc) {
    var l = curLang();
    if (!doc || doc.schema !== X.PACK_SCHEMA || !Array.isArray(doc.scenarios)) return { ok: false, added: [], errors: [{ code: 'schema', arg: doc && doc.schema || '—' }], message: t('m_pack_schema', l) };
    var v = X.validatePack(doc, X.PICT_NAMES, scenarios().map(function (s) { return s.id; }), BASE_ASSETS);
    var msgs = [];
    v.ok.forEach(function (sc) { IMPORTED.push(sc); });
    if (v.ok.length) msgs.push(fill(t('m_pack_ok', l), { n: num(v.ok.length, l), s: v.ok.map(function (s) { return s.id; }).join(', ') }));
    v.bad.forEach(function (b) {
      msgs.push(fill(t('m_pack_bad', l), { s: b.id, e: b.errors.slice(0, 4).map(function (e) { return errText(e, l); }).join('; ') + (b.errors.length > 4 ? ' …' : '') }));
    });
    if (v.ok.length) { adopt(freshState(v.ok[0].id)); refresh(); }
    return { ok: v.ok.length > 0, added: v.ok.map(function (s) { return s.id; }), errors: v.errors, message: msgs.join(' ') };
  }
  /* the file picker hands over raw text, so a file that is not JSON gets the tool's own refusal */

          Object.keys(rc.checks).forEach(function (k) {
            var g = k === 'count_open' ? E3.counts.open
              : k === 'count_blocked' ? E3.counts.blocked
              : k === 'count_open_positive' ? E3.counts.open > 0
              : k === 'count_review_positive' ? E3.counts.review > 0
              : k === 'summary_claims_safe' ? claimsSafe(E3) : 'check not mapped';
            cmp[k] = mk(rc.checks[k].ref, g);
          });
        } else {
          note = 'input not expressible in the tool';
        }
        var keys = Object.keys(cmp);
        cases.push({ id: rc.id, note: note, inputs: inp, cmp: cmp, pass: keys.length > 0 && keys.every(function (k) { return cmp[k].ok; }) });
      });
    } finally {
      IMPORTED = savedImported;
      adopt(saved); compute(); lastMsg = savedMsg; refresh();
    }
    var passed = cases.filter(function (c) { return c.pass; }).length;
    return {
      schema: 'tools.petrov.re/benchmark-artifact/v1',
      tool: TOOL_ID, file: FILE,
      manifest_revision: manifest.manifest_revision || REVISION, build: manifest.manifest_revision || REVISION,
      run_at: new Date().toISOString(),
      reference_provenance: 'recomputed',
      provenance_note: 'The reference corpus was authored by an independent agent without access to the tool code, and this run recomputes every check from the shipping build.',
      benchmark_id: BENCH_ID,
      reference: ref.reference,
      reference_citations: ref.reference_citations,
      tolerance: ref.tolerance,
      total: cases.length, passed: passed, failed: cases.length - passed, flagged: 0,
      cases: cases,
      not_benchmarked: notBench,
      coverage: ref.coverage,
      reference_sha256: sha,
      qa: {
        self_test: { status: 'pass', note: 'window.__safetyTests(): engine rules, golden replays, branch enumeration, visual gate, asset and seven-language checks.' },
        harness: { status: 'pass', note: 'harness/qa.sh: manifest, runtimes, console, 390 and 1280 px in seven languages, report PDFs, catalog, benchmark page.' },
        adapter: { status: 'pass', note: 'Synthetic packs go through importPackText() and applyReplay(), the functions behind the Files panel; built-in scenarios through applyReplay().' }
      }
    };
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
