  "description": {
    "en": "Assemble a reaction from a Particle Data Group table of 88 entries and see which conservation law breaks. Charge, baryon number, the three lepton numbers, strangeness, charm and bottomness are checked term by term, alongside the kinematics: √s for a fixed target or a collider, the beam energy at threshold, and a log–log chart against seven reference machines from the Bevatron to the LHC. A second section spins the branching ratios of 24 decaying parents over 87 channels, generates flat phase-space events and draws the tracks. A built-in validation sheet re-checks every channel, eight PDG momenta and six first-principles benchmarks.",
    "uk": "Складіть реакцію з таблиці Particle Data Group на 88 записів і подивіться, який закон збереження порушується. Заряд, баріонне число, три лептонні числа, дивність, чарівність і красу перевіряються почленно, поряд із кінематикою: √s для нерухомої мішені чи колайдера, енергія пучка на порозі та графік у подвійному логарифмі проти семи еталонних машин від беватрона до LHC. Другий розділ прокручує ймовірності розпаду 24 материнських частинок за 87 каналами, генерує події за плоским фазовим об’ємом і малює треки. Вбудований аркуш верифікації перевіряє кожен канал, вісім імпульсів PDG і шість оцінок із перших принципів.",
    "de": "Stellen Sie eine Reaktion aus einer Particle-Data-Group-Tabelle mit 88 Einträgen zusammen und sehen Sie, welcher Erhaltungssatz bricht. Ladung, Baryonenzahl, die drei Leptonenzahlen, Strangeness, Charm und Bottomness werden gliedweise geprüft, dazu die Kinematik: √s für ruhendes Target oder Collider, die Strahlenergie an der Schwelle und ein doppeltlogarithmisches Diagramm gegen sieben Referenzmaschinen vom Bevatron bis zum LHC. Ein zweiter Abschnitt dreht die Verzweigungsverhältnisse von 24 zerfallenden Mutterteilchen über 87 Kanäle, erzeugt Ereignisse aus flachem Phasenraum und zeichnet die Spuren. Ein eingebautes Prüfblatt kontrolliert jeden Kanal, acht PDG-Impulse und sechs Abschätzungen aus ersten Prinzipien.",
    "nl": "Stel een reactie samen uit een Particle Data Group-tabel met 88 items en zie welke behoudswet breekt. Lading, baryongetal, de drie leptongetallen, vreemdheid, charme en bottomness worden term voor term gecontroleerd, samen met de kinematica: √s voor een vast trefplaatje of een botser, de bundelenergie op de drempel en een dubbellogaritmische grafiek tegen zeven referentiemachines van de Bevatron tot de LHC. Een tweede deel draait de vertakkingsverhoudingen van 24 vervallende moederdeeltjes over 87 kanalen, genereert gebeurtenissen uit vlakke faseruimte en tekent de sporen. Een ingebouwd verificatieblad hercontroleert elk kanaal, acht PDG-impulsen en zes schattingen vanuit eerste principes.",
    "fr": "Composez une réaction à partir d’une table du Particle Data Group de 88 entrées et voyez quelle loi de conservation se brise. Charge, nombre baryonique, les trois nombres leptoniques, étrangeté, charme et beauté sont vérifiés terme à terme, avec la cinématique : √s pour cible fixe ou collisionneur, l’énergie de faisceau au seuil et un diagramme log–log face à sept machines de référence, du Bevatron au LHC. Une seconde partie fait tourner les rapports d’embranchement de 24 particules mères sur 87 canaux, engendre des événements en espace de phase plat et trace les traces. Une feuille de vérification intégrée recontrôle chaque canal, huit impulsions du PDG et six estimations de premiers principes.",
    "es": "Componga una reacción a partir de una tabla del Particle Data Group de 88 entradas y vea qué ley de conservación se rompe. Carga, número bariónico, los tres números leptónicos, extrañeza, encanto y belleza se comprueban término a término, junto con la cinemática: √s para blanco fijo o colisionador, la energía del haz en el umbral y un diagrama log–log frente a siete máquinas de referencia, del Bevatrón al LHC. Una segunda sección hace girar las razones de desintegración de 24 partículas madre en 87 canales, genera sucesos en espacio de fases plano y dibuja las trazas. Una hoja de verificación integrada recomprueba cada canal, ocho momentos del PDG y seis estimaciones de primeros principios.",
    "pl": "Zbuduj reakcję z tabeli Particle Data Group, zawierającej 88 wpisów, i sprawdź, które prawo zachowania jest naruszone. Ładunek, liczba barionowa, trzy liczby leptonowe, dziwność, urok i dno są sprawdzane człon po członie, wraz z kinematyką: √s dla stałego celu lub zderzacza, energią wiązki przy progu oraz wykresem logarytmicznym dla siedmiu maszyn referencyjnych, od Bevatronu do LHC. Druga sekcja obraca współczynniki rozgałęzień 24 rozpadających się macierzystych cząstek w 87 kanałach, generuje płaskie zdarzenia w przestrzeni fazowej i rysuje ścieżki. Wbudowany arkusz walidacyjny ponownie sprawdza każdy kanał, osiem pędów PDG i sześć benchmarków pierwszych zasad."

  "limitations": {
    "en": "Selection rules only. The engine tests charge, baryon and lepton numbers and the flavour changes, so an “allowed” verdict says nothing about the rate: no cross-section, matrix element or luminosity is computed anywhere. Angular momentum is checked only as the parity of the fermion count rather than as a true vector coupling, and parity, C, G, isospin and CP are not checked at all. Quarks are selectable as free particles at current-quark masses, which makes any quark-level threshold meaningless, and neutrinos are exactly massless. Decays use flat GENBOD phase space with no matrix element, so Dalitz structure, angular distributions and spin correlations are absent; resonances decay at the pole mass with no Breit–Wigner width, and 18 of the 87 channels are inclusive catch-alls that carry no final state. Collider kinematics assumes symmetric head-on beams. The theory benchmarks are tree-level. Masses and branching ratios are the Particle Data Group 2025 summary-table values (Phys. Rev. D 110, 030001 (2024) and 2025 update); they are frozen at that edition and are not refreshed automatically.",
    "uk": "Лише правила відбору. Програма перевіряє заряд, баріонне й лептонні числа та зміни ароматів, тож висновок «дозволено» нічого не каже про швидкість процесу: переріз, матричний елемент і світність не рахуються ніде. Момент кількості руху перевіряється лише як парність числа ферміонів, а не як справжнє векторне складання; парність, C, G, ізоспін і CP не перевіряються взагалі. Кварки можна вибирати як вільні частинки з струмовими масами, через що будь-який поріг на рівні кварків позбавлений сенсу, а нейтрино вважаються точно безмасовими. Розпади рахуються за плоским фазовим об’ємом GENBOD без матричного елемента, тож структура Далиця, кутові розподіли та спінові кореляції відсутні; резонанси розпадаються рівно на полюсній масі без ширини Брейта — Вігнера, а 18 із 87 каналів є інклюзивними й не мають кінцевого стану. Кінематика колайдера передбачає симетричні зустрічні пучки. Теоретичні орієнтири беруться в деревному наближенні, а маси та ймовірності розпаду відповідають одному випуску таблиць Particle Data Group і автоматично не оновлюються. Теоретичні бенчмарки — деревного рівня. Маси й відносні ймовірності взято з підсумкових таблиць Particle Data Group 2025 (Phys. Rev. D 110, 030001 (2024) і оновлення 2025); вони зафіксовані на цьому виданні й не оновлюються автоматично.",
    "de": "Nur Auswahlregeln. Geprüft werden Ladung, Baryonen- und Leptonenzahlen sowie die Flavour-Änderungen; ein Urteil „erlaubt“ sagt daher nichts über die Rate: Wirkungsquerschnitt, Matrixelement und Luminosität werden nirgends berechnet. Der Drehimpuls wird lediglich als Parität der Fermionenzahl geprüft und nicht als echte Vektorkopplung; Parität, C, G, Isospin und CP werden überhaupt nicht geprüft. Quarks lassen sich als freie Teilchen mit Stromquarkmassen wählen, wodurch jede Schwelle auf Quarkniveau bedeutungslos wird, und Neutrinos sind exakt masselos. Zerfälle nutzen flachen GENBOD-Phasenraum ohne Matrixelement, sodass Dalitz-Struktur, Winkelverteilungen und Spinkorrelationen fehlen; Resonanzen zerfallen exakt bei der Polmasse ohne Breit-Wigner-Breite, und 18 der 87 Kanäle sind inklusive Sammelkanäle ohne Endzustand. Die Collider-Kinematik setzt symmetrische, frontal kollidierende Strahlen voraus. Die theoretischen Vergleichswerte sind Baumniveau, und Massen und Verzweigungsverhältnisse folgen einem einzigen Stand der Particle-Data-Group-Tabellen, der nicht automatisch aktualisiert wird. Die Theorie-Benchmarks sind auf Baumniveau. Massen und Verzweigungsverhältnisse sind die Werte der Summary Tables der Particle Data Group 2025 (Phys. Rev. D 110, 030001 (2024) und Update 2025); sie sind auf diese Ausgabe festgelegt und werden nicht automatisch aktualisiert.",
    "nl": "Alleen selectieregels. De motor toetst lading, baryon- en leptongetallen en de flavourveranderingen, dus een oordeel “toegestaan” zegt niets over de snelheid: werkzame doorsnede, matrixelement en luminositeit worden nergens berekend. Het impulsmoment wordt alleen als pariteit van het aantal fermionen getoetst en niet als echte vectorkoppeling; pariteit, C, G, isospin en CP worden helemaal niet getoetst. Quarks zijn te kiezen als vrije deeltjes met stroomquarkmassa’s, waardoor elke drempel op quarkniveau betekenisloos is, en neutrino’s zijn exact massaloos. Vervallen gebruiken vlakke GENBOD-faseruimte zonder matrixelement, zodat Dalitz-structuur, hoekverdelingen en spincorrelaties ontbreken; resonanties vervallen precies bij de poolmassa zonder Breit-Wignerbreedte, en 18 van de 87 kanalen zijn inclusieve verzamelkanalen zonder eindtoestand. De botserkinematica gaat uit van symmetrische frontale bundels. De theoretische ijkpunten zijn boomniveau, en massa’s en vertakkingsverhoudingen volgen één uitgave van de Particle Data Group-tabellen die niet automatisch wordt ververst. De theoriebenchmarks zijn op boomniveau. Massa's en vertakkingsverhoudingen zijn de waarden uit de summary tables van de Particle Data Group 2025 (Phys. Rev. D 110, 030001 (2024) en update 2025); ze staan vast op die editie en worden niet automatisch ververst.",
    "fr": "Règles de sélection uniquement. Le moteur teste la charge, les nombres baryonique et leptoniques et les changements de saveur ; un verdict « permis » ne dit donc rien du taux : aucune section efficace, aucun élément de matrice, aucune luminosité n’est calculé. Le moment cinétique n’est vérifié que comme parité du nombre de fermions et non comme un véritable couplage vectoriel ; parité, C, G, isospin et CP ne sont pas vérifiés du tout. Les quarks sont sélectionnables comme particules libres à leurs masses courantes, ce qui rend tout seuil au niveau des quarks dépourvu de sens, et les neutrinos sont exactement sans masse. Les désintégrations utilisent l’espace de phase plat GENBOD sans élément de matrice : structure de Dalitz, distributions angulaires et corrélations de spin sont absentes ; les résonances se désintègrent exactement à la masse du pôle, sans largeur de Breit-Wigner, et 18 des 87 canaux sont inclusifs et sans état final. La cinématique du collisionneur suppose des faisceaux symétriques frontaux. Les repères théoriques sont au niveau de l’arbre, et masses et rapports d’embranchement suivent une seule édition des tables du Particle Data Group, non rafraîchie automatiquement. Les repères théoriques sont au niveau des arbres. Les masses et les rapports d'embranchement sont ceux des summary tables du Particle Data Group 2025 (Phys. Rev. D 110, 030001 (2024) et mise à jour 2025) ; ils sont figés à cette édition et ne sont pas actualisés automatiquement.",
    "es": "Solo reglas de selección. El motor comprueba la carga, los números bariónico y leptónicos y los cambios de sabor, de modo que un veredicto de «permitido» no dice nada sobre el ritmo: no se calcula ninguna sección eficaz, elemento de matriz ni luminosidad. El momento angular se comprueba únicamente como paridad del número de fermiones y no como un acoplamiento vectorial real; paridad, C, G, isospín y CP no se comprueban en absoluto. Los quarks pueden seleccionarse como partículas libres con masas de corriente, lo que hace carente de sentido cualquier umbral a nivel de quarks, y los neutrinos son exactamente sin masa. Las desintegraciones emplean espacio de fases plano GENBOD sin elemento de matriz, por lo que faltan la estructura de Dalitz, las distribuciones angulares y las correlaciones de espín; las resonancias se desintegran exactamente en la masa del polo, sin anchura de Breit-Wigner, y 18 de los 87 canales son inclusivos y no llevan estado final. La cinemática del colisionador supone haces simétricos frontales. Los valores teóricos de referencia son a nivel árbol, y masas y razones de desintegración siguen una única edición de las tablas del Particle Data Group que no se actualiza automáticamente. Los contrastes teóricos son a nivel árbol. Las masas y razones de ramificación son los valores de las summary tables del Particle Data Group 2025 (Phys. Rev. D 110, 030001 (2024) y actualización de 2025); están fijados a esa edición y no se actualizan automáticamente.",
    "pl": "Tylko reguły selekcji. Silnik testuje ładunek, liczbę barionową i leptonową oraz zmiany zapachu, więc werdykt „dozwolony” nic nie mówi o tempie: nigdzie nie oblicza się przekroju czynnego, elementu macierzy ani jasności. Moment pędu jest sprawdzany jedynie jako parzystość liczby fermionów, a nie jako rzeczywiste sprzężenie wektorowe, a parzystość, C, G, izospin i CP nie są w ogóle sprawdzane. Kwarki są selekcjonowalne jako cząstki swobodne przy masach kwarków prądowych, co sprawia, że ​​próg na poziomie kwarków jest bezsensowny, a neutrina są dokładnie bezmasowe. Rozpady wykorzystują płaską przestrzeń fazową GENBOD bez elementu macierzy, więc struktura Dalitza, rozkłady kątowe i korelacje spinowe są nieobecne; rezonanse zanikają przy masie biegunowej bez szerokości Breita-Wignera, a 18 z 87 kanałów to inkluzywne kanały, które nie mają stanu końcowego. Kinematyka zderzaczy zakłada symetryczne wiązki czołowe. Testy teoretyczne są na poziomie drzewa. Masy i stosunki rozgałęzień to wartości tabeli podsumowującej Particle Data Group 2025 (Phys. Rev. D 110, 030001 (2024) i aktualizacja 2025); są one zamrożone w tej edycji i nie są odświeżane automatycznie."

      "uk": "29 випадків, проведених через власні елементи керування сторінки: усі 88 записів таблиці частинок звірено з підсумковими таблицями Particle Data Group 2025 та з незалежно перерахованими квантовими числами за кварковим складом; усі 69 явних каналів розпаду перевірено на збереження заряду, баріонного та лептонних чисел, дев'ять відносних імовірностей звірено з PDG; 27 реакцій - кожна порушує рівно один закон збереження або відома як дозволена - порівняно з висновком, виведеним із визначень законів, разом із замкненими формулами для sqrt(s) і порогу. Усі 29 пройдено. Стенд авторський; жодна стороння особа його не перевіряла.",

      "nl": "29 gevallen via de eigen bedieningselementen van de pagina uitgevoerd: alle 88 tabelvermeldingen vergeleken met de Particle Data Group 2025 summary tables en met onafhankelijk uit de quarkinhoud herberekende kwantumgetallen, alle 69 expliciete vervalkanalen gecontroleerd op behoud van lading, baryon- en leptongetallen, negen vertakkingsverhoudingen steekproefsgewijs tegen PDG, en 27 reacties - elk met precies één geschonden behoudswet, of bekend toegestaan - vergeleken met een oordeel dat uit de definities is afgeleid, samen met gesloten uitdrukkingen voor sqrt(s) en de drempel. Alle 29 geslaagd. De testbank is van de auteur zelf; geen externe partij heeft die beoordeeld.",

      "es": "29 casos ejecutados con los propios controles de la página: las 88 entradas de la tabla contrastadas con las summary tables del Particle Data Group 2025 y con números cuánticos recalculados de forma independiente a partir del contenido en quarks, los 69 canales de desintegración explícitos verificados en cuanto a conservación de carga, número bariónico y números leptónicos, nueve razones de ramificación comprobadas contra PDG, y 27 reacciones - cada una rompe exactamente una ley de conservación, o se sabe permitida - comparadas con un veredicto derivado de las definiciones, junto con las expresiones cerradas de sqrt(s) y del umbral. Los 29 casos pasan. El banco de pruebas es del propio autor; ningún tercero lo ha revisado.",

   URL, but it is never written into the shared site-language key. Polish is a site language; Russian remains tool-local. The port keeps the extra Russian option while following the global site-language registry. */
const TOOL_LANGS=["en","uk","de","nl","fr","es","ru","pl"];

function initialLang(){
  let l=null;
  try{l=new URLSearchParams(location.search).get("lang")}catch(e){}
  if(l)l=String(l).slice(0,2).toLowerCase();

  if(!TOOL_LANGS.includes(l))l=TOOL_LANGS.includes(window.__diagramLang)?window.__diagramLang:"en";
  return l;
}

/* ---------- formatting ---------- */
function fmtN(x){
  const r=Math.round(x);
  if(Math.abs(x-r)<1e-9) return String(r);
  const th=Math.round(x*3);
  if(Math.abs(x*3-th)<1e-6){const s=th<0?"−":"";return s+Math.abs(th)+"⁄3";}
  return x.toFixed(2);
}
function fmtE(x){
  if(!isFinite(x)) return "∞";
  if(x<=0) return "0";
  if(x>=1000) return (x/1000).toFixed(x/1000<10?2:1)+" "+t("u_T");
  if(x>=1)    return x.toFixed(x<10?3:x<100?2:1)+" "+t("u_G");
  if(x>=1e-3) return (x*1000).toFixed(x*1000<10?2:1)+" "+t("u_M");
  if(x>=1e-6) return (x*1e6).toFixed(x*1e6<10?2:1)+" "+t("u_k");
  if(x>=1e-9) return (x*1e9).toFixed(x*1e9<10?2:1)+" "+t("u_e");
  return (x*1e9).toExponential(2)+" "+t("u_e");
}
/* the adaptive formatters above choose their own unit, so the tile's unit slot is
   filled from the formatted string rather than from the framework unit registry */
function split(s){const i=String(s).lastIndexOf(" ");return i<0?{v:String(s),u:""}:{v:s.slice(0,i),u:s.slice(i+1)};}
function tileOf(label,formatted,extra){const p=split(formatted);
  return Object.assign({label:label,value:p.v,hint:p.u||null},extra||{});}

/* ============================================================ PHYSICS ======= */
/* Fixed target: beam of kinetic energy Tk hits a particle at rest.
   s = m1² + m2² + 2·E1·m2 ,  E1 = Tk + m1                                    */
function sFix(Tk,m1,m2){const E1=Tk+m1;return Math.sqrt(m1*m1+m2*m2+2*E1*m2);}
/* Collider: both beams share the same momentum (same ring, same rigidity),
   head-on, so the total momentum cancels and √s = E1 + E2.                   */
function sCol(Tk,m1,m2){
  const E1=Tk+m1,p=Math.sqrt(Math.max(0,E1*E1-m1*m1));
  return E1+Math.sqrt(p*p+m2*m2);
}
const sqrtS=(g,Tk,m1,m2)=>g==="col"?sCol(Tk,m1,m2):sFix(Tk,m1,m2);
/* Threshold beam kinetic energy so that √s reaches M. */
function threshold(g,M,m1,m2){
  if(M<=m1+m2) return 0;
  if(g==="fix"){const E1=(M*M-m1*m1-m2*m2)/(2*m2);return Math.max(0,E1-m1);}
  let lo=0,hi=1;
  while(sCol(hi,m1,m2)<M&&hi<1e12) hi*=2;
  for(let i=0;i<120;i++){
    const mid=(lo+hi)/2;
    if(sCol(mid,m1,m2)<M) lo=mid; else hi=mid;
  }
  return (lo+hi)/2;
}

const isNu=k=>/^(nue|num|nut)~?$/.test(k);
const isWZ=k=>/^(W~?|Z)$/.test(k);

function analyse(){
  const L=ST.lhs.map(k=>PT[k]),R=ST.rhs.map(k=>PT[k]);
  const A={ok:L.length>0&&R.length>0,rows:[],hard:false,weakOnly:false};
  if(!A.ok) return A;
  const sum=(a,q)=>a.reduce((s,p)=>s+p[q],0);
  /* show a row when some particle actually carries the quantum number, even if
     the totals cancel — the cancellation is the point (e.g. the antineutrino
     in beta decay). */
  const carries=q=>[...L,...R].some(p=>Math.abs(p[q])>1e-9);
  const HARD=[["Q","l_Q"],["B","l_B"],["Le","l_Le"],["Lm","l_Lm"],["Lt","l_Lt"]];
  const FLAV=[["S","l_S"],["C","l_C"],["Bt","l_Bt"]];
  A.d={};
  for(const [q,key] of HARD){
    const i=sum(L,q),o=sum(R,q),bad=Math.abs(i-o)>1e-9;
    A.d[q]=o-i;
    if(bad) A.hard=true;
    if(q==="Q"||q==="B"||bad||carries(q)) A.rows.push({key,i:fmtN(i),o:fmtN(o),st:bad?"bad":"ok"});
  }
  const noS=[...L,...R].some(p=>p.noS);
  for(const [q,key] of FLAV){
    const i=sum(L,q),o=sum(R,q),d=o-i,bad=Math.abs(d)>1e-9&&!(q==="S"&&noS);
    A.d[q]=bad?d:0;
    if(q==="S"&&noS){A.rows.push({key,i:"—",o:"—",st:"na"});continue;}
    if(bad) A.weakOnly=true;
    if(bad||carries(q)) A.rows.push({key,i:fmtN(i),o:fmtN(o),st:bad?(q==="S"&&Math.abs(d)>1?"warn":"weak"):"ok"});
  }
  /* angular momentum: orbital L is always integral, so the half-integrality of
     the total — i.e. the parity of the fermion count — must match. */
  const fp=a=>a.filter(p=>Math.abs(p.J%1)>1e-9).length%2;
  const fi=fp(L),fo=fp(R),jbad=fi!==fo;
  if(jbad) A.hard=true;
  A.rows.push({key:"l_J",i:t(fi?"half":"integ"),o:t(fo?"half":"integ"),st:jbad?"bad":"ok"});
  /* energy */
  const m1=GeV(ST.lhs[0]),m2=L.length>1?GeV(ST.lhs[1]):0;
  A.M=R.reduce((s,p)=>s+p.m/1000,0);
  A.decay=L.length===1;
  A.rs=A.decay?m1:sqrtS(ST.geom,ST.T,m1,m2);
  A.thr=A.decay?null:threshold(ST.geom,A.M,m1,m2);
  A.enough=A.rs>=A.M-1e-9;
  A.rows.push({key:"l_E",i:fmtE(A.rs),o:fmtE(A.M),st:A.enough?"ok":"bad",eng:1});
  /* which interaction is not excluded */
  const all=[...L,...R],keys=[...ST.lhs,...ST.rhs];
  const flav=Math.abs(A.d.S)>1e-9||Math.abs(A.d.C)>1e-9||Math.abs(A.d.Bt)>1e-9;
  const nu=keys.some(isNu),wz=keys.some(isWZ);
  const hadronic=all.every(p=>p.grp!=="lep"&&!isWZ(p.key)&&p.key!=="H"&&p.key!=="ga");
  A.mech={str:!flav&&hadronic,em:!flav&&!nu&&!wz,wk:true};
  A.verdict=A.hard?"no":!A.enough?"thr":A.weakOnly?"weak":"ok";
  return A;
}

/* ---------- chart: √s versus beam energy, both geometries ----------
   The drawing is unchanged; what changed is that it is now laid out in the
   stage's real pixels instead of a fixed 660-unit viewBox scaled to fit, so the
   tick labels stay at --fs-small at 390 px instead of shrinking to about 6 px
   (spec §10, UI_AUDIT S-13). */
function drawChart(size,st){
  const A=LASTA,body=st.body;
  const cap=st.node.querySelector(".dgu-stage-cap");
  if(!A||!A.ok||A.decay){body.innerHTML="";if(cap)cap.textContent=t("chart_t");return;}
  const m1=GeV(ST.lhs[0]),m2=GeV(ST.lhs[1]);
  const W=Math.max(300,size.w),H=Math.max(200,size.h);
  const coarse=size.density==="coarse";
  const ml=coarse?42:54,mr=16,mt=8,mb=coarse?34:40,pw=W-ml-mr,ph=H-mt-mb;
  const lx0=-2,lx1=4.4;
  const X=v=>ml+(Math.log10(v)-lx0)/(lx1-lx0)*pw;
  const base=m1+m2;
  const top=Math.max(sCol(10**lx1,m1,m2),A.M*1.5);
  const ly0=Math.floor(Math.log10(base*0.6)),ly1=Math.ceil(Math.log10(top));
  const Y=v=>mt+ph-(Math.log10(Math.max(v,10**ly0))-ly0)/(ly1-ly0)*ph;
  const path=fn=>{let d="";for(let i=0;i<=180;i++){
      const e=10**(lx0+(lx1-lx0)*i/180);d+=(i?"L":"M")+X(e).toFixed(1)+" "+Y(fn(e)).toFixed(1);}
    return d;};
  let g="";
  const ystep=coarse&&(ly1-ly0)>5?2:1;
  for(let k=ly0;k<=ly1;k++){const y=Y(10**k);
    g+=`<line class="gl" x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}"/>`;
    if((k-ly0)%ystep===0)
      g+=`<text class="tk" x="${ml-8}" y="${y+3.5}" text-anchor="end">${fmtAx(10**k)}</text>`;}
  const xstep=coarse?2:1;
  for(let k=Math.ceil(lx0);k<=Math.floor(lx1);k++){const x=X(10**k);
    g+=`<line class="gl" x1="${x}" y1="${mt}" x2="${x}" y2="${mt+ph}"/>`;
    if((k-Math.ceil(lx0))%xstep===0)
      g+=`<text class="tk" x="${x}" y="${mt+ph+15}" text-anchor="middle">${fmtAx(10**k)}</text>`;}
  const show=ST.mode==="ref"||ST.shown;
  const muted=tok("--muted","#5b6675"),panel=tok("--panel","#fff");
  let thr="";
  if(show&&A.M>base){const y=Y(A.M);
    thr=`<line x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}" stroke="${muted}" stroke-width="1.5" stroke-dasharray="5 4"/>
         <text class="dl" x="${W-mr}" y="${y-6}" text-anchor="end" fill="${muted}">${t("thr_line")} · ${fmtE(A.M)}</text>`;}
  const cx=X(Math.min(Math.max(ST.T,10**lx0),10**lx1)),cy=Y(A.rs);
  const dot=`<circle cx="${cx}" cy="${cy}" r="6.5" fill="${ser(ST.geom==="col"?1:0)}" stroke="${panel}" stroke-width="2"/>`;
  body.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("chart_t")}">
    ${g}
    <line class="ax" x1="${ml}" y1="${mt+ph}" x2="${W-mr}" y2="${mt+ph}"/>
    <line class="ax" x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}"/>
    <path d="${path(e=>sFix(e,m1,m2))}" fill="none" stroke="${ser(0)}" stroke-width="2" stroke-linecap="round"/>
    <path d="${path(e=>sCol(e,m1,m2))}" fill="none" stroke="${ser(1)}" stroke-width="2" stroke-linecap="round"/>
    ${thr}${dot}
    <text class="tk" x="${ml+pw/2}" y="${H-4}" text-anchor="middle">${t("chart_x")}</text>
    <text class="tk" x="${-(mt+ph/2)}" y="13" text-anchor="middle" transform="rotate(-90)">${t("chart_y")}</text>
  </svg>`;
  if(cap)cap.innerHTML=`<div>${t("chart_t")}</div><div class="legend">
    <span><i class="sw" style="background:${ser(0)}"></i>${t("s_fix")}</span>
    <span><i class="sw" style="background:${ser(1)}"></i>${t("s_col")}</span>
    <span><i class="sw" style="background:${muted}"></i>${t("here")}: ${fmtE(ST.T)} → √s = ${fmtE(A.rs)}</span>
  </div>`;
}
const SUP="⁻⁰¹²³⁴⁵⁶⁷⁸⁹";
function fmtAx(v){
  const e=Math.round(Math.log10(v));
  if(e>=0&&e<=2) return String(Math.round(v));
  const d=String(Math.abs(e)).split("").map(c=>SUP[+c+1]).join("");
  return "10"+(e<0?SUP[0]:"")+d;
}

function counts(k){
  if(!DS.counts[k]) DS.counts[k]=new Array(DEC[k].ch.length).fill(0);
  return DS.counts[k];
}
const totalSpins=k=>counts(k).reduce((a,b)=>a+b,0);
function pick(k){
  const b=chBR(k),S=b.reduce((a,x)=>a+x,0);
  let r=Math.random()*S;
  for(let i=0;i<b.length;i++){r-=b[i];if(r<=0)return i;}
  return b.length-1;
}
/* width <-> lifetime, both directions, through Gamma*tau = hbar */
const widthOf =k=>DEC[k].w!=null?DEC[k].w:HBAR/DEC[k].tau;
const lifeOf  =k=>DEC[k].tau!=null?DEC[k].tau:HBAR/DEC[k].w;
function fmtT(x){
  const U=[[1,"s"],[1e-3,"ms"],[1e-6,"µs"],[1e-9,"ns"],[1e-12,"ps"],[1e-15,"fs"],[1e-18,"as"]];
  for(const [f,u] of U) if(x>=f) return (x/f).toPrecision(4).replace(/\.?0+$/,"")+" "+u;
  return x.toExponential(3)+" s";
}
function fmtL(x){ /* c*tau, metres in */
  if(x>=1e3) return (x/1e3).toPrecision(3)+" km";
  if(x>=1)   return x.toPrecision(3)+" m";
  if(x>=1e-2)return (x*100).toPrecision(3)+" cm";
  if(x>=1e-3)return (x*1000).toPrecision(3)+" mm";
  if(x>=1e-6)return (x*1e6).toPrecision(3)+" µm";
  if(x>=1e-9)return (x*1e9).toPrecision(3)+" nm";
  if(x>=1e-12)return (x*1e12).toPrecision(3)+" pm";
  if(x>=1e-18)return (x*1e15).toPrecision(3)+" fm";
  return x.toExponential(2)+" m";
}

/* ---------- the wheel ---------- */
function arcPath(cx,cy,r0,r1,a0,a1){
  const P=(r,a)=>[(cx+r*Math.cos(a)).toFixed(2),(cy+r*Math.sin(a)).toFixed(2)];
  const big=(a1-a0)>Math.PI?1:0;
  const A=P(r1,a0),B=P(r1,a1),C=P(r0,a1),D=P(r0,a0);
  return `M${A} A${r1} ${r1} 0 ${big} 1 ${B} L${C} A${r0} ${r0} 0 ${big} 0 ${D} Z`;
}
function renderWheel(){
  const k=DS.cur,ch=DEC[k].ch,b=chBR(k),S=b.reduce((a,x)=>a+x,0);
  const R=138,r=64,cx=150,cy=150;
  let a=-Math.PI/2,seg="";
  ch.forEach((c,i)=>{
    const da=2*Math.PI*b[i]/S,col=c.oth?tok("--muted","#5b6675"):ser(i);
    /* sectors are exactly proportional — a 0.01% channel really is a hairline */
    seg+=`<path d="${arcPath(cx,cy,r,R,a,a+da)}" fill="${col}" stroke="var(--panel)"
           stroke-width="${da>0.02?1.5:0}" opacity="${DS.last===i?1:.9}"/>`;
    a+=da;
  });

    <g id="wheelspin" style="transform:rotate(${DS.rot}deg);transform-origin:150px 150px">
      ${seg}<circle cx="150" cy="150" r="${r-3}" fill="var(--panel)"/>
    </g>
    <path d="M150 6 L142 26 L158 26 Z" fill="var(--ink)"/>

function spinTo(idx,cb){
  const k=DS.cur,b=chBR(k),S=b.reduce((a,x)=>a+x,0);
  let acc=0;for(let i=0;i<idx;i++)acc+=b[i];
  const frac=(acc+b[idx]*(0.15+0.7*Math.random()))/S;
  const target=Math.ceil(DS.rot/360+5)*360-frac*360;
  const from=DS.rot,d=target-from,t0=performance.now(),T=2300;
  DS.busy=true;
  const g=()=>document.getElementById("wheelspin");
  (function step(now){
    const u=Math.min(1,(now-t0)/T),e=1-Math.pow(1-u,3);
    DS.rot=from+d*e;
    const el=g();if(el)el.style.transform=`rotate(${DS.rot}deg)`;
    if(u<1) requestAnimationFrame(step);
    else{DS.busy=false;cb();}
  })(t0);
}

/* ---------- relativistic n-body phase space (GENBOD / RAMBO-style) ---------- */
function pdk(a,b,c){
  const x=(a*a-(b+c)*(b+c))*(a*a-(b-c)*(b-c));
  return x<=0?0:Math.sqrt(x)/(2*a);
}
function rot3(list){
  const al=2*Math.PI*Math.random(),ga=2*Math.PI*Math.random();
  const cb=2*Math.random()-1,sb=Math.sqrt(Math.max(0,1-cb*cb));
  const ca=Math.cos(al),sa=Math.sin(al),cg=Math.cos(ga),sg=Math.sin(ga);
  for(const q of list){
    const x=ca*q.x-sa*q.y,y=sa*q.x+ca*q.y,z=q.z;
    const X=cb*x+sb*z,Y=y,Z=-sb*x+cb*z;
    q.x=cg*X-sg*Y;q.y=sg*X+cg*Y;q.z=Z;
  }
}
function boostY(q,beta){
  const g=1/Math.sqrt(1-beta*beta),E=q.E,py=q.y;
  q.E=g*(E+beta*py);q.y=g*(py+beta*E);
}
/* returns four-momenta in the parent rest frame, or null below threshold */
function genbod(M,m){
  const n=m.length;
  if(!n) return [];
  if(n===1) return [{E:M,x:0,y:0,z:0,m:m[0]}];
  const tm=M-m.reduce((a,b)=>a+b,0);
  if(tm<0) return null;
  let emin=0,emax=tm+m[0],wmax=1;
  for(let i=1;i<n;i++){emin+=m[i-1];emax+=m[i];wmax*=pdk(emax,emin,m[i]);}
  const inv=new Array(n),pd=new Array(n);
  let wt=0,guard=0;
  do{
    const r=[];for(let i=0;i<n-2;i++)r.push(Math.random());
    r.sort((a,b)=>a-b);
    const rr=[0].concat(r,[1]);
    let acc=0;for(let i=0;i<n;i++){acc+=m[i];inv[i]=acc+rr[i]*tm;}
    wt=1;for(let i=1;i<n;i++){pd[i]=pdk(inv[i],inv[i-1],m[i]);wt*=pd[i];}
  }while(Math.random()*wmax>wt&&++guard<4000);
  const P=[{E:Math.hypot(pd[1],m[0]),x:0,y:pd[1],z:0,m:m[0]},
           {E:Math.hypot(pd[1],m[1]),x:0,y:-pd[1],z:0,m:m[1]}];
  for(let i=2;i<n;i++){
    P.push({E:Math.hypot(pd[i],m[i]),x:0,y:-pd[i],z:0,m:m[i]});
    rot3(P.slice(0,i));
    const be=pd[i]/Math.hypot(pd[i],inv[i-1]);
    for(let j=0;j<i;j++) boostY(P[j],be);
  }
  rot3(P);
  return P;
}

/* ---------- event display ---------- */
function buildEvent(idx){
  const k=DS.cur,c=DEC[k].ch[idx],M=PT[k].m;
  if(c.oth||c.jets) return {kind:c.oth?"oth":"jets",n:c.jets||0,c};
  const m=c.p.map(x=>PT[x].m);
  if(c.off){   /* virtual boson: share the parent mass between two off-shell legs */
    const f=0.5+0.18*(Math.random()-0.5);
    const mm=[M*f*0.62,M*(1-f)*0.62];
    return {kind:"norm",c,P:genbod(M,mm),over:1};
  }
  return {kind:"norm",c,P:genbod(M,m)};
}

               stroke-linecap="round" opacity=".75" class="trk"/>`;

      }else{                                    /* charged: curls in the field */
        const sag=L*Math.max(-.55,Math.min(.55,Q*70/(pT[i]+70)))*0.38;
        const mx=cx+L/2*Math.cos(ang)-sag*Math.sin(ang);

/* ============================================================================
   VALIDATION
   ========================================================================== */
function gammln(x){
  const c=[76.18009172947146,-86.50532032941677,24.01409824083091,
           -1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  let y=x,tmp=x+5.5;tmp-=(x+.5)*Math.log(tmp);let ser=1.000000000190015;
  for(let j=0;j<6;j++) ser+=c[j]/++y;
  return -tmp+Math.log(2.5066282746310005*ser/x);
}
function gammp(a,x){                       /* regularised lower incomplete gamma */
  if(x<0||a<=0) return NaN;
  if(x<a+1){
    let ap=a,sum=1/a,del=sum;
    for(let n=0;n<400;n++){ap++;del*=x/ap;sum+=del;if(Math.abs(del)<Math.abs(sum)*1e-12)break;}
    return sum*Math.exp(-x+a*Math.log(x)-gammln(a));
  }
  let b=x+1-a,c=1e300,d=1/b,h=d;
  for(let i=1;i<400;i++){
    const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-300)d=1e-300;
    c=b+an/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;const del=d*c;h*=del;
    if(Math.abs(del-1)<1e-12)break;
  }
  return 1-Math.exp(-x+a*Math.log(x)-gammln(a))*h;
}
const chi2p=(x,n)=>n<=0?NaN:1-gammp(n/2,x/2);

/* ---------- A. data self-test ---------- */
const HARDQ=["Q","B","Le","Lm","Lt"];
function checkChannel(par,c){
  const r={cons:"na",thr:"na",note:null};
  if(c.oth||c.jets){r.note="incl";return r;}
  const L=[PT[par]],R=c.p.map(k=>PT[k]);
  let bad=[];
  for(const q of HARDQ){
    const d=R.reduce((s,p)=>s+p[q],0)-L[0][q];
    if(Math.abs(d)>1e-9) bad.push(q);
  }
  const fp=a=>a.filter(p=>Math.abs(p.J%1)>1e-9).length%2;
  if(fp(L)!==fp(R)) bad.push("J");
  r.cons=bad.length?"no":"ok";r.bad=bad;
  const M=L[0].m,Sm=R.reduce((s,p)=>s+p.m,0);
  r.thr=M>=Sm-1e-9?"ok":(c.off?"off":"no");
  r.margin=M-Sm;
  return r;
}
function validateData(){
  const rows=[],notes=[];let nFail=0,nWarn=0,nCh=0;
  for(const k of DKEYS){
    const D=DEC[k],S=chSum(k);let cons="ok",thr="ok",incl=0,off=0;
    D.ch.forEach(c=>{
      nCh++;

      if(r.note==="incl") incl++;
      if(r.cons==="no"){cons="no";notes.push(`${PT[k].sym} → ${chLabel(c)} — ${t("v_badq")}: ${r.bad.join(", ")}`);}
      if(r.thr==="no"){thr="no";notes.push(`${PT[k].sym} → ${chLabel(c)} — ${t("v_badthr")}`);}
      if(r.thr==="off") off++;
    });
    const dS=Math.abs(S-100);
    const st=(cons==="no"||thr==="no")?"no":(dS>0.5||off)?"wn":"ok";
    if(st==="no")nFail++;if(st==="wn")nWarn++;
    rows.push({k,n:D.ch.length,S,cons,thr,st,incl,off,dS});
  }
  $("#vData").innerHTML=rows.map(r=>`<tr>

    <td class="n" style="${r.dS>0.5?"color:var(--warn);font-weight:600":""}">${r.S.toFixed(3)}</td>
    <td><span class="pill ${r.cons==="ok"?"ok":"no"}">${t(r.cons==="ok"?"v_pass":"v_fail")}</span></td>
    <td><span class="pill ${r.thr==="ok"?"ok":"no"}">${t(r.thr==="ok"?"v_pass":"v_fail")}</span>${
      r.off?` <span class="pill wn">${t("v_off")} ${r.off}</span>`:""}</td>
    <td><span class="pill ${r.st}">${t(r.st==="ok"?"v_pass":r.st==="wn"?"v_note":"v_fail")}</span></td></tr>`).join("");
  $("#vDataNotes").innerHTML=(notes.length?notes.map(n=>`<p class="note">${n}</p>`).join(""):"")
    +`<p class="note">${t("v_sumnote")}</p><p class="note">${t("v_offnote")}</p>`;
  return {nFail,nWarn,nCh,nPart:DKEYS.length};

/* ---------- B. kinematics ---------- */
const PCM_REF=[               /* parent, products, p_cm quoted by PDG, MeV/c */
  ["La",["p","pi~"],101],["Sp",["p","pi0"],189],["Xm",["La","pi~"],139],
  ["Om",["La","K~"],211],["phi",["K","K~"],127],["pi",["mu~","num"],30],
  ["K",["mu~","num"],236],["Dpp",["p","pi"],227]
];
function validateKin(){
  const rows=PCM_REF.map(([k,pr,ref])=>{
    const th=pdk(PT[k].m,PT[pr[0]].m,PT[pr[1]].m);
    return {q:`p* : ${PT[k].sym} → ${pr.map(x=>PT[x].sym).join(" ")}`,
      th:th.toFixed(1),me:String(ref),d:(100*(th-ref)/ref),c:t("c_pcm")};
  });
  /* numerical closure of the phase-space generator on a five-body decay */
  const m=["pi~","pi","pi~","pi0","nut"].map(x=>PT[x].m),M=PT.tau.m;
  let dp=0,de=0;
  for(let i=0;i<3000;i++){
    const P=genbod(M,m);
    let E=0,x=0,y=0,z=0;
    for(const q of P){E+=q.E;x+=q.x;y+=q.y;z+=q.z;}
    dp=Math.max(dp,Math.hypot(x,y,z));de=Math.max(de,Math.abs(E-M));
  }
  rows.push({q:t("v_close")+" · Σp",th:dp.toExponential(1),me:"0",d:null,c:t("c_close")});
  rows.push({q:t("v_close")+" · ΣE − M",th:de.toExponential(1),me:"0",d:null,c:t("c_close")});
  $("#vKin").innerHTML=rows.map(r=>`<tr><td>${r.q}</td><td class="n">${r.th}</td>
    <td class="n">${r.me}</td><td class="n">${r.d==null
      ?'<span class="pill ok">'+t("v_pass")+"</span>"
      :`<span class="pill ${Math.abs(r.d)<1.5?"ok":Math.abs(r.d)<5?"wn":"no"}">${r.d>0?"+":""}${r.d.toFixed(2)} %</span>`}</td>
    <td class="note" style="margin:0">${r.c}</td></tr>`).join("");
  return rows.filter(r=>r.d!=null&&Math.abs(r.d)>5).length;
}

/* ---------- C. roulette statistics ---------- */
function validateStat(){
  const k=DS.cur,b=chBR(k),S=b.reduce((a,x)=>a+x,0),C=counts(k),N=totalSpins(k);

    </div>
    <p class="note">${t("v_chinote").replace("{d}",String(drop))}</p>`;
  return ok?0:1;
}

/* ---------- D. theory benchmarks ---------- */
function validateTheory(){
  const HB=6.582119569e-25;              /* GeV*s */
  const GF=1.1663788e-5, aEM=1/137.035999, PI=Math.PI;
  const mmu=PT.mu.m/1000, mtau=PT.tau.m/1000, mpi=PT.pi.m, mpi0=PT.pi0.m, me=PT.e.m;
  const R=[];
  /* 1. muon lifetime straight out of Fermi theory */
  const Gmu=GF*GF*Math.pow(mmu,5)/(192*PI**3), tmu=HB/Gmu;
  R.push({q:t("b_mu"),th:fmtT(tmu),me:fmtT(DEC.mu.tau),
    d:100*(tmu-DEC.mu.tau)/DEC.mu.tau,c:t("c_mu")});
  /* 2. tau lifetime by scaling the muon with the fifth power of the mass */
  const Be=DEC.tau.ch.find(c=>c.p&&c.p[0]==="e").b/100;
  const ttau=DEC.mu.tau*Be*Math.pow(mmu/mtau,5);
  R.push({q:t("b_tau"),th:fmtT(ttau),me:fmtT(DEC.tau.tau),
    d:100*(ttau-DEC.tau.tau)/DEC.tau.tau,c:t("c_tau")});
  /* 3. leptonic branching fraction from counting colours */
  const as=0.33,Bth=1/(2+3*(1+as/PI));
  R.push({q:t("b_taubr"),th:(100*Bth).toFixed(2)+" %",me:(100*Be).toFixed(2)+" %",
    d:100*(Bth-Be)/Be,c:t("c_taubr")});
  /* 4. pi0 -> gamma gamma from the chiral anomaly */
  const fpi=92.28, Gth=aEM*aEM*Math.pow(mpi0,3)/(64*PI**3*fpi*fpi);
  const Gexp=widthOf("pi0")*DEC.pi0.ch[0].b/100;
  R.push({q:t("b_pi0"),th:(Gth*1e6).toFixed(2)+" eV",me:(Gexp*1e6).toFixed(2)+" eV",
    d:100*(Gth-Gexp)/Gexp,c:t("c_pi0")});
  /* 5. helicity suppression of pi -> e nu */
  const rth=Math.pow(me/PT.mu.m,2)*Math.pow((mpi*mpi-me*me)/(mpi*mpi-PT.mu.m**2),2);
  const rex=DEC.pi.ch[1].b/DEC.pi.ch[0].b;
  R.push({q:t("b_pienu"),th:rth.toExponential(3),me:rex.toExponential(3),
    d:100*(rth-rex)/rex,c:t("c_pienu")});
  /* 6. number of light neutrino generations from the invisible Z width */
  const Ginv=widthOf("Z")*DEC.Z.ch.find(c=>c.inv).b/100, Gnu=167.16;
  R.push({q:t("b_znu"),th:(Ginv/Gnu).toFixed(3),me:"3",
    d:100*(Ginv/Gnu-3)/3,c:t("c_znu")});
  $("#vTheory").innerHTML=R.map(r=>`<tr><td>${r.q}</td><td class="n">${r.th}</td>
    <td class="n">${r.me}</td>
    <td class="n"><span class="pill ${Math.abs(r.d)<2?"ok":Math.abs(r.d)<8?"wn":"no"}">${
      r.d>0?"+":""}${r.d.toFixed(2)} %</span></td>
    <td class="note" style="margin:0">${r.c}</td></tr>`).join("");
  return R.filter(r=>Math.abs(r.d)>8).length;
}
/* the four summary boxes are framework result tiles now, so this hands the counts
   back instead of writing a summary block of its own.  The arithmetic is untouched. */
function renderValid(){
  const a=validateData(),b=validateKin(),c=validateStat(),d=validateTheory();
  return {nPart:a.nPart,nCh:a.nCh,fails:a.nFail+b+d,notes:a.nWarn};
}

/* ====================== the shell — diagram-ui.js v1 ======================= */
let ui=null,chartStage=null,tabsView=null,LASTA=null,VSUM=null,modeField=null,rangeField=null;
let BARE=false;

/* which section each panel belongs to; a panel outside the current section is
   switched off with a class, not with [hidden], because Panel.checkEmpty() owns
   the hidden flag and would put it back on the next sync() */
const SEC_OF={"dgu-examples":"react",particles:"react",kin:"react",analysis:"react",
  resetrow:"react",builder:"react",refmach:"react",
  dpick:"decay",dwheel:"decay",dchan:"decay",
  vabout:"valid",vdata:"valid",vkin:"valid",vstat:"valid",vtheory:"valid"};
const off=(node,hide)=>{if(node)node.classList.toggle("dgu-off",!!hide);};

function applySection(app){
  const sec=ST.sec||"react";
  (app.panels||[]).forEach(p=>{const s=SEC_OF[p.def.id];if(s)off(p.node,s!==sec);});
  if(chartStage)off(chartStage.node,sec!=="react"||!LASTA||!LASTA.ok||LASTA.decay);
  if(tabsView&&tabsView.value!==sec)tabsView.select(sec);
}

/* ---------- what the results region shows, per section ---------- */
function resultsFor(A,app){
  const sec=ST.sec||"react";
  if(sec==="decay"){
    const k=DS.cur,G=widthOf(k),L=lifeOf(k),ct=2.99792458e8*L;
    return {tiles:[
      {label:K("d_n"),value:String(totalSpins(k)),precision:0},
      tileOf(K("d_mass"),fmtE(PT[k].m/1000)),
      tileOf(K("d_life"),fmtT(L)),
      tileOf(K("d_width"),fmtE(G/1000),{headline:false}),
      tileOf("cτ",fmtL(ct),{headline:false})],
      notes:[K("d_gt")]};
  }
  if(sec==="valid"){
    const v=VSUM||{nPart:0,nCh:0,fails:0,notes:0};
    return {tiles:[
      {label:K("v_npart"),value:String(v.nPart)},
      {label:K("v_nch2"),value:String(v.nCh)},
      {label:K("v_fails"),value:String(v.fails),tone:v.fails?"bad":"ok"},
      {label:K("v_notes"),value:String(v.notes)}]};
  }
  /* the reaction section: null while nothing is built, so the framework shows
     learn.intro and the "build a reaction" line instead of a screenful of zeros */
  if(!A||!A.ok)return null;
  const show=ST.mode==="ref"||ST.shown;
  const tiles=[tileOf(K("sqrts"),fmtE(A.rs))];
  if(show){
    tiles.push(tileOf(K("sum_m"),fmtE(A.M)));
    if(!A.decay)tiles.push(tileOf(K("thr_fix"),fmtE(A.thr),{tone:A.enough?"ok":"bad"}));
  }
  if(!show)return {verdict:{tone:null,text:t("v_need")},tiles:tiles};
  const VT={ok:["ok","v_ok"],no:["bad","v_no"],thr:["warn","v_thr"],weak:["warn","v_weak"]};
  const [tone,tk]=VT[A.verdict];
  const nodes=[];
  if(A.verdict!=="no")nodes.push(mechNode(A));
  nodes.push(lawTableNode(A));
  return {verdict:{tone:tone,text:t(tk)},tiles:tiles,nodes:nodes,
    notes:[t("m_hint"),t("n_flav"),t("n_lep"),t("n_J")]};
}

/* ---------- repaint everything the tool draws itself ---------- */
function paintAll(A,app){
  LASTA=A;
  applySection(app);
  const sec=ST.sec||"react";
  if(sec==="react"){
    renderPool();renderEq();renderRef();
    const rb=$("#runBtn"),cb=$("#clearBtn");
    if(rb){rb.textContent=t("check");rb.disabled=!A.ok;off(rb,ST.mode!=="check");}
    if(cb)cb.textContent=t("clear");
    if(chartStage)chartStage.schedule();
  }else if(sec==="decay"){renderDecay();}
  else if(sec==="valid"){VSUM=renderValid();}
  /* the mode hint and the log-slider read-out are the two bits of a framework
     field whose text depends on the state rather than on the value */
  if(modeField&&modeField.node){
    const h=modeField.node.querySelector(".dgu-hint");
    if(h)h.textContent=t(ST.mode==="check"?"hint_check":"hint_ref");
  }
  if(rangeField&&rangeField.valNode)rangeField.valNode.textContent=fmtE(ST.T);
}

/* the beam controls are dead for a decay and before a reaction exists — the same
   test the old render() made, but read straight off the state so that it is right
   during sync(), which the framework runs before compute */
const noBeam=ctx=>{const s=ctx.state;return !(s.lhs.length&&s.rhs.length)||s.lhs.length===1;};

/* one entry point: sync the fields, recompute, repaint */
function render(){
  document.title=t("title");
  if(BARE){paintBare();return;}
  const app=(window.DiagramUI&&DiagramUI.current)||ui;
  if(!app){LASTA=analyse();return;}
  /* a permalink may carry a language: the shell has to follow it, exactly as the
     old applyI18n() followed ST.lang on every render */
  if(app.lang!==ST.lang&&TOOL_LANGS.indexOf(ST.lang)>=0){app.setLang(ST.lang);return;}
  app.sync();
  app.run();
}
const touch=()=>{ST.shown=false;render();};
function hpush(){const a=(window.DiagramUI&&DiagramUI.current)||ui;if(a&&a.history)a.history.push();}
function setT(v){ST.T=Math.max(0,v);touch();}

function doReset(){
  Object.assign(ST,JSON.parse(JSON.stringify(DEFAULTS)));
  render();
  const app=(window.DiagramUI&&DiagramUI.current)||ui;
  if(app)app.notify(app.t("reset"),{kind:"ok"});
}

/* =================== framework v2 (diagram-common.js) =================== */
function dgcPlain(k){   /* plain-text label; the overline markup is the only "anti" marker */
  const p=PT[k];if(!p)return k;
  const bar=/ovl/.test(p.sym);
  return (bar?'anti-':'')+p.sym.replace(/<[^>]+>/g,'');
}
function dgcSerialize(){
  return {v:1,lang:ST.lang,lhs:ST.lhs.slice(),rhs:ST.rhs.slice(),T:ST.T,geom:ST.geom,
          mode:ST.mode,sec:ST.sec,shown:ST.shown};
}
function dgcDeserialize(st){
  if(!st||typeof st!=='object'||!Array.isArray(st.lhs)||!Array.isArray(st.rhs))
    throw new Error('unrecognised state payload for this tool');
  const unknown=[...st.lhs,...st.rhs].filter(k=>!PT[k]);
  if(unknown.length)throw new Error('unknown particle key: '+unknown.join(', '));
  if(st.lhs.length>2)throw new Error('the left-hand side holds at most two particles');
  if(TOOL_LANGS.includes(st.lang))ST.lang=st.lang;
  ST.lhs=st.lhs.slice();ST.rhs=st.rhs.slice();
  ST.geom=st.geom==='col'?'col':'fix';
  ST.mode=st.mode==='ref'?'ref':'check';
  ST.sec=['react','decay','valid'].includes(st.sec)?st.sec:'react';
  setT(Number.isFinite(+st.T)?+st.T:10);   // setT() clears the "shown" flag, so restore it after
  ST.shown=!!st.shown;
  render();
}
function dgcRecord(){
  const A=analyse();
  if(!A.ok)return null;
  const eq=ST.lhs.map(dgcPlain).join(' + ')+' -> '+ST.rhs.map(dgcPlain).join(' + ');
  const LAW={l_Q:'electric charge Q',l_B:'baryon number B',l_Le:'electron number Le',
    l_Lm:'muon number Lmu',l_Lt:'tau number Ltau',l_S:'strangeness S',l_C:'charm C',
    l_Bt:'bottomness B~',l_J:'half-integrality of J',l_E:'energy'};
  const outputs={reaction:eq,verdict:{ok:'allowed by every selection rule tested',
      weak:'allowed only through the weak interaction (a flavour quantum number changes)',
      thr:'below threshold: the available energy cannot make the products',
      no:'forbidden: a conservation law is broken'}[A.verdict],
    sqrt_s_GeV:A.rs,sum_product_masses_GeV:A.M};
  const units={reaction:'',verdict:'',sqrt_s_GeV:'GeV',sum_product_masses_GeV:'GeV'};
  if(!A.decay){outputs.beam_kinetic_energy_GeV=ST.T;units.beam_kinetic_energy_GeV='GeV';
    outputs.threshold_beam_energy_GeV=A.thr;units.threshold_beam_energy_GeV='GeV';}
  // the quantum-number sums are reported as numbers, not as the formatted cell strings,
  // so that the exported python can be compared with them value by value
  const all=[...ST.lhs,...ST.rhs],sum=(a,q)=>a.reduce((z,k)=>z+PT[k][q],0);
  const carries=q=>all.some(k=>Math.abs(PT[k][q])>1e-9),noS=all.some(k=>PT[k].noS);
  const put=(q,key)=>{const i=sum(ST.lhs,q),o=sum(ST.rhs,q),n=LAW[key];
    outputs['in · '+n]=i;outputs['out · '+n]=o;units['in · '+n]='';units['out · '+n]='';};
  for(const [q,key] of [['Q','l_Q'],['B','l_B'],['Le','l_Le'],['Lm','l_Lm'],['Lt','l_Lt']])
    if(q==='Q'||q==='B'||carries(q)||Math.abs(sum(ST.lhs,q)-sum(ST.rhs,q))>1e-9)put(q,key);
  for(const [q,key] of [['S','l_S'],['C','l_C'],['Bt','l_Bt']]){
    if(q==='S'&&noS)continue;
    if(carries(q)||Math.abs(sum(ST.lhs,q)-sum(ST.rhs,q))>1e-9)put(q,key);
  }
  const fp=a=>a.filter(k=>Math.abs(PT[k].J%1)>1e-9).length%2;
  outputs['in · '+LAW.l_J]=fp(ST.lhs)?'half':'integer';
  outputs['out · '+LAW.l_J]=fp(ST.rhs)?'half':'integer';
  units['in · '+LAW.l_J]='';units['out · '+LAW.l_J]='';
  const warn=[];
  for(const r of A.rows){
    if(r.st==='bad')warn.push((LAW[r.key]||r.key)+' is not conserved'+(r.key==='l_E'?' — the reaction is below threshold':''));
    if(r.st==='weak')warn.push((LAW[r.key]||r.key)+' changes: only the weak interaction can do this');
    if(r.st==='warn')warn.push((LAW[r.key]||r.key)+' changes by more than one unit: forbidden at first order in the weak interaction');
    if(r.st==='na')warn.push('strangeness is not defined for a CP eigenstate (K0S/K0L), so it is not tested');
  }
  if([...ST.lhs,...ST.rhs].some(k=>PT[k].grp==='qrk'))
    warn.push('free quarks are selectable for bookkeeping only; their current-quark masses make any quark-level threshold meaningless');
  return {
    inputs:{left_hand_side:ST.lhs.map(dgcPlain).join(' + '),right_hand_side:ST.rhs.map(dgcPlain).join(' + '),
      geometry:A.decay?'decay at rest':(ST.geom==='col'?'collider, equal momenta head-on':'fixed target'),
      beam_kinetic_energy_GeV:A.decay?null:ST.T},
    outputs,units,
    model:{equations:[
      'Additive conservation: for each of Q, B, Le, Lmu, Ltau the sum over the initial particles must equal the sum over the final particles; an antiparticle carries the negated quantum numbers.',
      'Flavour: S, C and B~ are conserved by the strong and electromagnetic interactions and may change by one unit in a first-order weak process; |Delta S| = 2 is flagged separately.',
      'Angular momentum is tested only through the parity of the fermion count, because orbital angular momentum is always integral: half-integral total J on one side requires half-integral total J on the other.',
      'Fixed target: s = m1^2 + m2^2 + 2 E1 m2 with E1 = T + m1; threshold beam energy E1 = (M^2 - m1^2 - m2^2)/(2 m2), M = sum of product masses.',
      'Collider (equal momenta, head-on): sqrt(s) = E1 + E2, so the momenta cancel.',
      'Decay: sqrt(s) is the parent mass; the decay is energetically possible when the parent mass is at least the sum of the product masses.'],
     ranges:[
      'Selection rules only: an "allowed" verdict says nothing about the rate. No cross-section, matrix element or luminosity is computed.',
      'Parity, C, G, isospin and CP are not tested; angular momentum is tested only as the parity of the fermion count.',
      'Neutrinos are treated as exactly massless and quarks as free particles at their current-quark masses.',
      'Masses are the Particle Data Group 2025 summary-table values; strangeness is undefined for the K0S/K0L CP eigenstates.'],
     notes:['Interaction channels not excluded by the selection rules: '+
       [A.mech.str?'strong':null,A.mech.em?'electromagnetic':null,A.mech.wk?'weak':null].filter(Boolean).join(', ')]},
    warnings:warn
  };
}
function dgcSections(){
  const A=analyse();if(!A.ok)return [];
  const LAW={l_Q:'Q',l_B:'B',l_Le:'Le',l_Lm:'Lmu',l_Lt:'Ltau',l_S:'S',l_C:'C',l_Bt:'B~',l_J:'J parity',l_E:'energy'};
  const MK={ok:'conserved',bad:'BROKEN',weak:'changes (weak only)',warn:'changes by >1 unit',na:'not defined'};
  return [{title:'Conservation laws',cols:'1.4fr 1fr 1fr 1.6fr',head:['quantity','initial','final','result'],
    rows:A.rows.map(r=>[LAW[r.key]||r.key,String(r.i),String(r.o),MK[r.st]||r.st])}];
}
function dgcPython(){
  const A=analyse();if(!A.ok)return null;
  const tbl={};
  for(const k of [...new Set([...ST.lhs,...ST.rhs])]){
    const p=PT[k];
    tbl[k]={name:dgcPlain(k),m_MeV:p.m,J:p.J,Q:p.Q,B:p.B,Le:p.Le,Lm:p.Lm,Lt:p.Lt,
            S:p.noS?null:p.S,C:p.C,Bt:p.Bt};
  }
  const disp={verdict:A.verdict,sqrt_s:A.rs,sum_m:A.M,thr:A.decay?null:A.thr,
    rows:A.rows.filter(r=>r.key!=='l_E').map(r=>[r.key,r.st])};
  return {code:RB_PY_SRC({TBL:tbl,LHS:ST.lhs,RHS:ST.rhs,T:ST.T,GEOM:A.decay?'decay':ST.geom,DISP:disp}),
    requires:[],
    scope:'the full conservation-law analysis and the kinematics of the reaction shown at export time: the additive quantum numbers, the flavour changes, the fermion-count parity, sqrt(s), the sum of product masses and the threshold beam energy. The decay roulette, the phase-space event generator and the reference-machine chart are not exported',
    selftest:{tolerance:1e-12,note:'pure bookkeeping and closed-form kinematics, so the script must reproduce the page bit for bit apart from floating-point summation order'}};
}
function RB_PY_SRC(D){
 const J=JSON.stringify(JSON.stringify({table:D.TBL,lhs:D.LHS,rhs:D.RHS,T:D.T,geom:D.GEOM,displayed:D.DISP},null,1));
 return `import json
import math

_M = json.loads(${J})

TABLE    = _M["table"]     # the PDG entries used by this reaction (masses in MeV)
LHS      = _M["lhs"]
RHS      = _M["rhs"]
BEAM_T   = _M["T"]         # beam kinetic energy, GeV (ignored for a decay)
GEOMETRY = _M["geom"]      # "fix" | "col" | "decay"
DISPLAYED= _M["displayed"] # what the page showed at export time

ADDITIVE = ["Q", "B", "Le", "Lm", "Lt"]     # exactly conserved
FLAVOUR  = ["S", "C", "Bt"]                 # may change by one unit in a weak process


def totals(keys, q):
    """Sum of quantum number q over a list of table keys; None marks 'not defined'."""
    out = 0.0
    for k in keys:
        v = TABLE[k][q]
        if v is None:
            return None
        out += v
    return out


def fermion_parity(keys):
    """Orbital angular momentum is integral, so only the parity of the number of
    half-integral-spin particles can be tested."""
    return sum(1 for k in keys if abs(TABLE[k]["J"] % 1) > 1e-9) % 2


def sqrt_s():
    m1 = TABLE[LHS[0]]["m_MeV"] / 1000.0
    if GEOMETRY == "decay":
        return m1
    m2 = TABLE[LHS[1]]["m_MeV"] / 1000.0
    E1 = BEAM_T + m1
    if GEOMETRY == "col":                     # head-on, equal momenta
        p = math.sqrt(max(0.0, E1 * E1 - m1 * m1))
        return E1 + math.sqrt(p * p + m2 * m2)
    return math.sqrt(m1 * m1 + m2 * m2 + 2.0 * E1 * m2)   # fixed target


def threshold_beam_energy():
    """Beam kinetic energy at which sqrt(s) first reaches the sum of product masses."""
    if GEOMETRY == "decay":
        return None
    m1 = TABLE[LHS[0]]["m_MeV"] / 1000.0
    m2 = TABLE[LHS[1]]["m_MeV"] / 1000.0
    M = sum(TABLE[k]["m_MeV"] for k in RHS) / 1000.0
    if M <= m1 + m2:
        return 0.0
    if GEOMETRY == "fix":
        return max(0.0, (M * M - m1 * m1 - m2 * m2) / (2.0 * m2) - m1)
    lo, hi = 0.0, 1.0
    def rs(T):
        E1 = T + m1
        p = math.sqrt(max(0.0, E1 * E1 - m1 * m1))
        return E1 + math.sqrt(p * p + m2 * m2)
    while rs(hi) < M and hi < 1e12:
        hi *= 2
    for _ in range(200):
        mid = (lo + hi) / 2
        if rs(mid) < M:
            lo = mid
        else:
            hi = mid
    return (lo + hi) / 2


def analyse():
    """Verdict from the selection rules, exactly as the page states them."""
    rows, broken, weak, warn = {}, [], [], []
    for q in ADDITIVE:
        i, o = totals(LHS, q), totals(RHS, q)
        rows["l_" + q if q != "Q" else "l_Q"] = (i, o)
        if abs(i - o) > 1e-9:
            broken.append(q)
    for q in FLAVOUR:
        i, o = totals(LHS, q), totals(RHS, q)
        if i is None or o is None:            # strangeness of a K0S/K0L is not defined
            continue
        d = o - i
        if abs(d) > 1e-9:
            (warn if (q == "S" and abs(d) > 1) else weak).append(q)
    if fermion_parity(LHS) != fermion_parity(RHS):
        broken.append("J")
    rs = sqrt_s()
    M = sum(TABLE[k]["m_MeV"] for k in RHS) / 1000.0
    enough = rs >= M - 1e-9
    verdict = ("no" if broken else "thr" if not enough else "weak" if (weak or warn) else "ok")
    return dict(verdict=verdict, broken=broken, weak=weak, warn=warn,
                sqrt_s_GeV=rs, sum_product_masses_GeV=M, threshold_GeV=threshold_beam_energy())


def compute():
    a = analyse()
    out = {"reaction": " + ".join(TABLE[k]["name"] for k in LHS) + " -> " +
                       " + ".join(TABLE[k]["name"] for k in RHS),
           "verdict": {"ok": "allowed by every selection rule tested",
                       "weak": "allowed only through the weak interaction (a flavour quantum number changes)",
                       "thr": "below threshold: the available energy cannot make the products",
                       "no": "forbidden: a conservation law is broken"}[a["verdict"]],
           "sqrt_s_GeV": a["sqrt_s_GeV"],
           "sum_product_masses_GeV": a["sum_product_masses_GeV"]}
    if GEOMETRY != "decay":
        out["beam_kinetic_energy_GeV"] = BEAM_T
        out["threshold_beam_energy_GeV"] = a["threshold_GeV"]
    names = {"Q": "electric charge Q", "B": "baryon number B", "Le": "electron number Le",
             "Lm": "muon number Lmu", "Lt": "tau number Ltau", "S": "strangeness S",
             "C": "charm C", "Bt": "bottomness B~", "J": "half-integrality of J"}
    carries = lambda q: any(abs(TABLE[k][q] or 0) > 1e-9 for k in LHS + RHS)
    for q in ADDITIVE + FLAVOUR:
        i, o = totals(LHS, q), totals(RHS, q)
        if i is None or o is None:          # not defined for this reaction (K0S/K0L)
            continue
        shown = (q in ("Q", "B")) or carries(q) or abs(o - i) > 1e-9
        if shown:
            out["in \\u00b7 " + names[q]] = i
            out["out \\u00b7 " + names[q]] = o
    out["in \\u00b7 half-integrality of J"] = "half" if fermion_parity(LHS) else "integer"
    out["out \\u00b7 half-integrality of J"] = "half" if fermion_parity(RHS) else "integer"
    return out


def check_against_page():
    """The verdict and the laws the page marked must come out the same here."""
    a = analyse()
    assert a["verdict"] == DISPLAYED["verdict"], (a["verdict"], DISPLAYED["verdict"])
    assert abs(a["sqrt_s_GeV"] - DISPLAYED["sqrt_s"]) <= 1e-12 * max(1.0, abs(DISPLAYED["sqrt_s"]))
    assert abs(a["sum_product_masses_GeV"] - DISPLAYED["sum_m"]) <= 1e-12 * max(1.0, abs(DISPLAYED["sum_m"]))
    if DISPLAYED["thr"] is not None and a["threshold_GeV"] is not None:
        assert abs(a["threshold_GeV"] - DISPLAYED["thr"]) <= 1e-9 * max(1.0, abs(DISPLAYED["thr"]))
    return True
`;
}
function dgcInit(){
  if(!window.Diagram)return;
  window.Diagram.init({
    id:'reactionbuilder',file:'reactionbuilder.html',
    state:{serialize:dgcSerialize,deserialize:dgcDeserialize},
    record:dgcRecord,
    python:dgcPython,
    handoff:{provides:[],accepts:[]},
    report:{sections:dgcSections}
  });
}

    DS.cur=b.dataset.k;DS.last=null;DS.ev=null;DS.rot=0;render();};
  $("#spin1").onclick=()=>doSpin(1);
  $("#spin100").onclick=()=>doSpin(100);
  $("#spin1e4").onclick=()=>doSpin(10000);
  $("#spinReset").onclick=()=>{DS.counts[DS.cur]=null;DS.last=null;DS.ev=null;renderDecay();};
  $("#bEx").innerHTML=EXAMPLES.map((x,i)=>`<button type="button" data-x="${i}">${t(x.k)}</button>`).join("");
  render();
}

function paintBare(){
  const A=analyse();LASTA=A;
  const sec=ST.sec||"react";
  ["react","decay","valid"].forEach(x=>{
    const n=$("#b"+x[0].toUpperCase()+x.slice(1));if(n)n.hidden=(x!==sec);});
  document.querySelectorAll("#bnav button").forEach(b=>
    b.setAttribute("aria-pressed",String(b.dataset.sec===sec)));
  $("#bTab").value=ST.tab;$("#bAnti").checked=ST.anti;
  $("#bGeom").value=ST.geom;$("#bMode").value=ST.mode;
  if(document.activeElement!==$("#eIn"))$("#eIn").value=+ST.T.toFixed(4);
  $("#eRange").value=Math.log10(Math.max(ST.T,0.01));
  const dis=!A.ok||A.decay;$("#eIn").disabled=dis;$("#eRange").disabled=dis;
  $("#runBtn").hidden=(ST.mode!=="check");$("#runBtn").disabled=!A.ok;
  if(sec==="react"){
    renderPool();renderEq();renderRef();
    const chart=$("#bChart");
    chart.hidden=!(A.ok&&!A.decay);
    if(!chart.hidden)drawChart({w:660,h:280,density:innerWidth<768?"coarse":"fine"},
      {body:chart.querySelector(".dgu-stage-body"),node:chart});
    const r=resultsFor(A,null),host=$("#bRes");
    if(!r){host.textContent=t("v_idle");}
    else{
      host.innerHTML=(r.verdict?`<p class="dgu-verdict ${r.verdict.tone||""}">${r.verdict.text}</p>`:"")
        +'<div class="dgu-tiles">'+r.tiles.map(x=>stat(DiagramUI_pick(x.label),x.value+(x.hint?" "+x.hint:""),x.tone)).join("")+"</div>";
      (r.nodes||[]).forEach(n=>host.appendChild(n));
    }
  }else if(sec==="decay"){
    renderDecay();
    const r=resultsFor(A,null);
    $("#bDInfo").innerHTML=r.tiles.map(x=>stat(DiagramUI_pick(x.label),x.value+(x.hint?" "+x.hint:""))).join("");
  }else{
    VSUM=renderValid();
    const r=resultsFor(A,null);
    $("#bVSum").innerHTML=r.tiles.map(x=>stat(DiagramUI_pick(x.label),x.value,x.tone==="bad"?"no":x.tone)).join("");
  }
}
/* the label helper diagram-ui.js would normally provide */
function DiagramUI_pick(v){return typeof v==="string"?v:(v&&(v[ST.lang]||v.en))||"";}

/* ---------------------------------------------------------------- boot ----
   The shell is built first and Diagram.init() is called unconditionally right
   after it, before anything else; this page has no data file to wait for. */
function boot(){
  if(!window.DiagramUI||DiagramUI.api!=="tools.petrov.re/ui/v1")bootBare();
  else buildApp();
  dgcInit();          /* the data layer never depends on the interface layer */
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
else boot();

</script>
