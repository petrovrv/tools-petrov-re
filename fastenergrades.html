  "description": {
    "en": "A browsable reference for the property classes used to specify bolts and screws: the ISO 898-1 classes from 4.6 to 12.9, the ISO 3506-1 austenitic stainless classes A2 and A4, and the SAE J429 grades used with inch threads. Each entry carries minimum tensile strength, yield or 0,2 % proof strength, proof-load stress, elongation, hardness, head marking, typical use and the temperature and corrosion caveats that decide whether the class is the right one. Choosing a thread size turns those stresses into loads. Filter by standard, by minimum yield strength or by a text search; the answer is the entry you select.",
    "uk": "Довідник класів міцності для болтів і гвинтів: класи ISO 898-1 від 4.6 до 12.9, аустенітні неіржавні класи A2 і A4 за ISO 3506-1 та класи SAE J429 для дюймової різьби. Кожен запис містить мінімальну межу міцності, межу текучості (або умовну 0,2 %), напруження пробного навантаження, видовження, твердість, маркування головки, типове застосування та застереження щодо температури й корозії. Вибір розміру різьби перетворює напруження на зусилля. Фільтруйте за стандартом, за мінімальною межею текучості або пошуком; відповідь — обраний запис.",
    "de": "Ein durchsuchbares Nachschlagewerk der Festigkeitsklassen für Schrauben: die Klassen 4.6 bis 12.9 nach ISO 898-1, die austenitischen nichtrostenden Klassen A2 und A4 nach ISO 3506-1 und die Klassen nach SAE J429 für Zollgewinde. Jeder Eintrag nennt Mindestzugfestigkeit, Streckgrenze bzw. 0,2-%-Dehngrenze, Prüfspannung, Bruchdehnung, Härte, Kopfmarkierung, typische Verwendung sowie die Temperatur- und Korrosionsvorbehalte. Die Wahl einer Gewindegröße macht aus den Spannungen Kräfte. Filtern Sie nach Norm, nach Mindeststreckgrenze oder per Textsuche; die Antwort ist der gewählte Eintrag.",
    "nl": "Een doorzoekbaar naslagwerk van sterkteklassen voor bouten en schroeven: de klassen 4.6 tot 12.9 uit ISO 898-1, de austenitisch roestvaste klassen A2 en A4 uit ISO 3506-1 en de klassen uit SAE J429 voor inchdraad. Elk item geeft minimale treksterkte, rekgrens of 0,2 %-rekgrens, proefspanning, breukrek, hardheid, kopmarkering, typisch gebruik en de temperatuur- en corrosievoorbehouden. Met een draadmaat worden de spanningen krachten. Filter op norm, op minimale rekgrens of met een zoekterm; het antwoord is het gekozen item.",
    "fr": "Un répertoire consultable des classes de qualité des boulons et vis : les classes 4.6 à 12.9 de l'ISO 898-1, les classes inoxydables austénitiques A2 et A4 de l'ISO 3506-1 et les classes SAE J429 pour filetages en pouces. Chaque fiche donne la résistance minimale à la traction, la limite d'élasticité ou la limite conventionnelle à 0,2 %, la contrainte d'épreuve, l'allongement, la dureté, le marquage de tête, l'emploi typique et les réserves de température et de corrosion. Le choix d'un filetage transforme ces contraintes en efforts. Filtrez par norme, par limite d'élasticité minimale ou par recherche ; la réponse est la fiche choisie.",
    "es": "Un catálogo consultable de las clases de resistencia de tornillos: las clases 4.6 a 12.9 de ISO 898-1, las clases inoxidables austeníticas A2 y A4 de ISO 3506-1 y las clases SAE J429 para roscas en pulgadas. Cada ficha indica resistencia mínima a tracción, límite elástico o límite convencional al 0,2 %, tensión de prueba, alargamiento, dureza, marcado de la cabeza, uso típico y las reservas de temperatura y corrosión. Elegir una rosca convierte esas tensiones en fuerzas. Filtre por norma, por límite elástico mínimo o por búsqueda; la respuesta es la ficha elegida."
  ,"pl":"Przeglądarkowy zbiór klas własności mechanicznych stosowanych do określania śrub i wkrętów: klasy ISO 898-1 od 4.6 do 12.9, austenityczne klasy nierdzewne A2 i A4 według ISO 3506-1 oraz klasy SAE J429 stosowane z gwintami calowymi. Każdy wpis zawiera minimalną wytrzymałość na rozciąganie, granicę plastyczności lub umowną granicę plastyczności 0,2 %, naprężenie próbne, wydłużenie, twardość, oznaczenie na łbie, typowe zastosowanie oraz zastrzeżenia dotyczące temperatury i korozji, które decydują, czy dana klasa jest właściwa. Wybór rozmiaru gwintu przelicza te naprężenia na siły. Filtruj według normy, minimalnej granicy plastyczności lub wyszukiwania tekstowego; odpowiedzią jest wybrany wpis."},

  "limitations": {
    "en": "The strength values are the minima the standards specify for the class, transcribed from published summaries of ISO 898-1:2013, ISO 3506-1:2020 and SAE J429 — they have not been read back from the standards themselves, and no lot certificate is implied. Loads are the stress multiplied by the nominal stress area of the thread: they take no account of preload, tightening method, friction, coatings, fatigue, shear, embedding, thread engagement, elevated temperature or the strength of the mating part. The head-marking drawing is schematic. Nothing here replaces the standard or a joint calculation.",
    "uk": "Наведені значення міцності — це мінімуми, які стандарт задає для класу; вони переписані з опублікованих зведень ISO 898-1:2013, ISO 3506-1:2020 і SAE J429, а не звірені з самими стандартами, і не є сертифікатом партії. Зусилля — це напруження, помножене на номінальну площу перерізу різьби: вони не враховують попереднє затягування, спосіб затягування, тертя, покриття, втому, зріз, осідання, довжину згвинчування, підвищену температуру та міцність спряженої деталі. Рисунок маркування схематичний. Це не замінює стандарт і не є розрахунком з'єднання.",
    "de": "Die Festigkeitswerte sind die Mindestwerte, die die Norm für die Klasse festlegt; sie sind aus veröffentlichten Zusammenfassungen von ISO 898-1:2013, ISO 3506-1:2020 und SAE J429 übernommen, nicht an den Normen selbst geprüft, und ersetzen kein Abnahmezeugnis. Die Kräfte sind Spannung mal Spannungsquerschnitt des Gewindes: Vorspannung, Anziehverfahren, Reibung, Beschichtung, Ermüdung, Abscherung, Setzen, Einschraubtiefe, erhöhte Temperatur und die Festigkeit des Gegenstücks bleiben unberücksichtigt. Die Markierungszeichnung ist schematisch. Nichts hiervon ersetzt die Norm oder eine Verbindungsberechnung.",
    "nl": "De sterktewaarden zijn de minima die de norm voor de klasse vastlegt, overgenomen uit gepubliceerde samenvattingen van ISO 898-1:2013, ISO 3506-1:2020 en SAE J429 — niet teruggelezen uit de normen zelf, en geen partijcertificaat. Krachten zijn de spanning maal de nominale spanningsdoorsnede van de draad: voorspanning, aanhaalmethode, wrijving, coatings, vermoeiing, afschuiving, zetting, indraaidiepte, verhoogde temperatuur en de sterkte van het tegenstuk blijven buiten beschouwing. De markeringstekening is schematisch. Niets hiervan vervangt de norm of een verbindingsberekening.",
    "fr": "Les valeurs de résistance sont les minima que la norme fixe pour la classe, transcrits de résumés publiés de l'ISO 898-1:2013, de l'ISO 3506-1:2020 et de la SAE J429 — ils n'ont pas été relus dans les normes elles-mêmes et ne valent pas certificat de lot. Les efforts sont la contrainte multipliée par la section résistante nominale du filetage : ils ignorent la précharge, la méthode de serrage, le frottement, les revêtements, la fatigue, le cisaillement, le tassement, la longueur d'implantation, la température élevée et la résistance de la pièce en regard. Le dessin de marquage est schématique. Rien ici ne remplace la norme ni un calcul d'assemblage.",
    "es": "Los valores de resistencia son los mínimos que la norma fija para la clase, transcritos de resúmenes publicados de ISO 898-1:2013, ISO 3506-1:2020 y SAE J429 — no se han contrastado con las normas mismas ni equivalen a un certificado de lote. Las fuerzas son la tensión multiplicada por la sección resistente nominal de la rosca: no tienen en cuenta el apriete previo, el método de apriete, el rozamiento, los recubrimientos, la fatiga, el cortante, el asentamiento, la longitud de enroscado, la temperatura elevada ni la resistencia de la pieza contraria. El dibujo del marcado es esquemático. Nada de esto sustituye a la norma ni a un cálculo de unión."
  ,"pl":"Wartości wytrzymałości to minima określone przez normy dla danej klasy, przepisane z opublikowanych zestawień ISO 898-1:2013, ISO 3506-1:2020 i SAE J429 — nie zostały zweryfikowane bezpośrednio wobec samych norm i nie stanowią świadectwa partii. Siły to naprężenie pomnożone przez nominalny przekrój czynny gwintu: nie uwzględniają wstępnego naprężenia, metody dokręcania, tarcia, powłok, zmęczenia, ścinania, osiadania, głębokości wkręcenia, podwyższonej temperatury ani wytrzymałości elementu współpracującego. Rysunek oznaczenia na łbie jest schematyczny. Nic tutaj nie zastępuje normy ani obliczenia połączenia."},

      "uk": "Новий інструмент, створений 21.08.2026, без жодного бенчмарку. Його зміст — переписані довідкові дані, а не розрахунок: значення класів узяті з опублікованих зведень ISO 898-1:2013, ISO 3506-1:2020 та SAE J429 і не звірені ні зі стандартами, ні з незалежною реалізацією. Єдина арифметика — напруження × номінальна площа перерізу — перевіряється самотестом експорту Python відносно сторінки, що є перевіркою узгодженості, а не валідацією. Перевіряйте кожне значення за стандартом.",
      "de": "Neues Werkzeug, geschrieben am 21.08.2026, nie einem Benchmark unterzogen. Sein Inhalt ist übernommene Tabellendaten, keine Berechnung: die Klassenwerte stammen aus veröffentlichten Zusammenfassungen von ISO 898-1:2013, ISO 3506-1:2020 und SAE J429 und wurden weder mit den Normen noch mit einer unabhängigen Implementierung verglichen. Die einzige Arithmetik — Spannung × Spannungsquerschnitt — prüft der Selbsttest des Python-Exports gegen die Seite; das ist eine Konsistenzprüfung, keine Validierung. Prüfen Sie jeden Wert in der Norm nach.",
      "nl": "Nieuwe tool, geschreven op 21-08-2026, nooit gebenchmarkt. De inhoud is overgenomen tabelmateriaal, geen berekening: de klassewaarden komen uit gepubliceerde samenvattingen van ISO 898-1:2013, ISO 3506-1:2020 en SAE J429 en zijn niet vergeleken met de normen of met een onafhankelijke implementatie. De enige rekenkunde — spanning × spanningsdoorsnede — controleert de zelftest van de Python-export tegen de pagina; dat is een consistentiecontrole, geen validatie. Controleer elke waarde in de norm.",

    isoQT:  T('Quenched and tempered at 425 °C minimum. ISO 898-1 states the properties for service between −50 °C and +150 °C; above roughly 250–300 °C expect preload relaxation and creep.',

              'Templado y revenido a 425 °C como mínimo. ISO 898-1 indica las propiedades para −50 °C a +150 °C; por encima de unos 250–300 °C cabe esperar relajación y fluencia.','Hartowane i odpuszczane w temperaturze co najmniej 425 °C. Norma ISO 898-1 podaje własności dla zakresu od −50 °C do +150 °C; powyżej około 250–300 °C należy się spodziewać relaksu wstępnego naprężenia i pełzania.'),

    a2:     T('The ISO 3506 values are room-temperature values. The A2 group keeps useful strength to roughly 300–400 °C but creeps; between about 450 °C and 850 °C it sensitises unless it is stabilised or low-carbon. It stays tough down to cryogenic temperature.',

              'Les valeurs de l’ISO 3506 sont à température ambiante. Le groupe A2 conserve une résistance utile jusqu’à environ 300–400 °C mais flue ; entre 450 °C et 850 °C il se sensibilise s’il n’est ni stabilisé ni à bas carbone. Il reste tenace jusqu’aux températures cryogéniques.',
              'Los valores de ISO 3506 son a temperatura ambiente. El grupo A2 conserva resistencia útil hasta unos 300–400 °C pero fluye; entre 450 °C y 850 °C se sensibiliza salvo que sea estabilizado o de bajo carbono. Mantiene tenacidad hasta temperaturas criogénicas.','Wartości ISO 3506 dotyczą temperatury pokojowej. Grupa A2 zachowuje użyteczną wytrzymałość do około 300–400 °C, lecz pełznie; w zakresie od około 450 °C do 850 °C ulega uczuleniu (sensybilizacji), o ile nie jest stabilizowana lub niskowęglowa. Pozostaje ciągliwa aż do temperatur kriogenicznych.'),
    a4:     T('The ISO 3506 values are room-temperature values. The A4 group behaves like A2 with somewhat better hot strength thanks to the molybdenum; it creeps above roughly 300 °C and sensitises in the same 450–850 °C window unless low-carbon or stabilised.',

              'Die ISO-3506-Werte gelten bei Raumtemperatur. Die Gruppe A4 verhält sich wie A2, dank Molybdän mit etwas besserer Warmfestigkeit; oberhalb von etwa 300 °C kriecht sie und sensibilisiert im selben Fenster 450–850 °C, sofern nicht niedriggekohlt oder stabilisiert.',

    saeQT:  T('SAE J429 quotes room-temperature values. These grades are quenched and tempered; above roughly 250–300 °C the preload relaxes and the grade no longer describes the part.',

    he:    T('Hard enough for hydrogen embrittlement to matter: acid pickling and electroplating can charge the steel with hydrogen and it can fail hours or days after tightening. Bake after plating, or use a non-electrolytic zinc flake coating; keep it out of cathodic protection, and do not hot-dip galvanize it.',

  function catalogueTable(s) {
    var chosen = last.entry;
    btnById = {};
    return {
      title: T('Every class that matches', 'Усі класи, що відповідають фільтрам', 'Alle passenden Klassen', 'Alle passende klassen', 'Toutes les classes correspondantes', 'Todas las clases que coinciden','Wszystkie pasujące klasy'),
      sticky: true,
      head: [CLASS_HEAD, STD_HEAD, SIZE_HEAD, { label: TENS_HEAD, num: true },
             { label: YIELD_HEAD, num: true }, { label: FORCE_HEAD, num: true }],
      rows: last.hits.map(function (e) {
        var z = last.size;
        var ok = z && e.series === z.series;
        return {
          chosen: chosen === e,
          dim: !ok,
          cells: [
            { node: rowButton(e, chosen === e) },
            e.std,
            rangeOf(e),
            { value: e.rm / 1e6, precision: 0 },
            { value: e.rp / 1e6, precision: 0 },
            { value: z ? e.rp * z.as / 1e3 : null, precision: 1 }
          ]
        };
      })
    };
  }

      'Zugfestigkeit Rm und Streckgrenze in MPa; die Kraft ist die Streckgrenze mal Spannungsquerschnitt von ' + s.size + ', in kN.',
      'Treksterkte Rm en rekgrens in MPa; de kracht is de rekgrens maal de spanningsdoorsnede van ' + s.size + ', in kN.',
      'Résistance Rm et limite d’élasticité en MPa ; l’effort est cette limite multipliée par la section résistante de ' + s.size + ', en kN.',

    if (last.hits.some(function (e) { return last.size && e.series !== last.size.series; })) notes.push(
      T('Dimmed rows are written for the other thread series: ' + s.size + ' is a '
        + (last.size && last.size.series === 'metric' ? 'metric' : 'unified inch') + ' size.',
        'Приглушені рядки написані для іншого різьбового ряду: ' + s.size + ' — це '

        'Gedimde rijen gelden voor de andere draadreeks: ' + s.size + ' is een '

        'Les lignes atténuées visent l’autre série de filetage : ' + s.size + ' est une taille '
        + (last.size && last.size.series === 'metric' ? 'métrique' : 'en pouces') + '.',
        'Las filas atenuadas son de la otra serie de rosca: ' + s.size + ' es una medida '
        + (last.size && last.size.series === 'metric' ? 'métrica' : 'en pulgadas') + '.','Przyciemnione wiersze dotyczą innego szeregu gwintów: ' + s.size + ' to '
        + (last.size && last.size.series === 'metric' ? 'rozmiar metryczny' : 'rozmiar calowy') + '.'));
    return { filter: f, entry: entryCard(s), tables: [catalogueTable(s)], notes: notes };
  }

    host.appendChild(h);

            body: T('In ISO 898-1 the pair reads directly: 8.8 means a nominal tensile strength of 800 MPa (the first number × 100) and a yield at 80 % of it (the two numbers multiplied × 10). It is a statement about minimum strength, not about a material or a heat treatment.',

                    'A2 y A4 designan el grupo de acero y el número siguiente la resistencia en unidades de 10 MPa: A4-80 son 800 MPa. Son austeníticos, más blandos que un acero templado de la misma clase, endurecen por deformación, se agarrotan en seco y se eligen por el ambiente, no por la carga.','A2 i A4 oznaczają grupę stali, a liczba po nich to wytrzymałość na rozciąganie w jednostkach 10 MPa: A4-80 to 800 MPa. Są austenityczne, więc są miększe niż stal hartowana tej samej klasy wytrzymałości, umacniają się przy odkształceniu na zimno, zacierają się na sucho i dobiera się je ze względu na środowisko, a nie na obciążenie.')

  /* ========================================================= 4. the record */
  function pyv(v) {
    if (v == null) return 'None';
    if (typeof v === 'number') return JSON.stringify(v);
    return JSON.stringify(String(v));
  }
  function pySource() {
    var L = [];
    L.push('CATALOG = {');
    CATALOG.forEach(function (e) {
      L.push('    ' + pyv(e.id) + ': {"name": ' + pyv(nameOf(e)) + ', "family": ' + pyv(e.family)
        + ', "std": ' + pyv(e.std) + ', "rm": ' + pyv(e.rm) + ', "rp": ' + pyv(e.rp)
        + ', "sp": ' + pyv(e.sp) + ', "elong": ' + pyv(e.elong) + ', "hv0": ' + pyv(e.hv0)
        + ', "hv1": ' + pyv(e.hv1) + ', "series": ' + pyv(e.series) + ', "dmin": ' + pyv(e.dmin)
        + ', "dmax": ' + pyv(e.dmax) + ', "hay": ' + pyv(e.hay) + '},');
    });
    L.push('}');
    L.push('ORDER = [' + CATALOG.map(function (e) { return pyv(e.id); }).join(', ') + ']');
    L.push('SIZES = {');
    SIZES.forEach(function (z) {
      L.push('    ' + pyv(z.id) + ': {"series": ' + pyv(z.series) + ', "d": ' + pyv(z.d) + ', "as": ' + pyv(z.as) + '},');
    });
    L.push('}');
    L.push('');
    L.push('');
    L.push('def matches(e, family, min_rp, query):');
    L.push('    """The same filter the page applies, over the same six-language haystack."""');
    L.push('    if family != "all" and e["family"] != family:');
    L.push('        return False');
    L.push('    if min_rp > 0 and e["rp"] < min_rp:');
    L.push('        return False');
    L.push('    for t in query.lower().split():');
    L.push('        if t not in e["hay"]:');
    L.push('            return False');
    L.push('    return True');
    L.push('');
    L.push('');
    L.push('def compute():');
    L.push('    e = CATALOG[GRADE]');
    L.push('    z = SIZES[SIZE]');
    L.push('    area = z["as"]');
    L.push('    if e["series"] != z["series"]:');
    L.push('        fit = "other_thread_series"');
    L.push('    elif z["d"] < e["dmin"] - 1e-9 or z["d"] > e["dmax"] + 1e-9:');
    L.push('        fit = "out_of_range"');
    L.push('    else:');
    L.push('        fit = "ok"');
    L.push('    shown = sum(1 for k in ORDER');
    L.push('                if matches(CATALOG[k], FILTER_STANDARD, FILTER_MIN_YIELD, FILTER_QUERY))');
    L.push('    return {');
    L.push('        "grade": e["name"],');
    L.push('        "standard": e["std"],');
    L.push('        "tensile_strength": e["rm"],');
    L.push('        "yield_strength": e["rp"],');
    L.push('        "proof_stress": e["sp"],');
    L.push('        "elongation_min": e["elong"],');
    L.push('        "hardness_min": e["hv0"],');
    L.push('        "hardness_max": e["hv1"],');
    L.push('        "stress_area": area,');
    L.push('        "proof_load": None if e["sp"] is None else e["sp"] * area,');
    L.push('        "yield_load": e["rp"] * area,');
    L.push('        "tensile_load": e["rm"] * area,');
    L.push('        "size_applicability": fit,');
    L.push('        "matches_shown": shown,');
    L.push('        "matches_total": len(ORDER),');
    L.push('    }');
    return L.join('\n');
  }

  function record() {
    var e = last.entry;
    if (!e) return null;                 /* no entry selected: nothing to record */
    var w = [];
    if (last.fit === 'out_of_range') w.push('the chosen thread size ' + state.size
      + ' is outside the size range this class covers (' + rangeOf(e) + ')');
    if (last.fit === 'other_thread_series') w.push('the chosen thread size ' + state.size
      + ' is not in the thread series this class is written for; the loads are arithmetic only');
    if (last.hidden) w.push('the selected class is hidden by the filters in force');
    if (e.sp == null) w.push('ISO 3506-1 defines no proof load stress for this class; proof_load is null');
    return {
      inputs: {
        grade: e.id, size: state.size, stress_area: last.as,
        filter_standard: state.family, filter_min_yield: state.minRp, filter_query: state.q
      },
      outputs: {
        grade: nameOf(e), standard: e.std,
        tensile_strength: e.rm, yield_strength: e.rp, proof_stress: e.sp,
        elongation_min: e.elong, hardness_min: e.hv0, hardness_max: e.hv1,
        stress_area: last.as,
        proof_load: last.proofLoad, yield_load: last.yieldLoad, tensile_load: last.tensileLoad,
        size_applicability: last.fit,
        matches_shown: last.shown, matches_total: last.total
      },
      units: {
        grade: 'text', size: 'text', stress_area: 'm2', filter_standard: 'text',
        filter_min_yield: 'Pa', filter_query: 'text',
        standard: 'text', tensile_strength: 'Pa', yield_strength: 'Pa', proof_stress: 'Pa',
        elongation_min: '%', hardness_min: 'HV', hardness_max: 'HV',
        proof_load: 'N', yield_load: 'N', tensile_load: 'N',
        size_applicability: 'text', matches_shown: 'count', matches_total: 'count'
      },
      model: {
        equations: [
          'F_proof = S_p * A_s',
          'F_yield = R_eL (or R_p0.2) * A_s',
          'F_tensile,min = R_m * A_s',
          'A_s is read from the thread table, not computed'
        ],
        ranges: [
          'room temperature, as-manufactured, uncoated; class minima, not lot values',
          'ISO 898-1 property classes 4.6 to 12.9; ISO 3506-1 A2 and A4; SAE J429 grades 1, 2, 5, 8',
          'metric coarse M5 to M36 and unified coarse 1/4-20 to 1-8'
        ],
        notes: [
          'this is a lookup: the record describes the entry selected at export time, and the catalogue table on screen repeats the same published minima for every entry the filters leave visible',
          'the three filter_* inputs narrow the visible list only; they do not change the selected entry properties. They are recorded because matches_shown depends on them',
          'grade is the catalogue key (8.8s and 8.8l are the two size ranges of class 8.8); outputs.grade is the name a reader sees',
          'size_applicability is a token, not a measurement: ok, out_of_range or other_thread_series',
          'record.units uses the non-SI tokens text, %, HV and count where the quantity is not a physical SI one',
          'no independent validation; the class values are transcribed, not derived'
        ]
      },
      warnings: w
    };
  }

  function installData() {
    if (!window.Diagram) return;
    Diagram.init({
      id: 'fastenergrades', file: 'fastenergrades.html',
      state: {
        serialize: function () { return state; },
        deserialize: function (o) {
          Object.assign(state, o || {});
          last = solve(state);
          if (ui) { ui.sync(); ui.run(); }
        }
      },
      record: record,
      python: function () {
        return {
          code: pySource(),
          requires: [],
          basis: {
            kind: 'reproduce',
            note: 'the same table and the same two multiplications as the page, in the same order',
            deviation: 'none for an ASCII search term; a non-ASCII one is case-folded by the host '
              + 'language rules, so matches_shown could in principle differ between JavaScript and Python'
          },
          selftest: { tolerance: 1e-12 }
        };
      },
      handoff: {
        provides: ['A', 'D'], accepts: ['D'],
        build: function () {
          if (!last.size) return null;
          return { quantities: {
            A: { value: last.as, unit: 'm2' },
            D: { value: last.size.d, unit: 'm' }
          } };
        },
        apply: function (p) {
          var q = (p && p.quantities) || {};
          var ignored = Object.keys(q).filter(function (k) { return k !== 'D'; });
          if (q.D && typeof q.D.value === 'number') {
            var best = SIZES[0], bd = Infinity;
            SIZES.forEach(function (z) {
              var d = Math.abs(z.d - q.D.value);
              if (d < bd) { bd = d; best = z; }
            });
            state.size = best.id;
          }
          last = solve(state);
          if (ui) {
            ui.sync(); ui.run();
            if (ignored.length) ui.notify(DiagramUI.pick(
              T('Ignored, because this tool has no use for them: ' + ignored.join(', ') + '.',
                'Проігноровано, бо цей інструмент їх не використовує: ' + ignored.join(', ') + '.',
                'Ignoriert, weil dieses Werkzeug sie nicht verwendet: ' + ignored.join(', ') + '.',
                'Genegeerd, omdat deze tool ze niet gebruikt: ' + ignored.join(', ') + '.',
                'Ignoré, car cet outil n’en fait rien : ' + ignored.join(', ') + '.',
                'Ignorado, porque esta herramienta no los usa: ' + ignored.join(', ') + '.','Pominięto, ponieważ to narzędzie ich nie wykorzystuje: ' + ignored.join(', ') + '.'), ui.lang));
          }
        }
      },
      report: {
        sections: function (rec) {
          var l = (ui && ui.lang) || 'en';
          var e = last.entry;
          var out = [];
          var st = ui && ui.byKey && ui.byKey.mark;
          if (st && e) {
            drawHead(st.measure(), st);          /* paint now, not on the next frame */
            out.push({
              title: DiagramUI.pick(T('Head marking', 'Маркування головки', 'Kopfmarkierung', 'Kopmarkering', 'Marquage de tête', 'Marcado de cabeza','Oznaczenie na łbie'), l),
              image: {
                src: st.canvas().canvas.toDataURL('image/png'), width: 320,
                caption: DiagramUI.pick(T('Schematic head marking for ' + nameOf(e), 'Схематичне маркування головки для ' + nameOf(e), 'Schematische Kopfmarkierung für ' + nameOf(e), 'Schematische kopmarkering voor ' + nameOf(e), 'Marquage de tête schématique pour ' + nameOf(e), 'Marcado de cabeza esquemático para ' + nameOf(e),'Schematyczne oznaczenie na łbie dla ' + nameOf(e)), l),
                alt: headA11y()
              },
              text: DiagramUI.pick(MARKH[e.mh], l)
            });
          }
          if (e) out.push({
            title: DiagramUI.pick(T('Service caveats', 'Застереження щодо експлуатації', 'Einsatzvorbehalte', 'Gebruiksvoorbehouden', 'Réserves d’emploi', 'Reservas de uso','Zastrzeżenia eksploatacyjne'), l),
            notes: [DiagramUI.pick(lead(TEMP_LEAD, TEMP[e.temp]), l), DiagramUI.pick(lead(CORR_LEAD, CORR[e.corr]), l)]
          });
          out.push({
            title: DiagramUI.pick(T('Every class that matches', 'Усі класи, що відповідають фільтрам', 'Alle passenden Klassen', 'Alle passende klassen', 'Toutes les classes correspondantes', 'Todas las clases que coinciden','Wszystkie pasujące klasy'), l),
            head: [DiagramUI.pick(CLASS_HEAD, l), DiagramUI.pick(STD_HEAD, l), 'Rm (MPa)', 'Rp (MPa)'],
            rows: last.hits.map(function (x) {
              return [nameOf(x) + (rangeOf(x) ? ' (' + rangeOf(x) + ')' : ''), x.std,
                { value: x.rm / 1e6, precision: 0 }, { value: x.rp / 1e6, precision: 0 }];
            }),
            notes: [DiagramUI.pick(T('Shown with the filters in force at export time; ' + rec.outputs.matches_shown + ' of ' + rec.outputs.matches_total + '.',
              'Показано з фільтрами, чинними на час експорту; ' + rec.outputs.matches_shown + ' з ' + rec.outputs.matches_total + '.',
              'Mit den beim Export gesetzten Filtern; ' + rec.outputs.matches_shown + ' von ' + rec.outputs.matches_total + '.',
              'Met de filters die bij het exporteren golden; ' + rec.outputs.matches_shown + ' van ' + rec.outputs.matches_total + '.',
              'Avec les filtres en vigueur à l’export ; ' + rec.outputs.matches_shown + ' sur ' + rec.outputs.matches_total + '.',
              'Con los filtros vigentes al exportar; ' + rec.outputs.matches_shown + ' de ' + rec.outputs.matches_total + '.','Pokazano z filtrami obowiązującymi w chwili eksportu; ' + rec.outputs.matches_shown + ' z ' + rec.outputs.matches_total + '.'), l)]
          });
          return out;
        }
      }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
