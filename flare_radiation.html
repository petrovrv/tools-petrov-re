 "description": {
  "en": "Estimates thermal radiation from an elevated flare with the simple point-source method of API Std 521 (7th ed., 2020) Annex C. Heat release Q = W·LHV gives the flame length; the wind tilts the flame by the ratio of wind to exit velocity; radiation K = tau·F·Q/(4πD²) is evaluated at the receptor from the flame centre. The tool returns the minimum grade distance and stack height that meet the allowable radiation, plus tip velocity and Mach number.",

  "fr": "Estime le rayonnement thermique d'une torchère surélevée selon la méthode simple de la source ponctuelle de l'API Std 521 (7e éd., 2020), annexe C. La chaleur dégagée Q = W·LHV donne la longueur de flamme ; le vent incline la flamme selon le rapport entre la vitesse du vent et la vitesse de sortie ; le rayonnement K = tau·F·Q/(4πD²) est évalué au récepteur à partir du centre de la flamme. L'outil renvoie la distance minimale au niveau du sol et la hauteur de cheminée qui respectent le rayonnement admissible, ainsi que la vitesse en nez de torche et le nombre de Mach.",

  function solve(s) {
    var L = lib();
    if (!L || typeof L.solve !== 'function') return {ok: false, err: 'ogh-process.js did not load'};
    for (var i = 0; i < FIELDS.length; i++) {
      var v = s[FIELDS[i][0]];
      if (typeof v !== 'number' || !isFinite(v)) return {ok: false, err: 'Enter a finite value for ' + FIELDS[i][1]};
    }

        note: T('Look at K: doubling the stack from 50 to 100 m cuts K at 60 m from 3.50 to 1.80 kW/m² (−49 %), more than halving the relief flow does (2.19 kW/m², see the next example).',
          'Подивіться на K: подвоєння висоти труби з 50 до 100 м знижує K на відстані 60 м з 3,50 до 1,80 кВт/м² (−49 %), сильніше, ніж зменшення витрати скиду вдвічі (2,19 кВт/м², див. наступний приклад).',
          'Achten Sie auf K: Die Verdopplung des Kamins von 50 auf 100 m senkt K in 60 m von 3,50 auf 1,80 kW/m² (−49 %), stärker als die Halbierung des Entlastungsstroms (2,19 kW/m², siehe nächstes Beispiel).',
          'Kijk naar K: de pijp verdubbelen van 50 naar 100 m verlaagt K op 60 m van 3,50 naar 1,80 kW/m² (−49 %), meer dan het halveren van het ontlastingsdebiet (2,19 kW/m², zie het volgende voorbeeld).',
          'Regardez K : doubler la cheminée de 50 à 100 m fait passer K à 60 m de 3,50 à 1,80 kW/m² (−49 %), davantage que diviser par deux le débit de décharge (2,19 kW/m², voir l\'exemple suivant).',
          'Fíjese en K: duplicar la chimenea de 50 a 100 m reduce K a 60 m de 3,50 a 1,80 kW/m² (−49 %), más que reducir a la mitad el caudal de alivio (2,19 kW/m², vea el ejemplo siguiente).',
          'Zwróć uwagę na K: podwojenie komina z 50 do 100 m obniża K w odległości 60 m z 3,50 do 1,80 kW/m² (−49 %), bardziej niż zmniejszenie zrzutu o połowę (2,19 kW/m², zob. następny przykład).'),
        apply: function (t) { base(t); t.H = 100; } },
      { id: 'half-flow', group: G2,
        label: T('Half relief flow 25 kg/s', 'Половинний скид 25 кг/с', 'Halber Entlastungsstrom 25 kg/s', 'Half ontlastingsdebiet 25 kg/s', 'Moitié du débit 25 kg/s', 'Mitad del caudal 25 kg/s', 'Połowa zrzutu 25 kg/s'),
        note: T('Look at K and L: halving the flow halves Q to 1150 MW, but K at 60 m falls only from 3.50 to 2.19 kW/m² (−37 %), because the shorter flame (69.9 m instead of 97.3 m) puts its centre lower and closer to the receptor.',
          'Подивіться на K і L: зменшення витрати вдвічі зменшує Q до 1150 МВт, але K на відстані 60 м падає лише з 3,50 до 2,19 кВт/м² (−37 %), бо коротше полум\'я (69,9 м замість 97,3 м) опускає свій центр нижче й ближче до приймача.',
          'Achten Sie auf K und L: Die Halbierung des Stroms halbiert Q auf 1150 MW, doch K in 60 m sinkt nur von 3,50 auf 2,19 kW/m² (−37 %), weil die kürzere Flamme (69,9 m statt 97,3 m) ihren Mittelpunkt tiefer und näher am Empfänger hat.',
          'Kijk naar K en L: het debiet halveren halveert Q tot 1150 MW, maar K op 60 m daalt slechts van 3,50 naar 2,19 kW/m² (−37 %), omdat de kortere vlam (69,9 m in plaats van 97,3 m) haar centrum lager en dichter bij de ontvanger heeft.',
          'Regardez K et L : diviser le débit par deux divise Q par deux (1150 MW), mais K à 60 m ne baisse que de 3,50 à 2,19 kW/m² (−37 %), car la flamme plus courte (69,9 m au lieu de 97,3 m) place son centre plus bas, plus près du récepteur.',
          'Fíjese en K y L: reducir el caudal a la mitad reduce Q a 1150 MW, pero K a 60 m solo baja de 3,50 a 2,19 kW/m² (−37 %), porque la llama más corta (69,9 m en lugar de 97,3 m) sitúa su centro más bajo y más cerca del receptor.',
          'Zwróć uwagę na K i L: zmniejszenie przepływu o połowę obniża Q do 1150 MW, ale K w odległości 60 m spada tylko z 3,50 do 2,19 kW/m² (−37 %), bo krótszy płomień (69,9 m zamiast 97,3 m) ma środek niżej i bliżej odbiornika.'),
        apply: function (t) { base(t); t.W = 25; } },
      { id: 'personnel-continuous', group: G2,
        label: T('Continuous exposure 1.58 kW/m²', 'Тривала дія 1,58 кВт/м²', 'Daueraufenthalt 1,58 kW/m²', 'Continue blootstelling 1,58 kW/m²', 'Exposition continue 1,58 kW/m²', 'Exposición continua 1,58 kW/m²', 'Ciągła ekspozycja 1,58 kW/m²'),
        note: T('Look at the verdict and Rmin: the same flare now fails at 60 m (3.50 > 1.58 kW/m²); the grade area to keep clear jumps from none to Rmin = 141 m, or the stack would have to be 111 m high.',
          'Подивіться на висновок і Rmin: той самий факел тепер не проходить на відстані 60 м (3,50 > 1,58 кВт/м²); зона на рівні землі, яку треба тримати вільною, зростає від нуля до Rmin = 141 м, інакше труба мала б бути заввишки 111 м.',
          'Achten Sie auf das Ergebnis und Rmin: Dieselbe Fackel fällt in 60 m jetzt durch (3,50 > 1,58 kW/m²); der freizuhaltende Bereich auf Geländehöhe wächst von null auf Rmin = 141 m, sonst müsste der Kamin 111 m hoch sein.',
          'Kijk naar het oordeel en Rmin: dezelfde fakkel faalt nu op 60 m (3,50 > 1,58 kW/m²); het vrij te houden gebied op maaiveld groeit van nul tot Rmin = 141 m, anders zou de pijp 111 m hoog moeten zijn.',
          'Regardez le verdict et Rmin : la même torchère échoue désormais à 60 m (3,50 > 1,58 kW/m²) ; la zone au sol à dégager passe de rien à Rmin = 141 m, sinon la cheminée devrait mesurer 111 m.',
          'Fíjese en el veredicto y en Rmin: la misma antorcha ahora no cumple a 60 m (3,50 > 1,58 kW/m²); la zona a nivel del suelo que hay que despejar pasa de nada a Rmin = 141 m, o la chimenea tendría que medir 111 m.',
          'Zwróć uwagę na werdykt i Rmin: ta sama pochodnia nie spełnia teraz limitu w odległości 60 m (3,50 > 1,58 kW/m²); strefa na poziomie terenu do wyłączenia rośnie od zera do Rmin = 141 m, inaczej komin musiałby mieć 111 m.'),
        apply: function (t) { base(t); t.Kd_kW = 1.58; } },
      { id: 'hydrogen-vent', group: G3,
        label: T('Hydrogen vent', 'Скидання водню', 'Wasserstoff-Abblasung', 'Waterstofafblaas', 'Évent d\'hydrogène', 'Venteo de hidrógeno', 'Odpowietrzenie wodoru'),
        note: T('Look at Mach: only 2 kg/s of hydrogen already leaves the 0.15 m tip at 1327 m/s (Mach 1.03, warning), while K at 60 m is just 0.36 kW/m²; for hydrogen the tip velocity, not radiation, governs the design.',
          'Подивіться на число Маха: лише 2 кг/с водню вже виходять з оголовка 0,15 м зі швидкістю 1327 м/с (Mach 1,03, попередження), тоді як K на відстані 60 м — лише 0,36 кВт/м²; для водню визначальною є швидкість в оголовку, а не випромінювання.',
          'Achten Sie auf die Machzahl: Schon 2 kg/s Wasserstoff verlassen die 0,15-m-Spitze mit 1327 m/s (Mach 1,03, Warnung), während K in 60 m nur 0,36 kW/m² beträgt; bei Wasserstoff bestimmt die Austrittsgeschwindigkeit, nicht die Strahlung, die Auslegung.',
          'Kijk naar het machgetal: slechts 2 kg/s waterstof verlaat de tip van 0,15 m al met 1327 m/s (Mach 1,03, waarschuwing), terwijl K op 60 m maar 0,36 kW/m² is; bij waterstof bepaalt de tipsnelheid, niet de straling, het ontwerp.',
          'Regardez le Mach : 2 kg/s d\'hydrogène seulement sortent déjà du nez de 0,15 m à 1327 m/s (Mach 1,03, avertissement), alors que K à 60 m n\'est que de 0,36 kW/m² ; pour l\'hydrogène, c\'est la vitesse au nez, pas le rayonnement, qui dimensionne.',
          'Fíjese en el Mach: solo 2 kg/s de hidrógeno ya salen de la boquilla de 0,15 m a 1327 m/s (Mach 1,03, aviso), mientras que K a 60 m es de apenas 0,36 kW/m²; en el hidrógeno manda la velocidad en la boquilla, no la radiación.',
          'Zwróć uwagę na liczbę Macha: już 2 kg/s wodoru opuszcza końcówkę 0,15 m z prędkością 1327 m/s (Mach 1,03, ostrzeżenie), a K w odległości 60 m to tylko 0,36 kW/m²; dla wodoru o projekcie decyduje prędkość na końcówce, a nie promieniowanie.'),
        apply: function (t) { base(t); t.W = 2; t.MW = 2.016; t.LHV_MJ = 120; t.Tj = 288; t.d = 0.15; t.F = 0.15; t.level = 'full'; } }
    ];
    ui.examples(EX);

    ui.stage({
      caption: T(
        'Grade-level radiation vs horizontal distance from the stack (API 521 point source)',
        'Радіація на рівні землі залежно від горизонтальної відстані від факельної труби (точкове джерело за API 521)',
        'Strahlung auf Bodenniveau in Abhängigkeit vom horizontalen Abstand zum Fackelkamin (Punktquelle nach API 521)',
        'Straling op maaiveldniveau versus horizontale afstand tot de fakkelschoorsteen (API 521-puntbron)',
        'Rayonnement au niveau du sol en fonction de la distance horizontale à la torchère (source ponctuelle API 521)',
        'Radiación a nivel del suelo frente a la distancia horizontal a la chimenea de antorcha (fuente puntual API 521)',
        'Promieniowanie na poziomie terenu w funkcji odległości poziomej od komina pochodni (źródło punktowe wg API 521)'
      ),
      minHeight: 300,
      a11y: function () {
        if (!last || !last.ok) {
          return TL(T('Radiation profile not available.', 'Профіль випромінювання недоступний.', 'Strahlungsprofil nicht verfügbar.',
            'Stralingsprofiel niet beschikbaar.', 'Profil de rayonnement indisponible.', 'Perfil de radiación no disponible.',
            'Profil promieniowania niedostępny.'));
        }
        return TL(TF(T('Grade-level radiation at the receptor distance of {0} m is {1} kW/m², against an allowable limit of {2} kW/m²; the minimum distance meeting the limit is {3} m.',
          'Випромінювання на рівні землі на відстані приймача {0} м становить {1} кВт/м² за допустимої межі {2} кВт/м²; мінімальна відстань, на якій межа дотримується, — {3} м.',
          'Die Strahlung auf Geländehöhe beträgt am Empfänger in {0} m Abstand {1} kW/m² bei einem zulässigen Grenzwert von {2} kW/m²; der Mindestabstand, ab dem der Grenzwert eingehalten wird, beträgt {3} m.',
          'De straling op maaiveldniveau op de ontvangerafstand van {0} m is {1} kW/m², bij een toelaatbare grens van {2} kW/m²; de minimale afstand waarop de grens wordt gehaald is {3} m.',
          'Le rayonnement au niveau du sol à la distance du récepteur de {0} m est de {1} kW/m², pour une limite admissible de {2} kW/m² ; la distance minimale respectant la limite est de {3} m.',
          'La radiación a nivel del suelo a la distancia del receptor de {0} m es de {1} kW/m², frente a un límite admisible de {2} kW/m²; la distancia mínima que cumple el límite es de {3} m.',
          'Promieniowanie na poziomie terenu w odległości odbiornika {0} m wynosi {1} kW/m² przy dopuszczalnym limicie {2} kW/m²; minimalna odległość spełniająca limit to {3} m.'),
          [DiagramUI.fmt(state.R, { precision: 3 }), DiagramUI.fmt(last.K / 1000, { precision: 3 }),
           DiagramUI.fmt(state.Kd_kW, { precision: 3 }), DiagramUI.fmt(last.Rmin, { precision: 3 })]));
      },
      render: renderFlare
    });
    adoptStage(ui);

    ui.ready();
    window.__flare_radiation = { ui: ui, state: state, solve: solve, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function buildRecord() {
    if (!last) return null;
    var s = state, i, k;
    var U = {
      W: 'kg/s', MW: 'kg/kmol', LHV: 'J/kg', Tj: 'K', d: 'm', H: 'm', uw: 'm/s', F: '-', tau: '-',
      Kdesign: 'W/m2', R: 'm', Q: 'W', L: 'm', uj: 'm/s', rhoj: 'kg/m3', Mach: '-', theta: 'rad',
      xc: 'm', yc: 'm', D: 'm', K: 'W/m2', Dreq: 'm', Rmin: 'm', Hmin: 'm', basis: '-'
    };
    var inputs = {
      W: s.W, MW: s.MW, LHV: s.LHV_MJ * 1e6, Tj: s.Tj, d: s.d, H: s.H, uw: s.uw,
      F: s.F, tau: s.tau, Kdesign: s.Kd_kW * 1e3, R: s.R
    };
    var outKeys = ['Q', 'L', 'uj', 'rhoj', 'Mach', 'theta', 'xc', 'yc', 'D', 'K', 'Dreq', 'Rmin', 'Hmin', 'basis'];
    var outputs = {}, units = {};
    if (last.ok) for (i = 0; i < outKeys.length; i++) outputs[outKeys[i]] = last[outKeys[i]];
    for (k in inputs) if (inputs.hasOwnProperty(k)) units[k] = U[k];
    for (k in outputs) if (outputs.hasOwnProperty(k)) units[k] = U[k];
    var warnings = last.ok ? (last.warnings || []).slice() : [last.err];
    return {
      inputs: inputs, outputs: outputs, units: units,
      model: {
        equations: ['Q = W*LHV', 'L = 0.00326*Q^0.478 (API 521 Fig. C.1 fit, Q in W)',
          'theta = atan(uw/uj)', 'K = tau*F*Q/(4*pi*D^2)'],
        ranges: ['point source valid beyond about one flame length from the flame'],
        notes: ['API Std 521:2020, 7th ed. (2020-06), Annex C simple method', 'LHV, mass basis']
      },
      warnings: warnings
    };
  }
  var HANDOFF = {
    provides: ['Q', 'mdot'],
    accepts: ['mdot'],
    build: function () {
      if (!last || !last.ok) { return null; }
      return {
        quantities: {
          Q: { value: last.Q, unit: 'W' },
          mdot: { value: state.W, unit: 'kg/s' }
        },
        sets: {
          flare: [
            { Rmin: { value: last.Rmin, unit: 'm' }, L: { value: last.L, unit: 'm' } }
          ]
        }
      };
    },
    apply: function (payload) {
      var q = (payload && payload.quantities) || {};
      var v = q.mdot && q.mdot.value;
      if (typeof v === 'number' && isFinite(v) && v > 0) { state.W = v; }
      last = solve(state);
      if (ui) { ui.sync(); ui.run(); }
    }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'flare_radiation',
        file: 'flare_radiation.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
