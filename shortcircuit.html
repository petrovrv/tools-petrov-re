<script type="application/json" id="diagram-tool-manifest">{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision":"2026-10-03.shortcircuit-number-locale-1","id":"shortcircuit","file":"shortcircuit.html","listed":true,"category":"electrical","order":26,"title":{"en":"IEC 60909 Short-Circuit","uk":"IEC 60909 Short-Circuit","de":"IEC 60909 Short-Circuit","nl":"IEC 60909 Short-Circuit","fr":"IEC 60909 Short-Circuit","es":"IEC 60909 Short-Circuit","pl":"IEC 60909 Short-Circuit"},"summary":{"en":"Sequence-network short-circuit study with complex sparse nodal solution, IEC-oriented correction factors, peak, breaking and thermal-equivalent currents.","uk":"Розрахунок струмів короткого замикання за симетричними складовими з комплексним розрідженим вузловим розв’язком, поправками IEC, піковим, вимикаючим і термічно еквівалентним струмами.","de":"Kurzschlussberechnung mit Sequenznetzen und komplexer dünnbesetzter Knotenlösung, IEC-orientierten Korrekturfaktoren sowie Stoß-, Ausschalt- und thermisch äquivalenten Strömen.","nl":"Kortsluitstudie met sequentienetten en complexe sparse knooppuntoplossing, IEC-gerichte correctiefactoren en piek-, uitschakel- en thermisch equivalente stromen.","fr":"Étude de court-circuit par réseaux de séquence avec résolution nodale complexe creuse, facteurs de correction IEC et courants de crête, de coupure et thermiquement équivalents.","es":"Estudio de cortocircuito por redes de secuencia con solución nodal compleja dispersa, factores de corrección IEC y corrientes de pico, corte y equivalente térmica.","pl":"Obliczenia zwarciowe metodą sieci składowych z rzadkim zespolonym rozwiązaniem węzłowym, współczynnikami korekcyjnymi IEC oraz prądem udarowym, wyłączeniowym i cieplnie równoważnym."},"description":{"en":"IEC-oriented short-circuit workbench for multi-source AC networks. It solves positive-, negative- and zero-sequence driving-point impedances with the shared complex sparse runtime, supports 3-phase, line-line, line-earth and line-line-earth faults, and hands fault duties to protection coordination.","uk":"IEC-орієнтований стенд розрахунку КЗ для багатоджерельних мереж змінного струму. Обчислює вхідні опори прямої, зворотної та нульової послідовностей спільним комплексним розрідженим solver і передає аварійні струми в координацію захисту.","de":"IEC-orientierte Kurzschluss-Workbench für Wechselstromnetze mit mehreren Quellen. Sie berechnet Mit-, Gegen- und Nullsystem-Eingangsimpedanzen mit dem gemeinsamen komplexen Sparse-Solver und übergibt Fehlerbeanspruchungen an die Schutzkoordination.","nl":"IEC-georiënteerde kortsluitwerkbank voor AC-netten met meerdere bronnen. Berekent positieve, negatieve en nul-sequentie aandrijfpuntimpedanties met de gedeelde complexe sparse solver en draagt foutbelastingen over aan beveiligingscoördinatie.","fr":"Atelier de calcul de court-circuit orienté IEC pour réseaux CA multi-sources. Il calcule les impédances de séquence directe, inverse et homopolaire avec le solveur creux complexe partagé et transmet les sollicitations de défaut à la coordination des protections.","es":"Banco de cálculo de cortocircuito orientado a IEC para redes CA con múltiples fuentes. Resuelve impedancias de secuencia positiva, negativa y cero con el solver complejo disperso compartido y entrega las solicitaciones de falla a la coordinación de protecciones.","pl":"Stanowisko obliczeń zwarciowych zgodne z podejściem IEC dla wieloźródłowych sieci AC. Wyznacza impedancje składowej zgodnej, przeciwnej i zerowej wspólnym rzadkim solverem zespolonym i przekazuje obciążenia zwarciowe do koordynacji zabezpieczeń."},"status":"benchmarked","independent_validation":false,"limitations":{"en":"IEC 60909-0:2026 is the current edition. The implemented transformer K_T, Method-C kappa, rotating-machine decrement and Annex-A thermal-factor equations are benchmarked against an independent implementation of the published 2016 equation set; the equation-by-equation 2026 delta has not yet been independently verified. Converter-fed sources, detailed transformer zero-sequence construction and near-generator AC-decay solving remain outside scope. Results require engineering review.","uk":"Чинна редакція — IEC 60909-0:2026. Реалізовані рівняння K_T трансформатора, Method-C κ, спадання для обертових машин і термічного множника Annex A перевірені авторським benchmark проти незалежної реалізації опублікованого набору рівнянь 2016 року; покрокову різницю редакції 2026 ще не перевірено незалежно. Перетворювальні джерела, детальна конструкція нульової послідовності трансформатора та розрахунок AC-спаду поблизу генератора поза обсягом. Потрібна інженерна перевірка.","de":"Aktuelle Ausgabe ist IEC 60909-0:2026. Die implementierten Gleichungen für Transformator K_T, Method-C κ, Abklingfaktoren rotierender Maschinen und den thermischen Faktor nach Anhang A sind gegen eine unabhängige Implementierung des veröffentlichten Gleichungssatzes von 2016 benchmarked; der Gleichungs-Delta zur Ausgabe 2026 ist noch nicht unabhängig geprüft. Umrichtergespeiste Quellen, detaillierte Nullsystem-Transformatorausführung und die Lösung des AC-Abklingens in Generatornähe liegen außerhalb des Umfangs. Ergebnisse erfordern technische Prüfung.","nl":"De huidige editie is IEC 60909-0:2026. De geïmplementeerde vergelijkingen voor transformator K_T, Method-C κ, afname van roterende machines en de thermische factor van Annex A zijn gebenchmarkt tegen een onafhankelijke implementatie van de gepubliceerde 2016-formules; de vergelijking-per-vergelijking wijziging van 2026 is nog niet onafhankelijk geverifieerd. Omvormergevoede bronnen, gedetailleerde nul-sequentiemodellering van transformatoren en AC-afname nabij generatoren vallen buiten de scope. Technische beoordeling blijft vereist.","fr":"L’édition actuelle est IEC 60909-0:2026. Les équations implémentées pour K_T du transformateur, κ Method-C, la décroissance des machines tournantes et le facteur thermique de l’Annexe A sont comparées avec succès à une implémentation indépendante du jeu d’équations publié en 2016 ; le delta équation par équation de 2026 n’a pas encore été vérifié indépendamment. Les sources à convertisseur, le détail homopolaire des transformateurs et la résolution de la décroissance CA près des générateurs sont hors périmètre. Une revue d’ingénierie reste requise.","es":"La edición vigente es IEC 60909-0:2026. Las ecuaciones implementadas para K_T del transformador, κ Method-C, decremento de máquinas rotativas y factor térmico del Anexo A se han contrastado con una implementación independiente del conjunto de ecuaciones publicado en 2016; el delta ecuación por ecuación de 2026 aún no se ha verificado de forma independiente. Fuentes con convertidor, modelado detallado de secuencia cero de transformadores y decremento CA cerca del generador quedan fuera de alcance. Se requiere revisión de ingeniería.","pl":"Aktualnym wydaniem jest IEC 60909-0:2026. Zaimplementowane równania K_T transformatora, κ Method-C, zaniku maszyn wirujących i współczynnika cieplnego z Załącznika A porównano z niezależną implementacją opublikowanego zestawu równań z 2016 r.; różnice równanie-po-równaniu wydania 2026 nie zostały jeszcze niezależnie zweryfikowane. Źródła przekształtnikowe, szczegółowy model składowej zerowej transformatora i rozwiązanie zaniku AC blisko generatora pozostają poza zakresem. Wyniki wymagają przeglądu inżynierskiego."},"intended_use":"preliminary assessment","catalog_languages":["en","uk","de","nl","fr","es","pl"],"tool_languages":["en","uk","de","nl","fr","es","pl"],"dependencies":["diagram-common.js","diagram-ui.js","diagram-compute.classic.js"],"network_access":{"mode":"none"},"validation":{"basis":{"en":"12 author-run benchmark cases compare the tool against a separately written Python implementation of IEC 60909-0:2016 sequence-fault equations for 3-phase, L-L, L-G and L-L-G faults, explicit Z1/Z2/Z0, max/min voltage factors, fault resistance, Method-C peak current and Annex-A thermal factor. All 12 pass. This is benchmark evidence, not independent validation; the 2026 edition delta remains unverified.","uk":"12 авторських benchmark-кейсів порівнюють інструмент з окремо написаною Python-реалізацією рівнянь IEC 60909-0:2016 для 3-фазного, L-L, L-G та L-L-G КЗ, явних Z1/Z2/Z0, max/min коефіцієнтів напруги, опору дуги, Method-C та термічного множника Annex A. Усі 12 PASS. Це benchmark, а не незалежна валідація; delta редакції 2026 не перевірена.","de":"12 vom Autor ausgeführte Benchmarkfälle vergleichen das Werkzeug mit einer separat geschriebenen Python-Implementierung der IEC-60909-0:2016-Sequenzfehlergleichungen für 3-phasige, L-L-, L-G- und L-L-G-Fehler, explizite Z1/Z2/Z0, max/min-Spannungsfaktoren, Fehlerwiderstand, Method-C und Anhang-A-Thermik. Alle 12 bestehen. Dies ist Benchmark-Evidenz, keine unabhängige Validierung; der 2026-Delta bleibt ungeprüft.","nl":"12 door de auteur uitgevoerde benchmarkcases vergelijken de tool met een afzonderlijk geschreven Python-implementatie van IEC 60909-0:2016 voor 3-fase, L-L, L-G en L-L-G fouten, expliciete Z1/Z2/Z0, max/min spanningsfactoren, foutweerstand, Method-C en Annex-A thermiek. Alle 12 slagen. Dit is benchmarkbewijs, geen onafhankelijke validatie; de 2026-delta blijft ongeverifieerd.","fr":"12 cas de benchmark exécutés par l’auteur comparent l’outil à une implémentation Python écrite séparément des équations IEC 60909-0:2016 pour défauts triphasés, L-L, L-G et L-L-G, Z1/Z2/Z0 explicites, facteurs de tension max/min, résistance de défaut, Method-C et facteur thermique Annexe A. Les 12 réussissent. Il s’agit d’un benchmark, pas d’une validation indépendante ; le delta 2026 reste non vérifié.","es":"12 casos de benchmark ejecutados por el autor comparan la herramienta con una implementación Python escrita por separado de IEC 60909-0:2016 para fallas trifásicas, L-L, L-G y L-L-G, Z1/Z2/Z0 explícitas, factores de tensión max/min, resistencia de falla, Method-C y factor térmico del Anexo A. Los 12 pasan. Es evidencia de benchmark, no validación independiente; el delta 2026 sigue sin verificar.","pl":"12 przypadków benchmarkowych uruchomionych przez autora porównuje narzędzie z niezależnie napisaną implementacją Python równań IEC 60909-0:2016 dla zwarć 3-fazowych, L-L, L-G i L-L-G, jawnych Z1/Z2/Z0, współczynników napięcia max/min, rezystancji zwarcia, Method-C i współczynnika cieplnego z Załącznika A. Wszystkie 12 przechodzi. To benchmark, nie niezależna walidacja; delta wydania 2026 pozostaje niezweryfikowana."},"independent_validation":false,"benchmarks":[{"id":"iec60909-sequence-fault-kernel-v1","reference":"Independent Python complex-arithmetic implementation of the cited IEC 60909-0:2016 sequence-fault equations; no shortcircuit.html JavaScript is imported.","citations":["IEC 60909-0:2016, clause 4.2 — equivalent voltage source and initial symmetrical short-circuit currents for balanced and unbalanced faults","IEC 60909-0:2016, clause 4.3.1.2, equations (55)-(56) — ip = kappa sqrt(2) Ik'' and kappa = 1.02 + 0.98 exp(-3 R/X)","IEC 60909-0:2016, Annex A — thermal equivalent short-circuit current and AC-decay factor m","IEC 60909-0:2016, sequence-network treatment of positive-, negative- and zero-sequence impedances for line-earth and line-line-earth faults"],"cases":12,"passed":12,"tolerance":"Currents: 1e-6 A + 1e-10 relative; kappa and thermal m: 1e-12 absolute. Tolerance covers double-precision evaluation order only.","run_at":"2026-10-15T23:01:29Z","artifact":"benchmarks/shortcircuit.json"}]},"report":{"pdf":true,"source_attribution":true},"python_export":{"supported":false,"reason":"The current general complex sparse sequence-network solver has not yet been ported to a standard-library-only Python reproduction."},"handoff":{"provides":["Ik","ip","Ib","Ith","Ires","V_volt","Z","XR"],"accepts":["V_volt","Z","XR"]},"state_codec":{"permalink":true,"record":"tools.petrov.re/calculation-record/v1"},"ui":{"framework":"tools.petrov.re/ui/v1","level":3}}</script>

const TR={"Network → sequence networks → fault currents → protection handoff":["Мережа → схеми послідовностей → струми КЗ → передача в захист","Netz → Sequenznetze → Kurzschlussströme → Übergabe an den Schutz","Net → sequentienetten → kortsluitstromen → overdracht naar beveiliging","Réseau → réseaux de séquence → courants de défaut → transmission à la protection","Red → redes de secuencia → corrientes de falla → traspaso a protección","Sieć → sieci składowych → prądy zwarciowe → przekazanie do zabezpieczeń"],"IEC 60909 short-circuit quantities are derived from positive-, negative- and zero-sequence networks. Use the presets to inspect representative network and Thevenin cases, then change one assumption at a time. Benchmarks exercise the implemented 2016 equation subset; IEC 60909-0:2026 equation-level changes still require independent review.":["Величини короткого замикання за IEC 60909 визначаються зі схем прямої, зворотної та нульової послідовностей. Використовуйте пресети для перегляду типових мережевих і тевенінівських випадків, після чого змінюйте по одному припущенню за раз. Бенчмарки перевіряють реалізовану підмножину рівнянь редакції 2016 року; зміни на рівні рівнянь IEC 60909-0:2026 ще потребують незалежної перевірки.","Die Kurzschlussgrößen nach IEC 60909 werden aus dem Mit-, Gegen- und Nullsystem abgeleitet. Verwenden Sie die Vorgaben, um repräsentative Netz- und Thevenin-Fälle zu betrachten, und ändern Sie dann jeweils eine Annahme. Die Benchmarks prüfen den implementierten Gleichungssatz der Ausgabe 2016; Änderungen auf Gleichungsebene nach IEC 60909-0:2026 erfordern weiterhin eine unabhängige Prüfung.","De kortsluitgrootheden volgens IEC 60909 worden afgeleid uit het positieve, negatieve en nulsysteem. Gebruik de presets om representatieve net- en Thevenin-gevallen te bekijken en wijzig daarna telkens één aanname. De benchmarks toetsen de geïmplementeerde vergelijkingenset van 2016; wijzigingen op vergelijkingsniveau volgens IEC 60909-0:2026 vereisen nog een onafhankelijke toetsing.","Les grandeurs de court-circuit selon IEC 60909 sont déduites des réseaux de séquence directe, inverse et homopolaire. Utilisez les préréglages pour examiner des cas de réseau et de Thevenin représentatifs, puis modifiez une hypothèse à la fois. Les benchmarks couvrent le jeu d’équations 2016 implémenté ; les modifications au niveau des équations selon IEC 60909-0:2026 nécessitent encore une revue indépendante.","Las magnitudes de cortocircuito según IEC 60909 se derivan de las redes de secuencia positiva, negativa y cero. Use los preajustes para examinar casos representativos de red y de Thevenin, y luego modifique una hipótesis a la vez. Los benchmarks cubren el conjunto de ecuaciones de 2016 implementado; los cambios a nivel de ecuación según IEC 60909-0:2026 aún requieren una revisión independiente.","Wielkości zwarciowe wg IEC 60909 wyznacza się na podstawie sieci składowej zgodnej, przeciwnej i zerowej. Użyj gotowych ustawień, aby przejrzeć reprezentatywne przypadki sieciowe i Thevenina, a następnie zmieniaj po jednym założeniu naraz. Benchmarki obejmują zaimplementowany zestaw równań z wydania 2016; zmiany na poziomie równań wg IEC 60909-0:2026 nadal wymagają niezależnego przeglądu."],"Edition status":["Статус редакції","Status der Ausgabe","Status van de editie","Statut de l’édition","Estado de la edición","Status wydania"],"IEC 60909-0:2026 is current. Equation-level K_T, Method-C κ, μ/q and thermal m in this tool use the published 2016 equation set until the 2026 delta is independently checked.":["Чинна редакція — IEC 60909-0:2026. Рівняння K_T, Method-C κ, μ/q та термічного m у цьому інструменті використовують опублікований набір рівнянь 2016 року, доки різницю редакції 2026 не буде незалежно перевірено.","IEC 60909-0:2026 ist aktuell. K_T, Method-C κ, μ/q und der thermische Faktor m verwenden in diesem Werkzeug auf Gleichungsebene den veröffentlichten Satz von 2016, bis das Delta zu 2026 unabhängig geprüft ist.","IEC 60909-0:2026 is de huidige editie. K_T, Method-C κ, μ/q en de thermische factor m gebruiken in deze tool op vergelijkingsniveau de gepubliceerde set van 2016, totdat het verschil met 2026 onafhankelijk is getoetst.","IEC 60909-0:2026 est l’édition en vigueur. K_T, κ de la Method-C, μ/q et le facteur thermique m utilisent dans cet outil, au niveau des équations, le jeu publié de 2016, tant que le delta 2026 n’a pas été vérifié indépendamment.","IEC 60909-0:2026 es la edición vigente. K_T, κ del Method-C, μ/q y el factor térmico m usan en esta herramienta, a nivel de ecuación, el conjunto publicado en 2016, hasta que el delta de 2026 se verifique de forma independiente.","Obowiązującym wydaniem jest IEC 60909-0:2026. K_T, κ Method-C, μ/q oraz współczynnik cieplny m używają w tym narzędziu na poziomie równań opublikowanego zestawu z 2016 r., dopóki różnica względem 2026 nie zostanie niezależnie zweryfikowana."],"How to use this short-circuit workbench":["Як користуватися цим інструментом розрахунку КЗ","So verwenden Sie diese Kurzschluss-Workbench","Zo gebruikt u deze kortsluitwerkbank","Comment utiliser cet atelier de court-circuit","Cómo usar este banco de cortocircuito","Jak korzystać z tego stanowiska obliczeń zwarciowych"],"Start with a preset. Choose maximum or minimum duty, select the fault type and fault bus, then inspect Ik″, ip, Ib and Ith. Expand the source panels only when you need to change the network assumptions. Imported Thevenin mode is intended for handoff from Electrical Network Solver.":["Почніть із пресету. Оберіть максимальний або мінімальний режим, тип КЗ і шину КЗ, потім перегляньте Ik″, ip, Ib та Ith. Розгортайте панелі джерел лише тоді, коли потрібно змінити припущення щодо мережі. Режим імпортованого Тевеніна призначений для передачі даних з Electrical Network Solver.","Beginnen Sie mit einer Vorgabe. Wählen Sie den Maximal- oder Minimalfall, den Fehlertyp und die Fehlersammelschiene, und betrachten Sie dann Ik″, ip, Ib und Ith. Erweitern Sie die Quellenpaneele nur, wenn Sie Netzannahmen ändern müssen. Der importierte Thevenin-Modus ist für die Übergabe aus dem Electrical Network Solver vorgesehen.","Begin met een preset. Kies het maximale of minimale geval, het foutentype en de foutrail, en bekijk vervolgens Ik″, ip, Ib en Ith. Klap de bronpanelen alleen open wanneer u netaannames moet wijzigen. De geïmporteerde Thevenin-modus is bedoeld voor overdracht vanuit Electrical Network Solver.","Commencez par un préréglage. Choisissez le cas maximal ou minimal, le type de défaut et le jeu de barres en défaut, puis examinez Ik″, ip, Ib et Ith. Ne dépliez les panneaux de sources que si vous devez modifier les hypothèses réseau. Le mode Thevenin importé est destiné à la transmission depuis Electrical Network Solver.","Comience con un preajuste. Elija el caso máximo o mínimo, el tipo de falla y la barra en falla, y luego revise Ik″, ip, Ib e Ith. Despliegue los paneles de fuentes solo cuando necesite cambiar las hipótesis de red. El modo Thevenin importado está pensado para el traspaso desde Electrical Network Solver.","Zacznij od gotowego ustawienia. Wybierz przypadek maksymalny lub minimalny, rodzaj zwarcia i szynę zwarciową, a następnie sprawdź Ik″, ip, Ib i Ith. Rozwijaj panele źródeł tylko wtedy, gdy trzeba zmienić założenia sieciowe. Zaimportowany tryb Thevenina jest przeznaczony do przekazywania danych z Electrical Network Solver."],"Source model":["Модель джерела","Quellenmodell","Bronmodel","Modèle de source","Modelo de fuente","Model źródła"],"Built-in network assembles sequence admittance matrices for the external grid, transformer, feeder, generator and motor. Imported Thevenin mode replaces that network with the equivalent voltage and sequence impedances received from another tool.":["Вбудована мережа формує матриці провідностей послідовностей для зовнішньої мережі, трансформатора, фідера, генератора та двигуна. Режим імпортованого Тевеніна замінює цю мережу еквівалентною напругою та опорами послідовностей, отриманими з іншого інструмента.","Das eingebaute Netz baut Sequenz-Admittanzmatrizen für das vorgelagerte Netz, den Transformator, die Leitung, den Generator und den Motor auf. Der importierte Thevenin-Modus ersetzt dieses Netz durch die Ersatzspannung und die Sequenzimpedanzen, die von einem anderen Werkzeug übernommen werden.","Het ingebouwde net bouwt sequentie-admittantiematrices op voor het bovenliggende net, de transformator, de voeding, de generator en de motor. De geïmporteerde Thevenin-modus vervangt dat net door de vervangende spanning en sequentie-impedanties die van een andere tool zijn ontvangen.","Le réseau intégré assemble les matrices d’admittance de séquence pour le réseau amont, le transformateur, le départ, le générateur et le moteur. Le mode Thevenin importé remplace ce réseau par la tension équivalente et les impédances de séquence reçues d’un autre outil.","La red integrada ensambla las matrices de admitancia de secuencia para la red externa, el transformador, la alimentación, el generador y el motor. El modo Thevenin importado sustituye esa red por la tensión equivalente y las impedancias de secuencia recibidas de otra herramienta.","Wbudowana sieć tworzy macierze admitancji składowych dla sieci zasilającej, transformatora, odcinka zasilającego, generatora i silnika. Zaimportowany tryb Thevenina zastępuje tę sieć napięciem zastępczym i impedancjami składowych otrzymanymi z innego narzędzia."],"Maximum and minimum cases":["Максимальний і мінімальний режими","Maximal- und Minimalfälle","Maximale en minimale gevallen","Cas maximal et minimal","Casos máximo y mínimo","Przypadki maksymalny i minimalny"],"Maximum and minimum short-circuit duties use different voltage factors and, where applicable, different source strength and conductor temperature. Protection checks often need both: maximum current stresses equipment, while minimum current can govern relay sensitivity and clearing time.":["Максимальний і мінімальний режими КЗ використовують різні коефіцієнти напруги та, за потреби, різну потужність джерела і температуру провідника. Для перевірки захисту зазвичай потрібні обидва: максимальний струм навантажує обладнання, тоді як мінімальний струм може визначати чутливість реле та час відключення.","Maximal- und Minimal-Kurzschlussfall verwenden unterschiedliche Spannungsfaktoren und, wo zutreffend, unterschiedliche Quellenstärke und Leitertemperatur. Für Schutzprüfungen werden oft beide benötigt: Der Maximalstrom beansprucht die Betriebsmittel, während der Minimalstrom die Relaisempfindlichkeit und die Abschaltzeit bestimmen kann.","Maximaal en minimaal kortsluitgeval gebruiken verschillende spanningsfactoren en, waar van toepassing, verschillende bronsterkte en geleidertemperatuur. Voor beveiligingscontroles zijn vaak beide nodig: de maximale stroom belast het materieel, terwijl de minimale stroom de relaisgevoeligheid en uitschakeltijd kan bepalen.","Les cas de court-circuit maximal et minimal utilisent des facteurs de tension différents et, le cas échéant, une force de source et une température de conducteur différentes. Les vérifications de protection nécessitent souvent les deux : le courant maximal sollicite le matériel, tandis que le courant minimal peut conditionner la sensibilité des relais et le temps d’élimination du défaut.","Los casos de cortocircuito máximo y mínimo usan factores de tensión distintos y, cuando corresponde, distinta fuerza de fuente y temperatura del conductor. Las verificaciones de protección suelen requerir ambos: la corriente máxima solicita el equipo, mientras que la corriente mínima puede condicionar la sensibilidad del relé y el tiempo de despeje.","Przypadki zwarcia maksymalnego i minimalnego wykorzystują różne współczynniki napięcia oraz, gdy dotyczy, różną moc źródła i temperaturę przewodu. Sprawdzenia zabezpieczeń często wymagają obu: prąd maksymalny obciąża urządzenia, a prąd minimalny może decydować o czułości przekaźnika i czasie wyłączenia."],"Fault types and sequence networks":["Типи КЗ і схеми послідовностей","Fehlerarten und Sequenznetze","Foutentypen en sequentienetten","Types de défauts et réseaux de séquence","Tipos de falla y redes de secuencia","Rodzaje zwarć i sieci składowych"],"A 3-phase fault uses the positive-sequence network only. L-L couples positive and negative sequence. L-G and L-L-G also require the zero-sequence path, so transformer vector group and grounding assumptions can change the answer strongly.":["Тризфазне КЗ використовує лише схему прямої послідовності. L-L поєднує пряму та зворотну послідовності. L-G і L-L-G додатково потребують кола нульової послідовності, тож група з'єднання трансформатора та припущення щодо заземлення можуть суттєво змінити результат.","Ein dreiphasiger Fehler verwendet nur das Mitsystem. L-L koppelt Mit- und Gegensystem. L-G und L-L-G benötigen zusätzlich den Nullsystem-Pfad, sodass Schaltgruppe des Transformators und Erdungsannahmen das Ergebnis stark verändern können.","Een driefasenfout gebruikt alleen het positieve sequentienet. L-L koppelt het positieve en negatieve sequentienet. L-G en L-L-G vereisen ook het nul-sequentiepad, zodat de schakelgroep van de transformator en de aardingsaannames het resultaat sterk kunnen veranderen.","Un défaut triphasé n’utilise que le réseau de séquence directe. Le défaut L-L couple les séquences directe et inverse. Les défauts L-G et L-L-G nécessitent en plus le chemin de séquence homopolaire, si bien que le couplage du transformateur et les hypothèses de mise à la terre peuvent fortement modifier le résultat.","Una falla trifásica usa solo la red de secuencia positiva. La falla L-L acopla las secuencias positiva y negativa. Las fallas L-G y L-L-G requieren además la trayectoria de secuencia cero, por lo que el grupo de conexión del transformador y las hipótesis de puesta a tierra pueden cambiar fuertemente el resultado.","Zwarcie trójfazowe wykorzystuje wyłącznie sieć składowej zgodnej. Zwarcie L-L łączy składową zgodną i przeciwną. Zwarcia L-G i L-L-G wymagają dodatkowo ścieżki składowej zerowej, więc grupa połączeń transformatora i założenia dotyczące uziemienia mogą silnie zmienić wynik."],"Peak current ip":["Пікове значення струму ip","Stoßkurzschlussstrom ip","Piekstroom ip","Courant de crête ip","Corriente de pico ip","Prąd udarowy ip"],"ip is the first-cycle peak used for electrodynamic duty. Method C derives κ from the network R/X behaviour and applies ip = κ√2 Ik″ for the maximum case.":["ip — це пікове значення першого періоду, що використовується для електродинамічного навантаження. Method C визначає κ з поведінки R/X мережі та застосовує ip = κ√2 Ik″ для максимального режиму.","ip ist der Scheitelwert der ersten Periode, der für die elektrodynamische Beanspruchung verwendet wird. Method C leitet κ aus dem R/X-Verhalten des Netzes ab und wendet ip = κ√2 Ik″ für den Maximalfall an.","ip is de piekwaarde van de eerste periode die wordt gebruikt voor de elektrodynamische belasting. Method C leidt κ af uit het R/X-gedrag van het net en past ip = κ√2 Ik″ toe voor het maximale geval.","ip est la valeur de crête du premier cycle utilisée pour la contrainte électrodynamique. La Method C déduit κ du comportement R/X du réseau et applique ip = κ√2 Ik″ pour le cas maximal.","ip es el valor de pico del primer ciclo utilizado para la solicitación electrodinámica. El Method C deriva κ del comportamiento R/X de la red y aplica ip = κ√2 Ik″ para el caso máximo.","ip to wartość szczytowa pierwszego okresu wykorzystywana do obciążenia elektrodynamicznego. Method C wyznacza κ na podstawie zachowania R/X sieci i stosuje ip = κ√2 Ik″ dla przypadku maksymalnego."],"Breaking current Ib":["Вимикаючий струм Ib","Ausschaltstrom Ib","Uitschakelstroom Ib","Courant de coupure Ib","Corriente de corte Ib","Prąd wyłączeniowy Ib"],"Ib screens the symmetrical breaking current after source decrement. The present implementation reports it for maximum 3-phase faults and applies the implemented μ/q rotating-machine treatment.":["Ib оцінює симетричний вимикаючий струм після спадання джерела. Поточна реалізація визначає його для максимальних тризфазних КЗ і застосовує реалізовану обробку обертових машин μ/q.","Ib erfasst den symmetrischen Ausschaltstrom nach dem Abklingen der Quelle. Die vorliegende Implementierung berichtet ihn für maximale dreiphasige Fehler und wendet die implementierte μ/q-Behandlung rotierender Maschinen an.","Ib beoordeelt de symmetrische uitschakelstroom na afname van de bron. De huidige implementatie rapporteert deze voor maximale driefasenfouten en past de geïmplementeerde μ/q-behandeling van roterende machines toe.","Ib évalue le courant de coupure symétrique après décroissance de la source. La présente implémentation le calcule pour les défauts triphasés maximaux et applique le traitement μ/q implémenté pour les machines tournantes.","Ib evalúa la corriente de corte simétrica tras el decremento de la fuente. La implementación actual la informa para fallas trifásicas máximas y aplica el tratamiento μ/q implementado para máquinas rotativas.","Ib ocenia symetryczny prąd wyłączeniowy po zaniku źródła. Obecna implementacja podaje go dla maksymalnych zwarć trójfazowych i stosuje zaimplementowane traktowanie maszyn wirujących μ/q."],"Thermal-equivalent current Ith":["Термічно еквівалентний струм Ith","Thermisch gleichwertiger Kurzschlussstrom Ith","Thermisch equivalente stroom Ith","Courant thermiquement équivalent Ith","Corriente térmicamente equivalente Ith","Prąd cieplnie równoważny Ith"],"Ith converts the short-circuit current history into an equivalent RMS current for the selected duration Tk. The factor n is an expert input; the default n = 1 represents the far-from-generator AC-decay case.":["Ith перетворює хід струму КЗ у еквівалентний діючий струм для обраної тривалості Tk. Коефіцієнт n є експертним параметром; типове значення n = 1 відповідає випадку віддаленого від генератора спадання змінної складової.","Ith wandelt den Kurzschlussstromverlauf in einen äquivalenten Effektivstrom für die gewählte Dauer Tk um. Der Faktor n ist eine Experteneingabe; der Standardwert n = 1 entspricht dem generatorfernen Abklingfall.","Ith zet het kortsluitstroomverloop om in een equivalente effectieve stroom voor de gekozen duur Tk. De factor n is een expertinvoer; de standaardwaarde n = 1 komt overeen met het generatorverre AC-afnamegeval.","Ith convertit l’historique du courant de court-circuit en un courant efficace équivalent pour la durée Tk sélectionnée. Le facteur n est une saisie experte ; la valeur par défaut n = 1 représente le cas de décroissance CA loin du générateur.","Ith convierte el historial de corriente de cortocircuito en una corriente eficaz equivalente para la duración Tk seleccionada. El factor n es una entrada experta; el valor por defecto n = 1 representa el caso de decremento CA alejado del generador.","Ith przekształca przebieg prądu zwarciowego na równoważny prąd skuteczny dla wybranego czasu Tk. Współczynnik n jest wartością ekspercką; domyślne n = 1 odpowiada przypadkowi zaniku składowej przemiennej z dala od generatora."],"Zero-sequence path":["Коло нульової послідовності","Nullsystem-Pfad","Nul-sequentiepad","Chemin homopolaire","Trayectoria de secuencia cero","Ścieżka składowej zerowej"],"Earth faults are only as credible as Z0. The built-in transformer screening covers Dyn, YNyn, YNd and Dd topologies. Core construction, tertiaries and mutual zero-sequence coupling are outside this model.":["Достовірність результатів для замикань на землю обмежена достовірністю Z0. Вбудована перевірка трансформатора охоплює топології Dyn, YNyn, YNd і Dd. Конструкція осердя, третинні обмотки та взаємна індуктивність нульової послідовності поза межами цієї моделі.","Erdfehler sind nur so verlässlich wie Z0. Die eingebaute Transformatorprüfung deckt die Topologien Dyn, YNyn, YNd und Dd ab. Kernbauart, Tertiärwicklungen und gegenseitige Nullsystemkopplung liegen außerhalb dieses Modells.","Aardfouten zijn slechts zo betrouwbaar als Z0. De ingebouwde transformatorscreening dekt de topologieën Dyn, YNyn, YNd en Dd. Kernopbouw, tertiaire wikkelingen en onderlinge nul-sequentiekoppeling vallen buiten dit model.","Les défauts à la terre ne sont fiables qu’à hauteur de Z0. Le contrôle de transformateur intégré couvre les topologies Dyn, YNyn, YNd et Dd. La construction du noyau, les enroulements tertiaires et le couplage homopolaire mutuel sont hors de ce modèle.","Las fallas a tierra son solo tan fiables como Z0. La verificación de transformador integrada cubre las topologías Dyn, YNyn, YNd y Dd. La construcción del núcleo, los terciarios y el acoplamiento mutuo de secuencia cero quedan fuera de este modelo.","Wiarygodność zwarć doziemnych zależy od wiarygodności Z0. Wbudowana kontrola transformatora obejmuje topologie Dyn, YNyn, YNd i Dd. Konstrukcja rdzenia, uzwojenia trzeciorzędne i wzajemne sprzężenie składowej zerowej pozostają poza tym modelem."],"Handoff to protection":["Передача даних у захист","Übergabe an den Schutz","Overdracht naar beveiliging","Transmission à la protection","Traspaso a protección","Przekazanie do zabezpieczeń"],"The outgoing handoff carries fault-type-specific maximum/minimum current sets, voltage provenance and residual current where applicable. Protection Coordination can then evaluate device operation and pass clearing time to Cable Sizing.":["Вихідна передача даних містить набори максимальних/мінімальних струмів для конкретного типу КЗ, походження напруги та залишковий струм, де застосовно. Далі Protection Coordination може оцінити спрацювання пристроїв і передати час відключення в Cable Sizing.","Die ausgehende Übergabe enthält fehlerartspezifische Maximal-/Minimalstromsätze, die Spannungsherkunft und, wo zutreffend, den Reststrom. Protection Coordination kann dann die Geräteauslösung bewerten und die Abschaltzeit an Cable Sizing weitergeben.","De uitgaande overdracht bevat foutentype-specifieke maximum-/minimumstroomsets, de spanningsherkomst en, waar van toepassing, de reststroom. Protection Coordination kan vervolgens de werking van toestellen beoordelen en de uitschakeltijd doorgeven aan Cable Sizing.","La transmission sortante comporte des jeux de courants maximaux/minimaux spécifiques au type de défaut, l’origine de la tension et, le cas échéant, le courant résiduel. Protection Coordination peut alors évaluer le fonctionnement des appareils et transmettre le temps d’élimination à Cable Sizing.","El traspaso saliente incluye conjuntos de corriente máxima/mínima específicos del tipo de falla, la procedencia de la tensión y, cuando corresponde, la corriente residual. Protection Coordination puede entonces evaluar la actuación de los dispositivos y pasar el tiempo de despeje a Cable Sizing.","Przekazywane dane wyjściowe zawierają zestawy prądów maksymalnych/minimalnych właściwe dla rodzaju zwarcia, pochodzenie napięcia oraz, gdy dotyczy, prąd szczątkowy. Protection Coordination może następnie ocenić zadziałanie urządzeń i przekazać czas wyłączenia do Cable Sizing."],"Study":["Дослідження","Studie","Studie","Étude","Estudio","Studium"],"Case":["Режим","Fall","Geval","Cas","Caso","Przypadek"],"Fault":["КЗ","Fehler","Fout","Défaut","Falla","Zwarcie"],"Fault bus":["Шина КЗ","Fehlersammelschiene","Foutrail","Jeu de barres en défaut","Barra en falla","Szyna zwarciowa"],"Frequency":["Частота","Frequenz","Frequentie","Fréquence","Frecuencia","Częstotliwość"],"Fault resistance":["Опір у місці КЗ","Fehlerwiderstand","Foutweerstand","Résistance de défaut","Resistencia de falla","Rezystancja zwarcia"],"Breaking time":["Час вимикання","Ausschaltzeit","Uitschakeltijd","Temps de coupure","Tiempo de corte","Czas wyłączania"],"Short-circuit duration Tk":["Тривалість КЗ Tk","Kurzschlussdauer Tk","Kortsluitduur Tk","Durée de court-circuit Tk","Duración de cortocircuito Tk","Czas trwania zwarcia Tk"],"AC decay factor n":["Коефіцієнт спадання змінної складової n","Wechselstrom-Abklingfaktor n","AC-afnamefactor n","Facteur de décr
