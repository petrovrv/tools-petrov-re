  "description": {
    "en": "Enter the building height, the governing outlet and the minimum mains pressure, or load an example. The tool checks every floor on the mains, decides which floors need the booster, sets its pressure and head, splits the peak flow over duty pumps with a standby, sizes the membrane vessel for the allowed starts per hour and a break tank for an indirect connection, and shows where the static pressure at night exceeds 5 bar — as floors needing a pressure reducing valve or as pressure zones.",
    "uk": "Введіть висоту будівлі, розрахункову точку водорозбору й мінімальний тиск у мережі або завантажте приклад. Інструмент перевіряє кожен поверх на тиску мережі, визначає, яким поверхам потрібна установка, задає її тиск і напір, розподіляє пікову витрату між робочими насосами з резервним, підбирає мембранний бак під допустиму кількість пусків і розривний бак для непрямого приєднання та показує, де нічний статичний тиск перевищує 5 бар — як поверхи з редукторами тиску або як зони тиску.",
    "de": "Geben Sie Gebäudehöhe, maßgebende Entnahmestelle und Mindestversorgungsdruck ein oder laden Sie ein Beispiel. Das Werkzeug prüft jedes Geschoss am Netzdruck, bestimmt die Geschosse für die Druckerhöhung, legt Solldruck und Förderhöhe fest, teilt den Spitzendurchfluss auf Betriebspumpen mit Reservepumpe, bemisst den Membranbehälter für die zulässige Schalthäufigkeit und einen Vorbehälter für den mittelbaren Anschluss und zeigt, wo der Ruhedruck nachts 5 bar übersteigt — als Geschosse mit Druckminderer oder als Druckzonen.",
    "nl": "Geef de gebouwhoogte, het maatgevende tappunt en de minimale netdruk in, of laad een voorbeeld. De tool controleert elke verdieping op netdruk, bepaalt welke verdiepingen de hydrofoor nodig hebben, legt insteldruk en opvoerhoogte vast, verdeelt het piekdebiet over bedrijfspompen met een reservepomp, dimensioneert het membraanvat voor het toegelaten aantal starts per uur en een onderbrekingsreservoir voor een indirecte aansluiting, en toont waar de statische druk ’s nachts boven 5 bar komt — als verdiepingen met drukverminderaar of als drukzones.",
    "fr": "Saisissez la hauteur du bâtiment, le point de puisage déterminant et la pression minimale du réseau, ou chargez un exemple. L’outil vérifie chaque étage sur le réseau, détermine les étages à surpresser, fixe la pression de consigne et la hauteur, répartit le débit de pointe sur les pompes de service avec une pompe de secours, dimensionne le réservoir à membrane pour le nombre de démarrages admis et une bâche pour un raccordement indirect, et montre où la pression statique nocturne dépasse 5 bar — en étages avec réducteur ou en zones de pression.",
    "es": "Introduzca la altura del edificio, el punto de consumo determinante y la presión mínima de la red, o cargue un ejemplo. La herramienta comprueba cada planta con la red, decide qué plantas necesitan el grupo, fija su presión y altura, reparte el caudal punta entre bombas de servicio con una de reserva, dimensiona el depósito de membrana para los arranques admitidos y un depósito de rotura de carga para una conexión indirecta, y muestra dónde la presión estática nocturna supera 5 bar — como plantas con reductora o como zonas de presión.",
    "pl": "Podaj wysokość budynku, miarodajny punkt czerpalny i minimalne ciśnienie w sieci albo wczytaj przykład. Narzędzie sprawdza każdą kondygnację przy ciśnieniu sieci, ustala, które kondygnacje wymagają zestawu, dobiera ciśnienie zadane i wysokość podnoszenia, dzieli przepływ szczytowy na pompy robocze z rezerwową, dobiera zbiornik przeponowy do dopuszczalnej liczby załączeń i zbiornik przerywający dla podłączenia pośredniego oraz pokazuje, gdzie nocne ciśnienie statyczne przekracza 5 bar — jako kondygnacje z reduktorem lub jako strefy ciśnienia."

  'fed.prvfloor': T7('+ floor PRV', '+ поверховий редуктор', '+ Druckminderer im Geschoss', '+ drukverminderaar verdieping', '+ réducteur d’étage', '+ reductora de planta', '+ reduktor na kondygnacji'),
  'fl.mains_static_high': T7('At night the mains alone gives more than %m bar at floors %s — those floors need a pressure reducing valve even without a booster.', 'Уночі сама мережа дає понад %m бар на поверхах %s — там потрібен редуктор тиску навіть без установки.', 'Nachts liefert schon das Netz über %m bar in den Geschossen %s — dort ist auch ohne DEA ein Druckminderer nötig.', '’s Nachts geeft het net alleen al meer dan %m bar op verdiepingen %s — daar is ook zonder hydrofoor een drukverminderaar nodig.', 'La nuit, le réseau seul donne plus de %m bar aux étages %s — un réducteur y est nécessaire même sans surpresseur.', 'De noche la red sola da más de %m bar en las plantas %s: allí hace falta una reductora incluso sin grupo.', 'W nocy już sama sieć daje ponad %m bar na kondygnacjach %s — potrzebny jest tam reduktor nawet bez zestawu.'),
  'fl.inlet_low': T7('At design flow the inlet pressure drops to %p bar, below the admissible %m bar — ask the utility; an indirect connection (break tank) may be required.', 'При розрахунковій витраті тиск на вході падає до %p бар, нижче допустимих %m бар — узгодьте з водоканалом; може знадобитися непряме приєднання (розривний бак).', 'Bei Spitzendurchfluss fällt der Zulaufdruck auf %p bar, unter die zulässigen %m bar — mit dem Versorger klären; ggf. mittelbarer Anschluss (Vorbehälter).', 'Bij ontwerpdebiet zakt de inlaatdruk tot %p bar, onder de toelaatbare %m bar — overleg met de waterleverancier; een indirecte aansluiting (reservoir) kan nodig zijn.', 'Au débit de calcul, la pression d’aspiration tombe à %p bar, sous les %m bar admis — consulter le distributeur ; un raccordement indirect (bâche) peut être exigé.', 'Con el caudal de diseño la presión de aspiración cae a %p bar, por debajo de los %m bar admisibles: consulte a la compañía; puede exigirse una conexión indirecta (depósito).', 'Przy przepływie obliczeniowym ciśnienie na dopływie spada do %p bar, poniżej dopuszczalnych %m bar — uzgodnij z wodociągiem; może być wymagane podłączenie pośrednie (zbiornik).'),
  'fl.inlet_negative': T7('The inlet pressure at design flow is zero or negative — the pump would suck the mains empty; a break tank is unavoidable.', 'Тиск на вході при розрахунковій витраті нульовий або від’ємний — насос висмоктував би мережу; розривний бак неминучий.', 'Der Zulaufdruck bei Spitzendurchfluss ist null oder negativ — die Pumpe würde das Netz leersaugen; ein Vorbehälter ist unvermeidbar.', 'De inlaatdruk bij ontwerpdebiet is nul of negatief — de pomp zou het net leegzuigen; een reservoir is onvermijdelijk.', 'La pression d’aspiration au débit de calcul est nulle ou négative — la pompe viderait le réseau ; une bâche est inévitable.', 'La presión de aspiración con el caudal de diseño es nula o negativa: la bomba vaciaría la red; el depósito es inevitable.', 'Ciśnienie na dopływie przy przepływie obliczeniowym jest zerowe lub ujemne — pompa opróżniałaby sieć; zbiornik jest konieczny.'),
  'fl.inlet_above_set': T7('The inlet pressure already exceeds the set pressure — check the inputs.', 'Тиск на вході вже перевищує уставку — перевірте дані.', 'Der Zulaufdruck liegt schon über dem Solldruck — Eingaben prüfen.', 'De inlaatdruk ligt al boven de insteldruk — controleer de invoer.', 'La pression d’aspiration dépasse déjà la consigne — vérifier les données.', 'La presión de aspiración ya supera la consigna: revise los datos.', 'Ciśnienie na dopływie już przekracza ciśnienie zadane — sprawdź dane.'),
  'fl.no_standby': T7('No standby pump: DIN 1988-500 asks for at least one standby pump in a drinking-water booster set.', 'Немає резервного насоса: DIN 1988-500 вимагає щонайменше один резервний насос.', 'Keine Reservepumpe: DIN 1988-500 verlangt mindestens eine Reservepumpe.', 'Geen reservepomp: DIN 1988-500 vraagt minstens één reservepomp in een drinkwaterhydrofoor.', 'Pas de pompe de secours : la DIN 1988-500 en demande au moins une.', 'Sin bomba de reserva: DIN 1988-500 exige al menos una.', 'Brak pompy rezerwowej: DIN 1988-500 wymaga co najmniej jednej.'),
  'fl.prv_floors': T7('With the booster stopped at %o bar, the static pressure exceeds %m bar on floors %s — fit pressure reducing valves there or use the zones below.', 'Коли установка зупиняється при %o бар, статичний тиск перевищує %m бар на поверхах %s — поставте там редуктори або використайте зони нижче.', 'Bei Abschaltung mit %o bar übersteigt der Ruhedruck %m bar in den Geschossen %s — dort Druckminderer einbauen oder die Zonen unten verwenden.', 'Met de hydrofoor gestopt op %o bar komt de statische druk boven %m bar op verdiepingen %s — plaats daar drukverminderaars of gebruik de zones hieronder.', 'Surpresseur arrêté à %o bar : la pression statique dépasse %m bar aux étages %s — y poser des réducteurs ou utiliser les zones ci-dessous.', 'Con el grupo parado a %o bar la presión estática supera %m bar en las plantas %s: instale reductoras o use las zonas de abajo.', 'Przy zatrzymaniu zestawu przy %o bar ciśnienie statyczne przekracza %m bar na kondygnacjach %s — zastosuj tam reduktory lub strefy poniżej.'),
  'fl.inlet_static_high': T7('Direct connection: at night the mains alone gives %i bar at the pump outlet, more than the cut-out pressure %o bar; through the stopped pumps and the bypass it pushes floors %s over %m bar static. Fit a pressure reducing valve upstream of the booster set to at most %o bar (or count on the floor PRVs listed).',
    'Пряме приєднання: уночі сама мережа дає %i бар на виході насосів — більше за тиск вимкнення %o бар; через зупинені насоси й байпас вона піднімає статичний тиск на поверхах %s понад %m бар. Поставте редуктор тиску перед установкою з налаштуванням не вище %o бар (або врахуйте поверхові редуктори зі списку).',
    'Unmittelbarer Anschluss: nachts liefert das Netz allein %i bar am Pumpenausgang, mehr als der Ausschaltdruck %o bar; über die stehenden Pumpen und den Bypass drückt es die Geschosse %s über %m bar Ruhedruck. Druckminderer vor der DEA auf höchstens %o bar einbauen (oder die aufgeführten Geschoss-Druckminderer vorsehen).',
    'Directe aansluiting: ’s nachts geeft het net alleen %i bar aan de pompuitlaat, meer dan de uitschakeldruk %o bar; via de stilstaande pompen en de bypass duwt het verdiepingen %s boven %m bar statisch. Plaats een drukverminderaar vóór de hydrofoor op hoogstens %o bar (of reken op de vermelde verdiepingsdrukverminderaars).',
    'Raccordement direct : la nuit, le réseau seul donne %i bar en sortie des pompes, plus que la pression d’arrêt %o bar ; à travers les pompes arrêtées et le by-pass, il porte les étages %s au-delà de %m bar statiques. Poser un réducteur de pression en amont du surpresseur réglé à %o bar au plus (ou prévoir les réducteurs d’étage listés).',
    'Conexión directa: de noche la red sola da %i bar a la salida de las bombas, más que la presión de paro %o bar; a través de las bombas paradas y el bypass lleva las plantas %s por encima de %m bar estáticos. Instale una reductora antes del grupo tarada a %o bar como máximo (o cuente con las reductoras de planta indicadas).',
    'Podłączenie bezpośrednie: w nocy sama sieć daje %i bar na wyjściu pomp, więcej niż ciśnienie wyłączenia %o bar; przez zatrzymane pompy i obejście podnosi ciśnienie statyczne kondygnacji %s ponad %m bar. Zamontuj reduktor ciśnienia przed zestawem nastawiony najwyżej na %o bar (albo uwzględnij wymienione reduktory kondygnacyjne).'),
  'e.n_duty': T7('duty pumps: a whole number from 1 to 6', 'робочі насоси: ціле число від 1 до 6', 'Betriebspumpen: ganze Zahl von 1 bis 6', 'bedrijfspompen: een geheel getal van 1 tot 6', 'pompes de service : nombre entier de 1 à 6', 'bombas de servicio: número entero de 1 a 6', 'pompy robocze: liczba całkowita od 1 do 6'),
  'e.n_standby': T7('standby pumps: a whole number from 0 to 3', 'резервні насоси: ціле число від 0 до 3', 'Reservepumpen: ganze Zahl von 0 bis 3', 'reservepompen: een geheel getal van 0 tot 3', 'pompes de secours : nombre entier de 0 à 3', 'bombas de reserva: número entero de 0 a 3', 'pompy rezerwowe: liczba całkowita od 0 do 3'),
  'e.q_zero': T7('the DIN 1988-300 peak flow of the boosted part is zero — enter the largest single design flow or a design flow', 'пікова витрата DIN 1988-300 для частини з підвищенням дорівнює нулю — введіть найбільшу окрему розрахункову витрату або розрахункову витрату', 'der Spitzendurchfluss nach DIN 1988-300 für den druckerhöhten Teil ist null — größten Einzeldurchfluss oder einen Bemessungsdurchfluss eingeben', 'het piekdebiet volgens DIN 1988-300 van het verhoogde deel is nul — vul het grootste afzonderlijke rekendebiet of een ontwerpdebiet in', 'le débit de pointe DIN 1988-300 de la partie surpressée est nul — saisir le plus grand débit unitaire ou un débit de calcul', 'el caudal punta DIN 1988-300 de la parte con grupo es cero: introduzca el mayor caudal individual o un caudal de diseño', 'przepływ szczytowy wg DIN 1988-300 dla części z podwyższeniem wynosi zero — podaj największy pojedynczy przepływ lub przepływ obliczeniowy'),
  'e.dp_pre': T7('the vessel pre-charge would be at or below atmospheric pressure — reduce the pre-charge drop below the cut-in pressure', 'попередня накачка бака була б на рівні атмосферного тиску або нижче — зменште різницю нижче тиску вмикання', 'der Vordruck des Behälters läge bei oder unter Atmosphärendruck — Abstand unter dem Einschaltdruck verringern', 'de voordruk van het vat zou op of onder de atmosferische druk liggen — verklein het verschil onder de inschakeldruk', 'le prégonflage du réservoir serait à la pression atmosphérique ou en dessous — réduire l’écart sous la pression d’enclenchement', 'la precarga del depósito quedaría en la presión atmosférica o por debajo: reduzca la diferencia bajo la presión de arranque', 'ciśnienie wstępne zbiornika byłoby równe atmosferycznemu lub niższe — zmniejsz różnicę poniżej ciśnienia załączenia'),
  'e.suction_loss_bar': T7('suction line loss: 0 to 5 bar', 'втрати у всмоктувальній лінії: від 0 до 5 бар', 'Saugleitungsverlust: 0 bis 5 bar', 'verlies zuigleiding: 0 tot 5 bar', 'perte de la conduite d’aspiration : de 0 à 5 bar', 'pérdida de la tubería de aspiración: de 0 a 5 bar', 'strata w przewodzie ssawnym: od 0 do 5 bar'),
  'e.two_largest_lps': T7('two largest draw-offs of a utilisation unit: more than 0 and at most 100 l/s (0 = not used)', 'дві найбільші точки водорозбору: більше 0 і не більше 100 л/с (0 = не враховувати)', 'zwei größte Entnahmestellen: mehr als 0 und höchstens 100 l/s (0 = nicht verwenden)', 'twee grootste tappunten: meer dan 0 en hoogstens 100 l/s (0 = niet gebruiken)', 'deux plus grands points de puisage : plus de 0 et au plus 100 l/s (0 = non utilisé)', 'dos mayores puntos de consumo: más de 0 y como máximo 100 l/s (0 = no usar)', 'dwa największe punkty czerpalne: więcej niż 0 i najwyżej 100 l/s (0 = nie stosować)'),
  'e.z_pump': T7('the pump stands above the lowest outlets — a roof tank with gravity supply is a different system; put the pump at or below the ground-floor outlets', 'насос стоїть вище за найнижчі точки водорозбору — дахова ємність із самопливом є іншою системою; розмістіть насос на рівні точок першого поверху або нижче', 'die Pumpe steht über den untersten Entnahmestellen — ein Dachbehälter mit Schwerkraftversorgung ist ein anderes System; Pumpe auf oder unter Höhe der EG-Entnahmestellen setzen', 'de pomp staat boven de laagste tappunten — een dakreservoir met valleiding is een ander systeem; plaats de pomp op of onder de tappunten van het gelijkvloers', 'la pompe est au-dessus des puisages les plus bas — un réservoir en toiture alimentant par gravité est un autre système ; placer la pompe au niveau des puisages du rez ou plus bas', 'la bomba está por encima de los puntos de consumo más bajos: un depósito en cubierta por gravedad es otro sistema; coloque la bomba a la altura de los puntos de planta baja o por debajo', 'pompa stoi powyżej najniższych punktów poboru — zbiornik dachowy z zasilaniem grawitacyjnym to inny układ; umieść pompę na poziomie punktów parteru lub niżej'),
  'fl.zones_needed': T7('%z pressure zones keep every outlet at or below %m bar.', '%z зони тиску утримують кожну точку на рівні не вище %m бар.', '%z Druckzonen halten jede Entnahmestelle bei höchstens %m bar.', '%z drukzones houden elk tappunt op ten hoogste %m bar.', '%z zones de pression maintiennent chaque point à %m bar au plus.', '%z zonas de presión mantienen cada punto en %m bar como máximo.', '%z strefy ciśnienia utrzymują każdy punkt najwyżej na %m bar.'),
  'fl.zone_infeasible': T7('Even a single floor cannot stay below %m bar with the required flow pressure and losses — check the limit and the minimum flow pressure.', 'Навіть один поверх не може лишатися нижче %m бар з потрібним тиском і втратами — перевірте межу та мінімальний тиск.', 'Selbst ein einzelnes Geschoss bleibt mit dem nötigen Fließdruck und den Verlusten nicht unter %m bar — Grenze und Mindestfließdruck prüfen.', 'Zelfs één verdieping blijft met de nodige stromingsdruk en verliezen niet onder %m bar — controleer de grens en de minimale stromingsdruk.', 'Même un seul étage ne reste pas sous %m bar avec la pression requise et les pertes — vérifier la limite et la pression minimale.', 'Ni una sola planta queda por debajo de %m bar con la presión requerida y las pérdidas: revise el límite y la presión mínima.', 'Nawet pojedyncza kondygnacja nie mieści się poniżej %m bar przy wymaganym ciśnieniu i stratach — sprawdź granicę i ciśnienie minimalne.'),
  'fl.starts_exceeded': T7('The installed %v L vessel allows %z starts per hour — more than the %x allowed; take the sized vessel or a larger one.', 'Встановлений бак %v л дає %z пусків за годину — більше за допустимі %x; візьміть підібраний або більший бак.', 'Der vorhandene Behälter %v L ergibt %z Schaltungen pro Stunde — mehr als die zulässigen %x; bemessenen oder größeren Behälter nehmen.', 'Het geplaatste vat van %v L geeft %z starts per uur — meer dan de toegelaten %x; neem het gedimensioneerde of een groter vat.', 'Le réservoir installé de %v L donne %z démarrages par heure — plus que les %x admis ; prendre le réservoir dimensionné ou plus grand.', 'El depósito instalado de %v L da %z arranques por hora, más que los %x admitidos: use el dimensionado o uno mayor.', 'Zainstalowany zbiornik %v L daje %z załączeń na godzinę — więcej niż dopuszczalne %x; weź dobrany lub większy zbiornik.'),
  'fl.din_range': T7('ΣQa of the boosted part is %s l/s, outside the 0.2–500 l/s range of the DIN 1988-300 curve — the peak flow %q l/s is an extrapolation; establish the demand independently (measurements, utility or operator data).', 'ΣQa частини з установкою — %s л/с, поза діапазоном 0,2–500 л/с кривої DIN 1988-300 — пікова витрата %q л/с є екстраполяцією; визначте потребу незалежно (вимірювання, дані водоканалу чи експлуатанта).', 'ΣQa des druckerhöhten Teils beträgt %s l/s, außerhalb des Bereichs 0,2–500 l/s der Kurve nach DIN 1988-300 — der Spitzendurchfluss %q l/s ist extrapoliert; den Bedarf unabhängig ermitteln (Messungen, Angaben von Versorger oder Betreiber).', 'ΣQa van het verhoogde deel is %s l/s, buiten het bereik 0,2–500 l/s van de DIN 1988-300-curve — het piekdebiet %q l/s is een extrapolatie; bepaal de vraag onafhankelijk (metingen, gegevens van waterleverancier of uitbater).', 'Le ΣQa de la partie surpressée vaut %s l/s, hors du domaine 0,2–500 l/s de la courbe DIN 1988-300 — le débit de pointe %q l/s est extrapolé ; établir la demande autrement (mesures, données du distributeur ou de l’exploitant).', 'El ΣQa de la parte servida por el grupo es %s l/s, fuera del rango 0,2–500 l/s de la curva DIN 1988-300: el caudal punta %q l/s es una extrapolación; determine la demanda de forma independiente (mediciones, datos de la compañía o del explotador).', 'ΣQa części z zestawem wynosi %s l/s, poza zakresem 0,2–500 l/s krzywej DIN 1988-300 — przepływ szczytowy %q l/s jest ekstrapolacją; ustal zapotrzebowanie niezależnie (pomiary, dane wodociągu lub użytkownika).'),
  'fl.tank_suction_negative': T7('With the suction-line loss the pump inlet is at %p bar, below atmospheric pressure — check NPSH with the pump data, raise the lowest tank level or shorten the suction line.', 'З урахуванням втрат у всмоктувальній лінії тиск на вході насоса %p бар, нижче атмосферного — перевірте NPSH за даними насоса, підніміть найнижчий рівень у баку або скоротіть всмоктувальну лінію.', 'Mit dem Saugleitungsverlust liegt der Pumpenzulauf bei %p bar, unter Atmosphärendruck — NPSH mit den Pumpendaten prüfen, den niedrigsten Wasserstand im Vorbehälter anheben oder die Saugleitung kürzen.', 'Met het verlies in de zuigleiding staat de pompinlaat op %p bar, onder de atmosferische druk — controleer de NPSH met de pompgegevens, verhoog het laagste peil in het reservoir of verkort de zuigleiding.', 'Avec la perte de la conduite d’aspiration, l’entrée de la pompe est à %p bar, sous la pression atmosphérique — vérifier le NPSH avec les données de la pompe, relever le niveau minimal de la bâche ou raccourcir l’aspiration.', 'Con la pérdida de la tubería de aspiración, la entrada de la bomba queda a %p bar, por debajo de la presión atmosférica: compruebe el NPSH con los datos de la bomba, eleve el nivel mínimo del depósito o acorte la aspiración.', 'Po uwzględnieniu straty w przewodzie ssawnym ciśnienie na wlocie pompy wynosi %p bar, poniżej atmosferycznego — sprawdź NPSH z danymi pompy, podnieś najniższy poziom w zbiorniku lub skróć przewód ssawny.'),
  'fl.no_fill': T7('Refill flow is zero — the break tank would never refill.', 'Витрата підживлення нульова — бак ніколи не наповниться.', 'Nachspeisedurchfluss null — der Vorbehälter würde nie nachgefüllt.', 'Vuldebiet nul — het reservoir zou nooit bijvullen.', 'Débit de remplissage nul — la bâche ne se remplirait jamais.', 'Caudal de llenado nulo: el depósito nunca se rellenaría.', 'Przepływ napełniania zerowy — zbiornik nigdy by się nie napełnił.'),
  'fl.tank_stagnation': T7('The break tank holds more than a day of the building’s use (water age %r h) — stagnation and warming; size it smaller or ask a larger refill flow (VDI 6023 hygiene).', 'Розривний бак вміщує понад добове споживання (вік води %r год) — застій і нагрівання; зменште бак або попросіть більше підживлення (гігієна VDI 6023).', 'Der Vorbehälter fasst mehr als einen Tagesbedarf (Wasseralter %r h) — Stagnation und Erwärmung; kleiner bemessen oder größeren Nachspeisedurchfluss beantragen (Hygiene VDI 6023).', 'Het reservoir bevat meer dan een dagverbruik (waterleeftijd %r u) — stilstand en opwarming; kleiner dimensioneren of een groter vuldebiet vragen (hygiëne VDI 6023).', 'La bâche contient plus d’un jour de consommation (âge de l’eau %r h) — stagnation et réchauffement ; la réduire ou demander un débit de remplissage plus grand (hygiène VDI 6023).', 'El depósito contiene más de un día de consumo (edad del agua %r h): estancamiento y calentamiento; redúzcalo o pida más caudal de llenado (higiene VDI 6023).', 'Zbiornik mieści więcej niż dobowe zużycie (wiek wody %r h) — stagnacja i nagrzewanie; zmniejsz go lub wystąp o większy przepływ napełniania (higiena VDI 6023).'),
  'n.qunit': T7('Utilisation unit: the DIN 1988-300 curve gives %c l/s, less than the two largest draw-offs of one unit (%t l/s) — the booster is sized for %q l/s.', 'Одиниця користування: крива DIN 1988-300 дає %c л/с, менше за дві найбільші точки водорозбору однієї одиниці (%t л/с) — установку підібрано на %q л/с.', 'Nutzungseinheit: die Kurve nach DIN 1988-300 ergibt %c l/s, weniger als die beiden größten Entnahmestellen einer Einheit (%t l/s) — die DEA wird für %q l/s bemessen.', 'Gebruikseenheid: de DIN 1988-300-curve geeft %c l/s, minder dan de twee grootste tappunten van één eenheid (%t l/s) — de hydrofoor wordt gedimensioneerd op %q l/s.', 'Unité d’utilisation : la courbe DIN 1988-300 donne %c l/s, moins que les deux plus grands points de puisage d’une unité (%t l/s) — le surpresseur est dimensionné pour %q l/s.', 'Unidad de uso: la curva DIN 1988-300 da %c l/s, menos que los dos mayores puntos de consumo de una unidad (%t l/s): el grupo se dimensiona para %q l/s.', 'Jednostka użytkowa: krzywa DIN 1988-300 daje %c l/s, mniej niż dwa największe punkty czerpalne jednej jednostki (%t l/s) — zestaw dobrano na %q l/s.'),
  'n.suction': T7('Suction line: %l bar is subtracted from the inlet pressure — %i bar at the pump at design flow. NPSH is not checked here.', 'Всмоктувальна лінія: %l бар віднято від тиску на вході — %i бар на насосі при розрахунковій витраті. NPSH тут не перевіряється.', 'Saugleitung: %l bar werden vom Zulaufdruck abgezogen — %i bar an der Pumpe bei Spitzendurchfluss. NPSH wird hier nicht geprüft.', 'Zuigleiding: %l bar wordt van de inlaatdruk afgetrokken — %i bar aan de pomp bij ontwerpdebiet. NPSH wordt hier niet gecontroleerd.', 'Conduite d’aspiration : %l bar sont retranchés de la pression d’entrée — %i bar à la pompe au débit de calcul. Le NPSH n’est pas vérifié ici.', 'Tubería de aspiración: se restan %l bar de la presión de entrada: %i bar en la bomba con el caudal de diseño. El NPSH no se comprueba aquí.', 'Przewód ssawny: od ciśnienia na dopływie odjęto %l bar — %i bar przy pompie przy przepływie obliczeniowym. NPSH nie jest tu sprawdzane.'),

  'n.vessel': T7('Vessel: a step of %q l/s at %z starts/h needs %d L drawdown between %on and %off bar; pre-charge %p0 bar → %v L total.', 'Бак: крок %q л/с при %z пусках/год потребує %d л спрацювання між %on і %off бар; попередня накачка %p0 бар → %v л разом.', 'Behälter: eine Stufe von %q l/s bei %z Schaltungen/h braucht %d L Entnahmevolumen zwischen %on und %off bar; Vordruck %p0 bar → %v L gesamt.', 'Vat: een stap van %q l/s bij %z starts/u vraagt %d L aftapvolume tussen %on en %off bar; voordruk %p0 bar → %v L totaal.', 'Réservoir : un palier de %q l/s à %z démarrages/h demande %d L utiles entre %on et %off bar ; prégonflage %p0 bar → %v L au total.', 'Depósito: un escalón de %q l/s con %z arranques/h necesita %d L útiles entre %on y %off bar; precarga %p0 bar → %v L en total.', 'Zbiornik: stopień %q l/s przy %z załączeniach/h wymaga %d L objętości użytecznej między %on a %off bar; ciśnienie wstępne %p0 bar → %v L razem.'),
  'n.tank': T7('Break tank %v L: refill %f l/s, it turns over %t times a day (water age %r h). EN 1717: air gap AB above the overflow.', 'Розривний бак %v л: підживлення %f л/с, обмін %t разів на добу (вік води %r год). EN 1717: повітряний розрив AB над переливом.', 'Vorbehälter %v L: Nachspeisung %f l/s, %t-facher Wasserwechsel pro Tag (Wasseralter %r h). EN 1717: freier Auslauf AB über dem Überlauf.', 'Reservoir %v L: bijvullen %f l/s, %t keer per dag ververst (waterleeftijd %r u). EN 1717: luchtonderbreking AB boven de overloop.', 'Bâche %v L : remplissage %f l/s, renouvelée %t fois par jour (âge de l’eau %r h). EN 1717 : surverse totale AB au-dessus du trop-plein.', 'Depósito %v L: llenado %f l/s, se renueva %t veces al día (edad del agua %r h). EN 1717: separación de aire AB sobre el rebosadero.', 'Zbiornik %v L: napełnianie %f l/s, wymiana %t razy na dobę (wiek wody %r h). EN 1717: przerwa powietrzna AB nad przelewem.'),

  intro: {
    title: T7('What this tool does', 'Що робить цей інструмент', 'Was dieses Werkzeug tut', 'Wat deze tool doet', 'Ce que fait cet outil', 'Qué hace esta herramienta', 'Co robi to narzędzie'),
    body: T7('Mains pressure is spent on lifting water, on pipe friction and on the pressure the tap itself needs. This tool walks up the building floor by floor, finds where the mains runs out, and sizes the booster set that takes over: set pressure, pumps, vessel, break tank — and checks that the lower floors do not get too much pressure at night. Start with “Office 8 floors, 3.5 bar”.',
      'Тиск мережі витрачається на підйом води, тертя в трубах і тиск, потрібний самому крану. Інструмент іде будівлею поверх за поверхом, знаходить, де тиску мережі вже не вистачає, і підбирає установку, яка бере справу на себе: уставку, насоси, бак, розривний бак — і перевіряє, щоб нижні поверхи вночі не отримували зайвого тиску. Почніть з «Офіс 8 поверхів, 3,5 бар».',
      'Der Netzdruck wird für das Anheben des Wassers, für die Rohrreibung und für den Fließdruck der Armatur verbraucht. Das Werkzeug geht Geschoss für Geschoss nach oben, findet, wo der Netzdruck nicht mehr reicht, und bemisst die Druckerhöhungsanlage: Solldruck, Pumpen, Behälter, Vorbehälter — und prüft, dass die unteren Geschosse nachts nicht zu viel Druck bekommen. Beginnen Sie mit „Büro 8 Geschosse, 3,5 bar“.',
      'De netdruk gaat op aan het opheffen van het water, aan leidingwrijving en aan de druk die de kraan zelf nodig heeft. De tool loopt het gebouw verdieping per verdieping op, vindt waar de netdruk tekortschiet en dimensioneert de hydrofoor die het overneemt: insteldruk, pompen, vat, reservoir — en controleert dat de onderste verdiepingen ’s nachts niet te veel druk krijgen. Begin met “Kantoor 8 verdiepingen, 3,5 bar”.',
      'La pression du réseau sert à monter l’eau, à vaincre le frottement et à fournir la pression que le robinet demande. L’outil monte le bâtiment étage par étage, trouve où le réseau ne suffit plus et dimensionne le surpresseur qui prend le relais : consigne, pompes, réservoir, bâche — et vérifie que les étages bas ne reçoivent pas trop de pression la nuit. Commencez par « Bureaux 8 niveaux, 3,5 bar ».',
      'La presión de red se gasta en elevar el agua, en el rozamiento y en la presión que necesita el propio grifo. La herramienta sube el edificio planta por planta, encuentra dónde la red ya no basta y dimensiona el grupo de presión que toma el relevo: consigna, bombas, depósito, depósito de rotura — y comprueba que las plantas bajas no reciban demasiada presión de noche. Empiece con «Oficinas 8 plantas, 3,5 bar».',

  topics: {
    balance: { title: T7('The pressure balance', 'Баланс тиску', 'Die Druckbilanz', 'De drukbalans', 'Le bilan de pression', 'El balance de presión', 'Bilans ciśnienia'),
      body: T7('At the governing outlet of each floor you need its minimum flow pressure (≈ 1 bar for a thermostatic shower). To get there the water must climb h metres (0.098 bar per metre) and overcome pipe friction. What the mains offers is its MINIMUM pressure (the utility’s guaranteed value, not the usual one) minus the water meter and the devices at the entrance (backflow preventer, filter, softener) at design flow. If the balance is negative on any floor, a booster is needed. A suction line between the tank or the mains connection and the pump costs its own friction at design flow: enter it as “suction line loss” — it is subtracted from the inlet pressure and adds to the head. Cavitation (NPSH) is a separate check with the pump data.',
        'У розрахунковій точці кожного поверху потрібен мінімальний тиск витікання (≈ 1 бар для термостатичного душу). Щоб дійти туди, вода має піднятися на h метрів (0,098 бар на метр) і подолати тертя. Мережа пропонує свій МІНІМАЛЬНИЙ тиск (гарантований водоканалом, а не звичний) мінус лічильник і пристрої на вводі (зворотний захист, фільтр, пом’якшувач) при розрахунковій витраті. Якщо баланс від’ємний хоч на одному поверсі — потрібна установка. Всмоктувальна лінія між баком чи вузлом приєднання та насосом має власне тертя при розрахунковій витраті: введіть його як «втрати у всмоктувальній лінії» — їх віднімають від тиску на вході, і напір зростає. Кавітацію (NPSH) перевіряють окремо за даними насоса.',
        'An der maßgebenden Entnahmestelle jedes Geschosses wird ihr Mindestfließdruck gebraucht (≈ 1 bar bei einem Brausethermostat). Dafür muss das Wasser h Meter steigen (0,098 bar je Meter) und die Rohrreibung überwinden. Das Netz bietet seinen MINDEST-Versorgungsdruck (den garantierten Wert des Versorgers, nicht den üblichen) abzüglich Wasserzähler und Armaturen am Hausanschluss (Sicherungsarmatur, Filter, Enthärtung) bei Spitzendurchfluss. Ist die Bilanz in irgendeinem Geschoss negativ, braucht es eine Druckerhöhung. Eine Saugleitung zwischen Vorbehälter bzw. Netzanschluss und Pumpe hat bei Spitzendurchfluss eigene Reibungsverluste: als „Saugleitungsverlust“ eingeben — er wird vom Zulaufdruck abgezogen und erhöht die Förderhöhe. Kavitation (NPSH) ist eine eigene Prüfung mit den Pumpendaten.',
        'Aan het maatgevende tappunt van elke verdieping is de minimale stromingsdruk nodig (≈ 1 bar voor een thermostatische douche). Daarvoor moet het water h meter stijgen (0,098 bar per meter) en de leidingwrijving overwinnen. Het net biedt zijn MINIMALE druk (de gegarandeerde waarde van de waterleverancier, niet de gebruikelijke) min de watermeter en de toestellen aan de inkomst (terugstroombeveiliging, filter, ontharder) bij ontwerpdebiet. Is de balans op een verdieping negatief, dan is een hydrofoor nodig. Een zuigleiding tussen reservoir of netaansluiting en pomp heeft bij ontwerpdebiet een eigen wrijvingsverlies: voer het in als “verlies zuigleiding” — het wordt van de inlaatdruk afgetrokken en verhoogt de opvoerhoogte. Cavitatie (NPSH) is een aparte controle met de pompgegevens.',
        'Au point déterminant de chaque étage, il faut sa pression minimale d’écoulement (≈ 1 bar pour une douche thermostatique). Pour y arriver, l’eau doit monter de h mètres (0,098 bar par mètre) et vaincre le frottement. Le réseau offre sa pression MINIMALE (la valeur garantie par le distributeur, pas l’habituelle) moins le compteur et les appareils à l’entrée (disconnecteur, filtre, adoucisseur) au débit de calcul. Si le bilan est négatif à un étage, il faut un surpresseur. Une conduite d’aspiration entre la bâche ou le raccordement et la pompe a son propre frottement au débit de calcul : saisissez-le comme « perte de la conduite d’aspiration » — il est retranché de la pression d’entrée et s’ajoute à la hauteur. La cavitation (NPSH) se vérifie à part avec les données de la pompe.',
        'En el punto determinante de cada planta se necesita su presión mínima de flujo (≈ 1 bar para una ducha termostática). Para llegar, el agua debe subir h metros (0,098 bar por metro) y vencer el rozamiento. La red ofrece su presión MÍNIMA (la garantizada por la compañía, no la habitual) menos el contador y los dispositivos de la acometida (antirretorno, filtro, descalcificador) con el caudal de diseño. Si el balance es negativo en alguna planta, hace falta un grupo de presión. Una tubería de aspiración entre el depósito o la acometida y la bomba tiene su propio rozamiento con el caudal de diseño: introdúzcalo como «pérdida de la tubería de aspiración»; se resta de la presión de entrada y aumenta la altura. La cavitación (NPSH) es una comprobación aparte con los datos de la bomba.',
        'W punkcie miarodajnym każdej kondygnacji potrzebne jest jego minimalne ciśnienie wypływu (≈ 1 bar dla natrysku z termostatem). Aby tam dotrzeć, woda musi wznieść się o h metrów (0,098 bar na metr) i pokonać opory tarcia. Sieć oferuje swoje MINIMALNE ciśnienie (gwarantowane przez wodociąg, a nie zwykłe) pomniejszone o wodomierz i urządzenia na przyłączu (zabezpieczenie, filtr, zmiękczacz) przy przepływie obliczeniowym. Jeśli bilans jest ujemny na którejkolwiek kondygnacji, potrzebny jest zestaw. Przewód ssawny między zbiornikiem lub przyłączem a pompą ma własne opory przy przepływie obliczeniowym: wpisz je jako „strata w przewodzie ssawnym” — odejmuje się ją od ciśnienia na dopływie i zwiększa wysokość podnoszenia. Kawitację (NPSH) sprawdza się osobno z danymi pompy.') },
    zoning: { title: T7('Which floors to boost', 'Які поверхи підключати до установки', 'Welche Geschosse druckerhöht werden', 'Welke verdiepingen verhogen', 'Quels étages surpresser', 'Qué plantas servir con el grupo', 'Które kondygnacje zasilać z zestawu'),
      body: T7('Lower floors often work on the mains. Leaving them there (“lower floors on the mains”) makes the booster smaller — it carries only the peak flow of the upper part — and saves energy, because the water for the lower floors is not lifted by the pump. The price is a second riser system. With a break tank every floor behind it must be boosted, because the tank breaks the mains pressure.',
        'Нижні поверхи часто працюють від мережі. Якщо залишити їх так («нижні поверхи від мережі»), установка менша — вона несе лише пікову витрату верхньої частини — і економить енергію, бо воду для нижніх поверхів насос не піднімає. Ціна — друга система стояків. З розривним баком усі поверхи за ним мають живитися від установки, бо бак «скидає» тиск мережі.',
        'Untere Geschosse funktionieren oft am Netz. Bleiben sie dort („untere Geschosse am Netz“), wird die Anlage kleiner — sie trägt nur den Spitzendurchfluss des oberen Teils — und spart Energie, weil das Wasser der unteren Geschosse nicht von der Pumpe gehoben wird. Der Preis ist ein zweites Strangsystem. Mit Vorbehälter muss alles dahinter druckerhöht werden, denn der Behälter unterbricht den Netzdruck.',
        'Onderste verdiepingen werken vaak op netdruk. Laat u ze daar (“onderste verdiepingen op het net”), dan wordt de hydrofoor kleiner — hij draagt alleen het piekdebiet van het bovenste deel — en bespaart hij energie, omdat het water voor de onderste verdiepingen niet door de pomp wordt opgeheven. De prijs is een tweede stijgleidingsysteem. Met een reservoir moet alles erachter verhoogd worden, want het reservoir onderbreekt de netdruk.',
        'Les étages bas fonctionnent souvent sur le réseau. Les y laisser (« étages bas sur le réseau ») réduit le surpresseur — il ne porte que la pointe de la partie haute — et économise de l’énergie, car l’eau des étages bas n’est pas relevée par la pompe. Le prix : un second réseau de colonnes. Avec une bâche, tout ce qui est derrière doit être surpressé, car la bâche casse la pression du réseau.',
        'Las plantas bajas a menudo funcionan con la red. Dejarlas así («plantas bajas desde la red») reduce el grupo —solo lleva la punta de la parte alta— y ahorra energía, porque el agua de las plantas bajas no la eleva la bomba. El precio es un segundo sistema de montantes. Con depósito de rotura todo lo que va detrás debe ir con grupo, porque el depósito rompe la presión de red.',
        'Dolne kondygnacje często działają na ciśnieniu sieci. Pozostawienie ich tak („dolne kondygnacje z sieci”) zmniejsza zestaw — przenosi on tylko przepływ szczytowy górnej części — i oszczędza energię, bo wody dla dolnych kondygnacji pompa nie podnosi. Ceną jest drugi układ pionów. Ze zbiornikiem przerywającym wszystko za nim musi być zasilane z zestawu, bo zbiornik przerywa ciśnienie sieci.') },
    peak: { title: T7('Design flow', 'Розрахункова витрата', 'Spitzendurchfluss', 'Ontwerpdebiet', 'Débit de calcul', 'Caudal de diseño', 'Przepływ obliczeniowy'),
      body: T7('Not every tap runs at once. DIN 1988-300 turns the sum of the fixture design flows ΣQa into a peak flow Q = a·(ΣQa)^b − c with constants per building type; plbsupply does the same and hands its flow over. For split zoning the tool applies the formula to the boosted share of ΣQa (equal floors assumed), which is why the pump gets smaller faster than the number of floors. Inside one utilisation unit (a bathroom, a kitchen) usually no more than two draw-offs run at once, so DIN 1988-300 takes the sum of the two largest there. If the booster serves only one or two units, enter that sum — the flow is not taken below it. The curve is stated for ΣQa 0.2–500 l/s; outside that range the tool warns.',
        'Не всі крани працюють одночасно. DIN 1988-300 перетворює суму розрахункових витрат приладів ΣQa на пікову витрату Q = a·(ΣQa)^b − c з константами для типу будівлі; plbsupply робить те саме й передає свою витрату. При поділі на зони інструмент застосовує формулу до частки ΣQa, що живиться від установки (поверхи однакові), — тому насос зменшується швидше, ніж кількість поверхів. У межах однієї одиниці користування (ванна кімната, кухня) зазвичай відкрито не більше двох точок водорозбору, тож DIN 1988-300 бере там суму двох найбільших. Якщо установка живить лише одну-дві одиниці, введіть цю суму — витрату не беруть меншою. Крива наведена для ΣQa 0,2–500 л/с; поза цим діапазоном інструмент попереджає.',
        'Nicht alle Zapfstellen laufen gleichzeitig. DIN 1988-300 macht aus der Summe der Berechnungsdurchflüsse ΣQa den Spitzendurchfluss Q = a·(ΣQa)^b − c mit Konstanten je Gebäudeart; plbsupply tut dasselbe und übergibt seinen Durchfluss. Bei Teilversorgung wendet das Werkzeug die Formel auf den druckerhöhten Anteil von ΣQa an (gleiche Geschosse), deshalb schrumpft die Pumpe schneller als die Zahl der Geschosse. Innerhalb einer Nutzungseinheit (Bad, Küche) sind meist nicht mehr als zwei Entnahmestellen gleichzeitig offen; DIN 1988-300 setzt dort die Summe der beiden größten an. Versorgt die DEA nur ein bis zwei Einheiten, diese Summe eingeben — der Durchfluss wird nicht kleiner angesetzt. Die Kurve gilt für ΣQa 0,2–500 l/s; außerhalb warnt das Werkzeug.',
        'Niet alle kranen lopen tegelijk. DIN 1988-300 maakt van de som van de rekendebieten ΣQa een piekdebiet Q = a·(ΣQa)^b − c met constanten per gebouwtype; plbsupply doet hetzelfde en geeft zijn debiet door. Bij gedeelde voeding past de tool de formule toe op het verhoogde aandeel van ΣQa (gelijke verdiepingen), daarom krimpt de pomp sneller dan het aantal verdiepingen. Binnen één gebruikseenheid (badkamer, keuken) staan meestal niet meer dan twee tappunten tegelijk open; DIN 1988-300 neemt daar de som van de twee grootste. Bedient de hydrofoor maar één of twee eenheden, voer die som in — het debiet wordt niet lager genomen. De curve geldt voor ΣQa 0,2–500 l/s; daarbuiten waarschuwt de tool.',
        'Tous les robinets ne coulent pas en même temps. La DIN 1988-300 transforme la somme des débits de calcul ΣQa en débit de pointe Q = a·(ΣQa)^b − c avec des constantes par type de bâtiment ; plbsupply fait de même et transmet son débit. En alimentation partagée, l’outil applique la formule à la part surpressée de ΣQa (étages égaux) : la pompe diminue plus vite que le nombre d’étages. Dans une unité d’utilisation (salle de bains, cuisine), pas plus de deux points de puisage ne sont en général ouverts ensemble ; la DIN 1988-300 y prend la somme des deux plus grands. Si le surpresseur ne dessert qu’une ou deux unités, saisissez cette somme — le débit n’est pas pris plus bas. La courbe est donnée pour ΣQa 0,2–500 l/s ; au-delà, l’outil avertit.',
        'No todos los grifos funcionan a la vez. DIN 1988-300 convierte la suma de caudales de cálculo ΣQa en un caudal punta Q = a·(ΣQa)^b − c con constantes por tipo de edificio; plbsupply hace lo mismo y traspasa su caudal. Con alimentación dividida la herramienta aplica la fórmula a la parte de ΣQa servida por el grupo (plantas iguales), por eso la bomba se reduce más deprisa que el número de plantas. Dentro de una unidad de uso (un baño, una cocina) no suelen abrirse más de dos puntos de consumo a la vez; DIN 1988-300 toma allí la suma de los dos mayores. Si el grupo sirve solo una o dos unidades, introduzca esa suma: el caudal no se toma menor. La curva se da para ΣQa 0,2–500 l/s; fuera de ese rango la herramienta avisa.',
        'Nie wszystkie punkty czerpalne pracują naraz. DIN 1988-300 zamienia sumę przepływów obliczeniowych ΣQa na przepływ szczytowy Q = a·(ΣQa)^b − c ze stałymi dla rodzaju budynku; plbsupply robi to samo i przekazuje swój przepływ. Przy podziale zasilania narzędzie stosuje wzór do udziału ΣQa zasilanego z zestawu (jednakowe kondygnacje), dlatego pompa maleje szybciej niż liczba kondygnacji. W jednej jednostce użytkowej (łazienka, kuchnia) zwykle otwarte są najwyżej dwa punkty czerpalne naraz; DIN 1988-300 przyjmuje tam sumę dwóch największych. Jeśli zestaw zasila tylko jedną lub dwie jednostki, wpisz tę sumę — przepływu nie przyjmuje się mniejszego. Krzywa podana jest dla ΣQa 0,2–500 l/s; poza tym zakresem narzędzie ostrzega.') },
    static: { title: T7('Too much pressure below', 'Зависокий тиск унизу', 'Zu viel Druck unten', 'Te veel druk onderaan', 'Trop de pression en bas', 'Demasiada presión abajo', 'Za wysokie ciśnienie na dole'),
      body: T7('The booster is set for the top floor. When nobody draws water, the friction losses vanish and the lower floors see the full set pressure plus the switching band minus only their height. Above 5 bar static, taps are noisy, splash and wear; DIN 1988-200 asks for a pressure reducing valve, EN 806-2 recommends at most 500 kPa. Two fixes: a PRV on each floor that exceeds it, or pressure zones — the booster feeds the top zone, a zone PRV station feeds the next one down. With a direct connection the mains night pressure also passes the stopped pumps: the source of the static pressure is the higher of the cut-out pressure and the maximum mains pressure at the pump — if the mains is the higher one, a PRV upstream of the booster helps.',
        'Установку налаштовують на верхній поверх. Коли ніхто не бере воду, втрати на тертя зникають, і нижні поверхи бачать повну уставку плюс діапазон перемикання мінус лише свою висоту. Понад 5 бар статики крани шумлять, бризкають і зношуються; DIN 1988-200 вимагає редуктор, EN 806-2 рекомендує щонайбільше 500 кПа. Два рішення: редуктор на кожному поверсі з перевищенням або зони тиску — установка живить верхню зону, зональна редукційна станція — нижчу. При прямому приєднанні нічний тиск мережі теж проходить крізь зупинені насоси: джерелом статичного тиску є більший із тиску вимкнення та максимального тиску мережі біля насоса — якщо більший тиск мережі, допоможе редуктор перед установкою.',
        'Die Anlage wird für das oberste Geschoss eingestellt. Ohne Zapfung entfallen die Reibungsverluste, und die unteren Geschosse sehen den vollen Solldruck plus Schaltdifferenz abzüglich nur ihrer Höhe. Über 5 bar Ruhedruck rauschen und spritzen Armaturen und verschleißen; DIN 1988-200 verlangt einen Druckminderer, EN 806-2 empfiehlt höchstens 500 kPa. Zwei Lösungen: ein Druckminderer in jedem betroffenen Geschoss oder Druckzonen — die Anlage speist die obere Zone, eine Zonen-Druckminderstation die nächste darunter. Beim unmittelbaren Anschluss wirkt der nächtliche Netzdruck auch über die stehenden Pumpen: maßgebend für den Ruhedruck ist der höhere Wert aus Ausschaltdruck und maximalem Netzdruck an der Pumpe — ist es der Netzdruck, hilft ein Druckminderer vor der DEA.',
        'De hydrofoor wordt ingesteld op de bovenste verdieping. Als niemand tapt, vallen de wrijvingsverliezen weg en zien de onderste verdiepingen de volle insteldruk plus de schakelband min alleen hun hoogte. Boven 5 bar statisch worden kranen lawaaierig, spatten ze en slijten ze; DIN 1988-200 vraagt een drukverminderaar, EN 806-2 beveelt hoogstens 500 kPa aan. Twee oplossingen: een drukverminderaar op elke verdieping die overschrijdt, of drukzones — de hydrofoor voedt de bovenste zone, een zonedrukverminderaar de volgende eronder. Bij een directe aansluiting komt de nachtelijke netdruk ook door de stilstaande pompen: de bron van de statische druk is de hoogste van de uitschakeldruk en de maximale netdruk aan de pomp — is dat de netdruk, dan helpt een drukverminderaar vóór de hydrofoor.',
        'Le surpresseur est réglé pour l’étage le plus haut. Quand personne ne puise, les pertes disparaissent et les étages bas voient toute la consigne plus l’écart de commutation, moins leur seule hauteur. Au-delà de 5 bar statiques, les robinets sont bruyants, éclaboussent et s’usent ; la DIN 1988-200 demande un réducteur, l’EN 806-2 recommande 500 kPa au plus. Deux solutions : un réducteur à chaque étage en dépassement, ou des zones de pression — le surpresseur alimente la zone haute, une station de réduction la zone suivante. En raccordement direct, la pression nocturne du réseau traverse aussi les pompes arrêtées : la source de la pression statique est la plus élevée entre la pression d’arrêt et la pression maximale du réseau à la pompe — si c’est le réseau, un réducteur en amont du surpresseur suffit.',
        'El grupo se ajusta para la planta más alta. Cuando nadie consume, desaparecen las pérdidas y las plantas bajas ven toda la consigna más el diferencial, menos solo su altura. Por encima de 5 bar estáticos los grifos hacen ruido, salpican y se desgastan; DIN 1988-200 pide una reductora, EN 806-2 recomienda 500 kPa como máximo. Dos soluciones: una reductora en cada planta que lo supere, o zonas de presión — el grupo alimenta la zona alta y una estación reductora la siguiente. Con conexión directa la presión nocturna de la red también pasa por las bombas paradas: la fuente de la presión estática es la mayor entre la presión de paro y la presión máxima de la red en la bomba; si es la red, ayuda una reductora antes del grupo.',
        'Zestaw ustawia się na najwyższą kondygnację. Gdy nikt nie pobiera wody, straty tarcia znikają i dolne kondygnacje widzą pełne ciśnienie zadane plus histerezę minus tylko swoją wysokość. Powyżej 5 bar statycznie baterie hałasują, chlapią i szybciej się zużywają; DIN 1988-200 wymaga reduktora, EN 806-2 zaleca najwyżej 500 kPa. Dwa rozwiązania: reduktor na każdej kondygnacji z przekroczeniem albo strefy ciśnienia — zestaw zasila strefę górną, strefowa stacja redukcyjna kolejną niżej. Przy podłączeniu bezpośrednim nocne ciśnienie sieci przechodzi też przez zatrzymane pompy: źródłem ciśnienia statycznego jest wyższe z ciśnienia wyłączenia i maksymalnego ciśnienia sieci przy pompie — jeśli to sieć, pomoże reduktor przed zestawem.') },
    vessel: { title: T7('Vessel and starts per hour', 'Бак і пуски за годину', 'Behälter und Schalthäufigkeit', 'Vat en starts per uur', 'Réservoir et démarrages', 'Depósito y arranques por hora', 'Zbiornik i liczba załączeń'),
      body: T7('A pump switched by pressure cycles fastest when the demand is half its flow: then each cycle draws V_d = Q·T/4 from the vessel. The gas cushion only gives that volume between cut-in and cut-out pressure, so the vessel is V = V_d / [p0·(1/p_on − 1/p_off)] in absolute pressures. A fixed-speed cascade must bridge a whole pump; a variable-speed set only its small stop flow, so its vessel is several times smaller. Drinking-water vessels must be flow-through (DIN 1988-500).',
        'Насос, що вмикається за тиском, циклує найчастіше, коли відбір дорівнює половині його витрати: тоді кожен цикл бере з бака V_d = Q·T/4. Газова подушка віддає цей об’єм лише між тиском вмикання й вимикання, тож бак V = V_d / [p0·(1/p_вкл − 1/p_вимк)] в абсолютних тисках. Каскад сталої швидкості має перекрити цілий насос, частотна установка — лише малу витрату зупинки, тому її бак у кілька разів менший. Баки для питної води мають бути проточними (DIN 1988-500).',
        'Eine druckgeschaltete Pumpe schaltet am häufigsten, wenn der Bedarf die Hälfte ihres Förderstroms ist: dann entnimmt jeder Zyklus V_d = Q·T/4 aus dem Behälter. Das Gaspolster liefert dieses Volumen nur zwischen Ein- und Ausschaltdruck, also V = V_d / [p0·(1/p_ein − 1/p_aus)] mit Absolutdrücken. Eine Kaskade mit fester Drehzahl muss eine ganze Pumpe überbrücken, eine drehzahlgeregelte Anlage nur ihren kleinen Abschaltdurchfluss — ihr Behälter ist um ein Mehrfaches kleiner. Trinkwasserbehälter müssen durchströmt sein (DIN 1988-500).',
        'Een drukgeschakelde pomp schakelt het vaakst als de vraag de helft van haar debiet is: dan haalt elke cyclus V_d = Q·T/4 uit het vat. Het gaskussen geeft dat volume alleen tussen in- en uitschakeldruk, dus V = V_d / [p0·(1/p_aan − 1/p_uit)] in absolute drukken. Een cascade met vast toerental moet een hele pomp overbruggen, een toerentalgeregelde groep alleen haar kleine stopdebiet — haar vat is daardoor meerdere keren kleiner. Drinkwatervaten moeten doorstroomd zijn (DIN 1988-500).',
        'Une pompe commandée par pressostat cycle le plus vite quand la demande vaut la moitié de son débit : chaque cycle puise alors V_d = Q·T/4 dans le réservoir. Le coussin de gaz ne fournit ce volume qu’entre pression d’enclenchement et d’arrêt, donc V = V_d / [p0·(1/p_enc − 1/p_arrêt)] en pressions absolues. Une cascade à vitesse fixe doit couvrir une pompe entière, un groupe à vitesse variable seulement son petit débit d’arrêt — son réservoir est plusieurs fois plus petit. Les réservoirs d’eau potable doivent être à circulation (DIN 1988-500).',
        'Una bomba gobernada por presostato arranca con más frecuencia cuando la demanda es la mitad de su caudal: cada ciclo toma V_d = Q·T/4 del depósito. El colchón de gas solo da ese volumen entre la presión de arranque y la de paro, así que V = V_d / [p0·(1/p_arr − 1/p_paro)] en presiones absolutas. Una cascada de velocidad fija debe cubrir una bomba entera; un grupo de velocidad variable solo su pequeño caudal de paro, por eso su depósito es varias veces menor. Los depósitos de agua potable deben ser de flujo pasante (DIN 1988-500).',
        'Pompa sterowana presostatem załącza się najczęściej, gdy rozbiór wynosi połowę jej przepływu: wtedy każdy cykl pobiera ze zbiornika V_d = Q·T/4. Poduszka gazowa daje tę objętość tylko między ciśnieniem załączenia i wyłączenia, więc V = V_d / [p0·(1/p_zał − 1/p_wył)] w ciśnieniach bezwzględnych. Kaskada stałoobrotowa musi pokryć całą pompę, zestaw z przetwornicą tylko mały przepływ zatrzymania — jego zbiornik jest kilkakrotnie mniejszy. Zbiorniki wody pitnej muszą być przepływowe (DIN 1988-500).') },
    tank: { title: T7('Break tank', 'Розривний бак', 'Vorbehälter', 'Onderbrekingsreservoir', 'Bâche de disconnexion', 'Depósito de rotura de carga', 'Zbiornik przerywający'),
      body: T7('When the mains cannot give the peak flow, or the utility does not allow a pump on its main, the booster draws from an open tank filled through an air gap (EN 1717 type AB). The tank buffers the gap between peak demand and the refill flow the utility allows. But the tank throws the mains pressure away — the pump now lifts from zero — and a large tank holds water for more than a day: warm, stagnant water is a hygiene risk (VDI 6023). Size it for hours, not days.',
        'Коли мережа не дає пікову витрату або водоканал не дозволяє насос на своїй мережі, установка бере воду з відкритого бака, що наповнюється через повітряний розрив (EN 1717, тип AB). Бак згладжує різницю між піковим відбором і дозволеною витратою підживлення. Але бак «викидає» тиск мережі — насос тепер качає від нуля — а великий бак тримає воду понад добу: тепла застійна вода — гігієнічний ризик (VDI 6023). Розраховуйте на години, а не на дні.',
        'Kann das Netz den Spitzendurchfluss nicht liefern oder lässt der Versorger keine Pumpe an seiner Leitung zu, saugt die Anlage aus einem offenen Behälter, der über einen freien Auslauf (EN 1717 Typ AB) befüllt wird. Der Behälter puffert die Lücke zwischen Spitzenbedarf und zugelassener Nachspeisung. Aber er verschenkt den Netzdruck — die Pumpe fördert jetzt ab null — und ein großer Behälter hält das Wasser länger als einen Tag: warmes, stehendes Wasser ist ein Hygienerisiko (VDI 6023). Für Stunden bemessen, nicht für Tage.',
        'Kan het net het piekdebiet niet leveren of laat de waterleverancier geen pomp op zijn leiding toe, dan zuigt de hydrofoor uit een open reservoir dat via een luchtonderbreking (EN 1717 type AB) wordt gevuld. Het reservoir buffert het verschil tussen de piekvraag en het toegelaten vuldebiet. Maar het gooit de netdruk weg — de pomp vertrekt nu van nul — en een groot reservoir houdt het water langer dan een dag vast: warm, stilstaand water is een hygiënerisico (VDI 6023). Dimensioneer op uren, niet op dagen.',
        'Quand le réseau ne peut fournir la pointe, ou que le distributeur n’admet pas de pompe sur sa conduite, le surpresseur aspire dans une bâche ouverte remplie par une surverse totale (EN 1717 type AB). La bâche amortit l’écart entre la pointe et le débit de remplissage admis. Mais elle perd la pression du réseau — la pompe part de zéro — et une grande bâche garde l’eau plus d’un jour : une eau tiède et stagnante est un risque sanitaire (VDI 6023). La dimensionner en heures, pas en jours.',
        'Cuando la red no puede dar la punta, o la compañía no admite una bomba en su tubería, el grupo aspira de un depósito abierto llenado a través de una separación de aire (EN 1717 tipo AB). El depósito amortigua la diferencia entre la punta y el caudal de llenado admitido. Pero desperdicia la presión de red —la bomba parte de cero— y un depósito grande retiene el agua más de un día: el agua templada y estancada es un riesgo higiénico (VDI 6023). Dimensiónelo para horas, no para días.',
        'Gdy sieć nie daje przepływu szczytowego albo wodociąg nie pozwala na pompę na swoim przewodzie, zestaw pobiera wodę z otwartego zbiornika napełnianego przez przerwę powietrzną (EN 1717 typ AB). Zbiornik buforuje różnicę między szczytem a dopuszczonym przepływem napełniania. Ale traci ciśnienie sieci — pompa tłoczy od zera — a duży zbiornik trzyma wodę dłużej niż dobę: ciepła, stojąca woda to ryzyko higieniczne (VDI 6023). Dobieraj na godziny, nie na doby.') },
    energy: { title: T7('Pumps and energy', 'Насоси й енергія', 'Pumpen und Energie', 'Pompen en energie', 'Pompes et énergie', 'Bombas y energía', 'Pompy i energia'),
      body: T7('The duty pumps share the peak flow; one standby pump takes over on a failure (DIN 1988-500). Each pump delivers Q/n against the boost Δp; its shaft power is Q·Δp/η. Over a year the pumps lift every cubic metre of the boosted part by Δp: E = V·Δp/η. A variable-speed set holds the pressure without overshoot and keeps the static pressure lower; a fixed-speed cascade needs a wider switching band and a bigger vessel. The per-pump duty is handed to operatingpoint to check against a real pump curve.',
        'Робочі насоси ділять пікову витрату; один резервний підхоплює при відмові (DIN 1988-500). Кожен насос дає Q/n проти Δp; потужність на валу Q·Δp/η. За рік насоси піднімають кожен кубометр частини з установкою на Δp: E = V·Δp/η. Частотна установка тримає тиск без перевищення й знижує статичний тиск; каскад сталої швидкості потребує ширшого діапазону перемикання й більшого бака. Робоча точка насоса передається в operatingpoint для перевірки на реальній характеристиці.',
        'Die Betriebspumpen teilen sich den Spitzendurchfluss; eine Reservepumpe übernimmt bei Ausfall (DIN 1988-500). Jede Pumpe fördert Q/n gegen Δp; die Wellenleistung ist Q·Δp/η. Über ein Jahr heben die Pumpen jeden Kubikmeter des druckerhöhten Teils um Δp: E = V·Δp/η. Eine drehzahlgeregelte Anlage hält den Druck ohne Überschwingen und den Ruhedruck niedriger; eine Kaskade mit fester Drehzahl braucht eine größere Schaltdifferenz und einen größeren Behälter. Der Betriebspunkt je Pumpe geht an operatingpoint zum Abgleich mit einer echten Kennlinie.',
        'De bedrijfspompen delen het piekdebiet; één reservepomp neemt over bij uitval (DIN 1988-500). Elke pomp levert Q/n tegen Δp; het asvermogen is Q·Δp/η. Over een jaar heffen de pompen elke kubieke meter van het verhoogde deel met Δp: E = V·Δp/η. Een toerentalgeregelde groep houdt de druk zonder overshoot en houdt de statische druk lager; een cascade met vast toerental vraagt een bredere schakelband en een groter vat. Het werkpunt per pomp gaat naar operatingpoint om met een echte pompcurve te vergelijken.',
        'Les pompes de service se partagent la pointe ; une pompe de secours prend le relais en cas de panne (DIN 1988-500). Chaque pompe débite Q/n sous Δp ; sa puissance à l’arbre vaut Q·Δp/η. Sur l’année, les pompes relèvent chaque mètre cube de la partie surpressée de Δp : E = V·Δp/η. Un groupe à vitesse variable tient la pression sans dépassement et garde la pression statique plus basse ; une cascade à vitesse fixe demande un écart plus large et un réservoir plus grand. Le point de fonctionnement par pompe est transmis à operatingpoint pour le comparer à une vraie courbe.',
        'Las bombas de servicio se reparten la punta; una de reserva entra en caso de fallo (DIN 1988-500). Cada bomba da Q/n contra Δp; su potencia en el eje es Q·Δp/η. En un año las bombas elevan cada metro cúbico de la parte con grupo en Δp: E = V·Δp/η. Un grupo de velocidad variable mantiene la presión sin sobrepasarla y reduce la presión estática; una cascada de velocidad fija necesita un diferencial mayor y un depósito más grande. El punto de trabajo por bomba se traspasa a operatingpoint para compararlo con una curva real.',
        'Pompy robocze dzielą przepływ szczytowy; jedna rezerwowa przejmuje pracę przy awarii (DIN 1988-500). Każda pompa daje Q/n przy Δp; moc na wale to Q·Δp/η. W ciągu roku pompy podnoszą każdy metr sześcienny części z zestawem o Δp: E = V·Δp/η. Zestaw z przetwornicą utrzymuje ciśnienie bez przeregulowania i obniża ciśnienie statyczne; kaskada stałoobrotowa wymaga większej histerezy i większego zbiornika. Punkt pracy pompy przekazuje się do operatingpoint w celu porównania z rzeczywistą charakterystyką.') }

var ENG_KEYS = BST ? Object.keys(BST.DEFAULTS).filter(function (k) { return k !== 'peak' && k !== 'two_largest_lps'; }) : [];
function presetState(k) {
  var s = JSON.parse(JSON.stringify(BST.DEFAULTS)), p = BST.PRESETS[k]();
  Object.keys(p).forEach(function (x) { s[x] = p[x]; });
  if (s.peak) { s.q_mode = 'din'; s.bt = s.peak.bt || 'office'; s.sumQa = s.peak.sumQa; s.qmax = s.peak.maxSingle || 0; }
  else { s.q_mode = 'input'; s.bt = 'office'; s.sumQa = 28; s.qmax = 0.3; }
  s.tl = s.two_largest_lps || 0; delete s.two_largest_lps;
  delete s.peak; s.preset = k;
  return s;
}
var DEFAULTS = BST ? presetState('office_8f') : {};

function peakConsts(bt) {

  if (p) return { a: p.a, b: p.b, c: p.c };
  return BST.PEAK[bt] || BST.PEAK.office;
}
function engineInput() {
  var o = {};
  ENG_KEYS.forEach(function (k) { o[k] = state[k]; });
  if (state.q_mode === 'din') { var p = peakConsts(state.bt); o.peak = { a: p.a, b: p.b, c: p.c, sumQa: +state.sumQa, maxSingle: +state.qmax, bt: state.bt }; }
  else o.peak = null;
  /* r4 Y2-3: two largest draw-offs of one utilisation unit, 0 = not used */
  o.two_largest_lps = state.q_mode === 'din' && +state.tl !== 0 ? +state.tl : null;
  return o;
}
function solve() { return BST ? BST.solve(engineInput()) : null; }
