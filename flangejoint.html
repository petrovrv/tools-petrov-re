  "title": {"en":"Bolted flange joint check","uk":"Перевірка болтового фланцевого з’єднання","de":"Nachweis einer verschraubten Flanschverbindung","nl":"Controle van een geboute flensverbinding","fr":"Vérification d’un assemblage à brides boulonné","es":"Comprobación de una unión embridada atornillada","pl":"Sprawdzenie skręcanego złącza kołnierzowego"},
  "summary": {"en":"Bolt circle, bolt count and size, gasket factors m and y, design pressure and temperature in; required bolt load, bolt area, torque per bolt and gasket seating stress out, against the flange rating.","uk":"Вхід: коло болтів, кількість і розмір болтів, коефіцієнти прокладки m та y, розрахункові тиск і температура. Вихід: потрібне зусилля болтів, площа, момент затягування та напруження на прокладці.","de":"Eingabe: Lochkreis, Schraubenzahl und -größe, Dichtungskennwerte m und y, Auslegungsdruck und -temperatur. Ausgabe: erforderliche Schraubenkraft, Schraubenquerschnitt, Anziehmoment und Dichtungspressung.","nl":"In: steekcirkel, aantal en maat bouten, pakkingfactoren m en y, ontwerpdruk en -temperatuur. Uit: vereiste boutbelasting, boutoppervlak, aandraaimoment en pakkingspanning.","fr":"Entrées : cercle de perçage, nombre et taille des boulons, facteurs de joint m et y, pression et température de calcul. Sorties : effort de boulonnage, section, couple et contrainte sur le joint.","es":"Entradas: círculo de pernos, número y tamaño, factores de junta m e y, presión y temperatura de diseño. Salidas: carga de pernos, área, par de apriete y tensión sobre la junta.","pl":"Dane wejściowe: okrąg śrub, liczba i rozmiar śrub, współczynniki uszczelki m i y, ciśnienie i temperatura obliczeniowa. Dane wyjściowe: wymagane obciążenie śrub, przekrój śrub, moment na śrubę i nacisk dogniatający uszczelkę, odniesione do klasy kołnierza."},
  "description": {"en":"The minimum bolt loads of a gasketed joint, in the form of ASME VIII Division 1 Appendix 2: the operating load Wm1 from the hydrostatic end force and the gasket residual load, the seating load Wm2 from the gasket seating stress y, the required bolt area against the area actually installed, a torque per bolt from a nut factor, and the pressure against a pressure-temperature rating. It computes no flange stress: it sizes the bolting and the gasket load, not the flange.","uk":"Мінімальні зусилля болтів у формі ASME VIII Div. 1, Додаток 2: робоче зусилля Wm1, зусилля обтиснення Wm2, потрібна площа болтів проти встановленої, момент затягування через коефіцієнт тертя та тиск проти класу фланця. Напруження у фланці не обчислюються.","de":"Die Mindestschraubenkräfte einer Dichtungsverbindung nach ASME VIII Div. 1 Anhang 2: Betriebskraft Wm1, Vorpresskraft Wm2, erforderlicher Schraubenquerschnitt gegen den eingebauten, ein Anziehmoment aus dem Reibbeiwert und der Druck gegen die Druck-Temperatur-Klasse. Flanschspannungen werden nicht berechnet.","nl":"De minimale boutbelastingen van een pakkingverbinding volgens ASME VIII Div. 1 Appendix 2: bedrijfsbelasting Wm1, afdichtbelasting Wm2, vereist boutoppervlak tegen het geplaatste, een aandraaimoment uit een moerfactor en de druk tegen de druk-temperatuurklasse. Flensspanningen worden niet berekend.","fr":"Les efforts de boulonnage minimaux d’un assemblage à joint selon ASME VIII Div. 1 Appendice 2 : effort en service Wm1, effort d’écrasement Wm2, section de boulon requise face à celle installée, couple issu d’un facteur de frottement, et pression face à la classe pression-température. Les contraintes de bride ne sont pas calculées.","es":"Las cargas mínimas de pernos de una unión con junta según ASME VIII Div. 1 Apéndice 2: carga en servicio Wm1, carga de asiento Wm2, área de pernos requerida frente a la instalada, par a partir de un factor de apriete, y presión frente a la clase presión-temperatura. No calcula tensiones en la brida.","pl":"Minimalne obciążenia śrub złącza z uszczelką, w postaci wg ASME VIII Dział 1 Załącznik 2: obciążenie robocze Wm1 z hydrostatycznej siły dennej i pozostałego obciążenia uszczelki, obciążenie dogniatające Wm2 z nacisku dogniatającego uszczelkę y, wymagany przekrój śrub odniesiony do przekroju rzeczywiście zainstalowanego, moment na śrubę wyliczony ze współczynnika tarcia oraz ciśnienie odniesione do klasy ciśnienie–temperatura. Narzędzie nie oblicza naprężeń w kołnierzu: dobiera wyłącznie śruby i obciążenie uszczelki, nie sam kołnierz."},

  "limitations": {"en":"Bolting and gasket load only: no flange ring stress, no hub or shell analysis, no bolt bending, no external moment or axial load, no thermal transient, no relaxation, creep or bolt scatter. The gasket factors m and y are inputs, not looked-up values. The torque follows T = K d F with a single nut factor K, which is a lubrication estimate and can be wrong by a factor of two. The pressure-temperature ratings built in are an indicative transcription of ASME B16.5 group 1.1 (carbon steel) values, linearly interpolated in temperature, for teaching only — take the real rating from the standard, or type it in. Not a design calculation and not a substitute for a code check.","uk":"Лише болти та навантаження на прокладку: без напружень у кільці фланця, без згину болтів, без зовнішніх моментів, без повзучості й релаксації. Коефіцієнти m та y — вхідні дані. Момент T = K d F з єдиним коефіцієнтом K — оцінка, похибка може сягати двох разів. Вбудовані класи тиск-температура — орієнтовна транскрипція ASME B16.5, група 1.1, лише для навчання. Це не розрахунок за нормами.","de":"Nur Verschraubung und Dichtungskraft: keine Flanschringspannung, keine Schraubenbiegung, keine äußeren Momente, kein Kriechen, keine Relaxation, keine Anziehstreuung. m und y sind Eingaben. Das Moment folgt T = K d F mit einem einzigen Reibbeiwert K — eine Schätzung, die um den Faktor zwei danebenliegen kann. Die hinterlegten Druck-Temperatur-Klassen sind eine orientierende Abschrift von ASME B16.5 Gruppe 1.1 und dienen nur der Lehre. Kein Normnachweis.","nl":"Alleen bouten en pakkingbelasting: geen flensringspanning, geen boutbuiging, geen uitwendig moment, geen kruip, relaxatie of aandraaispreiding. m en y zijn invoer. Het moment volgt T = K d F met één moerfactor K — een schatting die een factor twee kan afwijken. De ingebouwde druk-temperatuurklassen zijn een indicatieve overname van ASME B16.5 groep 1.1, alleen voor onderwijs. Geen normtoets.","fr":"Boulonnage et effort sur le joint seulement : pas de contrainte d’anneau de bride, pas de flexion des boulons, pas de moment extérieur, pas de fluage, relaxation ni dispersion de serrage. m et y sont des entrées. Le couple suit T = K d F avec un seul facteur K — une estimation qui peut être fausse d’un facteur deux. Les classes pression-température intégrées sont une transcription indicative d’ASME B16.5 groupe 1.1, à usage pédagogique. Ce n’est pas une justification réglementaire.","es":"Solo pernos y carga sobre la junta: sin tensión del anillo de brida, sin flexión de pernos, sin momento exterior, sin fluencia, relajación ni dispersión de apriete. m e y son entradas. El par sigue T = K d F con un único factor K — una estimación que puede errar en un factor dos. Las clases presión-temperatura incorporadas son una transcripción indicativa de ASME B16.5 grupo 1.1, solo docente. No es una justificación de código.","pl":"Tylko śruby i obciążenie uszczelki: bez naprężeń pierścienia kołnierza, bez analizy piasty czy płaszcza, bez zginania śrub, bez momentu zewnętrznego ani obciążenia osiowego, bez stanu nieustalonego cieplnego, bez relaksacji, pełzania ani rozrzutu dokręcenia. Współczynniki uszczelki m i y są danymi wejściowymi, a nie wartościami wyszukiwanymi. Moment wyznaczany jest wg T = K d F z pojedynczym współczynnikiem tarcia K, co jest oszacowaniem zależnym od smarowania i może się mylić nawet dwukrotnie. Wbudowane klasy ciśnienie–temperatura są orientacyjną transkrypcją wartości ASME B16.5 grupy 1.1 (stal węglowa), interpolowaną liniowo w temperaturze, wyłącznie do celów dydaktycznych — rzeczywistą klasę należy zaczerpnąć z normy albo wpisać ręcznie. Nie jest to obliczenie projektowe ani zamiennik sprawdzenia zgodności z przepisami."},

/* flangejoint.html — tools.petrov.re UI framework v3, level 3.
 *
 *   1. the model      — pure functions, SI in and SI out, no DOM.
 *   2. the interface  — one DiagramUI.app({…}) declaration.
 *   3. the data layer — Diagram.init({state, record, python, handoff, report}).
 *
 * No <style> element, no CSS, no style attribute, no markup of its own on the
 * normal path, no h1, no export button, no language switcher, no localStorage
 * key. Every touch of the document is named here so the claim can be checked
 * rather than believed:
 *   - getComputedStyle, once, to read the theme tokens the chart draws with;
 *   - canvas.toDataURL, once, to put the chart into the PDF report;
 *   - document.readyState and one DOMContentLoaded listener, to boot;
 *   - inside degrade() only — reached when diagram-ui.js did not load and
 *     there is no framework left to render with — document.title, two
 *     createElement and two appendChild, for a heading and one sentence.
 * That is 0 bytes of CSS and 4 DOM-building calls, none of them on the path a
 * reader with a working browser takes. The chart pixels are the only pixels
 * this tool owns.
 */
(function () {
  'use strict';

  /* ============================================================ 1. the model
     Everything stored, recorded, permalinked and handed off is SI:
     metres, pascals, kelvin, newtons, newton-metres, square metres. */

  /* Tensile stress areas. Metric: ISO 898 coarse pitch. Imperial: UNC series.
     d is the nominal shank diameter, used for the torque arm. */
  var BOLTS = {
    'M12':  { d: 0.012,    As: 84.3e-6,  g: 'm' },
    'M16':  { d: 0.016,    As: 157.0e-6, g: 'm' },
    'M20':  { d: 0.020,    As: 245.0e-6, g: 'm' },
    'M24':  { d: 0.024,    As: 353.0e-6, g: 'm' },
    'M27':  { d: 0.027,    As: 459.0e-6, g: 'm' },
    'M30':  { d: 0.030,    As: 561.0e-6, g: 'm' },
    'M33':  { d: 0.033,    As: 694.0e-6, g: 'm' },
    'M36':  { d: 0.036,    As: 817.0e-6, g: 'm' },
    'M42':  { d: 0.042,    As: 1120.0e-6, g: 'm' },
    'M48':  { d: 0.048,    As: 1470.0e-6, g: 'm' },
    'M56':  { d: 0.056,    As: 2030.0e-6, g: 'm' },
    'M64':  { d: 0.064,    As: 2680.0e-6, g: 'm' },
    'UNC12': { d: 0.012700, As: 91.55e-6,  g: 'i', label: '1/2 in UNC' },
    'UNC58': { d: 0.015875, As: 145.81e-6, g: 'i', label: '5/8 in UNC' },
    'UNC34': { d: 0.019050, As: 215.48e-6, g: 'i', label: '3/4 in UNC' },
    'UNC78': { d: 0.022225, As: 298.06e-6, g: 'i', label: '7/8 in UNC' },
    'UNC10': { d: 0.025400, As: 390.97e-6, g: 'i', label: '1 in UNC' },
    'UNC118': { d: 0.028575, As: 492.26e-6, g: 'i', label: '1 1/8 in UNC' },
    'UNC114': { d: 0.031750, As: 625.16e-6, g: 'i', label: '1 1/4 in UNC' },
    'UNC138': { d: 0.034925, As: 745.16e-6, g: 'i', label: '1 3/8 in UNC' },
    'UNC112': { d: 0.038100, As: 906.45e-6, g: 'i', label: '1 1/2 in UNC' }
  };

  /* Indicative pressure-temperature ratings, bar gauge, ASME B16.5 group 1.1
     (carbon steel). Transcribed for teaching; see limitations. */
  var RATING_T = [38, 50, 100, 150, 200, 250, 300, 325, 350, 375, 400, 425, 450, 475, 500, 538];
  var RATING = {
    '150':  [19.6, 19.2, 17.7, 15.8, 13.8, 12.1, 10.2, 9.3, 8.4, 7.4, 6.5, 5.5, 4.6, 3.7, 2.8, 1.4],
    '300':  [51.1, 50.1, 46.6, 45.1, 43.8, 41.9, 39.8, 38.7, 37.6, 36.4, 34.7, 28.8, 23.0, 17.4, 11.8, 5.9],
    '600':  [102.1, 100.2, 93.2, 90.2, 87.6, 83.9, 79.6, 77.4, 75.1, 72.7, 69.4, 57.5, 46.0, 34.9, 23.5, 11.8],
    '900':  [153.2, 150.4, 139.8, 135.2, 131.4, 125.8, 119.5, 116.1, 112.7, 109.1, 104.2, 86.3, 69.0, 52.3, 35.3, 17.7],
    '1500': [255.3, 250.6, 233.0, 225.4, 219.0, 209.7, 199.1, 193.6, 187.8, 181.8, 173.6, 143.8, 115.0, 87.2, 58.8, 29.5],
    '2500': [425.5, 417.7, 388.3, 375.6, 365.0, 349.5, 331.8, 322.6, 313.0, 303.1, 289.3, 239.7, 191.7, 145.4, 97.9, 49.2]
  };

  /* rated pressure at a temperature, Pa. 'custom' returns what the user typed. */
  function ratingPa(cls, T, custom) {
    if (cls === 'custom') return custom;
    var tab = RATING[cls];
    if (!tab) return NaN;
    var t = T - 273.15;
    if (t <= RATING_T[0]) return tab[0] * 1e5;
    for (var i = 1; i < RATING_T.length; i++) {
      if (t <= RATING_T[i]) {
        var f = (t - RATING_T[i - 1]) / (RATING_T[i] - RATING_T[i - 1]);
        return (tab[i - 1] + f * (tab[i] - tab[i - 1])) * 1e5;
      }
    }
    return tab[tab.length - 1] * 1e5;
  }

  /* The cross-tightening sequence: take the bolt angularly farthest from every
     bolt already tightened. For 4, 8, 12 … this is the familiar star. */
  function starOrder(n) {
    var done = [0], left = [], i, k;
    for (i = 1; i < n; i++) left.push(i);
    while (left.length) {
      var best = 0, bestScore = -1;
      for (i = 0; i < left.length; i++) {
        var worst = 1e9;
        for (k = 0; k < done.length; k++) {
          var d = Math.abs(left[i] - done[k]) % n;
          d = Math.min(d, n - d);
          if (d < worst) worst = d;
        }
        if (worst > bestScore) { bestScore = worst; best = i; }
      }
      done.push(left[best]);
      left.splice(best, 1);
    }
    return done;
  }

  /* ASME VIII Div. 1 Appendix 2, in SI. s is the state object. */
  function solve(s) {
    var bolt = BOLTS[s.bolt] || BOLTS.UNC34;
    var N = (s.Go - s.Gi) / 2;                 /* gasket contact width, m */
    var b0 = N / 2;                            /* basic seating width, m */
    var b = b0 <= 0.00635 ? b0 : 0.07968943 * Math.sqrt(b0);   /* 2.52*sqrt(b0[mm]) mm */
    var G = b0 <= 0.00635 ? (s.Go + s.Gi) / 2 : s.Go - 2 * b;  /* load reaction diameter, m */
    var H = Math.PI / 4 * G * G * s.P;         /* hydrostatic end force, N */
    var Hp = 2 * b * Math.PI * G * s.m * s.P;  /* gasket residual load, N */
    var Wm1 = H + Hp;                          /* operating bolt load, N */
    var Wm2 = Math.PI * b * G * s.y;           /* seating bolt load, N */
    var Am1 = Wm1 / s.Sb;
    var Am2 = Wm2 / s.Sa;
    var Am = Math.max(Am1, Am2);               /* required bolt area, m2 */
    var Ab = s.n * bolt.As;                    /* installed bolt area, m2 */
    var Wt = Math.max(Wm1, Wm2);               /* target total bolt load, N */
    var Fb = Wt / s.n;                         /* per bolt, N */
    var Tb = s.K * bolt.d * Fb;                /* torque per bolt, N m */
    var SgEff = Wt / (Math.PI * G * b);        /* stress over the effective width, Pa */
    var SgCon = Wt / (Math.PI * G * N);        /* stress over the whole contact face, Pa */
    var sigmaB = Fb / bolt.As;                 /* bolt stress at the target load, Pa */
    var Prate = ratingPa(s.cls, s.T, s.Pcustom);
    var spacing = Math.PI * s.Bc / s.n;        /* bolt pitch on the circle, m */
    var passes = s.passes || [];
    var pt = [], pl = [], pg = [];
    for (var i = 0; i < passes.length; i++) {
      var f = (passes[i] && typeof passes[i].pct === 'number' ? passes[i].pct : 0) / 100;
      pt.push(f * Tb);
      pl.push(f * Fb);
      pg.push(f * SgEff);
    }
    return {
      bolt: bolt, N: N, b0: b0, b: b, G: G, H: H, Hp: Hp,
      Wm1: Wm1, Wm2: Wm2, Am1: Am1, Am2: Am2, Am: Am, Ab: Ab,
      boltRatio: Am / Ab, Wt: Wt, Fb: Fb, Tb: Tb,
      SgEff: SgEff, SgCon: SgCon, sigmaB: sigmaB,
      Prate: Prate, pRatio: s.P / Prate, gRatio: SgCon / s.ymax,
      spacing: spacing, spacingRatio: spacing / bolt.d,
      passT: pt, passF: pl, passS: pg,
      okBolts: Am <= Ab, okRating: s.P <= Prate, okGasket: SgCon <= s.ymax
    };
  }

  var DEFAULTS = {
    Bc: 0.2000,          /* bolt circle diameter, m */
    n: 8,                /* bolts */
    bolt: 'UNC34',
    Go: 0.14920,         /* gasket contact outside diameter, m */
    Gi: 0.11430,         /* gasket contact inside diameter, m */
    m: 3.00,             /* gasket factor */
    y: 68.9e6,           /* minimum design seating stress, Pa */
    ymax: 200e6,         /* maximum the gasket takes without crushing, Pa */
    P: 1.9e6,            /* design pressure, Pa */
    T: 373.15,           /* design temperature, K */
    cls: '300',
    Pcustom: 5.0e6,      /* rating typed in by hand, Pa */
    Sa: 172.4e6,         /* allowable bolt stress, ambient, Pa */
    Sb: 172.4e6,         /* allowable bolt stress at temperature, Pa */
    K: 0.20,             /* nut factor */
    passes: [{ label: '', pct: 30 }, { label: '', pct: 60 }, { label: '', pct: 100 }],
    us: 'metric'         /* display only; the state above is SI whatever this says */
  };

  var state = JSON.parse(JSON.stringify(DEFAULTS));
  var last = null;

  /* ======================================================== 2. the interface */

  function T(en, uk, de, nl, fr, es, pl) { return { en: en, uk: uk, de: de, nl: nl, fr: fr, es: es, pl: pl }; }

  var app = null;
  var stage = null;
  var INCH = false;   /* whether an inch entry could be registered, see boot() */

  function us() { return state.us === 'us'; }

  /* display units the tool converts itself: the registry carries nine SI bases
     and none of force, torque or stress (§4.2), so these are arithmetic in the
     model, never a `display:` that would relabel without converting. */
  function uLen()   { return us() && INCH ? { f: 39.37008, u: 'in', p: 2 } : { f: 1e3, u: 'mm', p: 1 }; }
  function uForce() { return us() ? { f: 2.248089e-4, u: 'kip', p: 2 } : { f: 1e-3, u: 'kN', p: 1 }; }
  function uTorq()  { return us() ? { f: 0.7375621, u: 'lbf·ft', p: 0 } : { f: 1, u: 'N·m', p: 0 }; }
  function uStress(){ return us() ? { f: 1 / 6894.757, u: 'psi', p: 0 } : { f: 1e-6, u: 'MPa', p: 1 }; }
  function uPress() { return us() ? { f: 1 / 6894.757, u: 'psi', p: 0 } : { f: 1e-5, u: 'bar', p: 2 }; }
  function uArea()  { return us() ? { f: 1550.0031, u: 'in²', p: 3 } : { f: 1e6, u: 'mm²', p: 0 }; }
  function cv(v, u) { return v * u.f; }
  function show(v, u) { return DiagramUI.fmt(v * u.f, { precision: u.p }) + ' ' + u.u; }

  /* the field `display` for a convertible SI base, re-read on every build */
  function lenDisp() { return us() && INCH ? 'in' : 'mm'; }
  function presDisp() { return us() ? 'psi' : 'bar'; }
  function tempDisp() { return us() ? 'degF' : 'degC'; }
  function stressDisp() { return us() ? 'psi' : 'MPa'; }

  function LEGEND_ITEMS() {
    return [
      { label: T('Operating bolt load Wm1', 'Робоче зусилля Wm1', 'Betriebskraft Wm1', 'Bedrijfsbelasting Wm1', 'Effort en service Wm1', 'Carga en servicio Wm1','Obciążenie robocze śrub Wm1'), series: 0 },
      { label: T('Seating bolt load Wm2', 'Зусилля обтиснення Wm2', 'Vorpresskraft Wm2', 'Afdichtbelasting Wm2', 'Effort d’écrasement Wm2', 'Carga de asiento Wm2','Obciążenie dogniatające śrub Wm2'), series: 1, dash: true },
      { label: T('Installed bolt capacity', 'Несуча здатність болтів', 'Tragfähigkeit der Schrauben', 'Capaciteit van de bouten', 'Capacité des boulons installés', 'Capacidad de los pernos','Nośność zainstalowanych śrub'), series: 2, dash: true }
    ];
  }
  function adoptStage(a) {
    stage = a.stages[0] || null;
    if (stage) stage.legend({ items: LEGEND_ITEMS() });
  }

  function passName(row, i) {
    if (row && row.label) return row.label;
    return T('Pass ' + (i + 1), 'Прохід ' + (i + 1), 'Durchgang ' + (i + 1),
             'Gang ' + (i + 1), 'Passe ' + (i + 1), 'Pasada ' + (i + 1),'Etap ' + (i + 1));
  }

  /* --------------------------------------------------------- the chart ---- */
  function drawChart(size, st) {
    var ctx = st.canvas(), w = size.w, h = size.h;
    var coarse = size.density === 'coarse';
    var cs = getComputedStyle(document.documentElement);
    var muted = cs.getPropertyValue('--muted').trim() || '#777';
    var line = cs.getPropertyValue('--line').trim() || '#ddd';
    ctx.clearRect(0, 0, w, h);
    if (!last) return;

    var up = uPress(), uf = uForce();
    var padL = coarse ? 44 : 58, padR = 12, padT = 12, padB = coarse ? 30 : 36;
    var pMax = Math.max(state.P, isFinite(last.Prate) ? last.Prate : 0) * 1.25 || 1;
    var loadAt = function (p) { return Math.PI / 4 * last.G * last.G * p + 2 * last.b * Math.PI * last.G * state.m * p; };
    var yMax = Math.max(loadAt(pMax), last.Wm2, last.Ab * state.Sb) * 1.1;
    var X = function (p) { return padL + (w - padL - padR) * (p / pMax); };
    var Y = function (f) { return h - padB - (h - padT - padB) * (f / yMax); };

    ctx.font = '400 12px ' + (cs.getPropertyValue('--font').trim() || 'sans-serif');
    ctx.lineWidth = 1;
    ctx.strokeStyle = line;
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, h - padB); ctx.lineTo(w - padR, h - padB); ctx.stroke();

    ctx.fillStyle = muted; ctx.textAlign = 'right';
    DiagramUI.ticks(0, cv(yMax, uf), h - padT - padB, size.density).forEach(function (v) {
      var yy = Y(v / uf.f);
      if (yy < padT - 2 || yy > h - padB + 2) return;
      ctx.beginPath(); ctx.moveTo(padL - 4, yy); ctx.lineTo(padL, yy); ctx.stroke();
      ctx.fillText(DiagramUI.fmt(v, { precision: 0 }), padL - 7, yy + 4);
    });
    ctx.textAlign = 'center';
    DiagramUI.ticks(0, cv(pMax, up), w - padL - padR, size.density).forEach(function (v) {
      var xx = X(v / up.f);
      if (xx < padL - 2 || xx > w - padR + 2) return;
      ctx.beginPath(); ctx.moveTo(xx, h - padB); ctx.lineTo(xx, h - padB + 4); ctx.stroke();
      ctx.fillText(DiagramUI.fmt(v, { precision: 0 }), xx, h - padB + 17);
    });
    ctx.textAlign = 'left';
    if (!coarse) {
      ctx.fillText(up.u, w - padR - 24, h - padB + 17);
      ctx.save(); ctx.translate(12, padT + 4); ctx.rotate(-Math.PI / 2);
      ctx.textAlign = 'right'; ctx.fillText(uf.u, 0, 0); ctx.restore();
    }

    /* the two required loads and the capacity actually installed */
    ctx.strokeStyle = DiagramUI.series(0); ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(X(0), Y(loadAt(0))); ctx.lineTo(X(pMax), Y(loadAt(pMax))); ctx.stroke();
    ctx.strokeStyle = DiagramUI.series(1); ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(X(0), Y(last.Wm2)); ctx.lineTo(X(pMax), Y(last.Wm2)); ctx.stroke();
    ctx.strokeStyle = DiagramUI.series(2);
    ctx.beginPath(); ctx.moveTo(X(0), Y(last.Ab * state.Sb)); ctx.lineTo(X(pMax), Y(last.Ab * state.Sb)); ctx.stroke();
    ctx.setLineDash([]);

    /* where this joint sits, and where the rating stops */
    ctx.strokeStyle = muted; ctx.setLineDash([2, 3]);
    ctx.beginPath(); ctx.moveTo(X(state.P), padT); ctx.lineTo(X(state.P), h - padB); ctx.stroke();
    if (isFinite(last.Prate) && last.Prate <= pMax) {
      ctx.beginPath(); ctx.moveTo(X(last.Prate), padT); ctx.lineTo(X(last.Prate), h - padB); ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.fillStyle = DiagramUI.series(0);
    ctx.beginPath(); ctx.arc(X(state.P), Y(last.Wm1), 4, 0, 6.2832); ctx.fill();
  }

  /* Honest degradation, §7.2. Without diagram-ui.js there is no framework left
     to render a message with, so this is the one branch where the tool touches
     the document itself: a title, the page heading the framework would have
     written, and one sentence. The data layer is installed either way — the
     return link, the status badge, the limitations modal and the shared bar
     come from the manifest and must survive a missing script. */
  function degrade() {
    document.title = 'Bolted flange joint check — diagram-ui.js v1 is required';
    var h = document.createElement('h1');
    h.textContent = 'Bolted flange joint check';
    var p = document.createElement('p');
    p.textContent = 'The interface library diagram-ui.js (framework tools.petrov.re/ui/v1) '
      + 'did not load, so the calculator cannot be shown. The links and notices below still work. '
      + 'Reload the page, or open it again from the tools index.';
    document.body.appendChild(h);
    document.body.appendChild(p);
  }

      degrade();

    /* UPSTREAM: UNIT_TABLE has no inch, and no registration call. A flange in
       US customary units is dimensioned in inches, and `display:'in'` on an
       unregistered unit relabels without converting (AUTHORING §4.2), so the
       tool adds the entry to the published table rather than ship a silent
       factor-of-25.4 error. If a future diagram-ui.js carries 'in' this becomes
       a no-op; if the table is ever frozen, INCH stays false and the tool keeps
       showing millimetres in both systems rather than lying about the number. */
    try {
      var row = DiagramUI.units && DiagramUI.units.table && DiagramUI.units.table.m;
      if (row && row.push) {
        for (var i = 0; i < row.length; i++) if (row[i].u === 'in') INCH = true;

      }
    } catch (e) { INCH = false; }

    var boltOptions = [
      { group: T('Metric, ISO coarse', 'Метричні, ISO', 'Metrisch, ISO-Regelgewinde', 'Metrisch, ISO grof', 'Métrique, ISO pas gros', 'Métrico, ISO paso grueso','Metryczny, gwint zwykły ISO'),
        options: [] },
      { group: T('Imperial, UNC', 'Дюймові, UNC', 'Zoll, UNC', 'Inch, UNC', 'Pouces, UNC', 'Pulgadas, UNC','Calowy, UNC'),
        options: [] }
    ];
    Object.keys(BOLTS).forEach(function (k) {
      var b = BOLTS[k];
      boltOptions[b.g === 'm' ? 0 : 1].options.push({ value: k, label: b.label || k });
    });

    app = DiagramUI.app({
      id: 'flangejoint',
      mount: '#app',

      compute: 'live',

                  'Effort de boulonnage minimal, couple et contrainte sur le joint',
                  'Carga mínima de pernos, par de apriete y tensión sobre la junta','Minimalne obciążenie śrub, moment dokręcania i naprężenie uszczelki, wg ASME VIII Dział 1 Załącznik 2'),

        id: 'genre',

        text: T('A teaching calculation of the minimum bolt loads of a gasketed joint. It sizes the bolting and the gasket load only — it computes no flange stress, and the built-in pressure-temperature ratings are indicative, not the standard. Not a code check.',
                'Навчальний розрахунок мінімальних зусиль болтів. Напруження у фланці не обчислюються, класи тиску орієнтовні. Це не розрахунок за нормами.',
                'Eine Lehrrechnung der Mindestschraubenkräfte. Sie bemisst nur Verschraubung und Dichtungskraft, berechnet keine Flanschspannung, und die hinterlegten Druck-Temperatur-Klassen sind orientierend. Kein Normnachweis.',
                'Een lesberekening van de minimale boutbelastingen. Alleen bouten en pakkingbelasting, geen flensspanning, en de ingebouwde druk-temperatuurklassen zijn indicatief. Geen normtoets.',
                'Un calcul pédagogique des efforts de boulonnage minimaux. Il dimensionne le boulonnage et l’effort sur le joint seulement, ne calcule aucune contrainte de bride, et les classes intégrées sont indicatives. Ce n’est pas une justification réglementaire.',
                'Un cálculo docente de las cargas mínimas de pernos. Solo dimensiona el atornillado y la carga sobre la junta, no calcula tensiones de brida, y las clases incorporadas son indicativas. No es una justificación de código.','Obliczenie dydaktyczne minimalnych obciążeń śrub złącza kołnierzowego z uszczelką. Dobiera wyłącznie śruby i obciążenie uszczelki — nie oblicza naprężeń w kołnierzu, a wbudowane klasy ciśnienie–temperatura są orientacyjne, nie normowe. Nie jest sprawdzeniem zgodności z przepisami.')

      learn: {
        version: 1,
        intro: {
          title: T('What this tool does', 'Що робить цей інструмент', 'Was dieses Werkzeug tut',

          body: T('Describe the joint — bolt circle, how many bolts and what size, the gasket contact face and its factors m and y, the design pressure and temperature — and it returns the two bolt loads the gasket demands, the bolt area they need, a torque per bolt and the stress the gasket ends up under. Change any input and the answer follows.',
                  'Опишіть з’єднання — коло болтів, їх кількість і розмір, прокладку та її m і y, тиск і температуру — і отримайте зусилля, площу, момент і напруження на прокладці.',
                  'Beschreiben Sie die Verbindung — Lochkreis, Anzahl und Größe der Schrauben, Dichtungsauflage mit m und y, Auslegungsdruck und -temperatur — und Sie erhalten beide Schraubenkräfte, den nötigen Querschnitt, ein Anziehmoment je Schraube und die Dichtungspressung.',
                  'Beschrijf de verbinding — steekcirkel, aantal en maat bouten, het pakkingvlak met m en y, ontwerpdruk en -temperatuur — en je krijgt beide boutbelastingen, het benodigde oppervlak, een moment per bout en de pakkingspanning.',
                  'Décrivez l’assemblage — cercle de perçage, nombre et taille des boulons, portée du joint avec m et y, pression et température — et vous obtenez les deux efforts, la section nécessaire, un couple par boulon et la contrainte sur le joint.',
                  'Describa la unión — círculo de pernos, número y tamaño, cara de junta con m e y, presión y temperatura — y obtendrá ambas cargas, el área necesaria, un par por perno y la tensión sobre la junta.','Opisz złącze — okrąg śrub, ich liczbę i rozmiar, powierzchnię przylegania uszczelki wraz z jej współczynnikami m i y, ciśnienie i temperaturę obliczeniową — a narzędzie zwróci oba obciążenia wymagane przez uszczelkę, potrzebny przekrój śrub, moment dokręcania na śrubę oraz nacisk, jakiemu ostatecznie poddana jest uszczelka. Zmiana dowolnej danej wejściowej zmienia wynik.')
        },
        topics: {
          gasketfactors: {
            title: T('The gasket factors m and y', 'Коефіцієнти прокладки m і y', 'Die Dichtungskennwerte m und y',
                     'De pakkingfactoren m en y', 'Les facteurs de joint m et y', 'Los factores de junta m e y','Współczynniki uszczelki m i y'),
            body: T('m is how many times the internal pressure must still press on the gasket for it to stay sealed under pressure; y is the stress needed to seat it in the first place, before there is any pressure at all. A soft sheet gasket is about m 2.0 and y 11 MPa, a spiral wound about m 3.0 and y 69 MPa. Both are properties of the gasket, and both come from its maker — they are inputs here, never looked up.',
                    'm — у скільки разів тиск має притискати прокладку під тиском; y — напруження обтиснення без тиску. М’яка прокладка — m 2,0, y 11 МПа; спіральна — m 3,0, y 69 МПа. Обидва — від виробника.',
                    'm sagt, wie oft der Innendruck noch auf die Dichtung drücken muss, damit sie unter Druck dicht bleibt; y ist die Pressung, die zum Einsetzen nötig ist, noch ohne Druck. Weichstoff etwa m 2,0 und y 11 MPa, Spiraldichtung etwa m 3,0 und y 69 MPa. Beide kommen vom Dichtungshersteller.',
                    'm zegt hoeveel keer de inwendige druk nog op de pakking moet drukken om onder druk dicht te blijven; y is de spanning die nodig is om hem überhaupt te zetten. Zacht plaatmateriaal ongeveer m 2,0 en y 11 MPa, spiraalgewonden ongeveer m 3,0 en y 69 MPa. Beide komen van de fabrikant.',
                    'm indique combien de fois la pression interne doit encore appuyer sur le joint pour qu’il reste étanche ; y est la contrainte nécessaire pour l’écraser au départ. Feuille souple environ m 2,0 et y 11 MPa, spiralé environ m 3,0 et y 69 MPa. Les deux viennent du fabricant.',
                    'm indica cuántas veces la presión interna debe seguir apretando la junta para que siga estanca; y es la tensión necesaria para asentarla. Lámina blanda alrededor de m 2,0 e y 11 MPa, espirometálica alrededor de m 3,0 e y 69 MPa. Ambos los da el fabricante.','m mówi, ile razy ciśnienie wewnętrzne musi nadal dociskać uszczelkę, aby pozostała szczelna pod ciśnieniem; y to nacisk potrzebny do jej osadzenia na samym początku, zanim pojawi się jakiekolwiek ciśnienie. Miękka uszczelka płaska ma zwykle m ≈ 2,0 i y ≈ 11 MPa, uszczelka spiralnie zwijana ≈ m 3,0 i y 69 MPa. Obie wartości są właściwościami uszczelki i pochodzą od jej producenta — są tu danymi wejściowymi, nigdy nie są wyszukiwane.')
          },
          boltload: {
            title: T('Wm1 and Wm2', 'Wm1 і Wm2', 'Wm1 und Wm2', 'Wm1 en Wm2', 'Wm1 et Wm2', 'Wm1 y Wm2','Wm1 i Wm2'),
            body: T('Two loads, and the bolting must carry the worse of them. Wm1 is the operating load: the end force the pressure puts on the joint, plus what is still needed to hold the gasket down. Wm2 is the seating load: enough to crush the gasket into the flange face on assembly, and it usually governs a hard gasket at low pressure. The required bolt area follows from whichever demands more area at its own allowable stress.',
                    'Два зусилля, і болти мають витримати більше. Wm1 — робоче (тиск плюс залишкове на прокладці), Wm2 — обтиснення під час монтажу.',
                    'Zwei Kräfte, und die Verschraubung muss die ungünstigere tragen. Wm1 ist die Betriebskraft aus Druckendkraft und verbleibender Dichtungskraft, Wm2 die Vorpresskraft beim Einbau, die bei harten Dichtungen und kleinem Druck meist maßgebend ist.',
                    'Twee belastingen; de bouten moeten de ongunstigste dragen. Wm1 is de bedrijfsbelasting uit de drukeindkracht plus de resterende pakkingkracht, Wm2 de afdichtbelasting bij montage, die bij harde pakkingen en lage druk vaak maatgevend is.',

                    'Dos cargas, y el atornillado debe soportar la peor. Wm1 es la carga en servicio: empuje de fondo más el esfuerzo residual sobre la junta. Wm2 es la carga de asiento en el montaje, que suele mandar con juntas duras a baja presión.','Dwa obciążenia, a śruby muszą przenieść gorsze z nich. Wm1 to obciążenie robocze: siła wywołana ciśnieniem na dnie złącza, powiększona o to, co nadal potrzebne do dociśnięcia uszczelki. Wm2 to obciążenie dogniatające: wystarczające, by wcisnąć uszczelkę w powierzchnię kołnierza przy montażu, i zwykle rozstrzyga w przypadku twardej uszczelki przy niskim ciśnieniu. Wymagany przekrój śrub wynika z tego, które z obciążeń wymaga większego przekroju przy swoim dopuszczalnym naprężeniu.')
          },
          seating: {
            title: T('Effective width b and diameter G', 'Ефективна ширина b та діаметр G', 'Wirksame Breite b und Durchmesser G',
                     'Effectieve breedte b en diameter G', 'Largeur efficace b et diamètre G', 'Ancho efectivo b y diámetro G','Szerokość skuteczna b i średnica G'),
            body: T('A wide gasket does not seal over its whole width: only a band of it carries the load. Below 6.35 mm of basic width the whole of it counts and G is the mean diameter of the contact face; above that the effective width shrinks as the square root of the basic width and the load moves outward, so G becomes the outside diameter less twice b. Every load on this page is computed on that diameter.',

                    'Eine breite Dichtung dichtet nicht über ihre ganze Breite. Bis 6,35 mm Grundbreite zählt die ganze Breite und G ist der mittlere Auflagedurchmesser; darüber wächst die wirksame Breite mit der Wurzel, und G wird der Außendurchmesser minus 2b.',
                    'Een brede pakking dicht niet over zijn volle breedte af. Tot 6,35 mm basisbreedte telt de hele breedte en is G de gemiddelde diameter; daarboven groeit de effectieve breedte met de wortel en wordt G de buitendiameter min 2b.',
                    'Un joint large ne serre pas sur toute sa largeur. Jusqu’à 6,35 mm de largeur de base, toute la largeur compte et G est le diamètre moyen ; au-delà, la largeur efficace croît en racine et G devient le diamètre extérieur moins 2b.',
                    'Una junta ancha no sella en todo su ancho. Hasta 6,35 mm de ancho básico cuenta todo el ancho y G es el diámetro medio; por encima, el ancho efectivo crece con la raíz y G pasa a ser el diámetro exterior menos 2b.','Szeroka uszczelka nie uszczelnia na całej swojej szerokości: obciążenie przenosi tylko jej pasmo. Poniżej 6,35 mm szerokości podstawowej liczy się cała szerokość, a G to średnia średnica powierzchni przylegania; powyżej tej wartości szerokość skuteczna maleje jak pierwiastek z szerokości podstawowej, a obciążenie przesuwa się na zewnątrz, więc G staje się średnicą zewnętrzną pomniejszoną o 2b. Każde obciążenie na tej stronie jest obliczane na tej średnicy.')

            body: T('T = K d F is the crudest useful relation in bolting: K collects thread and nut-face friction into one number, typically 0.16 to 0.20 well lubricated and 0.25 to 0.30 dry. Nine tenths of the torque is spent on friction, not on stretching the bolt, so the same torque on a dry stud gives perhaps two thirds of the load. Where the load matters, measure the bolt, do not trust the wrench.',
                    'T = K d F — найгрубше співвідношення. K — тертя: 0,16–0,20 зі змазкою, 0,25–0,30 без неї. Більшість моменту йде на тертя.',
                    'T = K d F ist die gröbste brauchbare Beziehung. K fasst Gewinde- und Mutternreibung zusammen: 0,16 bis 0,20 gut geschmiert, 0,25 bis 0,30 trocken. Der größte Teil des Moments geht in Reibung, nicht in die Vorspannung.',

      { group: T('Metric bolting', 'Метричні болти', 'Metrische Verschraubung', 'Metrische bouten', 'Boulonnerie métrique', 'Atornillado métrico','Śruby metryczne'),
        label: T('DN 150, M20, PTFE gasket', 'DN 150, M20, прокладка PTFE', 'DN 150, M20, PTFE-Dichtung',
                 'DN 150, M20, PTFE-pakking', 'DN 150, M20, joint PTFE', 'DN 150, M20, junta de PTFE','DN 150, M20, uszczelka PTFE'),
        note: 'BC 240 mm, 8 × M20, m 2.0, y 10.3 MPa, 16 bar',
        apply: function (t) { t.Bc = 0.240; t.n = 8; t.bolt = 'M20'; t.Go = 0.2120; t.Gi = 0.1880;
          t.m = 2.00; t.y = 10.3e6; t.ymax = 35e6; t.P = 1.6e6; t.T = 293.15; t.cls = '150'; } },
      { group: T('Failing joints', 'Невдалі з’єднання', 'Verbindungen, die durchfallen', 'Verbindingen die niet voldoen', 'Assemblages non conformes', 'Uniones que no cumplen','Złącza niespełniające wymagań'),
        label: T('Too few bolts for the gasket', 'Замало болтів', 'Zu wenig Schrauben', 'Te weinig bouten', 'Trop peu de boulons', 'Muy pocos pernos','Za mało śrub dla uszczelki'),
        note: '4 × M16 under a 4 in spiral wound gasket',
        apply: function (t) { t.Bc = 0.2000; t.n = 4; t.bolt = 'M16'; t.Go = 0.14920; t.Gi = 0.11430;
          t.m = 3.00; t.y = 68.9e6; t.ymax = 200e6; t.P = 1.9e6; t.T = 373.15; t.cls = '300'; } },
      { group: T('Failing joints', 'Невдалі з’єднання', 'Verbindungen, die durchfallen', 'Verbindingen die niet voldoen', 'Assemblages non conformes', 'Uniones que no cumplen','Złącza niespełniające wymagań'),
        label: T('Class 150 at 450 °C', 'Клас 150 при 450 °C', 'Klasse 150 bei 450 °C', 'Klasse 150 bij 450 °C', 'Classe 150 à 450 °C', 'Clase 150 a 450 °C','Klasa 150 przy 450 °C'),
        note: '10 bar against a rating that has fallen to 4.6 bar',
        apply: function (t) { t.P = 1.0e6; t.T = 723.15; t.cls = '150'; t.Sb = 120e6; } }
    ]);

    app.stage({
      caption: T('Required bolt load against design pressure', 'Зусилля болтів залежно від тиску',
                 'Erforderliche Schraubenkraft über dem Auslegungsdruck', 'Vereiste boutbelasting tegen ontwerpdruk',
                 'Effort de boulonnage requis en fonction de la pression', 'Carga de pernos requerida frente a la presión','Wymagane obciążenie śrub względem ciśnienia obliczeniowego'),
      minHeight: 260,
      a11y: function () {
        if (!last) return '';
        var uf = uForce(), up = uPress();
        return DiagramUI.pick(T(
          'Bolt load against pressure. At ' + show(state.P, up) + ' the operating load is ' + show(last.Wm1, uf) +
            ', the seating load is ' + show(last.Wm2, uf) + ', and the installed bolts carry ' + show(last.Ab * state.Sb, uf) + '.',
          'Зусилля болтів від тиску. При ' + show(state.P, up) + ' робоче ' + show(last.Wm1, uf) +
            ', обтиснення ' + show(last.Wm2, uf) + ', болти тримають ' + show(last.Ab * state.Sb, uf) + '.',
          'Schraubenkraft über Druck. Bei ' + show(state.P, up) + ' beträgt die Betriebskraft ' + show(last.Wm1, uf) +
            ', die Vorpresskraft ' + show(last.Wm2, uf) + ', die Schrauben tragen ' + show(last.Ab * state.Sb, uf) + '.',
          'Boutbelasting tegen druk. Bij ' + show(state.P, up) + ' is de bedrijfsbelasting ' + show(last.Wm1, uf) +
            ', de afdichtbelasting ' + show(last.Wm2, uf) + ', de bouten dragen ' + show(last.Ab * state.Sb, uf) + '.',
          'Effort de boulonnage en fonction de la pression. À ' + show(state.P, up) + ', effort en service ' + show(last.Wm1, uf) +
            ', effort d’écrasement ' + show(last.Wm2, uf) + ', capacité installée ' + show(last.Ab * state.Sb, uf) + '.',
          'Carga de pernos frente a la presión. A ' + show(state.P, up) + ', carga en servicio ' + show(last.Wm1, uf) +
            ', carga de asiento ' + show(last.Wm2, uf) + ', capacidad instalada ' + show(last.Ab * state.Sb, uf) + '.'
        ,'Obciążenie śrub w funkcji ciśnienia. Przy ' + show(state.P, up) + ' obciążenie robocze wynosi ' + show(last.Wm1, uf) +
            ', obciążenie dogniatające ' + show(last.Wm2, uf) + ', a zainstalowane śruby przenoszą ' + show(last.Ab * state.Sb, uf) + '.'), app.lang);
      },
      render: drawChart
    });
    adoptStage(app);

    app.ready();
    /* ?lang=de otherwise gives a German page inside <html lang="en">: the
       runtime assigns the document language when the switcher is used, not on
       arrival. One published call, no document touch of our own. */
    if (window.Diagram && Diagram.setDocumentLang) Diagram.setDocumentLang(app.lang);
    window.__flangejoint = { app: app, state: state, solve: solve, starOrder: starOrder };
    installData();
  }

  /* ======================================================= 3. the data layer
     Called unconditionally, never from inside a .then() and never from a
     success branch: window.__diagramReady is set by Diagram.init's own boot
     and by nothing else. */
  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'flangejoint',
        file: 'flangejoint.html',

        state: {
          serialize: function () { return state; },
          deserialize: function (o) {
            Object.assign(state, o || {});
            if (!Array.isArray(state.passes) || !state.passes.length) state.passes = [{ label: '', pct: 100 }];
            if (app) { app.sync(); app.run(); }
          }
        },

        record: function () {
          if (!last) return null;
          return {
            inputs: {
              Bc: state.Bc, n: state.n, bolt: state.bolt,
              bolt_d: last.bolt.d, bolt_stress_area: last.bolt.As,
              Go: state.Go, Gi: state.Gi, m_factor: state.m, y: state.y, y_max: state.ymax,
              P: state.P, T: state.T, flange_class: state.cls, p_rating_custom: state.Pcustom,
              Sa: state.Sa, Sb: state.Sb, K_nut: state.K,
              pass_percent: state.passes.map(function (p) { return p.pct; })
            },
            outputs: {
              G: last.G, b_effective: last.b, N_contact_width: last.N,
              H_end_force: last.H, H_p_gasket: last.Hp,
              W_m1: last.Wm1, W_m2: last.Wm2,
              A_m_required: last.Am, A_b_installed: last.Ab, bolt_area_ratio: last.boltRatio,
              W_target: last.Wt, F_per_bolt: last.Fb, torque_per_bolt: last.Tb,
              bolt_stress: last.sigmaB,
              S_gasket_effective: last.SgEff, S_gasket_contact: last.SgCon,
              gasket_stress_ratio: last.gRatio,
              p_rating: last.Prate, pressure_ratio: last.pRatio,
              bolt_pitch: last.spacing, bolt_pitch_diameters: last.spacingRatio,
              pass_torque: last.passT, pass_load_per_bolt: last.passF, pass_gasket_stress: last.passS
            },
            units: {
              Bc: 'm', n: '-', bolt: '-', bolt_d: 'm', bolt_stress_area: 'm2',
              Go: 'm', Gi: 'm', m_factor: '-', y: 'Pa', y_max: 'Pa',
              P: 'Pa', T: 'K', flange_class: '-', p_rating_custom: 'Pa',
              Sa: 'Pa', Sb: 'Pa', K_nut: '-', pass_percent: '%',
              G: 'm', b_effective: 'm', N_contact_width: 'm', H_end_force: 'N', H_p_gasket: 'N',
              W_m1: 'N', W_m2: 'N', A_m_required: 'm2', A_b_installed: 'm2', bolt_area_ratio: '-',
              W_target: 'N', F_per_bolt: 'N', torque_per_bolt: 'N m', bolt_stress: 'Pa',
              S_gasket_effective: 'Pa', S_gasket_contact: 'Pa', gasket_stress_ratio: '-',
              p_rating: 'Pa', pressure_ratio: '-', bolt_pitch: 'm', bolt_pitch_diameters: '-',
              pass_torque: 'N m', pass_load_per_bolt: 'N', pass_gasket_stress: 'Pa'
            },
            model: {
              equations: [
                'N = (Go - Gi) / 2', 'b0 = N / 2',
                'b = b0 if b0 <= 6.35 mm else 2.52 sqrt(b0 in mm) in mm',
                'G = (Go + Gi) / 2 if b0 <= 6.35 mm else Go - 2 b',
                'H = pi/4 G^2 P', 'Hp = 2 b pi G m P',
                'Wm1 = H + Hp', 'Wm2 = pi b G y',
                'Am = max(Wm1 / Sb, Wm2 / Sa)', 'Ab = n As',
                'W_target = max(Wm1, Wm2)', 'torque_per_bolt = K d W_target / n',
                'S_gasket_effective = W_target / (pi G b)',
                'S_gasket_contact = W_target / (pi G N)'
              ],
              ranges: [
                'ASME VIII Division 1 Appendix 2 form; bolting and gasket load only, no flange stress',
                'pressure-temperature rating interpolated linearly in ASME B16.5 group 1.1 table rows, -29 to 538 degC',
                'torque from a single nut factor K; assembly scatter not modelled'
              ],
              notes: [
                'prototype, no independent validation, no benchmark artifact',
                'the built-in pressure-temperature ratings are an indicative transcription, not the standard',
                'display unit system at export time: ' + state.us + '; every value in this record is SI'
              ]
            },
            warnings: (function () {
              var w = [];
              if (!last.okBolts) w.push('installed bolt area ' + last.Ab.toExponential(4) +
                ' m2 is below the required ' + last.Am.toExponential(4) + ' m2');
              if (!last.okRating) w.push('design pressure ' + (state.P / 1e5).toFixed(2) +
                ' bar exceeds the rated ' + (last.Prate / 1e5).toFixed(2) + ' bar at this temperature');
              if (!last.okGasket) w.push('gasket contact stress ' + (last.SgCon / 1e6).toFixed(1) +
                ' MPa exceeds the stated limit ' + (state.ymax / 1e6).toFixed(1) + ' MPa');
              if (state.Bc <= state.Go) w.push('the bolt circle is not outside the gasket contact face: the geometry is impossible');
              if (last.spacingRatio < 2.5) w.push('bolt pitch is ' + last.spacingRatio.toFixed(2) + ' bolt diameters, below the practical 2.5');
              if (state.n % 4 !== 0) w.push('bolt count is not a multiple of four');
              var lp = state.passes[state.passes.length - 1];
              if (lp && lp.pct !== 100) w.push('the last bolt-up pass stops at ' + lp.pct + ' per cent of the final torque');
              return w;
            })()
          };
        },

        python: function () {
          return {
            code: PY_SOURCE,
            requires: [],
            basis: {
              kind: 'reproduce',
              note: 'the same expressions in the same order as the page, including the rating table and its linear interpolation',
              deviation: 'none observed; both evaluate IEEE-754 doubles in the same sequence'
            },
            selftest: { tolerance: 1e-12 }
          };
        },

        handoff: {
          provides: ['p', 'T', 'D'],
          accepts: ['p', 'T'],
          build: function () {
            if (!last) return null;
            return { quantities: {
              p: { value: state.P, unit: 'Pa' },
              T: { value: state.T, unit: 'K' },
              D: { value: state.Bc, unit: 'm' } } };
          },
          apply: function (payload) {
            var q = (payload && payload.quantities) || {};
            if (q.p) state.P = q.p.value;
            if (q.T) state.T = q.T.value;
            if (app) { app.sync(); app.run(); }
          }
        },

        report: {
          sections: function (rec) {
            if (!rec || !last || !app) return [];
            var ut = uTorq(), uf = uForce(), ul = uLen();
            var out = [];
            try {
              if (stage) {
                drawChart(stage.measure(), stage);
                out.push({
                  title: DiagramUI.pick(T('Required bolt load against design pressure', 'Зусилля болтів залежно від тиску',
                    'Erforderliche Schraubenkraft über dem Auslegungsdruck', 'Vereiste boutbelasting tegen ontwerpdruk',
                    'Effort de boulonnage requis en fonction de la pression', 'Carga de pernos requerida frente a la presión','Wymagane obciążenie śrub względem ciśnienia obliczeniowego'), app.lang),
                  image: { src: stage.canvas().canvas.toDataURL('image/png'), width: '150mm' }
                });
              }
            } catch (e) { /* a report without the figure is still a report */ }
            var order = starOrder(state.n), seq = [];
            for (var i = 0; i < state.n; i++) seq[order[i]] = i + 1;
            var rows = [];
            for (var k = 0; k < state.n; k++) {
              var ang = 360 * k / state.n, rad = ang * Math.PI / 180;
              rows.push([String(k + 1), DiagramUI.fmt(ang, { precision: 1 }),
                DiagramUI.fmt(cv(state.Bc / 2 * Math.cos(rad), ul), { precision: ul.p }),
                DiagramUI.fmt(cv(state.Bc / 2 * Math.sin(rad), ul), { precision: ul.p }),
                String(seq[k]), DiagramUI.fmt(cv(last.Tb, ut), { precision: ut.p })]);
            }
            out.push({
              title: DiagramUI.pick(T('Every bolt, in tightening order', 'Кожен болт і порядок', 'Jede Schraube, in Anziehreihenfolge',
                'Elke bout, in aandraaivolgorde', 'Chaque boulon, dans l’ordre de serrage', 'Cada perno, en orden de apriete','Każda śruba, w kolejności dokręcania'), app.lang),
              head: ['#', '°', 'x, ' + ul.u, 'y, ' + ul.u,
                     DiagramUI.pick(T('Order', 'Порядок', 'Reihenfolge', 'Volgorde', 'Ordre', 'Orden','Kolejność'), app.lang),
                     DiagramUI.pick(T('Final torque', 'Кінцевий момент', 'Endmoment', 'Eindmoment', 'Couple final', 'Par final','Moment końcowy'), app.lang) + ', ' + ut.u],
              rows: rows,
              notes: [DiagramUI.pick(T('The order is a generated cross pattern, not a table from a standard.',
                'Порядок — згенерований хрестоподібний шаблон, а не таблиця зі стандарту.',
                'Die Reihenfolge ist ein erzeugtes Kreuzmuster, keine Tabelle aus einer Norm.',
                'De volgorde is een gegenereerd kruispatroon, geen tabel uit een norm.',
                'L’ordre est un schéma en croix généré, pas un tableau normatif.',
                'El orden es un patrón en cruz generado, no una tabla normativa.','Kolejność to wygenerowany wzór na krzyż, a nie tabela z normy.'), app.lang)]
            });
            return out;
          }
        }
      });
    }
  }

  /* The python export carries the whole model, the bolt table and the rating
     table, so a reader can re-run it on a bare python3. It reads the INPUTS
     dict that diagram-common.js writes above it. */
  var PY_SOURCE = [
    'RATING_T = [38, 50, 100, 150, 200, 250, 300, 325, 350, 375, 400, 425, 450, 475, 500, 538]',
    'RATING = {',
    "    '150': [19.6, 19.2, 17.7, 15.8, 13.8, 12.1, 10.2, 9.3, 8.4, 7.4, 6.5, 5.5, 4.6, 3.7, 2.8, 1.4],",
    "    '300': [51.1, 50.1, 46.6, 45.1, 43.8, 41.9, 39.8, 38.7, 37.6, 36.4, 34.7, 28.8, 23.0, 17.4, 11.8, 5.9],",
    "    '600': [102.1, 100.2, 93.2, 90.2, 87.6, 83.9, 79.6, 77.4, 75.1, 72.7, 69.4, 57.5, 46.0, 34.9, 23.5, 11.8],",
    "    '900': [153.2, 150.4, 139.8, 135.2, 131.4, 125.8, 119.5, 116.1, 112.7, 109.1, 104.2, 86.3, 69.0, 52.3, 35.3, 17.7],",
    "    '1500': [255.3, 250.6, 233.0, 225.4, 219.0, 209.7, 199.1, 193.6, 187.8, 181.8, 173.6, 143.8, 115.0, 87.2, 58.8, 29.5],",
    "    '2500': [425.5, 417.7, 388.3, 375.6, 365.0, 349.5, 331.8, 322.6, 313.0, 303.1, 289.3, 239.7, 191.7, 145.4, 97.9, 49.2],",
    '}',
    '',
    '',
    'def rating_pa(cls, t_k, custom):',
    '    """Rated pressure, Pa, interpolated linearly in the table rows."""',
    "    if cls == 'custom':",
    '        return custom',
    '    tab = RATING.get(cls)',
    '    if tab is None:',
    "        return float('nan')",
    '    t = t_k - 273.15',
    '    if t <= RATING_T[0]:',
    '        return tab[0] * 1e5',
    '    for i in range(1, len(RATING_T)):',
    '        if t <= RATING_T[i]:',
    '            f = (t - RATING_T[i - 1]) / (RATING_T[i] - RATING_T[i - 1])',
    '            return (tab[i - 1] + f * (tab[i] - tab[i - 1])) * 1e5',
    '    return tab[-1] * 1e5',
    '',
    '',
    'def star_order(n):',
    '    """The cross pattern: always the bolt angularly farthest from the tightened ones."""',
    '    done = [0]',
    '    left = list(range(1, n))',
    '    while left:',
    '        best, best_score = 0, -1',
    '        for i, cand in enumerate(left):',
    '            worst = 1e9',
    '            for k in done:',
    '                d = abs(cand - k) % n',
    '                d = min(d, n - d)',
    '                if d < worst:',
    '                    worst = d',
    '            if worst > best_score:',
    '                best_score, best = worst, i',
    '        done.append(left.pop(best))',
    '    return done',
    '',
    '',
    'def compute():',
    '    """ASME VIII Div. 1 Appendix 2 bolt loads, SI throughout."""',
    "    Go, Gi = INPUTS['Go'], INPUTS['Gi']",
    "    P, y = INPUTS['P'], INPUTS['y']",
    "    m, n = INPUTS['m_factor'], INPUTS['n']",
    "    Sa, Sb = INPUTS['Sa'], INPUTS['Sb']",
    "    d, As = INPUTS['bolt_d'], INPUTS['bolt_stress_area']",
    '    N = (Go - Gi) / 2',
    '    b0 = N / 2',
    '    b = b0 if b0 <= 0.00635 else 0.07968943 * math.sqrt(b0)',
    '    G = (Go + Gi) / 2 if b0 <= 0.00635 else Go - 2 * b',
    '    H = math.pi / 4 * G * G * P',
    '    Hp = 2 * b * math.pi * G * m * P',
    '    Wm1 = H + Hp',
    '    Wm2 = math.pi * b * G * y',
    '    Am = max(Wm1 / Sb, Wm2 / Sa)',
    '    Ab = n * As',
    '    Wt = max(Wm1, Wm2)',
    '    Fb = Wt / n',
    "    Tb = INPUTS['K_nut'] * d * Fb",
    '    SgEff = Wt / (math.pi * G * b)',
    '    SgCon = Wt / (math.pi * G * N)',
    "    Prate = rating_pa(INPUTS['flange_class'], INPUTS['T'], INPUTS['p_rating_custom'])",
    "    spacing = math.pi * INPUTS['Bc'] / n",
    "    pct = INPUTS['pass_percent']",
    '    return {',
    "        'G': G, 'b_effective': b, 'N_contact_width': N,",
    "        'H_end_force': H, 'H_p_gasket': Hp,",
    "        'W_m1': Wm1, 'W_m2': Wm2,",
    "        'A_m_required': Am, 'A_b_installed': Ab, 'bolt_area_ratio': Am / Ab,",
    "        'W_target': Wt, 'F_per_bolt': Fb, 'torque_per_bolt': Tb,",
    "        'bolt_stress': Fb / As,",
    "        'S_gasket_effective': SgEff, 'S_gasket_contact': SgCon,",
    "        'gasket_stress_ratio': SgCon / INPUTS['y_max'],",
    "        'p_rating': Prate, 'pressure_ratio': P / Prate,",
    "        'bolt_pitch': spacing, 'bolt_pitch_diameters': spacing / d,",
    "        'pass_torque': [p / 100 * Tb for p in pct],",
    "        'pass_load_per_bolt': [p / 100 * Fb for p in pct],",
    "        'pass_gasket_stress': [p / 100 * SgEff for p in pct],",
    '    }',
    '',
    '',
    'def tightening_order():',
    '    """1-based tightening position of each bolt, in bolt order."""',
    "    n = INPUTS['n']",
    '    order = star_order(n)',
    '    seq = [0] * n',
    '    for i, b in enumerate(order):',
    '        seq[b] = i + 1',
    '    return seq'
  ].join('\n');

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
