function next(){if(session.answers[session.index]===undefined)return;if(session.index<session.questions.length-1){session.index++;saveSession();renderQuestion();}else finishSession();}
function finishSession(){clearSession();let map=Object.fromEntries(QUESTIONS.map(x=>[x.id,x])),correct=0,byLevel={};session.questions.forEach((id,i)=>{let q=map[id],ok=isCorrect(q,session.answers[i]);if(ok)correct++;let b=byLevel[q.level]||(byLevel[q.level]={c:0,n:0});b.n++;if(ok)b.c++;});let total=session.questions.length,rate=correct/total;if(session.mode==='level'){let id=session.meta.level,s=progress.levelStats[id]||(progress.levelStats[id]={attempts:0,bestRate:0});s.attempts++;s.bestRate=Math.max(s.bestRate,rate);s.lastRate=rate;s.lastAt=new Date().toISOString();}saveProgress();lastResult={correct,total,rate,byLevel};renderResult(correct,total,rate,byLevel);}
function renderResult(correct,total,rate,byLevel){screen='result';let map=Object.fromEntries(QUESTIONS.map(x=>[x.id,x]));let wrongIds=session.questions.filter((id,i)=>!isCorrect(map[id],session.answers[i]));let hit=rate>=((session.mode==='mock')?MOCK_PASS:LEVEL_PASS),rows=Object.entries(byLevel).sort((a,b)=>a[0]-b[0]).map(([id,s])=>{let L=LEVELS[+id-1],r=s.c/s.n;return `<div class="vt-result-row ${r<LEVEL_PASS?'weak':''}"><span>${tx(L.title)}</span><strong>${s.c} / ${s.n}</strong></div>`;}).join('');root.innerHTML=`<section class="vt-card vt-result"><div class="vt-kicker">${sessionTitle()}</div><div class="vt-score">${correct} / ${total}</div><div class="vt-verdict">${hit?t('pass'):t('fail')} · ${Math.round(rate*100)}%</div><div class="vt-note">${t('practice')}</div><div class="vt-result-list">${rows}</div><div class="vt-home-actions vt-actions-center"><button class="vt-btn primary" data-action="home">${t('home')}</button>${session.mode==='level'?`<button class="vt-btn" data-action="retry">${t('retry')}</button>`:''}${wrongIds.length?`<button class="vt-btn" data-action="review">${t('review')} (${wrongIds.length})</button>`:''}</div></section>`;root.querySelector('[data-action="home"]').onclick=renderHome;let r=root.querySelector('[data-action="retry"]');if(r)r.onclick=()=>startLevel(session.meta.level);let rv=root.querySelector('[data-action="review"]');if(rv)rv.onclick=()=>startSessionReview(wrongIds);}
window.addEventListener('keydown',e=>{if(screen!=='quiz'||(qObj()&&qObj().type==='match'))return;if(['1','2','3','4'].includes(e.key)){let b=root.querySelector(`[data-key="${+e.key-1}"]`);if(b&&!b.disabled)b.click();}else if(e.key==='Enter'){let b=root.querySelector('[data-action="next"]:not(.vt-hidden)');if(b)b.click();}});
function validateBank(){let errors=[],ids=new Set(),langs=MANIFEST.tool_languages||['en'];const EXPECT={core:120,visual:38,matching:4,cases:12,total:174};QUESTIONS.forEach(q=>{if(ids.has(q.id))errors.push('duplicate '+q.id);ids.add(q.id);for(let L of langs){if(!q.q||!q.q[L])errors.push('question '+q.id+' '+L);if(!q.e||!q.e[L])errors.push('explanation '+q.id+' '+L);if(!q.o||!Array.isArray(q.o[L])||q.o[L].length<2)errors.push('options '+q.id+' '+L);if(q.alt&&Object.values(q.alt).some(Boolean)&&!q.alt[L])errors.push('alt '+q.id+' '+L);if(q.type==='case'&&(!q.situation||!q.situation[L]))errors.push('case situation '+q.id+' '+L);if(q.type==='match'){if(!q.instruction||!q.instruction[L])errors.push('match instruction '+q.id+' '+L);for(let [i,row] of (q.rows||[]).entries())if(!row.alt||!row.alt[L])errors.push('match row alt '+q.id+' '+i+' '+L);}}if(q.type==='match'){if(!q.rows||!Array.isArray(q.a)||q.rows.length!==q.a.length)errors.push('match shape '+q.id);if(q.o&&q.o.en&&q.a.some(x=>x<0||x>=q.o.en.length))errors.push('match answer '+q.id);}else{if(typeof q.a!=='number'||q.a<0||q.a>=q.o.en.length)errors.push('answer '+q.id);}});LEVELS.forEach(L=>{let n=CORE_QUESTIONS.filter(q=>q.level===L.id).length;if(n!==12)errors.push('level '+L.id+' has '+n+' core questions');for(let langCode of langs){if(!L.title[langCode]||!L.sub[langCode])errors.push('level text '+L.id+' '+langCode);}});let coreIds=new Set(CORE_QUESTIONS.map(q=>q.id)),visualIds=new Set(VISUAL_QUESTIONS.map(q=>q.id));CASE_QUESTIONS.forEach(q=>(q.excludes_core||[]).forEach(id=>{if(!coreIds.has(id))errors.push('unknown case/core pair '+q.id+' -> '+id);}));VISUAL_QUESTIONS.forEach(q=>(q.excludes_visual||[]).forEach(id=>{if(!visualIds.has(id))errors.push('unknown visual pair '+q.id+' -> '+id);else{let peer=VISUAL_QUESTIONS.find(x=>x.id===id);if(!(peer.excludes_visual||[]).includes(q.id))errors.push('non-reciprocal visual pair '+q.id+' -> '+id);}}));if(CORE_QUESTIONS.length!==EXPECT.core)errors.push('core count '+CORE_QUESTIONS.length+' != '+EXPECT.core);if(VISUAL_QUESTIONS.length!==EXPECT.visual)errors.push('visual count '+VISUAL_QUESTIONS.length+' != '+EXPECT.visual);if(MATCH_QUESTIONS.length!==EXPECT.matching)errors.push('matching count '+MATCH_QUESTIONS.length+' != '+EXPECT.matching);if(CASE_QUESTIONS.length!==EXPECT.cases)errors.push('case count '+CASE_QUESTIONS.length+' != '+EXPECT.cases);if(QUESTIONS.length!==EXPECT.total)errors.push('total count '+QUESTIONS.length+' != '+EXPECT.total);if(errors.length)console.error('VCA Trainer bank check failed',errors);else console.info('VCA Trainer bank check: '+EXPECT.core+' core, '+EXPECT.visual+' visual, '+EXPECT.matching+' matching, '+EXPECT.cases+' cases; '+langs.length+' domain languages.');return errors;}

function reportText(k,l){let d=(l&&REPORT_TEXT[l])||REPORT_TEXT[lang()]||REPORT_TEXT.en;return d[k]||REPORT_TEXT.en[k]||k;}
function vcaReportProfile(rec,ctx){
 let l=ctx.domainLang||ctx.lang||lang(),o=rec.outputs||{},i=rec.inputs||{};
 return{
  title:reportText('document',l),
  project:[],
  executive:{text:[reportText('note',l)],results:[
   {label:reportText('answered',l),value:o.questions_answered},
   {label:reportText('correct',l),value:o.questions_correct},
   {label:reportText('accuracy',l),value:o.accuracy_percent,unit:'%'},
   {label:reportText('levels',l),text:o.levels_passed+' / '+o.levels_total}
  ]},
  purpose:[],scope:[],intendedUse:[],assumptions:[],
  system:{text:[],flow:[]},results:[],decisions:[],checks:[],risks:[],actions:[],questions:[],figures:[],
  method:{equations:[],ranges:[],notes:[],references:[]},
  inputs:[
   {label:reportText('mode',l),text:reportText('modeLocal',l)},
   {label:reportText('core',l),value:i.core_questions},
   {label:reportText('visual',l),value:i.visual_questions},
   {label:reportText('matching',l),value:i.matching_questions},
   {label:reportText('cases',l),value:i.case_questions}
  ],
  appendices:[]
 };
}
function renderCurrentLanguage(){syncDocumentLang();if(!QUESTIONS.length)return;if(screen==='quiz'&&session)renderQuestion();else if(screen==='result'&&lastResult)renderResult(lastResult.correct,lastResult.total,lastResult.rate,lastResult.byLevel);else renderHome();}
function registerDiagram(loadPromise){if(!window.Diagram)return;try{syncDocumentLang();Diagram.init({id:'vcatrainer',file:'vcatrainer.html',title:'VCA Trainer – Basic Safety',record:()=>{let seen=answeredCount();if(!seen)return null;let correct=correctCount(),accuracy=correct/seen*100;return {inputs:{training_mode:'local',core_questions:CORE_QUESTIONS.length,visual_questions:VISUAL_QUESTIONS.length,matching_questions:MATCH_QUESTIONS.length,case_questions:CASE_QUESTIONS.length},outputs:{questions_answered:seen,questions_correct:correct,accuracy_percent:accuracy,levels_passed:LEVELS.filter(x=>levelPassed(x.id)).length,levels_total:LEVELS.length},units:{accuracy_percent:'%'},model:{equations:[],ranges:[],notes:[]},warnings:[t('warnUnofficial'),t('warnSourceGap')]};},report:{profile:vcaReportProfile},handoff:{provides:[],accepts:[]}});if(loadPromise&&Diagram.ready)Diagram.ready(loadPromise);if(Diagram.watchLang)Diagram.watchLang(()=>renderCurrentLanguage());}catch(e){console.warn(e);}}
async function loadBanks(){let get=(u,label)=>fetch(u).then(r=>{if(!r.ok)throw new Error(label+' bank '+r.status);return r.json();});let [c,v,m,k]=await Promise.all([get('vcatrainer-core.json','core'),get('vcatrainer-visual.json','visual'),get('vcatrainer-matching.json','matching'),get('vcatrainer-cases.json','cases')]);CORE_QUESTIONS=c.questions||[];VISUAL_QUESTIONS=v.questions||[];MATCH_QUESTIONS=m.questions||[];CASE_QUESTIONS=k.questions||[];QUESTIONS=CORE_QUESTIONS.concat(VISUAL_QUESTIONS,MATCH_QUESTIONS,CASE_QUESTIONS);return QUESTIONS;}
function renderLoadError(err){root.innerHTML=`<section class="vt-card vt-pad"><h1>VCA Trainer</h1><p class="vt-note">${t('loadError')}</p><pre class="vt-note">${String(err&&err.message||err)}</pre></section>`;}
document.addEventListener('DOMContentLoaded',()=>{syncDocumentLang();root.innerHTML=`<section class="vt-card vt-pad" aria-busy="true"><div class="vt-kicker">${t('kicker')}</div><h1>${t('title')}</h1></section>`;let p=loadBanks();registerDiagram(p);p.then(()=>{validateBank();renderHome();}).catch(renderLoadError);});
})();
