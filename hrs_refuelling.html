  "uk": "Модель одного об’єму за кінцевим станом: без теплообміну в часі, стратифікації, втрат тиску в шлангах і клапанах та заправки з комунікацією; швидкість зростання тиску визначає лише тривалість і має братися з таблиць SAE J2601, які, як і метод формули MC, не відтворюються. Теплоємність стінки — ефективне значення користувача. Протоколи для важкого транспорту (J2601-2, J2601-5), компресори та каскади поза межами; сховище станції враховано лише як необов’язкове обмеження тиску буфера (p_bank). Результати — оціночні, а не валідація протоколу.",

  "es": "Modelo de zona única en el estado final: sin transferencia de calor resuelta en el tiempo, estratificación, pérdidas de carga en manguera y válvulas ni llenado con comunicación; la rampa de presión solo fija la duración y debe tomarse de las tablas SAE J2601, que no se reproducen, como tampoco el método de la fórmula MC. La capacidad térmica de la pared es un valor efectivo del usuario. Quedan fuera los protocolos de vehículos pesados (J2601-2, J2601-5), los compresores y las cascadas de la estación; el almacenamiento solo entra como un límite opcional de presión del banco (p_bank). Los resultados son estimaciones, no una validación del protocolo.",

  function computeView(s){
    last = solve(s); if (stage) stage.schedule();
    var r = last, e, k, i, w;
    if (!r || !r.ok) { e = (r && r.error) || 'Unknown error'; return { verdict: { tone: 'bad', text: trMsg(e) }, tiles: [], notes: [] }; }
    function fin(v){ return typeof v === 'number' && isFinite(v); }
    var tiles = [], notes = [], tables = [], t = [];
    function add(label, v, unit, learn, head, tone){ if (!fin(v)) return; tiles.push({ label: label, value: sigv(v, 4), hint: unit, precision: sig(v, 4), tone: tone || null, learn: learn, headline: !!head }); }
    var M = DiagramUI.fmt(r.m_fill, { precision: 2 }), D = DiagramUI.fmt(r.t_min, { precision: 1 }), TE = DiagramUI.fmt(r.T_end, { precision: 1 }), PE = DiagramUI.fmt(r.p_end_MPa, { precision: 1 });
    var A = r.pass ? ['Fill within J2601 limits: ', 'Заправка в межах J2601: ', 'Betankung innerhalb der J2601-Grenzen: ', 'Tankbeurt binnen J2601-grenzen: ', 'Remplissage conforme aux limites J2601 : ', 'Repostaje dentro de los límites J2601: ', 'Tankowanie w granicach J2601: ']
      : ['Fill outside J2601 limits: ', 'Заправка поза межами J2601: ', 'Betankung außerhalb der J2601-Grenzen: ', 'Tankbeurt buiten J2601-grenzen: ', 'Remplissage hors limites J2601 : ', 'Repostaje fuera de los límites J2601: ', 'Tankowanie poza granicami J2601: '];
    var KG = [' kg in ', ' кг за ', ' kg in ', ' kg in ', ' kg en ', ' kg en ', ' kg w '], MN = [' min, end ', ' хв, кінець ', ' min, Ende ', ' min, eind ', ' min, fin ', ' min, final ', ' min, koniec '];
    for (k = 0; k < 7; k++) t.push(A[k] + M + KG[k] + D + MN[k] + TE + ' °C / ' + PE + ' MPa');
    var verdict = { tone: r.pass ? 'ok' : 'bad', text: T.apply(null, t) };
    add(T('Hydrogen dispensed', 'Відпущено водню', 'Abgegebener Wasserstoff', 'Afgegeven waterstof', 'Hydrogène délivré', 'Hidrógeno suministrado', 'Wydany wodór'), r.m_fill, 'kg', 'soc', true);
    if (r.p_bank_MPa > 0) add(T('State of charge reached', 'Досягнутий ступінь заповнення', 'Erreichter Füllgrad', 'Bereikte vullingsgraad', 'État de charge atteint', 'Estado de carga alcanzado', 'Osiągnięty stopień napełnienia'), r.soc_end, '%', 'bank', false, r.bank_limited ? 'bad' : null);
    add(T('Fill time', 'Тривалість заправки', 'Betankungsdauer', 'Tankduur', 'Durée de remplissage', 'Duración del repostaje', 'Czas tankowania'), r.t_min, 'min', 'aprr');
    add(T('Final gas temperature', 'Кінцева температура газу', 'Gasendtemperatur', 'Eindtemperatuur gas', 'Température finale du gaz', 'Temperatura final del gas', 'Końcowa temperatura gazu'), r.T_end, '°C', 'heat', false, r.okT ? null : 'bad');
    add(T('Final pressure', 'Кінцевий тиск', 'Enddruck', 'Einddruk', 'Pression finale', 'Presión final', 'Ciśnienie końcowe'), r.p_end_MPa, 'MPa', 'pressure', false, r.okP ? null : 'bad');
    add(T('Average mass flow', 'Середня масова витрата', 'Mittlerer Massenstrom', 'Gemiddeld massadebiet', 'Débit massique moyen', 'Caudal másico medio', 'Średni strumień masy'), r.mdot_gs, 'g/s', 'aprr', false, r.okM ? null : 'bad');
    add(T('Chiller electricity', 'Електроенергія охолодження', 'Kältestrom', 'Koelelektriciteit', 'Électricité de refroidissement', 'Electricidad de enfriamiento', 'Energia chłodzenia'), r.E_chill_kWh_kg, 'kWh/kg', 'precool');
    if (s && s.level === 'full') {
      add(T('Adiabatic end temperature (no wall)', 'Адіабатна кінцева температура (без стінки)', 'Adiabate Endtemperatur (ohne Wand)', 'Adiabatische eindtemperatuur (zonder wand)', 'Température finale adiabatique (sans paroi)', 'Temperatura final adiabática (sin pared)', 'Adiabatyczna temperatura końcowa (bez ścianki)'), r.T_ad, '°C', 'heat');
      add(T('Tank capacity at 100 % SOC', 'Місткість бака при 100 % SOC', 'Tankinhalt bei 100 % SOC', 'Tankinhoud bij 100 % SOC', 'Capacité à 100 % SOC', 'Capacidad al 100 % SOC', 'Pojemność przy 100 % SOC'), r.m_cap, 'kg', 'soc');
      add(T('Initial state of charge', 'Початковий ступінь заповнення', 'Anfangsfüllgrad', 'Begin-vullingsgraad', 'État de charge initial', 'Estado de carga inicial', 'Początkowy stopień napełnienia'), r.soc0, '%', 'soc');
      add(T('Precooling duty', 'Навантаження охолодження', 'Vorkühlleistung je kg', 'Voorkoelvermogen per kg', 'Besoin de prérefroidissement', 'Demanda de preenfriamiento', 'Zapotrzebowanie chłodzenia'), r.q_pc_kJkg, 'kJ/kg', 'precool');
      add(T('Hydrogen per day', 'Водню на добу', 'Wasserstoff pro Tag', 'Waterstof per dag', 'Hydrogène par jour', 'Hidrógeno al día', 'Wodór na dobę'), r.kg_day, 'kg/day', 'precool');
      add(T('Chiller electricity per day', 'Електроенергія охолодження на добу', 'Kältestrom pro Tag', 'Koelelektriciteit per dag', 'Électricité de froid par jour', 'Electricidad de frío al día', 'Energia chłodzenia na dobę'), r.E_chill_day, 'kWh/day', 'precool');
    }
    var OK = T('yes', 'так', 'ja', 'ja', 'oui', 'sí', 'tak'), NO = T('no', 'ні', 'nein', 'nee', 'non', 'no', 'nie');
    tables.push({ title: T('Fill limits (SAE J2601:2020, ISO 19880-1:2020)', 'Межі заправки (SAE J2601:2020, ISO 19880-1:2020)', 'Betankungsgrenzen (SAE J2601:2020, ISO 19880-1:2020)', 'Tankgrenzen (SAE J2601:2020, ISO 19880-1:2020)', 'Limites de remplissage (SAE J2601:2020, ISO 19880-1:2020)', 'Límites de repostaje (SAE J2601:2020, ISO 19880-1:2020)', 'Limity tankowania (SAE J2601:2020, ISO 19880-1:2020)'),
      head: [T('Limit', 'Межа', 'Grenze', 'Grens', 'Limite', 'Límite', 'Limit'), { label: T('Value', 'Значення', 'Wert', 'Waarde', 'Valeur', 'Valor', 'Wartość'), num: true }, T('Met', 'Виконано', 'Erfüllt', 'Voldaan', 'Respectée', 'Cumple', 'Spełniony')],
      rows: [
        { cells: [T('Gas temperature ≤ 85 °C', 'Температура газу ≤ 85 °C', 'Gastemperatur ≤ 85 °C', 'Gastemperatuur ≤ 85 °C', 'Température du gaz ≤ 85 °C', 'Temperatura del gas ≤ 85 °C', 'Temperatura gazu ≤ 85 °C'), { value: r.T_end, precision: 1 }, r.okT ? OK : NO] },
        { cells: [T('Pressure ≤ 1.25 × NWP', 'Тиск ≤ 1,25 × NWP', 'Druck ≤ 1,25 × NWP', 'Druk ≤ 1,25 × NWP', 'Pression ≤ 1,25 × NWP', 'Presión ≤ 1,25 × NWP', 'Ciśnienie ≤ 1,25 × NWP'), { value: r.p_end_MPa, precision: 1 }, r.okP ? OK : NO] },
        { cells: [T('Mass flow ≤ 60 g/s (light duty)', 'Витрата ≤ 60 г/с (легкові)', 'Massenstrom ≤ 60 g/s (Pkw)', 'Massadebiet ≤ 60 g/s (licht)', 'Débit ≤ 60 g/s (véhicules légers)', 'Caudal ≤ 60 g/s (ligeros)', 'Strumień ≤ 60 g/s (lekkie)'), { value: r.mdot_gs, precision: 1 }, r.okM ? OK : NO] }
      ] });
    notes.push(T('Basis: 100 % SOC = density at NWP and 15 °C (' + DiagramUI.fmt(r.rho100, { precision: 2 }) + ' kg/m³); real-gas properties of normal hydrogen by Leachman (2009); inflow enthalpy at the precooling temperature and 1.25 × NWP',
      'Основа: 100 % SOC = густина при NWP і 15 °C (' + DiagramUI.fmt(r.rho100, { precision: 2 }) + ' кг/м³); властивості реального нормального водню за Leachman (2009); ентальпія притоку при температурі охолодження та 1,25 × NWP',
      'Grundlage: 100 % SOC = Dichte bei NWP und 15 °C (' + DiagramUI.fmt(r.rho100, { precision: 2 }) + ' kg/m³); Realgasdaten von Normalwasserstoff nach Leachman (2009); Zulaufenthalpie bei Vorkühltemperatur und 1,25 × NWP',
      'Basis: 100 % SOC = dichtheid bij NWP en 15 °C (' + DiagramUI.fmt(r.rho100, { precision: 2 }) + ' kg/m³); reëelgaseigenschappen van normale waterstof volgens Leachman (2009); instroomenthalpie bij voorkoeltemperatuur en 1,25 × NWP',
      'Base : 100 % SOC = masse volumique à la NWP et 15 °C (' + DiagramUI.fmt(r.rho100, { precision: 2 }) + ' kg/m³) ; propriétés de l’hydrogène normal en gaz réel selon Leachman (2009) ; enthalpie d’entrée à la température de prérefroidissement et 1,25 × NWP',
      'Base: 100 % SOC = densidad a NWP y 15 °C (' + DiagramUI.fmt(r.rho100, { precision: 2 }) + ' kg/m³); propiedades de gas real del hidrógeno normal según Leachman (2009); entalpía de entrada a la temperatura de preenfriamiento y 1,25 × NWP',
      'Podstawa: 100 % SOC = gęstość przy NWP i 15 °C (' + DiagramUI.fmt(r.rho100, { precision: 2 }) + ' kg/m³); właściwości gazu rzeczywistego wodoru normalnego wg Leachmana (2009); entalpia dopływu przy temperaturze chłodzenia i 1,25 × NWP'));
    for (i = 0; r.warnings && i < r.warnings.length; i++) { w = r.warnings[i]; notes.push(trMsg(w)); }
    return { verdict: verdict, tiles: tiles, meters: [], tables: tables, notes: notes };
  }

  function degrade() {
    document.title = 'diagram-ui.js v1 is required';
    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1');
    h.textContent = 'Hydrogen refuelling: vehicle fill';
    var p = document.createElement('p');
    p.textContent = 'The interactive interface could not load. The export, the calculation record '
                  + 'and the limitations are still available from the bar at the bottom of the page.';
    host.appendChild(h);
    host.appendChild(p);
    last = solve(state);
  }

    if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1') buildInterface();

    installData();
  }

              'Die Zapfsäule kann Gas nur so lange in den Tank drücken, wie der Versorgungsdruck der Station (Speicherbank) über dem Tankdruck liegt. Mit einer einzigen Bank ohne Kaskade endet die Betankung daher bei p_end ≤ p_bank (das Modell hat keinen Druckverlust der Zapfsäule, der Wert ist eine Obergrenze). Das Werkzeug löst p(T_end(ρ_b), ρ_b) = p_bank nach der Tankdichte ρ_b, wobei T_end aus derselben Energiebilanz m·u(T, ρ_b) + C_w·(T − T_0) = m_0·u_0 + (m − m_0)·h_in mit m = ρ_b·V stammt, und gibt SOC = ρ_b / ρ(NWP, 15 °C) aus. SAE J2601:2020 und ISO 19880-1:2020 lassen eine H70-Zapfsäule bis 1,25 × NWP = 87,5 MPa liefern, daher halten H70-Stationen ihre Hochdruckbank auf etwa 875 bar oder mehr; eine 700-bar-Bank kann einen H70-Tank nicht füllen, weil das beim Betanken erwärmte Gas bei 100 % SOC etwa 84 MPa braucht. 0 = nicht begrenzend. Ein per Übergabe empfangener Verdichter setzt p_bank (er füllt die Bank).',
              'De dispenser kan alleen gas in de tank persen zolang de leverdruk van het station (bank) boven de tankdruk ligt. Met één bank zonder cascade eindigt de tankbeurt dus bij p_end ≤ p_bank (het model kent geen drukverlies in de dispenser, dit is een bovengrens). Het hulpmiddel lost p(T_end(ρ_b), ρ_b) = p_bank op naar de tankdichtheid ρ_b, waarbij T_end uit dezelfde energiebalans m·u(T, ρ_b) + C_w·(T − T_0) = m_0·u_0 + (m − m_0)·h_in met m = ρ_b·V komt, en geeft SOC = ρ_b / ρ(NWP, 15 °C). Volgens SAE J2601:2020 en ISO 19880-1:2020 mag een H70-dispenser tot 1,25 × NWP = 87,5 MPa leveren, daarom houden H70-stations hun hogedrukbank op ongeveer 875 bar of meer; een bank van 700 bar kan een H70-tank niet vol krijgen, omdat het bij het tanken opgewarmde gas bij 100 % SOC ongeveer 84 MPa nodig heeft. 0 = niet beperkend. Een via overdracht ontvangen compressor zet p_bank (hij vult de bank).',
              'Le distributeur ne peut pousser du gaz dans le réservoir que tant que la pression d’alimentation de la station (stockage tampon) dépasse la pression du réservoir. Avec un seul stockage sans cascade, le remplissage s’arrête donc à p_end ≤ p_bank (le modèle n’a pas de perte de charge du distributeur, c’est une borne supérieure). L’outil résout p(T_end(ρ_b), ρ_b) = p_bank pour la masse volumique ρ_b du réservoir, T_end venant du même bilan d’énergie m·u(T, ρ_b) + C_w·(T − T_0) = m_0·u_0 + (m − m_0)·h_in avec m = ρ_b·V, et donne SOC = ρ_b / ρ(NWP, 15 °C). SAE J2601:2020 et ISO 19880-1:2020 permettent à un distributeur H70 de fournir jusqu’à 1,25 × NWP = 87,5 MPa ; les stations H70 maintiennent donc leur stockage haute pression vers 875 bar ou plus ; un stockage de 700 bar ne peut pas remplir un réservoir H70, car le gaz réchauffé par le remplissage demande environ 84 MPa à 100 % de SOC. 0 = non limitant. Un compresseur reçu par transfert fixe p_bank (il remplit le stockage).',
              'El surtidor solo puede introducir gas en el depósito mientras la presión de suministro de la estación (banco) supere la del depósito. Con un solo banco y sin cascada, el llenado termina por tanto en p_end ≤ p_bank (el modelo no tiene pérdida de carga del surtidor, es una cota superior). La herramienta resuelve p(T_end(ρ_b), ρ_b) = p_bank para la densidad ρ_b del depósito, con T_end del mismo balance de energía m·u(T, ρ_b) + C_w·(T − T_0) = m_0·u_0 + (m − m_0)·h_in con m = ρ_b·V, y da SOC = ρ_b / ρ(NWP, 15 °C). SAE J2601:2020 e ISO 19880-1:2020 permiten a un surtidor H70 suministrar hasta 1,25 × NWP = 87,5 MPa, por lo que las estaciones H70 mantienen su banco de alta presión en unos 875 bar o más; un banco de 700 bar no puede llenar un depósito H70, porque el gas calentado por el llenado necesita unos 84 MPa al 100 % de SOC. 0 = no limita. Un compresor recibido por transferencia fija p_bank (llena el banco).',
              'Dystrybutor może wtłaczać gaz do zbiornika tylko dopóty, dopóki ciśnienie zasilania stacji (banku) jest wyższe od ciśnienia w zbiorniku. Przy jednym banku bez kaskady tankowanie kończy się więc przy p_end ≤ p_bank (model nie ma spadku ciśnienia w dystrybutorze, to górne oszacowanie). Narzędzie rozwiązuje p(T_end(ρ_b), ρ_b) = p_bank względem gęstości w zbiorniku ρ_b, gdzie T_end pochodzi z tego samego bilansu energii m·u(T, ρ_b) + C_w·(T − T_0) = m_0·u_0 + (m − m_0)·h_in przy m = ρ_b·V, i podaje SOC = ρ_b / ρ(NWP, 15 °C). SAE J2601:2020 i ISO 19880-1:2020 pozwalają dystrybutorowi H70 podawać do 1,25 × NWP = 87,5 MPa, dlatego stacje H70 utrzymują bank wysokiego ciśnienia na ok. 875 bar lub więcej; bank 700 bar nie napełni zbiornika H70, bo gaz ogrzany podczas tankowania potrzebuje przy 100 % SOC ok. 84 MPa. 0 = bez ograniczenia. Sprężarka otrzymana przez przekazanie danych ustawia p_bank (napełnia bank).'

    function curveData() {
      if (!last || !last.ok) return null;
      var s = {}, k, i, r, pts = [], ymn = 85, ymx = 85, x;
      for (k in state) if (Object.prototype.hasOwnProperty.call(state, k)) s[k] = state[k];
      for (i = 0; i <= 26; i++) {
        x = -20 + 2.5 * i; s.T_amb = x; s.T_pc = Math.min(state.T_pc, x); r = solve(s);
        if (r && r.ok) { pts.push({ x: x, a: r.T_end, b: r.T_ad }); ymn = Math.min(ymn, r.T_end, r.T_ad); ymx = Math.max(ymx, r.T_end, r.T_ad); }
      }
      return { pts: pts, xMin: -20, xMax: 45, yMin: ymn - 5, yMax: ymx + 5, xCur: state.T_amb, yCur: last.T_end };

          'Gráfico de líneas: temperatura final del gas en el depósito en °C frente a la temperatura ambiente de −20 a 45 °C, con absorción de calor por la pared y adiabática, y el límite de 85 °C; con ' + a + ' °C de ambiente el llenado termina a ' + b + ' °C (adiabático ' + c + ' °C).',
          'Wykres liniowy: końcowa temperatura gazu w zbiorniku w °C w funkcji temperatury otoczenia od −20 do 45 °C, z pochłanianiem ciepła przez ściankę i adiabatycznie, oraz granica 85 °C; przy ' + a + ' °C otoczenia tankowanie kończy się przy ' + b + ' °C (adiabatycznie ' + c + ' °C).'));

      render: function (size, st) {
        var ctx = st.canvas(), w = size.w, h = size.h, coarse = size.density === 'coarse';
        var cs = getComputedStyle(document.documentElement);
        var muted = cs.getPropertyValue('--muted').trim() || '#888', line = cs.getPropertyValue('--line').trim() || '#ccc', font = cs.getPropertyValue('--font').trim() || 'sans-serif';
        ctx.clearRect(0, 0, w, h);
        var d = curveData(); if (!d) return;
        var L = coarse ? 46 : 58, R = 14, TOP = 12, B = coarse ? 36 : 44, pw = w - L - R, ph = h - TOP - B, i, t;
        function X(x) { return L + (x - d.xMin) / (d.xMax - d.xMin) * pw; }
        function Y(y) { return TOP + ph - (y - d.yMin) / (d.yMax - d.yMin) * ph; }
        function seg(x0, y0, x1, y1, col, lw, dash) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.setLineDash(dash || []); ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
        seg(L, TOP, L, TOP + ph, line, 1); seg(L, TOP + ph, L + pw, TOP + ph, line, 1);

        for (i = 0; i < xt.length; i++) { t = X(xt[i]); seg(t, TOP + ph, t, TOP + ph + 4, line, 1); ctx.fillText(DiagramUI.fmt(xt[i], { precision: 0 }), t, TOP + ph + 6); }

        ctx.save(); ctx.beginPath(); ctx.rect(L, TOP, pw, ph); ctx.clip();
        seg(X(d.xCur), TOP, X(d.xCur), TOP + ph, muted, 1, [5, 4]);
        function poly(key, col, lw, dash) { ctx.setLineDash(dash || []); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
          for (var j = 0; j < d.pts.length; j++) { if (j) ctx.lineTo(X(d.pts[j].x), Y(d.pts[j][key])); else ctx.moveTo(X(d.pts[j].x), Y(d.pts[j][key])); } ctx.stroke(); }
        seg(L, Y(85), L + pw, Y(85), DiagramUI.series(2), 1.5, [6, 4]);
        poly('a', DiagramUI.series(0), 2); poly('b', DiagramUI.series(1), 1.5, [5, 3]);
        ctx.setLineDash([]);
        if (isFinite(d.yCur)) { ctx.fillStyle = DiagramUI.series(0); ctx.beginPath(); ctx.arc(X(d.xCur), Y(d.yCur), coarse ? 3 : 4, 0, 2 * Math.PI); ctx.fill(); }
        ctx.restore();
      }
    });

    ui.ready();
    window['__hrs_refuelling'] = { ui: ui, state: state, solve: solve, last: function () { return last; } };

    if (!last) return null;
    var inputs = {}, outputs = {}, units = {}, warnings, i, k;
    var inU = [['level','-'], ['cls','-'], ['V_L','L'], ['p0_MPa','MPa'], ['T_amb','degC'], ['T_pc','degC'], ['aprr','MPa/min'], ['soc','%'], ['wall_kJK','kJ/K'], ['cop','-'], ['fills_day','1/day'], ['p_bank','bar']];
    for (i = 0; i < inU.length; i++) { k = inU[i][0]; inputs[k] = state[k]; units[k] = inU[i][1]; }
    if (last.ok) {
      var outU = [
        ['nwp_MPa','MPa'], ['mop_MPa','MPa'], ['rho100','kg/m3'], ['m_cap','kg'], ['m0','kg'], ['m1','kg'], ['m_fill','kg'], ['soc0','%'],
        ['T_ad','degC'], ['p_ad_MPa','MPa'], ['T_end','degC'], ['p_end_MPa','MPa'], ['t_min','min'], ['mdot_gs','g/s'],
        ['q_pc_kJkg','kJ/kg'], ['Q_pc_kWh','kWh per fill'], ['E_chill_kWh','kWh per fill'], ['E_chill_kWh_kg','kWh/kg'], ['kg_day','kg/day'], ['E_chill_day','kWh/day'],
        ['okT','-'], ['okP','-'], ['okM','-'], ['pass','-'], ['p_bank_MPa','MPa'], ['bank_limited','-'], ['soc_target','%'], ['soc_end','%'], ['energy_basis','-']
      ];
      for (i = 0; i < outU.length; i++) { k = outU[i][0]; outputs[k] = last[k]; units[k] = outU[i][1]; }
      warnings = (last.warnings || []).slice();
    } else {
      warnings = [last.error];
    }
    return {
      inputs: inputs,
      outputs: outputs,
      units: units,
      model: {
        equations: [
          'SAE J2601:2020 (2020-05): 100 % SOC = rho(NWP, 15 degC); limits T <= 85 degC, p <= 1.25 NWP, light-duty flow <= 60 g/s',
          'm1 = SOC * rho100 * V; m0 = rho(T_amb, p0) * V',
          'm1 u(T1, rho1) + Cw (T1 - T0) = m0 u0 + (m1 - m0) h(T_pc, 1.25 NWP)  (single-zone tank, throttled inflow)',
          'p1 = p(T1, rho1); t = (p1 - p0) / APRR; Q_pc = m_fill [h(T_amb) - h(T_pc)] at 1.25 NWP',
          'Single station bank (no cascade), p_bank > 0: if p1 > p_bank, solve p(T1(rho_b), rho_b) = p_bank with T1 from the same balance at m = rho_b V; SOC_end = rho_b / rho100 (no dispenser dP: upper bound)',
          'Hydrogen: Leachman et al. (2009) EOS for normal hydrogen (ogh-core.js)'
        ],
        ranges: [ 'H70 and H35 light-duty tanks; heavy-duty fills only indicative', 'Ambient -40 to 50 degC, precooling -45 degC to ambient' ],
        notes: [ 'No time-resolved heat transfer: the ramp rate sets only the fill time', 'The APRR must be taken from the J2601 lookup tables for the station category and ambient temperature' ]
      },
      warnings: warnings
    };
  }

  var HANDOFF = {
    provides: ['p', 'T', 'mdot'],
    accepts: ['p'],
    build: function(){
      if (!(last && last.ok)) return null;
      return {
        quantities: {
          p: { value: last.mop_MPa * 1e6, unit: 'Pa' },
          T: { value: state.T_pc + 273.15, unit: 'K' },
          mdot: { value: last.m_fill * last.inputs.fills_day / 86400, unit: 'kg/s' }
        },
        /* numeric SI rows only; fill mass (kg) stays in the record */
        sets: { storage: [{ mdot_dispensed_avg: { value: last.kg_day / 86400, unit: 'kg/s' } }] }
      };
    },
    /* r3 D-r3-1: received p = station compressor discharge, which fills the bank -> p_bank (bar); it also selects H70/H35 (p > 50 MPa -> H70) */
    apply: function(payload){
      var q = (payload && payload.quantities) || {}, v, acc = [];
      function val(o){ return (o && typeof o === 'object') ? +o.value : +o; }
      if (q.p != null) { v = val(q.p); if (isFinite(v) && v > 0) { state.cls = v > 50e6 ? 'H70' : 'H35'; state.p_bank = Math.round(v / 1e5 * 10) / 10;
        acc.push(DiagramUI.t(T('p → station bank pressure (and pressure class H70/H35)', 'p → тиск буферного сховища станції (і клас тиску H70/H35)', 'p → Stationsspeicherdruck (und Druckklasse H70/H35)', 'p → bankdruk van het station (en drukklasse H70/H35)', 'p → pression du stockage tampon (et classe de pression H70/H35)', 'p → presión del banco de la estación (y clase de presión H70/H35)', 'p → ciśnienie banku stacji (i klasa ciśnienia H70/H35)'))); } }
      last = solve(state);
      if (ui) { ui.sync(); ui.run(); }
      return { accepted: acc, ignored: Object.keys(q).filter(function (k) { return k !== 'p'; }) };
    }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'hrs_refuelling',
        file: 'hrs_refuelling.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
