 concScope:"Die Zahl ist die Strömungsfläche, die diese eine Beziehung verlangt. Sie ist keine zertifizierte wirksame Blendenfläche und sie wählt kein Gerät aus: zertifizierter Kd, die Korrekturfaktoren aus API 520/521 und ISO 4126, die genormten Blendenbezeichnungen sowie die Einbaukriterien für Zu- und Ableitung liegen außerhalb dieses Werkzeugs.",
 system:"Die erforderliche Fläche folgt aus einer einzigen Massenflussbeziehung, geteilt durch den Ausflussbeiwert. Für ein Gas ist der Fluss der Idealgas-Blendenwert beim Druckverhältnis über dem Gerät, unterhalb des Übergangsverhältnisses aus dem kritischen und oberhalb aus dem unterkritischen Ausdruck. Für eine Flüssigkeit ist es der inkompressible Bernoulli-Wert. Der Fluss hängt nicht vom geforderten Massenstrom ab, die Fläche steigt daher proportional mit ihm.",
 figCap:"Erforderliche Strömungsfläche über dem Zielmassenstrom, von null bis 120 % des Ziels. Die Steigung ist die Fläche je Kilogramm pro Sekunde.",
 ckSize:"Schließung der Auslegungsform",
 ckSizeB:"Der aus der ausgegebenen Fläche als Cd·A·G zurückgerechnete Massenstrom gegen den geforderten. Das liest die Auslegungsform A = ṁ/(Cd·G) rückwärts und prüft die Arithmetik der Fläche.",
 ckDia:"Schließung der Ersatzbohrung",
 ckDiaB:"Die Kreisfläche π d²/4 aus der ausgegebenen Ersatzbohrung gegen die ausgegebene Strömungsfläche. Die Bohrung ist eine Umformulierung der Fläche und muss sie zurückgeben.",
 ckRoute:"Massenfluss über einen unabhängigen Weg",
 ckRouteB:"Für ein Gas wird der Fluss als Dichte mal Geschwindigkeit im engsten Querschnitt aufgebaut: Schallzustand ρ*·a* im kritischen Zweig, isentrop entspannter Zustand ρ₂·v₂ im unterkritischen. Für eine Flüssigkeit aus der Geschwindigkeitshöhe, v = √(2Δp/ρ) und G = ρ·v. Jeder Weg führt algebraisch auf den Ausdruck des Werkzeugs über eine andere Rechenfolge.",
 ckCont:"Zweigstetigkeit am Übergangsverhältnis",
 ckContB:"Kritischer und unterkritischer Gasausdruck, ausgewertet am Übergangsverhältnis (2/(γ+1))^(γ/(γ−1)) mit den Gaseigenschaften dieses Falls. Der unterkritische Fluss ist dort stationär, beide Ausdrücke liefern einen Wert und der Wechsel erzeugt keine Stufe.",
 ckZ:"Skalierung mit 1/√Z",
 ckZB:"Beide Gaszweige tragen den Realgasfaktor nur als 1/√Z. Der beim Z des Falls berechnete Fluss, mit √Z multipliziert, muss den bei Z = 1 berechneten Fluss zurückgeben.",
 ckTarget:"Gezeichnete Kurve beim Zielmassenstrom",
 ckTargetB:"Die Kurve ist mit 61 Punkten von null bis 120 % des Ziels abgetastet, der Punkt bei 100 % ist daher die ausgegebene Fläche. Bild und Ergebnistabelle tragen somit eine Fläche.",
 ckLin:"Proportionalität von Fläche und Massenstrom",
 ckLinB:"Der Massenfluss folgt allein aus Druckverhältnis und Fluidzustand, die erforderliche Fläche steigt daher proportional zum geforderten Massenstrom. Angegeben ist die größte Abweichung der 61 Punkte von einer Ursprungsgeraden.",
 ckReg:"Maßgebender Zweig",
 ckRegB:"Das Druckverhältnis über dem Gerät gegen das Übergangsverhältnis, zusammen mit dem geltenden Phasenmodell. Der Zweig entscheidet, welcher Ausdruck den Massenfluss und damit die Fläche setzt.",
 rPhaseGas:"ideales Gas",rPhaseLiq:"inkompressible Flüssigkeit",
 rBrChoked:"kritisch",rBrSub:"unterkritisch",rBrLiq:"inkompressibles Bernoulli",
 riskCodeT:"Normkonformität und Geräteauswahl",
 riskCode:"Kein Teil von API 520/521 oder ISO 4126 ist hier umgesetzt. Zertifizierter Kd, die Korrekturen für Gegendruck, Viskosität und Zweiphasigkeit, die genormten Buchstabenbezeichnungen der Blenden, das Kriterium für den Zulauf-Druckverlust und das Kriterium für den aufgebauten Gegendruck fehlen sämtlich. Eine Fläche von dieser Seite trägt keine Konformitätsaussage und ersetzt keine Geräteauswahl.",
 riskPropT:"Fluidmodell",
 riskProp:"Der Gaszweig ist ein ideales Gas mit konstantem γ und einem vom Benutzer gesetzten Realgasfaktor; der Flüssigkeitszweig ist einphasig und inkompressibel. Ausdampfen, Zweiphasenabblasung, kondensierbarer Dampf und die Korrektur für zähe Flüssigkeiten liegen außerhalb des Modells.",
 riskStateT:"Abblasezustand",
 riskState:"Vordruck, Temperatur und Gegendruck gelten als gegebene Konstanten. Ansprechüberdruck, Zulaufverlust, aufgebauter Gegendruck aus der Sammelleitung und jede Transiente des Abblaseszenarios bleiben beim Anwender.",
 mNote:"Der Ausflussbeiwert wird direkt eingegeben und multipliziert den idealen Fluss. Er vertritt keinen zertifizierten Kd und enthält keine Abminderung.",
 axFlow:"Zielmassenstrom",axArea:"Erforderliche Strömungsfläche",
 rArea:"Erforderliche Strömungsfläche",rBore:"Ersatzbohrung",rFlux:"Idealer Massenfluss",
 rRhoUp:"Dichte vor dem Gerät",rRatio:"Druckverhältnis p_b/p₁",rDp:"Differenzdruck",
 rP1:"Abblasedruck",rPb:"Gegendruck",rT:"Abblasetemperatur",
 rMdot:"Geforderter Massenstrom",rCd:"Ausflussbeiwert",rAreaCd:"Ideale Fläche bei Cd = 1",
 rRc:"Übergangs-Druckverhältnis",rOfTrans:"mal das Übergangsverhältnis",
 rVel:"Geschwindigkeit im engsten Querschnitt",rSlope:"Fläche je Massenstrom",rPhaseLabel:"Phasenmodell",
 flowSource:"Abblasequelle",flowValve:"Abblasegerät",flowDischarge:"Abströmung",
 dPhase:"Phasenmodell",dPhaseWhy:"Die Phase entscheidet, welche Massenflussbeziehung für die ganze Rechnung gilt.",
 dCd:"Ausflussbeiwert",dCdWhy:"Direkt eingegeben und als Faktor auf den idealen Fluss angewandt.",
 dZ:"Realgasfaktor",dZWhy:"Geht in beide Gaszweige als 1/√Z ein und bleibt über die Entspannung konstant.",
 dBack:"Gegendruck",dBackWhy:"Setzt das Druckverhältnis und damit, ob der kritische Zweig maßgebend ist."},
nl:{title:"Veiligheidsklepdimensionering — vereist doorstroomoppervlak uit de orifice-relatie",
 summary:"Een vereiste afblaas van {m} kg/s bij {p1} bar tegen een tegendruk van {pb} bar, behandeld als {phase}, vraagt {A} mm² doorstroomoppervlak bij een uitstroomcoëfficiënt van {Cd}, oftewel een equivalente boring van {d} mm. De bepalende tak is {branch}, met een ideale massaflux van {G} kg/(m²·s).",
 concScope:"Het getal is het doorstroomoppervlak dat deze ene relatie vraagt. Het is geen gecertificeerd effectief orifice-oppervlak en het kiest geen toestel: gecertificeerde Kd, de correctiefactoren uit API 520/521 en ISO 4126, de genormeerde orifice-aanduidingen en de installatiecriteria voor toe- en afvoer liggen alle buiten dit gereedschap.",
 system:"Het vereiste oppervlak volgt uit één massafluxrelatie gedeeld door de uitstroomcoëfficiënt. Voor een gas is de flux de ideaal-gaswaarde bij de drukverhouding over het toestel, onder de overgangsverhouding uit de kritische en erboven uit de subkritische uitdrukking. Voor een vloeistof is het de onsamendrukbare Bernoulli-waarde. De flux hangt niet van de vereiste massastroom af, dus het oppervlak stijgt evenredig mee.",
 figCap:"Vereist doorstroomoppervlak tegen de doelmassastroom, van nul tot 120 % van het doel. De helling is het oppervlak per kilogram per seconde.",
 ckSize:"Sluiting van de dimensioneringsvorm",
 ckSizeB:"De uit het gemelde oppervlak teruggerekende massastroom Cd·A·G tegen de gevraagde massastroom. Dit leest de vorm A = ṁ/(Cd·G) achterstevoren en toetst de rekenkunde van het oppervlak.",
 ckDia:"Sluiting van de equivalente boring",
 ckDiaB:"Het cirkeloppervlak π d²/4 uit de gemelde equivalente boring tegen het gemelde doorstroomoppervlak. De boring is een herformulering van het oppervlak en moet het teruggeven.",
 ckRoute:"Massaflux langs een onafhankelijke weg",
 ckRouteB:"Voor een gas wordt de flux opgebouwd als dichtheid maal snelheid in de keel: de sonische toestand ρ*·a* op de kritische tak, de isentroop geëxpandeerde toestand ρ₂·v₂ op de subkritische. Voor een vloeistof uit de snelheidshoogte, v = √(2Δp/ρ) en G = ρ·v. Elk pad herleidt algebraïsch tot de uitdrukking van het gereedschap langs een andere rekenvolgorde.",
 ckCont:"Takcontinuïteit bij de overgangsverhouding",
 ckContB:"De kritische en de subkritische gasuitdrukking, geëvalueerd bij de overgangsverhouding (2/(γ+1))^(γ/(γ−1)) met de gaseigenschappen van dit geval. De subkritische flux is daar stationair, dus beide uitdrukkingen leveren één waarde en de omschakeling geeft geen sprong.",
 ckZ:"Schaling met 1/√Z",
 ckZB:"Beide gastakken dragen de compressibiliteitsfactor uitsluitend als 1/√Z. De flux berekend bij de Z van het geval, vermenigvuldigd met √Z, moet de flux bij Z = 1 teruggeven.",
 ckTarget:"Getekende kromme bij de doelmassastroom",
 ckTargetB:"De kromme is bemonsterd met 61 punten van nul tot 120 % van het doel, zodat het punt bij 100 % het gemelde oppervlak is. Figuur en resultatentabel dragen daarmee één oppervlak.",
 ckLin:"Evenredigheid van oppervlak en massastroom",
 ckLinB:"De massaflux volgt alleen uit de drukverhouding en de fluïdumtoestand, dus het vereiste oppervlak stijgt evenredig met de vereiste massastroom. Gemeld is de grootste afwijking van de 61 punten van een rechte door de oorsprong.",
 ckReg:"Bepalende tak",
 ckRegB:"De drukverhouding over het toestel tegen de overgangsverhouding, samen met het geldende fasemodel. De tak bepaalt welke uitdrukking de massaflux en daarmee het oppervlak vastlegt.",
 rPhaseGas:"een ideaal gas",rPhaseLiq:"een onsamendrukbare vloeistof",
 rBrChoked:"kritisch",rBrSub:"subkritisch",rBrLiq:"onsamendrukbare Bernoulli",
 riskCodeT:"Normconformiteit en toestelkeuze",
 riskCode:"Geen enkel deel van API 520/521 of ISO 4126 is hier geïmplementeerd. Gecertificeerde Kd, de correcties voor tegendruk, viscositeit en tweefasenstroming, de genormeerde letteraanduidingen van orifices, het criterium voor toevoerdrukverlies en het criterium voor opgebouwde tegendruk ontbreken alle. Een oppervlak van deze pagina draagt geen conformiteitsuitspraak en vervangt geen toestelkeuze.",
 riskPropT:"Fluïdummodel",
 riskProp:"De gastak is een ideaal gas met constante γ en één door de gebruiker gegeven compressibiliteitsfactor; de vloeistoftak is eenfasig en onsamendrukbaar. Flashing, tweefasenafblaas, condenseerbare damp en de correctie voor viskeuze vloeistof vallen buiten het model.",
 riskStateT:"Afblaastoestand",
 riskState:"Bovendruk, temperatuur en tegendruk gelden als gegeven constanten. Accumulatie, toevoerleidingverlies, opgebouwde tegendruk uit het afblaascollector en elke transiënt in het afblaasscenario blijven aan de gebruiker.",
 mNote:"De uitstroomcoëfficiënt wordt rechtstreeks ingevoerd en vermenigvuldigt de ideale flux. Hij vervangt geen gecertificeerde Kd en bevat geen derating.",
 axFlow:"Doelmassastroom",axArea:"Vereist doorstroomoppervlak",
 rArea:"Vereist doorstroomoppervlak",rBore:"Equivalente boring",rFlux:"Ideale massaflux",
 rRhoUp:"Dichtheid vóór het toestel",rRatio:"Drukverhouding p_b/p₁",rDp:"Drukverschil",
 rP1:"Afblaasdruk",rPb:"Tegendruk",rT:"Afblaastemperatuur",
 rMdot:"Vereiste massastroom",rCd:"Uitstroomcoëfficiënt",rAreaCd:"Ideaal oppervlak bij Cd = 1",
 rRc:"Overgangsdrukverhouding",rOfTrans:"maal de overgangsverhouding",
 rVel:"Keelsnelheid",rSlope:"Oppervlak per massastroom",rPhaseLabel:"Fasemodel",
 flowSource:"Afblaasbron",flowValve:"Afblaastoestel",flowDischarge:"Afvoer",
 dPhase:"Fasemodel",dPhaseWhy:"De fase bepaalt welke massafluxrelatie voor de hele berekening geldt.",
 dCd:"Uitstroomcoëfficiënt",dCdWhy:"Rechtstreeks ingevoerd en als factor op de ideale flux toegepast.",
 dZ:"Compressibiliteitsfactor",dZWhy:"Komt in beide gastakken binnen als 1/√Z en blijft constant over de expansie.",
 dBack:"Tegendruk",dBackWhy:"Bepaalt de drukverhouding en daarmee of de kritische tak bepalend is."},
fr:{title:"Dimensionnement de soupape — section requise par la relation d'orifice",
 summary:"Un débit de décharge requis de {m} kg/s à {p1} bar contre une contre-pression de {pb} bar, traité comme {phase}, appelle {A} mm² de section de passage pour un coefficient de décharge de {Cd}, soit un alésage équivalent de {d} mm. La branche gouvernante est {branch}, avec un flux massique idéal de {G} kg/(m²·s).",
 concScope:"Ce chiffre est la section de passage qu'exige cette seule relation. Ce n'est pas une section d'orifice effective certifiée et cela ne choisit aucun appareil : le Kd certifié, les facteurs correctifs d'API 520/521 et d'ISO 4126, les désignations normalisées d'orifices et les critères d'installation amont et aval se situent hors de cet outil.",
 system:"La section requise découle d'une seule relation de flux massique divisée par le coefficient de décharge. Pour un gaz, le flux est la valeur d'orifice en gaz parfait au rapport de pression traversant l'appareil, tirée de l'expression critique sous le rapport de transition et de l'expression sous-critique au-dessus. Pour un liquide, c'est la valeur de Bernoulli incompressible. Le flux ne dépend pas du débit requis, la section croît donc proportionnellement à celui-ci.",
 figCap:"Section requise en fonction du débit massique cible, de zéro à 120 % de la cible. La pente est la section appelée par chaque kilogramme par seconde.",
 ckSize:"Fermeture de la forme de dimensionnement",
 ckSizeB:"Le débit reconstitué à partir de la section indiquée, Cd·A·G, face au débit demandé. Cela lit la forme A = ṁ/(Cd·G) à l'envers et teste l'arithmétique de la section.",
 ckDia:"Fermeture de l'alésage équivalent",
 ckDiaB:"La section circulaire π d²/4 formée depuis l'alésage équivalent indiqué, face à la section de passage indiquée. L'alésage est une reformulation de la section et doit la restituer.",
 ckRoute:"Flux massique par une voie indépendante",
 ckRouteB:"Pour un gaz le flux est reconstruit comme masse volumique fois vitesse au col : l'état sonique ρ*·a* sur la branche critique, l'état détendu isentropiquement ρ₂·v₂ sur la branche sous-critique. Pour un liquide, depuis la hauteur cinétique, v = √(2Δp/ρ) et G = ρ·v. Chaque voie se ramène algébriquement à l'expression de l'outil par un autre enchaînement de calculs.",
 ckCont:"Continuité des branches au rapport de transition",
 ckContB:"Les expressions gazeuses critique et sous-critique évaluées au rapport de transition (2/(γ+1))^(γ/(γ−1)) avec les propriétés de gaz de ce cas. Le flux sous-critique y est stationnaire, les deux expressions rendent donc une seule valeur et la commutation n'introduit aucun saut.",
 ckZ:"Mise à l'échelle en 1/√Z",
 ckZB:"Les deux branches gazeuses ne portent le facteur de compressibilité que comme 1/√Z. Le flux calculé au Z du cas, multiplié par √Z, doit rendre le flux calculé à Z = 1.",
 ckTarget:"Courbe tracée au débit cible",
 ckTargetB:"La courbe est échantillonnée en 61 points de zéro à 120 % de la cible, le point à 100 % est donc la section indiquée. Figure et tableau des résultats portent ainsi une seule section.",
 ckLin:"Proportionnalité de la section au débit",
 ckLinB:"Le flux massique ne dépend que du rapport de pression et de l'état du fluide, la section requise croît donc proportionnellement au débit requis. Est indiqué le plus grand écart des 61 points à une droite passant par l'origine.",
 ckReg:"Branche gouvernante",
 ckRegB:"Le rapport de pression traversant l'appareil face au rapport de transition, avec le modèle de phase en vigueur. La branche décide quelle expression fixe le flux massique et avec lui la section.",
 rPhaseGas:"un gaz parfait",rPhaseLiq:"un liquide incompressible",
 rBrChoked:"critique",rBrSub:"sous-critique",rBrLiq:"Bernoulli incompressible",
 riskCodeT:"Conformité normative et choix de l'appareil",
 riskCode:"Aucune partie d'API 520/521 ni d'ISO 4126 n'est implémentée ici. Le Kd certifié, les corrections de contre-pression, de viscosité et de diphasique, les désignations normalisées d'orifices, le critère de perte de charge amont et le critère de contre-pression engendrée à l'aval sont tous absents. Une section issue de cette page ne soutient aucune affirmation de conformité et ne vaut pas choix d'appareil.",
 riskPropT:"Modèle de fluide",
 riskProp:"La branche gazeuse est un gaz parfait à γ constant et un facteur de compressibilité fourni par l'utilisateur; la branche liquide est monophasique et incompressible. Le flash, la décharge diphasique, la vapeur condensable et la correction de liquide visqueux sortent du modèle.",
 riskStateT:"État de décharge",
 riskState:"Pression amont, température et contre-pression sont prises comme constantes données. L'accumulation, la perte de charge de la ligne d'entrée, la contre-pression engendrée par le collecteur et tout transitoire du scénario de décharge restent à établir par l'utilisateur.",
 mNote:"Le coefficient de décharge est saisi directement et multiplie le flux idéal. Il ne tient lieu d'aucun Kd certifié et ne porte aucune minoration.",
 axFlow:"Débit massique cible",axArea:"Section requise",
 rArea:"Section de passage requise",rBore:"Alésage équivalent",rFlux:"Flux massique idéal",
 rRhoUp:"Masse volumique amont",rRatio:"Rapport de pression p_b/p₁",rDp:"Pression différentielle",
 rP1:"Pression de décharge",rPb:"Contre-pression",rT:"Température de décharge",
 rMdot:"Débit massique requis",rCd:"Coefficient de décharge",rAreaCd:"Section idéale à Cd = 1",
 rRc:"Rapport de pression de transition",rOfTrans:"fois le rapport de transition",
 rVel:"Vitesse au col",rSlope:"Section par unité de débit",rPhaseLabel:"Modèle de phase",
 flowSource:"Source de décharge",flowValve:"Organe de décharge",flowDischarge:"Refoulement",
 dPhase:"Modèle de phase",dPhaseWhy:"La phase décide quelle relation de flux massique s'applique à tout le calcul.",
 dCd:"Coefficient de décharge",dCdWhy:"Saisi directement et appliqué comme facteur sur le flux idéal.",
 dZ:"Facteur de compressibilité",dZWhy:"Entre dans les deux branches gazeuses en 1/√Z et reste constant pendant la détente.",
 dBack:"Contre-pression",dBackWhy:"Fixe le rapport de pression et avec lui le caractère gouvernant de la branche critique."},
es:{title:"Dimensionado de válvula de alivio — área requerida por la relación de orificio",
 summary:"Un alivio requerido de {m} kg/s a {p1} bar contra una contrapresión de {pb} bar, tratado como {phase}, exige {A} mm² de área de paso con un coeficiente de descarga de {Cd}, es decir un diámetro equivalente de {d} mm. La rama gobernante es {branch}, con un flujo másico ideal de {G} kg/(m²·s).",
 concScope:"La cifra es el área de paso que exige esta única relación. No es un área efectiva de orificio certificada y no selecciona ningún dispositivo: el Kd certificado, los factores de corrección de API 520/521 e ISO 4126, las designaciones normalizadas de orificio y los criterios de instalación de entrada y salida quedan fuera de esta herramienta.",
 system:"El área requerida sale de una única relación de flujo másico dividida por el coeficiente de descarga. Para un gas el flujo es el valor de orificio de gas ideal a la relación de presiones a través del dispositivo, tomado de la expresión crítica por debajo de la relación de transición y de la subcrítica por encima. Para un líquido es el valor de Bernoulli incompresible. El flujo no depende del caudal requerido, así que el área crece en proporción a él.",
 figCap:"Área de paso requerida frente al caudal másico objetivo, de cero al 120 % del objetivo. La pendiente es el área que exige cada kilogramo por segundo.",
 ckSize:"Cierre de la forma de dimensionado",
 ckSizeB:"El caudal recuperado del área indicada como Cd·A·G, frente al caudal solicitado. Esto lee la forma A = ṁ/(Cd·G) al revés y prueba la aritmética del área.",
 ckDia:"Cierre del diámetro equivalente",
 ckDiaB:"El área circular π d²/4 formada con el diámetro equivalente indicado, frente al área de paso indicada. El diámetro es una reformulación del área y debe devolverla.",
 ckRoute:"Flujo másico por una vía independiente",
 ckRouteB:"Para un gas el flujo se reconstruye como densidad por velocidad en la garganta: el estado sónico ρ*·a* en la rama crítica y el estado expandido isentrópicamente ρ₂·v₂ en la subcrítica. Para un líquido, a partir de la altura de velocidad, v = √(2Δp/ρ) y G = ρ·v. Cada vía se reduce algebraicamente a la expresión de la herramienta por otro camino aritmético.",
 ckCont:"Continuidad de ramas en la relación de transición",
 ckContB:"Las expresiones de gas crítica y subcrítica evaluadas en la relación de transición (2/(γ+1))^(γ/(γ−1)) con las propiedades de gas de este caso. El flujo subcrítico es estacionario allí, de modo que ambas expresiones devuelven un valor y la conmutación no introduce escalón.",
 ckZ:"Escalado con 1/√Z",
 ckZB:"Ambas ramas de gas llevan el factor de compresibilidad solo como 1/√Z. El flujo calculado con la Z del caso, multiplicado por √Z, debe devolver el flujo calculado con Z = 1.",
 ckTarget:"Curva trazada en el caudal objetivo",
 ckTargetB:"La curva se muestrea en 61 puntos de cero al 120 % del objetivo, por lo que el punto al 100 % es el área indicada. Figura y tabla de resultados llevan así una sola área.",
 ckLin:"Proporcionalidad del área al caudal",
 ckLinB:"El flujo másico lo fijan únicamente la relación de presiones y el estado del fluido, así que el área requerida crece en proporción al caudal requerido. Se indica la mayor desviación de los 61 puntos respecto de una recta por el origen.",
 ckReg:"Rama gobernante",
 ckRegB:"La relación de presiones a través del dispositivo frente a la relación de transición, junto con el modelo de fase vigente. La rama decide qué expresión fija el flujo másico y con él el área.",
 rPhaseGas:"un gas ideal",rPhaseLiq:"un líquido incompresible",
 rBrChoked:"crítica",rBrSub:"subcrítica",rBrLiq:"Bernoulli incompresible",
 riskCodeT:"Conformidad normativa y selección del dispositivo",
 riskCode:"Ninguna parte de API 520/521 ni de ISO 4126 está implementada aquí. El Kd certificado, las correcciones por contrapresión, viscosidad y flujo bifásico, las designaciones normalizadas de orificio, el criterio de pérdida de carga de entrada y el criterio de contrapresión generada en la salida faltan todos. Un área de esta página no sostiene ninguna afirmación de conformidad y no equivale a una selección de dispositivo.",
 riskPropT:"Modelo de fluido",
 riskProp:"La rama de gas es un gas ideal con γ constante y un factor de compresibilidad dado por el usuario; la rama líquida es monofásica e incompresible. La vaporización súbita, el alivio bifásico, el vapor condensable y la corrección por líquido viscoso quedan fuera del modelo.",
 riskStateT:"Estado de alivio",
 riskState:"Presión aguas arriba, temperatura y contrapresión se toman como constantes dadas. La sobrepresión acumulada, la pérdida en la línea de entrada, la contrapresión generada por el colector y cualquier transitorio del escenario de alivio quedan a cargo del usuario.",
 mNote:"El coeficiente de descarga se introduce directamente y multiplica el flujo ideal. No sustituye a ningún Kd certificado y no lleva reducción.",
 axFlow:"Caudal másico objetivo",axArea:"Área de paso requerida",
 rArea:"Área de paso requerida",rBore:"Diámetro equivalente",rFlux:"Flujo másico ideal",
 rRhoUp:"Densidad aguas arriba",rRatio:"Relación de presiones p_b/p₁",rDp:"Presión diferencial",
 rP1:"Presión de alivio",rPb:"Contrapresión",rT:"Temperatura de alivio",
 rMdot:"Caudal másico requerido",rCd:"Coeficiente de descarga",rAreaCd:"Área ideal con Cd = 1",

function dgcLang(){try{return (window.Diagram&&Diagram.lang&&Diagram.lang())||'en';}catch(e){return 'en';}}
function dgcRt(k){var l=dgcLang();return (DGC_RT[l]&&DGC_RT[l][k])||DGC_RT.en[k]||k;}
var DGC_LOC={en:'en-GB',uk:'uk-UA',de:'de-DE',nl:'nl-BE',fr:'fr-BE',es:'es-ES',pl:'pl-PL'};
function dgcNum(v,d){if(!isFinite(v))return '—';
 try{return Number(v).toLocaleString(DGC_LOC[dgcLang()]||'en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});}
 catch(e){return Number(v).toFixed(d);}}

/* Verification computed live from the current state.
   Every item below is an algebraic identity of the tool's own two mass-flux
   relations, or a statement tying the plotted curve to the reported area.
   Nothing here touches code compliance: no API or ISO criterion is evaluated,
   and no tolerance in this file is a code-compliance tolerance. */
function dgcRvTerms(s){
  var gas=s.phase==='gas';
  var rc=Math.pow(2/(s.gamma+1),s.gamma/(s.gamma-1));
  var r=s.p1>0?Math.max(0,Math.min(1,s.pb/s.p1)):1;
  var rho1=(s.Z>0&&s.R>0&&s.T>0)?s.p1/(s.Z*s.R*s.T):NaN;
  return {gas:gas,rc:rc,r:r,rho1:rho1,dp:s.p1-s.pb};
}
/* Mass flux rebuilt as density times velocity at the throat. On the critical
   branch that is the sonic state; on the subcritical branch the isentropically
   expanded state at back pressure. For a liquid it is the velocity head. Each
   reduces to the expression the tool evaluates, by a different arithmetic path. */
function dgcRvThroatFlux(s){
  var t=dgcRvTerms(s);
  if(!t.gas){
    if(!(s.p1>s.pb&&s.rho>0))return {G:0,v:0,rho:s.rho};
    var vL=Math.sqrt(2*(s.p1-s.pb)/s.rho);
    return {G:s.rho*vL,v:vL,rho:s.rho};
  }
  if(!(s.p1>s.pb&&s.T>0&&s.Z>0))return {G:0,v:0,rho:t.rho1};
  var g=s.gamma;
  if(t.r<=t.rc){
    var rhoT=t.rho1*Math.pow(2/(g+1),1/(g-1));
    var aT=Math.sqrt(g*s.Z*s.R*s.T*2/(g+1));
    return {G:rhoT*aT,v:aT,rho:rhoT};
  }
  var rho2=t.rho1*Math.pow(t.r,1/g);
  var v2=Math.sqrt(2*g*s.Z*s.R*s.T/(g-1)*(1-Math.pow(t.r,(g-1)/g)));
  return {G:rho2*v2,v:v2,rho:rho2};
}
/* Returns one row per check: what was measured, what it was measured against,
   the difference and the verdict. A row without a criterion is recorded as a
   diagnostic and is excluded from the graded count. */
function dgcVerify(s){
  var out=[],r=solve(s),t=dgcRvTerms(s);
  var rel=function(a,b){return (isFinite(a)&&isFinite(b)&&b!==0)?Math.abs(a-b)/Math.abs(b):null;};

  // 1. The sizing form read backwards: Cd A G must return the required flow.
  var mBack=s.Cd*r.A*r.G, relS=rel(mBack,s.mdot);
  out.push({id:'sizing-form-closure',key:'ckSize',graded:true,
    got:mBack,ref:s.mdot,abs:Math.abs(mBack-s.mdot),rel:relS,tol:1e-12,unit:'kg/s',dp:9,
    pass:relS!=null&&relS<=1e-12,status:(relS!=null&&relS<=1e-12)?'pass':'fail'});

  // 2. The equivalent bore is a restatement of the area.
  var aBack=Math.PI*r.d*r.d/4, relD=rel(aBack,r.A);
  out.push({id:'equivalent-bore-closure',key:'ckDia',graded:true,
    got:aBack,ref:r.A,abs:Math.abs(aBack-r.A),rel:relD,tol:1e-12,unit:'m2',dp:12,
    pass:relD!=null&&relD<=1e-12,status:(relD!=null&&relD<=1e-12)?'pass':'fail'});

  // 3. Mass flux by the throat-state route.
  var th=dgcRvThroatFlux(s), relG=rel(th.G,r.G);
  out.push({id:'mass-flux-independent-route',key:'ckRoute',graded:true,
    got:th.G,ref:r.G,abs:Math.abs(th.G-r.G),rel:relG,tol:1e-12,unit:'kg/(m2 s)',dp:9,
    pass:relG!=null&&relG<=1e-12,status:(relG!=null&&relG<=1e-12)?'pass':'fail',
    extra:{route:t.gas?(t.r<=t.rc?'sonic-throat':'isentropic-expansion'):'bernoulli-head',
           throat_velocity:th.v,throat_density:th.rho}});

  // 4. The two gas branches meet at the transition ratio. Evaluated with this
  //    case's gas properties, whichever phase the case itself runs.
  var g=s.gamma;
  var Gc=s.p1*Math.sqrt(g/(s.Z*s.R*s.T))*Math.pow(2/(g+1),(g+1)/(2*(g-1)));
  var zc=Math.pow(t.rc,2/g)-Math.pow(t.rc,(g+1)/g);
  var Gs=s.p1*Math.sqrt(2*g/(s.Z*s.R*s.T*(g-1))*zc);
  var relC=rel(Gs,Gc);
  var atRc=gasOrifice(s.p1,s.T,t.rc*s.p1,1,1,s.gamma,s.R,s.Z);
  out.push({id:'critical-subcritical-branch-continuity',key:'ckCont',graded:true,
    got:Gs,ref:Gc,abs:Math.abs(Gs-Gc),rel:relC,tol:1e-12,unit:'kg/(m2 s)',dp:9,
    pass:relC!=null&&relC<=1e-12,status:(relC!=null&&relC<=1e-12)?'pass':'fail',
    extra:{r_transition:t.rc,branch_taken_at_transition:atRc.choked?'critical':'subcritical'}});

  // 5. Both gas branches carry Z only as 1/sqrt(Z).
  var Gz=gasOrifice(s.p1,s.T,s.pb,1,1,s.gamma,s.R,s.Z).G;
  var G1=gasOrifice(s.p1,s.T,s.pb,1,1,s.gamma,s.R,1).G;
  var scaled=Gz*Math.sqrt(s.Z), relZ=rel(scaled,G1);
  out.push({id:'compressibility-inverse-sqrt-z-scaling',key:'ckZ',graded:true,
    got:scaled,ref:G1,abs:Math.abs(scaled-G1),rel:relZ,tol:1e-12,unit:'kg/(m2 s)',dp:9,
    pass:relZ!=null&&relZ<=1e-12,status:(relZ!=null&&relZ<=1e-12)?'pass':'fail',
    extra:{Z:s.Z}});

  // 6. The plotted curve passes through the reported area at the target flow.
  var xs=(r.series&&r.series[0]&&r.series[0].x)||[];
  var ys=(r.series&&r.series[0]&&r.series[0].y)||[];
  var yTarget=ys.length>50?ys[50]:null;
  var relT=yTarget!=null?rel(yTarget/1e6,r.A):null;
  out.push({id:'plotted-area-at-target-flow',key:'ckTarget',graded:true,
    got:yTarget!=null?yTarget/1e6:null,ref:r.A,
    abs:yTarget!=null?Math.abs(yTarget/1e6-r.A):null,rel:relT,tol:1e-12,unit:'m2',dp:12,
    pass:relT!=null&&relT<=1e-12,status:(relT!=null&&relT<=1e-12)?'pass':'fail',
    extra:{sample:50,flow_at_sample:xs.length>50?xs[50]:null}});

  // 7. Area is proportional to flow: the samples lie on a line through zero.
  var k=(s.mdot>0&&isFinite(r.A))?r.A*1e6/s.mdot:NaN, dev=0, span=ys.length?ys[ys.length-1]:0;
  for(var i=0;i<ys.length;i++){
    var e=Math.abs(ys[i]-k*xs[i]); if(isFinite(e)&&e>dev)dev=e;
  }
  var relL=(span>0)?dev/span:null;
  out.push({id:'area-proportional-to-flow',key:'ckLin',graded:true,
    got:dev,ref:span,abs:dev,rel:relL,tol:1e-12,unit:'mm2',dp:9,
    pass:relL!=null&&relL<=1e-12,status:(relL!=null&&relL<=1e-12)?'pass':'fail',
    extra:{samples:ys.length,slope_mm2_per_kg_s:k}});

  // 8. Which branch governs. This reports the state of the solved case and
  //    carries no criterion.
  out.push({id:'governing-branch',key:'ckReg',graded:false,
    got:t.r,ref:t.rc,rel:null,unit:'-',dp:4,
    pass:true,status:'info',
    word:!t.gas?'rBrLiq':(r.choked?'rBrChoked':'rBrSub'),
    extra:{phase:s.phase,r:t.r,r_transition:t.rc,margin:t.rc>0?t.r/t.rc:null,dp:t.dp}});
  return out;
}

/* The report is a separate document without the tool's stylesheet, so the
   figure is drawn into its own canvas at print resolution rather than scraped
   off the screen. Without this the engine falls back to the on-screen stage,
   which carries no caption, no axis title and no unit. */
function dgcFigureCanvas(w,h,scale){
  var c=document.createElement('canvas');
  c.width=Math.round(w*scale); c.height=Math.round(h*scale);
  var ctx=c.getContext('2d'); ctx.scale(scale,scale);
  return {canvas:c,ctx:ctx};
}
/* One series: required flow area against target mass flow. The x axis of this
   tool is a mass flow, so it is labelled as one. */
function dgcPlotSpec(){
  if(!last||!last.series||!last.series.length)return null;
  var s0=last.series[0];
  if(!s0||!s0.x||!s0.x.length)return null;
  return {x:{label:dgcRt('axFlow'),unit:'kg/s'},
    series:[{x:s0.x,y:s0.y,label:dgcRt('axArea'),unit:'mm²',color:'#1f6feb'}]};
}
function dgcReportFigure(ctx){
  var spec=dgcPlotSpec(); if(!spec)return null;
  var f=dgcFigureCanvas(720,300,2);
  dgcPlot(f.ctx,720,300,spec,{css:{bg:'#ffffff',muted:'#5a6570',line:'#c9d0d8',text:'#17202a',
    font:'-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif'},fontScale:1});
  return ctx.figure(f.canvas,{caption:dgcRt('figCap'),alt:dgcRt('figCap')});
}
function dgcReportProfile(rec,ctx){
  if(!rec||!last)return null;
  var i=rec.inputs||{}, o=rec.outputs||{}, u=rec.units||{};
  var row=function(label,value,unit,note){return {label:label,value:value,unit:unit||'',note:note||''};};
  var n=dgcNum, ex=function(v,d){return (v==null||!isFinite(v))?'—':Number(v).toExponential(d);};
  var t=dgcRvTerms(i), th=dgcRvThroatFlux(i);
  var gas=t.gas;
  var branchKey=!gas?'rBrLiq':(last.choked?'rBrChoked':'rBrSub');
  var phaseKey=gas?'rPhaseGas':'rPhaseLiq';
  var slope=i.mdot>0?o.A_required*1e6/i.mdot:NaN;

  var summary=dgcRt('summary')
    .replace('{m}',n(i.mdot,3)).replace('{p1}',n(i.p1/1e5,3)).replace('{pb}',n(i.pb/1e5,3))
    .replace('{phase}',dgcRt(phaseKey))
    .replace('{A}',n(o.A_required*1e6,1)).replace('{Cd}',n(i.Cd,2))
    .replace('{d}',n(o.D_equiv*1000,2))
    .replace('{branch}',dgcRt(branchKey)).replace('{G}',n(o.mass_flux_ideal,1));

  /* Values are shown in the units an engineer reads them in. The record keeps SI. */
  var tiles=[
    row(dgcRt('rArea'),n(o.A_required*1e6,1),'mm²'),
    row(dgcRt('rBore'),n(o.D_equiv*1000,2),'mm'),
    row(dgcRt('rFlux'),n(o.mass_flux_ideal,1),'kg/(m²·s)'),
    row(dgcRt('rRhoUp'),n(o.rho_upstream,3),'kg/m³'),
    row(dgcRt('rRatio'),n(t.r,4),'-'),
    row(dgcRt('rDp'),n(t.dp/1e5,3),'bar')
  ];
  var results=tiles.concat([
    row(dgcRt('rP1'),n(i.p1/1e5,3),'bar'),
    row(dgcRt('rPb'),n(i.pb/1e5,3),'bar'),
    row(dgcRt('rMdot'),n(i.mdot,3),'kg/s'),
    row(dgcRt('rT'),n(i.T-273.15,1),'°C',n(i.T,2)+' K'),
    row(dgcRt('rCd'),n(i.Cd,3),'-'),
    row(dgcRt('rAreaCd'),n(o.A_required*i.Cd*1e6,1),'mm²'),
    row(dgcRt('rRc'),n(t.rc,4),'-',
        t.rc>0?n(t.r/t.rc,3)+' '+dgcRt('rOfTrans'):''),
    row(dgcRt('rVel'),n(th.v,1),'m/s'),
    row(dgcRt('rSlope'),n(slope,1),'mm²/(kg/s)'),
    row(dgcRt('rPhaseLabel'),dgcRt(phaseKey),'',dgcRt(branchKey))
  ]);

  var v=dgcVerify(state);
  var checks=v.map(function(c){
    var st=c.status||(c.pass?'pass':'fail');
    var actual='—',criterion='≤ 1·10⁻¹²',note='';
    if(c.key==='ckSize'){
      actual='|Δṁ| / ṁ = '+ex(c.rel,2);
      note=n(c.got,6)+' kg/s · '+n(c.ref,6)+' kg/s';
    } else if(c.key==='ckDia'){
      actual='|ΔA| / A = '+ex(c.rel,2);
      note='π d²/4 = '+n(c.got*1e6,4)+' mm²';
    } else if(c.key==='ckRoute'){
      actual='|ΔG| / G = '+ex(c.rel,2);
      note=c.extra.route+' · ρ '+n(c.extra.throat_density,4)+' kg/m³ · v '+n(c.extra.throat_velocity,2)+' m/s';
    } else if(c.key==='ckCont'){
      actual='|ΔG| / G = '+ex(c.rel,2);
      criterion='≤ 1·10⁻¹², r = '+n(c.extra.r_transition,6);
      note=n(c.got,4)+' kg/(m²·s) · '+n(c.ref,4)+' kg/(m²·s)';
    } else if(c.key==='ckZ'){
      actual='|ΔG| / G = '+ex(c.rel,2);
      criterion='≤ 1·10⁻¹², Z = '+n(c.extra.Z,3);
    } else if(c.key==='ckTarget'){
      actual='|ΔA| / A = '+ex(c.rel,2);
      note=n(c.extra.flow_at_sample,4)+' kg/s → '+n(c.got*1e6,4)+' mm²';
    } else if(c.key==='ckLin'){
      actual='max |ΔA| / A(120 %) = '+ex(c.rel,2);
      criterion='≤ 1·10⁻¹², '+c.extra.samples+' ×';
      note=n(c.extra.slope_mm2_per_kg_s,3)+' mm²/(kg/s)';
    } else {
      actual=dgcRt(c.word);
      if(c.extra.phase==='liquid'){
        criterion='Δp = '+n(c.extra.dp/1e5,3)+' bar';
        note='p_b/p₁ = '+n(c.extra.r,4);
      } else {
        criterion='r_c = '+n(c.ref,4);

  });
  (rec.warnings||[]).forEach(function(w){checks.push({status:'attention',title:dgcRt('ckReg'),detail:w});});

  var decisions=[
    row(dgcRt('dPhase'),dgcRt(phaseKey),'',dgcRt('dPhaseWhy')),

  ];

  var inputs=[
    {label:ctx.label('phase',u.phase),value:dgcRt(phaseKey),unit:'',group:gSvc},

  return {

/* Rebuilds the published benchmark record from this page. Open the tool and

function dgcBenchmark(scenarios){
  var list=scenarios||DGC_BENCH_CASES, cases=[], total=0, passed=0, flagged=0;
  list.forEach(function(sc){
    var v=dgcVerify(sc.s);
    var cmp=v.map(function(c){
      if(c.graded){total++; if(c.pass)passed++;}
      else if(c.status==='attention')flagged++;
      return {check:c.id,
        got:(c.got===undefined?null:c.got),
        ref:(c.ref===undefined?null:c.ref),
        abs:(c.abs===undefined?null:c.abs),
        rel:(c.rel===undefined?null:c.rel),
        tol:(c.tol===undefined?null:c.tol),
        unit:c.unit,extra:c.extra||null,
        graded:!!c.graded,
        status:c.status||(c.pass?'pass':'fail'),ok:c.graded?!!c.pass:null};
    });
    cases.push({id:sc.id,note:sc.note,inputs:sc.s,cmp:cmp,
      pass:cmp.every(function(x){return !x.graded||x.ok;})});
  });
  var rev='';
  try{rev=JSON.parse(document.getElementById('diagram-tool-manifest').textContent).manifest_revision;}catch(e){}
  var worst=0;
  cases.forEach(function(c){c.cmp.forEach(function(x){
    if(x.graded&&x.rel!=null&&isFinite(x.rel)&&x.rel>worst)worst=x.rel;});});
  var ex=function(x,n){return (x==null||!isFinite(x))?'—':Number(x).toExponential(n);};
  return {
    schema:'tools.petrov.re/benchmark/v1',
    tool:'relief-valve-sizing',file:'relief_valve_sizing.html',manifest_revision:rev,
    reference:'Algebraic identities of the tool\'s own two mass-flux relations, recomputed in the page: the sizing form A = mdot/(Cd G) read backwards, the equivalent-bore restatement, the mass flux rebuilt as density times velocity at the throat, the critical/subcritical branch continuity at the transition pressure ratio, the 1/sqrt(Z) compressibility scaling, and the plotted curve against the reported area. Every figure recorded here is recomputed in the page.',
    reference_citations:[
      'Orifice and sizing relations as implemented in relief_valve_sizing.html and listed in its record model.equations.',
      'The throat-state route rebuilds the same flux from the sonic state on the critical branch and from the isentropically expanded state on the subcritical branch, so it reaches the tool\'s expression along a different arithmetic path.'],
    reference_provenance:'recomputed in page',
    tolerance:'Algebraic cross-check, branch continuity, compressibility scaling and figure-to-result agreement to floating-point precision, taken as 1e-12 relative. No code-compliance tolerance is claimed. Largest relative residual observed across all graded checks: '+ex(worst,3)+'.',
    scope:'This artifact records the internal consistency of one physical relation. It makes no statement about API 520/521 or ISO 4126 compliance, and an area produced by this tool is not a certified effective orifice area and is not a valve selection.',
    run_at:new Date().toISOString().replace(/\.\d+Z$/,'Z'),
    total:total,passed:passed,failed:total-passed,flagged:flagged,page_errors:[],
    grading:'total counts checks with an acceptance criterion. The governing branch reports the state of the solved case and carries no criterion, so it is recorded with its status and excluded from the count.',
    cases:cases,
    not_benchmarked:[
      'Certified Kd and the API 520/521 and ISO 4126 correction factors for back pressure, viscosity and two-phase flow.',
      'Standard orifice letter designations and the selection of a catalogue device.',
      'Installation criteria: inlet pressure drop and outlet built-up back pressure.',
      'Certified valve performance, blowdown, chatter and reseat behaviour.',
      'Two-phase and flashing relief, condensable vapour and real-gas property variation across the expansion.',
      'Browser/Python parity, which needs a Python runtime and is not re-run in the page.'],
    notes:[
      'Each case runs the shipped solver and the independent routes inside the page. Inputs, measured value, reference value and tolerance are recorded per check, so any verdict can be reproduced by calling window.__dgcBenchmark() on the tool.',
      'Branch continuity and the 1/sqrt(Z) scaling are properties of the gas relations alone, so they are evaluated with each case\'s gas properties including the liquid case, where the liquid branch is the one that sets the reported area.']
  };
}

function gasOrifice(pu,Tu,pd,Cd,A,gamma,R,Z){
 if(!(pu>pd&&Tu>0&&A>0&&Cd>0&&Z>0))return {mdot:0,choked:false,G:0,r:pd/Math.max(pu,1)};
 var r=Math.max(0,Math.min(1,pd/pu));
 var rc=Math.pow(2/(gamma+1),gamma/(gamma-1));
 var G;
 if(r<=rc){G=pu*Math.sqrt(gamma/(Z*R*Tu))*Math.pow(2/(gamma+1),(gamma+1)/(2*(gamma-1)));return {mdot:Cd*A*G,choked:true,G:G,r:r};}
 var z=Math.max(0,Math.pow(r,2/gamma)-Math.pow(r,(gamma+1)/gamma));
 G=pu*Math.sqrt(2*gamma/(Z*R*Tu*(gamma-1))*z);return {mdot:Cd*A*G,choked:false,G:G,r:r};
}

function solve(s){var gas=s.phase==='gas',G,choked=false;if(gas){var q=gasOrifice(s.p1,s.T,s.pb,1,1,s.gamma,s.R,s.Z);G=q.G;choked=q.choked;}else G=s.p1>s.pb?Math.sqrt(2*s.rho*(s.p1-s.pb)):0;var A=(s.Cd>0&&G>0)?s.mdot/(s.Cd*G):Infinity,d=Math.sqrt(4*A/Math.PI),rho=gas?s.p1/(s.Z*s.R*s.T):s.rho,x=[],y=[];for(var i=0;i<=60;i++){var m=s.mdot*1.2*i/60;x.push(m);y.push((s.Cd>0&&G>0)?1e6*m/(s.Cd*G):NaN);}return {A:A,d:d,G:G,choked:choked,rho:rho,mdot:s.mdot,p:s.p1,T:s.T,series:[{x:x,y:y}],a11y:'Required relief area versus mass flow.',warnings:(s.p1<=s.pb?['Relieving upstream pressure must exceed back pressure.']:[]),notes:[gas?(choked?'Ideal-gas flow is choked at the specified back pressure.':'Ideal-gas flow is subcritical at the specified back pressure.'):'Liquid sizing uses incompressible Bernoulli only.']};}

/* ---- handoff receiver bound (AGENTS.md 2.4; _docs/TZ-engineering-workflow.md 5.1)
   -----------------------------------------------------------------------------
   An incoming SI quantity is held to the bound this tool's own typed field
   declares, read from that field, so the keyboard and the wire carry one number.
   Where the field declares none, the bound is the one this tool's own model
   states and the limitations carry it. Outside the bound the state does not
   change and the user is told the quantity, the figure that arrived and the
   bound; the refused name goes into neither `accepted` nor `ignored`, because
   this tool does use that quantity (AGENTS 2.4).
   No magnitude band is used to tell one medium from another: gasline-packing at

 rangeLo:T("{q} = {v} {u} received from {f} is below the minimum this tool accepts ({lo} {u}) and was not applied.","{q} = {v} {u}, отримане від {f}, менше за мінімум, який приймає цей інструмент ({lo} {u}), і не застосоване.","{q} = {v} {u} von {f} liegt unter dem Mindestwert, den dieses Werkzeug annimmt ({lo} {u}), und wurde nicht übernommen.","{q} = {v} {u} ontvangen van {f} ligt onder het minimum dat deze tool aanvaardt ({lo} {u}) en is niet toegepast.","{q} = {v} {u} reçu de {f} est inférieur au minimum accepté par cet outil ({lo} {u}) et n'a pas été appliqué.","{q} = {v} {u} recibido de {f} queda por debajo del mínimo que acepta esta herramienta ({lo} {u}) y no se ha aplicado.","{q} = {v} {u} otrzymane od {f} jest mniejsze od minimum przyjmowanego przez to narzędzie ({lo} {u}) i nie zostało zastosowane."),

function hoRanges(){
 /* Each bound is the min/max this tool's own field declares. The rho field is
    the 'Liquid density' of the incompressible branch. */
 return {T:{lo:100,hi:2500,u:'K'},        /* field 'f-T'    min 100   max 2500  */
  p:{lo:1000,hi:2e8,u:'Pa'},              /* field 'f-p1'   min 1000  max 2e8   */
  mdot:{lo:1e-6,hi:1e6,u:'kg/s'},         /* field 'f-mdot' min 1e-6  max 1e6   */
  rho:{lo:1,hi:20000,u:'kg/m³'}};}          /* field 'f-rho'  min 1     max 20000 */
function hoNum(v){if(v==null||typeof v!=='number'||!isFinite(v))return '—';if(v===0)return '0';var a=Math.abs(v);
 if(a!==0&&(a<0.01||a>=1e6)){var e=Math.floor(Math.log10(a));return dgcNum(v/Math.pow(10,e),2)+'e'+(e<0?'':'+')+e;}
 return dgcNum(v,a>=100?1:(a>=1?2:4));}
function hoTxt(k){var m=HO_TXT[k];return m[dgcLang()]||m.en;}
/* A quantity refused for range is not a quantity this tool does not use: the
   sentence above names it, its range and the figure received, so it is kept out
   of the `ignored` list the runtime prints as "this tool does not use them"
   (AGENTS 2.4). HO_REF holds the refused names of the payload being applied. */
var HO_REF=[];
/* A bound has whichever ends the receiving field declares: two, one or none.
   `pos` marks a quantity this tool's own validation requires strictly positive. */
function hoOut(v,r){if(!r||typeof v!=='number'||!isFinite(v))return true;
 if(r.pos&&!(v>0))return true;
 if(r.lo!=null&&v<r.lo)return true;
 if(r.hi!=null&&v>r.hi)return true;
 return false;}
function hoRefuse(k,v,r,from){
 HO_REF.push(k);
 /* The sentence follows the bound: a receiver whose own field declares only a
    minimum states only that minimum, and a quantity held to no declared bound at
    all is refused as a physically impossible value (AGENTS 2.4). */
 /* A non-positive value of a strictly positive quantity is impossible whatever
    other end the bound has; the range sentences are for a value that is possible
    and out of bounds. */
 var hoKey=(function(r,v){if(r&&r.pos&&!(v>0))return 'impossible';
  var lo=r&&r.lo!=null&&isFinite(r.lo),hi=r&&r.hi!=null&&isFinite(r.hi);
  return lo&&hi?'range':(lo?'rangeLo':(hi?'rangeHi':'impossible'));})(r,v);
 var s=hoTxt(hoKey).split('{q}').join(k).split('{v}').join(hoNum(v))
  .split('{lo}').join(hoNum(r?r.lo:NaN)).split('{hi}').join(hoNum(r?r.hi:NaN))
  .split('{u}').join(r?r.u:'').split('{f}').join(from);
 try{if(window.Diagram&&Diagram.notify)Diagram.notify(s,'warn');}catch(e){}}
function hoApply(p){
 var q=(p&&p.quantities)||{},from=(p&&p.from&&p.from.tool)||'?',R=hoRanges(),acc=[],ign=[];

 function take(k,set){var o=q[k];if(!o)return;var v=Number(o.value),r=R[k];
  if(hoOut(v,r)){hoRefuse(k,v,r,from);return;}
  set(v);acc.push(k);}
 take('T',function(v){state.T=v;});
 take('p',function(v){state.p1=v;});
 take('rho',function(v){state.rho=v;});
 take('mdot',function(v){state.mdot=v;});
 var ord=Object.keys(q);
 ord.forEach(function(k){if(acc.indexOf(k)<0&&ign.indexOf(k)<0&&HO_REF.indexOf(k)<0)ign.push(k);});
 acc.sort(function(a,b){return ord.indexOf(a)-ord.indexOf(b);});
 last=solve(state);if(ui){ui.sync();ui.run();}
 return {accepted:acc,ignored:ign};}

 python:function(){return {code:"\ndef gas_orifice(pu, Tu, pd, Cd, A, gamma, R, Z):\n    if not (pu > pd and Tu > 0 and A > 0 and Cd > 0 and Z > 0):\n        return 0.0, False, 0.0\n    r=max(0.0,min(1.0,pd/pu)); rc=(2/(gamma+1))**(gamma/(gamma-1))\n    if r <= rc:\n        G=pu*math.sqrt(gamma/(Z*R*Tu))*(2/(gamma+1))**((gamma+1)/(2*(gamma-1)))\n        return Cd*A*G, True, G\n    z=max(0.0,r**(2/gamma)-r**((gamma+1)/gamma))\n    G=pu*math.sqrt(2*gamma/(Z*R*Tu*(gamma-1))*z)\n    return Cd*A*G, False, G\n\ndef compute():\n    phase=INPUTS['phase']; mdot=INPUTS['mdot']; p1=INPUTS['p1']; pb=INPUTS['pb']; T=INPUTS['T']; Cd=INPUTS['Cd']; gamma=INPUTS['gamma']; R=INPUTS['R']; Z=INPUTS['Z']; rhoL=INPUTS['rho']\n    if phase=='gas':\n        _,_,G=gas_orifice(p1,T,pb,1.0,1.0,gamma,R,Z); rho=p1/(Z*R*T)\n    else:\n        G=math.sqrt(2*rhoL*(p1-pb)) if p1>pb else 0.0; rho=rhoL\n    A=mdot/(Cd*G) if Cd>0 and G>0 else float('inf'); d=math.sqrt(4*A/math.pi)\n    return {'A_required':A,'D_equiv':d,'mass_flux_ideal':G,'rho_upstream':rho}\n",requires:[],basis:{kind:'reproduce',note:'Standard-library port of the same equations used by the browser tool.'},selftest:{tolerance:1e-12,note:'Browser and Python evaluate the same closed-form expressions in the same branch; tolerance allows only floating-point pow/sqrt roundoff.'}};},
