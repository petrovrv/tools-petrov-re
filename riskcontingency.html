    nShare: T('Share of cost variance = Cov(part, total) / Var(total) for the parts that add up to the total cost: cost lines, direct risk costs and the time-related cost (activities and risk delays act through it, so their own share shows “—”). The shares add up to 100 % also with correlated lines. Duration is a maximum of paths, not a sum, so its last column only ranks the inputs.', 'Частка дисперсії вартості = Cov(складова, сума) / Var(сума) для складових, що дають загальну вартість: статті витрат, прямі витрати ризиків і витрати від часу (роботи й затримки ризиків діють через них, тому їхня власна частка — «—»). Частки дають разом 100 % і за корельованих статей. Тривалість — максимум шляхів, а не сума, тому її остання колонка лише ранжує вхідні величини.', 'Anteil an der Kostenvarianz = Cov(Teil, Summe) / Var(Summe) für die Teile, die die Gesamtkosten ergeben: Kostenpositionen, direkte Risikokosten und zeitabhängige Kosten (Vorgänge und Risikoverzüge wirken über diese, daher steht bei ihnen „—“). Die Anteile ergeben auch bei korrelierten Positionen 100 %. Die Dauer ist ein Maximum von Pfaden, keine Summe; ihre letzte Spalte ordnet die Eingaben nur.', 'Aandeel in de kostvariantie = Cov(deel, totaal) / Var(totaal) voor de delen die samen de totale kost vormen: kostenposten, directe risicokosten en de tijdgebonden kosten (activiteiten en risicovertragingen werken via die laatste, daarom staat bij hen “—”). De aandelen tellen ook bij gecorreleerde posten op tot 100 %. De duur is een maximum van paden, geen som; de laatste kolom rangschikt daar alleen.', 'Part de la variance du coût = Cov(composante, total) / Var(total) pour les composantes qui forment le coût total : postes, coûts directs des risques et coûts liés au temps (les activités et les retards des risques agissent à travers eux, d’où « — » pour leur part propre). Les parts font 100 % même avec des postes corrélés. La durée est un maximum de chemins, pas une somme : sa dernière colonne ne fait que classer les entrées.', 'Cuota de la varianza del coste = Cov(parte, total) / Var(total) para las partes que suman el coste total: partidas, costes directos de los riesgos y costes del plazo (las actividades y los retrasos de los riesgos actúan a través de estos, por eso su cuota propia es «—»). Las cuotas suman el 100 % también con partidas correlacionadas. La duración es un máximo de caminos, no una suma: su última columna solo ordena los datos.', 'Udział w wariancji kosztu = Cov(część, suma) / Var(suma) dla części składających się na koszt całkowity: pozycji kosztów, bezpośrednich kosztów ryzyk i kosztów czasu (czynności i opóźnienia ryzyk działają przez te ostatnie, stąd „—” przy ich własnym udziale). Udziały dają razem 100 % także przy skorelowanych pozycjach. Czas to maksimum ścieżek, a nie suma, więc jego ostatnia kolumna tylko porządkuje dane.'),

    nAur: T('Delay fines per AUR art. 86 (KB 14.01.2013, ejustice text read 15.11.2026): R = 0.45·M·n²/N² with M = {M}, N = {N} working days (0.7 × {D} days, §3), total capped at {cap} (§6); totals under 75 € are neglected.', 'Штрафи за затримку за AUR ст. 86 (KB 14.01.2013, текст ejustice прочитано 15.11.2026): R = 0,45·M·n²/N², M = {M}, N = {N} робочих днів (0,7 × {D} дн, §3), сума не більше {cap} (§6); суми до 75 € не враховуються.', 'Verzugsstrafen nach AUR Art. 86 (KB 14.01.2013, Text auf ejustice gelesen am 15.11.2026): R = 0,45·M·n²/N² mit M = {M}, N = {N} Arbeitstage (0,7 × {D} Tage, §3), Summe höchstens {cap} (§6); Summen unter 75 € entfallen.', 'Vertragingsboetes volgens AUR art. 86 (KB 14.01.2013, tekst op ejustice gelezen op 15.11.2026): R = 0,45·M·n²/N² met M = {M}, N = {N} werkdagen (0,7 × {D} dagen, §3), totaal begrensd op {cap} (§6); totalen onder 75 € vervallen.', 'Amendes pour retard selon les RGE art. 86 (AR 14.01.2013, texte ejustice lu le 15.11.2026) : R = 0,45·M·n²/N² avec M = {M}, N = {N} jours ouvrables (0,7 × {D} jours, §3), total plafonné à {cap} (§6) ; les totaux inférieurs à 75 € sont négligés.', 'Penalizaciones por demora según el AUR art. 86 (KB 14.01.2013, texto de ejustice leído el 15.11.2026): R = 0,45·M·n²/N² con M = {M}, N = {N} días hábiles (0,7 × {D} días, §3), total limitado a {cap} (§6); los totales inferiores a 75 € se desprecian.', 'Kary za zwłokę wg AUR art. 86 (KB 14.01.2013, tekst z ejustice odczytany 15.11.2026): R = 0,45·M·n²/N², M = {M}, N = {N} dni roboczych (0,7 × {D} dni, §3), suma ograniczona do {cap} (§6); sumy poniżej 75 € pomija się.'),

    /* notes */
    nBaseOpt: T('The base estimate (sum of the most likely values) lies below the median: three-point ranges of real estimates are skewed to the right, so “most likely” added up is an optimistic number, not a P50.', 'Базовий кошторис (сума найімовірніших значень) нижчий за медіану: діапазони реальних кошторисів скошені вправо, тож сума «найімовірніших» — оптимістичне число, а не P50.', 'Die Basisschätzung (Summe der wahrscheinlichsten Werte) liegt unter dem Median: Dreipunktbereiche echter Schätzungen sind rechtsschief, die Summe der „wahrscheinlichsten“ ist eine optimistische Zahl, kein P50.', 'De basisraming (som van de meest waarschijnlijke waarden) ligt onder de mediaan: driepuntsbereiken van echte ramingen zijn rechtsscheef, dus de som van “meest waarschijnlijk” is optimistisch, geen P50.', 'L’estimation de base (somme des valeurs les plus probables) est sous la médiane : les fourchettes réelles sont asymétriques à droite, la somme des « plus probables » est optimiste, ce n’est pas un P50.', 'La estimación base (suma de los valores más probables) queda por debajo de la mediana: los rangos reales son asimétricos a la derecha, así que la suma de los «más probables» es optimista, no un P50.', 'Kosztorys bazowy (suma wartości najbardziej prawdopodobnych) leży poniżej mediany: zakresy rzeczywistych kosztorysów są prawoskośne, więc suma „najbardziej prawdopodobnych” jest optymistyczna, to nie P50.'),
    nEmv: T('Adding the expected values (EMV = p × mean impact) of the risk register to the base does not reach the chosen confidence: EMV is an average, while contingency has to cover the spread.', 'Додавання очікуваних значень (EMV = p × середній вплив) реєстру ризиків до бази не досягає обраного рівня довіри: EMV — це середнє, а резерв має покривати розкид.', 'Die Erwartungswerte (EMV = p × mittlere Auswirkung) des Risikoregisters zur Basis addiert erreichen das gewählte Konfidenzniveau nicht: EMV ist ein Mittelwert, die Reserve muss die Streuung abdecken.', 'De verwachte waarden (EMV = p × gemiddelde impact) van het risicoregister bij de basis optellen haalt de gekozen betrouwbaarheid niet: EMV is een gemiddelde, de post onvoorzien moet de spreiding dekken.', 'Ajouter à la base les valeurs attendues (EMV = p × impact moyen) du registre n’atteint pas la confiance choisie : l’EMV est une moyenne, la provision doit couvrir la dispersion.', 'Sumar a la base los valores esperados (EMV = p × impacto medio) del registro no alcanza la confianza elegida: el EMV es una media y la contingencia debe cubrir la dispersión.', 'Dodanie do bazy wartości oczekiwanych (EMV = p × średni wpływ) z rejestru nie daje wybranej ufności: EMV to średnia, a rezerwa ma pokryć rozrzut.'),
    nJoint: T('Cost and duration at the same confidence do not hold together as often: the joint confidence (both met) is lower. Owners who need both often set the joint confidence level (JCL) instead.', 'Вартість і тривалість з однаковим рівнем довіри разом виконуються рідше: спільна довіра (обидва виконано) нижча. Замовники, яким потрібні обидва, часто задають спільний рівень довіри (JCL).', 'Kosten und Dauer auf gleichem Konfidenzniveau halten seltener gemeinsam: die gemeinsame Konfidenz (beides eingehalten) ist niedriger. Bauherren, die beides brauchen, setzen oft ein gemeinsames Konfidenzniveau (JCL).', 'Kost en duur op dezelfde betrouwbaarheid worden minder vaak samen gehaald: de gezamenlijke betrouwbaarheid (beide gehaald) is lager. Opdrachtgevers die beide nodig hebben, leggen vaak een gezamenlijk betrouwbaarheidsniveau (JCL) vast.', 'Coût et durée au même niveau de confiance sont moins souvent tenus ensemble : la confiance conjointe (les deux tenus) est plus basse. Les maîtres d’ouvrage qui ont besoin des deux fixent souvent un niveau de confiance conjoint (JCL).', 'Coste y plazo al mismo nivel de confianza se cumplen juntos con menos frecuencia: la confianza conjunta (ambos) es menor. Los promotores que necesitan ambos suelen fijar un nivel de confianza conjunto (JCL).', 'Koszt i czas na tym samym poziomie ufności rzadziej są dotrzymane razem: ufność łączna (oba) jest niższa. Inwestorzy, którym potrzebne są oba, często ustalają łączny poziom ufności (JCL).'),
    nMerge: T('Merge bias: several parallel paths are each critical in part of the runs. Where they join, the later one sets the date, so the deterministic plan is optimistic even when every activity is estimated fairly.', 'Ефект злиття: кілька паралельних шляхів почергово стають критичними. У точці злиття дату визначає пізніший, тож детермінований план оптимістичний, навіть якщо кожна робота оцінена чесно.', 'Zusammenführungseffekt (merge bias): mehrere parallele Pfade sind je in einem Teil der Läufe kritisch. Wo sie zusammenlaufen, bestimmt der spätere den Termin; der deterministische Plan ist optimistisch, auch wenn jeder Vorgang fair geschätzt ist.', 'Samenloopeffect (merge bias): meerdere parallelle paden zijn elk in een deel van de runs kritiek. Waar ze samenkomen, bepaalt de laatste de datum, dus de deterministische planning is optimistisch, ook als elke activiteit eerlijk geraamd is.', 'Biais de convergence : plusieurs chemins parallèles sont chacun critiques dans une partie des tirages. À leur jonction, le plus tardif fixe la date ; le planning déterministe est optimiste même si chaque activité est estimée honnêtement.', 'Sesgo de convergencia: varios caminos paralelos son críticos en parte de las iteraciones. Donde se unen, el más tardío fija la fecha, así que el plan determinista es optimista aunque cada actividad esté bien estimada.', 'Efekt scalania (merge bias): kilka ścieżek równoległych bywa krytycznych w części przebiegów. W punkcie połączenia datę wyznacza późniejsza, więc plan deterministyczny jest optymistyczny, nawet gdy każda czynność oszacowana uczciwie.'),
    nCorrAdj: T('The correlation could not be reached exactly with these inputs; it was reduced until the matrix was valid.', 'Кореляцію з такими даними неможливо досягти точно; її зменшено, доки матриця не стала допустимою.', 'Die Korrelation war mit diesen Eingaben nicht genau erreichbar; sie wurde verringert, bis die Matrix gültig war.', 'De correlatie kon met deze invoer niet exact bereikt worden; ze is verlaagd tot de matrix geldig was.', 'La corrélation ne pouvait pas être atteinte exactement avec ces données ; elle a été réduite jusqu’à une matrice valide.', 'La correlación no podía alcanzarse exactamente con estos datos; se redujo hasta que la matriz fue válida.', 'Korelacji nie dało się dokładnie osiągnąć przy tych danych; zmniejszono ją do uzyskania poprawnej macierzy.'),
    nRiskPath: T('A risk names a path that has no activity; its delay is added at the project end.', 'Ризик вказує шлях без робіт; його затримку додано в кінці проєкту.', 'Ein Risiko nennt einen Pfad ohne Vorgang; sein Verzug wird am Projektende addiert.', 'Een risico noemt een pad zonder activiteit; de vertraging wordt aan het einde van het project opgeteld.', 'Un risque désigne un chemin sans activité ; son retard est ajouté en fin de projet.', 'Un riesgo indica un camino sin actividades; su retraso se suma al final del proyecto.', 'Ryzyko wskazuje ścieżkę bez czynności; jego opóźnienie dodano na końcu projektu.'),
    nMethod: T('Method: Monte Carlo of the cost lines, activities and risk events with Iman–Conover rank correlation; integrated cost and schedule (time-dependent cost and delay damages follow the simulated duration), after the structure of AACE RP 41R-08 and 57R-09 and IEC 31010 (Monte Carlo simulation).', 'Метод: Монте-Карло статей витрат, робіт і ризикових подій з ранговою кореляцією Імана–Коновера; інтегровані вартість і графік (вартість часу та штрафи йдуть за змодельованою тривалістю) за структурою AACE RP 41R-08 і 57R-09 та IEC 31010 (моделювання Монте-Карло).', 'Methode: Monte-Carlo der Kostenpositionen, Vorgänge und Risikoereignisse mit Rangkorrelation nach Iman–Conover; integrierte Kosten- und Terminanalyse (zeitabhängige Kosten und Verzugsstrafen folgen der simulierten Dauer), nach der Struktur von AACE RP 41R-08 und 57R-09 sowie IEC 31010 (Monte-Carlo-Simulation).', 'Methode: Monte Carlo van de kostenposten, activiteiten en risicogebeurtenissen met rangcorrelatie volgens Iman–Conover; geïntegreerde kost en planning (tijdgebonden kosten en boetes volgen de gesimuleerde duur), naar de structuur van AACE RP 41R-08 en 57R-09 en IEC 31010 (Monte-Carlosimulatie).', 'Méthode : Monte-Carlo des postes, activités et événements à risque avec corrélation de rang d’Iman–Conover ; coût et délai intégrés (coûts liés au temps et pénalités suivent la durée simulée), selon la structure des AACE RP 41R-08 et 57R-09 et de l’IEC 31010 (simulation de Monte-Carlo).', 'Método: Monte Carlo de partidas, actividades y eventos de riesgo con correlación de rangos de Iman–Conover; coste y plazo integrados (costes dependientes del plazo y penalizaciones siguen la duración simulada), según la estructura de AACE RP 41R-08 y 57R-09 e IEC 31010 (simulación de Monte Carlo).', 'Metoda: Monte Carlo pozycji kosztów, czynności i zdarzeń ryzyka z korelacją rang Imana–Conovera; zintegrowany koszt i harmonogram (koszty czasowe i kary podążają za symulowanym czasem), wg struktury AACE RP 41R-08 i 57R-09 oraz IEC 31010 (symulacja Monte Carlo).'),
    nAssume: T('Ranges, probabilities, correlations and the confidence level are your judgement or company policy (learning assumptions); the result is only as good as the ranges entered. Optimistic ranges give optimistic contingency.', 'Діапазони, імовірності, кореляції та рівень довіри — ваше судження чи політика компанії (навчальні припущення); результат не кращий за введені діапазони. Оптимістичні діапазони дають оптимістичний резерв.', 'Bereiche, Wahrscheinlichkeiten, Korrelationen und das Konfidenzniveau sind Ihre Einschätzung oder Firmenpolitik (Lernannahmen); das Ergebnis ist nur so gut wie die eingegebenen Bereiche. Optimistische Bereiche ergeben optimistische Reserven.', 'Bereiken, kansen, correlaties en het betrouwbaarheidsniveau zijn uw inschatting of bedrijfsbeleid (leeraannames); het resultaat is maar zo goed als de ingevoerde bereiken. Optimistische bereiken geven een optimistische post onvoorzien.', 'Fourchettes, probabilités, corrélations et niveau de confiance relèvent de votre jugement ou de la politique interne (hypothèses pédagogiques) ; le résultat ne vaut que ce que valent les fourchettes. Des fourchettes optimistes donnent une provision optimiste.', 'Rangos, probabilidades, correlaciones y nivel de confianza son su criterio o política de empresa (supuestos didácticos); el resultado vale lo que valen los rangos. Rangos optimistas dan contingencia optimista.', 'Zakresy, prawdopodobieństwa, korelacje i poziom ufności to Twoja ocena lub polityka firmy (założenia dydaktyczne); wynik jest tyle wart, co wprowadzone zakresy. Optymistyczne zakresy dają optymistyczną rezerwę.'),

    notes.push(TF(function (l) { return nf(n.iterations, l, 0) + ' ' + S.nRun[l] + ' ' + n.seed + ' · ' + (R.via === 'worker' ? S.nWorker[l] : S.nMain[l]) + ' · ' + nf(R.ms, l, 0) + ' ms · ±' + keur(2 * R.cost.se, l) + ' (' + S.se2[l] + ')'; }));

  function computeView(s) {
    var my = ++callId, r = solve(s);
    if (r && typeof r.then === 'function') {
      return r.then(function (res) { if (my === callId) last = res; if (stage) stage.schedule(); return view(last); });
    }
    last = r;
    if (stage) stage.schedule();
    return view(r);
  }

  /* ---- stage: cost S-curve with histogram (top), duration S-curve (middle), cost tornado (bottom) ---- */
  function renderStage(size, st) {
    var ctx = st.canvas(), w = size.w, h = size.h, coarse = size.density === 'coarse';
    var cs = getComputedStyle(document.documentElement);
    var muted = cs.getPropertyValue('--muted').trim() || '#888', lineC = cs.getPropertyValue('--line').trim() || '#ccc', ink = cs.getPropertyValue('--ink').trim() || '#111';
    var badC = cs.getPropertyValue('--bad').trim() || '#c0392b', okC = cs.getPropertyValue('--ok').trim() || '#1e8449';
    var font = cs.getPropertyValue('--font').trim() || 'sans-serif';
    ctx.clearRect(0, 0, w, h);
    var R = last;
    if (!R || !R.ok) return;
    var l = lang(), fs = coarse ? 10 : 11, n = R.input, sched = !!R.dur;
    ctx.font = fs + 'px ' + font;
    var Lm = coarse ? 50 : 64, Rm = coarse ? 8 : 16;
    var torN = Math.min(8, R.tornadoCost.filter(function (t) { return Math.abs(t.rho) > 0.005; }).length);
    var hTor = Math.max(90, torN * (coarse ? 18 : 22) + 30), hRest = h - hTor - 10;
    var hCost = sched ? Math.round(hRest * 0.6) : hRest, hDur = sched ? hRest - hCost : 0;
    function curve(y0, hh, cdf, hist, marks, fmtX, label) {
      var top = y0 + 12, ph = hh - 46, pw = w - Lm - Rm;
      if (ph < 30 || pw < 60) return;
      var xmin = cdf[1], xmax = cdf[99];
      marks.forEach(function (m) { if (m.v != null && isFinite(m.v)) { xmin = Math.min(xmin, m.v); xmax = Math.max(xmax, m.v); } });
      var pad = (xmax - xmin) * 0.04 || 1; xmin -= pad; xmax += pad;
      function X(v) { return Lm + (v - xmin) / (xmax - xmin) * pw; }
      function Y(p) { return top + ph - p * ph; }
      /* histogram behind, scaled to its own maximum */
      var hm = Math.max.apply(null, hist.counts) || 1;
      ctx.fillStyle = DiagramUI.series(0); ctx.globalAlpha = 0.18;
      hist.counts.forEach(function (c, k) { var a = X(hist.edges[k]), b = X(hist.edges[k + 1]); if (b < Lm || a > Lm + pw) return; ctx.fillRect(Math.max(Lm, a), Y(0.92 * c / hm), Math.max(1, Math.min(b, Lm + pw) - Math.max(Lm, a) - 0.5), 0.92 * c / hm * ph); });
      ctx.globalAlpha = 1;
      ctx.strokeStyle = muted; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(Lm, top); ctx.lineTo(Lm, top + ph); ctx.lineTo(Lm + pw, top + ph); ctx.stroke();
      ctx.fillStyle = muted; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      [0, 0.2, 0.5, 0.8, 1].forEach(function (p) { ctx.strokeStyle = lineC; ctx.beginPath(); ctx.moveTo(Lm, Y(p)); ctx.lineTo(Lm + pw, Y(p)); ctx.stroke(); ctx.fillText(nf(100 * p, l, 0) + ' %', Lm - 4, Y(p)); });
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      var tk = DiagramUI.ticks(xmin, xmax, pw, size.density) || [xmin, xmax];
      tk.forEach(function (v) { if (v < xmin || v > xmax) return; ctx.fillText(fmtX(v), X(v), top + ph + 4); });
      ctx.fillText(label, Lm + pw / 2, top + ph + fs + 8);
      /* S-curve */
      ctx.strokeStyle = DiagramUI.series(0); ctx.lineWidth = 2.2; ctx.beginPath();
      cdf.forEach(function (v, k) { var x = X(v), y = Y(k / 100); if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
      ctx.stroke();
      marks.forEach(function (m, k) {
        if (m.v == null || !isFinite(m.v)) return;
        var x = X(m.v);
        ctx.strokeStyle = m.col; ctx.setLineDash(m.dash || []); ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, top + ph); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = m.col; ctx.textAlign = x > Lm + pw - 90 ? 'right' : 'left'; ctx.textBaseline = 'top';
        ctx.fillText(m.label, x + (ctx.textAlign === 'left' ? 3 : -3), top + k * (fs + 2));
      });
    }
    var q = n.q;
    curve(0, hCost, R.cost.cdf, R.cost.hist, [
      { v: R.det.base, label: S.mkBase[l] + ' P' + nf(100 * R.pBase, l, 0), col: muted, dash: [4, 3] },
      { v: R.cost.pq, label: P(q) + ' ' + keur(R.cost.pq, l), col: ink },
      { v: n.targetCost, label: S.mkTarget[l] + (R.pTargetCost != null ? ' P' + nf(100 * R.pTargetCost, l, 0) : ''), col: R.pTargetCost != null && R.pTargetCost < q ? badC : okC, dash: [1, 3] }
    ], function (v) { return keur(v, l); }, S.hCost[l] + ' (€)');
    if (sched) curve(hCost, hDur, R.dur.cdf, R.dur.hist, [
      { v: R.det.D, label: S.mkPlan[l] + ' P' + nf(100 * R.pDet, l, 0), col: muted, dash: [4, 3] },
      { v: R.dur.pq, label: P(q) + ' ' + dd(R.dur.pq, l), col: ink },
      { v: n.targetDays, label: S.mkTarget[l] + (R.pTargetDays != null ? ' P' + nf(100 * R.pTargetDays, l, 0) : ''), col: R.pTargetDays != null && R.pTargetDays < q ? badC : okC, dash: [1, 3] }
    ], function (v) { return nf(v, l, 0); }, S.hDur[l] + ' (' + DAY[l] + ')');
    /* tornado */
    var y0 = hRest + 16, bars = R.tornadoCost.slice(0, torN), rh = coarse ? 18 : 22;
    var labW = coarse ? Math.round(w * 0.38) : Math.min(300, Math.round(w * 0.4)), x0 = labW + 8, bw = w - x0 - Rm, xm = x0 + bw / 2;
    ctx.fillStyle = ink; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(S.tabTorC[l] + ' — ρ', 4, hRest);
    bars.forEach(function (b, k) {
      var yy = y0 + k * rh, nm = String(nameOf(b.name, R));
      ctx.fillStyle = ink; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      var maxc = Math.floor(labW / (fs * 0.55));
      ctx.fillText(nm.length > maxc ? nm.slice(0, maxc - 1) + '…' : nm, labW, yy + rh / 2);
      var len = b.rho * bw / 2;
      ctx.fillStyle = b.rho >= 0 ? DiagramUI.series(0) : DiagramUI.series(1); ctx.globalAlpha = 0.8;
      ctx.fillRect(len >= 0 ? xm : xm + len, yy + 3, Math.max(1, Math.abs(len)), rh - 6); ctx.globalAlpha = 1;
      ctx.fillStyle = muted; ctx.textAlign = len >= 0 ? 'left' : 'right';
      ctx.fillText(nf(b.rho, l, 2), len >= 0 ? xm + len + 3 : xm + len - 3, yy + rh / 2);
    });
    ctx.strokeStyle = ink; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(xm, y0 - 2); ctx.lineTo(xm, y0 + bars.length * rh + 2); ctx.stroke();
  }

      return { id: p.id, group: GROUP[x.group], label: x.label, note: x.aha, apply: function (t) { applyPreset(t, p); } };
    });
  }

  function buildLearn() {
    return {
      version: 1,
      intro: {
        title: T('Contingency from ranges, risks and the schedule', 'Резерв із діапазонів, ризиків і графіка', 'Reserve aus Bereichen, Risiken und Terminplan', 'Onvoorzien uit bereiken, risico’s en planning', 'La provision à partir des fourchettes, des risques et du planning', 'Contingencia a partir de rangos, riesgos y plazo', 'Rezerwa z zakresów, ryzyk i harmonogramu'),
        body: T('Life-cycle stage 5 (estimate, risk and margin before submission) for the contractor and the supplier, stage 0 (business case and budget) for the owner. Give each cost line and activity a range, list the risk events, and the tool simulates the project thousands of times: how likely the base estimate is, how much contingency a chosen confidence needs, when the work really finishes and which inputs drive it.',
                'Етап життєвого циклу 5 (кошторис, ризик і маржа перед поданням) для підрядника й постачальника, етап 0 (обґрунтування й бюджет) для замовника. Задайте діапазон кожній статті й роботі, перелічіть ризикові події — інструмент тисячі разів моделює проєкт: наскільки імовірний базовий кошторис, скільки резерву потрібно для обраного рівня довіри, коли робота справді завершиться і які вхідні дані це визначають.',
                'Lebenszyklus-Phase 5 (Kalkulation, Risiko und Marge vor der Abgabe) für Auftragnehmer und Lieferant, Phase 0 (Bedarf und Budget) für den Bauherrn. Geben Sie jeder Position und jedem Vorgang einen Bereich, listen Sie die Risikoereignisse auf, und das Werkzeug simuliert das Projekt tausendfach: wie wahrscheinlich die Basisschätzung ist, wie viel Reserve ein gewähltes Konfidenzniveau braucht, wann die Arbeit wirklich endet und welche Eingaben das treiben.',
                'Fase 5 van de levenscyclus (raming, risico en marge vóór indiening) voor aannemer en leverancier, fase 0 (behoefte en budget) voor de opdrachtgever. Geef elke post en activiteit een bereik, lijst de risicogebeurtenissen op, en de tool simuleert het project duizenden keren: hoe waarschijnlijk de basisraming is, hoeveel onvoorzien een gekozen betrouwbaarheid vraagt, wanneer het werk echt klaar is en welke invoer dat bepaalt.',
                'Étape 5 du cycle de vie (estimation, risques et marge avant remise) pour l’entrepreneur et le fournisseur, étape 0 (besoin et budget) pour le maître d’ouvrage. Donnez une fourchette à chaque poste et activité, listez les événements à risque, et l’outil simule le projet des milliers de fois : probabilité de l’estimation de base, provision nécessaire à la confiance choisie, date réelle de fin et facteurs déterminants.',
                'Etapa 5 del ciclo de vida (estimación, riesgo y margen antes de ofertar) para el contratista y el proveedor, etapa 0 (necesidad y presupuesto) para el promotor. Dé un rango a cada partida y actividad, liste los eventos de riesgo y la herramienta simula el proyecto miles de veces: qué probabilidad tiene la estimación base, cuánta contingencia exige la confianza elegida, cuándo termina realmente la obra y qué datos lo determinan.',
                'Etap 5 cyklu życia (kosztorys, ryzyko i marża przed złożeniem oferty) dla wykonawcy i dostawcy, etap 0 (potrzeba i budżet) dla zamawiającego. Nadaj zakres każdej pozycji i czynności, wypisz zdarzenia ryzyka, a narzędzie tysiące razy symuluje projekt: jak prawdopodobny jest kosztorys bazowy, ile rezerwy wymaga wybrany poziom ufności, kiedy praca naprawdę się kończy i co o tym decyduje.')
      },
      topics: {
        ranges: { title: T('Three-point ranges and the base estimate', 'Тризначні діапазони й базовий кошторис', 'Dreipunktbereiche und Basisschätzung', 'Driepuntsbereiken en de basisraming', 'Fourchettes à trois points et estimation de base', 'Rangos de tres puntos y estimación base', 'Zakresy trzypunktowe i kosztorys bazowy'),
          body: T('Each line gets a minimum, a most likely value and a maximum. PERT (a beta distribution with weight 4 on the most likely value, mean (min + 4·ml + max)/6) is the usual choice; triangular gives more weight to the tails; uniform says “anywhere in between”. Real ranges are skewed to the right — there is more room to overrun than to save — so the sum of the most likely values, the usual “base estimate”, sits well below the median. The confidence of the base tells you how often it would hold.',
                  'Кожна стаття має мінімум, найімовірніше значення й максимум. PERT (бета-розподіл з вагою 4 на найімовірнішому, середнє (мін + 4·імов + макс)/6) — звичайний вибір; трикутний дає більшу вагу хвостам; рівномірний означає «будь-де між». Реальні діапазони скошені вправо — перевитратити легше, ніж зекономити, — тож сума найімовірніших значень, звичний «базовий кошторис», лежить помітно нижче медіани. Довіра до бази показує, як часто її буде дотримано.',
                  'Jede Position erhält Minimum, wahrscheinlichsten Wert und Maximum. PERT (Betaverteilung mit Gewicht 4 auf dem wahrscheinlichsten Wert, Mittelwert (min + 4·wahrsch. + max)/6) ist die übliche Wahl; die Dreiecksverteilung gewichtet die Ränder stärker; die Gleichverteilung sagt „irgendwo dazwischen“. Echte Bereiche sind rechtsschief — es gibt mehr Raum zum Überschreiten als zum Sparen —, daher liegt die Summe der wahrscheinlichsten Werte, die übliche „Basisschätzung“, deutlich unter dem Median. Die Konfidenz der Basis zeigt, wie oft sie hält.',
                  'Elke post krijgt een minimum, een meest waarschijnlijke waarde en een maximum. PERT (bètaverdeling met gewicht 4 op de meest waarschijnlijke waarde, gemiddelde (min + 4·mw + max)/6) is de gebruikelijke keuze; driehoek geeft de staarten meer gewicht; uniform zegt “ergens daartussen”. Echte bereiken zijn rechtsscheef — er is meer ruimte om te overschrijden dan om te besparen — dus de som van de meest waarschijnlijke waarden, de gebruikelijke “basisraming”, ligt duidelijk onder de mediaan. De betrouwbaarheid van de basis zegt hoe vaak ze standhoudt.',
                  'Chaque poste reçoit un minimum, une valeur la plus probable et un maximum. PERT (loi bêta avec un poids 4 sur la valeur la plus probable, moyenne (min + 4·pp + max)/6) est le choix habituel ; la loi triangulaire donne plus de poids aux extrêmes ; l’uniforme dit « n’importe où entre les deux ». Les fourchettes réelles sont asymétriques à droite — on dépasse plus facilement qu’on n’économise — : la somme des valeurs les plus probables, l’« estimation de base » usuelle, est nettement sous la médiane. La confiance de la base indique combien de fois elle tient.',
                  'Cada partida recibe un mínimo, un valor más probable y un máximo. PERT (distribución beta con peso 4 en el más probable, media (mín + 4·mp + máx)/6) es la elección habitual; la triangular da más peso a las colas; la uniforme dice «en cualquier punto intermedio». Los rangos reales son asimétricos a la derecha —hay más margen para pasarse que para ahorrar—, por lo que la suma de los más probables, la «estimación base» habitual, queda claramente por debajo de la mediana. La confianza de la base indica con qué frecuencia se cumple.',
                  'Każda pozycja dostaje minimum, wartość najbardziej prawdopodobną i maksimum. PERT (rozkład beta z wagą 4 na wartości najbardziej prawdopodobnej, średnia (min + 4·np + maks)/6) to zwykły wybór; trójkątny daje większą wagę ogonom; jednostajny mówi „gdziekolwiek pomiędzy”. Rzeczywiste zakresy są prawoskośne — łatwiej przekroczyć niż zaoszczędzić — więc suma wartości najbardziej prawdopodobnych, zwykły „kosztorys bazowy”, leży wyraźnie poniżej mediany. Ufność bazy mówi, jak często zostanie dotrzymana.') },
        events: { title: T('Risk events and their expected value', 'Ризикові події та їхнє очікуване значення', 'Risikoereignisse und ihr Erwartungswert', 'Risicogebeurtenissen en hun verwachte waarde', 'Événements à risque et valeur attendue', 'Eventos de riesgo y su valor esperado', 'Zdarzenia ryzyka i ich wartość oczekiwana'),
          body: T('A risk event either happens (probability p) or not; if it happens it costs a range of money and may delay a path. Its expected monetary value EMV = p × mean impact is what a risk register usually shows. Adding the EMVs to the base gives the mean effect of the risks, not a confidence level: in most runs no or few risks occur, in some several hit at once. The simulation keeps that spread.',
                  'Ризикова подія або стається (імовірність p), або ні; якщо стається, вона коштує певний діапазон грошей і може затримати шлях. Її очікувана грошова вартість EMV = p × середній вплив — те, що зазвичай показує реєстр ризиків. Сума EMV, додана до бази, дає середній ефект ризиків, а не рівень довіри: у більшості прогонів ризиків немає чи мало, а в деяких кілька стаються разом. Моделювання зберігає цей розкид.',
                  'Ein Risikoereignis tritt ein (Wahrscheinlichkeit p) oder nicht; tritt es ein, kostet es einen Geldbereich und kann einen Pfad verzögern. Sein erwarteter Geldwert EMV = p × mittlere Auswirkung ist, was ein Risikoregister meist zeigt. Die EMV zur Basis addiert ergeben die mittlere Wirkung der Risiken, kein Konfidenzniveau: in den meisten Läufen treten keine oder wenige Risiken ein, in manchen mehrere zugleich. Die Simulation behält diese Streuung.',
                  'Een risicogebeurtenis treedt op (kans p) of niet; treedt ze op, dan kost ze een bereik aan geld en kan ze een pad vertragen. De verwachte monetaire waarde EMV = p × gemiddelde impact is wat een risicoregister meestal toont. De EMV’s bij de basis optellen geeft het gemiddelde effect van de risico’s, geen betrouwbaarheid: in de meeste runs treden geen of weinig risico’s op, in sommige meerdere tegelijk. De simulatie houdt die spreiding.',
                  'Un événement à risque survient (probabilité p) ou non ; s’il survient, il coûte une fourchette d’argent et peut retarder un chemin. Sa valeur monétaire attendue EMV = p × impact moyen est ce qu’affiche d’ordinaire un registre des risques. Ajouter les EMV à la base donne l’effet moyen des risques, pas un niveau de confiance : dans la plupart des tirages peu ou pas de risques surviennent, dans certains plusieurs à la fois. La simulation conserve cette dispersion.',
                  'Un evento de riesgo ocurre (probabilidad p) o no; si ocurre, cuesta un rango de dinero y puede retrasar un camino. Su valor monetario esperado EMV = p × impacto medio es lo que suele mostrar un registro de riesgos. Sumar los EMV a la base da el efecto medio de los riesgos, no un nivel de confianza: en la mayoría de las iteraciones ocurren pocos o ninguno, en algunas varios a la vez. La simulación conserva esa dispersión.',
                  'Zdarzenie ryzyka albo wystąpi (prawdopodobieństwo p), albo nie; jeśli wystąpi, kosztuje zakres pieniędzy i może opóźnić ścieżkę. Jego oczekiwana wartość pieniężna EMV = p × średni wpływ to to, co zwykle pokazuje rejestr ryzyk. Suma EMV dodana do bazy daje średni efekt ryzyk, a nie poziom ufności: w większości przebiegów nie występuje żadne lub niewiele ryzyk, w niektórych kilka naraz. Symulacja zachowuje ten rozrzut.') },
        schedule: { title: T('Parallel paths, merge bias and the cost of time', 'Паралельні шляхи, ефект злиття та вартість часу', 'Parallele Pfade, Zusammenführungseffekt und Kosten der Zeit', 'Parallelle paden, samenloopeffect en de kost van tijd', 'Chemins parallèles, biais de convergence et coût du temps', 'Caminos paralelos, sesgo de convergencia y coste del tiempo', 'Ścieżki równoległe, efekt scalania i koszt czasu'),
          body: T('Activities without a path run in series; activities with the same path letter form a chain, and chains run in parallel between the common activities. Where chains join, the latest sets the date, so with several chains of similar length the finish is later than any single chain suggests (merge bias). Duration then feeds the cost: time-dependent cost (site overheads, plant, the owner’s team) per day of difference to the plan, and delay damages beyond the contract duration up to their cap. That is the integrated cost-schedule analysis of AACE RP 57R-09. Belgian public works contracts do not count damages per day: AUR art. 86 sets delay fines R = 0.45·M·n²/N² (N = working days of the period, 0.7 × calendar days), capped at 5 % of M; choose that model in the damages panel.',
                  'Роботи без шляху йдуть послідовно; роботи з однаковою літерою шляху утворюють ланцюг, а ланцюги йдуть паралельно між спільними роботами. Де ланцюги сходяться, дату визначає найпізніший, тож за кількох ланцюгів схожої довжини завершення пізніше, ніж показує будь-який окремий ланцюг (ефект злиття). Тривалість далі впливає на вартість: вартість часу (накладні майданчика, техніка, команда замовника) за кожен день відхилення від плану та штрафи понад контрактний строк до їх обмеження. Це інтегрований аналіз вартості й графіка за AACE RP 57R-09. Бельгійські публічні договори на роботи не рахують штрафи за день: AUR ст. 86 встановлює штрафи R = 0,45·M·n²/N² (N — робочі дні строку, 0,7 × календарних), не більше 5 % від M; оберіть цю модель на панелі штрафів.',
                  'Vorgänge ohne Pfad laufen in Reihe; Vorgänge mit gleichem Pfadbuchstaben bilden eine Kette, Ketten laufen parallel zwischen den gemeinsamen Vorgängen. Wo Ketten zusammenlaufen, bestimmt die späteste den Termin; bei mehreren ähnlich langen Ketten liegt das Ende später, als jede einzelne Kette vermuten lässt (merge bias). Die Dauer wirkt dann auf die Kosten: zeitabhängige Kosten (Baustellengemeinkosten, Geräte, Bauherrenteam) je Tag Abweichung vom Plan und Verzugsstrafen über die Vertragsdauer hinaus bis zur Obergrenze. Das ist die integrierte Kosten-Termin-Analyse nach AACE RP 57R-09. Belgische öffentliche Bauaufträge rechnen Strafen nicht je Tag: AUR Art. 86 setzt Verzugsstrafen R = 0,45·M·n²/N² fest (N = Arbeitstage der Frist, 0,7 × Kalendertage), höchstens 5 % von M; wählen Sie dieses Modell im Strafenfeld.',
                  'Activiteiten zonder pad lopen in serie; activiteiten met dezelfde padletter vormen een keten, ketens lopen parallel tussen de gemeenschappelijke activiteiten. Waar ketens samenkomen, bepaalt de laatste de datum; met meerdere ketens van gelijke lengte ligt het einde later dan elke keten afzonderlijk doet vermoeden (merge bias). De duur werkt dan door in de kost: tijdgebonden kosten (werfkosten, materieel, team van de opdrachtgever) per dag verschil met de planning, en vertragingsboetes na de contractuele termijn tot het plafond. Dat is de geïntegreerde kost-planninganalyse van AACE RP 57R-09. Belgische overheidsopdrachten voor werken rekenen boetes niet per dag: AUR art. 86 legt vertragingsboetes R = 0,45·M·n²/N² op (N = werkdagen van de termijn, 0,7 × kalenderdagen), begrensd op 5 % van M; kies dat model bij de boetes.',
                  'Les activités sans chemin sont en série ; les activités de même lettre forment une chaîne, les chaînes sont parallèles entre les activités communes. À la jonction, la plus tardive fixe la date : avec plusieurs chaînes de longueur voisine, la fin est plus tardive que ne le suggère chaque chaîne (biais de convergence). La durée se répercute ensuite sur le coût : coûts liés au temps (frais de chantier, matériel, équipe du maître d’ouvrage) par jour d’écart au planning, et pénalités au-delà du délai contractuel jusqu’au plafond. C’est l’analyse intégrée coût-délai de l’AACE RP 57R-09. Les marchés publics de travaux belges ne comptent pas les amendes par jour : les RGE art. 86 fixent les amendes pour retard R = 0,45·M·n²/N² (N = jours ouvrables du délai, 0,7 × jours calendrier), plafonnées à 5 % de M ; choisissez ce modèle dans le panneau des amendes.',
                  'Las actividades sin camino van en serie; las de la misma letra forman una cadena y las cadenas van en paralelo entre las actividades comunes. Donde se unen, la más tardía fija la fecha; con varias cadenas de duración similar el final es más tarde de lo que sugiere cualquiera de ellas (sesgo de convergencia). La duración repercute luego en el coste: costes dependientes del plazo (gastos de obra, maquinaria, equipo del promotor) por día de diferencia con el plan, y penalizaciones más allá del plazo contractual hasta su tope. Es el análisis integrado coste-plazo de AACE RP 57R-09. Los contratos públicos de obras belgas no cuentan la penalización por día: el AUR art. 86 fija R = 0,45·M·n²/N² (N = días hábiles del plazo, 0,7 × días naturales), con tope del 5 % de M; elija ese modelo en el panel de penalizaciones.',
                  'Czynności bez ścieżki biegną szeregowo; czynności z tą samą literą tworzą łańcuch, a łańcuchy biegną równolegle między czynnościami wspólnymi. Tam, gdzie się łączą, datę wyznacza najpóźniejszy; przy kilku łańcuchach podobnej długości koniec wypada później, niż sugeruje każdy z osobna (efekt scalania). Czas wpływa następnie na koszt: koszty czasowe (koszty budowy, sprzęt, zespół inwestora) za każdy dzień różnicy wobec planu oraz kary po terminie umownym do limitu. To zintegrowana analiza kosztu i czasu wg AACE RP 57R-09. Belgijskie zamówienia publiczne na roboty nie liczą kar za dzień: AUR art. 86 ustala kary R = 0,45·M·n²/N² (N = dni robocze terminu, 0,7 × dni kalendarzowych), do 5 % M; wybierz ten model w panelu kar.') },
        corr: { title: T('Correlation: lines that move together', 'Кореляція: статті, що рухаються разом', 'Korrelation: Positionen, die sich gemeinsam bewegen', 'Correlatie: posten die samen bewegen', 'Corrélation : des postes qui bougent ensemble', 'Correlación: partidas que se mueven juntas', 'Korelacja: pozycje, które poruszają się razem'),
          body: T('If steel prices, labour productivity or design maturity push one line up, they push others up too. Treating the lines as independent lets overruns and savings cancel out and makes the total look narrower than it is. One rank correlation for all cost lines (and one for all activities) is applied with the Iman–Conover method, which reorders the samples without changing any single range. Values of 0.3–0.6 are common judgement for lines with shared drivers.',
                  'Якщо ціни на сталь, продуктивність праці чи зрілість проєкту підвищують одну статтю, вони підвищують і інші. Якщо вважати статті незалежними, перевитрати й економія взаємно гасяться, і підсумок виглядає вужчим, ніж є. Одна рангова кореляція для всіх статей (і одна для всіх робіт) застосовується методом Імана–Коновера, який переставляє вибірки, не змінюючи жодного окремого діапазону. Значення 0,3–0,6 — звичне експертне судження для статей зі спільними чинниками.',
                  'Wenn Stahlpreise, Arbeitsproduktivität oder Planungsreife eine Position anheben, heben sie auch andere. Wer die Positionen als unabhängig behandelt, lässt Überschreitungen und Einsparungen sich aufheben, und die Summe wirkt schmaler, als sie ist. Eine Rangkorrelation für alle Positionen (und eine für alle Vorgänge) wird nach Iman–Conover angewandt, das die Stichproben umordnet, ohne einen einzelnen Bereich zu ändern. Werte von 0,3–0,6 sind übliche Einschätzungen für Positionen mit gemeinsamen Treibern.',
                  'Als staalprijzen, arbeidsproductiviteit of de maturiteit van het ontwerp één post doen stijgen, doen ze ook andere stijgen. Wie de posten onafhankelijk behandelt, laat overschrijdingen en besparingen tegen elkaar wegvallen en het totaal smaller lijken dan het is. Eén rangcorrelatie voor alle posten (en één voor alle activiteiten) wordt toegepast met de methode van Iman–Conover, die de steekproeven herschikt zonder een afzonderlijk bereik te wijzigen. Waarden van 0,3–0,6 zijn gangbare inschattingen voor posten met gemeenschappelijke drijvers.',
                  'Si le prix de l’acier, la productivité ou la maturité des études poussent un poste à la hausse, ils en poussent d’autres aussi. Traiter les postes comme indépendants laisse dépassements et économies se compenser et fait paraître le total plus étroit qu’il n’est. Une corrélation de rang pour tous les postes (et une pour toutes les activités) est appliquée par la méthode d’Iman–Conover, qui réordonne les tirages sans modifier aucune fourchette. Des valeurs de 0,3 à 0,6 sont un jugement courant pour des postes aux facteurs communs.',
                  'Si el precio del acero, la productividad o la madurez del diseño suben una partida, suben también otras. Tratar las partidas como independientes deja que sobrecostes y ahorros se compensen y el total parece más estrecho de lo que es. Se aplica una correlación de rangos para todas las partidas (y otra para todas las actividades) con el método de Iman–Conover, que reordena las muestras sin cambiar ningún rango individual. Valores de 0,3–0,6 son un criterio habitual para partidas con factores comunes.',
                  'Jeśli ceny stali, wydajność pracy lub dojrzałość projektu podnoszą jedną pozycję, podnoszą też inne. Traktowanie pozycji jako niezależnych pozwala przekroczeniom i oszczędnościom się znosić, a suma wygląda na węższą, niż jest. Jedna korelacja rang dla wszystkich pozycji (i jedna dla wszystkich czynności) jest stosowana metodą Imana–Conovera, która przestawia próbki, nie zmieniając żadnego zakresu. Wartości 0,3–0,6 to typowa ocena eksperta dla pozycji o wspólnych czynnikach.') },
        contingency: { title: T('P-values, contingency and joint confidence', 'P-значення, резерв і спільна довіра', 'P-Werte, Reserve und gemeinsame Konfidenz', 'P-waarden, onvoorzien en gezamenlijke betrouwbaarheid', 'Valeurs P, provision et confiance conjointe', 'Valores P, contingencia y confianza conjunta', 'Wartości P, rezerwa i ufność łączna'),
          body: T('P80 is the cost not exceeded in 80 % of the runs. Contingency at P80 = P80 − base estimate: the money to hold for the uncertainty you have described, split here into estimate uncertainty and risk events with delay cost. Which confidence to fund is a policy choice: owners often budget at P80 or P90 for the project and keep the difference to P50 as a central reserve; a contractor may price at P50–P70 and carry the rest as risk. Cost and duration at the same P hold together less often — the joint confidence level (JCL) is the share of runs in which both are met.',
                  'P80 — вартість, яку не перевищено у 80 % прогонів. Резерв P80 = P80 − базовий кошторис: гроші, які треба тримати під описану невизначеність; тут він поділений на невизначеність кошторису та ризикові події з вартістю затримки. Який рівень довіри фінансувати — рішення політики: замовники часто закладають P80 чи P90 і тримають різницю до P50 як центральний резерв; підрядник може ціноутворювати на P50–P70 і нести решту як ризик. Вартість і тривалість з однаковим P разом виконуються рідше — спільний рівень довіри (JCL) — частка прогонів, де виконано обидва.',
                  'P80 sind die Kosten, die in 80 % der Läufe nicht überschritten werden. Reserve bei P80 = P80 − Basisschätzung: das Geld für die beschriebene Unsicherheit, hier aufgeteilt in Schätzunsicherheit und Risikoereignisse mit Verzugskosten. Welches Konfidenzniveau finanziert wird, ist eine Grundsatzentscheidung: Bauherren budgetieren oft P80 oder P90 und halten die Differenz zu P50 zentral; ein Auftragnehmer kalkuliert vielleicht bei P50–P70 und trägt den Rest als Risiko. Kosten und Dauer beim gleichen P halten seltener gemeinsam — die gemeinsame Konfidenz (JCL) ist der Anteil der Läufe, in denen beides eingehalten wird.',
                  'P80 is de kost die in 80 % van de runs niet overschreden wordt. Onvoorzien bij P80 = P80 − basisraming: het geld om aan te houden voor de beschreven onzekerheid, hier gesplitst in ramingsonzekerheid en risicogebeurtenissen met vertragingskosten. Welke betrouwbaarheid men financiert, is een beleidskeuze: opdrachtgevers budgetteren vaak op P80 of P90 en houden het verschil met P50 centraal aan; een aannemer prijst misschien op P50–P70 en draagt de rest als risico. Kost en duur op dezelfde P worden minder vaak samen gehaald — de gezamenlijke betrouwbaarheid (JCL) is het aandeel runs waarin beide gehaald worden.',
                  'P80 est le coût non dépassé dans 80 % des tirages. Provision à P80 = P80 − estimation de base : l’argent à réserver pour l’incertitude décrite, ventilé ici entre incertitude d’estimation et événements à risque avec coûts de retard. Le niveau de confiance à financer est un choix de politique : les maîtres d’ouvrage budgètent souvent à P80 ou P90 et gardent l’écart avec P50 en réserve centrale ; un entrepreneur peut chiffrer à P50–P70 et porter le reste comme risque. Coût et durée au même P tiennent moins souvent ensemble — la confiance conjointe (JCL) est la part des tirages où les deux sont tenus.',
                  'P80 es el coste no superado en el 80 % de las iteraciones. Contingencia a P80 = P80 − estimación base: el dinero que reservar para la incertidumbre descrita, dividido aquí en incertidumbre de estimación y eventos de riesgo con coste del retraso. Qué confianza financiar es una decisión de política: los promotores suelen presupuestar a P80 o P90 y guardar la diferencia con P50 como reserva central; un contratista puede ofertar a P50–P70 y asumir el resto como riesgo. Coste y plazo al mismo P se cumplen juntos con menos frecuencia: la confianza conjunta (JCL) es la proporción de iteraciones en que se cumplen ambos.',
                  'P80 to koszt nieprzekroczony w 80 % przebiegów. Rezerwa przy P80 = P80 − kosztorys bazowy: pieniądze na opisaną niepewność, rozbite tu na niepewność kosztorysu i zdarzenia ryzyka z kosztem opóźnienia. Jaki poziom ufności finansować, to decyzja polityki: inwestorzy często budżetują P80 lub P90 i trzymają różnicę do P50 jako rezerwę centralną; wykonawca może wyceniać na P50–P70 i nieść resztę jako ryzyko. Koszt i czas przy tym samym P rzadziej są dotrzymane razem — ufność łączna (JCL) to udział przebiegów, w których dotrzymano obu.') },
        tornado: { title: T('Tornado: what drives the result', 'Торнадо: що визначає результат', 'Tornado: was das Ergebnis treibt', 'Tornado: wat het resultaat bepaalt', 'Tornade : ce qui pilote le résultat', 'Tornado: qué determina el resultado', 'Tornado: co decyduje o wyniku'),
          body: T('For every input the tool computes the rank correlation ρ between its sampled values and the total cost (or duration): the length of the bar ranks the drivers. For the cost the table also gives each part’s share of the variance, Cov(part, total)/Var(total): cost lines, direct risk costs and the time-related cost add up to exactly 100 %, even when the lines are correlated (ρ² shares would overstate small correlated lines). That is where the contingency comes from. A wide range on a small line can matter more than a narrow range on a big one. Spend the remaining bid time on the top bars: firm quotes, a site investigation, a clause that moves the risk.', 'Для кожної вхідної величини інструмент рахує рангову кореляцію ρ між її змодельованими значеннями й загальною вартістю (чи тривалістю): довжина смуги ранжує чинники. Для вартості таблиця також дає частку кожної складової в дисперсії, Cov(складова, сума)/Var(сума): статті витрат, прямі витрати ризиків і витрати від часу дають разом рівно 100 %, навіть коли статті корельовані (частки ρ² завищували б малі корельовані статті). Саме звідси береться резерв. Широкий діапазон малої статті може важити більше, ніж вузький діапазон великої. Витрачайте залишок часу на тендер на верхні смуги: тверді комерційні пропозиції, вишукування на майданчику, пункт договору, що переносить ризик.', 'Für jede Eingabe berechnet das Werkzeug die Rangkorrelation ρ zwischen ihren Stichprobenwerten und den Gesamtkosten (oder der Dauer): die Balkenlänge ordnet die Treiber. Für die Kosten gibt die Tabelle zusätzlich den Varianzanteil jedes Teils an, Cov(Teil, Summe)/Var(Summe): Kostenpositionen, direkte Risikokosten und zeitabhängige Kosten ergeben zusammen genau 100 %, auch bei korrelierten Positionen (ρ²-Anteile würden kleine korrelierte Positionen überzeichnen). Daher kommt die Reserve. Ein breiter Bereich bei einer kleinen Position kann mehr zählen als ein schmaler bei einer großen. Verwenden Sie die restliche Angebotszeit auf die oberen Balken: feste Angebote, eine Baugrunderkundung, eine Klausel, die das Risiko verlagert.', 'Voor elke invoer berekent de tool de rangcorrelatie ρ tussen de gesimuleerde waarden en de totale kost (of duur): de lengte van de balk rangschikt de drijvers. Voor de kost geeft de tabel ook het aandeel van elk deel in de variantie, Cov(deel, totaal)/Var(totaal): kostenposten, directe risicokosten en tijdgebonden kosten tellen samen op tot precies 100 %, ook als de posten gecorreleerd zijn (ρ²-aandelen zouden kleine gecorreleerde posten overschatten). Daar komt het onvoorzien vandaan. Een breed bereik op een kleine post kan zwaarder wegen dan een smal bereik op een grote. Besteed de resterende offertetijd aan de bovenste balken: vaste prijsoffertes, een terreinonderzoek, een clausule die het risico verschuift.', 'Pour chaque entrée, l’outil calcule la corrélation de rang ρ entre ses valeurs tirées et le coût total (ou la durée) : la longueur de la barre classe les facteurs. Pour le coût, le tableau donne aussi la part de chaque composante dans la variance, Cov(composante, total)/Var(total) : postes, coûts directs des risques et coûts liés au temps font exactement 100 %, même quand les postes sont corrélés (des parts en ρ² surestimeraient les petits postes corrélés). C’est de là que vient la provision. Une large fourchette sur un petit poste peut peser plus qu’une fourchette étroite sur un gros. Consacrez le temps d’offre restant aux barres du haut : offres fermes, reconnaissance de sol, clause qui transfère le risque.', 'Para cada dato la herramienta calcula la correlación de rangos ρ entre sus valores simulados y el coste total (o la duración): la longitud de la barra ordena los factores. Para el coste la tabla da además la cuota de cada parte en la varianza, Cov(parte, total)/Var(total): partidas, costes directos de los riesgos y costes del plazo suman exactamente el 100 %, también con partidas correlacionadas (las cuotas ρ² sobrestimarían las partidas pequeñas correlacionadas). De ahí sale la contingencia. Un rango amplio en una partida pequeña puede pesar más que uno estrecho en una grande. Dedique el tiempo de oferta que queda a las barras superiores: precios firmes, un estudio geotécnico, una cláusula que traslade el riesgo.', 'Dla każdej wielkości wejściowej narzędzie liczy korelację rang ρ między jej wylosowanymi wartościami a kosztem całkowitym (lub czasem): długość paska porządkuje czynniki. Dla kosztu tabela podaje też udział każdej części w wariancji, Cov(część, suma)/Var(suma): pozycje kosztów, bezpośrednie koszty ryzyk i koszty czasu dają razem dokładnie 100 %, także przy skorelowanych pozycjach (udziały ρ² zawyżałyby małe skorelowane pozycje). Stąd bierze się rezerwa. Szeroki zakres małej pozycji może ważyć więcej niż wąski zakres dużej. Pozostały czas na ofertę poświęć górnym paskom: wiążące oferty, badanie gruntu, klauzula przenosząca ryzyko.') }
      },
      tour: [
        { topic: 'ranges', focus: '[data-dgu-field="f-items"]' },

  /* ---- project bar (tnd-core.js) ---- */
  var bar = null, useMsg = null;
  function riskBlock() {
    return (state.risks || []).map(function (x, k) {
      var hasC = x.cml != null || x.cmax != null, hasT = x.tml != null || x.tmax != null;
      var o = { id: 'R' + (k + 1), title: x.name || '', kind: hasC && hasT ? 'both' : (hasT ? 'time' : 'cost'), p: (+x.p || 0) / 100, owner: x.owner || '' };
      o.impact = hasC ? { dist: x.dist || 'pert', min: x.cmin, ml: x.cml, max: x.cmax } : { dist: 'fixed', min: 0, ml: 0, max: 0 };
      if (hasT) o.delay = { dist: x.dist || 'pert', min: x.tmin, ml: x.tml, max: x.tmax, unit: 'd', path: x.path || '' };
      return o;
    });
  }
  function projectPayload() {
    if (!last || !last.ok) return null;
    var R = last, at = R.atQ;
    return {
      state: JSON.parse(JSON.stringify(state)),
      results: { base: R.det.base, mean: R.cost.stats.mean, p50: R.cost.stats.p50, p80: R.cost.stats.p80, p90: R.cost.stats.p90, confidence: R.input.q, contingency: at.contingency, contingency_pct: at.pct,
                 p_base: R.pBase, emv: R.det.emv, duration_plan: R.dur ? R.det.D : null, duration_p50: R.dur ? R.dur.stats.p50 : null, duration_p80: R.dur ? R.dur.stats.p80 : null,
                 joint_confidence: R.joint, expected_delay_damages: R.ld.mean, iterations: R.input.iterations, seed: R.input.seed },
      summary: { text: P(R.input.q) + ' contingency ' + Math.round(at.contingency) + ' EUR (' + (100 * at.pct).toFixed(1) + ' %), base at P' + Math.round(100 * R.pBase) },
      blocks: { risks: riskBlock() }
    };
  }
  function showUse(text, tone) {
    if (!useMsg) return;
    useMsg.textContent = text; useMsg.style.display = text ? '' : 'none';
    useMsg.style.borderColor = tone === 'bad' ? 'var(--bad,#c0392b)' : (tone === 'warn' ? 'var(--warn,#d68910)' : 'var(--line,#e2e7ee)');
  }
  /* a tender/v1 risks[] row -> a risk event row; log collects what was changed (review R-7): fixed or one-value impacts become min = ml = max,
     p in (1, 100] is read as percent, other p outside 0..1 is capped */
  function fromBlock(x, log) {
    if (!x || typeof x !== 'object') return null;
    log = log || { pct: [], clamp: [], fixed: [], skipped: [] };
    var imp = x.impact && typeof x.impact === 'object' ? x.impact : {}, del = x.delay && typeof x.delay === 'object' ? x.delay : {};
    var name = String(x.title || x.name || x.id || '').slice(0, 120), p = typeof x.p === 'number' && isFinite(x.p) ? x.p : 0;
    if (p > 1 && p <= 100) { p = p / 100; log.pct.push(name); } else if (p < 0 || p > 1) { p = Math.max(0, Math.min(1, p)); log.clamp.push(name); }
    var g = function (o, k) { return typeof o[k] === 'number' && isFinite(o[k]) ? o[k] : null; };
    var dist = ['pert', 'triangular', 'uniform'].indexOf(imp.dist || imp.type) >= 0 ? (imp.dist || imp.type) : 'pert';
    function three(o) {
      var mn = g(o, 'min'), ml = g(o, 'ml'), mx = g(o, 'max');
      if (o.dist === 'fixed' || o.type === 'fixed' || (ml != null && (mn == null || mx == null))) {
        var v = ml != null ? ml : (mn != null ? mn : mx);
        if (v == null || v === 0) return null;
        log.fixed.push(name);
        return [v, v, v];
      }
      if (ml == null && mx == null) return null;
      if (ml == null && mn != null && mx != null) ml = (mn + mx) / 2;
      return [mn, ml, mx];
    }
    var c3 = three(imp), t3 = three(del);
    if (!c3 && !t3) { log.skipped.push(name || '?'); return null; }
    return { name: name, p: Math.max(0, Math.min(100, +(100 * p).toFixed(6))), dist: dist,
             cmin: c3 ? c3[0] : null, cml: c3 ? c3[1] : null, cmax: c3 ? c3[2] : null,
             tmin: t3 ? t3[0] : null, tml: t3 ? t3[1] : null, tmax: t3 ? t3[2] : null, path: typeof del.path === 'string' ? del.path.slice(0, 12) : '', owner: String(x.owner || '').slice(0, 60) };
  }
  /* "Use": restore our own module state, or take the tender project's risk register as risk events */
  function useProject(doc, moduleId) {
    var L = lang();
    if (!doc || typeof doc !== 'object') { showUse(S.useNone[L], 'warn'); return { ok: false }; }
    var mod = doc.modules && doc.modules[TOOL];
    if ((moduleId === TOOL || !moduleId) && mod && mod.state && typeof mod.state === 'object') {
      var clean = sanitize(mod.state);
      if (clean.items || clean.risks) {
        var d = JSON.parse(JSON.stringify(DEFAULTS)); applyPreset(d, lib().PRESETS[0]);
        Object.keys(d).forEach(function (k) { state[k] = d[k]; });
        Object.keys(clean).forEach(function (k) { state[k] = clean[k]; });
        if (ui) { ui.sync(); ui.run(); }
        showUse(S.useTaken[L] + ': ' + (mod.summary && mod.summary.text || TOOL), 'ok');
        return { ok: true, from: 'module' };
      }
    }
    var log = { pct: [], clamp: [], fixed: [], skipped: [] };
    var rs = Array.isArray(doc.risks) ? doc.risks.map(function (x) { return fromBlock(x, log); }).filter(Boolean).slice(0, MAXR) : [];
    if (!rs.length) { showUse(S.useNone[L], 'warn'); return { ok: false }; }
    var extra = [];
    if (log.pct.length) extra.push(S.usePct[L] + ': ' + log.pct.join(', '));
    if (log.clamp.length) extra.push(S.useClamp[L] + ': ' + log.clamp.join(', '));
    if (log.fixed.length) extra.push(S.useFixed[L] + ': ' + log.fixed.join(', '));
    if (log.skipped.length) extra.push(log.skipped.length + ' ' + S.useSkipped[L] + ': ' + log.skipped.join(', '));
    state.risks = rs;
    if (doc.tender && typeof doc.tender.reference === 'string' && doc.tender.reference) state.tenderRef = doc.tender.reference.slice(0, 200);
    if (ui) { ui.sync(); ui.run(); }
    showUse(rs.length + ' ' + S.useRisks[L] + (extra.length ? '. ' + extra.join('. ') + '.' : ''), extra.length ? 'warn' : 'ok');
    return { ok: true, from: 'risks', log: log };
  }
  function mountBar(box) {

      var lc = document.createElement('div'); box.appendChild(lc);
      if (typeof C.ui.lifecycle === 'function') C.ui.lifecycle({ mount: lc, toolId: TOOL, role: 'contractor', lang: lang });
      var bx = document.createElement('div'); box.appendChild(bx);
      var stored = null; try { stored = C.project.load(); } catch (e) { stored = null; }
      bar = C.ui.projectBar({ mount: bx, toolId: TOOL, lang: lang, doc: stored || C.project.empty({ role: 'contractor', lang: lang() }),
        getDoc: function () { var p = projectPayload(), d = bar ? bar.getDoc() : C.project.empty(); return p ? C.project.withModule(d, TOOL, p) : d; },

      if (bar && bar.element) {
        var css = 'min-height:var(--ctl-h,32px);padding:0 10px;border:1px solid var(--line,#e2e7ee);border-radius:var(--radius-sm,8px);background:var(--panel-2,#f9fafc);color:var(--ink,#12161d);cursor:pointer;font:inherit';
        var b = document.createElement('button');

        bar.element.appendChild(useMsg);
      }
    } catch (e) { bar = null; }
  }

  function rangeProblem(r) {
    if (r.dist === 'fixed') return r.ml == null ? '' : '';
    if (r.min == null || r.ml == null || r.max == null) return '';
    return r.min <= r.ml && r.ml <= r.max ? '' : 'min ≤ ml ≤ max';
  }

      add('schedule', 'duration_P90', R.dur.stats.p90, 'd'); add('schedule', 'confidence_of_plan', R.pDet, 'fraction'); add('schedule', 'joint_confidence', R.joint, 'fraction');

  function buildRecord() {

                    'cost = sum cost lines + sum risk costs + time cost x (D - D0) + damages(D); damages = min(cap, damages/day x max(0, D - contract duration)) or AUR art. 86: min(pct x M, 0.45 M n^2/N^2), n = D - contract duration, N = floor(0.7 x contract duration)',
                    'tornado: Spearman rank correlation with the output; cost share = Cov(part, total)/Var(total) over cost lines, direct risk costs and time-related cost (sums to 1); duration share = rho^2/sum rho^2 (ranking only)',
                    'contingency(q) = P_q(cost) - B; EMV = sum p x E[cost impact]; JCL = P(cost <= C_q and D <= D_q)',
                    'PERT: beta with a = 1 + 4 (ml - min)/(max - min), b = 1 + 4 (max - ml)/(max - min); rank correlation by Iman-Conover (1982)'],
        assumptions: ['independent risk events', 'one rank correlation for all cost lines and one for all activities', 'paths are chains between common activities (no general network logic)', 'time cost applies both ways around the plan'],
        ranges: ['up to 40 cost lines, 30 activities, 40 risk events; 1 000 - 100 000 iterations'],
