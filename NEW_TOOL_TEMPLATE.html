/* NEW TOOL TEMPLATE — tools.petrov.re UI framework v3, level 3.
 *
 * Three parts, in this order, and nothing else:
 *
 *   1. the model      — pure functions and a defaults object. No DOM, no strings
 *                       for the screen, no knowledge that a screen exists.
 *   2. the interface  — ONE DiagramUI.app({…}) declaration. Data, not markup.
 *   3. the data layer — Diagram.init({state, record, handoff}), unchanged from v2.
 *
 * This file contains no <style> element, no CSS at all, no style= attribute,
 * and on the path a reader actually takes it builds no DOM: it constructs no
 * element, sets no markup, appends nothing, looks nothing up by id or selector,
 * and binds no listener to a control. Everything on screen is a framework
 * component.
 *
 * It touches the document seven times, and each one is named here so the claim
 * above can be checked rather than believed:
 *   - document.title, one createElement x2 and one appendChild x2, ALL inside
 *     degrade() — the branch reached only when diagram-ui.js did not load and
 *     there is therefore no framework left to render a message with. A reader
 *     with a working browser executes none of them;
 *   - getComputedStyle, to read the theme tokens the canvas draws with;
 *   - one DOMContentLoaded listener, to boot.
 *
 * boot() does NOT return early when the framework is absent. installData() —
 * Diagram.init — runs on both paths, so the shared bar, the calculation record,
 * the export and the disclaimer survive a missing diagram-ui.js. That is the
 * shape `check.js --block` on diagram-ui.js tests, and this file failed that
 * gate at all four viewports until 2026-08-18. See AUTHORING.md §1.3 and §7.2.
 * The canvas drawing is the only pixels the tool owns — which is the point:
 * a tool owns its data, the framework owns its interface.
 *
 * Copy this file, replace the manifest, replace part 1, rewrite part 2's field
 * and tile lists, and you have a new tool.
 */
(function () {
  'use strict';

  /* ============================================================ 1. the model */

  /* Magnus formula, °C in and °C out. Used only to say where condensation
     would start on the room-side face, at a fixed 50 % indoor humidity. */
  function dewPointC(tC, rh) {
    var g = Math.log(rh / 100) + 17.62 * tC / (243.12 + tC);
    return 243.12 * g / (17.62 - g);
  }

  /* Series resistance through one homogeneous layer between two surface films.
     Everything is SI: metres, kelvin, W/(m K), m2K/W, W/m2. */
  function solve(s) {
    var Rlayer = s.d / s.lambda;
    var Rtot = s.Rsi + Rlayer + s.Rse;
    var U = 1 / Rtot;
    var dT = s.Ti - s.Te;
    var q = U * dT;
    var Tsi = s.Ti - q * s.Rsi;
    var dew = dewPointC(s.Ti - 273.15, RH_INDOOR);
    return {
      Rlayer: Rlayer, Rtot: Rtot, U: U, dT: dT, q: q,
      Tsi: Tsi,                           /* inside surface temperature, K */
      Tse: s.Te + q * s.Rse,              /* outside surface temperature, K */
      Qwall: q * s.A,                     /* heat flow for the declared area */
      dew: dew,                           /* indoor dew point, °C */
      damp: (Tsi - 273.15) <= dew,        /* the surface would wet */
      ratio: U / s.Ulimit                 /* against the limit the user set */
    };
  }

  var RH_INDOOR = 50;                     /* per cent, fixed and stated */

  var DEFAULTS = {
    d: 0.30, lambda: 0.90, Rsi: 0.13, Rse: 0.04,
    Ti: 293.15, Te: 263.15, A: 25, Ulimit: 0.30
  };

  var state = JSON.parse(JSON.stringify(DEFAULTS));
  var last = null;

  /* ======================================================== 2. the interface */

  /* Seven languages, one call. Nothing else in this file is a string on screen. */
  function T(en, uk, de, nl, fr, es, pl) { return { en: en, uk: uk, de: de, nl: nl, fr: fr, es: es, pl: pl }; }

  /* The stage's legend, declared once. A language change rebuilds the shell and
     replays the furniture, but the framework cannot hand a tool back the NEW
     Stage object — so the tool re-points its own reference in on.rebuild. That
     is the one thing an imperative declaration still costs. */
  var stage = null;
  function LEGEND_ITEMS() {
    return [
      { label: T('Temperature','Температура','Temperatur','Temperatuur','Température','Temperatura','Temperatura'), series: 0 },
      { label: T('Dew point, ' + RH_INDOOR + ' % RH','Точка роси, ' + RH_INDOOR + ' % RH','Taupunkt, ' + RH_INDOOR + ' % rF','Dauwpunt, ' + RH_INDOOR + ' % RV','Point de rosée, ' + RH_INDOOR + ' % HR','Punto de rocío, ' + RH_INDOOR + ' % HR','Punkt rosy, ' + RH_INDOOR + ' % RH'),
        series: 1, dash: true }
    ];
  }
  function adoptStage(app) {
    stage = app.stages[0] || null;
    if (stage) stage.legend({ items: LEGEND_ITEMS() });
  }

  var ui = null;

  /* honest degradation: the one place the tool touches the document, and only
     because the framework that would render the message is absent. It does NOT
     return early — installData() runs on both paths, so the shared bar, the
     record, the export and the disclaimer survive. AUTHORING.md §1.3, §7.2. */
  function degrade() {
    document.title = 'diagram-ui.js v1 is required';
    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1');
    h.textContent = 'Flat wall heat loss';
    var p = document.createElement('p');
    p.textContent = 'The interactive interface could not load. The export, the calculation record '
                  + 'and the limitations are still available from the bar at the bottom of the page.';
    host.appendChild(h);
    host.appendChild(p);
    last = solve(state);
  }

  function boot() {
    if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1') buildInterface();
    else degrade();
    installData();
  }

      id: 'newtooltemplate',
      mount: '#app',
      layout: 'calculator',
      compute: 'live',
      state: state,
      defaults: DEFAULTS,
      subtitle: T('Steady one-dimensional series resistance',
                  'Усталений одновимірний послідовний опір',
                  'Stationärer eindimensionaler Reihenwiderstand',

                  'Résistances en série, régime permanent, 1-D',
                  'Resistencias en serie, régimen estacionario, 1-D',

                'Eine Lehrabschätzung für eine homogene Schicht. Ohne Wärmebrücken, Feuchte, Solareintrag und Speichermasse — kein Nachweis.',
                'Een lesvoorbeeld voor één homogene laag. Zonder koudebruggen, vocht, zoninstraling en massa — geen toetsing.',
                'Une estimation pédagogique pour une couche homogène. Sans ponts thermiques, humidité, apport solaire ni inertie — ce n’est pas une justification réglementaire.',
                'Una estimación docente para una capa homogénea. Sin puentes térmicos, humedad, ganancia solar ni inercia — no es una justificación normativa.',
                'Szacunek dydaktyczny dla jednej jednorodnej warstwy. Bez mostków cieplnych, wilgoci, zysków słonecznych i pojemności cieplnej — nie jest to obliczenie do wykazania zgodności z przepisami.')

        intro: {
          title: T('What this tool does', 'Що робить цей інструмент', 'Was dieses Werkzeug tut',

        topics: {

      }],

      /* footer notes are a string, not a <details> the tool builds */
      footer: T('R = d/λ, U = 1/(Rsi + R + Rse), q = U (Ti − Te). Steady state, one dimension, one homogeneous layer. No thermal bridges, no moisture, no solar gain, no thermal mass.',
                'R = d/λ, U = 1/(Rsi + R + Rse), q = U (Ti − Te). Усталений одновимірний режим, один однорідний шар.',
                'R = d/λ, U = 1/(Rsi + R + Rse), q = U (Ti − Te). Stationär, eindimensional, eine homogene Schicht.',
                'R = d/λ, U = 1/(Rsi + R + Rse), q = U (Ti − Te). Stationair, eendimensionaal, één homogene laag.',
                'R = d/λ, U = 1/(Rsi + R + Rse), q = U (Ti − Te). Régime permanent, 1-D, une couche homogène.',
                'R = d/λ, U = 1/(Rsi + R + Rse), q = U (Ti − Te). Régimen estacionario, 1-D, una capa homogénea.',
                'R = d/λ, U = 1/(Rsi + R + Rse), q = U (Ti − Te). Stan ustalony, jeden wymiar, jedna jednorodna warstwa.'),

      /* -------------------------------------------------------- the answer */
      on: {
        /* a language or unit change rebuilds the shell and replays the
           furniture; this is where a tool re-points the references it holds */
        rebuild: adoptStage,

        compute: function (s) {
          last = solve(s);
          var warm = last.Tsi - 273.15;
          var tone = last.ratio > 1 ? 'bad' : (last.ratio > 0.85 ? 'warn' : 'ok');
          if (stage) stage.schedule();
          return {
            verdict: {
              tone: tone,
              text: last.ratio > 1
                ? T('The wall is above the limit you set.','Стіна перевищує задану вами межу.','Die Wand liegt über Ihrem Grenzwert.','De wand ligt boven uw grenswaarde.','La paroi dépasse la limite que vous avez fixée.','El muro supera el límite que ha fijado.','Ściana przekracza ustaloną przez Ciebie wartość graniczną.')
                : T('The wall is within the limit you set.','Стіна в межах заданої вами межі.','Die Wand liegt innerhalb Ihres Grenzwerts.','De wand blijft binnen uw grenswaarde.','La paroi respecte la limite que vous avez fixée.','El muro cumple el límite que ha fijado.','Ściana mieści się w ustalonej przez Ciebie wartości granicznej.')
            },
            tiles: [
              { label: T('U-value','Коефіцієнт U','U-Wert','U-waarde','Coefficient U','Valor U','Współczynnik U'),
                value: last.U, hint: 'W/(m²·K)', precision: 3, tone: tone, learn: 'uvalue' },
              { label: T('Heat flux','Густина потоку','Wärmestromdichte','Warmtestroomdichtheid','Densité de flux','Densidad de flujo','Gęstość strumienia ciepła'),
                value: last.q, hint: 'W/m²', precision: 1, tone: tone },
              { label: T('Total resistance','Сумарний опір','Gesamtwiderstand','Totale weerstand','Résistance totale','Resistencia total','Opór całkowity'),
                value: last.Rtot, hint: 'm²·K/W', precision: 3 },
              { label: T('Inside surface','Внутрішня поверхня','Innenoberfläche','Binnenoppervlak','Surface intérieure','Superficie interior','Powierzchnia wewnętrzna'),
                value: warm, hint: '°C', precision: 1, learn: 'surfacetemp',
                tone: last.damp ? 'bad' : null, headline: false },
              { label: T('Heat flow, whole wall','Тепловий потік, уся стіна','Wärmestrom, ganze Wand','Warmtestroom, hele wand','Flux, paroi entière','Flujo, muro completo','Strumień ciepła, cała ściana'),
                value: last.Qwall, unit: 'W', precision: 0, headline: false }
            ],
            /* value against its own limit — the framework meter, not a track
               and a fill the tool styles itself */
            meters: [{
              label: T('U against your limit','U відносно вашої межі','U gegen Ihren Grenzwert','U tegen uw grenswaarde','U par rapport à votre limite','U frente a su límite','U względem Twojej granicy'),
              ratio: last.ratio,
              text: DiagramUI.fmt(last.U, { precision: 3 }) + ' / ' + DiagramUI.fmt(s.Ulimit, { precision: 2 }) + ' W/(m²·K)'
            }],
            tables: [{
              title: T('Where the resistance is','Де зосереджений опір','Wo der Widerstand sitzt','Waar de weerstand zit','Où se trouve la résistance','Dónde está la resistencia','Gdzie skupia się opór'),
              head: [T('Layer','Шар','Schicht','Laag','Couche','Capa','Warstwa'),
                     { label: 'm²·K/W', num: true },
                     { label: '%', num: true },
                     { label: T('Temperature drop','Перепад','Temperaturgefälle','Verval','Chute','Salto','Spadek temperatury'), num: true }],
              rows: [
                { cells: [T('Inside surface film','Внутрішня плівка','Innerer Übergang','Binnenovergang','Film intérieur','Película interior','Przejmowanie wewnętrzne'),
                          { value: state.Rsi, precision: 3 },
                          { value: 100 * state.Rsi / last.Rtot, precision: 1 },
                          { value: last.q * state.Rsi, precision: 1 }] },
                { cells: [T('Wall material','Матеріал стіни','Baustoff','Wandmateriaal','Matériau','Material','Materiał ściany'),
                          { value: last.Rlayer, precision: 3 },
                          { value: 100 * last.Rlayer / last.Rtot, precision: 1 },
                          { value: last.q * last.Rlayer, precision: 1 }],
                  chosen: last.Rlayer > state.Rsi + state.Rse },
                { cells: [T('Outside surface film','Зовнішня плівка','Äußerer Übergang','Buitenovergang','Film extérieur','Película exterior','Przejmowanie zewnętrzne'),
                          { value: state.Rse, precision: 3 },
                          { value: 100 * state.Rse / last.Rtot, precision: 1 },
                          { value: last.q * state.Rse, precision: 1 }] }
              ],
              foot: [T('Total','Разом','Summe','Totaal','Total','Total','Razem'),
                     { value: last.Rtot, precision: 3 },
                     { value: 100, precision: 0 },
                     { value: last.dT, precision: 1 }]
            }],
            notes: [last.damp
              ? T('The inside face runs at or below the dew point of ' + DiagramUI.fmt(last.dew, { precision: 1 }) + ' °C for ' + RH_INDOOR + ' % indoor humidity: this surface would wet.',
                  'Внутрішня поверхня на рівні точки роси або нижче: поверхня зволожуватиметься.',
                  'Die Innenoberfläche liegt auf oder unter dem Taupunkt: diese Fläche würde feucht.',
                  'Het binnenoppervlak ligt op of onder het dauwpunt: dit vlak zou nat worden.',
                  'La face intérieure est au point de rosée ou en dessous : cette surface se mouillerait.',
                  'La cara interior está en el punto de rocío o por debajo: esta superficie se humedecería.',
                  'Powierzchnia wewnętrzna jest na poziomie punktu rosy lub poniżej: powierzchnia ta uległaby zawilgoceniu.')
              : T('The inside face stays above the dew point of ' + DiagramUI.fmt(last.dew, { precision: 1 }) + ' °C for ' + RH_INDOOR + ' % indoor humidity.',
                  'Внутрішня поверхня лишається вище точки роси.',
                  'Die Innenoberfläche bleibt über dem Taupunkt.',
                  'Het binnenoppervlak blijft boven het dauwpunt.',
                  'La face intérieure reste au-dessus du point de rosée.',
                  'La cara interior se mantiene por encima del punto de rocío.',
                  'Powierzchnia wewnętrzna pozostaje powyżej punktu rosy.')]
          };
        }
      }
    });

    /* --------------------------------------------------- inputs footer row */
    /* Reset lives in the inputs footer, under that name, per the placement law.
       The shared bar exports; ui.importAction() is the framework's other half
       of it, so no tool hand-builds a hidden <input type="file"> again. */
    ui.panel({
      id: 'io',
      slot: 'inputs',
      actionsAlign: 'end',
      actions: [
        ui.importAction({
          label: T('Open a saved case…','Відкрити збережений випадок…','Gespeicherten Fall öffnen…','Opgeslagen geval openen…','Ouvrir un cas enregistré…','Abrir un caso guardado…','Otwórz zapisany przypadek…'),
          accept: '.json,application/json',
          as: 'json',
          run: function (data) {
            var src = (data && data.inputs) || data || {};
            Object.keys(DEFAULTS).forEach(function (k) {
              if (typeof src[k] === 'number' && isFinite(src[k])) state[k] = src[k];
            });
            ui.sync();
            ui.run();
          }
        }),
        ui.resetAction()
      ]
    });

    /* ------------------------------------------------------------ examples */
    /* Grouped, so the framework renders a grouped <select> with the selected
       entry's note and a Load button instead of a wall of buttons.
       `apply` PATCHES the state; the alternative key `state` REPLACES it whole
       (see UI_FRAMEWORK_SPEC §8.3), so a preset that touches two of eight
       inputs uses apply. */
    ui.examples([
      { group: T('Masonry','Мурування','Mauerwerk','Metselwerk','Maçonnerie','Fábrica','Mur'),
        label: T('Solid brick, 300 mm','Суцільна цегла, 300 мм','Vollziegel, 300 mm','Massieve baksteen, 300 mm','Brique pleine, 300 mm','Ladrillo macizo, 300 mm','Cegła pełna, 300 mm'),
        note: 'λ 0.80, d 300 mm', apply: function (t) { t.d = 0.30; t.lambda = 0.80; } },
      { group: T('Masonry','Мурування','Mauerwerk','Metselwerk','Maçonnerie','Fábrica','Mur'),
        label: T('Aerated concrete, 240 mm','Газобетон, 240 мм','Porenbeton, 240 mm','Cellenbeton, 240 mm','Béton cellulaire, 240 mm','Hormigón celular, 240 mm','Beton komórkowy, 240 mm'),
        note: 'λ 0.15, d 240 mm', apply: function (t) { t.d = 0.24; t.lambda = 0.15; } },
      { group: T('Concrete','Бетон','Beton','Beton','Béton','Hormigón','Beton'),
        label: T('Reinforced concrete, 200 mm','Залізобетон, 200 мм','Stahlbeton, 200 mm','Gewapend beton, 200 mm','Béton armé, 200 mm','Hormigón armado, 200 mm','Żelbet, 200 mm'),
        note: 'λ 2.30, d 200 mm', apply: function (t) { t.d = 0.20; t.lambda = 2.30; } },
      { group: T('Insulation','Утеплення','Dämmung','Isolatie','Isolation','Aislamiento','Izolacja'),
        label: T('Mineral wool, 150 mm','Мінеральна вата, 150 мм','Mineralwolle, 150 mm','Minerale wol, 150 mm','Laine minérale, 150 mm','Lana mineral, 150 mm','Wełna mineralna, 150 mm'),
        note: 'λ 0.035, d 150 mm', apply: function (t) { t.d = 0.15; t.lambda = 0.035; } },
      { group: T('Insulation','Утеплення','Dämmung','Isolatie','Isolation','Aislamiento','Izolacja'),
        label: T('Rigid foam, 80 mm','Жорсткий пінопласт, 80 мм','Hartschaum, 80 mm','Hardschuim, 80 mm','Mousse rigide, 80 mm','Espuma rígida, 80 mm','Sztywna pianka, 80 mm'),
        note: 'λ 0.024, d 80 mm', apply: function (t) { t.d = 0.08; t.lambda = 0.024; } }
    ]);

    /* --------------------------------------------------------- the drawing */
    /* The one thing the framework does not own: the tool's own data. Even here
       it owns the box, the sizing, the density, the caption and the legend. */
    ui.stage({
      caption: T('Temperature through the construction','Температура крізь конструкцію','Temperatur durch den Aufbau','Temperatuur door de opbouw','Température à travers la paroi','Temperatura a través del cerramiento','Temperatura w przekroju przegrody'),
      minHeight: 260,
      a11y: function () {
        if (!last) return '';
        return 'Temperature profile. Inside air ' + DiagramUI.fmt(state.Ti - 273.15, { precision: 1 }) +
               ' degrees Celsius, inside surface ' + DiagramUI.fmt(last.Tsi - 273.15, { precision: 1 }) +
               ', outside surface ' + DiagramUI.fmt(last.Tse - 273.15, { precision: 1 }) +
               ', outside air ' + DiagramUI.fmt(state.Te - 273.15, { precision: 1 }) + '.';
      },
      render: function (size, st) {
        var ctx = st.canvas(), w = size.w, h = size.h;
        var coarse = size.density === 'coarse';
        var pad = coarse ? 34 : 46, padR = 12, padT = 14, padB = coarse ? 26 : 32;
        var cs = getComputedStyle(document.documentElement);
        var muted = cs.getPropertyValue('--muted').trim() || '#777';
        var line = cs.getPropertyValue('--line').trim() || '#ddd';
        ctx.clearRect(0, 0, w, h);
        if (!last) return;

        /* x is thermal resistance, so each segment's width shows its share */
        var Rtot = last.Rtot;
        var xs = [0, state.Rsi, state.Rsi + last.Rlayer, Rtot];
        var ts = [state.Ti, last.Tsi, last.Tse, state.Te].map(function (k) { return k - 273.15; });
        var tmin = Math.min.apply(null, ts), tmax = Math.max.apply(null, ts);
        if (tmax - tmin < 1) { tmax += 0.5; tmin -= 0.5; }
        var X = function (r) { return pad + (w - pad - padR) * (r / Rtot); };
        var Y = function (t) { return h - padB - (h - padT - padB) * ((t - tmin) / (tmax - tmin)); };

        ctx.font = '400 12px ' + (cs.getPropertyValue('--font').trim() || 'sans-serif');
        ctx.strokeStyle = line; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(pad, padT); ctx.lineTo(pad, h - padB); ctx.lineTo(w - padR, h - padB); ctx.stroke();
        ctx.fillStyle = muted; ctx.textAlign = 'right';
        DiagramUI.ticks(tmin, tmax, h - padT - padB, size.density).forEach(function (t) {
          var y = Y(t);
          if (y < padT - 2 || y > h - padB + 2) return;
          ctx.beginPath(); ctx.moveTo(pad - 4, y); ctx.lineTo(pad, y); ctx.stroke();
          ctx.fillText(DiagramUI.fmt(t, { precision: 0 }) + '°', pad - 7, y + 4);
        });

        /* layer boundaries, then the profile, in framework series colours */
        ctx.setLineDash([3, 3]); ctx.strokeStyle = line;
        [1, 2].forEach(function (i) {
          ctx.beginPath(); ctx.moveTo(X(xs[i]), padT); ctx.lineTo(X(xs[i]), h - padB); ctx.stroke();
        });
        ctx.setLineDash([]);

        ctx.strokeStyle = DiagramUI.series(0); ctx.lineWidth = 2.5;
        ctx.beginPath();
        xs.forEach(function (r, i) { var x = X(r), y = Y(ts[i]); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
        ctx.stroke();
        ctx.fillStyle = DiagramUI.series(0);
        xs.forEach(function (r, i) { ctx.beginPath(); ctx.arc(X(r), Y(ts[i]), 3.5, 0, 6.2832); ctx.fill(); });

        /* the dew point of the indoor air, as a second series */
        var dew = last.dew;
        if (dew > tmin && dew < tmax) {
          ctx.strokeStyle = DiagramUI.series(1); ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);
          ctx.beginPath(); ctx.moveTo(pad, Y(dew)); ctx.lineTo(w - padR, Y(dew)); ctx.stroke();
          ctx.setLineDash([]);
        }
        ctx.textAlign = 'left'; ctx.fillStyle = muted;
        if (!coarse) ctx.fillText('R →', pad + 2, h - 8);
      }
    });
    adoptStage(ui);

    ui.ready();
    window.__newtool = { ui: ui, state: state, solve: solve };
  }

  /* ======================================================= 3. the data layer
     Unchanged from v2: diagram-common.js owns the permalink, the record, the
     report, the export and the handoff. The UI layer never touches them.
     Called UNCONDITIONALLY from boot(), on both paths. */
  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'newtooltemplate',
        file: 'NEW_TOOL_TEMPLATE.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: function () {
          if (!last) return null;
          return {
            inputs: { d: state.d, lambda: state.lambda, Rsi: state.Rsi, Rse: state.Rse,
                      Ti: state.Ti, Te: state.Te, A: state.A, Ulimit: state.Ulimit },
            outputs: { U: last.U, q: last.q, R_total: last.Rtot, T_si: last.Tsi,
                       T_se: last.Tse, Q_wall: last.Qwall },
            units: { d: 'm', lambda: 'W/(m K)', Rsi: 'm2K/W', Rse: 'm2K/W', Ti: 'K', Te: 'K',
                     A: 'm2', Ulimit: 'W/(m2 K)', U: 'W/(m2 K)', q: 'W/m2', R_total: 'm2K/W',
                     T_si: 'K', T_se: 'K', Q_wall: 'W' },
            model: {
              equations: ['R = d / lambda', 'U = 1 / (Rsi + R + Rse)', 'q = U (Ti - Te)',
                          'T_si = Ti - q Rsi'],
              ranges: ['steady state, one dimension, one homogeneous layer'],
              notes: ['template tool for the v3 UI framework; no independent validation']
            },
            warnings: last.ratio > 1 ? ['U is above the limit set by the user'] : []
          };
        },
        /* The handoff vocabulary is fixed (FRAMEWORK_V2_SPEC §1.5): a tool
           may only offer and accept names from it. T arriving from another
           tool is read as the outside design air temperature. */
        handoff: {
          provides: ['U', 'Q', 'A'],
          accepts: ['T', 'A'],
          build: function () {
            if (!last) return null;
            return { quantities: {
              U: { value: last.U, unit: 'W/(m2 K)' },
              Q: { value: last.Qwall, unit: 'W' },
              A: { value: state.A, unit: 'm2' } } };
          },
          apply: function (p) {
            var q = p && p.quantities || {};
            if (q.T) state.Te = q.T.value;
            if (q.A) state.A = q.A.value;
            last = solve(state);
            if (ui) { ui.sync(); ui.run(); }
          }
        }
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
