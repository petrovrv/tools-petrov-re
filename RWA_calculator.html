  "limitations": {
    "en": "Indicative interpretation of selected requirements only; it is not a complete fire-engineering design, code-compliance assessment, CFD study or approval by the competent authority. The text of NBN S 21-208-1 was not available when this page was benchmarked, so its fire tables, sprinkler temperature caps, ventilator limits (1.4 db², L ≤ min(db,3) m, spacing ≥ 3 db), the 60 m reservoir length and the 3 % geometric variant are unverified transcriptions of the original workbook. Two figures are conservative or contested and are shown as such: the air inlet for mechanical extraction is sized on the hot extract volume flow rather than on a mass balance of the incoming air, which is about a factor Tc/T0 larger, and the plugholing coefficient is 2 where BR258 gives 1.3 near a wall and 1.8 away from one. With sprinklers of known operating temperature the smoke temperature is an averaged expression in which Tc − T0 is no longer the temperature rise θ used in the vent equation; the two are not thermodynamically consistent and the vent area can differ by tens of per cent from a pure buoyancy balance. The interface itself is available in Dutch, French and English only.",
    "nl": "Alleen indicatieve interpretatie van geselecteerde eisen; geen volledig brandveiligheidsontwerp, conformiteitsbeoordeling, CFD-studie of goedkeuring door de bevoegde instantie. De tekst van NBN S 21-208-1 was bij het benchmarken niet beschikbaar; de vuurhaardtabellen, de sprinklerplafonds, de verluchtergrenzen (1,4·db², L ≤ min(db,3) m, afstand ≥ 3·db), de rookvaklengte van 60 m en de 3%-geometrische variant zijn dus ongeverifieerde overnames uit het oorspronkelijke rekenblad. Twee waarden zijn conservatief of betwist en worden als zodanig getoond: de luchttoevoer bij mechanische afvoer is gedimensioneerd op het warme afvoerdebiet in plaats van op een massabalans van de toegevoerde lucht — ongeveer een factor Tc/T0 groter — en de plugholing-coëfficiënt is 2 waar BR258 1,3 bij een wand en 1,8 vrij van een wand geeft. Bij sprinklers met bekende aanspreektemperatuur is de rookgastemperatuur een gemiddelde uitdrukking waarin Tc − T0 niet langer het temperatuurverschil θ uit de verluchtervergelijking is; beide zijn thermodynamisch niet consistent en het verluchteroppervlak kan tientallen procenten afwijken van een zuivere drukbalans. De interface zelf bestaat alleen in het Nederlands, Frans en Engels.",
    "fr": "Interprétation indicative de certaines exigences uniquement ; ne constitue ni une étude complète de sécurité incendie, ni une vérification réglementaire, ni une CFD, ni une approbation de l'autorité compétente. Le texte de la NBN S 21-208-1 n'était pas disponible lors de la mise au banc : ses tables de foyer, les plafonds de température des sprinklers, les limites d'exutoire (1,4·db², L ≤ min(db,3) m, entraxe ≥ 3·db), la longueur de compartiment de 60 m et la variante géométrique des 3 % sont donc des reprises non vérifiées du tableur d'origine. Deux valeurs sont conservatives ou contestées et sont présentées comme telles : l'amenée d'air en extraction mécanique est dimensionnée sur le débit volumique chaud extrait plutôt que sur un bilan massique de l'air entrant — environ un facteur Tc/T0 de plus — et le coefficient de plugholing vaut 2 là où le BR258 donne 1,3 près d'une paroi et 1,8 à distance. Avec des sprinklers de température connue, la température des fumées est une expression moyennée dans laquelle Tc − T0 n'est plus l'écart θ utilisé dans l'équation des exutoires ; les deux ne sont pas cohérents thermodynamiquement et la surface peut s'écarter de plusieurs dizaines de pour cent d'un bilan de flottabilité pur. L'interface elle-même n'existe qu'en néerlandais, français et anglais.",
    "uk": "Лише орієнтовне тлумачення окремих вимог; це не повний протипожежний проєкт, оцінка відповідності, CFD-дослідження чи погодження компетентного органу. Текст NBN S 21-208-1 під час перевірки був недоступний, тож його таблиці вогнища, обмеження за температурою спринклерів, ліміти люків (1,4·db², L ≤ min(db,3) м, крок ≥ 3·db), довжина відсіку 60 м і 3-відсотковий геометричний варіант — неперевірені перенесення з початкової таблиці. Дві величини є консервативними або спірними і показані як такі: приток повітря при механічному видаленні розрахований за гарячою об'ємною витратою видалення, а не за балансом маси припливного повітря — приблизно у Tc/T0 разів більше, — а коефіцієнт plugholing дорівнює 2, тоді як BR258 дає 1,3 біля стіни і 1,8 віддалік. За спринклерів із відомою температурою спрацювання температура диму — усереднений вираз, у якому Tc − T0 уже не дорівнює перепаду θ з рівняння люків; вони термодинамічно неузгоджені, і площа може відрізнятися на десятки відсотків від чистого балансу плавучості. Сам інтерфейс доступний лише нідерландською, французькою та англійською.",
    "de": "Nur orientierende Auslegung ausgewählter Anforderungen; keine vollständige Brandschutzplanung, Konformitätsbewertung, CFD-Studie oder behördliche Genehmigung. Der Text der NBN S 21-208-1 war beim Benchmarken nicht verfügbar; ihre Brandtabellen, die Sprinkler-Temperaturdeckelungen, die Abzugsgrenzen (1,4·db², L ≤ min(db,3) m, Abstand ≥ 3·db), die Rauchabschnittslänge von 60 m und die geometrische 3-%-Variante sind daher ungeprüfte Übernahmen aus dem Ursprungsblatt. Zwei Werte sind konservativ oder strittig und werden so ausgewiesen: die Zuluft bei maschineller Absaugung wird auf den heißen Abluftvolumenstrom statt auf eine Massenbilanz der einströmenden Luft ausgelegt — rund um den Faktor Tc/T0 größer — und der Plugholing-Koeffizient beträgt 2, während BR258 1,3 wandnah und 1,8 wandfern angibt. Bei Sprinklern mit bekannter Auslösetemperatur ist die Rauchgastemperatur ein Mittelwertausdruck, in dem Tc − T0 nicht mehr die in der Abzugsgleichung verwendete Übertemperatur θ ist; beide sind thermodynamisch nicht konsistent und die Fläche kann um Zehnerprozente von einer reinen Auftriebsbilanz abweichen. Die Oberfläche selbst gibt es nur auf Niederländisch, Französisch und Englisch.",
    "es": "Interpretación indicativa de requisitos seleccionados; no constituye diseño completo de seguridad contra incendios, evaluación de cumplimiento, estudio CFD ni aprobación de la autoridad competente. El texto de la NBN S 21-208-1 no estuvo disponible al contrastar esta página, por lo que sus tablas de foco, los topes de temperatura de rociadores, los límites de exutorio (1,4·db², L ≤ min(db,3) m, separación ≥ 3·db), la longitud de compartimento de 60 m y la variante geométrica del 3 % son transcripciones no verificadas de la hoja original. Dos valores son conservadores o discutidos y se muestran como tales: la admisión de aire en extracción mecánica se dimensiona con el caudal volumétrico caliente extraído y no con un balance de masa del aire entrante — unas Tc/T0 veces mayor — y el coeficiente de plugholing es 2 donde el BR258 da 1,3 junto a una pared y 1,8 alejado. Con rociadores de temperatura conocida, la temperatura de humos es una expresión promediada en la que Tc − T0 ya no es el salto θ usado en la ecuación de exutorios; ambos no son termodinámicamente coherentes y la superficie puede diferir en decenas por ciento de un balance de flotabilidad puro. La interfaz solo está disponible en neerlandés, francés e inglés.",
    "pl": "Orientacyjna interpretacja wybranych wymagań; nie jest to kompletny projekt inżynierii pożarowej, ocena zgodności z przepisami, studium CFD ani zatwierdzenie przez właściwy organ. Tekst normy NBN S 21-208-1 nie był dostępny w momencie analizy porównawczej tej strony, dlatego tabele pożarowe, maksymalne temperatury tryskaczy, limity wentylatorów (1,4 db², L ≤ min(db,3) m, rozstaw ≥ 3 db), długość zbiornika 60 m i wariant geometryczny 3% są niezweryfikowanymi transkrypcjami oryginalnego skoroszytu. Dwie liczby są konserwatywne lub kwestionowane i są pokazane jako takie: wlot powietrza do mechanicznego wyciągu jest dobierany na podstawie objętościowego przepływu gorącego wyciągu, a nie na podstawie bilansu masowego powietrza napływającego, który jest około czynnika Tc/T0 większy, a współczynnik wypływu wynosi 2, gdzie BR258 daje 1,3 w pobliżu ściany i 1,8 z dala od niej. W przypadku tryskaczy o znanej temperaturze roboczej temperatura dymu jest uśrednionym wyrażeniem, w którym Tc − T0 nie jest już wzrostem temperatury θ używanym w równaniu odpowietrzania; te dwa parametry nie są spójne termodynamicznie, a powierzchnia odpowietrzania może różnić się o dziesiątki procent od czystej równowagi pływalności. Sam interfejs jest dostępny tylko w języku niderlandzkim, francuskim i angielskim."

  "validation": {
    "basis": {
      "en": "45 of 45 benchmark entries pass, 9 of them carrying flagged items. NBN S 21-208-1 itself is a paid national standard whose text could not be obtained, so nothing is graded against it. What is graded: the large-fire plume Mf = 0.188 P Y^1.5 against its published form (BRE BR258), the natural-ventilator area against a first-principles derivation of the two-orifice buoyancy balance solved both in closed form and by a scipy root find on the mass balance (the two agree to 8e-16), the ideal-gas smoke volume flow, the 5 m/s inlet limit and inlet-not-below-extract rule from the Smoke Control Association guidance, the 2 % simplified rule and its conditions, and the arithmetic and internal consistency of everything else. The standard's fire tables, sprinkler caps, ventilator limits and the plugholing coefficient are recorded as not benchmarked. The harness is the author's own; no external party has reviewed it.",
      "nl": "45 van 45 benchmarkregels slagen, 9 daarvan met gemarkeerde punten. NBN S 21-208-1 is zelf een betalende nationale norm waarvan de tekst niet kon worden verkregen; er wordt dus niets aan die norm getoetst. Wel getoetst: de pluim voor een grote brand Mf = 0,188·P·Y^1,5 aan haar gepubliceerde vorm (BRE BR258), het aerodynamische verluchteroppervlak aan een van nul af opgebouwde afleiding van de tweeopeningen-drukbalans, opgelost zowel in gesloten vorm als met een scipy-nulpuntzoeker op de massabalans (onderling 8e-16), het ideale-gasrookdebiet, de grens van 5 m/s op de toevoer en de regel dat de toevoer niet kleiner mag zijn dan de afvoer (SCA-richtlijn), de vereenvoudigde 2%-regel met haar voorwaarden, en de rekenkunde en interne consistentie van al de rest. De vuurhaardtabellen, sprinklerplafonds, verluchtergrenzen en de plugholing-coëfficiënt van de norm staan als niet-getoetst genoteerd. De testbank is van de auteur zelf; er was geen externe review.",
      "fr": "45 entrées de banc d'essai sur 45 réussissent, dont 9 portent des points signalés. La NBN S 21-208-1 est une norme nationale payante dont le texte n'a pas pu être obtenu ; rien n'est donc vérifié par rapport à elle. Sont vérifiés : le panache de grand feu Mf = 0,188·P·Y^1,5 face à sa forme publiée (BRE BR258), la surface aérodynamique des exutoires face à une dérivation reconstruite du bilan de pression à deux orifices, résolue en forme fermée et par une recherche de racine scipy sur le bilan de masse (accord 8e-16), le débit volumique de fumée en gaz parfait, la limite d'amenée d'air de 5 m/s et la règle amenée >= extraction (guide SCA), la règle simplifiée des 2 % et ses conditions, ainsi que l'arithmétique et la cohérence interne de tout le reste. Les tables de foyer, les plafonds sprinklers, les limites d'exutoire et le coefficient de plugholing de la norme sont notés comme non testés. Le banc est celui de l'auteur ; aucun tiers ne l'a examiné.",
      "de": "45 von 45 Benchmark-Einträgen bestanden, 9 davon mit markierten Punkten. NBN S 21-208-1 ist eine kostenpflichtige nationale Norm, deren Text nicht beschafft werden konnte; es wird daher nichts gegen sie geprüft. Geprüft werden: die Großbrandfahne Mf = 0,188·P·Y^1,5 gegen ihre veröffentlichte Form (BRE BR258), die aerodynamische Abzugsfläche gegen eine neu hergeleitete Zweiöffnungs-Druckbilanz, gelöst geschlossen und über eine scipy-Nullstellensuche der Massenbilanz (Übereinstimmung 8e-16), der ideale Rauchvolumenstrom, die 5-m/s-Zuluftgrenze und die Regel Zuluft >= Abluft (SCA-Leitfaden), die vereinfachte 2-%-Regel mit ihren Bedingungen sowie Arithmetik und innere Konsistenz von allem Übrigen. Brandtabellen, Sprinklerdeckelungen, Abzugsgrenzen und der Plugholing-Koeffizient der Norm sind als nicht geprüft vermerkt. Der Prüfstand stammt vom Autor; eine externe Prüfung fand nicht statt.",
      "uk": "45 із 45 записів еталонного тесту пройдено, 9 із них містять позначені пункти. NBN S 21-208-1 — платний національний стандарт, текст якого отримати не вдалося, тож жодна перевірка проти нього не заявляється. Перевірено: факел великої пожежі Mf = 0,188·P·Y^1,5 проти опублікованої форми (BRE BR258), аеродинамічну площу люків проти самостійно виведеного балансу двох отворів, розв'язаного і в замкненій формі, і пошуком кореня scipy за балансом маси (збіг 8e-16), об'ємну витрату диму за ідеальним газом, межу 5 м/с на притоку та правило «приток не менший за витяжку» (настанова SCA), спрощене правило 2 % з умовами, а також арифметику й внутрішню узгодженість решти. Таблиці вогнища, спринклерні обмеження, ліміти люків і коефіцієнт plugholing зі стандарту записані як неперевірені. Стенд авторський; сторонньої перевірки не було.",
      "es": "45 de 45 entradas del banco de pruebas pasan, 9 de ellas con puntos señalados. La NBN S 21-208-1 es una norma nacional de pago cuyo texto no pudo obtenerse, por lo que nada se contrasta con ella. Sí se contrastan: el penacho de gran incendio Mf = 0,188·P·Y^1,5 frente a su forma publicada (BRE BR258), la superficie aerodinámica de exutorios frente a una derivación propia del balance de presión de dos orificios, resuelta en forma cerrada y con una búsqueda de raíz de scipy sobre el balance de masa (acuerdo 8e-16), el caudal volumétrico de humos como gas ideal, el límite de 5 m/s en la admisión y la regla admisión >= extracción (guía SCA), la regla simplificada del 2 % y sus condiciones, y la aritmética y coherencia interna de todo lo demás. Las tablas de foco, los topes de rociadores, los límites de exutorio y el coeficiente de plugholing de la norma constan como no contrastados. El banco es del propio autor; ningún tercero lo ha revisado.",
      "pl": "45 z 45 przypadków porównawczych przechodzi pozytywnie, 9 z nich zawiera elementy oznaczone flagą. Norma NBN S 21-208-1 sama w sobie jest płatną normą krajową, której tekstu nie udało się uzyskać, więc nic nie jest oceniane w porównaniu z nią. Co jest oceniane: duży pióropusz pożaru Mf = 0,188 P Y^1,5 w porównaniu z opublikowaną formą (BRE BR258), powierzchnia wentylacji naturalnej w porównaniu z wyprowadzeniem równowagi pływalności dwuotworowej metodą pierwszych zasad, rozwiązanym zarówno w formie zamkniętej, jak i poprzez znalezienie pierwiastka SciPy w bilansie masowym (oba równania są zgodne z 8e-16), przepływ objętości dymu gazu doskonałego, limit wlotu 5 m/s i reguła wlotu nie poniżej wyciągu z wytycznych Smoke Control Association, uproszczona reguła 2% i jej warunki oraz arytmetyczna i wewnętrzna spójność wszystkich pozostałych elementów. Tabele pożarowe normy, nasadki tryskaczowe, limity wentylatorów i współczynnik wypływu są rejestrowane jako niepoddane testowi. Zestaw testowy został przygotowany przez autora i nie został poddany przeglądowi przez niezależną stronę trzecią."

        "citations": [

<script>
// RWA calculation engine — NBN S 21-208-1 (+ KB Annex 6, 2%/3%)
// Ported faithfully from the original Excel/VBA workbook (Kingspan Light & Air).
// Pure functions, no DOM. Used both by the web app and the node test harness.

const RWA = (function () {
  "use strict";

  // ---- constants ----
  const RHO = 1.225;      // air mass density kg/m³ (Luchtdichtheid)
  const G = 9.81;         // gravity m/s² (Zwartekracht)
  const CE = 0.188;       // large-fire plume coefficient (Mf = Ce·Wf·Y^1.5)
  const TC_MAX = 573.15;  // max smoke gas temperature K (300°C)
  const V_INLET_MAX = 5;  // max inlet air velocity m/s (mechanical)

  function num(x) { return (x === "" || x === null || x === undefined || isNaN(x)) ? 0 : Number(x); }

  // ---------- FIRE GEOMETRY (Af, Wf, alpha, kh) ----------
  // Guided per §4.1 (low pile usage categories) and §4.2.x (high stack),
  // faithfully following VBA Subs HaardHoog / DefineHoogLaag / KritischeHoogte.
  // usageCat: 1..4 ; returns {Af, Wf, alpha, kh}
  function fireLowPile(usageCat) {
    switch (usageCat) {
      case 1: return { kh: 4,   B: 3,   Af: 9,   Wf: 12,  alpha: 0.8 }; // 3x3
      case 2: return { kh: 3,   B: 4.5, Af: 20,  Wf: 18,  alpha: 0.8 }; // 4.5x4.5, Af fixed 20
      case 3: return { kh: 2.1, B: 6,   Af: 36,  Wf: 24,  alpha: 0.8 }; // 6x6
      case 4: return { kh: 1.2, B: 9,   Af: 81,  Wf: 36,  alpha: 0.8 }; // 9x9
      default: return null;
    }
  }

  // §4.2.1 racks WITH sprinklers ; §4.2.2 racks without.
  // VBA HaardHoog "4.2.1." : Af,Wf from Reekb + x, x = 0.18*hst
  //   inrekken(in racks):  Af = 2/3*hst*(Reekb + x), Wf = Reekb + 4x, alpha 0.5
  //   onderdak(under roof):Af = 4/3*hst*(Reekb + x), Wf = 2*(Reekb + 4x), alpha 0.8
  //   Geen(none):          9x9, alpha 0.8
  // then clamp: Af in [9,81], Wf in [12,36] (only when sprinklered 4.2.1)
  function fireRack(hst, reekb, sprinklers) {
    const x = 0.18 * hst;
    let Af, Wf, alpha;
    if (sprinklers === "inrekken") {
      Af = 2 / 3 * hst * (reekb + x); Wf = reekb + 4 * x; alpha = 0.5;
    } else if (sprinklers === "onderdak") {
      Af = 4 / 3 * hst * (reekb + x); Wf = 2 * (reekb + 4 * x); alpha = 0.8;
    } else { // geen
      Af = 81; Wf = 36; alpha = 0.8;
    }
    if (sprinklers !== "geen") {
      if (Af < 9) Af = 9; if (Wf < 12) Wf = 12;
      if (Af > 81) Af = 81; if (Wf > 36) Wf = 36;
    }
    return { Af, Wf, alpha, kh: 4 };
  }

  // §4.2.3 bulk stacking (opeenstapeling). VBA case "4.2.3." with l_423_o
  function fireBulk(hst, sprinklers) {
    let Af = 0, Wf = 0, B = 0, alpha;
    if (sprinklers === "geen") {
      alpha = 0.8;
      if (hst <= 3) { Af = 81; Wf = 36; B = 9; }
      else { Af = 0; Wf = 0; }
    } else {
      alpha = (sprinklers === "inrekken") ? 0.5 : 0.8;
      if (hst <= 3) { Af = 36; Wf = 24; B = 6; }
      else if (hst <= 4) { Af = 81; Wf = 36; B = 9; }
      else { Af = 0; Wf = 0; }
    }
    return { Af, Wf, B, alpha, kh: 4 };
  }

  // ---------- FUEL POWER (qf) ----------
  // VuurhaardVermogen: general => 250 (natural) / 500 (mechanical) kW/m².
  // material => qf * hst / hRef  (scaled to stacking height), from materials table.
  function fuelPower(materialQf, materialH, hst, natural, isGeneral) {
    if (isGeneral) return natural ? 250 : 500;
    if (materialH && materialH > 0) return materialQf * hst / materialH;
    return materialQf;
  }

  // ---------- TEMPERATURES ----------
  // theta (Verschiltemperatuur) = Qc / Mf ; with sprinkler cap.
  function tempDiff(Qc, Mf, sprinklered, sprinklerTemp, tAmb, natural, neglectSprinklers) {
    if (Qc === 0 || Mf === 0) return 0;
    if (natural && neglectSprinklers) {
      if (!sprinklered || sprinklerTemp === null) return Qc / Mf;
      const teta1 = 1.5 * sprinklerTemp - tAmb;
      const teta2 = Qc / Mf;
      return Math.min(teta1, teta2);
    }
    return Qc / Mf;
  }

  // Rookgastemperatuur Tc (K)
  function smokeTemp(T0K, theta, sprinklered, sprinklerTemp, tAmb, natural) {
    if (theta === 0) return 0;
    if (sprinklered && sprinklerTemp !== null) {
      // averaged model (VBA DefineRookgastemperatuur, known sprinkler temp)
      return (sprinklerTemp + tAmb + theta) / 2 + 273.15;
    }
    return T0K + theta;
  }

  // ---------- NATURAL extraction area ----------
  // Value of AvCv when the aerodynamic inlet equals the aerodynamic outlet (Sk = 1).
  // This is NOT the unconstrained minimum (that would be the Sk -> 0 limit); it is the
  // area that goes with the guidance "the aerodynamic inlet area should be at least equal
  // to the aerodynamic extract area", and it is what the inlet is then sized on.
  function aopmin(Mf, T0K, Tc, db, theta) {
    const denom = 2 * G * db * theta * T0K;
    if (denom === 0) return 0;
    return Mf / RHO * Math.sqrt((Tc * Tc + T0K * Tc) / denom);
  }
  // aop(AiCi) — the same relation solved in closed form.
  // AvCv = (Mf/rho) sqrt((Tc^2 + Sk^2 T0 Tc)/(2 g db theta T0)) with Sk = AvCv/AiCi is a
  // quadratic in AvCv:  AvCv^2 (1 - K T0 Tc/AiCi^2) = K Tc^2,  K = (Mf/rho)^2/(2 g db theta T0).
  // The original fixed-point loop stopped at an absolute residual of 1e-3 m^2 and returned 0
  // after 200 sweeps; the closed form is exact and refuses only when there is genuinely no
  // steady solution (the inlet is so small that Sk would exceed 1).
  function aop(AiCi, Mf, T0K, Tc, db, theta) {
    const denom = 2 * G * db * theta * T0K;
    if (denom === 0 || !(AiCi > 0)) return 0;
    const K = Math.pow(Mf / RHO, 2) / denom;
    const d = 1 - K * T0K * Tc / (AiCi * AiCi);
    if (d <= 0) return 0;                       // no steady solution: inlet too small
    const acv = Tc * Math.sqrt(K / d);
    if (acv > AiCi * (1 + 1e-12)) return 0;     // Sk > 1
    return acv;
  }

  // ============ MAIN COMPUTE ============
  // inp: normalized input object (see defaults()).
  function compute(inp, hatch) {
    const R = { ok: false, errors: [], warns: [], out: {}, checks: [] };
    const o = R.out;
    const natural = inp.method === "natural";
    o.natural = natural;

    // ----- geometry -----
    if (hatch) {
      const meshF = hatch.mesh === "insect" ? 0.85 : hatch.mesh === "bird" ? 0.95 : 1.0;
      R.out.hatchAvCv1 = num(hatch.w) * num(hatch.l) * num(hatch.cv) * meshF;
    }
    const hc = num(inp.hc);
    const area = num(inp.area);
    const nRes = Math.max(1, num(inp.reservoirs) || 1);
    o.area = area;
    o.reservoirs = nRes;

    // smoke-free height Y and layer db
    let Y = num(inp.Y);
    if (hc > 2) {
      // db = hc - Y
      o.db = hc - Y;
    } else { o.db = 0; }
    o.Y = Y;
    o.hc = hc;
    const db = o.db;
    o.AvCvKrit = db > 0 ? db * db * 1.4 : 0;   // 1.4·db²
    o.Lmax = db > 0 ? Math.min(db, 3) : 3;
    o.Dmin = db > 0 ? db * 3 : 0;

    // ---- simplified methods 2% / 3% ----
    if (inp.buildingType === "2pct" || inp.buildingType === "3pct") {
      const factor = inp.buildingType === "2pct" ? 0.02 : 0.03;
      // applicability (IsEenvoudig)
      const poort = num(inp.poort), hst = num(inp.hst);
      const glen = num(inp.glen), gbre = num(inp.gbre);
      let applicable = area <= 2000 && glen <= 60 && gbre <= 60 &&
        poort <= 0.7 * hc && hst <= 0.7 * hc && nRes === 1 && natural;
      o.simplified = true;
      o.simplifiedPct = factor * 100;
      o.AvCv = factor * area;
      o.required = o.AvCv;
      o.applicable = applicable;
      if (!applicable) R.warns.push("simplified_na");
      o.Mf = null;
      R.ok = true;
      buildChecks(R, inp, o, natural);
      return R;
    }

    // ---- detailed method (natural / mechanical) ----
    // fire geometry
    let fg = resolveFire(inp, natural);
    if (!fg) { R.errors.push("no_fire"); return R; }
    o.Af = fg.Af; o.Wf = fg.Wf; o.alpha = fg.alpha; o.kh = fg.kh;
    o.B = fg.B;

    if (o.Af <= 0 || o.Wf <= 0) { R.errors.push("fire_zero"); return R; }
    if (Y <= 0) { R.errors.push("no_Y"); return R; }
    if (db <= 0) { R.errors.push("no_db"); return R; }

    // fuel power qf  (HS quick mode uses general power, no sprinklers)
    const hst = num(inp.hst);
    const isGeneral = inp.buildingType === "hs" ? true : inp.materialGeneral;
    const qf = fuelPower(num(inp.materialQf), num(inp.materialH), hst, natural, isGeneral);
    o.qf = qf;

    // smoke mass flow  Mf = 0.188·Wf·Y^1.5
    const Mf = CE * o.Wf * Math.pow(Y, 1.5);
    o.Mf = Mf;

    // convective heat Qc = alpha·qf·Af
    const Qc = o.alpha * qf * o.Af;
    o.Qc = Qc;

    // temperatures
    const tAmb = num(inp.tAmb);
    const T0K = tAmb + 273.15;
    o.tAmb = tAmb; o.T0K = T0K;
    const sprinklered = inp.sprinklers && inp.sprinklers !== "geen";
    const sprTemp = inp.sprinklerTemp ? parseFloat(String(inp.sprinklerTemp).split("-")[0]) : null;

    const theta = tempDiff(Qc, Mf, sprinklered, sprTemp, tAmb,
      natural, inp.neglectSprinklers !== false);
    o.theta = theta;
    if (theta <= 0) { R.errors.push("theta"); return R; }

    const Tc = smokeTemp(T0K, theta, sprinklered, sprTemp, tAmb, natural);
    o.Tc = Tc;
    o.TcC = Tc - 273.15;
    if (Tc > TC_MAX) { R.warns.push("tc_high"); }

    const Ci = num(inp.Ci) || 0.5;
    o.Ci = Ci;

    if (natural) {
      // required AvCv per reservoir with inlet iteration (VBA Core / AvCvIterate)
      let AvCvMin = aopmin(Mf, T0K, Tc, db, theta);
      let AiCi, AerOpp;
      if (nRes > 1) {
        // multi reservoir: inlet via other reservoirs' openings, converge
        let Ai = num(inp.Ai); // supplementary geometric inlet
        AiCi = Ai * Ci + (nRes - 1) * AvCvMin;
        AerOpp = aop(AiCi, Mf, T0K, Tc, db, theta);
        // outer fixed point: the inlet of one reservoir is the supplementary inlet plus the
        // vents of the other reservoirs. Converged to 1e-13 relative, not 1e-4 absolute.
        let guard = 0;
        do {
          const prev = AerOpp;
          AiCi = Ai * Ci + (nRes - 1) * AerOpp;
          AerOpp = aop(AiCi, Mf, T0K, Tc, db, theta);
          if (!(AerOpp > 0)) break;
          if (Math.abs(prev - AerOpp) <= 1e-13 * AerOpp) break;
        } while (++guard < 500);
        o.AiViOther = (nRes - 1) * AerOpp;
      } else {
        // single reservoir: inlet = existing inlet area × Ci, min = AvCvMin
        let Ai = num(inp.Ai);
        AiCi = Ai * Ci;
        if (AiCi <= AvCvMin) { AiCi = AvCvMin; Ai = AiCi / Ci; }
        AerOpp = aop(AiCi, Mf, T0K, Tc, db, theta);
        o.inletMin = AvCvMin;
        o.Ai = Ai;
      }
      // outer fixed point (AvCvIterate) — recompute once against updated AiCi
      o.AiCi = AiCi;
      if (!(AerOpp > 0)) R.warns.push("inlet_iter");
      o.AvCv = AerOpp > 0 ? AerOpp : AvCvMin;
      o.AvCvMin = AvCvMin;
      o.required = o.AvCv;
    } else {
      // mechanical
      const V = Mf / RHO * Tc / T0K;               // volumetric smoke flow m³/s
      let Vcrit = 2 / Tc * Math.sqrt(G * Math.pow(db, 5) * T0K * (Tc - T0K));
      if (Vcrit > V) Vcrit = V;
      o.V = V;
      o.Vcrit = Vcrit;
      // Volume flow of the make-up air itself: the extracted mass flow at ambient density.
      // It is smaller than the hot smoke volume flow V by the factor T0/Tc.
      o.Vinlet = Mf / RHO;
      // The inlet is sized on the HOT extract volume flow, the conservative reading: it
      // gives Tc/T0 (roughly a factor two) more inlet area than a mass balance on the
      // incoming air alone. Both figures are reported so the basis is visible.
      o.inletArea = V === 0 ? 0 : V / V_INLET_MAX / Ci; // Ai
      o.inletAreaMassBalance = V === 0 ? 0 : o.Vinlet / V_INLET_MAX / Ci;
      o.AiCi = o.inletArea * Ci;
      o.required = V;   // deliverable = extraction volume flow
    }

    R.ok = true;
    buildChecks(R, inp, o, natural);
    return R;
  }

  // resolve fire geometry from inputs (guided or manual)
  function resolveFire(inp, natural) {
    // HS w/o sprinklers quick mode: fixed fire per VBA LazySprinlkers
    if (inp.buildingType === "hs") return { Af: 81, Wf: 36, alpha: 0.8, kh: 4, B: 9 };
    if (inp.fireMode === "manual") {
      return { Af: num(inp.Af), Wf: num(inp.Wf), alpha: num(inp.alpha) || 0.8, kh: null, B: null };
    }
    const hst = num(inp.hst);
    const reekb = num(inp.reekb) || 1.5;
    const spr = inp.sprinklers || "geen";
    switch (inp.fireScenario) {
      case "low1": return fireLowPile(1);
      case "low2": return fireLowPile(2);
      case "low3": return fireLowPile(3);
      case "low4": return fireLowPile(4);
      case "rack": return fireRack(hst, reekb, spr);
      case "bulk": return fireBulk(hst, spr);
      default: return fireLowPile(1);
    }
  }

  // ---------- HATCH (device) approximate sizing ----------
  // Generic, brand-agnostic. hatch geometric area Ag (m²), Cv coefficient, mesh factor.
  // meshFactor: none 1, bird 0.95, insect 0.85.
  function hatchSizing(o, hatch) {
    const res = {};
    if (!o.natural) return null; // sizing is for natural extraction
    const Ag = num(hatch.w) * num(hatch.l);       // geometric m²
    const mesh = hatch.mesh === "insect" ? 0.85 : hatch.mesh === "bird" ? 0.95 : 1.0;
    const AvCv1 = Ag * num(hatch.cv) * mesh;      // aerodynamic per hatch
    res.Ag = Ag;
    res.AvCv1 = AvCv1;
    res.mesh = mesh;

    const required = o.simplified ? o.required : o.required; // AvCv per reservoir
    // min 1 hatch per 400 m² of floor
    const minCount = Math.floor(o.area * 0.99 / 400) + 1;

    let count;
    // round UP to the next whole hatch; Math.floor(x) + 1 added a spurious extra hatch
    // whenever the required area was an exact multiple of one hatch.
    const up = (x) => Math.max(1, Math.ceil(x - 1e-9));
    if (o.simplified && o.simplifiedPct === 3) {
      // 3% geometric: count by geometric area
      count = Ag > 0 ? up(required / Ag) : 0;
    } else {
      count = AvCv1 > 0 ? up(required / AvCv1) : 0;
    }
    if (count < minCount) count = minCount;
    res.count = count;
    res.minCount = minCount;
    res.totalAll = count * o.reservoirs;
    res.totalAvCv = count * AvCv1;
    res.totalAg = count * Ag;

    // constraint checks
    res.warns = [];
    if (o.AvCvKrit > 0 && AvCv1 > o.AvCvKrit) res.warns.push("gt_krit");
    if (o.Lmax > 0 && num(hatch.w) > o.Lmax) res.warns.push("w_gt_L");
    if (o.Lmax > 0 && num(hatch.l) > o.Lmax) res.warns.push("l_gt_L");
    return res;
  }

  // ---------- compliance checklist ----------
  function buildChecks(R, inp, o, natural) {
    R.checks = [];
    const add = (key, pass) => R.checks.push({ key, pass });
    if (o.simplified) {
      add("chk_area2000", o.area <= 2000);
      add("chk_len60", Math.max(num(inp.glen), num(inp.gbre)) <= 60);
      add("chk_goods70", num(inp.hst) <= 0.7 * o.hc);
      add("chk_doors70", num(inp.poort) <= 0.7 * o.hc);
    } else {
      add("chk_tc", o.Tc > 0 && o.Tc <= 573.15);
      add("chk_area2000", o.area > 0 && o.area <= 2000);
      add("chk_len60", Math.max(num(inp.glen), num(inp.gbre)) <= 60);
      add("chk_ymin", o.Y >= 3 || o.Y >= (Math.max(num(inp.hst), num(inp.poort)) + 0.5));
      // The aerodynamic area of ONE ventilator must stay below 1.4 db^2. The check used to
      // read only "AvCvKrit > 0", so it passed whatever hatch was chosen; it now compares.
      // With no hatch chosen (mechanical extraction) there is nothing to compare and the
      // item is dropped rather than reported as passed.
      if (natural) add("chk_krit", o.AvCvKrit > 0 && o.hatchAvCv1 > 0
                                   && o.hatchAvCv1 < o.AvCvKrit);
    }
    return R;
  }

  function defaults() {
    return {
      method: "natural", buildingType: "storage",
      hc: 10, area: 400, glen: 20, gbre: 20, reservoirs: 1,
      poort: 3, hst: 3, Y: 3.5,
      fireMode: "guided", fireScenario: "low1",
      Af: 9, Wf: 12, alpha: 0.8,
      materialGeneral: true, materialQf: 250, materialH: 0,
      sprinklers: "geen", sprinklerTemp: "68", neglectSprinklers: true,
      reekb: 1.5,
      tAmb: 15, Ci: 0.5, Ai: 0,
    };
  }

  return { compute, hatchSizing, defaults, fireLowPile, fireRack, fireBulk, num, RHO, G, CE };
})();

    if (o.db > 0) parts.push(dim(x1 + (coarse ? 12 : 22), smokeTop, x1 + (coarse ? 12 : 22), smokeBot, "db=" + fmt(o.db, 2), ok, FS));

  function dim(x1, y1, x2, y2, label, color, FS) {
    let s = '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color + '" stroke-width="1"/>';
    s += '<line x1="' + (x1 - 4) + '" y1="' + y1 + '" x2="' + (x1 + 4) + '" y2="' + y1 + '" stroke="' + color + '" stroke-width="1"/>';
    s += '<line x1="' + (x2 - 4) + '" y1="' + y2 + '" x2="' + (x2 + 4) + '" y2="' + y2 + '" stroke="' + color + '" stroke-width="1"/>';
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    s += '<text x="' + mx + '" y="' + my + '" font-size="' + FS + '" fill="' + color + '" text-anchor="middle" transform="rotate(-90 ' + mx + ' ' + my + ')">' + label + '</text>';
    return s;
  }

        && Math.abs((o.Tc - o.T0K) - o.theta) > 1e-9)
      w.push("Sprinkler model active: the smoke gas temperature Tc is an averaged expression, "
           + "so Tc - T0 is no longer the temperature rise theta that the vent equation uses. "
           + "The two are not thermodynamically consistent and the vent area can differ by "
           + "tens of per cent from a pure buoyancy balance on Tc.");
    return {
      inputs: Object.assign({}, UI().read()),
      outputs: outputs(), units: OUT_UNITS,
      model: {
        equations: [
          "Large-fire plume: Mf = 0.188 Wf Y^1.5 kg/s (Thomas/Hinkley large-space entrainment, BR258)",
          "Convective heat: Qc = alpha qf Af kW",
          "Temperature rise: theta = Qc/(Mf c) K with c = 1.0 kJ/(kg.K), so numerically theta = Qc/Mf",
          "Smoke gas temperature: Tc = T0 + theta; with sprinklers of known operating temperature the tool uses the averaged form Tc = (T_spr + t0 + theta)/2 + 273.15 and caps theta at 1.5 T_spr - t0",
          "Natural ventilators: Av Cv = (Mf/rho0) sqrt((Tc^2 + Sk^2 T0 Tc)/(2 g db theta T0)), Sk = AvCv/AiCi, solved iteratively; the inlet is taken at least equal to the value at Sk = 1",
          "Mechanical: V = (Mf/rho0) Tc/T0 m3/s; make-up air volume flow = Mf/rho0; inlet area Ai = V/(5 Ci)",
          "Plugholing limit: V_crit = (2/Tc) sqrt(g db^5 T0 (Tc - T0)) m3/s",
          "Per-ventilator limits: Av Cv < 1.4 db^2, L <= min(db, 3) m, spacing >= 3 db",
          "Simplified rules: Av Cv = 0.02 A (aerodynamic) or Ag = 0.03 A (geometric)"
        ],
        ranges: [
          "NBN S 21-208-1 is a paid national standard and its text was not available when this page was benchmarked. The fire-geometry tables of section 4, the sprinkler temperature caps, the 1.4 db^2 ventilator limit, the L and D rules, the 60 m reservoir length and the 3 % geometric variant are transcriptions of the original workbook and are NOT verified against the standard.",
          "The plume coefficient 0.188 is the large-space value; it is not valid for a fire in a small room (0.337) nor for a balcony spill plume.",
          "The plugholing coefficient used here is 2. BR258 gives 1.3 for a ventilator near a wall and 1.8 for one away from a wall, so this figure is at or beyond the permissive end of the published range.",
          "Steady-state design fire only: no growth phase, no wind, no CFD, no sprinkler-smoke interaction beyond the temperature cap.",
          "The 2 % / 3 % simplified rules apply only to a single natural smoke reservoir of at most 2000 m2 with no goods or openings above 70 % of the height."
        ],
        notes: [
          "The vent equation is a two-orifice buoyancy balance: the same mass flow passes the inlet at ambient density and the ventilator at smoke density, and the head g db (rho0 - rhoc) is split between the two resistances.",
          "The air inlet for mechanical extraction is sized on the hot extract volume flow, which is conservative relative to a mass balance on the incoming air by the factor Tc/T0.",
          "This is an indicative calculation, not a fire-engineering design or an approval."
        ]
      },
      warnings: w
    };
  }
  /* The tool runs a compliance checklist and the report said no acceptance
     criterion had been supplied: the list travelled as a section table whose
     own headings and verdicts ("check", "result", "pass", "NOT MET") were
     English in every language, while the report's checks section stood empty.
     The list belongs where a reader looks for it, with the number each item
     was measured against. */
  function reportProfile(rec, ctx) {
    const L = UI() && UI().last(); if (!L || !L.r) return null;
    const T = UI().t, o = L.r.out || {}, inp = L.inp || {};
    const V = (v, u) => ctx.value(typeof v === "number" && isFinite(v) ? v : null, u || "");
    const nmax = (a, b) => Math.max(Number(a) || 0, Number(b) || 0);
    const FACT = {
      chk_area2000: () => ({ actual: V(o.area, "m2"), criterion: "\u2264 2000 m\u00b2" }),
      chk_len60: () => ({ actual: V(nmax(inp.glen, inp.gbre), "m"), criterion: "\u2264 60 m" }),
      chk_goods70: () => ({ actual: V(Number(inp.hst), "m"),
        criterion: "\u2264 0,7 \u00b7 " + V(o.hc, "m") }),
      chk_doors70: () => ({ actual: V(Number(inp.poort), "m"),
        criterion: "\u2264 0,7 \u00b7 " + V(o.hc, "m") }),
      chk_tc: () => ({ actual: V(o.Tc, "K"), criterion: "\u2264 573,15 K" }),
      chk_ymin: () => ({ actual: V(o.Y, "m"),
        criterion: "\u2265 3 m " + (T("or") === "or" ? "/" : T("or")) + " \u2265 "
          + V(nmax(inp.hst, inp.poort) + 0.5, "m") }),
      chk_krit: () => ({ actual: V(o.hatchAvCv1, "m2"), criterion: "< " + V(o.AvCvKrit, "m2") })
    };
    const checks = (L.r.checks || []).map(c => {
      const f = FACT[c.key], extra = f ? f() : {};
      return { status: c.pass ? "pass" : "fail", title: T(c.key),
        actual: extra.actual || "", criterion: extra.criterion || "" };
    });
    return checks.length ? { checks: checks } : null;
  }
  const PY = String.raw`
RHO, G, CE = 1.225, 9.81, 0.188
CP_SMOKE = 1.0
V_INLET_MAX = 5.0
LOW = {1: (9.0, 12.0, 0.8), 2: (20.0, 18.0, 0.8), 3: (36.0, 24.0, 0.8), 4: (81.0, 36.0, 0.8)}


def num(x, d=0.0):
    try:
        if x is None or x == "":
            return d
        return float(str(x).replace(",", "."))
    except (TypeError, ValueError):
        return d


def fire_rack(hst, reekb, spr):
    x = 0.18 * hst
    if spr == "inrekken":
        af, wf, al = 2 / 3 * hst * (reekb + x), reekb + 4 * x, 0.5
    elif spr == "onderdak":
        af, wf, al = 4 / 3 * hst * (reekb + x), 2 * (reekb + 4 * x), 0.8
    else:
        af, wf, al = 81.0, 36.0, 0.8
    if spr != "geen":
        af, wf = min(max(af, 9.0), 81.0), min(max(wf, 12.0), 36.0)
    return af, wf, al


def fire_bulk(hst, spr):
    if spr == "geen":
        return (81.0, 36.0, 0.8) if hst <= 3 else (0.0, 0.0, 0.8)
    al = 0.5 if spr == "inrekken" else 0.8
    if hst <= 3:
        return 36.0, 24.0, al
    if hst <= 4:
        return 81.0, 36.0, al
    return 0.0, 0.0, al


def avcv(mf, t0, tc, db, theta, aici=None):
    """Two-orifice buoyancy balance, solved in closed form.  aici=None -> Sk = 1."""
    k = (mf / RHO) ** 2 / (2 * G * db * theta * t0)
    if aici is None:
        return math.sqrt(k * (tc * tc + t0 * tc))
    d = 1.0 - k * t0 * tc / (aici * aici)
    return None if d <= 0 else tc * math.sqrt(k / d)


def compute():
    I = INPUTS
    st = I["_state"]
    hc, Y = num(I["hc"]), num(I["Y"])
    area = num(I["gbre"]) * num(I["glen"]) if I["shape"] == "rect" else num(I["area"])
    db = hc - Y if hc > 2 else 0.0
    n = max(1, int(num(I["reservoirs"], 1)))
    ci, ai_geo = num(I["Ci"], 0.5) or 0.5, num(I["Ai"])
    o = {"reservoir_area": area, "reservoirs": n, "ceiling_height": hc,
         "smoke_free_height": Y, "layer_depth": db,
         "critical_ventilator_area": db * db * 1.4 if db > 0 else 0.0,
         "max_ventilator_length": min(db, 3.0) if db > 0 else 3.0,
         "min_ventilator_spacing": db * 3 if db > 0 else 0.0,
         "geometric_inlet_area": None, "aerodynamic_inlet_area": None,
         "smoke_volume_flow": None, "make_up_air_volume_flow": None,
         "required_inlet_area": None, "required_inlet_area_mass_balance": None,
         "critical_extract_flow": None, "required_aerodynamic_area": None,
         "aerodynamic_area_equal_inlet": None, "simplified_percentage": None}
    natural = st["method"] == "natural"
    if st["buildingType"] in ("2pct", "3pct"):
        f = 0.02 if st["buildingType"] == "2pct" else 0.03
        o["simplified_percentage"] = f * 100
        o["required_aerodynamic_area"] = f * area
        for k in ("fire_area", "fire_perimeter", "convective_fraction", "heat_release_density",
                  "convective_heat", "smoke_mass_flow", "temperature_rise",
                  "smoke_gas_temperature", "ambient_temperature"):
            o[k] = None
        return o
    ag = num(I["hw"]) * num(I["hl"])
    mesh = {"insect": 0.85, "bird": 0.95}.get(I["mesh"], 1.0)
    o["hatch_aerodynamic_area"] = ag * num(I["cv"]) * mesh
    o["hatch_geometric_area"] = None
    o["hatch_count"] = None
    o["hatch_count_all_reservoirs"] = None
    hst, reekb, spr = num(I["hst"]), num(I["reekb"], 1.5) or 1.5, I["sprinklers"]
    if st["buildingType"] == "hs":
        af, wf, al = 81.0, 36.0, 0.8
    elif st["fireMode"] == "manual":
        af, wf, al = num(I["Af"]), num(I["Wf"]), num(I["alpha"], 0.8) or 0.8
    else:
        sc = st["fireScenario"]
        if sc.startswith("low"):
            af, wf, al = LOW[int(sc[-1])]
        elif sc == "rack":
            af, wf, al = fire_rack(hst, reekb, spr)
        else:
            af, wf, al = fire_bulk(hst, spr)
    qf = 250.0 if natural else 500.0
    mf = CE * wf * Y ** 1.5
    qc = al * qf * af
    t_amb = num(I["tAmb"])
    t0 = t_amb + 273.15
    theta = 0.0 if (qc == 0 or mf == 0) else qc / (mf * CP_SMOKE)
    spr_on = spr != "geen"
    spr_t = num(str(I["sprinklerTemp"]).split("-")[0]) if spr_on else None
    if natural and spr_on and spr_t:
        theta = min(1.5 * spr_t - t_amb, theta)
    tc = ((spr_t + t_amb + theta) / 2 + 273.15) if (spr_on and spr_t) else t0 + theta
    o.update({"fire_area": af, "fire_perimeter": wf, "convective_fraction": al,
              "heat_release_density": qf, "convective_heat": qc, "smoke_mass_flow": mf,
              "temperature_rise": theta, "smoke_gas_temperature": tc,
              "ambient_temperature": t0})
    if natural:
        a_eq = avcv(mf, t0, tc, db, theta)
        o["aerodynamic_area_equal_inlet"] = a_eq
        if n > 1:
            a = a_eq
            for _ in range(400):
                aici = ai_geo * ci + (n - 1) * a
                b = avcv(mf, t0, tc, db, theta, aici)
                if b is None:
                    break
                if abs(b - a) < 1e-12:
                    a = b
                    break
                a = b
            aici = ai_geo * ci + (n - 1) * a
        else:
            aici = ai_geo * ci
            if aici <= a_eq:
                aici = a_eq
            a = avcv(mf, t0, tc, db, theta, aici)
        o["aerodynamic_inlet_area"] = aici
        o["geometric_inlet_area"] = aici / ci if n == 1 else ai_geo
        o["required_aerodynamic_area"] = a
        a1 = o["hatch_aerodynamic_area"]
        o["hatch_geometric_area"] = ag
        cnt = max(1, math.ceil(a / a1 - 1e-9)) if a1 > 0 else 0
        cnt = max(cnt, math.floor(area * 0.99 / 400) + 1)
        o["hatch_count"] = cnt
        o["hatch_count_all_reservoirs"] = cnt * n
    else:
        v = mf / RHO * tc / t0
        o["smoke_volume_flow"] = v
        o["make_up_air_volume_flow"] = mf / RHO
        o["required_inlet_area"] = v / V_INLET_MAX / ci
        o["required_inlet_area_mass_balance"] = (mf / RHO) / V_INLET_MAX / ci
        o["aerodynamic_inlet_area"] = o["required_inlet_area"] * ci
        vcrit = 2 / tc * math.sqrt(G * db ** 5 * t0 * (tc - t0))
        o["critical_extract_flow"] = min(vcrit, v)
    return o
`;
  function python() {
    const L = UI() && UI().last(); if (!L || !L.r || !L.r.ok) return null;
    const o = outputs();
    return {
      code: PY, requires: [],
      covers: Object.keys(o).filter(k => k.indexOf("checks_") !== 0),
      scope: "the complete NBN S 21-208-1 sizing engine of this page: fire geometry, plume, "
           + "temperatures, the natural-ventilator area (solved in closed form rather than by "
           + "the page's fixed-point iteration), the mechanical volume flow and inlet area, and "
           + "the hatch count. The conformity checklist is not reproduced.",
      selftest: { tolerance: 1e-9,
        note: "the script solves the same two-orifice balance analytically where the page "
            + "iterates; agreement to 1e-9 relative is expected" }
    };
  }
  function handoff() {
    const L = UI() && UI().last(); if (!L || !L.r || !L.r.ok) return null;
    const o = L.r.out, q = {};
    if (isFinite(o.Mf) && o.Mf > 0) q.mdot = { value: o.Mf, unit: "kg/s" };
    if (isFinite(o.Tc) && o.Tc > 0) q.T = { value: o.Tc, unit: "K" };
    if (isFinite(o.Qc) && o.Qc > 0) q.Q = { value: o.Qc * 1000, unit: "W" };
    if (isFinite(o.V) && o.V > 0) q.Vdot = { value: o.V, unit: "m3/s" };
    if (isFinite(o.required) && o.required > 0 && o.natural)
      q.A = { value: o.required, unit: "m2" };
    return Object.keys(q).length ? { quantities: q } : null;
  }
  function init() {
    if (!window.Diagram || !window.__rwaUI) return;
    window.Diagram.init({
      id: "rwa-calculator", file: "RWA_calculator.html",
      state: { serialize: () => window.__rwaUI.read(),
               deserialize: (st) => window.__rwaUI.write(st) },
      record: record, python: python,
      handoff: { provides: ["mdot", "T", "Q", "Vdot", "A"], accepts: [], build: handoff },
      report: { profile: reportProfile }
    });
  }
  /* init() is unconditional and never gated on a load; boot() calls it first so
     the shared bar stands whatever the interface layer does. The listener below
     stays as the safety net — Diagram.init() is idempotent. */
  window.__rwaDgcInit = init;
  if (document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
