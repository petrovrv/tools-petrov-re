 lPartial:{en:"Some cases fail, or the artifact records a flagged case. The tool keeps the prototype label and its report shows which cases fail and which are flagged. A failing benchmark is what a reader must be able to find.",uk:"Частина випадків не проходить або артефакт містить позначений випадок. Інструмент зберігає мітку «Прототип», а його звіт показує, які випадки не проходять і які позначено. Бенчмарк, який не проходить, — саме те, що читач мусить мати змогу знайти.",de:"Einzelne Fälle schlagen fehl, oder das Artefakt verzeichnet einen markierten Fall. Das Werkzeug behält das Label „Prototyp“, und sein Bericht zeigt, welche Fälle fehlschlagen und welche markiert sind. Ein fehlschlagender Benchmark ist genau das, was ein Leser finden können muss.",nl:"Sommige gevallen falen, of het artefact bevat een gemarkeerd geval. De tool houdt het label Prototype en het rapport laat zien welke gevallen falen en welke gemarkeerd zijn. Een falende benchmark is juist wat een lezer moet kunnen vinden.",fr:"Certains cas échouent, ou l'artefact enregistre un cas signalé. L'outil conserve le libellé Prototype et son rapport indique quels cas échouent et lesquels sont signalés. Un banc d'essai en échec est précisément ce qu'un lecteur doit pouvoir trouver.",es:"Algunos casos fallan, o el artefacto registra un caso marcado. La herramienta conserva la etiqueta Prototipo y su informe muestra qué casos fallan y cuáles están marcados. Un banco de pruebas que falla es precisamente lo que un lector debe poder encontrar.",pl:"Część przypadków nie przechodzi albo artefakt zawiera oznaczony przypadek. Narzędzie zachowuje etykietę „Prototyp”, a jego raport pokazuje, które przypadki nie przechodzą i które są oznaczone. Benchmark, który nie przechodzi, to właśnie to, co czytelnik musi móc znaleźć."},
 lBench:{en:"Every counted case passes against a reference independent of the tool's own code, cited, with a tolerance chosen from the physics. Where an artifact also carries self-checks, it labels them and states the split. Still the author's own harness, so independent validation stays No.",uk:"Усі зараховані випадки проходять за еталоном, незалежним від коду інструмента, з посиланням і допуском, обраним з фізики. Якщо артефакт містить і самоперевірки, він позначає їх і вказує розподіл. Це все ще власний стенд автора, тому незалежна валідація залишається «Ні».",de:"Jeder gezählte Fall besteht gegen eine vom Code des Werkzeugs unabhängige, zitierte Referenz mit einer aus der Physik gewählten Toleranz. Enthält ein Artefakt zusätzlich Selbstprüfungen, werden sie gekennzeichnet und die Aufteilung angegeben. Es bleibt der eigene Prüfstand des Autors, daher bleibt die unabhängige Validierung „Nein“.",nl:"Elk meegeteld geval slaagt tegen een van de eigen code onafhankelijke, geciteerde referentie, met een uit de fysica gekozen tolerantie. Bevat een artefact daarnaast zelftests, dan worden die gelabeld en wordt de verdeling vermeld. Het blijft de testbank van de auteur zelf, dus onafhankelijke validatie blijft Nee.",fr:"Chaque cas comptabilisé réussit face à une référence indépendante du code de l'outil, citée, avec une tolérance issue de la physique. Lorsqu'un artefact porte aussi des auto-tests, il les étiquette et indique la répartition. Il s'agit toujours du banc de l'auteur : la validation indépendante reste Non.",es:"Todos los casos contabilizados se superan frente a una referencia independiente del propio código, citada, con una tolerancia elegida a partir de la física. Cuando un artefacto incluye además autocomprobaciones, las etiqueta e indica el reparto. Sigue siendo el banco del autor, por lo que la validación independiente sigue siendo No.",pl:"Każdy liczony przypadek przechodzi względem odniesienia niezależnego od kodu narzędzia, z cytowaniem i tolerancją wybraną z fizyki. Jeśli artefakt zawiera także samosprawdzenia, są one oznaczone, a podział podany. To nadal własne stanowisko testowe autora, więc walidacja niezależna pozostaje „Nie”."},
 lVer:{en:"Reserved. Benchmark tested plus a documented review by someone other than the author, recorded in the manifest. No tool holds this tier today, and the label is never shown without that record.",uk:"Зарезервовано. Перевірка за еталоном плюс задокументований огляд особою, іншою ніж автор, зафіксований у manifest. Сьогодні жоден інструмент цього рівня не має, і без такого запису мітка не показується.",de:"Reserviert. Benchmark geprüft plus eine im Manifest dokumentierte Prüfung durch jemanden außer dem Autor. Derzeit erreicht kein Werkzeug diese Stufe, und ohne diesen Nachweis wird das Label nie angezeigt.",nl:"Gereserveerd. Benchmark getoetst plus een in het manifest vastgelegde review door iemand anders dan de auteur. Geen enkele tool staat vandaag op dit niveau, en zonder dat verslag wordt het label nooit getoond.",fr:"Réservé. Testé sur banc d'essai, plus une revue documentée dans le manifeste par une personne autre que l'auteur. Aucun outil n'atteint ce niveau aujourd'hui, et le libellé n'est jamais affiché sans ce document.",es:"Reservado. Contrastado con referencia más una revisión documentada en el manifiesto por alguien distinto del autor. Hoy ninguna herramienta alcanza este nivel, y la etiqueta nunca se muestra sin ese registro.",pl:"Zarezerwowane. Sprawdzenie benchmarkiem oraz udokumentowany przegląd wykonany przez osobę inną niż autor, zapisany w manifeście. Dziś żadne narzędzie nie ma tego poziomu, a bez takiego zapisu etykieta nigdy się nie pojawia."},
 rejTitle:{en:"Manifests rejected by the catalog",uk:"Manifest, відхилені каталогом",de:"Vom Katalog abgewiesene Manifeste",nl:"Door de catalogus geweigerde manifesten",fr:"Manifestes rejetés par le catalogue",es:"Manifiestos rechazados por el catálogo",pl:"Manifesty odrzucone przez katalog"},
 rejIntro:{en:"These files claim a capability they do not have, so catalog.php leaves them out of the catalog until the declaration matches the file.",uk:"Ці файли заявляють можливість, якої не мають, тому catalog.php виключає їх із каталогу, доки декларація не відповідатиме файлу.",de:"Diese Dateien behaupten eine Fähigkeit, die sie nicht haben; catalog.php lässt sie aus dem Katalog, bis die Angabe zur Datei passt.",nl:"Deze bestanden claimen een eigenschap die ze niet hebben; catalog.php laat ze buiten de catalogus tot de verklaring bij het bestand past.",fr:"Ces fichiers revendiquent une capacité qu'ils n'ont pas ; catalog.php les exclut du catalogue jusqu'à ce que la déclaration corresponde au fichier.",es:"Estos archivos declaran una capacidad que no tienen, por lo que catalog.php los deja fuera del catálogo hasta que la declaración coincida con el archivo.",pl:"Te pliki deklarują możliwość, której nie mają, więc catalog.php pomija je w katalogu, dopóki deklaracja nie będzie zgodna z plikiem."},

 flagIntro:{en:"These tools work and stay in the catalog, but something in their manifest or their page does not match what they declare. The list is the site's own to-do list, kept in the open.",uk:"Ці інструменти працюють і залишаються в каталозі, але щось у їхньому manifest чи на сторінці не збігається з декларацією. Це відкритий перелік завдань сайту.",de:"Diese Werkzeuge funktionieren und bleiben im Katalog, doch etwas im Manifest oder auf der Seite passt nicht zur Deklaration. Die Liste ist die offene To-do-Liste der Website.",nl:"Deze tools werken en blijven in de catalogus, maar iets in hun manifest of pagina klopt niet met wat ze verklaren. Deze lijst is de openbare to-dolijst van de site.",fr:"Ces outils fonctionnent et restent au catalogue, mais quelque chose dans leur manifeste ou leur page ne correspond pas à ce qu'ils déclarent. Cette liste est la liste de tâches du site, tenue en public.",es:"Estas herramientas funcionan y siguen en el catálogo, pero algo en su manifiesto o en su página no coincide con lo que declaran. Esta lista es la lista de tareas del sitio, a la vista.",pl:"Te narzędzia działają i pozostają w katalogu, ale coś w ich manifeście lub na ich stronie nie zgadza się z tym, co deklarują. Ta lista to własna lista zadań serwisu, prowadzona jawnie."},
 footnote:{en:"A self-check that re-evaluates the tool's own formula is not validation and is not counted here.",uk:"Самоперевірка, яка повторно обчислює власну формулу інструмента, не є валідацією і тут не враховується.",de:"Eine Selbstprüfung, die die eigene Formel des Werkzeugs erneut auswertet, ist keine Validierung und wird hier nicht gezählt.",nl:"Een zelftest die de eigen formule van de tool opnieuw uitrekent is geen validatie en telt hier niet mee.",fr:"Un auto-test qui réévalue la formule de l'outil n'est pas une validation et n'est pas compté ici.",es:"Una autocomprobación que vuelve a evaluar la propia fórmula de la herramienta no es validación y no se cuenta aquí.",pl:"Samosprawdzenie, które ponownie wylicza własny wzór narzędzia, nie jest walidacją i nie jest tu liczone."}

 if(!L.includes(l))l=(navigator.language||"en").slice(0,2).toLowerCase();
 return L.includes(l)?l:"en"}
function date(s){const m=String(s||"").match(/^(\d{4}-\d{2}-\d{2})/);return m?m[1]:(s||"—")}
/* "verified" is reserved: it needs a documented review by someone other than the
   author (validation.review). catalog.php rejects a manifest that claims it
   without one; this keeps the register from ever printing the word anyway. */
function shown(t){const v=t.validation||{},st=t.status||"prototype",r=v.review;
 const has=(r&&typeof r==="object"&&Object.keys(r).length>0)||(typeof r==="string"&&r.trim()!=="");
 if(st==="verified")return has?"verified":"benchmarked";
 if(v.benchmark_status==="partial")return "partial";
 return st==="benchmarked"?"benchmarked":"prototype"}
function hasReport(t){const v=t.validation||{};return Array.isArray(v.benchmarks)&&v.benchmarks.some(b=>b&&b.artifact)}
function reportURL(t,l){return "benchmark.html?tool="+encodeURIComponent(t.id||t.file||"")+"&lang="+l}
function statusCell(t,l){const st=shown(t),lab=esc(p(U[st],l));
 return hasReport(t)?`<a href="${esc(reportURL(t,l))}" title="${esc(p(U.report,l))}">${lab}</a>`:lab}
function render(l){
 document.documentElement.lang=l;
 try{localStorage.setItem("diagram_site_lang",l);localStorage.setItem("diagram_lang",l)}catch(e){}
 ttl.textContent=p(U.title,l);intro.textContent=p(U.intro,l);
 nav.innerHTML="";
 for(const x of L){const b=document.createElement("button");b.textContent=x==="uk"?"UA":x.toUpperCase();
  b.className=x===l?"on":"";b.onclick=()=>render(x);nav.appendChild(b)}
 for(const [u,k] of [["index.html","home"],["disclaimer.html","full"]]){
  const a=document.createElement("a");a.className="nav";a.href=q(u,l);a.textContent=p(U[k],l);nav.appendChild(a)}
 ladder.innerHTML=[["prototype","lProto"],["partial","lPartial"],["benchmarked","lBench"],["verified","lVer"]]
  .map(([s,k])=>`<div><b class="st st-${s}">${esc(p(U[s],l))}</b>${esc(p(U[k],l))}</div>`).join("");
 hrow.innerHTML=["tool","status","indep","cases","reference","tolerance","run","artifact"]
  .map(k=>`<th>${esc(p(U[k],l))}</th>`).join("");
 foot.textContent=p(U.footnote,l);
 if(!D){rows.innerHTML="";return}
 const tools=D.tools||[];
 const n={prototype:0,partial:0,benchmarked:0,verified:0};
 tools.forEach(t=>{const st=shown(t);n[st]=(n[st]||0)+1});
 tally.innerHTML=Object.keys(n).map(s=>`<span class="st st-${s}">${esc(p(U[s],l))}: ${n[s]}</span>`).join("")
  +`<span>${esc(p(U.tool,l))}: ${tools.length}</span>`;
 rows.innerHTML=tools.map(t=>{
  const st=shown(t);
  const stc=statusCell(t,l);
  const v=t.validation||{};
  const bs=Array.isArray(v.benchmarks)?v.benchmarks:[];
  const lim=p(t.limitations,l);
  const name=`<a href="${esc(q(t.file,l))}">${esc(p(t.title,l))}</a>`
   +(lim?`<details><summary>${esc(p(U.details,l))}</summary><p>${esc(lim)}</p></details>`:"")
   +(v.basis?`<details><summary>${esc(p(U.basis,l))}</summary><p>${esc(p(v.basis,l))}</p></details>`:"");
  const indep=v.independent_validation?p(U.yes,l):p(U.none,l);
  if(!bs.length){
   return `<tr><td>${name}</td><td class="st st-${st}">${stc}</td>`
    +`<td class="muted">${esc(indep)}</td>`
    +`<td class="muted" colspan="5">${esc(p(U.nobench,l))}</td></tr>`;
  }
  return bs.map((b,i)=>{
   const ok=b.cases>0&&b.passed===b.cases;
   const cit=(b.citations||[]).map(c=>`<div class="small">${esc(c)}</div>`).join("");
   return `<tr>`
    +(i===0?`<td rowspan="${bs.length}">${name}</td><td rowspan="${bs.length}" class="st st-${st}">${stc}`
      +(!ok&&st==="prototype"?`<div class="small bad">${esc(p(U.failing,l))}</div>`:"")+`</td>`
      +`<td rowspan="${bs.length}" class="muted">${esc(indep)}</td>`:"")
    +`<td class="num${ok?"":" bad"}">${b.passed} / ${b.cases}</td>`
    +`<td>${esc(b.reference||"—")}${cit}</td>`
    +`<td class="small">${esc(b.tolerance||"—")}</td>`
    +`<td class="num small">${esc(date(b.run_at))}</td>`
    +`<td class="small">${b.artifact?`<a href="${esc(b.artifact)}">${esc(p(U.open,l))}</a>`:"—"}</td></tr>`;
  }).join("");
 }).join("");
 const flagged=(D.tools||[]).map(t=>[t,(t.warnings||[])]).filter(x=>x[1].length);
 flags.innerHTML=flagged.length
  ?`<h2>${esc(p(U.flagTitle,l))}</h2><p class="lead">${esc(p(U.flagIntro,l))}</p>`
   +flagged.map(([t,w])=>`<div class="flag"><b>${esc(t.file)}</b><br>`
     +w.map(x=>`<span class="code">${esc(x.code)}</span> — ${esc(x.message)}`).join("<br>")+`</div>`).join("")
  :"";
 const errs=D.errors||[];
 rejected.innerHTML=errs.length
  ?`<h2>${esc(p(U.rejTitle,l))}</h2><p class="lead">${esc(p(U.rejIntro,l))}</p>`
   +errs.map(e=>`<div class="err"><b>${esc(e.file)}</b> — <span class="muted">${esc(e.code)}</span><br>${esc(e.message)}</div>`).join("")
  :"";
}
const l0=dl();
render(l0);
fetch("catalog.php",{cache:"no-cache"}).then(r=>r.ok?r.json():Promise.reject(r.status))
 .then(d=>{D=d;render(l0)})
 .catch(()=>{rows.innerHTML=`<tr><td colspan="8">${esc(p(U.error,l0))}</td></tr>`});
})();
</script>
</body>
</html>
