    "en": "For the contracting authority after the opening of the offers. The Belgian rule of KB 18.04.2017 art. 36 §4 is applied with its conditions (works or services in a fraud-sensitive sector, open or restricted procedure, at least four offers, price only or price weighing at least 50 %, extension by the procurement documents, a higher percentage in the price-quality case) and the exemption of §6 for negotiated procedures; the mean leaves out the lowest offer and the highest quarter (n ≥ 7) or the highest offer (n < 7), manifestly irregular offers excluded. Statistical screens (mean of the other offers, Tukey fence on the interquartile range, owner's estimate) show where prices merely appear abnormal (art. 36 §1, Directive 2014/24/EU art. 69). Unit prices per line of the bill of quantities are compared with the line median; only non-negligible lines count, and the total at median shows how much of the gap the low lines explain. The enquiry part tracks the 12-day period, the grounds of art. 36 §2 1°–4° and the social, labour and environmental obligations, and gives the outcome of §3 with the notifications of §5. Exports a printable record, CSV and the tender project file.",
    "uk": "Для замовника після розкриття пропозицій. Бельгійське правило KB 18.04.2017 ст. 36 §4 застосовано з його умовами (роботи або послуги в секторі, чутливому до шахрайства, відкрита чи обмежена процедура, щонайменше чотири пропозиції, лише ціна або вага ціни не менше 50 %, поширення тендерною документацією, вищий відсоток у разі ціна-якість) і винятком §6 для переговорних процедур; середнє обчислюють без найнижчої пропозиції та найвищої чверті (n ≥ 7) або найвищої пропозиції (n < 7), явно неправильні пропозиції виключено. Статистичні фільтри (середнє інших пропозицій, межа Т’юкі за міжквартильним розмахом, кошторис замовника) показують, де ціни лише здаються аномальними (ст. 36 §1, Директива 2014/24/ЄС ст. 69). Ціни за одиницю в позиціях кошторису порівнюють із медіаною позиції; враховуються лише істотні позиції, а сума за медіаною показує, яку частку розриву пояснюють занижені позиції. Розділ запиту веде 12-денний строк, підстави ст. 36 §2 1°–4° і соціальні, трудові та екологічні зобов’язання та дає рішення за §3 з повідомленнями за §5. Експорт: протокол для друку, CSV і файл тендерного проєкту.",

    "pl": "Dla zamawiającego po otwarciu ofert. Belgijska reguła KB 18.04.2017 art. 36 §4 jest stosowana z jej warunkami (roboty budowlane lub usługi w sektorze narażonym na nadużycia, procedura otwarta lub ograniczona, co najmniej cztery oferty, tylko cena lub waga ceny co najmniej 50 %, rozszerzenie w dokumentach zamówienia, wyższy próg przy najlepszej relacji jakości do ceny) oraz z wyjątkiem §6 dla procedur negocjacyjnych; średnia pomija ofertę najniższą i najwyższą ćwiartkę (n ≥ 7) albo ofertę najwyższą (n < 7), bez ofert oczywiście nieprawidłowych. Filtry statystyczne (średnia pozostałych ofert, granica Tukeya z rozstępu międzykwartylowego, wartość szacunkowa zamawiającego) pokazują, gdzie ceny jedynie wydają się rażąco niskie (art. 36 §1, dyrektywa 2014/24/UE art. 69). Ceny jednostkowe w pozycjach przedmiaru porównuje się z medianą pozycji; liczą się tylko pozycje nieznaczące inaczej niż marginalnie, a suma według mediany pokazuje, jaką część różnicy tłumaczą zaniżone pozycje. Część wyjaśnień prowadzi termin 12 dni, podstawy art. 36 §2 1°–4° oraz obowiązki z prawa pracy, socjalnego i ochrony środowiska i daje decyzję z §3 wraz z zawiadomieniami z §5. Eksport: protokół do druku, CSV i plik projektu przetargowego."

    t.bids.length = 0; p.bids.forEach(function (b) { t.bids.push({ id: b.id, name: b.name, total: b.total, irregular: !!b.irregular }); });
    if (!Array.isArray(t.lines)) t.lines = [];
    var LD = LINE_DESC[p.id] || {}, lg = lang();
    t.lines.length = 0; (p.lines || []).forEach(function (l) { t.lines.push({ id: l.id, desc: LD[l.id] ? LD[l.id][lg] : l.desc, qty: l.qty, unit: l.unit, prices: JSON.parse(JSON.stringify(l.prices)) }); });
    t.estimate = p.screen && p.screen.estimate != null ? p.screen.estimate : null;
    t.j = {}; t.jBid = '';
  }
  function buildExamples() {
    var Lb = lib();
    if (!Lb) return [];
    return Lb.PRESETS.map(function (p) {
      var x = EXT[p.id];
      return { id: p.id, group: p.regime === 'private' ? GROUP.priv : GROUP.be, label: x.label, note: x.aha,
        apply: function (t) { applyPreset(t, Lb.preset(p.id)); gridSig = ''; } };
    });
  }

  /* ---- learn ---- */
  function buildLearn() {
    return {
      version: 1,
      intro: {
        title: T('Abnormally low tenders in four steps', 'Аномально низькі ціни в чотири кроки', 'Ungewöhnlich niedrige Angebote in vier Schritten', 'Abnormale prijzen in vier stappen', 'Les offres anormalement basses en quatre étapes', 'Ofertas anormalmente bajas en cuatro pasos', 'Rażąco niska cena w czterech krokach'),
        body: T('Stage 8 of the tender life cycle (commercial evaluation), after the arithmetic correction and before the award. 1) Does the Belgian 15 % rule apply? 2) Which offers fall below the limit or merely look abnormal? 3) Which unit prices are abnormal? 4) Ask, assess the justification, decide and notify. A low price is not a fault in itself: the authority must ask before it may reject.',
                'Етап 8 тендерного циклу (комерційна оцінка), після арифметичного виправлення і до визначення переможця. 1) Чи діє бельгійське правило 15 %? 2) Які пропозиції нижчі за межу або лише виглядають аномальними? 3) Які ціни за одиницю аномальні? 4) Запитати, оцінити обґрунтування, вирішити й повідомити. Низька ціна сама по собі не вада: замовник має запитати, перш ніж відхилити.',
                'Phase 8 des Vergabezyklus (kaufmännische Wertung), nach der rechnerischen Prüfung und vor dem Zuschlag. 1) Gilt die belgische 15-%-Regel? 2) Welche Angebote liegen unter der Grenze oder wirken nur ungewöhnlich? 3) Welche Einheitspreise sind ungewöhnlich? 4) Aufklären, bewerten, entscheiden, melden. Ein niedriger Preis ist kein Mangel an sich: der Auftraggeber muss aufklären, bevor er ausschließen darf.',
                'Fase 8 van de aanbestedingscyclus (commerciële beoordeling), na de rekenkundige verbetering en vóór de gunning. 1) Geldt de Belgische 15 %-regel? 2) Welke offertes liggen onder de grens of lijken alleen abnormaal? 3) Welke eenheidsprijzen zijn abnormaal? 4) Bevragen, verantwoording beoordelen, beslissen en melden. Een lage prijs is op zich geen fout: de aanbestedende overheid moet bevragen voor ze mag weren.',
                'Étape 8 du cycle d’appel d’offres (évaluation commerciale), après la correction arithmétique et avant l’attribution. 1) La règle belge des 15 % s’applique-t-elle ? 2) Quelles offres passent sous la limite ou semblent seulement anormales ? 3) Quels prix unitaires sont anormaux ? 4) Interroger, évaluer la justification, décider et communiquer. Un prix bas n’est pas une faute en soi : le pouvoir adjudicateur doit interroger avant de pouvoir écarter.',
                'Fase 8 del ciclo de licitación (evaluación económica), tras la corrección aritmética y antes de la adjudicación. 1) ¿Se aplica la regla belga del 15 %? 2) ¿Qué ofertas quedan bajo el límite o solo parecen anormales? 3) ¿Qué precios unitarios son anormales? 4) Pedir justificación, evaluarla, decidir y comunicar. Un precio bajo no es un defecto en sí: el poder adjudicador debe preguntar antes de poder rechazar.',
                'Etap 8 cyklu przetargu (ocena handlowa), po poprawieniu omyłek i przed wyborem oferty. 1) Czy stosuje się belgijską regułę 15 %? 2) Które oferty są poniżej progu lub tylko wydają się rażąco niskie? 3) Które ceny jednostkowe są rażąco niskie? 4) Wezwać, ocenić wyjaśnienia, zdecydować i zawiadomić. Niska cena sama w sobie nie jest wadą: zamawiający musi wezwać do wyjaśnień, zanim odrzuci ofertę.')
      },
      topics: {
        rule: { title: T('When is the enquiry mandatory?', 'Коли запит обов’язковий?', 'Wann ist die Aufklärung Pflicht?', 'Wanneer is de bevraging verplicht?', 'Quand l’examen est-il obligatoire ?', '¿Cuándo es obligatoria la solicitud?', 'Kiedy wezwanie jest obowiązkowe?'),
          body: T('KB 18.04.2017 art. 36 §4: works, or services in a fraud-sensitive sector, in an open or restricted procedure, with at least four offers, awarded on price alone or with price weighing at least 50 %. The documents may extend the rule to supplies and other services awarded on price alone. Outside these cases the authority still examines all prices (art. 35) and asks when prices appear abnormally low or high (§1); the EU directive (art. 69) has no number at all.',
                  'KB 18.04.2017 ст. 36 §4: роботи або послуги в секторі, чутливому до шахрайства, у відкритій чи обмеженій процедурі, щонайменше чотири пропозиції, оцінка лише за ціною або вага ціни не менше 50 %. Документація може поширити правило на товари та інші послуги з оцінкою лише за ціною. Поза цими випадками замовник однаково перевіряє всі ціни (ст. 35) і робить запит, коли ціни здаються аномально низькими чи високими (§1); директива ЄС (ст. 69) числа не встановлює.',
                  'KB 18.04.2017 Art. 36 §4: Bauleistungen oder Dienstleistungen in einem betrugsanfälligen Sektor, offenes oder nicht offenes Verfahren, mindestens vier Angebote, Zuschlag nur nach Preis oder Preisgewicht mindestens 50 %. Die Unterlagen können die Regel auf Lieferungen und andere Dienstleistungen mit reinem Preiskriterium ausdehnen. Außerhalb dieser Fälle prüft der Auftraggeber trotzdem alle Preise (Art. 35) und klärt auf, wenn Preise ungewöhnlich niedrig oder hoch erscheinen (§1); die EU-Richtlinie (Art. 69) nennt keine Zahl.',
                  'KB 18.04.2017 art. 36 §4: werken of diensten in een fraudegevoelige sector, openbare of niet-openbare procedure, minstens vier offertes, gunning enkel op prijs of prijs minstens 50 % van het gewicht. De opdrachtdocumenten kunnen de regel uitbreiden tot leveringen en andere diensten die enkel op prijs worden gegund. Buiten die gevallen onderzoekt de aanbestedende overheid toch alle prijzen (art. 35) en bevraagt ze wanneer prijzen abnormaal laag of hoog lijken (§1); de EU-richtlijn (art. 69) noemt geen getal.',
                  'AR du 18.04.2017 art. 36 §4 : travaux, ou services dans un secteur sensible à la fraude, procédure ouverte ou restreinte, au moins quatre offres, attribution au prix seul ou prix pesant au moins 50 %. Les documents peuvent étendre la règle aux fournitures et autres services attribués au prix seul. Hors de ces cas, le pouvoir adjudicateur vérifie quand même tous les prix (art. 35) et interroge lorsque des prix semblent anormalement bas ou élevés (§1) ; la directive UE (art. 69) ne fixe aucun chiffre.',
                  'RD de 18.04.2017 art. 36 §4: obras, o servicios en un sector sensible al fraude, procedimiento abierto o restringido, al menos cuatro ofertas, adjudicación solo por precio o con el precio pesando al menos el 50 %. Los pliegos pueden extender la regla a suministros y otros servicios adjudicados solo por precio. Fuera de esos casos el poder adjudicador verifica igualmente todos los precios (art. 35) y pregunta cuando parecen anormalmente bajos o altos (§1); la directiva UE (art. 69) no fija cifra.',
                  'KB 18.04.2017 art. 36 §4: roboty budowlane lub usługi w sektorze narażonym na nadużycia, procedura otwarta lub ograniczona, co najmniej cztery oferty, wybór tylko według ceny lub waga ceny co najmniej 50 %. Dokumenty mogą rozszerzyć regułę na dostawy i inne usługi oceniane tylko ceną. Poza tymi przypadkami zamawiający i tak bada wszystkie ceny (art. 35) i wzywa, gdy ceny wydają się rażąco niskie lub wysokie (§1); dyrektywa UE (art. 69) nie podaje liczby.') },
        mean: { title: T('The mean of art. 36 §4 and the 15 %', 'Середнє за ст. 36 §4 і 15 %', 'Der Mittelwert nach Art. 36 §4 und die 15 %', 'Het gemiddelde van art. 36 §4 en de 15 %', 'La moyenne de l’art. 36 §4 et les 15 %', 'La media del art. 36 §4 y el 15 %', 'Średnia z art. 36 §4 i 15 %'),
          body: T('With seven or more offers the mean leaves out the lowest offer and the highest offers that form a quarter of the number (rounded up: 8 offers → 2, 9 → 3); with fewer than seven it leaves out the lowest and the highest. Every offer at least 15 % below that mean must be asked. In the price-quality case the documents may set a higher percentage, never a lower one. Leaving the lowest out stops a single dumping offer from dragging the mean down; leaving the high quarter out stops padded offers from pulling it up. When two offers tie for the lowest price, only one is left out: the article speaks of “the lowest offer” (reading of the tool).',
                  'Якщо пропозицій сім і більше, середнє рахують без найнижчої пропозиції та найвищих, що становлять чверть кількості (з округленням угору: 8 → 2, 9 → 3); якщо менше семи — без найнижчої й найвищої. Кожну пропозицію, нижчу за це середнє щонайменше на 15 %, треба запитати. У разі ціна-якість документація може встановити вищий відсоток, але не нижчий. Виключення найнижчої не дає одній демпінговій пропозиції потягнути середнє вниз; виключення верхньої чверті не дає завищеним пропозиціям підняти його. Якщо дві пропозиції мають однакову найнижчу ціну, виключається лише одна: стаття говорить про «найнижчу пропозицію» (тлумачення інструмента).',
                  'Ab sieben Angeboten lässt der Mittelwert das niedrigste Angebot und die höchsten Angebote weg, die ein Viertel der Anzahl bilden (aufgerundet: 8 Angebote → 2, 9 → 3); bei weniger als sieben das niedrigste und das höchste. Jedes Angebot mindestens 15 % darunter ist aufzuklären. Beim Preis-Leistungs-Verhältnis dürfen die Unterlagen einen höheren Prozentsatz festlegen, nie einen niedrigeren. Ohne das niedrigste Angebot zieht kein Dumpingangebot den Mittelwert herunter; ohne das obere Viertel heben ihn überhöhte Angebote nicht an. Haben zwei Angebote denselben niedrigsten Preis, fällt nur eines weg: der Artikel spricht von „dem niedrigsten Angebot“ (Lesart des Werkzeugs).',
                  'Bij zeven of meer offertes sluit het gemiddelde de laagste offerte uit en de hoogste offertes die samen een vierde van het aantal vormen (naar boven afgerond: 8 offertes → 2, 9 → 3); bij minder dan zeven de laagste en de hoogste. Elke offerte minstens 15 % daaronder moet bevraagd worden. Bij beste prijs-kwaliteitsverhouding mogen de opdrachtdocumenten een hoger percentage bepalen, nooit een lager. Zonder de laagste trekt één dumpingofferte het gemiddelde niet omlaag; zonder het hoogste vierde trekken opgeblazen offertes het niet omhoog. Hebben twee offertes dezelfde laagste prijs, dan wordt er maar één uitgesloten: het artikel spreekt van „de laagste offerte” (lezing van de tool).',
                  'À partir de sept offres, la moyenne exclut l’offre la plus basse et les offres les plus élevées formant un quart du nombre (arrondi à l’unité supérieure : 8 offres → 2, 9 → 3) ; en dessous de sept, la plus basse et la plus haute. Toute offre d’au moins 15 % sous cette moyenne doit être examinée. En cas de meilleur rapport qualité-prix, les documents peuvent fixer un pourcentage plus élevé, jamais plus bas. Sans la plus basse, une offre de dumping ne tire pas la moyenne vers le bas ; sans le quart supérieur, des offres gonflées ne la tirent pas vers le haut. Si deux offres sont ex aequo au prix le plus bas, une seule est exclue : l’article parle de « l’offre la plus basse » (lecture de l’outil).',
                  'Con siete ofertas o más, la media excluye la oferta más baja y las más altas que forman un cuarto del número (redondeado al alza: 8 ofertas → 2, 9 → 3); con menos de siete, la más baja y la más alta. Toda oferta al menos un 15 % por debajo debe justificarse. En la mejor relación calidad-precio los pliegos pueden fijar un porcentaje mayor, nunca menor. Sin la más baja, una oferta temeraria no arrastra la media hacia abajo; sin el cuarto superior, las ofertas infladas no la empujan hacia arriba. Si dos ofertas empatan en el precio más bajo, solo se excluye una: el artículo habla de «la oferta más baja» (lectura de la herramienta).',
                  'Przy siedmiu lub więcej ofertach średnia pomija najniższą ofertę i najwyższe oferty stanowiące ćwierć ich liczby (w górę: 8 ofert → 2, 9 → 3); przy mniej niż siedmiu — najniższą i najwyższą. Każdą ofertę co najmniej 15 % poniżej trzeba objąć wezwaniem. Przy relacji jakości do ceny dokumenty mogą ustalić wyższy próg, nigdy niższy. Bez najniższej oferty dumping nie ściąga średniej w dół; bez górnej ćwiartki zawyżone oferty jej nie podnoszą. Gdy dwie oferty mają tę samą najniższą cenę, pomija się tylko jedną: przepis mówi o „ofercie najniższej” (odczytanie narzędzia).') },
        exempt: { title: T('Exemption of §6 and negotiated procedures', 'Виняток §6 і переговорні процедури', 'Ausnahme nach §6 und Verhandlungsverfahren', 'Uitzondering van §6 en onderhandelingsprocedures', 'Exception du §6 et procédures négociées', 'Excepción del §6 y procedimientos negociados', 'Wyłączenie z §6 i procedury negocjacyjne'),
          body: T('Unless the documents say otherwise, art. 36 does not apply to the competitive procedure with negotiation, the simplified negotiated procedure with publication and the negotiated procedure without publication for supplies and services below the EU threshold and for works below 500 000 €. Where it applies to a negotiated procedure, the enquiry is made on the last offers. §6 does not name the competitive dialogue and the innovation partnership: art. 36 §1–§3 apply there, §4 does not (it names open and restricted procedures only).',
                  'Якщо документація не встановлює інакше, ст. 36 не застосовується до конкурентної процедури з переговорами, спрощеної переговорної процедури з оприлюдненням і переговорної процедури без оприлюднення для товарів і послуг нижче порогу ЄС та для робіт нижче 500 000 €. Якщо ж вона застосовується до переговорної процедури, запит роблять щодо останніх пропозицій. §6 не згадує конкурентний діалог та інноваційне партнерство: там діють ст. 36 §1–§3, а §4 — ні (він стосується лише відкритої та обмеженої процедур).',
                  'Sofern die Unterlagen nichts anderes bestimmen, gilt Art. 36 nicht für das Verhandlungsverfahren mit Teilnahmewettbewerb, das vereinfachte Verhandlungsverfahren mit Bekanntmachung und das Verhandlungsverfahren ohne Bekanntmachung bei Lieferungen und Dienstleistungen unter dem EU-Schwellenwert und bei Bauleistungen unter 500 000 €. Gilt er in einem Verhandlungsverfahren, wird auf Grundlage der letzten Angebote aufgeklärt. §6 nennt den wettbewerblichen Dialog und die Innovationspartnerschaft nicht: dort gelten Art. 36 §1–§3, §4 dagegen nicht (er nennt nur das offene und das nicht offene Verfahren).',
                  'Behoudens andersluidende bepaling in de opdrachtdocumenten is art. 36 niet toepasselijk op de mededingingsprocedure met onderhandeling, de vereenvoudigde onderhandelingsprocedure met voorafgaande bekendmaking en de onderhandelingsprocedure zonder voorafgaande bekendmaking voor leveringen en diensten onder de Europese drempel en voor werken onder 500 000 €. Geldt het wel in een onderhandelingsprocedure, dan gebeurt de bevraging op de laatst ingediende offertes. §6 noemt de concurrentiegerichte dialoog en het innovatiepartnerschap niet: daar gelden art. 36 §1–§3, §4 niet (die noemt enkel de openbare en de niet-openbare procedure).',
                  'Sauf disposition contraire des documents du marché, l’art. 36 ne s’applique pas à la procédure concurrentielle avec négociation, à la procédure négociée directe avec publication préalable ni à la procédure négociée sans publication préalable pour les fournitures et services sous le seuil européen et pour les travaux sous 500 000 €. S’il s’applique à une procédure négociée, l’examen porte sur les dernières offres. Le §6 ne vise ni le dialogue compétitif ni le partenariat d’innovation : l’art. 36 §1–§3 s’y applique, le §4 non (il ne vise que les procédures ouverte et restreinte).',
                  'Salvo disposición en contrario de los pliegos, el art. 36 no se aplica al procedimiento de licitación con negociación, al negociado simplificado con publicidad ni al negociado sin publicidad para suministros y servicios bajo el umbral UE y para obras inferiores a 500 000 €. Si se aplica a un procedimiento negociado, la solicitud se hace sobre las últimas ofertas. El §6 no menciona el diálogo competitivo ni la asociación para la innovación: allí rigen el art. 36 §1–§3, pero no el §4 (que solo cita los procedimientos abierto y restringido).',
                  'O ile dokumenty nie stanowią inaczej, art. 36 nie stosuje się do negocjacji z ogłoszeniem, uproszczonej procedury negocjacyjnej z ogłoszeniem i procedury negocjacyjnej bez ogłoszenia dla dostaw i usług poniżej progu UE oraz robót poniżej 500 000 €. Jeśli ma zastosowanie w procedurze negocjacyjnej, wezwanie dotyczy ostatnich ofert. §6 nie wymienia dialogu konkurencyjnego ani partnerstwa innowacyjnego: stosuje się tam art. 36 §1–§3, ale nie §4 (dotyczy on tylko procedury otwartej i ograniczonej).') },
        screens: { title: T('Statistical screens', 'Статистичні фільтри', 'Statistische Filter', 'Statistische filters', 'Filtres statistiques', 'Filtros estadísticos', 'Filtry statystyczne'),
          body: T('Where the 15 % rule does not apply, or to look beyond it, three practice screens: distance to the mean of the other offers (the offer itself does not pull its own reference down), the Tukey fence Q1 − 1.5·IQR (robust with few outliers, weak with fewer than five offers) and the owner’s estimate. They are learning assumptions to edit, not law: a signal opens the question, the justification answers it.',
                  'Коли правило 15 % не діє або щоб подивитися ширше — три практичні фільтри: відстань до середнього інших пропозицій (пропозиція не знижує власну базу), межа Т’юкі Q1 − 1,5·IQR (стійка до викидів, слабка за менш ніж п’яти пропозицій) і кошторис замовника. Це навчальні припущення, які можна змінити, а не закон: сигнал ставить питання, обґрунтування на нього відповідає.',
                  'Wo die 15-%-Regel nicht gilt oder um darüber hinauszusehen, drei Praxisfilter: Abstand zum Mittel der übrigen Angebote (das Angebot drückt seine eigene Referenz nicht), die Tukey-Grenze Q1 − 1,5·IQR (robust gegen Ausreißer, schwach bei weniger als fünf Angeboten) und die Kostenschätzung. Es sind änderbare Lernannahmen, kein Recht: ein Signal stellt die Frage, die Aufklärung beantwortet sie.',
                  'Waar de 15 %-regel niet geldt, of om verder te kijken, drie praktijkfilters: afstand tot het gemiddelde van de andere offertes (de offerte trekt haar eigen referentie niet omlaag), de Tukey-grens Q1 − 1,5·IQR (robuust tegen uitschieters, zwak bij minder dan vijf offertes) en de raming. Het zijn aanpasbare leeraannames, geen recht: een signaal stelt de vraag, de verantwoording beantwoordt ze.',
                  'Là où la règle des 15 % ne s’applique pas, ou pour voir au-delà, trois filtres de pratique : l’écart à la moyenne des autres offres (l’offre ne tire pas sa propre référence vers le bas), la borne de Tukey Q1 − 1,5·IQR (robuste aux valeurs extrêmes, faible sous cinq offres) et l’estimation. Ce sont des hypothèses pédagogiques modifiables, pas du droit : un signal pose la question, la justification y répond.',
                  'Donde no rige la regla del 15 %, o para mirar más allá, tres filtros de práctica: distancia a la media de las demás ofertas (la oferta no rebaja su propia referencia), el límite de Tukey Q1 − 1,5·IQR (robusto ante atípicos, débil con menos de cinco ofertas) y el presupuesto. Son supuestos didácticos editables, no derecho: una señal plantea la pregunta y la justificación la responde.',
                  'Gdy reguła 15 % nie obowiązuje lub by spojrzeć szerzej — trzy filtry z praktyki: odległość od średniej pozostałych ofert (oferta nie zaniża własnego odniesienia), granica Tukeya Q1 − 1,5·IQR (odporna na wartości odstające, słaba przy mniej niż pięciu ofertach) i wartość szacunkowa. To edytowalne założenia dydaktyczne, nie prawo: sygnał stawia pytanie, wyjaśnienia na nie odpowiadają.') },
        lines: { title: T('Unit prices and negligible lines', 'Ціни за одиницю та неістотні позиції', 'Einheitspreise und unerhebliche Positionen', 'Eenheidsprijzen en verwaarloosbare posten', 'Prix unitaires et postes négligeables', 'Precios unitarios y partidas despreciables', 'Ceny jednostkowe i pozycje nieistotne'),
          body: T('Art. 36 §3, 1° lets the authority reject an offer because one or more non-negligible lines are abnormal, even when the total is not. Each unit price is compared with the median of that line (robust: one odd price does not move it); lines below the negligible share are ignored (no justification is needed for negligible items, §2). Re-pricing the flagged lines at the median shows how much of the gap they explain; high lines next to low ones point to an unbalanced bid.',
                  'Ст. 36 §3, 1° дозволяє відхилити пропозицію через аномальність однієї чи кількох істотних позицій, навіть якщо загальна сума нормальна. Кожну ціну за одиницю порівнюють із медіаною позиції (стійко: одна дивна ціна її не зсуває); позиції з часткою нижче порогу ігнорують (для неістотних позицій обґрунтування не потрібне, §2). Перерахунок позначених позицій за медіаною показує, яку частку розриву вони пояснюють; високі позиції поруч із низькими вказують на розбалансовану пропозицію.',
                  'Art. 36 §3, 1° erlaubt den Ausschluss, weil eine oder mehrere nicht unerhebliche Positionen ungewöhnlich sind, auch wenn die Summe es nicht ist. Jeder Einheitspreis wird mit dem Median der Position verglichen (robust: ein Ausreißer verschiebt ihn nicht); Positionen unter dem Anteil der Unerheblichkeit bleiben außen vor (für unerhebliche Posten keine Aufklärung, §2). Die markierten Positionen zum Median neu bepreist zeigen, welchen Teil des Abstands sie erklären; hohe neben niedrigen Positionen deuten auf ein spekulatives Angebot.',
                  'Art. 36 §3, 1° laat toe een offerte te weren omdat een of meer niet-verwaarloosbare posten abnormaal zijn, ook als het totaal dat niet is. Elke eenheidsprijs wordt vergeleken met de mediaan van de post (robuust: één vreemde prijs verschuift ze niet); posten onder het verwaarloosbare aandeel tellen niet (voor verwaarloosbare posten hoeft geen verantwoording, §2). De gemarkeerde posten tegen de mediaan herrekend tonen welk deel van het verschil ze verklaren; hoge posten naast lage wijzen op een onevenwichtige offerte.',
                  'L’art. 36 §3, 1° permet d’écarter une offre parce qu’un ou plusieurs postes non négligeables sont anormaux, même si le total ne l’est pas. Chaque prix unitaire est comparé à la médiane du poste (robuste : un prix isolé ne la déplace pas) ; les postes sous la part négligeable sont ignorés (pas de justification pour les postes négligeables, §2). Reprendre les postes signalés à la médiane montre quelle part de l’écart ils expliquent ; des postes hauts à côté de postes bas trahissent une offre déséquilibrée.',
                  'El art. 36 §3, 1° permite rechazar una oferta porque una o varias partidas no despreciables son anormales, aunque el total no lo sea. Cada precio unitario se compara con la mediana de la partida (robusta: un precio raro no la mueve); se ignoran las partidas por debajo de la cuota despreciable (no hace falta justificar partidas despreciables, §2). Repreciar a la mediana las partidas señaladas muestra qué parte de la diferencia explican; partidas altas junto a bajas apuntan a una oferta desequilibrada.',
                  'Art. 36 §3, 1° pozwala odrzucić ofertę, bo jedna lub więcej istotnych pozycji ma nienormalną (zaniżoną lub zawyżoną) wysokość, nawet gdy suma jej nie ma. Każdą cenę jednostkową porównuje się z medianą pozycji (odporną: jedna dziwna cena jej nie przesuwa); pozycje poniżej progu nieistotności pomija się (dla pozycji nieistotnych wyjaśnienia nie są wymagane, §2). Przeliczenie oznaczonych pozycji według mediany pokazuje, jaką część różnicy tłumaczą; wysokie pozycje obok niskich wskazują na ofertę niezrównoważoną.') },
        enquiry: { title: T('The enquiry: 12 days, in writing', 'Запит: 12 днів, письмово', 'Die Aufklärung: 12 Tage, schriftlich', 'De bevraging: 12 dagen, schriftelijk', 'L’examen : 12 jours, par écrit', 'La solicitud: 12 días, por escrito', 'Wezwanie: 12 dni, na piśmie'),
          body: T('The authority asks in writing for the composition of the price within 12 days unless the invitation sets a longer period (shorter only in the negotiated procedure without publication, with a motivated clause); the bidder must prove that it sent the answer. A second, shorter round is possible. Information not coming from the bidder may be used if the bidder can react to it.',
                  'Замовник письмово запитує склад ціни з відповіддю протягом 12 днів, якщо запит не встановлює довшого строку (коротший — лише в переговорній процедурі без оприлюднення з умотивованим положенням); учасник має довести, що надіслав відповідь. Можливий другий, коротший раунд. Можна використовувати інформацію не від учасника, якщо він може на неї відповісти.',
                  'Der Auftraggeber verlangt schriftlich die Zusammensetzung des Preises binnen 12 Tagen, sofern die Aufforderung keine längere Frist setzt (kürzer nur im Verhandlungsverfahren ohne Bekanntmachung mit begründeter Klausel); der Bieter muss die Absendung beweisen. Eine zweite, kürzere Runde ist möglich. Informationen Dritter dürfen genutzt werden, wenn der Bieter dazu Stellung nehmen kann.',
                  'De aanbestedende overheid vraagt schriftelijk de samenstelling van de prijs binnen 12 dagen, tenzij de uitnodiging een langere termijn bepaalt (korter enkel in de onderhandelingsprocedure zonder bekendmaking, met een uitdrukkelijk gemotiveerde bepaling); de inschrijver draagt de bewijslast van de verzending. Een tweede, kortere ronde kan. Inlichtingen die niet van de inschrijver komen mogen gebruikt worden als hij erop kan reageren.',
                  'Le pouvoir adjudicateur demande par écrit la composition du prix dans un délai de 12 jours, sauf délai plus long dans l’invitation (plus court seulement en procédure négociée sans publication, par une disposition motivée) ; la preuve de l’envoi incombe au soumissionnaire. Un second tour plus court est possible. Des informations ne provenant pas du soumissionnaire peuvent être utilisées s’il peut y réagir.',
                  'El poder adjudicador pide por escrito la composición del precio en 12 días salvo plazo mayor en la invitación (menor solo en el negociado sin publicidad, con cláusula motivada); el licitador debe probar el envío. Cabe una segunda ronda más corta. Puede usarse información que no proceda del licitador si este puede responder a ella.',
                  'Zamawiający wzywa na piśmie do przedstawienia składu ceny w ciągu 12 dni, chyba że wezwanie przewiduje dłuższy termin (krótszy tylko w procedurze negocjacyjnej bez ogłoszenia, z umotywowanym postanowieniem); wykonawca musi udowodnić wysłanie odpowiedzi. Możliwa jest druga, krótsza runda. Można korzystać z informacji spoza wykonawcy, jeśli może się do nich odnieść.') },
        grounds: { title: T('What a justification can rely on', 'На що може спиратися обґрунтування', 'Worauf eine Aufklärung sich stützen kann', 'Waarop een verantwoording kan steunen', 'Sur quoi une justification peut s’appuyer', 'En qué puede basarse una justificación', 'Na czym mogą opierać się wyjaśnienia'),
          body: T('Art. 36 §2: 1° efficiency of the construction or production process, 2° technical solutions or exceptionally favourable conditions, 3° originality, 4° lawful State aid; and always compliance with social, labour and environmental law (wages, social security, welfare at work). Good evidence is specific: supplier quotes, crew sizes and productivity, equipment already owned, a site nearby, not a general statement of commitment.',
                  'Ст. 36 §2: 1° ефективність будівельного чи виробничого процесу, 2° технічні рішення або винятково сприятливі умови, 3° оригінальність, 4° правомірна державна допомога; і завжди дотримання соціального, трудового й екологічного права (зарплати, соцзабезпечення, безпека праці). Добрі докази конкретні: комерційні пропозиції постачальників, склад бригад і продуктивність, власна техніка, близький об’єкт, а не загальна заява про зобов’язання.',
                  'Art. 36 §2: 1° Wirtschaftlichkeit des Bau- oder Fertigungsverfahrens, 2° technische Lösungen oder außergewöhnlich günstige Bedingungen, 3° Originalität, 4° rechtmäßige Beihilfe; und stets die Einhaltung von Sozial-, Arbeits- und Umweltrecht (Löhne, Sozialversicherung, Arbeitsschutz). Gute Nachweise sind konkret: Lieferantenangebote, Kolonnenstärken und Leistungswerte, eigenes Gerät, nahe Baustelle, keine allgemeine Zusicherung.',
                  'Art. 36 §2: 1° doelmatigheid van het bouw- of productieproces, 2° technische oplossingen of uitzonderlijk gunstige omstandigheden, 3° originaliteit, 4° rechtmatige overheidssteun; en altijd de naleving van sociaal, arbeids- en milieurecht (lonen, sociale zekerheid, welzijn op het werk). Goed bewijs is concreet: offertes van leveranciers, ploegsamenstelling en rendement, eigen materieel, een werf in de buurt, geen algemene verklaring van engagement.',
                  'Art. 36 §2 : 1° économie du procédé de construction ou de fabrication, 2° solutions techniques ou conditions exceptionnellement favorables, 3° originalité, 4° aide publique légale ; et toujours le respect du droit social, du travail et de l’environnement (salaires, sécurité sociale, bien-être au travail). Une bonne preuve est concrète : offres de fournisseurs, composition des équipes et rendements, matériel en propre, chantier voisin, pas une déclaration générale d’engagement.',
                  'Art. 36 §2: 1° economía del proceso de construcción o fabricación, 2° soluciones técnicas o condiciones excepcionalmente favorables, 3° originalidad, 4° ayuda pública legal; y siempre el cumplimiento del derecho social, laboral y medioambiental (salarios, seguridad social, bienestar laboral). Una buena prueba es concreta: ofertas de proveedores, cuadrillas y rendimientos, maquinaria propia, obra cercana, no una declaración genérica de compromiso.',
                  'Art. 36 §2: 1° oszczędność metody wykonania lub produkcji, 2° rozwiązania techniczne lub wyjątkowo korzystne warunki, 3° oryginalność, 4° zgodna z prawem pomoc publiczna; i zawsze przestrzeganie prawa pracy, socjalnego i ochrony środowiska (płace, ubezpieczenia, BHP). Dobre dowody są konkretne: oferty dostawców, składy brygad i wydajności, własny sprzęt, bliska budowa, a nie ogólne zapewnienie.') },
        outcome: { title: T('Decision and notifications', 'Рішення та повідомлення', 'Entscheidung und Meldungen', 'Beslissing en meldingen', 'Décision et communications', 'Decisión y comunicaciones', 'Decyzja i zawiadomienia'),
          body: T('Art. 36 §3: reject because a non-negligible line is abnormal (1°), reject because the total is abnormal (2°), or motivate in the award decision that the total is not abnormal (3°). Rejection is mandatory when the price is abnormally low through breach of social, labour or environmental obligations; for State aid only after consulting the bidder. §5: every rejection is reported to the auditor-general of the Belgian Competition Authority, breaches of federal social or labour law also to SIOD, State aid to the European Commission, works rejected for an abnormally low price to the Commission for the accreditation of contractors.',
                  'Ст. 36 §3: відхилити через аномальність істотної позиції (1°), відхилити через аномальність загальної суми (2°) або обґрунтувати в рішенні, що сума не аномальна (3°). Відхилення обов’язкове, коли ціна аномально низька через порушення соціальних, трудових чи екологічних зобов’язань; через державну допомогу — лише після консультації з учасником. §5: про кожне відхилення повідомляють генерального аудитора Бельгійського органу з питань конкуренції, про порушення федерального соціального чи трудового права — ще й SIOD, про допомогу — Європейську комісію, у разі робіт, відхилених через аномально низьку ціну, — Комісію з атестації підрядників.',
                  'Art. 36 §3: Ausschluss wegen einer ungewöhnlichen nicht unerheblichen Position (1°), Ausschluss wegen ungewöhnlicher Gesamtsumme (2°) oder Begründung in der Zuschlagsentscheidung, dass die Summe nicht ungewöhnlich ist (3°). Zwingend ist der Ausschluss, wenn der Preis durch Verstöße gegen Sozial-, Arbeits- oder Umweltrecht ungewöhnlich niedrig ist; bei Beihilfen nur nach Rücksprache mit dem Bieter. §5: jeder Ausschluss wird dem Generalauditor der Belgischen Wettbewerbsbehörde gemeldet, Verstöße gegen föderales Sozial- oder Arbeitsrecht zusätzlich dem SIOD, Beihilfen der Europäischen Kommission, wegen ungewöhnlich niedrigen Preises ausgeschlossene Bauleistungen der Zulassungskommission für Bauunternehmer.',
                  'Art. 36 §3: weren omdat een niet-verwaarloosbare post abnormaal is (1°), weren omdat het totale offertebedrag abnormaal is (2°), of in de gunningsbeslissing motiveren dat het totaal niet abnormaal is (3°). Weren is verplicht wanneer de prijs abnormaal laag is door niet-naleving van sociaal, arbeids- of milieurecht; bij overheidssteun enkel na overleg met de inschrijver. §5: elke wering wordt gemeld aan de auditeur-generaal van de Belgische Mededingingsautoriteit, schendingen van het federaal sociaal of arbeidsrecht ook aan de SIOD, overheidssteun aan de Europese Commissie, werken geweerd wegens een abnormaal lage prijs aan de Commissie voor de erkenning van aannemers.',
                  'Art. 36 §3 : écarter parce qu’un poste non négligeable est anormal (1°), écarter parce que le montant total est anormal (2°), ou motiver dans la décision d’attribution que le total n’est pas anormal (3°). L’éviction est obligatoire si le prix est anormalement bas par manquement au droit social, du travail ou de l’environnement ; pour une aide publique seulement après consultation du soumissionnaire. §5 : toute éviction est communiquée à l’auditeur général de l’Autorité belge de la concurrence, les manquements au droit social ou du travail fédéral aussi au SIRS, les aides à la Commission européenne, les travaux écartés pour prix anormalement bas à la Commission d’agréation des entrepreneurs.',
                  'Art. 36 §3: rechazar porque una partida no despreciable es anormal (1°), rechazar porque el total es anormal (2°), o motivar en la decisión de adjudicación que el total no es anormal (3°). El rechazo es obligatorio si el precio es anormalmente bajo por incumplir obligaciones sociales, laborales o medioambientales; por ayudas públicas solo tras consultar al licitador. §5: todo rechazo se comunica al auditor general de la Autoridad belga de la competencia, los incumplimientos del derecho social o laboral federal también al SIOD, las ayudas a la Comisión Europea y las obras rechazadas por precio anormalmente bajo a la Comisión de clasificación de contratistas.',
                  'Art. 36 §3: odrzucić, bo istotna pozycja ma nienormalną wysokość (1°), odrzucić, bo cena całkowita ma nienormalną wysokość (2°), albo uzasadnić w decyzji, że cena całkowita nie jest nienormalna (3°). Odrzucenie jest obowiązkowe, gdy cena jest rażąco niska z powodu naruszenia prawa pracy, socjalnego lub środowiska; przy pomocy publicznej dopiero po konsultacji z wykonawcą. §5: każde odrzucenie zgłasza się audytorowi generalnemu belgijskiego organu ochrony konkurencji, naruszenia federalnego prawa socjalnego lub prawa pracy także do SIOD, pomoc publiczną do Komisji Europejskiej, a roboty odrzucone z powodu rażąco niskiej ceny do Komisji ds. uznawania wykonawców.') }
      },

  /* ======================================================= 3. the data layer */
  function buildRecord() {
    if (!last) return null;
    var inputs = {}, outputs = {}, units = {}, warnings = [];
    ['ref', 'title', 'assessor', 'regime', 'kind', 'procedure', 'basis', 'priceWeight', 'docThreshold', 'fraudSensitive', 'madeApplicable', 'keepInNegotiated', 'valueEst',
     'lineLow', 'lineHigh', 'lineMinShare', 'iqrK', 'othersDev', 'estimate', 'estDev', 'reqDate', 'days'].forEach(function (k) { inputs[k] = state[k]; });
    inputs.offers = (state.bids || []).map(function (b) { return { id: b.id, name: b.name, total: b.total, irregular: !!b.irregular }; });
    inputs.lines = (state.lines || []).map(function (l) { return { id: l.id, desc: l.desc, qty: l.qty, unit: l.unit, prices: JSON.parse(JSON.stringify(l.prices || {})) }; });
    ['priceWeight', 'docThreshold', 'lineLow', 'lineHigh', 'lineMinShare', 'othersDev', 'estDev'].forEach(function (k) { units[k] = '%'; });
    units.valueEst = 'EUR'; units.estimate = 'EUR'; units.days = 'd';
    if (last.ok) {
      var R = last;
      outputs.rule = R.mode ? R.mode.mode : 'n/a (' + R.regime + ')';
      if (R.mode) outputs.rule_reasons = R.mode.reasons.join(', ');
      if (R.art36) { outputs.art36_mean = R.art36.mean; outputs.art36_limit = R.art36.limit; outputs.art36_threshold = R.art36.threshold; outputs.art36_excluded = R.art36.low.concat(R.art36.high).join(', '); units.art36_mean = units.art36_limit = 'EUR'; }
      outputs.mean = R.stats.mean; outputs.median = R.stats.median; outputs.iqr_fence = R.stats.fence; units.mean = units.median = units.iqr_fence = 'EUR';
      outputs.enquiry_mandatory = R.must.join(', ');
      outputs.enquiry_advised = R.should.join(', ');
      outputs.watch = R.watch.join(', ');
      R.bids.forEach(function (b) { outputs['offer_' + b.id] = b.flag + (b.reasons && b.reasons.length ? ' [' + b.reasons.join(' ') + ']' : ''); });
      if (R.high && R.high.length) outputs.high_totals = R.high.join(', ');
      if (R.lines.length) {
        var nm = {}; R.bids.forEach(function (b) { nm[b.id] = b.name; });
        var fl = [];
        R.lines.forEach(function (ln) { Object.keys(ln.cells).forEach(function (bid) { var c = ln.cells[bid]; if (c.flag) fl.push(ln.id + ' ' + (nm[bid] || bid) + ': ' + c.up + ' vs median ' + ln.median + ' (' + (Math.round(c.dev * 1000) / 10) + ' %, ' + c.flag + ')'); }); });
        outputs.lines_flagged = fl.join('; ') || 'none';
        outputs.lines_negligible = R.lines.filter(function (ln) { return ln.negligible; }).map(function (ln) { return ln.id; }).join(', ') || 'none';
        outputs.line_base_at_median = R.lineBase; units.line_base_at_median = 'EUR';
        R.bids.forEach(function (b) {
          if (b.linesLow && b.linesLow.length) { outputs['total_at_median_' + b.id] = b.totalAtMedian; units['total_at_median_' + b.id] = 'EUR'; if (b.gapExplained != null) outputs['gap_explained_' + b.id] = b.gapExplained; }
          if (b.lineCoverage != null) outputs['line_coverage_' + b.id] = b.lineCoverage;
        });
        outputs.line_table = R.lines.map(function (ln) { var o = { line: ln.id, desc: ln.desc, qty: ln.qty, unit: ln.unit, median: ln.median, share: ln.share, negligible: ln.negligible, offers: {} };
          Object.keys(ln.cells).forEach(function (bid) { o.offers[bid] = { unit_price: ln.cells[bid].up, dev: ln.cells[bid].dev, flag: ln.cells[bid].flag }; }); return o; });
      }
      var id = curJ(); if (id) { var O = outcomeFor(state, id), DI = lib().deadlineInfo ? lib().deadlineInfo(state.reqDate, n(state.days)) : null; outputs.enquiry_offer = id; outputs.enquiry_outcome = O.decision + ' (' + O.article + ')'; outputs.notify = O.notify.join(', '); outputs.answer_due = DI ? DI.due : lib().deadline(state.reqDate, n(state.days)); if (DI && DI.rolled) outputs.answer_due_calendar_end = DI.calendar + ' (not a working day; Reg. 1182/71 art. 3)'; }
      warnings.push('Screens (mean of the others, IQR fence, estimate, line limits, negligible share) are practice values / learning assumptions, not legal thresholds.');
      warnings.push('Engineering and commercial analysis, not legal advice.');
    } else warnings.push('invalid input: ' + (last.errors || []).join(', '));
    return {
      inputs: inputs, outputs: outputs, units: units,
      model: {
        equations: ['KB 18.04.2017 art. 36 §4: mean without the lowest offer and the highest ceil(n/4) offers (n >= 7) or without the lowest and highest (n < 7); enquiry for every offer <= mean x (1 - t), t = 15 % (higher only by the documents in the price-quality case)',
                    'Applicability: works or fraud-sensitive services (or extended by the documents, price only), open/restricted, >= 4 offers, price only or price >= 50 %; §6 exemption for negotiated procedures (supplies/services below the EU threshold, works < 500 000 EUR)',
                    'Screens: mean of the other offers, Tukey fence Q1 - k IQR (linear percentiles), owner estimate; unit price vs line median, negligible lines by share of the median-priced total',
                    'Outcome: art. 36 §3 1°/2°/3°, mandatory rejection for art. 7 breaches, notifications §5'],
        ranges: ['up to 40 offers, 300 lines'],
        notes: ['amounts in EUR excl. VAT after arithmetic correction', 'answer period per Wet 17.06.2016 art. 167 and Reg. 1182/71 art. 3: calendar days, the request day not counted, a last day on a Saturday, Sunday or Belgian public holiday moves to the next working day', 'a line without a quantity counts as 1 lump sum; abnormally high totals (Q3 + k IQR, mean of the others) are flagged apart (art. 36 §1)']
      },
      warnings: warnings
    };
  }
  /* permalink / record import: known keys only, numbers in range, enums checked, arrays bounded */
  var ENUM = { regime: ['be', 'eu', 'private'], kind: ['works', 'supplies', 'services'], procedure: ['open', 'restricted', 'competitive-negotiation', 'negotiated-with-publication', 'negotiated-without-publication', 'competitive-dialogue', 'innovation-partnership'],
               buyer: ['central', 'sub-central'], basis: ['price', 'pq'] };
  var LIM = { priceWeight: [0, 100], docThreshold: [15, 60], valueEst: [0, 1e11], lineLow: [1, 99], lineHigh: [1, 1000], lineMinShare: [0, 50], iqrK: [0, 10], othersDev: [0, 90], estimate: [0, 1e11], estDev: [0, 90], days: [1, 120] };
  var JKEYS = ['g1', 'g2', 'g3', 'g4', 'social'], JFLAGS = ['received', 'lineAbnormal', 'totalAbnormal', 'high', 'socialBreach', 'envOnly', 'stateAid'];
  function safeId(v) { var s = String(v == null ? '' : v).slice(0, 40); return /^(__proto__|constructor|prototype)$/.test(s) ? '' : s; }
  function sanitize(o) {
    var out = {};
    if (!o || typeof o !== 'object' || Array.isArray(o)) return out;
    Object.keys(DEFAULTS).forEach(function (k) {
      if (!Object.prototype.hasOwnProperty.call(o, k)) return;
      var v = o[k];
      if (ENUM[k]) { if (ENUM[k].indexOf(String(v)) >= 0) out[k] = String(v); return; }
      if (LIM[k]) { if (v === null) { out[k] = null; return; } v = n(v); if (v != null && v >= LIM[k][0] && v <= LIM[k][1]) out[k] = v; return; }
      if (['fraudSensitive', 'madeApplicable', 'keepInNegotiated'].indexOf(k) >= 0) { out[k] = v === true; return; }
      if (k === 'bids') {
        if (!Array.isArray(v)) return;
