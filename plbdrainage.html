  "description": {
    "en": "Describe the drainage as a tree of pipes — branches, stacks and drains — and connect fixtures to them, or load an example or the fixtures of the plumbing project. The tool adds the discharge units of every pipe upstream, applies the frequency factor K, picks the smallest admissible diameter from the EN 12056-2 tables (with the WC and no-reduction rules), checks the length, bends, drop and gradient of unventilated branches, sizes stacks for square or swept entries and primary or secondary ventilation, and solves every drain for its filling degree and velocity — so you see where a size is decided by capacity, by a WC, by venting or by self-cleansing.",
    "uk": "Опишіть каналізацію як дерево труб — відгалуження, стояки й лежаки — і приєднайте до них прилади, або завантажте приклад чи прилади з проєкту. Інструмент підсумовує DU кожної труби вгору за течією, застосовує коефіцієнт K, вибирає найменший допустимий діаметр за таблицями EN 12056-2 (з правилами для унітазів і без зменшення діаметра), перевіряє довжину, відводи, перепад і ухил невентильованих відгалужень, підбирає стояки для прямих чи плавних приєднань і первинної чи вторинної вентиляції та розраховує наповнення й швидкість у кожному лежаку — видно, де розмір визначає пропускна здатність, унітаз, вентиляція чи самоочищення.",
    "de": "Beschreiben Sie die Entwässerung als Baum von Leitungen — Anschluss-, Fall- und Sammelleitungen — und schließen Sie Entwässerungsgegenstände an, oder laden Sie ein Beispiel bzw. die Objekte aus dem Sanitärprojekt. Das Werkzeug summiert die DU jeder Leitung stromaufwärts, wendet die Abflusskennzahl K an, wählt den kleinsten zulässigen Durchmesser aus den Tabellen der EN 12056-2 (mit WC-Regel und ohne Querschnittsverringerung), prüft Länge, Bögen, Gefälle und Fallhöhe unbelüfteter Anschlussleitungen, bemisst Fallleitungen für Abzweige mit und ohne Innenradius sowie Haupt- oder Nebenlüftung und löst jede Sammelleitung nach Füllungsgrad und Geschwindigkeit — so sehen Sie, ob Kapazität, WC, Lüftung oder Selbstreinigung die Dimension bestimmt.",
    "nl": "Beschrijf de afvoer als een boom van leidingen — aansluitleidingen, standleidingen en verzamelleidingen — en sluit er toestellen op aan, of laad een voorbeeld of de toestellen van het sanitairproject. De tool telt de DU van elke leiding stroomopwaarts op, past de gelijktijdigheidsfactor K toe, kiest de kleinste toelaatbare diameter uit de tabellen van EN 12056-2 (met de WC-regel en zonder verkleining), controleert lengte, bochten, val en afschot van niet-geventileerde aansluitleidingen, dimensioneert standleidingen voor haakse of vloeiende aansluitingen en primaire of secundaire ontluchting en berekent voor elke verzamelleiding vullingsgraad en snelheid — zo ziet u of capaciteit, een WC, ontluchting of zelfreiniging de diameter bepaalt.",
    "fr": "Décrivez l’évacuation comme un arbre de tuyaux — branchements, chutes et collecteurs — et raccordez-y les appareils, ou chargez un exemple ou les appareils du projet sanitaire. L’outil cumule les DU de chaque tuyau vers l’amont, applique le coefficient K, choisit le plus petit diamètre admissible dans les tableaux de l’EN 12056-2 (avec la règle des WC et sans réduction), vérifie longueur, coudes, chute et pente des branchements non ventilés, dimensionne les chutes pour culottes droites ou à rayon et ventilation primaire ou secondaire, et résout chaque collecteur en taux de remplissage et vitesse — on voit si le diamètre est fixé par la capacité, un WC, la ventilation ou l’autocurage.",
    "es": "Describa el saneamiento como un árbol de tuberías — derivaciones, bajantes y colectores — y conecte los aparatos, o cargue un ejemplo o los aparatos del proyecto de fontanería. La herramienta suma las DU de cada tubería aguas arriba, aplica el factor K, elige el menor diámetro admisible de las tablas de EN 12056-2 (con la regla del inodoro y sin reducción), comprueba longitud, codos, caída y pendiente de las derivaciones no ventiladas, dimensiona las bajantes para entronques rectos o curvos y ventilación primaria o secundaria, y resuelve cada colector en grado de llenado y velocidad: así se ve si el diámetro lo decide la capacidad, un inodoro, la ventilación o el autolimpiado.",
    "pl": "Opisz kanalizację jako drzewo przewodów — podejścia, piony i przewody zbiorcze — i podłącz do nich przybory, albo wczytaj przykład lub przybory z projektu instalacji. Narzędzie sumuje DU każdego przewodu w górę strumienia, stosuje współczynnik K, wybiera najmniejszą dopuszczalną średnicę z tablic EN 12056-2 (z zasadą dla misek ustępowych i bez redukcji średnicy), sprawdza długość, kolana, spadek i różnicę wysokości podejść niewentylowanych, dobiera piony dla trójników prostych lub łukowych oraz wentylacji głównej lub równoległej i rozwiązuje każdy przewód zbiorczy na napełnienie i prędkość — widać, czy o średnicy decyduje przepustowość, miska ustępowa, wentylacja czy samooczyszczanie."

    "en": "Gravity sanitary drainage only (no rainwater, no siphonic or pressure drainage), one frequency factor K for the whole system, steady design flows (no surge, no hydraulic jump), stacks without offsets. Branch tables and limits for systems I, II and IV (EN 12056-2 Tables 4, 5, 7, 8); system III gets DU, stacks and drains (its per-appliance Tables 6 and 9 are not checked). The EN 12056-2:2000 tables are checked against the standard text; the national edition (NBN EN 12056-2, DIN 1986-100, BS EN 12056-2) is binding and may be stricter. Drain capacity uses Prandtl–Colebrook with the hydraulic diameter, a few per cent from the Annex B tables. Self-cleansing velocity 0.7 m/s is a learning assumption.",
    "uk": "Лише самопливна побутова каналізація (без дощової, сифонної чи напірної), один коефіцієнт K для всієї системи, усталені розрахункові витрати (без хвиль і гідравлічного стрибка), стояки без відступів. Таблиці й обмеження відгалужень для систем I, II та IV (табл. 4, 5, 7, 8 EN 12056-2); для системи III — DU, стояки й лежаки (її табл. 6 і 9 за приладами не перевіряються). Таблиці EN 12056-2:2000 звірено з текстом стандарту; обов’язковим є національне видання (NBN EN 12056-2, DIN 1986-100, BS EN 12056-2), яке може бути суворішим. Пропускна здатність лежаків — за Прандтлем–Колбруком з гідравлічним діаметром, на кілька відсотків відрізняється від таблиць додатка B. Швидкість самоочищення 0,7 м/с — навчальне припущення.",
    "de": "Nur Schwerkraft-Schmutzwasser (kein Regenwasser, keine Druck- oder Unterdruckentwässerung), eine Abflusskennzahl K für die ganze Anlage, stationäre Bemessungsabflüsse (kein Schwall, kein Wechselsprung), Fallleitungen ohne Verziehungen. Tabellen und Grenzen der Anschlussleitungen für die Systeme I, II und IV (EN 12056-2 Tabellen 4, 5, 7, 8); System III erhält DU, Fall- und Sammelleitungen (seine Tabellen 6 und 9 je Gegenstand werden nicht geprüft). Die Tabellen der EN 12056-2:2000 sind am Normtext geprüft; maßgebend ist die nationale Fassung (DIN EN 12056-2 mit DIN 1986-100, NBN EN 12056-2, BS EN 12056-2), die strenger sein kann. Die Kapazität der Sammelleitungen nach Prandtl–Colebrook mit hydraulischem Durchmesser weicht wenige Prozent von den Tabellen in Anhang B ab. Die Selbstreinigungsgeschwindigkeit 0,7 m/s ist eine Lernannahme.",
    "nl": "Alleen vrijverval-afvalwater (geen hemelwater, geen onderdruk- of drukafvoer), één factor K voor het hele systeem, stationaire ontwerpdebieten (geen golven, geen watersprong), standleidingen zonder verspringingen. Tabellen en grenzen van aansluitleidingen voor systemen I, II en IV (EN 12056-2 tabellen 4, 5, 7, 8); systeem III krijgt DU, standleidingen en verzamelleidingen (zijn tabellen 6 en 9 per toestel worden niet gecontroleerd). De tabellen van EN 12056-2:2000 zijn gecontroleerd aan de normtekst; de nationale uitgave (NBN EN 12056-2, DIN 1986-100, BS EN 12056-2) is bindend en kan strenger zijn. De capaciteit van verzamelleidingen volgens Prandtl–Colebrook met de hydraulische diameter wijkt enkele procenten af van de tabellen in bijlage B. Zelfreinigingssnelheid 0,7 m/s is een leeraanname.",
    "fr": "Évacuation gravitaire des eaux usées uniquement (pas d’eaux pluviales, ni siphoïde ni sous pression), un seul coefficient K pour tout le système, débits de calcul permanents (pas de coup de bélier ni de ressaut), chutes sans dévoiement. Tableaux et limites des branchements pour les systèmes I, II et IV (EN 12056-2 tableaux 4, 5, 7, 8) ; le système III reçoit DU, chutes et collecteurs (ses tableaux 6 et 9 par appareil ne sont pas vérifiés). Les tableaux de l’EN 12056-2:2000 sont vérifiés sur le texte de la norme ; l’édition nationale (NBN EN 12056-2, DIN 1986-100, BS EN 12056-2) fait foi et peut être plus stricte. La capacité des collecteurs par Prandtl–Colebrook avec le diamètre hydraulique s’écarte de quelques pour cent des tableaux de l’annexe B. La vitesse d’autocurage de 0,7 m/s est une hypothèse pédagogique.",
    "es": "Solo saneamiento por gravedad de aguas residuales (sin pluviales, sin sifónico ni a presión), un solo factor K para todo el sistema, caudales de cálculo estacionarios (sin oleaje ni resalto hidráulico), bajantes sin desvíos. Tablas y límites de derivaciones para los sistemas I, II y IV (EN 12056-2 tablas 4, 5, 7, 8); el sistema III obtiene DU, bajantes y colectores (sus tablas 6 y 9 por aparato no se comprueban). Las tablas de EN 12056-2:2000 están comprobadas con el texto de la norma; la edición nacional (UNE EN 12056-2, NBN EN 12056-2, DIN 1986-100) es la vinculante y puede ser más estricta. La capacidad de los colectores por Prandtl–Colebrook con el diámetro hidráulico difiere unos pocos por ciento de las tablas del anexo B. La velocidad de autolimpiado de 0,7 m/s es un supuesto didáctico.",
    "pl": "Tylko grawitacyjna kanalizacja bytowa (bez deszczowej, podciśnieniowej i ciśnieniowej), jeden współczynnik K dla całego systemu, ustalone przepływy obliczeniowe (bez fal i odskoku hydraulicznego), piony bez odsadzek. Tablice i ograniczenia podejść dla systemów I, II i IV (EN 12056-2 tablice 4, 5, 7, 8); system III otrzymuje DU, piony i przewody zbiorcze (jego tablice 6 i 9 dla przyborów nie są sprawdzane). Tablice EN 12056-2:2000 sprawdzono z tekstem normy; wiążące jest wydanie krajowe (PN-EN 12056-2, NBN EN 12056-2, DIN 1986-100), które może być ostrzejsze. Przepustowość przewodów zbiorczych wg Prandtla–Colebrooka ze średnicą hydrauliczną różni się o kilka procent od tablic załącznika B. Prędkość samooczyszczania 0,7 m/s to założenie dydaktyczne."

    'Varias salidas se unen fuera: para todo el edificio Qww = K·√ΣDU sobre todas las DU = %b l/s (menos que la suma %s l/s de las salidas).',
    'Kilka wylotów łączy się na zewnątrz: dla całego budynku Qww = K·√ΣDU ze wszystkich DU = %b l/s (mniej niż suma wylotów %s l/s).'),
  'n.handoff': T7('“Save to project” stores Qtot = %q l/s at the outlet for the lifting station (plbliftstation) if the drain lies below the backflow level.',
    '«Зберегти в проєкт» записує Qtot = %q л/с на випуску для насосної станції (plbliftstation), якщо лежак нижче рівня зворотного підпору.',
    '„Im Projekt speichern“ legt Qtot = %q l/s am Auslass für die Hebeanlage (plbliftstation) ab, falls die Leitung unter der Rückstauebene liegt.',
    '“Opslaan in project” bewaart Qtot = %q l/s aan de uitlaat voor het pompstation (plbliftstation) als de leiding onder het terugstuwpeil ligt.',
    '« Enregistrer dans le projet » stocke Qtot = %q l/s à la sortie pour le poste de relevage (plbliftstation) si le collecteur est sous le niveau de refoulement.',
    '«Guardar en el proyecto» almacena Qtot = %q l/s en la salida para la estación de bombeo (plbliftstation) si el colector queda bajo el nivel de reflujo.',
    '„Zapisz w projekcie” zapisuje Qtot = %q l/s na wylocie dla przepompowni (plbliftstation), jeśli przewód leży poniżej poziomu cofki.'),
  'fl.unvented_length': T7('Unventilated branch longer than EN 12056-2 Table 5 allows (system I 4 m, II and IV 10 m): %s — vent it, fit an AAV or move the stack closer.', 'Невентильоване відгалуження довше, ніж дозволяє табл. 5 EN 12056-2 (система I 4 м, II і IV 10 м): %s — вентилюйте його, встановіть AAV або наблизьте стояк.', 'Unbelüftete Anschlussleitung länger als nach EN 12056-2 Tabelle 5 zulässig (System I 4 m, II und IV 10 m): %s — belüften, Belüftungsventil setzen oder Fallleitung näher legen.', 'Niet-geventileerde aansluitleiding langer dan EN 12056-2 tabel 5 toelaat (systeem I 4 m, II en IV 10 m): %s — ventileer ze, plaats een beluchter of breng de standleiding dichterbij.', 'Branchement non ventilé plus long que ne le permet le tableau 5 de l’EN 12056-2 (système I 4 m, II et IV 10 m) : %s — ventilez-le, posez un clapet ou rapprochez la chute.', 'Derivación no ventilada más larga de lo que permite la tabla 5 de EN 12056-2 (sistema I 4 m, II y IV 10 m): %s — ventílela, instale una válvula AAV o acerque la bajante.', 'Podejście niewentylowane dłuższe, niż dopuszcza tablica 5 EN 12056-2 (system I 4 m, II i IV 10 m): %s — dodaj wentylację, zawór AAV lub przybliż pion.'),
  'fl.vented_length': T7('Ventilated branch longer than 10 m (EN 12056-2 Table 8, systems I and IV): %s.', 'Вентильоване відгалуження довше 10 м (табл. 8 EN 12056-2, системи I і IV): %s.', 'Belüftete Anschlussleitung länger als 10 m (EN 12056-2 Tabelle 8, Systeme I und IV): %s.', 'Geventileerde aansluitleiding langer dan 10 m (EN 12056-2 tabel 8, systemen I en IV): %s.', 'Branchement ventilé de plus de 10 m (EN 12056-2 tableau 8, systèmes I et IV) : %s.', 'Derivación ventilada de más de 10 m (EN 12056-2 tabla 8, sistemas I y IV): %s.', 'Podejście wentylowane dłuższe niż 10 m (EN 12056-2 tablica 8, systemy I i IV): %s.'),
  'fl.unvented_bends': T7('More 90° bends in an unventilated branch than EN 12056-2 Table 5 allows (systems I and IV 3, II 1; connection bend not counted): %s.', 'Більше відводів 90° у невентильованому відгалуженні, ніж дозволяє табл. 5 EN 12056-2 (системи I і IV — 3, II — 1; приєднувальний відвід не враховано): %s.', 'Mehr 90°-Bögen in einer unbelüfteten Anschlussleitung als nach EN 12056-2 Tabelle 5 zulässig (Systeme I und IV 3, II 1; Anschlussbogen nicht gezählt): %s.', 'Meer bochten van 90° in een niet-geventileerde aansluitleiding dan EN 12056-2 tabel 5 toelaat (systemen I en IV 3, II 1; aansluitbocht niet meegeteld): %s.', 'Plus de coudes à 90° dans un branchement non ventilé que ne le permet le tableau 5 de l’EN 12056-2 (systèmes I et IV 3, II 1 ; coude de raccordement non compté) : %s.', 'Más codos de 90° en una derivación no ventilada de los que permite la tabla 5 de EN 12056-2 (sistemas I y IV 3, II 1; sin contar el codo de conexión): %s.', 'Więcej kolan 90° w podejściu niewentylowanym, niż dopuszcza tablica 5 EN 12056-2 (systemy I i IV 3, II 1; kolano przyłączeniowe nie liczone): %s.'),
  'fl.unvented_drop': T7('Drop of an unventilated branch above EN 12056-2 Table 5 (systems I and IV 1 m; II 6 m above DN 70, 3 m at DN 70 — below DN 70 the 3 m is an assumption of the tool; footnote ** for DN ≤ 100 with a WC is not checked): %s.', 'Перепад невентильованого відгалуження більший, ніж за табл. 5 EN 12056-2 (системи I і IV 1 м; II 6 м понад DN 70, 3 м при DN 70 — нижче DN 70 3 м є припущенням інструмента; примітка ** для DN ≤ 100 з унітазом не перевіряється): %s.', 'Fallhöhe einer unbelüfteten Anschlussleitung über EN 12056-2 Tabelle 5 (Systeme I und IV 1 m; II 6 m über DN 70, 3 m bei DN 70 — unter DN 70 sind die 3 m eine Annahme des Werkzeugs; Fußnote ** für DN ≤ 100 mit WC wird nicht geprüft): %s.', 'Val van een niet-geventileerde aansluitleiding boven EN 12056-2 tabel 5 (systemen I en IV 1 m; II 6 m boven DN 70, 3 m bij DN 70 — onder DN 70 is 3 m een aanname van de tool; voetnoot ** voor DN ≤ 100 met een WC wordt niet gecontroleerd): %s.', 'Chute d’un branchement non ventilé au-delà du tableau 5 de l’EN 12056-2 (systèmes I et IV 1 m ; II 6 m au-delà de DN 70, 3 m à DN 70 — sous DN 70, les 3 m sont une hypothèse de l’outil ; la note ** pour DN ≤ 100 avec un WC n’est pas vérifiée) : %s.', 'Caída de una derivación no ventilada superior a la tabla 5 de EN 12056-2 (sistemas I y IV 1 m; II 6 m por encima de DN 70, 3 m en DN 70 — por debajo de DN 70 los 3 m son una hipótesis de la herramienta; la nota ** para DN ≤ 100 con inodoro no se comprueba): %s.', 'Spad podejścia niewentylowanego ponad tablicę 5 EN 12056-2 (systemy I i IV 1 m; II 6 m powyżej DN 70, 3 m przy DN 70 — poniżej DN 70 3 m to założenie narzędzia; przypis ** dla DN ≤ 100 z miską ustępową nie jest sprawdzany): %s.'),
  'fl.vented_drop': T7('Drop of a ventilated branch above 3 m (EN 12056-2 Table 8): %s.', 'Перепад вентильованого відгалуження понад 3 м (табл. 8 EN 12056-2): %s.', 'Fallhöhe einer belüfteten Anschlussleitung über 3 m (EN 12056-2 Tabelle 8): %s.', 'Val van een geventileerde aansluitleiding boven 3 m (EN 12056-2 tabel 8): %s.', 'Chute d’un branchement ventilé supérieure à 3 m (EN 12056-2 tableau 8) : %s.', 'Caída de una derivación ventilada superior a 3 m (EN 12056-2 tabla 8): %s.', 'Spad podejścia wentylowanego ponad 3 m (EN 12056-2 tablica 8): %s.'),
  'fl.branch_slope': T7('Branch gradient below the minimum of EN 12056-2 Tables 5 / 8 (systems I and IV 1 % unventilated, 0.5 % ventilated; system II 1.5 %): %s.', 'Ухил відгалуження нижче мінімуму за табл. 5 / 8 EN 12056-2 (системи I і IV 1 % без вентиляції, 0,5 % з вентиляцією; система II 1,5 %): %s.', 'Gefälle der Anschlussleitung unter dem Mindestwert nach EN 12056-2 Tabellen 5 / 8 (Systeme I und IV 1 % unbelüftet, 0,5 % belüftet; System II 1,5 %): %s.', 'Afschot van de aansluitleiding onder het minimum van EN 12056-2 tabellen 5 / 8 (systemen I en IV 1 % niet-geventileerd, 0,5 % geventileerd; systeem II 1,5 %): %s.', 'Pente du branchement sous le minimum des tableaux 5 / 8 de l’EN 12056-2 (systèmes I et IV 1 % non ventilé, 0,5 % ventilé ; système II 1,5 %) : %s.', 'Pendiente de la derivación bajo el mínimo de las tablas 5 / 8 de EN 12056-2 (sistemas I y IV 1 % no ventilada, 0,5 % ventilada; sistema II 1,5 %): %s.', 'Spadek podejścia poniżej minimum z tablic 5 / 8 EN 12056-2 (systemy I i IV 1 % niewentylowane, 0,5 % wentylowane; system II 1,5 %): %s.'),
  'fl.branch_tables_I_II': T7('System III: branch capacity NOT checked (EN 12056-2 gives system III only per-appliance limits, Tables 6 and 9) — the DN shown is only the smallest connection size: %s.', 'Система III: пропускну здатність відгалужень НЕ перевірено (для системи III EN 12056-2 дає лише обмеження за приладами, табл. 6 і 9) — показано лише найменший діаметр приєднання: %s.', 'System III: Leistungsfähigkeit der Anschlussleitungen NICHT geprüft (EN 12056-2 gibt für System III nur Grenzen je Gegenstand, Tabellen 6 und 9) — angezeigt ist nur die kleinste Anschlussnennweite: %s.', 'Systeem III: capaciteit van aansluitleidingen NIET gecontroleerd (EN 12056-2 geeft voor systeem III alleen grenzen per toestel, tabellen 6 en 9) — getoond is alleen de kleinste aansluitdiameter: %s.', 'Système III : capacité des branchements NON vérifiée (l’EN 12056-2 ne donne pour le système III que des limites par appareil, tableaux 6 et 9) — le DN affiché n’est que le plus petit diamètre de raccordement : %s.', 'Sistema III: capacidad de las derivaciones NO comprobada (EN 12056-2 solo da para el sistema III límites por aparato, tablas 6 y 9); el DN mostrado es solo el menor diámetro de conexión: %s.', 'System III: przepustowość podejść NIE sprawdzona (EN 12056-2 podaje dla systemu III tylko ograniczenia dla przyborów, tablice 6 i 9) — podana DN to tylko najmniejsza średnica podłączenia: %s.'),
  'fl.no_flow': T7('No fixtures and no extra flow — the size is only the smallest pipe; connect fixtures or delete the pipe: %s.', 'Немає приладів і додаткової витрати — діаметр лише найменший у серії; приєднайте прилади або видаліть трубу: %s.', 'Keine Entwässerungsgegenstände und kein Zusatzabfluss — Dimension ist nur das kleinste Rohr; Gegenstände anschließen oder Leitung löschen: %s.', 'Geen toestellen en geen extra debiet — de diameter is alleen de kleinste buis; sluit toestellen aan of verwijder de leiding: %s.', 'Aucun appareil ni débit supplémentaire — le diamètre n’est que le plus petit tube ; raccordez des appareils ou supprimez la conduite : %s.', 'Sin aparatos ni caudal adicional: el diámetro es solo el tubo más pequeño; conecte aparatos o borre la tubería: %s.', 'Brak przyborów i dodatkowego przepływu — średnica to tylko najmniejsza rura; podłącz przybory lub usuń przewód: %s.'),
  'fl.dn_not_in_series': T7('The DN set by hand is neither a DN of EN 12056-2 Table 1 nor a size of the series — the next pipe that meets it is used, see the DN column: %s.', 'Заданий вручну DN не є ні DN таблиці 1 EN 12056-2, ні розміром серії — взято наступну трубу, що йому відповідає (див. стовпець DN): %s.', 'Die von Hand gesetzte DN ist weder eine DN der Tabelle 1 der EN 12056-2 noch eine Größe der Reihe — verwendet wird das nächste passende Rohr, siehe Spalte DN: %s.', 'De handmatig ingestelde DN is geen DN uit tabel 1 van EN 12056-2 en geen maat van de reeks — de volgende buis die eraan voldoet wordt gebruikt, zie kolom DN: %s.', 'Le DN saisi n’est ni un DN du tableau 1 de l’EN 12056-2 ni une taille de la série — le tube suivant qui le respecte est utilisé, voir la colonne DN : %s.', 'El DN fijado a mano no es un DN de la tabla 1 de EN 12056-2 ni un tamaño de la serie; se usa el siguiente tubo que lo cumple, ver la columna DN: %s.', 'Ręcznie zadana DN nie jest ani DN z tablicy 1 EN 12056-2, ani rozmiarem serii — użyto następnej rury, która ją spełnia, patrz kolumna DN: %s.'),
  'fl.du_flushvalve_assumed': T7('WC with flush valve: EN 12056-2 Table 2 lists WCs by cistern volume only; the DU of the 9 l cistern WC is used (learning assumption, conservative) — check the national table.', 'Унітаз зі змивним краном: таблиця 2 EN 12056-2 містить унітази лише за об’ємом бачка; взято DU унітаза з бачком 9 л (навчальне припущення, із запасом) — перевірте національну таблицю.', 'WC mit Druckspüler: Tabelle 2 der EN 12056-2 nennt WCs nur nach Spülkastenvolumen; verwendet wird der DU des WCs mit 9-l-Spülkasten (Lernannahme, auf der sicheren Seite) — nationale Tabelle prüfen.', 'Toilet met drukspoeler: tabel 2 van EN 12056-2 geeft toiletten alleen per reservoirinhoud; de DU van het toilet met 9 l reservoir wordt gebruikt (leeraanname, veilig) — controleer de nationale tabel.', 'WC à robinet de chasse : le tableau 2 de l’EN 12056-2 ne classe les WC que par volume de réservoir ; la DU du WC à réservoir de 9 l est utilisée (hypothèse pédagogique, prudente) — vérifiez le tableau national.', 'Inodoro con fluxor: la tabla 2 de EN 12056-2 solo clasifica los inodoros por volumen de cisterna; se usa la DU del inodoro con cisterna de 9 l (supuesto de aprendizaje, conservador); compruebe la tabla nacional.', 'WC ze spłuczką ciśnieniową: tablica 2 EN 12056-2 podaje WC tylko według pojemności spłuczki; użyto DU WC ze spłuczką 9 l (założenie dydaktyczne, z zapasem) — sprawdź tablicę krajową.'),
  'fl.stack_into_branch': T7('A stack discharges into a branch — flow runs branch → stack → drain; check the tree: %s.', 'Стояк скидає у відгалуження — потік іде відгалуження → стояк → лежак; перевірте дерево: %s.', 'Eine Fallleitung entwässert in eine Anschlussleitung — Fließweg Anschlussleitung → Fallleitung → Sammelleitung; Baum prüfen: %s.', 'Een standleiding loost in een aansluitleiding — de stroming gaat aansluitleiding → standleiding → verzamelleiding; controleer de boom: %s.', 'Une chute se déverse dans un branchement — l’écoulement va branchement → chute → collecteur ; vérifiez l’arbre : %s.', 'Una bajante desagua en una derivación: el flujo va derivación → bajante → colector; revise el árbol: %s.', 'Pion odprowadza do podejścia — przepływ: podejście → pion → przewód zbiorczy; sprawdź drzewo: %s.'),
  'fl.entry_swept': T7('Stacks sized with the swept-entry column of Tables 11/12: valid only if every branch joins the stack with a swept (radius, ≤ 45°) fitting; with 88.5° junctions choose “square” (often one size larger).', 'Стояки підібрано за стовпцем плавних приєднань таблиць 11/12: це чинне, лише якщо кожне відгалуження входить у стояк плавним фасонним виробом (з радіусом, ≤ 45°); для трійників 88,5° виберіть «прямі» (часто на один розмір більше).', 'Fallleitungen nach der Spalte „mit Innenradius“ der Tabellen 11/12 bemessen: gilt nur, wenn jeder Abzweig mit Innenradius (≤ 45°) einmündet; bei 88,5°-Abzweigen „ohne Innenradius“ wählen (oft eine Nennweite größer).', 'Standleidingen gedimensioneerd met de kolom „vloeiend” van tabel 11/12: alleen geldig als elke aansluiting met een vloeiend hulpstuk (radius, ≤ 45°) op de standleiding komt; bij 88,5°-T-stukken kies „haaks” (vaak één maat groter).', 'Chutes dimensionnées avec la colonne « à rayon » des tableaux 11/12 : valable seulement si chaque branchement rejoint la chute par une culotte à rayon (≤ 45°) ; avec des culottes à 88,5° choisissez « droits » (souvent un diamètre de plus).', 'Bajantes dimensionadas con la columna «con radio» de las tablas 11/12: válido solo si cada derivación entra en la bajante con una pieza con radio (≤ 45°); con injertos de 88,5° elija «rectos» (a menudo un diámetro más).', 'Piony dobrane wg kolumny „z promieniem” tablic 11/12: ważne tylko, gdy każde podejście włącza się do pionu kształtką z promieniem (≤ 45°); przy trójnikach 88,5° wybierz „proste” (często o jedną średnicę więcej).'),
  'fl.buried_dn100': T7('Buried drain below DN 100 (DIN 1986-100 minimum for buried drains): %s.', 'Підземний лежак менше DN 100 (мінімум DIN 1986-100 для підземних трубопроводів): %s.', 'Grundleitung kleiner als DN 100 (Mindestnennweite nach DIN 1986-100): %s.', 'Ingegraven leiding kleiner dan DN 100 (minimum voor ingegraven leidingen volgens DIN 1986-100): %s.', 'Collecteur enterré inférieur à DN 100 (minimum de la DIN 1986-100 pour les conduites enterrées) : %s.', 'Colector enterrado menor de DN 100 (mínimo de DIN 1986-100 para tuberías enterradas): %s.', 'Przewód podziemny mniejszy niż DN 100 (minimum DIN 1986-100 dla przewodów w gruncie): %s.'),
  'err.L': T7('length of %k %id must be a number ≥ 0 m', '%k %id: довжина має бути числом ≥ 0 м', 'Länge von %k %id muss eine Zahl ≥ 0 m sein', 'lengte van %k %id moet een getal ≥ 0 m zijn', 'la longueur de %k %id doit être un nombre ≥ 0 m', 'la longitud de %k %id debe ser un número ≥ 0 m', '%k %id: długość musi być liczbą ≥ 0 m'),
  'err.drop': T7('vertical drop of %k %id must be a number ≥ 0 m', '%k %id: вертикальний перепад має бути числом ≥ 0 м', 'Fallhöhe von %k %id muss eine Zahl ≥ 0 m sein', 'valhoogte van %k %id moet een getal ≥ 0 m zijn', 'la hauteur de chute de %k %id doit être un nombre ≥ 0 m', 'la caída vertical de %k %id debe ser un número ≥ 0 m', '%k %id: spadek pionowy musi być liczbą ≥ 0 m'),
  'err.bends': T7('number of bends of %k %id must be a whole number ≥ 0', '%k %id: кількість відводів має бути цілим числом ≥ 0', 'Anzahl der Bögen von %k %id muss eine ganze Zahl ≥ 0 sein', 'aantal bochten van %k %id moet een geheel getal ≥ 0 zijn', 'le nombre de coudes de %k %id doit être un entier ≥ 0', 'el número de codos de %k %id debe ser un entero ≥ 0', '%k %id: liczba kolan musi być liczbą całkowitą ≥ 0'),
  'err.slope': T7('gradient of %k %id out of range (drain above 0 up to 20 %, branch 0–20 %)', '%k %id: уклон поза межами (лежак більше 0 до 20 %, відгалуження 0–20 %)', 'Gefälle von %k %id außerhalb des Bereichs (Sammelleitung über 0 bis 20 %, Anschlussleitung 0–20 %)', 'helling van %k %id buiten het bereik (verzamelleiding boven 0 tot 20 %, aansluitleiding 0–20 %)', 'pente de %k %id hors limites (collecteur au-dessus de 0 jusqu’à 20 %, branchement 0–20 %)', 'pendiente de %k %id fuera de rango (colector mayor que 0 hasta 20 %, derivación 0–20 %)', '%k %id: spadek poza zakresem (przewód zbiorczy powyżej 0 do 20 %, podejście 0–20 %)'),
  'err.fixture': T7('unknown fixture type “%f” on %k %id', '%k %id: невідомий тип приладу «%f»', 'unbekannter Gegenstand „%f“ an %k %id', 'onbekend toesteltype „%f” op %k %id', 'type d’appareil inconnu « %f » sur %k %id', 'tipo de aparato desconocido «%f» en %k %id', '%k %id: nieznany typ przyboru „%f”'),
  'err.vent': T7('ventilation “%v” is not possible for %k %id (branch: none/vented/AAV; stack: primary/secondary/AAV; drain: none)', 'вентиляція «%v» неможлива для %k %id (відгалуження: немає/вентильоване/клапан AAV; стояк: первинна/вторинна/клапан AAV; лежак: немає)', 'Lüftung „%v“ ist bei %k %id nicht möglich (Anschlussleitung: keine/belüftet/Belüftungsventil; Fallleitung: Hauptlüftung/Nebenlüftung/Belüftungsventil; Sammelleitung: keine)', 'ventilatie „%v” is niet mogelijk voor %k %id (aansluitleiding: geen/geventileerd/beluchter; standleiding: primair/secundair/beluchter; verzamelleiding: geen)', 'ventilation « %v » impossible pour %k %id (branchement : aucune/ventilé/clapet AAV ; chute : primaire/secondaire/clapet AAV ; collecteur : aucune)', 'ventilación «%v» no es posible para %k %id (derivación: ninguna/ventilada/válvula AAV; bajante: primaria/secundaria/válvula AAV; colector: ninguna)', 'wentylacja „%v” niemożliwa dla %k %id (podejście: brak/wentylowane/zawór AAV; pion: główna/równoległa/zawór AAV; przewód zbiorczy: brak)'),

      'Abwasserleitungen laufen teilgefüllt, mit Luft über dem Wasser. Beschreiben Sie die Entwässerung als Leitungsbaum, schließen Sie die Gegenstände an, und das Werkzeug macht aus Anschlusswerten einen Bemessungsabfluss, wählt jede Dimension aus den Tabellen der EN 12056-2 und zeigt, welche Regel sie bestimmt hat. Beginnen Sie mit „12 Wohnungen an einer Fallleitung“ und vergleichen Sie dann die Beispiele.',
      'Afvoerleidingen lopen gedeeltelijk gevuld, met lucht boven het water. Beschrijf de afvoer als een leidingboom, sluit de toestellen aan, en de tool maakt van afvoerwaarden een ontwerpdebiet, kiest elke diameter uit de tabellen van EN 12056-2 en toont welke regel hem bepaalde. Begin met “12 appartementen op één standleiding” en vergelijk dan de voorbeelden.',
      'Les tuyaux d’évacuation coulent partiellement remplis, avec de l’air au-dessus de l’eau. Décrivez le réseau comme un arbre de tuyaux, raccordez les appareils : l’outil transforme les unités de décharge en débit de calcul, choisit chaque diamètre dans les tableaux de l’EN 12056-2 et montre quelle règle l’a fixé. Commencez par « 12 logements sur une chute », puis comparez les exemples.',
      'Las tuberías de saneamiento trabajan parcialmente llenas, con aire sobre el agua. Describa la red como un árbol de tuberías, conecte los aparatos y la herramienta convierte las unidades de descarga en caudal de cálculo, elige cada diámetro de las tablas de EN 12056-2 y muestra qué regla lo decidió. Empiece por «12 viviendas en una bajante» y compare después los ejemplos.',
      'Przewody kanalizacyjne pracują częściowo wypełnione, z powietrzem nad ściekami. Opisz instalację jako drzewo przewodów, podłącz przybory, a narzędzie zamieni równoważniki odpływu na przepływ obliczeniowy, dobierze każdą średnicę z tablic EN 12056-2 i pokaże, która reguła o niej zdecydowała. Zacznij od „12 mieszkań na jednym pionie”, potem porównaj przykłady.')
  },
  topics: {
    du: { title: T7('Discharge units and K', 'Еквіваленти стоку і K', 'Anschlusswerte und K', 'Afvoerwaarden en K', 'Unités de décharge et K', 'Unidades de descarga y K', 'Równoważniki odpływu i K'),
      body: T7('Every fixture has a discharge unit DU in l/s (EN 12056-2 Table 2): WC 2.0, shower 0.6, basin 0.5 in system I. Fixtures rarely discharge together, so the design flow grows with the square root: Qww = K·√ΣDU, never less than the largest single DU. K says how intensively the building is used: 0.5 dwellings and offices, 0.7 hotels, schools, hospitals, 1.0 public toilets and showers, 1.2 laboratories. Continuous and pumped flows (Qc, Qp) are added on top. Four times the fixtures give only twice the flow.',
        'Кожен прилад має еквівалент стоку DU у л/с (EN 12056-2, табл. 2): унітаз 2,0, душ 0,6, умивальник 0,5 у системі I. Прилади рідко скидають одночасно, тому розрахункова витрата росте як корінь: Qww = K·√ΣDU, але не менше за найбільший окремий DU. K описує інтенсивність використання: 0,5 житло й офіси, 0,7 готелі, школи, лікарні, 1,0 громадські вбиральні й душові, 1,2 лабораторії. Постійні та насосні витрати (Qc, Qp) додаються зверху. Учетверо більше приладів дають лише вдвічі більшу витрату.',
        'Jeder Entwässerungsgegenstand hat einen Anschlusswert DU in l/s (EN 12056-2 Tabelle 2): WC 2,0, Dusche 0,6, Waschtisch 0,5 im System I. Die Gegenstände entwässern selten gleichzeitig, daher wächst der Abfluss mit der Wurzel: Qww = K·√ΣDU, nie kleiner als der größte einzelne DU. K beschreibt die Nutzungsintensität: 0,5 Wohnungen und Büros, 0,7 Hotels, Schulen, Krankenhäuser, 1,0 öffentliche WCs und Duschanlagen, 1,2 Labore. Dauer- und Pumpenabflüsse (Qc, Qp) kommen hinzu. Viermal so viele Gegenstände ergeben nur den doppelten Abfluss.',
        'Elk toestel heeft een afvoerwaarde DU in l/s (EN 12056-2 tabel 2): WC 2,0, douche 0,6, wastafel 0,5 in systeem I. Toestellen lozen zelden tegelijk, dus het ontwerpdebiet groeit met de wortel: Qww = K·√ΣDU, nooit minder dan de grootste afzonderlijke DU. K drukt de gebruiksintensiteit uit: 0,5 woningen en kantoren, 0,7 hotels, scholen, ziekenhuizen, 1,0 openbare toiletten en douches, 1,2 laboratoria. Continue en gepompte debieten (Qc, Qp) komen erbij. Vier keer zoveel toestellen geven maar het dubbele debiet.',
        'Chaque appareil a une unité de décharge DU en l/s (EN 12056-2 tableau 2) : WC 2,0, douche 0,6, lavabo 0,5 dans le système I. Les appareils se vident rarement ensemble, le débit croît donc comme une racine : Qww = K·√ΣDU, jamais moins que la plus grande DU isolée. K traduit l’intensité d’usage : 0,5 logements et bureaux, 0,7 hôtels, écoles, hôpitaux, 1,0 sanitaires publics et douches, 1,2 laboratoires. Les débits continus et pompés (Qc, Qp) s’ajoutent. Quatre fois plus d’appareils ne donnent que deux fois plus de débit.',
        'Cada aparato tiene una unidad de descarga DU en l/s (EN 12056-2 tabla 2): inodoro 2,0, ducha 0,6, lavabo 0,5 en el sistema I. Los aparatos rara vez descargan a la vez, por lo que el caudal crece con la raíz: Qww = K·√ΣDU, nunca menor que la mayor DU individual. K expresa la intensidad de uso: 0,5 viviendas y oficinas, 0,7 hoteles, colegios, hospitales, 1,0 aseos públicos y duchas, 1,2 laboratorios. Los caudales continuos y bombeados (Qc, Qp) se suman. Cuatro veces más aparatos dan solo el doble de caudal.',
        'Każdy przybór ma równoważnik odpływu DU w l/s (EN 12056-2 tablica 2): miska ustępowa 2,0, natrysk 0,6, umywalka 0,5 w systemie I. Przybory rzadko odprowadzają jednocześnie, więc przepływ rośnie z pierwiastkiem: Qww = K·√ΣDU, nigdy mniej niż największy pojedynczy DU. K opisuje intensywność użytkowania: 0,5 mieszkania i biura, 0,7 hotele, szkoły, szpitale, 1,0 toalety publiczne i natryski, 1,2 laboratoria. Przepływy ciągłe i pompowane (Qc, Qp) dodaje się. Cztery razy więcej przyborów daje tylko dwa razy większy przepływ.') },
    systems: { title: T7('Systems I–IV', 'Системи I–IV', 'Systeme I–IV', 'Systemen I–IV', 'Systèmes I–IV', 'Sistemas I–IV', 'Systemy I–IV'),
      body: T7('EN 12056-2 knows four national traditions. System I: one stack, branches run half full (Belgium, Germany, Netherlands, France). System II: small-bore branches running up to 70 % full (Scandinavia) — smaller pipes, WC on DN 80. System III: full-bore single branches (UK tradition). System IV: separate stacks for WC water and grey water. The DU differ per system; this tool sizes branches for I, II and IV (system III has only per-appliance limits, Tables 6 and 9), and DU, stacks and drains for all four.',
        'EN 12056-2 описує чотири національні традиції. Система I: один стояк, відгалуження заповнені наполовину (Бельгія, Німеччина, Нідерланди, Франція). Система II: відгалуження малого діаметра з наповненням до 70 % (Скандинавія) — менші труби, унітаз на DN 80. Система III: повносічні окремі відгалуження (традиція Великої Британії). Система IV: окремі стояки для фекальних і сірих стоків. DU залежать від системи; інструмент підбирає відгалуження для I, II та IV (для системи III є лише обмеження за приладами, табл. 6 і 9), а DU, стояки й лежаки — для всіх чотирьох.',
        'EN 12056-2 kennt vier nationale Traditionen. System I: eine Fallleitung, Anschlussleitungen halb gefüllt (Belgien, Deutschland, Niederlande, Frankreich). System II: kleine Anschlussleitungen mit bis zu 70 % Füllung (Skandinavien) — kleinere Rohre, WC an DN 80. System III: vollgefüllte Einzelanschlussleitungen (britische Tradition). System IV: getrennte Fallleitungen für Schwarz- und Grauwasser. Die DU unterscheiden sich je System; das Werkzeug bemisst Anschlussleitungen für I, II und IV (System III hat nur Grenzen je Gegenstand, Tabellen 6 und 9), DU, Fall- und Sammelleitungen für alle vier.',
        'EN 12056-2 kent vier nationale tradities. Systeem I: één standleiding, aansluitleidingen half gevuld (België, Duitsland, Nederland, Frankrijk). Systeem II: kleine aansluitleidingen tot 70 % gevuld (Scandinavië) — kleinere buizen, WC op DN 80. Systeem III: volgevulde enkelvoudige aansluitleidingen (Britse traditie). Systeem IV: aparte standleidingen voor zwart en grijs water. De DU verschillen per systeem; de tool dimensioneert aansluitleidingen voor I, II en IV (systeem III heeft alleen grenzen per toestel, tabellen 6 en 9), en DU, stand- en verzamelleidingen voor alle vier.',
        'L’EN 12056-2 connaît quatre traditions nationales. Système I : une chute, branchements remplis à moitié (Belgique, Allemagne, Pays-Bas, France). Système II : branchements de petit diamètre remplis jusqu’à 70 % (Scandinavie) — tubes plus petits, WC en DN 80. Système III : branchements individuels à pleine section (tradition britannique). Système IV : chutes séparées pour eaux vannes et eaux ménagères. Les DU diffèrent selon le système ; l’outil dimensionne les branchements pour I, II et IV (le système III n’a que des limites par appareil, tableaux 6 et 9), les DU, chutes et collecteurs pour les quatre.',
        'EN 12056-2 recoge cuatro tradiciones nacionales. Sistema I: una bajante, derivaciones llenas a la mitad (Bélgica, Alemania, Países Bajos, Francia). Sistema II: derivaciones de pequeño diámetro llenas hasta el 70 % (Escandinavia): tubos menores, inodoro en DN 80. Sistema III: derivaciones individuales a sección llena (tradición británica). Sistema IV: bajantes separadas para aguas negras y grises. Las DU difieren según el sistema; la herramienta dimensiona derivaciones para I, II y IV (el sistema III solo tiene límites por aparato, tablas 6 y 9), y DU, bajantes y colectores para los cuatro.',
        'EN 12056-2 obejmuje cztery tradycje krajowe. System I: jeden pion, podejścia wypełnione do połowy (Belgia, Niemcy, Holandia, Francja). System II: podejścia o małej średnicy wypełnione do 70 % (Skandynawia) — mniejsze rury, miska ustępowa na DN 80. System III: podejścia pojedyncze pełnym przekrojem (tradycja brytyjska). System IV: oddzielne piony dla ścieków fekalnych i szarych. DU zależą od systemu; narzędzie dobiera podejścia dla I, II i IV (system III ma tylko ograniczenia dla przyborów, tablice 6 i 9), a DU, piony i przewody zbiorcze dla wszystkich czterech.') },
    branches: { title: T7('Branch pipes and their limits', 'Відгалуження та їх обмеження', 'Anschlussleitungen und ihre Grenzen', 'Aansluitleidingen en hun grenzen', 'Branchements et leurs limites', 'Derivaciones y sus límites', 'Podejścia i ich ograniczenia'),
      body: T7('A branch is sized from Table 4 (unventilated) or Table 7 (ventilated), each with its footnotes on WCs (system I: DN 80 without WCs, DN 90 with at most two WCs and at most one 90° change of direction, else DN 100; systems II and IV: DN 80 with at most one WC): the smallest DN whose Qmax covers Qtot, never smaller than the largest connected fixture and never smaller than a pipe discharging into it. An unventilated branch in system I may be at most 4 m long, with 3 bends, 1 m drop and 1 % gradient — beyond that the water slug sucks the traps empty. Ventilating the branch or fitting an air admittance valve raises the limits to 10 m and 3 m drop. Systems II and IV have their own limits (Tables 5 and 8; system II unventilated: 10 m, 1 bend, 1.5 %).',
        'Відгалуження підбирають за табл. 4 (без вентиляції) або табл. 7 (з вентиляцією), з їхніми примітками щодо унітазів (система I: DN 80 без унітазів, DN 90 — не більше двох унітазів і не більше однієї зміни напрямку на 90°, інакше DN 100; системи II і IV: DN 80 — не більше одного унітаза): найменший DN, Qmax якого покриває Qtot, не менший за найбільший приєднаний прилад і не менший за трубу, що скидає в нього. Невентильоване відгалуження в системі I — не довше 4 м, до 3 відводів, перепад до 1 м і ухил від 1 % — інакше пробка води висмоктує гідрозатвори. Вентиляція відгалуження або клапан AAV підвищують межі до 10 м і перепаду 3 м. Для систем II і IV діють власні межі (табл. 5 і 8; система II без вентиляції: 10 м, 1 відвід, 1,5 %).',
        'Eine Anschlussleitung wird nach Tabelle 4 (unbelüftet) oder Tabelle 7 (belüftet), jeweils mit ihren Fußnoten zu WCs (System I: DN 80 ohne WC, DN 90 mit höchstens zwei WCs und höchstens einer Richtungsänderung um 90°, sonst DN 100; Systeme II und IV: DN 80 mit höchstens einem WC) bemessen: kleinste DN, deren Qmax den Abfluss deckt, nie kleiner als der größte angeschlossene Gegenstand und nie kleiner als ein Zulauf. Eine unbelüftete Leitung im System I darf höchstens 4 m lang sein, mit 3 Bögen, 1 m Fallhöhe und 1 % Gefälle — darüber saugt der Wasserpfropfen die Geruchverschlüsse leer. Belüften oder ein Belüftungsventil erhöht die Grenzen auf 10 m und 3 m Fallhöhe. Systeme II und IV haben eigene Grenzen (Tabellen 5 und 8; System II unbelüftet: 10 m, 1 Bogen, 1,5 %).',
        'Een aansluitleiding wordt gedimensioneerd met tabel 4 (niet-geventileerd) of tabel 7 (geventileerd), elk met de voetnoten over WC’s (systeem I: DN 80 zonder WC, DN 90 met hoogstens twee WC’s en hoogstens één richtingsverandering van 90°, anders DN 100; systemen II en IV: DN 80 met hoogstens één WC): de kleinste DN waarvan Qmax het debiet dekt, nooit kleiner dan het grootste aangesloten toestel en nooit kleiner dan een leiding die erin loost. Een niet-geventileerde leiding in systeem I mag hoogstens 4 m lang zijn, met 3 bochten, 1 m val en 1 % afschot — daarboven zuigt de waterprop de sifons leeg. Ventileren of een beluchter verhoogt de grenzen tot 10 m en 3 m val. Systemen II en IV hebben eigen grenzen (tabellen 5 en 8; systeem II niet-geventileerd: 10 m, 1 bocht, 1,5 %).',
        'Un branchement se dimensionne avec le tableau 4 (non ventilé) ou 7 (ventilé), avec leurs notes sur les WC (système I : DN 80 sans WC, DN 90 avec deux WC au plus et un seul changement de direction de 90° au plus, sinon DN 100 ; systèmes II et IV : DN 80 avec un WC au plus) : le plus petit DN dont le Qmax couvre le débit, jamais inférieur au plus grand appareil raccordé ni à un tuyau qui s’y déverse. Un branchement non ventilé en système I ne dépasse pas 4 m, 3 coudes, 1 m de chute et 1 % de pente — au-delà, le bouchon d’eau vide les siphons. Ventiler le branchement ou poser un clapet porte les limites à 10 m et 3 m de chute. Les systèmes II et IV ont leurs propres limites (tableaux 5 et 8 ; système II non ventilé : 10 m, 1 coude, 1,5 %).',
        'Una derivación se dimensiona con la tabla 4 (no ventilada) o la 7 (ventilada), con sus notas sobre inodoros (sistema I: DN 80 sin inodoros, DN 90 con dos inodoros como máximo y un solo cambio de dirección de 90° como máximo, si no DN 100; sistemas II y IV: DN 80 con un inodoro como máximo): el menor DN cuyo Qmax cubre el caudal, nunca menor que el mayor aparato conectado ni que una tubería que desagüe en ella. Una derivación no ventilada en el sistema I no supera 4 m, 3 codos, 1 m de caída y 1 % de pendiente; más allá, el tapón de agua vacía los sifones. Ventilarla o instalar una válvula AAV eleva los límites a 10 m y 3 m de caída. Los sistemas II y IV tienen límites propios (tablas 5 y 8; sistema II no ventilado: 10 m, 1 codo, 1,5 %).',
        'Podejście dobiera się z tablicy 4 (niewentylowane) lub 7 (wentylowane), z ich przypisami o miskach ustępowych (system I: DN 80 bez misek, DN 90 najwyżej z dwiema miskami i najwyżej jedną zmianą kierunku o 90°, w przeciwnym razie DN 100; systemy II i IV: DN 80 najwyżej z jedną miską): najmniejsze DN, którego Qmax pokrywa przepływ, nie mniejsze niż największy podłączony przybór ani niż przewód do niego odprowadzający. Podejście niewentylowane w systemie I może mieć najwyżej 4 m, 3 kolana, 1 m spadu i 1 % spadku — powyżej korek wody wysysa zamknięcia wodne. Wentylacja podejścia lub zawór AAV podnosi granice do 10 m i 3 m spadu. Systemy II i IV mają własne granice (tablice 5 i 8; system II bez wentylacji: 10 m, 1 kolano, 1,5 %).') },
    stacks: { title: T7('Stacks and ventilation', 'Стояки і вентиляція', 'Fallleitungen und Lüftung', 'Standleidingen en ontluchting', 'Chutes et ventilation', 'Bajantes y ventilación', 'Piony i wentylacja'),
      body: T7('Water falls down the stack as a film along the wall and drags air with it. The capacity is set by the air, not the water: Table 11 gives DN 100 4.0 l/s with square entries but 5.2 l/s with swept entries, because swept fittings disturb the air core less. A secondary vent pipe (Table 12) lifts DN 100 to 5.6 / 7.3 l/s. An air admittance valve (EN 12380) can replace the open vent of a stack, but every drainage system still needs at least one vent open to the atmosphere.',
        'Вода стікає стояком плівкою по стінці й тягне за собою повітря. Пропускну здатність визначає повітря, а не вода: табл. 11 дає DN 100 4,0 л/с для прямих приєднань, але 5,2 л/с для плавних, бо плавні фітинги менше збурюють повітряне ядро. Вторинна вентиляція (табл. 12) підвищує DN 100 до 5,6 / 7,3 л/с. Клапан AAV (EN 12380) може замінити відкриту вентиляцію стояка, але кожна система все одно потребує хоча б однієї відкритої в атмосферу вентиляції.',
        'Das Wasser fällt als Film an der Wand der Fallleitung und reißt Luft mit. Die Kapazität bestimmt die Luft, nicht das Wasser: Tabelle 11 gibt DN 100 4,0 l/s mit Abzweigen ohne Innenradius, aber 5,2 l/s mit Innenradius, weil diese den Luftkern weniger stören. Eine Nebenlüftung (Tabelle 12) hebt DN 100 auf 5,6 / 7,3 l/s. Ein Belüftungsventil (EN 12380) kann die Lüftung über Dach einer Fallleitung ersetzen, doch jede Anlage braucht mindestens eine offene Lüftung.',
        'Het water valt als een film langs de wand van de standleiding en sleurt lucht mee. De capaciteit wordt bepaald door de lucht, niet door het water: tabel 11 geeft DN 100 4,0 l/s met haakse aansluitingen maar 5,2 l/s met vloeiende, omdat die de luchtkern minder verstoren. Een secundaire ontluchting (tabel 12) brengt DN 100 op 5,6 / 7,3 l/s. Een beluchter (EN 12380) kan de open ontluchting van een standleiding vervangen, maar elk systeem heeft nog minstens één open ontluchting nodig.',
        'L’eau descend la chute en film le long de la paroi et entraîne l’air. La capacité est fixée par l’air, pas par l’eau : le tableau 11 donne en DN 100 4,0 l/s avec des culottes droites mais 5,2 l/s avec des culottes à rayon, qui perturbent moins le noyau d’air. Une ventilation secondaire (tableau 12) porte le DN 100 à 5,6 / 7,3 l/s. Un clapet d’aération (EN 12380) peut remplacer la ventilation primaire d’une chute, mais chaque réseau garde au moins une ventilation ouverte à l’air libre.',
        'El agua baja por la bajante como una película pegada a la pared y arrastra aire. La capacidad la fija el aire, no el agua: la tabla 11 da en DN 100 4,0 l/s con entronques rectos pero 5,2 l/s con entronques curvos, que perturban menos el núcleo de aire. Una ventilación secundaria (tabla 12) lleva el DN 100 a 5,6 / 7,3 l/s. Una válvula de aireación (EN 12380) puede sustituir la ventilación abierta de una bajante, pero cada red necesita al menos una ventilación abierta a la atmósfera.',
        'Woda spływa pionem jako film po ściance i porywa powietrze. O przepustowości decyduje powietrze, nie woda: tablica 11 daje dla DN 100 4,0 l/s przy trójnikach prostych, ale 5,2 l/s przy łukowych, bo te mniej zaburzają rdzeń powietrza. Wentylacja równoległa (tablica 12) podnosi DN 100 do 5,6 / 7,3 l/s. Zawór napowietrzający (EN 12380) może zastąpić wywiewkę pionu, ale każdy system nadal potrzebuje co najmniej jednej wentylacji otwartej do atmosfery.') },
    drains: { title: T7('Drains: filling and velocity', 'Лежаки: наповнення і швидкість', 'Sammelleitungen: Füllung und Geschwindigkeit', 'Verzamelleidingen: vulling en snelheid', 'Collecteurs : remplissage et vitesse', 'Colectores: llenado y velocidad', 'Przewody zbiorcze: napełnienie i prędkość'),
      body: T7('A horizontal drain is an open channel inside a pipe. The tool uses Prandtl–Colebrook with the operational roughness kb = 1.0 mm (EN 12056-2 Annex B) on the wetted part of the section and picks the smallest pipe that carries Qtot at the allowed filling (h/d 0.5 inside buildings). Capacity grows with the square root of the gradient: 2 % instead of 1 % carries about 40 % more. The annex tables are made for full pipes reduced by filling curves; the hydraulic-diameter form used here differs by a few per cent.',
        'Горизонтальний лежак — це відкритий канал усередині труби. Інструмент застосовує формулу Прандтля–Колбрука з експлуатаційною шорсткістю kb = 1,0 мм (EN 12056-2, додаток B) до змоченої частини перерізу і вибирає найменшу трубу, що пропускає Qtot при допустимому наповненні (h/d 0,5 у будівлі). Пропускна здатність росте як корінь з ухилу: 2 % замість 1 % дають приблизно на 40 % більше. Таблиці додатка складено для повних труб із кривими наповнення; форма з гідравлічним діаметром відрізняється на кілька відсотків.',
        'Eine liegende Sammelleitung ist ein offenes Gerinne im Rohr. Das Werkzeug wendet Prandtl–Colebrook mit der betrieblichen Rauheit kb = 1,0 mm (EN 12056-2 Anhang B) auf den benetzten Querschnitt an und wählt das kleinste Rohr, das Qtot beim zulässigen Füllungsgrad (h/d 0,5 im Gebäude) abführt. Die Kapazität wächst mit der Wurzel des Gefälles: 2 % statt 1 % führen rund 40 % mehr ab. Die Tabellen des Anhangs gelten für Vollfüllung mit Teilfüllungskurven; die hier verwendete Form mit hydraulischem Durchmesser weicht wenige Prozent ab.',
        'Een liggende verzamelleiding is een open kanaal in een buis. De tool past Prandtl–Colebrook toe met de bedrijfsruwheid kb = 1,0 mm (EN 12056-2 bijlage B) op het natte deel van de doorsnede en kiest de kleinste buis die Qtot afvoert bij de toegelaten vulling (h/d 0,5 in gebouwen). De capaciteit groeit met de wortel van het afschot: 2 % in plaats van 1 % voert ongeveer 40 % meer af. De tabellen van de bijlage gelden voor volle buizen met vullingskrommen; de vorm met hydraulische diameter wijkt enkele procenten af.',
        'Un collecteur horizontal est un canal à surface libre dans un tube. L’outil applique Prandtl–Colebrook avec la rugosité d’exploitation kb = 1,0 mm (EN 12056-2 annexe B) à la partie mouillée et choisit le plus petit tube qui évacue Qtot au remplissage admis (h/d 0,5 dans le bâtiment). La capacité croît comme la racine de la pente : 2 % au lieu de 1 % évacuent environ 40 % de plus. Les tableaux de l’annexe sont établis à pleine section avec des courbes de remplissage ; la forme au diamètre hydraulique utilisée ici s’en écarte de quelques pour cent.',
        'Un colector horizontal es un canal abierto dentro de un tubo. La herramienta aplica Prandtl–Colebrook con la rugosidad de servicio kb = 1,0 mm (EN 12056-2 anexo B) a la parte mojada de la sección y elige el menor tubo que evacúa Qtot con el llenado admitido (h/d 0,5 dentro del edificio). La capacidad crece con la raíz de la pendiente: 2 % en lugar de 1 % evacúa un 40 % más. Las tablas del anexo se calculan a sección llena con curvas de llenado; la forma con diámetro hidráulico usada aquí difiere unos pocos por ciento.',
        'Poziomy przewód zbiorczy to kanał otwarty wewnątrz rury. Narzędzie stosuje Prandtla–Colebrooka z chropowatością eksploatacyjną kb = 1,0 mm (EN 12056-2 załącznik B) do zwilżonej części przekroju i wybiera najmniejszą rurę, która przepuszcza Qtot przy dopuszczalnym napełnieniu (h/d 0,5 w budynku). Przepustowość rośnie z pierwiastkiem spadku: 2 % zamiast 1 % daje ok. 40 % więcej. Tablice załącznika liczono dla pełnego przekroju z krzywymi napełnienia; forma ze średnicą hydrauliczną różni się o kilka procent.') },
    cleansing: { title: T7('Self-cleansing: bigger is not safer', 'Самоочищення: більше не означає надійніше', 'Selbstreinigung: größer ist nicht sicherer', 'Zelfreiniging: groter is niet veiliger', 'Autocurage : plus gros n’est pas plus sûr', 'Autolimpiado: más grande no es más seguro', 'Samooczyszczanie: większa nie znaczy bezpieczniejsza'),
      body: T7('Solids and grease settle when the water is too slow. At design flow the drain should reach about 0.7 m/s (learning assumption; DIN 1986-100 accepts 0.5 m/s). An oversized pipe makes the water shallower and slower — the velocity hardly changes with the diameter at small flows. A steeper gradient is what raises it. The tool reports h/d and v of every drain.',
        'Тверді частинки й жир осідають, коли вода тече надто повільно. При розрахунковій витраті лежак має досягати близько 0,7 м/с (навчальне припущення; DIN 1986-100 допускає 0,5 м/с). Завелика труба робить потік мілкішим і повільнішим — при малих витратах швидкість майже не залежить від діаметра. Підвищує її лише більший ухил. Інструмент показує h/d і v кожного лежака.',
        'Feststoffe und Fett setzen sich ab, wenn das Wasser zu langsam fließt. Beim Bemessungsabfluss sollte die Sammelleitung etwa 0,7 m/s erreichen (Lernannahme; DIN 1986-100 lässt 0,5 m/s zu). Ein überdimensioniertes Rohr macht den Wasserspiegel flacher und langsamer — bei kleinen Abflüssen ändert sich die Geschwindigkeit mit dem Durchmesser kaum. Erst mehr Gefälle hebt sie. Das Werkzeug zeigt h/d und v jeder Sammelleitung.',
        'Vaste stoffen en vet bezinken als het water te traag stroomt. Bij ontwerpdebiet moet de verzamelleiding ongeveer 0,7 m/s halen (leeraanname; DIN 1986-100 aanvaardt 0,5 m/s). Een te grote buis maakt het water ondieper en trager — bij kleine debieten verandert de snelheid nauwelijks met de diameter. Alleen meer afschot verhoogt ze. De tool toont h/d en v van elke verzamelleiding.',
        'Les matières et graisses se déposent quand l’eau est trop lente. Au débit de calcul le collecteur devrait atteindre environ 0,7 m/s (hypothèse pédagogique ; la DIN 1986-100 admet 0,5 m/s). Un tube surdimensionné rend l’écoulement moins profond et plus lent — aux petits débits la vitesse change à peine avec le diamètre. Seule une pente plus forte l’augmente. L’outil affiche h/d et v de chaque collecteur.',
        'Los sólidos y la grasa se depositan cuando el agua es demasiado lenta. Con el caudal de cálculo el colector debería alcanzar unos 0,7 m/s (supuesto didáctico; DIN 1986-100 admite 0,5 m/s). Un tubo sobredimensionado hace la lámina más baja y lenta: con caudales pequeños la velocidad apenas cambia con el diámetro. Solo una pendiente mayor la aumenta. La herramienta muestra h/d y v de cada colector.',
        'Zawiesiny i tłuszcz osadzają się, gdy ścieki płyną zbyt wolno. Przy przepływie obliczeniowym przewód powinien osiągać ok. 0,7 m/s (założenie dydaktyczne; DIN 1986-100 dopuszcza 0,5 m/s). Przewymiarowana rura daje płytszy i wolniejszy strumień — przy małych przepływach prędkość prawie nie zależy od średnicy. Podnosi ją dopiero większy spadek. Narzędzie podaje h/d i v każdego przewodu zbiorczego.') },
    project: { title: T7('Project and lifting station', 'Проєкт і насосна станція', 'Projekt und Hebeanlage', 'Project en pompstation', 'Projet et poste de relevage', 'Proyecto y estación de bombeo', 'Projekt i przepompownia'),
      body: T7('“Take fixtures from project” reads the fixture inventory written by plbfixtures and lumps the upper floors on one stack and the ground floor on the drain, with K from the building type — a quick first check before you draw the branches. “Save to project” stores ΣDU, Qww and Qtot at the outlet; plbliftstation uses Qtot as the inflow when the drain lies below the backflow level (EN 12056-4).',
        '«Взяти прилади з проєкту» читає перелік приладів, записаний plbfixtures, зводить верхні поверхи на один стояк, а перший поверх — на лежак, з K за типом будівлі — швидка перша перевірка перед кресленням відгалужень. «Зберегти в проєкт» записує ΣDU, Qww і Qtot на випуску; plbliftstation бере Qtot як приплив, якщо лежак нижче рівня зворотного підпору (EN 12056-4).',
        '„Objekte aus dem Projekt übernehmen“ liest das von plbfixtures geschriebene Objektverzeichnis, legt die Obergeschosse pauschal an eine Fallleitung und das Erdgeschoss an die Sammelleitung, mit K aus der Gebäudeart — eine schnelle erste Prüfung, bevor Sie Anschlussleitungen zeichnen. „Im Projekt speichern“ legt ΣDU, Qww und Qtot am Auslass ab; plbliftstation nutzt Qtot als Zufluss, wenn die Leitung unter der Rückstauebene liegt (EN 12056-4).',
        '“Toestellen uit project overnemen” leest de toestellenlijst van plbfixtures, neemt de bovenverdiepingen samen op één standleiding en het gelijkvloers op de verzamelleiding, met K volgens het gebouwtype — een snelle eerste controle voor u de aansluitleidingen tekent. “Opslaan in project” bewaart ΣDU, Qww en Qtot aan de uitlaat; plbliftstation gebruikt Qtot als toevoer wanneer de leiding onder het terugstuwpeil ligt (EN 12056-4).',
        '« Reprendre les appareils du projet » lit l’inventaire écrit par plbfixtures, globalise les étages sur une chute et le rez sur le collecteur, avec K selon le type de bâtiment — un premier contrôle rapide avant de dessiner les branchements. « Enregistrer dans le projet » stocke ΣDU, Qww et Qtot à la sortie ; plbliftstation utilise Qtot comme débit entrant quand le collecteur est sous le niveau de refoulement (EN 12056-4).',
        '«Tomar aparatos del proyecto» lee el inventario escrito por plbfixtures, agrupa las plantas superiores en una bajante y la planta baja en el colector, con K según el tipo de edificio: una primera comprobación rápida antes de dibujar las derivaciones. «Guardar en el proyecto» almacena ΣDU, Qww y Qtot en la salida; plbliftstation usa Qtot como caudal de entrada cuando el colector queda bajo el nivel de reflujo (EN 12056-4).',
        '„Pobierz przybory z projektu” czyta wykaz przyborów zapisany przez plbfixtures, sumuje wyższe kondygnacje na jednym pionie, a parter na przewodzie zbiorczym, z K wg rodzaju budynku — szybka pierwsza kontrola przed rysowaniem podejść. „Zapisz w projekcie” zapisuje ΣDU, Qww i Qtot na wylocie; plbliftstation przyjmuje Qtot jako dopływ, gdy przewód leży poniżej poziomu cofki (EN 12056-4).') }

    T7('The DN 50 bath branch has capacity to spare, yet it fails: an unventilated branch in system I may be 4 m long. Set its venting to “AAV” and the warning goes.', 'Відгалуження ванни DN 50 має запас пропускної здатності, але не проходить: невентильоване відгалуження в системі I — до 4 м. Поставте вентиляцію «AAV» — і попередження зникне.', 'Die Anschlussleitung DN 50 der Wanne hat Kapazität übrig und fällt trotzdem durch: unbelüftet sind im System I 4 m erlaubt. Lüftung auf „Belüftungsventil“ setzen, und die Warnung verschwindet.', 'De aansluitleiding DN 50 van het bad heeft capaciteit over en faalt toch: niet-geventileerd mag ze in systeem I 4 m lang zijn. Zet de ontluchting op “beluchter” en de waarschuwing verdwijnt.', 'Le branchement DN 50 de la baignoire a de la capacité en réserve, et pourtant il échoue : non ventilé, il est limité à 4 m en système I. Réglez la ventilation sur « clapet AAV » et l’alerte disparaît.', 'La derivación DN 50 de la bañera tiene capacidad de sobra y aun así falla: sin ventilar, en el sistema I se admiten 4 m. Ponga la ventilación en «válvula AAV» y el aviso desaparece.', 'Podejście wanny DN 50 ma zapas przepustowości, a jednak nie przechodzi: niewentylowane w systemie I może mieć 4 m. Ustaw wentylację na „zawór AAV” i ostrzeżenie znika.')],

    T7('All showers run after the match: K = 1.0 doubles the flow of the same fixtures in a dwelling (K = 0.5) — 7.8 instead of 3.9 l/s, and the collector grows to DN 150.', 'Після матчу працюють усі душі: K = 1,0 подвоює витрату тих самих приладів порівняно з житлом (K = 0,5) — 7,8 замість 3,9 л/с, і збірний лежак зростає до DN 150.', 'Nach dem Spiel laufen alle Duschen: K = 1,0 verdoppelt den Abfluss derselben Gegenstände gegenüber einer Wohnung (K = 0,5) — 7,8 statt 3,9 l/s, und die Sammelleitung wächst auf DN 150.', 'Na de wedstrijd lopen alle douches: K = 1,0 verdubbelt het debiet van dezelfde toestellen tegenover een woning (K = 0,5) — 7,8 in plaats van 3,9 l/s, en de verzamelleiding groeit tot DN 150.', 'Après le match toutes les douches coulent : K = 1,0 double le débit des mêmes appareils par rapport au logement (K = 0,5) — 7,8 au lieu de 3,9 l/s, et le collecteur passe en DN 150.', 'Tras el partido funcionan todas las duchas: K = 1,0 duplica el caudal de los mismos aparatos frente a una vivienda (K = 0,5): 7,8 en lugar de 3,9 l/s, y el colector crece a DN 150.', 'Po meczu działają wszystkie natryski: K = 1,0 podwaja przepływ tych samych przyborów względem mieszkania (K = 0,5) — 7,8 zamiast 3,9 l/s, a przewód zbiorczy rośnie do DN 150.')],
