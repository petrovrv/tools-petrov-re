<script>
(function () {
'use strict';
/* Tie-in & Outage Window Planner — calculation core (pure functions, no DOM).
   Finish-to-start network, CPM without resources, and a serial resource- and calendar-constrained schedule
   for minimum, expected and maximum durations, compared with the outage window. Hot-tap is a review flag only. */
var TO_VERSION = '2026-10-09.to-3';
var TO_STATUS = ['confirmed', 'rejected', 'unknown', 'not_applicable'];
var TO_KIND = ['work', 'isolation', 'test', 'restore', 'other'];
var TO_DECISION = ['pending', 'approved', 'rejected'];
var TO_EPS = 1e-9;
var TO_SCEN = ['min', 'expected', 'max'];
/* priority rules of the serial schedule generation scheme (Kolisch 1996): latest start, latest finish, minimum slack,
   most total successors, greatest rank positional weight, shortest processing time */
var TO_RULES = ['lst', 'lft', 'mslk', 'mts', 'grpw', 'spt'];

function toNum(v) { return typeof v === 'number' && isFinite(v) ? v : null; }
function toText(v) { return v === null || v === undefined ? '' : String(v).trim(); }
function toList(v) { var out = []; toText(v).split(/[,;\s]+/).forEach(function (x) { if (x && out.indexOf(x) < 0) out.push(x); }); return out; }

/* "a-b; c-d" → sorted, merged [[a,b],...]; null when malformed. Bounds: non-negative decimals, b > a */
function toIntervals(text) {
  var s = toText(text); if (!s) return [];
  var parts = s.split(';').map(function (x) { return x.trim(); }).filter(Boolean), arr = [];
  for (var i = 0; i < parts.length; i++) {
    var m = /^(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)$/.exec(parts[i]); if (!m) return null;
    var a = Number(m[1]), b = Number(m[2]); if (!(b > a)) return null; arr.push([a, b]);
  }
  arr.sort(function (x, y) { return x[0] - y[0] || x[1] - y[1]; });
  var out = [];
  arr.forEach(function (it) { var l = out[out.length - 1]; if (l && it[0] <= l[1]) l[1] = Math.max(l[1], it[1]); else out.push(it.slice()); });
  return out;
}

/* ---- validation and model building ---- */
function toBuild(s) {
  var B = { errors: [], gaps: [], warnings: [], tasks: [], T: {}, C: {}, R: {}, I: {}, W: toNum(s.window_hours) };
  function err(c, id) { B.errors.push({ code: c, id: id || null }); }
  function gap(c, id) { B.gaps.push({ code: c, id: id || null }); }
  if (B.W === null || !(B.W > 0)) err('window_invalid');
  if (TO_RULES.indexOf(s.priority_rule) < 0) err('priority_rule_unsupported');
  if (s.window_status !== 'confirmed') gap('window_unconfirmed');
  function ids(list, kind, map, fill) {
    (Array.isArray(list) ? list : []).forEach(function (r, i) {
      var id = toText(r.id) || (kind + '-' + (i + 1));
      if (map[id]) { err('duplicate_id', kind + ':' + id); return; }
      map[id] = fill(r, id, i);
    });
  }
  ids(s.calendars, 'calendar', B.C, function (r, id) {
    var iv = toIntervals(r.intervals); if (iv === null) err('calendar_invalid', id); else if (!iv.length) err('calendar_empty', id);
    if (r.status !== 'confirmed') gap('calendar_unconfirmed', id); return { id: id, iv: iv || [] };
  });
  ids(s.resources, 'resource', B.R, function (r, id) {
    var cap = toNum(r.capacity); if (cap === null || cap < 1 || Math.floor(cap) !== cap) err('capacity_invalid', id);
    var cal = toText(r.calendar); if (cal && !B.C[cal]) err('unknown_calendar', 'resource:' + id);
    if (r.status !== 'confirmed') gap('resource_unconfirmed', id); return { id: id, cap: cap, cal: cal };
  });
  ids(s.tieins, 'tiein', B.I, function (r, id) { return { id: id, src: r }; });
  var active = [];
  ids(s.tasks, 'task', B.T, function (r, id, i) {
    var t = { id: id, index: i, kind: TO_KIND.indexOf(r.kind) >= 0 ? r.kind : 'other', na: r.status === 'not_applicable', pred: toList(r.predecessors), res: toList(r.resources),
      cal: toText(r.calendar), tie: toText(r.tie_in), es0: toNum(r.earliest_start_h), conf: toText(r.configuration), d: {} };
    if (t.es0 === null) t.es0 = 0;
    if (!t.na) active.push(t);
    return t;
  });
  active.forEach(function (t) {
    var r = s.tasks[t.index], e = toNum(r.duration_h), lo = toNum(r.min_h), hi = toNum(r.max_h);
    if (r.status !== 'confirmed') gap('task_unconfirmed', t.id);
    if (e === null) { t.unknown = true; }
    else if (e < 0 || (lo !== null && (lo < 0 || lo > e)) || (hi !== null && hi < e)) err('duration_invalid', t.id);
    else t.d = { min: lo === null ? e : lo, expected: e, max: hi === null ? e : hi };
    if (t.es0 < 0) err('earliest_start_invalid', t.id);
    t.pred.forEach(function (p) { if (!B.T[p]) err('unknown_predecessor', t.id + '>' + p); });
    t.res.forEach(function (q) { if (!B.R[q]) err('unknown_resource', t.id + '>' + q); });
    if (t.cal && !B.C[t.cal]) err('unknown_calendar', 'task:' + t.id);
    if (t.tie && !B.I[t.tie]) err('unknown_tiein', t.id + '>' + t.tie);
    /* predecessors that are not applicable drop out of the network */
    t.pred = t.pred.filter(function (p) { return B.T[p] && !B.T[p].na; });
  });
  B.tasks = active;
  return B;
}

/* Kahn order, ties by input order; null when the network has a cycle */
function toTopo(tasks, T) {
  var indeg = {}, succ = {}, order = [];
  tasks.forEach(function (t) { indeg[t.id] = 0; succ[t.id] = []; });
  tasks.forEach(function (t) { t.pred.forEach(function (p) { indeg[t.id]++; succ[p].push(t.id); }); });
  var ready = tasks.filter(function (t) { return indeg[t.id] === 0; });
  while (ready.length) {
    ready.sort(function (a, b) { return a.index - b.index; });
    var t = ready.shift(); order.push(t);
    succ[t.id].forEach(function (s) { if (--indeg[s] === 0) ready.push(T[s]); });
  }

itsprüfung 1 h passen in ein Fenster von 10 h mit 4 h Reserve. Bevor Sie weiterlesen: Was fehlt?","learnExplainTitle":"Die fehlende Freischaltung","learnExplain":"Die Einbindung hat weder eine Freischaltungsreferenz noch einen Freischaltungsvorgang, die Arbeit würde also an einer Leitung in Betrieb beginnen. Die Lückenliste benennt das, und auf das Zeitergebnis ist kein Verlass: Entleeren und Freischalten kosten Zeit auf dem kritischen Pfad.","learnFixTitle":"Freischalten, arbeiten, prüfen, zurücknehmen","learnFix":"Öffnen Sie „Lösung: Freischaltung und Rücknahme ergänzt“. Freischaltung 2 h vor dem Schweißen und Rücknahme 1 h nach der Prüfung verlängern den kritischen Pfad von 6 h auf 9 h: Die Reserve sinkt von 4 h auf 1 h.","learnBoundaryTitle":"Plan und Entscheidung","learnBoundary":"Der Planer zeigt, ob die Arbeiten mit den angegebenen Dauern ins Fenster passen. Er genehmigt weder ein Anbohren unter Druck noch eine Arbeitserlaubnis; die Freigabe liegt beim verantwortlichen Ingenieur und veraltet nach jeder Änderung einer Eingabe.","reportTitle":"Protokoll Einbindungen und Stillstandsfenster","modelVersion":"Modellversion","eqNote":"E frühester Beginn, F Ende eines Vorgängers, d Dauer, W Fensterlänge, T Gesamtdauer für den Dauersatz k, m Reserve. TF Gesamtpuffer, K_j Kalender des Vorgangs und seiner Ressourcen, n_r Belegung und c_r Kapazität der Ressource r.","modelText":"Der ressourcenbeschränkte Ablaufplan ist ein deterministischer serieller Plan nach der gewählten Prioritätsregel; die fünf anderen Regeln werden zum Vergleich mit den erwarteten Dauern gerechnet, und für keine ist Optimalität bewiesen. Eine unbekannte Dauer, ein Zyklus oder eine fehlende Referenz blockieren den Ablaufplan.","boundaryText":"Berechnung, Passung ins Fenster und Freigabe sind getrennt. Befunde zu Anbohren unter Druck und Arbeitserlaubnis sind Prüfpunkte; das Werkzeug genehmigt nie einen Eingriff.","scopeText":"Planung von Einbindungen, Freischaltungen, Arbeiten und Prüfungen in einem nboren onder druk zonder basis (probleem)","exHotNote":"De tijd past, maar materiaalbasis en toestemming zijn onbekend: er wordt geen passing verklaard.","exTry":"Probeer: aansluiting zonder afsluiting","exTryNote":"Lassen en lekbeproeving, 6 h in een venster van 10 h; bekijk de lacunes.","exFix":"Oplossing: afsluiting en herstel toegevoegd","exFixNote":"Afsluiting 2 h ervoor, herstel 1 h erna: 9 h, marge 1 h.","learnIntroTitle":"Eerst het netwerk, dan kalenders en ploegen","learnIntro":"Taken volgen hun voorgangers. Elke taak moet ook binnen een kalenderinterval passen en een vrije ploeg hebben. Duren worden opgegeven als minimum, verwachte waarde en maximum; een onbekende duur blokkeert de planning.","learnDataTitle":"Taken en aansluitingen","learnData":"Elke aansluiting heeft een afsluiting nodig (referentie en taak), het werk daarna en een beproeving. Aanboren onder druk is alleen een markering voor een afzonderlijke technische beoordeling.","learnModelTitle":"Hoe de planning wordt opgebouwd","learnModel":"Het kritieke pad houdt geen rekening met kalenders en ploegen. Daarna neemt de planning de gereedstaande taak die volgens de gekozen prioriteitsregel (standaard kleinste laatste begin) eerst komt en plaatst die op de eerste begintijd die haar kalenders en ploegen toelaten, voor elk van de drie duursets.","learnTryTitle":"Probeer: past het?","learnTry":"Open ‘Probeer: aansluiting zonder afsluiting’. Lassen 5 h en lekbeproeving 1 h passen in een venster van 10 h met 4 h over. Voordat u verder leest: wat ontbreekt er?","learnExplainTitle":"De ontbrekende afsluiting","learnExplain":"De aansluiting heeft geen afsluitingsreferentie en geen afsluitingstaak, dus het werk zou op een leiding in bedrijf beginnen. De lijst met lacunes noemt dit, en op het tijdsresultaat kan niet worden vertrouwd: aftappen en afsluiten kosten tijd op het kritieke pad.","learnFixTitle":"Afsluiten, werken, beproeven, herstellen","learnFix":"Open ‘Oplossing: afsluiting en herstel toegevoegd’. Afsluiting 2 h voor het lassen en herstel 1 h na de beproeving verlengen het kritieke pad van 6 h naar 9 h: de marge daalt van 4 h naar 1 h.","learnBoundaryTitle":"Planning en beslissing","learnBoundary":"De planner toont of het werk met de opgegeven duren in het venster past. Hij geeft geen toestemming voor aanboren onder druk of voor een werkvergunning; de goedkeuring blijft bij de verantwoordelijke ingenieur en veroudert na elke wijziging van de invoer.","reportTitle":"Verslag aansluitingen en stilstandvenster","modelVersion":"Modelversie","eqNote":"E vroegste begin, F einde van een voorganger, d duur, W vensterlengte, T totale doorlooptijd voor duurset k, m marge. TF totale speling, K_j de kalenders van de taak en haar middelen, n_r bezetting en c_r capaciteit van middel r.","modelText":"De door middelen begrensde planning is een deterministische seriële planning volgens de gekozen prioriteitsregel; de vijf andere regels worden ter vergelijking met de verwachte duren doorgerekend, en van geen enkele is optimaliteit bewezen. Een onbekende duur, een cyclus of een ontbrekende verwijzing blokkeert de planning.","boundaryText":"Berekening, passing in het venster en goedkeuring zijn gescheiden. Bevindingen over aanboren onder druk en werkvergunningen zijn beoordelingspunten; het hulpmiddel geeft nooit toestemming voor een ingreep.","scopeText":"Planning van aansluitingen, afsluitingen, werkzaamheden en beproevingen in een stilstandvenster met afhankelijkheden, kalenders, ploegen en duurbereiken. Het hulpmiddel geeft geen toestemming voor aanboren onder druk of werkvergunningen en trekt geen regelgevende conclusie.","priorityRule":"Prioriteitsregel","rule_lst":"kleinste laatste begin (LST)","rule_lft":"kleinste laatste einde (LFT)","rule_mslk":"minste speling (MSLK)","rule_mts":"meeste opvolgers in totaal (MTS)","rule_grpw":"grootste positiegewicht (GRPW)","rule_spt":"kortste duur (SPT)","ruleTable":"Prioriteitsregels met de verwachte duren","noFeasible":"geen haalbar :"État restauré : valeurs remplacées ou supprimées — ","a_estimate_duration":"Estimer la durée.","a_break_cycle":"Rompre le cycle de dépendances.","a_extend_calendar_or_resources":"Étendre le calendrier ou ajouter des ressources.","a_correct_inputs":"Corriger les données d'entrée.","a_confirm_window":"Confirmer la fenêtre d'arrêt.","a_confirm_task_data":"Confirmer les données de la tâche.","a_confirm_calendar":"Confirmer le calendrier.","a_confirm_resource":"Confirmer la ressource.","a_confirm_tiein":"Confirmer la définition du raccordement.","a_add_isolation":"Ajouter la consignation et sa tâche.","a_confirm_isolation":"Confirmer la consignation.","a_sequence_isolation":"Placer les travaux après la consignation.","a_hot_tap_engineering_review":"Piquage en charge : obtenir la revue d'ingénierie et l'autorisation.","a_resolve_permit":"Régler le permis refusé.","a_add_test":"Ajouter l'essai du raccordement.","a_extend_window_or_split_scope":"Prolonger la fenêtre ou scinder le périmètre.","a_reduce_duration_risk":"Réduire l'incertitude sur les durées ou ajouter de la marge.","exControl":"Deux tâches successives (contrôle)","exControlNote":"4 h puis 6 h dans une fenêtre de 12 h : chemin critique 10 h, marge 2 h.","exTypical":"2 raccordements, une équipe de soudage (type)","exTypicalNote":"Fenêtres de permis 2–10 h et 12–20 h et une seule équipe : l'équipe et le calendrier décalent la deuxième soudure.","exShort":"Trois tâches dépendantes, fenêtre trop courte","exShortNote":"Minimum 15 h, attendu 18 h, maximum 23 h pour une fenêtre de 14 h.","exHot":"Piquage en charge sans base (problème)","exHotNote":"Le temps tient, mais la base matériaux et l'autorisation sont inconnues : aucune tenue n'est déclarée.","exTry":"À tester : raccordement sans consignation","exTryNote":"Soudure et essai d'étanchéité, 6 h dans une fenêtre de 10 h ; examinez les lacunes.","exFix":"Corrigé : consignation et déconsignation","exFixNote":"Consignation 2 h avant, déconsignation 1 h après : 9 h, marge 1 h.","learnIntroTitle":"Réseau, puis calendriers et équipes","learnIntro":"Les tâches suivent leurs prédécesseurs. Chacune doit aussi tenir dans un intervalle de calendrier et disposer d'une équipe libre. Les durées sont données en minimum, valeur attendue et maximum ; une durée inconnue bloque le planning.","learnDataTitle":"Tâches et raccordements","learnData":"Chaque raccordement nécessite une consignation (référence et tâche), les travaux qui la suivent et un essai. Le piquage en charge n'est qu'un indicateur pour une revue d'ingénierie séparée.","learnModelTitle":"Construction du planning","learnModel":"Le chemin critique ignore calendriers et équipes. Le planning prend ensuite la tâche prête qui vient en premier selon la règle de priorité choisie (par défaut le plus petit début au plus tard) et la place au premier début que permettent ses calendriers et ses équipes, pour chacun des trois jeux de durées.","learnTryTitle":"À tester : ça tient ?","learnTry":"Ouvrez « À tester : raccordement sans consignation ». La soudure de 5 h et l'essai d'étanchéité de 1 h tiennent dans une fenêtre de 10 h avec 4 h de marge. Avant de lire la suite : que manque-t-il ?","learnExplainTitle":"La consignation manquante","learnExplain":"Le raccordement n'a ni référence ni tâche de consignation : les travaux commenceraient sur une ligne en service. La liste des lacunes le signale, et le résultat temporel n'est pas fiable : la vidange et la consignation prennent du temps sur le chemin critique.","learnFixTitle":"Consigner, intervenir, tester, déconsigner","learnFix":"Ouvrez « Corrigé : consignation et déconsignation ». La consignation de 2 h avant la soudure et la déconsignation de 1 h après l'essai allongent le chemin critique de 6 h à 9 h : la marge passe de 4 h à 1 h.","learnBoundaryTitle":"Planning et décision","learnBoundary":"Le planificateur indique si les travaux tiennent dans la fenêtre avec les durées indiquées. Il n'autorise ni piquage en charge ni permis ; l'approbation reste du ressort de l'ingénieur responsable et devient périmée après toute modification des données.","reportTitle":"Fiche raccordements et fenêtre d'arrêt","modelVersion":"Version du modèle","eqNote":"E début au plus tôt, F fin d'un prédécesseur, d durée, W durée de la fenêtre, T durée totale pour le jeu de durées k, m marge. TF marge totale, K_j calendriers de la tâche et de ses ressources, n_r charge et c_r capacité de la ressource r.","modelText":"Le planning sous contrainte de ressources est un planning sériel déterministe selon la règle de priorité choisie ; les cinq autres règles sont calculées sur les durées attendues pour comparaison, et l'optimalité d'aucune n'est démontrée. Une durée inconnue, un cycle ou une référence manquante bloque le planning.","boundaryText":"Calcul, tenue dans la fenêtre et approbation sont séparés. Les constats sur le piquage en charge et les permis sont des points de revue ; l'outil n'autorise jamais une opération.","scopeText":"Planification des raccordements, consignations, travaux et essais dans une fenêtre d'arrêt, avec dépendances, calendriers, équipes et plages de durées. L'outil n'autorise ni piquages en charge ni permis et ne fournit aucune conclusion réglementaire.","priorityRule":"Règle de priorité","rule_lst":"plus petit début au plus tard (LST)","rule_lft":"plus petite fin au plus tard (LFT)","rule_mslk":"plus faible marge (MSLK)","rule_mts":"plus grand nombre de successeurs (MTS)","rule_grpw":"plus grand poids positionnel (GRPW)","rule_spt":"durée la plus courte (SPT)","ruleTable":"Règles de priorité sur les durées attendues","noFeasible":"aucun planning réalisable","w_shorter_rule_available":"Un planning attendu plus court est obtenu avec la règle","a_try_priority_rule":"Vérifiez le planning avec la règle","b_priority_rule_unsupported":"La règle de priorité ne fait pas partie des six règles."},"es":{"title":"Planificador: conexiones y ventana de parada","subtitle":"¿Caben las conexiones, aislamientos, trabajos y egistra","decisionBasis":"La aprobación está vinculada a la huella de los datos de entrada; cualquier cambio en ellos la deja caducada.","run":"Calcular","results":"Encaje en la ventana","fitWindow":"Cabe en la ventana","critMet":"cumplido","critNotMet":"no cumplido","durationExpected":"Duración, esperada","rangeMinMax":"mín. … máx.","marginExpected":"Margen hasta la ventana, esperado","cpmDuration":"Ruta crítica, sin recursos","cpmHint":"solo la red, sin calendarios ni cuadrillas","openGaps":"Carencias abiertas","scheduleTable":"Programa (duraciones esperadas)","start":"Inicio","finish":"Fin","delay":"Espera","critical":"crítica","resourceTable":"Uso de recursos","busy":"Ocupado","configTable":"Configuraciones de la planta en el tiempo","atTime":"Momento","configuration":"Configuración","gapTable":"Carencias","gap":"Carencia","actions":"Acciones","action":"Acción","warning":"Nota","window":"Ventana","plot":"Programa frente a la ventana","noResult":"Pulse «Calcular».","delayLegend":"espera debida a calendarios o recursos","minMaxLegend":"fin con duraciones mínimas y máximas","verdictBlocked":"Sin programa: datos incompletos o incoherentes.","verdict_met":"Con duraciones máximas el trabajo cabe en la ventana y todos los datos están confirmados.","verdict_not_met":"Incluso con duraciones mínimas el trabajo excede la ventana.","verdict_unknown":"No se muestra el encaje: la ventana puede excederse dentro del rango de duraciones, o hay datos y autorizaciones abiertos.","b_window_invalid":"duración de la ventana ausente o no positiva","b_duplicate_id":"ID duplicado","b_calendar_invalid":"intervalos de calendario mal formados (use 2-10; 12-20)","b_calendar_empty":"el calendario no tiene intervalos","b_capacity_invalid":"la capacidad debe ser un número entero ≥ 1","b_unknown_calendar":"remite a un calendario que no existe","b_duration_invalid":"rango de duración no válido (negativo, mínimo mayor que el esperado o máximo menor que el esperado)","b_earliest_start_invalid":"el ","a_confirm_resource":"Confirme el recurso.","a_confirm_tiein":"Confirme la definición de la conexión.","a_add_isolation":"Añada el aislamiento y su tarea.","a_confirm_isolation":"Confirme el aislamiento.","a_sequence_isolation":"Haga que el trabajo siga al aislamiento.","a_hot_tap_engineering_review":"Derivación en caliente: obtenga la revisión de ingeniería y la autorización.","a_resolve_permit":"Resuelva el permiso rechazado.","a_add_test":"Añada la prueba de la conexión.","a_extend_window_or_split_scope":"Amplíe la ventana o divida el alcance.","a_reduce_duration_risk":"Reduzca la incertidumbre de las duraciones o añada holgura.","exControl":"Dos trabajos sucesivos (control)","exControlNote":"4 h y luego 6 h en una ventana de 12 h: ruta crítica 10 h, margen 2 h.","exTypical":"Dos conexiones, una cuadrilla (típico)","exTypicalNote":"Ventanas de permiso de 2–10 h y 12–20 h y una cuadrilla de soldadura: la cuadrilla y el calendario desplazan la segunda soldadura.","exShort":"Tres trabajos dependientes, ventana corta","exShortNote":"Mínimo 15 h, esperado 18 h, máximo 23 h frente a una ventana de 14 h.","exHot":"Derivación en caliente sin base (problema)","exHotNote":"El tiempo cabe, pero la base de materiales y la autorización son desconocidas: no se declara encaje.","exTry":"Ejercicio: conexión sin aislamiento","exTryNote":"Soldadura y prueba de estanqueidad, 6 h en una ventana de 10 h; revise las carencias.","exFix":"Solución: aislamiento y restitución añadidos","exFixNote":"Aislamiento 2 h antes, restitución 1 h después: 9 h, margen 1 h.","learnIntroTitle":"La red, luego calendarios y cuadrillas","learnIntro":"Las tareas siguen a sus predecesoras. Cada una debe además caber en un intervalo de calendario y disponer de una cuadrilla libre. Las duraciones se dan como mínima, esperada y máxima; una duración desconocida bloquea el plan.","learnDataTitle":"Tareas y conexiones","learnData":"Cada conexión necesita un aislamiento (referencia y tarea), el trabajo posterior y una prueba. La derivación en caliente es solo una marca para una revisión de ingeniería aparte.","learnModelTitle":"Cómo se construye el programa","learnModel":"La ruta crítica ignora calendarios y cuadrillas. Después, el programa toma la tarea lista que va primero según la regla de prioridad elegida (por defecto el menor inicio más tardío) y la sitúa en el primer inicio que permiten sus calendarios y cuadrillas, para cada uno de los tres conjuntos de duraciones.","learnTryTitle":"Ejercicio: ¿cabe?","learnTry":"Abra «Ejercicio: conexión sin aislamiento». Soldadura de 5 h y prueba de estanqueidad de 1 h caben en una ventana de 10 h con 4 h de sobra. Antes de seguir leyendo: ¿qué falta?","learnExplainTitle":"El aislamiento que falta","learnExplain":"La conexión no tiene referencia de aislamiento ni tarea de aislamiento, así que el trabajo empezaría en una línea en servicio. La lista de carencias lo indica, y el resultado de tiempo no es fiable: drenar y aislar lleva tiempo en la ruta crítica.","learnFixTitle":"Solución: aislar, trabajar, probar, restituir","learnFix":"Abra «Solución: aislamiento y restitución añadidos». El aislamiento de 2 h antes de la soldadura y la restitución de 1 h después de la prueba alargan la ruta crítica de 6 h a 9 h: el margen baja de 4 h a 1 h.","learnBoundaryTitle":"Plan y decisión","learnBoundary":"El planificador muestra si el trabajo cabe en la ventana con las duraciones indicadas. No autoriza derivaciones en caliente ni permisos; la aprobación corresponde al ingeniero responsable y caduca tras cualquier cambio en los datos.","reportTitle":"Registro de conexiones y ventana de parada","modelVersion":"Versión del modelo","eqNote":"E inicio más temprano, F fin de una predecesora, d duración, W duración de la ventana, T duración total para el conjunto de duraciones k, m margen. TF holgura total, K_j calendarios de la tarea y de sus recursos, n_r carga y c_r capacidad del recurso r.","modelText":"El programa con recursos limitados es un programa en serie determinista según la regla de prioridad elegida; las otras cinco reglas se calculan con las duraciones esperadas para comparar, y la optimalidad de ninguna está demostrada. Una duración desconocida, un ciclo o una referencia ausente bloquean el programa.","boundaryText":"Cálculo, encaje en la ventana y aprobación están separados. Los hallazgos sobre derivación en caliente y permisos son puntos de revisión; la herramienta nunca autoriza una operación.","scopeText":"Planificación de conexiones, aislamientos, trabajos y pruebas en una ventana de parada con dependencias, calendarios, cuadrillas y rangos de duración. No autoriza derivaciones en caliente ni permisos y no emite conclusiones regulatorias.","priorityRule":"Regla de prioridad","rule_lst":"menor inicio más tardío (LST)","rule_lft":"menor fin más tardío (LFT)","rule_mslk":"menor holgura (MSLK)","rule_mts":"más sucesores totales (MTS)","rule_grpw":"mayor peso posicional (GRPW)","rule_spt":"menor duración (SPT)","ruleTable":"Reglas de prioridad con las duraciones esperadas","noFeasible":"ningún programa factible","w_shorter_rule_available":"Un programa esperado más corto se obtiene con la regla","a_try_priority_rule":"Compruebe el programa con la regla","b_priority_rule_unsupported":"La regla de prioridad no es una de las seis reglas."},"pl":{"title":"Planer włączeń i okna postoju","subtitle":"Czy włączenia, odcięcia, prace i próby mieszczą się w oknie postoju? Ścieżka krytyczna, kalendarze, konflikty brygad i zakresy czasów trwania","windowPanel":"Okno postoju","item":"Postój / zakres","windowLength":"Długość okna","status":"Stan","source":"Źródło","syntheticCase":"Syntetyczny przykład szkoleniowy","tasks":"Zadania","editTask":"Wybrane zadanie","editRow":"Wybrany wiersz","addRow":"Dodaj wiersz","id":"ID","durationShort":"Czas trwania, h","predecessors":"Poprzedniki","name":"Nazwa","kind":"Rodzaj","kind_work":"prace","kind_isolation":"odcięcie","kind_test":"próba","kind_restore":"zdjęcie odcię
