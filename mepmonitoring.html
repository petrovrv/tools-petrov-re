  "title": {"en":"Condition Monitoring Advisor","uk":"Порадник з моніторингу технічного стану","de":"Berater Zustandsüberwachung","nl":"Adviseur conditiebewaking","fr":"Conseiller en surveillance d’état","es":"Asesor de monitorización de condición","pl":"Doradca monitorowania stanu technicznego"},
  "summary": {"en":"What to measure, how often, and does it pay? Usable P–F interval per technique, inspection interval, probability of catching the failure and cost-benefit ranges with the break-even downtime cost.","uk":"Що вимірювати, як часто і чи це окупиться? Корисний інтервал P–F для кожного методу, інтервал оглядів, імовірність виявити відмову та діапазони витрат і вигод з беззбитковою вартістю простою.","de":"Was messen, wie oft, und lohnt es sich? Nutzbares P–F-Intervall je Verfahren, Prüfintervall, Wahrscheinlichkeit, den Ausfall rechtzeitig zu erkennen, und Kosten-Nutzen-Bandbreiten mit der Break-even-Stillstandskostenrate.","nl":"Wat meten, hoe vaak, en loont het? Bruikbaar P–F-interval per techniek, inspectie-interval, kans om de storing op tijd te zien en kosten-batenbandbreedtes met de break-even stilstandskosten.","fr":"Quoi mesurer, à quelle fréquence, et est-ce rentable ? Intervalle P–F exploitable par technique, périodicité d’inspection, probabilité de détecter la défaillance et fourchettes coûts-bénéfices avec le coût d’arrêt d’équilibre.","es":"¿Qué medir, con qué frecuencia y compensa? Intervalo P–F aprovechable por técnica, intervalo de inspección, probabilidad de detectar el fallo y rangos de coste-beneficio con el coste de parada de equilibrio.","pl":"Co mierzyć, jak często i czy to się opłaca? Użyteczny interwał P–F dla każdej techniki, interwał inspekcji, prawdopodobieństwo wykrycia uszkodzenia oraz przedziały kosztów i korzyści z progowym kosztem przestoju."},
  "description": {"en":"For one failure mode of one MEP asset the tool compares condition-monitoring options — a manual route at a chosen interval, an online sensor or a BMS trend. It takes the share of the P–F interval each technique can use, subtracts the time needed to act, sets the inspection interval at half the remaining window, computes the probability that an inspection falls inside the window and detects the defect, and turns that into an annual net benefit with low, mid and high values. The break-even downtime cost says how expensive an hour of outage must be before the monitoring pays.","uk":"Для одного виду відмови одного інженерного об’єкта інструмент порівнює варіанти моніторингу стану — обхід із вибраним інтервалом, стаціонарний датчик або тренд у BMS. Він бере частку інтервалу P–F, доступну методу, віднімає час на реагування, задає інтервал оглядів як половину вікна, що лишається, обчислює ймовірність, що огляд потрапить у вікно й виявить дефект, і переводить це в річну чисту вигоду з низьким, середнім і високим значеннями. Беззбиткова вартість простою показує, наскільки дорогою має бути година простою, щоб моніторинг окупився.","de":"Für eine Ausfallart einer TGA-Anlage vergleicht das Werkzeug Optionen der Zustandsüberwachung — Rundgang mit gewähltem Intervall, Online-Sensor oder GLT-Trend. Es nimmt den Anteil des P–F-Intervalls, den das Verfahren nutzen kann, zieht die Reaktionszeit ab, setzt das Prüfintervall auf die Hälfte des Restfensters, berechnet die Wahrscheinlichkeit, dass eine Prüfung ins Fenster fällt und den Schaden erkennt, und macht daraus einen jährlichen Nettonutzen mit niedrigem, mittlerem und hohem Wert. Die Break-even-Stillstandskosten sagen, wie teuer eine Ausfallstunde sein muss, damit sich die Überwachung lohnt.","nl":"Voor één faalwijze van één installatiedeel vergelijkt de tool opties voor conditiebewaking — een ronde met gekozen interval, een online sensor of een GBS-trend. Hij neemt het deel van het P–F-interval dat de techniek kan benutten, trekt de reactietijd af, zet het inspectie-interval op de helft van het resterende venster, berekent de kans dat een inspectie in het venster valt en het defect ziet, en maakt daar een jaarlijks nettovoordeel van met lage, middelste en hoge waarde. De break-even stilstandskosten zeggen hoe duur een uur uitval moet zijn voordat de bewaking loont.","fr":"Pour un mode de défaillance d’un équipement technique, l’outil compare des options de surveillance d’état — ronde à périodicité choisie, capteur en ligne ou tendance GTB. Il prend la part de l’intervalle P–F exploitable par la technique, retranche le délai d’intervention, fixe la périodicité à la moitié de la fenêtre restante, calcule la probabilité qu’une inspection tombe dans la fenêtre et détecte le défaut, puis en déduit un bénéfice net annuel bas, médian et haut. Le coût d’arrêt d’équilibre indique combien doit coûter une heure d’arrêt pour que la surveillance soit rentable.","es":"Para un modo de fallo de un equipo de instalaciones, la herramienta compara opciones de monitorización — ronda con intervalo elegido, sensor en línea o tendencia del BMS. Toma la parte del intervalo P–F que la técnica puede aprovechar, resta el tiempo de respuesta, fija el intervalo en la mitad de la ventana restante, calcula la probabilidad de que una inspección caiga en la ventana y detecte el defecto, y lo convierte en un beneficio neto anual bajo, medio y alto. El coste de parada de equilibrio indica cuánto debe costar una hora de parada para que la monitorización compense.","pl":"Dla jednego rodzaju uszkodzenia jednego urządzenia instalacyjnego narzędzie porównuje warianty monitorowania stanu — obchód z wybranym interwałem, czujnik online lub trend w BMS. Bierze część interwału P–F dostępną dla techniki, odejmuje czas reakcji, ustala interwał inspekcji na połowę pozostałego okna, liczy prawdopodobieństwo, że inspekcja wypadnie w oknie i wykryje defekt, i przelicza to na roczną korzyść netto w wariancie niskim, średnim i wysokim. Progowy koszt przestoju mówi, ile musi kosztować godzina przestoju, aby monitorowanie się opłaciło."},

  "limitations": {"en":"One failure mode at a time; the P–F interval, MTBF and costs are inputs with ranges, and the preset values are learning assumptions, not manufacturer or statistical data. Detection uses a uniform random phase and independent looks for routes (one effective look for online and BMS); it ignores trending skill, sensor drift and the chance that a found defect is repaired badly. Economics are undiscounted annual expected values per measurement point; capital for online systems must be entered as an annualised fixed cost. Statutory inspections are retained regardless of this result (EU baseline, national rules may be stricter). Planning aid, not a substitute for manufacturer instructions and national regulations.","uk":"Один вид відмови за раз; інтервал P–F, напрацювання на відмову та витрати — вхідні дані з діапазонами, а значення в прикладах — навчальні припущення, а не дані виробника чи статистика. Виявлення рахується з рівномірно випадковою фазою та незалежними оглядами для обходів (один ефективний огляд для онлайн і BMS); не враховано майстерність аналізу трендів, дрейф датчиків і ризик неякісного ремонту знайденого дефекту. Економіка — недисконтовані річні очікувані значення на одну точку вимірювання; капітальні витрати онлайн-систем треба вводити як річну постійну складову. Обов’язкові за законом огляди зберігаються незалежно від результату (базовий рівень ЄС, національні правила можуть бути суворішими). Засіб планування, а не заміна інструкцій виробника й національних норм.","de":"Eine Ausfallart je Rechnung; P–F-Intervall, MTBF und Kosten sind Eingaben mit Bandbreiten, die Beispielwerte sind Lernannahmen, keine Hersteller- oder Statistikdaten. Die Erkennung nimmt eine gleichverteilte Phase und unabhängige Prüfungen für Rundgänge an (eine wirksame Prüfung bei Online und GLT); Trendauswertung, Sensordrift und schlecht ausgeführte Reparaturen bleiben unberücksichtigt. Die Wirtschaftlichkeit sind nicht abgezinste jährliche Erwartungswerte je Messstelle; Investitionen in Online-Systeme sind als annuisierte Fixkosten einzugeben. Gesetzliche Prüfungen bleiben unabhängig vom Ergebnis bestehen (EU-Mindeststand, nationale Regeln können strenger sein). Planungshilfe, kein Ersatz für Herstellerangaben und nationale Vorschriften.","nl":"Eén faalwijze per keer; P–F-interval, MTBF en kosten zijn invoer met bandbreedtes, de voorbeeldwaarden zijn leeraannames, geen fabrikant- of statistische gegevens. Detectie gaat uit van een uniform willekeurige fase en onafhankelijke inspecties bij rondes (één effectieve blik bij online en GBS); trendvaardigheid, sensordrift en slecht uitgevoerd herstel blijven buiten beschouwing. De economie bestaat uit niet-verdisconteerde jaarlijkse verwachtingswaarden per meetpunt; investeringen in online systemen worden als geannualiseerde vaste kosten ingevoerd. Wettelijke keuringen blijven staan, wat de uitkomst ook is (EU-basis, nationale regels kunnen strenger zijn). Planningshulpmiddel, geen vervanging van fabrieksvoorschriften en nationale regelgeving.","fr":"Un mode de défaillance à la fois ; intervalle P–F, MTBF et coûts sont des saisies avec fourchettes, et les valeurs des exemples sont des hypothèses pédagogiques, pas des données de constructeur ni des statistiques. La détection suppose une phase aléatoire uniforme et des contrôles indépendants pour les rondes (un seul contrôle effectif en ligne et en GTB) ; elle ignore la compétence d’analyse de tendance, la dérive des capteurs et le risque d’une réparation mal faite. L’économie est faite de valeurs annuelles espérées non actualisées par point de mesure ; l’investissement d’un système en ligne se saisit en coût fixe annualisé. Les contrôles réglementaires sont maintenus quel que soit le résultat (socle UE, les règles nationales peuvent être plus strictes). Aide à la planification, ne remplace ni les instructions du constructeur ni la réglementation nationale.","es":"Un modo de fallo cada vez; el intervalo P–F, el MTBF y los costes son entradas con rangos, y los valores de los ejemplos son supuestos didácticos, no datos de fabricante ni estadísticas. La detección supone una fase aleatoria uniforme e inspecciones independientes en rondas (una sola inspección efectiva en línea y BMS); no considera la pericia en tendencias, la deriva de sensores ni la reparación defectuosa. La economía son valores esperados anuales sin descontar por punto de medida; la inversión de un sistema en línea se introduce como coste fijo anualizado. Las inspecciones reglamentarias se mantienen sea cual sea el resultado (base UE, las normas nacionales pueden ser más estrictas). Ayuda a la planificación, no sustituye las instrucciones del fabricante ni la normativa nacional.","pl":"Jeden rodzaj uszkodzenia naraz; interwał P–F, MTBF i koszty to dane wejściowe z przedziałami, a wartości w przykładach są założeniami dydaktycznymi, nie danymi producenta ani statystyką. Wykrywanie zakłada równomiernie losową fazę i niezależne pomiary w obchodach (jeden skuteczny pomiar dla online i BMS); pomija umiejętność analizy trendu, dryf czujników i ryzyko złej naprawy. Ekonomia to niezdyskontowane roczne wartości oczekiwane na punkt pomiarowy; nakłady na system online wpisuje się jako roczny koszt stały. Przeglądy ustawowe pozostają niezależnie od wyniku (minimum UE, przepisy krajowe mogą być surowsze). Pomoc w planowaniu, nie zastępuje instrukcji producenta ani przepisów krajowych."},

  "validation": {"basis": {"en": "P–F interval and the half-window on-condition task interval after Moubray, RCM II (1997) and the NASA RCM Guide for Facilities and Collateral Equipment (2008); detection probability for periodic inspection with a random onset phase; annual expected-value economics. Evidence: an independent Python reference (bench-src/ref/gen_mepmonitoring.py) that averages the detection probability numerically over the inspection phase, cross-checks it by Monte Carlo and finds the break-even downtime cost by bisection, compared with the page's engine over 65 cases.", "uk": "Інтервал P–F і інтервал завдань за станом як половина вікна — за Moubray, RCM II (1997) та NASA RCM Guide for Facilities and Collateral Equipment (2008); імовірність виявлення при періодичних оглядах із випадковою фазою початку дефекту; річна економіка в очікуваних значеннях. Докази: незалежний еталон на Python, що усереднює ймовірність виявлення чисельно за фазою оглядів, перевіряє її методом Монте-Карло та знаходить беззбиткову вартість простою бісекцією, порівняний з рушієм сторінки на 65 випадках.", "de": "P–F-Intervall und zustandsabhängiges Prüfintervall als halbes Fenster nach Moubray, RCM II (1997) und NASA RCM Guide for Facilities and Collateral Equipment (2008); Erkennungswahrscheinlichkeit periodischer Prüfungen bei zufälliger Phase des Schadensbeginns; jährliche Erwartungswert-Wirtschaftlichkeit. Nachweis: eine unabhängige Python-Referenz, die die Erkennungswahrscheinlichkeit numerisch über die Prüfphase mittelt, per Monte-Carlo gegenprüft und die Break-even-Stillstandskosten per Bisektion bestimmt, in 65 Fällen mit der Engine der Seite verglichen.", "nl": "P–F-interval en het conditiegebonden inspectie-interval als halve venster volgens Moubray, RCM II (1997) en de NASA RCM Guide for Facilities and Collateral Equipment (2008); detectiekans bij periodieke inspectie met willekeurige fase van het ontstaan; jaarlijkse economie in verwachtingswaarden. Bewijs: een onafhankelijke Python-referentie die de detectiekans numeriek over de inspectiefase middelt, met Monte Carlo controleert en de break-even stilstandskosten met bisectie vindt, in 65 gevallen vergeleken met de engine van de pagina.", "fr": "Intervalle P–F et périodicité de tâche conditionnelle égale à la demi-fenêtre d’après Moubray, RCM II (1997) et le NASA RCM Guide for Facilities and Collateral Equipment (2008) ; probabilité de détection d’inspections périodiques avec une phase d’apparition aléatoire ; économie annuelle en valeurs espérées. Preuve : une référence Python indépendante qui moyenne numériquement la probabilité de détection sur la phase, la vérifie par Monte-Carlo et trouve le coût d’arrêt d’équilibre par dichotomie, comparée au moteur de la page sur 65 cas.", "es": "Intervalo P–F e intervalo de tarea a condición igual a media ventana según Moubray, RCM II (1997) y la NASA RCM Guide for Facilities and Collateral Equipment (2008); probabilidad de detección con inspección periódica y fase de inicio aleatoria; economía anual en valores esperados. Evidencia: una referencia Python independiente que promedia numéricamente la probabilidad de detección sobre la fase, la contrasta por Monte Carlo y halla el coste de parada de equilibrio por bisección, comparada con el motor de la página en 65 casos.", "pl": "Interwał P–F i interwał zadania według stanu równy połowie okna wg Moubray, RCM II (1997) oraz NASA RCM Guide for Facilities and Collateral Equipment (2008); prawdopodobieństwo wykrycia przy inspekcjach okresowych z losową fazą początku defektu; roczna ekonomia w wartościach oczekiwanych. Dowód: niezależna referencja w Pythonie, która uśrednia prawdopodobieństwo wykrycia numerycznie po fazie inspekcji, sprawdza je metodą Monte Carlo i wyznacza progowy koszt przestoju bisekcją, porównana z silnikiem strony w 65 przypadkach."}, "independent_validation": false, "benchmarks": [{"id": "mepmonitoring-ref-2026-11-05", "reference": {"en": "bench-src/ref/gen_mepmonitoring.py: numerical phase average of the detection probability (Monte Carlo cross-check), annual expected economics from the stated formulas, break-even downtime cost by bisection; 17 preset options and 48 grid cases.", "uk": "bench-src/ref/gen_mepmonitoring.py: чисельне усереднення ймовірності виявлення за фазою (перевірка Монте-Карло), річна економіка за наведеними формулами, беззбиткова вартість простою бісекцією; 17 варіантів із прикладів і 48 випадків сітки.", "de": "bench-src/ref/gen_mepmonitoring.py: numerische Phasenmittelung der Erkennungswahrscheinlichkeit (Monte-Carlo-Gegenprobe), jährliche Erwartungswerte nach den angegebenen Formeln, Break-even per Bisektion; 17 Beispieloptionen und 48 Gitterfälle.", "nl": "bench-src/ref/gen_mepmonitoring.py: numerieke fasemiddeling van de detectiekans (Monte Carlo-controle), jaarlijkse verwachtingswaarden volgens de gegeven formules, break-even met bisectie; 17 voorbeeldopties en 48 rastergevallen.", "fr": "bench-src/ref/gen_mepmonitoring.py : moyenne numérique sur la phase de la probabilité de détection (contrôle Monte-Carlo), économie annuelle selon les formules indiquées, équilibre par dichotomie ; 17 options d’exemples et 48 cas de grille.", "es": "bench-src/ref/gen_mepmonitoring.py: promedio numérico sobre la fase de la probabilidad de detección (contraste Monte Carlo), economía anual según las fórmulas indicadas, equilibrio por bisección; 17 opciones de ejemplo y 48 casos de rejilla.", "pl": "bench-src/ref/gen_mepmonitoring.py: numeryczne uśrednienie po fazie prawdopodobieństwa wykrycia (kontrola Monte Carlo), roczna ekonomia wg podanych wzorów, próg bisekcją; 17 wariantów z przykładów i 48 przypadków siatki."}, "citations": ["Moubray J. (1997) Reliability-centred Maintenance, 2nd ed., Butterworth-Heinemann, ch. 7 (P–F interval, on-condition task interval)", "NASA (2008) Reliability Centered Maintenance Guide for Facilities and Collateral Equipment, §5 (P–F curve, PT&I techniques)", "US DOE FEMP (2010) Operations & Maintenance Best Practices Guide, Release 3.0, ch. 5–6"], "cases": 65, "passed": 65, "tolerance": "intervals exact; detection probability within 2e-4 absolute; net benefit within max(0.5 EUR, 0.1 %); cost within max(0.01 EUR, 1e-6 rel); break-even kind exact, value within max(0.5 EUR/h, 0.2 %)", "run_at": "2026-11-06T23:30:27Z", "artifact": "benchmarks/mepmonitoring.json"}]},  "report": {"pdf": true, "source_attribution": true},

  function stateFromPreset(p) {
    var c = p.case;
    return {
      preset: p.id, asset_id: null, fm_id: p.fm_id, asset_class: p.asset_class,
      pf_lo: c.pf_days[0], pf_mid: c.pf_days[1], pf_hi: c.pf_days[2],
      mtbf_lo: c.mtbf_y[0], mtbf_mid: c.mtbf_y[1], mtbf_hi: c.mtbf_y[2],
      response_days: c.response_days, safety: !!c.safety,

      cons_p: c.consequence_probability, units: c.units, fa_y: c.false_alarms_y, fa_cost: c.false_alarm_cost_eur,
      options: p.options.map(function (o) {
        var cost = o.mode === 'route' ? o.cost_per_reading_eur : o.fixed_eur_y;
        return { id: o.id, technique: o.technique, mode: o.mode,
                 interval: o.mode === 'route' ? (o.interval_days || 0) : 0,

  function caseOf(s) {
    return { pf_days: [s.pf_lo, s.pf_mid, s.pf_hi], mtbf_y: [s.mtbf_lo, s.mtbf_mid, s.mtbf_hi],
             response_days: s.response_days, corrective_cost_eur: s.corrective, planned_repair_cost_eur: s.planned,
             downtime_cost_eur_h: s.downtime, mttr_h: s.mttr, planned_downtime_h: s.planned_dt,
             consequence_probability: s.cons_p, units: s.units, false_alarms_y: s.fa_y,
             false_alarm_cost_eur: s.fa_cost, safety: s.safety };
  }
  function optionsOf(s) {
    return (s.options || []).map(function (o, i) {
      var cost = [o.c_lo, o.c_mid, o.c_hi];
      var r = { id: o.id || ('opt' + (i + 1)), technique: o.technique, mode: o.mode,
                interval_days: o.mode === 'route' && o.interval > 0 ? o.interval : null,

  var DEFAULTS = {};

  function initModel() {
    CM = window.MEPCM || null;

  var last = null;          /* {cmp, pick, tornado, curve} */

  function solve(s) {
    if (!CM || !s.options || !s.options.length) return null;
    var cs = caseOf(s), ops = optionsOf(s);
    var cmp = CM.compare(cs, ops);
    var pick = null;
    if (s.pick && s.pick !== 'best') {
      var idx = parseInt(String(s.pick).split(':')[0], 10);
      if (idx >= 0 && idx < cmp.rows.length) pick = cmp.rows[idx];
    }
    if (!pick) pick = cmp.best;
    var pickOpt = ops[cmp.rows.indexOf(pick)];
    var be = pick.mid.breakeven_downtime_eur_h;
    var dMax = Math.max(100, 2.5 * Math.max(s.downtime || 0, be || 0));
    return { cmp: cmp, pick: pick, tornado: CM.tornado(cs, pickOpt), curve: CM.netVsDowntime(cs, pickOpt, dMax, 48), dMax: dMax };
  }

  /* --- register (MEPCore) ------------------------------------------------------------------ */
  var bar = null;            /* MEPCore register bar handle: the bar owns the in-memory register (QA-4) */
  function regDoc() {
    var core = CORE();
    if (!core || !core.register) return null;
    if (bar && typeof bar.getDoc === 'function') { try { return bar.getDoc(); } catch (e) { /* fall through */ } }
    try { return core.register.load(); } catch (e) { return null; }
  }
  function regAssets() { var d = regDoc(); return d && Array.isArray(d.assets) ? d.assets : []; }
  function classOf(id) { var core = CORE(); return core && core.CLASSES ? (Array.isArray(core.CLASSES) ? core.CLASSES.filter(function (c) { return c.id === id; })[0] : core.CLASSES[id]) : null; }
  function loadFromLibrary() {
    var a = regAssets().filter(function (x) { return x.id === state.asset_id; })[0];
    if (!a) return false;
    var cls = classOf(a.class);
    if (!cls || !Array.isArray(cls.failure_modes)) return false;
    var fm = cls.failure_modes.filter(function (f) { return f.id === state.fm_id; })[0] ||
             cls.failure_modes.filter(function (f) { return f.pf_days; })[0];
    if (!fm || !fm.pf_days) return false;
    var core = CORE(), tech = core.TECHNIQUES || {};
    state.fm_id = fm.id; state.asset_class = a.class; state.preset = null;
    state.pf_lo = fm.pf_days[0]; state.pf_mid = fm.pf_days[1]; state.pf_hi = fm.pf_days[2];
    if (fm.mtbf_y) { state.mtbf_lo = fm.mtbf_y[0]; state.mtbf_mid = fm.mtbf_y[1]; state.mtbf_hi = fm.mtbf_y[2]; }
    state.safety = !!fm.safety;
    var typ = cls.typical || {};
    if (a.downtime_cost_eur_h != null) state.downtime = a.downtime_cost_eur_h;
    if (a.mttr_h != null) state.mttr = a.mttr_h; else if (typ.mttr_h) state.mttr = typ.mttr_h[1];
    state.options = [];
    (fm.techniques || []).forEach(function (tid) {
      var t = tech[tid] || {}, fb = CM.TECH_FALLBACK[tid] || {};
      (fb.modes || ['route']).forEach(function (mode) {
        var cost = mode === 'route' ? (t.cost_per_reading_eur || fb.cost_per_reading_eur || [0, 0, 0])
                                    : (t.online_fixed_eur_y || fb.online_fixed_eur_y || [0, 0, 0]);
        state.options.push({ id: tid + '_' + mode, technique: tid, mode: mode, interval: 0,
          pod: t.pod != null ? t.pod : (fb.pod != null ? fb.pod : 0.8),
          pf_fraction: t.pf_fraction != null ? t.pf_fraction : (fb.pf_fraction != null ? fb.pf_fraction : 0.7),
          c_lo: cost[0], c_mid: cost[1], c_hi: cost[2] });
      });
    });
    state.pick = 'best';
    return state.options.length > 0;
  }
  function writeToRegister() {
    var core = CORE();
    if (!core || !core.register || !last) return false;
    var doc = regDoc() || core.register.empty();
    var prev = (doc.modules && doc.modules.mepmonitoring) || {};
    var prevState = prev.state && typeof prev.state === 'object' ? prev.state : {};
    var res = CM.toModuleResult(last.cmp, { fm_id: state.fm_id });
    /* PLAN §1.5: results only under register asset ids, one entry per failure mode inside (by_fm);
       the top level repeats the latest failure mode. Presets and manual cases go to state.cases (QA-9). */
    var results = {};
    Object.keys(prev.results || {}).forEach(function (k) { if (k.indexOf('case:') !== 0) results[k] = prev.results[k]; });
    var cases = Object.assign({}, prevState.cases || {});
    Object.keys(prev.results || {}).forEach(function (k) { if (k.indexOf('case:') === 0 && !cases[k.slice(5)]) cases[k.slice(5)] = prev.results[k]; });
    var isAsset = !!state.asset_id && (doc.assets || []).some(function (a) { return a.id === state.asset_id; });
    var key;
    if (isAsset) {
      key = state.asset_id;
      var byFm = Object.assign({}, (results[key] && results[key].by_fm) || {});
      byFm[res.fm_id || 'manual'] = res;
      results[key] = Object.assign({}, res, { by_fm: byFm });
    } else {
      key = state.preset || state.fm_id || 'manual';
      cases[key] = Object.assign({ asset_class: state.asset_class || null }, res);
    }
    var used = state.used && (state.used.crit || state.used.strat) ? JSON.parse(JSON.stringify(state.used)) : null;
    var payload = { state: { last_case: key, cases: cases, used: used }, results: results,
                    summary: { assets: Object.keys(results).length, cases: Object.keys(cases).length, engine: 'MEPCM ' + CM.VERSION },
                    updatedAt: new Date().toISOString() };
    try {
      var next = core.register.withModule(doc, 'mepmonitoring', payload);
      if (bar && typeof bar.setDoc === 'function') { bar.setDoc(next); return true; }
      var r = core.register.save(next); return !r || r.ok !== false;
    } catch (e) { return false; }
  }

          pdetect: {

            body: T('The defect starts at a random moment relative to your calendar. If the window is shorter than the interval, a look falls inside it only in a fraction window/interval of cases; each look then finds the defect with the technique’s probability per reading. A route’s readings are counted as independent; an online sensor or a BMS point counts as one look, because a sensor that misses a defect tends to keep missing it.',
                    'Дефект виникає у випадковий момент відносно вашого графіка. Якщо вікно коротше за інтервал, огляд потрапляє в нього лише в частці «вікно/інтервал» випадків; кожен огляд знаходить дефект з імовірністю методу на одне вимірювання. Вимірювання обходу вважаються незалежними; стаціонарний датчик або точка BMS рахуються як один огляд, бо датчик, що пропустив дефект, зазвичай пропускає його й далі.',
                    'Der Schaden beginnt zu einem zufälligen Zeitpunkt relativ zu Ihrem Kalender. Ist das Fenster kürzer als das Intervall, fällt eine Prüfung nur im Anteil Fenster/Intervall der Fälle hinein; jede Prüfung findet den Schaden dann mit der Einzelwahrscheinlichkeit des Verfahrens. Rundgangsmessungen zählen als unabhängig; ein Online-Sensor oder GLT-Punkt als eine Prüfung, weil ein Sensor, der einen Schaden übersieht, ihn meist weiter übersieht.',

                    'El defecto empieza en un momento aleatorio respecto a su calendario. Si la ventana es más corta que el intervalo, una inspección cae dentro solo en la fracción ventana/intervalo de los casos; cada inspección encuentra el defecto con la probabilidad por lectura de la técnica. Las lecturas de una ronda se cuentan como independientes; un sensor en línea o un punto del BMS cuenta como una sola inspección, porque un sensor que no ve un defecto suele seguir sin verlo.',

          economics: {

            body: T('Each failure caught in time saves the difference between the run-to-failure repair and the planned repair, plus the downtime cost for the hours of outage avoided. Benefit = failures per year × probability of detection × saving × consequence probability; net = benefit − readings × cost per reading − annual fixed cost − false alarms. Undiscounted, per measurement point.',

      ctx.beginPath(); ctx.moveTo(X(r.lo.net_eur_y), y); ctx.lineTo(X(r.hi.net_eur_y), y); ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineWidth = 1;
      ctx.fillStyle = k.ink; ctx.beginPath(); ctx.arc(X(r.mid.net_eur_y), y, 3.5, 0, 6.2832); ctx.fill();
    });
    /* tornado */
    ctx.font = '600 12px ' + k.font;
    txt(ctx, L(TF(T('What moves the net of: {0}', 'Що змінює чисту вигоду: {0}', 'Was den Nettonutzen bewegt: {0}', 'Wat het netto beweegt: {0}', 'Ce qui fait bouger le net : {0}', 'Qué mueve el neto de: {0}', 'Co zmienia wynik netto: {0}'), [optShort(last.pick)])).slice(0, coarse ? 40 : 90), 4, splitY - 6, 'left', k.ink);
    ctx.font = '400 12px ' + k.font;
    var PN = {
      pf_days: T('P–F interval', 'Інтервал P–F', 'P–F-Intervall', 'P–F-interval', 'Intervalle P–F', 'Intervalo P–F', 'Interwał P–F'),
      mtbf_y: T('MTBF', 'Напрацювання', 'MTBF', 'MTBF', 'MTBF', 'MTBF', 'MTBF'),
      cost: T('Monitoring cost', 'Ціна моніторингу', 'Überwachungskosten', 'Bewakingskosten', 'Coût de surveillance', 'Coste de monitorización', 'Koszt monitorowania'),
      pod: T('Detection per look', 'Виявлення за огляд', 'Erkennung je Prüfung', 'Detectie per blik', 'Détection par contrôle', 'Detección por inspección', 'Wykrycie na pomiar'),
      downtime_cost_eur_h: T('Downtime cost ×0.5…×2', 'Вартість простою ×0,5…×2', 'Stillstandskosten ×0,5…×2', 'Stilstandskosten ×0,5…×2', 'Coût d’arrêt ×0,5…×2', 'Coste de parada ×0,5…×2', 'Koszt przestoju ×0,5…×2'),
      mttr_h: T('Outage after failure ×0.5…×2', 'Простій після відмови ×0,5…×2', 'Ausfalldauer ×0,5…×2', 'Uitval na storing ×0,5…×2', 'Arrêt après panne ×0,5…×2', 'Parada tras fallo ×0,5…×2', 'Przestój po uszkodzeniu ×0,5…×2'),
      response_days: T('Response time ×2…×0.5', 'Час реагування ×2…×0,5', 'Reaktionszeit ×2…×0,5', 'Reactietijd ×2…×0,5', 'Délai d’intervention ×2…×0,5', 'Tiempo de respuesta ×2…×0,5', 'Czas reakcji ×2…×0,5')
    };
    var base = last.tornado.base;
    bars.forEach(function (b, i) {
      var y = splitY + i * rowH + rowH / 2;
      txt(ctx, short(L(PN[b.param] || T(b.param, b.param, b.param, b.param, b.param, b.param, b.param)), maxC), labW - 6, y + 4, 'right', k.muted);
      var bh = Math.max(6, rowH - 8);
      ctx.fillStyle = DiagramUI.series(3); ctx.globalAlpha = 0.85;
      ctx.fillRect(Math.min(X(base), X(b.net_low)), y - bh / 2, Math.abs(X(b.net_low) - X(base)), bh);
      ctx.fillStyle = DiagramUI.series(2);
      ctx.fillRect(Math.min(X(base), X(b.net_high)), y - bh / 2, Math.abs(X(b.net_high) - X(base)), bh);
      ctx.globalAlpha = 1;
    });
    ctx.strokeStyle = k.ink; ctx.setLineDash([2, 2]);
    ctx.beginPath(); ctx.moveTo(X(base), splitY); ctx.lineTo(X(base), splitY + nBot * rowH); ctx.stroke(); ctx.setLineDash([]);
    /* axis */
    ctx.fillStyle = k.muted;
    DiagramUI.ticks(mn, mx, w - labW - padR, size.density).forEach(function (v) {
      var x = X(v); if (x < labW + 24 || x > w - padR - 14) return;
      txt(ctx, F(v, 0), x, h - 6, 'center', k.muted);
    });
    txt(ctx, 'EUR/a', labW - 6, h - 6, 'right', k.muted);
  }

  function renderBE(size, st) {
    var ctx = st.canvas(), w = size.w, h = size.h, k = tokens();
    wireA11y(st, 2, a11yBE);
    var coarse = size.density === 'coarse';
    ctx.clearRect(0, 0, w, h);
    if (!last) return;
    ctx.font = '400 12px ' + k.font;
    var c = last.curve, padL = coarse ? 46 : 64, padR = 14, padT = 12, padB = 34;
    var mn = 0, mx = 0;
    c.forEach(function (p) { mn = Math.min(mn, p.lo, p.mid, p.hi); mx = Math.max(mx, p.lo, p.mid, p.hi); });
    if (mx - mn < 1) { mx += 1; mn -= 1; }
    var X = function (d) { return padL + (w - padL - padR) * d / last.dMax; };
    var Y = function (v) { return h - padB - (h - padT - padB) * (v - mn) / (mx - mn); };
    ctx.strokeStyle = k.line;
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, h - padB); ctx.lineTo(w - padR, h - padB); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(padL, Y(0)); ctx.lineTo(w - padR, Y(0)); ctx.stroke();
    DiagramUI.ticks(mn, mx, h - padT - padB, size.density).forEach(function (v) {
      var y = Y(v); if (y < padT - 1 || y > h - padB + 1) return;
      txt(ctx, F(v, 0), padL - 6, y + 4, 'right', k.muted);
    });
    DiagramUI.ticks(0, last.dMax, w - padL - padR, size.density).forEach(function (d) {
      var x = X(d); if (x > w - padR - 18) return;
      txt(ctx, F(d, 0), x, h - padB + 16, 'center', k.muted);
    });
    txt(ctx, 'EUR/h', w - padR, h - 4, 'right', k.muted);
    var line = function (key, dash, width) {
      ctx.strokeStyle = DiagramUI.series(0); ctx.lineWidth = width; ctx.setLineDash(dash);
      ctx.beginPath(); c.forEach(function (p, i) { var x = X(p.d), y = Y(p[key]); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }); ctx.stroke();
      ctx.setLineDash([]); ctx.lineWidth = 1;
    };
    line('lo', [5, 4], 1.5); line('hi', [5, 4], 1.5); line('mid', [], 2.5);
    /* your downtime cost */
    var xd = X(Math.min(state.downtime, last.dMax));
    ctx.strokeStyle = DiagramUI.series(1); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(xd, padT); ctx.lineTo(xd, h - padB); ctx.stroke(); ctx.lineWidth = 1;
    /* break-even marker */
    var m = last.pick.mid;
    if (m.breakeven_kind === 'finite' && m.breakeven_downtime_eur_h <= last.dMax) {
      var xb = X(m.breakeven_downtime_eur_h);
      ctx.fillStyle = k.ink; ctx.beginPath(); ctx.arc(xb, Y(0), 4.5, 0, 6.2832); ctx.fill();
      txt(ctx, L(TF(T('break-even {0} EUR/h', 'беззбитковість {0} EUR/год', 'Break-even {0} EUR/h', 'break-even {0} EUR/h', 'équilibre {0} EUR/h', 'equilibrio {0} EUR/h', 'próg {0} EUR/h'), [F(m.breakeven_downtime_eur_h)])),
          Math.min(xb + 6, w - padR - 120), Y(0) - 8, 'left', k.ink);
    }
  }

  /* ======================================================= 3. the data layer */
  function installData() {
    if (!window.Diagram) return;
    Diagram.init({
      id: 'mepmonitoring',
      file: 'mepmonitoring.html',
      state: {
        serialize: function () { return state; },
        deserialize: function (o) { applyCase(o || {}); last = solve(state); if (ui) { ui.sync(); ui.run(); } }
      },
      record: function () {
        if (!last) last = solve(state);
        if (!last) return null;
        var c = last.cmp;
        return {
          inputs: JSON.parse(JSON.stringify(state)),
          outputs: {
            recommendation: c.recommendation.code, recommended_option: c.recommendation.option, fragile: !!c.recommendation.fragile,
            options: c.rows.map(function (r) {
              return { id: r.option.id, technique: r.option.technique, mode: r.option.mode, interval_days: r.interval_days,
                       recommended_interval_days: r.recommended_interval_days, readings_per_year: r.readings_per_year,
                       feasible: r.feasible, reasons: r.reasons,
                       p_detect: { lo: r.lo.p_detect, mid: r.mid.p_detect, hi: r.hi.p_detect },
                       cost_eur_y: { lo: r.lo.cost_eur_y, mid: r.mid.cost_eur_y, hi: r.hi.cost_eur_y },
                       net_eur_y: { lo: r.lo.net_eur_y, mid: r.mid.net_eur_y, hi: r.hi.net_eur_y },
                       breakeven_downtime_eur_h: r.mid.breakeven_downtime_eur_h, breakeven_kind: r.mid.breakeven_kind };
            }),
            tornado: last.tornado
          },
          units: { pf: 'd', mtbf: 'a', response_days: 'd', corrective: 'EUR', planned: 'EUR', downtime: 'EUR/h', mttr: 'h',
                   planned_dt: 'h', fa_cost: 'EUR', interval: 'd', net_eur_y: 'EUR/a', cost_eur_y: 'EUR/a', breakeven: 'EUR/h' },
          model: {
            equations: ['W = pf_fraction * PF - t_response', 'I_rec = W(PF_low) / 2',
                        'P_det = 1 - [(1-f)(1-pod)^min(k,cap) + f(1-pod)^min(k+1,cap)], k+f = W/I',
                        'net = n*lambda*P_det*c*[(C_corr - C_plan) + D*max(0, MTTR - t_plan)] - n*(N*C_read + C_fixed + FA*C_FA)',
                        'D_breakeven = (cost/(n*lambda*P_det*c) - dC)/dh'],
            ranges: ['lo = short P-F, long MTBF, high cost; hi = the opposite; one failure mode at a time; undiscounted annual values'],
            notes: ['engine MEPCM ' + CM.VERSION + ' (mep-monitoring.js)', 'preset numbers are learning assumptions',
                    'statutory inspections are retained regardless (D-MEP-5)']
          },
          warnings: c.rows.filter(function (r) { return !r.feasible; }).map(function (r) { return r.option.id + ': ' + r.reasons.join(', '); })
        };
      }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
