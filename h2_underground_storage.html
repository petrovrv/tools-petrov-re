  function degrade() {
    document.title = 'diagram-ui.js v1 is required';
    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1');
    h.textContent = 'Hydrogen Underground Storage';
    var p = document.createElement('p');
    p.textContent = 'The interactive interface could not load. The export, the calculation record '
                  + 'and the limitations are still available from the bar at the bottom of the page.';
    host.appendChild(h);
    host.appendChild(p);
    last = solve(state);
  }

  function boot() {
    if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1') buildInterface();
    else degrade();
    installData();
  }

          inject: {
            title: T('Compressor discharge as a pressure limit', 'Нагнітання компресора як обмеження тиску', 'Verdichteraustritt als Druckgrenze', 'Persdruk van de compressor als drukgrens', 'Le refoulement du compresseur comme limite de pression', 'La descarga del compresor como límite de presión', 'Tłoczenie sprężarki jako granica ciśnienia'),
            body: T(
              'The cavern can only be filled to the pressure the injection compressor delivers. With the discharge pressure p_inj at the wellhead, the static hydrogen column down to the casing shoe adds rho_bar·g·z, where rho_bar is the gas density at the mean column pressure and the mean temperature T_surf + grad_T·z/2. The effective maximum is p_max = min(f_max·p_lith, p_inj + rho_bar·g·z). Hydrogen is light: 1000 m of gas column add only about 1.4 bar at 200 bar, so a 200 bar compressor on a 1500 m cavern (rock limit 259 bar) stops at 202 bar and loses about 29 % of the working gas. Friction in the well during injection is not included. Enter 0 if the compressor is not limiting; a value received from the compressor tool goes into this field.',
              'Каверну можна заповнити лише до тиску, який дає компресор закачування. За тиску нагнітання p_inj на гирлі статичний стовп водню до башмака колони додає rho_bar·g·z, де rho_bar — густина газу за середнього тиску стовпа і середньої температури T_surf + grad_T·z/2. Ефективний максимум p_max = min(f_max·p_lith, p_inj + rho_bar·g·z). Водень легкий: 1000 м газового стовпа додають лише близько 1,4 бар при 200 бар, тож компресор на 200 бар на каверні глибиною 1500 м (межа породи 259 бар) зупиняється на 202 бар і втрачає близько 29 % робочого газу. Тертя в свердловині під час закачування не враховано. Введіть 0, якщо компресор не обмежує; значення, отримане з інструмента компресора, потрапляє в це поле.',
              'Die Kaverne lässt sich nur bis zu dem Druck füllen, den der Einpressverdichter liefert. Mit dem Austrittsdruck p_inj am Bohrlochkopf addiert die ruhende Wasserstoffsäule bis zum Rohrschuh rho_bar·g·z, wobei rho_bar die Gasdichte beim mittleren Säulendruck und der mittleren Temperatur T_surf + grad_T·z/2 ist. Der wirksame Höchstdruck ist p_max = min(f_max·p_lith, p_inj + rho_bar·g·z). Wasserstoff ist leicht: 1000 m Gassäule bringen bei 200 bar nur etwa 1,4 bar, daher endet ein 200-bar-Verdichter an einer 1500 m tiefen Kaverne (Gebirgsgrenze 259 bar) bei 202 bar und verliert etwa 29 % des Arbeitsgases. Reibung in der Bohrung beim Einpressen ist nicht berücksichtigt. Geben Sie 0 ein, wenn der Verdichter nicht begrenzt; ein vom Verdichter-Tool übernommener Wert landet in diesem Feld.',
              'De caverne kan alleen worden gevuld tot de druk die de injectiecompressor levert. Met de persdruk p_inj aan de putmond voegt de stilstaande waterstofkolom tot de casingschoen rho_bar·g·z toe, waarbij rho_bar de gasdichtheid is bij de gemiddelde kolomdruk en de gemiddelde temperatuur T_surf + grad_T·z/2. Het effectieve maximum is p_max = min(f_max·p_lith, p_inj + rho_bar·g·z). Waterstof is licht: 1000 m gaskolom voegt bij 200 bar maar ongeveer 1,4 bar toe, dus een compressor van 200 bar op een caverne van 1500 m diep (gesteentegrens 259 bar) stopt bij 202 bar en verliest ongeveer 29 % van het werkgas. Wrijving in de put tijdens injectie is niet meegenomen. Vul 0 in als de compressor niet beperkt; een waarde uit de compressortool komt in dit veld terecht.',
              'La cavité ne peut être remplie qu\'à la pression que fournit le compresseur d\'injection. Avec la pression de refoulement p_inj en tête de puits, la colonne statique d\'hydrogène jusqu\'au sabot ajoute rho_bar·g·z, où rho_bar est la masse volumique du gaz à la pression moyenne de la colonne et à la température moyenne T_surf + grad_T·z/2. Le maximum effectif est p_max = min(f_max·p_lith, p_inj + rho_bar·g·z). L\'hydrogène est léger : 1000 m de colonne de gaz n\'ajoutent qu\'environ 1,4 bar à 200 bar, donc un compresseur de 200 bar sur une cavité à 1500 m (limite de la roche 259 bar) s\'arrête à 202 bar et perd environ 29 % du gaz utile. Le frottement dans le puits pendant l\'injection n\'est pas pris en compte. Saisissez 0 si le compresseur ne limite pas ; une valeur reçue de l\'outil compresseur arrive dans ce champ.',
              'La caverna solo puede llenarse hasta la presión que entrega el compresor de inyección. Con la presión de descarga p_inj en cabeza de pozo, la columna estática de hidrógeno hasta la zapata añade rho_bar·g·z, donde rho_bar es la densidad del gas a la presión media de la columna y la temperatura media T_surf + grad_T·z/2. El máximo efectivo es p_max = min(f_max·p_lith, p_inj + rho_bar·g·z). El hidrógeno es ligero: 1000 m de columna de gas añaden solo unos 1,4 bar a 200 bar, así que un compresor de 200 bar en una caverna a 1500 m (límite de la roca 259 bar) se queda en 202 bar y pierde cerca del 29 % del gas útil. No se incluye la fricción en el pozo durante la inyección. Introduzca 0 si el compresor no limita; un valor recibido de la herramienta del compresor entra en este campo.',
              'Kawernę można napełnić tylko do ciśnienia, jakie daje sprężarka zatłaczająca. Przy ciśnieniu tłoczenia p_inj na głowicy statyczny słup wodoru do buta kolumny dodaje rho_bar·g·z, gdzie rho_bar to gęstość gazu przy średnim ciśnieniu słupa i średniej temperaturze T_surf + grad_T·z/2. Efektywne maksimum to p_max = min(f_max·p_lith, p_inj + rho_bar·g·z). Wodór jest lekki: 1000 m słupa gazu dodaje przy 200 bar tylko ok. 1,4 bar, więc sprężarka 200 bar na kawernie na głębokości 1500 m (granica górotworu 259 bar) kończy na 202 bar i traci ok. 29 % gazu roboczego. Tarcie w odwiercie podczas zatłaczania nie jest uwzględnione. Wpisz 0, jeśli sprężarka nie ogranicza; wartość otrzymana z narzędzia sprężarki trafia do tego pola.'
            )

    function setEx(t, id) {
      var s = t || state, e = engine(), i, k, p = null;
      if (e && e.presets) for (i = 0; i < e.presets.length; i++) if (e.presets[i].id === id) p = e.presets[i].values;
      if (!p) return;
      for (k in p) if (Object.prototype.hasOwnProperty.call(p, k)) s[k] = p[k];
      s.level = 'simple';
    }

    function densityCurve(T, pTop) {
      var key = T + '|' + pTop, C = (window.OGH || {}).core, pts = [], i, p, n = 40;
      if (CURVE.key === key) return CURVE.pts;
      if (!C || !C.eos) return pts;
      for (i = 1; i <= n; i++) {
        p = pTop * i / n;
        try { pts.push({ p: p, rho: C.eos.tp({ h2: 1 }, T, p).rho }); } catch (err) { /* outside EOS range: skip point */ }
      }
      CURVE.key = key; CURVE.pts = pts;
      return pts;
    }

        return TL(TF(T('Density $1 kg/m³ at maximum pressure versus $2 kg/m³ for an ideal gas; working gas $3 t.', 'Густина $1 кг/м³ за максимального тиску проти $2 кг/м³ для ідеального газу; робочий газ $3 т.', 'Dichte $1 kg/m³ bei Höchstdruck gegenüber $2 kg/m³ als ideales Gas; Arbeitsgas $3 t.', 'Dichtheid $1 kg/m³ bij maximale druk tegenover $2 kg/m³ voor een ideaal gas; werkgas $3 t.', 'Masse volumique $1 kg/m³ à la pression maximale contre $2 kg/m³ pour un gaz parfait ; gaz utile $3 t.', 'Densidad $1 kg/m³ a la presión máxima frente a $2 kg/m³ para un gas ideal; gas útil $3 t.', 'Gęstość $1 kg/m³ przy ciśnieniu maksymalnym wobec $2 kg/m³ dla gazu doskonałego; gaz roboczy $3 t.'), [DiagramUI.fmt(last.rho_max, { precision: 1 }), DiagramUI.fmt(last.rho_ig_max, { precision: 1 }), DiagramUI.fmt(last.m_wg_t, { precision: 0 })]));
      },
      render: function (size, st) {
        var ctx = st.canvas(), w = size.w, h = size.h, coarse = size.density === 'coarse';
        var cs = getComputedStyle(document.documentElement);
        var muted = cs.getPropertyValue('--muted').trim() || '#888', line = cs.getPropertyValue('--line').trim() || '#ccc', font = cs.getPropertyValue('--font').trim() || 'sans-serif';
        ctx.clearRect(0, 0, w, h);
        if (!last || !last.ok) return;
        var pTop = Math.min(last.p_max * 1.15, 1e8), pts = densityCurve(last.T, pTop), k;
        if (pts.length < 2) return;
        var Mh = 2.01588e-3, R = 8.314462618, x1 = pTop / 1e5, y1 = pTop * Mh / (R * last.T) * 1.05;
        var L = coarse ? 44 : 54, RR = 14, TOP = 12, B = coarse ? 36 : 44, pw = w - L - RR, ph = h - TOP - B;
        if (pw <= 10 || ph <= 10) return;
        function X(v) { return L + v / x1 * pw; }
        function Y(v) { return TOP + ph - v / y1 * ph; }
        var xa = X(last.p_min / 1e5), xb = X(last.p_max / 1e5);
        ctx.fillStyle = DiagramUI.series(0); ctx.globalAlpha = 0.10; ctx.fillRect(xa, TOP, xb - xa, ph); ctx.globalAlpha = 1;
        ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.beginPath();
        ctx.moveTo(L, TOP); ctx.lineTo(L, TOP + ph); ctx.lineTo(L + pw, TOP + ph); ctx.stroke();
        ctx.fillStyle = muted; ctx.font = (coarse ? 10 : 11) + 'px ' + font;
        var xt = DiagramUI.ticks(0, x1, pw, size.density), yt = DiagramUI.ticks(0, y1, ph, size.density);
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        for (k = 0; k < xt.length; k++) { if (xt[k] < 0 || xt[k] > x1) continue; var px = X(xt[k]);
          ctx.beginPath(); ctx.moveTo(px, TOP + ph); ctx.lineTo(px, TOP + ph + 4); ctx.stroke();
          ctx.fillText(DiagramUI.fmt(xt[k], { precision: 0 }), px, TOP + ph + 6); }
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        for (k = 0; k < yt.length; k++) { if (yt[k] < 0 || yt[k] > y1) continue; var py = Y(yt[k]);
          ctx.beginPath(); ctx.moveTo(L - 4, py); ctx.lineTo(L, py); ctx.stroke();
          ctx.fillText(DiagramUI.fmt(yt[k], { precision: 0 }), L - 6, py); }
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText('p, bar', L + pw / 2, h - 2);
        ctx.save(); ctx.translate(12, TOP + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textBaseline = 'middle'; ctx.fillText('ρ, kg/m³', 0, 0); ctx.restore();
        ctx.save(); ctx.beginPath(); ctx.rect(L, TOP, pw, ph); ctx.clip();
        ctx.strokeStyle = DiagramUI.series(1); ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]); ctx.beginPath();
        ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(x1), Y(pTop * Mh / (R * last.T))); ctx.stroke(); ctx.setLineDash([]);
        ctx.strokeStyle = DiagramUI.series(0); ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(X(0), Y(0));
        for (k = 0; k < pts.length; k++) ctx.lineTo(X(pts[k].p / 1e5), Y(pts[k].rho));
        ctx.stroke();
        ctx.fillStyle = DiagramUI.series(0);
        ctx.beginPath(); ctx.arc(xb, Y(last.rho_max), coarse ? 3 : 3.5, 0, 2 * Math.PI); ctx.fill();
        ctx.beginPath(); ctx.arc(xa, Y(last.rho_min), coarse ? 3 : 3.5, 0, 2 * Math.PI); ctx.fill();
        ctx.restore();
        ctx.fillStyle = muted; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText('p_min → p_max: ' + TL(TF(T('$1 kg/m³ working gas', '$1 кг/м³ робочого газу', '$1 kg/m³ Arbeitsgas', '$1 kg/m³ werkgas', '$1 kg/m³ de gaz utile', '$1 kg/m³ de gas útil', '$1 kg/m³ gazu roboczego'), [DiagramUI.fmt((last.rho_max - last.rho_min), { precision: 2 })])), L + 8, TOP + 4);
      }
    });
    adoptStage(ui);

    ui.ready();
    window['__h2_underground_storage'] = { ui: ui, state: state, solve: solve, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function isPosNum(v) {
    return typeof v === 'number' && isFinite(v) && v > 0;
  }

  function buildRecord() {
    if (!last) return null;
    var inKeys = ['level', 'V', 'z', 'rho_rock', 'f_max', 'f_min', 'T_surf', 'grad_T', 'dp_day', 'n_cyc', 'p_inj'],
        outKeys = ['p_lith', 'p_max', 'p_max_lith', 'p_shoe_inj', 'limited', 'wg_loss', 'm_wg_lith_t', 'p_min', 'T', 'rho_max', 'rho_min', 'Z_max', 'Z_min', 'm_wg_t', 'm_cush_t', 'm_tot_t', 'cushion_ratio', 'E_wg_GWh', 'ideal_err',
                   'mdot_max_t_d', 'days_empty', 'cyc_max', 'thr_t_y', 'thr_GWh_y', 'basis', 'verdict'],
        inputs = {}, outputs = {}, units = {}, warnings = [], i, k;
    var UNIT = {
      level: '-', V: 'm3', z: 'm', rho_rock: 'kg/m3', f_max: '-', f_min: '-', T_surf: 'K', grad_T: 'K/m', dp_day: 'Pa/d', n_cyc: '1/y', p_inj: 'Pa', p_max_lith: 'Pa', p_shoe_inj: 'Pa', limited: '-', wg_loss: '-', m_wg_lith_t: 't',
      p_lith: 'Pa', p_max: 'Pa', p_min: 'Pa', T: 'K', rho_max: 'kg/m3', rho_min: 'kg/m3', Z_max: '-', Z_min: '-', m_wg_t: 't', m_cush_t: 't', m_tot_t: 't',
      cushion_ratio: '-', E_wg_GWh: 'GWh (LHV)', ideal_err: '-', mdot_max_t_d: 't/d', days_empty: 'd', cyc_max: '1/y', thr_t_y: 't/y', thr_GWh_y: 'GWh/y (LHV)', basis: '-', verdict: '-'
    };
    for (i = 0; i < inKeys.length; i++) { k = inKeys[i]; inputs[k] = state[k]; units[k] = UNIT[k]; }
    if (last.ok) {
      for (i = 0; i < outKeys.length; i++) { k = outKeys[i]; outputs[k] = last[k]; units[k] = UNIT[k]; }
      warnings = (last.warnings || []).slice();
    } else {
      warnings = [last.error];
    }
    return {
      inputs: inputs, outputs: outputs, units: units,
      model: {
        equations: [
          'p_lith = rho_rock g z; p_max = f_max p_lith; p_min = f_min p_lith (Caglayan et al. 2020)',
          'p_shoe = p_inj + rho_bar g z (rho_bar at mean column pressure and T_surf + grad_T z/2); p_max = min(f_max p_lith, p_shoe) if p_inj > 0',
          'T = T_surf + grad_T z; rho(T, p) from Leachman et al. (2009) normal-hydrogen EOS',
          'm_working = V (rho(p_max) - rho(p_min)); m_cushion = V rho(p_min); E = m_working 119.96 MJ/kg (LHV)',
          'withdrawal per day = V (rho(p_mid + dp/2) - rho(p_mid - dp/2)); cycles_max = 365/(2 days_to_empty)'
        ],
        ranges: ['z 200-3000 m', 'p <= 100 MPa', 'pure normal hydrogen, isothermal'],
        notes: ['Thermodynamic temperature swing during fast cycling ignored', 'Cavern convergence (creep) and brine sump volume not modelled', 'Geometric volume equals gas volume']
      },
      warnings: warnings
    };
  }

  function hoRow(o) { var r = {}, k; for (k in o) if (typeof o[k][0] === 'number' && isFinite(o[k][0])) r[k] = { value: o[k][0], unit: o[k][1] }; return r; }

  var HANDOFF = {
    provides: ['p', 'T'],
    accepts: ['p'],
    build: function () {
      if (!last || !last.ok) return null;
      return {
        quantities: { p: { value: last.p_min, unit: 'Pa' }, T: { value: last.T, unit: 'K' } },
        sets: { storage: [hoRow({ p_max: [last.p_max, 'Pa'], p_min: [last.p_min, 'Pa'], T: [last.T, 'K'] })], composition: [hoRow({ h2: [1, '-'] })] }
      };
    },
    /* R2 D-r2-1: received p = compressor discharge = max. injection pressure at the wellhead; T is not applied (rock sets the gas temperature) */
    apply: function (payload) {
      var q = (payload && payload.quantities) || {}, v, acc = [];
      v = q.p && typeof q.p === 'object' ? +q.p.value : +q.p;
      if (q.p != null && isFinite(v) && v > 0) { state.p_inj = v; acc.push(TL(T('p → max. injection pressure', 'p → макс. тиск закачування', 'p → max. Einpressdruck', 'p → max. injectiedruk', 'p → pression d\'injection max.', 'p → presión máx. de inyección', 'p → maks. ciśnienie zatłaczania'))); }
      last = solve(state); if (ui) { ui.sync(); ui.run(); }
      return { accepted: acc, ignored: Object.keys(q).filter(function (k) { return k !== 'p'; }) };
    }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'h2_underground_storage',
        file: 'h2_underground_storage.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
