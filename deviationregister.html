 "summary": {
  "en": "Keeps technical queries, deviations and concessions against the requirement each one touches, checks them against an authority matrix, and reports open counts, ageing and response times.",
  "uk": "Веде технічні запити, відхилення та поступки щодо вимоги, якої кожен стосується, перевіряє їх за матрицею повноважень і подає кількість відкритих, старіння та час відповіді.",
  "de": "Führt technische Rückfragen, Abweichungen und Sonderfreigaben gegen die jeweils berührte Anforderung, prüft sie gegen eine Befugnismatrix und meldet offene Zahlen, Alterung und Antwortzeiten.",
  "nl": "Houdt technische vragen, afwijkingen en concessies bij tegen de eis die elk raakt, toetst ze aan een bevoegdheidsmatrix en rapporteert open aantallen, veroudering en antwoordtijden.",
  "fr": "Tient questions techniques, dérogations préalables et dérogations d’acceptation face à l’exigence touchée, les confronte à une matrice d’autorité et rapporte ouverts, ancienneté et délais de réponse.",
  "es": "Lleva consultas técnicas, desviaciones y concesiones frente al requisito que cada una toca, las contrasta con una matriz de autoridad e informa de abiertos, antigüedad y tiempos de respuesta.",
  "pl": "Prowadzi zapytania techniczne, odstępstwa i zezwolenia wobec wymagania, którego każde dotyczy, sprawdza je względem macierzy uprawnień i podaje liczby otwartych, starzenie oraz czasy odpowiedzi."
 },
 "description": {
  "en": "A register of three kinds of supplier exchange on one procurement package: a technical query, which asks about a requirement and changes nothing by itself; a deviation permit, which is permission to depart from the specified requirements before realisation (ISO 9000:2015 3.12.6); and a concession, which is permission to use or release a product that already does not conform (ISO 9000:2015 3.12.5, ISO 9001:2015 8.7.1 d). Each item runs raised, responded, dispositioned, closed. The user defines who may disposition what, by requirement class, in an authority matrix; 34 rules check the register against that matrix, against the requirements, vendor documents and bid evaluations of the project package, and against calendar-day ageing. Figures reported: open items by kind and age bucket, mean and maximum response and disposition times, decisions by token, and deviations accepted during bid evaluation that the register does not carry.",
  "uk": "Реєстр трьох видів обміну з постачальником на одному закупівельному пакеті: технічний запит, який питає про вимогу й сам нічого не змінює; дозвіл на відхилення — дозвіл відступити від установлених вимог до реалізації (ISO 9000:2015 3.12.6); поступка — дозвіл використати чи випустити продукцію, що вже не відповідає (ISO 9000:2015 3.12.5, ISO 9001:2015 8.7.1 d). Кожна позиція проходить: порушено, відповідь, рішення, закрито. Користувач задає, хто й що може вирішувати, за класом вимоги, у матриці повноважень; 34 правила перевіряють реєстр за цією матрицею, за вимогами, документами постачальника та оцінками пропозицій проєктного пакета й за календарним старінням. Подані цифри: відкриті позиції за видом і віковим кошиком, середній і максимальний час відповіді та рішення, рішення за токенами, а також прийняті на торгах відхилення, яких реєстр не містить.",
  "de": "Ein Register dreier Arten des Lieferantenaustauschs zu einem Beschaffungspaket: die technische Rückfrage, die nach einer Anforderung fragt und für sich nichts ändert; die Abweicherlaubnis, also die Erlaubnis, vor der Realisierung von den festgelegten Anforderungen abzuweichen (ISO 9000:2015 3.12.6); und die Sonderfreigabe, die Erlaubnis, ein bereits nicht konformes Produkt zu verwenden oder freizugeben (ISO 9000:2015 3.12.5, ISO 9001:2015 8.7.1 d). Jede Position durchläuft eingereicht, beantwortet, entschieden, geschlossen. Wer was entscheiden darf, legt der Benutzer je Anforderungsklasse in einer Befugnismatrix fest; 34 Regeln prüfen das Register gegen diese Matrix, gegen Anforderungen, Lieferantendokumente und Angebotsbewertungen des Projektpakets sowie gegen die Alterung in Kalendertagen. Gemeldete Zahlen: offene Positionen nach Art und Altersklasse, mittlere und maximale Antwort- und Entscheidungszeiten, Entscheidungen je Token und in der Angebotsbewertung angenommene Abweichungen, die das Register nicht führt.",
  "nl": "Een register van drie soorten leveranciersuitwisseling op één inkooppakket: de technische vraag, die naar een eis vraagt en op zichzelf niets verandert; de afwijkingsvergunning, de toestemming om vóór de realisatie van de gespecificeerde eisen af te wijken (ISO 9000:2015 3.12.6); en de concessie, de toestemming om een reeds niet-conform product te gebruiken of vrij te geven (ISO 9000:2015 3.12.5, ISO 9001:2015 8.7.1 d). Elk item doorloopt ingediend, beantwoord, beslist, gesloten. Wie wat mag beslissen legt de gebruiker per eisklasse vast in een bevoegdheidsmatrix; 34 regels toetsen het register aan die matrix, aan de eisen, leveranciersdocumenten en offertebeoordelingen van het projectpakket, en aan veroudering in kalenderdagen. Gerapporteerde cijfers: open items naar soort en ouderdomsklasse, gemiddelde en maximale antwoord- en beslistijden, beslissingen per token, en in de offertebeoordeling aanvaarde afwijkingen die het register niet draagt.",
  "fr": "Un registre de trois types d’échange fournisseur sur un lot d’achat : la question technique, qui interroge une exigence et ne change rien par elle-même ; la dérogation préalable, autorisation de s’écarter des exigences spécifiées avant réalisation (ISO 9000:2015 3.12.6) ; et la dérogation d’acceptation, autorisation d’utiliser ou de libérer un produit déjà non conforme (ISO 9000:2015 3.12.5, ISO 9001:2015 8.7.1 d). Chaque élément suit ouvert, répondu, statué, clos. L’utilisateur définit qui peut statuer sur quoi, par classe d’exigence, dans une matrice d’autorité ; 34 règles confrontent le registre à cette matrice, aux exigences, documents fournisseur et évaluations d’offres du dossier de projet, et à l’ancienneté en jours calendaires. Chiffres rapportés : éléments ouverts par type et tranche d’ancienneté, délais moyens et maximaux de réponse et de décision, décisions par jeton, et dérogations acceptées en évaluation d’offres que le registre ne porte pas.",
  "es": "Un registro de tres tipos de intercambio con el proveedor en un paquete de compra: la consulta técnica, que pregunta por un requisito y por sí sola no cambia nada; el permiso de desviación, autorización para apartarse de los requisitos especificados antes de la realización (ISO 9000:2015 3.12.6); y la concesión, autorización para utilizar o liberar un producto que ya no es conforme (ISO 9000:2015 3.12.5, ISO 9001:2015 8.7.1 d). Cada elemento recorre planteado, respondido, resuelto, cerrado. El usuario define quién puede resolver qué, por clase de requisito, en una matriz de autoridad; 34 reglas contrastan el registro con esa matriz, con los requisitos, documentos del proveedor y evaluaciones de ofertas del paquete de proyecto, y con la antigüedad en días naturales. Cifras informadas: elementos abiertos por tipo y tramo de antigüedad, tiempos medios y máximos de respuesta y resolución, decisiones por token, y desviaciones aceptadas en la evaluación de ofertas que el registro no lleva.",
  "pl": "Rejestr trzech rodzajów wymiany z dostawcą w jednym pakiecie zakupowym: zapytanie techniczne, które pyta o wymaganie i samo w sobie niczego nie zmienia; zezwolenie na odstępstwo, czyli zgoda na odejście od wyspecyfikowanych wymagań przed realizacją (ISO 9000:2015 3.12.6); oraz zezwolenie na odstępstwo po wytworzeniu, czyli zgoda na użycie lub zwolnienie wyrobu już niezgodnego (ISO 9000:2015 3.12.5, ISO 9001:2015 8.7.1 d). Każda pozycja przechodzi: zgłoszone, odpowiedziano, rozstrzygnięte, zamknięte. Użytkownik określa w macierzy uprawnień, kto i co może rozstrzygać, według klasy wymagania; 34 reguły sprawdzają rejestr względem tej macierzy, względem wymagań, dokumentów dostawcy i ocen ofert z pakietu projektowego oraz względem starzenia liczonego w dniach kalendarzowych. Podawane liczby: otwarte pozycje według rodzaju i przedziału wieku, średnie i maksymalne czasy odpowiedzi oraz rozstrzygnięcia, rozstrzygnięcia według tokenów, a także odstępstwa przyjęte w ocenie ofert, których rejestr nie zawiera."
 },

 "limitations": {
  "en": "Rule-based register check. It does not judge whether a deviation or concession is technically acceptable; that decision stays with the people named in the authority matrix, and it cannot tell whether the matrix itself matches the contract, the quality plan or the applicable regulation. Ages and response times are whole calendar days between ISO dates: no working-day calendar, no holidays, no time zones, no clock times. A design review reference and a change reference are free text; the tool checks that one is present where required and does not open the referenced record. Requirement classes come from the requirements register plus the safety and regulatory tags entered here; a requirement carrying neither is treated as unclassified. Bid-evaluation reconciliation relies on the field names of the bid evaluation register; an evaluation written with other names reconciles nothing and says so. Standards cited: ISO 9000:2015 terms and ISO 9001:2015 8.3.6 and 8.7. Thresholds, severities and the reconciliation logic are the author's method. Contract, purchase order and quality plan remain authoritative.",
  "uk": "Перевірка реєстру за правилами. Інструмент не оцінює, чи прийнятні відхилення або поступка технічно; це рішення лишається за людьми, названими в матриці повноважень, і він не може сказати, чи відповідає сама матриця договору, плану якості або чинним нормам. Вік і час відповіді — це цілі календарні дні між датами ISO: без робочого календаря, свят, часових поясів і годинника. Посилання на розгляд проєкту й посилання на зміну — вільний текст; інструмент перевіряє лише його наявність там, де вона потрібна, і не відкриває сам запис. Класи вимог беруться з реєстру вимог та з міток «безпека» і «нормативна», внесених тут; вимога без жодної з них вважається некласифікованою. Звірка з оцінкою пропозицій спирається на назви полів реєстру оцінок; оцінка з іншими назвами не звіряється, і про це сказано. Наведені стандарти: терміни ISO 9000:2015 та ISO 9001:2015 8.3.6 і 8.7. Пороги, рівні суттєвості та логіка звірки — метод автора. Договір, замовлення на купівлю та план якості лишаються визначальними.",
  "de": "Regelbasierte Registerprüfung. Ob eine Abweichung oder Sonderfreigabe technisch annehmbar ist, beurteilt das Werkzeug nicht; diese Entscheidung bleibt bei den in der Befugnismatrix genannten Personen, und es kann nicht sagen, ob die Matrix selbst zum Vertrag, zum Qualitätsplan oder zur geltenden Regelung passt. Alter und Antwortzeiten sind ganze Kalendertage zwischen ISO-Daten: kein Arbeitstagskalender, keine Feiertage, keine Zeitzonen, keine Uhrzeiten. Ein Verweis auf die Designprüfung und ein Änderungsverweis sind freier Text; geprüft wird nur, dass einer vorhanden ist, wo er verlangt wird, nicht der Datensatz dahinter. Anforderungsklassen kommen aus dem Anforderungsregister sowie aus den hier gesetzten Marken Sicherheit und regulatorisch; eine Anforderung ohne beide gilt als nicht klassifiziert. Der Abgleich mit der Angebotsbewertung stützt sich auf deren Feldnamen; eine mit anderen Namen geschriebene Bewertung gleicht nichts ab und sagt das. Zitierte Normen: Begriffe der ISO 9000:2015 sowie ISO 9001:2015 8.3.6 und 8.7. Schwellen, Schweregrade und die Abgleichlogik sind die Methode des Autors. Vertrag, Bestellung und Qualitätsplan bleiben maßgeblich.",
  "nl": "Regelgebaseerde registercontrole. Of een afwijking of concessie technisch aanvaardbaar is beoordeelt de tool niet; die beslissing blijft bij de mensen die de bevoegdheidsmatrix noemt, en de tool kan niet zeggen of de matrix zelf bij het contract, het kwaliteitsplan of de geldende regelgeving past. Ouderdom en antwoordtijden zijn hele kalenderdagen tussen ISO-data: geen werkdagenkalender, geen feestdagen, geen tijdzones, geen kloktijden. Een verwijzing naar een ontwerpbeoordeling en een wijzigingsreferentie zijn vrije tekst; gecontroleerd wordt alleen dat er één staat waar dat vereist is, niet het onderliggende record. Eisklassen komen uit het eisenregister plus de hier ingevoerde tags veiligheid en wettelijk; een eis zonder beide geldt als niet geclassificeerd. Afstemming met de offertebeoordeling steunt op de veldnamen van dat register; een beoordeling met andere namen stemt niets af en meldt dat. Aangehaalde normen: termen uit ISO 9000:2015 en ISO 9001:2015 8.3.6 en 8.7. Drempels, ernstniveaus en de afstemmingslogica zijn de methode van de auteur. Contract, inkooporder en kwaliteitsplan blijven bepalend.",
  "fr": "Contrôle de registre fondé sur des règles. L’outil ne juge pas si une dérogation ou une concession est techniquement acceptable ; cette décision reste aux personnes nommées dans la matrice d’autorité, et il ne peut dire si la matrice elle-même correspond au contrat, au plan qualité ou à la réglementation applicable. Ancienneté et délais de réponse sont des jours calendaires entiers entre dates ISO : pas de calendrier ouvré, pas de jours fériés, pas de fuseaux, pas d’heures. Une référence de revue de conception et une référence de modification sont du texte libre ; l’outil vérifie qu’une référence est présente là où elle est exigée, sans ouvrir l’enregistrement visé. Les classes d’exigence proviennent du registre des exigences et des étiquettes sécurité et réglementaire saisies ici ; une exigence n’en portant aucune est traitée comme non classée. Le rapprochement avec l’évaluation d’offres repose sur les noms de champs de ce registre ; une évaluation écrite avec d’autres noms ne rapproche rien et le dit. Normes citées : termes de l’ISO 9000:2015 et ISO 9001:2015 8.3.6 et 8.7. Seuils, gravités et logique de rapprochement relèvent de la méthode de l’auteur. Le contrat, la commande et le plan qualité restent la référence.",
  "es": "Comprobación de registro basada en reglas. La herramienta no juzga si una desviación o concesión es técnicamente aceptable; esa decisión queda en manos de las personas nombradas en la matriz de autoridad, y no puede decir si la matriz encaja con el contrato, el plan de calidad o la reglamentación aplicable. Las antigüedades y los tiempos de respuesta son días naturales enteros entre fechas ISO: sin calendario laboral, sin festivos, sin husos horarios, sin horas. Una referencia de revisión de diseño y una referencia de cambio son texto libre; se comprueba que haya una donde se exige, no el registro al que apunta. Las clases de requisito proceden del registro de requisitos y de las etiquetas seguridad y reglamentaria introducidas aquí; un requisito sin ninguna se trata como no clasificado. La conciliación con la evaluación de ofertas se apoya en los nombres de campo de ese registro; una evaluación escrita con otros nombres no concilia nada y lo indica. Normas citadas: términos de ISO 9000:2015 e ISO 9001:2015 8.3.6 y 8.7. Umbrales, severidades y lógica de conciliación son método del autor. El contrato, el pedido y el plan de calidad siguen siendo determinantes.",
  "pl": "Kontrola rejestru oparta na regułach. Narzędzie nie ocenia, czy odstępstwo lub zezwolenie jest technicznie dopuszczalne; ta decyzja pozostaje przy osobach wskazanych w macierzy uprawnień, i nie potrafi ono stwierdzić, czy sama macierz odpowiada umowie, planowi jakości lub obowiązującym przepisom. Wiek i czasy odpowiedzi to pełne dni kalendarzowe między datami ISO: bez kalendarza dni roboczych, świąt, stref czasowych i godzin. Odniesienie do przeglądu projektu i odniesienie do zmiany to tekst dowolny; sprawdzana jest tylko ich obecność tam, gdzie są wymagane, a nie wskazywany zapis. Klasy wymagań pochodzą z rejestru wymagań oraz ze znaczników bezpieczeństwo i regulacyjne wprowadzonych tutaj; wymaganie bez żadnego z nich uznaje się za niesklasyfikowane. Uzgodnienie z oceną ofert opiera się na nazwach pól tego rejestru; ocena zapisana innymi nazwami nie uzgadnia niczego i mówi o tym. Przywołane normy: terminy ISO 9000:2015 oraz ISO 9001:2015 8.3.6 i 8.7. Progi, poziomy istotności i logika uzgodnienia to metoda autora. Umowa, zamówienie i plan jakości pozostają rozstrzygające."
 },

 "validation": {
  "basis": {
   "en": "Graded against an independently authored corpus: 108 cases and 764 checks, written by another agent from the public specification and the cited clauses without access to this code, all pass. The rule engine carries 34 rule identifiers, each with a basis: ISO 9000:2015 3.12.5, 3.12.6, 3.6.4, 3.6.9 and 3.1.5, ISO 9001:2015 8.3.6, 8.7.1 d) and 8.7.2 c), d), the project package contract, or the author's own method. Every threshold, severity and the reconciliation logic are the author's method; a clause named in a basis supports the obligation the rule checks, never the threshold. Five presets carry the verdict, hit set and figures stated in the public specification. The harness is the author's own and the reference is not; no independent validation is claimed.",
   "uk": "Перевірено за незалежно складеним набором сценаріїв: 108 випадків і 764 перевірки, написані іншим агентом за публічною специфікацією та наведеними пунктами стандартів без доступу до цього коду, проходять усі. Рушій правил містить 34 ідентифікатори правил, кожен із підставою: ISO 9000:2015 3.12.5, 3.12.6, 3.6.4, 3.6.9 і 3.1.5, ISO 9001:2015 8.3.6, 8.7.1 d) і 8.7.2 c), d), контракт проєктного пакета або власний метод автора. Усі пороги, рівні суттєвості та логіка звірки — метод автора; названий у підставі пункт підтримує обов’язок, який перевіряє правило, а не поріг. П’ять пресетів дають висновок, набір зауважень і цифри, зазначені в публічній специфікації. Випробувальний стенд авторський, еталон — ні; незалежної валідації не заявлено.",
   "de": "Gegen ein unabhängig verfasstes Fallkorpus geprüft: 108 Fälle und 764 Prüfungen, von einem anderen Agenten aus der öffentlichen Spezifikation und den genannten Klauseln ohne Zugriff auf diesen Code geschrieben, bestehen sämtlich. Die Regel-Engine führt 34 Regelkennungen, jede mit Grundlage: ISO 9000:2015 3.12.5, 3.12.6, 3.6.4, 3.6.9 und 3.1.5, ISO 9001:2015 8.3.6, 8.7.1 d) und 8.7.2 c), d), der Projektpaket-Vertrag oder die eigene Methode des Autors. Alle Schwellen, Schweregrade und die Abgleichlogik sind die Methode des Autors; eine in der Grundlage genannte Klausel stützt die geprüfte Pflicht, nie den Schwellenwert. Fünf Voreinstellungen liefern den Befund, die Trefferliste und die Zahlen der öffentlichen Spezifikation. Der Prüfstand ist der des Autors, die Referenz nicht; eine unabhängige Validierung wird nicht behauptet.",
   "nl": "Getoetst aan een onafhankelijk geschreven casuscorpus: 108 gevallen en 764 controles, door een andere agent opgesteld uit de openbare specificatie en de genoemde clausules zonder toegang tot deze code, slagen alle. De regelengine draagt 34 regel-identificaties, elk met een basis: ISO 9000:2015 3.12.5, 3.12.6, 3.6.4, 3.6.9 en 3.1.5, ISO 9001:2015 8.3.6, 8.7.1 d) en 8.7.2 c), d), het contract van het projectpakket, of de eigen methode van de auteur. Alle drempels, ernstniveaus en de afstemmingslogica zijn de methode van de auteur; een in de basis genoemde clausule ondersteunt de getoetste verplichting, nooit de drempel. Vijf voorinstellingen leveren het oordeel, de bevindingenset en de cijfers uit de openbare specificatie. De testbank is die van de auteur en de referentie niet; er wordt geen onafhankelijke validatie geclaimd.",
   "fr": "Évalué sur un corpus de cas rédigé indépendamment : 108 cas et 764 vérifications, écrits par un autre agent à partir de la spécification publique et des clauses citées sans accès à ce code, passent tous. Le moteur de règles porte 34 identifiants de règle, chacun avec sa base : ISO 9000:2015 3.12.5, 3.12.6, 3.6.4, 3.6.9 et 3.1.5, ISO 9001:2015 8.3.6, 8.7.1 d) et 8.7.2 c), d), le contrat du dossier de projet, ou la méthode propre de l’auteur. Tous les seuils, les gravités et la logique de rapprochement relèvent de la méthode de l’auteur ; une clause nommée en base soutient l’obligation vérifiée, jamais le seuil. Cinq préréglages restituent le verdict, l’ensemble des constats et les chiffres de la spécification publique. Le banc d’essai est celui de l’auteur et la référence ne l’est pas ; aucune validation indépendante n’est revendiquée.",

rep_conclusion:{en:'Dispositions listed under blockers need the missing authority or review record before the items are relied on.',uk:'Рішення, перелічені серед блокувальних, потребують відсутнього погодження або запису розгляду, перш ніж на позиції можна спиратися.',de:'Die unter „blockierend“ aufgeführten Entscheidungen brauchen die fehlende Befugnis oder den fehlenden Prüfnachweis, bevor die Positionen verwendet werden.',nl:'De onder blokkerend genoemde beslissingen hebben de ontbrekende bevoegdheid of beoordelingsvastlegging nodig voordat op de items wordt gesteund.',fr:'Les décisions listées sous « bloquant » exigent l’autorité ou l’enregistrement de revue manquants avant que les éléments soient utilisés.',es:'Las decisiones listadas como bloqueantes necesitan la autoridad o el registro de revisión que faltan antes de apoyarse en los elementos.',pl:'Rozstrzygnięcia wymienione jako blokujące wymagają brakującego uprawnienia lub zapisu przeglądu, zanim pozycje zostaną wykorzystane.'},

m_eq1:{en:'age = as_of − raised_on, whole calendar days',uk:'вік = as_of − raised_on, цілі календарні дні',de:'Alter = as_of − raised_on, ganze Kalendertage',nl:'ouderdom = as_of − raised_on, hele kalenderdagen',fr:'ancienneté = as_of − raised_on, jours calendaires entiers',es:'antigüedad = as_of − raised_on, días naturales enteros',pl:'wiek = as_of − raised_on, pełne dni kalendarzowe'},
m_eq2:{en:'bucket k holds e(k−1) < age ≤ e(k); the first holds 0 ≤ age ≤ e(1); the last holds age > e(n)',uk:'кошик k містить e(k−1) < вік ≤ e(k); перший містить 0 ≤ вік ≤ e(1); останній — вік > e(n)',de:'Klasse k enthält e(k−1) < Alter ≤ e(k); die erste 0 ≤ Alter ≤ e(1); die letzte Alter > e(n)',nl:'klasse k bevat e(k−1) < ouderdom ≤ e(k); de eerste 0 ≤ ouderdom ≤ e(1); de laatste ouderdom > e(n)',fr:'la tranche k contient e(k−1) < ancienneté ≤ e(k) ; la première 0 ≤ ancienneté ≤ e(1) ; la dernière ancienneté > e(n)',es:'el tramo k contiene e(k−1) < antigüedad ≤ e(k); el primero 0 ≤ antigüedad ≤ e(1); el último antigüedad > e(n)',pl:'przedział k obejmuje e(k−1) < wiek ≤ e(k); pierwszy 0 ≤ wiek ≤ e(1); ostatni wiek > e(n)'},
m_eq3:{en:'mean response = Σ(responded_on − raised_on) / n over the items that carry both dates',uk:'середня відповідь = Σ(responded_on − raised_on) / n за позиціями, що мають обидві дати',de:'mittlere Antwortzeit = Σ(responded_on − raised_on) / n über die Positionen mit beiden Daten',nl:'gemiddeld antwoord = Σ(responded_on − raised_on) / n over de items met beide data',fr:'réponse moyenne = Σ(responded_on − raised_on) / n sur les éléments portant les deux dates',es:'respuesta media = Σ(responded_on − raised_on) / n sobre los elementos con ambas fechas',pl:'średnia odpowiedź = Σ(responded_on − raised_on) / n po pozycjach mających obie daty'},
m_n1:{en:'Authority: rows matching an item class replace the class * rows; with neither, no authority is defined and the item is reported.',uk:'Повноваження: рядки, що відповідають класу позиції, заміщують рядки класу *; якщо немає жодних, повноваження не визначено й позицію повідомлено.',de:'Befugnis: Zeilen, die zur Klasse der Position passen, ersetzen die Zeilen der Klasse *; fehlen beide, ist keine Befugnis definiert und die Position wird gemeldet.',nl:'Bevoegdheid: regels die bij de klasse van het item passen vervangen de regels met klasse *; ontbreken beide, dan is geen bevoegdheid bepaald en wordt het item gemeld.',fr:'Autorité : les lignes correspondant à la classe de l’élément remplacent les lignes de classe * ; à défaut des deux, aucune autorité n’est définie et l’élément est signalé.',es:'Autoridad: las filas que coinciden con la clase del elemento sustituyen a las filas de clase *; si faltan ambas, no hay autoridad definida y el elemento se reporta.',pl:'Uprawnienia: wiersze pasujące do klasy pozycji zastępują wiersze klasy *; gdy nie ma żadnych, uprawnienie nie jest określone, a pozycja jest zgłaszana.'},
m_n2:{en:'Classified means the item carries the class safety or regulatory, from the requirement register or from the tags on this page.',uk:'Класифікована означає, що позиція має клас «безпека» або «нормативна» — з реєстру вимог або з міток на цій сторінці.',de:'Klassifiziert heißt, die Position trägt die Klasse Sicherheit oder regulatorisch, aus dem Anforderungsregister oder aus den Marken auf dieser Seite.',nl:'Geclassificeerd betekent dat het item de klasse veiligheid of wettelijk draagt, uit het eisenregister of uit de tags op deze pagina.',fr:'Classée signifie que l’élément porte la classe sécurité ou réglementaire, issue du registre des exigences ou des étiquettes de cette page.',es:'Clasificado significa que el elemento lleva la clase seguridad o reglamentaria, del registro de requisitos o de las etiquetas de esta página.',pl:'Sklasyfikowana oznacza, że pozycja nosi klasę bezpieczeństwo lub regulacyjne — z rejestru wymagań albo ze znaczników na tej stronie.'},
m_n3:{en:'A bid deviation counts as accepted when the evaluation names a selected bidder and the entry is that bidder’s and not refused, or, with no selected bidder, when the entry is marked accepted.',uk:'Відхилення на торгах вважається прийнятим, якщо оцінка називає обраного учасника, запис належить йому й не відхилений, або, коли обраного учасника немає, якщо запис позначено як прийнятий.',de:'Eine Angebotsabweichung gilt als angenommen, wenn die Bewertung einen ausgewählten Bieter nennt und der Eintrag von diesem stammt und nicht abgelehnt ist, oder, ohne ausgewählten Bieter, wenn der Eintrag als angenommen markiert ist.',nl:'Een offerte-afwijking geldt als aanvaard wanneer de beoordeling een gekozen inschrijver noemt en de post van die inschrijver is en niet is afgewezen, of, zonder gekozen inschrijver, wanneer de post als aanvaard is gemarkeerd.',fr:'Une dérogation d’offre compte comme acceptée lorsque l’évaluation nomme un soumissionnaire retenu et que l’entrée est la sienne et n’est pas refusée, ou, sans soumissionnaire retenu, lorsque l’entrée est marquée acceptée.',es:'Una desviación de oferta cuenta como aceptada cuando la evaluación nombra un licitador seleccionado y la entrada es suya y no está rechazada, o, sin licitador seleccionado, cuando la entrada está marcada como aceptada.',pl:'Odstępstwo ofertowe uznaje się za przyjęte, gdy ocena wskazuje wybranego oferenta, a wpis należy do niego i nie został odrzucony, albo — przy braku wybranego oferenta — gdy wpis oznaczono jako przyjęty.'},
m_n4:{en:'Package sections that were not loaded switch off the rules that read them; the report says which.',uk:'Незавантажені розділи пакета вимикають правила, що їх читають; звіт вказує, які саме.',de:'Nicht geladene Paketabschnitte schalten die Regeln ab, die sie lesen; der Bericht nennt welche.',nl:'Niet geladen pakketsecties schakelen de regels uit die ze lezen; het rapport noemt welke.',fr:'Les sections du dossier non chargées désactivent les règles qui les lisent ; le rapport indique lesquelles.',es:'Las secciones del paquete no cargadas desactivan las reglas que las leen; el informe indica cuáles.',pl:'Niewczytane sekcje pakietu wyłączają reguły, które je czytają; raport podaje które.'},

learn_i_t:{en:'What this tool does',uk:'Що робить цей інструмент',de:'Was dieses Werkzeug tut',nl:'Wat deze tool doet',fr:'Ce que fait cet outil',es:'Qué hace esta herramienta',pl:'Co robi to narzędzie'},
learn_i_b:{en:'It keeps three kinds of supplier exchange against the requirement each one touches, checks them against the lifecycle, your authority matrix and the project package, and reports open counts, ageing and response times.',uk:'Він веде три види обміну з постачальником щодо вимоги, якої стосується кожен, перевіряє їх за життєвим циклом, вашою матрицею повноважень і проєктним пакетом і подає кількість відкритих, старіння та час відповіді.',de:'Es führt drei Arten des Lieferantenaustauschs gegen die jeweils berührte Anforderung, prüft sie gegen den Lebenszyklus, Ihre Befugnismatrix und das Projektpaket und meldet offene Zahlen, Alterung und Antwortzeiten.',nl:'Het houdt drie soorten leveranciersuitwisseling bij tegen de eis die elk raakt, toetst ze aan de levenscyclus, uw bevoegdheidsmatrix en het projectpakket, en rapporteert open aantallen, veroudering en antwoordtijden.',fr:'Il tient trois types d’échange fournisseur face à l’exigence que chacun touche, les confronte au cycle de vie, à votre matrice d’autorité et au dossier de projet, et rapporte les ouverts, l’ancienneté et les délais de réponse.',es:'Lleva tres tipos de intercambio con el proveedor frente al requisito que cada uno toca, los contrasta con el ciclo de vida, su matriz de autoridad y el paquete de proyecto, e informa de los abiertos, la antigüedad y los tiempos de respuesta.',pl:'Prowadzi trzy rodzaje wymiany z dostawcą wobec wymagania, którego każdy dotyczy, sprawdza je względem cyklu życia, Twojej macierzy uprawnień i pakietu projektowego oraz podaje liczby otwartych, starzenie i czasy odpowiedzi.'},
learn_k_t:{en:'The three kinds',uk:'Три види',de:'Die drei Arten',nl:'De drie soorten',fr:'Les trois types',es:'Los tres tipos',pl:'Trzy rodzaje'},
learn_k_b:{en:'A technical query asks about a requirement and changes nothing by itself; it is industry practice, with no ISO definition. A deviation permit is permission to depart from the specified requirements before realisation (ISO 9000:2015 3.12.6). A concession is permission to use or release a product that already does not conform (ISO 9000:2015 3.12.5, ISO 9001:2015 8.7.1 d).',uk:'Технічний запит питає про вимогу й сам по собі нічого не змінює; це галузева практика без означення в ISO. Дозвіл на відхилення — це дозвіл відступити від установлених вимог до реалізації (ISO 9000:2015 3.12.6). Поступка — це дозвіл використати чи випустити продукцію, що вже не відповідає (ISO 9000:2015 3.12.5, ISO 9001:2015 8.7.1 d).',de:'Eine technische Rückfrage fragt nach einer Anforderung und ändert für sich nichts; sie ist Branchenpraxis ohne ISO-Definition. Eine Abweicherlaubnis ist die Erlaubnis, vor der Realisierung von den festgelegten Anforderungen abzuweichen (ISO 9000:2015 3.12.6). Eine Sonderfreigabe ist die Erlaubnis, ein bereits nicht konformes Produkt zu verwenden oder freizugeben (ISO 9000:2015 3.12.5, ISO 9001:2015 8.7.1 d).',nl:'Een technische vraag vraagt naar een eis en verandert op zichzelf niets; het is praktijk in de branche, zonder ISO-definitie. Een afwijkingsvergunning is toestemming om vóór de realisatie van de gespecificeerde eisen af te wijken (ISO 9000:2015 3.12.6). Een concessie is toestemming om een reeds niet-conform product te gebruiken of vrij te geven (ISO 9000:2015 3.12.5, ISO 9001:2015 8.7.1 d).',fr:'Une question technique interroge une exigence et ne change rien par elle-même ; c’est une pratique du secteur, sans définition ISO. Une dérogation préalable est l’autorisation de s’écarter des exigences spécifiées avant réalisation (ISO 9000:2015 3.12.6). Une dérogation d’acceptation est l’autorisation d’utiliser ou de libérer un produit déjà non conforme (ISO 9000:2015 3.12.5, ISO 9001:2015 8.7.1 d).',es:'Una consulta técnica pregunta por un requisito y por sí sola no cambia nada; es práctica del sector, sin definición ISO. Un permiso de desviación es la autorización para apartarse de los requisitos especificados antes de la realización (ISO 9000:2015 3.12.6). Una concesión es la autorización para utilizar o liberar un producto que ya no es conforme (ISO 9000:2015 3.12.5, ISO 9001:2015 8.7.1 d).',pl:'Zapytanie techniczne pyta o wymaganie i samo w sobie niczego nie zmienia; to praktyka branżowa bez definicji ISO. Zezwolenie na odstępstwo to zgoda na odejście od wyspecyfikowanych wymagań przed realizacją (ISO 9000:2015 3.12.6). Zezwolenie na odstępstwo po wytworzeniu to zgoda na użycie lub zwolnienie wyrobu już niezgodnego (ISO 9000:2015 3.12.5, ISO 9001:2015 8.7.1 d).'},
learn_l_t:{en:'Lifecycle and decisions',uk:'Життєвий цикл і рішення',de:'Lebenszyklus und Entscheidungen',nl:'Levenscyclus en beslissingen',fr:'Cycle de vie et décisions',es:'Ciclo de vida y decisiones',pl:'Cykl życia i rozstrzygnięcia'},
learn_l_b:{en:'Every item runs raised, responded, dispositioned, closed. A disposition is one of accepted, accepted with conditions, rejected, withdrawn. Closing without a decision is a blocker, because the record of the authority deciding is what ISO 9001:2015 8.7.2 asks for.',uk:'Кожна позиція проходить: порушено, відповідь, рішення, закрито. Рішення — одне з: прийнято, прийнято з умовами, відхилено, відкликано. Закриття без рішення є блокувальним, бо саме запис про повноважного, який вирішив, вимагає ISO 9001:2015 8.7.2.',de:'Jede Position durchläuft eingereicht, beantwortet, entschieden, geschlossen. Eine Entscheidung ist angenommen, unter Bedingungen angenommen, abgelehnt oder zurückgezogen. Schließen ohne Entscheidung ist blockierend, denn den Nachweis der entscheidenden Befugnis verlangt ISO 9001:2015 8.7.2.',nl:'Elk item doorloopt ingediend, beantwoord, beslist, gesloten. Een beslissing is aanvaard, aanvaard onder voorwaarden, afgewezen of ingetrokken. Sluiten zonder beslissing is blokkerend, want de vastlegging van de beslissende bevoegdheid is wat ISO 9001:2015 8.7.2 vraagt.',fr:'Chaque élément suit ouvert, répondu, statué, clos. Une décision est acceptée, acceptée sous conditions, refusée ou retirée. Clore sans décision est bloquant, car l’enregistrement de l’autorité qui décide est ce qu’exige l’ISO 9001:2015 8.7.2.',es:'Cada elemento recorre planteado, respondido, resuelto, cerrado. Una decisión es aceptada, aceptada con condiciones, rechazada o retirada. Cerrar sin decisión es bloqueante, porque el registro de la autoridad que decide es lo que pide ISO 9001:2015 8.7.2.',pl:'Każda pozycja przechodzi: zgłoszone, odpowiedziano, rozstrzygnięte, zamknięte. Rozstrzygnięcie to przyjęte, przyjęte warunkowo, odrzucone lub wycofane. Zamknięcie bez rozstrzygnięcia jest blokujące, bo zapisu o rozstrzygającym uprawnionym wymaga ISO 9001:2015 8.7.2.'},
learn_a_t:{en:'The authority matrix and its fallback',uk:'Матриця повноважень і запасний рядок',de:'Die Befugnismatrix und ihr Rückfall',nl:'De bevoegdheidsmatrix en haar terugval',fr:'La matrice d’autorité et son repli',es:'La matriz de autoridad y su reserva',pl:'Macierz uprawnień i wiersz rezerwowy'},
learn_a_b:{en:'Each row names a requirement class, the kinds it covers, the roles that must approve and the roles that may. Rows matching the item class replace the class * rows rather than adding to them, so a safety row is the whole authority for a safety item. Whether the matrix itself matches your contract is outside this tool.',uk:'Кожен рядок називає клас вимоги, види, які він охоплює, ролі, що мають погодити, і ролі, що можуть. Рядки, які відповідають класу позиції, заміщують рядки класу *, а не додаються до них, тож рядок «безпека» є всім повноваженням для позиції з класом «безпека». Чи відповідає сама матриця вашому договору — поза межами цього інструмента.',de:'Jede Zeile nennt eine Anforderungsklasse, die abgedeckten Arten, die Rollen, die freigeben müssen, und die, die dürfen. Zeilen, die zur Klasse der Position passen, ersetzen die Zeilen der Klasse *, statt sie zu ergänzen; eine Sicherheitszeile ist damit die ganze Befugnis für eine Sicherheitsposition. Ob die Matrix selbst zu Ihrem Vertrag passt, liegt außerhalb dieses Werkzeugs.',nl:'Elke regel noemt een eisklasse, de soorten die ze dekt, de rollen die moeten goedkeuren en de rollen die mogen. Regels die bij de klasse van het item passen vervangen de regels met klasse *, in plaats van eraan toe te voegen; een veiligheidsregel is dus de hele bevoegdheid voor een veiligheidsitem. Of de matrix zelf bij uw contract past valt buiten deze tool.',fr:'Chaque ligne nomme une classe d’exigence, les types couverts, les rôles qui doivent approuver et ceux qui le peuvent. Les lignes correspondant à la classe de l’élément remplacent les lignes de classe * au lieu de s’y ajouter : une ligne sécurité constitue donc toute l’autorité d’un élément de sécurité. Savoir si la matrice elle-même correspond à votre contrat sort de cet outil.',es:'Cada fila nombra una clase de requisito, los tipos que cubre, los roles que deben aprobar y los que pueden. Las filas que coinciden con la clase del elemento sustituyen a las filas de clase * en vez de sumarse a ellas, de modo que una fila de seguridad es toda la autoridad de un elemento de seguridad. Si la matriz en sí encaja con su contrato queda fuera de esta herramienta.',pl:'Każdy wiersz wskazuje klasę wymagania, rodzaje, które obejmuje, role, które muszą zatwierdzić, i role, które mogą. Wiersze pasujące do klasy pozycji zastępują wiersze klasy *, a nie dodają się do nich, więc wiersz bezpieczeństwa stanowi całe uprawnienie dla pozycji bezpieczeństwa. To, czy sama macierz odpowiada Twojej umowie, jest poza tym narzędziem.'},
learn_g_t:{en:'Ageing and the target boundary',uk:'Старіння та межа цілі',de:'Alterung und die Vorgabegrenze',nl:'Veroudering en de normgrens',fr:'Ancienneté et la borne d’objectif',es:'Antigüedad y el límite del objetivo',pl:'Starzenie i granica celu'},
learn_g_b:{en:'Age is whole calendar days from the raised date to the evaluation date, with no working-day calendar and no clock. An item at exactly the target is inside it: with a target of 10 days, age 10 raises nothing and age 11 raises the overdue finding.',uk:'Вік — це цілі календарні дні від дати порушення до дати оцінювання, без робочого календаря й без годинника. Позиція рівно на цілі вважається в межах: за цілі 10 днів вік 10 не дає зауваження, а вік 11 дає прострочення.',de:'Das Alter zählt ganze Kalendertage vom Einreichungsdatum bis zum Bewertungsdatum, ohne Arbeitstagskalender und ohne Uhrzeit. Genau auf der Vorgabe liegt die Position noch innerhalb: bei einer Vorgabe von 10 Tagen erzeugt Alter 10 nichts, Alter 11 den Überfälligkeitsbefund.',nl:'Ouderdom is het aantal hele kalenderdagen van de indieningsdatum tot de beoordelingsdatum, zonder werkdagenkalender en zonder klok. Precies op de norm valt het item er nog binnen: bij een norm van 10 dagen levert ouderdom 10 niets op en ouderdom 11 de te-late bevinding.',fr:'L’ancienneté compte les jours calendaires entiers de la date d’ouverture à la date d’évaluation, sans calendrier ouvré ni horloge. Exactement à l’objectif, l’élément est dedans : avec un objectif de 10 jours, l’ancienneté 10 ne produit rien et l’ancienneté 11 produit le constat de retard.',es:'La antigüedad cuenta días naturales enteros desde la fecha de planteamiento hasta la fecha de evaluación, sin calendario laboral ni reloj. Justo en el objetivo el elemento queda dentro: con un objetivo de 10 días, la antigüedad 10 no produce nada y la 11 produce el hallazgo de retraso.',pl:'Wiek to pełne dni kalendarzowe od daty zgłoszenia do daty oceny, bez kalendarza dni roboczych i bez zegara. Pozycja dokładnie na celu mieści się w nim: przy celu 10 dni wiek 10 nie daje ustalenia, a wiek 11 daje ustalenie o przekroczeniu.'},
m_r1:{en:'Ages and durations are integer calendar days; the wall clock is not read during evaluation.',uk:'Вік і тривалості — цілі календарні дні; системний годинник під час оцінювання не читається.',de:'Alter und Dauern sind ganze Kalendertage; die Systemuhr wird bei der Bewertung nicht gelesen.',nl:'Ouderdom en duren zijn hele kalenderdagen; de systeemklok wordt tijdens de beoordeling niet gelezen.',fr:'Ancienneté et durées sont des jours calendaires entiers ; l’horloge n’est pas lue pendant l’évaluation.',es:'Antigüedades y duraciones son días naturales enteros; el reloj no se lee durante la evaluación.',pl:'Wiek i czasy trwania to pełne dni kalendarzowe; zegar systemowy nie jest odczytywany podczas oceny.'},
m_r2:{en:'Register of 0 to 300 items; 1 to 5 age bucket edges between 1 and 3650 d; response targets 1 to 365 d or none.',uk:'Реєстр від 0 до 300 позицій; від 1 до 5 меж вікових кошиків у діапазоні 1–3650 д; цілі відповіді 1–365 д або відсутні.',de:'Register von 0 bis 300 Positionen; 1 bis 5 Altersklassengrenzen zwischen 1 und 3650 d; Antwortvorgaben 1 bis 365 d oder keine.',nl:'Register van 0 tot 300 items; 1 tot 5 grenzen van ouderdomsklassen tussen 1 en 3650 d; antwoordnormen 1 tot 365 d of geen.',fr:'Registre de 0 à 300 éléments ; 1 à 5 bornes de tranches d’ancienneté entre 1 et 3650 j ; objectifs de réponse de 1 à 365 j ou aucun.',es:'Registro de 0 a 300 elementos; de 1 a 5 límites de tramos de antigüedad entre 1 y 3650 d; objetivos de respuesta de 1 a 365 d o ninguno.',pl:'Rejestr od 0 do 300 pozycji; od 1 do 5 granic przedziałów wieku w zakresie 1–3650 d; cele odpowiedzi 1–365 d albo brak.'},
scroll_hint:{en:'This table is wider than its column: scroll it sideways.',uk:'Ця таблиця ширша за колонку: прокрутіть її вбік.',de:'Diese Tabelle ist breiter als ihre Spalte: seitwärts scrollen.',nl:'Deze tabel is breder dan haar kolom: scroll zijwaarts.',fr:'Ce tableau est plus large que sa colonne : faites défiler latéralement.',es:'Esta tabla es más ancha que su columna: desplácela lateralmente.',pl:'Ta tabela jest szersza niż jej kolumna: przewiń ją w bok.'},
day_unit:{en:'d',uk:'d',de:'d',nl:'d',fr:'d',es:'d',pl:'d'}
};

/* ======================================================== 2. the interface */

var LANGS = ['en', 'uk', 'de', 'nl', 'fr', 'es', 'pl'];
var RLANG = '';   /* set while the report renders, so the sheet is not in the screen language */
function siteLang() {
  try {
    return RLANG || (window.DiagramUI && DiagramUI.siteLang && DiagramUI.siteLang()) ||
           (window.Diagram && Diagram.lang && Diagram.lang()) ||
           document.documentElement.lang || 'en';
  } catch (e) { return 'en'; }
}
function loc(o, lang) {
  if (o == null) return '';
  if (typeof o === 'string') return o;
  var l = lang || siteLang();
  return o[l] || o.en || '';
}
function T(key, vars, lang) {
  var s = loc(UI[key] || { en: key }, lang);
  if (vars) Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(String(vars[k])); });
  return s;
}
function opt(prefix, list, lang) {
  return list.map(function (k) { return { value: k, label: loc(UI[prefix + k] || { en: k }, lang) }; });
}
function kindLabel(k, lang) { return T('kind_' + k, null, lang); }
function statusLabel(k, lang) { return T('st_' + k, null, lang); }
function decisionLabel(k, lang) { return T('dc_' + (k || 'none'), null, lang); }
function classLabel(c, lang) { return T('cl_' + (c === '*' ? 'any' : c), null, lang); }
function bucketLabel(b, lang) { return b === 'undated' ? T('undated', null, lang) : b; }
function nnum(v, p) {
  if (v == null) return T('dash');
  try { return DiagramUI.fmt(v, { precision: p }); } catch (e) { return (p ? v.toFixed(p) : String(v)); }
}

/* ---- rule text ---- */
function ruleEntry(id) { return RT[id] || null; }
function ruleTitle(id, lang) { var e = ruleEntry(id); return e ? (e[lang || siteLang()] || e.en)[0] : id; }
function ruleMessage(h, lang) {
  var e = ruleEntry(h.rule); if (!e) return h.rule;
  var arr = e[lang || siteLang()] || e.en;
  var s = (h.v && h.v.mode === 'nobe' && arr[3]) ? arr[3] : arr[1];
  var v = h.v || {}, l = lang || siteLang();
  var vv = {};
  Object.keys(v).forEach(function (k) { vv[k] = v[k]; });
  if (vv.kind) vv.kind = kindLabel(vv.kind, l);
  if (vv.status) vv.status = statusLabel(vv.status, l);
  if (vv.decision !== undefined) vv.decision = decisionLabel(vv.decision, l);
  if (vv.flag) vv.flag = T('fl_' + vv.flag, null, l) || vv.flag;
  if (vv.classes) vv.classes = String(vv.classes).split(', ').filter(Boolean).map(function (c) { return classLabel(c, l); }).join(', ') || T('cl_none', null, l);
  if (vv.field) vv.field = fieldLabel(vv.field, l);
  if (vv.path) vv.path = fieldLabel(vv.path, l);
  Object.keys(vv).forEach(function (k) { s = s.split('{' + k + '}').join(String(vv[k])); });
  return s;
}
function ruleAction(h, lang) { var e = ruleEntry(h.rule); return e ? (e[lang || siteLang()] || e.en)[2] : ''; }
function ruleBasis(id, lang) {
  var e = ruleEntry(id); if (!e) return '';
  var l = lang || siteLang();
  return e.b.map(function (k) { return S[k] || loc(BASIS_WORDS[k], l) || k; }).join(' · ');
}
/* a machine path is never printed: every field name has a label (AGENTS §2.2.1) */
var FIELD_LABEL = {
  raised_on: 'f_raised_on', responded_on: 'f_responded_on', closed_on: 'f_closed_on',
  'disposition.dispositioned_on': 'c_dispositioned_on', 'disposition.decision': 'c_decision',
  'disposition.conditions': 'f_conditions', 'disposition.approvals': 'c_approvals',
  'disposition.design_review_ref': 'f_design_review', status: 'c_status', kind: 'c_kind',
  requirement_id: 'c_requirement', vendor_document_id: 'f_vendor_doc', bid_evaluation_id: 'c_be',
  bidder_id: 'c_bidder', package_id: 'c_package', change_ref: 'f_change_ref',
  conditions_closed_ref: 'f_cond_closed', id: 'c_id',
  'response_target_days.tq': 'f_target_tq', 'response_target_days.deviation': 'f_target_dev',
  'response_target_days.concession': 'f_target_con', age_bucket_edges: 'f_edges'
};
function fieldLabel(path, lang) {
  var p = String(path).replace(/^items\[[^\]]*\]\./, '').replace(/^settings\./, '');
  if (FIELD_LABEL[p]) return T(FIELD_LABEL[p], null, lang);
  var m = /^disposition\.approvals\[(\d+)\]\.date$/.exec(p);
  if (m) return T('c_approvals', null, lang) + ' ' + (+m[1] + 1) + ', ' + T('c_date', null, lang).toLowerCase();
  return p;
}
function sevLabel(s, lang) { return T('sev_' + s, null, lang); }
function sevTone(s) { return s === 'blocker' ? 'bad' : (s === 'major' ? 'warn' : null); }
function sevStatus(s) { return s === 'blocker' ? 'fail' : (s === 'major' ? 'attention' : 'info'); }

/* ---- working state ---- */
var state = presetState('tq-ageing-detailed');
var DEFAULTS = clone(state);
var last = null, ui = null, stage = null;
var filter = { kind: 'all', status: 'all', open: false };
var openRows = {};
var pkgLines = [], pkgConflicts = [], pkgBanner = null, pkgDismissed = false;

function recompute() { last = evaluate(state); return last; }

/* ---- the drawing: open items by age bucket, stacked by kind ---- */
function figureData(R) {
  var m = R.metrics, keys = m.bucket_keys.filter(function (b) {
    if (b !== 'undated') return true;
    return KINDS.some(function (k) { return m.open_by_kind_bucket[k][b] > 0; });
  });
  var rows = keys.map(function (b) {
    return { key: b, parts: KINDS.map(function (k) { return m.open_by_kind_bucket[k][b]; }),
             total: KINDS.reduce(function (a, k) { return a + m.open_by_kind_bucket[k][b]; }, 0) };
  });
  return rows;
}
function figureCaption(R, lang) {
  var t = R.eff.response_target_days.tq;
  return T('fig_caption', {
    as_of: R.state.as_of, edges: R.eff.age_bucket_edges.join(', '),
    target: t == null ? T('no_target', null, lang) : t + ' ' + T('day_unit', null, lang)
  }, lang);
}
function drawFigure(ctx, w, h, R, o) {
  o = o || {};
  var rows = figureData(R);
  var cs = getComputedStyle(document.documentElement);
  var muted = o.muted || cs.getPropertyValue('--muted').trim() || '#666';
  var line = o.line || cs.getPropertyValue('--line').trim() || '#ddd';
  var font = cs.getPropertyValue('--font').trim() || 'sans-serif';
  var series = o.series || function (i) { try { return DiagramUI.series(i); } catch (e) { return ['#3763e6', '#9a5a00', '#a5261f'][i]; } };
  var coarse = o.coarse;
  var padL = coarse ? 30 : 42, padR = 10, padT = 12, padB = coarse ? 34 : 40;
  ctx.clearRect(0, 0, w, h);
  var maxV = 1;
  rows.forEach(function (r) { if (r.total > maxV) maxV = r.total; });
  var plotH = h - padT - padB, plotW = w - padL - padR;
  var Y = function (v) { return padT + plotH * (1 - v / maxV); };
  ctx.font = '400 ' + (coarse ? 9 : 11) + 'px ' + font;
  ctx.strokeStyle = line; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + plotH); ctx.lineTo(w - padR, padT + plotH); ctx.stroke();
  /* integer ticks only: the axis counts items, and 2.5 items is not a thing */
  var step = Math.max(1, Math.ceil(maxV / 5));
  ctx.fillStyle = muted; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (var v = 0; v <= maxV; v += step) {
    var y = Y(v);
    ctx.beginPath(); ctx.moveTo(padL - 4, y); ctx.lineTo(padL, y); ctx.stroke();
    ctx.fillText(String(v), padL - 6, y);
  }
  if (!rows.length) return;
  var slot = plotW / rows.length, bw = Math.min(coarse ? 34 : 56, slot * 0.62);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  rows.forEach(function (r, i) {
    var x = padL + slot * (i + 0.5) - bw / 2, base = padT + plotH;
    r.parts.forEach(function (n, ki) {
      if (!n) return;
      var hh = plotH * n / maxV;
      ctx.fillStyle = series(ki);
      ctx.fillRect(x, base - hh, bw, hh);
      base -= hh;
    });
    ctx.fillStyle = muted;
    var lab = bucketLabel(r.key);
    if (coarse && lab.length > 7) lab = lab.slice(0, 6) + '…';
    ctx.fillText(lab, padL + slot * (i + 0.5), padT + plotH + 6);
    if (r.total) {
      ctx.textBaseline = 'bottom';
      ctx.fillText(String(r.total), padL + slot * (i + 0.5), Y(r.total) - 3);
      ctx.textBaseline = 'top';
    }
  });
}
function figureA11y() {
  if (!last) return '';
  var rows = figureData(last);
  return T('fig_alt') + ' ' + rows.map(function (r) {
    return bucketLabel(r.key) + ': ' + r.total;
  }).join('; ') + '.';
}

/* ---- small DOM helpers. The tool owns the register editor and the findings
   list because the framework has no field type for a register; everything else
   on screen is a framework component. ---- */
function E(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function clearNode(n) { while (n && n.firstChild) n.removeChild(n.firstChild); }
function input(type, value, on) {
  var i = document.createElement('input');
  i.type = type; i.className = 'dr-in'; i.value = value == null ? '' : value;
  i.addEventListener('change', function () { on(i.value); });
  return i;
}
function select(options, value, on) {
  var s = document.createElement('select');
  s.className = 'dr-in';
  options.forEach(function (o) {
    var op = document.createElement('option');
    op.value = o.value; op.textContent = o.label;
    s.appendChild(op);
  });
  s.value = value == null ? '' : value;
  s.addEventListener('change', function () { on(s.value); });
  return s;
}
function textarea(value, on) {
  var t = document.createElement('textarea');
  t.className = 'dr-in'; t.rows = 2; t.value = value == null ? '' : value;
  t.addEventListener('change', function () { on(t.value); });
  return t;
}
function labelled(labelText, ctl) {
  var w = E('label', 'dr-f');
  w.appendChild(E('span', 'dr-fl', labelText));
  w.appendChild(ctl);
  return w;
}
function btn(text, on, cls) {
  var b = E('button', 'dr-btn' + (cls ? ' ' + cls : ''), text);
  b.type = 'button';
  b.addEventListener('click', on);
  return b;
}
function touch() { if (ui) { try { ui.run(); } catch (e) {} } paintAll(); }

/* ---- register ---- */
var regBox = null, authBox = null, findBox = null, pkgBox = null;

function nextId(kind) {
  var pre = KIND_PREFIX[kind], max = 0;
  state.items.forEach(function (i) {
    var m = new RegExp('^' + pre + '-([0-9]{3,5})$').exec(i.id);
    if (m && +m[1] > max) max = +m[1];
  });
  var n = String(max + 1);
  while (n.length < 3) n = '0' + n;
  return pre + '-' + n;
}
function addItem(kind) {
  var it = normItem({ kind: kind });
  it.id = nextId(kind);
  it.raised_on = state.as_of;
  state.items.push(it);
  openRows[it.id] = true;
  touch();
}
function pickList(list, labelFn) {
  var o = [{ value: '', label: T('dash') }];
  (list || []).forEach(function (x) { o.push({ value: x.id, label: labelFn ? labelFn(x) : (x.id + (x.name ? ' — ' + x.name : '')) }); });
  return o;
}
function idOrText(ctxList, value, on, labelFn) {
  /* a picker when the package is loaded, a free text box when it is not */
  if (Array.isArray(ctxList)) {
    var opts = pickList(ctxList, labelFn);
    if (value && !ctxList.some(function (x) { return x.id === value; })) opts.push({ value: value, label: value });
    return select(opts, value, on);
  }
  return input('text', value, on);
}
function findingsFor(id) {
  if (!last) return [];
  return last.hits.filter(function (h) { return h.target === id; });
}
function itemFlags(id) {
  if (!last) return [];
  return last.flag_views.filter(function (f) { return f.flag.target_id === id; });

/* ---- project package (§7). Explicit load only: boot peeks and offers, it
   never applies. Every storage call is wrapped; a throw degrades to
   "no package" and leaves the register working. ---- */
var PKG_SECTIONS_READ = ['project', 'structure', 'requirements', 'vendor_documents', 'bid_evaluations', 'deviations', 'flags'];
function PKG_OK() { try { return !!(window.DiagramProject && DiagramProject.api === 'tools.petrov.re/project-package/v1'); } catch (e) { return false; } }
function pkgSectionLabel(k) { try { return DiagramProject.sectionLabel(k, siteLang()) || k; } catch (e) { return k; } }
function pkgSay(list) { pkgLines = (list || []).filter(Boolean); pkgPaint(); }

/* §7.2 — what each read section is read FOR. Anything else the package carries
   inside those sections is ignored, and the load says so by name. The runtime's
   own `load().ignored` names whole sections only, so `structure.systems` and
   every unread field would otherwise never be reported (spec §15 AC 8). */
var PKG_FIELDS_READ = {
  project: ['name', 'reference', 'lifecycle'],
  requirements: ['id', 'text', 'label', 'category'],
  vendor_documents: ['id', 'label', 'package', 'package_id'],
  bid_evaluations: ['id', 'package_id', 'selected_bidder_id', 'selected_bidder', 'bidders', 'compliance'],
  'structure.packages': ['id', 'name'],
  'bid_evaluations.bidders': ['id', 'name'],
  'bid_evaluations.compliance': ['requirement_id', 'bidder_id', 'bidder', 'status', 'deviation_accepted']
};
function pkgUnread(rows, read, prefix, into) {
  (Array.isArray(rows) ? rows : []).forEach(function (r) {
    if (!r || typeof r !== 'object') return;
    Object.keys(r).forEach(function (k) { if (read.indexOf(k) < 0) into[prefix + k] = 1; });
  });
}
function pkgIgnoredLines(p, runtimeIgnored, coerced) {
  p = p || {};
  var sections = (runtimeIgnored || []).map(pkgSectionLabel), fields = {};
  if (p.structure && typeof p.structure === 'object') {
    Object.keys(p.structure).forEach(function (k) { if (k !== 'packages') sections.push('structure.' + k); });
    pkgUnread(p.structure.packages, PKG_FIELDS_READ['structure.packages'], 'structure.packages[].', fields);
  }
  if (p.project && typeof p.project === 'object')
    pkgUnread([p.project], PKG_FIELDS_READ.project, 'project.', fields);
  pkgUnread(p.requirements, PKG_FIELDS_READ.requirements, 'requirements[].', fields);
  pkgUnread(p.vendor_documents, PKG_FIELDS_READ.vendor_documents, 'vendor_documents[].', fields);
  pkgUnread(p.bid_evaluations, PKG_FIELDS_READ.bid_evaluations, 'bid_evaluations[].', fields);
  (Array.isArray(p.bid_evaluations) ? p.bid_evaluations : []).forEach(function (b) {
    if (!b || typeof b !== 'object') return;
    pkgUnread(b.bidders, PKG_FIELDS_READ['bid_evaluations.bidders'], 'bid_evaluations[].bidders[].', fields);
    pkgUnread(b.compliance, PKG_FIELDS_READ['bid_evaluations.compliance'], 'bid_evaluations[].compliance[].', fields);
  });
  var fl = Object.keys(fields).sort(), out = [];
  if (sections.length) out.push(T('pkg_ignored', { list: sections.join(', ') }));
  if (fl.length) out.push(T('pkg_ignored_fields', { list: fl.join(', ') }));
  var co = coercedLine(coerced);
  if (co) out.push(co);
  if (!out.length) out.push(T('pkg_ignored_none'));
  return out;
}
/* one sentence naming every item, field and value the normalisation replaced.
   The entry is punctuation and user data only, so it carries no language. */
function coercedEntry(c) {
  return (c.id || T('dash')) + ' · ' + c.field + ': ' + c.from + ' → ' + (c.to === '' ? T('dash') : c.to);
}
function coercedLine(list) {

}

/* §7.2 — field-level mapping. Anything not named here is ignored and said so. */
function pkgReadContext(p, rev) {
  var c = blankContext();
  c.source = 'package';
  c.package_revision = (typeof rev === 'number') ? rev : null;
  if (p.project && typeof p.project === 'object')
    c.project = { name: str(p.project.name), reference: str(p.project.reference), lifecycle: str(p.project.lifecycle) };
  if (p.structure && Array.isArray(p.structure.packages))
    c.packages = p.structure.packages.map(function (x) { return { id: str(x && x.id), name: str(x && x.name) }; });
  if (Array.isArray(p.requirements))
    c.requirements = p.requirements.map(function (r) {
      r = r || {};
      return { id: str(r.id), text: str(r.text != null && r.text !== '' ? r.text : r.label), category: str(r.category) };
    });
  if (Array.isArray(p.vendor_documents))
    c.vendor_documents = p.vendor_documents.map(function (v) {
      v = v || {};
      var pk = (v.package && v.package.ref != null) ? v.package.ref : v.package_id;
      return { id: str(v.id), label: str(v.label), package_id: str(pk) };

    c.bid_evaluations = normContext({ bid_evaluations: p.bid_evaluations }).bid_evaluations;

/* ======================================================= 3. the data layer */

function dgcRecord() {
  var R = recompute();
  if (!R.state.items.length && R.state.context.source === 'none') return null;   /* §15.13 */
  var pub = evaluatePublic(state);
  /* the metrics stand at the top level of `outputs` so the Python export can
     name them in `covers`, which the runtime matches against output keys */
  var outputs = { verdict: pub.verdict, counts: pub.counts, save_allowed: pub.save_allowed,
                  hits: pub.hits };
  Object.keys(pub.metrics).forEach(function (k) { if (k !== 'bucket_keys') outputs[k] = pub.metrics[k]; });
  return {
    inputs: clone(R.state),
    outputs: outputs,
    units: {
      age_days: 'd', response_days: 'd', disposition_days: 'd',
      mean_response_days: 'd', max_response_days: 'd', mean_disposition_days: 'd',
      age_bucket_edges: 'd', response_target_days: 'd'
    },
    model: {
      equations: [T('m_eq1', null, 'en'), T('m_eq2', null, 'en'), T('m_eq3', null, 'en')],
      ranges: ['whole calendar days between ISO dates; no working-day calendar, no holidays, no time zones',
               'items 0-300; age bucket edges 1-5 values, 1-3650 d; response targets 1-365 d or none'],
      notes: [T('m_n1', null, 'en'), T('m_n2', null, 'en'), T('m_n3', null, 'en'), T('m_n4', null, 'en'),
              'Rule-based register check; it does not judge whether a deviation or concession is technically acceptable.']
    },
    warnings: R.counts.blocker ? ['register records dispositions that the authority matrix or a review record does not support'] : []
  };
}

    if (!Array.isArray(R.state.context[p[0]])) out.push(T(p[1], null, lang));
  });

function packagesInRegister(R) {

}
function reportFigure(R, ctx, lang) {
  try {
    var c = document.createElement('canvas');
    var W = 720, H = 360;
    c.width = W * 2; c.height = H * 2;            /* 2x, per AGENTS §2.2.1 */
    c.style.width = W + 'px'; c.style.height = H + 'px';
    var g = c.getContext('2d');
    g.scale(2, 2);
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
    drawFigure(g, W, H, R, {
      muted: '#5b6675', line: '#c9d1dc',
      series: function (i) { return ['#3763e6', '#9a5a00', '#a5261f'][i] || '#5b6675'; }
    });
    /* legend, because the report has no framework legend strip beside it */
    g.font = '400 11px sans-serif'; g.textAlign = 'left'; g.textBaseline = 'middle';
    var x = 46;
    KINDS.forEach(function (k, i) {
      g.fillStyle = ['#3763e6', '#9a5a00', '#a5261f'][i];
      g.fillRect(x, H - 14, 10, 10);
      g.fillStyle = '#5b6675';
      var lab = kindLabel(k, lang);
      g.fillText(lab, x + 14, H - 9);
      x += 24 + g.measureText(lab).width;
    });
    return ctx.figure(c, { caption: figureCaption(R, lang), alt: T('fig_alt', null, lang) });
  } catch (e) { return null; }
}

function reportProfile(rec, ctx) {
  var lang = (ctx && (ctx.domainLang || ctx.lang)) || siteLang();
  RLANG = LANGS.indexOf(lang) >= 0 ? lang : 'en';
  try {
    var R = recompute();
    var m = R.metrics, c = R.state.context;
    var split = KINDS.map(function (k) {
      var n = R.state.items.filter(function (i) { return i.kind === k; }).length;

    }).join(', ');
    var named = uniq(R.hits.filter(function (h) { return h.severity === 'blocker' || h.severity === 'major'; })

    var execText = [T('rep_exec', { n: R.state.items.length, split: split, verdict: T('v_' + R.verdict, null, RLANG) }, RLANG)];

      { label: T('rep_project', null, RLANG), value: (c.project && c.project.name) || T('dash', null, RLANG) },

    ];

    /* the results table carries what the tiles do not (the engine drops a
       repeat), so open counts per kind and the per-kind times live here */
    var results = [];
    KINDS.forEach(function (k) {
      results.push({ label: T('t_open', null, RLANG) + ', ' + kindLabel(k, RLANG), value: m.open_by_kind[k] });
    });
    KINDS.concat(['all']).forEach(function (k) {
      var nm = k === 'all' ? T('all_kinds', null, RLANG) : kindLabel(k, RLANG);
      /* the mean response over all kinds is a summary tile; the engine drops a
         repeat only when the label matches, so it is left out here by hand */
      if (m.mean_response_days[k] != null && k !== 'all')
        results.push({ label: T('c_mean', null, RLANG) + ' · ' + T('g_response', null, RLANG) + ', ' + nm,
                       value: m.mean_response_days[k], unit: 'd', note: 'n = ' + m.n_responded[k] });

        results.push({ label: T('c_max', null, RLANG) + ' · ' + T('g_response', null, RLANG) + ', ' + nm, value: m.max_response_days[k], unit: 'd' });

        results.push({ label: T('c_mean', null, RLANG) + ' · ' + T('g_disposition', null, RLANG) + ', ' + nm,
                       value: m.mean_disposition_days[k], unit: 'd', note: 'n = ' + m.n_dispositioned[k] });
    });
    DECISIONS.concat(['none']).forEach(function (d) {
      results.push({ label: T('c_decision', null, RLANG) + ': ' + decisionLabel(d === 'none' ? '' : d, RLANG), value: m.decisions[d] });
    });
    if (Array.isArray(c.bid_evaluations)) {
      results.push({ label: T('r_recon', null, RLANG) + ' · ' + T('dc_accepted', null, RLANG), value: m.bid_deviations_accepted });
      results.push({ label: T('r_recon', null, RLANG) + ' · ' + T('missing_word', null, RLANG), value: m.bid_deviations_unregistered });
    }
    results.push({ label: T('rep_flags_shown', null, RLANG), value: R.flag_views.length });
    results.push({ label: T('rep_flags_orphan', null, RLANG), value: R.orphan_flags.length });

    /* House rule: nothing is said twice. Several targets of one rule share the
       same message and next action word for word, so only the first card of a
       rule carries them; the rest carry what is particular to their target. */
    var saidOnce = {};
    function once(text) {
      var t = String(text || '');
      if (!t || t.length < 24) return t;
      if (saidOnce[t]) return '';
      saidOnce[t] = 1;
      return t;
    }
    var checks = R.hits.filter(function (h) { return h.severity !== 'info'; }).map(function (h) {
      return {
        status: sevStatus(h.severity),
        title: h.rule + ' · ' + ruleTitle(h.rule, RLANG) + ' — ' + h.target,
        detail: once(ruleMessage(h, RLANG)),
        actual: checkActual(h, RLANG),
        criterion: checkCriterion(h, RLANG),

    var sections = [];

        return [it.id, kindLabel(it.kind, RLANG), it.title || T('dash', null, RLANG),
                it.requirement_id || T('dash', null, RLANG), statusLabel(it.status, RLANG),
                decisionLabel(it.disposition.decision, RLANG),
                it.disposition.dispositioned_on || T('dash', null, RLANG),
                it.disposition.approvals.map(function (a) {
                  var r = R.state.roles.filter(function (x) { return x.id === a.role_id; })[0];
                  return r ? r.name || r.id : a.role_id;

                age == null ? T('dash', null, RLANG) : String(age)]
      })
    });
    sections.push({
      title: T('g_matrix', null, RLANG),
      head: [T('c_id', null, RLANG), T('c_class', null, RLANG), T('c_kinds', null, RLANG), T('c_required', null, RLANG), T('c_permitted', null, RLANG)],
      rows: R.state.authority_matrix.map(function (r) {
        return [r.id, classLabel(r.cls, RLANG), r.kinds.map(function (k) { return kindLabel(k, RLANG); }).join(', '),
                r.required_roles.join(', ') || T('dash', null, RLANG), r.permitted_roles.join(', ') || T('dash', null, RLANG)];
      })
    });
    if (Array.isArray(c.bid_evaluations)) {
      sections.push({
        title: T('r_recon', null, RLANG),
        head: [T('c_be', null, RLANG), T('c_bidder', null, RLANG), T('c_requirement', null, RLANG), T('c_item', null, RLANG)],
        rows: R.recon.map(function (x) {
          var item = R.state.items.filter(function (it) {
            return it.kind === 'deviation' && it.requirement_id === x.requirement && it.bid_evaluation_id === x.be &&
                   (it.bidder_id === x.bidder || it.bidder_id === '');
          })[0];
          return [x.be, x.bidder || T('dash', null, RLANG), x.requirement, item ? item.id : T('missing_word', null, RLANG)];
        })
      });
    }
    if (R.orphan_flags.length) {
      sections.push({
        title: T('r_unmatched', null, RLANG),
        head: [T('c_id', null, RLANG), T('c_kind', null, RLANG), T('c_reason', null, RLANG)],
        rows: R.orphan_flags.map(function (f) {
          return [f.flag.target_id, T('fl_' + f.flag.flag, null, RLANG) || f.flag.flag, f.flag.reason || T('dash', null, RLANG)];
        })
      });
    }

    var notes = [T('m_n1', null, RLANG), T('m_n2', null, RLANG), T('m_n3', null, RLANG), T('m_n4', null, RLANG)]
                .map(once).filter(Boolean);
    var nl = notLoadedList(R, RLANG);
    if (nl.length) notes.push(T('m_notloaded', { list: nl.join(', ') }, RLANG));

    var inputs = [
      { group: T('sec_settings', null, RLANG), label: T('f_as_of', null, RLANG), value: R.state.as_of },
      { group: T('sec_settings', null, RLANG), label: T('f_target_tq', null, RLANG),
        text: R.eff.response_target_days.tq == null ? T('no_target', null, RLANG) : R.eff.response_target_days.tq + ' d' },
      { group: T('sec_settings', null, RLANG), label: T('f_target_dev', null, RLANG),
        text: R.eff.response_target_days.deviation == null ? T('no_target', null, RLANG) : R.eff.response_target_days.deviation + ' d' },
      { group: T('sec_settings', null, RLANG), label: T('f_target_con', null, RLANG),
        text: R.eff.response_target_days.concession == null ? T('no_target', null, RLANG) : R.eff.response_target_days.concession + ' d' },
      { group: T('sec_settings', null, RLANG), label: T('f_edges', null, RLANG), text: R.eff.age_bucket_edges.join(', ') + ' d' }
    ];
    R.state.roles.forEach(function (r) { inputs.push({ group: T('g_roles', null, RLANG), label: r.id, text: r.name || T('dash', null, RLANG) }); });
    Object.keys(R.state.requirement_tags).forEach(function (k) {
      inputs.push({ group: T('g_tags', null, RLANG), label: k, text: R.state.requirement_tags[k].map(function (x) { return classLabel(x, RLANG); }).join(', ') });
    });
    [['requirements', 'c_requirement'], ['vendor_documents', 'f_vendor_doc'], ['bid_evaluations', 'c_be'],
     ['packages', 'c_package'], ['flags', 'rep_flags_shown']].forEach(function (p) {
      inputs.push({ group: T('sec_context', null, RLANG), label: T(p[1], null, RLANG),
                    text: Array.isArray(c[p[0]]) ? String(c[p[0]].length) : T('not_loaded', null, RLANG) });
    });
    inputs.push({ group: T('sec_context', null, RLANG), label: T('rep_revision', null, RLANG),
                  text: c.package_revision == null ? T('not_loaded', null, RLANG) : String(c.package_revision) });

    var fig = reportFigure(R, ctx, RLANG);
    var out = {
      title: T('rep_title', null, RLANG),
      project: project,
      executive: {
        text: execText,
        /* the report's metric grid formats through reportValue(), which reads no
           precision, so the value reaches it already rounded to the §11 decimal */
        results: tilesFor(R, RLANG).map(function (t) {
          var p = t.precision === undefined ? 0 : t.precision, v = t.value, f = Math.pow(10, p);
          if (typeof v === 'number' && isFinite(v)) v = Math.round(v * f) / f;
          return { label: t.label, value: v, unit: t.hint || null, precision: p };
        }),
        conclusion: R.verdict === 'blocked' ? T('rep_conclusion', null, RLANG) : ''

      },
