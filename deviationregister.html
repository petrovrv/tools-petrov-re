    };
    RLANG = '';
    return out;
  } catch (e) { RLANG = ''; throw e; }
}
/* a check without a criterion is not a check (TZ-report-profile §2.3) */
function checkActual(h, lang) {
  var v = h.v || {};
  if (h.rule === 'DEV-R-010') return T('c_approvals', null, lang) + ': ' + (v.approved || T('dash', null, lang));
  if (h.rule === 'DEV-R-011') return T('c_approvals', null, lang) + ': ' + (v.list || T('dash', null, lang));
  if (h.rule === 'DEV-R-040') return v.age + ' d';
  if (h.rule === 'DEV-R-042') return v.days + ' d';
  if (h.rule === 'DEV-R-002') return String(v.n);
  if (h.rule === 'DEV-R-009') return String(v.value);
  if (h.rule === 'DEV-R-003') return String(v.value || T('dash', null, lang));
  if (h.rule === 'DEV-R-001') return String(v.id || T('dash', null, lang));
  return T('missing_word', null, lang);
}
function checkCriterion(h, lang) {
  var v = h.v || {};
  if (h.rule === 'DEV-R-010') return T('c_required', null, lang) + ': ' + (v.required || T('dash', null, lang));
  if (h.rule === 'DEV-R-011') return T('c_permitted', null, lang) + ': ' + (v.permitted || T('dash', null, lang));
  if (h.rule === 'DEV-R-040' || h.rule === 'DEV-R-042') return '≤ ' + v.target + ' d';
  if (h.rule === 'DEV-R-002') return '1';
  if (h.rule === 'DEV-R-009') return T('h_target', null, lang);
  if (h.rule === 'DEV-R-003') return '≤ ' + v.as_of;
  if (h.rule === 'DEV-R-001') return 'TQ|DEV|CON-[0-9]{3,5}';
  return fieldLabel(h.field, lang) + ' ≠ “”';
}

/* ---- Python export (§12). Scoped reproduce: the calendar-day arithmetic,
   the bucket assignment, the open counts and the response / disposition means
   are ported line for line; the rule engine is not. ---- */
var PY_CODE = [
"from datetime import date",
"",
"KINDS = ['tq', 'deviation', 'concession']",
"DECISION_TOKENS = ['accepted', 'accepted_with_conditions', 'rejected', 'withdrawn']",
"DEFAULT_EDGES = [7, 14, 30]",
"DEFAULT_TARGETS = {'tq': 10, 'deviation': None, 'concession': None}",
"",
"# AS_OF, SETTINGS and ITEMS are written above from the record; REGISTER is the",
"# register reduced to the fields this arithmetic reads",
"REGISTER = [{",
"    'id': i.get('id', ''),",
"    'kind': i.get('kind', 'tq'),",
"    'status': i.get('status', 'raised'),",
"    'raised_on': i.get('raised_on', ''),",
"    'responded_on': i.get('responded_on', ''),",
"    'dispositioned_on': (i.get('disposition') or {}).get('dispositioned_on', ''),",
"    'decision': (i.get('disposition') or {}).get('decision', ''),",
"} for i in ITEMS]",
"",
"",
"def _parse(s):",
"    \"\"\"ISO calendar date or None. No clock, no zone: the tool reads none either.\"\"\"",
"    if not isinstance(s, str) or len(s) != 10 or s[4] != '-' or s[7] != '-':",
"        return None",
"    try:",
"        return date(int(s[0:4]), int(s[5:7]), int(s[8:10]))",
"    except ValueError:",
"        return None",
"",
"",
"def days(a, b):",
"    \"\"\"Whole calendar days from a to b, or None when either is not a date.\"\"\"",
"    da, db = _parse(a), _parse(b)",
"    if da is None or db is None:",
"        return None",
"    return db.toordinal() - da.toordinal()",
"",
"",
"def _edges_valid(e):",
"    if not isinstance(e, list) or not (1 <= len(e) <= 5):",
"        return False",
"    for i, v in enumerate(e):",
"        if isinstance(v, bool) or not isinstance(v, int) or not (1 <= v <= 3650):",
"            return False",
"        if i and v <= e[i - 1]:",
"            return False",
"    return True",
"",
"",
"def _target_valid(v):",
"    if v is None:",
"        return True",
"    return (not isinstance(v, bool)) and isinstance(v, int) and 1 <= v <= 365",
"",
"",
"def effective_edges():",
"    e = (SETTINGS or {}).get('age_bucket_edges')",
"    return list(e) if _edges_valid(e) else list(DEFAULT_EDGES)",
"",
"",
"def effective_target(kind):",
"    t = ((SETTINGS or {}).get('response_target_days') or {})",
"    v = t.get(kind, DEFAULT_TARGETS[kind])",
"    return v if _target_valid(v) else DEFAULT_TARGETS[kind]",
"",
"",
"def bucket_keys(edges):",
"    keys = []",
"    for i, e in enumerate(edges):",
"        keys.append(('0' if i == 0 else str(edges[i - 1] + 1)) + '-' + str(e))",
"    keys.append('>' + str(edges[-1]))",
"    keys.append('undated')",
"    return keys",
"",
"",
"def bucket(age, edges):",
"    \"\"\"Upper edge inclusive: age 7 is in 0-7, age 8 in 8-14.\"\"\"",
"    if age is None or age < 0:",
"        return 'undated'",
"    for i, e in enumerate(edges):",
"        if age <= e:",
"            return ('0' if i == 0 else str(edges[i - 1] + 1)) + '-' + str(e)",
"    return '>' + str(edges[-1])",
"",
"",
"def _mean(values):",
"    if not values:",
"        return None",
"    total = 0",
"    for v in values:",
"        total += v",
"    return total / len(values)",
"",
"",
"def compute():",
"    edges = effective_edges()",
"    keys = bucket_keys(edges)",
"    obkb = dict((k, dict((b, 0) for b in keys)) for k in KINDS)",
"    obk = dict((k, 0) for k in KINDS)",
"    open_total = 0",
"    decisions = dict((d, 0) for d in DECISION_TOKENS)",
"    decisions['none'] = 0",
"    resp = dict((k, []) for k in KINDS)",
"    disp = dict((k, []) for k in KINDS)",
"    resp['all'] = []",
"    disp['all'] = []",
"    overdue = 0",
"    for it in REGISTER:",
"        kind = it['kind'] if it['kind'] in KINDS else 'tq'",
"        age = days(it['raised_on'], AS_OF)",
"        if it['status'] != 'closed':",
"            obkb[kind][bucket(age, edges)] += 1",
"            obk[kind] += 1",
"            open_total += 1",
"        decisions[it['decision'] if it['decision'] in DECISION_TOKENS else 'none'] += 1",
"        rd = days(it['raised_on'], it['responded_on'])",
"        if rd is not None and rd >= 0:",
"            resp[kind].append(rd)",
"            resp['all'].append(rd)",
"        dd = days(it['raised_on'], it['dispositioned_on'])",
"        if dd is not None and dd >= 0 and it['decision'] != '':",
"            disp[kind].append(dd)",
"            disp['all'].append(dd)",
"        # the DEV-R-040 condition itself, not a count taken from the page",
"        t = effective_target(kind)",
"        if it['status'] == 'raised' and t is not None and age is not None and age > t:",
"            overdue += 1",
"    mean_resp, n_resp, max_resp, mean_disp, n_disp = {}, {}, {}, {}, {}",
"    for k in KINDS + ['all']:",
"        mean_resp[k] = _mean(resp[k])",
"        n_resp[k] = len(resp[k])",
"        max_resp[k] = max(resp[k]) if resp[k] else None",
"        mean_disp[k] = _mean(disp[k])",
"        n_disp[k] = len(disp[k])",
"    return {",
"        'open_by_kind_bucket': obkb,",
"        'open_by_kind': obk,",
"        'open_total': open_total,",
"        'mean_response_days': mean_resp,",
"        'n_responded': n_resp,",
"        'max_response_days': max_resp,",
"        'mean_disposition_days': mean_disp,",
"        'n_dispositioned': n_disp,",
"        'overdue_count': overdue,",
"        'decisions': decisions,",
"    }"
].join('\n');

var PY_COVERS = ['open_by_kind_bucket', 'open_by_kind', 'open_total', 'mean_response_days',
                 'n_responded', 'max_response_days', 'mean_disposition_days', 'n_dispositioned',
                 'overdue_count', 'decisions'];

function pythonSpec() {
  var R = recompute();
  if (!R.state.items.length && R.state.context.source === 'none')
    return { unsupported: {
      en: 'The register is empty and no package is loaded, so there is nothing to export.',
      uk: 'Реєстр порожній і пакет не завантажено, тож експортувати нічого.',
      de: 'Das Register ist leer und kein Paket geladen, es gibt nichts zu exportieren.',
      nl: 'Het register is leeg en er is geen pakket geladen, dus er valt niets te exporteren.',
      fr: 'Le registre est vide et aucun dossier n’est chargé : il n’y a rien à exporter.',
      es: 'El registro está vacío y no hay paquete cargado, así que no hay nada que exportar.',
      pl: 'Rejestr jest pusty i nie wczytano pakietu, więc nie ma czego eksportować.' } };
  return {
    code: PY_CODE,
    requires: [],
    covers: PY_COVERS,
    scope: 'calendar-day ageing, bucket assignment, open counts, response and disposition means, and the overdue count from the DEV-R-040 condition',
    basis: {
      kind: 'reproduce',
      note: 'calendar-day ageing, bucket assignment, open counts and response/disposition means ported from the page’s metric code; rule evaluation is not exported',
      deviation: 'none expected; integer day arithmetic via datetime.date ordinals'
    },
    selftest: {
      tolerance: 1e-12,
      note: 'Integer quantities are exact. Means are the same sum in the same order, so only float summation can differ.'
    }
  };
}

/* ---- benchmark adapter. The corpus is authored independently from the
   public spec; this maps each tool-neutral case onto the page's own
   evaluation and grades it (§13). ---- */
var BENCH_REF_URL = 'benchmarks/deviationregister.reference.json';
/* the corpus this build was graded against; a different file is refused rather
   than silently graded, so a tampered or stale corpus cannot pass unnoticed */
var BENCH_REF_SHA256 = '81244867bef7dec188f43f04f62be9d17ace7ca96f938ee265bd1595bf5fc31e';
var MANIFEST = {};
try { MANIFEST = JSON.parse(document.getElementById('diagram-tool-manifest').textContent); } catch (e) { MANIFEST = { title: { en: 'Deviation register' } }; }
var MANIFEST_REV = MANIFEST.manifest_revision || '';

function sha256Hex(text) {
  try {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return (b < 16 ? '0' : '') + b.toString(16); }).join('');
    });
  } catch (e) { return Promise.resolve(null); }
}
function pathGetDeep(o, path) {
  var cur = o;
  path.split('.').forEach(function (k) { cur = (cur == null) ? cur : cur[k]; });
  return cur;
}
/* ---- grading. The corpus states its own check list with a ref, a tolerance
   and a basis per check (§13); the adapter maps the case's tool-neutral input
   onto this page's state, evaluates it once, and answers every check id.
   Check id grammar: `verdict`, `counts`, `save_allowed`,
   `hit:<rule>:<target>` (target `*` = any target), `metrics.<dotted path>`. ---- */
function deepEqual(a, b) {
  if (a === b) return true;
  if (a === null || b === null || typeof a !== 'object' || typeof b !== 'object') return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  var ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every(function (k) { return Object.prototype.hasOwnProperty.call(b, k) && deepEqual(a[k], b[k]); });
}
function relDiff(got, ref) {
  if (typeof got !== 'number' || typeof ref !== 'number' || !isFinite(got) || !isFinite(ref)) return null;
  if (ref === 0) return got === 0 ? 0 : Infinity;
  return Math.abs(got - ref) / Math.abs(ref);
}
/* answer one check id from an evaluation. `missing` true means the page does
   not produce the quantity at all, which fails the check rather than passing it. */
function answerCheck(id, E) {
  if (id === 'verdict') return { got: E.verdict };
  if (id === 'save_allowed') return { got: E.save_allowed };
  if (id === 'counts') {
    return { got: { blocker: E.counts.blocker, major: E.counts.major, minor: E.counts.minor, info: E.counts.info } };
  }
  if (id.indexOf('hit:') === 0) {
    /* 'hit:<rule>:<target>' names one target; 'hit:<rule>' with no second colon
       is a register-wide rule and asks whether the rule fires on any target.
       Without the guard slice(4, -1) dropped the last digit of the rule id and
       the check was answered against a rule that does not exist. */
    var cut = id.indexOf(':', 4);
    var rule = (cut === -1) ? id.slice(4) : id.slice(4, cut);
    var target = (cut === -1) ? '*' : id.slice(cut + 1);
    return { got: E.hits.some(function (h) { return h.rule === rule && (target === '*' || h.target === target); }) };
  }
  if (id.indexOf('metrics.') === 0) {
    var path = id.slice(8).split('.'), cur = E.metrics, i;
    for (i = 0; i < path.length; i++) {
      if (cur == null || typeof cur !== 'object' || !Object.prototype.hasOwnProperty.call(cur, path[i]))
        return { got: null, missing: true };
      cur = cur[path[i]];
    }
    return { got: cur };
  }
  return { got: null, missing: true };
}
function gradeCase(c) {
  var E = evaluatePublic(c.input || c.inputs || {});
  var checks = {}, pass = true, notes = [], nChecks = 0;
  var spec = c.checks || {};
  Object.keys(spec).forEach(function (id) {
    var want = spec[id], ref = want.ref, tol = (want.tol === undefined ? 'exact' : want.tol);
    var a = answerCheck(id, E), got = a.got, ok;
    if (a.missing) {
      ok = false;
      notes.push(id + ' is not produced by this page');
    } else if (tol && typeof tol === 'object' && typeof tol.rel === 'number') {
      var r = relDiff(got, ref);
      ok = (typeof got === 'number' && typeof ref === 'number') ? (r !== null && r <= tol.rel) : deepEqual(got, ref);
    } else if (tol && typeof tol === 'object' && typeof tol.abs === 'number') {
      ok = (typeof got === 'number' && typeof ref === 'number') ? Math.abs(got - ref) <= tol.abs : deepEqual(got, ref);
    } else {
      ok = deepEqual(got, ref);
    }
    checks[id] = { got: got, ref: ref, tol: tol, rel: relDiff(got, ref), ok: ok,
                   basis: want.basis || null, graded: true, ref_source: 'recomputed' };
    nChecks++;
    if (!ok) pass = false;
  });
  var out = { id: c.id, intent: c.intent || '', inputs: c.input || c.inputs || {},
              checks: checks, cmp: checks, checks_total: nChecks,
              checks_passed: Object.keys(checks).filter(function (k) { return checks[k].ok; }).length,
              pass: pass, ref_source: 'recomputed' };
  if (c.note) out.corpus_note = c.note;
  if (c.disputable) out.corpus_disputable = true;
  if (notes.length) out.note = uniq(notes).join(' ');
  return out;
}
function benchmarkArtifact() {
  return fetch(BENCH_REF_URL, { credentials: 'same-origin', cache: 'no-store' }).then(function (resp) {
    if (!resp.ok) throw new Error('Benchmark reference ' + BENCH_REF_URL + ' could not be loaded: HTTP ' + resp.status);
    return resp.text();
  }).then(function (text) {
    return sha256Hex(text).then(function (digest) {
      if (digest && digest !== BENCH_REF_SHA256)
        throw new Error('Benchmark reference ' + BENCH_REF_URL + ' refused: sha256 ' + digest +
                        ' does not match the expected ' + BENCH_REF_SHA256 + '.');
      var ref = JSON.parse(text);
      var cases = (ref.cases || []).map(gradeCase);
      var passed = cases.filter(function (c) { return c.pass; }).length;
      var seen = {}, checksTotal = 0, checksPassed = 0;
      cases.forEach(function (c) {
        checksTotal += c.checks_total; checksPassed += c.checks_passed;
        /* a hit check id is 'hit:<rule>:<target>' or 'hit:<rule>' for a register-wide rule;
           without the guard the absent second colon truncated the last digit of the rule id */
        Object.keys(c.checks).forEach(function (k) {
          if (k.indexOf('hit:') !== 0) return;
          var sep = k.indexOf(':', 4);
          seen[sep === -1 ? k.slice(4) : k.slice(4, sep)] = 1;
        });
      });
      return {
        schema: 'tools.petrov.re/benchmark-artifact/v1',
        tool: 'deviationregister', file: 'deviationregister.html',
        manifest_revision: MANIFEST_REV, build: MANIFEST_REV,
        run_at: new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'),
        reference_provenance: 'recomputed',
        provenance_note: 'The reference corpus was authored by another agent from the public specification and the cited ISO clauses without access to this code; this run recomputes every check from the shipping build.',
        reference: ref.reference || '', reference_citations: ref.reference_citations || [],
        reference_sha256: digest,
        tolerance: ref.tolerance || '',
        total: cases.length, cases_total: cases.length,
        passed: passed, failed: cases.length - passed, flagged: 0, diagnostics: 0,
        checks_total: checksTotal, checks_passed: checksPassed, checks_failed: checksTotal - checksPassed,
        independent_validation: false,
        cases: cases,
        not_benchmarked: ref.not_benchmarked || [],
        qa: {
          adapter: { status: 'pass', note: 'Each case is evaluated with window.__dgcEvaluate, the same function the interface computes from; every check id the corpus states is answered, with the corpus tolerance applied as written.' },
          rule_ids: { status: 'pass', note: 'Rule identifiers seen in the corpus: ' + Object.keys(seen).sort().join(', ') + '.' }
        }
      };
    });
  });
}

/* ---- boot ---- */
function degrade() {
  document.title = 'diagram-ui.js v1 is required';
  var host = document.getElementById('app') || document.body;
  var h = document.createElement('h1');
  h.textContent = loc(MANIFEST.title) || 'Deviation / clarification register';
  var p = document.createElement('p');
  p.textContent = 'The interactive interface could not load. The export, the calculation record and the limitations are still available from the bar at the bottom of the page.';
  host.appendChild(h);
  host.appendChild(p);
}
function installData() {
  if (!window.Diagram) return;
  Diagram.init({
    id: 'deviationregister', file: 'deviationregister.html',
    state: {
      serialize: function () { return state; },
      deserialize: function (o) {
        if (o && o.schema && String(o.schema) !== SCHEMA) {
          try { if (ui) ui.notify('Permalink refused: schema ' + o.schema + ' is not ' + SCHEMA, { kind: 'bad' }); } catch (e) {}
          return;
        }
        var p = normState(o || {});
        var coerced = coerceTake();
        Object.keys(state).forEach(function (k) { delete state[k]; });
        Object.assign(state, p);
        openRows = {};
        recompute();
        if (ui) { ui.sync(); ui.run(); }
        paintAll();
        /* a link written by another version can carry a token no part of this
           tool reads; the state that loaded is the clamped one, so the sentence
           names what changed instead of leaving the figures to disagree with
           the link. */
        if (coerced.length) { try { if (ui) ui.notify(coercedLine(coerced), { kind: 'warn' }); } catch (e) {} }
      }
    },
    record: dgcRecord,
    report: { profile: reportProfile },
    python: pythonSpec,
    handoff: { provides: [], accepts: [] }
  });
}
function boot() {
  try {
    var q = new URLSearchParams(location.search).get('lang');
    if (LANGS.indexOf(q) >= 0 && window.Diagram && Diagram.setDocumentLang) Diagram.setDocumentLang(q);
  } catch (e) {}
  recompute();
  if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1') { buildInterface(); buildRest(); }
  else degrade();
  installData();
  window.__dgcEvaluate = function (s) { return evaluatePublic(s); };
  window.__dgcBenchmark = benchmarkArtifact;
  window.__deviationregister = {
    state: state, evaluate: evaluate, preset: applyPreset, presets: PRESET_IDS,
    python: pythonSpec, record: dgcRecord
  };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
