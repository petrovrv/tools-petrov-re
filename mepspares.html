  "title": {"en":"Critical Spares & Recovery","uk":"Критичні запчастини та відновлення","de":"Kritische Ersatzteile & Wiederherstellung","nl":"Kritieke reserveonderdelen & herstel","fr":"Pièces critiques & reprise","es":"Repuestos críticos y recuperación","pl":"Krytyczne części zamienne i odtworzenie"},
  "summary": {"en":"Which spares to hold, share, contract or rent? Expected annual cost of no stock, k spares on site (Poisson demand over the lead time, service level), a pool shared between sites, a supplier agreement and temporary plant, with the recovery time of each option.","uk":"Які запчастини тримати, ділити, законтрактувати чи орендувати? Очікувані річні витрати без запасу, з k запчастинами на об’єкті (попит Пуассона за час постачання, рівень обслуговування), зі спільним пулом кількох об’єктів, договором з постачальником і тимчасовим обладнанням, а також час відновлення для кожного варіанта.","de":"Welche Ersatzteile lagern, teilen, vertraglich sichern oder mieten? Erwartete Jahreskosten ohne Lager, mit k Teilen vor Ort (Poisson-Bedarf über die Lieferzeit, Servicegrad), mit einem standortübergreifenden Pool, einem Liefervertrag und Mietanlagen, dazu die Wiederherstellungszeit jeder Option.","nl":"Welke reserveonderdelen aanhouden, delen, contracteren of huren? Verwachte jaarkosten zonder voorraad, met k stuks op locatie (Poisson-vraag over de levertijd, serviceniveau), met een pool voor meerdere locaties, een leveranciersovereenkomst en tijdelijke installaties, plus de hersteltijd van elke optie.","fr":"Quelles pièces stocker, mutualiser, contractualiser ou louer ? Coût annuel espéré sans stock, avec k pièces sur site (demande de Poisson sur le délai, taux de service), avec un pool partagé entre sites, un contrat fournisseur et une installation temporaire, et le délai de reprise de chaque option.","es":"¿Qué repuestos tener, compartir, contratar o alquilar? Coste anual esperado sin stock, con k repuestos en el sitio (demanda de Poisson durante el plazo, nivel de servicio), con un pool compartido entre sitios, un acuerdo con el proveedor y equipos temporales, más el tiempo de recuperación de cada opción.","pl":"Które części trzymać, współdzielić, zakontraktować lub wynająć? Oczekiwany roczny koszt bez zapasu, z k częściami na miejscu (popyt Poissona w czasie dostawy, poziom obsługi), ze wspólną pulą kilku obiektów, umową z dostawcą i urządzeniem tymczasowym oraz czas odtworzenia każdego wariantu."},
  "description": {"en":"For one critical part used by N identical units of a site the tool compares recovery options by expected annual cost. Stock on site is the base-stock (S−1, S) model: outstanding orders over the resupply lead time are Poisson, the fill rate is the chance a failure finds a spare on the shelf, and expected backorders give the mean wait (Little’s law). The same model prices one spare per unit kept separately and a pool shared by several sites with a transfer time. A supplier agreement buys a guaranteed delivery time for a fee; temporary plant restores the function after mobilisation and is hired only while the function is needed. Downtime is costed only in the season when the function is needed, and a tested, independent standby turns a wait into an outage only while the standby is also down. A cost-versus-stock chart and recovery-time bars against the tolerable downtime show the trade-off; obsolete parts are handed over to the last-time-buy tool.","uk":"Для однієї критичної запчастини, яку використовують N однакових агрегатів об’єкта, інструмент порівнює варіанти відновлення за очікуваними річними витратами. Запас на об’єкті — модель базового запасу (S−1, S): незакриті замовлення за час поповнення розподілені за Пуассоном, рівень заповнення — імовірність, що відмова застане запчастину на полиці, а очікувані дефіцити дають середнє очікування (закон Літтла). Та сама модель оцінює по одній запчастині на кожен агрегат окремо і пул кількох об’єктів із часом доставки. Договір з постачальником купує гарантований строк поставки за плату; тимчасове обладнання відновлює функцію після мобілізації й орендується лише доти, доки функція потрібна. Простій оцінюється лише в сезон, коли функція потрібна, а перевірений незалежний резерв перетворює очікування на простій лише тоді, коли резерв теж несправний. Графік «витрати–запас» і смуги часу відновлення порівняно з допустимим простоєм показують компроміс; застарілі запчастини передаються в інструмент останньої закупівлі.","de":"Für ein kritisches Teil, das N gleiche Geräte eines Standorts nutzen, vergleicht das Werkzeug Wiederherstellungsoptionen nach erwarteten Jahreskosten. Lager vor Ort ist das Grundbestandsmodell (S−1, S): offene Bestellungen über die Wiederbeschaffungszeit sind Poisson-verteilt, der Servicegrad ist die Chance, dass ein Ausfall ein Teil im Regal findet, und die erwarteten Fehlmengen ergeben die mittlere Wartezeit (Little-Gesetz). Dasselbe Modell bewertet ein separates Teil je Gerät und einen standortübergreifenden Pool mit Transportzeit. Ein Liefervertrag kauft eine garantierte Lieferzeit gegen Gebühr; eine Mietanlage stellt die Funktion nach der Mobilisierung wieder her und wird nur gemietet, solange die Funktion gebraucht wird. Stillstand wird nur in der Saison bewertet, in der die Funktion nötig ist, und eine geprüfte, unabhängige Reserve macht aus der Wartezeit nur dann einen Ausfall, wenn auch die Reserve ausfällt. Kosten-über-Lagerbestand-Diagramm und Wiederherstellungsbalken gegen die tolerierbare Ausfallzeit zeigen den Zielkonflikt; abgekündigte Teile gehen an das Last-Time-Buy-Werkzeug.","nl":"Voor één kritiek onderdeel dat N identieke units op een locatie gebruiken, vergelijkt de tool hersteloplossingen op verwachte jaarkosten. Voorraad op locatie is het basisvoorraadmodel (S−1, S): openstaande bestellingen over de herbevoorradingstijd zijn Poisson-verdeeld, de vulgraad is de kans dat een storing een onderdeel op de plank vindt, en de verwachte tekorten geven de gemiddelde wachttijd (wet van Little). Hetzelfde model prijst één apart onderdeel per unit en een pool voor meerdere locaties met transporttijd. Een leveranciersovereenkomst koopt een gegarandeerde levertijd tegen een vergoeding; een tijdelijke installatie herstelt de functie na mobilisatie en wordt alleen gehuurd zolang de functie nodig is. Stilstand telt alleen in het seizoen waarin de functie nodig is, en een geteste, onafhankelijke reserve maakt van wachten pas uitval als ook de reserve faalt. De grafiek kosten tegen voorraad en de hersteltijdbalken tegen de toelaatbare stilstand tonen de afweging; verouderde onderdelen gaan naar de last-time-buy-tool.","fr":"Pour une pièce critique utilisée par N unités identiques d’un site, l’outil compare les options de reprise par leur coût annuel espéré. Le stock sur site suit le modèle de stock de base (S−1, S) : les commandes en cours sur le délai de réapprovisionnement suivent une loi de Poisson, le taux de service est la chance qu’une panne trouve une pièce en rayon, et les ruptures espérées donnent l’attente moyenne (loi de Little). Le même modèle évalue une pièce par unité stockée séparément et un pool partagé par plusieurs sites avec un délai de transfert. Un contrat fournisseur achète un délai de livraison garanti contre une redevance ; une installation temporaire rétablit la fonction après mobilisation et n’est louée que tant que la fonction est nécessaire. L’arrêt n’est compté que pendant la saison où la fonction sert, et un secours testé et indépendant ne transforme une attente en arrêt que si le secours tombe aussi en panne. Le graphique coût–stock et les barres de délai de reprise face à l’arrêt tolérable montrent l’arbitrage ; les pièces obsolètes sont transmises à l’outil de dernier achat.","es":"Para un repuesto crítico que usan N unidades idénticas de un sitio, la herramienta compara opciones de recuperación por coste anual esperado. El stock en el sitio es el modelo de stock base (S−1, S): los pedidos pendientes durante el plazo de reposición siguen una Poisson, la tasa de servicio es la probabilidad de que un fallo encuentre un repuesto en la estantería y los pedidos pendientes esperados dan la espera media (ley de Little). El mismo modelo valora un repuesto por unidad guardado por separado y un pool compartido entre varios sitios con tiempo de traslado. Un acuerdo con el proveedor compra un plazo de entrega garantizado por una cuota; un equipo temporal restablece la función tras la movilización y solo se alquila mientras se necesita la función. La parada solo se valora en la temporada en que se necesita la función, y una reserva probada e independiente convierte la espera en parada solo si la reserva también falla. El gráfico coste–stock y las barras de tiempo de recuperación frente a la parada tolerable muestran el equilibrio; los repuestos obsoletos pasan a la herramienta de última compra.","pl":"Dla jednej krytycznej części używanej przez N identycznych urządzeń obiektu narzędzie porównuje warianty odtworzenia według oczekiwanego kosztu rocznego. Zapas na miejscu to model zapasu bazowego (S−1, S): otwarte zamówienia w czasie uzupełnienia mają rozkład Poissona, wskaźnik obsługi to szansa, że awaria zastanie część na półce, a oczekiwane braki dają średni czas oczekiwania (prawo Little’a). Ten sam model wycenia osobną część dla każdego urządzenia i pulę wspólną dla kilku obiektów z czasem transportu. Umowa z dostawcą kupuje gwarantowany czas dostawy za opłatą; urządzenie tymczasowe przywraca funkcję po mobilizacji i jest wynajmowane tylko wtedy, gdy funkcja jest potrzebna. Przestój liczy się tylko w sezonie, w którym funkcja jest potrzebna, a sprawdzona, niezależna rezerwa zamienia oczekiwanie w przestój tylko wtedy, gdy rezerwa też jest uszkodzona. Wykres koszt–zapas i paski czasu odtworzenia na tle dopuszczalnego przestoju pokazują kompromis; części wycofane trafiają do narzędzia ostatniego zakupu."},

  "limitations": {"en":"One part at a time, for identical units with independent failures at a constant rate (Poisson demand); repairable rotables, condemnation, ageing, common-cause failures and emergency purchases are not modelled. Holding cost is charged on the spares owned (rate × price × k), not on the average stock on hand. With credited redundancy the wait of a stock-out is represented by its conditional mean (two-point approximation). The season is one contiguous block per year with failures spread uniformly. Rental is hired only for the in-season part of the wait, with no minimum hire period. Parts consumed are the same for every option and are reported separately. Undiscounted annual expected values; preset numbers are learning assumptions, not manufacturer or statistical data. Planning aid, not a substitute for manufacturer instructions and national regulations.","uk":"Одна запчастина за раз, однакові агрегати з незалежними відмовами з постійною інтенсивністю (попит Пуассона); ремонтопридатні вузли, списання, старіння, відмови зі спільною причиною та термінові закупівлі не моделюються. Витрати на зберігання нараховуються на запчастини у власності (ставка × ціна × k), а не на середній фактичний залишок. За зарахованого резерву очікування при дефіциті представлене умовним середнім (двоточкове наближення). Сезон — один безперервний період на рік, відмови рівномірні. Оренда — лише на сезонну частину очікування, без мінімального строку. Спожиті запчастини однакові для всіх варіантів і показані окремо. Недисконтовані річні очікувані значення; числа прикладів — навчальні припущення, а не дані виробника чи статистика. Засіб планування, не заміна інструкцій виробника та національних норм.","de":"Ein Teil je Rechnung, für gleiche Geräte mit unabhängigen Ausfällen konstanter Rate (Poisson-Bedarf); reparierbare Tauschteile, Ausmusterung, Alterung, Ausfälle gemeinsamer Ursache und Eilkäufe sind nicht modelliert. Lagerkosten werden auf die besessenen Teile berechnet (Satz × Preis × k), nicht auf den mittleren Bestand. Mit angerechneter Redundanz wird die Wartezeit eines Fehlbestands durch ihren bedingten Mittelwert dargestellt (Zwei-Punkt-Näherung). Die Saison ist ein zusammenhängender Block pro Jahr, Ausfälle gleichverteilt. Mietanlagen werden nur für den Saisonanteil der Wartezeit gemietet, ohne Mindestmietdauer. Verbrauchte Teile sind für alle Optionen gleich und werden getrennt ausgewiesen. Nicht abgezinste jährliche Erwartungswerte; Beispielwerte sind Lernannahmen, keine Hersteller- oder Statistikdaten. Planungshilfe, kein Ersatz für Herstellervorgaben und nationale Vorschriften.","nl":"Eén onderdeel per keer, voor identieke units met onafhankelijke storingen met constante intensiteit (Poisson-vraag); herstelbare wisselonderdelen, afkeur, veroudering, storingen met gemeenschappelijke oorzaak en spoedaankopen zijn niet gemodelleerd. Voorraadkosten gelden voor de onderdelen in bezit (percentage × prijs × k), niet voor de gemiddelde voorraad. Met erkende redundantie wordt de wachttijd bij een tekort voorgesteld door haar voorwaardelijk gemiddelde (tweepuntsbenadering). Het seizoen is één aaneengesloten blok per jaar, storingen gelijkmatig verdeeld. Huur geldt alleen voor het seizoensdeel van de wachttijd, zonder minimale huurperiode. Verbruikte onderdelen zijn voor alle opties gelijk en apart vermeld. Niet-verdisconteerde jaarlijkse verwachtingswaarden; voorbeeldwaarden zijn leeraannames, geen fabrikant- of statistische gegevens. Planningshulpmiddel, geen vervanging van fabrieksvoorschriften en nationale regelgeving.","fr":"Une pièce à la fois, pour des unités identiques aux défaillances indépendantes à taux constant (demande de Poisson) ; pièces réparables, mise au rebut, vieillissement, défaillances de cause commune et achats en urgence ne sont pas modélisés. Le coût de possession porte sur les pièces détenues (taux × prix × k), non sur le stock moyen. Avec une redondance retenue, l’attente d’une rupture est représentée par sa moyenne conditionnelle (approximation à deux points). La saison est un bloc continu par an, pannes uniformément réparties. La location ne couvre que la partie de l’attente en saison, sans durée minimale. Les pièces consommées sont identiques pour toutes les options et indiquées à part. Valeurs annuelles espérées non actualisées ; les valeurs des exemples sont des hypothèses pédagogiques, pas des données de constructeur ni des statistiques. Aide à la planification, ne remplace ni les instructions du constructeur ni la réglementation nationale.","es":"Un repuesto cada vez, para unidades idénticas con fallos independientes a tasa constante (demanda de Poisson); no se modelan repuestos reparables, desecho, envejecimiento, fallos de causa común ni compras urgentes. El coste de tenencia se aplica a los repuestos en propiedad (tasa × precio × k), no al stock medio disponible. Con redundancia acreditada, la espera de una rotura se representa por su media condicionada (aproximación de dos puntos). La temporada es un bloque continuo al año y los fallos se reparten uniformemente. El alquiler cubre solo la parte de la espera en temporada, sin periodo mínimo. Los repuestos consumidos son iguales en todas las opciones y se informan aparte. Valores anuales esperados sin descontar; los valores de los ejemplos son supuestos didácticos, no datos de fabricante ni estadísticas. Ayuda a la planificación, no sustituye las instrucciones del fabricante ni la normativa nacional.","pl":"Jedna część naraz, dla identycznych urządzeń z niezależnymi uszkodzeniami o stałej intensywności (popyt Poissona); części naprawialne, kasacja, starzenie, uszkodzenia o wspólnej przyczynie i zakupy awaryjne nie są modelowane. Koszt utrzymania zapasu dotyczy posiadanych części (stopa × cena × k), a nie średniego stanu. Przy uznanej redundancji oczekiwanie przy braku reprezentuje jego warunkowa średnia (przybliżenie dwupunktowe). Sezon to jeden ciągły okres w roku, uszkodzenia rozłożone równomiernie. Najem obejmuje tylko sezonową część oczekiwania, bez minimalnego okresu. Zużyte części są takie same dla wszystkich wariantów i podane osobno. Niezdyskontowane roczne wartości oczekiwane; liczby w przykładach to założenia dydaktyczne, nie dane producenta ani statystyka. Pomoc w planowaniu, nie zastępuje instrukcji producenta ani przepisów krajowych."},

  "validation": {"basis":{"en":"Base-stock (S−1, S) model for critical spares with Poisson demand over the resupply lead time (Palm’s theorem; Sherbrooke, Optimal Inventory Modeling of Systems, 2004): fill rate, expected backorders and the mean wait by Little’s law; exposure of a credited standby as the integral of its failure probability over the wait; seasonal need as one block per year. Evidence: an independent Python reference (bench-src/ref/gen_mepspares.py) that computes the Poisson terms from lgamma, the backorders by the tail sum of their definition, the redundancy outage by Simpson integration and the season overlap by numerical integration over the phase, with a Monte Carlo of the base-stock system, compared with the page’s engine over 74 cases.","uk":"Модель базового запасу (S−1, S) для критичних запчастин із попитом Пуассона за час поповнення (теорема Пальма; Sherbrooke, Optimal Inventory Modeling of Systems, 2004): рівень заповнення, очікуваний дефіцит і середнє очікування за законом Літтла; експозиція зарахованого резерву як інтеграл імовірності його відмови за час очікування; сезонна потреба як один період на рік. Докази: незалежний еталон на Python (bench-src/ref/gen_mepspares.py), що рахує члени Пуассона через lgamma, дефіцит — прямою сумою хвоста за означенням, простій при резерві — інтегруванням Сімпсона, сезонне перекриття — чисельним інтегруванням за фазою, з Монте-Карло системи базового запасу, порівняний з рушієм сторінки на 74 випадках.","de":"Grundbestandsmodell (S−1, S) für kritische Ersatzteile mit Poisson-Bedarf über die Wiederbeschaffungszeit (Satz von Palm; Sherbrooke, Optimal Inventory Modeling of Systems, 2004): Servicegrad, erwartete Fehlmengen und mittlere Wartezeit nach dem Little-Gesetz; Exposition einer angerechneten Reserve als Integral ihrer Ausfallwahrscheinlichkeit über die Wartezeit; saisonaler Bedarf als ein Block pro Jahr. Nachweis: eine unabhängige Python-Referenz (bench-src/ref/gen_mepspares.py), die Poisson-Terme über lgamma, Fehlmengen als Endsumme ihrer Definition, den Ausfall bei Redundanz per Simpson-Integration und die Saisonüberlappung numerisch über die Phase berechnet, mit Monte-Carlo des Grundbestandssystems, in 74 Fällen mit der Engine der Seite verglichen.","nl":"Basisvoorraadmodel (S−1, S) voor kritieke onderdelen met Poisson-vraag over de herbevoorradingstijd (stelling van Palm; Sherbrooke, Optimal Inventory Modeling of Systems, 2004): vulgraad, verwachte tekorten en de gemiddelde wachttijd volgens de wet van Little; blootstelling van een erkende reserve als integraal van haar faalkans over het wachten; seizoensbehoefte als één blok per jaar. Bewijs: een onafhankelijke Python-referentie (bench-src/ref/gen_mepspares.py) die de Poisson-termen via lgamma, de tekorten als staartsom van hun definitie, de uitval bij redundantie met Simpson-integratie en de seizoensoverlap numeriek over de fase berekent, met Monte Carlo van het basisvoorraadsysteem, in 74 gevallen vergeleken met de engine van de pagina.","fr":"Modèle de stock de base (S−1, S) pour pièces critiques avec demande de Poisson sur le délai de réapprovisionnement (théorème de Palm ; Sherbrooke, Optimal Inventory Modeling of Systems, 2004) : taux de service, ruptures espérées et attente moyenne par la loi de Little ; exposition d’un secours retenu comme intégrale de sa probabilité de panne sur l’attente ; besoin saisonnier comme un bloc par an. Preuves : une référence Python indépendante (bench-src/ref/gen_mepspares.py) qui calcule les termes de Poisson par lgamma, les ruptures par la somme de queue de leur définition, l’arrêt avec redondance par intégration de Simpson et le recouvrement saisonnier par intégration numérique sur la phase, avec un Monte-Carlo du système de stock de base, comparée au moteur de la page sur 74 cas.","es":"Modelo de stock base (S−1, S) para repuestos críticos con demanda de Poisson durante el plazo de reposición (teorema de Palm; Sherbrooke, Optimal Inventory Modeling of Systems, 2004): tasa de servicio, pedidos pendientes esperados y espera media por la ley de Little; exposición de una reserva acreditada como integral de su probabilidad de fallo durante la espera; necesidad estacional como un bloque al año. Evidencia: una referencia Python independiente (bench-src/ref/gen_mepspares.py) que calcula los términos de Poisson con lgamma, los pendientes por la suma de cola de su definición, la parada con redundancia por integración de Simpson y el solape estacional por integración numérica sobre la fase, con un Monte Carlo del sistema de stock base, comparada con el motor de la página en 74 casos.","pl":"Model zapasu bazowego (S−1, S) dla części krytycznych z popytem Poissona w czasie uzupełnienia (twierdzenie Palma; Sherbrooke, Optimal Inventory Modeling of Systems, 2004): wskaźnik obsługi, oczekiwane braki i średni czas oczekiwania z prawa Little’a; ekspozycja uznanej rezerwy jako całka prawdopodobieństwa jej uszkodzenia w czasie oczekiwania; potrzeba sezonowa jako jeden okres w roku. Dowód: niezależna referencja w Pythonie (bench-src/ref/gen_mepspares.py), licząca wyrazy Poissona przez lgamma, braki jako sumę ogona z definicji, przestój przy redundancji całkowaniem Simpsona i nakładanie sezonu całkowaniem numerycznym po fazie, z Monte Carlo systemu zapasu bazowego, porównana z silnikiem strony w 74 przypadkach."},"independent_validation":false,"benchmarks":[{"id":"mepspares-ref-2026-11-05","reference":{"en":"bench-src/ref/gen_mepspares.py: Poisson terms from lgamma, expected backorders by tail sums, Little’s-law wait, redundancy outage by Simpson integration, season overlap by phase integration, Monte Carlo of the base-stock system; 6 presets, 64 grid and 4 stress cases.","uk":"bench-src/ref/gen_mepspares.py: члени Пуассона через lgamma, очікуваний дефіцит сумами хвоста, очікування за законом Літтла, простій при резерві інтегруванням Сімпсона, сезонне перекриття інтегруванням за фазою, Монте-Карло системи базового запасу; 6 прикладів, 64 випадки сітки та 4 стрес-випадки.","de":"bench-src/ref/gen_mepspares.py: Poisson-Terme über lgamma, erwartete Fehlmengen als Endsummen, Wartezeit nach Little, Ausfall bei Redundanz per Simpson-Integration, Saisonüberlappung per Phasenintegration, Monte-Carlo des Grundbestandssystems; 6 Beispiele, 64 Gitter- und 4 Stressfälle.","nl":"bench-src/ref/gen_mepspares.py: Poisson-termen via lgamma, verwachte tekorten als staartsommen, wachttijd volgens Little, uitval bij redundantie met Simpson-integratie, seizoensoverlap via fase-integratie, Monte Carlo van het basisvoorraadsysteem; 6 voorbeelden, 64 raster- en 4 stressgevallen.","fr":"bench-src/ref/gen_mepspares.py : termes de Poisson par lgamma, ruptures espérées par sommes de queue, attente par la loi de Little, arrêt avec redondance par intégration de Simpson, recouvrement saisonnier par intégration sur la phase, Monte-Carlo du système de stock de base ; 6 exemples, 64 cas de grille et 4 cas de stress.","es":"bench-src/ref/gen_mepspares.py: términos de Poisson con lgamma, pendientes esperados por sumas de cola, espera por la ley de Little, parada con redundancia por integración de Simpson, solape estacional por integración sobre la fase, Monte Carlo del sistema de stock base; 6 ejemplos, 64 casos de rejilla y 4 casos de estrés.","pl":"bench-src/ref/gen_mepspares.py: wyrazy Poissona przez lgamma, oczekiwane braki sumami ogona, oczekiwanie z prawa Little’a, przestój przy redundancji całkowaniem Simpsona, nakładanie sezonu całkowaniem po fazie, Monte Carlo systemu zapasu bazowego; 6 przykładów, 64 przypadki siatki i 4 przypadki skrajne."},"citations":["Sherbrooke C. C. (2004) Optimal Inventory Modeling of Systems: Multi-Echelon Techniques, 2nd ed., Kluwer, ch. 2","Palm C. (1938) Analysis of the Erlang traffic formulae for busy-signal arrangements, Ericsson Technics 4","Little J. D. C. (1961) A proof for the queuing formula L = λW, Operations Research 9(3), 383–387","Moubray J. (1997) Reliability-centred Maintenance, 2nd ed., Butterworth-Heinemann (hidden functions, exposure of a failed protective device)"],"cases": 74, "passed": 74,"tolerance":"option, stock levels and feasibility exact; totals within max(0.5 EUR, 0.02 %); downtime hours within max(1e-4 h, 0.02 %); recovery time 1e-6 h; fill rate 1e-9","run_at": "2026-11-06T23:30:31Z","artifact":"benchmarks/mepspares.json"}]},

  var OPT = {

    pool: T('Pool shared between sites', 'Спільний пул кількох об’єктів', 'Standortübergreifender Pool', 'Pool voor meerdere locaties', 'Pool partagé entre sites', 'Pool compartido entre sitios', 'Pula wspólna kilku obiektów'),

    rental: T('Rental / temporary plant', 'Оренда / тимчасове обладнання', 'Miete / Mietanlage', 'Huur / tijdelijke installatie', 'Location / installation temporaire', 'Alquiler / equipo temporal', 'Najem / urządzenie tymczasowe')

  function optName(r) {
    if (r.id === 'stock') return TF(T('{0}: {1} spare(s)', '{0}: {1} шт.', '{0}: {1} Teil(e)', '{0}: {1} stuk(s)', '{0} : {1} pièce(s)', '{0}: {1} repuesto(s)', '{0}: {1} szt.'), [OPT.stock, r.k]);

    return OPT[r.id];

  var REASONS = {

    rental_slower: T('temporary plant arrives later than the part itself', 'тимчасове обладнання прибуває пізніше за саму запчастину', 'die Mietanlage kommt später als das Teil selbst', 'de tijdelijke installatie komt later dan het onderdeel zelf', 'l’installation temporaire arrive après la pièce elle-même', 'el equipo temporal llega después que el propio repuesto', 'urządzenie tymczasowe dotrze później niż sama część'),
    no_supply_obsolete: T('part is obsolete — no supplier can guarantee delivery', 'запчастина застаріла — жоден постачальник не гарантує поставку', 'Teil abgekündigt — kein Lieferant garantiert die Lieferung', 'onderdeel verouderd — geen leverancier garandeert levering', 'pièce obsolète — aucun fournisseur ne garantit la livraison', 'repuesto obsoleto: ningún proveedor garantiza la entrega', 'część wycofana — żaden dostawca nie zagwarantuje dostawy'),
    last_time_buy: T('buying now is a last-time buy — size it in the LTB tool', 'купівля зараз — це остання закупівля; розрахуйте її в інструменті LTB', 'Kauf jetzt ist ein Last-Time-Buy — im LTB-Werkzeug bemessen', 'nu kopen is een last-time-buy — bepaal de hoeveelheid in de LTB-tool', 'acheter maintenant est un dernier achat — le dimensionner dans l’outil LTB', 'comprar ahora es una última compra: dimensiónela en la herramienta LTB', 'zakup teraz to ostatni zakup — policz go w narzędziu LTB')
  };

  var S = {
    best: T('best', 'найкращий', 'beste', 'beste', 'meilleure', 'mejor', 'najlepszy'),
    auto: T('auto', 'авто', 'auto', 'auto', 'auto', 'auto', 'auto'),
    unpriced: T('not priced', 'не оцінено', 'nicht bewertet', 'niet geprijsd', 'non chiffré', 'sin valorar', 'nie wyceniono'),
    h: T('h', 'год', 'h', 'u', 'h', 'h', 'h'),
    d: T('d', 'доб', 'd', 'd', 'j', 'd', 'd'),
    w: T('wk', 'тиж', 'Wo', 'wk', 'sem', 'sem', 'tyg')
  };
  function dur(h) {
    if (h == null || !isFinite(h)) return '—';
    var dec = function (v) { return v < 10 && Math.abs(v - Math.round(v)) > 0.05 ? 1 : 0; };
    if (h < 48) return F(h, h < 1 ? 2 : dec(h)) + ' ' + L(S.h);
    if (h < 24 * 21) return F(h / 24, dec(h / 24)) + ' ' + L(S.d);
    return F(h / 168, 0) + ' ' + L(S.w);
  }

  /* --- presets: label, group, aha note ------------------------------------------------------- */
  var G_STOCK = T('Stock or not', 'Тримати запас чи ні', 'Lagern oder nicht', 'Wel of geen voorraad', 'Stocker ou non', 'Stock o no', 'Zapas czy nie');
  var G_ALT = T('Alternatives to stock', 'Альтернативи запасу', 'Alternativen zum Lager', 'Alternatieven voor voorraad', 'Alternatives au stock', 'Alternativas al stock', 'Alternatywy dla zapasu');
  var PRESET_TEXT = {
    chiller_board: { group: G_STOCK,
      label: T('Class-A chiller: a 450 EUR board with a 16-week lead time', 'Чилер класу A: плата за 450 EUR із терміном поставки 16 тижнів', 'Kaltwassersatz Klasse A: eine 450-EUR-Platine mit 16 Wochen Lieferzeit', 'Koelmachine klasse A: een print van 450 EUR met 16 weken levertijd', 'Groupe froid classe A : une carte à 450 EUR livrée en 16 semaines', 'Enfriadora clase A: una placa de 450 EUR con 16 semanas de plazo', 'Agregat klasy A: płytka za 450 EUR z czasem dostawy 16 tygodni'),
      note: T('Aha: the board is cheap, the wait is not. Sixteen weeks without a single-string chiller at 2 000 EUR/h make “no stock” cost about half a million euros a year in expectation; two boards on the shelf cost about 225 EUR a year to hold. Price and criticality class say little — the lead time decides.',
              'Ага: плата дешева, очікування — ні. Шістнадцять тижнів без єдиного чилера за 2 000 EUR/год дають «без запасу» близько пів мільйона євро очікуваних витрат на рік; дві плати на полиці коштують близько 225 EUR на рік. Ціна й клас критичності кажуть мало — вирішує термін поставки.',

              'Déclic : la carte est bon marché, l’attente non. Seize semaines sans l’unique groupe froid à 2 000 EUR/h coûtent en espérance environ un demi-million d’euros par an sans stock ; deux cartes en rayon coûtent environ 225 EUR par an. Le prix et la classe de criticité disent peu — c’est le délai qui décide.',
              'Clave: la placa es barata, la espera no. Dieciséis semanas sin la única enfriadora a 2 000 EUR/h hacen que «sin stock» cueste en esperanza cerca de medio millón de euros al año; dos placas en la estantería cuestan unos 225 EUR al año. El precio y la clase de criticidad dicen poco: decide el plazo.',
              'Aha: płytka jest tania, czekanie — nie. Szesnaście tygodni bez jedynego agregatu przy 2 000 EUR/h sprawia, że „bez zapasu” kosztuje oczekiwanie około pół miliona euro rocznie; dwie płytki na półce kosztują około 225 EUR rocznie. Cena i klasa krytyczności mówią niewiele — decyduje czas dostawy.') },
    tx_2n: { group: G_STOCK,
      label: T('2N transformers: a 90 000 EUR spare transformer', 'Трансформатори 2N: резервний трансформатор за 90 000 EUR', '2N-Transformatoren: ein Reservetransformator für 90 000 EUR', '2N-transformatoren: een reservetransformator van 90 000 EUR', 'Transformateurs en 2N : un transformateur de réserve à 90 000 EUR', 'Transformadores 2N: un transformador de reserva de 90 000 EUR', 'Transformatory 2N: zapasowy transformator za 90 000 EUR'),
      note: T('Aha: with a tested, independent 2N pair a transformer failure is an outage only if the second one also fails during the nine-month wait — under 1 % per event. Doing nothing costs about 3 000 EUR a year in expectation; holding the spare costs 13 500 EUR. Untick “redundancy credited” and the spare becomes clearly worth it — redundancy, not the price tag, decides. A pool with three other sites is the cheap middle way.',
              'Ага: за перевіреної незалежної пари 2N відмова трансформатора стає простоєм лише тоді, коли другий теж відмовить за дев’ять місяців очікування, — менше 1 % на подію. Нічого не робити — близько 3 000 EUR на рік очікуваних витрат; тримати резерв — 13 500 EUR. Зніміть «резерв зараховано» — і резервний трансформатор явно окупається: вирішує резервування, а не ціна. Пул із трьома іншими об’єктами — дешевий компроміс.',
              'Aha: Bei einem geprüften, unabhängigen 2N-Paar wird ein Trafoausfall nur dann zum Stillstand, wenn auch der zweite während der neun Monate Wartezeit ausfällt — unter 1 % je Ereignis. Nichtstun kostet im Erwartungswert rund 3 000 EUR im Jahr, die Reserve zu halten 13 500 EUR. Ohne angerechnete Redundanz lohnt sich die Reserve klar — die Redundanz entscheidet, nicht der Preis. Ein Pool mit drei weiteren Standorten ist der günstige Mittelweg.',
              'Aha: bij een geteste, onafhankelijke 2N-set wordt een trafostoring pas uitval als de tweede ook faalt tijdens de negen maanden wachten — minder dan 1 % per gebeurtenis. Niets doen kost in verwachting zo’n 3 000 EUR per jaar, de reserve aanhouden 13 500 EUR. Zonder erkende redundantie loont de reserve duidelijk — redundantie beslist, niet het prijskaartje. Een pool met drie andere locaties is de goedkope middenweg.',
              'Déclic : avec une paire 2N testée et indépendante, une panne de transformateur n’est un arrêt que si le second lâche aussi pendant les neuf mois d’attente — moins de 1 % par événement. Ne rien faire coûte en espérance environ 3 000 EUR par an ; détenir la réserve, 13 500 EUR. Décochez « redondance retenue » et la réserve devient nettement rentable — c’est la redondance qui décide, pas le prix. Un pool avec trois autres sites est la voie médiane bon marché.',
              'Clave: con un par 2N probado e independiente, el fallo de un transformador solo es parada si el segundo también falla durante los nueve meses de espera: menos del 1 % por suceso. No hacer nada cuesta en esperanza unos 3 000 EUR al año; tener la reserva, 13 500 EUR. Desmarque «redundancia acreditada» y la reserva compensa con claridad: decide la redundancia, no el precio. Un pool con otros tres sitios es la vía intermedia barata.',
              'Aha: przy sprawdzonej, niezależnej parze 2N awaria transformatora jest przestojem tylko wtedy, gdy drugi też ulegnie awarii w ciągu dziewięciu miesięcy oczekiwania — poniżej 1 % na zdarzenie. Nic nie robić kosztuje w oczekiwaniu około 3 000 EUR rocznie; trzymać rezerwę — 13 500 EUR. Odznacz „redundancja uznana”, a rezerwa wyraźnie się opłaci — decyduje redundancja, nie cena. Pula z trzema innymi obiektami to tani kompromis.') },
    boiler_rental: { group: G_ALT,
      label: T('School boiler: rental beats a spare outside the heating season', 'Шкільний котел: оренда краща за запас поза опалювальним сезоном', 'Schulkessel: Miete schlägt Reserve außerhalb der Heizperiode', 'Schoolketel: huur wint van reserve buiten het stookseizoen', 'Chaudière d’école : la location bat la réserve hors saison de chauffe', 'Caldera escolar: el alquiler gana a la reserva fuera de temporada', 'Kocioł szkolny: najem wygrywa z zapasem poza sezonem grzewczym'),

  };
  var DEFAULT_PRESET = 'chiller_board';

  function presetById(id) {
    if (!SP) return null;
    for (var i = 0; i < SP.PRESETS.length; i++) if (SP.PRESETS[i].id === id) return SP.PRESETS[i];
    return null;
  }

  /* page state (flat) <-> engine case */
  function stateFromCase(c, presetId) {
    var n = SP.normalise(c), o = n.options;
    return {
      preset: presetId || null, asset_id: n.asset_id || '', part: n.part, asset_class: n.asset_class || '',
      units: n.units, rate_lo: n.rate_y[0], rate_mid: n.rate_y[1], rate_hi: n.rate_y[2],
      part_cost: n.part_cost_eur, lead_days: n.lead_time_days, fit_h: n.fit_h, obsolete: n.obsolete,
      priced: n.downtime_cost_eur_h != null, downtime: n.downtime_cost_eur_h != null ? n.downtime_cost_eur_h : 0,
      tol_known: n.tolerable_downtime_h != null, tolerable: n.tolerable_downtime_h != null ? n.tolerable_downtime_h : 0,
      season: n.season_share, red_credited: n.redundancy.credited, partner_rate: n.redundancy.partner_rate_y,
      holding_rate: n.holding_rate,
      stock_on: o.stock.enabled, stock_k: o.stock.k === 'auto' ? 0 : o.stock.k, store_h: o.stock.store_h,
      service_target: o.stock.service_target, enforce_service: o.stock.enforce_service,
      ded_on: o.dedicated.enabled, ded_k: o.dedicated.k_per_unit, ded_store_h: o.dedicated.store_h,
      pool_on: o.pool.enabled, pool_sites: o.pool.sites, pool_k: o.pool.k, pool_transfer_h: o.pool.transfer_h,
      agr_on: o.agreement.enabled, agr_fee: o.agreement.fee_eur_y, agr_delivery_h: o.agreement.delivery_h, agr_p: o.agreement.p_on_time,
      rent_on: o.rental.enabled, rent_mob_h: o.rental.mobilise_h, rent_mob_eur: o.rental.mobilise_eur, rent_day_eur: o.rental.day_eur,
      rent_cover: o.rental.cover, rent_retainer: o.rental.retainer_eur_y
    };
  }
  function caseOf(s) {
    return {
      part: s.part, asset_id: s.asset_id || null, asset_class: s.asset_class || null,
      units: s.units, rate_y: [s.rate_lo, s.rate_mid, s.rate_hi], part_cost_eur: s.part_cost, lead_time_days: s.lead_days, fit_h: s.fit_h,
      obsolete: !!s.obsolete, downtime_cost_eur_h: s.priced ? s.downtime : null, tolerable_downtime_h: s.tol_known ? s.tolerable : null,
      season_share: s.season, redundancy: { credited: !!s.red_credited, partner_rate_y: s.partner_rate }, holding_rate: s.holding_rate,
      options: {
        stock: { enabled: !!s.stock_on, k: s.stock_k > 0 ? s.stock_k : 'auto', store_h: s.store_h, service_target: s.service_target, enforce_service: !!s.enforce_service },
        dedicated: { enabled: !!s.ded_on, k_per_unit: s.ded_k, store_h: s.ded_store_h },
        pool: { enabled: !!s.pool_on, sites: s.pool_sites, k: s.pool_k, transfer_h: s.pool_transfer_h },
        agreement: { enabled: !!s.agr_on, fee_eur_y: s.agr_fee, delivery_h: s.agr_delivery_h, p_on_time: s.agr_p },
        rental: { enabled: !!s.rent_on, mobilise_h: s.rent_mob_h, mobilise_eur: s.rent_mob_eur, day_eur: s.rent_day_eur, cover: s.rent_cover, retainer_eur_y: s.rent_retainer }
      }
    };
  }

  var DEFAULTS = {};
  var state = {};
  function initModel() {
    SP = window.MEPSpares || null;
    DEFAULTS = SP ? stateFromCase(presetById(DEFAULT_PRESET).case, DEFAULT_PRESET) : {};
    state = JSON.parse(JSON.stringify(DEFAULTS));
  }
  var last = null;     /* engine result */
  var lastScreen = null;
  var useCrit = false; /* criticality results are applied only after the user's "Use" in the register bar */

  function solve(s) {
    if (!SP) return null;
    return SP.evaluate(caseOf(s));
  }

  /* ======================================================== 2. the interface */
  var stageCost = null, stageRec = null, ui = null, ltbLink = null;

  function adoptStages(app) {
    stageCost = app.stages[0] || null; stageRec = app.stages[1] || null;
    if (stageCost) stageCost.legend({ items: [
      { label: T('Holding cost', 'Зберігання', 'Lagerkosten', 'Voorraadkosten', 'Coût de possession', 'Coste de tenencia', 'Koszt utrzymania'), series: 1 },
      { label: T('Expected downtime cost', 'Очікувані втрати від простою', 'Erwartete Stillstandskosten', 'Verwachte stilstandskosten', 'Coût d’arrêt espéré', 'Coste esperado de parada', 'Oczekiwany koszt przestoju'), series: 0 },
      { label: T('Other options (mid)', 'Інші варіанти (сер.)', 'Andere Optionen (Mitte)', 'Andere opties (midden)', 'Autres options (médian)', 'Otras opciones (medio)', 'Inne warianty (śr.)'), series: 2, dash: true }
    ] });
    if (stageRec) stageRec.legend({ items: [
      { label: T('Mean time to restore the function', 'Середній час відновлення функції', 'Mittlere Zeit bis zur Wiederherstellung', 'Gemiddelde tijd tot herstel', 'Délai moyen de rétablissement', 'Tiempo medio hasta restablecer', 'Średni czas przywrócenia funkcji'), series: 0 },
      { label: T('If the cover fails (long route)', 'Якщо захист не спрацює (довгий шлях)', 'Wenn die Absicherung versagt (langer Weg)', 'Als de dekking faalt (lange weg)', 'Si la parade échoue (voie longue)', 'Si la cobertura falla (vía larga)', 'Gdy zabezpieczenie zawiedzie (długa droga)'), series: 3 },
      { label: T('Tolerable downtime', 'Допустимий простій', 'Tolerierbare Ausfallzeit', 'Toelaatbare stilstand', 'Arrêt tolérable', 'Parada tolerable', 'Dopuszczalny przestój'), series: 1 }
    ] });
  }

  function degrade() {
    document.title = 'diagram-ui.js v1 is required';
    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1'); h.textContent = 'Critical Spares & Recovery';
    var p = document.createElement('p');
    p.textContent = SP ? 'The interactive interface could not load. The export, the calculation record and the limitations are still available from the bar at the bottom of the page.'
                       : 'mep-spares.js could not load; nothing can be computed.';
    host.appendChild(h); host.appendChild(p);
    last = solve(state);
  }

  function boot() {
    initModel();
    if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1' && SP) buildInterface();
    else degrade();
    installData();
  }

  /* --- register (MEPCore) ------------------------------------------------------------------ */
  var bar = null; /* MEPCore register bar handle: the bar owns the in-memory register (QA-4) */
  function regDoc() {
    var core = CORE();
    if (!core || !core.register) return null;
    if (bar && typeof bar.getDoc === 'function') { try { return bar.getDoc(); } catch (e) { /* fall through */ } }
    try { return core.register.load(); } catch (e) { return null; }
  }
  function regAssets() { var d = regDoc(); return d && Array.isArray(d.assets) ? d.assets : []; }
  function useAsset() {
    var core = CORE(), doc = regDoc(); if (!core || !doc) return false;
    var a = regAssets().filter(function (x) { return x.id === state.asset_id; })[0];
    if (!a) return false;
    var r = SP.caseFromAsset(a, doc, core, caseOf(state), { useCrit: useCrit });
    var keep = { part: state.part };
    Object.assign(state, stateFromCase(r.case, null), keep);
    state.asset_id = a.id;
    return true;
  }
  /* modules.mepspares (QA-9, PLAN §1.5): results only under register asset ids —
     results[assetId] = latest part result + parts{partKey: result}; preset / manual cases go to state.cases[key].
     Older keys that are not asset ids ("case:*", "<asset>:<part>") are moved on the next write. */
  function partKey() { return (state.part || state.preset || 'part').replace(/[^A-Za-z0-9_.-]+/g, '_').slice(0, 60); }
  function writeToRegister() {
    var core = CORE();
    if (!core || !core.register || !last) return false;
    var doc = regDoc() || core.register.empty();
    var ids = {}; (Array.isArray(doc.assets) ? doc.assets : []).forEach(function (a) { if (a && a.id != null) ids[a.id] = true; });
    var prev = (doc.modules && doc.modules.mepspares) || {};
    var pstate = Object.assign({}, prev.state || {});
    var cases = Object.assign({}, pstate.cases || {});
    var results = {};
    Object.keys(prev.results || {}).forEach(function (k) {
      var v = prev.results[k];
      if (ids[k]) { results[k] = v; return; }
      var m = /^([^:]+):(.+)$/.exec(k);
      if (m && m[1] !== 'case' && ids[m[1]]) {               /* old "<asset>:<part>" key */
        var r0 = results[m[1]] || { parts: {} }; r0.parts = Object.assign({}, r0.parts || {}); r0.parts[m[2]] = v;
        results[m[1]] = Object.assign({}, v, { parts: r0.parts });
      } else cases[k.replace(/^case:/, '')] = v;
    });
    var res = SP.toModuleResult(last), pk = partKey(), key;
    if (state.asset_id && ids[state.asset_id]) {
      var cur = results[state.asset_id] || {}, parts = Object.assign({}, cur.parts || {});
      parts[pk] = res;
      results[state.asset_id] = Object.assign({}, res, { part_key: pk, parts: parts });
      key = state.asset_id;
    } else { cases[pk] = res; key = 'case:' + pk; }
    pstate.cases = cases; pstate.last_case = key;
    var nparts = 0; Object.keys(results).forEach(function (k) { nparts += Object.keys(results[k].parts || {}).length; });
    var payload = { state: pstate, results: results,
                    summary: { assets: Object.keys(results).length, parts: nparts, cases: Object.keys(cases).length, engine: 'MEPSpares ' + SP.VERSION },
                    updatedAt: new Date().toISOString() };
    try {
      var next = core.register.withModule(doc, 'mepspares', payload);
      if (bar && typeof bar.setDoc === 'function') { bar.setDoc(next); return true; }
      core.register.save(next); return true;
    } catch (e) { return false; }
  }

  /* --- CSV ----------------------------------------------------------------------------------- */
  var CSV_HEAD = ['option', 'feasible', 'chosen', 'spares_owned', 'fill_rate', 'recovery_h_mean', 'recovery_h_long_route', 'p_long_route',
                  'holding_eur_y', 'fee_eur_y', 'event_eur_y', 'downtime_h_y', 'downtime_eur_y', 'total_eur_y_lo', 'total_eur_y_mid', 'total_eur_y_hi', 'reasons'];
  function csvRows() {
    if (!last) return [];
    return last.rows.map(function (r) {
      return { option: r.id, feasible: r.feasible, chosen: r.id === last.best, spares_owned: +(+r.units_owned).toFixed(4), fill_rate: +(+r.fill).toFixed(6),

  function csvText() {

    return [CSV_HEAD.join(',')].concat(rows.map(function (r) { return CSV_HEAD.map(function (h) { return cell(r[h]); }).join(','); })).join('\r\n') + '\r\n';

            body: T('Cost = holding rate × part price × spares owned + fees + rental costs + downtime cost per hour × failures per year × season share × outage hours per failure. The expected wait for a part is EBO(k)/(N·λ) years per failure — expected backorders divided by the demand rate (Little’s law). The parts consumed are the same for every option and are shown separately, not in the comparison. The holding rate covers capital, storage, insurance and shelf-life loss; 15–30 % a year is a common planning range.',

                    'Coût = taux de possession × prix × pièces détenues + redevances + coûts de location + coût horaire d’arrêt × pannes par an × part de saison × heures d’arrêt par panne. L’attente espérée d’une pièce est EBO(k)/(N·λ) an par panne — ruptures espérées divisées par le taux de demande (loi de Little). Les pièces consommées sont identiques pour toutes les options et indiquées à part. Le taux de possession couvre capital, stockage, assurance et péremption ; 15 à 30 % par an est une plage de planification courante.',
                    'Coste = tasa de tenencia × precio × repuestos en propiedad + cuotas + alquiler + coste horario de parada × fallos al año × cuota de temporada × horas de parada por fallo. La espera esperada de un repuesto es EBO(k)/(N·λ) años por fallo: pedidos pendientes esperados divididos por la tasa de demanda (ley de Little). Los repuestos consumidos son iguales para todas las opciones y se muestran aparte. La tasa de tenencia cubre capital, almacén, seguro y caducidad; un 15–30 % anual es un rango habitual de planificación.',
                    'Koszt = stopa utrzymania × cena × posiadane części + opłaty + najem + koszt godziny przestoju × uszkodzenia na rok × udział sezonu × godziny przestoju na uszkodzenie. Oczekiwany czas czekania na część to EBO(k)/(N·λ) roku na uszkodzenie — oczekiwane braki podzielone przez intensywność popytu (prawo Little’a). Zużyte części są takie same we wszystkich wariantach i podane osobno. Stopa utrzymania obejmuje kapitał, magazyn, ubezpieczenie i starzenie; 15–30 % rocznie to typowy zakres planistyczny.')
          },
          pooling: {
            title: T('Pooling', 'Спільний запас', 'Pooling', 'Poolen', 'Mutualisation', 'Agrupación', 'Współdzielenie'),
            body: T('Failures of identical units rarely come together, so one shelf serving all of them needs far fewer spares than one spare per unit for the same fill rate. A pool across sites goes further: the holding cost is shared, but each failure adds the transfer time. One spare per unit kept separately is shown as the naive comparison.',
                    'Відмови однакових агрегатів рідко збігаються, тож одна полиця для всіх потребує значно менше запчастин, ніж по одній на агрегат, за того самого рівня заповнення. Пул кількох об’єктів іде далі: витрати на зберігання діляться, але кожна відмова додає час доставки. Окрема запчастина для кожного агрегату показана як наївне порівняння.',
                    'Ausfälle gleicher Geräte fallen selten zusammen, daher braucht ein Regal für alle bei gleichem Servicegrad weit weniger Teile als ein Teil je Gerät. Ein standortübergreifender Pool geht weiter: Die Lagerkosten werden geteilt, aber jeder Ausfall bekommt die Transportzeit hinzu. Ein Teil je Gerät, getrennt gelagert, dient als naiver Vergleich.',
                    'Storingen van identieke units vallen zelden samen, dus één plank voor allemaal heeft voor dezelfde vulgraad veel minder onderdelen nodig dan één per unit. Een pool over locaties gaat verder: de voorraadkosten worden gedeeld, maar elke storing krijgt de transporttijd erbij. Eén onderdeel per unit, apart bewaard, is de naïeve vergelijking.',
                    'Les pannes d’unités identiques coïncident rarement : un seul rayon pour toutes demande bien moins de pièces qu’une par unité pour le même taux de service. Un pool entre sites va plus loin : le coût de possession est partagé, mais chaque panne ajoute le délai de transfert. Une pièce par unité stockée à part sert de comparaison naïve.',
                    'Los fallos de unidades idénticas rara vez coinciden, así que una estantería para todas necesita muchos menos repuestos que uno por unidad para la misma tasa de servicio. Un pool entre sitios va más allá: el coste de tenencia se reparte, pero cada fallo añade el tiempo de traslado. Un repuesto por unidad guardado aparte es la comparación ingenua.',
                    'Awarie identycznych urządzeń rzadko się nakładają, więc jedna półka dla wszystkich potrzebuje przy tym samym wskaźniku obsługi znacznie mniej części niż jedna na urządzenie. Pula kilku obiektów idzie dalej: koszt utrzymania jest dzielony, ale każda awaria dolicza czas transportu. Osobna część dla każdego urządzenia to naiwne porównanie.')

          redundancy: {
            title: T('Credited redundancy', 'Зарахований резерв', 'Angerechnete Redundanz', 'Erkende redundantie', 'Redondance retenue', 'Redundancia acreditada', 'Uznana redundancja'),
            body: T('If a standby takes over, a failure costs downtime only while the standby is also failed. With the standby failing at rate r, the expected outage during a wait W is W − (1 − e^(−rW))/r, roughly r·W²/2 — tiny for short waits, growing fast for long ones. As in the criticality tool, redundancy is credited only when the standby was tested in the last 12 months and shares no common cause with the duty unit.',
                    'Якщо навантаження бере резерв, відмова спричиняє простій лише тоді, коли резерв теж несправний. Якщо резерв відмовляє з інтенсивністю r, очікуваний простій за час очікування W дорівнює W − (1 − e^(−rW))/r, приблизно r·W²/2: дуже малий для коротких очікувань і швидко зростає для довгих. Як і в інструменті критичності, резерв зараховується лише тоді, коли його перевіряли за останні 12 місяців і він не має спільної причини відмови з основним агрегатом.',
                    'Übernimmt eine Reserve, kostet ein Ausfall nur Stillstand, solange auch die Reserve ausgefallen ist. Fällt die Reserve mit der Rate r aus, ist der erwartete Stillstand während einer Wartezeit W gleich W − (1 − e^(−rW))/r, etwa r·W²/2 — winzig bei kurzen, schnell wachsend bei langen Wartezeiten. Wie im Kritikalitätswerkzeug wird Redundanz nur angerechnet, wenn die Reserve in den letzten 12 Monaten geprüft wurde und keine gemeinsame Ursache mit dem Betriebsgerät hat.',
                    'Neemt een reserve het over, dan kost een storing alleen stilstand zolang ook de reserve defect is. Faalt de reserve met intensiteit r, dan is de verwachte uitval tijdens een wachttijd W gelijk aan W − (1 − e^(−rW))/r, ongeveer r·W²/2 — klein bij kort wachten, snel groeiend bij lang. Net als in de kriticiteitstool telt redundantie alleen als de reserve de laatste 12 maanden getest is en geen gemeenschappelijke oorzaak met de bedrijfsunit deelt.',
                    'Si un secours prend le relais, une panne ne coûte de l’arrêt que tant que le secours est lui aussi en panne. Avec un secours qui tombe en panne au taux r, l’arrêt espéré pendant une attente W vaut W − (1 − e^(−rW))/r, soit environ r·W²/2 — minime pour une attente courte, vite croissant pour une longue. Comme dans l’outil de criticité, la redondance n’est retenue que si le secours a été testé dans les 12 derniers mois et ne partage aucune cause commune avec l’unité en service.',
                    'Si una reserva toma el relevo, un fallo solo cuesta parada mientras la reserva también está averiada. Si la reserva falla a una tasa r, la parada esperada durante una espera W es W − (1 − e^(−rW))/r, aproximadamente r·W²/2: mínima para esperas cortas y creciente con rapidez para largas. Como en la herramienta de criticidad, la redundancia solo se acredita si la reserva se probó en los últimos 12 meses y no comparte una causa común con la unidad en servicio.',
                    'Jeśli rezerwa przejmuje pracę, awaria kosztuje przestój tylko wtedy, gdy rezerwa też jest uszkodzona. Przy intensywności uszkodzeń rezerwy r oczekiwany przestój w czasie oczekiwania W wynosi W − (1 − e^(−rW))/r, około r·W²/2 — znikomy przy krótkim oczekiwaniu, szybko rosnący przy długim. Jak w narzędziu krytyczności redundancja jest uznawana tylko, gdy rezerwę sprawdzono w ostatnich 12 miesiącach i nie ma wspólnej przyczyny z urządzeniem podstawowym.')
          },
          season: {
            title: T('Season and temporary plant', 'Сезон і тимчасове обладнання', 'Saison und Mietanlagen', 'Seizoen en tijdelijke installaties', 'Saison et installations temporaires', 'Temporada y equipos temporales', 'Sezon i urządzenia tymczasowe'),
            body: T('A boiler matters in winter, a chiller in summer. If failures are spread evenly over the year and the function is needed for a share s of it, every hour of waiting costs downtime with probability s, so the expected cost scales with s. Temporary plant restores the function after its mobilisation time; it is hired only for the in-season part of the wait, and its mobilisation is paid when the wait touches the season (probability s + W/8760, at most 1). A spare on the shelf costs the same in July as in January.',
                    'Котел важливий узимку, чилер — улітку. Якщо відмови рівномірно розподілені протягом року, а функція потрібна в частку s року, кожна година очікування спричиняє простій з імовірністю s, тож очікувані втрати пропорційні s. Тимчасове обладнання відновлює функцію після мобілізації; його орендують лише на сезонну частину очікування, а мобілізацію оплачують, коли очікування зачіпає сезон (імовірність s + W/8760, не більше 1). Запчастина на полиці коштує в липні стільки ж, скільки в січні.',
                    'Ein Kessel zählt im Winter, eine Kältemaschine im Sommer. Sind Ausfälle gleichmäßig übers Jahr verteilt und wird die Funktion in einem Anteil s gebraucht, kostet jede Wartestunde mit Wahrscheinlichkeit s Stillstand, die erwarteten Kosten skalieren also mit s. Eine Mietanlage stellt die Funktion nach der Mobilisierungszeit wieder her; sie wird nur für den Saisonanteil der Wartezeit gemietet, und die Mobilisierung fällt an, wenn die Wartezeit die Saison berührt (Wahrscheinlichkeit s + W/8760, höchstens 1). Ein Teil im Regal kostet im Juli so viel wie im Januar.',
                    'Een ketel telt in de winter, een koelmachine in de zomer. Zijn storingen gelijkmatig over het jaar verdeeld en is de functie een deel s van het jaar nodig, dan kost elk uur wachten met kans s stilstand; de verwachte kosten schalen dus met s. Een tijdelijke installatie herstelt de functie na de mobilisatietijd; ze wordt alleen gehuurd voor het seizoensdeel van het wachten, en de mobilisatie wordt betaald als het wachten het seizoen raakt (kans s + W/8760, hoogstens 1). Een onderdeel op de plank kost in juli evenveel als in januari.',
                    'Une chaudière compte en hiver, un groupe froid en été. Si les pannes sont réparties uniformément sur l’année et que la fonction sert une part s du temps, chaque heure d’attente coûte de l’arrêt avec la probabilité s : le coût espéré est proportionnel à s. Une installation temporaire rétablit la fonction après sa mobilisation ; elle n’est louée que pour la partie de l’attente en saison, et la mobilisation est payée quand l’attente touche la saison (probabilité s + W/8760, au plus 1). Une pièce en rayon coûte autant en juillet qu’en janvier.',
                    'Una caldera importa en invierno; una enfriadora, en verano. Si los fallos se reparten uniformemente en el año y la función se necesita una parte s del mismo, cada hora de espera cuesta parada con probabilidad s, así que el coste esperado es proporcional a s. Un equipo temporal restablece la función tras su movilización; solo se alquila en la parte de la espera dentro de temporada, y la movilización se paga cuando la espera toca la temporada (probabilidad s + W/8760, como máximo 1). Un repuesto en la estantería cuesta lo mismo en julio que en enero.',
                    'Kocioł liczy się zimą, agregat chłodniczy latem. Jeśli uszkodzenia rozkładają się równomiernie w roku, a funkcja jest potrzebna przez część s roku, każda godzina czekania kosztuje przestój z prawdopodobieństwem s, więc oczekiwany koszt jest proporcjonalny do s. Urządzenie tymczasowe przywraca funkcję po mobilizacji; wynajmuje się je tylko na sezonową część oczekiwania, a mobilizację płaci się, gdy oczekiwanie dotyka sezonu (prawdopodobieństwo s + W/8760, najwyżej 1). Część na półce kosztuje w lipcu tyle samo co w styczniu.')
          },
          agreement: {
            title: T('Supplier agreement', 'Договір з постачальником', 'Liefervertrag', 'Leveranciersovereenkomst', 'Contrat fournisseur', 'Acuerdo con el proveedor', 'Umowa z dostawcą'),
            body: T('A yearly fee buys a guaranteed delivery time — the supplier holds the stock. Guarantees are not certainties: enter the probability that the delivery time is met; otherwise the normal lead time applies. Ask for the guarantee in writing, with the stock location, and test it once.',
                    'Річний внесок купує гарантований строк поставки — запас тримає постачальник. Гарантія — не певність: введіть імовірність дотримання строку; інакше діє звичайний термін поставки. Вимагайте гарантію письмово, із зазначенням місця зберігання запасу, і перевірте її хоча б раз.',
                    'Eine Jahresgebühr kauft eine garantierte Lieferzeit — der Lieferant hält den Bestand. Garantien sind keine Gewissheit: Geben Sie die Wahrscheinlichkeit ein, dass die Zeit eingehalten wird; sonst gilt die normale Lieferzeit. Garantie schriftlich mit Lagerort verlangen und einmal testen.',
                    'Een jaarlijkse vergoeding koopt een gegarandeerde levertijd — de leverancier houdt de voorraad aan. Garanties zijn geen zekerheden: vul de kans in dat de levertijd gehaald wordt; anders geldt de normale levertijd. Vraag de garantie schriftelijk, met de voorraadlocatie, en test haar één keer.',
                    'Une redevance annuelle achète un délai de livraison garanti — le fournisseur détient le stock. Une garantie n’est pas une certitude : saisissez la probabilité que le délai soit tenu ; sinon le délai normal s’applique. Exigez la garantie par écrit, avec le lieu de stockage, et testez-la une fois.',
                    'Una cuota anual compra un plazo de entrega garantizado: el proveedor mantiene el stock. Una garantía no es una certeza: introduzca la probabilidad de que se cumpla el plazo; si no, rige el plazo normal. Pida la garantía por escrito, con la ubicación del stock, y pruébela una vez.',
                    'Roczna opłata kupuje gwarantowany czas dostawy — zapas trzyma dostawca. Gwarancja to nie pewność: wpisz prawdopodobieństwo dotrzymania terminu; w przeciwnym razie obowiązuje zwykły czas dostawy. Żądaj gwarancji na piśmie, z miejscem składowania zapasu, i sprawdź ją raz.')
          },
          obsolete: {

            body: T('When the manufacturer has discontinued a part, there is no resupply: stock bought now is all there will ever be, and no agreement can promise a delivery. The question becomes a last-time buy over the remaining life — how many to buy so that the stock lasts until the system is replaced. The page hands the part and its demand rate to the last-time-buy tool and the system replacement belongs in the renewal planner.',

                    'Als de fabrikant een onderdeel heeft uitgefaseerd, is er geen herbevoorrading: wat u nu koopt is alles, en geen overeenkomst kan levering beloven. De vraag wordt een last-time-buy over de restlevensduur — hoeveel kopen zodat de voorraad tot de systeemvervanging reikt. De pagina geeft onderdeel en vraag door aan de LTB-tool; de systeemvervanging hoort in de vervangingsplanner.',
                    'Quand le fabricant a arrêté une pièce, il n’y a plus de réapprovisionnement : le stock acheté maintenant est tout ce qu’il y aura, et aucun contrat ne peut promettre une livraison. La question devient un dernier achat sur la durée de vie restante — combien acheter pour tenir jusqu’au remplacement du système. La page transmet la pièce et sa demande à l’outil LTB ; le remplacement du système relève du planificateur de renouvellement.',
                    'Cuando el fabricante ha descatalogado un repuesto no hay reposición: el stock comprado ahora es todo lo que habrá y ningún acuerdo puede prometer una entrega. La pregunta pasa a ser una última compra para la vida restante: cuántos comprar para que el stock dure hasta sustituir el sistema. La página pasa el repuesto y su demanda a la herramienta LTB; la sustitución del sistema corresponde al planificador de renovación.',
                    'Gdy producent wycofał część, nie ma uzupełnień: zapas kupiony teraz to wszystko, co będzie, i żadna umowa nie obieca dostawy. Pytanie staje się ostatnim zakupem na pozostały okres eksploatacji — ile kupić, by zapas wystarczył do wymiany systemu. Strona przekazuje część i jej popyt do narzędzia LTB; wymiana systemu należy do planera odnowy.')
          },
          unpriced: {

                    'Brandmeldinstallaties, sprinklerpompen en noodverlichting beschermen mensen; een uur zonder heeft geen eerlijke waarde in euro. Vink „stilstandskosten bekend” uit: de tool kiest dan de goedkoopste optie waarvan het gemiddelde herstel binnen de toelaatbare stilstand past, of de snelste als geen past — hij ruilt nooit stilzwijgend veiligheid tegen geld.',
                    'Détection incendie, pompes sprinkler et éclairage de sécurité protègent des personnes ; une heure sans eux n’a pas de valeur honnête en euros. Décochez « coût d’arrêt connu » : l’outil choisit alors l’option la moins chère dont la reprise moyenne tient dans l’arrêt tolérable, ou la plus rapide si aucune ne tient — il n’échange jamais en douce la sécurité contre de l’argent.',
                    'La detección de incendios, las bombas de rociadores y el alumbrado de emergencia protegen personas; una hora sin ellos no tiene un valor honesto en euros. Desmarque «coste de parada conocido»: la herramienta elige entonces la opción más barata cuya recuperación media cabe en la parada tolerable, o la más rápida si ninguna cabe; nunca cambia seguridad por dinero a sus espaldas.',
                    'Sygnalizacja pożaru, pompy tryskaczowe i oświetlenie awaryjne chronią ludzi; godzina bez nich nie ma uczciwej wartości w euro. Odznacz „koszt przestoju znany”: narzędzie wybierze wtedy najtańszy wariant, którego średnie odtworzenie mieści się w dopuszczalnym przestoju, albo najszybszy, jeśli żaden się nie mieści — nigdy po cichu nie wymienia bezpieczeństwa na pieniądze.')
