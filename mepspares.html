    if (r.k.service != null && r.k.service > r.k.optimum && s.priced) notes.push(TF(T('The service target needs {0} spares on site; the economic optimum is {1}. The target costs about {2} EUR a year more than the optimum.', 'Цільовий рівень потребує {0} запчастин на об’єкті; економічний оптимум — {1}. Ціль коштує приблизно на {2} EUR на рік більше за оптимум.', 'Das Serviceziel braucht {0} Teile vor Ort, das wirtschaftliche Optimum ist {1}. Das Ziel kostet etwa {2} EUR im Jahr mehr.', 'Het servicedoel vraagt {0} onderdelen op locatie; het economisch optimum is {1}. Het doel kost ongeveer {2} EUR per jaar meer.', 'L’objectif de service demande {0} pièces sur site ; l’optimum économique est {1}. L’objectif coûte environ {2} EUR par an de plus.', 'El objetivo de servicio pide {0} repuestos en el sitio; el óptimo económico es {1}. El objetivo cuesta unos {2} EUR al año más.', 'Cel obsługi wymaga {0} części na miejscu; optimum ekonomiczne to {1}. Cel kosztuje około {2} EUR rocznie więcej.'),
      [String(r.k.service), String(r.k.optimum), F(r.k.service_cost_eur_y - r.curve.mid[r.k.optimum].total_eur_y)]));
    if (s.red_credited) notes.push(T('Redundancy is credited: a failure becomes an outage only if the standby also fails during the wait. Credit it only when the standby was tested within 12 months and shares no common cause (power feed, header, control panel) with the duty unit.', 'Резерв зараховано: відмова стає простоєм, лише якщо резерв теж відмовить під час очікування. Зараховуйте його, лише якщо резерв перевіряли протягом 12 місяців і він не має спільної причини (живлення, колектор, щит керування) з основним агрегатом.', 'Redundanz ist angerechnet: ein Ausfall wird nur zum Stillstand, wenn auch die Reserve während der Wartezeit ausfällt. Nur anrechnen, wenn die Reserve in 12 Monaten geprüft wurde und keine gemeinsame Ursache (Einspeisung, Verteiler, Schaltschrank) mit dem Betriebsgerät hat.', 'Redundantie is erkend: een storing wordt pas uitval als ook de reserve tijdens het wachten faalt. Alleen erkennen als de reserve binnen 12 maanden getest is en geen gemeenschappelijke oorzaak (voeding, verdeler, schakelkast) met de bedrijfsunit heeft.', 'La redondance est retenue : une panne ne devient un arrêt que si le secours lâche aussi pendant l’attente. Ne la retenir que si le secours a été testé dans les 12 mois et ne partage aucune cause commune (alimentation, collecteur, armoire) avec l’unité en service.', 'La redundancia está acreditada: un fallo solo es parada si la reserva también falla durante la espera. Acredítela solo si la reserva se probó en 12 meses y no comparte causa común (alimentación, colector, cuadro) con la unidad en servicio.', 'Redundancja jest uznana: awaria staje się przestojem tylko, gdy rezerwa też zawiedzie w czasie oczekiwania. Uznawaj ją tylko, gdy rezerwę sprawdzono w ciągu 12 miesięcy i nie ma wspólnej przyczyny (zasilanie, rozdzielacz, szafa sterownicza) z urządzeniem podstawowym.'));
    notes.push(T('Numbers in the presets are learning assumptions, not manufacturer, supplier or statistical data. Use your own failure history for the rate (with its low–high range), real quotes for prices and lead times, and the downtime cost and tolerable downtime agreed for the asset in the criticality tool.', 'Числа в прикладах — навчальні припущення, а не дані виробника, постачальника чи статистика. Для інтенсивності використовуйте власну історію відмов (з діапазоном низьке–високе), для цін і термінів — реальні пропозиції, а вартість і допустимий простій — узгоджені для агрегату в інструменті критичності.', 'Die Beispielwerte sind Lernannahmen, keine Hersteller-, Lieferanten- oder Statistikdaten. Für die Rate die eigene Ausfallhistorie (mit Bandbreite), für Preise und Lieferzeiten echte Angebote und für Stillstandskosten und tolerierbare Ausfallzeit die im Kritikalitätswerkzeug abgestimmten Werte nutzen.', 'De voorbeeldwaarden zijn leeraannames, geen fabrikant-, leveranciers- of statistische gegevens. Gebruik voor de intensiteit uw eigen storingshistorie (met bandbreedte), voor prijzen en levertijden echte offertes, en voor stilstandskosten en toelaatbare stilstand de waarden uit de kriticiteitstool.', 'Les valeurs des exemples sont des hypothèses pédagogiques, pas des données de constructeur, de fournisseur ni des statistiques. Utilisez votre historique de pannes pour le taux (avec sa plage), de vrais devis pour prix et délais, et le coût d’arrêt et l’arrêt tolérable convenus dans l’outil de criticité.', 'Los valores de los ejemplos son supuestos didácticos, no datos de fabricante, proveedor ni estadísticas. Use su historial de fallos para la tasa (con su rango), presupuestos reales para precios y plazos, y el coste y la parada tolerable acordados en la herramienta de criticidad.', 'Liczby w przykładach to założenia dydaktyczne, nie dane producenta, dostawcy ani statystyka. Do intensywności użyj własnej historii uszkodzeń (z zakresem), do cen i czasów dostaw — prawdziwych ofert, a koszt i dopuszczalny przestój — uzgodnionych w narzędziu krytyczności.'));
    if (!(CORE() && CORE().register)) notes.push(T('The shared site register (mep-core.js) is not loaded: this page works on its own case; the register bar and the screening are off.', 'Спільний реєстр об’єкта (mep-core.js) не завантажено: сторінка працює зі своїм випадком; панель реєстру й скринінг вимкнені.', 'Das gemeinsame Anlagenregister (mep-core.js) ist nicht geladen: die Seite arbeitet mit ihrem eigenen Fall; Registerleiste und Screening sind aus.', 'Het gedeelde installatieregister (mep-core.js) is niet geladen: de pagina werkt met haar eigen geval; registerbalk en screening staan uit.', 'Le registre partagé (mep-core.js) n’est pas chargé : la page travaille sur son propre cas ; barre de registre et criblage désactivés.', 'El registro compartido (mep-core.js) no está cargado: la página trabaja con su propio caso; la barra de registro y el cribado están desactivados.', 'Wspólny rejestr obiektu (mep-core.js) nie jest wczytany: strona pracuje na własnym przypadku; pasek rejestru i przegląd są wyłączone.'));
    return { verdict: verdict, tiles: tiles, tables: tables, notes: notes };
  }

  /* --- drawing ------------------------------------------------------------------------------- */
  function tokens() {
    var cs = getComputedStyle(document.documentElement);
    return { muted: cs.getPropertyValue('--muted').trim() || '#777', line: cs.getPropertyValue('--line').trim() || '#ddd',
             ink: cs.getPropertyValue('--ink').trim() || '#222' };
  }
  function txt(ctx, s, x, y, align, color) { ctx.textAlign = align || 'left'; if (color) ctx.fillStyle = color; ctx.fillText(s, x, y); }
  /* decades, plus 2 and 5 when the axis spans fewer than three decades */
  function logTicks(lo, hi) {
    var out = [], a = Math.floor(Math.log10(lo)), b = Math.ceil(Math.log10(hi)), sub = (Math.log10(hi) - Math.log10(lo)) < 3;
    for (var e = a; e <= b; e++) { var d = Math.pow(10, e); out.push(d); if (sub) { out.push(2 * d); out.push(5 * d); } }
    return out.filter(function (v) { return v >= lo && v <= hi; });
  }
  function eurShort(v) {
    if (v >= 1e6) return F(v / 1e6, v >= 1e7 ? 0 : 1) + ' M';
    if (v >= 1e3) return F(v / 1e3, v >= 1e4 ? 0 : 1) + ' k';
    return F(v, 0);
  }

  /* canvas a11y (QA-16): focusable image named by the chart and its data summary (the stage's a11y text) */
  function wireA11y(st, name) {
    var cv = st && st.cv; if (!cv) return;
    if (!cv.__spWired) { cv.__spWired = true; cv.tabIndex = 0; cv.setAttribute('role', 'img'); }
    var d = '';
    try { d = st.def && typeof st.def.a11y === 'function' ? String(st.def.a11y() || '') : ''; } catch (e) { d = ''; }
    cv.setAttribute('aria-label', L(name) + (d ? '. ' + d : ''));
  }
  var CANVAS_NAMES = [
    T('Expected annual cost against the number of spares on site', 'Очікувані річні витрати залежно від кількості запчастин', 'Erwartete Jahreskosten über der Zahl der Teile vor Ort', 'Verwachte jaarkosten tegen het aantal onderdelen', 'Coût annuel espéré selon le nombre de pièces', 'Coste anual esperado según el número de repuestos', 'Oczekiwany koszt roczny a liczba części'),
    T('Time to restore the function per option', 'Час відновлення функції для кожного варіанта', 'Zeit bis zur Wiederherstellung je Option', 'Hersteltijd per optie', 'Délai de rétablissement par option', 'Tiempo hasta restablecer por opción', 'Czas przywrócenia funkcji dla wariantów')
  ];

  function renderCost(size, st) {
    var ctx = st.canvas(), w = size.w, h = size.h, k = tokens();
    wireA11y(st, CANVAS_NAMES[0]);
    ctx.clearRect(0, 0, w, h);
    if (!last) return;
    var coarse = size.density === 'coarse';
    var padL = coarse ? 46 : 58, padR = coarse ? 70 : 130, padT = 16, padB = 40;
    var cm = last.curve.mid, clo = last.curve.lo, chi = last.curve.hi;
    var others = last.rows.filter(function (r) { return r.feasible && r.id !== 'stock' && r.id !== 'none'; });
    var vals = [];
    cm.forEach(function (r, i) { vals.push(r.total_eur_y, clo[i].total_eur_y, chi[i].total_eur_y, r.holding_eur_y); });
    others.forEach(function (r) { vals.push(r.total_eur_y); });
    vals = vals.filter(function (v) { return v > 0 && isFinite(v); });
    if (!vals.length) vals = [1, 10];
    var vmin = Math.max(1, Math.min.apply(null, vals) / 1.5), vmax = Math.max.apply(null, vals) * 1.5;
    var lmin = Math.log10(vmin), lmax = Math.log10(vmax);
    var Y = function (v) { return h - padB - (h - padB - padT) * (Math.log10(Math.max(vmin, v)) - lmin) / (lmax - lmin); };
    var n = cm.length, slot = (w - padL - padR) / n, bw = Math.max(6, slot * 0.55);
    var X = function (i) { return padL + slot * (i + 0.5); };
    ctx.font = (coarse ? 10 : 11) + 'px sans-serif';
    /* grid */
    ctx.strokeStyle = k.line; ctx.lineWidth = 1;
    logTicks(vmin, vmax).forEach(function (v) {
      if (v < vmin || v > vmax) return;
      var y = Y(v); ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
      txt(ctx, eurShort(v), padL - 4, y + 4, 'right', k.muted);
    });
    /* bars: holding (bottom) + downtime (top), stacked in linear value, drawn on the log axis */
    cm.forEach(function (r, i) {
      var x = X(i) - bw / 2, base = h - padB;
      var yH = r.holding_eur_y > 0 ? Y(r.holding_eur_y) : base;
      var yT = Y(Math.max(r.total_eur_y, vmin));
      ctx.globalAlpha = r.k === last.k.stock ? 0.95 : 0.6;
      if (r.holding_eur_y > 0) { ctx.fillStyle = DiagramUI.series(1); ctx.fillRect(x, yH, bw, base - yH); }
      if (r.total_eur_y > r.holding_eur_y) { ctx.fillStyle = DiagramUI.series(0); ctx.fillRect(x, yT, bw, Math.max(0, (r.holding_eur_y > 0 ? yH : base) - yT)); }
      ctx.globalAlpha = 1;
      /* lo–hi whisker */
      ctx.strokeStyle = k.ink; ctx.lineWidth = 1.2;
      var y1 = Y(Math.max(vmin, clo[i].total_eur_y)), y2 = Y(Math.max(vmin, chi[i].total_eur_y));
      ctx.beginPath(); ctx.moveTo(X(i), y1); ctx.lineTo(X(i), y2); ctx.moveTo(X(i) - 4, y1); ctx.lineTo(X(i) + 4, y1); ctx.moveTo(X(i) - 4, y2); ctx.lineTo(X(i) + 4, y2); ctx.stroke();
      txt(ctx, String(r.k), X(i), h - padB + 14, 'center', r.k === last.k.stock ? k.ink : k.muted);
      if (r.k === last.k.stock && r.k > 0) txt(ctx, '▲', X(i), h - padB + 27, 'center', k.ink);
    });
    txt(ctx, L(T('spares on site', 'запчастин на об’єкті', 'Teile vor Ort', 'onderdelen op locatie', 'pièces sur site', 'repuestos en el sitio', 'części na miejscu')), padL + (w - padL - padR) / 2, h - 4, 'center', k.muted);
    /* other options as dashed horizontal lines */
    ctx.setLineDash([5, 4]); ctx.lineWidth = 1.5;
    var used = [];
    others.forEach(function (r) {
      var y = Y(Math.max(vmin, r.total_eur_y));
      ctx.strokeStyle = DiagramUI.series(2); ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
      var ly = y + 4; used.forEach(function (u) { if (Math.abs(u - ly) < 12) ly = u + 12; }); used.push(ly);
      var lab = r.id === 'dedicated' ? T('per unit', 'на агрегат', 'je Gerät', 'per unit', 'par unité', 'por unidad', 'na urządzenie') : (r.id === 'pool' ? T('pool', 'пул', 'Pool', 'pool', 'pool', 'pool', 'pula') : (r.id === 'agreement' ? T('agreement', 'договір', 'Vertrag', 'overeenkomst', 'contrat', 'acuerdo', 'umowa') : T('rental', 'оренда', 'Miete', 'huur', 'location', 'alquiler', 'najem')));
      txt(ctx, L(lab) + ' ' + eurShort(r.total_eur_y), w - padR + 4, ly, 'left', k.ink);
    });
    ctx.setLineDash([]);
  }

  function renderRec(size, st) {
    var ctx = st.canvas(), w = size.w, h = size.h, k = tokens();
    wireA11y(st, CANVAS_NAMES[1]);
    ctx.clearRect(0, 0, w, h);
    if (!last) return;
    var coarse = size.density === 'coarse';
    var rows = last.rows.filter(function (r) { return r.enabled; });
    ctx.font = (coarse ? 10 : 11) + 'px sans-serif';
    var labMax = 0; rows.forEach(function (r) { labMax = Math.max(labMax, ctx.measureText(L(OPT[r.id])).width); });
    var labW = coarse ? 90 : Math.min(Math.round(w * 0.42), Math.ceil(labMax) + 12), padR = 40, padT = 10, padB = 30;
    var vals = [];
    rows.forEach(function (r) { vals.push(Math.max(0.1, r.recovery_h), Math.max(0.1, r.recovery_worst_h)); });
    if (state.tol_known && state.tolerable > 0) vals.push(state.tolerable);
    var vmin = Math.max(0.01, Math.min.apply(null, vals) / 2), vmax = Math.max.apply(null, vals) * 1.6;
    var lmin = Math.log10(vmin), lmax = Math.log10(vmax);
    var X = function (v) { return labW + (w - labW - padR) * (Math.log10(Math.max(vmin, v)) - lmin) / (lmax - lmin); };
    var rowH = (h - padT - padB) / rows.length, bh = Math.min(22, rowH * 0.55);
    ctx.font = (coarse ? 10 : 11) + 'px sans-serif';
    ctx.strokeStyle = k.line; ctx.lineWidth = 1;
    var lastX = -1e9;
    [0.1, 1, 8, 24, 168, 720, 2160, 8760, 26280].forEach(function (v) {
      if (v < vmin || v > vmax) return;
      var x = X(v), lab = dur(v), half = ctx.measureText(lab).width / 2 + 4;
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, h - padB); ctx.stroke();
      if (x - half < lastX) return;            /* keep labels apart on narrow screens */
      txt(ctx, lab, x, h - padB + 14, 'center', k.muted); lastX = x + half;
    });
    rows.forEach(function (r, i) {
      var yc = padT + rowH * (i + 0.5);
      var name = L(OPT[r.id]); if (coarse && name.length > 14) name = name.slice(0, 13) + '…';
      txt(ctx, name, labW - 6, yc + 4, 'right', r.feasible ? k.ink : k.muted);
      var x0 = X(vmin), x1 = X(Math.max(vmin, r.recovery_h));
      ctx.globalAlpha = r.feasible ? (r.id === last.best ? 0.95 : 0.65) : 0.25;
      ctx.fillStyle = DiagramUI.series(0); ctx.fillRect(x0, yc - bh / 2, Math.max(1, x1 - x0), bh);
      ctx.globalAlpha = 1;
      if (r.recovery_worst_h > r.recovery_h * 1.01 && r.p_long_wait > 0) {
        var xw = X(r.recovery_worst_h);
        ctx.strokeStyle = DiagramUI.series(3); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x1, yc); ctx.lineTo(xw, yc); ctx.moveTo(xw, yc - 5); ctx.lineTo(xw, yc + 5); ctx.stroke();
        if (!coarse) txt(ctx, F(100 * r.p_long_wait, r.p_long_wait < 0.001 ? 2 : (r.p_long_wait < 0.1 ? 1 : 0)) + ' %', xw + 4, yc + 4, 'left', k.muted);
      }
      if (r.id === last.best) txt(ctx, '★', Math.min(x1 + 4, w - padR - 8), yc - bh / 2 - 2, 'left', k.ink);
    });
    if (state.tol_known) {
      var xt = X(Math.max(vmin, state.tolerable));
      ctx.strokeStyle = DiagramUI.series(1); ctx.lineWidth = 2; ctx.setLineDash([6, 3]);
      ctx.beginPath(); ctx.moveTo(xt, padT); ctx.lineTo(xt, h - padB); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  /* ======================================================= 3. the data layer */
  function installData() {
    if (!window.Diagram) return;
    Diagram.init({
      id: 'mepspares',
      file: 'mepspares.html',
      state: {
        serialize: function () { return state; },
        deserialize: function (o) { applyCase(o || {}); last = solve(state); if (ui) { ui.sync(); ui.run(); } }
      },
      record: function () {
        if (!last) last = solve(state);
        if (!last) return null;
        var r = last;
        return {
          inputs: JSON.parse(JSON.stringify(state)),
          outputs: {
            best: r.best, fragile: r.fragile, best_lo: r.best_lo, best_hi: r.best_hi, saving_vs_none_eur_y: r.saving_vs_none_eur_y,
            k: r.k, lead_demand_mu: r.lead_demand_mu, consumption_eur_y: r.consumption_eur_y,
            options: r.rows.map(function (x) {
              return { id: x.id, enabled: x.enabled, feasible: x.feasible, reasons: x.reasons, spares_owned: x.units_owned, fill: x.fill,
                       recovery_h: x.recovery_h, recovery_long_route_h: x.recovery_worst_h, p_long_route: x.p_long_wait,
                       holding_eur_y: x.holding_eur_y, fee_eur_y: x.fee_eur_y, event_eur_y: x.event_eur_y, downtime_h_y: x.downtime_h_y,
                       downtime_eur_y: x.downtime_eur_y, total_eur_y: { lo: x.lo.total_eur_y, mid: x.total_eur_y, hi: x.hi.total_eur_y } };
            }),
            curve_mid: r.curve.mid,
            handoff: r.handoff
          },
          units: { rate: '1/y per unit', part_cost: 'EUR', lead_days: 'd', fit_h: 'h', downtime: 'EUR/h', tolerable: 'h', holding_rate: '1/y',
                   store_h: 'h', pool_transfer_h: 'h', agr_fee: 'EUR/y', agr_delivery_h: 'h', rent_mob_h: 'h', rent_mob_eur: 'EUR', rent_day_eur: 'EUR/d',
                   total_eur_y: 'EUR/y', recovery_h: 'h' },
          model: {
            equations: ['mu = N*lambda*L', 'fill(k) = P(X <= k-1), X ~ Poisson(mu)', 'EBO(k) = sum_{x>k} (x-k) p(x)',
                        'wait = W0 + 8760*EBO/(N*lambda) [h]', 'outage(W) = W - (1 - exp(-r W))/r (credited redundancy), else W',
                        'cost = h*c*k + fees + N*lambda*(C_mob*P_overlap + C_day*s*(W_none - t_mob)/24) + D*N*lambda*s*outage'],
            ranges: ['lo/mid/hi = failure-rate range; ranking by the mid value; fragile when the best option changes inside the range'],
            notes: ['engine MEPSpares ' + SP.VERSION + ' (mep-spares.js)', 'preset numbers are learning assumptions',
                    'stock option uses max(economic optimum, service-target k) when the target is enforced']
          },
          warnings: r.rows.filter(function (x) { return x.enabled && x.reasons.length; }).map(function (x) { return x.id + ': ' + x.reasons.join(', '); })
        };
      }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
