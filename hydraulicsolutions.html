 yes:{en:"Radiator, convector and underfloor groups where no dedicated group pump is wanted.",uk:"Радіаторні, конвекторні групи й тепла підлога, де окремий груповий насос небажаний.",de:"Radiatoren-, Konvektoren- und Fußbodengruppen ohne eigene Gruppenpumpe.",nl:"Radiatoren-, convectoren- en vloerverwarmingsgroepen zonder eigen groepspomp.",fr:"Groupes radiateurs, convecteurs et plancher chauffant sans circulateur dédié.",es:"Grupos de radiadores, convectores y suelo radiante sin bomba propia.",pl:"Grupy grzejnikowe, konwektorowe i podłogowe, w przypadku których nie jest wymagana dedykowana pompa grupowa."},
 no:{en:"Where the available pressure difference is too small or too variable to drive the consumer loop by itself.",uk:"Там, де наявний перепад тиску замалий або надто мінливий, щоб самотужки живити контур споживача.",de:"Wo das verfügbare Druckgefälle zu klein oder zu veränderlich ist, um den Kreis allein zu treiben.",nl:"Waar het beschikbare drukverschil te klein of te wisselend is om de kring zelf aan te drijven.",fr:"Là où la pression disponible est trop faible ou variable pour entraîner la boucle.",es:"Donde la presión disponible sea insuficiente o variable para mover el circuito.",pl:"Gdy dostępna różnica ciśnień jest zbyt mała lub zbyt zmienna, aby samodzielnie napędzać pętlę odbiornika."},
 pros:[{en:"Constant consumer flow and a capped supply temperature without any pump of its own.",uk:"Стала витрата у споживача й обмежена температура подачі без власного насоса.",de:"Konstanter Verbraucherstrom und begrenzte Vorlauftemperatur ohne eigene Pumpe.",nl:"Constant gebruikerdebiet en begrensde aanvoertemperatuur zonder eigen pomp.",fr:"Débit constant et température plafonnée, sans circulateur propre.",es:"Caudal constante e impulsión limitada, sin bomba propia.",pl:"Stały przepływ przez odbiorniki i ograniczona temperatura zasilania, bez konieczności posiadania własnej pompy."},
  {en:"Still draws a variable flow from the network, so a regulated distribution pump keeps paying off.",uk:"Усе одно бере з мережі змінну витрату, тож регульований розподільний насос окупається.",de:"Entnimmt dem Netz weiterhin einen variablen Strom, sodass sich die geregelte Verteilpumpe lohnt.",nl:"Onttrekt nog steeds variabel debiet aan het net, dus de geregelde distributiepomp blijft lonen.",fr:"Prélève encore un débit variable au réseau : la pompe régulée reste rentable.",es:"Sigue tomando caudal variable de la red: la bomba regulada sigue siendo rentable.",pl:"Nadal pobiera zmienny przepływ z sieci, więc regulowana pompa dystrybucyjna nadal się opłaca."}],
 cons:[{en:"Depends entirely on the pressure difference at its connection points — it generates none.",uk:"Повністю залежить від перепаду тиску в точках підключення — власного не створює.",de:"Hängt ganz vom Druckgefälle an den Anschlusspunkten ab — erzeugt selbst keines.",nl:"Volledig afhankelijk van het drukverschil op de aansluitpunten — genereert zelf niets.",fr:"Dépend entièrement de la pression aux points de raccordement — n’en produit aucune.",es:"Depende por completo de la presión en los puntos de conexión — no genera ninguna.",pl:"Zależy całkowicie od różnicy ciśnień w punktach połączeń — nie generuje żadnej różnicy."},
  {en:"Three interacting settings to commission instead of one.",uk:"Три взаємопов’язані налаштування замість одного.",de:"Drei sich beeinflussende Einstellungen statt einer.",nl:"Drie op elkaar inwerkende instellingen in plaats van één.",fr:"Trois réglages qui interagissent au lieu d’un.",es:"Tres ajustes que interactúan en vez de uno.",pl:"Trzy współdziałające ze sobą ustawienia do uruchomienia zamiast jednego."}],
 comm:[{en:"With the control valve shut, set the premix flow with the premix balancing valve.",uk:"За закритого регулювального клапана задайте витрату підмішування балансувальним клапаном підмісу.",de:"Bei geschlossenem Regelventil den Beimischstrom am Beimisch-Einregulierventil einstellen.",nl:"Stel bij gesloten regelafsluiter het voormengdebiet in met de voormeng-inregelafsluiter.",fr:"Vanne fermée, régler le débit de prémélange à sa vanne d’équilibrage.",es:"Con la válvula cerrada, ajuste el caudal de premezcla en su válvula de equilibrado.",pl:"Przy zamkniętym zaworze regulacyjnym należy ustawić przepływ mieszanki wstępnej za pomocą zaworu równoważącego mieszankę wstępną."},
  {en:"With it fully open, set the flow drawn from the network with the main balancing valve.",uk:"За повністю відкритого — задайте відбір з мережі головним балансувальним клапаном.",de:"Bei voll geöffnetem Ventil die Netzentnahme am Haupt-Einregulierventil einstellen.",nl:"Stel bij volledig geopende afsluiter de netonttrekking in met de hoofdinregelafsluiter.",fr:"Vanne ouverte, régler le prélèvement au réseau à la vanne principale.",es:"Con ella abierta, ajuste el consumo de red en la válvula principal.",pl:"Przy całkowicie otwartym zaworze głównym należy ustawić przepływ pobierany z sieci."}],
 kit:{en:"Two-way control valve; two balancing valves; no pump.",uk:"Двоходовий регулювальний клапан; два балансувальні; насоса немає.",de:"Zweiwege-Regelventil; zwei Einregulierventile; keine Pumpe.",nl:"Tweewegregelafsluiter; twee inregelafsluiters; geen pomp.",fr:"Vanne deux voies ; deux vannes d’équilibrage ; pas de pompe.",es:"Válvula de dos vías; dos de equilibrado; sin bomba.",pl:"Zawór sterujący dwudrożny, dwa zawory równoważące, brak pompy."}},

{id:"A3",cat:"A",model:"divert",selfPumped:false,solves:["p1","p4","p8"],creates:["p2","p9"],
 name:{en:"Three-way diverting",uk:"Розподіл триходовим",de:"Verteilung mit Dreiwegeventil",nl:"Verdelen met driewegafsluiter",fr:"Répartition par vanne trois voies",es:"Reparto con válvula de tres vías",pl:"Trójdrożny układ rozdzielający"},
 one:{en:"A three-way valve sends part of a constant network flow through the consumer and the rest around it.",uk:"Триходовий клапан пускає частину сталої витрати мережі через споживача, а решту в обхід.",de:"Ein Dreiwegeventil führt einen Teil des konstanten Netzstroms durch den Verbraucher, den Rest daran vorbei.",nl:"Een driewegafsluiter stuurt een deel van het constante netdebiet door de gebruiker en de rest eromheen.",fr:"Une vanne trois voies envoie une part du débit constant dans l’émetteur, le reste en dérivation.",es:"Una válvula de tres vías envía parte del caudal constante por el emisor y el resto por el bypass.",pl:"Zawór trójdrożny przesyła część stałego przepływu sieciowego przez odbiornik i pozostałą część wokół niego."},
 yes:{en:"Reheater coils, calorifiers and hot-water cylinders, and as the one module that keeps a boiler irrigated when everything else on the header mixes.",uk:"Догрівачі, водопідігрівачі й бойлери, а також як модуль, що тримає котел зрошеним, коли все інше на колекторі змішує.",de:"Nacherhitzer, Speicherladung und Trinkwassererwärmer, und als das Modul, das den Kessel durchströmt hält.",nl:"Naverwarmers, boilers en tapwatervaten, en als de moduul die de ketel doorstroomd houdt.",fr:"Batteries de post-chauffage, ballons et ECS, et comme module qui garde la chaudière irriguée.",es:"Baterías de poscalentamiento, acumuladores y ACS, y como módulo que mantiene irrigada la caldera.",pl:"Wężownice podgrzewające, podgrzewacze wody i bojlery, a także moduł, który utrzymuje przepływ przez kocioł, gdy wszystkie inne media w kolektorze mieszają się."},
 no:{en:"On a condensing boiler or heat pump: at part load this circuit pushes the return temperature up, which is the wrong direction.",uk:"На конденсаційному котлі чи тепловому насосі: за часткового навантаження ця схема піднімає зворотну — не в той бік.",de:"An Brennwertkessel oder Wärmepumpe: im Teillastbetrieb treibt diese Schaltung den Rücklauf hoch.",nl:"Bij een HR-ketel of warmtepomp: bij deellast drijft deze schakeling het retour omhoog.",fr:"Sur une chaudière à condensation ou une PAC : à charge partielle ce schéma fait monter le retour.",es:"En caldera de condensación o bomba de calor: a carga parcial este esquema sube el retorno.",pl:"W przypadku kotła kondensacyjnego lub pompy ciepła: przy częściowym obciążeniu obieg ten podnosi temperaturę powrotu, co jest zjawiskiem niepożądanym."},
 pros:[{en:"Keeps the network flow constant, so it protects a generator with a minimum-flow requirement.",uk:"Тримає витрату мережі сталою, захищаючи генератор із вимогою мінімальної витрати.",de:"Hält den Netzstrom konstant und schützt einen Erzeuger mit Mindestdurchsatzforderung.",nl:"Houdt het netdebiet constant en beschermt een opwekker met minimumdebieteis.",fr:"Maintient le débit réseau constant : protège un générateur à débit minimal.",es:"Mantiene constante el caudal de red: protege a un generador con caudal mínimo.",pl:"Utrzymuje stały przepływ w sieci, chroniąc w ten sposób generator o minimalnym wymogu przepływu."},
  {en:"Raises the return at part load — the classic answer to flue-gas condensation in a cast-iron or steel boiler.",uk:"Піднімає зворотну за часткового навантаження — класична відповідь на конденсацію в чавунному чи сталевому котлі.",de:"Hebt den Rücklauf im Teillastbetrieb — die klassische Antwort auf Abgaskondensation im Guss- oder Stahlkessel.",nl:"Verhoogt het retour bij deellast — het klassieke antwoord op rookgascondensatie in gietijzer of staal.",fr:"Élève le retour à charge partielle — la réponse classique à la condensation en fonte ou acier.",es:"Eleva el retorno a carga parcial — la respuesta clásica a la condensación en fundición o acero.",pl:"Podnosi powrót przy obciążeniu częściowym — klasyczne rozwiązanie problemu kondensacji spalin w kotle żeliwnym lub stalowym."}],
 cons:[{en:"That same rising return is a hard penalty on any condensing appliance and on heat-pump COP.",uk:"Та сама зростаюча зворотна — суворий штраф для конденсаційного апарата і для COP.",de:"Genau dieser steigende Rücklauf ist eine harte Strafe für Brennwertgeräte und den COP.",nl:"Datzelfde stijgende retour is een harde straf voor condenserende toestellen en de COP.",fr:"Ce même retour montant pénalise durement les appareils à condensation et le COP.",es:"Ese mismo retorno creciente penaliza a los equipos de condensación y al COP.",pl:"Ten sam rosnący powrót jest dotkliwą karą dla każdego urządzenia kondensacyjnego i dla współczynnika COP pompy ciepła."},
  {en:"Constant network flow means constant pump energy — a variable-speed pump has nothing to work with.",uk:"Стала витрата мережі означає сталу енергію насоса — регульованому насосу нема з чим працювати.",de:"Konstanter Netzstrom heißt konstante Pumpenenergie — die geregelte Pumpe hat nichts zu tun.",nl:"Constant netdebiet betekent constante pompenergie — een geregelde pomp heeft niets te doen.",fr:"Débit constant = énergie de pompage constante ; la pompe régulée n’a rien à gagner.",es:"Caudal constante significa energía de bombeo constante: la bomba regulada no tiene nada que hacer.",pl:"Stały przepływ w sieci oznacza stałą energię pompy — pompa o zmiennej prędkości nie ma z czego korzystać."},
  {en:"The bypass leg has to be balanced too, or the network flow is not actually constant.",uk:"Обвідну гілку теж треба збалансувати, інакше витрата мережі насправді не стала.",de:"Auch der Bypasszweig muss einreguliert werden, sonst ist der Netzstrom nicht konstant.",nl:"Ook de bypasstak moet ingeregeld worden, anders is het netdebiet niet constant.",fr:"La dérivation doit aussi être équilibrée, sinon le débit n’est pas constant.",es:"El bypass también debe equilibrarse, o el caudal no será constante.",pl:"Odnoga obejściowa również musi być zrównoważona, w przeciwnym razie przepływ w sieci nie będzie stały."}],
 comm:[{en:"With the valve fully to the consumer, set the full-load flow with the main balancing valve.",uk:"За положення клапана повністю на споживача задайте витрату повного навантаження головним клапаном.",de:"Ventil ganz zum Verbraucher, Vollaststrom am Haupt-Einregulierventil einstellen.",nl:"Afsluiter volledig naar de gebruiker, vollastdebiet instellen met de hoofdinregelafsluiter.",fr:"Vanne entièrement vers l’émetteur, régler le débit pleine charge.",es:"Válvula totalmente al emisor, ajuste el caudal a plena carga.",pl:"Gdy zawór jest całkowicie skierowany w stronę odbiornika, należy ustawić pełny przepływ za pomocą głównego zaworu równoważącego."},
  {en:"Switch it fully to bypass and set the bypass balancing valve to the same flow.",uk:"Переведіть повністю на обвід і задайте обвідний балансувальний клапан на ту саму витрату.",de:"Ganz auf Bypass stellen und das Bypass-Einregulierventil auf denselben Strom einstellen.",nl:"Volledig op bypass zetten en de bypass-inregelafsluiter op hetzelfde debiet instellen.",fr:"Basculer en dérivation totale et régler la vanne de dérivation au même débit.",es:"Cambie a bypass total y ajuste la válvula del bypass al mismo caudal.",pl:"Przełącz go całkowicie w pozycję obejścia i ustaw zawór równoważący obejście na taki sam przepływ."}],
 kit:{en:"Three-way diverting valve; two balancing valves, one in the bypass; no pump.",uk:"Триходовий розподільний клапан; два балансувальні, один в обводі; насоса немає.",de:"Dreiwege-Verteilventil; zwei Einregulierventile, eines im Bypass; keine Pumpe.",nl:"Driewegverdeelafsluiter; twee inregelafsluiters, één in de bypass; geen pomp.",fr:"Vanne trois voies répartitrice ; deux vannes d’équilibrage dont une en dérivation ; pas de pompe.",es:"Válvula de tres vías distribuidora; dos de equilibrado, una en el bypass; sin bomba.",pl:"Trójdrożny zawór rozdzielczy, dwa zawory równoważące, jeden na obejściu, bez pompy."}},

{id:"A4",cat:"A",model:"divert",selfPumped:true,solves:["p1","p4","p8"],creates:["p2","p9"],
 name:{en:"Three-way diverting with its own pump",uk:"Розподіл триходовим із власним насосом",de:"Verteilung mit eigener Pumpe",nl:"Verdelen met eigen pomp",fr:"Répartition avec circulateur propre",es:"Reparto con bomba propia",pl:"Trójdrożny rozdzielacz z własną pompą"},
 one:{en:"The diverting circuit with a circulator added, so it no longer waits for anyone else to move its water.",uk:"Розподільна схема з доданим насосом: більше не чекає, поки хтось інший рушить її воду.",de:"Die Verteilschaltung mit eigener Pumpe: sie wartet nicht mehr darauf, dass ein anderer das Wasser bewegt.",nl:"De verdeelschakeling met een pomp erbij: wacht niet meer tot een ander het water beweegt.",fr:"Le schéma répartiteur avec circulateur : il n’attend plus que quelqu’un d’autre déplace son eau.",es:"El esquema distribuidor con circulador: ya no espera a que otro mueva su agua.",pl:"Dodano obwód przekierowujący z pompą obiegową, dzięki czemu nie trzeba już czekać, aż ktoś inny przemieści jego wodę."},
 yes:{en:"When both the generator and the distribution side are passive, or the available pressure difference simply is not enough.",uk:"Коли і генератор, і розподіл пасивні, або наявного перепаду тиску просто не вистачає.",de:"Wenn Erzeuger und Verteilseite passiv sind oder das Druckgefälle schlicht nicht reicht.",nl:"Wanneer opwekker en distributie beide passief zijn, of het drukverschil eenvoudigweg niet volstaat.",fr:"Quand générateur et distribution sont passifs, ou que la pression ne suffit pas.",es:"Cuando generador y distribución son pasivos, o la presión no basta.",pl:"Gdy zarówno generator, jak i strona dystrybucyjna są pasywne, lub dostępna różnica ciśnień jest po prostu niewystarczająca."},
 no:{en:"Next to another self-pumping circuit with nothing decoupling them — that is how two pumps start fighting.",uk:"Поряд з іншим самонапірним контуром без розв’язки — саме так два насоси починають боротися.",de:"Neben einer anderen selbstfördernden Schaltung ohne Entkopplung — so arbeiten zwei Pumpen gegeneinander.",nl:"Naast een andere zelfpompende schakeling zonder ontkoppeling — zo gaan twee pompen tegen elkaar in.",fr:"À côté d’un autre circuit autopompé sans découplage — c’est ainsi que deux pompes se contrarient.",es:"Junto a otro circuito con bomba propia sin desacoplo — así empiezan a estorbarse dos bombas.",pl:"Obok drugiego układu samopompującego, który nie jest niczym odsprzęgnięty — tak oto dwie pompy zaczynają ze sobą walczyć."},

  {en:"An arrangement needs exactly one self-pumping module; this can be it.",uk:"Схемі потрібен рівно один самонапірний модуль — цим може бути він.",de:"Eine Anordnung braucht genau ein selbstförderndes Modul; dies kann es sein.",nl:"Een opzet heeft precies één zelfpompende moduul nodig; dit kan het zijn.",fr:"Un montage exige exactement un module autopompé ; celui-ci peut l’être.",es:"Un montaje exige exactamente un módulo con bomba propia; este puede serlo.",pl:"Do każdego układu potrzebny jest dokładnie jeden moduł samopompujący; może to być on."}],
 cons:[{en:"One more pump to buy, power and maintain.",uk:"Ще один насос — купити, живити, обслуговувати.",de:"Eine Pumpe mehr zu kaufen, versorgen und warten.",nl:"Nog een pomp om te kopen, voeden en onderhouden.",fr:"Un circulateur de plus à acheter, alimenter, entretenir.",es:"Una bomba más que comprar, alimentar y mantener.",pl:"Trzeba kupić, zasilić i utrzymać jeszcze jedną pompę."},
  {en:"Inherits every drawback of diverting, including the return that climbs at part load.",uk:"Успадковує всі недоліки розподілу, включно зі зворотною, що росте за часткового навантаження.",de:"Erbt alle Nachteile der Verteilung, samt dem im Teillastbetrieb steigenden Rücklauf.",nl:"Erft alle nadelen van verdelen, inclusief het bij deellast stijgende retour.",fr:"Hérite de tous les défauts de la répartition, dont le retour qui grimpe.",es:"Hereda todos los defectos del reparto, incluido el retorno que sube.",pl:"Odziedzicza wszystkie wady przekierowania, łącznie z rosnącym zyskiem przy częściowym obciążeniu."}],
 comm:[{en:"The same two flow settings as without the pump.",uk:"Ті самі два налаштування витрат, що й без насоса.",de:"Dieselben zwei Stromeinstellungen wie ohne Pumpe.",nl:"Dezelfde twee debietinstellingen als zonder pomp.",fr:"Les deux mêmes réglages de débit que sans pompe.",es:"Los mismos dos ajustes de caudal que sin bomba.",pl:"Te same dwa ustawienia przepływu, co bez pompy."},
  {en:"Then read the duty point off the pressure test points and the pump curve, and check it is where you designed it.",uk:"Потім зчитайте робочу точку за манометричними точками й кривою насоса і звірте з проектною.",de:"Dann den Betriebspunkt über Druckmesspunkte und Pumpenkennlinie ablesen und mit der Auslegung vergleichen.",nl:"Lees dan het werkpunt af via de drukmeetpunten en de pompcurve en vergelijk met het ontwerp.",fr:"Puis lire le point de fonctionnement via les prises de pression et comparer au dimensionnement.",es:"Luego lea el punto de trabajo con las tomas de presión y compárelo con el diseño.",pl:"Następnie odczytaj punkt pracy na punktach pomiaru ciśnienia i krzywej pompy i sprawdź, czy jest on taki, jaki zaprojektowałeś."}],
 kit:{en:"As the version without a pump, plus one circulator sized on the duty point rather than on the pipe size.",uk:"Як версія без насоса, плюс один насос, підібраний за робочою точкою, а не за діаметром труби.",de:"Wie ohne Pumpe, zuzüglich einer nach dem Betriebspunkt ausgelegten Pumpe.",nl:"Als de versie zonder pomp, plus één pomp gekozen op het werkpunt.",fr:"Comme la version sans pompe, plus un circulateur choisi sur le point de fonctionnement.",es:"Como la versión sin bomba, más un circulador elegido por el punto de trabajo.",pl:"Podobnie jak w przypadku wersji bez pompy, dodatkowo wyposażona w pompę obiegową dobraną do punktu pracy, a nie do rozmiaru rury."}},

{id:"A5",cat:"A",model:"mix",selfPumped:true,solves:["p5","p7","p6"],creates:["p4"],
 name:{en:"Three-way mixing",uk:"Змішування триходовим",de:"Beimischung mit Dreiwegeventil",nl:"Mengen met driewegafsluiter",fr:"Mélange par vanne trois voies",es:"Mezcla con válvula de tres vías",pl:"Mieszanie trójdrożne"},
 one:{en:"Return water is blended back into the supply, so the consumer runs at its own lower temperature and a constant flow.",uk:"Зворотна вода підмішується назад у подачу: споживач працює на власній нижчій температурі за сталої витрати.",de:"Rücklaufwasser wird in den Vorlauf gemischt: der Verbraucher läuft mit eigener, niedrigerer Temperatur bei konstantem Strom.",nl:"Retourwater wordt bij de aanvoer gemengd: de gebruiker draait op zijn eigen, lagere temperatuur bij constant debiet.",fr:"Du retour est remélangé au départ : l’émetteur tourne à son propre régime, plus bas, à débit constant.",es:"Se mezcla retorno en la impulsión: el emisor trabaja a su propio régimen más bajo y caudal constante.",pl:"Woda powrotna jest ponownie mieszana z wodą dostarczaną, dzięki czemu odbiorniki mają niższą temperaturę i stały przepływ."},
 yes:{en:"Radiator and convector groups and preheater coils — anywhere output is set by temperature rather than by flow.",uk:"Радіаторні та конвекторні групи й попередні нагрівачі — де потужність задають температурою, а не витратою.",de:"Radiatoren- und Konvektorengruppen sowie Vorerhitzer — wo die Leistung über die Temperatur gestellt wird.",nl:"Radiatoren- en convectorengroepen en voorverwarmers — waar het vermogen via temperatuur wordt gesteld.",fr:"Groupes de radiateurs et convecteurs et préchauffages — où la puissance se règle en température.",es:"Grupos de radiadores y convectores y precalentamientos — donde la potencia se regula por temperatura.",pl:"Grupy grzejników i konwektorów oraz wężownice podgrzewacza wstępnego — wszędzie tam, gdzie moc jest ustawiana na podstawie temperatury, a nie przepływu."},
 no:{en:"As the only consumer circuit on a boiler: at low load it goes fully mixing and the generator is left dry.",uk:"Як єдиний контур споживача на котлі: за малого навантаження переходить у повне змішування, і генератор лишається сухим.",de:"Als einzige Verbraucherschaltung an einem Kessel: bei kleiner Last voll mischend, der Erzeuger bleibt trocken.",nl:"Als enige gebruikerkring op een ketel: bij lage belasting volledig mengend, de opwekker blijft droog.",fr:"Comme seul circuit consommateur sur une chaudière : à faible charge, mélange total, générateur à sec.",es:"Como único circuito consumidor en una caldera: a baja carga mezcla total y el generador se queda seco.",pl:"Jako jedyny obieg odbiorczy w kotle: przy niskim obciążeniu przechodzi w stan pełnego mieszania, a generator pozostaje suchy."},
 pros:[{en:"Constant flow through the consumer at every load, so the sensor keeps seeing moving water and the delay stays put.",uk:"Стала витрата через споживача за будь-якого навантаження: датчик бачить рухому воду, запізнення не росте.",de:"Konstanter Verbraucherstrom bei jeder Last: der Fühler sieht bewegtes Wasser, die Totzeit bleibt.",nl:"Constant gebruikerdebiet bij elke belasting: de opnemer ziet bewegend water, de vertraging blijft.",fr:"Débit constant à toute charge : la sonde voit de l’eau en mouvement, le retard ne bouge pas.",es:"Caudal constante a cualquier carga: la sonda ve agua en movimiento y el retardo no crece.",pl:"Stały przepływ przez odbiornik przy każdym obciążeniu, dzięki czemu czujnik cały czas wykrywa ruch wody, a opóźnienie pozostaje na swoim miejscu."},
  {en:"Return to the generator falls steadily with load — good for condensing and for a heat pump.",uk:"Зворотна до генератора рівномірно падає з навантаженням — добре для конденсації й теплового насоса.",de:"Der Rücklauf sinkt gleichmäßig mit der Last — gut für Brennwert und Wärmepumpe.",nl:"Het retour daalt gestaag met de belasting — gunstig voor condensatie en warmtepomp.",fr:"Le retour baisse régulièrement avec la charge — bon pour la condensation et la PAC.",es:"El retorno baja de forma continua con la carga — bueno para condensación y bomba de calor.",pl:"Powrót do generatora spada równomiernie wraz ze wzrostem obciążenia — korzystne dla kondensacji i pompy ciepła."}],
 cons:[{en:"Nothing caps the supply temperature: a valve stuck open sends the full network temperature to the consumer.",uk:"Ніщо не обмежує температуру подачі: заклинений відкритим клапан відправить споживачеві повну температуру мережі.",de:"Nichts begrenzt die Vorlauftemperatur: ein offen klemmendes Ventil schickt die volle Netztemperatur.",nl:"Niets begrenst de aanvoertemperatuur: een open vastgelopen afsluiter stuurt de volle nettemperatuur.",fr:"Rien ne plafonne le départ : une vanne bloquée ouverte envoie la température réseau entière.",es:"Nada limita la impulsión: una válvula bloqueada abierta envía toda la temperatura de red.",pl:"Nic nie ogranicza temperatury zasilania: zawór zablokowany w pozycji otwartej przesyła pełną temperaturę sieci do odbiornika."},
  {en:"Draws a variable flow from the network, which the distribution side must tolerate.",uk:"Бере з мережі змінну витрату, що має витримати розподільна сторона.",de:"Entnimmt dem Netz einen variablen Strom, den die Verteilseite verkraften muss.",nl:"Onttrekt variabel debiet aan het net, wat de distributiezijde moet kunnen hebben.",fr:"Prélève un débit variable que la distribution doit accepter.",es:"Toma caudal variable que la distribución debe tolerar.",pl:"Pobiera zmienny przepływ z sieci, który strona dystrybucyjna musi tolerować."},
  {en:"Needs a second balancing valve in the mixing leg so the no-load flow equals the full-load flow.",uk:"Потрібен другий балансувальний клапан у гілці змішування, щоб витрата за нуля дорівнювала повній.",de:"Braucht ein zweites Einregulierventil in der Mischleitung, damit Nulllast- und Volllaststrom gleich sind.",nl:"Vraagt een tweede inregelafsluiter in de mengtak zodat nullast- en vollastdebiet gelijk zijn.",fr:"Exige une seconde vanne d’équilibrage pour que le débit à charge nulle égale celui à pleine charge.",es:"Requiere una segunda válvula de equilibrado para igualar caudal a carga nula y plena.",pl:"Wymagany jest drugi zawór równoważący w nodze mieszającej, aby przepływ bez obciążenia był równy przepływowi przy pełnym obciążeniu."}],
 comm:[{en:"Set the full-load flow while the valve passes only network water.",uk:"Задайте витрату повного навантаження, поки клапан пропускає лише воду мережі.",de:"Vollaststrom einstellen, während das Ventil nur Netzwasser durchlässt.",nl:"Stel het vollastdebiet in terwijl de afsluiter alleen netwater doorlaat.",fr:"Régler le débit pleine charge, vanne ne passant que l’eau réseau.",es:"Ajuste el caudal a plena carga con la válvula pasando solo agua de red.",pl:"Ustaw przepływ pełnego obciążenia, podczas gdy zawór przepuszcza tylko wodę sieciową."},
  {en:"Drive it fully mixing and set the mixing-leg valve so the flow is unchanged.",uk:"Переведіть у повне змішування й задайте клапан гілки змішування так, щоб витрата не змінилася.",de:"Voll mischend fahren und das Ventil der Mischleitung so einstellen, dass der Strom gleich bleibt.",nl:"Volledig mengend zetten en de mengtakafsluiter zo instellen dat het debiet gelijk blijft.",fr:"Passer en mélange total et régler la vanne du bras de mélange à débit inchangé.",es:"Póngala en mezcla total y ajuste la válvula del ramal de mezcla sin cambiar el caudal.",pl:"Włącz pełne mieszanie i ustaw zawór mieszający tak, aby przepływ pozostał niezmieniony."},
  {en:"Check the flow direction: the temperatures either side of the mixing tee must match.",uk:"Перевірте напрямок потоку: температури обабіч трійника змішування мають збігатися.",de:"Strömungsrichtung prüfen: die Temperaturen beiderseits des Mischstücks müssen gleich sein.",nl:"Controleer de stromingsrichting: de temperaturen aan weerszijden van het mengstuk moeten gelijk zijn.",fr:"Vérifier le sens : les températures de part et d’autre du té de mélange doivent coïncider.",es:"Compruebe el sentido: las temperaturas a ambos lados de la te de mezcla deben coincidir.",pl:"Sprawdź kierunek przepływu: temperatury po obu stronach trójnika mieszającego muszą być takie same."}],
 kit:{en:"Three-way mixing valve; two balancing valves with test nipples; one circulator in the group.",uk:"Триходовий змішувальний клапан; два балансувальні з ніпелями; один насос у групі.",de:"Dreiwege-Mischventil; zwei Einregulierventile mit Messnippeln; eine Gruppenpumpe.",nl:"Driewegmengafsluiter; twee inregelafsluiters met meetnippels; één groepspomp.",fr:"Vanne mélangeuse trois voies ; deux vannes d’équilibrage ; un circulateur de groupe.",es:"Válvula mezcladora de tres vías; dos de equilibrado; un circulador de grupo.",pl:"Zawór mieszający trójdrożny, dwa zawory równoważące z króćcami pomiarowymi, jedna pompa obiegowa w grupie."}},

{id:"A6",cat:"A",model:"mix-premix",selfPumped:true,solves:["p5","p7","p12"],creates:["p4"],
 name:{en:"Three-way mixing with fixed premixing",uk:"Змішування з постійним підмішуванням",de:"Beimischung mit fester Vormischung",nl:"Mengen met vaste voormenging",fr:"Mélange avec prémélange fixe",es:"Mezcla con premezcla fija",pl:"Mieszanie trójdrożne z mieszaniem wstępnym stałym"},
 one:{en:"Mixing, plus a fixed share of return water held in by a balancing valve — so the supply temperature has a ceiling that cannot switch off.",uk:"Змішування плюс постійна частка зворотної, яку тримає балансувальний клапан: стеля температури подачі не вимикається.",de:"Beimischung plus ein fest eingeregelter Rücklaufanteil — die Vorlauftemperatur hat eine Obergrenze, die nicht ausfallen kann.",nl:"Mengen plus een vast ingeregelde retourfractie — de aanvoertemperatuur heeft een bovengrens die niet kan uitvallen.",fr:"Mélange plus une fraction fixe de retour maintenue par une vanne d’équilibrage — un plafond qui ne peut pas s’éteindre.",es:"Mezcla más una fracción fija de retorno fijada por una válvula de equilibrado — un techo que no puede apagarse.",pl:"Mieszanie oraz stała ilość wody powrotnej zatrzymywana przez zawór równoważący — dzięki czemu temperatura zasilania ma górną granicę, której nie można wyłączyć."},
 yes:{en:"Low-temperature groups, above all underfloor heating, where an overtemperature is a building defect rather than a comfort complaint.",uk:"Низькотемпературні групи, передусім тепла підлога, де перегрів — будівельний дефект, а не скарга на комфорт.",de:"Niedertemperaturgruppen, vor allem Fußbodenheizung, wo Übertemperatur ein Bauschaden ist.",nl:"LTV-groepen, vooral vloerverwarming, waar te hoge temperatuur een bouwkundig gebrek is.",fr:"Groupes basse température, surtout plancher chauffant, où la surchauffe est un désordre du bâti.",es:"Grupos de baja temperatura, sobre todo suelo radiante, donde el exceso es un daño constructivo.",pl:"Grupy niskotemperaturowe, przede wszystkim ogrzewanie podłogowe, gdzie zbyt wysoka temperatura jest wadą budynku, a nie problemem związanym z komfortem."},
 no:{en:"When the consumer genuinely needs the full network temperature at design conditions.",uk:"Коли споживачеві справді потрібна повна температура мережі за розрахункових умов.",de:"Wenn der Verbraucher im Auslegungsfall wirklich die volle Netztemperatur braucht.",nl:"Wanneer de gebruiker in het ontwerppunt echt de volle nettemperatuur nodig heeft.",fr:"Quand l’émetteur a réellement besoin de la température réseau au dimensionnement.",es:"Cuando el emisor necesita de verdad la temperatura de red en diseño.",pl:"Gdy użytkownik rzeczywiście potrzebuje pełnej temperatury sieci w warunkach projektowych."},
 pros:[{en:"The ceiling is built from pipework and a balancing valve, not from a controller — a stuck valve or a dead sensor cannot cook the floor.",uk:"Стеля зроблена з труб і балансувального клапана, а не з автоматики: заклинений клапан чи мертвий датчик не зварять підлогу.",de:"Die Obergrenze entsteht aus Rohrleitung und Einregulierventil, nicht aus einem Regler — ein klemmendes Ventil kann den Boden nicht überhitzen.",nl:"De bovengrens komt uit leidingwerk en een inregelafsluiter, niet uit een regelaar — een vastgelopen afsluiter kookt de vloer niet.",fr:"Le plafond vient de la tuyauterie et d’une vanne d’équilibrage, pas d’un régulateur — une vanne bloquée ne cuit pas le plancher.",es:"El techo lo dan la tubería y una válvula de equilibrado, no un regulador — una válvula bloqueada no cuece el suelo.",pl:"Sufit składa się z rurociągów i zaworu równoważącego, a nie ze sterownika — zacięty zawór lub niesprawny czujnik nie mogą uszkodzić podłogi."},
  {en:"Keeps every advantage of plain mixing: constant consumer flow, control by temperature.",uk:"Зберігає всі переваги простого змішування: стала витрата, керування температурою.",de:"Behält alle Vorteile der einfachen Beimischung: konstanter Strom, Regelung über die Temperatur.",nl:"Behoudt alle voordelen van gewoon mengen: constant debiet, regeling via temperatuur.",fr:"Conserve tous les avantages du mélange simple : débit constant, régulation en température.",es:"Conserva todas las ventajas de la mezcla simple: caudal constante, regulación por temperatura.",pl:"Zachowuje wszystkie zalety zwykłego mieszania: stały przepływ odbiornika, kontrola za pomocą temperatury."}],
 cons:[{en:"Three balancing valves instead of two, and the premix ratio must be reset whenever the design regime changes.",uk:"Три балансувальні клапани замість двох, і коефіцієнт підмісу треба переналаштовувати при зміні режиму.",de:"Drei statt zwei Einregulierventile, und das Vormischverhältnis ist bei Regimewechsel neu einzustellen.",nl:"Drie in plaats van twee inregelafsluiters, en de voormengverhouding moet bij regimewijziging opnieuw.",fr:"Trois vannes d’équilibrage au lieu de deux, à reprendre si le régime change.",es:"Tres válvulas de equilibrado en vez de dos, a reajustar si cambia el régimen.",pl:"Trzy zawory równoważące zamiast dwóch i konieczność ponownego ustawienia proporcji mieszanki wstępnej przy każdej zmianie schematu projektu."},
  {en:"The share is set once at commissioning and does not adapt to anything afterwards.",uk:"Частку задають раз під час налагодження, далі вона ні до чого не адаптується.",de:"Der Anteil wird einmal bei der Inbetriebnahme eingestellt und passt sich danach an nichts an.",nl:"De fractie wordt eenmalig ingeregeld en past zich daarna nergens aan aan.",fr:"La fraction est réglée une fois à la mise en service et ne s’adapte plus.",es:"La fracción se fija una vez en la puesta en marcha y luego no se adapta.",pl:"Udział ustalany jest jednorazowo w momencie uruchomienia i nie ulega żadnym późniejszym zmianom."}],
 comm:[{en:"Set the full-load flow with the valve fully open to network water and the mixing port shut.",uk:"Задайте витрату повного навантаження за повністю відкритого на мережу клапана і закритого порту змішування.",de:"Vollaststrom einstellen bei ganz auf Netzwasser geöffnetem Ventil und geschlossenem Mischanschluss.",nl:"Stel het vollastdebiet in met de afsluiter volledig open voor netwater en de mengpoort dicht.",fr:"Régler le débit pleine charge, vanne ouverte sur le réseau et orifice de mélange fermé.",es:"Ajuste el caudal a plena carga con la válvula abierta a red y el orificio de mezcla cerrado.",pl:"Ustaw przepływ pełnego obciążenia przy zaworze całkowicie otwartym dla wody sieciowej i zamkniętym porcie mieszającym."},
  {en:"Set the premix flow with its own balancing valve.",uk:"Задайте витрату підмішування власним балансувальним клапаном.",de:"Beimischstrom am eigenen Einregulierventil einstellen.",nl:"Stel het voormengdebiet in met de eigen inregelafsluiter.",fr:"Régler le débit de prémélange à sa propre vanne d’équilibrage.",es:"Ajuste el caudal de premezcla con su propia válvula.",pl:"Ustaw przepływ mieszanki wstępnej za pomocą własnego zaworu równoważącego."},
  {en:"With the valve fully mixing, set the third valve so the group flow is unchanged.",uk:"За повного змішування задайте третій клапан так, щоб витрата групи не змінилася.",de:"Bei voll mischendem Ventil das dritte Ventil so einstellen, dass der Gruppenstrom gleich bleibt.",nl:"Zet bij volledig mengen de derde afsluiter zo dat het groepsdebiet gelijk blijft.",fr:"En mélange total, régler la troisième vanne à débit de groupe inchangé.",es:"En mezcla total, ajuste la tercera válvula sin cambiar el caudal del grupo.",pl:"Gdy zawór będzie całkowicie mieszał, ustaw trzeci zawór tak, aby przepływ grupy pozostał niezmieniony."}],
 kit:{en:"Three-way mixing valve; three balancing valves; one circulator.",uk:"Триходовий змішувальний клапан; три балансувальні; один насос.",de:"Dreiwege-Mischventil; drei Einregulierventile; eine Pumpe.",nl:"Driewegmengafsluiter; drie inregelafsluiters; één pomp.",fr:"Vanne mélangeuse trois voies ; trois vannes d’équilibrage ; un circulateur.",es:"Válvula mezcladora de tres vías; tres de equilibrado; un circulador.",pl:"Zawór mieszający trójdrożny, trzy zawory równoważące, jedna pompa obiegowa."}},

{id:"A7",cat:"A",model:"inject2",selfPumped:true,solves:["p5","p7","p8"],creates:["p4"],
 name:{en:"Injection with a two-way valve",uk:"Інжекція двоходовим",de:"Einspritzung mit Durchgangsventil",nl:"Injectie met tweewegafsluiter",fr:"Injection par vanne deux voies",es:"Inyección con válvula de dos vías",pl:"Układ wtryskowy z zaworem dwudrożnym"},
 one:{en:"A short bridge separates the two loops; the valve meters how much hot water is injected across it.",uk:"Коротка перемичка розділяє два контури; клапан дозує, скільки гарячої води впорскується через неї.",de:"Eine kurze Brücke trennt die beiden Kreise; das Ventil dosiert, wie viel heißes Wasser eingespritzt wird.",nl:"Een korte brug scheidt de twee kringen; de afsluiter doseert hoeveel heet water erdoorheen wordt gespoten.",fr:"Un pont court sépare les deux boucles ; la vanne dose l’eau chaude injectée.",es:"Un puente corto separa los dos lazos; la válvula dosifica el agua caliente inyectada.",pl:"Krótki mostek oddziela dwie pętle; zawór mierzy ilość gorącej wody wtryskiwanej przez niego."},
 yes:{en:"Long distribution runs and groups far from the plant room, where the two loops must not feel each other's pressure.",uk:"Довгі магістралі й групи далеко від теплопункту, де контури не повинні відчувати тиск один одного.",de:"Lange Verteilstrecken und weit entfernte Gruppen, wo sich die Kreise nicht gegenseitig spüren dürfen.",nl:"Lange distributietracés en groepen ver van de technische ruimte, waar de kringen elkaars druk niet mogen voelen.",fr:"Longues distributions et groupes éloignés, où les boucles ne doivent pas se sentir.",es:"Distribuciones largas y grupos lejanos, donde los lazos no deben sentirse mutuamente.",pl:"Długie odcinki dystrybucyjne i grupy zlokalizowane z dala od pomieszczenia maszynowni, w których dwa obiegi nie mogą odczuwać wzajemnego nacisku."},
 no:{en:"Where the bridge cannot be kept short and low-resistance — a long bridge stops decoupling and starts mixing.",uk:"Там, де перемичку не зробити короткою і малоопірною: довга перемичка перестає розв’язувати й починає змішувати.",de:"Wo die Brücke nicht kurz und widerstandsarm bleibt — eine lange Brücke entkoppelt nicht mehr, sie mischt.",nl:"Waar de brug niet kort en weerstandsarm kan blijven — een lange brug ontkoppelt niet meer maar mengt.",fr:"Là où le pont ne peut rester court et peu résistant — un pont long ne découple plus, il mélange.",es:"Donde el puente no pueda ser corto y de baja resistencia — un puente largo ya no desacopla, mezcla.",pl:"Jeśli mostek nie może być krótki i mieć niskiej rezystancji, długi mostek przerywa rozsprzęganie i zaczyna mieszać."},
 pros:[{en:"The two loops are hydraulically independent, so neither pump moves the other's duty point.",uk:"Контури гідравлічно незалежні, тож жоден насос не зсуває робочу точку іншого.",de:"Die Kreise sind hydraulisch unabhängig, keine Pumpe verschiebt den Betriebspunkt der anderen.",nl:"De kringen zijn hydraulisch onafhankelijk; geen pomp verzet het werkpunt van de ander.",fr:"Les boucles sont indépendantes ; aucune pompe ne déplace le point de l’autre.",es:"Los lazos son independientes; ninguna bomba desplaza el punto de la otra.",pl:"Obie pętle są hydraulicznie niezależne, więc żadna z pomp nie zmienia punktu pracy drugiej pompy."},
  {en:"Variable primary flow, so the distribution pump can still be turned down.",uk:"Змінна первинна витрата, тож розподільний насос можна прибирати.",de:"Variabler Primärstrom, die Verteilpumpe kann heruntergefahren werden.",nl:"Variabel primair debiet, dus de distributiepomp kan omlaag.",fr:"Débit primaire variable : la pompe de distribution peut ralentir.",es:"Caudal primario variable: la bomba de distribución puede bajar.",pl:"Zmienny przepływ pierwotny, dzięki czemu możliwe jest obniżenie wydajności pompy dystrybucyjnej."},
  {en:"Constant secondary flow, so the emitter and its sensor behave as in any mixing group.",uk:"Стала вторинна витрата: прилад і датчик поводяться як у будь-якій змішувальній групі.",de:"Konstanter Sekundärstrom: Heizfläche und Fühler verhalten sich wie in jeder Mischgruppe.",nl:"Constant secundair debiet: afgifte en opnemer gedragen zich als in elke menggroep.",fr:"Débit secondaire constant : l’émetteur et sa sonde se comportent comme en groupe mélangeur.",es:"Caudal secundario constante: el emisor y su sonda se comportan como en cualquier grupo de mezcla.",pl:"Stały przepływ wtórny, więc emiter i jego czujnik zachowują się jak w dowolnej grupie mieszającej."}],
 cons:[{en:"Two pumps to buy and commission instead of one.",uk:"Два насоси купити й налагодити замість одного.",de:"Zwei Pumpen statt einer zu kaufen und einzuregulieren.",nl:"Twee pompen kopen en inregelen in plaats van één.",fr:"Deux pompes à acheter et régler au lieu d’une.",es:"Dos bombas que comprar y ajustar en vez de una.",pl:"Zamiast jednej trzeba kupić i uruchomić dwie pompy."},
  {en:"The injection valve works on a small flow at a large temperature difference — sizing it by pipe diameter guarantees a bad authority.",uk:"Інжекційний клапан працює на малій витраті за великого перепаду температур: підбір за діаметром труби гарантує поганий авторитет.",de:"Das Einspritzventil arbeitet mit kleinem Strom bei großem Temperaturunterschied — Auslegung nach Rohrdurchmesser garantiert schlechte Autorität.",nl:"De injectieafsluiter werkt op een klein debiet bij groot temperatuurverschil — dimensioneren op leidingdiameter geeft gegarandeerd slechte autoriteit.",fr:"La vanne d’injection travaille à faible débit et fort écart — la dimensionner au diamètre garantit une mauvaise autorité.",es:"La válvula de inyección trabaja con caudal pequeño y gran salto — dimensionarla por diámetro garantiza mala autoridad.",pl:"Zawór wtryskowy działa przy małym przepływie i dużej różnicy temperatur — dobór jego rozmiaru na podstawie średnicy rury gwarantuje złą ocenę."}],
 comm:[{en:"Set the secondary flow first, at the group pump, with the injection valve shut.",uk:"Спершу задайте вторинну витрату на груповому насосі за закритого інжекційного клапана.",de:"Zuerst den Sekundärstrom an der Gruppenpumpe einstellen, Einspritzventil geschlossen.",nl:"Stel eerst het secundaire debiet in bij de groepspomp, injectieafsluiter dicht.",fr:"Régler d’abord le débit secondaire à la pompe de groupe, vanne d’injection fermée.",es:"Ajuste primero el caudal secundario en la bomba de grupo, con la válvula de inyección cerrada.",pl:"Najpierw należy ustawić przepływ wtórny przy pompie grupowej przy zamkniętym zaworze wtryskowym."},
  {en:"Then set the maximum injection flow and confirm the bridge carries the difference in the expected direction.",uk:"Потім задайте максимальну витрату впорскування і переконайтеся, що перемичка несе різницю в очікуваному напрямку.",de:"Dann den maximalen Einspritzstrom einstellen und prüfen, dass die Brücke die Differenz in der erwarteten Richtung führt.",nl:"Stel dan het maximale injectiedebiet in en controleer dat de brug het verschil in de verwachte richting voert.",fr:"Puis régler l’injection maximale et vérifier le sens du débit dans le pont.",es:"Luego ajuste la inyección máxima y compruebe el sentido del caudal en el puente.",pl:"Następnie ustaw maksymalny przepływ wtrysku i sprawdź, czy mostek przenosi różnicę w oczekiwanym kierunku."}],
 kit:{en:"Two-way injection valve with a high authority; balancing valves on both loops; two circulators; a short, generously sized bridge.",uk:"Двоходовий інжекційний клапан з високим авторитетом; балансувальні клапани на обох контурах; два насоси; коротка щедра перемичка.",de:"Zweiwege-Einspritzventil mit hoher Autorität; Einregulierventile in beiden Kreisen; zwei Pumpen; kurze, großzügige Brücke.",nl:"Tweeweg-injectieafsluiter met hoge autoriteit; inregelafsluiters in beide kringen; twee pompen; korte, ruime brug.",fr:"Vanne d’injection deux voies à forte autorité ; vannes d’équilibrage sur les deux boucles ; deux circulateurs ; pont court et large.",es:"Válvula de inyección de dos vías con alta autoridad; válvulas de equilibrado en ambos lazos; dos circuladores; puente corto y amplio.",pl:"Dwukierunkowy zawór wtryskowy o dużym autorytecie, zawory równoważące na obu pętlach, dwa obiegowe, krótki mostek o odpowiednich rozmiarach."}},

{id:"A8",cat:"A",model:"inject3",selfPumped:true,solves:["p1","p5","p7","p8"],creates:["p2","p9"],
 name:{en:"Injection with a three-way valve",uk:"Інжекція триходовим",de:"Einspritzung mit Dreiwegeventil",nl:"Injectie met driewegafsluiter",fr:"Injection par vanne trois voies",es:"Inyección con válvula de tres vías",pl:"Układ wtryskowy z zaworem trójdrożnym"},
 one:{en:"The same bridge, but the primary flow is held constant and the valve only decides how much of it crosses over.",uk:"Та сама перемичка, але первинна витрата стала, і клапан лише вирішує, скільки з неї переходить.",de:"Dieselbe Brücke, aber der Primärstrom bleibt konstant und das Ventil bestimmt nur, wie viel übertritt.",nl:"Dezelfde brug, maar het primaire debiet blijft constant; de afsluiter bepaalt alleen hoeveel oversteekt.",fr:"Le même pont, mais le débit primaire reste constant et la vanne décide seulement de la part transférée.",es:"El mismo puente, pero el caudal primario es constante y la válvula solo decide cuánto cruza.",pl:"Ten sam most, ale przepływ pierwotny jest stały, a zawór decyduje tylko o tym, jaka jego część przechodzi przez most."},
 yes:{en:"When the same circuit has to decouple two loops and keep a minimum flow through the generator at the same time.",uk:"Коли одна схема має і розв’язати два контури, і водночас тримати мінімальну витрату через генератор.",de:"Wenn dieselbe Schaltung zwei Kreise entkoppeln und zugleich den Mindeststrom durch den Erzeuger halten muss.",nl:"Wanneer dezelfde schakeling twee kringen moet ontkoppelen én het minimumdebiet door de opwekker moet houden.",fr:"Quand le même circuit doit découpler deux boucles et garantir le débit minimal du générateur.",es:"Cuando el mismo circuito debe desacoplar dos lazos y mantener el caudal mínimo del generador.",pl:"Gdy ten sam obwód musi rozdzielić dwie pętle i jednocześnie utrzymać minimalny przepływ przez generator."},
 no:{en:"On a condensing generator: constant primary flow with a closing valve drives the return up just as diverting does.",uk:"На конденсаційному генераторі: стала первинна витрата з закривним клапаном піднімає зворотну так само, як розподіл.",de:"An einem Brennwerterzeuger: konstanter Primärstrom mit schließendem Ventil hebt den Rücklauf wie beim Verteilen.",nl:"Bij een condenserende opwekker: constant primair debiet met sluitende afsluiter tilt het retour net als bij verdelen.",fr:"Sur un générateur à condensation : débit primaire constant et vanne qui ferme font monter le retour.",es:"En un generador de condensación: caudal primario constante con válvula que cierra sube el retorno.",pl:"W przypadku generatora kondensacyjnego: stały przepływ pierwotny z zaworem zamykającym podnosi strumień powrotny w taki sam sposób, jak ma to miejsce w przypadku rozdzielania."},
 pros:[{en:"Decouples the loops and guarantees generator flow in one circuit.",uk:"Розв’язує контури й гарантує витрату генератора однією схемою.",de:"Entkoppelt die Kreise und sichert den Erzeugerstrom in einer Schaltung.",nl:"Ontkoppelt de kringen én waarborgt het opwekkerdebiet in één schakeling.",fr:"Découple les boucles et garantit le débit générateur d’un seul montage.",es:"Desacopla los lazos y garantiza el caudal del generador en un solo montaje.",pl:"Rozłącza pętle i gwarantuje przepływ generatora w jednym obwodzie."},
  {en:"Both flows are constant, so both loops are easy to balance and stay balanced.",uk:"Обидві витрати сталі, тож обидва контури легко збалансувати, і баланс тримається.",de:"Beide Ströme sind konstant, beide Kreise lassen sich leicht abgleichen und bleiben abgeglichen.",nl:"Beide debieten zijn constant, dus beide kringen zijn makkelijk in te regelen en blijven het.",fr:"Les deux débits sont constants : les deux boucles s’équilibrent facilement et le restent.",es:"Ambos caudales son constantes: los dos lazos se equilibran fácilmente y se mantienen.",pl:"Oba przepływy są stałe, więc obie pętle są łatwe do zrównoważenia i utrzymania równowagi."}],
 cons:[{en:"The return to the generator climbs as the load falls, exactly as with any constant-primary circuit.",uk:"Зворотна до генератора росте зі спадом навантаження — як у будь-якої схеми зі сталим первинним контуром.",de:"Der Rücklauf steigt mit fallender Last, wie bei jeder Schaltung mit konstantem Primärstrom.",nl:"Het retour stijgt bij dalende belasting, zoals bij elke schakeling met constant primair debiet.",fr:"Le retour monte quand la charge baisse, comme dans tout circuit à primaire constant.",es:"El retorno sube al bajar la carga, como en todo circuito de primario constante.",pl:"Prąd powrotny do generatora rośnie w miarę jak obciążenie spada, dokładnie tak samo jak w każdym obwodzie o stałym napięciu pierwotnym."},
  {en:"Constant primary flow means the distribution pump never gets to slow down.",uk:"Стала первинна витрата означає, що розподільний насос ніколи не сповільнюється.",de:"Konstanter Primärstrom heißt, die Verteilpumpe kann nie langsamer laufen.",nl:"Constant primair debiet betekent dat de distributiepomp nooit langzamer draait.",fr:"Débit primaire constant : la pompe de distribution ne ralentit jamais.",es:"Caudal primario constante: la bomba de distribución nunca baja.",pl:"Stały przepływ pierwotny oznacza, że ​​pompa dystrybucyjna nigdy nie zwalnia."}],
 comm:[{en:"Set the primary flow first; it must stay constant whatever the valve does.",uk:"Спершу задайте первинну витрату: вона має лишатися сталою за будь-якого положення клапана.",de:"Zuerst den Primärstrom einstellen; er muss unabhängig vom Ventil konstant bleiben.",nl:"Stel eerst het primaire debiet in; het moet constant blijven wat de afsluiter ook doet.",fr:"Régler d’abord le débit primaire ; il doit rester constant quoi que fasse la vanne.",es:"Ajuste primero el caudal primario; debe permanecer constante haga lo que haga la válvula.",pl:"Najpierw należy ustawić przepływ pierwotny; niezależnie od tego, jaką pracę wykonuje zawór, musi on pozostać stały."},
  {en:"Then the secondary flow at the group pump, and check the bridge direction at full and at part load.",uk:"Потім вторинну на груповому насосі й перевірте напрямок у перемичці за повного й часткового навантаження.",de:"Dann den Sekundärstrom an der Gruppenpumpe und die Brückenrichtung bei Voll- und Teillast prüfen.",nl:"Daarna het secundaire debiet bij de groepspomp en de brugrichting bij vol- en deellast controleren.",fr:"Puis le débit secondaire à la pompe de groupe, et vérifier le sens du pont à pleine et à charge partielle.",es:"Luego el caudal secundario en la bomba de grupo y compruebe el sentido del puente a plena y parcial carga.",pl:"Następnie sprawdź przepływ wtórny w pompie grupowej i kierunek mostu przy pełnym i częściowym obciążeniu."}],
 kit:{en:"Three-way injection valve; balancing valves on both loops; two circulators; a short bridge.",uk:"Триходовий інжекційний клапан; балансувальні клапани на обох контурах; два насоси; коротка перемичка.",de:"Dreiwege-Einspritzventil; Einregulierventile in beiden Kreisen; zwei Pumpen; kurze Brücke.",nl:"Drieweg-injectieafsluiter; inregelafsluiters in beide kringen; twee pompen; korte brug.",fr:"Vanne d’injection trois voies ; vannes d’équilibrage sur les deux boucles ; deux circulateurs ; pont court.",es:"Válvula de inyección de tres vías; válvulas de equilibrado en ambos lazos; dos circuladores; puente corto.",pl:"Trójdrożny zawór wtryskowy, zawory równoważące na obu pętlach, dwa obiegowe, krótki mostek."}},
{id:"B1",cat:"B",model:"gen-passive",selfPumped:false,solves:[],creates:["p4"],
 name:{en:"Generator without its own pump",uk:"Генератор без власного насоса",de:"Erzeuger ohne eigene Pumpe",nl:"Opwekker zonder eigen pomp",fr:"Générateur sans circulateur",es:"Generador sin bomba propia",pl:"Źródło ciepła bez własnej pompy"},
 one:{en:"Whatever flows through the generator is whatever the consumer circuits happen to send it.",uk:"Через генератор тече рівно те, що йому відправлять контури споживачів.",de:"Durch den Erzeuger fließt genau das, was ihm die Verbraucherkreise schicken.",nl:"Door de opwekker stroomt precies wat de gebruikerkringen sturen.",fr:"Il ne passe dans le générateur que ce que les circuits consommateurs lui envoient.",es:"Por el generador pasa solo lo que le envían los circuitos consumidores.",pl:"Wszystko, co przepływa przez generator, jest tym, co przypadkowo wyślą obwody odbiorcze."},
 yes:{en:"When at least one consumer circuit keeps a constant flow, so a minimum through the generator is guaranteed at every load.",uk:"Коли хоча б один контур споживача тримає сталу витрату, і мінімум через генератор гарантований завжди.",de:"Wenn mindestens ein Verbraucherkreis konstanten Strom hält, sodass ein Minimum immer gesichert ist.",nl:"Wanneer ten minste één gebruikerkring constant debiet houdt, zodat een minimum altijd verzekerd is.",fr:"Quand au moins un circuit garde un débit constant, garantissant un minimum à toute charge.",es:"Cuando al menos un circuito mantiene caudal constante, garantizando un mínimo siempre.",pl:"Gdy przynajmniej jeden obwód odbiorczy utrzymuje stały przepływ, to przy każdym obciążeniu gwarantowane jest minimalne natężenie przepływu przez generator."},
 no:{en:"When every consumer circuit mixes or throttles. Then the flow through the generator disappears at low load and the boiler cycles on its high limit.",uk:"Коли всі контури змішують або дроселюють: витрата через генератор зникає за малого навантаження, і котел тактує за максимальним термостатом.",de:"Wenn alle Kreise mischen oder drosseln. Dann verschwindet der Strom bei kleiner Last und der Kessel taktet über den Maximalthermostaten.",nl:"Wanneer alle kringen mengen of smoren. Dan verdwijnt het debiet bij lage belasting en pendelt de ketel op de maximaalthermostaat.",fr:"Quand tous les circuits mélangent ou étranglent : le débit disparaît à faible charge et la chaudière cycle.",es:"Cuando todos los circuitos mezclan o estrangulan: el caudal desaparece a baja carga y la caldera cicla.",pl:"Gdy wszystkie obwody odbiorcze mieszają lub dławią przepływ, przepływ przez generator zanika przy niskim obciążeniu, a kocioł pracuje na swoim górnym limicie."},
 pros:[{en:"Nothing to buy, nothing to power, nothing to fail.",uk:"Нічого купувати, нічого живити, нічому ламатися.",de:"Nichts zu kaufen, nichts zu versorgen, nichts, was ausfällt.",nl:"Niets te kopen, niets te voeden, niets dat uitvalt.",fr:"Rien à acheter, rien à alimenter, rien qui tombe en panne.",es:"Nada que comprar, alimentar ni que falle.",pl:"Nic do kupienia, nic do zasilania, nic do zepsucia."},
  {en:"No second pump to interact with the consumer pumps.",uk:"Немає другого насоса, який взаємодіяв би з насосами споживачів.",de:"Keine zweite Pumpe, die mit den Verbraucherpumpen wechselwirkt.",nl:"Geen tweede pomp die met de gebruikerpompen interfereert.",fr:"Pas de seconde pompe qui interagit avec celles des émetteurs.",es:"Sin segunda bomba que interactúe con las de los consumidores.",pl:"Brak drugiej pompy, która mogłaby współpracować z pompami odbiorczymi."}],
 cons:[{en:"Offers no protection of its own — the guarantee has to come from the choice of consumer circuits.",uk:"Сам захисту не дає: гарантію має забезпечити вибір контурів споживачів.",de:"Bietet selbst keinen Schutz — die Sicherung kommt aus der Wahl der Verbraucherkreise.",nl:"Biedt zelf geen bescherming — de waarborg komt uit de keuze van gebruikerkringen.",fr:"N’offre aucune protection propre — la garantie vient du choix des circuits.",es:"No ofrece protección propia — la garantía viene de la elección de circuitos.",pl:"Nie zapewnia własnej ochrony — gwarancja musi wynikać z wyboru obwodów odbiorczych."}],
 comm:[{en:"At minimum load, verify that a measurable flow still passes the generator. This is the check people skip.",uk:"За мінімального навантаження переконайтеся, що через генератор досі йде вимірна витрата. Саме цю перевірку пропускають.",de:"Bei Minimallast prüfen, dass noch ein messbarer Strom durch den Erzeuger geht. Genau diese Prüfung wird ausgelassen.",nl:"Controleer bij minimale belasting of er nog meetbaar debiet door de opwekker gaat. Juist deze controle wordt overgeslagen.",fr:"À charge minimale, vérifier qu’un débit mesurable traverse le générateur. C’est le contrôle qu’on saute.",es:"A carga mínima, verifique que aún pasa caudal medible por el generador. Esta es la comprobación que se salta.",pl:"Przy minimalnym obciążeniu sprawdź, czy mierzalny przepływ nadal przepływa przez generator. To jest kontrola, którą ludzie pomijają."}],
 kit:{en:"Isolating valves and one balancing valve on the generator branch; no pump.",uk:"Запірна арматура й один балансувальний клапан на гілці генератора; насоса немає.",de:"Absperrungen und ein Einregulierventil im Erzeugerzweig; keine Pumpe.",nl:"Afsluiters en één inregelafsluiter in de opwekkertak; geen pomp.",fr:"Vannes d’isolement et une vanne d’équilibrage ; pas de pompe.",es:"Válvulas de corte y una de equilibrado; sin bomba.",pl:"Zawory odcinające i jeden zawór równoważący na odgałęzieniu generatora; brak pompy."}},

{id:"B2",cat:"B",model:"gen-active",selfPumped:true,solves:["p4"],creates:["p8"],
 name:{en:"Generator with its own pump",uk:"Генератор із власним насосом",de:"Erzeuger mit eigener Pumpe",nl:"Opwekker met eigen pomp",fr:"Générateur avec circulateur",es:"Generador con bomba propia",pl:"Źródło ciepła z własną pompą"},
 one:{en:"The generator sets its own flow instead of waiting for the consumers to send some.",uk:"Генератор сам задає свою витрату замість того, щоб чекати на споживачів.",de:"Der Erzeuger stellt seinen Durchsatz selbst ein, statt auf die Verbraucher zu warten.",nl:"De opwekker bepaalt zijn eigen doorstroming in plaats van op de gebruikers te wachten.",fr:"Le générateur fixe lui-même son débit au lieu d’attendre les émetteurs.",es:"El generador fija su propio caudal en vez de esperar a los consumidores.",pl:"Generator ustala swój własny przepływ zamiast czekać, aż odbiorcy go wyślą."},
 yes:{en:"Larger boilers with a stated minimum flow, and any arrangement whose consumer circuits are all passive.",uk:"Більші котли із заданою мінімальною витратою і будь-яка схема, де всі контури споживачів пасивні.",de:"Größere Kessel mit vorgegebenem Mindeststrom und Anordnungen mit ausschließlich passiven Verbraucherkreisen.",nl:"Grotere ketels met voorgeschreven minimumdebiet en opzetten met uitsluitend passieve gebruikerkringen.",fr:"Chaudières importantes à débit minimal imposé, et montages à circuits tous passifs.",es:"Calderas mayores con caudal mínimo exigido y montajes con circuitos todos pasivos.",pl:"Większe kotły z określonym minimalnym przepływem oraz wszelkie układy, w których wszystkie obwody odbiorcze są pasywne."},
 no:{en:"Beside self-pumping consumer circuits with nothing decoupling them.",uk:"Поряд із самонапірними контурами споживачів без розв’язки між ними.",de:"Neben selbstfördernden Verbraucherkreisen ohne Entkopplung.",nl:"Naast zelfpompende gebruikerkringen zonder ontkoppeling.",fr:"À côté de circuits autopompés sans découplage.",es:"Junto a circuitos con bomba propia sin desacoplo.",pl:"Obok samopompujących obwodów odbiorczych, które nie są niczym odsprzęgane."},
 pros:[{en:"Guarantees flow through the generator no matter what the consumers do.",uk:"Гарантує витрату через генератор незалежно від дій споживачів.",de:"Sichert den Durchsatz unabhängig vom Verbraucherverhalten.",nl:"Waarborgt doorstroming ongeacht wat de gebruikers doen.",fr:"Garantit le débit quoi que fassent les émetteurs.",es:"Garantiza el caudal haga lo que haga el consumo.",pl:"Gwarancje przepływają przez generator bez względu na to, co robią konsumenci."},
  {en:"Lets the generator run its own flow rate, which most manufacturers now specify tightly.",uk:"Дозволяє генератору тримати власну витрату, яку виробники нині задають жорстко.",de:"Lässt den Erzeuger seinen eigenen Volumenstrom fahren, den Hersteller heute eng vorgeben.",nl:"Laat de opwekker zijn eigen debiet aanhouden, dat fabrikanten tegenwoordig strak voorschrijven.",fr:"Permet au générateur de tenir son propre débit, aujourd’hui strictement spécifié.",es:"Permite al generador mantener su propio caudal, hoy especificado con precisión.",pl:"Umożliwia generatorowi pracę z własnym natężeniem przepływu, które większość producentów obecnie ściśle określa."}],
 cons:[{en:"Two pumps in one circuit interact: without decoupling each moves the other's duty point.",uk:"Два насоси в одному контурі взаємодіють: без розв’язки кожен зсуває робочу точку іншого.",de:"Zwei Pumpen in einem Kreis beeinflussen sich: ohne Entkopplung verschiebt jede den Punkt der anderen.",nl:"Twee pompen in één circuit beïnvloeden elkaar: zonder ontkoppeling verzet elk het werkpunt van de ander.",fr:"Deux pompes dans un circuit interagissent : sans découplage chacune déplace le point de l’autre.",es:"Dos bombas en un circuito interactúan: sin desacoplo cada una desplaza el punto de la otra.",pl:"Dwie pompy w jednym obwodzie oddziałują na siebie: bez rozłączania każda z nich przesuwa punkt pracy drugiej."},
  {en:"A generator pump alone does not fix the return temperature — it only fixes the flow.",uk:"Насос генератора сам по собі не виправляє температуру зворотної — лише витрату.",de:"Die Erzeugerpumpe allein korrigiert nicht die Rücklauftemperatur, nur den Strom.",nl:"Een opwekkerpomp alleen corrigeert het retour niet, alleen het debiet.",fr:"Une pompe générateur seule ne corrige pas le retour, seulement le débit.",es:"La bomba del generador sola no corrige el retorno, solo el caudal.",pl:"Sama pompa generatorowa nie ustala temperatury powrotu — ustala jedynie przepływ."}],
 comm:[{en:"Set the generator flow at its balancing valve, then read the duty point off the test points and the pump curve.",uk:"Задайте витрату генератора його балансувальним клапаном, потім зчитайте робочу точку за точками замірів і кривою.",de:"Erzeugerstrom am Einregulierventil einstellen, dann Betriebspunkt über Messpunkte und Kennlinie ablesen.",nl:"Stel het opwekkerdebiet in met de inregelafsluiter, lees dan het werkpunt af.",fr:"Régler le débit à la vanne d’équilibrage, puis lire le point de fonctionnement.",es:"Ajuste el caudal en su válvula de equilibrado y lea el punto de trabajo.",pl:"Ustaw przepływ generatora na zaworze równoważącym, a następnie odczytaj punkt pracy w punktach testowych i na krzywej pompy."}],
 kit:{en:"One circulator on the generator branch, balancing valve with test nipples, pressure and temperature test points.",uk:"Один насос на гілці генератора, балансувальний клапан із ніпелями, точки замірів тиску й температури.",de:"Eine Pumpe im Erzeugerzweig, Einregulierventil mit Messnippeln, Druck- und Temperaturmesspunkte.",nl:"Eén pomp in de opwekkertak, inregelafsluiter met meetnippels, druk- en temperatuurmeetpunten.",fr:"Un circulateur, une vanne d’équilibrage, prises de pression et température.",es:"Un circulador, válvula de equilibrado, tomas de presión y temperatura.",pl:"Jeden obieg na odgałęzieniu generatora, zawór równoważący z króćcami pomiarowymi, punkty pomiarowe ciśnienia i temperatury."}},

{id:"B3",cat:"B",model:"shunt",selfPumped:true,solves:["p1","p4"],creates:["p2"],
 name:{en:"Return lifted by a shunt pump",uk:"Підняття зворотної шунтовим насосом",de:"Rücklaufanhebung durch Shuntpumpe",nl:"Retourverhoging met shuntpomp",fr:"Relèvement du retour par pompe de shunt",es:"Elevación del retorno con bomba de shunt",pl:"Podnoszenie temperatury powrotu pompą bocznikową"},
 one:{en:"A small pump across the generator pushes hot supply water back into the return until the return is warm enough.",uk:"Малий насос через генератор штовхає гарячу воду подачі назад у зворотну, поки та не потеплішає.",de:"Eine kleine Pumpe über den Erzeuger drückt heißes Vorlaufwasser in den Rücklauf, bis dieser warm genug ist.",nl:"Een kleine pomp over de opwekker duwt heet aanvoerwater terug in het retour tot dat warm genoeg is.",fr:"Une petite pompe en travers du générateur renvoie de l’eau chaude au retour jusqu’à ce qu’il soit assez chaud.",es:"Una bomba pequeña sobre el generador devuelve agua caliente al retorno hasta calentarlo.",pl:"Mała pompa umieszczona w generatorze tłoczy gorącą wodę z powrotem do obiegu powrotnego, aż do momentu, gdy woda powrotna stanie się wystarczająco ciepła."},
 yes:{en:"Cast-iron and steel boilers whose heat exchanger corrodes below the flue-gas dew point.",uk:"Чавунні та сталеві котли, теплообмінник яких кородує нижче точки роси димових газів.",de:"Guss- und Stahlkessel, deren Wärmeübertrager unter dem Abgastaupunkt korrodiert.",nl:"Gietijzeren en stalen ketels waarvan de wisselaar onder het rookgasdauwpunt corrodeert.",fr:"Chaudières fonte et acier qui se corrodent sous le point de rosée des fumées.",es:"Calderas de fundición y acero que se corroen bajo el punto de rocío.",pl:"Kotły żeliwne i stalowe, których wymiennik ciepła koroduje poniżej punktu rosy spalin."},
 no:{en:"On a condensing boiler or a heat pump — this circuit destroys the very effect you paid for.",uk:"На конденсаційному котлі чи тепловому насосі: ця схема руйнує саме той ефект, за який заплачено.",de:"An Brennwertkessel oder Wärmepumpe — die Schaltung zerstört genau den bezahlten Effekt.",nl:"Bij een HR-ketel of warmtepomp — deze schakeling vernietigt juist het betaalde effect.",fr:"Sur une chaudière à condensation ou une PAC — ce montage détruit l’effet payé.",es:"En caldera de condensación o bomba de calor — destruye justo el efecto pagado.",pl:"W przypadku kotła kondensacyjnego lub pompy ciepła — ten układ niszczy dokładnie ten efekt, za który zapłaciłeś."},
 pros:[{en:"Protects the generator without touching the consumer circuits at all.",uk:"Захищає генератор, зовсім не торкаючись контурів споживачів.",de:"Schützt den Erzeuger, ohne die Verbraucherkreise anzutasten.",nl:"Beschermt de opwekker zonder de gebruikerkringen aan te raken.",fr:"Protège le générateur sans toucher aux circuits d’émission.",es:"Protege el generador sin tocar los circuitos de consumo.",pl:"Chroni generator, nie dotykając w ogóle obwodów odbiorczych."},
  {en:"Switched by a return thermostat, so it runs only when it is actually needed.",uk:"Вмикається термостатом зворотної, тож працює лише коли справді потрібно.",de:"Über einen Rücklaufthermostaten geschaltet, läuft nur bei Bedarf.",nl:"Geschakeld door een retourthermostaat, draait alleen wanneer nodig.",fr:"Commandée par un thermostat de retour : ne tourne qu’au besoin.",es:"Conmutada por termostato de retorno: solo funciona cuando hace falta.",pl:"Sterowany termostatem powrotnym, więc działa tylko wtedy, gdy jest to konieczne."}],
 cons:[{en:"Raises the return on purpose, which costs condensing efficiency and heat-pump COP.",uk:"Навмисно піднімає зворотну, а це коштує ККД конденсації та COP.",de:"Hebt den Rücklauf absichtlich, was Brennwertnutzung und COP kostet.",nl:"Verhoogt bewust het retour, wat rendement en COP kost.",fr:"Élève volontairement le retour, au prix du rendement et du COP.",es:"Eleva el retorno a propósito, a costa del rendimiento y del COP.",pl:"Podnosi celowo powrót, który kosztuje efektywność skraplania i współczynnik COP pompy ciepła."},
  {en:"Needs a check valve in the shunt line, or the bypass short-circuits whenever the pump is off.",uk:"Потрібен зворотний клапан у шунті, інакше обвід замикається накоротко при вимкненому насосі.",de:"Braucht eine Rückschlagklappe im Shunt, sonst schließt der Bypass bei stehender Pumpe kurz.",nl:"Vraagt een terugslagklep in de shunt, anders kortsluiting bij stilstaande pomp.",fr:"Exige un clapet dans la dérivation, sinon court-circuit pompe arrêtée.",es:"Necesita antirretorno en el shunt, o cortocircuita con la bomba parada.",pl:"Wymagany jest zawór powrótny w linii bocznikowej, w przeciwnym razie obejście będzie zwierać się za każdym razem, gdy pompa będzie wyłączona."}],
 comm:[{en:"Set the thermostat to the manufacturer's minimum return temperature, not to a round number.",uk:"Налаштуйте термостат на мінімальну зворотну від виробника, а не на кругле число.",de:"Thermostat auf die Herstellerangabe einstellen, nicht auf eine runde Zahl.",nl:"Stel de thermostaat in op de fabrikantwaarde, niet op een rond getal.",fr:"Régler le thermostat sur la valeur constructeur, pas sur un chiffre rond.",es:"Ajuste el termostato al valor del fabricante, no a una cifra redonda.",pl:"Ustaw termostat na minimalną temperaturę powrotu podaną przez producenta, a nie na zaokrągloną liczbę."},
  {en:"With the shunt pump off, confirm there is no flow in the bypass.",uk:"За вимкненого шунтового насоса переконайтеся, що в обводі немає потоку.",de:"Bei stehender Shuntpumpe prüfen, dass im Bypass kein Strom fließt.",nl:"Controleer met de shuntpomp uit dat er geen debiet in de bypass staat.",fr:"Pompe arrêtée, vérifier l’absence de débit en dérivation.",es:"Con la bomba parada, compruebe que no hay caudal en el bypass.",pl:"Przy wyłączonej pompie bocznikowej sprawdź, czy nie ma przepływu w obejściu."}],
 kit:{en:"Small shunt circulator, check valve, return thermostat or minimum-flow switch, balancing valve.",uk:"Малий шунтовий насос, зворотний клапан, термостат зворотної або реле мінімальної витрати, балансувальний клапан.",de:"Kleine Shuntpumpe, Rückschlagklappe, Rücklaufthermostat oder Mindestmengenschalter, Einregulierventil.",nl:"Kleine shuntpomp, terugslagklep, retourthermostaat of minimumdebietschakelaar, inregelafsluiter.",fr:"Petit circulateur, clapet, thermostat de retour, vanne d’équilibrage.",es:"Circulador pequeño, antirretorno, termostato de retorno, válvula de equilibrado.",pl:"Mały zawór obiegowy, zawór powrótny, termostat powrotny lub wyłącznik minimalnego przepływu, zawór równoważący."}},

{id:"B4",cat:"B",model:"retmix",selfPumped:false,solves:["p1"],creates:["p2"],
 name:{en:"Return lifted by a motorised three-way valve",uk:"Підняття зворотної моторизованим триходовим",de:"Rücklaufanhebung über motorisiertes Dreiwegeventil",nl:"Retourverhoging met gemotoriseerde driewegafsluiter",fr:"Relèvement du retour par vanne motorisée",es:"Elevación del retorno con válvula motorizada",pl:"Podnoszenie temperatury powrotu zaworem trójdrożnym z siłownikiem"},
 one:{en:"A motorised valve blends supply into the return under a thermostat, modulating instead of switching.",uk:"Моторизований клапан підмішує подачу в зворотну за термостатом, модулюючи замість перемикання.",de:"Ein motorisiertes Ventil mischt thermostatgeführt Vorlauf in den Rücklauf — stetig statt schaltend.",nl:"Een gemotoriseerde afsluiter mengt thermostaatgestuurd aanvoer bij het retour, modulerend in plaats van schakelend.",fr:"Une vanne motorisée mélange le départ au retour sous thermostat, en modulant.",es:"Una válvula motorizada mezcla impulsión en el retorno bajo termostato, modulando.",pl:"Zawór silnikowy miesza wodę zasilającą z powrotną pod termostatem, modulując ją zamiast przełączać."},
 yes:{en:"The same case as a shunt pump, when a smooth response is preferred to on/off.",uk:"Той самий випадок, що й шунтовий насос, коли плавна реакція краща за релейну.",de:"Derselbe Fall wie die Shuntpumpe, wenn eine stetige Reaktion bevorzugt wird.",nl:"Hetzelfde geval als de shuntpomp, wanneer een vloeiende reactie de voorkeur heeft.",fr:"Même cas que la pompe de shunt, quand une réponse continue est préférée.",es:"El mismo caso que la bomba de shunt, cuando se prefiere respuesta continua.",pl:"Taki sam przypadek jak w przypadku pompy bocznikowej, gdy preferowana jest płynna reakcja zamiast włączania/wyłączania."},
 no:{en:"Wherever the coldest possible return is the whole point of the plant.",uk:"Скрізь, де найхолодніша зворотна — головна мета установки.",de:"Überall dort, wo der kälteste Rücklauf der eigentliche Zweck ist.",nl:"Overal waar het koudste retour juist het doel is.",fr:"Partout où le retour le plus froid est l’objectif même.",es:"Donde el retorno más frío sea el objetivo mismo.",pl:"Wszędzie tam, gdzie najzimniejszy możliwy powrót jest istotą istnienia zakładu."},
 pros:[{en:"Modulates, so the generator sees a steady return rather than a staircase.",uk:"Модулює, тож генератор бачить рівну зворотну, а не сходинки.",de:"Stetig: der Erzeuger sieht einen ruhigen Rücklauf statt einer Treppe.",nl:"Modulerend: de opwekker ziet een rustig retour in plaats van een trap.",fr:"Module : le générateur voit un retour stable, pas un escalier.",es:"Modula: el generador ve un retorno estable, no escalones.",pl:"Moduluje, dzięki czemu generator ma stały powrót, a nie schodkowy."},
  {en:"No additional pump.",uk:"Без додаткового насоса.",de:"Keine zusätzliche Pumpe.",nl:"Geen extra pomp.",fr:"Pas de pompe supplémentaire.",es:"Sin bomba adicional.",pl:"Brak dodatkowej pompki."}],
 cons:[{en:"Diverts supply water away from the consumers exactly when they are asking for heat.",uk:"Відводить воду подачі від споживачів саме тоді, коли вони просять тепла.",de:"Leitet Vorlaufwasser genau dann von den Verbrauchern weg, wenn sie Wärme fordern.",nl:"Leidt aanvoerwater weg van de gebruikers juist wanneer die warmte vragen.",fr:"Détourne l’eau de départ au moment où les émetteurs demandent de la chaleur.",es:"Desvía impulsión justo cuando los emisores piden calor.",pl:"Odwraca dopływ wody od odbiorców dokładnie wtedy, gdy potrzebują ciepła."},
  {en:"The same efficiency penalty as any return-raising circuit.",uk:"Той самий штраф до ККД, що й у будь-якої схеми підняття зворотної.",de:"Dieselbe Effizienzstrafe wie jede Rücklaufanhebung.",nl:"Dezelfde rendementsstraf als elke retourverhoging.",fr:"Même pénalité que tout relèvement de retour.",es:"La misma penalización que toda elevación de retorno.",pl:"Taka sama kara za wydajność jak w przypadku każdego układu zwiększającego powrót."}],
 comm:[{en:"Put the thermostat between the valve and the generator, never upstream of the mixing point.",uk:"Ставте термостат між клапаном і генератором, ніколи не до точки змішування.",de:"Thermostat zwischen Ventil und Erzeuger setzen, nie vor dem Mischpunkt.",nl:"Plaats de thermostaat tussen afsluiter en opwekker, nooit vóór het mengpunt.",fr:"Placer le thermostat entre la vanne et le générateur, jamais en amont.",es:"Coloque el termostato entre la válvula y el generador, nunca aguas arriba.",pl:"Termostat należy umieścić pomiędzy zaworem a generatorem, nigdy przed punktem mieszania."}],
 kit:{en:"Motorised three-way valve, return thermostat, balancing valve; no additional pump.",uk:"Моторизований триходовий клапан, термостат зворотної, балансувальний клапан; додаткового насоса немає.",de:"Motorisiertes Dreiwegeventil, Rücklaufthermostat, Einregulierventil; keine Zusatzpumpe.",nl:"Gemotoriseerde driewegafsluiter, retourthermostaat, inregelafsluiter; geen extra pomp.",fr:"Vanne trois voies motorisée, thermostat de retour, vanne d’équilibrage ; sans pompe.",es:"Válvula de tres vías motorizada, termostato de retorno, válvula de equilibrado; sin bomba.",pl:"Trójdrożny zawór sterowany silnikiem, termostat powrotny, zawór równoważący; brak dodatkowej pompy."}},

{id:"B5",cat:"B",model:"retmix",selfPumped:false,solves:["p1"],creates:["p2"],
 name:{en:"Self-acting thermostatic return valve",uk:"Саморегульований термостатичний клапан зворотної",de:"Selbsttätiges thermostatisches Rücklaufventil",nl:"Zelfwerkende thermostatische retourafsluiter",fr:"Vanne thermostatique de retour autonome",es:"Válvula termostática de retorno autónoma",pl:"Samoczynny termostatyczny zawór ochrony powrotu"},
 one:{en:"The same return blending, driven by a wax or gas element inside the valve instead of by a controller and a power supply.",uk:"Те саме підмішування в зворотну, але від воскового чи газового елемента всередині клапана, а не від автоматики й живлення.",de:"Dieselbe Rücklaufbeimischung, angetrieben von einem Dehnstoffelement im Ventil statt von Regler und Stromversorgung.",nl:"Dezelfde retourbijmenging, aangedreven door een was- of gaselement in de afsluiter in plaats van door regelaar en voeding.",fr:"Le même mélange au retour, entraîné par un élément thermostatique interne plutôt que par un régulateur alimenté.",es:"La misma mezcla al retorno, movida por un elemento termostático interno en vez de un regulador alimentado.",pl:"Takie samo mieszanie powrotne, napędzane woskiem lub elementem gazowym wewnątrz zaworu, a nie sterownikiem i źródłem zasilania."},
 yes:{en:"Small and medium boilers, retrofits, and anywhere a protection function must survive a power cut or a controller swap.",uk:"Малі та середні котли, реконструкції й будь-де, де захист має пережити зникнення живлення чи заміну контролера.",de:"Kleine und mittlere Kessel, Sanierungen, und überall wo der Schutz Stromausfall oder Reglerwechsel überstehen muss.",nl:"Kleine en middelgrote ketels, renovaties, en overal waar de bescherming een stroomuitval moet overleven.",fr:"Chaudières petites et moyennes, rénovations, et partout où la protection doit survivre à une coupure.",es:"Calderas pequeñas y medianas, reformas, y donde la protección deba sobrevivir a un corte.",pl:"Małe i średnie kotły, instalacje modernizacyjne i wszędzie tam, gdzie funkcja zabezpieczająca musi przetrwać przerwę w dostawie prądu lub wymianę sterownika."},
 no:{en:"Where the opening temperature has to be changed after commissioning, or where the flow is far above the valve's range.",uk:"Там, де температуру відкриття треба міняти після налагодження, або де витрата далеко за межами клапана.",de:"Wo die Öffnungstemperatur nachträglich änderbar sein muss, oder der Strom weit über dem Ventilbereich liegt.",nl:"Waar de openingstemperatuur later moet wijzigen, of het debiet ver buiten het bereik ligt.",fr:"Là où la température d’ouverture doit changer après réception, ou le débit dépasse la plage.",es:"Donde la temperatura de apertura deba cambiar después, o el caudal exceda el rango.",pl:"Gdy po uruchomieniu należy zmienić temperaturę otwarcia lub gdy przepływ znacznie przekracza zakres zaworu."},
 pros:[{en:"Works with no power, no wiring and no controller — the protection cannot be switched off by mistake.",uk:"Працює без живлення, проводки й контролера — захист неможливо вимкнути помилково.",de:"Arbeitet ohne Strom, Verkabelung und Regler — der Schutz lässt sich nicht versehentlich abschalten.",nl:"Werkt zonder voeding, bedrading of regelaar — de bescherming kan niet per ongeluk uit.",fr:"Fonctionne sans alimentation ni régulateur — la protection ne peut pas être désactivée par erreur.",es:"Funciona sin alimentación ni regulador — la protección no puede desactivarse por error.",pl:"Działa bez zasilania, okablowania i kontrolera — zabezpieczenia nie da się wyłączyć przez pomyłkę."},
  {en:"One component instead of a valve, an actuator, a sensor and a controller.",uk:"Один компонент замість клапана, привода, датчика й контролера.",de:"Ein Bauteil statt Ventil, Antrieb, Fühler und Regler.",nl:"Eén component in plaats van afsluiter, aandrijving, opnemer en regelaar.",fr:"Un composant au lieu d’une vanne, d’un servomoteur, d’une sonde et d’un régulateur.",es:"Un componente en vez de válvula, actuador, sonda y regulador.",pl:"Jeden komponent zamiast zaworu, siłownika, czujnika i sterownika."}],
