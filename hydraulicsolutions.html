/* ===================================================================
 * State.
 *
 * The page keeps ONE plain object. diagram-ui.js binds the fields to it,
 * the permalink is built from it and the calculation record is read from
 * it. Nothing in the maths touches the DOM any more.
 *
 * Units stay exactly where the calculation record already put them — kW,
 * °C, kPa, per cent — because record.units is a published artefact and
 * FRAMEWORK_V2_SPEC.md freezes it. The framework's unit registry is
 * therefore not used for these quantities: a °C field declared as SI
 * kelvin would move the recorded numbers by 273.15 and back, and the
 * round trip is not exact in binary.
 * =================================================================== */

/* min / max / step / default are the ones the markup used to declare, and
 * fieldValue() used to enforce them on every read. Both jobs live here now:
 * the framework clamps on entry, normalise() clamps again on read, so a
 * value arriving from a permalink or a script is treated exactly as a value
 * typed into the old input was. */
const FIELDS = [
  {key:"QkW",       id:"i-q",     min:0.5,  max:2000, step:0.5,  def:10},
  {key:"tSupply",   id:"i-ts",    min:25,   max:110,  step:1,    def:75},
  {key:"tReturn",   id:"i-tr",    min:20,   max:105,  step:1,    def:65},
  {key:"tRoom",     id:"i-troom", min:5,    max:30,   step:1,    def:20},
  {key:"tNet",      id:"i-tnet",  min:30,   max:115,  step:1,    def:90},
  {key:"threshold", id:"i-thr",   min:0,    max:90,   step:1,    def:55},
  {key:"a",         id:"i-auth",  min:0.05, max:1,    step:0.01, def:0.33},
  {key:"head",      id:"i-head",  min:5,    max:300,  step:1,    def:40},
  {key:"eta",       id:"i-eta",   min:0.1,  max:0.9,  step:0.01, def:0.55},
  {key:"hdr",       id:"i-hdr",   min:0.2,  max:2,    step:0.05, def:1.1},
  {key:"load",      id:"i-load",  min:0,    max:100,  step:1,    def:100}
];
const PICKERS = [{key:"type", id:"i-type", def:"radiator"},
                 {key:"kind", id:"i-gen",  def:"cast_iron"}];

const DEFAULTS = {};
FIELDS.forEach(f => { DEFAULTS[f.key] = f.def; });
PICKERS.forEach(f => { DEFAULTS[f.key] = f.def; });
DEFAULTS.filter = null;      // the problem the library is filtered by
DEFAULTS.metric = "ret";     // what the comparison sweep plots
DEFAULTS.cmp = [];           // circuits ticked for comparison

const state = JSON.parse(JSON.stringify(DEFAULTS));

let lang = "en";
let ui = null;
const tr = o => (o && (o[lang] || o.en)) || "";
const q3 = m => (m==null||!isFinite(m)) ? "—" : F2(kgs_to_m3h(m, 60));

/* Hosts handed over by the panels as they build. Every one of them is
 * replaced when the shell rebuilds (a language change), so nothing here
 * may be cached across a rebuild. */
let libHost = null, chipHost = null, cmpStage = null, cmpTbl = null,
    authStage = null, authTbl = null, valHost = null;
let cache = null;

/* В числовом поле может лежать что угодно: пусто, буквы, 1e308, минус.
 * Браузер такое поле не чинит — он просто отдаёт строку, а parseFloat
 * отдаёт не-число. Дальше стоят бисекция и IF97, для которых это исключение,
 * и его текст доезжал до карточки как есть. Поэтому число приводится в
 * порядок здесь, в единственном месте, где читается состояние: не число или
 * бесконечность — берём значение по умолчанию, всё остальное зажимаем
 * теми же границами, которые объявлены в FIELDS. */
function inputs(){
  const o = {};
  for (const f of FIELDS){
    let x = parseFloat(state[f.key]);
    if (!isFinite(x)) x = f.def;
    x = Math.max(f.min, Math.min(f.max, x));
    o[f.key] = x + 0;                     // −0 приводится к 0
  }
  o.type = EMITTERS[state.type] ? state.type : DEFAULTS.type;
  o.kind = GENERATOR_KINDS[state.kind] ? state.kind : DEFAULTS.kind;
  o.phi = o.load / 100;
  delete o.load;
  /* Три температуры обязаны идти по порядку: помещение < обратка < подача.
   * Каждое поле по отдельности про два других не знает, а диапазоны их
   * границ пересекаются: 25 °C подачи и 30 °C помещения — оба допустимые
   * значения. Порядок наводится здесь, потому что при обратке, равной
   * температуре помещения, логарифмический перепад обращается в ноль,
   * номинал прибора — в бесконечность, и бисекция получает на границе
   * не-число. */
  o.tRoom   = Math.min(o.tRoom, o.tSupply - 2);
  o.tReturn = Math.min(o.tReturn, o.tSupply - 1);
  o.tReturn = Math.max(o.tReturn, o.tRoom + 1);
  o.tNet = Math.max(o.tNet, o.tSupply);
  return o;
}

const cmpHas = id => state.cmp.indexOf(id) >= 0;

/* ---------- расчёт состояния карточки ----------
 * Многие карточки делят одну расчётную модель: A3 и A4 обе разделительные,
 * B4 и B5 обе подмешивают в обратку, C1 и C2 обе развязывают. Считать одно
 * и то же по нескольку раз незачем, поэтому в пределах одного обновления
 * результат кэшируется по ключу «модель + нагрузка + проектная точка».
 * Кэш живёт один тик и сбрасывается явно. */
let memo = new Map();
const dropMemo = () => memo.clear();
function stateFor(card, I){
  const key = card.model+"|"+(card.pumpMode||"")+"|"+(card.selfPumped?1:0)+"|"+
    I.phi.toFixed(6)+"|"+I.QkW+"|"+I.tSupply+"|"+I.tReturn+"|"+I.tRoom+"|"+
    I.tNet+"|"+I.type+"|"+I.threshold+"|"+I.head+"|"+I.eta+"|"+I.hdr;
  const hit = memo.get(key);
  if (hit) return hit;
  const val = stateForRaw(card, I);
  memo.set(key, val);
  return val;
}
function stateForRaw(card, I){
  const et = I.type === "embedded" ? "radiator" : I.type;
  const direct = I.tSupply, mixed = I.tNet, m = card.model;
  let dp = null;
  try{
    // Проектная точка тоже считается под перехватом: она вызывает IF97,
    // и её отказ должен становиться сообщением карточки, а не ошибкой
    // страницы.
    dp = designPoint({QkW:I.QkW, tSupply:I.tSupply, tReturn:I.tReturn, tRoom:I.tRoom, type:et});
    if (m==="throttle")        return {...G6(dp,I.phi,direct), dp};
    if (m==="throttle-premix") return {...G5(dp,I.phi,mixed), dp};
    if (m==="divert")          return {...G4(dp,I.phi,direct), selfPumped:card.selfPumped, dp};
    if (m==="mix")             return {...G7(dp,I.phi,mixed), dp};
    if (m==="mix-premix")      return {...G8(dp,I.phi,mixed), dp};
    if (m==="inject2")         return {...G7(dp,I.phi,mixed), dp};
    if (m==="inject3")         return {...INJ3(dp,I.phi,mixed), dp};
    if (m==="gen-passive" || m==="gen-active"){
      const mods = m==="gen-passive" ? [G7(dp,I.phi,mixed), G8(dp,I.phi,mixed)]
                                     : [G7(dp,I.phi,mixed), G4(dp,I.phi,direct)];
      const g = generatorFlow(mods);
      const full = generatorFlow(m==="gen-passive" ? [G7(dp,1,mixed),G8(dp,1,mixed)]
                                                  : [G7(dp,1,mixed),G4(dp,1,direct)]).qGen;
      return {qGen:g.qGen, tRet:g.tReturn==null?I.tRoom:g.tReturn, t1:mixed,
              starved: m==="gen-passive" && g.qGen < 0.05*full, dp};
    }
    if (m==="shunt" || m==="retmix" || m==="relief"){
      const g = generatorFlow([G7(dp,I.phi,mixed), G6(dp,I.phi,direct)]);
      const tRet = g.tReturn==null ? I.tRoom : g.tReturn;
      const qGen = Math.max(g.qGen, 1e-9);
      if (m==="relief"){
        const R = resistanceFor(Math.max(kgs_to_m3h(dp.mdot,60),1e-6), I.head);
        const Qnow = Math.max(kgs_to_m3h(g.qGen,60), 1e-9);
        const dpNow = pumpHead(Qnow, I.head*1.5, kgs_to_m3h(dp.mdot,60)*2.2);
        const rv = reliefValve({dp:dpNow, dpSet:I.head, kv:kgs_to_m3h(dp.mdot,60)});
        const qB = m3h_to_kgs(rv.qBypass, 60);
        const tMix = (qGen+qB) > 0 ? tFromH((qGen*h(tRet) + qB*h(mixed))/(qGen+qB)) : tRet;
        return {t1:mixed, tRet, tMix, active:rv.open, qGen, qBypass:qB, dpNow, dp};
      }
      const s = m==="shunt" ? shuntPump({qGen, tReturn:tRet, tSupply:mixed, tReturnMin:I.threshold})
                            : returnMixValve({qGen, tReturn:tRet, tSupply:mixed, tReturnMin:I.threshold});
      return {t1:mixed, tRet, tMix:s.tReturnMixed==null?tRet:s.tReturnMixed,
              active:s.active, qShunt:s.qShunt, fraction:s.fraction, qGen, dp};
    }
    if (m==="decouple" || m==="decouple-balanced"){
      const sec = G7(dp,I.phi,mixed);
      const qS = sec.qvs;
      /* The ratio of primary to secondary flow is what decides which way the
       * bypass runs, and it is the one number a header is designed by. It used
       * to be wired to 1,1 here, so the undersized case — the classic fault of
       * this family, and the reason a low-loss header ever disappoints — could
       * not be reached from the interface at all, and every card printed an
       * undiluted supply whatever the reader did. It is now an input.
       * The zero-differential manifold C3 keeps q_P = q_S by definition: that
       * equality IS the circuit. */
      const qP = m==="decouple-balanced" ? qS : qS*I.hdr;
      const d = decoupler({qP, tP:mixed, qS, tS:sec.t3});
      return {...d, qP, qS, tP:mixed, tS:sec.t3, dp};
    }
    if (m==="plate"){
      const sec = G7(dp,I.phi,mixed);
      const approach = 4;
      const r = plateSeparation({tPrimarySupply:mixed, approach, qS:sec.qvs, tSreturn:sec.t3});
      return {tP:mixed, tS:sec.t3, tSecondarySupply:r.tSecondarySupply, approach,
              tPrimaryReturn:sec.t3 + approach, qP:sec.qvs, qS:sec.qvs, qCross:0, dp};
    }
    if (m==="pump"){
      const Q100 = kgs_to_m3h(dp.mdot, 60);
      const Qmax = Q100*2.2, H0 = I.head*1.5;
      const frac = Math.max(0.05, I.phi);
      const R = resistanceFor(Q100*frac, I.head);
      const p = {H100:I.head, Q100, H0, Qmax};
      const duty = dutyPoint(card.pumpMode, R, p);
      const dutyFixed = dutyPoint("fixed", R, p);
      return {mode:card.pumpMode, R, H0, Qmax, Q100, H100:I.head, duty,
              power:pumpPower(duty.Q, duty.H, I.eta),
              powerFixed:pumpPower(dutyFixed.Q, dutyFixed.H, I.eta), dp};
    }
  }catch(e){
    // Текст исключения — внутренний, инженерный и одноязычный; в карточку
    // идёт переведённая формулировка, а не он.
    return {error:true, errorKey:e.key || "eCalc", dp};
  }
  return {dp};
}

/* Обратка, которую видит генератор — у каждой модели своя. */
function retOf(card, st){
  switch (card.model){
    case "throttle": case "throttle-premix": case "divert":
    case "mix": case "mix-premix": case "inject2": case "inject3": return st.t4;
    case "gen-passive": case "gen-active": return st.tRet;
    case "shunt": case "retmix": case "relief": return st.tMix;
    case "decouple": case "decouple-balanced": case "plate": return st.tPrimaryReturn;
    default: return null;
  }
}
function netOf(card, st){
  if (["throttle","throttle-premix","divert","mix","mix-premix","inject2","inject3"].includes(card.model))
    return st.qvp;
  if (["gen-passive","gen-active","shunt","retmix","relief"].includes(card.model)) return st.qGen;
  if (["decouple","decouple-balanced","plate"].includes(card.model)) return st.qP;
  return null;
}
function supOf(card, st){
  if (["throttle","throttle-premix","divert","mix","mix-premix","inject2","inject3"].includes(card.model))
    return st.t2;
  if (["decouple","decouple-balanced","plate"].includes(card.model)) return st.tSecondarySupply;
  if (["gen-passive","gen-active","shunt","retmix","relief"].includes(card.model)) return st.t1;
  return null;
}
function metricValue(card, st, mkey){
  if (mkey==="ret") return retOf(card, st);
  if (mkey==="net"){ const v = netOf(card, st); return v==null?null:kgs_to_m3h(v,60); }
  if (mkey==="sup") return supOf(card, st);
  if (mkey==="pow") return card.model==="pump" ? st.power?.shaft : null;
  return null;
}

/* ---------- живой блок карточки ---------- */
function liveHTML(card, st, I){
  if (st.error) return `<div class="flag bad">${esc(tr(T[st.errorKey] || T.eCalc))}</div>`;
  const rows=[], add=(k,v,wrap)=>rows.push(`<tr><td>${esc(tr(k))}</td><td${wrap?' class="wrap"':''}>${v}</td></tr>`);
  const L = labels(I);
  let svg;
  if (card.model === "pump"){
    svg = drawPumpChart(st, L);
    add(SL.kDuty, F2(st.duty.Q)+" m³/h · "+F1(st.duty.H)+" kPa");
    add(SL.kShaft, F1(st.power.shaft)+" W");
    const rel = st.powerFixed.shaft>0 ? st.power.shaft/st.powerFixed.shaft : 1;
    add(SL.kVsFixed, (rel*100).toFixed(0)+" %");
  } else {
    svg = drawCircuit(card.model, st, L, Math.min(I.tRoom,20), Math.max(I.tNet,I.tSupply));
    const sup = supOf(card, st), ret = retOf(card, st), net = netOf(card, st);
    if (sup!=null) add(SL.kSup, F1(sup)+" °C");
    if (ret!=null) add(SL.kRet, F1(ret)+" °C");
    if (net!=null) add(SL.kFlowP, q3(net)+" m³/h");
    if (st.qvs!=null) add(SL.kFlowS, q3(st.qvs)+" m³/h");
    if (st.qS!=null) add(SL.kFlowS, q3(st.qS)+" m³/h");
    if (st.qmeng) add(SL.kMix, q3(st.qmeng)+" m³/h");
    /* A header is judged by its cross flow: how much crosses, which way, and
     * what it costs the consumer. All three were computed and none was shown. */
    if (st.qCross!=null){
      add(SL.kCross, q3(st.qCross)+" m³/h — " +
        (st.qCross<=1e-12 ? tr(SL.noCross) : st.undersized ? tr(SL.crossUp) : tr(SL.crossDown)), true);
      if (st.supplyShortfall!=null)
        add(SL.kShortfall, F1(st.supplyShortfall)+" K");
    }
    if (["mix","mix-premix","throttle","throttle-premix"].includes(card.model)){
      const rc = runawayCheck(card.model==="mix"?"G7":card.model==="mix-premix"?"G8":
                              card.model==="throttle"?"G6":"G5",
        st.dp, ["throttle","divert"].includes(card.model)?I.tSupply:I.tNet, Math.max(I.phi,1e-6));
      add(SL.kWorst, F1(rc.tWorstCase)+" °C");
    }
  }
  // Схема объявлена как картинка (role="img"), значит у неё должно быть имя:
  // без него экранный диктор произносит «graphic» и на этом останавливается.
  // Имя берём то же, что стоит в шапке карточки, поэтому оно переводится.
  const named = svg.replace("<svg ",
    `<svg aria-label="${esc(tr(card.name) + " — " + tr(card.one))}" `);
  return `<div class="two">
    <div><div class="scheme">${named}</div>
      <p class="small">${esc(card.selfPumped?tr(SL.selfPumped):tr(SL.driven))}</p></div>
    <div><h3>${esc(tr(SL.live))}</h3><table class="kv">${rows.join("")}</table>
      ${verdictHTML(card, st, I)}</div></div>`;
}

function verdictHTML(card, st, I){
  const out=[];
  const ret = retOf(card, st);
  if (ret!=null && isFinite(ret)){
    const v = returnVerdict(ret, {kind:I.kind, threshold:I.threshold});
    const cls = v.status==="good" ? "ok" : v.status==="bad" ? "bad" : "warn";
    const msg = v.rule==="floor" ? (v.status==="good"?T.vGood:T.vBadFloor)
              : v.rule==="ceiling" ? (v.status==="good"?T.vGood:T.vWarnCeil)
              : T.vLower;
    out.push(`<div class="flag ${cls}">${esc(tr(msg))}${
      v.margin!=null ? ` <b>${v.margin>=0?"+":""}${F1(v.margin)} K</b>` : ""}</div>`);
    if (I.kind==="condensing"){
      const d = condensingDepth(ret, I.threshold, I.tRoom);
      out.push(`<div class="bandlab"><span>${esc(tr(T.condDepth))}</span><span>${(d*100).toFixed(0)} %</span></div>
        <div class="meter"><i style="width:${(d*100).toFixed(1)}%"></i></div>`);
    }
  }
  if (card.model==="gen-passive" && st.starved)
    out.push(`<div class="flag bad">${esc(tr(SL.noFlow))}</div>`);
  if (I.type==="embedded" && st.t2!=null && st.t3!=null){
    const e = embeddedOutput(st.t2, st.t3, I.tRoom), ch = surfaceCheck(e.tSurface);
    if (ch.exceeded) out.push(`<div class="flag bad">${esc(tr(SL.floorHot))} ${F1(e.tSurface)} °C &gt; ${ch.limit} °C</div>`);
  }
  return out.join("");
}

function labels(I){
  return {gen:tr(SL.gen), con:tr(SL.con), groups:tr(SL.groups), mix:tr(SL.mix),
    premix:tr(SL.premix), bypass:tr(SL.bypass), bridge:tr(SL.bridge),
    genflow:tr(SL.genflow), raising:tr(SL.raising), idle:tr(SL.idle),
    crossUp:tr(SL.crossUp), crossDown:tr(SL.crossDown), noCross:tr(SL.noCross),
    approach:tr(SL.approach), setpoint:tr(SL.setpoint),
    pumpCurve:tr(SL.pumpCurve), systemCurve:tr(SL.systemCurve), controlCurve:tr(SL.controlCurve),
    emit:tr(EMITTERS[I.type]), genKind:tr(GENKINDS[I.kind])};
}

/* ---------- построение карточек (один раз на язык/фильтр) ---------- */
function buildLibrary(){
  if (!libHost) return;
  const list = CARDS.filter(c => !state.filter || c.solves.includes(state.filter) || c.creates.includes(state.filter));
  const probName = id => { const p = PROBLEMS.find(p=>p.id===id); return p?tr(p.t):id; };
  const byCat = {};
  list.forEach(c => (byCat[c.cat] = byCat[c.cat] || []).push(c));
  libHost.innerHTML = Object.keys(byCat).map(k => `
    <section class="catblock">
      <h3 class="cath"><span class="catbadge">${esc(k)}</span> ${esc(tr(CATS[k].t))}</h3>
      <p class="small">${esc(tr(CATS[k].d))}</p>
      ${byCat[k].map(c => `<details class="card" data-id="${c.id}">
        <summary>
          <span class="code">${esc(c.id)}</span>
          <span class="cname">${esc(tr(c.name))}</span>
          <span class="cone">${esc(tr(c.one))}</span>
          <button type="button" class="hs-cmp" data-cmp="${c.id}"
            aria-pressed="${cmpHas(c.id)?"true":"false"}">${esc(tr(T.cmpAdd))}</button>
        </summary>
        <div class="body">
          <div data-live="${c.id}"></div>
          <p>${c.solves.map(s=>`<span class="tag solves">${esc(tr(SL.solves))}: ${esc(probName(s))}</span>`).join("")}
             ${c.creates.map(s=>`<span class="tag creates">${esc(tr(SL.creates))}: ${esc(probName(s))}</span>`).join("")}</p>
          <div class="two">
            <div><h3>${esc(tr(SL.whenYes))}</h3><p>${esc(tr(c.yes))}</p>
                 <h3>${esc(tr(SL.whenNo))}</h3><p>${esc(tr(c.no))}</p>
                 <h3>${esc(tr(SL.kit))}</h3><p>${esc(tr(c.kit))}</p></div>
            <div><h3>${esc(tr(SL.pros))}</h3><ul class="tight">${c.pros.map(x=>`<li class="pro">${esc(tr(x))}</li>`).join("")}</ul>
                 <h3>${esc(tr(SL.cons))}</h3><ul class="tight">${c.cons.map(x=>`<li class="con">${esc(tr(x))}</li>`).join("")}</ul>
                 <h3>${esc(tr(SL.comm))}</h3><ol class="tight">${c.comm.map(x=>`<li>${esc(tr(x))}</li>`).join("")}</ol></div>
          </div>
        </div></details>`).join("")}
    </section>`).join("");
  cache = [...libHost.querySelectorAll("[data-live]")].map(el => ({
    el, det: el.closest("details"), fresh: false,
    card: CARDS.find(c => c.id === el.dataset.live)}));
  // Закрытая карточка не рисуется вовсе: её содержимое не видно, а расчёт
  // стоит дорого. Рисуем в момент раскрытия.
  cache.forEach(item => item.det.addEventListener("toggle", () => {
    if (item.det.open && !item.fresh) renderOne(item, inputs());
  }));
}

/* Переключатель сравнения был чекбоксом внутри <summary>: 18 px в высоту на
 * телефоне и клик, который сворачивал карточку. Теперь это кнопка с
 * aria-pressed — тот же переключатель, но с областью нажатия 44 px и без
 * борьбы с <details>. */
function toggleCompare(id, btn){
  const i = state.cmp.indexOf(id);
  if (i >= 0) state.cmp.splice(i, 1); else state.cmp.push(id);
  if (btn) btn.setAttribute("aria-pressed", i >= 0 ? "false" : "true");
  schedule("compare");
}
function clearCompare(){
  state.cmp.length = 0;
  if (libHost) libHost.querySelectorAll("[data-cmp]").forEach(b => b.setAttribute("aria-pressed","false"));
  schedule("compare");
}

function renderChips(){
  if (!chipHost) return;
  chipHost.innerHTML = PROBLEMS.map(p=>`<button type="button" class="dgu-btn hs-chip" data-p="${p.id}"
    aria-pressed="${state.filter===p.id}" ${p.covered?"":`disabled title="${esc(tr(T.pProb))}"`}
    >${esc(tr(p.t))}</button>`).join("");
}
function setFilter(id){
  state.filter = (state.filter === id) ? null : id;
  renderChips();
  schedule("filter");
}

/* ---------- обновление ----------
 * Ползунок нагрузки трогает только раскрытые карточки: закрытая карточка
 * не видна, а её расчёт стоит дороже всего остального вместе взятого.
 * Сравнение само гоняет нагрузку от 0 до 100 %, поэтому от ползунка не
 * зависит вовсе и пересчитывается только при смене проектной точки,
 * выбора или метрики. Проверки — только при смене проектной точки. */
function renderOne(item, I){
  item.el.innerHTML = liveHTML(item.card, stateFor(item.card, I), I);
  item.fresh = true;
}
function markStale(){ if (cache) cache.forEach(i => i.fresh = false); }

function updateLoad(){
  dropMemo();
  const I = inputs();
  if (cache) for (const item of cache){
    if (item.det.open) renderOne(item, I); else item.fresh = false;
  }
}
function updateDesign(){
  dropMemo();
  const I = inputs();
  /* The threshold means three different things depending on the generator,
   * and it said so under the field before; it still does. The node is looked
   * up rather than cached because a language change rebuilds every panel. */
  const thrHint = document.querySelector('[data-dgu-field="f-threshold"] .dgu-hint');
  if (thrHint) thrHint.textContent = tr(
    GENERATOR_KINDS[I.kind].rule==="floor" ? T.thrFloor :
    GENERATOR_KINDS[I.kind].rule==="ceiling" ? T.thrCeil : T.thrNone);
  markStale(); updateLoad(); drawCompare(); runChecks(I);
}
function updateLive(){ updateDesign(); drawAuthority(); }

/* Какая работа нужна после правки — та же таблица, что была: проектная
 * точка перебивает всё, авторитет и нагрузка стоят особняком. Раньше её
 * разводил собственный requestAnimationFrame; теперь работу назначает
 * on.change, а запускает on.compute фреймворка (debounce 120 мс). */
let pendingKind = null;
const want = (kind) => { pendingKind = (pendingKind === "design" || kind === "design") ? "design" : kind; };
/* Controls that are not fields (the problem chips, the compare toggles)
 * ask for their work and run it at once; fields go through the
 * framework's 120 ms debounce and only declare the kind. */
const schedule = (kind) => { want(kind); if (ui) ui.run(); };
const KIND_OF = {a:"auth", load:"load", metric:"compare"};

const drawCompare   = () => { if (cmpStage)  cmpStage.schedule(); };
const drawAuthority = () => { if (authStage) authStage.schedule(); };

function computeAll(){
  const k = pendingKind; pendingKind = null;
  if (k === "auth")          drawAuthority();
  else if (k === "load")     updateLoad();
  else if (k === "compare")  drawCompare();
  else if (k === "filter") { buildLibrary(); updateLive(); }
  else                       updateLive();
}

/* ---------- графики ----------
 * Обе диаграммы теперь живут в ui.stage: размер приходит от
 * ResizeObserver, холст масштабируется под devicePixelRatio, а подписи
 * набираются в физических пикселях, а не растягиваются вместе с рисунком
 * (UI_FRAMEWORK_SPEC.md §10). Числа те же. */
const PALETTE = ["#1d4ed8","#c2410c","#0f766e","#7c3aed","#b91c1c","#0369a1","#a16207","#be185d"];
function ctxSetup(stage){
  const size = stage.size, ctx = stage.canvas();
  ctx.clearRect(0,0,size.w,size.h);
  const css = getComputedStyle(document.documentElement);
  return {ctx, w:size.w, h:size.h, coarse:size.density==="coarse",
          font:(css.getPropertyValue("--font")||"sans-serif").trim(),
          muted:css.getPropertyValue("--muted")||"#666",
          line:css.getPropertyValue("--line")||"#ccc"};
}
function axes(g,m,xr,yr,xl,yl){
  const {ctx}=g; ctx.strokeStyle=g.line; ctx.lineWidth=1;
  ctx.font="400 12px "+g.font; ctx.fillStyle=g.muted;
  const N = g.coarse ? 3 : 5;
  for (let i=0;i<=N;i++){
    const y=m.t+(g.h-m.t-m.b)*i/N;
    ctx.beginPath(); ctx.moveTo(m.l,y); ctx.lineTo(g.w-m.r,y); ctx.stroke();
    ctx.textAlign="right"; ctx.fillText((yr[1]-(yr[1]-yr[0])*i/N).toFixed(yr[1]-yr[0]<5?2:0), m.l-8, y+4);
  }
  for (let i=0;i<=N;i++){
    const x=m.l+(g.w-m.l-m.r)*i/N;
    ctx.textAlign="center"; ctx.fillText((xr[0]+(xr[1]-xr[0])*i/N).toFixed(0), x, g.h-m.b+18);
  }
  /* below md the legend takes the bottom band, so the axis title moves up
   * to just under its own tick row instead of colliding with it. */
  ctx.textAlign="center"; ctx.fillText(xl,(m.l+g.w-m.r)/2, g.coarse ? m.t+(g.h-m.t-m.b)+34 : g.h-6);
  ctx.save(); ctx.translate(14,(m.t+g.h-m.b)/2); ctx.rotate(-Math.PI/2);
  ctx.fillText(yl,0,0); ctx.restore();
}
function plot(g,m,xr,yr,pts,col,dash){
  const {ctx}=g;
  const X=v=>m.l+(g.w-m.l-m.r)*(v-xr[0])/(xr[1]-xr[0]);
  const Y=v=>m.t+(g.h-m.t-m.b)*(yr[1]-v)/Math.max(1e-9,yr[1]-yr[0]);
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=2.4; ctx.setLineDash(dash||[]);
  ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));
  ctx.stroke(); ctx.restore();
}
/* Below md the legend goes under the plot instead of on top of it (§10). */
function legendHeight(g,items){ return g.coarse ? items.length*18+14 : 0; }
function legendBox(g,items,x,y){
  const {ctx}=g; ctx.font="400 12px "+g.font; ctx.textAlign="left";
  const w = 34 + Math.max(...items.map(i=>ctx.measureText(i[0]).width));
  if (!g.coarse){
    ctx.save();
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--panel")||"#fff";
    ctx.globalAlpha=.9; ctx.fillRect(x-8,y-13,w+12,items.length*18+8);
    ctx.globalAlpha=1; ctx.strokeStyle=g.line; ctx.lineWidth=1;
    ctx.strokeRect(x-8,y-13,w+12,items.length*18+8); ctx.restore();
  }
  items.forEach((it,i)=>{
    const yy=y+i*18;
    ctx.save(); ctx.strokeStyle=it[1]; ctx.lineWidth=2.4; ctx.setLineDash(it[2]||[]);
    ctx.beginPath(); ctx.moveTo(x,yy); ctx.lineTo(x+22,yy); ctx.stroke(); ctx.restore();
    ctx.fillStyle=g.muted; ctx.fillText(it[0], x+28, yy+4);
  });
}

function renderCompare(I){
  if (!cmpStage) return;
  dropMemo();
  const g=ctxSetup(cmpStage);
  const chosen = CARDS.filter(c => cmpHas(c.id));
  const series = chosen.map(c => {
    const pts=[];
    for (let i=0;i<=25;i++){
      const phi=i/25, st=stateFor(c, {...I, phi});
      const v=metricValue(c, st, state.metric);
      if (v!=null && isFinite(v)) pts.push([phi*100, v]);
    }
    return {c, pts};
  }).filter(s => s.pts.length);
  if (cmpTbl) cmpTbl.innerHTML = "";
  if (!series.length){
    g.ctx.font="400 14px "+g.font; g.ctx.fillStyle=g.muted; g.ctx.textAlign="center";
    g.ctx.fillText(tr(T.cmpEmpty), g.w/2, g.h/2);
    return;
  }
  const legend = series.map((s,i)=>[s.c.id+" — "+tr(s.c.name), PALETTE[i%PALETTE.length]]);
  const m={l:58,r:16,t:16,b:36+legendHeight(g,legend)};
  const all = series.flatMap(s=>s.pts.map(p=>p[1]));
  const lo=Math.min(...all), hi=Math.max(...all), pad=Math.max((hi-lo)*0.08, 0.5);
  const yr=[lo-pad, hi+pad];
  const mLabel = {ret:T.mRet, net:T.mNet, sup:T.mSup, pow:T.mPow}[state.metric];
  axes(g,m,[0,100],yr, tr(T.lLoad)+", %", tr(mLabel));
  series.forEach((s,i)=>plot(g,m,[0,100],yr,s.pts,PALETTE[i%PALETTE.length]));
  if (state.metric==="ret" && GENERATOR_KINDS[I.kind].rule!=="lower-better")
    plot(g,m,[0,100],yr,[[0,I.threshold],[100,I.threshold]],g.muted,[3,4]);
  legendBox(g,legend, g.coarse ? 24 : m.l+12, g.coarse ? g.h-legendHeight(g,legend)+8 : m.t+16);
  const heads = series.map(s=>`<td>${esc(s.c.id)}</td>`).join("");
  const rows = [100,75,50,25,10].map(p=>{
    const cells = series.map(s=>{
      const st=stateFor(s.c,{...I,phi:p/100}), v=metricValue(s.c,st,state.metric);
      return `<td>${v==null?"—":(state.metric==="net"?F2(v):F1(v))}</td>`;
    }).join("");
    return `<tr><td>${p} %</td>${cells}</tr>`;
  }).join("");
  if (cmpTbl) cmpTbl.innerHTML = `<table class="kv cmptbl"><tr><td>${esc(tr(T.lLoad))}</td>${heads}</tr>${rows}</table>`;
}

function renderAuthority(I){
  if (!authStage) return;
  const g=ctxSetup(authStage);
  const legend=[[tr(CHT.linRef),g.line],[tr(CHT.eqInh),"#c2410c",[7,5]],
    [tr(CHT.eqAt)+F2(I.a),"#1d4ed8"],[tr(CHT.linAt)+F2(I.a),"#0f766e",[3,4]]];
  const m={l:52,r:16,t:16,b:36+legendHeight(g,legend)};
  axes(g,m,[0,100],[0,100],tr(CHT.travel),"q / q₁₀₀, %");
  const mk=(a,kind)=>{const p=[];for(let i=0;i<=100;i++){const y=i/100;p.push([y*100, installedChar(y,a,kind)*100]);}return p;};
  plot(g,m,[0,100],[0,100],[[0,0],[100,100]],g.line);
  plot(g,m,[0,100],[0,100],mk(1,"equal-percent"),"#c2410c",[7,5]);
  plot(g,m,[0,100],[0,100],mk(I.a,"equal-percent"),"#1d4ed8");
  plot(g,m,[0,100],[0,100],mk(I.a,"linear"),"#0f766e",[3,4]);
  legendBox(g,legend, g.coarse ? 24 : m.l+12, g.coarse ? g.h-legendHeight(g,legend)+8 : m.t+16);
  let dev=0, devLin=0;
  for(let i=0;i<=200;i++){const y=i/200;
    dev=Math.max(dev,Math.abs(installedChar(y,I.a,"equal-percent")-y));
    devLin=Math.max(devLin,Math.abs(installedChar(y,I.a,"linear")-y));}
  const sz=sizeValve({a:Math.min(.95,Math.max(.05,I.a)), dpR1:15, dpR2:10, q100_m3h:1.2});
  if (authTbl) authTbl.innerHTML=`<table class="kv">
   <tr><td>${esc(tr(CHT.rowEq))}</td><td>${F3(dev)}</td></tr>
   <tr><td>${esc(tr(CHT.rowLin))}</td><td>${F3(devLin)}</td></tr>
   <tr><td>${esc(tr(CHT.rowDp))} (Δp₁+Δp₂ = 25 kPa)</td><td>${F2(sz.dpValve)} kPa</td></tr>
   <tr><td>${esc(tr(T.kKvs))} (q₁₀₀ = 1,2 m³/h)</td><td>${F2(sz.kvs)}</td></tr></table>`;
}

 * UI_FRAMEWORK_SPEC.md §12 требует, чтобы через словарь проходила КАЖДАЯ

function runChecks(I){
  if (!valHost) return;
  const out=[], ck=(n,c,d)=>out.push(`<div class="flag ${c?"ok":"bad"}">${c?"✓":"✗"} ${esc(n)}${d?" — "+esc(d):""}</div>`);
  const dpz=designPoint({QkW:I.QkW,tSupply:I.tSupply,tReturn:I.tReturn,tRoom:I.tRoom,
    type:I.type==="embedded"?"radiator":I.type});
  let worst=0;
  for (const [fn,t1] of [[G4,I.tSupply],[G6,I.tSupply],[G5,I.tNet],[G7,I.tNet],[G8,I.tNet],[INJ3,I.tNet]])
    for (const phi of [1,.75,.5,.25,.1,.02]){
      const r=fn(dpz,phi,t1);
      worst=Math.max(worst, Math.abs(r.qvp*(h(r.t1)-h(r.t4))-r.Q)/Math.max(r.Q,1));
    }
  ck(tr(CHK.balance), worst<1e-9, tr(CHK.residual)+" "+worst.toExponential(1));
  let du=0;
  for(let i=0;i<=200;i++){const y=i/200;du=Math.max(du,Math.abs(installedChar(y,1,"equal-percent")-baseChar(y,"equal-percent")));}
  ck(tr(CHK.authOne), du<1e-12, tr(CHK.dev)+" "+du.toExponential(1));
  ck(tr(CHK.inv), Math.abs(tFromH(h(70))-70)<1e-9, tr(CHK.roundtrip));
  ck(tr(CHK.dtnom), Math.abs(DT_NOM-49.83)<0.005, DT_NOM.toFixed(4)+" K");
  const g0=generatorFlow([G7(dpz,0,I.tNet),G8(dpz,0,I.tNet)]);
  ck(tr(CHK.starve), g0.qGen<1e-9, tr(CHK.flow)+" "+g0.qGen.toExponential(1)+" kg/s");
  const p={H100:I.head,Q100:kgs_to_m3h(dpz.mdot,60),H0:I.head*1.5,Qmax:kgs_to_m3h(dpz.mdot,60)*2.2};
  ck(tr(CHK.propdp),
     Math.abs(controlHead(0,"proportional-dp",p)-I.head/2)<1e-9, (I.head/2).toFixed(1)+" kPa");
  const vc=returnVerdict(45,{kind:"cast_iron",threshold:55}), vd=returnVerdict(45,{kind:"condensing",threshold:55});
  ck(tr(CHK.opposite),
     vc.status==="bad" && vd.status==="good", "45 °C: "+vc.status+" vs "+vd.status);
  valHost.innerHTML=out.join("");
}

/* ---------- язык ----------
 * The language control is framework furniture now (UI_FRAMEWORK_SPEC.md §12):
 * the header owns the switcher, diagram-ui.js owns the precedence
 * (?lang= -> localStorage.diagram_site_lang -> legacy diagram_lang -> browser -> en), writes
 * <html lang> through Diagram.setDocumentLang and re-renders every panel.
 * The one string the framework does not own is the document title, and it
 * still has to follow the manifest, because a page opened in German used to
 * announce itself in English to the tab, the history and the screen reader. */
const TITLES = {"en": "Hydraulic Circuit Solutions", "uk": "Бібліотека гідравлічних схем", "de": "Hydraulische Schaltungen — Lösungsbibliothek", "nl": "Hydraulische schakelingen — oplossingenbibliotheek", "fr": "Schémas hydrauliques — bibliothèque de solutions", "es": "Esquemas hidráulicos — biblioteca de soluciones", "pl": "Rozwiązania układów hydraulicznych"};
function applyTitle(){

/* ===================================================================
 * Framework v2 — diagram-common.js (FRAMEWORK_V2_SPEC.md)
 * State codec and permalink, calculation record, PDF report, handoff.
 * Everything is read from what the page has already computed.
 * =================================================================== */
/* The permalink contract. The payload keeps the SHAPE it has always had —
 * v, lang, filter, metric, cmp[], open[], and one entry per control under
 * the control's old element id — so every link ever built by this page keeps
 * working. Only the source of the values moved: from the DOM to `state`. */
const DGC_FIELDS = ["i-q","i-ts","i-tr","i-troom","i-tnet","i-type","i-gen","i-thr",
                    "i-auth","i-head","i-eta","i-hdr","i-load"];
const BY_ID = {};
FIELDS.forEach(f => { BY_ID[f.id] = f; });
PICKERS.forEach(f => { BY_ID[f.id] = f; });

function dgcSerialize(){
  const o={v:1,lang:lang,filter:state.filter,metric:state.metric,cmp:[...state.cmp]};
  DGC_FIELDS.forEach(id=>{ const f=BY_ID[id]; if(f) o[id]=String(state[f.key]); });
  o.open=[...document.querySelectorAll("details.card")].filter(d=>d.open)
    .map(d=>d.dataset.id);
  return o;
}
function dgcDeserialize(st){
  if(!st||typeof st!=="object"||st.v!==1) throw new Error("unrecognised state payload");
  state.filter = (st.filter&&PROBLEMS.some(p=>p.id===st.filter)) ? st.filter : null;
  state.metric = ["ret","net","sup","pow"].includes(st.metric) ? st.metric : state.metric;
  state.cmp.length=0; (st.cmp||[]).forEach(id=>{ if(CARDS.some(c=>c.id===id)&&!cmpHas(id)) state.cmp.push(id); });
  DGC_FIELDS.forEach(id=>{
    const f=BY_ID[id]; if(!f || st[id]===undefined) return;
    if (PICKERS.some(p=>p.id===id)) state[f.key]=String(st[id]);
    else { const x=parseFloat(st[id]); if(isFinite(x)) state[f.key]=x; }
  });
  /* The whole library is rebuilt because the filter may have moved, the
   * fields are re-read from `state`, and only then are the cards that were
   * open when the link was made re-opened. */
  /* The language goes first, because switching it rebuilds every panel and
   * the rebuild must find the state it is to render already in place. */
  if(st.lang&&LANGS.includes(st.lang)&&ui&&st.lang!==lang) ui.setLang(st.lang);
  else { renderChips(); buildLibrary(); if (ui){ ui.sync(); want("design"); ui.run(); drawAuthority(); } }
  (st.open||[]).forEach(id=>{ const d=document.querySelector(`details.card[data-id="${id}"]`);
    if(d) d.open=true; });
}

/* Units of every recorded quantity, by suffix. */
const DGC_UNITS = {supply:"°C", return:"°C", network_flow:"m3/h", consumer_flow:"m3/h",
                   mixing_flow:"m3/h", cross_flow:"m3/h", supply_shortfall:"K",
                   worst_case_supply:"°C", duty_flow:"m3/h", duty_head:"kPa",
                   shaft_power:"W", vs_fixed_pump:"%"};

/* ---------- python export (§1.4) ----------
 * The page's own water properties are a 34-term IF97 region-1 polynomial plus
 * a 0.05 K enthalpy table with linear interpolation, and every circuit is
 * solved by bisection on that enthalpy. Hand-porting the polynomial and the
 * table into an exported script would be ~60 lines of coefficients nobody can
 * check; iapws carries the same IAPWS R7-97 formulation, so the script asks it
 * for the property and keeps the circuit algebra of this page line for line.
 * That is a RECOMPUTE of the property model and a REPRODUCE of everything
 * else, and the generated header says exactly that. */
const PY_HS = `# ---- water properties: IAPWS-IF97 region 1, this page's own engine, ported ----
# The page carries a 34-term region-1 gibbs polynomial (itself a verbatim copy of
# the engine in steam_tables.html on this site) and, on top of it, a 0.05 K
# enthalpy table with linear interpolation built from that same polynomial, so
# that dragging the load slider does not evaluate 34 powers a hundred thousand
# times. Both are carried into this script, coefficients and all: the numbers
# below are the page's numbers, not a library's answer to the same question.
# Source of the coefficients: IAPWS R7-97 (2012), Table 2, region 1.
R = 0.461526             # kJ/(kg K)
R1 = ${JSON.stringify(R1)}


def region1(p, T):
    """Region-1 gibbs polynomial. p in MPa, T in K; v m3/kg, h and cp kJ/kg."""
    pi = p / 16.53
    tau = 1386.0 / T
    g = gp = gt = gtt = 0.0
    for I, J, n in R1:
        a = (7.1 - pi) ** I
        b = (tau - 1.222) ** J
        g += n * a * b
        gp += -n * I * (7.1 - pi) ** (I - 1) * b
        gt += n * a * J * (tau - 1.222) ** (J - 1)
        gtt += n * a * J * (J - 1) * (tau - 1.222) ** (J - 2)
    return {'v': pi * gp * R * T / p / 1000.0, 'h': tau * gt * R * T,
            'u': R * T * (tau * gt - pi * gp), 's': R * (tau * gt - g),
            'cp': -R * tau * tau * gtt}


P_DEFAULT = 0.3          # MPa, the circuit working pressure the page uses
K = 273.15


def guard(t_c):
    if not (t_c > 0 and t_c < 350):
        raise ValueError('outside IF97 region 1: %s degC' % t_c)


def rho(t_c, p=P_DEFAULT):
    """Density, kg/m3."""
    guard(t_c)
    return 1.0 / region1(p, t_c + K)['v']


def cp(t_c, p=P_DEFAULT):
    """Specific heat capacity, J/(kg K)."""
    guard(t_c)
    return region1(p, t_c + K)['cp'] * 1000.0


def h_exact(t_c, p=P_DEFAULT):
    """Specific enthalpy from the polynomial itself, J/kg."""
    guard(t_c)
    return region1(p, t_c + K)['h'] * 1000.0


# The page's interpolation table, built from the polynomial above on first use,
# with exactly the page's bounds and step. Enthalpy is very nearly linear in T
# over 0.05 K, and the page's own test bounds the error this introduces; it is
# reproduced here rather than dropped, because dropping it would change the
# numbers in the last digits and this script is meant to return the page's.
TB_LO, TB_HI, TB_STEP = 0.05, 220.0, 0.05
_TB = None


def _table():
    global _TB
    if _TB is None:
        n = int(round((TB_HI - TB_LO) / TB_STEP)) + 1
        _TB = [region1(P_DEFAULT, TB_LO + i * TB_STEP + K)['h'] * 1000.0 for i in range(n)]
    return _TB


def hw(t_c, p=P_DEFAULT):
    """Specific enthalpy, J/kg — table-interpolated exactly as the page does it."""
    if p != P_DEFAULT:
        return h_exact(t_c, p)
    guard(t_c)
    if t_c < TB_LO or t_c > TB_HI:
        return h_exact(t_c, p)
    a = _table()
    x = (t_c - TB_LO) / TB_STEP
    i = int(x)
    f = x - i
    return a[i] + f * (a[i + 1] - a[i])


def t_from_h(h_j, p=P_DEFAULT):
    """Temperature from enthalpy, degC — the page's own inverse.

    Enthalpy rises strictly with T in region 1, so inside the table the page
    does a binary search and interpolates within the bracketing step; outside
    it, it bisects on the polynomial. Both branches are kept."""
    if p == P_DEFAULT:
        a = _table()
        if a[0] <= h_j <= a[-1]:
            lo, hi = 0, len(a) - 1
            while hi - lo > 1:
                m = (lo + hi) >> 1
                if a[m] <= h_j:
                    lo = m
                else:
                    hi = m
            d = a[hi] - a[lo]
            return TB_LO + (lo + ((h_j - a[lo]) / d if d != 0 else 0.0)) * TB_STEP
    lo, hi = 0.001, 349.999
    for _ in range(200):
        mid = 0.5 * (lo + hi)
        if h_exact(mid, p) < h_j:
            lo = mid
        else:
            hi = mid
        if hi - lo < 1e-12:
            break
    return 0.5 * (lo + hi)


def m3h_to_kgs(q_m3h, t_c, p=P_DEFAULT):
    return q_m3h * rho(t_c, p) / 3600.0


def kgs_to_m3h(m_kgs, t_c, p=P_DEFAULT):
    return m_kgs * 3600.0 / rho(t_c, p)


# ---- emitter: EN 442 ----
def dt_log(t_supply, t_return, t_room):
    a = t_supply - t_room
    b = t_return - t_room
    if a <= 0 or b <= 0:
        return 0.0
    if abs(a - b) < 1e-9:
        return a
    return (a - b) / math.log(a / b)


DT_NOM = dt_log(75.0, 65.0, 20.0)          # 49.83 K at the 75/65/20 rating point

EMITTER_EXPONENT = {'radiator': 1.30, 'convector': 1.35, 'vloerconvector': 1.35,
                    'paneel': 1.25, 'plafondpaneel': 1.25,
                    'ventilo': 1.00, 'luchtverwarmer': 1.00}


def emitter_factor(t_supply, t_return, t_room, kind='radiator'):
    dt = dt_log(t_supply, t_return, t_room)
    if dt <= 0:
        return 0.0
    n = EMITTER_EXPONENT.get(kind, 1.30)
    return (dt / DT_NOM) ** n


# ---- numerics: the page's own bisection, iteration for iteration ----
def bisect(f, lo, hi, tol=1e-10, max_iter=200):
    flo, fhi = f(lo), f(hi)
    if not (math.isfinite(flo) and math.isfinite(fhi)):
        raise ValueError('bisect: bracket endpoint is not a number')
    if flo == 0:
        return lo
    if fhi == 0:
        return hi
    if flo * fhi > 0:
        raise ValueError('bisect: root is not bracketed')
    for _ in range(max_iter):
        mid = 0.5 * (lo + hi)
        fm = f(mid)
        if fm == 0 or (hi - lo) < tol:
            return mid
        if flo * fm < 0:
            hi, fhi = mid, fm
        else:
            lo, flo = mid, fm
    return 0.5 * (lo + hi)


# ---- consumer design point and emitter solution ----
def design_point(q_kw, t_supply, t_return, t_room, kind='radiator'):
    q = q_kw * 1000.0
    return {'Q': q, 'tSupply': t_supply, 'tReturn': t_return, 'tRoom': t_room,
            'type': kind, 'mdot': q / (hw(t_supply) - hw(t_return)),
            'dt': dt_log(t_supply, t_return, t_room),
            'factor': emitter_factor(t_supply, t_return, t_room, kind)}


def emitter_output(dp, t_supply, mdot):
    """Intersection of Q = m (h(ts) - h(tr)) with the EN 442 output curve."""
    if mdot <= 0:
        return {'Q': 0.0, 'tReturn': dp['tRoom']}
    if t_supply <= dp['tRoom']:
        return {'Q': 0.0, 'tReturn': t_supply}
    qn = dp['Q'] / dp['factor']
    def g(tr):
        return mdot * (hw(t_supply) - hw(tr)) - qn * emitter_factor(t_supply, tr, dp['tRoom'], dp['type'])
    t_ret = bisect(g, dp['tRoom'], t_supply)
    return {'Q': mdot * (hw(t_supply) - hw(t_ret)), 'tReturn': t_ret}


def solve_variable_flow(dp, q_req, t_supply):
    """Fixed supply, flow found: circuits G4 and G6."""
    if q_req <= 0:
        return {'mdot': 0.0, 'tReturn': dp['tRoom'], 'Q': 0.0}
    hi = dp['mdot']
    for _ in range(60):
        if emitter_output(dp, t_supply, hi)['Q'] >= q_req:
            break
        hi *= 2.0
    if emitter_output(dp, t_supply, hi)['Q'] < q_req:
        raise ValueError('emitter cannot reach the required output at any flow')
    mdot = bisect(lambda m: emitter_output(dp, t_supply, m)['Q'] - q_req, 0.0, hi, 1e-14)
    s = emitter_output(dp, t_supply, mdot)
    return {'mdot': mdot, 'tReturn': s['tReturn'], 'Q': s['Q']}


def solve_constant_flow(dp, q_req, mdot):
    """Constant flow, supply temperature found: circuits G5, G7, G8, INJ3."""
    if q_req <= 0:
        return {'tSupply': dp['tRoom'], 'tReturn': dp['tRoom'], 'Q': 0.0}
    lo = dp['tRoom']
    hi = dp['tSupply']
    for _ in range(60):
        if emitter_output(dp, hi, mdot)['Q'] >= q_req:
            break
        hi += 50.0
    t_sup = bisect(lambda ts: emitter_output(dp, ts, mdot)['Q'] - q_req, lo, hi, 1e-12)
    s = emitter_output(dp, t_sup, mdot)
    return {'tSupply': t_sup, 'tReturn': s['tReturn'], 'Q': s['Q']}


# ---- family A: consumer circuits. Every junction closes on ENTHALPY ----
def primary_share(qvs, t1, t2, t3):
    d = hw(t1) - hw(t3)
    if d == 0:
        return 0.0
    return max(0.0, qvs * (hw(t2) - hw(t3)) / d)


def fixed_mix_ratio(t1, t2, t3):
    if t1 == t3:
        return 0.0
    return (t1 - t2) / (t1 - t3)


def G6(dp, phi, t1):
    """Passive throttling with a two-way valve."""
    s = solve_variable_flow(dp, phi * dp['Q'], t1)
    return {'qvp': s['mdot'], 'qvs': s['mdot'], 'qmeng': 0.0,
            't1': t1, 't2': t1, 't3': s['tReturn'], 't4': s['tReturn']}


def G4(dp, phi, t1, qvp_const=None):
    """Passive diverting circuit: constant network flow, bypass at t1."""
    qvp_const = dp['mdot'] if qvp_const is None else qvp_const
    s = solve_variable_flow(dp, phi * dp['Q'], t1)
    q_bypass = max(0.0, qvp_const - s['mdot'])
    t4 = t_from_h((s['mdot'] * hw(s['tReturn']) + q_bypass * hw(t1)) / qvp_const) if qvp_const > 0 else t1
    return {'qvp': qvp_const, 'qvs': s['mdot'], 'qmeng': 0.0, 'qBypass': q_bypass,
            't1': t1, 't2': t1, 't3': s['tReturn'], 't4': t4}


def G7(dp, phi, t1):
    """Active mixing circuit with a three-way valve."""
    qvs = dp['mdot']
    s = solve_constant_flow(dp, phi * dp['Q'], qvs)
    qvp = max(0.0, primary_share(qvs, t1, s['tSupply'], s['tReturn']))
    return {'qvp': qvp, 'qvs': qvs, 'qmeng': qvs - qvp,
            't1': t1, 't2': s['tSupply'], 't3': s['tReturn'], 't4': s['tReturn']}


def G8(dp, phi, t1):
    """Active mixing with a fixed premix share a = (t1-t2)/(t1-t3)."""
    a = fixed_mix_ratio(t1, dp['tSupply'], dp['tReturn'])
    qvs = dp['mdot']
    s = solve_constant_flow(dp, phi * dp['Q'], qvs)
    qvp = max(0.0, primary_share(qvs, t1, s['tSupply'], s['tReturn']))
    return {'a': a, 'qvp': qvp, 'qvs': qvs, 'qmeng': qvs - qvp,
            'qvp100': (1 - a) * qvs, 'qmeng100': a * qvs,
            't1': t1, 't2': s['tSupply'], 't3': s['tReturn'], 't4': s['tReturn']}


def G5(dp, phi, t1):
    """Passive throttling with a fixed premix share."""
    a = fixed_mix_ratio(t1, dp['tSupply'], dp['tReturn'])
    qvs = dp['mdot']
    s = solve_constant_flow(dp, phi * dp['Q'], qvs)
    qvp = max(0.0, primary_share(qvs, t1, s['tSupply'], s['tReturn']))
    return {'a': a, 'qvp': qvp, 'qvs': qvs, 'qmeng': qvs - qvp, 'qvp100': (1 - a) * qvs,
            't1': t1, 't2': s['tSupply'], 't3': s['tReturn'], 't4': s['tReturn']}


def INJ3(dp, phi, t1, qvp_const=None):
    """Injection circuit with a three-way valve: both flows constant."""
    qvp_const = dp['mdot'] if qvp_const is None else qvp_const
    qvs = dp['mdot']
    s = solve_constant_flow(dp, phi * dp['Q'], qvs)
    q_inj = primary_share(qvs, t1, s['tSupply'], s['tReturn'])
    q_bypass = max(0.0, qvp_const - q_inj)
    t4 = t_from_h((q_inj * hw(s['tReturn']) + q_bypass * hw(t1)) / qvp_const) if qvp_const > 0 else t1
    return {'qvp': qvp_const, 'qvs': qvs, 'qmeng': qvs - q_inj, 'qInj': q_inj, 'qBypass': q_bypass,
            't1': t1, 't2': s['tSupply'], 't3': s['tReturn'], 't4': t4}


# ---- family B: generator connection ----
def generator_flow(modules):
    qvp = sum(m['qvp'] for m in modules)
    heat = sum(m['qvp'] * m['t4'] for m in modules)
    return {'qGen': qvp, 'tReturn': (heat / qvp) if qvp > 0 else None}


def shunt_pump(q_gen, t_return, t_supply, t_return_min):
    if t_return is None or t_return >= t_return_min:
        return {'qShunt': 0.0, 'tReturnMixed': t_return, 'active': False}
    if t_supply <= t_return_min:
        raise ValueError('supply is below the required return minimum')
    q_shunt = q_gen * (hw(t_return_min) - hw(t_return)) / (hw(t_supply) - hw(t_return_min))
    return {'qShunt': q_shunt, 'tReturnMixed': t_return_min, 'active': True}


def return_mix_valve(q_gen, t_return, t_supply, t_return_min):
    if t_return is None or t_return >= t_return_min:
        return {'fraction': 0.0, 'tReturnMixed': t_return, 'active': False}
    x = (hw(t_return_min) - hw(t_return)) / (hw(t_supply) - hw(t_return))
    return {'fraction': x, 'tReturnMixed': t_return_min, 'active': True}


def relief_valve(dp_now, dp_set, kv):
    if dp_now <= dp_set:
        return {'qBypass': 0.0, 'open': False, 'excess': 0.0}
    excess = dp_now - dp_set
    return {'qBypass': kv * math.sqrt(excess / 100.0), 'open': True, 'excess': excess}


# ---- family C: decoupling ----
def decoupler(qp, tp, qs, ts):
    undersized = qp < qs
    q_cross = abs(qp - qs)
    if not undersized:
        t_secondary_supply = tp
        t_primary_return = t_from_h((qs * hw(ts) + (qp - qs) * hw(tp)) / qp) if qp > 0 else tp
    else:
        t_secondary_supply = t_from_h((qp * hw(tp) + (qs - qp) * hw(ts)) / qs) if qs > 0 else tp
        t_primary_return = ts
    return {'undersized': undersized, 'qCross': q_cross,
            'tSecondarySupply': t_secondary_supply, 'tPrimaryReturn': t_primary_return,
            'supplyShortfall': tp - t_secondary_supply}


def plate_separation(t_primary_supply, approach, qs, ts_return):
    t_secondary_supply = t_primary_supply - approach
    return {'tSecondarySupply': t_secondary_supply, 'approach': approach,
            'duty': qs * (hw(t_secondary_supply) - hw(ts_return))}


# ---- valve authority and sizing ----
def size_valve(a, dp_r1, dp_r2, q100_m3h):
    if a <= 0 or a >= 1:
        raise ValueError('authority must lie strictly between 0 and 1')
    dp_valve = (a / (1 - a)) * (dp_r1 + dp_r2)              # kPa
    return {'dpValve': dp_valve, 'dpAvailable': dp_valve + dp_r1 + dp_r2,
            'kvs': q100_m3h / math.sqrt(dp_valve / 100.0)}


# ---- family D: pumps ----
def pump_head(q, h0, q_max):
    if q <= 0:
        return h0
    if q >= q_max:
        return 0.0
    return h0 * (1 - (q / q_max) ** 2)


def system_head(q, r):
    return r * q * q


def resistance_for(q, h):
    return h / (q * q) if q > 0 else float('inf')


def control_head(q, mode, p):
    if mode == 'fixed':
        return pump_head(q, p['H0'], p['Qmax'])
    if mode == 'constant-dp':
        return p['H100']
    if mode == 'proportional-dp':
        return p['H100'] / 2 + (p['H100'] / 2) * (q / p['Q100'] if p['Q100'] > 0 else 0.0)
    if mode == 'constant-flow':
        return None
    raise ValueError('unknown pump mode: ' + str(mode))


def duty_point(mode, r, p):
    if mode == 'constant-flow':
        return {'Q': p['Q100'], 'H': system_head(p['Q100'], r), 'mode': mode}
    def f(q):
        return control_head(q, mode, p) - system_head(q, r)
    hi = max(p['Qmax'], p['Q100']) * 4
    if f(1e-9) <= 0:
        return {'Q': 0.0, 'H': control_head(0.0, mode, p), 'mode': mode}
    if f(hi) > 0:
        return {'Q': hi, 'H': system_head(hi, r), 'mode': mode}
    q = bisect(f, 1e-9, hi, 1e-12)
    return {'Q': q, 'H': system_head(q, r), 'mode': mode}


def pump_power(q_m3h, h_kpa, eta=0.55):
    p_hyd = (q_m3h / 3600.0) * h_kpa * 1000.0
    return {'hydraulic': p_hyd, 'shaft': (p_hyd / eta) if eta > 0 else float('inf')}


# ---- the twenty-two cards of the page, in page order ----
CARDS = [
    ('A1', 'throttle', None), ('A2', 'throttle-premix', None),
    ('A3', 'divert', None), ('A4', 'divert', None),
    ('A5', 'mix', None), ('A6', 'mix-premix', None),
    ('A7', 'inject2', None), ('A8', 'inject3', None),
    ('B1', 'gen-passive', None), ('B2', 'gen-active', None),
    ('B3', 'shunt', None), ('B4', 'retmix', None), ('B5', 'retmix', None),
    ('B6', 'relief', None),
    ('C1', 'decouple', None), ('C2', 'decouple', None),
    ('C3', 'decouple-balanced', None), ('C4', 'plate', None),
    ('D1', 'pump', 'fixed'), ('D2', 'pump', 'constant-dp'),
    ('D3', 'pump', 'proportional-dp'), ('D4', 'pump', 'constant-flow'),
]

MIX_MODELS = ('throttle', 'throttle-premix', 'divert', 'mix', 'mix-premix', 'inject2', 'inject3')
GEN_MODELS = ('gen-passive', 'gen-active', 'shunt', 'retmix', 'relief')
DEC_MODELS = ('decouple', 'decouple-balanced', 'plate')


def state_for(model, pump_mode, dp, I, memo):
    """One card's state. Same dispatch, same shared sub-models as the page."""
    direct, mixed = I['tSupply'], I['tNet']
    phi = I['phi']

    def M(fn, *args):
        key = (fn.__name__,) + args
        if key not in memo:
            memo[key] = fn(dp, *args)
        return memo[key]

    if model == 'throttle':
        return M(G6, phi, direct)
    if model == 'throttle-premix':
        return M(G5, phi, mixed)
    if model == 'divert':
        return M(G4, phi, direct)
    if model == 'mix' or model == 'inject2':
        return M(G7, phi, mixed)
    if model == 'mix-premix':
        return M(G8, phi, mixed)
    if model == 'inject3':
        return M(INJ3, phi, mixed)
    if model in ('gen-passive', 'gen-active'):
        mods = [M(G7, phi, mixed), M(G8, phi, mixed)] if model == 'gen-passive' \
            else [M(G7, phi, mixed), M(G4, phi, direct)]
        g = generator_flow(mods)
        full = generator_flow([M(G7, 1.0, mixed), M(G8, 1.0, mixed)] if model == 'gen-passive'
                              else [M(G7, 1.0, mixed), M(G4, 1.0, direct)])['qGen']
        return {'qGen': g['qGen'], 'tRet': I['tRoom'] if g['tReturn'] is None else g['tReturn'],
                't1': mixed, 'starved': model == 'gen-passive' and g['qGen'] < 0.05 * full}
    if model in ('shunt', 'retmix', 'relief'):
        g = generator_flow([M(G7, phi, mixed), M(G6, phi, direct)])
        t_ret = I['tRoom'] if g['tReturn'] is None else g['tReturn']
        q_gen = max(g['qGen'], 1e-9)
        if model == 'relief':
            q_now = max(kgs_to_m3h(g['qGen'], 60), 1e-9)
            dp_now = pump_head(q_now, I['head'] * 1.5, kgs_to_m3h(dp['mdot'], 60) * 2.2)
            rv = relief_valve(dp_now, I['head'], kgs_to_m3h(dp['mdot'], 60))
            q_b = m3h_to_kgs(rv['qBypass'], 60)
            t_mix = t_from_h((q_gen * hw(t_ret) + q_b * hw(mixed)) / (q_gen + q_b)) \
                if (q_gen + q_b) > 0 else t_ret
            return {'t1': mixed, 'tRet': t_ret, 'tMix': t_mix, 'active': rv['open'],
                    'qGen': q_gen, 'qBypass': q_b, 'dpNow': dp_now}
        s = shunt_pump(q_gen, t_ret, mixed, I['threshold']) if model == 'shunt' \
            else return_mix_valve(q_gen, t_ret, mixed, I['threshold'])
        return {'t1': mixed, 'tRet': t_ret,
                'tMix': t_ret if s['tReturnMixed'] is None else s['tReturnMixed'],
                'active': s['active'], 'qShunt': s.get('qShunt'), 'fraction': s.get('fraction'),
                'qGen': q_gen}
    if model in ('decouple', 'decouple-balanced'):
        sec = M(G7, phi, mixed)
        qs = sec['qvs']
        qp = qs if model == 'decouple-balanced' else qs * I['hdr']
        d = decoupler(qp, mixed, qs, sec['t3'])
        d.update({'qP': qp, 'qS': qs, 'tP': mixed, 'tS': sec['t3']})
        return d
    if model == 'plate':
        sec = M(G7, phi, mixed)
        approach = 4.0
        r = plate_separation(mixed, approach, sec['qvs'], sec['t3'])
        return {'tP': mixed, 'tS': sec['t3'], 'tSecondarySupply': r['tSecondarySupply'],
                'approach': approach, 'tPrimaryReturn': sec['t3'] + approach,
                'qP': sec['qvs'], 'qS': sec['qvs'], 'qCross': 0.0}
    if model == 'pump':
        q100 = kgs_to_m3h(dp['mdot'], 60)
        p = {'H100': I['head'], 'Q100': q100, 'H0': I['head'] * 1.5, 'Qmax': q100 * 2.2}
        r = resistance_for(q100 * max(0.05, phi), I['head'])
        duty = duty_point(pump_mode, r, p)
        duty_fixed = duty_point('fixed', r, p)
        return {'mode': pump_mode, 'duty': duty,
                'power': pump_power(duty['Q'], duty['H'], I['eta']),
                'powerFixed': pump_power(duty_fixed['Q'], duty_fixed['H'], I['eta'])}
    return {}


def ret_of(model, st):
    if model in MIX_MODELS:
        return st.get('t4')
    if model in ('gen-passive', 'gen-active'):
        return st.get('tRet')
    if model in ('shunt', 'retmix', 'relief'):
        return st.get('tMix')
    if model in DEC_MODELS:
        return st.get('tPrimaryReturn')
    return None


def net_of(model, st):
    if model in MIX_MODELS:
        return st.get('qvp')
    if model in GEN_MODELS:
        return st.get('qGen')
    if model in DEC_MODELS:
        return st.get('qP')
    return None


def sup_of(model, st):
    if model in MIX_MODELS:
        return st.get('t2')
    if model in DEC_MODELS:
        return st.get('tSecondarySupply')
    if model in GEN_MODELS:
        return st.get('t1')
    return None


def compute():
    """Every number the page records, card by card, in the page's own order."""
    I = {'QkW': INPUTS['consumer_output'], 'tSupply': INPUTS['design_supply'],
         'tReturn': INPUTS['design_return'], 'tRoom': INPUTS['room'],
         'tNet': INPUTS['network_supply'], 'type': INPUTS['emitter_type'],
         'kind': INPUTS['generator_kind'], 'threshold': INPUTS['return_threshold'],
         'a': INPUTS['valve_authority'], 'head': INPUTS['design_head'],
         'eta': INPUTS['pump_efficiency'], 'hdr': INPUTS['header_flow_ratio'],
         'phi': INPUTS['load'] / 100.0}
    et = 'radiator' if I['type'] == 'embedded' else I['type']
    out = {}
    memo = {}
    try:
        dp = design_point(I['QkW'], I['tSupply'], I['tReturn'], I['tRoom'], et)
    except Exception:
        dp = None                          # the page shows an error on every card instead

    def put(cid, key, value):
        if value is None:
            return
        if isinstance(value, float) and not math.isfinite(value):
            return
        out[cid + '.' + key] = value

    for cid, model, pump_mode in CARDS:
        try:
            if dp is None:
                raise ValueError('no design point')
            st = state_for(model, pump_mode, dp, I, memo)
        except Exception:
            continue                       # the page shows the card's error instead
        if model == 'pump':
            put(cid, 'duty_flow', st['duty']['Q'])
            put(cid, 'duty_head', st['duty']['H'])
            put(cid, 'shaft_power', st['power']['shaft'])
            put(cid, 'vs_fixed_pump', 100 * st['power']['shaft'] / st['powerFixed']['shaft']
                if st['powerFixed']['shaft'] > 0 else None)
            continue
        put(cid, 'supply', sup_of(model, st))
        put(cid, 'return', ret_of(model, st))
        n = net_of(model, st)
        if n is not None:
            put(cid, 'network_flow', kgs_to_m3h(n, 60))
        if st.get('qvs') is not None:
            put(cid, 'consumer_flow', kgs_to_m3h(st['qvs'], 60))
        if st.get('qS') is not None:
            put(cid, 'consumer_flow', kgs_to_m3h(st['qS'], 60))
        if st.get('qmeng'):                # zero mixing flow is not shown, as on the page
            put(cid, 'mixing_flow', kgs_to_m3h(st['qmeng'], 60))
        if st.get('qCross') is not None:
            put(cid, 'cross_flow', kgs_to_m3h(st['qCross'], 60))
            put(cid, 'supply_shortfall', st.get('supplyShortfall'))

    sz = size_valve(min(0.95, max(0.05, I['a'])), 15.0, 10.0, 1.2)
    out['valve.dp_valve'] = sz['dpValve']
    out['valve.kvs'] = sz['kvs']
    return out
`;

function dgcPython(){

function dgcRecord(){
  const I = inputs();
  const inp = {
    consumer_output: I.QkW, design_supply: I.tSupply, design_return: I.tReturn,
    room: I.tRoom, network_supply: I.tNet, emitter_type: I.type,
    generator_kind: I.kind, return_threshold: I.threshold, valve_authority: I.a,
    design_head: I.head, pump_efficiency: I.eta, header_flow_ratio: I.hdr,
    load: 100*I.phi
  };
  const units = {consumer_output:"kW", design_supply:"°C", design_return:"°C", room:"°C",
    network_supply:"°C", emitter_type:"", generator_kind:"", return_threshold:"°C",
    valve_authority:"-", design_head:"kPa", pump_efficiency:"-", header_flow_ratio:"-",
    load:"%"};
  const out={}, warn=[];
  for (const c of CARDS){
    const st = stateFor(c, I);
    const put=(k,v,u)=>{ if(v==null||!isFinite(v)) return; out[c.id+"."+k]=v; units[c.id+"."+k]=u; };
    if (st.error){ warn.push(c.id+": "+tr(T[st.errorKey]||T.eCalc)); continue; }
    if (c.model==="pump"){
      put("duty_flow", st.duty.Q, "m3/h"); put("duty_head", st.duty.H, "kPa");
      put("shaft_power", st.power.shaft, "W");
      put("vs_fixed_pump", st.powerFixed.shaft>0?100*st.power.shaft/st.powerFixed.shaft:null, "%");
      continue;
    }
    put("supply", supOf(c,st), "°C");
    put("return", retOf(c,st), "°C");
    const n=netOf(c,st); if(n!=null) put("network_flow", kgs_to_m3h(n,60), "m3/h");
    if (st.qvs!=null) put("consumer_flow", kgs_to_m3h(st.qvs,60), "m3/h");
    if (st.qS!=null)  put("consumer_flow", kgs_to_m3h(st.qS,60), "m3/h");
    if (st.qmeng)     put("mixing_flow", kgs_to_m3h(st.qmeng,60), "m3/h");
    if (st.qCross!=null){
      put("cross_flow", kgs_to_m3h(st.qCross,60), "m3/h");
      put("supply_shortfall", st.supplyShortfall, "K");
      if (st.undersized) warn.push(c.id+": "+tr(T.hdrNote));
    }
    const ret=retOf(c,st);
    if (ret!=null && isFinite(ret)){
      const v=returnVerdict(ret,{kind:I.kind,threshold:I.threshold});
      if (v.status==="bad") warn.push(c.id+": "+tr(v.rule==="floor"?T.vBadFloor:T.vWarnCeil));
    }
    if (c.model==="gen-passive" && st.starved) warn.push(c.id+": "+tr(SL.noFlow));
    if (I.type==="embedded" && st.t2!=null && st.t3!=null){
      const e=embeddedOutput(st.t2, st.t3, I.tRoom), ch=surfaceCheck(e.tSurface);
      if (ch.exceeded) warn.push(c.id+": "+tr(SL.floorHot)+" "+F1(e.tSurface)+" °C");
    }
  }
  const sz = sizeValve({a:Math.min(.95,Math.max(.05,I.a)), dpR1:15, dpR2:10, q100_m3h:1.2});
  out["valve.dp_valve"]=sz.dpValve; units["valve.dp_valve"]="kPa";
  out["valve.kvs"]=sz.kvs;          units["valve.kvs"]="m3/h/bar^0.5";
  return {inputs:inp, outputs:out, units:units,
    model:{equations:[
      "Emitter (EN 442): Q/Q_n = (dT_log/dT_log,nom)^n, dT_log = (ts-troom - (tr-troom))/ln((ts-troom)/(tr-troom)), dT_log,nom = 49.83 K at 75/65/20",
      "Every junction closed on ENTHALPY, not on cp*dT: sum(m_i h_i) = m_out h_out with sum(m_i) = m_out",
      "Mixing tee of a mixing circuit: q_vp h(t1) + q_meng h(t3) = q_vs h(t2), q_vp + q_meng = q_vs",
      "Diverting circuit: q_vs h(t3) + q_bypass h(t1) = q_vp h(t4), q_vs + q_bypass = q_vp",
      "Fixed premix ratio a = (t1 - t2)/(t1 - t3), design network flow q_vp,100 = (1 - a) q_vs,100",
      "Low-loss header: the bypass carries |q_P - q_S|; with q_P > q_S it runs supply->return and only the primary return is mixed, with q_P < q_S it runs return->supply and only the secondary supply is mixed",
      "Return protection: q_gen h(t_ret) + q_shunt h(t_sup) = (q_gen + q_shunt) h(t_min)",
      "Valve authority a = dp across the fully open valve / dp available to the branch [CIBSE Guide H (2009) 3.3.4.1 eq. (3.5)]",
      "Installed characteristic u = f/sqrt(a + (1-a) f^2); equal percentage f = 0.04^(1-y)",
      "Pump: system curve dp = R Q^2; proportional-pressure control curve from (0, H100/2) to (Q100, H100) [Commission Regulation (EC) No 641/2009, Annex II 2.5]",
      "Water properties: IAPWS-IF97 region 1 at 0.3 MPa"],
     ranges:[
      "Steady state, one circuit, lumped resistances — pipe pressure drops are an input, not a result",
      "Water only, IF97 region 1: 0 < t < 350 °C at 0.3 MPa",
      "No control dynamics, no buffer vessel, no thermal-shock protection",
      "Valve and pump curves are generic, not manufacturer data"],
     notes:[tr(T.inNote)]},
    warnings:warn};
}

/* ===================================================================
 * The shell (UI_FRAMEWORK_SPEC.md, tools.petrov.re/ui/v1).
 *
 * Archetype `reference`: the primary content is twenty-two circuits to
 * read and look up, and the controls narrow and parametrise them. The
 * filter is the nav rail, the design point sits under it, the library is
 * the content column and the three analyses follow it.
 * =================================================================== */

/* Units live in their own slot now, so they come out of the label text.
 * The seven labels that carried one all end in ", <unit>", in all six
 * languages; nothing else in this table has a trailing comma. */
const noUnit = o => { const r={}; for (const k in o) r[k] = o[k].replace(/,\s*[^,]+$/, ""); return r; };
const LBL = {
  q: noUnit(T.lQ), ts: noUnit(T.lTs), tr: noUnit(T.lTr), troom: noUnit(T.lTroom),
  tnet: noUnit(T.lTnet), thr: noUnit(T.lThr), head: noUnit(T.lHead)
};

/* Six-language strings, joined per language. Used to build a learn topic
 * out of prose the page already ships rather than writing it again. */
function join(){
  const parts = [].slice.call(arguments), r = {};
  LANGS.forEach(l => { r[l] = parts.map(p => (p[l] || p.en)).join(" "); });
  return r;
}
const T6 = (en,uk,de,nl,fr,es,pl) => ({en, uk, de, nl, fr, es, pl});

const LEARN = {
  version: 1,
  intro: { title: T.hLib, body: T.intro },
  topics: {
    problem: { title: T.hProb, body: T.pProb },
    cards: { title: T.hLib, body: T6(
      "Every card carries a parametric schematic with the live numbers on it, the honest list of what the circuit does well and badly, and the commissioning procedure — which balancing valve, at which flow, with the control valve in which position. Open a card to compute it: a closed card is not computed at all.",
      "Кожна картка має параметричний рисунок із живими числами, чесний перелік переваг і недоліків схеми та процедуру налагодження — який балансувальний клапан, на яку витрату, за якого положення регулювального. Розкрийте картку, щоб її порахувати: закрита картка не рахується взагалі.",
      "Jede Karte bringt ein parametrisches Schema mit lebenden Zahlen mit, eine ehrliche Liste von Stärken und Schwächen sowie die Einregulierprozedur — welches Ventil, auf welchen Volumenstrom, bei welcher Stellung des Regelventils. Zum Rechnen die Karte öffnen: eine geschlossene Karte wird nicht gerechnet.",
      "Elke kaart heeft een parametrisch schema met levende getallen, een eerlijke lijst van wat de schakeling goed en slecht doet, en de inregelprocedure — welke afsluiter, op welk debiet, bij welke stand van de regelafsluiter. Open een kaart om haar te berekenen: een gesloten kaart wordt niet berekend.",
      "Chaque fiche porte un schéma paramétrique avec les valeurs vivantes, la liste honnête des qualités et des défauts du schéma, et la procédure d’équilibrage — quelle vanne, à quel débit, la vanne de réglage dans quelle position. Ouvrez une fiche pour la calculer : une fiche fermée n’est pas calculée.",
      "Cada ficha lleva un esquema paramétrico con los valores vivos, la lista honesta de virtudes y defectos, y el procedimiento de equilibrado — qué válvula, a qué caudal, con la de regulación en qué posición. Abra una ficha para calcularla: una ficha cerrada no se calcula.","Każda karta zawiera schemat parametryczny z rzeczywistymi wartościami, rzetelną listę tego, co obwód robi dobrze, a co źle, oraz procedurę uruchomienia – który zawór równoważący, przy jakim przepływie, z zaworem sterującym w jakiej pozycji. Otwórz kartę, aby to obliczyć: karta zamknięta nie jest w ogóle obliczana.") },
    designpoint: { title: T.hIn, body: T.inNote },
    output: { title: LBL.q, body: T6(
      "The heat the consumer must give off at the design point. Everything else on the page scales from it: the design flow follows from this output and the design temperature difference, and the load slider is a percentage of it.",
      "Тепло, яке споживач має віддати в розрахунковій точці. Від нього масштабується решта сторінки: розрахункова витрата випливає з цієї потужності та розрахункового перепаду температур, а повзунок навантаження — відсоток від неї.",
      "Die Wärme, die der Verbraucher im Auslegungspunkt abgeben muss. Alles andere auf der Seite skaliert daraus: Der Auslegungsvolumenstrom folgt aus dieser Leistung und der Auslegungstemperaturdifferenz, und der Lastregler ist ein Prozentsatz davon.",
      "De warmte die de gebruiker in het ontwerppunt moet afgeven. De rest van de pagina schaalt hiermee: het ontwerpdebiet volgt uit dit vermogen en het ontwerptemperatuurverschil, en de belastingsschuif is er een percentage van.",
      "La chaleur que l’émetteur doit fournir au point de dimensionnement. Tout le reste en découle : le débit nominal vient de cette puissance et de l’écart de température nominal, et le curseur de charge en est un pourcentage.",
      "El calor que el emisor debe entregar en el punto de diseño. Todo lo demás escala a partir de ahí: el caudal nominal sale de esa potencia y del salto térmico de diseño, y el control de carga es un porcentaje de ella.","Ciepło, które odbiornik musi oddać w punkcie projektowym. Wszystko inne na stronie jest od tego skalowane: przepływ projektowy wynika z tego wyjścia i projektowej różnicy temperatur, a suwak obciążenia stanowi jego procent.") },
    temperatures: { title: LBL.ts, body: T6(
      "The design regime: supply and return at the consumer, the room they heat, and the temperature the distribution network offers. Room below return below supply is enforced, because with the return at room temperature the logarithmic excess temperature is zero and the emitter has no nominal output at all.",
      "Розрахунковий режим: подача та зворотна у споживача, температура приміщення, яке вони гріють, і температура, яку пропонує розподільна мережа. Порядок «приміщення < зворотна < подача» витримується примусово: за зворотної, рівної температурі приміщення, логарифмічний перепад дорівнює нулю, і прилад не має номіналу взагалі.",
      "Das Auslegungsregime: Vor- und Rücklauf am Verbraucher, der Raum, den sie beheizen, und die Temperatur, die das Verteilnetz anbietet. Raum unter Rücklauf unter Vorlauf wird erzwungen, denn bei Rücklauf auf Raumtemperatur ist die logarithmische Übertemperatur null und die Heizfläche hat überhaupt keine Nennleistung.",
      "Het ontwerpregime: aanvoer en retour bij de gebruiker, de ruimte die zij verwarmen en de temperatuur die het distributienet biedt. Ruimte onder retour onder aanvoer wordt afgedwongen: met het retour op ruimtetemperatuur is het logaritmische temperatuurverschil nul en heeft de afgifte helemaal geen nominaal vermogen.",
      "Le régime de dimensionnement : départ et retour à l’émetteur, la pièce qu’ils chauffent et la température offerte par le réseau. L’ordre ambiance < retour < départ est imposé : avec le retour à la température ambiante, l’écart logarithmique est nul et l’émetteur n’a plus aucune puissance nominale.",
      "El régimen de diseño: impulsión y retorno en el emisor, el local que calientan y la temperatura que ofrece la red. Se impone ambiente < retorno < impulsión: con el retorno a la temperatura ambiente el salto logarítmico es cero y el emisor no tiene potencia nominal alguna.","Schemat projektowy: zasilanie i powrót u odbiorcy, ogrzewane pomieszczenie oraz temperatura oferowana przez sieć dystrybucyjną. Wymusza się sytuację, w której pomieszczenie poniżej powrotu poniżej zasilania, ponieważ przy powrocie w temperaturze pokojowej nadwyżka logarytmiczna temperatury wynosi zero, a emiter w ogóle nie ma mocy nominalnej.") },
    emitter: { title: T.lType, body: T.inNote },
    generator: { title: T.lGen, body: join(T.vBadFloor, T.vWarnCeil, T.vLower) },
    threshold: { title: LBL.thr, body: LIMITS[5] },
    authority: { title: T.hAuth, body: T.pAuth,
                 more: { href: "regelkring.html", label: T.labLinkText } },
    pump: { title: LBL.head, body: T6(
      "The design head is the pressure the pump must produce at the design flow; the efficiency turns hydraulic power into shaft power. Both are generic: the pump curve here is a parabola through the duty point, not manufacturer data.",
      "Розрахунковий напір — тиск, який насос має створити за розрахункової витрати; ККД переводить гідравлічну потужність у потужність на валу. Обидва — родові: крива насоса тут парабола через робочу точку, а не дані виробника.",
      "Die Auslegungsförderhöhe ist der Druck, den die Pumpe beim Auslegungsvolumenstrom erzeugen muss; der Wirkungsgrad macht aus hydraulischer Leistung Wellenleistung. Beide sind generisch: Die Pumpenkennlinie ist hier eine Parabel durch den Betriebspunkt, keine Herstellerangabe.",
      "De ontwerpopvoerhoogte is de druk die de pomp bij het ontwerpdebiet moet leveren; het rendement maakt van hydraulisch vermogen asvermogen. Beide zijn generiek: de pompcurve is hier een parabool door het werkpunt, geen fabrikantgegeven.",
      "La hauteur nominale est la pression que la pompe doit fournir au débit nominal ; le rendement transforme la puissance hydraulique en puissance à l’arbre. Les deux sont génériques : la courbe de pompe est ici une parabole passant par le point de fonctionnement, pas une donnée constructeur.",
      "La altura de diseño es la presión que la bomba debe dar al caudal nominal; el rendimiento convierte la potencia hidráulica en potencia al eje. Ambos son genéricos: la curva de bomba es aquí una parábola por el punto de trabajo, no un dato de fabricante.","Wysokość podnoszenia to ciśnienie, jakie pompa musi wytworzyć przy przepływie projektowym; sprawność przekształca moc hydrauliczną w moc na wale. Oba te parametry są ogólne: krzywa pompy jest tutaj parabolą przechodzącą przez punkt pracy, a nie przez dane producenta.") },
    header: { title: T.lHdr, body: T.hdrNote },
    load: { title: T.lLoad, body: T6(
      "The share of the design output the consumer is asking for right now, from 0 to 100 %. Every open card is solved again at that load, and that is where the circuits stop behaving alike: what one does at full load says very little about what it does at a quarter of it.",
      "Частка розрахункової потужності, яку споживач вимагає зараз, від 0 до 100 %. Кожна розкрита картка розв’язується наново за цього навантаження — саме тут схеми перестають бути схожими: поведінка за повного навантаження мало говорить про поведінку за чверті.",
      "Der Anteil der Auslegungsleistung, den der Verbraucher gerade fordert, von 0 bis 100 %. Jede geöffnete Karte wird bei dieser Last neu gelöst, und genau dort hören die Schaltungen auf, sich gleich zu verhalten: Volllast sagt sehr wenig über Viertellast.",
      "Het deel van het ontwerpvermogen dat de gebruiker nu vraagt, van 0 tot 100 %. Elke geopende kaart wordt bij die belasting opnieuw opgelost, en daar houdt de gelijkenis op: vollast zegt heel weinig over een kwart last.",
      "La part de la puissance nominale que l’émetteur demande à cet instant, de 0 à 100 %. Chaque fiche ouverte est résolue de nouveau à cette charge, et c’est là que les schémas cessent de se ressembler : la pleine charge ne dit presque rien du quart de charge.",
      "La parte de la potencia de diseño que el emisor pide ahora, de 0 a 100 %. Cada ficha abierta se resuelve de nuevo a esa carga, y ahí dejan de parecerse los esquemas: la plena carga dice muy poco de la carga al 25 %.","Udział w wynikach projektowych, jakich oczekuje obecnie odbiornik, od 0 do 100%. Każda otwarta karta jest rozwiązywana ponownie przy tym obciążeniu i to właśnie w tym momencie obwody przestają zachowywać się tak samo: to, co dzieje się przy pełnym obciążeniu, mówi niewiele o tym, co dzieje się przy jednej czwartej tego obciążenia.") },
    compare: { title: T.hCmp, body: T.pCmp },
