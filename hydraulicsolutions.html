  },
  tour: [
    { topic: "problem",      focus: '[data-dgu-panel="problems"]' },
    { topic: "designpoint",  focus: '[data-dgu-panel="design"]' },
    { topic: "load",         focus: '[data-dgu-field="f-load"]' },
    { topic: "cards",        focus: '[data-dgu-panel="library"]' },
    { topic: "compare",      focus: '[data-dgu-panel="compare"]' },
    { topic: "authority",    focus: '[data-dgu-panel="authority"]' }
  ]
};

function numberField(key, label, unit, extra){
  const f = FIELDS.find(x => x.key === key);
  return Object.assign({id:"f-"+key, key:key, type:"number", label:label,
    unit:unit || null, min:f.min, max:f.max, step:f.step}, extra || {});
}

function panels(){
  const el = DiagramUI.el, bind = DiagramUI.on;
  return [
  /* the filter — the reference archetype's nav rail */
  { id:"problems", slot:"nav", title:T.hProb, note:T.pProb, learn:"problem",
    render: function(box){
      chipHost = el("div", {class:"hs-chips"});
      box.appendChild(chipHost);
      renderChips();
      bind(chipHost, "click", function(e){
        const b = e.target.closest(".hs-chip");
        if (!b || b.disabled) return;
        setFilter(b.dataset.p);
      });
    } },

  /* the design point */
  { id:"design", slot:"inputs", title:T.hIn, learn:"designpoint",
    fields:[
      numberField("QkW", LBL.q, "kW", {learn:"output", required:true}),
      numberField("tSupply", LBL.ts, "°C", {learn:"temperatures"}),
      numberField("tReturn", LBL.tr, "°C", {learn:"temperatures"}),
      numberField("tRoom", LBL.troom, "°C", {learn:"temperatures"}),
      numberField("tNet", LBL.tnet, "°C", {learn:"temperatures"}),
      { id:"f-type", key:"type", type:"select", label:T.lType, learn:"emitter",
        options: () => Object.keys(EMITTERS).map(k => [k, tr(EMITTERS[k])]) },
      { id:"f-kind", key:"kind", type:"select", label:T.lGen, learn:"generator",
        options: () => Object.keys(GENKINDS).map(k => [k, tr(GENKINDS[k])]) },
      numberField("threshold", LBL.thr, "°C", {learn:"threshold", hint:T.thrFloor,
        disabled: () => GENERATOR_KINDS[inputs().kind].rule === "lower-better"}),
      numberField("a", T.lAuth, null, {learn:"authority"}),
      numberField("head", LBL.head, "kPa", {learn:"pump"}),
      numberField("eta", T.lEta, null, {learn:"pump"}),
      numberField("hdr", T.lHdr, null, {learn:"header", hint:T.hdrNote}),
      { id:"f-load", key:"load", type:"range", label:T.lLoad, unit:"%",
        min:0, max:100, step:1, precision:0, learn:"load" },
      { id:"f-model-note", type:"note", label:T.inNote }
    ],
    /* Reset belongs to the inputs footer and to no other place. */
    actions:[{ label:() => ui ? ui.t("reset") : "Reset", variant:"ghost",
               run: function(){ if (ui) ui.reset(); } }] },

  /* the library.
   * T.intro is the page's lead paragraph. It is also learn.intro, but the
   * framework only renders learn.intro inside the results region's pending
   * state, and the `reference` archetype never builds a results view — so
   * declaring it there alone would have deleted a visible paragraph. */
  { id:"library", slot:"stage", title:T.hLib, note:T.intro, learn:"cards",
    render: function(box){
      libHost = el("div", {class:"cards"});
      box.appendChild(libHost);
      buildLibrary();
      /* The compare toggle sits inside <summary>: its click must not reach
       * the disclosure, or ticking a circuit would collapse its card. */
      bind(libHost, "click", function(e){
        const b = e.target.closest("[data-cmp]");
        if (!b) return;
        e.preventDefault(); e.stopPropagation();
        toggleCompare(b.dataset.cmp, b);
      });
    } },

  /* the comparison sweep */
  { id:"compare", slot:"results", title:T.hCmp, note:T.pCmp, learn:"compare",
    render: function(box, ctx, panel){
      panel.fields.push(new DiagramUI.Field(ctx.app, {
        id:"f-metric", key:"metric", type:"select", label:T.cmpMetric,
        options: () => [["ret", tr(T.mRet)], ["net", tr(T.mNet)],
                        ["sup", tr(T.mSup)], ["pow", tr(T.mPow)]]
      }, box));
      cmpStage = new DiagramUI.Stage(ctx.app, {
        minHeight: 320,
        render: function(){ renderCompare(inputs()); },
        a11y: function(){
          const n = state.cmp.length;
          return n ? tr(T.hCmp) + ": " + state.cmp.join(", ") + " — " + tr(T.lLoad) + " 0…100 %"
                   : tr(T.cmpEmpty);
        }
      }, box);
      (ctx.app.stages = ctx.app.stages || []).push(cmpStage);
      cmpTbl = el("div", {});
      box.appendChild(cmpTbl);
    },
    actions:[{ label:T.cmpClear, variant:"ghost", run: clearCompare }] },

  /* valve authority */
  { id:"authority", slot:"results", title:T.hAuth, note:T.pAuth, learn:"authority",
    render: function(box, ctx){
      authStage = new DiagramUI.Stage(ctx.app, {
        minHeight: 320,
        render: function(){ renderAuthority(inputs()); },
        a11y: function(){ return tr(T.hAuth) + " — a = " + F2(inputs().a); }
      }, box);
      (ctx.app.stages = ctx.app.stages || []).push(authStage);
      authTbl = el("div", {});
      box.appendChild(authTbl);
      /* Авторитет и характер контура задаются здесь, а во что они выливаются
         во времени — на соседней странице. Ссылка встречная: там, в карточке
         выбора объекта, стоит ссылка сюда. Относительный путь: обе страницы
         лежат в одной папке сайта. */
      const p = el("p", {class:"small"});
      p.appendChild(document.createTextNode(tr(T.labLink) + " "));
      const a = el("a", {href:"regelkring.html"});
      a.textContent = tr(T.labLinkText);
      p.appendChild(a);
      box.appendChild(p);
    } },

  /* the page's own checks */
  { id:"checks", slot:"results", title:T.hVal, note:T.pVal, learn:"checks",
    render: function(box){ valHost = el("div", {}); box.appendChild(valHost); } }
  ];
}

function footer(host){
  const el = DiagramUI.el;
  const d = el("details", {});
  d.open = true;
  d.appendChild(el("summary", {text: tr(T.hLim)}));
  const ul = el("ul", {class:"tight"});
  LIMITS.forEach(x => ul.appendChild(el("li", {text: tr(x)})));
  d.appendChild(ul);
  host.appendChild(d);
  host.appendChild(el("p", {text: tr(T.foot)}));
}

function boot(){
  /* Rule 3 of the spec: the framework renders before the tool computes.
     If it is not there at all, the data layer still is — the shared bar,
     the permalink, the record, the report and the python export do not
     depend on diagram-ui.js, and they keep working on the default design
     point rather than leaving a blank page behind. */
  if (!window.DiagramUI || DiagramUI.api !== "tools.petrov.re/ui/v1"){
    const p = document.createElement("p");
    p.textContent = "The interface layer of this site (diagram-ui.js) did not " +
      "load, so the library cannot be drawn. The calculation, the permalink and " +
      "the exports in the toolbar still work on the design point in the link.";
    const h = document.createElement("h1");
    h.textContent = TITLES[lang] || TITLES.en;
    const app = document.getElementById("app") || document.body;
    app.appendChild(h); app.appendChild(p);
    applyTitle();
    dgcInit();
    return;
  }

  lang = DiagramUI.lang();
  applyTitle();

  ui = DiagramUI.app({
    id: "hydraulicsolutions",
    mount: "#app",
    layout: "reference",        /* material to read and look up; the controls narrow it */
    compute: "live",
    state: state,
    subtitle: T.sub,
    learn: LEARN,
    panels: panels(),
    footer: footer,
    on: {
      compute: function(){ computeAll(); },
      change: function(key){ want(KIND_OF[key] || "design"); },
      lang: function(l){ lang = l; applyTitle(); },
      reset: function(s){
        Object.assign(s, JSON.parse(JSON.stringify(DEFAULTS)));
        renderChips(); buildLibrary();
      }
    }
  });

  ui.ready();
  dgcInit();
}

if (document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

})();
</script>
