  "description": {
    "en": "Twenty-two standard hydraulic circuits for heating and cooling in four categories — consumer control, generator connection, hydraulic decoupling and pump control — arranged by the problem each one solves rather than by how it is drawn: protecting a boiler from a cold return, guaranteeing minimum flow, giving a consumer its own temperature regime, and decoupling circuits so two pumps stop fighting. Every circuit carries a parametric schematic with live numbers on it, an honest list of what it does well and badly, and the commissioning procedure — which balancing valve, at which flow, with the control valve in which position. A load slider from 0 to 100 % drives flows, mixing ratios and all measured temperatures through an enthalpy-based balance with IAPWS-IF97 water properties, and a comparison mode takes as many circuits as you tick, running them over the same sweep by return temperature, network flow, supply temperature or pump shaft power. The verdict on the return temperature flips with the generator type: what corrodes a cast-iron boiler is exactly what a condensing boiler or a heat pump is bought for. Valve authority, the inherent and operating characteristics and k_vs sizing are worked through in their own panel.",
    "uk": "Двадцять дві типові гідравлічні схеми для опалення та охолодження в чотирьох категоріях — регулювання споживача, обв’язка генератора, гідравлічна розв’язка та регулювання насоса, — впорядковані за задачею, яку кожна розв’язує: захист котла від холодної зворотної, гарантія мінімальної витрати, власний температурний режим для споживача та розв’язка контурів, щоб два насоси перестали боротися. Кожна схема має параметричний рисунок із живими числами, чесний перелік переваг і недоліків та процедуру налагодження — який клапан, на яку витрату, за якого положення регулювального. Повзунок навантаження від 0 до 100 % керує витратами, коефіцієнтами змішування й усіма вимірюваними температурами через ентальпійний баланс із властивостями води за IAPWS-IF97, а режим порівняння проганяє дві схеми одним прогоном. Авторитет клапана, основна й робоча характеристики та підбір k_vs розібрані в окремій панелі.",
    "de": "Zweiundzwanzig hydraulische Standardschaltungen in vier Kategorien — Verbraucherregelung, Erzeugeranbindung, hydraulische Entkopplung und Pumpenregelung — geordnet nach dem Problem, das jede löst: Kesselschutz vor kaltem Rücklauf, Sicherung des Mindestvolumenstroms, ein eigenes Temperaturniveau für den Verbraucher und die hydraulische Trennung, damit zwei Pumpen nicht gegeneinander arbeiten. Jede Schaltung bringt ein parametrisches Schema mit lebenden Zahlen mit, eine ehrliche Liste von Stärken und Schwächen sowie die Einregulierprozedur — welches Ventil, auf welchen Volumenstrom, bei welcher Stellung des Regelventils. Ein Lastregler von 0 bis 100 % treibt Volumenströme, Mischverhältnisse und alle Messtemperaturen über eine Enthalpiebilanz mit IAPWS-IF97-Stoffdaten; ein Vergleichsmodus fährt zwei Schaltungen über denselben Durchlauf. Ventilautorität, Grund- und Betriebskennlinie sowie die k_vs-Auslegung stehen in einem eigenen Feld.",
    "nl": "Tweeëntwintig hydraulische standaardschakelingen in vier categorieën — gebruikerregeling, opwekkeraansluiting, hydraulische ontkoppeling en pompregeling — geordend naar het probleem dat elk oplost: een ketel beschermen tegen een koud retour, minimumdebiet waarborgen, een gebruiker zijn eigen temperatuurniveau geven en circuits ontkoppelen zodat twee pompen niet tegen elkaar in werken. Elke schakeling heeft een parametrisch schema met levende getallen erop, een eerlijke lijst van wat ze goed en slecht doet, en de inregelprocedure — welke afsluiter, op welk debiet, bij welke stand van de regelafsluiter. Een belastingsschuif van 0 tot 100 % stuurt debieten, mengverhoudingen en alle meettemperaturen via een enthalpiebalans met IAPWS-IF97-waterstofdata, en een vergelijkmodus laat twee schakelingen dezelfde doorloop maken. Klepautoriteit, grond- en bedrijfskarakteristiek en de k_vs-bepaling staan in een eigen paneel.",
    "fr": "Vingt-deux schémas hydrauliques types en quatre catégories — régulation de l’émetteur, raccordement du générateur, découplage hydraulique et régulation de pompe — classés par le problème que chacun résout : protéger une chaudière d’un retour froid, garantir un débit minimal, donner à un émetteur son propre régime et découpler les circuits pour que deux pompes cessent de se contrarier. Chaque schéma porte un dessin paramétrique avec des valeurs vivantes, une liste honnête de ses qualités et de ses défauts, et la procédure d’équilibrage — quelle vanne, à quel débit, la vanne de réglage dans quelle position. Un curseur de charge de 0 à 100 % pilote débits, taux de mélange et toutes les températures mesurées via un bilan d’enthalpie avec les propriétés de l’eau IAPWS-IF97 ; un mode comparaison fait parcourir le même balayage à deux schémas. L’autorité de vanne, les caractéristiques intrinsèque et de service et le dimensionnement du k_vs disposent de leur propre panneau.",
    "es": "Veintidós esquemas hidráulicos tipo en cuatro categorías — regulación del emisor, conexión del generador, desacoplo hidráulico y regulación de bomba — ordenados por el problema que resuelve cada uno: proteger una caldera de un retorno frío, garantizar el caudal mínimo, dar al emisor su propio régimen y desacoplar circuitos para que dos bombas dejen de estorbarse. Cada esquema lleva un dibujo paramétrico con valores vivos, una lista honesta de virtudes y defectos y el procedimiento de equilibrado — qué válvula, a qué caudal, con la de regulación en qué posición. Un control de carga de 0 a 100 % gobierna caudales, relaciones de mezcla y todas las temperaturas medidas mediante un balance de entalpía con propiedades del agua IAPWS-IF97, y un modo de comparación recorre dos esquemas con el mismo barrido. La autoridad de válvula, las características intrínseca y de servicio y el dimensionado del k_vs tienen su propio panel.",
    "pl": "Dwadzieścia dwa standardowe obwody hydrauliczne do ogrzewania i chłodzenia w czterech kategoriach — sterowanie odbiornikiem, podłączenie generatora, odsprzęganie hydrauliczne i sterowanie pompą — uporządkowane według problemu, który każdy z nich rozwiązuje, a nie według sposobu jego rozmieszczenia: ochrona kotła przed zimnym powrotem, zagwarantowanie minimalnego przepływu, zapewnienie odbiornikowi własnego reżimu temperaturowego oraz odsprzęganie obwodów, aby dwie pompy przestały ze sobą konkurować. Każdy obwód zawiera schemat parametryczny z aktualnymi liczbami, rzetelną listę tego, co robi dobrze, a co źle, oraz procedurę uruchomienia — który zawór równoważący, przy jakim przepływie, z zaworem regulacyjnym w jakim położeniu. Suwak obciążenia od 0 do 100% steruje przepływami, proporcjami mieszania i wszystkimi zmierzonymi temperaturami poprzez bilans oparty na entalpii z właściwościami wody IAPWS-IF97, a tryb porównania obejmuje dowolną liczbę obwodów, które zaznaczysz, uruchamiając je w tym samym zakresie według temperatury powrotu, przepływu w sieci, temperatury zasilania lub mocy na wale pompy. Werdykt dotyczący temperatury powrotu zmienia się w zależności od rodzaju generatora: to, co powoduje korozję kotła żeliwnego, jest dokładnie tym, do czego służy kocioł kondensacyjny lub pompa ciepła. Autorytet zaworu, jego charakterystyki eksploatacyjne i parametry kvs są analizowane w osobnych panelach."

  "limitations": {
    "en": "Steady-state, single-circuit model with lumped resistances: pipe pressure drops are an input, not a result, and this is not a network solver. Control dynamics — transport delay, actuator travel time, sensor lag and the resulting hunting — are not modelled, and neither are buffer vessels, minimum-flow bypass valves or thermal-shock protection. Pump placement, the pressure profile around the expansion vessel and cavitation are out of scope. Valve characteristics are generic linear and 4 % equal-percentage curves rather than manufacturer data, emitter exponents are per type rather than per model, and thermal mass is lumped with no buffer stratification. Pump curves are a generic parabola and the control curves are the constant- and proportional-pressure laws, not manufacturer data. The return-temperature threshold is entered by the user, because the flue-gas dew point depends on the fuel and the excess air and no single figure covers every case. The low-loss header now takes its primary/secondary flow ratio as an input, so the undersized case is reachable; that ratio is a design decision, not a result of this model.",
    "uk": "Стаціонарна модель одного контуру із зосередженими опорами: втрати тиску в трубах є вхідними даними, а не результатом, і це не розрахунок мережі. Динаміка регулювання — транспортне запізнення, час ходу привода, інерція датчика та спричинені ними автоколивання — не моделюється, як і буферні ємності, байпаси мінімальної витрати й захист від температурного удару. Розташування насоса, епюра тиску навколо розширювального бака та кавітація — поза межами розрахунку. Характеристики клапанів родові, лінійна та рівнопроцентна 4 %, а не дані виробників; показники приладів задано за типом, а не за моделлю; теплова маса зосереджена, стратифікація буфера не моделюється. Криві насосів — родова парабола, криві регулювання — закони постійного та пропорційного тиску, а не дані виробників. Поріг температури зворотної задає користувач, бо точка роси димових газів залежить від палива й надлишку повітря. Гідрострілка тепер приймає відношення витрат первинного до вторинного контуру як вхідні дані, тож недомірений випадок досяжний; це відношення є проєктним рішенням, а не результатом моделі.",
    "de": "Stationäres Einkreismodell mit konzentrierten Widerständen: Rohrdruckverluste sind Eingabe, nicht Ergebnis, und dies ist keine Netzberechnung. Regeldynamik — Totzeit, Stellzeit, Fühlerträgheit und das daraus folgende Pendeln — wird ebenso wenig abgebildet wie Pufferspeicher, Mindestmengen-Überströmventile oder Temperaturschockschutz. Pumpenanordnung, Druckverlauf um das Ausdehnungsgefäß und Kavitation liegen außerhalb des Umfangs. Ventilkennlinien sind generisch, linear und gleichprozentig 4 %, keine Herstellerdaten; Heizflächenexponenten gelten je Bauart, nicht je Modell; die Wärmekapazität ist konzentriert, eine Pufferschichtung wird nicht modelliert. Pumpenkennlinien sind eine generische Parabel, die Regelkennlinien sind die Konstant- und Proportionaldruckgesetze, keine Herstellerdaten. Die Rücklaufgrenze gibt der Nutzer ein, da der Abgastaupunkt von Brennstoff und Luftüberschuss abhängt. Die hydraulische Weiche nimmt das Verhältnis von Primär- zu Sekundärvolumenstrom jetzt als Eingabe, sodass der unterdimensionierte Fall erreichbar ist; dieses Verhältnis ist eine Auslegungsentscheidung, kein Ergebnis dieses Modells.",
    "nl": "Stationair model van één circuit met geconcentreerde weerstanden: leidingdrukverliezen zijn invoer, geen resultaat, en dit is geen leidingnetberekening. Regeldynamica — transporttijd, looptijd van de aandrijving, opnemertraagheid en het daaruit volgende pendelen — wordt niet gemodelleerd, evenmin als buffervaten, overstroomkleppen voor minimumdebiet of bescherming tegen temperatuurschok. Pompopstelling, drukverloop rond het expansievat en cavitatie vallen buiten dit bestek. Klepkarakteristieken zijn generiek, lineair en 4 % equiprocentueel, geen fabrikantgegevens; afgifte-exponenten gelden per type, niet per model; de thermische massa is geconcentreerd en bufferstratificatie wordt niet gemodelleerd. Pompcurven zijn een generieke parabool en de regelcurven zijn de constant- en proportioneeldrukwetten, geen fabrikantgegevens. De retourgrens voert de gebruiker in, omdat het rookgasdauwpunt van brandstof en luchtovermaat afhangt. De open verdeler neemt de verhouding primair/secundair debiet nu als invoer, zodat het te kleine geval bereikbaar is; die verhouding is een ontwerpkeuze, geen resultaat van dit model.",
    "fr": "Modèle stationnaire à circuit unique et résistances localisées : les pertes de charge des conduites sont une donnée d’entrée, pas un résultat, et il ne s’agit pas d’un calcul de réseau. La dynamique de régulation — retard de transport, temps de course du servomoteur, inertie de sonde et pompage qui en résulte — n’est pas modélisée, pas plus que les ballons tampons, les soupapes différentielles de débit minimal ou la protection contre le choc thermique. La position de la pompe, le profil de pression autour du vase d’expansion et la cavitation sont hors périmètre. Les caractéristiques de vannes sont génériques, linéaire et égal-pourcentage 4 %, et non des données constructeur ; les exposants d’émetteurs valent par type et non par modèle ; la masse thermique est localisée, sans stratification de ballon. Les courbes de pompe sont une parabole générique et les courbes de régulation sont les lois à pression constante et proportionnelle, pas des données constructeur. Le seuil de retour est saisi par l’utilisateur, le point de rosée dépendant du combustible et de l’excès d’air. La bouteille de découplage prend désormais le rapport débit primaire/secondaire en entrée, si bien que le cas sous-dimensionné est atteignable ; ce rapport est une décision de conception, pas un résultat de ce modèle.",
    "es": "Modelo estacionario de un solo circuito con resistencias concentradas: las pérdidas de carga de las tuberías son entrada, no resultado, y esto no es un cálculo de redes. La dinámica de regulación — retardo de transporte, tiempo de carrera del actuador, inercia de la sonda y las oscilaciones resultantes — no se modela, ni tampoco los depósitos de inercia, las válvulas diferenciales de caudal mínimo o la protección frente a choque térmico. La posición de la bomba, el perfil de presión en torno al vaso de expansión y la cavitación quedan fuera del alcance. Las características de válvula son genéricas, lineal e isoporcentual del 4 %, no datos de fabricante; los exponentes de emisores son por tipo, no por modelo; la masa térmica es concentrada y no se modela la estratificación. Las curvas de bomba son una parábola genérica y las de regulación son las leyes de presión constante y proporcional, no datos de fabricante. El umbral de retorno lo introduce el usuario, ya que el punto de rocío depende del combustible y del exceso de aire. La aguja hidráulica toma ahora la relación de caudal primario/secundario como entrada, de modo que el caso subdimensionado es alcanzable; esa relación es una decisión de proyecto, no un resultado de este modelo.",
    "pl": "Model jednoobwodowy w stanie ustalonym z rezystancjami skupionymi: spadki ciśnienia w rurociągach są danymi wejściowymi, a nie wynikowymi, a to nie jest rozwiązanie sieciowe. Dynamika sterowania — opóźnienie transportu, czas przesuwu siłownika, opóźnienie czujnika i wynikające z tego zjawisko „szukania” — nie są modelowane, podobnie jak zbiorniki buforowe, zawory obejściowe o minimalnym przepływie ani zabezpieczenie przed szokiem termicznym. Umiejscowienie pompy, profil ciśnienia wokół zbiornika wzbiorczego i kawitacja nie są objęte zakresem. Charakterystyki zaworów to ogólne krzywe liniowe i 4% krzywe stałoprocentowe, a nie dane producenta; wykładniki emiterów są zależne od typu, a nie od modelu; a masa termiczna jest skupiona bez stratyfikacji bufora. Krzywe pompy to ogólna parabola, a krzywe sterowania to prawa stałego i proporcjonalnego ciśnienia, a nie dane producenta. Próg temperatury powrotu jest wprowadzany przez użytkownika, ponieważ punkt rosy spalin zależy od paliwa i nadmiaru powietrza, a żadna pojedyncza wartość nie obejmuje wszystkich przypadków. Kolektor niskostratny przyjmuje teraz jako dane wejściowe stosunek przepływu pierwotnego do wtórnego, więc możliwy jest do osiągnięcia przypadek niedowymiarowany; ten stosunek jest decyzją projektową, a nie wynikiem tego modelu."

      "de": "203 Referenzfälle über das DOM der Seite gegen eine unabhängige Python-Implementierung: jede Schaltung aus ihrer Topologie neu hergeleitet, Massenbilanz und Enthalpiebilanz an jedem Knoten getrennt aufgeschrieben, Stoffdaten aus iapws 1.5.5 (IAPWS-IF97 Gebiet 1), die Heizfläche über die EN-442-Beziehung mit scipy.optimize.brentq gelöst, Pumpenbetriebspunkte, Ventilautorität und Betriebskennlinie nach ihren veröffentlichten Definitionen. Beide Strömungsrichtungen durch die hydraulische Weiche werden gefahren. Das eigene Prüffeld der Seite gehört NICHT dazu: seine sieben Prüfungen rechnen die eigenen Formeln der Seite nach und werden gezählt, nicht angerechnet. Der Prüfstand ist der eigene; niemand von außen hat ihn geprüft.",

<script>
(()=>{
"use strict";
/* Свойства воды — IAPWS-IF97, область 1 (сжатая жидкость).
 *
 * Блок между разделителями скопирован ДОСЛОВНО из steam_tables.html того же
 * сайта — тулза «Steam Tables · IAPWS-IF97», области 1, 2, 4, сверена автором
 * с опубликованными табличными значениями. Ни один коэффициент здесь не
 * набран заново и не подобран: две тулзы сайта обязаны давать одно и то же
 * число для одной и той же воды.
 *
 * Единицы движка: p в МПа, T в К, v в м³/кг, h и cp в кДж/(кг·К).
 * Обёртки ниже переводят во внешние единицы (°C, Дж, кг).
 */

/* ==== НАЧАЛО ДОСЛОВНОЙ ВСТАВКИ ИЗ steam_tables.html ==== */
const R = 0.461526, K0 = 273.15, PCRIT = 22.064, TCRIT = 647.096;
const R1=[[0,-2,0.14632971213167],[0,-1,-0.84548187169114],[0,0,-3.756360367204],[0,1,3.3855169168385],[0,2,-0.95791963387872],[0,3,0.15772038513228],[0,4,-0.016616417199501],[0,5,0.00081214629983568],[1,-9,0.00028319080123804],[1,-7,-0.00060706301565874],[1,-1,-0.018990068218419],[1,0,-0.032529748770505],[1,1,-0.021841717175414],[1,3,-0.00005283835796993],[2,-3,-0.00047184321073267],[2,0,-0.00030001780793026],[2,1,0.000047661393906987],[2,3,-0.0000044141845330846],[2,17,-7.2694996297594e-16],[3,-4,-0.000031679644845054],[3,0,-0.0000028270797985312],[3,6,-8.5205128120103e-10],[4,-5,-0.0000022425281908],[4,-2,-0.00000065171222895601],[4,10,-1.4341729937924e-13],[5,-8,-0.00000040516996860117],[8,-11,-1.2734301741641e-9],[8,-6,-1.7424871230634e-10],[21,-29,-6.8762131295531e-19],[23,-31,1.4478307828521e-20],[29,-38,2.6335781662795e-23],[30,-39,-1.1947622640071e-23],[31,-40,1.8228094581404e-24],[32,-41,-9.3537087292458e-26]];
function region1(p,T){const pi=p/16.53,tau=1386/T;let g=0,gp=0,gt=0,gtt=0;
  for(const[I,J,n]of R1){const a=Math.pow(7.1-pi,I),b=Math.pow(tau-1.222,J);
    g+=n*a*b;gp+=-n*I*Math.pow(7.1-pi,I-1)*b;gt+=n*a*J*Math.pow(tau-1.222,J-1);
    gtt+=n*a*J*(J-1)*Math.pow(tau-1.222,J-2);}
  return{v:pi*gp*R*T/p/1000,h:tau*gt*R*T,u:R*T*(tau*gt-pi*gp),s:R*(tau*gt-g),cp:-R*tau*tau*gtt};}
/* ==== КОНЕЦ ДОСЛОВНОЙ ВСТАВКИ ==== */

/* Рабочее давление контура. Область 1 слабо зависит от давления при
 * температурах отопления, но параметр вынесен наружу, а тест меряет
 * чувствительность вместо того, чтобы объявлять её пренебрежимой. */
const P_DEFAULT = 0.3;            // МПа ≈ 3 бар изб. + атмосфера

const K = 273.15;
const guard = (tC) => {
  if (!(tC > 0 && tC < 350)) throw new Error('outside IF97 region 1: ' + tC + ' degC');
};

/** Плотность, кг/м³ */
function rho(tC, p = P_DEFAULT) { guard(tC); return 1 / region1(p, tC + K).v; }
/** Удельная теплоёмкость, Дж/(кг·К) */
function cp(tC, p = P_DEFAULT) { guard(tC); return region1(p, tC + K).cp * 1000; }
/** Удельная энтальпия по точному уравнению, Дж/кг. */
function hExact(tC, p = P_DEFAULT) { guard(tC); return region1(p, tC + K).h * 1000; }

/* Таблица энтальпии с линейной интерполяцией.
 * Полином области 1 — 34 члена с возведением в степень, а бисекция внутри
 * бисекции вызывает его десятки тысяч раз на одно движение ползунка.
 * Таблица строится ИЗ ЭТОГО ЖЕ уравнения при первом обращении, шаг 0,05 K;
 * на таком шаге энтальпия воды практически линейна. Тест меряет
 * фактическое отклонение от точного уравнения и не даёт ему вырасти. */
const TB = {lo: 0.05, hi: 220, step: 0.05, a: null};
function buildTable(){
  const n = Math.round((TB.hi - TB.lo) / TB.step) + 1;
  TB.a = new Float64Array(n);
  for (let i = 0; i < n; i++) TB.a[i] = region1(P_DEFAULT, TB.lo + i * TB.step + K).h * 1000;
}
/** Удельная энтальпия, Дж/кг. */
function h(tC, p = P_DEFAULT) {
  if (p !== P_DEFAULT) return hExact(tC, p);
  guard(tC);
  if (tC < TB.lo || tC > TB.hi) return hExact(tC, p);
  if (!TB.a) buildTable();
  const x = (tC - TB.lo) / TB.step, i = x | 0, f = x - i;
  return TB.a[i] + f * (TB.a[i + 1] - TB.a[i]);
}

/** Обратная задача: температура по энтальпии, °C. Энтальпия в области 1
 *  строго растёт по температуре, поэтому бисекция безусловно сходится. */
function tFromH(hJ, p = P_DEFAULT) {
  if (p === P_DEFAULT) {
    if (!TB.a) buildTable();
    // Энтальпия строго растёт по температуре — двоичный поиск по таблице,
    // затем линейная интерполяция внутри найденного шага.
    if (hJ >= TB.a[0] && hJ <= TB.a[TB.a.length - 1]) {
      let lo = 0, hi = TB.a.length - 1;
      while (hi - lo > 1) { const m = (lo + hi) >> 1; if (TB.a[m] <= hJ) lo = m; else hi = m; }
      const d = TB.a[hi] - TB.a[lo];
      return TB.lo + (lo + (d !== 0 ? (hJ - TB.a[lo]) / d : 0)) * TB.step;
    }
  }
  let lo = 0.001, hi = 349.999;
  for (let i = 0; i < 200; i++) {
    const mid = 0.5 * (lo + hi);
    if (hExact(mid, p) < hJ) lo = mid; else hi = mid;
    if (hi - lo < 1e-12) break;
  }
  return 0.5 * (lo + hi);
}

/** Перевод объёмного расхода в массовый по плотности ПРИ ТЕМПЕРАТУРЕ ЗАМЕРА.
 *  Расходомер стоит в конкретной точке контура, и её температура важна. */
const m3h_to_kgs = (q_m3h, tC, p = P_DEFAULT) => q_m3h * rho(tC, p) / 3600;
const kgs_to_m3h = (m_kgs, tC, p = P_DEFAULT) => m_kgs * 3600 / rho(tC, p);


const hw = h, cpw = cp;
/* hydraulicsolutions.html — расчётное ядро v1
 * Семейства A (регулирование потребителя), B (обвязка генератора), C (развязка).
 * Чистые функции, без DOM и без зависимостей. Один контур, сосредоточенные
 * параметры, стационар. Не сетевой решатель.
 *
 * Провенанс каждой константы — в таблице PROVENANCE внизу файла.
 * Допустимые статусы: verified (подтверждено источником), derived (выведено
 * и проверено численно), retracted (отозвано как ошибка), not-required.
 * Константы без источника в таблице отсутствуют.
 */

/* ======================== 1. Свойства воды ======================== */

/* Никаких констант: ρ, cp и h берутся из IAPWS-IF97, область 1, тем же
 * движком, что и в steam_tables.html этого сайта. Энергобалансы ведутся
 * по ЭНТАЛЬПИИ, а не по произведению cp·Δθ, поэтому допущение о постоянной
 * теплоёмкости из модели уходит совсем. */
/* ======================== 2. Отопительный прибор ======================== */

/* Логарифмический перепад прибор/помещение. Совпадает с dtLog()
 * в verwarmenkoelenselector.html — намеренно, чтобы два блада сайта
 * не давали разных ответов на один и тот же вопрос. */
function dtLog(tSupply, tReturn, tRoom) {
  const a = tSupply - tRoom;
  const b = tReturn - tRoom;
  if (a <= 0 || b <= 0) return 0;
  if (Math.abs(a - b) < 1e-9) return a;       // предел при a → b
  return (a - b) / Math.log(a / b);
}

/* EN 442: номинал при 75/65/20. DT_NOM не вбит числом, а посчитан —
 * тест сверяет его с 49,83 K, как объявлено у соседа. */
const DT_NOM = dtLog(75, 65, 20);

/* Показатели степени по типам приборов — те же значения, что в
 * verwarmenkoelenselector.html (там объявлены как EN 442, родовые). */
const EMITTER_EXPONENT = {
  radiator: 1.30, convector: 1.35, vloerconvector: 1.35,
  paneel: 1.25, plafondpaneel: 1.25,
  ventilo: 1.00, luchtverwarmer: 1.00
  /* Тёплого пола здесь намеренно НЕТ. Показатель 1,1 из EN 1264 относится
   * к теплоотдаче ПОВЕРХНОСТИ в помещение, а не к логарифмическому напору
   * воды, и подставлять его сюда — ошибка. Встроенные системы считаются
   * функциями embeddedOutput/surfaceOutput ниже. */
};

/* EN 1264: теплоотдача поверхности пола в помещение, Вт/м².
 * Дословно та же формула и та же константа, что в surfaceOutput()
 * из verwarmenkoelenselector.html. */
function surfaceOutput(tSurface, tRoom) {
  const d = tSurface - tRoom;
  return d > 0 ? 8.92 * Math.pow(d, 1.1) : 0;
}

/* Предельные температуры поверхности — те же, что у соседней тулзы. */
const SURFACE_LIMIT = {
  vloer_verblijf: 29, vloer_rand: 35, vloer_badkamer: 33, wand: 40, plafond: 27
};

/* Встроенная система: со стороны воды отдача ЛИНЕЙНА по среднему напору,
 * q = (θ_ср − θ_помещения)/R. Показатель равен ровно 1, а не 1,1;
 * нелинейность 1,1 живёт дальше по цепочке, между поверхностью и воздухом.
 * R = 0,09 м²·К/Вт — то же значение, что в embeddedFlowTemp() соседа. */
function embeddedOutput(tSupply, tReturn, tRoom, { R = 0.09, area = 1 } = {}) {
  const tMean = 0.5 * (tSupply + tReturn);
  const q = Math.max(0, (tMean - tRoom) / R);              // Вт/м²
  // Обратная задача EN 1264: какая температура поверхности даёт этот поток
  const tSurface = q > 0 ? tRoom + Math.pow(q / 8.92, 1 / 1.1) : tRoom;
  return { q, Q: q * area, tMean, tSurface };
}

/* Проверка, не перегрет ли пол при текущем режиме. */
function surfaceCheck(tSurface, zone = 'vloer_verblijf') {
  const limit = SURFACE_LIMIT[zone];
  return { limit, tSurface, exceeded: tSurface > limit, margin: limit - tSurface };
};

/* Доля номинальной мощности прибора при заданном режиме. */
function emitterFactor(tSupply, tReturn, tRoom, type = 'radiator') {
  const dt = dtLog(tSupply, tReturn, tRoom);
  if (dt <= 0) return 0;
  const n = EMITTER_EXPONENT[type] ?? 1.30;
  return Math.pow(dt / DT_NOM, n);
}

/* ======================== 3. Численные примитивы ======================== */

/* Бисекция по монотонной функции. Осознанно не Ньютон: нужна гарантия
 * сходимости на всём диапазоне нагрузки, включая вырожденные случаи. */
function bisect(f, lo, hi, tol = 1e-10, maxIter = 200) {
  let flo = f(lo), fhi = f(hi);
  if (!(isFinite(flo) && isFinite(fhi))) throw new Error('bisect: bracket endpoint is not a number');
  if (flo === 0) return lo;
  if (fhi === 0) return hi;
  if (flo * fhi > 0) throw new Error('bisect: root is not bracketed');
  for (let i = 0; i < maxIter; i++) {
    const mid = 0.5 * (lo + hi);
    const fm = f(mid);
    if (fm === 0 || (hi - lo) < tol) return mid;
    if (flo * fm < 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; }
  }
  return 0.5 * (lo + hi);
}

/* ======================== 4. Решение прибора ======================== */

/* Проектная точка потребителя: номинальная мощность и режим. */
function designPoint({ QkW, tSupply, tReturn, tRoom, type = 'radiator' }) {
  const Q = QkW * 1000;
  const mdot = Q / (hw(tSupply) - hw(tReturn));
  return {
    Q, QkW, tSupply, tReturn, tRoom, type, mdot,
    dt: dtLog(tSupply, tReturn, tRoom),
    factor: emitterFactor(tSupply, tReturn, tRoom, type)
  };
}

/* Отдача прибора при заданных подаче и расходе.
 * Решается пересечение двух ветвей:
 *   Q = m·cp·(θs − θr)                    убывает по θr
 *   Q = Qn·(ΔT_лог/ΔT_ном)^n              возрастает по θr
 * На отрезке [θ_помещения, θs] разность строго меняет знак, поэтому
 * бисекция сходится при любом расходе, включая исчезающе малый. */
function emitterOutput(dp, tSupply, mdot) {
  if (mdot <= 0) return { Q: 0, tReturn: dp.tRoom };
  if (tSupply <= dp.tRoom) return { Q: 0, tReturn: tSupply };
  const Qn = dp.Q / dp.factor;                  // номинал прибора по EN 442
  const g = (tr) =>
    mdot * (hw(tSupply) - hw(tr)) - Qn * emitterFactor(tSupply, tr, dp.tRoom, dp.type);
  const tReturn = bisect(g, dp.tRoom, tSupply);
  return { Q: mdot * (hw(tSupply) - hw(tReturn)), tReturn };
}

/* Переменный расход, фиксированная подача: найти расход и обратку,
 * при которых прибор отдаёт ровно Qreq. Схемы G4, G6.
 * Отдача монотонно растёт по расходу и обращается в ноль при нулевом
 * расходе, поэтому внешняя бисекция ведётся по расходу, а не по обратке. */
function solveVariableFlow(dp, Qreq, tSupply) {
  if (Qreq <= 0) return { mdot: 0, tReturn: dp.tRoom, Q: 0 };
  let hi = dp.mdot;
  for (let i = 0; i < 60 && emitterOutput(dp, tSupply, hi).Q < Qreq; i++) hi *= 2;
  if (emitterOutput(dp, tSupply, hi).Q < Qreq) {
    throw Object.assign(new Error('emitter cannot reach the required output at any flow'), {key:'eEmitter'});
  }
  const mdot = bisect((m) => emitterOutput(dp, tSupply, m).Q - Qreq, 0, hi, 1e-14);
  const { tReturn, Q } = emitterOutput(dp, tSupply, mdot);
  return { mdot, tReturn, Q };
}

/* Постоянный расход, переменная подача: найти подачу и обратку,
 * при которых прибор отдаёт ровно Qreq. Схемы G5, G7, G8.
 * Отдача монотонно растёт по температуре подачи. */
function solveConstantFlow(dp, Qreq, mdot) {
  if (Qreq <= 0) return { tSupply: dp.tRoom, tReturn: dp.tRoom, Q: 0 };
  const lo = dp.tRoom;
  let hi = dp.tSupply;
  for (let i = 0; i < 60 && emitterOutput(dp, hi, mdot).Q < Qreq; i++) hi += 50;
  const tSupply = bisect((ts) => emitterOutput(dp, ts, mdot).Q - Qreq, lo, hi, 1e-12);
  const { tReturn, Q } = emitterOutput(dp, tSupply, mdot);
  return { tSupply, tReturn, Q };
}

/* ======================== 5. Семейство A: модули потребителя ======================== */

/* Общий вид результата карточки при доле нагрузки phi:
 *   qvp   — расход, отбираемый у распределительной сети (первичный)
 *   qvs   — расход через потребителя (вторичный)
 *   qmeng — расход подмеса
 *   t1    — подача из распределительной сети
 *   t2    — подача к потребителю
 *   t3    — обратка от потребителя
 *   t4    — обратка в распределительную сеть  ← это то, что видит генератор
 */

/* Доля расхода, отбираемая у сети, из энергобаланса точки смешения.
 * Книжная формула a = (θ1−θ2)/(θ1−θ3) — её же приближение при постоянной
 * теплоёмкости; расхождение измеряется тестом, а не объявляется малым. */
function primaryShare(qvs, t1, t2, t3) {
  const d = hw(t1) - hw(t3);
  if (d === 0) return 0;
  return Math.max(0, qvs * (hw(t2) - hw(t3)) / d);
}

/* G6 — пассивное дросселирование двухходовым.
 * Книга: q_vp = q_vs; расход падает с нагрузкой; θ1 постоянна; θ3 падает. */
function G6(dp, phi, t1) {
  const Qreq = phi * dp.Q;
  const s = solveVariableFlow(dp, Qreq, t1);
  return {
    module: 'G6', phi, Q: s.Q,
    qvp: s.mdot, qvs: s.mdot, qmeng: 0,
    t1, t2: t1, t3: s.tReturn, t4: s.tReturn
  };
}

/* G4 — пассивная разделительная (трёхходовой на разделении).
 * Книга: q_vp постоянен; q_vs падает; θ1 (= θ5) постоянна;
 *        θ3 падает; θ4 РАСТЁТ при падении нагрузки. */
function G4(dp, phi, t1, qvpConst = dp.mdot) {
  const Qreq = phi * dp.Q;
  const s = solveVariableFlow(dp, Qreq, t1);
  const qBypass = Math.max(0, qvpConst - s.mdot);
  // Смешение обратки потребителя с байпасом, идущим при θ1.
  const t4 = qvpConst > 0
    ? tFromH((s.mdot * hw(s.tReturn) + qBypass * hw(t1)) / qvpConst)
    : t1;
  return {
    module: 'G4', phi, Q: s.Q,
    qvp: qvpConst, qvs: s.mdot, qmeng: 0, qBypass,
    t1, t2: t1, t3: s.tReturn, t4
  };
}

/* G7 — активный смесительный трёхходовым.
 * Книга: мощность регулируется изменением температуры подачи (TP2);
 *        расход через потребителя постоянен (q_vs,100 = q_vs,0);
 *        направление потока верно, когда TP3 = TP4. */
function G7(dp, phi, t1) {
  const Qreq = phi * dp.Q;
  const qvs = dp.mdot;
  const s = solveConstantFlow(dp, Qreq, qvs);
  // Смешение по энтальпии: qvp·h1 + qmeng·h3 = qvs·h2, qvp + qmeng = qvs
  const qvp = primaryShare(qvs, t1, s.tSupply, s.tReturn);
  return {
    module: 'G7', phi, Q: s.Q,
    qvp: Math.max(0, qvp), qvs, qmeng: qvs - Math.max(0, qvp),
    t1, t2: s.tSupply, t3: s.tReturn, t4: s.tReturn
  };
}

/* Постоянный коэффициент смешения из проектной точки: a = (θ1−θ2)/(θ1−θ3).
 * Формула из §2.3.2.2 книги, она же в §3.7 брифа. */
function fixedMixRatio(t1, t2, t3) {
  if (t1 === t3) return 0;
  return (t1 - t2) / (t1 - t3);
}

/* G8 — активный смесительный с постоянным подмесом.
 * Книга: q_vp,100 = (1−a)·q_vs,100, q_meng = a·q_vs,100. */
function G8(dp, phi, t1) {
  const a = fixedMixRatio(t1, dp.tSupply, dp.tReturn);
  const qvs = dp.mdot;
  const Qreq = phi * dp.Q;
  const s = solveConstantFlow(dp, Qreq, qvs);
  const qvp = primaryShare(qvs, t1, s.tSupply, s.tReturn);
  return {
    module: 'G8', phi, Q: s.Q, a,
    qvp: Math.max(0, qvp), qvs, qmeng: qvs - Math.max(0, qvp),
    qvp100: (1 - a) * qvs, qmeng100: a * qvs,
    t1, t2: s.tSupply, t3: s.tReturn, t4: s.tReturn
  };
}

/* G5 — пассивное дросселирование с постоянным подмесом.
 * Книга: первичный расход падает с нагрузкой, вторичный постоянен,
 *        q_vp,100 = (1−a)·q_vs,100. */
function G5(dp, phi, t1) {
  const a = fixedMixRatio(t1, dp.tSupply, dp.tReturn);
  const qvs = dp.mdot;
  const Qreq = phi * dp.Q;
  const s = solveConstantFlow(dp, Qreq, qvs);
  const qvp = primaryShare(qvs, t1, s.tSupply, s.tReturn);
  return {
    module: 'G5', phi, Q: s.Q, a,
    qvp: Math.max(0, qvp), qvs, qmeng: qvs - Math.max(0, qvp),
    qvp100: (1 - a) * qvs,
    t1, t2: s.tSupply, t3: s.tReturn, t4: s.tReturn
  };
}

/* Инжекционная схема с трёхходовым: расход первичного контура постоянен,
 * расход вторичного постоянен, регулируется только инжектируемая доля.
 * Впрыснутая масса вытесняет равную ей обратно в первичный контур при θ3,
 * поэтому обратка первичного — смесь впрыска и байпаса. */
function INJ3(dp, phi, t1, qvpConst = dp.mdot) {
  const qvs = dp.mdot;
  const s = solveConstantFlow(dp, phi * dp.Q, qvs);
  const qInj = primaryShare(qvs, t1, s.tSupply, s.tReturn);
  const qBypass = Math.max(0, qvpConst - qInj);
  const t4 = qvpConst > 0
    ? tFromH((qInj * hw(s.tReturn) + qBypass * hw(t1)) / qvpConst)
    : t1;
  return {
    module: 'INJ3', phi, Q: s.Q,
    qvp: qvpConst, qvs, qmeng: qvs - qInj, qInj, qBypass,
    t1, t2: s.tSupply, t3: s.tReturn, t4
  };
}

const FAMILY_A = { G4, G5, G6, G7, G8, INJ3 };

/* Активный модуль сам создаёт перепад на своих точках подключения (несёт
 * насос), пассивный живёт за счёт чужого. «Om een hydraulische schakeling
 * te doen werken moet minstens één van de drie modulen actief zijn en de
 * beide andere passief» — §2.3.1.1. Ось каталога, которой не было в брифе. */
const MODULE_META = {
  G4: { kind: 'passief', control: 'verdelend',  consumerFlow: 'variabel', netFlow: 'constant' },
  G5: { kind: 'passief', control: 'smoor+voormenging', consumerFlow: 'constant', netFlow: 'variabel' },
  G6: { kind: 'passief', control: 'smoor',      consumerFlow: 'variabel', netFlow: 'variabel' },
  G7: { kind: 'actief',  control: 'mengend',    consumerFlow: 'constant', netFlow: 'variabel' },
  G8: { kind: 'actief',  control: 'mengend+voormenging', consumerFlow: 'constant', netFlow: 'variabel' },
  INJ3: { kind: 'actief',  control: 'injectie', consumerFlow: 'constant', netFlow: 'constant' },
  O1: { kind: 'passief' }, O12: { kind: 'actief' }, O3: { kind: 'passief' }
};

/* Отказ регулирующего клапана в открытую сторону: какая температура
 * реально дойдёт до потребителя? Это единственное, что отличает модули
 * с постоянным подмесом (G5, G8) от их аналогов без него (G6, G7), —
 * и ради чего они существуют для тёплого пола.
 * У G5/G8 постоянный подмес держится балансировочным клапаном IRA2,
 * поэтому доля a возвратной воды подмешивается всегда, даже при RA
 * настежь: θ2 = θ1 − a·(θ1 − θ3). */
function runawayCheck(moduleName, dp, t1, phi = 1) {
  const meta = MODULE_META[moduleName];
  if (!meta) throw new Error('unknown module: ' + moduleName);
  const state = FAMILY_A[moduleName](dp, phi, t1);
  const hasPremix = moduleName === 'G5' || moduleName === 'G8';
  const a = hasPremix ? fixedMixRatio(t1, dp.tSupply, dp.tReturn) : 0;
  const tWorst = hasPremix ? t1 - a * (t1 - state.t3) : t1;
  return {
    module: moduleName, hasPremix, a,
    tWorstCase: tWorst,
    tDesign: dp.tSupply,
    overshoot: tWorst - dp.tSupply,
    capped: hasPremix
  };
}

/* ======================== 6. Семейство B: обвязка генератора ======================== */

/* Правило §2.3.2.3: если к опвеккер-модулю подключены только G7 и/или G8,
 * при малом запросе тепла расход через генератор падает до нуля.
 * Возвращает расход через генератор и температуру обратки к нему. */
function generatorFlow(modules) {
  const qvp = modules.reduce((s, m) => s + m.qvp, 0);
  const heat = modules.reduce((s, m) => s + m.qvp * m.t4, 0);
  return { qGen: qvp, tReturn: qvp > 0 ? heat / qvp : null };
}

/* Рис. 2.3-20 — шунтовой насос: подмешивает подачу в обратку, пока
 * температура обратки к генератору не достигнет минимума. */
function shuntPump({ qGen, tReturn, tSupply, tReturnMin }) {
  if (tReturn === null || tReturn >= tReturnMin) {
    return { qShunt: 0, tReturnMixed: tReturn, active: false };
  }
  if (tSupply <= tReturnMin) throw Object.assign(new Error('supply is below the required return minimum'), {key:'eSupply'});
  // qGen·h(tReturn) + qShunt·h(tSupply) = (qGen + qShunt)·h(tReturnMin)
  const qShunt = qGen * (hw(tReturnMin) - hw(tReturn)) / (hw(tSupply) - hw(tReturnMin));
  return { qShunt, tReturnMixed: tReturnMin, active: true };
}

/* Рис. 2.3-21 — подмес к обратке трёхходовым по термостату.
 * Тот же энергобаланс, но расход через генератор не растёт: часть подачи
 * перепускается мимо потребителя. */
function returnMixValve({ qGen, tReturn, tSupply, tReturnMin }) {
  if (tReturn === null || tReturn >= tReturnMin) {
    return { fraction: 0, tReturnMixed: tReturn, active: false };
  }
  const x = (hw(tReturnMin) - hw(tReturn)) / (hw(tSupply) - hw(tReturn));   // доля подачи
  return { fraction: x, tReturnMixed: tReturnMin, active: true };
}

/* ======================== 7. Семейство C: развязка ======================== */

/* O3 / гидрострелка / коллектор с нулевым перепадом.
 * Книжный критерий: первичный расход должен быть БОЛЬШЕ суммы вторичных.
 * qP > qS  — избыток рециркулирует подача→обратка, потребитель получает
 *            температуру генератора;
 * qP < qS  — дефицит рециркулирует обратка→подача, подача к потребителю
 *            падает ниже той, что делает генератор (недомеренная стрелка). */
function decoupler({ qP, tP, qS, tS }) {
  const undersized = qP < qS;
  const qCross = Math.abs(qP - qS);
  let tSecondarySupply, tPrimaryReturn;
  if (!undersized) {
    tSecondarySupply = tP;
    tPrimaryReturn = qP > 0 ? tFromH((qS * hw(tS) + (qP - qS) * hw(tP)) / qP) : tP;
  } else {
    tSecondarySupply = qS > 0 ? tFromH((qP * hw(tP) + (qS - qP) * hw(tS)) / qS) : tP;
    tPrimaryReturn = tS;
  }
  return {
    undersized, qCross,
    direction: undersized ? 'retour→aanvoer' : 'aanvoer→retour',
    tSecondarySupply, tPrimaryReturn,
    supplyShortfall: tP - tSecondarySupply
  };
}

/* ======================== 8. Арматура: авторитет и характеристики ======================== */

/* Основные (grond-) характеристики. Равнопроцентная «4 %» — это
 * регулировочное отношение 25, kv/kvs = 0,04^(1−y). */
const EQUAL_PERCENT_RATIO = 0.04;

function baseChar(y, kind = 'linear') {
  const yy = Math.min(1, Math.max(0, y));
  if (kind === 'linear') return yy;
  if (kind === 'equal-percent') return Math.pow(EQUAL_PERCENT_RATIO, 1 - yy);
  throw new Error('unknown inherent characteristic: ' + kind);
}

/* Рабочая (bedrijfs-) характеристика при авторитете a.
 * Вывод: Δp_расп = Δp_клапана + Δp_прочее, q = kv·√Δp_клапана,
 *        a = Δp_клапана,100 / Δp_расп  ⇒  u = f / √(a + (1−a)·f²).
 * При a = 1 даёт u = f — прямое утверждение §3.8 книги. */
function installedChar(y, a, kind = 'linear') {
  const f = baseChar(y, kind);
  if (f <= 0) return 0;
  return f / Math.sqrt(a + (1 - a) * f * f);
}

/* Авторитет из перепадов: a = Δp клапана / Δp располагаемого. */
function authority(dpValve, dpAvailable) {
  return dpValve / dpAvailable;
}

/* Подбор клапана. Формула в книге под номером (6), в OCR разрушена,
 * но тождественна определению авторитета, решённому относительно Δp₃:
 *   a = Δp₃/(Δp₁+Δp₂+Δp₃)  ⇒  Δp₃ = a/(1−a)·(Δp₁+Δp₂).
 * Мы её ВЫВОДИМ, а не цитируем. */
function sizeValve({ a, dpR1, dpR2, q100_m3h }) {
  if (a <= 0 || a >= 1) throw new Error('authority must lie strictly between 0 and 1');
  const dpValve = (a / (1 - a)) * (dpR1 + dpR2);          // кПа
  const kvs = q100_m3h / Math.sqrt(dpValve / 100);        // kv при Δp в барах
  return { dpValve, dpAvailable: dpValve + dpR1 + dpR2, kvs };
}

/* ======================== 9. Прогон по нагрузке ======================== */

function loadSweep(moduleFn, dp, t1, steps = 21, ...rest) {
  const out = [];
  for (let i = steps - 1; i >= 0; i--) {
    const phi = i / (steps - 1);
    out.push(moduleFn(dp, phi, t1, ...rest));
  }
  return out;                                   // от 100 % к 0 %
}

/* ======================== 11. Насосы: кривые и режимы регулирования ======================== */

/* Кривая насоса на постоянных оборотах: парабола через (0, H0) и (Qmax, 0).
 * Родовая форма, не данные производителя — это записано в ограничениях. */
function pumpHead(Q, H0, Qmax){
  if (Q <= 0) return H0;
  if (Q >= Qmax) return 0;
  return H0 * (1 - (Q / Qmax) ** 2);
}

/* Характеристика сети с сосредоточенным сопротивлением: Δp = R·Q². */
const systemHead = (Q, R) => R * Q * Q;
const resistanceFor = (Q, H) => (Q > 0 ? H / (Q * Q) : Infinity);

/* Режимы регулирования регулируемого насоса.
 * Кривая пропорционального давления определена юридически: прямая от
 * (Q100, H100) до (0, H100/2) — Регламент Комиссии (ЕС) № 641/2009,
 * приложение II, п. 2.5. Постоянное давление — горизонталь H = H100. */
const PUMP_MODES = ["fixed", "constant-dp", "proportional-dp", "constant-flow"];

function controlHead(Q, mode, {H100, Q100, H0, Qmax}){
  switch (mode) {
    case "fixed":            return pumpHead(Q, H0, Qmax);
    case "constant-dp":      return H100;
    case "proportional-dp":  return H100 / 2 + (H100 / 2) * (Q100 > 0 ? Q / Q100 : 0);
    case "constant-flow":    return null;         // задаётся расходом, не напором
    default: throw new Error("unknown pump mode: " + mode);
  }
}

/* Рабочая точка: пересечение характеристики регулирования с характеристикой
 * сети Δp = R·Q². Для постоянного расхода точка задана расходом. */
function dutyPoint(mode, R, p){
  if (mode === "constant-flow") return {Q: p.Q100, H: systemHead(p.Q100, R), mode};
  const f = (Q) => controlHead(Q, mode, p) - systemHead(Q, R);
  const hi = Math.max(p.Qmax, p.Q100) * 4;
  if (f(1e-9) <= 0) return {Q: 0, H: controlHead(0, mode, p), mode};
  if (f(hi) > 0)    return {Q: hi, H: systemHead(hi, R), mode};
  const Q = bisect(f, 1e-9, hi, 1e-12);
  return {Q, H: systemHead(Q, R), mode};
}

/* Гидравлическая мощность и мощность на валу при объявленном КПД.
 * КПД задаётся снаружи и считается постоянным — это допущение названо. */
function pumpPower(Q_m3h, H_kPa, eta = 0.55){
  const P_hyd = (Q_m3h / 3600) * H_kPa * 1000;    // Вт
  return {hydraulic: P_hyd, shaft: eta > 0 ? P_hyd / eta : Infinity};
}

/* Перепускной клапан постоянного давления: открывается, когда перепад
 * на коллекторе превышает уставку, и пропускает подачу в обратку.
 * Характеристика родовая — расход пропорционален корню из превышения. */
function reliefValve({dp, dpSet, kv}){
  if (dp <= dpSet) return {qBypass: 0, open: false, excess: 0};
  const excess = dp - dpSet;
  return {qBypass: kv * Math.sqrt(excess / 100), open: true, excess};
}

/* Полная развязка теплообменником: вторичная подача ниже первичной на
 * заданный температурный напор. Сам напор — ввод, а не расчёт: подбор
 * теплообменника делает отдельная тулза сайта по ε-NTU. */
function plateSeparation({tPrimarySupply, approach, qS, tSreturn}){
  const tSecondarySupply = tPrimarySupply - approach;
  return {tSecondarySupply, approach,
          duty: qS * (hw(tSecondarySupply) - hw(tSreturn))};
}

/* ======================== 12. Роль обратки зависит от генератора ======================== */

/* Одна и та же холодная обратка — авария для чугунного котла и цель для
 * конденсационного. Поэтому вердикт по обратке НЕ универсален: он меняет
 * знак вместе с типом генератора. Порог задаёт пользователь, мы его не
 * выдумываем: для чугуна это минимум по паспорту, для конденсационного —
 * точка росы дымовых газов, которая зависит от топлива и избытка воздуха. */
const GENERATOR_KINDS = {
  cast_iron:  { rule: 'floor',        thresholdMeans: 'min-return' },
  steel:      { rule: 'floor',        thresholdMeans: 'min-return' },
  condensing: { rule: 'ceiling',      thresholdMeans: 'flue-dew-point' },
  heat_pump:  { rule: 'lower-better', thresholdMeans: 'none' },
  district:   { rule: 'lower-better', thresholdMeans: 'none' }
};

/* status: 'good' | 'warn' | 'bad'
 * margin: запас до порога в кельвинах, знак — в сторону благополучия. */
function returnVerdict(tReturn, { kind, threshold }) {
  const g = GENERATOR_KINDS[kind];
  if (!g) throw new Error('unknown generator kind: ' + kind);
  if (tReturn == null || !isFinite(tReturn)) return { status: 'warn', rule: g.rule, margin: null };
  if (g.rule === 'floor') {
    const margin = tReturn - threshold;
    return { status: margin >= 0 ? 'good' : 'bad', rule: g.rule, margin, threshold };
  }
  if (g.rule === 'ceiling') {
    const margin = threshold - tReturn;
    return { status: margin >= 0 ? 'good' : 'warn', rule: g.rule, margin, threshold };
  }
  return { status: 'good', rule: g.rule, margin: null, lowerIsBetter: true };
}

/* Насколько глубоко мы внутри окна конденсации, 0…1.
 * Только для конденсационного котла; выше точки росы — ноль. */
function condensingDepth(tReturn, tDew, tRoom = 20) {
  if (tReturn == null || !isFinite(tReturn)) return 0;
  if (tReturn >= tDew) return 0;
  return Math.min(1, (tDew - tReturn) / Math.max(1e-9, tDew - tRoom));
}

 hAuth:{en:"Valve authority and the operating characteristic",uk:"Авторитет клапана та робоча характеристика",de:"Ventilautorität und Betriebskennlinie",nl:"Klepautoriteit en bedrijfskarakteristiek",fr:"Autorité de la vanne et caractéristique de service",es:"Autoridad de la válvula y característica de servicio",pl:"Autorytet zaworu i charakterystyka pracy"},
 pAuth:{
  en:"Authority a is the share of the controlled circuit’s variable resistance that sits across the open control valve: the drop over the fully open valve divided by the drop it sees when shut (CIBSE Guide H, 2009, 3.3.4.1). At a = 1 the operating characteristic equals the inherent one; below that the valve loses its grip on the flow. For modulating service the usual selection window is 0.25 to 0.5 (ASHRAE, HVAC Systems and Equipment, 2016, ch. 47); CIBSE Guide H, 3.3.4.4 asks for at least 0.3 on a mixing circuit and 0.5 on a diverting one, and the LBNL Modelica Buildings library sizes every valve at 0.5. Two published rules disagree about the authority at which an equal-percentage valve turns linear, because they linearise different quantities. The classic rule puts a 4 % equal-percentage valve — rangeability 25:1, CIBSE Guide H, 3.3.3.1 — at a ≈ 0.3, and it speaks of flow against valve travel, which is exactly what the curves below draw: on them the flattest fit to the straight line lies near a = 0.2, and the table prints the largest gap for whatever authority you set. CIBSE Guide H, 3.3.4.2, figure 3.16 says instead that an equal-percentage characteristic with authority N = 0.7 gives an almost linear change of heat output with valve position — output, not flow: the emitter’s own convex flow-to-output curve stacks on the valve and pushes the best authority upward. Each holds for its own quantity; neither number has been bent to fit the other.",
  uk:"Авторитет a — частка змінного опору регульованого контуру, що припадає на відкритий регулювальний клапан: перепад на повністю відкритому клапані, поділений на перепад на ньому ж закритому (CIBSE Guide H, 2009, 3.3.4.1). При a = 1 робоча характеристика збігається з основною; нижче клапан втрачає владу над витратою. Для плавного регулювання звичайне вікно вибору — від 0,25 до 0,5 (ASHRAE, HVAC Systems and Equipment, 2016, розд. 47); CIBSE Guide H, 3.3.4.4 вимагає щонайменше 0,3 для змішувальної схеми і 0,5 для розподільної, а бібліотека LBNL Modelica Buildings підбирає всі клапани на 0,5. Два опубліковані правила розходяться в тому, за якого авторитету рівнопроцентний клапан стає лінійним, бо лінеаризують різні величини. Класичне правило ставить 4 % рівнопроцентний клапан — рангеабільність 25:1, CIBSE Guide H, 3.3.3.1 — на a ≈ 0,3 і стосується витрати проти ходу клапана — саме це малюють криві нижче: на них найрівніше наближення до прямої припадає приблизно на a = 0,2, а таблиця друкує найбільше відхилення для будь-якого заданого a. CIBSE Guide H, 3.3.4.2, рисунок 3.16 натомість каже, що рівнопроцентна характеристика з авторитетом N = 0,7 дає майже лінійну зміну теплової потужності залежно від положення клапана — потужності, а не витрати: на клапан накладається власна опукла крива «витрата — потужність» приладу і зсуває найкращий авторитет угору. Кожне правило правильне щодо своєї величини; жодне число не підганялося під інше.",
  de:"Die Autorität a ist der Anteil des veränderlichen Widerstands im geregelten Kreis, der über dem geöffneten Regelventil liegt: Druckgefälle am voll geöffneten Ventil geteilt durch das Gefälle am geschlossenen (CIBSE Guide H, 2009, 3.3.4.1). Bei a = 1 stimmt die Betriebskennlinie mit der Grundkennlinie überein; darunter verliert das Ventil den Zugriff auf den Volumenstrom. Für stetige Regelung liegt das übliche Auswahlfenster bei 0,25 bis 0,5 (ASHRAE, HVAC Systems and Equipment, 2016, Kap. 47); CIBSE Guide H, 3.3.4.4 verlangt mindestens 0,3 im Mischkreis und 0,5 im Verteilkreis, und die Bibliothek LBNL Modelica Buildings legt jedes Ventil auf 0,5 aus. Zwei veröffentlichte Faustregeln widersprechen sich darin, ab welcher Autorität ein gleichprozentiges Ventil linear wird, denn sie linearisieren verschiedene Größen. Die klassische Regel setzt ein gleichprozentiges 4-%-Ventil — Stellverhältnis 25:1, CIBSE Guide H, 3.3.3.1 — bei a ≈ 0,3 an und meint den Volumenstrom über dem Ventilhub, also genau das, was die Kurven unten zeigen: dort liegt die flachste Annäherung an die Gerade nahe a = 0,2, und die Tabelle nennt die größte Abweichung für jede eingestellte Autorität. CIBSE Guide H, 3.3.4.2, Bild 3.16 sagt dagegen, eine gleichprozentige Kennlinie mit der Autorität N = 0,7 ergebe eine nahezu lineare Änderung der Wärmeleistung über der Ventilstellung — Leistung, nicht Volumenstrom: die eigene konvexe Kennlinie des Verbrauchers legt sich über die des Ventils und schiebt die beste Autorität nach oben. Jede Regel gilt für ihre eigene Größe; keine Zahl wurde der anderen angepasst.",
  nl:"De autoriteit a is het aandeel van de variabele weerstand in het geregelde circuit dat over de geopende regelafsluiter staat: het drukverschil over de volledig geopende afsluiter gedeeld door dat over de gesloten afsluiter (CIBSE Guide H, 2009, 3.3.4.1). Bij a = 1 is de bedrijfskarakteristiek gelijk aan de grondkarakteristiek; daaronder verliest de afsluiter grip op het debiet. Voor modulerende regeling loopt het gebruikelijke keuzevenster van 0,25 tot 0,5 (ASHRAE, HVAC Systems and Equipment, 2016, hfst. 47); CIBSE Guide H, 3.3.4.4 vraagt ten minste 0,3 in een mengschakeling en 0,5 in een verdeelschakeling, en de bibliotheek LBNL Modelica Buildings dimensioneert elke afsluiter op 0,5. Twee gepubliceerde vuistregels spreken elkaar tegen over de autoriteit waarbij een equiprocentuele afsluiter lineair wordt, omdat ze verschillende grootheden lineariseren. De klassieke regel zet een 4 %-equiprocentuele afsluiter — regelverhouding 25:1, CIBSE Guide H, 3.3.3.1 — op a ≈ 0,3 en gaat over het debiet tegen de klepstand, precies wat de curven hieronder tekenen: daar ligt de vlakste aansluiting op de rechte lijn rond a = 0,2, en de tabel geeft de grootste afwijking voor elke ingestelde autoriteit. CIBSE Guide H, 3.3.4.2, figuur 3.16 zegt daarentegen dat een equiprocentuele karakteristiek met autoriteit N = 0,7 een vrijwel lineaire verandering van het warmtevermogen met de klepstand geeft — vermogen, niet debiet: de eigen bolle debiet-vermogenkromme van de gebruiker komt boven op die van de afsluiter en duwt de beste autoriteit omhoog. Elke regel klopt voor haar eigen grootheid; geen van beide getallen is naar het andere toe gebogen.",
  fr:"L’autorité a est la part de la résistance variable du circuit régulé qui se trouve sur la vanne ouverte : la perte de charge sur la vanne grande ouverte divisée par celle qu’elle voit fermée (CIBSE Guide H, 2009, 3.3.4.1). À a = 1 la caractéristique de service égale la caractéristique intrinsèque ; en dessous, la vanne perd prise sur le débit. En régulation modulante, la fenêtre habituelle va de 0,25 à 0,5 (ASHRAE, HVAC Systems and Equipment, 2016, ch. 47) ; CIBSE Guide H, 3.3.4.4 demande au moins 0,3 en montage mélangeur et 0,5 en montage répartiteur, et la bibliothèque LBNL Modelica Buildings dimensionne toutes ses vannes à 0,5. Deux règles publiées se contredisent sur l’autorité à laquelle une vanne égal-pourcentage devient linéaire, parce qu’elles ne linéarisent pas la même grandeur. La règle classique place une vanne égal-pourcentage 4 % — rangeabilité 25:1, CIBSE Guide H, 3.3.3.1 — à a ≈ 0,3 et parle du débit en fonction de la course, ce que tracent justement les courbes ci-dessous : le meilleur alignement sur la droite s’y trouve vers a = 0,2, et le tableau donne l’écart maximal pour l’autorité que vous réglez. CIBSE Guide H, 3.3.4.2, figure 3.16 affirme au contraire qu’une caractéristique égal-pourcentage d’autorité N = 0,7 donne une variation quasi linéaire de la puissance thermique avec la position de la vanne — la puissance, pas le débit : la courbe débit-puissance convexe de l’émetteur s’ajoute à celle de la vanne et pousse la meilleure autorité vers le haut. Chacune vaut pour sa propre grandeur ; aucun des deux nombres n’a été plié à l’autre.",
  es:"La autoridad a es la fracción de la resistencia variable del circuito regulado que recae sobre la válvula abierta: la pérdida de carga en la válvula totalmente abierta dividida por la que soporta cerrada (CIBSE Guide H, 2009, 3.3.4.1). Con a = 1 la característica de servicio coincide con la intrínseca; por debajo, la válvula pierde control sobre el caudal. En regulación modulante la ventana habitual va de 0,25 a 0,5 (ASHRAE, HVAC Systems and Equipment, 2016, cap. 47); CIBSE Guide H, 3.3.4.4 pide al menos 0,3 en montaje mezclador y 0,5 en montaje repartidor, y la biblioteca LBNL Modelica Buildings dimensiona todas sus válvulas con 0,5. Dos reglas publicadas se contradicen sobre la autoridad con la que una válvula isoporcentual se vuelve lineal, porque linealizan magnitudes distintas. La regla clásica sitúa una válvula isoporcentual del 4 % — rangeabilidad 25:1, CIBSE Guide H, 3.3.3.1 — en a ≈ 0,3 y habla del caudal frente a la carrera, que es justo lo que dibujan las curvas de abajo: en ellas el mejor ajuste a la recta está cerca de a = 0,2, y la tabla imprime la desviación máxima para la autoridad que fije. CIBSE Guide H, 3.3.4.2, figura 3.16 dice en cambio que una característica isoporcentual con autoridad N = 0,7 da una variación casi lineal de la potencia térmica con la posición de la válvula — potencia, no caudal: la propia curva convexa caudal-potencia del emisor se suma a la de la válvula y empuja hacia arriba la mejor autoridad. Cada una vale para su propia magnitud; ninguna cifra se ha doblado para encajar con la otra.",pl:"Autorytet a to część zmiennej rezystancji obwodu sterowanego, która znajduje się na otwartym zaworze regulacyjnym: spadek na całkowicie otwartym zaworze podzielony przez spadek, jaki obserwuje się po zamknięciu (CIBSE Guide H, 2009, 3.3.4.1). Przy a = 1 charakterystyka pracy jest równa charakterystyce własnej; poniżej tej wartości zawór traci kontrolę nad przepływem. W przypadku funkcji modulacyjnej typowe okno wyboru wynosi od 0,25 do 0,5 (ASHRAE, HVAC Systems and Equipment, 2016, rozdz. 47); CIBSE Guide H, 3.3.4.4 wymaga co najmniej 0,3 w obiegu mieszającym i 0,5 w rozdzielającym, a biblioteka LBNL Modelica Buildings ustala rozmiar każdego zaworu na 0,5. Dwie opublikowane reguły różnią się co do autorytetu, przy którym zawór stałoprocentowy staje się liniowy, ponieważ linearyzują różne wielkości. Klasyczna zasada określa zawór o równym procencie 4% — zakresowość 25:1, CIBSE Guide H, 3.3.3.1 — przy a ≈ 0,3 i mówi o przepływie w stosunku do skoku zaworu, co jest dokładnie tym, co rysują poniższe krzywe: na nich najbardziej płaskie dopasowanie do linii prostej leży w pobliżu a = 0,2, a tabela drukuje największą przerwę dla dowolnego ustawionego autorytetu. CIBSE Guide H, 3.3.4.2, rysunek 3.16 mówi natomiast, że charakterystyka o równym procencie z autorytetem N = 0,7 daje prawie liniową zmianę mocy cieplnej wraz z położeniem zaworu — mocy, nie przepływu: wypukła krzywa przepływu do wyjścia emitera układa się na zaworze i wypycha najlepszy autorytet w górę. Każda z nich obowiązuje dla swojej własnej wartości; żadna liczba nie została wygięta, aby dopasować się do drugiej."},

 retOk:{en:"Return is above the minimum you set — the generator is protected.",uk:"Зворотна вища за задану мінімальну — генератор захищено.",de:"Der Rücklauf liegt über dem eingestellten Minimum — der Erzeuger ist geschützt.",nl:"Het retour ligt boven het ingestelde minimum — de opwekker is beschermd.",fr:"Le retour est au-dessus du minimum réglé — le générateur est protégé.",es:"El retorno está por encima del mínimo fijado — el generador está protegido.",pl:"Powrót jest wyższy od ustawionego minimum — generator jest chroniony."},
 retLow:{en:"Return is below the minimum you set. On a cast-iron or steel boiler this is the flue-gas condensation and corrosion case; on a condensing boiler or a heat pump it is exactly what you want.",uk:"Зворотна нижча за задану мінімальну. Для чавунного чи сталевого котла це випадок конденсації димових газів і корозії; для конденсаційного котла чи теплового насоса це саме те, що потрібно.",de:"Der Rücklauf liegt unter dem eingestellten Minimum. Bei einem Guss- oder Stahlkessel ist das der Fall von Abgaskondensation und Korrosion; bei Brennwertkessel oder Wärmepumpe ist es genau erwünscht.",nl:"Het retour ligt onder het ingestelde minimum. Bij een gietijzeren of stalen ketel is dit het geval van rookgascondensatie en corrosie; bij een HR-ketel of warmtepomp is het juist gewenst.",fr:"Le retour est sous le minimum réglé. Sur une chaudière fonte ou acier, c’est le cas de condensation des fumées et de corrosion ; sur une chaudière à condensation ou une PAC, c’est précisément recherché.",es:"El retorno está por debajo del mínimo fijado. En una caldera de fundición o acero es el caso de condensación de humos y corrosión; en una de condensación o una bomba de calor es justo lo buscado.",pl:"Powrót jest niższy od ustawionego minimum. W przypadku kotła żeliwnego lub stalowego jest to przypadek kondensacji i korozji spalin; w przypadku kotła kondensacyjnego lub pompy ciepła jest to dokładnie to, czego potrzebujesz."},
 floorHot:{en:"Floor surface would exceed the limit for an occupied room at this regime.",uk:"Температура поверхні підлоги перевищила б межу для житлової зони за цього режиму.",de:"Die Fußbodenoberfläche überschritte bei diesem Regime den Grenzwert für Aufenthaltsräume.",nl:"De vloeroppervlaktetemperatuur zou bij dit regime de grens voor verblijfsruimten overschrijden.",fr:"La température de surface du sol dépasserait la limite en zone occupée à ce régime.",es:"La temperatura superficial del suelo superaría el límite en zona ocupada con este régimen.",pl:"Powierzchnia podłogi przekroczyłaby dopuszczalną wartość dla zajmowanego pomieszczenia w tym systemie."},
 noFlow:{en:"At this load the flow through the generator has collapsed. Without a constant-flow consumer module the boiler will short-cycle on its high-limit thermostat.",uk:"За цього навантаження витрата через генератор зникла. Без модуля споживача з постійною витратою котел тактуватиме за максимальним термостатом.",de:"Bei dieser Last ist der Volumenstrom durch den Erzeuger zusammengebrochen. Ohne ein Verbrauchermodul mit konstantem Volumenstrom taktet der Kessel über den Maximalthermostaten.",nl:"Bij deze belasting is het debiet door de opwekker ingestort. Zonder gebruikermoduul met constant debiet gaat de ketel pendelen op de maximaalthermostaat.",fr:"À cette charge, le débit dans le générateur s’est effondré. Sans module à débit constant, la chaudière va cycler sur son thermostat de sécurité.",es:"Con esta carga el caudal por el generador se ha desplomado. Sin un módulo de caudal constante, la caldera ciclará por su termostato de máxima.",pl:"Przy tym obciążeniu przepływ przez generator załamał się. Bez modułu odbiornika o stałym przepływie kocioł będzie miał krótkie cykle na termostacie ograniczającym."},
 /* Провенанс подвала опирается только на открытые и проверяемые источники:
  * таксономия схем — LBNL Modelica Buildings (HydronicConfigurations) и
  * Petitjean 1994, арматура — CIBSE Guide H (2009), числа — IAPWS R7-97(2012),
  * EN 442-1:2014 и EN 1264. Названо и то, чего на странице нет: буквы A/B/C/D
  * не принадлежат ни одному стандарту, ни один рисунок не воспроизводит
  * опубликованный чертёж. */
 foot:{
  en:"The circuit families used here — throttle, diversion, injection, single and dual mixing, decoupling — are the standard hydronic configurations as published openly in the LBNL Modelica Buildings Library (Buildings.Fluid.HydronicConfigurations User’s Guide, release 10.1.1), which in turn follows R. Petitjean, Total Hydronic Balancing (Tour & Andersson AB, Ljung, Sweden, 1994); valve sizing and arrangement follow CIBSE Guide H: Building Control Systems (2009), 3.3.3 and 3.3.4. The A/B/C/D lettering is this tool’s own and belongs to no standard — do not carry these codes into a specification. Every schematic is drawn from scratch and parametric, none of them reproduces a published drawing, and every number on this page is computed live: water properties from IAPWS R7-97(2012), the nominal temperature difference at 75/65/20 °C from EN 442-1:2014, floor-surface output and temperature limits from EN 1264.",
  uk:"Родини схем, ужиті тут, — дроселювальна, розподільна, інжекційна, одинарного та подвійного змішування, розв’язувальна — це стандартні гідравлічні конфігурації, відкрито опубліковані в бібліотеці LBNL Modelica Buildings (Buildings.Fluid.HydronicConfigurations User’s Guide, випуск 10.1.1), яка своєю чергою спирається на R. Petitjean, Total Hydronic Balancing (Tour & Andersson AB, Ljung, Швеція, 1994); підбір і компонування арматури — за CIBSE Guide H: Building Control Systems (2009), 3.3.3 і 3.3.4. Літери A/B/C/D власні й не належать жодному стандарту — не переносьте ці коди у специфікацію. Усі схеми намальовано з нуля й параметрично, жодна не відтворює опублікованого креслення, і кожне число на цій сторінці обчислюється тут-таки: властивості води за IAPWS R7-97(2012), номінальний температурний напір за 75/65/20 °C за EN 442-1:2014, тепловіддача поверхні підлоги та граничні температури за EN 1264.",
  de:"Die hier verwendeten Schaltungsfamilien — Drossel-, Verteil-, Einspritz-, einfache und doppelte Mischschaltung, Entkopplung — sind die üblichen hydraulischen Konfigurationen, wie sie offen in der LBNL Modelica Buildings Library (Buildings.Fluid.HydronicConfigurations User’s Guide, Ausgabe 10.1.1) veröffentlicht sind, die ihrerseits R. Petitjean, Total Hydronic Balancing (Tour & Andersson AB, Ljung, Schweden, 1994) folgt; Auslegung und Anordnung der Armaturen nach CIBSE Guide H: Building Control Systems (2009), 3.3.3 und 3.3.4. Die Buchstaben A/B/C/D sind die dieses Werkzeugs und gehören keiner Norm — übernehmen Sie diese Codes nicht in ein Leistungsverzeichnis. Alle Schemata sind neu und parametrisch gezeichnet, keines gibt eine veröffentlichte Zeichnung wieder, und jede Zahl auf dieser Seite wird hier gerechnet: Stoffwerte des Wassers nach IAPWS R7-97(2012), die Norm-Übertemperatur bei 75/65/20 °C nach EN 442-1:2014, Fußbodenoberflächenleistung und Grenztemperaturen nach EN 1264.",
  nl:"De hier gebruikte schakelingsfamilies — smoren, verdelen, injectie, enkelvoudig en dubbel mengen, ontkoppelen — zijn de gangbare hydraulische configuraties zoals ze open gepubliceerd zijn in de LBNL Modelica Buildings Library (Buildings.Fluid.HydronicConfigurations User’s Guide, uitgave 10.1.1), die op haar beurt R. Petitjean, Total Hydronic Balancing (Tour & Andersson AB, Ljung, Zweden, 1994) volgt; dimensionering en opstelling van de appendages volgen CIBSE Guide H: Building Control Systems (2009), 3.3.3 en 3.3.4. De letters A/B/C/D zijn die van deze tool en horen bij geen enkele norm — neem deze codes niet over in een bestek. Alle schema’s zijn opnieuw en parametrisch getekend, geen ervan geeft een gepubliceerde tekening weer, en elk getal op deze pagina wordt hier gerekend: watereigenschappen volgens IAPWS R7-97(2012), het nominale temperatuurverschil bij 75/65/20 °C volgens EN 442-1:2014, vloeroppervlakteafgifte en grenstemperaturen volgens EN 1264.",
  fr:"Les familles de schémas employées ici — étranglement, décharge, injection, mélange simple et double, découplage — sont les configurations hydrauliques usuelles telles qu’elles sont publiées en libre accès dans la LBNL Modelica Buildings Library (Buildings.Fluid.HydronicConfigurations User’s Guide, version 10.1.1), qui suit elle-même R. Petitjean, Total Hydronic Balancing (Tour & Andersson AB, Ljung, Suède, 1994) ; le dimensionnement et la disposition de la robinetterie suivent CIBSE Guide H: Building Control Systems (2009), 3.3.3 et 3.3.4. Les lettres A/B/C/D sont propres à cet outil et n’appartiennent à aucune norme — ne les reportez pas dans un cahier des charges. Tous les schémas sont redessinés et paramétriques, aucun ne reproduit un dessin publié, et chaque nombre de cette page est calculé ici : propriétés de l’eau selon IAPWS R7-97(2012), écart de température nominal à 75/65/20 °C selon EN 442-1:2014, émission surfacique du plancher et températures limites selon EN 1264.",
  es:"Las familias de esquemas empleadas aquí — estrangulación, derivación, inyección, mezcla simple y doble, desacoplo — son las configuraciones hidráulicas habituales tal como se publican en abierto en la LBNL Modelica Buildings Library (Buildings.Fluid.HydronicConfigurations User’s Guide, versión 10.1.1), que a su vez sigue a R. Petitjean, Total Hydronic Balancing (Tour & Andersson AB, Ljung, Suecia, 1994); el dimensionado y la disposición de la valvulería siguen CIBSE Guide H: Building Control Systems (2009), 3.3.3 y 3.3.4. Las letras A/B/C/D son propias de esta herramienta y no pertenecen a ninguna norma: no las lleve a un pliego. Todos los esquemas están dibujados de nuevo y son paramétricos, ninguno reproduce un dibujo publicado, y cada número de esta página se calcula aquí: propiedades del agua según IAPWS R7-97(2012), salto de temperatura nominal a 75/65/20 °C según EN 442-1:2014, emisión superficial del suelo y temperaturas límite según EN 1264.",pl:"Rodziny obwodów używane w tym przypadku — przepustnica, dywersja, wtrysk, mieszanie pojedyncze i podwójne, odsprzęganie — to standardowe konfiguracje hydroniczne opublikowane w bibliotece LBNL Modelica Buildings Library (Buildings.Fluid.HydronicConfigurations User’s Guide, wydanie 10.1.1), która z kolei jest zgodna z publikacją R. Petitjeana „Total Hydronic Balancing” (Tour & Andersson AB, Ljung, Szwecja, 1994); dobór rozmiarów i rozmieszczenie zaworów są zgodne z CIBSE Guide H: Building Control Systems (2009), 3.3.3 i 3.3.4. Oznaczenia A/B/C/D są własnością tego narzędzia i nie należą do żadnego standardu — nie należy ich wprowadzać do specyfikacji. Każdy schemat został narysowany od podstaw i jest parametryczny, żaden z nich nie stanowi reprodukcji opublikowanego rysunku, a każda liczba na tej stronie została obliczona w czasie rzeczywistym: właściwości wody pochodzą z IAPWS R7-97(2012), nominalna różnica temperatur przy 75/65/20 °C z EN 442-1:2014, moc wyjściowa powierzchni podłogi i ograniczenia temperatury z EN 1264."}
};

 pCmp:{en:"Tick “compare” on any circuit and it joins the sweep below. Add as many as you like: one load sweep, the same design point, every curve side by side.",uk:"Позначте «порівняти» на будь-якій схемі — вона потрапить у прогін нижче. Додавайте скільки завгодно: один прогін, одна розрахункова точка, усі криві поруч.",de:"Setzen Sie bei einer Schaltung den Haken „vergleichen“, und sie kommt in den Durchlauf unten. Beliebig viele: ein Lastdurchlauf, derselbe Auslegungspunkt, alle Kurven nebeneinander.",nl:"Vink “vergelijken” aan bij een schakeling en ze komt in de doorloop hieronder. Zoveel als u wilt: één doorloop, hetzelfde ontwerppunt, alle curven naast elkaar.",fr:"Cochez « comparer » sur un schéma et il rejoint le balayage ci-dessous. Autant que vous voulez : un balayage, le même point, toutes les courbes côte à côte.",es:"Marque «comparar» en cualquier esquema y entra en el barrido de abajo. Todos los que quiera: un barrido, el mismo punto, todas las curvas juntas.",pl:"Zaznacz „porównaj” na dowolnym obwodzie, a zostanie on dołączony do poniższego wykresu. Dodaj tyle wykresów, ile chcesz: jeden wykres obciążenia, ten sam punkt projektowy, wszystkie krzywe obok siebie."},

 kit:{en:"Two-way control valve, equal-percentage preferred; one balancing valve with test nipples; no pump.",uk:"Двоходовий регулювальний клапан, бажано рівнопроцентний; один балансувальний із ніпелями; насоса немає.",de:"Zweiwege-Regelventil, bevorzugt gleichprozentig; ein Einregulierventil mit Messnippeln; keine Pumpe.",nl:"Tweewegregelafsluiter, bij voorkeur equiprocentueel; één inregelafsluiter met meetnippels; geen pomp.",fr:"Vanne deux voies, de préférence égal-pourcentage ; une vanne d’équilibrage ; pas de pompe.",es:"Válvula de dos vías, preferiblemente isoporcentual; una de equilibrado; sin bomba.",pl:"Zawór sterujący dwukierunkowy, preferowany stałoprocentowy; jeden zawór równoważący z króćcami pomiarowymi; bez pompy."}},
