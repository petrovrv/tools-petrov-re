 cons:[{en:"The opening temperature is fixed by the cartridge; changing it means changing the part.",uk:"Температуру відкриття задає картридж; змінити її — значить змінити деталь.",de:"Die Öffnungstemperatur legt die Kartusche fest; ändern heißt Bauteil tauschen.",nl:"De openingstemperatuur ligt vast in het element; wijzigen betekent vervangen.",fr:"La température d’ouverture est figée par la cartouche ; la changer, c’est changer la pièce.",es:"La temperatura de apertura la fija el cartucho; cambiarla es cambiar la pieza.",pl:"Temperatura otwarcia jest ustalana przez wkład, jej zmiana oznacza wymianę części."},
  {en:"It reacts to its own temperature with a lag, so it cannot be tuned the way a controlled loop can.",uk:"Реагує на власну температуру із запізненням, тож його не налаштувати, як керований контур.",de:"Reagiert verzögert auf die eigene Temperatur und lässt sich nicht wie ein Regelkreis abstimmen.",nl:"Reageert vertraagd op de eigen temperatuur en is niet af te stemmen als een regelkring.",fr:"Réagit avec retard à sa propre température ; impossible à régler comme une boucle.",es:"Reacciona con retardo a su propia temperatura; no se ajusta como un lazo regulado.",pl:"Reaguje na swoją własną temperaturę z opóźnieniem, dlatego nie można go dostroić w sposób, w jaki można to zrobić w przypadku pętli kontrolowanej."},
  {en:"Same efficiency penalty as any return-raising circuit.",uk:"Той самий штраф до ККД, що й у будь-якої схеми підняття зворотної.",de:"Dieselbe Effizienzstrafe wie jede Rücklaufanhebung.",nl:"Dezelfde rendementsstraf als elke retourverhoging.",fr:"Même pénalité que tout relèvement de retour.",es:"La misma penalización que toda elevación de retorno.",pl:"Taka sama kara za wydajność jak w przypadku każdego układu zwiększającego powrót."}],
 comm:[{en:"Choose the cartridge temperature from the generator's data sheet before ordering — it cannot be adjusted later.",uk:"Оберіть температуру картриджа за паспортом генератора до замовлення — потім не відрегулюєте.",de:"Kartuschentemperatur vor der Bestellung aus dem Erzeugerdatenblatt wählen — später nicht einstellbar.",nl:"Kies de elementtemperatuur vóór bestelling uit het opwekkerblad — later niet instelbaar.",fr:"Choisir la température de cartouche avant commande — non réglable ensuite.",es:"Elija la temperatura del cartucho antes de pedir — luego no se ajusta.",pl:"Przed złożeniem zamówienia należy wybrać temperaturę wkładu z karty katalogowej generatora — nie ma możliwości jej późniejszej zmiany."},
  {en:"Check the pressure drop across it at full flow; these valves are small and are often undersized.",uk:"Перевірте перепад на ньому за повної витрати: ці клапани малі й часто недомірені.",de:"Druckverlust bei Volllast prüfen; diese Ventile sind klein und oft unterdimensioniert.",nl:"Controleer het drukverlies bij vol debiet; deze afsluiters zijn klein en vaak te krap.",fr:"Vérifier la perte de charge à plein débit ; ces vannes sont petites et souvent sous-dimensionnées.",es:"Compruebe la pérdida de carga a pleno caudal; suelen quedarse cortas.",pl:"Sprawdź spadek ciśnienia przy pełnym przepływie; te zawory są małe i często mają za mały rozmiar."}],
 kit:{en:"Self-acting thermostatic three-way valve with a fixed cartridge temperature; balancing valve; no power supply.",uk:"Саморегульований термостатичний триходовий клапан із фіксованою температурою картриджа; балансувальний клапан; живлення не потрібне.",de:"Selbsttätiges thermostatisches Dreiwegeventil mit fester Kartuschentemperatur; Einregulierventil; keine Stromversorgung.",nl:"Zelfwerkende thermostatische driewegafsluiter met vaste elementtemperatuur; inregelafsluiter; geen voeding.",fr:"Vanne trois voies thermostatique autonome à cartouche fixe ; vanne d’équilibrage ; sans alimentation.",es:"Válvula termostática de tres vías autónoma con cartucho fijo; válvula de equilibrado; sin alimentación.",pl:"Samoczynny zawór termostatyczny trójdrożny ze stałą temperaturą wkładu; zawór równoważący; bez zasilania."}},

{id:"B6",cat:"B",model:"relief",selfPumped:false,solves:["p4"],creates:["p2","p9"],
 name:{en:"Minimum-flow bypass with a differential pressure relief valve",uk:"Байпас мінімальної витрати з перепускним клапаном",de:"Mindestmengen-Bypass mit Überströmventil",nl:"Minimumdebiet-bypass met overstroomklep",fr:"Dérivation de débit minimal par soupape différentielle",es:"Bypass de caudal mínimo con válvula diferencial",pl:"Obejście przepływu minimalnego z zaworem upustowym różnicy ciśnień"},
 one:{en:"A spring-loaded valve between supply and return opens as soon as the pressure difference climbs above its setting, and passes whatever flow the closing consumer valves refuse.",uk:"Підпружинений клапан між подачею і зворотною відкривається, щойно перепад перевищить уставку, і пропускає ту витрату, від якої відмовилися клапани споживачів.",de:"Ein federbelastetes Ventil zwischen Vor- und Rücklauf öffnet, sobald das Druckgefälle die Einstellung übersteigt, und lässt durch, was die schließenden Verbraucherventile verweigern.",nl:"Een veerbelaste klep tussen aanvoer en retour opent zodra het drukverschil boven de instelling komt en laat door wat de sluitende afsluiters weigeren.",fr:"Une soupape à ressort entre départ et retour s’ouvre dès que l’écart de pression dépasse le réglage et laisse passer ce que les vannes refusent.",es:"Una válvula de resorte entre impulsión y retorno abre cuando la presión supera el ajuste y deja pasar lo que rechazan las válvulas.",pl:"Sprężynowy zawór między zasilaniem i powrotem otwiera się, gdy różnica ciśnień wzrośnie powyżej nastawionej wartości, i przepuszcza cały przepływ odcięty przez zamykające się zawory odbiorcze."},
 yes:{en:"Systems with many two-way valves and a fixed-speed pump, where something has to give when everything closes at once.",uk:"Системи з багатьма двоходовими клапанами й нерегульованим насосом, де щось має поступитися, коли все закривається разом.",de:"Anlagen mit vielen Durchgangsventilen und ungeregelter Pumpe, wo etwas nachgeben muss, wenn alles zugeht.",nl:"Installaties met veel tweewegafsluiters en een ongeregelde pomp, waar iets moet wijken als alles dichtgaat.",fr:"Installations à nombreuses vannes deux voies et pompe non régulée, où quelque chose doit céder.",es:"Instalaciones con muchas válvulas de dos vías y bomba no regulada, donde algo debe ceder.",pl:"Systemy z wieloma zaworami dwudrożnymi i pompą o stałej prędkości, w których coś musi pęknąć, gdy wszystko zamknie się jednocześnie."},
 no:{en:"As a substitute for a speed-controlled pump. The relief valve keeps the pump loaded and throws the energy away as heat and noise.",uk:"Як заміна регульованому насосу. Перепускний клапан тримає насос навантаженим і викидає енергію в тепло й шум.",de:"Als Ersatz für eine drehzahlgeregelte Pumpe. Das Überströmventil hält die Pumpe belastet und wirft die Energie als Wärme und Lärm weg.",nl:"Als vervanging van een toerengeregelde pomp. De overstroomklep houdt de pomp belast en gooit de energie weg als warmte en lawaai.",fr:"En remplacement d’une pompe régulée. La soupape maintient la pompe chargée et dissipe l’énergie en chaleur et bruit.",es:"Como sustituto de una bomba regulada. La válvula mantiene cargada la bomba y disipa la energía en calor y ruido.",pl:"Jako zamiennik pompy z regulacją prędkości. Zawór bezpieczeństwa utrzymuje pompę w stanie naładowanym i odprowadza energię w postaci ciepła i hałasu."},
 pros:[{en:"Guarantees a minimum flow through the generator and the pump with one mechanical component.",uk:"Гарантує мінімальну витрату через генератор і насос одним механічним компонентом.",de:"Sichert einen Mindeststrom durch Erzeuger und Pumpe mit einem mechanischen Bauteil.",nl:"Waarborgt een minimumdebiet door opwekker en pomp met één mechanisch onderdeel.",fr:"Garantit un débit minimal par un seul organe mécanique.",es:"Garantiza un caudal mínimo con un solo elemento mecánico.",pl:"Gwarantuje minimalny przepływ przez generator i pompę przy użyciu jednego komponentu mechanicznego."},
  {en:"Caps the differential pressure the consumer valves have to work against, which protects their authority and their noise level.",uk:"Обмежує перепад, проти якого працюють клапани споживачів, захищаючи їхній авторитет і рівень шуму.",de:"Begrenzt das Druckgefälle, gegen das die Verbraucherventile arbeiten, und schützt Autorität und Geräuschpegel.",nl:"Begrenst het drukverschil waartegen de afsluiters werken en beschermt autoriteit en geluidsniveau.",fr:"Plafonne la pression contre laquelle travaillent les vannes, protégeant autorité et niveau sonore.",es:"Limita la presión contra la que trabajan las válvulas, protegiendo autoridad y ruido.",pl:"Ogranicza różnicę ciśnień, z jaką muszą pracować zawory odbiorcze, co chroni ich wiarygodność i poziom hałasu."}],
 cons:[{en:"Every litre through the bypass is hot supply water going straight back to the generator — the return climbs and the condensing window closes.",uk:"Кожен літр через обвід — це гаряча вода подачі просто назад у генератор: зворотна росте, вікно конденсації закривається.",de:"Jeder Liter durch den Bypass ist heißes Vorlaufwasser direkt zurück — der Rücklauf steigt, das Brennwertfenster schließt sich.",nl:"Elke liter door de bypass is heet aanvoerwater rechtstreeks terug — het retour stijgt, het condensatievenster sluit.",fr:"Chaque litre en dérivation est de l’eau chaude renvoyée directement — le retour monte, la fenêtre de condensation se ferme.",es:"Cada litro por el bypass es agua caliente devuelta directamente — el retorno sube y se cierra la condensación.",pl:"Każdy litr przepływający przez obejście to gorąca woda zasilająca, która wraca prosto do generatora — temperatura powrotu wzrasta, a okno skraplania zamyka się."},
  {en:"Its setting is a compromise nobody revisits: too low and it leaks all year, too high and it never opens when needed.",uk:"Його уставка — компроміс, до якого ніхто не повертається: занизька — тече цілий рік, зависока — не відкриється, коли треба.",de:"Seine Einstellung ist ein Kompromiss, den niemand nachprüft: zu niedrig leckt es ganzjährig, zu hoch öffnet es nie.",nl:"De instelling is een compromis dat niemand herziet: te laag lekt het het hele jaar, te hoog opent het nooit.",fr:"Son réglage est un compromis que personne ne revoit : trop bas il fuit toute l’année, trop haut il n’ouvre jamais.",es:"Su ajuste es un compromiso que nadie revisa: bajo gotea todo el año, alto nunca abre.",pl:"Jego ustawienie to kompromis, do którego nikt nie wraca: jeśli będzie ustawione zbyt nisko, będzie przeciekać przez cały rok, jeśli zaś zbyt wysoko, nigdy się nie otworzy, gdy będzie to potrzebne."}],
 comm:[{en:"Set it with all consumer valves closed, at the pressure difference the pump actually produces there — not at a catalogue figure.",uk:"Налаштовуйте за всіх закритих клапанів споживачів, на той перепад, який насос реально там створює, а не за каталогом.",de:"Bei geschlossenen Verbraucherventilen auf das dort tatsächlich anstehende Druckgefälle einstellen, nicht auf einen Katalogwert.",nl:"Instellen met alle afsluiters dicht, op het drukverschil dat de pomp daar werkelijk levert, niet op een catalogusgetal.",fr:"Régler toutes vannes fermées, sur l’écart réellement produit par la pompe, pas sur un chiffre catalogue.",es:"Ajústela con todas las válvulas cerradas, a la presión real de la bomba, no a un valor de catálogo.",pl:"Należy ustawić go przy zamkniętych wszystkich zaworach odbiorczych, przy różnicy ciśnień, jaką pompa faktycznie tam wytwarza — a nie na wartościach katalogowych."},
  {en:"Then check at full load that it stays shut — a relief valve that weeps all year is a permanent efficiency leak.",uk:"Потім перевірте за повного навантаження, що він закритий: клапан, який підтікає весь рік, — постійна витік ККД.",de:"Dann bei Volllast prüfen, dass es geschlossen bleibt — ein ganzjährig sickerndes Ventil ist ein Dauerverlust.",nl:"Controleer dan bij vollast dat hij dicht blijft — een het hele jaar lekkende klep is een permanent verlies.",fr:"Vérifier ensuite à pleine charge qu’elle reste fermée — une soupape qui suinte est une perte permanente.",es:"Compruebe a plena carga que queda cerrada — una válvula que gotea es una pérdida permanente.",pl:"Następnie sprawdź, czy przy pełnym obciążeniu zawór pozostaje zamknięty — zawór bezpieczeństwa, który przecieka przez cały rok, jest stałą przyczyną nieszczelności."}],
 kit:{en:"Differential pressure relief valve with an adjustable setting; pressure test points either side of it.",uk:"Перепускний клапан з регульованою уставкою; манометричні точки з обох боків.",de:"Überströmventil mit einstellbarem Sollwert; Druckmesspunkte beiderseits.",nl:"Overstroomklep met instelbare waarde; drukmeetpunten aan weerszijden.",fr:"Soupape différentielle réglable ; prises de pression de part et d’autre.",es:"Válvula diferencial ajustable; tomas de presión a ambos lados.",pl:"Zawór bezpieczeństwa różnicowego z regulowanym ustawieniem; punkty pomiaru ciśnienia po obu jego stronach."}},

{id:"C1",cat:"C",model:"decouple",selfPumped:false,solves:["p4","p6","p8"],creates:["p2"],
 name:{en:"Low-loss header",uk:"Гідророзподільник малого опору",de:"Hydraulische Weiche",nl:"Open verdeler",fr:"Bouteille de découplage",es:"Botella de equilibrado",pl:"Sprzęgło hydrauliczne"},
 one:{en:"A short, generously sized connection between the supply and return headers, so the generator circuit and the consumer circuits each set their own flow.",uk:"Коротка щедро розмірена перемичка між подавальним і зворотним колекторами: кожен контур задає свою витрату.",de:"Eine kurze, großzügig bemessene Verbindung zwischen Vor- und Rücklaufverteiler; jeder Kreis stellt seinen Strom selbst ein.",nl:"Een korte, ruim bemeten verbinding tussen aanvoer- en retourverdeler; elke kring stelt zijn eigen debiet in.",fr:"Une liaison courte et large entre collecteurs, chaque circuit fixant son propre débit.",es:"Una conexión corta y amplia entre colectores; cada circuito fija su propio caudal.",pl:"Krótkie, dość duże połączenie między kolektorem zasilającym i powrotnym, dzięki któremu obwód generatora i obwody odbiorcze ustawiają własny przepływ."},
 yes:{en:"Whenever the generator and the consumers each have a pump, and whenever several groups with different regimes share one header.",uk:"Коли і генератор, і споживачі мають насоси, і коли кілька груп із різними режимами на одному колекторі.",de:"Wenn Erzeuger und Verbraucher je eine Pumpe haben und mehrere Gruppen an einem Verteiler hängen.",nl:"Wanneer opwekker en gebruikers elk een pomp hebben en meer groepen één verdeler delen.",fr:"Dès que générateur et émetteurs ont chacun une pompe et partagent un collecteur.",es:"Cuando generador y consumidores tienen bomba y comparten colector.",pl:"Zawsze, gdy generator i odbiorcy mają własną pompę, a kilka grup o różnych trybach pracy dzieli jeden kolektor."},
 no:{en:"As a substitute for balancing. A header hides an unbalanced system; it does not correct one.",uk:"Як заміна балансуванню. Розподільник приховує незбалансовану систему, але не виправляє її.",de:"Als Ersatz für den Abgleich. Eine Weiche verdeckt eine unabgeglichene Anlage, sie korrigiert sie nicht.",nl:"Als vervanging van inregelen. Een verdeler verbergt een niet-ingeregelde installatie.",fr:"En remplacement de l’équilibrage. Une bouteille masque un déséquilibre, elle ne le corrige pas.",es:"Como sustituto del equilibrado. Una botella oculta el desequilibrio, no lo corrige.",pl:"Zamiast równoważenia. Kolektor ukrywa niezrównoważony system, ale go nie koryguje."},
 pros:[{en:"Guarantees circulation through the generator whatever the consumer valves do.",uk:"Гарантує циркуляцію через генератор незалежно від клапанів споживачів.",de:"Sichert die Durchströmung des Erzeugers unabhängig von den Verbraucherventilen.",nl:"Waarborgt circulatie door de opwekker ongeacht de afsluiters.",fr:"Garantit la circulation quel que soit l’état des vannes.",es:"Garantiza circulación hagan lo que hagan las válvulas.",pl:"Gwarantuje cyrkulację w generatorze, niezależnie od pracy zaworów odbiorczych."},
  {en:"Stops two pumps from moving each other's duty point.",uk:"Не дає двом насосам зсувати робочі точки один одного.",de:"Verhindert, dass zwei Pumpen einander den Betriebspunkt verschieben.",nl:"Voorkomt dat twee pompen elkaars werkpunt verzetten.",fr:"Empêche deux pompes de se déplacer mutuellement.",es:"Evita que dos bombas se desplacen mutuamente.",pl:"Zapobiega wzajemnemu przesuwaniu się punktów pracy dwóch pomp."},
  {en:"Lets groups with different regimes coexist on one header.",uk:"Дозволяє групам із різними режимами співіснувати на одному колекторі.",de:"Lässt Gruppen mit verschiedenen Regimen koexistieren.",nl:"Laat groepen met verschillende regimes samengaan.",fr:"Permet la cohabitation de régimes différents.",es:"Permite convivir regímenes distintos.",pl:"Umożliwia grupom o różnych reżimach współistnienie w jednym kolektorze."}],
 cons:[{en:"If the primary flow is smaller than the sum of the secondary flows, return water crosses back into the supply and every consumer gets water cooler than the generator makes.",uk:"Якщо первинна витрата менша за суму вторинних, зворотна перетікає в подачу, і кожен споживач отримує воду холоднішу за ту, що робить генератор.",de:"Ist der Primärstrom kleiner als die Summe der Sekundärströme, tritt Rücklauf in den Vorlauf über und jeder Verbraucher bekommt kühleres Wasser.",nl:"Is het primaire debiet kleiner dan de som van de secundaire, dan stroomt retour over naar aanvoer en krijgt elke gebruiker kouder water.",fr:"Si le primaire est inférieur à la somme des secondaires, le retour repasse au départ et chacun reçoit une eau plus froide.",es:"Si el primario es menor que la suma de secundarios, el retorno pasa a impulsión y todos reciben agua más fría.",pl:"Jeżeli przepływ pierwotny jest mniejszy od sumy przepływów wtórnych, woda powrotna wraca do źródła zasilania, a każdy użytkownik otrzymuje wodę chłodniejszą niż ta wytwarzana przez generator."},
  {en:"When the primary flow is larger, hot supply short-circuits into the return and pushes the return temperature up.",uk:"Коли первинна більша, гаряча подача замикається у зворотну й піднімає її температуру.",de:"Ist der Primärstrom größer, schließt heißer Vorlauf in den Rücklauf kurz und hebt dessen Temperatur.",nl:"Is het primaire debiet groter, dan sluit hete aanvoer kort naar het retour en tilt de temperatuur op.",fr:"Si le primaire est supérieur, le départ chaud court-circuite vers le retour et l’élève.",es:"Si el primario es mayor, la impulsión caliente cortocircuita al retorno y lo eleva.",pl:"Gdy przepływ pierwotny jest większy, gorąca woda doprowadzana do przewodu powrotnego powoduje zwarcie i wzrost temperatury przewodu powrotnego."},
  {en:"The controller opens further to compensate, producing a slow oscillation that takes weeks to find on site.",uk:"Регулятор відкривається далі, компенсуючи, і виникає повільне коливання, яке шукають тижнями.",de:"Der Regler öffnet zum Ausgleich weiter — eine langsame Schwingung, die man wochenlang sucht.",nl:"De regelaar opent verder ter compensatie — een trage slingering die men wekenlang zoekt.",fr:"Le régulateur ouvre davantage — une oscillation lente qu’on cherche des semaines.",es:"El regulador abre más — una oscilación lenta que cuesta semanas hallar.",pl:"Kontroler otwiera się szerzej, aby skompensować zjawisko, wytwarzając powolne oscylacje, których wykrycie w terenie zajmuje tygodnie."}],
 comm:[{en:"Size the primary flow above the sum of the connected full-load consumer flows, then set it at the generator balancing valve.",uk:"Задайте первинну витрату вище за суму приєднаних витрат повного навантаження й виставте її балансувальним клапаном генератора.",de:"Primärstrom größer als die Summe der Volllast-Verbraucherströme auslegen und am Erzeuger-Einregulierventil einstellen.",nl:"Dimensioneer het primaire debiet boven de som van de vollastdebieten en stel het in bij de opwekker.",fr:"Dimensionner le primaire au-dessus de la somme des débits pleine charge, puis le régler.",es:"Dimensione el primario por encima de la suma de caudales a plena carga y ajústelo.",pl:"Należy ustawić przepływ pierwotny na poziomie większym od sumy przepływów podłączonych odbiorników przy pełnym obciążeniu, a następnie ustawić go na zaworze równoważącym generatora."},
  {en:"Verify the crossover direction by comparing the two header temperatures at full and at part load.",uk:"Перевірте напрямок перетоку, порівнявши температури двох колекторів за повного й часткового навантаження.",de:"Übertrittsrichtung durch Vergleich der beiden Verteilertemperaturen bei Voll- und Teillast prüfen.",nl:"Controleer de overstroomrichting door beide verdelertemperaturen te vergelijken.",fr:"Vérifier le sens de transfert en comparant les températures des deux collecteurs.",es:"Verifique el sentido comparando las temperaturas de ambos colectores.",pl:"Sprawdź kierunek skrzyżowania, porównując dwie temperatury kolektora przy pełnym i częściowym obciążeniu."}],
 kit:{en:"Balancing valve on the generator branch; test points on both headers. Sizing the header body by velocity is deliberately left out: published limits are quoted at different measuring points and cannot be reconciled.",uk:"Балансувальний клапан на гілці генератора; точки замірів на обох колекторах. Підбір корпусу за швидкістю навмисно не наводиться: опубліковані межі стосуються різних точок вимірювання.",de:"Einregulierventil im Erzeugerzweig; Messpunkte an beiden Verteilern. Die Auslegung des Weichenkörpers über die Geschwindigkeit bleibt bewusst weg: veröffentlichte Grenzwerte gelten an verschiedenen Messstellen.",nl:"Inregelafsluiter in de opwekkertak; meetpunten op beide verdelers. Dimensionering van het lichaam op snelheid blijft bewust weg: gepubliceerde grenzen gelden op verschillende meetpunten.",fr:"Vanne d’équilibrage côté générateur ; prises sur les deux collecteurs. Le dimensionnement par la vitesse est omis : les limites publiées visent des points de mesure différents.",es:"Válvula de equilibrado en el generador; tomas en ambos colectores. El dimensionado por velocidad se omite: los límites publicados se refieren a puntos distintos.",pl:"Zawór równoważący na odgałęzieniu generatora; punkty pomiarowe na obu kolektorach. Celowo pominięto dobór wielkości korpusu kolektora na podstawie prędkości: opublikowane wartości graniczne są podawane dla różnych punktów pomiarowych i nie można ich ze sobą uzgodnić."}},

{id:"C2",cat:"C",model:"decouple",selfPumped:false,solves:["p4","p8"],creates:["p2"],
 name:{en:"Close-coupled tees",uk:"Зближені трійники",de:"Kurzgeschlossene T-Stücke",nl:"Kortgekoppelde T-stukken",fr:"Tés rapprochés",es:"Tes acopladas",pl:"Trójniki blisko sprzężone"},
 one:{en:"The same decoupling done with two tees a few diameters apart instead of a vessel — cheaper, smaller, and far less forgiving of a long connecting run.",uk:"Та сама розв’язка на двох трійниках за кілька діаметрів один від одного замість ємності — дешевше, менше й куди менш поблажливо до довгих ділянок.",de:"Dieselbe Entkopplung mit zwei T-Stücken wenige Durchmesser auseinander statt eines Behälters — billiger, kleiner, viel unnachsichtiger.",nl:"Dezelfde ontkoppeling met twee T-stukken enkele diameters uit elkaar in plaats van een vat — goedkoper, kleiner, veel minder vergevingsgezind.",fr:"Le même découplage avec deux tés espacés de quelques diamètres — moins cher, plus compact, bien moins tolérant.",es:"El mismo desacoplo con dos tes separadas pocos diámetros — más barato, compacto y mucho menos tolerante.",pl:"To samo rozłączenie wykonano za pomocą dwóch trójników oddalonych od siebie o kilka średnic zamiast naczynia — tańsze, mniejsze i znacznie mniej wybaczające długie odcinki łączące."},
 yes:{en:"Primary–secondary plant rooms where space is tight and the two tees can genuinely be kept close together.",uk:"Теплопункти з первинним і вторинним контурами, де тісно і трійники справді можна тримати поруч.",de:"Primär-Sekundär-Zentralen mit wenig Platz, wo die T-Stücke wirklich eng beieinander bleiben.",nl:"Primair-secundaire ruimten met weinig plaats, waar de T-stukken echt dicht bij elkaar blijven.",fr:"Locaux primaire-secondaire exigus où les tés restent réellement proches.",es:"Salas primario-secundario reducidas donde las tes queden realmente juntas.",pl:"Pomieszczenia techniczne główne i pomocnicze, w których przestrzeń jest ograniczona, a dwa trójniki można umieścić blisko siebie."},
 no:{en:"Whenever the run between the tees carries any appreciable resistance — then it is no longer a decoupler, it is a pipe.",uk:"Щойно ділянка між трійниками має помітний опір: це вже не розв’язка, а труба.",de:"Sobald die Strecke zwischen den T-Stücken nennenswerten Widerstand hat — dann ist es keine Entkopplung mehr, sondern ein Rohr.",nl:"Zodra het traject tussen de T-stukken merkbare weerstand heeft — dan is het geen ontkoppeling meer maar een leiding.",fr:"Dès que le tronçon entre les tés présente une résistance sensible — ce n’est plus un découplage, c’est un tuyau.",es:"En cuanto el tramo entre tes tenga resistencia apreciable — deja de desacoplar y es solo tubería.",pl:"Jeśli odcinek pomiędzy teownikami stawia zauważalny opór, nie jest to już element rozdzielający, lecz rura."},
 pros:[{en:"Costs almost nothing and takes almost no space.",uk:"Коштує майже нічого й займає майже нічого.",de:"Kostet fast nichts und braucht fast keinen Platz.",nl:"Kost bijna niets en neemt bijna geen ruimte.",fr:"Ne coûte presque rien et ne prend presque aucune place.",es:"Cuesta casi nada y ocupa casi nada.",pl:"Kosztuje niewiele i zajmuje niewiele miejsca."},
  {en:"Behaves exactly like a header for the flows, so the same crossover reasoning applies unchanged.",uk:"Для витрат поводиться точно як розподільник, тож те саме міркування про переток діє без змін.",de:"Verhält sich für die Ströme genau wie eine Weiche; dieselbe Übertrittslogik gilt unverändert.",nl:"Gedraagt zich voor de debieten precies als een verdeler; dezelfde overstroomlogica geldt.",fr:"Se comporte comme une bouteille pour les débits ; le même raisonnement s’applique.",es:"Para los caudales se comporta como una botella; vale el mismo razonamiento.",pl:"Zachowuje się dokładnie jak kolektor przepływów, więc obowiązuje ta sama zasada krzyżowania, ale bez zmian."}],
 cons:[{en:"No air or dirt separation, which a vessel would have given you for free.",uk:"Немає ні відділення повітря, ні шламу — ємність дала б це задарма.",de:"Keine Luft- oder Schlammabscheidung, die ein Behälter gratis mitbrächte.",nl:"Geen lucht- of vuilafscheiding, die een vat gratis meegeeft.",fr:"Pas de séparation d’air ni de boues, qu’une bouteille offrirait.",es:"Sin separación de aire ni lodos, que una botella daría gratis.",pl:"Brak separacji powietrza i zanieczyszczeń, które sprzęgło mógłby zapewnić za darmo."},
  {en:"Very sensitive to how it is built; a plumber lengthening the run by a metre quietly removes the decoupling.",uk:"Дуже чутлива до монтажу: сантехнік, який подовжив ділянку на метр, тихо прибрав розв’язку.",de:"Sehr montageempfindlich; ein um einen Meter verlängerter Abschnitt hebt die Entkopplung still auf.",nl:"Zeer montagegevoelig; een meter extra leiding heft de ontkoppeling stilletjes op.",fr:"Très sensible à la pose ; un mètre de plus supprime discrètement le découplage.",es:"Muy sensible al montaje; un metro más elimina el desacoplo sin avisar.",pl:"Bardzo wrażliwy na sposób budowy; hydraulik wydłużający instalację o metr cicho usuwa rozłącznik."}],
 comm:[{en:"Measure the temperature difference across the tees; if it is not near zero at balanced flows, the run is too long.",uk:"Виміряйте перепад температур на трійниках: якщо він не близький до нуля за збалансованих витрат, ділянка задовга.",de:"Temperaturdifferenz über die T-Stücke messen; ist sie bei abgeglichenen Strömen nicht nahe null, ist die Strecke zu lang.",nl:"Meet het temperatuurverschil over de T-stukken; is het niet bijna nul, dan is het traject te lang.",fr:"Mesurer l’écart de température entre les tés ; s’il n’est pas quasi nul, le tronçon est trop long.",es:"Mida la diferencia de temperatura entre tes; si no es casi nula, el tramo es demasiado largo.",pl:"Zmierz różnicę temperatur między trójnikami; jeśli przy zrównoważonym przepływie nie jest ona bliska zeru, odcinek jest za długi."}],
 kit:{en:"Two tees a few pipe diameters apart, balancing valves on both loops, test points either side.",uk:"Два трійники за кілька діаметрів один від одного, балансувальні клапани на обох контурах, точки замірів з обох боків.",de:"Zwei T-Stücke wenige Durchmesser auseinander, Einregulierventile in beiden Kreisen, Messpunkte beiderseits.",nl:"Twee T-stukken enkele diameters uit elkaar, inregelafsluiters in beide kringen, meetpunten aan weerszijden.",fr:"Deux tés à quelques diamètres, vannes d’équilibrage sur les deux boucles, prises de part et d’autre.",es:"Dos tes a pocos diámetros, válvulas de equilibrado en ambos lazos, tomas a ambos lados.",pl:"Dwa trójniki oddalone od siebie o kilka średnic rury, zawory równoważące na obu pętlach, punkty pomiarowe po obu stronach."}},

{id:"C3",cat:"C",model:"decouple-balanced",selfPumped:false,solves:["p6","p8"],creates:[],
 name:{en:"Zero-differential manifold",uk:"Колектор із нульовим перепадом",de:"Verteiler ohne Differenzdruck",nl:"Verdeler met nuldrukverschil",fr:"Collecteur à pression différentielle nulle",es:"Colector de presión diferencial nula",pl:"Rozdzielacz o zerowej różnicy ciśnień"},
 one:{en:"A manifold deliberately balanced so that the primary and secondary flows match and nothing crosses over in either direction.",uk:"Колектор, навмисно збалансований так, щоб первинна й вторинна витрати збігалися і переток не йшов у жоден бік.",de:"Ein Verteiler, bewusst so abgeglichen, dass Primär- und Sekundärstrom übereinstimmen und nichts übertritt.",nl:"Een verdeler bewust zo ingeregeld dat primair en secundair debiet gelijk zijn en niets oversteekt.",fr:"Un collecteur volontairement équilibré pour que primaire et secondaire coïncident, sans transfert.",es:"Un colector equilibrado a propósito para que primario y secundario coincidan sin trasvase.",pl:"Rozdzielacz celowo zrównoważony w taki sposób, aby przepływy pierwotne i wtórne były zgodne i aby nic się nie krzyżowało w żadnym kierunku."},
 yes:{en:"Where the supply temperature to the groups must equal the generator temperature exactly, and the flows really can be held equal.",uk:"Там, де подача до груп має точно дорівнювати температурі генератора і витрати справді можна тримати рівними.",de:"Wo die Vorlauftemperatur zu den Gruppen exakt der Erzeugertemperatur entsprechen muss und die Ströme wirklich gleich gehalten werden können.",nl:"Waar de aanvoer naar de groepen exact gelijk moet zijn aan de opwekkertemperatuur en de debieten echt gelijk te houden zijn.",fr:"Là où le départ vers les groupes doit égaler exactement la température générateur et les débits peuvent rester égaux.",es:"Donde la impulsión a los grupos deba igualar exactamente la del generador y los caudales puedan mantenerse iguales.",pl:"Gdzie temperatura zasilania grup musi dokładnie równać się temperaturze generatora, a przepływy mogą być rzeczywiście równe."},
 no:{en:"On any system whose consumer flow varies. The moment the flows diverge the manifold behaves like a header, and the zero was a fiction.",uk:"У будь-якій системі зі змінною витратою споживачів. Щойно витрати розійшлися, колектор поводиться як розподільник, а нуль був вигадкою.",de:"In jeder Anlage mit veränderlichem Verbraucherstrom. Sobald die Ströme auseinanderlaufen, verhält sich der Verteiler wie eine Weiche.",nl:"In elke installatie met variabel gebruikerdebiet. Zodra de debieten uiteenlopen gedraagt de verdeler zich als een open verdeler.",fr:"Sur tout système à débit variable. Dès que les débits divergent, le collecteur devient une bouteille.",es:"En cualquier sistema de caudal variable. En cuanto divergen, el colector actúa como botella.",pl:"W każdym systemie, w którym przepływ odbiorników jest zmienny, w momencie rozbieżności przepływów rozdzielacz zachowuje się jak kolektor, a zero było fikcją."},
 pros:[{en:"No crossover in either direction, so the groups get the generator temperature and the generator gets the group return.",uk:"Перетоку немає в жоден бік: групи отримують температуру генератора, генератор — зворотну груп.",de:"Kein Übertritt in beide Richtungen: die Gruppen erhalten die Erzeugertemperatur, der Erzeuger den Gruppenrücklauf.",nl:"Geen overstroming in beide richtingen: de groepen krijgen de opwekkertemperatuur en omgekeerd.",fr:"Aucun transfert : les groupes reçoivent la température générateur et inversement.",es:"Sin trasvase: los grupos reciben la temperatura del generador y viceversa.",pl:"Brak krzyżowania w żadnym kierunku, więc grupy otrzymują temperaturę generatora, a generator otrzymuje sygnał powrótny grupy."},
  {en:"The cleanest possible starting point for commissioning, because there is nothing hidden to explain a mismatch.",uk:"Найчистіша відправна точка для налагодження: немає нічого прихованого, чим пояснити розбіжність.",de:"Der sauberste Ausgangspunkt für die Inbetriebnahme, weil nichts Verstecktes eine Abweichung erklärt.",nl:"Het schoonste startpunt voor inregelen, omdat niets verborgen een afwijking verklaart.",fr:"Le point de départ le plus propre pour la mise en service.",es:"El punto de partida más limpio para la puesta en marcha.",pl:"Najczystszy punkt wyjścia do uruchomienia, ponieważ nie ma w nim niczego ukrytego, co mogłoby wyjaśnić niezgodność."}],
 cons:[{en:"Only holds at one operating point; it is a design intent, not a device.",uk:"Тримається лише в одній робочій точці; це проектний намір, а не пристрій.",de:"Gilt nur in einem Betriebspunkt; es ist eine Entwurfsabsicht, kein Gerät.",nl:"Geldt maar in één werkpunt; het is een ontwerpintentie, geen apparaat.",fr:"Ne tient qu’à un point de fonctionnement ; c’est une intention, pas un organe.",es:"Solo se cumple en un punto; es una intención de diseño, no un dispositivo.",pl:"Dotyczy tylko jednego punktu operacyjnego; jest to zamierzenie projektowe, a nie urządzenie."},
  {en:"Gives none of the safety net a header gives when someone changes a pump or a setting later.",uk:"Не дає жодної страховки, яку дає розподільник, коли хтось потім змінить насос чи налаштування.",de:"Bietet keinerlei Sicherheitsnetz, wenn später jemand Pumpe oder Einstellung ändert.",nl:"Biedt geen vangnet als iemand later een pomp of instelling wijzigt.",fr:"N’offre aucun filet de sécurité si l’on change une pompe plus tard.",es:"No da red de seguridad si alguien cambia una bomba después.",pl:"Nie daje żadnej siatki bezpieczeństwa, jaką daje kolektor, gdy ktoś później zmieni pompę lub ustawienie."}],
 comm:[{en:"Balance both sides to the same flow, then confirm the supply temperature at the manifold equals the generator supply.",uk:"Збалансуйте обидві сторони на однакову витрату, потім переконайтеся, що подача на колекторі дорівнює подачі генератора.",de:"Beide Seiten auf denselben Strom abgleichen und prüfen, dass die Verteilertemperatur der Erzeugertemperatur entspricht.",nl:"Balanceer beide zijden op hetzelfde debiet en controleer dat de verdelertemperatuur gelijk is aan de opwekkeraanvoer.",fr:"Équilibrer les deux côtés au même débit et vérifier l’égalité des températures.",es:"Equilibre ambos lados al mismo caudal y compruebe la igualdad de temperaturas.",pl:"Wyrównaj obie strony, aby uzyskać taki sam przepływ, a następnie sprawdź, czy temperatura zasilania w kolektorze jest równa temperaturze zasilania generatora."}],
 kit:{en:"Balancing valves on every branch, test points on the manifold, and a written note that the design assumes constant flow.",uk:"Балансувальні клапани на кожній гілці, точки замірів на колекторі й письмова примітка, що проект передбачає сталу витрату.",de:"Einregulierventile in jedem Zweig, Messpunkte am Verteiler und ein schriftlicher Vermerk zur Konstantstrom-Annahme.",nl:"Inregelafsluiters op elke tak, meetpunten op de verdeler en een schriftelijke notitie over de constant-debietaanname.",fr:"Vannes d’équilibrage sur chaque branche, prises sur le collecteur, et une note écrite sur l’hypothèse de débit constant.",es:"Válvulas de equilibrado en cada ramal, tomas en el colector y nota escrita sobre la hipótesis de caudal constante.",pl:"Zawory równoważące na każdej gałęzi, punkty pomiarowe na rozdzielaczu i pisemna notatka, że ​​projekt zakłada stały przepływ."}},

{id:"C4",cat:"C",model:"plate",selfPumped:false,solves:["p6","p8"],creates:["p2"],
 name:{en:"Full separation by plate heat exchanger",uk:"Повна розв’язка пластинчастим теплообмінником",de:"Vollständige Trennung durch Plattenwärmeübertrager",nl:"Volledige scheiding met platenwisselaar",fr:"Séparation complète par échangeur à plaques",es:"Separación total por intercambiador de placas",pl:"Pełne oddzielenie za pomocą płytowego wymiennika ciepła"},
 one:{en:"The two circuits share heat but no water at all, so pressure, treatment and fluid can differ on each side.",uk:"Контури ділять тепло, але не воду: тиск, водопідготовка й сам теплоносій можуть різнитися.",de:"Beide Kreise teilen Wärme, aber kein Wasser: Druck, Aufbereitung und Medium dürfen sich unterscheiden.",nl:"Beide kringen delen warmte maar geen water: druk, behandeling en medium mogen verschillen.",fr:"Les deux circuits partagent la chaleur mais pas l’eau : pression, traitement et fluide peuvent différer.",es:"Ambos circuitos comparten calor pero no agua: presión, tratamiento y fluido pueden diferir.",pl:"Oba obiegi dzielą się ciepłem, ale nie dzielą się wodą, więc ciśnienie, obróbka i płyn mogą się różnić po każdej stronie."},
 yes:{en:"District heating connections, tall buildings where the static head differs, and glycol circuits that must not reach the rest of the system.",uk:"Приєднання до теплових мереж, високі будівлі з різним статичним напором і гліколеві контури, які не повинні потрапити далі.",de:"Fernwärmeanschlüsse, hohe Gebäude mit unterschiedlichem statischem Druck und Glykolkreise, die nicht weiter dürfen.",nl:"Stadsverwarmingsaansluitingen, hoge gebouwen met verschillende statische druk en glycolkringen die niet verder mogen.",fr:"Raccordements au réseau de chaleur, immeubles hauts à charge statique différente, circuits glycolés à confiner.",es:"Acometidas de red de calor, edificios altos con distinta presión estática y circuitos con glicol a confinar.",pl:"Połączenia sieci ciepłowniczej, wysokie budynki o różnym ciśnieniu statycznym oraz obiegi glikolu, które nie mogą dotrzeć do reszty systemu."},
 no:{en:"Where you cannot afford the temperature you lose across it, or a simple header would have done the job.",uk:"Там, де не можна дозволити собі втрату температури на ньому, або де вистачило б простого розподільника.",de:"Wo die Temperaturdifferenz über ihn nicht tragbar ist oder eine einfache Weiche gereicht hätte.",nl:"Waar het temperatuurverlies niet aanvaardbaar is, of een gewone verdeler had volstaan.",fr:"Là où la perte de température est inacceptable, ou une simple bouteille aurait suffi.",es:"Donde no se pueda asumir la pérdida de temperatura, o bastara una botella.",pl:"Jeśli nie możesz sobie pozwolić na utratę temperatury, wówczas wystarczyłby prosty kolektor."},
 pros:[{en:"Absolute decoupling: no crossover, no shared pressure, no shared dirt.",uk:"Абсолютна розв’язка: ні перетоку, ні спільного тиску, ні спільного бруду.",de:"Absolute Entkopplung: kein Übertritt, kein gemeinsamer Druck, kein gemeinsamer Schmutz.",nl:"Absolute ontkoppeling: geen overstroming, geen gedeelde druk, geen gedeeld vuil.",fr:"Découplage absolu : aucun transfert, ni pression ni saletés partagées.",es:"Desacoplo absoluto: sin trasvase, ni presión ni suciedad compartidas.",pl:"Całkowite odsprzęgnięcie: brak crossovera, brak wspólnego ciśnienia, brak wspólnego brudu."},
  {en:"Lets each side be designed, filled and treated on its own terms.",uk:"Дозволяє проектувати, заповнювати й обробляти кожну сторону за власними правилами.",de:"Erlaubt, jede Seite eigenständig auszulegen, zu befüllen und aufzubereiten.",nl:"Laat elke zijde apart ontwerpen, vullen en behandelen.",fr:"Permet de concevoir, remplir et traiter chaque côté séparément.",es:"Permite diseñar, llenar y tratar cada lado por separado.",pl:"Pozwól, aby każda strona była zaprojektowana, wypełniona i potraktowana na własnych zasadach."}],
 cons:[{en:"Every kelvin of approach temperature is a kelvin the generator has to make up, and on a heat pump that is paid for in COP.",uk:"Кожен кельвін температурного напору генератор має надолужити, а на тепловому насосі це оплачується COP.",de:"Jedes Kelvin Grädigkeit muss der Erzeuger zusätzlich erzeugen — bei einer Wärmepumpe bezahlt mit COP.",nl:"Elke kelvin temperatuurverschil moet de opwekker extra maken — bij een warmtepomp betaald in COP.",fr:"Chaque kelvin d’approche est à produire en plus — sur une PAC, payé en COP.",es:"Cada kelvin de aproximación lo paga el generador — en bomba de calor, en COP.",pl:"Każdy kelwin temperatury zbliżeniowej to kelwin, który generator musi wytworzyć, a w przypadku pompy ciepła jest to opłacane w COP."},
  {en:"Two pumps, two expansion vessels, two fill points and two sets of safety devices.",uk:"Два насоси, два розширювальні баки, дві точки заповнення й два комплекти запобіжної арматури.",de:"Zwei Pumpen, zwei Ausdehnungsgefäße, zwei Füllpunkte, zwei Sicherheitsgruppen.",nl:"Twee pompen, twee expansievaten, twee vulpunten en twee veiligheidsgroepen.",fr:"Deux pompes, deux vases, deux points de remplissage, deux groupes de sécurité.",es:"Dos bombas, dos vasos, dos puntos de llenado y dos grupos de seguridad.",pl:"Dwie pompy, dwa naczynia wzbiorcze, dwa punkty napełniania i dwa zestawy urządzeń zabezpieczających."},
  {en:"Fouling raises the approach silently over the years, and nobody measures it until something stops performing.",uk:"Забруднення роками тихо піднімає напор, і ніхто його не міряє, поки щось не перестане працювати.",de:"Verschmutzung hebt die Grädigkeit über Jahre still an; niemand misst sie, bis etwas nicht mehr leistet.",nl:"Vervuiling verhoogt het verschil jarenlang stilletjes; niemand meet het tot iets niet meer presteert.",fr:"L’encrassement augmente l’approche en silence pendant des années.",es:"El ensuciamiento eleva la aproximación en silencio durante años.",pl:"Zanieczyszczenia narastają po cichu przez lata i nikt nie mierzy ich skuteczności, dopóki coś nie przestanie działać."}],
 comm:[{en:"Record the approach temperature at commissioning at a known duty; it is the only baseline you will ever have for fouling.",uk:"Запишіть температурний напір під час налагодження за відомої потужності: це єдина база для оцінки забруднення.",de:"Die Grädigkeit bei bekannter Leistung zur Inbetriebnahme protokollieren; die einzige Basislinie für Verschmutzung.",nl:"Leg het temperatuurverschil bij oplevering vast bij bekend vermogen; de enige nullijn voor vervuiling.",fr:"Consigner l’approche à la réception à puissance connue ; seule référence pour l’encrassement.",es:"Registre la aproximación en la recepción a potencia conocida; la única referencia frente al ensuciamiento.",pl:"Zanotuj temperaturę podejścia podczas rozruchu przy znanym obciążeniu; jest to jedyna wartość odniesienia, jaką będziesz mieć do określenia stopnia zabrudzenia."},
  {en:"Balance both sides separately — the exchanger will not tell you which side is starved.",uk:"Балансуйте кожну сторону окремо: теплообмінник не скаже, якій із них бракує витрати.",de:"Beide Seiten getrennt abgleichen — der Übertrager verrät nicht, welche Seite zu wenig bekommt.",nl:"Balanceer beide zijden apart — de wisselaar vertelt niet welke zijde tekortkomt.",fr:"Équilibrer les deux côtés séparément — l’échangeur ne dira pas lequel manque de débit.",es:"Equilibre ambos lados por separado — el intercambiador no dirá cuál va escaso.",pl:"Zbilansuj obie strony osobno — wymiennik nie powie Ci, która strona jest głodna."}],
 kit:{en:"Plate heat exchanger, a pump and an expansion vessel on each side, strainers, and test points on all four connections. The exchanger itself is sized by the heat-exchanger tool on this site, not here.",uk:"Пластинчастий теплообмінник, насос і розширювальний бак з кожного боку, фільтри й точки замірів на всіх чотирьох приєднаннях. Сам теплообмінник підбирає інша тулза цього сайта.",de:"Plattenwärmeübertrager, je Seite Pumpe und Ausdehnungsgefäß, Schmutzfänger und Messpunkte an allen vier Anschlüssen. Die Auslegung selbst macht das Wärmeübertrager-Werkzeug dieser Website.",nl:"Platenwisselaar, per zijde pomp en expansievat, vuilvangers en meetpunten op alle vier aansluitingen. De wisselaar zelf wordt door de andere tool van deze site gedimensioneerd.",fr:"Échangeur à plaques, pompe et vase de chaque côté, filtres, prises sur les quatre raccords. Le dimensionnement se fait avec l’outil échangeurs de ce site.",es:"Intercambiador de placas, bomba y vaso en cada lado, filtros y tomas en las cuatro conexiones. El dimensionado lo hace la herramienta de intercambiadores de este sitio.",pl:"Płytowy wymiennik ciepła, pompa i naczynie wzbiorcze po obu stronach, filtry siatkowe oraz punkty pomiarowe na wszystkich czterech przyłączach. Sam wymiennik jest dobierany na podstawie narzędzia do pomiaru wymiennika ciepła dostępnego na tej stronie, a nie tutaj."}},

{id:"D1",cat:"D",model:"pump",pumpMode:"fixed",selfPumped:true,solves:[],creates:["p9"],
 name:{en:"Fixed-speed pump",uk:"Нерегульований насос",de:"Ungeregelte Pumpe",nl:"Ongeregelde pomp",fr:"Pompe à vitesse fixe",es:"Bomba de velocidad fija",pl:"Pompa o stałej prędkości"},
 one:{en:"The pump runs at one speed and simply rides up its own curve as the control valves close.",uk:"Насос крутиться на одних обертах і просто повзе вгору власною кривою, поки клапани закриваються.",de:"Die Pumpe läuft mit einer Drehzahl und wandert einfach ihre Kennlinie hinauf, während die Ventile schließen.",nl:"De pomp draait op één toerental en klimt gewoon zijn eigen curve op terwijl de afsluiters sluiten.",fr:"La pompe tourne à vitesse unique et remonte simplement sa courbe pendant que les vannes ferment.",es:"La bomba gira a una sola velocidad y sube por su curva mientras cierran las válvulas.",pl:"Pompa pracuje z jedną prędkością i po prostu zwiększa swoją prędkość, gdy zawory sterujące się zamykają."},
 yes:{en:"Small constant-flow circuits — a boiler shunt, a short primary loop — where there is nothing to regulate.",uk:"Малі контури зі сталою витратою — котловий шунт, короткий первинний контур, — де нема чого регулювати.",de:"Kleine Konstantstromkreise — Kesselshunt, kurzer Primärkreis — wo es nichts zu regeln gibt.",nl:"Kleine constant-debietkringen — ketelshunt, korte primaire kring — waar niets te regelen valt.",fr:"Petites boucles à débit constant — shunt chaudière, primaire court — où il n’y a rien à réguler.",es:"Lazos pequeños de caudal constante — shunt de caldera, primario corto — donde no hay nada que regular.",pl:"Małe obwody o stałym przepływie — bocznik kotła, krótka pętla pierwotna — w których nie ma niczego, co można regulować."},
 no:{en:"On any distribution circuit with two-way valves. As they close, the differential pressure climbs, valve authority collapses and the system gets noisy.",uk:"У будь-якому розподільному контурі з двоходовими клапанами: коли вони закриваються, перепад росте, авторитет падає, система шумить.",de:"In jedem Verteilkreis mit Durchgangsventilen: beim Schließen steigt das Druckgefälle, die Autorität bricht ein, die Anlage wird laut.",nl:"In elk distributiecircuit met tweewegafsluiters: bij sluiten stijgt het drukverschil, de autoriteit stort in, de installatie gaat lawaai maken.",fr:"Sur tout circuit à vannes deux voies : en fermant, la pression monte, l’autorité s’effondre, ça devient bruyant.",es:"En cualquier circuito con válvulas de dos vías: al cerrar sube la presión, cae la autoridad y aparece ruido.",pl:"W każdym obwodzie dystrybucyjnym z zaworami dwudrożnymi. Gdy się zamykają, różnica ciśnień rośnie, autorytet zaworów spada, a system staje się hałaśliwy."},
 pros:[{en:"Cheapest pump on the shelf and the simplest thing in the plant room.",uk:"Найдешевший насос на полиці й найпростіша річ у теплопункті.",de:"Die billigste Pumpe im Regal und das Einfachste im Heizraum.",nl:"De goedkoopste pomp en het simpelste in de ruimte.",fr:"La pompe la moins chère et la chose la plus simple du local.",es:"La bomba más barata y lo más simple de la sala.",pl:"Najtańsza pompa na półce i najprostsza rzecz w pomieszczeniu technicznym."},
  {en:"Nothing to configure, so nothing to configure wrongly.",uk:"Нічого налаштовувати — отже, нічого налаштувати неправильно.",de:"Nichts einzustellen, also nichts falsch einzustellen.",nl:"Niets in te stellen, dus niets verkeerd in te stellen.",fr:"Rien à paramétrer, donc rien à mal paramétrer.",es:"Nada que configurar, así que nada que configurar mal.",pl:"Nic do skonfigurowania, więc nic do błędnej konfiguracji."}],
 cons:[{en:"Wastes the most energy of any option here at part load, which is where the system spends its life.",uk:"Марнує найбільше енергії з усіх варіантів за часткового навантаження — а саме там система й живе.",de:"Verschwendet im Teillastbetrieb die meiste Energie — und dort verbringt die Anlage ihr Leben.",nl:"Verspilt bij deellast de meeste energie — en daar leeft de installatie.",fr:"Gaspille le plus d’énergie à charge partielle, là où le système passe sa vie.",es:"Derrocha más energía a carga parcial, que es donde vive el sistema.",pl:"Marnuje najwięcej energii ze wszystkich dostępnych opcji przy częściowym obciążeniu, czyli w tym okresie system spędza cały swój cykl życia."},
  {en:"Rising differential pressure destroys the authority of the very valves it is feeding.",uk:"Зростання перепаду руйнує авторитет саме тих клапанів, які він живить.",de:"Das steigende Druckgefälle zerstört die Autorität genau der Ventile, die es speist.",nl:"Het stijgende drukverschil vernietigt de autoriteit van juist die afsluiters.",fr:"La pression croissante détruit l’autorité des vannes qu’elle alimente.",es:"La presión creciente destruye la autoridad de las mismas válvulas que alimenta.",pl:"Rosnąca różnica ciśnień niszczy autorytet zaworów, które zasila."}],
 comm:[{en:"Check the duty point at full flow against the pump curve, then check it again with the valves closed — that second point is the one that hurts.",uk:"Звірте робочу точку за повної витрати з кривою, потім ще раз за закритих клапанів — саме друга точка й болить.",de:"Betriebspunkt bei Volllast mit der Kennlinie abgleichen, dann erneut bei geschlossenen Ventilen — der zweite Punkt tut weh.",nl:"Vergelijk het werkpunt bij vol debiet met de curve, en opnieuw met de afsluiters dicht — dat tweede punt doet pijn.",fr:"Comparer le point à plein débit à la courbe, puis vannes fermées — c’est le second qui fait mal.",es:"Compare el punto a pleno caudal con la curva, y otra vez con válvulas cerradas — ese segundo duele.",pl:"Sprawdź punkt pracy przy pełnym przepływie w porównaniu z krzywą pompy, a następnie sprawdź go ponownie przy zamkniętych zaworach — ten drugi punkt jest tym, który sprawia problemy."}],
 kit:{en:"One uncontrolled circulator; pressure test points either side of it.",uk:"Один нерегульований насос; манометричні точки з обох боків.",de:"Eine ungeregelte Umwälzpumpe; Druckmesspunkte beiderseits.",nl:"Eén ongeregelde circulatiepomp; drukmeetpunten aan weerszijden.",fr:"Un circulateur non régulé ; prises de pression de part et d’autre.",es:"Un circulador no regulado; tomas de presión a ambos lados.",pl:"Jeden niekontrolowany obieg; punkty pomiaru ciśnienia po obu jego stronach."}},

{id:"D2",cat:"D",model:"pump",pumpMode:"constant-dp",selfPumped:true,solves:["p9"],creates:[],
 name:{en:"Constant differential pressure",uk:"Постійний перепад тиску",de:"Konstantdruckregelung",nl:"Constant drukverschil",fr:"Pression différentielle constante",es:"Presión diferencial constante",pl:"Stała różnica ciśnień"},
 one:{en:"The pump varies its speed to hold the same differential pressure whatever the flow.",uk:"Насос змінює оберти, щоб тримати той самий перепад за будь-якої витрати.",de:"Die Pumpe regelt die Drehzahl so, dass das Druckgefälle bei jedem Strom gleich bleibt.",nl:"De pomp varieert het toerental om hetzelfde drukverschil te houden bij elk debiet.",fr:"La pompe ajuste sa vitesse pour tenir la même pression différentielle à tout débit.",es:"La bomba varía su velocidad para mantener la misma presión a cualquier caudal.",pl:"Pompa zmienia swoją prędkość, aby utrzymać tę samą różnicę ciśnień bez względu na przepływ."},
 yes:{en:"Circuits whose resistance sits mostly in the terminal units and their valves rather than in long distribution pipework.",uk:"Контури, де опір зосереджений здебільшого в кінцевих приладах і їхніх клапанах, а не в довгих магістралях.",de:"Kreise, deren Widerstand überwiegend in den Endgeräten und deren Ventilen liegt, nicht in langen Leitungen.",nl:"Kringen waarvan de weerstand vooral in de eindtoestellen en hun afsluiters zit, niet in lange leidingen.",fr:"Circuits dont la résistance est surtout dans les unités terminales, pas dans de longues canalisations.",es:"Circuitos cuya resistencia está sobre todo en las unidades terminales, no en tuberías largas.",pl:"Obwody, których rezystancja znajduje się głównie w jednostkach końcowych i ich zaworach, a nie w długich rurociągach dystrybucyjnych."},
 no:{en:"On long distribution runs where most of the pressure is spent on friction that disappears when the flow drops.",uk:"На довгих магістралях, де більшість тиску йде на тертя, яке зникає зі спадом витрати.",de:"Bei langen Verteilstrecken, wo der Druck überwiegend in Reibung geht, die mit dem Strom verschwindet.",nl:"Bij lange distributietracés waar de meeste druk in wrijving gaat die met het debiet verdwijnt.",fr:"Sur de longues distributions où la pression sert surtout au frottement qui disparaît avec le débit.",es:"En distribuciones largas donde la presión se gasta en fricción que desaparece con el caudal.",pl:"W przypadku długich odcinków dystrybucji, gdzie większość ciśnienia jest przeznaczana na tarcie, które zanika, gdy przepływ spada."},
 pros:[{en:"Cuts pump energy substantially against a fixed-speed pump, with a setting anyone can understand.",uk:"Помітно ріже енергію насоса проти нерегульованого, з налаштуванням, яке зрозуміє будь-хто.",de:"Senkt die Pumpenenergie deutlich gegenüber ungeregelt, mit einer für jeden verständlichen Einstellung.",nl:"Snijdt de pompenergie fors terug tegenover ongeregeld, met een voor iedereen begrijpelijke instelling.",fr:"Réduit nettement l’énergie de pompage, avec un réglage compréhensible par tous.",es:"Reduce mucho la energía de bombeo, con un ajuste que cualquiera entiende.",pl:"Znacznie obniża zużycie energii przez pompę w porównaniu do pompy o stałej prędkości, a ustawienia są zrozumiałe dla każdego."},
  {en:"Holds the differential the valves see, so their authority stays where you designed it.",uk:"Тримає перепад, який бачать клапани, тож їхній авторитет лишається проектним.",de:"Hält das Druckgefälle an den Ventilen, ihre Autorität bleibt wie ausgelegt.",nl:"Houdt het drukverschil bij de afsluiters, zodat hun autoriteit blijft zoals ontworpen.",fr:"Maintient l’écart vu par les vannes : leur autorité reste celle prévue.",es:"Mantiene la presión que ven las válvulas: su autoridad sigue siendo la de diseño.",pl:"Utrzymuje różnicę między zaworami, więc ich autorytet pozostaje taki, jaki zaprojektowałeś."}],
 cons:[{en:"On a friction-dominated circuit it holds a pressure that is no longer needed, and gives away most of the possible saving.",uk:"У контурі з переважанням тертя тримає тиск, який уже не потрібен, і віддає більшу частину можливої економії.",de:"In einem reibungsdominierten Kreis hält es einen nicht mehr nötigen Druck und verschenkt den Großteil der Einsparung.",nl:"In een wrijvingsgedomineerde kring houdt het een niet meer nodige druk vast en geeft de meeste besparing weg.",fr:"Sur un circuit dominé par le frottement, il maintient une pression inutile et perd l’essentiel du gain.",es:"En un circuito dominado por fricción mantiene presión innecesaria y pierde casi todo el ahorro.",pl:"W obwodach, w których dominuje tarcie, utrzymuje ciśnienie, które nie jest już potrzebne, i traci większość możliwych oszczędności."}],
 comm:[{en:"Set the pressure from the index circuit at design flow, not from the pump's factory default.",uk:"Задавайте тиск за найневигіднішим контуром на розрахунковій витраті, а не за заводською уставкою насоса.",de:"Den Sollwert aus dem ungünstigsten Kreis beim Auslegungsstrom bestimmen, nicht aus der Werkseinstellung.",nl:"Stel de druk in vanuit de maatgevende kring bij ontwerpdebiet, niet vanuit de fabrieksinstelling.",fr:"Régler la pression d’après le circuit le plus défavorisé au débit nominal, pas d’après l’usine.",es:"Ajuste la presión según el circuito más desfavorable a caudal de diseño, no según fábrica.",pl:"Ustaw ciśnienie z obwodu indeksowego na poziomie przepływu projektowego, a nie na podstawie domyślnej wartości fabrycznej pompy."}],
 kit:{en:"Speed-controlled circulator with an internal or remote differential pressure sensor.",uk:"Насос з регульованими обертами з вбудованим або виносним датчиком перепаду.",de:"Drehzahlgeregelte Pumpe mit internem oder externem Differenzdrucksensor.",nl:"Toerengeregelde pomp met interne of externe drukverschilopnemer.",fr:"Circulateur à vitesse variable avec capteur de pression différentielle interne ou déporté.",es:"Circulador de velocidad variable con sensor de presión diferencial interno o remoto.",pl:"Pompa obiegowa z regulacją prędkości i wewnętrznym lub zdalnym czujnikiem różnicy ciśnień."}},

{id:"D3",cat:"D",model:"pump",pumpMode:"proportional-dp",selfPumped:true,solves:["p9"],creates:[],
 name:{en:"Proportional differential pressure",uk:"Пропорційний перепад тиску",de:"Proportionaldruckregelung",nl:"Proportioneel drukverschil",fr:"Pression différentielle proportionnelle",es:"Presión diferencial proporcional",pl:"Proporcjonalna różnica ciśnień"},
 one:{en:"The set pressure falls with the flow along a straight line, ending at half the design head when the flow reaches zero.",uk:"Задане значення тиску падає з витратою по прямій і на нульовій витраті дорівнює половині розрахункового напору.",de:"Der Sollwert fällt linear mit dem Strom und beträgt bei Nullstrom die Hälfte der Auslegungsförderhöhe.",nl:"De ingestelde druk daalt lineair met het debiet en is bij nul debiet de helft van de ontwerpopvoerhoogte.",fr:"La consigne baisse linéairement avec le débit et vaut la moitié de la hauteur nominale à débit nul.",es:"La consigna baja linealmente con el caudal y a caudal nulo vale la mitad de la altura de diseño.",pl:"Nastawione ciśnienie spada wraz z przepływem wzdłuż linii prostej i kończy się na połowie wysokości podnoszenia, gdy przepływ osiąga zero."},
 yes:{en:"Distribution circuits with long runs, where a large share of the design head is friction that vanishes as the flow falls.",uk:"Розподільні контури з довгими ділянками, де більша частка розрахункового напору — тертя, що зникає зі спадом витрати.",de:"Verteilkreise mit langen Strecken, in denen ein großer Teil der Förderhöhe Reibung ist, die mit dem Strom verschwindet.",nl:"Distributiekringen met lange tracés, waar een groot deel van de opvoerhoogte wrijving is die met het debiet verdwijnt.",fr:"Circuits de distribution longs, où une grande part de la hauteur est du frottement qui disparaît.",es:"Circuitos de distribución largos, donde gran parte de la altura es fricción que desaparece.",pl:"Układy dystrybucyjne o długich odcinkach, w których znaczną część projektowanego ciśnienia stanowi tarcie zanikające w miarę spadku przepływu."},

/* ---------- параметрические схемы ----------
 * Рисуются с нуля примитивами. Порядок жёсткий: сначала все трубы,
 * потом вся арматура, потом все подписи — чтобы линия никогда не
 * перечёркивала символ насоса или клапана.
 * Насос всегда ориентирован ПО ПОТОКУ: направление задаётся явно.
 */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const F1 = x => (x == null || !isFinite(x)) ? "—" : x.toFixed(1);
const F2 = x => (x == null || !isFinite(x)) ? "—" : x.toFixed(2);
const F3 = x => (x == null || !isFinite(x)) ? "—" : x.toFixed(3);

function pipeColor(t, lo, hi){
  if (t == null || !isFinite(t)) return "#8a94a6";
  const f = Math.max(0, Math.min(1, (t - lo) / Math.max(1e-9, hi - lo)));
  const st = [[3,105,161],[2,132,199],[234,154,62],[194,65,12]];
  const x = f * (st.length - 1), i = Math.min(st.length - 2, Math.floor(x)), u = x - i;
  const c = st[i].map((v,k) => Math.round(v + u * (st[i+1][k] - v)));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

/* Углы поворота символа по направлению потока. */
const DIR = {right:0, down:90, left:180, up:270};

const G = {
  /* Труба. Разрыв под символ делается тем, что труба рисуется до и после. */
  pipe:(x1,y1,x2,y2,col,arrow)=>
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="3.4"
      stroke-linecap="round"${arrow?' marker-end="url(#arw)"':''}/>`,
  box:(x,y,w,h,label,sub)=>
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="var(--panel)"
      stroke="var(--ink)" stroke-width="1.7"/>
     <text x="${x+w/2}" y="${y+h/2+(sub?-2:4)}" text-anchor="middle" font-size="12"
      font-weight="600" fill="var(--ink)">${esc(label)}</text>
     ${sub?`<text x="${x+w/2}" y="${y+h/2+13}" text-anchor="middle" font-size="10"
      fill="var(--muted)">${esc(sub)}</text>`:""}`,

  /* Насос: круг с треугольником, повёрнутым ПО НАПРАВЛЕНИЮ ПОТОКА.
     Круг непрозрачный, поэтому труба под ним не просвечивает. */
  pump:(x,y,dir,on=true,label)=>
    `<g transform="translate(${x} ${y}) rotate(${DIR[dir]??0})">
       <circle r="11.5" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.8"/>
       <path d="M-4.5 -6 L7 0 L-4.5 6 Z" fill="${on?"var(--accent)":"var(--muted)"}"/>
     </g>${label?`<text x="${x}" y="${y+25}" text-anchor="middle" font-size="9.5"
      fill="var(--muted)">${esc(label)}</text>`:""}`,

  /* Двухходовой регулирующий клапан: две встречные треугольные тарелки
     плюс шток и привод сверху. Ориентация — вдоль трубы. */
  v2:(x,y,dir,label)=>
    `<g transform="translate(${x} ${y}) rotate(${DIR[dir]??0})">
       <path d="M-10 -8.5 L-10 8.5 L0 0 Z M10 -8.5 L10 8.5 L0 0 Z"
         fill="var(--panel)" stroke="var(--ink)" stroke-width="1.7"/>
       <line x1="0" y1="-8.5" x2="0" y2="-17" stroke="var(--ink)" stroke-width="1.7"/>
       <rect x="-7.5" y="-25" width="15" height="9" rx="2" fill="var(--panel)"
         stroke="var(--ink)" stroke-width="1.5"/>
     </g>${label?`<text x="${x}" y="${y+26}" text-anchor="middle" font-size="9.5"
      fill="var(--muted)">${esc(label)}</text>`:""}`,

  /* Трёхходовой: три тарелки, третья смотрит на боковой патрубок. */
  v3:(x,y,dir,label,side="down")=>
    `<g transform="translate(${x} ${y}) rotate(${DIR[dir]??0})">
       <path d="M-10 -8.5 L-10 8.5 L0 0 Z M10 -8.5 L10 8.5 L0 0 Z"
         fill="var(--panel)" stroke="var(--ink)" stroke-width="1.7"/>
       <path d="${side==="down"?"M-8.5 17 L8.5 17 L0 0 Z":"M-8.5 -17 L8.5 -17 L0 0 Z"}"
         fill="var(--panel)" stroke="var(--ink)" stroke-width="1.7"/>
       <line x1="0" y1="-8.5" x2="0" y2="-17" stroke="var(--ink)" stroke-width="1.7"
         opacity="${side==="down"?1:0}"/>
     </g>${label?`<text x="${x+17}" y="${y-13}" text-anchor="start" font-size="9.5"
      fill="var(--muted)">${esc(label)}</text>`:""}`,

  /* Балансировочный клапан: контурные тарелки с маховиком. */
  bal:(x,y,dir,label)=>
    `<g transform="translate(${x} ${y}) rotate(${DIR[dir]??0})">
       <circle r="10" fill="var(--panel)" stroke="none"/>
       <path d="M-9 -7.5 L-9 7.5 L0 0 Z M9 -7.5 L9 7.5 L0 0 Z"
         fill="none" stroke="var(--ink)" stroke-width="1.6"/>
       <line x1="0" y1="-7.5" x2="0" y2="-14" stroke="var(--ink)" stroke-width="1.6"/>
       <line x1="-6.5" y1="-14" x2="6.5" y2="-14" stroke="var(--ink)" stroke-width="1.8"/>
     </g>${label?`<text x="${x}" y="${y+23}" text-anchor="middle" font-size="9.5"
      fill="var(--muted)">${esc(label)}</text>`:""}`,

  /* Обратный клапан. */
  chk:(x,y,dir)=>
    `<g transform="translate(${x} ${y}) rotate(${DIR[dir]??0})">
       <circle r="9.5" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.6"/>
       <path d="M-4 -5.5 L5.5 0 L-4 5.5" fill="none" stroke="var(--ink)"
         stroke-width="1.7" stroke-linejoin="round"/>
     </g>`,

  /* Термостат/датчик на трубе. */
  sens:(x,y,label)=>
    `<g transform="translate(${x} ${y})">
       <circle r="8.5" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5"/>
       <path d="M0 -4 v6" stroke="var(--ink)" stroke-width="1.6"/>
       <circle cy="4" r="2.6" fill="var(--ink)"/>
     </g>${label?`<text x="${x}" y="${y-13}" text-anchor="middle" font-size="9.5"
      fill="var(--muted)">${esc(label)}</text>`:""}`,

  /* Точка замера температуры со значением. */
  tp:(x,y,label,val)=>
    `<circle cx="${x}" cy="${y}" r="9" fill="var(--panel)" stroke="var(--accent)" stroke-width="1.5"/>
     <text x="${x}" y="${y+3.4}" text-anchor="middle" font-size="8.5" font-weight="700"
      fill="var(--accent)">${esc(label)}</text>
     ${val!=null?`<text x="${x}" y="${y-14}" text-anchor="middle" font-size="10.5"
      font-weight="650" fill="var(--ink)">${esc(val)}</text>`:""}`,

  txt:(x,y,s,anchor,size,col)=>
    `<text x="${x}" y="${y}" text-anchor="${anchor||"start"}" font-size="${size||10}"
      fill="${col||"var(--muted)"}">${esc(s)}</text>`
};

function svgWrap(pipes, parts, labels, w=560, h=262){
  return `<svg viewBox="0 0 ${w} ${h}" role="img" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5"
    orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
  ${pipes.join("")}${parts.join("")}${labels.join("")}</svg>`;
}

/* Геометрия, общая для всех схем контуров. */
const LY = {ys:44, yr:206, xg:16, wg:78, xc:404, wc:112, ybox:104, hbox:56};

function drawCircuit(model, st, L, lo, hi){
  const c = t => pipeColor(t, lo, hi);
  const q = m => (m==null||!isFinite(m)) ? "—" : F2(kgs_to_m3h(m, 60)) + " m³/h";
  const P=[], A=[], T=[];                       // трубы, арматура, подписи
  const {ys,yr,xg,wg,xc,wc,ybox,hbox} = LY;
  const xgc = xg + wg/2, xcc = xc + wc/2;

  const genBox = () => A.push(G.box(xg, ybox, wg, hbox, L.gen, L.genKind));
  const conBox = () => A.push(G.box(xc, ybox, wc, hbox, L.con, L.emit));
  const rails = (tSup, tRet, xEnd) => {
    P.push(G.pipe(xgc, ybox, xgc, ys, c(tSup)), G.pipe(xgc, ys, xEnd, ys, c(tSup), true));
    P.push(G.pipe(xgc, ybox+hbox, xgc, yr, c(tRet)), G.pipe(xEnd, yr, xgc, yr, c(tRet), true));
  };

  if (model === "throttle" || model === "throttle-premix"){
    genBox(); conBox();
    rails(st.t1, st.t4, 250);
    P.push(G.pipe(250, ys, xcc, ys, c(st.t2), true), G.pipe(xcc, ys, xcc, ybox, c(st.t2), true));
    P.push(G.pipe(xcc, ybox+hbox, xcc, yr, c(st.t3)), G.pipe(xcc, yr, 250, yr, c(st.t3), true));
    A.push(G.v2(250, ys, "right", "control valve"));
    A.push(G.bal(330, yr, "left", "balancing"));
    if (model === "throttle-premix"){
      P.push(G.pipe(374, ys, 374, yr, c(st.t3)));
      A.push(G.bal(374, 150, "up", "premix"));
      A.push(G.pump(374, ys, "right", true));
      T.push(G.txt(374, 246, L.premix, "middle"));
    }
    T.push(G.tp(170, ys, "T1", F1(st.t1)+"°"), G.tp(300, ys, "T2", F1(st.t2)+"°"));
    T.push(G.tp(xcc, 176, "T3", F1(st.t3)+"°"), G.tp(170, yr, "T4", F1(st.t4)+"°"));
    T.push(G.txt(110, ys-14, q(st.qvp), "middle"), G.txt(110, yr+22, q(st.qvp), "middle"));
  }
  else if (model === "divert"){
    genBox(); conBox();
    rails(st.t1, st.t4, xcc);
    P.push(G.pipe(xcc, ys, xcc, ybox, c(st.t1), true));
    P.push(G.pipe(xcc, ybox+hbox, xcc, yr, c(st.t3)));
    P.push(G.pipe(300, ys, 300, yr, c(st.t1)));

    A.push(G.bal(300, 150, "down", "bypass"));
    A.push(G.bal(230, yr, "left", "balancing"));
    if (st.selfPumped) A.push(G.pump(130, yr, "left", true, "group pump"));
    T.push(G.tp(170, ys, "T1", F1(st.t1)+"°"), G.tp(xcc, 176, "T3", F1(st.t3)+"°"));
    T.push(G.tp(170, yr, "T4", F1(st.t4)+"°"));
    T.push(G.txt(110, ys-14, q(st.qvp), "middle"));
    T.push(G.txt(300, 246, L.bypass + " " + q(st.qBypass||0), "middle"));
  }
  else if (model === "mix" || model === "mix-premix"){
    genBox(); conBox();
    rails(st.t1, st.t4, 244);
    P.push(G.pipe(262, ys, 330, ys, c(st.t2)));
    P.push(G.pipe(354, ys, xcc, ys, c(st.t2), true), G.pipe(xcc, ys, xcc, ybox, c(st.t2), true));
    P.push(G.pipe(xcc, ybox+hbox, xcc, yr, c(st.t3)), G.pipe(xcc, yr, 250, yr, c(st.t3), true));
    P.push(G.pipe(252, ys+18, 252, yr, c(st.t3)));
    A.push(G.v3(252, ys, "right", "mixing valve", "down"));
    A.push(G.bal(252, 140, "up", "mixing leg"));
    A.push(G.pump(342, ys, "right", true, "group pump"));
    A.push(G.bal(330, yr, "left", "balancing"));
    if (model === "mix-premix"){
      P.push(G.pipe(180, ys, 180, yr, c(st.t3)));
      A.push(G.bal(180, 140, "up", "premix"));
    }
    T.push(G.tp(140, ys, "T1", F1(st.t1)+"°"), G.tp(300, ys, "T2", F1(st.t2)+"°"));
    T.push(G.tp(xcc, 176, "T3", F1(st.t3)+"°"), G.tp(140, yr, "T4", F1(st.t4)+"°"));
    T.push(G.txt(252, 246, L.mix + " " + q(st.qmeng), "middle"));
  }
  else if (model === "inject2" || model === "inject3"){
    genBox(); conBox();
    rails(st.t1, st.t4, 236);
    // мостик развязки
    P.push(G.pipe(268, ys, 268, yr, c(st.t3)));
    P.push(G.pipe(268, ys, 330, ys, c(st.t2)));
    P.push(G.pipe(354, ys, xcc, ys, c(st.t2), true), G.pipe(xcc, ys, xcc, ybox, c(st.t2), true));
    P.push(G.pipe(xcc, ybox+hbox, xcc, yr, c(st.t3)), G.pipe(xcc, yr, 268, yr, c(st.t3), true));
    if (model === "inject2") A.push(G.v2(236, ys, "right", "injection valve"));
    else { A.push(G.v3(236, ys, "right", "injection valve", "down"));
           P.push(G.pipe(236, ys+18, 236, yr, c(st.t1)));
           A.push(G.bal(236, 140, "up", "bypass")); }
    A.push(G.pump(342, ys, "right", true, "secondary pump"));
    A.push(G.bal(340, yr, "left", "secondary"));
    A.push(G.pump(120, yr, "left", true, "primary pump"));
    T.push(G.txt(268, 246, L.bridge, "middle"));
    T.push(G.tp(180, ys, "T1", F1(st.t1)+"°"), G.tp(300, ys, "T2", F1(st.t2)+"°"));
    T.push(G.tp(xcc, 176, "T3", F1(st.t3)+"°"), G.tp(180, yr, "T4", F1(st.t4)+"°"));
  }
  else if (model === "gen-passive" || model === "gen-active"){
    A.push(G.box(140, ybox, 118, hbox, L.gen, L.genKind));
    A.push(G.box(370, ybox, 130, hbox, L.groups, ""));
    P.push(G.pipe(199, ybox, 199, ys, c(st.t1)), G.pipe(199, ys, 435, ys, c(st.t1), true));
    P.push(G.pipe(435, ys, 435, ybox, c(st.t1), true));
    P.push(G.pipe(435, ybox+hbox, 435, yr, c(st.tRet)), G.pipe(435, yr, 199, yr, c(st.tRet), true));
    P.push(G.pipe(199, yr, 199, ybox+hbox, c(st.tRet)));
    A.push(G.bal(320, yr, "left", "balancing"));
    if (model === "gen-active") A.push(G.pump(250, yr, "left", true, "generator pump"));
    T.push(G.tp(280, ys, "T1", F1(st.t1)+"°"), G.tp(150, yr, "T4", F1(st.tRet)+"°"));
    T.push(G.txt(199, 246, L.genflow + " " + q(st.qGen), "middle", 11,
      st.starved ? "var(--bad)" : "var(--muted)"));
  }
  else if (model === "shunt" || model === "retmix" || model === "relief"){
    A.push(G.box(140, ybox, 118, hbox, L.gen, L.genKind));
    A.push(G.box(370, ybox, 130, hbox, L.groups, ""));
    P.push(G.pipe(199, ybox, 199, ys, c(st.t1)), G.pipe(199, ys, 435, ys, c(st.t1), true));
    P.push(G.pipe(435, ys, 435, ybox, c(st.t1), true));
    P.push(G.pipe(435, ybox+hbox, 435, yr, c(st.tRet)), G.pipe(435, yr, 199, yr, c(st.tMix), true));
    P.push(G.pipe(199, yr, 199, ybox+hbox, c(st.tMix)));
    P.push(G.pipe(310, ys, 310, yr, c(st.t1)));
    if (model === "shunt"){
      A.push(G.pump(310, 96, "down", st.active, "shunt pump"));
      A.push(G.chk(310, 160, "down"));
    } else if (model === "retmix"){
      A.push(G.v3(310, yr, "left", "return valve", "up"));
      A.push(G.sens(250, yr, "thermostat"));
    } else {
      A.push(G.v2(310, 126, "down", "relief valve"));
      T.push(G.txt(330, 168, L.setpoint, "start"));

    T.push(G.tp(230, ys, "T1", F1(st.t1)+"°"));
    T.push(G.tp(160, yr, "T4", F1(st.tMix)+"°"), G.tp(390, yr, "T3", F1(st.tRet)+"°"));

    A.push(G.box(16, ybox, 90, hbox, L.gen, L.genKind));
    A.push(G.box(396, ybox, 118, hbox, L.groups, ""));
    P.push(G.pipe(61, ybox, 61, ys, c(st.tP)), G.pipe(61, ys, 258, ys, c(st.tP), true));
    P.push(G.pipe(61, ybox+hbox, 61, yr, c(st.tPrimaryReturn)),
           G.pipe(258, yr, 61, yr, c(st.tPrimaryReturn), true));
    P.push(G.pipe(278, ys, 455, ys, c(st.tSecondarySupply), true),
           G.pipe(455, ys, 455, ybox, c(st.tSecondarySupply), true));
    P.push(G.pipe(455, ybox+hbox, 455, yr, c(st.tS)), G.pipe(455, yr, 278, yr, c(st.tS), true));

    A.push(G.bal(180, yr, "left", "balancing"));
    A.push(G.pump(340, ys, "right", true, "group pump"));
    if (st.qCross > 1e-9){
      const up = st.undersized;
      P.push(G.pipe(268, up?yr-30:ys+30, 268, up?ys+30:yr-30, up?c(st.tS):c(st.tP), true));

        up ? "var(--bad)" : "var(--muted)"));

    P.push(G.pipe(61, ybox, 61, ys, c(st.tP)), G.pipe(61, ys, 246, ys, c(st.tP), true));

           G.pipe(246, yr, 61, yr, c(st.tPrimaryReturn), true));

           G.pipe(469, ys, 469, ybox, c(st.tSecondarySupply), true));
    P.push(G.pipe(469, ybox+hbox, 469, yr, c(st.tS)), G.pipe(469, yr, 298, yr, c(st.tS), true));

    A.push(`<rect x="240" y="${ys+18}" width="64" height="${yr-ys-36}" rx="4"
      fill="var(--panel)" stroke="var(--ink)" stroke-width="1.8"/>`);

      y2="${yr-26}" stroke="var(--muted)" stroke-width="1.2"/>`);
    A.push(G.pump(150, ys, "right", true, "primary pump"));
    A.push(G.pump(360, ys, "right", true, "secondary pump"));
    T.push(G.tp(200, ys, "T1", F1(st.tP)+"°"), G.tp(330, ys, "T2", F1(st.tSecondarySupply)+"°"));
    T.push(G.tp(330, yr, "T3", F1(st.tS)+"°"), G.tp(120, yr, "T4", F1(st.tPrimaryReturn)+"°"));
    T.push(G.txt(271, 246, L.approach + " " + F1(st.approach) + " K", "middle"));
  }
  return svgWrap(P, A, T);
}

/* Схемы семейства D — это не контур, а кривые Q–H с рабочей точкой. */
function drawPumpChart(st, L){
  const W=560, H=262, m={l:52,r:16,t:16,b:38};
  const xs = v => m.l + (W-m.l-m.r) * v / st.Qmax;
  const ysc = v => m.t + (H-m.t-m.b) * (1 - v / st.H0);
  const P=[], A=[], T=[];
  for (let i=0;i<=4;i++){
    const y = m.t + (H-m.t-m.b)*i/4;
    P.push(`<line x1="${m.l}" y1="${y}" x2="${W-m.r}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`);
    T.push(G.txt(m.l-8, y+4, (st.H0*(1-i/4)).toFixed(0), "end", 10));
  }
  for (let i=0;i<=4;i++){
    const x = m.l + (W-m.l-m.r)*i/4;
    T.push(G.txt(x, H-m.b+16, (st.Qmax*i/4).toFixed(1), "middle", 10));
  }
  T.push(G.txt((m.l+W-m.r)/2, H-6, "Q, m³/h", "middle", 10));
  T.push(G.txt(14, (m.t+H-m.b)/2, "H, kPa", "middle", 10));
  const path = (pts, col, dash) =>
    `<path d="${pts.map((p,i)=>(i?"L":"M")+xs(p[0])+" "+ysc(p[1])).join(" ")}"
      fill="none" stroke="${col}" stroke-width="2.4"${dash?` stroke-dasharray="${dash}"`:""}/>`;
  const N=60, full=[], ctrl=[], sys=[];
  for (let i=0;i<=N;i++){
    const Q = st.Qmax*i/N;
    full.push([Q, pumpHead(Q, st.H0, st.Qmax)]);
    const hc = controlHead(Q, st.mode, st);
    if (hc != null) ctrl.push([Q, Math.min(hc, st.H0*1.2)]);
    sys.push([Q, Math.min(systemHead(Q, st.R), st.H0*1.2)]);
  }
  A.push(path(full, "var(--muted)", "6 5"));
  if (ctrl.length) A.push(path(ctrl, "var(--accent)"));
  A.push(path(sys, "#0f766e", "3 4"));
  if (st.duty){
    A.push(`<circle cx="${xs(st.duty.Q)}" cy="${ysc(st.duty.H)}" r="6.5"
      fill="var(--panel)" stroke="var(--accent)" stroke-width="2.6"/>`);
    T.push(G.txt(xs(st.duty.Q)+11, ysc(st.duty.H)-8,
      F2(st.duty.Q)+" m³/h · "+F1(st.duty.H)+" kPa", "start", 10.5, "var(--ink)"));
  }
  T.push(G.txt(m.l+10, m.t+14, L.pumpCurve, "start", 10));
  T.push(G.txt(m.l+10, m.t+28, L.systemCurve, "start", 10, "#0f766e"));
  if (ctrl.length) T.push(G.txt(m.l+10, m.t+42, L.controlCurve, "start", 10, "var(--accent)"));
  return svgWrap(P, A, T);
}
