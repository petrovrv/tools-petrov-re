  "description": {
    "en": "Describe the establishment, the temperatures, aerosol points, little-used outlets, dead legs and the latest sampling campaign, or load an example. The tool reads the Flemish Legionellabesluit (scope, register, management plan, sampling, alert and report levels with their articles), computes the volume and purge time of every dead leg, screens the risk as an ordinal class (low, moderate, high, very high) with the reasons behind it — never as a probability — and builds a control plan: weekly flushing, monthly temperature checks, shower-head cleaning, heater service, sampling and review, exportable as CSV in the maintenance-planner task format.",
    "uk": "Опишіть заклад, температури, точки утворення аерозолю, рідко використовувані точки, тупикові ділянки й останню кампанію відбору проб або завантажте приклад. Інструмент застосовує фламандський Legionellabesluit (сфера дії, реєстр, план керування, відбір проб, рівні пильності й повідомлення зі статтями), обчислює об’єм і час промивання кожної тупикової ділянки, оцінює ризик порядковим класом (низький, помірний, високий, дуже високий) з причинами — ніколи не ймовірністю — і складає план контролю: щотижневе промивання, щомісячні вимірювання температури, чищення душових лійок, обслуговування нагрівача, відбір проб і перегляд, з експортом у CSV у форматі завдань планувальника ТО.",
    "de": "Beschreiben Sie die Einrichtung, die Temperaturen, Aerosolstellen, selten genutzte Entnahmestellen, Totleitungen und die letzte Probenahme, oder laden Sie ein Beispiel. Das Werkzeug wendet den flämischen Legionellabesluit an (Geltungsbereich, Register, Beherrschungsplan, Probenahme, Alarm- und Meldestufen mit ihren Artikeln), berechnet Volumen und Ausspülzeit jeder Totleitung, bewertet das Risiko als ordinale Klasse (niedrig, mäßig, hoch, sehr hoch) mit den Gründen — nie als Wahrscheinlichkeit — und erstellt einen Kontrollplan: wöchentliches Spülen, monatliche Temperaturkontrollen, Reinigung der Duschköpfe, Speicherwartung, Probenahme und Überprüfung, exportierbar als CSV im Aufgabenformat des Wartungsplaners.",
    "nl": "Beschrijf de inrichting, de temperaturen, aerosolpunten, weinig gebruikte tappunten, dode leidingen en de laatste staalnamecampagne, of laad een voorbeeld. De tool past het Vlaamse Legionellabesluit toe (toepassingsgebied, register, beheersplan, staalname, niveaus van waakzaamheid en melding met hun artikels), berekent volume en spoeltijd van elke dode leiding, beoordeelt het risico als ordinale klasse (laag, matig, hoog, zeer hoog) met de redenen erachter — nooit als kans — en stelt een beheersplan op: wekelijks spoelen, maandelijkse temperatuurcontroles, reinigen van douchekoppen, onderhoud van de boiler, staalname en herziening, exporteerbaar als CSV in het takenformaat van de onderhoudsplanner.",
    "fr": "Décrivez l’établissement, les températures, les points d’aérosol, les points peu utilisés, les bras morts et la dernière campagne de prélèvements, ou chargez un exemple. L’outil applique le Legionellabesluit flamand (champ d’application, registre, plan de gestion, prélèvements, niveaux de vigilance et de notification avec leurs articles), calcule le volume et le temps de purge de chaque bras mort, évalue le risque en classe ordinale (faible, modéré, élevé, très élevé) avec ses raisons — jamais en probabilité — et établit un plan de maîtrise : rinçage hebdomadaire, contrôles mensuels de température, nettoyage des pommes de douche, entretien du préparateur, prélèvements et revue, exportable en CSV au format des tâches du planificateur de maintenance.",
    "es": "Describa el establecimiento, las temperaturas, los puntos de aerosol, los puntos poco usados, los tramos muertos y la última campaña de muestreo, o cargue un ejemplo. La herramienta aplica el Legionellabesluit flamenco (ámbito, registro, plan de gestión, muestreo, niveles de vigilancia y de notificación con sus artículos), calcula el volumen y el tiempo de purga de cada tramo muerto, evalúa el riesgo como clase ordinal (bajo, moderado, alto, muy alto) con sus razones — nunca como probabilidad — y elabora un plan de control: purga semanal, controles mensuales de temperatura, limpieza de alcachofas de ducha, mantenimiento del acumulador, muestreo y revisión, exportable en CSV con el formato de tareas del planificador de mantenimiento.",
    "pl": "Opisz obiekt, temperatury, punkty tworzenia aerozolu, rzadko używane punkty poboru, martwe odcinki i ostatnią kampanię poboru próbek albo wczytaj przykład. Narzędzie stosuje flamandzki Legionellabesluit (zakres, rejestr, plan zarządzania, pobór próbek, poziomy czujności i zgłoszenia z artykułami), oblicza objętość i czas wypłukania każdego martwego odcinka, ocenia ryzyko jako klasę porządkową (niskie, umiarkowane, wysokie, bardzo wysokie) z uzasadnieniem — nigdy jako prawdopodobieństwo — i tworzy plan kontroli: cotygodniowe płukanie, comiesięczne pomiary temperatury, czyszczenie słuchawek prysznicowych, serwis podgrzewacza, pobór próbek i przegląd, z eksportem CSV w formacie zadań planera utrzymania."

    "fr": "Une aide au dépistage, pas l’analyse de risque d’un plan de gestion par une personne compétente. Seul l’arrêté flamand est codé en détail (texte de codex.vlaanderen.be, lu le 06.11.2026) ; les autres régions sont des renvois. Le barème de la classe de risque, les intervalles non cités de l’arrêté et les heures des tâches sont des hypothèses pédagogiques. Le temps de purge néglige la capacité thermique du tube. Les règles régionales peuvent être plus strictes.",

  'ob.ex_service': T7('Yearly maintenance by a professional, incl. checking the produced temperature against the setpoint; keep the proof', 'Щорічне обслуговування фахівцем із перевіркою фактичної температури проти уставки; зберігати підтвердження', 'Jährliche Wartung durch eine Fachkraft inkl. Prüfung der erzeugten Temperatur gegen den Sollwert; Nachweis aufbewahren', 'Jaarlijks onderhoud door een vakman met controle van de geproduceerde temperatuur tegen de instelling; bewijs bijhouden', 'Entretien annuel par un professionnel avec contrôle de la température produite par rapport à la consigne ; garder la preuve', 'Mantenimiento anual por un profesional, comprobando la temperatura producida frente a la consigna; conservar la prueba', 'Coroczny serwis przez fachowca ze sprawdzeniem temperatury wytwarzanej wobec nastawy; przechowywać dowód'),
  'ob.ex_inform': T7('If the produced water is below 60 °C, inform everyone exposed that the system is not legionella-safe', 'Якщо вода нижче 60 °C, повідомити всіх, хто зазнає впливу, що система не безпечна щодо легіонели', 'Liegt das erzeugte Wasser unter 60 °C, alle Exponierten informieren, dass die Anlage nicht legionellensicher ist', 'Is het geproduceerde water kouder dan 60 °C, alle blootgestelden verwittigen dat de installatie niet legionellaveilig is', 'Si l’eau produite est sous 60 °C, informer toutes les personnes exposées que l’installation n’est pas sûre vis-à-vis des légionelles', 'Si el agua producida está por debajo de 60 °C, informar a todos los expuestos de que la instalación no es segura frente a legionela', 'Jeśli woda ma poniżej 60 °C, poinformować wszystkich narażonych, że instalacja nie jest bezpieczna pod względem legionelli'),

  'ms.cold': T7('Keep cold water below %t °C: insulate cold pipes, separate them from hot pipes and heat sources', 'Тримати холодну воду нижче %t °C: ізолювати холодні труби, віддалити від гарячих труб і джерел тепла', 'Kaltwasser unter %t °C halten: Kaltleitungen dämmen, von Warmleitungen und Wärmequellen trennen', 'Koud water onder %t °C houden: koude leidingen isoleren, scheiden van warme leidingen en warmtebronnen', 'Garder l’eau froide sous %t °C : isoler les tubes froids, les éloigner des tubes chauds et des sources de chaleur', 'Mantener el agua fría por debajo de %t °C: aislar las tuberías frías, separarlas de las calientes y de fuentes de calor', 'Utrzymać wodę zimną poniżej %t °C: zaizolować rury zimne, oddzielić je od ciepłych i źródeł ciepła'),
  'ms.dead_leg': T7('Remove or shorten dead leg “%i”, or loop it into the circulation', 'Прибрати чи скоротити тупикову ділянку «%i» або підключити її до циркуляції', 'Totleitung „%i“ entfernen, kürzen oder in die Zirkulation einbinden', 'Dode leiding “%i” verwijderen, inkorten of in de circulatie opnemen', 'Supprimer ou raccourcir le bras mort « %i » ou le raccorder au bouclage', 'Eliminar o acortar el tramo muerto «%i» o integrarlo en la recirculación', 'Usunąć lub skrócić martwy odcinek „%i” albo włączyć go do cyrkulacji'),
  'ms.critical_review': T7('Critical review of the plan, its execution and the system; extra measures until < 10 000 KVE/l', 'Критичний перегляд плану, його виконання й системи; додаткові заходи до < 10 000 KVE/л', 'Kritische Überprüfung von Plan, Umsetzung und Anlage; zusätzliche Maßnahmen bis < 10 000 KBE/l', 'Kritische beoordeling van plan, uitvoering en watersysteem; bijkomende maatregelen tot < 10 000 KVE/l', 'Revue critique du plan, de son exécution et de l’installation ; mesures supplémentaires jusqu’à < 10 000 UFC/l', 'Revisión crítica del plan, su ejecución y la instalación; medidas adicionales hasta < 10 000 UFC/l', 'Krytyczny przegląd planu, jego wykonania i instalacji; dodatkowe działania do < 10 000 jtk/l'),
  'ms.report': T7('Inform the health authority (Afdeling Toezicht Volksgezondheid) immediately; stop aerosol-producing use', 'Негайно повідомити санітарний орган (Afdeling Toezicht Volksgezondheid); припинити використання з утворенням аерозолю', 'Gesundheitsbehörde (Afdeling Toezicht Volksgezondheid) sofort informieren; aerosolbildende Nutzung einstellen', 'Afdeling Toezicht Volksgezondheid onmiddellijk verwittigen; aerosolproducerend gebruik stopzetten', 'Informer immédiatement l’autorité sanitaire (Afdeling Toezicht Volksgezondheid) ; arrêter les usages producteurs d’aérosols', 'Informar de inmediato a la autoridad sanitaria (Afdeling Toezicht Volksgezondheid); detener los usos que generan aerosoles', 'Niezwłocznie powiadomić organ sanitarny (Afdeling Toezicht Volksgezondheid); wstrzymać użycie tworzące aerozol'),
  'ms.vigilance': T7('Raise the vigilance for possible legionella infections together with the physicians of the establishment', 'Разом із лікарями закладу посилити пильність щодо можливих легіонельозних інфекцій', 'Gemeinsam mit den Ärzten der Einrichtung die Wachsamkeit für mögliche Legionelleninfektionen erhöhen', 'Samen met de artsen van de inrichting de waakzaamheid voor mogelijke legionella-infecties opvoeren', 'Renforcer, avec les médecins de l’établissement, la vigilance envers d’éventuelles infections à légionelles', 'Reforzar, junto con los médicos del centro, la vigilancia de posibles infecciones por legionela', 'Wraz z lekarzami placówki zwiększyć czujność wobec możliwych zakażeń legionellą'),
  'ms.report_notify': T7('Inform the Afdeling Toezicht Volksgezondheid immediately', 'Негайно повідомити Afdeling Toezicht Volksgezondheid (санітарний нагляд)', 'Die Afdeling Toezicht Volksgezondheid (Gesundheitsaufsicht) sofort informieren', 'De Afdeling Toezicht Volksgezondheid onmiddellijk op de hoogte brengen', 'Informer immédiatement l’Afdeling Toezicht Volksgezondheid (contrôle sanitaire)', 'Informar de inmediato a la Afdeling Toezicht Volksgezondheid (inspección sanitaria)', 'Niezwłocznie powiadomić Afdeling Toezicht Volksgezondheid (nadzór sanitarny)'),
  'ms.stop_aerosol': T7('Stop the use of all aerosol-producing installations (showers, whirlpools, …) now', 'Негайно припинити використання всіх установок, що утворюють аерозоль (душі, вихрові ванни, …)', 'Die Nutzung aller aerosolbildenden Anlagen (Duschen, Whirlpools, …) sofort einstellen', 'Het gebruik van alle aerosolproducerende installaties (douches, whirlpools, …) nu stopzetten', 'Arrêter dès maintenant l’usage de toutes les installations produisant des aérosols (douches, bains à remous, …)', 'Detener ya el uso de todas las instalaciones que generan aerosoles (duchas, bañeras de hidromasaje, …)', 'Natychmiast wstrzymać użytkowanie wszystkich instalacji wytwarzających aerozol (prysznice, wanny z hydromasażem, …)'),
  'ms.report_reduce': T7('Take every measure needed to reduce legionella in the system and the infection risk, in consultation with the Afdeling Toezicht Volksgezondheid', 'За погодженням з Afdeling Toezicht Volksgezondheid вжити всіх заходів, потрібних для зниження кількості легіонел у системі та ризику зараження', 'In Abstimmung mit der Afdeling Toezicht Volksgezondheid alle Maßnahmen treffen, die Legionellen im System und das Infektionsrisiko senken', 'In overleg met de Afdeling Toezicht Volksgezondheid alle maatregelen nemen om de legionellakiemen in het systeem en het besmettingsrisico te reduceren', 'En concertation avec l’Afdeling Toezicht Volksgezondheid, prendre toutes les mesures nécessaires pour réduire les légionelles dans le réseau et le risque d’infection', 'De acuerdo con la Afdeling Toezicht Volksgezondheid, tomar todas las medidas necesarias para reducir la legionela en el sistema y el riesgo de infección', 'W porozumieniu z Afdeling Toezicht Volksgezondheid podjąć wszystkie działania potrzebne do ograniczenia legionelli w instalacji i ryzyka zakażenia'),
  'ms.restart_samples': T7('Restart the aerosol-producing installations only when samples at representative points are below 100 000 KVE/l', 'Повторно вмикати установки з утворенням аерозолю лише тоді, коли проби в репрезентативних точках нижчі за 100 000 KVE/л', 'Aerosolbildende Anlagen erst wieder in Betrieb nehmen, wenn Proben an repräsentativen Stellen unter 100 000 KBE/l liegen', 'Aerosolproducerende installaties pas weer in gebruik nemen als stalen op representatieve plaatsen lager zijn dan 100 000 KVE/l', 'Ne remettre en service les installations produisant des aérosols que lorsque les prélèvements aux points représentatifs sont sous 100 000 UFC/l', 'Volver a poner en servicio las instalaciones que generan aerosoles solo cuando las muestras en puntos representativos estén por debajo de 100 000 UFC/l', 'Ponownie uruchamiać instalacje wytwarzające aerozol dopiero, gdy próbki z reprezentatywnych punktów są poniżej 100 000 jtk/l'),
  'ms.intensive_sampling': T7('After the restart follow the system for at least %m months on an intensive sampling plan agreed with the Afdeling Toezicht Volksgezondheid', 'Після повторного пуску щонайменше %m міс. контролювати систему за інтенсивним планом відбору проб, погодженим з Afdeling Toezicht Volksgezondheid', 'Nach der Wiederinbetriebnahme das System mindestens %m Monate nach einem mit der Afdeling Toezicht Volksgezondheid vereinbarten intensiven Probenahmeplan überwachen', 'Na het weer in gebruik nemen het systeem minstens %m maanden volgen met een intensief staalnameplan, overeengekomen met de Afdeling Toezicht Volksgezondheid', 'Après la remise en service, suivre le réseau au moins %m mois selon un plan d’échantillonnage intensif convenu avec l’Afdeling Toezicht Volksgezondheid', 'Tras la puesta en servicio, seguir el sistema al menos %m meses con un plan de muestreo intensivo acordado con la Afdeling Toezicht Volksgezondheid', 'Po ponownym uruchomieniu monitorować instalację co najmniej %m mies. według intensywnego planu poboru próbek uzgodnionego z Afdeling Toezicht Volksgezondheid'),
  'ms.inform_users': T7('Inform the users of the contamination and advise susceptible persons not to use the installation', 'Повідомити користувачів про зараження системи й порадити вразливим особам не користуватися нею', 'Die Nutzer über die Kontamination informieren und empfindlichen Personen von der Nutzung abraten', 'De gebruikers op de hoogte brengen van de besmetting en gevoelige personen aanraden er geen gebruik van te maken', 'Informer les usagers de la contamination et déconseiller l’usage aux personnes vulnérables', 'Informar a los usuarios de la contaminación y desaconsejar el uso a las personas vulnerables', 'Poinformować użytkowników o skażeniu i odradzić korzystanie osobom szczególnie wrażliwym'),
  'ms.shutdown_1m': T7('If the concentration cannot be brought below 100 000 KVE/l within one month of the report, take the water supply out of service', 'Якщо за місяць після повідомлення концентрацію не вдасться знизити нижче 100 000 KVE/л, вивести водопостачання з роботи', 'Wenn die Konzentration einen Monat nach der Meldung nicht unter 100 000 KBE/l liegt, die Wasserversorgung außer Betrieb nehmen', 'Als de concentratie een maand na de melding niet lager dan 100 000 KVE/l gebracht kan worden, de watervoorziening buiten werking stellen', 'Si la concentration ne peut être ramenée sous 100 000 UFC/l un mois après la déclaration, mettre l’installation d’eau hors service', 'Si un mes después de la notificación la concentración no baja de 100 000 UFC/l, dejar fuera de servicio el suministro de agua', 'Jeśli miesiąc po zgłoszeniu stężenia nie da się obniżyć poniżej 100 000 jtk/l, wyłączyć instalację wodną z eksploatacji'),
  'ms.dead_leg_w551': T7('Dead leg “%i” holds more than 3 L (DVGW W 551 3-litre rule) although it is within your design limit: shorten it or loop it into the circulation', 'Тупикова ділянка «%i» містить понад 3 л (правило 3 літрів DVGW W 551), хоча вкладається у ваш проєктний ліміт: скоротити її або підключити до циркуляції', 'Totleitung „%i“ fasst mehr als 3 L (3-Liter-Regel DVGW W 551), obwohl sie Ihre Planungsgrenze einhält: kürzen oder in die Zirkulation einbinden', 'Dode leiding „%i” bevat meer dan 3 L (3-literregel DVGW W 551), al blijft ze binnen uw ontwerpgrens: inkorten of in de circulatie opnemen', 'Le bras mort « %i » contient plus de 3 L (règle des 3 litres DVGW W 551) bien qu’il respecte votre limite de conception : le raccourcir ou le raccorder au bouclage', 'El tramo muerto «%i» contiene más de 3 L (regla de 3 litros DVGW W 551) aunque cumple su límite de diseño: acortarlo o conectarlo a la recirculación', 'Martwy odcinek „%i” zawiera ponad 3 L (reguła 3 litrów DVGW W 551), choć mieści się w Twoim limicie projektowym: skrócić go lub włączyć w cyrkulację'),
  'st.over3': T7('over 3 L (W 551)', 'понад 3 л (W 551)', 'über 3 L (W 551)', 'boven 3 L (W 551)', 'plus de 3 L (W 551)', 'más de 3 L (W 551)', 'ponad 3 L (W 551)'),
  'n.w551_3L': T7('DVGW W 551 3-litre rule, checked separately from the design limit of %l L: %n hot dead leg(s) hold more than 3 L.', 'Правило 3 літрів DVGW W 551 перевіряється окремо від проєктного ліміту %l л: %n гаряч. тупикових ділянок містять понад 3 л.', '3-Liter-Regel DVGW W 551, getrennt von der Planungsgrenze %l L geprüft: %n warme Totleitung(en) fassen mehr als 3 L.', '3-literregel DVGW W 551, los van de ontwerpgrens van %l L gecontroleerd: %n warme dode leiding(en) bevatten meer dan 3 L.', 'Règle des 3 litres DVGW W 551, vérifiée indépendamment de la limite de conception de %l L : %n bras mort(s) chaud(s) contiennent plus de 3 L.', 'Regla de 3 litros DVGW W 551, comprobada aparte del límite de diseño de %l L: %n tramo(s) muerto(s) caliente(s) contienen más de 3 L.', 'Reguła 3 litrów DVGW W 551 sprawdzana niezależnie od limitu projektowego %l L: %n gorących martwych odcinków zawiera ponad 3 L.'),
  'n.w551_target': T7('Your design targets are laxer than DVGW W 551 (60 °C at the heater outlet, 55 °C in the circulation, stop at most 8 h per day): the screening points use your targets, but the W 551 values are checked on their own and named in the measures.', 'Ваші проєктні цілі м’якші за DVGW W 551 (60 °C на виході нагрівача, 55 °C у циркуляції, зупинка не довше 8 год на добу): бали скринінгу рахуються за вашими цілями, але значення W 551 перевіряються окремо й названі в заходах.', 'Ihre Planungsziele sind weniger streng als DVGW W 551 (60 °C am Speicheraustritt, 55 °C in der Zirkulation, Pause höchstens 8 h pro Tag): die Screening-Punkte nutzen Ihre Ziele, die W-551-Werte werden aber eigens geprüft und in den Maßnahmen genannt.', 'Uw ontwerpdoelen zijn soepeler dan DVGW W 551 (60 °C aan de boileruitgang, 55 °C in de circulatie, onderbreking hoogstens 8 u per dag): de screeningpunten gebruiken uw doelen, maar de W 551-waarden worden apart gecontroleerd en in de maatregelen genoemd.', 'Vos objectifs de conception sont moins stricts que la DVGW W 551 (60 °C en sortie de production, 55 °C dans le bouclage, arrêt au plus 8 h par jour) : les points de dépistage utilisent vos objectifs, mais les valeurs W 551 sont vérifiées à part et citées dans les mesures.', 'Sus objetivos de diseño son menos estrictos que la DVGW W 551 (60 °C a la salida del acumulador, 55 °C en la recirculación, parada de 8 h al día como máximo): los puntos de cribado usan sus objetivos, pero los valores W 551 se comprueban aparte y figuran en las medidas.', 'Twoje cele projektowe są łagodniejsze niż DVGW W 551 (60 °C na wyjściu podgrzewacza, 55 °C w cyrkulacji, przerwa najwyżej 8 h na dobę): punkty oceny liczone są według Twoich celów, ale wartości W 551 sprawdzane są osobno i podane w działaniach.'),

function curLang() { return (window.DiagramUI && DiagramUI.current && DiagramUI.current.lang) || document.documentElement.lang || 'en'; }
function tx(k) { return I18N[k] || { en: k }; }
function pick(o) { var l = curLang(); return (o && o[l]) || (o && o.en) || String(o == null ? '' : o); }
function S(k, subs) { var s = pick(tx(k)); if (subs) Object.keys(subs).sort(function (a, b) { return b.length - a.length; }).forEach(function (p) { s = s.split('%' + p).join(subs[p]); }); return s; }
function fmt(v, p) {
  var c = core();
  if (c && typeof c.fmt === 'function') { try { return c.fmt(v, curLang(), p); } catch (e) { /* fall through */ } }
  if (window.DiagramUI && DiagramUI.fmt) return DiagramUI.fmt(v, { precision: p });
  return Number(v).toFixed(p);
}

    decree: { title: T7('The Flemish Legionellabesluit', 'Фламандський Legionellabesluit', 'Der flämische Legionellabesluit', 'Het Vlaamse Legionellabesluit', 'Le Legionellabesluit flamand', 'El Legionellabesluit flamenco', 'Flamandzki Legionellabesluit'),
      body: T7('The decree of 9 February 2007 (codex.vlaanderen.be, Art. 1 last changed 1 June 2023) applies to places open to the public. A high-risk establishment treats, cares for or houses sensitive persons (hospital, care home, assisted living); a moderate-risk establishment is any public place with collective hot water — 15 or more persons a day, staff not counted. Both need a management plan with a risk analysis, a register and sampling by an accredited lab. Moderate-risk places where never more than 40 persons a day are exposed are exempt, but must keep the heater at 60 °C and have it serviced every year (Art. 18). Systems with only WCs and washbasins without showers are not covered (Art. 1 35°) — a system without showers but with a whirlpool, spa, humidifier or another aerosol outlet is covered.',
        'Постанова від 9 лютого 2007 р. (codex.vlaanderen.be, ст. 1 востаннє змінено 1 червня 2023 р.) стосується місць, відкритих для публіки. Заклад високого ризику лікує, доглядає чи розміщує вразливих осіб (лікарня, будинок догляду, житло з підтримкою); заклад помірного ризику — будь-яке публічне місце з колективною гарячою водою — 15 і більше осіб на добу без персоналу. Обидва потребують плану керування з аналізом ризику, реєстру та відбору проб акредитованою лабораторією. Заклади помірного ризику, де на добу ніколи не буває понад 40 осіб, звільнені, але мусять тримати нагрівач на 60 °C і щороку обслуговувати його (ст. 18). Системи лише з унітазами й умивальниками без душів не охоплюються (ст. 1 35°) — система без душів, але з гідромасажною ванною, спа, зволожувачем чи іншою точкою аерозолю, охоплюється.',
        'Der Erlass vom 9. Februar 2007 (codex.vlaanderen.be, Art. 1 zuletzt geändert am 1. Juni 2023) gilt für öffentlich zugängliche Orte. Eine Hochrisiko-Einrichtung behandelt, pflegt oder beherbergt empfindliche Personen (Krankenhaus, Pflegeheim, betreutes Wohnen); eine Einrichtung mit mäßigem Risiko ist jeder öffentliche Ort mit kollektiver Warmwasserversorgung — 15 oder mehr Personen am Tag, Personal nicht gezählt. Beide brauchen einen Beherrschungsplan mit Gefährdungsanalyse, ein Register und Probenahmen durch ein akkreditiertes Labor. Einrichtungen mit mäßigem Risiko, in denen nie mehr als 40 Personen am Tag exponiert sind, sind befreit, müssen den Speicher aber auf 60 °C halten und jährlich warten lassen (Art. 18). Anlagen nur mit WCs und Waschtischen ohne Duschen sind nicht erfasst (Art. 1 35°) — eine Anlage ohne Duschen, aber mit Whirlpool, Spa, Befeuchter oder einer anderen Aerosolstelle ist erfasst.',
        'Het besluit van 9 februari 2007 (codex.vlaanderen.be, art. 1 laatst gewijzigd op 1 juni 2023) geldt voor publiek toegankelijke plaatsen. Een hoogrisico-inrichting behandelt, verzorgt of huisvest gevoelige personen (ziekenhuis, woonzorgcentrum, assistentiewoning); een matigrisico-inrichting is elke publiek toegankelijke plaats met een collectieve warmwatervoorziening — 15 of meer personen per dag, werknemers niet meegeteld. Beide hebben een beheersplan met risicoanalyse, een register en staalname door een geaccrediteerd labo nodig. Matigrisico-inrichtingen waar nooit meer dan 40 personen per dag blootgesteld zijn, zijn vrijgesteld, maar moeten de boiler op 60 °C houden en jaarlijks laten onderhouden (art. 18). Installaties met alleen toiletten en wastafels zonder douches vallen erbuiten (art. 1 35°) — een installatie zonder douches maar met een whirlpool, spa, bevochtiger of een ander aerosolpunt valt er wel onder.',
        'L’arrêté du 9 février 2007 (codex.vlaanderen.be, art. 1 modifié en dernier lieu le 1er juin 2023) s’applique aux lieux accessibles au public. Un établissement à risque élevé soigne, prend en charge ou héberge des personnes sensibles (hôpital, maison de repos, résidence-services) ; un établissement à risque modéré est tout lieu public avec une production d’eau chaude collective — 15 personnes ou plus par jour, personnel non compté. Les deux doivent avoir un plan de gestion avec analyse de risque, un registre et des prélèvements par un laboratoire accrédité. Les établissements à risque modéré où jamais plus de 40 personnes par jour sont exposées sont exemptés, mais doivent régler le préparateur à 60 °C et le faire entretenir chaque année (art. 18). Les installations avec seulement des WC et des lavabos sans douches ne sont pas visées (art. 1 35°) — une installation sans douches mais avec bain à remous, spa, humidificateur ou autre point d’aérosol est visée.',
        'El decreto de 9 de febrero de 2007 (codex.vlaanderen.be, art. 1 modificado por última vez el 1 de junio de 2023) se aplica a lugares abiertos al público. Un establecimiento de alto riesgo trata, cuida o aloja a personas sensibles (hospital, residencia, vivienda asistida); uno de riesgo moderado es cualquier lugar público con agua caliente colectiva: 15 o más personas al día, sin contar el personal. Ambos necesitan un plan de gestión con análisis de riesgos, un registro y muestreo por un laboratorio acreditado. Los de riesgo moderado donde nunca hay más de 40 personas expuestas al día están exentos, pero deben mantener el calentador a 60 °C y revisarlo cada año (art. 18). Las instalaciones con solo inodoros y lavabos sin duchas no están incluidas (art. 1 35°); una instalación sin duchas pero con hidromasaje, spa, humidificador u otro punto de aerosol sí lo está.',
        'Rozporządzenie z 9 lutego 2007 r. (codex.vlaanderen.be, art. 1 ostatnio zmieniony 1 czerwca 2023 r.) dotyczy miejsc dostępnych publicznie. Obiekt wysokiego ryzyka leczy, opiekuje się lub zakwaterowuje osoby wrażliwe (szpital, dom opieki, mieszkania wspomagane); obiekt umiarkowanego ryzyka to każde miejsce publiczne ze zbiorową ciepłą wodą — 15 lub więcej osób dziennie, bez personelu. Oba potrzebują planu zarządzania z analizą ryzyka, rejestru i poboru próbek przez akredytowane laboratorium. Obiekty umiarkowanego ryzyka, w których nigdy nie przebywa więcej niż 40 narażonych osób dziennie, są zwolnione, ale muszą utrzymywać podgrzewacz na 60 °C i serwisować go co roku (art. 18). Instalacje wyłącznie z WC i umywalkami bez pryszniców nie są objęte (art. 1 35°) — instalacja bez pryszniców, ale z wanną z hydromasażem, spa, nawilżaczem lub innym punktem aerozolu, jest objęta.') },
    levels: { title: T7('Lab results and the 30 % rule', 'Лабораторні результати і правило 30 %', 'Laborbefunde und die 30-%-Regel', 'Labouitslagen en de 30 %-regel', 'Résultats de laboratoire et la règle des 30 %', 'Resultados de laboratorio y la regla del 30 %', 'Wyniki laboratoryjne i reguła 30 %'),
      body: T7('The decree judges a sampling campaign, not one sample: a level is reached when 30 % or more of the samples exceed a threshold of Legionella pneumophila. High-risk: > 1 000 KVE/l → vigilance with the attached doctors; > 10 000 → critical review and monthly sampling until below 10 000; report to the authority and stop aerosol use after three alert campaigns, three times > 10 000 at one point, or > 100 000. Moderate-risk: > 10 000 → monthly sampling; > 100 000 → report, warn users and shut down after one month if it stays high. Outside the decree the EU Drinking Water Directive uses 1 000 CFU/l as parameter value. At the report level of a high-risk establishment (Art. 9 §5) aerosol-producing installations are stopped at once; they restart only when samples at representative points are below 100 000, followed by at least three months of intensive sampling agreed with the authority.',
        'Постанова оцінює кампанію відбору, а не одну пробу: рівень досягнуто, коли 30 % і більше проб перевищують поріг Legionella pneumophila. Високий ризик: > 1 000 KVE/л → пильність разом із лікарями закладу; > 10 000 → критичний перегляд і щомісячні проби, доки не нижче 10 000; повідомлення органу й зупинка аерозолю після трьох кампаній підвищеної пильності, трьох перевищень 10 000 в одній точці або > 100 000. Помірний ризик: > 10 000 → щомісячні проби; > 100 000 → повідомлення, попередження користувачів і відключення через місяць, якщо рівень не знизиться. Поза постановою Директива ЄС про питну воду використовує параметр 1 000 КУО/л. На рівні повідомлення у закладі високого ризику (ст. 9 §5) установки з утворенням аерозолю зупиняють одразу; повторний пуск — лише коли проби в репрезентативних точках нижчі за 100 000, після чого щонайменше три місяці інтенсивного відбору проб за погодженням з органом.',
        'Der Erlass bewertet eine Probenahmekampagne, nicht eine Einzelprobe: eine Stufe ist erreicht, wenn 30 % oder mehr der Proben einen Schwellenwert an Legionella pneumophila überschreiten. Hochrisiko: > 1 000 KBE/l → Wachsamkeit mit den Ärzten der Einrichtung; > 10 000 → kritische Überprüfung und monatliche Proben bis unter 10 000; Meldung an die Behörde und Aerosolstopp nach drei Alarmkampagnen, dreimal > 10 000 an einer Stelle oder > 100 000. Mäßiges Risiko: > 10 000 → monatliche Proben; > 100 000 → Meldung, Nutzer warnen und Stilllegung nach einem Monat, wenn es hoch bleibt. Außerhalb des Erlasses nutzt die EU-Trinkwasserrichtlinie 1 000 KBE/l als Parameterwert. Auf der Meldestufe einer Hochrisiko-Einrichtung (Art. 9 §5) werden aerosolbildende Anlagen sofort stillgelegt; sie gehen erst wieder in Betrieb, wenn Proben an repräsentativen Stellen unter 100 000 liegen, danach folgen mindestens drei Monate intensive Probenahme nach Absprache mit der Behörde.',
        'Het besluit beoordeelt een staalnamecampagne, niet één staal: een niveau is bereikt als 30 % of meer van de stalen een drempel aan Legionella pneumophila overschrijdt. Hoogrisico: > 1 000 KVE/l → waakzaamheid samen met de artsen van de inrichting; > 10 000 → kritische beoordeling en maandelijkse staalname tot onder 10 000; melding en aerosolstop na drie campagnes op verhoogde waakzaamheid, driemaal > 10 000 op één punt of > 100 000. Matigrisico: > 10 000 → maandelijkse staalname; > 100 000 → melding, gebruikers verwittigen en na een maand buiten werking als het hoog blijft. Buiten het besluit hanteert de Europese drinkwaterrichtlijn 1 000 KVE/l als parameterwaarde. Op het meldingsniveau van een hoogrisico-inrichting (art. 9 §5) worden aerosolproducerende installaties meteen stilgelegd; ze gaan pas weer in gebruik als stalen op representatieve plaatsen onder 100 000 liggen, gevolgd door minstens drie maanden intensieve staalname in overleg met de overheid.',
        'L’arrêté juge une campagne de prélèvements, pas un échantillon : un niveau est atteint quand 30 % ou plus des échantillons dépassent un seuil de Legionella pneumophila. Risque élevé : > 1 000 UFC/l → vigilance avec les médecins de l’établissement ; > 10 000 → revue critique et prélèvements mensuels jusqu’à moins de 10 000 ; notification à l’autorité et arrêt des aérosols après trois campagnes en vigilance renforcée, trois dépassements de 10 000 au même point ou > 100 000. Risque modéré : > 10 000 → prélèvements mensuels ; > 100 000 → notification, information des usagers et mise hors service après un mois si cela persiste. Hors arrêté, la directive européenne eau potable fixe 1 000 UFC/l comme valeur paramétrique. Au niveau de déclaration d’un établissement à risque élevé (art. 9 §5), les installations produisant des aérosols sont arrêtées sur-le-champ ; elles ne redémarrent que lorsque les prélèvements aux points représentatifs sont sous 100 000, suivis d’au moins trois mois d’échantillonnage intensif convenu avec l’autorité.',
        'El decreto juzga una campaña de muestreo, no una muestra: un nivel se alcanza cuando el 30 % o más de las muestras supera un umbral de Legionella pneumophila. Alto riesgo: > 1 000 UFC/l → vigilancia con los médicos del centro; > 10 000 → revisión crítica y muestreo mensual hasta bajar de 10 000; notificación a la autoridad y parada de aerosoles tras tres campañas en vigilancia reforzada, tres veces > 10 000 en un punto o > 100 000. Riesgo moderado: > 10 000 → muestreo mensual; > 100 000 → notificación, aviso a usuarios y cierre al mes si sigue alto. Fuera del decreto, la Directiva europea de agua potable usa 1 000 UFC/l como valor paramétrico. En el nivel de notificación de un centro de alto riesgo (art. 9 §5) las instalaciones que generan aerosoles se paran de inmediato; solo vuelven a funcionar cuando las muestras en puntos representativos bajan de 100 000, seguidas de al menos tres meses de muestreo intensivo acordado con la autoridad.',
        'Rozporządzenie ocenia kampanię poboru, a nie pojedynczą próbkę: poziom jest osiągnięty, gdy 30 % lub więcej próbek przekracza próg Legionella pneumophila. Wysokie ryzyko: > 1 000 jtk/l → czujność wraz z lekarzami obiektu; > 10 000 → krytyczny przegląd i comiesięczne próbki aż do spadku poniżej 10 000; zgłoszenie do organu i wstrzymanie aerozolu po trzech kampaniach podwyższonej czujności, trzykrotnym > 10 000 w jednym punkcie lub > 100 000. Umiarkowane ryzyko: > 10 000 → próbki co miesiąc; > 100 000 → zgłoszenie, ostrzeżenie użytkowników i wyłączenie po miesiącu, jeśli wynik się utrzymuje. Poza rozporządzeniem dyrektywa UE o wodzie pitnej stosuje wartość parametryczną 1 000 jtk/l. Na poziomie zgłoszenia w obiekcie wysokiego ryzyka (art. 9 §5) instalacje wytwarzające aerozol zatrzymuje się od razu; wracają do pracy dopiero, gdy próbki z reprezentatywnych punktów są poniżej 100 000, a potem następują co najmniej trzy miesiące intensywnego poboru próbek uzgodnionego z organem.') },
    temps: { title: T7('60 / 55 / 20 °C', '60 / 55 / 20 °C', '60 / 55 / 20 °C', '60 / 55 / 20 °C', '60 / 55 / 20 °C', '60 / 55 / 20 °C', '60 / 55 / 20 °C'),
      body: T7('The decree’s standard measure is temperature control: keep water outside 25–55 °C (Art. 1 30°). In practice (DVGW W 551, CEN/TR 16355, Departement Zorg guidance): 60 °C at the heater outlet, at least 55 °C everywhere in the circulation, circulation stops of at most 8 hours a day, a preheat stage (solar, heat pump) heated to 60 °C once a day, and cold water below 20 °C (HSG274, Departement Zorg) or at most 25 °C (VDI/DVGW 6023). Each deviation adds hazard points with its source.',
        'Стандартний захід постанови — контроль температури: тримати воду поза 25–55 °C (ст. 1 30°). На практиці (DVGW W 551, CEN/TR 16355, настанови Departement Zorg): 60 °C на виході нагрівача, щонайменше 55 °C скрізь у циркуляції, зупинки циркуляції не довше 8 год на добу, ступінь попереднього нагріву (сонце, тепловий насос) раз на добу нагрівається до 60 °C, холодна вода нижче 20 °C (HSG274, Departement Zorg) або не вище 25 °C (VDI/DVGW 6023). Кожне відхилення додає бали небезпеки з джерелом.',
        'Standardmaßnahme des Erlasses ist die Temperaturbeherrschung: Wasser außerhalb von 25–55 °C halten (Art. 1 30°). In der Praxis (DVGW W 551, CEN/TR 16355, Leitfaden Departement Zorg): 60 °C am Speicheraustritt, mindestens 55 °C überall in der Zirkulation, Zirkulationspausen höchstens 8 Stunden am Tag, eine Vorwärmstufe (Solar, Wärmepumpe) einmal täglich auf 60 °C, Kaltwasser unter 20 °C (HSG274, Departement Zorg) oder höchstens 25 °C (VDI/DVGW 6023). Jede Abweichung bringt Gefährdungspunkte mit ihrer Quelle.',
        'De standaardmaatregel van het besluit is temperatuurbeheersing: water buiten 25–55 °C houden (art. 1 30°). In de praktijk (DVGW W 551, CEN/TR 16355, Departement Zorg): 60 °C aan de boileruitlaat, minstens 55 °C overal in de circulatie, circulatiestops van hoogstens 8 uur per dag, een voorverwarming (zon, warmtepomp) dagelijks op 60 °C, en koud water onder 20 °C (HSG274, Departement Zorg) of hoogstens 25 °C (VDI/DVGW 6023). Elke afwijking geeft gevarenpunten met hun bron.',
        'La mesure standard de l’arrêté est la maîtrise de la température : garder l’eau hors de 25–55 °C (art. 1 30°). En pratique (DVGW W 551, CEN/TR 16355, Departement Zorg) : 60 °C en sortie de préparateur, au moins 55 °C partout dans le bouclage, arrêts de bouclage de 8 heures par jour au plus, un préchauffage (solaire, PAC) porté à 60 °C une fois par jour, et l’eau froide sous 20 °C (HSG274, Departement Zorg) ou au plus 25 °C (VDI/DVGW 6023). Chaque écart ajoute des points de danger avec leur source.',
        'La medida estándar del decreto es el control de temperatura: mantener el agua fuera de 25–55 °C (art. 1 30°). En la práctica (DVGW W 551, CEN/TR 16355, Departement Zorg): 60 °C a la salida del acumulador, al menos 55 °C en toda la recirculación, paradas de 8 horas al día como máximo, un precalentamiento (solar, bomba de calor) llevado a 60 °C una vez al día, y agua fría por debajo de 20 °C (HSG274, Departement Zorg) o de 25 °C como máximo (VDI/DVGW 6023). Cada desviación suma puntos de peligro con su fuente.',
        'Środkiem standardowym rozporządzenia jest kontrola temperatury: utrzymywać wodę poza 25–55 °C (art. 1 30°). W praktyce (DVGW W 551, CEN/TR 16355, Departement Zorg): 60 °C na wyjściu podgrzewacza, co najmniej 55 °C wszędzie w cyrkulacji, przerwy cyrkulacji najwyżej 8 godzin na dobę, stopień wstępny (solar, pompa ciepła) raz dziennie grzany do 60 °C, a woda zimna poniżej 20 °C (HSG274, Departement Zorg) lub najwyżej 25 °C (VDI/DVGW 6023). Każde odstępstwo daje punkty zagrożenia ze źródłem.') },
    deadlegs: { title: T7('Dead legs and the 3-litre rule', 'Тупикові ділянки і правило 3 літрів', 'Totleitungen und die 3-Liter-Regel', 'Dode leidingen en de 3-literregel', 'Bras morts et règle des 3 litres', 'Tramos muertos y regla de 3 litros', 'Martwe odcinki i reguła 3 litrów'),
      body: T7('A branch without circulation holds water that cools down between uses. Its volume is V = π/4·d²·L with the inner diameter d: 22 × 1 mm copper holds 0.31 L per metre, 15 × 1 mm only 0.13 L. DVGW W 551 allows at most 3 litres between the circulation and the outlet; above that the branch needs circulation or trace heating. Purge time t = V/q is how long the outlet runs before fresh water arrives — a lower bound, the pipe wall still has to warm up (HSG274 asks for hot water within one minute). The tool checks the fixed 3 litres of W 551 even when you enter another design limit.',
        'Відгалуження без циркуляції містить воду, що остигає між використаннями. Його об’єм V = π/4·d²·L з внутрішнім діаметром d: мідь 22 × 1 мм містить 0,31 л на метр, 15 × 1 мм — лише 0,13 л. DVGW W 551 допускає не більше 3 літрів між циркуляцією і точкою; понад це відгалуження потребує циркуляції або супутнього підігріву. Час промивання t = V/q — скільки тече вода, доки не надійде свіжа; це нижня межа, бо стінка труби ще має прогрітися (HSG274 вимагає гарячу воду протягом хвилини). Інструмент перевіряє фіксовані 3 літри W 551, навіть якщо ви ввели інший проєктний ліміт.',
        'Ein Abzweig ohne Zirkulation enthält Wasser, das zwischen den Nutzungen abkühlt. Sein Volumen ist V = π/4·d²·L mit dem Innendurchmesser d: Kupfer 22 × 1 mm fasst 0,31 L je Meter, 15 × 1 mm nur 0,13 L. DVGW W 551 erlaubt höchstens 3 Liter zwischen Zirkulation und Entnahmestelle; darüber braucht der Abzweig Zirkulation oder eine Begleitheizung. Die Ausspülzeit t = V/q ist die Laufzeit, bis frisches Wasser ankommt — eine Untergrenze, die Rohrwand muss sich noch erwärmen (HSG274 verlangt Warmwasser innerhalb einer Minute). Das Werkzeug prüft die festen 3 Liter der W 551 auch dann, wenn Sie eine andere Planungsgrenze eingeben.',
        'Een aftakking zonder circulatie bevat water dat afkoelt tussen twee gebruiken. Het volume is V = π/4·d²·L met binnendiameter d: koper 22 × 1 mm bevat 0,31 l per meter, 15 × 1 mm slechts 0,13 l. DVGW W 551 laat hoogstens 3 liter toe tussen circulatie en tappunt; daarboven heeft de aftakking circulatie of tracing nodig. De spoeltijd t = V/q is hoelang het tappunt loopt voor vers water aankomt — een ondergrens, want de buiswand moet nog opwarmen (HSG274 vraagt warm water binnen één minuut). De tool controleert de vaste 3 liter van W 551 ook als u een andere ontwerpgrens invoert.',
        'Une antenne sans bouclage contient de l’eau qui refroidit entre deux usages. Son volume est V = π/4·d²·L avec le diamètre intérieur d : le cuivre 22 × 1 mm contient 0,31 L par mètre, le 15 × 1 mm seulement 0,13 L. La DVGW W 551 admet au plus 3 litres entre le bouclage et le point de puisage ; au-delà, l’antenne doit être bouclée ou tracée. Le temps de purge t = V/q est la durée avant l’arrivée d’eau fraîche — une borne inférieure, la paroi doit encore se réchauffer (HSG274 demande l’eau chaude en moins d’une minute). L’outil vérifie les 3 litres fixes de la W 551 même si vous saisissez une autre limite de conception.',
        'Una derivación sin recirculación contiene agua que se enfría entre usos. Su volumen es V = π/4·d²·L con el diámetro interior d: el cobre 22 × 1 mm contiene 0,31 L por metro, el 15 × 1 mm solo 0,13 L. La DVGW W 551 admite como máximo 3 litros entre la recirculación y el punto; por encima, la derivación necesita recirculación o traceado. El tiempo de purga t = V/q es lo que tarda en llegar agua nueva: un límite inferior, la pared aún debe calentarse (HSG274 pide agua caliente en menos de un minuto). La herramienta comprueba los 3 litros fijos de la W 551 aunque introduzca otro límite de diseño.',
        'Odgałęzienie bez cyrkulacji zawiera wodę, która stygnie między użyciami. Jego objętość to V = π/4·d²·L, gdzie d to średnica wewnętrzna: miedź 22 × 1 mm mieści 0,31 l na metr, 15 × 1 mm tylko 0,13 l. DVGW W 551 dopuszcza najwyżej 3 litry między cyrkulacją a punktem poboru; powyżej odgałęzienie wymaga cyrkulacji lub przewodu grzejnego. Czas wypłukania t = V/q to czas do napłynięcia świeżej wody — dolna granica, bo ścianka rury musi się jeszcze nagrzać (HSG274 wymaga ciepłej wody w ciągu minuty). Narzędzie sprawdza stałe 3 litry W 551 także wtedy, gdy podasz inny limit projektowy.') },
    stagnation: { title: T7('Stagnation and flushing', 'Застій і промивання', 'Stagnation und Spülen', 'Stilstand en spoelen', 'Stagnation et rinçage', 'Estancamiento y purga', 'Stagnacja i płukanie'),
      body: T7('An outlet nobody uses is a dead leg too: the water in it reaches room temperature and the biofilm grows. Empty hotel rooms, a closed wing, guest bathrooms and emergency showers are the usual cases. Flush them weekly (HSG274) — or after 72 hours without use (VDI/DVGW 6023) — until the temperature is stable; in Flanders the plan must describe the scald protection when flushing hot (Art. 7 / 14). Every little-used outlet counts in the hazard points and becomes part of the weekly flushing task. For the region Germany the tool applies the 72 hours of VDI/DVGW 6023 (3 days) to stagnation and flushing; elsewhere it keeps the interval you enter.',
        'Точка, якою ніхто не користується, теж тупикова: вода в ній нагрівається до кімнатної температури, і біоплівка росте. Типові випадки — порожні номери готелю, закрите крило, гостьові ванні, аварійні душі. Промивайте їх щотижня (HSG274) — або після 72 годин простою (VDI/DVGW 6023) — до стабільної температури; у Фландрії план має описувати захист від опіків під час гарячого промивання (ст. 7 / 14). Кожна рідко використовувана точка додає бали небезпеки й потрапляє до щотижневого завдання промивання. Для регіону Німеччина інструмент застосовує 72 години VDI/DVGW 6023 (3 дні) до застою й промивання; в інших регіонах — введений вами інтервал.',
        'Eine Entnahmestelle, die niemand nutzt, ist ebenfalls eine Totleitung: das Wasser darin erreicht Raumtemperatur, und der Biofilm wächst. Leere Hotelzimmer, ein geschlossener Flügel, Gästebäder und Notduschen sind typische Fälle. Spülen Sie sie wöchentlich (HSG274) — oder nach 72 Stunden ohne Nutzung (VDI/DVGW 6023) — bis die Temperatur konstant ist; in Flandern muss der Plan den Verbrühschutz beim Heißspülen beschreiben (Art. 7 / 14). Jede selten genutzte Stelle zählt bei den Gefährdungspunkten und kommt in die wöchentliche Spülaufgabe. Für die Region Deutschland wendet das Werkzeug die 72 Stunden der VDI/DVGW 6023 (3 Tage) auf Stagnation und Spülen an; sonst gilt das eingegebene Intervall.',
        'Een tappunt dat niemand gebruikt, is ook een dode leiding: het water erin warmt op tot kamertemperatuur en de biofilm groeit. Lege hotelkamers, een gesloten vleugel, gastenbadkamers en nooddouches zijn de gewone gevallen. Spoel ze wekelijks (HSG274) — of na 72 uur zonder gebruik (VDI/DVGW 6023) — tot de temperatuur stabiel is; in Vlaanderen moet het plan de bescherming tegen verbranding bij heet spoelen beschrijven (art. 7 / 14). Elk weinig gebruikt tappunt telt mee in de gevarenpunten en komt in de wekelijkse spoeltaak. Voor de regio Duitsland past de tool de 72 uur van VDI/DVGW 6023 (3 dagen) toe op stilstand en spoelen; elders geldt het ingevoerde interval.',
        'Un point que personne n’utilise est aussi un bras mort : l’eau y atteint la température ambiante et le biofilm se développe. Chambres d’hôtel vides, aile fermée, salles de bain d’amis et douches de sécurité sont les cas habituels. Rincez-les chaque semaine (HSG274) — ou après 72 heures sans usage (VDI/DVGW 6023) — jusqu’à température stable ; en Flandre, le plan doit décrire la protection contre les brûlures lors des rinçages à chaud (art. 7 / 14). Chaque point peu utilisé compte dans les points de danger et entre dans la tâche de rinçage hebdomadaire. Pour la région Allemagne, l’outil applique les 72 heures de la VDI/DVGW 6023 (3 jours) à la stagnation et au rinçage ; ailleurs, il garde l’intervalle saisi.',
        'Un punto que nadie usa también es un tramo muerto: el agua alcanza la temperatura ambiente y crece la biopelícula. Habitaciones de hotel vacías, un ala cerrada, baños de invitados y duchas de emergencia son los casos habituales. Púrguelos cada semana (HSG274), o tras 72 horas sin uso (VDI/DVGW 6023), hasta temperatura estable; en Flandes el plan debe describir la protección contra quemaduras al purgar con agua caliente (art. 7 / 14). Cada punto poco usado suma puntos de peligro y entra en la tarea semanal de purga. Para la región Alemania la herramienta aplica las 72 horas de la VDI/DVGW 6023 (3 días) al estancamiento y la purga; en otras regiones mantiene el intervalo introducido.',
        'Punkt, z którego nikt nie korzysta, też jest martwym odcinkiem: woda nagrzewa się do temperatury pokojowej, a biofilm rośnie. Puste pokoje hotelowe, zamknięte skrzydło, łazienki gościnne i prysznice awaryjne to typowe przypadki. Płucz je co tydzień (HSG274) — lub po 72 godzinach bez użycia (VDI/DVGW 6023) — do ustalenia temperatury; we Flandrii plan musi opisać ochronę przed oparzeniem przy płukaniu gorącą wodą (art. 7 / 14). Każdy rzadko używany punkt liczy się w punktach zagrożenia i trafia do cotygodniowego płukania. Dla regionu Niemcy narzędzie stosuje 72 godziny VDI/DVGW 6023 (3 dni) do stagnacji i płukania; gdzie indziej zachowuje wpisany interwał.') },
    screening: { title: T7('Risk class — ordinal, with reasons', 'Клас ризику — порядковий, з причинами', 'Risikoklasse — ordinal, mit Gründen', 'Risicoklasse — ordinaal, met redenen', 'Classe de risque — ordinale, avec raisons', 'Clase de riesgo — ordinal, con razones', 'Klasa ryzyka — porządkowa, z uzasadnieniem'),
      body: T7('Hazard points (temperatures, preheat, circulation stop, cold water, oversized dead legs, stagnant outlets) give the likelihood level H 1–4 (0 points → 1, 1–3 → 2, 4–7 → 3, ≥ 8 → 4; a store below 50 °C, or below 55 °C with care users, counts at least H 3 and the class at least high). Susceptibility of the users (care 3, accommodation and pools 2, others 1 — after the decree’s “sensitive persons”) plus aerosol exposure (number of showers, whirlpools) give the consequence C 1–4. R = H × C ranks low (≤ 3), moderate (4–6), high (8–9) or very high (≥ 12). Lab results can only raise the class. It is a screening scheme of this tool — a learning assumption — and never a probability of infection.',
        'Бали небезпеки (температури, попередній нагрів, зупинка циркуляції, холодна вода, завеликі тупикові ділянки, точки із застоєм) дають рівень імовірності H 1–4 (0 балів → 1, 1–3 → 2, 4–7 → 3, ≥ 8 → 4; накопичувач нижче 50 °C, або нижче 55 °C за користувачів закладів догляду, дає щонайменше H 3 і клас щонайменше високий). Вразливість користувачів (догляд 3, проживання й басейни 2, інші 1 — за «вразливими особами» постанови) плюс аерозоль (кількість душів, гідромасаж) дають наслідки C 1–4. R = H × C ранжує як низький (≤ 3), помірний (4–6), високий (8–9) або дуже високий (≥ 12). Лабораторні результати можуть лише підвищити клас. Це схема попередньої оцінки цього інструмента — навчальне припущення — і ніколи не ймовірність зараження.',
        'Gefährdungspunkte (Temperaturen, Vorwärmung, Zirkulationspause, Kaltwasser, zu große Totleitungen, stagnierende Stellen) ergeben die Eintrittsstufe H 1–4 (0 Punkte → 1, 1–3 → 2, 4–7 → 3, ≥ 8 → 4; ein Speicher unter 50 °C, bei Pflegebewohnern unter 55 °C, zählt mindestens H 3 und die Klasse mindestens hoch). Empfindlichkeit der Nutzer (Pflege 3, Beherbergung und Bäder 2, andere 1 — nach den „empfindlichen Personen“ des Erlasses) plus Aerosolexposition (Anzahl Duschen, Whirlpools) ergeben die Auswirkung C 1–4. R = H × C ordnet niedrig (≤ 3), mäßig (4–6), hoch (8–9) oder sehr hoch (≥ 12). Laborbefunde können die Klasse nur anheben. Es ist ein Einstufungsschema dieses Werkzeugs — eine Lernannahme — und nie eine Infektionswahrscheinlichkeit.',
        'Gevarenpunten (temperaturen, voorverwarming, circulatiestop, koud water, te grote dode leidingen, stilstaande tappunten) geven het waarschijnlijkheidsniveau H 1–4 (0 punten → 1, 1–3 → 2, 4–7 → 3, ≥ 8 → 4; een boiler onder 50 °C, of onder 55 °C bij zorggebruikers, telt minstens H 3 en de klasse minstens hoog). De gevoeligheid van de gebruikers (zorg 3, logies en zwembaden 2, andere 1 — naar de “gevoelige personen” van het besluit) plus de aerosolblootstelling (aantal douches, whirlpools) geven het gevolg C 1–4. R = H × C rangschikt laag (≤ 3), matig (4–6), hoog (8–9) of zeer hoog (≥ 12). Labouitslagen kunnen de klasse alleen verhogen. Het is een screeningsschema van deze tool — een leeraanname — en nooit een kans op besmetting.',
        'Les points de danger (températures, préchauffage, arrêt du bouclage, eau froide, bras morts trop grands, points stagnants) donnent le niveau de vraisemblance H 1–4 (0 point → 1, 1–3 → 2, 4–7 → 3, ≥ 8 → 4 ; un ballon sous 50 °C, ou sous 55 °C avec des usagers en soins, compte au moins H 3 et la classe au moins élevée). La sensibilité des usagers (soins 3, hébergement et piscines 2, autres 1 — d’après les « personnes sensibles » de l’arrêté) plus l’exposition aux aérosols (nombre de douches, bains à remous) donnent la conséquence C 1–4. R = H × C classe en faible (≤ 3), modéré (4–6), élevé (8–9) ou très élevé (≥ 12). Les analyses ne peuvent que relever la classe. C’est un barème de l’outil — une hypothèse pédagogique — et jamais une probabilité d’infection.',
        'Los puntos de peligro (temperaturas, precalentamiento, parada de recirculación, agua fría, tramos muertos excesivos, puntos estancados) dan el nivel de probabilidad H 1–4 (0 puntos → 1, 1–3 → 2, 4–7 → 3, ≥ 8 → 4; un acumulador por debajo de 50 °C, o de 55 °C con usuarios asistenciales, cuenta al menos H 3 y la clase al menos alta). La susceptibilidad de los usuarios (cuidados 3, alojamiento y piscinas 2, otros 1, según las «personas sensibles» del decreto) más la exposición a aerosoles (número de duchas, hidromasajes) dan la consecuencia C 1–4. R = H × C clasifica en bajo (≤ 3), moderado (4–6), alto (8–9) o muy alto (≥ 12). Los resultados de laboratorio solo pueden elevar la clase. Es un esquema de cribado de la herramienta, un supuesto didáctico, y nunca una probabilidad de infección.',
        'Punkty zagrożenia (temperatury, podgrzew wstępny, przerwa cyrkulacji, woda zimna, za duże martwe odcinki, punkty ze stagnacją) dają poziom prawdopodobieństwa H 1–4 (0 punktów → 1, 1–3 → 2, 4–7 → 3, ≥ 8 → 4; zasobnik poniżej 50 °C, lub poniżej 55 °C przy pensjonariuszach opieki, daje co najmniej H 3 i klasę co najmniej wysoką). Wrażliwość użytkowników (opieka 3, zakwaterowanie i baseny 2, inne 1 — wg „osób wrażliwych” rozporządzenia) plus ekspozycja na aerozol (liczba pryszniców, wanny z hydromasażem) dają skutek C 1–4. R = H × C klasyfikuje jako niskie (≤ 3), umiarkowane (4–6), wysokie (8–9) lub bardzo wysokie (≥ 12). Wyniki laboratoryjne mogą klasę tylko podnieść. To schemat oceny tego narzędzia — założenie dydaktyczne — i nigdy prawdopodobieństwo zakażenia.') },
    plan: { title: T7('The control plan', 'План контролю', 'Der Kontrollplan', 'Het beheersplan', 'Le plan de maîtrise', 'El plan de control', 'Plan kontroli'),
      body: T7('Periodic tasks follow the findings: monthly temperature checks at the heater and at sentinel outlets, weekly flushing of every little-used outlet, quarterly cleaning of shower heads, a yearly heater service (statutory under Art. 18), sampling at the frequency of the plan (monthly when the alert level is reached) and a review of the risk analysis. The CSV uses the fields of the maintenance planner (id, asset, task, interval in days and months, trade, hours, statutory, basis). One-off measures — raise the setpoint, rebalance, shorten dead legs, disinfect at 70 °C — are listed separately.',
        'Періодичні завдання випливають із висновків: щомісячні вимірювання температури на нагрівачі й у контрольних точках, щотижневе промивання кожної рідко використовуваної точки, щоквартальне чищення душових лійок, щорічне обслуговування нагрівача (обов’язкове за ст. 18), відбір проб із частотою плану (щомісяця на рівні підвищеної пильності) і перегляд аналізу ризику. CSV використовує поля планувальника ТО (id, обладнання, завдання, інтервал у днях і місяцях, фах, години, обов’язковість, підстава). Разові заходи — підняти уставку, перебалансувати, скоротити тупикові ділянки, дезінфікувати при 70 °C — подано окремо.',
        'Wiederkehrende Aufgaben folgen aus den Befunden: monatliche Temperaturkontrollen am Speicher und an Referenzstellen, wöchentliches Spülen jeder selten genutzten Stelle, vierteljährliche Reinigung der Duschköpfe, jährliche Speicherwartung (Pflicht nach Art. 18), Probenahme in der Häufigkeit des Plans (monatlich bei Alarmstufe) und Überprüfung der Gefährdungsanalyse. Die CSV nutzt die Felder des Wartungsplaners (ID, Anlage, Aufgabe, Intervall in Tagen und Monaten, Gewerk, Stunden, gesetzlich, Grundlage). Einmalige Maßnahmen — Sollwert anheben, abgleichen, Totleitungen kürzen, bei 70 °C desinfizieren — stehen getrennt.',
        'Periodieke taken volgen uit de vaststellingen: maandelijkse temperatuurcontroles aan de boiler en aan referentietappunten, wekelijks spoelen van elk weinig gebruikt tappunt, driemaandelijks reinigen van douchekoppen, jaarlijks onderhoud van de boiler (verplicht volgens art. 18), staalname met de frequentie van het plan (maandelijks bij verhoogde waakzaamheid) en herziening van de risicoanalyse. De CSV gebruikt de velden van de onderhoudsplanner (id, installatie, taak, interval in dagen en maanden, vakdiscipline, uren, wettelijk, basis). Eenmalige maatregelen — setpoint verhogen, inregelen, dode leidingen inkorten, ontsmetten op 70 °C — staan apart.',
        'Les tâches périodiques découlent des constats : contrôles mensuels de température au préparateur et aux points témoins, rinçage hebdomadaire de chaque point peu utilisé, nettoyage trimestriel des pommes de douche, entretien annuel du préparateur (obligatoire selon l’art. 18), prélèvements à la fréquence du plan (mensuels en vigilance renforcée) et revue de l’analyse de risque. Le CSV reprend les champs du planificateur de maintenance (id, équipement, tâche, intervalle en jours et mois, métier, heures, réglementaire, fondement). Les mesures ponctuelles — relever la consigne, rééquilibrer, raccourcir les bras morts, désinfecter à 70 °C — sont listées à part.',
        'Las tareas periódicas se derivan de los hallazgos: controles mensuales de temperatura en el acumulador y en puntos centinela, purga semanal de cada punto poco usado, limpieza trimestral de alcachofas, mantenimiento anual del acumulador (obligatorio según el art. 18), muestreo con la frecuencia del plan (mensual en vigilancia reforzada) y revisión del análisis de riesgos. El CSV usa los campos del planificador de mantenimiento (id, equipo, tarea, intervalo en días y meses, oficio, horas, reglamentaria, base). Las medidas puntuales —subir la consigna, reequilibrar, acortar tramos muertos, desinfectar a 70 °C— se listan aparte.',
        'Zadania okresowe wynikają z ustaleń: comiesięczne pomiary temperatury przy podgrzewaczu i w punktach kontrolnych, cotygodniowe płukanie każdego rzadko używanego punktu, kwartalne czyszczenie słuchawek prysznicowych, coroczny serwis podgrzewacza (obowiązkowy wg art. 18), pobór próbek z częstotliwością z planu (co miesiąc przy podwyższonej czujności) i przegląd analizy ryzyka. CSV używa pól planera utrzymania (id, urządzenie, zadanie, interwał w dniach i miesiącach, branża, godziny, ustawowe, podstawa). Działania jednorazowe — podnieść nastawę, zrównoważyć, skrócić martwe odcinki, zdezynfekować w 70 °C — są wymienione osobno.') }
  },

/* ---------- chart: risk matrix + dead-leg volumes ---------- */
var CL_COL = { low: '#2e8b57', moderate: '#d4a017', high: '#e07020', very_high: '#c0392b' };
function drawChart(ctx, w, h, coarse) {

  var muted = cs.getPropertyValue('--muted').trim() || '#777', line = cs.getPropertyValue('--line').trim() || '#ddd', ink = cs.getPropertyValue('--text').trim() || '#222';
  var font = cs.getPropertyValue('--font').trim() || 'sans-serif';
  ctx.clearRect(0, 0, w, h);
  if (!last || !last.valid) return;
  var split = w >= 560 ? Math.min(w * 0.45, 360) : w, mh = w >= 560 ? h : Math.min(h * 0.55, 260);
  /* matrix */
  var padL = 34, padB = 30, padT = 10, size = Math.max(60, Math.min(split - padL - 10, mh - padB - padT)), cell = size / 4, x0 = padL, y0 = padT;
  ctx.font = '400 12px ' + font;
  for (var Hh = 1; Hh <= 4; Hh++) for (var Cc = 1; Cc <= 4; Cc++) {
    var cls = LEG.CLASSES[Hh * Cc <= 3 ? 0 : (Hh * Cc <= 6 ? 1 : (Hh * Cc <= 9 ? 2 : 3))];
    var cx = x0 + (Cc - 1) * cell, cy = y0 + (4 - Hh) * cell;
    ctx.globalAlpha = 0.28; ctx.fillStyle = CL_COL[cls]; ctx.fillRect(cx + 1, cy + 1, cell - 2, cell - 2); ctx.globalAlpha = 1;
    ctx.fillStyle = muted; ctx.textAlign = 'center'; ctx.fillText(String(Hh * Cc), cx + cell / 2, cy + cell / 2 + 4);
  }
  var mx = x0 + (last.C - 1) * cell, my = y0 + (4 - last.H) * cell;
  ctx.strokeStyle = ink; ctx.lineWidth = 3; ctx.strokeRect(mx + 2, my + 2, cell - 4, cell - 4);
  ctx.fillStyle = CL_COL[last.class_screen]; ctx.beginPath(); ctx.arc(mx + cell / 2, my + cell / 2 - 12, 5, 0, 6.2832); ctx.fill();
  ctx.fillStyle = muted; ctx.textAlign = 'center';
  for (var i = 1; i <= 4; i++) { ctx.fillText(String(i), x0 + (i - 0.5) * cell, y0 + size + 14); ctx.textAlign = 'right'; ctx.fillText(String(i), x0 - 6, y0 + (4 - i + 0.5) * cell + 4); ctx.textAlign = 'center'; }
  if (!coarse) { ctx.fillText(S('chart.C'), x0 + size / 2, y0 + size + 27); ctx.save(); ctx.translate(11, y0 + size / 2); ctx.rotate(-Math.PI / 2); ctx.fillText(S('chart.H'), 0, 0); ctx.restore(); }
  /* dead legs */
  var bx0 = w >= 560 ? split + 30 : 10, by0 = w >= 560 ? padT : mh + 16, bw = w - bx0 - 12, bh = (w >= 560 ? h - padT - padB : h - by0 - padB);
  ctx.textAlign = 'left'; ctx.fillStyle = ink; ctx.fillText(S('chart.legs'), bx0, by0 + 10);
  var legs = last.dead_legs;
  if (!legs.length || bw < 60 || bh < 40) { if (bw >= 60) { ctx.fillStyle = muted; ctx.fillText(S('chart.nolegs'), bx0, by0 + 30); } return; }
  var lim = state.dead_leg_L, vmax = Math.max(lim * 1.25, legs.reduce(function (m, l) { return Math.max(m, l.V_L); }, 0) * 1.1);
  var labW = Math.min(150, bw * 0.38), px0 = bx0 + labW, pw = bw - labW, top = by0 + 20, rowH = Math.min(26, (bh - 24) / legs.length);
  var X = function (v) { return px0 + pw * v / vmax; };
  legs.forEach(function (l, k) {
    var y = top + k * rowH;
    ctx.fillStyle = muted; ctx.textAlign = 'right';
    var name = l.id.length > 22 ? l.id.slice(0, 21) + '…' : l.id; ctx.fillText(name, px0 - 6, y + rowH * 0.65);
    ctx.fillStyle = l.over_volume ? CL_COL.very_high : (l.hot ? CL_COL.moderate : '#3b7dd8');
    ctx.fillRect(px0, y + 3, Math.max(1, X(l.V_L) - px0), rowH - 6);
    ctx.fillStyle = ink; ctx.textAlign = 'left'; ctx.fillText(fmt(l.V_L, 2), Math.min(X(l.V_L) + 4, w - 40), y + rowH * 0.65);
  });
  var ly = top + legs.length * rowH;
  ctx.setLineDash([6, 4]); ctx.strokeStyle = CL_COL.very_high; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(X(lim), top - 4); ctx.lineTo(X(lim), ly + 2); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = CL_COL.very_high; ctx.textAlign = 'center'; ctx.fillText(S('chart.lim') + ' ' + fmt(lim, 1) + ' L', X(lim), ly + 16);
