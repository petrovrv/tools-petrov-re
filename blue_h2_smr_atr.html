    "en": "The reformer outlet is solved at chemical equilibrium on element balances, the shift outlet at water-gas shift equilibrium and the PSA recovers a set fraction of the hydrogen. The reformer duty follows from formation enthalpies and mean heat capacities; in an SMR it is met by burning the PSA tail gas plus trim natural gas, in an ATR by partial oxidation with oxygen. Capture can be applied to the syngas only or also to the furnace flue gas, with the solvent heat raised in a gas-fired boiler. Results include natural gas use and efficiency on the LHV basis, electricity, CO₂ generated, captured and emitted, the overall capture rate and the life-cycle carbon intensity including upstream gas and grid electricity.",

              'Le captage sur gaz de synthèse (p. ex. MDEA après conversion) retire environ 95 % du CO₂ de procédé à forte pression partielle avec de la chaleur basse température, mais laisse les fumées du four : un SMR n\'atteint alors que 55-70 % au total. Un lavage aux amines des fumées porte ce taux au-delà de 90 %, mais demande environ 2,5-3,5 GJ de chaleur de régénération par tonne de CO₂, fournie ici par une chaudière au gaz dont le CO₂ est aussi capté.',
              'La captura en el gas de síntesis (p. ej. MDEA tras el desplazamiento) elimina cerca del 95 % del CO₂ de proceso a alta presión parcial con calor de baja temperatura, pero deja los gases del horno: un SMR alcanza entonces solo el 55-70 % global. Añadir captura con aminas en los gases de combustión lo eleva por encima del 90 %, pero requiere unos 2,5-3,5 GJ de calor de regeneración por tonelada de CO₂, aquí de una caldera de gas cuyo CO₂ también se captura.',
              'Wychwyt z gazu syntezowego (np. MDEA za konwersją) usuwa ok. 95 % CO₂ procesowego przy wysokim ciśnieniu cząstkowym z użyciem ciepła niskotemperaturowego, lecz pomija spaliny pieca: SMR osiąga wtedy tylko 55-70 % ogółem. Dodanie aminowego wychwytu ze spalin podnosi to powyżej 90 %, ale wymaga ok. 2,5-3,5 GJ ciepła regeneracji na tonę CO₂, tu z kotła gazowego, którego CO₂ też jest wychwytywany.'
            )

          balance: {
            title: T('Feed, efficiency and carbon balance', 'Сировина, ККД і баланс вуглецю', 'Einsatz, Wirkungsgrad und Kohlenstoffbilanz', 'Voeding, rendement en koolstofbalans', 'Charge, rendement et bilan carbone', 'Carga, eficiencia y balance de carbono', 'Wsad, sprawność i bilans węgla'),
            body: T(
              'All natural gas (feed, trim fuel and boiler fuel) is counted on its ISO 6976:2016 LHV at 25 °C, and the efficiency is the hydrogen LHV divided by it. Every carbon atom fed ends up as CO₂, captured or emitted, so a grey SMR produces about 8.5-9 kg CO₂ per kg H₂. Steam export and power from surplus heat are not credited.',
              'Увесь природний газ (сировина, додаткове паливо, паливо котла) враховується за НТЗ за ISO 6976:2016 при 25 °C, а ККД — це НТЗ водню, поділена на нього. Кожен атом вуглецю сировини стає CO₂, уловленим або викинутим, тож сірий SMR дає близько 8,5-9 кг CO₂ на кг H₂. Експорт пари й електроенергія з надлишкового тепла не зараховуються.',
              'Das gesamte Erdgas (Einsatz, Zusatzbrennstoff, Kesselbrennstoff) wird mit seinem Heizwert nach ISO 6976:2016 bei 25 °C gezählt; der Wirkungsgrad ist der Heizwert des Wasserstoffs geteilt durch diesen. Jedes Kohlenstoffatom endet als CO₂, abgeschieden oder emittiert, ein graues SMR erzeugt also etwa 8,5-9 kg CO₂ je kg H₂. Dampfexport und Strom aus Überschusswärme werden nicht gutgeschrieben.',
              'Al het aardgas (voeding, bijstook, ketelbrandstof) telt mee op zijn LHV volgens ISO 6976:2016 bij 25 °C, en het rendement is de LHV van de waterstof gedeeld daardoor. Elk koolstofatoom eindigt als CO₂, afgevangen of uitgestoten, dus een grijze SMR maakt circa 8,5-9 kg CO₂ per kg H₂. Stoomexport en stroom uit overschotwarmte worden niet gecrediteerd.',
              'Tout le gaz naturel (charge, appoint, chaudière) est compté sur son PCI ISO 6976:2016 à 25 °C, et le rendement est le PCI de l\'hydrogène divisé par celui-ci. Chaque atome de carbone finit en CO₂, capté ou émis : un SMR gris produit environ 8,5-9 kg de CO₂ par kg de H₂. L\'export de vapeur et l\'électricité tirée de la chaleur excédentaire ne sont pas crédités.',
              'Todo el gas natural (carga, combustible de apoyo y de caldera) se cuenta por su PCI según ISO 6976:2016 a 25 °C, y la eficiencia es el PCI del hidrógeno dividido entre él. Cada átomo de carbono termina como CO₂, capturado o emitido, así que un SMR gris produce unos 8,5-9 kg de CO₂ por kg de H₂. No se acreditan la exportación de vapor ni la electricidad del calor sobrante.',
              'Cały gaz ziemny (wsad, paliwo dodatkowe, paliwo kotła) liczony jest według wartości opałowej wg ISO 6976:2016 w 25 °C, a sprawność to wartość opałowa wodoru podzielona przez nią. Każdy atom węgla kończy jako CO₂, wychwycony lub wyemitowany, więc szary SMR daje ok. 8,5-9 kg CO₂ na kg H₂. Eksport pary i energia z nadwyżki ciepła nie są zaliczane.'
            )
          },
          electricity: {
            title: T('Electricity demand', 'Споживання електроенергії', 'Strombedarf', 'Elektriciteitsvraag', 'Besoin d\'électricité', 'Demanda eléctrica', 'Zapotrzebowanie na energię elektryczną'),
            body: T(
              'Electricity covers pumps, fans and PSA (about 0.5 kWh/kg H₂), compression of the captured CO₂ to pipeline pressure (about 100 kWh/t CO₂) and, for ATR, the air separation unit. Its emissions enter the carbon intensity through the grid emission factor.',
              'Електроенергія потрібна для насосів, вентиляторів і PSA (близько 0,5 кВт·год/кг H₂), стиснення вловленого CO₂ до тиску трубопроводу (близько 100 кВт·год/т CO₂) і для ATR — установки розділення повітря. Її викиди входять у вуглецеву інтенсивність через коефіцієнт викидів мережі.',
              'Strom versorgt Pumpen, Gebläse und PSA (etwa 0,5 kWh/kg H₂), die Verdichtung des abgeschiedenen CO₂ auf Pipelinedruck (etwa 100 kWh/t CO₂) und beim ATR die Luftzerlegung. Seine Emissionen gehen über den Netz-Emissionsfaktor in die CO₂-Intensität ein.',
              'Elektriciteit dekt pompen, ventilatoren en PSA (circa 0,5 kWh/kg H₂), compressie van het afgevangen CO₂ tot leidingdruk (circa 100 kWh/t CO₂) en bij ATR de luchtscheider. De emissies tellen via de emissiefactor van het net mee in de koolstofintensiteit.',
              'L\'électricité alimente pompes, ventilateurs et PSA (environ 0,5 kWh/kg H₂), la compression du CO₂ capté à la pression du pipeline (environ 100 kWh/t CO₂) et, pour l\'ATR, l\'unité de séparation d\'air. Ses émissions entrent dans l\'intensité carbone via le facteur d\'émission du réseau.',
              'La electricidad cubre bombas, ventiladores y PSA (unos 0,5 kWh/kg H₂), la compresión del CO₂ capturado a presión de gasoducto (unos 100 kWh/t CO₂) y, en el ATR, la separación de aire. Sus emisiones entran en la intensidad de carbono mediante el factor de emisión de la red.',
              'Energia elektryczna zasila pompy, wentylatory i PSA (ok. 0,5 kWh/kg H₂), sprężanie wychwyconego CO₂ do ciśnienia rurociągu (ok. 100 kWh/t CO₂), a w ATR tlenownię. Jej emisje wchodzą do intensywności emisji przez wskaźnik emisji sieci.'

          intensity: {
            title: T('Carbon intensity and the low-carbon threshold', 'Вуглецева інтенсивність і поріг низьковуглецевості', 'CO₂-Intensität und Schwelle für kohlenstoffarm', 'Koolstofintensiteit en de koolstofarme drempel', 'Intensité carbone et seuil bas carbone', 'Intensidad de carbono y umbral bajo en carbono', 'Intensywność emisji i próg niskoemisyjności'),
            body: T(
              'CI = uncaptured CO₂ + upstream natural-gas emissions (production, processing, transport and methane leaks, typically 5-20 g CO₂e/MJ) + electricity emissions. EU rules count hydrogen as low-carbon or RFNBO-equivalent when it saves 70 % against the 94 g CO₂e/MJ fossil comparator: 28.2 g/MJ, or 3.38 kg CO₂e/kg H₂ on the LHV basis. Upstream methane often decides whether blue hydrogen passes.',
              'CI = неуловлений CO₂ + викиди ланцюга постачання газу (видобуток, підготовка, транспорт і витоки метану, зазвичай 5-20 г CO₂e/МДж) + викиди електроенергії. Правила ЄС вважають водень низьковуглецевим за економії 70 % відносно викопного еталона 94 г CO₂e/МДж: 28,2 г/МДж, або 3,38 кг CO₂e/кг H₂ за НТЗ. Часто саме викиди метану в ланцюгу вирішують, чи проходить синій водень.',
              'CI = nicht abgeschiedenes CO₂ + Vorkettenemissionen des Erdgases (Förderung, Aufbereitung, Transport und Methanleckagen, typisch 5-20 g CO₂e/MJ) + Stromemissionen. EU-Regeln werten Wasserstoff als kohlenstoffarm bei 70 % Einsparung gegenüber dem fossilen Vergleichswert von 94 g CO₂e/MJ: 28,2 g/MJ bzw. 3,38 kg CO₂e/kg H₂ auf Heizwertbasis. Oft entscheidet das Vorketten-Methan, ob blauer Wasserstoff besteht.',
              'CI = niet-afgevangen CO₂ + ketenemissies van het aardgas (winning, behandeling, transport en methaanlekken, typisch 5-20 g CO₂e/MJ) + elektriciteitsemissies. EU-regels noemen waterstof koolstofarm bij 70 % besparing ten opzichte van de fossiele referentie van 94 g CO₂e/MJ: 28,2 g/MJ of 3,38 kg CO₂e/kg H₂ op LHV-basis. Vaak beslist het ketenmethaan of blauwe waterstof slaagt.',
              'CI = CO₂ non capté + émissions amont du gaz (production, traitement, transport et fuites de méthane, typiquement 5-20 g CO₂e/MJ) + émissions de l\'électricité. Les règles de l\'UE qualifient l\'hydrogène de bas carbone pour 70 % de réduction par rapport au comparateur fossile de 94 g CO₂e/MJ : 28,2 g/MJ, soit 3,38 kg CO₂e/kg H₂ sur base PCI. Le méthane amont décide souvent si l\'hydrogène bleu passe.',
              'CI = CO₂ no capturado + emisiones aguas arriba del gas (producción, tratamiento, transporte y fugas de metano, típicamente 5-20 g CO₂e/MJ) + emisiones de la electricidad. Las normas de la UE consideran bajo en carbono el hidrógeno que ahorra un 70 % frente al comparador fósil de 94 g CO₂e/MJ: 28,2 g/MJ, o 3,38 kg CO₂e/kg H₂ en base PCI. A menudo el metano aguas arriba decide si el hidrógeno azul cumple.',
              'CI = niewychwycony CO₂ + emisje łańcucha dostaw gazu (wydobycie, przygotowanie, transport i wycieki metanu, zwykle 5-20 g CO₂e/MJ) + emisje energii elektrycznej. Przepisy UE uznają wodór za niskoemisyjny przy 70 % redukcji względem kopalnego punktu odniesienia 94 g CO₂e/MJ: 28,2 g/MJ, czyli 3,38 kg CO₂e/kg H₂ według wartości opałowej. Często to metan w łańcuchu dostaw decyduje, czy niebieski wodór spełnia próg.'
            )
          }

            if (wpx > 36) { ctx.fillStyle = muted; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(DiagramUI.fmt(parts[i].v, { precision: 2 }), X(x) + wpx / 2, y + bh / 2); }
            x += parts[i].v;
          }
        }
        bar(y1, [{ v: r.cap_syn_kg_kg, s: 0 }, { v: r.cap_flue_kg_kg, s: 1 }, { v: r.co2_emit_kg_kg, s: 3 }], 'CO₂, kg/kg H₂');
        bar(y2, [{ v: bd.direct_kg_kg, s: 3 }, { v: bd.upstream_kg_kg, s: 4 }, { v: bd.electricity_kg_kg, s: 2 }], 'CI, kg CO₂e/kg H₂');
        ctx.strokeStyle = muted; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(X(3.38), y2 - 6); ctx.lineTo(X(3.38), y2 + bh + 6); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText('3.38', X(3.38), y2 + bh + 7);
        ctx.strokeStyle = line; ctx.beginPath(); ctx.moveTo(L, TOP + ph); ctx.lineTo(L + pw, TOP + ph); ctx.stroke();
        var xt = DiagramUI.ticks(0, x1, pw, size.density);
        ctx.fillStyle = muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        for (k = 0; k < xt.length; k++) { if (xt[k] < 0 || xt[k] > x1) continue; ctx.beginPath(); ctx.moveTo(X(xt[k]), TOP + ph); ctx.lineTo(X(xt[k]), TOP + ph + 4); ctx.stroke(); ctx.fillText(DiagramUI.fmt(xt[k], { precision: 0 }), X(xt[k]), TOP + ph + 6); }
      }
    });
    adoptStage(ui);

    ui.ready();
    window['__blue_h2_smr_atr'] = { ui: ui, state: state, solve: solve, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function isPosNum(v) {
    return typeof v === 'number' && isFinite(v) && v > 0;
  }

  function buildRecord() {
    if (!last) return null;
    var inKeys = ['level', 'process', 'capture', 'cap_t_d', 'x_ch4', 'x_c2h6', 'x_c3h8', 'x_co2', 'x_n2', 'SC', 'OC', 'T_ref', 'p_ref', 'T_in', 'T_shift', 'R_psa', 'eta_f',
                  'r_syn', 'r_flue', 'e_reb', 'eta_boiler', 'e_comp', 'e_asu', 'e_aux', 'CI_up', 'EF_el'],
        outKeys = ['X_ch4', 'h2_per_mol_ng', 'Q_ref_kJ_mol', 'trim_frac', 'boiler_frac', 'e_ng_MJ_kg', 'ng_kg_kg', 'eta_LHV', 'el_kWh_kg', 'co2_gen_kg_kg', 'co2_cap_kg_kg',
                   'co2_emit_kg_kg', 'cap_syn_kg_kg', 'cap_flue_kg_kg', 'cap_rate', 'CI_kg_kg', 'CI_g_MJ', 'ng_t_d', 'co2_cap_t_d', 'co2_emit_t_d', 'o2_t_d', 'basis', 'verdict'],
        inputs = {}, outputs = {}, units = {}, warnings = [], i, k;
    var UNIT = {
      level: '-', process: '-', capture: '-', cap_t_d: 't/d', x_ch4: '-', x_c2h6: '-', x_c3h8: '-', x_co2: '-', x_n2: '-', SC: 'mol/mol', OC: 'mol/mol', T_ref: 'K', p_ref: 'Pa',
      T_in: 'K', T_shift: 'K', R_psa: '-', eta_f: '-', r_syn: '-', r_flue: '-', e_reb: 'GJ/t CO2', eta_boiler: '-', e_comp: 'kWh/t CO2', e_asu: 'kWh/kg O2', e_aux: 'kWh/kg H2',
      CI_up: 'g CO2e/MJ (LHV)', EF_el: 'kg CO2e/kWh', X_ch4: '-', h2_per_mol_ng: 'mol/mol', Q_ref_kJ_mol: 'kJ/mol NG', trim_frac: 'mol/mol', boiler_frac: 'mol/mol',
      e_ng_MJ_kg: 'MJ/kg H2 (LHV)', ng_kg_kg: 'kg/kg H2', eta_LHV: '- (LHV)', el_kWh_kg: 'kWh/kg H2', co2_gen_kg_kg: 'kg/kg H2', co2_cap_kg_kg: 'kg/kg H2', co2_emit_kg_kg: 'kg/kg H2',
      cap_syn_kg_kg: 'kg/kg H2', cap_flue_kg_kg: 'kg/kg H2', cap_rate: '-', CI_kg_kg: 'kg CO2e/kg H2', CI_g_MJ: 'g CO2e/MJ H2 (LHV)', ng_t_d: 't/d', co2_cap_t_d: 't/d',
      co2_emit_t_d: 't/d', o2_t_d: 't/d', basis: '-', verdict: '-'
    };
    for (i = 0; i < inKeys.length; i++) { k = inKeys[i]; inputs[k] = state[k]; units[k] = UNIT[k]; }
    if (last.ok) {
      for (i = 0; i < outKeys.length; i++) { k = outKeys[i]; outputs[k] = last[k]; units[k] = UNIT[k]; }
      warnings = (last.warnings || []).slice();
    } else {
      warnings = [last.error];
    }
    return {
      inputs: inputs, outputs: outputs, units: units,
      model: {
        equations: [
          'Reformer equilibrium: Kp1 = exp(-26830/T + 30.114) bar^2 (CH4 + H2O = CO + 3H2), Kp2 = exp(4400/T - 4.036) (CO + H2O = CO2 + H2), element balance C, H, O',
          'Shift: WGS equilibrium at T_shift with CH4 frozen; PSA product = R_psa * H2',
          'Q_ref = sum n (hf + cp (T_ref - 298.15)) out - sum n (hf + cp (T_in - 298.15)) in',
          'SMR fuel: tail gas LHV + trim NG LHV = Q_ref/eta_f; capture boiler: eta_b NG_b LHV = e_reb r_flue (CO2_flue + CO2_boiler)',
          'CI = CO2 emitted + e_NG CI_up + electricity EF_el; low carbon if CI <= 3.38 kg CO2e/kg H2'
        ],
        ranges: ['T_ref 600-1100 C', 'p_ref 1-60 bar', 'S/C 1-6'],
        notes: ['Steam export, power generation from surplus heat and methane leaks at the plant are not credited or counted', 'Mean heat capacities 298-1100 K', 'Energy basis LHV, natural gas per ISO 6976:2016 at 25 C']
      },
      warnings: warnings
    };
  }

  function hoRow(o) { var r = {}, k; for (k in o) if (typeof o[k][0] === 'number' && isFinite(o[k][0])) r[k] = { value: o[k][0], unit: o[k][1] }; return r; }

  var HANDOFF = {
    provides: ['mdot', 'p', 'T'],
    accepts: [],
    build: function () {
      if (!last || !last.ok) return null;
      return {
        quantities: {
          mdot: { value: last.mdot, unit: 'kg/s' },
          p: { value: state.p_ref * 0.9, unit: 'Pa' },
          T: { value: 313.15, unit: 'K' }
        },
        sets: {
          h2_product: [hoRow({ purity: [0.999, '-'], CI_kgCO2e_kg: [last.CI_kg_kg, 'kg/kg'], e_ng: [last.e_ng_MJ_kg * 1e6, 'J/kg'] })],
          composition: [hoRow({ h2: [1, '-'] })]
        }
      };
    },
    apply: function () {}
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'blue_h2_smr_atr',
        file: 'blue_h2_smr_atr.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
