/* Vendor-neutral execution model. All physical quantities use SI units. */
const Lab = (() => {
  'use strict';
  const SCHEMA = 'tools.petrov.re/plcddclab-project/v1';
  const clone = x => JSON.parse(JSON.stringify(x));
  const own = (o,k) => Object.prototype.hasOwnProperty.call(o,k);
  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const finite = x => typeof x === 'number' && Number.isFinite(x);
  const defs = {};
  function def(names,pins,params={},state=false) { names.split(' ').forEach(n=>defs[n]={pins:pins.split(' ').filter(Boolean),params,state}); }
  def('AI DI TAG','',{tag:'INPUT'}); def('AO DO','IN',{tag:'OUTPUT'});
  def('CONST','',{value:0}); def('AND OR XOR','A B'); def('NOT','IN');
  def('SR RS','S R',{},true); def('R_TRIG F_TRIG','IN',{},true);
  def('TON TOF TP','IN',{PT:5},true); def('DELAY','IN',{initial:0},true);
  def('CMP','A B',{op:'>'}); def('ADD SUB MUL DIV MIN MAX','A B'); def('ABS','IN');
  def('SCALE','IN',{inMin:0,inMax:10,outMin:0,outMax:1}); def('LIMIT','IN',{min:0,max:1});
  def('SELECT','G A B'); def('HYSTERESIS','IN',{low:0.3,high:0.8,inverse:true},true);
  def('DEADBAND','IN',{width:0.05}); def('P PI PID','SP PV MAN MV',{Kp:0.2,Ti:20,Td:0,min:0,max:1,reverse:false},true);
  const faults = ['stuck','bias','gain','noise','range','loss','slow','failOpen','failClosed','reversed','partial','failedStart','trip','feedbackOff','feedbackOn','communication','bypass','alarmDisabled','manual'];
  const types = ['tank','pipe','pump','valve','motor','fan','heater','cooler','zone','sensor','switch','actuator'];
  function block(type,id,x=0,y=0) {return {id,type,x,y,p:clone(defs[type]?.params||{}),inputs:Object.fromEntries((defs[type]?.pins||[]).map(k=>[k,0]))};}
  function tag(value=0,type='REAL',unit='1'){return {value,type,unit,quality:'good',source:'project',time:0};}
  function empty(){return {schema:SCHEMA,metadata:{name:'Control project',preset:'blank'},controller:{type:'PLC',language:'FBD',scan:0.1,blocks:[],wires:[],rungs:[],tags:{}},plant:{step:0.01,components:[],connections:[]},faults:[],forces:{},tests:[],seed:104729,view:{snap:20,grid:true,watch:[],trends:[]}};}
  function diagnostic(code,object='',detail='',severity='error'){return {code,object,detail:String(detail),severity};}
  function validate(p){
    const d=[]; const add=(c,o='',x='',s='error')=>d.push(diagnostic(c,o,x,s));
    if(!p||p.schema!==SCHEMA||!p.controller||!p.plant) return [diagnostic('schema')];
    const c=p.controller,pl=p.plant;
    if(!finite(c.scan)||c.scan<0.001||c.scan>10) add('scan');
    if(!finite(pl.step)||pl.step<=0||pl.step>c.scan||c.scan/pl.step>1000) add('solver');
    if(!Array.isArray(c.blocks)||!Array.isArray(c.wires)||!Array.isArray(pl.components)||!Array.isArray(c.rungs)||!Array.isArray(p.tests)||!Array.isArray(p.faults)||!c.tags||!p.forces||!p.view) return d.concat(diagnostic('schema'));
    if(c.blocks.length>500||c.wires.length>2000||pl.components.length>100||p.tests.length>100||p.faults.length>200) add('capacity');
    if(!['PLC','DDC'].includes(c.type)||!['FBD','LD'].includes(c.language)) add('language');
    const ids=new Set(),writers=new Map(),components=new Map();
    for(const b of c.blocks){
      if(!b||!defs[b.type]){add('block',b?.id);continue;}
      if(!/^[A-Za-z_][\w-]{0,79}$/.test(b.id)||ids.has(b.id))add('duplicate',b.id);ids.add(b.id);
      if(!b.p||!b.inputs||!finite(b.x)||!finite(b.y)) {add('parameter',b.id);continue;}
      for(const [k,v]of Object.entries(b.p)) if(typeof v==='number'&&!finite(v))add('parameter',b.id,k);
      if(['TON','TOF','TP'].includes(b.type)&&(!finite(b.p.PT)||b.p.PT<0))add('timer',b.id);
      if(['PI','PID'].includes(b.type)&&!(b.p.Ti>0))add('pid',b.id,'Ti');
      if(['P','PI','PID','LIMIT'].includes(b.type)&&!(b.p.max>b.p.min))add('range',b.id);
      if(b.type==='HYSTERESIS'&&!(b.p.high>b.p.low))add('range',b.id);
      if(b.type==='SCALE'&&!(b.p.inMax>b.p.inMin))add('range',b.id);
      if(['AI','DI','TAG'].includes(b.type)&&!own(c.tags,b.p.tag))add('tag',b.id,b.p.tag);
      if(['AO','DO'].includes(b.type)) {if(writers.has(b.p.tag))add('writers',b.p.tag);writers.set(b.p.tag,b.id);if(!own(c.tags,b.p.tag))add('tag',b.id,b.p.tag);}
      for(const pin of defs[b.type].pins)if(!own(b.inputs,pin)&&!c.wires.some(w=>w.to===b.id&&w.pin===pin))add('unconnected',b.id,pin);

const LearnContent=(()=>{
const rows={
scan:[ 'scanPeriod',
'One scan samples sensors into an input image, evaluates FBD in deterministic topological order (or Ladder rungs from top to bottom), commits outputs, advances actuator and plant substeps, then records diagnostics. Outputs are held for the whole plant interval. A timer counts the current true input interval; PT is rounded up to a scan boundary. DELAY explicitly reads the previous scan and breaks feedback cycles. All other algebraic cycles are rejected. Changing logic resets simulation time.',
'Кожний цикл зчитує датчики в образ входів, обчислює FBD у топологічному порядку (або Ladder зверху вниз), фіксує виходи, виконує підкроки об’єкта та записує діагностику. Виходи сталі протягом інтервалу. Таймер рахує поточний істинний інтервал; PT округлюється вгору до межі циклу. DELAY читає попередній цикл і розриває зворотні зв’язки. Інші алгебраїчні цикли відхиляються. Зміна логіки скидає час.',
'Ein Zyklus liest Sensoren ins Eingangsabbild, berechnet FBD topologisch (oder Ladder von oben nach unten), übernimmt Ausgänge, integriert Stellglieder und Anlage und protokolliert die Diagnose. Ausgänge bleiben über das Intervall konstant. Timer zählen das aktuelle wahre Intervall; PT wird auf die nächste Zyklusgrenze aufgerundet. DELAY liest den vorigen Zyklus und unterbricht Rückkopplungen. Andere algebraische Schleifen werden abgewiesen. Logikänderungen setzen die Zeit zurück.',
'Een cyclus leest sensoren in het ingangsbeeld, berekent FBD topologisch (of Ladder van boven naar beneden), legt uitgangen vast, integreert actuatoren en proces en registreert diagnose. Uitgangen blijven constant gedurende het interval. Timers tellen het actuele ware interval; PT wordt naar de volgende cyclusgrens afgerond. DELAY leest de vorige cyclus en onderbreekt terugkoppelingen. Andere algebraïsche lussen worden geweigerd. Logica wijzigen herstelt de tijd.',
'Un cycle échantillonne les capteurs, évalue FBD dans l’ordre topologique (ou Ladder de haut en bas), valide les sorties, avance les sous-pas physiques puis enregistre le diagnostic. Les sorties restent constantes pendant l’intervalle. Un temporisateur compte l’intervalle vrai courant ; PT est arrondi à la frontière de cycle suivante. DELAY lit le cycle précédent et coupe les boucles. Les autres boucles algébriques sont rejetées. Modifier la logique remet le temps à zéro.',
'Un ciclo muestrea sensores, evalúa FBD en orden topológico (o Ladder de arriba abajo), confirma salidas, avanza subpasos físicos y registra diagnóstico. Las salidas se mantienen durante el intervalo. El temporizador cuenta el intervalo verdadero actual; PT se redondea al siguiente límite de ciclo. DELAY lee el ciclo anterior y rompe la realimentación. Se rechazan otros ciclos algebraicos. Cambiar la lógica reinicia el tiempo.',
'Cykl odczytuje czujniki do obrazu wejść, oblicza FBD topologicznie (lub Ladder od góry), zatwierdza wyjścia, wykonuje podkroki fizyczne i rejestruje diagnostykę. Wyjścia są stałe w przedziale. Timer liczy bieżący prawdziwy przedział; PT jest zaokrąglany w górę do granicy cyklu. DELAY czyta poprzedni cykl i przerywa sprzężenia. Inne pętle algebraiczne są odrzucane. Zmiana logiki zeruje czas.' ],
timer:['palette',
'TON resets elapsed time when IN is false and asserts Q after PT. TOF holds Q for PT after IN falls. TP starts a non-retriggerable pulse on a rising edge. R_TRIG and F_TRIG pulse for one scan. SR gives set priority; RS gives reset priority. Initial latch and edge memory is false. Timer time is simulation time, independent of browser speed.',
'TON скидає час за хибного IN і вмикає Q після PT. TOF утримує Q протягом PT після спаду IN. TP створює імпульс без повторного запуску під час активності. R_TRIG та F_TRIG дають імпульс на один цикл. SR має пріоритет встановлення, RS — скидання. Початкова пам’ять хибна. Таймери використовують час симуляції.',
'TON setzt bei falschem IN die Zeit zurück und setzt Q nach PT. TOF hält Q nach fallendem IN für PT. TP erzeugt einen nicht nachtriggerbaren Impuls. R_TRIG und F_TRIG liefern einen Zyklusimpuls. SR hat Setz-, RS Rücksetzvorrang. Anfangsspeicher sind falsch. Timer nutzen Simulationszeit unabhängig vom Browsertempo.',
'TON wist de tijd bij onwaar IN en zet Q na PT. TOF houdt Q gedurende PT na een dalende IN. TP geeft een niet hertriggerbare puls. R_TRIG en F_TRIG geven een puls van één cyclus. SR heeft zetprioriteit; RS resetprioriteit. Het begingeheugen is onwaar. Timers gebruiken simulatietijd onafhankelijk van browsersnelheid.',
'TON remet le temps à zéro si IN est faux et active Q après PT. TOF maintient Q durant PT après la chute de IN. TP produit une impulsion non redéclenchable. R_TRIG et F_TRIG durent un cycle. SR privilégie la mise à un ; RS la remise à zéro. La mémoire initiale est fausse. Les temporisations utilisent le temps simulé.',
'TON reinicia el tiempo si IN es falso y activa Q tras PT. TOF mantiene Q durante PT después de la caída de IN. TP genera un pulso no redisparable. R_TRIG y F_TRIG duran un ciclo. SR prioriza activar; RS desactivar. La memoria inicial es falsa. Los temporizadores usan tiempo simulado.',
'TON zeruje czas przy fałszywym IN i ustawia Q po PT. TOF utrzymuje Q przez PT po opadaniu IN. TP daje impuls bez ponownego wyzwolenia. R_TRIG i F_TRIG trwają jeden cykl. SR ma priorytet ustawienia, RS zerowania. Początkowa pamięć jest fałszywa. Timery używają czasu symulacji.' ],
logic:['logic',
'FBD wires carry the selected output port to an input pin. Unwired pins use their explicit constant. BOOL converts to 0/1 in arithmetic; REAL uses JavaScript finite doubles and INTEGER has no vendor overflow emulation. Ladder uses parallel branches as OR and series contacts as AND, with NO/NC, comparison, edge and TON contacts. Coils write after each rung, so following rungs see those writes. Set/reset coils retain their value. ST and SFC are outside this release.',
'Проводи FBD передають вибраний вихід на вхід. Нез’єднаний вхід використовує явну сталу. BOOL у арифметиці стає 0/1; REAL — скінченне число подвійної точності, INTEGER без емуляції переповнення. Ladder об’єднує паралельні гілки через OR, послідовні контакти через AND; є NO/NC, порівняння, фронт і TON. Котушки записують після кожної сходинки, наступні бачать запис. Set/reset зберігають значення. ST та SFC поза цим випуском.',
'FBD-Leitungen verbinden den gewählten Ausgang mit einem Eingang. Unverbundene Eingänge nutzen explizite Konstanten. BOOL wird in Rechnungen 0/1; REAL nutzt endliche Gleitkommazahlen, INTEGER ohne Herstellerüberlauf. Ladder verknüpft parallele Zweige mit OR, serielle Kontakte mit AND; NO/NC, Vergleich, Flanke und TON sind verfügbar. Spulen schreiben nach jedem Netzwerk, sichtbar für nachfolgende. Set/Reset hält Werte. ST und SFC gehören nicht zu dieser Ausgabe.',
'FBD-draden verbinden de gekozen uitgang met een ingang. Onverbonden ingangen gebruiken expliciete constanten. BOOL wordt 0/1 in berekeningen; REAL gebruikt eindige doubles, INTEGER zonder leveranciersoverloop. Ladder combineert parallelle takken met OR en seriecontacten met AND, met NO/NC, vergelijking, flank en TON. Spoelen schrijven na elke rung; volgende rungs zien dit. Set/reset bewaart waarden. ST en SFC vallen buiten deze uitgave.',
'Les fils FBD relient un port de sortie à une entrée. Une entrée non connectée utilise sa constante explicite. BOOL devient 0/1 en calcul ; REAL utilise des nombres finis, INTEGER sans débordement constructeur. Ladder combine les branches parallèles par OR et les contacts en série par AND : NO/NC, comparaison, front et TON. Les bobines écrivent après chaque réseau, visible au suivant. Set/reset conserve la valeur. ST et SFC sont hors de cette version.',
'Los cables FBD conectan una salida con una entrada. Las entradas libres usan constantes explícitas. BOOL se convierte en 0/1; REAL usa dobles finitos, INTEGER sin desbordamiento de fabricante. Ladder combina ramas paralelas con OR y contactos en serie con AND: NO/NC, comparación, flanco y TON. Las bobinas escriben tras cada red, visible a la siguiente. Set/reset conserva el valor. ST y SFC quedan fuera de esta versión.',
'Przewody FBD łączą port wyjściowy z wejściem. Niepołączone wejście używa jawnej stałej. BOOL w obliczeniach to 0/1; REAL używa skończonych liczb, INTEGER bez emulacji przepełnienia. Ladder łączy gałęzie równoległe przez OR, styki szeregowe przez AND: NO/NC, porównanie, zbocze i TON. Cewki zapisują po każdym szczeblu, widocznie dla kolejnych. Set/reset zachowuje wartość. ST i SFC są poza tą wersją.' ],
pid:['controller',
'P = Kp(SP − PV); I advances by Kp·error·scan/Ti; D differentiates PV to avoid setpoint kick. Reverse changes the error sign. Conditional integration stops windup at output limits. Manual tracks MV and stores the integral for a bumpless return to auto. Hysteresis retains its state between low and high thresholds. DEADBAND removes small deviations. SCALE is linear and LIMIT clips explicitly. Try changing Ti or adding a sensor bias and compare P, I, D, RAW and Q.',
'P = Kp(SP − PV); I додає Kp·помилка·цикл/Ti; D диференціює PV без стрибка від уставки. Reverse змінює знак. Умовне інтегрування запобігає накопиченню на межах. Ручний режим відстежує MV і зберігає інтеграл для плавного повернення. Гістерезис зберігає стан між порогами. DEADBAND прибирає малі відхилення. SCALE лінійний, LIMIT обмежує. Змініть Ti чи зсув датчика й порівняйте P, I, D, RAW та Q.',
'P = Kp(SP − PV); I wächst um Kp·Fehler·Zyklus/Ti; D differenziert PV ohne Sollwertsprung. Reverse kehrt das Vorzeichen um. Bedingte Integration verhindert Windup an Ausgangsgrenzen. Handbetrieb folgt MV und speichert I für stoßfreie Rückkehr. Hysterese hält den Zustand zwischen den Schwellen. DEADBAND entfernt kleine Abweichungen. SCALE ist linear, LIMIT begrenzt. Ti oder Sensorversatz ändern und P, I, D, RAW und Q vergleichen.',
'P = Kp(SP − PV); I neemt toe met Kp·fout·cyclus/Ti; D differentieert PV zonder setpointsprong. Reverse keert het teken om. Voorwaardelijke integratie voorkomt windup aan grenzen. Handbediening volgt MV en bewaart I voor een stootvrije terugkeer. Hysterese bewaart de toestand tussen drempels. DEADBAND verwijdert kleine afwijkingen. SCALE is lineair, LIMIT begrenst. Wijzig Ti of sensorafwijking en vergelijk P, I, D, RAW en Q.',
'P = Kp(SP − PV) ; I avance de Kp·erreur·cycle/Ti ; D dérive PV sans saut de consigne. Reverse inverse le signe. L’intégration conditionnelle évite l’accumulation aux limites. Le mode manuel suit MV et conserve I pour le retour sans à-coup. L’hystérésis conserve l’état entre seuils. DEADBAND retire les petits écarts. SCALE est linéaire, LIMIT borne. Modifiez Ti ou le biais et comparez P, I, D, RAW et Q.',
'P = Kp(SP − PV); I avanza Kp·error·ciclo/Ti; D deriva PV sin salto de consigna. Reverse invierte el signo. La integración condicional evita acumulación en límites. Manual sigue MV y conserva I para volver sin salto. La histéresis mantiene el estado entre umbrales. DEADBAND elimina desviaciones pequeñas. SCALE es lineal, LIMIT limita. Cambie Ti o el sesgo y compare P, I, D, RAW y Q.',
'P = Kp(SP − PV); I rośnie o Kp·błąd·cykl/Ti; D różniczkuje PV bez skoku od nastawy. Reverse odwraca znak. Całkowanie warunkowe zapobiega nasyceniu całki. Tryb ręczny śledzi MV i zachowuje I dla bezudarowego powrotu. Histereza utrzymuje stan między progami. DEADBAND usuwa małe odchyłki. SCALE jest liniowy, LIMIT ogranicza. Zmień Ti lub przesunięcie i porównaj P, I, D, RAW oraz Q.' ],
plant:['plant',
'Tank: dh/dt = (Qin − Qout)/A with explicit empty/overflow events. Pumps use nominal flow after a start delay; pipes divide flow by 1 + resistance. Valve travel is limited by rate, with linear, equal-percentage or quick-opening flow. Zone: C dT/dt = Qheat − Qcool − UA(T − Tout), integrated by its exact exponential solution for constant input. The AHU example splits coil power equally between two lumped volumes; it omits humidity and detailed airflow coupling. Sensors apply exact lag, gain, bias, seeded uniform noise and range limits.',
'Резервуар: dh/dt = (Qin − Qout)/A з подіями спорожнення й переливу. Насоси дають номінальну витрату після затримки; труби ділять її на 1 + опір. Хід клапана обмежений швидкістю, характеристика лінійна, рівновідсоткова чи швидкого відкриття. Зона: C dT/dt = Qheat − Qcool − UA(T − Tout), точний експоненційний розв’язок за сталого входу. AHU порівну ділить потужність між двома об’ємами, без вологості й детального повітрообміну. Датчики додають лаг, підсилення, зсув, детермінований шум і межі.',
'Behälter: dh/dt = (Qin − Qout)/A mit Leer- und Überlaufereignissen. Pumpen liefern Nennstrom nach Startverzug; Rohre teilen ihn durch 1 + Widerstand. Ventilhub ist geschwindigkeitsbegrenzt, Kennlinie linear, gleichprozentig oder schnellöffnend. Zone: C dT/dt = Qheat − Qcool − UA(T − Tout), exakt exponentiell bei konstantem Eingang. Das AHU-Beispiel teilt Leistung gleich auf zwei Volumina auf, ohne Feuchte oder detaillierte Luftkopplung. Sensoren modellieren Verzögerung, Verstärkung, Versatz, gesetztes Rauschen und Grenzen.',
'Tank: dh/dt = (Qin − Qout)/A met leeg- en overloopgebeurtenissen. Pompen leveren nominaal debiet na startvertraging; leidingen delen dit door 1 + weerstand. Klepslag is snelheidsbegrensd met lineaire, gelijkprocentige of snelopenende karakteristiek. Zone: C dT/dt = Qheat − Qcool − UA(T − Tout), exact exponentieel bij constante invoer. AHU verdeelt vermogen gelijk over twee volumes, zonder vocht of gedetailleerde luchtkoppeling. Sensoren modelleren vertraging, versterking, afwijking, reproduceerbare ruis en grenzen.',
'Cuve : dh/dt = (Qin − Qout)/A avec événements de vidange et débordement. Les pompes donnent le débit nominal après retard ; les conduites le divisent par 1 + résistance. Course de vanne limitée, caractéristique linéaire, égal pourcentage ou ouverture rapide. Zone : C dT/dt = Qheat − Qcool − UA(T − Tout), solution exponentielle exacte à entrée constante. L’AHU répartit également la puissance entre deux volumes, sans humidité ni couplage détaillé des débits d’air. Les capteurs appliquent retard, gain, biais, bruit reproductible et limites.',
'Tanque: dh/dt = (Qin − Qout)/A con eventos de vacío y desbordamiento. Bombas con caudal nominal tras retardo; tuberías lo dividen por 1 + resistencia. Carrera de válvula limitada, característica lineal, isoporcentual o rápida. Zona: C dT/dt = Qheat − Qcool − UA(T − Tout), solución exponencial exacta con entrada constante. AHU divide potencia entre dos volúmenes, sin humedad ni acoplamiento detallado del aire. Sensores aplican retardo, ganancia, sesgo, ruido reproducible y límites.',
'Zbiornik: dh/dt = (Qin − Qout)/A ze zdarzeniami opróżnienia i przelewu. Pompy dają nominalny przepływ po opóźnieniu; rury dzielą go przez 1 + opór. Skok zaworu ogranicza prędkość; charakterystyka liniowa, stałoprocentowa lub szybkootwierająca. Strefa: C dT/dt = Qheat − Qcool − UA(T − Tout), dokładne rozwiązanie wykładnicze dla stałego wejścia. AHU dzieli moc równo między dwa skupione obszary, bez wilgoci i szczegółowego sprzężenia powietrza. Czujniki mają opóźnienie, wzmocnienie, przesunięcie, powtarzalny szum i granice.' ],
faults:['faults',
'Command is a controller request; feedback comes from the simulated equipment on the next scan. A permissive allows starting, an interlock blocks operation and a trip stops it. Duty/standby compares command against missing feedback through TON before starting reserve equipment. One failed sensor in 2oo3 does not trip the vote; two agreeing signals do. Forces override the normal tag and show forced quality. Bypass is an explicitly marked force. Manual and disabled alarm are deliberate overrides, not repairs.',
'Команда — запит контролера; зворотний зв’язок надходить від обладнання на наступному циклі. Дозвіл дозволяє пуск, блокування забороняє роботу, захист зупиняє. Основний/резервний сценарій перевіряє команду без підтвердження через TON до запуску резерву. Один несправний датчик у 2oo3 не викликає захист, два узгоджені сигнали — викликають. Форсування має явну якість forced; обхід — позначене форсування. Ручний режим та вимкнена аварія є перевизначенням, а не ремонтом.',
'Befehl ist die Anforderung; Rückmeldung kommt im nächsten Zyklus von der Anlage. Freigabe erlaubt Start, Verriegelung sperrt Betrieb, Auslösung stoppt. Betrieb/Reserve prüft Befehl ohne Rückmeldung über TON vor Reservestart. Ein defekter Sensor löst 2oo3 nicht aus, zwei übereinstimmende Signale schon. Zwangswerte zeigen erzwungene Qualität; Überbrückung ist markierter Zwang. Handbetrieb und deaktivierter Alarm sind Übersteuerungen, keine Reparaturen.',
'Commando is het verzoek; terugmelding komt de volgende cyclus uit de apparatuur. Vrijgave staat starten toe, vergrendeling blokkeert bedrijf, trip stopt. Bedrijf/reserve vergelijkt commando met ontbrekende terugmelding via TON vóór reservestart. Eén defecte sensor schakelt 2oo3 niet uit, twee overeenstemmende signalen wel. Forceren toont geforceerde kwaliteit; overbrugging is een gemarkeerde forcering. Handbediening en alarm uitschakelen zijn overrides, geen reparaties.',
'La commande est une demande ; le retour provient de l’équipement au cycle suivant. Une autorisation permet le démarrage, un interverrouillage bloque et un déclenchement arrête. Le secours compare commande et absence de retour via TON avant démarrage. Un capteur défaillant ne déclenche pas 2oo3 ; deux signaux concordants le font. Un forçage affiche sa qualité ; un contournement est un forçage marqué. Manuel et alarme désactivée sont des dérogations, pas des réparations.',
'La orden es una solicitud; la realimentación llega del equipo al ciclo siguiente. Un permiso permite arrancar, un enclavamiento bloquea y un disparo detiene. Principal/reserva compara orden sin confirmación mediante TON antes de arrancar reserva. Un sensor averiado no dispara 2oo3; dos señales concordantes sí. El forzado muestra su calidad; el puenteo es un forzado marcado. Manual y alarma desactivada son anulaciones, no reparaciones.',
'Polecenie jest żądaniem; potwierdzenie pochodzi z urządzenia w kolejnym cyklu. Zezwolenie umożliwia start, blokada uniemożliwia pracę, zabezpieczenie zatrzymuje. Układ rezerwowy sprawdza brak potwierdzenia przez TON przed uruchomieniem rezerwy. Jeden uszkodzony czujnik nie wyzwala 2oo3, dwa zgodne sygnały tak. Wymuszenie ma oznaczoną jakość; obejście to jawne wymuszenie. Tryb ręczny i wyłączenie alarmu są nadpisaniem, nie naprawą.' ],
tests:['tests',
'An executable requirement starts a fresh engine, applies its initial conditions and timed events, runs for simulation time and evaluates assertions on every scan. PASS requires a valid tag and good or explicitly forced data. A bad-quality value cannot prove acceptance. Within-time checks include the deadline; remains/never checks cover the whole selected interval. Test results do not change the interactive simulation. FAT/SAT evidence here is rehearsal only; site and hardware acceptance require their own tests.',
'Виконувана вимога запускає новий двигун, застосовує початкові умови й події, виконує симуляцію та перевіряє умови кожного циклу. PASS потребує коректного сигналу та доброї чи явно примусової якості. Погана якість не доводить прийнятність. Часові перевірки включають межу, постійність перевіряється на всьому інтервалі. Тести не змінюють інтерактивну симуляцію. Це репетиція FAT/SAT; приймання реального обладнання потребує власних тестів.',
'Eine ausführbare Anforderung startet eine neue Engine, setzt Anfangswerte und Ereignisse und prüft jeden Zyklus. BESTANDEN erfordert gültige Signale mit guter oder ausdrücklich erzwungener Qualität. Schlechte Qualität belegt keine Abnahme. Zeitprüfungen schließen die Frist ein; Bleibt/Niemals prüft das ganze Intervall. Tests ändern die interaktive Simulation nicht. FAT/SAT ist hier eine Probe; Anlagen- und Hardwareabnahme brauchen eigene Tests.',
'Een uitvoerbare eis start een nieuwe engine, past beginvoorwaarden en gebeurtenissen toe en controleert elke cyclus. GESLAAGD vereist geldige signalen met goede of expliciet geforceerde kwaliteit. Slechte kwaliteit bewijst geen acceptatie. Tijdcontroles omvatten de deadline; blijft/nooit controleert het hele interval. Tests wijzigen de interactieve simulatie niet. Dit is een FAT/SAT-oefening; installatie en hardware vragen eigen acceptatietests.',
'Une exigence exécutable démarre un moteur neuf, applique conditions initiales et événements et vérifie chaque cycle. RÉUSSI exige un signal valide de bonne qualité ou explicitement forcé. Une mauvaise qualité ne prouve pas l’acceptation. Le délai inclut sa borne ; reste/jamais couvre tout l’intervalle. Les tests ne changent pas la simulation interactive. Il s’agit d’une répétition FAT/SAT ; site et matériel exigent leurs propres essais.',
'Un requisito ejecutable inicia un motor nuevo, aplica condiciones y eventos y comprueba cada ciclo. APROBADO requiere señal válida de calidad buena o explícitamente forzada. Mala calidad no demuestra aceptación. El plazo incluye su límite; permanece/nunca cubre todo el intervalo. Las pruebas no cambian la simulación interactiva. Es un ensayo FAT/SAT; sitio y equipo requieren pruebas propias.',
'Wymaganie wykonywalne uruchamia nowy silnik, stosuje warunki początkowe i zdarzenia oraz sprawdza każdy cykl. ZALICZONO wymaga poprawnego sygnału o dobrej lub jawnie wymuszonej jakości. Zła jakość nie dowodzi akceptacji. Termin obejmuje granicę; pozostaje/nigdy bada cały przedział. Testy nie zmieniają interaktywnej symulacji. To próba FAT/SAT; odbiór obiektu i sprzętu wymaga własnych testów.' ]
};

function labBenchmark(){

 /* Reference implementation of the IEC 61131-3 standard function blocks this tool provides.
    Written from IEC 61131-3:2025 Table 44 (bistables), Table 45 (edge detection), Table 47 and
    Figure 17 (timers), and from ordinary arithmetic. It does not call the block runtime, and the
    timers count whole scans instead of accumulating a float, so an accumulation defect in the tool
    cannot be reproduced by the reference. */
 const cl=(v,lo,hi)=>Math.max(Math.min(v,hi),lo);
 function refExec(type,p,i,s,dt){
  const A=Number(i.A),B=Number(i.B),IN=Number(i.IN);
  switch(type){
   case 'AND':return !!i.A&&!!i.B; case 'OR':return !!i.A||!!i.B;
   case 'XOR':return (!!i.A)!==(!!i.B); case 'NOT':return !i.IN;
   case 'SR':{const q=(!!i.S)||((!i.R)&&!!s.q);s.q=q;return q;}
   case 'RS':{const q=(!i.R)&&((!!i.S)||!!s.q);s.q=q;return q;}
   case 'R_TRIG':{const q=(!!i.IN)&&!s.prev;s.prev=!!i.IN;return q;}
   case 'F_TRIG':{const q=(!i.IN)&&!!s.prev;s.prev=!!i.IN;return q;}
   case 'TON':{s.k=i.IN?(s.k||0)+1:0;return !!i.IN&&s.k*dt>=p.PT-dt*1e-9;}
   case 'TOF':{if(i.IN){s.k=0;s.run=true;s.prev=true;return true;}
    if(s.prev){s.k=0;s.prev=false;} if(!s.run)return false;
    s.k=(s.k||0)+1; if(s.k*dt>=p.PT-dt*1e-9){s.run=false;return false;} return true;}
   case 'TP':{if(i.IN&&!s.prev&&!s.run){s.run=true;s.k=0;} s.prev=!!i.IN;
    if(!s.run)return false; const q=s.k===0||s.k*dt<p.PT-dt*1e-9;
    s.k=(s.k||0)+1; if(s.k*dt>=p.PT-dt*1e-9)s.run=false; return q;}
   case 'ADD':return A+B; case 'SUB':return A-B; case 'MUL':return A*B; case 'DIV':return A/B;
   case 'ABS':return Math.abs(IN); case 'MIN':return Math.min(A,B); case 'MAX':return Math.max(A,B);
   case 'SCALE':return p.outMin+(IN-p.inMin)*(p.outMax-p.outMin)/(p.inMax-p.inMin);
   case 'LIMIT':return cl(IN,p.min,p.max); case 'SELECT':return i.G?i.B:i.A;
   case 'DEADBAND':return Math.abs(IN)<=p.width?0:IN-Math.sign(IN)*p.width;
   case 'CMP':{const a=i.A,b=i.B,o=p.op;
    return o==='>'?a>b:o==='>='?a>=b:o==='<'?a<b:o==='<='?a<=b:o==='='?a===b:a!==b;}
   case 'HYSTERESIS':{let q=s.q??false;
    if(IN<=p.low)q=!!p.inverse; if(IN>=p.high)q=!p.inverse; s.q=q; return q;}
   default:throw new Error('reference: '+type);
  }
 }

   cmp:{result:{got,ref,tol:tol||'exact',abs,rel,ok:pass}},pass:pass};

for(const [label,fn]of [['fit',()=>{stage().interaction.zoom=1;stage().interaction.panX=0;stage().interaction.panY=0;redraw();}],['100%',()=>{const st=stage();st.interaction.zoom=Math.max(.3,Math.min(6,st.interaction.zoom/(st.size.map?.scale||1)));redraw();}],['+',()=>{stage().interaction.zoom=Math.min(6,stage().interaction.zoom*1.2);redraw();}],['−',()=>{stage().interaction.zoom=Math.max(0.3,stage().interaction.zoom/1.2);redraw();}],['←',()=>{stage().interaction.panX+=60;redraw();}],['→',()=>{stage().interaction.panX-=60;redraw();}],['↑',()=>{stage().interaction.panY+=60;redraw();}],['↓',()=>{stage().interaction.panY-=60;redraw();}]])stage().addTool({label:T(label),run:fn});
app.ready();
}
function dataRecord(){if(!engine)return null;return {inputs:{project:Lab.clone(p()),initial_conditions:p().plant.components.map(a=>({id:a.id,initial:a.initial??0}))},outputs:{simulation_time:engine.time,scans:engine.scan,tags:Lab.clone(engine.tags),plant:Lab.clone(engine.plant),test_results:Lab.clone(results),events:Lab.clone(engine.events),trace:Lab.clone(engine.trace)},units:{simulation_time:'s'},model:{equations:['dh/dt = (Qin - Qout) / A','C dT/dt = Qheat - Qcool - UA(T - Tout)','P = Kp(SP - PV); dI/dt = Kp error/Ti; D = -Kp Td dPV/dt'],ranges:[LearnContent.topics.plant.body[app?.lang||'en']],notes:[$t('limitations')]},warnings:[...engine.errors,...engine.runtimeDiagnostics].map(d=>$t('invalid')+' ['+d.code+'] '+d.object)};}
function reportProfile(rec,ctx){running=false;const l=ctx.domainLang,t=k=>L10N.get(k,l),label=id=>({tank:'tankPreset',motor:'motorPreset',reset:'resetPreset'})[id]||id;
 const cv=document.createElement('canvas');cv.width=1360;cv.height=650;drawTrend(cv);
 const plantFigure={body:document.createElement('div'),node:document.createElement('div')},logicFigure={body:document.createElement('div'),node:document.createElement('div')};
 drawPlant({w:1000,h:400},plantFigure,true);
 const bs=c().blocks,world={x0:Math.min(0,...bs.map(b=>b.x))-120,y0:Math.min(0,...bs.map(b=>b.y))-70,x1:Math.max(400,...bs.map(b=>b.x))+120,y1:Math.max(160,...bs.map(b=>b.y))+80};
 const map=new DiagramUI.SceneMap({w:1200,h:500},world,{pad:40,yUp:false});drawLogic({w:1200,h:500,map},logicFigure,true);
 return {title:t('report'),project:[{label:t('project'),text:p().metadata.name},{label:t('controller'),text:c().type+' / '+c().language}],executive:{text:[t('subtitle')],results:[{label:t('time'),value:engine.time,unit:'s'},{label:t('scanPeriod'),value:c().scan,unit:'s'},{label:t('tests'),text:results.length?results.filter(r=>r.pass).length+'/'+results.length:t('notTested')},{label:t('faults'),value:Object.values(engine.faultActive).filter(Boolean).length},{label:t('force'),value:Object.values(p().forces).filter(f=>f.enabled).length}],conclusion:results.some(r=>!r.pass)?t('fail'):results.length?t('pass'):t('notTested')},
 system:{text:[t(label(p().metadata.preset))],figure:ctx.figure(plantFigure.labSVG,{caption:t('plant'),alt:t('plant')})},
 results:Object.entries(engine.tags).map(([id,v])=>({label:id,value:typeof v.value==='number'?v.value:undefined,text:typeof v.value==='number'?undefined:n(v.value),unit:v.unit,note:t(v.quality)})),
 checks:results.flatMap(r=>r.assertions.map(a=>({status:a.pass?'pass':'fail',title:r.requirement_id+' · '+a.tag,detail:t(a.op),actual:n(a.actual),criterion:n(a.value)+'; '+n(a.within)+' s',basis:t('tests')}))),
 figures:[ctx.figure(cv,{caption:t('trend'),alt:t('trend')}),ctx.figure(logicFigure.labSVG,{caption:t('logic'),alt:t('logic')})].filter(Boolean),
 method:{equations:rec.model.equations,ranges:[LearnContent.topics.scan.body[l],LearnContent.topics.plant.body[l]],notes:[t('privacy')],references:['IEC 61131-3:2025, Edition 4 · https://webstore.iec.ch/en/publication/68533',t('basis')]},
 inputs:[{label:t('project'),text:p().metadata.name,group:t('initial')},...p().plant.components.map(a=>({label:a.id,text:JSON.stringify(a),group:t('plant')})),...c().blocks.map(b=>({label:b.id,text:JSON.stringify(b),group:t('logic')})),...c().wires.map(w=>({label:w.id,text:JSON.stringify(w),group:t('wire')})),{label:t('seed'),value:p().seed,group:t('advanced')},{label:t('step'),value:p().plant.step,unit:'s',group:t('advanced')}]
 };}
function reportSections(){return[{title:$t('events'),head:[$t('time'),$t('source'),$t('value')],rows:engine.events.slice(-120).map(e=>[n(e.time),e.object,eventValue(e)])},{title:$t('faults'),head:[$t('faultTarget'),$t('faultKind'),$t('active')],rows:p().faults.map(f=>[f.target,$t(f.kind),$t(engine.faultActive[f.id]?'active':'inactive')])},{title:$t('trace'),head:[$t('source'),$t('value')],rows:Object.entries(engine.trace).map(([k,t])=>[k,n(t.outputs.Q)])}];}
function installData(){if(!window.Diagram)return;Diagram.init({id:'plcddclab',file:'plcddclab.html',state:{serialize:()=>{const full={project:Lab.clone(p())};if(Diagram.state.encode(full).length<3800)return full;app.notify($t('largeLink'),{kind:'warn'});return {preset:p().metadata.preset||'duty',scan:c().scan,step:p().plant.step,seed:p().seed,compact:true};},deserialize:o=>{if(o.compact){replace(state.project,Presets.make(Presets.ids.includes(o.preset)?o.preset:'duty'));c().scan=o.scan;p().plant.step=o.step;p().seed=o.seed;app.notify($t('largeLink'),{kind:'warn'});}else replace(state.project,Lab.readProject(o.project||o));reboot();}},record:dataRecord,report:{profile:reportProfile,sections:reportSections}});}
function tick(now){if(running&&engine){const elapsed=Math.min(0.25,(now-previousTick)/1000);accumulator+=elapsed*Number(state.speed);const started=performance.now();while(accumulator>=c().scan&&performance.now()-started<25){if(!engine.step()){running=false;break;}accumulator-=c().scan;}if(now-lastPaint>200){lastPaint=now;refresh();}}previousTick=now;requestAnimationFrame(tick);}
function boot(){if(window.DiagramUI&&DiagramUI.api==='tools.petrov.re/ui/v1')buildInterface();else{const box=document.getElementById('app');textNode(box,L10N.get('title'),'h1');textNode(box,L10N.get('invalid')+': diagram-ui.js');}engine=new Lab.Engine(p());installData();refresh();requestAnimationFrame(tick);window.__plcLab={Lab,Presets,state,get engine(){return engine;},get results(){return results;},load:selectPreset,runTests,refresh,reboot,select,connect,record:dataRecord};}
document.addEventListener('DOMContentLoaded',boot);
})();
