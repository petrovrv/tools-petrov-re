  "title": {"en":"Incident Causal Tree","uk":"Дерево причин інциденту","de":"Ursachenbaum für Ereignisse","nl":"Oorzakenboom van incidenten","fr":"Arbre des causes d’incident","es":"Árbol causal de incidentes","pl":"Drzewo przyczyn zdarzenia"},
  "summary": {
    "en":"Record an incident timeline as facts, inferences, hypotheses and unknowns, link causes with a written rationale, assess barriers and tie each corrective action to a cause or barrier.",
    "uk":"Хронологія інциденту з поділом на факти, висновки, гіпотези й невідоме, причинні зв’язки з обґрунтуванням, оцінка бар’єрів і коригувальні дії, прив’язані до причин або бар’єрів.",
    "de":"Ereignischronologie als Tatsachen, Schlussfolgerungen, Hypothesen und Unbekanntes erfassen, Ursachen mit Begründung verknüpfen, Barrieren bewerten und jede Korrekturmaßnahme einer Ursache oder Barriere zuordnen.",
    "nl":"Leg een incidenttijdlijn vast als feiten, afleidingen, hypothesen en onbekenden, koppel oorzaken met een motivering, beoordeel barrières en verbind elke corrigerende maatregel met een oorzaak of barrière.",

    "pl":"Zapis chronologii zdarzenia jako fakty, wnioski, hipotezy i niewiadome, powiązania przyczynowe z uzasadnieniem, ocena barier i działania korygujące przypisane do przyczyn lub barier."

  "description": {
    "en":"A workspace for structuring an incident investigation. Timeline entries carry an explicit record type and evidence references; causal links need a rationale and a confidence; barriers are marked present, failed, missing or not applicable; corrective actions carry an owner, a due date and the causes or barriers they address. Rule checks flag unsupported conclusions, ungrounded actions and missing data, and the challenge view lists every conclusion that lacks support. Barrier sets exported by the bow-tie tool can be imported. Work is kept as a JSON file and as a draft in this browser; nothing is transmitted.",
    "uk":"Робочий простір для структурування розслідування інциденту. Записи хронології мають явний тип і посилання на докази; причинні зв’язки потребують обґрунтування та рівня впевненості; бар’єри позначаються як наявні, такі, що не спрацювали, відсутні або незастосовні; коригувальні дії мають відповідального, строк і причини чи бар’єри, на які спрямовані. Перевірки правил позначають необґрунтовані висновки, дії без цілі та брак даних, а режим «Оскаржити» показує всі висновки без опори. Можна імпортувати набір бар’єрів з інструмента bow-tie. Робота зберігається у файлі JSON і як чернетка в цьому браузері; нічого не передається.",
    "de":"Arbeitsbereich zur Strukturierung einer Ereignisuntersuchung. Chronologieeinträge tragen einen ausdrücklichen Eintragstyp und Belegverweise; Ursachenverknüpfungen brauchen eine Begründung und eine Sicherheitsstufe; Barrieren werden als vorhanden, versagt, fehlend oder nicht zutreffend markiert; Korrekturmaßnahmen haben eine verantwortliche Stelle, einen Termin und die Ursachen oder Barrieren, auf die sie zielen. Regelprüfungen markieren unbelegte Schlussfolgerungen, Maßnahmen ohne Ziel und fehlende Angaben; die Ansicht „Hinterfragen“ listet jede Schlussfolgerung ohne Stütze. Barrierensätze aus dem Bow-Tie-Werkzeug lassen sich importieren. Die Arbeit wird als JSON-Datei und als Entwurf in diesem Browser gehalten; nichts wird übertragen.",
    "nl":"Werkruimte om een incidentonderzoek te structureren. Tijdlijnregels hebben een expliciet registratietype en bewijsverwijzingen; oorzakelijke koppelingen vragen een motivering en een betrouwbaarheid; barrières worden gemarkeerd als aanwezig, gefaald, ontbrekend of niet van toepassing; corrigerende maatregelen hebben een eigenaar, een termijn en de oorzaken of barrières waarop ze gericht zijn. Regelcontroles signaleren ononderbouwde conclusies, maatregelen zonder doel en ontbrekende gegevens, en de weergave ‘Toetsen’ toont elke conclusie zonder onderbouwing. Barrièresets uit de bow-tie-tool kunnen worden geïmporteerd. Het werk wordt bewaard als JSON-bestand en als concept in deze browser; er wordt niets verzonden.",
    "fr":"Espace de travail pour structurer une enquête sur incident. Les entrées de la chronologie portent un type explicite et des références de preuve ; les liens de causalité exigent une justification et un niveau de confiance ; les barrières sont marquées présentes, défaillantes, absentes ou sans objet ; les actions correctives ont un responsable, une échéance et les causes ou barrières visées. Les contrôles signalent les conclusions non étayées, les actions sans cible et les données manquantes, et la vue « Contester » liste chaque conclusion sans appui. Les jeux de barrières exportés par l’outil nœud papillon peuvent être importés. Le travail est conservé en fichier JSON et en brouillon dans ce navigateur ; rien n’est transmis.",
    "es":"Espacio de trabajo para estructurar una investigación de incidentes. Las entradas de la cronología llevan un tipo explícito y referencias de evidencia; los vínculos causales exigen una justificación y un nivel de confianza; las barreras se marcan como presentes, fallidas, ausentes o no aplicables; las acciones correctivas tienen responsable, fecha límite y las causas o barreras a las que responden. Las comprobaciones señalan conclusiones sin apoyo, acciones sin objetivo y datos que faltan, y la vista «Cuestionar» enumera cada conclusión sin respaldo. Se pueden importar conjuntos de barreras exportados por la herramienta de pajarita. El trabajo se guarda como archivo JSON y como borrador en este navegador; no se transmite nada.",
    "pl":"Przestrzeń robocza do porządkowania badania zdarzenia. Wpisy chronologii mają jawny typ i odnośniki do dowodów; powiązania przyczynowe wymagają uzasadnienia i poziomu pewności; bariery oznacza się jako obecne, zawodne, brakujące lub niedotyczące; działania korygujące mają właściciela, termin oraz przyczyny lub bariery, których dotyczą. Reguły wskazują niepoparte wnioski, działania bez celu i brakujące dane, a widok „Zakwestionuj” wymienia każdy wniosek bez podstaw. Można importować zestawy barier z narzędzia bow-tie. Praca jest przechowywana jako plik JSON i jako szkic w tej przeglądarce; nic nie jest przesyłane."
  },

    "en":"Checks the internal consistency of what the user records. It does not verify that evidence is genuine, does not determine legal responsibility or blame, and does not replace an organisation's formal investigation procedure. The rule checks are data-quality heuristics of this tool, not requirements of a standard. The causal graph is drawn in layers and becomes hard to read on screen beyond about 60 linked entries.",
    "uk":"Перевіряє внутрішню узгодженість записаного користувачем. Не підтверджує достовірність доказів, не визначає юридичної відповідальності чи вини і не замінює формальної процедури розслідування організації. Перевірки правил є евристиками якості даних цього інструмента, а не вимогами стандарту. Причинний граф малюється шарами; понад приблизно 60 пов’язаних записів його важко читати на екрані.",
    "de":"Prüft die innere Stimmigkeit dessen, was erfasst wird. Das Werkzeug prüft nicht die Echtheit von Belegen, bestimmt weder rechtliche Verantwortung noch Schuld und ersetzt kein formales Untersuchungsverfahren einer Organisation. Die Regelprüfungen sind Datenqualitätsheuristiken dieses Werkzeugs, keine Anforderungen einer Norm. Der Ursachengraph wird in Ebenen gezeichnet und ist ab etwa 60 verknüpften Einträgen am Bildschirm schwer lesbar.",
    "nl":"Controleert de interne samenhang van wat de gebruiker vastlegt. Het controleert niet of bewijs echt is, bepaalt geen juridische verantwoordelijkheid of schuld en vervangt geen formele onderzoeksprocedure van een organisatie. De regelcontroles zijn datakwaliteitsheuristieken van deze tool, geen eisen uit een norm. De oorzakengraaf wordt in lagen getekend en is boven ongeveer 60 gekoppelde regels op het scherm moeilijk leesbaar.",
    "fr":"Vérifie la cohérence interne de ce que l’utilisateur consigne. L’outil ne vérifie pas l’authenticité des preuves, ne détermine ni responsabilité juridique ni faute et ne remplace pas la procédure d’enquête formelle d’une organisation. Les contrôles sont des heuristiques de qualité des données propres à l’outil, et non des exigences d’une norme. Le graphe causal est dessiné par niveaux et devient difficile à lire à l’écran au-delà d’environ 60 entrées liées.",
    "es":"Comprueba la coherencia interna de lo que registra el usuario. No verifica que la evidencia sea auténtica, no determina responsabilidad legal ni culpa y no sustituye el procedimiento formal de investigación de una organización. Las comprobaciones son heurísticas de calidad de datos de esta herramienta, no requisitos de una norma. El grafo causal se dibuja por niveles y resulta difícil de leer en pantalla por encima de unas 60 entradas vinculadas.",

    "basis": {
      "en":"Benchmarked against an independent reference corpus of 66 cases derived from HSE HSG245 and graph first principles (see the benchmark report). Rule behaviour is exercised by built-in tests on two synthetic incident sets with known unsupported conclusions, plus graph serialisation round trips. Concept basis: incident and corrective-action requirements of ISO 45001:2018 and barrier-based investigation practice, with HSE HSG245 (2004) as context. No review by an independent safety investigator.",
      "uk":"Порівняно з незалежним еталонним набором із 66 випадків, виведених з HSE HSG245 та основ теорії графів (див. звіт порівняння). Поведінка правил перевіряється вбудованими тестами на двох синтетичних наборах інцидентів з відомими необґрунтованими висновками та тестами збереження графа. Концептуальна основа: вимоги ISO 45001:2018 щодо інцидентів і коригувальних дій та практика бар’єрного розслідування; HSE HSG245 (2004) як контекст. Незалежним розслідувачем не перевірено.",
      "de":"Benchmark gegen einen unabhängigen Referenzsatz von 66 Fällen, abgeleitet aus HSE HSG245 und Graphengrundlagen (siehe Benchmark-Bericht). Das Regelverhalten wird durch eingebaute Tests an zwei synthetischen Ereignissätzen mit bekannten unbelegten Schlussfolgerungen und durch Speicher-Rundläufe des Graphen geprüft. Konzeptgrundlage: Anforderungen der ISO 45001:2018 zu Vorfällen und Korrekturmaßnahmen sowie barrierebasierte Untersuchungspraxis, HSE HSG245 (2004) als Kontext. Keine Prüfung durch unabhängige Unfalluntersucher.",
      "nl":"Getoetst aan een onafhankelijke referentieset van 66 gevallen, afgeleid uit HSE HSG245 en grondbeginselen van grafen (zie het benchmarkrapport). Het regelgedrag wordt getoetst met ingebouwde tests op twee synthetische incidentsets met bekende onderbouwingsgebreken en met round-trips van de graaf. Conceptuele basis: eisen van ISO 45001:2018 voor incidenten en corrigerende maatregelen en barrièregericht onderzoek, met HSE HSG245 (2004) als context. Geen beoordeling door een onafhankelijke onderzoeker.",
      "fr":"Comparé à un corpus de référence indépendant de 66 cas, établi à partir de HSE HSG245 et des principes des graphes (voir le rapport de banc d’essai). Le comportement des règles est vérifié par des tests intégrés sur deux jeux d’incidents synthétiques aux conclusions non étayées connues, ainsi que par des allers-retours de sérialisation du graphe. Base conceptuelle : exigences de l’ISO 45001:2018 sur les incidents et actions correctives et pratique d’enquête par barrières, avec HSE HSG245 (2004) comme contexte. Aucune revue par un enquêteur indépendant.",
      "es":"Contrastado con un corpus de referencia independiente de 66 casos, derivado de HSE HSG245 y de principios de grafos (véase el informe del banco de pruebas). El comportamiento de las reglas se comprueba con pruebas integradas sobre dos conjuntos sintéticos de incidentes con conclusiones sin apoyo conocidas y con ciclos de serialización del grafo. Base conceptual: requisitos de ISO 45001:2018 sobre incidentes y acciones correctivas y práctica de investigación basada en barreras, con HSE HSG245 (2004) como contexto. Sin revisión de un investigador independiente.",
      "pl":"Porównano z niezależnym zbiorem referencyjnym 66 przypadków, wyprowadzonych z HSE HSG245 i podstaw teorii grafów (zob. raport benchmarku). Działanie reguł sprawdzają wbudowane testy na dwóch syntetycznych zestawach zdarzeń ze znanymi niepopartymi wnioskami oraz testy zapisu i odczytu grafu. Podstawa koncepcyjna: wymagania ISO 45001:2018 dotyczące incydentów i działań korygujących oraz praktyka badania opartego na barierach, z HSE HSG245 (2004) jako kontekstem. Brak przeglądu przez niezależnego badacza zdarzeń."

.it-rules{list-style:none;margin:0;padding:0;font-size:var(--fs-small,12px)}
.it-rules li{padding:5px 0;border-bottom:1px solid var(--line)}
.it-rules b{font-family:var(--font-mono);font-weight:600}
.it-kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:var(--fs-small,12px);margin:4px 0}
.it-kv dt{color:var(--muted)}.it-kv dd{margin:0;overflow-wrap:anywhere}
.it-empty{color:var(--muted);font-size:var(--fs-label,13px);padding:6px 0}
.it-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(max-width:768px){
 .it-row{grid-template-columns:2em auto minmax(0,1fr) auto;grid-template-areas:"n kd tm mk" "tx tx tx tx"}
 .it-row .n{grid-area:n}.it-row .kd{grid-area:kd}.it-row .mk{grid-area:mk}.it-row .tx{grid-area:tx}.it-row .tm{grid-area:tm}
 .it-row2{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"kd mk" "tx tx"}
 .it-row2 .kd{grid-area:kd}.it-row2 .mk{grid-area:mk}.it-row2 .tx{grid-area:tx}
 .it-row .dgu-btn,.it-bar .dgu-btn{min-height:44px}
 .it-ev{grid-template-columns:minmax(0,1fr) auto}
 .it-outline button{flex-wrap:wrap}
 .it-outline .ot{flex:1 1 100%}
 .it-outline li{padding-left:0!important}
 .it-outline .ar{white-space:normal}
 .it-ev input{grid-column:1/-1}
}

  footer: T('A cause exists only as an explicit link with a rationale. Record types: fact (evidence referenced), inference (derived from facts), hypothesis (unconfirmed), unknown (open question). Rule IDs ICT-R-001 to ICT-R-022 are listed in the rule register.',
    'Причина існує лише як явний зв’язок з обґрунтуванням. Типи записів: факт (є посилання на доказ), висновок (виведений з фактів), гіпотеза (не підтверджена), невідоме (відкрите питання). Правила ICT-R-001…ICT-R-022 наведено в реєстрі правил.',
    'Eine Ursache besteht nur als ausdrückliche Verknüpfung mit Begründung. Eintragstypen: Tatsache (Beleg verwiesen), Schlussfolgerung (aus Tatsachen abgeleitet), Hypothese (unbestätigt), Unbekannt (offene Frage). Die Regeln ICT-R-001 bis ICT-R-022 stehen im Regelverzeichnis.',
    'Een oorzaak bestaat alleen als expliciete koppeling met motivering. Registratietypen: feit (bewijs verwezen), afleiding (uit feiten afgeleid), hypothese (onbevestigd), onbekend (open vraag). Regels ICT-R-001 tot ICT-R-022 staan in het regelregister.',
    'Une cause n’existe que sous forme de lien explicite justifié. Types : fait (preuve référencée), déduction (tirée de faits), hypothèse (non confirmée), inconnue (question ouverte). Les règles ICT-R-001 à ICT-R-022 figurent au registre des règles.',
    'Una causa solo existe como vínculo explícito con justificación. Tipos: hecho (evidencia referenciada), inferencia (derivada de hechos), hipótesis (sin confirmar), desconocido (pregunta abierta). Las reglas ICT-R-001 a ICT-R-022 figuran en el registro de reglas.',
    'Przyczyna istnieje tylko jako jawne powiązanie z uzasadnieniem. Typy wpisów: fakt (odnośnik do dowodu), wniosek (wyprowadzony z faktów), hipoteza (niepotwierdzona), niewiadoma (otwarte pytanie). Reguły ICT-R-001 do ICT-R-022 są w rejestrze reguł.'),
  learnTitle: T('What this tool does', 'Що робить цей інструмент', 'Was dieses Werkzeug tut', 'Wat deze tool doet', 'Ce que fait cet outil', 'Qué hace esta herramienta', 'Co robi to narzędzie'),
  learnBody: T('It keeps what is established apart from what is supposed. Each timeline entry has a record type; causes exist only as links with a written rationale; each corrective action must point at a cause or a barrier.',
    'Він відокремлює встановлене від припущеного. Кожен запис має тип; причини існують лише як зв’язки з обґрунтуванням; кожна коригувальна дія має вказувати на причину або бар’єр.',
    'Es trennt Festgestelltes von Vermutetem. Jeder Eintrag hat einen Typ; Ursachen gibt es nur als begründete Verknüpfungen; jede Korrekturmaßnahme muss auf eine Ursache oder Barriere zeigen.',
    'Het houdt vastgestelde zaken gescheiden van vermoedens. Elke regel heeft een type; oorzaken bestaan alleen als gemotiveerde koppelingen; elke corrigerende maatregel wijst naar een oorzaak of barrière.',
    'Il sépare l’établi du supposé. Chaque entrée a un type ; les causes n’existent que comme liens justifiés ; chaque action corrective vise une cause ou une barrière.',
    'Separa lo establecido de lo supuesto. Cada entrada tiene un tipo; las causas solo existen como vínculos justificados; cada acción correctiva apunta a una causa o barrera.',
    'Oddziela to, co ustalone, od tego, co przypuszczalne. Każdy wpis ma typ; przyczyny istnieją tylko jako uzasadnione powiązania; każde działanie korygujące wskazuje przyczynę lub barierę.'),
  learnKinds: T('Record types', 'Типи записів', 'Eintragstypen', 'Registratietypen', 'Types d’entrée', 'Tipos de registro', 'Typy wpisów'),
  learnKindsBody: T('Fact: established and backed by an evidence reference. Inference: derived from facts through links. Hypothesis: a possible explanation that is not confirmed. Unknown: a question the investigation still has to answer. A hypothesis becomes a fact only after evidence is recorded.',
    'Факт: встановлено й підкріплено посиланням на доказ. Висновок: виведено з фактів через зв’язки. Гіпотеза: можливе пояснення без підтвердження. Невідоме: питання, на яке розслідування ще має відповісти. Гіпотеза стає фактом лише після внесення доказу.',
    'Tatsache: festgestellt und mit Belegverweis. Schlussfolgerung: über Verknüpfungen aus Tatsachen abgeleitet. Hypothese: mögliche, unbestätigte Erklärung. Unbekannt: eine noch offene Frage. Eine Hypothese wird erst nach erfasstem Beleg zur Tatsache.',
    'Feit: vastgesteld en onderbouwd met een bewijsverwijzing. Afleiding: via koppelingen uit feiten afgeleid. Hypothese: mogelijke, onbevestigde verklaring. Onbekend: een vraag die nog beantwoord moet worden. Een hypothese wordt pas een feit na vastgelegd bewijs.',

var RULE = {};
RULES.forEach(function (r) { RULE[r.id] = r; });

/* ============================================================ 3. the model */
var DOC_SCHEMA = 'tools.petrov.re/incidenttree/v1';
var EXCHANGE_SCHEMA = 'tools.petrov.re/safety-exchange/v1';
var KINDS = ['fact', 'inference', 'hypothesis', 'unknown'];
var FACTORS = ['event', 'action', 'condition', 'equipment', 'organisational', 'other'];
var EVTYPES = ['document', 'photo', 'measurement', 'testimony'];
var BSTATES = ['', 'present', 'failed', 'missing', 'na'];
var CONFS = ['', 'high', 'medium', 'low'];
var SIDES = ['', 'preventive', 'mitigative'];
var UNCONFIRMED = { hypothesis: 1, unknown: 1 };

var M = {};
M.clone = function (o) { return JSON.parse(JSON.stringify(o)); };
M.blank = function () {
  return { schema: DOC_SCHEMA, title: '', entries: [], links: [], barriers: [], actions: [], imports: [], counters: { E: 0, L: 0, B: 0, A: 0 } };
};
function str(v, max) { v = v == null ? '' : String(v); return max ? v.slice(0, max) : v; }
function oneOf(v, list, d) { return list.indexOf(v) >= 0 ? v : d; }
M.nextId = function (doc, p) {
  var used = {}, arr = { E: doc.entries, L: doc.links, B: doc.barriers, A: doc.actions }[p] || [];
  arr.forEach(function (x) { used[x.id] = 1; });
  var n = Math.max(doc.counters[p] || 0, 0);
  do { n += 1; } while (used[p + n]);
  doc.counters[p] = n;
  return p + n;
};
/* IDs are never reused: explicit numeric IDs raise the counter too */
M.bump = function (doc, id) {
  var m = String(id || '').match(/^([ELBA])(\d+)$/);
  if (m) doc.counters[m[1]] = Math.max(doc.counters[m[1]] || 0, +m[2]);
};
M.find = function (doc, id) {
  var lists = [doc.entries, doc.links, doc.barriers, doc.actions];
  for (var i = 0; i < lists.length; i++) for (var j = 0; j < lists[i].length; j++) if (lists[i][j].id === id) return lists[i][j];
  return null;
};
M.entry = function (doc, id) { for (var i = 0; i < doc.entries.length; i++) if (doc.entries[i].id === id) return doc.entries[i]; return null; };
M.barrierById = function (doc, id) { for (var i = 0; i < doc.barriers.length; i++) if (doc.barriers[i].id === id) return doc.barriers[i]; return null; };

/* Entries start as hypotheses (nothing is established until evidence is
   recorded) and are never marked as root cause by default (ICT-R-008). */
M.newEntry = function (f) {
  f = f || {};
  return {
    id: str(f.id), seq: isFinite(+f.seq) ? +f.seq : 0, time: str(f.time, 40), actor: str(f.actor, 200),
    text: str(f.text, 2000), kind: oneOf(f.kind, KINDS, 'hypothesis'), factor: oneOf(f.factor, FACTORS, 'event'),
    evidence: Array.isArray(f.evidence) ? f.evidence.filter(function (e) { return e && typeof e === 'object'; }).map(function (e) {
      return { type: oneOf(e.type, EVTYPES, 'document'), ref: str(e.ref, 400) };
    }) : [],
    root: f.root === true, outcome: f.outcome === true,
    history: Array.isArray(f.history) ? f.history.filter(function (h) { return h && KINDS.indexOf(h.from) >= 0 && KINDS.indexOf(h.to) >= 0; })
      .map(function (h) { return { from: h.from, to: h.to, at: str(h.at, 40) }; }) : []
  };
};
M.addEntry = function (doc, f) {
  var e = M.newEntry(f);
  if (!e.id || M.find(doc, e.id)) e.id = M.nextId(doc, 'E');
  if (!(f && isFinite(+f.seq) && f.seq !== '' && f.seq != null)) {
    e.seq = doc.entries.reduce(function (m, x) { return Math.max(m, x.seq || 0); }, 0) + 1;
