  function computeView(s){
    last = solve(s); if (stage) stage.schedule();
    var r = last, e;
    if (!r || !r.ok) { e = (r && r.error) || 'Unknown error'; return { verdict: { tone: 'bad', text: trMsg(e) }, tiles: [], notes: [] }; }
    function fin(v){ return typeof v === 'number' && isFinite(v); }
    var tiles = [], notes = [], meters = [], tables = [], i, w, k, t = [], b = [];
    function add(label, v, unit, learn, head, tone){ if (!fin(v)) return; tiles.push({ label: label, value: sigv(v, 4), hint: unit, precision: sig(v, 4), tone: tone || null, learn: learn, headline: !!head }); }
    var X = DiagramUI.fmt(r.Ws_bl, { precision: 2 }), Y = DiagramUI.fmt(100 * r.xH2max, { precision: 1 });
    var GM = { 'Wobbe': ['Wobbe','Воббе','Wobbe','Wobbe','Wobbe','Wobbe','Wobbe'], 'relative density': ['relative density','відносна густина','relative Dichte','relatieve dichtheid','densité relative','densidad relativa','gęstość względna'], 'H2 limit': ['H₂ limit','ліміт H₂','H₂-Grenze','H₂-limiet','limite H₂','límite de H₂','limit H₂'] };
    var G = GM[r.governing] || [r.governing, r.governing, r.governing, r.governing, r.governing, r.governing, r.governing];
    var P = r.pass ? ['Blend within EN 16726 window: ','Суміш у межах вікна EN 16726: ','Mischung innerhalb des EN-16726-Fensters: ','Mengsel binnen EN 16726-venster: ','Mélange dans la plage EN 16726 : ','Mezcla dentro de la ventana EN 16726: ','Mieszanina w oknie EN 16726: ']
      : ['Blend outside limits: ','Суміш поза межами: ','Mischung außerhalb der Grenzen: ','Mengsel buiten de grenzen: ','Mélange hors limites : ','Mezcla fuera de límites: ','Mieszanina poza granicami: '];
    var WB = ['Wobbe','Воббе','Wobbe','Wobbe','Wobbe','Wobbe','Wobbe'], GR = ['gross','вища','brennwertbezogen','bovenwaarde','supérieur','superior','górna'];
    var MX = ['max H₂','макс. H₂','max. H₂','max. H₂','H₂ max','H₂ máx.','maks. H₂'], LB = ['limited by','обмежено:','begrenzt durch','begrensd door','limité par','limitado por','ograniczenie:'];
    for (k = 0; k < 7; k++) t.push(P[k] + WB[k] + ' Ws = ' + X + ' MJ/m³ (' + GR[k] + '), ' + MX[k] + ' ' + Y + ' % (' + LB[k] + ' ' + G[k] + ')');
    var verdict = { tone: r.pass ? 'ok' : 'bad', text: T.apply(null, t) };
    add(T('Ws · Wobbe index (gross)','Ws · число Воббе (вище)','Ws · Wobbe-Index (oberer)','Ws · Wobbe-index (bovenwaarde)','Ws · indice de Wobbe (supérieur)','Ws · índice de Wobbe (superior)','Ws · liczba Wobbego (górna)'), r.Ws_bl, 'MJ/m³', 'wobbe', true, r.okW ? null : 'bad');
    add(T('xH2,max · max H₂ fraction','xH2,max · макс. частка H₂','xH2,max · max. H₂-Anteil','xH2,max · max. H₂-fractie','xH2,max · fraction H₂ max','xH2,max · fracción máx. de H₂','xH2,max · maks. udział H₂'), 100 * r.xH2max, '%', 'limit');
    add(T('d · relative density','d · відносна густина','d · relative Dichte','d · relatieve dichtheid','d · densité relative','d · densidad relativa','d · gęstość względna'), r.d_bl, '', 'density', false, r.okd ? null : 'bad');
    add(T('ΔWs · Wobbe change','ΔWs · зміна Воббе','ΔWs · Wobbe-Änderung','ΔWs · Wobbe-verandering','ΔWs · variation Wobbe','ΔWs · cambio de Wobbe','ΔWs · zmiana Wobbego'), r.dWs_pct, '%', 'wobbe');
    add(T('V̇ ratio · volume flow increase','Відношення V̇ · зростання об’ємної витрати','V̇-Verhältnis · Volumenstromanstieg','V̇-verhouding · toename volumestroom','Rapport V̇ · hausse du débit volumique','Relación V̇ · aumento del caudal','Stosunek V̇ · wzrost strumienia objętości'), r.Vratio, '', 'energy');
    add(T('CO₂ reduction (per GJ HHV)','Зниження CO₂ (на ГДж HHV)','CO₂-Minderung (je GJ HHV)','CO₂-reductie (per GJ HHV)','Réduction CO₂ (par GJ PCS)','Reducción de CO₂ (por GJ PCS)','Redukcja CO₂ (na GJ HHV)'), r.co2_red_pct, '%', 'co2');
    if (s && s.level === 'full') {
      add(T('Wi · Wobbe index (net)','Wi · число Воббе (нижче)','Wi · Wobbe-Index (unterer)','Wi · Wobbe-index (onderwaarde)','Wi · indice de Wobbe (inférieur)','Wi · índice de Wobbe (inferior)','Wi · liczba Wobbego (dolna)'), r.Wi_bl, 'MJ/m³', 'wobbe');
      add(T('Hs · gross CV','Hs · вища теплота згоряння','Hs · Brennwert','Hs · bovenwaarde','Hs · PCS','Hs · PCS','Hs · ciepło spalania'), r.Hs_bl, 'MJ/m³', 'basis');
      add(T('Hi · net CV','Hi · нижча теплота згоряння','Hi · Heizwert','Hi · onderwaarde','Hi · PCI','Hi · PCI','Hi · wartość opałowa'), r.Hi_bl, 'MJ/m³', 'basis');
      add(T('V̇ · blend flow','V̇ · витрата суміші','V̇ · Mischungsstrom','V̇ · mengseldebiet','V̇ · débit du mélange','V̇ · caudal de mezcla','V̇ · strumień mieszaniny'), r.Vdot_bl, 'm³/s', 'energy');
      add(T('V̇H₂ · hydrogen flow','V̇H₂ · витрата водню','V̇H₂ · Wasserstoffstrom','V̇H₂ · waterstofdebiet','V̇H₂ · débit d’hydrogène','V̇H₂ · caudal de hidrógeno','V̇H₂ · strumień wodoru'), r.Vh2, 'm³/s', 'energy');
      add(T('H₂ energy share (HHV)','Енергетична частка H₂ (HHV)','H₂-Energieanteil (HHV)','H₂-energieaandeel (HHV)','Part énergétique H₂ (PCS)','Cuota energética de H₂ (PCS)','Udział energii H₂ (HHV)'), r.h2_energy_share_pct, '%', 'energy');
      add(T('xH2 Wobbe limit','xH2 ліміт за Воббе','xH2 Wobbe-Grenze','xH2 Wobbe-limiet','xH2 limite Wobbe','xH2 límite Wobbe','xH2 limit Wobbego'), 100 * r.xH2max_W, '%', 'limit');
      add(T('xH2 density limit','xH2 ліміт за густиною','xH2 Dichtegrenze','xH2 dichtheidslimiet','xH2 limite densité','xH2 límite de densidad','xH2 limit gęstości'), 100 * r.xH2max_d, '%', 'limit');
    }
    var BP = ['Basis: ','Основа: ','Grundlage: ','Basis: ','Base : ','Base: ','Podstawa: '];
    var BS = ['; energy on gross (HHV) basis','; енергія за вищою теплотою згоряння (HHV)','; Energie auf Brennwertbasis (HHV)','; energie op bovenwaarde (HHV)','; énergie sur base PCS (HHV)','; energía sobre base PCS (HHV)','; energia wg ciepła spalania (HHV)'];
    var BL = trMsg(r.basis_label || '');
    for (k = 0; k < 7; k++) b.push(BP[k] + BL[LANGS7[k]] + BS[k]);
    notes.push(T.apply(null, b));
    for (i = 0; r.warnings && i < r.warnings.length; i++) { w = r.warnings[i]; notes.push(trMsg(w)); }
    return { verdict: verdict, tiles: tiles, meters: meters, tables: tables, notes: notes };
  }

  function degrade() {
    document.title = 'diagram-ui.js v1 is required';
    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1');
    h.textContent = 'Hydrogen blending into natural gas';
    var p = document.createElement('p');
    p.textContent = 'The interactive interface could not load. The export, the calculation record '
                  + 'and the limitations are still available from the bar at the bottom of the page.';
    host.appendChild(h);
    host.appendChild(p);
    last = solve(state);
  }

    installData();
  }

              'Der Wasserstoffanteil ist ein Stoffmengen- (= Volumen-)anteil des fertigen Gemischs: Das Erdgas wird mit (1 − xH2) skaliert, Wasserstoff füllt den Rest. Da Wasserstoff je Kubikmeter nur etwa ein Drittel der Energie von Methan enthält, ergeben 20 Vol.-% rund 7 % der Energie.',

              'La part d’hydrogène est une fraction molaire (= volumique) du mélange final : le gaz naturel est multiplié par (1 − xH2) et l’hydrogène complète. Comme l’hydrogène ne porte qu’environ un tiers de l’énergie du méthane par mètre cube, 20 % en volume représentent environ 7 % de l’énergie.',

              'Побутові прилади, випробувані за EN 437 з граничним газом G222 (23 % H₂), зазвичай витримують до приблизно 20 % H₂. Газові турбіни, балони транспортних засобів на КПГ (UN ECE R110 дозволяє близько 2 %), деякі промислові процеси та підземні сховища можуть бути значно суворішими, тож задайте межу H₂ за найвразливішим споживачем у мережі.',
              'Haushaltsgeräte, die nach EN 437 mit dem Grenzgas G222 (23 % H₂) geprüft sind, vertragen meist bis etwa 20 % H₂. Gasturbinen, CNG-Fahrzeugtanks (UN ECE R110 erlaubt etwa 2 %), manche Industrieprozesse und Untergrundspeicher können deutlich strenger sein; setzen Sie die H₂-Grenze daher nach dem empfindlichsten Nutzer im Netz.',
              'Huishoudelijke toestellen die volgens EN 437 met het grensgas G222 (23 % H₂) zijn beproefd, verdragen meestal tot ongeveer 20 % H₂. Gasturbines, CNG-voertuigtanks (UN ECE R110 staat ongeveer 2 % toe), sommige industriële processen en ondergrondse opslag kunnen veel strenger zijn; stel de H₂-limiet dus in op de gevoeligste gebruiker in het net.',
              'Les appareils domestiques essayés selon l’EN 437 avec le gaz limite G222 (23 % de H₂) supportent en général jusqu’à environ 20 % de H₂. Les turbines à gaz, les réservoirs de véhicules GNC (UN ECE R110 admet environ 2 %), certains procédés industriels et les stockages souterrains peuvent être beaucoup plus restrictifs : réglez la limite H₂ sur l’utilisateur le plus sensible du réseau.',
              'Los aparatos domésticos ensayados según EN 437 con el gas límite G222 (23 % de H₂) suelen tolerar hasta un 20 % de H₂. Las turbinas de gas, los depósitos de vehículos de GNC (UN ECE R110 admite cerca del 2 %), algunos procesos industriales y los almacenamientos subterráneos pueden ser mucho más restrictivos, así que fije el límite de H₂ según el usuario más sensible de la red.',
              'Urządzenia domowe badane wg EN 437 gazem granicznym G222 (23 % H₂) zwykle tolerują do około 20 % H₂. Turbiny gazowe, zbiorniki pojazdów CNG (UN ECE R110 dopuszcza około 2 %), niektóre procesy przemysłowe i magazyny podziemne mogą być znacznie bardziej wymagające, dlatego limit H₂ ustaw według najwrażliwszego odbiorcy w sieci.'

              'Kijk in de volledige weergave naar beide grenzen: het rijke gas heeft Wobbe-ruimte tot 32 % H₂, maar de dichtheidsondergrens beperkt het tot 16,5 %, dus 20 % faalt.',
              'Regardez les deux limites en vue complète : le gaz riche a une marge de Wobbe jusqu’à 32 % de H₂, mais le plancher de densité le limite à 16,5 %, donc 20 % échoue.',
              'Fíjese en los dos límites en la vista completa: el gas rico tiene margen de Wobbe hasta el 32 % de H₂, pero el mínimo de densidad lo limita al 16,5 %, así que el 20 % falla.',
              'Zwróć uwagę na obie granice w widoku pełnym: bogaty gaz ma zapas Wobbego do 32 % H₂, ale dolna granica gęstości ogranicza go do 16,5 %, więc 20 % nie przechodzi.'),
      apply: function (t) { t.ch4 = 0.85; t.c2h6 = 0.09; t.c3h8 = 0.03; t.n2 = 0.01; t.co2 = 0.02; t.xH2 = 0.20; t.E_MW = 100; t.level = 'full'; } },
    { id: 'inert_rich', label: T('Inert-rich gas (10 % N₂), 2 % H₂', 'Газ з інертними (10 % N₂), 2 % H₂', 'Inertreiches Gas (10 % N₂), 2 % H₂', 'Inertrijk gas (10 % N₂), 2 % H₂', 'Gaz riche en inertes (10 % N₂), 2 % H₂', 'Gas rico en inertes (10 % N₂), 2 % H₂', 'Gaz z dużą ilością inertów (10 % N₂), 2 % H₂'),
      note: T('Look at xH2,max = 0: with 10 % nitrogen the base gas is already at Wobbe 42.75 MJ/m³, below the H-gas floor 46.44, so there is no headroom for any hydrogen in an H-gas grid.',
              'Подивіться на xH2,max = 0: з 10 % азоту базовий газ уже має Воббе 42,75 МДж/м³, нижче межі H-газу 46,44, тож у мережі H-газу немає запасу для жодного водню.',
              'Achten Sie auf xH2,max = 0: Mit 10 % Stickstoff hat das Grundgas schon Wobbe 42,75 MJ/m³, unter der H-Gas-Untergrenze 46,44, es bleibt also im H-Gas-Netz kein Platz für Wasserstoff.',
              'Kijk naar xH2,max = 0: met 10 % stikstof heeft het basisgas al Wobbe 42,75 MJ/m³, onder de H-gas-ondergrens 46,44, dus in een H-gasnet is er geen ruimte voor waterstof.',
              'Regardez xH2,max = 0 : avec 10 % d’azote, le gaz de base est déjà à un Wobbe de 42,75 MJ/m³, sous le plancher du gaz H (46,44), il n’y a donc aucune marge pour l’hydrogène dans un réseau de gaz H.',
              'Fíjese en xH2,max = 0: con un 10 % de nitrógeno el gas base ya tiene un Wobbe de 42,75 MJ/m³, por debajo del mínimo del gas H (46,44), así que en una red de gas H no hay margen para hidrógeno.',
              'Zwróć uwagę na xH2,max = 0: przy 10 % azotu gaz bazowy ma już Wobbego 42,75 MJ/m³, poniżej granicy gazu H 46,44, więc w sieci gazu H nie ma miejsca na wodór.'),
      apply: function (t) { t.ch4 = 0.84; t.c2h6 = 0.03; t.c3h8 = 0.005; t.n2 = 0.10; t.co2 = 0.025; t.xH2 = 0.02; t.E_MW = 100; t.level = 'simple'; } },
    { id: 'distribution', label: T('Distribution network, 2 % H₂', 'Розподільна мережа, 2 % H₂', 'Verteilnetz, 2 % H₂', 'Distributienet, 2 % H₂', 'Réseau de distribution, 2 % H₂', 'Red de distribución, 2 % H₂', 'Sieć dystrybucyjna, 2 % H₂'),
      note: T('Look at the H₂ energy share in the full view: 2 % by volume is only 0.64 % of the energy delivered — a first step for a local grid, not a decarbonisation route.',
              'Подивіться на енергетичну частку H₂ у повному режимі: 2 % за об’ємом — це лише 0,64 % енергії — перший крок для місцевої мережі, а не шлях декарбонізації.',
              'Achten Sie in der Vollansicht auf den H₂-Energieanteil: 2 % nach Volumen sind nur 0,64 % der Energie — ein erster Schritt für ein Ortsnetz, kein Dekarbonisierungspfad.',
              'Kijk in de volledige weergave naar het H₂-energieaandeel: 2 % naar volume is maar 0,64 % van de energie — een eerste stap voor een lokaal net, geen decarbonisatieroute.',
              'Regardez la part énergétique de H₂ en vue complète : 2 % en volume ne représentent que 0,64 % de l’énergie — un premier pas pour un réseau local, pas une voie de décarbonation.',
              'Fíjese en la cuota energética de H₂ en la vista completa: un 2 % en volumen es solo el 0,64 % de la energía; un primer paso para una red local, no una vía de descarbonización.',
              'Zwróć uwagę na udział energii H₂ w widoku pełnym: 2 % objętościowo to tylko 0,64 % energii — pierwszy krok dla sieci lokalnej, a nie droga do dekarbonizacji.'),
      apply: function (t) { t.ch4 = 0.90; t.c2h6 = 0.05; t.c3h8 = 0.01; t.n2 = 0.02; t.co2 = 0.02; t.xH2 = 0.02; t.E_MW = 5; t.level = 'full'; } }
    ]; ui.examples(EX);

    function curveData() {
      if (!last || !last.ok) return null;
      var s = {}, k, i, r, pts = [], ymn = state.WsMin, ymx = state.WsMax;
      for (k in state) if (Object.prototype.hasOwnProperty.call(state, k)) s[k] = state[k];
      for (i = 0; i <= 30; i++) {
        s.xH2 = i * 0.02; r = solve(s);
        if (r && r.ok && isFinite(r.Ws_bl)) { pts.push({ x: 100 * s.xH2, y: r.Ws_bl }); ymn = Math.min(ymn, r.Ws_bl); ymx = Math.max(ymx, r.Ws_bl); }
      }
      return { pts: pts, xMin: 0, xMax: 60, yMin: ymn - 1, yMax: ymx + 1, xCur: 100 * state.xH2, yCur: last.Ws_bl, xMax_H2: 100 * last.xH2max, WsMin: state.WsMin, WsMax: state.WsMax };
    }
    ui.stage({
      caption: T('Wobbe index of the blend versus hydrogen fraction (ISO 6976:2016, gross, 15/15 °C) with EN 16726 limits', 'Число Воббе суміші залежно від частки водню (ISO 6976:2016, вище, 15/15 °C) з межами EN 16726', 'Wobbe-Index des Gemischs in Abhängigkeit vom Wasserstoffanteil (ISO 6976:2016, oberer, 15/15 °C) mit Grenzwerten nach EN 16726', 'Wobbe-index van het mengsel versus waterstoffractie (ISO 6976:2016, bovenwaarde, 15/15 °C) met EN 16726-grenzen', 'Indice de Wobbe du mélange en fonction de la fraction d’hydrogène (ISO 6976:2016, supérieur, 15/15 °C) avec limites EN 16726', 'Índice de Wobbe de la mezcla frente a la fracción de hidrógeno (ISO 6976:2016, superior, 15/15 °C) con límites EN 16726', 'Liczba Wobbego mieszaniny w funkcji udziału wodoru (ISO 6976:2016, górna, 15/15 °C) z granicami EN 16726'),
      minHeight: 300,
      a11y: function () {
        if (!last || !last.ok) return '';
        var a = DiagramUI.fmt(last.Ws_bl, { precision: 2 }), b = DiagramUI.fmt(100 * last.xH2max, { precision: 1 }), c = DiagramUI.fmt(100 * state.xH2, { precision: 1 });
        return tx(T('Line chart: gross Wobbe index of the natural gas / hydrogen blend versus hydrogen mole fraction 0–60 %, with the EN 16726 Wobbe limits; current point ' + c + ' % H₂ at ' + a + ' MJ/m³, maximum hydrogen fraction ' + b + ' %.',
          'Лінійний графік: вище число Воббе суміші природного газу з воднем залежно від мольної частки водню 0–60 %, з межами Воббе EN 16726; поточна точка ' + c + ' % H₂ при ' + a + ' МДж/м³, максимальна частка водню ' + b + ' %.',
          'Liniendiagramm: oberer Wobbe-Index des Erdgas-Wasserstoff-Gemischs über dem Wasserstoff-Stoffmengenanteil 0–60 % mit den Wobbe-Grenzen nach EN 16726; aktueller Punkt ' + c + ' % H₂ bei ' + a + ' MJ/m³, maximaler Wasserstoffanteil ' + b + ' %.',
          'Lijngrafiek: Wobbe-index (bovenwaarde) van het aardgas-waterstofmengsel tegen de molfractie waterstof 0–60 %, met de Wobbe-grenzen van EN 16726; huidig punt ' + c + ' % H₂ bij ' + a + ' MJ/m³, maximale waterstoffractie ' + b + ' %.',
          'Graphique linéaire : indice de Wobbe supérieur du mélange gaz naturel / hydrogène en fonction de la fraction molaire d’hydrogène 0–60 %, avec les limites de Wobbe EN 16726 ; point actuel ' + c + ' % de H₂ à ' + a + ' MJ/m³, fraction maximale d’hydrogène ' + b + ' %.',
          'Gráfico de líneas: índice de Wobbe superior de la mezcla de gas natural e hidrógeno frente a la fracción molar de hidrógeno 0–60 %, con los límites de Wobbe de EN 16726; punto actual ' + c + ' % de H₂ a ' + a + ' MJ/m³, fracción máxima de hidrógeno ' + b + ' %.',
          'Wykres liniowy: górna liczba Wobbego mieszaniny gazu ziemnego z wodorem w funkcji ułamka molowego wodoru 0–60 %, z granicami Wobbego EN 16726; bieżący punkt ' + c + ' % H₂ przy ' + a + ' MJ/m³, maksymalny udział wodoru ' + b + ' %.'));
      },
      render: function (size, st) {
        var ctx = st.canvas(), w = size.w, h = size.h, coarse = size.density === 'coarse';
        var cs = getComputedStyle(document.documentElement);
        var muted = cs.getPropertyValue('--muted').trim() || '#888', line = cs.getPropertyValue('--line').trim() || '#ccc', font = cs.getPropertyValue('--font').trim() || 'sans-serif';
        ctx.clearRect(0, 0, w, h);
        var d = curveData(); if (!d) return;
        var L = coarse ? 46 : 58, R = 14, TOP = 12, B = coarse ? 36 : 44, pw = w - L - R, ph = h - TOP - B, i, t;
        function X(x) { return L + (x - d.xMin) / (d.xMax - d.xMin) * pw; }
        function Y(y) { return TOP + ph - (y - d.yMin) / (d.yMax - d.yMin) * ph; }
        function seg(x0, y0, x1, y1, col, lw, dash) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.setLineDash(dash || []); ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
        seg(L, TOP, L, TOP + ph, line, 1); seg(L, TOP + ph, L + pw, TOP + ph, line, 1);
        ctx.fillStyle = muted; ctx.font = (coarse ? 11 : 12) + 'px ' + font;
        var xt = DiagramUI.ticks(d.xMin, d.xMax, pw, size.density), yt = DiagramUI.ticks(d.yMin, d.yMax, ph, size.density);
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        for (i = 0; i < xt.length; i++) { t = X(xt[i]); seg(t, TOP + ph, t, TOP + ph + 4, line, 1); ctx.fillText(DiagramUI.fmt(xt[i], { precision: 0 }), t, TOP + ph + 6); }
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        for (i = 0; i < yt.length; i++) { t = Y(yt[i]); seg(L - 4, t, L, t, line, 1); ctx.fillText(DiagramUI.fmt(yt[i], { precision: 1 }), L - 6, t); }
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText('H₂, mol %', L + pw / 2, h - 2);
        ctx.save(); ctx.translate(12, TOP + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textBaseline = 'middle'; ctx.fillText('Ws, MJ/m³', 0, 0); ctx.restore();
        ctx.save(); ctx.beginPath(); ctx.rect(L, TOP, pw, ph); ctx.clip();
        seg(L, Y(d.WsMin), L + pw, Y(d.WsMin), DiagramUI.series(1), 1, [5, 4]); seg(L, Y(d.WsMax), L + pw, Y(d.WsMax), DiagramUI.series(1), 1, [5, 4]);
        seg(X(d.xMax_H2), TOP, X(d.xMax_H2), TOP + ph, DiagramUI.series(2), 1.5);
        seg(X(d.xCur), TOP, X(d.xCur), TOP + ph, muted, 1, [5, 4]);
        ctx.setLineDash([]); ctx.strokeStyle = DiagramUI.series(0); ctx.lineWidth = 2; ctx.beginPath();
        for (i = 0; i < d.pts.length; i++) { if (i) ctx.lineTo(X(d.pts[i].x), Y(d.pts[i].y)); else ctx.moveTo(X(d.pts[i].x), Y(d.pts[i].y)); }
        ctx.stroke();
        if (isFinite(d.yCur)) { ctx.fillStyle = DiagramUI.series(0); ctx.beginPath(); ctx.arc(X(d.xCur), Y(d.yCur), coarse ? 3 : 4, 0, 2 * Math.PI); ctx.fill(); }
        ctx.restore();
      }
    });
    adoptStage(ui);

    ui.ready();
    window['__h2_ng_blending'] = { ui: ui, state: state, solve: solve, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function buildRecord(){
    if (!last) return null;
    var inputs = {}, outputs = {}, units = {}, warnings, i, k;
    var inU = [
      ['level','-'],
      ['ch4','-'], ['c2h6','-'], ['c3h8','-'], ['n2','-'], ['co2','-'], ['xH2','-'],
      ['tComb','degC'], ['tMeter','degC'],
      ['E_MW','MW (gross)'],
      ['WsMin','MJ/m3 (gross, 15/15 C)'], ['WsMax','MJ/m3 (gross, 15/15 C)'],
      ['dMin','-'], ['dMax','-'], ['xH2Lim','-']
    ];
    for (i = 0; i < inU.length; i++) { k = inU[i][0]; inputs[k] = state[k]; units[k] = inU[i][1]; }
    if (last.ok) {
      var outU = [
        ['Hs_ng','MJ/m3'], ['Hi_ng','MJ/m3'], ['Hs_bl','MJ/m3'], ['Hi_bl','MJ/m3'],
        ['Ws_ng','MJ/m3'], ['Wi_ng','MJ/m3'], ['Ws_bl','MJ/m3'], ['Wi_bl','MJ/m3'],
        ['d_ng','-'], ['d_bl','-'],
        ['Hs_mass_bl','MJ/kg'], ['Hi_mass_bl','MJ/kg'],
        ['dWs_pct','%'], ['dHs_pct','%'], ['h2_energy_share_pct','%'], ['co2_red_pct','%'],
        ['Vdot_ng','m3/s'], ['Vdot_bl','m3/s'], ['Vh2','m3/s'],
        ['Vratio','-'],
        ['co2_ng','kgCO2/GJ (HHV)'], ['co2_bl','kgCO2/GJ (HHV)'],
        ['xH2max_W','-'], ['xH2max_d','-'], ['xH2max','-'],
        ['governing','-'], ['basis_label','-'], ['energy_basis','-'],
        ['pass','-']
      ];
      for (i = 0; i < outU.length; i++) { k = outU[i][0]; outputs[k] = last[k]; units[k] = outU[i][1]; }
      warnings = (last.warnings || []).slice();
    } else {
      warnings = [last.error];
    }
    return {
      inputs: inputs,
      outputs: outputs,
      units: units,
      model: {
        equations: [
          'ISO 6976:2016 (2016-08): Z = 1 - (sum x_i s_i)^2',
          'Hs_vol = sum x_i Hs_i / (Z R T / p)',
          'd = (M / Mair) (Zair / Z)',
          'Wobbe: Ws = Hs_vol / sqrt(d)',
          'Vdot = E / Hs_vol',
          'EN 16726:2015+A1:2018 window check (WsMin <= Ws <= WsMax, dMin <= d <= dMax)',
          'xH2max by bisection on Ws(x) = WsMin and d(x) = dMin'
        ],
        ranges: [
          'H-gas / L-gas natural gas with components up to C3 plus N2, CO2',
          'xH2 0 - 0.99'
        ],
        notes: [
          'Energy on gross (HHV) basis at combustion 15 C, metering 15 C / 101.325 kPa unless changed',
          'Flame speed, flashback and materials (H2 embrittlement) not assessed'
        ]
      },
      warnings: warnings
    };
  }
  var HANDOFF = {
    provides: ['Q','x'],
    accepts: ['Q','x'],
    build: function(){
      if (!(last && last.ok)) return null;
      var xh = +state.xH2, keys = ['ch4','c2h6','c3h8','n2','co2'], sum = 0, comp = {}, i, v;
      /* sets are arrays of numeric SI rows (FRAMEWORK_V2_SPEC 1.5); Q = blend energy flow (gross), W */
      for (i = 0; i < keys.length; i++) { v = +state[keys[i]]; if (isFinite(v) && v > 0) sum += v; }
      for (i = 0; i < keys.length; i++) {
        v = +state[keys[i]];
        comp[keys[i]] = { value: (sum > 0 && isFinite(v) && v > 0) ? v / sum * (1 - xh) : 0, unit: '-' };
      }
      comp.h2 = { value: xh, unit: '-' };
      return {
        quantities: {
          Q: { value: state.E_MW * 1e6, unit: 'W' },
          x: { value: xh, unit: '-' }
        },
        sets: { composition: [comp] }
      };
    },
    apply: function(payload){
      var q = (payload && payload.quantities) || {}, e, x;
      function val(o){ return (o && typeof o === 'object') ? +o.value : +o; }
      if (q.Q != null) { e = val(q.Q); if (isFinite(e) && e > 0) state.E_MW = e / 1e6; }
      if (q.x != null) { x = val(q.x); if (isFinite(x) && x >= 0 && x <= 0.99) state.xH2 = x; }
      last = solve(state);
      if (ui) { ui.sync(); ui.run(); }
    }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'h2_ng_blending',
        file: 'h2_ng_blending.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
