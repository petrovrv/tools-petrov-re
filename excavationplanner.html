      'Ce que fait cet outil', 'Qué hace esta herramienta', 'Co robi to narzędzie'),
    learnBody: T('Enter the section, the ground as described, water, access, services and the objects beside the edge. Every rule returns a finding, a review item, missing data or no finding, and numbered markers place the open ones on the drawing.',
      'Введіть розріз, опис ґрунту, воду, доступ, комунікації та об’єкти біля бровки. Кожне правило дає зауваження, пункт для розгляду, брак даних або відсутність зауважень; нумеровані позначки ставлять відкриті пункти на кресленні.',
      'Schnitt, beschriebenen Boden, Wasser, Zugang, Leitungen und die Objekte am Rand eingeben. Jede Regel liefert einen Befund, einen Prüfpunkt, fehlende Daten oder keinen Befund; nummerierte Marken setzen die offenen Punkte in die Zeichnung.',
      'Voer de doorsnede, de beschreven grond, water, toegang, kabels en leidingen en de objecten naast de rand in. Elke regel geeft een bevinding, een beoordelingspunt, ontbrekende gegevens of geen bevinding; genummerde markeringen zetten de open punten in de tekening.',
      'Saisissez la coupe, le sol décrit, l’eau, l’accès, les réseaux et les objets en crête. Chaque règle rend un constat, un point à examiner, des données manquantes ou aucun constat ; des repères numérotés placent les points ouverts sur le dessin.',
      'Introduzca la sección, el terreno descrito, el agua, el acceso, los servicios y los objetos junto al borde. Cada regla da un hallazgo, un punto de revisión, datos ausentes o ningún hallazgo; marcadores numerados sitúan los abiertos en el dibujo.',
      'Wprowadź przekrój, opis gruntu, wodę, dojście, uzbrojenie i obiekty przy krawędzi. Każda reguła zwraca ustalenie, punkt do oceny, brak danych albo brak ustaleń; numerowane znaczniki umieszczają otwarte punkty na rysunku.'),
    lPackT: T('Rule packs', 'Пакети правил', 'Regelpakete', 'Regelpakketten', 'Référentiels', 'Paquetes de reglas', 'Pakiety reguł'),
    lPackB: T('Depth, slope, setback and egress numbers differ between jurisdictions. A pack names its source, jurisdiction and version, and only a selected pack turns a number into a finding. With no pack the tool marks the item for engineering review and states no limit.',
      'Числа глибини, укосу, відступу та відстані до виходу різняться між юрисдикціями. Пакет називає джерело, юрисдикцію і версію, і лише вибраний пакет перетворює число на зауваження. Без пакета інструмент позначає пункт для інженерного розгляду і не називає меж.',
      'Zahlen zu Tiefe, Böschung, Abstand und Fluchtweg unterscheiden sich je Rechtsraum. Ein Paket nennt Quelle, Rechtsraum und Fassung, und nur ein gewähltes Paket macht aus einer Zahl einen Befund. Ohne Paket markiert das Werkzeug den Punkt zur Fachprüfung und nennt keine Grenze.',
      'Getallen voor diepte, talud, afstand en vluchtweg verschillen per rechtsgebied. Een pakket noemt bron, rechtsgebied en versie, en alleen een gekozen pakket maakt van een getal een bevinding. Zonder pakket markeert de tool het punt voor technische beoordeling en noemt geen grens.',
      'Les valeurs de profondeur, pente, recul et évacuation varient selon la juridiction. Un référentiel indique sa source, sa juridiction et sa version, et seul un référentiel choisi transforme une valeur en constat. Sans référentiel l’outil marque le point pour examen et n’affiche aucune limite.',
      'Las cifras de profundidad, talud, retranqueo y evacuación varían según la jurisdicción. Un paquete indica su fuente, jurisdicción y versión, y solo un paquete elegido convierte una cifra en hallazgo. Sin paquete la herramienta marca el punto para revisión técnica y no da ningún límite.',
      'Liczby dotyczące głębokości, skarpy, odsunięcia i wyjścia różnią się między jurysdykcjami. Pakiet podaje źródło, jurysdykcję i wersję i tylko wybrany pakiet zamienia liczbę w ustalenie. Bez pakietu narzędzie oznacza punkt do oceny inżynierskiej i nie podaje granic.'),
    lZoneT: T('The 1:1 planning zone', 'Планувальна зона 1:1', 'Die 1:1-Planungszone', 'De 1:1-planningszone', 'La zone de planification 1:1', 'La zona de planificación 1:1', 'Strefa planistyczna 1:1'),
    lZoneB: T('The hatched band beside each edge is as wide as the excavation is deep. A load inside it is marked for the wall stability or support review. It is a screening line of this tool, not a design rule.',
      'Заштрихована смуга біля кожної бровки має ширину, рівну глибині виїмки. Навантаження в ній позначається для розгляду стійкості стінки або кріплення. Це лінія відбору цього інструмента, а не проєктне правило.',
      'Das schraffierte Band neben jeder Kante ist so breit, wie die Baugrube tief ist. Eine Last darin wird zur Prüfung der Wandstandsicherheit oder des Verbaus markiert. Es ist eine Screening-Linie dieses Werkzeugs und keine Bemessungsregel.',
      'De gearceerde strook naast elke rand is even breed als de ontgraving diep is. Een last erin wordt gemarkeerd voor de beoordeling van wandstabiliteit of stempeling. Het is een screeningslijn van deze tool en geen ontwerpregel.',
      'La bande hachurée le long de chaque crête est aussi large que la fouille est profonde. Une charge à l’intérieur est marquée pour l’examen de stabilité de paroi ou du blindage. C’est une ligne de tri de cet outil et non une règle de calcul.',
      'La franja rayada junto a cada borde es tan ancha como profunda es la excavación. Una carga dentro de ella se marca para la revisión de estabilidad de la pared o de la entibación. Es una línea de cribado de esta herramienta y no una regla de diseño.',
      'Zakreskowany pas przy każdej krawędzi ma szerokość równą głębokości wykopu. Obciążenie wewnątrz niego jest oznaczane do oceny stateczności ściany lub obudowy. To linia przesiewowa tego narzędzia, a nie reguła projektowa.'),
    lServT: T('Underground services', 'Підземні комунікації', 'Leitungen im Boden', 'Kabels en leidingen', 'Réseaux enterrés', 'Servicios enterrados', 'Uzbrojenie podziemne'),
    lServB: T('Records, a detection survey, marking, hand-dug trial holes and the isolation state are separate pieces of evidence. Shoring, a ladder or a dry excavation does not close any of them.',
      'Схеми, обстеження детектором, розмітка, пробні шурфи вручну і стан відключення — окремі докази. Кріплення, драбина чи суха виїмка жодного з них не закривають.',
      'Bestandspläne, Ortung, Markierung, Suchschlitze von Hand und der Abschaltzustand sind getrennte Nachweise. Verbau, Leiter oder trockene Grube schließen keinen davon.',
      'Tekeningen, detectie, markering, handmatig gegraven proefsleuven en de afschakelstatus zijn afzonderlijke bewijsstukken. Stempeling, een ladder of een droge put sluit er geen enkele van.',
      'Plans des réseaux, détection, marquage, sondages manuels et état de consignation sont des preuves distinctes. Blindage, échelle ou fouille sèche n’en clôt aucune.',
      'Planos, detección, marcado, catas a mano y estado de aislamiento son evidencias distintas. La entibación, una escalera o una excavación seca no cierra ninguna.',
      'Mapy sieci, wykrywanie, oznakowanie, ręczne przekopy próbne i stan odłączenia to odrębne dowody. Obudowa, drabina czy suchy wykop nie zamyka żadnego z nich.'),

  /* the company/project pack is built from the plan; empty numbers switch a rule off */
  function customPack(c) {
    c = c || {};
    var num = function (v) { return (typeof v === 'number' && isFinite(v) && v > 0) ? v : null; };
    var hasSource = !!(c.source && String(c.source).trim());
    var p = {
      id: 'custom', kind: 'company', label: S.packCustom, custom: true, hasSource: hasSource,
      short: (c.name && String(c.name).trim()) || 'CUS',
      source: hasSource ? String(c.source).trim() : '',
      jurisdiction: (c.jur && String(c.jur).trim()) || S.empty,
      version: (c.ver && String(c.ver).trim()) || S.empty,
      classes: [{ id: 'cus', label: S.clsCustom, deg: num(c.slope) != null ? Math.min(90, num(c.slope)) : null }],
      protect: num(c.protect) != null ? { id: 'CUS-P-001', depth: num(c.protect), cmp: 'ge', cite: '' } : null,
      slope: num(c.slope) != null ? { id: 'CUS-P-002', cite: '' } : null,
      engineered: num(c.eng) != null ? { id: 'CUS-P-003', depth: num(c.eng), cmp: 'gt', cite: '' } : null,
      spoil: num(c.spoil) != null ? { id: 'CUS-P-004', d: num(c.spoil), cite: '', supported: 'apply' } : null,
      plant: num(c.plant) != null ? { id: 'CUS-P-005', bands: [{ max: null, d: num(c.plant) }], cite: '', supported: 'apply' } : null,
      access: (num(c.accD) != null && num(c.accT) != null) ? { id: 'CUS-P-006', depth: num(c.accD), travel: num(c.accT), cite: '' } : null
    };
    return p;
  }
  function packOf(plan) {
    if (plan.pack === 'custom') return customPack(plan.custom);
    return PACKS[plan.pack] || null;
  }
  /* a pack that may turn numbers into findings */
  function activePack(plan) {
    var p = packOf(plan);
    if (!p) return null;
    if (p.custom && !p.hasSource) return null;
    return p;
  }
  function packBasis(p) {
    return { kind: p.kind, source: p.source, jurisdiction: p.jurisdiction, version: p.version };
  }

    function add(rule, status, msg, args, anchor, extra) {

        args: args || {}, anchor: anchor || 'top', basis: def ? BASES[def.basis] : (extra && extra.basis), crit: (extra && extra.crit) || null,

      if (o.dist < 0) { add('EXC-E-001', 'fail', 'e001', { obj: objArg, kind: kindArg, x: { len: o.dist } }, anchor); return; }

      var zargs = { obj: objArg, kind: kindArg, x: { len: o.dist }, z: { len: g.zone } };

      if (isPlantKind(o.kind)) add('EXC-E-004', (inZone && !plan.access.warning) ? 'fail' : 'ok', 'e004', zargs, anchor);

    add('EXC-A-003', (A.entry && anyPlant) ? (A.exclusion ? 'ok' : 'fail') : 'na', 'a003', {}, 'access');
    add('EXC-A-004', A.barrier ? 'ok' : 'rev', 'a004', {}, 'crest');

        var ac = ap.access, crit6 = { op: '≤', v: ac.travel, u: 'm', from: ac.depth };

  function findingRecord(r, l) {

  function record() {

    return {
      inputs: { plan: clone(state) },
      outputs: {
        geometry_findings: area('geo'),
        edge_load_flags: area('edge'),
        water_status: { status: ev.areas.water, items: area('water') },

        review_items: ev.counts.rev,
