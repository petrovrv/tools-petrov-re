a este resultado","pl":"Czym jest ten wynik"},"genreText":{"en":"Candidate findings support an engineering review; they do not declare a requirement compliant or non-compliant automatically. Confirm language findings and project-specific verification choices with the responsible engineer.","uk":"Candidate findings підтримують інженерне рев’ю; вони не оголошують вимогу автоматично відповідною чи невідповідною. Підтверджуйте мовні findings і проєктні методи з відповідальним інженером.","de":"Kandidatenbefunde unterstützen ein Engineering-Review; sie erklären eine Anforderung nicht automatisch als konform oder nicht konform. Sprachbefunde und projektspezifische Verifikation sind zu bestätigen.","nl":"Kandidaatbevindingen ondersteunen een engineeringreview; ze verklaren een eis niet automatisch conform of niet-conform. Bevestig taalbevindingen en projectspecifieke verificatie met de verantwoordelijke engineer.","fr":"Les constats candidats appuient une revue d’ingénierie; ils ne déclarent pas automatiquement une exigence conforme ou non conforme. Confirmer les constats linguistiques et les choix projet avec l’ingénieur responsable.","es":"Los hallazgos candidatos apoyan una revisión de ingeniería; no declaran automáticamente un requisito conforme o no conforme. Confirme hallazgos lingüísticos y verificaciones específicas con el responsable.","pl":"Kandydackie ustalenia wspierają przegląd inżynierski; nie stwierdzają automatycznie zgodności lub niezgodności wymagania. Potwierdź ustalenia językowe i metody projektowe z odpowiedzialnym inżynierem."},"learnIntroTitle":{"en":"From requirement text to evidence path","uk":"Від тексту вимоги до шляху доказу","de":"Vom Anforderungstext zum Nachweispfad","nl":"Van eistekst naar bewijsroute","fr":"Du texte de l’exigence au chemin de preuve","es":"Del texto del requisito a la ruta de evidencia","pl":"Od tekstu wymagania do ścieżki dowodu"},"learnIntroBody":{"en":"Enter objectives, requirements and their verification plan. The tool checks quality candidates, traceability, acceptance criteria, verification method/phase, evidence and ownership. Validation is deliberately kept in a separate plan because it answers a different question from verification.","uk":"Введіть цілі, вимоги та план їх верифікації. Інструмент перевіряє якість формулювань, трасування, критерії приймання, метод/фазу верифікації, докази й власників. Валідацію навмисно ведено окремо, бо вона відповідає на інше питання.","de":"Ziele, Anforderungen und Verifikationsplan eingeben. Das Werkzeug prüft Qualitätskandidaten, Traceability, Abnahmekriterien, Methode/Phase, Nachweise und Verantwortung. Validierung bleibt bewusst getrennt, weil sie eine andere Frage beantwortet.","nl":"Voer doelen, eisen en verificatieplan in. De tool controleert kwaliteitskandidaten, traceerbaarheid, acceptatiecriteria, methode/fase, bewijs en eigenaarschap. Validatie blijft bewust apart omdat zij een andere vraag beantwoordt.","fr":"Saisissez objectifs, exigences et plan de vérification. L’outil contrôle qualité, traçabilité, critères d’acceptation, méthode/phase, preuves et responsabilités. La validation reste volontairement séparée car elle répond à une autre question.","es":"Introduzca objetivos, requisitos y plan de verificación. La herramienta comprueba calidad, trazabilidad, criterios de aceptación, método/fase, evidencia y responsables. La validación se mantiene separada porque responde a otra pregunta.","pl":"Wprowadź cele, wymagania i plan weryfikacji. Narzędzie sprawdza jakość, identyfikowalność, kryteria akceptacji, metodę/fazę, dowody i odpowiedzialność. Walidacja jest celowo oddzielona, bo odpowiada na inne pytanie."},"learnReqTitle":{"en":"Why requirement quality matters","uk":"Чому якість вимоги важлива","de":"Warum Anforderungsqualität zählt","nl":"Waarom kwaliteit van eisen telt","fr":"Pourquoi la qualité des exigences compte","es":"Por qué importa la calidad del requisito","pl":"Dlaczego jakość wymagania ma znaczenie"},"learnReqBody":{"en":"A requirement should be identifiable, traceable and written so that an agreed criterion can decide whether it is satisfied. Ambiguous adjectives and combined obligations are flagged as review candidates, not automatic errors.","uk":"Вимога має бути ідентифікованою, трасованою та сформульованою так, щоб узгоджений критерій дозволяв вирішити, чи її виконано. Неоднозначні прикметники й об’єднані обов’язки позначаються як кандидати для рев’ю, а не автоматичні помилки.","de":"Eine Anforderung soll identifizierbar, rückverfolgbar und so formuliert sein, dass ein vereinbartes Kriterium ihre Erfüllung entscheiden kann. Mehrdeutige Adjektive und kombinierte Pflichten sind Review-Kandidaten, keine automatischen Fehler.","nl":"Een eis moet identificeerbaar en traceerbaar zijn en zo zijn geformuleerd dat een afgesproken criterium kan bepalen of eraan is voldaan. Ambigue adjectieven en gecombineerde verplichtingen zijn reviewkandidaten, geen automatische fouten.","fr":"Une exigence doit être identifiable, traçable et formulée de façon qu’un critère convenu permette de décider si elle est satisfaite. Adjectifs ambigus et obligations combinées sont des candidats à la revue, pas des erreurs automatiques.","es":"Un requisito debe ser identificable, trazable y redactado para que un criterio acordado decida si se cumple. Adjetivos ambiguos y obligaciones combinadas se señalan para revisión, no como errores automáticos.","pl":"Wymaganie powinno być identyfikowalne, śledzalne i zapisane tak, aby uzgodnione kryterium pozwalało stwierdzić jego spełnienie. Niejednoznaczne określenia i połączone obowiązki są kandydatami do przeglądu, nie automatycznymi błędami."},"learnVerTitle":{"en":"Verification is a planned evidence path","uk":"Верифікація — це запланований шлях доказу","de":"Verifikation ist ein geplanter Nachweispfad","nl":"Verificatie is een geplande bewijsroute","fr":"La vérification est un chemin de preuve planifié","es":"La verificación es una ruta de evidencia planificada","pl":"Weryfikacja to zaplanowana ścieżka dowodu"},"learnVerBody":{"en":"Selecting “test” is not enough. A usable path also identifies the acceptance criterion, phase, evidence and who owns that evidence. The four common methods here are analysis, inspection, test and demonstration; a project-specific method needs an explicit definition.","uk":"Обрати «test» недостатньо. Потрібний шлях також визначає критерій приймання, фазу, доказ і його власника. Чотири типові методи тут: аналіз, інспекція, випробування й демонстрація; спеціальний метод проєкту потребує явного опису.","de":"„Test“ allein reicht nicht. Ein nutzbarer Pfad benennt auch Abnahmekriterium, Phase, Nachweis und Nachweisverantwortlichen. Übliche Methoden: Analyse, Inspektion, Test, Demonstration; projektspezifische Methoden brauchen eine Definition.","nl":"Alleen “test” kiezen is niet genoeg. Een bruikbare route noemt ook acceptatiecriterium, fase, bewijs en bewijseigenaar. Vier gangbare methoden: analyse, inspectie, test en demonstratie; een projectspecifieke methode moet expliciet worden gedefinieerd.","fr":"Choisir « essai » ne suffit pas. Un chemin exploitable identifie aussi le critère d’acceptation, la phase, la preuve et son responsable. Méthodes courantes : analyse, inspection, essai, démonstration; une méthode projet doit être définie explicitement.","es":"Elegir “ensayo” no basta. Una ruta útil identifica también criterio de aceptación, fase, evidencia y responsable. Métodos comunes: análisis, inspección, ensayo y demostración; un método de proyecto requiere definición explícita.","pl":"Sam wybór „test” nie wystarcza. Użyteczna ścieżka wskazuje także kryterium akceptacji, fazę, dowód i jego właściciela. Typowe metody: analiza, inspekcja, test i demonstracja; metoda projektowa wymaga jawnej definicji."},"learnValTitle":{"en":"Validation is not verification","uk":"Валідація — не верифікація","de":"Validierung ist nicht Verifikation","nl":"Validatie is geen verificatie","fr":"La validation n’est pas la vérification","es":"Validación no es verificación","pl":"Walidacja to nie weryfikacja"},"learnValBody":{"en":"Verification asks whether the requirement was satisfied by the product or process. Validation asks whether the resulting solution satisfies stakeholder needs and intended use. The tool therefore keeps validation objectives and products in a separate table.","uk":"Верифікація питає, чи виконано вимогу продуктом або процесом. Валідація питає, чи задовольняє рішення потреби стейкхолдерів і призначене використання. Тому цілі та продукти валідації ведуться окремо.","de":"Verifikation fragt, ob Produkt oder Prozess die Anforderung erfüllt. Validierung fragt, ob die Lösung Stakeholder-Bedarf und Intended Use erfüllt. Daher führt das Werkzeug Validierungsziele und -produkte getrennt.","nl":"Verificatie vraagt of product of proces aan de eis voldoet. Validatie vraagt of de oplossing aan stakeholderbehoeften en bedoeld gebruik voldoet. Daarom staan validatiedoelen en -producten apart.","fr":"La vérification demande si le produit ou processus satisfait l’exigence. La validation demande si la solution répond au besoin des parties prenantes et à l’usage prévu. Les objectifs et produits de validation sont donc séparés.","es":"La verificación pregunta si el producto o proceso cumple el requisito. La validación pregunta si la solución satisface las necesidades y el uso previsto. Por eso objetivos y productos de validación se mantienen separados.","pl":"Weryfikacja pyta, czy produkt lub proces spełnia wymaganie. Walidacja pyta, czy rozwiązanie spełnia potrzeby interesariuszy i zamierzone użycie. Dlatego cele i produkty walidacji są oddzielne."},"graphAlt":{"en":"Objectives connect to requirements; requirements connect to verification evidence. The drawing shows only the first ten requirements; the coverage table contains the complete working set.","uk":"Цілі з’єднано з вимогами, а вимоги — з доказами верифікації. На рисунку показано лише перші десять вимог; таблиця покриття містить увесь робочий набір.","de":"Ziele sind mit Anforderungen verbunden; Anforderungen mit Verifikationsnachweisen. Die Grafik zeigt nur die ersten zehn Anforderungen; die Abdeckungstabelle enthält den vollständigen Arbeitsumfang.","nl":"Doelen verbinden met eisen; eisen met verificatiebewijs. De tekening toont alleen de eerste tien eisen; de dekkingstabel bevat de volledige werkset.","fr":"Les objectifs se relient aux exigences, puis les exigences aux preuves de vérification. Le dessin montre seulement les dix premières exigences; la table de couverture contient tout le jeu de travail.","es":"Los objetivos se conectan con requisitos y estos con evidencia de verificación. El dibujo muestra solo los diez primeros requisitos; la tabla de cobertura contiene todo el conjunto de trabajo.","pl":"Cele łączą się z wymaganiami, a wymagania z dowodami weryfikacji. Rysunek pokazuje tylko pierwsze dziesięć wymagań; tabela pokrycia zawiera cały zestaw roboczy."},"reportExec":{"en":"Executive summary","uk":"Резюме","de":"Zusammenfassung","nl":"Samenvatting","fr":"Résumé exécutif","es":"Resumen ejecutivo","pl":"Podsumowanie wykonawcze"},"reportMethod":{"en":"Method and basis","uk":"Метод і основа","de":"Methode und Basis","nl":"Methode en basis","fr":"Méthode et base","es":"Método y base","pl":"Metoda i podstawa"},"reportInputs":{"en":"Inputs / working matrix","uk":"Вхідні дані / робоча матриця","de":"Eingaben / Arbeitsmatrix","nl":"Invoer / werkmatrix","fr":"Entrées / matrice de travail","es":"Entradas / matriz de trabajo","pl":"Dane wejściowe / macierz robocza"},"reportAssumptions":{"en":"Assumptions and unresolved items","uk":"Припущення та невирішені пункти","de":"Annahmen und offene Punkte","nl":"Aannames en open punten","fr":"Hypothèses et points ouverts","es":"Supuestos y puntos abiertos","pl":"Założenia i otwarte punkty"},"reportRefs":{"en":"References","uk":"Посилання","de":"Referenzen","nl":"Referenties","fr":"Références","es":"Referencias","pl":"Odniesienia"},"noRe function T(k){return I18N[k]||{en:k};}
function tx(obj){return obj&&typeof obj==='object'?(obj[lang]||obj.en||''):String(obj||'');}
function clean(x){return String(x==null?'':x).trim();}
function low(x){return clean(x).toLowerCase();}
function clone(x){return JSON.parse(JSON.stringify(x));}
function tokens(x){return low(x).replace(/[^a-z0-9à-žа-яіїєґ]+/gi,' ').split(/\s+/).filter(function(w){return w.length>2;});}
function jaccardSets(A,B){if(!A||!B||!A.size||!B.size)return 0;var inter=0;A.forEach(function(x){if(B.has(x))inter++;});return inter/(A.size+B.size-inter);}
function jaccard(a,b){return jaccardSets(new Set(tokens(a)),new Set(tokens(b)));}
function vague(x){return /\b(adequate|appropriate|sufficient|reasonable|user[- ]?friendly|easy|rapid|fast|minimal|maximum practical|as needed|where possible|if practical|normally|typically|etc\.?|and\/or|robust|reliable|high quality|low noise|small|large)\b/i.test(x);}
function subjective(x){return /\b(adequate|appropriate|sufficient|reasonable|user[- ]?friendly|easy|rapid|fast|minimal|robust|reliable|high quality|low noise|acceptable|suitable)\b/i.test(x);}
function measurableCue(x){return /\b(temperature|pressure|flow|speed|time|duration|capacity|accuracy|precision|noise|mass|weight|voltage|current|power|efficiency|availability|response|rate|frequency|level|dimension|diameter|length|height|width|load|force|stress|dose|leak|humidity|concentration|throughput)\b/i.test(x);}
function hasNumber(x){return /[-+]?\d+(?:[.,]\d+)?/.test(x);}
function weakAcceptance(x){return vague(x)||/^\s*(same as|as specified|meets requirement|compliant|acceptable)\s*$/i.test(x);}
function unknownish(x){return /^(tbd|unknown|unk|to be defined|to be confirmed|tbc|n\/a\?)$/i.test(clean(x));}
function obligationCount(x){var n=(x.match(/\b(shall|must|will be required to|is required to)\b/gi)||[]).length;if(n>1)return n;if(/\bshall\b/i.test(x)&&/\band\b/i.test(x)&&/\b(be|provide|maintain|support|limit|prevent|detect|allow|withstand|operate|include|ensure)\b[^.]{0,80}\band\b/i.test(x))return 2;return n;}
function actorMissing(x){return /\bshall\b/i.test(x)&&!/^[\s\[(]*[A-Za-z0-9][^.;:]{1,70}\bshall\b/i.test(x);}
function normId(x){return clean(x).toUpperCase();}
function threshold(x){
  var s=low(x).replace(',','.');
  var m=s.match(/(.{0,50}?)(?:shall\s+be\s+)?(at least|not less than|minimum|min\.?|>=|greater than or equal to|no more than|not more than|maximum|max\.?|<=|less than or equal to|greater than|more than|>|less than|below|<)\s*([-+]?\d+(?:\.\d+)?)/i);
  if(!m)return null;
  var op=m[2].toLowerCase(),v=parseFloat(m[3]);if(!isFinite(v))return null;
  var dir=/^(no more than|not more than|maximum|max\.?|<=|less than or equal to|less than|below|<)$/.test(op)?'max':'min';
  var subject=m[1].replace(/\b(the|a|an|system|equipment|unit|shall|must|be|have|provide|maintain|limit|value|of|to|and)\b/g,' ').replace(/\s+/g,' ').trim();
  var ts=tokens(subject).slice(-4).sort().join(' ');
  return {dir:dir,value:v,subject:ts||tokens(s).slice(0,4).sort().join(' ')};
}
