Object.keys(EXTRA).forEach(function(l){Object.assign(I18N[l],EXTRA[l]);});

/* ============================ state ============================
   The page's state object IS the permalink payload, minus the two
   fields diagram-common.js adds (`v` and `lang`). Its shape is the
   contract for links already in the wild and must not change:
   {v:2, k1, k2, v1, v2, pu, tu, lang}, with v1/v2 kept as the raw
   strings the user typed, exactly as the pre-port page serialised
   them from the two <input> elements. */
const PROPS=['p','T','v','h','s','u','x'];
const DEFAULTS={k1:'p',v1:'3',k2:'T',v2:'300',pu:'MPa',tu:'C'};
let state=Object.assign({},DEFAULTS);
let LANG='en';
let ui=null;
let lastState=null;                 /* the solved thermodynamic state, or null */
let staleAcrossRebuild=false;       /* carries the stale flag over a language rebuild */

/* Display units live in `state` (pu, tu) because they are part of the
   permalink and of the calculation record: record.outputs.T and .p are
   reported in them. The framework's page-level unit registry cannot own
   them without changing those recorded numbers, so it is not used here
   and no unit selector appears in the header. */
function baseUnitLabel(key){
  if(key==='p')return state.pu;
  if(key==='T')return state.tu==='C'?'°C':'K';
  if(key==='v')return 'm³/kg';
  if(key==='h'||key==='u')return 'kJ/kg';
  if(key==='s')return 'kJ/(kg·K)';
  if(key==='x')return '–';
  if(key==='rho')return 'kg/m³';
}
/* convert an input value (in display unit) to SI (p:MPa,T:K) */
function toSI(key,val){
  if(key==='p')return state.pu==='bar'?val/10:val;
  if(key==='T')return state.tu==='C'?val+K0:val;
  return val;
}
function fromSI(key,val){
  if(key==='p')return state.pu==='bar'?val*10:val;
  if(key==='T')return state.tu==='C'?val-K0:val;
  return val;
}
function fmt(x){
  if(x===null||x===undefined||isNaN(x))return '–';
  const a=Math.abs(x);
  if(a!==0&&(a<1e-3||a>=1e5))return x.toExponential(4);
  if(a<1)return x.toPrecision(4);
  if(a<100)return x.toFixed(4);
  return x.toFixed(2);
}
/* dictionary access: T('key') -> the string in the current language,
   TT('key') -> the {en,uk,…} object the framework re-picks on a language
   change without a remount. */
function T(k){const t=I18N[LANG]||I18N.en;return t[k]!==undefined?t[k]:(I18N.en[k]!==undefined?I18N.en[k]:k);}
function TT(k){const o={};['en','uk','de','nl','fr','es','pl'].forEach(l=>{o[l]=(I18N[l]&&I18N[l][k]!==undefined)?I18N[l][k]:I18N.en[k];});return o;}
function TN(k){const o={};['en','uk','de','nl','fr','es','pl'].forEach(l=>{o[l]=(I18N[l]&&I18N[l].pn[k])||I18N.en.pn[k];});return o;}
function TRL(k){const o={};['en','uk','de','nl','fr','es','pl'].forEach(l=>{o[l]=(I18N[l]&&I18N[l].rl[k])||I18N.en.rl[k];});return o;}
function TRC(k){const o={};['en','uk','de','nl','fr','es','pl'].forEach(l=>{o[l]=(I18N[l]&&I18N[l].rec[k])||I18N.en.rec[k];});return o;}

/* ======================= the answer, once =======================
   Same order of tests, same messages and same clamping as the
   pre-port doCompute(); only the source of the four inputs changed
   from four DOM nodes to the state object. */
function computeState(s){
  const k1=s.k1,k2=s.k2;
  const v1=parseFloat(s.v1),v2=parseFloat(s.v2);
  if(k1===k2)return{err:'pair'};
  if(isNaN(v1)||isNaN(v2))return{err:'range'};
  const specs=[{key:k1,value:toSI(k1,v1)},{key:k2,value:toSI(k2,v2)}];
  let st;
  try{ st=solve(specs); }
  catch(e){ return{err:(e&&e.code==='pair')?'pair':(e&&e.code==='range')?'range':'num'}; }
  if(!st||!isFinite(st.h)||!isFinite(st.T)||!isFinite(st.v)||st.v<=0)return{err:'num'};
  /* final IF97 validity check — refuse rather than extrapolate */
  if(!inIF97(st.p,st.T))return{err:'range'};
  return{st:st};
}
/* true only inside the IAPWS-IF97 validity envelope */
function inIF97(p,T){
  if(!isFinite(p)||!isFinite(T)||p<=0)return false;
  if(T<TMIN-1e-6||T>T5MAX+1e-6)return false;
  return T<=T2MAX+1e-9?p<=PMAX+1e-9:p<=P5MAX+1e-9;
}
/* the eight quantities the page has always printed, in the order it printed
   them, formatted by the page's own fmt() so the digits are unchanged */
function resultRows(st){
  return [
    ['T',fromSI('T',st.T),baseUnitLabel('T')],
    ['p',fromSI('p',st.p),baseUnitLabel('p')],
    ['v',st.v,'m³/kg'],
    ['rho',1/st.v,'kg/m³'],
    ['h',st.h,'kJ/kg'],
    ['u',st.u,'kJ/kg'],
    ['s',st.s,'kJ/(kg·K)'],
    ['x',st.x,'–']
  ];
}
const HEADLINE={T:1,p:1,h:1};       /* the three tiles the mobile strip carries */
/* 'K' is a key of the framework unit table, so a bare unit:'K' would be
   converted to °C for display; unit+display pins it. Every other unit
   string here is outside that table and passes through untouched. */
function unitProp(u){return u==='K'?{unit:'K',display:'K'}:{unit:u};}
function view(st){
  const t=I18N[LANG]||I18N.en;
  const w=[];
  if(st.region==='region3')w.push(t.rec.w3);
  if(st.x===null||st.x===undefined)w.push(t.rec.wx);
  return {
    verdict:{tone:st.region==='region3'?'warn':'',text:t.rl[st.region]},
    tiles:resultRows(st).map(r=>Object.assign({
      label:r[0]+' · '+(t.pn[r[0]]||r[0]),
      value:fmt(r[1]),
      learn:r[0]==='x'?'quality':(r[0]==='T'||r[0]==='p'?'region':null),
      headline:HEADLINE[r[0]]?undefined:false
    },unitProp(r[2]))),
    notes:w
  };
}

/* ============================ learn ============================
   Content is the prose the tool already shipped — the units note, the
   range note, the checkpoint note, the two record warnings — plus four
   topics written for this port, in all declared domain languages. */
function LEARN(){
  return {
    version:1,
    intro:{title:TT('l_intro_t'),body:TT('l_intro_b')},
    topics:{
      pair:{title:TT('l_pair_t'),body:TT('l_pair_b')},

      range:{title:TT('l_range_t'),body:TT('rangenote')},
      region:{title:TT('l_region_t'),body:TT('l_region_b')},
      region3:{title:TRL('region3'),body:TRC('w3')},
      quality:{title:TN('x'),body:TT('l_x_b')},
      checkpoints:{title:TT('checkpoints'),body:TT('chknote')}
    },
    tour:[
      {topic:'pair',focus:'[data-dgu-field="f-k1"]'},
      {topic:'range',focus:'[data-dgu-field="f-v1"]'},
      {topic:'units',focus:'[data-dgu-panel="units"]'},
      {topic:'region',focus:'.dgu-r-results .dgu-panel-h'},

    ]
  };
}

/* ===================== fields and panels ===================== */
const F_PROPS=()=>PROPS.map(k=>[k,k+' — '+((I18N[LANG]||I18N.en).pn[k])]);
/* The value field keeps the raw string the user typed: the permalink has
   always carried these two as strings, and a round trip through a number
   would re-round them. */
function valField(id,keyOf,valKey){
  return {id:id,key:valKey,type:'number',step:'any',unit:'MPa',learn:'range',
    label:TT('value'),
    get:s=>s[valKey],
    set:(v,s)=>{s[valKey]=(v===null||v===undefined)?'':String(v);}};
}
/* the unit slot and the label of a value field follow the property chosen
   next to it; the framework renders both from data at build time, so they
   are refreshed here on every sync (a `unit`/`label` thunk resolved on
   sync would remove the need — that belongs upstream in diagram-ui.js). */
function decorate(){
  [['f-v1','k1'],['f-v2','k2']].forEach(function(p){
    const host=document.querySelector('[data-dgu-field="'+p[0]+'"]');
    if(!host)return;
    const u=host.querySelector('.dgu-unit');
    if(u)u.textContent=baseUnitLabel(state[p[1]]);
    const l=host.querySelector('.dgu-flabel');
    if(l&&l.firstChild&&l.firstChild.nodeType===3){
      l.firstChild.nodeValue=T('value')+' — '+((I18N[LANG]||I18N.en).pn[state[p[1]]]);
    }
  });
}

/* ================= thermodynamic map =================
   A compact state map below the checkpoints. It is deliberately a view, not
   part of permalink state: changing axes must never change the calculation. */
let STEAM_DIAG_MODE='Ts',STEAM_DIAG_CANVAS=null,STEAM_DIAG_RO=null;
const STEAM_DIAG_NAMES={
 en:'Thermodynamic diagram',uk:'Термодинамічна діаграма',de:'Thermodynamisches Diagramm',
 nl:'Thermodynamisch diagram',fr:'Diagramme thermodynamique',es:'Diagrama termodinámico'
,pl:"Wykres termodynamiczny"};
function steamDiagramPanel(){
  const host=document.createElement('div');host.className='st-diagram';
  const top=document.createElement('div');top.style.cssText='display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px';
  const lab=document.createElement('span');lab.textContent=STEAM_DIAG_NAMES[LANG]||STEAM_DIAG_NAMES.en;lab.style.cssText='font-weight:650;flex:1 1 auto';top.appendChild(lab);
  const sel=document.createElement('select');sel.className='dgu-input';sel.setAttribute('aria-label','Diagram axes');
  [['Ts','T–s'],['hs','h–s'],['ph','p–h'],['pv','p–v']].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;sel.appendChild(o)});
  sel.value=STEAM_DIAG_MODE;sel.onchange=()=>{STEAM_DIAG_MODE=sel.value;drawSteamDiagram()};top.appendChild(sel);host.appendChild(top);
  const c=document.createElement('canvas');c.style.cssText='display:block;width:100%;height:360px;min-height:260px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel-2)';host.appendChild(c);STEAM_DIAG_CANVAS=c;
  if(STEAM_DIAG_RO)STEAM_DIAG_RO.disconnect();if(window.ResizeObserver){STEAM_DIAG_RO=new ResizeObserver(()=>drawSteamDiagram());STEAM_DIAG_RO.observe(c)}
  requestAnimationFrame(drawSteamDiagram);return host;
}
function drawSteamDiagram(){
  const c=STEAM_DIAG_CANVAS;if(!c||!c.isConnected)return;const r=c.getBoundingClientRect();if(r.width<40||r.height<40)return;
  const dpr=Math.min(devicePixelRatio||1,2),W=r.width,H=r.height;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(c),ink=cs.getPropertyValue('--ink').trim()||'#15202b',muted=cs.getPropertyValue('--muted').trim()||'#657080',line=cs.getPropertyValue('--line').trim()||'#d7dde5',accent=cs.getPropertyValue('--accent').trim()||'#3763e6';
  g.clearRect(0,0,W,H);const M={l:58,r:16,t:16,b:42},PW=W-M.l-M.r,PH=H-M.t-M.b,mode=STEAM_DIAG_MODE;
  const spec={Ts:{x:[0,10],y:[273.15,1073.15],xl:'s  kJ/(kg·K)',yl:'T  °C',logx:false,logy:false},hs:{x:[0,10],y:[0,4500],xl:'s  kJ/(kg·K)',yl:'h  kJ/kg',logx:false,logy:false},ph:{x:[0,4500],y:[.001,100],xl:'h  kJ/kg',yl:'p  MPa',logx:false,logy:true},pv:{x:[8e-4,100],y:[.001,100],xl:'v  m³/kg',yl:'p  MPa',logx:true,logy:true}}[mode];
  const tx=(v,a,log)=>log?Math.log10(Math.max(v,1e-20)/a[0])/Math.log10(a[1]/a[0]):(v-a[0])/(a[1]-a[0]);
  const X=v=>M.l+PW*tx(v,spec.x,spec.logx),Y=v=>M.t+PH*(1-tx(v,spec.y,spec.logy));
  const pair=st=>mode==='Ts'?[st.s,st.T]:mode==='hs'?[st.s,st.h]:mode==='ph'?[st.h,st.p]:[st.v,st.p];
  g.strokeStyle=line;g.lineWidth=1;g.strokeRect(M.l,M.t,PW,PH);g.font='11px system-ui,sans-serif';g.fillStyle=muted;
  const ticks=(a,log,n=5)=>{if(log){const lo=Math.ceil(Math.log10(a[0])),hi=Math.floor(Math.log10(a[1]));return Array.from({length:hi-lo+1},(_,i)=>10**(lo+i))}return Array.from({length:n+1},(_,i)=>a[0]+(a[1]-a[0])*i/n)};
  for(const v of ticks(spec.x,spec.logx)){const x=X(v);g.strokeStyle=line;g.beginPath();g.moveTo(x,M.t);g.lineTo(x,M.t+PH);g.stroke();g.fillStyle=muted;g.textAlign='center';g.fillText(v>=100?String(Math.round(v)):v>=1?String(+v.toFixed(2)):v.toExponential(0),x,M.t+PH+17)}
  for(const v of ticks(spec.y,spec.logy)){const y=Y(v);g.strokeStyle=line;g.beginPath();g.moveTo(M.l,y);g.lineTo(M.l+PW,y);g.stroke();g.fillStyle=muted;g.textAlign='right';const vv=(mode==='Ts')?v-K0:v;g.fillText(vv>=100?String(Math.round(vv)):vv>=1?String(+vv.toFixed(2)):vv.toExponential(0),M.l-7,y+4)}
  g.fillStyle=ink;g.textAlign='center';g.fillText(spec.xl,M.l+PW/2,H-8);g.save();g.translate(14,M.t+PH/2);g.rotate(-Math.PI/2);g.fillText(spec.yl,0,0);g.restore();

function PY_SRC(){return `R = 0.461526
K0 = 273.15
PCRIT = 22.064
TCRIT = 647.096
RHOC = 322.0
R3N1 = 1.0658070028513
TMIN = 273.15
T13 = 623.15
T3MAX = 863.15
T2MAX = 1073.15
T5MAX = 2273.15
PMAX = 100.0
P5MAX = 50.0
R1 = ${JSON.stringify(R1)}
R2O = ${JSON.stringify(R2o)}
R2R = ${JSON.stringify(R2r)}
N4 = ${JSON.stringify(N4)}
B23 = ${JSON.stringify(B23)}
R3T = ${JSON.stringify(R3)}
R5O = ${JSON.stringify(R5o)}
R5R = ${JSON.stringify(R5r)}


class OutOfRange(Exception):
    pass


class NoConvergence(Exception):
    pass


class BadPair(Exception):
    pass


def region1(p, T):
    pi = p / 16.53
    tau = 1386.0 / T
    g = gp = gt = gtt = 0.0
    for I, J, n in R1:
        a = (7.1 - pi) ** I
        b = (tau - 1.222) ** J
        g += n * a * b
        gp += -n * I * (7.1 - pi) ** (I - 1) * b
        gt += n * a * J * (tau - 1.222) ** (J - 1)
        gtt += n * a * J * (J - 1) * (tau - 1.222) ** (J - 2)
    return {"v": pi * gp * R * T / p / 1000.0, "h": tau * gt * R * T,
            "u": R * T * (tau * gt - pi * gp), "s": R * (tau * gt - g),
            "cp": -R * tau * tau * gtt}


def region2(p, T):
    pi = p
    tau = 540.0 / T
    go = math.log(pi)
    got = gott = 0.0
    for J, n in R2O:
        go += n * tau ** J
        got += n * J * tau ** (J - 1)
        gott += n * J * (J - 1) * tau ** (J - 2)
    gr = grp = grt = grtt = 0.0
    for I, J, n in R2R:
        a = pi ** I
        b = (tau - 0.5) ** J
        gr += n * a * b
        grp += n * I * pi ** (I - 1) * b
        grt += n * a * J * (tau - 0.5) ** (J - 1)
        grtt += n * a * J * (J - 1) * (tau - 0.5) ** (J - 2)
    gp = 1.0 / pi + grp
    gt = got + grt
    g = go + gr
    return {"v": pi * gp * R * T / p / 1000.0, "h": tau * gt * R * T,
            "u": R * T * (tau * gt - pi * gp), "s": R * (tau * gt - g),
            "cp": -R * tau * tau * (gott + grtt)}


def psat(T):
    th = T + N4[8] / (T - N4[9])
    A = th * th + N4[0] * th + N4[1]
    B = N4[2] * th * th + N4[3] * th + N4[4]
    C = N4[5] * th * th + N4[6] * th + N4[7]
    return (2.0 * C / (-B + math.sqrt(B * B - 4.0 * A * C))) ** 4


def Tsat(p):
    b = p ** 0.25
    E = b * b + N4[2] * b + N4[5]
    F = N4[0] * b * b + N4[3] * b + N4[6]
    G = N4[1] * b * b + N4[4] * b + N4[7]
    D = 2.0 * G / (-F - math.sqrt(F * F - 4.0 * E * G))
    return (N4[9] + D - math.sqrt((N4[9] + D) * (N4[9] + D) - 4.0 * (N4[8] + N4[9] * D))) / 2.0


def b23p(T):
    return B23[0] + B23[1] * T + B23[2] * T * T


def region3(rho, T):
    d = rho / RHOC
    tau = TCRIT / T
    f = R3N1 * math.log(d)
    fd = R3N1 / d
    fdd = -R3N1 / (d * d)
    ft = ftt = fdt = 0.0
    for I, J, n in R3T:
        dI = d ** I
        dI1 = d ** (I - 1)
        tJ = tau ** J
        tJ1 = tau ** (J - 1)
        f += n * dI * tJ
        fd += n * I * dI1 * tJ
        fdd += n * I * (I - 1) * d ** (I - 2) * tJ
        ft += n * dI * J * tJ1
        ftt += n * dI * J * (J - 1) * tau ** (J - 2)
        fdt += n * I * dI1 * J * tJ1
    num = d * fd - d * tau * fdt
    den = 2.0 * d * fd + d * d * fdd
    return {"p": d * fd * R * T * rho / 1000.0, "v": 1.0 / rho, "rho": rho,
            "h": R * T * (tau * ft + d * fd), "u": R * T * tau * ft,
            "s": R * (tau * ft - f), "cv": -R * tau * tau * ftt,
            "cp": R * (-tau * tau * ftt + num * num / den)}


def r3p(rho, T):
    d = rho / RHOC
    tau = TCRIT / T
    fd = R3N1 / d
    for I, J, n in R3T:
        fd += n * I * d ** (I - 1) * tau ** J
    return d * fd * R * T * rho / 1000.0


def r3dpdr(rho, T):
    d = rho / RHOC
    tau = TCRIT / T
    fd = R3N1 / d
    fdd = -R3N1 / (d * d)
    for I, J, n in R3T:
        tJ = tau ** J
        fd += n * I * d ** (I - 1) * tJ
        fdd += n * I * (I - 1) * d ** (I - 2) * tJ
    return R * T * (2.0 * d * fd + d * d * fdd) / 1000.0


R3RLO = 80.0
R3RHI = 800.0
R3NS = 280


def r3brackets(p, T):
    out = []
    rp = R3RLO
    fp = r3p(R3RLO, T) - p
    for i in range(1, R3NS + 1):
        r = R3RLO * (R3RHI / R3RLO) ** (i / R3NS)
        f = r3p(r, T) - p
        if _fin(f) and _fin(fp) and f * fp <= 0.0:
            out.append((rp, r))
        rp = r
        fp = f
    return out


def r3root(br, p, T):
    a, c = br
    fa = r3p(a, T) - p
    for _ in range(90):
        m = 0.5 * (a + c)
        fm = r3p(m, T) - p
        if fa * fm <= 0.0:
            c = m
        else:
            a = m
            fa = fm
        if c - a < 1e-11 * c:
            break
    r = 0.5 * (a + c)
    for _ in range(5):
        dp = r3dpdr(r, T)
        if not _fin(dp) or abs(dp) < 1e-14:
            break
        rn = r - (r3p(r, T) - p) / dp
        if not (a < rn < c):
            break
        dr = abs(rn - r)
        r = rn
        if dr < 1e-13 * r:
            break
    return r


def region3PT(p, T):
    brs = r3brackets(p, T)
    if not brs:
        raise NoConvergence()
    br = brs[-1]
    if len(brs) > 1 and T < TCRIT and p < psat(T):
        br = brs[0]
    return region3(r3root(br, p, T), T)


def sat3rho(T):
    ps = psat(T)
    brs = r3brackets(ps, T)
    if len(brs) < 2:
        return {"f": RHOC, "g": RHOC}
    return {"f": r3root(brs[-1], ps, T), "g": r3root(brs[0], ps, T)}


def region5(p, T):
    pi = p
    tau = 1000.0 / T
    go = math.log(pi)
    got = gott = 0.0
    for J, n in R5O:
        go += n * tau ** J
        got += n * J * tau ** (J - 1)
        gott += n * J * (J - 1) * tau ** (J - 2)
    gr = grp = grt = grtt = 0.0
    for I, J, n in R5R:
        a = pi ** I
        b = tau ** J
        gr += n * a * b
        grp += n * I * pi ** (I - 1) * b
        grt += n * a * J * tau ** (J - 1)
        grtt += n * a * J * (J - 1) * tau ** (J - 2)
    gp = 1.0 / pi + grp
    gt = got + grt
    g = go + gr
    return {"v": pi * gp * R * T / p / 1000.0, "h": tau * gt * R * T,
            "u": R * T * (tau * gt - pi * gp), "s": R * (tau * gt - g),
            "cp": -R * tau * tau * (gott + grtt)}


def propsPT(p, T):
    if not _fin(p) or not _fin(T) or p <= 0.0:
        raise OutOfRange()
    if T < TMIN - 1e-6 or T > T5MAX + 1e-6:
        raise OutOfRange()
    if T <= T2MAX + 1e-9:
        if p > PMAX + 1e-9:
            raise OutOfRange()
        if T <= T13:
            ps = psat(T)
            if p > ps:
                r = region1(p, T)
                r["reg"] = 1
                r["region"] = "compressed_liquid"
                r["x"] = 0.0
            else:
                r = region2(p, T)
                r["reg"] = 2
                r["region"] = "superheated_vapor"
                r["x"] = 1.0
        elif T <= T3MAX:
            if p > b23p(T):
                r = region3PT(p, T)
                r["reg"] = 3
                r["region"] = "region3"
                r["x"] = (0.0 if p > psat(T) else 1.0) if T < TCRIT else None
            else:
                r = region2(p, T)
                r["reg"] = 2
                r["region"] = "supercritical" if (T >= TCRIT and p >= PCRIT) else "superheated_vapor"
                r["x"] = 1.0
        else:
            r = region2(p, T)
            r["reg"] = 2
            r["region"] = "supercritical" if p >= PCRIT else "superheated_vapor"
            r["x"] = 1.0
    else:
        if p > P5MAX + 1e-9:
            raise OutOfRange()
        r = region5(p, T)
        r["reg"] = 5
        r["region"] = "region5"
        r["x"] = None
    if not _fin(r["v"]) or not _fin(r["h"]) or r["v"] <= 0.0:
        raise NoConvergence()
    return r


def tmaxAt(p):
    return T5MAX if p <= P5MAX + 1e-9 else T2MAX


def satProps(T):
    p = psat(T)
    if T <= T13:
        return {"p": p, "f": region1(p, T), "g": region2(p, T)}
    rr = sat3rho(T)
    return {"p": p, "f": region3(rr["f"], T), "g": region3(rr["g"], T)}


def statePT(p, T):
    pr = propsPT(p, T)
    return {"p": p, "T": T, "v": pr["v"], "h": pr["h"], "u": pr["u"], "s": pr["s"],
            "cp": pr["cp"], "x": pr.get("x"), "region": pr["region"]}


def twoPhase(p, T, x):
    sp = satProps(T)
    f, g = sp["f"], sp["g"]
    return {"p": p, "T": T, "x": x, "region": "saturated_mixture",
            "v": f["v"] + x * (g["v"] - f["v"]), "h": f["h"] + x * (g["h"] - f["h"]),
            "u": f["u"] + x * (g["u"] - f["u"]), "s": f["s"] + x * (g["s"] - f["s"]),
            "f": f, "g": g}


def invertT(p, which, target, Tlo, Thi):
    def fn(T):
        try:
            v = propsPT(p, T)[which]
            return (v - target) if _fin(v) else _NAN
        except Exception:
            return _NAN
    a, b = Tlo, Thi
    fa, fb = fn(a), fn(b)
    if not _fin(fa) or not _fin(fb) or fa * fb > 0.0:
        raise NoConvergence()
    for _ in range(80):
        m = 0.5 * (a + b)
        fm = fn(m)
        if not _fin(fm):
            break
        if fa * fm <= 0.0:
            b = m
            fb = fm
        else:
            a = m
            fa = fm
        if b - a < 1e-9:
            break
    return 0.5 * (a + b)


def stateFromP(p, key, val):
    if p >= PCRIT:
        return statePT(p, invertGeneric(p, key, val))
    Ts = Tsat(p)
    sp = satProps(Ts)
    f, g = sp["f"], sp["g"]
    fv = {"h": f["h"], "s": f["s"], "v": f["v"], "u": f["u"]}
    gv = {"h": g["h"], "s": g["s"], "v": g["v"], "u": g["u"]}
    if fv[key] - 1e-9 <= val <= gv[key] + 1e-9:
        x = (val - fv[key]) / (gv[key] - fv[key])
        return twoPhase(p, Ts, max(0.0, min(1.0, x)))
    if val < fv[key]:
        return statePT(p, invertT(p, key, val, TMIN, Ts))
    return statePT(p, invertT(p, key, val, Ts, tmaxAt(p)))


def invertP(T, key, val, plo, phi):
    def prop(p):
        try:
            v = propsPT(p, T)[key]
            return v if _fin(v) else _NAN
        except Exception:
            return _NAN
    a, b = prop(plo), prop(phi)
    if not _fin(a) or not _fin(b) or (a - val) * (b - val) > 0.0:
        raise NoConvergence()
    for _ in range(120):
        m = 0.5 * (plo + phi)
        pm = prop(m)
        if not _fin(pm):
            break
        if (pm - val) * (a - val) <= 0.0:
            phi = m
        else:
            plo = m
            a = pm
        if phi - plo < 1e-10:
            break
    return 0.5 * (plo + phi)


def invertPsuper(T, key, val):
    return invertP(T, key, val, 1e-4, P5MAX if T > T2MAX else PMAX)


def invertGeneric(p, key, val):
    Tlo = TMIN + 0.01
    Thi = tmaxAt(p)

    def prop(T):
        try:
            v = propsPT(p, T)[key]
            return v if _fin(v) else _NAN
        except Exception:
            return _NAN
    a, b = prop(Tlo), prop(Thi)
    if not _fin(a) or not _fin(b) or (a - val) * (b - val) > 0.0:
        raise NoConvergence()
    for _ in range(120):
        m = (Tlo + Thi) / 2.0
        pm = prop(m)
        if not _fin(pm):
            break
        if (pm - val) * (a - val) <= 0.0:
            Thi = m
            b = pm
        else:
            Tlo = m
            a = pm
        if Thi - Tlo < 1e-9:
            break
    return (Tlo + Thi) / 2.0


def stateFromT(T, key, val):
    if T >= TCRIT:
        return statePT(invertPsuper(T, key, val), T)
    sp = satProps(T)
    ps, f, g = sp["p"], sp["f"], sp["g"]
    fv = {"h": f["h"], "s": f["s"], "v": f["v"], "u": f["u"]}
    gv = {"h": g["h"], "s": g["s"], "v": g["v"], "u": g["u"]}
    if fv[key] - 1e-9 <= val <= gv[key] + 1e-9:
        x = (val - fv[key]) / (gv[key] - fv[key])
        st = twoPhase(ps, T, max(0.0, min(1.0, x)))
        st["region"] = "saturated_mixture"
        return st
    if val < fv[key]:
        return statePT(invertP(T, key, val, ps, PMAX), T)
    return statePT(invertP(T, key, val, 1e-4, ps), T)


def solveXprop(x, key, val):
    def prop(T):
        sp = satProps(T)
        return sp["f"][key] + x * (sp["g"][key] - sp["f"][key])
    lo0, hi0, N = 273.16, TCRIT - 0.3, 400
    Tp, vp = lo0, prop(lo0)
    for i in range(1, N + 1):
        T = lo0 + (hi0 - lo0) * i / N
        vv = prop(T)
        if (vv - val) * (vp - val) <= 0.0:
            a, bb, fa = Tp, T, vp
            for _ in range(80):
                m = 0.5 * (a + bb)
                fm = prop(m)
                if (fm - val) * (fa - val) <= 0.0:
                    bb = m
                else:
                    a = m
                    fa = fm
                if bb - a < 1e-7:
                    break
            Tr = 0.5 * (a + bb)
            st = twoPhase(psat(Tr), Tr, max(0.0, min(1.0, x)))
            st["region"] = "compressed_liquid" if x <= 0 else ("superheated_vapor" if x >= 1 else "saturated_mixture")
            return st
        Tp, vp = T, vv
    raise NoConvergence()


def solveTwoProp(key1, val1, key2, val2):
    def resid(p):
        try:
            s = stateFromP(p, key1, val1)
            r = s[key2] - val2
            return r if _fin(r) else _NAN
        except Exception:
            return _NAN
    pprev = rprev = None
    e = -3.0
    while e <= 2.0001:
        p = 10.0 ** e
        r = resid(p)
        if r != r:
            pprev = rprev = None
            e += 0.04
            continue
        if pprev is not None and rprev * r <= 0.0:
            lo, hi, rl = pprev, p, rprev
            for _ in range(90):
                m = 0.5 * (lo + hi)
                rm = resid(m)
                if rm != rm:
                    lo = m
                    continue
                if rl * rm <= 0.0:
                    hi = m
                else:
                    lo = m
                    rl = rm
                if hi - lo < 1e-9:
                    break
            return stateFromP(0.5 * (lo + hi), key1, val1)

        e += 0.04

def solve(specs):
    m = {}
    for k, v in specs:
        m[k] = v

    def has(a, b):
        return a in m and b in m

        st = statePT(m["p"], m["T"])
    elif has("T", "x"):
        T = m["T"]
        if not (TMIN - 1e-6 <= T < TCRIT) or not (0.0 <= m["x"] <= 1.0):
            raise OutOfRange()
        st = twoPhase(psat(T), T, m["x"])
        st["region"] = "saturated_mixture"
        if m["x"] <= 0:
            st["region"] = "compressed_liquid"
        if m["x"] >= 1:
            st["region"] = "superheated_vapor"
    elif has("p", "x"):
        p = m["p"]
        if not (0.0 < p < PCRIT) or not (0.0 <= m["x"] <= 1.0):
            raise OutOfRange()
        st = twoPhase(p, Tsat(p), m["x"])
        st["region"] = "saturated_mixture"
        if m["x"] <= 0:
            st["region"] = "compressed_liquid"
        if m["x"] >= 1:
            st["region"] = "superheated_vapor"
    elif has("p", "h"):
        st = stateFromP(m["p"], "h", m["h"])
    elif has("p", "s"):
        st = stateFromP(m["p"], "s", m["s"])
    elif has("p", "v"):
        st = stateFromP(m["p"], "v", m["v"])
    elif has("p", "u"):
        st = stateFromP(m["p"], "u", m["u"])
    elif "T" in m and any(k in m for k in ("h", "s", "v", "u")):
        key = next(k for k in ("h", "s", "v", "u") if k in m)
        st = stateFromT(m["T"], key, m[key])
    elif "x" in m and any(k in m for k in ("h", "s", "v", "u")):
        key = next(k for k in ("h", "s", "v", "u") if k in m)
        st = solveXprop(m["x"], key, m[key])
    else:
        ks = [k for k in ("h", "s", "v", "u") if k in m]
        if len(ks) == 2:
            st = solveTwoProp(ks[0], m[ks[0]], ks[1], m[ks[1]])

def inIF97(p, T):
    if not _fin(p) or not _fin(T) or p <= 0.0:
        return False
    if T < TMIN - 1e-6 or T > T5MAX + 1e-6:
        return False
    return p <= PMAX + 1e-9 if T <= T2MAX + 1e-9 else p <= P5MAX + 1e-9


def to_si(key, val):
    """display unit -> SI as used by the engine (p in MPa, T in K)"""
    if key == "p":

    if key == "T":
        return val + K0 if T_DISPLAY_UNIT == "C" else val

def from_si(key, val):
    if key == "p":
        return val * 10.0 if P_DISPLAY_UNIT == "bar" else val
    if key == "T":
        return val - K0 if T_DISPLAY_UNIT == "C" else val

def fmt(x):
    """Exact port of the tool's display formatter (JS Number.prototype.toFixed /
    .toPrecision / .toExponential), so printed values equal what the page shows."""
    if x is None:
        return "–"
    if isinstance(x, str):
        return x
    if x != x:
        return "–"
    a = abs(x)
    if a != 0.0 and (a < 1e-3 or a >= 1e5):
        mant, ex = ("%.4e" % x).split("e")
        ex = int(ex)
        return "%se%s%d" % (mant, "+" if ex >= 0 else "-", abs(ex))
    if a < 1.0:
        if x == 0.0:
            return "0.000"
        ex = int(("%.3e" % x).split("e")[1])
        return "%.*f" % (max(0, 3 - ex), x)
    if a < 100.0:
        return "%.4f" % x
    return "%.2f" % x

    specs = [(INPUTS["property_1"], to_si(INPUTS["property_1"], INPUTS["value_1"])),
             (INPUTS["property_2"], to_si(INPUTS["property_2"], INPUTS["value_2"]))]
    st = solve(specs)
    if not inIF97(st["p"], st["T"]):
        raise OutOfRange()
    return {"T": from_si("T", st["T"]), "p": from_si("p", st["p"]),

  F_PROPS().forEach(o=>{const op=document.createElement('option');op.value=o[0];op.textContent=o[1];sel.appendChild(op)});
  sel.value=state[valKey];
  sel.onchange=()=>fbSet(valKey,sel.value);
  row.appendChild(sel);w.appendChild(row);box.appendChild(w);
  FB.controls.push(()=>{sel.value=state[valKey]});
}
function fbValue(id,keyOf,valKey,box){
  const w=fbEl('div','fb-field');
  const lab=fbEl('label','fb-lab','');lab.htmlFor=id;w.appendChild(lab);
  const row=fbEl('div','fb-row');
  const inp=document.createElement('input');inp.id=id;inp.type='number';inp.step='any';
  inp.value=state[valKey];
  inp.oninput=()=>{state[valKey]=inp.value};
  row.appendChild(inp);
  const u=fbEl('span','fb-unit','');row.appendChild(u);
  w.appendChild(row);box.appendChild(w);
  FB.controls.push(()=>{
    lab.textContent=T('value')+' — '+((I18N[LANG]||I18N.en).pn[state[keyOf]]);
    u.textContent=baseUnitLabel(state[keyOf]);
    if(document.activeElement!==inp)inp.value=state[valKey];
  });
}
function fbSeg(labelText,valKey,opts,box){
  const w=fbEl('div','fb-field');
  w.appendChild(fbEl('div','fb-lab',labelText));
  const row=fbEl('div','fb-seg');
  const btns=opts.map(o=>{
    const b=document.createElement('button');b.type='button';b.textContent=o[1];b.dataset.value=o[0];
    b.setAttribute('aria-pressed','false');
    b.onclick=()=>{state[valKey]=o[0];if(lastState)fbResult(lastState);fbSync();};
    row.appendChild(b);return b;
  });
  w.appendChild(row);box.appendChild(w);
  FB.controls.push(()=>btns.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===state[valKey]))));
}
function fbSync(){FB.controls.forEach(fn=>fn());}
function fbResult(st){
  const t=I18N[LANG]||I18N.en;
  FB.msg.textContent='';FB.msg.hidden=true;
  FB.badge.textContent=t.rl[st.region];FB.badge.hidden=false;
  FB.body.innerHTML='';
  resultRows(st).forEach(r=>{
    const tr=document.createElement('tr');
    const a=fbEl('td',null,r[0]+' · '+(t.pn[r[0]]||r[0]));
    const b=fbEl('td','num',fmt(r[1]));
    const c=fbEl('td','u',r[2]);
    tr.appendChild(a);tr.appendChild(b);tr.appendChild(c);FB.body.appendChild(tr);
  });
}
function fbClear(msg){
  lastState=null;
  FB.badge.hidden=true;FB.body.innerHTML='';
  const tr=document.createElement('tr');const td=fbEl('td',null,T('noresult'));
  td.colSpan=3;tr.appendChild(td);FB.body.appendChild(tr);
  FB.msg.textContent=msg||'';FB.msg.hidden=!msg;
}
function fbCompute(){
  const r=computeState(state);
  if(r.err){fbClear(T('err_'+r.err));return}
  lastState=r.st;fbResult(r.st);fbSync();
}
function fbRender(){if(FB)fbSync();}
function fbMount(){
  const host=document.getElementById('app')||document.body;
  host.innerHTML='';
  if(!document.getElementById('st-fb-css')){
    const s=document.createElement('style');s.id='st-fb-css';s.textContent=FB_CSS;document.head.appendChild(s);
  }
  FB={controls:[],msg:null,badge:null,body:null};
  const wrap=fbEl('div','fb');
  const head=fbEl('div','fb-head');
  const home=document.createElement('a');home.href='index.html?lang='+LANG;home.textContent='← Tools';
  const h1=fbEl('h1',null,manifestTitle());
  const sub=fbEl('span','fb-hint',T('subtitle'));
  const ls=document.createElement('select');ls.setAttribute('aria-label',T('language'));
  const NAMES={en:'English',uk:'Українська',de:'Deutsch',nl:'Nederlands',fr:'Français',es:'Español',pl:"angielski"};
  ['en','uk','de','nl','fr','es','pl'].forEach(l=>{const o=document.createElement('option');
    o.value=l;o.textContent=NAMES[l];ls.appendChild(o)});
  ls.value=LANG;
  ls.onchange=()=>{LANG=ls.value;
    try{localStorage.setItem('diagram_lang',LANG)}catch(e){}
    if(window.Diagram)Diagram.setLang(LANG);
    document.documentElement.lang=LANG;
    const keep=lastState;fbMount();lastState=keep;if(keep)fbResult(keep);fbSync();};
  head.appendChild(home);head.appendChild(h1);head.appendChild(sub);head.appendChild(ls);
  wrap.appendChild(head);

  const inputs=fbEl('div','fb-box');
  inputs.appendChild(fbEl('h2',null,T('inputs')));
  fbSelect('fb-k1','prop1','k1',inputs);
  fbValue('fb-v1','k1','v1',inputs);
  fbSelect('fb-k2','prop2','k2',inputs);
  fbValue('fb-v2','k2','v2',inputs);
  fbSeg((I18N[LANG]||I18N.en).pn.p,'pu',[['MPa','MPa'],['bar','bar']],inputs);
  fbSeg((I18N[LANG]||I18N.en).pn.T,'tu',[['C','°C'],['K','K']],inputs);
  const act=fbEl('div','fb-seg');
  const go=fbEl('button','fb-btn primary',T('compute'));go.type='button';go.onclick=fbCompute;
  const rs=fbEl('button','fb-btn',DiagramUIResetLabel());rs.type='button';
  rs.onclick=()=>{Object.assign(state,DEFAULTS);fbClear('');fbSync()};
  act.appendChild(go);act.appendChild(rs);inputs.appendChild(act);
  const msg=fbEl('div','fb-err');msg.hidden=true;FB.msg=msg;inputs.appendChild(msg);
  inputs.appendChild(fbEl('p','fb-hint',T('unitsnote')));
  inputs.appendChild(fbEl('p','fb-hint',T('rangenote')));
  wrap.appendChild(inputs);

  const res=fbEl('div','fb-box');
  res.appendChild(fbEl('h2',null,T('results')));
  const badge=fbEl('div','fb-badge','');badge.hidden=true;FB.badge=badge;res.appendChild(badge);
  const w2=fbEl('div','fb-wrap');const tb=fbEl('table','fb-t');
  const th=document.createElement('thead');const tr=document.createElement('tr');
  [T('property'),T('value'),T('unit')].forEach(x=>{const c=document.createElement('th');c.textContent=x;tr.appendChild(c)});
  th.appendChild(tr);tb.appendChild(th);
  const bd=document.createElement('tbody');FB.body=bd;tb.appendChild(bd);
  w2.appendChild(tb);res.appendChild(w2);
  wrap.appendChild(res);

  const chk=fbEl('div','fb-box');
  chk.appendChild(fbEl('h2',null,T('checkpoints')));
  const cw=fbEl('div','fb-wrap');const ct=fbEl('table','fb-t');
  const cb=document.createElement('tbody');
  checkpointRows().forEach(r=>{const row=document.createElement('tr');
    r.forEach((cell,i)=>{const c=fbEl('td',i===1?'num':(i===2?'st-ref':null),cell);row.appendChild(c)});
    cb.appendChild(row)});
  ct.appendChild(cb);cw.appendChild(ct);chk.appendChild(cw);
  const sat=fbEl('button','fb-btn',T('expsat'));sat.type='button';sat.onclick=expSatTable;
  chk.appendChild(sat);
  chk.appendChild(fbEl('p','fb-hint',T('chknote')));
  wrap.appendChild(chk);

  host.appendChild(wrap);
  fbClear('');fbSync();
}
/* the framework writes the h1 from the manifest; the fallback does the same,
   so the page has the same title with or without diagram-ui.js */
function manifestTitle(){
  try{
    const n=document.getElementById('diagram-tool-manifest');
    const m=JSON.parse(n.textContent);
    return (m.title&&(m.title[LANG]||m.title.en))||T('title');
  }catch(e){return T('title');}
}
function DiagramUIResetLabel(){
  const R={en:'Reset',uk:'Скинути',de:'Zurücksetzen',nl:'Herstellen',fr:'Réinitialiser',es:'Restablecer',pl:"Resetuj"};
  return R[LANG]||R.en;
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();

})();
</script>
</body>
</html>
