  function solve(s) {
    var inp = {};
    var k, e, r;

      if (Object.prototype.hasOwnProperty.call(s, k) && k !== 'level') {

    if (!e) return { ok: false, error: 'ogh-integrity.js did not load' };
    try {
      r = e.solve(inp);
      if (!r) throw new Error('no result returned');
    } catch (err) {
      return { ok: false, error: 'Invalid input: ' + (err && err.message ? err.message : String(err)) };
    }
    return r;
  }

  function sig(v, n) {
    if (n === undefined || n === null) n = 5;
    v = +v;
    if (v === 0 || !isFinite(v)) return 2;
    var d = n - 1 - Math.floor(Math.log(Math.abs(v)) / Math.LN10 + 1e-12);
    if (d < 0) d = 0;
    if (d > 8) d = 8;
    return d;
  }
  function sigv(v, n) {
    if (n === undefined || n === null) n = 5;
    v = +v;
    if (!isFinite(v)) return NaN;
    if (v === 0) return 0;
    n = Math.max(1, Math.min(21, Math.round(n)));
    return Number(v.toPrecision(n));
  }

            body: T('Bending puts one surface in tension and the other in compression, while the membrane strain ε3 stretches both. So ε3 adds to the bending on one surface and partly cancels it on the other: a shorter dent can lower ε_i and raise ε_o at the same time. Always check both surfaces; inside-surface cracks are also harder to find by external inspection.',
              'Згин розтягує одну поверхню і стискає іншу, а мембранна деформація ε3 розтягує обидві. Тому ε3 додається до згину на одній поверхні і частково компенсує його на іншій: коротша вм’ятина може одночасно знизити ε_i і підвищити ε_o. Завжди перевіряйте обидві поверхні; тріщини на внутрішній поверхні ще й важче виявити зовнішнім оглядом.',
              'Biegung zieht eine Oberfläche und drückt die andere, während die Membrandehnung ε3 beide dehnt. Daher addiert sich ε3 auf einer Oberfläche zur Biegung und hebt sie auf der anderen teilweise auf: eine kürzere Beule kann ε_i senken und ε_o gleichzeitig erhöhen. Prüfen Sie stets beide Oberflächen; Innenrisse sind von außen zudem schwerer zu finden.',
              'Buiging trekt het ene oppervlak en drukt het andere, terwijl de membraanrek ε3 beide rekt. Daardoor telt ε3 aan het ene oppervlak op bij de buiging en heft die aan het andere deels op: een kortere deuk kan ε_i verlagen en tegelijk ε_o verhogen. Controleer altijd beide oppervlakken; scheuren aan de binnenzijde zijn bovendien moeilijker van buitenaf te vinden.',
              'La flexion tend une surface et comprime l’autre, tandis que la déformation de membrane ε3 étire les deux. ε3 s’ajoute donc à la flexion sur une surface et la compense en partie sur l’autre : un enfoncement plus court peut à la fois réduire ε_i et augmenter ε_o. Vérifiez toujours les deux surfaces ; les fissures intérieures sont en outre plus difficiles à détecter de l’extérieur.',
              'La flexión tracciona una superficie y comprime la otra, mientras que la deformación de membrana ε3 estira ambas. Así, ε3 se suma a la flexión en una superficie y la compensa en parte en la otra: una abolladura más corta puede bajar ε_i y subir ε_o a la vez. Compruebe siempre ambas superficies; las grietas interiores son además más difíciles de detectar desde fuera.',
              'Zginanie rozciąga jedną powierzchnię i ściska drugą, a odkształcenie membranowe ε3 rozciąga obie. Dlatego ε3 sumuje się ze zginaniem na jednej powierzchni i częściowo je znosi na drugiej: krótsze wgniecenie może jednocześnie obniżyć ε_i i podnieść ε_o. Zawsze sprawdzaj obie powierzchnie; pęknięcia wewnętrzne są też trudniejsze do wykrycia z zewnątrz.')
          },
          depth: {
            title: T('Dent depth and depth limit', 'Глибина вм’ятини і межа глибини', 'Beulentiefe und Tiefengrenze', 'Deukdiepte en dieptegrens', 'Profondeur d’enfoncement et limite', 'Profundidad de abolladura y límite', 'Głębokość wgniecenia i jej granica'),
            body: T('The depth ratio d/D is checked separately: plain dents deeper than 6 % of D generally require repair or an engineering assessment (B31.8 §851.4). Depth is measured as the maximum reduction of diameter, ideally under operating pressure, because a dent re-rounds partly when pressurised. The depth check can fail even when the strain passes.',
              'Відносна глибина d/D перевіряється окремо: прості вм’ятини глибше 6 % від D зазвичай потребують ремонту або інженерної оцінки (B31.8 §851.4). Глибину вимірюють як найбільше зменшення діаметра, бажано під робочим тиском, бо під тиском вм’ятина частково вирівнюється. Перевірка глибини може не пройти, навіть коли деформація в межах.',
              'Das Tiefenverhältnis d/D wird gesondert geprüft: einfache Beulen tiefer als 6 % von D erfordern in der Regel eine Reparatur oder ingenieurtechnische Bewertung (B31.8 §851.4). Die Tiefe wird als größte Durchmesserminderung gemessen, möglichst unter Betriebsdruck, da sich eine Beule unter Druck teilweise zurückrundet. Die Tiefenprüfung kann versagen, auch wenn die Dehnung besteht.',
              'De diepteverhouding d/D wordt apart getoetst: eenvoudige deuken dieper dan 6 % van D vereisen doorgaans reparatie of een technische beoordeling (B31.8 §851.4). De diepte wordt gemeten als de grootste diameterafname, liefst onder bedrijfsdruk, omdat een deuk onder druk deels terugrondt. De dieptetoets kan falen, ook als de rek voldoet.',
              'Le rapport d/D est vérifié à part : les enfoncements simples de plus de 6 % de D exigent en général une réparation ou une évaluation technique (B31.8 §851.4). La profondeur est la réduction maximale du diamètre, mesurée de préférence sous pression de service, car l’enfoncement se réarrondit en partie sous pression. Ce critère peut échouer même si la déformation est acceptable.',
              'La relación d/D se comprueba aparte: las abolladuras simples de más del 6 % de D suelen requerir reparación o una evaluación de ingeniería (B31.8 §851.4). La profundidad es la reducción máxima del diámetro, medida preferiblemente a presión de operación, porque la abolladura se redondea en parte con presión. Esta comprobación puede fallar aunque la deformación sea aceptable.',
              'Stosunek d/D sprawdza się osobno: wgniecenia proste głębsze niż 6 % D zwykle wymagają naprawy lub oceny inżynierskiej (B31.8 §851.4). Głębokość to największe zmniejszenie średnicy, mierzone najlepiej pod ciśnieniem roboczym, bo pod ciśnieniem wgniecenie częściowo się zaokrągla. To kryterium może nie być spełnione, nawet gdy odkształcenie jest dopuszczalne.')
          },
          membrane: {
            title: T('Membrane strain and dent length', 'Мембранна деформація і довжина вм’ятини', 'Membrandehnung und Beulenlänge', 'Membraanrek en deuklengte', 'Déformation de membrane et longueur', 'Deformación de membrana y longitud', 'Odkształcenie membranowe i długość wgniecenia'),
            body: T('The longitudinal membrane strain ε3 = ½(d/L)² is the stretching of the wall along the pipe; it grows with the square of d/L, so halving the axial length L quadruples ε3. For long dents (d/L below about 0.05) it is negligible; above d/L = 0.2 the simple formula is unreliable and a detailed (FEA) assessment is advised. L is the axial extent of the dent measured where the profile meets the undeformed pipe.',
              'Поздовжня мембранна деформація ε3 = ½(d/L)² — це розтяг стінки вздовж труби; вона зростає з квадратом d/L, тож зменшення осьової довжини L удвічі збільшує ε3 вчетверо. Для довгих вм’ятин (d/L менше близько 0,05) вона незначна; при d/L > 0,2 проста формула ненадійна і радять детальну оцінку (МСЕ). L — осьова протяжність вм’ятини до місця, де профіль переходить у недеформовану трубу.',
              'Die Längsmembrandehnung ε3 = ½(d/L)² ist die Dehnung der Wand in Rohrlängsrichtung; sie wächst mit dem Quadrat von d/L, eine Halbierung der axialen Länge L vervierfacht also ε3. Bei langen Beulen (d/L unter etwa 0,05) ist sie vernachlässigbar; über d/L = 0,2 ist die einfache Formel unzuverlässig und eine detaillierte Bewertung (FEM) wird empfohlen. L ist die axiale Ausdehnung der Beule bis zum unverformten Rohr.',
              'De langsmembraanrek ε3 = ½(d/L)² is de rek van de wand in de lengterichting; ze groeit met het kwadraat van d/L, dus het halveren van de axiale lengte L verviervoudigt ε3. Bij lange deuken (d/L onder ongeveer 0,05) is ze verwaarloosbaar; boven d/L = 0,2 is de eenvoudige formule onbetrouwbaar en wordt een gedetailleerde beoordeling (EEM) aanbevolen. L is de axiale lengte van de deuk tot de onvervormde leiding.',
              'La déformation de membrane longitudinale ε3 = ½(d/L)² est l’allongement de la paroi le long de la conduite ; elle croît comme le carré de d/L, donc diviser par deux la longueur axiale L quadruple ε3. Pour les enfoncements longs (d/L inférieur à environ 0,05) elle est négligeable ; au-delà de d/L = 0,2 la formule simple n’est plus fiable et une évaluation détaillée (MEF) est conseillée. L est l’étendue axiale de l’enfoncement jusqu’à la conduite non déformée.',
              'La deformación de membrana longitudinal ε3 = ½(d/L)² es el estiramiento de la pared a lo largo del tubo; crece con el cuadrado de d/L, de modo que reducir a la mitad la longitud axial L cuadruplica ε3. En abolladuras largas (d/L inferior a 0,05 aproximadamente) es despreciable; por encima de d/L = 0,2 la fórmula simple no es fiable y se recomienda una evaluación detallada (MEF). L es la extensión axial de la abolladura hasta el tubo sin deformar.',
              'Wzdłużne odkształcenie membranowe ε3 = ½(d/L)² to wydłużenie ścianki wzdłuż rury; rośnie z kwadratem d/L, więc skrócenie długości osiowej L o połowę zwiększa ε3 czterokrotnie. Dla długich wgnieceń (d/L poniżej ok. 0,05) jest pomijalne; powyżej d/L = 0,2 prosty wzór jest niewiarygodny i zaleca się szczegółową ocenę (MES). L to osiowy zasięg wgniecenia do miejsca, gdzie profil przechodzi w nieodkształconą rurę.')
          },
          curvature: {
            title: T('Bending strains and radii of curvature', 'Деформації згину і радіуси кривини', 'Biegedehnungen und Krümmungsradien', 'Buigrekken en krommingsstralen', 'Déformations de flexion et rayons de courbure', 'Deformaciones de flexión y radios de curvatura', 'Odkształcenia zginające i promienie krzywizny'),
            body: T('ε1 = (t/2)(1/R0 − 1/R1) is the circumferential bending from the change of hoop curvature and ε2 = −(t/2)/R2 the longitudinal bending at the dent base. Smaller radii mean a sharper dent and larger strain; R1 close to R0 gives almost no ε1. A negative R1 means reversed (inward) curvature, the wall is bent through flat into the opposite shape, and ε1 then rises steeply. Radii in the range of 2–10 t are typical of sharp dents.',
              'ε1 = (t/2)(1/R0 − 1/R1) — кільцевий згин від зміни кривини в кільцевому напрямку, а ε2 = −(t/2)/R2 — поздовжній згин у дні вм’ятини. Менші радіуси означають гострішу вм’ятину і більшу деформацію; R1, близький до R0, майже не дає ε1. Від’ємне R1 означає обернену (всередину) кривину: стінку прогнуто через плоский стан у протилежну форму, і ε1 різко зростає. Радіуси 2–10 t типові для гострих вм’ятин.',
              'ε1 = (t/2)(1/R0 − 1/R1) ist die Umfangsbiegung aus der Änderung der Umfangskrümmung und ε2 = −(t/2)/R2 die Längsbiegung am Beulengrund. Kleinere Radien bedeuten eine schärfere Beule und größere Dehnung; R1 nahe R0 ergibt fast kein ε1. Ein negatives R1 bedeutet umgekehrte (nach innen gerichtete) Krümmung, die Wand ist über die Ebene hinaus in die Gegenform gebogen, und ε1 steigt steil an. Radien von 2–10 t sind typisch für scharfe Beulen.',
              'ε1 = (t/2)(1/R0 − 1/R1) is de omtreksbuiging door de verandering van de omtrekskromming en ε2 = −(t/2)/R2 de langsbuiging in de bodem van de deuk. Kleinere stralen betekenen een scherpere deuk en grotere rek; R1 dicht bij R0 geeft bijna geen ε1. Een negatieve R1 betekent omgekeerde (naar binnen gerichte) kromming: de wand is door vlak heen in de tegengestelde vorm gebogen en ε1 stijgt dan sterk. Stralen van 2–10 t zijn typisch voor scherpe deuken.',
              'ε1 = (t/2)(1/R0 − 1/R1) est la flexion circonférentielle due au changement de courbure de la section et ε2 = −(t/2)/R2 la flexion longitudinale au fond de l’enfoncement. Des rayons plus petits signifient un enfoncement plus aigu et une déformation plus forte ; R1 proche de R0 ne donne presque pas d’ε1. Un R1 négatif signifie une courbure inversée (vers l’intérieur) : la paroi est passée au-delà du plat vers la forme opposée et ε1 augmente fortement. Des rayons de 2 à 10 t sont typiques des enfoncements aigus.',
              'ε1 = (t/2)(1/R0 − 1/R1) es la flexión circunferencial por el cambio de curvatura de la sección y ε2 = −(t/2)/R2 la flexión longitudinal en el fondo de la abolladura. Radios menores significan una abolladura más aguda y mayor deformación; un R1 cercano a R0 casi no produce ε1. Un R1 negativo significa curvatura invertida (hacia dentro): la pared ha pasado del plano a la forma opuesta y ε1 crece bruscamente. Radios de 2 a 10 t son típicos de abolladuras agudas.',
              'ε1 = (t/2)(1/R0 − 1/R1) to zginanie obwodowe wskutek zmiany krzywizny przekroju, a ε2 = −(t/2)/R2 to zginanie wzdłużne w dnie wgniecenia. Mniejsze promienie oznaczają ostrzejsze wgniecenie i większe odkształcenie; R1 bliskie R0 daje prawie zerowe ε1. Ujemne R1 oznacza odwróconą (do wewnątrz) krzywiznę: ścianka przeszła przez stan płaski w odwrotny kształt i ε1 gwałtownie rośnie. Promienie 2–10 t są typowe dla ostrych wgnieceń.')
          },
          limit: {
            title: T('Acceptance limit', 'Критерій прийнятності', 'Annahmegrenze', 'Acceptatiegrens', 'Limite d’acceptation', 'Límite de aceptación', 'Kryterium akceptacji'),
            body: T('ASME B31.8 accepts plain dents with an equivalent strain up to 6 %; higher strains need repair or a detailed engineering assessment (FEA, fatigue under pressure cycles). The 6 % value is a ductility criterion, not a fatigue limit: liquid lines and lines with large pressure cycling may need a lower internal limit, and older or low-toughness pipe and seam welds are less tolerant.',
              'ASME B31.8 допускає прості вм’ятини з еквівалентною деформацією до 6 %; більші деформації потребують ремонту або детальної інженерної оцінки (МСЕ, втома від циклів тиску). Значення 6 % — критерій пластичності, а не межа втоми: для рідинних трубопроводів і ліній із великими коливаннями тиску може знадобитися нижчий внутрішній критерій, а стара чи малов’язка труба та поздовжні шви менш стійкі.',
              'ASME B31.8 lässt einfache Beulen mit einer Vergleichsdehnung bis 6 % zu; höhere Dehnungen erfordern eine Reparatur oder eine detaillierte Bewertung (FEM, Ermüdung unter Druckzyklen). Die 6 % sind ein Duktilitätskriterium, keine Ermüdungsgrenze: Flüssigkeitsleitungen und Leitungen mit starken Druckwechseln benötigen ggf. eine niedrigere interne Grenze, und ältere oder wenig zähe Rohre und Längsnähte sind weniger tolerant.',
              'ASME B31.8 aanvaardt eenvoudige deuken met een equivalente rek tot 6 %; hogere rekken vereisen reparatie of een gedetailleerde beoordeling (EEM, vermoeiing door drukcycli). De 6 % is een ductiliteitscriterium, geen vermoeiingsgrens: vloeistofleidingen en leidingen met grote drukwisselingen kunnen een lagere interne grens nodig hebben, en oudere of weinig taaie buis en naadlassen zijn minder tolerant.',
              'L’ASME B31.8 accepte les enfoncements simples jusqu’à 6 % de déformation équivalente ; au-delà, une réparation ou une évaluation détaillée (MEF, fatigue sous cycles de pression) est nécessaire. Les 6 % sont un critère de ductilité, pas une limite de fatigue : les conduites de liquides et celles à forts cycles de pression peuvent exiger une limite interne plus basse, et les tubes anciens ou peu tenaces et les soudures longitudinales tolèrent moins.',
              'ASME B31.8 acepta abolladuras simples con deformación equivalente de hasta el 6 %; deformaciones mayores requieren reparación o una evaluación detallada (MEF, fatiga por ciclos de presión). El 6 % es un criterio de ductilidad, no un límite de fatiga: las líneas de líquidos y las de grandes ciclos de presión pueden necesitar un límite interno menor, y la tubería antigua o de baja tenacidad y las soldaduras longitudinales toleran menos.',
              'ASME B31.8 dopuszcza wgniecenia proste z odkształceniem zastępczym do 6 %; większe odkształcenia wymagają naprawy lub szczegółowej oceny (MES, zmęczenie przy cyklach ciśnienia). Wartość 6 % to kryterium ciągliwości, a nie granica zmęczenia: rurociągi cieczy i linie z dużymi wahaniami ciśnienia mogą wymagać niższego kryterium wewnętrznego, a stare lub mało udarne rury i spoiny wzdłużne są mniej odporne.')
          },
          measurement: {
            title: T('Getting the dent profile', 'Отримання профілю вм’ятини', 'Ermittlung des Beulenprofils', 'Het deukprofiel bepalen', 'Obtenir le profil de l’enfoncement', 'Obtención del perfil de la abolladura', 'Wyznaczanie profilu wgniecenia'),
            body: T('Depth, length and radii come from in-line inspection (caliper or geometry pig) or from a laser or contour-gauge survey at an excavation. Radii are very sensitive to noise and smoothing of the measured profile: a coarse sensor spacing hides sharp curvature and underestimates the strain. Check several profiles through the dent and use the worst one.',
              'Глибина, довжина і радіуси беруться з внутрішньотрубної діагностики (калібрувальний або геометричний снаряд) або з лазерного чи шаблонного обміру в шурфі. Радіуси дуже чутливі до шуму та згладжування виміряного профілю: великий крок датчиків приховує гостру кривину і занижує деформацію. Перевірте кілька профілів через вм’ятину і беріть найгірший.',
              'Tiefe, Länge und Radien stammen aus der Molchung (Kaliber- oder Geometriemolch) oder aus einer Laser- bzw. Konturlehrenvermessung an der Aufgrabung. Radien reagieren sehr empfindlich auf Rauschen und Glättung des Messprofils: ein grober Sensorabstand verbirgt scharfe Krümmungen und unterschätzt die Dehnung. Mehrere Profile durch die Beule prüfen und das ungünstigste verwenden.',
              'Diepte, lengte en stralen komen uit inline-inspectie (kaliber- of geometriepig) of uit een laser- of contourmalmeting bij een opgraving. Stralen zijn zeer gevoelig voor ruis en afvlakking van het gemeten profiel: een grove sensorafstand verbergt scherpe kromming en onderschat de rek. Controleer meerdere profielen door de deuk en gebruik het ongunstigste.',
              'Profondeur, longueur et rayons proviennent de l’inspection interne (racleur géométrique) ou d’un relevé laser ou au gabarit lors d’une excavation. Les rayons sont très sensibles au bruit et au lissage du profil mesuré : un pas de capteurs grossier masque une courbure aiguë et sous-estime la déformation. Contrôlez plusieurs profils à travers l’enfoncement et retenez le plus défavorable.',
              'La profundidad, la longitud y los radios proceden de la inspección interna (raspatubos geométrico) o de un levantamiento láser o con galga de contorno en una excavación. Los radios son muy sensibles al ruido y al suavizado del perfil medido: una separación gruesa de sensores oculta curvaturas agudas y subestima la deformación. Compruebe varios perfiles a través de la abolladura y use el más desfavorable.',
              'Głębokość, długość i promienie pochodzą z inspekcji tłokiem (kalibrującym lub geometrycznym) albo z pomiaru laserowego lub szablonem w wykopie. Promienie są bardzo wrażliwe na szum i wygładzanie zmierzonego profilu: duży rozstaw czujników ukrywa ostrą krzywiznę i zaniża odkształcenie. Sprawdź kilka profili przez wgniecenie i przyjmij najniekorzystniejszy.')
          },
          scope: {
            title: T('What this check does not cover', 'Чого ця перевірка не охоплює', 'Was diese Prüfung nicht abdeckt', 'Wat deze toets niet dekt', 'Ce que cette vérification ne couvre pas', 'Lo que esta comprobación no cubre', 'Czego ta ocena nie obejmuje'),
            body: T('The strain method applies to plain dents only. Dents with gouges, cracks, corrosion or other metal loss, dents on girth or seam welds and dents that are still restrained by a rock are assessed separately (B31.8 §851.4, API 1183) and usually repaired. A dent that passes here can still fail by fatigue if the line sees frequent pressure cycles.',
              'Метод деформацій застосовний лише до простих вм’ятин. Вм’ятини з задирами, тріщинами, корозією чи іншою втратою металу, вм’ятини на кільцевих або поздовжніх швах і вм’ятини, які ще підпирає камінь, оцінюють окремо (B31.8 §851.4, API 1183) і зазвичай ремонтують. Вм’ятина, що тут проходить, ще може зруйнуватися від утоми, якщо лінія зазнає частих циклів тиску.',
              'Die Dehnungsmethode gilt nur für einfache Beulen. Beulen mit Riefen, Rissen, Korrosion oder anderem Metallverlust, Beulen an Rund- oder Längsnähten und Beulen, die noch von einem Stein gestützt werden, werden gesondert bewertet (B31.8 §851.4, API 1183) und meist repariert. Eine hier bestandene Beule kann bei häufigen Druckwechseln dennoch durch Ermüdung versagen.',
              'De rekmethode geldt alleen voor eenvoudige deuken. Deuken met groeven, scheuren, corrosie of ander metaalverlies, deuken op rond- of langsnaden en deuken die nog door een steen worden gesteund, worden apart beoordeeld (B31.8 §851.4, API 1183) en meestal gerepareerd. Een deuk die hier voldoet, kan bij frequente drukwisselingen toch door vermoeiing bezwijken.',
              'La méthode en déformation ne s’applique qu’aux enfoncements simples. Les enfoncements avec rayures, fissures, corrosion ou autre perte de métal, ceux situés sur une soudure circulaire ou longitudinale et ceux encore maintenus par une pierre sont évalués à part (B31.8 §851.4, API 1183) et en général réparés. Un enfoncement accepté ici peut encore rompre par fatigue si la conduite subit des cycles de pression fréquents.',
              'El método de deformación solo se aplica a abolladuras simples. Las abolladuras con ranuras, grietas, corrosión u otra pérdida de metal, las situadas sobre soldaduras circunferenciales o longitudinales y las que aún están apoyadas en una roca se evalúan aparte (B31.8 §851.4, API 1183) y suelen repararse. Una abolladura que aquí pasa aún puede fallar por fatiga si la línea sufre ciclos de presión frecuentes.',

    function curveData() {
      if (!last || !last.ok) return null;
      var dMax = Math.max(2 * state.d, 0.08 * state.D), N = 40, si = [], so = [], ym = state.epsLim * 100, i, k, s, r, x;
      for (i = 0; i <= N; i++) {
        s = {}; for (k in state) { if (state.hasOwnProperty(k)) s[k] = state[k]; }
        s.d = dMax * i / N; r = solve(s);
        if (!r || !isFinite(r.eps_i) || !isFinite(r.eps_o)) continue;
        x = s.d / s.D * 100; si.push({ x: x, y: r.eps_i * 100 }); so.push({ x: x, y: r.eps_o * 100 });
        ym = Math.max(ym, r.eps_i * 100, r.eps_o * 100);
      }
      return { series: [si, so], xMax: dMax / state.D * 100, yMax: 1.15 * ym, lim: state.epsLim * 100, depthLim: state.depthLim * 100,
        xCur: state.d / state.D * 100, cur: [last.eps_i * 100, last.eps_o * 100] };
    }

      a11y: function () {
        var lg = curLang();
        if (!last || !last.ok) return DiagramUI.pick(T('Strain versus dent depth chart; no valid result.', 'Графік деформації залежно від глибини вм’ятини; немає коректного результату.', 'Diagramm Dehnung über Beulentiefe; kein gültiges Ergebnis.', 'Grafiek rek tegen deukdiepte; geen geldig resultaat.', 'Graphique déformation / profondeur d’enfoncement ; aucun résultat valide.', 'Gráfico de deformación frente a profundidad de abolladura; sin resultado válido.', 'Wykres odkształcenia w funkcji głębokości wgniecenia; brak poprawnego wyniku.'), lg);
        return DiagramUI.pick(TF(T('Equivalent strain versus dent depth. Current maximum strain {0} % against a limit of {1} %, at d/D = {2} %.', 'Еквівалентна деформація залежно від глибини вм’ятини. Поточна максимальна деформація {0} % при межі {1} %, d/D = {2} %.', 'Vergleichsdehnung über Beulentiefe. Aktuelle maximale Dehnung {0} % bei einem Grenzwert von {1} %, d/D = {2} %.', 'Equivalente rek tegen deukdiepte. Huidige maximale rek {0} % bij een grens van {1} %, d/D = {2} %.', 'Déformation équivalente en fonction de la profondeur. Déformation maximale actuelle {0} % pour une limite de {1} %, d/D = {2} %.', 'Deformación equivalente frente a profundidad de abolladura. Deformación máxima actual {0} % frente a un límite del {1} %, d/D = {2} %.', 'Odkształcenie zastępcze w funkcji głębokości wgniecenia. Obecne maksymalne odkształcenie {0} % przy limicie {1} %, d/D = {2} %.'), [[last.eps_max * 100, 3], [state.epsLim * 100, 3], [last.d_D * 100, 3]]), lg);
      },
      render: function (size, st) {
        var ctx = st.canvas(), w = size.w, h = size.h, coarse = size.density === 'coarse';
        var cs = getComputedStyle(document.documentElement);
        var muted = cs.getPropertyValue('--muted').trim() || '#888', line = cs.getPropertyValue('--line').trim() || '#ccc', font = cs.getPropertyValue('--font').trim() || 'sans-serif';
        ctx.clearRect(0, 0, w, h);
        var cd = curveData(); if (!cd) return;
        var L = coarse ? 46 : 58, R = 14, TOP = 12, B = coarse ? 36 : 44, pw = w - L - R, ph = h - TOP - B, i, j, p, tx, ty;
        function X(v) { return L + v / cd.xMax * pw; }
        function Y(v) { return TOP + ph - v / cd.yMax * ph; }
        ctx.font = (coarse ? 10 : 11) + 'px ' + font; ctx.lineWidth = 1; ctx.strokeStyle = line; ctx.fillStyle = muted;
        ctx.beginPath(); ctx.moveTo(L, TOP); ctx.lineTo(L, TOP + ph); ctx.lineTo(L + pw, TOP + ph); ctx.stroke();
        tx = DiagramUI.ticks(0, cd.xMax, pw, size.density); ty = DiagramUI.ticks(0, cd.yMax, ph, size.density);
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        for (i = 0; i < tx.length; i++) { ctx.beginPath(); ctx.moveTo(X(tx[i]), TOP + ph); ctx.lineTo(X(tx[i]), TOP + ph + 4); ctx.stroke(); ctx.fillText(DiagramUI.fmt(tx[i], { precision: 3 }), X(tx[i]), TOP + ph + 6); }
        ctx.fillText('d/D, %', L + pw / 2, TOP + ph + (coarse ? 20 : 24));
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        for (i = 0; i < ty.length; i++) { ctx.beginPath(); ctx.moveTo(L - 4, Y(ty[i])); ctx.lineTo(L, Y(ty[i])); ctx.stroke(); ctx.fillText(DiagramUI.fmt(ty[i], { precision: 3 }), L - 6, Y(ty[i])); }
        ctx.save(); ctx.translate(coarse ? 10 : 14, TOP + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'center'; ctx.fillText(DiagramUI.pick(T('strain, %', 'деформація, %', 'Dehnung, %', 'rek, %', 'déformation, %', 'deformación, %', 'odkształcenie, %'), curLang()), 0, 0); ctx.restore();
        ctx.save(); ctx.beginPath(); ctx.rect(L, TOP, pw, ph); ctx.clip();
        ctx.setLineDash([5, 4]); ctx.strokeStyle = muted;
        ctx.beginPath(); ctx.moveTo(L, Y(cd.lim)); ctx.lineTo(L + pw, Y(cd.lim)); ctx.stroke();
        ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText(DiagramUI.pick(T('limit', 'межа', 'Grenzwert', 'grens', 'limite', 'límite', 'limit'), curLang()), L + pw - 4, Y(cd.lim) - 2);
        ctx.beginPath(); ctx.moveTo(X(cd.depthLim), TOP); ctx.lineTo(X(cd.depthLim), TOP + ph); ctx.stroke();
        ctx.strokeStyle = line; ctx.beginPath(); ctx.moveTo(X(cd.xCur), TOP); ctx.lineTo(X(cd.xCur), TOP + ph); ctx.stroke();
        ctx.setLineDash([]); ctx.lineWidth = 2;
        for (j = 0; j < cd.series.length; j++) {
          p = cd.series[j]; if (!p.length) continue;
          ctx.strokeStyle = DiagramUI.series(j); ctx.beginPath();
          for (i = 0; i < p.length; i++) { if (i) ctx.lineTo(X(p[i].x), Y(p[i].y)); else ctx.moveTo(X(p[i].x), Y(p[i].y)); }
          ctx.stroke();
        }
        for (j = 0; j < cd.cur.length; j++) { ctx.fillStyle = DiagramUI.series(j); ctx.beginPath(); ctx.arc(X(cd.xCur), Y(cd.cur[j]), coarse ? 3 : 4, 0, 2 * Math.PI); ctx.fill(); }
        ctx.restore();
      }
    });
    adoptStage(ui);

    ui.ready();
    window['__dent_strain'] = { ui: ui, state: state, solve: solve, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function buildRecord() {
    if (!last) return null;
    var inKeys = ['D', 't', 'd', 'L', 'R1', 'R2', 'epsLim', 'depthLim', 'level'];
    var mKeys = { D: 1, t: 1, d: 1, L: 1, R1: 1, R2: 1 };
    var outKeys = ['eps1', 'eps2', 'eps3', 'eps_i', 'eps_o', 'eps_max', 'd_D', 'verdict', 'governing'];
    var inputs = {}, outputs = {}, units = {}, warnings = [], i, k;
    for (i = 0; i < inKeys.length; i++) {
      k = inKeys[i];
      inputs[k] = state[k];
      units[k] = mKeys.hasOwnProperty(k) ? 'm' : '-';
    }
    if (last.ok) {
      for (i = 0; i < outKeys.length; i++) {
        k = outKeys[i];
        outputs[k] = last[k];
        units[k] = '-';
      }
      warnings = (last.warnings || []).slice();
    } else {
      warnings = [last.error];
    }
    return {
      inputs: inputs,
      outputs: outputs,
      units: units,
      model: {
        equations: [
          'eps1 = (t/2)(1/R0 - 1/R1), R0 = D/2',
          'eps2 = -(t/2)/R2',
          'eps3 = 0.5 (d/L)^2',
          'eps_i,o = (2/sqrt3) sqrt(eps1^2 +/- eps1(eps2+/-eps3) + (eps2+/-eps3)^2) per ASME B31.8-2022 App. R'
        ],
        ranges: ['plain dents without gouges, cracks, metal loss or weld interaction'],
        notes: ['acceptance: eps_max <= epsLim (6 %), plain-dent depth d/D <= 6 %']
      },
      warnings: warnings
    };
  }

  function isPosNum(v) {
    return typeof v === 'number' && isFinite(v) && v > 0;
  }

  var HANDOFF = {
    provides: ['D'],
    accepts: ['D'],
    build: function () {
      if (!last || !last.ok) return null;
      return { quantities: { D: { value: state.D, unit: 'm' } } };
    },
    apply: function (payload) {
      var q = payload && payload.quantities;
      if (q) {
        if (q.D && isPosNum(q.D.value)) state.D = q.D.value;
      }
      last = solve(state);
      if (ui) { ui.sync(); ui.run(); }
    }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'dent_strain',
        file: 'dent_strain.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
