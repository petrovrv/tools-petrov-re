    "en": "Point-kinetics approximation with generic delayed-neutron data; spatial effects, protection logic and thermal-hydraulic or reactivity feedback are not represented. The reactivity is a step at t = 0 and the transient is the exact seven-mode solution for that step, so ramps, feedback and source terms are outside the model. The prompt-jump factor and the plotted transient assume a constant Lambda and a source-free reactor.",

  /* 5. the tour card is fixed to the bottom of the viewport, and Learn.place()
        gets it off its own target by scrolling the page — which it cannot do
        once the document is already at its end. Below md that also lets the
        card cover the docked shared bar. Reserve scroll room for as long as a
        tour card exists, at every width, so the framework's own manoeuvre has
        somewhere to go. */
  body:has(.dgu-tour) .dgu-chromedock{margin-bottom:calc(var(--sp-7) * 8)}
  /* 6. below md the sticky result strip sits inside a region box of its own
        height, so it can never travel and the answer leaves the first screen on
        the first scroll — the one thing spec 4.2 calls absolute. Make the
        region the sticky box. */
  @media (max-width:768px){
    .dgu-app .dgu-r-strip{position:sticky;top:var(--dgu-head-h,60px);z-index:var(--z-sticky);
      background:var(--bg)}
  }
  /* 7. below md the header packs the return link, the h1 and the subtitle into
        one flex row, so a long tool name is squeezed into a narrow column. */
  @media (max-width:768px){
    .dgu-app.dgu-app .dgu-head-l{flex-wrap:wrap}
    .dgu-app.dgu-app .dgu-title{flex:1 0 100%}
  }
  /* 8. above lg the framework makes the results column sticky; when that column
        is taller than the viewport it travels with the scroll and is painted
        over the full-width footer and dock. Give them their own layer. */
  @media (min-width:1120px){
    .dgu-app .dgu-r-footer,.dgu-app .dgu-r-dock{position:relative;z-index:1}
  }

        flow so the stage's own min-height decides how tall the plot is. */
  .dgu-app .dgu-stage-body>canvas{position:absolute;left:0;top:0;width:100%;height:100%}

  .dgu-app .dgu-r-stage .dgu-stage{min-height:410px}

  .kin-bare{max-width:900px;margin:0 auto;padding:var(--sp-5) var(--sp-4)}

}

  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  return vals[k]!=null ? vals[k] : m; }); }
function cssVar(name,fallback){

    return v || fallback; }catch(e){ return fallback; }
}

/* ---- U-235 thermal delayed-neutron data (6 groups) ---- */
const BETA = [0.000215,0.001424,0.001274,0.002568,0.000748,0.000273];
const LAM  = [0.0124,0.0305,0.1110,0.3010,1.1400,3.0100];
const beta = BETA.reduce((a,b)=>a+b,0);      // exact sum = 0.006502
const lamMin = Math.min.apply(null,LAM);      // 0.0124

/* ---- Inhour: dominant root omega of  rho = omega*Lam + sum beta_i*omega/(omega+lam_i) ---- */
function inhour(omega, Lambda){
  let s = omega*Lambda;
  for(let i=0;i<6;i++) s += BETA[i]*omega/(omega+LAM[i]);
  return s;
}
function findOmega(rho, Lambda){
  if(Math.abs(rho) < 1e-14) return 0;
  // Unique root in (-lamMin, +inf); f monotonic increasing there.
  const f = (w)=> inhour(w,Lambda) - rho;
  let lo = -lamMin + 1e-9;   // just right of the largest pole
  let hi;
  if(rho > 0){
    lo = 1e-12; hi = 1.0;
    while(f(hi) < 0 && hi < 1e12) hi *= 10;
  } else {
    hi = -1e-12; lo = -lamMin + 1e-9;
  }
  // bisection
  let flo = f(lo), a=lo, b=hi;
  for(let k=0;k<200;k++){
    const m = 0.5*(a+b);
    const fm = f(m);
    if(fm === 0){ a=b=m; break; }
    if((fm < 0) === (flo < 0)){ a = m; flo = fm; } else { b = m; }
    if(Math.abs(b-a) < 1e-15*Math.max(1,Math.abs(a))) break;
  }
  return 0.5*(a+b);
}

/* ---- All seven roots of the inhour equation --------------------------------
   F(s) = s*Lambda + sum_i beta_i*s/(s+lam_i) - rho is strictly increasing between
   consecutive poles -lam_i, so every interval (-lam_(j), -lam_(j-1)) holds exactly
   one root; plus one in (-lam_min, +inf) (the stable-period root) and one in
   (-inf, -lam_max) (the prompt mode). */
function inhourRoots(rho, Lambda){
  const F = s => { let v = s*Lambda - rho; for(let i=0;i<6;i++) v += BETA[i]*s/(s+LAM[i]); return v; };
  const bis = (a,b)=>{ let fa=F(a);
    for(let k=0;k<300;k++){
      const m=0.5*(a+b), fm=F(m);
      if(fm===0) return m;
      if((fm<0)===(fa<0)){ a=m; fa=fm; } else { b=m; }
      if(Math.abs(b-a) <= 1e-16*(Math.abs(a)+Math.abs(b))) break;
    }
    return 0.5*(a+b); };
  // step towards a pole from one side until F has the sign the pole forces
  const near = (pole, side, scale)=>{ let d=Math.abs(scale);
    for(let k=0;k<80;k++){ const s=pole+side*d;
      if(side>0 ? F(s)<0 : F(s)>0) return s;
      d*=0.1; }
    return pole+side*1e-14*Math.max(1,Math.abs(pole)); };
  const roots=[];
  if(rho===0) roots.push(0);
  else {
    const lo = near(-LAM[0], +1, LAM[0]*0.5);
    let hi;
    if(rho>0){ hi=1e-9; while(F(hi)<0 && hi<1e14) hi*=10; } else hi=0;
    roots.push(bis(lo,hi));
  }
  for(let j=1;j<6;j++){
    const g=(LAM[j]-LAM[j-1])*0.5;
    roots.push(bis(near(-LAM[j],+1,g), near(-LAM[j-1],-1,g)));
  }
  let lo=-LAM[5]*2-1; while(F(lo)>0 && lo>-1e15) lo*=10;
  roots.push(bis(lo, near(-LAM[5],-1,LAM[5]*0.5)));
  return roots;
}
/* ---- Exact 7-mode modal solution for a step reactivity ----------------------
   The six-group point-kinetics system is linear with constant coefficients, so
   n(t) = sum_k a_k exp(w_k t) is EXACT (no truncation error at any step size).
   Laplace inversion with the equilibrium initial condition n=1, C_i=beta_i/(Lambda*lam_i)
   gives  n(s) = [Lambda + sum_i beta_i/(s+lam_i)] / F(s), hence
     a_k = (Lambda + sum_i beta_i/(w_k+lam_i)) / (Lambda + sum_i beta_i*lam_i/(w_k+lam_i)^2)
   where the denominator is F'(w_k).  A first-order integrator (backward Euler) is
   not adequate here: at rho = 0.9 $ / Lambda = 1e-5 it overshoots by a factor of 2. */
function modalSolution(rho, Lambda){
  const w = inhourRoots(rho, Lambda);
  const a = w.map(wk=>{ let num=Lambda, den=Lambda;
    for(let i=0;i<6;i++){ const d=wk+LAM[i]; num+=BETA[i]/d; den+=BETA[i]*LAM[i]/(d*d); }
    return num/den; });
  return {w, a, n:(t)=>{ let s=0;
    for(let k=0;k<w.length;k++){ const e=w[k]*t; if(e>-745) s+=a[k]*Math.exp(e); }
    return s; }};
}
/* ---- Sample the exact solution on the log time grid the plot uses ---- */
function simulate(rho, Lambda, tMax, Tstable){
  const m = modalSolution(rho, Lambda);
  const ts=[], ns=[];
  // ~60 samples per decade of time: on the log-log axes that is roughly one polyline
  // vertex every 1.5 px at the widths this chart is drawn at, so the drawn polyline
  // is visually indistinguishable from the exact curve
  const t0=1e-7, l0=Math.log10(t0), l1=Math.log10(tMax);
  const N=Math.max(200, Math.min(4000, Math.round((l1-l0)*60)));
  for(let k=0;k<=N;k++){
    const t = k===0 ? t0 : (k===N ? tMax : Math.pow(10, l0+(l1-l0)*k/N));
    const n = m.n(t);
    if(!isFinite(n)) break;
    ts.push(t); ns.push(n);
    if(n>1e15 || n<1e-15) break;
  }
  return {ts,ns};
}

/* ---- the whole model, as one pure function of the state --------------------
   Everything the page shows comes from here; nothing in it touches the DOM. */
function solve(s){
  const rhoDollar = Number(s.rho);
  const Lambda = Math.pow(10, Number(s.lam));
  const rho = rhoDollar*beta;
  const promptCrit = rhoDollar >= 1.0;
  const omega = findOmega(rho, Lambda);
  const T = (omega===0) ? Infinity : 1/omega;
  let tMax;
  if(promptCrit){
    tMax = Math.max(0.5, Math.min(20, 12*Math.abs(T)));
  } else {
    tMax = Math.min(400, Math.max(20, 6*Math.abs(T)));
  }
  const data = simulate(rho, Lambda, tMax, T);
  const promptJump = (rho<beta)? beta/(beta-rho) : Infinity;
  return { rhoDollar, Lambda, rho, promptCrit, omega, T, tMax, data, promptJump };
}

/* ---- Formatting helpers ----
   splitT is fmtT taken apart so the magnitude and its unit can go into the two
   slots a result tile offers; fmtT itself is unchanged and still used for the
   spoken description and for the fallback view. */
function splitT(T){
  if(!isFinite(T)) return {v:"∞", u:""};
  const a=Math.abs(T);
  if(a>=100) return {v:T.toFixed(0), u:"s"};
  if(a>=1)   return {v:T.toFixed(2), u:"s"};
  if(a>=1e-3)return {v:(T*1e3).toFixed(2), u:"ms"};
  return {v:(T*1e6).toFixed(1), u:"µs"};
}
function fmtT(T){ const s=splitT(T); return s.u ? s.v+" "+s.u : s.v; }

/* decade tick generator for log axes */
function logTicks(minv, maxv){
  const lo = Math.floor(Math.log10(minv)), hi = Math.ceil(Math.log10(maxv));
  const t=[];
  for(let e=lo;e<=hi;e++) t.push(Math.pow(10,e));
  return t;
}
function fmtLog(v){
  const e = Math.round(Math.log10(v));
  if(e>=0 && e<=3) return v.toLocaleString();
  return "1e"+e;
}
/* spec 10: below md the tool must reduce the tick count rather than shrink the
   labels. Decades are kept whole; every n-th one is labelled. */
function thin(list, px, minGap){
  if(list.length<2) return list.map(()=>true);
  const gap = px/(list.length-1);
  const k = Math.max(1, Math.ceil(minGap/Math.max(gap,1e-9)));
  return list.map((v,i)=> (i % k === 0) || i===list.length-1);
}

/* ---- Draw n(t)/n0 plot (log time x, log n y) ---- */
function drawN(ctx, W, H, density, L, lang){
  const l = I18N[lang] || I18N.en;
  const coarse = density === 'coarse';
  const cGrid=cssVar('--line','#e2e7ee'), cBase=cssVar('--muted','#5b6675'),
        cInk=cssVar('--ink','#12161d'), cMuted=cssVar('--muted','#5b6675'),
        cAcc=cssVar('--accent','#3763e6'), cAsym=cssVar('--ok','#1f6f34'),
        cBad=cssVar('--bad','#a5261f'),
        fSmall=cssVar('--fs-small','12px'), fLabel=cssVar('--fs-label','13px'),
        fam=cssVar('--font','system-ui,sans-serif'),
        mono=cssVar('--font-mono','ui-monospace,Menlo,monospace');

  ctx.clearRect(0,0,W,H);
  const mL=coarse?46:64, mR=coarse?10:16, mT=14, mB=coarse?38:42;
  const px = W-mL-mR, py = H-mT-mB;
  if(px<40 || py<40) return;

  if(!L){                                   /* nothing computed yet: axes only */
    ctx.strokeStyle=cGrid; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(mL,mT); ctx.lineTo(mL,mT+py); ctx.lineTo(mL+px,mT+py); ctx.stroke();
    return;
  }
  const data=L.data, T=L.T, promptJump=L.promptJump, promptCrit=L.promptCrit;

  // data ranges
  const ts=data.ts, ns=data.ns;
  let xmin=1e-6, xmax=ts[ts.length-1];
  let ymin=Infinity, ymax=-Infinity;
  for(let i=0;i<ns.length;i++){
    if(ns[i]>0){ ymin=Math.min(ymin,ns[i]); ymax=Math.max(ymax,ns[i]); }
  }
  // pad log range
  let lymin=Math.log10(ymin), lymax=Math.log10(ymax);
  if(lymax-lymin < 0.5){ lymin-=0.4; lymax+=0.4; }
  lymin=Math.floor(lymin); lymax=Math.ceil(lymax);
  const lxmin=Math.log10(xmin), lxmax=Math.log10(xmax);

  const X = (v)=> mL + (Math.log10(v)-lxmin)/(lxmax-lxmin)*px;
  const Y = (v)=> mT + (lymax-Math.log10(v))/(lymax-lymin)*py;

  // grid
  ctx.strokeStyle=cGrid; ctx.lineWidth=1;
  ctx.fillStyle=cMuted;
  ctx.font="400 "+fSmall+"/1 "+mono;
  ctx.textAlign="right"; ctx.textBaseline="middle";
  // y decades
  const yd=[]; for(let e=lymin;e<=lymax;e++) yd.push(e);
  const yShow=thin(yd, py, coarse?26:18);
  yd.forEach(function(e,i){
    const v=Math.pow(10,e), y=Y(v);
    ctx.beginPath(); ctx.moveTo(mL,y); ctx.lineTo(mL+px,y); ctx.stroke();
    if(yShow[i]) ctx.fillText(fmtLog(v), mL-8, y);
  });
  // x decades
  ctx.textAlign="center"; ctx.textBaseline="top";
  const xt=logTicks(xmin,xmax).filter(v=>v>=xmin&&v<=xmax);
  const xShow=thin(xt, px, coarse?52:44);
  xt.forEach(function(v,i){
    const x=X(v);
    ctx.beginPath(); ctx.moveTo(x,mT); ctx.lineTo(x,mT+py); ctx.stroke();
    if(xShow[i]) ctx.fillText(fmtLog(v), x, mT+py+6);
  });
  // baseline n/n0 = 1
  if(1>=Math.pow(10,lymin) && 1<=Math.pow(10,lymax)){
    ctx.strokeStyle=cBase; ctx.setLineDash([4,4]);
    const y1=Y(1); ctx.beginPath(); ctx.moveTo(mL,y1); ctx.lineTo(mL+px,y1); ctx.stroke();
    ctx.setLineDash([]);
  }

  // shaded area first, then the simulated curve on top of it, so the translucent
  // fill does not tint the line it belongs to
  const line=()=>{ ctx.beginPath();
    for(let i=0;i<ts.length;i++){
      if(ns[i]<=0) continue;
      const x=X(ts[i]), y=Y(ns[i]);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    } };
  line();
  ctx.lineTo(X(ts[ts.length-1]), mT+py);
  ctx.lineTo(X(ts[0]), mT+py); ctx.closePath();
  ctx.save();
  ctx.globalAlpha = 0.08;                    /* the wash the page has always used */
  ctx.fillStyle = promptCrit ? cBad : cAcc;
  ctx.fill();
  ctx.restore();
  line();
  ctx.strokeStyle= promptCrit ? cBad : cAcc;
  ctx.lineWidth=2; ctx.stroke();

  // asymptotic reference line (prompt jump * e^(t/T)) for sub-prompt.  Drawn LAST:
  // once the transient is integrated exactly the two lines nearly coincide at large
  // t, and a reference line hidden underneath the simulated curve is useless.
  if(!promptCrit && isFinite(T) && T>0 && promptJump>0){
    ctx.beginPath(); let started=false;
    for(let i=0;i<ts.length;i++){
      const v = promptJump*Math.exp(ts[i]/T);
      if(v<=0) continue;
      const x=X(ts[i]), y=Y(v);
      if(y<mT-30||y>mT+py+30){ started=false; continue; }
      if(!started){ ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=cAsym; ctx.lineWidth=2; ctx.setLineDash([6,5]);
    ctx.stroke(); ctx.setLineDash([]);
  }

  // axis labels
  ctx.fillStyle=cInk; ctx.font="400 "+fLabel+"/1 "+fam;
  ctx.textAlign="center"; ctx.textBaseline="top";
  ctx.fillText(l.axNTime, mL+px/2, H-16);
  ctx.save();
  ctx.translate(coarse?12:16, mT+py/2); ctx.rotate(-Math.PI/2);
  ctx.textBaseline="bottom";
  ctx.fillText(l.axNPop, 0, 0);
  ctx.restore();
}

/* ---- Draw inhour: reactivity ($) vs |period| (log s) ---- */
function drawInhour(ctx, W, H, density, L, lang){
  const l = I18N[lang] || I18N.en;
  const coarse = density === 'coarse';
  const cGrid=cssVar('--line','#e2e7ee'), cInk=cssVar('--ink','#12161d'),
        cMuted=cssVar('--muted','#5b6675'), cAcc=cssVar('--accent','#3763e6'),
        cBad=cssVar('--bad','#a5261f'), cOk=cssVar('--ok','#1f6f34'),
        cPanel=cssVar('--panel','#fff'),
        fSmall=cssVar('--fs-small','12px'), fLabel=cssVar('--fs-label','13px'),
        fMicro=cssVar('--fs-micro','11px'),
        fam=cssVar('--font','system-ui,sans-serif'),
        mono=cssVar('--font-mono','ui-monospace,Menlo,monospace');

  ctx.clearRect(0,0,W,H);
  const mL=coarse?42:52, mR=coarse?10:16, mT=14, mB=coarse?38:42;
  const px=W-mL-mR, py=H-mT-mB;
  if(px<40 || py<40) return;
  const xlo=Math.log10(1e-3), xhi=Math.log10(1e4);  // period seconds
  const ylo=-1.05, yhi=1.05;                         // dollars
  const X=(v)=> mL + (Math.log10(v)-xlo)/(xhi-xlo)*px;
  const Y=(d)=> mT + (yhi-d)/(yhi-ylo)*py;

  // grid
  ctx.strokeStyle=cGrid; ctx.lineWidth=1;
  ctx.fillStyle=cMuted; ctx.font="400 "+fSmall+"/1 "+mono;
  ctx.textAlign="right"; ctx.textBaseline="middle";
  for(let d=-1;d<=1;d+=0.5){
    const y=Y(d);
    ctx.beginPath(); ctx.moveTo(mL,y); ctx.lineTo(mL+px,y); ctx.stroke();
    ctx.fillText("$"+d.toFixed(1), mL-8, y);
  }
  ctx.textAlign="center"; ctx.textBaseline="top";
  const xe=[]; for(let e=-3;e<=4;e++) xe.push(e);
  const xShow=thin(xe, px, coarse?52:44);
  xe.forEach(function(e,i){
    const v=Math.pow(10,e), x=X(v);
    ctx.beginPath(); ctx.moveTo(x,mT); ctx.lineTo(x,mT+py); ctx.stroke();
    if(xShow[i]) ctx.fillText(fmtLog(v), x, mT+py+6);
  });
  // one-dollar prompt-critical line
  ctx.strokeStyle=cBad; ctx.setLineDash([5,4]); ctx.lineWidth=1.5;
  const yPC=Y(1); ctx.beginPath(); ctx.moveTo(mL,yPC); ctx.lineTo(mL+px,yPC); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=cBad; ctx.textAlign="left"; ctx.font="500 "+fMicro+"/1 "+fam;
  ctx.fillText(l.inhPromptCrit, mL+6, yPC+2);

  // curve: two arms (negative and positive rho)
  const Lambda = L ? L.Lambda : Math.pow(10, DEFAULTS.lam);
  function arm(dLo,dHi){
    ctx.beginPath(); let started=false;
    const N=200;
    for(let k=0;k<=N;k++){
      const d = dLo + (dHi-dLo)*k/N;
      const rho = d*beta;
      const w = findOmega(rho,Lambda);
      if(w===0) continue;
      const T=Math.abs(1/w);
      if(T<1e-4||T>1e6) continue;
      const x=X(Math.min(Math.max(T,1e-3),1e4)), y=Y(d);
      if(!started){ ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.strokeStyle=cAcc; ctx.lineWidth=2;
  arm(-0.99,-0.02);
  arm(0.02,0.99);

  // operating point
  const curT = L ? L.T : NaN, rhoDollar = L ? L.rhoDollar : NaN;
  if(isFinite(curT) && Math.abs(curT)>0){
    const Tp=Math.min(Math.max(Math.abs(curT),1e-3),1e4);
    const x=X(Tp), y=Y(Math.max(-1.05,Math.min(1.05,rhoDollar)));
    ctx.beginPath(); ctx.arc(x,y,5,0,2*Math.PI);
    ctx.fillStyle = (rhoDollar>=1)? cBad : cOk;
    ctx.fill(); ctx.strokeStyle=cPanel; ctx.lineWidth=2; ctx.stroke();
  }

  // axis labels
  ctx.fillStyle=cInk; ctx.font="400 "+fLabel+"/1 "+fam;
  ctx.textAlign="center"; ctx.textBaseline="top";
  ctx.fillText(l.axITime, mL+px/2, H-16);
  ctx.save(); ctx.translate(coarse?12:14,mT+py/2); ctx.rotate(-Math.PI/2);
  ctx.textBaseline="bottom"; ctx.fillText(l.axIReact,0,0); ctx.restore();
}

/* the two sliders used to be <input type=range>, and the browser snapped every
   value written into them to the step. Anything that arrives from outside the
   page — a handoff payload — went through that snap, so it still does. */
function snapRho(v){
  const c = Math.max(RHO_MIN, Math.min(RHO_MAX, v));
  const n = Math.round((c-RHO_MIN)/RHO_STEP);
  return Number((RHO_MIN + n*RHO_STEP).toFixed(3));   /* the step is 0.005 */
}

e es lo que marca un medidor de tasa de arranque.',"Gdy stan przejściowy ustabilizuje się w okresie stabilności, moc ma charakter czysto wykładniczy, więc czas podwojenia wynosi T·ln². Dla kroku ujemnego ta sama wartość to czas zmniejszenia o połowę, co wskazuje kafelek. Operatorzy obserwują tę liczbę, a nie sam okres, ponieważ to właśnie odczytuje licznik częstotliwości rozruchu.")

późnionych praktycznie się nie zmieniają, dlatego populacja neutronów niemal natychmiast rośnie o czynnik β/(β−ρ), a dopiero potem zmienia się zgodnie z okresem asymptotycznym. Przy 0,5 $ czynnik wynosi 2, przy 0,9 $ — 10, a przy 1 $ dąży do nieskończoności: to granica krytyczności na neutronach natychmiastowych widziana od strony podkrytycznej.")

ls neutrons prompts. Les neutrons retardés ne sont plus nécessaires, la période stable s’effondre à quelques Λ et la puissance croît de plusieurs décades en une fraction de seconde. La cinétique ponctuelle sans contre-réaction n’y a pas de solution bornée : ce modèle continue de calculer, un réacteur réel n’y survivrait pas. C’est la seule limite dont l’exploitation ne doit jamais s’approcher, et la raison pour laquelle la réactivité se mesure en dollars par rapport à elle.','En ρ ≥ β la reacción en cadena se sostiene solo con neutrones inmediatos. Los neutrones retardados ya no hacen falta, el periodo estable se desploma a unas pocas Λ y la potencia sube décadas en una fracción de segundo. La cinética puntual sin realimentación no tiene ahí solución acotada: este modelo sigue calculando, un reactor real no lo resistiría. Es el único límite al que la operación nunca debe acercarse, y por eso la reactividad se mide en dólares respecto a él.',"Przy ρ ≥ β reakcja łańcuchowa podtrzymuje się wyłącznie dzięki neutronom natychmiastowym. Neutrony opóźnione nie są już potrzebne, okres stabilności spada do kilkukrotności Λ, a moc rośnie o dekady w ułamku sekundy. Kinetyka punktowa bez sprzężenia zwrotnego nie ma tu rozwiązania ograniczonego: ten model działa bez zarzutu, prawdziwy reaktor by nie przetrwał. To jedyna operacja graniczna, do której nigdy nie wolno się zbliżać, i dlatego reaktywność mierzy się w dolarach.")

/* ------------------------------------------------------------------ results */
function computeResults(s){
  const rho = Number(s.rho), lam = Number(s.lam);
  if(!isFinite(rho) || !isFinite(lam)) return null;
  LAST = solve(s);
  if(stageN) stageN.schedule();
  if(stageI) stageI.schedule();
  const lang = curLang(), t = I18N[lang] || I18N.en;
  const L = LAST, T = L.T, promptCrit = L.promptCrit;

  /* rho > 0: doubling time T*ln2.  rho < 0: HALVING time |T|*ln2 - it is finite
     and must not be printed as an infinite doubling time. */
  const doubleT = isFinite(T) ? Math.abs(T)*Math.LN2 : NaN;
  let per, perQ, dbl, dblQ;
  if(promptCrit){
    per = splitT(T); perQ = t.vPrompt;
    dbl = isFinite(doubleT) ? splitT(doubleT) : {v:"—",u:""}; dblQ = "";
  } else if(T>0){
    per = splitT(T); perQ = "";
    dbl = splitT(doubleT); dblQ = "";
  } else if(isFinite(T)){
    per = splitT(T); perQ = t.vDecay;
    dbl = splitT(Math.abs(doubleT)); dblQ = t.vHalve;
  } else {
    per = {v:"∞",u:""}; perQ = t.vCritical.replace("∞","").trim();
    dbl = {v:"—",u:""}; dblQ = "";
  }
  const sub = (q, base) => q ? (q + " · " + base) : base;
  const pj = (L.rho < beta) ? L.promptJump : null;

  let verdict = null;
  if(promptCrit) verdict = { tone:'bad', text:t.flagCrit };
  else if(L.rhoDollar > 0.8) verdict = { tone:'warn', text:t.flagApproach };

  return {
    verdict: verdict,
    tiles: [
      { label:K('rdReactivity'), value:L.rhoDollar, unit:'$', precision:3,
        hint:(L.rho*1e5).toFixed(0)+' pcm', learn:'reactivity' },
      { label:K('rdPeriod'), value:per.v, unit:per.u||null, tone:promptCrit?'bad':null,
        hint:sub(perQ, "1/ω, "+t.subPeriodRoot), learn:'period' },
      { label:K('rdDouble'), value:dbl.v, unit:dbl.u||null, tone:promptCrit?'bad':null,
        hint:sub(dblQ, "T·ln2"), learn:'doubling' },
      { label:K('rdPromptJump'), value: pj==null ? t.vDiverges : pj,
        unit: pj==null ? null : '×', precision:3,
        hint:"β/(β−ρ)", learn:'promptjump' },
      { label:K('rdBeta'), value:beta*1e5, unit:'pcm', precision:0,
        hint:"Σβᵢ = "+beta.toFixed(6), learn:'beta', headline:false }
    ]
  };
}

function a11yN(){
  if(!LAST) return '';
  const ns=LAST.data.ns, ts=LAST.data.ts;
  const last=ns.length?ns[ns.length-1]:1, tl=ts.length?ts[ts.length-1]:0;
  return fill(pick(S.a11yN, curLang()), {
    n: last>=1e4 ? last.toExponential(2) : last.toFixed(2),
    t: tl.toFixed(0),
    pj: isFinite(LAST.promptJump) ? LAST.promptJump.toFixed(3) : pick(K('vDiverges'), curLang()),
    T: fmtT(LAST.T)
  });
}
function a11yI(){
  if(!LAST) return '';
  return fill(pick(S.a11yI, curLang()),
    { d: LAST.rhoDollar.toFixed(3), T: fmtT(LAST.T) });
}

/* --------------------------------------------------------------- the shell */
/* UPSTREAM: App.reset() and App.example() replace app.state with a fresh
   object, so the object this file holds — the one serialize(), record() and
   the handoff write through — is orphaned the moment either runs, and the
   permalink then freezes at the reset value. Adopt the new values into the one
   state object and point the app back at it. */
function adopt(fresh, app){
  Object.keys(fresh).forEach(function(k){ state[k]=fresh[k]; });
  app.state = state;
  return state;
}

const EXAMPLES = [
  { label:S.exSmall,  note:'ρ = +0.10 $, Λ = 100 µs', state:{ rho: 0.1,  lam: -4 } },
  { label:S.exCrit,   note:'ρ = 0 $, Λ = 100 µs',     state:{ rho: 0,    lam: -4 } },
  { label:S.exDown,   note:'ρ = −0.50 $, Λ = 100 µs', state:{ rho:-0.5,  lam: -4 } },
  { label:S.exNear,   note:'ρ = +0.90 $, Λ = 10 µs',  state:{ rho: 0.9,  lam: -5 } },
  { label:S.exPrompt, note:'ρ = +1.00 $, Λ = 10 µs',  state:{ rho: 1,    lam: -5 } }
];

/* the two live readouts the sliders have always carried, written into the
   framework's own <output> so there is still exactly one of each on screen */
function syncOutputs(app){
  const host = app.regions.inputs;
  const r = host.querySelector('[data-dgu-field="f-rho-r"] .dgu-rangeval');
  if(r) r.textContent = "$"+Number(state.rho).toFixed(3)+"  ("+(Number(state.rho)*beta*1e5).toFixed(1)+" pcm)";
  const m = host.querySelector('[data-dgu-field="f-lam-r"] .dgu-rangeval');
  if(m) m.textContent = Math.pow(10,Number(state.lam)).toExponential(2)+" s";
}

function buildInputs(app){
  app.examples(EXAMPLES.map(function(ex){
    return { label:ex.label, note:ex.note, state:ex.state,
             apply:function(fresh,a){ adopt(fresh,a); } };
  }));
  app.panel({
    slot:'inputs', id:'rho', title:S.panelRho, learn:'reactivity',
    sync:function(){ syncOutputs(app); },
    fields:[
      { id:'f-rho', key:'rho', type:'number', unit:'$', precision:3,
        min:RHO_MIN, max:RHO_MAX, step:RHO_STEP, required:true,
        label:K('ctrlRhoLabel'), hint:K('ctrlRhoHintPlain'), learn:'reactivity',
        validate:function(v){ return (typeof v==='number' && isFinite(v)) ? true : S.badRho; } },
      { id:'f-rho-r', key:'rho', type:'range', precision:3,
        min:RHO_MIN, max:RHO_MAX, step:RHO_STEP, label:K('ctrlRhoLabel') }
    ]
  });
  app.panel({
    slot:'inputs', id:'lam', title:S.panelLam, learn:'generation',
    sync:function(){ syncOutputs(app); },
    fields:[
      /* stored as log10(Lambda) — the permalink contract — but typed and read
         in microseconds, which is the unit the number actually has */
      { id:'f-lam', key:'lam', type:'number', unit:'µs', precision:3,
        min:10, max:1000, step:1, required:true,
        label:K('ctrlLamLabel'), hint:K('ctrlLamHintPlain'), learn:'generation',
        get:function(st){ return Math.pow(10, Number(st.lam))*1e6; },
        set:function(v,st){ st.lam = Math.log10(Number(v)*1e-6); },
        validate:function(v){ return (typeof v==='number' && isFinite(v) && v>0) ? true : S.badLam; } },
      { id:'f-lam-r', key:'lam', type:'range', precision:2,
        min:LAM_MIN, max:LAM_MAX, step:LAM_STEP, label:K('ctrlLamLabel') }
    ]
  });
  /* reset lives in the inputs footer, per the placement law */
  app.panel({
    slot:'inputs', id:'dgu-reset-row',
    render:function(box){
      const row=document.createElement('div');
      row.className='dgu-panel-actions';
      row.appendChild(app.actionButton(app.resetAction()));
      box.appendChild(row);
    }
  });
  /* UPSTREAM: Field.prototype.commit sets the "clamped" note and clears it
     again on the next commit, so a clamped value is written back but never
     announced (spec 6, UI_AUDIT S-9). Announce it on the one surface the site
     has. The listener captures, because the framework's own change handler
     writes the clamped value back into the box first. */
  [['f-rho-c',RHO_MIN,RHO_MAX,'$'],['f-lam-c',10,1000,'µs']].forEach(function(f){
    const elc = app.regions.inputs.querySelector('#'+f[0]);
    if(!elc) return;
    elc.addEventListener('change', function(){
      const raw = parseFloat(elc.value);
      if(!isFinite(raw) || (raw>=f[1] && raw<=f[2])) return;
      app.notify(fill(pick(S.clamped, app.lang),
        { v: raw+' '+f[3], c: Math.min(f[2],Math.max(f[1],raw))+' '+f[3] }), { kind:'warn' });
    }, true);
  });
}

function buildStages(app){
  stageN = app.stage({
    caption: K('secNTitle'), a11y: a11yN,
    render: function(size, st){ drawN(st.canvas(), size.w, size.h, size.density, LAST, app.lang); }
  });
  stageN.node.setAttribute('data-learn-topic','transient');
  stageN.tools.appendChild(app.learnButton('transient'));
  const leg=document.createElement('div');

  leg.innerHTML =
    '<span class="sim"><i class="kin-sw"></i><span>'+I18N[app.lang].legendSim+'</span></span>'+
    '<span class="asym"><i class="kin-sw"></i><span>'+I18N[app.lang].legendAsym+'</span></span>';
  stageN.node.insertBefore(leg, stageN.node.querySelector('.dgu-stage-cap'));

  stageI = app.stage({
    slot:'dock', caption: K('secITitle'), a11y: a11yI,
    render: function(size, st){ drawInhour(st.canvas(), size.w, size.h, size.density, LAST, app.lang); }
  });
  stageI.node.setAttribute('data-learn-topic','period');
  stageI.tools.appendChild(app.learnButton('period'));
}

function buildFooter(host, app){
  const d=document.createElement('details');
  d.innerHTML='<summary>'+esc(pick(S.footSum, app.lang))+'</summary>'+

/* ---------------------------------------------------------------- boot */
function detectLang(){
  if(I18N[window.__diagramLang]) return window.__diagramLang;
  try{ const x=localStorage.getItem('diagram_lang'); if(I18N[x]) return x; }catch(e){}
  const nav=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||''];
  for(let i=0;i<nav.length;i++){ const p=String(nav[i]).toLowerCase().split('-')[0];
    if(I18N[p]) return p; }
  return 'en';
}

function boot(){
  LANG = detectLang();
  document.title = I18N[LANG].title;
  if(!window.DiagramUI || DiagramUI.api!=='tools.petrov.re/ui/v1'){ bootBare(); dgcInit(); return; }

  const ui = DiagramUI.app({
    id:'kinetics', mount:'#app', layout:'calculator', compute:'live',
    lang: LANG, state: state, defaults: DEFAULTS, history:false,
    title: K('title'), subtitle: K('subtitle'),
    learn: learnData(),
    regions: {
      inputs: function(host,app){ buildInputs(app); },
      stage:  function(host,app){ buildStages(app); }
    },
    /* the footer option, not the footer region: only the option adds the
       .dgu-footer styling the placement law expects for model notes */
    footer: function(host,app){ buildFooter(host,app); },
    on: {
      compute: computeResults,
      lang: function(code){ LANG=code; document.title=I18N[code].title; },
      reset: function(fresh,app){ adopt(fresh,app); }
    }
  });
  /* the canvas colours come from the token layer, so both plots are redrawn
     when the theme resolves differently — the page used to watch the media
     query through its own :root block */
  DiagramUI.theme.watch(function(){
    if(stageN) stageN.schedule();
    if(stageI) stageI.schedule();
  });
  ui.ready();
  syncOutputs(ui);
  dgcInit();
}

/* diagram-ui.js is missing (blocked, 404 or an old cache): the physics, the
   record, the permalink, the report and the exports all still work, so run
   them and say plainly which part is not there. */
function bootBare(){
  const box=document.getElementById('app')||document.body;
  const l=I18N[LANG];
  box.className='kin-bare';
  box.innerHTML='';
  const h1=document.createElement('h1'); h1.textContent=l.title; box.appendChild(h1);
  const sub=document.createElement('p'); sub.textContent=l.subtitle; box.appendChild(sub);
  const msg=document.createElement('p'); msg.textContent=pick(S.bare,LANG); box.appendChild(msg);

  function numRow(id,label,hint,min,max,step){
    const lab=document.createElement('label'); lab.htmlFor=id; lab.textContent=plain(label);
    box.appendChild(lab);
    const inp=document.createElement('input');
    inp.type='number'; inp.id=id; inp.min=min; inp.max=max; inp.step=step;
    box.appendChild(inp);
    const h=document.createElement('div'); h.textContent=plain(hint); box.appendChild(h);
    return inp;
  }
  const inRho=numRow('rho', l.ctrlRhoLabel, l.ctrlRhoHintPlain, RHO_MIN, RHO_MAX, RHO_STEP);
  const inLam=numRow('lam', l.ctrlLamLabel+' (µs)', l.ctrlLamHintPlain, 10, 1000, 1);
  const cvN=document.createElement('canvas'); cvN.width=920; cvN.height=340; box.appendChild(cvN);
  const dl=document.createElement('dl'); box.appendChild(dl);
  const cvI=document.createElement('canvas'); cvI.width=920; cvI.height=300; box.appendChild(cvI);
  const flag=document.createElement('p'); box.appendChild(flag);
  const note=document.createElement('p'); note.innerHTML=l.note; box.appendChild(note);

  bareRender=function(){
    LAST=solve(state);
    inRho.value=String(state.rho);
    inLam.value=String(Math.pow(10,state.lam)*1e6);
    const T=LAST.T, doubleT=isFinite(T)?Math.abs(T)*Math.LN2:NaN;
    let periodStr, doubleStr;
    if(LAST.promptCrit){ periodStr=fmtT(T)+" "+l.vPrompt; doubleStr=isFinite(doubleT)?fmtT(doubleT):"—"; }
    else if(T>0){ periodStr=fmtT(T); doubleStr=fmtT(doubleT); }
    else if(isFinite(T)){ periodStr=fmtT(T)+" "+l.vDecay; doubleStr=fmtT(Math.abs(doubleT))+" "+l.vHalve; }
    else { periodStr=l.vCritical; doubleStr="—"; }
    const pjStr=(LAST.rho<beta)? LAST.promptJump.toFixed(3)+"×" : l.vDiverges;
    dl.innerHTML=[
      [l.rdReactivity, "$"+LAST.rhoDollar.toFixed(3)+"  ("+(LAST.rho*1e5).toFixed(0)+" pcm)"],
      [l.rdPeriod, periodStr],
      [l.rdDouble, doubleStr],
      [l.rdPromptJump, pjStr],
      [l.rdBeta, (beta*1e5).toFixed(0)+" pcm"]
    ].map(function(r){ return '<dt>'+esc(plain(r[0]))+'</dt><dd>'+esc(r[1])+'</dd>'; }).join('');
    flag.textContent = LAST.promptCrit ? l.flagCrit : (LAST.rhoDollar>0.8 ? l.flagApproach : '');
    const cN=cvN.getContext('2d'); cN.setTransform(1,0,0,1,0,0);
    drawN(cN,920,340,'fine',LAST,LANG);
    const cI=cvI.getContext('2d'); cI.setTransform(1,0,0,1,0,0);
    drawInhour(cI,920,300,'fine',LAST,LANG);
  };
  inRho.addEventListener('input',function(){
    const v=Number(inRho.value);
    if(isFinite(v)){ state.rho=Math.max(RHO_MIN,Math.min(RHO_MAX,v)); bareRender(); }
  });
  inLam.addEventListener('input',function(){
    const v=Number(inLam.value);
    if(isFinite(v)&&v>0){ state.lam=Math.log10(Math.max(10,Math.min(1000,v))*1e-6); bareRender(); }
  });
  /* the safe-area repair of UI spec 4.4 lives in the file that is missing, so
     the tool reserves the shared chrome's own space itself */
  const reserve=function(){
    const bar=document.getElementById('dgc-bar'), badge=document.getElementById('eng-disc-badge');
    const hb=bar?bar.getBoundingClientRect().height:0, hg=badge?badge.getBoundingClientRect().height:0;
    const h=Math.max(hb,hg);
    document.body.style.paddingBottom = h ? (Math.round(h)+24)+'px' : '';
  };
  setTimeout(reserve,300); setTimeout(reserve,1500);
  window.addEventListener('resize',reserve);
  bareRender();
}

const PY_KIN=`BETA_I = [0.000215, 0.001424, 0.001274, 0.002568, 0.000748, 0.000273]   # U-235 thermal
LAMBDA_I = [0.0124, 0.0305, 0.1110, 0.3010, 1.1400, 3.0100]            # 1/s
BETA = sum(BETA_I)                                                     # 0.006502


def inhour(omega, gen_time):
    """Left-hand side of the inhour equation at omega."""
    s = omega * gen_time
    for b, l in zip(BETA_I, LAMBDA_I):
        s += b * omega / (omega + l)
    return s


def find_omega(rho, gen_time):
    """Dominant (stable-period) root of the inhour equation."""
    if abs(rho) < 1e-14:
        return 0.0
    lam_min = min(LAMBDA_I)

    def f(w):
        return inhour(w, gen_time) - rho

    if rho > 0:
        lo, hi = 1e-12, 1.0
        while f(hi) < 0 and hi < 1e12:
            hi *= 10
    else:
        lo, hi = -lam_min + 1e-9, -1e-12
    flo = f(lo)
    a, b = lo, hi
    for _ in range(200):
        m = 0.5 * (a + b)
        fm = f(m)
        if fm == 0:
            return m
        if (fm < 0) == (flo < 0):
            a, flo = m, fm
        else:
            b = m
        if abs(b - a) < 1e-15 * max(1.0, abs(a)):
            break
    return 0.5 * (a + b)


def inhour_roots(rho, gen_time):
    """All seven roots: one per interval between the delayed-group poles."""
    def fun(s):
        v = s * gen_time - rho
        for b, l in zip(BETA_I, LAMBDA_I):
            v += b * s / (s + l)
        return v

    def bis(a, b):
        fa = fun(a)
        for _ in range(300):
            m = 0.5 * (a + b)
            fm = fun(m)
            if fm == 0:
                return m
            if (fm < 0) == (fa < 0):
                a, fa = m, fm
            else:
                b = m
            if abs(b - a) <= 1e-16 * (abs(a) + abs(b)):
                break
        return 0.5 * (a + b)

    def near(pole, side, scale):
        d = abs(scale)
        for _ in range(80):
            s = pole + side * d
            if (fun(s) < 0) if side > 0 else (fun(s) > 0):
                return s
            d *= 0.1
        return pole + side * 1e-14 * max(1.0, abs(pole))

    roots = []
    if rho == 0:
        roots.append(0.0)
    else:
        lo = near(-LAMBDA_I[0], +1, LAMBDA_I[0] * 0.5)
        if rho > 0:
            hi = 1e-9
            while fun(hi) < 0 and hi < 1e14:
                hi *= 10
        else:
            hi = 0.0
        roots.append(bis(lo, hi))
    for j in range(1, 6):
        g = (LAMBDA_I[j] - LAMBDA_I[j - 1]) * 0.5
        roots.append(bis(near(-LAMBDA_I[j], +1, g), near(-LAMBDA_I[j - 1], -1, g)))
    lo = -LAMBDA_I[5] * 2 - 1
    while fun(lo) > 0 and lo > -1e15:
        lo *= 10
    roots.append(bis(lo, near(-LAMBDA_I[5], -1, LAMBDA_I[5] * 0.5)))
    return roots


def modal_amplitudes(roots, gen_time):
    """a_k of the exact seven-mode solution n(t) = sum a_k exp(w_k t)."""
    out = []
    for wk in roots:
        num = den = gen_time
        for b, l in zip(BETA_I, LAMBDA_I):
            d = wk + l
            num += b / d
            den += b * l / (d * d)
        out.append(num / den)
    return out


def power(t, roots, amps):
    s = 0.0
    for w, a in zip(roots, amps):
        e = w * t
        if e > -745:
            s += a * math.exp(e)
    return s


def compute():
    rho = REACTIVITY
    gen_time = GENERATION_TIME
    omega = find_omega(rho, gen_time)
    period = 1.0 / omega if omega != 0 else None
    roots = inhour_roots(rho, gen_time)
    out = {"omega": omega,
           "stable_period": period,
           "doubling_or_halving_time": abs(period) * math.log(2.0) if period is not None else None,
           "prompt_jump": BETA / (BETA - rho) if rho < BETA else None,
           "beta_effective": BETA,
           "reactivity_pcm": rho * 1e5}
    for i, w in enumerate(roots):
        out["inhour_root_%d" % (i + 1)] = w
    return out`;
