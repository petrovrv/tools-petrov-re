    if (r.warnings && r.warnings.length) { for (i = 0; i < r.warnings.length; i++) { w = r.warnings[i]; notes.push(trW(w)); } }
    return { verdict: { tone: r.verdict === 'ok' ? 'ok' : 'warn', text: text }, tiles: tiles, meters: meters, tables: tables, notes: notes };
  }

  function degrade() {
    document.title = 'diagram-ui.js v1 is required';
    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1');
    h.textContent = 'LH2 Boil-off';
    var p = document.createElement('p');
    p.textContent = 'The interactive interface could not load. The export, the calculation record '
                  + 'and the limitations are still available from the bar at the bottom of the page.';
    host.appendChild(h);
    host.appendChild(p);
    last = solve(state);
  }

  function boot() {
    if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1') buildInterface();
    else degrade();
    installData();
  }

          'Regardez la perte : liquéfié sans catalyseur ortho-para (25 % para), la chaleur de conversion démarre à 7,9 kW - 76 fois l\'entrée de chaleur - et évapore 72 % du même réservoir en 30 jours.',
          'Fíjese en la pérdida: licuado sin catalizador orto-para (25 % para), el calor de conversión empieza en 7,9 kW, 76 veces la entrada de calor, y evapora el 72 % del mismo tanque en 30 días.',
          'Spójrz na stratę: skroplony bez katalizatora orto-para (25 % para) wodór wydziela na starcie 7,9 kW ciepła konwersji - 76 razy więcej niż dopływ ciepła - i odparowuje 72 % tego samego zbiornika w 30 dni.'),
        apply: function (t) { setEx(t, 'normal_fill'); } },
      { id: 'large_sphere', label: T('Large 4700 m³ sphere', 'Велика сфера 4700 м³', 'Große Kugel 4700 m³', 'Grote bol 4700 m³', 'Grande sphère 4700 m³', 'Esfera grande de 4700 m³', 'Duża kula 4700 m³'),
        note: T('Look at the breakdown: in a launch-site 4700 m³ sphere the heat leak gives only 0.013 %/day, so the last 5 % of ortho hydrogen (1.65 kW at the start) causes 89 % of the boil-off - the better the tank, the more the para purity of the fill matters.',
          'Подивіться на розбивку: у сфері 4700 м³ космодрому теплоприток дає лише 0,013 %/добу, тож останні 5 % орто-водню (1,65 кВт на старті) спричиняють 89 % випаровування — що кращий резервуар, то важливіша чистота пара-водню при заповненні.',
          'Achten Sie auf die Aufteilung: in einer 4700-m³-Kugel am Startplatz bringt der Wärmeeintrag nur 0,013 %/Tag, daher verursachen die letzten 5 % Ortho-Wasserstoff (1,65 kW zu Beginn) 89 % der Verdampfung - je besser der Tank, desto mehr zählt die Para-Reinheit der Füllung.',
          'Kijk naar de opsplitsing: in een bol van 4700 m³ op een lanceerbasis geeft de warmte-instroom maar 0,013 %/dag, dus de laatste 5 % ortho-waterstof (1,65 kW bij de start) veroorzaakt 89 % van de boil-off - hoe beter de tank, hoe meer de para-zuiverheid van de vulling telt.',
          'Regardez la décomposition : dans une sphère de 4700 m³ de pas de tir, l\'entrée de chaleur ne donne que 0,013 %/jour, donc les derniers 5 % d\'ortho-hydrogène (1,65 kW au départ) causent 89 % de l\'évaporation - meilleur est le réservoir, plus la pureté para du remplissage compte.',
          'Fíjese en el desglose: en una esfera de 4700 m³ de una base de lanzamiento la entrada de calor da solo 0,013 %/día, así que el último 5 % de orto-hidrógeno (1,65 kW al inicio) causa el 89 % de la evaporación: cuanto mejor es el tanque, más importa la pureza para del llenado.',
          'Spójrz na rozbicie: w kuli 4700 m³ na kosmodromie dopływ ciepła daje tylko 0,013 %/dobę, więc ostatnie 5 % orto-wodoru (1,65 kW na starcie) powoduje 89 % odparowania - im lepszy zbiornik, tym ważniejsza czystość para napełnienia.'),
        apply: function (t) { setEx(t, 'large_sphere'); } },
      { id: 'small_dewar', label: T('Small 1 m³ tank, same insulation', 'Малий резервуар 1 м³, та сама ізоляція', 'Kleiner 1-m³-Tank, gleiche Isolierung', 'Kleine tank van 1 m³, zelfde isolatie', 'Petit réservoir de 1 m³, même isolation', 'Tanque pequeño de 1 m³, mismo aislamiento', 'Mały zbiornik 1 m³, ta sama izolacja'),
        note: T('Look at the boil-off rate: the same 1 W/m² insulation on a 1 m³ tank gives 1.6 %/day instead of 0.43 %/day, because its surface per litre is 4.6 times larger; 47 % is lost in 30 days.',
          'Подивіться на швидкість випаровування: та сама ізоляція 1 Вт/м² на резервуарі 1 м³ дає 1,6 %/добу замість 0,43 %/добу, бо його поверхня на літр у 4,6 раза більша; за 30 діб втрачається 47 %.',
          'Achten Sie auf die Verdampfungsrate: dieselbe Isolierung mit 1 W/m² an einem 1-m³-Tank ergibt 1,6 %/Tag statt 0,43 %/Tag, weil seine Oberfläche je Liter 4,6-mal größer ist; in 30 Tagen gehen 47 % verloren.',
          'Kijk naar de boil-off: dezelfde isolatie van 1 W/m² op een tank van 1 m³ geeft 1,6 %/dag in plaats van 0,43 %/dag, omdat het oppervlak per liter 4,6 keer groter is; in 30 dagen gaat 47 % verloren.',
          'Regardez le taux d\'évaporation : la même isolation de 1 W/m² sur un réservoir de 1 m³ donne 1,6 %/jour au lieu de 0,43 %/jour, car sa surface par litre est 4,6 fois plus grande ; 47 % sont perdus en 30 jours.',
          'Fíjese en la tasa de evaporación: el mismo aislamiento de 1 W/m² en un tanque de 1 m³ da 1,6 %/día en lugar de 0,43 %/día, porque su superficie por litro es 4,6 veces mayor; en 30 días se pierde el 47 %.',
          'Spójrz na szybkość odparowania: ta sama izolacja 1 W/m² na zbiorniku 1 m³ daje 1,6 %/dobę zamiast 0,43 %/dobę, bo jego powierzchnia na litr jest 4,6 razy większa; w 30 dni traci się 47 %.'),
        apply: function (t) { setEx(t, 'default'); (t || state).V = 1; } },
      { id: 'trailer', label: T('Road trailer 50 m³', 'Автоцистерна 50 м³', 'Straßentrailer 50 m³', 'Wegtrailer 50 m³', 'Semi-remorque 50 m³', 'Cisterna de carretera 50 m³', 'Naczepa drogowa 50 m³'),
        note: T('Look at the heat leak: with 3 W/m² of road-trailer insulation the 50 m³ cylinder at 3 bar boils off 1.9 %/day and loses 19 % of its load in 10 days; at 3 bar the liquid is also lighter (65 instead of 70 kg/m³).',
          'Подивіться на теплоприток: з ізоляцією автоцистерни 3 Вт/м² циліндр 50 м³ при 3 бар випаровує 1,9 %/добу і за 10 діб втрачає 19 % вантажу; при 3 бар рідина ще й легша (65 замість 70 кг/м³).',
          'Achten Sie auf den Wärmeeintrag: mit 3 W/m² Trailer-Isolierung verdampft der 50-m³-Zylinder bei 3 bar 1,9 %/Tag und verliert in 10 Tagen 19 % der Ladung; bei 3 bar ist die Flüssigkeit zudem leichter (65 statt 70 kg/m³).',
          'Kijk naar de warmte-instroom: met 3 W/m² trailerisolatie verdampt de cilinder van 50 m³ op 3 bar 1,9 %/dag en verliest in 10 dagen 19 % van de lading; op 3 bar is de vloeistof ook lichter (65 in plaats van 70 kg/m³).',
          'Regardez l\'entrée de chaleur : avec 3 W/m² d\'isolation de semi-remorque, le cylindre de 50 m³ à 3 bar évapore 1,9 %/jour et perd 19 % de son chargement en 10 jours ; à 3 bar le liquide est aussi plus léger (65 au lieu de 70 kg/m³).',
          'Fíjese en la entrada de calor: con 3 W/m² de aislamiento de cisterna, el cilindro de 50 m³ a 3 bar evapora 1,9 %/día y pierde el 19 % de la carga en 10 días; a 3 bar el líquido además es más ligero (65 en lugar de 70 kg/m³).',
          'Spójrz na dopływ ciepła: przy izolacji naczepy 3 W/m² walec 50 m³ pod 3 bar odparowuje 1,9 %/dobę i traci 19 % ładunku w 10 dni; przy 3 bar ciecz jest też lżejsza (65 zamiast 70 kg/m³).'),
        apply: function (t) { setEx(t, 'trailer'); } }
    ];
    function setEx(t, id) {
      var s = t || state, e = engine(), i, k, p = null;
      if (e && e.presets) for (i = 0; i < e.presets.length; i++) if (e.presets[i].id === id) p = e.presets[i].values;
      if (!p) return;
      for (k in p) if (Object.prototype.hasOwnProperty.call(p, k)) s[k] = p[k];
      s.level = 'simple';
    }
    ui.examples(EX);

    ui.stage({
      caption: T('Liquid inventory and para fraction over the storage period', 'Запас рідини й частка пара-водню протягом зберігання', 'Flüssiginventar und Para-Anteil über die Lagerdauer', 'Vloeistofinventaris en para-fractie over de opslagduur', 'Inventaire liquide et fraction para sur la durée de stockage', 'Inventario líquido y fracción para durante el almacenamiento', 'Zapas cieczy i udział para w okresie przechowywania'),
      minHeight: 280,
      a11y: function () {
        if (!last || !last.ok) return TL(NORES);
        return TL(TF(T('Liquid inventory falls from $1 kg to $2 kg; para fraction rises to $3.', 'Запас рідини зменшується з $1 кг до $2 кг; частка пара-водню зростає до $3.', 'Flüssigkeitsinventar sinkt von $1 kg auf $2 kg; Para-Anteil steigt auf $3.', 'Vloeistofvoorraad daalt van $1 kg naar $2 kg; para-fractie stijgt tot $3.', 'L\'inventaire liquide passe de $1 kg à $2 kg ; la fraction para monte à $3.', 'El inventario de líquido baja de $1 kg a $2 kg; la fracción para sube a $3.', 'Zapas cieczy spada z $1 kg do $2 kg; udział para rośnie do $3.'), [DiagramUI.fmt(last.m0_kg, { precision: 0 }), DiagramUI.fmt(last.m_end_kg, { precision: 0 }), DiagramUI.fmt(last.xp_end, { precision: 3 })]));
      },
      render: function (size, st) {
        var ctx = st.canvas(), w = size.w, h = size.h, coarse = size.density === 'coarse';
        var cs = getComputedStyle(document.documentElement);
        var muted = cs.getPropertyValue('--muted').trim() || '#888', line = cs.getPropertyValue('--line').trim() || '#ccc', font = cs.getPropertyValue('--font').trim() || 'sans-serif';
        ctx.clearRect(0, 0, w, h);
        if (!last || !last.ok || !last.curve || last.curve.length < 2) return;
        var Cv = last.curve, k, x1 = Cv[Cv.length - 1].t / 24, y1 = 100;
        var y0 = Math.max(0, Math.floor((last.m_end_kg / last.m0_kg * 100 - 5) / 10) * 10);
        var L = coarse ? 40 : 50, RR = coarse ? 40 : 50, TOP = 12, B = coarse ? 36 : 44, pw = w - L - RR, ph = h - TOP - B;
        if (pw <= 10 || ph <= 10) return;
        function X(v) { return L + v / x1 * pw; }
        function Y(v) { return TOP + ph - (v - y0) / (y1 - y0) * ph; }
        function Y2(v) { return TOP + ph - (v - 0.25) / 0.75 * ph; }
        ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.beginPath();
        ctx.moveTo(L, TOP); ctx.lineTo(L, TOP + ph); ctx.lineTo(L + pw, TOP + ph); ctx.lineTo(L + pw, TOP); ctx.stroke();
        ctx.fillStyle = muted; ctx.font = (coarse ? 10 : 11) + 'px ' + font;
        var xt = DiagramUI.ticks(0, x1, pw, size.density), yt = DiagramUI.ticks(y0, y1, ph, size.density), y2t = [0.25, 0.5, 0.75, 1];
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        for (k = 0; k < xt.length; k++) { if (xt[k] < 0 || xt[k] > x1) continue; ctx.fillText(DiagramUI.fmt(xt[k], { precision: 0 }), X(xt[k]), TOP + ph + 6); }
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        for (k = 0; k < yt.length; k++) { if (yt[k] < y0 || yt[k] > y1) continue; ctx.fillText(DiagramUI.fmt(yt[k], { precision: 0 }), L - 6, Y(yt[k])); }
        ctx.textAlign = 'left';
        for (k = 0; k < y2t.length; k++) ctx.fillText(DiagramUI.fmt(y2t[k], { precision: 2 }), L + pw + 6, Y2(y2t[k]));
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText('t, d', L + pw / 2, h - 2);
        ctx.save(); ctx.translate(11, TOP + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textBaseline = 'middle'; ctx.fillText('m / m0, %', 0, 0); ctx.restore();
        ctx.save(); ctx.translate(w - 8, TOP + ph / 2); ctx.rotate(Math.PI / 2); ctx.textBaseline = 'middle'; ctx.fillText('x_para', 0, 0); ctx.restore();
        ctx.save(); ctx.beginPath(); ctx.rect(L, TOP, pw, ph); ctx.clip();
        ctx.strokeStyle = DiagramUI.series(0); ctx.lineWidth = 2; ctx.beginPath();
        for (k = 0; k < Cv.length; k++) { var px = X(Cv[k].t / 24), py = Y(Cv[k].m / last.m0_kg * 100); if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
        ctx.stroke();
        ctx.strokeStyle = DiagramUI.series(1); ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]); ctx.beginPath();
        for (k = 0; k < Cv.length; k++) { var qx = X(Cv[k].t / 24), qy = Y2(1 - Cv[k].xo); if (k === 0) ctx.moveTo(qx, qy); else ctx.lineTo(qx, qy); }
        ctx.stroke(); ctx.setLineDash([]);
        ctx.restore();
      }
    });
    adoptStage(ui);

    ui.ready();
    window['__lh2_boiloff'] = { ui: ui, state: state, solve: solve, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function isPosNum(v) {
    return typeof v === 'number' && isFinite(v) && v > 0;
  }

  function buildRecord() {
    if (!last) return null;
    var inKeys = ['level', 'V', 'fill', 'p', 'shape', 'q', 'xp0', 'k', 't_store'],
        outKeys = ['T_sat', 'rho_l', 'rho_v', 'h_fg', 'A', 'Q_leak', 'm0_kg', 'dH_op', 'bor_leak_pct_d', 'bor_conv_pct_d', 'bor_total_pct_d', 'm_end_kg', 'lost_kg', 'lost_pct',
                   'lost_conv_only_kg', 'xp_end', 'E_lost_MWh', 'basis', 'verdict'],
        inputs = {}, outputs = {}, units = {}, warnings = [], i, k;
    var UNIT = {
      level: '-', V: 'm3', fill: '-', p: 'Pa', shape: '-', q: 'W/m2', xp0: '-', k: '1/h', t_store: 'd', T_sat: 'K', rho_l: 'kg/m3', rho_v: 'kg/m3', h_fg: 'J/kg',
      A: 'm2', Q_leak: 'W', m0_kg: 'kg', dH_op: 'J/kg ortho', bor_leak_pct_d: '%/d', bor_conv_pct_d: '%/d', bor_total_pct_d: '%/d', m_end_kg: 'kg', lost_kg: 'kg',
      lost_pct: '%', lost_conv_only_kg: 'kg', xp_end: '-', E_lost_MWh: 'MWh (LHV)', basis: '-', verdict: '-'
    };
    for (i = 0; i < inKeys.length; i++) { k = inKeys[i]; inputs[k] = state[k]; units[k] = UNIT[k]; }
    if (last.ok) {
      for (i = 0; i < outKeys.length; i++) { k = outKeys[i]; outputs[k] = last[k]; units[k] = UNIT[k]; }
      warnings = (last.warnings || []).slice();
    } else {
      warnings = [last.error];
    }
    return {
      inputs: inputs, outputs: outputs, units: units,
      model: {
        equations: [
          'dm/dt = -(Q_leak + m dH_op k x_o^2)/h_fg (vented tank at constant pressure)',
          'x_o(t) = x_o0/(1 + k x_o0 t); dH_op = 2 theta R/M, theta = 85.25 K',
          'Q_leak = q A; sphere A = pi^(1/3) (6V)^(2/3); cylinder L = 3D',
          'saturated para-H2 rho_l, h_fg at p from a CoolProp 8 (Leachman 2009) table, linear interpolation'
        ],
        ranges: ['p 1-10 bar', 'para fraction 0.25-1', 'storage up to 365 d'],
        notes: ['Vapour inventory and ullage growth neglected', 'No thermal stratification or pressure build-up (tank vents at p)', 'Catalysed conversion in the tank not modelled']
      },
      warnings: warnings
    };
  }

  function hoRow(o) { var r = {}, k; for (k in o) if (typeof o[k][0] === 'number' && isFinite(o[k][0])) r[k] = { value: o[k][0], unit: o[k][1] }; return r; }

  var HANDOFF = {
    provides: ['p', 'T'],
    accepts: [],
    build: function () {
      if (!last || !last.ok) return null;
      return {
        quantities: { p: { value: state.p, unit: 'Pa' }, T: { value: last.T_sat, unit: 'K' } },
        sets: { storage: [hoRow({ T_sat: [last.T_sat, 'K'], p: [state.p, 'Pa'] })], composition: [hoRow({ h2: [1, '-'] })] }
      };
    },
    apply: function () {}
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'lh2_boiloff',
        file: 'lh2_boiloff.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
