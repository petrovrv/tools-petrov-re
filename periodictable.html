function showAllo(e,i){const a=e.allotropes[i];
  cardPane.querySelector('#alloContent').innerHTML=`<div class="dgu-tiles">${P(t('p_density'),a.density||'—','g/cm³')}</div><div class="pt-meta">${a.note[LG()]||a.note.en}</div>`;}
/* Aufbau filling order (Madelung) */
const AUF=[[1,'s'],[2,'s'],[2,'p'],[3,'s'],[3,'p'],[4,'s'],[3,'d'],[4,'p'],[5,'s'],[4,'d'],[5,'p'],[6,'s'],[4,'f'],[5,'d'],[6,'p'],[7,'s'],[5,'f'],[6,'d'],[7,'p']];
const LCAP={s:2,p:6,d:10,f:14},LBOX={s:1,p:3,d:5,f:7};
function fullSubshells(z){let rem=z;const out=[];for(const[n,l]of AUF){if(rem<=0)break;const e=Math.min(LCAP[l],rem);rem-=e;out.push({n,l,e});}return out;}
function drawEnergy(e){const cv=cardPane.querySelector('#energyDiag');if(!cv)return;
  const subs=fullSubshells(e.z);const rows=subs.length;const rowH=22,padT=14,padB=10,labW=52,boxW=15,boxG=3;
  const dpr=devicePixelRatio||1,W=cv.clientWidth||600,H=rows*rowH+padT+padB;
  cv.style.height=H+'px';cv.width=W*dpr;cv.height=H*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
  ctx.font='400 11px '+tok('--font','sans-serif');ctx.textBaseline='middle';
  const col=CAT_COLORS[e.cat];
  subs.forEach((sh,i)=>{const y=H-padB-i*rowH-rowH/2; // bottom = 1s (lowest energy)
    ctx.fillStyle=tok('--muted','#777');ctx.textAlign='right';ctx.fillText(sh.n+sh.l,labW-8,y);
    const nbox=LBOX[sh.l];let x=labW;
    for(let b=0;b<nbox;b++){
      ctx.strokeStyle=tok('--line','#ddd');ctx.lineWidth=1;ctx.strokeRect(x,y-boxW/2,boxW,boxW);
      x+=boxW+boxG;
    }
    // Hund filling: one electron per box first, then pair
    const arr=new Array(nbox).fill(0);let ee=sh.e;
    for(let b=0;b<nbox&&ee>0;b++){arr[b]=1;ee--;}for(let b=0;b<nbox&&ee>0;b++){arr[b]=2;ee--;}
    x=labW;
    for(let b=0;b<nbox;b++){const cx=x+boxW/2;
      if(arr[b]>=1){ctx.strokeStyle=col;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(cx-3,y+4);ctx.lineTo(cx-3,y-4);ctx.moveTo(cx-3,y-4);ctx.lineTo(cx-5,y-1);ctx.moveTo(cx-3,y-4);ctx.lineTo(cx-1,y-1);ctx.stroke();}
      if(arr[b]>=2){ctx.strokeStyle=col;ctx.beginPath();ctx.moveTo(cx+3,y-4);ctx.lineTo(cx+3,y+4);ctx.moveTo(cx+3,y+4);ctx.lineTo(cx+1,y+1);ctx.moveTo(cx+3,y+4);ctx.lineTo(cx+5,y+1);ctx.stroke();}
      x+=boxW+boxG;}
    ctx.fillStyle=tok('--muted','#777');ctx.textAlign='left';ctx.fillText(sh.e+' e⁻',x+6,y);
  });}
function drawOrbital(o,e){const cv=cardPane.querySelector('#orbShape');if(!cv)return;const dpr=devicePixelRatio||1,W=cv.clientWidth,H=220;
  if(!W)return;cv.width=W*dpr;cv.height=H*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
  const cx=W/2,cy=H/2,col=CAT_COLORS[e.cat];ctx.save();ctx.translate(cx,cy);const R=Math.min(W,H)/2-24;
  function lobe(angle,rx,ry){ctx.save();ctx.rotate(angle);const g=ctx.createRadialGradient(0,-ry*0.4,2,0,-ry*0.5,ry);g.addColorStop(0,col+'ee');g.addColorStop(1,col+'22');ctx.fillStyle=g;ctx.strokeStyle=col+'99';ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(0,-ry*0.5,rx,ry*0.5,0,0,7);ctx.fill();ctx.stroke();ctx.restore();}
  if(o.l==='s'){const g=ctx.createRadialGradient(0,0,2,0,0,R);g.addColorStop(0,col+'ee');g.addColorStop(.7,col+'55');g.addColorStop(1,col+'10');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();ctx.strokeStyle=col+'88';ctx.stroke();}
  else if(o.l==='p'){lobe(0,R*0.32,R);lobe(Math.PI,R*0.32,R);}
  else if(o.l==='d'){for(let k=0;k<4;k++)lobe(Math.PI/4+k*Math.PI/2,R*0.26,R*0.8);}
  else{for(let k=0;k<6;k++)lobe(k*Math.PI/3,R*0.2,R*0.78);}
  ctx.beginPath();ctx.arc(0,0,4,0,7);ctx.fillStyle=tok('--panel','#fff');ctx.fill();ctx.restore();
  const cap={s:2,p:6,d:10,f:14}[o.l];const desc=t('orb_'+o.l);
  cardPane.querySelector('#orbMeta').innerHTML=`<b>${o.n}${o.l}</b> · ${o.e}/${cap} e⁻<br>${desc}`;}

/* ============================================ the seventh language, kept
   diagram-ui.js refuses any language outside the six site languages, so the
   page repairs setLang() locally for its own instance.  This belongs upstream:
   the framework already reads the option list from manifest.tool_languages, so
   it should accept what it offers. */
function patchLang(a){
  const P=Object.getPrototypeOf(a);
  if(P.__ptLangPatched)return;
  P.__ptLangPatched=true;
  const orig=P.setLang;
  P.setLang=function(l){
    if(LANGS.indexOf(l)<0)return this.lang;
    this.state.lang=l;
    if(SITE_LANGS.indexOf(l)>=0)return orig.call(this,l);
    this.lang=l;
    try{const u=new URL(location.href);u.searchParams.set('lang',l);history.replaceState(null,'',u);}catch(e){}
    if(window.Diagram){
      if(typeof Diagram.setDocumentLang==='function')Diagram.setDocumentLang(l);
      if(typeof Diagram.setLang==='function')Diagram.setLang(l);
    }else if(document.documentElement.lang!==l)document.documentElement.lang=l;
    this.rebuild();
    return l;
  };
}
/* native names for the seventh language, and a translated "Tools" link:
   both are framework gaps repaired locally. */
function dressHeader(a){
  if(!a.head)return;
  a.head.querySelectorAll('select.dgu-sel').forEach(sel=>{
    const opts=[...sel.options];
    if(!opts.some(o=>o.value==='ru'||o.value==='uk'))return;
    opts.forEach(o=>{if(I18N.lang_name[o.value])o.textContent=I18N.lang_name[o.value];});
    sel.value=a.lang;
  });
  const home=a.head.querySelector('.dgu-home');
  if(home)home.textContent='← '+a.t('menu');
  if(document.documentElement.lang!==a.lang)document.documentElement.lang=a.lang;
}

/* =================================================================== boot */
function bootFramework(){
  app=DiagramUI.app({
    id:'periodictable',mount:'#app',layout:'reference',compute:'live',
    lang:state.lang,state:state,strings:UI7,
    /* the manifest title has no ru; the tool's own dictionary does, and dropping
       the Russian title would be a capability loss for the seventh language */
    title:TT('app_title'),
    defaults:function(){return {v:1,lang:S().lang,color:'cat',view:'std',q:'',filter:null,z:null}},
    subtitle:TT('app_sub'),
    learn:learnDef(),
    regions:{
      nav:function(host,a){buildNav(a,host)},
      stage:function(host,a){buildStage(a,host)},
      results:function(host,a){buildResults(a,host)}
    },
    footer:function(host){buildFooter(host)},
    shortcuts:[
      {keys:'escape',label:TT('card_close'),run:function(){
        if(document.querySelector('.dgu-pop,.dgu-tour')||document.querySelector('dialog[open]'))return;
        if(S().z!=null)clearSelection();}},
      {keys:'arrowleft',label:TT('el_prev'),run:function(){stepElement(-1)}},
      {keys:'arrowright',label:TT('el_next'),run:function(){stepElement(1)}},
      {keys:'/',label:TT('search_label'),run:function(){openNav();const n=document.getElementById('f-q-c');if(n){n.focus();n.select&&n.select();}}}
    ],
    on:{
      compute:function(){renderAll();},
      reset:function(){legCount={};legLast=null;curTab='over';},
      ready:function(a){dressHeader(a);renderAll();}
    }
  });
  patchLang(app);
  app.ready();
  DiagramUI.theme.watch(function(){if(ptable){applyColors();renderPane();}});
}

/* ------------------------------------------------------ honest degradation
   With diagram-ui.js blocked at the network layer the tool still works: the
   same builders render into a plain shell, the language control is still here,
   and the data layer below is untouched. */

  const st=document.createElement('style');

    +'--fs-title:22px;--fs-section:13px;--fs-body:15px;--fs-label:13px;--fs-small:12px;--fs-micro:11px;'

    +'.pt-bare{max-width:1440px;margin:0 auto;padding:var(--sp-4)}'
    +'.pt-bare h1{font-size:var(--fs-title)}'
    +'.pt-bare section{margin:var(--sp-4) 0}'
    +'.dgu-tile,.dgu-empty{border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--sp-3);margin:var(--sp-2) 0}'
    +'.dgu-tiles{display:grid;gap:var(--sp-2);grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}'
    +'.dgu-table{border-collapse:collapse;width:100%;font-size:var(--fs-label)}'
    +'.dgu-table th,.dgu-table td{padding:6px var(--sp-2);border-bottom:1px solid var(--line);text-align:left}'
    +'.dgu-table-wrap{overflow-x:auto}'
    +'.dgu-btn,.dgu-chip{display:inline-block;border:1px solid var(--line);border-radius:var(--radius-sm);'
    +'background:var(--panel);color:var(--ink);padding:var(--sp-2) var(--sp-3);cursor:pointer;font:inherit;'

    +'.dgu-panel-t{font-size:var(--fs-section);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}'
    +'.dgu-verdict{border:1px solid var(--warn);border-radius:var(--radius-sm);padding:var(--sp-3);margin:var(--sp-2) 0}';
  document.head.appendChild(st);}

  const root=document.getElementById('app');
  root.className='pt-bare';
  const h1=elx('h1',null,t('app_title'));
  root.appendChild(h1);
  const ls=document.createElement('select');
  ls.setAttribute('aria-label',UI7.language[LG()]||UI7.language.en);
  LANGS.forEach(lg=>{const o=document.createElement('option');o.value=lg;o.textContent=I18N.lang_name[lg];if(lg===LG())o.selected=true;ls.appendChild(o);});
  ls.onchange=()=>{
    state.lang=ls.value;
    if(SITE_LANGS.includes(state.lang)){try{localStorage.setItem('diagram_lang',state.lang)}catch(e){}}
    try{const u=new URL(location.href);u.searchParams.set('lang',state.lang);history.replaceState(null,'',u)}catch(e){}
    if(window.Diagram&&Diagram.setLang)try{Diagram.setLang(state.lang)}catch(e){}
    document.documentElement.lang=state.lang;
    renderBare();
  };
  root.appendChild(ls);

  const nav=elx('section');root.appendChild(nav);
  filterStrip=elx('div','pt-filter');filterStrip.hidden=true;nav.appendChild(filterStrip);
  const mk=(labelText,ctl)=>{const l=document.createElement('label');l.style.display='block';
    l.appendChild(elx('span',null,labelText));l.appendChild(ctl);nav.appendChild(l);return ctl};
  const qi=document.createElement('input');qi.type='text';qi.value=state.q;qi.placeholder=t('search_ph');
  qi.oninput=()=>{state.q=qi.value;renderAll()};mk(t('search_label'),qi);
  const cs=document.createElement('select');

  legendBox=elx('div','pt-legend');scaleBox=elx('div','pt-scale');
  scaleMin=elx('span');grad=elx('div','pt-grad');scaleMax=elx('span');scaleUnit=elx('span');
  scaleBox.appendChild(scaleMin);scaleBox.appendChild(grad);scaleBox.appendChild(scaleMax);scaleBox.appendChild(scaleUnit);
  nav.appendChild(legendBox);nav.appendChild(scaleBox);scaleBox.hidden=true;

  const stg=elx('section');root.appendChild(stg);

function renderBare(){
  document.getElementById('app').innerHTML='';
  shown={};

}

/* ============================= framework v2 (diagram-common.js) — unchanged
   The permalink payload keeps its shape exactly: {v,lang,color,view,q,filter,z}. */
function dgcSerialize(){
  const s=S();
  return {v:1,lang:s.lang,color:s.color,view:s.view,q:s.q||'',
          filter:s.filter,z:(s.z!=null?s.z:null)};
}
function dgcDeserialize(st){
  if(!st||typeof st!=='object')throw new Error('unrecognised state payload for this tool');
  if(st.z!=null&&!BYZ[st.z])throw new Error('unknown atomic number '+st.z);
  const s=S();
  if(LANGS.includes(st.lang)){s.lang=st.lang;if(app)app.lang=st.lang;
    if(document.documentElement.lang!==st.lang)document.documentElement.lang=st.lang;}
  if(COLOR_MODES.some(m=>m.id===st.color))s.color=st.color;
  if(VIEWS.some(v=>v.id===st.view))s.view=st.view;
  s.q=st.q||'';
  if(st.filter&&st.filter.type)setFilter(st.filter.type,st.filter.value);
  else clearFilter();
  s.z=(st.z!=null?st.z:null);
  legCount={};legLast=null;curTab='over';shown={};
  if(app){app.rebuild();}else{renderBare();}
}
function dgcSelected(){const s=S();return s.z!=null?BYZ[s.z]:null}
function dgcRecord(){
  const e=dgcSelected();
  const shownIds=ELEMENTS.filter(filterVisible).map(x=>x.z);
  const inputs={language:LG(),colour_scale:S().color,layout:S().view,
    search:S().q||'',
    filter:S().filter?S().filter.type+' = '+S().filter.value:'none',
    elements_shown:shownIds.length,
    selected_element:e?(e.names.en+' ('+e.sym+', Z = '+e.z+')'):'none'};
  const outputs={},units={};
  if(e){
    outputs.symbol=e.sym;units.symbol='';
    outputs.atomic_number=e.z;units.atomic_number='';
    outputs.standard_atomic_weight=e.mass;units.standard_atomic_weight=e.mass_stable?'u (mass number of the longest-lived isotope)':'u';
    outputs.group=grpNum(e);units.group='';
    outputs.period=perNum(e);units.period='';
    outputs.block=e.block;units.block='';
    outputs.electron_configuration=e.config;units.electron_configuration='';
    outputs.shell_occupancy=e.shells.join(', ');units.shell_occupancy='electrons per shell';
    outputs.oxidation_states=e.oxi||'—';units.oxidation_states='';
    outputs.melting_point=e.melt;units.melting_point='K';
    outputs.boiling_point=e.boil;units.boiling_point='K';
    outputs.density=e.density;units.density='g/cm3';
    outputs.electronegativity_pauling=e.electroneg;units.electronegativity_pauling='-';
    outputs.first_ionisation_energy=e.ion1;units.first_ionisation_energy='kJ/mol';
    outputs.atomic_radius=e.radius;units.atomic_radius='pm';
    outputs.thermal_neutron_cross_section=e.nuclear&&e.nuclear.xsec_nat;units.thermal_neutron_cross_section='barn';
  }
  const warn=[];
  if(!e)warn.push('No element is open: the record describes the current view of the table only.');
  if(e&&e.mass_stable)warn.push('This element has no standard atomic weight; the figure is the mass number of its longest-lived isotope.');
  if(e&&e.melt!=null&&e.boil!=null&&e.melt>e.boil)warn.push('The melting point is quoted at elevated pressure: at 1 atm this element sublimes at the temperature listed as the boiling point.');
  if(e&&e.z>103)warn.push('Superheavy element: several properties are predicted rather than measured.');
  return {inputs,outputs,units,
    model:{equations:[
      'No calculation: every figure is a tabulated reference value.',
      'Group and period of the lanthanoids and actinoids are reported as 6 and 7 with block f, although the strip is drawn on two extra display rows.',
      'Temperatures are converted for display with T[C] = T[K] - 273.15.'],
     ranges:[
      'Standard atomic weights: CIAAW abridged values (2021 table with the 2024 revisions of Gd, Lu and Zr). Elements with no standard atomic weight carry the mass number of their longest-lived isotope.',
      'First ionisation energies: NIST Atomic Spectra Database.',
      'Electronegativity: Pauling scale in the revision tabulated by the CRC Handbook; other compilations publish Pauling original values, which differ for about a dozen heavy elements.',
      'Melting and boiling points are compiled values at 1 atm unless the element sublimes; published compilations differ by a few kelvin for several elements.'],
     notes:['This is a reference table for education and orientation, not a material specification or a safety datasheet.']},
    warnings:warn};
}
function dgcSections(){
  const e=dgcSelected();
  const out=[];
  if(e&&e.isotopes&&e.isotopes.length)
    out.push({title:'Isotopes',cols:'1fr 1fr 1.4fr 1fr',head:['A','abundance %','half-life','decay'],
      rows:e.isotopes.slice(0,12).map(i=>[String(i.m),i.ab==null?'—':String(i.ab),String(i.hl||'—'),String(i.d||'—')])});
  const shownEls=ELEMENTS.filter(filterVisible);
  if(shownEls.length<118)
    out.push({title:'Elements in the current selection',cols:'0.5fr 0.6fr 2fr 1fr',head:['Z','symbol','name','category'],
      rows:shownEls.map(x=>[String(x.z),x.sym,x.names.en,t('cat_'+x.cat)])});
  return out;
}

/* =================================================================== boot */
function boot(){
  if(window.DiagramUI&&DiagramUI.api==='tools.petrov.re/ui/v1')bootFramework();
  else bootBare();
  /* the data layer is independent of the screen layer: init is unconditional */
  if(window.Diagram){
    window.Diagram.init({
      id:'periodictable',file:'periodictable.html',
      state:{serialize:dgcSerialize,deserialize:dgcDeserialize},
      record:dgcRecord,
      handoff:{provides:[],accepts:[]},
      report:{sections:dgcSections}
    });
  }
  window.__periodictable={state:function(){return S()},app:function(){return app},record:dgcRecord};
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
