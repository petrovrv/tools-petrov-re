<script type="application/json" id="diagram-tool-manifest">{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision":"2026-10-16.periodictable-bench-rerun-1","id":"periodictable","file":"periodictable.html","listed":true,"category":"mat","order":21,"title":{"en":"Periodic Table","uk":"Періодична таблиця","de":"Periodensystem","nl":"Periodiek systeem","fr":"Tableau périodique","es":"Tabla periódica","pl":"Układ okresowy pierwiastków"},"summary":{"en":"Interactive periodic table reference — explore the elements and their properties.","uk":"Інтерактивна періодична таблиця — досліджуйте елементи та їхні властивості.","de":"Interaktives Periodensystem — Elemente und ihre Eigenschaften erkunden.","nl":"Interactief periodiek systeem — verken de elementen en hun eigenschappen.","fr":"Tableau périodique interactif — explorez les éléments et leurs propriétés.","es":"Tabla periódica interactiva — explore los elementos y sus propiedades.","pl":"Interaktywny układ okresowy — poznaj pierwiastki i ich właściwości."},"description":{"en":"Interactive periodic table reference — explore the elements and their properties.","uk":"Інтерактивна періодична таблиця — досліджуйте елементи та їхні властивості.","de":"Interaktives Periodensystem — Elemente und ihre Eigenschaften erkunden.","nl":"Interactief periodiek systeem — verken de elementen en hun eigenschappen.","fr":"Tableau périodique interactif — explorez les éléments et leurs propriétés.","es":"Tabla periódica interactiva — explore los elementos y sus propiedades.","pl":"Interaktywny układ okresowy — poznaj pierwiastki i ich właściwości."},"status":"benchmarked","independent_validation":false,"limitations":{"en":"Reference values are compiled and often rounded; values can depend on isotope, allotrope, temperature, pressure and source. Standard atomic weights are the CIAAW abridged values (2021 table with the 2024 revisions of Gd, Lu and Zr); elements without a standard atomic weight carry the mass number of their longest-lived isotope. First ionisation energies come from the NIST Atomic Spectra Database. Electronegativities are on the Pauling scale in the revision tabulated by the CRC Handbook, which differs from Pauling's original values for about a dozen heavy elements. Melting and boiling points are values at 1 atm unless the element sublimes - for arsenic the melting point applies at elevated pressure while at 1 atm it sublimes at the temperature shown as the boiling point. Superheavy elements carry predicted rather than measured properties. Do not treat the table as a material specification or safety datasheet.","uk":"Довідкові значення скомпільовані й часто округлені; вони залежать від ізотопу, алотропу, температури, тиску та джерела. Стандартні атомні маси - скорочені значення CIAAW (таблиця 2021 з ревізіями 2024 для Gd, Lu та Zr); для елементів без стандартної атомної маси наведено масове число найдовгоживучішого ізотопу. Перші енергії іонізації - з бази NIST ASD. Електронегативності подано за шкалою Полінга в редакції CRC Handbook, яка для десятка важких елементів відрізняється від оригінальних значень Полінга. Температури плавлення й кипіння наведено при 1 атм, якщо елемент не сублімує - для арсену температура плавлення стосується підвищеного тиску, а при 1 атм він сублімує при температурі, показаній як температура кипіння. Для надважких елементів властивості передбачені, а не виміряні. Не використовуйте таблицю як специфікацію матеріалу чи паспорт безпеки.","de":"Referenzwerte sind zusammengetragen und oft gerundet; sie hängen von Isotop, Allotrop, Temperatur, Druck und Quelle ab. Die Standardatomgewichte sind die abgekürzten CIAAW-Werte (Tabelle 2021 mit den Revisionen 2024 für Gd, Lu und Zr); Elemente ohne Standardatomgewicht tragen die Massenzahl ihres langlebigsten Isotops. Erste Ionisierungsenergien stammen aus der NIST Atomic Spectra Database. Elektronegativitäten folgen der Pauling-Skala in der Fassung des CRC Handbook, die für etwa ein Dutzend schwerer Elemente von Paulings Originalwerten abweicht. Schmelz- und Siedepunkte gelten bei 1 atm, sofern das Element nicht sublimiert - bei Arsen gilt der Schmelzpunkt bei erhöhtem Druck, während es bei 1 atm bei der als Siedepunkt angegebenen Temperatur sublimiert. Bei superschweren Elementen sind Eigenschaften vorhergesagt, nicht gemessen. Die Tabelle ist keine Werkstoffspezifikation und kein Sicherheitsdatenblatt.","nl":"Referentiewaarden zijn samengesteld en vaak afgerond; ze hangen af van isotoop, allotroop, temperatuur, druk en bron. De standaard atoommassa's zijn de verkorte CIAAW-waarden (tabel 2021 met de herzieningen van 2024 voor Gd, Lu en Zr); elementen zonder standaard atoommassa dragen het massagetal van hun langstlevende isotoop. Eerste ionisatie-energieën komen uit de NIST Atomic Spectra Database. Elektronegativiteiten staan op de Pauling-schaal in de bewerking van het CRC Handbook, die voor een tiental zware elementen afwijkt van Paulings oorspronkelijke waarden. Smelt- en kookpunten gelden bij 1 atm tenzij het element sublimeert - bij arseen geldt het smeltpunt bij verhoogde druk, terwijl het bij 1 atm sublimeert bij de temperatuur die als kookpunt staat. Superzware elementen dragen voorspelde in plaats van gemeten eigenschappen. Beschouw de tabel niet als materiaalspecificatie of veiligheidsinformatieblad.","fr":"Les valeurs de référence sont compilées et souvent arrondies ; elles dépendent de l'isotope, de l'allotrope, de la température, de la pression et de la source. Les masses atomiques standard sont les valeurs abrégées de la CIAAW (table 2021 avec les révisions 2024 de Gd, Lu et Zr) ; les éléments sans masse atomique standard portent le nombre de masse de leur isotope le plus stable. Les premières énergies d'ionisation proviennent de la NIST Atomic Spectra Database. Les électronégativités suivent l'échelle de Pauling dans la version du CRC Handbook, qui diffère des valeurs originales de Pauling pour une douzaine d'éléments lourds. Les points de fusion et d'ébullition valent à 1 atm sauf si l'élément se sublime - pour l'arsenic le point de fusion vaut sous pression élevée, alors qu'à 1 atm il se sublime à la température indiquée comme point d'ébullition. Les éléments superlourds portent des propriétés prédites et non mesurées. Cette table n'est ni une spécification matériau ni une fiche de sécurité.","es":"Los valores de referencia están compilados y a menudo redondeados; dependen del isótopo, el alótropo, la temperatura, la presión y la fuente. Los pesos atómicos estándar son los valores abreviados de la CIAAW (tabla de 2021 con las revisiones de 2024 de Gd, Lu y Zr); los elementos sin peso atómico estándar llevan el número másico de su isótopo más longevo. Las primeras energías de ionización proceden de la NIST Atomic Spectra Database. Las electronegatividades siguen la escala de Pauling en la versión del CRC Handbook, que difiere de los valores originales de Pauling para una docena de elementos pesados. Los puntos de fusión y ebullición son a 1 atm salvo que el elemento sublime - en el arsénico el punto de fusión corresponde a presión elevada, mientras que a 1 atm sublima a la temperatura mostrada como punto de ebullición. Los elementos superpesados llevan propiedades predichas, no medidas. No trate la tabla como especificación de material ni como ficha de seguridad.","pl":"Wartości odniesienia są kompilowane i często zaokrąglane; wartości mogą zależeć od izotopu, alotropu, temperatury, ciśnienia i źródła. Standardowe masy atomowe to skrócone wartości CIAAW (tabela z 2021 r. z rewizjami Gd, Lu i Zr z 2024 r.); pierwiastki bez standardowej masy atomowej mają liczbę masową swojego najdłużej żyjącego izotopu. Pierwsze energie jonizacji pochodzą z bazy danych widm atomowych NIST. Elektroujemności są podane w skali Paulinga w rewizji tabelarycznej CRC Handbook, która różni się od oryginalnych wartości Paulinga dla około tuzina ciężkich pierwiastków. Temperatury topnienia i wrzenia są wartościami przy 1 atm, chyba że pierwiastek sublimuje — w przypadku arsenu temperatura topnienia dotyczy podwyższonego ciśnienia, podczas gdy przy 1 atm sublimuje on w temperaturze pokazanej jako temperatura wrzenia. Pierwiastki superciężkie mają właściwości przewidywane, a nie mierzone. Nie należy traktować tabeli jako specyfikacji materiału ani karty charakterystyki bezpieczeństwa."},"intended_use":["education","technical exploration","preliminary assessment"],"catalog_languages":["en","uk","de","nl","fr","es","pl"],"tool_languages":["en","uk","de","nl","fr","es","ru","pl"],"dependencies":[],"network_access":{"mode":"none"},"validation":{"basis":{"en":"A data-integrity benchmark, not a physics one: 8 cases covering all 118 records. Standard atomic weights against the CIAAW abridged table (2021 with the 2024 Gd/Lu/Zr revisions), first ionisation energies against the NIST Atomic Spectra Database, and electron configurations, group, period, block, melting and boiling points against the mendeleev element-data library; grid placement, element cards, every filter facet and the search are recomputed from the records and compared with what the page renders. All 8 pass; 29 entries where two published compilations genuinely disagree are flagged with both values rather than graded. The harness is the author's own; no external party has reviewed it.","uk":"Це перевірка цілісності даних, а не фізики: 8 випадків, що охоплюють усі 118 записів. Стандартні атомні маси звірено зі скороченою таблицею CIAAW (2021 з ревізіями 2024 для Gd, Lu, Zr), перші енергії іонізації - з базою NIST ASD, а електронні конфігурації, групу, період, блок, температури плавлення та кипіння - з бібліотекою mendeleev; розміщення в сітці, картки елементів, усі фільтри та пошук перераховано з записів і звірено з тим, що показує сторінка. Усі 8 пройдено; 29 позицій, де дві опубліковані добірки справді розходяться, позначено як flagged із обома значеннями. Стенд авторський; жодна стороння особа його не перевіряла.","de":"Eine Datenintegritätsprüfung, keine physikalische: 8 Fälle über alle 118 Datensätze. Standardatomgewichte gegen die abgekürzte CIAAW-Tabelle (2021 mit den Revisionen 2024 für Gd, Lu, Zr), erste Ionisierungsenergien gegen die NIST Atomic Spectra Database, Elektronenkonfigurationen, Gruppe, Periode, Block sowie Schmelz- und Siedepunkte gegen die Bibliothek mendeleev; Gitterplatzierung, Elementkarten, jeder Filter und die Suche werden aus den Datensätzen neu berechnet und mit der Darstellung verglichen. Alle 8 bestanden; 29 Einträge, bei denen zwei veröffentlichte Sammlungen tatsächlich abweichen, sind mit beiden Werten markiert statt bewertet. Der Prüfstand stammt vom Autor; niemand von außen hat ihn geprüft.","nl":"Een gegevensintegriteitstoets, geen fysische: 8 gevallen over alle 118 records. Standaard atoommassa's tegen de verkorte CIAAW-tabel (2021 met de herzieningen van 2024 voor Gd, Lu, Zr), eerste ionisatie-energieën tegen de NIST Atomic Spectra Database, en elektronenconfiguraties, groep, periode, blok, smelt- en kookpunten tegen de mendeleev-bibliotheek; roosterplaatsing, elementkaarten, elk filter en de zoekfunctie worden uit de records herberekend en met de weergave vergeleken. Alle 8 geslaagd; 29 posities waar twee gepubliceerde compilaties echt verschillen zijn met beide waarden gemarkeerd in plaats van beoordeeld. De testbank is van de auteur zelf; geen externe partij heeft die beoordeeld.","fr":"Un contrôle d'intégrité des données, pas de physique : 8 cas couvrant les 118 fiches. Masses atomiques standard contre la table abrégée CIAAW (2021 avec les révisions 2024 de Gd, Lu, Zr), premières énergies d'ionisation contre la NIST Atomic Spectra Database, et configurations électroniques, groupe, période, bloc, points de fusion et d'ébullition contre la bibliothèque mendeleev ; le placement dans la grille, les fiches d'élément, chaque filtre et la recherche sont recalculés à partir des fiches et comparés au rendu. Les 8 cas passent ; 29 entrées où deux compilations publiées divergent réellement sont signalées avec les deux valeurs plutôt que notées. Le banc d'essai est celui de l'auteur ; aucun tiers ne l'a examiné.","es":"Una comprobación de integridad de datos, no de física: 8 casos que cubren las 118 fichas. Pesos atómicos estándar contra la tabla abreviada de la CIAAW (2021 con las revisiones de 2024 de Gd, Lu y Zr), primeras energías de ionización contra la NIST Atomic Spectra Database, y configuraciones electrónicas, grupo, periodo, bloque, puntos de fusión y ebullición contra la biblioteca mendeleev; la colocación en la rejilla, las fichas de elemento, cada filtro y la búsqueda se recalculan a partir de las fichas y se comparan con lo que muestra la página. Los 8 casos pasan; 29 entradas en las que dos compilaciones publicadas discrepan realmente se señalan con ambos valores en lugar de calificarse. El banco de pruebas es del propio autor; ningún tercero lo ha revisado.","pl":"Test integralności danych, a nie fizyczny: 8 przypadków obejmujących wszystkie 118 rekordów. Standardowe masy atomowe w zestawieniu ze skróconą tabelą CIAAW (2021 z rewizjami Gd/Lu/Zr z 2024 r.), energie pierwszej jonizacji w zestawieniu z bazą danych widm atomowych NIST oraz konfiguracje elektronowe, grupy, okresy, bloki, temperatury topnienia i wrzenia w zestawieniu z biblioteką danych pierwiastków Mendelejewa; rozmieszczenie siatki, karty pierwiastków, każda faseta filtra i wyszukiwanie są przeliczane na podstawie rekordów i porównywane z wynikami strony. Wszystkie 8 zaliczonych; 29 wpisów, w których dwie opublikowane kompilacje rzeczywiście się nie zgadzają, jest oznaczonych obiema wartościami, a nie ocenianych. Zestaw testowy został przygotowany przez autora; nie był recenzowany przez żadną stronę zewnętrzną."},"independent_validation":false,"benchmarks":[{"id":"element-data-integrity","reference":"Data-integrity benchmark (this tool computes nothing; it is a reference table). Standard atomic weights from the CIAAW abridged table 2021 with the 2024 Gd/Lu/Zr revisions; first ionisation energies from the NIST Atomic Spectra Database; electron configurations, group, period, block, melting and boiling points and Pauling electronegativity from the mendeleev 1.2.0 element-data library (CRC Handbook/NIST derived). Grid placement, element cards, filters and search are recomputed from the records and compared with what the page actually renders.","citations":["CIAAW, Abridged standard atomic weights (2021 table with the 2024 revisions of Gd, Lu and Zr), https://ciaaw.org/abridged-atomic-weights.htm; T. Prohaska et al., Standard atomic weights of the elements 2021 (IUPAC Technical Report), Pure Appl. Chem. 94(5), 573-600 (2022).","NIST Atomic Spectra Database, Ground levels and ionization energies for the neutral atoms, https://physics.nist.gov/PhysRefData/ASD/ionEnergy.html (values in eV, converted with 96.48533212 kJ mol^-1 eV^-1).","mendeleev 1.2.0 (L. M. Mentel), element data compiled from the CRC Handbook of Chemistry and Physics and NIST, https://mendeleev.readthedocs.io.","Royal Society of Chemistry periodic table, used to arbitrate the thorium melting point (1750 C = 2023 K) and the tungsten first ionisation energy (758.8 kJ/mol)."],"cases":8,"passed":8,"tolerance":"Atomic weights: the abridged CIAAW value must be reproduced to 5e-4 absolute, which is the last printed digit. Electron configurations, shell occupancies, symbols, group, period and grid placement: exact. First ionisation energies: 0.5 % or 1 kJ/mol against NIST ASD. Melting and boiling points: differences beyond 0.5 % are flagged with both values because the published compilations genuinely disagree; only a difference beyond 2 % is graded a failure. Electronegativity is not graded at all, because the tool uses the Allred-revised Pauling scale of the CRC Handbook while the reference library publishes Pauling original values.","run_at":"2026-10-16T09:27:42.507Z","artifact":"benchmarks/periodictable.json"}]},"report":{"pdf":true,"source_attribution":true},"python_export":{"supported":false,"reason":{"en":"The tool performs no calculation: every figure is a tabulated reference value, so an exported script would only reprint the table.","uk":"Інструмент нічого не обчислює: усі значення табличні, тож експортований скрипт лише передрукував би таблицю.","de":"Das Werkzeug rechnet nicht: alle Angaben sind Tabellenwerte, ein exportiertes Skript würde die Tabelle nur erneut ausgeben.","nl":"De tool rekent niets uit: alle waarden zijn tabelwaarden, dus een geëxporteerd script zou de tabel alleen opnieuw afdrukken.","fr":"L'outil ne calcule rien : toutes les valeurs sont tabulées, un script exporté ne ferait que réimprimer la table.","es":"La herramienta no calcula nada: todos los valores son tabulados, así que un script exportado solo reimprimiría la tabla."}},"handoff":{"provides":[],"accepts":[]},"state_codec":{"permalink":true,"record":"tools.petrov.re/calculation-record/v1"},"ui":{"framework":"tools.petrov.re/ui/v1","level":3}}</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Table — interactive reference</title>
<style>
/* diagram-ui.js owns the tokens, the theme, the shell and the placement law.
   What is left here is this tool's own drawing: the 18/32-column element grid,
   the element card and the hover tooltip.  No colour, radius, shadow, font-size
   or spacing literal survives; the four --pt-* properties are computed layout
   metrics written by JS from the measured stage, the way a chart computes its
   glyph sizes, not design tokens. */

/* ---- local repairs for known diagram-ui.js defects; they belong upstream ---- */
html .dgu-app [hidden]{display:none!important}
.dgu-pop,.dgu-tour,.dgu-dialog,.dgu-dialog-p,#pt-tip{box-sizing:border-box}
.dgu-pop *,.dgu-tour *,.dgu-dialog *,.dgu-dialog-p *,#pt-tip *{box-sizing:border-box}
@media(max-width:768px){
  html .dgu-app .dgu-q{width:var(--tap);height:var(--tap)}
  html .dgu-app .dgu-sel,html .dgu-app .dgu-tab{min-height:var(--tap)}
  html .dgu-app .dgu-seg button{min-height:var(--tap)}
  html .dgu-app .dgu-home{min-height:var(--tap)}
  html .dgu-tour .dgu-btn{min-height:var(--tap)}
}
/* a segmented control in a 250px rail must wrap, not scroll behind a hidden
   scrollbar: diagram-ui.js sets overflow:auto with no affordance. */
html .dgu-app .dgu-seg{flex-wrap:wrap;overflow:visible}
/* Below md diagram-ui.js moves the shared bar into the document flow and sets
   --dgu-safe-bottom to 0, so nothing is reserved for its bottom-docked tour
   card.  Keeping the card scrollable is all this page can do from here; the
   real repair (measure the flow dock) belongs upstream. */
@media(max-width:768px){
  html .dgu-tour{max-height:calc(100vh - var(--dgu-head-h,64px) - var(--sp-6));overflow:auto}
}
/* the reference archetype caps its content column at 1120px, which assumes
   prose. An 18-column element grid needs the full xl width. */
html .dgu-app[data-layout="reference"] .dgu-main{max-width:var(--bp-xl)}
/* spec 4.2 says the reference filters collapse to a bar at md and only split into
   a rail at lg; diagram-ui.js splits at md.  Repaired locally; belongs upstream. */
/* (was: a local repair moving the reference filter rail from md to lg, on the
   authority of spec 4.2. Deleted in v3.6.1 because it was measured to cost this
   page 1 038 px: with the framework's rail restored at md the answer moves from
   y=1 663 to y=625 at 768. kernnormenwijzer still carries its copy, where the
   same measurement comes out the other way.) */

/* ---- filters + key: one disclosure below md, an open rail above it.
   Spec 4.2 asks for the reference filters to sit behind one control below md;
   diagram-ui.js has no sheet primitive, so the region uses a disclosure. ---- */
.pt-navsum{display:flex;align-items:center;gap:var(--sp-2);min-height:var(--tap);
  padding:var(--sp-2) var(--sp-3);background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-md);font:650 var(--fs-section)/1.3 var(--font);
  text-transform:uppercase;letter-spacing:.08em;color:var(--muted);cursor:pointer}
.pt-navbox{display:flex;flex-direction:column;gap:var(--sp-4)}
.pt-navbox>.dgu-panel{margin-top:var(--sp-4)}
@media(min-width:768px){
  html .pt-navsum{display:none}
  html .pt-navbox>.dgu-panel{margin-top:0}
}

/* ---- filter strip (nav) ---- */
.pt-filter{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;
  padding:var(--sp-2) var(--sp-3);border:1px solid var(--accent);background:var(--weak);
  border-radius:var(--radius-md);font-size:var(--fs-label);color:var(--ink)}
.pt-filter b{color:var(--accent)}
.pt-filter .dgu-btn{margin-left:auto}

/* ---- key / legend (nav) ---- */
.pt-legend{display:flex;flex-wrap:wrap;gap:var(--sp-1)}
.pt-lg{display:flex;align-items:center;gap:var(--sp-2);font:400 var(--fs-small)/1.3 var(--font);
  color:var(--muted);cursor:pointer;padding:var(--sp-1) var(--sp-2);border-radius:var(--radius-sm);
  border:1px solid transparent;background:transparent;text-align:left;min-height:var(--ctl-h);width:100%}
.pt-lg:hover{border-color:var(--line);color:var(--ink)}
.pt-lg[data-lg="off"]{opacity:.4}
.pt-lg[data-lg="iso"]{border-color:var(--accent);color:var(--ink);background:var(--weak)}
.pt-sw{width:var(--sp-3);height:var(--sp-3);border-radius:var(--sp-1);border:1px solid var(--line);flex:0 0 auto}
.pt-lghint{font-size:var(--fs-micro);color:var(--muted);padding-left:var(--sp-2)}
.pt-scale{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;font-size:var(--fs-small);color:var(--muted)}
.pt-grad{height:var(--sp-3);flex:1 1 auto;min-width:var(--sp-7);border-radius:var(--sp-1);border:1px solid var(--line)}
@media(max-width:768px){.dgu-app .pt-lg{min-height:var(--tap)}}

/* ---- the table (the stage drawing) ---- */
.pt-scroll{overflow-x:auto;overflow-y:hidden;padding:var(--sp-2) var(--sp-3) var(--sp-3);
  -webkit-overflow-scrolling:touch}
.pt-scroll:focus-visible{outline:2px solid var(--accent);outline-offset:calc(-1 * var(--sp-1))}
.ptable{display:grid;gap:var(--sp-1)}
.ptable.std{grid-template-columns:repeat(18,minmax(var(--pt-cell),1fr))}
.ptable.long{grid-template-columns:repeat(32,minmax(var(--pt-cell),1fr))}
.pt-frowgap{grid-column:1/-1;height:var(--sp-3)}
.cell{position:relative;aspect-ratio:1/1;border-radius:var(--radius-sm);background:var(--panel);
  border:1px solid var(--line);color:var(--ink);cursor:pointer;padding:var(--sp-1);overflow:hidden;
  display:flex;flex-direction:column;text-align:left;font:inherit;min-width:0;
  transition:transform var(--motion-fast) var(--ease),box-shadow var(--motion-fast) var(--ease)}
.cell:hover{transform:translateY(calc(-1 * var(--sp-1))) scale(1.04);box-shadow:var(--shadow);z-index:1}
.cell .z{font-size:var(--pt-z);line-height:1;opacity:.72}
.cell .sym{font-size:var(--pt-sym);font-weight:650;line-height:1.05}

/* ---- element card (results) ---- */
.dgu-r-results>.dgu-panel{scroll-margin-top:calc(var(--dgu-head-h,64px) + var(--sp-3))}
.pt-cardhead{display:flex;gap:var(--sp-3);align-items:flex-start;flex-wrap:wrap}

  font-size:var(--fs-micro);font-weight:500}
button.dgu-chip:hover{border-color:var(--accent)}
@media(max-width:768px){.dgu-app button.dgu-chip{min-height:var(--tap)}}
.pt-sec{margin-top:var(--sp-4)}
.pt-pane>*+*{margin-top:var(--sp-3)}
.dgu-tile-v small{font-size:var(--fs-small);color:var(--muted);font-weight:400}
.pt-body{font-size:var(--fs-label);line-height:1.6}
.pt-fact{border-left:var(--sp-1) solid var(--accent)}
.pt-links{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.pt-subtabs{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.pt-canvas{width:100%;display:block}
.pt-orbs{display:grid;gap:var(--sp-4);

.pt-meta{font-size:var(--fs-small);color:var(--muted);line-height:1.6;margin-top:var(--sp-2)}
.pt-note{font-size:var(--fs-small);color:var(--muted)}
.dgu-table td.pt-wrap{white-space:normal}

/* ---- hover tooltip (a stage annotation, not a popover) ---- */
#pt-tip{position:fixed;pointer-events:none;z-index:var(--z-popover);display:none;

ivos. Lista completa mediante los enlaces IAEA/Wikipedia.","nl":"Belangrijke/representatieve isotopen getoond. Volledige lijst via IAEA/Wikipedia-links.","pl":"Przedstawiono kluczowe/reprezentatywne izotopy. Pełna lista dostępna na stronach MAEA/Wikipedia."},"resonance_note":{"en":"A resonance is a sharp cross-section peak when neutron energy matches a compound-nucleus level — central to reactor physics (resonance capture, Doppler broadening).","ru":"Резонанс — узкий пик сечения при энергии нейтрона, совпадающей с уровнем составного ядра. Ключевой фактор в физике реакторов (резонансный захват, доплеровское уширение).","uk":"Резонанс — це різкий пік перерізу, коли енергія нейтрона збігається з рівнем складеного ядра — центральне поняття фізики реакторів (резонансне захоплення, доплерівське розширення).","fr":"Une résonance est un pic étroit de section efficace lorsque l'énergie du neutron coïncide avec un niveau du noyau composé — central en physique des réacteurs (capture par résonance, élargissement Doppler).","de":"Eine Resonanz ist ein scharfer Wirkungsquerschnitts-Peak, wenn die Neutronenenergie einem Compoundkern-Niveau entspricht — zentral für die Reaktorphysik (Resonanzeinfang, Doppler-Verbreiterung).","es":"Una resonancia es un pico agudo de la sección eficaz cuando la energía del neutrón coincide con un nivel del núcleo compuesto — central en la física de reactores (captura resonante, ensanchamiento Doppler).","nl":"Een resonantie is een scherpe piek in de werkzame doorsnede wanneer de neutronenergie samenvalt met een niveau van de samengestelde kern — centraal in de reactorfysica (resonantievangst, Dopplerverbreding).","pl":"Rezonans to ostry szczyt przekroju czynnego, który pojawia się, gdy energia neutronów zrównuje się z energią jądra złożonego — jest to istotne dla fizyki reaktorów (wychwytywanie rezonansu, poszerzenie Dopplera)."},"nuc_note":{"en":"Full energy-dependent cross sections and reaction outputs are in the ENDF/JEFF databases (IAEA link).","ru":"Полные энергозависимые сечения и итоги ядерных реакций — в базах ENDF/JEFF (ссылка IAEA).","uk":"Повні залежні від енергії перерізи та виходи реакцій наведено в базах даних ENDF/JEFF (посилання IAEA).","fr":"Les sections efficaces complètes en fonction de l'énergie et les produits de réaction figurent dans les bases ENDF/JEFF (lien IAEA).","de":"Vollständige energieabhängige Wirkungsquerschnitte und Reaktionsausgänge finden sich in den ENDF/JEFF-Datenbanken (IAEA-Link).","es":"Las secciones eficaces completas dependientes de la energía y los productos de reacción están en las bases de datos ENDF/JEFF (enlace del IAEA).","nl":"Volledige energieafhankelijke werkzame doorsneden en reactieuitkomsten staan in de ENDF/JEFF-databanken (IAEA-link).","pl":"Pełne przekroje zależne od energii i wyniki reakcji znajdują się w bazach danych ENDF/JEFF (link IAEA)."},"nuc_warn":{"en":"Cross-section values are averaged reference figures (order of magnitude). For precise energy-dependent data use ENDF/JEFF via the IAEA link.","ru":"Данные по сечениям — усреднённые справочные значения (порядок величины). Для точных энергозависимых данных используйте ENDF/JEFF по ссылке IAEA.","uk":"Значення перерізів — усереднені довідкові величини (порядок величини). Для точних залежних від енергії даних використовуйте ENDF/JEFF за посиланням IAEA.","fr":"Les valeurs de section efficace sont des chiffres de référence moyennés (ordre de grandeur). Pour des données précises en fonction de l'énergie, utilisez ENDF/JEFF via le lien IAEA.","de":"Wirkungsquerschnittswerte sind gemittelte Referenzangaben (Größenordnung). Für präzise energieabhängige Daten ENDF/JEFF über den IAEA-Link verwenden.","es":"Los valores de sección eficaz son cifras de referencia promediadas (orden de magnitud). Para datos precisos dependientes de la energía use ENDF/JEFF a través del enlace del IAEA.","nl":"Waarden van werkzame doorsneden zijn gemiddelde referentiecijfers (orde van grootte). Gebruik voor nauwkeurige energieafhankelijke gegevens ENDF/JEFF via de IAEA-link.","pl":"Wartości przekroju poprzecznego to uśrednione wartości odniesienia (rzędy wielkości). Aby uzyskać precyzyjne dane zależne od energii, skorzystaj z ENDF/JEFF za pośrednictwem łącza MAEA."},"rad_warn":{"en":"Radioactive element — handling only under licensed conditions with radiation protection and accounting.","ru":"Радиоактивный элемент — обращение только в лицензированных условиях с радиационной защитой и учётом.","uk":"Радіоактивний елемент — поводження лише за ліцензованих умов з радіаційним захистом і обліком.","fr":"Élément radioactif — manipulation uniquement dans des conditions agréées avec radioprotection et comptabilité.","de":"Radioaktives Element — Handhabung nur unter lizenzierten Bedingungen mit Strahlenschutz und Buchführung.","es":"Elemento radiactivo — manipulación solo en condiciones autorizadas con protección radiológica y contabilidad.","nl":"Radioactief element — hantering alleen onder vergunde omstandigheden met stralingsbescherming en boekhouding.","pl":"Pierwiastek radioaktywny — obchodzenie się z nim wyłącznie w licencjonowanych warunkach, z zachowaniem zasad ochrony radiologicznej i rozliczeń."},"prose_note":{"en":"","ru":"","uk":"Описания приведены на английском (язык по умолчанию).","fr":"Descriptions affichées en anglais (langue par défaut).","de":"Beschreibungen auf Englisch (Standardsprache).","es":"Descripciones en inglés (idioma predeterminado).","nl":"Beschrijvingen in het Engels (standaardtaal).","pl":""},"footer":{"en":"Covers 118 elements: physical & chemical properties, electron configurations, orbitals & energy-level diagrams, isotopes with half-lives, nuclear data (thermal capture cross sections, key resonances), allotropes, toxicity, storage & disposal, industrial uses, fun facts and links. Values are averaged reference data; nuclear cross sections and resonances are order-of-magnitude. Controls: click — card, ← → — neighbour, Esc — close.","ru":"Охватывает 118 элементов: физические и химические свойства, электронные конфигурации, орбитали и диаграммы энергоуровней, изотопы с периодами полураспада, ядерные данные (тепловые сечения захвата, ключевые резонансы), аллотропы, токсичность, хранение и утилизацию, промышленные применения, интересные факты и ссылки. Значения — усреднённые справочные; ядерные сечения и резонансы даны для порядка величины. Управление: клик — карточка, ← → — соседний элемент, Esc — закрыть.","uk":"Охоплює 118 елементів: фізичні та хімічні властивості, електронні конфігурації, орбіталі та діаграми енергетичних рівнів, ізотопи з періодами напіврозпаду, ядерні дані (перерізи теплового захоплення, ключові резонанси), алотропи, токсичність, зберігання та утилізацію, промислове застосування, цікаві факти та посилання. Значення — усереднені довідкові дані; ядерні перерізи та резонанси — порядок величини. Керування: клік — картка, ← → — сусід, Esc — закрити.","fr":"Couvre 118 éléments : propriétés physiques et chimiques, configurations électroniques, orbitales et diagrammes de niveaux d'énergie, isotopes avec demi-vies, données nucléaires (sections efficaces de capture thermique, résonances clés), allotropes, toxicité, stockage et élimination, usages industriels, anecdotes et liens. Les valeurs sont des données de référence moyennées ; les sections efficaces nucléaires et les résonances sont d'ordre de grandeur. Commandes : clic — carte, ← → — voisin, Échap — fermer.","de":"Umfasst 118 Elemente: physikalische & chemische Eigenschaften, Elektronenkonfigurationen, Orbitale & Energieniveaudiagramme, Isotope mit Halbwertszeiten, Nukleardaten (thermische Einfangquerschnitte, wichtige Resonanzen), Allotrope, Toxizität, Lagerung & Entsorgung, industrielle Anwendungen, unterhaltsame Fakten und Links. Werte sind gemittelte Referenzdaten; nukleare Wirkungsquerschnitte und Resonanzen sind Größenordnungen. Steuerung: Klick — Karte, ← → — Nachbar, Esc — schließen.","es":"Cubre 118 elementos: propiedades físicas y químicas, configuraciones electrónicas, orbitales y diagramas de niveles de energía, isótopos con vidas medias, datos nucleares (secciones eficaces de captura térmica, resonancias clave), alótropos, toxicidad, almacenamiento y eliminación, usos industriales, curiosidades y enlaces. Los valores son datos de referencia promediados; las secciones eficaces nucleares y las resonancias son de orden de magnitud. Controles: clic — ficha, ← → — vecino, Esc — cerrar.","nl":"Behandelt 118 elementen: fysische & chemische eigenschappen, elektronenconfiguraties, orbitalen & energieniveaudiagrammen, isotopen met halfwaardetijden, nucleaire gegevens (thermische vangstdoorsneden, belangrijke resonanties), allotropen, toxiciteit, opslag & verwijdering, industriële toepassingen, weetjes en links. Waarden zijn gemiddelde referentiegegevens; nucleaire doorsneden en resonanties zijn orde van grootte. Bediening: klik — kaart, ← → — buur, Esc — sluiten.","pl":"Obejmuje 118 pierwiastków: właściwości fizyczne i chemiczne, konfiguracje elektronowe, orbitale i diagramy poziomów energetycznych, izotopy z okresami półtrwania, dane jądrowe (przekroje czynne na wychwyt termiczny, kluczowe rezonanse), alotropy, toksyczność, składowanie i utylizacja, zastosowania przemysłowe, ciekawostki i linki. Wartości to uśrednione dane referencyjne; przekroje czynne i rezonanse jądrowe są podane w rzędach wielkości. Sterowanie: kliknij — karta, ← → — sąsiad, Esc — zamknij."},"lang_name":{"en":"English","ru":"Русский","uk":"Українська","fr":"Français","de":"Deutsch","es":"Español","nl":"Nederlands","pl":"Polski"},"cm_life":{"en":"Lifetime (T½)","ru":"Время жизни (T½)","uk":"Час життя (T½)","fr":"Durée de vie (T½)","de":"Lebensdauer (T½)","es":"Vida (T½)","nl":"Levensduur (T½)","pl":"Czas życia (T½)"},"life_stable":{"en":"stable","ru":"стабилен","uk":"стабільний","fr":"stable","de":"stabil","es":"estable","nl":"stabiel","pl":"stabilny"},"s_energy":{"en":"Energy-level diagram (Aufbau)","ru":"Диаграмма энергоуровней (Ауфбау)","uk":"Діаграма енергетичних рівнів (Aufbau)","fr":"Diagramme des niveaux d'énergie (Aufbau)","de":"Energieniveaudiagramm (Aufbauprinzip)","es":"Diagrama de niveles de energía (Aufbau)","nl":"Energieniveaudiagram (Aufbau)","pl":"Diagram poziomów energii (Aufbau)"},"energy_note":{"en":"Subshells fill from low to high energy (Aufbau). Arrows are electrons (↑↓ = paired spins); the highest filled level is the valence shell.","ru":"Подоболочки заполняются от низкой энергии к высокой (принцип Ауфбау). Стрелки — электроны (↑↓ = спаренные спины); высший заполненный уровень — валентная оболочка.","uk":"Підрівні заповнюються від низької до високої енергії (Aufbau). Стрілки — це електрони (↑↓ = спарені спіни); найвищий заповнений рівень — валентна оболонка.","fr":"Les sous-couches se remplissent de basse à haute énergie (Aufbau). Les flèches sont des électrons (↑↓ = spins appariés) ; le niveau rempli le plus haut est la couche de valence.","de":"Unterschalen füllen sich von niedriger zu hoher Energie (Aufbauprinzip). Pfeile sind Elektronen (↑↓ = gepaarte Spins); das höchste besetzte Niveau ist die Valenzschale.","es":"Las subcapas se llenan de menor a mayor energía (Aufbau). Las flechas son electrones (↑↓ = espines apareados); el nivel lleno más alto es la capa de valencia.","nl":"Subschillen vullen van lage naar hoge energie (Aufbau). Pijlen zijn elektronen (↑↓ = gepaarde spins); het hoogste gevulde niveau is de valentieschil.","pl":"Podpowłoki wypełniają się od niskiej do wysokiej energii (Aufbau). Strzałki oznaczają elektrony (↑↓ = spiny parzyste); najwyższy poziom wypełnienia to powłoka walencyjna."},"p_life":{"en":"Longest-lived isotope T½","ru":"T½ самого долгоживущего изотопа","uk":"T½ найдовговічнішого ізотопу","fr":"T½ de l'isotope à la plus longue durée de vie","de":"Langlebigstes Isotop T½","es":"T½ del isótopo de vida más larga","nl":"T½ van de langstlevende isotoop","pl":"Najdłużej żyjący izotop T½"},"filter_phase":{"en":"Phase","ru":"Фаза","uk":"Фаза","fr":"Phase","de":"Phase","es":"Fase","nl":"Fase","pl":"Faza"},"orb_s":{"en":"Spherically symmetric orbital (l=0). One orientation, holds 2 electrons.","ru":"Сферически симметричная орбиталь (l=0). Одна ориентация, до 2 электронов.","uk":"Сферично симетрична орбіталь (l=0). Одна орієнтація, вміщує 2 електрони.","fr":"Orbitale à symétrie sphérique (l=0). Une orientation, contient 2 électrons.","de":"Kugelsymmetrisches Orbital (l=0). Eine Orientierung, fasst 2 Elektronen.","es":"Orbital esféricamente simétrico (l=0). Una orientación, contiene 2 electrones.","nl":"Bolsymmetrisch orbitaal (l=0). Eén oriëntatie, bevat 2 elektronen.","pl":"Orbital sferycznie symetryczny (l=0). Jedna orientacja, utrzymuje 2 elektrony."},"orb_p":{"en":"Dumbbell orbital (l=1). Three orientations (px, py, pz), up to 6 electrons.","ru":"Гантелевидная орбиталь (l=1). Три ориентации (px, py, pz), до 6 электронов.","uk":"Гантелеподібна орбіталь (l=1). Три орієнтації (px, py, pz), до 6 електронів.","fr":"Orbitale en haltère (l=1). Trois orientations (px, py, pz), jusqu'à 6 électrons.","de":"Hantelförmiges Orbital (l=1). Drei Orientierungen (px, py, pz), bis zu 6 Elektronen.","es":"Orbital en forma de mancuerna (l=1). Tres orientaciones (px, py, pz), hasta 6 electrones.","nl":"Haltervormig orbitaal (l=1). Drie oriëntaties (px, py, pz), tot 6 elektronen.","pl":"Orbital hantli (l=1). Trzy orientacje (px, py, pz), do 6 elektronów."},"orb_d":{"en":"Cloverleaf orbital (l=2). Five orientations, up to 10 electrons — shapes transition-metal behaviour.","ru":"Четырёхлепестковая орбиталь (l=2). Пять ориентаций, до 10 электронов — определяет свойства переходных металлов.","uk":"Чотирипелюсткова орбіталь (l=2). П'ять орієнтацій, до 10 електронів — формує поведінку перехідних металів.","fr":"Orbitale en trèfle (l=2). Cinq orientations, jusqu'à 10 électrons — façonne le comportement des métaux de transition.","de":"Kleeblattförmiges Orbital (l=2). Fünf Orientierungen, bis zu 10 Elektronen — prägt das Verhalten der Übergangsmetalle.","es":"Orbital en forma de trébol (l=2). Cinco orientaciones, hasta 10 electrones — configura el comportamiento de los metales de transición.","nl":"Klaverbladvormig orbitaal (l=2). Vijf oriëntaties, tot 10 elektronen — vormt het gedrag van overgangsmetalen.","pl":"Orbital koniczyny (l=2). Pięć orientacji, do 10 elektronów – kształtuje zachowanie metali przejściowych."},"orb_f":{"en":"Complex multi-lobe orbital (l=3). Seven orientations, up to 14 electrons — typical of lanthanides and actinides.","ru":"Сложная многолепестковая орбиталь (l=3). Семь ориентаций, до 14 электронов — характерна для лантаноидов и актиноидов.","uk":"Складна багатопелюсткова орбіталь (l=3). Сім орієнтацій, до 14 електронів — типова для лантаноїдів і актиноїдів.","fr":"Orbitale complexe multilobée (l=3). Sept orientations, jusqu'à 14 électrons — typique des lanthanides et des actinides.","de":"Komplexes vielkeuliges Orbital (l=3). Sieben Orientierungen, bis zu 14 Elektronen — typisch für Lanthanoide und Actinoide.","es":"Orbital complejo multilobulado (l=3). Siete orientaciones, hasta 14 electrones — típico de lantánidos y actínidos.","nl":"Complex orbitaal met meerdere lobben (l=3). Zeven oriëntaties, tot 14 elektronen — typisch voor lanthaniden en actiniden.","pl":"Złożony orbital wielopłatowy (l=3). Siedem orientacji, do 14 elektronów — typowe dla lantanowców i aktynowców."}};

  lrn_search_b:{en:"Matches an element symbol exactly, an atomic number exactly, or any part of a name — in any of the seven languages of this table, not only the one on screen. Matching cells are outlined; the rest are dimmed, not removed, so you keep the shape of the table.",pl:"Dokładnie dopasowuje symbol pierwiastka, liczbę atomową lub dowolną część nazwy — w dowolnym z siedmiu języków tej tabeli, nie tylko w tym wyświetlanym na ekranie. Pasujące komórki są zaznaczone konturem; pozostałe są przyciemnione, a nie usunięte, dzięki czemu zachowujesz kształt tabeli.",
    ru:"Совпадение по символу элемента, по атомному номеру или по части названия — на любом из семи языков этой таблицы, а не только на текущем. Найденные ячейки обводятся, остальные приглушаются, а не убираются, поэтому форма таблицы сохраняется.",
    uk:"Збіг за символом елемента, за атомним номером або за частиною назви — будь-якою з семи мов цієї таблиці, а не лише поточною. Знайдені комірки обводяться, решта приглушується, а не зникає, тож форма таблиці зберігається.",

    de:"Trifft auf ein Elementsymbol, eine Ordnungszahl oder einen Namensteil zu — in jeder der sieben Sprachen dieser Tabelle, nicht nur in der angezeigten. Treffer werden umrandet, der Rest abgeblendet statt entfernt, damit die Form der Tabelle erhalten bleibt.",
    es:"Coincide con el símbolo exacto, el número atómico exacto o parte de un nombre — en cualquiera de los siete idiomas de esta tabla, no solo el mostrado. Las casillas encontradas se recuadran; el resto se atenúa en vez de desaparecer, conservando la forma de la tabla.",
    nl:"Zoekt op elementsymbool, op atoomnummer, of op een deel van een naam — in elk van de zeven talen van deze tabel, niet alleen de getoonde. Treffers krijgen een omlijning, de rest wordt gedimd in plaats van verwijderd, zodat de vorm van de tabel behouden blijft."},
  lrn_colour_b:{en:"Four of the scales are categorical — category, metallicity, block, state at 25 °C — and get a clickable key. The rest are continuous: electronegativity, melting point, density, atomic radius, thermal neutron capture cross section and the half-life of the longest-lived isotope. Melting point, density and cross section are mapped on a logarithmic scale because they span many decades; a cell with no value for the chosen quantity is drawn empty with a dashed border rather than as a zero.",pl:"Cztery z nich są kategorialne – kategoria, metaliczność, blok, stan w temperaturze 25°C – i posiadają klikalny klucz. Pozostałe są ciągłe: elektroujemność, temperatura topnienia, gęstość, promień atomowy, przekrój czynny na wychwyt neutronów termicznych oraz okres półtrwania najdłuższego izotopu. Temperatura topnienia, gęstość i przekrój czynny są odwzorowane w skali logarytmicznej, ponieważ obejmują wiele dekad; komórka bez wartości dla wybranej wielkości jest rysowana jako pusta, z przerywaną obwódką, a nie jako zero.",
    ru:"Четыре шкалы категориальные — категория, металличность, блок, состояние при 25 °C — и получают кликабельную легенду. Остальные непрерывные: электроотрицательность, температура плавления, плотность, атомный радиус, сечение захвата тепловых нейтронов и период полураспада самого долгоживущего изотопа. Температура плавления, плотность и сечение отображаются в логарифмическом масштабе, так как охватывают многие порядки; ячейка без значения рисуется пустой с пунктирной рамкой, а не нулём.",
    uk:"Чотири шкали категоріальні — категорія, металічність, блок, стан за 25 °C — і мають клікабельну легенду. Решта неперервні: електронегативність, температура плавлення, густина, атомний радіус, переріз захоплення теплових нейтронів і період напіврозпаду найдовговічнішого ізотопу. Температуру плавлення, густину та переріз показано в логарифмічному масштабі, бо вони охоплюють багато порядків; комірка без значення малюється порожньою з пунктирною рамкою, а не нулем.",
    fr:"Quatre échelles sont catégorielles — catégorie, métallicité, bloc, état à 25 °C — et reçoivent une légende cliquable. Les autres sont continues : électronégativité, point de fusion, densité, rayon atomique, section efficace de capture des neutrons thermiques et période du radio-isotope le plus stable. Point de fusion, densité et section efficace sont en échelle logarithmique car ils couvrent plusieurs décades ; une case sans valeur est dessinée vide, en tireté, plutôt qu’à zéro.",
    de:"Vier Skalen sind kategorial — Kategorie, Metallcharakter, Block, Zustand bei 25 °C — und erhalten eine anklickbare Legende. Die übrigen sind stetig: Elektronegativität, Schmelzpunkt, Dichte, Atomradius, Einfangquerschnitt thermischer Neutronen und Halbwertszeit des langlebigsten Isotops. Schmelzpunkt, Dichte und Querschnitt werden logarithmisch abgebildet, da sie viele Dekaden umfassen; eine Zelle ohne Wert wird leer mit gestrichelter Umrandung gezeichnet, nicht als Null.",
    es:"Cuatro escalas son categóricas — categoría, metalicidad, bloque, estado a 25 °C — y llevan una leyenda pulsable. Las demás son continuas: electronegatividad, punto de fusión, densidad, radio atómico, sección eficaz de captura de neutrones térmicos y periodo del isótopo más longevo. Punto de fusión, densidad y sección eficaz se representan en escala logarítmica porque abarcan muchas décadas; una casilla sin valor se dibuja vacía y con borde discontinuo, no como cero.",
    nl:"Vier schalen zijn categoriaal — categorie, metaalkarakter, blok, toestand bij 25 °C — en krijgen een aanklikbare legenda. De overige zijn continu: elektronegativiteit, smeltpunt, dichtheid, atoomstraal, invangdoorsnede voor thermische neutronen en halveringstijd van de langstlevende isotoop. Smeltpunt, dichtheid en doorsnede staan op een logaritmische schaal omdat ze vele decaden beslaan; een cel zonder waarde wordt leeg met een stippellijn getekend, niet als nul."},
  lrn_layout_b:{en:"The standard 18-column form lifts the lanthanoids and actinoids out into two strips below the table, which is how almost every printed table is drawn. The long 32-column form puts the f block back in its true place between groups 2 and 3, so the filling order reads left to right without a break; it is wider than most screens and scrolls sideways.",pl:"Standardowa, 18-kolumnowa forma unosi lantanowce i aktynowce w dwa pasy pod tabelą, tak jak rysowana jest niemal każda drukowana tabela. Długa, 32-kolumnowa forma umieszcza blok f z powrotem na swoim właściwym miejscu między grupami 2 i 3, dzięki czemu kolejność wypełniania jest od lewej do prawej bez przerw; jest szersza niż większość ekranów i przewija się na boki.",
    ru:"Стандартная 18-колоночная форма выносит лантаноиды и актиноиды в две полосы под таблицей — так нарисовано почти любое печатное издание. Длинная 32-колоночная форма возвращает f-блок на его истинное место между 2-й и 3-й группами, поэтому порядок заполнения читается слева направо без разрыва; она шире большинства экранов и прокручивается вбок.",
    uk:"Стандартна 18-колонкова форма виносить лантаноїди й актиноїди у дві смуги під таблицею — саме так намальовано майже кожну друковану таблицю. Довга 32-колонкова форма повертає f-блок на його справжнє місце між 2-ю та 3-ю групами, тож порядок заповнення читається зліва направо без розриву; вона ширша за більшість екранів і прогортається вбік.",
    fr:"La forme standard à 18 colonnes sort les lanthanides et les actinides en deux bandes sous le tableau, comme presque toutes les tables imprimées. La forme longue à 32 colonnes remet le bloc f à sa vraie place entre les groupes 2 et 3, si bien que l’ordre de remplissage se lit de gauche à droite sans rupture ; elle est plus large que la plupart des écrans et défile latéralement.",
    de:"Die 18-spaltige Standardform hebt Lanthanoide und Actinoide in zwei Streifen unter die Tabelle heraus, so wie fast jede gedruckte Tabelle gezeichnet ist. Die lange 32-spaltige Form stellt den f-Block an seinen wahren Platz zwischen Gruppe 2 und 3 zurück, sodass die Auffüllreihenfolge ohne Bruch von links nach rechts zu lesen ist; sie ist breiter als die meisten Bildschirme und scrollt seitlich.",
    es:"La forma estándar de 18 columnas saca los lantánidos y actínidos a dos franjas bajo la tabla, como casi todas las tablas impresas. La forma larga de 32 columnas devuelve el bloque f a su lugar real entre los grupos 2 y 3, de modo que el orden de llenado se lee de izquierda a derecha sin corte; es más ancha que la mayoría de pantallas y se desplaza lateralmente.",
    nl:"De standaardvorm met 18 kolommen tilt de lanthaniden en actiniden uit naar twee stroken onder de tabel, zoals vrijwel elke gedrukte tabel is getekend. De lange vorm met 32 kolommen zet het f-blok terug op zijn echte plaats tussen groep 2 en 3, zodat de vulvolgorde zonder onderbreking van links naar rechts leest; hij is breder dan de meeste schermen en schuift zijwaarts."},
  lrn_legend_b:{en:"For a categorical scale the key is also a control. Click a category once to dim it out of the table, twice to isolate it and dim everything else, three times to go back to showing all of them. Only one category is ever singled out at a time. For a continuous scale the key becomes the colour ramp with its two end values and its unit.",pl:"W przypadku skali kategorycznej kluczem jest również element sterujący. Kliknij kategorię raz, aby ją przyciemnić w tabeli, dwa razy, aby ją wyizolować i przyciemnić wszystkie pozostałe, a trzy razy, aby powrócić do wyświetlania wszystkich. Zawsze zaznaczana jest tylko jedna kategoria na raz. W przypadku skali ciągłej kluczem staje się rampa kolorów z dwiema wartościami końcowymi i jednostką.",
    ru:"Для категориальной шкалы легенда — ещё и орган управления. Один клик по категории приглушает её в таблице, два — оставляет только её, три — возвращает показ всех. Одновременно выделяется только одна категория. Для непрерывной шкалы легенда превращается в цветовую полосу с двумя крайними значениями и единицей.",
    uk:"Для категоріальної шкали легенда — ще й орган керування. Один клік по категорії приглушує її в таблиці, два — залишає лише її, три — повертає показ усіх. Одночасно виділяється лише одна категорія. Для неперервної шкали легенда стає кольоровою смугою з двома крайніми значеннями та одиницею.",
    fr:"Pour une échelle catégorielle, la légende est aussi une commande. Un clic sur une catégorie l’atténue dans le tableau, deux clics l’isolent en atténuant tout le reste, trois clics rétablissent l’affichage complet. Une seule catégorie est isolée à la fois. Pour une échelle continue, la légende devient la rampe de couleur avec ses deux valeurs extrêmes et son unité.",
    de:"Bei einer kategorialen Skala ist die Legende zugleich ein Bedienelement. Ein Klick auf eine Kategorie blendet sie in der Tabelle ab, zwei Klicks isolieren sie und blenden alles andere ab, drei Klicks zeigen wieder alle. Es wird immer nur eine Kategorie hervorgehoben. Bei einer stetigen Skala wird die Legende zum Farbverlauf mit seinen beiden Endwerten und seiner Einheit.",
    es:"En una escala categórica la leyenda es además un control. Un clic sobre una categoría la atenúa en la tabla, dos clics la aíslan atenuando el resto, tres clics vuelven a mostrarlas todas. Solo se aísla una categoría a la vez. En una escala continua la leyenda pasa a ser la rampa de color con sus dos valores extremos y su unidad.",
    nl:"Bij een categoriale schaal is de legenda tevens een bedieningselement. Eén klik op een categorie dimt haar in de tabel, twee klikken isoleren haar en dimmen de rest, drie klikken tonen weer alles. Er wordt steeds maar één categorie uitgelicht. Bij een continue schaal wordt de legenda de kleurenbalk met zijn twee uiterste waarden en zijn eenheid."},
  lrn_filter_b:{en:"Every badge on an element card — its category, its metallicity, its state, its group, its period, its block — is a filter. Choosing one narrows the table to the elements that share it and switches the colouring to match. The filter is the only narrowing that the calculation record counts: it is what \"elements shown\" reports, and the report lists exactly those elements.",pl:"Każda odznaka na karcie pierwiastka – jej kategoria, metaliczność, stan, grupa, okres, blok – jest filtrem. Wybranie jednego z nich zawęża tabelę do pierwiastków, które go współdzielą, i odpowiednio zmienia kolor. Filtr to jedyne zawężenie uwzględniane w rekordzie obliczeniowym: to właśnie raport „wyświetlone pierwiastki” zawiera listę tych pierwiastków, a raport wymienia dokładnie te pierwiastki.",
    ru:"Каждый значок на карточке элемента — категория, металличность, состояние, группа, период, блок — это фильтр. Выбор значка сужает таблицу до элементов с тем же признаком и переключает раскраску. Только фильтр учитывается в записи расчёта: именно он даёт «показано элементов», и в отчёт попадают именно эти элементы.",
    uk:"Кожен значок на картці елемента — категорія, металічність, стан, група, період, блок — це фільтр. Вибір значка звужує таблицю до елементів із тією самою ознакою й перемикає забарвлення. Лише фільтр враховується в записі розрахунку: саме він дає «показано елементів», і у звіт потрапляють саме ці елементи.",
    fr:"Chaque étiquette d’une fiche d’élément — catégorie, métallicité, état, groupe, période, bloc — est un filtre. En choisir une restreint le tableau aux éléments qui la partagent et adapte la coloration. Le filtre est la seule restriction que compte l’enregistrement de calcul : c’est lui qui donne « éléments affichés », et le rapport liste exactement ces éléments.",
    de:"Jede Marke auf einer Elementkarte — Kategorie, Metallcharakter, Zustand, Gruppe, Periode, Block — ist ein Filter. Eine davon zu wählen schränkt die Tabelle auf die Elemente mit demselben Merkmal ein und stellt die Färbung passend um. Nur der Filter geht in den Berechnungsnachweis ein: er liefert „angezeigte Elemente“, und der Bericht listet genau diese Elemente.",
    es:"Cada distintivo de una ficha de elemento — categoría, metalicidad, estado, grupo, periodo, bloque — es un filtro. Elegir uno restringe la tabla a los elementos que lo comparten y ajusta el coloreado. El filtro es la única restricción que cuenta el registro de cálculo: es lo que da «elementos mostrados», y el informe enumera exactamente esos elementos.",
    nl:"Elk label op een elementkaart — categorie, metaalkarakter, toestand, groep, periode, blok — is een filter. Er een kiezen beperkt de tabel tot de elementen die het delen en stemt de kleuring erop af. Alleen het filter telt mee in het rekenrecord: het levert «getoonde elementen», en het rapport somt precies die elementen op."},
  lrn_card_b:{en:"Nine tabs: an overview with the identity data and the chemical behaviour, the physical constants and any allotropes, the chemistry with a Bohr shell picture, an orbital shape and an Aufbau energy diagram, the isotope table, the neutron data, the industrial uses, the safety notes, the notable facts and the external sources. Arrow left and arrow right step to the neighbouring element; Escape clears the selection.",pl:"Dziewięć zakładek: przegląd danych identyfikacyjnych i charakterystyki chemicznej, stałe fizyczne i wszelkie alotropy, chemia z obrazem powłoki Bohra, kształt orbitalu i diagram energii Aufbau, tabela izotopów, dane neutronowe, zastosowania przemysłowe, uwagi dotyczące bezpieczeństwa, istotne fakty i źródła zewnętrzne. Strzałki w lewo i w prawo przechodzą do sąsiedniego pierwiastka; Escape czyści zaznaczenie.",
    ru:"Девять вкладок: обзор с идентификационными данными и химическим поведением, физические константы и аллотропы, химия с моделью Бора, формой орбитали и энергетической диаграммой (Ауфбау), таблица изотопов, нейтронные данные, применение, безопасность, интересные факты и внешние источники. Стрелки влево и вправо переходят к соседнему элементу; Escape снимает выбор.",
    uk:"Дев’ять вкладок: огляд з ідентифікаційними даними та хімічною поведінкою, фізичні константи й алотропи, хімія з моделлю Бора, формою орбіталі та енергетичною діаграмою (Ауфбау), таблиця ізотопів, нейтронні дані, застосування, безпека, цікаві факти та зовнішні джерела. Стрілки вліво та вправо переходять до сусіднього елемента; Escape знімає вибір.",
    fr:"Neuf onglets : un aperçu avec les données d’identité et le comportement chimique, les constantes physiques et les allotropes, la chimie avec un schéma de Bohr, une forme d’orbitale et un diagramme d’énergie (Aufbau), le tableau des isotopes, les données neutroniques, les usages, la sécurité, les faits notables et les sources externes. Flèche gauche et flèche droite passent à l’élément voisin ; Échap efface la sélection.",
    de:"Neun Reiter: eine Übersicht mit den Identitätsdaten und dem chemischen Verhalten, die physikalischen Konstanten und etwaige Modifikationen, die Chemie mit Bohr-Schalenbild, Orbitalform und Aufbau-Energiediagramm, die Isotopentabelle, die Neutronendaten, die Anwendungen, die Sicherheitshinweise, die bemerkenswerten Fakten und die externen Quellen. Pfeil links und Pfeil rechts wechseln zum Nachbarelement; Escape hebt die Auswahl auf.",
    es:"Nueve pestañas: un resumen con los datos de identidad y el comportamiento químico, las constantes físicas y los alótropos, la química con un esquema de Bohr, una forma de orbital y un diagrama de energía (Aufbau), la tabla de isótopos, los datos neutrónicos, los usos, la seguridad, las curiosidades y las fuentes externas. Flecha izquierda y flecha derecha pasan al elemento vecino; Escape quita la selección.",
    nl:"Negen tabbladen: een overzicht met de identiteitsgegevens en het chemische gedrag, de fysische constanten en eventuele allotropen, de chemie met een Bohr-schillenbeeld, een orbitaalvorm en een Aufbau-energiediagram, de isotopentabel, de neutronengegevens, de toepassingen, de veiligheid, de opmerkelijke feiten en de externe bronnen. Pijl links en pijl rechts gaan naar het buurelement; Escape wist de selectie."},
  lrn_life_b:{en:"Elements with at least one stable isotope are drawn in a single flat colour. The rest are coloured by the half-life of their longest-lived isotope on a logarithmic scale, which runs from fractions of a millisecond for the heaviest synthetic nuclides to billions of years for thorium and uranium.",pl:"Pierwiastki posiadające co najmniej jeden stabilny izotop są zaznaczone jednym, płaskim kolorem. Pozostałe są oznaczone kolorem odpowiadającym okresowi półtrwania ich najdłuższego izotopu w skali logarytmicznej, który waha się od ułamków milisekundy dla najcięższych nuklidów syntetycznych do miliardów lat dla toru i uranu.",
    ru:"Элементы, имеющие хотя бы один стабильный изотоп, окрашены одним ровным цветом. Остальные окрашены по периоду полураспада самого долгоживущего изотопа в логарифмическом масштабе — от долей миллисекунды у самых тяжёлых синтетических нуклидов до миллиардов лет у тория и урана.",
    uk:"Елементи, що мають хоча б один стабільний ізотоп, залито одним рівним кольором. Решту забарвлено за періодом напіврозпаду найдовговічнішого ізотопу в логарифмічному масштабі — від часток мілісекунди у найважчих синтетичних нуклідів до мільярдів років у торію та урану.",
    fr:"Les éléments possédant au moins un isotope stable sont dessinés d’une seule couleur unie. Les autres sont colorés selon la période de leur isotope le plus stable, sur une échelle logarithmique allant de fractions de milliseconde pour les nucléides synthétiques les plus lourds à des milliards d’années pour le thorium et l’uranium.",
    de:"Elemente mit mindestens einem stabilen Isotop werden in einer einzigen Flächenfarbe gezeichnet. Die übrigen sind nach der Halbwertszeit ihres langlebigsten Isotops logarithmisch eingefärbt — von Bruchteilen einer Millisekunde bei den schwersten synthetischen Nukliden bis zu Milliarden Jahren bei Thorium und Uran.",
    es:"Los elementos con al menos un isótopo estable se dibujan en un color plano único. Los demás se colorean según el periodo de su isótopo más longevo en escala logarítmica, que va de fracciones de milisegundo en los nucleidos sintéticos más pesados a miles de millones de años en el torio y el uranio.",
    nl:"Elementen met ten minste één stabiele isotoop krijgen één vlakke kleur. De rest is gekleurd naar de halveringstijd van hun langstlevende isotoop op een logaritmische schaal, van fracties van een milliseconde bij de zwaarste synthetische nucliden tot miljarden jaren bij thorium en uranium."}

  shortcuts:  {en:"Keyboard shortcuts",pl:"Skróty klawiaturowe",uk:"Гарячі клавіші",de:"Tastenkürzel",nl:"Sneltoetsen",fr:"Raccourcis clavier",es:"Atajos de teclado",ru:"Горячие клавиши"},
  menu:       {en:"Tools",pl:"Narzędzia",uk:"Інструменти",de:"Werkzeuge",nl:"Tools",fr:"Outils",es:"Herramientas",ru:"Инструменты"}
};

/* ================================================================== model */
const BYZ = {}; ELEMENTS.forEach(e=>BYZ[e.z]=e);
const LANGS=["en","ru","uk","fr","de","es","nl","pl"];
/* Language precedence: ?lang= -> localStorage.diagram_lang -> browser -> the shared
   bootstrap's choice -> en.  "ru" is this table's extra language and is honoured from the
   URL, but is never written into the shared diagram_lang key used by the other tools. */
const SITE_LANGS=["en","uk","de","nl","fr","es","pl"];
const initialLang=(()=>{let l=null;
  try{l=new URLSearchParams(location.search).get("lang")}catch(e){}
  if(l)l=String(l).slice(0,2).toLowerCase();
  if(!LANGS.includes(l)){try{const x=localStorage.getItem("diagram_lang");if(LANGS.includes(x))l=x}catch(e){}}
  if(!LANGS.includes(l)){for(const n of (navigator.languages||[navigator.language||""])){
    const x=String(n).slice(0,2).toLowerCase();if(LANGS.includes(x)){l=x;break}}}
  if(!LANGS.includes(l))l=LANGS.includes(window.__diagramLang)?window.__diagramLang:"en";
  return l})();

/* The permalink contract.  Shape unchanged by the port: {v,lang,color,view,q,filter,z}. */
let state={v:1,lang:initialLang,color:'cat',view:'std',q:'',filter:null,z:null};
let app=null;
function S(){return app?app.state:state}
function LG(){const l=S().lang;return LANGS.includes(l)?l:'en'}
function t(k){const o=I18N[k];return o?(o[LG()]||o.en):k;}
function nm(e){return e.names[LG()]||e.names.en;}

const CAT_COLORS={nonmetal:'#2f9e79',noble:'#8a5cc7',alkali:'#d9534f',alkaline:'#e0a458',tm:'#4a90d9',posttm:'#7d8bc0',metalloid:'#c7b03a',halogen:'#3fb5c4',lanthanide:'#c76fd6',actinide:'#d96f8f'};
const CAT_ORDER=['alkali','alkaline','tm','posttm','metalloid','nonmetal','halogen','noble','lanthanide','actinide'];
const METAL_COLORS={metal:'#4a90d9',metalloid:'#c7b03a',nonmetal:'#2f9e79'};
const METAL_ORDER=['metal','metalloid','nonmetal'];
const BLOCK_COLORS={s:'#d9534f',p:'#4a90d9',d:'#e0a458',f:'#c76fd6'};
const BLOCK_ORDER=['s','p','d','f'];
const STATE_COLORS={solid:'#7d8bc0',liquid:'#3fb5c4',gas:'#e0a458',unknown:'#3a4460'};
const STATE_ORDER=['solid','liquid','gas'];

const COLOR_MODES=[{id:'cat',k:'cm_cat',type:'d'},{id:'metal',k:'cm_metal',type:'d'},{id:'block',k:'cm_block',type:'d'},{id:'state',k:'cm_state',type:'d'},{id:'electroneg',k:'cm_electroneg',type:'n'},{id:'melt',k:'cm_melt',type:'n'},{id:'density',k:'cm_density',type:'n'},{id:'radius',k:'cm_radius',type:'n'},{id:'xsec',k:'cm_xsec',type:'n'},{id:'life',k:'cm_life',type:'life'}];
const STABLE_COLOR='#2f9e79';
const SEC_PER_YR=3.15576e7;
function humanHL(s){if(s==null)return '—';const yr=s/SEC_PER_YR;
  if(yr>=1e9)return fmtNum(Math.round(yr/1e8)/10)+' Gyr';
  if(yr>=1e6)return fmtNum(Math.round(yr/1e5)/10)+' Myr';
  if(yr>=1e3)return fmtNum(Math.round(yr/100)/10)+' kyr';
  if(yr>=1)return fmtNum(Math.round(yr*10)/10)+' yr';
  const d=s/86400;if(d>=1)return fmtNum(Math.round(d*10)/10)+' d';
  const h=s/3600;if(h>=1)return fmtNum(Math.round(h*10)/10)+' h';
  const m=s/60;if(m>=1)return fmtNum(Math.round(m*10)/10)+' min';
  if(s>=1)return fmtNum(Math.round(s*10)/10)+' s';
  return fmtNum(Math.round(s*1000))+' ms';}
const VIEWS=[{id:'std',k:'view_std'},{id:'long',k:'view_long'}];

/* discrete helpers */
function stateOf(e){const T=298.15;if(e.melt==null)return 'unknown';if(e.boil!=null&&e.boil<T)return 'gas';if(e.melt>T)return 'solid';return 'liquid';}
function dVal(e,m){return m==='cat'?e.cat:m==='metal'?e.metal:m==='block'?e.block:m==='state'?stateOf(e):null;}
function dColor(e,m){const v=dVal(e,m);return m==='cat'?CAT_COLORS[v]:m==='metal'?METAL_COLORS[v]:m==='block'?BLOCK_COLORS[v]:m==='state'?STATE_COLORS[v]:'#888';}
function dLabel(v,m){return m==='cat'?t('cat_'+v.replace('cat_','')):m==='metal'?t('m_'+v):m==='block'?t('b_'+v):m==='state'?t('st_'+v):v;}
function dOrder(m){return m==='cat'?CAT_ORDER:m==='metal'?METAL_ORDER:m==='block'?BLOCK_ORDER:m==='state'?STATE_ORDER:[];}
function rgba(hex,a){const h=hex.replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return `rgba(${r},${g},${b},${a})`;}
function fmtMass(e){return e.mass_stable?('['+e.mass+']'):(''+e.mass);}

/* long-form column layout */
function longPos(e){
  const z=e.z;
  if(z>=57&&z<=71){return z<71?[3+(z-57),6]:[17,6];}
  if(z>=89&&z<=103){return z<103?[3+(z-89),7]:[17,7];}
  if(z===1)return [1,1]; if(z===2)return [32,1];
  const c=e.col;let lc;
  if(c<=2)lc=c; else if(c<=12)lc=17+(c-3); else lc=27+(c-13);
  return [lc,e.row];
}

function getMetric(e,m){return m==='electroneg'?e.electroneg:m==='melt'?e.melt:m==='density'?e.density:m==='radius'?e.radius:m==='xsec'?e.nuclear.xsec_nat:null;}
function heat(x){const s=[[44,51,80],[74,144,217],[56,211,159],[255,193,94],[255,107,107]];const seg=x*(s.length-1);const i=Math.min(s.length-2,Math.floor(seg));const f=seg-i;const a=s[i],b=s[i+1];return `rgb(${Math.round(a[0]+(b[0]-a[0])*f)},${Math.round(a[1]+(b[1]-a[1])*f)},${Math.round(a[2]+(b[2]-a[2])*f)})`;}
function fmtNum(v){if(v==null)return '—';if(v>=1000)return v.toLocaleString(LG()==='en'?'en-US':LG());if(v<0.01&&v>0)return v.toExponential(1);return (''+v).replace('.',LG()==='en'?'.':',');}

/* group / period, and the two visibility predicates */
function grpNum(e){if(e.cat==='lanthanide'||e.cat==='actinide')return 'f';if(e.row>7)return null;return e.col;}
function perNum(e){if(e.cat==='lanthanide')return 6;if(e.cat==='actinide')return 7;return e.row;}
function filterVisible(e){
  const f=S().filter;
  if(!f)return true;
  if(f.type==='group')return grpNum(e)===f.value;
  if(f.type==='period')return perNum(e)===f.value;
  if(f.type==='block')return e.block===f.value;
  if(f.type==='cat')return e.cat===f.value;
  if(f.type==='metal')return e.metal===f.value;
  if(f.type==='phase')return stateOf(e)===f.value;
  return true;
}
/* legend state: a view filter only, never part of the record or the permalink */
let legLast=null, legCount={};
function legendVisible(e){
  const cm=S().color;
  if(COLOR_MODES.find(m=>m.id===cm).type!=='d')return true;
  const v=dVal(e,cm),c=legCount[v]||0;
  const isoVal=Object.keys(legCount).find(k=>legCount[k]===2);
  if(isoVal!=null)return v===isoVal;
  return c!==1;
}

/* the drawing's own ink: the heat ramp and the flat "stable" fill are data, so the
   text drawn on top picks its contrast the way a chart label does. */
function inkOn(css){
  let r,g,b,m;
  if((m=/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/.exec(css))){r=+m[1];g=+m[2];b=+m[3];}
  else if(css.charAt(0)==='#'){const h=css.slice(1);r=parseInt(h.slice(0,2),16);g=parseInt(h.slice(2,4),16);b=parseInt(h.slice(4,6),16);}
  else return '';
  return (0.299*r+0.587*g+0.114*b)>150?'#111418':'#f5f7fa';
}

/* ================================================================== table */
let ptable=null, scroller=null, swipe=null, stage=null, posByZ={}, zByPos={};

function makeCell(e,col,row){
  const d=document.createElement('button');
  d.type='button';d.className='cell';d.style.gridColumn=col;d.style.gridRow=row;d.dataset.z=e.z;
  d.tabIndex=-1;
  d.setAttribute('aria-label',e.z+' '+e.sym+' '+nm(e));
  d.innerHTML=`<span class="z">${e.z}</span><span class="sym">${e.sym}</span><span class="nm">${nm(e)}</span><span class="mv">${fmtMass(e)}</span>`;
  d.addEventListener('click',()=>select(e.z));
  d.addEventListener('mousemove',(ev)=>showTip(ev,e));
  d.addEventListener('mouseleave',hideTip);
  d.addEventListener('focus',hideTip);
  posByZ[e.z]=[col,row];zByPos[col+','+row]=e.z;
  return d;
}

function buildTable(){
  const view=S().view;
  ptable.className='ptable '+view;
  ptable.innerHTML='';
  posByZ={};zByPos={};
  if(view==='std'){
    ELEMENTS.forEach(e=>{if(e.row<=7)ptable.appendChild(makeCell(e,e.col,e.row));});
    [[3,6,57,71],[3,7,89,103]].forEach(p=>{
      const d=document.createElement('button');d.type='button';d.className='pt-ph';
      d.style.gridColumn=p[0];d.style.gridRow=p[1];
      d.textContent=p[2]+'–'+p[3];
      d.setAttribute('aria-label',t('p_block')+' f: '+p[2]+'–'+p[3]);
      d.addEventListener('click',()=>select(p[2]));
      ptable.appendChild(d);});
    const gap=document.createElement('div');gap.className='pt-frowgap';gap.style.gridRow=8;ptable.appendChild(gap);
    ELEMENTS.forEach(e=>{if(e.row>=9)ptable.appendChild(makeCell(e,e.col,e.row));});
  } else {
    ELEMENTS.forEach(e=>{const p=longPos(e);ptable.appendChild(makeCell(e,p[0],p[1]));});
  }
}

/* colouring + visibility — the maths is the original, verbatim */
function applyColors(){
  const cells=[...ptable.querySelectorAll('.cell')];
  const colorMode=S().color;
  const mode=COLOR_MODES.find(m=>m.id===colorMode);
  const s=(S().q||'').trim().toLowerCase();
  if(mode.type==='d'){
    scaleShow(false);
    cells.forEach(c=>{const e=BYZ[c.dataset.z];const col=dColor(e,colorMode);
      c.style.background=rgba(col,0.20);c.style.borderColor=rgba(col,0.55);c.style.borderStyle='solid';c.style.opacity='';
      c.style.color='';
      setVis(c,e,s);});
  } else if(mode.type==='life'){
    scaleShow(true);
    const secs=ELEMENTS.filter(e=>e.hl_s!=null).map(e=>e.hl_s);
    const logs=secs.map(v=>Math.log10(v));const lo=Math.min(...logs),hi=Math.max(...logs);
    scaleUnit.textContent=t('life_stable');
    scaleUnit.appendChild(scaleSwatch(STABLE_COLOR));
    scaleMin.textContent=humanHL(Math.min(...secs));
    scaleMax.textContent=humanHL(Math.max(...secs));
    grad.style.background='linear-gradient(90deg,#ff6b6b,#ffc15e,#38d39f,#4a90d9)';
    cells.forEach(c=>{const e=BYZ[c.dataset.z];c.style.borderStyle='solid';c.style.borderColor='var(--line)';
      if(e.hl_s==null){c.style.background=STABLE_COLOR;c.style.color=inkOn(STABLE_COLOR);setVis(c,e,s);return;}
      let x=(Math.log10(e.hl_s)-lo)/(hi-lo);x=Math.max(0,Math.min(1,x));
      const col=heat(1-x);
      c.style.background=col;c.style.color=inkOn(col);setVis(c,e,s);});
  } else {
    const vals=ELEMENTS.map(e=>getMetric(e,colorMode)).filter(v=>v!=null&&!isNaN(v));
    const log=(colorMode==='xsec'||colorMode==='melt'||colorMode==='density');
    const pos=vals.filter(v=>v>0);
    const lo=log?Math.log10(Math.min(...pos)):Math.min(...vals);
    const hi=log?Math.log10(Math.max(...vals)):Math.max(...vals);
    const units={electroneg:'(Pauling)',melt:'K',density:'g/cm³',radius:'pm',xsec:'barn (log)'};
    scaleShow(true);
    scaleUnit.textContent=units[colorMode]||'';
    scaleMin.textContent=fmtNum(log?Math.min(...pos):Math.min(...vals));
    scaleMax.textContent=fmtNum(Math.max(...vals));
    grad.style.background='linear-gradient(90deg,#2c3350,#4a90d9,#38d39f,#ffc15e,#ff6b6b)';
    cells.forEach(c=>{const e=BYZ[c.dataset.z];let v=getMetric(e,colorMode);
      if(v==null||isNaN(v)){c.style.background='transparent';c.style.borderStyle='dashed';c.style.borderColor='var(--line)';c.style.color='';setVis(c,e,s,true);return;}
      c.style.borderStyle='solid';c.style.borderColor='var(--line)';
      let x=log?(Math.log10(Math.max(1e-4,v))-lo)/(hi-lo):(v-lo)/(hi-lo);x=Math.max(0,Math.min(1,x));
      const col=heat(x);
      c.style.background=col;c.style.color=inkOn(col);setVis(c,e,s);});
  }
}
function setVis(c,e,s,noData){
  const vis=legendVisible(e)&&filterVisible(e);
  let dim=!vis;
  c.classList.remove('match');
  if(s){const hit=e.sym.toLowerCase()===s||(''+e.z)===s||nm(e).toLowerCase().includes(s)||e.names.en.toLowerCase().includes(s)||Object.values(e.names).some(n=>n.toLowerCase().includes(s));
    c.classList.toggle('match',hit);if(!hit)dim=true;}
  if(noData&&!dim)c.style.opacity='.28';else c.style.opacity=dim?'':'';
  c.classList.toggle('dim',dim);
  c.setAttribute('aria-current',String(S().z===e.z));
}

/* cell metrics: computed from the measured stage, the way a chart sizes its glyphs */
function px(v,lo,hi){return Math.max(lo,Math.min(hi,v)).toFixed(2)+'px';}
function sizeCells(size){
  if(!ptable)return;
  const view=S().view, n=view==='long'?32:18;
  const gap=4, pad=24;                          /* --sp-1 gutter, --sp-3 either side */
  const narrow=(window.innerWidth||1024)<768;
  /* below md a cell is a tap target (>=44px, spec 4.5) and the table scrolls
     sideways with an affordance; above it the floor is the smallest legible
     cell, chosen so the 18-column form still fits a 1120px viewport. */
  const floor=narrow?44:38;
  const avail=(Math.max(1,(size&&size.w||scroller.clientWidth)-pad)-(n-1)*gap)/n;
  /* integral track sizes: 18 fractional tracks round up to a few stray pixels
     of horizontal scroll that the affordance would then have to explain */
  const cell=Math.max(floor,Math.min(46,Math.floor(avail)));
  const eff=Math.max(cell,avail);
  ptable.style.setProperty('--pt-cell',cell.toFixed(2)+'px');
  ptable.style.minWidth=(n*cell+(n-1)*gap).toFixed(2)+'px';
  ptable.style.setProperty('--pt-z',px(eff*0.17,8,11));
  ptable.style.setProperty('--pt-sym',px(eff*0.32,11,20));
  ptable.style.setProperty('--pt-nm',px(eff*0.125,6.5,11));
  ptable.classList.toggle('hidenm',view==='long'||eff<50);
  ptable.classList.toggle('hidemv',eff<34);
  updateSwipe();
}
function updateSwipe(){
  if(!swipe||!scroller)return;
  const over=scroller.scrollWidth>scroller.clientWidth+2;
  swipe.hidden=!over;
  if(over)swipe.textContent=t('swipe');
}

/* roving tabindex: one tab stop for 118 cells, arrows move inside the grid */
function setRoving(z){
  const cells=ptable.querySelectorAll('.cell');
  if(!cells.length)return;
  let target=null;
  if(z!=null)target=ptable.querySelector('.cell[data-z="'+z+'"]');
  if(!target)target=ptable.querySelector('.cell[tabindex="0"]')||cells[0];
  cells.forEach(c=>{c.tabIndex=(c===target)?0:-1;});
}
function neighbour(z,dx,dy){
  const p=posByZ[z];if(!p)return null;
  let c=p[0],r=p[1];
  for(let i=0;i<40;i++){
    c+=dx;r+=dy;
    if(c<1||c>32||r<1||r>10)return null;
    const n=zByPos[c+','+r];
    if(n!=null)return n;
  }
  return null;
}
function onTableKey(ev){
  const cell=ev.target.closest?ev.target.closest('.cell'):null;
  if(!cell)return;
  const z=+cell.dataset.z;
  let nz=null;
  if(ev.key==='ArrowLeft'){nz=neighbour(z,-1,0);if(nz==null&&BYZ[z-1])nz=z-1;}
  else if(ev.key==='ArrowRight'){nz=neighbour(z,1,0);if(nz==null&&BYZ[z+1])nz=z+1;}
  else if(ev.key==='ArrowUp')nz=neighbour(z,0,-1);
  else if(ev.key==='ArrowDown')nz=neighbour(z,0,1);
  else return;
  ev.preventDefault();ev.stopPropagation();
  if(nz==null)return;
  const t2=ptable.querySelector('.cell[data-z="'+nz+'"]');
  if(!t2)return;
  setRoving(nz);t2.focus();
  if(S().z!=null)select(nz,true);
}

/* ================================================================ tooltip */
const tip=document.getElementById('pt-tip');
function showTip(ev,e){tip.style.display='block';
  tip.innerHTML=`<div class="tt-s" style="color:${CAT_COLORS[e.cat]}">${e.sym} · ${nm(e)}</div><div class="tt-r">${t('cat_'+e.cat)} · ${t('m_'+e.metal)}</div><div class="tt-p">${t('p_mass')}: ${fmtMass(e)} · ${t('p_en')}: ${e.electroneg??'—'}<br>σ(n): ${e.nuclear.xsec_nat??'—'} barn</div>`;
  const w=tip.offsetWidth||240,h=tip.offsetHeight||90;
  let x=ev.clientX+14,y=ev.clientY+14;if(x+w>innerWidth)x=ev.clientX-w;if(y+h>innerHeight)y=ev.clientY-h;
  tip.style.left=Math.max(0,x)+'px';tip.style.top=Math.max(0,y)+'px';}
function hideTip(){tip.style.display='none';}

/* ================================================================ filters */
function filterLabel(type,value){
  if(type==='group')return t('p_group')+' '+value;
  if(type==='period')return t('p_period')+' '+value;
  if(type==='block')return t('p_block')+' '+value;
  if(type==='cat')return t('cat_'+value);
  if(type==='metal')return t('m_'+value);
  if(type==='phase')return t('st_'+value);
  return String(value);
}
function setFilter(type,value){
  const s=S();
  s.filter={type:type,value:value};
  if(type==='block')setColorMode('block');
  else if(type==='metal')setColorMode('metal');
  else if(type==='cat')setColorMode('cat');
  else if(type==='phase')setColorMode('state');
}
function setColorMode(id){S().color=id;legLast=null;legCount={};}
function clearFilter(){S().filter=null;}

/* =========================================================== element card */
let cardHead=null, cardTabsSlot=null, cardPane=null, tabsObj=null, curTab='over';
const TABS=[['over','t_over'],['phys','t_phys'],['chem','t_chem'],['iso','t_iso'],
            ['nuc','t_nuc'],['use','t_use'],['safe','t_safe'],['facts','t_facts'],['link','t_link']];

function P(k,v,unit){if(v==null||v==='')v='—';return `<div class="dgu-tile"><div class="dgu-tile-l">${k}</div><div class="dgu-tile-v">${v}${unit?` <small>${unit}</small>`:''}</div></div>`;}
function pr(e,f){return e.prose[f][LG()]||e.prose[f].en;}
function disc(e){return e.discovery[LG()]||e.discovery.en;}
function supscript(n){const m={0:'⁰',1:'¹',2:'²',3:'³',4:'⁴',5:'⁵',6:'⁶',7:'⁷',8:'⁸',9:'⁹'};return (''+n).split('').map(d=>m[d]).join('');}
function sec(txt){return `<h3 class="dgu-panel-t pt-sec">${txt}</h3>`;}

function cardIdentity(e){

}

function paneHTML(e,which){
  const kelvinC=v=>v==null?'—':`${fmtNum(v)} K <small>(${fmtNum(Math.round((v-273.15)*10)/10)} °C)</small>`;
  const stt=stateOf(e);
  if(which==='over')return `
    <div class="dgu-tiles">
      ${P(t('p_z'),e.z)}${P(t('p_mass'),fmtMass(e),t('amu'))}${P(t('p_cat'),t('cat_'+e.cat))}${P(t('p_metal'),t('m_'+e.metal))}
      ${P(t('p_config'),e.config)}${P(t('p_oxi'),e.oxi)}${P(t('p_en'),e.electroneg,'(Pauling)')}${P(t('p_discovery'),disc(e))}
      ${P(t('p_life'),e.hl_s!=null?humanHL(e.hl_s):t('life_stable'))}

function tok(n,fb){try{const v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return v||fb}catch(e){return fb}}
function drawBohr(e){const cv=cardPane.querySelector('#bohr');if(!cv)return;const dpr=devicePixelRatio||1,W=cv.clientWidth,H=280;
  if(!W)return;cv.width=W*dpr;cv.height=H*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
  const cx=W/2,cy=H/2,col=CAT_COLORS[e.cat];ctx.beginPath();ctx.arc(cx,cy,14,0,7);ctx.fillStyle=col;ctx.fill();
  ctx.fillStyle=inkOn(col)||'#fff';ctx.font='650 11px '+tok('--font','sans-serif');ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e.sym,cx,cy);
  const shells=e.shells,maxR=Math.min(W,H)/2-16,step=maxR/(shells.length+0.3);
  shells.forEach((cnt,i)=>{const r=step*(i+1)+18;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.strokeStyle=tok('--line','#ddd');ctx.lineWidth=1;ctx.stroke();
    const show=Math.min(cnt,32);for(let k=0;k<show;k++){const a=(k/show)*Math.PI*2-Math.PI/2+i*0.3,ex=cx+r*Math.cos(a),ey=cy+r*Math.sin(a);ctx.beginPath();ctx.arc(ex,ey,2.6,0,7);ctx.fillStyle=col;ctx.fill();}
    ctx.fillStyle=tok('--muted','#777');ctx.font='400 11px '+tok('--font','sans-serif');ctx.textAlign='left';ctx.fillText(cnt,cx+r-6,cy-r+2);});}
function setupOrbitals(e){const tabsEl=cardPane.querySelector('#orbTabs');if(!tabsEl)return;tabsEl.innerHTML='';const orbs=e.orbitals.length?e.orbitals:[{n:1,l:'s',e:1}];
  orbs.forEach((o,i)=>{const b=document.createElement('button');b.type='button';b.className='dgu-btn';b.textContent=`${o.n}${o.l}${supscript(o.e)}`;if(i===orbs.length-1)b.classList.add('on');
    b.onclick=()=>{tabsEl.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');drawOrbital(o,e);};tabsEl.appendChild(b);});
  drawOrbital(orbs[orbs.length-1],e);}
function setupAllotropes(e){const tabsEl=cardPane.querySelector('#alloTabs');if(!tabsEl||tabsEl.dataset.done)return;tabsEl.dataset.done='1';
  e.allotropes.forEach((a,i)=>{const b=document.createElement('button');b.type='button';b.className='dgu-btn';b.textContent=a.name[LG()]||a.name.en;if(i===0)b.classList.add('on');
