var LEARN={"status":{"title":{"en":"Five definition states","uk":"П’ять станів визначення","de":"Fünf Definitionszustände","nl":"Vijf definitiestaten","fr":"Cinq états de définition","es":"Cinco estados de definición","pl":"Pięć stanów definicji"},"body":{"en":"Unknown means the question has not been established. TBD means it is deliberately open. Partial means some basis exists. Defined means the decision and its basis are recorded. N/A is accepted only with a reason.","uk":"Невідомо означає, що питання ще не встановлено. TBD — навмисно відкрите. Частково — частина основи вже є. Визначено — рішення та його основу зафіксовано. N/A приймається лише з поясненням.","de":"Unbekannt: noch nicht geklärt. TBD: bewusst offen. Teilweise: Grundlage teilweise vorhanden. Definiert: Entscheidung und Grundlage dokumentiert. N/A wird nur mit Begründung akzeptiert.","nl":"Onbekend: nog niet vastgesteld. TBD: bewust open. Gedeeltelijk: basis deels aanwezig. Gedefinieerd: besluit en basis vastgelegd. N.v.t. wordt alleen met reden geaccepteerd.","fr":"Inconnu : non établi. À définir : volontairement ouvert. Partiel : base incomplète. Défini : décision et base consignées. N/A n’est accepté qu’avec justification.","es":"Desconocido: no establecido. Por definir: abierto deliberadamente. Parcial: existe parte de la base. Definido: decisión y base registradas. N/A solo se acepta con motivo.","pl":"Nieznane: nie ustalono. TBD: celowo otwarte. Częściowe: istnieje część podstawy. Zdefiniowane: decyzja i podstawa są zapisane. N/D jest akceptowane tylko z uzasadnieniem."}},"boundary":{"title":{"en":"System boundary","uk":"Межі системи","de":"Systemgrenze","nl":"Systeemgrens","fr":"Frontière du système","es":"Límite del sistema","pl":"Granica systemu"},"body":{"en":"The boundary decides what is part of the system of interest and where responsibilities, interfaces, utilities, tests and acceptance cross into something else. A vague boundary causes late interface work.","uk":"Межа визначає, що належить до системи інтересу і де відповідальність, інтерфейси, мережі, випробування та приймання переходять до іншої системи. Нечітка межа породжує пізні інтерфейсні роботи.","de":"Die Grenze legt fest, was zum betrachteten System gehört und wo Verantwortung, Schnittstellen, Medien, Prüfungen und Abnahme in ein anderes System übergehen. Eine unklare Grenze erzeugt späte Schnittstellenarbeit.","nl":"De grens bepaalt wat tot het beschouwde systeem behoort en waar verantwoordelijkheden, interfaces, nutsvoorzieningen, tests en acceptatie overgaan naar iets anders. Een vage grens veroorzaakt laat interfacewerk.","fr":"La frontière détermine ce qui appartient au système d’intérêt et où responsabilités, interfaces, utilités, essais et acceptation passent à autre chose. Une frontière floue crée des interfaces tardives.","es":"El límite define qué pertenece al sistema de interés y dónde responsabilidades, interfaces, servicios, pruebas y aceptación pasan a otro sistema. Un límite vago genera trabajo tardío de interfaces.","pl":"Granica określa, co należy do systemu zainteresowania i gdzie odpowiedzialności, interfejsy, media, próby i odbiór przechodzą na inny system. Niejasna granica powoduje późne prace interfejsowe."}},"environment":{"title":{"en":"Environmental conditions","uk":"Умови навколишнього середовища","de":"Umgebungsbedingungen","nl":"Omgevingscondities","fr":"Conditions environnementales","es":"Condiciones ambientales","pl":"Warunki środowiskowe"},"body":{"en":"For outdoor or mixed installations this is not just temperature: wind, rain, solar load, snow/ice, dust, corrosion and local extremes can drive enclosure, materials, heat rejection, controls and winterisation.","uk":"Для зовнішніх або змішаних установок це не лише температура: вітер, дощ, сонячне навантаження, сніг/лід, пил, корозія та місцеві екстремуми впливають на оболонку, матеріали, тепловідведення, керування й зимовий захист.","de":"Bei Außen- oder Mischaufstellung geht es nicht nur um Temperatur: Wind, Regen, Sonne, Schnee/Eis, Staub, Korrosion und lokale Extreme treiben Gehäuse, Werkstoffe, Wärmeabfuhr, Regelung und Winterisierung.","nl":"Bij buiten- of gemengde opstelling gaat het niet alleen om temperatuur: wind, regen, zon, sneeuw/ijs, stof, corrosie en lokale extremen sturen behuizing, materialen, warmteafvoer, regeling en wintervoorzieningen.","fr":"En extérieur ou en installation mixte, il ne s’agit pas seulement de température : vent, pluie, soleil, neige/glace, poussière, corrosion et extrêmes locaux pilotent enveloppe, matériaux, rejet thermique, contrôle et protection hivernale.","es":"En exterior o instalación mixta no es solo temperatura: viento, lluvia, sol, nieve/hielo, polvo, corrosión y extremos locales condicionan envolvente, materiales, rechazo de calor, control y protección invernal.","pl":"Dla instalacji zewnętrznych lub mieszanych to nie tylko temperatura: wiatr, deszcz, słońce, śnieg/lód, pył, korozja i lokalne ekstrema wpływają na obudowę, materiały, odprowadzanie ciepła, sterowanie i zabezpieczenie zimowe."}},"acceptance":{"title":{"en":"Acceptance criteria","uk":"Критерії приймання","de":"Abnahmekriterien","nl":"Acceptatiecriteria","fr":"Critères d’acceptation","es":"Criterios de aceptación","pl":"Kryteria odbioru"},"body":{"en":"An acceptance test is meaningful only when the pass/fail criteria, test configuration, procedure owner, evidence owner and accepting authority are known before the test is run.","uk":"Приймальні випробування мають сенс лише тоді, коли до їх проведення відомі критерії pass/fail, конфігурація випробувань, власник процедури, власник доказів і орган приймання.","de":"Eine Abnahmeprüfung ist nur sinnvoll, wenn Bestehens-/Nichtbestehenskriterien, Prüfkonfiguration, Verfahrensverantwortlicher, Nachweisverantwortlicher und Abnahmeinstanz vor der Prüfung feststehen.","nl":"Een acceptatietest is alleen zinvol als pass/fail-criteria, testconfiguratie, procedure-eigenaar, bewijseigenaar en accepterende partij vooraf bekend zijn.","fr":"Un essai d’acceptation n’a de sens que si critères de réussite/échec, configuration d’essai, responsable de procédure, responsable des preuves et autorité d’acceptation sont connus avant l’essai.","es":"Una prueba de aceptación solo es útil si antes de ejecutarla se conocen criterios de aprobación, configuración de prueba, responsable del procedimiento, responsable de evidencias y autoridad de aceptación.","pl":"Próba odbiorowa ma sens tylko wtedy, gdy przed jej wykonaniem znane są kryteria zaliczenia, konfiguracja próby, właściciel procedury, właściciel dowodów i organ odbioru."}},"map":{"title":{"en":"Definition Map","uk":"Карта визначення","de":"Definitionskarte","nl":"Definitiekaart","fr":"Carte de définition","es":"Mapa de definición","pl":"Mapa definicji"},"body":{"en":"The map groups project-definition domains by intent, design basis, constraints, delivery and governance. The highlighted open item shows the decisions that depend on it.","uk":"Карта групує області визначення проєкту за наміром, проєктною базою, обмеженнями, реалізацією та управлінням. Виділене відкрите питання показує рішення, що від нього залежать.","de":"Die Karte gruppiert Projektdefinitionsbereiche nach Ziel, Auslegungsgrundlage, Randbedingungen, Realisierung und Governance. Der markierte offene Punkt zeigt abhängige Entscheidungen.","nl":"De kaart groepeert projectdefinitiedomeinen naar intentie, ontwerpgrondslag, randvoorwaarden, realisatie en governance. Het gemarkeerde open punt toont afhankelijke besluiten.","fr":"La carte regroupe les domaines par intention, base de conception, contraintes, réalisation et gouvernance. Le point ouvert surligné montre les décisions qui en dépendent.","es":"El mapa agrupa los ámbitos por intención, base de diseño, restricciones, ejecución y gobernanza. El punto abierto resaltado muestra las decisiones que dependen de él.","pl":"Mapa grupuje obszary definicji według zamiaru, podstawy projektowej, ograniczeń, realizacji i zarządzania. Wyróżniony otwarty punkt pokazuje zależne decyzje."}}};
