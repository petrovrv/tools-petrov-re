  "description": {
    "en": "Build a radial low-voltage one-line from an upstream source and transformer through buses and feeders to static loads and asynchronous motors. Iterative balanced three-phase load flow calculates currents, bus voltages, voltage drop and losses. The short-circuit engine calculates separate maximum/minimum initial symmetrical currents at every bus with a nodal positive-sequence impedance model, optional motor contribution and peak current ip; protection checks include Icu/Icm duty, minimum-fault clearing, cable/PE adiabatic withstand, TN/TT earth-fault screening and range-based generic selectivity screening. Manufacturer data are still required to certify protection coordination.",
    "uk": "Побудуйте радіальну однолінійну схему НН від зовнішньої мережі та трансформатора через шини й фідери до статичних навантажень і асинхронних двигунів. Ітераційний симетричний трифазний load-flow визначає струми, напруги шин, падіння напруги та втрати. Розрахунок КЗ дає окремі максимальні/мінімальні початкові симетричні струми в кожній шині через вузлову модель прямої послідовності, опційно враховує двигуни та піковий струм ip; перевіряються Icu/Icm, відключення мінімального КЗ, адіабатична стійкість кабелю/PE, TN/TT замикання на землю та діапазонний screening селективності. Для сертифікації координації потрібні дані виробника.",
    "de": "Erstellen Sie ein radiales Niederspannungs-Einlinienschema von Netzquelle und Transformator über Sammelschienen und Abgänge zu statischen Lasten und Asynchronmotoren. Der iterative symmetrische Dreiphasen-Lastfluss berechnet Ströme, Spannungen, Spannungsfall und Verluste. Die Kurzschlussberechnung liefert getrennte maximale/minimale Anfangskurzschlussströme an jedem Knoten über ein nodales Mitsystem-Impedanzmodell, optional mit Motorbeitrag und Spitzenstrom ip; geprüft werden Icu/Icm, Abschaltung des Minimalfehlers, adiabatische Kabel-/PE-Festigkeit, TN/TT-Erdschluss-Screening und bereichsbasierte generische Selektivität. Herstellerdaten bleiben für eine zertifizierte Koordination erforderlich.",
    "nl": "Bouw een radiaal laagspannings-eendraadschema van netbron en transformator via rails en feeders naar statische belastingen en asynchrone motoren. De iteratieve symmetrische driefasen-loadflow berekent stromen, spanningen, spanningsval en verliezen. De kortsluitmotor berekent afzonderlijke maximale/minimale initiële symmetrische kortsluitstromen op elke rail met een nodaal positieve-volgorde-impedantiemodel, optionele motorbijdrage en piekstroom ip; controles omvatten Icu/Icm, afschakeling van minimumfouten, adiabatische kabel-/PE-vastheid, TN/TT-aardfoutscreening en bereikgebaseerde generieke selectiviteit. Voor gecertificeerde coördinatie blijven fabrikantgegevens nodig.",
    "fr": "Construisez un schéma unifilaire radial BT depuis le réseau amont et le transformateur, via jeux de barres et départs, vers charges statiques et moteurs asynchrones. Le load-flow triphasé équilibré itératif calcule courants, tensions, chutes de tension et pertes. Le moteur de court-circuit calcule séparément les courants symétriques initiaux maximum/minimum à chaque jeu de barres par un modèle nodal d’impédance directe, avec contribution moteur optionnelle et courant de crête ip ; les contrôles couvrent Icu/Icm, l’élimination du défaut minimal, la tenue adiabatique câble/PE, le screening TN/TT des défauts terre et une sélectivité générique vérifiée sur une plage de courant. Les données constructeur restent nécessaires pour certifier la coordination.",
    "es": "Construya un esquema unifilar radial BT desde la red y el transformador, pasando por barras y alimentadores, hasta cargas estáticas y motores asíncronos. El flujo de carga trifásico equilibrado e iterativo calcula corrientes, tensiones, caída de tensión y pérdidas. El motor de cortocircuito calcula por separado las corrientes iniciales simétricas máxima/mínima en cada barra mediante un modelo nodal de impedancia de secuencia positiva, con contribución opcional de motores y corriente de pico ip; las comprobaciones incluyen Icu/Icm, despeje del defecto mínimo, resistencia adiabática de cable/PE, screening TN/TT de defectos a tierra y selectividad genérica sobre un rango de corriente. Los datos del fabricante siguen siendo necesarios para certificar la coordinación.",
    "pl": "Zbuduj promieniową schemat jednokreskowy niskiego napięcia od źródła i transformatora w górę, przez szyny i zasilacze do obciążeń statycznych i silników asynchronicznych. Iteracyjny, zrównoważony przepływ obciążenia trójfazowego oblicza prądy, napięcia szyn, spadki napięcia i straty. Moduł zwarciowy oblicza oddzielnie maksymalne/minimalne początkowe prądy symetryczne dla każdej szyny z węzłowym modelem impedancji składowej zgodnej, opcjonalnym wkładem silnika i prądem szczytowym ip; kontrole zabezpieczeń obejmują obciążenie Icu/Icm, minimalne usuwanie zwarć, adiabatyczną wytrzymałość kabli/PE, ekranowanie zwarć doziemnych TN/TT oraz ogólne ekranowanie selektywności oparte na zakresie. Dane producenta są nadal wymagane do certyfikacji koordynacji zabezpieczeń."

  "limitations": {
    "en": "Balanced radial three-phase low-voltage network prototype with one upstream network source and one two-winding transformer. Load flow uses constant-PQ loads and does not model phase unbalance, harmonics or neutral current. The short-circuit engine is a positive-sequence nodal impedance model with separate maximum/minimum source cases, network-transformer KT correction and optional asynchronous-motor contribution; it reports initial symmetrical currents and a κ(R/X) peak-current screening value. It is not a complete IEC 60909 implementation: full zero-/negative-sequence unbalanced-fault networks, symmetrical breaking current Ib, DC component, steady-state current and thermal-equivalent/Joule-integral m,n calculations are not implemented. TN/TT earth-fault checks are installation-level screening models and IT is unsupported. Generic breaker curves, Icu/Icm and range-based selectivity checks cannot certify a real protective-device combination; manufacturer data and independent engineering verification are required. Cable auto-sizing inherits the limited verified ampacity subset of the Cable Sizing tool. That subset is 242 (material, reference method, cross-section) cells of IEC 60364-5-52 for PVC insulation and three loaded conductors only, 23.6 % of that tool's own input grid; grouping of buried feeders is limited to the six circuits tabulated in Table B.52.18.",
    "uk": "Прототип симетричної радіальної трифазної мережі низької напруги з одним зовнішнім джерелом і одним двообмотковим трансформатором. Load-flow використовує навантаження сталих P/Q і не моделює фазну несиметрію, гармоніки чи струм нейтралі. Розрахунок КЗ побудований на вузловій моделі імпедансів прямої послідовності з окремими максимальним/мінімальним режимами джерела, поправкою KT мережевого трансформатора та опційним внеском асинхронних двигунів; він видає початкові симетричні струми та screening-піковий струм κ(R/X). Це не повна реалізація IEC 60909: повні мережі нульової/зворотної послідовності для несиметричних КЗ, струм відключення Ib, аперіодична складова, усталений струм і тепловий еквівалент/Joule-integral з коефіцієнтами m,n не реалізовані. TN/TT замикання на землю — installation-level screening, IT не підтримується. Родові характеристики автоматів, Icu/Icm і діапазонна перевірка селективності не можуть сертифікувати реальну комбінацію захистів; потрібні дані виробника та незалежна інженерна перевірка. Автопідбір кабелю успадковує обмежений перевірений піднабір Cable Sizing. Цей піднабір — 242 комірки (матеріал, спосіб прокладання, переріз) за IEC 60364-5-52 лише для ПВХ і трьох навантажених жил, тобто 23,6 % вхідної сітки того інструмента; групування підземних фідерів обмежено шістьма колами з таблиці B.52.18.",
    "de": "Prototyp eines symmetrischen radialen Dreiphasen-Niederspannungsnetzes mit einer vorgelagerten Netzquelle und einem Zweiwicklungstransformator. Der Lastfluss verwendet konstante P/Q-Lasten und bildet Phasenunsymmetrie, Oberschwingungen oder Neutralleiterstrom nicht ab. Die Kurzschlussberechnung ist ein nodales Mitsystem-Impedanzmodell mit getrennten Maximal-/Minimalquellfällen, KT-Korrektur des Netztransformators und optionalem Beitrag von Asynchronmotoren; ausgegeben werden Anfangskurzschlussströme und ein Spitzenstrom-Screening über κ(R/X). Es ist keine vollständige IEC-60909-Implementierung: vollständige Null-/Gegensystemnetze für unsymmetrische Fehler, Ausschaltstrom Ib, Gleichstromanteil, Dauerkurzschlussstrom und thermischer Ersatzstrom/Joule-Integral mit m,n sind nicht implementiert. TN/TT-Erdschlussprüfungen sind Installations-Screenings, IT wird nicht unterstützt. Generische Schalterkennlinien sowie Icu/Icm- und bereichsbasierte Selektivitätsprüfungen können keine reale Schutzgerätekombination zertifizieren; Herstellerdaten und unabhängige technische Verifikation sind erforderlich. Die automatische Kabeldimensionierung übernimmt den begrenzten verifizierten Strombelastbarkeitsbereich des Cable-Sizing-Werkzeugs. Dieser Bereich umfasst 242 Zellen (Werkstoff, Referenzverlegeart, Querschnitt) der IEC 60364-5-52 nur für PVC und drei belastete Adern, 23,6 % des Eingaberasters jenes Werkzeugs; die Häufung erdverlegter Abgänge ist auf die sechs in Tabelle B.52.18 tabellierten Stromkreise begrenzt.",
    "nl": "Prototype voor een symmetrisch radiaal driefasen-laagspanningsnet met één bovenliggende netbron en één tweewikkelingstransformator. De loadflow gebruikt constante P/Q-belastingen en modelleert geen fase-onbalans, harmonischen of nulstroom. De kortsluitberekening is een nodaal positieve-volgorde-impedantiemodel met afzonderlijke maximale/minimale brongevallen, KT-correctie van de nettransformator en optionele bijdrage van asynchrone motoren; zij rapporteert initiële symmetrische kortsluitstromen en een piekstroom-screening via κ(R/X). Het is geen volledige IEC 60909-implementatie: volledige nul-/negatieve-volgordenetten voor asymmetrische fouten, afschakelstroom Ib, DC-component, stationaire kortsluitstroom en thermisch equivalente/Joule-integraalberekeningen met m,n zijn niet geïmplementeerd. TN/TT-aardfoutcontroles zijn screenings op installatieniveau en IT wordt niet ondersteund. Generieke automaatcurven, Icu/Icm en bereikgebaseerde selectiviteit kunnen een echte beveiligingscombinatie niet certificeren; fabrikantgegevens en onafhankelijke technische verificatie zijn vereist. Automatische kabeldimensionering erft het beperkte geverifieerde ampaciteitsdeel van Cable Sizing. Dat deel omvat 242 cellen (materiaal, referentiemethode, doorsnede) van IEC 60364-5-52, uitsluitend voor PVC en drie belaste aders, 23,6 % van het invoerraster van die tool; groepering van ondergrondse feeders is beperkt tot de zes kringen van tabel B.52.18.",
    "fr": "Prototype de réseau basse tension triphasé équilibré et radial avec une seule source amont et un transformateur à deux enroulements. Le load-flow utilise des charges P/Q constantes et ne modélise ni déséquilibre de phases, ni harmoniques, ni courant de neutre. Le moteur de court-circuit est un modèle nodal d’impédance directe avec cas source maximum/minimum séparés, correction KT du transformateur de réseau et contribution optionnelle des moteurs asynchrones ; il fournit les courants symétriques initiaux et une valeur de crête de screening par κ(R/X). Il ne s’agit pas d’une implémentation complète d’IEC 60909 : réseaux complets homopolaire/inverse pour défauts dissymétriques, courant de coupure Ib, composante continue, courant permanent et courant thermique équivalent/intégrale de Joule avec m,n ne sont pas implémentés. Les contrôles de défaut à la terre TN/TT sont des screenings au niveau de l’installation et IT n’est pas pris en charge. Les courbes génériques de disjoncteur, Icu/Icm et le screening de sélectivité sur une plage de courant ne peuvent certifier une combinaison réelle ; les données constructeur et une vérification indépendante sont requises. Le dimensionnement automatique des câbles hérite du sous-ensemble limité et vérifié de Cable Sizing. Ce sous-ensemble compte 242 cellules (matériau, méthode de référence, section) de l'IEC 60364-5-52, uniquement PVC et trois conducteurs chargés, soit 23,6 % de la grille d'entrée de cet outil ; le groupement des départs enterrés est limité aux six circuits de la table B.52.18.",
    "es": "Prototipo de red de baja tensión trifásica equilibrada y radial con una sola fuente aguas arriba y un transformador de dos devanados. El flujo de carga usa cargas P/Q constantes y no modela desequilibrio de fases, armónicos ni corriente de neutro. El motor de cortocircuito es un modelo nodal de impedancia de secuencia positiva con casos máximo/mínimo de fuente separados, corrección KT del transformador de red y contribución opcional de motores asíncronos; informa corrientes iniciales simétricas y un valor pico de screening mediante κ(R/X). No es una implementación completa de IEC 60909: no se implementan redes completas de secuencia cero/negativa para defectos asimétricos, corriente de corte Ib, componente continua, corriente permanente ni corriente térmica equivalente/integral de Joule con m,n. Las comprobaciones TN/TT de defecto a tierra son screenings a nivel de instalación y el sistema IT no está soportado. Las curvas genéricas de interruptores, Icu/Icm y la selectividad evaluada sobre un rango no pueden certificar una combinación real de protecciones; se requieren datos del fabricante y verificación técnica independiente. El autodimensionado de cables hereda el subconjunto limitado y verificado de Cable Sizing. Ese subconjunto son 242 celdas (material, método de referencia, sección) de IEC 60364-5-52, solo PVC y tres conductores cargados, el 23,6 % de la rejilla de entrada de esa herramienta; el agrupamiento de alimentadores enterrados se limita a los seis circuitos de la tabla B.52.18.",
    "pl": "Prototyp symetrycznej, promieniowej, trójfazowej sieci niskiego napięcia z jednym źródłem sieciowym i jednym transformatorem dwuuzwojeniowym. Przepływ obciążenia wykorzystuje obciążenia stałej mocy PQ i nie modeluje asymetrii faz, harmonicznych ani prądu neutralnego. Silnik zwarciowy to model impedancji węzłowej składowej zgodnej z oddzielnymi przypadkami źródła maksymalnego/minimalnego, korekcją KT transformatora sieciowego i opcjonalnym wkładem silnika asynchronicznego; raportuje początkowe prądy symetryczne i wartość ekranowania prądu szczytowego κ(R/X). Nie jest to pełna implementacja normy IEC 60909: nie zaimplementowano pełnych sieci zwarciowych o niesymetrycznej składowej zerowej/przeciwnej, symetrycznego prądu wyłączania Ib, składowej stałej, prądu ustalonego ani obliczeń równoważnika cieplnego/całki Joule'a m,n. Kontrola zwarć doziemnych w sieciach TN/TT jest modelem ekranowania na poziomie instalacji, a model IT nie jest obsługiwany. Ogólne krzywe wyłączników, Icu/Icm i kontrole selektywności oparte na zakresie nie mogą stanowić potwierdzenia rzeczywistej kombinacji urządzeń zabezpieczających; wymagane są dane producenta i niezależna weryfikacja techniczna. Automatyczne dobieranie rozmiaru kabli dziedziczy ograniczony, zweryfikowany podzbiór obciążalności prądowej narzędzia do doboru rozmiaru kabli. Ten podzbiór obejmuje 242 (materiał, metoda odniesienia, przekrój) ogniwa normy IEC 60364-5-52 dla izolacji PVC i tylko trzech obciążonych przewodów, co stanowi 23,6% własnej siatki wejściowej tego narzędzia; grupowanie przewodów podziemnych jest ograniczone do sześciu obwodów zestawionych w tabeli B.52.18."

      "uk": "18 випадків КЗ і потокорозподілу за IEC 60909-0:2016 проведено через сторінку та порівняно з незалежною реалізацією на python, написаною за рівняннями самого стандарту, з перехресною перевіркою аналітичним послідовним опором і одним ручним розрахунком. Стенд авторський; жодна стороння особа його не перевіряла.",

const DGC_EQ=[
 "Network feeder: Z_Q = c * U_nQ^2 / S_kQ'', split by the given X/R, referred to the LV side by (U_LV/U_HV)^2  [IEC 60909-0:2016, 6.1 eq. (3) and (5)]",
 "Transformer: Z_T = (u_kr/100) U_rT^2/S_rT, R_T = P_krT/(3 I_rT^2), X_T = sqrt(Z_T^2 - R_T^2)  [IEC 60909-0:2016, 6.2 eq. (7)-(9)]",
 "Transformer correction: K_T = 0.95 c_max/(1 + 0.6 x_T), x_T = X_T S_rT/U_rT^2, applied to the short-circuit cases only  [IEC 60909-0:2016, 6.3.3]",
 "Cable: R(theta) = R_20 [1 + alpha (theta - 20 C)] L, X = x' L  [IEC 60909-0:2016, 6.4]",
 "Asynchronous motor: Z_M = (1/(I_LR/I_rM)) U_rM/(sqrt3 I_rM), split by the entered R/X  [IEC 60909-0:2016, 6.8 eq. (26)]",
 "Three-phase initial symmetrical current: I_k'' = c U_n/(sqrt3 |Z_k|) with the equivalent voltage source c U_n/sqrt3 at the fault point  [IEC 60909-0:2016, 4.2 eq. (29)]",
 "Line-to-line: I_k2'' = c U_n/|Z_1 + Z_2| = (sqrt3/2) I_k3'' for Z_2 = Z_1  [IEC 60909-0:2016, 4.2 eq. (34)]",
 "Peak: i_p = kappa sqrt2 I_k'', kappa = 1.02 + 0.98 exp(-3 R/X)  [IEC 60909-0:2016, 4.3.1.2 eq. (55)-(56)]",
 "Load flow: balanced constant-power nodal solution, I_i = conj(S_i/3 / V_i), swept until max|dV| < 1e-5 V; losses = sum 3 |I|^2 R",
 "Earth fault (TN): I_f = c_min U_0/|Z_s| with Z_s the upstream loop plus the phase and PE conductors of every feeder on the path  [IEC 60364-4-41:2005, 411.4.4]",
 "Adiabatic conductor check: S >= I sqrt(t)/k, k = 115 (Cu/PVC), 76 (Al/PVC)  [IEC 60364-4-43, table 43A]"
];
const DGC_RANGES=[
 "Balanced radial three-phase LV network, one upstream feeder and one two-winding transformer; 1 to 200 nodes",
 "Voltage factors 0.5 <= c_min <= c_max <= 1.5; conductor temperatures 20-90 C (load, Ik max) and up to 120 C (Ik min)",
 "Positive-sequence model only: Ib, I_k steady state, the d.c. component and the m/n Joule-integral factors of IEC 60909-0 clause 4.5-4.8 are not computed",
 "Unbalanced faults are covered only by the Z_2 = Z_1 line-to-line relation and by the installation-level TN/TT earth-loop screening; IT is unsupported"
];

function dgcDeserialize(o){
 if(!o||typeof o!=='object'||!Array.isArray(o.nodes)||!o.globals||typeof o.globals!=='object')
  throw new Error('unrecognised state payload');
 const prevState=state,prevSel=selected;
 useState({version:2,globals:o.globals,nodes:o.nodes});
 migrateState();
 const errs=validateNetwork();
 if(errs.length){useState(prevState);selected=prevSel;migrateState();throw new Error(errs[0])}
 if(o.lang&&(I18N[o.lang]||I18N_EXT[o.lang])){lang=o.lang;lsSet('electricalNetworkLang',lang);setText()}
 selected=node(o.sel)?o.sel:'LV';
 syncGlobalsToUI();render();
}

function dgcRecord(){
 const out=dgcOutputs();
 if(!out)return null;
 const w=[];
 (calc.rootIssues||[]).forEach(x=>w.push(x));
 const r=calc.rows[selected];
 if(r)(r.issues||[]).forEach(x=>w.push(node(selected).name+': '+x));
 if(state.globals.earthing==='none')w.push(t('earthNone'));
 w.push(t('iecDelta'));
 return{inputs:dgcInputs(),outputs:out,
  units:Object.assign({},DGC_IN_UNITS,DGC_OUT_UNITS),
  model:{equations:DGC_EQ,ranges:DGC_RANGES,
   notes:['Selected node: '+selected+' ('+(node(selected)?node(selected).name:'—')+').',
    'Conductor model: R20 = 18.56 (Cu) / 29.38 (Al) ohm mm2/km, alpha = 0.00393 / 0.00403 per K, overridable per feeder.']},
  warnings:[...new Set(w)]};

function dgcPython(){
 if(!calc||!calc.ok)return null;
 return{code:DGC_PY(),requires:[],
  scope:'the complete model of this page for the network loaded at export time: IEC 60909-0 source, '+
   'transformer, cable and motor impedances, the nodal short-circuit solution with the equivalent '+
   'voltage source at the fault point (maximum with motors, minimum without), kappa and i_p, the '+
   'balanced load flow and the TN/TT earth-fault loop. The generic breaker curves, ampacity tables '+
   'and selectivity screening of the page are NOT reproduced.',
  selftest:{tolerance:1e-6,
   note:'the page stops its load-flow sweep at max|dV| < 1e-5 V, so load-flow figures can differ from this script in the 8th significant digit'}};
}
function dgcHandoff(){

 else if(Number.isFinite(out.source_current_A))q.I={value:out.source_current_A,unit:'A'};
 const nd=node(selected);
 if(nd&&nd.branch)q.L={value:+nd.branch.length,unit:'m'};

   const xr=Math.abs(z.re)>1e-15?Math.abs(z.im/z.re):1e12;
   return {Z:{value:zm,unit:'Ω'},XR:{value:xr,unit:'-'}};
 }

function DGC_PY(){return "SQ3 = math.sqrt(3.0)\nRHO20 = {\"cu\": 18.56, \"al\": 29.38}      # ohm mm2/km at 20 C\nALPHA = {\"cu\": 0.00393, \"al\": 0.00403}  # 1/K\n\n\ndef _nodes():\n    return {n[\"id\"]: n for n in NETWORK}\n\n\ndef z_feeder(mode):\n    \"\"\"IEC 60909-0:2016, 6.1 eq. (3) and (5).\"\"\"\n    c = C_MAX if mode != \"min\" else C_MIN\n    sk = (SK_MAX if mode != \"min\" else SK_MIN) * 1e6\n    zmag = c * HV_VOLTAGE ** 2 / sk\n    r = zmag / math.sqrt(1.0 + SOURCE_XR ** 2)\n    x = SOURCE_XR * r\n    t = LV_VOLTAGE / HV_VOLTAGE\n    return complex(r * t * t, x * t * t)\n\n\ndef z_transformer():\n    \"\"\"IEC 60909-0:2016, 6.2 eq. (7)-(9); returns (Z_T, K_T).\"\"\"\n    s = TRANSFORMER_RATING * 1000.0\n    zb = LV_VOLTAGE ** 2 / s\n    zt = TRANSFORMER_UK / 100.0 * zb\n    rt = TRANSFORMER_PK * 1000.0 * LV_VOLTAGE ** 2 / (s * s)\n    xt = math.sqrt(max(0.0, zt * zt - rt * rt))\n    kt = 0.95 * C_MAX / (1.0 + 0.6 * xt / zb) if APPLY_KT else 1.0\n    return complex(rt, xt), kt\n\n\ndef z_source(mode):\n    zt, kt = z_transformer()\n    if mode == \"operating\":\n        return z_feeder(\"max\") + zt\n    return z_feeder(mode) + kt * zt\n\n\ndef z_branch(b, temp):\n    \"\"\"IEC 60909-0:2016, 6.4 - conductor resistance at the stated temperature.\"\"\"\n    r = b[\"r20_ohm_km\"] * (1.0 + ALPHA[b[\"material\"]] * (temp - 20.0)) * b[\"length_m\"] / 1000.0\n    x = b[\"x_ohm_km\"] * b[\"length_m\"] / 1000.0\n    return complex(r, x)\n\n\ndef z_pe(b, temp):\n    mat = b[\"peMaterial\"]\n    r = RHO20[mat] / b[\"peSection\"] * (1.0 + ALPHA[mat] * (temp - 20.0)) * b[\"length_m\"] / 1000.0\n    x = b[\"peX_ohm_km\"] * b[\"length_m\"] / 1000.0\n    return complex(r, x)\n\n\ndef z_motor(n):\n    \"\"\"IEC 60909-0:2016, 6.8 eq. (26).\"\"\"\n    if n[\"type\"] != \"load\" or n[\"kind\"] != \"motor\" or not n[\"motorSC\"]:\n        return None\n    ir = n[\"P_kW\"] * 1000.0 / (SQ3 * LV_VOLTAGE * n[\"pf\"] * n[\"eff\"])\n    if ir <= 0:\n        return None\n    zmag = LV_VOLTAGE / (SQ3 * ir * n[\"motorILR\"])\n    x = zmag / math.sqrt(1.0 + n[\"motorRX\"] ** 2)\n    return complex(n[\"motorRX\"] * x, x)\n\n\ndef _solve(a, b):\n    \"\"\"Gaussian elimination with partial pivoting on complex numbers.\"\"\"\n    n = len(b)\n    m = [list(a[i]) + [b[i]] for i in range(n)]\n    for k in range(n):\n        p = max(range(k, n), key=lambda i: abs(m[i][k]))\n        if abs(m[p][k]) < 1e-18:\n            raise ZeroDivisionError(\"singular admittance matrix\")\n        m[k], m[p] = m[p], m[k]\n        d = m[k][k]\n        for j in range(k, n + 1):\n            m[k][j] /= d\n        for i in range(n):\n            if i == k:\n                continue\n            f = m[i][k]\n            if f == 0:\n                continue\n            for j in range(k, n + 1):\n                m[i][j] -= f * m[k][j]\n    return [m[i][n] for i in range(n)]\n\n\ndef _admittance(mode, motors):\n    ids = [n[\"id\"] for n in NETWORK]\n    idx = {k: i for i, k in enumerate(ids)}\n    temp = CABLE_TEMP_SC_MAX if mode == \"max\" else CABLE_TEMP_SC_MIN\n    y = [[0j] * len(ids) for _ in ids]\n    y[idx[\"LV\"]][idx[\"LV\"]] += 1.0 / z_source(mode)\n    for n in NETWORK:\n        if n[\"id\"] == \"LV\":\n            continue\n        adm = 1.0 / z_branch(n[\"branch\"], temp)\n        i, j = idx[n[\"parent\"]], idx[n[\"id\"]]\n        y[i][i] += adm\n        y[j][j] += adm\n        y[i][j] -= adm\n        y[j][i] -= adm\n    if mode == \"max\" and motors:\n        for n in NETWORK:\n            zm = z_motor(n)\n            if zm is not None:\n                y[idx[n[\"id\"]]][idx[n[\"id\"]]] += 1.0 / zm\n    return ids, idx, y, temp\n\n\ndef fault(node_id, mode, c, motors=True):\n    \"\"\"Equivalent voltage source c U_n/sqrt3 applied at the fault node\n    (IEC 60909-0:2016, 4.2): the faulted node is the only driven node.\"\"\"\n    ids, idx, y, temp = _admittance(mode, motors)\n    n = len(ids)\n    f = idx[node_id]\n    e = c * LV_VOLTAGE / SQ3\n    rest = [i for i in range(n) if i != f]\n    v = [0j] * n\n    v[f] = e\n    if rest:\n        a = [[y[i][j] for j in rest] for i in rest]\n        rhs = [-y[i][f] * e for i in rest]\n        sol = _solve(a, rhs)\n        for i, k in enumerate(rest):\n            v[k] = sol[i]\n    ifault = sum(y[f][j] * v[j] for j in range(n))\n    br = {}\n    for nd in NETWORK:\n        if nd[\"id\"] == \"LV\":\n            continue\n        br[nd[\"id\"]] = (v[idx[nd[\"parent\"]]] - v[idx[nd[\"id\"]]]) / z_branch(nd[\"branch\"], temp)\n    br[\"MAIN\"] = -v[idx[\"LV\"]] / z_source(mode)\n    return {\"E\": e, \"Ik\": abs(ifault), \"Z\": e / ifault, \"branch\": br}\n\n\ndef kappa(z):\n    \"\"\"IEC 60909-0:2016, 4.3.1.2 eq. (56).\"\"\"\n    if z.imag <= 0:\n        return 1.02\n    return 1.02 + 0.98 * math.exp(-3.0 * max(0.0, z.real / z.imag))\n\n\ndef load_flow():\n    \"\"\"Balanced constant-power radial sweep, identical convergence test to the page.\"\"\"\n    nodes = _nodes()\n    e = complex(LV_VOLTAGE / SQ3, 0.0)\n    zs = z_source(\"operating\")\n    v = {k: e for k in nodes}\n    kids = {k: [n[\"id\"] for n in NETWORK if n[\"parent\"] == k] for k in nodes}\n\n    def depth(k):\n        d = 0\n        while nodes[k][\"parent\"]:\n            k = nodes[k][\"parent\"]\n            d += 1\n        return d\n\n    order = sorted(nodes, key=depth, reverse=True)\n    ibr = {}\n    for _ in range(200):\n        loc = {}\n        for k, n in nodes.items():\n            if n[\"type\"] != \"load\" or n[\"P_kW\"] <= 0:\n                loc[k] = 0j\n                continue\n            p = n[\"P_kW\"] * 1000.0\n            if n[\"kind\"] == \"motor\":\n                p /= n[\"eff\"]\n            q = p * math.tan(math.acos(n[\"pf\"]))\n            loc[k] = ((complex(p, q) / 3.0) / v[k]).conjugate()\n        for k in order:\n            if k == \"LV\":\n                continue\n            ibr[k] = loc[k] + sum(ibr.get(c, 0j) for c in kids[k])\n        root = sum(ibr.get(c, 0j) for c in kids[\"LV\"])\n        nv = {\"LV\": e - zs * root}\n        queue = [\"LV\"]\n        while queue:\n            p = queue.pop(0)\n            for c in kids[p]:\n                nv[c] = nv[p] - z_branch(nodes[c][\"branch\"], CABLE_TEMP_LOAD) * ibr[c]\n                queue.append(c)\n        md = max(abs(nv[k] - v[k]) for k in nodes)\n        v = nv\n        if md < 1e-12:\n            break\n    root = sum(ibr.get(c, 0j) for c in kids[\"LV\"])\n    loss = sum(3.0 * abs(ibr[k]) ** 2 * z_branch(nodes[k][\"branch\"], CABLE_TEMP_LOAD).real\n               for k in nodes if k != \"LV\")\n    return v, ibr, root, loss\n\n\ndef earth_fault(node_id):\n    \"\"\"IEC 60364-4-41:2005, 411.4.4 / 411.5 loop impedance.\"\"\"\n    if EARTHING == \"TN\":\n        z = complex(EARTH_LOOP_R / 1000.0, EARTH_LOOP_X / 1000.0)\n    elif EARTHING == \"TT\":\n        z = complex(EARTH_RA + EARTH_RB, 0.0)\n    else:\n        return None\n    nodes = _nodes()\n    k = node_id\n    while k != \"LV\":\n        b = nodes[k][\"branch\"]\n        z += z_branch(b, CABLE_TEMP_SC_MIN) + z_pe(b, CABLE_TEMP_SC_MIN)\n        k = nodes[k][\"parent\"]\n    return C_MIN * LV_VOLTAGE / SQ3 / abs(z)\n\n\ndef compute():\n    \"\"\"Recompute everything the tool displayed, from INPUTS.\"\"\"\n    v, ibr, root, loss = load_flow()\n    lv = fault(\"LV\", \"max\", C_MAX, True)\n    lv_min = fault(\"LV\", \"min\", C_MIN, False)\n    klv = kappa(lv[\"Z\"])\n    out = {\n        \"LV_Ik_max_kA\": lv[\"Ik\"] / 1000.0,\n        \"LV_Ik_min_kA\": lv_min[\"Ik\"] / 1000.0,\n        \"LV_ip_kA\": klv * math.sqrt(2.0) * lv[\"Ik\"] / 1000.0,\n        \"LV_kappa\": klv,\n        \"source_current_A\": abs(root),\n        \"transformer_loading_kVA\": SQ3 * LV_VOLTAGE * abs(root) / 1000.0,\n        \"transformer_loading_pct\": 100.0 * SQ3 * LV_VOLTAGE * abs(root) / 1000.0 / TRANSFORMER_RATING,\n        \"cable_losses_kW\": loss / 1000.0,\n    }\n    s = SELECTED_NODE\n    if s != \"LV\":\n        fm = fault(s, \"max\", C_MAX, True)\n        f0 = fault(s, \"max\", C_MAX, False)\n        fn = fault(s, \"min\", C_MIN, False)\n        k = kappa(fm[\"Z\"])\n        zdev = fm[\"E\"] / fm[\"branch\"][s]\n        if zdev.real < 0:\n            zdev = -zdev\n        ull = abs(v[s]) * SQ3\n        out.update({\n            \"node_current_A\": abs(ibr[s]),\n            \"node_voltage_V\": ull,\n            \"node_voltage_drop_pct\": 100.0 * (LV_VOLTAGE - ull) / LV_VOLTAGE,\n            \"node_Ik_max_kA\": fm[\"Ik\"] / 1000.0,\n            \"node_Ik_min_kA\": fn[\"Ik\"] / 1000.0,\n            \"node_ip_kA\": k * math.sqrt(2.0) * fm[\"Ik\"] / 1000.0,\n            \"node_kappa\": k,\n            \"node_motor_contribution_kA\": max(0.0, fm[\"Ik\"] - f0[\"Ik\"]) / 1000.0,\n            \"device_Ik_max_kA\": abs(fm[\"branch\"][s]) / 1000.0,\n            \"device_Ik2_min_kA\": SQ3 / 2 * abs(fn[\"branch\"][s]) / 1000.0,\n            \"device_ip_kA\": kappa(zdev) * math.sqrt(2.0) * abs(fm[\"branch\"][s]) / 1000.0,\n        })\n        ef = earth_fault(s)\n        if ef is not None:\n            out[\"earth_fault_current_kA\"] = ef / 1000.0\n    return out\n"}

   'Jeder Knoten außer der Haupt-Niederspannungsschiene hängt an genau einem Abgang seiner übergeordneten Schiene. Ein Wechsel der übergeordneten Schiene verlegt diesen Abgang; eine Schiene kann nie ihr eigener Nachfolger werden. Eine Schiene trägt keine eigene Last.',

   'Chaque nœud, sauf le jeu de barres BT principal, est alimenté par un seul départ issu de son jeu de barres parent. Changer le parent déplace ce départ ; un jeu de barres ne peut jamais devenir son propre descendant. Un jeu de barres ne porte pas de charge propre.',
   'Cada nodo, salvo la barra BT principal, cuelga de un único alimentador de su barra padre. Cambiar el padre traslada ese alimentador; una barra nunca puede ser descendiente de sí misma. Una barra no lleva carga propia.')},
  load:{title:L('loadData'),body:T(
   'A static load is a constant active and reactive power drawn from its bus. A motor is entered by its shaft output: the electrical input is that output divided by the efficiency, and when its short-circuit contribution is enabled the locked-rotor impedance of IEC 60909-0 eq. (26) is added to the fault network.',
   'Статичне навантаження — стала активна та реактивна потужність, що споживається від шини. Двигун задається потужністю на валу: спожита потужність дорівнює цій потужності, поділеній на ККД, а якщо ввімкнено внесок у КЗ, до мережі короткого замикання додається опір загальмованого ротора за IEC 60909-0, рів. (26).',
   'Eine statische Last ist eine konstante Wirk- und Blindleistung an ihrer Schiene. Ein Motor wird über seine Wellenleistung eingegeben: die aufgenommene Leistung ist diese Wellenleistung geteilt durch den Wirkungsgrad, und bei aktiviertem Kurzschlussbeitrag wird die Läuferstillstandsimpedanz nach IEC 60909-0 Gl. (26) in das Fehlernetz eingefügt.',
   'Een statische belasting is een constant actief en reactief vermogen aan zijn rail. Een motor wordt ingevoerd met zijn asvermogen: het opgenomen vermogen is dat asvermogen gedeeld door het rendement, en bij ingeschakelde kortsluitbijdrage wordt de impedantie bij geblokkeerde rotor volgens IEC 60909-0 verg. (26) aan het foutnet toegevoegd.',
   'Une charge statique est une puissance active et réactive constante appelée sur son jeu de barres. Un moteur est saisi par sa puissance à l’arbre : la puissance absorbée est cette puissance divisée par le rendement, et si sa contribution au court-circuit est activée, l’impédance à rotor bloqué de l’IEC 60909-0 éq. (26) est ajoutée au réseau de défaut.',
   'Una carga estática es una potencia activa y reactiva constante tomada de su barra. Un motor se introduce por su potencia en el eje: la potencia absorbida es esa potencia dividida por el rendimiento y, si se activa su contribución al cortocircuito, se añade a la red de defecto la impedancia de rotor bloqueado de IEC 60909-0 ec. (26).')},

  fault:{title:L('busFault'),body:T(
   'The bus fault current is the total current into a fault at that bus. The device figures are the part of it that flows through this feeder and its breaker, which is what the breaker actually has to interrupt; the two differ whenever motors or other paths feed the fault from elsewhere.',
   'Струм КЗ на шині — повний струм у місці пошкодження на цій шині. Величини «через пристрій» — та його частина, що протікає цим фідером і його автоматом, тобто те, що автомат справді має відключити; вони різняться, коли двигуни або інші шляхи живлять пошкодження з іншого боку.',
   'Der Schienenfehlerstrom ist der gesamte Strom in einen Fehler an dieser Schiene. Die Gerätewerte sind der Anteil davon, der über diesen Abgang und seinen Schalter fließt, also das, was der Schalter tatsächlich abschalten muss; beide unterscheiden sich, sobald Motoren oder andere Pfade den Fehler von anderer Seite speisen.',

   'Le courant de défaut au jeu de barres est le courant total dans un défaut à ce jeu de barres. Les valeurs « appareil » en sont la part qui traverse ce départ et son disjoncteur, c’est-à-dire ce que le disjoncteur doit réellement couper ; les deux diffèrent dès que des moteurs ou d’autres chemins alimentent le défaut par ailleurs.',

function a11yOneLine(){
 const lvf=calc?.sc?.LV;
 return t('oneLine')+': '+state.nodes.length+' '+t('nodes')+', '+(state.nodes.length-1)+' '+t('feeders')+'. '
  +t('rootIkMax')+' '+fmt((lvf?.IkMax||NaN)/1000,2)+' kA. '+t('selected')+': '+(node(selected)?.name||'—')}
function a11yCurve(){const n=node(selected);
 return t('curveTitle')+': '+(n&&n.id!=='LV'&&n.branch.breaker?.on?n.name:t('selNA'))}
function buildStage(host,app){
 oneLineStage=app.stage({minHeight:430,caption:L('clickHint'),a11y:a11yOneLine,render:()=>{diagram()}});
 const h=document.createElement('div');h.className='en-stagehead';
 const ttl=document.createElement('h2');ttl.textContent=t('oneLine');h.appendChild(ttl);
 h.appendChild(app.learnButton('oneline'));
 oneLineStage.node.insertBefore(h,oneLineStage.body);
 const wrap=document.createElement('div');wrap.className='en-svgwrap';
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.id='oneLine';svg.setAttribute('role','img');svg.setAttribute('aria-label',t('oneLine'));
 wrap.appendChild(svg);oneLineStage.body.appendChild(wrap)}

 curveStage=app.stage({slot:'dock',minHeight:300,caption:L('curveNote'),a11y:a11yCurve,

   if(cv.width!==w||cv.height!==hh){cv.width=w;cv.height=hh}
   cv.style.width=size.w+'px';cv.style.height=size.h+'px';drawCurve(node(selected))}});

 mk(t('scope'),'<p>'+esc(t('scopeText2'))+'</p><p>'+esc(t('iecDelta'))+'</p>','scope');

  'IEC 60947-2:2024 — circuit-breakers',
  'IEC 60228:2023 — cable conductors'].map(x=>'<div>'+esc(x)+'</div>').join(''));
 mk(t('qa'),'<p>'+esc(t('qaSelfCheck'))+'</p><div id="qaBox"></div>','qa')}
function applyAttrs(app){(app.panels||[]).forEach(p=>(p.fields||[]).forEach(f=>{
 const a=f.def.attrs,c=f.control;
 if(a&&c&&c.setAttribute)for(const k in a)c.setAttribute(k,a[k]);
 if(f.def.placeholder&&c&&'placeholder'in c)c.placeholder=f.def.placeholder;
 if(!f.box)return;
 /* diagram-ui.js renders a toggle as <span class="dgu-toggle"><input type=checkbox>>
    and points the field label at the span, which is not a labelable element: the
    only hit target is the 18px checkbox, below the 44px minimum of spec 4.5, and
    the checkbox carries no accessible name. Repaired here; belongs upstream. */
 f.box.setAttribute('aria-label',DiagramUI.pick(f.def.label,app.lang));
 const fwd=e=>{if(e.target!==f.box&&!e.target.closest('button'))f.box.click()};
 if(c&&!c._enTap){c._enTap=1;c.style.cursor='pointer';c.addEventListener('click',fwd)}
 const lab=f.node&&f.node.querySelector('label.dgu-flabel');
 if(lab&&!lab._enTap){lab._enTap=1;lab.style.cursor='pointer';lab.addEventListener('click',fwd)}}))}

/* ---- boot ---- */
let fbMode=false;
function boot(){
 if(!window.DiagramUI||DiagramUI.api!=='tools.petrov.re/ui/v1'){fallbackBoot();dgcInit();return}
 if(LANGS.includes(DiagramUI.lang()))lang=DiagramUI.lang();
 setText();
 ui=DiagramUI.app({
  id:'electricalnetwork',mount:'#app',layout:'studio',compute:'live',
  state:state,defaults:()=>example(),
  subtitle:L('subtitle'),
  learn:LEARN,panels:PANELS,
  regions:{stage:buildStage,dock:buildDock},
  footer:buildFooter,
  history:{capture:histCapture,restore:histRestore},
  on:{
   compute:function(){calc=evaluate();paint();return resultsData()},
   reset:function(s,app){useState(s);selected='DB1';migrateState()},
   lang:function(l){if(LANGS.includes(l)){lang=l;lsSet('electricalNetworkLang',l);setText()}},
   ready:function(app){
    const _push=app.history.push.bind(app.history);
    app.history.push=function(){if(_hgate)_push()};
    actionPanel=(app.panels||[]).filter(function(p){return p.def.id==='p-nodeact'})[0]||null;
    applyAttrs(app);runQA();paint();
   }
  }
 });
 ui.ready();
 dgcInit();
 window.__electricalnetwork={ui:ui,state:()=>state,render:render};
}
/* Degrade honestly: with diagram-ui.js blocked the same fields, the same model
   and every export still work, in one plain column. */
function pk(v){return typeof v==='function'?String(v()):(v&&typeof v==='object'?(v[lang]||v.en||''):(v==null?'':String(v)))}
function fbControl(f,host){
 const wrap=document.createElement('label');
 const type=f.type||'number';
 if(type==='note')return;
 wrap.appendChild(document.createTextNode(pk(f.label)+(f.unit?' ['+f.unit+']':'')));
 let c;
 if(type==='select'){c=document.createElement('select');
  const opts=typeof f.options==='function'?f.options():(f.options||[]);
  opts.forEach(o=>{const op=document.createElement('option');op.value=o[0];op.textContent=pk(o[1]);c.appendChild(op)})}
 else if(type==='toggle'){c=document.createElement('input');c.type='checkbox'}
 else{c=document.createElement('input');c.type=type==='text'?'text':'number';
  if(f.attrs)for(const k in f.attrs)c.setAttribute(k,f.attrs[k])}
 c.dataset.fb='1';f._fb=c;
 c.addEventListener('change',()=>{
  const v=type==='toggle'?c.checked:(type==='number'||!type)?(c.value===''?null:parseFloat(c.value)):c.value;
  f.set(v,state);render()});
 if(type==='number'||type==='text')c.addEventListener('input',()=>{
  const v=type==='text'?c.value:(c.value===''?null:parseFloat(c.value));f.set(v,state);render()});
 wrap.appendChild(c);host.appendChild(wrap)}
function fbSync(){PANELS.forEach(p=>(p.fields||[]).forEach(f=>{const c=f._fb;if(!c)return;
 const vis=typeof f.visible==='function'?f.visible({state:state}):true;
 c.closest('label').hidden=!vis;if(!vis)return;
 const v=f.get?f.get(state,{state:state}):null;
 if(c.type==='checkbox')c.checked=!!v;else if(document.activeElement!==c)c.value=(v==null?'':v)}))}
function fallbackBoot(){
 fbMode=true;
 const host=$('app')||document.body;host.className='en-fallback';
 let mf=null;try{mf=JSON.parse($('diagram-tool-manifest').textContent)}catch(e){}
 const h1=document.createElement('h1');
 h1.textContent=(mf&&mf.title&&(mf.title[lang]||mf.title.en))||'Electrical Network';
 host.appendChild(h1);
 const note=document.createElement('p');note.className='en-small';
 note.textContent='The shared interface layer (diagram-ui.js) did not load. Every input, the model, the diagram and every export still work; the page falls back to one plain column.';
 host.appendChild(note);
 const res=document.createElement('div');res.id='fbResults';host.appendChild(res);
 const wrap=document.createElement('div');wrap.className='en-svgwrap';
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.id='oneLine';svg.setAttribute('role','img');svg.setAttribute('aria-label',t('oneLine'));
 wrap.appendChild(svg);host.appendChild(wrap);
 PANELS.forEach(p=>{
  const fs=document.createElement('fieldset');
  const lg=document.createElement('legend');lg.textContent=pk(p.title)||t('networkActions');fs.appendChild(lg);
  (p.fields||[]).forEach(f=>fbControl(f,fs));
  (p.actions||[]).forEach(a=>{const b=document.createElement('button');b.type='button';
   b.textContent=pk(a.label);b.addEventListener('click',()=>a.run());fs.appendChild(b)});
  if(p.id==='p-reset'){const b=document.createElement('button');b.type='button';b.textContent=t('reset');
   b.addEventListener('click',()=>{if(confirm(t('confirmReset'))){useState(example());selected='DB1';render()}});fs.appendChild(b)}
  if(p.id==='p-network'){const f=document.createElement('input');f.type='file';f.id='importFile';
   f.accept='application/json,.json';f.hidden=true;f.setAttribute('aria-label',t('importJson'));
   f.addEventListener('change',e=>e.target.files[0]&&importJSON(e.target.files[0]));fs.appendChild(f)}
  if(p.id==='p-inspect'){const w=document.createElement('div');
   w.innerHTML='<div class="en-inspectname" id="iTitle">—</div><div class="en-inspectmeta" id="iMeta">—</div><span class="dgu-chip" id="iStatus">—</span><div id="rootInspector" class="en-small"></div>';
   fs.appendChild(w)}
  if(p.id==='p-selres'){const d=document.createElement('div');d.id='selectedResult';d.className='en-small';fs.appendChild(d)}
  host.appendChild(fs)});
 const cv=document.createElement('canvas');cv.id='curve';cv.style.height='320px';host.appendChild(cv);
 const fbCanvas=()=>{const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=Math.max(240,cv.clientWidth||280),hh=320;
  cv.width=Math.round(w*dpr);cv.height=Math.round(hh*dpr);drawCurve(node(selected))};
 window.addEventListener('resize',fbCanvas);requestAnimationFrame(fbCanvas);
 const qa=document.createElement('div');qa.id='qaBox';qa.className='en-small';host.appendChild(qa);
 runQA();render()}
function fbRefresh(){calc=evaluate();paint();
 const rd=$('fbResults');
 if(rd){rd.innerHTML='';const d=resultsData();
  const v=document.createElement('div');v.textContent=d.verdict.text;rd.appendChild(v);
  const tl=document.createElement('div');tl.className='en-small';
  tl.innerHTML=d.tiles.map(x=>esc(pk(x.label))+': <b>'+esc(x.value)+'</b> '+esc(x.unit||'')).join(' · ');
  rd.appendChild(tl);d.nodes.forEach(n=>rd.appendChild(n))}
 fbSync()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
