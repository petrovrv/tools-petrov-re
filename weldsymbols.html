  "title": {"en":"Welding symbols (ISO 2553 / AWS A2.4)","uk":"Познаки зварних швів (ISO 2553 / AWS A2.4)","de":"Schweißsymbole (ISO 2553 / AWS A2.4)","nl":"Lassymbolen (ISO 2553 / AWS A2.4)","fr":"Symboles de soudage (ISO 2553 / AWS A2.4)","es":"Símbolos de soldadura (ISO 2553 / AWS A2.4)","pl":"Znaki spawalnicze (ISO 2553 / AWS A2.4)"},
  "summary": {"en":"A searchable reference to the welding symbols used on drawings: the reference line and arrow, the elementary weld symbols, contour, finish, supplementary symbols and the dimension letters, each one drawn.","uk":"Довідник познак зварних швів на кресленнях: лінія-виноска і стрілка, основні познаки швів, форма поверхні, оброблення, додаткові познаки та розмірні літери — кожна з рисунком.","de":"Nachschlagewerk der Schweißsymbole auf Zeichnungen: Bezugslinie und Pfeil, elementare Nahtsymbole, Oberflächenform, Nachbearbeitung, Zusatzsymbole und Maßbuchstaben — jedes gezeichnet.","nl":"Naslagwerk voor lassymbolen op tekeningen: referentielijn en pijl, elementaire lassymbolen, contour, nabewerking, aanvullende symbolen en maatletters — elk getekend.","fr":"Référence des symboles de soudage sur les plans : ligne de référence et flèche, symboles élémentaires, contour, finition, symboles complémentaires et lettres de cotation, chacun dessiné.","es":"Referencia de los símbolos de soldadura en planos: línea de referencia y flecha, símbolos elementales, contorno, acabado, símbolos complementarios y letras de acotación, cada uno dibujado.","pl":"Przeszukiwalny katalog znaków spawalniczych stosowanych na rysunkach: linia odniesienia i strzałka, podstawowe znaki spoin, kontur, obróbka, znaki dodatkowe i litery wymiarowe — każdy narysowany."},
  "description": {"en":"A lookup, not a calculation. It lists the symbol vocabulary of ISO 2553 and AWS A2.4 — the parts of the reference-line assembly, the elementary weld symbols, the contour and finish symbols, the supplementary symbols and the dimension letters — with a schematic drawing of each one, what it means, and where a reader meets it. Filter by group and by standard, or search the names and the meanings.","uk":"Це довідник, а не розрахунок. Подано словник познак ISO 2553 та AWS A2.4 — частини виноски, основні познаки швів, познаки форми поверхні та оброблення, додаткові познаки й розмірні літери — зі схематичним рисунком, поясненням і типовим застосуванням. Фільтр за групою та стандартом або пошук.","de":"Ein Nachschlagewerk, keine Berechnung. Es listet das Symbolvokabular von ISO 2553 und AWS A2.4 — die Teile der Bezugslinie, die elementaren Nahtsymbole, Oberflächen- und Nachbearbeitungssymbole, Zusatzsymbole und Maßbuchstaben — mit schematischer Zeichnung, Bedeutung und typischer Verwendung. Filter nach Gruppe und Norm oder Suche.","nl":"Een naslagwerk, geen berekening. Het toont de symbolen van ISO 2553 en AWS A2.4 — de delen van de referentielijn, de elementaire lassymbolen, contour- en nabewerkingssymbolen, aanvullende symbolen en maatletters — met een schematische tekening, de betekenis en waar je ze tegenkomt. Filter op groep en norm, of zoek.","fr":"Une consultation, pas un calcul. L'outil recense le vocabulaire symbolique d'ISO 2553 et d'AWS A2.4 — les éléments de la ligne de référence, les symboles élémentaires, les symboles de contour et de finition, les symboles complémentaires et les lettres de cotation — avec un dessin schématique, la signification et l'usage courant. Filtrage par groupe et par norme, ou recherche.","es":"Una consulta, no un cálculo. Recoge el vocabulario simbólico de ISO 2553 y AWS A2.4 — las partes de la línea de referencia, los símbolos elementales, los de contorno y acabado, los complementarios y las letras de acotación — con un dibujo esquemático, su significado y dónde aparece. Filtre por grupo y norma, o busque.","pl":"To wyszukiwarka, a nie obliczenia. Zestawia słownik znaków ISO 2553 i AWS A2.4 — elementy zespołu linii odniesienia, podstawowe znaki spoin, znaki konturu i obróbki, znaki dodatkowe i litery wymiarowe — z rysunkiem schematycznym każdego z nich, jego znaczeniem i miejscem, w którym czytelnik go spotyka. Filtruj według grupy i normy albo przeszukaj nazwy i znaczenia."},
  "status": "prototype",
  "independent_validation": false,
  "limitations": {"en":"A reading aid, not the standards. The drawings are schematic: they show the shape of each symbol, not the construction proportions, line widths or text heights that ISO 2553 and AWS A2.4 prescribe. The list is the common vocabulary, not the complete set, and it does not carry the standards' rules for combining, dimensioning and positioning symbols, nor any national annex. Nothing here has legal force on a drawing; read the standard itself before you sign one.","uk":"Це допоміжний довідник, а не стандарт. Рисунки схематичні: вони показують форму познаки, а не побудовні пропорції, товщини ліній чи висоти шрифту, приписані ISO 2553 і AWS A2.4. Наведено поширений словник, а не повний набір, без правил поєднання, простановки розмірів і розташування познак та без національних додатків. Юридичної сили це не має — читайте сам стандарт.","de":"Eine Lesehilfe, nicht die Norm. Die Zeichnungen sind schematisch: Sie zeigen die Form des Symbols, nicht die Konstruktionsproportionen, Linienbreiten oder Schrifthöhen nach ISO 2553 und AWS A2.4. Aufgeführt ist das gebräuchliche Vokabular, nicht der vollständige Satz, ohne die Regeln zur Kombination, Bemaßung und Anordnung und ohne nationale Anhänge. Rechtlich verbindlich ist allein die Norm selbst.","nl":"Een leeshulp, niet de norm. De tekeningen zijn schematisch: ze tonen de vorm van het symbool, niet de constructieverhoudingen, lijndikten of teksthoogten die ISO 2553 en AWS A2.4 voorschrijven. De lijst is het gangbare vocabulaire, niet de volledige set, en bevat niet de regels voor combineren, bematen en plaatsen, noch nationale bijlagen. Alleen de norm zelf is bindend.","fr":"Une aide à la lecture, pas la norme. Les dessins sont schématiques : ils donnent la forme du symbole, non les proportions de construction, les largeurs de trait ou les hauteurs d'écriture prescrites par l'ISO 2553 et l'AWS A2.4. La liste est le vocabulaire courant, non l'ensemble complet, et n'inclut ni les règles de combinaison, de cotation et de position, ni les annexes nationales. Seule la norme fait foi.","es":"Una ayuda de lectura, no la norma. Los dibujos son esquemáticos: muestran la forma del símbolo, no las proporciones de construcción, los grosores de línea ni las alturas de texto que prescriben ISO 2553 y AWS A2.4. La lista es el vocabulario habitual, no el conjunto completo, y no incluye las reglas de combinación, acotación y posición ni los anexos nacionales. Solo la norma tiene valor legal.","pl":"Pomoc w czytaniu, a nie normy. Rysunki są schematyczne: pokazują kształt każdego znaku, a nie proporcje konstrukcyjne, szerokości linii ani wysokości pisma przepisane przez ISO 2553 i AWS A2.4. Lista to słownik powszechnie stosowany, nie pełny zbiór, i nie zawiera zasad norm dotyczących łączenia, wymiarowania i rozmieszczania znaków ani żadnego załącznika krajowego. Nic tutaj nie ma mocy prawnej na rysunku; przed podpisaniem należy sięgnąć do samej normy."},
  "intended_use": "education",

  "validation": {"basis":{"en":"None. This is a new tool and it has no benchmark: there is nothing here to benchmark against a reference, because the tool computes no physical quantity. The entries were written from the published symbol vocabulary of ISO 2553 and AWS A2.4 and have not been checked against an independent reading of either standard; the drawings are schematic and are not built to the standards' construction rules.","uk":"Немає. Це новий інструмент без еталонної перевірки: перевіряти нічого, бо жодної фізичної величини він не обчислює. Записи складено за опублікованим словником познак ISO 2553 і AWS A2.4 і не звірено з незалежним прочитанням цих стандартів; рисунки схематичні.","de":"Keine. Dies ist ein neues Werkzeug ohne Benchmark: Es berechnet keine physikalische Größe, es gibt also nichts zu vergleichen. Die Einträge stammen aus dem veröffentlichten Symbolvokabular von ISO 2553 und AWS A2.4 und wurden nicht gegen eine unabhängige Lesung der Normen geprüft; die Zeichnungen sind schematisch.","nl":"Geen. Dit is een nieuwe tool zonder benchmark: er valt niets te vergelijken, want de tool berekent geen fysische grootheid. De items zijn geschreven op basis van het gepubliceerde symboolvocabulaire van ISO 2553 en AWS A2.4 en zijn niet getoetst aan een onafhankelijke lezing van beide normen; de tekeningen zijn schematisch.","fr":"Aucune. Outil nouveau, sans référence de comparaison : il ne calcule aucune grandeur physique, il n'y a donc rien à confronter. Les entrées ont été rédigées d'après le vocabulaire symbolique publié de l'ISO 2553 et de l'AWS A2.4, sans vérification indépendante ; les dessins sont schématiques.","es":"Ninguna. Herramienta nueva sin banco de pruebas: no calcula ninguna magnitud física, así que no hay nada que contrastar. Las entradas se redactaron a partir del vocabulario simbólico publicado de ISO 2553 y AWS A2.4, sin verificación independiente; los dibujos son esquemáticos.","pl":"Brak. To nowe narzędzie bez benchmarku: nie ma tu czego porównywać z odniesieniem, ponieważ narzędzie nie oblicza żadnej wielkości fizycznej. Wpisy napisano na podstawie opublikowanego słownika znaków ISO 2553 i AWS A2.4 i nie zweryfikowano ich wobec niezależnej lektury żadnej z norm; rysunki są schematyczne i nie są wykonane według reguł konstrukcyjnych norm."},"independent_validation":false,"benchmarks":[]},

<script>
/* weldsymbols.html — a reference tool on the tools.petrov.re UI framework v3.
 *
 *   1. the model      — the symbol catalogue and the pure filter over it.
 *                       No DOM, no strings for the screen beyond the six-language
 *                       objects the framework renders.
 *   2. the interface  — one DiagramUI.app({layout:'reference'}) declaration.
 *   3. the data layer — Diagram.init({state, record, python}), called
 *                       unconditionally, even when diagram-ui.js is absent.
 *
 * The tool owns pixels in exactly one place: the symbol drawings. Everything
 * else on screen is a framework component. There is no <style> element.
 */
(function () {
  'use strict';

  /* ============================================================ 0. six languages */
  function T(en, uk, de, nl, fr, es, pl) { return { en: en, uk: uk, de: de, nl: nl, fr: fr, es: es, pl: pl }; }

  /* ============================================================ 1. the model */
  /* The catalogue. Every entry is one element of the symbol vocabulary:
       id    stable key — it is what the permalink and the record carry
       g     group: structure | weldtype | supplementary | finish | dimension
       std   which standard uses it: iso | aws | both
       d     the key of its drawing routine (part 2, GLYPH)
       full  the drawing routine draws the whole assembly, including the
             reference line, rather than a symbol standing on one
     No physical quantity appears anywhere: this tool looks things up. */
  function E(id, g, std, d, full, name, mean, use) {
    return { id: id, g: g, std: std, d: d, full: full, name: name, mean: mean, use: use };
  }

  var CATALOG = [

    /* ---- the reference-line assembly ---- */
    E('refline', 'structure', 'both', 'refline', true,
      T('Reference line', 'Лінія-виноска', 'Bezugslinie', 'Referentielijn', 'Ligne de référence', 'Línea de referencia','Linia odniesienia'),
      T('The horizontal line that carries every weld symbol. It is always drawn parallel to the bottom edge of the drawing, whichever way the arrow points.',
        'Горизонтальна лінія, що несе всі познаки шва. Її завжди креслять паралельно нижньому краю креслення, куди б не вказувала стрілка.',
        'Die waagerechte Linie, die alle Nahtsymbole trägt. Sie wird stets parallel zur unteren Zeichnungskante gezeichnet, gleich wohin der Pfeil zeigt.',
        'De horizontale lijn die alle lassymbolen draagt. Zij wordt altijd evenwijdig aan de onderrand van de tekening getekend, waarheen de pijl ook wijst.',
        'La ligne horizontale qui porte tous les symboles de soudure. Elle est toujours tracée parallèlement au bord inférieur du dessin, quelle que soit la direction de la flèche.',
        'La línea horizontal que sostiene todos los símbolos de soldadura. Se traza siempre paralela al borde inferior del dibujo, apunte donde apunte la flecha.','Pozioma linia, na której umieszcza się wszystkie znaki spoin. Rysuje się ją zawsze równolegle do dolnej krawędzi rysunku, niezależnie od kierunku strzałki.'),
      T('Every weld callout starts here.', 'З неї починається будь-яка познака шва.', 'Jede Schweißangabe beginnt hier.',
        'Elke lasaanduiding begint hier.', 'Toute indication de soudure part de là.', 'Toda indicación de soldadura parte de aquí.','Każde oznaczenie spoiny zaczyna się tutaj.')),

    E('arrowline', 'structure', 'both', 'arrowline', true,
      T('Arrow', 'Стрілка (виноска)', 'Pfeil', 'Pijl', 'Flèche', 'Flecha','Strzałka'),
      T('The leader that touches the joint. Its tip decides which member is the arrow side; for a bevel or J preparation the arrow is broken so that it points at the member being prepared.',
        'Виноска, що торкається з’єднання. Її вістря визначає, який елемент є стороною стрілки; для розробки HV або J стрілку ламають і спрямовують на елемент, який обробляють.',
        'Die Hinweislinie, die an die Naht stößt. Ihre Spitze legt die Pfeilseite fest; bei HV- oder J-Vorbereitung wird der Pfeil geknickt und zeigt auf das vorbereitete Bauteil.',
        'De verwijslijn die de naad raakt. De punt bepaalt welk deel de pijlzijde is; bij een halve V- of J-voorbereiding wordt de pijl geknikt naar het bewerkte deel.',
        'La ligne de rappel qui touche le joint. Sa pointe désigne le côté flèche ; pour une préparation en demi-V ou en J, la flèche est brisée et vise la pièce préparée.',
        'La línea de referencia que toca la junta. Su punta define el lado de la flecha; en preparaciones en medio V o en J la flecha se quiebra y señala la pieza preparada.','Linia wskazująca, dotykająca złącza. Jej grot określa, która część jest stroną strzałki; przy ukosowaniu w kształcie V lub J strzałka jest załamana i wskazuje element przygotowywany.'),
      T('It points at the joint, never at the weld metal.', 'Вказує на з’єднання, а не на метал шва.', 'Sie zeigt auf die Stoßstelle, nicht auf das Schweißgut.',
        'Hij wijst naar de verbinding, niet naar het lasmetaal.', 'Elle vise le joint, jamais le métal fondu.', 'Señala la junta, nunca el metal de aportación.','Wskazuje złącze, nigdy spoinę (stopiwo).')),

    E('idline', 'structure', 'iso', 'idline', true,
      T('Identification line (dashed)', 'Ідентифікаційна лінія (штрихова)', 'Identifikationslinie (gestrichelt)', 'Identificatielijn (streepjes)', 'Ligne d’identification (tiretée)', 'Línea de identificación (discontinua)','Linia identyfikacyjna (przerywana)'),
      T('In ISO 2553 system A a dashed line runs beside the continuous reference line. A symbol on the continuous line is the arrow side; the same symbol on the dashed line is the other side. The dashed line may be drawn above or below.',
        'У системі A стандарту ISO 2553 поряд зі суцільною лінією-виноскою йде штрихова. Познака на суцільній лінії — сторона стрілки, та сама познака на штриховій — зворотна сторона. Штрихову лінію креслять зверху або знизу.',
        'In ISO 2553 System A läuft neben der durchgezogenen Bezugslinie eine gestrichelte. Ein Symbol auf der durchgezogenen Linie meint die Pfeilseite, dasselbe Symbol auf der gestrichelten die Gegenseite. Die gestrichelte Linie darf ober- oder unterhalb liegen.',
        'In ISO 2553 systeem A loopt naast de doorgetrokken referentielijn een streepjeslijn. Een symbool op de doorgetrokken lijn geldt voor de pijlzijde, hetzelfde symbool op de streepjeslijn voor de andere zijde. De streepjeslijn mag boven of onder liggen.',
        'Dans le système A de l’ISO 2553, une ligne tiretée accompagne la ligne de référence continue. Un symbole sur la ligne continue vise le côté flèche ; le même symbole sur la ligne tiretée vise l’autre côté. La ligne tiretée peut être au-dessus ou au-dessous.',
        'En el sistema A de ISO 2553 una línea discontinua acompaña a la línea de referencia continua. Un símbolo sobre la línea continua se refiere al lado de la flecha; el mismo símbolo sobre la discontinua, al otro lado. La discontinua puede ir arriba o abajo.','W systemie A według ISO 2553 obok linii odniesienia biegnie linia przerywana. Znak na linii ciągłej oznacza stronę strzałki; ten sam znak na linii przerywanej — stronę przeciwną. Linia przerywana może biec powyżej lub poniżej.'),
      T('Absent on AWS drawings and in ISO system B.', 'На кресленнях AWS і в системі B ISO її немає.', 'Auf AWS-Zeichnungen und in ISO-System B fehlt sie.',
        'Ontbreekt op AWS-tekeningen en in ISO-systeem B.', 'Absente des plans AWS et du système B de l’ISO.', 'No aparece en planos AWS ni en el sistema B de ISO.','Nieobecna na rysunkach AWS i w systemie B według ISO.')),

    E('tail', 'structure', 'both', 'tail', true,
      T('Tail', 'Хвіст (вилка)', 'Gabel (Schwanz)', 'Vork (staart)', 'Fourche (queue)', 'Cola (bifurcación)','Ogon'),
      T('The fork at the far end of the reference line. It carries what the symbols cannot say: the welding process number, the consumable, the procedure or a note. It is omitted when there is nothing to put in it.',
        'Вилка на дальньому кінці лінії-виноски. Несе те, чого не можуть сказати познаки: номер процесу зварювання, присадний матеріал, технологію або примітку. Якщо нічого вказувати — її не креслять.',
        'Die Gabel am Ende der Bezugslinie. Sie trägt, was die Symbole nicht sagen können: Prozessnummer, Zusatzwerkstoff, Verfahren oder eine Anmerkung. Ohne Inhalt entfällt sie.',
        'De vork aan het uiteinde van de referentielijn. Zij draagt wat de symbolen niet kunnen zeggen: processnummer, toevoegmateriaal, procedure of een opmerking. Zonder inhoud vervalt zij.',
        'La fourche à l’extrémité de la ligne de référence. Elle porte ce que les symboles ne disent pas : numéro de procédé, métal d’apport, mode opératoire ou renvoi. Sans contenu, elle est omise.',
        'La bifurcación en el extremo de la línea de referencia. Lleva lo que los símbolos no dicen: número de proceso, consumible, procedimiento o una nota. Si no hay nada que poner, se omite.','Widełki na końcu linii odniesienia. Niosą to, czego nie da się wyrazić znakami: numer procesu spawania, materiał dodatkowy, procedurę lub uwagę. Pomija się je, gdy nie ma czego w nich zapisać.'),
      T('Process number, procedure, note.', 'Номер процесу, технологія, примітка.', 'Prozessnummer, Verfahren, Anmerkung.',
        'Processnummer, procedure, opmerking.', 'Numéro de procédé, mode opératoire, note.', 'Número de proceso, procedimiento, nota.','Numer procesu, procedura, uwaga.')),

    E('sides', 'structure', 'both', 'sides', true,
      T('Arrow side and other side', 'Сторона стрілки та зворотна сторона', 'Pfeilseite und Gegenseite', 'Pijlzijde en andere zijde', 'Côté flèche et autre côté', 'Lado de la flecha y otro lado','Strona strzałki i strona przeciwna'),
      T('Which face of the joint the symbol refers to. AWS A2.4 and ISO system B put the arrow-side symbol below the reference line and the other-side symbol above it; ISO system A puts the arrow side on the continuous line and the other side on the dashed one.',
        'До якої сторони з’єднання належить познака. AWS A2.4 та система B ISO ставлять познаку сторони стрілки під лінією-виноскою, а зворотної сторони — над нею; система A ISO ставить сторону стрілки на суцільній лінії, а зворотну — на штриховій.',
        'Auf welche Seite des Stoßes sich das Symbol bezieht. AWS A2.4 und ISO-System B setzen das Pfeilseiten-Symbol unter die Bezugslinie und das Gegenseiten-Symbol darüber; ISO-System A setzt die Pfeilseite auf die durchgezogene und die Gegenseite auf die gestrichelte Linie.',
        'Op welke zijde van de verbinding het symbool slaat. AWS A2.4 en ISO-systeem B plaatsen het pijlzijde-symbool onder de referentielijn en het andere-zijde-symbool erboven; ISO-systeem A plaatst de pijlzijde op de doorgetrokken en de andere zijde op de streepjeslijn.',
        'Le côté du joint visé par le symbole. L’AWS A2.4 et le système B de l’ISO placent le symbole côté flèche sous la ligne de référence et le symbole autre côté au-dessus ; le système A de l’ISO place le côté flèche sur la ligne continue et l’autre côté sur la ligne tiretée.',
        'A qué cara de la junta se refiere el símbolo. AWS A2.4 y el sistema B de ISO colocan el símbolo del lado de la flecha debajo de la línea de referencia y el del otro lado encima; el sistema A de ISO pone el lado de la flecha en la línea continua y el otro lado en la discontinua.','Która powierzchnia złącza jest opisywana danym znakiem. AWS A2.4 i system B według ISO umieszczają znak strony strzałki pod linią odniesienia, a znak strony przeciwnej nad nią; system A według ISO umieszcza stronę strzałki na linii ciągłej, a stronę przeciwną na przerywanej.'),
      T('The one convention a reader must settle first.', 'Перше, що читач має з’ясувати.', 'Die Konvention, die man zuerst klären muss.',

      T('AWS practice; ISO states the method in words.', 'Практика AWS; ISO зазначає спосіб текстом.', 'AWS-Praxis; ISO nennt das Verfahren im Klartext.',

    /* ---- dimensions ---- */
    E('legsize', 'dimension', 'both', 'legsize', true,
      T('Fillet size: a or z', 'Розмір кутового шва: a або z', 'Kehlnahtmaß: a oder z', 'Hoeklasmaat: a of z', 'Cote de la soudure d’angle : a ou z', 'Tamaño del cordón: a o z','Wymiar spoiny pachwinowej: a lub z'),
      T('The size stands to the left of the symbol. ISO 2553 writes a for the design throat and z for the leg, and the letter must be there: a5 and z5 are different welds, related by z = a·√2 for an equal-leg mitre fillet.',

        'Das Maß steht links vom Symbol. ISO 2553 schreibt a für die Nahtdicke und z für das Schenkelmaß; der Buchstabe ist Pflicht: a5 und z5 sind verschiedene Nähte, verbunden über z = a·√2 bei gleichschenkliger Kehlnaht.',
        'De maat staat links van het symbool. ISO 2553 schrijft a voor de keelhoogte en z voor de zijde; de letter is verplicht: a5 en z5 zijn verschillende lassen, met z = a·√2 bij gelijkzijdige hoeklas.',
        'La cote se place à gauche du symbole. L’ISO 2553 écrit a pour la gorge et z pour le côté ; la lettre est obligatoire : a5 et z5 ne sont pas la même soudure, avec z = a·√2 pour un cordon isocèle.',
        'La cota va a la izquierda del símbolo. ISO 2553 escribe a para la garganta y z para el cateto; la letra es obligatoria: a5 y z5 no son la misma soldadura, con z = a·√2 en cordón de catetos iguales.','Wymiar stoi po lewej stronie znaku. ISO 2553 pisze a dla grubości obliczeniowej, a z dla wymiaru ramienia, i litera musi tam być: a5 i z5 to różne spoiny, powiązane zależnością z = a·√2 dla równoramiennej spoiny pachwinowej.'),
      T('A missing letter is the classic drawing error.', 'Пропущена літера — класична помилка креслення.', 'Der fehlende Buchstabe ist der klassische Zeichnungsfehler.',

    E('length', 'dimension', 'both', 'length', true,

    E('intermittent', 'dimension', 'both', 'intermittent', true,
      T('Intermittent weld: n × l (e)', 'Переривчастий шов: n × l (e)', 'Unterbrochene Naht: n × l (e)', 'Onderbroken las: n × l (e)', 'Soudure discontinue : n × l (e)', 'Soldadura discontinua: n × l (e)','Spoina przerywana: n × l (e)'),
      T('Number of weld elements, their individual length and, in brackets, the spacing. ISO 2553 measures e as the gap between welds; AWS A2.4 writes the pitch, centre to centre. The two numbers are not the same length.',
        'Кількість ділянок, довжина кожної та у дужках — відстань. ISO 2553 бере e як проміжок між швами; AWS A2.4 пише крок, від центра до центра. Це різні величини.',
        'Anzahl der Nahtabschnitte, ihre Einzellänge und in Klammern der Abstand. ISO 2553 misst e als Zwischenraum zwischen den Nähten, AWS A2.4 schreibt die Teilung von Mitte zu Mitte — nicht dieselbe Länge.',
        'Aantal laselementen, hun lengte en tussen haakjes de afstand. ISO 2553 meet e als de tussenruimte, AWS A2.4 schrijft de steek hart-op-hart — dat zijn niet dezelfde maten.',
        'Nombre de tronçons, leur longueur et, entre parenthèses, l’espacement. L’ISO 2553 mesure e comme l’intervalle entre soudures ; l’AWS A2.4 écrit le pas d’axe en axe. Ce ne sont pas les mêmes longueurs.',
        'Número de tramos, su longitud y, entre paréntesis, la separación. ISO 2553 mide e como el hueco entre cordones; AWS A2.4 escribe el paso de centro a centro. No son la misma medida.','Liczba odcinków spoiny, ich pojedyncza długość i, w nawiasie, rozstaw. ISO 2553 mierzy e jako przerwę między spoinami; AWS A2.4 podaje podziałkę, od środka do środka. Te dwie liczby to nie ta sama długość.'),
      T('Check which standard the drawing follows.', 'Перевірте, за яким стандартом виконано креслення.', 'Prüfen, welcher Norm die Zeichnung folgt.',

    E('staggered', 'dimension', 'both', 'staggered', true,
      T('Staggered intermittent fillet', 'Шаховий переривчастий кутовий шов', 'Versetzt unterbrochene Kehlnaht', 'Verspringend onderbroken hoeklas', 'Soudure d’angle discontinue alternée', 'Cordón discontinuo alterno','Spoina pachwinowa przerywana naprzemianległa'),
      T('Intermittent welds on both sides of the joint, offset so that a weld on one side faces a gap on the other. The symbols are drawn staggered across the reference line to show it.',
        'Переривчасті шви з обох боків з’єднання, зміщені так, що шву з одного боку відповідає проміжок з іншого. Познаки креслять у шаховому порядку відносно лінії-виноски.',
        'Unterbrochene Nähte beidseits des Stoßes, versetzt angeordnet, sodass einer Naht gegenüber eine Lücke liegt. Die Symbole werden entsprechend versetzt zur Bezugslinie gezeichnet.',
        'Onderbroken lassen aan weerszijden van de naad, verspringend zodat tegenover een las een opening ligt. De symbolen staan verspringend om de referentielijn getekend.',

        'Cordones discontinuos a ambos lados, desfasados de modo que a un tramo le corresponda un hueco. Los símbolos se dibujan alternados sobre la línea de referencia.','Spoiny przerywane po obu stronach złącza, przesunięte tak, że spoinie po jednej stronie odpowiada przerwa po drugiej. Znaki rysuje się w odpowiednim przesunięciu względem linii odniesienia, aby to pokazać.'),
      T('Light stiffeners and webs.', 'Легкі ребра та стінки.', 'Leichte Steifen und Stege.',

    E('grooveangle', 'dimension', 'both', 'grooveangle', true,
      T('Groove angle, root gap, root face', 'Кут розкриття, зазор і притуплення', 'Öffnungswinkel, Spaltbreite, Steghöhe', 'Openingshoek, wortelspleet, wortelvlak', 'Angle d’ouverture, écartement, méplat', 'Ángulo de abertura, separación y talón','Kąt rozwarcia, rozwarcie grani, prosta grani'),
      T('The preparation geometry written on the symbol: the included angle above or inside the V, the root gap below or inside it, and the root face as a further figure. They belong to the preparation, not to the finished weld.',
        'Геометрія розробки на познаці: кут розкриття над або всередині V, зазор у корені під ним або всередині, а притуплення — окремою цифрою. Це параметри розробки, а не готового шва.',
        'Die Vorbereitungsgeometrie am Symbol: Öffnungswinkel über oder im V, Spaltbreite darunter oder darin, Steghöhe als weitere Zahl. Sie gehören zur Vorbereitung, nicht zur fertigen Naht.',
        'De voorbereidingsgeometrie bij het symbool: openingshoek boven of in de V, wortelspleet eronder of erin, en het wortelvlak als extra getal. Ze horen bij de voorbereiding, niet bij de afgewerkte las.',
        'La géométrie de préparation portée sur le symbole : angle d’ouverture au-dessus ou dans le V, écartement en dessous ou dedans, méplat en chiffre supplémentaire. Elle décrit la préparation, non la soudure finie.',
        'La geometría de preparación escrita en el símbolo: ángulo de abertura sobre o dentro de la V, separación debajo o dentro, y el talón como cifra adicional. Describen la preparación, no el cordón acabado.','Geometria przygotowania zapisana na znaku: kąt rozwarcia nad V lub wewnątrz niego, rozwarcie grani pod nim lub wewnątrz, a wysokość prostej grani jako kolejna liczba. Należą do przygotowania złącza, nie do gotowej spoiny.'),
      T('Fabrication data, checked before welding.', 'Дані для виготовлення, перевіряють до зварювання.', 'Fertigungsangaben, vor dem Schweißen geprüft.',
        'Fabricagegegevens, vóór het lassen gecontroleerd.', 'Données de fabrication, vérifiées avant soudage.', 'Datos de fabricación, comprobados antes de soldar.','Dane wytwórcze, sprawdzane przed spawaniem.'))
  ];

  var BY_ID = {};
  var HAY = {};
  CATALOG.forEach(function (e) {
    BY_ID[e.id] = e;
    var s = e.id + ' ' + e.g + ' ' + e.std;
    ['name', 'mean', 'use'].forEach(function (k) {
      var o = e[k];
      for (var lg in o) if (Object.prototype.hasOwnProperty.call(o, lg)) s += ' ' + o[lg];
    });
    HAY[e.id] = s.toLowerCase();
  });

  /* The filter. Pure: state in, the same answer out, in every language — the
     search reads all six translations of every entry, so a permalink made in
     Dutch finds the same rows when it is opened in Spanish. */
  function solve(s) {
    var q = String(s.q == null ? '' : s.q).toLowerCase().replace(/\s+/g, ' ').trim();
    var toks = q ? q.split(' ') : [];
    var ids = [], iso = 0, aws = 0;
    for (var i = 0; i < CATALOG.length; i++) {
      var e = CATALOG[i];
      if (s.group !== 'all' && e.g !== s.group) continue;
      if (s.standard === 'iso' && !(e.std === 'iso' || e.std === 'both')) continue;
      if (s.standard === 'aws' && !(e.std === 'aws' || e.std === 'both')) continue;
      var hay = HAY[e.id], ok = true;
      for (var k = 0; k < toks.length; k++) if (hay.indexOf(toks[k]) < 0) { ok = false; break; }
      if (!ok) continue;
      ids.push(e.id);
      if (e.std === 'iso' || e.std === 'both') iso += 1;
      if (e.std === 'aws' || e.std === 'both') aws += 1;
    }
    var sel = BY_ID[s.sel] ? s.sel : (ids.length ? ids[0] : CATALOG[0].id);
    return {
      ids: ids, n: ids.length, iso: iso, aws: aws,
      total: CATALOG.length, sel: sel, entry: BY_ID[sel]
    };
  }

  var DEFAULTS = { q: '', group: 'all', standard: 'all', sel: 'sides' };
  var state = JSON.parse(JSON.stringify(DEFAULTS));

  /* A lookup has no "not computed yet": the answer is a pure function of the
     filter and it exists from the first line. `last` is therefore never null,
     and record() never returns null — which is the honest thing here, not the
     zeros §1.1 of AUTHORING.md warns about. */
  var last = solve(state);

  /* ====================================================== 2. the drawings ---
     The one place this tool owns pixels. Each routine draws one symbol in a
     frame whose origin (0,0) sits on the reference line at the symbol's left
     edge, with -y upwards, in a box S high. `full` routines draw the whole
     assembly — arrow, reference line, tail — and use o.W, the length of the
     reference line they were given. */

  function ln(c, x1, y1, x2, y2) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }
  function poly(c, pts, close, fill) {
    c.beginPath();
    for (var i = 0; i < pts.length; i += 2) {
      if (i === 0) c.moveTo(pts[0], pts[1]); else c.lineTo(pts[i], pts[i + 1]);
    }
    if (close) c.closePath();
    if (fill) c.fill(); else c.stroke();
  }
  /* draw g mirrored about the reference line, for an other-side symbol */
  function below(c, o, g) { c.save(); c.scale(1, -1); g(c, o); c.restore(); }
  function txt(c, o, s, x, y, align, color) {
    c.save();
    c.fillStyle = color || o.ink;
    c.textAlign = align || 'center';
    c.textBaseline = 'middle';
    c.font = '400 ' + o.fs + 'px ' + o.font;
    c.fillText(s, x, y);
    c.restore();
  }

  /* the elementary symbols, each standing on the line, S high and S wide */
  var G = {};
  G.fillet = function (c, o) { poly(c, [0, 0, 0, -o.S, o.S, 0], true); };
  G.square = function (c, o) { ln(c, o.S * 0.3, 0, o.S * 0.3, -o.S); ln(c, o.S * 0.7, 0, o.S * 0.7, -o.S); };
  G.vgroove = function (c, o) { poly(c, [0, -o.S, o.S * 0.5, 0, o.S, -o.S]); };
  G.bevel = function (c, o) { ln(c, o.S * 0.18, 0, o.S * 0.18, -o.S); ln(c, o.S * 0.18, 0, o.S, -o.S); };
  G.ugroove = function (c, o) {
    c.beginPath();
    c.moveTo(0, -o.S);
    c.quadraticCurveTo(0, 0, o.S * 0.38, 0);
    c.lineTo(o.S * 0.62, 0);
    c.quadraticCurveTo(o.S, 0, o.S, -o.S);
    c.stroke();
  };
  G.jgroove = function (c, o) {
    ln(c, o.S * 0.12, 0, o.S * 0.12, -o.S);
    c.beginPath();
    c.moveTo(o.S * 0.12, 0);
    c.lineTo(o.S * 0.5, 0);
    c.quadraticCurveTo(o.S * 0.95, 0, o.S * 0.95, -o.S);
    c.stroke();
  };
  G.backing = function (c, o) { c.beginPath(); c.arc(o.S * 0.5, 0, o.S * 0.5, Math.PI, 2 * Math.PI); c.stroke(); };
  G.melt = function (c, o) { c.beginPath(); c.arc(o.S * 0.5, 0, o.S * 0.5, Math.PI, 2 * Math.PI); c.closePath(); c.fill(); };
  G.plug = function (c, o) { c.strokeRect(0, -o.S * 0.72, o.S * 1.15, o.S * 0.72); };
  G.spot = function (c, o) { c.beginPath(); c.arc(o.S * 0.5, -o.S * 0.5, o.S * 0.44, 0, 6.2832); c.stroke(); };
  G.seam = function (c, o) {
    c.strokeRect(0, -o.S * 0.72, o.S * 1.3, o.S * 0.72);
    c.beginPath(); c.arc(o.S * 0.65, -o.S * 0.36, o.S * 0.36, 0, 6.2832); c.stroke();
  };
  G.surfacing = function (c, o) {
    c.beginPath(); c.arc(o.S * 0.28, 0, o.S * 0.28, Math.PI, 2 * Math.PI); c.stroke();
    c.beginPath(); c.arc(o.S * 0.84, 0, o.S * 0.28, Math.PI, 2 * Math.PI); c.stroke();
  };
  G.edge = function (c, o) {
    c.beginPath(); c.moveTo(o.S * 0.3, 0); c.lineTo(o.S * 0.3, -o.S * 0.8);
    c.quadraticCurveTo(o.S * 0.3, -o.S, o.S * 0.08, -o.S); c.stroke();
    c.beginPath(); c.moveTo(o.S * 0.7, 0); c.lineTo(o.S * 0.7, -o.S * 0.8);
    c.quadraticCurveTo(o.S * 0.7, -o.S, o.S * 0.92, -o.S); c.stroke();
  };
  G.xgroove = function (c, o) { G.vgroove(c, o); below(c, o, G.vgroove); };
  G.kgroove = function (c, o) { G.bevel(c, o); below(c, o, G.bevel); };

  /* contour symbols: always read on top of a weld symbol, so they are drawn
     that way — a V groove with the contour across its face */
  G.flat = function (c, o) { G.vgroove(c, o); ln(c, -o.S * 0.05, -o.S, o.S * 1.05, -o.S); };
  G.convex = function (c, o) {
    G.vgroove(c, o);
    c.beginPath(); c.moveTo(-o.S * 0.05, -o.S);
    c.quadraticCurveTo(o.S * 0.5, -o.S * 1.5, o.S * 1.05, -o.S); c.stroke();
  };
  G.concave = function (c, o) {
    G.vgroove(c, o);
    c.beginPath(); c.moveTo(-o.S * 0.05, -o.S);
    c.quadraticCurveTo(o.S * 0.5, -o.S * 0.55, o.S * 1.05, -o.S); c.stroke();
  };
  G.blended = function (c, o) {
    G.vgroove(c, o);
    c.beginPath();
    c.moveTo(-o.S * 0.1, -o.S * 0.78);
    c.quadraticCurveTo(o.S * 0.05, -o.S, o.S * 0.25, -o.S);
    c.lineTo(o.S * 0.75, -o.S);
    c.quadraticCurveTo(o.S * 0.95, -o.S, o.S * 1.1, -o.S * 0.78);
    c.stroke();
  };
  G.permback = function (c, o) {
    c.strokeRect(0, -o.S * 0.72, o.S * 1.15, o.S * 0.72);
    txt(c, o, 'M', o.S * 0.575, -o.S * 0.36);
  };
  G.finish = function (c, o) {
    G.vgroove(c, o);
    ln(c, -o.S * 0.05, -o.S, o.S * 1.05, -o.S);
    txt(c, o, 'G', o.S * 0.5, -o.S - o.fs * 0.75);
  };

  /* words drawn inside the pictures — six languages, like every other string */
  var LBL = {
    arrow:     T('Arrow', 'Стрілка', 'Pfeil', 'Pijl', 'Flèche', 'Flecha','Strzałka'),
    ref:       T('Reference line', 'Лінія-виноска', 'Bezugslinie', 'Referentielijn', 'Ligne de référence', 'Línea de referencia','Linia odniesienia'),
    idl:       T('Identification line', 'Ідентифікаційна лінія', 'Identifikationslinie', 'Identificatielijn', 'Ligne d’identification', 'Línea de identificación','Linia identyfikacyjna'),
    tail:      T('Tail', 'Хвіст', 'Gabel', 'Vork', 'Fourche', 'Cola','Ogon'),
    arrowside: T('Arrow side', 'Сторона стрілки', 'Pfeilseite', 'Pijlzijde', 'Côté flèche', 'Lado de la flecha','Strona strzałki'),
    otherside: T('Other side', 'Зворотна сторона', 'Gegenseite', 'Andere zijde', 'Autre côté', 'Otro lado','Strona przeciwna'),
    joint:     T('Joint', 'З’єднання', 'Stoß', 'Verbinding', 'Joint', 'Junta','Złącze'),
    allround:  T('all round', 'по контуру', 'umlaufend', 'rondom', 'sur pourtour', 'en contorno','obwodowo'),
    site:      T('site weld', 'монтажний', 'Baustelle', 'werklas', 'chantier', 'en obra','spoina montażowa')
  };

  /* the assembly the full drawings are built on */
  function frame(c, o, cfg) {
    cfg = cfg || {};
    var A = o.S * 1.5, W = o.W, D = o.S * 0.34;
    c.save();
    c.strokeStyle = cfg.hi === 'arrow' ? o.accent : o.ink;
    c.lineWidth = cfg.hi === 'arrow' ? o.lw * 1.8 : o.lw;
    if (cfg.arrow !== false) {
      ln(c, 0, 0, -A, A * 0.8);
      c.save();
      c.fillStyle = c.strokeStyle;
      c.translate(-A, A * 0.8);
      c.rotate(Math.atan2(A * 0.8, -A));
      poly(c, [0, 0, -o.S * 0.42, -o.S * 0.16, -o.S * 0.42, o.S * 0.16], true, true);
      c.restore();
    }
    c.strokeStyle = cfg.hi === 'ref' ? o.accent : o.ink;
    c.lineWidth = cfg.hi === 'ref' ? o.lw * 1.8 : o.lw;
    ln(c, 0, 0, W, 0);
    if (cfg.dash) {
      c.strokeStyle = cfg.hi === 'idl' ? o.accent : o.ink;
      c.lineWidth = cfg.hi === 'idl' ? o.lw * 1.8 : o.lw;
      c.setLineDash([o.S * 0.28, o.S * 0.22]);
      ln(c, 0, D, W, D);
      c.setLineDash([]);
    }
    if (cfg.tail) {
      c.strokeStyle = cfg.hi === 'tail' ? o.accent : o.ink;
      c.lineWidth = cfg.hi === 'tail' ? o.lw * 1.8 : o.lw;
      ln(c, W, 0, W + o.S * 0.6, -o.S * 0.42);
      ln(c, W, 0, W + o.S * 0.6, o.S * 0.42);
    }
    c.restore();
  }
  function lbl(c, o, key, x, y, align) {
    if (!o.big) return;
    txt(c, o, o.t(key), x, y, align || 'left', o.muted);
  }

  G.refline = function (c, o) {
    frame(c, o, { hi: 'ref' });
    lbl(c, o, 'ref', o.W * 0.5, -o.S * 0.9, 'center');
  };
  G.arrowline = function (c, o) {
    frame(c, o, { hi: 'arrow' });
    lbl(c, o, 'arrow', -o.S * 1.5, o.S * 1.35, 'left');
    lbl(c, o, 'joint', -o.S * 1.5, o.S * 2.1, 'left');
  };
  G.tail = function (c, o) {
    frame(c, o, { tail: true, hi: 'tail' });
    lbl(c, o, 'tail', o.W + o.S * 0.7, o.S * 0.95, 'right');
  };
  G.idline = function (c, o) {
    frame(c, o, { dash: true, hi: 'idl' });
    c.save(); c.translate(o.W * 0.42, 0); G.fillet(c, o); c.restore();
    c.save(); c.translate(o.W * 0.42, o.S * 0.34); c.scale(1, -1); G.fillet(c, o); c.restore();
    lbl(c, o, 'arrowside', o.W, -o.S * 1.5, 'right');
    lbl(c, o, 'otherside', o.W, o.S * 2.2, 'right');
  };
  G.sides = function (c, o) {
    frame(c, o, {});
    c.save(); c.translate(o.W * 0.3, 0); c.scale(1, -1); G.fillet(c, o); c.restore();
    c.save(); c.translate(o.W * 0.58, 0); G.fillet(c, o); c.restore();
    lbl(c, o, 'otherside', o.W, -o.S * 1.5, 'right');
    lbl(c, o, 'arrowside', o.W, o.S * 2.1, 'right');
  };
  G.allaround = function (c, o) {
    frame(c, o, {});
    c.save(); c.translate(o.W * 0.5, 0); G.fillet(c, o); c.restore();
    c.save();
    c.strokeStyle = o.accent; c.lineWidth = o.lw * 1.6;
    c.beginPath(); c.arc(0, 0, o.S * 0.34, 0, 6.2832); c.stroke();
    c.restore();
    lbl(c, o, 'allround', -o.S * 0.4, -o.S * 1.1, 'left');
  };
  G.field = function (c, o) {
    frame(c, o, {});
    c.save(); c.translate(o.W * 0.5, 0); G.fillet(c, o); c.restore();
    c.save();
    c.strokeStyle = o.accent; c.fillStyle = o.accent; c.lineWidth = o.lw * 1.4;
    ln(c, 0, 0, 0, -o.S * 1.15);
    poly(c, [0, -o.S * 1.15, o.S * 0.62, -o.S * 0.92, 0, -o.S * 0.7], true, true);
    c.restore();
    lbl(c, o, 'site', o.S * 0.75, -o.S * 1.05, 'left');
  };
  G.legsize = function (c, o) {
    frame(c, o, {});
    c.save(); c.translate(o.W * 0.5, 0); G.fillet(c, o); c.restore();
    txt(c, o, 'a5', o.W * 0.5 - o.S * 0.28, -o.S * 0.5, 'right');
    txt(c, o, 'z7', o.W * 0.5 - o.S * 0.28, o.S * 0.75, 'right');
  };
  G.length = function (c, o) {
    frame(c, o, {});
    c.save(); c.translate(o.W * 0.45, 0); G.fillet(c, o); c.restore();
    txt(c, o, 'a4', o.W * 0.45 - o.S * 0.28, -o.S * 0.5, 'right');
    txt(c, o, '200', o.W * 0.45 + o.S * 1.3, -o.S * 0.5, 'left');
  };
  G.intermittent = function (c, o) {
    var y = -o.S * 0.35, bw = o.S * 0.95, gap = o.S * 0.55, x0 = 0;
    c.save();
    c.strokeStyle = o.ink; c.fillStyle = o.ink; c.lineWidth = o.lw;
    ln(c, 0, y, o.W, y);
    for (var i = 0; i < 3; i++) {
      var x = x0 + i * (bw + gap);
      c.fillRect(x, y - o.S * 0.5, bw, o.S * 0.5);
    }
    c.strokeStyle = o.accent;
    ln(c, 0, y + o.S * 0.45, bw, y + o.S * 0.45);
    ln(c, bw, y + o.S * 0.9, bw + gap, y + o.S * 0.9);
    c.restore();
    txt(c, o, 'l', bw * 0.5, y + o.S * 0.95, 'center', o.accent);
    txt(c, o, 'e', bw + gap * 0.5, y + o.S * 1.4, 'center', o.accent);
    txt(c, o, 'n = 3', o.W, y - o.S * 0.85, 'right');
  };
  G.staggered = function (c, o) {
    var y = o.S * 0.4, bw = o.S * 0.7, gap = o.S * 0.7;
    c.save();
    c.strokeStyle = o.ink; c.fillStyle = o.ink; c.lineWidth = o.lw;
    ln(c, 0, y, o.W, y);
    for (var i = 0; i < 3; i++) {
      c.fillRect(i * (bw + gap), y - o.S * 0.45, bw, o.S * 0.45);
      c.fillRect(i * (bw + gap) + (bw + gap) * 0.5, y, bw, o.S * 0.45);
    }
    c.restore();
  };
  G.grooveangle = function (c, o) {
    frame(c, o, {});
    var x = o.W * 0.5;
    c.save(); c.translate(x, 0); G.vgroove(c, o); c.restore();
    c.save();
    c.strokeStyle = o.accent; c.lineWidth = o.lw;
    c.beginPath(); c.arc(x + o.S * 0.5, 0, o.S * 0.62, -Math.PI * 0.75, -Math.PI * 0.25); c.stroke();
    c.restore();
    txt(c, o, 'α', x + o.S * 0.5, -o.S * 0.92, 'center', o.accent);
    txt(c, o, 'b', x + o.S * 0.5, o.S * 0.72, 'center', o.accent);
  };

  /* how wide each non-full symbol is, in units of S — used to centre it */
  var GW = { plug: 1.15, seam: 1.3, permback: 1.15, surfacing: 1.12, spot: 1, flat: 1, convex: 1, concave: 1, blended: 1, finish: 1 };

  /* ---- the painter: the only place this file touches pixels -------------- */
  function tokens() {
    var cs = getComputedStyle(document.documentElement);
    function v(n, f) { return (cs.getPropertyValue(n) || '').trim() || f; }
    return {
      ink: v('--ink', '#111'), muted: v('--muted', '#777'), line: v('--line', '#ccc'),
      accent: v('--accent', '#0a58ca'), font: v('--font', 'sans-serif')
    };
  }

  function drawInto(c, w, h, entry, big, lang) {
    var tk = tokens();
    var S = big ? Math.max(20, Math.min(h * 0.22, w / 9, 46)) : 16;
    var o = {
      S: S, ink: tk.ink, muted: tk.muted, line: tk.line, accent: tk.accent, font: tk.font,
      big: big, lw: big ? 2 : 1.4, fs: big ? 14 : 10,
      t: function (k) { return DiagramUI.pick(LBL[k], lang); }
    };
    c.clearRect(0, 0, w, h);
    c.lineJoin = 'round';
    c.lineCap = 'round';
    c.strokeStyle = tk.ink;
    c.fillStyle = tk.ink;
    c.lineWidth = o.lw;
    var g = G[entry.d];
    if (!g) return;
    if (entry.full) {
      /* the assembly is drawn at its own size and centred, never stretched to
         the width of the box it was given */
      var padL = S * 2.3, padR = S * 1.6;
      o.W = Math.max(S * 3, Math.min(w - padL - padR, S * 6.5));
      c.save();
      c.translate(Math.max(0, (w - (padL + o.W + padR)) / 2) + padL, h * 0.52);
      g(c, o);
      c.restore();
    } else {
      var gw = (GW[entry.d] || 1) * S;
      var y = big ? h * 0.6 : h * 0.66;
      var half = Math.min(w * 0.44, gw * 2.6);
      c.save(); c.strokeStyle = tk.line;
      ln(c, w / 2 - half, y, w / 2 + half, y);
      c.restore();
      c.save(); c.translate((w - gw) / 2, y); g(c, o); c.restore();
    }
  }

  /* a thumbnail canvas for one catalogue row */
  var THUMB_W = 132, THUMB_H = 50;
  function thumb(entry, lang) {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var cv = DiagramUI.el('canvas', {
      width: Math.round(THUMB_W * dpr), height: Math.round(THUMB_H * dpr),
      role: 'img', 'aria-label': DiagramUI.pick(entry.name, lang),
      style: { display: 'block', width: THUMB_W + 'px', height: THUMB_H + 'px' }
    });
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawInto(c, THUMB_W, THUMB_H, entry, false, lang);
    return cv;
  }

  /* ======================================================== 3. the interface */

  var GROUP_LABEL = {

    supplementary: T('Contour and supplementary', 'Форма та додаткові', 'Oberfläche und Zusatz', 'Contour en aanvullend', 'Contour et complémentaires', 'Contorno y complementarios','Kontur i znaki dodatkowe'),
    finish:        T('Finish', 'Оброблення', 'Nachbearbeitung', 'Nabewerking', 'Finition', 'Acabado','Obróbka'),
    dimension:     T('Dimensions', 'Розміри', 'Maße', 'Maten', 'Cotation', 'Acotación','Wymiary')
  };

  };

  var app = null, stage = null, listSig = null, detailSig = null;

  function L(o) { return DiagramUI.pick(o, app ? app.lang : DiagramUI.lang()); }

  function clearBox(box) { while (box.firstChild) box.removeChild(box.firstChild); }

  /* the catalogue, as a framework table: a drawing, a button that selects the
     entry, and which standard uses it. The row title carries the one-line
     "where you meet it", so the table alone reads without selecting a row. */
  function paintList(box, ctx) {
    /* ctx.app, never the module-level `app`: a language change builds a NEW
       App and replays this render into it BEFORE on.rebuild re-points anything
       a tool is holding. Painting from the stale reference is how a rebuilt
       panel comes back empty. */
    var a = ctx.app, lang = a.lang;
    var sig = [state.q, state.group, state.standard, state.sel, lang].join('|');
    if (sig === listSig && box.firstChild) return;
    listSig = sig;
    var res = solve(state);
    clearBox(box);
    var rows = res.ids.map(function (id) {
      var e = BY_ID[id];
      return {
        id: id,
        chosen: id === res.sel,
        title: DiagramUI.pick(e.use, lang),
        cells: [
          { node: thumb(e, lang) },
          { node: a.actionButton({
              id: 'pick-' + id,
              label: e.name,
              variant: id === res.sel ? 'primary' : 'ghost',
              run: function () { state.sel = id; a.sync(); a.run(); }
            }) },
          { text: STD_LABEL[e.std] }
        ]
      };
    });
    if (!rows.length) {
      rows = [{ cells: [{ span: 3, text: T(

     so the sentences are paragraphs and only the short facts are a table. */
  function paintDetail(box, ctx) {
    var a = ctx.app, lang = a.lang;

        { cells: [{ text: T('Key', 'Ключ', 'Schlüssel', 'Sleutel', 'Clé', 'Clave','Legenda') }, { text: e.id }] }
      ]

  function repaint() {
    listSig = detailSig = null;
    if (app) app.sync();
    if (stage) stage.schedule();

  function adopt(a) {
    app = a;
    stage = (a.stages && a.stages[0]) || null;

  /* ---- the python export: the same catalogue, the same filter ------------ */
  function pySource() {
    var data = CATALOG.map(function (e) {
      return { id: e.id, g: e.g, std: e.std, name_en: e.name.en, hay: HAY[e.id] };
    });
    return [
      'import json',
      '',
      '# The catalogue, exactly as the page holds it. "hay" is the searched text:',
      '# id, group, standard and the name, meaning and use in all seven languages,',
      '# lower-cased once when the page loads.',
      'CATALOG = json.loads(r"""' + JSON.stringify(data) + '""")',
      'BY_ID = dict((e["id"], e) for e in CATALOG)',
      '',
      '',
      'def tokens(q):',
      '    """The query, lower-cased and split on whitespace, as the page does it."""',
      '    q = " ".join(str(q or "").lower().split())',
      '    return q.split(" ") if q else []',
      '',
      '',
      'def matches(query, group, standard):',
      '    """Every token must occur in the entry text; then the two filters."""',
      '    toks = tokens(query)',
      '    out = []',
      '    for e in CATALOG:',
      '        if group != "all" and e["g"] != group:',
      '            continue',
      '        if standard == "iso" and e["std"] not in ("iso", "both"):',
      '            continue',
      '        if standard == "aws" and e["std"] not in ("aws", "both"):',
      '            continue',
      '        if all(t in e["hay"] for t in toks):',
      '            out.append(e["id"])',
      '    return out',
      '',
      '',
      'def compute():',
      '    ids = matches(INPUTS["query"], INPUTS["group"], INPUTS["standard"])',
      '    sel = INPUTS["selected"] if INPUTS["selected"] in BY_ID else (ids[0] if ids else CATALOG[0]["id"])',
      '    e = BY_ID[sel]',
      '    return {',
      '        "matches": len(ids),',
      '        "catalogue_size": len(CATALOG),',
      '        "iso_matches": len([i for i in ids if BY_ID[i]["std"] in ("iso", "both")]),',
      '        "aws_matches": len([i for i in ids if BY_ID[i]["std"] in ("aws", "both")]),',
      '        "selected": sel,',
      '        "selected_group": e["g"],',
      '        "selected_standard": e["std"],',
      '        "selected_name_en": e["name_en"],',
      '        "match_ids": " ".join(ids),',
      '    }'
    ].join('\n');
  }

  /* ---- the record ------------------------------------------------------- */
  function record() {
    var r = last;
    return {
      inputs: { query: state.q, group: state.group, standard: state.standard, selected: state.sel },
      outputs: {
        matches: r.n,
        catalogue_size: r.total,
        iso_matches: r.iso,
        aws_matches: r.aws,
        selected: r.sel,
        selected_group: r.entry.g,
        selected_standard: r.entry.std,
        selected_name_en: r.entry.name.en,
        match_ids: r.ids.join(' ')
      },
      units: {
        query: 'text', group: 'text', standard: 'text', selected: 'text',
        matches: 'count', catalogue_size: 'count', iso_matches: 'count', aws_matches: 'count',
        selected_group: 'text', selected_standard: 'text', selected_name_en: 'text', match_ids: 'text'
      },
      model: {
        equations: [
          'match = every whitespace-separated token of the query occurs in the entry text',
          'entry text = id + group + standard + name + meaning + use, in all seven languages, lower-cased',
          'group filter: group = "all" or entry.group = group',
          'standard filter: standard = "all" or entry.standard in {standard, "both"}',
          'selected = the requested key if it exists, else the first match, else the first entry'
        ],
        ranges: ['a lookup over a fixed catalogue of ' + CATALOG.length + ' entries; no physical quantity is computed'],
        notes: [
          'prototype: no benchmark and no independent validation',
          'record.units names text and counts because this tool records no physical quantity',
          'the drawings are schematic and are not built to the construction rules of ISO 2553 or AWS A2.4'
        ]
      },
      warnings: r.n === 0 ? ['no catalogue entry matches the current filter'] : []
    };
  }

                  'Recoge los símbolos de soldadura de ISO 2553 y AWS A2.4, dibuja cada uno y lo explica. Filtre por grupo o norma, o escriba una palabra.','Zestawia znaki spawalnicze według ISO 2553 i AWS A2.4, rysuje każdy z nich i objaśnia jego znaczenie. Filtruj według grupy lub normy, albo wpisz słowo.')
        },
        topics: {
          reading: {
            title: T('Reading a weld callout', 'Як читати познаку шва', 'Eine Schweißangabe lesen',
                     'Een lasaanduiding lezen', 'Lire une indication de soudure', 'Leer una indicación de soldadura','Odczytywanie oznaczenia spoiny'),
            body: T('Start at the arrow: it names the joint and the arrow side. Then the symbol on the reference line says what kind of weld, the figures to its left the size, the figures to its right the length and spacing, and anything in the tail the process or the procedure.',
                    'Починайте зі стрілки: вона вказує з’єднання і сторону стрілки. Далі познака на лінії-виносці каже, який це шов, цифри ліворуч — розмір, цифри праворуч — довжину і крок, а у хвості — процес або технологію.',
                    'Beim Pfeil beginnen: er benennt den Stoß und die Pfeilseite. Das Symbol auf der Bezugslinie sagt die Nahtart, die Zahlen links das Maß, die Zahlen rechts Länge und Teilung, die Gabel Prozess oder Verfahren.',
                    'Begin bij de pijl: die wijst de verbinding en de pijlzijde aan. Het symbool op de referentielijn zegt welk lastype, de getallen links de maat, rechts lengte en steek, en de vork het proces of de procedure.',
                    'Commencer par la flèche : elle désigne le joint et le côté flèche. Le symbole sur la ligne de référence donne le type de soudure, les chiffres à gauche la cote, ceux à droite la longueur et le pas, la fourche le procédé.',
                    'Empiece por la flecha: señala la junta y el lado de la flecha. El símbolo sobre la línea de referencia da el tipo de soldadura, las cifras a la izquierda el tamaño, las de la derecha la longitud y el paso, y la cola el proceso.','Zacznij od strzałki: wskazuje złącze i stronę strzałki. Następnie znak na linii odniesienia mówi, jaki to rodzaj spoiny, liczby po jego lewej — wymiar, liczby po prawej — długość i rozstaw, a cokolwiek w ogonie — proces lub procedurę.')
          },
          sides: {
            title: T('Arrow side and other side', 'Сторона стрілки та зворотна', 'Pfeilseite und Gegenseite',
                     'Pijlzijde en andere zijde', 'Côté flèche et autre côté', 'Lado de la flecha y otro lado','Strona strzałki i strona przeciwna'),
            body: T('The single convention that decides where the weld goes. AWS A2.4 and ISO system B place the arrow-side symbol below the reference line; ISO system A places it on the continuous line and puts the other side on the dashed one. A drawing that mixes the two is a drawing to send back.',
                    'Головна умовність, що визначає, де саме шов. AWS A2.4 і система B ISO ставлять познаку сторони стрілки під лінією-виноскою; система A ISO — на суцільній лінії, а зворотну сторону на штриховій. Креслення, що змішує обидві, слід повернути.',
                    'Die Konvention, die entscheidet, wo die Naht liegt. AWS A2.4 und ISO-System B setzen das Pfeilseiten-Symbol unter die Bezugslinie; ISO-System A auf die durchgezogene Linie und die Gegenseite auf die gestrichelte. Eine Zeichnung, die beides mischt, geht zurück.',
                    'De afspraak die bepaalt waar de las komt. AWS A2.4 en ISO-systeem B zetten het pijlzijde-symbool onder de referentielijn; ISO-systeem A op de doorgetrokken lijn en de andere zijde op de streepjeslijn. Een tekening die beide mengt, gaat terug.',
                    'La convention qui décide de l’emplacement de la soudure. L’AWS A2.4 et le système B de l’ISO placent le symbole côté flèche sous la ligne de référence ; le système A le met sur la ligne continue et l’autre côté sur la tiretée. Un plan qui mélange les deux est à renvoyer.',
                    'El convenio que decide dónde va la soldadura. AWS A2.4 y el sistema B de ISO colocan el símbolo del lado de la flecha debajo de la línea; el sistema A lo pone en la línea continua y el otro lado en la discontinua. Un plano que mezcle ambos hay que devolverlo.','Jedyna konwencja, która decyduje, po której stronie leży spoina. AWS A2.4 i system B według ISO umieszczają znak strony strzałki pod linią odniesienia; system A według ISO umieszcza go na linii ciągłej, a stronę przeciwną na przerywanej. Rysunek mieszający oba systemy należy odesłać do poprawy.')
          },
          isoaws: {
            title: T('ISO 2553 and AWS A2.4', 'ISO 2553 та AWS A2.4', 'ISO 2553 und AWS A2.4',
                     'ISO 2553 en AWS A2.4', 'ISO 2553 et AWS A2.4', 'ISO 2553 y AWS A2.4','ISO 2553 i AWS A2.4'),
            body: T('Two symbol languages for the same thing. They share most elementary symbols, and differ in the identification line, in the finish letters, and in what the spacing figure of an intermittent weld measures. Filter by standard to see what one of them actually uses.',
                    'Дві мови познак для того самого. Більшість основних познак спільні; різняться ідентифікаційна лінія, літери оброблення і те, що саме означає крок переривчастого шва. Фільтр за стандартом показує, що використовує кожен.',
                    'Zwei Symbolsprachen für dieselbe Sache. Die meisten Grundsymbole sind gleich; Unterschiede gibt es bei der Identifikationslinie, den Bearbeitungsbuchstaben und der Bedeutung des Abstandsmaßes bei unterbrochenen Nähten. Der Normfilter zeigt, was jede wirklich nutzt.',
                    'Twee symbooltalen voor hetzelfde. De meeste basissymbolen zijn gelijk; verschillen zitten in de identificatielijn, de bewerkingsletters en wat de afstandsmaat van een onderbroken las meet. Filter op norm om te zien wat elk gebruikt.',
                    'Deux langages symboliques pour la même chose. La plupart des symboles élémentaires sont communs ; les différences portent sur la ligne d’identification, les lettres de finition et ce que mesure l’espacement d’une soudure discontinue. Filtrez par norme.',
                    'Dos lenguajes simbólicos para lo mismo. La mayoría de los símbolos elementales coinciden; difieren la línea de identificación, las letras de acabado y qué mide la separación de una soldadura discontinua. Filtre por norma para verlo.','Dwa języki znaków dla tej samej rzeczy. Mają wspólną większość znaków podstawowych, a różnią się linią identyfikacyjną, literami obróbki i tym, co mierzy wymiar rozstawu w spoinie przerywanej. Filtruj według normy, aby zobaczyć, czego naprawdę używa każda z nich.')
          },
          dims: {
            title: T('The figures around the symbol', 'Цифри навколо познаки', 'Die Zahlen am Symbol',
                     'De getallen bij het symbool', 'Les chiffres autour du symbole', 'Las cifras junto al símbolo','Liczby wokół znaku'),
            body: T('Size on the left, length and spacing on the right, number of elements with them. For a fillet the letter matters as much as the number: a is the design throat, z the leg, and a5 is not z5.',
                    'Розмір ліворуч, довжина і крок праворуч, кількість — поруч із ними. Для кутового шва літера важить не менше за число: a — розрахункова висота, z — катет, і a5 це не z5.',
                    'Maß links, Länge und Teilung rechts, Anzahl dabei. Bei der Kehlnaht zählt der Buchstabe so viel wie die Zahl: a ist die Nahtdicke, z das Schenkelmaß — a5 ist nicht z5.',
                    'Maat links, lengte en steek rechts, aantal daarbij. Bij een hoeklas telt de letter even zwaar als het getal: a is de keelhoogte, z de zijde — a5 is niet z5.',
                    'La cote à gauche, longueur et pas à droite, le nombre avec eux. Pour une soudure d’angle, la lettre compte autant que le chiffre : a est la gorge, z le côté — a5 n’est pas z5.',
                    'El tamaño a la izquierda, longitud y paso a la derecha, y con ellos el número. En un cordón en ángulo la letra importa tanto como la cifra: a es la garganta, z el cateto — a5 no es z5.','Wymiar po lewej, długość i rozstaw po prawej, liczba odcinków razem z nimi. W spoinie pachwinowej litera liczy się tyle samo co liczba: a to grubość obliczeniowa, z — wymiar ramienia, a a5 to nie to samo co z5.')
          }
        },
        tour: [
          { topic: 'reading', focus: '[data-dgu-field="f-q"]' },
          { topic: 'sides', focus: '.dgu-stage' },
          { topic: 'isoaws', focus: '[data-dgu-field="f-standard"]' },
          { topic: 'dims', focus: '[data-dgu-panel="list"]' }
        ]
      },

      footer: T('Sources: ISO 2553 (welded, brazed and soldered joints — symbolic representation on drawings) and AWS A2.4 (standard symbols for welding, brazing and nondestructive examination). The drawings here are schematic: they show the shape of each symbol, not the construction proportions, line widths or text heights either standard prescribes. Where the two standards differ, the entry says so.',
                'Джерела: ISO 2553 (зварні, паяні та лудильні з’єднання — умовні познаки на кресленнях) і AWS A2.4 (стандартні познаки для зварювання, паяння та неруйнівного контролю). Рисунки схематичні: показано форму познаки, а не побудовні пропорції, товщини ліній чи висоти шрифту. Розбіжності між стандартами зазначено в записі.',
                'Quellen: ISO 2553 (Schweiß-, Löt- und Hartlötverbindungen — symbolische Darstellung in Zeichnungen) und AWS A2.4 (Standardsymbole für Schweißen, Löten und zerstörungsfreie Prüfung). Die Zeichnungen sind schematisch: sie zeigen die Form, nicht die Konstruktionsproportionen, Linienbreiten oder Schrifthöhen. Unterschiede zwischen beiden Normen stehen im Eintrag.',
                'Bronnen: ISO 2553 (gelaste, gesoldeerde en hardgesoldeerde verbindingen — symbolische weergave op tekeningen) en AWS A2.4 (standaardsymbolen voor lassen, solderen en niet-destructief onderzoek). De tekeningen zijn schematisch: ze tonen de vorm, niet de constructieverhoudingen, lijndikten of teksthoogten. Verschillen tussen beide normen staan bij het item.',
                'Sources : ISO 2553 (assemblages soudés et brasés — représentation symbolique sur les dessins) et AWS A2.4 (symboles normalisés pour le soudage, le brasage et le contrôle non destructif). Les dessins sont schématiques : ils donnent la forme, non les proportions de construction, largeurs de trait ou hauteurs d’écriture. Les écarts entre les deux normes sont signalés dans la fiche.',
                'Fuentes: ISO 2553 (uniones soldadas — representación simbólica en los dibujos) y AWS A2.4 (símbolos normalizados para soldeo, soldeo fuerte y ensayos no destructivos). Los dibujos son esquemáticos: muestran la forma, no las proporciones de construcción, grosores de línea ni alturas de texto. Las diferencias entre ambas normas se indican en cada ficha.','Źródła: ISO 2553 (złącza spawane, lutowane twardo i lutowane miękko — przedstawianie symboliczne na rysunkach) oraz AWS A2.4 (standardowe symbole spawania, lutowania i badań nieniszczących). Rysunki tutaj są schematyczne: pokazują kształt każdego znaku, nie proporcje konstrukcyjne, szerokości linii ani wysokości pisma przepisane przez którąkolwiek z norm. Tam, gdzie normy się różnią, mówi o tym dany wpis.'),

      on: {
        rebuild: adopt,
        compute: function (s) {
          last = solve(s);
          if (stage) stage.schedule();
          /* a reference layout builds no results view, so there is nothing to
             return: the answer is the filtered content itself (AUTHORING §3.3) */
        }
      }
    });
    return a;
  }

  function boot() {
    if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1') {
      app = buildUI();

      /* the filters — the only inputs a lookup has. A reference layout has no
         `inputs` region, so they live in `nav` and Reset lives with them. */
      app.panel({
        id: 'filters',
        slot: 'nav',
        title: T('Filter', 'Фільтр', 'Filter', 'Filter', 'Filtre', 'Filtro','Filtr'),
        learn: 'reading',
        actionsAlign: 'end',
        actions: [app.resetAction()],
        fields: [
          { id: 'f-q', key: 'q', type: 'text', inputType: 'search',
            label: T('Search', 'Пошук', 'Suche', 'Zoeken', 'Recherche', 'Buscar','Szukaj'),
            placeholder: T('fillet, contour, tail…', 'кутовий, контур, хвіст…', 'Kehlnaht, Kontur, Gabel…',
                           'hoeklas, contour, vork…', 'angle, contour, fourche…', 'ángulo, contorno, cola…','pachwinowa, kontur, ogon…'),
            hint: T('Searches the names and the meanings in all seven languages.',
                    'Шукає в назвах і поясненнях усіма сімома мовами.',
                    'Sucht in Namen und Bedeutungen in allen sieben Sprachen.',
                    'Zoekt in namen en betekenissen in alle zeven talen.',
                    'Cherche dans les noms et les significations dans les sept langues.',
                    'Busca en los nombres y los significados en los siete idiomas.','Przeszukuje nazwy i znaczenia we wszystkich siedmiu językach.') },
          { id: 'f-group', key: 'group', type: 'select',
            label: T('Group', 'Група', 'Gruppe', 'Groep', 'Groupe', 'Grupo','Grupa'),
            options: function () {
              var out = [['all', T('All groups', 'Усі групи', 'Alle Gruppen', 'Alle groepen', 'Tous les groupes', 'Todos los grupos','Wszystkie grupy')]];
              ['structure', 'weldtype', 'supplementary', 'finish', 'dimension'].forEach(function (g) {
                out.push([g, GROUP_LABEL[g]]);
              });
              return out;
            } },
          { id: 'f-standard', key: 'standard', type: 'segmented', learn: 'isoaws',
            label: T('Standard', 'Стандарт', 'Norm', 'Norm', 'Norme', 'Norma','Norma'),
            options: [
              ['all', T('Both', 'Обидва', 'Beide', 'Beide', 'Les deux', 'Ambas','Obie')],
              ['iso', 'ISO 2553'],
              ['aws', 'AWS A2.4']
            ] },
          { id: 'f-note', type: 'note',
            label: T('The selected symbol stays selected when the filter hides it.',
                     'Вибрана познака лишається вибраною, навіть якщо фільтр її ховає.',
                     'Das gewählte Symbol bleibt gewählt, auch wenn der Filter es ausblendet.',
                     'Het gekozen symbool blijft gekozen, ook als het filter het verbergt.',
                     'Le symbole sélectionné le reste même si le filtre le masque.',
                     'El símbolo seleccionado sigue seleccionado aunque el filtro lo oculte.','Wybrany znak pozostaje wybrany, nawet gdy filtr go ukrywa.') }
        ]
      });

      /* the drawing of the selected symbol: the one surface the tool owns */
      app.stage({
        slot: 'stage',
        minHeight: 250,
        caption: T('The selected symbol', 'Вибрана познака', 'Das gewählte Symbol',
                   'Het gekozen symbool', 'Le symbole sélectionné', 'El símbolo seleccionado','Wybrany znak'),
        a11y: function () {
          var e = solve(state).entry;
          return L(e.name) + '. ' + L(e.mean);
        },
        render: function (size, st) {
          drawInto(st.canvas(), size.w, size.h, solve(state).entry, true, app.lang);
        }
      });
      adopt(app);

      app.panel({
        id: 'detail',
        slot: 'stage',
        title: T('What it means', 'Що це означає', 'Was es bedeutet', 'Wat het betekent',
                 'Ce que cela signifie', 'Qué significa','Co oznacza'),
        learn: 'sides',
        render: paintDetail,
        sync: paintDetail
      });

      app.panel({
        id: 'list',
        slot: 'results',
        title: T('The symbol set', 'Набір познак', 'Der Symbolsatz', 'De symbolenset',
                 'Le jeu de symboles', 'El conjunto de símbolos','Zestaw znaków'),
        learn: 'dims',
        note: T('Choose an element to see it drawn and explained above.',
                'Оберіть елемент, щоб побачити його рисунок і пояснення вище.',
                'Ein Element wählen, um es oben gezeichnet und erklärt zu sehen.',
                'Kies een element om het hierboven getekend en uitgelegd te zien.',
                'Choisissez un élément pour le voir dessiné et expliqué ci-dessus.',
                'Elija un elemento para verlo dibujado y explicado arriba.','Wybierz element, aby zobaczyć go narysowanego i objaśnionego powyżej.'),
        render: paintList,
        sync: paintList
      });

      /* the drawings read the theme tokens, so they are repainted when the
         theme changes — the framework publishes the hook, the tool uses it */
      DiagramUI.theme.watch(repaint);

      app.ready();
    } else {
      /* honest degradation: the framework that would render a message is gone.
         The shared bar, the disclaimer and the record are not, so Diagram.init
         below still runs and the page still exports what it knows. */
      document.title = 'diagram-ui.js v1 is required — welding symbols';
    }

    /* ======================================================= 5. the data layer
       Unconditional, outside every branch: window.__diagramReady, the shared
       bar, the permalink and the record must survive a missing diagram-ui.js. */
    if (window.Diagram) {
      Diagram.init({
        id: 'weldsymbols',
        file: 'weldsymbols.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) {
            Object.assign(state, o || {});
            if (app) { app.sync(); app.run(); } else { last = solve(state); }
          }
        },
        record: record,
        python: function () {
          return {
            code: pySource(),
            requires: [],
            basis: {
              kind: 'reproduce',
              note: 'the same catalogue and the same token filter as the page, in the same order',
              deviation: 'none observed'
            },
            selftest: { tolerance: 0, note: 'counts and keys are exact; nothing here is a floating-point quantity' }
          };
        },
        report: {
          sections: function () {
            try {
              if (!stage || !stage.cv) return [];
              return [{
                title: L(T('The selected symbol', 'Вибрана познака', 'Das gewählte Symbol',
                           'Het gekozen symbool', 'Le symbole sélectionné', 'El símbolo seleccionado','Wybrany znak')),
                image: {
                  src: stage.cv.toDataURL('image/png'),
                  width: '60%',
                  alt: L(solve(state).entry.name),
                  caption: L(solve(state).entry.name)
                }
              }];
            } catch (e) { return []; }
          }
        }
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
