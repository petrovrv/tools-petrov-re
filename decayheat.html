/* ===================================================================
   Step (histogram) chart on a log x-axis — used for the gamma and
   neutron spectra.  y may be logarithmic or linear.
   =================================================================== */
function stepChart(host, cfg) {
  host.innerHTML = '';
  const W = cfg.width || 900, Hh = cfg.height || 260;
  const m = { l: 66, r: 16, t: 12, b: 52 };
  const svg = el('svg', { viewBox: '0 0 ' + W + ' ' + Hh, class: 'chart',
    preserveAspectRatio: 'xMidYMid meet' }, host);
  const edges = cfg.edges, series = cfg.series.filter(function (s) { return s.vals; });
  if (!series.length || edges.length < 2) return;

  let ymax = 0, ymin = Infinity;
  series.forEach(function (s) {
    for (let k = 0; k < s.vals.length; k++) {
      const v = s.vals[k];
      if (v > ymax) ymax = v;
      if (v > 0 && v < ymin) ymin = v;
    }
  });
  if (!(ymax > 0)) return;
  const logY = cfg.logY !== false;
  if (logY) ymin = Math.max(ymin, ymax / Math.pow(10, cfg.decades || 6));
  const y0 = logY ? Math.pow(10, Math.floor(Math.log10(ymin))) : 0;
  const y1 = logY ? Math.pow(10, Math.ceil(Math.log10(ymax))) : ymax * 1.08;
  const lx0 = Math.log10(edges[0]), lx1 = Math.log10(edges[edges.length - 1]);
  const X = function (v) { return m.l + (Math.log10(v) - lx0) / (lx1 - lx0) * (W - m.l - m.r); };
  const Y = function (v) {
    const inner = Hh - m.t - m.b;
    if (!logY) return Hh - m.b - Math.max(0, v) / y1 * inner;
    const c = Math.max(v, y0);
    return Hh - m.b - (Math.log10(c) - Math.log10(y0)) / (Math.log10(y1) - Math.log10(y0)) * inner;
  };

  const g = el('g', {}, svg);
  if (logY) {
    for (let d = Math.ceil(Math.log10(y0)); d <= Math.log10(y1); d++) {
      const yy = Y(Math.pow(10, d));
      el('line', { x1: m.l, x2: W - m.r, y1: yy, y2: yy, class: 'grid' }, g);
      el('text', { x: m.l - 10, y: yy + 4, class: 'tick tick-y' }, g).textContent = '10' + sup(d);
    }
  } else {
    for (let k = 0; k <= 4; k++) {
      const yy = Y(y1 * k / 4);
      el('line', { x1: m.l, x2: W - m.r, y1: yy, y2: yy, class: 'grid' }, g);
      el('text', { x: m.l - 10, y: yy + 4, class: 'tick tick-y' }, g)
        .textContent = (k / 4).toFixed(2);
    }
  }
  for (let d = Math.ceil(lx0); d <= lx1; d++) {
    const xx = X(Math.pow(10, d));
    el('line', { x1: xx, x2: xx, y1: m.t, y2: Hh - m.b, class: 'grid' }, g);
    el('text', { x: xx, y: Hh - m.b + 17, class: 'tick tick-x' }, g)
      .textContent = (cfg.xTickFmt ? cfg.xTickFmt(Math.pow(10, d)) : '10' + sup(d));
  }
  el('line', { x1: m.l, x2: W - m.r, y1: Hh - m.b, y2: Hh - m.b, class: 'axis' }, g);
  el('line', { x1: m.l, x2: m.l, y1: m.t, y2: Hh - m.b, class: 'axis' }, g);
  el('text', { x: (m.l + W - m.r) / 2, y: Hh - 6, class: 'axlabel', 'text-anchor': 'middle' }, g)
    .textContent = cfg.xLabel || '';
  el('text', { x: 0, y: 0, class: 'axlabel', 'text-anchor': 'start',
    transform: 'translate(14,' + (Hh - m.b) + ') rotate(-90)' }, g).textContent = cfg.yLabel || '';

  series.forEach(function (s, i) {
    const col = s.color || seriesColor(i);
    let d = '';
    for (let k = 0; k < s.vals.length; k++) {
      const xa = X(edges[k]), xb = X(edges[k + 1]), yy = Y(s.vals[k]);
      d += (k === 0 ? 'M' + xa.toFixed(2) + ' ' + Y(y0).toFixed(2) + 'L' : 'L') +
        xa.toFixed(2) + ' ' + yy.toFixed(2) + 'L' + xb.toFixed(2) + ' ' + yy.toFixed(2);
    }
    if (s.fill) {
      el('path', { d: d + 'L' + X(edges[edges.length - 1]).toFixed(2) + ' ' +
        Y(y0).toFixed(2) + 'Z', fill: col, opacity: 0.16, stroke: 'none' }, svg);
    }
    el('path', { d: d, fill: 'none', stroke: col, 'stroke-width': 2,
      'stroke-linejoin': 'round' }, svg);
  });

  if (series.length >= 2) {
    chartLegend(host, series.map(function (s, i) {
      return { label: s.name, color: s.color || seriesColor(i) };
    }));
  }

  /* hover readout */
  const hover = el('g', { opacity: 0 }, svg);
  const band = el('rect', { y: m.t, height: Hh - m.t - m.b, fill: 'var(--grid-strong)',
    opacity: 0.18 }, hover);
  const tip = document.createElement('div');
  tip.className = 'chart-tip'; tip.style.display = 'none'; host.appendChild(tip);
  svg.addEventListener('pointerleave', function () {
    hover.setAttribute('opacity', 0); tip.style.display = 'none';
  });
  svg.addEventListener('pointermove', function (ev) {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) / r.width * W;
    if (px < m.l || px > W - m.r) { hover.setAttribute('opacity', 0); tip.style.display = 'none'; return; }
    const E = Math.pow(10, lx0 + (px - m.l) / (W - m.l - m.r) * (lx1 - lx0));
    let k = 0; while (k < edges.length - 2 && edges[k + 1] < E) k++;
    hover.setAttribute('opacity', 1);
    band.setAttribute('x', X(edges[k])); band.setAttribute('width', Math.max(1, X(edges[k + 1]) - X(edges[k])));
    let rows = '';
    series.forEach(function (s, i) {
      rows += '<div class="tip-row"><span class="sw" style="background:' +
        (s.color || seriesColor(i)) + '"></span>' + escapeHtml(s.name) +
        '<b>' + (cfg.unit ? fmtQty(s.vals[k], cfg.unit) : fmtSI(s.vals[k])) + '</b></div>';
    });
    tip.innerHTML = '<div class="tip-hd">' + (cfg.binFmt ? cfg.binFmt(edges[k], edges[k + 1])
      : fmtSI(edges[k], 2) + ' – ' + fmtSI(edges[k + 1], 2)) + '</div>' + rows;
    tip.style.display = 'block';
    tip.style.left = Math.min(r.width - tip.offsetWidth - 8, Math.max(4, px / W * r.width + 14)) + 'px';
    tip.style.top = Math.max(4, ev.clientY - r.top - tip.offsetHeight - 12) + 'px';
  });
}


/* ===================================================================
   Stacked share chart: who carries the quantity at each moment.
   x is logarithmic time, y is 0..100 %.  This is the view that makes
   a hand-over visible — one band shrinks exactly as another grows.
   =================================================================== */
function shareChart(host, cfg) {
  host.innerHTML = '';
  const W = cfg.width || 900, Hh = cfg.height || 380;
  const m = { l: 52, r: 108, t: 16, b: 52 };
  const svg = el('svg', { viewBox: '0 0 ' + W + ' ' + Hh, class: 'chart',
    preserveAspectRatio: 'xMidYMid meet' }, host);
  const xs = cfg.x, bands = cfg.bands;
  if (!xs || !bands.length) return;
  const lx0 = Math.log10(xs[0]), lx1 = Math.log10(xs[xs.length - 1]);
  const X = function (v) { return m.l + (Math.log10(v) - lx0) / (lx1 - lx0) * (W - m.l - m.r); };
  const Y = function (v) { return Hh - m.b - v * (Hh - m.t - m.b); };

  const g = el('g', {}, svg);
  for (let k = 0; k <= 4; k++) {
    const yy = Y(k / 4);
    el('line', { x1: m.l, x2: W - m.r, y1: yy, y2: yy, class: 'grid' }, g);
    el('text', { x: m.l - 8, y: yy + 4, class: 'tick tick-y' }, g)
      .textContent = (k * 25) + '%';
  }
  TIME_TICKS.forEach(function (tk) {
    if (tk[0] < xs[0] * 0.999 || tk[0] > xs[xs.length - 1] * 1.001) return;
    const xx = X(tk[0]);
    el('line', { x1: xx, x2: xx, y1: m.t, y2: Hh - m.b, class: 'grid' }, g);
    el('text', { x: xx, y: Hh - m.b + 18, class: 'tick tick-x' }, g).textContent = t(tk[1]);
  });
  el('text', { x: m.l, y: Hh - 8, class: 'axlabel', 'text-anchor': 'start' }, g)
    .textContent = cfg.xLabel || '';

  /* cumulative bands, drawn bottom-up, each separated by a hairline of
     surface colour so adjacent fills stay legible */
  const acc = new Float64Array(xs.length);
  const labels = [];
  bands.forEach(function (b, i) {
    const col = b.color || seriesColor(i);
    let up = '', dn = '';
    for (let k = 0; k < xs.length; k++) {
      const y1 = acc[k], y2 = acc[k] + b.vals[k];
      up += (k ? 'L' : 'M') + X(xs[k]).toFixed(2) + ' ' + Y(y2).toFixed(2);
      dn = 'L' + X(xs[k]).toFixed(2) + ' ' + Y(y1).toFixed(2) + dn;
    }
    el('path', { d: up + dn + 'Z', fill: col, opacity: 0.9,
      stroke: 'var(--surface-1)', 'stroke-width': 1.2 }, svg);
    /* label the band where it is widest, if it is wide enough to read */
    let best = 0, bestW = 0;
    for (let k = 0; k < xs.length; k++) if (b.vals[k] > bestW) { bestW = b.vals[k]; best = k; }
    if (bestW > 0.07) labels.push({ x: X(xs[best]), y: Y(acc[best] + bestW / 2), text: b.name });
    for (let k = 0; k < xs.length; k++) acc[k] += b.vals[k];
  });
  labels.forEach(function (L) {
    const tx = el('text', { x: L.x, y: L.y + 4, class: 'blabel', 'text-anchor': 'middle',
      fill: 'var(--text-primary)', stroke: 'var(--surface-1)', 'stroke-width': 3.5,
      'paint-order': 'stroke', 'font-weight': 600 }, svg);
    tx.textContent = L.text;
  });
  el('line', { x1: m.l, x2: W - m.r, y1: Hh - m.b, y2: Hh - m.b, class: 'axis' }, svg);

  chartLegend(host, bands.map(function (b, i) {
    return { label: b.name, color: b.color || seriesColor(i) };
  }));
}


/* ===================================================================
   APPLICATION
   -------------------------------------------------------------------
   The screen is the shared shell of diagram-ui.js (tools.petrov.re/ui/v1):
   header, slots, panels, fields, results, learn mode and stage sizing all
   come from the framework.  Everything below the line "model" is untouched:
   the depletion and decay solvers, the source terms, the chart primitives,
   the calculation record and the permalink payload are the same code and
   the same numbers as before the port.
   =================================================================== */

const YR = 3.15576e7;
const ACTINIDE_IDS = IDS.filter(function (id) { return NUC[id].Z >= 90; });

const state = {
  preset: 'pwr_w17',
  hm: 461.4, mat: 'oxide',
  comp: [{ id: 'U235', w: 4.50 }, { id: 'U234', w: 0.04 }, { id: 'U238', w: 95.46 }],
  mode: 'burnup', bu: 50, pw: 17.5, years: 3.61,
  s: 0.33, d: 0.03,
  str: [{ m: 'zircaloy4', kg: 108 }, { m: 'inconel718', kg: 1.6 }, { m: 'ss304', kg: 12 }],
  steps: 40, strFlux: 1.0, nImp: 25, selfAbs: 30, useSelfAbs: true, doseR: 10, doseL: 3.66,
  norm: 'asm', emisMode: 'emission', isoMetric: 'mass', composCat: 'all',
  isoTView: 'lines',
  isoTMetric: 'act', isoSel: [], isoCand: [],
  tIndex: 94,
  result: null, cases: []
};
/* What Reset restores: the screen as it opens, which is this literal with the
   tool's own default preset already applied (init() fills it in). */
let DEFAULTS = JSON.parse(JSON.stringify(state));

/* time grid: 1 s ... 10^6 years */
const TGRID = (function () {
  const a = [], n = 150, l0 = 0, l1 = Math.log10(3.15576e13);
  for (let i = 0; i < n; i++) a.push(Math.pow(10, l0 + (l1 - l0) * i / (n - 1)));
  return a;
})();

/* ------------------------------------------------------------------ */
function h(tag, attrs, kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k === 'text') e.textContent = attrs[k];
    else if (k.slice(0, 2) === 'on') e[k] = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
  return e;
}

function derivedYears() {
  if (state.mode === 'years') return state.years;
  return state.bu * state.hm / state.pw / 365.25;
}
function derivedBurnup() {
  if (state.mode === 'burnup') return state.bu;
  return state.years * 365.25 * state.pw / state.hm;
}

function currentCfg() {
  const comp = {};
  state.comp.forEach(function (c) { if (c.id) comp[c.id] = (comp[c.id] || 0) + (+c.w || 0); });
  const str = {};
  state.str.forEach(function (r) { if (r.m) str[r.m] = (str[r.m] || 0) + (+r.kg || 0); });
  return {
    hm: +state.hm, comp: comp, mat: state.mat, str: str, pw: +state.pw,
    s: +state.s, d: +state.d, steps: +state.steps, strFlux: +state.strFlux,
    nImp: (+state.nImp) * 1e-6, years: derivedYears()
  };
}

/* ------------------------------------------------------------------
   Calculation
   ------------------------------------------------------------------ */
function calculate() {
  const cfg = currentCfg();
  const irr = irradiate(cfg);
  const N0 = new Float64Array(NN);
  for (let i = 0; i < NN; i++) N0[i] = irr.fuel[i] + irr.str[i];
  const sol = coolSolution(N0);
  const opt = { mat: cfg.mat, r: state.doseR * 100, len: state.doseL * 100,
    selfAbs: state.selfAbs, useSelfAbs: state.useSelfAbs };
  const curve = TGRID.map(function (tt) {
    const N = evalAt(sol, tt);
    const s = sourceTerms(N, opt);
    return { t: tt, heat: s.heat, gPh: s.gPh, gMeV: s.gMeV, n: s.nTot,
      nSF: s.nSF, nAN: s.nAN, dose: s.doseTot, doseG: s.doseG, doseN: s.doseN,
      act: s.act };
  });
  /* Candidates for the isotope-vs-time picker: everything that leads on
     ANY of the metrics at ANY point of the time axis, not just now. */
  const probeT = [8.64e4, 3.15576e6, 3.15576e7, 9.47e8, 3.15576e9, 3.15576e10,
    3.15576e11, 3.15576e13];
  const score = new Float64Array(NN);
  probeT.forEach(function (tt) {
    const Np = evalAt(sol, tt), Sp = sourceTerms(Np, opt);
    [massVector(Np), activityVector(Np), Sp.per.heat, Sp.per.g, Sp.per.n,
      Sp.per.dose].forEach(function (v) {
      let tot = 0;
      for (let i = 0; i < NN; i++) if (!NUC[IDS[i]].lump) tot += v[i];
      if (tot > 0) for (let i = 0; i < NN; i++) {
        if (!NUC[IDS[i]].lump && v[i] / tot > score[i]) score[i] = v[i] / tot;
      }
    });
  });
  /* the nuclides an engineer always wants on the list, whether or not they
     happen to lead any single metric in this particular case */
  const ALWAYS = ['Cs137', 'Sr90', 'Y90', 'Ba137m', 'Cs134', 'Ce144', 'Ru106', 'Eu154',
    'Eu155', 'Sb125', 'Kr85', 'H3', 'C14', 'Tc99', 'I129', 'Se79', 'Zr93', 'Sn126',
    'Co60', 'Ni63', 'Nb94', 'Pu238', 'Pu239', 'Pu240', 'Pu241', 'Pu242', 'Np237',
    'Am241', 'Am243', 'Cm242', 'Cm244', 'U232', 'U233', 'U235', 'U238', 'Th228',
    'Tl208', 'Pa231', 'Th229', 'Ra226'];
  /* A nuclide earns a place either because it DOMINATES something, or
     because it GROWS.  Scoring on share alone hides exactly the daughters
     a decay chain is about: Th-229, Ra-226, Ac-227, Pb-210 never dominate
     anything, yet they climb by orders of magnitude. */
  const act0 = activityVector(N0);
  const peak = new Float64Array(NN), grow = new Float64Array(NN);
  probeT.forEach(function (tt) {
    const av = activityVector(evalAt(sol, tt));
    for (let i = 0; i < NN; i++) if (av[i] > peak[i]) peak[i] = av[i];
  });
  let peakMax = 0;
  for (let i = 0; i < NN; i++) if (peak[i] > peakMax) peakMax = peak[i];
  for (let i = 0; i < NN; i++) grow[i] = peak[i] / Math.max(act0[i], peak[i] * 1e-12);
  const seen = {}, cand = [], growCand = [];
  for (let i = 0; i < NN; i++) {
    const u = NUC[IDS[i]];
    /* skip the microsecond members that only sit in secular equilibrium */
    if (u.t !== null && u.t < 30) continue;
    if (score[i] > 0.007) cand.push(i);
    else if (grow[i] > 4 && peak[i] > peakMax * 1e-7 && !u.lump) growCand.push(i);
  }
  cand.sort(function (a, b) { return score[b] - score[a]; });
  growCand.sort(function (a, b) { return grow[b] - grow[a]; });
  let candIdx = cand.slice(0, 22);
  candIdx.forEach(function (i) { seen[IDS[i]] = 1; });
  growCand.slice(0, 14).forEach(function (i) {
    if (!seen[IDS[i]]) { candIdx.push(i); seen[IDS[i]] = 1; }
  });
  ALWAYS.forEach(function (id) {
    const i = IDX[id];
    if (i !== undefined && !seen[id] && N0[i] > 0) { candIdx.push(i); seen[id] = 1; }
  });
  candIdx.sort(function (a, b) { return (score[b] || 0) - (score[a] || 0); });
  /* the strongest in-growers among the offered nuclides — these are what
     make the chart interesting: something has to rise while others fall */
  const growers = candIdx.filter(function (i) { return grow[i] > 3; })
    .sort(function (a, b) { return grow[b] - grow[a]; })
    .slice(0, 4).map(function (i) { return IDS[i]; });

  let m0 = 0; const mv = massVector(N0);
  for (let i = 0; i < NN; i++) m0 += mv[i];
  state.result = {
    cfg: cfg, irr: irr, N0: N0, sol: sol, opt: opt, curve: curve,
    cand: candIdx, growers: growers, isoCache: {},
    tHM: cfg.hm / 1000, mass: m0,
    name: presetLabel(),
    ww: TGRID.map(function (tt) {
      return [tt, fpRefHeat(cfg.pw * 1e6, cfg.years * YR, tt, 202.5)];
    })
  };
  /* keep a sensible selection when the case changes */
  const keep = state.isoSel.filter(function (id) { return candIdx.indexOf(IDX[id]) >= 0; });
  if (keep.length) state.isoSel = keep;
  else {
    const def = candIdx.slice(0, 4).map(function (i) { return IDS[i]; });
    growers.forEach(function (id) { if (def.length < 8 && def.indexOf(id) < 0) def.push(id); });
    state.isoSel = def;
  }
  state.isoCand = candIdx.map(function (i) { return IDS[i]; });
}

/* the dose geometry alone changed: the depletion and the decay solution
   still hold, only the source terms have to be walked again  */
function relight() {
  const R = state.result;
  R.opt = { mat: R.cfg.mat, r: state.doseR * 100, len: state.doseL * 100,
    selfAbs: state.selfAbs, useSelfAbs: state.useSelfAbs };
  R.curve = TGRID.map(function (tt) {
    const s = sourceTerms(evalAt(R.sol, tt), R.opt);
    return { t: tt, heat: s.heat, gPh: s.gPh, gMeV: s.gMeV, n: s.nTot,
      nSF: s.nSF, nAN: s.nAN, dose: s.doseTot, doseG: s.doseG, doseN: s.doseN,
      act: s.act };
  });
}

/* one pass over the time grid fills every candidate for one metric */
function isoSeriesCache(metric) {
  const R = state.result;
  if (R.isoCache[metric]) return R.isoCache[metric];
  const need = ['heat', 'gamma', 'neutron', 'dose'].indexOf(metric) >= 0;
  const out = { _total: new Float64Array(TGRID.length) };
  R.cand.forEach(function (i) { out[IDS[i]] = new Float64Array(TGRID.length); });
  for (let p = 0; p < TGRID.length; p++) {
    const Np = evalAt(R.sol, TGRID[p]);
    const Sp = need ? sourceTerms(Np, R.opt) : null;
    const vp = isoVector(Np, Sp, metric);
    let tot = 0;
    for (let i = 0; i < NN; i++) if (!NUC[IDS[i]].lump || need) tot += vp[i];
    out._total[p] = tot;
    R.cand.forEach(function (i) { out[IDS[i]][p] = vp[i]; });
  }
  R.isoCache[metric] = out;
  return out;
}

/* metric vector for the isotope view */
function isoVector(N, S, metric) {
  if (metric === 'mass') return massVector(N);
  if (metric === 'mol') {
    const v = new Float64Array(NN);
    for (let i = 0; i < NN; i++) v[i] = N[i] / NA;
    return v;
  }
  if (metric === 'act') return activityVector(N);
  if (metric === 'heat') return S.per.heat;
  if (metric === 'gamma') return S.per.g;
  if (metric === 'neutron') return S.per.n;
  return S.per.dose;
}
function isoUnit(metric) {
  return metric === 'mass' ? t('unitG') : metric === 'mol' ? t('unitMol')
    : metric === 'act' ? t('unitBq') : metric === 'heat' ? t('unitW')
      : metric === 'gamma' ? 'MeV/s' : metric === 'neutron' ? t('uN') : t('axDose');
}
function isoAllowed(i) {
  const u = NUC[IDS[i]];
  if (u.lump && (state.isoMetric === 'mass' || state.isoMetric === 'mol')) return false;
  if (state.composCat !== 'all' && u.cat !== state.composCat) return false;
  return true;
}

function isoLabel(id) {
  const u = NUC[id];
  if (u.lump) return LANG === 'ru' ? 'коротк. осколки ' + id.slice(3) : 'short-lived FP ' + id.slice(3);
  if (id === 'FPrest') return LANG === 'ru' ? 'проч. осколки' : 'other FP';
  const m = id.match(/^([A-Z][a-z]?)(\d+)(m?)$/);
  return m ? m[1] + '-' + m[2] + (m[3] ? 'm' : '') : id;
}

/* string helpers: every label is a thunk, so a language change re-renders it */
const PL_T = {"Neutron spectrum":"Widmo neutronów","Category":"Kategoria","all":"wszystkie","actinides":"aktynowce","fission products":"produkty rozszczepienia","activation":"produkty aktywacji","View":"Widok","What this tool does":"Co robi to narzędzie","Twenty-seven assembly designs, each carrying its own heavy-metal mass, power, design burnup, spectrum and structural materials. Pick one and every field below is filled from it; change any of those fields and the preset becomes \"custom\", because the numbers no longer describe that design.":"Dwadzieścia siedem typów zestawów, każdy z własną masą metali ciężkich, mocą, projektowym wypaleniem, widmem i materiałami konstrukcyjnymi. Wybierz typ, a wszystkie pola poniżej zostaną wypełnione; zmiana któregokolwiek pola przełącza preset na „własny”, ponieważ wartości przestają odpowiadać temu projektowi.","Time since shutdown, from one second to a million years on a logarithmic grid of 150 points. It does not change the irradiation: it moves the reading point along the decay curves, and every tile, the gamma spectrum and the isotope bars follow it. It is recorded as the cooling time of the calculation record.":"Czas od wyłączenia od jednej sekundy do miliona lat, na logarytmicznej siatce 150 punktów. Nie zmienia napromienienia; przesuwa punkt odczytu po krzywych rozpadu, za którym podążają wszystkie kafle, widmo gamma i słupki izotopów. W zapisie obliczenia jest przechowywany jako czas chłodzenia.","Every source term can be read for the whole assembly or divided by its heavy-metal mass in tonnes. Per tonne is what standards and shipping-cask limits are usually written in; per assembly is what a pool or a cask actually holds. Only the presentation changes — and the units in the record change with it.":"Każdy człon źródłowy można odczytać dla całego zestawu albo podzielić przez masę metali ciężkich w tonach. Wartości na tonę są typowe dla norm i limitów pojemników transportowych; wartości na zestaw odpowiadają temu, co faktycznie znajduje się w basenie lub pojemniku. Zmienia się tylko sposób prezentacji oraz jednostki w zapisie obliczenia.","The heavy-metal mass is the uranium, plutonium and thorium in one assembly, without oxygen, cladding or grids. Decay heat scales almost linearly with it at a fixed burnup, so it is the single most sensitive number on this page.":"Masa metali ciężkich to uran, pluton i tor w jednym zestawie, bez tlenu, koszulek i rusztów. Przy stałym wypaleniu ciepło powyłączeniowe skaluje się z nią prawie liniowo, dlatego jest to najbardziej czuły parametr na tej stronie.","Weight per cent of each heavy nuclide at loading. The weights are used as entered: if they do not add to 100 %, the heavy-metal mass is split on them as given and the calculation record carries a warning. \"Normalise to 100 %\" rescales them for you.":"Procent masowy każdego ciężkiego nuklidu przy załadunku. Udziały są używane dokładnie tak, jak je wpisano: jeśli nie sumują się do 100 %, masa metali ciężkich jest dzielona według podanych wag, a zapis obliczenia zawiera ostrzeżenie. „Normalizuj do 100 %” przeskalowuje je automatycznie.","The chemical form the fuel is in. It sets which light elements sit next to the actinides, and through them the (alpha,n) neutron yield: an oxide gives the reference yield, a fluoride salt several times more, a metal almost none.":"Postać chemiczna paliwa. Określa, jakie lekkie pierwiastki znajdują się obok aktynowców, a przez to wydajność neutronów (alfa,n): tlenek daje wartość odniesienia, sól fluorkowa kilka razy większą, a metal prawie zerową.","Burnup and time in core are two ways of saying the same thing once the assembly power is fixed: the tool derives whichever one you did not give. Burnup drives the fission-product inventory; the irradiation time drives how far the actinide chains have climbed.":"Przy ustalonej mocy zestawu wypalenie i czas w rdzeniu opisują tę samą historię na dwa sposoby; narzędzie wyznacza parametr, którego nie podano. Wypalenie steruje inwentarzem produktów rozszczepienia, a czas napromienienia określa rozwój łańcuchów aktynowców.","Cladding, grids and springs are irradiated with the fuel and carry the cobalt-60 and nickel-63 that dominate the gamma dose of an assembly decades after discharge. Masses are per assembly; the flux they see is set by the ratio in the advanced panel.":"Koszulki, ruszty i sprężyny są napromieniane razem z paliwem i zawierają Co-60 oraz Ni-63, które po dziesięcioleciach od wyładunku mogą dominować w dawce od zestawu. Masy podaje się na zestaw; strumień w materiałach konstrukcyjnych określa współczynnik w panelu zaawansowanym.","Numerical and geometric settings: how many steps the depletion is integrated in, how much flux the structure sees relative to the fuel, the nitrogen impurity that feeds the N-14(n,p) route to carbon-14, and the geometry the dose rate is quoted for.":"Ustawienia numeryczne i geometryczne: liczba kroków całkowania wypalania, strumień w konstrukcji względem paliwa, zawartość azotu zasilająca drogę N-14(n,p) do C-14 oraz geometria, dla której podawana jest moc dawki.","Total decay heat against time since shutdown, on log-log axes. Without a comparison case the dashed line is the Way-Wigner correlation, carried as an order-of-magnitude crosscheck only and never graded. The hand-over from fission products to actinides is the bend near ten years.":"Całkowite ciepło powyłączeniowe w funkcji czasu od wyłączenia na osiach log-log. Bez przypadku porównawczego linia przerywana przedstawia korelację Way–Wignera, używaną wyłącznie jako kontrola rzędu wielkości i niepodlegającą ocenie. Przejście dominacji z produktów rozszczepienia na aktynowce widać jako załamanie w pobliżu dziesięciu lat.","Photons and neutrons are never added together: they are different particles with different biological weight. This chart shows them separately as emission rates, or converts both to sieverts per hour, where they are genuinely additive.":"Fotonów i neutronów nie sumuje się jako liczby cząstek: mają różne znaczenie biologiczne. Wykres pokazuje osobno szybkości emisji albo przelicza oba składniki na siwerty na godzinę, gdzie można je sumować.","Which nuclides carry the chosen quantity at the chosen cooling time. Mass and moles count atoms; activity, heat, photons, neutrons and dose count what those atoms do. The bars are sorted, so the answer to \"what is this made of\" is the first two or three rows.":"Pokazuje, które nuklidy odpowiadają za wybraną wielkość przy zadanym czasie chłodzenia. Masa i liczba moli opisują ilość atomów; aktywność, ciepło, fotony, neutrony i dawka opisują ich skutki. Słupki są posortowane, więc odpowiedź na pytanie „z czego to się składa” zwykle znajduje się w pierwszych dwóch lub trzech wierszach.","Freezes the current curve so the next case can be drawn against it. Up to seven cases are kept; the comparison is always on the normalisation currently selected, so switching between per assembly and per tonne moves every curve at once.":"Zamraża bieżącą krzywą, aby następny przypadek można było narysować obok. Przechowywanych jest do siedmiu przypadków; porównanie zawsze używa aktualnej normalizacji, więc przełączenie między „na zestaw” i „na tonę” zmienia wszystkie krzywe jednocześnie.","The shared interface layer could not be loaded, so the controls are not available. The calculation below still ran with the state this link carries, and the toolbar can still copy it, export it and report it.":"Nie udało się załadować wspólnej warstwy interfejsu, więc elementy sterujące są niedostępne. Obliczenie poniżej zostało jednak wykonane ze stanem zapisanym w tym odnośniku, a pasek narzędzi nadal może go kopiować, eksportować i raportować."};
function T(en, uk, de, nl, fr, es) { return { en: en, uk: uk, de: de, nl: nl, fr: fr, es: es, pl: PL_T[en] || en }; }
function L(o) { return function () { return o[LANG] || o.en; }; }
function K(key) { return function () { return t(key); }; }
/* the dictionary puts the unit in a few labels; the framework has a unit slot */
function cutUnit(s, units) {
  for (let i = 0; i < units.length; i++) {
    const suf = ', ' + units[i];
    if (s.length > suf.length && s.slice(-suf.length) === suf) return s.slice(0, -suf.length);
  }
  return s;
}

const refs = {};                     /* live nodes the tool re-renders itself */
const stages = {};
let chartVersion = 0;

/* ---- compute ------------------------------------------------------
   Two costs live behind one screen: a full depletion and decay solve
   (~1.5 s) and a walk of the source terms (~50 ms).  The tool used to
   pick between them at each control; the port picks between them from
   the state itself, so any driver - a field, a permalink, a handoff -
   gets the same partition.                                            */
function sigFull() {
  return JSON.stringify([state.hm, state.mat, state.comp, state.str, state.mode,
    state.bu, state.pw, state.years, state.s, state.d, state.steps,
    state.strFlux, state.nImp]);
}
function sigLight() {
  return JSON.stringify([state.doseR, state.doseL, state.selfAbs, state.useSelfAbs]);
}
let lastFull = null, lastLight = null, computeGen = 0;

function computeNow() {
  computeGen++;                       /* anything already queued is superseded */
  const sf = sigFull();
  if (sf !== lastFull) {
    calculate();
    lastFull = sf; lastLight = sigLight();
  } else {
    const sl = sigLight();
    if (sl !== lastLight) { relight(); lastLight = sl; }
  }
  renderCharts();
  return resultsPayload();
}

function onCompute() {
  if (state.result && sigFull() === lastFull && sigLight() === lastLight) {
    return computeNow();              /* cheap: answer in the same frame */
  }
  const gen = ++computeGen;
  return new Promise(function (resolve) {
    setTimeout(function () {
      if (gen !== computeGen) return;  /* a newer edit arrived; drop this one */
      resolve(computeNow());
    }, 350);
  });
}

function commit() { const a = A(); if (a) { a.sync(); a.run(); } }

function applyPresetState(id) {
  const p = PRESETS.filter(function (x) { return x.id === id; })[0];
  state.preset = id;
  state.isoSel = [];              /* a new fuel deserves a fresh default set */
  if (!p) return;
  state.hm = p.hm; state.mat = p.mat; state.pw = p.pw; state.bu = p.bu;
  state.mode = 'burnup';
  state.s = p.sp[0]; state.d = p.sp[1];
  state.comp = Object.keys(p.comp).map(function (k) { return { id: k, w: p.comp[k] }; });
  state.str = Object.keys(p.str).filter(function (k) { return MATERIALS[k]; })
    .map(function (k) { return { m: k, kg: p.str[k] }; });
}

/* The option list of the assembly-preset field.  This was a type:'custom'
   field wrapping a hand-built <select> because "there is no option-group
   support in the field vocabulary"; v3.1 added it (spec 6.3), so the eight

function presetOptions() {
  const groups = {}, order = [];
  PRESETS.forEach(function (p) {
    if (!groups[p.group]) { groups[p.group] = []; order.push(p.group); }
    groups[p.group].push(p);
  });
  const out = [['', t('preset_custom')]];
  order.forEach(function (g) {
    out.push({ group: t('grp' + g) !== 'grp' + g ? t('grp' + g) : g,
      options: groups[g].map(function (p) { return [p.id, presetName(p)]; }) });
  });
  return out;
}

function compTable(box) {
  box.classList.add('dh-bare');
  box.innerHTML = '';
  const wrap = h('div', { class: 'dh-rows' });
  let sum = 0;
  state.comp.forEach(function (row) { sum += +row.w || 0; });
  state.comp.forEach(function (row, i) {
    const s = h('select', { class: 'dgu-fctl', 'aria-label': t('comp'),
      onchange: function (e) { row.id = e.target.value; markCustom(); commit(); } });
    ACTINIDE_IDS.forEach(function (id) { s.appendChild(h('option', { value: id, text: isoLabel(id) })); });
    s.value = row.id;
    const n = h('input', { type: 'number', class: 'dgu-fctl dh-num', step: 0.01, min: 0,
      value: row.w, 'aria-label': isoLabel(row.id) + ', %',
      onchange: function (e) { row.w = parseFloat(e.target.value); markCustom(); commit(); } });
    const x = h('button', { class: 'dgu-btn ghost icon', type: 'button', title: t('del'),
      'aria-label': t('del') + ' ' + isoLabel(row.id), text: '×', 'data-dh': 'delcomp',
      onclick: function () { state.comp.splice(i, 1); markCustom(); commit(); } });
    wrap.appendChild(h('div', { class: 'dh-row' }, [s, n, x]));
  });
  const off = Math.abs(sum - 100) > 0.01;
  wrap.appendChild(h('div', { class: 'dh-row sum' }, [
    h('span', { class: 'dgu-hint', text: t('compSum') }),
    h('span', { class: 'dh-rov' + (off ? ' bad' : ''), text: sum.toFixed(3) + ' %' })
  ]));
  if (off) wrap.appendChild(h('div', { class: 'dgu-err', role: 'status', text: t('wNorm') }));
  wrap.appendChild(h('div', { class: 'dgu-panel-actions' }, [
    h('button', { class: 'dgu-btn', type: 'button', text: t('normalize'), 'data-dh': 'normalise',
      onclick: function () {
        if (sum > 0) state.comp.forEach(function (r) { r.w = r.w / sum * 100; });

    h('button', { class: 'dgu-btn', type: 'button', text: t('addRow'), 'data-dh': 'addcomp',
      onclick: function () { state.comp.push({ id: 'Pu239', w: 0 }); markCustom(); commit(); } })

}

/* ---- charts --------------------------------------------------------- */
function chartHost(st) {
  let c = st.body.querySelector('.chartwrap');
  if (!c) { c = h('div', { class: 'chartwrap' }); st.body.appendChild(c); }
  return c;
}
function chartCard(app, o) {
  let st = null;
  app.panel({ slot: o.slot, id: o.id, title: o.title, learn: o.learn, note: o.note,
    fields: o.fields || [],
    render: function (body) {
      /* a rebuild (language change) builds fresh panels: let the previous
         stage drop its ResizeObserver rather than leaving it on a dead node */
      if (stages[o.key] && stages[o.key].destroy) stages[o.key].destroy();
      st = new DiagramUI.Stage(app, {
        minHeight: o.minHeight || 180,
        a11y: o.a11y,
        render: function (size, s) {
          if (!state.result) return;
          if (s._w === size.w && s._v === chartVersion) return;
          s._w = size.w; s._v = chartVersion;
          o.draw(size, s);
        }
      }, body);
      stages[o.key] = st;
      if (o.extra) o.extra(body);
    },
    sync: function (body) {
      /* the drawing belongs under its own controls, whatever order the
         framework built them in */
      if (st && body.lastElementChild !== st.node) body.appendChild(st.node);
      if (o.after) o.after(body);
    }
  });
}

function drawHeat(size, st) {
  const R = state.result, f = normFactor();
  const mk = function (key) { return R.curve.map(function (p) { return [p.t, p[key] * f]; }); };
  const cases = state.cases, sh = shortLabel();
  const heatSeries = [{ name: R.name, short: sh, pts: mk('heat'), color: seriesColor(0) }];
  cases.forEach(function (c, i) {
    const cf = state.norm === 'ton' ? 1 / c.tHM : 1;
    heatSeries.push({ name: caseName(c), short: c.short, color: seriesColor(i + 1),
      pts: c.curve.map(function (p) { return [p.t, p.heat * cf]; }) });
  });
  if (!cases.length) heatSeries.push({ name: t('wayWigner'), color: 'var(--muted)',
    dash: '5 4', pts: R.ww.map(function (p) { return [p[0], p[1] * f]; }) });
  lineChart(chartHost(st), { series: heatSeries, xmin: 1, xmax: 3.15576e13,
    xLabel: t('axTime'), yLabel: state.norm === 'ton' ? t('axHeatT') : t('axHeat'),
    decades: 8, unit: t('unitW'),
    width: size.w, height: size.density === 'coarse' ? 300 : 340,
    compact: size.density === 'coarse' });
}

function drawEmission(size, st) {
  /* Photons and neutrons are never summed: adding them is meaningless.
     They only combine as DOSE, where both are in sieverts and genuinely
     additive — that is what the "dose rate" mode shows.               */
  const R = state.result, f = normFactor(), cases = state.cases, sh = shortLabel();
  const mk = function (key) { return R.curve.map(function (p) { return [p.t, p[key] * f]; }); };
  let emSeries, emLabel, emUnit;
  if (state.emisMode === 'dose') {
    emUnit = t('axDose'); emLabel = t('axDose');
    if (cases.length) {
      emSeries = [{ name: R.name, short: sh, color: seriesColor(0),
        pts: R.curve.map(function (p) { return [p.t, p.dose * 3600]; }) }];
      cases.forEach(function (c, i) {
        emSeries.push({ name: caseName(c), short: c.short, color: seriesColor(i + 1),
          pts: c.curve.map(function (p) { return [p.t, p.dose * 3600]; }) });
      });
    } else {
      emSeries = [
        { name: t('emTotal'), color: seriesColor(0),
          pts: R.curve.map(function (p) { return [p.t, p.dose * 3600]; }) },
        { name: t('lGamma'), color: seriesColor(1),
          pts: R.curve.map(function (p) { return [p.t, p.doseG * 3600]; }) },
        { name: t('lNeutron'), color: seriesColor(2),
          pts: R.curve.map(function (p) { return [p.t, p.doseN * 3600]; }) }];
    }
  } else {
    emUnit = t('perSec');
    emLabel = t('axRate') + (state.norm === 'ton' ? (LANG === 'ru' ? ' / т ТМ' : ' / tHM') : '');
    if (cases.length) {
      emSeries = [{ name: R.name, short: sh, color: seriesColor(0), pts: mk('gPh') }];
      cases.forEach(function (c, i) {
        const cf = state.norm === 'ton' ? 1 / c.tHM : 1;
        emSeries.push({ name: caseName(c), short: c.short, color: seriesColor(i + 1),
          pts: c.curve.map(function (p) { return [p.t, p.gPh * cf]; }) });
      });
    } else {
      emSeries = [
        { name: t('lActivity'), color: seriesColor(0), pts: mk('act') },
        { name: t('lGamma'), color: seriesColor(1), pts: mk('gPh') },
        { name: t('lNeutron'), color: seriesColor(2), pts: mk('n') },
        { name: t('lNeutronSF'), color: seriesColor(2), dash: '4 3', pts: mk('nSF') },
        { name: t('lNeutronAN'), color: seriesColor(3), dash: '2 3', pts: mk('nAN') }];
    }
  }
  lineChart(chartHost(st), { series: emSeries, xmin: 1, xmax: 3.15576e13,
    xLabel: t('axTime'), yLabel: emLabel, decades: 12, unit: emUnit, noLabels: true,
    width: size.w, height: size.density === 'coarse' ? 320 : 360,
    compact: size.density === 'coarse' });
}

function drawGspec(size, st) {
  const R = state.result, f = normFactor();
  const N = evalAt(R.sol, TGRID[state.tIndex]);
  const gs = gammaSpectrum(N, R.opt);
  const scaleArr = function (a) {
    const b = new Float64Array(a.length);
    for (let k = 0; k < a.length; k++) b[k] = a[k] * f;
    return b;
  };
  stepChart(chartHost(st), {
    edges: gs.edges,
    series: [{ name: t('gsEmit'), vals: scaleArr(gs.emit), color: seriesColor(0), fill: 1 },
      { name: t('gsEsc'), vals: scaleArr(gs.esc), color: seriesColor(1) }],
    xLabel: t('axPhotonE'), yLabel: t('axSpecG'), decades: 6,
    width: size.w, height: size.density === 'coarse' ? 260 : 290,
    unit: t('uPh'),
    xTickFmt: function (E) { return E >= 1 ? String(E) : String(E); },
    binFmt: function (a, b) { return a.toPrecision(3) + ' – ' + b.toPrecision(3) + ' MeV'; }
  });
}

function drawIso(size, st) {
  const R = state.result, f = normFactor();
  const tt = TGRID[state.tIndex];
  const N = evalAt(R.sol, tt), S = sourceTerms(N, R.opt);
  const vec = isoVector(N, S, state.isoMetric);
  const filtered = new Float64Array(NN);
  for (let i = 0; i < NN; i++) if (isoAllowed(i)) filtered[i] = vec[i];
  const top90 = topContributors(filtered, 0.90);
  const top = topContributors(filtered, 0.995);
  const unit = isoUnit(state.isoMetric);
  barChart(chartHost(st), {
    width: size.w, rowH: 26,
    rows: top.list.slice(0, 16).map(function (x, i) {
      return { label: isoLabel(x.id), v: x.v, color: seriesColor(i % 8),
        text: fmtQty(x.v * f, unit) + '  (' + (x.f * 100).toFixed(1) + '%)' };
    }).concat(top.rest > 0 ? [{ label: t('others'), v: top.rest, color: 'var(--grid-strong)',
      text: fmtQty(top.rest * f, unit) + '  (' + (top.rest / top.total * 100).toFixed(1) + '%)' }] : [])
  });
  if (refs.cover) {
    refs.cover.textContent = top90.list.length + ' ' + t('covers') + ' ~90% ' + t('ofTotal');
  }
}

function drawIsoTime(size, st) {
  const f = normFactor(), metric = state.isoTMetric;
  const cache = isoSeriesCache(metric);
  const unit = isoUnit(metric);
  const host = chartHost(st);
  const sel = state.isoSel.filter(function (id) { return cache[id]; });
  if (!sel.length) { host.innerHTML = '<p class="dgu-hint">—</p>'; return; }

  if (state.isoTView === 'share') {
    const bands = sel.map(function (id, k) {
      const a = cache[id], v = new Float64Array(TGRID.length);
      for (let p = 0; p < TGRID.length; p++) {
        v[p] = cache._total[p] > 0 ? Math.min(1, a[p] / cache._total[p]) : 0;
      }
      return { name: isoLabel(id), color: seriesColor(k), vals: v };
    });
    const rest = new Float64Array(TGRID.length);
    for (let p = 0; p < TGRID.length; p++) {
      let acc = 0; bands.forEach(function (b) { acc += b.vals[p]; });
      rest[p] = Math.max(0, 1 - acc);
    }
    bands.push({ name: t('others'), color: 'var(--grid-strong)', vals: rest });
    shareChart(host, { x: TGRID, bands: bands, xLabel: t('axTime'),
      width: size.w, height: size.density === 'coarse' ? 340 : 400 });
    return;
  }

  const series = sel.map(function (id, k) {
    const a = cache[id], pts = [];
    for (let p = 0; p < TGRID.length; p++) pts.push([TGRID[p], a[p] * f]);
    return { name: isoLabel(id), short: isoLabel(id), color: seriesColor(k), pts: pts };
  });
  lineChart(host, { series: series, xmin: 1, xmax: 3.15576e13,
    xLabel: t('axTime'), yLabel: unit, decades: 9, unit: unit,
    width: size.w, height: size.density === 'coarse' ? 340 : 400,
    compact: size.density === 'coarse' });
}

function isoColor(id) {
  const k = state.isoSel.indexOf(id);
  return k >= 0 ? seriesColor(k) : 'var(--grid-strong)';
}

function renderIsoChains() {
  const box = refs.chains; if (!box) return;
  box.innerHTML = '';
  ISO_CHAINS.forEach(function (c) {
    const ids = c.ids.filter(function (id) {
      return IDX[id] !== undefined && state.result && state.result.N0[IDX[id]] > 0;
    });
    if (ids.length < 2) return;
    box.appendChild(h('button', { class: 'dgu-btn', type: 'button', text: t(c.k),
      onclick: function () {
        state.isoSel = ids.slice(0, 8);
        state.isoCand = state.isoCand || [];
        ids.forEach(function (id) {
          if (state.isoCand.indexOf(id) < 0) {
            state.isoCand.push(id);
            if (state.result.cand.indexOf(IDX[id]) < 0) state.result.cand.push(IDX[id]);
            state.result.isoCache = {};
          }
        });
        renderIsoPicker(); bumpCharts(['isotime']);
      } }));
  });
}

function renderIsoPicker() {
  const box = refs.picker; if (!box) return;
  box.innerHTML = '';
  state.isoCand.forEach(function (id) {
    const on = state.isoSel.indexOf(id) >= 0;
    const chip = h('button', { class: 'dgu-btn chip', type: 'button',
      'aria-pressed': on ? 'true' : 'false',
      style: on ? 'color:' + isoColor(id) : '' }, [
        h('span', { class: 'dot', style: on ? 'background:' + isoColor(id) : '' }),
        h('span', { text: isoLabel(id) })]);
    chip.onclick = function () {
      const k = state.isoSel.indexOf(id);
      if (k >= 0) state.isoSel.splice(k, 1);
      else {
        if (state.isoSel.length >= 8) state.isoSel.shift();   /* keep one colour each */
        state.isoSel.push(id);
      }
      renderIsoPicker(); bumpCharts(['isotime']);
    };
    box.appendChild(chip);
  });
}

function renderCases() {
  const box = refs.cases; if (!box) return;
  box.innerHTML = '';
  if (!state.cases.length) { box.appendChild(h('p', { class: 'dgu-hint', text: '—' })); return; }
  state.cases.forEach(function (c, i) {
    box.appendChild(h('div', { class: 'dh-case' }, [
      h('span', { class: 'sw', style: 'background:' + seriesColor(i + 1) }),
      h('span', { class: 'k', text: caseName(c) }),
      h('button', { class: 'dgu-btn ghost icon', type: 'button', text: '×', title: t('remove'),
        'aria-label': t('remove') + ' ' + caseName(c),
        onclick: function () { state.cases.splice(i, 1); bumpCharts(['heat', 'emission']); renderCases(); } })]));
  });
}

/* The validation-against-measurement table.  It was ~20 hand-built nodes and
   a tool class for the weighted rows; v3.1's ui.table() (spec 7.2) carries
   the weighted-row flag, the sticky header and the measured "wider than the
   screen" hint, so the whole thing is a declaration now.                    */
function validationTable() {
  const num = function (x) { return { label: x, num: true }; };
  return {
    head: [t('vDataset'), num(t('vCount')), num(t('vCool')), num(t('vBurnup')),
      num(t('vCE')), num(t('vSD')), t('vSource')],
    sticky: true,

function bumpCharts(keys) {
  chartVersion++;
  (keys || Object.keys(stages)).forEach(function (k) {
    if (stages[k]) stages[k].schedule();
  });
}
function renderCharts() {
  bumpCharts(null);
  renderIsoChains(); renderIsoPicker(); renderCases();
}
/* only the cooling time moved: the depletion and the curves still hold */
function refreshTime() {
  syncCooling();
  bumpCharts(['gspec', 'iso']);
  const a = A(); if (a) a.results(resultsPayload());
}

/* the manifest is the site's own copy of the honesty text, in every language */
function manifestText(key) {
  const m = (window.Diagram && Diagram.manifest && Diagram.manifest()) || null;
  if (!m || !m[key]) return '';
  const v = m[key];
  return typeof v === 'string' ? v : (v[LANG] || v.en || '');
}

/* ---- results --------------------------------------------------------- */
function resultsPayload() {
  if (!state.result) return null;
  const R = state.result, tt = TGRID[state.tIndex];
  const S = sourceTerms(evalAt(R.sol, tt), R.opt), f = normFactor();
  const suffix = normSuffix(), dr = S.doseTot * 3600;
  const phi = R.irr.flux[R.irr.flux.length - 1];
  const pctSF = S.nTot > 0 ? (S.nSF / S.nTot * 100).toFixed(0) : 0;
  const pctAN = S.nTot > 0 ? (S.nAN / S.nTot * 100).toFixed(0) : 0;
  const doseTitle = t('doseTitle') + ' ' + state.doseR + ' ' + t('unitM');
  return {
    verdict: { tone: null, text: R.name + ' · ' + fmtDuration(tt) + ' · ' +
      (state.norm === 'ton' ? t('normTon') : t('normAsm')) },
    tiles: [
      { label: K('sHeat'), value: fmtQty(S.heat * f, t('unitW')) + suffix, learn: 'heat' },
      { label: doseTitle, value: fmtQty(dr, t('axDose')), learn: 'dose' },
      { label: K('sAct'), value: fmtQty(S.act * f, t('unitBq')) + suffix },
      { label: K('sGamma'), value: fmtQty(S.gPh * f, t('uPh')) + suffix, headline: false },
      { label: K('sNeutron'), value: fmtQty(S.nTot * f, t('uN')) + suffix, headline: false,
        hint: 'SF ' + pctSF + '%, (α,n) ' + pctAN + '%' },
      { label: K('sMass'), value: (R.mass / 1000).toFixed(1) + ' ' + t('unitKg'), headline: false }
    ],
    tables: [
      { title: doseTitle, rows: [
        [t('lGamma'), fmtQty(S.doseG * 3600, t('axDose'))],
        [t('lNeutron'), fmtQty(S.doseN * 3600, t('axDose'))],
        [t('tLethal'), dr > 0 ? fmtDuration(4.5 / S.doseTot) : '—'],
        [t('tSevere'), dr > 0 ? fmtDuration(10 / S.doseTot) : '—'],
        [t('tAnnual'), dr > 0 ? fmtDuration(0.001 / S.doseTot) : '—']
      ] },
      { title: t('summary'), rows: [
        [t('sFlux'), fmtSI(phi) + ' ' + (LANG === 'ru' ? 'н/см²·с' : 'n/cm²/s')],
        [t('cutNote'), String((R.irr.cut || []).length)]
      ] }
    ],
    notes: [t('doseNote')]
  };
}

/* ---- language -------------------------------------------------------- */
function setLang(code) {
  if (!LANGS[code] || code === LANG) return;
  LANG = code;
  /* site-disclaimer.js watches <html lang> and re-renders its badge on change */
  document.documentElement.lang = code;
  store('lang', code);
  if (window.Diagram && window.Diagram.setLang) window.Diagram.setLang(code);
  const a = A();
  if (!a) return;
  /* one rebuild, and only one: setLang() calls on.lang and then rebuilds, so
     the handler below never rebuilds by itself. */
  if (SITE_LANGS.indexOf(code) >= 0 && a.lang !== code) a.setLang(code);
  else a.rebuild();
}

/* The site set is seven languages; this tool also ships a complete Russian
   dictionary, reachable with ?lang=ru and carried in permalinks. The shared
   header builds its list from the manifest, so the extra entry is added
   here rather than by widening tool_languages. */
function installExtraLang() {
  if (LANG !== 'ru') return;
  const sel = document.querySelector('.dgu-head-r select[aria-label]');
  if (!sel || sel.querySelector('option[value="ru"]')) { if (sel) sel.value = 'ru'; return; }
  const opt = document.createElement('option');
  opt.value = 'ru'; opt.textContent = 'Русский';
  sel.appendChild(opt);
  sel.value = 'ru';
  sel.addEventListener('change', function () { if (sel.value === 'ru') setLang('ru'); });
}

/* The site keeps the visitor's language in localStorage['diagram_lang'];
   everything else this page remembers is namespaced under sfst.*        */
function store(k, v) {
  try {
    if (k === 'lang') {
      if (v === undefined) {
        const current = window.localStorage.getItem('diagram_site_lang');
        if (current) return current;
        const legacy = window.localStorage.getItem('diagram_lang');
        if (legacy) {
          window.localStorage.setItem('diagram_site_lang', legacy);
          return legacy;
        }
        return null;
      }
      window.localStorage.setItem('diagram_site_lang', v);
      return null;
    }
    const key = 'sfst.' + k;
    if (v === undefined) return window.localStorage.getItem(key);
    window.localStorage.setItem(key, v);
  } catch (e) { }
  return null;
}

/* the language bar of tools.petrov.re, in the site's own order */
const SITE_LANGS = ['en', 'uk', 'de', 'nl', 'fr', 'es', 'pl'];

/* ---- ?embed=1 &lang= &preset= &burnup= &norm= ------------------------ */
function readQuery() {
  const q = {};
  (location.search || '').replace(/^\?/, '').split('&').forEach(function (kv) {
    if (!kv) return;
    const i = kv.indexOf('=');
    q[decodeURIComponent(i < 0 ? kv : kv.slice(0, i))] =
      decodeURIComponent(i < 0 ? '' : kv.slice(i + 1));
  });
  return q;
}

function pickLang(q) {
  if (q.lang && LANGS[q.lang]) return q.lang;
  const saved = store('lang');
  if (saved && LANGS[saved]) return saved;
  const cands = (navigator.languages && navigator.languages.length)
    ? navigator.languages : [navigator.language || ''];
  for (let i = 0; i < cands.length; i++) {
    const b = String(cands[i]).toLowerCase().split('-')[0];
    if (SITE_LANGS.indexOf(b) >= 0) return b;
  }
  return 'en';
}

/* ------------------------------------------------------------------- */
function init() {
  const q = readQuery();
  LANG = pickLang(q);
  document.documentElement.lang = LANG;

  applyPresetState('pwr_w17');
  DEFAULTS = JSON.parse(JSON.stringify(state));   /* what Reset goes back to */
  if (q.norm === 'ton') state.norm = 'ton';
  const preset = (q.preset && PRESETS.some(function (p) { return p.id === q.preset; }))
    ? q.preset : 'pwr_w17';
  if (preset !== 'pwr_w17') applyPresetState(preset);
  if (q.burnup > 0) state.bu = +q.burnup;

  if (!window.DiagramUI || DiagramUI.api !== 'tools.petrov.re/ui/v1') { initBare(); return; }

  ui = DiagramUI.app({
    id: 'decayheat',
    mount: '#app',
    layout: 'calculator',
    compute: 'live',
    debounce: 120,
    state: state,
    defaults: DEFAULTS,
    lang: SITE_LANGS.indexOf(LANG) >= 0 ? LANG : 'en',
    title: function () { return t('title'); },
    subtitle: function () { return t('subtitle'); },
    history: false,
    /* The input column was draggable 240-680px with a double-click reset and
       a remembered width until the port deleted #splitter for want of a
       framework equivalent; v3.1 has one (spec 4.6), and it keeps the
       width under dgu.decayheat.layout.inputs (spec 4.7) instead of the
       tool's old global 'sfst.panel'. */
    resize: [{ region: 'inputs', min: 240, max: 680 }],
    learn: learnData(),
    regions: {
      inputs: function (host, app) { buildInputs(app); },
      stage: function (host, app) { buildStage(app); },
      dock: function (host, app) { buildDock(app); },
      footer: function (host) { buildFooter(host); }
    },
    on: {
      compute: function () { return onCompute(); },
      reset: function () {
        /* App.state keeps its identity across reset() now (spec 8.3), so the
           local re-adoption of the state object is gone. What is left is this
           tool's own cache invalidation. */
        refs.compSig = refs.strSig = refs.sketchSig = null;
        lastFull = lastLight = null;
      },
      lang: function (code) {
        /* the framework rebuilds itself straight after this returns */
        if (code === LANG) return;
        LANG = code;
        document.documentElement.lang = code;
        store('lang', code);
      },
      ready: function () { installExtraLang(); }
    }
  });

  if (q.embed === '1' || q.embed === 'true') ui.node.dataset.embed = '1';
  ui.ready();
  installExtraLang();

  /* the data layer stays with diagram-common.js, and init is unconditional */
  dgcInit();
}

/* diagram-ui.js is missing (blocked, 404, or an old cache): the model, the

    'Спільний шар інтерфейсу не завантажився, тому елементи керування недоступні. Розрахунок нижче виконано зі станом із цього посилання.',
    'Die gemeinsame Oberflächenschicht konnte nicht geladen werden; die Bedienelemente fehlen. Die Rechnung unten lief dennoch mit dem Zustand aus diesem Link.',
    'De gedeelde interfacelaag kon niet worden geladen, dus de bediening ontbreekt. De berekening hieronder liep wel met de toestand uit deze link.',
    'La couche d’interface partagée n’a pas pu être chargée : les commandes sont absentes. Le calcul ci-dessous a bien tourné avec l’état porté par ce lien.',
    'No se pudo cargar la capa de interfaz compartida, así que faltan los controles. El cálculo de abajo sí se ejecutó con el estado que lleva este enlace.'))() }));
  try {
    calculate();
    lastFull = sigFull(); lastLight = sigLight();
    const chart = h('div', { class: 'chartwrap' });
    box.appendChild(chart);
    const R = state.result, f = normFactor();
    lineChart(chart, {

        color: seriesColor(0) }],
      xmin: 1, xmax: 3.15576e13, xLabel: t('axTime'), yLabel: t('axHeat'),
      decades: 8, unit: t('unitW'), width: 900, height: 360
    });
    const p = resultsPayload(), rows = [];
    p.tiles.forEach(function (x) {
      rows.push([typeof x.label === 'function' ? x.label() : x.label, x.value]);
    });
    p.tables.forEach(function (tbl) { (tbl.rows || []).forEach(function (r) { rows.push(r); }); });
    const tab = h('table', {});
    rows.forEach(function (r) {
      tab.appendChild(h('tr', {}, [h('td', { text: r[0] }), h('td', { text: r[1] })]));
    });

    box.appendChild(h('p', { text: String(e && e.message || e) }));
  }
  dgcInit();
}

/* Standard cooling times used by the printed report and the record. */
const DGC_TIMES = [1, 60, 3600, 86400, 7 * 86400, 30 * 86400, 365.25 * 86400,
  5 * YR, 10 * YR, 50 * YR, 100 * YR, 300 * YR, 1000 * YR, 1e4 * YR, 1e5 * YR];

function dgcAt(tt) {
  if (!state.result) return null;
  const R = state.result;
  return sourceTerms(evalAt(R.sol, tt), R.opt);
}

function dgcSerialize() {
  return {
    v: 1, lang: LANG, preset: state.preset,
    hm: state.hm, mat: state.mat,
    comp: state.comp.map(function (c) { return [c.id, c.w]; }),
    str: state.str.map(function (r) { return [r.m, r.kg]; }),
    mode: state.mode, bu: state.bu, pw: state.pw, years: state.years,
    s: state.s, d: state.d, steps: state.steps, strFlux: state.strFlux,
    nImp: state.nImp, selfAbs: state.selfAbs, useSelfAbs: state.useSelfAbs,
    doseR: state.doseR, doseL: state.doseL, norm: state.norm,
    tIndex: state.tIndex, isoMetric: state.isoMetric, composCat: state.composCat,
    emisMode: state.emisMode, isoTMetric: state.isoTMetric, isoTView: state.isoTView,
    isoSel: state.isoSel.slice()
  };
}

function dgcDeserialize(st) {
  if (!st || typeof st !== 'object') throw new Error('unrecognised state payload');
  if (!Array.isArray(st.comp) || !st.comp.length)
    throw new Error('state payload carries no heavy-metal composition');
  const badComp = st.comp.filter(function (c) {
    return !Array.isArray(c) || IDX[c[0]] === undefined || NUC[c[0]].Z < 90;
  });
  if (badComp.length) throw new Error('unknown actinide in composition: ' + JSON.stringify(badComp));
  if (st.mat && !MATRICES[st.mat]) throw new Error('unknown fuel matrix: ' + st.mat);
  const badStr = (st.str || []).filter(function (r) { return !Array.isArray(r) || !MATERIALS[r[0]]; });
  if (badStr.length) throw new Error('unknown structural material: ' + JSON.stringify(badStr));
  if (st.lang && LANGS[st.lang] && st.lang !== LANG) setLang(st.lang);
  state.preset = typeof st.preset === 'string' ? st.preset : '';
  if (st.hm > 0) state.hm = +st.hm;
  if (st.mat) state.mat = st.mat;
  state.comp = st.comp.map(function (c) { return { id: c[0], w: +c[1] || 0 }; });
  state.str = (st.str || []).map(function (r) { return { m: r[0], kg: +r[1] || 0 }; });
  if (st.mode === 'burnup' || st.mode === 'years') state.mode = st.mode;
  ['bu', 'pw', 'years', 's', 'd', 'steps', 'strFlux', 'nImp', 'selfAbs', 'doseR', 'doseL']
    .forEach(function (k) { if (isFinite(st[k])) state[k] = +st[k]; });
  if (typeof st.useSelfAbs === 'boolean') state.useSelfAbs = st.useSelfAbs;
  if (st.norm === 'ton' || st.norm === 'asm') state.norm = st.norm;
  if (isFinite(st.tIndex)) state.tIndex = Math.max(0, Math.min(TGRID.length - 1, st.tIndex | 0));
  ['isoMetric', 'composCat', 'emisMode', 'isoTMetric', 'isoTView'].forEach(function (k) {
    if (typeof st[k] === 'string') state[k] = st[k];
  });
  if (Array.isArray(st.isoSel)) state.isoSel = st.isoSel.filter(function (x) { return IDX[x] !== undefined; });
  /* the shell re-reads the whole state; the custom controls are told to
     redraw by clearing their signatures, and the result is computed here
     and now so the record exists the moment a permalink lands. */
  refs.compSig = refs.strSig = refs.sketchSig = null;
  const a = A();
  if (a) { a.sync(); a.results(computeNow()); }
  else { calculate(); }
}

function dgcWarnings() {
  const w = [];
  let sum = 0; state.comp.forEach(function (c) { sum += +c.w || 0; });
  if (Math.abs(sum - 100) > 0.01)
    w.push(t('compSum') + ': ' + sum.toFixed(3) + ' % — ' + t('wNorm'));
  if (state.result && (state.result.irr.cut || []).length)
    w.push(t('cutNote') + ': ' + state.result.irr.cut.length);
  w.push(t('wReduced'));
  w.push(t('wLumped'));
  if (state.result && TGRID[state.tIndex] < 1e4) w.push(t('wShort'));
  return w;
}

function dgcRecord() {
  if (!state.result) return null;
  const R = state.result, tt = TGRID[state.tIndex], S = dgcAt(tt), f = normFactor();
  const per = state.norm === 'ton' ? '/tHM' : '/assembly';
  const comp = {};
  state.comp.forEach(function (c) { comp[isoLabel(c.id)] = c.w; });
  const str = {};
  state.str.forEach(function (r) { str[matName(r.m)] = r.kg; });
  const top = topContributors(S.per.heat, 0.90).list.slice(0, 10)
    .map(function (x) { return isoLabel(x.id) + ' ' + (x.f * 100).toFixed(1) + ' %'; });
  return {
    inputs: {
      preset: presetLabel(), heavy_metal_mass: state.hm, fuel_matrix: matName(state.mat),
      composition_wt_pct: comp, structural_materials_kg: str,
      assembly_power: state.pw, burnup: derivedBurnup(), irradiation_time: derivedYears(),
      spectral_index: state.s, fast_hump: state.d, depletion_steps: state.steps,
      structure_flux_factor: state.strFlux, impurity_level_ppm: state.nImp,
      dose_distance: state.doseR, dose_source_length: state.doseL,
      self_absorption_thickness: state.selfAbs, self_absorption_on: state.useSelfAbs,
      cooling_time: tt, normalisation: state.norm === 'ton' ? 'per tonne of heavy metal' : 'per assembly'
    },
    outputs: {
      decay_heat: S.heat * f, decay_heat_alpha: S.heatA * f, decay_heat_beta: S.heatB * f,
      decay_heat_gamma: S.heatG * f, decay_heat_spontaneous_fission: S.heatSF * f,
      total_activity: S.act * f, photon_source: S.gPh * f, photon_energy_source: S.gMeV * f,
      neutron_source: S.nTot * f, neutron_source_spontaneous_fission: S.nSF * f,
      neutron_source_alpha_n: S.nAN * f,
      dose_rate_total: S.doseTot * 3600, dose_rate_gamma: S.doseG * 3600,
      dose_rate_neutron: S.doseN * 3600,
      heavy_metal_at_shutdown: R.tHM, total_mass: R.mass / 1000,
      end_of_cycle_flux: R.irr.flux[R.irr.flux.length - 1],
      leading_heat_contributors: top.join(', ')
    },
    units: {
      heavy_metal_mass: 'kg', assembly_power: 'MW', burnup: 'GWd/tHM', irradiation_time: 'a',
      spectral_index: '-', fast_hump: '-', depletion_steps: '-', structure_flux_factor: '-',
      impurity_level_ppm: 'ppm', dose_distance: 'm', dose_source_length: 'm',
      self_absorption_thickness: 'g/cm2', cooling_time: 's',
      decay_heat: 'W' + per, decay_heat_alpha: 'W' + per, decay_heat_beta: 'W' + per,
      decay_heat_gamma: 'W' + per, decay_heat_spontaneous_fission: 'W' + per,
      total_activity: 'Bq' + per, photon_source: 'photons/s' + per,
      photon_energy_source: 'MeV/s' + per, neutron_source: 'n/s' + per,
      neutron_source_spontaneous_fission: 'n/s' + per, neutron_source_alpha_n: 'n/s' + per,
      dose_rate_total: 'Sv/h', dose_rate_gamma: 'Sv/h', dose_rate_neutron: 'Sv/h',
      heavy_metal_at_shutdown: 't', total_mass: 'kg', end_of_cycle_flux: 'n/cm2/s',
      leading_heat_contributors: ''
    },
    model: {
      equations: [
        'Depletion: dN_i/dt = -(lambda_i + phi SUM_r sigma_r,i) N_i + SUM_j (b_ji lambda_j + phi sigma_j->i) N_j + Y_i F',
        'Fission rate from assembly power: F = P_0 / (E_fis * 1.602176634e-13 J/MeV), E_fis per fissioning nuclide',
        'One-group cross sections: sigma(s,d) = SUM_k w_k(s,d) sigma_k over four spectral anchors (thermalised, light-water, intermediate, fast)',
        'Cooling: dN_i/dt = -lambda_i N_i + SUM_j b_ji lambda_j N_j, solved exactly as N_i(t) = SUM_k C_ik exp(-mu_k t) (Bateman, modal form on the topologically ordered graph)',
        'Decay heat: P(t) = SUM_i lambda_i N_i (E_alpha,i + E_beta,i + E_gamma,i) + SUM_i lambda_i b_SF,i N_i * 185 MeV',
        'Activity: A(t) = SUM_i lambda_i N_i',
        'Photon source: S_gamma(t) = SUM_i lambda_i N_i n_ph,i',
        'Neutron source: S_n(t) = SUM_i lambda_i N_i [ b_SF,i nu_i + b_alpha,i Y_an(E_alpha,i) f_matrix ], Y_an = 2.0e-8 (E_alpha/5.5 MeV)^3.65',
        'Gamma dose rate: point-kernel, H = SUM_i n_ph,i A_i G(r,L) E_ph (mu_en/rho)_tissue exp(-mu_air r)(1 + mu_air r) * (1-exp(-x))/x, x = (mu/rho)_fuel * selfAbs'
      ],
      ranges: [
        'Cooling time 1 s to 1e6 years (the time grid has 150 logarithmic points)',
        'Reduced library of about 330 nuclides; fission products with half-lives below roughly a day are represented by twelve lumped exponential groups (0.35 s to 110 000 s) whose yields are derived per fissioning nuclide from ENDF/B-VIII.0',
        'One-group cross sections interpolated between four reference spectra; not a lattice calculation',
        'The assembly is treated as radially and axially uniform',
        'The gamma dose model is a point kernel without build-up and is not a shielding calculation'
      ],
      notes: [
        'Half-lives, decay energies and branching ratios of the 74 nuclides that carry the source terms were checked against ENSDF (IAEA Live Chart) on 2026-08-11.',
        'Spontaneous-fission branches and nu(SF) follow the IAEA Nuclear Data Section evaluation (Simakov, Verpelli, Otsuka, 2015).',
        'The twelve lumped short-lived fission-product groups carry yields derived separately for each fissioning nuclide from the ENDF/B-VIII.0 fission-yield (MT=454/459) and decay (MF=8 MT=457) sublibraries: the whole decay network is solved for one fission pulse, the explicitly tracked nuclides are subtracted and the remainder is projected onto the twelve fixed half-lives. The projection residual is up to 3 % of total fission-product decay heat.'
      ]
    },
    warnings: dgcWarnings()
  };
}

function dgcSections() {
  if (!state.result) return [];
  const f = normFactor(), per = state.norm === 'ton' ? '/tHM' : '';
  const rows = DGC_TIMES.map(function (tt) {
    const S = dgcAt(tt);
    return [fmtDuration(tt), fmtQty(S.heat * f, t('unitW')) + per,
      fmtQty(S.act * f, t('unitBq')) + per, fmtQty(S.gPh * f, t('uPh')) + per,
      fmtQty(S.nTot * f, t('uN')) + per, fmtQty(S.doseTot * 3600, t('axDose'))];
  });
  const tt = TGRID[state.tIndex], S = dgcAt(tt);
  const top = topContributors(S.per.heat, 0.95).list.slice(0, 14).map(function (x) {
    return [isoLabel(x.id), fmtQty(x.v * f, t('unitW')) + per, (x.f * 100).toFixed(2) + ' %'];
  });
  const nrows = [
    [t('lSF'), fmtQty(S.nSF * f, t('uN')) + per,
      (S.nTot > 0 ? (S.nSF / S.nTot * 100).toFixed(1) : '0') + ' %'],
    ['(α,n)', fmtQty(S.nAN * f, t('uN')) + per,
      (S.nTot > 0 ? (S.nAN / S.nTot * 100).toFixed(1) : '0') + ' %']
  ];
  const hrows = [
    [t('lAlpha'), fmtQty(S.heatA * f, t('unitW')) + per],
    [t('lBeta'), fmtQty(S.heatB * f, t('unitW')) + per],
    [t('lGamma'), fmtQty(S.heatG * f, t('unitW')) + per],
    [t('lSF'), fmtQty(S.heatSF * f, t('unitW')) + per]
  ];
  return [
    { title: t('secTimeTable'), cols: '1fr 1fr 1fr 1fr 1fr 1fr',
      head: [t('axTime'), t('sHeat'), t('sAct'), t('sGamma'), t('sNeutron'), t('doseRate')],
      rows: rows,
      notes: [t('noteTimeTable')] },
    { title: t('secHeatSplit') + ' — ' + fmtDuration(tt), cols: '1fr 1fr',
      head: [t('vDataset'), t('sHeat')], rows: hrows },
    { title: t('secTopHeat') + ' — ' + fmtDuration(tt), cols: '1fr 1fr 1fr',
      head: [t('chIso'), t('sHeat'), '%'], rows: top },
    { title: t('secNSplit') + ' — ' + fmtDuration(tt), cols: '1fr 1fr 1fr',
      head: [t('vDataset'), t('sNeutron'), '%'], rows: nrows }
  ];
}

function dgcHandoff() {
  if (!state.result) return null;
  const S = dgcAt(TGRID[state.tIndex]);
  return { quantities: { Q: { value: S.heat * normFactor(), unit: 'W' } } };
}

function dgcInit() {
  if (!window.Diagram) return;
  window.Diagram.init({
    id: 'decayheat', file: 'decayheat.html',
    state: { serialize: dgcSerialize, deserialize: dgcDeserialize },
    record: dgcRecord,
    report: { sections: dgcSections },
    handoff: { provides: ['Q'], accepts: [], build: dgcHandoff }
  });
}

document.addEventListener('DOMContentLoaded', init);

</script>
