<script type="application/json" id="diagram-tool-manifest">{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision":"2026-08-14.taxonomy1","id":"decayheat","file":"decayheat.html","listed":true,"category":"nuclear-eng","order":8,"title":{"en":"Spent Fuel Decay Heat & Source Terms","uk":"Залишкове тепловиділення та джерела випромінювання ВЯП","de":"Nachzerfallswärme & Quellterme abgebrannten Brennstoffs","nl":"Nafwarmte & bronterm van verbruikte splijtstof","fr":"Puissance résiduelle & termes sources du combustible usé","es":"Calor residual y términos fuente del combustible gastado","pl":"Ciepło powyłączeniowe i człony źródłowe wypalonego paliwa"},"summary":{"en":"Decay heat, gamma and neutron emission of irradiated fuel from one second to a million years after shutdown.","uk":"Залишкове тепловиділення, гамма- та нейтронне випромінювання опроміненого палива від секунди до мільйона років після зупинки.","de":"Nachzerfallswärme, Gamma- und Neutronenemission bestrahlten Brennstoffs von einer Sekunde bis zu einer Million Jahren nach der Abschaltung.","nl":"Nafwarmte, gamma- en neutronenemissie van bestraalde splijtstof, van één seconde tot een miljoen jaar na uitschakeling.","fr":"Puissance résiduelle, émission gamma et neutronique du combustible irradié, d’une seconde à un million d’années après l’arrêt.","es":"Calor residual y emisión gamma y neutrónica del combustible irradiado, desde un segundo hasta un millón de años tras la parada.","pl":"Ciepło powyłączeniowe oraz emisja gamma i neutronów z napromienionego paliwa od jednej sekundy do miliona lat po wyłączeniu."},"description":{"en":"Decay heat, gamma and neutron emission of irradiated fuel from one second to a million years after shutdown. Set the heavy-metal composition, burnup and neutron spectrum — or start from a reactor preset — then watch the isotopes hand the heat from one decay chain to the next. Checked against 57 calorimetric measurements of spent assemblies.","uk":"Залишкове тепловиділення, гамма- та нейтронне випромінювання опроміненого палива від секунди до мільйона років після зупинки. Задайте склад важких металів, вигоряння та спектр нейтронів — або почніть з готового реактора — і простежте, як ізотопи передають тепло від одного ланцюжка розпаду до наступного. Звірено з 57 калориметричними вимірюваннями відпрацьованих збірок.","de":"Nachzerfallswärme, Gamma- und Neutronenemission bestrahlten Brennstoffs von einer Sekunde bis zu einer Million Jahren nach der Abschaltung. Schwermetallzusammensetzung, Abbrand und Neutronenspektrum vorgeben — oder von einer Reaktorvoreinstellung ausgehen — und verfolgen, wie die Nuklide die Wärme von einer Zerfallsreihe an die nächste übergeben. Geprüft an 57 kalorimetrischen Messungen abgebrannter Brennelemente.","nl":"Nafwarmte, gamma- en neutronenemissie van bestraalde splijtstof, van één seconde tot een miljoen jaar na uitschakeling. Stel de zwaremetaal­samenstelling, opbrand en het neutronenspectrum in — of begin bij een reactorvoorinstelling — en volg hoe de nucliden de warmte van de ene vervalreeks aan de volgende doorgeven. Getoetst aan 57 calorimetrische metingen van verbruikte elementen.","fr":"Puissance résiduelle, émission gamma et neutronique du combustible irradié, d’une seconde à un million d’années après l’arrêt. Définissez la composition en métaux lourds, le taux de combustion et le spectre neutronique — ou partez d’un préréglage de réacteur — puis suivez le relais de la chaleur d’une chaîne de désintégration à la suivante. Vérifié sur 57 mesures calorimétriques d’assemblages usés.","es":"Calor residual y emisión gamma y neutrónica del combustible irradiado, desde un segundo hasta un millón de años tras la parada. Defina la composición de metales pesados, el grado de quemado y el espectro neutrónico — o parta de un preajuste de reactor — y siga cómo los isótopos se pasan el calor de una cadena de desintegración a la siguiente. Contrastado con 57 medidas calorimétricas de elementos gastados.","pl":"Ciepło powyłączeniowe oraz emisja gamma i neutronów z napromienionego paliwa od jednej sekundy do miliona lat po wyłączeniu. Ustaw skład metali ciężkich, wypalenie i widmo neutronów — albo zacznij od presetu reaktora — a następnie prześledź przekazywanie udziału w cieple między kolejnymi łańcuchami rozpadu. Model sprawdzono względem 57 pomiarów kalorymetrycznych wypalonych zestawów."},"status":"prototype","independent_validation":false,"limitations":{"en":"Reduced library of about 330 nuclides with one-group cross sections interpolated between four reference spectra, and a few of them tuned to reference measurements; the assembly is treated as radially and axially uniform and the gamma dose model is coarse, so criticality, shielding and transport analyses are out of scope. Fission products with half-lives below roughly a day are represented by twelve lumped exponential groups (0.35 s to 110 000 s) whose yields are derived separately for each fissioning nuclide from the ENDF/B-VIII.0 fission-yield and decay sublibraries; the projection onto twelve fixed half-lives is itself worth up to 3 % of fission-product decay heat, and producing every tracked chain directly at fission costs a further 2-5 % between about 1 000 s and 10 000 s. Against ANSI/ANS-5.1-1979, 63 of the 65 decay-heat cases now agree within 5 %; the two that do not are Pu-239 at 1 000 s (5.3 % low) and fast U-238 at 30 s (5.1 % low), where an independent ENDF/B-VIII.0 summation is itself 3.1 % and 5.0 % below the standard. Half-lives, decay energies and branching ratios were re-checked against ENSDF for the 74 nuclides that carry the source terms; the rest of the library has not been re-derived and a mean decay energy there may still omit conversion electrons.","uk":"Скорочена бібліотека приблизно з 330 нуклідів з одногруповими перерізами, інтерпольованими між чотирма опорними спектрами, частину з яких підігнано під опорні вимірювання; збірка вважається однорідною за радіусом і висотою, а модель гамма-дози груба, тож розрахунки критичності, захисту й транспортування поза межами. Уламки з періодом піврозпаду меншим приблизно за добу подано дванадцятьма узагальненими експоненційними групами (від 0,35 с до 110 000 с), виходи яких виведено окремо для кожного нукліда, що ділиться, з бібліотек виходів поділу та розпаду ENDF/B-VIII.0; сама проєкція на дванадцять фіксованих періодів коштує до 3 % тепловиділення уламків, а миттєве народження кожного відстежуваного ланцюжка просто в поділі — ще 2–5 % у діапазоні приблизно 1 000–10 000 с. Порівняно з ANSI/ANS-5.1-1979 63 з 65 випадків тепловиділення тепер збігаються в межах 5 %; два, що ні, — Pu-239 на 1 000 с (на 5,3 % нижче) і швидкий поділ U-238 на 30 с (на 5,1 % нижче), причому незалежне підсумовування за ENDF/B-VIII.0 саме лежить на 3,1 % і 5,0 % нижче стандарту. Періоди піврозпаду, енергії розпаду та коефіцієнти розгалуження перевірено за ENSDF для 74 нуклідів, які визначають джерела; решту бібліотеки не переглядали, і середня енергія розпаду там може досі не враховувати електрони конверсії.","de":"Reduzierte Bibliothek von rund 330 Nukliden mit eingruppigen Wirkungsquerschnitten, die zwischen vier Referenzspektren interpoliert und teilweise an Referenzmessungen angepasst wurden; das Brennelement gilt als radial und axial homogen und das Gammadosismodell ist grob — Kritikalitäts-, Abschirm- und Transportnachweise sind damit ausgeschlossen. Spaltprodukte mit Halbwertszeiten unter etwa einem Tag werden durch zwölf exponentielle Sammelgruppen (0,35 s bis 110 000 s) dargestellt, deren Ausbeuten je spaltendem Nuklid aus den Spaltausbeuten- und Zerfallsbibliotheken von ENDF/B-VIII.0 abgeleitet sind; die Projektion auf zwölf feste Halbwertszeiten kostet selbst bis zu 3 % der Spaltprodukt-Nachzerfallswärme, die direkte Erzeugung jeder verfolgten Kette bei der Spaltung weitere 2–5 % zwischen etwa 1 000 s und 10 000 s. Gegen ANSI/ANS-5.1-1979 stimmen jetzt 63 der 65 Nachwärmefälle auf 5 % überein; die beiden übrigen sind Pu-239 bei 1 000 s (5,3 % zu niedrig) und schnelle Spaltung von U-238 bei 30 s (5,1 % zu niedrig), wo eine unabhängige ENDF/B-VIII.0-Summation selbst 3,1 % bzw. 5,0 % unter dem Standard liegt. Halbwertszeiten, Zerfallsenergien und Verzweigungsverhältnisse wurden für die 74 Nuklide, die die Quellterme tragen, gegen ENSDF geprüft; der Rest der Bibliothek wurde nicht neu abgeleitet, dort kann einer mittleren Zerfallsenergie noch der Konversionselektronenanteil fehlen.","nl":"Beperkte bibliotheek van ongeveer 330 nucliden met eengroepsdoorsneden, geïnterpoleerd tussen vier referentiespectra en deels afgestemd op referentiemetingen; het element wordt radiaal en axiaal homogeen verondersteld en het gammadosismodel is grof, zodat kriticiteits-, afscherm- en transportanalyses buiten bereik vallen. Splijtingsproducten met een halveringstijd korter dan ongeveer een dag zijn samengevat in twaalf exponentiële groepen (0,35 s tot 110 000 s) waarvan de opbrengsten per splijtende nuclide zijn afgeleid uit de splijtingsopbrengst- en vervalbibliotheken van ENDF/B-VIII.0; de projectie op twaalf vaste halveringstijden kost zelf tot 3 % van de nafwarmte van splijtingsproducten, en het rechtstreeks bij splijting laten ontstaan van elke gevolgde keten nog eens 2–5 % tussen ongeveer 1 000 s en 10 000 s. Tegen ANSI/ANS-5.1-1979 komen nu 63 van de 65 nafwarmtegevallen binnen 5 % overeen; de twee die dat niet doen zijn Pu-239 bij 1 000 s (5,3 % te laag) en snelle splijting van U-238 bij 30 s (5,1 % te laag), waar een onafhankelijke ENDF/B-VIII.0-sommatie zelf 3,1 % respectievelijk 5,0 % onder de norm ligt. Halveringstijden, vervalenergieën en vertakkingsverhoudingen zijn voor de 74 nucliden die de brontermen dragen opnieuw getoetst aan ENSDF; de rest van de bibliotheek is niet herzien en een gemiddelde vervalenergie kan daar nog conversie-elektronen missen.","fr":"Bibliothèque réduite d’environ 330 nucléides avec des sections efficaces à un groupe interpolées entre quatre spectres de référence et en partie ajustées sur des mesures ; l’assemblage est supposé homogène radialement et axialement et le modèle de dose gamma est grossier, ce qui exclut les analyses de criticité, de protection et de transport. Les produits de fission de période inférieure à environ un jour sont représentés par douze groupes exponentiels forfaitaires (de 0,35 s à 110 000 s) dont les rendements sont dérivés, pour chaque nucléide fissionné, des sous-bibliothèques de rendements de fission et de décroissance d’ENDF/B-VIII.0 ; la projection sur douze périodes fixes vaut à elle seule jusqu’à 3 % de la puissance résiduelle des produits de fission, et le fait de créer chaque chaîne suivie directement à la fission coûte 2 à 5 % de plus entre environ 1 000 s et 10 000 s. Face à ANSI/ANS-5.1-1979, 63 des 65 cas de puissance résiduelle s’accordent maintenant à 5 % près ; les deux autres sont le Pu-239 à 1 000 s (5,3 % trop bas) et la fission rapide de l’U-238 à 30 s (5,1 % trop bas), là où une sommation ENDF/B-VIII.0 indépendante est elle-même 3,1 % et 5,0 % en dessous de la norme. Périodes, énergies de désintégration et rapports d’embranchement ont été revérifiés sur ENSDF pour les 74 nucléides qui portent les termes sources ; le reste de la bibliothèque n’a pas été redérivé et une énergie moyenne y omet peut-être encore les électrons de conversion.","es":"Biblioteca reducida de unos 330 nucleidos con secciones eficaces de un grupo interpoladas entre cuatro espectros de referencia y en parte ajustadas a medidas; el elemento se supone homogéneo radial y axialmente y el modelo de dosis gamma es tosco, por lo que quedan fuera los análisis de criticidad, blindaje y transporte. Los productos de fisión con periodo inferior a aproximadamente un día se representan mediante doce grupos exponenciales agrupados (de 0,35 s a 110 000 s) cuyos rendimientos se derivan, para cada nucleido que fisiona, de las subbibliotecas de rendimientos de fisión y de desintegración de ENDF/B-VIII.0; la proyección sobre doce periodos fijos vale por sí sola hasta un 3 % del calor residual de los productos de fisión, y crear cada cadena seguida directamente en la fisión cuesta otro 2–5 % entre unos 1 000 s y 10 000 s. Frente a ANSI/ANS-5.1-1979, 63 de los 65 casos de calor residual concuerdan ahora dentro del 5 %; los dos que no lo hacen son Pu-239 a 1 000 s (5,3 % bajo) y fisión rápida de U-238 a 30 s (5,1 % bajo), donde una sumación ENDF/B-VIII.0 independiente queda ella misma un 3,1 % y un 5,0 % por debajo de la norma. Periodos, energías de desintegración y razones de ramificación se han vuelto a comprobar frente a ENSDF para los 74 nucleidos que sostienen los términos fuente; el resto de la biblioteca no se ha rederivado y allí una energía media puede seguir omitiendo los electrones de conversión.","pl":"Zredukowana biblioteka około 330 nuklidów z jednogrupowymi przekrojami czynnymi interpolowanymi między czterema widmami odniesienia; część danych dostrojono do pomiarów referencyjnych. Zestaw jest traktowany jako jednorodny promieniowo i osiowo, a model dawki gamma jest zgrubny, dlatego analizy krytyczności, osłon i transportu są poza zakresem. Produkty rozszczepienia o czasach połowicznego zaniku krótszych niż około doba są reprezentowane przez dwanaście skupionych grup wykładniczych (0,35 s–110 000 s), których wydajności wyprowadzono osobno dla każdego rozszczepiającego się nuklidu z podbibliotek ENDF/B-VIII.0; sama projekcja na dwanaście stałych czasów połowicznego zaniku wnosi do 3 % ciepła produktów rozszczepienia. Względem ANSI/ANS-5.1-1979 63 z 65 przypadków ciepła powyłączeniowego mieści się w 5 %; dwa pozostałe to Pu-239 przy 1000 s (−5,3 %) i szybki U-238 przy 30 s (−5,1 %), przy czym niezależne sumowanie ENDF/B-VIII.0 jest w tych punktach odpowiednio 3,1 % i 5,0 % poniżej normy. Czasy połowicznego zaniku, energie rozpadu i udziały rozgałęzień ponownie sprawdzono względem ENSDF dla 74 nuklidów dominujących w członach źródłowych; pozostałej biblioteki nie wyprowadzano ponownie."},"intended_use":["education","technical exploration","preliminary assessment"],"catalog_languages":["en","uk","de","nl","fr","es","pl"],"tool_languages":["en","uk","de","nl","fr","es","pl"],"dependencies":[],"network_access":{"mode":"none"},"validation":{"basis":{"en":"205 cases run through the page. Fission-product decay heat is graded against the ANSI/ANS-5.1-1979 shape functions for thermal U-235, thermal Pu-239 and fast U-238 at 5 %, with a second, fully independent reference recorded per case: direct summation over the ENDF/B-VIII.0 fission-yield and decay sublibraries. The decay solver is checked against a generalised Bateman solution implemented independently in 50-digit arithmetic and cross-checked with scipy.linalg.expm; half-lives, branching ratios and energy per decay against ENSDF; spontaneous-fission neutron yields against the IAEA Nuclear Data Section evaluation; plus the internal source-term identities. 203 pass, 11 are flagged where the reference itself is ambiguous, and 2 fail: Pu-239 at 1 000 s cooling (5.3 % below the standard) and fast U-238 at 30 s (5.1 % below), at points where the ENDF/B-VIII.0 summation is itself 3.1 % and 5.0 % below ANS-5.1. Because two cases still miss the tolerance the tool stays a prototype. The harness is the author's own; no external party has reviewed it.","uk":"205 випадків проведено через сторінку. Тепловиділення уламків поділу оцінюється за формфункціями ANSI/ANS-5.1-1979 для теплового U-235, теплового Pu-239 і швидкого U-238 з допуском 5 %, причому для кожного випадку записано другий, повністю незалежний еталон: пряме підсумовування за бібліотеками виходів поділу та розпаду ENDF/B-VIII.0. Розв'язувач розпаду звірено з узагальненим розв'язком Бейтмана, реалізованим незалежно з 50 знаками та перевіреним через scipy.linalg.expm; періоди піврозпаду, коефіцієнти розгалуження й енергію на розпад — з ENSDF; нейтронні виходи спонтанного поділу — з оцінкою Відділу ядерних даних МАГАТЕ; а також внутрішні тотожності джерел. 203 проходять, 11 позначено як неоднозначні через сам еталон, 2 не проходять: Pu-239 на витримці 1 000 с (на 5,3 % нижче стандарту) і швидкий поділ U-238 на 30 с (на 5,1 % нижче) — у точках, де підсумовування за ENDF/B-VIII.0 саме лежить на 3,1 % і 5,0 % нижче ANS-5.1. Оскільки два випадки все ще виходять за допуск, інструмент лишається прототипом. Випробувальний стенд авторський; сторонньої перевірки не було.","de":"205 Fälle über die Seite gefahren. Die Spaltprodukt-Nachzerfallswärme wird gegen die Formfunktionen von ANSI/ANS-5.1-1979 für thermisches U-235, thermisches Pu-239 und schnelles U-238 auf 5 % bewertet, wobei je Fall eine zweite, völlig unabhängige Referenz mitgeführt wird: die direkte Summation über die Spaltausbeuten- und Zerfallsbibliotheken von ENDF/B-VIII.0. Der Zerfallslöser wird gegen eine verallgemeinerte Bateman-Lösung geprüft, unabhängig in 50-stelliger Arithmetik implementiert und mit scipy.linalg.expm gegengerechnet; Halbwertszeiten, Verzweigungsverhältnisse und Energie je Zerfall gegen ENSDF; Neutronenausbeuten der Spontanspaltung gegen die Auswertung der IAEA-Kerndatensektion; dazu die internen Quelltermidentitäten. 203 bestehen, 11 sind als mehrdeutig markiert, weil die Referenz selbst nicht eindeutig ist, 2 fallen durch: Pu-239 bei 1 000 s Abklingzeit (5,3 % unter dem Standard) und schnelle Spaltung von U-238 bei 30 s (5,1 % darunter) — an Stellen, an denen die ENDF/B-VIII.0-Summation selbst 3,1 % bzw. 5,0 % unter ANS-5.1 liegt. Da zwei Fälle die Toleranz weiterhin verfehlen, bleibt das Werkzeug ein Prototyp. Der Prüfstand ist der des Autors; eine externe Prüfung gab es nicht.","nl":"205 gevallen door de pagina gedraaid. De nafwarmte van splijtingsproducten wordt op 5 % getoetst aan de vormfuncties van ANSI/ANS-5.1-1979 voor thermisch U-235, thermisch Pu-239 en snel U-238, met per geval een tweede, volledig onafhankelijke referentie: directe sommatie over de splijtingsopbrengst- en vervalbibliotheken van ENDF/B-VIII.0. De vervaloplosser is getoetst aan een veralgemeende Bateman-oplossing, onafhankelijk geïmplementeerd in 50-cijferige rekenkunde en gecontroleerd met scipy.linalg.expm; halveringstijden, vertakkingsverhoudingen en energie per verval aan ENSDF; neutronenopbrengsten van spontane splijting aan de evaluatie van de IAEA-kerndatasectie; plus de interne bronterm-identiteiten. 203 slagen, 11 zijn gemarkeerd omdat de referentie zelf dubbelzinnig is, 2 falen: Pu-239 bij 1 000 s afkoeltijd (5,3 % onder de norm) en snelle splijting van U-238 bij 30 s (5,1 % eronder), op punten waar de ENDF/B-VIII.0-sommatie zelf 3,1 % respectievelijk 5,0 % onder ANS-5.1 ligt. Omdat twee gevallen de tolerantie nog missen, blijft de tool een prototype. Het testbank is van de auteur zelf; niemand van buiten heeft het beoordeeld.","fr":"205 cas passés par la page. La puissance résiduelle des produits de fission est jugée à 5 % contre les fonctions de forme d'ANSI/ANS-5.1-1979 pour l'U-235 thermique, le Pu-239 thermique et l'U-238 rapide, avec une seconde référence totalement indépendante enregistrée cas par cas : la sommation directe sur les sous-bibliothèques de rendements de fission et de décroissance d'ENDF/B-VIII.0. Le solveur de décroissance est vérifié contre une solution de Bateman généralisée implémentée indépendamment en arithmétique à 50 chiffres et recoupée avec scipy.linalg.expm ; périodes, rapports d'embranchement et énergie par désintégration contre ENSDF ; rendements neutroniques de fission spontanée contre l'évaluation de la Section des données nucléaires de l'AIEA ; enfin les identités internes des termes sources. 203 passent, 11 sont signalés parce que la référence elle-même est ambiguë, 2 échouent : le Pu-239 à 1 000 s de refroidissement (5,3 % sous la norme) et la fission rapide de l'U-238 à 30 s (5,1 % en dessous), en des points où la sommation ENDF/B-VIII.0 est elle-même 3,1 % et 5,0 % sous ANS-5.1. Comme deux cas manquent encore la tolérance, l'outil reste un prototype. Le banc d'essai est celui de l'auteur ; aucun tiers ne l'a examiné.","es":"205 casos ejecutados a través de la página. El calor residual de los productos de fisión se califica al 5 % frente a las funciones de forma de ANSI/ANS-5.1-1979 para U-235 térmico, Pu-239 térmico y U-238 rápido, con una segunda referencia totalmente independiente registrada caso por caso: la sumación directa sobre las subbibliotecas de rendimientos de fisión y de desintegración de ENDF/B-VIII.0. El solucionador de desintegración se contrasta con una solución de Bateman generalizada implementada de forma independiente con 50 dígitos y verificada con scipy.linalg.expm; periodos, razones de ramificación y energía por desintegración frente a ENSDF; rendimientos neutrónicos de fisión espontánea frente a la evaluación de la Sección de Datos Nucleares del OIEA; y las identidades internas de los términos fuente. 203 pasan, 11 quedan señalados porque la propia referencia es ambigua y 2 fallan: Pu-239 a 1 000 s de enfriamiento (5,3 % por debajo de la norma) y fisión rápida de U-238 a 30 s (5,1 % por debajo), en puntos donde la sumación ENDF/B-VIII.0 queda ella misma un 3,1 % y un 5,0 % por debajo de ANS-5.1. Como dos casos siguen sin cumplir la tolerancia, la herramienta sigue siendo un prototipo. El banco de pruebas es del propio autor; ningún tercero lo ha revisado.","pl":"Na stronie uruchomiono 205 przypadków. Ciepło powyłączeniowe produktów rozszczepienia porównano z funkcjami ANSI/ANS-5.1-1979 dla termicznego U-235, termicznego Pu-239 i szybkiego U-238 z tolerancją 5 %, zapisując dla każdego przypadku drugi, niezależny punkt odniesienia: bezpośrednie sumowanie z podbibliotek wydajności rozszczepienia i rozpadu ENDF/B-VIII.0. Solver rozpadu sprawdzono względem uogólnionego rozwiązania Batemana zaimplementowanego niezależnie w arytmetyce 50-cyfrowej i porównanego z scipy.linalg.expm; czasy połowicznego zaniku, udziały rozgałęzień i energię na rozpad względem ENSDF; wydajności neutronów z rozszczepienia spontanicznego względem oceny IAEA Nuclear Data Section oraz względem wewnętrznych tożsamości członów źródłowych. 203 przypadki przechodzą, 11 oznaczono jako niejednoznaczne ze względu na sam punkt odniesienia, a 2 nie spełniają tolerancji: Pu-239 przy 1000 s chłodzenia (5,3 % poniżej normy) i szybki U-238 przy 30 s (5,1 % poniżej), w punktach, gdzie samo sumowanie ENDF/B-VIII.0 jest odpowiednio 3,1 % i 5,0 % poniżej ANS-5.1. Z powodu tych dwóch przypadków narzędzie pozostaje prototypem. Zestaw testów jest autorski i nie został niezależnie zrecenzowany."},"independent_validation":false,"benchmarks":[{"id":"ans51-bateman-ensdf","reference":"ANSI/ANS-5.1-1979 fission-product decay-heat shape functions (23-term fits for thermal U-235, thermal Pu-239 and fast U-238); a generalised Bateman solution for branching decay chains implemented independently in 50-digit arithmetic and crosschecked against scipy.linalg.expm; the IAEA Nuclear Data Section evaluation of spontaneous-fission neutron yields; and ENSDF half-lives, Q values, branching ratios and mean decay energies retrieved from the IAEA Live Chart API.  Fission-product decay heat is carried against a SECOND, independent reference as well: direct summation over the ENDF/B-VIII.0 neutron-induced fission-yield sublibrary (England and Rider, ENDF-349) and the ENDF/B-VIII.0 decay sublibrary, the whole decay network solved from the independent yields.  Grading stays against ANS-5.1; the summation is recorded per case as the crosscheck, and the two references agree to better than 5 % on every one of the 65 decay-heat cases (worst ENDF/ANS = 0.9505 at 30 s after fast fission of U-238), so no case is excused on the grounds that the references disagree.  The Way-Wigner correlation is carried as an order-of-magnitude crosscheck only and is never graded.","citations":["ANSI/ANS-5.1-1979, Decay Heat Power in Light Water Reactors, Tables 1-3 (23-term fission-product shape functions for thermal U-235, thermal Pu-239, fast U-238); coefficients transcribed from Westinghouse WCAP-16009-NP-A Tables 8-1, NRC ADAMS ML050910161.","K. Way and E. P. Wigner, 'The Rate of Decay of Fission Products', Phys. Rev. 73 (1948) 1318.","S. Simakov, M. Verpelli, N. Otsuka, 'Update of the nuclear data for the neutron emissions for actinides of interest in safeguards', IAEA Nuclear Data Section, 2015-03-13, Table 1 (SF neutron yields, n/s/g).","IAEA Live Chart of Nuclides / ENSDF, relnsd API (https://nds.iaea.org/relnsd/v1/data), retrieved 2026-08-11.","H. Bateman, 'The solution of a system of differential equations occurring in the theory of radioactive transformations', Proc. Cambridge Philos. Soc. 15 (1910) 423.","ENDF/B-VIII.0 neutron-induced fission-product yield sublibrary (England & Rider, ENDF-349) and radioactive decay sublibrary (MF=8 MT=457), retrieved from the IAEA Nuclear Data Section mirror https://www-nds.iaea.org/public/download-endf/ENDF-B-VIII.0/ on 2026-08-12; decay heat by direct summation over the full decay network started from the independent yields."],"cases":205,"passed":203,"tolerance":"5 % relative on fission-product decay heat against ANSI/ANS-5.1-1979.  That is one combined standard deviation: the standard is itself a fit whose evaluated uncertainty on f(t,T) is a few per cent, and the second independent reference used here - an ENDF/B-VIII.0 summation - itself sits 0 to 5 % below ANS-5.1 across these cases.  It is not chosen from the tool: it is the mutual spread of the two references, and two cases still fail it.  1e-6 relative on the decay solver against the closed-form Bateman solution, because that is exact mathematics and the two independent reference implementations agree to 3e-11.  1e-12 relative on the source-term identities, which are exact arithmetic within one call.  1 % on half-lives and 3 % on energy deposited per decay against ENSDF, which is the level at which an engineering decay library is normally rounded.  On spontaneous-fission neutron yields, the larger of 5 % and the 1 sigma the IAEA table quotes for that nuclide.","run_at":"2026-08-12T07:13:52Z","artifact":"benchmarks/decayheat.json"}]},"report":{"pdf":true,"source_attribution":true},"python_export":{"supported":false,"reason":"The result comes from a 325-nuclide depletion and decay solve over a one-group cross-section library and a fission-yield table that would have to be shipped with the script; a fragment reproducing only the final Bateman step would not be the number the page shows."},"handoff":{"provides":["Q"],"accepts":[]},"state_codec":{"permalink":true,"record":"tools.petrov.re/calculation-record/v1"},"ui":{"framework":"tools.petrov.re/ui/v1","level":3}}</script>

<style>
/* This tool's only style sheet. Everything structural, every colour, radius,
   shadow, font size and spacing value now comes from the diagram-ui.js token
   layer (UI_FRAMEWORK_SPEC.md section 2); what is left below is the chart ink
   and the small amount of markup the framework has no component for.        */
:root{
  /* names this file's drawing code already uses, mapped onto the token set */
  --surface-1:var(--panel); --surface-2:var(--panel-2);
  --text-primary:var(--ink); --text-secondary:var(--muted); --text-muted:var(--muted);
  --border:var(--line); --accent-weak:var(--weak); --radius:var(--radius-md);
  --mono:var(--font-mono); --sans:var(--font);
  /* Chart ink. The eight data-series colours are the FRAMEWORK's now
     (UI_FRAMEWORK_SPEC.md 2.1.1, --dgu-series-1..8, read through
     DiagramUI.series.css): its published values in both themes are this
     file's own, so no drawing changes. What is left is the grid ink, which
     is inside the drawings and has no framework token.                      */
  --grid:#eaeef4; --grid-strong:#b6c0cd;
}
html[data-theme="dark"]{
  --grid:#232a34; --grid-strong:#48525f;
}
body{margin:0;background:var(--bg)}

/* ---- charts ---------------------------------------------------------- */
.chart{width:100%;height:auto;display:block}
.chartwrap{position:relative;min-width:0}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--grid-strong);stroke-width:1}
.crosshair{stroke:var(--grid-strong);stroke-width:1;stroke-dasharray:3 3}
text.tick{font:400 var(--fs-micro) var(--sans);fill:var(--muted)}
text.tick-y{text-anchor:end}
text.tick-x{text-anchor:middle}
text.axlabel{font:400 var(--fs-small) var(--sans);fill:var(--muted)}
text.dlabel{font:650 var(--fs-micro) var(--sans)}
text.blabel{font:400 var(--fs-small) var(--mono);fill:var(--muted);text-anchor:end}
text.bvalue{font:400 var(--fs-small) var(--mono);fill:var(--muted)}
.muted-t{opacity:.7}
.chart-tip{position:absolute;pointer-events:none;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--sp-2);
  font-size:var(--fs-small);box-shadow:var(--shadow);min-width:130px;z-index:var(--z-sticky)}

.tip-row{display:flex;align-items:center;gap:var(--sp-1);color:var(--muted)}

.dgu-app[data-embed="1"]{background:transparent;min-height:0}

/* ---- print — §21: the framework owns the sheet ---------------------------
   This file's own print block was the evidence that the framework should own
   printing, and its comment said so: "the framework declares these on :root,
   which outranks a bare html selector however late it is written". A tool
   cannot win that argument; the framework can, because :root is its own. It
   now does, in diagram-ui.js PRINT_CSS, and 2 204 bytes of this block are gone
   with it — the @page box, the white paper and the whole token reset, the
   chrome list (#dgc-bar, #eng-disc-*, .dgu-head-r, .dgu-home, .dgu-q,
   .dgu-split, the strip, the tour, the popovers, the toasts, .dgu-panel-actions,
   .dgu-table-hint), the one-column flow, the static masthead, the region
   un-clipping, break-inside and the control-chrome reset — INCLUDING the rule
   this file discovered and every other tool then needed, that a collapsed panel
   must still print its fields, because "the reader wants the numbers the answer
   was computed from, not the state of a disclosure".
   And Ctrl+P itself no longer lands here at all: §21 intercepts it and prints
   Diagram.report(), which is the paginated artefact this comment used to say
   was "a separate artefact and not touched by anything here". The block below
   is now only what File -> Print produces, and only the parts of it that are
   about THIS tool's own content.
   Three rules stay, none of them framework furniture:
     .dgu-app,.dgu-panel font-size — decayheat prints a 40-row nuclide table;
       10.5 px is a deliberate density choice for that table, not a default.
     .dgu-table td.src — the tool's own provenance column, deliberately smaller.
     .chart, .chart-tip — the tool's own chart element and its hover tooltip;
       the framework created neither name.                                   */
@media print{
  .dgu-app,.dgu-app .dgu-panel{font-size:10.5px}
  .chart-tip{display:none!important}
  .dgu-table td.src{font-size:8px}
  .chart{break-inside:avoid;page-break-inside:avoid}
}

/* ===================================================================
   NUCLIDE LIBRARY
   -------------------------------------------------------------------
   Compact engineering library for spent-fuel source-term estimation.

   Fields per nuclide:
     id     : symbol+mass (+"m" for metastable)
     Z, A   : atomic / mass number
     t      : half-life, seconds   (null = stable / effectively stable)
     E.b    : mean energy per decay carried by electrons  [MeV]
              (beta continuum mean + conversion + Auger; NEUTRINO EXCLUDED)
     E.g    : mean energy per decay carried by photons    [MeV]
              (gammas + X-rays + annihilation)
     E.a    : mean energy per decay carried by alphas + recoil [MeV]
     E.ph   : mean number of photons emitted per decay    [1/decay]
     d      : decay branches  [[mode, daughterId, branchFraction], ...]
     xs.c   : 1-group capture  cross sections at 3 spectral anchors [b]
              [ thermal-LWR , intermediate , fast-SFR ]
     xs.f   : 1-group fission  cross sections at 3 spectral anchors [b]
     sfb    : spontaneous-fission branch fraction
     n2n    : [[sigma x4 anchors], 'productId']  -> (n,2n), threshold rx
     nu     : neutrons per spontaneous fission
     ea     : principal alpha energy [MeV]  (drives (alpha,n) yield)

   Cross sections are FLUX-AVERAGED ONE-GROUP values representative of
   the named spectrum, NOT 2200 m/s values.  They are engineering
   estimates; see the "Accuracy" note in the app.

   2026-08-11 benchmark pass: the half-lives, decay energies and branching
   ratios of the 74 nuclides that carry the decay heat, the photon source or
   the neutron source were re-checked against ENSDF through the IAEA Live
   Chart API, and the spontaneous-fission data against the IAEA Nuclear Data
   Section evaluation of SF neutron yields (Simakov, Verpelli, Otsuka, 2015).
   Corrections made there:
     - E.b of Np239, U239, I129, Eu155, Eu154, Eu156, Ce141, Ce144, Ba140,
       I135, Cs136, Cs138 and Am242 had lost the conversion-electron and
       Auger component of strongly converted transitions (Np-239 was 26 %
       low on total decay energy, I-129 23 %, Eu-155 15 %);
     - E.g of Eu156 and I135 was too high and is now the ENSDF line sum;
     - E.b of Se79 corrected to the evaluated mean beta energy;
     - half-lives of Sr90, Ni63, Sn126, Cs136 and Cs138 moved to the current
       ENSDF evaluations;
     - spontaneous fission of Th232, U232, U234 and U236 was missing entirely
       and is now present, and nu(SF) of Am241 was 3.22 against an evaluated
       2.50.
   Nuclides outside those 74 have not been re-derived, so a mean energy
   elsewhere in the library may still be missing its conversion electrons.
   =================================================================== */

const Y = 3.15576e7, D = 86400, H = 3600, MIN = 60;

const NUC_RAW = [];
function n(id, Z, A, t, E, d, xs, x) {
  NUC_RAW.push(Object.assign({
    id: id, Z: Z, A: A, t: t,
    b: (E && E.b) || 0, g: (E && E.g) || 0, a: (E && E.a) || 0,
    ph: (E && E.ph) || 0,
    d: d || [],
    sc: (xs && xs.c) || [0, 0, 0],
    sf: (xs && xs.f) || [0, 0, 0]
  }, x || {}));
}

/* ---------------- HEAVY ELEMENTS: thorium / uranium chain ---------- */

n('Pb208', 82, 208, null, {}, [], {});
n('Pb207', 82, 207, null, {}, [], {});
n('Pb206', 82, 206, null, {}, [], {});
n('Bi209', 83, 209, null, {}, [], {});

// --- Th-232 natural series (matters for Th fuel + U-232 contamination)
n('Tl208', 81, 208, 183.18, { b: 0.560, g: 3.377, ph: 2.30 }, [['b-', 'Pb208', 1]], {});
n('Pb212', 82, 212, 10.64 * H, { b: 0.176, g: 0.148, ph: 0.44 }, [['b-', 'Bi212', 1]], {});
n('Bi212', 83, 212, 60.55 * MIN, { b: 0.500, g: 0.185, a: 2.175, ph: 0.16 },
  [['b-', 'Po212', 0.6406], ['a', 'Tl208', 0.3594]], {}, { ea: 6.05 });
n('Po212', 84, 212, 2.99e-7, { a: 8.954 }, [['a', 'Pb208', 1]], {}, { ea: 8.78 });
n('Rn220', 86, 220, 55.6, { a: 6.405 }, [['a', 'Po216', 1]], {}, { ea: 6.29 });
n('Po216', 84, 216, 0.145, { a: 6.907 }, [['a', 'Pb212', 1]], {}, { ea: 6.78 });
n('Ra224', 88, 224, 3.632 * D, { a: 5.789, g: 0.010, ph: 0.042 }, [['a', 'Rn220', 1]], {}, { ea: 5.685 });
n('Th228', 90, 228, 1.9116 * Y, { a: 5.520, g: 0.003, ph: 0.02 }, [['a', 'Ra224', 1]],
  { c: [123, 40, 0.9] }, { ea: 5.423 });
n('Ac228', 89, 228, 6.15 * H, { b: 0.377, g: 0.929, ph: 1.5 }, [['b-', 'Th228', 1]], {});
n('Ra228', 88, 228, 5.75 * Y, { b: 0.0076 }, [['b-', 'Ac228', 1]], { c: [36, 12, 0.5] });
n('Th232', 90, 232, 1.405e10 * Y, { a: 4.083 }, [['a', 'Ra228', 1]],
  { c: [1.55, 3.2, 0.36], f: [0, 0.003, 0.011] },
  { ea: 4.01, sfb: 1.17e-11, nu: 1.50, n2n: [[2.4e-3, 9.0e-3, 0.030], 'Th231'] });
n('Th233', 90, 233, 21.83 * MIN, { b: 0.410, g: 0.031, ph: 0.13 }, [['b-', 'Pa233', 1]], {});
n('Pa233', 91, 233, 26.975 * D, { b: 0.198, g: 0.219, ph: 0.68 }, [['b-', 'U233', 1]],
  { c: [39, 25, 1.15] }, { n2n: [[1.2e-3, 5.0e-3, 0.020], 'Pa232'] });
n('Pa231', 91, 231, 3.276e4 * Y, { a: 5.060, b: 0.042, g: 0.048, ph: 0.30 },
  [['a', 'Ac227', 1]], { c: [60, 35, 1.5] }, { ea: 5.01 });
n('Pa232', 91, 232, 1.31 * D, { b: 0.230, g: 0.920, ph: 1.40 }, [['b-', 'U232', 1]],

/* --- lumped short-lived fission products ---------------------------
   Fission makes about a thousand nuclides.  The ~150 that still matter a
   day after shutdown are carried explicitly above; everything else is
   carried by twelve exponential groups whose half-lives ladder up by a
   factor 3.16 from 0.35 s to 110 000 s.

   The group half-lives and the per-decay energies of groups 1-10 are the
   ones this library has always used.  Groups 11 and 12 were added because
   the untracked remainder still carries 10-15 % of the decay heat one day
   after shutdown, which no group shorter than 11 000 s can produce; their
   energies are the yield-weighted mean ELP / EEM of the untracked
   nuclides whose half-lives fall in the corresponding bin.

   The FPs yields in YIELDS below are DERIVED, separately for each
   fissioning nuclide, from evaluated nuclear data — not from any
   decay-heat correlation:
     * ENDF/B-VIII.0 neutron-induced fission-yield sublibrary (England &
       Rider, ENDF-349), MT=454 independent and MT=459 cumulative yields,
       at 0.0253 eV for U-233/U-235/Pu-239/Pu-241 and at 500 keV for
       U-238/Th-232;
     * ENDF/B-VIII.0 decay sublibrary (MF=8 MT=457): half-lives and the
       mean energy per decay in light particles and in electromagnetic
       radiation.  Anti-neutrino energy is excluded there, which is
       exactly the part that does not heat the fuel.
   The whole ENDF decay network is solved from the independent yields for
   a single fission pulse, the nuclides this library carries explicitly
   are subtracted, and the remaining curve is projected onto the twelve
   fixed group half-lives by non-negative least squares, weighted by total
   decay heat, over 1 s ... 3e5 s.  The projection residual is <= 2.9 % of
   total fission-product decay heat for every fissioning nuclide.
   Closure: the groups carry 10.43 (U-235), 8.59 (Pu-239) and 14.23
   (U-238) MeV per fission against 10.63 / 8.77 / 14.42 MeV in the
   untracked part of the ENDF summation itself.

   They are massless (A = 0) and never enter the mass balance.        */

    hm: 25.0, pw: 0.55, bu: 80, sp: [0.22, 0.08], mat: 'oxide',

/* ===================================================================
   DEPLETION / DECAY SOLVER
   -------------------------------------------------------------------
   The transition matrix is made triangular by topologically sorting the
   nuclide graph (weak feedback edges — essentially alpha decay back
   into lighter actinides during irradiation — are cut and accounted).
   A triangular linear system with constant coefficients has an exact
   closed-form solution as a sum of exponentials, so:

     * every burn step is exact, no stiffness limit, no sub-stepping;
     * the whole cooling phase is solved ONCE and can then be evaluated
       at any time t for the price of a dot product.
   =================================================================== */

const NA = 6.02214076e23;
const MEV_J = 1.602176634e-13;
const LN2 = Math.LN2;
const BARN = 1e-24;

/* --- 1. Build the indexed library --------------------------------- */

const NUC = {}, IDS = [], IDX = {};
NUC_RAW.forEach(function (x) {
  if (NUC[x.id]) return;
  NUC[x.id] = x; IDX[x.id] = IDS.length; IDS.push(x.id);
});
const NN = IDS.length;

/* category tags for the composition view */
NUC_RAW.forEach(function (x, k) {
  x.cat = k < MARK_FP ? 'act' : k < MARK_ACT ? 'fp' : 'str';
  if (x.Z >= 81) x.cat = 'act';
});

/* Well-thermalised (D2O / graphite moderated) one-group anchors.
   Anything not listed is scaled from the light-water column. */
const TH_BOOST = 2.8;
const TH_ANCHOR = {
  Th232: { c: 4.50, f: 0.001 }, Pa233: { c: 130 },
  U232: { c: 200, f: 200 }, U233: { c: 30, f: 300 }, U234: { c: 40, f: 0.20 },
  U235: { c: 58, f: 280 }, U236: { c: 18, f: 0.20 }, U238: { c: 1.60, f: 0.09 },
  Np237: { c: 90, f: 1.2 }, Np238: { c: 300, f: 6000 }, Np239: { c: 130 },
  Pu236: { c: 60, f: 500 }, Pu238: { c: 100, f: 8 }, Pu239: { c: 240, f: 420 },
  Pu240: { c: 350, f: 1.5 }, Pu241: { c: 190, f: 520 }, Pu242: { c: 50, f: 1.2 },
  Am241: { c: 350, f: 3.5 }, Am242m: { c: 500, f: 2000 }, Am242: { c: 800, f: 6000 },
  Am243: { c: 70, f: 1.3 },
  Cm242: { c: 25, f: 8 }, Cm243: { c: 35, f: 1700 }, Cm244: { c: 20, f: 2.5 },
  Cm245: { c: 40, f: 1400 }, Cm246: { c: 10, f: 0.5 }, Cm247: { c: 20, f: 200 },
  Cm248: { c: 8, f: 1.0 },
  Cf249: { c: 1200, f: 2500 }, Cf250: { c: 4000 }, Cf251: { c: 6000, f: 12000 },
  Xe135: { c: 6.0e5 }, Sm149: { c: 8000 }, Sm151: { c: 3500 }, Sm152: { c: 150 },
  Cs133: { c: 18 }, Cs134: { c: 45 }, Cs135: { c: 5 },
  Eu151: { c: 2500 }, Eu153: { c: 180 }, Eu154: { c: 700 }, Eu155: { c: 1600 },
  Gd152: { c: 1500 }, Gd155: { c: 12000 }, Gd157: { c: 1.2e5 },
  Pm147: { c: 150 }, Nd143: { c: 200 }, Rh103: { c: 90 }, Tc99: { c: 12 },
  I129: { c: 15 }, Ag109: { c: 40 }, Cd113: { c: 1400 },
  Co59: { c: 45 }, Nb93: { c: 2.2 }, Zr93: { c: 2.0 },
  Hf174: { c: 900 }, Hf177: { c: 800 }, Hf180: { c: 25 },
  Er167: { c: 900 }, H1: { c: 0.60 },
  B10: { na: 2200 }, Li6: { na: 550 }, N14: { np: 1.30 }
};

/* Expand every cross-section vector to four spectral anchors:
   [ well-thermalised , light-water , intermediate , fast ]        */
(function expandXS() {
  IDS.forEach(function (id) {
    const u = NUC[id], a = TH_ANCHOR[id] || {};
    u.SC = [a.c !== undefined ? a.c : u.sc[0] * TH_BOOST, u.sc[0], u.sc[1], u.sc[2]];
    u.SF = [a.f !== undefined ? a.f : u.sf[0] * TH_BOOST, u.sf[0], u.sf[1], u.sf[2]];
    if (u.np) u.SNP = [a.np !== undefined ? a.np : u.np[0][0] * TH_BOOST,
      u.np[0][0], u.np[0][1], u.np[0][2]];
    if (u.na) u.SNA = [a.na !== undefined ? a.na : u.na[0][0] * TH_BOOST,
      u.na[0][0], u.na[0][1], u.na[0][2]];
    /* (n,2n) is a threshold reaction driven by the >6 MeV fission tail, which
       is present in every spectrum, so it gets no thermalisation boost. */
    if (u.n2n) u.SN2N = [u.n2n[0][0], u.n2n[0][0], u.n2n[0][1], u.n2n[0][2]];
    u.lam = u.t ? LN2 / u.t : 0;
  });
})();

/* Ground-state lookup by (Z, A) for implicit (n,gamma) targets */
const ZA = {};
IDS.forEach(function (id) {
  const u = NUC[id];
  const k = u.Z + '_' + u.A;
  if (ZA[k] === undefined || /^[A-Za-z]+\d+$/.test(id)) {
    if (ZA[k] === undefined) ZA[k] = id;
  }
});
IDS.forEach(function (id) {          // prefer the plain ground-state symbol
  const u = NUC[id];
  if (/^[A-Z][a-z]?\d+$/.test(id)) ZA[u.Z + '_' + u.A] = id;
});

IDS.forEach(function (id) {
  const u = NUC[id];
  if (u.capBr) { u.capT = u.capBr; return; }
  const t = ZA[u.Z + '_' + (u.A + 1)];
  u.capT = t ? [[t, 1]] : [];
});

/* --- 2. Spectrum ---------------------------------------------------- */
/* s : spectral index, 0 = fully thermalised ... 1 = fast
   d : "second hump" — fraction of the flux pushed into the fast wing  */
function spectrumWeights(s, d) {
  const w = [0, 0, 0, 0];
  const x = Math.max(0, Math.min(1, s)) * 3;
  const i = Math.min(2, Math.floor(x)), f = x - i;
  w[i] = 1 - f; w[i + 1] += f;
  const dd = Math.max(0, Math.min(1, d)) * 0.75;
  const moved = (w[0] + w[1] + w[2]) * dd;
  w[0] *= (1 - dd); w[1] *= (1 - dd); w[2] *= (1 - dd); w[3] += moved;
  return w;
}
function xsAt(vec, w) {
  return vec[0] * w[0] + vec[1] * w[1] + vec[2] * w[2] + vec[3] * w[3];
}

/* --- 3. Triangular ordering ---------------------------------------- */
/* edges: array of {from, to, rate}.  Returns a topological order and the
   list of edges that had to be cut to break feedback loops.           */
function topoOrder(edges) {
  const live = new Uint8Array(edges.length).fill(1);
  const cut = [];
  const adj = []; for (let i = 0; i < NN; i++) adj.push([]);

  function rebuild() {
    for (let i = 0; i < NN; i++) adj[i].length = 0;
    for (let k = 0; k < edges.length; k++) {
      if (!live[k]) continue;
      const e = edges[k];
      if (e.from !== e.to) adj[e.from].push(k);
    }
  }

  /* Tarjan, iterative, to locate strongly connected components */
  function scc() {
    const index = new Int32Array(NN).fill(-1), low = new Int32Array(NN);
    const onStk = new Uint8Array(NN), stk = [], comp = new Int32Array(NN).fill(-1);
    let counter = 0, nComp = 0;
    for (let root = 0; root < NN; root++) {
      if (index[root] !== -1) continue;
      const work = [[root, 0]];
      while (work.length) {
        const top = work[work.length - 1], v = top[0];
        if (top[1] === 0) { index[v] = low[v] = counter++; stk.push(v); onStk[v] = 1; }
        let recursed = false;
        while (top[1] < adj[v].length) {
          const w = edges[adj[v][top[1]++]].to;
          if (index[w] === -1) { work.push([w, 0]); recursed = true; break; }
          else if (onStk[w] && low[v] > index[w]) low[v] = index[w];
        }
        if (recursed) continue;
        if (low[v] === index[v]) {
          for (; ;) { const w = stk.pop(); onStk[w] = 0; comp[w] = nComp; if (w === v) break; }
          nComp++;
        }
        work.pop();
        if (work.length) {
          const p = work[work.length - 1][0];
          if (low[p] > low[v]) low[p] = low[v];
        }
      }
    }
    return { comp: comp, n: nComp };
  }

  for (let iter = 0; iter < 400; iter++) {
    rebuild();
    const s = scc();
    const size = new Int32Array(s.n);
    for (let i = 0; i < NN; i++) size[s.comp[i]]++;
    /* weakest live edge inside each non-trivial component */
    const weakest = new Int32Array(s.n).fill(-1);
    const weakRate = new Float64Array(s.n).fill(Infinity);
    let any = false;
    for (let k = 0; k < edges.length; k++) {
      if (!live[k]) continue;
      const e = edges[k];
      if (e.from === e.to) continue;
      const c = s.comp[e.from];
      if (c !== s.comp[e.from] || c !== s.comp[e.to] || size[c] < 2) continue;
      any = true;
      /* neutron-induced production paths are never cut: they are what
         actually breeds and transmutes.  Only decay feedback is broken. */
      /* prefer to break the physically "backward" links: alpha decay and
         electron capture.  beta-minus / IT only as a last resort.       */
      const pri = e.kind === 'rx' ? 1e30
        : (e.mode === 'a' || e.mode === 'ec' || e.mode === 'b+') ? 1 : 1e15;
      const score = e.rate * pri;
      if (score < weakRate[c]) { weakRate[c] = score; weakest[c] = k; }
    }
    if (!any) break;
    for (let c = 0; c < s.n; c++) if (weakest[c] >= 0) { live[weakest[c]] = 0; cut.push(edges[weakest[c]]); }
  }

  /* Kahn on the now-acyclic graph */
  rebuild();
  const indeg = new Int32Array(NN);
  for (let i = 0; i < NN; i++) for (let a = 0; a < adj[i].length; a++) indeg[edges[adj[i][a]].to]++;
  const q = [], order = [];
  for (let i = 0; i < NN; i++) if (!indeg[i]) q.push(i);
  while (q.length) {
    const v = q.pop(); order.push(v);
    for (let a = 0; a < adj[v].length; a++) {
      const w = edges[adj[v][a]].to;
      if (--indeg[w] === 0) q.push(w);
    }
  }
  if (order.length < NN) for (let i = 0; i < NN; i++) if (indeg[i] > 0) order.push(i);
  return { order: order, cut: cut };
}

/* --- 4. Exact solution of a triangular system ----------------------- */
/*  dN_i/dt = -mu_i N_i + sum_j r_ji N_j + S_i
    Result: N_i(t) = lin_i * t + sum_k C_i[k] * exp(-mode_k * t)
    Mode 0 is always mu = 0 (the constant term).                       */
function solveTriangular(mu, inEdges, S, N0, order) {
  const modes = [0], modeOf = new Int32Array(NN).fill(-1);
  const C = new Array(NN), lin = new Float64Array(NN);
  for (let i = 0; i < NN; i++) C[i] = new Map();

  for (let oi = 0; oi < order.length; oi++) {
    const i = order[oi];
    /* gather the inflow spectrum D[k] */
    const D = new Map();
    if (S[i]) D.set(0, S[i]);
    const inc = inEdges[i];
    for (let e = 0; e < inc.length; e++) {
      const j = inc[e].from, r = inc[e].rate, Cj = C[j];
      Cj.forEach(function (v, k) { D.set(k, (D.get(k) || 0) + r * v); });
      if (lin[j]) { /* linear growth of a terminal parent cannot feed on */ }
    }
    const m = mu[i], Ci = C[i];
    if (m > 0) {
      /* Register this nuclide's own mode.  Modes must stay separated by a
         comfortable RELATIVE margin: the Bateman coefficients go as
         1/(mu_i - mu_k), so two nearly equal removal constants (very easy
         to hit, since many nuclides share the same rounded cross section)
         would produce enormous coefficients that then cancel to nothing —
         classic catastrophic cancellation.  Modes closer than 1e-8 in
         relative terms are therefore nudged apart by ~1.5e-8 per pass
         (the loop below): that costs at most about 1e-6 relative on a
         decay constant and still keeps ~8 significant digits in the
         Bateman coefficients.                                           */
      let mm = m, guard = 0;
      while (modes.some(function (x) { return Math.abs(x - mm) < 1e-8 * Math.max(x, mm); })
        && guard++ < 80) mm *= (1 + (guard % 2 ? 1.5e-8 : -1.5e-8) * (guard + 1));
      const ki = modes.length; modes.push(mm); modeOf[i] = ki;
      let sum = 0;
      D.forEach(function (v, k) {
        const c = v / (mm - modes[k]);
        Ci.set(k, (Ci.get(k) || 0) + c); sum += c;
      });
      Ci.set(ki, (N0[i] || 0) - sum);
    } else {
      /* stable and non-absorbing: terminal, may grow linearly */
      let c0 = N0[i] || 0;
      D.forEach(function (v, k) {
        if (k === 0) { lin[i] += v; return; }
        const c = v / modes[k];
        Ci.set(k, (Ci.get(k) || 0) - c); c0 += c;
      });
      Ci.set(0, c0);
    }
  }
  return { modes: modes, C: C, lin: lin, modeOf: modeOf };
}

/* time integral of every nuclide over [0, t] — used to feed back the
   production carried by the edges that had to be cut. */
function integrateAll(sol, t) {
  const M = sol.modes.length, w = new Float64Array(M);
  for (let k = 0; k < M; k++) {
    const m = sol.modes[k];
    if (m <= 0) { w[k] = t; continue; }
    const x = m * t;
    w[k] = x > 700 ? 1 / m : -Math.expm1(-x) / m;
  }
  const res = new Float64Array(NN);
  for (let i = 0; i < NN; i++) {
    let v = sol.lin[i] * t * t / 2;
    sol.C[i].forEach(function (c, k) { v += c * w[k]; });
    res[i] = v > 0 ? v : 0;
  }
  return res;
}

/* Solve one step, then restore the cut feedback edges by two fixed-point
   passes: their production over the step is re-injected as a source.
   The loop gain of these edges is tiny, so this converges immediately.  */
function solveStep(mu, inEdges, S0, N0, order, cutEdges, dt, iters) {
  let sol = solveTriangular(mu, inEdges, S0, N0, order);
  if (!cutEdges || !cutEdges.length) return sol;
  for (let it = 0; it < (iters || 2); it++) {
    const I = integrateAll(sol, dt);
    const S2 = Float64Array.from(S0);
    for (let k = 0; k < cutEdges.length; k++) {
      const e = cutEdges[k];
      if (I[e.from] > 0) S2[e.to] += e.rate * I[e.from] / dt;
    }
    sol = solveTriangular(mu, inEdges, S2, N0, order);
  }
  return sol;
}

function evalAt(sol, t, out) {
  const M = sol.modes.length, e = new Float64Array(M);
  for (let k = 0; k < M; k++) {
    const x = sol.modes[k] * t;
    e[k] = x > 700 ? 0 : Math.exp(-x);
  }
  const res = out || new Float64Array(NN);
  for (let i = 0; i < NN; i++) {
    let v = sol.lin[i] * t;
    sol.C[i].forEach(function (c, k) { v += c * e[k]; });
    res[i] = v > 0 ? v : 0;
  }
  return res;
}

/* --- 5. Initial inventory ------------------------------------------ */
function addElement(N, el, grams, abundOverride) {
  const ab = abundOverride || ABUND[el];
  if (!ab) return;
  const M = AT_MASS[el] || 1;
  const atoms = grams / M * NA;
  for (const iso in ab) {
    if (iso === 'inert') continue;
    if (IDX[iso] !== undefined) N[IDX[iso]] += atoms * ab[iso];
  }
}

function buildInitial(cfg) {
  const Nf = new Float64Array(NN), Ns = new Float64Array(NN);
  /* heavy metal */
  let hmAtoms = 0;
  const hmg = cfg.hm * 1000;
  for (const id in cfg.comp) {
    if (IDX[id] === undefined) continue;
    const g = hmg * cfg.comp[id] / 100;
    const at = g / NUC[id].A * NA;
    Nf[IDX[id]] += at; hmAtoms += at;
  }
  /* fuel matrix, expressed as atoms of X per heavy-metal atom */
  const mx = MATRICES[cfg.mat];
  if (mx) for (const el in mx.el) {
    addElement(Nf, el, hmAtoms * mx.el[el] * (AT_MASS[el] || 1) / NA);
  }
  /* nitrogen and chlorine impurity in oxide fuel (drives C-14) */
  if (cfg.mat === 'oxide' || cfg.mat === 'triso') {
    addElement(Nf, 'N', hmg * (cfg.nImp !== undefined ? cfg.nImp : 25e-6));
  }
  /* structural materials */
  for (const mk in cfg.str) {
    const m = MATERIALS[mk]; if (!m || !cfg.str[mk]) continue;
    const grams = cfg.str[mk] * 1000;
    for (const el in m.el) addElement(Ns, el, grams * m.el[el]);
    if (m.iso) for (const iso in m.iso) {
      if (IDX[iso] !== undefined) Ns[IDX[iso]] += grams * m.iso[iso] / NUC[iso].A * NA;
    }
  }
  return { fuel: Nf, str: Ns, hmAtoms: hmAtoms };
}

/* --- 6. Irradiation -------------------------------------------------- */
function irradiate(cfg, progress) {
  const w = spectrumWeights(cfg.s, cfg.d);
  const init = buildInitial(cfg);
  let Nf = init.fuel, Ns = init.str;

  /* pre-compute spectral cross sections */
  const SC = new Float64Array(NN), SF = new Float64Array(NN),
    SNP = new Float64Array(NN), SNA = new Float64Array(NN), S2N = new Float64Array(NN);
  IDS.forEach(function (id, i) {
    const u = NUC[id];
    SC[i] = xsAt(u.SC, w); SF[i] = xsAt(u.SF, w);
    if (u.SNP) SNP[i] = xsAt(u.SNP, w);
    if (u.SNA) SNA[i] = xsAt(u.SNA, w);
    if (u.SN2N) S2N[i] = xsAt(u.SN2N, w);
  });

  /* fission-yield source matrix: for each fissionable nuclide, the list
     of (target index, atoms per fission) */
  const YS = {};
  IDS.forEach(function (id, i) {
    if (!(SF[i] > 0)) return;
    const set = YIELDS[YIELD_MAP[id] || 'U235']; if (!set) return;
    const lst = []; let massAcc = 0;
    for (const k in set) {
      if (IDX[k] === undefined) continue;
      lst.push([IDX[k], set[k] / 100]);
      if (!NUC[k].lump) massAcc += set[k] / 100 * NUC[k].A;  // lumped groups are massless
    }
    /* Whatever mass the explicit chains do not account for goes to FPrest, so
       that the mass balance closes exactly for every fissioning nuclide. */
    const nu = NU_FISSION[id] || NU_FISSION.default;
    const left = (NUC[id].A + 1 - nu - massAcc) / NUC.FPrest.A;
    lst.push([IDX.FPrest, Math.max(0, left)]);
    YS[i] = lst;
  });

  const totalSeconds = cfg.years * Y;
  const steps = cfg.steps || 30;
  const dt = totalSeconds / steps;
  const power = cfg.pw * 1e6;               // W per assembly
  const ff = cfg.strFlux !== undefined ? cfg.strFlux : 1.0;
  const fluxLog = [];
  let cut = null, cacheF = null, cacheS = null;

  /* flux that holds the assembly power constant for a given inventory */
  function fluxFor(N) {
    let denom = 0;
    for (let i = 0; i < NN; i++) {
      if (SF[i] > 0 && N[i] > 0) {
        const E = E_FISSION[IDS[i]] || E_FISSION.default;
        denom += SF[i] * BARN * N[i] * E * MEV_J;
      }
    }
    return denom > 0 ? power / denom : 0;
  }

  for (let st = 0; st < steps; st++) {
    /* Predictor-corrector.  Freezing the flux at the step-start inventory is
       only first order and always under-delivers burnup, because the fissile
       depletes during the step.  One corrector pass, using the step-AVERAGED
       inventory, makes the scheme second order: ten corrected steps beat a
       hundred and sixty uncorrected ones. */
    let phi = fluxFor(Nf);
    let rf = buildSystem(Nf, phi, SC, SF, SNP, SNA, S2N, YS, true, cacheF);
    if (!cacheF) { cacheF = rf.cache; cut = rf.cut; }
    let solF = solveStep(rf.mu, rf.inEdges, rf.S, Nf, rf.order, rf.back, dt, 2);
    const Iavg = integrateAll(solF, dt);
    for (let i = 0; i < NN; i++) Iavg[i] /= dt;
    const phi2 = fluxFor(Iavg);
    if (phi2 > 0 && isFinite(phi2)) {
      phi = phi2;
      rf = buildSystem(Nf, phi, SC, SF, SNP, SNA, S2N, YS, true, cacheF);
      solF = solveStep(rf.mu, rf.inEdges, rf.S, Nf, rf.order, rf.back, dt, 2);
    }
    fluxLog.push(phi);
    Nf = evalAt(solF, dt);

    /* ---- structural system (same spectrum, scaled flux, no fission) ---- */
    const rs = buildSystem(Ns, phi * ff, SC, SF, SNP, SNA, S2N, null, false, cacheS);
    if (!cacheS) cacheS = rs.cache;
    const solS = solveStep(rs.mu, rs.inEdges, rs.S, Ns, rs.order, rs.back, dt, 2);
    Ns = evalAt(solS, dt);

    if (progress) progress((st + 1) / steps);
  }
  return { fuel: Nf, str: Ns, flux: fluxLog, cut: cut, w: w, hmAtoms: init.hmAtoms };
}

/* Assemble mu / edges / sources for one system at a given flux */
function buildSystem(N, phi, SC, SF, SNP, SNA, S2N, YS, fission, cache) {
  const mu = new Float64Array(NN), S = new Float64Array(NN);
  const edges = [];
  for (let i = 0; i < NN; i++) {
    const u = NUC[IDS[i]];
    let m = u.lam;
    const cap = SC[i] * BARN * phi;
    const fis = fission ? SF[i] * BARN * phi : 0;
    const rp = SNP[i] * BARN * phi, ra = SNA[i] * BARN * phi;
    const r2 = S2N[i] * BARN * phi;
    m += cap + fis + rp + ra + r2;
    mu[i] = m;
    /* radioactive decay */
    for (let k = 0; k < u.d.length; k++) {
      const br = u.d[k][2], tgt = u.d[k][1];
      if (!tgt || IDX[tgt] === undefined) continue;
      edges.push({ from: i, to: IDX[tgt], rate: u.lam * br, kind: 'decay', mode: u.d[k][0] });
    }
    /* neutron capture */
    if (cap > 0) for (let k = 0; k < u.capT.length; k++) {
      const tgt = u.capT[k][0];
      if (IDX[tgt] === undefined) continue;
      edges.push({ from: i, to: IDX[tgt], rate: cap * u.capT[k][1], kind: 'rx' });
    }
    if (rp > 0 && IDX[u.np[1]] !== undefined) edges.push({ from: i, to: IDX[u.np[1]], rate: rp, kind: 'rx' });
    if (ra > 0 && IDX[u.na[1]] !== undefined) edges.push({ from: i, to: IDX[u.na[1]], rate: ra, kind: 'rx' });
    if (r2 > 0 && IDX[u.n2n[1]] !== undefined) edges.push({ from: i, to: IDX[u.n2n[1]], rate: r2, kind: 'rx' });
    /* fission -> yields */
    if (fission && fis > 0 && YS && YS[i]) {
      const lst = YS[i];
      for (let k = 0; k < lst.length; k++) {
        if (lst[k][1] > 0) edges.push({ from: i, to: lst[k][0], rate: fis * lst[k][1], kind: 'rx' });
      }
    }
  }
  let order, pos, cutList = [];
  if (cache) { order = cache.order; pos = cache.pos; }
  else {
    const to = topoOrder(edges);
    order = to.order; cutList = to.cut;
    pos = new Int32Array(NN);
    for (let k = 0; k < order.length; k++) pos[order[k]] = k;
  }
  const inEdges = []; for (let i = 0; i < NN; i++) inEdges.push([]);
  const back = [];
  edges.forEach(function (e) {
    if (pos[e.from] >= pos[e.to]) { back.push(e); return; }   // feedback edge
    inEdges[e.to].push({ from: e.from, rate: e.rate });
  });
  return { mu: mu, inEdges: inEdges, S: S, order: order, cut: cutList,
           cache: { order: order, pos: pos }, back: back };
}

/* --- 7. Cooling ------------------------------------------------------ */
function coolSolution(N0) {
  const mu = new Float64Array(NN), S = new Float64Array(NN), edges = [];
  for (let i = 0; i < NN; i++) {
    const u = NUC[IDS[i]];
    mu[i] = u.lam;
    for (let k = 0; k < u.d.length; k++) {
      const tgt = u.d[k][1];
      if (!tgt || IDX[tgt] === undefined) continue;
      edges.push({ from: i, to: IDX[tgt], rate: u.lam * u.d[k][2], kind: 'decay', mode: u.d[k][0] });
    }
  }
  const to = topoOrder(edges);
  const pos = new Int32Array(NN);
  for (let k = 0; k < to.order.length; k++) pos[to.order[k]] = k;
  const inEdges = []; for (let i = 0; i < NN; i++) inEdges.push([]);
  const back = [];
  edges.forEach(function (e) {
    if (pos[e.from] < pos[e.to]) inEdges[e.to].push({ from: e.from, rate: e.rate });
    else back.push(e);
  });
  const sol = solveTriangular(mu, inEdges, S, N0, to.order);
  sol.backCut = back.length;
  return sol;
}


/* ===================================================================
   SOURCE TERMS: decay heat, photon source, neutron source, dose rate
   =================================================================== */

/* mass energy-absorption coefficient of soft tissue, cm^2/g */
const MUEN_E = [0.03, 0.05, 0.08, 0.10, 0.15, 0.20, 0.30, 0.50, 0.662, 1.0, 1.5, 2.0, 3.0, 5.0];
const MUEN_V = [0.147, 0.0424, 0.0257, 0.0256, 0.0277, 0.0297, 0.0317, 0.0330,
  0.0327, 0.0311, 0.0283, 0.0262, 0.0234, 0.0206];
/* total mass attenuation of air, cm^2/g */
const MUAIR_V = [0.354, 0.208, 0.167, 0.154, 0.134, 0.123, 0.107, 0.0868,
  0.0775, 0.0636, 0.0517, 0.0445, 0.0357, 0.0275];
/* total mass attenuation of UO2-like fuel, cm^2/g */
const MUFUEL_V = [22.0, 5.50, 2.60, 1.70, 0.62, 0.360, 0.175, 0.0990,
  0.0805, 0.0633, 0.0518, 0.0470, 0.0435, 0.0426];

function interpLog(xs, ys, x) {
  if (x <= xs[0]) return ys[0];
  if (x >= xs[xs.length - 1]) return ys[ys.length - 1];
  let i = 1; while (xs[i] < x) i++;
  const f = (Math.log(x) - Math.log(xs[i - 1])) / (Math.log(xs[i]) - Math.log(xs[i - 1]));
  return ys[i - 1] * Math.pow(ys[i] / ys[i - 1], f);
}

/* (alpha,n) yield per alpha in a UO2 matrix, fitted to the measured
   specific neutron rates of Pu-238, Am-241 and Cm-244 oxides. */
function alphaNYield(Ea) { return 2.0e-8 * Math.pow(Ea / 5.5, 3.65); }

const DOSE_OPT_DEFAULT = {
  r: 1000,          // cm  (10 m)
  len: 366,         // cm, active length of the assembly (line source)
  selfAbs: 30.0,    // g/cm^2 of UO2-equivalent self-absorption
  useSelfAbs: true,
  hn: 3.85e-10      // Sv per n/cm^2, fission-spectrum ambient dose equiv.
};

/* Geometry factor.  A fuel assembly is ~3.7 m of line source, not a point:
   at 10 m the difference is under 2 %, but at 1 m a point source
   overestimates by nearly a factor of two.  Perpendicular to the midpoint,
   phi = S/(4*pi*r*L) * 2*atan(L/2r), which tends to S/(4*pi*r^2) as r>>L. */
function geoFactor(r, L) {
  r = Math.max(1, r || 1);
  if (!L || L <= 0) return 1 / (4 * Math.PI * r * r);
  return 2 * Math.atan(L / (2 * r)) / (4 * Math.PI * r * L);
}

/* Prompt energy released per spontaneous fission: fragment kinetic energy
   plus the prompt gammas that stay in the material.  Ignoring it costs a
   factor of two on a californium source, where half the heat is SF. */
const E_SF_HEAT = 185.0;   // MeV deposited locally per spontaneous fission
const E_SF_GAM = 6.7;      // MeV of prompt gammas per spontaneous fission
const N_SF_GAM = 7.8;      // prompt photons per spontaneous fission
const E_SF_GAM1 = E_SF_GAM / N_SF_GAM;

function sourceTerms(N, opt) {
  const o = Object.assign({}, DOSE_OPT_DEFAULT, opt || {});
  const yfac = (MATRICES[o.mat] && MATRICES[o.mat].yfac) || 1.0;
  const geo = geoFactor(o.r, o.len);

  const res = {
    heat: 0, heatA: 0, heatB: 0, heatG: 0, heatSF: 0,
    gMeV: 0, gPh: 0, nSF: 0, nAN: 0, act: 0,
    doseG: 0, doseN: 0,
    per: { heat: new Float64Array(NN), g: new Float64Array(NN), n: new Float64Array(NN), dose: new Float64Array(NN) }
  };

  for (let i = 0; i < NN; i++) {
    const u = NUC[IDS[i]];
    if (!u.lam || !(N[i] > 0)) continue;
    const A = u.lam * N[i];                       // decays per second
    res.act += A;
    const hA = A * u.a * MEV_J, hB = A * u.b * MEV_J, hG = A * u.g * MEV_J;
    res.heatA += hA; res.heatB += hB; res.heatG += hG;
    res.per.heat[i] = hA + hB + hG;

    /* photons */
    const gm = A * u.g;                           // MeV/s
    res.gMeV += gm;
    const nph = A * u.ph;
    res.gPh += nph;
    res.per.g[i] = gm;

    /* dose from this nuclide's photons */
    if (nph > 0 && u.g > 0) {
      const Eb = u.g / u.ph;                      // mean photon energy
      const muen = interpLog(MUEN_E, MUEN_V, Eb);
      const muAir = interpLog(MUEN_E, MUAIR_V, Eb) * 1.205e-3;
      const air = Math.exp(-muAir * o.r) * (1 + muAir * o.r);
      let esc = 1;
      if (o.useSelfAbs) {
        const x = interpLog(MUEN_E, MUFUEL_V, Eb) * o.selfAbs;
        esc = x > 1e-4 ? (1 - Math.exp(-x)) / x : 1;
      }
      const d = nph * geo * Eb * muen * 1.602176634e-10 * air * esc;  // Gy/s
      res.doseG += d; res.per.dose[i] += d;
    }

    /* spontaneous fission: neutrons, prompt heat and prompt gammas */
    if (u.sfb) {
      const rsf = A * u.sfb;
      if (u.nu) { const ns = rsf * u.nu; res.nSF += ns; res.per.n[i] += ns; }
      const hsf = rsf * E_SF_HEAT * MEV_J;
      res.heatSF += hsf; res.per.heat[i] += hsf;
      res.gMeV += rsf * E_SF_GAM; res.gPh += rsf * N_SF_GAM;
      res.per.g[i] += rsf * E_SF_GAM;
      const muen = interpLog(MUEN_E, MUEN_V, E_SF_GAM1);
      let esc = 1;
      if (o.useSelfAbs) {
        const x = interpLog(MUEN_E, MUFUEL_V, E_SF_GAM1) * o.selfAbs;
        esc = x > 1e-4 ? (1 - Math.exp(-x)) / x : 1;
      }
      const d = rsf * N_SF_GAM * geo * E_SF_GAM1 * muen * 1.602176634e-10 * esc;
      res.doseG += d; res.per.dose[i] += d;
    }
    /* neutrons: (alpha,n) on the fuel matrix */
    if (u.ea) {
      let ab = 0;
      for (let k = 0; k < u.d.length; k++) if (u.d[k][0] === 'a') ab += u.d[k][2];
      if (ab > 0) {
        const na = A * ab * alphaNYield(u.ea) * yfac;
        res.nAN += na; res.per.n[i] += na;
      }
    }
  }
  res.heat = res.heatA + res.heatB + res.heatG + res.heatSF;
  res.nTot = res.nSF + res.nAN;
  const dn = res.nTot * geo * o.hn;               // Sv/s
  res.doseN = dn;
  res.doseTot = res.doseG + dn;                   // Sv/s (gamma Gy ~ Sv)
  for (let i = 0; i < NN; i++) if (res.per.n[i]) res.per.dose[i] += res.per.n[i] * geo * o.hn;
  return res;
}

/* ------------------------------------------------------------------
   MEASURED fission-product decay heat, U-235 thermal fission.
   Dickens et al., ORNL/NUREG-14 Table 13: energy release after an
   INFINITE irradiation, MeV per fission, from calorimetry plus
   gamma/beta spectrometry.  Quoted 1 sigma is about 4 %.
   Below the first point the measured local slope t^-0.12 is used;
   above the last one the Way-Wigner t^-0.2 shape, renormalised for
   continuity at 14 000 s.
   Drawn as an overlay in the app so that the computed fission-product
   heat can be held against measurement.  Since 2026-08-12 nothing in
   the library is calibrated against it: the lumped short-lived groups
   are derived from ENDF/B-VIII.0 (see the FPs block above), which
   makes this overlay an independent check rather than a fit target.
   ------------------------------------------------------------------ */
const DICKENS_T = [2.2, 5.2, 10.2, 20.2, 60.2, 100, 300, 600, 1200,
  2000, 3000, 4000, 6000, 10000, 14000];
const DICKENS_F = [11.203, 10.104, 9.119, 8.118, 6.582, 5.949, 4.753, 4.136,
  3.520, 3.073, 2.737, 2.518, 2.238, 1.922, 1.728];

function fpInfinite(t) {                       // MeV per fission
  if (t <= 0) t = 1e-3;
  if (t < DICKENS_T[0]) return DICKENS_F[0] * Math.pow(t / DICKENS_T[0], -0.12);
  if (t > DICKENS_T[DICKENS_T.length - 1]) return 11.33 * Math.pow(t, -0.2);
  return interpLog(DICKENS_T, DICKENS_F, t);
}

/* Fission-product decay power for a finite irradiation of length T at
   constant power P0.  E_fis is the recoverable energy per fission. */
function fpRefHeat(P0, T, t, Efis) {
  const F = P0 / ((Efis || 200) * MEV_J);      // fissions per second
  return F * (fpInfinite(t) - fpInfinite(t + T)) * MEV_J;
}

/* kept for reference / comparison */
function wayWigner(P0, T, t) {
  if (t <= 0) t = 1e-3;
  return P0 * 0.0622 * (Math.pow(t, -0.2) - Math.pow(t + T, -0.2));
}

/* Helper: mass in grams of every nuclide */
function massVector(N) {
  const m = new Float64Array(NN);
  for (let i = 0; i < NN; i++) m[i] = N[i] * NUC[IDS[i]].A / NA;
  return m;
}

/* Helper: activity in becquerel */
function activityVector(N) {
  const a = new Float64Array(NN);
  for (let i = 0; i < NN; i++) a[i] = N[i] * NUC[IDS[i]].lam;
  return a;
}

/* Rank contributors, returning the smallest set covering `frac` */
function topContributors(vec, frac) {
  const idx = [];
  let tot = 0;
  for (let i = 0; i < NN; i++) { if (vec[i] > 0) { idx.push(i); tot += vec[i]; } }
  idx.sort(function (a, b) { return vec[b] - vec[a]; });
  const out = []; let acc = 0;
  for (let k = 0; k < idx.length; k++) {
    if (acc >= frac * tot && out.length >= 3) break;
    out.push({ i: idx[k], id: IDS[idx[k]], v: vec[idx[k]], f: tot > 0 ? vec[idx[k]] / tot : 0 });
    acc += vec[idx[k]];
  }
  return { list: out, total: tot, rest: Math.max(0, tot - acc) };
}


/* ===================================================================
   GAMMA-RAY SPECTRUM
   Bins the explicit gamma lines (04a-gammalines.js) plus the prompt
   spontaneous-fission gammas into a log-spaced energy grid.  Nuclides
   without an explicit line list contribute their whole photon yield at
   their mean photon energy.
   Returns both what is emitted inside the fuel and what escapes it.
   =================================================================== */
const GSPEC_E0 = 0.01, GSPEC_E1 = 10.0, GSPEC_NG = 36;
const GSPEC_EDGES = (function () {
  const a = [], l0 = Math.log10(GSPEC_E0), l1 = Math.log10(GSPEC_E1);
  for (let i = 0; i <= GSPEC_NG; i++) a.push(Math.pow(10, l0 + (l1 - l0) * i / GSPEC_NG));
  return a;
})();
function gspecBin(E) {
  if (!(E > 0)) return -1;
  const l0 = Math.log10(GSPEC_E0), l1 = Math.log10(GSPEC_E1);
  const k = Math.floor((Math.log10(E) - l0) / (l1 - l0) * GSPEC_NG);
  return k < 0 ? 0 : k >= GSPEC_NG ? GSPEC_NG - 1 : k;
}

function gammaSpectrum(N, opt) {
  const o = Object.assign({}, DOSE_OPT_DEFAULT, opt || {});
  const emit = new Float64Array(GSPEC_NG), esc = new Float64Array(GSPEC_NG);
  const escFrac = new Float64Array(GSPEC_NG);
  for (let k = 0; k < GSPEC_NG; k++) {
    const Em = Math.sqrt(GSPEC_EDGES[k] * GSPEC_EDGES[k + 1]);
    if (o.useSelfAbs) {
      const x = interpLog(MUEN_E, MUFUEL_V, Em) * o.selfAbs;
      escFrac[k] = x > 1e-4 ? (1 - Math.exp(-x)) / x : 1;
    } else escFrac[k] = 1;
  }
  function add(E, rate) {
    const k = gspecBin(E); if (k < 0 || !(rate > 0)) return;
    emit[k] += rate; esc[k] += rate * escFrac[k];
  }
  for (let i = 0; i < NN; i++) {
    const u = NUC[IDS[i]];
    if (!u.lam || !(N[i] > 0)) continue;
    const A = u.lam * N[i];
    const gl = GLINES[u.id];
    if (gl && gl.length) {
      for (let k = 0; k < gl.length; k++) add(gl[k][0], A * gl[k][1]);
    } else if (u.ph > 0 && u.g > 0) {
      add(u.g / u.ph, A * u.ph);
    }
    if (u.sfb) add(E_SF_GAM1, A * u.sfb * N_SF_GAM);
  }
  return { edges: GSPEC_EDGES, emit: emit, esc: esc };
}

/* ===================================================================
   NEUTRON SPECTRUM SHAPE  (illustration for the input panel)
   Each spectral anchor is itself a mixture of a Maxwellian thermal
   peak, a 1/E slowing-down region and a fission (Watt) spectrum.
   Plotted per unit lethargy, which is how reactor spectra are read.
   =================================================================== */
const ANCHOR_MIX = [        /* thermal, 1/E, fission */
  [0.55, 0.40, 0.05],       /* fully thermalised: D2O, graphite      */
  [0.14, 0.76, 0.10],       /* light water                            */
  [0.02, 0.63, 0.35],       /* intermediate / undermoderated          */
  [0.00, 0.12, 0.88]        /* fast                                   */
];
function neutronSpectrumShape(w, nPoints) {
  const n = nPoints || 220, E0 = 1e-4, E1 = 2e7;   /* eV */
  const kT = 0.0625;                                /* eV, ~725 K */
  const mix = [0, 0, 0];
  for (let a = 0; a < 4; a++) for (let c = 0; c < 3; c++) mix[c] += w[a] * ANCHOR_MIX[a][c];
  const pts = [];
  const l0 = Math.log10(E0), l1 = Math.log10(E1);
  for (let i = 0; i < n; i++) {
    const E = Math.pow(10, l0 + (l1 - l0) * i / (n - 1));
    /* Maxwellian, per unit lethargy: E*phi ~ (E/kT)^2 exp(-E/kT) */
    const xm = E / kT;
    const th = xm * xm * Math.exp(-xm);
    /* 1/E region: flat in lethargy, rolled off at both ends.  Divided by
       its own lethargy width so that all three components carry unit
       integral in lethargy — otherwise the slowing-down plateau, which
       spans seven decades, swamps the thermal peak, which spans one. */
    const epi = 1 / (1 + Math.pow(0.35 / E, 3)) / (1 + Math.pow(E / 1.2e6, 1.6)) / 15.0;
    /* Watt fission spectrum, per unit lethargy */
    const Em = E / 1e6;
    const fis = Em * 0.4527 * Math.exp(-Em / 0.965) * Math.sinh(Math.sqrt(2.29 * Em));
    pts.push([E, mix[0] * th + mix[1] * epi + mix[2] * fis]);
  }
  let mx = 0; pts.forEach(function (p) { if (p[1] > mx) mx = p[1]; });
  if (mx > 0) pts.forEach(function (p) { p[1] /= mx; });
  return pts;
}

/* --- number formatting -------------------------------------------- */
function fmtSI(v, digits) {
  if (!isFinite(v) || v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e5 || a < 1e-2) {
    const e = Math.floor(Math.log10(a));
    const m = v / Math.pow(10, e);
    return m.toFixed(digits === undefined ? 2 : digits) + '·10' + sup(e);
  }
  if (a >= 100) return v.toFixed(0);
  if (a >= 10) return v.toFixed(1);
  if (a >= 1) return v.toFixed(2);
  return v.toFixed(3);
}

  if (k < 1) return fmtSI(v) + (unit ? ' ' + unit : '');
  if (k > px.length) k = px.length;
  const m = v / Math.pow(10, 3 * k);
  const digits = Math.abs(m) >= 100 ? 0 : Math.abs(m) >= 10 ? 1 : 2;
  return m.toFixed(digits) + ' ' + px[k - 1] + (unit || '');
}

function fmtDuration(sec) {

  if (sec < Yr) return (sec / Dd).toPrecision(3) + ' ' + t('unitD');

    s.pts.forEach(function (p, k) {
      if (p[1] <= 0) return;
      d += (d ? 'L' : 'M') + X(p[0]).toFixed(2) + ' ' + Y(p[1]).toFixed(2);
    });
    el('path', { d: d, fill: 'none', stroke: col, 'stroke-width': s.dash ? 1.8 : 2.2,
      'stroke-linejoin': 'round', 'stroke-linecap': 'round',
      'stroke-dasharray': s.dash || '', opacity: s.dash ? 0.75 : 1 }, plot);
    /* direct label at the right end (positions de-collided below) */
    if (series.length <= 4 && !cfg.compact && !cfg.noLabels) {
      let last = null;
      for (let k = s.pts.length - 1; k >= 0; k--) if (s.pts[k][1] > y0 * 1e-2) { last = s.pts[k]; break; }
      if (last) labels.push({ y: Y(last[1]), col: col,
        text: s.short || (s.name.length > 12 ? s.name.slice(0, 11) + '…' : s.name) });
    }
  });

  /* push overlapping direct labels apart, keeping their vertical order */
  if (labels.length) {
    labels.sort(function (a, b) { return a.y - b.y; });
    const gap = 14, lo = m.t + 6, hi = Hh - m.b - 2;
    for (let i = 1; i < labels.length; i++)
      if (labels[i].y - labels[i - 1].y < gap) labels[i].y = labels[i - 1].y + gap;
    const over = labels[labels.length - 1].y - hi;
    if (over > 0) labels.forEach(function (L) { L.y = Math.max(lo, L.y - over); });
    labels.forEach(function (L) {
      el('text', { x: W - m.r + 8, y: L.y + 4, class: 'dlabel', fill: L.col }, plot)
        .textContent = L.text;
    });
  }

  /* --- crosshair + tooltip --- */
  const hover = el('g', { opacity: 0 }, svg);
  const vline = el('line', { y1: m.t, y2: Hh - m.b, class: 'crosshair' }, hover);
  const dots = series.map(function (s, i) {
    return el('circle', { r: 4.5, fill: s.color || seriesColor(i),
      stroke: 'var(--surface-1)', 'stroke-width': 2 }, hover);
  });
  /* legend (always present for two or more series) */
  if (series.length >= 2) {
    chartLegend(host, series.map(function (s, i) {
      return { label: s.name, color: s.color || seriesColor(i), dash: !!s.dash };
    }));
  }

  const tip = document.createElement('div');
  tip.className = 'chart-tip'; tip.style.display = 'none';
  host.appendChild(tip);

  svg.addEventListener('pointerleave', function () { hover.setAttribute('opacity', 0); tip.style.display = 'none'; });
  svg.addEventListener('pointermove', function (ev) {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) / r.width * W;
    if (px < m.l || px > W - m.r) { hover.setAttribute('opacity', 0); tip.style.display = 'none'; return; }
    const xv = Math.pow(10, lx0 + (px - m.l) / (W - m.l - m.r) * (lx1 - lx0));
    hover.setAttribute('opacity', 1);
    vline.setAttribute('x1', px); vline.setAttribute('x2', px);
    let rows = '';
    series.forEach(function (s, i) {
      const v = interpSeries(s.pts, xv);
      if (v > 0) {
        dots[i].setAttribute('cx', px); dots[i].setAttribute('cy', Y(v));
        dots[i].setAttribute('opacity', 1);
        rows += '<div class="tip-row"><span class="sw" style="background:' +
          (s.color || seriesColor(i)) + '"></span>' + escapeHtml(s.name) +
          '<b>' + (cfg.unit ? fmtQty(v, cfg.unit) : fmtSI(v)) + '</b></div>';
      } else dots[i].setAttribute('opacity', 0);
    });
    tip.innerHTML = '<div class="tip-hd">' + fmtDuration(xv) + '</div>' + rows;
    tip.style.display = 'block';
    const left = ev.clientX - r.left;
    tip.style.left = Math.min(r.width - tip.offsetWidth - 8, Math.max(4, left + 14)) + 'px';
    tip.style.top = Math.max(4, ev.clientY - r.top - tip.offsetHeight - 12) + 'px';
  });
}

function interpSeries(pts, x) {
  if (!pts.length) return 0;
  if (x <= pts[0][0]) return pts[0][1];
  if (x >= pts[pts.length - 1][0]) return pts[pts.length - 1][1];
  let i = 1; while (i < pts.length && pts[i][0] < x) i++;
  const a = pts[i - 1], b = pts[i];
  if (a[1] <= 0 || b[1] <= 0) return a[1];
  const f = (Math.log(x) - Math.log(a[0])) / (Math.log(b[0]) - Math.log(a[0]));
  return Math.exp(Math.log(a[1]) + f * (Math.log(b[1]) - Math.log(a[1])));
}

/* The swatch-and-label row three drawings used to build with innerHTML is a
   framework component now (UI_FRAMEWORK_SPEC.md 7.3).  The swatch takes the
   same colour reference the curve is stroked with, so the two cannot drift,
   and the legend keeps following the theme without a redraw.               */
function chartLegend(host, items) {
  const a = A();

  host.appendChild(a.legend({ shape: 'swatch', items: items }));

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
