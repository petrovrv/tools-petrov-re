  var state = JSON.parse(JSON.stringify(DEFAULTS));
  var last = null;

  /* ======================================================== 2. the interface */
  function T(en, uk, de, nl, fr, es, pl) { return { en: en, uk: uk, de: de, nl: nl, fr: fr, es: es, pl: pl }; }

  var stage = null;
  function LEGEND_ITEMS() {
    return [
      { label: T('Multi-Energy', 'Multi-Energy', 'Multi-Energy', 'Multi-Energy', 'Multi-Énergie', 'Multi-Energía', 'Multi-Energy'), series: 0 },
      { label: T('Baker-Strehlow-Tang', 'Бейкер-Стрелоу-Танг', 'Baker-Strehlow-Tang', 'Baker-Strehlow-Tang', 'Baker-Strehlow-Tang', 'Baker-Strehlow-Tang', 'Baker-Strehlow-Tang'), series: 1 }
    ];
  }
  function adoptStage(app) {
    stage = app.stages[0] || null;
    if (stage) stage.legend({ items: LEGEND_ITEMS() });
  }

  var ui = null;

  function computeView(s) {
    last = solve(s);
    if (stage) stage.schedule();
    if (!last || !last.ok) { var e = String((last && last.err) || 'Error'); var ew = trW(e); return { verdict: { tone: 'bad', text: ew.en === e ? trErr(e) : ew }, tiles: [], notes: [] }; }
    var r = last.r, tiles = [], notes = [], tables = [], verdict, i, w, n;
    var full = !!(s && s.level === 'full');
    function fin(v) { return typeof v === 'number' && isFinite(v); }
    function cell(v) { return fin(v) ? { value: sigv(v, 4), precision: sig(v, 4) } : { value: null, precision: 0 }; }
    function tile(label, v, hint, learn, tone, headline) { var c = cell(v); return { label: label, value: c.value, hint: hint, precision: c.precision, tone: tone, learn: learn, headline: !!headline }; }
    var me = r.me || {}, bst = r.bst || {};
    var meK = fin(me.dP_Pa) ? me.dP_Pa / 1000 : null, bstK = fin(bst.dP_Pa) ? bst.dP_Pa / 1000 : null;
    var dPmax = fin(meK) && fin(bstK) ? Math.max(meK, bstK) : (fin(meK) ? meK : bstK);
    var tone = !fin(dPmax) ? 'bad' : (dPmax < 3.45 ? 'ok' : (dPmax < 20.7 ? 'warn' : 'bad'));
    n = fin(dPmax) ? DiagramUI.fmt(dPmax, { precision: sig(dPmax, 3) }) : '—';
    if (tone === 'ok') {
      verdict = { tone: 'ok', text: T('Minor: below 3.45 kPa (window breakage)', 'Незначна дія: нижче 3,45 кПа (биття шибок)', 'Gering: unter 3,45 kPa (Fensterbruch)', 'Gering: onder 3,45 kPa (ruitbreuk)', 'Mineur : inférieur à 3,45 kPa (bris de vitres)', 'Leve: por debajo de 3,45 kPa (rotura de ventanas)', 'Niewielkie: poniżej 3,45 kPa (pękanie szyb)') };
    } else if (tone === 'warn') {
      verdict = { tone: 'warn', text: T('Damage to buildings likely: ' + n + ' kPa at the receptor', 'Ймовірні пошкодження будівель: ' + n + ' кПа в точці приймача', 'Gebäudeschäden wahrscheinlich: ' + n + ' kPa am Aufpunkt', 'Schade aan gebouwen waarschijnlijk: ' + n + ' kPa bij de receptor', 'Dommages aux bâtiments probables : ' + n + ' kPa au récepteur', 'Daños probables en edificios: ' + n + ' kPa en el receptor', 'Prawdopodobne uszkodzenia budynków: ' + n + ' kPa w punkcie receptora') };
    } else {
      verdict = { tone: 'bad', text: T('Severe structural damage: ' + n + ' kPa at the receptor', 'Серйозні пошкодження конструкцій: ' + n + ' кПа в точці приймача', 'Schwere Strukturschäden: ' + n + ' kPa am Aufpunkt', 'Ernstige constructieve schade: ' + n + ' kPa bij de receptor', 'Dommages structurels graves : ' + n + ' kPa au récepteur', 'Daños estructurales graves: ' + n + ' kPa en el receptor', 'Poważne uszkodzenia konstrukcji: ' + n + ' kPa w punkcie receptora') };
    }
    tiles.push(tile(T('Multi-Energy overpressure', 'Надлишковий тиск (Multi-Energy)', 'Überdruck (Multi-Energy)', 'Overdruk (Multi-Energy)', 'Surpression (Multi-Énergie)', 'Sobrepresión (Multi-Energía)', 'Nadciśnienie (Multi-Energy)'), meK, 'kPa', 'multienergy', tone, true));
    tiles.push(tile(T('BST overpressure', 'Надлишковий тиск (BST)', 'Überdruck (BST)', 'Overdruk (BST)', 'Surpression (BST)', 'Sobrepresión (BST)', 'Nadciśnienie (BST)'), bstK, 'kPa', 'bst', tone, true));
    tiles.push(tile(T('Combustion energy E', 'Енергія згоряння E', 'Verbrennungsenergie E', 'Verbrandingsenergie E', 'Énergie de combustion E', 'Energía de combustión E', 'Energia spalania E'), fin(r.E_J) ? r.E_J / 1e6 : null, 'MJ', 'energy'));
    tiles.push(tile(T('Flame Mach number Mf', 'Число Маха полум\'я Mf', 'Flammen-Machzahl Mf', 'Mach-getal van de vlam Mf', 'Nombre de Mach de flamme Mf', 'Número de Mach de la llama Mf', 'Liczba Macha płomienia Mf'), r.Mf, '—', 'bst'));
    if (full) {
      tiles.push(tile(T('Positive phase duration', 'Тривалість фази стиснення', 'Dauer der Überdruckphase', 'Duur van de positieve fase', 'Durée de la phase positive', 'Duración de la fase positiva', 'Czas trwania fazy dodatniej'), fin(me.tpos_s) ? me.tpos_s * 1000 : null, 'ms', 'impulse'));
      tiles.push(tile(T('Impulse', 'Імпульс', 'Impuls', 'Impuls', 'Impulsion', 'Impulso', 'Impuls'), me.impulse_Pa_s, 'Pa·s', 'impulse'));
      tiles.push(tile(T('Scaled distance R̄', 'Приведена відстань R̄', 'Skalierter Abstand R̄', 'Geschaalde afstand R̄', 'Distance réduite R̄', 'Distancia escalada R̄', 'Odległość skalowana R̄'), me.Rbar, '—', 'scaling'));
      tiles.push(tile(T('Sachs length L', 'Довжина Сакса L', 'Sachs-Länge L', 'Sachs-lengte L', 'Longueur de Sachs L', 'Longitud de Sachs L', 'Długość Sachsa L'), r.L_m, 'm', 'scaling'));
    }
    var rows = [], d = r.distances || [];
    for (i = 0; i < d.length; i++) {
      var k = String(i + 1), x = d[i] || {};
      rows.push({ cells: [T('Threshold ' + k, 'Поріг ' + k, 'Schwelle ' + k, 'Drempel ' + k, 'Seuil ' + k, 'Umbral ' + k, 'Próg ' + k),
        cell(fin(x.dP_Pa) ? x.dP_Pa / 1000 : null), cell(x.R_ME_m), cell(x.R_BST_m)] });
    }
    if (rows.length) {
      tables.push({ title: T('Distances to overpressure thresholds', 'Відстані до порогових значень надлишкового тиску', 'Abstände zu Überdruck-Schwellenwerten', 'Afstanden tot overdrukdrempels', 'Distances aux seuils de surpression', 'Distancias a los umbrales de sobrepresión', 'Odległości do progów nadciśnienia'),
        head: ['', { label: 'kPa', num: true }, { label: 'R ME, m', num: true }, { label: 'R BST, m', num: true }], rows: rows });
    }
    var ws = r.warnings || [];
    for (i = 0; i < ws.length; i++) { notes.push(trW(ws[i])); }
    notes.push(T('Overpressure values are side-on peak values (no reflection)',
      'Значення надлишкового тиску є піковими значеннями падаючої хвилі (без відбиття)',
      'Überdruckwerte sind Spitzenwerte des einfallenden Drucks (side-on, ohne Reflexion)',
      'Overdrukwaarden zijn piekwaarden van de invallende golf (side-on, zonder reflectie)',
      'Les valeurs de surpression sont des pics incidents (side-on, sans réflexion)',
      'Los valores de sobrepresión son picos incidentes (side-on, sin reflexión)',
      'Wartości nadciśnienia są szczytowymi wartościami fali padającej (side-on, bez odbicia)'));
    if (r.norm && r.norm.methods && r.norm.methods.length) {
      w = r.norm.methods.join('; ');
      notes.push(T('Methods: ' + w, 'Методи: ' + w, 'Methoden: ' + w, 'Methoden: ' + w, 'Méthodes : ' + w, 'Métodos: ' + w, 'Metody: ' + w));
    }
    return { verdict: verdict, tiles: tiles, meters: [], tables: tables, notes: notes };
  }

  function degrade() {
    document.title = 'diagram-ui.js v1 is required';
    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1');
    h.textContent = 'Vapour cloud explosion overpressure';
    var p = document.createElement('p');
    p.textContent = 'The interactive interface could not load. The export, the calculation record '
                  + 'and the limitations are still available from the bar at the bottom of the page.';
    host.appendChild(h);
    host.appendChild(p);
    last = solve(state);
  }

  function boot() {
    if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1') buildInterface();
    else degrade();
    installData();
  }

            "Schat de explosieoverdruk van een deflagrerende brandbare wolk bij een receptor en de afstanden tot gangbare schadedrempels. Twee screeningsmethoden staan naast elkaar: de TNO Multi-Energy-methode (TNO Yellow Book CPR14E, 3e ed. 2005, hfst. 5) en de Baker-Strehlow-Tang-methode met de vlamsnelheidstabel van 2005 (Pierorazio et al., 2005). Alleen het gecongesteerde deel van de wolk levert drukwerking.",
            "Estime la surpression d'une explosion de nuage inflammable en déflagration au niveau d'un récepteur et les distances aux seuils de dommages usuels. Deux méthodes de criblage sont présentées côte à côte : la méthode Multi-Énergie du TNO (TNO Yellow Book CPR14E, 3e éd. 2005, ch. 5) et la méthode Baker-Strehlow-Tang avec la table des vitesses de flamme de 2005 (Pierorazio et al., 2005). Seule la partie encombrée du nuage produit un effet de souffle.",

            "Szacuje nadciśnienie fali wybuchu deflagrującej chmury palnej w punkcie receptora oraz odległości do typowych progów uszkodzeń. Obok siebie pokazano dwie metody przesiewowe: metodę TNO Multi-Energy (TNO Yellow Book CPR14E, wyd. 3, 2005, rozdz. 5) i metodę Bakera-Strehlowa-Tanga z tabelą prędkości płomienia z 2005 r. (Pierorazio i in., 2005). Falę ciśnienia wytwarza tylko część chmury w strefie zabudowanej."
          )
        },
        topics: {

            body: T(
              "The Multi-Energy method treats each congested region as a hemispherical charge of combustion energy E. A family of ten blast curves (class 1 = very weak, 10 = detonation) gives the scaled side-on overpressure Ps and positive-phase duration as functions of the Sachs-scaled distance. The fill fraction scales E when the cloud only partly fills the congested volume.",
              "Метод Multi-Energy розглядає кожну загромаджену зону як напівсферичний заряд з енергією згоряння E. Сімейство з десяти кривих (клас 1 — дуже слабкий, 10 — детонація) дає приведений надлишковий тиск Ps і тривалість фази стиснення залежно від відстані, приведеної за Саксом. Ступінь заповнення зменшує E, якщо хмара заповнює загромаджений об'єм лише частково.",
              "Die Multi-Energy-Methode behandelt jeden verbauten Bereich als halbkugelförmige Ladung mit der Verbrennungsenergie E. Eine Schar von zehn Kurven (Klasse 1 = sehr schwach, 10 = Detonation) liefert den skalierten Überdruck Ps und die Dauer der Überdruckphase als Funktion des Sachs-skalierten Abstands. Der Füllgrad skaliert E, wenn die Wolke das verbaute Volumen nur teilweise ausfüllt.",
              "De Multi-Energy-methode behandelt elk gecongesteerd gebied als een halfbolvormige lading met verbrandingsenergie E. Een reeks van tien krommen (klasse 1 = zeer zwak, 10 = detonatie) geeft de geschaalde overdruk Ps en de duur van de positieve fase als functie van de Sachs-geschaalde afstand. De vullingsgraad schaalt E als de wolk het gecongesteerde volume maar gedeeltelijk vult.",
              "La méthode Multi-Énergie traite chaque zone encombrée comme une charge hémisphérique d'énergie de combustion E. Une famille de dix courbes (classe 1 = très faible, 10 = détonation) donne la surpression réduite Ps et la durée de phase positive en fonction de la distance réduite de Sachs. Le taux de remplissage réduit E lorsque le nuage ne remplit que partiellement le volume encombré.",
              "El método Multi-Energía trata cada zona congestionada como una carga hemisférica de energía de combustión E. Una familia de diez curvas (clase 1 = muy débil, 10 = detonación) da la sobrepresión escalada Ps y la duración de la fase positiva en función de la distancia escalada de Sachs. La fracción de llenado reduce E cuando la nube solo llena parcialmente el volumen congestionado.",

              "Лише попередня оцінка. Криві вибуху в цьому інструменті оцифровано з опублікованих діаграм (Multi-Energy: TNO Yellow Book CPR14E, 2005, рис. 5.8A і 5.8C; BST: Tang and Baker, 1999, у відтворенні DNV, 2026) з похибкою зчитування близько 3 % (Multi-Energy) і 10 % (BST) та перевірено на прикладі розрахунку з Yellow Book; за масштабованою відстанню 10 діаграма BST закінчується і прийнято спадання 1/R. Таблиця швидкостей полум'я BST відповідає Pierorazio et al. (2005); обмеженість 1D, якої немає в цій таблиці, приймається як DDT (Mf 5,2). Значення — пікові тиски падаючої хвилі у вільному полі (без відбиття та екранування) для однієї загромадженої зони і стехіометричної хмари. Детонація (клас 10, Mf 5,2) і значення в ближній зоні всередині хмари — орієнтовні. Для розміщення і проєктування використовуйте CFD (FLACS, KFX) або повну методику GAME/BST.",
              "Nur Screening. Die Druckwellenkurven dieses Werkzeugs sind aus den veröffentlichten Diagrammen digitalisiert (Multi-Energy: TNO Yellow Book CPR14E, 2005, Abb. 5.8A und 5.8C; BST: Tang und Baker, 1999, in der Wiedergabe von DNV, 2026), mit einer Ableseunsicherheit von etwa 3 % (Multi-Energy) und 10 % (BST), und am Rechenbeispiel des Yellow Book geprüft; jenseits des skalierten Abstands 10 endet das BST-Diagramm und ein Abfall mit 1/R wird angenommen. Die BST-Flammengeschwindigkeitstabelle folgt Pierorazio et al. (2005); 1D-Einschluss, der dort fehlt, wird als DDT (Mf 5,2) angesetzt. Die Werte sind Spitzenwerte (side-on) im Freifeld (ohne Reflexion und Abschirmung) für einen einzigen verbauten Bereich und eine stöchiometrische Wolke. Detonation (Klasse 10, Mf 5,2) und Nahfeldwerte in der Wolke sind Richtwerte. Für Standort- und Auslegungsfragen CFD (FLACS, KFX) oder die vollständige GAME/BST-Methodik verwenden.",
              "Alleen screening. De drukgolfkrommen in dit hulpmiddel zijn gedigitaliseerd uit de gepubliceerde diagrammen (Multi-Energy: TNO Yellow Book CPR14E, 2005, fig. 5.8A en 5.8C; BST: Tang en Baker, 1999, zoals weergegeven door DNV, 2026), met een afleesonzekerheid van ongeveer 3 % (Multi-Energy) en 10 % (BST), en gecontroleerd met het rekenvoorbeeld uit het Yellow Book; voorbij geschaalde afstand 10 eindigt het BST-diagram en wordt een afname met 1/R aangenomen. De BST-vlamsnelheidstabel volgt Pierorazio et al. (2005); 1D-opsluiting, die daar ontbreekt, wordt als DDT (Mf 5,2) genomen. De waarden zijn side-on pieken in het vrije veld (zonder reflectie of afscherming) voor één gecongesteerd gebied en een stoichiometrische wolk. Detonatie (klasse 10, Mf 5,2) en nabije-veldwaarden in de wolk zijn indicatief. Gebruik CFD (FLACS, KFX) of de volledige GAME/BST-methodiek voor locatie en ontwerp.",
              "Criblage uniquement. Les courbes de souffle de cet outil sont numérisées à partir des abaques publiés (Multi-Énergie : TNO Yellow Book CPR14E, 2005, fig. 5.8A et 5.8C ; BST : Tang et Baker, 1999, tels que reproduits par DNV, 2026), avec une incertitude de lecture d'environ 3 % (Multi-Énergie) et 10 % (BST), et vérifiées sur l'exemple de calcul du Yellow Book ; au-delà de la distance réduite 10, l'abaque BST s'arrête et une décroissance en 1/R est supposée. La table des vitesses de flamme BST suit Pierorazio et al. (2005) ; le confinement 1D, absent de cette table, est pris comme DDT (Mf 5,2). Les valeurs sont des pics incidents en champ libre (sans réflexion ni écran), pour une seule zone encombrée et un nuage stœchiométrique. La détonation (classe 10, Mf 5,2) et les valeurs en champ proche dans le nuage sont indicatives. Utiliser la CFD (FLACS, KFX) ou la démarche complète GAME/BST pour l'implantation et la conception.",
              "Solo cribado. Las curvas de onda de esta herramienta están digitalizadas de los ábacos publicados (Multi-Energía: TNO Yellow Book CPR14E, 2005, fig. 5.8A y 5.8C; BST: Tang y Baker, 1999, según la reproducción de DNV, 2026), con una incertidumbre de lectura de un 3 % (Multi-Energía) y un 10 % (BST), y comprobadas con el ejemplo de cálculo del Yellow Book; más allá de la distancia escalada 10 el ábaco BST termina y se supone un decaimiento 1/R. La tabla de velocidades de llama BST sigue a Pierorazio et al. (2005); el confinamiento 1D, ausente en ella, se toma como DDT (Mf 5,2). Los valores son picos incidentes en campo libre (sin reflexión ni apantallamiento), para una sola zona congestionada y una nube estequiométrica. La detonación (clase 10, Mf 5,2) y los valores de campo cercano dentro de la nube son orientativos. Use CFD (FLACS, KFX) o la metodología completa GAME/BST para ubicación y diseño.",
              "Tylko ocena przesiewowa. Krzywe fali w tym narzędziu zdigitalizowano z opublikowanych wykresów (Multi-Energy: TNO Yellow Book CPR14E, 2005, rys. 5.8A i 5.8C; BST: Tang i Baker, 1999, w reprodukcji DNV, 2026) z niepewnością odczytu około 3 % (Multi-Energy) i 10 % (BST) oraz sprawdzono na przykładzie obliczeniowym z Yellow Book; za odległością skalowaną 10 wykres BST się kończy i przyjęto spadek 1/R. Tabela prędkości płomienia BST jest zgodna z Pierorazio i in. (2005); ograniczenie 1D, którego w niej brak, przyjmuje się jako DDT (Mf 5,2). Wartości to szczytowe nadciśnienia fali padającej w polu swobodnym (bez odbicia i osłonięcia) dla jednego obszaru zabudowanego i chmury stechiometrycznej. Detonacja (klasa 10, Mf 5,2) i wartości w polu bliskim wewnątrz chmury są orientacyjne. Do lokalizacji i projektowania używaj CFD (FLACS, KFX) lub pełnej metodyki GAME/BST."
            )
          }

        note: T('Look at the two methods: with strength class 7 Multi-Energy gives 9.2 kPa at 100 m, BST (Mf 0.44) only 4.3 kPa. The class drives Multi-Energy - class 4 would give 2.2 kPa - so report both methods and justify the class.', 'Дивіться на обидва методи: з класом інтенсивності 7 Multi-Energy дає 9,2 кПа на 100 м, BST (Mf 0,44) — лише 4,3 кПа. Клас визначає Multi-Energy — клас 4 дав би 2,2 кПа, — тож наводьте обидва методи й обґрунтовуйте клас.', 'Vergleichen Sie beide Methoden: mit Stärkeklasse 7 ergibt Multi-Energy 9,2 kPa in 100 m, BST (Mf 0,44) nur 4,3 kPa. Die Klasse bestimmt Multi-Energy - Klasse 4 ergäbe 2,2 kPa -, daher beide Methoden angeben und die Klasse begründen.', 'Vergelijk beide methoden: met sterkteklasse 7 geeft Multi-Energy 9,2 kPa op 100 m, BST (Mf 0,44) slechts 4,3 kPa. De klasse bepaalt Multi-Energy - klasse 4 zou 2,2 kPa geven - dus rapporteer beide methoden en onderbouw de klasse.', 'Comparez les deux méthodes : avec la classe 7, Multi-Energy donne 9,2 kPa à 100 m, BST (Mf 0,44) seulement 4,3 kPa. La classe pilote Multi-Energy - la classe 4 donnerait 2,2 kPa - : présentez les deux méthodes et justifiez la classe.', 'Compare los dos métodos: con la clase 7, Multi-Energy da 9,2 kPa a 100 m y BST (Mf 0,44) solo 4,3 kPa. La clase gobierna Multi-Energy (la clase 4 daría 2,2 kPa): informe ambos métodos y justifique la clase.', 'Porównaj obie metody: przy klasie 7 Multi-Energy daje 9,2 kPa w odległości 100 m, BST (Mf 0,44) tylko 4,3 kPa. Klasa decyduje o wyniku Multi-Energy - klasa 4 dałaby 2,2 kPa - więc podawaj obie metody i uzasadniaj klasę.'),

      { id: 'propane-big-open', group: G2,
        label: T('Propane, 10 000 m3 open area', 'Пропан, 10 000 м3, відкрита ділянка', 'Propan, 10 000 m3, offenes Gelände', 'Propaan, 10 000 m3, open terrein', 'Propane, 10 000 m3, zone dégagée', 'Propano, 10 000 m3, zona abierta', 'Propan, 10 000 m3, teren otwarty'),
        note: T('Aha: ten times the cloud of the propane unit (10 000 m3) over open, uncongested ground gives 2.3 kPa at 100 m - four times less than 1000 m3 inside a congested unit (9.2 kPa). Congestion, not cloud size, makes the blast.', 'Ага: хмара вдесятеро більша, ніж у пропановій установці (10 000 м3), над відкритою незагромадженою ділянкою дає 2,3 кПа на 100 м — вчетверо менше, ніж 1000 м3 у загромадженій установці (9,2 кПа). Вибух робить загромадження, а не розмір хмари.', 'Aha: die zehnfache Wolke der Propananlage (10 000 m3) über offenem, unverbautem Gelände ergibt in 100 m 2,3 kPa - viermal weniger als 1000 m3 in einer verbauten Anlage (9,2 kPa). Die Verbauung, nicht die Wolkengröße, macht die Druckwelle.', 'Aha: tien keer de wolk van de propaaninstallatie (10 000 m3) boven open terrein zonder obstakels geeft 2,3 kPa op 100 m - vier keer minder dan 1000 m3 in een volgebouwde installatie (9,2 kPa). Obstakeldichtheid, niet wolkgrootte, maakt de drukgolf.', 'Aha : un nuage dix fois plus grand que celui de l’unité propane (10 000 m3) sur un terrain dégagé donne 2,3 kPa à 100 m - quatre fois moins que 1000 m3 dans une unité encombrée (9,2 kPa). C’est l’encombrement, pas la taille du nuage, qui fait le souffle.', 'Ajá: una nube diez veces mayor que la de la unidad de propano (10 000 m3) sobre terreno abierto y despejado da 2,3 kPa a 100 m, cuatro veces menos que 1000 m3 dentro de una unidad congestionada (9,2 kPa). La congestión, no el tamaño de la nube, hace la onda.', 'Aha: chmura dziesięć razy większa niż w instalacji propanu (10 000 m3) nad otwartym, niezabudowanym terenem daje 2,3 kPa w 100 m - cztery razy mniej niż 1000 m3 w zagęszczonej instalacji (9,2 kPa). Falę tworzy zabudowa, a nie wielkość chmury.'),
        apply: exA('simple', 'propane', 10000, 1, 3, '3D', 'low', 100) },
      { id: 'hydrogen-module', group: G2,
        label: T('Hydrogen, partly confined module', 'Водень, частково замкнений модуль', 'Wasserstoff, teilweise umschlossenes Modul', 'Waterstof, gedeeltelijk ingesloten module', 'Hydrogène, module partiellement confiné', 'Hidrógeno, módulo parcialmente confinado', 'Wodór, częściowo zamknięty moduł'),
        note: T('Look at the energy: only 576 MJ (60 % fill of 300 m3), yet class 9 and DDT in BST give 5.8 kPa (Multi-Energy) and 6.4 kPa (BST) at 80 m; read the detonation-like warning before using the number.', 'Дивіться на енергію: лише 576 МДж (заповнення 60 % від 300 м3), але клас 9 і DDT у BST дають 5,8 кПа (Multi-Energy) і 6,4 кПа (BST) на 80 м; прочитайте попередження про детонаційний характер, перш ніж використовувати число.', 'Achten Sie auf die Energie: nur 576 MJ (60 % Füllung von 300 m3), doch Klasse 9 und DDT in BST ergeben in 80 m 5,8 kPa (Multi-Energy) und 6,4 kPa (BST); lesen Sie die Detonationswarnung, bevor Sie den Wert verwenden.', 'Kijk naar de energie: slechts 576 MJ (60 % vulling van 300 m3), toch geven klasse 9 en DDT in BST op 80 m 5,8 kPa (Multi-Energy) en 6,4 kPa (BST); lees de detonatiewaarschuwing voordat u het getal gebruikt.', 'Regardez l’énergie : seulement 576 MJ (remplissage de 60 % de 300 m3), mais la classe 9 et la DDT en BST donnent 5,8 kPa (Multi-Energy) et 6,4 kPa (BST) à 80 m ; lisez l’avertissement de quasi-détonation avant d’utiliser la valeur.', 'Fíjese en la energía: solo 576 MJ (60 % de llenado de 300 m3), pero la clase 9 y la DDT en BST dan 5,8 kPa (Multi-Energy) y 6,4 kPa (BST) a 80 m; lea el aviso de casi detonación antes de usar el valor.', 'Spójrz na energię: tylko 576 MJ (wypełnienie 60 % z 300 m3), a klasa 9 i DDT w BST dają 5,8 kPa (Multi-Energy) i 6,4 kPa (BST) w 80 m; przeczytaj ostrzeżenie o charakterze detonacyjnym, zanim użyjesz liczby.'),
        apply: exA('full', 'hydrogen', 300, 0.6, 9, '2.5D', 'high', 80) },
      { id: 'hydrogen-hrs-canopy', group: G2,
        label: T('Hydrogen refuelling station canopy', 'Навіс водневої заправної станції', 'Überdachung einer Wasserstofftankstelle', 'Overkapping van een waterstoftankstation', 'Auvent de station de distribution d’hydrogène', 'Marquesina de una hidrogenera', 'Wiata stacji tankowania wodoru'),
        note: T('Look at the threshold table: a small 50 m3 hydrogen cloud under a canopy (160 MJ) still gives about 10.8 kPa at 30 m, and the 3.45 kPa contour reaches 82 m (Multi-Energy).', 'Дивіться на таблицю порогів: невелика хмара водню 50 м3 під навісом (160 МДж) усе ще дає близько 10,8 кПа на 30 м, а контур 3,45 кПа сягає 85 м (Multi-Energy).', 'Achten Sie auf die Schwellentabelle: eine kleine 50-m3-Wasserstoffwolke unter einem Dach (160 MJ) ergibt in 30 m noch etwa 10,8 kPa, und die 3,45-kPa-Kontur reicht 82 m (Multi-Energy).', 'Kijk naar de drempeltabel: een kleine waterstofwolk van 50 m3 onder een overkapping (160 MJ) geeft op 30 m nog ongeveer 10,8 kPa, en de contour van 3,45 kPa reikt tot 82 m (Multi-Energy).', 'Regardez la table des seuils : un petit nuage d’hydrogène de 50 m3 sous un auvent (160 MJ) donne encore environ 10,8 kPa à 30 m, et le contour 3,45 kPa atteint 82 m (Multi-Energy).', 'Fíjese en la tabla de umbrales: una pequeña nube de hidrógeno de 50 m3 bajo una marquesina (160 MJ) aún da unos 10,8 kPa a 30 m, y el contorno de 3,45 kPa llega a 82 m (Multi-Energy).', 'Spójrz na tabelę progów: mała chmura wodoru 50 m3 pod wiatą (160 MJ) wciąż daje około 10,8 kPa w 30 m, a kontur 3,45 kPa sięga 82 m (Multi-Energy).'),
        apply: exA('simple', 'hydrogen', 50, 1, 6, '2D', 'low', 30) }
    ];
    ui.examples(EX);

    ui.stage({
      caption: T('Side-on peak overpressure vs distance (Multi-Energy and BST)',
        'Піковий надлишковий тиск падаючої хвилі залежно від відстані (Multi-Energy та BST)',
        'Seitlicher Spitzenüberdruck über der Entfernung (Multi-Energy und BST)',
        'Piekoverdruk (side-on) versus afstand (Multi-Energy en BST)',
        'Surpression incidente maximale en fonction de la distance (Multi-Energy et BST)',
        'Sobrepresión incidente máxima frente a la distancia (Multi-Energy y BST)',
        'Szczytowe nadciśnienie fali padającej w funkcji odległości (Multi-Energy i BST)'),
      minHeight: 260,
      a11y: function () {
        if (!last || !last.ok || !last.r) return LP(T('No result', 'Немає результату', 'Kein Ergebnis', 'Geen resultaat', 'Pas de résultat', 'Sin resultado', 'Brak wyniku'));
        var r = last.r, f = function (o) { return (o && o.dP_Pa > 0) ? DiagramUI.fmt(o.dP_Pa / 1000, {precision: 3}) : '-'; };
        return LP(TF(T('Side-on peak overpressure versus distance; at R = $1 m: Multi-Energy $2 kPa, BST $3 kPa.',
          'Піковий надлишковий тиск падаючої хвилі залежно від відстані; при R = $1 м: Multi-Energy $2 кПа, BST $3 кПа.',
          'Spitzenüberdruck (side-on) über dem Abstand; bei R = $1 m: Multi-Energy $2 kPa, BST $3 kPa.',
          'Piekoverdruk (side-on) versus afstand; bij R = $1 m: Multi-Energy $2 kPa, BST $3 kPa.',
          'Surpression incidente de crête en fonction de la distance ; à R = $1 m : Multi-Energy $2 kPa, BST $3 kPa.',
          'Sobrepresión incidente de pico frente a la distancia; a R = $1 m: Multi-Energy $2 kPa, BST $3 kPa.',
          'Szczytowe nadciśnienie fali padającej w funkcji odległości; przy R = $1 m: Multi-Energy $2 kPa, BST $3 kPa.'),
          [DiagramUI.fmt(state.R_m, {precision: 0}), f(r.me), f(r.bst)]));
      },
      render: function (size, st) {
        var ctx = st.canvas(); ctx.clearRect(0, 0, size.w, size.h);
        if (!last || !last.ok || !last.r || !last.r.profile) return;
        var r = last.r, P = r.profile, L = 56, R = 12, Tm = 10, B = 36, pw = size.w - L - R, ph = size.h - Tm - B;
        if (pw < 20 || ph < 20) return;
        var cs = getComputedStyle(document.documentElement), muted = cs.getPropertyValue('--muted').trim() || '#888',
          line = cs.getPropertyValue('--line').trim() || '#ccc', font = cs.getPropertyValue('--font').trim() || 'sans-serif';
        var lg = function (v) { return Math.log(v) / Math.LN10; }, keys = ['dP_ME_Pa', 'dP_BST_Pa'];
        var xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity, i, k, p, v, d, x, y, on;
        for (i = 0; i < P.length; i++) {
          p = P[i]; if (!(p.R_m > 0)) continue;
          xmin = Math.min(xmin, p.R_m); xmax = Math.max(xmax, p.R_m);
          for (k = 0; k < 2; k++) { v = p[keys[k]] / 1000; if (v > 0) { ymin = Math.min(ymin, v); ymax = Math.max(ymax, v); } }
        }
        if (!isFinite(ymin) || !(xmax > xmin)) return;
        ymin = Math.max(ymin, 0.1); ymax *= 1.2; if (ymax <= ymin) ymax = ymin * 10;
        var lx0 = lg(xmin), lx1 = lg(xmax), ly0 = lg(ymin), ly1 = lg(ymax);
        function X(v) { return L + (lg(v) - lx0) / (lx1 - lx0) * pw; }
        function Y(v) { return Tm + ph - (lg(v) - ly0) / (ly1 - ly0) * ph; }
        ctx.font = '11px ' + font; ctx.lineWidth = 1; ctx.strokeStyle = line; ctx.fillStyle = muted;
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        for (d = Math.ceil(lx0); d <= Math.floor(lx1); d++) {
          v = Math.pow(10, d); x = X(v); ctx.beginPath(); ctx.moveTo(x, Tm); ctx.lineTo(x, Tm + ph); ctx.stroke();
          ctx.fillText(DiagramUI.fmt(v, {precision: v < 1 ? 3 : 0}), x, Tm + ph + 4);
        }
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        for (d = Math.ceil(ly0); d <= Math.floor(ly1); d++) {
          v = Math.pow(10, d); y = Y(v); ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + pw, y); ctx.stroke();
          ctx.fillText(DiagramUI.fmt(v, {precision: v < 1 ? 3 : 0}), L - 4, y);
        }
        ctx.strokeRect(L, Tm, pw, ph);
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText('R, m', L + pw / 2, size.h - 2);
        ctx.save(); ctx.translate(12, Tm + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textBaseline = 'middle'; ctx.fillText('ΔP, kPa', 0, 0); ctx.restore();
        ctx.save(); ctx.beginPath(); ctx.rect(L, Tm, pw, ph); ctx.clip();
        ctx.lineWidth = 2;
        for (k = 0; k < 2; k++) {
          ctx.strokeStyle = DiagramUI.series(k); ctx.beginPath(); on = false;
          for (i = 0; i < P.length; i++) {
            p = P[i]; v = p[keys[k]] / 1000; if (!(p.R_m > 0 && v > 0)) { on = false; continue; }
            if (on) ctx.lineTo(X(p.R_m), Y(v)); else { ctx.moveTo(X(p.R_m), Y(v)); on = true; }
          }
          ctx.stroke();
        }
        ctx.lineWidth = 1; ctx.strokeStyle = muted; ctx.fillStyle = muted; ctx.setLineDash([2, 3]); ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
        [3.45, 6.9, 13.8, 20.7, 34.5].forEach(function (t) {
          if (t < ymin || t > ymax) return; var yy = Y(t);
          ctx.beginPath(); ctx.moveTo(L, yy); ctx.lineTo(L + pw, yy); ctx.stroke(); ctx.fillText(DiagramUI.fmt(t, { digits: 'raw' }) + ' kPa', L + pw - 3, yy - 2);
        });
        var Rm = state.R_m;
        if (Rm >= xmin && Rm <= xmax) {
          x = X(Rm); ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(x, Tm); ctx.lineTo(x, Tm + ph); ctx.stroke();
          ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('R = ' + DiagramUI.fmt(Rm, {precision: 0}) + ' m', x + 4, Tm + 2);
          [r.me, r.bst].forEach(function (o, j) {
            var pv = o && o.dP_Pa / 1000; if (!(pv > 0)) return;
            ctx.fillStyle = DiagramUI.series(j); ctx.beginPath(); ctx.arc(x, Y(pv), 3, 0, 2 * Math.PI); ctx.fill();
          });
        }
        ctx.setLineDash([]); ctx.restore();
      }
    });
    adoptStage(ui);

    ui.ready();
    window.__vce_overpressure = { ui: ui, state: state, solve: solve, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function buildRecord() {
    if (!last) return null;
    var keys = ['fuel', 'V_m3', 'fill', 'strength', 'conf', 'cong', 'R_m', 'p0_Pa', 'T_C'];
    var units = { fuel: '-', V_m3: 'm3', fill: '-', strength: '-', conf: '-', cong: '-', R_m: 'm', p0_Pa: 'Pa', T_C: 'degC' };
    var inputs = {}, outputs = {}, notes = [], warnings = [], r = last.ok ? last.r : null, i;
    for (i = 0; i < keys.length; i++) inputs[keys[i]] = state[keys[i]];
    if (r) {
      var me = r.me || {}, bst = r.bst || {}, d = r.distances || [];
      outputs.E_J = r.E_J; outputs.L_m = r.L_m; outputs.c0_m_s = r.c0_m_s; outputs.Mf = r.Mf;
      outputs.me_Rbar = me.Rbar; outputs.me_Ps_bar = me.Ps_bar; outputs.me_dP_Pa = me.dP_Pa;
      outputs.me_tpos_s = me.tpos_s; outputs.me_impulse_Pa_s = me.impulse_Pa_s;
      outputs.bst_Rbar = bst.Rbar; outputs.bst_Ps_bar = bst.Ps_bar; outputs.bst_dP_Pa = bst.dP_Pa;
      for (i = 0; i < d.length; i++) {
        outputs['threshold_' + i + '_Pa'] = d[i].dP_Pa;
        outputs['R_ME_' + i] = d[i].R_ME_m;
        outputs['R_BST_' + i] = d[i].R_BST_m;
      }
      if (r.norm && r.norm.refs) for (i = 0; i < r.norm.refs.length; i++) notes.push(r.norm.refs[i]);
      if (r.norm && r.norm.scaling) notes.push(r.norm.scaling);
      var w = r.warnings || [];
      for (i = 0; i < w.length; i++) warnings.push(w[i]);
    } else {
      warnings.push(String(last.err));
    }
    return {
      inputs: inputs,
      units: units,
      outputs: outputs,
      model: {
        equations: [
          'E = V fill Ev (Ev = 3.5 MJ/m3 stoichiometric hydrocarbon-air, 3.2 MJ/m3 methane and hydrogen)',
          'Sachs scaling: Rbar = R/(E/p0)^(1/3), dP = Ps(Rbar) p0',
          'Multi-Energy: Ps(Rbar, class 1..10), tpos = tbar (E/p0)^(1/3)/c0, impulse = 0.5 dP tpos (triangular pulse)',
          'BST: flame Mach number Mf(confinement, reactivity, congestion), Ps(Rbar, Mf) interpolated in ln Mf',
          'c0 = sqrt(1.4 R T), R = 287.05 J/(kg K)'
        ],
        ranges: ['strength class 1..10', 'Multi-Energy Rbar 0.245..100 (r0 value held below), BST Rbar 0.1..10 on the chart, 1/Rbar beyond', 'BST Mf 0.2..5.2 (lower Mf clamped to 0.2)', 'fill fraction 0..1'],
        notes: notes
      },
      warnings: warnings
    };
  }

  var HANDOFF = {
    provides: ['p', 'T'],
    accepts: [],
    build: function () {
      if (!last || !last.ok) return null;
      var r = last.r, me = r.me || {}, bst = r.bst || {}, row = { R: { value: state.R_m, unit: 'm' } };
      if (typeof me.dP_Pa === 'number' && isFinite(me.dP_Pa)) row.dP_ME = { value: me.dP_Pa, unit: 'Pa' };
      if (typeof bst.dP_Pa === 'number' && isFinite(bst.dP_Pa)) row.dP_BST = { value: bst.dP_Pa, unit: 'Pa' };
      return {
        quantities: { p: { value: state.p0_Pa, unit: 'Pa' }, T: { value: state.T_C + 273.15, unit: 'K' } },
        sets: { blast: [row] }
      };
    },
    apply: function () { return false; }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'vce_overpressure',
        file: 'vce_overpressure.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
