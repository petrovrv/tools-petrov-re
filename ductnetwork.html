(()=>{
'use strict';
const ES={"\" design (and, for the Monte-Carlo, its quantile tallies) live in the shared runtime, and this build will not substitute a different sampler and call it the same experiment.":"\" diseño (y, en el caso de Monte Carlo, sus recuentos de cuantiles) residen en el entorno de ejecución compartido, y esta compilación no sustituirá un muestreador distinto presentándolo como el mismo experimento.","% points":"puntos %","% pts":"pts %","%-steps":"pasos de %","(hydraulic diameter now":"(diámetro hidráulico ahora","(unchanged from v1). Last runtime computation:":"(sin cambios respecto a v1). Último cálculo en tiempo de ejecución:","), so it fell back to the main thread":"), por lo que volvió al hilo principal","), so sweeps stay on the main thread":"), por lo que los barridos permanecen en el hilo principal","); sweeps run on the main thread":"); los barridos se ejecutan en el hilo principal","); sweeps run on the main thread and the Monte-Carlo sweep is unavailable":"); los barridos se ejecutan en el hilo principal y el barrido Monte Carlo no está disponible","- (dp at 100% / dp at 10%; upper bound on open/closed authority)":"- (dp al 100 % / dp al 10 %; cota superior de la autoridad abierto/cerrado)","- (fraction of intact flow)":"- (fracción del caudal intacto)","- (fraction of wide-open flow)":"- (fracción del caudal totalmente abierto)","- (fraction)":"- (fracción)","2000 < Re < 4000 is a numerical blend, not a resolved transition model":"2000 < Re < 4000 es una transición numérica, no un modelo de transición resuelto","24 h — one day":"24 h — un día","8760 h — one year":"8760 h — un año","8760 hourly rows are summarised above rather than printed.":"Las 8760 filas horarias se resumen arriba en lugar de imprimirse.",": nothing in this payload maps onto the current selection.":": nada en estos datos corresponde a la selección actual.","; ignored":"; ignorado","; one Worker case was checked against the same case solved here and came back identical":"; se comprobó un caso de Worker frente al mismo caso resuelto aquí y resultó idéntico","; over that box it differs from the Colebrook root by up to about 3% in f, and by more outside it. The 2000<Re<4000 blend is a numerical bridge, not a resolved transition model. Ducts running outside the published box are listed as a warning after each solve.":"; dentro de ese rango difiere de la raíz de Colebrook hasta en un 3 % aproximadamente en f, y más fuera de él. La transición 2000<Re<4000 es un puente numérico, no un modelo de transición resuelto. Los conductos fuera del rango publicado se indican como advertencia tras cada resolución.","A Latin hypercube over duct roughness (lognormal, median 1), grille design pressure drop (lognormal, median 1) and damper opening (normal, in percentage points), with an optional rank correlation inside each family. Quantiles are DDSketch estimates with a stated error bound, not exact order statistics. Duct leakage is not sampled: this model has no leakage element, and inventing one as a nodal demand would be a different model, not an uncertainty.":"Un hipercubo latino sobre la rugosidad del conducto (lognormal, mediana 1), la pérdida de presión de diseño de la rejilla (lognormal, mediana 1) y la apertura de la compuerta (normal, en puntos porcentuales), con una correlación de rango opcional dentro de cada familia. Los cuantiles son estimaciones DDSketch con un límite de error indicado, no estadísticos de orden exactos. La fuga del conducto no se muestrea: este modelo no tiene elemento de fuga, e inventar uno como demanda nodal sería un modelo distinto, no una incertidumbre.","A arm":"Brazo A","A damper":"Compuerta A","A damper out":"Salida compuerta A","A descending quadratic curve of fan total-pressure rise through the shutoff pressure and one rated point, scaled by the affinity laws with the local and global speed factors. The solver adds this rise to the gauge total pressure of the airflow, so the curve must be on the fan total-pressure basis; a catalogue static-pressure curve needs the fan outlet velocity pressure added before entry. Rated pressure must be below shutoff pressure. Reverse flow and operation beyond the zero-head runout are extrapolations of that quadratic and are warned after the solve.":"Una curva cuadrática descendente del aumento de presión total del ventilador que pasa por la presión de cierre y un punto nominal, escalada mediante las leyes de afinidad con los factores de velocidad local y global. El solucionador suma este aumento a la presión total relativa del flujo, por lo que la curva debe introducirse en presión total del ventilador; a una curva de catálogo en presión estática hay que sumarle antes la presión dinámica en la salida del ventilador. La presión nominal debe ser inferior a la presión de cierre. El caudal inverso y el funcionamiento más allá del punto de fuga a altura nula son extrapolaciones de esa parábola y se advierten tras la resolución.","A design-point pressure drop scaled by opening: dp = dp_design (q/q_design)² / c², with c = o for the linear conductance law and c = 50^(o−1) for equal percentage, where o is the opening as a fraction. Auto-balance changes the opening, never the rated characteristic. Set a balance target flow to include a damper in auto-balancing.":"Una pérdida de presión de punto de diseño escalada por la apertura: dp = dp_design (q/q_design)² / c², con c = o para la ley de conductancia lineal y c = 50^(o−1) para porcentaje igual, donde o es la apertura como fracción. El autoequilibrado cambia la apertura, nunca la característica nominal. Establezca un caudal objetivo de equilibrado para incluir una compuerta en el autoequilibrado.","A fixed-pressure node fixes gauge total pressure at a low-velocity boundary (normally 0 Pa for room/outdoor ambient). Positive node demand removes airflow; negative demand injects it. Boundary pressures are gauge pressures relative to the outdoor air at the node elevation; with one air density inside and outside, the hydrostatic terms cancel, and buoyancy/stack effect from temperature-dependent density is not modelled.":"Un nodo de presión fija establece la presión total relativa en un contorno de baja velocidad (normalmente 0 Pa para un local o el ambiente exterior). Una demanda nodal positiva extrae caudal; una demanda negativa lo inyecta. Las presiones de contorno son manométricas respecto al aire exterior a la cota del nodo; con una sola densidad dentro y fuera los términos hidrostáticos se anulan, y el efecto de flotabilidad/tiro térmico por densidad dependiente de la temperatura no se modela.","A fixed-pressure node fixes gauge total pressure at a low-velocity boundary — normally 0 Pa for a room or the outdoors. At least one is needed in every connected part of the network, otherwise the pressure level is undetermined and the solve is refused.":"Un nodo de presión fija establece la presión total relativa en un contorno de baja velocidad — normalmente 0 Pa para un local o el exterior. Se necesita al menos uno en cada parte conexa de la red, de lo contrario el nivel de presión queda indeterminado y se rechaza la resolución.","A grille":"Rejilla A","A rename does not change a number, so the solution is kept.":"Un cambio de nombre no modifica ningún número, por lo que la solución se conserva.","A sweep is already running.":"Ya hay un barrido en curso.","A tee arm is a user-supplied local-loss coefficient K applied to that arm only, with no friction term. Represent a multi-port junction as one node plus one fitting edge per arm that needs an explicit K. The K values are inputs: they are not derived from ASHRAE or Idelchik geometry, and not from the split ratio.":"Un brazo de te es un coeficiente de pérdida singular K proporcionado por el usuario, aplicado únicamente a ese brazo, sin término de fricción. Represente una unión de varias vías como un nodo más una arista de accesorio por cada brazo que necesite un K explícito. Los valores de K son datos de entrada: no se derivan de la geometría ASHRAE o Idelchik, ni de la relación de reparto.","ASHRAE Handbook - Fundamentals, Duct Design: rectangular hydraulic diameter Dh = 2WH/(W+H); local loss dp = K rho v^2/2.":"ASHRAE Handbook - Fundamentals, Duct Design: diámetro hidráulico rectangular Dh = 2WH/(W+H); pérdida singular dp = K rho v^2/2.","Add at least one component.":"Añada al menos un componente.","Add at least two nodes.":"Añada al menos dos nodos.","Air and load":"Aire y carga","Air density":"Densidad del aire","Air density 0.2 to 2 kg/m3":"Densidad del aire 0,2 a 2 kg/m3","Air density must be 0.2–2 kg/m³.":"La densidad del aire debe ser de 0,2 a 2 kg/m³.","Air power W":"Potencia del aire W","Air state":"Estado del aire","Airflow [m³/h]":"Caudal [m³/h]","All component airflows and all free-node gauge total pressures are unknowns in one system, solved by a damped Newton method with a numerically differentiated Jacobian and a dense Gauss–Jordan factorisation with partial pivoting. The stopping rule is a scaled residual of 2×10⁻⁹; if the iteration cap is reached first the result is reported as unconverged. The browser solver refuses models above 600 nonlinear unknowns.":"Todos los caudales de los componentes y todas las presiones totales relativas de los nodos libres son incógnitas de un único sistema, resuelto mediante un método de Newton amortiguado con un jacobiano diferenciado numéricamente y una factorización de Gauss-Jordan densa con pivoteo parcial. La regla de parada es un residuo escalado de 2×10⁻⁹; si primero se alcanza el límite de iteraciones, el resultado se notifica como no convergido. El solucionador del navegador rechaza modelos con más de 600 incógnitas no lineales.","Arm loss coefficient K":"Coeficiente de pérdida K del brazo","At most 600 nonlinear unknowns (components + free nodes)":"Como máximo 600 incógnitas no lineales (componentes + nodos libres)","Auto-balance dampers":"Autoequilibrar compuertas","Auto-balance moves the opening of every damper with a target above zero.":"El autoequilibrado modifica la apertura de cada compuerta con un objetivo superior a cero.","B arm":"Brazo B","B damper":"Compuerta B","B damper out":"Salida compuerta B","B grille":"Rejilla B","Balance target":"Objetivo de equilibrado","Balancing failed:":"Error en el equilibrado:","Balancing is not meaningful at 0% load":"El equilibrado no tiene sentido con 0 % de carga","Boundary +in m³/h":"Contorno +entrada m³/h","Boundary [m³/h]":"Contorno [m³/h]","Boundary conditions":"Condiciones de contorno","C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156: used only to quantify the Swamee-Jain scatter, never as the graded reference.":"C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156: utilizado únicamente para cuantificar la dispersión de Swamee-Jain, nunca como referencia evaluada.","Cancel sweep":"Cancelar barrido","Catalogue window ± steps (0 = all)":"Ventana de catálogo ± pasos (0 = todos)","Circular":"Circular","Circular or rectangular Darcy–Weisbach: 64/Re below Re 2000, the Swamee–Jain explicit approximation above Re 4000, and a smoothstep blend between. Swamee–Jain is published for 10⁻⁶ ≤ eps/Dh ≤ 10⁻² and 5×10³ ≤ Re ≤ 10⁸; over that box it differs from the Colebrook root by up to about 3 % in f, and by more outside it. Ducts running outside the published box are listed as a warning after each solve. Roughness is the absolute wall roughness in millimetres; ΣK collects the local losses on that run.":"Circular o rectangular, Darcy–Weisbach: 64/Re por debajo de Re 2000, la aproximación explícita de Swamee–Jain por encima de Re 4000, y una transición suavizada entre ambas. Swamee–Jain está publicada para 10⁻⁶ ≤ eps/Dh ≤ 10⁻² y 5×10³ ≤ Re ≤ 10⁸; dentro de ese rango difiere de la raíz de Colebrook hasta en un 3 % aproximadamente en f, y más fuera de él. Los conductos fuera del rango publicado se indican como advertencia tras cada resolución. La rugosidad es la rugosidad absoluta de pared en milímetros; ΣK recoge las pérdidas singulares de ese cálculo.","Click a node or a component on the drawing to edit it, or pick a tool and click the canvas to create one.":"Haga clic en un nodo o componente del dibujo para editarlo, o elija una herramienta y haga clic en el lienzo para crear uno.","Click empty canvas to add a node.":"Haga clic en el lienzo vacío para añadir un nodo.","Click junction node, then arm node to add a tee/fitting loss arm.":"Haga clic en el nodo de unión y después en el nodo del brazo para añadir un brazo de pérdida de te/accesorio.","Click start node, then end node to add a damper.":"Haga clic en el nodo inicial y después en el nodo final para añadir una compuerta.","Click start node, then end node to add a duct.":"Haga clic en el nodo inicial y después en el nodo final para añadir un conducto.","Click start node, then end node to add a grille.":"Haga clic en el nodo inicial y después en el nodo final para añadir una rejilla.","Component":"Componente","Component closed":"Componente cerrado","Component energy:  h_a + z_a (1 - rho_out/rho) - h_b - z_b (1 - rho_out/rho) + h_fan(q) - h_loss(q) = 0, with h = p_total_gauge/(rho g), gauge relative to outdoor air at the node elevation, rho_out = rho":"Energía del componente: h_a + z_a (1 - rho_out/rho) - h_b - z_b (1 - rho_out/rho) + h_fan(q) - h_loss(q) = 0, con h = p_total_gauge/(rho g), rho_out = rho","Component results":"Resultados del componente","Component velocity is the airflow divided by the flow area, and velocity pressure is ½ rho v². Generic junction nodes have no unique cross-section, so static pressure is not recovered at a node: velocity and velocity pressure are reported per component instead. The velocity limit in Screening limits is what the N-1, profile and sizing sweeps compare against.":"La velocidad del componente es el caudal dividido por la sección de paso, y la presión dinámica es ½ rho v². Los nodos de unión genéricos no tienen una sección propia, por lo que la presión estática no se recupera en un nodo: en su lugar se indican la velocidad y la presión dinámica por componente. El límite de velocidad en Límites de cribado es lo que comparan los barridos N-1, de perfil y de dimensionado.","Components":"Componentes","Compute":"Calcular","Could not sweep a usable authority curve.":"No se pudo obtener una curva de autoridad utilizable.","Could not sweep a usable system curve.":"No se pudo obtener una curva de la red utilizable.","Curves":"Curvas","Damper":"Compuerta","Damper authority":"Autoridad de la compuerta","Damper flow m³/h":"Caudal compuerta m³/h","Damper opening 0.1 % to 100 %":"Apertura de compuerta 0,1 % a 100 %","Damper opening [%]":"Apertura de compuerta [%]","Damper opening sd (normal)":"Apertura de compuerta de (normal)","Damper:":"Compuerta:","Damper:  h_loss = (dp_design/(rho g)) (q/q_design)^2 / c^2,  c = o (linear) or 50^(o-1) (equal percentage), o = opening/100":"Compuerta: h_loss = (dp_design/(rho g)) (q/q_design)^2 / c^2, c = o (lineal) o 50^(o-1) (porcentaje igual), o = apertura/100","Dampers":"Compuertas","Delete":"Eliminar","Delete selected":"Eliminar selección","Delete the selection":"Eliminar la selección","Demand [m³/h]":"Demanda [m³/h]","Demand m³/h":"Demanda m³/h","Demand, positive out":"Demanda, positivo = saliente","Density and kinematic viscosity are constant everywhere and for the whole solve. Density converts head to pressure and scales every loss; viscosity only enters through the Reynolds number, and therefore only through the friction factor of ducts. 1.204 kg/m³ and 1.5×10⁻⁵ m²/s are dry air at about 20 °C and one atmosphere.":"La densidad y la viscosidad cinemática son constantes en todas partes y durante toda la resolución. La densidad convierte la altura en presión y escala cada pérdida; la viscosidad solo interviene a través del número de Reynolds, y por tanto solo a través del factor de fricción de los conductos. 1,204 kg/m³ y 1,5×10⁻⁵ m²/s corresponden a aire seco a unos 20 °C y una atmósfera.","Design flow":"Caudal de diseño","Design m³/h":"Diseño m³/h","Design Δp":"Δp de diseño","Diameter":"Diámetro","Direction:":"Sentido:","Drag nodes. Select an element to edit it.":"Arrastre los nodos. Seleccione un elemento para editarlo.","Draw":"Dibujar","Draw a network, or load the example, then press Solve network.":"Dibuje una red, o cargue el ejemplo, y después pulse Resolver red.","Draw and solve arbitrary air-duct networks with ducts, junction/tee arms, grilles, dampers and fans. Steady-state airflow, gauge total pressure, fan/system curves and damper balancing.":"Dibuje y resuelva redes de conductos de aire arbitrarias con conductos, brazos de unión/te, rejillas, compuertas y ventiladores. Caudal estacionario, presión total manométrica, curvas ventilador/sistema y equilibrado de compuertas.","Drawing tools":"Herramientas de dibujo","Duct":"Conducto","Duct internal checks failed":"Error en las comprobaciones internas del conducto","Duct network drawing canvas":"Lienzo de dibujo de la red de conductos","Duct roughness σ (lognormal)":"Rugosidad del conducto σ (lognormal)","Duct sizing":"Dimensionado de conductos","Duct sizing cancelled.":"Dimensionado de conductos cancelado.","Duct sizing failed:":"Error en el dimensionado de conductos:","Duct sizing is ranked by specific air power (air power per m3/s delivered), not by raw air power: with a fan on a curve, a smaller duct lowers the product dp*Q while delivering less air, so the raw figure rewards choking. Each swept duct is replaced by a circular duct of the catalogue size under test, so a rectangular duct is re-sectioned, and cost is represented only by the swept surface area pi*D*L.":"El dimensionado de conductos se clasifica por potencia aérea específica (potencia aérea por m3/s suministrado), no por potencia aérea bruta: con un ventilador sobre una curva, un conducto más pequeño reduce el producto dp*Q a la vez que suministra menos aire, por lo que la cifra bruta premia el estrangulamiento. Cada conducto barrido se sustituye por un conducto circular de la medida de catálogo en prueba, por lo que un conducto rectangular se reconvierte, y el coste se representa únicamente por la superficie barrida pi*D*L.","Duct sizing over the EN 1506 catalogue":"Dimensionado de conductos sobre el catálogo EN 1506","Duct:":"Conducto:","Duct:  h_loss = (f L/Dh + K) v^2/(2 g),  v = q/A,  Re = v Dh/nu":"Conducto: h_loss = (f L/Dh + K) v^2/(2 g), v = q/A, Re = v Dh/nu","Ducts":"Conductos","Ducts to size (highest v first)":"Conductos a dimensionar (v más alta primero)","EN 1506 nominal circular duct diameters, mm:":"Diámetros nominales de conducto circular EN 1506, mm:","Each duct, tee arm and damper is removed in turn and the network re-solved from cold, to find which grilles starve when one branch closes. Contingencies that leave the network unsolvable are listed as such rather than being silently dropped.":"Cada conducto, brazo de te y compuerta se retira por turnos y la red se vuelve a resolver en frío, para determinar qué rejillas quedan desabastecidas cuando se cierra una rama. Los escenarios que dejan la red irresoluble se indican como tales en lugar de descartarse silenciosamente.","Edge":"Arista","Edge results":"Resultados de aristas","Elevation":"Cota","Node pressures are gauge pressures relative to the outdoor air at the elevation of the node. The energy balance carries the hydrostatic term (rho − rho_out) g z, and the outdoor density rho_out equals the air density entered here, so the term is zero and elevation changes no airflow or pressure. Buoyancy and stack effect from temperature-dependent density are not modelled, so a tall riser carrying warm air is not represented by raising its nodes.":"Las presiones de los nodos son presiones manométricas respecto al aire exterior a la cota del nodo. El balance de energía contiene el término hidrostático (rho − rho_out) g z, y la densidad exterior rho_out es igual a la densidad del aire introducida aquí, por lo que el término es nulo y la cota no modifica ningún caudal ni ninguna presión. La flotabilidad y el efecto de tiro térmico por densidad dependiente de la temperatura no se modelan, por lo que una columna ascendente alta que transporta aire caliente no se representa elevando sus nodos.","Node pressures are gauge pressures relative to the outdoor air at each node elevation; with the outdoor density equal to the air density the hydrostatic terms cancel, and buoyancy and stack effect from temperature-dependent density are not modelled.":"Las presiones de los nodos son manométricas respecto al aire exterior a la cota de cada nodo; con la densidad exterior igual a la del aire los términos hidrostáticos se anulan, y la flotabilidad y el efecto de tiro térmico por densidad dependiente de la temperatura no se modelan.","Elevation m":"Cota m","Ensemble sweep results":"Resultados de los barridos de conjunto","Equal percentage (R=50)":"Porcentaje igual (R=50)","Equations":"Ecuaciones","Every network needs at least one fixed-pressure node per connected component; ambient boundaries are normally 0 Pa gauge total pressure.":"Cada red necesita al menos un nodo de presión fija por componente conexo; los contornos ambientales suelen ser 0 Pa de presión total relativa.","Every nodal demand is multiplied by this factor before the solve, so 60 % means every extraction and injection runs at 60 % of its design value. It does not touch fan speed, damper openings or grille design points. The valid range of the model is 0 to 150 %.":"Cada demanda nodal se multiplica por este factor antes de la resolución, de modo que 60 % significa que cada extracción e inyección funciona al 60 % de su valor de diseño. No afecta a la velocidad del ventilador, las aperturas de compuertas ni los puntos de diseño de las rejillas. El rango válido del modelo es de 0 a 150 %.","Every node in this network has zero demand, and the profile multiplier scales nodal demands only — so every hour below is the same operating point. Give at least one node a demand, or tick \"profile also drives fan speed\", to make the profile mean anything.":"Todos los nodos de esta red tienen demanda cero, y el multiplicador de perfil solo escala las demandas nodales — por lo que cada hora de abajo corresponde al mismo punto de funcionamiento. Asigne demanda a al menos un nodo, o marque «el perfil también controla la velocidad del ventilador», para que el perfil tenga sentido.","Exactly 24 finite, non-negative multipliers are needed.":"Se necesitan exactamente 24 multiplicadores finitos y no negativos.","Exponent n":"Exponente n","Fan / system curve":"Curva ventilador/sistema","Fan [Pa]":"Ventilador [Pa]","Fan affinity law dp ~ n^2 applied to the two-point quadratic fan curve.":"Ley de afinidad del ventilador dp ~ n^2 aplicada a la curva cuadrática de ventilador de dos puntos.","Fan air power W":"Potencia aérea del ventilador W","Fan airflow":"Caudal del ventilador","Fan and system curves":"Curvas del ventilador y del sistema","Fan discharge":"Descarga del ventilador","Fan flow m³/h":"Caudal del ventilador m³/h","Fan rated pressure must be below shutoff pressure; reverse flow and beyond-runout operation are extrapolations and are warned":"La presión nominal del ventilador debe ser inferior a la presión de cierre; el caudal inverso y el funcionamiento más allá del punto de fuga son extrapolaciones y se advierten","Fan rise Pa":"Elevación del ventilador Pa","Fan speed %":"Velocidad del ventilador %","Fan speed is held at the global factor; only nodal demand follows the profile.":"La velocidad del ventilador se mantiene en el factor global; solo la demanda nodal sigue el perfil.","Fan total pressure rise":"Elevación de presión total del ventilador","Fan Δp Pa":"Δp ventilador Pa","Fan, main duct, two tee arms, two dampers and two grilles between ambient and a room.":"Ventilador, conducto principal, dos brazos de te, dos compuertas y dos rejillas entre el ambiente exterior y un local.","Fan/system curve":"Curva ventilador/sistema","Fan:":"Ventilador:","Fans":"Ventiladores","Fit the drawing":"Ajustar el dibujo","Fixed gauge total-pressure boundary":"Contorno de presión total relativa fija","Fixed-pressure boundary":"Contorno de presión fija","Fixed-pressure node:  h = p / (rho g)":"Nodo de presión fija: h = p / (rho g)","Flow / flow at 100 % opening":"Caudal / caudal al 100 % de apertura","Flow m³/h":"Caudal m³/h","Flow vs current %":"Caudal vs actual %","Flow-following discharge path":"Trayecto de descarga que sigue el caudal","For every free node the solver enforces airflow continuity. For every component it enforces steady Bernoulli using gauge total pressure + elevation, fan pressure rise and signed total-pressure loss. Edge airflows and free-node gauge total pressures are solved simultaneously with a damped Newton method.":"Para cada nodo libre, el solucionador impone continuidad de caudal. Para cada componente, impone Bernoulli estacionario mediante la presión total relativa + la cota, la elevación de presión del ventilador y la pérdida de presión total con signo. Los caudales de arista y las presiones totales relativas de los nodos libres se resuelven simultáneamente con un método de Newton amortiguado.","Friction: f = 64/Re for Re <= 2000; Swamee-Jain f = 0.25/[log10(eps/(3.7 Dh) + 5.74/Re^0.9)]^2 for Re >= 4000; smoothstep blend between":"Fricción: f = 64/Re para Re <= 2000; Swamee-Jain f = 0,25/[log10(eps/(3,7 Dh) + 5,74/Re^0,9)]^2 para Re >= 4000; transición suavizada entre ambas","Gauge total pressure":"Presión total relativa","Gauge total pressure [Pa]":"Presión total relativa [Pa]","Global fan-speed factor":"Factor global de velocidad del ventilador","Global fan-speed factor must be between 40 and 120%.":"El factor global de velocidad del ventilador debe estar entre 40 y 120 %.","Grille":"Rejilla","Grille exponent n between 1 and 3":"Exponente n de la rejilla entre 1 y 3","Grille starvation threshold":"Umbral de desabastecimiento de rejilla","Grille:":"Rejilla:","Grille:  h_loss = (dp_design/(rho g)) (q/q_design)^n":"Rejilla: h_loss = (dp_design/(rho g)) (q/q_design)^n","Grilles":"Rejillas","H. Cross, \"Analysis of Flow in Networks of Conduits or Conductors\", Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936): the loop-correction method dQ = -sum(h)/sum(|dh/dQ|) used by the second solver.":"H. Cross, «Analysis of Flow in Networks of Conduits or Conductors», Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936): el método de corrección de malla dQ = -sum(h)/sum(|dh/dQ|) utilizado por el segundo solucionador.","Hagen-Poiseuille laminar friction f = 64/Re.":"Fricción laminar de Hagen-Poiseuille f = 64/Re.","Height":"Alto","Hide":"Ocultar","Highest v m/s":"v máxima m/s","Highest velocity":"Velocidad máxima","Hour":"Hora","Hourly VAV multipliers (24 values, comma separated)":"Multiplicadores horarios VAV (24 valores, separados por comas)","How it is solved":"Cómo se resuelve","Ignored":"Ignorado","Inherent c/c₁₀₀":"Intrínseca c/c₁₀₀","Initial residual is not finite.":"El residuo inicial no es finito.","Installed":"Instalada","Installed q/q₁₀₀":"Instalada q/q₁₀₀","Invalid component ID.":"ID de componente no válido.","Invalid network file":"Archivo de red no válido","Invalid node ID.":"ID de nodo no válido.","It solves a duct network in steady state: you draw nodes and join them with ducts, tee/fitting arms, dampers, grilles and fans, then press Solve network. For every free node the solver enforces airflow continuity, and for every component it enforces steady Bernoulli using gauge total pressure plus elevation, fan pressure rise and signed total-pressure loss. Component airflows and free-node gauge total pressures are solved simultaneously by a damped Newton method.\n\nStart from the example network in the panel above, or pick a tool and click the canvas. Every network needs at least one fixed-pressure node in each connected part.":"Resuelve una red de conductos en régimen estacionario: usted dibuja nodos y los une con conductos, brazos de te/accesorio, compuertas, rejillas y ventiladores, y después pulsa Resolver red. Para cada nodo libre, el solucionador impone continuidad de caudal, y para cada componente impone Bernoulli estacionario mediante la presión total relativa más la cota, la elevación de presión del ventilador y la pérdida de presión total con signo. Los caudales de los componentes y las presiones totales relativas de los nodos libres se resuelven simultáneamente mediante un método de Newton amortiguado.\n\nEmpiece por la red de ejemplo del panel de arriba, o elija una herramienta y haga clic en el lienzo. Cada red necesita al menos un nodo de presión fija en cada parte conexa.","Jacobian is singular":"El jacobiano es singular","Junction losses must be entered as tee/fitting arms with an explicit K; they are not derived from geometry or split ratio.":"Las pérdidas de unión deben introducirse como brazos de te/accesorio con un K explícito; no se derivan de la geometría ni de la relación de reparto.","Kinematic viscosity":"Viscosidad cinemática","Kinematic viscosity must be positive.":"La viscosidad cinemática debe ser positiva.","Length":"Longitud","Linear conductance":"Conductancia lineal","Load example network":"Cargar red de ejemplo","Load factor must be between 0 and 150%.":"El factor de carga debe estar entre 0 y 150 %.","Load profile cancelled.":"Perfil de carga cancelado.","Load profile failed:":"Error en el perfil de carga:","Loads three same-origin scripts beside the page — site-disclaimer.js, diagram-common.js and diagram-compute.classic.js (the classic build of the shared compute runtime). Nothing else is fetched, no third-party host is contacted, and nothing about the duct network the user draws is transmitted anywhere: every solve and every sweep runs in this browser, on the main thread or in same-origin Blob Workers created from diagram-compute.classic.js.":"Carga tres scripts del mismo origen junto a la página — site-disclaimer.js, diagram-common.js y diagram-compute.classic.js (la compilación clásica del entorno de cálculo compartido). No se obtiene nada más, no se contacta con ningún host de terceros, y nada sobre la red de conductos que dibuja el usuario se transmite a ningún sitio: cada resolución y cada barrido se ejecutan en este navegador, en el hilo principal o en Workers Blob del mismo origen creados a partir de diagram-compute.classic.js.","Local speed":"Velocidad local","Loss [Pa]":"Pérdida [Pa]","Main duct":"Conducto principal","Max v in swept ducts m/s":"v máx. en conductos barridos m/s","Max v m/s":"v máx. m/s","Minor-loss ΣK":"Pérdida singular ΣK","Model each tee run/branch arm separately with its own K.":"Modele cada brazo de paso/derivación de te por separado con su propio K.","Model limits":"Límites del modelo","Monte-Carlo":"Monte Carlo","Monte-Carlo cancelled.":"Monte Carlo cancelado.","Monte-Carlo failed:":"Error en Monte Carlo:","Multiplier":"Multiplicador","Multiplies the local speed of every fan, and enters the fan curve squared through the affinity law dp ~ n². The model is stated for 40 to 120 %; the VAV load profile clamps its own fan tracking to the same range.":"Multiplica la velocidad local de cada ventilador, y entra al cuadrado en la curva del ventilador mediante la ley de afinidad dp ~ n². El modelo se define para 40 a 120 %; el perfil de carga VAV limita su propio seguimiento del ventilador al mismo rango.","N-1 blockage":"Bloqueo N-1","N-1 branch blockage":"Bloqueo de rama N-1","N-1 branch blockage — grille starvation":"Bloqueo de rama N-1 — desabastecimiento de rejilla","N-1 screen cancelled.":"Cribado N-1 cancelado.","N-1 screen failed:":"Error en el cribado N-1:","Name":"Nombre","Network editor":"Editor de red","Network file":"Archivo de red","Network file is too large (5 MB limit).":"El archivo de red es demasiado grande (límite de 5 MB).","Network file is too large for this editor (max 1000 nodes / 3000 components).":"El archivo de red es demasiado grande para este editor (máx. 1000 nodos / 3000 componentes).","Network loaded. Press Solve network.":"Red cargada. Pulse Resolver red.","Newton iterations":"Iteraciones de Newton","Newton line search failed.":"Error en la búsqueda de línea de Newton.","No Monte-Carlo sample solved.":"No se resolvió ninguna muestra de Monte Carlo.","No airflow/return path from fan discharge to a fixed-pressure boundary.":"No hay trayecto de caudal/retorno desde la descarga del ventilador hasta un contorno de presión fija.","No authority sweep generated.":"No se generó ningún barrido de autoridad.","No curve generated.":"No se generó ninguna curva.","No pressure profile generated.":"No se generó ningún perfil de presión.","No sizing combination solved.":"No se resolvió ninguna combinación de dimensionado.","No sweep has run for this network yet. Each button above solves the network many times; the fan / system curve is now the same kind of sweep.":"Todavía no se ha ejecutado ningún barrido para esta red. Cada botón de arriba resuelve la red muchas veces; la curva ventilador/sistema es ahora el mismo tipo de barrido.","No sweep has run for this network yet. Each button in the input column solves the network many times; the fan / system curve is the same kind of sweep.":"Todavía no se ha ejecutado ningún barrido para esta red. Cada botón de la columna de entrada resuelve la red muchas veces; la curva ventilador/sistema es el mismo tipo de barrido.","Nodal demand":"Demanda nodal","Node":"Nodo","Node continuity (free nodes):  SUM_in q - SUM_out q - demand * load_factor = 0":"Continuidad nodal (nodos libres): SUM_in q - SUM_out q - demand * load_factor = 0","Node results":"Resultados del nodo","Node Δp a−b Pa":"Nodo Δp a−b Pa","Nodes and edges must be arrays.":"Los nodos y las aristas deben ser arrays.","None":"Ninguno","Nonlinear unknowns":"Incógnitas no lineales","Not solved":"No resuelto","Not solved.":"No resuelto.","Not solved. Press Solve network.":"No resuelto. Pulse Resolver red.","Nothing generated yet.":"Todavía no se ha generado nada.","Nothing is solved, so no result, export or sweep is available until the network validates.":"No se ha resuelto nada, por lo que no hay resultado, exportación ni barrido disponibles hasta que la red sea válida.","Nothing selected":"Nada seleccionado","Nothing to cancel; this sweep cannot be interrupted without the shared runtime.":"Nada que cancelar; este barrido no se puede interrumpir sin el entorno de ejecución compartido.","Nothing to sample. Give the duct roughness a sigma above 0 (the network needs ducts with non-zero roughness), or the grilles a sigma, or the dampers an opening sd.":"Nada que muestrear. Asigne a la rugosidad del conducto un sigma superior a 0 (la red necesita conductos con rugosidad distinta de cero), o un sigma a las rejillas, o una de de apertura a las compuertas.","One duct solve is always on the main thread and is unchanged from the audited build. Repeated solves — the six sweeps — go to the shared compute runtime, which moves them into Workers only when there are enough cases to pay for a round trip. The badge states which backend last ran, why, and whether a Worker case was checked against the same case solved here.":"Una única resolución de conducto siempre está en el hilo principal y no ha cambiado respecto a la compilación auditada. Las resoluciones repetidas — los seis barridos — pasan al entorno de cálculo compartido, que solo las traslada a Workers cuando hay suficientes casos para rentabilizar un viaje de ida y vuelta. La insignia indica qué backend se ejecutó por última vez, por qué, y si se comprobó un caso de Worker frente al mismo caso resuelto aquí.","Open duct-network JSON file":"Abrir archivo JSON de red de conductos","Open network file":"Abrir archivo de red","Opening":"Apertura","Opening %":"Apertura %","Opening characteristic":"Característica de apertura","P.K. Swamee & A.K. Jain, \"Explicit equations for pipe-flow problems\", ASCE J. Hydraulics Div. 102(HY5) (1976) 657-664: f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, stated for 1e-6 <= eps/D <= 1e-2 and 5e3 <= Re <= 1e8.":"P.K. Swamee & A.K. Jain, «Explicit equations for pipe-flow problems», ASCE J. Hydraulics Div. 102(HY5) (1976) 657-664: f = 0,25/[log10(eps/(3,7 D) + 5,74/Re^0,9)]^2, indicada para 1e-6 <= eps/D <= 1e-2 y 5e3 <= Re <= 1e8.","Pa (gauge)":"Pa (relativa)","Partial load 0 to 150 %, global fan speed 40 to 120 %":"Carga parcial de 0 a 150 %, velocidad global del ventilador de 40 a 120 %","Partial-load demand factor":"Factor de demanda en carga parcial","Positive component airflow follows its arrow.":"Un caudal de componente positivo sigue su flecha.","Positive demand removes airflow from the network at that node, negative demand injects it. It is scaled by the partial-load factor. A network with no demand at all is driven only by its fans and its boundary pressures.":"Una demanda positiva extrae caudal de la red en ese nodo, una demanda negativa lo inyecta. Se escala mediante el factor de carga parcial. Una red sin ninguna demanda está impulsada únicamente por sus ventiladores y sus presiones de contorno.","Potential [Pa]":"Potencial [Pa]","Pressure profile":"Perfil de presión","Pressure rise [Pa]":"Elevación de presión [Pa]","Profile also drives the global fan-speed factor (clamped to 40–120 %)":"El perfil también controla el factor global de velocidad del ventilador (limitado a 40–120 %)","Profile length":"Longitud del perfil","Rank correlation within family":"Correlación de rango dentro de la familia","Rated flow":"Caudal nominal","Rated pressure must be below the shutoff pressure.":"La presión nominal debe ser inferior a la presión de cierre.","Received":"Recibido","Rectangular":"Rectangular","Rectangular section:  A = W H,  Dh = 2 W H/(W + H);  circular:  A = pi D^2/4,  Dh = D":"Sección rectangular: A = W H, Dh = 2 W H/(W + H); circular: A = pi D^2/4, Dh = D","Reset":"Restablecer","Rise P5 Pa":"Elevación P5 Pa","Room / ambient":"Local / ambiente","Roughness":"Rugosidad","Run duct sizing":"Ejecutar dimensionado de conductos","Run load profile":"Ejecutar perfil de carga","Samples":"Muestras","Save network file":"Guardar archivo de red","Save network file writes the drawing, the air state and the load factors as a tools.petrov.re/duct-network/v1 JSON document, and Open network file reads one back. This is the editor document, not the calculation record: the shared bar’s JSON export is the record and cannot be loaded back into the editor, and the shared bar’s Copy link carries the same document inside a permalink.":"Guardar archivo de red escribe el dibujo, el estado del aire y los factores de carga como un documento JSON tools.petrov.re/duct-network/v1, y Abrir archivo de red vuelve a leer uno. Este es el documento del editor, no el registro de cálculo: la exportación JSON de la barra compartida es el registro y no se puede volver a cargar en el editor, y Copiar enlace de la barra compartida transporta el mismo documento dentro de un enlace permanente.","Scaled residual":"Residuo escalado","Screening limits":"Límites de cribado","Seasonal swing (8760 h only)":"Variación estacional (solo 8760 h)","Section":"Sección","Seed":"Semilla","Select":"Seleccionar","Select a damper first":"Seleccione primero una compuerta","Select a damper, then run the authority sweep.":"Seleccione una compuerta y después ejecute el barrido de autoridad.","Select a fan first":"Seleccione primero un ventilador","Select a fan on the drawing first.":"Seleccione primero un ventilador en el dibujo.","Select drags nodes and picks an element to edit. Node adds a node where you click on empty canvas. The five component tools each want two clicks: the start node, then the end node. Positive component airflow follows the arrow, so the direction you draw in is the sign convention for that component.":"Seleccionar arrastra nodos y elige un elemento para editarlo. Nodo añade un nodo donde hace clic en el lienzo vacío. Las cinco herramientas de componente requieren cada una dos clics: el nodo inicial y después el nodo final. Un caudal de componente positivo sigue la flecha, por lo que el sentido en que dibuja es el convenio de signos de ese componente.","Selection":"Selección","Set target flow on at least one damper":"Establezca un caudal objetivo en al menos una compuerta","Shared compute runtime: starting…":"Entorno de cálculo compartido: iniciando…","Show":"Mostrar","Shutoff total pressure":"Presión total de cierre","Sizes mm":"Medidas mm","Solve network":"Resolver red","Solve the network first.":"Resuelva primero la red.","Solved simultaneously for all component airflows and free-node gauge total pressures by a damped Newton method with a numerical Jacobian":"Resuelto simultáneamente para todos los caudales de componentes y las presiones totales relativas de los nodos libres mediante un método de Newton amortiguado con jacobiano numérico","Solver failed:":"Error del solucionador:","Specific air power W/(m³/s)":"Potencia aérea específica W/(m³/s)","Starved grilles":"Rejillas desabastecidas","Total pressure rise at rated flow":"Aumento de presión total al caudal nominal","Steady state, incompressible, single phase; constant air properties":"Régimen estacionario, incompresible, monofásico; propiedades del aire constantes","Steady-state incompressible airflow networks":"Redes de caudal de aire incompresible en régimen estacionario","Supply junction":"Unión de impulsión","Swamee-Jain is published for 1e-6 <= eps/Dh <= 1e-2 and 5e3 <= Re <= 1e8; it differs from the Colebrook root by up to about 3 % over that range":"Swamee-Jain está publicada para 1e-6 <= eps/Dh <= 1e-2 y 5e3 <= Re <= 1e8; difiere de la raíz de Colebrook hasta en un 3 % aproximadamente en ese rango","Sweep cancelled.":"Barrido cancelado.","Swept surface m²":"Superficie barrida m²","System curve requires positive solved airflow through the selected fan.":"La curva del sistema requiere un caudal resuelto positivo a través del ventilador seleccionado.","THE ACCURACY BOUND IS VOID FOR AT LEAST ONE TALLY.":"LA COTA DE PRECISIÓN ES NULA PARA AL MENOS UN RECUENTO.","Tee / fitting":"Te / accesorio","Tee / fitting arm:":"Brazo de te/accesorio:","Tee / fitting arm:  h_loss = K v^2/(2 g) on that arm only, no friction term":"Brazo de te/accesorio: h_loss = K v^2/(2 g) solo en ese brazo, sin término de fricción","Tee and fitting arms":"Brazos de te y de accesorio","Tee branch A":"Derivación de te A","Tee run B":"Paso de te B","Tee/fitting":"Te/accesorio","The 24 hourly multipliers scale nodal demand hour by hour, optionally driving the global fan-speed factor with them, and the fan air power dp·Q is integrated over the period. This is air power: fan total efficiency, motor and drive losses and SFP are not part of this model, so no kW/(m³/s) figure is claimed.":"Los 24 multiplicadores horarios escalan la demanda nodal hora a hora, controlando opcionalmente con ellos el factor global de velocidad del ventilador, y la potencia aérea del ventilador dp·Q se integra a lo largo del período. Esto es potencia aérea: el rendimiento total del ventilador, las pérdidas del motor y de la transmisión y el SFP no forman parte de este modelo, por lo que no se afirma ninguna cifra en kW/(m³/s).","The Monte-Carlo sweep needs diagram-compute.classic.js — its Latin-hypercube design, its rank-correlation transform and its mergeable quantile tallies are the runtime’s, and this build will not swap in a different sampler and present it as the same experiment.":"El barrido Monte Carlo necesita diagram-compute.classic.js — su diseño de hipercubo latino, su transformación de correlación de rango y sus recuentos de cuantiles combinables pertenecen al entorno de ejecución, y esta compilación no sustituirá un muestreador distinto presentándolo como el mismo experimento.","The N-1 screen blocks ducts, tee arms and dampers one at a time; this network has none of them.":"El cribado N-1 bloquea conductos, brazos de te y compuertas de uno en uno; esta red no tiene ninguno de ellos.","The fan/system curve holds the airflow through the selected fan at each of 33 values and solves the whole network for each one, so the system curve is the network’s own resistance, not a fitted parabola. The total-pressure profile follows one representative path from the fan discharge to a fixed-pressure boundary. Select a fan on the drawing first.":"La curva ventilador/sistema mantiene el caudal a través del ventilador seleccionado en cada uno de 33 valores y resuelve toda la red para cada uno, de modo que la curva del sistema es la resistencia propia de la red, no una parábola ajustada. El perfil de presión total sigue un trayecto representativo desde la descarga del ventilador hasta un contorno de presión fija. Seleccione primero un ventilador en el dibujo.","The hardest-working ducts are re-sectioned to circular ducts from the EN 1506 / ISO 6580 nominal catalogue and every combination is solved. The ranking is specific air power — air power per m³/s actually delivered — because raw dp·Q rewards choking the duct: the fan sits on a curve, so a smaller duct moves the operating point back and the product falls while the building gets less air.":"Los conductos más exigidos se reconvierten a conductos circulares del catálogo nominal EN 1506 / ISO 6580 y se resuelve cada combinación. La clasificación se hace por potencia aérea específica — potencia aérea por m³/s realmente suministrado — porque el dp·Q bruto premia el estrangulamiento del conducto: el ventilador se sitúa sobre una curva, por lo que un conducto más pequeño retrasa el punto de funcionamiento y el producto cae mientras el edificio recibe menos aire.","The hourly VAV profile needs exactly 24 finite, non-negative multipliers.":"El perfil VAV horario necesita exactamente 24 multiplicadores finitos y no negativos.","The intact-network baseline case did not solve, so nothing can be compared against it.":"El caso de referencia de la red intacta no se resolvió, por lo que no hay nada con lo que compararlo.","The load profile reports fan energy; this network has no fan.":"El perfil de carga informa de la energía del ventilador; esta red no tiene ventilador.","The network document":"El documento de red","The profile also drives the global fan-speed factor, clamped to the tool’s own 40–120 % range.":"El perfil también controla el factor global de velocidad del ventilador, limitado al propio rango de 40–120 % de la herramienta.","The selected damper is swept from 10 % to 100 % open in 1 % steps, each step a full network solve, and its installed characteristic is compared with its own inherent law. The reported authority is the ratio dp(100 %)/dp(10 %) — an upper bound on the usual open/closed authority, because a fully shut damper makes the quadratic branch equation singular in this formulation.":"La compuerta seleccionada se barre del 10 % al 100 % de apertura en pasos del 1 %, siendo cada paso una resolución completa de la red, y su característica instalada se compara con su propia ley intrínseca. La autoridad indicada es la relación dp(100 %)/dp(10 %) — una cota superior de la autoridad abierto/cerrado habitual, porque una compuerta totalmente cerrada hace singular la ecuación de rama cuadrática en esta formulación.","The selection inspector":"El inspector de selección","The shared interface layer (diagram-ui.js) did not load. Every input, the model, the drawing, the sweeps and every export still work; the page falls back to one plain column.":"La capa de interfaz compartida (diagram-ui.js) no se cargó. Cada entrada, el modelo, el dibujo, los barridos y cada exportación siguen funcionando; la página vuelve a una sola columna simple.","The velocity limit is the value the sweeps flag against; the starvation threshold is how far a grille’s airflow may fall below its intact-network value in the N-1 screen before that contingency counts as starving a grille.":"El límite de velocidad es el valor frente al que comparan los barridos; el umbral de desabastecimiento es cuánto puede caer el caudal de una rejilla por debajo de su valor en la red intacta en el cribado N-1 antes de que ese escenario cuente como desabastecimiento de una rejilla.","There is no airflow through this damper at 100 % opening, so an installed characteristic has no meaning.":"No hay caudal a través de esta compuerta al 100 % de apertura, por lo que una característica instalada no tiene sentido.","This network has no ducts to size.":"Esta red no tiene conductos que dimensionar.","This sweep needs diagram-compute.classic.js: its \"":"Este barrido necesita diagram-compute.classic.js: su \"","Topological fallback discharge path":"Trayecto de descarga alternativo topológico","Total + (ρ−ρo)gz Pa":"Total + (ρ−ρo)gz Pa","Total loss signed Pa":"Pérdida total con signo Pa","Total p Pa(g)":"p total Pa(man)","Total-pressure profile":"Perfil de presión total","Two-branch supply system":"Sistema de impulsión de dos ramas","Type":"Tipo","Unsupported duct-network schema version":"Versión de esquema de red de conductos no admitida","Use 0 Pa for room/outdoor ambient. Demand is scaled by the global load factor; negative demand injects air.":"Use 0 Pa para un local o el ambiente exterior. La demanda se escala mediante el factor de carga global; una demanda negativa inyecta aire.","VAV load profile":"Perfil de carga VAV","VAV load profile: every node in this network has zero demand and the profile multiplier scales nodal demands only, so every hour is the same operating point and the energy figure is one point multiplied by the number of hours.":"Perfil de carga VAV: todos los nodos de esta red tienen demanda cero y el multiplicador de perfil solo escala las demandas nodales, por lo que cada hora es el mismo punto de funcionamiento y la cifra de energía es un punto multiplicado por el número de horas.","Velocity and velocity pressure":"Velocidad y presión dinámica","Velocity limit":"Límite de velocidad","Velocity m/s":"Velocidad m/s","Velocity p Pa":"p dinámica Pa","W (air)":"W (aire)","W per m3/s delivered":"W por m3/s suministrado","What this tool does":"Qué hace esta herramienta","Whatever is selected on the drawing is edited here. Every edit throws the current solution away — the results dim and say so — because the answer belonged to the network as it was.":"Lo que esté seleccionado en el dibujo se edita aquí. Cada edición descarta la solución actual — los resultados se atenúan y lo indican — porque la respuesta pertenecía a la red tal como era.","Where the arithmetic runs":"Dónde se ejecuta el cálculo","Width":"Ancho","Worst drop %":"Peor caída %","a Worker case was checked against the same case solved on the main thread before any sweep was offered":"se comprobó un caso de Worker frente al mismo caso resuelto en el hilo principal antes de que se ofreciera ningún barrido","a design-point pressure-drop law scaled by opening; auto-balance changes opening, not the rated characteristic.":"una ley de pérdida de presión en el punto de diseño escalada por la apertura; el autoequilibrado cambia la apertura, no la característica nominal.","a user-supplied local-loss coefficient K applied to that arm; represent a multi-port junction by a node and one fitting edge per arm that needs an explicit K.":"un coeficiente de pérdida singular K proporcionado por el usuario, aplicado a ese brazo; represente una unión de varias vías mediante un nodo y una arista de accesorio por cada brazo que necesite un K explícito.","and 5·10":"y 5·10","arithmetic, and that rule is what governs on a platform whose libm rounds differently.":"aritmética, y esa regla es la que rige en una plataforma cuya libm redondea de forma distinta.","at opening limit:":"en el límite de apertura:","cancelled by the user":"cancelado por el usuario","cancelling…":"cancelando…","catalogue sizes tried)":"medidas de catálogo probadas)","central-difference Jacobian, the damped line search and the linear solve are all the":"jacobiano de diferencias centradas, la búsqueda de línea amortiguada y la resolución lineal son todos el","circular or rectangular Darcy–Weisbach; 64/Re laminar, Swamee–Jain turbulent friction and ΣK local losses. Swamee–Jain is an":"Darcy–Weisbach circular o rectangular; 64/Re laminar, fricción turbulenta Swamee–Jain y pérdidas singulares ΣK. Swamee–Jain es una","cubic metres per hour":"metros cúbicos por hora","damper design point":"punto de diseño de la compuerta","descending quadratic curve of fan total-pressure rise from shutoff pressure and one rated point, scaled by fan affinity laws.":"curva cuadrática descendente del aumento de presión total del ventilador desde la presión de cierre y un punto nominal, escalada mediante las leyes de afinidad del ventilador.","diagram-compute.classic.js did not load; sweeps run on the main thread and the Monte-Carlo sweep is unavailable because its Latin-hypercube design and its quantile tallies live in the runtime":"diagram-compute.classic.js no se cargó; los barridos se ejecutan en el hilo principal y el barrido Monte Carlo no está disponible porque su diseño de hipercubo latino y sus recuentos de cuantiles residen en el entorno de ejecución","diagram-compute.classic.js is absent, so the sweep ran as one blocking main-thread loop, exactly as v1 did":"diagram-compute.classic.js está ausente, por lo que el barrido se ejecutó como un único bucle bloqueante en el hilo principal, exactamente como hacía v1","dp = dp_design (Q/Q_design)^n, with the exponent n between 1 and 3 — 2 is the usual quadratic terminal. A grille here is a duct resistance only: no throw, no noise, no induction.":"dp = dp_design (Q/Q_design)^n, con el exponente n entre 1 y 3 — 2 es el valor cuadrático habitual. Aquí una rejilla es solo una resistencia de conducto: sin alcance, sin ruido, sin inducción.","duct network: the interface layer failed to start":"red de conductos: la capa de interfaz no pudo iniciarse","equal %":"igual %","equal percentage":"porcentaje igual","every case was evaluated in index order on one thread, each from a cold start":"cada caso se evaluó en orden de índice en un solo hilo, cada uno desde un arranque en frío","explicit approximation":"aproximación explícita","fan rated point":"punto nominal del ventilador","gate then bounds the result at roughly 1e-7 relative.":"umbral limita entonces el resultado a aproximadamente 1e-7 relativo.","grille design point":"punto de diseño de la rejilla","halts at a scaled residual of 2e-9, worth about 1e-7 relative) rather than by the":"se detiene en un residuo escalado de 2e-9, equivalente a unos 1e-7 relativo) en lugar de por el","kW (air)":"kW (aire)","kWh (air power dp*Q; no fan, motor or drive efficiency)":"kWh (potencia aérea dp*Q; sin rendimiento de ventilador, motor ni transmisión)","laminar friction":"fricción laminar","main thread":"hilo principal","m³/h, all fans":"m³/h, todos los ventiladores","no Worker pool could be created (":"no se pudo crear ningún grupo de Workers (","no result":"sin resultado","no runtime; one blocking main-thread loop":"sin entorno de ejecución; un bucle bloqueante en el hilo principal","no sweep has run yet; the interactive solve is always on the main thread":"todavía no se ha ejecutado ningún barrido; la resolución interactiva está siempre en el hilo principal","no sweep run":"ningún barrido ejecutado","none (diagram-compute.classic.js absent)":"ninguno (diagram-compute.classic.js ausente)","none: every recorded output reproduces bit for bit on this platform. What could":"ninguna: cada salida registrada se reproduce bit a bit en esta plataforma. Lo que podría","operating point":"punto de funcionamiento","p total [Pa]":"p total [Pa]","path taken here is the path the page took.":"camino seguido aquí es el camino que siguió la página.","preliminary assessment":"evaluación preliminar","round duct finite loss":"pérdida finita del conducto circular","s generic verbs are replaced by this tool":"verbos genéricos son sustituidos por esta herramienta","s page-level unit system defaults to":"sistema de unidades a nivel de página recurre por defecto a","s primary action for a compute:":"acción s, dampers and fans.":"Dibuje redes arbitrarias de conductos circulares o rectangulares con uniones, brazos de tes, rejillas, compuertas y ventiladores.","Draw arbitrary duct networks with circular or rectangular ducts, junction and tee-loss arms, grilles, dampers and fans. Solve steady airflow and pressure drops, plot the fan/system curve with operating point, balance dampers to target flows, and explore partial-load operation.":"Dibuje redes arbitrarias de conductos circulares o rectangulares con uniones, brazos de tes, rejillas, compuertas y ventiladores. Calcula caudales y pérdidas de presión estacionarios, curva ventilador/sistema con punto de trabajo, equilibrado de compuertas y funcionamiento a carga parcial.","Duct Network Solver (v2) — tools.petrov.re":"Solucionador de redes de conductos (v2) — tools.petrov.re","Teken willekeurige netwerken met ronde of rechthoekige luchtkanalen, aftakkingen/T-stukverliesarmen, roosters, kleppen en ventilatoren. Bereken stationaire debieten en drukverliezen, ventilator- en systeemcurve met werkpunt, klepbalancering en deellastbedrijf.":"Dibuje redes arbitrarias de conductos circulares o rectangulares con uniones, brazos de tes, rejillas, compuertas y ventiladores. Calcula caudales y pérdidas de presión estacionarios, curva ventilador/sistema con punto de trabajo, equilibrado de compuertas y funcionamiento a carga parcial.","Dessinez un réseau quelconque de conduits circulaires ou rectangulaires avec jonctions, bras de té, grilles, registres et ventilateurs.":"Dibuje redes arbitrarias de conductos circulares o rectangulares con uniones, brazos de tes, rejillas, compuertas y ventiladores.","Dessinez un réseau quelconque de conduits circulaires ou rectangulaires avec jonctions, bras de té, grilles, registres et ventilateurs. Calculez les débits et pertes de charge stationnaires, la courbe ventilateur/réseau et son point de fonctionnement, l’équilibrage des registres et la charge partielle.":"Dibuje redes arbitrarias de conduct ilibrado de compuertas y funcionamiento a carga parcial.","Fan":"Ventilador","fan":"ventilador","duct":"conducto","damper":"compuerta","grille":"rejilla","tee":"te","free":"libre","Steady solve:":"Cálculo estacionario:","System":"Sistema","idle":"inactivo","removes the selection.":"elimina la selección.","Grille Δp σ (lognormal)":"Δp de rejillas σ (lognormal)","Run Monte-Carlo":"Ejecutar Monte Carlo","linear":"lineal","Duct Network Solver (v2)":"Cálculo de red de conductos (v2)","Audited build 2026-08-09. Steady-state, incompressible and single-phase. Fluid properties are constant. Grilles are duct resistances only. Fan curves use shutoff pressure plus one rated point; reverse flow and operation beyond zero-head runout are extrapolations and are warned. Automatic balancing is an iterative damper-opening heuristic and cannot guarantee coupled or infeasible targets. The total-pressure profile follows one representative airflow path. Generic junction nodes have no unique cross-section, so static pressure is not recovered there; component velocity and velocity pressure are reported separately. Tee/fitting K values are inputs; they are not derived from ASHRAE/Idelchik geometry or split ratios. The dense browser solver refuses models above 600 nonlinear unknowns. No duct leakage, compressibility, acoustics, smoke transport, fan-efficiency map, stall/surge model, or transient control model is included.":"Versión auditada 2026-08-09. Estacionario, incompresible y monofásico. Las propiedades del fluido son constantes. Las rejillas son solo resistencias de la red. Las curvas de ventilador usan la presión a caudal nulo más un punto nominal; el caudal inverso y el funcionamiento más allá del punto de altura nula son extrapolaciones y se advierten. El equilibrado automático es una heurística iterativa sobre la apertura de las compuertas y no puede garantizar objetivos acoplados o inalcanzables. El perfil de presión total sigue un camino de flujo representativo. Los nodos de unión genéricos no tienen una sección única, por lo que allí no se determina la presión estática; la velocidad y la presión dinámica se dan por componente. Los valores K de tes y accesorios son datos de entrada; no se derivan de la geometría ASHRAE/Idelchik ni de las relaciones de reparto. El solucionador denso del navegador rechaza modelos de más de 600 incógnitas no lineales. No se incluyen fugas de conductos, compresibilidad, acústica, transporte de humo, mapa de rendimiento del ventilador, modelo de bombeo/desprendimiento ni control transitorio."};
const siteLang=()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q&&String(q).slice(0,2).toLowerCase()==='es')return'es'}catch(e){}try{if(localStorage.getItem('diagram_site_lang')==='es'||localStorage.getItem('diagram_lang')==='es')return'es'}catch(e){}return String(window.__diagramLang||'').slice(0,2).toLowerCase()};
if(siteLang()!=='es')return;
const setLang=()=>{if(window.Diagram&&typeof Diagram.setDocumentLang==='function')Diagram.setDocumentLang('es');else if(document.documentElement.lang!=='es')document.documentElement.lang='es'};setLang();if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setLang,{once:true});
const attrs=['placeholder','title','aria-label','alt'];
function tr(s){if(s==null)return s;const x=String(s);if(Object.prototype.hasOwnProperty.call(ES,x))return ES[x];const a=x.match(/^\s*/)[0],b=x.match(/\s*$/)[0],t=x.trim();if(Object.prototype.hasOwnProperty.call(ES,t))return a+ES[t]+b;const pz=t&&window.__dnPatterns?window.__dnPatterns.translate('es',t,ES):null;if(pz!=null)return a+pz+b;const lw=window.DiagramUI&&DiagramUI.current&&typeof DiagramUI.current.t==='function'?DiagramUI.current.t('learn'):null;if(lw&&t.indexOf(lw+': ')===0){const k=t.slice(lw.length+2);if(Object.prototype.hasOwnProperty.call(ES,k))return a+lw+': '+ES[k]+b}return x}
function node(n){if(!n)return;if(n.nodeType===3){const p=n.parentElement;if(p&&!/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(p.tagName)){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}return}if(n.nodeType!==1)return;if(/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(n.tagName))return;for(const a of attrs)if(n.hasAttribute(a)){const v=n.getAttribute(a),w=tr(v);if(w!==v)n.setAttribute(a,w)}if(n.tagName==='INPUT'&&/^(button|submit|reset)$/i.test(n.type||'')){const v=n.value,w=tr(v);if(w!==v)n.value=w}const tw=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let q;while(q=tw.nextNode())node(q);for(const e of n.querySelectorAll('*'))for(const a of attrs)if(e.hasAttribute(a)){const v=e.getAttribute(a),w=tr(v);if(w!==v)e.setAttribute(a,w)}}
const run=()=>{node(document.body);const tt=document.querySelector('title');if(tt)node(tt)};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')node(m.target);else if(m.type==='attributes'){const el=m.target,v=el.getAttribute(m.attributeName),w=tr(v);if(v!=null&&w!==v)el.setAttribute(m.attributeName,w)}else for(const n of m.addedNodes)node(n)}}).observe(document.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:attrs});
})();
