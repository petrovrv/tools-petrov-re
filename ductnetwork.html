(()=>{
'use strict';
const NL={"\" design (and, for the Monte-Carlo, its quantile tallies) live in the shared runtime, and this build will not substitute a different sampler and call it the same experiment.":"\" ontwerp (en, voor de Monte-Carlo-methode, de kwantielresultaten ervan) leven in de gedeelde runtime, en deze build zal geen andere sampler vervangen en dat hetzelfde experiment noemen.","% points":"% punten","% pts":"% pt","%-steps":"%-stappen","(hydraulic diameter now":"(hydraulische diameter nu","(unchanged from v1). Last runtime computation:":"(ongewijzigd t.o.v. v1). Laatste runtime-berekening:","), so it fell back to the main thread":"), dus is teruggevallen op de hoofdthread","), so sweeps stay on the main thread":"), dus blijven sweeps op de hoofdthread","); sweeps run on the main thread":"); sweeps lopen op de hoofdthread","); sweeps run on the main thread and the Monte-Carlo sweep is unavailable":"); sweeps lopen op de hoofdthread en de Monte-Carlo-sweep is niet beschikbaar","- (dp at 100% / dp at 10%; upper bound on open/closed authority)":"- (dp bij 100% / dp bij 10%; bovengrens voor open/dicht-autoriteit)","- (fraction of intact flow)":"- (fractie van het intacte debiet)","- (fraction of wide-open flow)":"- (fractie van het volledig open debiet)","- (fraction)":"- (fractie)","2000 < Re < 4000 is a numerical blend, not a resolved transition model":"2000 < Re < 4000 is een numerieke overgang, geen opgelost transitiemodel","24 h — one day":"24 u — één dag","8760 h — one year":"8760 u — één jaar","8760 hourly rows are summarised above rather than printed.":"8760 uurwaarden worden hierboven samengevat in plaats van afgedrukt.",": nothing in this payload maps onto the current selection.":": niets in deze payload komt overeen met de huidige selectie.","; ignored":"; genegeerd","; one Worker case was checked against the same case solved here and came back identical":"; één Worker-geval werd getoetst aan hetzelfde geval hier opgelost en kwam identiek terug","; over that box it differs from the Colebrook root by up to about 3% in f, and by more outside it. The 2000<Re<4000 blend is a numerical bridge, not a resolved transition model. Ducts running outside the published box are listed as a warning after each solve.":"; binnen dat bereik wijkt ze tot circa 3% in f af van de Colebrook-wortel, en daarbuiten meer. De overgang 2000<Re<4000 is een numerieke brug, geen opgelost transitiemodel. Kanalen die buiten het gepubliceerde bereik vallen worden na elke berekening als waarschuwing vermeld.","A Latin hypercube over duct roughness (lognormal, median 1), grille design pressure drop (lognormal, median 1) and damper opening (normal, in percentage points), with an optional rank correlation inside each family. Quantiles are DDSketch estimates with a stated error bound, not exact order statistics. Duct leakage is not sampled: this model has no leakage element, and inventing one as a nodal demand would be a different model, not an uncertainty.":"Een Latin hypercube over kanaalruwheid (lognormaal, mediaan 1), ontwerp-drukverlies van het rooster (lognormaal, mediaan 1) en smoorklepopening (normaal, in procentpunten), met een optionele rangcorrelatie binnen elke familie. Kwantielen zijn DDSketch-schattingen met een opgegeven foutgrens, geen exacte orde-statistieken. Kanaallekkage wordt niet bemonsterd: dit model heeft geen lekkage-element, en er één verzinnen als knoopvraag zou een ander model zijn, geen onzekerheid.","A arm":"A-arm","A damper":"A-smoorklep","A damper out":"A-smoorklep uit","A descending quadratic curve of fan total-pressure rise through the shutoff pressure and one rated point, scaled by the affinity laws with the local and global speed factors. The solver adds this rise to the gauge total pressure of the airflow, so the curve must be on the fan total-pressure basis; a catalogue static-pressure curve needs the fan outlet velocity pressure added before entry. Rated pressure must be below shutoff pressure. Reverse flow and operation beyond the zero-head runout are extrapolations of that quadratic and are warned after the solve.":"Een dalende kwadratische curve van de totale drukverhoging van de ventilator door de afsluitdruk en één nominaal punt, geschaald met de affiniteitswetten via de lokale en globale snelheidsfactor. De rekenkern telt deze verhoging op bij de manometrische totale druk van de luchtstroom, dus de curve moet op basis van de totale ventilatordruk zijn ingevoerd; bij een statische-drukcurve uit de catalogus moet eerst de dynamische druk aan de ventilatoruitlaat worden opgeteld. De nominale druk moet lager zijn dan de afsluitdruk. Terugstroming en werking voorbij het nulopvoer-eindpunt zijn extrapolaties van die kwadratische curve en worden na de berekening als waarschuwing gemeld.","A design-point pressure drop scaled by opening: dp = dp_design (q/q_design)² / c², with c = o for the linear conductance law and c = 50^(o−1) for equal percentage, where o is the opening as a fraction. Auto-balance changes the opening, never the rated characteristic. Set a balance target flow to include a damper in auto-balancing.":"Een ontwerppunt-drukverlies geschaald met de opening: dp = dp_design (q/q_design)² / c², met c = o voor de lineaire geleidingswet en c = 50^(o−1) voor gelijk-percentage, waarbij o de opening als fractie is. Automatisch balanceren wijzigt de opening, nooit de nominale karakteristiek. Stel een balanceerdoeldebiet in om een smoorklep in het automatisch balanceren op te nemen.","A fixed-pressure node fixes gauge total pressure at a low-velocity boundary (normally 0 Pa for room/outdoor ambient). Positive node demand removes airflow; negative demand injects it. Boundary pressures are gauge pressures relative to the outdoor air at the node elevation; with one air density inside and outside, the hydrostatic terms cancel, and buoyancy/stack effect from temperature-dependent density is not modelled.":"Een knoop met vaste druk legt de totale manometrische druk vast op een randvoorwaarde met lage snelheid (doorgaans 0 Pa voor ruimte/buitenlucht). Positieve knoopvraag onttrekt lucht; negatieve vraag voegt lucht toe. Randdrukken zijn manometrische drukken ten opzichte van de buitenlucht op de knoophoogte; met één luchtdichtheid binnen en buiten heffen de hydrostatische termen elkaar op, en het opdrijvings-/schoorsteeneffect door temperatuurafhankelijke dichtheid wordt niet gemodelleerd.","A fixed-pressure node fixes gauge total pressure at a low-velocity boundary — normally 0 Pa for a room or the outdoors. At least one is needed in every connected part of the network, otherwise the pressure level is undetermined and the solve is refused.":"Een knoop met vaste druk legt de totale manometrische druk vast op een randvoorwaarde met lage snelheid — doorgaans 0 Pa voor een ruimte of de buitenlucht. Er is er minstens één nodig in elk samenhangend deel van het net, anders is het drukniveau onbepaald en wordt de berekening geweigerd.","A grille":"A-rooster","A rename does not change a number, so the solution is kept.":"Een hernoeming verandert geen enkel getal, dus de oplossing blijft behouden.","A sweep is already running.":"Er loopt al een sweep.","A tee arm is a user-supplied local-loss coefficient K applied to that arm only, with no friction term. Represent a multi-port junction as one node plus one fitting edge per arm that needs an explicit K. The K values are inputs: they are not derived from ASHRAE or Idelchik geometry, and not from the split ratio.":"Een T-arm is een door de gebruiker opgegeven plaatselijke-verliescoëfficiënt K die enkel op die arm wordt toegepast, zonder wrijvingsterm. Stel een knooppunt met meerdere poorten voor als één knoop plus één hulpstukverbinding per arm die een expliciete K nodig heeft. De K-waarden zijn invoergegevens: ze worden niet afgeleid uit ASHRAE- of Idelchik-geometrie, en ook niet uit de splitsingsverhouding.","ASHRAE Handbook - Fundamentals, Duct Design: rectangular hydraulic diameter Dh = 2WH/(W+H); local loss dp = K rho v^2/2.":"ASHRAE Handbook - Fundamentals, Duct Design: hydraulische diameter rechthoekig kanaal Dh = 2WH/(W+H); plaatselijk verlies dp = K rho v^2/2.","Add at least one component.":"Voeg minstens één component toe.","Add at least two nodes.":"Voeg minstens twee knopen toe.","Air and load":"Lucht en belasting","Air density":"Luchtdichtheid","Air density 0.2 to 2 kg/m3":"Luchtdichtheid 0,2 tot 2 kg/m3","Air density must be 0.2–2 kg/m³.":"Luchtdichtheid moet 0,2–2 kg/m³ zijn.","Air power W":"Luchtvermogen W","Air state":"Luchttoestand","Airflow [m³/h]":"Debiet [m³/h]","All component airflows and all free-node gauge total pressures are unknowns in one system, solved by a damped Newton method with a numerically differentiated Jacobian and a dense Gauss–Jordan factorisation with partial pivoting. The stopping rule is a scaled residual of 2×10⁻⁹; if the iteration cap is reached first the result is reported as unconverged. The browser solver refuses models above 600 nonlinear unknowns.":"Alle componentdebieten en alle totale manometrische drukken van vrije knopen zijn onbekenden in één stelsel, opgelost met een gedempte Newton-methode met een numeriek gedifferentieerde Jacobiaan en een dichte Gauss-Jordan-factorisatie met gedeeltelijke spilkeuze. De stopregel is een geschaald residu van 2×10⁻⁹; wordt eerst de iteratielimiet bereikt, dan wordt het resultaat als niet-geconvergeerd gerapporteerd. De browseroplosser weigert modellen boven 600 niet-lineaire onbekenden.","Arm loss coefficient K":"Verliescoëfficiënt K van de arm","At most 600 nonlinear unknowns (components + free nodes)":"Maximaal 600 niet-lineaire onbekenden (componenten + vrije knopen)","Auto-balance dampers":"Smoorkleppen automatisch balanceren","Auto-balance moves the opening of every damper with a target above zero.":"Automatisch balanceren wijzigt de opening van elke smoorklep met een streefwaarde boven nul.","B arm":"B-arm","B damper":"B-smoorklep","B damper out":"B-smoorklep uit","B grille":"B-rooster","Balance target":"Balanceer-streefwaarde","Balancing failed:":"Balanceren mislukt:","Balancing is not meaningful at 0% load":"Balanceren heeft geen betekenis bij 0% belasting","Boundary +in m³/h":"Rand +in m³/h","Boundary [m³/h]":"Rand [m³/h]","Boundary conditions":"Randvoorwaarden","C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156: used only to quantify the Swamee-Jain scatter, never as the graded reference.":"C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156: enkel gebruikt om de spreiding van Swamee-Jain te kwantificeren, nooit als beoordeelde referentie.","Cancel sweep":"Sweep annuleren","Catalogue window ± steps (0 = all)":"Catalogusvenster ± stappen (0 = alle)","Circular":"Rond","Circular or rectangular Darcy–Weisbach: 64/Re below Re 2000, the Swamee–Jain explicit approximation above Re 4000, and a smoothstep blend between. Swamee–Jain is published for 10⁻⁶ ≤ eps/Dh ≤ 10⁻² and 5×10³ ≤ Re ≤ 10⁸; over that box it differs from the Colebrook root by up to about 3 % in f, and by more outside it. Ducts running outside the published box are listed as a warning after each solve. Roughness is the absolute wall roughness in millimetres; ΣK collects the local losses on that run.":"Rond of rechthoekig Darcy–Weisbach: 64/Re onder Re 2000, de expliciete Swamee–Jain-benadering boven Re 4000, en een smoothstep-overgang ertussen. Swamee–Jain is gepubliceerd voor 10⁻⁶ ≤ eps/Dh ≤ 10⁻² en 5×10³ ≤ Re ≤ 10⁸; binnen dat bereik wijkt ze tot circa 3% in f af van de Colebrook-wortel, en daarbuiten meer. Kanalen die buiten het gepubliceerde bereik vallen worden na elke berekening als waarschuwing vermeld. Ruwheid is de absolute wandruwheid in millimeter; ΣK verzamelt de plaatselijke verliezen van die run.","Click a node or a component on the drawing to edit it, or pick a tool and click the canvas to create one.":"Klik op een knoop of component in de tekening om te bewerken, of kies een gereedschap en klik op het canvas om er één te maken.","Click empty canvas to add a node.":"Klik op leeg canvas om een knoop toe te voegen.","Click junction node, then arm node to add a tee/fitting loss arm.":"Klik op de knooppuntknoop, daarna op de armknoop om een T-stuk-/hulpstukverliesarm toe te voegen.","Click start node, then end node to add a damper.":"Klik op de startknoop, daarna op de eindknoop om een smoorklep toe te voegen.","Click start node, then end node to add a duct.":"Klik op de startknoop, daarna op de eindknoop om een kanaal toe te voegen.","Click start node, then end node to add a grille.":"Klik op de startknoop, daarna op de eindknoop om een rooster toe te voegen.","Component":"Component","Component closed":"Component gesloten","Component energy:  h_a + z_a (1 - rho_out/rho) - h_b - z_b (1 - rho_out/rho) + h_fan(q) - h_loss(q) = 0, with h = p_total_gauge/(rho g), gauge relative to outdoor air at the node elevation, rho_out = rho":"Componentenergie: h_a + z_a (1 - rho_out/rho) - h_b - z_b (1 - rho_out/rho) + h_fan(q) - h_loss(q) = 0, met h = p_total_gauge/(rho g), rho_out = rho","Component results":"Componentresultaten","Component velocity is the airflow divided by the flow area, and velocity pressure is ½ rho v². Generic junction nodes have no unique cross-section, so static pressure is not recovered at a node: velocity and velocity pressure are reported per component instead. The velocity limit in Screening limits is what the N-1, profile and sizing sweeps compare against.":"De componentsnelheid is het debiet gedeeld door de doorstroomoppervlakte, en de snelheidsdruk is ½ rho v². Algemene knooppuntknopen hebben geen eigen doorsnede, dus statische druk wordt niet teruggerekend bij een knoop: snelheid en snelheidsdruk worden in plaats daarvan per component gerapporteerd. De snelheidsgrens in Screeninggrenzen is waaraan de N-1-, profiel- en dimensioneringssweeps toetsen.","Components":"Componenten","Compute":"Berekenen","Could not sweep a usable authority curve.":"Kon geen bruikbare autoriteitscurve doorlopen.","Could not sweep a usable system curve.":"Kon geen bruikbare systeemcurve doorlopen.","Curves":"Curven","Damper":"Smoorklep","Damper authority":"Smoorklepautoriteit","Damper flow m³/h":"Smoorklepdebiet m³/h","Damper opening 0.1 % to 100 %":"Smoorklepopening 0,1% tot 100%","Damper opening [%]":"Smoorklepopening [%]","Damper opening sd (normal)":"Smoorklepopening sd (normaal)","Damper:":"Smoorklep:","Damper:  h_loss = (dp_design/(rho g)) (q/q_design)^2 / c^2,  c = o (linear) or 50^(o-1) (equal percentage), o = opening/100":"Smoorklep: h_loss = (dp_design/(rho g)) (q/q_design)^2 / c^2, c = o (lineair) of 50^(o-1) (gelijk-percentage), o = opening/100","Dampers":"Smoorkleppen","Delete":"Verwijderen","Delete selected":"Selectie verwijderen","Delete the selection":"Verwijder de selectie","Demand [m³/h]":"Vraag [m³/h]","Demand m³/h":"Vraag m³/h","Demand, positive out":"Vraag, positief = uit","Density and kinematic viscosity are constant everywhere and for the whole solve. Density converts head to pressure and scales every loss; viscosity only enters through the Reynolds number, and therefore only through the friction factor of ducts. 1.204 kg/m³ and 1.5×10⁻⁵ m²/s are dry air at about 20 °C and one atmosphere.":"Dichtheid en kinematische viscositeit zijn overal en voor de hele berekening constant. Dichtheid zet opvoerhoogte om in druk en schaalt elk verlies; viscositeit komt enkel binnen via het Reynoldsgetal, en dus enkel via de wrijvingsfactor van kanalen. 1,204 kg/m³ en 1,5×10⁻⁵ m²/s zijn droge lucht bij circa 20 °C en één atmosfeer.","Design flow":"Ontwerpdebiet","Design m³/h":"Ontwerp m³/h","Design Δp":"Ontwerp-Δp","Diameter":"Diameter","Direction:":"Richting:","Drag nodes. Select an element to edit it.":"Sleep knopen. Selecteer een element om te bewerken.","Draw":"Tekenen","Draw a network, or load the example, then press Solve network.":"Teken een net, of laad het voorbeeld, en klik dan op Net oplossen.","Draw and solve arbitrary air-duct networks with ducts, junction/tee arms, grilles, dampers and fans. Steady-state airflow, gauge total pressure, fan/system curves and damper balancing.":"Teken en los willekeurige luchtkanaalnetten op met kanalen, knooppunt-/T-armen, roosters, smoorkleppen en ventilatoren. Stationair debiet, totale manometrische druk, ventilator-/systeemcurven en smoorklepbalancering.","Drawing tools":"Tekengereedschap","Duct":"Kanaal","Duct internal checks failed":"Interne controles van het kanaal mislukt","Duct network drawing canvas":"Tekencanvas voor kanaalnet","Duct roughness σ (lognormal)":"Kanaalruwheid σ (lognormaal)","Duct sizing":"Kanaaldimensionering","Duct sizing cancelled.":"Kanaaldimensionering geannuleerd.","Duct sizing failed:":"Kanaaldimensionering mislukt:","Duct sizing is ranked by specific air power (air power per m3/s delivered), not by raw air power: with a fan on a curve, a smaller duct lowers the product dp*Q while delivering less air, so the raw figure rewards choking. Each swept duct is replaced by a circular duct of the catalogue size under test, so a rectangular duct is re-sectioned, and cost is represented only by the swept surface area pi*D*L.":"Kanaaldimensionering wordt gerangschikt op specifiek luchtvermogen (luchtvermogen per geleverde m3/s), niet op ruw luchtvermogen: met een ventilator op een curve verlaagt een kleiner kanaal het product dp*Q terwijl er minder lucht geleverd wordt, zodat het ruwe cijfer smoren beloont. Elk doorlopen kanaal wordt vervangen door een cirkelvormig kanaal van de geteste catalogusmaat, zodat een rechthoekig kanaal wordt herleid, en de kosten worden enkel weergegeven door het doorlopen oppervlak pi*D*L.","Duct sizing over the EN 1506 catalogue":"Kanaaldimensionering over de EN 1506-catalogus","Duct:":"Kanaal:","Duct:  h_loss = (f L/Dh + K) v^2/(2 g),  v = q/A,  Re = v Dh/nu":"Kanaal: h_loss = (f L/Dh + K) v^2/(2 g), v = q/A, Re = v Dh/nu","Ducts":"Kanalen","Ducts to size (highest v first)":"Te dimensioneren kanalen (hoogste v eerst)","EN 1506 nominal circular duct diameters, mm:":"EN 1506 nominale diameters rond kanaal, mm:","Each duct, tee arm and damper is removed in turn and the network re-solved from cold, to find which grilles starve when one branch closes. Contingencies that leave the network unsolvable are listed as such rather than being silently dropped.":"Elk kanaal, elke T-arm en elke smoorklep wordt om beurten verwijderd en het net opnieuw koud opgelost, om te bepalen welke roosters ondervoorzien raken wanneer één tak wegvalt. Uitvalscenario's waarbij het net onoplosbaar wordt, worden als dusdanig vermeld in plaats van stilzwijgend weggelaten.","Edge":"Rand","Edge results":"Randresultaten","Elevation":"Hoogteligging","Node pressures are gauge pressures relative to the outdoor air at the elevation of the node. The energy balance carries the hydrostatic term (rho − rho_out) g z, and the outdoor density rho_out equals the air density entered here, so the term is zero and elevation changes no airflow or pressure. Buoyancy and stack effect from temperature-dependent density are not modelled, so a tall riser carrying warm air is not represented by raising its nodes.":"Knoopdrukken zijn manometrische drukken ten opzichte van de buitenlucht op de hoogte van de knoop. De energiebalans bevat de hydrostatische term (rho − rho_out) g z, en de buitenluchtdichtheid rho_out is gelijk aan de hier ingevoerde luchtdichtheid, zodat de term nul is en de hoogteligging geen debiet of druk verandert. Opdrijving en het schoorsteeneffect door temperatuurafhankelijke dichtheid worden niet gemodelleerd, zodat een hoge stijgleiding met warme lucht niet correct wordt weergegeven door de hoogte van de knopen te verhogen.","Node pressures are gauge pressures relative to the outdoor air at each node elevation; with the outdoor density equal to the air density the hydrostatic terms cancel, and buoyancy and stack effect from temperature-dependent density are not modelled.":"Knoopdrukken zijn manometrische drukken ten opzichte van de buitenlucht op de hoogte van elke knoop; met een buitenluchtdichtheid gelijk aan de luchtdichtheid heffen de hydrostatische termen elkaar op, en opdrijving en het schoorsteeneffect door temperatuurafhankelijke dichtheid worden niet gemodelleerd.","Elevation m":"Hoogteligging m","Ensemble sweep results":"Resultaten van de ensemble-sweeps","Equal percentage (R=50)":"Gelijk percentage (R=50)","Equations":"Vergelijkingen","Every network needs at least one fixed-pressure node per connected component; ambient boundaries are normally 0 Pa gauge total pressure.":"Elk net heeft minstens één knoop met vaste druk nodig per samenhangend deelnet; omgevingsrandvoorwaarden zijn doorgaans 0 Pa totale manometrische druk.","Every nodal demand is multiplied by this factor before the solve, so 60 % means every extraction and injection runs at 60 % of its design value. It does not touch fan speed, damper openings or grille design points. The valid range of the model is 0 to 150 %.":"Elke knoopvraag wordt vóór de berekening met deze factor vermenigvuldigd, dus 60% betekent dat elke onttrekking en injectie op 60% van de ontwerpwaarde draait. Dit raakt niet aan ventilatortoerental, smoorklepopeningen of ontwerppunten van roosters. Het geldige bereik van het model is 0 tot 150%.","Every node in this network has zero demand, and the profile multiplier scales nodal demands only — so every hour below is the same operating point. Give at least one node a demand, or tick \"profile also drives fan speed\", to make the profile mean anything.":"Elke knoop in dit net heeft vraag nul, en de profielvermenigvuldiger schaalt enkel de knoopvraag — dus elk uur hieronder is hetzelfde werkpunt. Geef minstens één knoop een vraag, of vink \"profiel stuurt ook ventilatortoerental\" aan, om het profiel betekenis te geven.","Exactly 24 finite, non-negative multipliers are needed.":"Er zijn precies 24 eindige, niet-negatieve vermenigvuldigers nodig.","Exponent n":"Exponent n","Fan / system curve":"Ventilator-/systeemcurve","Fan [Pa]":"Ventilator [Pa]","Fan affinity law dp ~ n^2 applied to the two-point quadratic fan curve.":"Affiniteitswet ventilator dp ~ n^2 toegepast op de tweepunts-kwadratische ventilatorcurve.","Fan air power W":"Luchtvermogen ventilator W","Fan airflow":"Ventilatordebiet","Fan and system curves":"Ventilator- en systeemcurven","Fan discharge":"Ventilatoruitblaas","Fan flow m³/h":"Ventilatordebiet m³/h","Fan rated pressure must be below shutoff pressure; reverse flow and beyond-runout operation are extrapolations and are warned":"Nominale ventilatordruk moet lager zijn dan de afsluitdruk; terugstroming en werking voorbij het eindpunt zijn extrapolaties en worden gemeld","Fan rise Pa":"Drukopbouw ventilator Pa","Fan speed %":"Ventilatortoerental %","Fan speed is held at the global factor; only nodal demand follows the profile.":"Ventilatortoerental wordt vastgehouden op de globale factor; enkel de knoopvraag volgt het profiel.","Fan total pressure rise":"Totale drukopbouw ventilator","Fan Δp Pa":"Ventilator-Δp Pa","Fan, main duct, two tee arms, two dampers and two grilles between ambient and a room.":"Ventilator, hoofdkanaal, twee T-armen, twee smoorkleppen en twee roosters tussen buitenlucht en een ruimte.","Fan/system curve":"Ventilator-/systeemcurve","Fan:":"Ventilator:","Fans":"Ventilatoren","Fit the drawing":"Tekening passend maken","Fixed gauge total-pressure boundary":"Randvoorwaarde vaste totale manometrische druk","Fixed-pressure boundary":"Randvoorwaarde vaste druk","Fixed-pressure node:  h = p / (rho g)":"Knoop met vaste druk: h = p / (rho g)","Flow / flow at 100 % opening":"Debiet / debiet bij 100% opening","Flow m³/h":"Debiet m³/h","Flow vs current %":"Debiet vs huidig %","Flow-following discharge path":"Debiet-volgend uitblaastraject","For every free node the solver enforces airflow continuity. For every component it enforces steady Bernoulli using gauge total pressure + elevation, fan pressure rise and signed total-pressure loss. Edge airflows and free-node gauge total pressures are solved simultaneously with a damped Newton method.":"Voor elke vrije knoop legt de oplosser debietcontinuïteit op. Voor elke component legt hij stationaire Bernoulli op met totale manometrische druk + hoogteligging, drukopbouw van de ventilator en getekend totaaldrukverlies. Randdebieten en totale manometrische drukken van vrije knopen worden simultaan opgelost met een gedempte Newton-methode.","Friction: f = 64/Re for Re <= 2000; Swamee-Jain f = 0.25/[log10(eps/(3.7 Dh) + 5.74/Re^0.9)]^2 for Re >= 4000; smoothstep blend between":"Wrijving: f = 64/Re voor Re <= 2000; Swamee-Jain f = 0,25/[log10(eps/(3,7 Dh) + 5,74/Re^0,9)]^2 voor Re >= 4000; smoothstep-overgang ertussen","Gauge total pressure":"Totale manometrische druk","Gauge total pressure [Pa]":"Totale manometrische druk [Pa]","Global fan-speed factor":"Globale ventilatortoerentalfactor","Global fan-speed factor must be between 40 and 120%.":"Globale ventilatortoerentalfactor moet tussen 40 en 120% liggen.","Grille":"Rooster","Grille exponent n between 1 and 3":"Roosterexponent n tussen 1 en 3","Grille starvation threshold":"Ondervoorzieningsdrempel rooster","Grille:":"Rooster:","Grille:  h_loss = (dp_design/(rho g)) (q/q_design)^n":"Rooster: h_loss = (dp_design/(rho g)) (q/q_design)^n","Grilles":"Roosters","H. Cross, \"Analysis of Flow in Networks of Conduits or Conductors\", Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936): the loop-correction method dQ = -sum(h)/sum(|dh/dQ|) used by the second solver.":"H. Cross, \"Analysis of Flow in Networks of Conduits or Conductors\", Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936): de luscorrectiemethode dQ = -sum(h)/sum(|dh/dQ|) gebruikt door de tweede oplosser.","Hagen-Poiseuille laminar friction f = 64/Re.":"Hagen-Poiseuille laminaire wrijving f = 64/Re.","Height":"Hoogte","Hide":"Verbergen","Highest v m/s":"Hoogste v m/s","Highest velocity":"Hoogste snelheid","Hour":"Uur","Hourly VAV multipliers (24 values, comma separated)":"Uurlijkse VAV-vermenigvuldigers (24 waarden, komma-gescheiden)","How it is solved":"Hoe het wordt opgelost","Ignored":"Genegeerd","Inherent c/c₁₀₀":"Inherent c/c₁₀₀","Initial residual is not finite.":"Initieel residu is niet eindig.","Installed":"Geïnstalleerd","Installed q/q₁₀₀":"Geïnstalleerd q/q₁₀₀","Invalid component ID.":"Ongeldige component-ID.","Invalid network file":"Ongeldig netbestand","Invalid node ID.":"Ongeldige knoop-ID.","It solves a duct network in steady state: you draw nodes and join them with ducts, tee/fitting arms, dampers, grilles and fans, then press Solve network. For every free node the solver enforces airflow continuity, and for every component it enforces steady Bernoulli using gauge total pressure plus elevation, fan pressure rise and signed total-pressure loss. Component airflows and free-node gauge total pressures are solved simultaneously by a damped Newton method.\n\nStart from the example network in the panel above, or pick a tool and click the canvas. Every network needs at least one fixed-pressure node in each connected part.":"Het lost een kanaalnet stationair op: u tekent knopen en verbindt ze met kanalen, T-stuk-/hulpstukarmen, smoorkleppen, roosters en ventilatoren, en klikt dan op Net oplossen. Voor elke vrije knoop legt de oplosser debietcontinuïteit op, en voor elke component legt hij stationaire Bernoulli op met totale manometrische druk plus hoogteligging, drukopbouw van de ventilator en getekend totaaldrukverlies. Componentdebieten en totale manometrische drukken van vrije knopen worden simultaan opgelost met een gedempte Newton-methode.\n\nStart vanuit het voorbeeldnet in het paneel hierboven, of kies een gereedschap en klik op het canvas. Elk net heeft minstens één knoop met vaste druk nodig in elk samenhangend deel.","Jacobian is singular":"Jacobiaan is singulier","Junction losses must be entered as tee/fitting arms with an explicit K; they are not derived from geometry or split ratio.":"Knooppuntverliezen moeten ingevoerd worden als T-stuk-/hulpstukarmen met een expliciete K; ze worden niet afgeleid uit geometrie of splitsingsverhouding.","Kinematic viscosity":"Kinematische viscositeit","Kinematic viscosity must be positive.":"Kinematische viscositeit moet positief zijn.","Length":"Lengte","Linear conductance":"Lineaire geleiding","Load example network":"Voorbeeldnet laden","Load factor must be between 0 and 150%.":"Belastingsfactor moet tussen 0 en 150% liggen.","Load profile cancelled.":"Belastingsprofiel geannuleerd.","Load profile failed:":"Belastingsprofiel mislukt:","Loads three same-origin scripts beside the page — site-disclaimer.js, diagram-common.js and diagram-compute.classic.js (the classic build of the shared compute runtime). Nothing else is fetched, no third-party host is contacted, and nothing about the duct network the user draws is transmitted anywhere: every solve and every sweep runs in this browser, on the main thread or in same-origin Blob Workers created from diagram-compute.classic.js.":"Laadt naast de pagina drie scripts van dezelfde oorsprong — site-disclaimer.js, diagram-common.js en diagram-compute.classic.js (de klassieke build van de gedeelde rekenruntime). Er wordt niets anders opgehaald, geen enkele derde host wordt gecontacteerd, en niets over het door de gebruiker getekende kanaalnet wordt ergens naartoe verzonden: elke berekening en elke sweep loopt in deze browser, op de hoofdthread of in Blob Workers van dezelfde oorsprong, aangemaakt vanuit diagram-compute.classic.js.","Local speed":"Lokale snelheid","Loss [Pa]":"Verlies [Pa]","Main duct":"Hoofdkanaal","Max v in swept ducts m/s":"Max. v in doorlopen kanalen m/s","Max v m/s":"Max. v m/s","Minor-loss ΣK":"Plaatselijk verlies ΣK","Model each tee run/branch arm separately with its own K.":"Modelleer elke T-stuk-doorloop-/aftakarm afzonderlijk met een eigen K.","Model limits":"Modelgrenzen","Monte-Carlo":"Monte-Carlo","Monte-Carlo cancelled.":"Monte-Carlo geannuleerd.","Monte-Carlo failed:":"Monte-Carlo mislukt:","Multiplier":"Vermenigvuldiger","Multiplies the local speed of every fan, and enters the fan curve squared through the affinity law dp ~ n². The model is stated for 40 to 120 %; the VAV load profile clamps its own fan tracking to the same range.":"Vermenigvuldigt de lokale snelheid van elke ventilator, en komt via de affiniteitswet dp ~ n² gekwadrateerd de ventilatorcurve binnen. Het model is opgegeven voor 40 tot 120%; het VAV-belastingsprofiel begrenst zijn eigen ventilatorsturing tot hetzelfde bereik.","N-1 blockage":"N-1-blokkering","N-1 branch blockage":"N-1-takblokkering","N-1 branch blockage — grille starvation":"N-1-takblokkering — ondervoorziening rooster","N-1 screen cancelled.":"N-1-screening geannuleerd.","N-1 screen failed:":"N-1-screening mislukt:","Name":"Naam","Network editor":"Neteditor","Network file":"Netbestand","Network file is too large (5 MB limit).":"Netbestand is te groot (limiet 5 MB).","Network file is too large for this editor (max 1000 nodes / 3000 components).":"Netbestand is te groot voor deze editor (max. 1000 knopen / 3000 componenten).","Network loaded. Press Solve network.":"Net geladen. Klik op Net oplossen.","Newton iterations":"Newton-iteraties","Newton line search failed.":"Newton-lijnzoekactie mislukt.","No Monte-Carlo sample solved.":"Geen enkele Monte-Carlo-steekproef opgelost.","No airflow/return path from fan discharge to a fixed-pressure boundary.":"Geen debiet-/retourpad van ventilatoruitblaas naar een randvoorwaarde met vaste druk.","No authority sweep generated.":"Geen autoriteitssweep gegenereerd.","No curve generated.":"Geen curve gegenereerd.","No pressure profile generated.":"Geen drukprofiel gegenereerd.","No sizing combination solved.":"Geen enkele dimensioneringscombinatie opgelost.","No sweep has run for this network yet. Each button above solves the network many times; the fan / system curve is now the same kind of sweep.":"Er is nog geen sweep uitgevoerd voor dit net. Elke knop hierboven lost het net vele malen op; de ventilator-/systeemcurve is nu hetzelfde soort sweep.","No sweep has run for this network yet. Each button in the input column solves the network many times; the fan / system curve is the same kind of sweep.":"Er is nog geen sweep uitgevoerd voor dit net. Elke knop in de invoerkolom lost het net vele malen op; de ventilator-/systeemcurve is hetzelfde soort sweep.","Nodal demand":"Knoopvraag","Node":"Knoop","Node continuity (free nodes):  SUM_in q - SUM_out q - demand * load_factor = 0":"Knoopcontinuïteit (vrije knopen): SUM_in q - SUM_out q - demand * load_factor = 0","Node results":"Knoopresultaten","Node Δp a−b Pa":"Knoop-Δp a−b Pa","Nodes and edges must be arrays.":"Knopen en randen moeten arrays zijn.","None":"Geen","Nonlinear unknowns":"Niet-lineaire onbekenden","Not solved":"Niet opgelost","Not solved.":"Niet opgelost.","Not solved. Press Solve network.":"Niet opgelost. Klik op Net oplossen.","Nothing generated yet.":"Nog niets gegenereerd.","Nothing is solved, so no result, export or sweep is available until the network validates.":"Er is niets opgelost, dus is geen resultaat, export of sweep beschikbaar totdat het net geldig is.","Nothing selected":"Niets geselecteerd","Nothing to cancel; this sweep cannot be interrupted without the shared runtime.":"Niets te annuleren; deze sweep kan niet onderbroken worden zonder de gedeelde runtime.","Nothing to sample. Give the duct roughness a sigma above 0 (the network needs ducts with non-zero roughness), or the grilles a sigma, or the dampers an opening sd.":"Niets te bemonsteren. Geef de kanaalruwheid een sigma boven 0 (het net heeft kanalen met niet-nul ruwheid nodig), of geef de roosters een sigma, of de smoorkleppen een sd voor de opening.","One duct solve is always on the main thread and is unchanged from the audited build. Repeated solves — the six sweeps — go to the shared compute runtime, which moves them into Workers only when there are enough cases to pay for a round trip. The badge states which backend last ran, why, and whether a Worker case was checked against the same case solved here.":"Eén kanaalberekening staat altijd op de hoofdthread en is ongewijzigd t.o.v. de geauditeerde build. Herhaalde berekeningen — de zes sweeps — gaan naar de gedeelde rekenruntime, die ze pas naar Workers verplaatst wanneer er genoeg gevallen zijn om een heen-en-terugreis te rechtvaardigen. Het label toont welke backend het laatst draaide, waarom, en of een Worker-geval getoetst werd aan hetzelfde geval hier opgelost.","Open duct-network JSON file":"JSON-bestand kanaalnet openen","Open network file":"Netbestand openen","Opening":"Opening","Opening %":"Opening %","Opening characteristic":"Openingskarakteristiek","P.K. Swamee & A.K. Jain, \"Explicit equations for pipe-flow problems\", ASCE J. Hydraulics Div. 102(HY5) (1976) 657-664: f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, stated for 1e-6 <= eps/D <= 1e-2 and 5e3 <= Re <= 1e8.":"P.K. Swamee & A.K. Jain, \"Explicit equations for pipe-flow problems\", ASCE J. Hydraulics Div. 102(HY5) (1976) 657-664: f = 0,25/[log10(eps/(3,7 D) + 5,74/Re^0,9)]^2, opgegeven voor 1e-6 <= eps/D <= 1e-2 en 5e3 <= Re <= 1e8.","Pa (gauge)":"Pa (manometrisch)","Partial load 0 to 150 %, global fan speed 40 to 120 %":"Deellast 0 tot 150%, globaal ventilatortoerental 40 tot 120%","Partial-load demand factor":"Deellast-vraagfactor","Positive component airflow follows its arrow.":"Positief componentdebiet volgt de pijl ervan.","Positive demand removes airflow from the network at that node, negative demand injects it. It is scaled by the partial-load factor. A network with no demand at all is driven only by its fans and its boundary pressures.":"Positieve vraag onttrekt debiet aan het net op die knoop, negatieve vraag voegt het toe. Ze wordt geschaald met de deellastfactor. Een net zonder enige vraag wordt enkel aangedreven door zijn ventilatoren en zijn randdrukken.","Potential [Pa]":"Potentiaal [Pa]","Pressure profile":"Drukprofiel","Pressure rise [Pa]":"Drukopbouw [Pa]","Profile also drives the global fan-speed factor (clamped to 40–120 %)":"Profiel stuurt ook de globale ventilatortoerentalfactor (begrensd tot 40–120%)","Profile length":"Profiellengte","Rank correlation within family":"Rangcorrelatie binnen familie","Rated flow":"Nominaal debiet","Rated pressure must be below the shutoff pressure.":"Nominale druk moet lager zijn dan de afsluitdruk.","Received":"Ontvangen","Rectangular":"Rechthoekig","Rectangular section:  A = W H,  Dh = 2 W H/(W + H);  circular:  A = pi D^2/4,  Dh = D":"Rechthoekige doorsnede: A = W H, Dh = 2 W H/(W + H); rond: A = pi D^2/4, Dh = D","Reset":"Resetten","Rise P5 Pa":"Opbouw P5 Pa","Room / ambient":"Ruimte / omgeving","Roughness":"Ruwheid","Run duct sizing":"Kanaaldimensionering uitvoeren","Run load profile":"Belastingsprofiel uitvoeren","Samples":"Steekproeven","Save network file":"Netbestand opslaan","Save network file writes the drawing, the air state and the load factors as a tools.petrov.re/duct-network/v1 JSON document, and Open network file reads one back. This is the editor document, not the calculation record: the shared bar’s JSON export is the record and cannot be loaded back into the editor, and the shared bar’s Copy link carries the same document inside a permalink.":"Netbestand opslaan schrijft de tekening, de luchttoestand en de belastingsfactoren weg als een tools.petrov.re/duct-network/v1 JSON-document, en Netbestand openen leest er één terug in. Dit is het editordocument, niet het berekeningsrecord: de JSON-export van de gedeelde balk is het record en kan niet teruggeladen worden in de editor, en Kopieer link van de gedeelde balk draagt hetzelfde document binnenin een permalink.","Scaled residual":"Geschaald residu","Screening limits":"Screeninggrenzen","Seasonal swing (8760 h only)":"Seizoensschommeling (enkel 8760 u)","Section":"Doorsnede","Seed":"Zaadwaarde","Select":"Selecteren","Select a damper first":"Selecteer eerst een smoorklep","Select a damper, then run the authority sweep.":"Selecteer een smoorklep, en voer dan de autoriteitssweep uit.","Select a fan first":"Selecteer eerst een ventilator","Select a fan on the drawing first.":"Selecteer eerst een ventilator in de tekening.","Select drags nodes and picks an element to edit. Node adds a node where you click on empty canvas. The five component tools each want two clicks: the start node, then the end node. Positive component airflow follows the arrow, so the direction you draw in is the sign convention for that component.":"Selecteren sleept knopen en kiest een element om te bewerken. Knoop voegt een knoop toe waar u op leeg canvas klikt. De vijf componentgereedschappen willen elk twee klikken: de startknoop, dan de eindknoop. Positief componentdebiet volgt de pijl, dus de richting waarin u tekent is de tekenconventie voor die component.","Selection":"Selectie","Set target flow on at least one damper":"Stel een streefdebiet in op minstens één smoorklep","Shared compute runtime: starting…":"Gedeelde rekenruntime: opstarten…","Show":"Tonen","Shutoff total pressure":"Totale afsluitdruk","Sizes mm":"Maten mm","Solve network":"Net oplossen","Solve the network first.":"Los eerst het net op.","Solved simultaneously for all component airflows and free-node gauge total pressures by a damped Newton method with a numerical Jacobian":"Simultaan opgelost voor alle componentdebieten en totale manometrische drukken van vrije knopen met een gedempte Newton-methode met numerieke Jacobiaan","Solver failed:":"Oplosser mislukt:","Specific air power W/(m³/s)":"Specifiek luchtvermogen W/(m³/s)","Starved grilles":"Ondervoorziene roosters","Total pressure rise at rated flow":"Totale drukverhoging bij nominaal debiet","Steady state, incompressible, single phase; constant air properties":"Stationair, onsamendrukbaar, enkelfasig; constante luchteigenschappen","Steady-state incompressible airflow networks":"Stationaire, onsamendrukbare luchtstroomnetten","Supply junction":"Toevoerknooppunt","Swamee-Jain is published for 1e-6 <= eps/Dh <= 1e-2 and 5e3 <= Re <= 1e8; it differs from the Colebrook root by up to about 3 % over that range":"Swamee-Jain is gepubliceerd voor 1e-6 <= eps/Dh <= 1e-2 en 5e3 <= Re <= 1e8; ze wijkt over dat bereik tot circa 3% af van de Colebrook-wortel","Sweep cancelled.":"Sweep geannuleerd.","Swept surface m²":"Doorlopen oppervlak m²","System curve requires positive solved airflow through the selected fan.":"Systeemcurve vereist een positief opgelost debiet door de geselecteerde ventilator.","THE ACCURACY BOUND IS VOID FOR AT LEAST ONE TALLY.":"DE NAUWKEURIGHEIDSGRENS IS ONGELDIG VOOR MINSTENS ÉÉN TELLING.","Tee / fitting":"T-stuk / hulpstuk","Tee / fitting arm:":"T-stuk-/hulpstukarm:","Tee / fitting arm:  h_loss = K v^2/(2 g) on that arm only, no friction term":"T-stuk-/hulpstukarm: h_loss = K v^2/(2 g) enkel op die arm, geen wrijvingsterm","Tee and fitting arms":"T-stuk- en hulpstukarmen","Tee branch A":"T-stuk aftak A","Tee run B":"T-stuk doorloop B","Tee/fitting":"T-stuk/hulpstuk","The 24 hourly multipliers scale nodal demand hour by hour, optionally driving the global fan-speed factor with them, and the fan air power dp·Q is integrated over the period. This is air power: fan total efficiency, motor and drive losses and SFP are not part of this model, so no kW/(m³/s) figure is claimed.":"De 24 uurlijkse vermenigvuldigers schalen de knoopvraag uur na uur, optioneel sturen ze ook de globale ventilatortoerentalfactor, en het luchtvermogen van de ventilator dp·Q wordt over de periode geïntegreerd. Dit is luchtvermogen: het totale ventilatorrendement, motor- en aandrijfverliezen en SFP maken geen deel uit van dit model, dus wordt geen kW/(m³/s)-cijfer beweerd.","The Monte-Carlo sweep needs diagram-compute.classic.js — its Latin-hypercube design, its rank-correlation transform and its mergeable quantile tallies are the runtime’s, and this build will not swap in a different sampler and present it as the same experiment.":"De Monte-Carlo-sweep heeft diagram-compute.classic.js nodig — het Latin-hypercube-ontwerp, de rangcorrelatietransformatie en de samenvoegbare kwantieltellingen behoren tot de runtime, en deze build zal geen andere sampler inwisselen en die als hetzelfde experiment voorstellen.","The N-1 screen blocks ducts, tee arms and dampers one at a time; this network has none of them.":"De N-1-screening blokkeert kanalen, T-armen en smoorkleppen één voor één; dit net heeft er geen van.","The fan/system curve holds the airflow through the selected fan at each of 33 values and solves the whole network for each one, so the system curve is the network’s own resistance, not a fitted parabola. The total-pressure profile follows one representative path from the fan discharge to a fixed-pressure boundary. Select a fan on the drawing first.":"De ventilator-/systeemcurve legt het debiet door de geselecteerde ventilator vast op elk van 33 waarden en lost voor elk het hele net op, zodat de systeemcurve de eigen weerstand van het net is, geen aangepaste parabool. Het totaaldrukprofiel volgt één representatief traject van de ventilatoruitblaas naar een randvoorwaarde met vaste druk. Selecteer eerst een ventilator in de tekening.","The hardest-working ducts are re-sectioned to circular ducts from the EN 1506 / ISO 6580 nominal catalogue and every combination is solved. The ranking is specific air power — air power per m³/s actually delivered — because raw dp·Q rewards choking the duct: the fan sits on a curve, so a smaller duct moves the operating point back and the product falls while the building gets less air.":"De zwaarst belaste kanalen worden herleid tot cirkelvormige kanalen uit de nominale catalogus EN 1506 / ISO 6580 en elke combinatie wordt opgelost. De rangschikking gebeurt op specifiek luchtvermogen — luchtvermogen per werkelijk geleverde m³/s — omdat het ruwe dp·Q het smoren van het kanaal beloont: de ventilator werkt op een curve, dus een kleiner kanaal verschuift het werkpunt terug en het product daalt terwijl het gebouw minder lucht krijgt.","The hourly VAV profile needs exactly 24 finite, non-negative multipliers.":"Het uurlijkse VAV-profiel heeft precies 24 eindige, niet-negatieve vermenigvuldigers nodig.","The intact-network baseline case did not solve, so nothing can be compared against it.":"Het referentiegeval van het intacte net werd niet opgelost, dus kan er niets tegen vergeleken worden.","The load profile reports fan energy; this network has no fan.":"Het belastingsprofiel rapporteert ventilatorenergie; dit net heeft geen ventilator.","The network document":"Het netdocument","The profile also drives the global fan-speed factor, clamped to the tool’s own 40–120 % range.":"Het profiel stuurt ook de globale ventilatortoerentalfactor, begrensd tot het eigen bereik van 40–120% van het gereedschap.","The selected damper is swept from 10 % to 100 % open in 1 % steps, each step a full network solve, and its installed characteristic is compared with its own inherent law. The reported authority is the ratio dp(100 %)/dp(10 %) — an upper bound on the usual open/closed authority, because a fully shut damper makes the quadratic branch equation singular in this formulation.":"De geselecteerde smoorklep wordt doorlopen van 10% tot 100% open in stappen van 1%, elke stap een volledige netberekening, en de geïnstalleerde karakteristiek wordt vergeleken met de eigen inherente wet. De gerapporteerde autoriteit is de verhouding dp(100%)/dp(10%) — een bovengrens voor de gebruikelijke open/dicht-autoriteit, omdat een volledig gesloten smoorklep de kwadratische takvergelijking singulier maakt in deze formulering.","The selection inspector":"De selectie-inspector","The shared interface layer (diagram-ui.js) did not load. Every input, the model, the drawing, the sweeps and every export still work; the page falls back to one plain column.":"De gedeelde interfacelaag (diagram-ui.js) werd niet geladen. Elke invoer, het model, de tekening, de sweeps en elke export blijven werken; de pagina valt terug op één eenvoudige kolom.","The velocity limit is the value the sweeps flag against; the starvation threshold is how far a grille’s airflow may fall below its intact-network value in the N-1 screen before that contingency counts as starving a grille.":"De snelheidsgrens is de waarde waaraan de sweeps toetsen; de ondervoorzieningsdrempel is hoever het debiet van een rooster onder zijn waarde in het intacte net mag zakken in de N-1-screening voordat dat uitvalscenario telt als het ondervoorzien van een rooster.","There is no airflow through this damper at 100 % opening, so an installed characteristic has no meaning.":"Er is geen debiet door deze smoorklep bij 100% opening, dus heeft een geïnstalleerde karakteristiek geen betekenis.","This network has no ducts to size.":"Dit net heeft geen kanalen om te dimensioneren.","This sweep needs diagram-compute.classic.js: its \"":"Deze sweep heeft diagram-compute.classic.js nodig: zijn \"","Topological fallback discharge path":"Topologisch terugvaltraject voor uitblaas","Total + (ρ−ρo)gz Pa":"Totaal + (ρ−ρo)gz Pa","Total loss signed Pa":"Getekend totaalverlies Pa","Total p Pa(g)":"Totaal p Pa(g)","Total-pressure profile":"Totaaldrukprofiel","Two-branch supply system":"Toevoersysteem met twee takken","Type":"Type","Unsupported duct-network schema version":"Niet-ondersteunde schemaversie kanaalnet","Use 0 Pa for room/outdoor ambient. Demand is scaled by the global load factor; negative demand injects air.":"Gebruik 0 Pa voor ruimte/buitenlucht. Vraag wordt geschaald met de globale belastingsfactor; negatieve vraag voegt lucht toe.","VAV load profile":"VAV-belastingsprofiel","VAV load profile: every node in this network has zero demand and the profile multiplier scales nodal demands only, so every hour is the same operating point and the energy figure is one point multiplied by the number of hours.":"VAV-belastingsprofiel: elke knoop in dit net heeft vraag nul en de profielvermenigvuldiger schaalt enkel de knoopvraag, dus elk uur is hetzelfde werkpunt en het energiecijfer is één punt vermenigvuldigd met het aantal uren.","Velocity and velocity pressure":"Snelheid en snelheidsdruk","Velocity limit":"Snelheidsgrens","Velocity m/s":"Snelheid m/s","Velocity p Pa":"Snelheidsdruk p Pa","W (air)":"W (lucht)","W per m3/s delivered":"W per geleverde m3/s","What this tool does":"Wat dit gereedschap doet","Whatever is selected on the drawing is edited here. Every edit throws the current solution away — the results dim and say so — because the answer belonged to the network as it was.":"Wat er ook geselecteerd is in de tekening, wordt hier bewerkt. Elke wijziging verwerpt de huidige oplossing — de resultaten worden gedimd weergegeven en vermelden dit — omdat het antwoord bij het net hoorde zoals het was.","Where the arithmetic runs":"Waar de berekening loopt","Width":"Breedte","Worst drop %":"Slechtste daling %","a Worker case was checked against the same case solved on the main thread before any sweep was offered":"een Worker-geval werd getoetst aan hetzelfde geval opgelost op de hoofdthread, voordat er enige sweep werd aangeboden","a design-point pressure-drop law scaled by opening; auto-balance changes opening, not the rated characteristic.":"een ontwerppunt-drukverlieswet geschaald met de opening; automatisch balanceren wijzigt de opening, niet de nominale karakteristiek.","a user-supplied local-loss coefficient K applied to that arm; represent a multi-port junction by a node and one fitting edge per arm that needs an explicit K.":"een door de gebruiker opgegeven plaatselijke-verliescoëfficiënt K die op die arm wordt toegepast; stel een knooppunt met meerdere poorten voor door een knoop en één hulpstukverbinding per arm die een expliciete K nodig heeft.","and 5·10":"en 5·10","arithmetic, and that rule is what governs on a platform whose libm rounds differently.":"berekening, en die regel is wat bepalend is op een platform waarvan de libm anders afrondt.","at opening limit:":"bij openingsgrens:","cancelled by the user":"geannuleerd door de gebruiker","cancelling…":"annuleren…","catalogue sizes tried)":"geteste catalogusmaten)","central-difference Jacobian, the damped line search and the linear solve are all the":"centrale-verschil-Jacobiaan, de gedempte lijnzoekactie en de lineaire oplossing zijn allemaal de","circular or rectangular Darcy–Weisbach; 64/Re laminar, Swamee–Jain turbulent friction and ΣK local losses. Swamee–Jain is an":"rond of rechthoekig Darcy–Weisbach; 64/Re laminair, Swamee–Jain turbulente wrijving en ΣK plaatselijke verliezen. Swamee–Jain is een","cubic metres per hour":"kubieke meter per uur","damper design point":"ontwerppunt smoorklep","descending quadratic curve of fan total-pressure rise from shutoff pressure and one rated point, scaled by fan affinity laws.":"dalende kwadratische curve van de totale drukverhoging van de ventilator vanuit de afsluitdruk en één nominaal punt, geschaald met de affiniteitswetten van de ventilator.","diagram-compute.classic.js did not load; sweeps run on the main thread and the Monte-Carlo sweep is unavailable because its Latin-hypercube design and its quantile tallies live in the runtime":"diagram-compute.classic.js werd niet geladen; sweeps lopen op de hoofdthread en de Monte-Carlo-sweep is niet beschikbaar omdat het Latin-hypercube-ontwerp en de kwantieltellingen ervan in de runtime leven","diagram-compute.classic.js is absent, so the sweep ran as one blocking main-thread loop, exactly as v1 did":"diagram-compute.classic.js ontbreekt, dus liep de sweep als één blokkerende lus op de hoofdthread, net zoals v1 deed","dp = dp_design (Q/Q_design)^n, with the exponent n between 1 and 3 — 2 is the usual quadratic terminal. A grille here is a duct resistance only: no throw, no noise, no induction.":"dp = dp_design (Q/Q_design)^n, met de exponent n tussen 1 en 3 — 2 is het gebruikelijke kwadratische eindpunt. Een rooster is hier enkel een kanaalweerstand: geen worp, laced by this tool":"generieke werkwoorden worden vervangen door dit gereedschap","s page-level unit system defaults to":"eenhedenstelsel op paginaniveau valt standaard terug op","s primary action for a compute:":"primaire actie voor een berekening:","steps either side":"stappen aan weerszijden","still separate the two is a C library whose exp/log/pow round differently in the last":"de twee nog scheiden, is een C-bibliotheek waarvan exp/log/pow in de laatste","tap target >= 44 px below md":"aanraakdoel >= 44 px onder md","technical exploration":"technische verkenning","tee K loss":"T-stuk K-verlies","the Worker case failed:":"het Worker-geval mislukte:","the Worker path did not reproduce the main-thread solve (":"het Worker-traject reproduceerde de oplossing van de hoofdthread niet (","the Worker path failed during this sweep (":"het Worker-traject mislukte tijdens deze sweep (","the complete steady-state network solve of this page for the network currently on the canvas: the same continuity and energy equations, the same duct/tee/damper/grille/fan component laws, and the same damped Newton iteration on scaled residuals. Charts, auto-balancing and the pressure-path search are not part of the export.":"de volledige stationaire netberekening van deze pagina voor het net dat momenteel op het canvas staat: dezelfde continuïteits- en energievergelijkingen, dezelfde componentwetten voor kanaal/T-stuk/smoorklep/rooster/ventilator, en dezelfde gedempte Newton-iteratie op geschaalde residuen. Grafieken, automatisch balanceren en de drukpadzoekactie maken geen deel uit van de export.","the damper is not in this network snapshot":"de smoorklep zit niet in deze netsnapshot","the network on the canvas is not solvable, so no comparison was possible":"het net op het canvas is niet oplosbaar, dus was geen vergelijking mogelijk","the shared runtime failed to start (":"de gedeelde runtime kon niet starten (","the shared runtime is loaded; sweeps run on the main thread":"de gedeelde runtime is geladen; sweeps lopen op de hoofdthread","this browser exposes no Worker; sweeps run on the main thread":"deze browser biedt geen Worker aan; sweeps lopen op de hoofdthread","to Colebrook–White, published for 10":"t.o.v. Colebrook–White, gepubliceerd voor 10","unknown sweep case kind:":"onbekend type sweepgeval:","unrecognised duct-network state payload":"onherkende toestandspayload kanaalnet","v2 build: the steady-state solve recorded above is the v1 tool’s solver unchanged — same residual assembly, same central-difference Jacobian, same dense Gauss-Jordan with partial pivoting, same damped Newton line search, same 600-unknown ceiling. What this build adds is repeated solves (fan/system curve, damper authority, N-1 branch blockage, Monte-Carlo, VAV load profile, duct sizing) on the shared compute runtime diagram-compute.classic.js. Damper auto-balancing is sequential by construction and was deliberately left on the main thread.":"v2-build: de hierboven opgetekende stationaire oplossing is de ongewijzigde oplosser van het v1-gereedschap — dezelfde residu-opbouw, dezelfde centrale-verschil-Jacobiaan, dezelfde dichte Gauss-Jordan met gedeeltelijke spilkeuze, dezelfde gedempte Newton-lijnzoekactie, hetzelfde plafond van 600 onbekenden. Wat deze build toevoegt zijn herhaalde berekeningen (ventilator-/systeemcurve, smoorklepautoriteit, N-1-takblokkering, Monte-Carlo, VAV-belastingsprofiel, kanaaldimensionering) op de gedeelde rekenruntime diagram-compute.classic.js. Automatisch balanceren van smoorkleppen is sequentieel van opzet en werd bewust op de hoofdthread gelaten.","worst relative difference":"slechtste relatieve verschil","· design":"· ontwerp","Δp at design flow, 100 %":"Δp bij ontwerpdebiet, 100%","Δp damper Pa":"Δp smoorklep Pa","Δp nodes [Pa]":"Δp knopen [Pa]","— THE ACCURACY BOUND IS VOID FOR AT LEAST ONE TALLY":"— DE NAUWKEURIGHEIDSGRENS IS ONGELDIG VOOR MINSTENS ÉÉN TELLING","Duct Network Solver":"Luchtkanaal-netwerkberekenaar","Draw arbitrary duct networks with circular or rectangular ducts, junction and tee-loss arms, grilles, dampers and fans.":"Teken willekeurige netwerken met ronde of rechthoekige luchtkanalen, aftakkingen/T-stukverliesarmen, roosters, kleppen en ventilatoren.","Draw arbitrary duct networks with circular or rectangular ducts, junction and tee-loss arms, grilles, dampers and fans. Solve steady airflow and pressure drops, plot the fan/system curve with operating point, balance dampers to target flows, and explore partial-load operation.":"Teken willekeurige netwerken met ronde of rechthoekige luchtkanalen, aftakkingen/T-stukverliesarmen, roosters, kleppen en ventilatoren. Bereken stationaire debieten en drukverliezen, ventilator- en systeemcurve met werkpunt, klepbalancering en deellastbedrijf.","Duct Network Solver (v2) — tools.petrov.re":"Luchtkanaal-netwerkberekenaar (v2) — tools.petrov.re","Teken willekeurige netwerken met ronde of rechthoekige luchtkanalen, aftakkingen/T-stukverliesarmen, roosters, kleppen en ventilatoren. Bereken stationaire debieten en drukverliezen, ventilator- en systeemcurve met werkpunt, klepbalancering en deellastbedrijf.":"Teken willekeurige netwerken met ronde of rechthoekige luchtkanalen, aftakkingen/T-stukverliesarmen, roosters, kleppen en ventilatoren. Bereken stationaire debieten en drukverliezen, ventilator- en systeemcurve met werkpunt, klepbalancering en deellastbedrijf.","Dessinez un réseau quelconque de conduits circulaires ou rectangulaires avec jonctions, bras de té, grilles, registres et ventilateurs.":"Teken willekeurige netwerken met ronde of rechthoekige luchtkanalen, aftakkingen/T-stukverliesarmen, roosters, kleppen en ventilatoren.","Dessinez un réseau quelconque de conduits circulaires ou rectangulaires avec jonctions, bras de té, grilles, registres et ventilateurs. Calculez les débits et pertes de charge stationnaires, la courbe ventilateur/réseau et son point de fonctionnement, l’équilibrage des registres et la charge partielle.":"Teken willekeurige netwerken met ronde of rechthoekige luchtkanalen, aftakkingen/T-stukverliesarmen, roosters, kleppen en ventilatoren. Bereken stationaire debieten en drukverliezen, ventilator- en systeemcurve met werkpunt, klepbalancering en deellastbedrijf.","Dibuje redes arbitrarias de conductos circulares o rectangulares con uniones, brazos de tes, rejillas, compuertas y ventiladores.":"Teken willekeurige netwerken met ronde of rechthoekige luchtkanalen, aftakkingen/T-stukverliesarmen, roosters, kleppen en ventilatoren.","Dibuje redes arbitrarias de conductos circulares o rectangulares con uniones, brazos de tes, rejillas, compuertas y ventiladores. Calcula caudales y pérdidas de presión estacionarios, curva ventilador/sistema con punto de trabajo, equilibrado de compuertas y funcionamiento a carga parcial.":"Teken willekeurige netwerken met ronde of rechthoekige luchtkanalen, aftakkingen/T-stukverliesarmen, roosters, kleppen en ventilatoren. Bereken stationaire debieten en drukverliezen, ventilator- en systeemcurve met werkpunt, klepbalancering en deellastbedrijf.","Narysuj dowolne sieci kanałów z kanałami okrągłymi lub prostokątnymi, ramionami przyłączeniowymi i trójnikowymi, kratkami, przepustnicami i wentylatorami.":"Teken willekeurige netwerken met ronde of rechthoekige luchtkanalen, aftakkingen/T-stukverliesarmen, roosters, kleppen en ventilatoren.","Narysuj dowolne sieci kanałów z kanałami okrągłymi lub prostokątnymi, ramionami rozdzielającymi i trójnikowymi, kratkami wentylacyjnymi, przepustnicami i wentylatorami. Oblicz ustalony strumień powietrza i spadki ciśnienia, wykreśl krzywą wentylatora/systemu z punktem pracy, zrównoważ przepustnice do docelowych przepływów i zbadaj pracę przy częściowym obciążeniu.":"Teken willekeurige netwerken met ronde of rechthoekige luchtkanalen, aftakkingen/T-stukverliesarmen, roosters, kleppen en ventilatoren. Bereken stationaire debieten en drukverliezen, ventilator- en systeemcurve met werkpunt, klepbalancering en deellastbedrijf.","Fan":"Ventilator","fan":"ventilator","duct":"kanaal","damper":"smoorklep","grille":"rooster","tee":"T-stuk","free":"vrij","Steady solve:":"Stationaire berekening:","System":"Systeem","idle":"inactief","removes the selection.":"verwijdert de selectie.","Grille Δp σ (lognormal)":"Rooster-Δp σ (lognormaal)","Run Monte-Carlo":"Monte-Carlo uitvoeren","linear":"lineair","Duct Network Solver (v2)":"Luchtkanaalnetberekening (v2)","Audited build 2026-08-09. Steady-state, incompressible and single-phase. Fluid properties are constant. Grilles are duct resistances only. Fan curves use shutoff pressure plus one rated point; reverse flow and operation beyond zero-head runout are extrapolations and are warned. Automatic balancing is an iterative damper-opening heuristic and cannot guarantee coupled or infeasible targets. The total-pressure profile follows one representative airflow path. Generic junction nodes have no unique cross-section, so static pressure is not recovered there; component velocity and velocity pressure are reported separately. Tee/fitting K values are inputs; they are not derived from ASHRAE/Idelchik geometry or split ratios. The dense browser solver refuses models above 600 nonlinear unknowns. No duct leakage, compressibility, acoustics, smoke transport, fan-efficiency map, stall/surge model, or transient control model is included.":"Geauditeerde build 2026-08-09. Stationair, onsamendrukbaar en enkelfasig. Stofeigenschappen zijn constant. Roosters zijn alleen kanaalweerstanden. Ventilatorcurven gebruiken de afsluitdruk plus één nominaal punt; terugstroming en werking voorbij het nulopvoer-eindpunt zijn extrapolaties en worden gemeld. Automatisch balanceren is een iteratieve heuristiek voor de klepopening en kan gekoppelde of onhaalbare streefwaarden niet garanderen. Het totaaldrukprofiel volgt één representatief stromingspad. Algemene verdeelknopen hebben geen eenduidige doorsnede, dus de statische druk wordt daar niet bepaald; snelheid en dynamische druk worden per component opgegeven. K-waarden van T-stukken en hulpstukken zijn invoer; ze worden niet afgeleid uit ASHRAE/Idelchik-geometrie of verdeelverhoudingen. De dichte browseroplosser weigert modellen met meer dan 600 niet-lineaire onbekenden. Kanaallekkage, samendrukbaarheid, akoestiek, rooktransport, een ventilatorrendementskaart, een stall/surge-model en transiënte regeling zijn niet opgenomen."};
const siteLang=()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q&&String(q).slice(0,2).toLowerCase()==='nl')return'nl'}catch(e){}try{if(localStorage.getItem('diagram_site_lang')==='nl'||localStorage.getItem('diagram_lang')==='nl')return'nl'}catch(e){}return String(window.__diagramLang||'').slice(0,2).toLowerCase()};

const setLang=()=>{if(window.Diagram&&typeof Diagram.setDocumentLang==='function')Diagram.setDocumentLang('nl');else if(document.documentElement.lang!=='nl')document.documentElement.lang='nl'};setLang();if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setLang,{once:true});
const attrs=['placeholder','title','aria-label','alt'];
function tr(s){if(s==null)return s;const x=String(s);if(Object.prototype.hasOwnProperty.call(NL,x))return NL[x];const a=x.match(/^\s*/)[0],b=x.match(/\s*$/)[0],t=x.trim();if(Object.prototype.hasOwnProperty.call(NL,t))return a+NL[t]+b;const pz=t&&window.__dnPatterns?window.__dnPatterns.translate('nl',t,NL):null;if(pz!=null)return a+pz+b;const lw=window.DiagramUI&&DiagramUI.current&&typeof DiagramUI.current.t==='function'?DiagramUI.current.t('learn'):null;if(lw&&t.indexOf(lw+': ')===0){const k=t.slice(lw.length+2);if(Object.prototype.hasOwnProperty.call(NL,k))return a+lw+': '+NL[k]+b}return x}
function node(n){if(!n)return;if(n.nodeType===3){const p=n.parentElement;if(p&&!/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(p.tagName)){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}return}if(n.nodeType!==1)return;if(/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(n.tagName))return;for(const a of attrs)if(n.hasAttribute(a)){const v=n.getAttribute(a),w=tr(v);if(w!==v)n.setAttribute(a,w)}if(n.tagName==='INPUT'&&/^(button|submit|reset)$/i.test(n.type||'')){const v=n.value,w=tr(v);if(w!==v)n.value=w}const tw=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let q;while(q=tw.nextNode())node(q);for(const e of n.querySelectorAll('*'))for(const a of attrs)if(e.hasAttribute(a)){const v=e.getAttribute(a),w=tr(v);if(w!==v)e.setAttribute(a,w)}}
const run=()=>{node(document.body);const tt=document.querySelector('title');if(tt)node(tt)};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')node(m.target);else if(m.type==='attributes'){const el=m.target,v=el.getAttribute(m.attributeName),w=tr(v);if(v!=null&&w!==v)el.setAttribute(m.attributeName,w)}else for(const n of m.addedNodes)node(n)}}).observe(document.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:attrs});
})();
