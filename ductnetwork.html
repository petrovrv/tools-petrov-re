und kam identisch zurück","; over that box it differs from the Colebrook root by up to about 3% in f, and by more outside it. The 2000<Re<4000 blend is a numerical bridge, not a resolved transition model. Ducts running outside the published box are listed as a warning after each solve.":"; innerhalb dieses Bereichs weicht sie um bis zu etwa 3 % in f von der Colebrook-Wurzel ab, außerhalb mehr. Der Übergang 2000<Re<4000 ist eine numerische Brücke, kein aufgelöstes Übergangsmodell. Kanäle außerhalb des angegebenen Bereichs werden nach jeder Berechnung als Warnung aufgeführt.","A Latin hypercube over duct roughness (lognormal, median 1), grille design pressure drop (lognormal, median 1) and damper opening (normal, in percentage points), with an optional rank correlation inside each family. Quantiles are DDSketch estimates with a stated error bound, not exact order statistics. Duct leakage is not sampled: this model has no leakage element, and inventing one as a nodal demand would be a different model, not an uncertainty.":"Ein Latin Hypercube über Kanalrauheit (lognormal, Median 1), Auslegungs-Druckverlust des Luftdurchlasses (lognormal, Median 1) und Klappenöffnung (normal, in Prozentpunkten), mit optionaler Rangkorrelation innerhalb jeder Familie. Quantile sind DDSketch-Schätzungen mit angegebener Fehlerschranke, keine exakten Ordnungsstatistiken. Kanalleckage wird nicht simuliert: dieses Modell besitzt kein Leckage-Element, und eines als Knotenverbrauch zu erfinden wäre ein anderes Modell, keine Unsicherheit.","A arm":"A-Arm","A damper":"A-Klappe","A damper out":"A-Klappe aus","A descending quadratic curve of fan total-pressure rise through the shutoff pressure and one rated point, scaled by the affinity laws with the local and global speed factors. The solver adds this rise to the gauge total pressure of the airflow, so the curve must be on the fan total-pressure basis; a catalogue static-pressure curve needs the fan outlet velocity pressure added before entry. Rated pressure must be below shutoff pressure. Reverse flow and operation beyond the zero-head runout are extrapolations of that quadratic and are warned after the solve.":"Eine fallende quadratische Kennlinie der Totaldruckerhöhung des Ventilators durch den Abschaltdruck und einen Nennpunkt, skaliert über die Affinitätsgesetze mit dem lokalen und globalen Drehzahlfaktor. Der Löser addiert diese Erhöhung zum Gesamtdruck (Überdruck) der Strömung; die Kennlinie muss daher auf Basis des Ventilator-Totaldrucks eingegeben werden, und zu einer statischen Katalogkennlinie ist vorher der dynamische Druck am Ventilatoraustritt zu addieren. Der Nenndruck muss unter dem Abschaltdruck liegen. Rückströmung und Betrieb jenseits des Nullförderhöhen-Endpunkts sind Extrapolationen dieser Parabel und werden nach der Berechnung als Warnung gemeldet.","A design-point pressure drop scaled by opening: dp = dp_design (q/q_design)² / c², with c = o for the linear conductance law and c = 50^(o−1) for equal percentage, where o is the opening as a fraction. Auto-balance changes the opening, never the rated characteristic. Set a balance target flow to include a damper in auto-balancing.":"Ein Auslegungs-Druckverlust, skaliert mit der Öffnung: dp = dp_design (q/q_design)² / c², mit c = o für das lineare Leitwertgesetz und c = 50^(o−1) für gleichprozentig, wobei o die Öffnung als Anteil ist. Der Autoabgleich ändert die Öffnung, nie die Nennkennlinie. Zielvolumenstrom setzen, um eine Klappe in den Autoabgleich einzubeziehen.","A fixed-pressure node fixes gauge total pressure at a low-velocity boundary (normally 0 Pa for room/outdoor ambient). Positive node demand removes airflow; negative demand injects it. Boundary pressures are gauge pressures relative to the outdoor air at the node elevation; with one air density inside and outside, the hydrostatic terms cancel, and buoyancy/stack effect from temperature-dependent density is not modelled.":"Ein Knoten mit festem Druck legt den Gesamtdruck (Überdruck) an einer Randbedingung mit geringer Geschwindigkeit fest (normalerweise 0 Pa für Raum/Außenluft). Positiver Knotenverbrauch entzieht Volumenstrom; negativer Verbrauch speist ihn ein. Randdrücke sind Überdrücke gegenüber der Außenluft auf Knotenhöhe; bei einer Luftdichte innen und außen heben sich die hydrostatischen Terme auf, und der Auftriebs-/Kamineffekt durch temperaturabhängige Dichte wird nicht modelliert.","A fixed-pressure node fixes gauge total pressure at a low-velocity boundary — normally 0 Pa for a room or the outdoors. At least one is needed in every connected part of the network, otherwise the pressure level is undetermined and the solve is refused.":"Ein Knoten mit festem Druck legt den statischen Gesamtdruck (Überdruck) an einer Randbedingung mit geringer Geschwindigkeit fest — normalerweise 0 Pa für einen Raum oder die Außenluft. In jedem zusammenhängenden Teil des Netzes wird mindestens einer benötigt, sonst ist das Druckniveau unbestimmt und die Berechnung wird verweigert.","A grille":"A-Luftdurchlass","A rename does not change a number, so the solution is kept.":"Eine Umbenennung ändert keinen Zahlenwert, daher bleibt die Lösung erhalten.","A sweep is already running.":"Es läuft bereits ein Sweep.","A tee arm is a user-supplied local-loss coefficient K applied to that arm only, with no friction term. Represent a multi-port junction as one node plus one fitting edge per arm that needs an explicit K. The K values are inputs: they are not derived from ASHRAE or Idelchik geometry, and not from the split ratio.":"Ein T-Stück-Arm ist ein vom Benutzer vorgegebener Einzelverlustbeiwert K, der nur auf diesen Arm wirkt, ohne Reibungsanteil. Ein Mehrfachknoten wird als ein Knoten plus eine Formstückkante je Arm mit explizitem K dargestellt. Die K-Werte sind Eingabewerte: Sie werden weder aus ASHRAE- oder Idelchik-Geometrie noch aus dem Teilungsverhältnis abgeleitet.","ASHRAE Handbook - Fundamentals, Duct Design: rectangular hydraulic diameter Dh = 2WH/(W+H); local loss dp = K rho v^2/2.":"ASHRAE Handbook - Fundamentals, Duct Design: hydraulischer Durchmesser Rechteckkanal Dh = 2WH/(W+H); Einzelverlust dp = K rho v^2/2.","Add at least one component.":"Mindestens eine Komponente hinzufügen.","Add at least two nodes.":"Mindestens zwei Knoten hinzufügen.","Air and load":"Luft und Last","Air density":"Luftdichte","Air density 0.2 to 2 kg/m3":"Luftdichte 0,2 bis 2 kg/m3","Air density must be 0.2–2 kg/m³.":"Luftdichte muss 0,2–2 kg/m³ sein.","Air power W":"Luftleistung W","Air state":"Luftzustand","Airflow [m³/h]":"Volumenstrom [m³/h]","All component airflows and all free-node gauge total pressures are unknowns in one system, solved by a damped Newton method with a numerically differentiated Jacobian and a dense Gauss–Jordan factorisation with partial pivoting. The stopping rule is a scaled residual of 2×10⁻⁹; if the iteration cap is reached first the result is reported as unconverged. The browser solver refuses models above 600 nonlinear unknowns.":"Alle Komponenten-Volumenströme und alle Gesamtdrücke (Überdruck) der freien Knoten sind Unbekannte in einem gemeinsamen Gleichungssystem, gelöst mit einem gedämpften Newton-Verfahren mit numerisch differenzierter Jacobi-Matrix und einer dichten Gauß-Jordan-Faktorisierung mit Teilpivotisierung. Die Abbruchregel ist ein skaliertes Residuum von 2×10⁻⁹; wird zuerst die Iterationsgrenze erreicht, gilt das Ergebnis als nicht konvergiert. Der Browser-Solver verweigert Modelle über 600 nichtlinearen Unbekannten.","Arm loss coefficient K":"Verlustbeiwert K des Arms","At most 600 nonlinear unknowns (components + free nodes)":"Höchstens 600 nichtlineare Unbekannte (Komponenten + freie Knoten)","Auto-balance dampers":"Klappen automatisch abgleichen","Auto-balance moves the opening of every damper with a target above zero.":"Der Autoabgleich verändert die Öffnung jeder Klappe mit einem Zielwert über null.","B arm":"B-Arm","B damper":"B-Klappe","B damper out":"B-Klappe aus","B grille":"B-Luftdurchlass","Balance target":"Abgleichziel","Balancing failed:":"Abgleich fehlgeschlagen:","Balancing is not meaningful at 0% load":"Abgleich ist bei 0 % Last nicht sinnvoll","Boundary +in m³/h":"Randbedingung +ein m³/h","Boundary [m³/h]":"Randbedingung [m³/h]","Boundary conditions":"Randbedingungen","C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156: used only to quantify the Swamee-Jain scatter, never as the graded reference.":"C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156: dient nur zur Quantifizierung der Streuung von Swamee-Jain, niemals als bewertete Referenz.","Cancel sweep":"Sweep abbrechen","Catalogue window ± steps (0 = all)":"Katalogfenster ± Schritte (0 = alle)","Circular":"Rund","Circular or rectangular Darcy–Weisbach: 64/Re below Re 2000, the Swamee–Jain explicit approximation above Re 4000, and a smoothstep blend between. Swamee–Jain is published for 10⁻⁶ ≤ eps/Dh ≤ 10⁻² and 5×10³ ≤ Re ≤ 10⁸; over that box it differs from the Colebrook root by up to about 3 % in f, and by more outside it. Ducts running outside the published box are listed as a warning after each solve. Roughness is the absolute wall roughness in millimetres; ΣK collects the local losses on that run.":"Rund oder rechteckig, Darcy–Weisbach: 64/Re unterhalb Re 2000, die explizite Swamee–Jain-Näherung oberhalb Re 4000, dazwischen ein Smoothstep-Übergang. Swamee–Jain ist veröffentlicht für 10⁻⁶ ≤ eps/Dh ≤ 10⁻² und 5×10³ ≤ Re ≤ 10⁸; innerhalb dieses Bereichs weicht sie um bis zu etwa 3 % in f von der Colebrook-Wurzel ab, außerhalb mehr. Kanäle außerhalb des angegebenen Bereichs werden nach jeder Berechnung als Warnung aufgeführt. Rauheit ist die absolute Wandrauheit in Millimetern; ΣK sammelt die Einzelverluste dieses Laufs.","Click a node or a component on the drawing to edit it, or pick a tool and click the canvas to create one.":"Klicken Sie auf einen Knoten oder eine Komponente in der Zeichnung, um sie zu bearbeiten, oder wählen Sie ein Werkzeug und klicken Sie auf die Zeichenfläche, um eine neue zu erstellen.","Click empty canvas to add a node.":"Auf leere Zeichenfläche klicken, um einen Knoten hinzuzufügen.","Click junction node, then arm node to add a tee/fitting loss arm.":"Auf den Verzweigungsknoten klicken, dann auf den Armknoten, um einen T-Stück-/Formstück-Verlustarm hinzuzufügen.","Click start node, then end node to add a damper.":"Auf den Startknoten klicken, dann auf den Endknoten, um eine Klappe hinzuzufügen.","Click start node, then end node to add a duct.":"Auf den Startknoten klicken, dann auf den Endknoten, um einen Kanal hinzuzufügen.","Click start node, then end node to add a grille.":"Auf den Startknoten klicken, dann auf den Endknoten, um einen Luftdurchlass hinzuzufügen.","Component":"Komponente","Component closed":"Komponente geschlossen","Component energy:  h_a + z_a (1 - rho_out/rho) - h_b - z_b (1 - rho_out/rho) + h_fan(q) - h_loss(q) = 0, with h = p_total_gauge/(rho g), gauge relative to outdoor air at the node elevation, rho_out = rho":"Komponentenenergie: h_a + z_a (1 - rho_out/rho) - h_b - z_b (1 - rho_out/rho) + h_fan(q) - h_loss(q) = 0, mit h = p_total_gauge/(rho g), rho_out = rho","Component results":"Komponentenergebnisse","Component velocity is the airflow divided by the flow area, and velocity pressure is ½ rho v². Generic junction nodes have no unique cross-section, so static pressure is not recovered at a node: velocity and velocity pressure are reported per component instead. The velocity limit in Screening limits is what the N-1, profile and sizing sweeps compare against.":"Die Komponentengeschwindigkeit ist der Volumenstrom geteilt durch die Strömungsfläche, und der Geschwindigkeitsdruck ist ½ rho v². Allgemeine Verzweigungsknoten haben keinen eindeutigen Querschnitt, daher wird an einem Knoten kein statischer Druck ermittelt: Geschwindigkeit und Geschwindigkeitsdruck werden stattdessen je Komponente ausgegeben. Die Geschwindigkeitsgrenze in Screening-Grenzwerten ist, wogegen die N-1-, Profil- und Dimensionierungs-Sweeps vergleichen.","Components":"Komponenten","Compute":"Berechnen","Could not sweep a usable authority curve.":"Es konnte keine brauchbare Autoritätskurve ermittelt werden.","Could not sweep a usable system curve.":"Es konnte keine brauchbare Anlagenkennlinie ermittelt werden.","Curves":"Kennlinien","Damper":"Klappe","Damper authority":"Klappenautorität","Damper flow m³/h":"Klappenvolumenstrom m³/h","Damper opening 0.1 % to 100 %":"Klappenöffnung 0,1 % bis 100 %","Damper opening [%]":"Klappenöffnung [%]","Damper opening sd (normal)":"Klappenöffnung sd (normal)","Damper:":"Klappe:","Damper:  h_loss = (dp_design/(rho g)) (q/q_design)^2 / c^2,  c = o (linear) or 50^(o-1) (equal percentage), o = opening/100":"Klappe: h_loss = (dp_design/(rho g)) (q/q_design)^2 / c^2, c = o (linear) oder 50^(o-1) (gleichprozentig), o = Öffnung/100","Dampers":"Klappen","Delete":"Löschen","Delete selected":"Auswahl löschen","Delete the selection":"Die Auswahl löschen","Demand [m³/h]":"Verbrauch [m³/h]","Demand m³/h":"Verbrauch m³/h","Demand, positive out":"Verbrauch, positiv = aus","Density and kinematic viscosity are constant everywhere and for the whole solve. Density converts head to pressure and scales every loss; viscosity only enters through the Reynolds number, and therefore only through the friction factor of ducts. 1.204 kg/m³ and 1.5×10⁻⁵ m²/s are dry air at about 20 °C and one atmosphere.":"Dichte und kinematische Viskosität sind überall und für die gesamte Berechnung konstant. Die Dichte rechnet Förderhöhe in Druck um und skaliert jeden Verlust; die Viskosität geht nur über die Reynolds-Zahl ein, also nur über den Reibungsfaktor der Kanäle. 1,204 kg/m³ und 1,5×10⁻⁵ m²/s sind trockene Luft bei etwa 20 °C und einer Atmosphäre.","Design flow":"Auslegungsvolumenstrom","Design m³/h":"Auslegung m³/h","Design Δp":"Auslegungs-Δp","Diameter":"Durchmesser","Direction:":"Richtung:","Drag nodes. Select an element to edit it.":"Knoten ziehen. Element zum Bearbeiten auswählen.","Draw":"Zeichnen","Draw a network, or load the example, then press Solve network.":"Zeichnen Sie ein Netz oder laden Sie das Beispiel, und klicken Sie dann auf Netz lösen.","Draw and solve arbitrary air-duct networks with ducts, junction/tee arms, grilles, dampers and fans. Steady-state airflow, gauge total pressure, fan/system curves and damper balancing.":"Zeichnen und lösen Sie beliebige Luftkanalnetze mit Kanälen, Verzweigungs-/T-Stück-Armen, Luftdurchlässen, Klappen und Ventilatoren. Stationärer Volumenstrom, Gesamtdruck (Überdruck), Ventilator-/Anlagenkennlinien und Klappenabgleich.","Drawing tools":"Zeichenwerkzeuge","Duct":"Kanal","Duct internal checks failed":"Interne Kanalprüfungen fehlgeschlagen","Duct network drawing canvas":"Zeichenfläche für das Kanalnetz","Duct roughness σ (lognormal)":"Kanalrauheit σ (lognormal)","Duct sizing":"Kanaldimensionierung","Duct sizing cancelled.":"Kanaldimensionierung abgebrochen.","Duct sizing failed:":"Kanaldimensionierung fehlgeschlagen:","Duct sizing is ranked by specific air power (air power per m3/s delivered), not by raw air power: with a fan on a curve, a smaller duct lowers the product dp*Q while delivering less air, so the raw figure rewards choking. Each swept duct is replaced by a circular duct of the catalogue size under test, so a rectangular duct is re-sectioned, and cost is represented only by the swept surface area pi*D*L.":"Die Kanaldimensionierung wird nach spezifischer Luftleistung (Luftleistung je gelieferten m3/s) gereiht, nicht nach roher Luftleistung: Mit einem Ventilator auf einer Kennlinie senkt ein kleinerer Kanal das Produkt dp*Q, während weniger Luft geliefert wird, sodass die rohe Kennzahl das Drosseln belohnt. Jeder durchlaufene Kanal wird durch einen Rundkanal der geprüften Katalog-Nennweite ersetzt, sodass ein Rechteckkanal umgerechnet wird, und die Kosten werden nur durch die durchlaufene Mantelfläche pi*D*L dargestellt.","Duct sizing over the EN 1506 catalogue":"Kanaldimensionierung über den EN-1506-Katalog","Duct:":"Kanal:","Duct:  h_loss = (f L/Dh + K) v^2/(2 g),  v = q/A,  Re = v Dh/nu":"Kanal: h_loss = (f L/Dh + K) v^2/(2 g), v = q/A, Re = v Dh/nu","Ducts":"Kanäle","Ducts to size (highest v first)":"Zu dimensionierende Kanäle (höchstes v zuerst)","EN 1506 nominal circular duct diameters, mm:":"EN 1506 Nennweiten Rundkanal, mm:","Each duct, tee arm and damper is removed in turn and the network re-solved from cold, to find which grilles starve when one branch closes. Contingencies that leave the network unsolvable are listed as such rather than being silently dropped.":"Jeder Kanal, jeder T-Stück-Arm und jede Klappe wird der Reihe nach entfernt und das Netz erneut kalt gelöst, um zu ermitteln, welche Luftdurchlässe unterversorgt werden, wenn ein Strang ausfällt. Ausfallszenarien, bei denen das Netz unlösbar wird, werden als solche ausgewiesen statt stillschweigend übergangen.","Edge":"Kante","Edge results":"Kantenergebnisse","Elevation":"Höhenlage","Node pressures are gauge pressures relative to the outdoor air at the elevation of the node. The energy balance carries the hydrostatic term (rho − rho_out) g z, and the outdoor density rho_out equals the air density entered here, so the term is zero and elevation changes no airflow or pressure. Buoyancy and stack effect from temperature-dependent density are not modelled, so a tall riser carrying warm air is not represented by raising its nodes.":"Knotendrücke sind Überdrücke gegenüber der Außenluft auf der Höhe des jeweiligen Knotens. Die Energiebilanz enthält den hydrostatischen Term (rho − rho_out) g z; die Außenluftdichte rho_out ist gleich der hier eingegebenen Luftdichte, der Term ist also null und die Höhenlage ändert keinen Volumenstrom und keinen Druck. Auftrieb und Kamineffekt durch temperaturabhängige Dichte werden nicht modelliert, sodass ein hoher Steigstrang mit warmer Luft nicht dadurch abgebildet wird, dass man seine Knoten höher legt.","Node pressures are gauge pressures relative to the outdoor air at each node elevation; with the outdoor density equal to the air density the hydrostatic terms cancel, and buoyancy and stack effect from temperature-dependent density are not modelled.":"Knotendrücke sind Überdrücke gegenüber der Außenluft auf der Höhe jedes Knotens; bei einer Außenluftdichte gleich der Luftdichte heben sich die hydrostatischen Terme auf, und Auftrieb und Kamineffekt durch temperaturabhängige Dichte werden nicht modelliert.","Elevation m":"Höhenlage m","Ensemble sweep results":"Ergebnisse der Ensemble-Sweeps","Equal percentage (R=50)":"Gleichprozentig (R=50)","Equations":"Gleichungen","Every network needs at least one fixed-pressure node per connected component; ambient boundaries are normally 0 Pa gauge total pressure.":"Jedes Netz benötigt je zusammenhängendem Teilnetz mindestens einen Knoten mit festem Druck; Umgebungsrandbedingungen sind normalerweise 0 Pa Gesamtdruck (Überdruck).","Every nodal demand is multiplied by this factor before the solve, so 60 % means every extraction and injection runs at 60 % of its design value. It does not touch fan speed, damper openings or grille design points. The valid range of the model is 0 to 150 %.":"Jeder Knotenverbrauch wird vor der Berechnung mit diesem Faktor multipliziert, sodass 60 % bedeutet, dass jede Entnahme und Einspeisung mit 60 % ihres Auslegungswerts läuft. Ventilatordrehzahl, Klappenöffnungen und Auslegungspunkte der Luftdurchlässe bleiben unberührt. Der gültige Bereich des Modells ist 0 bis 150 %.","Every node in this network has zero demand, and the profile multiplier scales nodal demands only — so every hour below is the same operating point. Give at least one node a demand, or tick \"profile also drives fan speed\", to make the profile mean anything.":"Jeder Knoten in diesem Netz hat Verbrauch null, und der Profilfaktor skaliert nur den Knotenverbrauch — daher ist jede Stunde unten derselbe Betriebspunkt. Geben Sie mindestens einem Knoten einen Verbrauch, oder aktivieren Sie \"Profil steuert auch Ventilatordrehzahl\", damit das Profil eine Bedeutung erhält.","Exactly 24 finite, non-negative multipliers are needed.":"Es werden genau 24 endliche, nichtnegative Faktoren benötigt.","Exponent n":"Exponent n","Fan / system curve":"Ventilator-/Anlagenkennlinie","Fan [Pa]":"Ventilator [Pa]","Fan affinity law dp ~ n^2 applied to the two-point quadratic fan curve.":"Ventilator-Affinitätsgesetz dp ~ n^2, angewendet auf die quadratische Zweipunkt-Ventilatorkennlinie.","Fan air power W":"Luftleistung Ventilator W","Fan airflow":"Ventilatorvolumenstrom","Fan and system curves":"Ventilator- und Anlagenkennlinien","Fan discharge":"Ventilatoraustritt","Fan flow m³/h":"Ventilatorvolumenstrom m³/h","Fan rated pressure must be below shutoff pressure; reverse flow and beyond-runout operation are extrapolations and are warned":"Der Nenndruck des Ventilators muss unter dem Abschaltdruck liegen; Rückströmung und Betrieb jenseits des Endpunkts sind Extrapolationen und werden gemeldet","Fan rise Pa":"Druckerhöhung Ventilator Pa","Fan speed %":"Ventilatordrehzahl %","Fan speed is held at the global factor; only nodal demand follows the profile.":"Die Ventilatordrehzahl wird auf dem globalen Faktor gehalten; nur der Knotenverbrauch folgt dem Profil.","Fan total pressure rise":"Gesamtdruckerhöhung Ventilator","Fan Δp Pa":"Ventilator-Δp Pa","Fan, main duct, two tee arms, two dampers and two grilles between ambient and a room.":"Ventilator, Hauptkanal, zwei T-Stück-Arme, zwei Klappen und zwei Luftdurchlässe zwischen Außenluft und einem Raum.","Fan/system curve":"Ventilator-/Anlagenkennlinie","Fan:":"Ventilator:","Fans":"Ventilatoren","Fit the drawing":"Zeichnung einpassen","Fixed gauge total-pressure boundary":"Randbedingung fester Gesamtdruck (Überdruck)","Fixed-pressure boundary":"Randbedingung fester Druck","Fixed-pressure node:  h = p / (rho g)":"Knoten mit festem Druck: h = p / (rho g)","Flow / flow at 100 % opening":"Volumenstrom / Volumenstrom bei 100 % Öffnung","Flow m³/h":"Volumenstrom m³/h","Flow vs current %":"Volumenstrom vs. aktuell %","Flow-following discharge path":"Volumenstrom-folgender Austrittspfad","For every free node the solver enforces airflow continuity. For every component it enforces steady Bernoulli using gauge total pressure + elevation, fan pressure rise and signed total-pressure loss. Edge airflows and free-node gauge total pressures are solved simultaneously with a damped Newton method.":"Für jeden freien Knoten erzwingt der Solver Volumenstromkontinuität. Für jede Komponente erzwingt er stationäres Bernoulli mit Gesamtdruck (Überdruck) + Höhenlage, Ventilator-Druckerhöhung und vorzeichenbehaftetem Gesamtdruckverlust. Kanten-Volumenströme und Gesamtdrücke freier Knoten werden simultan mit einem gedämpften Newton-Verfahren gelöst.","Friction: f = 64/Re for Re <= 2000; Swamee-Jain f = 0.25/[log10(eps/(3.7 Dh) + 5.74/Re^0.9)]^2 for Re >= 4000; smoothstep blend between":"Reibung: f = 64/Re für Re <= 2000; Swamee-Jain f = 0,25/[log10(eps/(3,7 Dh) + 5,74/Re^0,9)]^2 für Re >= 4000; Smoothstep-Übergang dazwischen","Gauge total pressure":"Gesamtdruck (Überdruck)","Gauge total pressure [Pa]":"Gesamtdruck (Überdruck) [Pa]","Global fan-speed factor":"Globaler Ventilatordrehzahlfaktor","Global fan-speed factor must be between 40 and 120%.":"Globaler Ventilatordrehzahlfaktor muss zwischen 40 und 120 % liegen.","Grille":"Luftdurchlass","Grille exponent n between 1 and 3":"Exponent n des Luftdurchlasses zwischen 1 und 3","Grille starvation threshold":"Unterversorgungsschwelle Luftdurchlass","Grille:":"Luftdurchlass:","Grille:  h_loss = (dp_design/(rho g)) (q/q_design)^n":"Luftdurchlass: h_loss = (dp_design/(rho g)) (q/q_design)^n","Grilles":"Luftdurchlässe","H. Cross, \"Analysis of Flow in Networks of Conduits or Conductors\", Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936): the loop-correction method dQ = -sum(h)/sum(|dh/dQ|) used by the second solver.":"H. Cross, \"Analysis of Flow in Networks of Conduits or Conductors\", Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936): das Maschenkorrekturverfahren dQ = -sum(h)/sum(|dh/dQ|), das der zweite Solver verwendet.","Hagen-Poiseuille laminar friction f = 64/Re.":"Hagen-Poiseuille laminare Reibung f = 64/Re.","Height":"Höhe","Hide":"Ausblenden","Highest v m/s":"Höchstes v m/s","Highest velocity":"Höchste Geschwindigkeit","Hour":"Stunde","Hourly VAV multipliers (24 values, comma separated)":"Stündliche VAV-Faktoren (24 Werte, kommagetrennt)","How it is solved":"Wie es gelöst wird","Ignored":"Ignoriert","Inherent c/c₁₀₀":"Inhärent c/c₁₀₀","Initial residual is not finite.":"Anfängliches Residuum ist nicht endlich.","Installed":"Installiert","Installed q/q₁₀₀":"Installiert q/q₁₀₀","Invalid component ID.":"Ungültige Komponenten-ID.","Invalid network file":"Ungültige Netzdatei","Invalid node ID.":"Ungültige Knoten-ID.","It solves a duct network in steady state: you draw nodes and join them with ducts, tee/fitting arms, dampers, grilles and fans, then press Solve network. For every free node the solver enforces airflow continuity, and for every component it enforces steady Bernoulli using gauge total pressure plus elevation, fan pressure rise and signed total-pressure loss. Component airflows and free-node gauge total pressures are solved simultaneously by a damped Newton method.\n\nStart from the example network in the panel above, or pick a tool and click the canvas. Every network needs at least one fixed-pressure node in each connected part.":"Es löst ein Kanalnetz stationär: Sie zeichnen Knoten und verbinden sie mit Kanälen, T-Stück-/Formstück-Armen, Klappen, Luftdurchlässen und Ventilatoren, und klicken dann auf Netz lösen. Für jeden freien Knoten erzwingt der Solver Volumenstromkontinuität, und für jede Komponente erzwingt er stationäres Bernoulli mit Gesamtdruck (Überdruck) plus Höhenlage, Ventilator-Druckerhöhung und vorzeichenbehaftetem Gesamtdruckverlust. Komponenten-Volumenströme und Gesamtdrücke freier Knoten werden simultan mit einem gedämpften Newton-Verfahren gelöst.\n\nBeginnen Sie mit dem Beispielnetz im Feld oben, oder wählen Sie ein Werkzeug und klicken Sie auf die Zeichenfläche. Jedes Netz benötigt in jedem zusammenhängenden Teil mindestens einen Knoten mit festem Druck.","Jacobian is singular":"Jacobi-Matrix ist singulär","Junction losses must be entered as tee/fitting arms with an explicit K; they are not derived from geometry or split ratio.":"Verzweigungsverluste müssen als T-Stück-/Formstück-Arme mit explizitem K eingegeben werden; sie werden nicht aus der Geometrie oder dem Teilungsverhältnis abgeleitet.","Kinematic viscosity":"Kinematische Viskosität","Kinematic viscosity must be positive.":"Kinematische Viskosität muss positiv sein.","Length":"Länge","Linear conductance":"Lineare Leitfähigkeit","Load example network":"Beispielnetz laden","Load factor must be between 0 and 150%.":"Lastfaktor muss zwischen 0 und 150 % liegen.","Load profile cancelled.":"Lastprofil abgebrochen.","Load profile failed:":"Lastprofil fehlgeschlagen:","Loads three same-origin scripts beside the page — site-disclaimer.js, diagram-common.js and diagram-compute.classic.js (the classic build of the shared compute runtime). Nothing else is fetched, no third-party host is contacted, and nothing about the duct network the user draws is transmitted anywhere: every solve and every sweep runs in this browser, on the main thread or in same-origin Blob Workers created from diagram-compute.classic.js.":"Lädt neben der Seite drei Skripte gleichen Ursprungs — site-disclaimer.js, diagram-common.js und diagram-compute.classic.js (den klassischen Build der gemeinsamen Rechen-Laufzeitumgebung). Es wird nichts anderes abgerufen, kein Drittanbieter-Host wird kontaktiert, und nichts über das vom Benutzer gezeichnete Kanalnetz wird irgendwohin übertragen: Jede Berechnung und jeder Sweep läuft in diesem Browser, im Hauptthread oder in Blob-Workern gleichen Ursprungs, erzeugt aus diagram-compute.classic.js.","Local speed":"Lokale Drehzahl","Loss [Pa]":"Verlust [Pa]","Main duct":"Hauptkanal","Max v in swept ducts m/s":"Max. v in durchlaufenen Kanälen m/s","Max v m/s":"Max. v m/s","Minor-loss ΣK":"Einzelverlust ΣK","Model each tee run/branch arm separately with its own K.":"Jeden T-Stück-Durchgangs-/Abzweigarm separat mit eigenem K modellieren.","Model limits":"Modellgrenzen","Monte-Carlo":"Monte-Carlo","Monte-Carlo cancelled.":"Monte-Carlo abgebrochen.","Monte-Carlo failed:":"Monte-Carlo fehlgeschlagen:","Multiplier":"Faktor","Multiplies the local speed of every fan, and enters the fan curve squared through the affinity law dp ~ n². The model is stated for 40 to 120 %; the VAV load profile clamps its own fan tracking to the same range.":"Multipliziert die lokale Drehzahl jedes Ventilators und geht über das Affinitätsgesetz dp ~ n² quadratisch in die Ventilatorkennlinie ein. Das Modell gilt für 40 bis 120 %; das VAV-Lastprofil begrenzt seine eigene Ventilatorsteuerung auf denselben Bereich.","N-1 blockage":"N-1-Blockade","N-1 branch blockage":"N-1-Strangblockade","N-1 branch blockage — grille starvation":"N-1-Strangblockade — Unterversorgung Luftdurchlass","N-1 screen cancelled.":"N-1-Screening abgebrochen.","N-1 screen failed:":"N-1-Screening fehlgeschlagen:","Name":"Name","Network editor":"Netzeditor","Network file":"Netzdatei","Network file is too large (5 MB limit).":"Netzdatei ist zu groß (Grenze 5 MB).","Network file is too large for this editor (max 1000 nodes / 3000 components).":"Netzdatei ist für diesen Editor zu groß (max. 1000 Knoten / 3000 Komponenten).","Network loaded. Press Solve network.":"Netz geladen. Auf Netz lösen klicken.","Newton iterations":"Newton-Iterationen","Newton line search failed.":"Newton-Liniensuche fehlgeschlagen.","No Monte-Carlo sample solved.":"Keine Monte-Carlo-Stichprobe gelöst.","No airflow/return path from fan discharge to a fixed-pressure boundary.":"Kein Volumenstrom-/Rückpfad vom Ventilatoraustritt zu einer Randbedingung mit festem Druck.","No authority sweep generated.":"Kein Autoritäts-Sweep erzeugt.","No curve generated.":"Keine Kennlinie erzeugt.","No pressure profile generated.":"Kein Druckprofil erzeugt.","No sizing combination solved.":"Keine Dimensionierungskombination gelöst.","No sweep has run for this network yet. Each button above solves the network many times; the fan / system curve is now the same kind of sweep.":"Für dieses Netz wurde noch kein Sweep ausgeführt. Jede Schaltfläche oben löst das Netz viele Male; die Ventilator-/Anlagenkennlinie ist jetzt dieselbe Art von Sweep.","No sweep has run for this network yet. Each button in the input column solves the network many times; the fan / system curve is the same kind of sweep.":"Für dieses Netz wurde noch kein Sweep ausgeführt. Jede Schaltfläche in der Eingabespalte löst das Netz viele Male; die Ventilator-/Anlagenkennlinie ist dieselbe Art von Sweep.","Nodal demand":"Knotenverbrauch","Node":"Knoten","Node continuity (free nodes):  SUM_in q - SUM_out q - demand * load_factor = 0":"Knotenkontinuität (freie Knoten): SUM_in q - SUM_out q - demand * load_factor = 0","Node results":"Knotenergebnisse","Node Δp a−b Pa":"Knoten-Δp a−b Pa","Nodes and edges must be arrays.":"Knoten und Kanten müssen Arrays sein.","None":"Keine","Nonlinear unknowns":"Nichtlineare Unbekannte","Not solved":"Nicht gelöst","Not solved.":"Nicht gelöst.","Not solved. Press Solve network.":"Nicht gelöst. Auf Netz lösen klicken.","Nothing generated yet.":"Noch nichts erzeugt.","Nothing is solved, so no result, export or sweep is available until the network validates.":"Es ist nichts gelöst, daher ist kein Ergebnis, Export oder Sweep verfügbar, bis das Netz gültig ist.","Nothing selected":"Nichts ausgewählt","Nothing to cancel; this sweep cannot be interrupted without the shared runtime.":"Nichts abzubrechen; dieser Sweep kann ohne die gemeinsame Laufzeitumgebung nicht unterbrochen werden.","Nothing to sample. Give the duct roughness a sigma above 0 (the network needs ducts with non-zero roughness), or the grilles a sigma, or the dampers an opening sd.":"Nichts zu simulieren. Geben Sie der Kanalrauheit ein Sigma über 0 (das Netz benötigt Kanäle mit Rauheit ungleich null), oder geben Sie den Luftdurchlässen ein Sigma oder den Klappen ein sd für die Öffnung.","One duct solve is always on the main thread and is unchanged from the audited build. Repeated solves — the six sweeps — go to the shared compute runtime, which moves them into Workers only when there are enough cases to pay for a round trip. The badge states which backend last ran, why, and whether a Worker case was checked against the same case solved here.":"Eine einzelne Kanalberechnung läuft immer im Hauptthread und ist gegenüber dem geprüften Build unverändert. Wiederholte Berechnungen — die sechs Sweeps — gehen an die gemeinsame Rechen-Laufzeitumgebung, die sie erst dann in Worker verlagert, wenn genügend Fälle vorliegen, um eine Hin- und Rückfahrt zu rechtfertigen. Das Abzeichen zeigt, welches Backend zuletzt lief, warum, und ob ein Worker-Fall gegen denselben hier gelösten Fall geprüft wurde.","Open duct-network JSON file":"JSON-Datei Kanalnetz öffnen","Open network file":"Netzdatei öffnen","Opening":"Öffnung","Opening %":"Öffnung %","Opening characteristic":"Öffnungskennlinie","P.K. Swamee & A.K. Jain, \"Explicit equations for pipe-flow problems\", ASCE J. Hydraulics Div. 102(HY5) (1976) 657-664: f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, stated for 1e-6 <= eps/D <= 1e-2 and 5e3 <= Re <= 1e8.":"P.K. Swamee & A.K. Jain, \"Explicit equations for pipe-flow problems\", ASCE J. Hydraulics Div. 102(HY5) (1976) 657-664: f = 0,25/[log10(eps/(3,7 D) + 5,74/Re^0,9)]^2, angegeben für 1e-6 <= eps/D <= 1e-2 und 5e3 <= Re <= 1e8.","Pa (gauge)":"Pa (Überdruck)","Partial load 0 to 150 %, global fan speed 40 to 120 %":"Teillast 0 bis 150 %, globale Ventilatordrehzahl 40 bis 120 %","Partial-load demand factor":"Teillast-Verbrauchsfaktor","Positive component airflow follows its arrow.":"Positiver Komponenten-Volumenstrom folgt seinem Pfeil.","Positive demand removes airflow from the network at that node, negative demand injects it. It is scaled by the partial-load factor. A network with no demand at all is driven only by its fans and its boundary pressures.":"Positiver Verbrauch entzieht dem Netz an diesem Knoten Volumenstrom, negativer Verbrauch speist ihn ein. Er wird mit dem Teillastfaktor skaliert. Ein Netz ganz ohne Verbrauch wird allein von seinen Ventilatoren und seinen Randdrücken angetrieben.","Potential [Pa]":"Potential [Pa]","Pressure profile":"Druckprofil","Pressure rise [Pa]":"Druckerhöhung [Pa]","Profile also drives the global fan-speed factor (clamped to 40–120 %)":"Profil steuert auch den globalen Ventilatordrehzahlfaktor (begrenzt auf 40–120 %)","Profile length":"Profillänge","Rank correlation within family":"Rangkorrelation innerhalb der Familie","Rated flow":"Nennvolumenstrom","Rated pressure must be below the shutoff pressure.":"Nenndruck muss unter dem Abschaltdruck liegen.","Received":"Erhalten","Rectangular":"Rechteckig","Rectangular section:  A = W H,  Dh = 2 W H/(W + H);  circular:  A = pi D^2/4,  Dh = D":"Rechteckquerschnitt: A = W H, Dh = 2 W H/(W + H); rund: A = pi D^2/4, Dh = D","Reset":"Zurücksetzen","Rise P5 Pa":"Erhöhung P5 Pa","Room / ambient":"Raum / Umgebung","Roughness":"Rauheit","Run duct sizing":"Kanaldimensionierung ausführen","Run load profile":"Lastprofil ausführen","Samples":"Stichproben","Save network file":"Netzdatei speichern","Save network file writes the drawing, the air state and the load factors as a tools.petrov.re/duct-network/v1 JSON document, and Open network file reads one back. This is the editor document, not the calculation record: the shared bar’s JSON export is the record and cannot be loaded back into the editor, and the shared bar’s Copy link carries the same document inside a permalink.":"Netzdatei speichern schreibt die Zeichnung, den Luftzustand und die Lastfaktoren als tools.petrov.re/duct-network/v1-JSON-Dokument, und Netzdatei öffnen liest eines wieder ein. Dies ist das Editor-Dokument, nicht der Berechnungsdatensatz: Der JSON-Export der gemeinsamen Leiste ist der Datensatz und kann nicht in den Editor zurückgeladen werden, und Link kopieren der gemeinsamen Leiste trägt dasselbe Dokument innerhalb eines Permalinks.","Scaled residual":"Skaliertes Residuum","Screening limits":"Screening-Grenzwerte","Seasonal swing (8760 h only)":"Jahresgang (nur 8760 h)","Section":"Querschnitt","Seed":"Startwert","Select":"Auswählen","Select a damper first":"Zuerst eine Klappe auswählen","Select a damper, then run the authority sweep.":"Klappe auswählen und dann den Autoritäts-Sweep ausführen.","Select a fan first":"Zuerst einen Ventilator auswählen","Select a fan on the drawing first.":"Zuerst einen Ventilator in der Zeichnung auswählen.","Select drags nodes and picks an element to edit. Node adds a node where you click on empty canvas. The five component tools each want two clicks: the start node, then the end node. Positive component airflow follows the arrow, so the direction you draw in is the sign convention for that component.":"Auswählen zieht Knoten und wählt ein Element zum Bearbeiten. Knoten fügt einen Knoten dort ein, wo Sie auf die leere Zeichenfläche klicken. Die fünf Komponentenwerkzeuge verlangen je zwei Klicks: den Startknoten, dann den Endknoten. Positiver Komponenten-Volumenstrom folgt dem Pfeil, daher ist die Richtung, in der Sie zeichnen, die Vorzeichenkonvention für diese Komponente.","Selection":"Auswahl","Set target flow on at least one damper":"Zielvolumenstrom für mindestens eine Klappe festlegen","Shared compute runtime: starting…":"Gemeinsame Rechen-Laufzeitumgebung: wird gestartet…","Show":"Anzeigen","Shutoff total pressure":"Abschalt-Totaldruck","Sizes mm":"Maße mm","Solve network":"Netz lösen","Solve the network first.":"Zuerst das Netz lösen.","Solved simultaneously for all component airflows and free-node gauge total pressures by a damped Newton method with a numerical Jacobian":"Simultan gelöst für alle Komponenten-Volumenströme und Gesamtdrücke freier Knoten mit einem gedämpften Newton-Verfahren mit numerischer Jacobi-Matrix","Solver failed:":"Solver fehlgeschlagen:","Specific air power W/(m³/s)":"Spezifische Luftleistung W/(m³/s)","Starved grilles":"Unterversorgte Luftdurchlässe","Total pressure rise at rated flow":"Totaldruckerhöhung bei Nennvolumenstrom","Steady state, incompressible, single phase; constant air properties":"Stationär, inkompressibel, einphasig; konstante Luftstoffwerte","Steady-state incompressible airflow networks":"Stationäre, inkompressible Luftströmungsnetze","Supply junction":"Zuluftknoten","Swamee-Jain is published for 1e-6 <= eps/Dh <= 1e-2 and 5e3 <= Re <= 1e8; it differs from the Colebrook root by up to about 3 % over that range":"Swamee-Jain ist veröffentlicht für 1e-6 <= eps/Dh <= 1e-2 und 5e3 <= Re <= 1e8; sie weicht über diesen Bereich um bis zu etwa 3 % von der Colebrook-Wurzel ab","Sweep cancelled.":"Sweep abgebrochen.","Swept surface m²":"Durchlaufene Mantelfläche m²","System curve requires positive solved airflow through the selected fan.":"Anlagenkennlinie erfordert einen positiv gelösten Volumenstrom durch den gewählten Ventilator.","THE ACCURACY BOUND IS VOID FOR AT LEAST ONE TALLY.":"DIE GENAUIGKEITSSCHRANKE IST FÜR MINDESTENS EINE AUSWERTUNG UNGÜLTIG.","Tee / fitting":"T-Stück / Formstück","Tee / fitting arm:":"T-Stück-/Formstück-Arm:","Tee / fitting arm:  h_loss = K v^2/(2 g) on that arm only, no friction term":"T-Stück-/Formstück-Arm: h_loss = K v^2/(2 g) nur auf diesem Arm, kein Reibungsanteil","Tee and fitting arms":"T-Stück- und Formstück-Arme","Tee branch A":"T-Stück Abzweig A","Tee run B":"T-Stück Durchgang B","Tee/fitting":"T-Stück/Formstück","The 24 hourly multipliers scale nodal demand hour by hour, optionally driving the global fan-speed factor with them, and the fan air power dp·Q is integrated over the period. This is air power: fan total efficiency, motor and drive losses and SFP are not part of this model, so no kW/(m³/s) figure is claimed.":"Die 24 Stundenfaktoren skalieren den Knotenverbrauch Stunde für Stunde, optional steuern sie damit auch den globalen Ventilatordrehzahlfaktor, und die Ventilator-Luftleistung dp·Q wird über den Zeitraum integriert. Dies ist Luftleistung: Ventilator-Gesamtwirkungsgrad, Motor- und Antriebsverluste sowie SFP sind nicht Teil dieses Modells, daher wird kein kW/(m³/s)-Wert behauptet.","The Monte-Carlo sweep needs diagram-compute.classic.js — its Latin-hypercube design, its rank-correlation transform and its mergeable quantile tallies are the runtime’s, and this build will not swap in a different sampler and present it as the same experiment.":"Der Monte-Carlo-Sweep benötigt diagram-compute.classic.js — sein Latin-Hypercube-Design, seine Rangkorrelationstransformation und seine zusammenführbaren Quantilauswertungen gehören zur Laufzeitumgebung, und dieser Build wird keinen anderen Sampler einsetzen und ihn als dasselbe Experiment ausgeben.","The N-1 screen blocks ducts, tee arms and dampers one at a time; this network has none of them.":"Das N-1-Screening blockiert Kanäle, T-Stück-Arme und Klappen einzeln nacheinander; dieses Netz besitzt keine davon.","The fan/system curve holds the airflow through the selected fan at each of 33 values and solves the whole network for each one, so the system curve is the network’s own resistance, not a fitted parabola. The total-pressure profile follows one representative path from the fan discharge to a fixed-pressure boundary. Select a fan on the drawing first.":"Die Ventilator-/Anlagenkennlinie hält den Volumenstrom durch den gewählten Ventilator bei jedem von 33 Werten fest und löst für jeden das gesamte Netz, sodass die Anlagenkennlinie der eigene Widerstand des Netzes ist, keine angepasste Parabel. Das Gesamtdruckprofil folgt einem repräsentativen Pfad vom Ventilatoraustritt zu einer Randbedingung mit festem Druck. Zuerst einen Ventilator in der Zeichnung auswählen.","The hardest-working ducts are re-sectioned to circular ducts from the EN 1506 / ISO 6580 nominal catalogue and every combination is solved. The ranking is specific air power — air power per m³/s actually delivered — because raw dp·Q rewards choking the duct: the fan sits on a curve, so a smaller duct moves the operating point back and the product falls while the building gets less air.":"Die am stärksten belasteten Kanäle werden auf Rundkanäle aus dem Nennweiten-Katalog EN 1506 / ISO 6580 umgerechnet, und jede Kombination wird gelöst. Die Reihung erfolgt nach spezifischer Luftleistung — Luftleistung je tatsächlich gelieferten m³/s — weil das rohe dp·Q das Drosseln des Kanals belohnt: Der Ventilator sitzt auf einer Kennlinie, sodass ein kleinerer Kanal den Betriebspunkt zurückverschiebt und das Produkt sinkt, während das Gebäude weniger Luft erhält.","The hourly VAV profile needs exactly 24 finite, non-negative multipliers.":"Das stündliche VAV-Profil benötigt genau 24 endliche, nichtnegative Faktoren.","The intact-network baseline case did not solve, so nothing can be compared against it.":"Der Referenzfall des intakten Netzes wurde nicht gelöst, daher kann nichts damit verglichen werden.","The load profile reports fan energy; this network has no fan.":"Das Lastprofil berichtet Ventilatorenergie; dieses Netz hat keinen Ventilator.","The network document":"Das Netzdokument","The profile also drives the global fan-speed factor, clamped to the tool’s own 40–120 % range.":"Das Profil steuert auch den globalen Ventilatordrehzahlfaktor, begrenzt auf den eigenen Bereich des Werkzeugs von 40–120 %.","The selected damper is swept from 10 % to 100 % open in 1 % steps, each step a full network solve, and its installed characteristic is compared with its own inherent law. The reported authority is the ratio dp(100 %)/dp(10 %) — an upper bound on the usual open/closed authority, because a fully shut damper makes the quadratic branch equation singular in this formulation.":"Die gewählte Klappe wird von 10 % bis 100 % Öffnung in Schritten von 1 % durchfahren, jeder Schritt eine vollständige Netzberechnung, und ihre installierte Kennlinie wird mit ihrer eigenen inhärenten Kennlinie verglichen. Die berichtete Autorität ist das Verhältnis dp(100 %)/dp(10 %) — eine obere Schranke für die übliche Auf/Zu-Autorität, weil eine vollständig geschlossene Klappe die quadratische Stranggleichung in dieser Formulierung singulär macht.","The selection inspector":"Der Auswahl-Inspektor","The shared interface layer (diagram-ui.js) did not load. Every input, the model, the drawing, the sweeps and every export still work; the page falls back to one plain column.":"Die gemeinsame Oberflächenschicht (diagram-ui.js) wurde nicht geladen. Jede Eingabe, das Modell, die Zeichnung, die Sweeps und jeder Export funktionieren weiterhin; die Seite fällt auf eine einfache Spalte zurück.","The velocity limit is the value the sweeps flag against; the starvation threshold is how far a grille’s airflow may fall below its intact-network value in the N-1 screen before that contingency counts as starving a grille.":"Die Geschwindigkeitsgrenze ist der Wert, gegen den die Sweeps prüfen; die Unterversorgungsschwelle ist, wie weit der Volumenstrom eines Luftdurchlasses im N-1-Screening unter seinen Wert im intakten Netz fallen darf, bevor dieses Ausfallszenario als Unterversorgung eines Luftdurchlasses zählt.","There is no airflow through this damper at 100 % opening, so an installed characteristic has no meaning.":"Bei 100 % Öffnung fließt kein Volumenstrom durch diese Klappe, daher hat eine installierte Kennlinie keine Bedeutung.","This network has no ducts to size.":"Dieses Netz hat keine Kanäle zu dimensionieren.","This sweep needs diagram-compute.classic.js: its \"":"Dieser Sweep benötigt diagram-compute.classic.js: sein \"","Topological fallback discharge path":"Topologischer Ersatz-Austrittspfad","Total + (ρ−ρo)gz Pa":"Gesamt + (ρ−ρo)gz Pa","Total loss signed Pa":"Vorzeichenbehafteter Gesamtverlust Pa","Total p Pa(g)":"Gesamt p Pa(Ü)","Total-pressure profile":"Gesamtdruckprofil","Two-branch supply system":"Zuluftsystem mit zwei Strängen","Type":"Typ","Unsupported duct-network schema version":"Nicht unterstützte Schemaversion des Kanalnetzes","Use 0 Pa for room/outdoor ambient. Demand is scaled by the global load factor; negative demand injects air.":"0 Pa für Raum/Außenluft verwenden. Der Verbrauch wird mit dem globalen Lastfaktor skaliert; negativer Verbrauch speist Luft ein.","VAV load profile":"VAV-Lastprofil","VAV load profile: every node in this network has zero demand and the profile multiplier scales nodal demands only, so every hour is the same operating point and the energy figure is one point multiplied by the number of hours.":"VAV-Lastprofil: Jeder Knoten in diesem Netz hat Verbrauch null, und der Profilfaktor skaliert nur den Knotenverbrauch, daher ist jede Stunde derselbe Betriebspunkt und der Energiewert ist ein Punkt multipliziert mit der Anzahl der Stunden.","Velocity and velocity pressure":"Geschwindigkeit und Geschwindigkeitsdruck","Velocity limit":"Geschwindigkeitsgrenze","Velocity m/s":"Geschwindigkeit m/s","Velocity p Pa":"Geschwindigkeitsdruck p Pa","W (air)":"W (Luft)","W per m3/s delivered":"W je gelieferten m3/s","What this tool does":"Was dieses Werkzeug tut","Whatever is selected on the drawing is edited here. Every edit throws the current solution away — the results dim and say so — because the answer belonged to the network as it was.":"Was auch immer in der Zeichnung ausgewählt ist, wird hier bearbeitet. Jede Bearbeitung verwirft die aktuelle Lösung — die Ergebnisse werden abgeblendet dargestellt und weisen darauf hin — weil die Antwort zum Netz gehörte, wie es war.","Where the arithmetic runs":"Wo die Berechnung läuft","Width":"Breite","Worst drop %":"Schlechtester Abfall %","a Worker case was checked against the same case rs.","diagram-compute.classic.js did not load; sweeps run on the main thread and the Monte-Carlo sweep is unavailable because its Latin-hypercube design and its quantile tallies live in the runtime":"diagram-compute.classic.js wurde nicht geladen; Sweeps laufen auf dem Hauptthread, und der Monte-Carlo-Sweep ist nicht verfügbar, weil sein Latin-Hypercube-Design und seine Quantilauswertungen in der Laufzeitumgebung liegen","diagram-compute.classic.js is absent, so the sweep ran as one blocking main-thread loop, exactly as v1 did":"diagram-compute.classic.js fehlt, daher lief der Sweep als eine blockierende Hauptthread-Schleife, genau wie bei v1","dp = dp_design (Q/Q_design)^n, with the exponent n between 1 and 3 — 2 is the usual quadratic terminal. A grille here is a duct resistance only: no throw, no noise, no induction.":"dp = dp_design (Q/Q_design)^n, mit dem Exponenten n zwischen 1 und 3 — 2 ist der übliche quadratische Endwert. Ein Luftdurchlass ist hier nur ein Kanalwiderstand: keine Wurfweite, kein Schall, keine Induktion.","duct network: the interface layer failed to start":"Kanalnetz: die Oberflächenschicht konnte nicht starten","equal %":"gleich %","equal percentage":"gleichprozentig","every case was evaluated in index order on one thread, each from a cold start":"jeder Fall wurde in Indexreihenfolge auf einem Thread ausgewertet, jeder aus einem Kaltstart","explicit approximation":"explizite Näherung","fan rated point":"Nennpunkt Ventilator","gate then bounds the result at roughly 1e-7 relative.":"Schwelle begrenzt das Ergebnis dann auf etwa 1e-7 relativ.","grille design point":"Auslegungspunkt Luftdurchlass","halts at a scaled residual of 2e-9, worth about 1e-7 relative) rather than by the":"stoppt bei einem skalierten Residuum von 2e-9, das etwa 1e-7 relativ entspricht) statt durch die","kW (air)":"kW (Luft)","kWh (air power dp*Q; no fan, motor or drive efficiency)":"kWh (Luftleistung dp*Q; ohne Ventilator-, Motor- oder Antriebswirkungsgrad)","laminar fric s one rated point; reverse flow and operation beyond zero-head runout are extrapolations and are warned. Automatic balancing is an iterative damper-opening heuristic and cannot guarantee coupled or infeasible targets. The total-pressure profile follows one representative airflow path. Generic junction nodes have no unique cross-section, so static pressure is not recovered there; component velocity and velocity pressure are reported separately. Tee/fitting K values are inputs; they are not derived from ASHRAE/Idelchik geometry or split ratios. The dense browser solver refuses models above 600 nonlinear unknowns. No duct leakage, compressibility, acoustics, smoke transport, fan-efficiency map, stall/surge model, or transient control model is included.":"Auditierter Build 2026-08-09. Stationär, inkompressibel und einphasig. Stoffwerte sind konstant. Luftdurchlässe sind reine Kanalwiderstände. Ventilatorkennlinien beruhen auf dem Nullförderdruck und einem Nennpunkt; Rückströmung und Betrieb jenseits des Nullförderhöhen-Endpunkts sind Extrapolationen und werden gemeldet. Der automatische Abgleich ist eine iterative Heuristik für die Klappenöffnung und kann gekoppelte oder unerreichbare Ziele nicht garantieren. Das Gesamtdruckprofil folgt einem repräsentativen Strömungsweg. Allgemeine Verzweigungsknoten haben keinen eindeutigen Querschnitt, daher wird dort kein statischer Druck bestimmt; Geschwindigkeit und dynamischer Druck werden je Komponente angegeben. K-Werte von T-Stücken und Formstücken sind Eingaben; sie werden nicht aus ASHRAE/Idelchik-Geometrie oder Aufteilungsverhältnissen abgeleitet. Der dichte Browser-Löser lehnt Modelle mit mehr als 600 nichtlinearen Unbekannten ab. Kanalleckage, Kompressibilität, Akustik, Rauchtransport, Ventilator-Wirkungsgradkennfeld, Pump-/Abrissmodell und transiente Regelung sind nicht enthalten."};
const siteLang=()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q&&String(q).slice(0,2).toLowerCase()==='de')return'de'}catch(e){}try{if(localStorage.getItem('diagram_site_lang')==='de'||localStorage.getItem('diagram_lang')==='de')return'de'}catch(e){}return String(window.__diagramLang||'').slice(0,2).toLowerCase()};

const attrs=['placeholder','title','aria-label','alt'];
function tr(s){if(s==null)return s;const x=String(s);if(Object.prototype.hasOwnProperty.call(DE,x))return DE[x];const a=x.match(/^\s*/)[0],b=x.match(/\s*$/)[0],t=x.trim();if(Object.prototype.hasOwnProperty.call(DE,t))return a+DE[t]+b;const pz=t&&window.__dnPatterns?window.__dnPatterns.translate('de',t,DE):null;if(pz!=null)return a+pz+b;const lw=window.DiagramUI&&DiagramUI.current&&typeof DiagramUI.current.t==='function'?DiagramUI.current.t('learn'):null;if(lw&&t.indexOf(lw+': ')===0){const k=t.slice(lw.length+2);if(Object.prototype.hasOwnProperty.call(DE,k))return a+lw+': '+DE[k]+b}return x}
function node(n){if(!n)return;if(n.nodeType===3){const p=n.parentElement;if(p&&!/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(p.tagName)){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}return}if(n.nodeType!==1)return;if(/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(n.tagName))return;for(const a of attrs)if(n.hasAttribute(a)){const v=n.getAttribute(a),w=tr(v);if(w!==v)n.setAttribute(a,w)}if(n.tagName==='INPUT'&&/^(button|submit|reset)$/i.test(n.type||'')){const v=n.value,w=tr(v);if(w!==v)n.value=w}const tw=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let q;while(q=tw.nextNode())node(q);for(const e of n.querySelectorAll('*'))for(const a of attrs)if(e.hasAttribute(a)){const v=e.getAttribute(a),w=tr(v);if(w!==v)e.setAttribute(a,w)}}
const run=()=>{node(document.body);const tt=document.querySelector('title');if(tt)node(tt)};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')node(m.target);else if(m.type==='attributes'){const el=m.target,v=el.getAttribute(m.attributeName),w=tr(v);if(v!=null&&w!==v)el.setAttribute(m.attributeName,w)}else for(const n of m.addedNodes)node(n)}}).observe(document.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:attrs});
